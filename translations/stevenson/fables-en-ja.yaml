      SOMETHING IN IT
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 232
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9511
        "line_end": 9513
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9511-9513"
    "translation_ja": "十六　何かはある"
    "translation_status": "reviewed"
  - "id": "f16-001"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The natives told him many tales. In particular, they warned him of the house of yellow reeds tied with black sinnet, how any one who touched it became instantly the prey of Akaaenga, and was handed on to him by Miru the ruddy, and hocussed with the kava of the dead, and baked in the ovens and eaten by the eaters of the dead.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 233
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9516
        "line_end": 9520
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9516-9520"
    "translation_ja": |-
      島の人々は彼にいろいろな話をした。とりわけ、黄色い葦を黒い椰子縄で結わえた家には気をつけろと教えた。それに触れた者はたちまちアカアエンガの餌食となり、赤ら顔のミルから彼の手に引き渡され、死者のカヴァを盛られて正体をなくし、かまどで焼かれ、死者を食らう者どもに食われるのだという。
    "translation_status": "reviewed"
  - "id": "f16-002"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"There is nothing in it,\" said the missionary."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 234
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9522
        "line_end": 9522
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9522-9522"
    "translation_ja": "「何もありはしない」と宣教師は言った。"
    "translation_status": "reviewed"
  - "id": "f16-003"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      There was a bay upon that island, a very fair bay to look upon; but, by the native saying, it was death to bathe there. "There is nothing in that," said the missionary; and he came to the bay, and went swimming. Presently an eddy took him and bore him towards the reef. "Oho!" thought the missionary, "it seems there is something in it after all." And he swam the harder, but the eddy carried him away. "I do not care about this eddy," said the missionary; and even as he said it, he was aware of a house raised on piles above the sea; it was built of yellow reeds, one reed joined with another, and the whole bound with black sinnet; a ladder led to the door, and all about the house hung calabashes. He had never seen such a house, nor yet such calabashes; and the eddy set for the ladder. "This is singular," said the missionary, "but there can be nothing in it." And he laid hold of the ladder and went up. It was a fine house; but there was no man there; and when the missionary looked back he saw no island, only the heaving of the sea. "It is strange about the island," said the missionary, "but who's afraid? my stories are the true ones." And he laid hold of a calabash, for he was one that loved curiosities. Now he had no sooner laid hand upon the calabash than that which he handled, and that which he saw and stood on, burst like a bubble and was gone; and night closed upon him, and the waters, and the meshes of the net; and he wallowed there like a fish.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 235
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9524
        "line_end": 9544
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9524-9544"
    "translation_ja": |-
      その島には湾があった。見るからに美しい湾だが、島の言い伝えでは泳ぎに入ると死ぬのだった。「何もありはしない」と宣教師は言い、湾へ来て泳ぎ始めた。やがて渦の流れが彼を捕らえ、暗礁のほうへ押し流した。「おやおや」と宣教師は思った。「やっぱり何かはあるらしいぞ」いっそう力をこめて泳いだが、渦は彼を連れ去った。「この渦はどうも気に入らん」と言っているうちに、海の上に杭を立てて建てた家が目に入った。黄色い葦を一本ずつつなぎ合わせ、全体を黒い椰子縄で結わえてある。戸口には梯子が掛かり、家のぐるりにはひょうたんが吊るしてあった。こんな家もこんなひょうたんも、彼は見たことがなかった。渦の流れは梯子へ向かった。「妙なことだ」と宣教師は言った。「しかし何もあるはずはない」そこで梯子をつかんで登った。立派な家だったが、中には人影もなく、振り返ると、島は見えず、うねる海があるだけだった。「島が見えんとは不思議だが」と宣教師は言った。「だれが恐れるものか。本当の話は私のほうなのだ」珍しい品に目がない男だったので、ひょうたんの一つに手を掛けた。触れるやいなや、手にしたものも、目に見えるものも、立っていた足場も、泡のようにはじけて消えた。闇が、水が、網の目が、まわりからぴたりと閉じ、彼は魚のようにのたうった。
    "translation_status": "reviewed"
  - "id": "f16-004"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "A body would think there was something in this," said the missionary. "But if these tales are true, I wonder what about my tales!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 236
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9546
        "line_end": 9547
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9546-9547"
    "translation_ja": "「これでは何かあると思うのも無理はない」と宣教師は言った。「だがもしあの話が本当なら、私の話はいったいどうなる！」"
    "translation_status": "reviewed"
  - "id": "f16-005"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now the flaming of Akaaenga's torch drew near in the night; and the misshapen hands groped in the meshes of the net; and they took the missionary between the finger and the thumb, and bore him dripping in the night and silence to the place of the ovens of Miru. And there was Miru, ruddy in the glow of the ovens; and there sat her four daughters, and made the kava of the dead; and there sat the comers out of the islands of the living, dripping and lamenting.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 237
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9549
        "line_end": 9555
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9549-9555"
    "translation_ja": |-
      闇の中にアカアエンガの松明の炎が迫った。形のゆがんだ両手が網の目をまさぐり、人差し指と親指で宣教師をつまんだ。水を滴らせたまま、彼は夜と沈黙の中をミルのかまどのあるところまで運ばれた。そこにはかまどの照り返しに赤く輝くミルがおり、その四人の娘たちが座って死者のカヴァを作っていた。またそこには、生者の島々からやって来た者たちが、水を滴らせて座り、嘆いていた。
    "translation_status": "reviewed"
  - "id": "f16-006"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      This was a dread place to reach for any of the sons of men. But of all who ever came there, the missionary was the most concerned; and, to make things worse, the person next him was a convert of his own.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 238
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9557
        "line_end": 9559
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9557-9559"
    "translation_ja": "人の子ならだれにとっても、行き着くのが恐ろしい場所だった。しかしこれまでそこへ来たどの者よりも宣教師は困り果てていた。悪いことは重なるもので、隣の席には自分が改宗させた男がいた。"
    "translation_status": "reviewed"
  - "id": "f16-007"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Aha," said the convert, "so you are here like your neighbours? And how about all your stories?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 239
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9561
        "line_end": 9562
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9561-9562"
    "translation_ja": "「やあ」とその信者は言った。「あんたもご近所のみなさんと同じところに来ましたね。それで、あんたのお話の数々はどうなるんです？」"
    "translation_status": "reviewed"
  - "id": "f16-008"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It seems,\" said the missionary, with bursting tears, \"that there was nothing in them.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 240
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9564
        "line_end": 9565
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9564-9565"
    "translation_ja": "「どうやら」と宣教師は涙がどっとあふれるのをこらえきれずに言った。「何もありはしなかったらしい」"
    "translation_status": "reviewed"
  - "id": "f16-009"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      By this the kava of the dead was ready, and the daughters of Miru began to intone in the old manner of singing: "Gone are the green islands and the bright sea, the sun and the moon and the forty million stars, and life and love and hope. Henceforth is no more, only to sit in the night and silence, and see your friends devoured; for life is a deceit, and the bandage is taken from your eyes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 241
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9567
        "line_end": 9572
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9567-9572"
    "translation_ja": |-
      そうするうちに死者のカヴァができあがり、ミルの娘たちは昔ながらの節回しで唱い始めた。「緑の島々も輝く海も、太陽も月も四千万の星も、命も愛も望みも去った。これから先はただ闇と沈黙に座して、おのが友がむさぼり食われるのを見るのみ。生は欺きであり、そなたの目からは覆いが取れたのだから」
    "translation_status": "reviewed"
  - "id": "f16-010"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now when the singing was done, one of the daughters came with the bowl. Desire of that kava rose in the missionary's bosom; he lusted for it like a swimmer for the land, or a bridegroom for his bride; and he reached out his hand, and took the bowl, and would have drunk. And then he remembered, and put it back.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 242
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9574
        "line_end": 9578
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9574-9578"
    "translation_ja": |-
      歌が終わると、娘の一人が椀を手に来た。宣教師の胸に、カヴァを飲みたい気持ちがむらむらと湧いた。泳ぐ者が陸に、新郎が花嫁に焦がれるように、それを渇望した。手を伸ばして椀を取り、飲もうとした。そして思い出し、椀を戻した。
    "translation_status": "reviewed"
  - "id": "f16-011"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Drink!" sang the daughter of Miru. "There is no kava like the kava of the dead, and to drink of it once is the reward of living."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 243
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9580
        "line_end": 9581
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9580-9581"
    "translation_ja": "「お飲み！」とミルの娘は唱った。「死者のカヴァにまさるカヴァはない。ひとたびこれを口にする、それこそ生きてきた報いなのだ」"
    "translation_status": "reviewed"
  - "id": "f16-012"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I thank you. It smells excellent," said the missionary. "But I am a blue-ribbon man myself; and though I am aware there is a difference of opinion even in our own confession, I have always held kava to be excluded."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 244
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9583
        "line_end": 9586
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9583-9586"
    "translation_ja": |-
      「ありがとう。実によい香りだ」と宣教師。「しかし私は禁酒の青リボンをつけた者でしてね。私どもの教派でも意見が分かれることは存じていますが、カヴァも飲んではいけないものに含まれると、私は一貫して考えてきたのです」
    "translation_status": "reviewed"
  - "id": "f16-013"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "What!" cried the convert. "Are you going to respect a taboo at a time like this? And you were always so opposed to taboos when you were alive!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 245
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9588
        "line_end": 9590
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9588-9590"
    "translation_ja": "「なんですって！」と信者は叫んだ。「こんなときに禁忌を守るんですか？　生きておられたときには、しょっちゅう禁忌に反対していらしたくせに！」"
    "translation_status": "reviewed"
  - "id": "f16-014"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"To other people's,\" said the missionary. \"Never to my own.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 246
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9592
        "line_end": 9592
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9592-9592"
    "translation_ja": "「人の禁忌にはね」と宣教師。「自分のには一度も反対したことはない」"
    "translation_status": "reviewed"
  - "id": "f16-015"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"But yours have all proved wrong,\" said the convert."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 247
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9594
        "line_end": 9594
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9594-9594"
    "translation_ja": "「けれど、あんたのはみんな間違いと分かったでしょう」と信者。"
    "translation_status": "reviewed"
  - "id": "f16-016"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "It looks like it," said the missionary, "and I can't help that. No reason why I should break my word."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 248
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9596
        "line_end": 9597
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9596-9597"
    "translation_ja": "「そうらしい」と宣教師。「そいつは私にはどうしようもない。だからといって、約束を破る理由にはならない」"
    "translation_status": "reviewed"
  - "id": "f16-017"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I never heard the like of this!" cried the daughter of Miru. "Pray, what do you expect to gain?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 249
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9599
        "line_end": 9600
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9599-9600"
    "translation_ja": "「こんなのは聞いたことがない！」とミルの娘は叫んだ。「いったい何が得られると思っているの？」"
    "translation_status": "reviewed"
  - "id": "f16-018"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "That is not the point," said the missionary. "I took this pledge for others, I am not going to break it for myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 250
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9602
        "line_end": 9603
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9602-9603"
    "translation_ja": "「そこが肝心なのではない」と宣教師。「ひとのために立てた誓いだ。自分のために破るつもりはない」"
    "translation_status": "reviewed"
  - "id": "f16-019"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The daughter of Miru was puzzled; she came and told her mother, and Miru was vexed; and they went and told Akaaenga.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 251
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9605
        "line_end": 9606
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9605-9606"
    "translation_ja": "ミルの娘は面食らい、母のところに行って話した。ミルも困り、みなでアカアエンガに話しに行った。"
    "translation_status": "reviewed"
  - "id": "f16-020"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I don't know what to do about this," said Akaaenga; and he came and reasoned with the missionary.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 252
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9608
        "line_end": 9609
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9608-9609"
    "translation_ja": "「こういう場合どうすればいいか分からん」とアカアエンガは言って、自ら宣教師を説き伏せに来た。"
    "translation_status": "reviewed"
  - "id": "f16-021"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "But there is such a thing as right and wrong," said the missionary; "and your ovens cannot alter that."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 253
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9611
        "line_end": 9612
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9611-9612"
    "translation_ja": "「だが、正しいことと間違ったことの区別は、あるのです」と宣教師。「あなたのかまどだって、そこを変えられはしません」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 11
          "end": 13
          "exact": "is"
      - "side": "translation"
        "kind": "emphasis"
        "span":
          "start": 21
          "end": 23
          "exact": "ある"
  - "id": "f16-022"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Give the kava to the rest," said Akaaenga to the daughters of Miru. "I must get rid of this sea-lawyer instantly, or worse will come of it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 254
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9614
        "line_end": 9615
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9614-9615"
    "translation_ja": "「カヴァはほかの者たちにやれ」とアカアエンガはミルの娘たちに言った。「この海の理屈屋は即刻追い払わねば、もっと厄介なことになる」"
    "translation_status": "reviewed"
  - "id": "f16-023"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The next moment the missionary came up in the midst of the sea, and there before him were the palm-trees of the island. He swam to the shore gladly, and landed. Much matter of thought was in that missionary's mind.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 255
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9617
        "line_end": 9620
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9617-9620"
    "translation_ja": "次の瞬間、宣教師は海のただ中に浮かび上がった。目の前には島の椰子の木々があった。喜び勇んで岸へ泳ぎ着き、陸へ上がった。宣教師の胸には考えねばならないことがたくさんあった。"
    "translation_status": "reviewed"
  - "id": "f16-024"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I seem to have been misinformed upon some points," said he. "Perhaps there is not much in it, as I supposed; but there is something in it after all. Let me be glad of that."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 256
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9622
        "line_end": 9624
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9622-9624"
    "translation_ja": "「いくつかの点では、私は誤って教えられてきたらしい」と彼は言った。「私が思っていたほど多くのものは、そこにはないのかもしれない。だが、それでも何かはある。そのことを喜ぶとしよう」"
    "translation_status": "reviewed"
  - "id": "f16-025"
    "section_id": "fable-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he rang the bell for service."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 257
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9626
        "line_end": 9626
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9626-9626"
    "translation_ja": "そして彼は礼拝の鐘を鳴らした。"
    "translation_status": "reviewed"
  - "id": "f16-026"
    "section_id": "fable-16"
    "kind": "heading"
    "origin": "source"
    "source_text": "MORAL"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 258
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9628
        "line_end": 9628
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9628-9628"
    "translation_ja": "教訓"
    "translation_status": "reviewed"
  - "id": "f16-027"
    "section_id": "fable-16"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The sticks break, the stones crumble,
      The eternal altars tilt and tumble,
      Sanctions and tales dislimn like mist
      About the amazed evangelist.
      He stands unshook from age to youth
      Upon one pin-point of the truth.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 259
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9630
        "line_end": 9635
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9630-9635"
    "translation_ja": |-
      木は折れ、石は崩れ、
      永遠の祭壇は傾いて倒れる。
      戒めも物語も、おどろく宣教師を
      取り巻いては霧となって消える。
      老いにも若きにも揺るがず、彼は立つ、
      針の先ほどのひとつの真実に。
    "translation_status": "reviewed"
  - "id": "f17-000"
    "section_id": "fable-17"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XVII
      FAITH, HALF-FAITH, AND NO FAITH AT ALL
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 260
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9640
        "line_end": 9642
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9640-9642"
    "translation_ja": "十七　信仰、半信、信仰なし"
    "translation_status": "reviewed"
  - "id": "f17-001"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      In the ancient days there went three men upon pilgrimage; one was a priest, and one was a virtuous person, and the third was an old rover with his axe.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 261
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9645
        "line_end": 9647
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9645-9647"
    "translation_ja": "いにしえのこと、三人の男が巡礼に出た。一人は神官、一人は徳のあるお方、三人目は斧を持った年老いた海賊だった。"
    "translation_status": "reviewed"
  - "id": "f17-002"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As they went, the priest spoke about the grounds of faith."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 262
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9649
        "line_end": 9649
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9649-9649"
    "translation_ja": "道を行きながら、神官は信仰の根拠について語った。"
    "translation_status": "reviewed"
  - "id": "f17-003"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"We find the proofs of our religion in the works of nature,\" said he, and beat his breast."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 263
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9651
        "line_end": 9652
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9651-9652"
    "translation_ja": "「われわれの宗教の正しさを証明するものは、自然の営みのうちに見いだされる」と言い、胸を打った。"
    "translation_status": "reviewed"
  - "id": "f17-004"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"That is true,\" said the virtuous person."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 264
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9654
        "line_end": 9654
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9654-9654"
    "translation_ja": "「そのとおりだ」と徳のあるお方は言った。"
    "translation_status": "reviewed"
  - "id": "f17-005"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "The peacock has a scrannel voice," said the priest, "as has been laid down always in our books. How cheering!" he cried, in a voice like one that wept. "How comforting!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 265
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9656
        "line_end": 9658
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9656-9658"
    "translation_ja": "「孔雀の声はか細く耳障りだ。昔からわれわれの書物に書いてあるとおりに」と神官。「なんと心強いことか！」と彼は、泣く人のような声で叫んだ。「なんという慰めか！」"
    "translation_status": "reviewed"
  - "id": "f17-006"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I require no such proofs,\" said the virtuous person."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 266
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9660
        "line_end": 9660
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9660-9660"
    "translation_ja": "「私はそんな証明を必要としない」と徳のあるお方。"
    "translation_status": "reviewed"
  - "id": "f17-007"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Then you have no reasonable faith,\" said the priest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 267
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9662
        "line_end": 9662
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9662-9662"
    "translation_ja": "「ならば、あなたには道理にかなった信仰がないのだ」と神官。"
    "translation_status": "reviewed"
  - "id": "f17-008"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Great is the right, and shall prevail!" cried the virtuous person. "There is loyalty in my soul; be sure, there is loyalty in the mind of Odin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 268
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9664
        "line_end": 9666
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9664-9666"
    "translation_ja": "「正義は偉大にして必ず勝つ！」と徳のあるお方は叫んだ。「私の魂には誠実さがある。たしかにオーディンのみ心にも誠実さはあるのだ」"
    "translation_status": "reviewed"
  - "id": "f17-009"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "These are but playings upon words," returned the priest. "A sackful of such trash is nothing to the peacock."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 269
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9668
        "line_end": 9669
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9668-9669"
    "translation_ja": "「言葉をもてあそんでいるにすぎませんな」と神官。「そんなくずを袋いっぱいに集めても、一羽の孔雀にはかなわない」"
    "translation_status": "reviewed"
  - "id": "f17-010"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Just then they passed a country farm, where there was a peacock seated on a rail; and the bird opened its mouth and sang with the voice of a nightingale.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 270
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9671
        "line_end": 9673
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9671-9673"
    "translation_ja": "ちょうどそのとき田舎の農家の前を通ると、柵に孔雀が一羽止まっていて、くちばしを開き、夜鳴きうぐいすの声で歌った。"
    "translation_status": "reviewed"
  - "id": "f17-011"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Where are you now?" asked the virtuous person. "And yet this shakes not me! Great is the truth, and shall prevail!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 271
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9675
        "line_end": 9676
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9675-9676"
    "translation_ja": "「さて、どうなさる？」と徳のあるお方。「それでも私は少しも揺らがない。真理は偉大にして必ず勝つ！」"
    "translation_status": "reviewed"
  - "id": "f17-012"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The devil fly away with that peacock!\" said the priest; and he was downcast for a mile or two."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 272
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9678
        "line_end": 9679
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9678-9679"
    "translation_ja": "「あの孔雀め、悪魔にさらわれてしまえ！」神官はそう言って、一、二マイルのあいだ、しょげ返っていた。"
    "translation_status": "reviewed"
  - "id": "f17-013"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But presently they came to a shrine, where a Fakeer performed miracles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 273
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9681
        "line_end": 9681
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9681-9681"
    "translation_ja": "ところがまもなく一行は聖所に着き、そこでは行者が奇跡を見せていた。"
    "translation_status": "reviewed"
  - "id": "f17-014"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Ah!" said the priest, "here are the true grounds of faith. The peacock was but an adminicle. This is the base of our religion." And he beat upon his breast, and groaned like one with colic.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 274
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9683
        "line_end": 9685
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9683-9685"
    "translation_ja": "「ああ！」と神官。「ここにこそ、まことの信仰の根拠がある。孔雀はただの傍証だった。これこそわが宗教の土台だ」そして胸を打ち、腹痛に見舞われた者のようにうめいた。"
    "translation_status": "reviewed"
  - "id": "f17-015"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now to me," said the virtuous person, "all this is as little to the purpose as the peacock. I believe because I see the right is great and must prevail; and this Fakeer might carry on with his conjuring tricks till doomsday, and it would not play bluff upon a man like me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 275
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9687
        "line_end": 9690
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9687-9690"
    "translation_ja": |-
      「さて私には」と徳のあるお方は言った。「こんなことは孔雀と同じで、まるで関係がない。私が信じるのは、正義が偉大であり、必ず勝たねばならないと分かるからだ。この行者が最後の審判の日まで手品を続けようと、この私のような者ははったりに乗ったりしない」
    "translation_status": "reviewed"
  - "id": "f17-016"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now at this the Fakeer was so much incensed that his hand trembled; and, lo! in the midst of a miracle the cards fell from up his sleeve.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 276
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9692
        "line_end": 9693
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9692-9693"
    "translation_ja": "これを聞いて行者はひどく腹を立て、手が震えた。するとどうだろう、奇跡の真っ最中に、袖から手品の札がばらばらと落ちてきた。"
    "translation_status": "reviewed"
  - "id": "f17-017"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Where are you now?\" asked the virtuous person. \"And yet it shakes not me!\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 277
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9695
        "line_end": 9696
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9695-9696"
    "translation_ja": "「さて、どうなさる？」と徳のあるお方。「それでも私は少しも揺らがない！」"
    "translation_status": "reviewed"
  - "id": "f17-018"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "The devil fly away with the Fakeer!" cried the priest. "I really do not see the good of going on with this pilgrimage."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 278
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9698
        "line_end": 9699
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9698-9699"
    "translation_ja": "「あの行者め、悪魔にさらわれてしまえ！」と神官は叫んだ。「まったく、こんな巡礼を続けて何になるのか、私には分からない」"
    "translation_status": "reviewed"
  - "id": "f17-019"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Cheer up!\" cried the virtuous person. \"Great is the right, and shall prevail!\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 279
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9701
        "line_end": 9702
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9701-9702"
    "translation_ja": "「元気を出しなさい！」徳のあるお方は叫んだ。「正義は偉大にして必ず勝つ！」"
    "translation_status": "reviewed"
  - "id": "f17-020"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"If you are quite sure it will prevail,\" says the priest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 280
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9704
        "line_end": 9704
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9704-9704"
    "translation_ja": "「それが勝つと、あなたに確信がおありなら」と神官。"
    "translation_status": "reviewed"
  - "id": "f17-021"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I pledge my word for that,\" said the virtuous person."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 281
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9706
        "line_end": 9706
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9706-9706"
    "translation_ja": "「私が保証します」と徳のあるお方。"
    "translation_status": "reviewed"
  - "id": "f17-022"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So the other began to go on again with a better heart."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 282
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9708
        "line_end": 9708
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9708-9708"
    "translation_ja": "そこで神官は少し元気を取り戻し、また歩き始めた。"
    "translation_status": "reviewed"
  - "id": "f17-023"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      At last one came running, and told them all was lost: that the powers of darkness had besieged the Heavenly Mansions, that Odin was to die, and evil triumph.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 283
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9710
        "line_end": 9712
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9710-9712"
    "translation_ja": "しまいに一人の男が駆けてきて、万事休すと告げた。闇の軍勢が天上の御殿を取り囲み、オーディンは死に、悪が勝つことになったという。"
    "translation_status": "reviewed"
  - "id": "f17-024"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I have been grossly deceived,\" cried the virtuous person."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 284
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9714
        "line_end": 9714
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9714-9714"
    "translation_ja": "「私はまんまとだまされていた！」徳のあるお方は叫んだ。"
    "translation_status": "reviewed"
  - "id": "f17-025"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"All is lost now,\" said the priest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 285
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9716
        "line_end": 9716
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9716-9716"
    "translation_ja": "「もう万事休すだ」と神官。"
    "translation_status": "reviewed"
  - "id": "f17-026"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I wonder if it is too late to make it up with the devil?\" said the virtuous person."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 286
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9718
        "line_end": 9719
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9718-9719"
    "translation_ja": "「今から悪魔と仲直りするには遅すぎるだろうか？」と徳のあるお方。"
    "translation_status": "reviewed"
  - "id": "f17-027"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "O, I hope not," said the priest. "And at any rate we can but try.--But what are you doing with your axe?" says he to the rover.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 287
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9721
        "line_end": 9722
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9721-9722"
    "translation_ja": "「ああ、そうでないといいが」と神官。「いずれにせよ、やってみるまでのことだ。おや、あなたはその斧で何をする？」と海賊に向かって言った。"
    "translation_status": "reviewed"
  - "id": "f17-028"
    "section_id": "fable-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I am off to die with Odin,\" said the rover."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 288
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9724
        "line_end": 9724
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9724-9724"
    "translation_ja": "「オーディンとともに死ににゆく」と海賊は言った。"
    "translation_status": "reviewed"
  - "id": "f18-000"
    "section_id": "fable-18"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XVIII
      THE TOUCHSTONE
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 289
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9729
        "line_end": 9731
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9729-9731"
    "translation_ja": "十八　試金石"
    "translation_status": "reviewed"
  - "id": "f18-001"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The King was a man that stood well before the world; his smile was sweet as clover, but his soul withinsides was as little as a pea. He had two sons; and the younger son was a boy after his heart, but the elder was one whom he feared. It befell one morning that the drum sounded in the dun before it was yet day; and the King rode with his two sons, and a brave array behind them. They rode two hours, and came to the foot of a brown mountain that was very steep.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 290
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9734
        "line_end": 9740
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9734-9740"
    "translation_ja": |-
      その王は、世間の評判のよい男だった。その微笑みはクローバーの花のように甘かったが、身のうちの魂は豆粒ほどしかなかった。王には二人の息子がいた。弟は王の心にかなう子だったが、兄のほうを王は恐れていた。ある朝、まだ夜も明けぬうちに砦で太鼓が鳴り、王は二人の息子と馬を連ね、きらびやかな供ぞろいを後ろに従えて出発した。二時間馬を進めると、たいそう険しい褐色の山のふもとに着いた。
    "translation_status": "reviewed"
  - "id": "f18-002"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Where do we ride?\" said the elder son."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 291
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9742
        "line_end": 9742
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9742-9742"
    "translation_ja": "「どちらへ参ります？」と兄は言った。"
    "translation_status": "reviewed"
  - "id": "f18-003"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Across this brown mountain,\" said the King, and smiled to himself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 292
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9744
        "line_end": 9744
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9744-9744"
    "translation_ja": "「この褐色の山を越えて」と王は言い、独り微笑んだ。"
    "translation_status": "reviewed"
  - "id": "f18-004"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"My father knows what he is doing,\" said the younger son."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 293
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9746
        "line_end": 9746
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9746-9746"
    "translation_ja": "「父上がお考えのうえでなさることだ」と弟は言った。"
    "translation_status": "reviewed"
  - "id": "f18-005"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And they rode two hours more, and came to the sides of a black river that was wondrous deep."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 294
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9748
        "line_end": 9749
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9748-9749"
    "translation_ja": "さらに二時間進むと、驚くほど深い黒い川の岸に着いた。"
    "translation_status": "reviewed"
  - "id": "f18-006"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And where do we ride?\" asked the elder son."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 295
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9751
        "line_end": 9751
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9751-9751"
    "translation_ja": "「それで、どちらへ参ります？」と兄は尋ねた。"
    "translation_status": "reviewed"
  - "id": "f18-007"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Over this black river,\" said the King, and smiled to himself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 296
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9753
        "line_end": 9753
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9753-9753"
    "translation_ja": "「この黒い川を渡って」と王は言い、独り微笑んだ。"
    "translation_status": "reviewed"
  - "id": "f18-008"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"My father knows what he is doing,\" said the younger son."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 297
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9755
        "line_end": 9755
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9755-9755"
    "translation_ja": "「父上がお考えのうえでなさることだ」と弟は言った。"
    "translation_status": "reviewed"
  - "id": "f18-009"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And they rode all that day, and about the time of the sunsetting came to the side of a lake, where was a great dun.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 298
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9757
        "line_end": 9758
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9757-9758"
    "translation_ja": "その日は一日じゅう馬を走らせ、日の沈む頃、ある湖のほとりに着いた。そこには大きな砦があった。"
    "translation_status": "reviewed"
  - "id": "f18-010"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "It is here we ride," said the King; "to a King's house, and a priest's, and a house where you will learn much."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 299
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9760
        "line_end": 9761
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9760-9761"
    "translation_ja": "「ここが行く先だ」と王は言った。「王の家にして神官の家、お前たちが多くを学ぶことになる家だ」"
    "translation_status": "reviewed"
  - "id": "f18-011"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      At the gates of the dun, the King who was a priest met them; and he was a grave man, and beside him stood his daughter, and she was as fair as the morn, and one that smiled and looked down.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 300
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9763
        "line_end": 9765
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9763-9765"
    "translation_ja": "砦の門では、神官でもある王が彼らを迎えた。おごそかな人で、かたわらには娘がいた。朝の光のように美しく、微笑んでは目を伏せる娘だった。"
    "translation_status": "reviewed"
  - "id": "f18-012"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"These are my two sons,\" said the first King."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 301
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9767
        "line_end": 9767
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9767-9767"
    "translation_ja": "「これがわしの二人の息子だ」と最初の王は言った。"
    "translation_status": "reviewed"
  - "id": "f18-013"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And here is my daughter,\" said the King who was a priest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 302
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9769
        "line_end": 9769
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9769-9769"
    "translation_ja": "「これがわしの娘だ」と神官でもある王は言った。"
    "translation_status": "reviewed"
  - "id": "f18-014"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"She is a wonderful fine maid,\" said the first King, \"and I like her manner of smiling.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 303
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9771
        "line_end": 9772
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9771-9772"
    "translation_ja": "「なんと見事なお嬢さんだろう」と最初の王。「あの微笑み方が気に入った」"
    "translation_status": "reviewed"
  - "id": "f18-015"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They are wonderful well-grown lads,\" said the second, \"and I like their gravity.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 304
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9774
        "line_end": 9775
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9774-9775"
    "translation_ja": "「なんと立派に育った若者たちだろう」ともう一人の王。「あの落ち着きぶりが気に入った」"
    "translation_status": "reviewed"
  - "id": "f18-016"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then the two Kings looked at each other, and said, \"The thing may come about.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 305
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9777
        "line_end": 9778
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9777-9778"
    "translation_ja": "そこで二人の王は顔を見合わせ、「これはうまく運びそうだ」と言った。"
    "translation_status": "reviewed"
  - "id": "f18-017"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And in the meanwhile the two lads looked upon the maid, and the one grew pale and the other red; and the maid looked upon the ground smiling.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 306
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9780
        "line_end": 9781
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9780-9781"
    "translation_ja": "そのあいだに二人の若者は乙女を見つめ、一人は青ざめ、一人は赤くなった。乙女は地面に目を伏せ、微笑んでいた。"
    "translation_status": "reviewed"
  - "id": "f18-018"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Here is the maid that I shall marry,\" said the elder. \"For I think she smiled upon me.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 307
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9783
        "line_end": 9784
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9783-9784"
    "translation_ja": "「私が妻とするのはこの乙女だ」と兄は言った。「私に微笑みかけてくれたように思うから」"
    "translation_status": "reviewed"
  - "id": "f18-019"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      But the younger plucked his father by the sleeve. "Father," said he, "a word in your ear. If I find favour in your sight, might not I wed this maid, for I think she smiles upon me?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 308
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9786
        "line_end": 9788
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9786-9788"
    "translation_ja": "だが弟は父の袖を引いた。「父上、お耳に入れたいことが。私をお気に召してくださるなら、私がこの乙女を妻にするわけにはいきませんか？　私に微笑みかけてくれるように思うのです」"
    "translation_status": "reviewed"
  - "id": "f18-020"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "A word in yours," said the King his father. "Waiting is good hunting, and when the teeth are shut the tongue is at home."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 309
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9790
        "line_end": 9791
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9790-9791"
    "translation_ja": "「ではお前の耳にひと言」と父王。「よい狩りは待つことから。歯を閉じておれば、舌はわが家におる」"
    "translation_status": "reviewed"
  - "id": "f18-021"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now they were come into the dun, and feasted; and this was a great house, so that the lads were astonished; and the King that was a priest sat at the end of the board and was silent, so that the lads were filled with reverence; and the maid served them smiling with downcast eyes, so that their hearts were enlarged.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 310
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9793
        "line_end": 9797
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9793-9797"
    "translation_ja": |-
      一行は砦に入って饗宴についた。館の壮麗さに若者たちは目をみはった。神官でもある王は卓の上座に黙して座し、若者たちは畏敬に満たされた。乙女は目を伏せて微笑みながら給仕し、若者たちの胸はふくらんだ。
    "translation_status": "reviewed"
  - "id": "f18-022"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Before it was day, the elder son arose, and he found the maid at her weaving, for she was a diligent girl. "Maid," quoth he, "I would fain marry you."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 311
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9799
        "line_end": 9801
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9799-9801"
    "translation_ja": "夜の明けぬうちに兄は起きて、機を織る乙女を見つけた。働き者の娘だったのである。「乙女よ」と彼は言った。「あなたをぜひとも妻にしたい」"
    "translation_status": "reviewed"
  - "id": "f18-023"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "You must speak with my father," said she, and she looked upon the ground smiling, and became like the rose.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 312
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9803
        "line_end": 9804
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9803-9804"
    "translation_ja": "「父とお話しになってください」と彼女は言い、地を見て微笑み、薔薇の色になった。"
    "translation_status": "reviewed"
  - "id": "f18-024"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Her heart is with me,\" said the elder son, and he went down to the lake and sang."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 313
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9806
        "line_end": 9807
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9806-9807"
    "translation_ja": "「彼女の心は私とともにある」と兄は言い、湖のほとりへ下って歌った。"
    "translation_status": "reviewed"
  - "id": "f18-025"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      A little while after came the younger son. "Maid," quoth he, "if our fathers were agreed, I would like well to marry you."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 314
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9809
        "line_end": 9810
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9809-9810"
    "translation_ja": "少したって弟が来た。「乙女よ」と彼は言った。「双方の父親が賛成してくれたら、あなたをぜひ妻にしたい」"
    "translation_status": "reviewed"
  - "id": "f18-026"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "You can speak to my father," said she; and looked upon the ground, and smiled and grew like the rose.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 315
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9812
        "line_end": 9813
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9812-9813"
    "translation_ja": "「父にお話しなさってもよろしいですわ」と彼女は言った。そして地面に目を伏せ、微笑み、薔薇の色になった。"
    "translation_status": "reviewed"
  - "id": "f18-027"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "She is a dutiful daughter," said the younger son, "she will make an obedient wife." And then he thought, "What shall I do?" and he remembered the King her father was a priest; so he went into the temple, and sacrificed a weasel and a hare.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 316
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9815
        "line_end": 9818
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9815-9818"
    "translation_ja": |-
      「親の言いつけを守る娘だ」と弟は言った。「従順な妻になるだろう」それから「さて、どうしよう？」と考えた。乙女の父王が神官であることを思い出し、神殿へ行って、いたち一匹と野うさぎ一羽をいけにえに捧げた。
    "translation_status": "reviewed"
  - "id": "f18-028"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Presently the news got about; and the two lads and the first King were called into the presence of the King who was a priest, where he sat upon the high seat.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 317
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9820
        "line_end": 9822
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9820-9822"
    "translation_ja": "やがて話が広まって、二人の若者も最初の王も、神官でもある王の御前に召された。王は高座に座していた。"
    "translation_status": "reviewed"
  - "id": "f18-029"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Little I reck of gear," said the King who was a priest, "and little of power. For we live here among the shadow of things, and the heart is sick of seeing them. And we stay here in the wind like raiment drying, and the heart is weary of the wind. But one thing I love, and that is truth; and for one thing will I give my daughter, and that is the trial stone. For in the light of that stone the seeming goes, and the being shows, and all things besides are worthless. Therefore, lads, if ye would wed my daughter, out foot, and bring me the stone of touch, for that is the price of her."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 318
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9824
        "line_end": 9832
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9824-9832"
    "translation_ja": |-
      「富にはさほど関心がない」と神官でもある王は言った。「権勢も同じ。われわれはここで万物の影のあいだに暮らしており、それを見るのに心は病んでしまう。干した衣のようにここで風に吹かれ続け、心はその風に疲れ果てる。けれども、わしの愛するものが一つある。真実だ。わしが娘を与えるのと引き換えに受け取るものが一つある。それは真贋を試す石だ。その石の光のもとでは、見かけが去って、在るものの姿が現れる。これに比べればほかの一切は値打ちがない。されば若者たちよ、娘を妻にしたければ、すぐに出立し、試金石を持ってまいれ。それが娘を得る代価だ」
    "translation_status": "reviewed"
  - "id": "f18-030"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "A word in your ear," said the younger son to his father. "I think we do very well without this stone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 319
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9834
        "line_end": 9835
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9834-9835"
    "translation_ja": "「お耳にひと言」と弟は父に言った。「そんな石はなくとも、私たちは十分うまくやっていると思いますが」"
    "translation_status": "reviewed"
  - "id": "f18-031"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "A word in yours," said the father. "I am of your way of thinking; but when the teeth are shut the tongue is at home." And he smiled to the King that was a priest.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 320
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9837
        "line_end": 9839
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9837-9839"
    "translation_ja": "「お前の耳にひと言」と父。「わしも同感だ。だが歯を閉じておれば、舌はわが家におる」そして神官でもある王に微笑みかけた。"
    "translation_status": "reviewed"
  - "id": "f18-032"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      But the elder son got to his feet, and called the King that was a priest by the name of father. "For whether I marry the maid or no, I will call you by that word for the love of your wisdom; and even now I will ride forth and search the world for the stone of touch." So he said farewell, and rode into the world.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 321
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9841
        "line_end": 9845
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9841-9845"
    "translation_ja": |-
      だが兄は立ち上がり、神官でもある王を父と呼んだ。「乙女を妻にできてもできなくても、お知恵を慕う心から、あなたをそう呼ばせてください。今すぐ馬を出し、世界を巡って試金石を探してまいります」そうして別れを告げ、世に乗り出した。
    "translation_status": "reviewed"
  - "id": "f18-033"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I think I will go, too," said the younger son, "if I can have your leave. For my heart goes out to the maid."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 322
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9847
        "line_end": 9848
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9847-9848"
    "translation_ja": "「お許しをいただけるなら、私もゆこうと思います」と弟。「私の心はあの乙女にひかれておりますから」"
    "translation_status": "reviewed"
  - "id": "f18-034"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You will ride home with me,\" said his father."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 323
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9850
        "line_end": 9850
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9850-9850"
    "translation_ja": "「お前はわしと一緒に帰るのだ」と父は言った。"
    "translation_status": "reviewed"
  - "id": "f18-035"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So they rode home, and when they came to the dun, the King had his son into his treasury. "Here," said he, "is the touchstone which shows truth; for there is no truth but plain truth; and if you will look in this, you will see yourself as you are."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 324
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9852
        "line_end": 9855
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9852-9855"
    "translation_ja": |-
      そこで二人は帰り、砦に着くと、王は息子を宝物庫へ連れていった。「ここにある」と王は言った。「これが真実を映す試金石だ。見たままの真実のほかに真実はない。これをのぞけば、お前はありのままの自分を見るだろう」
    "translation_status": "reviewed"
  - "id": "f18-036"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And the younger son looked in it, and saw his face as it were the face of a beardless youth, and he was well enough pleased; for the thing was a piece of a mirror.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 325
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9857
        "line_end": 9859
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9857-9859"
    "translation_ja": "弟がのぞくと、ひげも生えそろわぬ若者のような顔が見えて、まんざらでもないと思った。それは鏡のかけらだったのである。"
    "translation_status": "reviewed"
  - "id": "f18-037"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Here is no such great thing to make a work about," said he; "but if it will get me the maid I shall never complain. But what a fool is my brother to ride into the world, and the thing all the while at home!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 326
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9861
        "line_end": 9863
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9861-9863"
    "translation_ja": |-
      「こんな、大騒ぎするほどでもないものか」と彼は言った。「でもこれで乙女が手に入るのなら、文句は言わない。それにしても兄さんの馬鹿さかげんときたら。ずっとうちにあったものを探して世界へ乗り出すなんて！」
    "translation_status": "reviewed"
  - "id": "f18-038"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So they rode back to the other dun, and showed the mirror to the King that was a priest; and when he had looked in it, and seen himself like a King, and his house like a King's house, and all things like themselves, he cried out and blessed God. "For now I know," said he, "there is no truth but the plain truth; and I am a King indeed, although my heart misgave me." And he pulled down his temple and built a new one; and then the younger son was married to the maid.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 327
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9865
        "line_end": 9871
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9865-9871"
    "translation_ja": |-
      こうして二人はまたあの砦へ馬を走らせ、神官でもある王に鏡を見せた。王がのぞいてみると、自分は王らしく、館は王の館らしく、何もかもがそれぞれのものらしく見えたので、声をあげて神をたたえた。「今こそ分かった。見たままの真実のほかに真実はない。心は疑っていたが、わしはまことに王なのだ」そして神殿を取り壊して新しく建て直した。そののち、弟は乙女と結婚した。
    "translation_status": "reviewed"
  - "id": "f18-039"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      In the meantime the elder son rode into the world to find the touchstone of the trial of truth; and whenever he came to a place of habitation, he would ask the men if they had heard of it. And in every place the men answered: "Not only have we heard of it, but we alone, of all men, possess the thing itself, and it hangs in the side of our chimney to this day." Then would the elder son be glad, and beg for a sight of it. And sometimes it would be a piece of mirror, that showed the seeming of things; and then he would say, "This can never be, for there should be more than seeming." And sometimes it would be a lump of coal, which showed nothing; and then he would say, "This can never be, for at least there is the seeming." And sometimes it would be a touchstone indeed, beautiful in hue, adorned with polishing, the light inhabiting its sides; and when he found this, he would beg the thing, and the persons of that place would give it him, for all men were very generous of that gift; so that at the last he had his wallet full of them, and they chinked together when he rode; and when he halted by the side of the way he would take them out and try them, till his head turned like the sails upon a windmill.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 328
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9873
        "line_end": 9890
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9873-9890"
    "translation_ja": |-
      そのあいだ兄は、真実かどうかを試す石を見つけに世を巡っていた。人の住むところに来るたび、その石を聞き知っているかとそこに暮らす人々に尋ねた。どこであっても人々はこう答えた。「聞き知っているどころか、この世の人間のうち、わしらだけがそのものを持っている。今も暖炉の脇に掛けてあるぞ」兄はそのたび喜んで、見せてくれと頼んだ。それは時には物の見かけを映す鏡のかけらだった。すると彼は「これではありえない。見かけだけでなく、何かもっとあるはずだもの」と言った。時には石炭のかけらで、何も映さなかった。すると彼は「これではありえない。少なくとも見かけだけはあるのだもの」と言った。時にはまさしく試金石と思えるものもあった。色つやが美しく、磨き上げられ、面の奥に光が宿っていた。そんな石を見つけると、彼はそれをくれまいかと頼み、その地の人々はくれた。この贈り物にかけては、人はみなひどく気前がよかったのだ。とうとう袋は石でいっぱいになり、馬を走らすと石どうしがちりちり鳴った。道端で休むと、それらを取り出し、あれこれ試すうちに、頭が風車の羽根のようにぐるぐる回った。
    "translation_status": "reviewed"
  - "id": "f18-040"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "A murrain upon this business!" said the elder son, "for I perceive no end to it. Here I have the red, and here the blue and the green; and to me they seem all excellent, and yet shame each other. A murrain on the trade! If it were not for the King that is a priest and whom I have called my father, and if it were not for the fair maid of the dun that makes my mouth to sing and my heart enlarge, I would even tumble them all into the salt sea, and go home and be a King like other folk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 329
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9892
        "line_end": 9898
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9892-9898"
    "translation_ja": |-
      「こんな仕事、疫病にでもかかれ！」と兄は言った。「ちっとも埒が明かない。ここに赤いの、ここに青いのと緑のがある。私にはどれも見事に見えながら、互いにほかの石を色あせさせる。こんな稼業など疫病にさらわれてしまえ！　私が父と呼んだ、あの神官でもある王がいなかったら、私の口に歌を、胸に喜びをもたらす砦の美しい乙女がいなかったら、こんなものはみんな潮の海に放り込み、家に帰って人並みに王になるものを」
    "translation_status": "reviewed"
  - "id": "f18-041"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      But he was like the hunter that has seen a stag upon a mountain, so that the night may fall, and the fire be kindled, and the lights shine in his house; but desire of that stag is single in his bosom.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 330
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9900
        "line_end": 9902
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9900-9902"
    "translation_ja": "だが彼は、山で牡鹿を見た狩人のようなものだった。夜が落ち、炉に火がともり、わが家の窓に明かりが輝いても、胸にあるのはその鹿を求める思いただ一つだけ。"
    "translation_status": "reviewed"
  - "id": "f18-042"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now after many years the elder son came upon the sides of the salt sea; and it was night, and a savage place, and the clamour of the sea was loud. There he was aware of a house, and a man sat there by the light of a candle, for he had no fire. Now the elder son came in to him, and the man gave him water to drink, for he had no bread; and wagged his head when spoken to, for he had no words.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 331
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9904
        "line_end": 9909
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9904-9909"
    "translation_ja": |-
      幾年も過ぎて、兄は潮の海のほとりに来た。夜で、人を寄せつけない荒れ地に、潮騒がとどろいていた。そこに家があり、一人の男がろうそくの明かりのそばに座っていた。炉に火がなかったからだ。兄がその男のところへ入ってゆくと、男は飲み水をくれた。パンがなかったからだ。話しかけると男は頭を動かした。言葉がなかったからだ。
    "translation_status": "reviewed"
  - "id": "f18-043"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Have you the touchstone of truth?" asked the elder son; and when the man had wagged his head, "I might have known that," cried the elder son. "I have here a wallet full of them!" And with that he laughed, although his heart was weary.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 332
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9911
        "line_end": 9914
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9911-9914"
    "translation_ja": "「真実の試金石をお持ちですか？」兄は尋ねた。男が頭を動かすと、「そうだろうとも思った！」と兄は叫んだ。「私もここに袋いっぱい持っているのだ！」そして心は疲れていたが、彼は笑った。"
    "translation_status": "reviewed"
  - "id": "f18-044"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And with that the man laughed too, and with the fuff of his laughter the candle went out."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 333
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9916
        "line_end": 9917
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9916-9917"
    "translation_ja": "すると男も笑い、その笑いの吐く息がふっとろうそくを吹き消した。"
    "translation_status": "reviewed"
  - "id": "f18-045"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Sleep," said the man, "for now I think you have come far enough; and your quest is ended and my candle is out."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 334
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9919
        "line_end": 9920
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9919-9920"
    "translation_ja": "「お眠りなさい」と男は言った。「もう十分に遠くへ来たようだ。あなたの探求は終わったし、私のろうそくも消えた」"
    "translation_status": "reviewed"
  - "id": "f18-046"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now when the morning came, the man gave him a clear pebble in his hand, and it had no beauty and no colour; and the elder son looked upon it scornfully and shook his head; and he went away, for it seemed a small affair to him.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 335
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9922
        "line_end": 9925
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9922-9925"
    "translation_ja": "朝になると、男は透き通った小石を彼の手に載せた。美しくもなく、色もなかった。兄はさげすんで小石を見つめ、首を振った。つまらぬものに思えて、そこを去った。"
    "translation_status": "reviewed"
  - "id": "f18-047"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      All that day he rode, and his mind was quiet, and the desire of the chase allayed. "How if this poor pebble be the touchstone, after all?" said he: and he got down from his horse and emptied forth his wallet by the side of the way. Now, in the light of each other, all the touchstones lost their hue and fire, and withered like stars at morning; but in the light of the pebble, their beauty remained, only the pebble was the most bright. And the elder son smote upon his brow. "How if this be the truth?" he cried, "that all are a little true?" And he took the pebble and turned its light upon the heavens, and they deepened about him like the pit; and he turned it on the hills, and the hills were cold and rugged, but life ran in their sides so that his own life bounded; and he turned it on the dust, and he beheld the dust with joy and terror; and he turned it on himself, and knelt down and prayed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 336
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9927
        "line_end": 9939
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9927-9939"
    "translation_ja": |-
      その日一日、馬で道を行くあいだ、彼の心は静かで、追い求める渇きは和らいでいた。「ひょっとして、この貧相な小石こそ試金石だとしたら？」彼はそう言い、馬を降りて道端に袋の中身をあけた。互いの光に照らされると、どの試金石も色と輝きを失って明け方の星のようにしぼんだ。けれど小石の光のもとでは、どれも美しさを失わず、ただ小石だけがひときわ明るかった。兄は自分の額をぴしゃりと打った。「もしやこれが真実ではあるまいか？」と彼は叫んだ。「どれも少しずつは真実なのでは？」彼は小石を手にして天に光を向けた。すると天はまわりに底なしの深みのように広がった。丘に向けると、丘は冷たく荒々しかったが、斜面には命が脈打ち、彼自身の命もそれにつれて躍った。塵に向けると、喜びとおののきとをもって彼は塵を眺めた。自分に向けると、ひざまずいて祈った。
    "translation_status": "reviewed"
  - "id": "f18-048"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now, thanks be to God," said the elder son, "I have found the touchstone; and now I may turn my reins, and ride home to the King and to the maid of the dun that makes my mouth to sing and my heart enlarge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 337
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9941
        "line_end": 9944
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9941-9944"
    "translation_ja": "「さあ、神に感謝を」と兄は言った。「試金石は見つかった。これで手綱を返し、王のもとへ、私の口に歌を、胸に喜びをもたらす、砦の乙女のもとへ帰れる」"
    "translation_status": "reviewed"
  - "id": "f18-049"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now when he came to the dun, he saw children playing by the gate where the King had met him in the old days; and this stayed his pleasure, for he thought in his heart, "It is here my children should be playing." And when he came into the hall, there was his brother on the high seat and the maid beside him; and at that his anger rose, for he thought in his heart, "It is I that should be sitting there, and the maid beside me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 338
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9946
        "line_end": 9951
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9946-9951"
    "translation_ja": |-
      砦に着くと、昔、王に迎えられた門のそばで子供たちが遊んでいた。それを見て喜びが一瞬止まった。心の中で「ここでは私の子供が遊んでいるはずだった」と思ったからだ。広間に入ると、高座に弟がいて、かたわらに乙女がいた。それを見て怒りが湧いた。心の中で「そこに座り、かたわらに乙女を置いているはずなのは私だ」と思ったからだ。
    "translation_status": "reviewed"
  - "id": "f18-050"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Who are you?\" said his brother. \"And what make you in the dun?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 339
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9953
        "line_end": 9953
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9953-9953"
    "translation_ja": "「何者だ？」と弟。「この砦に何の用だ？」"
    "translation_status": "reviewed"
  - "id": "f18-051"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I am your elder brother," he replied. "And I am come to marry the maid, for I have brought the touchstone of truth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 340
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9955
        "line_end": 9956
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9955-9956"
    "translation_ja": "「お前の兄だ」と彼は答えた。「真実の試金石を持って、乙女を妻にしに来たのだ」"
    "translation_status": "reviewed"
  - "id": "f18-052"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Then the younger brother laughed aloud. "Why," said he, "I found the touchstone years ago, and married the maid, and there are our children playing at the gate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 341
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9958
        "line_end": 9960
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9958-9960"
    "translation_ja": "弟は声をあげて笑った。「なんだ」と彼は言った。「試金石ならとうの昔に私が見つけて乙女を妻にした。ほら、門のところで遊んでいるのは私たちの子供だよ」"
    "translation_status": "reviewed"
  - "id": "f18-053"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now at this the elder brother grew as grey as the dawn. "I pray you have dealt justly," said he, "for I perceive my life is lost."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 342
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9962
        "line_end": 9963
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9962-9963"
    "translation_ja": "それを聞くと兄は夜明けのように灰色になった。「どうかお前が正しく取り計らったのであるように」と彼は言った。「私の一生は失われたと分かったから」"
    "translation_status": "reviewed"
  - "id": "f18-054"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Justly?" quoth the younger brother. "It becomes you ill, that are a restless man and a runagate, to doubt my justice, or the King my father's, that are sedentary folk and known in the land."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 343
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9965
        "line_end": 9967
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9965-9967"
    "translation_ja": "「正しくだって？」と弟は言った。「落ち着きもなく放浪していたあなたが、私や、わが父なる王の正しさを疑うなどお門違いだ。私たちは土地に根を下ろし、名も知れた人間なのだから」"
    "translation_status": "reviewed"
  - "id": "f18-055"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Nay," said the elder brother, "you have all else, have patience also; and suffer me to say the world is full of touchstones, and it appears not easily which is true."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 344
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9969
        "line_end": 9971
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9969-9971"
    "translation_ja": "「いや」と兄は言った。「お前にはほかのものはみなある。辛抱もしておくれ。世に試金石は満ち、どれが真かはそうたやすく分からない、と言わせてほしい」"
    "translation_status": "reviewed"
  - "id": "f18-056"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I have no shame of mine,\" said the younger brother. \"There it is, and look in it.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 345
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9973
        "line_end": 9974
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9973-9974"
    "translation_ja": "「私の石に恥じるところはない」と弟は言った。「そこにある。のぞいてごらん」"
    "translation_status": "reviewed"
  - "id": "f18-057"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the elder brother looked in the mirror, and he was sore amazed; for he was an old man, and his hair was white upon his head; and he sat down in the hall and wept aloud.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 346
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9976
        "line_end": 9978
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9976-9978"
    "translation_ja": "兄は鏡をのぞいて、痛ましいほど驚いた。彼は老人で、頭には白い髪が生えていた。広間に座り、声をあげて泣いた。"
    "translation_status": "reviewed"
  - "id": "f18-058"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now," said the younger brother, "see what a fool's part you have played, that ran over all the world to seek what was lying in our father's treasury, and came back an old carle for the dogs to bark at, and without chick or child. And I that was dutiful and wise sit here crowned with virtues and pleasures, and happy in the light of my hearth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 347
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9980
        "line_end": 9985
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9980-9985"
    "translation_ja": |-
      「さて」と弟は言った。「自分がいかに馬鹿な役を演じたか分かるだろう。父の宝物庫にあったものを探して世界じゅう駆け回り、犬に吠えられるようなじじいになって帰って、子どもの一人とていない。その点、従順で賢かった私は、徳と楽しみを冠に戴いてここに座り、わが家の炉の光に幸せに暮らしている」
    "translation_status": "reviewed"
  - "id": "f18-059"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Methinks you have a cruel tongue," said the elder brother; and he pulled out the clear pebble and turned its light on his brother; and behold the man was lying, his soul was shrunk into the smallness of a pea, and his heart was a bag of little fears like scorpions, and love was dead in his bosom. And at that the elder brother cried out aloud, and turned the light of the pebble on the maid, and, lo! she was but a mask of a woman, and withinsides she was quite dead, and she smiled as a clock ticks, and knew not wherefore.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 348
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9987
        "line_end": 9994
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9987-9994"
    "translation_ja": |-
      「お前の舌はずいぶん残酷なようだ」と兄は言った。そして透明な小石を取り出し、その光を弟に向けた。すると見よ、男は嘘をついていた。魂は豆粒ほどに縮み、心はさそりのような小さな恐れを詰めた袋で、胸の中では愛が死んでいた。それを見て兄は大声をあげ、小石の光を乙女に向けた。すると見よ、彼女は女の仮面にすぎず、中はすっかり死んでいた。時計が時を刻むように微笑んで、なぜ微笑むのかを知らなかった。
    "translation_status": "reviewed"
  - "id": "f18-060"
    "section_id": "fable-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "O, well," said the elder brother, "I perceive there is both good and bad. So fare ye all as well as ye may in the dun; but I will go forth into the world with my pebble in my pocket."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 349
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9996
        "line_end": 9998
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9996-9998"
    "translation_ja": "「まあ、そうか」と兄は言った。「善いことも悪いことも、ともにあるのが分かった。ではみなさん、この砦でせいぜいお幸せに。私は小石をポケットに入れて、また世の中へ出てゆこう」"
    "translation_status": "reviewed"
  - "id": "f19-000"
    "section_id": "fable-19"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XIX
      THE POOR THING
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 350
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10003
        "line_end": 10005
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10003-10005"
    "translation_ja": "十九　あわれなもの"
    "translation_status": "reviewed"
  - "id": "f19-001"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      There was a man in the islands who fished for his bare bellyful, and took his life in his hands to go forth upon the sea between four planks. But though he had much ado, he was merry of heart; and the gulls heard him laugh when the spray met him. And though he had little lore, he was sound of spirit; and when the fish came to his hook in the mid-waters, he blessed God without weighing. He was bitter poor in goods and bitter ugly of countenance, and he had no wife.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 351
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10008
        "line_end": 10014
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10008-10014"
    "translation_ja": |-
      島々に一人の男が住んでいた。どうにか腹を満たすだけのために漁をし、四枚の板に身を託して、命がけで海に出た。苦労は多くても心は晴れやかで、しぶきがかかると、かもめにも聞こえる声で笑った。物知りではなかったが、心根は健やかで、沖合で魚が針にかかると、あれこれ計算などせず神に感謝した。持ち物といえばひどく乏しく、顔立ちといえばひどく醜く、妻はいなかった。
    "translation_status": "reviewed"
  - "id": "f19-002"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      It fell in the time of the fishing that the man awoke in his house about the midst of the afternoon. The fire burned in the midst, and the smoke went up and the sun came down by the chimney. And the man was aware of the likeness of one that warmed his hands at the red peats.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 352
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10016
        "line_end": 10019
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10016-10019"
    "translation_ja": |-
      漁の季節のある日のこと、男は昼下がりも半ばの頃に家で目を覚ました。家の真ん中では火が燃え、煙突からは煙が上って、日の光が射し下りていた。男がふと気づくと、人のような姿が赤くおきた泥炭に手をかざしていた。
    "translation_status": "reviewed"
  - "id": "f19-003"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I greet you,\" said the man, \"in the name of God.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 353
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10021
        "line_end": 10021
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10021-10021"
    "translation_ja": "「ごあいさつ申し上げる、神の名において」と男は言った。"
    "translation_status": "reviewed"
  - "id": "f19-004"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I greet you," said he that warmed his hands, "but not in the name of God, for I am none of His; nor in the name of Hell, for I am not of Hell. For I am but a bloodless thing, less than wind and lighter than a sound, and the wind goes through me like a net, and I am broken by a sound and shaken by the cold."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 354
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10023
        "line_end": 10027
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10023-10027"
    "translation_ja": |-
      「ごあいさつ申し上げる」と手を温めていたものは言った。「けれど神の名においてではない。私は神のものではないから。地獄の名においてでもない。私は地獄のものでもないから。私は血の通わぬものにすぎず、風よりもはかなく音よりも軽い。風は網を抜けるように私を抜けてゆき、物音ひとつに私は砕け、寒気に震える」
    "translation_status": "reviewed"
  - "id": "f19-005"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Be plain with me,\" said the man, \"and tell me your name and of your nature.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 355
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10029
        "line_end": 10030
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10029-10030"
    "translation_ja": "「はっきりと話してくれ」と男は言った。「名は何で、どういうものなのだ」"
    "translation_status": "reviewed"
  - "id": "f19-006"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "My name," quoth the other, "is not yet named, and my nature not yet sure. For I am part of a man; and I was a part of your fathers, and went out to fish and fight with them in the ancient days. But now is my turn not yet come; and I wait until you have a wife, and then shall I be in your son, and a brave part of him, rejoicing manfully to launch the boat into the surf, skilful to direct the helm, and a man of might where the ring closes and the blows are going."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 356
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10032
        "line_end": 10038
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10032-10038"
    "translation_ja": |-
      「私の名は」と相手は言った。「まだつけられておらず、性質もまだ定まらない。私は一人の男の一部分なのだ。かつてはあなたの先祖たちの一部分で、遠い昔、ともに漁に出て、ともに戦った。しかし今はまだ私の番は来ていない。あなたが妻をめとるのを私は待っている。そうすればあなたの息子のうちに宿り、その勇ましい部分となる。砕ける波へ舟を押し出すのを男らしく喜び、巧みに舵を操り、人の輪が狭まり拳が飛び交うところではたくましい男となるのだ」
    "translation_status": "reviewed"
  - "id": "f19-007"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "This is a marvellous thing to hear," said the man; "and if you are indeed to be my son, I fear it will go ill with you; for I am bitter poor in goods and bitter ugly in face, and I shall never get me a wife if I live to the age of eagles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 357
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10040
        "line_end": 10043
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10040-10043"
    "translation_ja": "「聞くも不思議な話だ」と男は言った。「だが本当にお前がわしの息子になるのなら、お前の先行きは悪かろう。わしはひどく貧しく、顔もひどく醜い。鷲ほどに長生きしたところで、妻などもらえまい」"
    "translation_status": "reviewed"
  - "id": "f19-008"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "All this have I come to remedy, my Father," said the Poor Thing; "for we must go this night to the little isle of sheep, where our fathers lie in the dead-cairn, and to-morrow to the Earl's Hall, and there shall you find a wife by my providing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 358
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10045
        "line_end": 10048
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10045-10048"
    "translation_ja": |-
      「そのすべてを何とかしに参ったのです、わが父よ」と、そのあわれなものは言った。「今夜は羊の小島へ、私たちの先祖が石塚の下に眠っているところへ行かねばなりません。明日は伯爵の館へ。そこで私のとりなしによって、あなたは妻を得るのです」
    "translation_status": "reviewed"
  - "id": "f19-009"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the man rose and put forth his boat at the time of the sunsetting; and the Poor Thing sat in the prow, and the spray blew through his bones like snow, and the wind whistled in his teeth, and the boat dipped not with the weight of him.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 359
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10050
        "line_end": 10053
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10050-10053"
    "translation_ja": "そこで男は起きて、日の沈む頃、舟を出した。あわれなものは舳先に座った。しぶきは雪のようにその骨を吹き抜け、風はその歯のあいだで鳴り、その重みで舟が沈み込むことは少しもなかった。"
    "translation_status": "reviewed"
  - "id": "f19-010"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I am fearful to see you, my son,\" said the man. \"For methinks you are no thing of God.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 360
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10055
        "line_end": 10056
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10055-10056"
    "translation_ja": "「お前を見ていると恐ろしい、わが息子よ」と男は言った。「お前は神のものではない気がする」"
    "translation_status": "reviewed"
  - "id": "f19-011"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "It is only the wind that whistles in my teeth," said the Poor Thing, "and there is no life in me to keep it out."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 361
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10058
        "line_end": 10059
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10058-10059"
    "translation_ja": "「歯のあいだで鳴るのはただの風です」とあわれなものは言った。「風を締め出すだけの命がまだ私の中にはないのです」"
    "translation_status": "reviewed"
  - "id": "f19-012"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So they came to the little isle of sheep, where the surf burst all about it in the midst of the sea, and it was all green with bracken, and all wet with dew, and the moon enlightened it. They ran the boat into a cove, and set foot to land; and the man came heavily behind among the rocks in the deepness of the bracken, but the Poor Thing went before him like a smoke in the light of the moon. So they came to the dead-cairn, and they laid their ears to the stones; and the dead complained withinsides like a swarm of bees: "Time was that marrow was in our bones, and strength in our sinews; and the thoughts of our head were clothed upon with acts and the words of men. But now are we broken in sunder, and the bonds of our bones are loosed, and our thoughts lie in the dust."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 362
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10061
        "line_end": 10072
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10061-10072"
    "translation_ja": |-
      そうして二人は羊の小島に着いた。海のただ中で島のぐるりに波が砕け、あたり一面が羊歯の緑に覆われ、露に濡れ、月に照らされていた。二人は入江に舟を乗り入れて上陸した。深い羊歯の茂る岩のあいだを男は重い足取りで後から行き、あわれなものは月明かりの中、煙のように先に立った。死者の石塚に着くと、二人は石に耳を当てた。中で死者たちが蜂の群れのように嘆いていた。「我らの骨に髄があり、筋に力が宿った時もあった。頭に浮かんだ思いは、人間の行いと言葉とを衣のようにまとっていた。だが今はばらばらに砕け、骨を結ぶものは解け、我らの思いは塵の中に横たわる」
    "translation_status": "reviewed"
  - "id": "f19-013"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then said the Poor Thing: \"Charge them that they give you the virtue they withheld.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 363
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10074
        "line_end": 10075
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10074-10075"
    "translation_ja": "するとあわれなものが言った。「授けずにおいた力を渡せと、命じてください」"
    "translation_status": "reviewed"
  - "id": "f19-014"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And the man said: "Bones of my fathers, greeting! for I am sprung of your loins. And now, behold, I break open the piled stones of your cairn, and I let in the noon between your ribs. Count it well done, for it was to be; and give me what I come seeking in the name of blood and in the name of God."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 364
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10077
        "line_end": 10081
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10077-10081"
    "translation_ja": |-
      男は言った。「わが先祖の骨よ、挨拶を申す。私はあなたがたの血を引く者である。今、ごらんあれ、あなたがたの塚の積み石を破って開き、肋のあいだへ真昼の光を差し入れます。なすべく定まっていたことゆえ、よくしたと思ってください。そして血の名において、神の名において、私が求めに来たものをお与えください」
    "translation_status": "reviewed"
  - "id": "f19-015"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And the spirits of the dead stirred in the cairn like ants; and they spoke: "You have broken the roof of our cairn and let in the noon between our ribs; and you have the strength of the still-living. But what virtue have we? what power? or what jewel here in the dust with us, that any living man should covet or receive it? for we are less than nothing. But we tell you one thing, speaking with many voices like bees, that the way is plain before all like the grooves of launching: So forth into life and fear not, for so did we all in the ancient ages." And their voices passed away like an eddy in a river.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 365
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10083
        "line_end": 10091
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10083-10091"
    "translation_ja": |-
      死者たちの霊は、石塚の中で蟻のようにうごめき、こう言った。「お前は塚の屋根を破り、わしらの肋のあいだへ真昼を差し入れた。まだ生きている者の強さがお前にはある。だがわしらに何の効力がある？　何の力が？　この塵の中でわしらとともにあるどんな宝を、生きた人間が欲しがったり受け取ったりしよう？　わしらは無にも劣る。だが蜂のように声を重ねて、一つだけ告げよう。どの者の前にも道はくっきり延びている。舟を海へ出す滑り溝のように。ならば生へと踏み出せ、恐れるな。遠い昔、わしらもみなそうしたのだから」そうしてその声は川の渦のように消えていった。
    "translation_status": "reviewed"
  - "id": "f19-016"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now," said the Poor Thing, "they have told you a lesson, but make them give you a gift. Stoop your hand among the bones without drawback, and you shall find their treasure."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 366
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10093
        "line_end": 10095
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10093-10095"
    "translation_ja": "「さて」とあわれなものは言った。「教えは授けてもらいました。今度は贈り物を渡させるのです。ひるまずに骨のあいだへ手を差し下ろしなさい。宝が手に入るでしょう」"
    "translation_status": "reviewed"
  - "id": "f19-017"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the man stooped his hand, and the dead laid hold upon it many and faint like ants; but he shook them off, and behold, what he brought up in his hand was the shoe of a horse, and it was rusty.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 367
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10097
        "line_end": 10099
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10097-10099"
    "translation_ja": "男が手を差し下ろすと、大勢の死者が蟻のような弱々しい力ですがりついた。だが彼が振り払ってみると、なんと引き上げた手にあったのは馬の蹄鉄だった。それも錆びていた。"
    "translation_status": "reviewed"
  - "id": "f19-018"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It is a thing of no price,\" quoth the man, \"for it is rusty.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 368
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10101
        "line_end": 10101
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10101-10101"
    "translation_ja": "「値打ちのないものだ」と男は言った。「錆びている」"
    "translation_status": "reviewed"
  - "id": "f19-019"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "We shall see that," said the Poor Thing; "for in my thought it is a good thing to do what our fathers did, and to keep what they kept without question. And in my thought one thing is as good as another in this world; and a shoe of a horse will do."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 369
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10103
        "line_end": 10106
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10103-10106"
    "translation_ja": |-
      「それはどうでしょう」とあわれなものは言った。「私の思うに、先祖たちがしたとおりにすること、先祖たちが取っておいたものを何も問わずに取っておくことは良いことです。それにこの世では、どんな物もほかの物に劣りはしないと思うのです。馬の蹄鉄で結構です」
    "translation_status": "reviewed"
  - "id": "f19-020"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now they got into their boat with the horse-shoe, and when the dawn was come they were aware of the smoke of the Earl's town and the bells of the Kirk that beat. So they set foot to shore: and the man went up to the market among the fishers over against the palace and the Kirk; and he was bitter poor and bitter ugly, and he had never a fish to sell, but only a shoe of a horse in his creel, and it rusty.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 370
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10108
        "line_end": 10113
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10108-10113"
    "translation_ja": |-
      二人は蹄鉄を持って舟に乗り、夜明けが来ると、伯爵の町から上がる煙が見え、教会の鐘が響くのが聞こえた。そこで岸に上がった。男は市に立つ漁師たちのあいだへ、御殿と教会の真向かいへ出ていった。ひどく貧しく、ひどく醜く、売る魚ひとつなく、魚籠にあるのは馬の蹄鉄だけ、それも錆びていた。
    "translation_status": "reviewed"
  - "id": "f19-021"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Now,\" said the Poor Thing, \"do so and so, and you shall find a wife and I a mother.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 371
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10115
        "line_end": 10116
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10115-10116"
    "translation_ja": "「さて」とあわれなものは言った。「しかじかのとおりになされば、あなたは妻を、私は母を見つけます」"
    "translation_status": "reviewed"
  - "id": "f19-022"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      It befell that the Earl's daughter came forth to go into the Kirk upon her prayers; and when she saw the poor man stand in the market with only the shoe of a horse, and it rusty, it came in her mind it should be a thing of price.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 372
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10118
        "line_end": 10121
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10118-10121"
    "translation_ja": "折しも伯爵の娘が祈りを捧げに教会へ出かけてきた。貧しい男が市に立ち、馬の蹄鉄一つしか持っておらず、しかもそれが錆びているのを見ると、これはきっと値打ちのあるものだと思った。"
    "translation_status": "reviewed"
  - "id": "f19-023"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"What is that?\" quoth she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 373
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10123
        "line_end": 10123
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10123-10123"
    "translation_ja": "「それは何？」と彼女は言った。"
    "translation_status": "reviewed"
  - "id": "f19-024"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It is a shoe of a horse,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 374
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10125
        "line_end": 10125
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10125-10125"
    "translation_ja": "「馬の蹄鉄です」と男は言った。"
    "translation_status": "reviewed"
  - "id": "f19-025"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And what is the use of it?\" quoth the Earl's daughter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 375
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10127
        "line_end": 10127
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10127-10127"
    "translation_ja": "「それで何の役に立つの？」と伯爵の娘。"
    "translation_status": "reviewed"
  - "id": "f19-026"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It is for no use,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 376
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10129
        "line_end": 10129
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10129-10129"
    "translation_ja": "「何の役にも立ちません」と男。"
    "translation_status": "reviewed"
  - "id": "f19-027"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I may not believe that,\" said she; \"else why should you carry it?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 377
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10131
        "line_end": 10131
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10131-10131"
    "translation_ja": "「それは信じられません」と彼女は言った。「でなければ、なぜ持ち歩くの？」"
    "translation_status": "reviewed"
  - "id": "f19-028"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I do so," said he, "because it was so my fathers did in the ancient ages; and I have neither a better reason nor a worse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 378
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10133
        "line_end": 10134
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10133-10134"
    "translation_ja": "「そうしますのは」と彼は言った。「遠い昔、わしの先祖たちがそうしたからです。それよりましな理由も、劣る理由もありません」"
    "translation_status": "reviewed"
  - "id": "f19-029"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now the Earl's daughter could not find it in her mind to believe him. "Come," quoth she, "sell me this, for I am sure it is a thing of price."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 379
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10136
        "line_end": 10137
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10136-10137"
    "translation_ja": "伯爵の娘はどう考えても彼の話を信じきれなかった。「ねえ、それを売ってちょうだい」と彼女は言った。「きっと値打ちのある品に違いないわ」"
    "translation_status": "reviewed"
  - "id": "f19-030"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Nay,\" said the man, \"the thing is not for sale.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 380
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10139
        "line_end": 10139
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10139-10139"
    "translation_ja": "「いえ」と男。「これは売り物ではありません」"
    "translation_status": "reviewed"
  - "id": "f19-031"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "What!" cried the Earl's daughter. "Then what make you here in the town's market, with the thing in your creel and nought beside?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 381
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10141
        "line_end": 10142
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10141-10142"
    "translation_ja": "「まあ！」伯爵の娘は叫んだ。「では、この町の市で何をしているの？　魚籠にはそれきりで、ほかに何も入っていないのに」"
    "translation_status": "reviewed"
  - "id": "f19-032"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I sit here,\" says the man, \"to get me a wife.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 382
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10144
        "line_end": 10144
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10144-10144"
    "translation_ja": "「わしがここに座っているのは」と男は言った。「妻をもらうためです」"
    "translation_status": "reviewed"
  - "id": "f19-033"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "There is no sense in any of these answers," thought the Earl's daughter; "and I could find it in my heart to weep."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 383
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10146
        "line_end": 10147
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10146-10147"
    "translation_ja": "「どのお返事もまるでわけが分からない」と伯爵の娘は思った。「なんだか泣きたくなってきた」"
    "translation_status": "reviewed"
  - "id": "f19-034"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      By came the Earl upon that; and she called him and told him all. And when he had heard, he was of his daughter's mind that this should be a thing of virtue; and charged the man to set a price upon the thing, or else be hanged upon the gallows; and that was near at hand, so that the man could see it.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 384
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10149
        "line_end": 10153
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10149-10153"
    "translation_ja": |-
      そこへ伯爵が通りかかったので、娘は呼び止めて一部始終を話した。聞き終わると、その品には何か不思議な力があるに違いないと、伯爵も娘と同じ意見になった。男に値をつけろ、さもなくば絞首台に吊るす、と命じた。絞首台はすぐそばにあって、男の目にも見えた。
    "translation_status": "reviewed"
  - "id": "f19-035"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "The way of life is straight like the grooves of launching," quoth the man. "And if I am to be hanged let me be hanged."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 385
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10155
        "line_end": 10156
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10155-10156"
    "translation_ja": "「生きる道はまっすぐです。舟を海へ出す滑り溝のように」と男は言った。「吊るされることになっているのなら、吊るされましょう」"
    "translation_status": "reviewed"
  - "id": "f19-036"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Why!\" cried the Earl, \"will you set your neck against a shoe of a horse, and it rusty?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 386
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10158
        "line_end": 10159
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10158-10159"
    "translation_ja": "「なんと！」と伯爵は叫んだ。「馬の蹄鉄一つ、それも錆びたやつに、おのれの首を賭けるのか？」"
    "translation_status": "reviewed"
  - "id": "f19-037"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "In my thought," said the man, "one thing is as good as another in this world; and the shoe of a horse will do."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 387
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10161
        "line_end": 10162
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10161-10162"
    "translation_ja": "「わしの思うに」と男は言った。「この世では、どんな物もほかの物に劣りはしません。馬の蹄鉄で結構です」"
    "translation_status": "reviewed"
  - "id": "f19-038"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"This can never be,\" thought the Earl; and he stood and looked upon the man, and bit his beard."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 388
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10164
        "line_end": 10165
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10164-10165"
    "translation_ja": "「そんなことがあるものか」と伯爵は思い、じっと立って男を眺め、あごひげを噛んだ。"
    "translation_status": "reviewed"
  - "id": "f19-039"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And the man looked up at him and smiled. "It was so my fathers did in the ancient ages," quoth he to the Earl, "and I have neither a better reason nor a worse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 389
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10167
        "line_end": 10169
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10167-10169"
    "translation_ja": "男は伯爵を見上げて微笑んだ。「遠い昔、わしの先祖たちがそうしたのです」と伯爵に言った。「それよりましな理由も、劣る理由もありません」"
    "translation_status": "reviewed"
  - "id": "f19-040"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "There is no sense in any of this," thought the Earl, "and I must be growing old." So he had his daughter on one side, and says he: "Many suitors have you denied, my child. But here is a very strange matter that a man should cling so to a shoe of a horse, and it rusty; and that he should offer it like a thing on sale, and yet not sell it; and that he should sit there seeking a wife. If I come not to the bottom of this thing, I shall have no more pleasure in bread; and I can see no way, but either I should hang or you should marry him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 390
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10171
        "line_end": 10178
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10171-10178"
    "translation_ja": |-
      「どれもこれも、まるでわけが分からん」と伯爵は思った。「わしも年を取り始めたか」そこで娘をわきへ呼んで言った。「お前はこれまで多くの求婚者を断ってきた。だがこれはまことに妙な話だ。一人の男が馬の蹄鉄に、それも錆びた蹄鉄に、こうまで執着する。売り物のように差し出しながら、売ろうとはしない。しかも妻が欲しいと言って、そこに座っている。この話の底が知れぬようでは、わしはもうパンを食べてもおいしくはあるまい。どうも、わしがあの男を吊るすか、お前が妻になるか、二つに一つしかないようだ」
    "translation_status": "reviewed"
  - "id": "f19-041"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "By my troth, but he is bitter ugly," said the Earl's daughter. "How if the gallows be so near at hand?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 391
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10180
        "line_end": 10181
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10180-10181"
    "translation_ja": "「ほんとうに、でもひどく醜い人だわ」と伯爵の娘。「絞首台があんなに近くにあるのなら、そっちではいけないの？」"
    "translation_status": "reviewed"
  - "id": "f19-042"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "It was not so," said the Earl, "that my fathers did in the ancient ages. I am like the man, and can give you neither a better reason nor a worse. But do you, prithee, speak with him again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 392
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10183
        "line_end": 10185
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10183-10185"
    "translation_ja": |-
      「遠い昔」と伯爵は言った。「わしの先祖たちがしたのは、そういうことではなかった。わしもあの男と同じだ。それよりましな理由も劣る理由も、お前には言えない。だが、お願いだ、もう一度あれと話してみてくれ」
    "translation_status": "reviewed"
  - "id": "f19-043"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the Earl's daughter spoke to the man. "If you were not so bitter ugly," quoth she, "my father the Earl would have us marry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 393
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10187
        "line_end": 10188
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10187-10188"
    "translation_ja": "そこで伯爵の娘は男に声をかけた。「あなたがそんなにひどく醜くなかったら、父の伯爵は私たちをめあわせたいそうよ」"
    "translation_status": "reviewed"
  - "id": "f19-044"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Bitter ugly am I," said the man, "and you as fair as May. Bitter ugly I am, and what of that? It was so my fathers----"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 394
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10190
        "line_end": 10191
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10190-10191"
    "translation_ja": "「いかにも、わしはひどく醜い」と男。「あなたは五月のようにお美しい。わしはひどく醜い、だからなんだというのです？　わしの先祖がそう……」"
    "translation_status": "reviewed"
  - "id": "f19-045"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"In the name of God,\" said the Earl's daughter, \"let your fathers be!\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 395
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10193
        "line_end": 10193
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10193-10193"
    "translation_ja": "「神さまにかけて」と伯爵の娘は言った。「ご先祖の話はもうやめて！」"
    "translation_status": "reviewed"
  - "id": "f19-046"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "If I had done that," said the man, "you had never been chaffering with me here in the market, nor your father the Earl watching with the end of his eye."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 396
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10195
        "line_end": 10197
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10195-10197"
    "translation_ja": "「もしそうしていたら」と男は言った。「あなたがこうして市でわしと掛け合いをすることも、お父上の伯爵が横目でそれをのぞくこともなかったでしょう」"
    "translation_status": "reviewed"
  - "id": "f19-047"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "But come," quoth the Earl's daughter, "this is a very strange thing, that you would have me wed for a shoe of a horse, and it rusty."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 397
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10199
        "line_end": 10200
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10199-10200"
    "translation_ja": "「それにしても」と伯爵の娘。「錆びた馬の蹄鉄一つで私に結婚しろというのは、ずいぶんおかしな話だわ」"
    "translation_status": "reviewed"
  - "id": "f19-048"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"In my thought,\" quoth the man, \"one thing is as good----\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 398
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10202
        "line_end": 10202
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10202-10202"
    "translation_ja": "「わしの思うに」と男。「どんな物もほかの物に……」"
    "translation_status": "reviewed"
  - "id": "f19-049"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O, spare me that,\" said the Earl's daughter, \"and tell me why I should marry.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 399
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10204
        "line_end": 10205
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10204-10205"
    "translation_ja": "「ああ、それはもう結構」と伯爵の娘。「なぜ私が結婚しなければならないのか、言ってちょうだい」"
    "translation_status": "reviewed"
  - "id": "f19-050"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Listen and look,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 400
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10207
        "line_end": 10207
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10207-10207"
    "translation_ja": "「耳をすまし、目をお向けなさい」と男は言った。"
    "translation_status": "reviewed"
  - "id": "f19-051"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now the wind blew through the Poor Thing like an infant crying, so that her heart was melted; and her eyes were unsealed, and she was aware of the thing as it were a babe unmothered, and she took it to her arms and it melted in her arms like the air.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 401
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10209
        "line_end": 10212
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10209-10212"
    "translation_ja": |-
      すると風があわれなものを吹き抜け、みどりごの泣き声のように鳴ったので、娘の心はとろけた。目を覆っていたものが落ちると、そのものは母のない赤子のように見えた。彼女が抱き上げると、それは腕の中で空気のように溶けてしまった。
    "translation_status": "reviewed"
  - "id": "f19-052"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Come," said the man, "behold a vision of our children, the busy hearth, and the white heads. And let that suffice, for it is all God offers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 402
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10214
        "line_end": 10215
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10214-10215"
    "translation_ja": |-
      「さあ」と男は言った。「わしたちの子供たちを、にぎやかな炉辺を、やがて白髪になるわしたちの姿を、まぼろしのうちにごらんなさい。それで十分としてください。神が差し出されるのは、それがすべてですから」
    "translation_status": "reviewed"
  - "id": "f19-053"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I have no delight in it,\" said she; but with that she sighed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 403
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10217
        "line_end": 10217
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10217-10217"
    "translation_ja": "「私はそれをうれしいとは思いません」と彼女は言った。だがそう言いながら、ため息をついた。"
    "translation_status": "reviewed"
  - "id": "f19-054"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "The ways of life are straight like the grooves of launching," said the man; and he took her by the hand.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 404
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10219
        "line_end": 10220
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10219-10220"
    "translation_ja": "「生きる道はまっすぐです。舟を海へ出す滑り溝のように」と男は言って、彼女の手を取った。"
    "translation_status": "reviewed"
  - "id": "f19-055"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And what shall we do with the horse-shoe?\" quoth she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 405
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10222
        "line_end": 10222
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10222-10222"
    "translation_ja": "「それで、蹄鉄はどうします？」と彼女。"
    "translation_status": "reviewed"
  - "id": "f19-056"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I will give it to your father," said the man; "and he can make a kirk and a mill of it for me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 406
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10224
        "line_end": 10225
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10224-10225"
    "translation_ja": "「お父上に差し上げましょう」と男は言った。「教会にでも水車小屋にでも、お好きなものにお使いになればいい」"
    "translation_status": "reviewed"
  - "id": "f19-057"
    "section_id": "fable-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      It came to pass in time that the Poor Thing was born; but memory of these matters slept with him, and he knew not that which he had done. But he was a part of the eldest son; rejoicing manfully to launch the boat into the surf, skilful to direct the helm, and a man of might where the ring closes and the blows are going.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 407
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10227
        "line_end": 10231
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10227-10231"
    "translation_ja": |-
      時が満ち、やがてあわれなものは生まれた。だがこうした出来事の記憶はその身の中で眠っていて、自らが何をしたのかは知らなかった。それでも長男の一部分となり、砕ける波へ舟を押し出すのを男らしく喜び、巧みに舵を操り、人の輪が狭まり拳が飛び交うところではたくましい男だった。
    "translation_status": "reviewed"
  - "id": "f20-000"

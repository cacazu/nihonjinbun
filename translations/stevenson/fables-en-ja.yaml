        "original_unit_id": "pg30650-lines-9156-9160"
    "translation_ja": |-
      まだ食べていると、部屋におじそっくりの姿が入ってきた。剣を持ち出したのでジャックは怖くなった。だがおじはいつになく優しく、一緒に腰を下ろして食事をし、剣を持ってきたことを褒めてくれた。これほど楽しく二人で過ごしたことはなく、ジャックの胸はおじへの愛でいっぱいになった。
    "translation_status": "reviewed"
  - "id": "f08-026"

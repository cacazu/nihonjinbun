      Now when the nine years were gone, the King's daughter of Duntrine got her to her feet, like one that remembers; and she looked about her in the masoned house; and all her servants were gone; only the man that piped sat upon the terrace with the hood upon his face; and as he piped the leaves ran about the terrace and the sea beat along the wall. Then she cried to him with a great voice, "This is the hour, and let me see the power in it." And with that the wind blew off the hood from the man's face, and, lo! there was no man there, only the clothes and the hood and the pipes tumbled one upon another in a corner of the terrace, and the dead leaves ran over them.

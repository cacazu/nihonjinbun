        "line_end": 9169
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9168-9169"
    "translation_ja": "「なんと！」おじは叫んだ。「この火で暖まったのではないか？　この食べ物がお前を養うのではないか？」"
    "translation_status": "reviewed"
  - "id": "f08-029"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I see the food to be wholesome," said Jack; "and still it is no proof that a man should wear a gyve on his right leg."

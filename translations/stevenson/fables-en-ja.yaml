    "source_text": |-
      XX
      THE SONG OF THE MORROW
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 408
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10236
        "line_end": 10238
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10236-10238"
    "translation_ja": "二十　明日への歌"
    "translation_status": "reviewed"
  - "id": "f20-001"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The King of Duntrine had a daughter when he was old, and she was the fairest King's daughter between two seas; her hair was like spun gold, and her eyes like pools in a river; and the King gave her a castle upon the sea beach, with a terrace, and a court of the hewn stone, and four towers at the four corners. Here she dwelt and grew up, and had no care for the morrow, and no power upon the hour, after the manner of simple men.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 409
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10241
        "line_end": 10247
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10241-10247"
    "translation_ja": |-
      ダントラインの王には、年を取ってから娘がひとり生まれた。二つの海にはさまれた地に、これほど美しい王の娘はなかった。髪は紡いだ黄金のようで、目は川の淵のようだった。王は娘に浜辺の城を与えた。そこには露台と切石造りの中庭があり、四隅には四つの塔が立っていた。娘はそこで暮らし、成長した。世の素朴な人々のならいに従い、明日を案じることもなく、今この時を支配する力も持たなかった。
    "translation_status": "reviewed"
  - "id": "f20-002"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      It befell that she walked one day by the beach of the sea when it was autumn, and the wind blew from the place of rains; and upon the one hand of her the sea beat, and upon the other the dead leaves ran. This was the loneliest beach between two seas, and strange things had been done there in the ancient ages. Now the King's daughter was aware of a crone that sat upon the beach. The sea-foam ran to her feet, and the dead leaves swarmed about her back, and the rags blew about her face in the blowing of the wind.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 410
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10249
        "line_end": 10256
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10249-10256"
    "translation_ja": |-
      ある秋の日、王の娘が海辺を歩いていると、雨の国から風が吹き、片側では海が打ち寄せ、もう片側では枯れ葉が走った。二つの海のあいだでいちばん寂しい浜辺で、遠い昔にはそこで不思議なことが行われたという。王の娘は、浜に腰を下ろしたひとりの老婆に気づいた。波の泡は老婆の足へと走り、枯れ葉は背のまわりに群がり、風が吹くたびに襤褸が顔のまわりにひらめいた。
    "translation_status": "reviewed"
  - "id": "f20-003"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now," said the King's daughter, and she named a holy name, "this is the most unhappy old crone between two seas."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 411
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10258
        "line_end": 10259
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10258-10259"
    "translation_ja": "「まあ」と王の娘は聖なる御名を唱えて言った。「二つの海のあいだで、あの年寄りほど不幸な人はないわ」"
    "translation_status": "reviewed"
  - "id": "f20-004"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Daughter of a King," said the crone, "you dwell in a stone house, and your hair is like the gold: but what is your profit? Life is not long, nor lives strong; and you live after the way of simple men, and have no thought for the morrow and no power upon the hour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 412
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10261
        "line_end": 10264
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10261-10264"
    "translation_ja": |-
      「王の娘よ」と老婆は言った。「お前は石の家に住み、髪は黄金のようだ。だがお前に何の得がある？　人生は長くなく、命は強くない。お前は素朴な人々の流儀で暮らし、明日を思うこともなく、今この時を支配する力も持たない」
    "translation_status": "reviewed"
  - "id": "f20-005"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Thought for the morrow, that I have," said the King's daughter; "but power upon the hour, that have I not." And she mused with herself.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 413
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10266
        "line_end": 10267
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10266-10267"
    "translation_ja": "「明日を思う心なら持っています」と王の娘は言った。「でも今この時を支配する力、それは持っていません」そうしてひとり物思いに沈んだ。"
    "translation_status": "reviewed"
  - "id": "f20-006"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Then the crone smote her lean hands one within the other, and laughed like a sea-gull. "Home!" cried she. "O daughter of a King, home to your stone house; for the longing is come upon you now, nor can you live any more after the manner of simple men. Home, and toil and suffer, till the gift come that will make you bare, and till the man come that will bring you care."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 414
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10269
        "line_end": 10274
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10269-10274"
    "translation_ja": |-
      すると老婆はやせた手と手をぱんと打ち合わせ、かもめのように笑った。「お帰り！」と叫んだ。「おお王の娘よ、石の家へお帰り。もうお前にはあこがれが取りついた。もはや素朴な人々のならいでは生きられぬ。帰って骨を折り、苦しむがいい。お前を丸裸にする贈り物が来るまで、お前に憂いをもたらす男が来るまで」
    "translation_status": "reviewed"
  - "id": "f20-007"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The King's daughter made no more ado, but she turned about and went home to her house in silence. And when she was come into her chamber she called for her nurse.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 415
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10276
        "line_end": 10278
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10276-10278"
    "translation_ja": "王の娘はそれ以上何もせず、向きを変えて黙ったまま石の家へ帰った。自分の部屋に入ると乳母を呼んだ。"
    "translation_status": "reviewed"
  - "id": "f20-008"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Nurse," said the King's daughter, "thought is come upon me for the morrow, so that I can live no more after the manner of simple men. Tell me what I must do that I may have power upon the hour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 416
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10280
        "line_end": 10282
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10280-10282"
    "translation_ja": "「ばあや」と王の娘は言った。「明日を思う心が私に取りついて、もう素朴な人々のならいでは生きられません。今この時を支配する力を持つには、何をすればよいか教えてちょうだい」"
    "translation_status": "reviewed"
  - "id": "f20-009"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Then the nurse moaned like a snow wind. "Alas!" said she, "that this thing should be; but the thought is gone into your marrow, nor is there any cure against the thought. Be it so, then, even as you will; though power is less than weakness, power shall you have; and though the thought is colder than winter, yet shall you think it to an end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 417
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10284
        "line_end": 10288
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10284-10288"
    "translation_ja": |-
      すると乳母は雪風のようにうめいた。「ああ、こうなるとは！」と乳母は言った。「けれどもお思いはもう骨の髄までしみ込んでしまった。そのお思いを治す薬はございません。ならばお望みのままになさいませ。力は弱さに劣るものながら、力をお持ちになるがよい。その思いは冬よりも冷たいものながら、行き着くところまで思い抜かれるがよい」
    "translation_status": "reviewed"
  - "id": "f20-010"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the King's daughter sat in her vaulted chamber in the masoned house, and she thought upon the thought. Nine years she sat; and the sea beat upon the terrace, and the gulls cried about the turrets, and wind crooned in the chimneys of the house. Nine years she came not abroad, nor tasted the clean air, neither saw God's sky. Nine years she sat and looked neither to the right nor to the left, nor heard speech of any one, but thought upon the thought of the morrow. And her nurse fed her in silence, and she took of the food with her left hand, and ate it without grace.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 418
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10290
        "line_end": 10298
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10290-10298"
    "translation_ja": |-
      そこで王の娘は石造りの家の、アーチ天井の部屋に座して、その思いを思いつづけた。九年、娘は座した。海は露台に打ち寄せ、小塔のまわりでかもめが鳴き、風が家の煙突で低くうなった。九年、外に出ず、清らかな空気を味わわず、神の空を見ることもなかった。九年、右も見ず左も見ず、だれの話す言葉も耳にせず座し、ただ明日への思いを思いつづけた。乳母は黙って食べ物を出し、娘は左手でそれを取って、感謝の祈りも唱えずに食べた。
    "translation_status": "reviewed"
  - "id": "f20-011"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now when the nine years were out, it fell dusk in the autumn, and there came a sound in the wind like a sound of piping. At that the nurse lifted up her finger in the vaulted house.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 419
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10300
        "line_end": 10302
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10300-10302"
    "translation_ja": "その九年が満ち、秋の夕闇が下りる頃、風のうちに笛の音のような音がした。アーチ天井の家の中で、乳母は指を一本立てた。"
    "translation_status": "reviewed"
  - "id": "f20-012"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I hear a sound in the wind,\" said she, \"that is like the sound of piping.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 420
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10304
        "line_end": 10305
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10304-10305"
    "translation_ja": "「風のうちに音が聞こえます」と言った。「笛の音のような音が」"
    "translation_status": "reviewed"
  - "id": "f20-013"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It is but a little sound,\" said the King's daughter, \"but yet it is sound enough for me.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 421
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10307
        "line_end": 10308
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10307-10308"
    "translation_ja": "「ほんの小さな音ですね」と王の娘。「けれど私にはそれで十分です」"
    "translation_status": "reviewed"
  - "id": "f20-014"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So they went down in the dusk to the doors of the house, and along the beach of the sea. And the waves beat upon the one hand, and upon the other the dead leaves ran; and the clouds raced in the sky, and the gulls flew widdershins. And when they came to that part of the beach where strange things had been done in the ancient ages, lo! there was the crone, and she was dancing widdershins.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 422
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10310
        "line_end": 10315
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10310-10315"
    "translation_ja": |-
      そこで二人は薄闇の中、階下の戸口へ降り、浜辺を歩いていった。片側では波が打ち寄せ、もう片側では枯れ葉が走り、空では雲が駆け、かもめは日のめぐりに逆らって飛んでいた。遠い昔、不思議なことが行われたその浜辺に二人が来てみると、見よ、老婆がいる。日のめぐりに逆らって踊っている。
    "translation_status": "reviewed"
  - "id": "f20-015"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "What makes you dance widdershins, old crone?" said the King's daughter; "here upon the bleak beach, between the waves and the dead leaves?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 423
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10317
        "line_end": 10318
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10317-10318"
    "translation_ja": "「なぜ日のめぐりに逆らって踊るの、おばあさん？」と王の娘は言った。「この荒れた浜辺の、波と枯れ葉とのあいだで？」"
    "translation_status": "reviewed"
  - "id": "f20-016"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I hear a sound in the wind that is like a sound of piping," quoth she. "And it is for that that I dance widdershins. For the gift comes that will make you bare, and the man comes that must bring you care. But for me the morrow is come that I have thought upon, and the hour of my power."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 424
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10320
        "line_end": 10324
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10320-10324"
    "translation_ja": |-
      「風のうちに音が聞こえる、笛の音のような音が」と老婆。「だから私は日のめぐりに逆らって踊る。お前を丸裸にする贈り物が来る。お前に憂いをもたらす男が来る。けれど私には、思いつづけた明日が、私の力が及ぶ時が来たのだ」
    "translation_status": "reviewed"
  - "id": "f20-017"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "How comes it, crone," said the King's daughter, "that you waver like a rag, and pale like a dead leaf before my eyes?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 425
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10326
        "line_end": 10327
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10326-10327"
    "translation_ja": "「おばあさん、どうしたの？」と王の娘。「目の前で襤褸のように揺れ、枯れ葉のように色を失っていくのは、なぜ？」"
    "translation_status": "reviewed"
  - "id": "f20-018"
    "section_id": "fable-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Because the morrow has come that I have thought upon, and the hour of my power," said the crone; and she fell on the beach, and, lo! she was but stalks of the sea tangle, and dust of the sea sand, and the sand-lice hopped upon the place of her.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 426
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 10329
        "line_end": 10332
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-10329-10332"
    "translation_ja": "「思いつづけた明日が、私の力が及ぶ時が来たからだ」と老婆は言った。そして浜辺に倒れた。すると見よ、それはただ海藻の茎と浜砂の塵でしかなく、老婆のいた場所でハマトビムシが跳ねていた。"

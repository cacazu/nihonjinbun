    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Are there no thunderbolts for these strangers?\" asked Jack."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 104
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9049
        "line_end": 9049
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9049-9049"
    "translation_ja": "「よその人には雷は落ちないの？」とジャック。"
    "translation_status": "reviewed"
  - "id": "f08-005"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Jupiter is long-suffering to the benighted,\" returned the catechist."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 105
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9051
        "line_end": 9051
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9051-9051"
    "translation_ja": "「ジュピターは無知蒙昧な者には気の長い神なのだ」とおじは答えた。"
    "translation_status": "reviewed"
  - "id": "f08-006"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Upon my word, I could wish I had been less fortunate," said Jack. "For if I had been born benighted, I might now be going free; and it cannot be denied the iron is inconvenient, and the ulcer hurts."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 106
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9053
        "line_end": 9055
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9053-9055"
    "translation_ja": "「それなら、ぼくはもう少し運が悪けりゃよかったよ」とジャック。「生まれたときに無知蒙昧だったら、今ごろ自由に歩けたのかもしれない。だって鉄の枷は不便だし、傷が痛いことは否定できないもの」"
    "translation_status": "reviewed"
  - "id": "f08-007"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Ah!" cried his uncle, "do not envy the heathen! Theirs is a sad lot! Ah, poor souls, if they but knew the joys of being fettered! Poor souls, my heart yearns for them. But the truth is they are vile, odious, insolent, ill-conditioned, stinking brutes, not truly human--for what is a man without a fetter?--and you cannot be too particular not to touch or speak with them."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 107
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9057
        "line_end": 9062
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9057-9062"
    "translation_ja": |-
      「ああ！」おじは叫んだ。「異教徒をうらやむな！　彼らは悲しい巡り合わせにある。ああ、哀れな魂よ、足枷につながれる喜びを知ってさえいたら！　哀れな魂たち、思えば胸がいっぱいになる。しかし実を言うと、あれは下劣で、忌まわしく、思い上がった、たちの悪い、臭いけだものなのだ。本当の人間ではない。足枷のない人間など、そもそも何だというのだ？　触ったり、口をきいたりしないよう、いくら用心してもしすぎることはないぞ」
    "translation_status": "reviewed"
  - "id": "f08-008"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      After this talk, the child would never pass one of the unfettered on the road but what he spat at him and called him names, which was the practice of the children in that part.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 108
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9064
        "line_end": 9066
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9064-9066"
    "translation_ja": "この話があってからというもの、道で足枷のない人に出くわすと、子供は必ず唾を吐きかけ、悪口を浴びせた。その土地の子供たちの習わしだった。"
    "translation_status": "reviewed"
  - "id": "f08-009"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      It chanced one day, when he was fifteen, he went into the woods, and the ulcer pained him. It was a fair day, with a blue sky; all the birds were singing; but Jack nursed his foot. Presently, another song began; it sounded like the singing of a person, only far more gay; at the same time there was a beating on the earth. Jack put aside the leaves; and there was a lad of his own village, leaping, and dancing and singing to himself in a green dell; and on the grass beside him lay the dancer's iron.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 109
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9068
        "line_end": 9075
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9068-9075"
    "translation_ja": |-
      十五になったある日、たまたま森へ入ったジャックは、ただれた傷がうずいてならなかった。空は青く晴れたよい日で、鳥はみな歌っていたが、ジャックは足をかかえていた。やがてもう一つの歌が始まった。人の歌声のようで、それにしてはずっと楽しげで、同時に地面を打つ音が聞こえた。木の葉を押し分けると、緑の谷間で同じ村の少年が跳ねたり踊ったり、ひとりで歌ったりしていた。かたわらの草の上には、踊り手の鉄の枷が転がっていた。
    "translation_status": "reviewed"
  - "id": "f08-010"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O!\" cried Jack, \"you have your fetter off!\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 110
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9077
        "line_end": 9077
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9077-9077"
    "translation_ja": "「あっ」とジャックは叫んだ。「足枷を外しているな！」"
    "translation_status": "reviewed"
  - "id": "f08-011"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"For God's sake, don't tell your uncle!\" cried the lad."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 111
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9079
        "line_end": 9079
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9079-9079"
    "translation_ja": "「後生だから、おじさんには言わないでくれ！」少年が叫んだ。"
    "translation_status": "reviewed"
  - "id": "f08-012"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"If you fear my uncle,\" returned Jack, \"why do you not fear the thunderbolt?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 112
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9081
        "line_end": 9082
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9081-9082"
    "translation_ja": "「おじさんが怖いのなら」とジャックは答えた。「どうして雷が怖くないの？」"
    "translation_status": "reviewed"
  - "id": "f08-013"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "That is only an old wives' tale," said the other. "It is only told to children. Scores of us come here among the woods and dance for nights together, and are none the worse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 113
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9084
        "line_end": 9086
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9084-9086"
    "translation_ja": "「そんなのは、ばあさんたちの作り話さ」と相手は言った。「子供にしか聞かせない話だよ。ぼくら仲間は何十人も森へ来て、幾晩も続けて踊るけれど、なんともないじゃないか」"
    "translation_status": "reviewed"
  - "id": "f08-014"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      This put Jack in a thousand new thoughts. He was a grave lad; he had no mind to dance himself; he wore his fetter manfully, and tended his ulcer without complaint. But he loved the less to be deceived or to see others cheated. He began to lie in wait for heathen travellers, at covert parts of the road, and in the dusk of the day, so that he might speak with them unseen; and these were greatly taken with their wayside questioner, and told him things of weight. The wearing of gyves (they said) was no command of Jupiter's. It was the contrivance of a white-faced thing, a sorcerer, that dwelt in that country in the Wood of Eld. He was one like Glaucus that could change his shape, yet he could be always told; for when he was crossed, he gobbled like a turkey. He had three lives; but the third smiting would make an end of him indeed; and with that his house of sorcery would vanish, the gyves fall, and the villagers take hands and dance like children.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 114
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9088
        "line_end": 9101
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9088-9101"
    "translation_ja": |-
      このことがジャックの胸に千もの新しい考えを呼び起こした。まじめな少年で、自分で踊る気はなかった。足枷も男らしく耐えてつけ、傷も泣き言ひとつ言わず手当てした。だが、自分がだまされたり、ほかの人が欺かれるのを見たりするのは、なおさら好かなかった。そこで、人に見られず話をしようと、日の暮れがた、街道の物陰で異教徒の旅人を待ち受けるようになった。旅人たちはこの道端の質問者をたいそう気に入り、重みのあることを教えてくれた。足枷をはめるのはジュピターのおきてではない、と彼らは言った。それはこの国の「いにしえの森」にすむ、顔の白いもの、ひとりの魔法使いの仕業なのだ。グラウコスのように姿を変えられるが、必ず見分けはつく。逆らわれると七面鳥のようにごろごろ鳴くからだ。命は三つあるが、三度目の一撃で今度こそ息の根は止まる。すると魔法の館は消え、足枷は落ち、村の人たちは手を取り合って子供のように踊るのだ。
    "translation_status": "reviewed"
  - "id": "f08-015"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And in your country?\" Jack would ask."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 115
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9103
        "line_end": 9103
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9103-9103"
    "translation_ja": "「それで、あなたのお国では？」とジャックはいつも尋ねた。"
    "translation_status": "reviewed"
  - "id": "f08-016"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      But at this, the travellers, with one accord, would put him off; until Jack began to suppose there was no land entirely happy. Or, if there were, it must be one that kept its folk at home; which was natural enough.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 116
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9105
        "line_end": 9108
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9105-9108"
    "translation_ja": |-
      しかしそうなると旅人たちは申し合わせたように話をはぐらかすので、ジャックは、何もかも幸福な国などないのだろうと思い始めた。たとえあっても、その国の人は国に留まって外へ出ないに違いない。それも至極もっともなことだった。
    "translation_status": "reviewed"
  - "id": "f08-017"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      But the case of the gyves weighed upon him. The sight of the children limping stuck in his eyes; the groans of such as dressed their ulcers haunted him. And it came at last in his mind that he was born to free them.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 117
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9110
        "line_end": 9113
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9110-9113"
    "translation_ja": |-
      それでも足枷のことが心に重くのしかかった。子供たちの足を引きずる姿は目に焼きつき、傷の手当てをする人々のうめき声が耳から離れなかった。そしてついには、自分はあの人たちを解放するために生まれたのだと思うようになった。
    "translation_status": "reviewed"
  - "id": "f08-018"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      There was in that village a sword of heavenly forgery, beaten upon Vulcan's anvil. It was never used but in the temple, and then the flat of it only; and it hung on a nail by the catechist's chimney. Early one night Jack rose, and took the sword, and was gone out of the house and the village in the darkness.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 118
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9115
        "line_end": 9119
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9115-9119"
    "translation_ja": |-
      その村には、ウルカヌスの金床で打たれた、天の鍛冶場の剣があった。神殿でしか使わず、そこでも平の部分しか使わない剣で、おじの家の暖炉わきの釘に掛かっていた。ある宵の口、ジャックは立ち上がって剣を取り、闇にまぎれ、家を出て村を去った。
    "translation_status": "reviewed"
  - "id": "f08-019"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      All night he walked at a venture; and when day came, he met strangers going to the fields. Then he asked after the Wood of Eld and the house of sorcery; and one said north, and one south; until Jack saw that they deceived him. So then, when he asked his way of any man, he showed the bright sword naked; and at that the gyve on the man's ankle rang and answered in his stead; and the word was still Straight on. But the man, when his gyve spoke, spat and struck at Jack, and threw stones at him as he went away; so that his head was broken.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 119
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9121
        "line_end": 9128
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9121-9128"
    "translation_ja": |-
      ひと晩じゅうあてもなく歩き、夜が明けると畑に向かう見知らぬ人たちに会った。いにしえの森と魔法の館を尋ねると、北と答える者も南と答える者もいて、ジャックはだまされていると気づいた。それからは道を尋ねるたびに輝く剣を抜いて見せた。すると相手の足首で枷が鳴り、本人に代わって答えた。返事はいつも「まっすぐに」。だが自分の足枷が口をきくと、その男はジャックに唾を吐き、殴りかかり、立ち去る背中に石を投げたので、ジャックは頭を割られた。
    "translation_status": "reviewed"

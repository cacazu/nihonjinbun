        "original_unit_id": "pg30650-lines-9153-9154"
    "translation_ja": "「不思議なことだ」と彼は思った。「魔法の館にこれほど身につく食べ物があるとは」"
    "translation_status": "reviewed"
  - "id": "f08-025"

    "translation_ja": |-
      「さて」と彼は言った。「魔法使いは死んだし、足枷はなくなった」だがその魂には幾つもの叫びが響き、昼が夜のようだった。「つらい仕事だった」と彼は言った。「森から出て、ぼくがほかの人たちにしてあげた良いことを見に行こう」
    "translation_status": "reviewed"

        "original_unit_id": "pg30650-lines-9183-9187"
    "translation_ja": |-
      叫びが耳に鳴り響き、ジャックの膝はぶつかり合い、良心が責め立てた。それでも力は強まり、骨の奥に、あの魔法使いの血を見たいという欲が目を覚ました。「足枷を落とすのなら」と彼は言った。「やり通すしかない。家に帰ったら、おじさんが踊っているのを見るのだ」
    "translation_status": "reviewed"

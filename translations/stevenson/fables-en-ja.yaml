  - "id": "f08-020"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So he came to that wood, and entered in, and he was aware of a house in a low place, where funguses grew, and the trees met, and the steaming of the marsh arose about it like a smoke. It was a fine house, and a very rambling; some parts of it were ancient like the hills, and some but of yesterday, and none finished; and all the ends of it were open, so that you could go in from every side. Yet it was in good repair, and all the chimneys smoked.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 120
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9130
        "line_end": 9136
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9130-9136"
    "translation_ja": |-
      そうしてその森に着き、奥へ入ると、低地に一軒の家が見えた。茸が生え、木々の梢が組み合い、沼から立つ湯気が煙のように家を取り巻いていた。立派で、ひどく建て増しの多い家だった。丘ほどに古いところも、昨日建ったばかりのところもあったが、仕上がっているところはなかった。どの端も開け放たれ、四方八方から中へ入れた。それでいて手入れはよく、煙突という煙突から煙が上っていた。
    "translation_status": "reviewed"
  - "id": "f08-021"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Jack went in through the gable; and there was one room after another, all bare, but all furnished in part, so that a man could dwell there; and in each there was a fire burning, where a man could warm himself, and a table spread where he might eat. But Jack saw nowhere any living creature; only the bodies of some stuffed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 121
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9138
        "line_end": 9142
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9138-9142"
    "translation_ja": |-
      ジャックは妻側から入った。部屋の奥にはまた部屋があり、どこもがらんとしていながら、人が住めるほどには家具があった。部屋ごとに火が燃えて、体を温められたし、卓には食事が調えてあった。しかし、生きたものの姿はどこにもなかった。ただ、いくつか剝製があるきりだった。
    "translation_status": "reviewed"
  - "id": "f08-022"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "This is a hospitable house," said Jack; "but the ground must be quaggy underneath, for at every step the building quakes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 122
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9144
        "line_end": 9145
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9144-9145"
    "translation_ja": "「客あしらいのよい家だ」とジャックは言った。「けれど真下は沼でぐずぐずなのだろう。一歩踏むたびに建物が震えるもの」"
    "translation_status": "reviewed"
  - "id": "f08-023"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      He had gone some time in the house, when he began to be hungry. Then he looked at the food, and at first he was afraid; but he bared the sword, and by the shining of the sword, it seemed the food was honest. So he took the courage to sit down and eat, and he was refreshed in mind and body.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 123
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9147
        "line_end": 9151
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9147-9151"
    "translation_ja": |-
      しばらく家の中を行くうちに、腹が減った。食べ物を眺めて、初めはおそろしく思ったが、剣を抜くと、その輝きに照らされた食べ物にはまやかしがないように見えた。そこで勇気を出して腰を下ろして食べると、身も心も元気を取り戻した。
    "translation_status": "reviewed"
  - "id": "f08-024"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "This is strange," thought he, "that in the house of sorcery there should be food so wholesome."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"

      「よろしい、スポーカー君」と船長。「しかし、それはひげを半分剃ったまま出歩いていい理由にはならん。ひとつ頭を働かせたまえ。哲学の目で眺めれば、われわれの境遇には何も新しいところはない。船は、いつかは沈むものとすれば、進水したときからずっと沈みつつあったとも言えるのだよ」
    "translation_status": "reviewed"
  - "id": "f02-003"

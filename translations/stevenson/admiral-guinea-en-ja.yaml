      ゴーント　次はどうだ？　海賊フリントの船に乗った。そこで何をしたかは私は知らぬ。海の奥深くに秘密は守られてきた。そうだ、最後の審判の日まで守られるだろう。神はおまえの目をつぶした。だがおまえはそのしるしに心を留めなかった。あれは神の最後の慈悲だ。これ以上望むな。ひざまずけ、そして悔い改めよ！　新しい心を授かるように祈れ。涙で罪を洗い流せ。やがて来る神の怒りの恐ろしさから、逃げられるうちに逃れよ。

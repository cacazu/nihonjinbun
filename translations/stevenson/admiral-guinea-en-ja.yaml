        "original_unit_id": "line-5605-5607"
    "translation_ja": "アレシューザ　十か月と一週間よ。私のように日を数えていなかったのね。一日過ぎればキットに一日近づく。それが私の暦だったの。まあ、すっかり日に焼けて！　なんて素敵なの！"
    "translation_status": "reviewed"

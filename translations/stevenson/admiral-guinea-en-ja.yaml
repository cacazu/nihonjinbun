    "translation_ja": |-
      ゴーント　待って、待って、待ちくたびれて。歳月はあんなに重く過ぎるのに、わがヘスターはまだ待っている！（右の箪笥まで行き、蓋を開ける）おまえの鎖だ。ギニアの金で作った。ギニアからおまえに持って帰った。（鎖を取り出す）昔は気に入ってくれたな。あの頃は喜んでいた。ああ、今はなぜ、なぜ今は喜ぼうとしないのだ？　……これが最後の航海だと誓う。見ておくれ、聖書に手を置いて誓う。もう一航海だけ、娘のためだ、ヘスター。おまえは、かわいい娘のことを考えてくれない。

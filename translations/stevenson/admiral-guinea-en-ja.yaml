    "translation_ja": |-
      キット　船長、僕はだまされ、罠にかけられました。あの男はあなたを知っていて、僕らの結婚のことなら、あなたの気を変えさせられると言い張った。酔っていて、船長、それを信じました。天もご存じのように、今は酔いはさめて、自分が愚かだったとわかります。でもその時は信じてついていったんです。ここまで連れてきて、あの男が言いました。箪笥には、一生、僕らを食べさせてくれるほどの黄金が詰まっていると。そこで間違いに気づいて、船長、舶刀を抜きました。するとあの男は、まばたきする間に助けを呼び、イタチみたいに僕の喉に飛びついて、床へ転がしたんです。奴の動きはすばしこくて、僕は、申し上げたとおり、足元がおぼつかなかったんです。

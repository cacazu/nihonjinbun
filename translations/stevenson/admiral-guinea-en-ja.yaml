      キット　ゴーント船長、僕が彼女にふさわしくないとおっしゃるなら、僕だって真っ先にそう言います。ですが失礼ながら船長、僕は若い。若い男はろくなもんじゃない、誰だって知っています、みんなそうだ。では立ち直る機会はどこにあるのでしょう。こういう娘と結婚することです！　それを僕から奪うんですか？　だって船長、ご自分が求婚された時は、若くて荒っぽかったじゃありませんか。それでもゴーント夫人はお幸せだった。おまけに船長も救われた。失礼を承知でそう言います。あなたが授かったその救いを、船長、別の男に、しかも同じ船乗りに、お許しにならないんですか？

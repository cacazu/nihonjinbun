      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5548-5557"
    "translation_ja": |-
      舞台はギニア提督の家の一室。前方左に暖炉、肘掛け椅子、聖書を載せた卓。中央に戸、その両側に窓。右側の窓は実際に開閉できる。奥の左右にも戸。右に隅棚、真鍮の金具で補強し壁と床に据えつけた船箪笥。壁に舶刀、望遠鏡、六分儀、四分儀、暦と数枚の海図。船時計。木の椅子三脚。中央寄りの右壁に食器棚。暖炉の上にブリッグ船の模型と貝殻数枚。中央には家具がない。二つの窓と、開いた戸を通して、緑の木々と海の一角が見える。
    "translation_status": "reviewed"

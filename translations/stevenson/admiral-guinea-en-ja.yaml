      ゴーント　こんな非常識で不埒な夜更けに、おまえを私の家で見つけた。しかも、私の知るかぎり、とっくに処刑波止場で風に揺られていてしかるべき男を連れている。何をしに来た？　私が寝ているうちに、なぜそんな仲間を連れて私の戸を開けた？　クリストファー・フレンチ、私には宝が二つある。そのうちの一つは（アレシューザの肩に手を置く）、おまえが欲しがっているのを知っている。クリストファー、これがおまえの愛なのか？

        "line_end": 7301
        "source_sequence": 7294
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-7294-7301"
    "translation_ja": |-
      キット　ああ、許すよ。親切でしたことだろうが、もらうくらいなら死んだほうがましな親切だってある。罪を着せられた時、怖いのは絞首台じゃないよ、アレシューザ。恥が身を切るんだ。ああいう時に助けてくれるなら、僕は無実だと、信じる気持ちを貫いてほしかった。僕の旗は帆柱に釘で打ちつけてほしかったんだ。下ろそうなんて言わずにね。たとえ明日、僕が吊るされるんでも、片方に君の愛、もう片方に無条件の恩赦と公爵の位があるなら、僕はどっちを取ると思う？
    "translation_status": "reviewed"

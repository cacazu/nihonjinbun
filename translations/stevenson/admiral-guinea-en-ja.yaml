      - "source_id": "gutenberg-719"
        "original_unit_id": "line-6114-6125"
    "translation_ja": |-
      ピュー（入ってくる）　お情け深いキリスト者の皆さま……（耳を澄ませ、哀れっぽい声をやめる）おや、誰もいねえ！　提督の裏口から二鏈も離れてねえところに酒場があるのに、本人がいないだと？　ここまで落ちぶれた船乗りは見たことねえな。昔の男の骨だけ残ったんだ。新エルサレムへ舵を切ると、こんなところに乗り上げるのかい？　結構だが、ピュー流じゃねえ。ピュー流はラムだ。……床は砂まきか。ラムが口癖、ラムがこの身の舵だ。……長椅子に、暖炉、また長椅子、痰壺、夕飯の支度のできた卓。コップ。（飲み残しを飲む）ブランデーの水割りか。目を濡らすほどもありゃしねえ。けちん坊め、みんなくたばっちまえ。壺だ。（飲む）薄ビールか。船底の汚れ水と同じで反吐が出るね。欲しいのはラムだ。（杖で卓をたたき、呼ぶ）おーい、誰か！　宿の衆、おーい！
    "translation_status": "reviewed"

      舞台は宿屋〈ベンボウ提督亭〉の広間。右に暖炉、両側に背の高い長椅子。その手前、右の客席向きに布を掛けた小卓。左に卓が数台、コップ、パイプなど。壁には刷り物の流行歌。宿の表戸と腰高の小戸は左奥の隅、右の戸は暖炉の向こう。窓に赤い半カーテン。痰壺。前方の二つの卓には蝋燭。外は夜。

    "origin": "source"
    "source_text": |-
      ARETHUSA.  Ten months and a week: you haven’t counted the days as I have. Another day gone, and one day nearer to Kit: that has been my almanac. How brown you are! how handsome!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

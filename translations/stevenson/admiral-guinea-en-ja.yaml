    "translation_ja": |-
      アレシューザ　ほらね！　これでおわかりでしょう。ただもうあなたが好きだから。お父さまがあの言葉をおっしゃった時、ああ、死ななくてはいけない、そのうえあんな恥まで！　……でも、私は父を知っています。自分の心の優しさを何より恐れている。それでも、最後には優しさが勝つんです。祈る、とおっしゃったけれど、今夜のあの声の優しさで、もう心は決まっているとわかりました。あとは、あなたに許してもらえれば、それだけです。

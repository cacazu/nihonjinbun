        "original_unit_id": "line-5798-5803"
    "translation_ja": |-
      ゴーント　アレシューザ、この世で死が私に残したものは、おまえ一人だ。この世でのおまえの幸せにも、永遠の魂の安らぎにも、私が目を配らなくてはならない。それが私にとってどういうことか、おまえにはわからない。おまえの母、わがヘスターがどんな苦しみを味わったか、語ることも、心に思い描くこともできん。私の力の及ぶかぎり、おまえの生涯を同じ暗礁、神を恐れぬ夫という暗礁に乗り上げさせはせん。（中央より退場）
    "translation_status": "reviewed"

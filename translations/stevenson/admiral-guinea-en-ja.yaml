      キット　ええ、それはそうでしょう、船長。だが道筋だってあるでしょう。食べさせていくために働き、骨を折らにゃならなくて、こっちが道を外すたびに罰を受ける妻ほど、頼りになる道筋があるもんでしょうか。ギニア貿易時代の船の仲間に聞きましたよ、船長。釘みたいに硬くて、羅針盤みたいに確か、奴隷船乗りみたいに荒っぽいが、裁判官みたいに公正だったって。お願いです、船長。僕にもその機会をください。とり上げないでください。

      ゴーント　クリストファー、事実はことごとくおまえに不利だ。真夜中に、私の家でおまえを見つけた。少なくともおまえには目が見えて、どこへ行くかわかっていたはずだ。私を起こしたのはおまえでなく、この男だ。私が入ってきた時、おまえを押さえ込んでいて、引き渡したのもこの男だ。抜き身の舶刀はおまえのもの。空の鞘が下がっておる。遮光ランタンはどうだ。盲に灯りが何の役に立つ？　芯を整えて火をつけられるのは、おまえのほかに誰がいる？
    "translation_status": "reviewed"

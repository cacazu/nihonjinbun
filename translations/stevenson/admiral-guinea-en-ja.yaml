        "original_unit_id": "line-6426-6434"
    "translation_ja": |-
      キット　アレシューザ、君は天使だ。ゴーント船長に気に入られたいか？　それは君を愛しているかって聞くようなもんだ。［あの言葉が痛かったのは否定しないよ。まったくこたえたんだ。だが気に入られるまでなら、青い大西洋ほど底が深くたって、何とか帆を切り返して渡り抜くぞ。年寄りみたいに振る舞うんだね？　ああ、君は魔女だ、賢いんだ！　年寄りみたいに？　君が針路を定めたんだ、舵は僕に任せておくれ。結婚が港で、恋が積み荷さ。］まったく変な問いだろう、ドレイクさん？　あの人に気に入られたいかだって！　もっと年長の人らしく？　ほら、杯を満たして。ひざまずいてアレシューザに乾杯しよう。
    "translation_status": "reviewed"

    "translation_ja": |-
      ゴーント　死んだ晩、そこに、寝床に横たわっていて、私の手を取った。『もう行くわ、天国へ』と言った。『お願い、キリストにかけて、私のあとへ来て、うちの娘も連れてきてちょうだい。いらっしゃるまで、待ちくたびれるほどお待ちしています』。そして私の手に、その人を殺したこの手に、口づけした。もうやめてくれと叫んだ。これ以上耐えられなかったからだ。だが、私の罪と、そのことを思うだけでどれほど一生がつらくなったかは、まだ言っておかねばならぬと言った。『ああ、生きてあなたの心を変えられなかったのなら、私の死で変えてください』、とな。……そうしてあれは死んだ。あれから私は何をした？　ヘスターに向けて針路を取った。罪も誘惑も楽しみも、はかない影のようなこの世には、何一つ目もくれなかった。目に見えるのはヘスター、待ちつづけ、待ちくたびれるわがヘスターだ。神に選ばれたと確信を得、罪はみんな追い出した。ヘスター、ヘスター、待ちくたびれたおまえのところへ、私は必ず行く。娘も連れていこう。そうだ、愛する人よ、私と一緒に娘を無事に連れていくぞ！

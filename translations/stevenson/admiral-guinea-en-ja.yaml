      ピュー　船長、本当のところはこうです。俺とそこにいる若いのは、〈ベンボウ提督亭〉で仲よくラム酒を一杯やっていましてね。ありがたい国王陛下に乾杯しようとしたところ、若い男がこう切り出した。『ピュー、おまえが好きだ、ピュー』とね。『本物の船乗りだし、こっちは何を前にしても足を止めない男だ。ピュー、誓ってひと財産つくらせてやる』って。［そんな言葉は吐かなかったって言えますかね？　目の見える皆さん、こいつを見な。言えねえだろ。『ついて来い、ひと財産つくらせてやるからな』と、こいつは言った。］さて船長、こいつが遮光ランタンに火をつけた。床のどこかに見つかると思いますぜ。それで外へ出て、俺は若いのについていった。この男に樫の芯ほどの度胸があり、心底まっとうな船乗りだと思っていたからね。次に気づいたら、もうここに来ていてね。俺には灯りを持て、自分は船長の古い船箪笥の蓋を舶刀でこじ開けるって言うんですよ。

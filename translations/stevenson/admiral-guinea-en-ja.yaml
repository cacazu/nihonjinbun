    "translation_ja": |-
      キット　僕を行かせる？　ねえ、今朝僕を捨てていたなら、それでよかった。心が裂けたとしても君のところを出ていったよ。だが今は話が違う。今の僕は運に見放され、そこへ君は背中から刃を突き立てる。情けは求めないし、受けもしない。僕は無実だ。その一点で退くつもりはない。神が助けてくだされば潔白を証明し、君の愛を取り戻すよ。取り戻す値打ちのある愛ならね。［では、ゴーント船長、言うことは言いました。あとはお好きなように。僕は父の息子です。真実に向かい合うことを恐れたことはありません。

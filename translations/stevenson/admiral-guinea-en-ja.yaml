        "line_end": 6960
        "source_sequence": 6951
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-6951-6960"
    "translation_ja": |-
      アレシューザ　お父さま、私からもいいですか？　心に浮かぶままをお話ししても？　お父さまはお母さまのことがわかっていらっしゃらないわ。愛していらしたのね。あれほど愛せる男の人はめったにいない。そしてお母さまもお父さまを愛していた。どんなに愛していたか考えてみて！　この世に完全なものは何もないと、教えてくださったでしょう。私たちは誰もが罪を抱え、それが愛してくれる人たちを苦しめる。愛が深ければそのぶん痛みもひどい。それが人生よ。私たちが求めているのは人生、天国じゃない。愛さえ続けば、痛みがなんだというの？　お母さまの愛は続いた。だったら、お幸せだったんです！　あの愛は死んでも消えない。亡くなる時、ただ一つ悲しかったのは、お父さまと別れること。ただ一つの望みは、お父さまをまた迎えることでした。

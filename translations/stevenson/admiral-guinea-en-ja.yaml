        "source_sequence": 7020
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-7020-7023"
    "translation_ja": "キット　もう少し人にものを言う口を慎むんだな。盲だろうと何だろうと、僕は誰にも脅されやしない。提督を起こしてそれでおしまいにしよう。この遮光ランタンを早く手放したい。押し込みに来た気分で、たまらんよ。"
    "translation_status": "reviewed"

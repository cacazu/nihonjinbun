    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      GAUNT.  Arethusa, the Lord in his mercy has seen right to vex us with trials of many kinds.  It is a little matter to endure the pangs of the flesh: the smart of wounds, the passion of hunger and thirst, the heaviness of disease; and in this world I have learned to take thought for nothing save the quiet of your soul.  It is through our affections that we are smitten with the true pain, even the pain that kills.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 6814
        "line_end": 6819
        "source_sequence": 6814
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-6814-6819"
    "translation_ja": |-
      ゴーント　アレシューザ、主はその慈悲ゆえに、私たちをいろいろな試練に遭わせるのがよいとお考えになった。肉の苦痛をこらえるなど小さなことだ。傷の痛み、ひもじさと渇きのつらさ、病がのしかかる重さ。私はこの世で、おまえの魂の静けさのほか、何も気にかけぬことを覚えた。真の痛み、人を死なせるほどの痛みは、愛する心を通して私たちを打つ。
    "translation_status": "reviewed"

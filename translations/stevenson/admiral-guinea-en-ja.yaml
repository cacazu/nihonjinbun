    "translation_ja": |-
      ピュー（起き上がって）　ああ、威勢のいい娘だ！　杖はどこだ？　あんな女こそデイヴィッド・ピュー好みだ。暴れたろ？　もがいたろ？　あのかわいい首をひねってやりたかったなあ。みんなにそうしてきた、ピュー流だ。きれいな女ほど、こっちはひどい目に遭わせてやったもんだ。ピュー流よ。昔からのやり方だ、しかもとびきりいいやり方だ。（左の戸に聞き耳を立てる）こっちが寝室だろう。あいつ、錠を二重に掛けてこもったな。上出来だ。提督が入ってこなかったのはまったくありがたい。だがピュー、おまえは女と見るといつも頭に血が上る。そのおかげであっちも参っちまう。さあ、仕事だ。表の戸。閂はねえ、大きな錠だけだ。（ポケットの鍵を試す）鍵その一。だめだ。その二。だめだ。その三。ああ、これだ。（鍵を指で確かめる）ああ！　大きな歯が三つ、小さいのが一つの奴。上出来だ！　あとはこの腐った田舎の小村で相棒を見つけられればなあ。俺の目になってくれる相棒が。舵は取れても指図する者がいなきゃどうにもならねえ。相棒さえいればなあ！　それで今夜、夜半の当直の三つ鐘あたり、ピュー爺さんがちょいと出航して、古い友達の提督のところへ横づけする。そいつが駄目でも提督の古い船箪笥だ。ブリッグで金貨をしまっていたやつだよ。どこだろうな？　寝室か、この居間か？　大きいし、真鍮の帯があるから触ればわかる。（杖で探る）食器棚、椅子……（戸棚で頭をぶつける）痛っ！　おお、隅棚だ。提督の椅子、提督の卓、提督の……おい、何だこれは？　本だ。羊皮だ。聖書くさいぞ。椅子。（杖はすぐそばの船箪笥を外れる）船箪笥はなし。相棒が要る、このピュー爺さんに代わって見てくれる奴だ。鷲みたいな目をしていたこの俺に！　その前に、ラムだ。もちろん隅棚だ。（こつこつと杖をつく）ラム、ラム、ラム。おや？（耳を澄ます）足音だ。提督か？（物乞いの哀れっぽい声で）お情け深いキリスト者さま……

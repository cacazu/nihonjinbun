        "original_unit_id": "line-6805-6810"
    "translation_ja": |-
      ［ゴーント（朗読する）　「ルツは言った。私にあなたを捨てよ、従わずに引き返せと無理強いなさらないでください。あなたの行く所へは私も行き、あなたの泊まる所に私も泊まります。あなたの民は私の民、あなたの神は私の神です。あなたが死ぬ所で私も死に、そこに葬られます。死のほかに私とあなたを引き離すものがあれば、主が私にいかなる罰を、さらにはそれ以上の罰を下されてもかまいません」。（聖書を閉じる）アーメン。
    "translation_status": "reviewed"

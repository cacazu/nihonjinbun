        "original_unit_id": "line-6020-6034"
    "translation_ja": |-
      歌わせりゃ何て声、小さなカップ一杯のラムを何て勢いで飲んだか、金貨をつかむ手は何て力だったか！　ああ、船長、わけもなくギニア提督と呼ばれたわけじゃない。その昔の船箪笥が目に浮かぶ。真鍮の帯のやつ、砂金とドブロン金貨を入れていたね、ご存じでしょう。あの蓋の上で二人でプットの札を切っていた頃みたいに、今もありありと見える……何も言わねえんですか、船長？　……じゃ、こういうわけだ、金が要るし、ラム酒が要る。ラムが欲しくてたまらないってのが、あんたにゃわからん、わからねえよ。ひと口のために船一つの乗組員を皆殺しにもしかねねえってところまで行くんだ。何です？　ギニア提督、俺の昔の船長が、困り果てた哀れな老いぼれピューを見放す？　［あんたに限って！　ラゴスであの黒人の娘を取り合った時、どうしました？　正々堂々、男と男で正々堂々、それがあんたの言葉だった。で、ラゴスの砂浜で刃を交えて決着をつけた。俺が老いぼれて目が見えなくなったからって、その言葉を取り消すんですか？　いやいや、それはよしましょう。昔の合い言葉を聞かせてくれ。正々堂々、男と男で。］
    "translation_status": "reviewed"
    "source_kind": "dialogue"

      ピュー　本当のところを、神に誓ってお話ししましょう。この家のきれいな女の人が、キリスト者らしく哀れな盲をいたわってくれた。そしたら驚いたの何の、昔の船長のお嬢さんでしたよ！　『お嬢さん』と俺が言った。『俺は提督直属の甲板長でしてね』。すると『まあ、船乗りさん、父が喜びますわ！』ってね。『ええ、それはもう』と俺が言う。『呼んできますから、くつろいでいてくださいませ』ってさ。あの人は行っちまいました。で、船長、こうして俺がいるわけです。

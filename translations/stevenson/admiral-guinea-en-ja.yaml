      ピュー　何です？　アレシューザ？　知ってるかって？　知ってるどころか、おやまあ、俺が代父ですよ。［『ピュー』とジャック・ゴーントが俺に言うんだ。『おまえは男だ、ピュー。男は男らしいのがいい。それにな』と。『とにかく俺はおまえが好きなんだ。だから、生まれたばかりのこの子の代わりに誓いを立てるのを引き受けてくれ。とにかくピュー、断ったら、おまえは俺が思うような男じゃねえ』。］そうとも、おかみさん。俺が自分の手であの女の子に名づけた。アレシューザと名づけたんだ。俺がつけた名だ。これで俺が本当のことを言ってるのがわかるだろう。そこで、おかみさんがラムをもう一杯持ってきてくれりゃ、あの子の健康を祝って、万歳を三つずつ三度、唱えようじゃねえか。（ドレイク夫人退場。ピューは食べる。ドレイク夫人、ラムを持って戻る）

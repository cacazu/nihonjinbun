        "original_unit_id": "line-6141-6152"
    "translation_ja": |-
      ピュー　俺を追い出す？　おやまあ、俺はデイヴィッド・ピューだ、昔のデイヴィッド・ピュー。ベンボウ提督のお抱えの艇長ですよ。亡くなった船長の顔を掲げた看板の下から、ピュー爺さんを追い出す気ですかい？　ああ、イギリスのご婦人。戦場で俺を見たことがあったら、もっと違う扱いだったでしょうにな。［年老いたベンボウ様は両脚を撃ち飛ばされて籠に横たわり、その最期の時までありがたい遠眼鏡を目に当てていた。あれぞ海軍魂の手本ですよ、おかみさん。その時、丸い砲弾が飛んできて、バケツ一杯の破片をかわいそうな俺の目ン玉に叩き込みやがった。『何てこった』と提督は言う。『老いぼれピューか、わしのピューか？』。『ピューであります、提督』と一等海尉が答えた。『残念なことに』と。『何てこった』とベンボウ提督は言う。『獅子の心を持つ船乗りがこんな目に遭うなら、もう生きていたくはねえ』。そして、おかみさん、提督は遠眼鏡を置いたんです。］
    "translation_status": "reviewed"

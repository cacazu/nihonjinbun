        "original_unit_id": "line-6861-6886"
    "translation_ja": |-
      ゴーント　あれをファルマスから妻に迎えた。雌鹿のようにすがたが美しく、今も目に浮かぶ、鳩のような目とあの微笑みが！　私は年上だった。冷酷という悪い評判も立っていた。冷たく邪悪な男とな。だがあれは愛してくれた、わがヘスターは！　ありのままの私を受け入れた。ああ、その信頼に私は何で報いたのか！　さて、私たちに子が生まれて、私が建造し船長をしたブリッグにちなんで名をつけた。あそこ、頭の上に模型がある古い船だ。おまえより古い。そこまでは幸福だった。だがあれは私が救われることを切に願っていた。私があれの願いを踏みにじったのは、そのことだ。私の罪は心の重荷になり、この世での恥、来世の恐れになった。何度も何度も、あんな悪魔の商売をやめてくれと言った。心の優しい、まことのキリスト者だった。私が買い、売り、苦しみへ向けて船で運ぶ哀れな異教徒のために泣き、祈った。そうするうち、私の良心も胸のうちで熱くなった。帽子をかぶって出かけ、次の積み荷を最後にすると誓ったこともある。だがいつも最後にはならなかった。誓いを守ったためしがなかった。そうしてギニア沿岸に何度も船を出した。本当に最後になる航海までな。さて、その航海は商売がうまくいき、哀れな異教徒を船にこれ以上入らないほど積んだ。赤道を越えるまでは順風を受けて西へ走った。ある夜、風が強まり、暴風がやってきた。七日間、大海でもみくちゃにされ、苦境の極みで、全員甲板につきっきりだった。何日も船倉の口を閉めていた。閉めているあいだじゅう、中から叫びと嘆きの声が聞こえ、とりわけ初めがひどかった。しまいに自分も死にかけて、やっと下へはっていくと……ああ、飢え死にした者、窒息した者、手足を折って死んだ者がいた。船倉は、主の怒りが下った頃の隔離病舎のようだった！

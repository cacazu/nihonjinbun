        "original_unit_id": "line-5746-5759"
    "translation_ja": |-
      ゴーント　私のことを言うのか？　偽りのない秤に載せれば、私もおまえも目方はない。だが二つのことは知っている。不義の淵がどれほど汚いか。そして悔い改める時の苦しみだ。七つの悪魔が私から追い出されて初めて目が覚めた。一つ一つが出ていくたび、私を引き裂いていった。そういうのが悔い改めだ。クリストファー、クリストファー、初めて錨を上げてからずっと追い風を受けて帆走してきたおまえが、今さら帆を絞って風上に進もうというのか。若造、自分の船を知らんな。紙切れのように風下へ飛ばされる。わかっているから言う。試してしくじり、汗を流すほど祈ってもがき、ついに、ついに恵みを味わった私が言うのだ。だが今は、昔の私や今日のおまえのようなろくでなしに、私の血を分けた子の運命を任せはせん。釣り合わぬ者同士を同じ軛につなぐのを認めたら、天を仰いでそれを告白できはしまい。アレシューザ、その指輪を指から外しなさい。クリストファー・フレンチ、持って立ち去れ。

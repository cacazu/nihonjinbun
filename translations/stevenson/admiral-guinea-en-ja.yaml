      ゴーント　ヘスター、よしてくれ、微笑まないでくれ。泣いてくれたほうがまだいい！　おまえが泣くのを見たことがある。何遍も、何遍も。二百五回。二百五回だ！（指輪を持って）ヘスター、おまえの指輪がここにある。（自分の指にはめようとする）どうして私の手にある？　また抜けたのか？　いや、そんなはずはない。小さく直したんだ、抜けるわけはない！　ああ、やせていく。生きてくれ。どうか、かわいい娘のために。私のためにも、ヘスター、私のためにも！　ああ、娘か。そうだ、私に人を裁く資格がどこにある？　かわいそうなキット・フレンチ。おまえの娘はおまえに似ている、ヘスター、あの男を救うだろう！　妻なしに男がどうやって救われよう？

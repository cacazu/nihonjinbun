      ゴーント　待て。まずこの男を片づける。デイヴィッド・ピュー、おまえの話をそのまま信じるほどお人よしではない。だがおまえに不利な証言も見つからん。理由が何であれ、おまえが私の役に立ったのは確かだ。旅の足しに五ギニーを渡す。すぐに出ていけ。それから、まだ間に合ううちに、悔い改めることを考えよ。
    "translation_status": "reviewed"

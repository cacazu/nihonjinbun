        "original_unit_id": "line-6406-6408"
    "translation_ja": "キット　おや、僚艦をお探しかい？　口笛を吹いてごらん、僕は君の犬さ、すぐに行くよ。いとしい人、君のために何尋も深く乾杯していたんだ。一杯ごとに好きになる。"

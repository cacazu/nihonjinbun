    "translation_ja": |-
      アレシューザ　父は私ほどあなたを知らないし、あなたも父を知らないわ。厳しくて気が荒いように見えるけど、胸の中はただ、悲しみでいっぱいなのよ。そうでなければ、私が気づいていないと思って父がこちらを見た時、どうして泣きたくなるくらい優しい顔になるの？　ほとんど毎晩、寝たまま歩き回って、目を開けているのに何も見ていない時、どうしてあんなに痛ましい声で母の名を呼ぶの？　ああ、あれを聞けばあなたも言うはずよ。この人は誰かを愛したことのある人だ、恋をする者たちに優しくしてくれる人だ、って。

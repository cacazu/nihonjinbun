      ゴーント　海に投げ込んだのは二百五人だ。私が死に急がせた二百五人の哀れな魂。乗せたまま大勢死んだことは前にもあったが、あれほどではない。あれほどの殺戮はなかった。それを前に私は言葉を失った。その人たちを殺したのは私だとわかった。身も魂も、私が殺したのだ。そしてアレシューザ、わがヘスターにもわかった。それが致命の一撃だった。それで倒れたのだ。もともと長いこと少しずつ弱っていたが、話を聞いたその時から、肉の衣はやせ衰え、命の泉は干上がっていった。目の前でしなびるように衰え、私が陸に上がって二か月目に……ああ、ヘスター、ヘスター、神よ、代わりに私が死ねばよかった！

        "original_unit_id": "line-5609-5616"
    "translation_ja": |-
      キット　自分の姿が見えないのが気の毒だな！　いや、僕は男前にはなれないよ。日に焼けるだけならできても、男前にはね。だが言い伝えが本当なら、それよりいいことがある。僕は百万尋も深く恋に落ちているんだ。浮気をしない船乗りを連れてきたぞ。何だって？　珍品とも思わないか？　ああ、そうとも。それが十人いようと値打ちが足りないほどの娘こそ珍品だ。不実になろうとしてもなれるものか！　ねえ、君。僕には怖いものなどない。君を失うほかに、何が怖いものか。（ぎくりとして）おい、あれは提督じゃないか？
    "translation_status": "reviewed"

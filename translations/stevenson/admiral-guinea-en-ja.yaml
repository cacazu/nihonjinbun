        "original_unit_id": "line-6410-6415"
    "translation_ja": |-
      アレシューザ　ねえキット、父に気に入られたいなら、それじゃだめよ。父はギニー金貨を気にしすぎなのかもしれない。だったら貯めて。私にその値打ちがあると思うならね。あの、鎧張りで積載八十トンのスループ船でおゆきなさい。ね、私も覚えているのよ、キット船長！　気概のある男の人が好きなのは認める。でもゴーント船長に気に入られたいなら、酒場には出入りしないこと。それから、もう少し、もう少し年長の人らしく振る舞えない？
    "translation_status": "reviewed"

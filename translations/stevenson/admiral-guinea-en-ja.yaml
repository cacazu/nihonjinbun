    "translation_ja": |-
      ゴーント　デイヴィッド・ピュー、おまえは五十尋の海の底に沈んだほうがよい。おまえの一生は知っている。初めから終わりまで、悪事の一斉砲撃を浴びせるような生き方だ。学校の用務員だった時、少年を殴り殺した。逃げて奴隷船乗りとなり、ずぶの素人で私の船に来た。ああ、おまえにはもってこいの船だった。あの船がふさわしく、私こそがふさわしい船長だった。ギニアへ通う船のうち、あれよりひどい船はない。それでどうなった。五年で仲間じゅうに恐れられ、忌み嫌われるようになった。最低の船乗りでさえおまえを嫌った。船長、つまりこの罪人の頭、ジョン・ゴーントが、おまえを災いを呼ぶヨナと見て船から追った。［ポルトガル人を刺し、その気の毒な妻を奥地に連れ去ったのは誰だ？　ラムに酔って暴れ、奴隷小屋に火をつけ、鎖につながれた哀れな魂なき者たちを焼いたのは誰だ？］ああ、ラゴスからカラバルまで、ギニア沿岸の面汚しだった。ついにおまえを船から降ろし、陸に置き去りにした時、船の仲間は鬼のような奴らだったが、厄介払いできたと歓声を上げて喜んだ。神にかけて、ブリッグが一トンも軽くなったようだったぞ！

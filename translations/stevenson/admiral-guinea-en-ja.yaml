    "translation_ja": |-
      ピュー　それはそうだ！　なぜかって？　今朝ちょっとお邪魔して挨拶した時、あの子が俺だとわかったと思いますかい？　生まれる前の赤ん坊並みに、さっぱりですよ！　おかみさん、あの子のために誓いを立てた頃の俺は、軍艦乗りの見本みてえなもんだった。鷲のような目、足を上げ下げ、ホーンパイプを踊るように甲板を歩き、声はラム酒みたいにまろやか。胸に手を当てて誓うが、女たちはみんなひと目見るなり、逆風を食らったみたいにうっとりと立ちすくんだもんさ。ありがたいことだ！　俺だとわかるかって？　無理だね。こっちだって、手と腕に触って、あんなきれいな女になっていたと知った時ゃ、羽根一本で倒せるほどびっくりしたよ。だがね、つまりこういうことだ。四十二年も青い海を渡り歩いて、こっちで難破、あっちで爆発、どこへ行ってもついてなくて、仲間にも親戚にも一人残らず死んだと思われていたら、どうなる？　誰もあんたが誰だかわからんし、自分でもよくわからなくなる。まあ、そんなもんさ。じゃ、ラムをもう一杯お願いしようか。

    "translation_ja": |-
      ピュー　三十年も国と王のために戦ったってのに、目が見えなくなって年食ったら、ちんけな酒場から追い出されるのかい？　覚えときな、おかみさん。俺が出ていったら、どうなってもあんたの責任だ。ここは宿か、宿じゃないのか？　宿なら議会の法律で、俺はハンモックを吊っていいんだ。忘れるなよ。議会の法律が絡んでるんだぜ。気をつけな。

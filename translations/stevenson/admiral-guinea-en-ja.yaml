        "original_unit_id": "line-5714-5725"
    "translation_ja": |-
      ゴーント　厳粛に言っておく。これはキリスト者の結婚ではない。クリストファー・フレンチよ、おまえに永遠の真理を説きはしない。この世の言葉で話そう。おまえは己の罪を誇る罪人に育てられ、生涯、一ファージングも貯めたためしがない。それが懐が暖かくなったとたん、自分の力で身を立てられると思っている。哀れな思い違いだ。おまえは陽気な放蕩者、楽しい相棒だ。悪意はない。おまえの敵はおまえ一人だ。変われるとこの娘に言い、みずからにもそう言い聞かせているのだろう。クリストファー、間違いなら糺してもらおう。だが、おまえに変われるものか！　幾度も祈って得た子、燃えさかる火から取り出した燃えさしを、おまえは私に求める。おまえをこうして眺め、胸の内まで読み通して言う。ならん！（拳で卓を打つ）
    "translation_status": "reviewed"

    "source_alignment":
      - "source_id": "gutenberg-382"
        "original_unit_id": "edin-105"
    "translation_ja": |-
      このあたりは迷信好きに愛されている。すぐそば、コミストンの裏門で、帰りの遅くなった荷馬車引きは、白衣の女を見た。「足にはえも言われずきれいな、透き通った靴」を履き、実に不気味に彼を見て消えたそうだ。そしてすぐ前にはハンターズ・トリスト、昔の街道の宿屋があり、そう遠くない昔、悪魔自身が出没した。サタンは住人たちにじつに気の毒な暮らしを送らせた。哀れな叫びで建物の四隅を揺るがし、扉や窓をたたき、夜明け前の寝静まる刻に陶器をひっくり返し、屋根で不浄な踊りを踊った。ありとあらゆる霊的消毒剤が動員された。選りすぐりの牧師をエディンバラから呼び寄せて何時間も祈り、信心深い隣人は夜通し起きて詩篇を大声で歌った。だがサタンは丘のてっぺんを吹く風ほどにも意に介さなかった。住人を何年も苦しめた末、ようやくハンターズ・トリストを安らかに放っておき、残りの人類の相手に出かけたのである。ケイ将軍に白衣の女、それからこの珍しい来訪と、この近辺は、何でも太陽神話で説明する人たちに格好の材料を提供する。魔法を解きたがるあの一派に身を投じるわけではないが、最後の話に冬の風の音がありありと聞こえてくるのは、どうにも仕方がない。「あの晩は」とバーンズが最も冴えた筆で言う。
    "translation_status": "reviewed"

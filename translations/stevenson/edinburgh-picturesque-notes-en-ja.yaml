    "source_alignment":
      - "source_id": "gutenberg-382"
        "original_unit_id": "edin-034"
    "translation_ja": |-
      一対のあおり戸を抜けると、彫り細工の天井のある大広間に出る。法律家の肖像が掛かり、法律家の彫像が立ち、彩色ガラスの窓から光を取り、三つの大きな暖炉が部屋を暖める。ここがスコットランド法曹界の「失われる足どりの間」、つまり待合の大広間だ。容赦のないしきたりによって、仕事のない青年は十時から二時までここを散歩しなければならない。一方の端から他方の端へ、ひとりずつ、二人または三人連れで、法服と鬘が行ったり来たりする。話し声と足音の唸りを縫って、法杖を持つ廷吏の甲高い声が次の事件を告げ、関係者の名を呼ぶ。りこうな人々がひとかけらの仕事も一シリングの報酬もなく、十年も二十年も毎日ここを歩いてきた。時を経れば、いつかラーウィックなりトバモリーなりの州副判事に任じられ、その地の正義の泉になれるかもしれない。ちょっとの忍耐、運動と悪い空気への嗜好、そのほかは何も要らぬとお思いだろう。埃と法服の生地を吸い込み、があがあと騒がしい噂話を精神の糧にし、事件を四分の三ほど聞いてシェリーを一杯やり、仮装を脱ぎ捨てて午後の残りをゴルフに捧げられる時刻を、何とも表現できぬ思いで焦がれ待つ。それを日ごと年ごと繰り返す。経験のない人にはそれがどんなにたやすいことに見えるだろう！　だが実験済みの人は違う考えを抱き、これを暇つぶしのうちいちばん厳しい形と見なす。

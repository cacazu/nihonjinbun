      町の物語もその外見に劣らず風変わりだ。何世紀もヒース葺きの首都であり、イングランド侵入の凶日には一度ならず、天へと燃え上がり、海を行く船からはかがり火さながらに見えた。互いに妬む貴族たちの槍試合の場でもあった。トランペットに合わせ、国王臨御の威厳のもとに正式の試合を行ったグリーンサイドや王の厩辺りばかりではない。剣を交える場所さえあればどんな路地でもそうだったし、大通りでは「青い毛布」の旗の下の民衆騒乱と、辺境から来た氏族の男たちや家来の喧嘩とがかわるがわる起きた。下手の宮殿ではジョン・ノックスが近代民主主義の口調で自国の女王を諫めた。市中では古い大聖堂の控え壁の間に燕の巣のように塗りつけた小店の一つで、親しみやすい専制君主ジェームズ六世が金細工師ジョージ・ヘリオットと喜んで酒を酌み交わしたものだ。城と、そのまわりに波打つ町並みとを静かに見下ろすはるかなペントランド丘陵では、「甘き歌い手」と称した陰気で狂気じみた信仰者たちが、長く荒野の風雨にさらされたやつれ顔で、昼も夜も「涙ながらの詩篇」を歌って座り、エディンバラが第二のソドム、ゴモラとなり天火に焼かれるのを待った。そこのグラスマーケットでは、頑なな盟約派の勇士が、往々にして無益ながらそれでも立派な犠牲として命を差し出し、太陽と月と星と地上の友情とに雄弁な別れを告げ、または太鼓の音のなか黙って死んだ。向こうの出口からはクラヴァーハウスのグレアムと三十騎の竜騎兵が馬を飛ばした。馬の尾のすぐうしろでは町が非常の太鼓をたたいていた。命からがら駆けていくのは哀れな一握りだったが、先頭にいた男はのちに心もちを変えて舞い戻り、スコットランドの心臓を震撼させる突撃を行い、乱戦のただなかで本望を遂げて死ぬことになる。この地でエイケンヘッドは少年らしい不信心をちょっと漏らして絞首刑にされた。そして幾年か後には、デイヴィッド・ヒュームが平穏無事に人望を保った市民のまま哲学と信仰とを打ち壊した。さらに幾年か後、バーンズが犂の柄を放してやって来たのは、金箔張りの不信心と技巧を凝らした文芸との学府としてのこの地だった。やがて谷の向こうへの大移住が起こり、新市街が風の吹き抜ける平行四辺形を広げ、向かいの丘に長々とその正面を立ち上げ始めた。あのときほどの宿替え、あれほど家と住人とが入れ替わった例は、都市の歴史にまたとあるまい。靴直しが伯爵のあとを襲い、物乞いが判事の暖炉わきに座を構え、かつての御殿は貧民の避難所になった。壮大な邸は世の最下層のつつましい人々にあまり細かく仕切り分けられたので、先代の主人の炉床は、新たな主人には仕切って寝室にするほど広いと思われたのである。

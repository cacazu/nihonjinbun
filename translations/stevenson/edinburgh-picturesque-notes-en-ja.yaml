      宗教改革者のすぐそばでは、鉛で出来たがに股のチャールズ二世が花冠をかぶり、樽腹の軍馬にまたがっている。王は背を向けており、こちらの見ているうちにも、そんな物騒な隣人からぎごちない速足で退散しようとしているようだ。しばしばこの二人きりで何時間も広場にいる。法に携わる者以外には通り道でないからだ。一方には教会の南壁、もう一方には議事堂の回廊が、この不揃いな入江のような舗道を囲み、陽のもとでは影をそこに描く。どちらの端からでもセント・ジャイルズの控え壁を回り込んで、色とりどりの往来の人に満ちたハイ・ストリートをのぞける。だが人の流れは東西に行き過ぎ、広場をチャールズ二世と鳥たちに明け渡す。時折、気の長い群衆が一日じゅうそこでぶらぶらし、果物を食べたり、新聞を読んだりしている。おとなしい様子からすれば、炊き出しのスープ券が配られるのを待っているとでも思うだろう。事実は大違いだ。奥の刑事裁判所で人がひとり命にかかわる裁きを受け、この人たちは狭い傍聴席に収まりきらなかった物見高い人々の一部なのだ。被告が人に憎まれていれば、午後近くに連れ出されるとシューッと非難する声がひとしきり起きる。また時折、鬘と法服の弁護士が口に手を当て、意味たっぷりにいくどもうなずいて、訴訟代理人の話を聞きながら回廊をつかつかと往復する。決まった時刻になると、法律家の潮がこの広場を急ぎ横切る。
    "translation_status": "reviewed"
  - "id": "edin-031"

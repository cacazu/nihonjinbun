      旧市街が占めるのは、古い洪水の堆積物が斜めに延びた尾根、あるいは尾であり、西に砦をなす城の崖に、いつか水が引いた際かばわれて残ったものだ。その左右には南北の新しい町々が、いっそう低く広くなだらかな丘頂を占める。このため城の地区は町をまるごと見おろし、海にも陸にも妨げるもののない視界を保っている。四方何マイルをも見下ろし、船の甲板にいる人、あるいは向こうのファイフで静かな田園を耕す人にも、城壁に立つ旗と、旧市街の煙が眼下の田舎を越えてたなびくのが見える。丘の上に建てられた町。きっとこの遠目の姿から「オールド・リーキー」、古き煤け町のあだ名が生まれたのだろう。ひょっとすると門をくぐったことさえない人々がつけたのかもしれない。めいめいの田舎のピスガの頂から、日ごと丘のてっぺんに積み重なる建物と、平野を渡る長い煙の羽飾りを見ていた。彼らにはそう見え、同じ畑を耕した父たちにもそう見えた。この町について知っていることはそれだけだから、ひと言ならぬこのふた言にすべて籠めることができたのだ。

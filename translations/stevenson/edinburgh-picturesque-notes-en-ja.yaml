      旧市街こそエディンバラ最大の特色で、絵のような景色という点では町の中の極上の一切れだ、と言う向きがある。全体をくさすのに、部分をしたたかに褒めすぎて水を差すほどよくある手はない。ひとりの人間であれ芸術作品であれ、それともただひとつの立派な町であれ、値踏みするに足るものは全体としての取り柄で測らなければならないからだ。旧市街の効果はかなりのところ、それを取り巻く新しい街区、その立地の申し分なさ、背後を支える丘々に負っている。どこか別の場所にそれだけを置いたら、いっそう大胆で背を高くした版のスターリングにとてもよく似ているだろう。肝心なのは、この飾り立てたスターリングが、大きく、活動的で、奇抜な近代都市のまん中に据えられているのを見ることだ。そうしてはじめて両者は風景として働きかけ合い、一方が他方を成り立たせるのだから。

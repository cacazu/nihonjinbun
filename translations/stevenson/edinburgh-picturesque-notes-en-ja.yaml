      ここで語られるのは銀行の運搬人ベグビーの話。心臓をひと突きされ、人でごった返すハイ・ストリートから一歩か二歩のところに血にまみれて捨てられた。あちらではバークとヘアを語る人の声が低くなる。薬、あばかれた墓、膝で生け贄の息を止めた死体掘りどもの話。こちらでは今なお、職人組合長ブロディの名声が、信仰にも似た熱心さで語り継がれる。当時のブロディは大した人物だった。上流社会にも顔が利き、家具職人として巧みな手を持ち、歌えば味があった。夕食に組合長を迎えるのを誇りにし、ほどよい時刻に名残惜しく見送った市民の多くは、その客がどんなに早く、どんな格好で戻ってきたか知ったなら、ひどく狼狽したに違いない。この恐るべきエディンバラの家宅侵入犯にはたくさんの話があるが、いちばん生々しく私の念頭に残る一つが、残りすべてを解く鍵を与える。あの巨大なランドの一つの、天国へいくらか近づいた高みをねぐらにした友人が、近々田舎へ出かける予定をブロディに話した。あとになって用事に引きとめられ、旅行を延ばして町で夜を過ごした。善良なその人は床についてしばらく眠れずにいた。トロンの鐘では真夜中をだいぶ過ぎていた。と、突然、きしむ音、ことりという音、かすかな光。そっと寝床を抜け出し、別室を見わたす見せかけの窓にはい上がると、そこに、盗人の手もと灯のちらつく明かりで、親友のあの組合長が仮面をかぶっていた。この小事件が穏便に片づけられたのは、この町とその作法らしいことである。そのあとだいぶ時がたち、大きな盗み、逃亡、ボウ・ストリートの捕吏、闘鶏、アムステルダムの戸棚での捕縛と続き、ついに自分で大いに改良した絞首台の落とし板から虚空に踏み出す最後の一歩が、組合長ウィリアム・ブロディの生涯を終わらせた。だが心の目には今も彼が見える。幾重もの二枚舌を山と背負う苦労人が、市参事の食卓から盗人の巣へこそこそ抜け出し、遮光ランプのちらつきを頼りに路地をあさり回る。

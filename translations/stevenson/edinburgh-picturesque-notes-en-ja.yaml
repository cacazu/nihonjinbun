      こうした転落の最初のしるしの一つは、犠牲者が新市街の大通りから姿を消すようになり、傷ついた獣が森に入るようにハイ・ストリートへ身を寄せることだ。そしてそういう男はこの一画の似姿でもある。町のほうもまた社会の段を転げ落ちた。どの窓にも洗濯物が下がるところでは、戸の上の紋章など情趣のうえでいくらかちぐはぐだ。最後に見た老人は、三年前に紳士役を演じた時と同じ上衣を着ていた。そしてそれこそが、ほかの誰にもまして彼を痛ましく見せたのである。

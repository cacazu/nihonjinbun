    "translation_ja": |-
      凍りつくほど気候が引き締まると、エディンバラの人間にとって世の中はましになり始める。われわれは亜寒帯ならではの見事な落日を楽しむ。輝く緑の空に、町の輪郭が藍色の型を押したように浮かぶ。風は依然冷たくとも、空気には健全な血を動かすきびきびしたところがある。人々がみな一様に酸っぱく沈んだ顔をするわけではなくなる。二種類に分かれる。一方は顔を青くして腹をへこませ、冬に急所をつかまれた騎士。もう一方は新年のご馳走を腹にたっぷり詰め、肌に冷気を感じはしても、腹の火でぬくもりながら歩いていく者だ。私はそういう人を一人覚えている。脂肪の三重のよろいに包まれ、どんな極端な気温にも負けなかった。「いやあ、こいつはひとくしゃみ出る！」と陽気に挨拶した。そんな暖かい連中の顔は強壮剤であり、しょげかける同郷人を支えてくれる。体の有利さに頼らず、勇ましく快活な心の徳によって冬をしのぐ、また別の人々がいる。ある身震いする夕方、霜のおりる寒さなのに風が強すぎておりず、日が落ちて少し、濃くなる薄闇にランプの円が広がり始めた時、裸足の少女が二人、風に歯向かって東に来るのを見た人がいた。一人がせいぜい九つとしたら、もう一人は七つを出ていない。みすぼらしい着物で、舗道は誰でもたじろがずには素足を置けまいと思うほど冷たい。なのに二人は何とも、ワルツを踊りながらやってきた。大きいほうが旋律を歌って音楽をつけたのだ。これを見た人の心はその瞬間苦々しさに満ちていたが、一つのお叱りを胸にしまった。それは以来ずっと彼の役に立った。そして今、どうか役立ててほしいと願いながら、読者に手渡すのである。
    "translation_status": "reviewed"

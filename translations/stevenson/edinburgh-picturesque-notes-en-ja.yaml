      とうとうエディンバラは、衛星の丘も、傾いた田園という田園も、白い雪にすっぽり覆われる。それが闇のうちに起こると、子守たちは子供を寝床からひょいと抱き上げ、地の面に起きた変化の見晴らせる窓へと走る。「山という山は雪かぶり」と歌う。「さあて、冬がほんとに来たぞえ！」　静けさと白い景色に目を見張る子供には、その言葉に季節に似合う呪文が潜む。雪の照り返しが青白い昼の光を増し、どんな物も目の近くへ引き寄せる。ペントランドは滑らかに輝き、ところどころに空積み石垣の黒い帯、風があればまたところどころの山の肩に、吹雪の雲がのる。粉をたっぷりはたいたロージアンと、同じくたっぷりはたいたファイフとの間で、湾はほとんど人が跳び越せそうな鉛色の細い入り水に見える。その効果はよその町のように半日きりではない。街路はすぐ踏まれて黒くなるが、田舎はおろしたての白を保つ。目を上げさえすれば、何マイルも続く田舎の雪を見渡せる。何とも言えない朗らかさが町のまわりで息をする。腹が満ちれば心も軽くなり、胸の内では浮き立つ鼓動が打つ。新年の天気だ。

    "translation_ja": |-
      悲しいかな、この民族の教会史、人の記録のうち最もひねくれ、憂いに満ちた歴史を知る者には、これはスコットランドとフォースを見下ろす高みの首都にいかにも典型的なものを描いた比喩にしか思えまい。あまりにも容赦なく写実的で、よそ者には戯画と見紛われかねない比喩だ。ここ北国のわれわれは良心を理由に驚くほど辛抱強く人を憎める。この稿の第一章で私は、国教会と自由教会の総会が、通りを挟んで相手の詩篇の歌声を聞けることを話した。場所ではたった通り一本、主義では影ひとつが両者を隔てるだけなのに、両者はそこに魔法をかけられたように座り、相手がいっそう神の恵みを受けるようにと、断罪するような声で祈る。二つだけならまだよい。だがスコットランドの諸宗派は姉妹の大家族で、白墨の線がびっしり引かれ、多くの人家のただなかを横切っている。エディンバラはまるで巡礼の地のように教会だらけの町だ。ウェスト・ボウの上方では石をひと投げできる範囲に四つある。戸口までいっぱいのところもあれば、記念碑のように空っぽのものもある。なのに新しい教会が工事中なのをいつでも見つけられるだろう。それゆえあの驚くべき教会の鐘のどよめきが、安息日の朝、トリニティと海べりの町から丘のきわのモーニングサイドまで突然湧き起こるのだ。金色の秋の朝、オックスフォードの鐘が交響曲を奏でるのを私は聞いた。耳に美しいものだった。だがエディンバラではあらゆる種類の大鐘が力を合わせ、いや、むしろ力をそらし合い、ふくれ上がる乱暴な騒音の一つのわめき声となる。一つが他を追い越したかと思うと、そのあとに遅れる。五つ六つがまさに同時の一瞬に疲れた鼓膜を打ち、やりきれない不協和の和音を作る。と思うと一秒のあいだ一斉に口をつぐむしめし合わせになったようだ。じつに世の中、エディンバラの安息日の鐘の音ほど陰気な騒ぎは多くない。耳障りな教会の警鐘、相容れない正統派どうしの叫び声で、それぞれ別個の集会に属する者がそれぞれ自分の会堂で、「右手の行きすぎ、左手の離反」に抗議するようにと呼びかける。しかしこの熱心さの行きすぎよりひどい行きすぎはまずあるまい。キリストの愛を裏切るこの離反より嘆かわしい離反もまずなかろう。シェイクスピアは喜劇『から騒ぎ』を書いた。スコットランド国民は同じ題で奇抜な悲劇を作った。この異例の芝居の成功を祝ってこそ、フォースの上の丘々で安息日の朝ごとにこれらの鐘が鳴るのだ。信仰についてほとんどまったく同じことを考える人々が、一つ屋根の下で同じ神を拝むだけの謙虚さをもちさえすれば、どれだけの鐘が塔で黙って休めよう、どれだけの醜い教会を取り壊して再び有用な建材に戻せよう！　しかし白墨の線がある。そしてどちらがまず鼻を折り、先に口を切るだろうか。

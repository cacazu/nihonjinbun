        "original_unit_id": "edin-067"
    "translation_ja": |-
      このいつまでも心を離れない田園の気配の大半を、われわれは根絶することができるし、実際そうするだろう。エルム・ロウでは最後の楡が枯れ、町のすべての外縁には別荘と労働者地区が急速に広がる。われわれは木を切り倒せる。死んだ舗石の下に草を埋められる。眠たげな町々を貫いて活気ある街路を走らせることもできる。少年時代の物語と遊び場を忘れもするだろう。けれども工事人たちの狂暴な熱意にさえすっかり廃して滅しつくすことのできない持ちものが、少しは残っている。丘だけは何ものにも取り除けない。エディンバラ城そのものを根こそぎにし町の華麗な建築を一切塵に帰すような、自然の大変動が起きでもしなければ。そして丘と入江とがあるかぎり、子供たちに残すことのできる立派な遺産がこちらにはある。こちらはびた一文払わずに、窓という窓が巧みに風景を描いたステンドグラスになっている。春が巡り、サンザシの花が開き、草原に若草の匂いがし始めると、いちばん密集した街路のまん中でも、田舎の丘頂は青年の目を見出し、旅と清らかな空気を思わせて、その胸を高鳴らせるのである。
    "translation_status": "reviewed"

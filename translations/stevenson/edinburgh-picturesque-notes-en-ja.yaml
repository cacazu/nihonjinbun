      だが消えたのは笛吹きだけではない。がっしりした石組みの大きな塊も幾つとなく虚空へ連れ去られた。たとえば敷石にはめ込まれた、この心臓の形を見たまえ。ここがトルブースの跡、ミッドロージアンの心臓、物語に古くからうたわれ、すぐれた書物に名を授けた場所だ。壁は今や塵に帰した。陽気な負債囚にとってのいわゆる「牢内の汚辱」はなくなり、おなじみの脱獄常習者を閉じ込めた檻も消えた。監獄の礎の上で太陽と風が自由に戯れている。敷石が往時を留める記念はそれだけではない。エディンバラの古い墓地はセント・ジャイルズ教会の裏手にあり、坂を下ってカウゲートに及び、現在の議事堂の敷地を覆っていた。これは牢獄やラッケンブースの店並みと同じく跡形もなく消えた。このいきさつを知らぬ人に見せられるしるしは、私の知るかぎり一つしか残っていない。議事堂前広場には、日々弁護士の足に踏まれながら、二つの頭文字と一つの年号が、自らに似せてスコットランドをまるごと作り直した、倦まずたゆまず、止めても聞かなかった男、ジョン・ノックスの眠る場所を示している。繰り返しその説教に鳴り響いた教会は、その寝床から声の届く所にある。

    "translation_ja": |-
      「我らの決して忘るべからざるジェームズ・レンウィック氏より聞くに、リースとエディンバラの間のギャロウリーにて、公然たる殺戮を目撃されたという。刑吏は五人の首を残らず叩き切り、ぶった切り、パトリック・フォアマンの右手をも切った。その胴体はすべて絞首台の根元に埋められたが、首はパトリックの手とともに運ばれ、プレザンス門にて五本の槍の先に載せられた……。レンウィック氏がまた私に語られたところでは、氏が初めてその手を加えた公の行いは、同信の友を集め、殺された彼らの胴を掘り出し、エディンバラの西教会墓地へと運び」、この時はグレイフライアーズではない、「そこに葬ったことであった。それから皆は市を回り……五つの首とかの片手を下ろした。夜が明けたので急いでプレザンスを上り、市の南側のローリストンの園地へ着いたときは、あまりの明るさに、当初の考えどおり首を胴のところへ持っていって埋める勇気はなかった。誰にせよ見つかればその場で死を意味したからである。ともにいた友のアレグザンダー・トゥイーディは当時その園地の庭師ゆえ、皆と相談のうえ自分の庭に葬ることにした。首と手は麻布に包んで箱に入れてあった。かくして彼らは四十五年から三日引いただけ、そこに横たわった。処刑は一六八一年十月十日、発見は一七二六年十月七日だった。その一画は幾年も耕されなかった。溝を掘った庭師がこれを見つけ、肝をつぶした。箱は朽ちていた。その園地の所有者ショー氏がそれを上げさせ、庭のあずまやの卓に置かせた。ショー氏の母堂は親切にも麻布を裁ってその上に掛けた。十二日間そこに置かれ、誰でも見られた。先にいう庭師アレグザンダー・トゥイーディは死に臨み、自分の園には財宝が隠してあるが金でも銀でもないと語った。その子ダニエル・トゥイーディが私とその庭へ赴き、父は遺物の上に白薔薇を、その下手に紅薔薇を植え、この二株は庭のどの株にも増して豊かに実を結んだと語った……。多くの者は」、首を見に、「好奇心から来た。しかし多くの真剣な男女が思いを寄せ、我らの殉教者の塵に慈しみを示すのを見て私は喜んだ。我ら六名は一七二六年十月十九日に葬ることとし、各々同志に日と刻を知らせることにした。水曜を選んだのは大半の者が処刑された曜日であるからで、午後四時を選んだのは大半の者が安息の墓に赴いた時刻であるからだ。我らの殉教者の遺骸を扱う流儀に従い、整った黒い棺を一つ作らせ、上等の麻布四ヤードを用意させた……。かくて上記の日時を守り、麻布を二重にして半分を下に敷いた。下顎は頭から外れていたが、若者だったゆえ歯は残っていた。頭ごとに穴があり、刑吏が槌で打ち抜いたものと全員が見届けた。頭蓋の大きさに合わせて顎をそれぞれの傍らに置き、麻布の片半分を上に引きかけ、棺に削り屑を詰めた。革命の折のように市の大通りを通ろうと熱心に勧める者もいたが、我らはそれを拒んだ。彼らをそのような見世物にするのは浮ついて軽薄に見え、これほど心を動かされる思いもよらぬ前代未聞の摂理を堅実真摯に受けとめることにそぐわぬと考えたからだ。かくてその場所からなら他の葬儀のふつう通る道を取った。すなわち城壁の裏を東へ進み、ブリスト門から入り、カウゲートの上端へ道を下り、折れて墓地へ上った。そこにて、殉教者碑のすぐ傍らに彼らを埋葬した。その場に集まった老若男女、牧師たちをはじめとする人々の群れたるや、私が一つ所で見た最大のものであった」

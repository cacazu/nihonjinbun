      ある一度の訪問は決して忘れない。灰色の、しずくの垂れる日だった。草は雨粒を糸に通したように連ね、家々の人は、雨から晴れ、晴れから雨と天気が変わるにつれ、シャツとペチコートを干しては腹を立てて取り入れるのを繰り返していた。墓掘りと、その友達の田舎の庭師が私についてきて、墓室や小さな中庭を次々案内した。昔日の裕福な者が自分の古骨を隣人から囲い隔てて満足した場所だ。その一つ、祠のようなものの下に、わびしく取り残された人像がいた。畝編みの靴下の細部に至るまでじつに写実的に出来ており、手には没年月日を記した札を持つ。名門の敷地にひとりで閉じこめられ、いたずらした年寄りの坊やか、新しい信仰に世が移って忘れられた下級の神のようで、たとえようもなく哀れで滑稽だった。牛蒡はなれなれしくその足のまわりに生え、雨は四方にしたたり、彼が何者でどこへ行ったかに対して世界は完璧な無関心を保っていた。もう一つは丸天井の墓で、外からは美しいが、内側は湿気と蜘蛛の巣でぞっとする。黒土の盛り上がりが三つと、むき出しの大腿骨が一本あった。庭師が長く仕えていた家の埋葬所だという。彼は旧知の人々の中にいた。「こりゃマーガレットお嬢さんのだろう」と親しげに骨をひと蹴りした。「あの年寄りの――め！」　墓地では、忘れてしまったほうがよさそうな記憶を永らえさせる墓をあまりに多く見るので、私はいつも落ち着かない。だがあの日ほどそれを感じたことはない。二つの例のどちらにも相当の金をかけた人々がいた。片方では悲しそうな嘲りの気持ちを、もう片方では侮辱のあだ名を引き出すために。人類の大半にふさわしい碑文は、犬儒じみた嘲笑「クラス・ティビ」、すなわち「明日はお前の番だ」ではないか、と考え始めた。難癖をつける者の口を封じるものがあるなら、それだ。最悪を認めると同時に、勝ち誇って敵陣へ戦いを移すのだから。

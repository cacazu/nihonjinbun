      グレイフライアーズはさまざまな記憶を宿す。坂の下端にあった今は取り壊された家のある窓を、伝説ゆかりの場所として墓掘りが指さしてくれた。首ひとつ五シリングで人を幾人も殺して悪名を馳せた死体掘りバークが、パイプをくわえ寝帽をかぶり、芝生で埋葬が行われるのを見るのにいつもそこに座ったという。もう少し上方の、当時は出来たばかりだったに違いない墓には、同じ情報筋によれば、宗教改革の騒乱の折にジョン・ノックスが身を寄せたという。教会の裏には幽霊の出るサー・ジョージ・マッケンジーの霊廟がある。血まみれのマッケンジー、盟約派をめぐる騒乱当時の法務長官であり、寛容について心地よい考察をいくつか書き残した人だ。前の世紀に、一度ヘリオット慈善学校の卒業生がその中で警察の追跡を避けた。学校はグレイフライアーズと隣り合う。芝生に囲まれた堂々たる建物で、創立記念日には大勢の子供が、輪の中のキス遊びや「桑の木のまわり」をしているのが見られる。だから逃亡者が何とか墓に隠れると、昔の学友たちには食べ物を運ぶ機会がいくらでもあった。国外へこっそり連れ出す船が見つかるまで、そこで無事に寝起きした。だが昼も夜もひとり、亡くなった迫害者と横たわっていられたとは、まさしく真鍮の肝でも持っていたにちがいない。他の少年たちはその勇気には遠く及ばなかった。魂が地獄にあることが確かな男なら、いかに豪奢な墓でも遺体がおとなしく寝ていることはまずない。いつか扉が開き、あの罰当たりが忌まわしい死装束で出てくるに違いない。法務長官の霊廟をノックして出てこいと挑むのは大層な剛勇のしるしと見なされた。「血まみれマッキンギー、出たきゃ出てこい、できるもんなら！」と命知らずの悪童は歌った。だがサー・ジョージには別の用があった。寛容論の筆者は、自らあれほど不寛容に手を貸して殺した大勢の人にまじり、平らかな眠りを続けている。
    "translation_status": "reviewed"

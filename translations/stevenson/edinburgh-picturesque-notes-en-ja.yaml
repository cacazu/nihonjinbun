    "translation_ja": |-
      カーク・イェトンは山並みの北東の角をなす。そこからペントランドは南へ、西へと向きをかえる。頂からは海へ下る広大な平野を見渡し、はるかな丘を幾種も見ることができる。ファイフの丘、ピーブルズの丘、ラマームアとオキルの丘。あるいは険しく、あるいはなだらかな輪郭が、距離に応じて濃く薄く青ざめている。ペントランド自体は、野生のヒースにおおわれた峰の野をなし、そのただなかで池が光る。そちら側の眺めはギャロウェイかアプルクロスに目を向けたほどに荒涼としている。反対へ向き直ると、ひと旅したようだ。はるか低地の中にエディンバラが身を現し、晴れた日には盛大な煙を作り、そのまわり何マイルにも郊外を広げる。城が真ん中に黒々とそびえ、わきにはアーサーズ・シートが風景に思いきった形を与える。耕地、森、煙ののぼる村、白い田舎道が、まわりじゅうで地のうねる表面に変化をつける。鉄路を列車がゆっくり這っていく。小舟が入江を間切っている。ひとつの教区ほどもある山のような雲の影が風の前に旅してゆく。風そのものは森と実った穀物を波立たせ、移ろう色の波を景色の端から端まで走らせる。そうしてオリンポスのユピテルのようにあなたは座り、はるか遠くから人間の暮らしを見下ろす。町は死者の町ほど静かだ。人で沸き立つどの通りからも、声ひとつ、足音ひとつ、丘のあなたには届かない。磯の砕け波、犂を引く人の声、小川と水車、鳥と風が、平野じゅうで賑やかな合奏を続けている。農家から農家へ、犬と時をつくる雄鶏が応酬し合う。なのにオリンポスに比すこの席からは、列車のささやく気配を除き、世は死んだような沈黙に没し、町と田舎のなりわいがあなたの耳に対して声を失っている。鳴く山鳥、羊の声、枯草に歌う風は、静寂を破るよりそれに伴奏するようだ。魂の耳には、しかし眺め全体が人間的かつ田園的な音楽をなし、人の定めについての心地よい省察を奏でる。尖塔の並ぶ人々の町と、船と、仕切られた畑と、草を食む群れと、真っ直ぐな街道とは、人間の働き好きで快適さを好む流儀を目に見える形で語る。あなたがどれほどの怠け者、どれほど心を動かされぬ人だろうと、眺めには血をわき立たせ、明るい気持ちで働こうと思わせる何かがある。
    "translation_status": "reviewed"
  - "id": "edin-113"

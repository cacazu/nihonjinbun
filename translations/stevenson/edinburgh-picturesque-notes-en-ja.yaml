        "original_unit_id": "edin-103"
    "translation_ja": |-
      下では道が流れを越えてボウ・ブリッジを通る。今は酪農場だが昔はウイスキーの蒸溜所だった。前の世紀のある時、そこの蒸溜業者と巡回してくる物品税の役人とが、たまたま懇意だった。役人はのんびりと人なつこい性質で、酒席を楽しませる術の達人だった。折にふれエディンバラから歩いて出て、蒸溜業者の在庫量を測らねばならなかった。仕事が友人の方角へ連れていってくれるのは嬉しいが、訪問のせいで友人が損をするのは残念なことだった。そこでフェアマイルヘッドの辺りまで来ると、酒量の検査官は旅の必携品であるフルートをポケットから取り出し、組み立て、もっぱら自分の楽しみのため、また景色の美に心を動かされたからといわんばかりに、思いきり演奏を始めるのだった。愛奏曲は「丘を越えて、はるか彼方へ」だったらしい。初めの音で蒸溜業者は耳をそばだてる。フェアマイルヘッドでフルート？　しかも「丘を越えて、はるか彼方へ」だって？　これは親しい敵、税の検査官に違いない。すぐさま馬に馬具がつけられ、ウイスキーの樽がいくつも荷車に積まれ、ヒル・エンドを回って全速力で運ばれ、カーク・イェトンの裏の苔むした谷に埋められた。同時に、まるまる太った鶏が火にかけられ、奥の客間にはいちばん白い食卓布が用意されたのも請け合ってよい。少したって、ひとまず音楽に満足した検査官が、想像の及ぶかぎり無邪気な顔をしてぶらぶら下りてくると、ボウ・ブリッジの善良な人々はその到着にまったく不意を突かれたふうだが、それでも訪問を大いに喜んだ。食後のひとときは、蒸溜業者の酒と検査官のフルートとで、あっという間に過ぎた。そして双方が少しいい気分になると、意味ありげな目配せを伴奏に「丘を越えて、はるか彼方へ」で夕べを結んだ。少なくともこれは、独創的で半ば牧歌的な特徴を帯びた密造酒の話である。
    "translation_status": "reviewed"
  - "id": "edin-104"

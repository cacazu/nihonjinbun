      ハイ・ストリートのランドの倒壊には、少なくとも空想めいたところはひとつもなく、恐怖と現実をなすあらゆる事情があった。建物は芯まで腐っていた。下をくぐる路地は急に狭まって、掃除人の手押し車が通れなくなった。夜にはひびの割れる音や反響が家じゅうに鳴った。その巨大な老いた人間の蜂の巣の住人たちは、階段で会うと身の危険を話し合った。恐怖に駆られて部屋を捨てて逃げた人も何人かいたが、節約心か自尊心が頭をもたげてまた戻った。すると日曜の朝、まだ闇の濃い時刻に、凄まじい轟音とともに建物の全体がひとかたまりになり、階が階の上に落ち重なって地に倒れた。物理的な震動は遠くにも近くにも伝わり、心の震動は朝の牛乳売りの娘と一緒に郊外のすみずみまで届いた。灰色のその午前ほど、エディンバラに教会の鐘がうら寂しく響いたことはない。死はたいした収穫を上げ、サムソンさながら、ひとつの屋根を落とすことでたくさんの家族の暮らしを滅ぼした。見た者であの妻壁の様子を忘れた人はあるまい。部屋によってここは漆喰、あちらは壁紙、ずっと頭上のここにはまだ炉棚にやかんが立ち、あちらの暖炉の上には安物の女王の絵が貼ってある。この災害のために三十家族の暮らしが一瞬見えたのだ。みな、巡る歳月から突然断ち切られた。ランドが倒れた、そしてランドとともに、どれほど多くのものが！　遠い田舎の人々は町並みが一つ歯抜けになったのを見た。太陽は煙突と煙突の間の、見慣れないところから顔をのぞかせた。そして世界じゅうで、ロンドンで、カナダで、ニュージーランドで、どれほど大勢の人があやまたず叫ぶことができたか、考えてもごらん。「ゆうべ、私の生まれた家が倒れた！」

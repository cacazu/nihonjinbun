      田舎の人が丘の頂々にエディンバラを見るのも一つのことなら、町の人が仕事の真っただ中から田舎を見渡せるのは別のことだ。日ごと仕事場へと小走りに行く途中、森に春の緑が明るさを増し、畑が進んでゆく犂の刃の下で黒くなるのを見ることができる。それは生活の中へ温かく人をよくする力を及ぼしてよいはずだ。よい思いを呼び起こし、自然が人の悩みに頓着しないことを思い出させてよいはずだ。このことに関連して私は、安物の笛のような声、鈍い耳、限られた視力しか持たぬ人類の能力の乏しさを、嘆きたくなることがある。もし天国で人が見るといわれるように見ることができたら、もし高等な種族に想像できるような目があったら、立っているところからほんの数ヤードならず数マイルも先の対象まで、はっきりと見て取ることができたら。エディンバラの街路を歩く目にどれほど愉快なもてなしがあり、思いにどれほど楽しい変化が生じるか考えてもみたまえ！　なにしろ市中の往来のまん中で、仕事上の難問に足を止めたとき、ペントランドのヒースに覆われた山の肩でひと息つこうと座り込む羊飼いと、ふと目が合うかもしれない。あるいは田舎の楡によじ登っている腕白が葉をかき分け、火照った田舎顔を見せるかもしれない。あるいは舵柄を肘の下に当て、帆を風に鳴らして沖へ急ぐ漁師が、アンスターとメイ島の間から挨拶を投げてくれるかもしれない。

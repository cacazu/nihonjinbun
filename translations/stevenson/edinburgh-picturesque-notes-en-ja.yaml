      昔、エディンバラ大学は勇壮な雪合戦の舞台で、一度の騒擾など軍隊に介入してもらうという叙事詩級の栄誉を得た。だが偉大な世代は残念ながら絶えたようだ。私の在学中にさえ、その精神は目立って衰えた。一方、スケートと靴底での滑走はますます敬われ、この国の気質から生まれたカーリングも、おろそかにされることはほぼあるまい。スコッチ・バンを食わしめるほどの愛国心が、カーリング池でその人を見放すことはそうない。長く急な舗道のあるエディンバラは、靴底で滑る者たちの正真正銘の故郷である。幸福な腕白の多くは学校までずっと滑って行けるし、お使い小僧の職業は休日の娯楽に変じる。スケートなら、これほど立派に恵まれた都市はほかにまずない。アーサーズ・シートの南の切り立った側に、ダディングストン湖が横たわる。夏は青い盾で、葦原から白鳥が舟のように出てくる。冬にはからからと鳴り響く氷の野となる。その上手、緑の岬には村の教会が座り、豊かな木々の中から村の煙がのぼる。教会の門には歴史上の首枷がある。罪を見つけられた者の首が贖罪に課された場所だ。そして歴史上の騎乗石もある。オランダ船のような胴回りの地主や農民が、そこから鞍にのぼった。チャーリー王子はプレストンパンズの戦いの前ここで眠り、職人組合長ブロディかその一党の一人がチェッセルズ・コートの夜盗の前に犂の刃を盗んだのもここだ。湖の反対側では土地がクレイグミラー城へと盛り上がる。ステュアート家のメアリーを崇拝する人々に優しい場所だ。夏でさえアーサーズ・シートからこの湖を見下ろすのはひと登りする価値がある。だがスケート日和ならその十倍もある。表面にはたやすく素早く動き、千通りもの優雅な角度に傾く人の群れ。群衆は開いては閉じ、水のように自分自身の中を動きつづける。飛ぶ鋼の刃を受けて氷が半マイル先にまで鳴る。夜が寄ると一人一人の姿は薄闇に溶け、やがて湖にはかすかにうごめくもの、黒いかたまりの往来だけが見える。もう少したつと最初の松明に火が入り、黄色い照り返しの輪を連れて氷を素早く横切り出す。それに続くものが一つ、また一つ。ついには野という野が滑り飛ぶ明かりでいっぱいになる。

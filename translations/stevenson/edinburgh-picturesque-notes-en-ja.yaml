    "translation_ja": |-
      さらにあおり戸をくぐると、第一上訴部の裁判官が一人ずつ座る鳩の巣箱のような小部屋や、最高位の裁判官が三、四人ずつ列席する公判廷へ出る。ここには法曹席の内にスコットの場所が見える。裁判の進む単調な唸りを聞きながら、彼はここでウェイヴァリー小説の幾ページも書いた。耳にするのは、かなりの量の機知と、各判事閣下が軽口をまったく軽蔑しきってはいないおかげで、ほどよい分量の辛口の笑いである。いかにもスコットランドの濃い方言はもはや法壇から追放されたが、法廷はまだいくらか国民的な風味を保つ。われわれには、一つの事件を厳粛に、しかも楽しんでいつまでも味わう仕方がある。法律を美術の一つとして扱い、よい区別を舌で愛でて腹でこなす。急ぐことはない。一点一点が正しく調べられ、原則に還元されなければならない。判事閣下はひとりまたひとり、悦に入っている同僚たちに傍論を開陳せねばならない。

      議事堂前広場はスコットランド史にしるしをつけた出来事の舞台だ。たとえば一六八八年の会議から主教たちが追い出された時、「十四人全員が青ざめた顔で寄り集い、議事堂前広場に一団の暗雲となって立った」。一生、もう好天は望めなかった哀れな高僧たち！　居合わせた西部の盟約派のうち協会派に属する何人かは、彼らの絞首刑に立ち会えたら「金銀の大山にも増して喜んだ」連中で、あまり乱暴に突きもんだので主教たちは互いに頭をぶつけ合った。失脚した敵への寛大な振る舞いとは言えない。だが協会派の少なくとも一人は、締め具の拷問長靴を履かされて呻いたことがあり、全員が親しい友を処刑台に見ていた。また「悲しむべき合同」の折、スコットランド最後の議会からひいきの人物を護送しようと民衆が押し寄せたのはここだった。それはボズウェル流に言えば民族意識に顔をほてらせた人々で、いつでも暴動が起こせる勢い、たった今も窓から外を見る『ロビンソン・クルーソー』の作者に石を投げつけたところだった。

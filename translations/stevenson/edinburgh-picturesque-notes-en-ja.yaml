      エディンバラの三方では、市から地勢が下っていく。こちらでは海に向かい、あちらではハディントンの肥えた農地へ、別の方ではリンリスゴーの鉱床地帯へ。南だけは上りつづけ、ついには城より高くなるばかりか、アーサーズ・シートを見下ろすに至る。この一帯の個性をかなり強く印すのは、生け垣の乏しさ、高さがまちまちの多くの石壁、それなりにある樹木で、中にはよく育った木もあるものの、北国らしく藪めいた輪郭になって葉が少ないこと、そしてあちこちではエスク、リース、アーモンドといった小川が谷底をせわしなく旅していること、ほとんどどの地点からでも海か丘をちらりと眺められることだ。変化に事欠きはしないが、しかもその要素の大半はどの部分にも共通する。かなり高い頂と広い眺望によって際立つのは、南部地区だけである。

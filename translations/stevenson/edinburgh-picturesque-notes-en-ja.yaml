      それからウィア少佐がいる。その家まで今では取り壊されてしまったのに、古いエディンバラは彼の不浄な記憶をぬぐい落とせない。少佐と妹は、酸っぱくなった信心の匂いに包まれて一緒に暮らしていた。妹はひどく風変わりな独身女性で、彼には祈願のまれな才があり、敬虔な崇拝者の間では天使のトマスの名で知られていた。「背の高い、浅黒い男で、たいてい地面に目を落としていた。顔つきはいかめしく、鼻は大きい。衣はつねに外套で、いくらか黒ずみ、杖なしには出歩かなかった」。天使のトマスが杖とともに焼かれ、妹のほうはもう少し優しく絞首になったのはいかなる事情か、この二人はただ激しやすい部類の宗教狂人だったのか、それとも昔かたぎの両肩に空想の罪のほか本物の罪をも負っていたのか。幸いにもそれはわれわれの目的の及ぶ範囲外である。少なくとも、暗く猛烈な信仰が実を結び、咲ききった精華として、この迷信深い町からこうした実例の一つが出たのは不似合いではない。また少なくとも、その事実は世間の想像をとらえ、並外れた神話の一族をもたらした。どうやら少佐の杖は使い走りをこなし、暗い夜には角灯をさげて主人に先立って走りさえしたらしい。真夜中や朝のあらぬ時刻には、女の巨人たちが「雷鳴のように笑い、ひひひと笑いながら大口を開けて」、住まいの裏手をうろついた。家にはあまりに重い悪名がかぶさり、市の改良事業が建物を平らにしてしまうまで、そこで眠る勇気のある者はいなかった。そして私の父は幼い頃、子供部屋でこんな話を何度も聞かされた。真っ黒で火と燃える目の馬六頭が引く悪魔の馬車が夜ごとウェスト・ボウに乗り込み、帰りの遅れた人には窓ガラス越しに死んだ少佐が見えるのだと。

      実際、もっと近くで見ても旧市街はいかにもよく燻されている。年がら年じゅう雨にしっかり洗われてはいるものの、年若い郊外にまじると厳めしく煤けた顔をしている。危険な地勢に立つ城壁都市の成長を律する法則に従い、面積ではなく高さと密度を増して育った。公共建築は場所さえあれば大通りのまん中へ割り込まされ、大通りは路地にまで痩せた。人家はひと階またひと階と跳ね上がり、まるでカルカッタの黒穴牢にでもいるように隣人が隣人の肩にのぼって、ついには住民が縦に十四、五人重なって眠るまでになった。これらの建物を土地の言葉で「ランド」という。そのいちばん背の高いものはとっくに焼けたが、今も八つ十の窓がひと続きにのぼっていくのは珍しくない。ウェイヴァリー橋の上に今にも崩れかかりそうにそそり立つ家並みの断崖は、今にして天然の崖を幾つも顔負けさせるだろう。急な山腹に植えつけられた地下室がすでに見る者の頭より高い。屋根裏部屋とくれば、家具はみんな質屋にあるかもしれないが、ハイランドの山々まで見晴らす、みごとな眺めを誇る。貧しい男はエディンバラのど真ん中、その高みをねぐらにして、なお窓から緑の田舎をのぞくことができる。何尋も下には、広い方形広場と庭のある裕福な人々の町区を見る。頭上にあるのは市の石造りの一番上の帆ともいうべきいくつかの尖塔だけ。風も田舎そのままの清らかさでここまで届き、海の香や、春なら花開くライラックの匂いを少しばかり運んでくるかもしれない。

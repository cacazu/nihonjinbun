        "original_unit_id": "edin-057"
    "translation_ja": |-
      こうしてついに彼らはそこへ、「安息の墓」へたどり着いた。人は自分の義務を果たしているかぎり、たとえ大いなる思い違いのなかでそうしているのだとしても、模範となる生を送っていることになる。殉教者碑の傍らに横たわることになると否とにかかわらず、神の摂理のどこかに安全な港を見つけるのは確かだ。死を思いめぐらすのはよくない。それを蔑んだ英雄たちへの思いで和らげてこそよい。いかなる理由で蔑んだのかは大したことではない。たとえば地球の裏側にも人が住むと信じたために焼かれた司教のことでも、その記憶は心を軽くし、墓のあいだを煩わされずに歩かせてくれる。だから殉教者碑は死者の野にあって健やかで胸を温める地点である。見つめるうち、務めを解かれ、パトリック・ウォーカーの別の言葉を借りれば「きれいさっぱり舞台を降り」おおせた人々の国から、勇ましい力がわれわれのもとへ届くのだ。

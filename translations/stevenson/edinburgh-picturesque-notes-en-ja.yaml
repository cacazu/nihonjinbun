      灰色修道士の庭を開放したのはメアリー女王だった。当時は新しく、いくらか田園めいた墓地だったが、やがてそれ自体が古跡となり、五つ六つの別な墓地に取って代わられた。夏の夕べの修道士たちは愉快に過ごしたにちがいない。その庭は、高い城と、城をいただく岩のうちいちばんそびえ立つ崖とを正面に見て、願いどおりの場所にあった。今でもわれわれエディンバラの名だたる展望地の一つであり、丘の上にいかに風変わりにこの町が横たわっているか、もう一つの実例を見せるために旅人を案内する。囲いは不規則な形をしている。頂の平らなところに新旧グレイフライアーズの二つ連なった教会が立つ。サンザシの木がぽつぽつと生え、地面は段と急な坂になって北へ下る。開けたところには平たい墓石や卓型の墓石がたくさん見える。周囲をぐるっと、ぞっとするほど飾り立てた上流の霊廟の一陣が取り巻く。

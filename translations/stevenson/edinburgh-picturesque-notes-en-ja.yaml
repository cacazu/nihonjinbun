      十七世紀の信仰篤い人の一人は、スコットランド法曹界に入るための試煉、今の言い方では試験に臨もうとして、この議事堂前広場が口を開け、地獄の入り口が見える幻を目にした。無理もないが、それがその人の回心のきっかけになった。場所柄にふさわしくない幻でもなかった。病院の次に法廷ほど醜い文明の一片があろうか。妬みと悪意と、およそ慈愛の正反対をなすものが公の試合に決着をつけようとここへ来る。犯罪、破産、引き裂かれた家庭、悪漢とその餌食が、吸い寄せられるようにして、この回廊のある低い建物にたどり着く。破滅後の最初の一時間を、セント・ジャイルズの鐘は何人の耳に告げてきたことだろう。鐘の打つ数を数えようと立ち止まり、ぼうっとして胸の悪くなる思いで、また動き続けるハイ・ストリートの人波へさまよい出る人々が、目に見えるようだ。

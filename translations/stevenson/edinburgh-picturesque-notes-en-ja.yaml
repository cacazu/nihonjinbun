      当日は日曜と同じく店という店が閉まる。扉を開けておくのは酒場と玩具屋、そのほか祭の店だけ。だれもが自分のお年玉に期待している。郵便配達夫と点灯夫は受け持ち地区の全戸に、願いと礼とをひと息に盛った方言詩を一枚ずつ置いていった。その詩には時として細部や情感に本物の手触りがあり、扱いにもいくらか力があるのはスコットランドの特色だ。町じゅうで首巻きをした学童が半クラウンを使い果たそうと急ぐ姿が見える。年始まわりは無限にある。上品すぎる階級を除いて誰もが通りにいて、聖句のように定まった挨拶があちらこちらで聞かれる。『オールド・ラング・サイン』があちこちで歌われ、ウイスキーとショートブレッドは消費の主役だ。よそから来た人は早い時間から酔った男の数の多さに心を打たれるだろう。午後になれば酔いは女たちにも広がる。社会のある層にとっては、元日にしこたま飲むのは日曜に教会へ行くのと同じだけの義務だ。この季節に敬意を表そうと一月も賃金を貯めた者がいるかもしれない。多くはポケットにウイスキー瓶をしのばせ、まるきりの他人に当惑するほどあふれる親愛で押しつける。辻馬車に身を託すのは得策でない。少なくとも御者を長時間観察してからでなければ。端から端まで人のこみ合う通りは、慎重な舵さばきを要する場所となる。一人で、あるいは腕を組んで、ある者は口もきけず、ほかの者はやかましく喧嘩腰で、新年の信者たちは人混みを縫って蛇行し、互いにどしんとぶつかり、ときおり一人が倒れ、倒れた姿のまま路上に横たわる。日が暮れるまでに多くが寝床か警察へ行き、街路はかえって少し空いたようになる。仮装して家々を訪ねる人や、年が明けて最初に訪れる客たちは今では田舎のほかほとんど見られぬので、新年が鐘に迎えられ、トロンの鉄柵の所で布告されてしまえば、祭は屋内へ戻る道を見つけ始め、静けさに似たものが町へ帰ってくる。だがあの幾層にも重なる集合住宅の中に、正体なくいびきを立てる者たち、割れた頭や空のポケットがどれほどあるかを思え！

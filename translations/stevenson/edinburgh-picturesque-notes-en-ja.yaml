    "translation_ja": |-
      法廷以外に同じ屋根の下に据わっているのは、図書館が実に三つ。そのうち二つはなかなかのもので、ややこしい半地下に階段と回廊が入り組んでいる。昔の枢密院が盟約派を拷問したその場所で、いかにも学問好きそうな鬘が角灯の明かりで小説を釣り上げるのが見られる。議事堂は傾斜の上に建つので、北には一階しか見せないが、南には少なくとも六階を数え、しかも図書館の下に幾列もの地下室が延びている。この坂の都をこれ以上よく表す場所はほとんどない。石段を一つ、また一つと下り、マッチの揺れる灯で石蔵の迷宮をさまよう。今は外広間の下を通り、頭上にきびきびとして、しかも幽霊めいた、法律家の足音の果てしないぱたぱたを聞く。今はのぞき窓のある頑丈な扉に行き当たる。向こう側には警察の留置房と、刑事裁判所の被告席に通じる仕掛け階段がある。あそこをいかにも軽く上がっていった足が、下りには死ぬほど重くなった例は少なくない。頭上の法廷で、長い時間かけて弁がふるわれるうちに命を取り上げられた男は幾人もいる。だが今のところ、この悲劇の舞台は平日の教会のように空っぽで静まり、法壇にはくまなく覆いが掛かり、動くのは壁の陽の筋ばかりだ。もう少し行くと、ほかのように空ではなく、過ぎ去った刑事事件の証拠品でいっぱいの部屋に出会う。物騒ながらくたの数々。人を死なせた武器、瓶に漬けた毒を受けた臓器、羽目板を銃弾が射抜き、その裏で人が倒れて死んだ扉。最後の審判の日に備えるのでなければ何のためこんな物を保存するのか、私には想像もつかない。さらに下りつづけていると、とうとう黄色いガス灯がちらりと見え、行く手でひしめきささやく物音が聞こえる。次の瞬間、角を曲がると、白く塗った廊下で機械のベルトが車輪の上をせっせと回っている。機械は床下の茸のように、ひとりでにここに生えたのだと思いたくなる。やがて自分を紡いで広がり、この神秘的な営みで地下室を端から端まで満たしそうだ。ほんとうは蒸気換気装置の歯車か何かにすぎない。近くに機関係が見つかり、その戸から日の光のなかへ歩み出られる。これまでずっと、あなたは地球の中心に向かって下りていたのではない。丘の麓、議事堂の礎まで下りただけだ。なるほどずいぶん下にはいるが、まだ開けた空の下の、草の生えた野原である。白日の光がアイルランド人街の裏窓を、壊れた雨戸、曲がった妻壁、倒壊寸前によろよろした古い家をけばけばしく照らし出す。崩れかかった人間の豚小屋、豚のような人間には相応の住処なのだ。わずかな洗濯物か、窓の顔ひとつ以外、生活のしるしはほとんどない。住人は外へ出ているが、夜には戻ってきて、よろめきながら粗末な寝床にたどり着くだろう。

      城とホリールードをつなぐ地下道があり、勇敢なハイランドの袋笛吹きがその曲がりくねった道の探検を志願した、という他愛ない話がある。彼はストラススペイ舞曲を奏でながら高いほうの端から入り込んだ。物好きな人々は、下から聞こえる笛の旋律管の音で下りていく道筋をたどりながら、通りを歩いてついていった。と、ほぼセント・ジャイルズの高さまで来たところで、楽の音がいきなりぷっつり切れ、人々は手を上げて途方に暮れ、道に立ち尽くした。ガスに息を塞がれたのか、泥沼で命を落としたのか、悪魔のやつに身ひとつそっくり持ち去られたのか、それはまだ疑問だが、とにかく笛吹きはその日から今日に至るまで誰に見られたこともなく、物音ひとつ聞かせもしない。ひょっとすると詩人トマスの国へ迷い込み、いつの日か、誰も考えてもいない時に、日の光のさす地上世界をまた訪ねる気を起こすかもしれない。セント・ジャイルズ脇の乗り場の辻馬車の御者たちには、妙な一瞬となろう。馬の足もとの大地の腹の底から、袋笛の低い唸りがまた上ってくるのを耳にするときは。

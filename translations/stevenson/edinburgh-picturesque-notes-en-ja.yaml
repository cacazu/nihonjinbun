      古いことは絵になることと同じではない。また、旧市街が風変わりな面構えをしているからといって、まったく新市街がありふれて見えるということにもならない。実際、古めかしい家を除けば、同じ描写がどれほど両者に共通して当てはまるか、不思議なくらいだ。同じ唐突な地面の起伏、平野を足もとに置くよく似た立地、社会の一層が別の層の上に乗る同じ重なり方が両方に観察できる。たとえば東からプリンシズ・ストリートに入る、ホテルと官公署の並ぶ広々と整った道は、ロー・カルトンの峡谷をひと跳びにする。欄干越しにひと目投げると、リース・ストリートへ流れ込むあの日の差さぬいかがわしい支道を真上からのぞき、同じ高層家屋が上下両方の街路へ戸口を開く。そいつは新市街が自分自身の地下室を頭上から通り越すだけのことで、町や人類の流儀で、いわば自分の子供を踏み越えて歩いているのである。だがディーン橋ならもっと新趣向の眺めが見られる。深い谷底を川が岩の間、庭と庭との間に流れる。両岸の頂は近代都市で最も住み心地のよいたぐいの街路と弧形の家並みが占め、立派な橋が両方の頂を結ぶ。毎日午後にはそこを自家用の馬車が勢いよく通り過ぎ、名刺入れを持つ淑女らが社交の務めを果たすため行き来する。なのに下をのぞくと、今も水車と泡立つ堰を備えた小さな田舎のディーン村が見える。近代の改良は高い高架橋を通ってその頭上を過ぎた。広がった都市はいともきれいに、かつて豊かな市民の夏の避暑地だった所を飛び越して変わらぬまま残した。どの町も成長すれば村を抱え込む。エディンバラ自身もずいぶんたくさん抱え込んだ。だが村が一つ今も生き延び、しかも自分の通り道より数百フィートも下にいるのを見るのは妙なものだ。埋もれたヘルクラネウムの上に建つのはトッレ・デル・グレーコだったろうか。少なくともヘルクラネウムは死んでいた。しかしディーンの屋根には今も日が差し、煙突からは律義に煙がのぼる。粉まみれの粉ひきが戸口に出て、ころころ鳴る水を見、回る水車と小屋のまわりの鳥に耳を傾け、交響の響きをいっそう豊かにしようと自分の歌を口笛で加えることさえある。まるでエディンバラは今も城山の上の古いエディンバラで、ディーンはなおも緑の田舎へ一マイルばかり埋もれた、ひっそりこの上ない小村だとでもいうように。

      すぐ下にフェアマイルヘッドがある。屋根の点と煙る煙突ひとつ、丘にかかる林の傍らで荷造りの麻紐より太くはない二本の道が交差する。想像好きなら例の物語の検査官を思い出すだろう。かつて笛に唇と指を当て、山の空気のなかへ澄んだ音色を吹き出した老収税官の姿、そして好んで吹いた歌の詞が、心を「丘を越えて、はるか彼方へ」、遠い国々へ運ぶ。そこにエディンバラの幻が現れる。それは眼前のように小さな近隣一帯のまん中にある町ではない。まるい地球に浮き出した飾り鋲のように、ヨーロッパの全土と深海とをまわりに控えた町である。どの場所も地球の中心で、そこから街道が放射し、船が外国の港へ帆を上げるのだ。教区の境も帝国の国境も、片方が余計に空想上のものということはない。自宅の書斎にすわり、勢いよく本を書く男と同じように、一つの町は影響と自らの肖像を海外へ送り出す。エディンバラから移り住んだ人で、遠く近く、中国からペルーに至るまで、何枚かの生き生きした心の絵を携えていない男女は一人もいない。城の崖の背に沈むあの日の夕陽、雪のひと景、街灯の迷路のひとつ。記憶から消えぬそれを労働の合間に眺めるのは、嬉しいことだ。そういう人々の行くところにたまたまこの本が届いたならば、ここに故郷の絵をもう少しばかりお目にかけよう。かつて住んだ家、散歩した道に心当たりがあれば嬉しい。
    "translation_status": "reviewed"

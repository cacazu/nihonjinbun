      今やどの家庭でも干しぶどうのパンがよく食べられる。晴れの朝の何週間も前から、菓子屋はスコッチ・バン、すなわち命に有害な黒く重い物質を山と積み、季節と家族の愛を祝って、砂糖煮の果皮や砂糖菓子で標語を飾った満月形のショートブレッドを並べる。「古い煤け町から」「みいんな、よい新年を」「ふるさとの年寄りに」などはこの意匠のうち特に好まれるものだ。凍てて痛い丘の道を半日旅した運送屋が、テヴィオットデールの小家か、マナー・グレンのナナカマドの中の小家の前に馬を止め、年老いた者たちが目を潤ませ、町にいるジョックかジーンのために祈りながら小包を受け取る姿が浮かばないか。この季節、また一年の災いと粘り強い闘いの戸口に立つと、人は互いを結ぶ鎖をもっと寄せ合いたい気持ちをもつ。戦争前の同盟相手を数えるように友の数を数え、朝には不在の者を名で呼んで神の保護に委ねるとき、祈りはおのずと長くなる。

      堂々たるデイヴィッド・ヒュームが旧市街からの脱出に自らの模範の重みを貸し、ある通りに新居を定めてから、まだそう長くはたたない。その道は今なおセント・デイヴィッド・ストリートとして知られている。冗談がなんと奇妙に永続することだろう。町はまた、休日の学童が自分の戸口から半マイルも行かずに鳥の巣を荒らせぬほど大きくはない。記憶の鼻孔には今も犂の匂いがする場所が幾つもある。こちらでは誰かがサンザシの枝でクロウタドリの声を聞き、あちらでは別の誰かが夏の夕に苺のクリームがけを食べに連れて行かれた。今のお住まいの場所に穂波が立った小麦畑を、ご自身も見たことがあろう。エディンバラの少年の記憶は、一部だけが町の記憶なのだ。私が懐かしく思い返すのは、庭塀のあの数々のよじ登りであり、鳥の笛でいっぱいのライラックの間の数えきれない散歩であり、町でも田舎でもない目立たぬ一画で重ねた探検である。そして友にも私にも、ことさら興味があり、物語めいた一点があり、異国を旅するような気分があったのは、遠足の途中で昔の村の切れ端に突き当たり、街路と方形広場の間に埋め込まれた田舎家を幾つか発見した時だったと思う。スコットランド・ストリート駅に通じるトンネル、ブレーキ車に車掌二名を乗せた列車がその暗い口から飛び出してくる眺め、その長さ、その頭上にのしかかる数々の重い大建築と開けた大通りへの想像は、たしかに幼い心にこの上ない印象を刻んだ。それはエインズワースの小説で馴染んだものより口径は大きかったが、地下の通路だった。「地下の通路」というその二語こそ、それ自体に抗しがたい魅力があり、大好きだった英雄や、真似したいとひそかに願った真っ黒な悪漢の心に、われわれを近づけてくれるようだった。西プリンシズ・ストリート庭園から城の岩をよじ登り、勝ち誇って防壁そのものに手を当てるのは、上等な部類の物語的愉悦を味わうことだった。ほかにも数々の眺めや手柄が、思い出の歓喜の強い光に照らされて心に押し寄せる。だがそのどれ一つとっても、キャノンミルズ、ウォーター・レイン、あるいはブロートン・マーケットの金塊のような田舎家のかたまり、そのような一隅を探検した時の発見者の歓び、老いた〈時〉と、時が地の面にもたらす緩慢な変化とを感ずる思いには及ばない。開けた田園よりも田舎らしく、ハイ・ストリートで最古のランド以上に古を感じさせた。彼らもまたファーガソンの蝶と同じように、自分のいた場所からうっかり遠くまで来たような妙な風情があった。妻壁、蔓草、外階段、走る水車の水路を備えた家々は、照れくさそうで家庭的だった。私がいつも四月を過ごした田舎の庭の奥と同じ匂いのする片隅もあった。戸口に立ちおしゃべりをする人の様子は、コリントンやクラモンドにいるかと思うようだった。

      墓地芸術の英雄様式に属するルービリヤックの墓碑を別にすれば、死をおどろおどろしく絵解きする点ではスコットランド人が諸国民のなかで最上位に立つ、と私には思われる。われわれは時と一大変化の象徴をそれ自体のために愛するらしい。田舎の教会のまわりでさえ、頭蓋骨、交差した二本の骨、鼻のない天使、審判の日を告げて鳴り渡るラッパの、驚くべき陳列が見られる。石工はだれもが平凡なりのホルバインだった。死を深く意識し、墓地をぶらつく人の前にその恐怖を手短に突きつけるのを好んだ。死すべき身にまつわる荒削りの着想が胸いっぱいに詰まり、死んだ農夫ならだれでも説教の題に捕らえられた。この芸の古典的な作例がグレイフライアーズにある。当時はさだめし金のかかった碑で、均整のとれ方も甚だ優雅と同時代人に認められたのだろう。今では優雅さがさして明らかでなくとも、意味は残る。あまりにたくさんのラテン語の銘、柱身に沿って縦に這い上がるもの、天使のラッパから巻紙に書かれて出てくるものや、恐怖の寓意、墓穴から頭なしで起き上がる像、祖先が死者への悲しみと地上の無常の感を表すのに好んで用いた昔ながらの趣向の数々を見て、あなたはついほほえむかもしれない。だがそれは腹の底からの笑いではない。装飾の一つ一つは、いかにも陽気な徒弟が槌を振るいながら口笛まじりに刻んだのかもしれない。けれどもその一つ一つのもとの意味も、静かな囲いにこれだけ集まった時の効果も、もの悲しいほど真剣である。
    "translation_status": "reviewed"

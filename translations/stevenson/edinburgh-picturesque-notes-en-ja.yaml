      元の設計が不完全で先見を欠き、この土地の可能性を十分に生かさなかったことは否めない。建築家は根から都会の鳥だった。街路の眺め、そしてただ街路の眺めだけを考えて近代都市を割りつけた。田園は計画に入っておらず、彼は丘に向けて目を上げたことがなかった。そうしようと思えば、北斜面の道は一本残らず見事な段状の通りとなって、広く美しい見晴らしに君臨できたのだ。ところが余りに建て込んでしまった。多くの家は向きがあべこべだ。『天路歴程』の熊手を持った男よろしく、注目に値しないものに一心になり、非礼にも列の中で尻を前にして立つ。要するに町を越えて変化に富む周囲を眺められるのは、往々にして屋根裏の窓か、あちこちの交差点でしかない。だがその分だけ不意に角に出て、一マイルかそれ以上ずっと下っていく通りの遠近図に出会い、その先に森、別荘、海の青い腕、対岸の丘を見るのは、余計に驚くことかもしれない。

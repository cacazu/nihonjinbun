        "original_unit_id": "edin-104"
    "translation_ja": |-
      もう少し行くと、右への道が畑に立った石のかたわらを通る。土地の人はそれをケイ将軍の記念碑と呼ぶ。彼らによればその名の将校が、歴史の始まる前のいつとも知れぬ大昔、戦いでその場所に倒れたのだ。その日付には安心がもてる。慎重な著述家はこの将軍の武勲について沈黙を守っていると思うからだ。もっともこの石は、封建制から近代世界まで生き残った風変わりな土地保有条件の一つと結びついている。在位中の君主がここをお通りになるたび、ある土地所有者はトランペットを手に石の上に登り、その技に持てるかぎりの知識に従って華やかに一吹きしなければならないというのである。その立派な家柄の人々にとって幸いなことに、冠を戴く方たちはペントランド丘陵にそう大した用がない。だがこの話は石に滑稽味を与え、通りすがりの人もときにはひとりくすっとする。
    "translation_status": "reviewed"
  - "id": "edin-105"
    "section_id": "ch-10"

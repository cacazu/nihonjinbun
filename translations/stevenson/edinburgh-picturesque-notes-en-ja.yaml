        "original_unit_id": "edin-017"
    "translation_ja": |-
      チェンバーズ氏とその一派の革命的な都市改良を嘆くのが、文学者としてはいわば型どおりの感懐である。他人の不便を保存する主義に立つのはたやすい。そもそもわれわれにとって保存の面倒なのは、自分の長所ばかりだ。なるほどあの黒い迷宮を貫いて通りを開く際、風変わりな古い一隅が幾つか掃きのけられ、幾つかの思い出が住処から追い出された。しかしどれほどの陽光の切れ端が、どれほどの清らかな空気の息吹が、流れ入ることを許されたか！　しかも、なおもどれほど絵になる世界が手つかずで残っているか！　暗いアーチをくぐり、暗い階段と路地を降りる。道は両手を伸ばせば両側の壁に触れられるほど狭く、冬の湿って脂ぎった日には舗石が氷にも劣らず足をすくうほど急だ。窓の洗濯物の上にはまた洗濯物が揺れ、心細い腕木の上に家が外へ張り出し、暗い隅に彫刻の一片が見える。そのてっぺんには、妻壁と段形破風の歯が幾つか空に刷られている。ここでは中庭に出る。子供が遊び、大人は戸口の段に座り、屋根の上に教会の尖塔がふとのぞく。あちらでは入り口が最も狭まるあたりで、往年の栄華のしるし、何かの紋章か、信心深い、あるいは勇壮な銘を門のまぐさに残す大邸が、いまも立っている。土地の古事通が名のある人や身分の高い人の暮らした場所を指してくれる。と、見上げる目の前に伯爵夫人の窓から、だらしない女の頭がひょいと出る。ファラオの宮殿の壁内にベドウィンが野営し、年老いた軍艦は鼠の持ち物となる。この路地に白粉をはたいた頭がやたらにあって、その下にポートワイン色の陽気な顔が見えた日々から、われわれはすでに遠くへ来ている。大きな通りでさえ、窓にはアイルランド人の洗濯物がひらめき、舗道には所在なくうろつく人がつかえている。

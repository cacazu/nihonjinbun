      スコットランド方言は冬の風をののしる語にことのほか富んでいる。スネル、ブレイ、ナァリ、スカウザリング。意味深いその語彙のうちの四つであり、どれもぶるっと来る響きを引き連れている。少なくとも私などは、ページの上にこのように並んでいるのを見ると、バーンタイランドや北の山から、大風が入江を引き裂いてやってくるに違いないと思う。煙突で吠えるのが聞こえる気がするし、北に向けて顔を据えれば、頰にひりひりする風の口づけを感じる。地名にさえ、荒涼とした不親切な響きのものが多い。エディンバラ近郊から二つ思い出す。コールドヘイム、すなわち寒い家と、ブローウェアリー、すなわち吹きくたびれは、住人にろくな居心地のよさをも約束してくれそうにない。こうしてスコットランドの言葉に語彙を授けた空の無慈悲は、その詩の精神をも大いに変えた。貧しさも北国の気候も、ともに炉辺を愛し、家族に情を寄せるよう人に教える。後者はさらにそれだけで、詩人を強い酒の賛美に向ける。スコットランドの歌い手は皆、赤々と燃える火としっかり飲みごたえのある一杯とに、一節二節を用意している。風を逃れて内へ入り、胃の腑に何か温かいものを流し込むこと。そのありがたさは、彼らの住んだ所ならたやすくわかるのだ！

      グレイフライアーズには絶え間なく猫が押し寄せる。ある午後など棟梁の老ミルンの墓のかたわらの芝生に十三匹も座り込み、みな毛づやがよく、太って、何か風変わりな肉でも食べたかのように、満ち足りてまばたきしているのを私は見た。老ミルンはおそらく聖人たちと唱歌に加わり、墓まわりの同席者など大して気にしなかったろう。だがこの光景には、正直に言えば私には気味の悪い側面があった。私は喜んで足を進め、城と旧市街の屋根々々と総会議事堂の尖塔が、銅版画さながら色彩を欠いた精密さで空を背に展開するところへ目を上げた。墓地からは遠くが見渡せることが望ましい。空と、世の美の一端とを見ると、病的な物思いから心が救われる。

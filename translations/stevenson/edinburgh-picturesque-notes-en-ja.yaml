      あるいはあの組合長があまり好まれない所では、大疫病と、まだ人の記憶の及ぶ頃まで入るのは危ないとされた凶宅のことが、幾らか記憶に残っているかもしれない。疫病の時代には取り締まりは厳しく即座で、今日われわれが「感染を根絶する」と呼ぶ仕事が致命的な苛烈さで行われた。灰色の法衣に背と胸に白い聖アンデレ十字を着け、先には杖に結んだ白布を持たせた役人が市内を巡り、神の降した災厄への恐れに、人の裁きへの恐怖をも付け加えた。死者はバラ・ミュアに葬り、病を隠した生者は女ならクォリー・ホールズの水に沈め、男なら自分の戸口で首を吊ってその身を曝した。災いの通った所はことごとく家具を壊し、家を閉鎖した。いちばんお化けじみたところは、そういう家をめぐる話だ。二世代前にはまだ、暗く空のまま家々が立っていた。人はそばを通るにも避け、いちばん度胸のいい学童でさえ鍵穴から怒鳴ると逃げた。中には疫病が怪蛇バジリスクのように潜み、今にも流れ出て、町じゅうに腫れ物や膿疱を広めんばかりに待ちかまえていると思われた。迷信深い市民にとって、何と恐ろしいお隣さんだろう！　中で鼠が走るだけでも、どんな豪胆な心も身震いしたろう。お望みならばこれを衛生の寓話とお考えありたい。不潔だったわれわれの祖先が、自分自身の怠慢に語りかけた話である。

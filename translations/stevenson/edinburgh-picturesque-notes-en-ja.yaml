      そして眺めているうち、向こうの城山では太鼓とラッパが散っていた守備兵を呼び集め始める。空気が音に震え、ラッパは高く歌い、ひときわ高い最後のひと吹きが夜空にのぼり、星のように闇に溶ける。一日の仕事をしかるべく締めくくる、武の白鳥の歌だ。

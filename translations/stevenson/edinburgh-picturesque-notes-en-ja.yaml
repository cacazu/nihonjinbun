        "original_unit_id": "edin-108"
    "translation_ja": |-
      道はまた一つ谷を下り、いよいよペントランドの主斜面を登り始める。一束の花のような老木の群れが白い農家を取り巻く。近くの窪地からは煙が立ち、葉が風にさざめくのが見える。真上には丘が千フィートも空へ登る。子羊が生まれるころには、あたりは群れの鳴き声でいっぱいになり、初夏の早朝の薄明かりのなか、犬の吠え声か、こだまへ呼びかける羊飼いの声に目を覚ますだろう。見えないが裏手に小村を控えて、これがスワンストンである。

      ヴェネツィアはほかの町と、人に抱かせる感情の点で異なると言われる。よその町にも賛美者はいるだろうが、誉れ高い美女さながら恋人の列を引き連れているのはヴェネツィアだけだ。そして確かにエディンバラは、親身な友人からさえ同じようには思われていない。彼らがこの町を好く理由はいくつもあるが、一つ取ってそれだけで十分なものはない。好くのも気まぐれと言えばそれまでで、好事家が珍品棚を溺愛するのに多少似ている。この町の魅力は、言葉の最も狭い意味でのロマンにある。美しいには美しいが、美しいという以上に興味深い。なによりゴシック風であり、いささかギリシャ風に装い、岩頭に古典様式の神殿を建ててみせてから、かえってゴシックの趣を増した。ひと言にすれば、何よりもまず一個の珍品である。エディンバラの成長に取り残されたホリールード宮殿は、労働者の町で、醸造所やガス工場に囲まれ、灰色に黙して立っている。記憶の多い家だ。その昔、王に女王、道化師に重々しい大使といった貴顕が、何世紀もここで荘重な笑劇を演じた。その部屋で戦が謀られ、踊りは更けゆく夜の奥へと続き、殺人もなされた。チャーリー王子はここで束の間の朝見の儀を催し、ほんの幾時間か、滅びた王朝をずいぶん華麗に体現してみせた。その土くれで出来た人々は今やみな塵にまじり、王冠さえ六ペンスで衆目にさらされるが、石の宮殿はそんな移り変わりを生き延びた。五十週続けて観光客向けの見世物、古家具の陳列館にすぎないが、さて五十一週目には、目を覚まして過去の真似事をする宮殿をご覧あれ。一種の舞台の君主である勅任の弁務官が舞台の廷臣に囲まれて座る。六頭立ての馬車と、馬具を鳴らす護衛が門前を行き来する。夜には窓々に灯が入り、すぐ近所の職工たちは、家にいながら宮殿の音楽に合わせて踊ることもできる。その意味で宮殿は町の縮図だ。灰の中にはまだ火の粉があり、折にふれ古い火山は煙を上げる。エディンバラは半分しか王座を降りておらず、戯画めかして今も首都の装束を身に着ける。半分首都、半分田舎町として、市はまるごと二重の生を生きる。長く一方の姿のままでまどろみ、他方の姿がつかのま閃く。黒諸島の王さながら、半身は生き、半身は墓碑をなす大理石だ。頭上の城塞には武装した兵と大砲があり、高い練兵場には整列する部隊が見られる。冬の日が早々と暮れた夜にも、冬の夜明けが遅い朝にも、風が太鼓とラッパの音をエディンバラの隅々へ運ぶ。かつて国政が論じられた場所には鬘をかぶった厳めしい判事が座る。すぐそばのハイ・ストリートでは、正午の鐘の頃合いにトランペットが響くことがある。けばけばしい仮装をした市民が一隊、上は紋章入りの陣羽織、下はヒース色の霜降りズボンで、無関心な見物人の間を泥まみれで歩いてゆく。立派なサーカスの馬丁のほうが、まだ堂々と通りを行く。それでも彼らはスコットランドの紋章官とその補佐官であり、四十人ばかりの子供と泥棒と辻馬車の御者を前に、連合王国の新しい法律を布告するところなのだ。一方、時が鳴るたび大学の鐘が街のざわめきの上に響き、時が鳴るたび、行く学生と来る学生の二重の潮が奥深いアーチの下に満ちる。さらに春のある夜、いや、夜明けの薄明かりのさす朝と言うべきか、夜更かしした者は、古いハイ・ストリートの一方の教会から、大勢の男が声をそろえて詩篇を歌うのを聞くことがある。少しあと、あるいは少し前に、向かい側の別の教会でも大勢の男が声をそろえて詩篇を歌う。その歌はヘルモンの露に触れ、兄弟が睦まじく共に住むとは何と麗しいことか、と告げるだろう。夜更かしした者たちは、この歌声は二つの年に一度の教会総会が閉じたしるしだな、と胸の内でつぶやく。二つの教会は多くの立派な徳において兄弟だが、寛容に平和に共に暮らすというこの一事に限れば、格別兄弟めいてもいないのである。

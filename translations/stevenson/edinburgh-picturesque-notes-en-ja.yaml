      フロドンの戦いの前にスコットランド軍が野営したバラミュアヘッドから道は長い坂を下る。その底に着き、向かいの坂を上りにかかる寸前に料金所を抜けると、一挙に開けた田園へ出る。こう書いている今も、事の成り行きはこの言葉を時代遅れにしつつあり、新しい一列の家から鑿をたたく音が聞こえている。長く建築業者を畏れさせてきた料金所の先へ、とうとう彼らは足を踏み出し、放された仔馬の群れのように新しい牧場を駆け回ろうとしている。ビーコンズフィールド卿が刺激を与えるために建築家をひとり絞首にかけようと提案したように、破滅を宣告されたこれらの牧草地を眺める者は、建築業者を思いとどまらせる似たような見せしめを夢想する。荒らされずに残る緑の田園をひと隅でも保つには、とうとうあからさまな戦いに至らざるを得ないように思えるからだ。そしていかにもその話にふさわしく、このあたりには昔、烏のたかるさらし台があって、二つの死体が鎖で吊ってあった。子供のころにはよく、さらし台の取りつけられていた道の中の平たい石を指さして教えてもらったものだ。想像にのりやすい人々は、この石が一度も乾かないと信じており、他人もそう信じさせようとした。もっともなことだよ、と彼らはつけ加えた。あの男たちが盗んだのは、二人合わせて四ペンスにすぎなかったのだから。

      囲いのかなりの部分では下層の人々の家が墓地に背を向けて建ち並ぶ。生きている者と死んだ者とを隔てるのは数インチだけだ。ここでは墓の三角破風が窓を半ば塞ぎ、そこでは通りが墓の高さよりはるかに低く落ち込むので、碑の裏へ煙突が這わせてあり、その向こうから赤い煙突鉢が俗っぽく顔を出す。墓地の湿った匂いは、職工が座って食事をとる家々にまで入り込む。窓という窓では小さな規模の家庭生活が目に見えて繰り広げられる。町の往来から切り離された囲いの孤独と静けさそのものが、この対照を強くする。墓の上を歩いてゆけば、子供が雀にパン屑をまくのが見える。誰かが歌い、皿を洗い、あるいは打たれて泣く音が聞こえる。物干し竿のリネンが葬送の彫像にはたはた当たり、あるいは猫が戸のまぐさをするりと越えて記念の骨壺の上に下りる。ほかに何も動かないばかりに、こうした場違いな眺めや音がこちらの注意をとらえ、この場所の悲しみを誇張する。

      土地の個性は、そこにまつわる記憶の中に最も巧みに言い表されることがよくある。出来事は、自分の性に合った環境で起これば、根を張って伝説へと育つ。醜い行い、とりわけ醜い場所における醜い行いには、真に物語的な質があって、その舞台の不滅の持ち物となる。スコットのような男には、自然のさまざまな外観がそれぞれ出来上がった伝説を一つずつ胎内に宿し、それを呼び出すのが彼の役目であるように見えた。その場所この場所にふさわしく起こり得るのは、その出来事この出来事だけである。その心で、ベン・ヴェニューには『湖上の美人』、エディンバラには『ミッドロージアンの心臓』、北の荒涼たる島々と唸る潮路には、書きぶりはいかにも並ながら構想はいかにもロマンに富む『海賊』を作った。名もない人の群れも代々、ほとんどスコットに劣らぬほど繊細な勘を持つ。ただ彼が新しいものを創造したところで、人々は古いものの中でふさわしくないものを忘れるだけだ。こうして適者生存により、言い伝えのひとかたまりが芸術作品となる。だからエディンバラの低い巣穴、高く宙に飛ぶ屋根裏では、人々は町の冒険の暗い章に立ち戻り、炉端で冬物語を語り、骨の髄まで冷やすことができる。それは昔の生活にばかりか、このあたりの建ち上がった自然そのものの成り立ちにまでぴったりついた、いかにも土地柄のよく出た物語である。高いランドの周囲に風が笛を吹き、アーチの通路をほうほう鳴いて下り、広く果てない街灯の荒野が突風もろとも震え、燃え上がりつづける際など、恐怖にさらに恐怖を重ねるのにことのほか適している。

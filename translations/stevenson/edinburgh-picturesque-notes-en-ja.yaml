        "original_unit_id": "edin-095"
    "translation_ja": |-
      国を挙げての大祭である元日は、家族の情が広がり、大酒盛りをする時である。カルヴァン派のこの民には運命の手痛いひと打ちだが、元日が日曜にぶつかることもある。その日は飲み屋は容赦なく閉まり、家からも往来からも歌が、口笛さえも追放され、最年長の大酒飲みすら教会に行かねばとの思いに駆られる。二つの忠義の間で引き回されるようにして、スコットランド人は良心にかかわるきわどい事例を幾つも裁き、週ごとの行事と年一度の行事との細い境界を見きわめて走らねばならない。友人の家のお隣の陽気な音楽家の一団は、こうして歓楽の瀬戸ぎわに宙ぶらりんになった。日曜夜の十時から、友人には楽器の調子を合わせるのが聞こえた。自由の時刻が近づくと、一人一人、譜面を開き、ヴァイオリンに弓を置いて備え、拍を取る片足はもう浮かせ、神経を演奏のために張りつめていたに違いない。というのもいちばん早い鐘楼が十二を打ち終わるかどうかという間に、もはや世俗の華やかな技巧曲に乗り出していたのだ。
    "translation_status": "reviewed"
  - "id": "edin-096"

      二マイルほどの間、道は上り坂で、夏には長く暑い徒歩の道となる。フェアマイルヘッドの料金所のわき、四つの道の出会う地点で頂に達する。名前にも眺めにも風通しのよい、気分のよい場所だ。谷を渡った向こうに丘はすぐそこにある。カーク・イェトンの長く垂直な岩肌の傷はファイフからでも見える。こちら側ではアレルミュアがいちばん高く、丘々の裾には森と耕地が高くまで伸びる。その腰は数えきれない谷と段に刻まれ、ヒースと羊歯でまだらになっている。丘からきびきびと、甘やかに風が来る。高さゆえに清らかで、高地の草木の田舎らしい香りがする。料金所にいてさえダイシャクシギが相方を呼ぶ声が聞こえることがある。ある季節、鷗が波しぶきを浴びる岬を離れると、海の鳥と山の鳥がフェアマイルヘッドわきの同じ畑で狩り、鳴き騒ぐ。翼ある野の生きものの輪舞は入り交じり、海鳥は梢をかすめて犂の畝間を漁る。この小さな空の舟は、空という自分の領分を飛ぶかぎり世界じゅうどこでもわが家も同然で、船乗りさながら、沿ってゆく岸に水と食物しか求めない。

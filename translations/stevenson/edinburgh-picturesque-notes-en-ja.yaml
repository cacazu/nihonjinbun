    "translation_ja": |-
      というのも、ジョンソン博士が批評の目を向けたここの碑銘の一つにいうこの「インフェリクス・カンプス」、すなわち不幸の野は、多くの意味で、マッケンジーが迫害した人々の記憶に捧げられているからだ。熱狂した民衆が平たい墓石の上で盟約に署名したのはここであった。ローリストンへ延びる墓地の長い腕には、ボスウェル橋の捕虜たちが、パンと水をあてがわれ、逃げれば番兵の命で償うという条件で油断のない射手に見張られて、処刑台あるいは海外植民地を覚悟しながら五か月寝起きした。グラスマーケットであの立派な仕事が進行していた間、グレイフライアーズの物見の耳には殉教者の声をかき消す軍の太鼓の脈が響いたことだろう。しかもそれきりではない。サー・ジョージからいちばん遠く離れた下手の隅には、盟約派らしい無骨な詩で、あの争いで命を失ったすべての人に捧げられた碑が立つ。アイアングレーやコモネルのあたりで、にわか雪のなか銃殺された荒野の男であれ、オークニー沖で溺れた二百人のひとりであれ、果てはアメリカの農園でこき使われた哀れな盟約派の奴隷であれ、この碑にひとつの持ち分を主張できぬ者はない。そして影の国の義人にそういうことへの関心があるならば、ユリウス・カエサルやファラオたちと同じく自分にも地上に碑があるのだと誇れる。彼らが実際どこに眠るのか、私にはわからない。まことに遠く散り散りの骨だ！　しかし幾人かが、あるいは幾人かのほんの一部が、どのようにしてようやくそれほど名誉ある埋葬にたどり着いたかを読者が知りたいなら、その生前は同志であり、その死後は弁護者であったひとりの言葉を聞いていただきたい。気のふれた論争の部分や余談をいくらか省くが、残りはパトリック・ウォーカーの言い回しと書きぶりのままに置く。

      また物思う人は、町の姿と、その奇妙で波瀾に満ちた歴史との響き合いにも魅力を見いだすだろう。これほど荒々しいまでの対照を目に繰り広げる土地は、たとえあるにしても少ない。まん中にそびえるのは自然が造ったうちでも申し分のない巌の一つ。いわば陸へ上がったバス・ロックで、列車の通過に揺さぶられる庭に根を下ろし、胸壁と小塔を冠に頂き、新市街で最も賑やかで華やかな大通りに武骨な影を描き落とす。垢にまみれた者たちが、煙った十階建ての蜂の巣から、裕福な者の開けた広場や庭を見下ろす。一方、一マイルにわたって商業の宮殿が並び、晴れの日には旗一色となるプリンシズ・ストリートで、陽気な人々が日向ぼっこをしながら見るのは、彫像を配した庭園の谷を越え、旧市街の高窓で風にはためく洗濯物だ。それにしてもどちらを向いても、建築どうしの何というぶつかり合いだろう！　町の暮らしがいちばんせわしなく進むこの一つの谷には、地形の偶然から、建物の上にまたその背後に次の建物がのぞき、地球上のほとんどあらゆる様式が見て取れる。エジプトやギリシャの神殿、ヴェネツィアの宮殿やゴシックの尖塔が、実に見事な乱雑さで折り重なる。そのすべての上では城の巨大な塊とアーサーズ・シートの頂が、自然の業が人の業の記念碑を見下ろしてよいのと同じく、ふさわしい威厳をもってこれらの模造品を見下ろす。しかし自然はわれわれの考えるよりえり好みをしない庇護者であり、思い切った効果など少しも怖れない。鳥は巌の割れ目にもコリント式の柱頭にも同じ気安さでねぐらを取る。永遠の岩と昨日しつらえた模造の玄関柱廊を同じ空気と日の光とが包む。柔らかな北の陽光がすべてのものを輝かしい輪郭で際立たせるとき、あるいは青い夕暮れとともに東風の霧が湧き上がり、すべての不調和な要素が一つに溶け、通りに灯がきらめきだし、谷向こうの高窓に弱い明かりがともるとき、ひとつの思いが次第にこちらを捉える。これもごく親しい意味での自然の一部なのだという思いだ。この奇抜さの溢れ、この石積みと生きた岩とが見る夢は、劇場の書き割りではない。鉄道と電信線でヨーロッパのあらゆる首都と結ばれた、日々の現実の世界にある町である。馴染みの型の市民が住み、帳簿をつけ、教会に通い、不滅の魂まで日刊紙に売り払っている。ロマンの法則にひとつひとつ従えば、ここは半ば人に見捨てられ、朽ちかけていていいはずだ。鳥ならいくらいてもよかろう。日と風が戯れ、いちばんの大通りに放浪の民が幾組か野営するのもよい。だが辻馬車、市街電車、列車にポスターを連れたこの市民たちときたら、まったく調子はずれである。特許状を持った観光客のように、由緒ある場所を勝手気ままに使い、この上もなく絵になる場所のただなかで、人間ならではの壮大な無頓着さをもって子を育てる。こざっぱりした身なりに、おのれの道徳的正しさへの自信を身にまとい、滑稽すれすれのちょっとした所有者顔で群れ通る姿は、この町の見どころのうち決して末席に置けない。〔原注10〕

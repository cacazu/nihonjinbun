      また一つ、嫁がなかった姉妹の伝説がある。伝説は伝説でも、もっとも信用できぬ意味の伝説かもしれないと私は危ぶむ。あるいはもっと悪く、つい昨日一昨日の作り話かもしれぬ。だがそれなりに命のある話で、エディンバラの暦に一席を得る資格はある。この二人は一部屋に暮らした。話からすれば寝台は二つあったに違いなく、かなりの広さだったかもしれない。だがいずれにせよ一部屋である。ここで二人の独身婦人は仲たがいした。おそらく論争神学の一点についてだろう。しかもあまりに険悪な仲たがいで、その日を限りに互いに白とも黒ともひと言も言わなくなった。別々に住むだろうと思うではないか。ところがそうではない。資力がなかったからか、それともスコットランド人らしく世評を恐れたのか、もとの所でそのまま共に家を切り回した。床に白墨で引いた線が二人の領分を隔てた。それは戸口も暖炉もきっちり二つに割り、相手の領地を犯さずにどちらも出入りと料理ができるようになっていた。こうして幾年も、憎しみに満ちた沈黙のうちに二人は共存した。食事も沐浴も、親しい客との付き合いも、友ならぬ目でつぶさに見張られた。夜、暗く寝つけずにいれば、それぞれ敵の息遣いが聞こえた。姉妹らしくないことを競い合うこの二人より醜い眺めを、四枚の壁が見下ろしたためしはなかろう。ホーソーンならこれを画布にして、小さな名画に仕上げたことだろう。このピューリタン的怪奇を扱うのに適するピューリタンの血筋が彼にはあった。病気になった二人や、おぞましい二人そろっての勤行を見せてくれただろう。大きな聖書を一人一冊ずつめくり込み、互いが悔い改めるようにと、骨髄にこたえる強調を利かせて大声で祈るところ。ある時は嵐の晩に、ペチコートをからげてそれぞれに炉の隅を占めるところ。ある時は二人してめいめいの窓に座り、はるか下、入江へ傾く夏景色や、かつて手を取り合ってさまよった野の道を見やるところ。あるいは老いと病弱がつのり、身づくろいに時がかかるようになり、手がふるえ、首が思わずこっくりしだすのに、年月とともに敵意ばかりがますます鋼のように固くなるところ。そしてついにある晴れた日、ひと言、ひと目、誰かの来訪、あるいは死の近づきに、その心が溶けて白墨の境を一度きり、永遠にまたぎ越すところを。

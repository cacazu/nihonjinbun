    "translation_ja": |-
      哀れなこの紳士はいくら穏健に振る舞おうとしても無駄であった。要求される忠誠宣誓は何でもし、信仰に関する寛容令はどれも利用した。バルウィアリでは竜騎兵と酒を飲み、息子を傍らに連れて聖餐にあずかり、ハドー師の教会へ欠かさず通った。それも、家にいるあの血相を変えていきり立つ長老派狂信者の妻のおかげで、なんの甲斐もなかった。実際、教区牧師が陰ながら寛大に計らってくれなかったら、この家は何年も前に潰れていただろう。領主にいたく同情していた牧師は、屋敷で起きることには、徹底して見ぬふりをした。この牧師、近郷では、いやスコットランドじゅうでも、まことに評判の悪い男だった。シールズの言い草に従えば「悪名高きハドー」。だがパトリック・ウォーカーの筆はなおも雄弁である。「教区牧師ホール・ハドー」と、彼はピーデンの項で書いている。「いや、地獄のハドーと呼ぶほうが、よほどふさわしい。とうに断罪された邪説と、肉の汚らわしく卑しい欲とを袋に詰めたような男、公然たる女買い、札付きの大酒飲み、ヴァイオリンをひねもす罰当たりにもぎこぎこきいきいと弾き鳴らし、イスラエルの残れる者らに向かって絶えず口から火を噴く者。しかし主はその楽の音をやめさせたまい、罪科のことごとくが、一つの血染めの墓に納まった」。もちろん、これは彼を殺したことへの弁明として書かれたものだろう。ウォーカーなる人が公正な証人だとか、寛大な裁き手だとかいう評判は、私は一度も聞いたことがない。少なくとも、一個の生身の人間としては、このトラクウェア家にまつわる一件でハドーの株はまるきり下がりはしない。キリスト者らしい美徳を発揮するのでこそないが、ある種、異教徒なりのまっとうさがあって、突然、備えをする暇もなく非業の死を迎えたその身の上に、あやうく同情したくもなるのだ。

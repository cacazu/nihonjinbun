        "source_sequence": 37
    "translation_ja": |-
      帰り道、フランシーの頭から、この都合の悪い一件がなかなか離れなかった。まともに挑まれた勝負を、卑怯にも断ったのだ。話は土地じゅうに広まり、ヒースの山猫の名も光を失うだろう。だが、ハドー師とジャネット・マクルーアの一幕にも、いろいろと考えさせられた。あの牧師のことをなぜ皆あんなに悪く言うのか、あんなに陽気な人なのになぜ説教はああも退屈なのか、しきりに首をひねりながら小さな丘を越えてゆくと、なんとそこにジャネットが、こちらに背を向けて座り、牛の番をしているではないか！　母親から内密にしのび歩く必要のある用を言いつけられてきたせいで、フランシーはもともと人に気づかれずにこっそり忍ぶのが好きな子だった。娘の背後へ音もなく近寄った。
    "translation_status": "reviewed"

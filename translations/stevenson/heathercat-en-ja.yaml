    "translation_ja": |-
      そこは切り立って崩れた丘の一角で、西へ目をやると、墨のように黒い淵が点在する荒野の谷を見下ろせた。淵からは水が一筋の小川に流れ込み、さして音も立てず、さして急ぎもせずに丘の角を回って去る。丘の反対側では地面が盛り上がってむき出しの荒野となり、ビャクシンの茂みが黒々と広がり、この土地で名高い立石がところどころに見えた。このあたりには立石が多い。不格好で、地衣に白く染まり、歳月に白くなったのだと言いたくなる。その昔、異教徒が石の建立に歓声を上げてから、数知れぬ世紀のあいだ、ここに居を据えてきた。古代の人々が何やら邪教のために聖別したので、分別のある者は昔から、日暮れを前にしてさえ、その近辺には寄りつかなかったものだ。だが近頃になって新たな必要が生じ、荒野に寂しく立つ石は再び人の集まる場所となった。丘の端に目端の利く哨兵を置けば、北と東の入り口はどれも見渡せたし、地勢のおかげで、何人かの見張りをうまく配しさえすれば、西も不意討ちから守れた。この地方で禁制の礼拝のため、ここほど心静かに集まれ、竜騎兵に邪魔立てされた場合にも、ここほど確かな逃げ道が開けているところはなかった。牧師は石の輪の縁に近い小丘に立ち、往古の悪鬼たちのまさに戸口で、神が授けた言葉を惜しげなく注いだ。天幕を張るときは（雨天の聖餐の折にはしばしばそうした）、なぜそう呼ぶのか知る者もない〈エインズ・エランド〉という、一本だけ離れて突っ立つ巨大な石柱の上に張り渡した。会衆はあるいは下手の斜面に寄り集まり、あるいは異教の巨石のあいだや、環状の聖地そのものの草地に腰を下ろした。実際、キリストの教えに味つけが必要だとしたら、これほどふさわしい場所はなかった。だがこうした集いは、そもそもあまりにも恐ろしく、また心躍る事情のもとで開かれたので、どんな冷めた人間でも熱狂者になった。彼らこそ信仰を守る最後の人々。ほかの国々のすべてから顔をそむけた神が、この荒野に残ったわずかな信徒の営みにだけは、なお天から身を乗り出し、胸ふくらむほどの慈しみをもって目を注いでおられた。かたわらにはキリストが、消えることのない御傷を帯び、涙をこぼしておられた。聖霊はといえば（新教徒の想像力はそれをはっきりと姿に描くことも、しっかりわがものとすることもついになかったが）、めいめいの心に、また牧師の唇に宿るものと、おぼろげに考えられていた。その向こうに敵として並ぶのは階位ある権力者の軍勢。チャールズとジェームズという二人のステュアート家の人間から、ルイ王、さらには皇帝に至るまで。そして緋の衣の教皇、そして、大きな黒い悪魔そのものが、憎しみと期待とに酔いしれ、赤く開いた地獄の口から身を乗り出していた。「もうひと押し！」と叫んでいるようだ。「もうひと押しでおしまいだ。神に残ったのはクライドズデール、スチュアートリー、それにエアの三管区ばかりだぞ」。善悪最後の戦いに、かくも威厳ある権勢者も支配者もこぞって立ち会い、見守っているとあっては、今まさに自分たちがその聖地を侵している昔の悪鬼どものことなど、考える余裕はほとんどない。年老い、弱り、力衰え、もはや働く力もない、あの悪鬼どものことなど。

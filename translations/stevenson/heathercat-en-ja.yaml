    "translation_ja": |-
      家に着くまでには、母親には何も言うまいと心を決めていた。モントロイモントの奥方は居間で信仰の書を読んでいた。世間をこれだけ騒がせ、あの我慢強い羊のような夫を自在に動かすにしては、驚くほど華奢な、小柄な女だった。両の眼は野スモモの黒い実のよう、指はパイプの細い柄のよう、口は獣の罠のようにぴたりと閉じ、どんなに真剣なときでも、怒っているときにはなおさら、ぞっとするような笑みめいたものが顔に浮かんでいた。
    "translation_status": "reviewed"

      トラクウェア家は代々、信仰盟約を固く奉じてきた。国王をも奉じたが、盟約のほうが先に立つ。だから主教たちが乗り込んできて、そのあとを竜騎兵が追ってくるようになると、モントロイモント家にとっては受難の日々が始まった。時世が時世である。当時の領主ニニアンは、わが身もわが地所も用心深く守ろうとしたが、その両方を失ったと言ってよい。まずペントランド丘陵の反乱に一枚噛んだという濃い疑いがかかった。やがてボスウェル橋の戦いにまで事が及ぶと、枢密院に引き出されて裁かれた。道端で反乱兵どもと話をした罪。もっとも何を話したかは、さっぱりはっきりしない。それから庭師のゲイルなる男をかくまい、食わせた罪。ボスウェルの戦より前に銃を持っているところを見られた男で、その後何か月にもわたってモントロイモントの庭で土を掘ったというのである。枢密院でのニニアンの旗色はすこぶる悪かった。反逆罪に決まっていると言う卿も幾人かあり、脚を締め上げる責め具の話さえ出た。その拷問だけは免れたし、大身の人々にかなり親しい友もあったので、結局は七千マルクの罰金で放免されたが、地所がうめき声を上げるほどの額であった。このたびも、ほかによくある例に違わず、悶着を起こしたのは妻である。彼女は禁制の礼拝集会の熱心な常連で、一つの集まりに馬で十マイルも出かけてゆく。罰金を科せられれば教会のために苦しむのを大いに喜んだが、むしろ苦しんだのは夫のほうだった。一人息子フランシスにキッド師の手でひそかに洗礼を授けさせた。おかげでまたも余計な出費である！　強いようが、なだめすかそうが、妻は教区の教会には行かない。主教派の牧師の手から聖餐を受けるなど思いもよらず、その牧師がハドー師とあっては、なおのことだった。かくてモントロイモントの殿は月ごと年ごとに懐へ手を入れねばならなかった。じつをいえば、この小柄な奥方が一度牢に入れられたことがある。篤実だが鈍重で、そもそもこういうことには興味もない領主が、馬で出向いて身代わりとなり、九か月も務め、手痛い罰金まで払わされて、やっと出してもらった。夫に少しでもありがたいと思っていたかどうか。自身が牢を出るや否や、奥方は礼拝集会に、教区の教会に通うのを拒む者をかくまうことに、かねての金のかかる愚挙の数々に、さっそく以前にも増して深くのめり込んだ。モントロイモントが無事お牢の中にいて、気兼ねをする目もないので、いよいよ元気よく、公然とやったのである。彼がひどい目に遭ったすえ、放免されて帰ってきたのは一六八〇年十二月、漆黒の夜もすでに更けていたが、奥方は留守だった。領主は馬を下り、まだ鞭を握ったまま屋内へ入った。女中からそう聞かされると、その首すじをひっつかんでさんざんに打ちすえ、通路に投げ倒し、食事もせず、灯も持たず、階段を上って寝床へ行った。奥方が例の集会から戻ったのは朝の三時。泣きながら寝ずに待っていた女中から乱暴の一件を聞くなり、片手に手提げ灯を持ち、死人も起きだすほど靴を踏み鳴らしながら、夫婦の寝室へ乗り込んでいった。聞いていた者たちには、善良なるご亭主と今すぐ決着をつけるつもりと見えた。屋敷じゅうの奉公人が階段に集まった。この二人のうち、どちらが上手か、彼らには大いに気になるところだったのである。それからの二時間、両人はつかみかからんばかりにやり合った。もうどうにもしようがない、とモントロイモントは訴えた。年ごとの利息すら、もう払いきれない。おまえのために自分が牢につながれているあいだも集会に通うとは、なんという仕打ちか。友人たちももう付き合いきれまい。残る道といえば一族の土地をことごとく手放し、ただの物乞いとなって路傍で一生をやり直すほかはない。奥方はすぐさま鋭く居丈高に切り返した。あなたはそれでもキリスト者か。泥まみれの汚い畑を少々失うのと、ご自分の魂を失うのと、いったいどちらが惜しいのか。やがて夫のすすり泣きが聞こえ、奥方の声は小川の流れのように途切れず続いたが、何を言っているかまでは聞き取れなかった。ここに至って奥方の勝ちと見定め、奉公人たちは寝床に引きあげた。翌日、トラクウェアは馬鍬の下をくぐり抜けたような疲れた顔で姿を見せた。そして奥方は、こののちもいささかの軌道修正もせず、これまでの道を歩みつづけた。

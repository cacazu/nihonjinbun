    "translation_ja": |-
      以後ニニアンは不平も言わず自分の道を歩み、妻にはたしなめることもせず、妻の道を歩ませた。なおも領地の世話をしていたが、いわば毎日あらためて別れを告げ、もう失われたも同然と思っていた。耕地や父祖の墓を、野鳥の群れる荒野を、鱒のすむ低地のごぼごぼと鳴る淵を、風の強い高みで鳴き交わすダイシャクシギの居場所を、悲しく見渡した。今日こそまだ自分のものだが、明日は他人のものだ。やがて戻って席に着き、日暮れまで、近づく破産の勘定をした。算術でいかなる手品を使おうとも、せいぜい一年か二年しか引き延ばせそうにはない。根が昔かたぎの実直な男、農夫であり地主である。天寿を終えるまで、季節が巡り家畜が増えてゆくのを眺めていられれば、それで満足だったろう。先祖の血を引く男子に家産を損なうことなく渡せるならば、いつなんどき死んでも本望だったろう。生まれつき、この男にとって一番に果たすべき務めはそれだった。だが今はどこへ行っても、新しい持ち主の幻が向こうからやって来る。種をまき、取り入れをし、赤く色づく荒野で楽しく鳥を撃ち、あろうことか屋敷の庭の西洋すぐりまで食っている。他方にはいつも、乞食となったフランシスが広い世間へ出てゆく姿が見えた。

    "translation_ja": |-
      時は「殺戮の時代」のさなか。物語の舞台はおもに、人里を離れた丘と沼沢である。そこに姿を見せるのは、世に〈山の放浪者〉と呼ばれた者たちと、彼らを追って来る竜騎兵、その亡骸に取りすがって泣く女たち、それに世の初めからこの荒野で鳴いてきた野の鳥ばかりだ。雨雲の多い土地である。文字の生まれる前のしるしで大地に書きつけられた、物言わぬ歴史の豊かな土地である。この地方を歩けば、ことに教会墓地のそばには、緑に覆われた奇妙な環状土塁がよくある。死者を葬った塚があり、立石がある。その傍らにはローマ人が手足で刻んだ、かすかながら消えることのない跡がある。そしてひょっとするとそのどれよりも古く、今なお脈々と生きているものがある。地名という地名がケルトの名であり、人々も他の血をほとんど交えぬケルトの民なのだ。荒涼とした灰色の丘々も、かつてはカレドニアの森の内であった。マーリンが林檎の木の下に座り、グウェンドレンを思って嘆いたのはここだ。ケンティガーンと語ったのもここなら、魔法の眠りに落ちたのもここである。その眠りの伝説は、ケルトの民の歴史を、目に見える姿にしたもののようだ。幾世紀も己が本来の言葉を奪われ、それでも祖先譲りの、憂いを帯びた片意地と、辛抱強くも報われぬ勇気を持ちつづけてきた民の歴史を。

    "translation_ja": |-
      そこで二人は別れ、モントロイモントはデュールの谷へ馬を急がせた。だがフランシスは、牧師からはそうやすやすと解放されなかった。ハドーはちょこちょこと足早に石垣の角まで行き、そこで立ち止まると、牛の番をしていた娘に口笛を吹いて手を振った。このジャネット・マクルーアは体の大きな娘で、牧師よりも背が高く、しかもスカートをうんとたくし上げていたので、いっそう大柄に見えた。しばらくは呼ばれても来そうになかった。フランシーの耳には、彼女がハドーを「まぬけなじいさん」と呼ぶのも聞こえたし、ハリエニシダの茂みや泥炭の窪みを縫って走っては身をかわし、相手の息がすっかり上がるのも見えた。だがとうとう牧師が肩掛けの端から瓶を取り出し、娘に掲げて見せると、たちまち和睦が成立し、二人はヒースの盛り上がったところに腰をおろして、瓶の酒を回し飲みし、たわむれ、笑い合った。少年はこうした俗世の戯れについて聞きかじったことさえほとんどなかった。さもなければニンフとサテュロスでも思い浮かべたかもしれぬ。もっとも、ひょろ長い脚のジャネットをニンフと見まがう者があれば、の話だが。二人はずいぶん仲よしらしいぞ、と彼は思った。それだけに、牧師がいとまを告げてから、娘がけたたましい笑い声を上げてうしろから石を投げ、ハドーも振り向いてぴょんと跳ね、杖を振ってみせ、相手よりも大きな声で笑うのが不思議だった。なんとも陽気な二人だ。泥炭の窪みからはい出たとき、フランシーの胸には考えたいことが山ほどあった。ハドー師のことはみんなの思い違いかもしれない。父さんにはあんなに情け深いし、ジャネットにもあんなに親切で、楽しそうにふざけていたんだから。ちょっと道草を食って娘本人に聞いてみたい気もした。だがこの子には務めを果たさねばという気持ちが強かった。代わりにせっせと斜面を越え、ケアンゴームの館の近くに出た。そこに窪地があり、白樺が小川に蔭を落としていた。岸辺に裸足の少年がいた。自分より三つほど上だろうか。二人は見知らぬ犬どうしのように用心しながら、妙な顔で相手をうかがい、近づいていった。
    "translation_status": "reviewed"

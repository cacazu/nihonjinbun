      ハドーはぎょっとして、平静さをすっかり、機嫌のよさも大半は失ってしまった。「なんだ、いったい！」と叫んだ。「わしゃ近所の者に劣らんぞ。霊の道に秀でとるなんぞ、吹聴したことはないわい。いっぺんもない。わしはただの陽気な人間だ。信心とは朗らかさ、わしに言わせりゃそういうことだ。ヴァイオリンと酒を一杯くれりゃ、蠅一匹だって傷つけやせん」
    "translation_status": "reviewed"

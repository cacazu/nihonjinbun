    "translation_ja": |-
      モントロイモント（学者の解するところではモンス・ロマーヌス、すなわちローマの山）のトラクウェア家は、荒野のバルウィアリ教区、その奥深くデュール川の源流に近い地に、古くから居を構えていた。この高地では二百年ものあいだ、それ相応の、名望とまで言ってもいいほどの家名を保ってきた。その家の年代記、いや、今なお人の記憶にとどまるだけの年代記は、薄暗く血なまぐさい。一四八二年、ニニアン・トラクウェアはバルウィアリの教会の戸口において、クローザー一族の手で「むごたらしく斬り殺された」。一五四〇年、フランシスがドラムショアランドのサイモン・リヴェンを殺し、未亡人と跡継ぎに賠償金を払い、殺害の赦免に必要な示談状を得たうえ、なんとも荒っぽい示談の仕方だが、サイモンの娘グリゼルを持参金なしでもらい受けた。トラクウェア家とリヴェン家が初めて縁組したのは、こういう次第である。両家の最後の縁組のことは、ほかにもいろいろあるが、この本で語るべき事柄の一つだ。

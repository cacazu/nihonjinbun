        "source_sequence": 45
    "translation_ja": |-
      「言いたきゃ悪魔にでも言いつけるがいいさ！」娘は叫んだ。「あたしゃ、やましいことなんかないよ。マクブレアには、よけいな世話は焼くなと言っとくれ」とまた叫んだ。「ハディ先生がその気になりゃ、あの人自身のことで十分ひどい目に遭うんだからね！」そう言うと、牛たちを前へ追い立てながら大股で去っていった。時おり振り返っては、訳がわからず立ち尽くす少年に、怒った言葉を投げつけた。
    "translation_status": "reviewed"
    "source_alignment":

        "source_sequence": 55
    "translation_ja": |-
      「ジョック・クローザーだって！」と奥方は声を張り上げた。「クローザーめ、ただじゃおきませんよ！　クローザー家ですって！　次は何が出ることか！　苦難をしのぶわずかな信徒の命を、あの一族に預けよとでもいうの？　一族そろって縛り首にしてやらなくちゃ。私の思いどおりになるなら、そう長くは待たせませんよ。おまえ、あのクローザーどもが教会の戸口でおまえのご先祖を殺したのは知っているんでしょうね？」
    "translation_status": "reviewed"
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "heathercat-p187-block054"

    "translation_ja": |-
      やがて奥方は激情が少し冷めたのか、それとも流れ出る罵言が尽きたのか、聴衆を解放した。フランシーは深々とお辞儀をして部屋を出、うしろ手に戸を閉めた。廊下に出るとくるりと向き直り、声こそ低いが、ひとかたならぬ実感をこめ、悪魔の名を二十ぺんも繰り返し、終いには効き目を強くしようと、「呪わしい」と「地獄め」までくっつけた。ファス・エスト・アブ・ホステ・ドケーリ、敵に学ぶもまたよし。人のことばを借りて言ってこそ、無礼なことばもいっそうよく刺さるというものだ。おかげで胸がすいたことは間違いない。落ち着いた気持ちで階段を上り、家庭教師の部屋へ行った。マクブレアは泥炭の火のきわに座って震えていた。四日熱をわずらい、その日が発作の日だったのだ。大きな寝帽子と格子縞の肩掛け、ひげを剃らず黒ずんだ頬、がたがた震える体に肩掛けをかき寄せる白いやせた手。あわれな姿であった。だがフランシーはこの人をよく知っており、慕っていた。まっすぐ入っていって、匿われている先生のそばに身を寄せ、一部始終を話した。マクブレアはハドーと大学で同窓だった。二人が長老会から説教を許されたのも同じ日である。なんの邪心もなく少年が語るのを聞いて、師の胸はかき乱された。

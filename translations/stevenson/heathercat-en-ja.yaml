      父が息子のこの務めをどこまで知っていたかは疑わしい。ほとんど何も残してやれそうにないので、息子の行く末はずいぶんと案じていたし、時には授業に立ち会い、大きなため息をついたり、大あくびをしたり、出来が悪そうだと見ると時折フランシーの肩をぽんとたたいて、そっとやさしく励ましたりもした。だが昼の大半は、何も目に入らぬまま当てもなく歩き回るか、書斎で心ここにあらずのていで破産の明細を眺めていた。息子が十二度留守にして、気づくのは一度ぐらいだったろう。

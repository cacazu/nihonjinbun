      モントロイモントはため息をついた。「なるほど、それもあの人の思いやりだよ」と言った。「こういうことは、わしは知らずにすむほど助かるからな。おまえはただお母さんに従って、わしにしてくれるのと同じように、あの人にもよい息子でいてあげなさい。それがいちばんだよ、フランシー」
    "translation_status": "reviewed"

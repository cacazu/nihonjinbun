        "source_sequence": 75
    "translation_ja": |-
      翌日の午後、マクブレアは外に出て、ジャネットが牛の番をしている斜面で、娘を相手に長いこと説き聞かせた。そこで何が交わされたか、すべてはついに知れずじまいであったが、娘は激しく泣き、ハリエニシダのあいだで彼の前にひざまずいた。その夜、暗くなるや否や、マクブレアはふたたび道を取り、バルウィアリへ向かった。竜騎兵が宿営する教会村では、たくさんの明かりがともり、どら声の歌と下卑た笑いが聞こえてきた。彼にはまことに耳障りだった。畑伝いに大きく遠巻きにしてやり過ごし、ようやく水辺に出た。川と道のあいだに、牧師館がぽつんと立っていた。裏口を軽くたたくと、年老いた女が入りなされと声をかけ、屋内を書斎まで案内した。今でも書斎と呼んではいたが、ハドーの代になっては、ここで勉強なるものが行なわれることはまずなく、神学書よりも歌の本のほうが多かった。
    "translation_status": "reviewed"
    "source_alignment":

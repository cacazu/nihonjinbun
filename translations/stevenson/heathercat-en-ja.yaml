      「ああ、わざわいあれ！　あの男にわざわいあれ！」と彼は叫んだ。「ああ、不実な羊飼い！　雇われ羊飼い、信仰を捨てた牧師！　私をひどい目に遭わせるだって？　そう言ったか、恥知らずのあばずれめ！　たしかにあの男がその気なら、かつてあなたのお母上が私を引き出してくださった、あの汚く悪臭を放つ穴蔵、キャノンゲートの牢にまた放り込むことができる。お母上には主のお報いがあるように！　あるいはあの冷えきった、風を避けるものもない海中の岩場、バス・ロックにでも。胸の弱い私には、まったくもって命取りだ。だが私はわが主の務めにあっては勇敢でありたい。ここで果たす務めがある。神に対して、自分自身に対して、そしてハドーに対して。主のお力により、私は必ず果たすぞ」
    "translation_status": "reviewed"

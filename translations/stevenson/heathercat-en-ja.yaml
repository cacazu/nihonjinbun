    "translation_ja": |-
      三百人から四百人ほど集まっていたかもしれない。すくなくとも、つないである馬が三百頭いた。その大半は石の輪の内側にいたが、群衆の外には、合図がありしだい馬に乗れるよう、手綱を手に立って聞く者も幾人かいた。輪になった顔には不思議とはっきりした共通の相があった。面長で、生真面目で、彫りが深く、やせて日焼けした頬には筋が浮き、口は固く結ばれ、目には激しい熱情が輝いている。羊飼いも、人足も、数こそ少ない地主も、幅広の青い縁なし帽か、飾り紐のついた帽子をかぶってそこに立ち、一様に似通った顔だちをしていた。ときおり、賛同を表す長い呻きが会衆の中から起こり、波のように外側まで伝わって、馬の番をしている者たちのあいだに消えていった。それには名があった。「聖なる呻き」と呼ばれていた。

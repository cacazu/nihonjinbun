        "source_sequence": 13
    "translation_ja": |-
      フランシーは十一歳。はにかみやで、胸の内を明かさず、年のわりには幼さの残る少年だった。もっとも学業のほうは遅れてなどいなかった。マクブレアという、職を追われた牧師が、家庭教師の名目でモントロイモント家にかくまわれ、かなり先まで教え込んでいたのだ。少年はすでに母親にひそかに度々使われていて、伝言を届けさせても、潜伏中の逃亡者に食べ物を運ばせても、野外礼拝を見下ろす尾根で見張りに立たせても、これほどうってつけの人手はあるまいと思われた。荒野のどれほどむき出しの場所でも、この子は身を隠すところを見つけるらしかった。屋敷を取り巻く七マイルほどの一帯で、泥炭の窪みも、岩塊も、ヒースの茂みも一つ残らず知っているので、誰にも姿を見られずに忍び寄ったり、立ち去ったりできぬ場所などほとんどなかった。その身のこなしが土地の評判となり、こうした危険な用向きにかり出される大勢の子供たちのあいだで、彼は〈ヒースの山猫〉と呼ばれていた。

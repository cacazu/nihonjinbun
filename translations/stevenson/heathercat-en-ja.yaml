    "translation_ja": |-
      いまや奥方はすっかり波に乗った。そのうえ、得意な題目が二つときている。ホワイトクロス夫人の至らなさと、クローザー一族ことごとくの不行跡だ。もっとも後者が品行方正で人目を引いたためしは、実のところ、ないのだが。時計できっかり二十分、奥方はその二つを、説教壇に立つかのような口ぶりで、憑かれた人さながらに、驚くほど勢いよく、細かいところまで語り立てた。「ああ、地獄に落ちる迎合め！」と叫んだ。「そんな迎合をする人間がキリスト者と同じパンを分かつのを、私は許しません。このご時世のあらゆる罪のうち、あの呪わしい迎合ほど神に逆らい、キリストを辱めるものはありません」。その間ずっと、少年は目の前に立ち、考えが途切れ途切れによそへそれた。おもにハドーとジャネットのこと、それから上っ張りを脱ぎかけたジョック・クローザーのことだった。だが、いくら上の空でも、耳に入ったことは多すぎたとも言えよう。父と彼とはともに「迎合者」、つまり法に従って教区の教会へ通っていたのだから。
    "translation_status": "reviewed"

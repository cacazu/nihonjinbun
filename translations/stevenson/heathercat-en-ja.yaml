    "translation_ja": |-
      「それがどうした？　わしが何を知っとる？」とハドーは叫んだ。「マクブレア、このとんまな婆さんめ。嘘偽りなく言うが、わしはあの子に手を出しちゃおらんぞ。ただのじゃれ合いだと言っとろうが。じゃれただけだ、それだけだ。ほんの冗談よ！　わしは面白いことが好物だ、そりゃ否定せんし、そう責められる筋合いもない。だが本気で何か、となると――ばか言え、そんなことをしちゃ免職になりかねん！　誓って言うぞ。聖書はどこだ、おまえの前で誓ってやる！」
    "translation_status": "reviewed"

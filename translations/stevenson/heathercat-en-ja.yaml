    "translation_ja": |-
      嵐が来る少し前、前哨線ではこれとはまた違う一幕が進んでいた。見張りは概して大切な務めを忠実に果たしていた。だがドラムロウの丘の端は安全な集会場として知られており、この日に限って外側の歩哨たちは初めからいくらか気がゆるんでいて、説教が並外れて長びくにつれ、一段とゆるんでいった。フランシーは自分に割り当てられた隠れ場所に身を伏せ、二株のハリエニシダのあいだから外をうかがっていた。小川の向こうに平らな荒野が広がり、その先には丘と丘の切れ目まで見渡せる。動くものといったらライチョウと、北へ向かって視野をゆっくり横切る幾頭かの牛だけだ。彼には詩篇を歌う声が聞こえ、その荒々しくもの悲しい節に、自分で勝手に言葉をつけて歌った。というのも自分だけの目論見があって、熱病の熱と悪寒のように、胸の中で恐怖と尻込みとが交互に幅をきかせていたからだ。歌っているあいだは勇気のほうが勝った。みんなが歌い終わるまで、彼はずっとこの即興の文句で唱和した。

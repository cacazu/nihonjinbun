      それから、この話をよそでしてはならぬと固く言い渡し、今後、あの牧師のすることからは目も背けるよう命じた。「あなたはあの人の偶像礼拝の場には行かねばなるまい。そこでなら見てもよい！」と師は言った。「だがよそではいけない。目をそらし、耳をふさぎ、死んで三日もたつ亡骸だと思って素通りしなさい。あの男はあの呪わしい怪物バシリスクと同じ、目を向けただけで人をけがす、いや、毒してしまうのだ！」――この話のどこを取っても、少年にはたいして腑に落ちなかった。

      「この悪がき！」ジャネットはそう叫んで、まっかになった。牛を追う節くれだった棒で坊ちゃんをひっぱたこうとしたかと思うと、もう次には、誰にも言わないでくれと手を合わせんばかりに頼み込んでいる。「誰にだって、なんの関わりもないことじゃないか」「村じゅうの噂になるだけだよ」と彼女は言った。そんなことになれば、自分はデュール川に身を投げるほかなくなる、と。
    "translation_status": "reviewed"
    "source_alignment":

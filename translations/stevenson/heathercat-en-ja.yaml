    "translation_ja": |-
      この雄弁を繰り出す話しぶりは耳をつんざき、時には大砲のような声が轟いた。こうした才はよかれあしかれ、丘の説教師すべてに備わっていて、不思議なほどよく似ており、そっくり同じと言ってもよかった。彼らの持ち出す譬えは、荒野の赤い地平と雨の降る丘の頂、羊飼いとその羊、一挺の鳥撃ち銃、鋤、パイプ、堆肥の山、鳴く雄鶏、照る日と陰る日といったところをほとんど出なかった。ときおり素朴な人情の哀切が、またしばしば聖書の大仰な文句を縫いつけた継ぎが、この飾らぬ地の織りのところどころに彩りを添えていた。それは独特の詩であった。吹きさらしで厳しく、それでいてまがいものではなく、この土地の匂いがした。

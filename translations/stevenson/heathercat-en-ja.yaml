        "source_sequence": 109
    "translation_ja": |-
      彼は、友達、いや、敵といったほうがよいジョック・クローザーが、前哨線のなかでもきわめて大事な場所に置かれたことに気づいていた。ちょうど小川が、半円に取り巻く高い荒野から、切り立った峡谷を通って流れ出るところだ。彼を奮い立たせ戦いに向かわせるものがあるとすれば、それはこのことだった。その持ち場は重要だった。丘の端そのものに次ぐ防備の要といってよい。身を隠すものに乏しいため、子供を一人配置するのが、いちばん理にかなった場所でもあった。そこはヒースの山猫が立つべき持ち場だった。なぜクローザーにやったのだろう？　その問いに向き合うたび、どんな返事が返ってくるかと思うと、鋭い恐怖が骨の髄を走った。ひょっとしてクローザーは吹聴したのだろうか。自分の、あのヒースの山猫の名を汚す噂が、もう広まっているのか。自分の名誉は公然と傷つけられたのか。それを思うと周りの世界はことごとく暗くなった。彼はもがくこともせず、真夜中の絶望の淵に沈んだ。けれども、そうやって沈むたび、溺れ死んだ英雄心ではなかったにせよ、溺れかけた勇気を髪の毛をつかんで引き上げてきた。持ち場を離れてクローザーのいるほうへ這い始めたとき、心臓の打ち方はひどく遅かった。何かが彼を後ろへ引いた。務めを思う心ではなく、クローザーの体格と、憎らしいほどすぐ飛び出すあの拳を思い出したのである。彼の考える務めは、むしろ、今たどっているこの気の重い道を、このまま進め、と命じていた。たとえ骨の折れる危険は冒しても、できることなら汚名をそそげ、というのが務めだった。想像するだけで節々の骨も口の中の歯も一本残らず痛んだ。その陰にもう一つ、恐ろしい考えが忍び寄った。怪我でもしたら泣きだして、また恥をさらしはしないか。少年らしく、まだ後戻りはできると思って自分をなだめた。人に見られぬようクローザーの持ち場まで忍び寄るだけなら簡単だし、たぶんまたこっそり引き返すのではないかという腹づもりも、ずっと胸の片隅にあった。進んでゆくうちに説教師のすぐ近くまで来て、言葉が幾つか聞き取れた。「牧師どの、クラヴァースの消息はいかに？　あやつは荒れ狂い吠えたける獅子のごとく巡り歩いておる……。

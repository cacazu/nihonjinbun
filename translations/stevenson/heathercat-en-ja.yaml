        "source_sequence": 103
    "translation_ja": |-
      「その日には三十マイル歩いても、雄鶏のひと鳴きも聞こえぬ」と彼は語った。「五十マイルを行ってもパイプに分けてもらう火もなく、百マイルを行っても煙を上げる家一軒見えぬ。全スコットランドにあるのは、死人の骨と暗闇と、生きて働く主の怒りばかりとなるからだ。おお、どこに身を寄せるところを求めよう。おお皆の衆、主の怒りの風をしのぐところを、どこに求めよう？　これを風と呼ばれるか？　神に感謝されよ！　皆の衆、これはひとときの御計らいにすぎぬ。ほんのひと吹きの風、ほんのひとしずくの雨、それでおしまいだ。早くも西の空には弓なりに青みが見える。日はまた街道のまんなかを堂々と歩み、皆の着物は着たまま乾き、その骨を包む肉も暖かくなるだろう。だが、おお、皆の衆、皆の衆！　主の怒りの日こそは！」

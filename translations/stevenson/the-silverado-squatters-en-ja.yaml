  - "id": "sv-starry-009"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So sings Mr. Trowbridge, with a noble inspiration. And so had the sunlight flooded that pale islet of the moon, and her lit face put out, one after another, that galaxy of stars. The wonder of the drive was over; but, by some nice conjunction of clearness in the air and fit shadow in the valley where we travelled, we had seen for a little while that brave display of the midnight heavens. It was gone, but it had been; nor shall I ever again behold the stars with the same mind. He who has seen the sea commoved with a great hurricane, thinks of it very differently from him who has seen it only in a calm. And the difference between a calm and a hurricane is not greatly more striking than that between the ordinary face of night and the splendour that shone upon us in that drive. Two in our waggon knew night as she shines upon the tropics, but even that bore no comparison. The nameless colour of the sky, the hues of the star-fire, and the incredible projection of the stars themselves, starting from their orbits, so that the eye seemed to distinguish their positions in the hollow of space—these were things that we had never seen before and shall never see again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 249

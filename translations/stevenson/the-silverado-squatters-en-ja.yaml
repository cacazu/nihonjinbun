    "translation_status": "reviewed"
  - "id": "sv-toll-002"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Toll House, standing alone by the wayside under nodding pines, with its streamlet and water-tank; its backwoods, toll-bar, and well trodden croquet ground; the ostler standing by the stable door, chewing a straw; a glimpse of the Chinese cook in the back parts; and Mr. Hoddy in the bar, gravely alert and serviceable, and equally anxious to lend or borrow books;—dozed all day in the dusty sunshine, more than half asleep. There were no neighbours, except the Hansons up the hill. The traffic on the road was infinitesimal; only, at rare intervals, a couple in a waggon, or a dusty farmer on a springboard, toiling over “the grade” to that metropolitan hamlet, Calistoga; and, at the fixed hours, the passage of the stages."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 233
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[168]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-002"
    "translation_ja": "〈トール・ハウス〉は松がうなずく下、道端にぽつんと立っていた。小川と水槽、裏手の森、遮断棒、よく踏み固められたクロッケー場。厩の戸口では馬丁が藁を噛み、建物の奥に中国人の料理人がちらりと見える。酒場にはホディさんがいて、まじめな顔で目を配り、頼めば手を貸してくれる。本を貸すのも借りるのと同じほど好きだった。そんな宿は埃っぽい日だまりで、一日じゅう半ば以上眠っていた。近所といえば山の上のハンソン家しかない。街道の往来もほとんどない。たまに二人連れが荷馬車に乗り、あるいは埃まみれの農夫がばね付きの荷車に乗って、大都会も同然のあの小村カリストガまで、〈坂道〉を難儀して通り抜ける。あとは決まった時刻に駅馬車が通るだけだ。"
    "translation_status": "reviewed"
  - "id": "sv-toll-003"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The nearest building was the school-house, down the road; and the school-ma’am boarded at the Toll House, walking thence in the morning to the little brown shanty, where she taught the young ones of the district, and returning thither pretty weary in the afternoon. She had chosen this outlying situation, I understood, for her health. Mr. Corwin was consumptive; so was Rufe; so was Mr. Jennings, the engineer. In short, the place was a kind of small Davos: consumptive folk consorting on a hilltop in the most unbroken idleness. Jennings never did anything that I could see, except now and then to fish, and generally to sit about in the bar and the verandah, waiting for something to happen. Corwin and Rufe did as little as possible; and if the school-ma’am, poor lady, had to work pretty hard all morning, she subsided when it was over into much the same dazed beatitude as all the rest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 234
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[169]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-003"
    "translation_ja": "もっとも近い建物は街道を下ったところの学校だった。女先生はトール・ハウスに下宿して、朝にはそこから茶色い小屋まで歩き、近所の子供を教え、午後にはすっかりくたびれて戻ってきた。この辺鄙な勤め先を選んだのは、体のためだと聞いていた。コーウィンさんは肺病にかかっており、ルーフも、技師のジェニングズさんもそうだった。要するにここは小さなダヴォスのようなもので、肺病の者が山の頂に集まって、途切れることのない無為をともにしていた。ジェニングズさんは、私の見た限り、ときおり釣りをする以外何もしなかった。大抵は酒場かヴェランダに座って、何か起きやしないかと待っている。コーウィンとルーフはできるだけ働かない。かわいそうに女先生は午前中いっぱいかなり働かなければならなかったが、済めばほかのみんなとほとんど同じ、ぼうっとした極楽気分に戻るのだった。"
    "translation_status": "reviewed"
  - "id": "sv-toll-004"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Her special corner was the parlour—a very genteel room, with Bible prints, a crayon portrait of Mrs. Corwin in the height of fashion, a few years ago, another of her son (Mr. Corwin was not represented), a mirror, and a selection of dried grasses. A large book was laid religiously on the table—“From Palace to Hovel,” I believe, its name—full of the raciest experiences in England. The author had mingled freely with all classes, the nobility particularly meeting him with open arms; and I must say that traveller had ill requited his reception. His book, in short, was a capital instance of the Penny Messalina school of literature; and there arose from it, in that cool parlour, in that silent, wayside, mountain inn, a rank atmosphere of gold and blood and “Jenkins,” and the “Mysteries of London,” and sickening, inverted snobbery, fit to knock you down. The mention of this book reminds me of another and far racier picture of our island life. The latter parts of Rocambole are surely too sparingly consulted in the country which they celebrate. No man’s education can be said to be complete, nor can he pronounce the world yet emptied of enjoyment, till he has made the acquaintance of “the Reverend Patterson, director of the Evangelical Society.” To follow the evolutions of that reverend gentleman, who goes through scenes in which even Mr. Duffield would hesitate to place a bishop, is to rise to new ideas. But, alas! there was no Patterson about the Toll House. Only, alongside of “From Palace to Hovel,” a sixpenny “Ouida” figured. So literature, you see, was not unrepresented."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 235
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[170]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-004"
    "translation_ja": "女先生の決まった居場所は客間だった。上品な部屋で、聖書の絵、数年前の流行の先端を行くコーウィン夫人のクレヨン画、息子の同じような肖像、鏡、それに草の穂を乾かした飾りがあった。コーウィン氏の肖像はない。卓には大きな本が恭しく載せてあった。たしか『宮殿からあばら家まで』という名で、イングランドでのとびきり刺激的な体験が詰まっていた。著者はどの階級にも気軽に入り込み、とりわけ貴族は両手を広げて彼を迎えたが、この旅人はその歓待にずいぶんひどいお返しをしたと言わねばならない。ひと言で言えば、安物のメッサリナを生む文学流派の見本のような本だった。静かな山道のひなびた宿、その涼しい客間に、金と血と「ジェンキンズ」と『ロンドンの秘密』と、胸の悪くなるような裏返しの俗物根性が混じった、のけぞるほど濃い臭気が本から立ちのぼった。この本のことを書いて、わが島国の生活を描いた、もっとずっと刺激的な別の絵が思い出された。あの『ロカンボール』の後半は、そこで描かれた当の国では、確かにもっと読まれてしかるべきだ。「福音協会の理事、パターソン牧師」と知り合わないうちは、誰の教育も完全とは言えないし、世の中にはもう楽しみも残っていないなどと言ってはいけない。この牧師は、ダフィールド氏でさえ司教を置くのをためらうような場面をくぐっていく。その目まぐるしい立ち回りを追えば、新しい発想が浮かんでくる。ああ、だがこの宿にはパターソンはいない。『宮殿からあばら家まで』の横に、六ペンスの「ウィーダ」が一冊鎮座しているだけだった。こうして文学とて、代表がいなかったわけではない。"
    "translation_status": "reviewed"
  - "id": "sv-toll-005"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The school-ma’am had friends to stay with her, other school-ma’ams enjoying their holidays, quite a bevy of damsels. They seemed never to go out, or not beyond the verandah, but sat close in the little parlour, quietly talking or listening to the wind among the trees. Sleep dwelt in the Toll House, like a fixture: summer sleep, shallow, soft, and dreamless. A cuckoo-clock, a great rarity in such a place, hooted at intervals about the echoing house; and Mr. Jenning would open his eyes for a moment in the bar, and turn the leaf of a newspaper, and the resting school-ma’ams in the parlour would be recalled to the consciousness of their inaction. Busy Mrs. Corwin and her busy Chinaman might be heard indeed, in the penetralia, pounding dough or rattling dishes; or perhaps Rufe had called up some of the sleepers for a game of croquet, and the hollow strokes of the mallet sounded far away among the woods: but with these exceptions, it was sleep and sunshine and dust, and the wind in the pine trees, all day long."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 236
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[171]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-005"
    "translation_ja": "女先生のところには友達が泊まりに来ていた。休みを楽しむ女先生がほかにもいて、娘たちの一団ができていた。外へ出てもヴェランダまでがせいぜいで、小さな客間に寄り集まり、静かに話すか、木々の風を聞くばかりらしい。眠りが宿に備えつけのように棲んでいた。浅くやわらかく夢もない、夏の眠りだ。こんな所ではたいそう珍しい鳩時計がときおり鳴き、家じゅうに響いた。すると酒場のジェニングズさんは、ほんのひととき目を開けて新聞を一枚めくり、客間で休む女先生たちは、いま自分たちが何もしていないことにふたたび気づく。奥の奥から、忙しいコーウィン夫人と忙しい中国人の料理人が生地をついたり皿を鳴らしたりする音だけは、聞こえることがある。あるいはルーフが眠っている者を何人か起こしてクロッケーを始め、木槌のうつろな響きが森の奥まで届くこともある。だがそれらを除けば、眠りと日差しと埃と、松の中を吹く風だけで、一日が過ぎた。"
    "translation_status": "reviewed"
  - "id": "sv-toll-006"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little before stage time, that castle of indolence awoke. The ostler threw his straw away and set to his preparations. Mr. Jennings rubbed his eyes; happy Mr. Jennings, the something he had been waiting for all day about to happen at last! The boarders gathered in the verandah, silently giving ear, and gazing down the road with shaded eyes. And as yet there was no sign for the senses, not a sound, not a tremor of the mountain road. The birds, to whom the secret of the hooting cuckoo is unknown, must have set down to instinct this premonitory bustle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 237
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[172]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-006"
    "translation_ja": "駅馬車の時刻が少し近づくと、この怠惰の城が目を覚ました。馬丁は藁を投げ捨て、支度にとりかかった。ジェニングズさんは目をこすった。おめでとう、ジェニングズさん。一日じゅう待っていた何かが、とうとう起きるのだ！　宿泊客はヴェランダに集まり、黙って耳を澄ませ、目の上に手をかざして街道の先を見つめた。まだ何も見えず聞こえず、山道はひと揺れもしない。鳩時計の鳴き声に隠れた仕組みを知らない鳥たちは、この先ぶれの騒ぎを、本能のなせるわざと受け取ったに違いない。"
    "translation_status": "reviewed"
  - "id": "sv-toll-007"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then the first of the two stages swooped upon the Toll House with a roar and in a cloud of dust; and the shock had not yet time to subside, before the second was abreast of it. Huge concerns they were, well-horsed and loaded, the men in their shirt-sleeves, the women swathed in veils, the long whip cracking like a pistol; and as they charged upon that slumbering hostelry, each shepherding a dust storm, the dead place blossomed into life and talk and clatter. This the Toll House?—with its city throng, its jostling shoulders, its infinity of instant business in the bar? The mind would not receive it! The heartfelt bustle of that hour is hardly credible; the thrill of the great shower of letters from the post-bag, the childish hope and interest with which one gazed in all these strangers’ eyes. They paused there but to pass: the blue-clad China-boy, the San Francisco magnate, the mystery in the dust coat, the secret memoirs in tweed, the ogling, well-shod lady with her troop of girls; they did but flash and go; they were hull-down for us behind life’s ocean, and we but hailed their topsails on the line. Yet, out of our great solitude of four and twenty mountain hours, we thrilled to their momentary presence gauged and divined them, loved and hated; and stood light-headed in that storm of human electricity. Yes, like Piccadilly circus, this is also one of life’s crossing-places. Here I beheld one man, already famous or infamous, a centre of pistol-shots: and another who, if not yet known to rumour, will fill a column of the Sunday paper when he comes to hang—a burly, thick-set, powerful Chinese desperado, six long bristles upon either lip; redolent of whiskey, playing cards, and pistols; swaggering in the bar with the lowest assumption of the lowest European manners; rapping out blackguard English oaths in his canorous oriental voice; and combining in one person the depravities of two races and two civilizations. For all his lust and vigour, he seemed to look cold upon me from the valley of the shadow of the gallows. He imagined a vain thing; and while he drained his cock-tail, Holbein’s death was at his elbow. Once, too, I fell in talk with another of these flitting strangers—like the rest, in his shirt-sleeves and all begrimed with dust—and the next minute we were discussing Paris and London, theatres and wines. To him, journeying from one human place to another, this was a trifle; but to me! No, Mr. Lillie, I have not forgotten it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 238
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[173]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-007"
    "translation_ja": "すると最初の駅馬車が、轟音と土埃をあげてトール・ハウスへ突っこんできた。その衝撃がまだおさまらないうちに、二台目が横に並んだ。どっしりした馬車に、立派な馬をつけ、荷をいっぱい積んでいる。男は上着を脱ぎ、女はヴェールを幾重にも巻き、長い鞭が拳銃のようにはじける。土埃の嵐を一つずつ従え、うつらうつらする宿へ突撃すると、死んだ場所にたちまち命が咲き、話し声と物音があふれた。これがトール・ハウスか。都会の人だかりがあり、肩がぶつかり、酒場では今すぐ片づけねばならない用が引きも切らない。頭がどうにも納得しない！　ほんのひととき、心の底まで浮き立つあわただしさは、ほとんど信じがたい。郵便袋から手紙がにわか雨のように出てきたときの胸の震え。見知らぬ人の目を一つ一つのぞき込む、子供じみた期待と興味。立ち止まったのは通り過ぎるためだけだ。青服の中国人の若者、サンフランシスコの有力者、埃よけ外套の中の謎、ツイードの中の秘密の回想録、靴の立派な色目づかいの淑女と、取り巻く娘の群れ。彼らは一瞬きらめいて去る。人生の大海の向こうに船体は隠れ、私たちは水平線にのぞく上帆に声をかけただけだった。それでも山での二十四時間という大きな孤独から、束の間のかれらを感じて胸を震わせ、見定め、推しはかり、愛し、憎んだ。この人間の電気の嵐の中で頭がくらくらした。そう、ピカデリー・サーカスと同じく、ここも人生の交差点の一つなのである。すでに有名というか悪名高く、銃弾の飛び交う中心にいた男もここで見た。それからもう一人、まだ噂にのぼらないにしても、絞首になる日には日曜新聞の一段を埋めるだろう男も見た。がっしりと背が詰まった、力の強い中国人の無法者で、上唇にも下唇にも長い剛毛が六本ずつある。ウイスキーとトランプと拳銃の匂いを漂わせ、最も卑しいヨーロッパ風をまた卑しい気取りでまねながら、酒場を肩で風を切って歩いた。歌うような東洋風の声で、英語の下品な悪態をぽんぽん吐き、二つの人種、二つの文明の堕落を一身に合わせていた。欲も力もあれほど盛んなのに、絞首台の影の谷からこちらを冷ややかに見ているように思われた。思い描くのはむなしいことだ。カクテルを飲み干す彼のすぐ脇に、ホルバインの描く〈死〉がいた。あるときには、やはりふらりと来た見知らぬ人の一人と話し込んだ。ほかのみんなと同じ、上着を脱いで埃だらけの男だった。すると次の瞬間には、パリとロンドン、劇場とワインの話をしていた。人のいる所から人のいる所へ旅する彼にとっては、何でもないことだったろう。だが私にとっては！　いいえ、リリーさん、私は忘れていませんよ。"
    "translation_status": "reviewed"
  - "id": "sv-toll-008"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And presently the city-tide was at its flood and began to ebb. Life runs in Piccadilly Circus, say, from nine to one, and then, there also, ebbs into the small hours of the echoing policeman and the lamps and stars. But the Toll House is far up stream, and near its rural springs; the bubble of the tide but touches it. Before you had yet grasped your pleasure, the horses were put to, the loud whips volleyed, and the tide was gone. North and south had the two stages vanished, the towering dust subsided in the woods; but there was still an interval before the flush had fallen on your cheeks, before the ear became once more contented with the silence, or the seven sleepers of the Toll House dozed back to their accustomed corners. Yet a little, and the ostler would swing round the great barrier across the road; and in the golden evening, that dreamy inn begin to trim its lamps and spread the board for supper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 239
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[174]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-008"
    "translation_ja": "じきに都会の潮は満ちきり、引き始めた。たとえばピカデリー・サーカスでは九時から一時まで人の世が流れ、そのあとそこでも潮が引いて、巡査の足音がこだまし、街灯と星が光る夜更けになる。だがトール・ハウスははるか上流の、田舎の源に近い。潮の泡がかすかに触れるだけだ。まだ喜びをつかみきらないうちに、馬が車につながれ、鞭がいっせいに鳴り、潮は去る。二台の駅馬車は北と南へ消え、立ち上った埃が森に沈んだ。だが頬のほてりが引き、耳がまた静けさに満足し、宿の七人の眠り人がいつもの場所でふたたびうとうとし始めるまでには、まだ間があった。もう少しで馬丁が大きな棒をまわして街道を塞ぐ。そして黄金色の夕べに、眠たげな宿はランプの芯を切りそろえ、夕食の卓を整え始めるのだった。"
    "translation_status": "reviewed"
  - "id": "sv-toll-009"
    "section_id": "toll"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I recall the place—the green dell below; the spires of pine; the sun-warm, scented air; that gray, gabled inn, with its faint stirrings of life amid the slumber of the mountains—I slowly awake to a sense of admiration, gratitude, and almost love. A fine place, after all, for a wasted life to doze away in—the cuckoo clock hooting of its far home country; the croquet mallets, eloquent of English lawns; the stages daily bringing news of—the turbulent world away below there; and perhaps once in the summer, a salt fog pouring overhead with its tale of the Pacific."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 240
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[175]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toll-009"
    "translation_ja": "あの場所を思い返す。下に緑の谷間、尖塔のような松、日に温められた香りのよい空気。山々の眠りにぽつりと生命のかすかな動きがある、灰色の妻壁をもつあの宿。ゆっくりと、感嘆と感謝、ほとんど愛情といってよい気持ちが目を覚ます。人生をいたずらにまどろみ過ごすには、結局、よい所だ。鳩時計ははるかな故郷の言葉で鳴き、クロッケーの木槌はイングランドの芝生を雄弁に語る。駅馬車は毎日、あの下界の騒がしい世間から便りを運ぶ。そして、ことによれば夏に一度、太平洋の話をたずさえた塩辛い霧が、頭の上を流れ越してゆく。"
    "translation_status": "reviewed"

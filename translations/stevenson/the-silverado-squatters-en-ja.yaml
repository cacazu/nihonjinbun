        "printed_page": "68"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-001"
    "translation_ja": "第二章　シルヴェラードの第一印象"
    "translation_status": "reviewed"
  - "id": "sv-first-002"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We were to leave by six precisely; that was solemnly pledged on both sides; and a messenger came to us the last thing at night, to remind us of the hour. But it was eight before we got clear of Calistoga: Kelmar, Mrs. Kelmar, a friend of theirs whom we named Abramina, her little daughter, my wife, myself, and, stowed away behind us, a cluster of ship’s coffee-kettles. These last were highly ornamental in the sheen of their bright tin, but I could invent no reason for their presence. Our carriageful reckoned up, as near as we could get at it, some three hundred years to the six of us. Four of the six, besides, were Hebrews. But I never, in all my life, was conscious of so strong an atmosphere of holiday. No word was spoken but of pleasure; and even when we drove in silence, nods and smiles went round the party like refreshments."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 131
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[83]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-002"
    "translation_ja": "六時きっかりに発つことになっていた。双方が厳粛に約束し、寝る間際には念を押す使いまでこちらへ来た。だがカリストガを抜け出したときには八時だった。ケルマー、ケルマー夫人、二人の友人で私たちがアブラミーナと名づけた女性、その幼い娘、妻と私。それに私たちの後ろに、船で使うコーヒー用のやかんが何個も積み込んであった。明るいブリキの光沢はたいそう見栄えがよかったが、どうしてこんなものまであるのか、さっぱり見当がつかなかった。私たち六人の年をできるだけ正確に足すと、およそ三百になる。しかも六人のうち四人はユダヤ人だ。だが私の一生で、これほど全員が休日気分に浸っていることはなかった。口にすることといったら楽しいことだけで、黙って馬車に揺られているときさえ、うなずきや微笑が、振る舞いのお菓子のようにみんなの間を行き来した。"
    "translation_status": "reviewed"
  - "id": "sv-first-003"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sun shone out of a cloudless sky. Close at the zenith rode the belated moon, still clearly visible, and, along one margin, even bright. The wind blew a gale from the north; the trees roared; the corn and the deep grass in the valley fled in whitening surges; the dust towered into the air along the road and dispersed like the smoke of battle. It was clear in our teeth from the first, and for all the windings of the road it managed to keep clear in our teeth until the end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 132
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[84]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-003"
    "translation_ja": "雲一つない空から日が照っていた。天頂近くには沈みそびれた月が、まだはっきり見え、片方の縁は明るいままだった。北風が荒れ狂い、木々はうなりを立て、谷の穀物と深い草は白い波頭を立ててなびき、道に沿って立ち上る土埃が、戦場の硝煙のように散った。初めからまともな向かい風だったが、道がいくら曲がりくねっても、最後までいつもまともに吹きつけてきた。"
    "translation_status": "reviewed"
  - "id": "sv-first-004"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For some two miles we rattled through the valley, skirting the eastern foothills; then we struck off to the right, through haugh-land, and presently, crossing a dry water-course, entered the Toll road, or, to be more local, entered on “the grade.” The road mounts the near shoulder of Mount Saint Helena, bound northward into Lake County. In one place it skirts along the edge of a narrow and deep canyon, filled with trees, and I was glad, indeed, not to be driven at this point by the dashing Foss. Kelmar, with his unvarying smile, jogging to the motion of the trap, drove for all the world like a good, plain, country clergyman at home; and I profess I blessed him unawares for his timidity."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 133
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[85]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-004"
    "translation_ja": "二マイルほど谷をがたがた走り、東の山裾に沿っていった。それから右に折れ、川沿いの低地を抜け、やがて干上がった川床を渡って、有料道路へ出た。この辺の言い方なら〈坂道〉にかかったのである。道はセント・ヘレナ山の手前の肩を登り、レイク郡を目指して北へ延びる。途中一か所、木に埋まった狭く深い峡谷の縁を通る。こんな所で御者があの飛ばし屋フォスでなくて本当によかった。ケルマーはいつもの微笑を浮かべ、二輪馬車の揺れにつれて体を揺すりながら、まるで本国の善良で飾り気のない田舎牧師のように手綱を取った。思わず心の中で、彼の臆病さに感謝したほどである。"
    "translation_status": "reviewed"
  - "id": "sv-first-005"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Vineyards and deep meadows, islanded and framed with thicket, gave place more and more as we ascended to woods of oak and madrona, dotted with enormous pines. It was these pines, as they shot above the lower wood, that produced that pencilling of single trees I had so often remarked from the valley. Thence, looking up and from however far, each fir stands separate against the sky no bigger than an eyelash; and all together lend a quaint, fringed aspect to the hills. The oak is no baby; even the madrona, upon these spurs of Mount Saint Helena, comes to a fine bulk and ranks with forest trees—but the pines look down upon the rest for underwood. As Mount Saint Helena among her foothills, so these dark giants out-top their fellow-vegetables. Alas! if they had left the redwoods, the pines, in turn, would have been dwarfed. But the redwoods, fallen from their high estate, are serving as family bedsteads, or yet more humbly as field fences, along all Napa Valley."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 134
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[86]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-005"
    "translation_ja": "藪に額縁のように取り巻かれ、島のように点在する葡萄畑も深い草地も、高く登るにつれ、ひときわ巨大な松の点在するオークとマドロナの森に変わっていった。谷から何度も見上げた、鉛筆で一筋ずつ描いたような木の影は、下の森より抜きんでたこの松のものだった。谷から見上げると、どんなに遠くても針葉樹は一本一本、空を背に睫毛ほどの大きさで見え、その全部が合わさって山を風変わりな房飾りで縁取っている。オークとて小さな木ではない。マドロナでさえセント・ヘレナ山の支尾根ではみごとな太さになり、堂々たる森の木となる。それでも松から見下ろせば、ほかの木は下生えにすぎない。麓の丘々の中でセント・ヘレナ山がそびえるように、黒々としたこの巨人たちが、ほかの木々の上にそびえている。ああ、レッドウッドを残しておいてくれさえすれば、今度は松が小さく見えたはずなのに。だが高い身分から落ちたレッドウッドはいま、ナパの谷じゅうで、家庭の寝台になって働いている。もっと卑しいものは畑の柵だ。"
    "translation_status": "reviewed"
  - "id": "sv-first-006"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A rough smack of resin was in the air, and a crystal mountain purity. It came pouring over these green slopes by the oceanful. The woods sang aloud, and gave largely of their healthful breath. Gladness seemed to inhabit these upper zones, and we had left indifference behind us in the valley. “I to the hills lift mine eyes!” There are days in a life when thus to climb out of the lowlands, seems like scaling heaven."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 135
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[87]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-006"
    "translation_ja": "空気には松脂のつんとする匂いがあり、水晶のような山の澄みきった気があった。それが緑の斜面に海ほどの量で流れこんでいた。森は声を張りあげて歌い、体を健やかにする息を惜しみなく吐いている。喜びがこの高い地帯に棲んでいるようで、物事をどうでもよく思う気持ちは谷に置いてきた。「われ、山に向かいて目を上ぐ」。低い地を離れてこうして高みへ登るのが、天をよじ登っていくように感じられる日が、一生にはあるものだ。"
    "translation_status": "reviewed"
  - "id": "sv-first-007"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As we continued to ascend, the wind fell upon us with increasing strength. It was a wonder how the two stout horses managed to pull us up that steep incline and still face the athletic opposition of the wind, or how their great eyes were able to endure the dust. Ten minutes after we went by, a tree fell, blocking the road; and even before us leaves were thickly strewn, and boughs had fallen, large enough to make the passage difficult. But now we were hard by the summit. The road crosses the ridge, just in the nick that Kelmar showed me from below, and then, without pause, plunges down a deep, thickly wooded glen on the farther side. At the highest point a trail strikes up the main hill to the leftward; and that leads to Silverado. A hundred yards beyond, and in a kind of elbow of the glen, stands the Toll House Hotel. We came up the one side, were caught upon the summit by the whole weight of the wind as it poured over into Napa Valley, and a minute after had drawn up in shelter, but all buffetted and breathless, at the Toll House door."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 136
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[88]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-007"
    "translation_ja": "上れば上るほど、風はいよいよ強く襲いかかった。あの元気な二頭の馬が、急坂で私たちを曳き上げながら、よくも力自慢の風をまともに受けて進めたものだ。あの大きな目で土埃によく耐えたものだ。私たちが通って十分後には木が一本倒れ、道をふさいだ。その前からすでに、葉が道に厚く散り敷き、通り抜けるのに苦労するほどの枝が何本も落ちていた。だが頂上はもうすぐそこだった。ケルマーが麓から指さしたあの切れ込みのところで尾根を渡ると、道はためらいもなく、向こう側の深く木の茂った谷に突っ込んでいく。道のいちばん高いところからは、左手、本峰を上る小道が分かれる。これがシルヴェラードへの道だ。そこから百ヤードの先、谷が肘のように折れたところに〈トール・ハウス・ホテル〉が立っている。片側から登りつめたところで、ナパの谷へ吹き下ろす風の全力を身に受けた。ほんの一分後にはもう風をよけられるところだったが、こづき回され息も絶え絶えで、私たちはホテルの戸口に馬車を止めた。"
    "translation_status": "reviewed"
  - "id": "sv-first-008"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A water-tank, and stables, and a gray house of two stories, with gable ends and a verandah, are jammed hard against the hillside, just where a stream has cut for itself a narrow canyon, filled with pines. The pines go right up overhead; a little more and the stream might have played, like a fire-hose, on the Toll House roof. In front the ground drops as sharply as it rises behind. There is just room for the road and a sort of promontory of croquet ground, and then you can lean over the edge and look deep below you through the wood. I said croquet ground, not green; for the surface was of brown, beaten earth. The toll-bar itself was the only other note of originality: a long beam, turning on a post, and kept slightly horizontal by a counterweight of stones. Regularly about sundown this rude barrier was swung, like a derrick, across the road and made fast, I think, to a tree upon the farther side."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 137
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[89]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-008"
    "translation_ja": "水槽と馬小屋、それに妻壁とヴェランダのある二階建ての灰色の家が、山腹にへばりつくように建っている。流れが削った、松に埋まる細い峡谷のすぐそばだ。松は頭の真上を過ぎるほど斜面をのぼっていく。流れの勢いがもう少し強ければ、消火ホースのように宿の屋根に水をかけられそうだった。裏の地面が急にせり上がるのと同じ急さで、前の地面も落ちていく。道と、岬のように突き出したクロッケー場がどうにか収まるだけで、その縁から身を乗り出すと、森の中のはるか下まで見える。クロッケーの芝生ではなく、クロッケー場と言ったのは、表面が踏み固めた茶色の土だからだ。ほかに風変わりなのは、関所の遮断棒だけだった。長い梁が支柱を軸にまわり、釣り合いに石を載せてほぼ水平を保つ。日暮れごろになるときまって、この粗末な仕切りを起重機の腕のように回して道をふさぎ、たしか向こう側の木に結びとめていた。"
    "translation_status": "reviewed"
  - "id": "sv-first-009"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On our arrival there followed a gay scene in the bar. I was presented to Mr. Corwin, the landlord; to Mr. Jennings, the engineer, who lives there for his health; to Mr. Hoddy, a most pleasant little gentleman, once a member of the Ohio legislature, again the editor of a local paper, and now, with undiminished dignity, keeping the Toll House bar. I had a number of drinks and cigars bestowed on me, and enjoyed a famous opportunity of seeing Kelmar in his glory, friendly, radiant, smiling, steadily edging one of the ship’s kettles on the reluctant Corwin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 138
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[90]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-009"
    "translation_ja": "着いて早々、酒場では賑やかな顔合わせがあった。宿の主人コーウィンさん、保養のためそこに住む技師のジェニングズさん、そして小柄でことのほか感じのよいホディさんを紹介された。ホディさんは元オハイオ州の議員、その後は地方紙の編集者、いまは威厳をいささかも失わず、宿の酒場を切り回している。私には酒も葉巻もいくつか振る舞われ、ケルマーの面目躍如たる場面をじっくり見る絶好の機会を得た。愛想よく、輝くような笑みを浮かべ、なかなか乗り気にならないコーウィンに、船のやかんを一個、じりじりと押しつけようとしていた。"
    "translation_status": "reviewed"
  - "id": "sv-first-010"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Corwin, plainly aghast, resisted gallantly, and for that bout victory crowned his arms."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 139
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[91]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-010"
    "translation_ja": "コーウィンは目に見えてぎょっとしたが、勇敢に抵抗し、この一戦では勝利の冠が彼のものになった。"
    "translation_status": "reviewed"
  - "id": "sv-first-011"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last we set forth for Silverado on foot. Kelmar and his jolly Jew girls were full of the sentiment of Sunday outings, breathed geniality and vagueness, and suffered a little vile boy from the hotel to lead them here and there about the woods. For three people all so old, so bulky in body, and belonging to a race so venerable, they could not but surprise us by their extreme and almost imbecile youthfulness of spirit. They were only going to stay ten minutes at the Toll House; had they not twenty long miles of road before them on the other side? Stay to dinner? Not they! Put up the horses? Never. Let us attach them to the verandah by a wisp of straw rope, such as would not have held a person’s hat on that blustering day. And with all these protestations of hurry, they proved irresponsible like children. Kelmar himself, shrewd old Russian Jew, with a smirk that seemed just to have concluded a bargain to its satisfaction, intrusted himself and us devoutly to that boy. Yet the boy was patently fallacious; and for that matter a most unsympathetic urchin, raised apparently on gingerbread. He was bent on his own pleasure, nothing else; and Kelmar followed him to his ruin, with the same shrewd smirk. If the boy said there was “a hole there in the hill”—a hole, pure and simple, neither more nor less—Kelmar and his Jew girls would follow him a hundred yards to look complacently down that hole. For two hours we looked for houses; and for two hours they followed us, smelling trees, picking flowers, foisting false botany on the unwary. Had we taken five, with that vile lad to head them off on idle divagations, for five they would have smiled and stumbled through the woods."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 140
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[92]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-011"
    "translation_ja": "やっとシルヴェラードへ向かって徒歩で出発した。ケルマーと陽気なユダヤ人の娘たちは、日曜の行楽気分でいっぱいだった。上機嫌で何ごともはっきり決めず、宿のたちの悪い小僧に森のあちこちを引き回されるままだった。これほど年を取り、体格がよく、由緒ある民族の三人が、小児じみて見えるほど極端に気が若いのには驚かずにはいられない。宿には十分しかいないのだという。向こう側にも、まだたっぷり二十マイル残っているのだから。昼食まで残るかって？　とんでもない！　馬を厩に入れるかって？　まさか。藁縄をひとひねり、ヴェランダにつないでおこう。こんな強風の日には帽子一つ留めておけないような縄である。それほど急ぐと言い張っていながら、いざとなると子供のように無頓着だった。抜け目のないロシア出の老ユダヤ人ケルマー自身、満足のいく商談を今しがた決めたような薄笑いを浮かべ、信心深いといってよいほどの信頼をあの小僧に寄せて、自分ばかりか私たちまで任せてしまった。ところが小僧が当てにならないのは見え透いていた。だいたいどうにも愛想のよくない子で、多分ジンジャーブレッドばかり食って育ったのだろう。自分が面白ければあとはどうでもよく、ケルマーは例の抜け目なさそうな薄笑いのまま、行き着くところまでついていく。小僧が「あそこの山に穴がある」と言えば、それはただの穴、それ以上でも以下でもないのだが、ケルマーとご婦人たちは百ヤードも歩いて、満ち足りた顔で穴をのぞくだろう。私たちは二時間、家を捜した。その二時間を通じて一行はついてきて、木の匂いをかぎ、花を摘み、うかつな相手にでたらめな植物の知識を売りつけていた。もし私たちが五時間かけていたら、あのひどい小僧が先頭でよけいな寄り道を考えつくかぎり、五時間であろうと森をよろめきながら、笑って歩き通したろう。"
    "translation_status": "reviewed"
  - "id": "sv-first-012"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "However, we came forth at length, and as by accident, upon a lawn, sparse planted like an orchard, but with forest instead of fruit trees. That was the site of Silverado mining town. A piece of ground was levelled up, where Kelmar’s store had been; and facing that we saw Rufe Hanson’s house, still bearing on its front the legend Silverado Hotel. Not another sign of habitation. Silverado town had all been carted from the scene; one of the houses was now the school-house far down the road; one was gone here, one there, but all were gone away."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 141
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[93]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-012"
    "translation_ja": "それでもようやく、まったく偶然のように、まばらに木を植えた芝地へ出た。果樹園のようだったが、植わっているのは果樹ではなく森の木だ。そこがシルヴェラード鉱山町の跡だった。土を盛って平らにした場所に、ケルマーの店があった。向かいにはルーフ・ハンソンの家があり、正面にはいまも「シルヴェラード・ホテル」の文字が残っていた。ほかに人の住む痕跡は何ひとつなかった。シルヴェラードの町は丸ごと運び出されてしまったのだ。一軒はずっと街道を下ったところの学校になり、一軒はこっちへ、もう一軒はあっちへと、ともかく全部なくなっていた。"
    "translation_status": "reviewed"
  - "id": "sv-first-013"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was now a sylvan solitude, and the silence was unbroken but by the great, vague voice of the wind. Some days before our visit, a grizzly bear had been sporting round the Hansons’ chicken-house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 142
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[94]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-013"
    "translation_ja": "いまや人けのない森となり、大きな、どこからとも知れぬ風の声が、静けさを破るばかりだった。私たちが訪ねる数日前には、ハンソン家の鶏小屋のまわりを、ハイイログマが遊びまわっていたという。"
    "translation_status": "reviewed"
  - "id": "sv-first-014"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mrs. Hanson was at home alone, we found. Rufe had been out after a “bar,” had risen late, and was now gone, it did not clearly appear whither. Perhaps he had had wind of Kelmar’s coming, and was now ensconced among the underwood, or watching us from the shoulder of the mountain. We, hearing there were no houses to be had, were for immediately giving up all hopes of Silverado. But this, somehow, was not to Kelmar’s fancy. He first proposed that we should “camp someveres around, ain’t it?” waving his hand cheerily as though to weave a spell; and when that was firmly rejected, he decided that we must take up house with the Hansons. Mrs. Hanson had been, from the first, flustered, subdued, and a little pale; but from this proposition she recoiled with haggard indignation. So did we, who would have preferred, in a manner of speaking, death. But Kelmar was not to be put by. He edged Mrs. Hanson into a corner, where for a long time he threatened her with his forefinger, like a character in Dickens; and the poor woman, driven to her entrenchments, at last remembered with a shriek that there were still some houses at the tunnel."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 143
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[95]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-014"
    "translation_ja": "ハンソン夫人は一人で留守番をしていた。ルーフは「クマ公」を追いに出かけていたそうで、今朝は起きるのも遅く、もうどこかへ出ていったという。どこかはどうもはっきりしない。ケルマーが来ると聞きつけ、今ごろは下生えに身を隠し、あるいは山の肩からこっちを見ているのかもしれない。手に入る家はないと聞いた私たちは、その場でシルヴェラードへの望みをすべて捨てるつもりだった。だがケルマーはどういうわけだか気に入らない。まず「そこらへんで野営すりゃいい、そうじゃないかね？」と、魔法でもかけるように陽気に手を振った。それをきっぱり断られると、今度は私たちがハンソン家に同居すればよいと一人で決めた。ハンソン夫人は初めからおろおろし、遠慮がちで、やや顔色が悪かったが、この申し出にはやつれた顔に憤りを浮かべて後ずさった。こちらも同じだ。言ってみれば、死んだほうがましだった。ところがケルマーは引き下がらない。ハンソン夫人を隅のほうへじりじり追い込むと、ディケンズの小説の人物さながらに、人さし指を突きつけて長々と迫った。とことん追いつめられた気の毒な夫人は、ようやく思い出して叫んだ。坑道の所なら、まだ家が残っている！"
    "translation_status": "reviewed"
  - "id": "sv-first-015"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thither we went; the Jews, who should already have been miles into Lake County, still cheerily accompanying us. For about a furlong we followed a good road alone, the hillside through the forest, until suddenly that road widened out and came abruptly to an end. A canyon, woody below, red, rocky, and naked overhead, was here walled across by a dump of rolling stones, dangerously steep, and from twenty to thirty feet in height. A rusty iron chute on wooden legs came flying, like a monstrous gargoyle, across the parapet. It was down this that they poured the precious ore; and below here the carts stood to wait their lading, and carry it mill-ward down the mountain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 144
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[96]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-015"
    "translation_ja": "そこで坑道へ向かった。もうとうにレイク郡へ何マイルも入っているはずのユダヤ人たちは、相変わらず陽気についてきた。一ハロンほどはちゃんとした道を森の中の山腹に沿ってたどったが、急に道幅が広がったかと思うと、そこでぷっつり途切れた。下には木が茂り、上には赤い岩肌が裸で現れた峡谷を、今度は転がり落ちそうな捨石の山が壁となって塞いでいた。二十ないし三十フィートほどの高さで、危ういほど切り立っている。木の脚に載せた赤錆びた鉄の樋が、怪物のガーゴイルのように石壁の上から突き出ていた。貴重な鉱石はこれを通して落としたのだ。その下には荷車が待ちかまえ、鉱石を受けて山の下の選鉱場まで運んだ。"
    "translation_status": "reviewed"
  - "id": "sv-first-016"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole canyon was so entirely blocked, as if by some rude guerilla fortification, that we could only mount by lengths of wooden ladder, fixed in the hillside. These led us round the farther corner of the dump; and when they were at an end, we still persevered over loose rubble and wading deep in poison oak, till we struck a triangular platform, filling up the whole glen, and shut in on either hand by bold projections of the mountain. Only in front the place was open like the proscenium of a theatre, and we looked forth into a great realm of air, and down upon treetops and hilltops, and far and near on wild and varied country. The place still stood as on the day it was deserted: a line of iron rails with a bifurcation; a truck in working order; a world of lumber, old wood, old iron; a blacksmith’s forge on one side, half buried in the leaves of dwarf madronas; and on the other, an old brown wooden house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 145
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[97]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-016"
    "translation_ja": "峡谷全体が、山賊の急ごしらえの砦のようにすっかり塞がれていたので、登るには山腹に取りつけた木梯子を何本か使うしかなかった。捨石の山の向こう側の角を回って梯子が尽きると、なおも足もとのがれきを乗り越え、かぶれの木の茂みに分け入った。やがて、谷をすっかり埋める三角形の平場に出た。両側は山から力強く突き出した岩で囲まれている。正面だけは劇場の舞台口のように開け、大きく広がる空の下、梢や丘の頂を見下ろし、起伏のさまざまな荒野を遠く近く眺めた。その場所は人が立ち去った日そのままだった。二股に分かれる鉄のレール一筋、まだ動くトロッコ、そこらじゅうに材木や古い木切れや古鉄、片側には背の低いマドロナの葉に半ば埋まった鍛冶場、反対側には茶色い古い木造の家があった。"
    "translation_status": "reviewed"
  - "id": "sv-first-017"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Fanny and I dashed at the house. It consisted of three rooms, and was so plastered against the hill, that one room was right atop of another, that the upper floor was more than twice as large as the lower, and that all three apartments must be entered from a different side and level. Not a window-sash remained."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 146
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[98]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-017"
    "translation_ja": "ファニーと私は家へ駆け寄った。三部屋あって、山に貼りつけたような造りなので、一部屋の真上にもう一部屋が乗り、上の部屋は下の二倍以上ある。しかも三部屋とも、入る側も入口の高さも一つずつ違う。窓枠は一つも残っていなかった。"
    "translation_status": "reviewed"
  - "id": "sv-first-018"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The door of the lower room was smashed, and one panel hung in splinters. We entered that, and found a fair amount of rubbish: sand and gravel that had been sifted in there by the mountain winds; straw, sticks, and stones; a table, a barrel; a plate-rack on the wall; two home-made bootjacks, signs of miners and their boots; and a pair of papers pinned on the boarding, headed respectively “Funnel No. 1,” and “Funnel No. 2,” but with the tails torn away. The window, sashless of course, was choked with the green and sweetly smelling foliage of a bay; and through a chink in the floor, a spray of poison oak had shot up and was handsomely prospering in the interior. It was my first care to cut away that poison oak, Fanny standing by at a respectful distance. That was our first improvement by which we took possession."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 147
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[99]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-018"
    "translation_ja": "下の部屋の戸は壊れ、一枚の鏡板がささくれだってぶら下がっていた。入ってみると、がらくたがかなりあった。山風がふるいにかけるように運び入れた砂と小石。藁、枝、石、机一つに樽一つ。壁には皿立てがあり、鉱夫とその長靴の名残に、手製の長靴脱ぎが二つあった。板壁に紙が二枚留めてあって、一枚には「漏斗一号」、もう一枚には「漏斗二号」と表題があるが、あとは破り取られていた。窓に枠などもちろんない。そこを芳しい緑の月桂樹の葉が塞いでいた。床の割れ目からはかぶれの木がひと枝伸び、部屋の中ですこぶる元気に育っている。真っ先にしたのは、その枝を切り払うことだった。ファニーは用心して離れて立っていた。これが、私たちがこの家を占有して施した最初の改良である。"
    "translation_status": "reviewed"
  - "id": "sv-first-019"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The room immediately above could only be entered by a plank propped against the threshold, along which the intruder must foot it gingerly, clutching for support to sprays of poison oak, the proper product of the country. Herein was, on either hand, a triple tier of beds, where miners had once lain; and the other gable was pierced by a sashless window and a doorless doorway opening on the air of heaven, five feet above the ground. As for the third room, which entered squarely from the ground level, but higher up the hill and farther up the canyon, it contained only rubbish and the uprights for another triple tier of beds."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 148
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[100]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-019"
    "translation_ja": "真上の部屋に入るには、敷居に立てかけた板を渡るしかない。入り込む者は、当地に似つかわしい産物であるかぶれの木の枝をつかんで体を支えながら、そろそろと進まなくてはならなかった。中に入ると、両側に三段になった寝台があり、かつては鉱夫たちがそこで寝ていた。反対側の妻壁には枠のない窓と戸のない戸口が開き、地面の五フィートも上で外の空に向かっている。三つ目の部屋は、さらに山を上り、さらに谷奥へ入った所で、地面の高さからまともに入れた。だが中にはがらくたと、もう一組の三段寝台の支柱しかなかった。"
    "translation_status": "reviewed"
  - "id": "sv-first-020"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole building was overhung by a bold, lion-like, red rock. Poison oak, sweet bay trees, calcanthus, brush, and chaparral, grew freely but sparsely all about it. In front, in the strong sunshine, the platform lay overstrewn with busy litter, as though the labours of the mine might begin again to-morrow in the morning."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 149
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[101]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-020"
    "translation_ja": "建物の全体にかぶさるように、大胆な姿の、獅子を思わせる赤岩がせり出していた。そのまわりにはかぶれの木、香りのよい月桂樹、クロバナロウバイ、灌木やシャパラルの藪が、のびのびと、だがまばらに生えていた。正面の強い日差しの中、平場には雑然と物が散らばっている。鉱山の仕事が明日の朝にもまた始まりそうだった。"
    "translation_status": "reviewed"
  - "id": "sv-first-021"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Following back into the canyon, among the mass of rotting plant and through the flowering bushes, we came to a great crazy staging, with a wry windless on the top; and clambering up, we could look into an open shaft, leading edgeways down into the bowels of the mountain, trickling with water, and lit by some stray sun-gleams, whence I know not. In that quiet place the still, far-away tinkle of the water-drops was loudly audible. Close by, another shaft led edgeways up into the superincumbent shoulder of the hill. It lay partly open; and sixty or a hundred feet above our head, we could see the strata propped apart by solid wooden wedges, and a pine, half undermined, precariously nodding on the verge. Here also a rugged, horizontal tunnel ran straight into the unsunned bowels of the rock. This secure angle in the mountain’s flank was, even on this wild day, as still as my lady’s chamber. But in the tunnel a cold, wet draught tempestuously blew. Nor have I ever known that place otherwise than cold and windy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 150
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[102]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-021"
    "translation_ja": "坑道側へとさらに谷をたどり、朽ちかけた設備の山の間を、花の咲いた灌木をかき分けて進むと、大きなぐらぐらの足場に出た。上には歪んだ巻き上げ機がある。よじ登ってみると、山のはらわたへ斜めに下る坑道が口を開けていた。水が流れ落ち、どこから来るのかわからぬ日差しが、ところどころに差し込んでいた。その静けさの中では、遠く下のかすかな水滴の音が、かえって大きく聞こえた。すぐそばではまた別の坑が、頭上の山の肩へ向かって斜めに上っていた。一部が露出していて、頭の上六十フィートか百フィートのあたりでは、丈夫な木の楔が岩層の間を押し広げて支えるのが見えた。松が一本、根の下を半ば掘り崩され、危なっかしく縁で揺れていた。さらにここには、ごつごつした水平な坑道が、日の差さない岩の腹へまっすぐ延びていた。山腹のこの隠れた一角は、こんな荒れた日にも貴婦人の寝室のように静かだった。だが坑道の中では、冷たい湿った風が嵐のように吹いていた。あそこが寒くなく、風もないときを、私は一度も知らない。"
    "translation_status": "reviewed"

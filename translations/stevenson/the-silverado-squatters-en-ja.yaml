    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-007"
    "translation_ja": "翌朝もやってきた。今度は一人なので、気前よく自分の話を聞かせてくれた。頭のよさがご自慢だ。学校の先生を知っているかと聞いた。とにかくあの女先生は大したことがない。試してやったんだ、そうさ。問題を出してやった。高さ百フィートの木が一日に一フィートずつ倒れるとしたら、すっかり倒れるまでにどれだけかかるか。先生には解けなかった。「あの人、何もわかっちゃいねえ」と彼の意見だった。友達が回転式拳銃を持って学校を切り回している話もして、大いにくすくす笑った。あの友達は学校で教えられる、本当だ。その間ずっと松脂を噛み、唾を吐く。しばらく下を向いて立っているかと思うと、もじゃもじゃ頭を振り上げ、しゃがれ声で笑い、唾を吐き、新しい話を始める。恨みを持つ男が犬に毒を盛った、とも話した。「人間のすることにしちゃ卑しくねえか、なあ？　どっから見ても男のやるこっちゃねえ。けど借りは返した。あいつの犬にも、どくを盛ってやった」。たどたどしい口ぶりと、がさつで居心地の悪そうな様子が、言うことの愚かさに一段と値打ちを添えた。アーヴィンを知るまでは、二つの言葉の意味をこれほど身にしみてわかってはいなかったと思う。動詞のローフ（ごろごろする）と、名詞のオウフ（のろま）だ。二つ合わせれば彼の肖像ができあがる。だらりとし、もぞもぞと動き、壁に体をこすりつけ、にやつき、これまで見たほかの誰か二人を合わせてもかなわないほど、みんなの邪魔をした。何をしても様にならない。それでも、こちらと同じ人間であること、頭はのろのろと働いて、口の松脂を噛むように存在の問題を噛み返し、自分なりにぼんやりと生を楽しみ、仲間を品定めしていることはわかった。何よりも自分が大好きだった。落ちつかぬ態度とつっかえつっかえの物言いからは思いもよらないが、骨の髄まで自分を愛していて、柵の上の孔雀のように幸せで誇らしげだった。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-008"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "His self-esteem was, indeed, the one joint in his harness. He could be got to work, and even kept at work, by flattery. As long as my wife stood over him, crying out how strong he was, so long exactly he would stick to the matter in hand; and the moment she turned her back, or ceased to praise him, he would stop. His physical strength was wonderful; and to have a woman stand by and admire his achievements, warmed his heart like sunshine. Yet he was as cowardly as he was powerful, and felt no shame in owning to the weakness. Something was once wanted from the crazy platform over the shaft, and he at once refused to venture there—“did not like,” as he said, “foolen’ round them kind o’ places,” and let my wife go instead of him, looking on with a grin. Vanity, where it rules, is usually more heroic: but Irvine steadily approved himself, and expected others to approve him; rather looked down upon my wife, and decidedly expected her to look up to him, on the strength of his superior prudence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 212
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[149]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-008"
    "translation_ja": "まさしく、このうぬぼれが彼を動かせるただ一つの取っ手だった。おだてれば働き出し、働きつづけもした。妻がそばに立ち、なんという力持ちだろうと声を上げるあいだは、そのあいだだけ、手もとの仕事にかじりつく。背を向けるか、褒めるのをやめたとたん、手が止まる。並はずれて力が強く、女の人がそばに立ってその働きに感嘆してくれると、日差しのように心が温まるのだ。それにもかかわらず、力のあるのと同じくらい臆病で、臆病だと認めても少しも恥ずかしくない。一度、斜坑の上のぐらつく足場から何か取ってくる必要があったが、彼は即座に、あそこへ行くのは嫌だと断った。「ああいうとこで、うろちょろすんのは好かねえ」と言い、代わりに妻を行かせ、にやにやと見ていた。虚栄心に支配される人間は、普通ならもっと英雄的になる。ところがアーヴィンは、しっかり自分をよしとして、他人にもよしとしてもらうのが当然だった。私の妻をむしろ見下し、自分のほうが用心深かったという理由で、当然、敬ってもらえるはずだと思っていた。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-009"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Yet the strangest part of the whole matter was perhaps this, that Irvine was as beautiful as a statue. His features were, in themselves, perfect; it was only his cloudy, uncouth, and coarse expression that disfigured them. So much strength residing in so spare a frame was proof sufficient of the accuracy of his shape. He must have been built somewhat after the pattern of Jack Sheppard; but the famous housebreaker, we may be certain, was no lout. It was by the extraordinary powers of his mind no less than by the vigour of his body, that he broke his strong prison with such imperfect implements, turning the very obstacles to service. Irvine, in the same case, would have sat down and spat, and grumbled curses. He had the soul of a fat sheep, but, regarded as an artist’s model, the exterior of a Greek God. It was a cruel thought to persons less favoured in their birth, that this creature, endowed—to use the language of theatres—with extraordinary “means,” should so manage to misemploy them that he looked ugly and almost deformed. It was only by an effort of abstraction, and after many days, that you discovered what he was."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 213
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[150]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-009"
    "translation_ja": "だが何もかも込みでおそらく最も奇妙なのは、このアーヴィンが彫像のように美しかったことだ。顔の造りそのものは申し分なく、曇った、むさくるしい、粗野な表情だけがそれを損ねていた。あれほど細身の体にあれほど力が宿るのが、体の均整が取れている何よりの証拠だった。おそらくジャック・シェパードにいくらか似た造りだったろうが、あの名高い押し入り強盗は、疑いなくのろまではなかった。ろくな道具もなく堅固な牢から脱け出し、障害そのものを役に立てることができたのは、体力ばかりでなく、並外れた頭の働きのおかげだった。同じ目に遭えばアーヴィンはどっかり座って唾を吐き、ぼそぼそ悪態をつくだけだったろう。魂は肥えた羊のものでありながら、画家のモデルとして見た姿はギリシャの神である。生まれつきそこまで恵まれぬ者にとっては、芝居の言葉でいえば並外れた「資質」に恵まれたこの生き物が、それをあれほど上手に使い損ない、醜く、ほとんど不格好にさえ見えるのは残酷なことだった。先入観をひとつひとつ取り払ってようやく、しかも何日も過ぎてはじめて、彼の実際の姿が見えてくる。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-010"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By playing on the oaf’s conceit, and standing closely over him, we got a path made round the corner of the dump to our door, so that we could come and go with decent ease; and he even enjoyed the work, for in that there were boulders to be plucked up bodily, bushes to be uprooted, and other occasions for athletic display: but cutting wood was a different matter. Anybody could cut wood; and, besides, my wife was tired of supervising him, and had other things to attend to. And, in short, days went by, and Irvine came daily, and talked and lounged and spat; but the firewood remained intact as sleepers on the platform or growing trees upon the mountainside. Irvine, as a woodcutter, we could tolerate; but Irvine as a friend of the family, at so much a day, was too bald an imposition, and at length, on the afternoon of the fourth or fifth day of our connection, I explained to him, as clearly as I could, the light in which I had grown to regard his presence. I pointed out to him that I could not continue to give him a salary for spitting on the floor; and this expression, which came after a good many others, at last penetrated his obdurate wits. He rose at once, and said if that was the way he was going to be spoke to, he reckoned he would quit. And, no one interposing, he departed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 214
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[151]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-010"
    "translation_ja": "のろまのうぬぼれにつけこみ、目を離さずについていて、ようやく捨石の角を回って戸口まで来る道を作ってもらった。おかげでようやくまともに出入りできる。彼さえその仕事が気に入った。大石を丸ごと抜き、藪を根こそぎにするなど、腕力を見せびらかす機会があったからだ。だが薪切りは話が別だった。誰にでもできる。妻は監督に疲れていて、ほかにもすることがあった。要するに、何日も経ち、アーヴィンは毎日来て、話をし、ごろごろし、唾を吐くのだが、薪は相変わらず平場の枕木か、山腹に生えた立木のままだった。薪切りとしてのアーヴィンなら我慢できた。だが家族の友人として、一日いくらで来られては、あまりにあからさまな押し売りだった。とうとう雇ってから四日目か五日目の午後、彼がそこに来ることをどう考えるようになったか、できるだけはっきり説明した。床に唾を吐くのに給料を払い続けるわけにはいかない、と言った。あれこれ言ったあとのこの一句が、とうとう頑固な頭の中まで届いた。彼はすぐ立ち、そんな言い方をされるなら辞めちまおうかと思う、と言った。誰も止めないので出ていった。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-011"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So far, so good. But we had no firewood. The next afternoon, I strolled down to Rufe’s and consulted him on the subject. It was a very droll interview, in the large, bare north room of the Silverado Hotel, Mrs. Hanson’s patchwork on a frame, and Rufe, and his wife, and I, and the oaf himself, all more or less embarrassed. Rufe announced there was nobody in the neighbourhood but Irvine who could do a day’s work for anybody. Irvine, thereupon, refused to have any more to do with my service; he “wouldn’t work no more for a man as had spoke to him’s I had done.” I found myself on the point of the last humiliation—driven to beseech the creature whom I had just dismissed with insult: but I took the high hand in despair, said there must be no talk of Irvine coming back unless matters were to be differently managed; that I would rather chop firewood for myself than be fooled; and, in short, the Hansons being eager for the lad’s hire, I so imposed upon them with merely affected resolution, that they ended by begging me to re-employ him again, on a solemn promise that he should be more industrious. The promise, I am bound to say, was kept. We soon had a fine pile of firewood at our door; and if Caliban gave me the cold shoulder and spared me his conversation, I thought none the worse of him for that, nor did I find my days much longer for the deprivation."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 215
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[152]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-011"
    "translation_ja": "そこまではいい。だが薪がない。翌日の午後、ルーフの家までぶらぶら下り、相談した。シルヴェラード・ホテルの広くがらんとした北の部屋での、なんともおかしな会見だった。枠にはハンソン夫人の継ぎ布が張ってあり、ルーフと妻と私とのろま本人がみな、いくらか気まずい思いで座っている。この近所で誰かのために一日働ける者はアーヴィンのほかにいない、とルーフが切り出した。するとアーヴィンは、もう私のためには一切何もしないと言う。「あんな口の利き方をしたやつのためなんか、もう働かねえ」。侮辱して首にしたばかりのやつに頼み込まなくてはならない。私は最も屈辱的な目に遭う寸前だった。だがやけになり、あくまで高飛車に出た。やり方が変わらないなら、アーヴィンに戻ってもらう話はそもそもなしだ。いいようにあしらわれるぐらいなら、自分で薪を割ったほうがましだ。要するにハンソン夫妻がこの若者を雇ってほしくてたまらなかったので、気丈なふりをしただけでうまく押し切れた。先方が、もっと精を出して働くと堅く約束したうえで、もう一度雇ってほしいと頼むところまでいった。その約束は守られた、と言っておかねばならない。まもなく戸口に見事な薪の山ができた。キャリバンが私を冷たくあしらい、一切話しかけなくなっても、そのせいで彼を悪く思いはしなかった。失ったおしゃべりの分、日々がいくらか長く感じられたということもない。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-012"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The leading spirit of the family was, I am inclined to fancy, Mrs. Hanson. Her social brilliancy somewhat dazzled the others, and she had more of the small change of sense. It was she who faced Kelmar, for instance; and perhaps, if she had been alone, Kelmar would have had no rule within her doors. Rufe, to be sure, had a fine, sober, open-air attitude of mind, seeing the world without exaggeration—perhaps, we may even say, without enough; for he lacked, along with the others, that commercial idealism which puts so high a value on time and money. Sanity itself is a kind of convention. Perhaps Rufe was wrong; but, looking on life plainly, he was unable to perceive that croquet or poker were in any way less important than, for instance, mending his waggon. Even his own profession, hunting, was dear to him mainly as a sort of play; even that he would have neglected, had it not appealed to his imagination. His hunting-suit, for instance, had cost I should be afraid to say how many bucks—the currency in which he paid his way: it was all befringed, after the Indian fashion, and it was dear to his heart. The pictorial side of his daily business was never forgotten. He was even anxious to stand for his picture in those buckskin hunting clothes; and I remember how he once warmed almost into enthusiasm, his dark blue eyes growing perceptibly larger, as he planned the composition in which he should appear, “with the horns of some real big bucks, and dogs, and a camp on a crick” (creek, stream)."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 216
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[153]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-012"
    "translation_ja": "一家を動かしているのは、どうやらハンソン夫人だった。交際の華やかさがほかの者をいくらかまぶしがらせ、日々の小さなことをさばく分別も彼女のほうがあった。たとえばケルマーと渡り合ったのは彼女であって、もしかして彼女一人なら、ケルマーもあの家では何ひとつ思うようにならなかったろう。確かにルーフには、冷静で澄んだ戸外の精神があった。ものを大げさに見ない。もっといえば、大げさに見なさすぎた。家のほかの者と同じく、時間と金にそれほど高い値をつける商売人の理想主義がなかったからだ。何を正気と呼ぶかさえ、一つのしきたりである。ひょっとするとルーフは間違っていたかもしれない。だが暮らしをありのままに見渡して、クロッケーやポーカーが、たとえば荷馬車を修理するよりもどういう意味で大事でないのか、彼にはわからなかった。自分の仕事の狩りでさえ、主に遊びの一種だから好きなのだ。想像を刺激しなかったら、それさえ放っておいたろう。たとえば狩りの服に雄鹿何頭分かかったかは口にするのも恐ろしい。彼が支払いに使う通貨は雄鹿なのだ。先住民の仕立てにならった房飾りが全面についていて、ひどくお気に入りだった。ふだんの仕事の絵になる面には、決して無関心ではなかった。その鹿革の狩猟服を着て、絵のモデルになりたがってさえいた。一度は構図を考えて、熱狂する寸前まで身を乗り出し、濃紺の目が明らかに大きくなったのを覚えている。「でっけえ雄鹿の角と、犬どもと、クリックのほとりの野営にな」。クリックとはクリーク、小川のことだ。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-013"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was no trace in Irvine of this woodland poetry. He did not care for hunting, nor yet for buckskin suits. He had never observed scenery. The world, as it appeared to him, was almost obliterated by his own great grinning figure in the foreground: Caliban Malvolio. And it seems to me as if, in the persons of these brothers-in-law, we had the two sides of rusticity fairly well represented: the hunter living really in nature; the clodhopper living merely out of society: the one bent up in every corporal agent to capacity in one pursuit, doing at least one thing keenly and thoughtfully, and thoroughly alive to all that touches it; the other in the inert and bestial state, walking in a faint dream, and taking so dim an impression of the myriad sides of life that he is truly conscious of nothing but himself. It is only in the fastnesses of nature, forests, mountains, and the back of man’s beyond, that a creature endowed with five senses can grow up into the perfection of this crass and earthy vanity. In towns or the busier country sides, he is roughly reminded of other men’s existence; and if he learns no more, he learns at least to fear contempt. But Irvine had come scatheless through life, conscious only of himself, of his great strength and intelligence; and in the silence of the universe, to which he did not listen, dwelling with delight on the sound of his own thoughts."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 217
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[154]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-013"
    "translation_ja": "アーヴィンにはこの森の詩情のかけらもなかった。狩りにも鹿革の服にも無関心だ。風景にじっくり目を向けたことがない。彼の見る世界はすぐ目の前に、自分の巨体がにやにや笑って立っているため、ほとんど隠れてしまう。キャリバンであり、マルヴォーリオである。この義兄弟を並べると、田舎暮らしの二つの面がかなりよく表れていると思う。狩人は本当に自然の中に暮らし、無骨な男はただ社会の外で暮らす。前者は一つの仕事に五体の力を目いっぱい注ぎ、少なくとも一つのことを熱心に、よく考えて行い、それに少しでも関わるものには生き生きと反応する。後者は活気もない獣じみた状態にあり、薄い夢の中を歩いて、人生の無数の側面からあまりにおぼろげな印象しか受けないので、本当に意識にのぼるものは自分しかない。自然の奥深く、森や山や辺鄙のまた奥でこそ、五感を備えた生き物が、これほど粗野で土臭いうぬぼれの完成形まで育つことができる。町やもっとにぎやかな田舎では、他人がいると手荒く思い知らされ、ほかに何も身につかなくても、せめて侮られることを恐れるようにはなる。ところがアーヴィンは何の痛手もなく生きてきて、意識するものは自分と、自分の並外れた力と知恵だけであり、その気配に少しも耳を傾けないまま、宇宙の沈黙の中で、自分の思いの音にうっとり浸っている。"
    "translation_status": "reviewed"

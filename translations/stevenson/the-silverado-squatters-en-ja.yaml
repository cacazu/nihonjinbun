    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-israel-001"
    "translation_ja": "第二部　イスラエルの子らとともに"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-001"
    "section_id": "kelmar"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER I.—TO INTRODUCE MR. KELMAR"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 120
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/h3[5]"
        "anchor": "page59"
        "printed_page": "59"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-001"
    "translation_ja": "第一章　ケルマー氏を紹介する"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-002"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One thing in this new country very particularly strikes a stranger, and that is the number of antiquities. Already there have been many cycles of population succeeding each other, and passing away and leaving behind them relics. These, standing on into changed times, strike the imagination as forcibly as any pyramid or feudal tower. The towns, like the vineyards, are experimentally founded: they grow great and prosper by passing occasions; and when the lode comes to an end, and the miners move elsewhere, the town remains behind them, like Palmyra in the desert. I suppose there are, in no country in the world, so many deserted towns as here in California."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 121
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[74]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-002"
    "translation_ja": "この新しい国によそから来ると、とりわけ意外なのは、昔の遺物が実に多いことだ。もう幾度も人が入ってきては入れ替わり、立ち去って跡を残していった。世の中が変わってもなお立っているそれらの跡は、ピラミッドや封建領主の塔にも劣らず想像をかき立てる。町も葡萄畑と同じで、うまくいくかどうか、まず試みに作られる。一時の好機につけこんで大きくなり、栄える。鉱脈が尽きて鉱夫がよそへ移れば、町だけが、砂漠のパルミラのように置き去りになる。カリフォルニアほど廃れた町の多い国は、世界にもほかにあるまい。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-003"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole neighbourhood of Mount Saint Helena, now so quiet and sylvan, was once alive with mining camps and villages. Here there would be two thousand souls under canvas; there one thousand or fifteen hundred ensconced, as if for ever, in a town of comfortable houses. But the luck had failed, the mines petered out; and the army of miners had departed, and left this quarter of the world to the rattlesnakes and deer and grizzlies, and to the slower but steadier advance of husbandry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 122
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[75]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-003"
    "translation_ja": "セント・ヘレナ山の一帯は今でこそ静かで森深いが、かつては鉱山の野営地や村でにぎわっていた。ここには二千人が天幕に寝起きし、あそこには千人か千五百人が住みよい家の並ぶ町に、まるで一生いるつもりで落ちついていた。だが運は尽き、鉱山はしだいに採れなくなった。鉱夫の大群は去っていき、この一角をガラガラヘビや鹿やハイイログマに明け渡した。そして、それよりゆっくりだが着実に広がっていく農業の手にも。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-004"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was with an eye on one of these deserted places, Pine Flat, on the Geysers road, that we had come first to Calistoga. There is something singularly enticing in the idea of going, rent-free, into a ready-made house. And to the British merchant, sitting at home at ease, it may appear that, with such a roof over your head and a spring of clear water hard by, the whole problem of the squatter’s existence would be solved. Food, however, has yet to be considered, I will go as far as most people on tinned meats; some of the brightest moments of my life were passed over tinned mulli-gatawney in the cabin of a sixteen-ton schooner, storm-stayed in Portree Bay; but after suitable experiments, I pronounce authoritatively that man cannot live by tins alone. Fresh meat must be had on an occasion. It is true that the great Foss, driving by along the Geysers road, wooden-faced, but glorified with legend, might have been induced to bring us meat, but the great Foss could hardly bring us milk. To take a cow would have involved taking a field of grass and a milkmaid; after which it would have been hardly worth while to pause, and we might have added to our colony a flock of sheep and an experienced butcher."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 123
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[76]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-004"
    "translation_ja": "私たちが初めにカリストガに来たのは、そうした廃村の一つ、ガイザーズ街道沿いのパイン・フラットに目をつけていたからだ。出来合いの家へ家賃も払わず入り込むというのは、なんとも人をそそる考えである。本国でのんびり座っているイギリスの商人には、頭上にそんな屋根があって、すぐそばに澄んだ水の泉が湧いていれば、無断で住みつくものの暮らしはそれでなんとかなると思えるかもしれない。ところが食べ物のことが残っている。缶詰についてなら、たいていの人に負けぬほど目がない。十六トンのスクーナーが嵐のためポートリー湾から出られず、その船室で缶詰のマリガトーニ・スープにありついたときなど、私の一生でも指折りの晴れやかなひとときだった。それでもしかるべき実験を重ねた結果、私は断言できる。人は缶詰のみにて生くるにあらず。たまには新鮮な肉が要る。ガイザーズ街道を通る偉大なフォスは、木で彫ったような無表情ながら伝説に包まれた男で、頼めば肉を運んでくれたかもしれない。だが偉大なフォスも牛乳はまず運べまい。雌牛を連れていけば牧草地と乳しぼりの娘まで必要になる。そこまで来て手を止めるのもつまらない。いっそ羊の群れと腕のよい肉屋まで、この入植地に加えられただろう。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-005"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is really very disheartening how we depend on other people in this life. “Mihi est propositum,” as you may see by the motto, “id quod regibus;” and behold it cannot be carried out, unless I find a neighbour rolling in cattle."
    "source_languages":
      - "en"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 124
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[77]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-005"
    "translation_ja": "この世でいかに他人を頼りに生きているか、考えると本当に気が重い。「ミヒ・エスト・プロポシトゥム」、巻頭の銘にあるように、「イド・クォド・レギブス」。私が志すのは王たちの志と同じなのだ。それがどうだろう。牛をあり余るほど飼う隣人を見つけないことには、その志も果たせない。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-006"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, my principal adviser in this matter was one whom I will call Kelmar. That was not what he called himself, but as soon as I set eyes on him, I knew it was or ought to be his name; I am sure it will be his name among the angels. Kelmar was the store-keeper, a Russian Jew, good-natured, in a very thriving way of business, and, on equal terms, one of the most serviceable of men. He also had something of the expression of a Scotch country elder, who, by some peculiarity, should chance to be a Hebrew. He had a projecting under lip, with which he continually smiled, or rather smirked. Mrs. Kelmar was a singularly kind woman; and the oldest son had quite a dark and romantic bearing, and might be heard on summer evenings playing sentimental airs on the violin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 125
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[78]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-006"
    "translation_ja": "この件で一番よく相談に乗ってくれた男を、ケルマーと呼ぶことにする。本人がそう名乗ったのではない。だが顔を見たとたん、あれはケルマーか、そうでなければケルマーと名乗るべきだとわかった。天使のあいだではきっとそれが彼の名だ。ケルマーは雑貨店を営むロシア出身のユダヤ人で、気立てがよく、店は繁盛していた。対等につきあうかぎり、彼ほど頼りになる男もいなかった。それに、スコットランドの田舎の教会の長老が、何かの因縁でたまたまユダヤ人に生まれたとすれば、こんな顔をするかとも思われた。下唇が突き出していて、絶えず笑みを浮かべている。いや、にやにやしていると言うほうがよい。ケルマー夫人はこのうえなく親切な人だった。長男には暗い目をしたロマンチックな風情があり、夏の夕べにはヴァイオリンで感傷的な曲を弾くのが聞こえてきた。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-007"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had no idea, at the time I made his acquaintance, what an important person Kelmar was. But the Jew store-keepers of California, profiting at once by the needs and habits of the people, have made themselves in too many cases the tyrants of the rural population. Credit is offered, is pressed on the new customer, and when once he is beyond his depth, the tune changes, and he is from thenceforth a white slave. I believe, even from the little I saw, that Kelmar, if he choose to put on the screw, could send half the settlers packing in a radius of seven or eight miles round Calistoga. These are continually paying him, but are never suffered to get out of debt. He palms dull goods upon them, for they dare not refuse to buy; he goes and dines with them when he is on an outing, and no man is loudlier welcomed; he is their family friend, the director of their business, and, to a degree elsewhere unknown in modern days, their king."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 126
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[79]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-007"
    "translation_ja": "知り合ったとき、ケルマーがどれほど力のある人物か、見当もつかなかった。だがカリフォルニアのユダヤ人雑貨商は、人々の必要と習慣の両方につけこんで、あまりに多くの場合、農村の人々の暴君となっている。新しい客が来れば掛け売りを持ちかけ、押しつけるほど熱心に勧める。ひとたび手に負えない借金を抱えると話は変わり、その日から客は「白人の奴隷」だ。私が見たわずかなところからしても、ケルマーが締めつけようと思えば、カリストガから半径七、八マイルの入植者の半分は荷物をまとめて出ていく羽目になると思う。彼らは絶えず金を払っているのに、借金から抜け出すことだけは許してもらえない。ケルマーは売れ残りの商品を彼らに押しつける。買うのをよす勇気が彼らにはない。行楽のついでに寄って食事をすることもあり、彼ほど盛大に迎えられる人はいない。家族ぐるみの友人であり、生計の手綱を握る者であり、今の世ではよそに見られないほどの意味で彼らの王なのだ。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-008"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For some reason, Kelmar always shook his head at the mention of Pine Flat, and for some days I thought he disapproved of the whole scheme and was proportionately sad. One fine morning, however, he met me, wreathed in smiles. He had found the very place for me—Silverado, another old mining town, right up the mountain. Rufe Hanson, the hunter, could take care of us—fine people the Hansons; we should be close to the Toll House, where the Lakeport stage called daily; it was the best place for my health, besides. Rufe had been consumptive, and was now quite a strong man, ain’t it? In short, the place and all its accompaniments seemed made for us on purpose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 127
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[80]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-008"
    "translation_ja": "どういうわけか、パイン・フラットの名を出すと、ケルマーはきまって首を横に振った。私は何日か、この計画全部をお気に召さないのだと思い、そのぶん気が沈んだ。ところがある晴れた朝、満面の笑みで会いにきた。私におあつらえ向きの場所を見つけたという。山をずっと上ったところにあるもう一つの古い鉱山町、シルヴェラードだ。猟師のルーフ・ハンソンが私たちの世話をしてくれる。ハンソン一家はいい人たちだ。レイクポート行きの駅馬車が毎日停まる料金所にも近い。そのうえ、私の体にはこれ以上のところはない。ルーフは肺病にかかったことがあるが、今じゃすっかり丈夫な男になった、そうじゃないかね？　要するに、所もまわりの事情も、私たちのために特別にあつらえたようだった。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-009"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He took me to his back door, whence, as from every point of Calistoga, Mount Saint Helena could be seen towering in the air. There, in the nick, just where the eastern foothills joined the mountain, and she herself began to rise above the zone of forest—there was Silverado. The name had already pleased me; the high station pleased me still more. I began to inquire with some eagerness. It was but a little while ago that Silverado was a great place. The mine—a silver mine, of course—had promised great things. There was quite a lively population, with several hotels and boarding-houses; and Kelmar himself had opened a branch store, and done extremely well—“Ain’t it?” he said, appealing to his wife. And she said, “Yes; extremely well.” Now there was no one living in the town but Rufe the hunter; and once more I heard Rufe’s praises by the yard, and this time sung in chorus."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 128
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[81]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-009"
    "translation_ja": "裏口まで案内してくれた。カリストガのどこからでも見えるように、そこからもセント・ヘレナ山が空高くそびえるのが見えた。東の麓の丘が山とつながり、山腹が森の帯を抜けてせり上がる、その切れ込みにシルヴェラードがあった。名からしてもう気に入っていたが、あれほど高い所にあるのはなお気に入った。私はいくぶん熱を込めていろいろ尋ね始めた。シルヴェラードが繁盛していたのはついこの間のことだ。鉱山は、もちろん銀山だが、たいそう有望だった。人もかなりいて活気があり、ホテルや下宿屋も何軒かあった。ケルマーも支店を出して、ずいぶん儲けたという。「そうだろう？」と奥さんに水を向ける。「ええ、とてもよく売れたわ」と奥さんが言った。今では町に住むのは猟師のルーフただ一人。また延々とルーフを褒める言葉を聞くことになった。今度は夫婦の合唱である。"
    "translation_status": "reviewed"
  - "id": "sv-kelmar-010"
    "section_id": "kelmar"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I could not help perceiving at the time that there was something underneath; that no unmixed desire to have us comfortably settled had inspired the Kelmars with this flow of words. But I was impatient to be gone, to be about my kingly project; and when we were offered seats in Kelmar’s waggon, I accepted on the spot. The plan of their next Sunday’s outing took them, by good fortune, over the border into Lake County. They would carry us so far, drop us at the Toll House, present us to the Hansons, and call for us again on Monday morning early."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 129
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[82]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-kelmar-010"
    "translation_ja": "そのときすでに、裏に何かあることは見て取れた。ケルマー夫婦がこうも滔々と語ったのは、何もただ私たちに気持ちよく落ちついてほしいと願ったからばかりではない。だが私は早く出かけて、あの王様めいた計画に取りかかりたくてたまらなかった。ケルマーの馬車に乗らないかと誘われると、その場で承知した。幸い、次の日曜の行楽では郡境を越えてレイク郡へ行くつもりだという。私たちを車に乗せていって料金所で降ろし、ハンソン家に引き合わせ、月曜の朝早くにまた迎えにきてくれることになった。"
    "translation_status": "reviewed"
  - "id": "sv-first-001"
    "section_id": "first"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER II—FIRST IMPRESSIONS OF SILVERADO"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 130
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"

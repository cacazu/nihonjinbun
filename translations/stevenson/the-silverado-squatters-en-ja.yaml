    "translation_ja": "また今度は、もっと踏み鳴らすような拍子で。"
    "translation_status": "reviewed"
  - "id": "sv-return-007"
    "section_id": "return"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Et tout tremble, Irun, Coïmbre,
      Sautander, Almodovar,
      Sitôt qu’on entend le timbre
      Des cymbales do Bivar.”
    "source_languages":
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 161
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[5]/div/p"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-007"
    "translation_ja": |-
      「ことごとく震えあがる、イルンもコインブラも、

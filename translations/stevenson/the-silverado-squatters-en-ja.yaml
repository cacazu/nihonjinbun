  - "id": "sv-return-002"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next morning we were up by half-past five, according to agreement, and it was ten by the clock before our Jew boys returned to pick us up. Kelmar, Mrs. Kelmar, and Abramina, all smiling from ear to ear, and full of tales of the hospitality they had found on the other side. It had not gone unrewarded; for I observed with interest that the ship’s kettles, all but one, had been “placed.” Three Lake County families, at least, endowed for life with a ship’s kettle. Come, this was no misspent Sunday. The absence of the kettles told its own story: our Jews said nothing about them; but, on the other hand, they said many kind and comely things about the people they had met. The two women, in particular, had been charmed out of themselves by the sight of a young girl surrounded by her admirers; all evening, it appeared, they had been triumphing together in the girl’s innocent successes, and to this natural and unselfish joy they gave expression in language that was beautiful by its simplicity and truth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 156
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[107]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-002"
    "translation_ja": "翌朝、約束どおり五時半には起きていた。例のユダヤの若い衆が迎えに戻ったのは、時計が十時を打つころだった。ケルマー、ケルマー夫人、アブラミーナは皆、顔いっぱいに笑みを浮かべ、向こうで受けたもてなしの話をたっぷり持ち帰った。そのもてなしには、ちゃんとお返しがあったわけだ。興味深いことに、船のやかんは一つを残してみな「納まるところへ納まって」いた。少なくともレイク郡の三つの家は、一生ものの船のやかんを手に入れたのである。なるほど、無駄に過ごした日曜ではなかった。やかんがなくなったことが何より雄弁だったが、ユダヤ人の友人たちはやかんには一言も触れなかった。その代わり、会った人たちについて親しみのこもった気持ちのよいことをたくさん話した。とりわけ婦人二人は、一人の少女が言い寄る男たちに囲まれるのを見て、われを忘れるほど魅了された。どうやら夕べじゅう、少女の罪のない手柄を、二人して自分のことのように得意がっていたのだ。その屈託なく、私心のない喜びを、二人は飾り気のなさと偽りのなさが美しい言葉にした。"
    "translation_status": "reviewed"
  - "id": "sv-return-003"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Take them for all in all, few people have done my heart more good; they seemed so thoroughly entitled to happiness, and to enjoy it in so large a measure and so free from after-thought; almost they persuaded me to be a Jew. There was, indeed, a chink of money in their talk. They particularly commanded people who were well to do. “He don’t care—ain’t it?” was their highest word of commendation to an individual fate; and here I seem to grasp the root of their philosophy—it was to be free from care, to be free to make these Sunday wanderings, that they so eagerly pursued after wealth; and all this carefulness was to be careless. The fine, good humour of all three seemed to declare they had attained their end. Yet there was the other side to it; and the recipients of kettles perhaps cared greatly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 157
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[108]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-003"
    "translation_ja": "何から何まで合わせて考えると、彼らほど私の心に良いものを残した人はめったにいない。幸せになる資格がこんなにもあり、その幸せをこれほど豊かに、しかもあとでどうなるかなど考えずに味わっていたので、私はあやうくユダヤ人になりたくなったほどだ。たしかに話のところどころに、金の鳴る音はした。とりわけ豊かな暮らしをしている人を褒めた。「あの人は何の気苦労もない、そうじゃないかね？」というのが、ある人の身の上に送る最大の賛辞だった。ここで私は彼らの哲学の根に触れた気がする。彼らがあれほど熱心に富を追うのは、心配から解放され、日曜ごとにこんなふうに気ままに歩きまわれるためだった。こうまで気を配るのは、何にも気を配らずにいられるためなのだ。三人の晴れやかな機嫌のよさを見れば、それぞれ望みを遂げたとわかるようだった。もっとも裏から見れば話は別で、やかんを渡されたほうは、大いに気をもんでいたかもしれない。"
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "resolved"
        "message_ja": "底本の commanded は同文脈の commendation と別の刊本の commended に従って「褒めた」。"
        "source_span":
          "start": 280
          "end": 302
          "exact": "particularly commanded"
  - "id": "sv-return-004"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "No sooner had they returned, than the scene of yesterday began again. The horses were not even tied with a straw rope this time—it was not worth while; and Kelmar disappeared into the bar, leaving them under a tree on the other side of the road. I had to devote myself. I stood under the shadow of that tree for, I suppose, hard upon an hour, and had not the heart to be angry. Once some one remembered me, and brought me out half a tumblerful of the playful, innocuous American cocktail. I drank it, and lo! veins of living fire ran down my leg; and then a focus of conflagration remained seated in my stomach, not unpleasantly, for quarter of an hour. I love these sweet, fiery pangs, but I will not court them. The bulk of the time I spent in repeating as much French poetry as I could remember to the horses, who seemed to enjoy it hugely. And now it went—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 158
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[109]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-004"
    "translation_ja": "戻ったとたんに、昨日の光景がまた始まった。今度は馬を藁縄でさえつながなかった。そこまでするまでもないと、ケルマーは道の向こうの木の下に馬を置いて、酒場に消えた。私が面倒を見るしかない。その木陰に、たぶん一時間近く立っていたが、腹を立てる気にはなれなかった。一度は誰かが私のことを思い出し、無邪気で罪のないアメリカ風カクテルを、コップに半分ほど持ってきてくれた。飲むとなんと、生きた火の筋が脚を駆け下った。それから十五分ばかり、胃の中に火のもとが居座ったが、悪い感じはしなかった。私はこういう甘く熱い痛みが好きだが、わざわざ求めようとは思わない。時間の大半は、覚えているフランスの詩をありったけ馬に聞かせて過ごした。馬たちはいたく気に入ったようだった。今度は、こんなふうに。"
    "translation_status": "reviewed"

      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-002"
    "translation_ja": "朝はたいてい、光の色が変わって私を呼び起こした。ある時刻になると、板が縮んで離れた西の妻壁の細長い縦の隙間が、まばゆい青の縞となって不意に目に飛び込んでくる。濃いのにこれほど輝かしいとは、その二つがどうして一緒になれるのだろうと、いつも不思議だった。それより早い時刻には、そちらの空はまだ静かな色をしていたが、峡谷を塞ぐ山の肩はすでに日を浴び、金と薔薇色と緑との見事な混じり合いで光っていた。それもまた、光はやわらかながら虹の色で、ぐらつく妻壁の割れ目をともした。眠りが深ければ、あの大胆な青に打たれて目が覚める。浅ければ、それより早い、もっと美しい光の中でわれに返るのだった。"
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "resolved"
        "message_ja": "底本の fight は前文で光の差を述べるため light と読んだ。"
        "source_span":
          "start": 773
          "end": 798
          "exact": "earlier and fairier fight"
  - "id": "sv-fog-003"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One Sunday morning, about five, the first brightness called me. I rose and turned to the east, not for my devotions, but for air. The night had been very still. The little private gale that blew every evening in our canyon, for ten minutes or perhaps a quarter of an hour, had swiftly blown itself out; in the hours that followed not a sigh of wind had shaken the treetops; and our barrack, for all its breaches, was less fresh that morning than of wont. But I had no sooner reached the window than I forgot all else in the sight that met my eyes, and I made but two bounds into my clothes, and down the crazy plank to the platform."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 220
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[156]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-003"
    "translation_ja": "ある日曜の朝、五時ごろ、最初の光が私を呼んだ。起き上がって東を向いた。礼拝のためではない。空気がほしかったのだ。夜はたいそう静かだった。毎晩、私たちの峡谷だけに十分か十五分吹く、あのささやかな嵐もすぐ吹きやみ、そのあとはひと息の風も梢を揺すらず、あちこち破れた私たちの兵舎でも、今朝ばかりはいつもほど空気がさわやかでなかった。だが窓に近づいたとたん、目に入った眺めにほかのことは全部忘れた。二跳びで服を身につけると、ぐらつく板を下って平場へ出た。"
    "translation_status": "reviewed"
  - "id": "sv-fog-004"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sun was still concealed below the opposite hilltops, though it was shining already, not twenty feet above my head, on our own mountain slope. But the scene, beyond a few near features, was entirely changed. Napa valley was gone; gone were all the lower slopes and woody foothills of the range; and in their place, not a thousand feet below me, rolled a great level ocean. It was as though I had gone to bed the night before, safe in a nook of inland mountains, and had awakened in a bay upon the coast. I had seen these inundations from below; at Calistoga I had risen and gone abroad in the early morning, coughing and sneezing, under fathoms on fathoms of gray sea vapour, like a cloudy sky—a dull sight for the artist, and a painful experience for the invalid. But to sit aloft one’s self in the pure air and under the unclouded dome of heaven, and thus look down on the submergence of the valley, was strangely different and even delightful to the eyes. Far away were hilltops like little islands. Nearer, a smoky surf beat about the foot of precipices and poured into all the coves of these rough mountains. The colour of that fog ocean was a thing never to be forgotten. For an instant, among the Hebrides and just about sundown, I have seen something like it on the sea itself. But the white was not so opaline; nor was there, what surprisingly increased the effect, that breathless, crystal stillness over all. Even in its gentlest moods the salt sea travails, moaning among the weeds or lisping on the sand; but that vast fog ocean lay in a trance of silence, nor did the sweet air of the morning tremble with a sound."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 221
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[157]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-004"
    "translation_ja": "太陽はまだ向こうの丘の頂より下に隠れていたが、こちらの山の斜面では、頭の二十フィートも上がらないところにもう日が差していた。手近な所が少し残っているほか、景色はすっかり変わっていた。ナパの谷がない。山並みの低い斜面も、木の茂った麓の丘もない。代わりに千フィートも下らないところを、果てしなく平らな海がうねっていた。ゆうべは内陸の山の片隅に安らかに眠ったのに、朝になれば海ぎわの入江にいたようなものだ。この氾濫を下から見たことはある。カリストガで早朝に起きて出歩くと、曇った空のような灰色の海霧が、頭上に何尋も何尋も積み重なって、咳とくしゃみが止まらなかった。絵を描く人には退屈で、病身にはつらい経験だ。だが自分は雲一つない天蓋の下、澄んだ空気の高みに座り、こうして水没する谷を見下ろすと、まるで違って、目に楽しくさえあった。遠くには小島のような丘の頂が見えた。近くでは煙のような波が断崖の根元に打ち寄せ、この荒々しい山々の入江という入江に流れ込む。あの霧の海の色は忘れようがない。ヘブリディーズの島々で、日没どき、ほんの一瞬、海そのものにいくらか似た色を見たことがある。だが白みはこれほど乳白色にきらめかず、ここでは思いもかけず効果を増した、息をのむような水晶の静けさもなかった。潮の海は凪いだときにも身をよじり、海藻の中でうめき、砂にささやく。だがあの巨大な霧の海は静寂のまどろみのうちに横たわり、朝の甘い空気を震わせる物音は一つもなかった。"
    "translation_status": "reviewed"
  - "id": "sv-fog-005"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I continued to sit upon the dump, I began to observe that this sea was not so level as at first sight it appeared to be. Away in the extreme south, a little hill of fog arose against the sky above the general surface, and as it had already caught the sun, it shone on the horizon like the topsails of some giant ship. There were huge waves, stationary, as it seemed, like waves in a frozen sea; and yet, as I looked again, I was not sure but they were moving after all, with a slow and august advance. And while I was yet doubting, a promontory of the some four or five miles away, conspicuous by a bouquet of tall pines, was in a single instant overtaken and swallowed up. It reappeared in a little, with its pines, but this time as an islet, and only to be swallowed up once more and then for good. This set me looking nearer, and I saw that in every cove along the line of mountains the fog was being piled in higher and higher, as though by some wind that was inaudible to me. I could trace its progress, one pine tree first growing hazy and then disappearing after another; although sometimes there was none of this fore-running haze, but the whole opaque white ocean gave a start and swallowed a piece of mountain at a gulp. It was to flee these poisonous fogs that I had left the seaboard, and climbed so high among the mountains. And now, behold, here came the fog to besiege me in my chosen altitudes, and yet came so beautifully that my first thought was of welcome."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 222
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[158]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-005"
    "translation_ja": "捨石の山に腰かけているうち、この海はひと目に見えたほど平らではないと気づき始めた。はるか南の端では、霧の小山が全体の面より高く、空を背に立ち上がっている。すでに日を受け、地平で巨大な船の上帆のように光っていた。凍った海さながら、じっと止まったと見える大波もあった。それなのに見直すと、結局はゆっくりと、威厳をもって進んでいるのかもしれないと思った。まだ判断がつかないうちに、四、五マイル向こう、背の高い松がひとむらあって目立つ山の張り出しが、ひと息に霧に追いつかれ、呑み込まれた。まもなく松をつけたまま姿を見せたが、今度は小島になっていて、それもまた呑み込まれ、今度こそ見えなくなった。そこで近くに目をやると、山並みの入江ではどこも霧がますます高く積み上がっていく。私の耳には聞こえない風が運んでいるとしか思えない。松が一本ずつ霞み、次々に見えなくなるので、霧の進み方を追うことができた。もっとも、かすみが前触れに立たず、向こうの見えない白い海がいきなり躍り、山の一角をがぶりと呑むこともあった。体に毒なこの霧を逃れるために海辺を離れ、山のこんな高みまで登ってきたのだ。ところが見よ、せっかく選んだこの高みまで霧が攻め囲みに来る。それがまたあまりに美しくて、私はまず歓迎したいと思った。"
    "translation_status": "reviewed"
  - "id": "sv-fog-006"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sun had now gotten much higher, and through all the gaps of the hills it cast long bars of gold across that white ocean. An eagle, or some other very great bird of the mountain, came wheeling over the nearer pine-tops, and hung, poised and something sideways, as if to look abroad on that unwonted desolation, spying, perhaps with terror, for the eyries of her comrades. Then, with a long cry, she disappeared again towards Lake County and the clearer air. At length it seemed to me as if the flood were beginning to subside. The old landmarks, by whose disappearance I had measured its advance, here a crag, there a brave pine tree, now began, in the inverse order, to make their reappearance into daylight. I judged all danger of the fog was over. This was not Noah’s flood; it was but a morning spring, and would now drift out seaward whence it came. So, mightily relieved, and a good deal exhilarated by the sight, I went into the house to light the fire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 223
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[159]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-006"
    "translation_ja": "太陽はそのころにはずっと高くなり、丘の切れ間という切れ間を通して、白い海に長い金の帯を投げていた。鷲か、何か同じくらい大きな山の鳥が近い松の梢の上を旋回し、少し体を傾けて空中に止まった。見慣れない荒涼とした眺めを調べ、おそらく恐る恐る、仲間の巣を探しているようだった。それから長い声をあげ、澄んだ空気のあるレイク郡の方へまた姿を消した。ようやく洪水は引き始めるように見えた。消えた順で進み具合を測った昔からの目印、こちらの岩、あちらのみごとな松が、今度は逆の順で日の下へ戻り始めた。霧の危険はもう過ぎたと判断した。ノアの洪水ではない。朝の大潮にすぎず、来たところへ、海のほうへ流れ去るのだろう。そこで大いに安心し、眺めにすっかり気分も浮き立って、私は火をおこしに家へ入った。"
    "translation_status": "reviewed"
  - "id": "sv-fog-007"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I suppose it was nearly seven when I once more mounted the platform to look abroad. The fog ocean had swelled up enormously since last I saw it; and a few hundred feet below me, in the deep gap where the Toll House stands and the road runs through into Lake County, it had already topped the slope, and was pouring over and down the other side like driving smoke. The wind had climbed along with it; and though I was still in calm air, I could see the trees tossing below me, and their long, strident sighing mounted to me where I stood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 224
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[160]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-007"
    "translation_ja": "また平場に登って外を見渡したのは、七時近かったと思う。霧の海は前に見たときから途方もなく水かさを増していた。数百フィート下、宿が立ち、レイク郡へ道路が通じる深い切れ目では、すでに斜面を越え、吹き流される煙のように向こう側へなだれ落ちていた。風もそれとともに登っていた。私のいるところはまだ凪いでいたが、下の木々が激しく揺れ、長く耳を裂くようなため息が足もとまで上ってくる。"
    "translation_status": "reviewed"
  - "id": "sv-fog-008"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Half an hour later, the fog had surmounted all the ridge on the opposite side of the gap, though a shoulder of the mountain still warded it out of our canyon. Napa valley and its bounding hills were now utterly blotted out. The fog, sunny white in the sunshine, was pouring over into Lake County in a huge, ragged cataract, tossing treetops appearing and disappearing in the spray. The air struck with a little chill, and set me coughing. It smelt strong of the fog, like the smell of a washing-house, but with a shrewd tang of the sea salt."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 225
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[161]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-008"
    "translation_ja": "半時間たつと、霧は切れ目の向こう側の尾根をすっかり乗り越えていた。こちらの峡谷へは、山の肩がまだ防いでくれていた。ナパの谷も、それを縁取る丘も、今やあとかたもなかった。霧は日を受けて白々と輝きながら、縁のほつれた大瀑布となってレイク郡へ流れ落ち、そのしぶきの中から、揺れる梢が顔を出しては消えた。空気はひやりと肌を打ち、私を咳き込ませた。霧の強い匂いがした。洗濯場のようだが、海の塩気がつんと鼻を突く。"
    "translation_status": "reviewed"
  - "id": "sv-fog-009"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Had it not been for two things—the sheltering spur which answered as a dyke, and the great valley on the other side which rapidly engulfed whatever mounted—our own little platform in the canyon must have been already buried a hundred feet in salt and poisonous air. As it was, the interest of the scene entirely occupied our minds. We were set just out of the wind, and but just above the fog; we could listen to the voice of the one as to music on the stage; we could plunge our eyes down into the other, as into some flowing stream from over the parapet of a bridge; thus we looked on upon a strange, impetuous, silent, shifting exhibition of the powers of nature, and saw the familiar landscape changing from moment to moment like figures in a dream."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 226
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[162]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-009"
    "translation_ja": "二つのものがなければ、峡谷にある私たちの小平場は、もう百フィートも塩辛い有毒な空気の底に埋まっていたはずだ。一つは堤の役をする山の支尾根。もう一つは、上ってきたものをたちまち呑み込む向こう側の大きな谷である。おかげで私たちは、眺めのおもしろさに心を奪われているだけでよかった。風をかろうじて避け、霧のすぐ上にいて、片方の声は舞台の音楽さながら耳に入り、もう片方には、橋の欄干越しに流れをのぞくように、まなざしを落とすことができる。こうして私たちは不思議な、荒々しく、しかも音もなく刻々と変わる自然の力の上演を目にし、見慣れた景色が夢の中の人影さながら、そのつど姿を変えるのを眺めていた。"
    "translation_status": "reviewed"
  - "id": "sv-fog-010"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The imagination loves to trifle with what is not. Had this been indeed the deluge, I should have felt more strongly, but the emotion would have been similar in kind. I played with the idea, as the child flees in delighted terror from the creations of his fancy. The look of the thing helped me. And when at last I began to flee up the mountain, it was indeed partly to escape from the raw air that kept me coughing, but it was also part in play."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 227
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[163]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-010"
    "translation_ja": "想像というものは、ありもしないことを相手に遊ぶのが好きだ。これが本物の大洪水なら心はさらに強く動いたろうが、気持ちの中身は似たものだったろう。その考えをもてあそんだ。子供が自分の思い描いた化け物から、うれしくて怖くて逃げるのと同じである。見たところがまたそれを助けた。そしてとうとう山に逃げ上り始めたときは、なるほど私を咳き込ませる生冷たい空気から逃れるためでもあったが、遊び半分でもあった。"
    "translation_status": "reviewed"
  - "id": "sv-fog-011"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I ascended the mountain-side, I came once more to overlook the upper surface of the fog; but it wore a different appearance from what I had beheld at daybreak. For, first, the sun now fell on it from high overhead, and its surface shone and undulated like a great nor’land moor country, sheeted with untrodden morning snow. And next the new level must have been a thousand or fifteen hundred feet higher than the old, so that only five or six points of all the broken country below me, still stood out. Napa valley was now one with Sonoma on the west. On the hither side, only a thin scattered fringe of bluffs was unsubmerged; and through all the gaps the fog was pouring over, like an ocean, into the blue clear sunny country on the east. There it was soon lost; for it fell instantly into the bottom of the valleys, following the water-shed; and the hilltops in that quarter were still clear cut upon the eastern sky."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 228
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[164]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-011"
    "translation_ja": "山腹を登ると、また霧の表を見下ろせるようになったが、夜明けに見たものとは様子が違っていた。第一に、太陽は高みから真っ直ぐ日を落とし、霧の面は、誰も踏んでいない朝の雪をかぶった、北国の広い荒野のように輝き、うねっていた。次に、その水面は前より千ないし千五百フィートは高いはずで、下の起伏の多い地形のうち、まだ頭を出しているのは五か所か六か所だけだった。ナパの谷は西のソノマと一つにつながった。手前で沈んでいないのは、細くところどころ切れた崖の縁だけだった。切れ間という切れ間から霧が大洋のように溢れ、日がさす青く澄んだ東の地方へ落ちていた。そこではじきに見えなくなった。水の流れと同じように、瞬く間に谷底に落ちるので、その方面の丘の頂はまだ東の空にくっきり浮かんでいた。"
    "translation_status": "reviewed"
  - "id": "sv-fog-012"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Through the Toll House gap and over the near ridges on the other side, the deluge was immense. A spray of thin vapour was thrown high above it, rising and falling, and blown into fantastic shapes. The speed of its course was like a mountain torrent. Here and there a few treetops were discovered and then whelmed again; and for one second, the bough of a dead pine beckoned out of the spray like the arm of a drowning man. But still the imagination was dissatisfied, still the ear waited for something more. Had this indeed been water (as it seemed so, to the eye), with what a plunge of reverberating thunder would it have rolled upon its course, disembowelling mountains and deracinating pines! And yet water it was, and sea-water at that—true Pacific billows, only somewhat rarefied, rolling in mid air among the hilltops."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 229
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[165]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-012"
    "translation_ja": "宿のある切れ目から、向こうの近い尾根を越すあたりで、洪水はとてつもなかった。薄い蒸気の飛沫がはるか高く放り上げられ、昇り、落ち、風に吹かれて途方もない形を取った。流れの速さは山の奔流そのものだ。ところどころに梢が何本か現れてはまた沈み、一瞬、枯れ松の枝が、溺れる男の腕のようにしぶきから出て手招きした。だが、想像にはまだ足りず、耳はまだ次の何かを待っていた。これが見たとおり本当に水なら、どんな雷鳴が響きわたる中を、一気にどっと流れ落ちたろう。山のはらわたをえぐり、松を根こそぎにして。それなのに、これは確かに水なのだ。しかも海水である。まぎれもない太平洋の波が、少々薄まっただけで、丘の頂の間を空中で転がっていく。"
    "translation_status": "reviewed"
  - "id": "sv-fog-013"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I climbed still higher, among the red rattling gravel and dwarf underwood of Mount Saint Helena, until I could look right down upon Silverado, and admire the favoured nook in which it lay. The sunny plain of fog was several hundred feet higher; behind the protecting spur a gigantic accumulation of cottony vapour threatened, with every second, to blow over and submerge our homestead; but the vortex setting past the Toll House was too strong; and there lay our little platform, in the arms of the deluge, but still enjoying its unbroken sunshine. About eleven, however, thin spray came flying over the friendly buttress, and I began to think the fog had hunted out its Jonah after all. But it was the last effort. The wind veered while we were at dinner, and began to blow squally from the mountain summit; and by half-past one, all that world of sea-fogs was utterly routed and flying here and there into the south in little rags of cloud. And instead of a lone sea-beach, we found ourselves once more inhabiting a high mountainside, with the clear green country far below us, and the light smoke of Calistoga blowing in the air."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 230
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[166]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-013"
    "translation_ja": "セント・ヘレナ山の赤い砂礫をがらがら踏み、背の低い下生えを縫って、私はなおも登った。やがてシルヴェラードを真下に見下ろし、その恵まれた一角に見とれるところまで来た。日の当たる霧の平野は何百フィートも高い。守りの支尾根の裏には、綿のような蒸気が途方もなくたまり、今にも尾根を越えて私たちの住まいを沈めそうだ。だが宿の脇から流れ去る渦のほうが強すぎた。小平場は大洪水の腕に抱かれていながら、差しつづける日を浴びていた。ただ十一時ごろには、味方の尾根を越えて薄い飛沫が飛んできて、とうとう霧もヨナを捜し当てたか、と私は思い始めた。だがそれが最後のあがきだった。私たちが昼食をとっている間に風向きが変わり、山の頂から突風が吹き下ろし始めた。一時半には海霧の世界はすっかり総崩れとなり、ちぎれた雲の小片となって南へ飛び散った。そうして人けのない海岸ではなく、私たちはまた高い山の斜面に住んでいるのだった。はるか下には澄んだ緑の田園があり、カリストガの薄煙が風に吹かれていた。"
    "translation_status": "reviewed"
  - "id": "sv-fog-014"
    "section_id": "fog"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was the great Russian campaign for that season. Now and then, in the early morning, a little white lakelet of fog would be seen far down in Napa Valley; but the heights were not again assailed, nor was the surrounding world again shut off from Silverado."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 231
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[167]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-fog-014"
    "translation_ja": "その季節のロシア大遠征はこれで終わった。早朝、たまにナパの谷のずっと下に霧の白い小湖が見えたが、高地は二度と攻められず、シルヴェラードから周りの世界が二度と隠されることもなかった。"
    "translation_status": "reviewed"
  - "id": "sv-toll-001"

        "original_unit_id": "sv-mine-001"
    "translation_ja": "ある鉱山の来歴から"
    "translation_status": "reviewed"
  - "id": "sv-mine-002"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "No one could live at Silverado and not be curious about the story of the mine. We were surrounded by so many evidences of expense and toil, we lived so entirely in the wreck of that great enterprise, like mites in the ruins of a cheese, that the idea of the old din and bustle haunted our repose. Our own house, the forge, the dump, the chutes, the rails, the windlass, the mass of broken plant; the two tunnels, one far below in the green dell, the other on the platform where we kept our wine; the deep shaft, with the sun-glints and the water-drops; above all, the ledge, that great gaping slice out of the mountain shoulder, propped apart by wooden wedges, on whose immediate margin, high above our heads, the one tall pine precariously nodded—these stood for its greatness; while, the dog-hutch, boot-jacks, old boots, old tavern bills, and the very beds that we inherited from bygone miners, put in human touches and realized for us the story of the past."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 253
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[185]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-002"
    "translation_ja": "シルヴェラードに住んで、鉱山の来歴を知りたいと思わずにいられる人はない。金と手間をかけた跡に囲まれ、あの大事業の残骸に、チーズの残骸の中のダニさながら丸ごと住みこんでいたので、かつての物音とにぎわいを思う気持ちが、静かな暮らしから離れなかった。私たちの家、鍛冶場、捨石、樋、レール、巻き上げ機、壊れた設備の山。谷の緑深いずっと下に一つ、ワインを置いた平場に一つ、坑道が二本。日がちらつき、水がぽたりぽたりと落ちる深い斜坑。なかでも岩棚は、山の肩を大きく削ってぽっかり開いた裂け目で、木の楔で開いたままに支えてあり、はるか頭上のその間際に一本の高い松が危なっかしくうなずいていた。どれも栄えたころの規模を語っている。いっぽう、犬小屋、長靴脱ぎ、古長靴、宿の勘定書、とうに去った鉱夫たちが残した寝台にいたるまで、そうしたものには人の暮らしの手ざわりがあって、過去の物語をありありと見せてくれた。"
    "translation_status": "reviewed"
  - "id": "sv-mine-003"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I have sat on an old sleeper, under the thick madronas near the forge, with just a look over the dump on the green world below, and seen the sun lying broad among the wreck, and heard the silence broken only by the tinkling water in the shaft, or a stir of the royal family about the battered palace, and my mind has gone back to the epoch of the Stanleys and the Chapmans, with a grand tutti of pick and drill, hammer and anvil, echoing about the canyon; the assayer hard at it in our dining-room; the carts below on the road, and their cargo of red mineral bounding and thundering down the iron chute. And now all gone—all fallen away into this sunny silence and desertion: a family of squatters dining in the assayer’s office, making their beds in the big sleeping room erstwhile so crowded, keeping their wine in the tunnel that once rang with picks."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 254
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[186]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-003"
    "translation_ja": "鍛冶場に近い、こんもりしたマドロナの下の古い枕木に腰かけると、捨石の向こうに下の緑の世界がちらりと見える。残骸の間に広々と陽が差し、物音といえば斜坑で水が澄んだ音を立て、あるいは傷だらけの宮殿で王家の者が何か動くばかりだった。そうして座っていると、心はスタンリーやチャップマンの時代へ戻っていった。つるはしと穿孔棒、槌と金床が大合奏を響かせる峡谷。いま私たちが食卓を囲む部屋で、懸命に働く鉱石分析人。下の道の荷車へ、鉄樋を跳ねて轟きながら下っていく赤い鉱石。そして今すべてが消え、この陽だまりの静けさと寂れの中へ崩れ落ちてしまった。住みついた一家が分析所で食事をし、かつては押すな押すなの大寝室に寝床をしつらえ、以前はつるはしが鳴り響いた坑道にワインを置いている。"
    "translation_status": "reviewed"
  - "id": "sv-mine-004"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But Silverado itself, although now fallen in its turn into decay, was once but a mushroom, and had succeeded to other mines and other flitting cities. Twenty years ago, away down the glen on the Lake County side there was a place, Jonestown by name, with two thousand inhabitants dwelling under canvas, and one roofed house for the sale of whiskey. Round on the western side of Mount Saint Helena, there was at the same date, a second large encampment, its name, if it ever had one, lost for me. Both of these have perished, leaving not a stick and scarce a memory behind them. Tide after tide of hopeful miners have thus flowed and ebbed about the mountain, coming and going, now by lone prospectors, now with a rush. Last, in order of time came Silverado, reared the big mill, in the valley, founded the town which is now represented, monumentally, by Hanson’s, pierced all these slaps and shafts and tunnels, and in turn declined and died away."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 255
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[187]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-004"
    "translation_ja": "だが今やシルヴェラードも順番が来て衰えたとはいえ、そもそも茸のように急に育ち、ほかの鉱山やつかのまの町のあとに出てきたものだった。二十年前には、レイク郡側の谷のずっと下にジョーンズタウンという所があった。二千人の住民は天幕で暮らし、屋根のある家はウイスキー売りの一軒だけだった。セント・ヘレナ山の西側にも、同じころ、もう一つ大きな野営地があった。名があったとしても私にはわからない。どちらも滅び、木切れ一本残さず、記憶さえほとんど残さなかった。こうして希望に燃えた鉱夫の潮がひと波またひと波と山に満ちては引いた。単身の探鉱者が出入りするときも、どっと押しかけるときもあった。時間の順で最後に来たのがシルヴェラードで、谷に大選鉱場を建て、今ではハンソン家が一つの記念碑のように残る町を起こし、こうした切り通し、斜坑、横坑をうがち、そして自ら衰えて消えていった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-005"
    "section_id": "mine"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Our noisy years seem moments in the wake
      Of the eternal silence.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 256
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[7]/div/p"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-005"
    "translation_ja": |-
      「わたしたちの騒がしい年月は、永遠の沈黙が
      あとに残す航跡の、ほんのひとときに見える。」
    "translation_status": "reviewed"
    "attributions":
      - "voice": "quoted_person"
        "name_original": "William Wordsworth"
        "name_ja": "ウィリアム・ワーズワース"
        "evidence_ja": "『幼年時代の思い出から不滅を感じとる頌歌』第九連の異文を伴う引用。"
  - "id": "sv-mine-006"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As to the success of Silverado in its time of being, two reports were current. According to the first, six hundred thousand dollars were taken out of that great upright seam, that still hung open above us on crazy wedges. Then the ledge pinched out, and there followed, in quest of the remainder, a great drifting and tunnelling in all directions, and a great consequent effusion of dollars, until, all parties being sick of the expense, the mine was deserted, and the town decamped. According to the second version, told me with much secrecy of manner, the whole affair, mine, mill, and town, were parts of one majestic swindle. There had never come any silver out of any portion of the mine; there was no silver to come. At midnight trains of packhorses might have been observed winding by devious tracks about the shoulder of the mountain. They came from far away, from Amador or Placer, laden with silver in “old cigar boxes.” They discharged their load at Silverado, in the hour of sleep; and before the morning they were gone again with their mysterious drivers to their unknown source. In this way, twenty thousand pounds’ worth of silver was smuggled in under cover of night, in these old cigar boxes; mixed with Silverado mineral; carted down to the mill; crushed, amalgated, and refined, and despatched to the city as the proper product of the mine. Stock-jobbing, if it can cover such expenses, must be a profitable business in San Francisco."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 257
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[188]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-006"
    "translation_ja": "シルヴェラードがあったころ、どれほどうまくいったかについては二説あった。一説では、今もぐらつく楔で押し開いたまま頭上にかかるあの大きな縦の鉱脈から、六十万ドル分の銀が採れた。やがて鉱脈が細って尽き、残りを追って四方へ横坑を伸ばし、坑道を掘りまくり、おかげで金がまた惜しげもなく流れ出ていった。とうとう誰もが出費にうんざりして、鉱山は打ち捨てられ、町は引き払った。もう一説はたいへん秘密めかして聞かされたが、鉱山も選鉱場も町も、すべて壮大ないかさまの一部だったという。鉱山のどこからも銀は一度も採れなかったし、採れる銀はなかった。真夜中になると、荷を積んだ馬の列が、山の肩の人の通らぬ細道を縫ってくるのが見えただろう。遠く離れたアマドールかプレイサーから、「古い葉巻箱」に銀を入れて来た馬だ。眠りの時刻にシルヴェラードで荷を降ろし、夜が明ける前には謎の馬方に追われ、来たところへまた消えていった。こうして二万ポンド相当の銀が、夜陰に乗じて古い葉巻箱でひそかに持ちこまれ、シルヴェラードの鉱石とまぜられ、荷車で選鉱場へ送られた。そこで砕き、アマルガムにし、精錬したうえで、鉱山のちゃんとした産物として町へ発送されたという。これだけ出費をまかなえるのなら、サンフランシスコの株の投機は儲かる商売に違いない。"
    "translation_status": "reviewed"
  - "id": "sv-mine-007"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I give these two versions as I got them. But I place little reliance on either, my belief in history having been greatly shaken. For it chanced that I had come to dwell in Silverado at a critical hour; great events in its history were about to happen—did happen, as I am led to believe; nay, and it will be seen that I played a part in that revolution myself. And yet from first to last I never had a glimmer of an idea what was going on; and even now, after full reflection, profess myself at sea. That there was some obscure intrigue of the cigar-box order, and that I, in the character of a wooden puppet, set pen to paper in the interest of somebody, so much, and no more, is certain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 258
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[189]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-007"
    "translation_ja": "この二説は聞いたまま書いた。だが私はどちらもさほど信用していない。そもそも歴史に対する私の信頼は、大きく揺らいでいるのだ。たまたまこのシルヴェラードに住み始めたのが、重大な時期だった。歴史に残る大事件が起きようとしていた。私が察するに実際に起きた。いや、その変革には私自身が一役買ったことも、やがてわかるだろう。それなのに、何が起きているか、初めから終わりまでこれっぽっちも見当がつかず、今なおつくづく考えてみても、さっぱりわからない。あの葉巻箱の類いの、よくわからない陰謀があったらしいこと。そして私は木の操り人形の役で、何者かの利益になるよう筆を執ったこと。確かなのはそこまでだ。"
    "translation_status": "reviewed"
  - "id": "sv-mine-008"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Silverado, then under my immediate sway, belonged to one whom I will call a Mr. Ronalds. I only knew him through the extraordinarily distorting medium of local gossip, now as a momentous jobber; now as a dupe to point an adage; and again, and much more probably, as an ordinary Christian gentleman like you or me, who had opened a mine and worked it for a while with better and worse fortune. So, through a defective window-pane, you may see the passer-by shoot up into a hunchbacked giant or dwindle into a potbellied dwarf."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 259
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[190]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-008"
    "translation_ja": "そのころ私のじかの支配にあったシルヴェラードは、ここではロナルズ氏と呼ぶ人のものだった。この人については、驚くほど人を歪めて見せる土地の噂を通してしか知らない。ときには大物の投機屋、ときにはことわざにでも出てきそうな騙され役、またときには、こちらのほうがずっとありそうだが、あなたや私と同じ普通のキリスト教徒の紳士で、鉱山を開き、順調なときもそうでないときもありながら、しばらく操業していた人。窓ガラスにゆがみがあれば、通り過ぎる人がひょろりと伸びて背の曲がった巨人にもなり、ちぢこまって腹の出た小人にもなる、あれと同じである。"
    "translation_status": "reviewed"
  - "id": "sv-mine-009"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To Ronalds, at least, the mine belonged; but the notice by which he held it would ran out upon the 30th of June—or rather, as I suppose, it had run out already, and the month of grace would expire upon that day, after which any American citizen might post a notice of his own, and make Silverado his. This, with a sort of quiet slyness, Rufe told me at an early period of our acquaintance. There was no silver, of course; the mine “wasn’t worth nothing, Mr. Stevens,” but there was a deal of old iron and wood around, and to gain possession of this old wood and iron, and get a right to the water, Rufe proposed, if I had no objections, to “jump the claim.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 260
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[191]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-009"
    "translation_ja": "とにかく鉱山はロナルズのものだったが、権利を主張する掲示は六月三十日で失効する。いや、思うにとっくに失効していて、ちょうどその日が猶予の一か月が切れる日だった。そのあとは合衆国の市民なら誰でも自分の名で掲示を出し、シルヴェラードを手に入れられる。知り合って間もないころ、ルーフがそれを物静かに、どこか抜け目なさそうに教えてくれた。銀などもちろんないし、「鉱山にゃなんの値打ちもないんです、スティーヴンズさん」。だが古鉄と古材はたくさん残っている。その鉄と木を手に入れ、水を使う権利も得るために、私が異存なければ、先に鉱区を押さえてしまいたいとルーフは提案した。"
    "translation_status": "reviewed"
  - "id": "sv-mine-010"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of course, I had no objection. But I was filled with wonder. If all he wanted was the wood and iron, what, in the name of fortune, was to prevent him taking them? “His right there was none to dispute.” He might lay hands on all to-morrow, as the wild cats had laid hands upon our knives and hatchet. Besides, was this mass of heavy mining plant worth transportation? If it was, why had not the rightful owners carted it away? If it was, would they not preserve their title to these movables, even after they had lost their title to the mine? And if it were not, what the better was Rufe? Nothing would grow at Silverado; there was even no wood to cut; beyond a sense of property, there was nothing to be gained. Lastly, was it at all credible that Ronalds would forget what Rufe remembered? The days of grace were not yet over: any fine morning he might appear, paper in hand, and enter for another year on his inheritance. However, it was none of my business; all seemed legal; Rufe or Ronalds, all was one to me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 261
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[192]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-010"
    "translation_ja": "もちろん異存はなかった。だが不思議でたまらない。木と鉄だけが目当てなら、いったい誰に邪魔されるというのだ。「その権利に文句をつける者は誰もいなかった」。明日にでも全部手に取れる。私たちのナイフと手斧をヤマネコが手に入れたのと同じだ。そのうえ、こんな重い鉱山設備の山は、運び出す値打ちがあるのか。あるならなぜ正当な持ち主は運ばなかったのか。値打ちがあるなら、鉱山を持つ権利を失っても、この動産の所有権はなくならないのではないか。そして値打ちがなければ、ルーフは何を得るのか。シルヴェラードでは何も育たない。切るような木さえない。自分のものだという気分のほか、得るものは何もない。最後に、ルーフが覚えていたことを、ロナルズが忘れるなどと、本当に信じられるか。猶予の日々はまだ終わっていない。ある晴れた朝にでも書類を手に現れ、もう一年、また自分の財産を使えるようにするかもしれない。もっとも私の知ったことではない。どうやら違法でもない。ルーフでもロナルズでも、私にはどちらでも同じだった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-011"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the morning of the 27th, Mrs. Hanson appeared with the milk as usual, in her sun-bonnet. The time would be out on Tuesday, she reminded us, and bade me be in readiness to play my part, though I had no idea what it was to be. And suppose Ronalds came? we asked. She received the idea with derision, laughing aloud with all her fine teeth. He could not find the mine to save his life, it appeared, without Rufe to guide him. Last year, when he came, they heard him “up and down the road a hollerin’ and a raisin’ Cain.” And at last he had to come to the Hansons in despair, and bid Rufe, “Jump into your pants and shoes, and show me where this old mine is, anyway!” Seeing that Ronalds had laid out so much money in the spot, and that a beaten road led right up to the bottom of the clump, I thought this a remarkable example. The sense of locality must be singularly in abeyance in the case of Ronalds."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 262
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[193]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-011"
    "translation_ja": "二十七日の朝、ハンソン夫人がいつものように日よけ帽をかぶり、牛乳を持ってきた。火曜に期限が切れると念を押し、私の出番に備えておくようにと言う。もっとも出番が何なのか見当もつかない。ロナルズが来たらどうするのかと私たちは尋ねた。彼女は馬鹿にして、見事な歯をみな見せて声高に笑った。どうやら命がかかっていても、ルーフの案内なしでは、多分あの人に鉱山は見つけられまい。去年来たときには「道を行ったり戻ったり、大声あげて大騒ぎ」しているのが聞こえたそうだ。とうとう絶望してハンソン家へ来て、「さっさとズボンと靴を身につけて、とにかくあの古い鉱山がどこなのか教えてくれ」とルーフに頼まなければならなかった。ロナルズがあの場所にそれだけ金をつぎ込んでいて、しかも踏み固められた道が、あのひとかたまりのすぐ下まで通じているのだから、珍しい例だと思った。ロナルズの土地勘というものは、よほど眠り込んでいるに違いない。"
    "translation_status": "reviewed"
  - "id": "sv-mine-012"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That same evening, supper comfortably over, Joe Strong busy at work on a drawing of the dump and the opposite hills, we were all out on the platform together, sitting there, under the tented heavens, with the same sense of privacy as if we had been cabined in a parlour, when the sound of brisk footsteps came mounting up the path. We pricked our ears at this, for the tread seemed lighter and firmer than was usual with our country neighbours. And presently, sure enough, two town gentlemen, with cigars and kid gloves, came debauching past the house. They looked in that place like a blasphemy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 263
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[194]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-012"
    "translation_ja": "その夕べ、夕食をすませてよい心持ちになり、ジョー・ストロングは捨石と向こうの丘の素描に熱中していた。私たちはそろって平場へ出て、天幕のような空の下に座り、客間にこもったのと同じくよそ目のない気安さを味わっていた。そのとき小道を軽やかな足音が上ってきた。近所の田舎の人たちより足どりが軽くしっかりしているようで、私たちは耳をそばだてた。やがて案の定、葉巻をくわえ、子山羊革の手袋をした都会の紳士二人が、家の脇から姿を現した。この場所にはまるで冒瀆のように見えた。"
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "resolved"
        "message_ja": "底本の debauching は人の出現を描く文脈で debouching と読んだ。"
        "source_span":
          "start": 526
          "end": 536
          "exact": "debauching"
  - "id": "sv-mine-013"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good evening,” they said. For none of us had stirred; we all sat stiff with wonder."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 264
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[195]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-013"
    "translation_ja": "「こんばんは」と二人は言った。私たちは誰も動かず、みな驚きのあまりこわばって座っていたからだ。"
    "translation_status": "reviewed"
  - "id": "sv-mine-014"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good evening,” I returned; and then, to put them at their ease, “A stiff climb,” I added."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 265
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[196]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-014"
    "translation_ja": "「こんばんは」と私は返し、相手が気を楽にするように「きつい登りでしょう」と付け加えた。"
    "translation_status": "reviewed"
  - "id": "sv-mine-015"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” replied the leader; “but we have to thank you for this path.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 266
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[197]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-015"
    "translation_ja": "「ええ」と先に立つ男は答えた。「でもこの小道はありがたい。あなたのおかげですな」"
    "translation_status": "reviewed"
  - "id": "sv-mine-016"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I did not like the man’s tone. None of us liked it. He did not seem embarrassed by the meeting, but threw us his remarks like favours, and strode magisterially by us towards the shaft and tunnel."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 267
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[198]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-016"
    "translation_ja": "その男の調子が気に入らなかった。誰も気に入らなかった。当人はこちらに出くわしても気まずい様子はなく、恩でも着せるように言葉を投げ、いかにも自分に権限があるという足どりで、そばを抜けて斜坑と坑道へ向かった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-017"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Presently we heard his voice raised to his companion. “We drifted every sort of way, but couldn’t strike the ledge.” Then again: “It pinched out here.” And once more: “Every minor that ever worked upon it says there’s bound to be a ledge somewhere.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 268
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[199]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-017"
    "translation_ja": "やがて連れに向けた大きな声が聞こえた。「どの方向にも横坑を伸ばしたが、鉱脈には当たらなかった」。また「ここで細って尽きている」。さらに「ここで働いた鉱夫は誰も、鉱脈はどこかにあるはずだと言っている」。"
    "translation_status": "reviewed"

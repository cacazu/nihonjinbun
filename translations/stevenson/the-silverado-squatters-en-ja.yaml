  - "id": "sv-front-006"
    "section_id": "front"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Vixerunt nonnulli in agris, delectati re sua familiari. His idem propositum fuit quod regibus, ut ne qua re agerent, ne cui parerent, libertate uterentur: cujus proprium est sic vivere ut velis.”"
    "source_languages":
      - "la"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 5
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[1]/div/p[1]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-front-006"
    "translation_ja": "「田園に住み、自分の家産に満足していた者もある。彼らの望みは王たちと同じだった。何一つ不足せず、誰にも従わず、自由を享受すること。自由の本分は、自分の欲するように生きることだからである。」"
    "translation_status": "reviewed"
    "source_kind": "quotation"
    "attributions":
      - "voice": "quoted_person"
        "name_original": "Marcus Tullius Cicero"
        "name_ja": "マルクス・トゥッリウス・キケロ"
        "evidence_ja": "口絵に続く巻頭の銘。次の単位で『義務について』第一巻第二十章と記す。"
    "issues":
      - "kind": "uncertain_translation"
        "status": "resolved"
        "message_ja": "キケロ『義務について』第一巻第二十章の標準的な本文は egerent。「不足を知らず」の意味に従う。底本の agerent は保持。"
        "source_span":
          "start": 109
          "end": 116
          "exact": "agerent"

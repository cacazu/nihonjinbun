        "status": "resolved"
        "message_ja": "底本は would be war。刊本の would be wax と、1884年の雑誌版の would be as wax に照らして訳出。底本の綴りは保持。"
        "source_span":
          "start": 431
          "end": 443
          "exact": "would be war"

  - "id": "sv-hunter-002"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is quite a large race or class of people in America, for whom we scarcely seem to have a parallel in England. Of pure white blood, they are unknown or unrecognizable in towns; inhabit the fringe of settlements and the deep, quiet places of the country; rebellious to all labour, and pettily thievish, like the English gipsies; rustically ignorant, but with a touch of wood-lore and the dexterity of the savage. Whence they came is a moot point. At the time of the war, they poured north in crowds to escape the conscription; lived during summer on fruits, wild animals, and petty theft; and at the approach of winter, when these supplies failed, built great fires in the forest, and there died stoically by starvation. They are widely scattered, however, and easily recognized. Loutish, but not ill-looking, they will sit all day, swinging their legs on a field fence, the mind seemingly as devoid of all reflection as a Suffolk peasant’s, careless of politics, for the most part incapable of reading, but with a rebellious vanity and a strong sense of independence. Hunting is their most congenial business, or, if the occasion offers, a little amateur detection. In tracking a criminal, following a particular horse along a beaten highway, and drawing inductions from a hair or a footprint, one of those somnolent, grinning Hodges will suddenly display activity of body and finesse of mind. By their names ye may know them, the women figuring as Loveina, Larsenia, Serena, Leanna, Orreana; the men answering to Alvin, Alva, or Orion, pronounced Orrion, with the accent on the first. Whether they are indeed a race, or whether this is the form of degeneracy common to all back-woodsmen, they are at least known by a generic byword, as Poor Whites or Low-downers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 206
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[143]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-002"
    "translation_ja": "アメリカには、イングランドには似たものがほとんど見あたらなそうな、かなり数の多い一種族、あるいは一階層の人々がいる。血筋はまじりけない白人だが、町では見かけないか、見かけてもそうとはわからない。入植地の縁や田舎の奥深い静かな所に住み、働けと言われればなにごとにも反抗し、イングランドのジプシーさながら小さな盗みをする。田舎者らしく無学だが、いくらか森の知恵を持ち、野の民の身ごなしのよさを備える。どこから来たのかは説が分かれる。南北戦争のときには徴兵を逃れようと大勢で北へ流れ、夏は木の実や野生の動物やこそ泥で暮らし、それらに事欠く冬の初めには、森で大きな焚火をたいて、平然と飢え死にした。いまは広く散らばっているが、見分けはつきやすい。無骨だが見てくれは悪くなく、一日じゅう畑の柵に腰かけて足をぶらぶらさせている。心はサフォークの農民なみに何の考えもなさそうで、政治には無関心、大部分は字も読めない。それでいて、誰にも頭を下げぬ自尊心と、強い独立心がある。いちばん性に合うなりわいは狩り、あるいは機会があればちょっとした素人探偵だ。犯人を追い、踏み固められた街道で特定の馬のあとをつけ、毛一本や足跡一つから推理するときには、この眠そうな、にやにや笑う百姓の一人が、突如として敏捷に動き、頭の冴えを見せる。名を聞けばわかる。女ならラヴィーナ、ラーセニア、セリーナ、リアンナ、オリアナといった名、男ならアルヴィン、アルヴァ、あるいはオリオンといった名で、最後のはオリオンの最初の音にアクセントを置く。ほんとうに一種族をなすものか、あるいは奥地の人々すべてに共通する一種の退化なのか、ともかく「貧乏白人」または「下っ端」とひとくくりのあだ名で知られている。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-003"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I will not say that the Hanson family was Poor White, because the name savours of offence; but I may go as far as this—they were, in many points, not unsimilar to the people usually so-cared. Rufe himself combined two of the qualifications, for he was both a hunter and an amateur detective. It was he who pursued Russel and Dollar, the robbers of the Lake Port stage, and captured them the very morning after the exploit, while they were still sleeping in a hayfield. Russel, a drunken Scotch carpenter, was even an acquaintance of his own, and he expressed much grave commiseration for his fate. In all that he said and did, Rufe was grave. I never saw him hurried. When he spoke, he took out his pipe with ceremonial deliberation, looked east and west, and then, in quiet tones and few words, stated his business or told his story. His gait was to match; it would never have surprised you if, at any step, he had turned round and walked away again, so warily and slowly, and with so much seeming hesitation did he go about. He lay long in bed in the morning—rarely indeed, rose before noon; he loved all games, from poker to clerical croquet; and in the Toll House croquet ground I have seen him toiling at the latter with the devotion of a curate. He took an interest in education, was an active member of the local school-board, and when I was there, he had recently lost the schoolhouse key. His waggon was broken, but it never seemed to occur to him to mend it. Like all truly idle people, he had an artistic eye. He chose the print stuff for his wife’s dresses, and counselled her in the making of a patchwork quilt, always, as she thought, wrongly, but to the more educated eye, always with bizarre and admirable taste—the taste of an Indian. With all this, he was a perfect, unoffending gentleman in word and act. Take his clay pipe from him, and he was fit for any society but that of fools. Quiet as he was, there burned a deep, permanent excitement in his dark blue eyes; and when this grave man smiled, it was like sunshine in a shady place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 207
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[144]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-003"
    "translation_ja": "ハンソン一家を「貧乏白人」だとは言うまい。あの名には侮りの響きがある。だがこうまでなら言える。ふつうそう呼ばれる人々と、多くの点で似ていないわけではなかった。ルーフ自身は要件を二つ備え、猟師であると同時に素人探偵でもあった。レイクポートの駅馬車を襲ったラッセルとダラーを追い、事のあった翌朝、二人がまだ干し草畑で寝ているうちに捕まえたのは彼だ。ラッセルは酒の好きなスコットランド出の大工で、ルーフとは顔見知りでさえあった。彼の行く末には心から同情していた。何を言うにもするにも、ルーフはまじめだった。急ぐところを見たことがない。話すには、儀式を執り行うようにゆっくりとパイプを外し、右を見、左を見、それから静かな声で手短に用件なり話なりを口にした。足どりもそうだった。一歩ごとに急に向き直って帰りだしても、少しも驚かなかっただろう。それほど慎重に、ゆっくりと、いかにもためらいがちに歩いた。朝は長く床にいて、正午前に起きるのはめずらしい。ポーカーから牧師向きのクロッケーまで、遊びなら何でも好んだ。宿のクロッケー場で、助任司祭のような熱意で打ち込むのを見たことがある。教育にも関心があり、地元の学務委員会で熱心な委員を務めていた。私がいたとき、学校の鍵をなくしたばかりだった。荷馬車は壊れていたが、修繕することはまったく思いつかないようだった。本当に怠け者の人はみなそうだが、審美眼はあった。妻の服のプリント生地を選び、継ぎ合わせの掛け布団を縫うときには口を出した。妻の目にはいつも間違いなのだが、目の肥えた人にはいつも、奇抜なうえに立派な趣味に見えた。先住民の美意識である。これだけ癖はあっても、言動ともに非の打ちどころのない、人を害さない紳士だった。粘土のパイプを取り上げたら、愚か者の集まり以外、どんな社交の場でも通用したろう。静かな男でありながら、濃紺の瞳には昂揚が深く、絶え間なく燃えていた。このまじめな男が笑うと、陰になった場所に日が差したようだった。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-004"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mrs. Hanson (née, if you please, Lovelands) was more commonplace than her lord. She was a comely woman, too, plump, fair-coloured, with wonderful white teeth; and in her print dresses (chosen by Rufe) and with a large sun-bonnet shading her valued complexion, made, I assure you, a very agreeable figure. But she was on the surface, what there was of her, out-spoken and loud-spoken. Her noisy laughter had none of the charm of one of Hanson’s rare, slow-spreading smiles; there was no reticence, no mystery, no manner about the woman: she was a first-class dairymaid, but her husband was an unknown quantity between the savage and the nobleman. She was often in and out with us, merry, and healthy, and fair; he came far seldomer—only, indeed, when there was business, or now and again, to pay a visit of ceremony, brushed up for the occasion, with his wife on his arm, and a clean clay pipe in his teeth. These visits, in our forest state, had quite the air of an event, and turned our red canyon into a salon."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 208
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[145]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-004"
    "translation_ja": "ハンソン夫人は、ちなみに旧姓ラヴランズというが、夫よりありふれた人だった。この人も見目よく、ふっくらと色白で、驚くほど白い歯をしていた。ルーフが選んだプリント地の服を着て、大きな日よけ帽で大事な肌を陰に入れると、これは請け合うが、見るからに感じのよい姿だった。だがあるだけのものはすべて表に出ていて、思ったことをずけずけ、しかも大声で言う。にぎやかな笑い声には、ハンソンがまれに見せる、ゆっくり広がる微笑の魅力はなかった。抑制も謎も気品もない。上等な乳搾り女ではあったが、夫のほうは野人と貴人のあいだにあって、何者か測りがたかった。陽気で元気で美しい彼女はしょっちゅううちに出入りした。夫はずっとまれで、用事があるか、ごくたまに改まった訪問をするだけだ。そのときは身なりを整え、妻の腕を取って、真新しい粘土のパイプをくわえていた。この訪問には、森暮らしの私たちにとって大きな出来事らしい趣があり、赤い峡谷がまるでサロンになるのだった。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-005"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Such was the pair who ruled in the old Silverado Hotel, among the windy trees, on the mountain shoulder overlooking the whole length of Napa Valley, as the man aloft looks down on the ship’s deck. There they kept house, with sundry horses and fowls, and a family of sons, Daniel Webster, and I think George Washington, among the number. Nor did they want visitors. An old gentleman, of singular stolidity, and called Breedlove—I think he had crossed the plains in the same caravan with Rufe—housed with them for awhile during our stay; and they had besides a permanent lodger, in the form of Mrs. Hanson’s brother, Irvine Lovelands. I spell Irvine by guess; for I could get no information on the subject, just as I could never find out, in spite of many inquiries, whether or not Rufe was a contraction for Rufus. They were all cheerfully at sea about their names in that generation. And this is surely the more notable where the names are all so strange, and even the family names appear to have been coined. At one time, at least, the ancestors of all these Alvins and Alvas, Loveinas, Lovelands, and Breedloves, must have taken serious council and found a certain poetry in these denominations; that must have been, then, their form of literature. But still times change; and their next descendants, the George Washingtons and Daniel Websters, will at least be clear upon the point. And anyway, and however his name should be spelt, this Irvine Lovelands was the most unmitigated Caliban I ever knew."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 209
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[146]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-005"
    "translation_ja": "こういう二人が、風の吹く木立の間、かつてのシルヴェラード・ホテルを治めていた。山の肩からナパの谷を端から端まで見渡せる。それは檣上の船員が甲板を見下ろすのにも似ていた。馬や鶏が何頭か何羽か、息子たちが大勢で、その中にはダニエル・ウェブスターと、たしかジョージ・ワシントンもいた。客にも不自由しない。ことのほか鈍重なブリードラヴという老人は、たしかルーフと同じ幌馬車隊で平原を横断してきた人だが、私たちの滞在中もしばらく泊まっていた。さらにハンソン夫人の弟、アーヴィン・ラヴランズという常住の同居人がいた。アーヴィンの綴りは私の推測だ。教えてもらえなかったのだ。何度聞いても、ルーフがルーファスの略かどうかわからなかったのと同じである。あの世代はみな、自分たちの名について、陽気なほど無頓着だった。どれもこんなに奇妙な名で、姓でさえ作ったように見える土地では、いっそう目を引くことだろう。アルヴィンだのアルヴァだのラヴィーナだの、ラヴランズだのブリードラヴだの、こういう名の祖先は、少なくともある時期、真剣に相談して、この呼び名に少しばかり詩を見いだしたに違いない。それがそのころの彼らの文学だったのだ。とはいえ時代は変わる。その次の世代のジョージ・ワシントンやダニエル・ウェブスターは、せめて名のことは確かにわかるだろう。ともかく綴りがどうであれ、このアーヴィン・ラヴランズは、私の知る限り、これ以上ないほどのキャリバンだった。"
    "translation_status": "reviewed"
  - "id": "sv-hunter-006"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Our very first morning at Silverado, when we were full of business, patching up doors and windows, making beds and seats, and getting our rough lodging into shape, Irvine and his sister made their appearance together, she for neighbourliness and general curiosity; he, because he was working for me, to my sorrow, cutting firewood at I forget how much a day. The way that he set about cutting wood was characteristic. We were at that moment patching up and unpacking in the kitchen. Down he sat on one side, and down sat his sister on the other. Both were chewing pine-tree gum, and he, to my annoyance, accompanied that simple pleasure with profuse expectoration. She rattled away, talking up hill and down dale, laughing, tossing her head, showing her brilliant teeth. He looked on in silence, now spitting heavily on the floor, now putting his head back and uttering a loud, discordant, joyless laugh. He had a tangle of shock hair, the colour of wool; his mouth was a grin; although as strong as a horse, he looked neither heavy nor yet adroit, only leggy, coltish, and in the road. But it was plain he was in high spirits, thoroughly enjoying his visit; and he laughed frankly whenever we failed to accomplish what we were about. This was scarcely helpful: it was even, to amateur carpenters, embarrassing; but it lasted until we knocked off work and began to get dinner. Then Mrs. Hanson remembered she should have been gone an hour ago; and the pair retired, and the lady’s laughter died away among the nutmegs down the path. That was Irvine’s first day’s work in my employment—the devil take him!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 210
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[147]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-hunter-006"
    "translation_ja": "シルヴェラードに来て最初の朝、私たちが戸や窓を繕い、寝台や腰掛けをこしらえ、荒れ放題の住まいを何とか形にしようと手いっぱいのところへ、アーヴィンと姉が揃って現れた。姉は近所づきあいと、あれこれ見たい好奇心から。弟のほうは、困ったことに私の雇い人で、日当がいくらだったかは忘れたが、薪を切る役だったからだ。薪の切り方に、彼らしさが出ていた。私たちはそのとき台所を繕い、荷ほどきしていた。彼が片側にどっかり座ると、姉も反対側にどっかり座った。二人とも松脂を噛んでいたが、困ったことに彼はそのささやかな楽しみに、唾を気前よく吐き散らすというおまけをつけた。姉はよく回る舌であっちゃこっちゃへ話を飛ばし、笑い、頭を振り、ぴかぴかの歯を見せた。弟は黙って眺め、かと思うと床へたっぷり唾を吐き、かと思うと頭をそらして、大きな、聞き苦しい、楽しげでもない笑い声を立てた。羊毛色のもじゃもじゃ頭で、口はにやにや笑いそのもの。馬なみに力があるのに、いかつくも器用にも見えない。足ばかり長く、仔馬みたいで、邪魔だった。だが思いきり機嫌がよく、心ゆくまで訪問を楽しんでいるのは明らかだった。私たちのすることがうまくいかないたび、遠慮なく笑った。役にはまず立たない。素人大工にとっては恥ずかしいくらいだ。それが、私たちが作業を切り上げて食事の支度にかかるまで続いた。するとハンソン夫人は一時間も前に帰るはずだったことを思い出し、二人は引き上げた。小道を下ったカリフォルニア・ナツメグの木々の間に、ご婦人の笑い声が消えていった。これが、アーヴィンの私のところでの仕事初めだった。あんなやつ、悪魔に連れていかれてしまえ！"
    "translation_status": "reviewed"
  - "id": "sv-hunter-007"
    "section_id": "hunter"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next morning he returned and, as he was this time alone, he bestowed his conversation upon us with great liberality. He prided himself on his intelligence; asked us if we knew the school ma’am. He didn’t think much of her, anyway. He had tried her, he had. He had put a question to her. If a tree a hundred feet high were to fall a foot a day, how long would it take to fall right down? She had not been able to solve the problem. “She don’t know nothing,” he opined. He told us how a friend of his kept a school with a revolver, and chuckled mightily over that; his friend could teach school, he could. All the time he kept chewing gum and spitting. He would stand a while looking down; and then he would toss back his shock of hair, and laugh hoarsely, and spit, and bring forward a new subject. A man, he told us, who bore a grudge against him, had poisoned his dog. “That was a low thing for a man to do now, wasn’t it? It wasn’t like a man, that, nohow. But I got even with him: I pisoned his dog.” His clumsy utterance, his rude embarrassed manner, set a fresh value on the stupidity of his remarks. I do not think I ever appreciated the meaning of two words until I knew Irvine—the verb, loaf, and the noun, oaf; between them, they complete his portrait. He could lounge, and wriggle, and rub himself against the wall, and grin, and be more in everybody’s way than any other two people that I ever set my eyes on. Nothing that he did became him; and yet you were conscious that he was one of your own race, that his mind was cumbrously at work, revolving the problem of existence like a quid of gum, and in his own cloudy manner enjoying life, and passing judgment on his fellows. Above all things, he was delighted with himself. You would not have thought it, from his uneasy manners and troubled, struggling utterance; but he loved himself to the marrow, and was happy and proud like a peacock on a rail."
    "source_languages":
      - "en"

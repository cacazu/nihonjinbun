          "end": 151
          "exact": "wry windless"
  - "id": "sv-first-022"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Such was our fist prospect of Juan Silverado. I own I had looked for something different: a clique of neighbourly houses on a village green, we shall say, all empty to be sure, but swept and varnished; a trout stream brawling by; great elms or chestnuts, humming with bees and nested in by song-birds; and the mountains standing round about, as at Jerusalem. Here, mountain and house and the old tools of industry were all alike rusty and downfalling. The hill was here wedged up, and there poured forth its bowels in a spout of broken mineral; man with his picks and powder, and nature with her own great blasting tools of sun and rain, labouring together at the ruin of that proud mountain. The view up the canyon was a glimpse of devastation; dry red minerals sliding together, here and there a crag, here and there dwarf thicket clinging in the general glissade, and over all a broken outline trenching on the blue of heaven. Downwards indeed, from our rock eyrie, we behold the greener side of nature; and the bearing of the pines and the sweet smell of bays and nutmegs commanded themselves gratefully to our senses. One way and another, now the die was cast. Silverado be it!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 151
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[103]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-022"
    "translation_ja": "フアン・シルヴェラードを初めて見たのは、こういう具合だった。正直に言うと、もっと別のものを思い描いていた。たとえば村の広場に、仲のよさそうな家が幾軒か集まっている。むろんみな空き家だが、掃き清められ、ニスもかかっている。鱒のいる川がやかましく流れ、高い楡か栗の木には蜜蜂がうなり、歌う鳥が巣をかけている。エルサレムのように四方を山々が囲んでいる。ところがここでは、山も家も、昔の作業道具も、みな同じように錆び、今にも崩れそうだった。こっちでは山を楔で支え、あっちでは山が、はらわたを砕けた鉱石の奔流として吐き出す。つるはしと火薬を持つ人間も、太陽と雨という壮大な発破道具を持つ自然も、力を合わせてあの誇らしい山を壊している。峡谷を見上げれば、荒廃が一目に入る。乾いた赤い鉱石が一緒に滑っていき、あちこちに岩が突き出し、またあちこちで背の低い藪が、なにもかも滑り落ちる中でしがみついている。上方には、それらすべてを覆って空の青に食い込む、ぎざぎざの稜線があった。もちろん、岩の上の鷲の巣のような場所から見下ろせば、自然のもっと緑豊かな面もあった。松の姿と、月桂樹やカリフォルニア・ナツメグの甘い香りが、心地よく目や鼻を引いた。ともかく、もう賽は投げられた。シルヴェラードに決まりだ！"
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "resolved"
        "message_ja": "底本の fist prospect は初見を述べる文脈に沿って first prospect と読んだ。"
        "source_span":
          "start": 13
          "end": 26
          "exact": "fist prospect"
  - "id": "sv-first-023"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "After we had got back to the Toll House, the Jews were not long of striking forward. But I observed that one of the Hanson lads came down, before their departure, and returned with a ship’s kettle. Happy Hansons! Nor was it until after Kelmar was gone, if I remember rightly, that Rufe put in an appearance to arrange the details of our installation."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 152
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[104]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-023"
    "translation_ja": "宿に戻ると、ユダヤ人の一行は間をおかず先へ発っていった。だが出発前にハンソン家の男の子が一人下りてきて、船のやかんを一つ持って帰るのが目に入った。幸せなハンソン一家！　それに、ケルマーが行ってしまうまでは、たしかルーフも、私たちが移り住む段取りを決めに顔を出さなかった。"
    "translation_status": "reviewed"
  - "id": "sv-first-024"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The latter part of the day, Fanny and I sat in the verandah of the Toll House, utterly stunned by the uproar of the wind among the trees on the other side of the valley. Sometimes, we would have it it was like a sea, but it was not various enough for that; and again, we thought it like the roar of a cataract, but it was too changeful for the cataract; and then we would decide, speaking in sleepy voices, that it could be compared with nothing but itself. My mind was entirely preoccupied by the noise. I hearkened to it by the hour, gapingly hearkened, and let my cigarette go out. Sometimes the wind would make a sally nearer hand, and send a shrill, whistling crash among the foliage on our side of the glen; and sometimes a back-draught would strike into the elbow where we sat, and cast the gravel and torn leaves into our faces. But for the most part, this great, streaming gale passed unweariedly by us into Napa Valley, not two hundred yards away, visible by the tossing boughs, stunningly audible, and yet not moving a hair upon our heads. So it blew all night long while I was writing up my journal, and after we were in bed, under a cloudless, starset heaven; and so it was blowing still next morning when we rose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 153
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[105]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-024"
    "translation_ja": "その日の後半、ファニーと私は宿のヴェランダに座り、谷の向こうの木々に鳴り渡る風の騒ぎに、すっかり頭がぼうっとしていた。海の音みたいだと思うこともあったが、海ほどには変化しない。轟く滝の音のようだと思い直しても、滝にしては変化がありすぎる。そして眠たげな声で、これはこれ自体のほかの何にもたとえられないね、と結論した。私はその音のことで頭がいっぱいだった。何時間も、口をぽかんと開けて耳をそばだて、煙草の火が消えるにまかせた。風がもっと近くまで攻めてきて、谷のこちら側の木々の間に、笛のように高く響く破裂音を残すことがあった。あるいは返しの風が、私たちの座る谷の肘に吹き込み、小石とちぎれた葉を顔に投げつけることもあった。だがほとんどの間、この激しく流れる大風は、私たちから二百ヤードも離れていない所を、倦むことなくナパの谷へ流れ過ぎた。揺れ狂う枝にその姿が見え、耳をつんざく音も聞こえるのに、私たちの髪は一本も動かない。私が日記をつけている間も、床に入ったあとも、雲一つなく星をちりばめた空の下で、一晩じゅうそうして風が吹いた。そして翌朝起き出したときも、まだそうして吹いていた。"
    "translation_status": "reviewed"
  - "id": "sv-first-025"
    "section_id": "first"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was a laughable thought to us, what had become of our cheerful, wandering Hebrews. We could not suppose they had reached a destination. The meanest boy could lead them miles out of their way to see a gopher-hole. Boys, we felt to be their special danger; none others were of that exact pitch of cheerful irrelevancy to exercise a kindred sway upon their minds: but before the attractions of a boy their most settled resolutions would be war. We thought we could follow in fancy these three aged Hebrew truants wandering in and out on hilltop and in thicket, a demon boy trotting far ahead, their will-o’-the-wisp conductor; and at last about midnight, the wind still roaring in the darkness, we had a vision of all three on their knees upon a mountain-top around a glow-worm."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 154
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[106]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-first-025"
    "translation_ja": "あの陽気な、さすらいのユダヤ人たちはどうなったかと考えると、おかしくなった。どこにせよ目的地に着いたとは考えられなかった。どんなろくでもない小僧でも、ホリネズミの穴を見に行こうと言えば、彼らを何マイルも脇道へ連れ込める。ことに危ないのは男の子だ、と私たちは思った。あれほど陽気に脇へそれて、同じように彼らの心をつかむ者はほかにいない。男の子の誘いにかかれば、どんなに固い決心も蝋のようだろう。想像すれば目に浮かぶようだった。年かさのユダヤ人の道草仲間が三人、山の頂や藪の中を入ったり出たりする。そのずっと先を、鬼火よろしく道案内の悪魔の小僧が、たったか駆けていく。そしてとうとう真夜中ごろ、暗闇に風が相変わらず吠える中で、山の頂に三人ともひざをつき、一匹の光る虫を取り囲んでいるのが見える思いがした。"
    "translation_status": "reviewed"
    "issues":

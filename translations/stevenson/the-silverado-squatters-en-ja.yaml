    "translation_status": "reviewed"
  - "id": "sv-forest-002"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We drove off from the Springs Hotel about three in the afternoon. The sun warmed me to the heart. A broad, cool wind streamed pauselessly down the valley, laden with perfume. Up at the top stood Mount Saint Helena, a bulk of mountain, bare atop, with tree-fringed spurs, and radiating warmth. Once we saw it framed in a grove of tall and exquisitely graceful white oaks, in line and colour a finished composition. We passed a cow stretched by the roadside, her bell slowly beating time to the movement of her ruminating jaws, her big red face crawled over by half a dozen flies, a monument of content."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 67
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[26]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-002"
    "translation_ja": "午後三時ごろ、私たちは〈スプリングズ・ホテル〉から馬車で出かけた。陽の光が胸の底まで私を暖めた。香りを載せたひろやかな涼風が、休みなく谷を吹き下ろしていた。谷の奥にはセント・ヘレナ山が立ちはだかる。巨大な山塊で、頂はむきだし、木々で縁取られた尾根が何本も伸び、暖気を放っている。一度は背高く、このうえなく優美なホワイトオークの林の額縁に収まった姿も見た。線といい色といい、仕上がったひと幅の絵だった。道端には一頭の牛が横たわっていた。反芻する顎の動きに鈴がゆっくり拍子を取り、大きな赤い顔の上を蠅が半ダース這い回る。満ち足りた気分をそのまま像にしたようだった。"
    "translation_status": "reviewed"
  - "id": "sv-forest-003"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little farther, and we struck to the left up a mountain road, and for two hours threaded one valley after another, green, tangled, full of noble timber, giving us every now and again a sight of Mount Saint Helena and the blue hilly distance, and crossed by many streams, through which we splashed to the carriage-step. To the right or the left, there was scarce any trace of man but the road we followed; I think we passed but one ranchero’s house in the whole distance, and that was closed and smokeless. But we had the society of these bright streams—dazzlingly clear, as is their wont, splashing from the wheels in diamonds, and striking a lively coolness through the sunshine. And what with the innumerable variety of greens, the masses of foliage tossing in the breeze, the glimpses of distance, the descents into seemingly impenetrable thickets, the continual dodging of the road which made haste to plunge again into the covert, we had a fine sense of woods, and spring-time, and the open air."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 68
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[27]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-003"
    "translation_ja": "もう少し先で左へ折れ、山道に入った。二時間のあいだ、緑に絡まり合い、見事な木の茂った谷を次々に縫って進んだ。ときおりセント・ヘレナ山と遠く青い丘が顔をのぞかせる。流れがいくつも道を横切っていて、渡ると馬車の踏み段にまでしぶきが跳ねた。左右どちらにも、私たちの通る道を除けば人の跡はほとんどない。道中、牧場主の家は一軒しかなかったように思うが、そこも閉まっていて煙ひと筋立っていなかった。だが私たちにはあの明るい流れがつきあってくれた。例によってまばゆいほど透き通り、車輪からダイヤモンドの粒となって飛び散り、日なたへ生き生きとした冷たさを投げかける。数えきれない緑の色合い、風に揺れ返る葉のかたまり、ちらりと見える遠景、分け入れそうにない藪への下り坂、また茂みの陰へ飛び込もうとする道の絶え間ない曲がりよう。どれもこれも、森と春と戸外をこのうえなく感じさせてくれた。"
    "translation_status": "reviewed"
  - "id": "sv-forest-004"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Our driver gave me a lecture by the way on Californian trees—a thing I was much in need of, having fallen among painters who know the name of nothing, and Mexicans who know the name of nothing in English. He taught me the madrona, the manzanita, the buck-eye, the maple; he showed me the crested mountain quail; he showed me where some young redwoods were already spiring heavenwards from the ruins of the old; for in this district all had already perished: redwoods and redskins, the two noblest indigenous living things, alike condemned."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 69
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[28]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-004"
    "translation_ja": "道々、御者はカリフォルニアの木々について講釈してくれた。私には大いに必要なことだった。なにしろ、何ひとつ名前を知らない画家たちと、何ひとつ英語の名前を知らないメキシコ人たちに囲まれていたのだ。マドロナ、マンザニータ、バックアイ、カエデを教え、冠羽を立てた山ウズラを見せてくれた。昔のレッドウッドの朽ちた跡から、もう若木が空めがけて伸びているところも教えてくれた。このあたりではすでにみな滅びていたからだ。レッドウッドと「赤い肌の人々」、この地に生まれた最も気高い二つの生き物は、同じく滅びを宣告されている。"
    "translation_status": "reviewed"
  - "id": "sv-forest-005"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At length, in a lonely dell, we came on a huge wooden gate with a sign upon it like an inn. “The Petrified Forest. Proprietor: C. Evans,” ran the legend. Within, on a knoll of sward, was the house of the proprietor, and another smaller house hard by to serve as a museum, where photographs and petrifactions were retailed. It was a pure little isle of touristry among these solitary hills."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 70
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[29]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-005"
    "translation_ja": "とうとう人里離れた谷で、宿屋のような看板を掛けた大きな木の門に出会った。「化石の森。持ち主Ｃ・エヴァンズ」と書いてある。中に入ると草地の小丘に持ち主の家があった。そのすぐ脇には博物館代わりの小さな家があり、写真と化石を売っている。孤独な丘々のただ中に、観光だけの小さな島が浮かんでいた。"
    "translation_status": "reviewed"
  - "id": "sv-forest-006"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The proprietor was a brave old white-faced Swede. He had wandered this way, Heaven knows how, and taken up his acres—I forget how many years ago—all alone, bent double with sciatica, and with six bits in his pocket and an axe upon his shoulder. Long, useless years of seafaring had thus discharged him at the end, penniless and sick. Without doubt he had tried his luck at the diggings, and got no good from that; without doubt he had loved the bottle, and lived the life of Jack ashore. But at the end of these adventures, here he came; and, the place hitting his fancy, down he sat to make a new life of it, far from crimps and the salt sea. And the very sight of his ranche had done him good. It was “the handsomest spot in the Californy mountains.” “Isn’t it handsome, now?” he said. Every penny he makes goes into that ranche to make it handsomer. Then the climate, with the sea-breeze every afternoon in the hottest summer weather, had gradually cured the sciatica; and his sister and niece were now domesticated with him for company—or, rather, the niece came only once in the two days, teaching music the meanwhile in the valley. And then, for a last piece of luck, “the handsomest spot in the Californy mountains” had produced a petrified forest, which Mr. Evans now shows at the modest figure of half a dollar a head, or two-thirds of his capital when he first came there with an axe and a sciatica."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 71
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[30]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-006"
    "translation_ja": "持ち主は色白で気骨のある老スウェーデン人だった。どう流れ着いたのかは神のみぞ知る。何年前だったかは忘れたが、たった一人でこの土地を手に入れた。そのときは坐骨神経痛で体が二つ折りになり、懐には六ビット（七十五セント）、肩には斧一本だった。長いこと海に出ても何にもならず、とうとう文なしの病人になって陸へ放り出されたのである。むろん鉱山で運を試しても何も得られなかったろうし、酒を愛して、陸に上がった船乗りらしい暮らしもしたろう。そうした冒険の果てに彼はここへ来た。土地が気に入ったので、船員を食い物にする周旋屋からも塩辛い海からも離れて、ここで新しい暮らしを始めることにした。牧場は眺めるだけでも彼の薬になった。「カリフォルニヤの山でいちばんきれいなところさ」。「な、いいところだろう？」と言う。稼いだ金は一ペニーも残さず牧場につぎ込んで、もっときれいにする。真夏の暑い盛りでも午後には毎日海風が吹く気候のおかげで、坐骨神経痛も徐々に治った。姉妹の一人と姪がいまは家で一緒に暮らし、話し相手になっている。もっとも姪は二日に一度しか帰らない。あとの日は谷で音楽を教えているのだ。おしまいにもう一つ、運が向いた。「カリフォルニヤの山でいちばんきれいなところ」が化石の森を生み出したのである。いまやエヴァンズさんは、一人半ドルというつつましい料金でそれを見せている。斧一本と坐骨神経痛をかついで初めてここに来たときの資本の三分の二である。"
    "translation_status": "reviewed"
  - "id": "sv-forest-007"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This tardy favourite of fortune—hobbling a little, I think, as if in memory of the sciatica, but with not a trace that I can remember of the sea—thoroughly ruralized from head to foot, proceeded to escort us up the hill behind his house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 72
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[31]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-007"
    "translation_ja": "ようやく運の女神に見込まれたこの男は、坐骨神経痛を忘れぬようにでもというふうに、いくぶん足を引きずっていたと思う。だが思い出すかぎり海の面影はみじんもない。頭の先から足の先まで、すっかり田舎の人になって、家の裏の丘を私たちに案内した。"
    "translation_status": "reviewed"
  - "id": "sv-forest-008"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Who first found the forest?” asked my wife."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 73
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[32]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-008"
    "translation_ja": "「この森を初めに見つけたのはどなたですか」と妻が尋ねた。"
    "translation_status": "reviewed"
  - "id": "sv-forest-009"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The first? I was that man,” said he. “I was cleaning up the pasture for my beasts, when I found this”—kicking a great redwood seven feet in diameter, that lay there on its side, hollow heart, clinging lumps of bark, all changed into gray stone, with veins of quartz between what had been the layers of the wood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 74
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[33]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-009"
    "translation_ja": "「初めに？　わしだよ」と彼は答えた。「家畜のために牧草地を片づけてたら、こいつが出てきた」。そう言って、そこに横たわる直径七フィートものレッドウッドを蹴った。うろになった芯も、へばりついた樹皮の塊も、すべて灰色の石に変わり、かつて木の層だったあいだに石英の筋が走っていた。"
    "translation_status": "reviewed"
  - "id": "sv-forest-010"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Were you surprised?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 75
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[34]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-010"
    "translation_ja": "「驚きましたか？」"
    "translation_status": "reviewed"
  - "id": "sv-forest-011"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Surprised? No! What would I be surprised about? What did I know about petrifactions—following the sea? Petrifaction! There was no such word in my language! I knew about putrifaction, though! I thought it was a stone; so would you, if you was cleaning up pasture.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 76
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[35]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-011"
    "translation_ja": "「驚く？　いや！　何に驚くんだい？　海ばかり渡ってきた人間が化石のことなんか知るはずもない。石になる『ペトリファクション』だと！　わしの辞書にはそんな言葉はない。腐っていく『ピュトリファクション』なら知ってたがね！　石だと思ったさ。あんたでも、牧草地を片づけてりゃそう思うよ。」"
    "translation_status": "reviewed"
  - "id": "sv-forest-012"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And now he had a theory of his own, which I did not quite grasp, except that the trees had not “grewed” there. But he mentioned, with evident pride, that he differed from all the scientific people who had visited the spot; and he flung about such words as “tufa” and “scilica” with careless freedom."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 77
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[36]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-012"
    "translation_ja": "いまでは彼なりの説があるのだが、木々がそこで「生えてきちゃいねえ」ということのほか、私にはよくのみこめなかった。ただ、ここに来た学者という学者と見方が違うのだと、いかにも誇らしげに言い、「凝灰岩」とか「シリカ」とかいう言葉を少し訛りながら、ごく無造作に振り回した。"
    "translation_status": "reviewed"
  - "id": "sv-forest-013"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I mentioned I was from Scotland, “My old country,” he said; “my old country”—with a smiling look and a tone of real affection in his voice. I was mightily surprised, for he was obviously Scandinavian, and begged him to explain. It seemed he had learned his English and done nearly all his sailing in Scotch ships. “Out of Glasgow,” said he, “or Greenock; but that’s all the same—they all hail from Glasgow.” And he was so pleased with me for being a Scotsman, and his adopted compatriot, that he made me a present of a very beautiful piece of petrifaction—I believe the most beautiful and portable he had."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 78
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[37]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-013"
    "translation_ja": "私がスコットランドから来たと言うと、「わしのふるさとだ」と彼は言った。「わしのふるさと」。微笑を浮かべ、声には本当になつかしそうな響きがあった。どう見ても北欧の人だから、たいそう驚いて、わけを尋ねた。英語を覚えたのもスコットランドの船で、海の暮らしもほとんどその船だったという。「グラスゴーから出る船さ。グリーノックのもいたが、どっちでも同じこと。みんなグラスゴーの船だよ」。私がスコットランド人で、彼が自分で選んだ国の同胞であるのがよほどうれしかったと見え、たいそう美しい化石を一つくれた。たぶん、手持ちでいちばん美しく、持ち運びのきくものだったろう。"
    "translation_status": "reviewed"
  - "id": "sv-forest-014"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Here was a man, at least, who was a Swede, a Scot, and an American, acknowledging some kind allegiance to three lands. Mr. Wallace’s Scoto-Circassian will not fail to come before the reader. I have myself met and spoken with a Fifeshire German, whose combination of abominable accents struck me dumb. But, indeed, I think we all belong to many countries. And perhaps this habit of much travel, and the engendering of scattered friendships, may prepare the euthanasia of ancient nations."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 79
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[38]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-014"
    "translation_ja": "少なくともここに一人、スウェーデン人であり、スコットランド人であり、アメリカ人でもあって、三つの国にどこか帰属の思いを抱く男がいた。ウォレス氏の書いたスコットランド系チェルケス人を、読者はきっと思い出すだろう。私もファイフシャーのドイツ人に会って話したことがある。二つのとんでもない訛りが入り混じっていて、私はあいた口がふさがらなかった。だが実際のところ、私たちはみな多くの国に属しているのだと思う。たびたび旅をし、あちこちに友をつくるこういう習慣は、ひょっとすると古くからの国々の穏やかな死を支度するのかもしれない。"
    "translation_status": "reviewed"
  - "id": "sv-forest-015"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the forest itself? Well, on a tangled, briery hillside—for the pasture would bear a little further cleaning up, to my eyes—there lie scattered thickly various lengths of petrified trunk, such as the one already mentioned. It is very curious, of course, and ancient enough, if that were all. Doubtless, the heart of the geologist beats quicker at the sight; but, for my part, I was mightily unmoved. Sight-seeing is the art of disappointment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 80
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[39]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-015"
    "translation_ja": "では森そのものはどうか。棘のある藪の絡まった山腹に（私の目には、牧草地はいま少し片づけてもよさそうだった）、先に話したような石の幹が、まちまちの長さでそこかしこにごろごろしている。むろん珍しくはあるし、古さだけなら申し分ない。地質学者ならきっと見たとたん胸の鼓動が速まるだろう。私はといえば大層平然としていた。名所見物とは、がっかりする技術である。"
    "translation_status": "reviewed"
  - "id": "sv-forest-016"
    "section_id": "forest"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “There’s nothing under heaven so blue,
      That’s fairly worth the travelling to.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 81
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[2]/div/p"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-016"
    "translation_ja": |-
      「天の下どんなに青く鮮やかなものとて、
      わざわざ旅して見に行くほどのものはない。」
    "translation_status": "reviewed"
    "attributions":
      - "voice": "unknown"
        "evidence_ja": "底本では引用の作者が明記されない。"
  - "id": "sv-forest-017"
    "section_id": "forest"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But, fortunately, Heaven rewards us with many agreeable prospects and adventures by the way; and sometimes, when we go out to see a petrified forest, prepares a far more delightful curiosity, in the form of Mr. Evans, whom may all prosperity attend throughout a long and green old age."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 82
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[40]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-forest-017"
    "translation_ja": "幸いにも天は、途中で愉快な眺めや思いがけない出来事をいくつも授けてくれる。化石の森を見に行ったつもりが、エヴァンズさんという、もっと愉快な珍品を用意してくれていることもある。どうかあの人が生き生きと長寿を楽しみ、そのあいだずっと事が順調に運びますように。"
    "translation_status": "reviewed"
  - "id": "sv-wine-001"
    "section_id": "wine"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER III—NAPA WINE"
    "source_languages":
      - "en"
    "source_locations":

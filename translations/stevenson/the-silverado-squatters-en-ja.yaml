        "anchor": "page34"
        "printed_page": "34"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-001"
    "translation_ja": "第三章　ナパのワイン"
    "translation_status": "reviewed"
  - "id": "sv-wine-002"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was interested in Californian wine. Indeed, I am interested in all wines, and have been all my life, from the raisin wine that a schoolfellow kept secreted in his play-box up to my last discovery, those notable Valtellines, that once shone upon the board of Cæsar."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 84
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[41]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-002"
    "translation_ja": "私はカリフォルニアのワインに興味があった。というより、一生を通じてあらゆるワインに興味があるのだ。学校の友達がおもちゃ箱に隠していた干し葡萄の酒から、ついこのあいだ見つけたばかりの、かつてカエサルの食卓に輝いたという格別のヴァルテッリーナのワインまで。"
    "translation_status": "reviewed"
  - "id": "sv-wine-003"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Some of us, kind old Pagans, watch with dread the shadows falling on the age: how the unconquerable worm invades the sunny terraces of France, and Bordeaux is no more, and the Rhone a mere Arabia Petræa. Château Neuf is dead, and I have never tasted it; Hermitage—a hermitage indeed from all life’s sorrows—lies expiring by the river. And in the place of these imperial elixirs, beautiful to every sense, gem-hued, flower-scented, dream-compellers:—behold upon the quays at Cette the chemicals arrayed; behold the analyst at Marseilles, raising hands in obsecration, attesting god Lyoeus, and the vats staved in, and the dishonest wines poured forth among the sea. It is not Pan only; Bacchus, too, is dead."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 85
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[42]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-003"
    "translation_ja": "私たち、根の優しい古風な異教徒の何人かは、不安な目で時代に落ちる影を見守っている。打ち負かせない虫がフランスの陽だまりの段々畑に攻め込み、ボルドーはもうない。ローヌは岩だらけのアラビアも同然だ。シャトー・ヌフは死んだ。私は一度も味わったことがない。エルミタージュはというと、浮世の憂さから逃れるまことの隠れ家だったのに、川のかたわらで息も絶え絶えだ。五感のどれにも美しく、宝石の色と花の香りを持ち、夢へ誘う帝王の妙薬に代わって、さて何があるか。セットの埠頭に化学薬品が並ぶのを見よ。マルセイユでは分析屋が祈るように両手を上げ、酒神リュアイオスを証人に立てる。樽は打ち壊され、いかさまワインは海へ流される。それを見るがいい。死んだのは牧神パンだけではない。バッカスも死んだのだ。"
    "translation_status": "reviewed"
  - "id": "sv-wine-004"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "If wine is to withdraw its most poetic countenance, the sun of the white dinner-cloth, a deity to be invoked by two or three, all fervent, hushing their talk, degusting tenderly, and storing reminiscences—for a bottle of good wine, like a good act, shines ever in the retrospect—if wine is to desert us, go thy ways, old Jack! Now we begin to have compunctions, and look back at the brave bottles squandered upon dinner-parties, where the guests drank grossly, discussing politics the while, and even the schoolboy “took his whack,” like liquorice water. And at the same time, we look timidly forward, with a spark of hope, to where the new lands, already weary of producing gold, begin to green with vineyards. A nice point in human history falls to be decided by Californian and Australian wines."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 86
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[43]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-004"
    "translation_ja": "白い卓布を照らす太陽、二人か三人で呼び迎える神、ワインがそんな最高に詩的な顔を引っ込めるというのか。皆が熱心に話をやめ、そっと味わって、思い出に蓄える。よいワイン一本は、よい行い一つと同じで、振り返ればいつまでも輝くのだ。それなのにワインが私たちを捨て去るなら、行くがいい、ご老体！　こうなってようやく良心がとがめる。あの見事な瓶の数々を晩餐会でむだにしたことを思い出す。客は政治談議をしながらがぶ飲みし、学童まで、甘草水でも飲むように「自分の取り分」を流し込んだ。そう思う一方で、私たちは小さな希望を胸に、おずおずと先を見る。もう金を産み出すのに飽きた新天地が、葡萄畑で緑に染まり始めたところを。人類史の微妙な一問に、カリフォルニアとオーストラリアのワインが答えを出すことになったのだ。"
    "translation_status": "reviewed"
  - "id": "sv-wine-005"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Wine in California is still in the experimental stage; and when you taste a vintage, grave economical questions are involved. The beginning of vine-planting is like the beginning of mining for the precious metals: the wine-grower also “Prospects.” One corner of land after another is tried with one kind of grape after another. This is a failure; that is better; a third best. So, bit by bit, they grope about for their Clos Vougeot and Lafite. Those lodes and pockets of earth, more precious than the precious ores, that yield inimitable fragrance and soft fire; those virtuous Bonanzas, where the soil has sublimated under sun and stars to something finer, and the wine is bottled poetry: these still lie undiscovered; chaparral conceals, thicket embowers them; the miner chips the rock and wanders farther, and the grizzly muses undisturbed. But there they bide their hour, awaiting their Columbus; and nature nurses and prepares them. The smack of Californian earth shall linger on the palate of your grandson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 87
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[44]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-005"
    "translation_ja": "カリフォルニアのワインはいまなお実験の段階にある。一年の出来を味わうにも、厄介な経済の問題が絡む。葡萄を植え始めるのは貴金属の鉱山を探し始めるのと似ていて、葡萄作りも「試掘」する。あちらの土地、こちらの土地へ、次から次へと品種を植えて試す。これは失敗、あれはまし、三つ目は最上。そうして少しずつ、ここならではのクロ・ヴージョやラフィットを手探りする。たぐいない香りと穏やかな火を生む、貴鉱石より貴重な土の鉱脈と溜まり場。土が日と星の下で昇華していっそう細やかになり、ワインが瓶に収めた詩となる、奇跡の富鉱脈。そうしたものはまだ見つかっていない。シャパラルが隠し、藪が覆い、鉱夫は岩を削ってはさらに先へとさまよい、ハイイログマは邪魔されずに物思いにふける。しかしその土は、いつか自分を見つけるコロンブスを待ちながら、時を待っている。自然がそれを育て、支度をしているのだ。カリフォルニアの土の風味は、いずれあなたの孫の舌に残るだろう。"
    "translation_status": "reviewed"
  - "id": "sv-wine-006"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Meanwhile the wine is merely a good wine; the best that I have tasted better than a Beaujolais, and not unlike. But the trade is poor; it lives from hand to mouth, putting its all into experiments, and forced to sell its vintages. To find one properly matured, and bearing its own name, is to be fortune’s favourite."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 88
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[45]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-006"
    "translation_ja": "当面のところは、ただうまいワインというだけだ。私が飲んだ最上のものはボージョレよりもうまく、しかもよく似ていた。だが商売に余裕がない。その日暮らしで元手をことごとく実験につぎこむから、その年に仕込んだ酒もすぐ売るしかない。きちんと寝かせてあって、それ自身の名を名乗るものが見つかれば、よほど運に愛された人である。"
    "translation_status": "reviewed"
  - "id": "sv-wine-007"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Bearing its own name, I say, and dwell upon the innuendo."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 89
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[46]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-007"
    "translation_ja": "それ自身の名を名乗る、と私は言った。この含みをどうか聞き逃さないでほしい。"
    "translation_status": "reviewed"
  - "id": "sv-wine-008"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You want to know why California wine is not drunk in the States?” a San Francisco wine merchant said to me, after he had shown me through his premises. “Well, here’s the reason.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 90
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[47]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-008"
    "translation_ja": "「なぜ合衆国でカリフォルニアのワインが飲まれないか、知りたいですか？」サンフランシスコのワイン商が、店をひと巡り案内したあとで私に言った。「では、これが理由です。」"
    "translation_status": "reviewed"
  - "id": "sv-wine-009"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And opening a large cupboard, fitted with many little drawers, he proceeded to shower me all over with a great variety of gorgeously tinted labels, blue, red, or yellow, stamped with crown or coronet, and hailing from such a profusion of clos and chateaux, that a single department could scarce have furnished forth the names. But it was strange that all looked unfamiliar."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 91
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[48]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-009"
    "translation_ja": "小さな引き出しのたくさんついた大戸棚を開き、さっそく青、赤、黄と絢爛な色合いのラベルの雨を私に浴びせ始めた。王冠やら貴族の冠やらを刷り、どれもクロだのシャトーだの、ひとつの県ではとても名前を出しきれまいと思うほどの名を名乗っている。妙なのは、ひとつとして見覚えがないことだった。"
    "translation_status": "reviewed"
  - "id": "sv-wine-010"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Chateau X—?” said I. “I never heard of that.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 92
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[49]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-010"
    "translation_ja": "「シャトーＸ？」と私は言った。「聞いたこともありませんが。」"
    "translation_status": "reviewed"
  - "id": "sv-wine-011"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I dare say not,” said he. “I had been reading one of X—’s novels.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 93
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[50]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-011"
    "translation_ja": "「でしょうね」と彼。「ちょうどＸの小説を一冊読んだものですから。」"
    "translation_status": "reviewed"
  - "id": "sv-wine-012"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They were all castles in Spain! But that sure enough is the reason why California wine is not drunk in the States."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 94
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[51]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-012"
    "translation_ja": "みんな、スペインに建てたお城、つまり空想の産物だった！　なるほどこれでは、合衆国でカリフォルニアのワインが飲まれないわけである。"
    "translation_status": "reviewed"
  - "id": "sv-wine-013"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Napa valley has been long a seat of the wine-growing industry. It did not here begin, as it does too often, in the low valley lands along the river, but took at once to the rough foot-hills, where alone it can expect to prosper. A basking inclination, and stones, to be a reservoir of the day’s heat, seem necessary to the soil for wine; the grossness of the earth must be evaporated, its marrow daily melted and refined for ages; until at length these clods that break below our footing, and to the eye appear but common earth, are truly and to the perceiving mind, a masterpiece of nature. The dust of Richebourg, which the wind carries away, what an apotheosis of the dust! Not man himself can seem a stranger child of that brown, friable powder, than the blood and sun in that old flask behind the faggots."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 95
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[52]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-013"
    "translation_ja": "ナパ谷は長くワイン作りの土地だった。よくあるように川沿いの低地から始めたのではなく、初めから荒い麓の丘へ入った。繁栄が望めるのはそこだけなのだ。ワイン向きの土には、日をたっぷり浴びる傾斜と、昼の熱を蓄える石が必要らしい。土の粗野なところを蒸発させ、その髄を日々溶かして、長い年月かけて精製する。そうしてついに、足の下で崩れ、目にはただの土としか見えないその塊が、もののわかる心には、まさしく自然の傑作となる。風がさらってゆくリシュブールの塵を見るがいい。塵がよくもあそこまで神々しくなるものだ！　あの茶色の崩れやすい粉から人間が生まれたとしても、薪の奥の古い瓶にある血と陽光ほど、不思議な子ではあるまい。"
    "translation_status": "reviewed"
  - "id": "sv-wine-014"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A Californian vineyard, one of man’s outposts in the wilderness, has features of its own. There is nothing here to remind you of the Rhine or Rhone, of the low côte d’or, or the infamous and scabby deserts of Champagne; but all is green, solitary, covert. We visited two of them, Mr. Schram’s and Mr. M’Eckron’s, sharing the same glen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 96
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[53]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-014"
    "translation_ja": "荒野に出した人間の前哨の一つ、カリフォルニアの葡萄畑には、独特の顔つきがある。ラインやローヌ、低いコート・ドール、名だたる無残さで疥癬にでもかかったようなシャンパーニュの荒地を思い出させるものは何もない。どこも緑で、ひっそりして、隠れている。私たちは一つの谷間を分け合うシュラムさんとマケクロンさんの二軒を訪ねた。"
    "translation_status": "reviewed"
  - "id": "sv-wine-015"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Some way down the valley below Calistoga, we turned sharply to the south and plunged into the thick of the wood. A rude trail rapidly mounting; a little stream tinkling by on the one hand, big enough perhaps after the rains, but already yielding up its life; overhead and on all sides a bower of green and tangled thicket, still fragrant and still flower-bespangled by the early season, where thimble-berry played the part of our English hawthorn, and the buck-eyes were putting forth their twisted horns of blossom: through all this, we struggled toughly upwards, canted to and fro by the roughness of the trail, and continually switched across the face by sprays of leaf or blossom. The last is no great inconvenience at home; but here in California it is a matter of some moment. For in all woods and by every wayside there prospers an abominable shrub or weed, called poison-oak, whose very neighbourhood is venomous to some, and whose actual touch is avoided by the most impervious."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 97
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[54]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-015"
    "translation_ja": "カリストガから少し谷を下ったところで、私たちは急に南へ曲がり、森の奥へ分け入った。荒れた小道はみるみる登り、片側には小川がさらさらと鳴る。雨上がりには大きな流れだったろうが、もう命が尽きかけていた。頭上も四方も、入り乱れた茂みが緑の屋根となっている。早い季節だけにまだ香りがあり、まだ花がちりばめられている。シンブルベリーが私たちのイングランドのサンザシの役を務め、バックアイはねじれた角のような花を突き出している。その中を、荒い道に左右へ傾けられ、葉や花の枝に絶えず顔を打たれながら、苦闘して登った。枝に顔を打たれるぐらい、故郷ならたいしたことではない。だがここカリフォルニアでは少し事情が違う。どの森、どの道端にもポイズンオークという忌まわしい低木だか草だかがよく育つ。人によっては近寄っただけでも害があり、じかに触れることはどれほどかぶれにくい人でも避ける。"
    "translation_status": "reviewed"
  - "id": "sv-wine-016"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The two houses, with their vineyards, stood each in a green niche of its own in this steep and narrow forest dell. Though they were so near, there was already a good difference in level; and Mr. M’Eckron’s head must be a long way under the feet of Mr. Schram. No more had been cleared than was necessary for cultivation; close around each oasis ran the tangled wood; the glen enfolds them; there they lie basking in sun and silence, concealed from all but the clouds and the mountain birds."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 98
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[55]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-016"
    "translation_ja": "二軒の家と葡萄畑は、急で狭い森の谷間に、それぞれ緑のくぼみを見つけて立っていた。隣り合っていてもすでにかなりの高低差があり、マケクロンさんの頭はシュラムさんの足元のはるか下だろう。作物を育てるのに必要なだけしか開墾していない。その小さなオアシスのすぐ周りを、からまり合う林が取り囲んでいる。谷が包み込むその中で、畑は陽光と静けさにひたり、雲と山鳥のほかには姿を見せない。"
    "translation_status": "reviewed"
  - "id": "sv-wine-017"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. M’Eckron’s is a bachelor establishment; a little bit of a wooden house, a small cellar hard by in the hillside, and a patch of vines planted and tended single-handed by himself. He had but recently began; his vines were young, his business young also; but I thought he had the look of the man who succeeds. He hailed from Greenock: he remembered his father putting him inside Mons Meg, and that touched me home; and we exchanged a word or two of Scotch, which pleased me more than you would fancy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 99
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[56]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-017"
    "translation_ja": "マケクロンさんのところは独り者の所帯である。ほんの小さな木の家、すぐそばの山腹に掘った小さな貯蔵穴、自分の手一つで植え、手入れしてきたひと区画の葡萄。始めたのはついこのあいだで、葡萄も若く、商売もまだ若かったが、この人は成功する人の顔をしていると私は思った。グリーノックの出身だった。父親に大砲モンス・メグの中へ入れてもらったと覚えている。それを聞いて故郷を近く感じた。私たちはスコットランド語で一言二言かわしたが、あなたが想像する以上に、私にはうれしかった。"
    "translation_status": "reviewed"
  - "id": "sv-wine-018"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Schram’s, on the other hand, is the oldest vineyard in the valley, eighteen years old, I think; yet he began a penniless barber, and even after he had broken ground up here with his black malvoisies, continued for long to tramp the valley with his razor. Now, his place is the picture of prosperity: stuffed birds in the verandah, cellars far dug into the hillside, and resting on pillars like a bandit’s cave:—all trimness, varnish, flowers, and sunshine, among the tangled wildwood. Stout, smiling Mrs. Schram, who has been to Europe and apparently all about the States for pleasure, entertained Fanny in the verandah, while I was tasting wines in the cellar. To Mr. Schram this was a solemn office; his serious gusto warmed my heart; prosperity had not yet wholly banished a certain neophite and girlish trepidation, and he followed every sip and read my face with proud anxiety. I tasted all. I tasted every variety and shade of Schramberger, red and white Schramberger, Burgundy Schramberger, Schramberger Hock, Schramberger Golden Chasselas, the latter with a notable bouquet, and I fear to think how many more. Much of it goes to London—most, I think; and Mr. Schram has a great notion of the English taste."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 100
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[57]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-018"
    "translation_ja": "一方シュラムさんの畑は谷でいちばん古く、たしか十八年になる。それでももとは一文なしの床屋だった。黒マルヴァジアを植えにここを開いたあとも、長いこと剃刀を持って谷を歩いていた。いまは景気のよさを絵に描いたようだ。ヴェランダには鳥の剥製、貯蔵庫は山腹の奥深くまで掘ってあって、山賊の洞窟のように柱で支える。もつれた原生林の中に、きちんと整った造りと、つやのある塗りと、花と、陽光とがある。小太りでにこやかなシュラム夫人は、ヨーロッパにも、どうやら合衆国じゅうにも遊びに出かけた人だ。私が貯蔵庫でワインを味わうあいだ、ヴェランダでファニーの相手をしてくれた。シュラムさんにとって試飲はおごそかな務めである。その真剣な意気込みに胸が温まった。繁盛してもまだ、新参者らしい、娘のようなはらはらする気持ちがすっかり消えたわけではない。一口ごとに私を見つめ、誇らしさと心配でそわそわしながら顔色を読んだ。私は全部を味わった。シュラムベルガーのあらゆる品種と色合い、赤と白、ブルゴーニュ風シュラムベルガー、ライン風シュラムベルガー、香りの立派なゴールデン・シャスラのシュラムベルガー。ほかにあといくつあったか、考えるのもこわい。かなりの量、たぶん大半はロンドンへ行く。シュラムさんはイングランド人の舌を大いに買っている。"
    "translation_status": "reviewed"
  - "id": "sv-wine-019"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In this wild spot, I did not feel the sacredness of ancient cultivation. It was still raw, it was no Marathon, and no Johannisberg; yet the stirring sunlight, and the growing vines, and the vats and bottles in the cavern, made a pleasant music for the mind. Here, also, earth’s cream was being skimmed and garnered; and the London customers can taste, such as it is, the tang of the earth in this green valley. So local, so quintessential is a wine, that it seems the very birds in the verandah might communicate a flavour, and that romantic cellar influence the bottle next to be uncorked in Pimlico, and the smile of jolly Mr. Schram might mantle in the glass."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 101
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[58]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-019"
    "translation_ja": "この野趣のある土地では、何代にもわたって耕した土地の神聖さは感じなかった。まだ生のままで、マラトンでもなければヨハニスベルクでもない。それでも、動く陽光、伸びる葡萄、洞穴の樽と瓶が、心にここちよい音楽を奏でた。ここでも地の上澄みをすくい取り、貯えていたのだ。ロンドンの客も、この緑の谷の土の味を、それなりに味わえるだろう。ワインはそれほど土地に根ざし、その土地の精髄を凝らしたものなので、ヴェランダの鳥さえもワインに香りを伝え、あの物語めいた貯蔵庫が、ピムリコで次に開けられる一本に働きかけ、陽気なシュラムさんの笑顔が杯に浮かぶのではないかと思えてくる。"
    "translation_status": "reviewed"
  - "id": "sv-wine-020"
    "section_id": "wine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But these are but experiments. All things in this new land are moving farther on: the wine-vats and the miner’s blasting tools but picket for a night, like Bedouin pavillions; and to-morrow, to fresh woods! This stir of change and these perpetual echoes of the moving footfall, haunt the land. Men move eternally, still chasing Fortune; and, fortune found, still wander. As we drove back to Calistoga, the road lay empty of mere passengers, but its green side was dotted with the camps of travelling families: one cumbered with a great waggonful of household stuff, settlers going to occupy a ranche they had taken up in Mendocino, or perhaps Tehama County; another, a party in dust coats, men and women, whom we found camped in a grove on the roadside, all on pleasure bent, with a Chinaman to cook for them, and who waved their hands to us as we drove by."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 102
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[59]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-wine-020"
    "translation_ja": "だが、これらはほんの実験にすぎない。この新しい土地では万事がもっと先へ進んでゆく。ワイン桶も鉱夫の発破道具も、ベドウィンの天幕のように、一夜だけ杭を打って留まるだけ。明日は新しい森へ！　この変化のざわめきと、絶えず遠ざかる足音のこだまが、土地につきまとう。人は運を追っていつまでも動き、運を手に入れてもまだ流れていく。カリストガへ馬車で帰るとき、道にただの通行人の姿はなかった。だが緑の道端には、旅をする家族の野営がぽつぽつ見えた。一組は所帯道具を満載した大きな荷馬車を引きずって、メンドシーノか、あるいはテハマ郡に手に入れた牧場に住みにいく開拓者。もう一組は埃よけの外套を着た男女で、道端の林に野営していた。みな遊びのために出てきたので、中国人の料理人を連れており、私たちが馬車で通ると、手を振ってくれた。"
    "translation_status": "reviewed"
  - "id": "sv-scot-001"
    "section_id": "scot"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER IV—THE SCOT ABROAD"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 103
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/h3[4]"
        "anchor": "page48"
        "printed_page": "48"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-001"
    "translation_ja": "第四章　異郷のスコットランド人"
    "translation_status": "reviewed"
  - "id": "sv-scot-002"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A few pages back, I wrote that a man belonged, in these days, to a variety of countries; but the old land is still the true love, the others are but pleasant infidelities. Scotland is indefinable; it has no unity except upon the map. Two languages, many dialects, innumerable forms of piety, and countless local patriotisms and prejudices, part us among ourselves more widely than the extreme east and west of that great continent of America. When I am at home, I feel a man from Glasgow to be something like a rival, a man from Barra to be more than half a foreigner. Yet let us meet in some far country, and, whether we hail from the braes of Manor or the braes of Mar, some ready-made affection joins us on the instant. It is not race. Look at us. One is Norse, one Celtic, and another Saxon. It is not community of tongue. We have it not among ourselves; and we have it almost to perfection, with English, or Irish, or American. It is no tie of faith, for we detest each other’s errors. And yet somewhere, deep down in the heart of each one of us, something yearns for the old land, and the old kindly people."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 104
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[60]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-002"
    "translation_ja": "何ページか前に、この時代には人は幾つもの国に属している、と書いた。だが本当に愛しているのはやはり古い故国であって、ほかはどれも楽しい浮気相手にすぎない。スコットランドとは何かと言い表すことはできない。まとまりがあるのは地図の上だけだ。二つの言語、さまざまな方言、無数の信仰の形、数えきれないほどの郷土びいきや偏見が、私たちを互いに隔てている。その隔たりは、あの広大なアメリカ大陸の東端と西端との差よりも大きい。私が国にいると、グラスゴーの男はなんとなく張り合う相手、バーラ島の男は異国人のようなところのほうが多いと感じる。それなのに、どこか遠い国で出会ってみるがいい。マナーの丘から来た者であれ、マーの丘から来た者であれ、以前から育まれていたような親しみが、たちまち私たちを結びつける。血筋ではない。私たちを見ればよい。一人はノルウェー系、一人はケルト系、また一人はサクソン系だ。同じ言葉を話すからでもない。私たち同士にも共通の言葉はないのに、イングランドやアイルランドやアメリカの人々とは、ほとんど申し分なく言葉が通じる。信仰の絆でもない。めいめいが、ほかの者の信仰は間違っていると忌み嫌っている。それでも私たち一人一人の胸の奥深く、昔の国と、昔の親切な人々を恋しく思う何かがある。"
    "translation_status": "reviewed"
  - "id": "sv-scot-003"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of all mysteries of the human heart, this is perhaps the most inscrutable. There is no special loveliness in that gray country, with its rainy, sea-beat archipelago; its fields of dark mountains; its unsightly places, black with coal; its treeless, sour, unfriendly looking corn-lands; its quaint, gray, castled city, where the bells clash of a Sunday, and the wind squalls, and the salt showers fly and beat. I do not even know if I desire to live there; but let me hear, in some far land, a kindred voice sing out, “Oh, why left I my hame?” and it seems at once as if no beauty under the kind heavens, and no society of the wise and good, can repay me for my absence from my country. And though I think I would rather die elsewhere, yet in my heart of hearts I long to be buried among good Scots clods. I will say it fairly, it grows on me with every year: there are no stars so lovely as Edinburgh street-lamps. When I forget thee, auld Reekie, may my right hand forget its cunning!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 105
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[61]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-003"
    "translation_ja": "人の心にまつわる謎のうち、たぶんこれがいちばん解きがたい。あの灰色の国に、とりたてて美しいところはない。雨に濡れ波に打たれる島々。見わたすかぎりの暗い山々。石炭で黒ずんだ見苦しい土地。木一本なく、痩せてよそよそしい穀物畑。風変わりな灰色の町には城があり、日曜には鐘がぶつかるように鳴り、風がわめき、潮まじりのにわか雨が横なぐりに打ちつける。あそこに住みたいかどうかさえ、自分でわからない。だが遠い国にいて、故郷と同じ声で「ああ、なんでわしは故郷を出たか」とひと節歌うのを聞くと、たちまちこう思う。慈悲深い空の下にどんな美しさがあろうと、どれほど賢く善良な人たちと交わろうと、故国を離れている埋め合わせにはならない。そしてよそで死ぬほうがよいと思いながらも、心の底ではスコットランドの土くれに包まれて葬られたいと願っている。はっきり言おう。年を重ねるほどにそう思う。エディンバラの街灯ほど美しい星はない。煤けた古都よ、もしお前を忘れる日が来たら、わが右手もその技を忘れてしまうがよい！"
    "translation_status": "reviewed"
  - "id": "sv-scot-004"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The happiest lot on earth is to be born a Scotchman. You must pay for it in many ways, as for all other advantages on earth. You have to learn the paraphrases and the shorter catechism; you generally take to drink; your youth, as far as I can find out, is a time of louder war against society, of more outcry and tears and turmoil, than if you had been born, for instance, in England. But somehow life is warmer and closer; the hearth burns more redly; the lights of home shine softer on the rainy street; the very names, endeared in verse and music, cling nearer round our hearts. An Englishman may meet an Englishman to-morrow, upon Chimborazo, and neither of them care; but when the Scotch wine-grower told me of Mons Meg, it was like magic."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 106
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[62]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-004"
    "translation_ja": "この世でいちばん幸運なのは、スコットランド人に生まれることだ。もっともこの世のほかの恵みと同じで、代償はいろいろ払わなければならない。聖句を引き直した賛歌と小教理問答を覚えなければならないし、たいてい酒にも手を出す。私の見るかぎり若いころは、たとえばイングランドで生まれた場合より世間を相手に騒がしい戦いを繰り広げ、もっとわめき、もっと泣き、もっとじたばたする。だがどういうものか、暮らしにはぬくもりがあり、人のつながりが近い。火は炉でいっそう赤く燃え、家々の灯は雨の通りへいっそうやわらかく差す。詩や音楽で親しんだ地名は、それだけでいっそう強く胸に抱きついてくる。イングランド人は、明日チンボラソで同国人に会っても、お互いどうということはないかもしれない。だがスコットランド出の葡萄栽培家がモンス・メグ砲の話をしてくれたとき、私には魔法のようだった。"
    "translation_status": "reviewed"
  - "id": "sv-scot-005"
    "section_id": "scot"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “From the dim shieling on the misty island
      Mountains divide us, and a world of seas;
      Yet still our hearts are true, our hearts are Highland,
      And we, in dreams, behold the Hebrides.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 107
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[3]/div/p"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-005"
    "translation_ja": |-
      「霧の島の、ほの暗い夏の山小屋から、
      山々が私たちを隔て、海は果てしない。
      それでも心はあの地を裏切らず、今もハイランドにいて、
      夢に見るのはヘブリディーズの島々。」
    "translation_status": "reviewed"
    "attributions":
      - "voice": "unknown"
        "evidence_ja": "底本では引用の作者が明記されない。"
  - "id": "sv-scot-006"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And, Highland and Lowland, all our hearts are Scotch."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 108
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[63]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-006"
    "translation_ja": "ハイランドもローランドも、私たちの心はみなスコットランドにある。"
    "translation_status": "reviewed"
  - "id": "sv-scot-007"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Only a few days after I had seen M’Eckron, a message reached me in my cottage. It was a Scotchman who had come down a long way from the hills to market. He had heard there was a countryman in Calistoga, and came round to the hotel to see him. We said a few words to each other; we had not much to say—should never have seen each other had we stayed at home, separated alike in space and in society; and then we shook hands, and he went his way again to his ranche among the hills, and that was all."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 109
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[64]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-007"
    "translation_ja": "マケクロンさんに会ってほんの数日後、私の小家に訪ねてきた人がいるという知らせが届いた。遠い山から市に出てきたスコットランド人だった。カリストガに同郷の者がいると聞き、ひと目会おうとホテルへまわってきたのである。私たちは二言三言かわした。話すことはさほどなかった。国に残っていたら、住む場所もつきあいの範囲もそれぞれ別で、顔を合わせることなどなかっただろう。それから握手をして、彼は山の牧場に帰っていった。それだけのことだ。"
    "translation_status": "reviewed"
  - "id": "sv-scot-008"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Another Scotchman there was, a resident, who for the more love of the common country, douce, serious, religious man, drove me all about the valley, and took as much interest in me as if I had been his son: more, perhaps; for the son has faults too keenly felt, while the abstract countryman is perfect—like a whiff of peats."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 110
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[65]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-008"
    "translation_ja": "もう一人、この土地に住むスコットランド人がいた。穏やかで生真面目な信心深い男で、故郷が同じだというだけで、私を馬車に乗せて谷のあちこちへ連れていき、私をまるで息子のように気にかけた。いや、ひょっとすると息子以上に。息子なら欠点がいやというほど目につくが、ただの同郷人なら非の打ちどころがない。泥炭を焚く匂いがほのかに漂ってきたようなものだ。"
    "translation_status": "reviewed"
  - "id": "sv-scot-009"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And there was yet another. Upon him I came suddenly, as he was calmly entering my cottage, his mind quite evidently bent on plunder: a man of about fifty, filthy, ragged, roguish, with a chimney-pot hat and a tail coat, and a pursing of his mouth that might have been envied by an elder of the kirk. He had just such a face as I have seen a dozen times behind the plate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 111
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[66]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-009"
    "translation_ja": "さらにもう一人いた。そいつには、小家へ平然と入り込もうとしているところでばったり出くわした。何かくすねる腹なのは見え透いていた。五十くらいで、不潔で、ぼろをまとった、ずるそうな男だ。煙突みたいな山高帽に燕尾服を着込み、口をつぼめた顔つきは、スコットランドの教会の長老が見たらうらやむほどだった。献金皿を持つ役に、同じ顔を十人あまり見た覚えがある。"
    "translation_status": "reviewed"
  - "id": "sv-scot-010"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hullo, sir!” I cried. “Where are you going?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 112
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[67]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-010"
    "translation_ja": "「おい、あんた！」と私は呼びかけた。「どこへ行くんだ？」"
    "translation_status": "reviewed"
  - "id": "sv-scot-011"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He turned round without a quiver."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 113
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[68]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-011"
    "translation_ja": "彼は眉ひとつ動かさず振り向いた。"
    "translation_status": "reviewed"
  - "id": "sv-scot-012"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You’re a Scotchman, sir?” he said gravely. “So am I; I come from Aberdeen. This is my card,” presenting me with a piece of pasteboard which he had raked out of some gutter in the period of the rains. “I was just examining this palm,” he continued, indicating the misbegotten plant before our door, “which is the largest spacimen I have yet observed in Califoarnia.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 114
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[69]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-012"
    "translation_ja": "「お国はスコットランドですな？」と、まじめな顔で言った。「わしもです。アバディーンの出です。これ、わしの名刺ですわ」。そう言って差し出したのは、雨の季節にどこかの溝から拾い上げた厚紙の切れ端だった。「ちょうどこのヤシを調べとったんです」と、うちの戸の前にある不格好な木を指さした。「これまでカリフォーニヤで見た標本では、いちばん大きいでしてな」"
    "translation_status": "reviewed"
  - "id": "sv-scot-013"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There were four or five larger within sight. But where was the use of argument? He produced a tape-line, made me help him to measure the tree at the level of the ground, and entered the figures in a large and filthy pocket-book, all with the gravity of Solomon. He then thanked me profusely, remarking that such little services were due between countrymen; shook hands with me, “for add lang syne,” as he said; and took himself solemnly away, radiating dirt and humbug as he went."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 115
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[70]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-013"
    "translation_ja": "見渡せば四、五本はもっと大きいのがあった。だが言い争ってどうなる。彼は巻尺を出して私に手伝わせ、地面すれすれで木の周りを測り、大きな薄汚い手帳に数字を書き込んだ。ことごとくソロモン王のようなもったいぶりようだった。それから、同じ国の者同士、このくらいのことはして当然だと言いながら、しきりに礼を述べた。本人の言葉では「昔のよしみで」私と手を握り、汚さといかさまを振りまきながら、おごそかに立ち去った。"
    "translation_status": "reviewed"
  - "id": "sv-scot-014"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A month or two after this encounter of mine, there came a Scot to Sacramento—perhaps from Aberdeen. Anyway, there never was any one more Scotch in this wide world. He could sing and dance, and drink, I presume; and he played the pipes with vigour and success. All the Scotch in Sacramento became infatuated with him, and spent their spare time and money, driving him about in an open cab, between drinks, while he blew himself scarlet at the pipes. This is a very sad story. After he had borrowed money from every one, he and his pipes suddenly disappeared from Sacramento, and when I last heard, the police were looking for him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 116
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[71]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-014"
    "translation_ja": "私がこの男に出会ってから一、二か月して、サクラメントにスコットランド人が現れた。ひょっとするとアバディーンから来たのかもしれない。とにかくこの広い世の中で、これほどスコットランド人らしい男はまたといなかった。歌えて踊れて、おそらく酒も飲めたろうし、バグパイプは勢いよく、しかも巧みに吹いた。サクラメントのスコットランド人はみな彼に夢中になった。暇も金もつぎ込んで、酒場から酒場へと幌のない馬車で彼を走らせ、当人はその間じゅう真っ赤な顔でバグパイプを吹いた。まことに悲しい話である。みんなから金を借りたあと、彼もバグパイプもいきなりサクラメントから消えた。私が最後に聞いたときは、警察が彼を捜していた。"
    "translation_status": "reviewed"
  - "id": "sv-scot-015"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I cannot say how this story amused me, when I felt myself so thoroughly ripe on both sides to be duped in the same way."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 117
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[72]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-015"
    "translation_ja": "この話がおかしくてならなかった。自分自身を顧みても、どちらから来られようとそっくり同じ手で騙されるお膳立てはすっかり整っていたのだから。"
    "translation_status": "reviewed"
  - "id": "sv-scot-016"
    "section_id": "scot"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is at least a curious thing, to conclude, that the races which wander widest, Jews and Scotch, should be the most clannish in the world. But perhaps these two are cause and effect: “For ye were strangers in the land of Egypt.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 118
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[73]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-scot-016"
    "translation_ja": "結びに一つ、少なくとも妙なことがある。居場所を求めて最も広く渡り歩く民、ユダヤ人とスコットランド人が、世界の誰よりも身内同士で固まる。これには、ひょっとすると因果があるのかもしれない。「汝らはエジプトの地で寄留者であったからである」。"
    "translation_status": "reviewed"
  - "id": "sv-israel-001"
    "section_id": "israel"
    "kind": "heading"
    "origin": "source"
    "source_text": "PART II—WITH THE CHILDREN OF ISRAEL"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 119
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"

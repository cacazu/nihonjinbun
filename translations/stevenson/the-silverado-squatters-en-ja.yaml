  - "id": "sv-intro-002"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The scene of this little book is on a high mountain. There are, indeed, many higher; there are many of a nobler outline. It is no place of pilgrimage for the summary globe-trotter; but to one who lives upon its sides, Mount Saint Helena soon becomes a centre of interest. It is the Mont Blanc of one section of the Californian Coast Range, none of its near neighbours rising to one-half its altitude. It looks down on much green, intricate country. It feeds in the spring-time many splashing brooks. From its summit you must have an excellent lesson of geography: seeing, to the south, San Francisco Bay, with Tamalpais on the one hand and Monte Diablo on the other; to the west and thirty miles away, the open ocean; eastward, across the corn-lands and thick tule swamps of Sacramento Valley, to where the Central Pacific railroad begins to climb the sides of the Sierras; and northward, for what I know, the white head of Shasta looking down on Oregon. Three counties, Napa County, Lake County, and Sonoma County, march across its cliffy shoulders. Its naked peak stands nearly four thousand five hundred feet above the sea; its sides are fringed with forest; and the soil, where it is bare, glows warm with cinnabar."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 46
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[8]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-002"
    "translation_ja": "この小さな本の舞台は、高い山の上である。むろん、もっと高い山はいくらもあり、もっと堂々とした山容もいくらでもある。世界を駆け足で回る旅行者がわざわざ詣でるところではない。しかしその斜面に住んでみると、たちまちセント・ヘレナ山に心を奪われる。この山はカリフォルニア海岸山脈のこの一帯では、さながらモンブランである。近くの山はどれもその半分の高さにも届かない。見下ろせば、緑の起伏に富む地が広がる。春にはしぶきを上げる幾筋もの小川に水を送る。頂上に立てば、さぞ立派な地理の授業が受けられることだろう。南には一方にタマルパイス山、もう一方にモンテ・ディアブロを従えたサンフランシスコ湾。西には三十マイル離れた外洋。東にはサクラメント谷の畑と、トゥーリーの密生する沼を越え、セントラル・パシフィック鉄道がシエラの山腹を登り始めるところまで。北には、ひょっとすると、オレゴンを見下ろすシャスタの白い頭まで見えるかもしれない。ナパ、レイク、ソノマの三郡が、岩がちな肩をまたいでいる。裸の峰は海面から四千五百フィート近くに立ち、斜面には森が縁取りをなし、地の露出したところは辰砂で暖かい色に輝く。"
    "translation_status": "reviewed"
  - "id": "sv-intro-003"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Life in its shadow goes rustically forward. Bucks, and bears, and rattlesnakes, and former mining operations, are the staple of men’s talk. Agriculture has only begun to mount above the valley. And though in a few years from now the whole district may be smiling with farms, passing trains shaking the mountain to the heart, many-windowed hotels lighting up the night like factories, and a prosperous city occupying the site of sleepy Calistoga; yet in the mean time, around the foot of that mountain the silence of nature reigns in a great measure unbroken, and the people of hill and valley go sauntering about their business as in the days before the flood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 47
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[9]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-003"
    "translation_ja": "その山陰では、田舎なりの暮らしが進んでゆく。雄鹿、熊、ガラガラヘビ、それから昔の鉱山仕事が、男たちの話の種だ。農地はようやく谷より高いところへ上り始めたばかり。数年もすれば、一帯に農園がのどかに開け、列車が通るたび山の芯まで揺れ、窓の多いホテルが工場のように夜を照らし、眠たげなカリストガの跡には栄える町ができるかもしれない。だが今のところ、山の麓を包む自然の静けさはあらかた手つかずで、山と谷の人々は大洪水以前さながら、のんびり歩いて日々の用を足している。"
    "translation_status": "reviewed"
  - "id": "sv-intro-004"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To reach Mount Saint Helena from San Francisco, the traveller has twice to cross the bay: once by the busy Oakland Ferry, and again, after an hour or so of the railway, from Vallejo junction to Vallejo. Thence he takes rail once more to mount the long green strath of Napa Valley."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 48
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[10]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-004"
    "translation_ja": "サンフランシスコからセント・ヘレナ山へ行く者は、湾を二度渡らなければならない。一度は往来の多いオークランドの渡し船で、もう一度は一時間ほど汽車に乗ったあと、ヴァレーホ分岐点からヴァレーホまで。そこからまた汽車に乗って、長く緑の続くナパ谷をさかのぼる。"
    "translation_status": "reviewed"
  - "id": "sv-intro-005"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In all the contractions and expansions of that inland sea, the Bay of San Francisco, there can be few drearier scenes than the Vallejo Ferry. Bald shores and a low, bald islet inclose the sea; through the narrows the tide bubbles, muddy like a river. When we made the passage (bound, although yet we knew it not, for Silverado) the steamer jumped, and the black buoys were dancing in the jabble; the ocean breeze blew killing chill; and, although the upper sky was still unflecked with vapour, the sea fogs were pouring in from seaward, over the hilltops of Marin county, in one great, shapeless, silver cloud."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 49
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[11]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-005"
    "translation_ja": "この内海、サンフランシスコ湾は狭まったり広がったりするが、そのどこを探しても、ヴァレーホの渡しほど陰気な光景はめったにあるまい。草木のない岸と、低くむきだしの小島に海が囲まれ、狭い水路を川のように濁った潮が泡立って流れる。私たちが渡ったときは（行き先はシルヴェラードだったのだが、まだ自分たちにはわからなかった）、汽船が跳ね、黒い浮標が波のざわめきに踊っていた。海からの風は凍えるほど冷たかった。高い空にはまだ雲ひとつかかっていなかったのに、海霧が外洋からマリン郡の丘を越え、形の定まらぬ大きな銀色の雲となって流れ込んでいた。"
    "translation_status": "reviewed"
  - "id": "sv-intro-006"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "South Vallejo is typical of many Californian towns. It was a blunder; the site has proved untenable; and, although it is still such a young place by the scale of Europe, it has already begun to be deserted for its neighbour and namesake, North Vallejo. A long pier, a number of drinking saloons, a hotel of a great size, marshy pools where the frogs keep up their croaking, and even at high noon the entire absence of any human face or voice—these are the marks of South Vallejo. Yet there was a tall building beside the pier, labelled the Star Flour Mills; and sea-going, full-rigged ships lay close along shore, waiting for their cargo. Soon these would be plunging round the Horn, soon the flour from the Star Flour Mills would be landed on the wharves of Liverpool. For that, too, is one of England’s outposts; thither, to this gaunt mill, across the Atlantic and Pacific deeps and round about the icy Horn, this crowd of great, three-masted, deep-sea ships come, bringing nothing, and return with bread."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 50
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[12]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-006"
    "translation_ja": "南ヴァレーホは、カリフォルニアの多くの町の見本である。そもそも見込み違いだったのだ。立地はどうにもならず、ヨーロッパの尺度からすればまだ生まれたてなのに、同じ名を持つ隣町、北ヴァレーホに人を取られ、早くも見捨てられかけている。長い桟橋、いくつもの酒場、ばかに大きなホテル、蛙が鳴きやまぬ沼地。まっ昼間でさえ人の顔も声もまるでない。このあたりが南ヴァレーホの目印だ。それでも桟橋のかたわらに〈スター製粉所〉と看板を掲げた高い建物があり、帆装の整った外洋船が岸に寄って積荷を待っていた。やがて船は波に突っ込みながらホーン岬を回り、〈スター製粉所〉の小麦粉はリヴァプールの埠頭で荷揚げされる。ここもまたイングランドの出先なのだ。このひょろ長い製粉所めがけ、大西洋と太平洋の深い水を越え、氷のホーン岬を回って、大型の外洋三檣船が何艘も、何も運び込まずにやって来て、パンの糧を持って帰る。"
    "translation_status": "reviewed"
  - "id": "sv-intro-007"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Frisby House, for that was the name of the hotel, was a place of fallen fortunes, like the town. It was now given up to labourers, and partly ruinous. At dinner there was the ordinary display of what is called in the west a two-bit house: the tablecloth checked red and white, the plague of flies, the wire hencoops over the dishes, the great variety and invariable vileness of the food and the rough coatless men devoting it in silence. In our bedroom, the stove would not burn, though it would smoke; and while one window would not open, the other would not shut. There was a view on a bit of empty road, a few dark houses, a donkey wandering with its shadow on a slope, and a blink of sea, with a tall ship lying anchored in the moonlight. All about that dreary inn frogs sang their ungainly chorus."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 51
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[13]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-007"
    "translation_ja": "ホテルは〈フリスビー・ハウス〉といったが、町と同様にかつての栄えを失っていた。今は労働者宿となり、一部は崩れかけている。夕食には、西部でいう二ビット（二十五セント）宿のお定まりの品がそろった。赤白の格子の卓布、群がる蠅、料理を覆う金網の鳥籠、種類だけは多くてどれもひどい食べ物、それを上着も着ず黙って平らげる、むさ苦しい男たち。寝室ではストーブに火がつかないくせに煙は出た。一方の窓は開かず、もう一方は閉まらない。見えるものは、人のいない道の一部、暗い家が何軒か、坂を自分の影とともにうろつくロバ、それに海がちらりと。月明かりの中、高い帆柱の船が錨を下ろしていた。陰気な宿を取り巻いて、蛙がぶかっこうな合唱をしていた。"
    "translation_status": "reviewed"
  - "id": "sv-intro-008"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Early the next morning we mounted the hill along a wooden footway, bridging one marish spot after another. Here and there, as we ascended, we passed a house embowered in white roses. More of the bay became apparent, and soon the blue peak of Tamalpais rose above the green level of the island opposite. It told us we were still but a little way from the city of the Golden Gates, already, at that hour, beginning to awake among the sand-hills. It called to us over the waters as with the voice of a bird. Its stately head, blue as a sapphire on the paler azure of the sky, spoke to us of wider outlooks and the bright Pacific. For Tamalpais stands sentry, like a lighthouse, over the Golden Gates, between the bay and the open ocean, and looks down indifferently on both. Even as we saw and hailed it from Vallejo, seamen, far out at sea, were scanning it with shaded eyes; and, as if to answer to the thought, one of the great ships below began silently to clothe herself with white sails, homeward bound for England."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 52
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[14]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-008"
    "translation_ja": "翌朝早く、私たちは湿地を次々に渡る板敷きの歩道を通って、丘を登った。途中、白薔薇に包まれた家がところどころあった。湾の見える範囲が広がり、まもなく向こうの島の緑の平らな輪郭の上に、タマルパイスの青い峰がそびえた。私たちはまだゴールデン・ゲートの都からそう離れていないのだ。その時刻、砂丘のあいだで都はもう目を覚まし始めている。山は鳥の声のように水を越えて私たちを呼んだ。淡い青空を背に、サファイアのように青いその威厳ある頭は、もっと広い眺めと、明るい太平洋のことを語った。タマルパイスは湾と外洋のあいだ、ゴールデン・ゲートを灯台さながらに見張り、どちらにも肩入れせず見下ろしている。ヴァレーホから私たちがそれに目をとめて挨拶を送った同じとき、沖はるかでは船乗りが手をかざして山の姿を探していたに違いない。するとその思いに応えるように、眼下の大船の一つが音もなく白い帆を身にまとい始めた。故国イングランドへ向かうところだった。"
    "translation_status": "reviewed"
  - "id": "sv-intro-009"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For some way beyond Vallejo the railway led us through bald green pastures. On the west the rough highlands of Marin shut off the ocean; in the midst, in long, straggling, gleaming arms, the bay died out among the grass; there were few trees and few enclosures; the sun shone wide over open uplands, the displumed hills stood clear against the sky. But by-and-by these hills began to draw nearer on either hand, and first thicket and then wood began to clothe their sides; and soon we were away from all signs of the sea’s neighbourhood, mounting an inland, irrigated valley. A great variety of oaks stood, now severally, now in a becoming grove, among the fields and vineyards. The towns were compact, in about equal proportions, of bright, new wooden houses and great and growing forest trees; and the chapel bell on the engine sounded most festally that sunny Sunday, as we drew up at one green town after another, with the townsfolk trooping in their Sunday’s best to see the strangers, with the sun sparkling on the clean houses, and great domes of foliage humming overhead in the breeze."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 53
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[15]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-009"
    "translation_ja": "ヴァレーホを過ぎてしばらく、鉄道は木のない緑の牧草地を走った。西には荒々しいマリンの高地が海を遮り、中央では、長く曲がりくねって光る湾の腕が何本も草の中に消えていった。木も囲いもめったにない。開けた高地いっぱいに日が当たり、飾りをはぎ取られたような丘は空を背に輪郭が鮮やかだった。やがて両側の丘が次第に迫ってきた。山腹にまず茂みが、次には森が衣を着せ始める。まもなく海の近いしるしはすっかり消え、私たちは灌漑の行き届いた内陸の谷を登っていた。畑や葡萄畑のあいだには、さまざまなナラが一本ずつ、あるいは見栄えのする林となって立っている。町はどこも、新しく明るい木造の家々と、すでに大きくなお生い茂る森の木とが、ほとんど半々といったところだった。晴れた日曜日、小さな緑の町に停まるたび、機関車の鐘は礼拝堂の鐘さながら祝日の音を響かせた。よそ者をひと目見ようと、町の人々が日曜の晴れ着で繰り出した。清潔な家々に日がきらめき、頭上には大きな葉の丸屋根が風を受け、さやさやと鳴っていた。"
    "translation_status": "reviewed"
  - "id": "sv-intro-010"
    "section_id": "intro"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This pleasant Napa Valley is, at its north end, blockaded by our mountain. There, at Calistoga, the railroad ceases, and the traveller who intends faring farther, to the Geysers or to the springs in Lake County, must cross the spurs of the mountain by stage. Thus, Mount Saint Helena is not only a summit, but a frontier; and, up to the time of writing, it has stayed the progress of the iron horse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 54
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[16]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-intro-010"
    "translation_ja": "心地よいナパ谷を北の端でふさいでいるのが、私たちの山である。そこにあるカリストガが線路の終点で、さらに先のガイザーズやレイク郡の湯へ行く旅人は、山から突き出した尾根を駅馬車で越さなければならない。こうしてセント・ヘレナ山は一つの頂であるばかりでなく、境でもあり、これを書いている今まで鉄の馬の進撃を食い止めてきた。"
    "translation_status": "reviewed"

  - "id": "sv-squatting-011"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Where is John Stanley mining now? Where is S. Chapman, within whose hospitable walls we were to lodge? The date was but five years old, but in that time the world had changed for Silverado; like Palmyra in the desert, it had outlived its people and its purpose; we camped, like Layard, amid ruins, and these names spoke to us of prehistoric time. A boot-jack, a pair of boots, a dog-hutch, and these bills of Mr. Chapman’s were the only speaking relics that we disinterred from all that vast Silverado rubbish-heap; but what would I not have given to unearth a letter, a pocket-book, a diary, only a ledger, or a roll of names, to take me back, in a more personal manner, to the past? It pleases me, besides, to fancy that Stanley or Chapman, or one of their companions, may light upon this chronicle, and be struck by the name, and read some news of their anterior home, coming, as it were, out of a subsequent epoch of history in that quarter of the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 190
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[128]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-011"
    "translation_ja": "ジョン・スタンリーは今どこで鉱石を掘っているのか。今夜から私たちが厄介になる、この宿を営んでいたＳ・チャップマンはどこか。日付はたった五年前だが、その間にシルヴェラードにとって世界が変わってしまった。砂漠のパルミラのように、住む人も町の役目も失ってなお残った。私たちはレヤードのように廃墟に陣を張り、その名は先史時代から響くようだった。長靴脱ぎと長靴一足、犬小屋とチャップマン氏の勘定書だけが、この広大なシルヴェラードのがらくたの山から掘り出した、何かを語る遺物だった。だが手紙、手帳、日記を掘り出せるなら、帳簿一冊、人の名簿だけでもよい、過去をもっと身近に感じられるなら、何を差し出しても惜しくなかったろう。それにスタンリーかチャップマンか、あるいは昔の仲間の一人が、この年代記に行き当たり、その名に目をとめ、以前住んだ場所の便りを、あの一角の歴史のいわば次の時代から届いた便りとして読むかもしれない、と思うのも楽しい。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-012"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As we were tumbling the mingled rubbish on the floor, kicking it with our feet, and groping for these written evidences of the past, Sam, with a somewhat whitened face, produced a paper bag. “What’s this?” said he. It contained a granulated powder, something the colour of Gregory’s Mixture, but rosier; and as there were several of the bags, and each more or less broken, the powder was spread widely on the floor. Had any of us ever seen giant powder? No, nobody had; and instantly there grew up in my mind a shadowy belief, verging with every moment nearer to certitude, that I had somewhere heard somebody describe it as just such a powder as the one around us. I have learnt since that it is a substance not unlike tallow, and is made up in rolls for all the world like tallow candles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 191
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[129]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-012"
    "translation_ja": "床でごちゃ混ぜになったがらくたをひっくり返し、足でけり分け、過去を伝える書き物を探っていたところ、少し顔を青くしたサムが紙袋を出してきた。「これ何だい？」　中は粒状の粉末で、胃薬のグレゴリー散のような、もう少し赤みがかった色だった。袋が幾つもあり、どれも多少なりと破れていたので、粉は床のだいぶ広い範囲に散っていた。ジャイアント・パウダーという発破薬を誰か見たことがあるか。いや、誰もない。その途端、以前どこかで、今私たちのまわりにある粉にそっくりだと聞いたことがある、というぼんやりした思いが胸に浮かび、刻一刻と確信に近づいていった。あとで知ったのだが、実物は脂蝋のようなもので、獣脂の蝋燭にそっくりの棒状になっている。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-013"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Fanny, to add to our happiness, told us a story of a gentleman who had camped one night, like ourselves, by a deserted mine. He was a handy, thrifty fellow, and looked right and left for plunder, but all he could lay his hands on was a can of oil. After dark he had to see to the horses with a lantern; and not to miss an opportunity, filled up his lamp from the oil can. Thus equipped, he set forth into the forest. A little while after, his friends heard a loud explosion; the mountain echoes bellowed, and then all was still. On examination, the can proved to contain oil, with the trifling addition of nitro-glycerine; but no research disclosed a trace of either man or lantern."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 192
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[130]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-013"
    "translation_ja": "私たちをいっそう幸せにしようとでもいうように、ファニーは、私たち同様、廃鉱のそばで一晩野宿した男の話を聞かせてくれた。手まめで倹約家で、何か使えるものはないかとあたりを漁ったが、油の缶一つしか手に入らなかった。日が暮れてから角灯を持って馬の様子を見にいくことになり、よい機会とばかりにその缶から灯に油を足した。そうして身支度を整え、森へ向かった。しばらくすると連れは大きな爆発を聞いた。山々がその音をわめき返し、それきり静まりかえった。調べると缶には油が入っていて、ただしニトログリセリンというささやかな添え物も入っていた。男も角灯も、いくら捜しても跡形さえ見つからなかった。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-014"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was a pretty sight, after this anecdote, to see us sweeping out the giant powder. It seemed never to be far enough away. And, after all, it was only some rock pounded for assay."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 193
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[131]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-014"
    "translation_ja": "その話のあと、私たちがジャイアント・パウダーを掃き出す光景は、なかなか見事だった。どれだけ遠くへやっても、まだ近すぎる気がした。結局は、分析のために砕いた石だったのだが。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-015"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So much for the lower room. We scraped some of the rougher dirt off the floor, and left it. That was our sitting-room and kitchen, though there was nothing to sit upon but the table, and no provision for a fire except a hole in the roof of the room above, which had once contained the chimney of a stove."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 194
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[132]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-015"
    "translation_ja": "下の部屋はそれまでにして、床からひどい汚れだけこそげ取っておいた。そこが居間兼台所である。腰を掛けられるのは机の上だけで、火に関する設備といえば、上の部屋の屋根に穴が開いているだけで、かつてはそこにストーブの煙突が通っていたのだが。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-016"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To that upper room we now proceeded. There were the eighteen bunks in a double tier, nine on either hand, where from eighteen to thirty-six miners had once snored together all night long, John Stanley, perhaps, snoring loudest. There was the roof, with a hole in it through which the sun now shot an arrow. There was the floor, in much the same state as the one below, though, perhaps, there was more hay, and certainly there was the added ingredient of broken glass, the man who stole the window-frames having apparently made a miscarriage with this one. Without a broom, without hay or bedding, we could but look about us with a beginning of despair. The one bright arrow of day, in that gaunt and shattered barrack, made the rest look dirtier and darker, and the sight drove us at last into the open."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 195
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[133]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-016"
    "translation_ja": "次はその上の部屋に移った。左右二組に分かれて、九つずつ、合わせて十八の寝台がある。その昔は十八人から三十六人もの鉱夫が、一晩じゅう一緒にいびきをかいて寝た所だ。ジョン・スタンリーのいびきがたぶんいちばん大きかった。屋根には穴があり、今ちょうど陽が矢を射込んでいた。床は下と似たり寄ったりだが、干し草がいくらか多いようで、割れたガラスが加わっているのは確かだった。窓枠を盗った男が、この窓ではしくじったらしい。箒も、干し草も、寝具もない。途方に暮れかけて、あたりを見回すことしかできなかった。むき出しで荒れ果てた兵舎めいた部屋に、あの昼の矢が一筋明るく射すと、残りはいっそう汚く暗く見えた。たまらず私たちは外へ出た。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-017"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Here, also, the handiwork of man lay ruined: but the plants were all alive and thriving; the view below was fresh with the colours of nature; and we had exchanged a dim, human garret for a corner, even although it were untidy, of the blue hall of heaven. Not a bird, not a beast, not a reptile. There was no noise in that part of the world, save when we passed beside the staging, and heard the water musically falling in the shaft."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 196
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[134]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-017"
    "translation_ja": "外も人の手になるものは荒れ果てていた。だが草木はみな生き生き茂り、見下ろす景色には自然の新鮮な色があふれ、薄暗い人の屋根裏から、散らかってはいても青い天の大広間のひと隅へと移ったのだった。鳥一羽、獣一匹、這うもの一匹いない。このあたりの世界に物音はなく、足場のそばを通るとき、斜坑に落ちる水が音楽のように響くのを聞くだけだった。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-018"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We wandered to and fro. We searched among that drift of lumber-wood and iron, nails and rails, and sleepers and the wheels of tracks. We gazed up the cleft into the bosom of the mountain. We sat by the margin of the dump and saw, far below us, the green treetops standing still in the clear air. Beautiful perfumes, breaths of bay, resin, and nutmeg, came to us more often and grew sweeter and sharper as the afternoon declined. But still there was no word of Hanson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 197
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[135]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-018"
    "translation_ja": "私たちはあたりをぶらついた。材木と古鉄の寄せ集まったところを探り、釘やレール、枕木やトロッコの車輪の間を見てまわった。裂け目を仰いで山の胸の奥をのぞいた。捨石の山の縁に腰かけると、はるか下、澄んだ空気の中に緑の梢がじっと立っていた。午後が傾くにつれ、月桂樹と松脂とカリフォルニア・ナツメグの美しい香りがひんぱんに漂い、いよいよ甘く、いよいよ冴えてきた。だがハンソンからはまだ何の音沙汰もない。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-019"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I set to with pick and shovel, and deepened the pool behind the shaft, till we were sure of sufficient water for the morning; and by the time I had finished, the sun had begun to go down behind the mountain shoulder, the platform was plunged in quiet shadow, and a chill descended from the sky. Night began early in our cleft. Before us, over the margin of the dump, we could see the sun still striking aslant into the wooded nick below, and on the battlemented, pine-bescattered ridges on the farther side."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 198
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[136]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-019"
    "translation_ja": "つるはしとシャベルで斜坑の裏の水溜まりを掘り深め、朝に使うのに十分な水を確保した。仕事が終わるころには太陽が山の肩の向こうへ沈み始め、平場は静かな影にひたり、空から冷気が下りてきた。私たちの裂け目には夜が早く訪れた。目の前、捨石の山の縁の向こうでは、日差しがまだ下の木の茂った切れ込みや、対岸の松の点在する胸壁のような尾根に、斜めに当たっていた。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-020"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was no stove, of course, and no hearth in our lodging, so we betook ourselves to the blacksmith’s forge across the platform. If the platform be taken as a stage, and the out-curving margin of the dump to represent the line of the foot-lights, then our house would be the first wing on the actor’s left, and this blacksmith’s forge, although no match for it in size, the foremost on the right. It was a low, brown cottage, planted close against the hill, and overhung by the foliage and peeling boughs of a madrona thicket. Within it was full of dead leaves and mountain dust, and rubbish from the mine. But we soon had a good fire brightly blazing, and sat close about it on impromptu seats. Chuchu, the slave of sofa-cushions, whimpered for a softer bed; but the rest of us were greatly revived and comforted by that good creature-fire, which gives us warmth and light and companionable sounds, and colours up the emptiest building with better than frescoes. For a while it was even pleasant in the forge, with the blaze in the midst, and a look over our shoulders on the woods and mountains where the day was dying like a dolphin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 199
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[137]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-020"
    "translation_ja": "住まいには当然、ストーブも炉もない。そこで平場の向こうの鍛冶場へ行った。平場を舞台と見なし、張り出した捨石の縁が脚光の列だとすれば、私たちの家は役者から見て左の、いちばん手前の舞台袖にあり、この鍛冶場は大きさでとても及ばぬものの、右のいちばん前にある。山へぴったり寄せて建てた低い茶色い小家で、マドロナの藪が葉と樹皮のむける枝を上に張り出していた。中は枯れ葉、山の埃、鉱山のがらくたでいっぱいだった。だがじきに火が明るく燃え上がり、私たちはあり合わせの物を椅子にして、火のそばに集まった。長椅子のクッションの奴隷チューチューはやわらかな寝床が恋しくて鳴いたが、ほかの者は皆、善良な生き物である火に、元気づけられ、慰められた。ぬくもりと光と、友がそばにいるような音をくれて、がらんとした建物でさえ壁画より見事に彩るのだ。しばらくは鍛冶場もなかなか心地よかった。真ん中には火が明るく、肩越しには森と山が見え、そこで昼は、息絶えるシイラさながら色を変えてゆく。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-021"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was between seven and eight before Hanson arrived, with a waggonful of our effects and two of his wife’s relatives to lend him a hand. The elder showed surprising strength. He would pick up a huge packing-case, full of books of all things, swing it on his shoulder, and away up the two crazy ladders and the breakneck spout of rolling mineral, familiarly termed a path, that led from the cart-track to our house. Even for a man unburthened, the ascent was toilsome and precarious; but Irvine sealed it with a light foot, carrying box after box, as the hero whisks the stage child up the practicable footway beside the waterfall of the fifth act. With so strong a helper, the business was speedily transacted. Soon the assayer’s office was thronged with our belongings, piled higgledy-piggledy, and upside down, about the floor. There were our boxes, indeed, but my wife had left her keys in Calistoga. There was the stove, but, alas! our carriers had forgot the chimney, and lost one of the plates along the road. The Silverado problem was scarce solved."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 200
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[138]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-021"
    "translation_ja": "ハンソンが着いたのは七時と八時の間だった。家財道具を荷馬車いっぱいに積み、妻の親戚二人を助手に連れていた。年上のほうは驚くほど力が強かった。よりによって本をいっぱい詰めた巨大な荷箱をひょいと拾い上げ、肩に担ぎ、ぐらつく梯子二本から始まって、道と気軽に呼んでいる首の折れそうな捨石の斜面を、車道から私たちの家まで運び上げる。身軽な男でさえ骨の折れる危うい登りなのに、アーヴィンは軽い足取りで登っては箱を一つまた一つと運んだ。芝居の第五幕で、滝の作り物の脇に設けた役者の通れる道を、子役を抱えてさっと駆けのぼる英雄そっくりだった。これほど力のある助っ人のおかげで仕事はじきに片づいた。まもなく分析所は家財道具でいっぱいになり、床じゅうに乱雑に、逆さまにまで積み上がった。箱はそろったが、妻は鍵をカリストガに置いてきた。ストーブもあったが、ああ、運び手が煙突を忘れ、おまけに途中で天板の一枚を落としていた。シルヴェラードでの暮らしには、まだ問題が山積みだった。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-022"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Rufe himself was grave and good-natured over his share of blame; he even, if I remember right, expressed regret. But his crew, to my astonishment and anger, grinned from ear to ear, and laughed aloud at our distress. They thought it “real funny” about the stove-pipe they had forgotten; “real funny” that they should have lost a plate. As for hay, the whole party refused to bring us any till they should have supped. See how late they were! Never had there been such a job as coming up that grade! Nor often, I suspect, such a game of poker as that before they started. But about nine, as a particular favour, we should have some hay."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 201
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[139]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-022"
    "translation_ja": "ルーフ自身は自分に落ち度があったことをまじめに受け止め、態度もよかった。たしか、すまないとまで言った。だが連れの者たちは、驚いたことに、そして腹の立つことに、口を大きく開けてにやつき、私たちが困っているのを大声で笑った。ストーブの煙突を忘れたのも「ほんとおかしい」、天板をなくしたのも「ほんとおかしい」。干し草なら、夕食を食べるまでは一同そろって持ってくる気はない。遅くなったことのなんと！　あの坂を上るなんて、とんでもない仕事だったのだ！　出がけのポーカーも、めったにないような勝負だったと私は疑っている。ただ九時ごろには特にお願いを聞き入れて、干し草を少し持ってきてくれるそうだ。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-023"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So they took their departure, leaving me still staring, and we resigned ourselves to wait for their return. The fire in the forge had been suffered to go out, and we were one and all too weary to kindle another. We dined, or, not to take that word in vain, we ate after a fashion, in the nightmare disorder of the assayer’s office, perched among boxes. A single candle lighted us. It could scarce be called a housewarming; for there was, of course, no fire, and with the two open doors and the open window gaping on the night, like breaches in a fortress, it began to grow rapidly chill. Talk ceased; nobody moved but the unhappy Chuchu, still in quest of sofa-cushions, who tumbled complainingly among the trunks. It required a certain happiness of disposition to look forward hopefully, from so dismal a beginning, across the brief hours of night, to the warm shining of to-morrow’s sun."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 202
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[140]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-023"
    "translation_ja": "そう言って去っていき、私は目を丸くしたままで、皆で帰ってくるのを待つほかなかった。鍛冶場の火は消したままで、誰ももう一度つける元気はない。私たちは夕食をとった。いや、夕食という言葉に申しわけないから、一応は物を食べたというにとどめよう。悪夢のように散らかった分析所で、荷箱の間に腰を落ちつけ、蝋燭一本で明かりをとってだ。新居祝いどころか、家を暖める火すらなかった。しかも開け放しの二つの戸口と一つの窓が、砦の裂け目のように夜に口を開けているので、急に冷えてきた。話は途絶え、動くものといえばかわいそうなチューチューだけ。まだクッションを求めて、うらめしげに鳴きながらトランクの間を転げまわった。こんな陰気な始まりから、短い夜の向こうに明日の暖かな日差しを待ち望むには、いくらか陽気な気立てが要るものだ。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-024"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the hay arrived at last, and we turned, with our last spark of courage, to the bedroom. We had improved the entrance, but it was still a kind of rope-walking; and it would have been droll to see us mounting, one after another, by candle-light, under the open stars."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 203
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[141]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-024"
    "translation_ja": "ようやく干し草が届くと、最後に残った気力を振りしぼり、寝室へ向かった。入口を多少ましにしておいたとはいえ、まだ綱渡りのようだった。満天の星の下、蝋燭を頼りに私たちが一人ずつ登っていくところは、さぞ滑稽だったろう。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-025"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The western door—that which looked up the canyon, and through which we entered by our bridge of flying plank—was still entire, a handsome, panelled door, the most finished piece of carpentry in Silverado. And the two lowest bunks next to this we roughly filled with hay for that night’s use. Through the opposite, or eastern-looking gable, with its open door and window, a faint, disused starshine came into the room like mist; and when we were once in bed, we lay, awaiting sleep, in a haunted, incomplete obscurity. At first the silence of the night was utter. Then a high wind began in the distance among the treetops, and for hours continued to grow higher. It seemed to me much such a wind as we had found on our visit; yet here in our open chamber we were fanned only by gentle and refreshing draughts, so deep was the canyon, so close our house was planted under the overhanging rock."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 204
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[142]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-025"
    "translation_ja": "西の戸は峡谷の奥を向き、空中に渡した板橋を通って入る戸だが、損なわれずに残っていた。鏡板の入った見事な戸で、シルヴェラードで最も念入りな木工だった。そのそばのいちばん下の寝台を二つ、今夜のためざっと干し草で満たした。反対側、東向きの妻壁には戸口も窓も開いたままで、薄く、長く使われていなかったような星明かりが、靄のように入ってきた。私たちは寝床に入り、幽霊でも出そうな、闇になりきらない薄暗がりの中で眠りを待った。初めは夜がまったく静かだった。それから遠く梢のあたりで強い風が吹き始め、何時間もかけてますます強くなった。下見に来たときに出会ったような風だと思った。それなのに開け放しのこの寝室で私たちをあおぐのは、さわやかなそよ風ばかりだった。それほど峡谷が深く、私たちの家がせり出す岩のすぐ下に張りついて建っていたのである。"
    "translation_status": "reviewed"

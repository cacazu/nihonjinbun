        "xpath": "/html/body/p[182]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-009"
    "translation_ja": "トローブリッジ氏は気高いひらめきに導かれてそう歌う。まさしく日差しがあの青白い月の小島に溢れ、月の照らされた顔があの数々の星を一つまた一つ消していったのだ。馬車の旅の驚異は終わった。だが空気の澄みぐあいと、私たちの通った谷に落ちる陰の重なりが、うまいこと揃ったため、ほんのひととき、あの真夜中の空の絢爛な見世物を見ることができた。消えたが、確かにあった。そして私は二度と同じ気持ちで星を眺めることはあるまい。大嵐にかき乱される海を見た者は、凪の海しか見ない者とはまるで違う海を思い描く。凪と大嵐との違いでさえ、ふだんの夜の顔と、あの馬車に輝いた夜の絢爛さとの違いに、たいして勝らない。馬車の二人は熱帯の夜の輝きも知っていたが、それすら比べようがなかった。空の名もない色、星の火の色合い、その星々が信じがたいほどせり出し、軌道から飛び出して、空間の奥にどの星がどれだけ離れているか目に見分けられそうだったこと。どれもこれまで見たことがなく、これからも見ることはないものだった。"
    "translation_status": "reviewed"
  - "id": "sv-starry-010"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Meanwhile, in this altered night, we proceeded on our way among the scents and silence of the forest, reached the top of the grade, wound up by Hanson’s, and came at last to a stand under the flying gargoyle of the chute. Sam, who had been lying back, fast asleep, with the moon on his face, got down, with the remark that it was pleasant “to be home.” The waggon turned and drove away, the noise gently dying in the woods, and we clambered up the rough path, Caliban’s great feat of engineering, and came home to Silverado."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 250
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[183]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-010"
    "translation_ja": "そのあいだにも、すっかり変わった夜のもと、私たちは香りと静けさの森を進み、坂を登りきって、ハンソン家の脇を曲がりながら上った。やがて、宙に飛び出すガーゴイルのようなあの樋の下で、馬車は止まった。顔に月明かりを浴び、背をもたれてぐっすり眠っていたサムが降りて、「家に帰るっていいね」と言った。荷馬車は向きを変えて走り去り、その音が森の中に静かに消えた。私たちはキャリバンの一大土木工事である荒い小道をよじ登り、シルヴェラードのわが家へ帰った。"
    "translation_status": "reviewed"
  - "id": "sv-starry-011"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The moon shone in at the eastern doors and windows, and over the lumber on the platform. The one tall pine beside the ledge was steeped in silver. Away up the canyon, a wild cat welcomed us with three discordant squalls. But once we had lit a candle, and began to review our improvements, homely in either sense, and count our stores, it was wonderful what a feeling of possession and permanence grow up in the hearts of the lords of Silverado. A bed had still to be made up for Strong, and the morning’s water to be fetched, with clinking pail; and as we set about these household duties, and showed off our wealth and conveniences before the stranger, and had a glass of wine, I think, in honour of our return, and trooped at length one after another up the flying bridge of plank, and lay down to sleep in our shattered, moon-pierced barrack, we were among the happiest sovereigns in the world, and certainly ruled over the most contented people. Yet, in our absence, the palace had been sacked. Wild cats, so the Hansons said, had broken in and carried off a side of bacon, a hatchet, and two knives."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 251
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[184]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-011"
    "translation_ja": "月は東側の戸口と窓から射し込み、平場の材木を照らした。岩棚のそばの一本の高い松は銀色に浸っていた。はるか峡谷の上方で、ヤマネコが三度耳障りな叫びをあげ、私たちを迎えた。蝋燭をともして、家庭らしいという意味でも、見ばえがしないという意味でも、いかにも手作りの改良をあらためて見てまわり、貯えを数えはじめると、シルヴェラードの領主たちの胸に、この場所は自分たちのもので、いつまでも続くという気持ちがふくらんだ。驚くほどだった。まだストロングの寝床を作り、朝の水を、手桶を鳴らしながら汲んでこなければならない。私たちはそうした家事に取りかかり、客人に財産や便利な道具を自慢し、帰宅を祝って確かワインも一杯飲み、ようやく一人また一人と宙に架けた板橋を登り、月の光が穴という穴から射す壊れかけの兵舎に横たわって眠った。そのときは、世界でいちばん幸せな王侯の仲間であり、治めていた民はたしかに誰よりも満ち足りていた。それでも留守中、宮殿は略奪されていた。ハンソン家によると、ヤマネコが押し入って、豚の片身分のベーコンと手斧一本、ナイフ二本を持ち去ったそうだ。"
    "translation_status": "reviewed"
  - "id": "sv-mine-001"
    "section_id": "mine"
    "kind": "heading"
    "origin": "source"
    "source_text": "EPISODES IN THE STORY OF A MINE"
    "source_languages":
      - "en"
    "source_locations":

  - "id": "sv-calistoga-002"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is difficult for a European to imagine Calistoga, the whole place is so new, and of such an accidental pattern; the very name, I hear, was invented at a supper-party by the man who found the springs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 57
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[17]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-002"
    "translation_ja": "ヨーロッパ人にはカリストガが想像しにくい。町じゅうどこもあまりに新しく、いかにも成り行きでできたような形をしている。町の名さえ、温泉を見つけた男が夕食会の席でひねり出したと聞く。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-003"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The railroad and the highway come up the valley about parallel to one another. The street of Calistoga joins the perpendicular to both—a wide street, with bright, clean, low houses, here and there a verandah over the sidewalk, here and there a horse-post, here and there lounging townsfolk. Other streets are marked out, and most likely named; for these towns in the New World begin with a firm resolve to grow larger, Washington and Broadway, and then First and Second, and so forth, being boldly plotted out as soon as the community indulges in a plan. But, in the meanwhile, all the life and most of the houses of Calistoga are concentrated upon that street between the railway station and the road. I never heard it called by any name, but I will hazard a guess that it is either Washington or Broadway. Here are the blacksmith’s, the chemist’s, the general merchant’s, and Kong Sam Kee, the Chinese laundryman’s; here, probably, is the office of the local paper (for the place has a paper—they all have papers); and here certainly is one of the hotels, Cheeseborough’s, whence the daring Foss, a man dear to legend, starts his horses for the Geysers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 58
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[18]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-003"
    "translation_ja": "鉄道と街道は、おおむね並行に谷をさかのぼる。カリストガの通りは、そのどちらにも直角につながっている。明るくきれいな低い家々がならぶ幅広い通りで、ところどころ歩道に張り出したヴェランダがあり、馬をつなぐ杭があり、手持ちぶさたな町の人がいる。ほかにも通り予定地があり、おそらく名前までついている。新世界の町はきっと大きくなるという固い決意から始まるから、町づくりを考え始めるや、ワシントン通りとブロードウェイ、さらには一番街、二番街と、大胆に線を引いてみせる。ともあれ当面、カリストガの暮らしという暮らし、家のほとんどすべては、鉄道駅と街道を結ぶこの通りに集中している。通りの名は一度も聞いたことがないが、ワシントンかブロードウェイではないかと当ててみよう。鍛冶屋、薬屋、よろず屋、中国人の洗濯店コン・サム・キーがここにある。おそらく地元の新聞社もある（この町には新聞がある。どの町にもあるのだ）。それに間違いなくホテルの一軒、チーズバラーの宿があり、伝説の好む向こう見ずな男フォスが、そこからガイザーズへ馬を出す。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-004"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It must be remembered that we are here in a land of stage-drivers and highwaymen: a land, in that sense, like England a hundred years ago. The highway robber—road-agent, he is quaintly called—is still busy in these parts. The fame of Vasquez is still young. Only a few years go, the Lakeport stage was robbed a mile or two from Calistoga. In 1879, the dentist of Mendocino City, fifty miles away upon the coast, suddenly threw off the garments of his trade, like Grindoff, in The Miller and his Men, and flamed forth in his second dress as a captain of banditti. A great robbery was followed by a long chase, a chase of days if not of weeks, among the intricate hill-country; and the chase was followed by much desultory fighting, in which several—and the dentist, I believe, amongst the number—bit the dust. The grass was springing for the first time, nourished upon their blood, when I arrived in Calistoga. I am reminded of another highwayman of that same year. “He had been unwell,” so ran his humorous defence, “and the doctor told him to take something, so he took the express-box.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 59
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[19]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-004"
    "translation_ja": "ここは駅馬車の御者と追いはぎの土地だということを忘れてはならない。その意味では百年前のイングランドに似ている。街道強盗は、妙な呼び方で「街道代理人」といい、このあたりではまだ活躍している。バスケスの名声にもまだ年季が入っていない。ほんの数年前には、カリストガから一、二マイルのところでレイクポート行きの駅馬車が襲われた。一八七九年、五十マイル離れた海岸のメンドシーノ・シティの歯科医が、『粉屋とその仲間たち』のグリンドフよろしく、突然商売の衣を脱ぎ捨て、山賊の頭という二つ目の扮装で華々しく登場した。大がかりな強盗のあと入り組んだ丘陵を何日も、ひょっとすると何週間もかけて追い回し、そのあとあちこちで撃ち合いになった。何人かがそこで土をかみ、その歯科医もたしかその中にいた。私がカリストガに着いたのは、彼らの血を吸って育った草が初めて生えた頃だった。同じ年の別の追いはぎを思い出す。「具合が悪くて、医者から何か取れと言われたんで」と愉快な弁明をしたそうだ。「だから、急便の金箱を取ったんです」。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-005"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The cultus of the stage-coachman always flourishes highest where there are thieves on the road, and where the guard travels armed, and the stage is not only a link between country and city, and the vehicle of news, but has a faint warfaring aroma, like a man who should be brother to a soldier. California boasts her famous stage-drivers, and among the famous Foss is not forgotten. Along the unfenced, abominable mountain roads, he launches his team with small regard to human life or the doctrine of probabilities. Flinching travellers, who behold themselves coasting eternity at every corner, look with natural admiration at their driver’s huge, impassive, fleshy countenance. He has the very face for the driver in Sam Weller’s anecdote, who upset the election party at the required point. Wonderful tales are current of his readiness and skill. One in particular, of how one of his horses fell at a ticklish passage of the road, and how Foss let slip the reins, and, driving over the fallen animal, arrived at the next stage with only three. This I relate as I heard it, without guarantee."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 60
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[20]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-005"
    "translation_ja": "駅馬車の御者が何より崇められるのは、道に盗賊が出て、護衛が武器を帯び、馬車が田舎と都会を結んで便りを運ぶばかりか、兵士と兄弟分の男のように、かすかな戦場の匂いを帯びるところである。カリフォルニアには自慢の名御者が何人もおり、その列にフォスが入らないはずはない。柵もないとんでもない山道に、彼は人命にも確率の法則にもさして頓着せず、馬車を引く馬たちを突っ込ませる。曲がり角のたび永遠の淵をかすめてゆく気がして身のすくむ乗客は、当然ながら御者の大きく肉づきのいい、何があっても動かぬ顔に見とれる。サム・ウェラーの逸話に出てくる、選挙の一行をちょうどおあつらえの場所でひっくり返した御者にぴったりの顔だ。機転と腕前について、驚くような話がいくつも出回っている。とりわけ、道のきわどい箇所で馬が一頭倒れたとき、フォスはそいつの手綱を放し、倒れた馬を乗り越え、馬三頭だけで次の宿場へ着いたという。私は聞いたままを話すのであって、請け合いはしない。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-006"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I only saw Foss once, though, strange as it may sound, I have twice talked with him. He lives out of Calistoga, at a ranche called Fossville. One evening, after he was long gone home, I dropped into Cheeseborough’s, and was asked if I should like to speak with Mr. Foss. Supposing that the interview was impossible, and that I was merely called upon to subscribe the general sentiment, I boldly answered “Yes.” Next moment, I had one instrument at my ear, another at my mouth and found myself, with nothing in the world to say, conversing with a man several miles off among desolate hills. Foss rapidly and somewhat plaintively brought the conversation to an end; and he returned to his night’s grog at Fossville, while I strolled forth again on Calistoga high street. But it was an odd thing that here, on what we are accustomed to consider the very skirts of civilization, I should have used the telephone for the first time in my civilized career. So it goes in these young countries; telephones, and telegraphs, and newspapers, and advertisements running far ahead among the Indians and the grizzly bears."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 61
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[21]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-006"
    "translation_ja": "フォスに会ったのは一度だけだが、妙に聞こえようとも、話したのは二度である。カリストガの外、フォスヴィルという牧場に住んでいる。ある晩、彼が家へ帰ってからとうに時間がたった頃、チーズバラーの宿に寄ると、フォスさんと話をしてみたくないかと言われた。会えるはずはなく、みんなと同じ気持ちだと答えればよいのだと思い、大胆に「ええ」と言った。その次の瞬間、耳に器械を一つ、口にもう一つ当て、何一つ話すこともないまま、荒涼とした丘の奥、数マイル離れた男と話をしていた。フォスはすばやく、どことなく迷惑そうに話を切り上げ、フォスヴィルでの夜のグロッグへ戻っていった。私はまたカリストガの大通りへぶらぶらと出ていった。だが私たちが文明の裾の裾と思いがちなこの土地で、文明社会で暮らしてきた私が初めて電話を使ったとは、妙なものだ。若い土地ではこれが普通なのだ。電話も電信も新聞も広告も、先住民とハイイログマのあいだを通って、はるか先へと走っていく。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-007"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Alone, on the other side of the railway, stands the Springs Hotel, with its attendant cottages. The floor of the valley is extremely level to the very roots of the hills; only here and there a hillock, crowned with pines, rises like the barrow of some chieftain famed in war; and right against one of these hillocks is the Springs Hotel—is or was; for since I was there the place has been destroyed by fire, and has risen again from its ashes. A lawn runs about the house, and the lawn is in its turn surrounded by a system of little five-roomed cottages, each with a verandah and a weedy palm before the door. Some of the cottages are let to residents, and these are wreathed in flowers. The rest are occupied by ordinary visitors to the Hotel; and a very pleasant way this is, by which you have a little country cottage of your own, without domestic burthens, and by the day or week."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 62
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[22]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-007"
    "translation_ja": "線路を渡った向こうには、〈スプリングズ・ホテル〉が付属の小屋を引き連れて、ぽつんと立つ。谷底は丘の付け根まで驚くほど平らで、松を頂に載せた小丘だけが、戦で名を馳せた族長の塚さながら、ところどころ突き出ている。そんな小丘の一つにぴったり寄り添って〈スプリングズ・ホテル〉がある。ある、いや、あった、と言うべきか。私が行ってから焼け落ち、また灰の中からよみがえったからだ。建物を芝生が取り囲み、その芝生を今度は五部屋ずつの小さな貸し家が取り囲む。どの家にもヴェランダがつき、玄関の前には貧相な椰子が一本ある。住みついている人に貸してある家には、花がまといついている。あとはホテルの普通の客が泊まる。これはたいへん心地よい仕組みで、日ごとでも週ごとでも、家事を背負わず、自分だけの小さな田舎家が持てるのだ。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-008"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole neighbourhood of Mount Saint Helena is full of sulphur and of boiling springs. The Geysers are famous; they were the great health resort of the Indians before the coming of the whites. Lake County is dotted with spas; Hot Springs and White Sulphur Springs are the names of two stations on the Napa Valley railroad; and Calistoga itself seems to repose on a mere film above a boiling, subterranean lake. At one end of the hotel enclosure are the springs from which it takes its name, hot enough to scald a child seriously while I was there. At the other end, the tenant of a cottage sank a well, and there also the water came up boiling. It keeps this end of the valley as warm as a toast. I have gone across to the hotel a little after five in the morning, when a sea fog from the Pacific was hanging thick and gray, and dark and dirty overhead, and found the thermometer had been up before me, and had already climbed among the nineties; and in the stress of the day it was sometimes too hot to move about."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 63
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[23]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-008"
    "translation_ja": "セント・ヘレナ山の界隈はじゅうじゅうと湧く泉と硫黄に満ちている。ガイザーズは名高く、白人の来るまえには先住民が盛んに体を癒やしに行くところだった。レイク郡には湯治場が点在し、ナパ谷の鉄道にはホット・スプリングズとホワイト・サルファー・スプリングズという二つの駅がある。カリストガ自体、地底でたぎる湖の上に張った薄皮に載っているようだ。ホテルの敷地の一端には名前のもとになった泉があり、私がいたあいだにも子供がひどい火傷をしたほど熱い。反対側では貸し家の住人が井戸を掘ったら、やはり煮えたぎる水が上がってきた。おかげで谷のこの端は、焼きたてのトーストのように暖かい。朝五時を少し回った頃にホテルへ渡ったことがある。太平洋から来た灰色の海霧が厚く垂れ、頭上が暗く薄汚れていた。すると温度計は私より早起きで、すでに華氏九十度台へ登っていた。昼の暑さが盛りになると、歩き回るどころではないことさえあった。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-009"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But in spite of this heat from above and below, doing one on both sides, Calistoga was a pleasant place to dwell in; beautifully green, for it was then that favoured moment in the Californian year, when the rains are over and the dusty summer has not yet set in; often visited by fresh airs, now from the mountain, now across Sonoma from the sea; very quiet, very idle, very silent but for the breezes and the cattle bells afield. And there was something satisfactory in the sight of that great mountain that enclosed us to the north: whether it stood, robed in sunshine, quaking to its topmost pinnacle with the heat and brightness of the day; or whether it set itself to weaving vapours, wisp after wisp growing, trembling, fleeting, and fading in the blue."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 64
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[24]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-009"
    "translation_ja": "それでも、上と下から両面焼きにされそうなこの暑さにもかかわらず、カリストガは住んで楽しいところだった。まことに緑が美しかった。雨季が終わり、埃っぽい夏がまだ始まらない、カリフォルニアの一年でもとりわけ恵まれたひとときだったのである。山から、あるいはソノマを渡って海から、しばしば新鮮な風が来た。とても静かで、のんびりして、そよ風と野の牛の鈴を別にすれば音一つしない。北側を閉じるあの大きな山も、眺めてどこか満ち足りた気持ちにさせた。陽光をまとい、真昼の熱と明るさにいちばん高い尖りまで揺らめいて立つときも、あおい空の中で、ひと筋ずつ生まれ、震え、流れ、消えていく靄を織り始めるときもだった。"
    "translation_status": "reviewed"
  - "id": "sv-calistoga-010"
    "section_id": "calistoga"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The tangled, woody, and almost trackless foot-hills that enclose the valley, shutting it off from Sonoma on the west, and from Yolo on the east—rough as they were in outline, dug out by winter streams, crowned by cliffy bluffs and nodding pine trees—wore dwarfed into satellites by the bulk and bearing of Mount Saint Helena. She over-towered them by two-thirds of her own stature. She excelled them by the boldness of her profile. Her great bald summit, clear of trees and pasture, a cairn of quartz and cinnabar, rejected kinship with the dark and shaggy wilderness of lesser hill-tops."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 65
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[25]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-calistoga-010"
    "translation_ja": "谷を取り巻く森深い麓の丘は入り組み、道らしい道もない。西のソノマ、東のヨロを遮るその丘は、輪郭こそ荒々しく、冬の流れに深く刻まれ、切り立つ崖と風にうなずく松を頂に戴いていたが、セント・ヘレナ山の大きさと物腰の前では、ただの小さな従者に見えた。山は自らの背丈の三分の二もの高さで丘をしのぐ。山の輪郭の大胆さでも、あの丘々を圧していた。その大きな裸の頂は、木も牧草もない石英と辰砂の石塚で、黒く毛むくじゃらに連なる小高い峰々との縁を、きっぱりと断っていた。"
    "translation_status": "reviewed"
  - "id": "sv-forest-001"

    "translation_status": "reviewed"
  - "id": "sv-toils-002"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I must try to convey some notion of our life, of how the days passed and what pleasure we took in them, of what there was to do and how we set about doing it, in our mountain hermitage. The house, after we had repaired the worst of the damages, and filled in some of the doors and windows with white cotton cloth, became a healthy and a pleasant dwelling-place, always airy and dry, and haunted by the outdoor perfumes of the glen. Within, it had the look of habitation, the human look. You had only to go into the third room, which we did not use, and see its stones, its sifting earth, its tumbled litter; and then return to our lodging, with the beds made, the plates on the rack, the pail of bright water behind the door, the stove crackling in a corner, and perhaps the table roughly laid against a meal,—and man’s order, the little clean spots that he creates to dwell in, were at once contrasted with the rich passivity of nature. And yet our house was everywhere so wrecked and shattered, the air came and went so freely, the sun found so many portholes, the golden outdoor glow shone in so many open chinks, that we enjoyed, at the same time, some of the comforts of a roof and much of the gaiety and brightness of al fresco life. A single shower of rain, to be sure, and we should have been drowned out like mice. But ours was a Californian summer, and an earthquake was a far likelier accident than a shower of rain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 279
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[209]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-002"
    "translation_ja": "私たちが山の隠れ家でどんな暮らしをしたか、日々はどう過ぎ、その日々をどう楽しみ、何をしなくてはならず、それにどう取りかかったかを、いくらかでも伝えたい。ひどい壊れ方をしたところは繕い、戸口や窓の幾つかを白い木綿布で塞いでしまうと、家は体によく、心地よい住まいになった。いつも風通しがよく乾いていて、谷の戸外の香りがいつもただよっていた。中には人の住んでいる様子、人間らしい顔つきがあった。使っていない三つ目の部屋に行って、石や、ふるい落ちる土や、散らかったがらくたを見てから、自分たちの住まいに戻ってみればよい。寝床は整い、皿は棚にあり、戸の裏には澄んだ水を満たした手桶があり、隅でストーブがぱちぱち鳴り、食事を前に卓にざっと食器を並べてあることもある。人間がこしらえて住む、小さな清潔な場所、その秩序が、自然の豊かな不作為とたちまち対照をなした。それでいて、家はどこも壊れて破れているため、空気があまりにも自由に出入りし、太陽は舷窓をいくつも見つけ、戸外の黄金色の光が開いた隙間からいく筋も射しこむ。おかげで私たちは屋根の下の便利さをいくらか得ながら、戸外の暮らしの明るさと気晴らしを十分味わった。むろんにわか雨一つで、鼠よろしく水浸しになって追い出されたろう。だがこれはカリフォルニアの夏である。にわか雨より地震のほうがずっとありそうな災難だった。"
    "translation_status": "reviewed"
  - "id": "sv-toils-003"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Trustful in this fine weather, we kept the house for kitchen and bedroom, and used the platform as our summer parlour. The sense of privacy, as I have said already, was complete. We could look over the clump on miles of forest and rough hilltop; our eyes commanded some of Napa Valley, where the train ran, and the little country townships sat so close together along the line of the rail. But here there was no man to intrude. None but the Hansons were our visitors. Even they came but at long intervals, or twice daily, at a stated hour, with milk. So our days, as they were never interrupted, drew out to the greater length; hour melted insensibly into hour; the household duties, though they were many, and some of them laborious, dwindled into mere islets of business in a sea of sunny day-time; and it appears to me, looking back, as though the far greater part of our life at Silverado had been passed, propped upon an elbow, or seated on a plank, listening to the silence that there is among the hills."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 280
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[210]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-003"
    "translation_ja": "この晴天を信じ、家を台所と寝室にとっておき、平場を夏の客間に使った。前にも言ったが、自分たちだけの場所だという思いは完全だった。捨石の山を越えて何マイルもの森や荒々しい丘の頂を眺められ、ナパの谷の一部、列車が走り、その線路沿いに小さな町が身を寄せ合うところまで見渡せる。それなのに、ここへ押し入ってくる人はいない。訪ねてくるのはハンソン家だけで、それもずいぶん間をおいてか、決まった時刻に一日二度、牛乳を持ってくるだけであった。だからさえぎられることのない日は、いっそう長く延びていき、時はそれとわからず次の時へ溶けた。家事はいくつもあり、中には骨の折れるものもあったが、明るい昼の海に浮かぶ用事の小島にすぎなくなった。振り返ってみると、シルヴェラードでの暮らしの大半を、肘をついて横になるか板の上に腰をおろし、丘々の静けさに耳を澄ませて過ごしたように思う。"
    "translation_status": "reviewed"
  - "id": "sv-toils-004"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My work, it is true, was over early in the morning. I rose before any one else, lit the stove, put on the water to boil, and strolled forth upon the platform to wait till it was ready. Silverado would then be still in shadow, the sun shining on the mountain higher up. A clean smell of trees, a smell of the earth at morning, hung in the air. Regularly, every day, there was a single bird, not singing, but awkwardly chirruping among the green madronas, and the sound was cheerful, natural, and stirring. It did not hold the attention, nor interrupt the thread of meditation, like a blackbird or a nightingale; it was mere woodland prattle, of which the mind was conscious like a perfume. The freshness of these morning seasons remained with me far on into the day."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 281
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[211]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-004"
    "translation_ja": "確かに私の仕事は朝早くに済んだ。誰より先に起きてストーブに火を入れ、湯を沸かしにかかり、湯が沸くのを待つあいだ平場へぶらりと出た。この時刻のシルヴェラードはまだ影の中で、日は山のもっと高いところに差している。木々の清々しい匂い、朝の土の匂いがあたりにただよっていた。毎日決まって一羽だけ、緑のマドロナの間で歌うでもなく、不器用にちゅんちゅん鳴く鳥がいた。明るく、自然で、気分をしゃんとさせる声である。クロウタドリやナイチンゲールのように注意を引きつけたり、考えごとの糸を切ったりはしない。ただの森のおしゃべりで、香りに気づくように気づくのだ。その朝の清々しさは、昼もずいぶん進むまで私の中に残った。"
    "translation_status": "reviewed"
  - "id": "sv-toils-005"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As soon as the kettle boiled, I made porridge and coffee; and that, beyond the literal drawing of water, and the preparation of kindling, which it would be hyperbolical to call the hewing of wood, ended my domestic duties for the day. Thenceforth my wife laboured single-handed in the palace, and I lay or wandered on the platform at my own sweet will. The little corner near the forge, where we found a refuge under the madronas from the unsparing early sun, is indeed connected in my mind with some nightmare encounters over Euclid, and the Latin Grammar. These were known as Sam’s lessons. He was supposed to be the victim and the sufferer; but here there must have been some misconception, for whereas I generally retired to bed after one of these engagements, he was no sooner set free than he dashed up to the Chinaman’s house, where he had installed a printing press, that great element of civilization, and the sound of his labours would be faintly audible about the canyon half the day."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 282
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[212]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-005"
    "translation_ja": "やかんの湯が沸くと粥とコーヒーを作る。実際に水を汲み、焚きつけを用意するほかは、これで私の一日の家事はおしまいだった。焚きつけの用意を木こり仕事と呼ぶほど大げさなことはない。そのあとは妻が一人で宮殿の中で働き、私は平場に寝ころぶなり、ぶらぶら歩くなり、好きなようにした。朝の容赦のない陽を避けてマドロナの下に逃げこんだ鍛冶場そばの一角には、確かに、ユークリッド幾何学とラテン語文法をめぐる悪夢のような対決の記憶もつながっている。サムの授業と呼ばれていた。犠牲者でつらい思いをするのはサムということになっていたが、そこは何か取り違えている。こういう戦いのあと、たいてい私は床に引き上げたのに、サムは自由になるや、あの中国人の家に駆け上がった。そこに文明の大いなる装置、印刷機を据えていて、働く音が半日も峡谷にかすかに響くのだった。"
    "translation_status": "reviewed"
  - "id": "sv-toils-006"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To walk at all was a laborious business; the foot sank and slid, the boots were cut to pieces, among sharp, uneven, rolling stones. When we crossed the platform in any direction, it was usual to lay a course, following as much as possible the line of waggon rails. Thus, if water were to be drawn, the water-carrier left the house along some tilting planks that we had laid down, and not laid down very well. These carried him to that great highroad, the railway; and the railway served him as far as to the head of the shaft. But from thence to the spring and back again he made the best of his unaided way, staggering among the stones, and wading in low growth of the calcanthus, where the rattlesnakes lay hissing at his passage. Yet I liked to draw water. It was pleasant to dip the gray metal pail into the clean, colourless, cool water; pleasant to carry it back, with the water ripping at the edge, and a broken sunbeam quivering in the midst."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 283
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[213]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-006"
    "translation_ja": "歩くこと自体が骨だった。尖った不ぞろいの、足の下を転がる石の間では足が沈み、滑り、長靴がずたずたになった。平場をどちらに横切るにも、たいていできるだけトロッコのレールに沿うよう、針路を見定める。水を汲むのであれば、まず家を出て、私たちが敷いた、どちらかと言えばいい加減に敷いた、ぐらつく板を渡る。それが大街道、つまり鉄道へ連れていってくれ、鉄道は斜坑の口まで役に立つ。そこから泉へ行って戻るには、自分の足だけに任せ、石につまずき、背の低いクロバナロウバイの茂みに分け入るしかなかった。ガラガラヘビはそこで、通りがけにしゅうしゅう威嚇した。それでも水汲みは好きだった。灰色の金属の手桶を澄んだ無色の冷たい水に沈めるのが楽しい。水が桶の縁でさざめき、折れた光の筋が真ん中で震えるのを運んで帰るのが楽しい。"
    "translation_status": "reviewed"
  - "id": "sv-toils-007"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the extreme roughness of the walking confined us in common practice to the platform, and indeed to those parts of it that were most easily accessible along the line of rails. The rails came straight forward from the shaft, here and there overgrown with little green bushes, but still entire, and still carrying a truck, which it was Sam’s delight to trundle to and fro by the hour with various ladings. About midway down the platform, the railroad trended to the right, leaving our house and coasting along the far side within a few yards of the madronas and the forge, and not far of the latter, ended in a sort of platform on the edge of the dump. There, in old days, the trucks were tipped, and their load sent thundering down the chute. There, besides, was the only spot where we could approach the margin of the dump. Anywhere else, you took your life in your right hand when you came within a yard and a half to peer over. For at any moment the dump might begin to slide and carry you down and bury you below its ruins. Indeed, the neighbourhood of an old mine is a place beset with dangers. For as still as Silverado was, at any moment the report of rotten wood might tell us that the platform had fallen into the shaft; the dump might begin to pour into the road below; or a wedge slip in the great upright seam, and hundreds of tons of mountain bury the scene of our encampment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 284
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[214]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-007"
    "translation_ja": "何しろ歩きにくいので、ふだんの私たちの行動範囲は平場に限られ、実際にはそのうちでも、レールづたいに楽に行ける箇所に限られていた。レールは斜坑からまっすぐ延び、ときおり緑の小さな藪に覆われているが、まだ壊れてはいない。その上にはトロッコも一台残り、サムはありとあらゆる荷を積んで、何時間でも前へ後ろへ走らせて喜んだ。平場の半ばほどで線路は右へ傾き、家から離れ、向こう側を、マドロナや鍛冶場から数ヤードの距離をおいて通り、その鍛冶場からさほど離れぬ所で、捨石の縁の足場めいたところに行き着く。昔そこではトロッコをひっくり返し、荷を轟かせながら樋の下へ落とした。捨石の縁へ近づける場所も、そこだけだった。ほかの所で縁から一ヤード半まで近寄ってのぞこうものなら、命を賭けることになる。いつ捨石が滑り始め、引きずり下ろされたうえ、その崩れの下に埋められてもおかしくなかった。じっさい廃鉱のまわりは危険がいくつも取り巻いている。シルヴェラードはあれほど静かだが、それでもいつ、腐った木が折れる音で足場が斜坑へ落ちたと知らされるか、捨石が下の街道へ流れはじめるか、あの大きな縦の割れ目の楔がずれて、何百トンもの山が野営地を埋めるかわからないのだ。"
    "translation_status": "reviewed"
  - "id": "sv-toils-008"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I have already compared the dump to a rampart, built certainly by some rude people, and for prehistoric wars. It was likewise a frontier. All below was green and woodland, the tall pines soaring one above another, each with a firm outline and full spread of bough. All above was arid, rocky, and bald. The great spout of broken mineral, that had dammed the canyon up, was a creature of man’s handiwork, its material dug out with a pick and powder, and spread by the service of the tracks. But nature herself, in that upper district, seemed to have had an eye to nothing besides mining; and even the natural hill-side was all sliding gravel and precarious boulder. Close at the margin of the well leaves would decay to skeletons and mummies, which at length some stronger gust would carry clear of the canyon and scatter in the subjacent woods. Even moisture and decaying vegetable matter could not, with all nature’s alchemy, concoct enough soil to nourish a few poor grasses. It is the same, they say, in the neighbourhood of all silver mines; the nature of that precious rock being stubborn with quartz and poisonous with cinnabar. Both were plenty in our Silverado. The stones sparkled white in the sunshine with quartz; they were all stained red with cinnabar. Here, doubtless, came the Indians of yore to paint their faces for the war-path; and cinnabar, if I remember rightly, was one of the few articles of Indian commerce. Now, Sam had it in his undisturbed possession, to pound down and slake, and paint his rude designs with. But to me it had always a fine flavour of poetry, compounded out of Indian story and Hawthornden’s allusion:"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 285
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[215]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-008"
    "translation_ja": "すでに私は捨石の山を、きっと文明の浅い人たちが先史時代の戦いのために築いた城壁のようだと書いた。あれはまた一つの境界だった。下はことごとく緑と林で、高い松が一本の上にまた一本とそびえ、輪郭ははっきりし、枝は横いっぱいに広がる。上は一面、乾燥し、岩だらけで禿げている。峡谷をせき止めた大きな鉱石くずの噴流は人の手が作ったものだ。中身はつるはしと火薬で掘り出し、トロッコで運び広げた。だが上の一帯では自然そのものまで採鉱のことしか頭になかったようで、天然の山腹でさえずり落ちる砂礫、危うい岩ばかりだった。水溜まりの縁すぐそばで、落ち葉は朽ち、葉脈だけの骸骨やミイラになっていく。ついには少しばかり強い突風がそれを峡谷の外へ運び、下の森へ撒き散らす。水分と腐った植物があっても、自然の錬金術のすべてを使っても、貧弱な草を何本か養えるほどの土は調合できなかった。聞くところでは銀山のまわりはどこも同じで、貴重な鉱石を抱く岩は、石英のせいで手ごわく、辰砂のせいで有毒だ。私たちのシルヴェラードにはどちらもふんだんにあった。石は石英を含んで陽に白くきらめき、辰砂を含んでみな赤く染まっていた。昔、戦いに出る前に顔を塗るため、先住民はきっとここへ来たのだろう。記憶が正しければ、辰砂は彼らの数少ない交易品の一つでもあった。今はサムが誰にも邪魔されず独り占めし、砕いて水に溶き、素朴な絵を描くのに使う。だが私には、先住民の物語と、ホーソーンデンの一節の入りまじった、詩のよい香りがいつもした。"
    "translation_status": "reviewed"
  - "id": "sv-toils-009"

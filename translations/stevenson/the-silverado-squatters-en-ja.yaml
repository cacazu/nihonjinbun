    "translation_status": "reviewed"
  - "id": "sv-squatting-002"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There were four of us squatters—myself and my wife, the King and Queen of Silverado; Sam, the Crown Prince; and Chuchu, the Grand Duke. Chuchu, a setter crossed with spaniel, was the most unsuited for a rough life. He had been nurtured tenderly in the society of ladies; his heart was large and soft; he regarded the sofa-cushion as a bed-rook necessary of existence. Though about the size of a sheep, he loved to sit in ladies’ laps; he never said a bad word in all his blameless days; and if he had seen a flute, I am sure he could have played upon it by nature. It may seem hard to say it of a dog, but Chuchu was a tame cat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 171
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[119]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-002"
    "translation_ja": "空き家に住みついたのは私たち四人だった。シルヴェラードの王と王妃、すなわち私と妻。サム王太子。それからチューチュー大公である。セッターとスパニエルの雑種のチューチューは、荒っぽい暮らしにはいちばん向かなかった。ご婦人たちの間で大事に育てられ、おおらかで傷つきやすい心を持ち、長椅子のクッションこそ暮らしの土台だと考えていた。羊ほどの大きさがありながら、ご婦人の膝に乗るのが好きで、非の打ちどころのない一生に、悪い言葉の一つも口にしなかった。もし笛を見たことがあったなら、生まれつきの才で吹いたに違いない。犬に向かって酷な言い方かもしれないが、チューチューはおとなしい飼い猫だった。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-003"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The king and queen, the grand duke, and a basket of cold provender for immediate use, set forth from Calistoga in a double buggy; the crown prince, on horseback, led the way like an outrider. Bags and boxes and a second-hand stove were to follow close upon our heels by Hanson’s team."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 172
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[120]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-003"
    "translation_ja": "王と王妃と大公、それにすぐ食べられる冷たい食料一籠を乗せた二頭立ての軽馬車が、カリストガをあとにした。王太子は先導の従者よろしく、馬に乗って先を行った。袋に木箱に中古のストーブは、ハンソンの荷馬車で私たちのすぐあとから来ることになっていた。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-004"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was a beautiful still day; the sky was one field of azure. Not a leaf moved, not a speck appeared in heaven. Only from the summit of the mountain one little snowy wisp of cloud after another kept detaching itself, like smoke from a volcano, and blowing southward in some high stream of air: Mount Saint Helena still at her interminable task, making the weather, like a Lapland witch."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 173
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[121]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-004"
    "translation_ja": "風のない美しい日だった。空はいちめんの紺碧で、葉一枚動かず、空には染み一つ見えない。ただ山の頂から、小さな雪白の雲が一すじまた一すじ、火山の煙のようにちぎれ、高みに流れる風に乗って南へ流れていった。セント・ヘレナ山はなおも果てしない仕事に明け暮れていた。ラップランドの魔女さながら、天気を作っているのである。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-005"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By noon we had come in sight of the mill: a great brown building, half-way up the hill, big as a factory, two stories high, and with tanks and ladders along the roof; which, as a pendicle of Silverado mine, we held to be an outlying province of our own. Thither, then, we went, crossing the valley by a grassy trail; and there lunched out of the basket, sitting in a kind of portico, and wondering, while we ate, at this great bulk of useless building. Through a chink we could look far down into the interior, and see sunbeams floating in the dust and striking on tier after tier of silent, rusty machinery. It cost six thousand dollars, twelve hundred English sovereigns; and now, here it stands deserted, like the temple of a forgotten religion, the busy millers toiling somewhere else. All the time we were there, mill and mill town showed no sign of life; that part of the mountain-side, which is very open and green, was tenanted by no living creature but ourselves and the insects; and nothing stirred but the cloud manufactory upon the mountain summit. It was odd to compare this with the former days, when the engine was in fall blast, the mill palpitating to its strokes, and the carts came rattling down from Silverado, charged with ore."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 174
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[122]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-005"
    "translation_ja": "正午までには選鉱場が見えてきた。山の中腹に立つ大きな茶色い建物で、工場ほどの大きさがあり、二階建てで屋根には水槽と梯子が並んでいる。シルヴェラード鉱山の付属物であるから、わが領土の外れにある一地方と私たちは見なした。そこで草の生えた細道をたどって谷を渡り、屋根つきの玄関のような所に座って、籠から昼食を出して食べた。食べながら、もう役に立たない建物の途方もない大きさに驚いた。隙間から中のずっと下まで見通すと、埃の中に日差しがたゆたい、何層にも並んだ音のない錆びた機械に当たっていた。建てるのに六千ドル、イギリス金貨で千二百ソヴリンもかかったという。それが今では忘れ去られた宗教の神殿のように打ち捨てられ、忙しい選鉱夫はよそで働いている。私たちがいるあいだ、選鉱場にもそこの町にも、人の気配はなかった。山腹のこの一帯は広々として緑が濃いが、命あるものは私たちと虫ばかり。動いているのも山頂の雲工場だけだ。以前は機関が全開で、選鉱場は機関の一打ちごとに脈を打ち、鉱石を積んだ荷車がシルヴェラードからごろごろ下ってきた。そのころと引き比べると奇妙な気がした。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-006"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By two we had been landed at the mine, the buggy was gone again, and we were left to our own reflections and the basket of cold provender, until Hanson should arrive. Hot as it was by the sun, there was something chill in such a home-coming, in that world of wreck and rust, splinter and rolling gravel, where for so many years no fire had smoked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 175
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[123]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-006"
    "translation_ja": "二時には鉱山で降ろしてもらい、軽馬車はもう行ってしまった。ハンソンが着くまで、考え事と冷たい食料一籠を相手にするほかなかった。日なたは暑いのだが、この帰宅にはどこか寒々しいところがあった。壊れたものと錆、木のささくれと転がる小石の世界に、もう何年も火の煙が立っていないのである。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-007"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Silverado platform filled the whole width of the canyon. Above, as I have said, this was a wild, red, stony gully in the mountains; but below it was a wooded dingle. And through this, I was told, there had gone a path between the mine and the Toll House—our natural north-west passage to civilization. I found and followed it, clearing my way as I went through fallen branches and dead trees. It went straight down that steep canyon, till it brought you out abruptly over the roofs of the hotel. There was nowhere any break in the descent. It almost seemed as if, were you to drop a stone down the old iron chute at our platform, it would never rest until it hopped upon the Toll House shingles. Signs were not wanting of the ancient greatness of Silverado. The footpath was well marked, and had been well trodden in the old clays by thirsty miners. And far down, buried in foliage, deep out of sight of Silverado, I came on a last outpost of the mine—a mound of gravel, some wreck of wooden aqueduct, and the mouth of a tunnel, like a treasure grotto in a fairy story. A stream of water, fed by the invisible leakage from our shaft, and dyed red with cinnabar or iron, ran trippingly forth out of the bowels of the cave; and, looking far under the arch, I could see something like an iron lantern fastened on the rocky wall. It was a promising spot for the imagination. No boy could have left it unexplored."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 176
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[124]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-007"
    "translation_ja": "シルヴェラードの平場は峡谷の幅いっぱいを占めていた。上には先に書いたとおり、山の中に赤い石だらけの荒々しい谷がある。だが下は木立の茂る小さな谷だ。そこを通って鉱山から宿まで小道があったという。私たちにとっては、文明へ抜ける天然の北西航路である。小道を見つけ、落ち枝と枯れ木をのけながらたどってみた。急な峡谷をまっすぐ下っていき、いきなり宿の屋根の上に出る。途中、傾斜の途切れる所はどこにもない。平場の古い鉄樋から石を一つ落とせば、宿の屋根板に跳ね上がるまで止まらないかと思えるほどだ。かつてのシルヴェラードの栄華を示す跡もあった。道筋ははっきり残っている。昔、喉を渇かせた鉱夫たちがしっかり踏み固めたのだ。それからずっと下、シルヴェラードの見えない深い葉陰で、鉱山の最後の前哨を見つけた。小石の山、木造の水路の残骸、それに昔話の宝の洞穴めいた坑道の口である。私たちの斜坑から目に見えない形で漏れた水が、辰砂か鉄で赤く染まり、穴のはらわたから軽やかに流れ出ていた。アーチのずっと奥をのぞくと、岩壁に取りつけた鉄の角灯らしい物が見えた。想像をかき立てる場所である。少年なら一人だって、探検せずにはいられなかったろう。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-008"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The stream thenceforward stole along the bottom of the dingle, and made, for that dry land, a pleasant warbling in the leaves. Once, I suppose, it ran splashing down the whole length of the canyon, but now its head waters had been tapped by the shaft at Silverado, and for a great part of its course it wandered sunless among the joints of the mountain. No wonder that it should better its pace when it sees, far before it, daylight whitening in the arch, or that it should come trotting forth into the sunlight with a song."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 177
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[125]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-008"
    "translation_ja": "そこから小川は谷底を忍ぶように通り、この乾いた土地の葉陰に、心地よいさえずりを響かせていた。昔はたぶん峡谷の端から端まで、しぶきを上げて駆け下っていたのだろう。だが今はシルヴェラードの斜坑が水源の水を引き込んで、その流路の多くが山の岩の合わせ目を、日も見ずにさまよう。はるか先、アーチの中が白く明るく見えるところで足取りを速め、歌を歌いながら日差しへ小走りに出てくるのも無理はない。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-009"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The two stages had gone by when I got down, and the Toll House stood, dozing in sun and dust and silence, like a place enchanted. My mission was after hay for bedding, and that I was readily promised. But when I mentioned that we were waiting for Rufe, the people shook their heads. Rufe was not a regular man any way, it seemed; and if he got playing poker—Well, poker was too many for Rufe. I had not yet heard them bracketted together; but it seemed a natural conjunction, and commended itself swiftly to my fears; and as soon as I returned to Silverado and had told my story, we practically gave Hanson up, and set ourselves to do what we could find do-able in our desert-island state."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 178
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[126]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-009"
    "translation_ja": "下り着いたときには二台の駅馬車が通り過ぎたあとで、宿は日差しと埃と静けさの中、魔法にでもかかったようにまどろんでいた。寝床に敷く干し草をもらいに来たのであり、その約束はすぐ取りつけた。だがルーフを待っていると言うと、みな首を横に振った。どうやらルーフはそもそも当てになる男ではない。ましてポーカーを始めでもしたら。まあ、ルーフはポーカーには目がないからね。この取り合わせは初耳だったが、いかにもありそうで、たちまち心配になった。シルヴェラードに戻って話をすると、ハンソンは実質あきらめ、無人島のような状況の中で、自分たちだけでできそうなことを始めた。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-010"
    "section_id": "squatting"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lower room had been the assayer’s office. The floor was thick with débris—part human, from the former occupants; part natural, sifted in by mountain winds. In a sea of red dust there swam or floated sticks, boards, hay, straw, stones, and paper; ancient newspapers, above all—for the newspaper, especially when torn, soon becomes an antiquity—and bills of the Silverado boarding-house, some dated Silverado, some Calistoga Mine. Here is one, verbatim; and if any one can calculate the scale of charges, he has my envious admiration."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 179
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[127]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-squatting-010"
    "translation_ja": "下の部屋は鉱石の分析所だった。床はがらくたで覆われている。前の住人が残したものもあれば、山風がふるい入れたものもあった。赤い埃の海を、枝切れ、板、干し草、藁、石、紙が泳いだり漂ったりしていた。中でも古い新聞が多い。新聞は、破れていればなおさら、すぐに古代の遺物になる。それにシルヴェラードの下宿屋の勘定書もあった。シルヴェラードと記したものも、カリストガ鉱山と記したものもある。一枚、ありのままを下に写す。料金の決め方を割り出せる人がいたら、うらやましいほど立派だ。"
    "translation_status": "reviewed"

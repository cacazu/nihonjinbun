    "translation_status": "reviewed"
    "attributions":
      - "voice": "quoted_person"
        "name_original": "Victor Hugo"
        "name_ja": "ヴィクトル・ユゴー"
        "evidence_ja": "『諸世紀の伝説』所収 Le Romancero du Cid からの回想による引用。"
  - "id": "sv-return-008"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The redbreasts and the brooks of Europe, in that dry and songless land; brave old names and wars, strong cities, cymbals, and bright armour, in that nook of the mountain, sacred only to the Indian and the bear! This is still the strangest thing in all man’s travelling, that he should carry about with him incongruous memories. There is no foreign land; it is the traveller only that is foreign, and now and again, by a flash of recollection, lights up the contrasts of the earth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 162
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[111]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-008"
    "translation_ja": "あの乾いた、鳥の歌もない土地で、ヨーロッパのコマドリと小川を思う。先住の人と熊だけの領分だった山の一角で、いにしえの勇壮な名と戦い、堅固な都市、シンバル、きらめく甲冑を思う。人が旅をするとき、やはりいちばん奇妙なのは、その場に似合わない思い出を持ち歩くことだ。外国という土地はない。よそ者なのは旅人のほうだけで、ふとよみがえる記憶の閃きが、時おり地上の対照を照らし出す。"
    "translation_status": "reviewed"
  - "id": "sv-return-009"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But while I was thus wandering in my fancy, great feats had been transacted in the bar. Corwin the bold had fallen, Kelmar was again crowned with laurels, and the last of the ship’s kettles had changed hands. If I had ever doubted the purity of Kelmar’s motives, if I had ever suspected him of a single eye to business in his eternal dallyings, now at least, when the last kettle was disposed of, my suspicions must have been allayed. I dare not guess how much more time was wasted; nor how often we drove off, merely to drive back again and renew interrupted conversations about nothing, before the Toll House was fairly left behind. Alas! and not a mile down the grade there stands a ranche in a sunny vineyard, and here we must all dismount again and enter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 163
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[112]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-009"
    "translation_ja": "私がそんな空想にふけっている間に、酒場では大いなる武勲が立てられていた。勇猛なコーウィンはついに落ち、ケルマーはまた月桂冠をいただき、最後の船のやかんが人の手に渡った。仮に私がケルマーの無私の心を疑い、あの果てしない道草は何もかも商売一筋のためではないかと思っていたとしても、最後のやかんを処分した今となっては、疑いも静まったはずだ。そのあとどれだけ時間を無駄にしたか、また本当に宿をあとにするまでに、ただ戻って他愛ない話の続きをするためだけに何度馬車を出したかは、想像したくもない。ああ、しかも坂を一マイルも下らないうちに、よく日が当たる葡萄畑の中に牧場がある。ここで全員がまた馬車を降り、中へ入らなければならなかった。"
    "translation_status": "reviewed"
  - "id": "sv-return-010"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Only the old lady was at home, Mrs. Guele, a brown old Swiss dame, the picture of honesty; and with her we drank a bottle of wine and had an age-long conversation, which would have been highly delightful if Fanny and I had not been faint with hunger. The ladies each narrated the story of her marriage, our two Hebrews with the prettiest combination of sentiment and financial bathos. Abramina, specially, endeared herself with every word. She was as simple, natural, and engaging as a kid that should have been brought up to the business of a money-changer. One touch was so resplendently Hebraic that I cannot pass it over. When her “old man” wrote home for her from America, her old man’s family would not intrust her with the money for the passage, till she had bound herself by an oath—on her knees, I think she said—not to employ it otherwise."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 164
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[113]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-010"
    "translation_ja": "家にいたのは年配のご婦人、ギュエレ夫人だけだった。日に焼けた老スイス婦人で、まるで正直を絵に描いたような人だ。一緒にワインを一本飲んで、何年も続くかと思うほど長いおしゃべりをした。ファニーと私が空腹で気を失いそうでなければ、まことに楽しい話だったろう。婦人たちはそれぞれ自分が結婚したいきさつを語った。ユダヤ人の二人の話は、愛情の話が金勘定に落ちる取り合わせがなんとも見事だった。とりわけアブラミーナは、一言話すごとにいとおしさを増した。両替商になるよう育てられた仔山羊がいたら、こんなに素朴で、自然で、愛嬌があるのではないか。きらびやかなほどユダヤ風で、書き落とせない一くだりがある。「うちの亭主」がアメリカから呼び寄せる手紙をよこしたとき、夫の家族は、航海の金を彼女に預けようとしなかった。その金をほかのことには使いませんと、ひざをついてだったと思うが、誓いを立てさせてようやく渡したのだ。"
    "translation_status": "reviewed"
  - "id": "sv-return-011"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This had tickled Abramina hugely, but I think it tickled me fully more."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 165
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[114]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-011"
    "translation_ja": "このことがアブラミーナにはたいそうおかしかったらしい。だが私にはそれ以上におかしかったと思う。"
    "translation_status": "reviewed"
  - "id": "sv-return-012"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mrs. Guele told of her home-sickness up here in the long winters; of her honest, country-woman troubles and alarms upon the journey; how in the bank at Frankfort she had feared lest the banker, after having taken her cheque, should deny all knowledge of it—a fear I have myself every time I go to a bank; and how crossing the Luneburger Heath, an old lady, witnessing her trouble and finding whither she was bound, had given her “the blessing of a person eighty years old, which would be sure to bring her safely to the States. And the first thing I did,” added Mrs. Guele, “was to fall downstairs.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 166
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[115]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-012"
    "translation_ja": "ギュエレ夫人はこの山の長い冬に故郷を恋しく思うことや、旅で身にしみた、実直な田舎の女らしい心配や恐れを語った。フランクフルトの銀行では、小切手を受け取った銀行家が、そのあと何も知らないと言い出しはしないかと心配したそうだ。私も銀行へ行くたび心配になる。リューネブルクの荒野を通っていたときには、その困りようを見かね、行き先を知った老婦人が「八十になる人間の祝福なら、きっと無事に合衆国まで連れていってくれますよ」と祝福してくれた。「それで私が最初にしたことはね」とギュエレ夫人は言い添えた。「階段から落ちたんですよ」"
    "translation_status": "reviewed"
  - "id": "sv-return-013"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At length we got out of the house, and some of us into the trap, when—judgment of Heaven!—here came Mr. Guele from his vineyard. So another quarter of an hour went by; till at length, at our earnest pleading, we set forth again in earnest, Fanny and I white-faced and silent, but the Jews still smiling. The heart fails me. There was yet another stoppage! And we drove at last into Calistoga past two in the afternoon, Fanny and I having breakfasted at six in the morning, eight mortal hours before. We were a pallid couple; but still the Jews were smiling."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 167
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[116]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-013"
    "translation_ja": "ようやく家を出て、何人かはもう馬車に乗っていた。と、そのとき、天の裁きか、葡萄畑からギュエレさんが戻ってきた。こうしてまた十五分。こちらが熱心に頼み込んで、やっと今度こそ出発した。ファニーと私は蒼白で黙りこみ、ユダヤ人の友人たちはまだ笑っていた。もう気が遠くなる。まだもう一度、寄り道があったのだ！　やっとカリストガへ乗り入れたのは午後二時過ぎ。私とファニーが朝の六時に朝食をとって、実に八時間後だった。二人はすっかり青ざめていた。それでもユダヤ人の友人たちは笑っていた。"
    "translation_status": "reviewed"
  - "id": "sv-return-014"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So ended our excursion with the village usurers; and, now that it was done, we had no more idea of the nature of the business, nor of the part we had been playing in it, than the child unborn. That all the people we had met were the slaves of Kelmar, though in various degrees of servitude; that we ourselves had been sent up the mountain in the interests of none but Kelmar; that the money we laid out, dollar by dollar, cent by cent, and through the hands of various intermediaries, should all hop ultimately into Kelmar’s till;—these were facts that we only grew to recognize in the course of time and by the accumulation of evidence. At length all doubt was quieted, when one of the kettle-holders confessed. Stopping his trap in the moonlight, a little way out of Calistoga, he told me, in so many words, that he dare not show face therewith an empty pocket. “You see, I don’t mind if it was only five dollars, Mr. Stevens,” he said, “but I must give Mr. Kelmar something.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 168
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[117]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-014"
    "translation_ja": "かくて村の高利貸しとの遠足は終わった。終わってみても、商売のからくりも、その中でどんな役を振られていたかも、まだ生まれてもいない子供と同じで、何一つ知らなかった。出会った誰もが、縛られ方に強い弱いはあってもケルマーの奴隷だった。私たち自身も、ほかならぬケルマーの利益のためだけに山へ送り込まれた。使った金は一ドルも一セントも、さまざまな人の手を経て、最後はすべてケルマーの金箱へ跳びこんだ。そういう事実は、時をかけて証拠が積み重なって初めてわかってきたのだ。ついに、やかんを買わされたうちの一人が打ち明け、疑いはすっかり晴れた。カリストガを少し出たところで、月明かりの下、馬車を止め、財布を空にして町へ顔を出すわけにはいかないとはっきり言った。「どうせ五ドルくらいならかまわないんですよ、スティーヴンズさん」と彼は言った。「でもケルマーさんには、何か払わなきゃならんのです」"
    "translation_status": "reviewed"
  - "id": "sv-return-015"
    "section_id": "return"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Even now, when the whole tyranny is plain to me, I cannot find it in my heart to be as angry as perhaps I should be with the Hebrew tyrant. The whole game of business is beggar my neighbour; and though perhaps that game looks uglier when played at such close quarters and on so small a scale, it is none the more intrinsically inhumane for that. The village usurer is not so sad a feature of humanity and human progress as the millionaire manufacturer, fattening on the toil and loss of thousands, and yet declaiming from the platform against the greed and dishonesty of landlords. If it were fair for Cobden to buy up land from owners whom he thought unconscious of its proper value, it was fair enough for my Russian Jew to give credit to his farmers. Kelmar, if he was unconscious of the beam in his own eye, was at least silent in the matter of his brother’s mote."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 169
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[118]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-return-015"
    "translation_ja": "全部の横暴がわかった今でも、そのユダヤ人の暴君に対して、おそらく怒るべきほどにはどうしても怒れない。商売とはもともと隣人を貧しくして自分が勝つ遊びだ。これほど狭い所で、これほど小さな規模ですると醜く見えるかもしれないが、そのぶん遊びの本質までとりわけ非人道的になるわけではない。村の高利貸しは、何千人もの労苦と損失を糧に肥え太りながら、演壇では地主の欲深さや不正をがなり立てる百万長者の工場主ほど、人類と人類の進歩につきまとう悲しいものではない。土地の正当な値打ちを知らないだろうと見た所有者からコブデンが土地を買い集めても公正だというなら、私のロシア出のユダヤ人が農民に掛け売りをしても、まずまず公正なわけだ。ケルマーは自分の目の梁に気づいていなかったとしても、少なくとも、兄弟の目の塵については黙っていた。"
    "translation_status": "reviewed"
  - "id": "sv-squatting-001"

          "end": 179
          "exact": "Every minor"
  - "id": "sv-mine-018"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "These were the snatches of his talk that reached us, and they had a damning significance. We, the lords of Silverado, had come face to face with our superior. It is the worst of all quaint and of all cheap ways of life that they bring us at last to the pinch of some humiliation. I liked well enough to be a squatter when there was none but Hanson by; before Ronalds, I will own, I somewhat quailed. I hastened to do him fealty, said I gathered he was the Squattee, and apologized. He threatened me with ejection, in a manner grimly pleasant—more pleasant to him, I fancy, than to me; and then he passed off into praises of the former state of Silverado. “It was the busiest little mining town you ever saw:” a population of between a thousand and fifteen hundred souls, the engine in full blast, the mill newly erected; nothing going but champagne, and hope the order of the day. Ninety thousand dollars came out; a hundred and forty thousand were put in, making a net loss of fifty thousand. The last days, I gathered, the days of John Stanley, were not so bright; the champagne had ceased to flow, the population was already moving elsewhere, and Silverado had begun to wither in the branch before it was cut at the root. The last shot that was fired knocked over the stove chimney, and made that hole in the roof of our barrack, through which the sun was wont to visit slug-a-beds towards afternoon. A noisy, last shot, to inaugurate the days of silence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 269
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[200]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-018"
    "translation_ja": "聞こえてきたのはそういう話の切れ端だったが、私たちには決定的にまずい意味だった。シルヴェラードの領主である私たちは、自分たちより上の領主と向き合っている。風変わりで金のかからない暮らし方というものは、結局どこかで屈辱をこらえねばならないところが一番いけない。相手がハンソンだけなら喜んで住みついていたが、ロナルズを前にしては、正直なところ、いくらかひるんだ。急いで臣下の礼をとり、あなたがその、住みつかれた側のお方とお見受けします、と詫びを入れた。彼は出ていってもらうぞと、いかめしい愛想よさで脅した。愛想よく感じたのは私よりむしろ本人のほうだろう。それから以前のシルヴェラードのすばらしさを語り始めた。「あんなに賑わった小さな鉱山町は、ほかにありませんよ」。人口は千から千五百、機関は全開、選鉱場は出来たばかりで、ほとばしるものといったらシャンパン、何にも増して溢れるのは希望だった。九万ドル分は採れたが十四万ドルつぎ込んだので、差し引き五万ドルの損。末期、つまりジョン・スタンリーの時代には、もうそこまで明るくなかったらしい。シャンパンは止まり、人はすでによそへ移り始め、シルヴェラードは根元で切られる前から枝が枯れ始めていた。最後の発破でストーブの煙突が倒れ、私たちの兵舎の屋根に穴が開いたのだ。午後が近づくと陽が朝寝坊を訪ねてくる、あの穴である。静寂の日々を告げた、騒々しい最後の一発だった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-019"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Throughout this interview, my conscience was a good deal exercised; and I was moved to throw myself on my knees and own the intended treachery. But then I had Hanson to consider. I was in much the same position as Old Rowley, that royal humourist, whom “the rogue had taken into his confidence.” And again, here was Ronalds on the spot. He must know the day of the month as well as Hanson and I. If a broad hint were necessary, he had the broadest in the world. For a large board had been nailed by the crown prince on the very front of our house, between the door and window, painted in cinnabar—the pigment of the country—with doggrel rhymes and contumelious pictures, and announcing, in terms unnecessarily figurative, that the trick was already played, the claim already jumped, and Master Sam the legitimate successor of Mr. Ronalds. But no, nothing could save that man; quem deus vult perdere, prius dementat. As he came so he went, and left his rights depending."
    "source_languages":
      - "en"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 270
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[201]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-019"
    "translation_ja": "このやりとりの間、私はずいぶん良心がとがめ、ひざをついて、企てた裏切りを打ち明けたい衝動にかられた。だがハンソンのことも考えねばならない。「悪党に打ち明け話をされた」、あの王家きっての洒落者、老ロウリーとほとんど同じ立場だった。おまけに当のロナルズは現場にいる。今日が何日かくらい、ハンソンや私と同じく知っているはずだ。あからさまなほのめかしが要るなら、これ以上あからさまなものはなかった。王太子が大きな板を、家のまさに正面、戸口と窓の間に釘で打ちつけたのだ。土地の顔料である辰砂で、へぼな韻文と愚弄する絵が描いてあり、大げさな比喩で、もう手は打たれ、鉱区は乗っ取られ、サム様がロナルズ氏の正当な後継者である、と触れ回っていた。それでもだめだ。あの男は何をしても救えなかった。神は滅ぼそうとする者をまず狂わせる。やって来たときのまま去り、権利を宙ぶらりんにしておいた。"
    "translation_status": "reviewed"
  - "id": "sv-mine-020"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Late at night, by Silverado reckoning, and after we were all abed, Mrs. Hanson returned to give us the newest of her news. It was like a scene in a ship’s steerage: all of us abed in our different tiers, the single candle struggling with the darkness, and this plump, handsome woman, seated on an upturned valise beside the bunks, talking and showing her fine teeth, and laughing till the rafters rang. Any ship, to be sure, with a hundredth part as many holes in it as our barrack, must long ago have gone to her last port. Up to that time I had always imagined Mrs. Hanson’s loquacity to be mere incontinence, that she said what was uppermost for the pleasure of speaking, and laughed and laughed again as a kind of musical accompaniment. But I now found there was an art in it, I found it less communicative than silence itself. I wished to know why Ronalds had come; how he had found his way without Rufe; and why, being on the spot, he had not refreshed his title. She talked interminably on, but her replies were never answers. She fled under a cloud of words; and when I had made sure that she was purposely eluding me, I dropped the subject in my turn, and let her rattle where she would."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 271
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[202]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-020"
    "translation_ja": "シルヴェラードの暮らしではもう夜も遅く、皆が床に入ったあと、ハンソン夫人が最新の知らせを持ってまた来た。船の三等船室のような光景だった。私たちはめいめい段の違う寝台に横たわり、蝋燭一本が闇と取っ組み合っている。ふっくらした美しい婦人は、寝台のそばで逆さにした旅行鞄に座り、話し、いい歯並びを見せ、垂木が響くほど笑っていた。むろん、船に私たちの兵舎の百分の一でも穴が開いていれば、とっくにこの世の最後の港へ着いていたろう。それまで夫人のおしゃべりはただの垂れ流しだと思っていた。話す楽しみのために思いついたまま口にし、伴奏のように笑い声をくり返すのだと。だが今になってそこには技があると気づいた。黙っていられたほうが、まだ何か聞き出せそうだ。なぜロナルズが来たのか。ルーフなしでどうやって道がわかったのか。現地にいたのに、どうして権利を更新しなかったのか。私は知りたかった。夫人は際限なく話しつづけたが、口は止まらなくても、尋ねたことには答えない。言葉の雲に包まれて逃げていく。わざとはぐらかされているとわかると、私のほうがこの話を打ち切り、好きなだけしゃべらせておいた。"
    "translation_status": "reviewed"
  - "id": "sv-mine-021"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She had come to tell us that, instead of waiting for Tuesday, the claim was to be jumped on the morrow. How? If the time were not out, it was impossible. Why? If Ronalds had come and gone, and done nothing, there was the less cause for hurry. But again I could reach no satisfaction. The claim was to be jumped next morning, that was all that she would condescend upon."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 272
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[203]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-021"
    "translation_ja": "夫人が知らせにきたのは、火曜を待つ代わりに、明日にも鉱区を乗っ取るということだった。どうやって？　期限が来ていなければできない。何のために？　ロナルズが来て、何もせず帰ったのなら、なおのこと急ぐ理由はない。だがまたしても何も得心がいかなかった。明日の朝に乗っ取る。それ以上は言ってくださるつもりがない。"
    "translation_status": "reviewed"
  - "id": "sv-mine-022"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And yet it was not jumped the next morning, nor yet the next, and a whole week had come and gone before we heard more of this exploit. That day week, however, a day of great heat, Hanson, with a little roll of paper in his hand, and the eternal pipe alight; Breedlove, his large, dull friend, to act, I suppose, as witness; Mrs. Hanson, in her Sunday best; and all the children, from the oldest to the youngest;—arrived in a procession, tailing one behind another up the path. Caliban was absent, but he had been chary of his friendly visits since the row; and with that exception, the whole family was gathered together as for a marriage or a christening. Strong was sitting at work, in the shade of the dwarf madronas near the forge; and they planted themselves about him in a circle, one on a stone, another on the waggon rails, a third on a piece of plank. Gradually the children stole away up the canyon to where there was another chute, somewhat smaller than the one across the dump; and down this chute, for the rest of the afternoon, they poured one avalanche of stones after another, waking the echoes of the glen. Meantime we elders sat together on the platform, Hanson and his friend smoking in silence like Indian sachems, Mrs. Hanson rattling on as usual with an adroit volubility, saying nothing, but keeping the party at their ease like a courtly hostess."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 273
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[204]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-022"
    "translation_ja": "ところが翌朝になっても、そのまた翌朝にも乗っ取りは行われず、この武勲についてその先の話を聞いたのは丸一週間経ってからだった。七日後のとても暑い日、手に紙を小さく丸めて持ち、いつものパイプに火をつけたハンソン、たぶん証人を務めるのだろう、体が大きくぼんやりした友人ブリードラヴ、よそ行きの服のハンソン夫人、それに上の子から下の子まで全員が、一列になって小道を上ってきた。キャリバンは来なかったが、あの喧嘩以来、気のおけない訪問を控えていたからだ。彼を除けば、結婚式か洗礼式のように一家そろっていた。ストロングは鍛冶場のそば、背の低いマドロナの陰に座って絵を描いていた。一行はまわりに輪をつくって、ある者は石に、ある者はトロッコのレールに、またある者は板切れに腰をおろした。子供たちはしだいに峡谷の奥へ抜け出した。捨石の上に渡したものより少し小さな樋がもう一本ある。午後いっぱい、その樋から雪崩のように石を次々に落とし、谷のこだまを起こしつづけた。そのあいだ大人たちは平場に集って座り、ハンソンと友人は先住民の首長のように黙って煙草をふかした。ハンソン夫人はいつもどおり流暢にまくしたて、何ひとつ語らず、しかし礼儀正しい女主人のように一座の気を楽にした。"
    "translation_status": "reviewed"
  - "id": "sv-mine-023"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Not a word occurred about the business of the day. Once, twice, and thrice I tried to slide the subject in, but was discouraged by the stoic apathy of Rufe, and beaten down before the pouring verbiage of his wife. There is nothing of the Indian brave about me, and I began to grill with impatience. At last, like a highway robber, I cornered Hanson, and bade him stand and deliver his business. Thereupon he gravely rose, as though to hint that this was not a proper place, nor the subject one suitable for squaws, and I, following his example, led him up the plank into our barrack. There he bestowed himself on a box, and unrolled his papers with fastidious deliberation. There were two sheets of note-paper, and an old mining notice, dated May 30th, 1879, part print, part manuscript, and the latter much obliterated by the rains. It was by this identical piece of paper that the mine had been held last year. For thirteen months it had endured the weather and the change of seasons on a cairn behind the shoulder of the canyon; and it was now my business, spreading it before me on the table, and sitting on a valise, to copy its terms, with some necessary changes, twice over on the two sheets of note-paper. One was then to be placed on the same cairn—a “mound of rocks” the notice put it; and the other to be lodged for registration."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 274
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[205]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-023"
    "translation_ja": "当日の用向きには一言も触れなかった。私は一度、二度、三度と話を忍びこませようとしたが、ルーフの平然とした無関心にくじけ、夫人の言葉の奔流に打ちのめされた。私には先住民の勇士らしいところが少しもなく、じりじりと待ちきれなくなった。とうとう街道の追い剥ぎのようにハンソンを追いつめ、止まれ、さあ用向きを明かせと迫った。すると彼はいかめしく立ち上がった。ここはふさわしい場所でなく、女どもの前でする話でもないと言いたげだった。私もならって立ち、板を上って兵舎へ案内した。彼は荷箱に身を落ちつけ、念には念を入れるようなゆっくりした手つきで紙を広げた。便箋が二枚、鉱区についての古い告示が一枚。一八七九年五月三十日付で、印刷と手書きが混じり、手書きのほうは雨であらかた消えていた。前年に鉱山を押さえたのは、この紙そのものだったのだ。十三か月もの間、峡谷の肩の向こうに積み上げた石の上で、天候と季節の移り変わりに耐えていた。今度は私がそれを卓上に広げ、旅行鞄に腰をおろし、必要なところに変更を加えながら、二枚の便箋に文面を一通ずつ写す。片方は同じ石積み、告示の文面では「岩石を積み上げた塚」に置き、もう片方は登録のために提出するのだった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-024"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Rufe watched me, silently smoking, till I came to the place for the locator’s name at the end of the first copy; and when I proposed that he should sign, I thought I saw a scare in his eye. “I don’t think that’ll be necessary,” he said slowly; “just you write it down.” Perhaps this mighty hunter, who was the most active member of the local school board, could not write. There would be nothing strange in that. The constable of Calistoga is, and has been for years, a bed-ridden man, and, if I remember rightly, blind. He had more need of the emoluments than another, it was explained; and it was easy for him to “depytize,” with a strong accent on the last. So friendly and so free are popular institutions."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 275
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[206]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-024"
    "translation_ja": "ルーフは黙ってパイプをふかしながら見ていた。一通目の末尾、鉱区指定者の名前を書くところまで行き、署名を頼むと、目に怯えが浮かんだように見えた。「そこまでせんでもいいでしょう」とゆっくり言った。「あんたが書いてくれりゃいい」。地元の学務委員会でいちばん熱心なこの大猟師は、ひょっとすると文字が書けなかった。そうだとしても不思議はない。カリストガの治安官は何年も寝たきりで、記憶が正しければ目も見えない。ほかの誰よりもその手当が必要で、他人に「だいりぃ」をさせるのは簡単なのだ、と最後の音を強くして説明された。民衆の制度はこうも気さくで自由なのである。"
    "translation_status": "reviewed"
  - "id": "sv-mine-025"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I had done my scrivening, Hanson strolled out, and addressed Breedlove, “Will you step up here a bit?” and after they had disappeared a little while into the chaparral and madrona thicket, they came back again, minus a notice, and the deed was done. The claim was jumped; a tract of mountain-side, fifteen hundred feet long by six hundred wide, with all the earth’s precious bowels, had passed from Ronalds to Hanson, and, in the passage, changed its name from the “Mammoth” to the “Calistoga.” I had tried to get Rufe to call it after his wife, after himself, and after Garfield, the Republican Presidential candidate of the hour—since then elected, and, alas! dead—but all was in vain. The claim had once been called the Calistoga before, and he seemed to feel safety in returning to that."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 276
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[207]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-025"
    "translation_ja": "私が代書を終えると、ハンソンはぶらぶら外へ出て、ブリードラヴに「ちょっとこっちまで上ってこないか」と呼びかけた。二人はシャパラルとマドロナの藪にしばらく隠れ、告示を一枚減らして戻った。それで一件落着だった。鉱区は先に押さえられ、長さ千五百フィート、幅六百フィートの山腹が、大地の貴重なはらわたもろとも、ロナルズからハンソンに移った。移る間に名も〈マンモス〉から〈カリストガ〉に変わった。私はルーフに、妻の名はどうか、自分の名はどうか、またはそのとき共和党の大統領候補だったガーフィールドはどうかと勧めた。この人はその後当選し、残念ながらもう亡くなった。だがどれもむだだった。鉱区は以前にも〈カリストガ〉と呼ばれたことがあり、その名に戻すのが安全だと考えているようだった。"
    "translation_status": "reviewed"
  - "id": "sv-mine-026"
    "section_id": "mine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And so the history of that mine became once more plunged in darkness, lit only by some monster pyrotechnical displays of gossip. And perhaps the most curious feature of the whole matter is this: that we should have dwelt in this quiet corner of the mountains, with not a dozen neighbours, and yet struggled all the while, like desperate swimmers, in this sea of falsities and contradictions. Wherever a man is, there will be a lie."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 277
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[208]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-mine-026"
    "translation_ja": "こうして鉱山の歴史は再び闇の底へ沈み、巨大な花火のような噂が時おりそこを照らすだけになった。この一件の何より不思議なところは、おそらくこうだ。近所に十二人といない山の静かな一角で暮らしながら、私たちは絶えず、必死の泳ぎ手のように、偽りと食い違いの海でもがいていた。人のいるところ、どこにでも嘘はある。"
    "translation_status": "reviewed"
  - "id": "sv-toils-001"

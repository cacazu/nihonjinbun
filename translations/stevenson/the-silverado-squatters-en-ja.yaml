  - "id": "sv-starry-002"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In our rule at Silverado, there was a melancholy interregnum. The queen and the crown prince with one accord fell sick; and, as I was sick to begin with, our lone position on Mount Saint Helena was no longer tenable, and we had to hurry back to Calistoga and a cottage on the green. By that time we had begun to realize the difficulties of our position. We had found what an amount of labour it cost to support life in our red canyon; and it was the dearest desire of our hearts to get a China-boy to go along with us when we returned. We could have given him a whole house to himself, self-contained, as they say in the advertisements; and on the money question we were prepared to go far. Kong Sam Kee, the Calistoga washerman, was entrusted with the affair; and from day to day it languished on, with protestations on our part and mellifluous excuses on the part of Kong Sam Kee."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 242
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[176]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-002"
    "translation_ja": "シルヴェラードにおける私たちの治世に、憂うつな空位時代が訪れた。王妃と王太子が申し合わせたように病に倒れ、私も初めから病人だったから、セント・ヘレナ山の孤立した陣地をこれ以上守ることはできず、カリストガの緑地にある小家へ急いで戻るほかなかった。そのころには、自分たちの立場の難しさがわかり始めていた。あの赤い峡谷で暮らしを支えるにはどれほど働かなければならないか身にしみたので、今度戻るときには中国人の若者を一人連れていきたいと、心から願った。家一軒を丸ごと、広告にあるような「独立住戸」として使わせてやれたし、金のことでもかなり譲る用意はあった。カリストガの洗濯屋コン・サム・キーにこの話を任せた。私たちが日ごと熱心に頼み、コン・サム・キーが蜜のような言い訳を返すうち、話はぐずぐず長引いた。"
    "translation_status": "reviewed"
  - "id": "sv-starry-003"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At length, about half-past eight of our last evening, with the waggon ready harnessed to convey us up the grade, the washerman, with a somewhat sneering air, produced the boy. He was a handsome, gentlemanly lad, attired in rich dark blue, and shod with snowy white; but, alas! he had heard rumours of Silverado. He know it for a lone place on the mountain-side, with no friendly wash-house near by, where he might smoke a pipe of opium o’ nights with other China-boys, and lose his little earnings at the game of tan; and he first backed out for more money; and then, when that demand was satisfied, refused to come point-blank. He was wedded to his wash-houses; he had no taste for the rural life; and we must go to our mountain servantless. It must have been near half an hour before we reached that conclusion, standing in the midst of Calistoga high street under the stars, and the China-boy and Kong Sam Kee singing their pigeon English in the sweetest voices and with the most musical inflections."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 243
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[177]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-003"
    "translation_ja": "とうとう最後の夕べ、八時半ごろ、坂を上って私たちを運ぶ荷馬車にはもう馬をつけてあるところへ、洗濯屋が、いくぶん薄笑いを浮かべて若者を連れてきた。濃紺の上等な衣を着て、雪のように白い履物をはいた、男前で物腰のよい青年だった。ところが、ああ、シルヴェラードの噂は本人の耳にも入っていた。山腹にぽつりと離れた場所で、夜にほかの中国人の若者と一服阿片を吸い、ファンタンでわずかばかりの稼ぎをすれるような、馴染みの洗濯場が近くにないことを知っていた。初めはもっと金をくれとしり込みし、その望みもかなうと、今度はきっぱり行かないと言った。洗濯場に惚れ込んでいて、田舎暮らしは性に合わない。私たちは召使いなしで山へ戻るしかない。この結論に達するまで、半時間近くかかったろう。カリストガの大通りのまん中、星の下で立ったまま、中国人の若者とコン・サム・キーが、このうえなく甘い声と音楽のような抑揚で、片言の英語を歌うように喋った。"
    "translation_status": "reviewed"
  - "id": "sv-starry-004"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We were not, however, to return alone; for we brought with us Joe Strong, the painter, a most good-natured comrade and a capital hand at an omelette. I do not know in which capacity he was most valued—as a cook or a companion; and he did excellently well in both."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 244
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[178]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-004"
    "translation_ja": "ただし私たちだけで帰ったわけではない。画家のジョー・ストロングが一緒だった。すこぶる気立てのいい仲間で、オムレツを作るのもじつにうまい。料理人としてか、仲間としてか、どちらでよりありがたがられていたかは知らないが、どちらの役でもまことに見事だった。"
    "translation_status": "reviewed"
  - "id": "sv-starry-005"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Kong Sam Kee negotiation had delayed us unduly; it must have been half-past nine before we left Calistoga, and night came fully ere we struck the bottom of the grade. I have never seen such a night. It seemed to throw calumny in the teeth of all the painters that ever dabbled in starlight. The sky itself was of a ruddy, powerful, nameless, changing colour, dark and glossy like a serpent’s back. The stars, by innumerable millions, stuck boldly forth like lamps. The milky way was bright, like a moonlit cloud; half heaven seemed milky way. The greater luminaries shone each more clearly than a winter’s moon. Their light was dyed in every sort of colour—red, like fire; blue, like steel; green, like the tracks of sunset; and so sharply did each stand forth in its own lustre that there was no appearance of that flat, star-spangled arch we know so well in pictures, but all the hollow of heaven was one chaos of contesting luminaries—a hurry-burly of stars. Against this the hills and rugged treetops stood out redly dark."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 245
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[179]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-005"
    "translation_ja": "コン・サム・キーとの交渉は予定をずいぶん狂わせた。カリストガを出たのは九時半だったろうし、坂のふもとに着く前に夜がすっかり更けていた。あんな夜は見たことがない。星明かりを描こうとしたことのある画家という画家に、それは嘘だと面と向かって言い立てているようだった。空そのものは力強く赤みがかって、名のない変わりつづける色を帯び、蛇の背のように暗く光沢があった。無数の星が、灯のように大胆に突き出していた。天の川は月に照らされた雲のように明るく、空の半分が天の川に見えた。大きな星は一つ一つ、冬の月よりも冴え冴えと輝いた。光にはありとあらゆる色が染みている。火のような赤、鋼のような青、夕焼けの名残のような緑。どの星も自分だけの輝きでくっきりと際立つので、絵で見慣れた、星を散らした平たい天蓋にはまったく見えない。天の奥行き全体が、光を競う星々の混沌、星の大騒ぎだった。その手前に、丘やごつごつした梢が赤黒く浮かびあがった。"
    "translation_status": "reviewed"
  - "id": "sv-starry-006"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As we continued to advance, the lesser lights and milky ways first grew pale, and then vanished; the countless hosts of heaven dwindled in number by successive millions; those that still shone had tempered their exceeding brightness and fallen back into their customary wistful distance; and the sky declined from its first bewildering splendour into the appearance of a common night. Slowly this change proceeded, and still there was no sign of any cause. Then a whiteness like mist was thrown over the spurs of the mountain. Yet a while, and, as we turned a corner, a great leap of silver light and net of forest shadows fell across the road and upon our wondering waggonful; and, swimming low among the trees, we beheld a strange, misshapen, waning moon, half-tilted on her back."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 246
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[180]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-006"
    "translation_ja": "さらに進むうち、小さな星々と幾筋もの天の川はまず色を失い、やがて消えた。数えきれそうになかった星の軍勢が何百万ずつ減っていく。輝きつづける星もあまりの明るさを和らげ、またいつものように、物思わしげに遠のいた。空は初めの目もくらむ輝きから、ありふれた夜へ落ち着いてゆく。変化はゆっくり進んだが、まだ何が原因か少しも見当がつかなかった。やがて、山の支尾根に靄めいた白さが投げかけられた。さらに少したって道の角を曲がると、銀の光が大きく跳ね、森の影の網が街道と目を見張る馬車の一行に降りかかった。そして木々の間を低く泳ぐ、形のいびつな不思議な欠け月が見えた。仰向けに半ば傾いていた。"
    "translation_status": "reviewed"
  - "id": "sv-starry-007"
    "section_id": "starry"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Where are ye when the moon appears?” so the old poet sang, half-taunting, to the stars, bent upon a courtly purpose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 247
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[181]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-007"
    "translation_ja": "「月が現れたら、お前たちはどこにいる？」　昔の詩人は宮廷風の思惑を胸に、半ばからかって星にそう歌いかけた。"
    "translation_status": "reviewed"
  - "id": "sv-starry-008"
    "section_id": "starry"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “As the sunlight round the dim earth’s midnight tower of shadow pours,
      Streaming past the dim, wide portals,
      Viewless to the eyes of mortals,
      Till it floods the moon’s pale islet or the morning’s golden shores.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 248
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/blockquote[6]/div/p"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-starry-008"
    "translation_ja": |-
      「光の乏しい地球の、真夜中の影の塔をめぐり、日差しがあふれる。
      暗く広い門を流れ過ぎるが、
      地上の人の目には見えぬまま、
      月の青白い小島か、朝の黄金の岸へ注ぎこむ。」
    "translation_status": "reviewed"

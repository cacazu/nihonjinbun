  - "id": "sv-toils-010"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Yet this is but half the picture; our Silverado platform has another side to it. Though there was no soil, and scarce a blade of grass, yet out of these tumbled gravel-heaps and broken boulders, a flower garden bloomed as at home in a conservatory. Calcanthus crept, like a hardy weed, all over our rough parlour, choking the railway, and pushing forth its rusty, aromatic cones from between two blocks of shattered mineral. Azaleas made a big snow-bed just above the well. The shoulder of the hill waved white with Mediterranean heath. In the crannies of the ledge and about the spurs of the tall pine, a red flowering stone-plant hung in clusters. Even the low, thorny chaparral was thick with pea-like blossom. Close at the foot of our path nutmegs prospered, delightful to the sight and smell. At sunrise, and again late at night, the scent of the sweet bay trees filled the canyon, and the down-blowing night wind must have borne it hundreds of feet into the outer air."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 287
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[216]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-010"
    "translation_ja": "しかし、これでは絵の半分にすぎない。シルヴェラードの平場にはもう一つの面がある。土がなく、草の葉一枚もろくにないのに、この崩れた砂礫の山と割れた岩の中から、まるで温室にいるときのように、花々がのびのびと咲いた。クロバナロウバイはたくましい雑草のように荒れた客間じゅうに伸び、線路を覆い、砕けた鉱石の二つの塊の間から、錆色の香り高い円錐形の花を突き出した。水溜まりのすぐ上ではツツジが雪が降り積もったような白い花壇を作った。山の肩は地中海のヒースで白く波打っている。岩棚のひびや高い松の支根のまわりには、赤く花の咲く岩場の草が房になって垂れていた。背の低い棘だらけのシャパラルの藪でさえ、エンドウに似た花でびっしりだった。小道のすぐ下にカリフォルニア・ナツメグがよく茂り、見ても嗅いでも楽しかった。日の出どきと夜更けには、香り月桂樹の匂いが峡谷に満ち、夜の吹き下ろしがそれを何百フィートも外の空気へ運んだに違いない。"
    "translation_status": "reviewed"
  - "id": "sv-toils-011"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All this vegetation, to be sure, was stunted. The madrona was here no bigger than the manzanita; the bay was but a stripling shrub; the very pines, with four or five exceptions in all our upper canyon, were not so tall as myself, or but a little taller, and the most of them came lower than my waist. For a prosperous forest tree, we must look below, where the glen was crowded with green spires. But for flowers and ravishing perfume, we had none to envy: our heap of road-metal was thick with bloom, like a hawthorn in the front of June; our red, baking angle in the mountain, a laboratory of poignant scents. It was an endless wonder to my mind, as I dreamed about the platform, following the progress of the shadows, where the madrona with its leaves, the azalea and calcanthus with their blossoms, could find moisture to support such thick, wet, waxy growths, or the bay tree collect the ingredients of its perfume. But there they all grew together, healthy, happy, and happy-making, as though rooted in a fathom of black soil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 288
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[217]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-011"
    "translation_ja": "むろんこういう植物はみな小ぶりだった。ここのマドロナはマンザニータより大きくならず、月桂樹は若いひょろりとした灌木にすぎない。松でさえ、峡谷上部の四、五本の例外を除けば私より低いか、少し高いだけで、大部分は腰にも届かない。立派に育った森の木を見るには、緑の尖塔がひしめく下の谷を見なければならなかった。だが花と胸をとろかせる匂いについては、誰をうらやむこともない。敷石にでもするような砕石の山は、六月初めのサンザシさながら花におおわれた。赤く焼けた山の一隅は、鼻をつく香りを調合する実験室だった。平場でぼんやり夢想しながら影の動きを追っていると、不思議でならなかった。マドロナは葉に、ツツジやクロバナロウバイは花に、あれだけ厚く水気があり、蝋のようなものを育てるだけの水分をどこで手に入れるのか。月桂樹は何を集めてあの香りをこしらえるのか。それでもみなそこに、健康で幸せに、人も幸せにしながら、まるで一尋もある黒土に根を下ろしたように一緒に育っていた。"
    "translation_status": "reviewed"
  - "id": "sv-toils-012"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Nor was it only vegetable life that prospered. We had, indeed, few birds, and none that had much of a voice or anything worthy to be called a song. My morning comrade had a thin chirp, unmusical and monotonous, but friendly and pleasant to hear. He had but one rival: a fellow with an ostentatious cry of near an octave descending, not one note of which properly followed another. This is the only bird I ever knew with a wrong ear; but there was something enthralling about his performance. You listened and listened, thinking each time he must surely get it right; but no, it was always wrong, and always wrong the same way. Yet he seemed proud of his song, delivered it with execution and a manner of his own, and was charming to his mate. A very incorrect, incessant human whistler had thus a chance of knowing how his own music pleased the world. Two great birds—eagles, we thought—dwelt at the top of the canyon, among the crags that were printed on the sky. Now and again, but very rarely, they wheeled high over our heads in silence, or with a distant, dying scream; and then, with a fresh impulse, winged fleetly forward, dipped over a hilltop, and were gone. They seemed solemn and ancient things, sailing the blue air: perhaps co-oeval with the mountain where they haunted, perhaps emigrants from Rome, where the glad legions may have shouted to behold them on the morn of battle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 289
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[218]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-012"
    "translation_ja": "栄えたのは植物ばかりではない。もっとも鳥は少なかったし、よく声が響くとか、歌と呼ぶだけのものがあるとかいう鳥はいなかった。朝の道連れは、音楽にはならない単調な細い声で鳴いたが、親しげで耳に心地よかった。競争相手はただ一羽。物々しくほとんど一オクターヴ下がっていく鳴き方だが、一音として前の音の続きにふさわしくない。私の知るただ一羽の音痴の鳥だったが、その芸には人を引きつける何かがあった。今度こそ正しく鳴くだろうと、何度も何度も耳を澄ます。だめで、いつも間違い、いつも同じ所を間違う。それなのに本人は歌をご自慢で、技巧と独自の型を添えて歌い、相方にはうっとりするほど魅力的だった。音を外しながら絶え間なく口笛を吹くこの私も、こうして自分の音楽が世の中をどれほど喜ばせるか知る機会を得た。二羽の大きな鳥、鷲だろうと私たちは思ったが、それが峡谷の頂上、空に押しつけたような岩の間に住んでいた。たまに、ごくたまに、頭上のはるか高くを黙って、あるいは遠く消え入りそうな叫びをあげて旋回した。それから新しく勢いをつけて一気に前へ飛び、丘の頂の向こうへ沈んで消えた。青空に帆を張る、荘重で古めかしい生き物に見えた。おそらく彼らが棲む山と同い年なのだろう。いや、ローマから移り住んできて、戦いの朝には喜び勇んだ軍団が、あれを見て歓声を上げたのかもしれない。"
    "translation_status": "reviewed"
  - "id": "sv-toils-013"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But if birds were rare, the place abounded with rattlesnakes—the rattlesnake’s nest, it might have been named. Wherever we brushed among the bushes, our passage woke their angry buzz. One dwelt habitually in the wood-pile, and sometimes, when we came for firewood, thrust up his small head between two logs, and hissed at the intrusion. The rattle has a legendary credit; it is said to be awe-inspiring, and, once heard, to stamp itself for ever in the memory. But the sound is not at all alarming; the hum of many insects, and the buzz of the wasp convince the ear of danger quite as readily. As a matter of fact, we lived for weeks in Silverado, coming and going, with rattles sprung on every side, and it never occurred to us to be afraid. I used to take sun-baths and do calisthenics in a certain pleasant nook among azalea and calcanthus, the rattles whizzing on every side like spinning-wheels, and the combined hiss or buzz rising louder and angrier at any sudden movement; but I was never in the least impressed, nor ever attacked. It was only towards the end of our stay, that a man down at Calistoga, who was expatiating on the terrifying nature of the sound, gave me at last a very good imitation; and it burst on me at once that we dwelt in the very metropolis of deadly snakes, and that the rattle was simply the commonest noise in Silverado. Immediately on our return, we attacked the Hansons on the subject. They had formerly assured us that our canyon was favoured, like Ireland, with an entire immunity from poisonous reptiles; but, with the perfect inconsequence of the natural man, they were no sooner found out than they went off at score in the contrary direction, and we were told that in no part of the world did rattlesnakes attain to such a monstrous bigness as among the warm, flower-dotted rocks of Silverado. This is a contribution rather to the natural history of the Hansons, than to that of snakes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 290
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[219]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-013"
    "translation_ja": "だが鳥が少ないぶん、ガラガラヘビはたくさんいた。ガラガラヘビの巣と名づけてもよかったくらいだ。藪をかき分けると、行く先々で怒ってしゅうしゅう鳴った。一匹は薪の山にいつも住んでいて、時には薪を取りにいくと、丸太二本の間から小さな頭を突き出し、侵入者に威嚇の音を立てた。尾を鳴らす音には伝説めいた評判がある。聞けば身がすくみ、ひとたび聞けば一生記憶に刻まれるという。だが、ちっとも怖い音ではない。虫がたくさん唸る音も、スズメバチのぶうんという羽音も、それと同じくらいたちまち耳に危険を知らせる。実際、私たちは何週間もシルヴェラードで暮らし、そこらじゅうで尾が鳴りだす中を出入りしたが、怖がろうとは思いもよらなかった。よくツツジやクロバナロウバイの間の気持ちよい一角で、日光浴をしたり体操をしたりした。四方で尾が糸車のように鳴り、ちょっと急に動くと、いっせいの威嚇や低いうなりがいよいよ大きく、怒りを増した。だが少しも動じなかったし、襲われたこともない。滞在の終わり近く、カリストガにいた男がいかに怖い音かと長々話し、とうとうみごとにまねてみせた。それでようやく私は、猛毒のヘビの一大都会に私たちが住んでいたこと、その尾の音こそシルヴェラードでいちばんありふれた物音だったことに、はっと気づいた。戻るやさっそく、ハンソン家にこの話を突きつけた。前には、私たちの峡谷はアイルランド同様、ありがたいことに毒のある這うものが一切いないと言い切っていた。それなのに、飾り気のない人間らしい徹底した辻褄のなさで、ばれるやさっそく話を真逆にふくらませた。暖かく花の点在するシルヴェラードの岩場ほど、ガラガラヘビが怪物じみた大きさに育つ所は、世界中にないというのである。これはヘビというより、ハンソン家の博物誌への寄与である。"
    "translation_status": "reviewed"
  - "id": "sv-toils-014"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One person, however, better served by his instinct, had known the rattle from the first; and that was Chuchu, the dog. No rational creature has ever led an existence more poisoned by terror than that dog’s at Silverado. Every whiz of the rattle made him bound. His eyes rolled; he trembled; he would be often wet with sweat. One of our great mysteries was his terror of the mountain. A little away above our nook, the azaleas and almost all the vegetation ceased. Dwarf pines not big enough to be Christmas trees, grew thinly among loose stone and gravel scaurs. Here and there a big boulder sat quiescent on a knoll, having paused there till the next rain in his long slide down the mountain. There was here no ambuscade for the snakes, you could see clearly where you trod; and yet the higher I went, the more abject and appealing became Chuchu’s terror. He was an excellent master of that composite language in which dogs communicate with men, and he would assure me, on his honour, that there was some peril on the mountain; appeal to me, by all that I held holy, to turn back; and at length, finding all was in vain, and that I still persisted, ignorantly foolhardy, he would suddenly whip round and make a bee-line down the slope for Silverado, the gravel showering after him. What was he afraid of? There were admittedly brown bears and California lions on the mountain; and a grizzly visited Rufe’s poultry yard not long before, to the unspeakable alarm of Caliban, who dashed out to chastise the intruder, and found himself, by moonlight, face to face with such a tartar. Something at least there must have been: some hairy, dangerous brute lodged permanently among the rocks a little to the north-west of Silverado, spending his summer thereabout, with wife and family."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 291
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[220]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-014"
    "translation_ja": "ただし本能の助けをもっと得て、初めから尾の音を知っていた者が一人いた。犬のチューチューだ。シルヴェラードのあの犬ほど、恐怖に蝕まれた日々を送った理性ある生き物はいない。尾がひと鳴りするたびに跳び上がった。目をぎょろつかせ、体をふるわせ、ひどく汗をかいていることも多かった。私たちにとっての大きな謎の一つは、彼があの山をひどく恐れたことだ。私たちの一角を少し上に行くと、ツツジも、それ以外の草木もほとんどなくなる。クリスマスの木にもできないほどちびの松が、崩れやすい石やむき出しの砂礫の斜面にまばらに生える。あちこちの小丘には大きな転石が一つずつ、おとなしく座っていた。山を長々と滑ってきて、次の雨までそこでひと休みしているのだ。ヘビが待ち伏せする場所などなく、足もとはよく見えた。それなのに私が高く登れば登るほど、チューチューはますます怯え、哀れなほど私にすがるようになった。犬が人と交わす、いろいろなものから成る言葉を、それはじょうずに操った。名誉にかけて山には何か危険があると私に保証し、私の大切にするものすべてにかけて引き返してくれと訴える。それでも効き目がなく、私がわけもわからず無鉄砲なまま先へ行くと、とうとうくるりと向きを変え、砂礫を後ろにはねあげて、斜面を一直線にシルヴェラードまで駆け戻った。何が怖かったのだろう。山にはたしかに茶色の熊やピューマがいた。少し前にはハイイログマがルーフの鶏の庭へ来て、キャリバンを言いようもなく怯えさせた。侵入者を懲らしめようと飛び出したら、月明かりの下、とんでもない強敵と鼻先で出くわしたのだ。少なくとも何かはいたに違いない。毛むくじゃらの危ない獣が、シルヴェラードの少し北西の岩場に住みつき、妻子とともにそのあたりで夏を過ごしていたのだろう。"
    "translation_status": "reviewed"
  - "id": "sv-toils-015"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And there was, or there had been, another animal. Once, under the broad daylight, on that open stony hillside, where the baby pines were growing, scarcely tall enough to be a badge for a MacGregor’s bonnet, I came suddenly upon his innocent body, lying mummified by the dry air and sun: a pigmy kangaroo. I am ingloriously ignorant of these subjects; had never heard of such a beast; thought myself face to face with some incomparable sport of nature; and began to cherish hopes of immortality in science. Rarely have I been conscious of a stranger thrill than when I raised that singular creature from the stones, dry as a board, his innocent heart long quiet, and all warm with sunshine. His long hind legs were stiff, his tiny forepaws clutched upon his breast, as if to leap; his poor life cut short upon that mountain by some unknown accident. But the kangaroo rat, it proved, was no such unknown animal; and my discovery was nothing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 292
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[221]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-015"
    "translation_ja": "もう一つ別の動物もいた。いや、いたことがあった。一度、真昼の明るさの下で、むき出しの石だらけの山腹を歩いていた。そこに生える松の赤ん坊は、マクレガー一族の帽子につけるしるしにも足らぬほど小さい。そこでいきなり、乾いた空気と太陽にミイラにされた、罪のない体に出くわした。小人のカンガルーである。こういうことには恥ずかしいほど無知なもので、そんな獣は聞いたこともなく、世にも類のない自然の変わりものを目の前にしていると思い、科学で不朽の名を得る望みまで抱き始めた。あの変わった生き物を石の間から取り上げたときほど妙にぞくぞくしたことはめったにない。板切れのように乾き、罪なき心臓はとうに静まったが、全身が日差しで温かかった。長い後ろ脚はこわばり、ちっぽけな前脚は跳ぼうとでもするように胸の上で握られていた。何か知らない災難のため、あの山でいたましい命を断たれたのだ。だがカンガルーネズミは、いざ調べると未知の動物でも何でもなく、私の発見は空振りだった。"
    "translation_status": "reviewed"
  - "id": "sv-toils-016"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Crickets were not wanting. I thought I could make out exactly four of them, each with a corner of his own, who used to make night musical at Silverado. In the matter of voice, they far excelled the birds, and their ringing whistle sounded from rock to rock, calling and replying the same thing, as in a meaningless opera. Thus, children in full health and spirits shout together, to the dismay of neighbours; and their idle, happy, deafening vociferations rise and fall, like the song of the crickets. I used to sit at night on the platform, and wonder why these creatures were so happy; and what was wrong with man that he also did not wind up his days with an hour or two of shouting; but I suspect that all long-lived animals are solemn. The dogs alone are hardly used by nature; and it seems a manifest injustice for poor Chuchu to die in his teens, after a life so shadowed and troubled, continually shaken with alarm, and the tear of elegant sentiment permanently in his eye."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 293
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[222]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-016"
    "translation_ja": "コオロギには事欠かなかった。シルヴェラードの夜を音楽にしたのは、私にはちょうど四匹、それぞれに持ち場があると聞き分けられるように思えた。声では鳥をはるかにしのいだ。よく響く笛のような音が岩から岩へ、意味のない歌劇のように同じことを呼び、同じことを返した。元気いっぱいの子供もこうして一緒に叫び、近所をうんざりさせる。無邪気な、幸せな、耳をつんざく叫び声が、コオロギの歌のように高くなったり低くなったりする。夜の平場に座ると、どうしてこの生き物たちはあんなに幸せなのだろう、人間はどういうわけで、一日を一時間か二時間の叫びで締めくくらないのだろうと思ったものだ。だが長生きの動物はみなしかめつらしいらしい。犬ばかりは自然に薄情な扱いを受けている。かわいそうなチューチューが十いくつかで死ぬなんて、たしかに不公平だ。あんなに影と悩みの多い一生を送り、たえず恐れにふるえ、しゃれた感傷の涙をいつも目にためているのに。"
    "translation_status": "reviewed"
  - "id": "sv-toils-017"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was another neighbour of ours at Silverado, small but very active, a destructive fellow. This was a black, ugly fly—a bore, the Hansons called him—who lived by hundreds in the boarding of our house. He entered by a round hole, more neatly pierced than a man could do it with a gimlet, and he seems to have spent his life in cutting out the interior of the plank, but whether as a dwelling or a store-house, I could never find. When I used to lie in bed in the morning for a rest—we had no easy-chairs in Silverado—I would hear, hour after hour, the sharp cutting sound of his labours, and from time to time a dainty shower of sawdust would fall upon the blankets. There lives no more industrious creature than a bore."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 294
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[223]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-017"
    "translation_ja": "シルヴェラードには、私たちの隣人がもう一ついた。小さいがきわめてせわしなく、ものを壊してまわるやつだ。醜い黒いハエで、ハンソン家の呼び名では「穴掘り」。私たちの家の板壁に、何百匹と住んでいた。人間が錐で開けるより見事な丸い穴から入り、一生を板の中を削り抜くことに費やしたらしい。住まいにするのか、物置にするのかは、ついにわからなかった。シルヴェラードには安楽椅子がないものだから、朝、休みのために寝床に横になっていると、鋭く削る仕事の音が何時間も聞こえ、ときどき毛布に木の粉が繊細なにわか雨のように降った。穴掘りほど働き者の生き物はない。"
    "translation_status": "reviewed"
  - "id": "sv-toils-018"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And now that I have named to the reader all our animals and insects without exception—only I find I have forgotten the flies—he will be able to appreciate the singular privacy and silence of our days. It was not only man who was excluded: animals, the song of birds, the lowing of cattle, the bleating of sheep, clouds even, and the variations of the weather, were here also wanting; and as, day after day, the sky was one dome of blue, and the pines below us stood motionless in the still air, so the hours themselves were marked out from each other only by the series of our own affairs, and the sun’s great period as he ranged westward through the heavens. The two birds cackled a while in the early morning; all day the water tinkled in the shaft, the bores ground sawdust in the planking of our crazy palace—infinitesimal sounds; and it was only with the return of night that any change would fall on our surroundings, or the four crickets begin to flute together in the dark."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 295
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[224]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-018"
    "translation_ja": "さて、読者には私たちの動物と虫を残らず挙げた。いや、ふつうのハエを忘れたことにいま気づいた。これで私たちの日々が、どれほど不思議なほど人目から離れ、静かだったか、わかるだろう。ここから締め出されていたのは人間ばかりではない。獣も、鳥の歌も、牛のうなりも、羊の声も、雲さえも、天候の移り変わりすらなかった。日また日、空はいちめん青い天蓋で、下の松は澄みきった凪の中、身じろぎもせずに立つ。時間と時間を区切るのは、私たち自身の用事の続きぐあいと、天を西へめぐる太陽の一日の大きな歩みだけだった。二羽の鳥が早朝しばらくがやがや鳴き、一日じゅう斜坑に水が澄んだ音を立て、崩れそうな宮殿の板壁の中で穴掘りが木の粉を挽く。ほんのかすかな物音である。夜が戻ってくるまでは、まわりに何の変化も訪れず、闇の中で四匹のコオロギが一緒に笛を吹きだすこともなかった。"
    "translation_status": "reviewed"
  - "id": "sv-toils-019"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Indeed, it would be hard to exaggerate the pleasure that we took in the approach of evening. Our day was not very long, but it was very tiring. To trip along unsteady planks or wade among shifting stones, to go to and fro for water, to clamber down the glen to the Toll House after meat and letters, to cook, to make fires and beds, were all exhausting to the body. Life out of doors, besides, under the fierce eye of day, draws largely on the animal spirits. There are certain hours in the afternoon when a man, unless he is in strong health or enjoys a vacant mind, would rather creep into a cool corner of a house and sit upon the chairs of civilization. About that time, the sharp stones, the planks, the upturned boxes of Silverado, began to grow irksome to my body; I set out on that hopeless, never-ending quest for a more comfortable posture; I would be fevered and weary of the staring sun; and just then he would begin courteously to withdraw his countenance, the shadows lengthened, the aromatic airs awoke, and an indescribable but happy change announced the coming of the night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 296
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[225]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-019"
    "translation_ja": "じっさい、夕暮れが近づくのを私たちがどれほど楽しみにしたかは、どんなに大げさに言っても足りない。昼がとても長かったわけではないが、ひどく体が疲れた。頼りない板を何枚も渡り、足の下で動く石に分け入り、水を汲みに往復し、肉と手紙を手に入れようと谷を宿までよじ下り、飯を炊き、火をおこし、寝床を整える。どれも体力を使い果たす仕事だった。それに、昼が厳しく見つめる中で戸外に暮らしていると、心の弾みまで大いに消耗する。午後には、よほど丈夫かよほど物思いをしない人でないかぎり、むしろ家の涼しい隅にそっと入り込み、文明の椅子に座りたいと思う時刻がある。そのころになると、シルヴェラードの鋭い石も板もひっくり返した荷箱も、私の体には苦になりだす。もっと楽な姿勢をとろうと、果てのない、むだな探求に出る。太陽のじろじろした目に熱っぽく疲れきる。ちょうどそのとき、太陽は礼儀正しく顔を引き始め、影が伸び、香ばしいそよ風が目をさまし、言葉にできない幸せな変化が、夜の来訪を知らせてくれた。"
    "translation_status": "reviewed"
  - "id": "sv-toils-020"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The hours of evening, when we were once curtained in the friendly dark, sped lightly. Even as with the crickets, night brought to us a certain spirit of rejoicing. It was good to taste the air; good to mark the dawning of the stars, as they increased their glittering company; good, too, to gather stones, and send them crashing down the chute, a wave of light. It seemed, in some way, the reward and the fulfilment of the day. So it is when men dwell in the open air; it is one of the simple pleasures that we lose by living cribbed and covered in a house, that, though the coming of the day is still the most inspiriting, yet day’s departure, also, and the return of night refresh, renew, and quiet us; and in the pastures of the dusk we stand, like cattle, exulting in the absence of the load."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 297
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[226]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-020"
    "translation_ja": "やさしい闇の幕がおりてしまうと、夕べの時間は軽やかに飛び去った。コオロギと同じく、夜になると私たちにも、何か心がおどる気分が訪れた。空気を味わうのがよかった。星が一つまた一つと姿を現し、輝く仲間が増えていくのを見るのもよかった。石を集めて樋から轟々と落とし、光のひと波にするのもよかった。なんとなく、一日の報いであり、仕上げでもあるようだった。戸外に暮らすと、こういうことがある。家に押しこめられ、屋根ですっぽり覆われて暮らすと失ってしまう、素朴な喜びの一つだ。やはり昼の到来がいちばん心を励ますとはいえ、昼が去り夜が戻るのもまた、私たちを涼ませ、新たにし、静めてくれる。薄暮の牧草地で、私たちは牛のように立ち、背の重荷がなくなったのを喜んでいる。"
    "translation_status": "reviewed"
  - "id": "sv-toils-021"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Our nights wore never cold, and they were always still, but for one remarkable exception. Regularly, about nine o’clock, a warm wind sprang up, and blew for ten minutes, or maybe a quarter of an hour, right down the canyon, fanning it well out, airing it as a mother airs the night nursery before the children sleep. As far as I could judge, in the clear darkness of the night, this wind was purely local: perhaps dependant on the configuration of the glen. At least, it was very welcome to the hot and weary squatters; and if we were not abed already, the springing up of this lilliputian valley-wind would often be our signal to retire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 298
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[227]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-021"
    "translation_ja": "夜は決して寒くなく、いつも静かだった。ただ一つ、目を引く例外がある。きまって九時ごろ、暖かな風がおこり、十分ばかりか、おそらく十五分、峡谷をまっすぐ吹き下ろした。母親が子供を寝かす前に子供部屋の空気を入れ替えるように、谷をよくあおいで風を通した。澄んだ夜の暗さの中で判断できるかぎり、ごく局地的な風だった。おそらく峡谷の形のせいだろう。少なくとも、暑さに疲れた私たち住みつき組にはありがたい風だった。まだ床についていないときには、この小人の国の谷風が立つのを、引き上げる合図にすることもよくあった。"
    "translation_status": "reviewed"
  - "id": "sv-toils-022"
    "section_id": "toils"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was the last to go to bed, as I was still the first to rise. Many a night I have strolled about the platform, taking a bath of darkness before I slept. The rest would be in bed, and even from the forge I could hear them talking together from bunk to bunk. A single candle in the neck of a pint bottle was their only illumination; and yet the old cracked house seemed literally bursting with the light. It shone keen as a knife through all the vertical chinks; it struck upward through the broken shingles; and through the eastern door and window, it fell in a great splash upon the thicket and the overhanging rock. You would have said a conflagration, or at the least a roaring forge; and behold, it was but a candle. Or perhaps it was yet more strange to see the procession moving bedwards round the corner of the house, and up the plank that brought us to the bedroom door; under the immense spread of the starry heavens, down in a crevice of the giant mountain these few human shapes, with their unshielded taper, made so disproportionate a figure in the eye and mind. But the more he is alone with nature, the greater man and his doings bulk in the consideration of his fellow-men. Miles and miles away upon the opposite hill-tops, if there were any hunter belated or any traveller who had lost his way, he must have stood, and watched and wondered, from the time the candle issued from the door of the assayer’s office till it had mounted the plank and disappeared again into the miners’ dormitory."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-516"
        "precision": "block"
        "source_sequence": 299
        "url": "https://gutenberg.pglaf.org/cache/epub/516/pg516-images.html"
        "xpath": "/html/body/p[228]"
    "source_alignment":
      - "source_id": "gutenberg-516"
        "original_unit_id": "sv-toils-022"
    "translation_ja": "起きるのは相変わらず私が一番で、寝るのは私が最後だった。夜な夜な平場をぶらつき、眠る前に闇をひと風呂浴びた。ほかのみんなは床に入っていて、鍛冶場からでも寝台ごしに交わす話し声が聞こえた。一パイント瓶の口に立てた蝋燭一本きりが明かりである。それなのに、ひびだらけの古い家は、文字どおり光で張り裂けそうに見えた。光は縦に裂けた隙間を片っ端から刃物のように鋭く射抜き、壊れた屋根板を突いて上へ走り、東の戸口や窓からは、一面の飛沫となって藪とせり出す岩に降りかかった。大火事か、さもなければ火を轟かせる鍛冶場と思ったろう。見よ、蝋燭一本にすぎないのだ。またおそらく、寝に行く一行が家の角を回り、寝室の戸へ通じる板を上っていくのを見るほうが、いっそう不思議だった。広大な星空の下、巨大な山の裂け目の底で、風除けもない細い蝋燭を持ったわずかな人影が、目にも心にも、釣り合わぬほど大きく映る。けれど人が自然の中にただ一人でいるほど、その人も、そのすることも、ほかの人間の心の中では大きくなるものだ。向こうの丘々の頂、何マイルも離れたところに、帰りの遅れた猟師か道に迷った旅人がいたなら、きっとそこに立ちつくして、不思議に思いながら見守ったに違いない。蝋燭が鉱石分析所の戸口に現れ、板の上を上り、鉱夫たちの寝室の奥へ、また消えていくまで。"
    "translation_status": "reviewed"

    "translation_ja": |-
      高い丘からダイシャクシギが呼ぶ。
      羊は塀のそばをめえめえ鳴いて歩く。
      ときには錆び声の烏の一族が
      いっせいにやかましく鳴く。
      野生の蜂は庭の花の列を探し求める、
      ヒースばかりには飽きたので。

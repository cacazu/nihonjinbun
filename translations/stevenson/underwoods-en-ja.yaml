    "translation_ja": |-
      咳をつづける子どもたちを思う、
      石畳でわずかな小銭のために客を取る女たちを、
      骨の弱った年寄りたちを、
      老いて貧しく、
      いつだって風雨をこらえ、
      重い仕事をしなきゃならない人たちを。

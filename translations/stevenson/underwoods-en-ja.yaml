    "source_text": |-
      To hear in the pit-mirk on hie
      The brangled collieshangie flie,
      The warl’, they thocht, wi’ land an’ sea,
      Itsel’ wad cowpit;
      An’ for auld airn, the smashed debris
      By God be rowpit.

      抜け目なく、賢く、うまく立ち回らにゃならん。
      ほかの仲間なんか気にかけるな、
      娘っ子も、神さまも。
      ただ酒を飲め。私からあんたへの一番の助言だ。
      じゃ、そういうことさ。

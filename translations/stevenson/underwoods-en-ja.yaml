    "kind": "verse"
    "origin": "source"
    "source_text": |-
      My lads, an’ what am I to say?
      Ye shürely ken the Muse’s way:
      Yestreen, as gleg’s a tyke—the day,
      Thrawn like a cuddy:
      Her conduc’, that to her’s a play,
      Deith to a body.
    "source_languages":
      - "sco"
    "source_locations":

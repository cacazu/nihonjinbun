  - "id": "uw-sco-165"
    "section_id": "uw-sco-poem-xvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      It’s an owercome sooth for age an’ youth
      And it brooks wi’ nae denial,
      That the dearest friends are the auldest friends
      And the young are just on trial.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page138"
        "source_sequence": 530
        "xpath": "/html/body/p[283]"
        "printed_page": "138"
        "anchor": "page138"
    "translation_ja": |-
      年寄りにも若者にも、おなじみの真実、
      まったく否定のしようがない。
      いちばん愛しい友はいちばん古い友、
      新しい友は、いまが試しのとき。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

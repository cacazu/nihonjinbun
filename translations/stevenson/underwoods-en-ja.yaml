  - "id": "uw-en-156"
    "section_id": "uw-en-poem-xxxvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      My house, I say. But hark to the sunny doves
      That make my roof the arena of their loves,
      That gyre about the gable all day long
      And fill the chimneys with their murmurous song:
      Our house, they say; and mine, the cat declares
      And spreads his golden fleece upon the chairs;
      And mine the dog, and rises stiff with wrath
      If any alien foot profane the path.
      So too the buck that trimmed my terraces,
      Our whilome gardener, called the garden his;
      Who now, deposed, surveys my plain abode
      And his late kingdom, only from the road.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page70"
        "source_sequence": 336
        "xpath": "/html/body/p[132]"
        "printed_page": "70"
        "anchor": "page70"
    "translation_ja": |-
      私の家だ、と私は言う。だが陽に鳴く鳩を聞け、
      私の屋根を恋の舞台にして、
      一日じゅう破風のまわりを輪になって飛び、
      くぐもった歌で煙突をみたす鳩を。
      私たちの家だと鳩が言う。私のだと猫が言い、
      椅子に金色の毛皮をひろげてみせる。
      私のだと犬が言い、見慣れぬ足が小道をけがせば、
      腹を立てて硬直し、立ちあがる。
      そう、わが段庭を刈りこんでいた雄鹿、
      昔の庭師も、庭を自分のものと呼んでいた。
      いまは位を奪われ、私の質素な家と
      先だってまでの王国を、道の上から眺めるばかり。
    "translation_status": "reviewed"

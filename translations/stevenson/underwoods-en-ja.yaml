        "printed_page": "106"
        "anchor": "page106"
    "translation_ja": |-
      あんたの買った靴、送っている人生は、
      死んだらほかの誰かが引き継ぐ。
      味気ないパンのひとかけを引き継いで、
      こりゃ旨いと喜ぶ。
      嘆きに満ちたあんたの家を受け継いで、
      そこで幸せに暮らすだろう。

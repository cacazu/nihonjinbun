    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Trout in the burn grow great as herr’n,
      The simple sheep can find their fair’n’;
      The wind blaws clean about the cairn
      Wi’ caller air;
      The muircock an’ the barefit bairn
      Are happy there.
    "source_languages":

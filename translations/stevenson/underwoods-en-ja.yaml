    "translation_ja": |-
      ここでよく私は、静かな心で、
      離れて腰を下ろし、物思いにふけった。
      半端な恋だの、気むずかしい芸だのに、
      頭を悩ませたときは。
      ここで探したものだ、どんな痛みにも効く薬を、
      どんな人の痛みにも。

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Your book, that in some braw new tongue,
      Ye wrote or prentit, preached or sung,
      Will still be just a bairn, an’ young
      In fame an’ years,
      Whan the hale planet’s guts are dung
      About your ears;
    "source_languages":
      - "sco"
    "source_locations":

    "origin": "source"
    "source_text": |-
      An’ whiles, whan they tak heart again,
      An’ life i’ the sun looks braw an’ plain,
      Doun comes a jaw o’ droukin’ rain
      Upon their honours—
      God sends a spate outower the plain,
      Or mebbe thun’ers.

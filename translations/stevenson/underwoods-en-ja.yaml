      ひとり森をさまよった子が、
      穏やかな夕暮れに家へ持ち帰る、
      野じゅうの棘と花を。そのように、
      おお、美しくまことのあなたは、生のすべてから
      花と棘を携えてくる！
    "translation_status": "reviewed"

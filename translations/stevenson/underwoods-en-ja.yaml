    "kind": "verse"
    "origin": "source"
    "source_text": |-
      By Lyne and Tyne, by Thames and Tees,
      By a’ the various river-Dee’s,
      In Mars and Manors ’yont the seas
      Or here at hame,
      Whaure’er there’s kindly folk to please,
      They ken your name.

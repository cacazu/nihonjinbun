      そうして痛みは晴れ、死はなぐさめられる。
      悲しみの家も微笑んで耳を傾ける。もう一度、
      おお、オルフェウスにしてヘラクレス、詩人にして
      救い手よ、もう一度笛の孔を押さえてくれ！

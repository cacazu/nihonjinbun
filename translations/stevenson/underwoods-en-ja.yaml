    "source_text": |-
      Up, Niven, or ower late—an’ dash
      Laigh in the glaur that carnal hash;
      Let spires and pews wi’ gran’ stramash
      Thegether fa’;
      The rumlin’ kist o’ whustles smash
      In pieces sma’.

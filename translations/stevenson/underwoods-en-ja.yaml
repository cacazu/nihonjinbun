  - "id": "uw-en-109"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      It is not yours, O mother, to complain,
      Not, mother, yours to weep,
      Though nevermore your son again
      Shall to your bosom creep,
      Though nevermore again you watch your baby sleep.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page53"
        "source_sequence": 289
        "xpath": "/html/body/p[96]"
        "printed_page": "53"
        "anchor": "page53"
    "translation_ja": |-
      おお母よ、嘆くのはあなたのすることではない。
      母よ、泣くのはあなたのなすことではない。
      あなたの息子はもう二度と
      あなたの懐に這い寄らず、
      わが子が眠るのを見守ることも二度とないけれど。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

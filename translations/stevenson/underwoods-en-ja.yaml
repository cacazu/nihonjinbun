    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Of a’ the ills that flesh can fear,
      The loss o’ frien’s, the lack o’ gear,
      A yowlin’ tyke, a glandered mear,
      A lassie’s nonsense—
      There’s just ae thing I cannae bear,
      An’ that’s my conscience.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"

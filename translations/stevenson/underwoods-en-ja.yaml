    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All that life contains of torture, toil, and treason,
      Shame, dishonour, death, to him were but a name.
      Here, a boy, he dwelt through all the singing season
      And ere the day of sorrow departed as he came.
    "source_languages":

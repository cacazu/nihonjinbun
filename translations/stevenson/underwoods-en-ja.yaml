    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Weel,” an’ says you, wi’ heavin’ breist,
      “Sae far, sae guid, but what’s the neist?
      Yearly we gaither to the feast,
      A’ hopefü’ men—
      Yearly we skelloch ‘Hang the beast—
      Nae sang again!’”
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"

    "origin": "source"
    "source_text": |-
      An’ food’s anither name for clart;
      An’ beasts an’ brambles bite an’ scart;
      An’ what would WE be like, my heart!
      If bared o’ claethin’?
      —Aweel, I cannae mend your cart:
      It’s that or naethin’.
    "source_languages":

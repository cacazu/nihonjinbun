  - "id": "uw-en-056"
    "section_id": "uw-en-poem-xii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Even in the bluest noonday of July,
      There could not run the smallest breath of wind
      But all the quarter sounded like a wood;
      And in the chequered silence and above
      The hum of city cabs that sought the Bois,
      Suburban ashes shivered into song.
      A patter and a chatter and a chirp
      And a long dying hiss—it was as though
      Starched old brocaded dames through all the house
      Had trailed a strident skirt, or the whole sky
      Even in a wink had over-brimmed in rain.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page24"
        "source_sequence": 236
        "xpath": "/html/body/p[56]"
        "printed_page": "24"
        "anchor": "page24"
    "translation_ja": |-
      七月のいちばん青い真昼でさえ、
      かすかな風がひと息吹くだけで、
      あたり一帯が森のように響いた。
      まだらな静けさのなか、〈ボワ〉へ向かう
      街の辻馬車のざわめきを越えて、
      郊外のトネリコは震えながら歌いだした。
      ぱらぱら、ぺちゃくちゃ、ちゅんちゅん、
      そして尾を引くしゅうという音。まるで
      糊のきいた錦を着た老婦人たちが家じゅうを
      耳障りな裾を引いて歩いたようだ。あるいは空が一面、
      瞬き一つのまに雨であふれかえったようだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

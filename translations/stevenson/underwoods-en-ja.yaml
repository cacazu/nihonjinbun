  - "id": "uw-en-069"
    "section_id": "uw-en-poem-xv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In ancient tales, O friend, thy spirit dwelt;
      There, from of old, thy childhood passed; and there
      High expectation, high delights and deeds,
      Thy fluttering heart with hope and terror moved.
      And thou hast heard of yore the Blatant Beast,
      And Roland’s horn, and that war-scattering shout
      Of all-unarmed Achilles, ægis-crowned
      And perilous lands thou sawest, sounding shores
      And seas and forests drear, island and dale
      And mountain dark. For thou with Tristram rod’st
      Or Bedevere, in farthest Lyonesse.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page31"
        "source_sequence": 249
        "xpath": "/html/body/p[66]"
        "printed_page": "31"
        "anchor": "page31"
    "translation_ja": |-
      友よ、あなたの魂は古い物語に住み、
      遠い昔、そこで幼年を送り、そこで
      気高い期待と歓びと行いが、
      ときめく胸に希望とおそれを抱かせた。
      あなたはとうに聞いた、ブラタントの獣を、
      ローランの角笛を、そして敵を散らす、
      武具ひとつなく神盾を頭上に戴くアキレウスの叫びを。
      あなたは危うい国々を見た。鳴りとどろく浜、
      海と薄気味悪い森、島と谷、
      そして暗い山を。あなたはトリストラムか
      ベディヴィアと連れ立ち、果てのリヨネスを駆けたのだ。
    "translation_status": "reviewed"

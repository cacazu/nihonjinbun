    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I read, dear friend, in your dear face
      Your life’s tale told with perfect grace;
      The river of your life, I trace
      Up the sun-chequered, devious bed
      To the far-distant fountain-head.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"

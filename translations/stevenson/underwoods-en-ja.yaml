      うちのマーガレット、おしゃべりに目がない娘、
      ほこり道をおしとやかに歩く。
      エメラルド色の服を後ろでたくし上げて、
      雪のような下裾をのぞかせ、
      白い足首もあらわに、一行の先頭を行く、
      デイヴィット・グローツと一緒に。

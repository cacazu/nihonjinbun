  - "id": "uw-front-013"
    "section_id": "uw-author-note"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The human conscience has fled of late the troublesome domain of conduct for what I should have supposed to be the less congenial field of art: there she may now be said to rage, and with special severity in all that touches dialect; so that in every novel the letters of the alphabet are tortured, and the reader wearied, to commemorate shades of mis-pronunciation. Now spelling is an art of great difficulty in my eyes, and I am inclined to lean upon the printer, even in common practice, rather than to venture abroad upon new quests. And the Scots tongue has an orthography of its own, lacking neither “authority nor author.” Yet the temptation is great to lend a little guidance to the bewildered Englishman. Some simple phonetic artifice might defend your verses from barbarous mishandling, and yet not injure any vested interest. So it seems at first; but there are rocks ahead. Thus, if I wish the diphthong ou to have its proper value, I may write oor instead of our; many have done so and lived, and the pillars of the universe remained unshaken. But if I did so, and came presently to doun, which is the classical Scots spelling of the English down, I should begin to feel uneasy; and if I went on a little farther, and came to a classical Scots word, like stour or dour or clour, I should know precisely where I was—that is to say, that I was out of sight of land on those high seas of spelling reform in which so many strong swimmers have toiled vainly. To some the situation is exhilarating; as for me, I give one bubbling cry and sink. The compromise at which I have arrived is indefensible, and I have no thought of trying to defend it. As I have stuck for the most part to the proper spelling, I append a table of some common vowel sounds which no one need consult; and just to prove that I belong to my age and have in me the stuff of a reformer, I have used modification marks throughout. Thus I can tell myself, not without pride, that I have added a fresh stumbling-block for English readers, and to a page of print in my native tongue, have lent a new uncouthness. Sed non nobis."
    "source_languages":
      - "en"
      - "sco"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#pageix"
        "source_sequence": 13
        "xpath": "/html/body/p[12]"
        "printed_page": "ix"
        "printed_page_end": "xi"
        "anchor": "pageix"
    "translation_ja": "人間の良心というものは近ごろ、厄介な行為の領域から逃げ出し、私にいわせればかえって肌に合いそうにない、芸術の領野へと移っていった。今ではそこで大暴れし、こと方言に関わるとなればとりわけ手厳しい。おかげで小説という小説で、訛りの微妙なちがいを記録するためにアルファベットの文字が責めさいなまれ、読者はうんざりさせられる。さて綴りというのは私には至難の技で、普通の綴りでさえ、新天地の探求に出かけるよりは印刷屋を頼りにしたいくらいだ。しかもスコットランド語には独自の正書法があって、「権威にも著者にもこと欠かない」。それでも、まごつくイングランド人に少し手を貸したい誘惑は大きい。ちょっと音を示す工夫をすれば、自分の詩がむごい扱いを受けずにすみ、しかも既得権を侵すこともないかもしれない。はじめはそう見えるが、行く手には暗礁がある。たとえば ou の二重母音を本来の音で読ませたいなら、our を oor と書いてみればよい。そうした人は何人もいるが、誰も命は取られず、宇宙の柱も揺らがなかった。だが、そう書いたあとですぐ doun、つまり英語の down の伝統的なスコットランド語綴りに出くわしたなら、私も不安になってくるだろう。もう少し進んで stour や dour や clour のような古くからのスコットランド語に当たったなら、自分がどこにいるかはいよいよはっきりする。すなわち、陸も見えない綴り改革の大海原、腕に覚えのある何人もの泳ぎ手がむなしくもがいた海の上だ。愉快な成り行きだと思う人もいよう。私なら、ごぼごぼとひと声立てて沈む。私が行き着いた妥協案は弁護のしようがないし、弁護する気もない。おおむね正統な綴りを通したので、誰も見る必要のない、よくある母音の表を添えておく。また私も時代の人間で、改革者の資質がなくはないという証拠に、音を変えて示す符号を全篇に用いた。これで私は、イングランドの読者の前に新しいつまずきの石を一つ置き、わが母語の印刷された頁に新しい無骨さを一つ加えた、と、いささかの誇りを持って自分に言い聞かせられる。セド・ノン・ノービス、されどわれらの誉れにあらず。"
    "translation_status": "reviewed"

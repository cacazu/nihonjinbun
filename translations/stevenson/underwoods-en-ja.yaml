    "origin": "source"
    "source_text": |-
      What you would like’s a palace ha’,
      Or Sinday parlour dink an’ braw
      Wi’ a’ things ordered in a raw
      By denty leddies.
      Weel, than, ye cannae hae’t: that’s a’
      That to be said is.
    "source_languages":

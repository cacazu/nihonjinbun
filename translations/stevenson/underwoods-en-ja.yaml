    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The prentit stanes that mark the deid,
      Wi’ lengthened lip, the sarious read;
      Syne wag a moraleesin’ heid,
      An’ then an’ there
      Their hirplin’ practice an’ their creed
      Try hard to square.

      （みんなの親愛なる先生が、
      ここ地上の私らのあいだにまだいらしたころ、
      先生をたたえて笛を吹こうとした、
      心をすっかり注いで。
      けれど今は、ご親愛なる先生は去ってしまい、
      もうけっして聞けない。）

    "source_text": |-
      It’s rainin’. Weet’s the gairden sod,
      Weet the lang roads whaur gangrels plod—
      A maist unceevil thing o’ God
      In mid July—
      If ye’ll just curse the sneckdraw, dod!
      An’ sae wull I!
    "source_languages":

    "translation_ja": |-
      ブナと樫が枝をからめて屋根を編み、
      モミも混じる、がんこな昔かたぎの一団。
      夏じゅう一日、煙突が煙をあげ、
      居心地よく、ぬくぬくと、
      あちらこちら、窓がのぞいている、
      緑のなかから。

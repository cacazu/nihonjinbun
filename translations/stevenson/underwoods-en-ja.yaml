  - "id": "uw-sco-016"
    "section_id": "uw-sco-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Frae the high hills the curlew ca’s;
      The sheep gang baaing by the wa’s;
      Or whiles a clan o’ roosty craws
      Cangle thegether;
      The wild bees seek the gairden raws,
      Weariet wi’ heather.
    "source_languages":
      - "sco"

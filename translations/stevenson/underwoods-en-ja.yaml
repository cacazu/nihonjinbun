  - "id": "uw-en-096"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Out of the sun, out of the blast,
      Out of the world, alone I passed
      Across the moor and through the wood
      To where the monastery stood.
      There neither lute nor breathing fife,
      Nor rumour of the world of life,
      Nor confidences low and dear,
      Shall strike the meditative ear.
      Aloof, unhelpful, and unkind,
      The prisoners of the iron mind,
      Where nothing speaks except the hell
      The unfraternal brothers dwell.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page45"
        "source_sequence": 276
        "xpath": "/html/body/p[85]"
        "printed_page": "45"
        "anchor": "page45"
    "translation_ja": |-
      陽から離れ、烈風から離れ、
      世から離れて、私ひとり
      荒野を横切り、森を抜け、
      修道院の立つところへ行った。
      そこではリュートも息を吹きこむ横笛も、
      いのちの世のざわめきも、
      声を落として交わす心の内も、
      瞑想する耳には届かない。
      人を遠ざけ、助けず、愛想なく、
      鉄の心の囚われ人、
      地獄のほかは語るもののない場所に、
      兄弟愛を持たぬ修道士たちが暮らす。
    "translation_status": "reviewed"

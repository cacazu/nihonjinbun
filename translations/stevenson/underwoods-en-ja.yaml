    "translation_ja": |-
      ときに人がようやく元気を取り戻し、
      日の下の暮らしが見事にすっきり見えてくると、
      ずぶ濡れにする雨が、どっと落ちてくる、
      ご立派な皆さまの頭へ。
      神さまは野じゅうを洪水にし、
      それか雷でも鳴らす。

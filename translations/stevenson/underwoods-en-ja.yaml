    "translation_ja": |-
      親愛なるタムソン組よ、私がどこへ行こうと、
      思いはいつもぱっと襲ってくる。
      「何てこった、あのタムソン組のやつら（悪魔に吊られちまえ、
      さもなくば主に手直しされろ！）
      あの厄介な毎年の歌は、
      どうしたって送りつけられない！」

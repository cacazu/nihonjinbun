    "source_text": |-
      There’s rowth o’ wrang, I’m free to say:
      The simmer brunt, the winter blae,
      The face of earth a’ fyled wi’ clay
      An’ dour wi’ chuckies,
      An’ life a rough an’ land’art play
      For country buckies.
    "source_languages":

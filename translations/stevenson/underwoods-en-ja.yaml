    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Wae’s me, for the puir callant than!
      He wambles like a poke o’ bran,
      An’ the lowse rein, as hard’s he can,
      Pu’s, trem’lin’ handit;
      Till, blaff! upon his hinderlan’
      Behauld him landit.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page112"
        "source_sequence": 468
        "xpath": "/html/body/p[227]"
        "printed_page": "112"
        "anchor": "page112"
    "translation_ja": |-
      ああ、かわいそうなこと、その子は！
      ふすまの袋みたいにふらふらし、

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The heart plays dunt wi’ main an’ micht;
      The lasses’ een are a’ sae bricht,
      Their dresses are sae braw an’ ticht,
      The bonny birdies!—
      Puir winter virtue at the sicht
      Gangs heels ower hurdies.
    "source_languages":

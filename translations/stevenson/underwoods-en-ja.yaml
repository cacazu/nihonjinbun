      難儀な問いだ！　でも少なくとも
      今日はあの厄介な獣にまたがった。
      幾度もはねたり急に止まったりして、
      私は頭ごとひっくり返されたが、
      大いに勝ち誇って、あんたらの宴に、
      ほら、ソネットを受け取ってくれ！

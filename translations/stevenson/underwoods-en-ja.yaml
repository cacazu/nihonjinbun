  - "id": "uw-front-008"
    "section_id": "uw-dedication"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Gratitude is but a lame sentiment; thanks, when they are expressed, are often more embarrassing than welcome; and yet I must set forth mine to a few out of many doctors who have brought me comfort and help: to Dr. Willey of San Francisco, whose kindness to a stranger it must be as grateful to him, as it is touching to me, to remember; to Dr. Karl Ruedi of Davos, the good genius of the English in his frosty mountains; to Dr. Herbert of Paris, whom I knew only for a week, and to Dr. Caissot of Montpellier, whom I knew only for ten days, and who have yet written their names deeply in my memory; to Dr. Brandt of Royat; to Dr. Wakefield of Nice; to Dr. Chepmell, whose visits make it a pleasure to be ill; to Dr. Horace Dobell, so wise in counsel; to Sir Andrew Clark, so unwearied in kindness and to that wise youth, my uncle, Dr. Balfour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#pagevi"
        "source_sequence": 8
        "xpath": "/html/body/p[8]"
        "printed_page": "vi"
        "anchor": "pagevi"
    "translation_ja": "感謝とは、なんとも不器用な気持ちだ。礼は口に出して言えば、よろこばれるよりも相手を困らせることが多い。だが、私に慰めと助けを与えてくれた数多くの医師のうち、何人かには、私の感謝を言葉にしておかなければならない。サンフランシスコのウィリー先生。見知らぬ人間に示したご親切を、私が思い出して胸を打たれるのと同じほど、ご本人も喜んで振り返られるに違いない。ダヴォスのカール・リューディ先生。霜に閉ざされた山々で、英国の者たちを守るよき精霊であった。パリのエルベール先生と、モンペリエのケソ先生。前者とはたった一週間、後者とはたった十日ほどのお付き合いだったが、それでいながら、二人の名は私の記憶に深く刻まれている。ロワイヤのブラント先生、ニースのウェイクフィールド先生、訪ねてきてくださるだけで病気でいるのも楽しみになるチェプメル先生、助言において実に賢明なホレス・ドベル先生、親切に倦むことを知らぬサー・アンドルー・クラーク、そして知恵のあるあの若者、私のおじのバルフォア先生。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-front-009"
    "section_id": "uw-dedication"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I forget as many as I remember; and I ask both to pardon me, these for silence, those for inadequate speech. But one name I have kept on purpose to the last, because it is a household word with me, and because if I had not received favours from so many hands and in so many quarters of the world, it should have stood upon this page alone: that of my friend Thomas Bodley Scott of Bournemouth. Will he accept this, although shared among so many, for a dedication to himself? and when next my ill-fortune (which has thus its pleasant side) brings him hurrying to me when he would fain sit down to meat or lie down to rest, will he care to remember that he takes this trouble for one who is not fool enough to be ungrateful?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#pagevi"
        "source_sequence": 9
        "xpath": "/html/body/p[9]"
        "printed_page": "vi"
        "printed_page_end": "vii"
        "anchor": "pagevi"
    "translation_ja": "覚えているのと同じほど、忘れてしまった方もいる。ここに名を挙げなかった方には私の沈黙を、挙げた方には言葉の足りなさを、どうかお許し願いたい。ただ一人、わざと最後に残しておいた名がある。私にとってはいつも口にする名であり、世界のあちこちであれほど多くの手から恩を受けていなかったなら、この頁にはその一人の名だけが載るはずだった。ボーンマスの友、トマス・ボドリー・スコットである。これほど大勢と分かち合う献辞だが、ご自分に捧げられたものとして、受け取ってくださるだろうか。また今度、私の不運（こうして見ると愉しい面もある）が、ちょうど食卓につきたいときや横になって休みたいときに、彼を私のもとへ急がせることになったら、世話を焼く相手にも、受けた恩を忘れぬ程度の分別はあると思い出してくださるだろうか。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

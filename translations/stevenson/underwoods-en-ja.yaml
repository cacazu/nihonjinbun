    "origin": "source"
    "source_text": |-
      Aft whan I sat an’ made my mane,
      Aft whan I laboured burd-alane
      Fishin’ for rhymes an’ findin’ nane,
      Or nane were fit for ye—
      Ye judged me cauld’s a chucky stane—
      No car’n’ a bit for ye!
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"

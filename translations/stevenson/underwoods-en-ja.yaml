    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Bethankit! what a bonny creed!
      What mair would ony Christian need?—
      The braw words rumm’le ower his heid,
      Nor steer the sleeper;
      And in their restin’ graves, the deid
      Sleep aye the deeper.
    "source_languages":

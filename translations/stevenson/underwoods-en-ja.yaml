    "translation_ja": |-
      子　お母さん、ぼくのおでこに手を置いて！
      お母さん、お母さん、ぼくはいまどこ？
      この部屋、どうしてこんなにがらんと広いの？
      こんな遅くまで、どうしてぼくは眠れないの？
    "translation_status": "reviewed"
    "attributions":

    "origin": "source"
    "source_text": |-
      For see—as Doctor Begg explains—
      Hoo easy ’t’s düne! a pickle weans,
      Wha in the Hie Street gaither stanes
      By his instruction,
      The uncovenantit, pentit panes
      Ding to destruction.

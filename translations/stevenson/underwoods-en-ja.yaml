    "kind": "verse"
    "origin": "source"
    "source_text": |-
      A pickle plats an’ paths an’ posies,
      A wheen auld gillyflowers an’ roses:
      A ring o’ wa’s the hale encloses
      Frae sheep or men;
      An’ there the auld housie beeks an’ dozes,
      A’ by her lane.
    "source_languages":

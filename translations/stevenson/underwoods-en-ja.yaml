        "printed_page": "33"
        "anchor": "page33"
    "translation_ja": |-
      いま、見た者にかたく
      使命を課すものがあり、また聞いた者が
      とこしえに聞きつづける調べもある。
      あなたはとこしえに聞く、不死のパンを、
      節美しい神々を、古い山々で
      いつまでも若く、ひとつに歌う神々を。
    "translation_status": "reviewed"

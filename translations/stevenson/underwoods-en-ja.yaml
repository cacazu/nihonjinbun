    "source_text": |-
      A’ day wi’ various ends in view
      The hairsts o’ time I had to pu’,
      An’ made a hash wad staw a soo,
      Let be a man!—
      My conscience! whan my han’s were fu’,
      Whaur were ye than?
    "source_languages":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But hark! the bells frae nearer clang;
      To rowst the slaw, their sides they bang;
      An’ see! black coats a’ready thrang
      The green kirkyaird;
      And at the yett, the chestnuts spang
      That brocht the laird.

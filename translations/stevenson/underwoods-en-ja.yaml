  - "id": "uw-en-072"
    "section_id": "uw-en-poem-xv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      What was this earth, child of the gods, to thee?
      Forth from thy dreamland thou, a dreamer, cam’st
      And in thine ears the olden music rang,
      And in thy mind the doings of the dead,
      And those heroic ages long forgot.
      To a so fallen earth, alas! too late,
      Alas! in evil days, thy steps return,
      To list at noon for nightingales, to grow
      A dweller on the beach till Argo come
      That came long since, a lingerer by the pool
      Where that desirèd angel bathes no more.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page33"
        "source_sequence": 252
        "xpath": "/html/body/p[69]"
        "printed_page": "33"
        "printed_page_end": "34"
        "anchor": "page33"
    "translation_ja": |-
      神々の子よ、この地上はあなたに何だったろう？
      夢見る者、夢の国を出てやって来たあなたの
      耳には古い音楽が鳴り、
      心には死者たちの行いと、
      久しく忘れられた英雄の時代があった。
      ああ、こんなに落ちぶれた地上に、もう遅すぎるのに、
      ああ、こんな悪い時代に、あなたの足は帰りつく。
      真昼に夜鳴きうぐいすを待ち、浜辺に住みつき、
      アルゴーの船を待つ。とうに来た船なのに。
      水のほとりにいつまでもいる、
      恋い望んだ天使はもう水を浴びぬのに。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-073"
    "section_id": "uw-en-poem-xv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      As when the Indian to Dakota comes,
      Or farthest Idaho, and where he dwelt,
      He with his clan, a humming city finds;
      Thereon awhile, amazed, he stares, and then
      To right and leftward, like a questing dog,
      Seeks first the ancestral altars, then the hearth
      Long cold with rains, and where old terror lodged,
      And where the dead. So thee undying Hope,
      With all her pack, hunts screaming through the years:
      Here, there, thou fleeëst; but nor here nor there
      The pleasant gods abide, the glory dwells.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page34"
        "source_sequence": 253
        "xpath": "/html/body/p[70]"
        "printed_page": "34"
        "anchor": "page34"
    "translation_ja": |-
      ちょうど先住の民がダコタか、
      遠いアイダホに来て、氏族とともに
      暮らしていたところににぎわう町を見つけるように。
      しばし驚き見つめたのち、
      右へ左へ、獲物を探す犬のように、
      まず先祖の祭壇を探し、それから炉を、
      雨でとうに冷えた炉を、かつておそれの住んだ場所、
      死者たちのいる所を探す。そのようにあなたを、不死の〈望み〉が
      猟犬をみな連れ、叫びながら年月を越えて追う。
      ここへ、あそこへ、あなたは逃げる。だがここにもそこにも
      朗らかな神々はいない。栄光は住まない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-074"
    "section_id": "uw-en-poem-xv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      That, that was not Apollo, not the god.
      This was not Venus, though she Venus seemed
      A moment. And though fair yon river move,
      She, all the way, from disenchanted fount
      To seas unhallowed runs; the gods forsook
      Long since her trembling rushes; from her plains
      Disconsolate, long since adventure fled;
      And now although the inviting river flows,
      And every poplared cape, and every bend
      Or willowy islet, win upon thy soul
      And to thy hopeful shallop whisper speed;
      Yet hope not thou at all; hope is no more;
      And O, long since the golden groves are dead
      The faery cities vanished from the land!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page34"
        "source_sequence": 254
        "xpath": "/html/body/p[71]"
        "printed_page": "34"
        "printed_page_end": "35"
        "anchor": "page34"
    "translation_ja": |-
      あれは、あれはアポロンではなかった、神ではなかった。
      これはウェヌスではなかった、ひとときは
      ウェヌスかと思えたけれど。かなたの川は美しいが、
      魔法を失った源から、聖ならざる海まで、
      流れの初めから終わりまで、そうしてゆく。神々は
      その震える葦をとうに見捨てた。
      さびしい川沿いの原から、冒険はとうに逃げた。
      いまも誘うように川が流れ、
      ポプラの立つ岬、流れの曲がり、
      柳の小島があなたの魂を捕らえ、
      望みに満ちた小舟にやさしく急げとささやくけれど、
      望みなどいっさい抱くな。望みはもうない。
      おお、黄金の林はとうに枯れ、
      妖精の都も地上から消えたのだ！
    "translation_status": "reviewed"

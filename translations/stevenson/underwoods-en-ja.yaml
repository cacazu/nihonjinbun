        "anchor": "page105"
    "translation_ja": |-
      ある人には、人生の窪地もこんなもの。
      草の生えた道をゆけば、心配ひとついらない。
      だが、やって来る大きな風に気をつけてみろ、
      吹きわたり、冷たい風に。
      あるいはほとばしる小川が太鼓を鳴らすのを聞け、
      ズアオアトリの淵で。

  - "id": "uw-en-057"
    "section_id": "uw-en-poem-xii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Hark, in these shady parlours, how it talks
      Of the near Autumn, how the smitten ash
      Trembles and augurs floods! O not too long
      In these inconstant latitudes delay,
      O not too late from the unbeloved north
      Trim your escape! For soon shall this low roof
      Resound indeed with rain, soon shall your eyes
      Search the foul garden, search the darkened rooms,
      Nor find one jewel but the blazing log.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page25"
        "source_sequence": 237
        "xpath": "/html/body/p[57]"
        "printed_page": "25"
        "anchor": "page25"
    "translation_ja": |-
      聞いてごらん、この日陰の居間で、なんと語るか、
      秋の近さを。打たれたトネリコが
      身を震わせ、大雨を予告するぞ！　ああ、
      気の変わりやすいこの緯度に長居をせず、
      ああ、愛されぬ北から逃げ出す支度を
      遅れずにせよ。やがてこの低い屋根には
      本当に雨が鳴り、あなたの目はやがて
      荒れた庭を探し、暗くなった部屋を探し、
      燃える薪のほかに宝石一つ見つけられぬだろう。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Dear Thamson class, whaure’er I gang
      It aye comes ower me wi’ a spang:
      “Lordsake! they Thamson lads—(deil hang
      Or else Lord mend them!)—
      An’ that wanchancy annual sang
      I ne’er can send them!”
    "source_languages":
      - "sco"
    "source_locations":

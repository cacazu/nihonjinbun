  - "id": "uw-en-014"
    "section_id": "uw-en-poem-iii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      On the great streams the ships may go
      About men’s business to and fro.
      But I, the egg-shell pinnace, sleep
      On crystal waters ankle-deep:
      I, whose diminutive design,
      Of sweeter cedar, pithier pine,
      Is fashioned on so frail a mould,
      A hand may launch, a hand withhold:
      I, rather, with the leaping trout
      Wind, among lilies, in and out;
      I, the unnamed, inviolate,
      Green, rustic rivers, navigate;
      My dipping paddle scarcely shakes
      The berry in the bramble-brakes;
      Still forth on my green way I wend
      Beside the cottage garden-end;
      And by the nested angler fare,
      And take the lovers unaware.
      By willow wood and water-wheel
      Speedily fleets my touching keel;
      By all retired and shady spots
      Where prosper dim forget-me-nots;
      By meadows where at afternoon
      The growing maidens troop in June
      To loose their girdles on the grass.
      Ah! speedier than before the glass
      The backward toilet goes; and swift
      As swallows quiver, robe and shift
      And the rough country stockings lie
      Around each young divinity.
      When, following the recondite brook,
      Sudden upon this scene I look,
      And light with unfamiliar face
      On chaste Diana’s bathing-place,
      Loud ring the hills about and all
      The shallows are abandoned. . . .
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page4"
        "source_sequence": 194
        "xpath": "/html/body/p[23]"
        "printed_page": "4"
        "printed_page_end": "6"
        "anchor": "page4"
    "translation_ja": |-
      大河には大きな船が行き来しよう、
      人の仕事を運びながら。
      だが私は卵の殻の小舟、
      足首ほどの澄んだ水に眠る。
      もともと小さな造りの私は、
      芳しい杉と、心材のよい松をもって、
      こんなにはかなげな形に仕立てられ、
      片手が浮かべ、片手が引き留める。
      私はむしろ、跳ねる鱒とともに、
      睡蓮のあいだを縫って出入りする。
      名もなく荒らされることもない、
      緑の田舎の川を航く。
      私の櫂が水を掻いても揺れはしない、
      茨の茂みになる木の実ひとつ。
      つつましい家の庭の外れをかすめ、
      緑の道をなおも進みゆく。
      腰を据えた釣り人のそばを通り、
      油断している恋人たちに出くわす。
      柳林や水車のかたわらを、
      そっと触れる私の竜骨はすばやく滑り、
      ほの暗く勿忘草が茂る、
      人目につかぬ日陰を通る。
      六月の昼下がり、娘盛りの乙女が
      群れをなして草地へ出て、
      草の上で帯をほどく、その草地へ。
      ああ、鏡の前の身支度にくらべて、
      衣を脱ぐのはなんとすばやいこと。
      燕の羽ばたくほどの間に上衣も肌衣も、
      ごわつく田舎の靴下も
      若い女神たちのまわりに散らばる。
      人知れぬ小川をたどりながら、
      いきなり私がその眺めを見つけ、
      見知らぬ顔で、清らかなディアナの
      水浴び場に出くわすと、
      丘という丘に大声が響きわたり、
      浅瀬には誰もいなくなる……。

    "origin": "source"
    "source_text": |-
      O Lord, if this indeed be sae,
      Let daw that sair an’ happy day!
      Again’ the warl’, grawn auld an’ gray,
      Up wi’ your aixe!
      An’ let the puir enjoy their play—
      I’ll thole my paiks.
    "source_languages":

      俗悪な石を広場じゅうにまき散らせ。
      カイルからフルーインまで、
      地獄から天国まで響く大きな一撃一撃で知らせろ、
      あんたら二人のやってる良い仕事を、
      ベッグとニーヴンのやってる仕事を。

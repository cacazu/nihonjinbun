        "source_sequence": 242
        "xpath": "/html/body/p[61]"
        "printed_page": "26"
        "printed_page_end": "27"
        "anchor": "page26"
    "translation_ja": |-
      すると晴れやかになった魂が
      この不幸な岸辺を歩きまわり、
      舟を漕ぐ者が来るのを
      耳をそばだてて待つあいだ、
      私は火を逃れたあなたの書物、
      溌剌とした愉しい本を手に取った。［27］
      すると、つれない運命にもかかわらず、
      魂があまりにも生き返って、
      思いは何もかも逃げ出した、
      ヴェネツィアで休暇をすごそうと。
    "translation_status": "reviewed"

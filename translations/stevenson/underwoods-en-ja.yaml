    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Here aft hae I, wi’ sober heart,
      For meditation sat apairt,
      When orra loves or kittle art
      Perplexed my mind;
      Here socht a balm for ilka smart
      O’ humankind.
    "source_languages":
      - "sco"
    "source_locations":

        "span":
          "start": 121
          "end": 156
          "exact": "And the maist o’ mines hae left me."
      - "side": "translation"
        "kind": "indent"
        "columns": 3
        "span":
          "start": 27
          "end": 45
          "exact": "私から友を奪っていったのはそいつだ。"
      - "side": "translation"
        "kind": "indent"

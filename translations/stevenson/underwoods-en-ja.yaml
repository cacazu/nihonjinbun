    "kind": "verse"
    "origin": "source"
    "source_text": |-
      An’ since at life ye’ve taen the grue,
      An’ winnae blithely hirsle through,
      Ye’ve fund the very thing to do—
      That’s to drink speerit;
      An’ shüne we’ll hear the last o’ you—
      An’ blithe to hear it!
    "source_languages":
      - "sco"

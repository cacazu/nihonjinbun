  - "id": "uw-en-079"
    "section_id": "uw-en-poem-xvii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Who comes to-night? We ope the doors in vain.
      Who comes? My bursting walls, can you contain
      The presences that now together throng
      Your narrow entry, as with flowers and song,
      As with the air of life, the breath of talk?
      Lo, how these fair immaculate women walk
      Behind their jocund maker; and we see
      Slighted De Mauves, and that far different she,
      Gressie, the trivial sphynx; and to our feast
      Daisy and Barb and Chancellor (she not least!)
      With all their silken, all their airy kin,
      Do like unbidden angels enter in.
      But he, attended by these shining names,
      Comes (best of all) himself—our welcome James.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page38"
        "source_sequence": 259
        "xpath": "/html/body/p[74]"
        "printed_page": "38"
        "anchor": "page38"
    "translation_ja": |-
      今夜来るのは誰だろう？　戸を開けても誰も来ない。
      来るのは誰だろう？　張り裂けそうなわが壁よ、この人々を
      抱きとめられるか。いま狭い玄関へと
      花と歌を引き連れ、生の気配を、
      語らいの息を引き連れて集う人々を。
      見よ、この美しく潔白な女たちが
      陽気な作者の後ろを行く。
      顧みられぬド・モーヴ夫人がいる。あれはまるで違う、
      軽薄な謎めく女、グレッシーだ。われらの宴へ、
      デイジー、バーブ、そしてチャンセラー（彼女はとりわけ！）が、
      絹をまとった、空気のように軽い仲間をみな連れ、
      招かれざる天使のように入ってくる。
      そして、輝かしい名の者たちに伴われて
      （それがなにより）ジェイムズご本人だ。よくぞいらした！
    "translation_status": "reviewed"

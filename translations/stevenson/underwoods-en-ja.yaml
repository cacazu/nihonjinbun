        "anchor": "page83"
    "translation_ja": |-
      だが今は古い街の通りという通りと、
      雪とみぞれに満ちた冬とが、
      さすらう私の足をしばし閉じこめる、
      そぞろに浮きたつ気性をも。
      今は掃き清めた炉がありがたい、
      歌うやかんも。

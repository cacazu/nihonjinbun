    "kind": "verse"
    "origin": "source"
    "source_text": |-
      While thus the lave o’ mankind’s lost,
      O’ Scotland still God maks His boast—
      Puir Scotland, on whase barren coast
      A score or twa
      Auld wives wi’ mutches an’ a hoast
      Still keep His law.
    "source_languages":
      - "sco"

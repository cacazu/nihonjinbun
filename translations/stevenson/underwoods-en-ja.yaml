    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Whaur braid the briery muirs expand,
      A waefü’ an’ a weary land,
      The bumblebees, a gowden band,
      Are blithely hingin’;
      An’ there the canty wanderer fand
      The laverock singin’.

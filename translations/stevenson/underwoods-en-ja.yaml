    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Came and stayed and went, and now when all is finished,
      You alone have crossed the melancholy stream,
      Yours the pang, but his, O his, the undiminished
      Undecaying gladness, undeparted dream.
    "source_languages":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Straucht, at the name, a trusty tyke,
      My conscience girrs ahint the dyke;
      Straucht on my hinderlands I fyke
      To find a rhyme t’ ye;
      Pleased—although mebbe no pleased-like—
      To gie my time t’ye.
    "source_languages":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      An’ whiles I’m kind o’ pleased a blink,
      An’ kind o’ fleyed forby, to think,
      For a’ my rowth o’ meat an’ drink
      An’ waste o’ crumb,
      I’ll mebbe have to thole wi’ skink
      In Kingdom Come.

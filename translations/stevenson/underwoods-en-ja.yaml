    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But since we’re in it, willy-nilly,
      We maun be watchfü’, wise an’ skilly,
      An’ no mind ony ither billy,
      Lassie nor God.
      But drink—that’s my best counsel till ’e:
      Sae tak the nod.
    "source_languages":

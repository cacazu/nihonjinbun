    "kind": "verse"
    "origin": "source"
    "source_text": |-
      My bonny man, the warld, it’s true,
      Was made for neither me nor you;
      It’s just a place to warstle through,
      As job confessed o’t;
      And aye the best that we’ll can do
      Is mak the best o’t.
    "source_languages":
      - "sco"
    "source_locations":

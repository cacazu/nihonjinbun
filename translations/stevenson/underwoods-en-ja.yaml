    "kind": "verse"
    "origin": "source"
    "source_text": |-
      A thocht ahint, in runkled breeks,
      A’ spiled wi’ lyin’ by for weeks,
      The guidman follows closs, an’ cleiks
      The sonsie missis;
      His sarious face at aince bespeaks
      The day that this is.
    "source_languages":

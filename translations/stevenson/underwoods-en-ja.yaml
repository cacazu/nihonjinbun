        "printed_page": "40"
        "anchor": "page40"
    "translation_ja": |-
      そうしてひととき輝いて、
      やがて埃っぽい日々を送り、埃っぽい人の手に渡った。
      藁に包まれ、長く眠り、
      長く物売りのほかに誰も見なかった。
      ついに無言のわが目の前を、
      見ることのできる人が通りかかった。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-083"
    "section_id": "uw-en-poem-xviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now with an outlandish grace,
      To the sparkling fire I face
      In the blue room at Skerryvore;
      Where I wait until the door
      Open, and the Prince of Men,
      Henry James, shall come again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"

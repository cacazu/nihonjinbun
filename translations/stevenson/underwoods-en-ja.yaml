  - "id": "uw-en-045"
    "section_id": "uw-en-poem-ix"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And as the berry, pale and sharp,
      Springs on some ditch’s counterscarp
      In our ungenial, native north—
      You put your frosted wildings forth,
      And on the heath, afar from man,
      A strong and bitter virgin ran.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page17"
        "source_sequence": 225
        "xpath": "/html/body/p[48]"
        "printed_page": "17"
        "printed_page_end": "18"
        "anchor": "page17"
    "translation_ja": |-
      蒼白く味の鋭い木の実が、
      私たちの寒々とした北国で
      溝の向こう斜面などに生えるように、
      あなたは霜をまとった野生の実をつけた。
      そして人の遠い荒野を、
      強く苦みを帯びた乙女が駆けた。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-046"
    "section_id": "uw-en-poem-ix"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The berry ripened keeps the rude
      And racy flavour of the wood.
      And you that loved the empty plain
      All redolent of wind and rain,
      Around you still the curlew sings—
      The freshness of the weather clings—
      The maiden jewels of the rain
      Sit in your dabbled locks again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page18"
        "source_sequence": 226
        "xpath": "/html/body/p[49]"
        "printed_page": "18"
        "anchor": "page18"
    "translation_ja": |-
      木の実は熟しても、野趣のある
      森の荒々しい風味を失わない。
      風雨の香りに満ちた
      人気のない原を愛したあなたのまわりでは、
      今もダイシャクシギが鳴き、
      天気の清新な息が離れない。
      雨の汚れなき宝石が、
      濡れた髪にまた宿る。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

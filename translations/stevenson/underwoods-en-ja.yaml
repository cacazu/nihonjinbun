    "kind": "verse"
    "origin": "source"
    "source_text": |-
      O sir, the gods are kind indeed,
      An’ hauld ye for an honoured heid,
      That for a wee bit clarkit screed
      Sae weel reward ye,
      An’ lend—puir Rabbie bein’ deid—
      His ghaist to guard ye.
    "source_languages":

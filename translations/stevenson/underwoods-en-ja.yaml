    "translation_ja": |-
      冬を知る運命にはなく、ただ春のみを知る者が、
      花の四月をしばし朗らかに踏み歩き、
      音楽と、考える喜びと、見る喜びを存分に味わった。
      来て、とどまり、そして去ったが、微笑みをやめることはなかった。

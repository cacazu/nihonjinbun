        "xpath": "/html/body/p[62]"
        "printed_page": "27"
        "printed_page_end": "28"
        "anchor": "page27"
    "translation_ja": |-
      あなたがなし遂げた丹精のおかげ、
      四月の空気のように澄んだ頁のおかげで、
      帆を、鐘を、鳥を、私は知っている、
      遠くフリウリに積もる雪をも。
      陸と海、陽と翳、
      そして灯のちりばめられた青い夕暮れを。
      これにも、あれにも、何もかも、友よ、
      あなたの本の端から端まで、
      パロン・ピエロの羊肉のハムにいたるまで、
      私はあなたへの借りを返せずにいる。

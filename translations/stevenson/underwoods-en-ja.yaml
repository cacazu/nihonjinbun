    "source_text": |-
      An’ I, wha sang o’ rain an’ snaw,
      An’ weary winter weel awa’,
      Noo busk me in a jacket braw,
      An’ tak my place
      I’ the ram-stam, harum-scarum raw,
      Wi’ smilin’ face.

    "origin": "source"
    "source_text": |-
      But noo the auld city, street by street,
      An’ winter fu’ o’ snaw an’ sleet,
      Awhile shut in my gangrel feet
      An’ goavin’ mettle;
      Noo is the soopit ingle sweet,
      An’ liltin’ kettle.
    "source_languages":

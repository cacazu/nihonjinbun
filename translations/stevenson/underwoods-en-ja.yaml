      おお主よ、これがまことならば、
      つらくも幸せなその日を明けさせてくだされ！
      すっかり老い、灰色になった世界に向けて、
      斧を振り上げてくだされ！
      貧しい者は存分に遊ばせてやってくだされ、
      私なら折檻を我慢しよう。

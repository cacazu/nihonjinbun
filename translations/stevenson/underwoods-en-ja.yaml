    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I mind me on the hoastin’ weans—
      The penny joes on causey stanes—
      The auld folk wi’ the crazy banes,
      Baith auld an’ puir,
      That aye maun thole the winds an’ rains
      An’ labour sair.
    "source_languages":

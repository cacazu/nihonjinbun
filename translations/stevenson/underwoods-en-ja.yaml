        "printed_page": "80"
        "anchor": "page80"
    "translation_ja": |-
      身のちぢむような、身を刺す東の風から、
      北国の雪や海の濃い霧から、
      庭の木々にすっぽり包まれた、
      なんてきれいなひとところ。
      大きなペントランドの両膝のあいだに、
      おまえは安らかに座っている。

    "translation_ja": |-
      ここで何度も、物陰にひとり潜み、
      ホラティウスか、たぶんモンテーニュを相手に、
      朝の時間を来ては去るにまかせた、
      頭の上で。
      小石ひとつだってやるものか、
      読んだ本を全部もらっても。

    "translation_ja": |-
      今は冬の風が嘆く。
      横町という横町が冷たい泥だらけ。
      ずぶ濡れの娘、髪ぼうぼうの子、
      それに酔った若者たちへ、
      真っ暗な夜、冬の雨が
      ぽたぽた、ばしゃばしゃ降りかかる。

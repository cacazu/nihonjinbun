          "exact": "新しい友は、いまが試しのとき。"
  - "id": "uw-sco-166"
    "section_id": "uw-sco-poem-xvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      There’s a rival bauld wi’ young an’ auld
      And it’s him that has bereft me;
      For the sürest friends are the auldest friends
      And the maist o’ mines hae left me.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page138"
        "source_sequence": 531
        "xpath": "/html/body/p[284]"
        "printed_page": "138"
        "anchor": "page138"
    "translation_ja": |-
      若者にも年寄りにも手を出す、ずうずうしい恋敵がいて、
      私から友を奪っていったのはそいつだ。
      最も頼れる友はいちばん古い友、
      私の友の大半は、私を置いていった。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":

        "anchor": "page107"
    "translation_ja": |-
      ちょうどむっつりした、手に負えない子が、
      ひとりで座ってふてくされ、
      とうとうぴしゃりと手痛く叩かれ、
      しっしと寝床へ追いやられると、
      ほかの子はみな遊びだす、
      鳶みたいにいきいきとして。

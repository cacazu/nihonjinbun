        "anchor": "page112"
    "translation_ja": |-
      だが、べそをかく子を見たことはないか、
      馬鈴薯の皮みたいに力のない子を。
      蹄鉄を鳴らして馬を御すより、
      粥をかきまわすほうに慣れてる子が、
      ひとり湿原や石塚を通って、
      産婆を呼びに行けと放り出されるのを。

        "printed_page": "127"
        "anchor": "page127"
    "translation_ja": |-
      それでもときには、血が額にぱっと上る。
      こんなにやわらかに寝て、気ままに生きるのに、
      私より立派な人たちが働き、そして死んでゆくんだ、
      とんでもない場所で。
      「神さまはどこだ？」と私は叫ぶ、「私が何者だから、
      こんな恵みにあずかれる？」

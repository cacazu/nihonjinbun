    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Sic-like the howes o’ life to some:
      Green loans whaur they ne’er fash their thumb.
      But mark the muckle winds that come
      Soopin’ an’ cool,
      Or hear the powrin’ burnie drum
      In the shilfa’s pool.
    "source_languages":

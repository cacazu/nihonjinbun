    "translation_ja": |-
      あたたかな胸の、ひとつの早鐘も、
      ひとりのときに訪れた思いも、
      楽しみも情けも、愛も痛みも、
      悲しみも、むなしく過ぎたものはない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-089"
    "section_id": "uw-en-poem-xx"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But as some lone, wood-wandering child
      Brings home with him at evening mild
      The thorns and flowers of all the wild,
      From your whole life, O fair and true
      Your flowers and thorns you bring with you!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"

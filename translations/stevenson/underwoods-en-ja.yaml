  - "id": "uw-front-005"
    "section_id": "uw-title"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Of all my verse, like not a single line;
      But like my title, for it is not mine.
      That title from a better man I stole:
      Ah, how much better, had I stol’n the whole!
    "source_languages":
      - "en"
    "source_locations":

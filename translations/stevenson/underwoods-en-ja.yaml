    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Our Marg’et, aye sae keen to crack,
      Douce-stappin’ in the stoury track,
      Her emeralt goun a’ kiltit back
      Frae snawy coats,
      White-ankled, leads the kirkward pack
      Wi’ Dauvit Groats.
    "source_languages":

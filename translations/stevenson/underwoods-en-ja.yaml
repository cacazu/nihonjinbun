  - "id": "uw-en-025"
    "section_id": "uw-en-poem-v"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Yet shall your ragged moor receive
      The incomparable pomp of eve,
      And the cold glories of the dawn
      Behind your shivering trees be drawn;
      And when the wind from place to place
      Doth the unmoored cloud-galleons chase,
      Your garden gloom and gleam again,
      With leaping sun, with glancing rain.
      Here shall the wizard moon ascend
      The heavens, in the crimson end
      Of day’s declining splendour; here
      The army of the stars appear.
      The neighbour hollows dry or wet,
      Spring shall with tender flowers beset;
      And oft the morning muser see
      Larks rising from the broomy lea,
      And every fairy wheel and thread
      Of cobweb dew-bediamonded.
      When daisies go, shall winter time
      Silver the simple grass with rime;
      Autumnal frosts enchant the pool
      And make the cart-ruts beautiful;
      And when snow-bright the moor expands,
      How shall your children clap their hands!
      To make this earth our hermitage,
      A cheerful and a changeful page,
      God’s bright and intricate device
      Of days and seasons doth suffice.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page9"
        "source_sequence": 205
        "xpath": "/html/body/p[32]"
        "printed_page": "9"
        "printed_page_end": "11"
        "anchor": "page9"
    "translation_ja": |-
      けれどぼろをまとった荒野には、
      比べるもののない夕べの壮麗が訪れ、
      寒々と輝く曙は
      震える木々の向こうに幕のように広がる。
      風が、もやいを解いた雲の帆船を
      あちらこちらへ追い立てるとき、
      庭はまた翳り、また明るみ、
      陽の光が跳ね、雨がきらりとよぎる。
      ここでは魔法使いの月が空に昇る、
      衰えてゆく日の輝きが
      深紅に終わるその頃に。ここでは
      星々の軍勢が姿を見せる。
      近くの窪みは湿っていようと乾いていようと、
      春が可憐な花々で取り囲む。
      朝、物思いにふける人は幾度も見るだろう、
      エニシダの野から舞い上がる雲雀を、
      妖精の車輪と糸の一つ一つ、
      露をダイヤのように連ねた蜘蛛の巣を。
      雛菊が消えたら、冬が来て
      ありふれた草を霜で銀色にする。
      秋の霜は水溜まりに魔法をかけ、
      荷車の轍をも美しくする。
      そして荒野が雪で輝いて広がるとき、
      子どもたちはどんなに手を叩くだろう！
      この地上を隠棲の庵とし、
      明るく変わりゆく一頁とするには、
      日々と季節を織りなす神の
      明々とした精妙なはからいで充分だ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

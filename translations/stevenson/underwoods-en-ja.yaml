    "origin": "source"
    "source_text": |-
      The hale o’ life by His commands
      Was ordered to a body’s hands;
      But see! this corpus juris stands
      By a’ forgotten;
      An’ God’s religion in a’ lands
      Is deid an’ rotten.
    "source_languages":
      - "sco"
    "source_locations":

        "printed_page": "115"
        "anchor": "page115"
    "translation_ja": |-
      ほかの人類がみんな救いを失っても、
      神さまはまだスコットランドを誇る。
      貧しいスコットランド、その痩せた岸辺で、
      二十人か四十人の
      頭巾をかぶり咳をする婆さまたちが
      いまだにあの方の掟を守る。

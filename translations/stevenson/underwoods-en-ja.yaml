    "source_text": |-
      The thrawes o’ fear on a’ were shed,
      An’ the hair rose, an’ slumber fled,
      An’ lichts were lit an’ prayers were said
      Through a’ the kintry;
      An’ the cauld terror clum in bed
      Wi’ a’ an’ sindry.

    "translation_ja": |-
      そうして本物のラビーは遠くへ行った、
      自分自身の、もっとやさしい用事をしに、
      昔の友らと一緒に。胸の骨を張って、
      切り詰めた尻尾をそなえ、
      新しい炉石で体をあたためている、
      ジェイムズとエイリーのそばで。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":

        "anchor": "page98"
    "translation_ja": |-
      ああ、ちょいと知りたいね、と物乞い婆さんにわたしは言う。
      肉は焼き網じゃうまいのに、油じゃうまくいかないのはなぜ。
      貯めればあんなに立派なお金も、あげればもっと立派になる。
      「聞くのはたいそうたやすいね」と婆さんはわたしに言う。

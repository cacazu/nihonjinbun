      人生が嫌でぞっとして、
      陽気になんとか切り抜けたくもないのなら、
      することがよく分かったじゃないか。
      強い酒を飲むことだ。
      そのうちあんたの話も聞き納め、
      聞き納めはうれしいことさ！

  - "id": "uw-en-003"
    "section_id": "uw-en-poem-i"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Go, little book, and wish to all
      Flowers in the garden, meat in the hall,
      A bin of wine, a spice of wit,
      A house with lawns enclosing it,
      A living river by the door,
      A nightingale in the sycamore!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page1"
        "source_sequence": 183
        "xpath": "/html/body/p[14]"
        "printed_page": "1"
        "anchor": "page1"
    "translation_ja": |-
      行け、小さな本よ、すべての人に願っておくれ、
      庭には花を、広間にはごちそうを、
      蔵には葡萄酒、話には機知のひとつまみ、
      芝生に囲まれた家を、
      戸口を流れる生き生きした川を、
      楓に歌う夜鳴きうぐいすを！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "Go"
  - "id": "uw-en-004"

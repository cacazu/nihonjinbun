    "translation_ja": |-
      「おまえが何やら立派な新しい言葉で、
      書くか、刷るか、説くか、歌うかした本も、
      まだほんの小さな子どもさ、
      評判にかけても年にかけても。
      そのうちこの惑星のはらわた全部が
      おまえの耳元にぶちまけられる。

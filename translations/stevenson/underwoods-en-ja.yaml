    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Ding, devel, dunt, destroy, an’ ruin,
      Wi’ carnal stanes the square bestrewin’,
      Till your loud chaps frae Kyle to Fruin,
      Frae Hell to Heeven,
      Tell the guid wark that baith are doin’—
      Baith Begg an’ Niven.

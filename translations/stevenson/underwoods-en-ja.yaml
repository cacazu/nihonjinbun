    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Child. O mother, lay your hand on my brow!
      O mother, mother, where am I now?
      Why is the room so gaunt and great?
      Why am I lying awake so late?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page56"

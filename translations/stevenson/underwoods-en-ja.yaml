        "printed_page": "40"
        "anchor": "page40"
    "translation_ja": |-
      いまは異国風の優美さで、
      きらめく炉火に正対する、
      スケリーヴォアの青い部屋で。
      ここで私は待っている、戸が
      開き、人の君たる
      ヘンリー・ジェイムズがまた来る日を。
    "translation_status": "reviewed"

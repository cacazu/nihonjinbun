  - "id": "uw-front-007"
    "section_id": "uw-dedication"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There are men and classes of men that stand above the common herd: the soldier, the sailor and the shepherd not unfrequently; the artist rarely; rarely still, the clergyman; the physician almost as a rule. He is the flower (such as it is) of our civilisation; and when that stage of man is done with, and only remembered to be marvelled at in history, he will be thought to have shared as little as any in the defects of the period, and most notably exhibited the virtues of the race. Generosity he has, such as is possible to those who practise an art, never to those who drive a trade; discretion, tested by a hundred secrets; tact, tried in a thousand embarrassments; and what are more important, Heraclean cheerfulness and courage. So it is that he brings air and cheer into the sickroom, and often enough, though not so often as he wishes, brings healing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#pagev"
        "source_sequence": 7
        "xpath": "/html/body/p[7]"
        "printed_page": "v"
        "anchor": "pagev"
    "translation_ja": "世のありふれた人々より抜きんでた人も、職分もある。兵士、船乗り、羊飼いにはしばしば見られ、芸術家にはまれで、聖職者にはなおまれだが、医師ならほとんど例外がない。医師はわが文明の華である（曲がりなりにも華といえるものがあるならば）。人間のこの一時代が終わり、後世の人々が歴史の中で驚いて振り返るだけになったとき、その時代の欠点を分かち持つことが誰よりも少なく、人間に備わる美徳を最もよく示したのは医師であったと思われるだろう。医師には、商売人には望むべくもなく、技芸を実地に修める人にこそ可能な気前のよさがある。百の秘密に試された慎みがあり、千の気まずい場に試された機転があり、さらに大事なことに、ヘラクレス級の朗らかさと勇気がある。それゆえ医師は、病室へ新鮮な空気と明るさを運び、当人が望むほどにはいかなくても、しばしば癒やしをも運んでくる。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

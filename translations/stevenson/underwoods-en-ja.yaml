    "origin": "source"
    "source_text": |-
      Whan bugles frae the Castle rock,
      An’ beaten drums wi’ dowie shock,
      Wauken, at cauld-rife sax o’clock,
      My chitterin’ frame,
      I mind me on the kintry cock,
      The kintry hame.
    "source_languages":

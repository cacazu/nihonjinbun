    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Kittle the quaere! But at least
      The day I’ve backed the fashious beast,
      While she, wi’ mony a spang an’ reist,
      Flang heels ower bonnet;
      An’ a’ triumphant—for your feast,
      Hae! there’s your sonnet!
    "source_languages":

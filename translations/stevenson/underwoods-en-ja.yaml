    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Mother. Fear not at all: the night is still.
      Nothing is here that means you ill—
      Nothing but lamps the whole town through,
      And never a child awake but you.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"

        "span":
          "start": 62
          "end": 79
          "exact": "私の友の大半は、私を置いていった。"
  - "id": "uw-sco-167"
    "section_id": "uw-sco-poem-xvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      There are kind hearts still, for friends to fill
      And fools to take and break them;
      But the nearest friends are the auldest friends
      And the grave’s the place to seek them.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page138"
        "source_sequence": 532
        "xpath": "/html/body/p[285]"
        "printed_page": "138"
        "anchor": "page138"
    "translation_ja": |-
      やさしい心はまだある。友に満たしてもらうため、
      また、愚か者に奪われ壊されるための心が。
      でもいちばん近い友はいちばん古い友、
      探しにゆくなら、墓場だ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "indent"
        "columns": 3

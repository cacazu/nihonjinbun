  - "id": "uw-en-160"
    "section_id": "uw-en-poem-xxxviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Say not of me that weakly I declined
      The labours of my sires, and fled the sea,
      The towers we founded and the lamps we lit,
      To play at home with paper like a child.
      But rather say: In the afternoon of time
      A strenuous family dusted from its hands
      The sand of granite, and beholding far
      Along the sounding coast its pyramids
      And tall memorials catch the dying sun,
      Smiled well content, and to this childish task
      Around the fire addressed its evening hours.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page73"
        "source_sequence": 340
        "xpath": "/html/body/p[134]"
        "printed_page": "73"
        "anchor": "page73"
    "translation_ja": |-
      私が気弱にも背を向けたとは言うな、
      父祖の仕事から、海から逃げたとは。
      一族が建てた塔、灯した明かりから逃げ、
      家にこもって子どものように紙で遊んだとは。
      むしろ言え、時が午後にさしかかったとき、
      労苦を重ねた一家が手から
      花崗岩の砂をはたき落とし、はるか
      潮騒の岸に連なるピラミッドと
      高い記念碑が沈む陽を受けるのを眺めて、
      満ち足りて微笑み、炉を囲む夕べを
      この子どもじみた仕事に捧げたのだと。

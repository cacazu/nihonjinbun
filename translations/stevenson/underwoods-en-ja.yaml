    "source_text": |-
      Late in the nicht in bed I lay,
      The winds were at their weary play,
      An’ tirlin’ wa’s an’ skirlin’ wae
      Through Heev’n they battered;—
      On-ding o’ hail, on-blaff o’ spray,
      The tempest blattered.

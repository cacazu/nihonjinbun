    "translation_ja": |-
      その名を聞くやいなや、忠犬のように、
      私の良心が塀の裏でうなる。
      たちまち私は尻をむずむずさせる、
      あんたらに贈る韻を探そうと。
      よろこんで、いや、見た目にはそうでもないが、
      あんたらのために時間を使おうとする。

        "printed_page": "103"
        "anchor": "page103"
    "translation_ja": |-
      なあ、かわいいお人、たしかにこの世は
      私のためにも、あんたのためにも造られちゃいない。
      せいぜい、もがいて通るだけの場所、
      ヨブだってそう認めている。
      いつだって私らにできる最善は、
      あるものを精一杯生かすことさ。

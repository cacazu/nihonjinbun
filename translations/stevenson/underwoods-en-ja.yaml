  - "id": "uw-en-005"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The gauger walked with willing foot,
      And aye the gauger played the flute;
      And what should Master Gauger play
      But Over the hills and far away?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page2"
        "source_sequence": 185
        "xpath": "/html/body/p[15]"
        "printed_page": "2"
        "anchor": "page2"
    "translation_ja": |-
      酒税吏はうきうきと足を運び、
      酒税吏はいつも笛を吹いた。
      お役人の吹く調べといったら、
      「丘を越えて、はるか遠くへ」のほかにない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 3
          "exact": "The"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 113
          "end": 140
          "exact": "Over the hills and far away"
  - "id": "uw-en-006"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Whene’er I buckle on my pack
      And foot it gaily in the track,
      O pleasant gauger, long since dead,
      I hear you fluting on ahead.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page2"
        "source_sequence": 186
        "xpath": "/html/body/p[16]"
        "printed_page": "2"
        "anchor": "page2"
    "translation_ja": |-
      荷をくくりつけるたび、
      陽気に小道を歩むたび、
      とうに亡くなった、愉快なお役人よ、
      あなたの吹く笛が、道の先から聞こえる。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-007"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      You go with me the self-same way—
      The self-same air for me you play;
      For I do think and so do you
      It is the tune to travel to.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page2"
        "source_sequence": 187
        "xpath": "/html/body/p[17]"
        "printed_page": "2"
        "anchor": "page2"
    "translation_ja": |-
      あなたは私とおんなじ道をゆく。
      私におんなじ曲を吹いてくれる。
      なにしろあなたも私もこう思う、
      旅にはこの調べにかぎる、と。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-008"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      For who would gravely set his face
      To go to this or t’other place?
      There’s nothing under Heav’n so blue
      That’s fairly worth the travelling to.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page3"
        "source_sequence": 188
        "xpath": "/html/body/p[18]"
        "printed_page": "3"
        "anchor": "page3"
    "translation_ja": |-
      だって誰が、いかめしく顔を向け、
      あちらこちらへ出かけるだろう。
      この青々とした空の下には、
      わざわざ出向く甲斐のある物なんてない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-009"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      On every hand the roads begin,
      And people walk with zeal therein;
      But wheresoe’er the highways tend,
      Be sure there’s nothing at the end.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page3"
        "source_sequence": 189
        "xpath": "/html/body/p[19]"
        "printed_page": "3"
        "anchor": "page3"
    "translation_ja": |-
      四方八方に道が始まり、
      人は熱心にそこをゆく。
      だが街道がどちらへ通じていようと、
      行き着く先には、きっと何もない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-010"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Then follow you, wherever hie
      The travelling mountains of the sky.
      Or let the streams in civil mode
      Direct your choice upon a road;
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page3"
        "source_sequence": 190
        "xpath": "/html/body/p[20]"
        "printed_page": "3"
        "anchor": "page3"
    "translation_ja": |-
      なら、どちらへ急いでゆこうとも、
      空を旅する雲の山々についていけばよい。
      それともせせらぎに、親切な道案内役を
      してもらってもよい。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-011"
    "section_id": "uw-en-poem-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      For one and all, or high or low,
      Will lead you where you wish to go;
      And one and all go night and day
      Over the hills and far away!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page3"
        "source_sequence": 191
        "xpath": "/html/body/p[21]"
        "printed_page": "3"
        "anchor": "page3"
    "translation_ja": |-
      高くとも低くとも、どれもこれも、
      あなたの望むところへ連れていってくれる。
      そしてどれも、昼も夜も、
      丘を越えて、はるか遠くへゆくのだ！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 102
          "end": 129
          "exact": "Over the hills and far away"

        "printed_page": "79"
        "anchor": "page79"
    "translation_ja": |-
      「この商売をごっそり（鶏も卵も、
      本も書き手も、星もアブも）、
      もう脚がゆるんでよろめき、
      だんだんすり減ってゆく。
      人類が借りた持ち時間はもう底に近づいて、
      ずいぶん少なくなった。

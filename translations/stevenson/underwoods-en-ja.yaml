  - "id": "uw-en-094"
    "section_id": "uw-en-poem-xxii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      If I have faltered more or less
      In my great task of happiness;
      If I have moved among my race
      And shown no glorious morning face;
      If beams from happy human eyes
      Have moved me not; if morning skies,
      Books, and my food, and summer rain
      Knocked on my sullen heart in vain:—
      Lord, thy most pointed pleasure take
      And stab my spirit broad awake;
      Or, Lord, if too obdurate I,
      Choose thou, before that spirit die,
      A piercing pain, a killing sin,
      And to my dead heart run them in!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page44"
        "source_sequence": 274
        "xpath": "/html/body/p[84]"
        "printed_page": "44"
        "anchor": "page44"
    "translation_ja": |-
      幸せであるという大きな務めに、
      私がいささかでもよろめいたなら、
      同じ人間のあいだを歩いても、
      輝く朝の顔を見せなかったなら、
      幸せな人の眼からこぼれる光に
      心を動かされなかったなら、朝の空、
      本、食べ物、夏の雨が
      むっつりした胸の扉をむなしく叩いたなら。
      主よ、もっとも尖った歓びを取り、
      わが魂を突き刺して、はっきり目覚めさせてください。
      主よ、私がかたくなすぎるときは、
      魂の死ぬ前にお選びください。
      貫く痛み、命を奪う罪を。
      そして死んだわが胸へ突き入れてください！
    "translation_status": "reviewed"

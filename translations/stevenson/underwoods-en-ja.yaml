  - "id": "uw-en-110"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Though in the greener paths of earth,
      Mother and child, no more
      We wander; and no more the birth
      Of me whom once you bore,
      Seems still the brave reward that once it seemed of yore;
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page53"
        "source_sequence": 290
        "xpath": "/html/body/p[97]"
        "printed_page": "53"
        "anchor": "page53"
    "translation_ja": |-
      地上のより緑な道を、
      母と子が、もう二度と、
      共に歩きはせず、あなたがかつて産んだ
      私の誕生ももはや、
      昔そう思えたほどの、立派な報いには思えないけれど。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-111"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Though as all passes, day and night,
      The seasons and the years,
      From you, O mother, this delight,
      This also disappears—
      Some profit yet survives of all your pangs and tears.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page53"
        "source_sequence": 291
        "xpath": "/html/body/p[98]"
        "printed_page": "53"
        "printed_page_end": "54"
        "anchor": "page53"
    "translation_ja": |-
      昼と夜、季節と年月、
      すべてが過ぎ去るように、
      おお母よ、あなたから、この歓びも
      また消え去るけれど、
      あなたの痛みと涙のすべてには、なおいくばくかの実りが残る。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-112"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The child, the seed, the grain of corn,
      The acorn on the hill,
      Each for some separate end is born
      In season fit, and still
      Each must in strength arise to work the almighty will.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page54"
        "source_sequence": 292
        "xpath": "/html/body/p[99]"
        "printed_page": "54"
        "anchor": "page54"
    "translation_ja": |-
      子ども、種、麦の粒、
      丘のどんぐり、
      一つ一つがそれぞれの目的のために
      時を得て生まれ、なおも一つ一つが
      力をつけて育ち、全能者の意志を実行しなくてはならない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-113"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So from the hearth the children flee,
      By that almighty hand
      Austerely led; so one by sea
      Goes forth, and one by land;
      Nor aught of all man’s sons escapes from that command
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page54"
        "source_sequence": 293
        "xpath": "/html/body/p[100]"
        "printed_page": "54"
        "anchor": "page54"
    "translation_ja": |-
      こうして子らは炉端から駆け出す、
      かの全能の手に
      厳しく導かれ、こうして一人は海へ
      旅立ち、一人は陸へ。
      人の子の誰ひとり、そのお達しを免れない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-114"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So from the sally each obeys
      The unseen almighty nod;
      So till the ending all their ways
      Blindfolded loth have trod:
      Nor knew their task at all, but were the tools of God.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page54"
        "source_sequence": 294
        "xpath": "/html/body/p[101]"
        "printed_page": "54"
        "anchor": "page54"
    "translation_ja": |-
      打って出た一人一人が
      見えぬ全能者のうなずきに従い、
      こうして終わりまで、自分の道を
      目隠しされて渋々歩く。
      その務めを何一つ知らず、神の道具であった。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-115"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And as the fervent smith of yore
      Beat out the glowing blade,
      Nor wielded in the front of war
      The weapons that he made,
      But in the tower at home still plied his ringing trade;
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page55"
        "source_sequence": 295
        "xpath": "/html/body/p[102]"
        "printed_page": "55"
        "anchor": "page55"
    "translation_ja": |-
      昔、熱意に燃える鍛冶屋は、
      赤熱する刃を槌で打ち出し、
      自分の作った武器を
      戦の陣頭で振るいはせず、
      家の塔にいて、槌音を響かせる仕事をつづけたものだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-116"
    "section_id": "uw-en-poem-xxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So like a sword the son shall roam
      On nobler missions sent;
      And as the smith remained at home
      In peaceful turret pent,
      So sits the while at home the mother well content.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page55"
        "source_sequence": 296
        "xpath": "/html/body/p[103]"
        "printed_page": "55"
        "anchor": "page55"
    "translation_ja": |-
      同じように息子は剣となってさすらい、
      より気高い使命へ遣わされる。
      鍛冶屋が家にとどまり、
      平和な小塔に籠もっていたように、
      そのあいだ母は、満ち足りて家に座っている。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

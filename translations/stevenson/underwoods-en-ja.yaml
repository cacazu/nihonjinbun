    "translation_ja": |-
      夜も更けて私は床にいた。
      風はいつものやっかいな戯れのさなか。
      壁を揺り、悲しげに金切り声を上げ、
      天を横切って打ちつけた。
      雹は降りしきり、しぶきは襲いかかり、
      嵐がばたばたと荒れ狂った。

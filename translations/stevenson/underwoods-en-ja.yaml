    "source_text": |-
      Noo choose ye out a walie hammer;
      About the knottit buttress clam’er;
      Alang the steep roof stoyt an’ stammer,
      A gate mis-chancy;
      On the aul’ spire, the bells’ hie cha’mer,
      Dance your bit dancie.

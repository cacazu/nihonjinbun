  - "id": "uw-sco-061"
    "section_id": "uw-sco-poem-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Note.—It may be guessed by some that I had a certain parish in my eye, and this makes it proper I should add a word of disclamation. In my time there have been two ministers in that parish. Of the first I have a special reason to speak well, even had there been any to think ill. The second I have often met in private and long (in the due phrase) “sat under” in his church, and neither here nor there have I heard an unkind or ugly word upon his lips. The preacher of the text had thus no original in that particular parish; but when I was a boy, he might have been observed in many others; he was then (like the schoolmaster) abroad; and by recent advices, it would seem he has not yet entirely disappeared."
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page97"
        "source_sequence": 426
        "xpath": "/html/body/p[190]"
        "printed_page": "97"
        "anchor": "page97"
    "translation_ja": "注　ある教区を思い浮かべて書いたのではと推測する方もあろうから、ひと言、そうではないと断っておきたい。私が知る間に、その教区には二人の牧師がいた。最初の方については、たとえ悪く思ういわれがあったにせよ、私はとくによく言うだけの理由がある。二人目の方とは私的な席でよくお会いし、長いことその方の教会で（昔からの言い方を借りれば）「教えを受けた」。どちらの場でも、この方が心ない、あるいは見苦しい言葉を口になさるのを聞いたことはない。したがって本文の説教師には、その特定の教区では、実在のモデルはいない。だが私が子供だったときなら、ほかの多くの教区で見かけられたかもしれない。当時は（学校の先生と同様）いたるところにいたものだし、近頃の話によれば、いまだに絶滅したわけではないようだ。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 0
          "end": 4
          "exact": "Note"

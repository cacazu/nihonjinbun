        "source_sequence": 436
        "xpath": "/html/body/p[198]"
        "printed_page": "101"
        "anchor": "page101"
    "translation_ja": |-
      そしてときたま、気まぐれにのぞいて、
      哀れな人間が何をしているかごらんになる。
      できるものなら、まず間違いなく、
      連中のもくろみをひっくり返す。
      人間なんて枝も根も、丸ごとお嫌いなのさ、
      人間のものなら何だって。

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      An’ whiles the bluid spangs to my bree,
      To lie sae saft, to live sae free,
      While better men maun do an’ die
      In unco places.
      “Whaur’s God?” I cry, an’ “Whae is me
      To hae sic graces?”
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"

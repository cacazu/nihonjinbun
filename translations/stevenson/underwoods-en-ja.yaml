      ありがたや、なんて上等な信条だろう！
      キリスト者に、ほかに何が要るというんだ？
      見事な言葉も頭の上をがらがら通り、
      眠る人を起こしはしない。
      墓で休んでいる死者たちは、
      いよいよ深く眠りつづける。

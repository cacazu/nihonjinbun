  - "id": "uw-front-014"
    "section_id": "uw-author-note"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I note again, that among our new dialecticians, the local habitat of every dialect is given to the square mile. I could not emulate this nicety if I desired; for I simply wrote my Scots as well as I was able, not caring if it hailed from Lauderdale or Angus, from the Mearns or Galloway; if I had ever heard a good word, I used it without shame; and when Scots was lacking, or the rhyme jibbed, I was glad (like my betters) to fall back on English. For all that, I own to a friendly feeling for the tongue of Fergusson and of Sir Walter, both Edinburgh men; and I confess that Burns has always sounded in my ear like something partly foreign. And indeed I am from the Lothians myself; it is there I heard the language spoken about my childhood; and it is in the drawling Lothian voice that I repeat it to myself. Let the precisians call my speech that of the Lothians. And if it be not pure, alas! what matters it? The day draws near when this illustrious and malleable tongue shall be quite forgotten; and Burn’s Ayrshire, and Dr. Macdonald’s Aberdeen-awa’, and Scott’s brave, metropolitan utterance will be all equally the ghosts of speech. Till then I would love to have my hour as a native Maker, and be read by my own countryfolk in our own dying language: an ambition surely rather of the heart than of the head, so restricted as it is in prospect of endurance, so parochial in bounds of space."
    "source_languages":
      - "en"
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#pagexi"
        "source_sequence": 14
        "xpath": "/html/body/p[13]"
        "printed_page": "xi"
        "printed_page_end": "xii"
        "anchor": "pagexi"
    "translation_ja": "もう一つ書き添えると、わが新手の方言学者たちは、方言それぞれの生息地を、一平方マイルの精度で特定する。望んだところで私はこんな精密さをまねできまい。ただ自分のスコットランド語をできるかぎりうまく書いたまでで、ローダーデイル産かアンガス産か、マーンズかギャロウェイかなど、気にかけなかった。いい言葉を一度でも耳にしたら、臆面もなく使った。スコットランド語に言葉が見つからなかったり、脚韻がいうことをきかなかったりしたら、（私より上手な人たちと同様に）喜んで英語に頼った。それでも、どちらもエディンバラの人であるファーガソンとサー・ウォルターの言葉には親しみをおぼえるし、バーンズの言葉はいつも幾分よそのもののように私の耳には響く。そもそも私はロージアンの生まれで、子供のころその言葉が話されるのを聞いたのもそこであり、自分でそらんじるときにもロージアンの間延びした声になる。厳密さを尊ぶ方々には、私の話し言葉をロージアンのものと呼んでもらおう。純粋でないからといって、ああ、それが何だろう。この高名でしなやかな言葉がすっかり忘れられる日は近い。バーンズのエアシャーも、マクドナルド博士のアバディーンの言葉も、スコットの勇ましい都の語りも、ひとしく言葉の亡霊になるだろう。そのときまで、私は郷土の詩人としてひとときを持ち、死にゆく私たちの言葉で、同じ国の人たちに読んでもらいたい。長く残る見込みは薄く、届く土地も片田舎ほどの広さ、頭からというより胸から出た願いである。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

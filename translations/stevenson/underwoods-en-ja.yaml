    "translation_ja": |-
      雨だ。庭の芝が濡れる、
      さすらい人の足を引きずる長い道も濡れる。
      何とも礼儀を知らぬやり方じゃないか、神さま、
      七月のまんなかだっていうのに。
      あの腹黒をあんたが呪うなら、畜生、
      私も一緒に呪ってやる！

  - "id": "uw-en-061"
    "section_id": "uw-en-poem-xiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I sit and wait a pair of oars
      On cis-Elysian river-shores.
      Where the immortal dead have sate,
      ’Tis mine to sit and meditate;
      To re-ascend life’s rivulet,
      Without remorse, without regret;
      And sing my Alma Genetrix
      Among the willows of the Styx.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page26"
        "source_sequence": 241
        "xpath": "/html/body/p[60]"
        "printed_page": "26"
        "anchor": "page26"
    "translation_ja": |-
      私は座って櫂の音を待つ、
      至福の野へ渡る手前の岸辺で。
      不滅の死者たちが座ったところで、
      今は私が座り、思いを巡らせる番だ。
      生の小川をさかのぼり、
      悔いも未練もなしに、
      わが慈しみの母を歌うのだ、
      ステュクスの柳のあいだで。
    "translation_status": "reviewed"

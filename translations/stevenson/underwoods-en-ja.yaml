    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I mind me on yon bonny bield;
      An’ Fancy traivels far afield
      To gaither a’ that gairdens yield
      O’ sun an’ Simmer:
      To hearten up a dowie chield,
      Fancy’s the limmer!
    "source_languages":

  - "id": "uw-en-097"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Poor passionate men, still clothed afresh
      With agonising folds of flesh;
      Whom the clear eyes solicit still
      To some bold output of the will,
      While fairy Fancy far before
      And musing Memory-Hold-the-door
      Now to heroic death invite
      And now uncurtain fresh delight:
      O, little boots it thus to dwell
      On the remote unneighboured hill!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page46"
        "source_sequence": 277
        "xpath": "/html/body/p[86]"
        "printed_page": "46"
        "anchor": "page46"
    "translation_ja": |-
      哀れな、血の通う人たちよ、今なお新たに
      苦しむ肉のひだを身にまとい、
      晴れた目はなおも誘ってやまない、
      意志の、大胆なひと働きを。そのあいだにも
      妖精の〈空想〉はずっと先を行き、
      物思う〈戸を押さえる記憶〉は、
      あるときは英雄の死へ誘い、
      またあるときは新しい歓びの幕を開ける。
      ああ、こうして暮らして、何になろう、
      隣人ひとりいない、遠い丘の上で！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-098"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      O to be up and doing, O
      Unfearing and unshamed to go
      In all the uproar and the press
      About my human business!
      My undissuaded heart I hear
      Whisper courage in my ear.
      With voiceless calls, the ancient earth
      Summons me to a daily birth.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page46"
        "source_sequence": 278
        "xpath": "/html/body/p[87]"
        "printed_page": "46"
        "anchor": "page46"
    "translation_ja": |-
      ああ、起きて事にかかりたい。ああ、
      恐れず、恥じずに行きたい、
      ありったけの騒ぎと人いきれのなかに、
      人としての仕事をしに！
      とどめようもない心が耳のそばで
      勇気を出せとささやくのを、私は聞く。
      声のない呼び声で古い大地は
      日ごとに新たに生まれよと私を呼ぶ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-099"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Thou, O my love, ye, O my friends—
      The gist of life, the end of ends—
      To laugh, to love, to live, to die,
      Ye call me by the ear and eye!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page47"
        "source_sequence": 279
        "xpath": "/html/body/p[88]"
        "printed_page": "47"
        "anchor": "page47"
    "translation_ja": |-
      おお、愛する人よ、おお、友たちよ、
      生のかなめ、すべての目的の目的よ、
      笑え、愛せ、生きよ、死ねと、
      声と姿であなたたちは私を呼ぶ！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-100"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Forth from the casemate, on the plain
      Where honour has the world to gain,
      Pour forth and bravely do your part,
      O knights of the unshielded heart!
      Forth and forever forward!—out
      From prudent turret and redoubt,
      And in the mellay charge amain,
      To fall but yet to rise again!
      Captive? ah, still, to honour bright,
      A captive soldier of the right!
      Or free and fighting, good with ill?
      Unconquering but unconquered still!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page47"
        "source_sequence": 280
        "xpath": "/html/body/p[89]"
        "printed_page": "47"
        "anchor": "page47"
    "translation_ja": |-
      砲郭から出よ、世界を手にすることこそ誉れとなる
      広々とした野へ、
      あふれ出よ、勇んで役目を果たせ、
      盾なき心の騎士たちよ！
      出よ、いつまでも前へ！　外へ出ろ、
      用心ぶかい小塔と堡塁から、
      混戦へ真っ向から突撃せよ、
      倒れてもまた起きあがるために！
      捕らわれたか？　ああ、輝く名誉にかけてなお、
      捕らわれても正義の兵士であれ！
      あるいは自由に戦うか、善も悪とともに。
      勝たずとも、なお敗れずに！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-101"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And ye, O brethren, what if God,
      When from Heav’n’s top he spies abroad,
      And sees on this tormented stage
      The noble war of mankind rage:
      What if his vivifying eye,
      O monks, should pass your corner by?
      For still the Lord is Lord of might;
      In deeds, in deeds, he takes delight;
      The plough, the spear, the laden barks,
      The field, the founded city, marks;
      He marks the smiler of the streets,
      The singer upon garden seats;
      He sees the climber in the rocks:
      To him, the shepherd folds his flocks.
      For those he loves that underprop
      With daily virtues Heaven’s top,
      And bear the falling sky with ease,
      Unfrowning caryatides.
      Those he approves that ply the trade,
      That rock the child, that wed the maid,
      That with weak virtues, weaker hands,
      Sow gladness on the peopled lands,
      And still with laughter, song and shout,
      Spin the great wheel of earth about.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page47"
        "source_sequence": 281
        "xpath": "/html/body/p[90]"
        "printed_page": "47"
        "printed_page_end": "49"
        "anchor": "page47"
    "translation_ja": |-
      だが、おお、修道士たちよ、神が、
      天の頂から外を見渡して、
      苦しみに満ちたこの舞台に、
      人類の気高い戦いが荒れ狂うのを見るとき、
      もしも生命を与えるその眼が、
      おお、修道士よ、あなたたちの片隅を素通りしたら？
      主はなおも力ある主、
      行いに、行いに、喜びを見いだす。
      鋤、槍、積荷の船、
      田畑、築かれた都市に目を留める。
      街で微笑む人に目を留め、
      庭の腰掛けで歌う人に目を留める。
      岩をよじ登る者を見る。
      主に向けて、羊飼いは群れを囲いに入れる。
      日毎の徳をもって天の頂を
      下から支え、
      落ちてくる空をやすやすと担う、
      眉一つひそめぬ女像柱を、主は愛する。
      商いをする者をよしとし、
      子を揺すり寝かせ、乙女を妻とし、
      果敢ならぬ徳、なお弱い手で、
      人の住む土地に歓びをまき、
      そしていまも、笑い、歌い、叫びながら、
      大地の大きな輪を回す者たちをよしとする。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-102"
    "section_id": "uw-en-poem-xxiii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But ye?—O ye who linger still
      Here in your fortress on the hill,
      With placid face, with tranquil breath,
      The unsought volunteers of death,
      Our cheerful General on high
      With careless looks may pass you by.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page49"
        "source_sequence": 282
        "xpath": "/html/body/p[91]"
        "printed_page": "49"
        "anchor": "page49"
    "translation_ja": |-
      だがあなたたちは？　おお、いまも立ち去らず、
      丘の上のこの砦で、
      穏やかな顔、静かな息のまま、
      求められもしないのに死に志願する者たちよ、
      天上の朗らかなわれらの将軍は、
      気にも留めず通り過ぎるかもしれない。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

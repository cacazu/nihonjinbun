    "origin": "source"
    "source_text": |-
      It’s possible—it’s hardly mair—
      That some ane, ripin’ after lear—
      Some auld professor or young heir,
      If still there’s either—
      May find an’ read me, an’ be sair
      Perplexed, puir brither!
    "source_languages":

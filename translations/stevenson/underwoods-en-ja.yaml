        "xpath": "/html/body/p[143]"
        "printed_page": "79"
        "anchor": "page79"
    "translation_ja": |-
      「おまえときたら、帆桁に必死でしがみつこうが、
      燃える星をかぶってひっくり返ろうが、
      ちくしょうここはどこだと泣きわめき、
      故郷か、フランスか、フランドルか、と、
      列車の一両みたいに、ばらばらに衝突して、
      燃えがらのかけらになって飛び散るさ」

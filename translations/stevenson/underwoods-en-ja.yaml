          "exact": "And fools to take and break them;"
      - "side": "source"
        "kind": "indent"
        "columns": 3
        "span":
          "start": 131
          "end": 170
          "exact": "And the grave’s the place to seek them."
      - "side": "translation"
        "kind": "indent"
        "columns": 3
        "span":
          "start": 24
          "end": 44
          "exact": "また、愚か者に奪われ壊されるための心が。"
      - "side": "translation"
        "kind": "indent"
        "columns": 3
        "span":
          "start": 64
          "end": 76
          "exact": "探しにゆくなら、墓場だ。"

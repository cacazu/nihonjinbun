    "kind": "verse"
    "origin": "source"
    "source_text": |-
      An’ noo the winter winds complain;
      Cauld lies the glaur in ilka lane;
      On draigled hizzie, tautit wean
      An’ drucken lads,
      In the mirk nicht, the winter rain
      Dribbles an’ blads.
    "source_languages":

    "translation_ja": |-
      あんたの欲しいのは御殿の広間か、
      気が利いて立派な日曜の客間。
      何もかもきちんと列にそろえてある、
      こぎれいな奥方たちの手で。
      ところがね、手に入らんのだよ。
      言うことはそれだけさ。

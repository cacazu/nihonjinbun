    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The evil wi’ the guid they tak;
      They ca’ a gray thing gray, no black;
      To a steigh brae, a stubborn back
      Addressin’ daily;
      An’ up the rude, unbieldy track
      O’ life, gang gaily.
    "source_languages":
      - "sco"
    "source_locations":

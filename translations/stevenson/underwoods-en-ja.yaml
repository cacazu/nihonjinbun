    "translation_ja": |-
      教会はいっぱい、扉が閉まった。
      私が説教壇をひと目のぞき上げると、
      口では言えぬほどうれしかった。
      牧師さまご本人じゃありませんか！
      誇らしかった、あの顔を見て、
      恵みからこんなにも長く離れていたあげく。
      うれしかったけれども認めざるをえません、
      感心できないこともありました。
      第一に、驚いたことに、
      ただの讃美歌集が座席にふんぞり返っている。
      人間の手になる忌まわしい品、
      どんな会衆にも似合わぬ品だ。
      まだ針のむしろにいるような気分で、
      今度は新しい先唱者に嫌気がさした。
      わざとらしいし、声にはぬくもりもない、
      昔の先唱者から、なんともひどく見劣りがする。
      そして、信仰が何もかも壊れちまったかのように、
      祈りは思っていたようではない。
      牧師ご本人が、私の目には、
      昔の人ではないように見えました。
      だが、ちょうど私がいらいらし始めたとき、
      牧師はたいそう思慮深く聖句を選び、
      論説に乗りだすと、
      かん高い声で、掟に外れたこと全部に襲いかかった。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-sco-129"
    "section_id": "uw-sco-poem-xii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      O what a gale was on my speerit
      To hear the p’ints o’ doctrine clearit,
      And a’ the horrors o’ damnation
      Set furth wi’ faithfü’ ministration!
      Nae shauchlin’ testimony here—
      We were a’ damned, an’ that was clear,
      I owned, wi’ gratitude an’ wonder,
      He was a pleisure to sit under.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page123"
        "source_sequence": 494
        "xpath": "/html/body/p[251]"
        "printed_page": "123"
        "printed_page_end": "124"
        "anchor": "page123"
    "translation_ja": |-
      おお、なんと強い風が私の魂に吹いたか、
      教義の細目が明らかにされ、
      地獄行きの恐ろしさという恐ろしさが、
      忠実な奉仕で明々と並べられるのを聞いて！
      よろめくような証言は一つもない。
      私どもは全員地獄行き、実に明白でした。
      感謝し、驚きながら、私は認めました、
      まことに喜ばしい、師と仰ぐに足る人ですと。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

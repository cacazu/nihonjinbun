    "source_text": |-
      But saw ye ne’er some pingein’ bairn
      As weak as a pitaty-par’n’—
      Less üsed wi’ guidin’ horse-shoe airn
      Than steerin’ crowdie—
      Packed aff his lane, by moss an’ cairn,
      To ca’ the howdie.
    "source_languages":

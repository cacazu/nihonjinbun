    "source_text": |-
      (Whan the dear doctor, dear to a’,
      Was still amang us here belaw,
      I set my pipes his praise to blaw
      Wi’ a’ my speerit;
      But noo, Dear Doctor! he’s awa’,
      An’ ne’er can hear it.)
    "source_languages":

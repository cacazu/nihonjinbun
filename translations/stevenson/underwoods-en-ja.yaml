    "section_id": "uw-en-poem-xviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So awhile I glowed, and then
      Fell on dusty days and men;
      Long I slumbered packed in straw,
      Long I none but dealers saw;
      Till before my silent eye
      One that sees came passing by.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page40"

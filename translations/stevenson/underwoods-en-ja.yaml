    "section_id": "uw-en-poem-xix"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      We see you as we see a face
      That trembles in a forest place
      Upon the mirror of a pool
      Forever quiet, clear and cool;
      And in the wayward glass, appears
      To hover between smiles and tears,
      Elfin and human, airy and true,
      And backed by the reflected blue.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page41"
        "source_sequence": 265
        "xpath": "/html/body/p[78]"
        "printed_page": "41"
        "anchor": "page41"
    "translation_ja": |-
      あなたを見るのは、森の奥で
      とこしえに静かな、澄んで冷たい
      水をたたえた淵の鏡に揺れる
      顔を見るようなものだ。
      その気まぐれな鏡のなかに顔は浮かび、
      微笑みと涙のあいだをためらうよう、
      妖精のようで人間らしく、はかないようで本物、
      背後には映った青空がある。
    "translation_status": "reviewed"

  - "id": "uw-sco-007"
    "section_id": "uw-sco-poem-i"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “But think not you the brae to speel;
      You, tae, maun chow the bitter peel;
      For a’ your lear, for a’ your skeel,
      Ye’re nane sae lucky;
      An’ things are mebbe waur than weel
      For you, my buckie.
    "source_languages":
      - "sco"
    "source_locations":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “The hale concern (baith hens an’ eggs,
      Baith books an’ writers, stars an’ clegs)
      Noo stachers upon lowsent legs
      An’ wears awa’;
      The tack o’ mankind, near the dregs,
      Rins unco law.
    "source_languages":
      - "sco"

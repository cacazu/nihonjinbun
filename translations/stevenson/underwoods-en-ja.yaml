      あのきれいな隠れ家を思い出す。
      〈空想〉は野のはるかへ旅をする、
      庭のもたらすありったけのものを
      日差しと夏とを集めに。
      浮かぬ顔の男を元気づけるなら、
      そういう時の頼みは、あの小悪魔〈空想〉さ！

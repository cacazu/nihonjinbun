  - "id": "uw-sco-105"
    "section_id": "uw-sco-poem-x"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Lordsake! we’re aff,” thinks I, “but whaur?
      On what abhorred an’ whinny scaur,
      Or whammled in what sea o’ glaur,
      Will she desert me?
      An’ will she just disgrace? or waur—
      Will she no hurt me?”
    "source_languages":

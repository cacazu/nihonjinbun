  - "id": "uw-en-145"
    "section_id": "uw-en-poem-xxxi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Sing clearlier, Muse, or evermore be still,
      Sing truer or no longer sing!
      No more the voice of melancholy Jacques
      To wake a weeping echo in the hill;
      But as the boy, the pirate of the spring,
      From the green elm a living linnet takes,
      One natural verse recapture—then be still.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page65"
        "source_sequence": 325
        "xpath": "/html/body/p[126]"
        "printed_page": "65"
        "anchor": "page65"
    "translation_ja": |-
      もっと澄んで歌え、詩神よ。さもなくば永遠に黙れ。
      もっとまことに歌え、さもなくばもう歌うな！
      憂鬱なジャックの声で、
      丘の泣き声のようなこだまを起こすのはもうやめよ。
      春の海賊たる少年が、
      緑の楡から生きた紅ひわをつかまえるように、
      自然な詩句をひとつ取り戻せ。それからは黙れ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

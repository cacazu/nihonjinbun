    "translation_ja": |-
      ああ先生、神々はじつに親切なんだな、
      あなたを敬うべきお頭と思って、
      ひと切れのちょっとした文章にも、
      こんなによい報いをくれる。
      そして、かわいそうなラビーは死んでしまったが、
      その幽霊を貸して、あなたを守らせてくれる。

  - "id": "uw-en-121"
    "section_id": "uw-en-poem-xxvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Mother. Out in the city, sounds begin
      Thank the kind God, the carts come in!
      An hour or two more, and God is so kind,
      The day shall be blue in the window-blind,
      Then shall my child go sweetly asleep,
      And dream of the birds and the hills of sheep.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page57"
        "source_sequence": 301
        "xpath": "/html/body/p[107]"
        "printed_page": "57"
        "anchor": "page57"
    "translation_ja": |-
      母　ほら、町では音がし始めた。
      ありがたいこと、荷車が入ってくる！
      もう一、二時間したら、神さまは優しいから、
      夜明けが窓の日よけに青くさす。
      そうしたらわが子は心地よく眠って、
      鳥と、羊のいる丘の夢を見るのよ。
    "translation_status": "reviewed"
    "attributions":

  - "id": "uw-en-051"
    "section_id": "uw-en-poem-xi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Youth now flees on feathered foot
      Faint and fainter sounds the flute,
      Rarer songs of gods; and still
      Somewhere on the sunny hill,
      Or along the winding stream,
      Through the willows, flits a dream;
      Flits but shows a smiling face,
      Flees but with so quaint a grace,
      None can choose to stay at home,
      All must follow, all must roam.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page21"
        "source_sequence": 231
        "xpath": "/html/body/p[52]"
        "printed_page": "21"
        "anchor": "page21"
    "translation_ja": |-
      青春はいま、羽根のような足で逃げ、
      笛の音はかすれ、なおかすれ、
      神々の歌はまれになる。それでも
      どこか陽のあたる丘の上、
      あるいは蛇行する小川に沿って、
      柳のあいだを夢がよぎる。
      よぎりながら、微笑む顔を見せ、
      なんとも不思議な優美さで逃げるから、
      誰も家にとどまってはいられない。
      みな追わずにいられず、さすらわずにいられない。
    "translation_status": "reviewed"
    "attributions":

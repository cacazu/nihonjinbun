    "kind": "verse"
    "origin": "source"
    "source_text": |-
      As whan a glum an’ fractious wean
      Has sat an’ sullened by his lane
      Till, wi’ a rowstin’ skelp, he’s taen
      An’ shoo’d to bed—
      The ither bairns a’ fa’ to play’n’,
      As gleg’s a gled.
    "source_languages":

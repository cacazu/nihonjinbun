      O, I wad like to ken—to the beggar wife says I—
      The reason o’ the cause an’ the wherefore o’ the why,
      Wi’ mony anither riddle brings the tear into my e’e.
      —It’s gey an’ easy spierin’, says the beggar-wife to me.
    "source_languages":

    "translation_ja": |-
      母　ちっとも怖がらないで。静かな夜よ。
      あなたをどうこうしようってものは、ここにはないわ。
      町じゅう、灯りのほかになんにもなくて、
      起きている子はあなたのほかに一人もいない。
    "translation_status": "reviewed"

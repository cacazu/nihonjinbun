  - "id": "uw-en-152"
    "section_id": "uw-en-poem-xxxiv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      For love of lovely words, and for the sake
      Of those, my kinsmen and my countrymen,
      Who early and late in the windy ocean toiled
      To plant a star for seamen, where was then
      The surfy haunt of seals and cormorants:
      I, on the lintel of this cot, inscribe
      The name of a strong tower.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page68"
        "source_sequence": 332
        "xpath": "/html/body/p[130]"
        "printed_page": "68"
        "anchor": "page68"
    "translation_ja": |-
      美しい言葉を愛するゆえに、また
      わが一族、わが同郷の人々のために、
      朝も夜も風吹く海で骨を折り、
      波しぶき立つアザラシや鵜のすみかだったところへ、
      船乗りのための星を植えた人々のために、
      私はこの小さな家のまぐさに刻む、
      堅固な塔の名を。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

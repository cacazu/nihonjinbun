    "source_text": |-
      Sic-like—I awn the weary fac’—
      Whan on my muse the gate I tak,
      An’ see her gleed e’e raxin’ back
      To keek ahint her;—
      To me, the brig o’ Heev’n gangs black
      As blackest winter.
    "source_languages":

  - "id": "uw-en-049"
    "section_id": "uw-en-poem-x"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Strange is the seaman’s heart; he hopes, he fears;
      Draws closer and sweeps wider from that coast;
      Last, his rent sail refits, and to the deep
      His shattered prow uncomforted puts back.
      Yet as he goes he ponders at the helm
      Of that bright island; where he feared to touch,
      His spirit readventures; and for years,
      Where by his wife he slumbers safe at home,
      Thoughts of that land revisit him; he sees
      The eternal mountains beckon, and awakes
      Yearning for that far home that might have been.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page20"
        "source_sequence": 229
        "xpath": "/html/body/p[51]"
        "printed_page": "20"
        "anchor": "page20"
    "translation_ja": |-
      船乗りの胸は不思議なものだ。期待し、おそれ、
      岸へ寄り、また大きく沖へ回る。
      ついに裂けた帆を繕って、
      傷んだ舳先を、心なぐさまぬまま大海へ返す。
      それでも舵に立てば思いを巡らす、
      あの明るい島のことを。上がるのを恐れた土地へ、
      心はまたも冒険に出る。何年ものあいだ、
      妻の傍ら、家で安らかに眠るときも、
      あの土地の思い出がふたたび訪れる。
      永遠の山々が手招きするのを見て、目を覚まし、
      故郷となったかもしれない遠い地を恋い慕う。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Frae nirly, nippin’, Eas’lan’ breeze,
      Frae Norlan’ snaw, an’ haar o’ seas,
      Weel happit in your gairden trees,
      A bonny bit,
      Atween the muckle Pentland’s knees,
      Secure ye sit.
    "source_languages":
      - "sco"
    "source_locations":

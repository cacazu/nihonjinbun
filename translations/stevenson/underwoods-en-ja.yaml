    "translation_ja": |-
      小川の鱒は鰊ぐらいに育ち、
      素朴な羊も食いぶちに困らない。
      石塚のあたりを清らかな風が吹く、
      さわやかな空気を運んで。
      荒野の雷鳥も、はだしの子どもも、
      そこでは幸せだ。

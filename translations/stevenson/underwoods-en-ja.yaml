    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The shoon ye coft, the life ye lead,
      Ithers will heir when aince ye’re deid;
      They’ll heir your tasteless bite o’ breid,
      An’ find it sappy;
      They’ll to your dulefü’ house succeed,
      An’ there be happy.
    "source_languages":
      - "sco"
    "source_locations":

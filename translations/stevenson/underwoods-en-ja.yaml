    "section_id": "uw-en-poem-xxxv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Here all is sunny, and when the truant gull
      Skims the green level of the lawn, his wing
      Dispetals roses; here the house is framed
      Of kneaded brick and the plumed mountain pine,
      Such clay as artists fashion and such wood
      As the tree-climbing urchin breaks. But there
      Eternal granite hewn from the living isle
      And dowelled with brute iron, rears a tower
      That from its wet foundation to its crown
      Of glittering glass, stands, in the sweep of winds,
      Immovable, immortal, eminent.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page69"
        "source_sequence": 334
        "xpath": "/html/body/p[131]"
        "printed_page": "69"
        "anchor": "page69"
    "translation_ja": |-
      ここは何もかも陽があたり、はぐれたかもめが
      緑の平らな芝をかすめれば、その翼が
      薔薇の花びらを散らす。ここでは、家を組むのは
      練った煉瓦と、羽飾りをつけたような山の松。
      工人が形をつくる土と、木登り小僧が
      手折るような木。だがあちらでは、
      生きた島から切り出した永遠の花崗岩が、
      むき出しの鉄の栓で結ばれて、塔を高く立てる。
      濡れた土台からきらめくガラスの
      頂まで、吹きすさぶ風のなかに立つ、
      動かず、朽ちず、そびえ立つ塔を。

  - "id": "uw-en-129"
    "section_id": "uw-en-poem-xxviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Peace and her huge invasion to these shores
      Puts daily home; innumerable sails
      Dawn on the far horizon and draw near;
      Innumerable loves, uncounted hopes
      To our wild coasts, not darkling now, approach:
      Not now obscure, since thou and thine are there,
      And bright on the lone isle, the foundered reef,
      The long, resounding foreland, Pharos stands.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page60"
        "source_sequence": 309
        "xpath": "/html/body/p[113]"
        "printed_page": "60"
        "anchor": "page60"
    "translation_ja": |-
      平和とその大軍がこの岸へ
      日ごと深く押し寄せる。数知れぬ帆が
      遠い地平にほの見えて近づき、
      数知れぬ愛、数えきれぬ望みが、
      もはや闇に紛れぬ荒い岸へ近づく。
      あなたと一族がいて、もはや暗くはない。
      孤島、沈んだ岩礁、
      鳴り響く長い岬には、明るく灯台が立つ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 5
          "exact": "Peace"
  - "id": "uw-en-130"
    "section_id": "uw-en-poem-xxviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      These are thy works, O father, these thy crown;
      Whether on high the air be pure, they shine
      Along the yellowing sunset, and all night
      Among the unnumbered stars of God they shine;
      Or whether fogs arise and far and wide
      The low sea-level drown—each finds a tongue
      And all night long the tolling bell resounds:
      So shine, so toll, till night be overpast,
      Till the stars vanish, till the sun return,
      And in the haven rides the fleet secure.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page60"
        "source_sequence": 310
        "xpath": "/html/body/p[114]"
        "printed_page": "60"
        "printed_page_end": "61"
        "anchor": "page60"
    "translation_ja": |-
      父よ、これがあなたの業、あなたの冠。
      高い空気が澄むときは、それらが
      黄色く染まる夕焼けのなか、夜どおし
      神の数知れぬ星々のあいだで輝く。
      霧が立ち、遠く広く
      低い海の面を呑むときは、灯台のめいめいが舌を得て、
      打ち鳴らす鐘が一晩じゅう響きわたる。
      こうして光れ、こうして鳴れ、夜が過ぎ、
      星が消え、陽が戻り、
      船団が港内に安んじて浮かぶまで。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-131"
    "section_id": "uw-en-poem-xxviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In the first hour, the seaman in his skiff
      Moves through the unmoving bay, to where the town
      Its earliest smoke into the air upbreathes
      And the rough hazels climb along the beach.
      To the tugg’d oar the distant echo speaks.
      The ship lies resting, where by reef and roost
      Thou and thy lights have led her like a child.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page61"
        "source_sequence": 311
        "xpath": "/html/body/p[115]"
        "printed_page": "61"
        "anchor": "page61"
    "translation_ja": |-
      夜明けのひと刻、船人は小舟で、
      波ひとつ立たぬ入江を進む。町が
      その朝はじめての煙を宙へ吐き、
      ごつごつしたハシバミが浜の斜面をはい上るところへ。
      引かれる櫂に、遠いこだまが答える。
      船は静かに休む。暗礁を、また潮のせめぎあう水を越え、
      あなたと灯が、幼な子を導くように、ここへ連れてきたのだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-132"
    "section_id": "uw-en-poem-xxviii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      This hast thou done, and I—can I be base?
      I must arise, O father, and to port
      Some lost, complaining seaman pilot home.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page61"
        "source_sequence": 312
        "xpath": "/html/body/p[116]"
        "printed_page": "61"
        "anchor": "page61"
    "translation_ja": |-
      これをあなたはなし遂げた。それで私が卑しくあれるか。
      父よ、私は起ちあがり、
      道を失い嘆くどこかの船人を、港へ導き帰さねば。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

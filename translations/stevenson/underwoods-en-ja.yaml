    "kind": "verse"
    "origin": "source"
    "source_text": |-
      They ken your name, they ken your tyke,
      They ken the honey from your byke;
      But mebbe after a’ your fyke,
      (The trüth to tell)
      It’s just your honest Rab they like,
      An’ no yoursel’.
    "source_languages":

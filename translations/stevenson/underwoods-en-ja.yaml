        "printed_page": "105"
        "anchor": "page105"
    "translation_ja": |-
      悪いのもいいのも一緒に引き受ける。
      灰色は灰色と呼ぶ、黒とは呼ばない。
      急な坂には、我慢強い背中で
      毎日向かってゆく。
      荒っぽく、風よけもない人生の道を、
      陽気に登ってゆくんだ。

        "printed_page": "130"
        "anchor": "page130"
    "translation_ja": |-
      生身の人間が怖がる厄介ごと、
      友を失うこと、持ちものに事欠くこと、
      犬が吠え立てること、雌馬が鼻疽にかかること、
      娘がばかを言うこと、
      そのなかで私が我慢ならないのは、ただ一つ、
      自分の良心だ。

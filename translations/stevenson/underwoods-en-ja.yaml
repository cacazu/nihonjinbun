        "xpath": "/html/body/p[233]"
        "printed_page": "115"
        "anchor": "page115"
    "translation_ja": |-
      暮らしの隅から隅まで、あの方の命令で
      誰にも守れるよう細かく定めてあった。
      だが見ろ、この法大全は、
      誰にも忘れられたまま。
      神さまの宗教はどこの国でも
      死んで腐ってしまった。

        "xpath": "/html/body/p[75]"
        "printed_page": "39"
        "printed_page_end": "40"
        "anchor": "page39"
    "translation_ja": |-
      海のはるかまで鐘の鳴り渡るところで、
      器用な指が私を造った。
      そこでは御殿の壁にかかっていた、
      あのコンスエロが歌うあいだ。
      だがいくら耳を澄ましても、聞こえなかった、
      一つの音も、ひと震えの節も、
      鳴りかわす鐘のひと打ちも。
      そこに掛かって眺めれば、
      私の灰色の面に麗しい顔々が
      輝く髪の下から光っていた。
      もたげた頭はよく見えたが、
      唇は動いても、一言も聞こえない。
      広間に灯がともっても、
      踊る人々はみな無音に動いた。
    "translation_status": "reviewed"

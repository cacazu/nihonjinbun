          "end": 124
          "exact": "An’ stumpie tailie,"
      - "side": "source"
        "kind": "indent"
        "columns": 6
        "span":
          "start": 159
          "end": 178
          "exact": "By James and Ailie."
      - "side": "translation"
        "kind": "indent"
        "columns": 6
        "span":
          "start": 57
          "end": 69
          "exact": "切り詰めた尻尾をそなえ、"
      - "side": "translation"
        "kind": "indent"
        "columns": 6
        "span":

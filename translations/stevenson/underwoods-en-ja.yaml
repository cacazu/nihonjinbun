    "translation_ja": |-
      スコットランドではいくらかの陽気で、
      飾りけのない、おとなしい田舎暮らしの者が
      真理を保っている（あるいは保っていた）、
      この世の人間のなかでただ彼らだけが。
      そしていま残っているのは二人だけ、
      ベッグにニーヴンだけさ。

    "section_id": "uw-en-poem-xx"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Not one quick beat of your warm heart,
      Nor thought that came to you apart,
      Pleasure nor pity, love nor pain
      Nor sorrow, has gone by in vain;
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page42"

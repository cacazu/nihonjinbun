        "printed_page": "78"
        "anchor": "page78"
    "translation_ja": |-
      「だが、この坂は自分なら登れるなんて思うなよ。
      おまえだって、この苦い皮を噛まなきゃならん。
      いくら学があり、いくら腕があっても、
      そんなに運よくはいくまい。
      むしろよろしくないかもしれんぞ、
      おまえにとっちゃ、若旦那。

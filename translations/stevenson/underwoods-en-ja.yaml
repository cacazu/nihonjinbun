  - "id": "uw-en-104"
    "section_id": "uw-en-poem-xxiv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Not yet, my soul, these friendly fields desert,
      Where thou with grass, and rivers, and the breeze,
      And the bright face of day, thy dalliance hadst;
      Where to thine ear first sang the enraptured birds;
      Where love and thou that lasting bargain made.
      The ship rides trimmed, and from the eternal shore
      Thou hearest airy voices; but not yet
      Depart, my soul, not yet awhile depart.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page50"
        "source_sequence": 284
        "xpath": "/html/body/p[92]"
        "printed_page": "50"
        "anchor": "page50"
    "translation_ja": |-
      わが魂よ、まだこの親しい野を見捨てるな。
      草や川やそよ風、
      日の輝く顔と、戯れたところだ。
      うっとりした鳥が初めてあなたの耳に歌い、
      愛とあなたが永い取り決めを交わしたところだ。
      船は身支度をととのえて浮かび、永遠の岸から
      空を渡る声が聞こえる。だがまだ、
      立ち去るな、わが魂よ、まだしばらくは立ち去るな。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So is pain cheered, death comforted; the house
      Of sorrow smiles to listen. Once again—
      O thou, Orpheus and Heracles, the bard
      And the deliverer, touch the stops again!
    "source_languages":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      When aince Aprile has fairly come,
      An’ birds may bigg in winter’s lum,
      An’ pleisure’s spreid for a’ and some
      O’ whatna state,
      Love, wi’ her auld recruitin’ drum,
      Than taks the gate.
    "source_languages":

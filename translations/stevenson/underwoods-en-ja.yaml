    "source_text": |-
      An’ there were a’ the lures o’ life,
      There pleesure skirlin’ on the fife,
      There anger, wi’ the hotchin’ knife
      Ground shairp in Hell—
      My conscience!—you that’s like a wife!—
      Whaur was yoursel’?

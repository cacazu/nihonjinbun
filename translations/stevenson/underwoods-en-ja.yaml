    "source_text": |-
      It’s here our Merren lang has lain,
      A wee bewast the table-stane;
      An’ yon’s the grave o’ Sandy Blane;
      An’ further ower,
      The mither’s brithers, dacent men!
      Lie a’ the fower.
    "source_languages":

        "printed_page": "113"
        "anchor": "page113"
    "translation_ja": |-
      「何てこった、飛び出したはいいが、どこへ行く？」と私は思う。
      「どんな呪わしい、ハリエニシダの生えた崖で、
      あるいはどんな泥の海にひっくり返って、
      私は置き去りにされるのか。
      恥をかかされるだけか？　もっとひどく、
      痛い目にまで遭うのか？」

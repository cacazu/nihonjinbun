    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The bed was made, the room was fit,
      By punctual eve the stars were lit;
      The air was still, the water ran,
      No need was there for maid or man,
      When we put up, my ass and I,
      At God’s green caravanserai.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page66"
        "source_sequence": 327
        "xpath": "/html/body/p[127]"
        "printed_page": "66"
        "anchor": "page66"
    "translation_ja": |-
      寝床は整い、部屋は申し分なく、
      刻限どおりの宵が星をともした。
      空気は静まり、水は流れ、
      下働きは女も男もいらなかった、
      私と驢馬が宿を取ったとき、
      神の緑の隊商宿に。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

        "anchor": "page17"
    "translation_ja": |-
      むき出しの荒野を愛し、
      まっすぐな野の風を愛したあなただった。
      銀色にかすめる雨を浴び、
      あふれる小川を愛した。
      露、霜、山々、火、海、
      騒がしい沈黙、
      闇のなかで横笛を吹く風、
      高く渡る、けがれなき月を。
    "translation_status": "reviewed"

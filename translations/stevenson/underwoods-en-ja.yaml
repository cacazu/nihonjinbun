    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Lord safe us, life’s an unco thing!
      Simmer an’ Winter, Yule an’ Spring,
      The damned, dour-heartit seasons bring
      A feck o’ trouble.
      I wadnae try’t to be a king—
      No, nor for double.
    "source_languages":
      - "sco"
    "source_locations":

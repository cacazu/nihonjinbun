  - "id": "uw-en-052"
    "section_id": "uw-en-poem-xi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      This is unborn beauty: she
      Now in air floats high and free,
      Takes the sun and breaks the blue;—
      Late with stooping pinion flew
      Raking hedgerow trees, and wet
      Her wing in silver streams, and set
      Shining foot on temple roof:
      Now again she flies aloof,
      Coasting mountain clouds and kiss’t
      By the evening’s amethyst.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page22"
        "source_sequence": 232
        "xpath": "/html/body/p[53]"
        "printed_page": "22"
        "anchor": "page22"
    "translation_ja": |-
      これがまだ形を得ぬ美。彼女はいま
      自由に高く空に浮かび、
      陽を受けて青空を割る。
      つい先ほど翼を垂れて飛び、
      生け垣の木々をかすめ、銀色の水に
      翼を濡らし、輝く足を
      神殿の屋根に置いたのに。
      いままた遠く離れて飛び、
      山をなす雲の縁をよぎり、
      夕べの紫水晶に口づけられる。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-053"
    "section_id": "uw-en-poem-xi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In wet wood and miry lane,
      Still we pant and pound in vain;
      Still with leaden foot we chase
      Waning pinion, fainting face;
      Still with gray hair we stumble on,
      Till, behold, the vision gone!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page22"
        "source_sequence": 233
        "xpath": "/html/body/p[54]"
        "printed_page": "22"
        "anchor": "page22"
    "translation_ja": |-
      濡れた森、ぬかるむ道で、
      なお私たちは息を切らし、徒らに足を踏み鳴らす。
      鉛のような足でなお追う、
      しぼむ翼、消えゆく顔を。
      白髪となってもよろめきながら行く。
      見よ、とうとう幻は消えた！
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-054"
    "section_id": "uw-en-poem-xi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Where hath fleeting beauty led?
      To the doorway of the dead.
      Life is over, life was gay:
      We have come the primrose way.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page23"
        "source_sequence": 234
        "xpath": "/html/body/p[55]"
        "printed_page": "23"
        "anchor": "page23"
    "translation_ja": |-
      逃げ去る美は私たちをどこに導いた？
      死者の国の戸口へと。
      生は終わった。生は愉しかった。
      私たちは桜草の道を来たのだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

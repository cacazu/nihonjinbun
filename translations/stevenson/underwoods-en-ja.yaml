    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Whan day (an’ a’ excüse) has gane,
      An’ wark is düne, and duty’s plain,
      An’ to my chalmer a’ my lane
      I creep apairt,
      My conscience! hoo the yammerin’ pain
      Stends to my heart!
    "source_languages":
      - "sco"
    "source_locations":

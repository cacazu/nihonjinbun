  - "id": "uw-en-123"
    "section_id": "uw-en-poem-xxvii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Yet, O stricken heart, remember, O remember
      How of human days he lived the better part.
      April came to bloom and never dim December
      Breathed its killing chills upon the head or heart.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page58"
        "source_sequence": 303
        "xpath": "/html/body/p[108]"
        "printed_page": "58"
        "anchor": "page58"
    "translation_ja": |-
      それでも、おお、打ちひしがれた心よ、思い出せ、ああ、思い出せ。
      人の生の日々のうち、よりよいところをあの人は生きたのだ。
      四月は咲き誇り、暗い十二月は一度として
      その頭にも心にも、死の寒さを吹きつけなかった。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

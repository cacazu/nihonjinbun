    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In Scotland, a wheen canty, plain,
      Douce, kintry-leevin’ folk retain
      The Truth—or did so aince—alane
      Of a’ men leevin’;
      An’ noo just twa o’ them remain—
      Just Begg an’ Niven.
    "source_languages":
      - "sco"
    "source_locations":

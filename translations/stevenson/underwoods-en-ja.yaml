    "translation_ja": |-
      外国のあちこちへ行って、
      めったにない変てこなものをたくさん見ました。
      ジョンストンさん、あなたと私が最後に
      コックルライを歩いてからというもの。
      目をきかせ、気をつけながら、私は
      海と陸を通って東から西へ行きましたが、
      どんな年齢、どんな身分を見ても、
      忌まわしいことしかありませんでした。
      こんな信仰盟約なき国々で
      さすらうスコットランド人は両手を上げます、
    "translation_status": "reviewed"

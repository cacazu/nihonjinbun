    "origin": "source"
    "source_text": |-
      For God whan jowes the Judgment bell,
      Wi’ His ain Hand, His Leevin’ Sel’,
      Sall ryve the guid (as Prophets tell)
      Frae them that had it;
      And in the reamin’ pat o’ Hell,
      The rich be scaddit.
    "source_languages":

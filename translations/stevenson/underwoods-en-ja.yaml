  - "id": "uw-en-033"
    "section_id": "uw-en-poem-vii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Friend, in my mountain-side demesne
      My plain-beholding, rosy, green
      And linnet-haunted garden-ground,
      Let still the esculents abound.
      Let first the onion flourish there,
      Rose among roots, the maiden-fair,
      Wine-scented and poetic soul
      Of the capacious salad bowl.
      Let thyme the mountaineer (to dress
      The tinier birds) and wading cress,
      The lover of the shallow brook,
      From all my plots and borders look.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page14"
        "source_sequence": 213
        "xpath": "/html/body/p[38]"
        "printed_page": "14"
        "anchor": "page14"
    "translation_ja": |-
      友よ、わが山腹の領分、
      野を見渡す、薔薇色と緑の、
      紅ひわの通うこの庭で、
      いつも食べられるものをたっぷり実らせてくれ。
      まず玉ねぎをおおいに育てよ、
      根菜に咲く薔薇、乙女の美しさ、
      広々としたサラダ鉢の、
      葡萄酒の香りがする詩の魂だ。
      山の子タイムを（小鳥の料理に添えるため）
      浅い小川を愛して水に立つクレソンを、
      畝からも庭のへりからも、
      そこかしこから顔を出させてくれ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 6
          "exact": "Friend"
  - "id": "uw-en-034"
    "section_id": "uw-en-poem-vii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Nor crisp and ruddy radish, nor
      Pease-cods for the child’s pinafore
      Be lacking; nor of salad clan
      The last and least that ever ran
      About great nature’s garden-beds.
      Nor thence be missed the speary heads
      Of artichoke; nor thence the bean
      That gathered innocent and green
      Outsavours the belauded pea.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page15"
        "source_sequence": 214
        "xpath": "/html/body/p[39]"
        "printed_page": "15"
        "anchor": "page15"
    "translation_ja": |-
      歯触りのよい赤い二十日大根も、
      子どもが前掛けに拾うえんどうの莢も、
      どうか欠かすな。大自然の菜園を
      駆けてきたサラダ一族のうち、
      いちばん後ろの、いちばん小さいものまでも。
      槍の穂先に似たアーティチョークの頭も、
      幼く青いうちに摘めば、
      褒めそやされるえんどうよりも旨い
      そら豆も、どうか忘れずに。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-035"
    "section_id": "uw-en-poem-vii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      These tend, I prithee; and for me,
      Thy most long-suffering master, bring
      In April, when the linnets sing
      And the days lengthen more and more
      At sundown to the garden door.
      And I, being provided thus.
      Shall, with superb asparagus,
      A book, a taper, and a cup
      Of country wine, divinely sup.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page15"
        "source_sequence": 215
        "xpath": "/html/body/p[40]"
        "printed_page": "15"
        "anchor": "page15"
    "translation_ja": |-
      これらを世話して、それからこの
      我慢強さでは誰にも負けない主人のために、
      紅ひわの歌う四月、
      日がますます長くなるころ、
      日暮れに庭の戸口まで持ってきてくれ。
      そうやって支度がととのえば、
      とびきりのアスパラガスに、
      本と細ろうそくと、土地の葡萄酒を一杯。
      私の夕飯は神々なみだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Or in the gloamin’ douce an’ gray
      The sweet-throat mavis tunes her lay;
      The herd comes linkin’ doun the brae;
      An’ by degrees
      The muckle siller müne maks way
      Amang the trees.
    "source_languages":

    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Here aft, weel neukit by my lane,
      Wi’ Horace, or perhaps Montaigne,
      The mornin’ hours hae come an’ gane
      Abüne my heid—
      I wadnae gi’en a chucky-stane
      For a’ I’d read.
    "source_languages":
      - "sco"
    "source_locations":

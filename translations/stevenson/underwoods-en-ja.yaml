        "printed_page": "111"
        "anchor": "page111"
    "translation_ja": |-
      「まあ」とあんたらは肩で息して言う、
      「そこまではいい、でもその先は？
      毎年、宴へ集まってくるのさ、
      みんな期待に胸をふくらませて。
      毎年、声をからして『あいつめ、首をくくれ、
      また歌がない！』」

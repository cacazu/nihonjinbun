    "source_text": |-
      “What tongue does your auld bookie speak?”
      He’ll spier; an’ I, his mou to steik:
      “No bein’ fit to write in Greek,
      I write in Lallan,
      Dear to my heart as the peat reek,
      Auld as Tantallon.

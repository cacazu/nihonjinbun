  - "id": "uw-en-048"
    "section_id": "uw-en-poem-x"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The unfathomable sea, and time, and tears,
      The deeds of heroes and the crimes of kings
      Dispart us; and the river of events
      Has, for an age of years, to east and west
      More widely borne our cradles. Thou to me
      Art foreign, as when seamen at the dawn
      Descry a land far off and know not which.
      So I approach uncertain; so I cruise
      Round thy mysterious islet, and behold
      Surf and great mountains and loud river-bars,
      And from the shore hear inland voices call.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page19"
        "source_sequence": 228
        "xpath": "/html/body/p[50]"
        "printed_page": "19"
        "anchor": "page19"
    "translation_ja": |-
      底知れぬ海と、時と、涙、
      英雄の業と王たちの罪が、
      私たちを隔てる。出来事の河は
      久しい年月、東へ西へ、
      私たちの揺りかごをいよいよ遠くへ運んだ。私にとって
      あなたは異国の地だ。船乗りが曙に
      はるか陸地を認めて、その名を知らぬように。
      だから私はおぼつかなく近づき、
      謎めいたあなたの小島を巡り、
      砕ける波と大山脈、轟く河口の洲を眺め、
      浜にいて奥地から呼ぶ声を聞く。
    "translation_status": "reviewed"

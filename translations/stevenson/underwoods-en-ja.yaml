    "source_text": "pretty nearly what you please, much as in English, Heaven guide the reader through that labyrinth! But in Scots it dodges usually from the short I, as in grin, to the open E, as in mere. Find the blind, I may remark, are pronounced to rhyme with the preterite of grin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page76"
        "source_sequence": 366
        "xpath": "/html/body/table[2]/tbody/tr[12]/td[2]"
        "printed_page": "76"
        "anchor": "page76"
    "translation_ja": "英語の場合とほぼ同じで、まあお好きなように。天が読者をこの迷路から導いてくださいますように！　ただしスコットランド語では、たいてい grin の短いＩと mere の開いたＥのあいだをすばしこく行き来する。ちなみに find the blind は、grin の過去形と韻を踏むように発音する。"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

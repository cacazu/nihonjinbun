    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Sic-like, some tyke grawn auld and blind,
      Whan thieves brok’ through the gear to p’ind,
      Has lain his dozened length an’ grinned
      At the disaster;
      An’ the morn’s mornin’, wud’s the wind,
      Yokes on his master.
    "source_languages":
      - "sco"
    "source_locations":

        "printed_page": "101"
        "anchor": "page101"
    "translation_ja": |-
      主よ助けてくれ、人生は妙なもんだ！
      夏と冬、クリスマスと春、
      呪わしい、冷たい心の季節が運ぶのは、
      山ほどの厄介ごと。
      王様になれるといっても私はご免だ。
      いや、倍の褒美でもさ。

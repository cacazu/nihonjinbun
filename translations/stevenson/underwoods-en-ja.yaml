        "anchor": "page42"
    "translation_ja": |-
      親しき友よ、親しきお顔に読む、
      見事な優美さで語られる生涯の物語を。
      あなたの生の川を私はたどる、
      陽がまだらにさす、まがりくねる川床を、
      はるか遠くの源泉まで。
    "translation_status": "reviewed"

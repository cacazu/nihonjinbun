    "source_text": |-
      I ken it fine: just waitin’ here,
      To gar the evil waur appear,
      To clart the guid, confüse the clear,
      Mis-ca’ the great,
      My conscience! an’ to raise a steer
      Whan a’s ower late.
    "source_languages":

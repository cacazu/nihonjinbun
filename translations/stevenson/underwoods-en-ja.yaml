    "kind": "verse"
    "origin": "source"
    "source_text": |-
      An’ whiles, at orra times, keeks out,
      Sees what puir mankind are about;
      An’ if He can, I’ve little doubt,
      Upsets their plans;
      He hates a’ mankind, brainch and root,
      An’ a’ that’s man’s.
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"

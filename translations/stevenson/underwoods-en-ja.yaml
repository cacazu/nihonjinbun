        "anchor": "page111"
    "translation_ja": |-
      仲間よ、私に何が言えるんだ？
      詩神さまの気まぐれなら知ってるだろう。
      昨夜は猟犬みたいに機敏で、今日じゃ
      驢馬のように意地っ張り。
      ご本人には遊びのつもりの振る舞いも、
      こっちには命取りだ。

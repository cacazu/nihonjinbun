    "origin": "source"
    "source_text": |-
      Beeches an’ aiks entwine their theek,
      An’ firs, a stench, auld-farrant clique.
      A’ simmer day, your chimleys reek,
      Couthy and bien;
      An’ here an’ there your windies keek
      Amang the green.
    "source_languages":
      - "sco"

      ご承知のとおり、あの方には天国という立派な所がある。
      くたくたになった気の毒な私ら人間を
      表の間にも奥の間にもぎゅうぎゅう詰めに置き去りにする、
      あの方が地上と呼ぶ場所へ。
      ちっぽけで不便な穴ぐらさ、
      たいしたねうちもない。

  - "id": "uw-en-105"
    "section_id": "uw-en-poem-xxiv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Freedom is far, rest far. Thou art with life
      Too closely woven, nerve with nerve intwined;
      Service still craving service, love for love,
      Love for dear love, still suppliant with tears.
      Alas, not yet thy human task is done!
      A bond at birth is forged; a debt doth lie
      Immortal on mortality. It grows—
      By vast rebound it grows, unceasing growth;
      Gift upon gift, alms upon alms, upreared,
      From man, from God, from nature, till the soul
      At that so huge indulgence stands amazed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page50"
        "source_sequence": 285
        "xpath": "/html/body/p[93]"
        "printed_page": "50"
        "printed_page_end": "51"
        "anchor": "page50"
    "translation_ja": |-
      自由は遠く、休息は遠い。あなたと生は
      あまりに固く織り合わされ、神経が神経に絡む。
      仕えたあとも仕えることを求め、愛には愛、
      いとしい愛には愛をと、涙でなお請う。
      ああ、人としてのあなたの務めはまだ終わらない！
      生まれたとき絆が鍛えられ、
      必ず死ぬ者に、不滅の負い目がのしかかる。それは増す。
      おおきくはね返って増す、やむことなく増す。
      贈り物に贈り物、恵みに恵みが積み上がり、
      人から、神から、自然から。ついに魂は
      あまりの恵みを前に、驚きに立ち尽くす。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-106"
    "section_id": "uw-en-poem-xxiv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Leave not, my soul, the unfoughten field, nor leave
      Thy debts dishonoured, nor thy place desert
      Without due service rendered. For thy life,
      Up, spirit, and defend that fort of clay,
      Thy body, now beleaguered; whether soon
      Or late she fall; whether to-day thy friends
      Bewail thee dead, or, after years, a man
      Grown old in honour and the friend of peace.
      Contend, my soul, for moments and for hours;
      Each is with service pregnant; each reclaimed
      Is as a kingdom conquered, where to reign.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page51"
        "source_sequence": 286
        "xpath": "/html/body/p[94]"
        "printed_page": "51"
        "anchor": "page51"
    "translation_ja": |-
      わが魂よ、戦わずに戦場を去るな、
      負い目を踏み倒すな、果たすべき奉仕を
      せぬまま持ち場を捨てるな。命をかけ、
      起て、魂よ、土の砦を守れ。
      いま包囲されたあなた自身の肉体だ。それが早く
      落ちようと遅く落ちようと、今日にも友が
      あなたの死を嘆こうと、それとも年月のあと、
      誉れのうちに老いた、平和の友の死を嘆こうと。
      一瞬、一時間のためにも争え、わが魂よ。
      どの時も奉仕の機会を孕む。勝ち取った時はみな、
      征服した王国のようだ。そこであなたが統べるのだ。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"
  - "id": "uw-en-107"
    "section_id": "uw-en-poem-xxiv"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      As when a captain rallies to the fight
      His scattered legions, and beats ruin back,
      He, on the field, encamps, well pleased in mind.
      Yet surely him shall fortune overtake,
      Him smite in turn, headlong his ensigns drive;
      And that dear land, now safe, to-morrow fall.
      But he, unthinking, in the present good
      Solely delights, and all the camps rejoice.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page52"
        "source_sequence": 287
        "xpath": "/html/body/p[95]"
        "printed_page": "52"
        "anchor": "page52"
    "translation_ja": |-
      たとえば隊長が、散り散りの軍勢を集めなおし、
      戦いへ戻して破滅を突き返すとき、
      満ち足りて戦場に陣を取る。
      だがいずれ運命が追いすがり、
      今度は彼を打ち、その軍旗をなぎ倒し、
      今日無事な大事な土地も、明日は落ちるのだ。
      それでも彼は先を思わず、今ある幸いだけを
      喜び、陣営はことごとく歓声をあげる。
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rl-stevenson"

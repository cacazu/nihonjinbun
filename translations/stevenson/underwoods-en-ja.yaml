  - "id": "uw-en-120"
    "section_id": "uw-en-poem-xxvi"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Child. Mother, mother, speak low in my ear,
      Some of the things are so great and near,
      Some are so small and far away,
      I have a fear that I cannot say,
      What have I done, and what do I fear,
      And why are you crying, mother dear?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page56"
        "source_sequence": 300
        "xpath": "/html/body/p[106]"
        "printed_page": "56"
        "printed_page_end": "57"
        "anchor": "page56"
    "translation_ja": |-
      子　お母さん、お母さん、耳に小さい声でお話しして、
      いろんなものが、すごく大きく、すぐそばにあったり、
      すごく小さく、遠くのほうにあったりする。
      怖いけれど、何が怖いのか言えないよ。
      ぼくは何をしちゃったの？　ぼくは何が怖いの？
      ねえお母さん、どうして泣いているの？
    "translation_status": "reviewed"
    "attributions":

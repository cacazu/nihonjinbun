  - "id": "uw-sco-010"
    "section_id": "uw-sco-poem-i"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “An’ you, sair gruppin’ to a spar
      Or whammled wi’ some bleezin’ star,
      Cryin’ to ken whaur deil ye are,
      Hame, France, or Flanders—
      Whang sindry like a railway car
      An’ flie in danders.”
    "source_languages":
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-438"
        "precision": "block"
        "url": "https://gutenberg.pglaf.org/cache/epub/438/pg438-images.html#page79"

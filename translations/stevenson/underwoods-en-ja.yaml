        "printed_page": "132"
        "anchor": "page132"
    "translation_ja": |-
      ちょうど年老いて、目が見えなくなった犬が、
      泥棒が押し入って家財をかっさらおうというとき、
      ぼうっと伸びて横たわり、にやにやしていた、
      その災難をよそに。
      そうして翌朝、風のように荒れ狂い、
      自分の主人に食ってかかる。

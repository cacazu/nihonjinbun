  source_text: SPEECH BY JOHN STUART MILL, IN THE BRITISH PARLIAMENT, May 20th, 1867.
  translation_ja: 一八六七年五月二十日、英国議会におけるジョン・スチュアート・ミルの演説
  translation_status: reviewed
- id: mill-001
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '1'
    printed_page_end: '2'
    pdf_page: 1
    source_sequence: 4
  source_text: I rise, sir, to propose an extension of the suffrage which can excite no party or class feeling in the house—which can give no umbrage to the keenest assertor of the claims either of property or of numbers; an extension which has not the faintest tendency to disturb, what we have heard so much about lately, the balance of political power; which cannot afflict the most timid alarmist by any revolutionary terrors, or offend the most jealous democrat as an infringement of popular rights, or a privilege granted to one class of society at the expense of another. There is nothing to distract our minds from the simple consideration whether there is any reasonable ground for excluding an entire half of the Nation, not only from actual admission, but from the very possibility of being admitted within the pale of citizenship, though they may fulfil every one of the conditions legally and constitutionally sufficient in all cases but theirs. This is, under the laws of our country, a solitary case. There is no other example of an exclusion which is absolute. If it were the law that none should have a vote but the possessors of £5,000 a year, the poorest man in the community might, and now and then would, attain to the privilege. But neither birth, nor merit, nor exertion, nor intellect, nor fortune, nor even that great disposer of human affairs—accident, can enable any woman to have her voice counted in those common concerns which touch her and hers as nearly as any other person in the Nation.
  translation_ja: 委員長、私が提案する選挙権の拡張は、この議場に党派や階級の対立を引き起こすものではありません。財産を何より重んじる方にも、人数を何より重んじる方にも、何ひとつ差し障りはありません。近ごろしきりに耳にする政治勢力の均衡も、いささかも揺らぎません。どれほど臆病な心配性の方にも革命の恐怖を味わわせるものではなく、人民の権利に目を光らせる民主主義者にも、その権利を侵すとか、ある階級の犠牲で別の階級に特権を与えるなどと言われるものではありません。ですから、ただ一つの問いを、気を散らさずに考えられます。他の誰に対しても法律上、憲法上十分とされる条件を一つ残らず満たしていても、国民の半数を市民の列に加えず、それどころか加わる可能性さえ閉ざす。そのような区別に、何かもっともな理由があるでしょうか。わが国の法律に、このほかに例はありません。これほど絶対的な排除は他にはないのです。仮に年収五千ポンド以上の者しか投票できないという法律があっても、社会で最も貧しい男にも、いつかその権利を得る可能性はあり、ときには実際にそのようなことも起きるでしょう。ところが女性の場合、生まれも、功績も、努力も、知力も、財産も、さらには人の世を思うままに動かすあの偶然の力でさえ、何の役にも立ちません。自分と家族にとって、国の誰にとってもそうであるのと同じほど切実な公共の事柄について、女性はただの一人も、その声を数に入れてもらえないのです。
  translation_status: reviewed
- id: mill-002
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '2'
    printed_page_end: '3'
    pdf_page: 2
    source_sequence: 5
  source_text: Now, sir, before going any farther, permit me to say that a prima facie case is already made out. It is not just to make distinctions, in rights and privileges, between one of Her Majesty’s subjects and another, unless for a positive reason. I do not mean that the suffrage, or any other political function, is an abstract right, or that to withhold it from any one, on sufficient grounds of expediency, is a personal wrong; it is an utter misunderstanding of the principle I maintain to confound this with it; my whole argument is one of expediency. But all expediencies are not on exactly the same level. There is a kind of expediency which is called justice; and justice, though it does not necessarily demand that we should bestow political rights on every one, does demand that we should not capriciously and without cause give those rights to one and withhold them from another. As was most justly said by my right honorable friend, the member for South Lancashire, in the most misunderstood and misrepresented speech that I ever remember, to lay a ground for the denial of the franchise to any one, it is necessary to allege either personal unfitness or public danger. Can either of these be asserted in the present case? Can it be pretended that women who manage a property or conduct a business, who pay rates and taxes, often to a large amount, and often from their own earnings, many of whom are responsible heads of families, and some of whom, in the capacity of schoolmistresses, teach more than a great many of the male electors have ever learnt, are not capable of a function of which every male householder is capable? Or is it supposed that, if they were allowed to vote, they would revolutionize the State, subvert any of our valuable institutions, or that we should have worse laws, or be, in any single respect, worse governed by means of their suffrage? [Hear, hear.]
  translation_ja: 委員長、先へ進む前に、これだけは申し上げておきたい。ここまでですでに、反対する側が理由を示すべきところまで来ています。女王陛下の臣民のうち、ある者とある者の権利や特権に差をつけることは、はっきりした理由がないかぎり、公正ではありません。選挙権をはじめ政治上の役割を抽象的な権利だと言うのではありません。公益上の十分な理由があって誰かにそれを認めないことが、その人個人に対する不正だと言うのでもない。私の原則をそのような考えと一緒にするのは、まったくの誤解です。私の議論は最初から最後まで、何が人々のためになるかという議論です。ただし、何の役に立つかは、すべて同じ重みで測れるものではありません。その中には正義と呼ばれるものがあります。正義は必ずしも万人に政治的権利を与えよとは命じませんが、ある者には与え、別の者には与えないという区別を、気まぐれに、理由もなく設けてはならない、と命じています。私の友人である南ランカシャー選出の議員が、私の記憶するかぎり最も誤解され、最も歪めて伝えられたあの演説で、まことに正しく言われたとおりです。誰かに選挙権を認めない根拠を示すには、本人に適性がないか、公共に危険が及ぶか、そのどちらかを申し立てなければなりません。今の場合、どちらが言えるでしょうか。財産を管理し、事業を切り盛りし、地方税も国税も納めている女性たちがいます。納める額は大きいことも多く、しかも自分の稼ぎから出していることが珍しくない。多くは一家の責任を負い、中には教師として、大勢の男性有権者がこれまでに学んだ以上のことを教えている人もいる。その人たちに、男性の世帯主なら誰にでも果たせる役割が果たせない、と言い張れるでしょうか。それとも女性に投票を認めれば、国家に革命が起こり、大切な制度が何か覆り、法律の質が落ち、あるいは何か一点でも政治が悪くなるとお考えでしょうか。〔そうだ、そうだ〕
  translation_status: reviewed

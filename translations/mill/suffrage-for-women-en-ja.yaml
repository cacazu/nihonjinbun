  source_text: 'The Tribune correspondent says: “Some of the greatest intellects in Parliament, and nearly all the young men on whom the future of England depends, made an honorable record on this great question. Among them were Hughes, Stansfield, Taylor, Lord Amberley, Oliphant, Mr. Denman, Mr. Fawcett, the O’Donoghue, and the sturdy old Roman Catholic Sir George Bowyer.”'
  translation_ja: 『トリビューン』紙の通信員はこう記している。「この重大な問題で、議会きっての知性を持つ人たちの何人かと、イングランドの未来を双肩に担う若手のほぼ全員が、誇るに足る記録を残した。その中にはヒューズ、スタンズフェルド、テイラー、アンバリー卿、オリファント、デンマン氏、フォーセット氏、オドノヒュー家の当主、それに老いてなお骨のあるカトリック教徒、サー・ジョージ・ボウヤーがいた。」

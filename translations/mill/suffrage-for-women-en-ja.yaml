- id: mill-004
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '3'
    printed_page_end: '3'
    pdf_page: 3
    source_sequence: 7
  source_text: 'There is evidence in our constitutional records that women have voted in counties and in some boroughs at former, though certainly distant, periods of history. But the house will expect that I should not rest my case on general principles, either of justice or of the Constitution, but should produce what are called practical arguments. Now I frankly admit that one very serious practical argument is entirely wanting in the case of women: they do not hold great meetings in Hyde Park—[laughter]—nor demonstrations at Islington.'
  translation_ja: わが国の憲政の記録には、たしかに遠い昔のことではありますが、女性が州でも、いくつかの都市選挙区でも、投票した証拠があります。しかしこの議場で期待されているのは、私が正義なり憲法なりの一般原則に頼ることではなく、いわゆる実際上の論拠を挙げることでしょう。一つ、実際上きわめて有力な論拠が、女性の場合にはまったく欠けています。率直に認めます。女性はハイド・パークで大集会を開いていませんし〔笑い〕、イズリントンで示威運動もしていません。
  translation_status: reviewed
- id: mill-005
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '3'
    printed_page_end: '4'
    pdf_page: 3
    source_sequence: 8
  source_text: 'How far this omission may be considered to invalidate their claims, I will not pretend to say. But other practical arguments—practical even in the most restricted sense of the term—are not wanting; and I am ready to state them if I may first be allowed to ask, Where are the practical objections? In general, the difficulty which people feel on this subject is not a practical objection; there is nothing practical in it; it is a mere feeling—a feeling of strangeness. The idea is so very new; at least they think so, though that is a mistake: it is a very old idea. Well, sir, strangeness is a thing which wears off. Some things were strange enough to many of us three months ago which are not at all so now; and many which are strange now will not be strange to the same person a few years hence, not to say a few months; and, as for novelty, we live in a world of novelties.'
  translation_ja: それをしないことで女性の要求がどれほど効力を失うものなのか、私に分かるなどとは申しません。ですが、実際上の論拠はほかにあります。「実際上」をどれほど狭い意味にとってもです。それを申し上げる前に、一つだけ伺いたい。実際上の反対理由はどこにあるのでしょうか。たいていの人がこの問題で引っかかるのは、実際上の反対理由ではありません。そこに実際の問題は何一つない。ただの感じ、なじみがないという感じなのです。この考えはあまりに新しい、と。少なくともそう思われていますが、それは間違いで、実はたいへん古い考えです。それになじみのなさなら、時とともに消えていきます。三か月前にはわれわれの多くがひどく奇異に思っていたのに、今では少しもそう思わないことがあります。今奇異に思っていることの多くも、同じ人が数年後、いや数か月後には奇異に思わなくなるでしょう。そもそも新しいものと言うなら、われわれの暮らす世の中は新しいものだらけです。
  translation_status: reviewed
- id: mill-006
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '4'
    printed_page_end: '4'
    pdf_page: 4
    source_sequence: 9
  source_text: 'The despotism of custom is on the wane: we are not now content to know that things are: we ask whether they ought to be; and in this house, I am bound to suppose that an appeal lies from custom to a higher tribunal, in which reason is judge. Now, the reasons which custom is in the habit of giving for itself on this subject are very brief: that, indeed, is one of my difficulties. It is not easy to refute an interjection. Interjections, however, are the only arguments among those we usually hear on this subject which it appears to me at all difficult to refute.'
  translation_ja: 慣習が専制君主のように支配する時代は衰えつつあります。もはや、そうなっていると知るだけで満足せず、そうあるべきなのかと問うようになりました。少なくともこの議場では、慣習の下した判決を不服として、理性を裁判官とする上級の法廷に訴えられるものと考えてよいはずです。ところでこの問題について、慣習がいつも自分を弁護する理由は、実に短い。まさにそこが、私には厄介なのです。感嘆のひと声に反論するのは、なかなか難しい。しかしこの件で日ごろ耳にする言い分のうち、少しでも反論が難しそうなのは、こうした声だけです。
  translation_status: reviewed
- id: mill-007
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '4'
    printed_page_end: '4'
    pdf_page: 4
    source_sequence: 10
  source_text: 'The others chiefly consist of such aphorisms as these: Politics is not women’s business, and would make them neglect their proper duties. Women do not desire the suffrage, and would rather not have it. Women are sufficiently represented through their male relatives. Women have power enough already. I shall perhaps be thought to have done enough in the way of answering, when I have answered all these: it may, perhaps, instigate any honorable gentleman who takes the trouble of replying to me, to produce something more recondite. [Hear.]'
  translation_ja: あとはおおむね、こういう決まり文句です。政治は女の仕事ではない、政治に関われば本来の務めを怠る。女性は選挙権を欲しがっていない、むしろないほうがよいと思っている。女性の利害は男性の身内を通じて十分に代表されている。女性にはもう十分に力がある。ひとまずこのすべてにお答えすれば、反論としては十分とお認めいただけるでしょう。そうすれば、わざわざ私にお答えくださる議員のどなたかも奮い立って、もう少し奥の深い反論を出してくださるかもしれません。〔そうだ〕
  translation_status: reviewed
- id: mill-008
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '4'
    printed_page_end: '5'
    pdf_page: 4
    source_sequence: 11
  source_text: Politics, it is said, is not a woman’s business. Well, sir, I am not aware that politics is a man’s business either, unless he is one of the few who is paid for devoting his time to the public service, or is a member of this or of the other house. The great majority of male voters have their own business, which engrosses nearly the whole of their time; but I have never heard that the hours occupied in attending, once in a few years, at a polling booth, even if we throw in the time spent in reading newspapers and political treatises, has hitherto made them neglect their shops or their counting houses. I have not heard that those who have votes are worse merchants, or worse lawyers, or worse physicians, or even worse clergymen, than other people. One would think that the British Constitution allowed no man to vote who was not able to give up the greater part of his time to politics; if that were the case, we should have a very limited constituency.
  translation_ja: 政治は女性の仕事ではない、と言われます。委員長、政治が男性の仕事だという話も、私は聞いたことがありません。公務に時間をささげて報酬を受ける少数の人か、こちらかもう一方の院の議員であれば別ですが。男性有権者の大多数は、自分の仕事にほぼすべての時間を費やしています。それでも、数年に一度投票所に足を運ぶのに使う何時間かのために、店や事務所をほったらかしたとは聞きません。新聞や政治を論じた文章を読む時間まで足しても、同じことです。選挙権を持っていると、ほかの人より商人として、弁護士として、医師として、はては聖職者としてまで劣るという話も聞きません。まるでわが憲法が、大半の時間を政治にささげられる男にしか投票を許していないかのような言いようです。それなら有権者の数は、よほど限られたものになるでしょう。
  translation_status: reviewed
- id: mill-009
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '5'
    printed_page_end: '5'
    pdf_page: 5
    source_sequence: 12
  source_text: But let me ask, what is the meaning of political freedom? Is it not the control of those who do make a business of politics by those who do not? It is the very principle of constitutional liberty that men come from their looms and their forges to decide—and decide well—whether they are properly governed, and whom they will be governed by; and the nations who prize this privilege, and who exercise it fully, are invariably those who excel most in the common affairs of life.
  translation_ja: そもそも政治的自由とは何でしょうか。政治を職業とする人を、政治を職業としない人が監督することではありませんか。人々は織機や鍛冶場を離れて出てきて、自分たちはきちんと治められているか、誰に治めてもらうのかを判断する。そしてその判断を立派に下す。これこそ立憲の自由の原理です。この権利を大切にし、十分に行使する国民こそ、例外なく、日々の暮らしにかかわる仕事にも最も秀でているのです。
  translation_status: reviewed

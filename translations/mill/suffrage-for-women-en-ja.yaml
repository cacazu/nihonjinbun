- id: mill-003
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '3'
    printed_page_end: '3'
    pdf_page: 3
    source_sequence: 6
  source_text: No one thinks anything of the kind; and it is not only the general principles of justice that are infringed, or at any rate set aside, by excluding women, merely as women, from the election of representatives. That exclusion is repugnant to the particular principles of the British Constitution. It violates the oldest of our constitutional axioms—a principle dear to all reformers, and theoretically acknowledged by conservatives—that taxation and representation should be co-extensive; that the taxes should be voted by those who pay them. Do not women pay taxes? Does not every woman who is sui juris pay exactly the same as a man who has the same electoral qualifications? If having a stake in the country means anything, the owner of freehold or leasehold property has the same stake, whether it is owned by a man or a woman.
  translation_ja: そんなことは誰も考えていません。女性をただ女性であるというだけで代表者の選挙から除くとき、侵される、少なくとも脇に追いやられるのは、正義の一般原則だけではありません。それは英国の憲法に固有の原則にも背いています。課税される者と議会に代表される者とは一致すべきであり、税を議決すべきなのはそれを払う人々である。これはわが憲法で最も古い公理で、すべての改革派が大切にし、保守派も理屈の上では認めるものですが、女性の排除はこれに反します。女性は税金を払いませんか。法律上独立している女性は皆、同じ選挙資格を持つ男性と、まったく同じように税金を払っていませんか。この国に利害を持つという言葉に意味があるのなら、土地を保有する権利であれ賃借権であれ、その持ち主が男でも女でも、利害は同じです。
  translation_status: reviewed

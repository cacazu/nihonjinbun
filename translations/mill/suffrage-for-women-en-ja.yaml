    precision: page
    printed_page: '8'
    printed_page_end: '9'
    pdf_page: 8
    source_sequence: 19
  source_text: It may be said that women can take interest in great national questions without having a vote. They can, certainly; but how many of them will? All that society and education can do is exhausted in inculcating on women that the rule of their conduct ought to be what society expects from them, and the denial of the vote is a proclamation, intelligible to every one, that society does not expect them to concern themselves with public interests. Why, the whole of a girl’s thoughts and feelings are toned down by it from her earliest school-days; she does not take the interest, even in national history, that a boy does, because it is to be no business of hers when she grows up. If there are women, and fortunately there now are, who do care about these subjects, and study them, it is because the force within is powerful enough to bear up against the worst kind of discouragement, that which acts not by interposing obstacles which may be struggled against, but by deadening the spirit which faces and conquers obstacles.
  translation_ja: 投票権などなくても、女性は国の大きな問題に関心を持てる、という声もあるでしょう。もちろん持てます。ですが、実際に持とうとする人が何人いるでしょう。社会と教育は、ありとあらゆる手を尽くして、社会から期待されるとおりに振る舞うのが女性の行動の規範であると教え込んでいます。そして投票を認めないことは、社会は女性が公共の利害に関わることを期待していない、という誰にも分かる宣言なのです。少女が考えたり感じたりすることは、学校に上がったばかりのころから、すべてこれで勢いをそがれます。国の歴史にさえ、少年ほどの関心を持たない。大人になっても自分の関わることではないからです。それでもそうした問題を気にかけ、よく学ぶ女性がいるとすれば、そして幸い今では実際にいるのですが、それは何よりもたちの悪い抑圧に立ち向かえるほど、内からの力が強いからです。立ち向かえる障害物を道に置くのでなく、障害に向き合い乗り越えようとする心そのものを弱らせてしまう抑圧なのです。
  translation_status: reviewed
- id: mill-017
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '9'
    printed_page_end: '9'
    pdf_page: 9
    source_sequence: 20
  source_text: We are told that women do not wish for the suffrage. If this be so, it only proves that nearly all women are still under this deadening influence, that the opiate still benumbs their mind and conscience. But there are many women who do desire the suffrage, and have claimed it by petitions to this house. How do we know how many more thousands there are who have not asked for what they do not hope to get, or for fear of being ill thought of by men or by other women, or from the feeling so sedulously cultivated by the whole of their education—aversion to make themselves conspicuous.
  translation_ja: 女性は選挙権など望んでいない、とも言われます。仮にそうなら、それで分かるのは、ほぼすべての女性がまだこの気力を奪う影響のもとにあり、この麻酔薬がいまだにその心と良心をしびれさせている、ということだけです。実際には選挙権を望み、この議院への請願でそれを求めた女性が大勢います。手に入る見込みもないものは求めないとか、男性やほかの女性に悪く思われるのが怖いとか、あるいは教育のすべてを通じてこれほど丹念に育てられた、人目に立ちたくないという気持ちからとか、声を上げなかった人がほかに何千人いるか、どうしてわれわれに分かるでしょう。
  translation_status: reviewed
- id: mill-018
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '9'
    printed_page_end: '9'
    pdf_page: 9
    source_sequence: 21
  source_text: Men must have a great faculty of self-delusion if they suppose that leading questions put to the ladies of their families, or of their acquaintance, will elicit their real sentiments, or will be answered with entire sincerity by one woman in ten thousand. No one is so well schooled as most women are in making a virtue of necessity. It costs little to disclaim caring for what is not offered; and frankness in expressing feelings that may be disagreeable or unflattering to their nearest connections, is not one of the virtues which a woman’s education tends to cultivate. It is, moreover, a virtue attended with sufficient risk to induce prudent women to reserve its exercise for cases in which there is some nearer interest to be promoted by it.
  translation_ja: 家族や知人の女性に、答えを誘導するような質問をすればその本心を引き出せる、あるいは一万人に一人でも、そういう質問にまったく包み隠しなく答える女性がいるだろう。そう思うとしたら、男性には、自分で自分を欺くたいした才能があるに違いありません。そうするしかないことを美徳に仕立てるという点で、大多数の女性ほどよく訓練されている人はいません。差し出されもしないものを欲しくはないと言ってみせるのは、たやすいことです。いちばん身近な人の気に障るかもしれない、あるいはその人を持ち上げることにはならない感情を、率直に表す。これは女性の教育が育てようとする美徳ではありません。そのうえ、この美徳を発揮するのはかなり危険でもあるから、分別のある女性なら、もっと身近で具体的な利害に役立つときまで取っておこうと思うものです。
  translation_status: reviewed
- id: mill-019
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '9'
    printed_page_end: '10'
    pdf_page: 9
    source_sequence: 22
  source_text: At all events, those who do not care for the suffrage will not use it. Either they will not register, or if they do, they will vote as their male relatives advise them, by which, as the advantage would probably be about equally shared among all classes, no harm would be done. Those, whether they be few or many, who do value the privilege, would exercise it, and would experience that stimulus to their faculties, and that widening and liberalizing influence on their feelings and sympathies which the suffrage seldom fails to exert over every class that is admitted to a share in it. Meanwhile, an unworthy stigma would have been taken off the whole sex, the law would have ceased to stamp them as incapable of serious things, would have ceased to proclaim that their opinions and wishes do not deserve to have any influence in things which concern them equally with men, and in many that concerned them much more than men. They would no longer be classed with children, idiots and lunatics—[laughter and cheers]—as incapable of taking care either of themselves or others, and needing that everything should be done for them without asking for their consent. If no more than one woman in twenty thousand used the vote, it would be a gain to all women to be declared capable of using it. Even so purely theoretical an enfranchisement would remove an artificial weight from the expansion of their faculties, the real evil of which is far greater than the apparent.
  translation_ja: いずれにせよ、選挙権を気にしない人は使いません。有権者登録をしないか、登録しても身内の男性に勧められた人に投票するでしょう。それで得をする割合はおそらくどの階級でもほぼ同じですから、何の害にもなりません。これに対して、その権利を大切に思う人は、多かろうと少なかろうと実際にそれを使うでしょう。そして、選挙権を分け持つようになったどんな階級にもほとんど例外なく起きることが、その人にも起きます。能力が刺激され、ものの感じ方が伸びやかになり、共感できる人の輪が広がるのです。同時に、女性全体がいわれのない汚名から解放されます。法律はもう、女性には重大なことはできないという烙印を押さなくなる。女性にも男性と同じように関わること、さらには男性よりも女性にはるかに深く関わる数多くのことに、女性の意見や願いは何の影響も及ぼすに値しない、などと宣言するのをやめるのです。女性はもう、子どもや知的障害者や精神を病む人とひとくくりにされて〔笑いと歓声〕、自分の面倒も人の面倒も見られず、何をするのも同意を求めるには及ばず、人任せにするほかない者として扱われることはありません。たとえ実際に投票するのが二万人に一人でも、投票する能力があると認められるのはすべての女性にとっての利益です。そこまで名目だけの解放にすぎなくても、能力の成長を妨げる人為的な重しが外れる。その重しの害は、見た目よりはるかに大きいのです。
  translation_status: reviewed
- id: mill-020
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '10'
    printed_page_end: '10'
    pdf_page: 10
    source_sequence: 23
  source_text: Then, it is said that women do not need direct political power, because they have so much indirect through the influence they possess over their male relatives and connections. [Laughter.] Sir, I should like to try this argument in other cases. Rich people have a great deal of indirect influence. Is this a reason for denying them a vote? [Cheers.] Did any one ever propose a rating qualification the wrong way, and bring in a reform bill to disfranchise everybody who lives in a £500 house, or pays £100 a year in direct taxes? [Hear, hear.] Unless this rule for distributing the franchise is to be reserved for the exclusive benefit of women, the legitimate consequence of it would be that persons above a certain amount of fortune should be allowed to bribe, but should not be allowed to vote. [Laughter.]
  translation_ja: こうも言われます。女性には直接の政治権力はいらない、男性の親族や身近な人々への影響を通じて間接の力をたっぷり持っているのだから、と。〔笑い〕委員長、その理屈をほかの場合にも試してみましょう。金持ちは間接の影響力をずいぶん持っています。だから金持ちには投票させないのですか。〔歓声〕家屋の課税評価額で決まる選挙資格を逆向きに適用しようと提案して、評価額五百ポンドの家に住んでいたり、直接税を年に百ポンド納めたりする人すべてから投票権を取り上げる改革法案を出した人が、これまで一人でもいましたか。〔そうだ、そうだ〕この選挙権の配り方という恩恵を女性だけの専売にしないのであれば、筋の通った結論はこうです。ある額以上の財産のある人には、買収は許しても投票は許してはならない。〔笑い〕
  translation_status: reviewed
- id: mill-021
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '10'
    printed_page_end: '11'
    pdf_page: 10
    source_sequence: 24
  source_text: Sir, it is true that women have already great power. It is part of my case that they have great power. But they have it under the worst possible conditions, because it is indirect, and, therefore, irresponsible. [Hear, hear.] I want to make that power a responsible power. [Hear, hear.] I want to make the woman feel her conscience interested in its honest exercise. I want to make her feel that it is not given to her as a mere means of personal ascendency. I want to make her influence work by a manly interchange of opinions, and not by cajolery. [Laughter and cheers.] I want to awaken in her the political point of honor. At present many a woman greatly influences the political conduct of her male connections, sometimes by force of will actually governs it; but she is never supposed to have anything to do with it. The man she influences, and perhaps misleads, is alone responsible. Her power is like the back-stairs influence of a favorite. The poor creature is nobody, and all is referred to the man’s superior wisdom; and as, of course, he will not give way to her if he ought not, she may work upon him through all his strongest feelings without incurring any responsibility. Sir, I demand that all who exercise power should have the burden laid upon them of knowing something about the things they have power over. With the admitted right to a voice would come a sense of the corresponding duty.
  translation_ja: 委員長、女性がすでに大きな力を持っていることは事実です。それはむしろ私の論拠の一つです。ただし、考えられるかぎり最も悪い条件でその力を持っています。影響の及ぼし方が間接的だから、責任を問われないのです。〔そうだ、そうだ〕私はその力を責任のともなう力にしたい。〔そうだ、そうだ〕それを誠実に用いるかどうかは、自分の良心の問題なのだと感じてほしい。人を自分の思いどおりにするだけの手段として与えられた力ではない、と感じてほしいのです。相手をうまく丸め込むのでなく、堂々と意見を交わすことで、その影響を及ぼしてもらいたい。〔笑いと歓声〕政治にも守らねばならない名誉があるという感覚を、女性のうちに呼び覚ましたいのです。今も身近な男性の政治行動に大きな影響を及ぼし、ときには意志の強さで実際にそれを支配する女性が大勢います。それなのに、その行動には全然関わっていないことにされています。責任を負うのは、彼女に動かされ、ときには誤った方向に導かれたかもしれない男性だけです。宮廷の寵臣が裏口から振るうような力なのです。かわいそうな女は物の数でなく、何もかも、より賢い男の決断だということになっている。譲ってはならないときに譲るような男では、もちろんないはずですから、女は男のいちばん強い感情を総動員して働きかけても、一切の責任を負いません。委員長、私は、誰であれ力を行使する者には、自分の力が及ぶ物事についていくらかは知る、という重荷を負ってほしいのです。発言する権利が認められてこそ、それに見合う義務の自覚も生まれるでしょう。
  translation_status: reviewed
- id: mill-022
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '11'
    printed_page_end: '11'
    pdf_page: 11
    source_sequence: 25
  source_text: A woman is not generally inferior in tenderness of conscience to a man. Make her a moral agent in matters of public conduct. Show that you require from her a political conscience, and when she has learnt to understand the transcendent importance of these things, she will see why it is wrong to sacrifice political convictions for personal interest and vanity; she will understand that political honesty is not a foolish personal crotchet, which a man is bound, for the sake of his family, to give up, but a serious duty; and the men whom she can influence will be better men in all public relations, and not, as they often are at present, worse men by the whole effect of her influence. [Hear, hear.]
  translation_ja: 女性は概して良心の細やかさにおいて男性に劣りません。公の行動をめぐっても、女性を自ら判断して責任を負う者として扱ってください。政治についても良心を持つことを女性に求めていると示してください。これらのことがどれほど重大かを理解するようになれば、個人の利益や虚栄のために政治的信念を犠牲にすることが、なぜいけないのかも分かるでしょう。政治上の誠実さは、男が家族のためなら捨てるのが当然の、つまらない独りよがりではなく、重い義務なのだと分かるでしょう。その女性が影響を及ぼせる男性は、公に関わるあらゆる場面で、今よりよい人間になります。女性が影響を及ぼした分だけかえって悪くなるという、今ありがちな結果にはならないのです。〔そうだ、そうだ〕
  translation_status: reviewed
- id: mill-023
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '11'
    printed_page_end: '12'
    pdf_page: 11
    source_sequence: 26
  source_text: But, at all events, it will be said women, as women, do not suffer any practical inconvenience by not being represented. The interests of all women are safe in the hands of their fathers, husbands and brothers, whose interest is the same with theirs, and who, besides knowing better than they do what is good for them, care a good deal more for them than they care for themselves.
  translation_ja: しかしともかく、女性は女性として、代表を持たないことで実害をこうむってはいない、と言われるでしょう。女性の利害は皆、その父や夫や兄弟に任せておけば安心だ。彼らは利害を共にし、何が女性のためになるかは本人以上によく知っているし、そのうえ本人が自分自身を大事に思う以上に女性たちを大事に思っている、というわけです。
  translation_status: reviewed
- id: mill-024
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '12'
    printed_page_end: '12'
    pdf_page: 12
    source_sequence: 27
  source_text: Sir, this is exactly what has been said of all other unrepresented classes—the operatives, for instance; are they not all virtually represented through their employers? are not the interests of the employer and that of the employed, when properly understood, the same? To insinuate the contrary, is it not the horrible crime of setting class against class? Is not the farmer interested along with his laborer in the prosperity of agriculture? Has not the cotton manufacturer as great an interest in the high price of calicoes as his workman? Is not the employer interested as well as his men in the repeal of taxes? Have not employer and employed a common interest against outsiders, just as man and wife have against all outside the family? And are not all employers kind, benevolent, charitable men, who love their work-people, and always know and do what is most for their good? Every one of these assertions is exactly as true as the parallel assertion respecting men and women. Sir, we are not living in Arcadia, but, as we were lately reminded, in fæce Romuli; and in that region workmen need other protection than that of their masters, and women than that of their men.
  translation_ja: 委員長、これは代表を持たないほかのすべての階級について言われてきたことと、そっくり同じです。たとえば工場の労働者は皆、雇い主を通して事実上代表されている、のではありませんか。正しく理解するなら、雇う側の利害と雇われる側の利害は同じではないか。違うなどとほのめかすのは階級と階級を争わせる恐ろしい罪ではないか。農業が栄えれば、農場経営者もそこで働く労働者も得をするのではないか。綿布の値が高ければ、その労働者と同じくらい製造業者にも利益があるのではないか。税が廃止されて得をするのは、雇われている男たちも雇い主も同じではないか。夫婦が家族以外のすべての人々に対して利害を共にするように、雇う者と雇われる者も部外者に対して利害を共にするのではないか。そして、雇い主は皆、親切で慈しみ深く、情けに厚い人たちで、働く人々を愛し、何がその人々にとっていちばんよいかをいつも知っていて、それを実行しているのではないか。これらの言い分は一つ一つ、男女についての同様の言い分と、まさしく同じ程度に本当です。委員長、われわれが暮らしているのは楽土アルカディアではなく、先ごろどなたかが思い出させてくださったように、「ロムルスの都の澱の中」です。その世界では、労働者には雇い主以外からの保護が、女性には身内の男性以外からの保護が必要です。
  translation_status: reviewed

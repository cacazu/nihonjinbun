- id: mill-025
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '12'
    printed_page_end: '13'
    pdf_page: 12
    source_sequence: 28
  source_text: I should like to see a return laid before the house of the number of women who are annually beaten to death, kicked to death, or trodden to death, by their male protectors. [Hear, hear.] I should like this document to contain, in an opposite column, a return of the sentences passed in those cases in which the dastardly criminal did not get off altogether; and in a third column a comparative view of the amount of property, the unlawful taking of which had, in the same sessions or assizes, by the same judge, been thought worthy of the same degree of punishment. [Cheers.] We should thus obtain an arithmetical estimate of the value set by a male legislature and male tribunals upon the murder of a woman by a habitual torture, often prolonged for years, which, if there be any shame in us, would make us hang our heads. [Cheers.]
  translation_ja: 私はこの議場に統計を出してもらいたい。保護者だという男性たちに殴り殺され、蹴り殺され、踏み殺される女性が、毎年何人いるのか。〔そうだ、そうだ〕向かいの欄には、その卑劣な犯罪者がまったくのおとがめなしでは済まなかった事件について、言い渡された刑を載せてもらいたい。第三の欄には比較のために、同じ開廷期の地方裁判所や巡回裁判所で、同じ裁判官が、いくらの財産を盗めば同じ重さの刑に値すると考えたかを、載せてもらいたい。〔歓声〕そうすれば、習い性になった虐待を、ときには何年も重ねて女性を死に至らせる犯罪に、男ばかりの立法府と男ばかりの法廷がつけている値が、数字で分かるでしょう。われわれに恥じる心がひとかけらでもあれば、頭を垂れずにはいられない数字でしょう。〔歓声〕
  translation_status: reviewed
- id: mill-026
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '13'
    printed_page_end: '13'
    pdf_page: 13
    source_sequence: 29
  source_text: Sir, before it is contended that women do not suffer in their interests, especially as women, by not being represented, it must be considered whether women, as women, have no grievances—whether the law, and those practices which law can reach, treat women in every respect as favorably as men. Well, sir, is that the case? As to education, for example, we continually hear it said that the education of mothers is the most important part of the education of the country, because they educate the men. Is as much importance really attached to it? Are there many fathers who care as much, or are willing to expend as much, for the good education of their daughters as of their sons? Where are the universities, where the public schools, where the schools of any high description for them? [Hear.]
  translation_ja: 委員長、代表を持たないことで女性が、とりわけ女性であるがゆえに、何の不利益も受けていないと主張する前に、問わなければならないことがあります。女性には女性として訴えるべき不当な扱いが本当にないのでしょうか。法律は、そして法律の手の届く範囲にある慣行は、すべての点で女性を男性と同じように厚遇しているのでしょうか。委員長、現にそうでしょうか。たとえば教育です。母親が男性を育てるのだから、母親を教育することこそ国の教育の最も重要な部分だと、絶えず聞かされます。それほど大事にされているのが実情でしょうか。娘によい教育を施すために、息子の場合と同じくらい心を砕き、同じだけのお金を出そうという父親が、大勢いるでしょうか。娘たちのための大学が、パブリックスクールが、それにどんな種類であれ水準の高い学校が、いったいどこにありますか。〔そうだ〕
  translation_status: reviewed
- id: mill-027
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '13'
    printed_page_end: '13'
    pdf_page: 13
    source_sequence: 30
  source_text: If it is said that girls are best educated at home, where are the training schools for governesses? What has become of the endowments which the bounty of our forefathers established for the instruction, not of boys alone, but of boys and girls indiscriminately? I am informed by one of the highest authorities on the subject that, in the majority of the deeds of endowment, the provision was for education generally, and not especially for boys. One great endowment—Christ’s Hospital—was designated expressly for both. That establishment maintains and educates one thousand one hundred boys, and exactly twenty-six girls.
  translation_ja: 少女の教育には家庭がいちばんだと言うなら、女性の家庭教師を養成する学校はどこにありますか。われわれの先祖が惜しみなく財産を寄せ、男子だけでなく男女を区別せず教育するために設けた基金は、どうなったのでしょう。この分野に最も詳しい方の一人から聞いたところでは、寄付証書の大多数は教育一般のためと定めており、男子のためと特定してはいないそうです。大きな寄付でつくられた学校の一つ、クライスツ・ホスピタルは、男女両方のためと明記されていました。この学校で生活を支えられ、教育を受けているのは、男子が千百人、女子はきっかり二十六人です。
  translation_status: reviewed
- id: mill-028
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '13'
    printed_page_end: '13'
    pdf_page: 13
    source_sequence: 31
  source_text: Then when they have attained womanhood, how does it fare with the large and increasing portion of the sex, who, though sprung from the educated classes, have not inherited a provision; and, not having obtained one by marriage, or disdaining to marry merely for a provision, depend on their exertions for support? Hardly any decent educated occupation, save one, is open to them. They are either governesses, or nothing.
  translation_ja: では大人になったあと、教育を受けた階層に生まれても、生活を支える財産は相続せず、結婚でその保障を得たわけでもない人たち、あるいは生活の保障だけのために結婚するのを潔しとせず、自分の働きで暮らす人たちはどうなるでしょう。こういう女性は多く、その割合は増す一方です。教育を生かしてまともに暮らせる職業で、彼女たちに門戸を開いているものは、一つを除いてほとんどありません。女性の家庭教師になるか、それがだめなら何もないのです。
  translation_status: reviewed
- id: mill-029
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '14'
    printed_page_end: '14'
    pdf_page: 14
    source_sequence: 32
  source_text: A fact has quite recently occurred which is worth commemorating. A young lady, Miss Garrett, from no pressure of necessity, but from an honorable desire to find scope for her activity in alleviating the sufferings of her fellow creatures, applied herself to the study of medicine. Having duly qualified herself, she, with an energy and perseverance which cannot be too highly praised, knocks successively at every one of the doors through which, in this country, a student can pass into medical practice. Having found every other door fast shut, she at last discovered one which had been accidentally left ajar. The Society of Apothecaries, it appears, had forgotten to shut out those whom they never thought would attempt to come in; and through that narrow entry this young lady obtained admission into the medical profession. But so objectionable did it appear to this learned body that women should be permitted to be the medical attendants, even of women, that the narrow wicket which Miss Garrett found open, has been closed after her, and no second Miss Garrett is to be suffered to pass through it. [Cheers.]
  translation_ja: ごく最近、記憶にとどめるに値する出来事がありました。ギャレットさんという若い女性が、必要に迫られたからでなく、人の苦しみを和らげることに自分の力の使い道を見つけたいという立派な志から、医学の勉強に打ち込みました。必要な力をきちんと身につけると、どれだけ褒めても足りないほどの気力と粘り強さで、この国で学生が医師としての診療に進むための扉を、一つずつ、残らずたたいて回りました。他の扉がことごとく固く閉ざされていた末に、とうとう偶然半開きになっていた扉を一つ見つけました。薬剤師協会は、まさか入ろうとするとは思ってもみなかった人たちを締め出すのを、うっかり忘れていたらしいのです。その狭い入り口から、この若い女性は医師の職に就くことを認められました。ところがこの学識ある団体は、女性が患者を、たとえ女性患者であっても診療できることを、はなはだよろしくないと考えたようで、ギャレットさんが開いているのを見つけた小さな門は、彼女が通ったあとで閉められました。二人目のギャレットさんが通ることは許さないというのです。〔歓声〕
  translation_status: reviewed
- id: mill-030
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '14'
    printed_page_end: '14'
    pdf_page: 14
    source_sequence: 33
  source_text: Sir, this is instar omnium. As soon as ever women become capable of successfully competing with men in any career, if it be lucrative and honorable, it is closed to them. A short time ago women could be associates of the Royal Academy; but they were so distinguishing themselves, they were taking so honorable a rank in their art, that this privilege, too, has been taken from them. That is the kind of care taken of women by the men who so faithfully represent them. [Cheers.] That is our treatment of unmarried women, and now about the married.
  translation_ja: 委員長、この一例はすべての例に匹敵します。どんな職業でも、女性が男性と競い合って成功できるようになった途端、それが実入りも名誉もある職業であれば、女性の前で扉が閉まるのです。少し前まで、女性は王立美術院の準会員になれました。ところが女性が大いに頭角を現し、芸術家としてあまりにも立派な地位を得るようになったので、この資格まで取り上げられました。これが、女性をあれほど忠実に代表しているという男性たちが、女性のためにしている世話なのです。〔歓声〕結婚していない女性へのわれわれの扱いは、以上のとおりです。次に、結婚している女性について申し上げます。
  translation_status: reviewed
  annotations:
  - side: source
    kind: emphasis
    span:
      start: 13
      end: 26
      exact: instar omnium
  - side: translation
    kind: emphasis
    span:
      start: 4
      end: 20
      exact: この一例はすべての例に匹敵します
- id: mill-031
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '14'
    printed_page_end: '15'
    pdf_page: 14
    source_sequence: 34
  source_text: They, it may be said, are not directly concerned in the amendment which I have moved, but it concerns many who have been married as well as others who will be so. By the common law of England, everything that a woman has belongs absolutely to her husband; he may tear it all away from her, may spend the last penny of it in debauchery, leaving her to maintain by her labor both herself and her children; and if, by heroic exertion, she earns enough to put by anything for their future support, unless she is judicially separated from him, he can pounce upon her savings and leave her penniless; and such cases are of very common occurrence. If we were besotted enough to think such things right, there would be more excuse for us; but we know better. The richer classes have found a way of exempting their own daughters from this iniquitous state of the law. By the contrivance of marriage settlements, they can make in each case a private law for themselves, and they always do. Why do we not provide that justice for the daughters of the poor which we take good care shall be done to our own daughters? Why is not what is done in every particular case that we personally care for made the general law of the land?—that a poor man’s child, whose parents could not afford the expense of a settlement, may be able to retain any little property which may devolve on her, and may have a voice in the disposal of her own earnings, often the best and only reliable part of the sustenance of the family? [Hear.] I am sometimes asked what practical grievance I propose to remedy by enabling women to vote. I propose, for one thing, to remedy this. I have given these few instances to prove that women are not the petted favorites of society which some people seem to imagine; that they have not that abundance, that superfluity of influence, which is ascribed to them, and are not sufficiently represented by the representation of those who have never cared to do in their behalf so obvious an act of justice. Sir, grievances of less magnitude than the laws of the property of married women, when affecting persons and classes less inured to passive endurance, have provoked revolutions.
  translation_ja: 既婚女性は私の提出した修正案とは直接関係がない、と言われるかもしれません。しかしこの案は、かつて結婚していた大勢の女性にも、これから結婚する女性にも関わります。イングランドのコモン・ローでは、妻の持ち物は何もかもまるごと夫のものです。夫はそれをことごとく取り上げ、最後の一ペニーまで放蕩につぎ込み、妻自身と子どもの暮らしは妻の働きに任せてしまえます。妻が並々ならぬ努力で稼ぎ、将来の生活のためにいくらか蓄えることができても、裁判所が夫との別居を認めていないかぎり、夫はその蓄えに飛びつき、妻を一文無しにしてしまえます。こうしたことは、決して珍しくありません。もしわれわれが、これを正しいと思えるほど愚かなら、まだ言い訳も立つでしょう。しかし正しくないことは知っています。裕福な階層は、この不法も同然の法律のあり方から自分たちの娘だけを救う方法を見つけました。婚姻時の財産取り決めという工夫を使えば、一件ごとに自分たち専用の法律を作れるわけで、彼らはいつもそうしています。自分たちの娘には必ず保障されるよう念を入れている公正な扱いを、なぜ貧しい人の娘には用意しないのでしょう。自分が気にかける個々の場合には必ずしていることを、なぜこの国全体に通じる法律にしないのでしょう。そうすれば、両親には財産取り決めの費用を出す余裕のなかった家庭の娘にも、たまたま自分に渡ってきたわずかな財産を持ち続け、自分の稼ぎの使い道に発言することができます。その稼ぎこそ、一家の生活費のうち、いちばん頼りになり、しばしば唯一当てにできる部分なのです。〔そうだ〕女性に投票を認めて、具体的にどんな不当な扱いを正すつもりなのか、と私はときどき尋ねられます。まずこれを正すつもりです。いくつか例を出したのは、女性は、ある人々が想像しているように社会に甘やかされるお気に入りではなく、あり余るほどだと評される影響力など持ってはいないことをお示しするためです。これほど明白な正義を女性のために実現しようともしてこなかった人々が代表されているからといって、女性が十分に代表されていることにはなりません。委員長、既婚女性の財産をめぐる法律よりも小さな不正でも、黙って耐えることにこれほど慣らされていない人々や階級に降りかかったときには、革命を引き起こしているのです。
  translation_status: reviewed

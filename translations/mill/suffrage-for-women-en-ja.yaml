  source_text: The occupations of most women are, and are likely to remain, principally domestic; but the idea that those occupations are incompatible with taking an interest in national affairs, or in any of the great concerns of humanity, is as futile as the terror once sincerely entertained, lest artisans should desert the work-shop and the factory if they were taught to read.
  translation_ja: 大半の女性の仕事は主に家庭にあり、これからもおそらくそうでしょう。しかしその仕事が、国の事柄や人類にとって重大な問題に関心を持つことと両立しないという考えには、かつてまじめに抱かれていた、あの恐れほどの根拠しかありません。職人に読み方を教えたら、仕事場や工場を投げ出してしまう、という恐れです。
  translation_status: reviewed
- id: mill-011
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '5'
    printed_page_end: '6'
    pdf_page: 5
    source_sequence: 14
  source_text: I know there is an obscure feeling, a feeling which is ashamed to express itself openly, that women have no right to care about anything but how they may be the most useful and devoted servants of some man. But as I am convinced that there is not one member of this house whose conscience accuses him of any such mean feeling, I may say that the claim to confiscate the whole existence of half the human species for the convenience of the other half, seems to me, independently of its injustice, particularly silly. For who that has had ordinary experience of human life, and ordinary capacity for profiting by that experience, fancies that those do their own business best who understand nothing else? A man has lived to little purpose who has not learned that without general mental cultivation no particular work that requires understanding can be done in the best manner. It requires brains to use practical experience; and brains, even without practical experience, go further than any amount of practical experience without brains.
  translation_ja: 口に出すのはさすがに恥ずかしい、漠然とした思いがあるのは知っています。女性には、どうしたらある男性にとっていちばん役に立つ、献身的な召使になれるか、それ以外のことを気にかける権利などない、というのです。しかしこの議場には、そんな卑しい思いに良心がとがめる議員など一人もいないと信じますので、申し上げます。人類の半分に都合がよいというだけで、残り半分の生涯をそっくり取り上げてよいとする主張は、不公正だという以前に、ずいぶん愚かな話です。人並みに人生を経験し、そこから人並みに学べる人で、ほかの何一つ分からない人こそ自分の仕事をいちばんよくこなす、と思う人がいるでしょうか。幅広く知性を養わずに、理解力を要する個々の仕事を最善の仕方でこなすことはできない。これを学ばなかった人は、何のために生きてきたのでしょう。実地の経験を生かすには頭が要ります。頭が働けば、実地の経験がなくても、いくら経験があっても頭を働かせない人より、先へ進めるのです。
  translation_status: reviewed
- id: mill-012
  section_id: speech
  kind: paragraph
  origin: source

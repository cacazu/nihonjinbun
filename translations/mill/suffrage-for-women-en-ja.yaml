    pdf_page: 15
    source_sequence: 35
  source_text: 'We ought not to take advantage of the security which we feel against any such danger in the present case to refuse to a limited class of women that small amount of participation in the enactment and the improvement of our laws which this motion solicits for them, and which would enable the general feelings of women to be heard in this house through a few male representatives. We ought not to deny to them what we are going to accord to everybody else: a right to be consulted; the common chance of placing in the great council of the nation a few organs of their sentiments; of having what every petty trade or profession has—a few members of the legislature, with a special call to stand up for their interests, and direct attention to the mode in which those interests are affected, by the law or by any changes in it. No more is asked by this motion; and when the time comes, as it is certain to come, when this will be conceded, I feel the firmest conviction that you will never repent of the concession. I move, sir, that the word “man” be omitted, and the word “person” inserted in its place. [Cheers, cheers.]'
  translation_ja: 今回はそんな危険がなく安心だからといって、限られた範囲の女性に、わが国の法律をつくり、改める仕事へのささやかな参加を拒んではなりません。この動議が女性のために求めるのはそれだけです。それがあれば、何人かの男性の代表を通じ、女性たちの広く抱く思いをこの議場に届けることができます。ほかのすべての人に今まさに認めようとしているものを、女性にだけ拒んではなりません。意見を聴いてもらう権利。国の最高の会議に自分たちの思いを語ってくれる人を何人か送り出す、誰にも等しくある機会。どんな小さな商売や職業の仲間にもあるのと同じように、自分たちの利益を守って立ち、法律や法改正がその利益にいかなる影響を及ぼすかに注意を促すことを、とりわけ自分の任務とする議員を何人か持つことです。この動議はそれ以上を求めません。そしてそれが認められる日が来たなら、必ずその日が来ますが、皆さんがその決断を後悔することは決してないと、私は固く信じています。委員長、条文から「男（man）」という語を削り、代わりに「人（person）」を入れることを動議として提出します。〔歓声が重なる〕
  translation_status: reviewed

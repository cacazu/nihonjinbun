    printed_page_end: '6'
    pdf_page: 6
    source_sequence: 15
  source_text: But perhaps it is thought that the ordinary occupations of women are more antagonistic than men’s occupations are to any comprehension of public affairs. Perhaps it is thought that those who are principally charged with the moral education of the future generations of men must be quite unfit to judge of the moral and educational interest of a community; or that those whose chief daily business is the judicious laying out of money so as to produce the greatest results with the smallest means, could not give any lessons to right honorable gentlemen on that side of the house, or on this, who produce such singularly small results with such vast means. [Laughter.]
  translation_ja: ひょっとすると、女性の日常の仕事は、男性の日常の仕事以上に、公の事柄を理解する妨げになるとお考えでしょうか。次の時代の人々を道徳の面で育てる責任を主に負っている人たちは、社会の道徳や教育のために何がよいかを判断するのには、まったく向いていないというのでしょうか。あるいは、毎日のおもな仕事が、わずかな元手でできるかぎりの成果を上げるよう、よく考えてお金を使うことにある人は、議場のあちら側、あるいはこちら側にお座りの、あれほど莫大な元手であれほど見事にわずかな成果しか上げておられない方々には、何一つ教えられないとでもお考えでしょうか。〔笑い〕
  translation_status: reviewed
- id: mill-013
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '6'
    printed_page_end: '7'
    pdf_page: 6
    source_sequence: 16
  source_text: 'I feel a degree of confidence, sir, on this subject, which I could not feel if the political change, in itself not a great or formidable one, for which I contend, were not grounded, as beneficent and salutary political changes usually are, upon a previous social change. The idea of a peremptory and absolute line of separation between men’s province of thought and women’s—the notion of forbidding women to take interest in what interests men—belongs to a gone-by state of society which is receding farther and farther into the past. We think and talk about the political revolutions of the world, but we do not pay sufficient attention to the fact that there has taken place among us a silent domestic revolution: women and men are, for the first time in history, really companions. Our traditions about the proper relations between them have descended to us from a time when their lives were apart—when they were separate in their thoughts because they were separate both in their amusements and in their serious occupations. The man spent his hours of leisure among men: all his friendships, all his real intimacies were with men: with men alone did he converse on any serious subject: the wife was either a plaything or an upper servant. All this among the educated classes is changed: men no longer give up their spare time to violent out-door exercise and boisterous conviviality with male associates: the home has acquired the ascendency; the two sexes now really pass their lives together: the women of the family are the man’s habitual society: the wife is his chief associate, his most confidential friend, and often his most trusted counsellor. [Cheers.]'
  translation_ja: 委員長、私がこの問題についてかなりの自信を持てるのには、理由があります。私の求めている政治上の変更は、それ自体は大がかりでも恐ろしいものでもありません。それが、人のためになる健全な政治の改革の通例どおり、すでに社会に起きた変化に根ざしていなかったら、これほどの自信は持てませんでした。男性が考える領域と女性が考える領域のあいだに、問答無用の絶対の一線を引く。男性が関心を持つことに女性が関心を持つのを禁じる。そんな考えは、遠い過去へと退きつつある、すでに去った時代の社会のものです。われわれは世界の政治革命を考え、語りますが、自分たちの家庭に静かな革命が起きた事実には、十分に目を向けていません。歴史上初めて、女性と男性がほんとうの伴侶になったのです。男女はいかなる関係にあるべきかについての伝統は、男女が別々に暮らした時代から伝わっています。楽しみも大事な仕事も別々だったから、考えることも別々だったのです。男は余暇を男同士で過ごし、友人も、心の通い合う相手もすべて男でした。まじめな話をするのは男同士だけで、妻は男の玩具か、さもなければ上級の召使でした。教育を受けた階層では、すべて事情が変わりました。男たちはもはや余暇をもっぱら激しい野外の運動や男性仲間との騒がしい酒宴に費やさず、家庭の比重が大きくなりました。今では男女が実際に生活を共にし、家族の女性たちは男性にとっていつもの話し相手です。妻こそいちばん身近な仲間であり、何でも打ち明けられる友であり、しばしば最も頼りになる相談相手なのです。〔歓声〕
  translation_status: reviewed
- id: mill-014
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '7'
    printed_page_end: '7'
    pdf_page: 7
    source_sequence: 17
  source_text: Now, does any man wish to have for his nearest companion, linked so closely with himself, and whose wishes and preferences have so strong a claim upon him, one whose thoughts are alien from those which occupy his own mind—one who can give neither help nor comfort nor support to his noblest feelings and purposes? [Hear, hear.] Is this close and almost exclusive companionship compatible with women being warned off all large subjects—taught that they ought not to care about what it is the man’s duty to care for, and that to take part in any serious interests outside the household is stepping beyond their province? Is it good for a man to pass his life in close communion of thought and feeling with a person studiously kept inferior to himself, whose earthly interests are forcibly confined within four walls, who is taught to cultivate as a grace of character ignorance and indifference about the most inspiring subjects, those among which his highest duties are cast? [Hear, hear.] Does any one suppose that this can happen without detriment to the man’s own character?
  translation_ja: では、自分とこれほど固く結ばれ、その願いや好みを当然にも尊重しなければならない、最も身近な伴侶として、どんな男性が次のような人を望むでしょうか。自分が心を砕くことには縁がなく、いちばん尊い気持ちを抱き目標を追うときに、助けも慰めも支えも与えられない人です。〔そうだ、そうだ〕これほど親密で、実際ほかの誰よりも長く一緒にいる関係と、女性にはどんな大きな問題にも近づくなと申し渡すこととが、両立するでしょうか。男が義務として気にかけることを、女は気にかけてはならない、家庭の外の重大事に加わるのは出すぎたまねだと教えておいて、です。わざわざ自分より低いところにとどめ置かれ、この世で関心を持ってよい事柄を四方の壁の中に押し込められた人。その男性自身の最も高い義務がそこにある、最も心を奮い立たせる問題について、何も知らず、関心も持たないことが人柄の美しさだと教えられた人。一生をそうした相手と親しく考えや思いを通わせて過ごすことが、男性にとってよいことでしょうか。〔そうだ、そうだ〕そうして男性自身の人柄が損なわれずに済むと思う人がいるでしょうか。
  translation_status: reviewed
- id: mill-015
  section_id: speech
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: aea1867
    precision: page
    printed_page: '7'
    printed_page_end: '8'
    pdf_page: 7
    source_sequence: 18
  source_text: Sir, the time has come when, if women are not raised to the level of men, men will be pulled down to theirs. [A laugh.] The women of a man’s family are either a stimulus and a support to his higher aspirations, or a drag upon them. You may keep them ignorant of politics, but you cannot keep them from concerning themselves with the least respectable part of politics—its personalities. If they do not understand, and cannot enter into the man’s feelings of public duty, they do care about his private interests, and that is the scale into which their weight is certain to be thrown. They are an influence always at hand, co-operating with his selfish promptings, watching and taking advantage of every moment of moral irresolution, and doubling the strength of every temptation. Even if they maintain a modest neutrality, their mere absence of sympathy hangs a dead weight upon his moral energies, and makes him averse to incur sacrifices which they will feel, and to forego worldly successes and advantages in which they would share, for the sake of objects which they cannot appreciate. But suppose him to be happily preserved from temptation to an actual sacrifice of conscience, the insensible influence on the higher parts of his own nature is still deplorable. Under an idle notion that the beauties of character of the two sexes are mutually incompatible, men are afraid of manly women [a laugh]; but those who have reflected on the nature and power of social influences, know that, when there are not manly women, there will not much longer be manly men. [Laughter.] When men and women are really companions, if women are frivolous, men will be frivolous; if women care only for personal interests and trifling amusements, men in general will care for little else. The two sexes must now rise or sink together.
  translation_ja: 委員長、女性を男性と同じ高さに引き上げなければ、男性のほうが女性の置かれた高さまで引き下ろされる。今はもうそういう時代です。〔笑い声〕家族の女性たちは、男性の高い志を励まし、支えるか、その足を引っ張るか、どちらかです。政治のことを知らせずにおくことはできても、政治の最も感心できない側面、つまり誰と誰がどうだという個人的な話に関わるのを止めることはできません。男性の公に尽くそうとする気持ちが分からず、共感できないとしても、その人個人の損得ならわがこととして気にかけます。彼女たちの重みが天秤のどちらにかかるかは明らかです。その影響はいつもすぐそばにあって、本人の利己心に加勢し、良心がぐらつく一瞬一瞬を見逃さず、あらゆる誘惑の力を二倍にします。たとえ慎ましく中立を守っても、共感が得られないだけで、その人が正しいことをしようとする力に重りがかかります。家族には価値の分からない目的のために、家族にも痛みが及ぶ犠牲を引き受けたり、家族もあずかるはずの世間的な成功や利益を手放したりするのが嫌になるのです。運よく、実際に良心を売り渡す誘惑までは免れたとしても、その人間性のより高貴な部分に知らぬまに及ぶ影響は、なお嘆かわしいものです。男女それぞれの美徳は両立しないというたわいもない思い込みから、男たちは男まさりの女性を恐れます〔笑い声〕。しかし社会が人に及ぼす影響の性質と強さを考えた人なら、男まさりの女性がいなくなれば、ほどなく男らしい男もいなくなると知っています。〔笑い〕男女がほんとうに伴侶となれば、女性が浮ついていれば男性も浮つきます。女性が自分の利害とつまらない気晴らしにしか関心を持たなければ、男性もたいてい、それ以外のことをほとんど気にかけなくなるでしょう。今や男女は、上がるなら一緒に上がり、沈むなら一緒に沈むのです。
  translation_status: reviewed
- id: mill-016
  section_id: speech

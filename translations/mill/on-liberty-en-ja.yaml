    source_sequence: 116
  source_text: I cannot refrain from adding to these examples of the little account commonly made of human liberty, the language of downright persecution which breaks out from the press of this country, whenever it feels called on to notice the remarkable phenomenon of Mormonism. Much might be said on the unexpected and instructive fact, that an alleged new revelation, and a religion founded on it, the product of palpable imposture, not even supported by the prestige of extraordinary qualities in its founder, is believed by hundreds of thousands, and has been made the foundation of a society, in the age of newspapers, railways, and the electric telegraph. What here concerns us is, that this religion, like other and better religions, has its martyrs; that its prophet and founder was, for his teaching, put to death by a mob; that others of its adherents lost their lives by the same lawless violence; that they were forcibly expelled, in a body, from the country in which they first grew up; while, now that they have been chased into a solitary recess in the midst of a desert, many in this country openly declare that it would be right (only that it is not convenient) to send an expedition against them, and compel them by force to conform to the opinions of other people. The article of the Mormonite doctrine which is the chief provocative to the antipathy which thus breaks through the ordinary restraints of religious tolerance, is its sanction of polygamy; which, though permitted to Mahomedans, and Hindoos, and Chinese, seems to excite unquenchable animosity when practised by persons who speak English, and profess to be a kind of Christians. No one has a deeper disapprobation than I have of this Mormon institution; both for other reasons, and because, far from being in any way countenanced by the principle of liberty, it is a direct infraction of that principle, being a mere riveting of the chains of one half of the community, and an emancipation of the other from reciprocity of obligation towards them. Still, it must be remembered that this relation is as much voluntary on the part of the women concerned in it, and who may be deemed the sufferers by it, as is the case with any other form of the marriage institution; and however surprising this fact may appear, it has its explanation in the common ideas and customs of the world, which teaching women to think marriage
    the one thing needful, make it intelligible that many a woman should prefer being one of several wives, to not being a wife at all. Other countries are not asked to recognise such unions, or release any portion of their inhabitants from their own laws on the score of Mormonite opinions. But when the dissentients have conceded to the hostile sentiments of others, far more than could justly be demanded; when they have left the countries to which their doctrines were unacceptable, and established themselves in a remote corner of the earth, which they have been the first to render habitable to human beings; it is difficult to see on what principles but those of tyranny they can be prevented from living there under what laws they please, provided they commit no aggression on other nations, and allow perfect freedom of departure to those who are dissatisfied with their ways. A recent writer, in some respects of considerable merit, proposes (to use his own words), not a crusade, but a civilizade, against this polygamous community, to put an end to what seems to him a retrograde step in civilisation. It also appears so to me, but I am not aware that any community has a right to force another to be civilised. So long as the sufferers by the bad law do not invoke assistance from other communities, I cannot admit that persons entirely unconnected with them ought to step in and require that a condition of things with which all who are directly interested appear to be satisfied, should be put an end to because it is a scandal to persons some thousands of miles distant, who have no part or concern in it. Let them send missionaries, if they please, to preach against it; and let them, by any fair means (of which silencing the teachers is not one), oppose the progress of similar doctrines among their own people. If civilisation has got the better of barbarism when barbarism had the world to itself, it is too much to profess to be afraid lest barbarism, after having been fairly got under, should revive and conquer civilisation. A civilisation that can thus succumb to its vanquished enemy, must first have become so degenerate, that neither its appointed priests and teachers, nor anybody else, has the capacity, or will take the trouble, to stand up for it. If this be so, the sooner such a civilisation receives notice to quit, the better. It can only go on from bad to worse, until
    destroyed and regenerated (like the Western Empire) by energetic barbarians.
  translation_ja: 人間の自由がふつういかに軽く扱われるかを示すこれらの例に、もう一つ加えずにはいられない。モルモン教という注目すべき現象を取り上げなければと思うたび、この国の新聞から噴き出す、あからさまに迫害を求める言葉だ。新聞と鉄道と電信の時代に、新しい啓示と称するものと、それを土台にした宗教が、明白なまやかしの産物であり、開祖に並外れた資質があるという威光にすら支えられていないにもかかわらず、何十万もの人に信じられ、一つの社会の土台となった。この意外な、教えられるところの多い事実について、多くを語れるだろう。ここで私たちに関わるのは、この宗教にも、ほかのもっとよい宗教と同じように殉教者がいることだ。預言者であり開祖である者は教えのために群衆に殺され、ほかの信奉者にもいく人か、同じ無法な暴力によって命を失った者がいる。最初に数を増やした土地から、みながひとまとめに、力ずくで追い出された。今では砂漠の中の人里離れた一角に追いやられているのに、この国の多くの人々は、遠征隊を送り、ほかの人の意見に力で従わせるのが正しい、都合が悪いだけだと、公然と言う。ふつうの宗教的寛容の歯止めを押し破るほどの反感を主に引き起こすのは、モルモン教が一夫多妻を認めていることだ。イスラム教徒、ヒンドゥー教徒、中国人には許されるのに、英語を話し、一種のキリスト教徒を名乗る人々が行うと、消しがたい敵意をそそるらしい。このモルモン教の制度を、私ほど強く非難する人はいない。理由はほかにもあるが、自由の原理に認められるどころか、直接その原理を侵すからである。共同体の半分を縛りつける鎖をいっそう固くし、もう半分を相手に対する互いの義務から解放するだけである。それでも、この関係は、そこに関わり、その犠牲になると思われる女性たちにとって、ほかのどんな婚姻制度の場合にも劣らず、自らの意志によることを忘れてはならない。どれほど意外に見えても、世間の普通の考えや慣習に照らせば、説明がつく。結婚だけが欠かせないと女性に教えるから、妻にならないくらいなら、何人かいる妻の一人になるほうを望む女性が多いのである。ほかの国々は、このような結婚を認めるようにとも、モルモン教の意見を理由に一部の住民をその国の法から免除するようにとも、求められていない。だが、異を唱える人々が、敵意を抱く他人に対して、筋の通る要求の範囲をはるかに越えて譲歩した以上、教えが受け入れられなかった国を去り、自分たちが初めて人間の住める場所にした地上の遠い一角に落ち着いたとき、専制の原理以外の何に基づいて、彼らが望む法律のもとでその地に住むのを妨げられるか、分かりにくい。他国に攻撃を加えず、彼らのやり方に不満な人に、離れる完全な自由を認めることが条件である。近ごろのある著述家で、幾つかの点では相当の長所を持つ人が、文明の後退と見えるものを終わらせるため、この一夫多妻の共同体に対して、本人の言葉を使えば、十字軍ではなく「文明軍」を提案している。私にも後退に見えるが、ある共同体が別の共同体に対し、文明化するよう強いる権利を持つとは知らない。悪い法律で苦しむ人々がほかの共同体に助けを求めていないかぎり、何の関わりもない者が割って入り、じかに関係する人々はみな満足しているように見える状態を、数千マイル離れ、何の関わりも利害も持たない人々にとって忌まわしいからというだけで、終わらせるよう求めるべきだとは思わない。よければ宣教師を送り、反対を説けばよい。また自分の国民に似た教えが広がるのを、公正な手段ならどれを使ってでも、防げばよい。教える人を黙らせるのは、その一つではない。世の中を野蛮が独占していたときに文明が野蛮に勝ったなら、十分に抑えられたあとで野蛮が復活し、文明を征服するのを恐れるとは、あまりに行きすぎである。こうして一度打ち破った敵に負けうる文明は、任命された聖職者や教師にも、ほかの誰にも、守る力がなく、守るために骨を折ろうともしないところまで、まず堕落しているはずだ。それならそのような文明は、早く退去を言い渡されるほどよい。西ローマ帝国のように、活力ある野蛮な人々に滅ぼされ、つくり直されるまで、悪いところからさらに悪いところへ行くほかない。

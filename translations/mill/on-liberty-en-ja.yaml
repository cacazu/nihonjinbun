    printed_page_end: '119'
    source_sequence: 81
  source_text: It is not by wearing down into uniformity all that is individual in themselves, but by cultivating it and calling it forth, within the limits imposed by the rights and interests of others, that human beings become a noble and beautiful object of contemplation; and as the works partake the character of those who do them, by the same process human life also becomes rich, diversified, and animating, furnishing more abundant aliment to high thoughts and elevating feelings, and strengthening the tie which binds every individual to the race, by making the race infinitely better worth belonging to. In proportion to the development of his individuality, each person becomes more valuable to himself, and is therefore capable of being more valuable to others. There is a greater fulness of life about his own existence, and when there is more life in the units there is more in the mass which is composed of them. As much compression as is necessary to prevent the stronger specimens of human nature from encroaching on the rights of others, cannot be dispensed with; but for this there is ample compensation even in the point of view of human development. The means of development which the individual loses by being prevented from gratifying his inclinations to the injury of others, are chiefly obtained at the expense of the development of other people. And even to himself there is a full equivalent in the better development of the social part of his nature, rendered possible by the restraint put upon the selfish part. To be held to rigid rules of justice for the sake of others, develops the feelings and capacities which have the good of others for their object. But to be restrained in things not affecting their good, by their mere displeasure, develops nothing valuable, except such force of character as may unfold itself in resisting the restraint. If acquiesced in, it dulls and blunts the whole nature. To give any fair-play to the nature of each, it is essential that different persons should be allowed to lead different lives. In proportion as this latitude has been exercised in any age, has that age been noteworthy to posterity. Even despotism does not produce its worst effects, so long as Individuality exists under it; and whatever crushes individuality is despotism, by whatever name it may be called, and whether it professes to be enforcing the will of God or
    the injunctions of men.
  translation_ja: 人が眺めるに値する気高く美しい存在になるのは、自分のうち個性的なものをすべてすり減らして同じ形にすることによってではない。他人の権利と利益が課す限界の内側で、それを育て、それを表に引き出すことによってである。人の仕事も、それをする人の性格を帯びるから、同じ過程をたどって、人間の暮らしそのものも豊かで多様な、生気を与えるものとなる。高い思想と人を高める感情を、よりたっぷりと養い、人類に属することの値うちをはかりしれないほど高めて、個人を人類に結ぶ絆を強める。個性が発達するのに応じて、一人ひとりは自分にとってより価値があり、それだけ他人にとってもより価値のある人になれる。その人自身の生もいっそう充実し、一人ひとりに生気が増せば、それでできている全体にも、生気は増す。人間のうち力の強い者が、他人の権利を侵さないようにするのに必要なだけは、抑えることを免れない。だが人間の発達という点から見ても、それは十分に償われる。他人を害して自分の好みを満たせないため、個人が失う成長の機会は、主に他人の発達を犠牲にして得られるものだからだ。本人にしても、利己的な部分を抑えることで、本性の社会的な部分をいっそうよく発達させられるという、十分な埋め合わせがある。他人のために正義の厳格な規則に従うよう求められれば、他人のためを思う感情と能力が育つ。だが他人の利益に関係しないことを、ただ他人が気に入らないから抑えられても、抑えに抗うなかで育つかもしれない性格の力を除いて、価値のあるものは何も育たない。甘んじていれば、本性のすべてが鈍り、切れ味を失う。一人ひとりの本性に何ほどかでも力をふるわせるには、違う人が違う暮らしを営むのを許すことが必要である。その自由が使われた程度に応じて、どんな時代でも後世の注目に値してきた。専制でさえ、そのもとで個性が生きているかぎり、最悪の結果をもたらさない。どんな名で呼ばれようと、神の意志を行わせると称しようと、人の命令を行わせると称しようと、個性を押しつぶすものは、ことごとく専制である。

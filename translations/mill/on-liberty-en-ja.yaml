    precision: page
    printed_page: '12'
    printed_page_end: '15'
    source_sequence: 11
  source_text: 'The likings and dislikings of society, or of some powerful portion of it, are thus the main thing which has practically determined the rules laid down for general observance, under the penalties of law or opinion. And in general, those who have been in advance of society in thought and feeling have left this condition of things unassailed in principle, however they may have come into conflict with it in some of its details. They have occupied themselves rather in inquiring what things society ought to like or dislike, than in questioning whether its likings or dislikings should be a law to individuals. They preferred endeavouring to alter the feelings of mankind on the particular points on which they were themselves heretical, rather than make common cause in defence of freedom, with heretics generally. The only case in which the higher ground has been taken on principle and maintained with consistency, by any but an individual here and there, is that of religious belief: a case instructive in many ways, and not least so as forming a most striking instance of the fallibility of what is called the moral sense: for the odium theologicum, in a sincere bigot, is one of the most unequivocal cases of moral feeling. Those who first broke the yoke of what called itself the Universal Church, were in general as little willing to permit difference of religious opinion as that church itself. But when the heat of the conflict was over, without giving a complete victory to any party, and each church or sect was reduced to limit its hopes to retaining possession of the ground it already occupied; minorities, seeing that they had no chance of becoming majorities, were under the necessity of pleading to those whom they could not convert, for permission to differ. It is accordingly on this battle-field, almost solely, that the rights of the individual against society have been asserted on broad grounds of principle, and the claim of society to exercise authority over dissentients, openly controverted. The great writers to whom the world owes what religious liberty it possesses, have mostly asserted freedom of conscience as an indefeasible right, and denied absolutely that a human being is accountable to others for his religious belief. Yet so natural to mankind is intolerance in whatever they really care about, that religious freedom has hardly anywhere been practically
    realised, except where religious indifference, which dislikes to have its peace disturbed by theological quarrels, has added its weight to the scale. In the minds of almost all religious persons, even in the most tolerant countries, the duty of toleration is admitted with tacit reserves. One person will bear with dissent in matters of church government, but not of dogma; another can tolerate everybody, short of a Papist or a Unitarian; another, every one who believes in revealed religion; a few extend their charity a little further, but stop at the belief in a God and in a future state. Wherever the sentiment of the majority is still genuine and intense, it is found to have abated little of its claim to be obeyed.'
  translation_ja: このように、法の罰や世間の制裁を伴う、誰もが守るべき規則を実際に何にするかを、主に決めてきたのは社会、あるいは社会のうち力を持つ一部分の好き嫌いである。考え方や感性において世間より先を行く人々も、たいていは、個々のところで対立することはあっても、この状態を原理から問い直しはしなかった。世間の好き嫌いが個人にとって法律になってよいのかと問うよりも、世間は何を好み、何を嫌うべきかを考えてきた。異端者全体と力を合わせて自由を守るより、自分が異端とされた特定の点についての世間の気持ちを変えようとするほうを選んだ。例外的な個人を別とすれば、もっと高い原理を掲げ、それを一貫して守り抜いた例は、ただ一つ、宗教上の信仰である。これはさまざまな点で教えられるところが多い。なかでも、いわゆる道徳感覚がいかに誤りうるかの、これほど目を引く実例はない。というのも、心底からの狭量な信仰者が抱く宗教上の憎悪ほど、まぎれもない道徳感情の例はないからだ。普遍の教会を名乗ったものの軛を最初に打ち破った人々も、たいてい、その教会に劣らず、宗教上の異論を認めたがらなかった。だがどの陣営も完全な勝利を得られず、争いの熱が冷め、どの教会も宗派も今ある陣地を保つこと以上は望めなくなると、少数派は、自分たちが多数派になれないと悟って、改宗させられなかった相手に、違う信仰を持つことを許してくれ、と頼むほかなくなった。そのため、広い原理に立って社会に対する個人の権利が主張され、異を唱える者に権威をふるうという社会の要求に公然と異議が申し立てられたのは、ほとんどこの戦場だけだった。世界が今日持っている宗教の自由をもたらした偉大な著述家たちは、おおむね、良心の自由は奪うことのできない権利であり、人は自分の信仰について他人にいかなる責任も負わないと、はっきり主張した。だが心底から大切にしているものについて不寛容になるのは人間にあまりに自然なことだから、神学上の争いに平穏を乱されたくないという宗教への無関心が味方についたところを除けば、宗教の自由が実現したところはほとんどない。最も寛容な国でも、ほぼすべての信仰者は、寛容である義務を認めながら、口に出さない留保をつけている。教会の運営に関する異論には耐えられても、教義の異論には耐えられない人がいる。カトリック教徒かユニテリアンでなければ誰でもよいという人もいる。神の啓示による宗教を信じる人なら誰でもよいという人もいる。さらに少し寛容な人もいるが、それでも神と来世の存在を信じない人までは受け入れない。多数派の感情がまだ本物で強いところならどこでも、従えという要求は、ほとんど弱まっていないと分かる。
  translation_status: reviewed
- id: ol-01-008

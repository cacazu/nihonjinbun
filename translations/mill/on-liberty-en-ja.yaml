  source_text: CHAPTER III. OF INDIVIDUALITY, AS ONE OF THE ELEMENTS OF WELL-BEING.
  translation_ja: 第三章　幸福を成り立たせる一つの要素としての個性
  translation_status: reviewed
- id: ol-03-001
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '103'
    printed_page_end: '105'
    source_sequence: 73
  source_text: Such being the reasons which make it imperative that human beings should be free to form opinions, and to express their opinions without reserve; and such the baneful consequences to the intellectual, and through that to the moral nature of man, unless this liberty is either conceded, or asserted in spite of prohibition; let us next examine whether the same reasons do not require that men should be free to act upon their opinions—to carry these out in their lives, without hindrance, either physical or moral, from their fellow-men, so long as it is at their own risk and peril. This last proviso is of course indispensable. No one pretends that actions should be as free as opinions. On the contrary, even opinions lose their immunity, when the circumstances in which they are expressed are such as to constitute their expression a positive instigation to some mischievous act. An opinion that corn-dealers are starvers of the poor, or that private property is robbery, ought to be unmolested when simply circulated through the press, but may justly incur punishment when delivered orally to an excited mob assembled before the house of a corn-dealer, or when handed about among the same mob in the form of a placard. Acts, of whatever kind, which, without justifiable cause, do harm to others, may be, and in the more important cases absolutely require to be, controlled by the unfavourable sentiments, and, when needful, by the active interference of mankind. The liberty of the individual must be thus far limited; he must not make himself a nuisance to other people. But if he refrains from molesting others in what concerns them, and merely acts according to his own inclination and judgment in things which concern himself, the same reasons which show that opinion should be free, prove also that he should be allowed, without molestation, to carry his opinions into practice at his own cost. That mankind are not infallible; that their truths, for the most part, are only half-truths; that unity of opinion, unless resulting from the fullest and freest comparison of opposite opinions, is not desirable, and diversity not an evil, but a good, until mankind are much more capable than at present of recognising all sides of the truth, are principles applicable to men's modes of action, not less than to their opinions. As it is useful that while mankind are imperfect there should
    be different opinions, so is it that there should be different experiments of living; that free scope should be given to varieties of character, short of injury to others; and that the worth of different modes of life should be proved practically, when any one thinks fit to try them. It is desirable, in short, that in things which do not primarily concern others, individuality should assert itself. Where, not the person's own character, but the traditions or customs of other people are the rule of conduct, there is wanting one of the principal ingredients of human happiness, and quite the chief ingredient of individual and social progress.
  translation_ja: 人は意見を自由に形づくり、それを遠慮なく述べられなければならない。その理由と、この自由が認められず、禁じられてもあえて主張されることがなければ、人の知的な面が、ひいては道徳的な面が、どんな悪い結果をこうむるかは、すでに述べた。では同じ理由から、自分の意見に従って行動する自由も、つまり、自分で危険と結果を引き受けるかぎり、ほかの人の物理的な妨害や道徳的な圧力を受けずに、暮らしのなかで実行する自由も、必要ではないかと考えてみよう。むろん、最後の条件は欠かせない。行動が意見と同じくらい自由であるべきだとは、誰も言わない。反対に、意見でさえ、それを述べる状況からして、その言葉が有害な行為への明白な扇動となるなら、保護されなくなる。穀物商は貧しい人を飢えさせる者だとか、私有財産は盗みだとかいう意見も、出版物を通して広めるだけなら妨げてはならない。だが、穀物商の家の前に集まった興奮した群衆に、じかにそう語るか、同じ群衆にその言葉を書いた貼り紙を回すなら、処罰されても正当である。もっともな理由なく他人に害を与える行為は、どんな種類のものでも、人々の反感によって、必要なら実際の介入によって抑えてよい。重大な場合には、どうしても抑えなければならない。個人の自由には、ここまでの制約が必要である。他人にとって迷惑な存在になってはならない。だが他人に関わることでは煩わせず、自分に関わることだけを自分の好みと判断に従って行うのであれば、意見が自由であるべきことを示す理由と同じ理由が、妨げられずに、その結果を自分で引き受けて意見を実行に移すことを認められるべきだと証明する。人類は誤りを免れない。その真理はたいてい半分の真理でしかない。相反する意見を最も徹底して自由に突き合わせた結果でないなら、意見の一致は望ましくない。人類が今よりずっと真理のあらゆる面を認められるようになるまでは、多様さは害ではなく益である。これらの原則は、人の意見と同じく、人の行動の仕方にも当てはまる。人が不完全なあいだ、意見がいろいろに分かれるのが役立つのと同じように、生き方をいろいろに試みることも役立つ。他人に害を与えないかぎり、さまざまな人柄が自由に表れる場が必要であり、異なる生き方の値うちは、誰かが試してみようと思ったときに、実際に試されるべきである。要するに、主として本人に関わる事柄では、個性が表れるのが望ましい。本人の人柄ではなく、他人の伝統や慣習が行動を決めるところでは、人の幸福を成り立たせる主要な要素の一つ、そして個人と社会の進歩を成り立たせる何より重要な要素が失われている。
  translation_status: reviewed

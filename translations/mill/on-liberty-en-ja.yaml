    printed_page_end: '200'
    source_sequence: 130
  source_text: 'I have already observed that, owing to the absence of any recognised general principles, liberty is often granted where it should be withheld, as well as withheld where it should be granted; and one of the cases in which, in the modern European world, the sentiment of liberty is the strongest, is a case where, in my view, it is altogether misplaced. A person should be free to do as he likes in his own concerns; but he ought not to be free to do as he likes in acting for another, under the pretext that the affairs of another are his own affairs. The State, while it respects the liberty of each in what specially regards himself, is bound to maintain a vigilant control over his exercise of any power which it allows him to possess over others. This obligation is almost entirely disregarded in the case of the family relations, a case, in its direct influence on human happiness, more important than all others taken together. The almost despotic power of husbands over wives need not be enlarged upon here because nothing more is needed for the complete removal of the evil, than that wives should have the same rights, and should receive the protection of law in the same manner, as all other persons; and because, on this subject, the defenders of established injustice do not avail themselves of the plea of liberty, but stand forth openly as the champions of power. It is in the case of children, that misapplied notions of liberty are a real obstacle to the fulfilment by the State of its duties. One would almost think that a man''s children were supposed to be literally, and not metaphorically, a part of himself, so jealous is opinion of the smallest interference of law with his absolute and exclusive control over them; more jealous than of almost any interference with his own freedom of action: so much less do the generality of mankind value liberty than power. Consider, for example, the case of education. Is it not almost a self-evident axiom, that the State should require and compel the education, up to a certain standard, of every human being who is born its citizen? Yet who is there that is not afraid to recognise and assert this truth? Hardly any one indeed will deny that it is one of the most sacred duties of the parents (or, as law and usage now stand, the father), after summoning a human being into the world, to give to that being an education fitting
    him to perform his part well in life towards others and towards himself. But while this is unanimously declared to be the father''s duty, scarcely anybody, in this country, will bear to hear of obliging him to perform it. Instead of his being required to make any exertion or sacrifice for securing education to the child, it is left to his choice to accept it or not when it is provided gratis! It still remains unrecognised, that to bring a child into existence without a fair prospect of being able, not only to provide food for its body, but instruction and training for its mind, is a moral crime, both against the unfortunate offspring and against society; and that if the parent does not fulfil this obligation, the State ought to see it fulfilled, at the charge, as far as possible, of the parent.'
  translation_ja: 一般に認められた原理がないため、認めるべきところで自由が認められないだけでなく、認めるべきでないところでもしばしば認められると、すでに述べた。近代ヨーロッパで自由を求める気持ちが最も強く出る場合の一つは、私から見れば、その気持ちの向け先がまったく間違った場合である。自分の事柄では好きなようにする自由があるべきだ。だが他人の事柄が自分の事柄でもあるという口実で、その人に代わって好きなように振る舞う自由は、あるべきではない。国家は、一人ひとりについて、とくに本人自身に関わる事柄での自由を尊重する一方、他人に対する何かの権力をその人に認めるなら、その行使を油断なく監督する義務がある。家族の関係では、この義務はほとんど全面的に無視されている。幸福に直接与える影響からいえば、ほかのあらゆる場合を合わせたよりも重要な事例である。夫が妻に対して持つ、ほとんど専制的な権力については、ここで長く語る必要はない。妻がほかの誰とも同じ権利を持ち、同じように法律の保護を受ける以上に、この害を完全になくすのに必要なことはないからだ。それにこの問題では、古くからの不正を弁護する者は自由を口実とせず、公然と権力の擁護者として出てくる。自由を取り違えた考えが、国家が自らの務めを果たすうえで、現実の障害となるのは、子どもの場合だ。人の子どもは比喩でなく文字どおり本人の一部と考えられているのではないかと思うくらい、世間は、その人がもっぱら自分だけで子どもを思いどおりにすることに対し、法がほんの少し介入するのも警戒する。本人自身の行動の自由への、ほとんどどんな介入より警戒する。世間一般は権力より自由をそれほど低く評価するのである。たとえば教育を考えよう。ある国の市民として生まれた人間すべてに、一定の水準まで教育を受けることを国家が求め、義務とするべきだというのは、ほとんど自明の原則ではないか。だがこの真理を認め、主張するのを恐れない人がどこにいるだろう。人をこの世に呼び出した以上、他人に対しても自分に対しても、人生で自分の役割をよく果たせるような教育を与えることは、親の、今の法律と慣習では父親の、最も神聖な義務の一つである。これを否定する人は、たしかにほとんどいない。だが誰もが父親の義務だと宣言しながら、義務を果たすよう強いると聞いて耐えられる人は、この国にはほとんどいない。子どもが教育を受けられるよう、いくらかの努力や犠牲を要求されるどころか、ただで与えられても受けるかどうかは、父親が選べるのである。身体のための食事だけでなく、心のための知識と訓練を与えられる見込みも十分にないまま、子どもをこの世に生むのは、その不幸な子に対しても社会に対しても、道徳上の罪である。この義務を親が果たさないなら、できるかぎり親の負担で果たされるよう、国家が取りはからうべきである。このことは、いまだに認められていない。

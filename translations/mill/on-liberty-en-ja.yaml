    printed_page_end: '139'
    source_sequence: 91
  source_text: The combination of all these causes forms so great a mass of influences hostile to Individuality, that it is not easy to see how it can stand its ground. It will do so with increasing difficulty, unless the intelligent part of the public can be made to feel its value—to see that it is good there should be differences, even though not for the better, even though, as it may appear to them, some should be for the worse. If the claims of Individuality are ever to be asserted, the time is now, while much is still wanting to complete the enforced assimilation. It is only in the earlier stages that any stand can be successfully made against the encroachment. The demand that all other people shall resemble ourselves, grows by what it feeds on. If resistance waits till life is reduced nearly to one uniform type, all deviations from that type will come to be considered impious, immoral, even monstrous and contrary to nature. Mankind speedily become unable to conceive diversity, when they have been for some time unaccustomed to see it.
  translation_ja: これらの原因が合わさって、個性に敵対する影響がこれほど大きくなると、個性がどうやって踏みとどまれるのか、見当をつけにくい。世間のうち物分かりのよい人たちに、個性の値うちを感じてもらわなければ、踏みとどまるのはますます難しくなる。違いは、よりよくするものでなくても、一部の違いは悪くすると思われても、違いがあること自体がよいと、分かってもらわなければならない。個性の要求を主張するとしたら、強制された同質化が完成するまでに、まだ多くが残る今がそのときだ。侵害に首尾よく対抗できるのは、その初期だけである。他の人々をみな自分たちと似たものにしろという要求は、人々が実際に似ていくにつれて、ますます強くなる。暮らしがほぼ一つの型に抑え込まれるまで抵抗しないでいれば、その型から外れるものは、不敬で、不道徳で、怪物のように不自然だと思われるようになる。しばらく多様さを見慣れずにいると、人はたちまち、それを思い描くこともできなくなる。
  translation_status: reviewed

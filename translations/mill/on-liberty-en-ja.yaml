  source_text: I am as far as any one from pretending that these defects are necessarily inherent in the Christian ethics, in every manner in which it can be conceived, or that the many requisites of a complete moral doctrine which it does not contain, do not admit of being reconciled with it. Far less would I insinuate this of the doctrines and precepts of Christ himself. I believe that the sayings of Christ are all, that I can see any evidence of their having been intended to be; that they are irreconcilable with nothing which a comprehensive morality requires; that everything which is excellent in ethics may be brought within them, with no greater violence to their language than has been done to it by all who have attempted to deduce from them any practical system of conduct whatever. But it is quite consistent with this, to believe that they contain, and were meant to contain, only a part of the truth; that many essential elements of the highest morality are among the things which are not provided for, nor intended to be provided for, in the recorded deliverances of the Founder of Christianity, and which have been entirely thrown aside in the system of ethics erected on the basis of those deliverances by the Christian Church. And this being so, I think it a great error to persist in attempting to find in the Christian doctrine that complete rule for our guidance, which its author intended it to sanction and enforce, but only partially to provide. I believe, too, that this narrow theory is becoming a grave practical evil, detracting greatly from the value of the moral training and instruction, which so many well-meaning persons are now at length exerting themselves to promote. I much fear that by attempting to form the mind and feelings on an exclusively religious type, and discarding those secular standards (as for want of a better name they may be called) which heretofore co-existed with and supplemented the Christian ethics, receiving some of its spirit, and infusing into it some of theirs, there will result, and is even now resulting, a low, abject, servile type of character, which, submit itself as it may to what it deems the Supreme Will, is incapable of rising to or sympathising in the conception of Supreme Goodness. I believe that other ethics than any which can be evolved from exclusively Christian sources, must exist side by side with Christian ethics
    to produce the moral regeneration of mankind; and that the Christian system is no exception to the rule, that in an imperfect state of the human mind, the interests of truth require a diversity of opinions. It is not necessary that in ceasing to ignore the moral truths not contained in Christianity, men should ignore any of those which it does contain. Such prejudice, or oversight, when it occurs, is altogether an evil; but it is one from which we cannot hope to be always exempt, and must be regarded as the price paid for an inestimable good. The exclusive pretension made by a part of the truth to be the whole, must and ought to be protested against, and if a reactionary impulse should make the protestors unjust in their turn, this one-sidedness, like the other, may be lamented, but must be tolerated. If Christians would teach infidels to be just to Christianity, they should themselves be just to infidelity. It can do truth no service to blink the fact, known to all who have the most ordinary acquaintance with literary history, that a large portion of the noblest and most valuable moral teaching has been the work, not only of men who did not know, but of men who knew and rejected, the Christian faith.
  translation_ja: 私は、こうした欠点が、どう考えようと必ずキリスト教の倫理につきものだと主張する気も、まとまった道徳の教説に欠かせない多くの事柄がそこには含まれないからといって、両立できないと主張する気も、まったくない。ましてキリスト自身の教えや戒めについて、そんなことをほのめかす気はない。キリストの言葉は、その言葉がそうあるよう意図されたと私が根拠を見いだせるところでは、その意図を余すところなく果たしていると思う。広い道徳に必要なもののうち、その言葉と両立できないものはないと思う。そこから何らかの行動の体系を引き出そうとした人々がみな、言葉に加えた無理を越えなくても、倫理のすぐれたものはすべて、その言葉のうちに収められると思う。しかしそれと、キリストの言葉は真理の一部しか含まず、またそのつもりで述べられたと考えることとは、十分に両立する。道徳の最高のあり方に欠かせない多くの要素は、キリスト教を開いた人の記録された言葉には備わらず、備えようともされなかった。キリスト教会がその言葉を土台に組み立てた倫理体系では、それらはすっかり捨て去られたのである。だとすれば、キリスト教の教えに、私たちの道しるべとなる完全な規範を見いだそうとし続けるのは、大きな誤りだと思う。教えを説いた人は、完全な規範を認めて支えることは意図しても、規範そのものは一部分しか与えるつもりはなかったのだ。また、こうした狭い考えが、かねて善意のある多くの人がようやく広めようと力を尽くす道徳の訓練と教育の値うちを大きく落とす、現実の深刻な害になりつつあると思う。これまでキリスト教倫理と共存し、これを補い、その精神をいくらか取り込み、自らの精神もいくらか吹き込んできた諸規範、ほかによい名がないので世俗の規範と呼べるものを捨てて、ただ宗教の型に合わせて考えと感情を形づくろうとする。その結果、私が大いに恐れるのは、卑屈で、品位も自立心もない人間が生まれることであり、現にそうなりつつある。そういう人は、最高の意志とみなすものにはいくら従っても、最高の善という考えに心を高めたり、共感したりはできない。人類を道徳の面で生まれ変わらせるには、もっぱらキリスト教に由来する倫理のほかに別の倫理が、それと並んで存在しなければならないと思う。人の心が不完全であるあいだは、真理のために意見の多様性が必要であるという原則に、キリスト教の体系は例外ではない。キリスト教に含まれない道徳上の真理を無視するのをやめるからといって、含まれる真理を一つでも無視する必要はない。そのような偏見や見落としは、起こればまったく悪いことである。だがいつでもまぬかれるとは期待できず、はかりしれない善を得るために払う代価とみなさなければならない。真理の一部が、自分だけが真理のすべてだと言い立てるなら、これには抗議しなければならず、抗議するのが正しい。反発の勢いで抗議する側もまた不公正になるなら、その偏りは、ほかの偏りと同じく嘆かわしくとも、許さねばならない。キリスト教徒が、信仰のない人にキリスト教を公正に扱うよう教えたいなら、自らも信仰のない立場を公正に扱うべきである。文学史をごくふつうに知る人なら誰でも承知している事実に目をつぶっても、真理の役には立たない。その事実とは、最も高潔で貴重な道徳の教えの多くが、キリスト教の信仰を知らなかったばかりでなく、知っていて退けた人々によっても、作り出されたことである。

  source_text: 'I do not pretend that the most unlimited use of the freedom of enunciating all possible opinions would put an end to the evils of religious or philosophical sectarianism. Every truth which men of narrow capacity are in earnest about, is sure to be asserted, inculcated, and in many ways even acted on, as if no other truth existed in the world, or at all events none that could limit or qualify the first. I acknowledge that the tendency of all opinions to become sectarian is not cured by the freest discussion, but is often heightened and exacerbated thereby; the truth which ought to have been, but was not, seen, being rejected all the more violently because proclaimed by persons regarded as opponents. But it is not on the impassioned partisan, it is on the calmer and more disinterested bystander, that this collision of opinions works its salutary effect. Not the violent conflict between parts of the truth, but the quiet suppression of half of it, is the formidable evil: there is always hope when people are forced to listen to both sides; it is when they attend only to one that errors harden into prejudices, and truth itself ceases to have the effect of truth, by being exaggerated into falsehood. And since there are few mental attributes more rare than that judicial faculty which can sit in intelligent judgment between two sides of a question, of which only one is represented by an advocate before it, truth has no chance but in proportion as every side of it, every opinion which embodies any fraction of the truth, not only finds advocates, but is so advocated as to be listened to.'
  translation_ja: ありうる意見を何でも述べる自由を、どれほど無制限に行使しても、宗教や哲学で党派に分かれることの弊害を終わらせるとは、私も主張しない。広く物を見る力のない人が真剣に信じる真理はどれも、世にほかの真理が存在しない、少なくとも最初の真理に限度や条件を付ける真理はないかのように、主張され、教え込まれ、さまざまな仕方で実行さえされるに違いない。意見であれば何でも、宗派の教えめいたものになりがちであり、この傾向はどんなに自由な議論でも治らない。かえって強くなり、悪化することさえ多いと認めよう。見えているべきであったのに見えなかった真理は、敵とみなす人々から示されたからこそ、ますます激しく排斥される。だが意見の衝突が健全な効果を発揮するのは、熱くなった党派の人に対してではなく、もっと冷静で自分の利害から離れた傍観者に対してである。恐るべき害は、真理の諸部分が激しく争うことではなく、真理の半分が静かに抑えられることだ。両方の言い分をどうしても聞かざるを得ないときは、いつでも望みがある。誤りが偏見に固まり、真理そのものさえ誇張されて偽りとなり、真理としての働きを失うのは、人が片方にだけ耳を傾けるときである。しかも、両面ある問題の一方にしか弁護する者がいないときに、両面を理解し見識を持って判断できるような、公平な裁きの力ほどまれな心の能力は少ない。だから、真理のあらゆる面、真理の一かけらでも含むあらゆる意見に、擁護する人がつくだけではなく、人に聞いてもらえるよう擁護されることに、真理の望みはすべてかかっている。

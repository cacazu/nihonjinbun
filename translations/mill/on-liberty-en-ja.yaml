  source_text: 'There is something both contemptible and frightful in the sort of evidence on which, of late years, any person can be judicially declared unfit for the management of his affairs; and after his death, his disposal of his property can be set aside, if there is enough of it to pay the expenses of litigation—which are charged on the property itself. All the minute details of his daily life are pried into, and whatever is found which, seen through the medium of the perceiving and describing faculties of the lowest of the low, bears an appearance unlike absolute commonplace, is laid before the jury as evidence of insanity, and often with success; the jurors being little, if at all, less vulgar and ignorant than the witnesses; while the judges, with that extraordinary want of knowledge of human nature and life which continually astonishes us in English lawyers, often help to mislead them. These trials speak volumes as to the state of feeling and opinion among the vulgar with regard to human liberty. So far from setting any value on individuality—so far from respecting the rights of each individual to act, in things indifferent, as seems good to his own judgment and inclinations, judges and juries cannot even conceive that a person in a state of sanity can desire such freedom. In former days, when it was proposed to burn atheists, charitable people used to suggest putting them in a madhouse instead: it would be nothing surprising nowadays were we to see this done, and the doers applauding themselves, because, instead of persecuting for religion, they had adopted so humane and Christian a mode of treating these unfortunates, not without a silent satisfaction at their having thereby obtained their deserts.'
  translation_ja: 近年、ある人が自分の身の回りのことを自分で管理するには不適格だと、裁判で宣言できるときの証拠には、何か軽蔑に値する、恐ろしい点がある。財産に訴訟費用をまかなえるだけのものがあれば、その費用は財産自体に課されるが、死後、その人が決めた財産の処分も無効にできる。日常生活の細かい事情を何から何まで探られる。そして最も粗野な者の目と語り口を通せば、ありきたりなものとは少しでも違って見える事柄が見つかると、何でも狂気の証拠として陪審の前に持ち出され、しばしば成功する。陪審員も証人に劣らず、あるいはほとんど違わず、粗野で無知だからである。その一方で、裁判官は、人の本性と暮らしについて、イングランドの法律家には驚かされ続ける、あのとてつもない無知をもって、しばしば誤りへ導く手助けをする。これらの裁判は、人間の自由について粗野な人々がどんな気持ちや意見を持つかを、何より雄弁に物語る。個性に何か価値を置くどころか、他人には差し障りのない事柄を、自らの判断や好みに沿ってよいと思うように行う、一人ひとりの権利を尊重するどころか、裁判官にも陪審員にも、正気な人がその自由を望むこと自体、思い描けないのである。昔、無神論者を火あぶりにする案が出ると、慈悲深い人は、その代わりに精神病院に入れてはどうかと言ったものである。今それが実際に行われ、行った者が、宗教を理由に迫害する代わりに、こうした不幸な人々をこれほど人道的でキリスト教徒らしく扱ったと自賛し、それで相手にふさわしい報いを受けさせたと、心の中でひそかに満足していたとしても、少しも驚くことではない。
  translation_status: reviewed

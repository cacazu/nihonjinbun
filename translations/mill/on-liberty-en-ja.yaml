  source_text: 'The grand, leading principle, towards which every argument unfolded in these pages directly converges, is the absolute and essential importance of human development in its richest diversity.—Wilhelm Von Humboldt: Sphere and Duties of Government.'
  translation_ja: 本書に述べる議論がことごとくまっすぐに行き着く、最も大切な根本原理は、人間がこのうえなく豊かに、多様な姿で発達することが、絶対に欠かせないということだ。ヴィルヘルム・フォン・フンボルト『国家活動の限界』。
  translation_status: reviewed

  source_text: 'It may be objected, "But some received principles, especially on the highest and most vital subjects, are more than half-truths. The Christian morality, for instance, is the whole truth on that subject, and if any one teaches a morality which varies from it, he is wholly in error." As this is of all cases the most important in practice, none can be fitter to test the general maxim. But before pronouncing what Christian morality is or is not, it would be desirable to decide what is meant by Christian morality. If it means the morality of the New Testament, I wonder that any one who derives his knowledge of this from the book itself, can suppose that it was announced, or intended, as a complete doctrine of morals. The Gospel always refers to a pre-existing morality, and confines its precepts to the particulars in which that morality was to be corrected, or superseded by a wider and higher; expressing itself, moreover, in terms most general, often impossible to be interpreted literally, and possessing rather the impressiveness of poetry or eloquence than the precision of legislation. To extract from it a body of ethical doctrine, has ever been possible without eking it out from the Old Testament, that is, from a system elaborate indeed, but in many respects barbarous, and intended only for a barbarous people. St. Paul, a declared enemy to this Judaical mode of interpreting the doctrine and filling up the scheme of his Master, equally assumes a pre-existing morality, namely, that of the Greeks and Romans; and his advice to Christians is in a great measure a system of accommodation to that; even to the extent of giving an apparent sanction to slavery. What is called Christian, but should rather be termed theological, morality, was not the work of Christ or the Apostles, but is of much later origin, having been gradually built up by the Catholic church of the first five centuries, and though not implicitly adopted by moderns and Protestants, has been much less modified by them than might have been expected. For the most part, indeed, they have contented themselves with cutting off the additions which had been made to it in the middle ages, each sect supplying the place by fresh additions, adapted to its own character and tendencies. That mankind owe a great debt to this morality, and to its early teachers, I should be the last person to deny; but I do
    not scruple to say of it, that it is, in many important points, incomplete and one-sided, and that unless ideas and feelings, not sanctioned by it, had contributed to the formation of European life and character, human affairs would have been in a worse condition than they now are. Christian morality (so called) has all the characters of a reaction; it is, in great part, a protest against Paganism. Its ideal is negative rather than positive; passive rather than active; Innocence rather than Nobleness; Abstinence from Evil, rather than energetic Pursuit of Good: in its precepts (as has been well said) "thou shalt not" predominates unduly over "thou shalt." In its horror of sensuality, it made an idol of asceticism, which has been gradually compromised away into one of legality. It holds out the hope of heaven and the threat of hell, as the appointed and appropriate motives to a virtuous life: in this falling far below the best of the ancients, and doing what lies in it to give to human morality an essentially selfish character, by disconnecting each man''s feelings of duty from the interests of his fellow-creatures, except so far as a self-interested inducement is offered to him for consulting them. It is essentially a doctrine of passive obedience; it inculcates submission to all authorities found established; who indeed are not to be actively obeyed when they command what religion forbids, but who are not to be resisted, far less rebelled against, for any amount of wrong to ourselves. And while, in the morality of the best Pagan nations, duty to the State holds even a disproportionate place, infringing on the just liberty of the individual; in purely Christian ethics, that grand department of duty is scarcely noticed or acknowledged. It is in the Koran, not the New Testament, that we read the maxim—"A ruler who appoints any man to an office, when there is in his dominions another man better qualified for it, sins against God and against the State." What little recognition the idea of obligation to the public obtains in modern morality, is derived from Greek and Roman sources, not from Christian; as, even in the morality of private life, whatever exists of magnanimity, high-mindedness, personal dignity, even the sense of honour, is derived from the purely human, not the religious part of our education, and never could have grown out of a standard of ethics
    in which the only worth, professedly recognised, is that of obedience.'
  translation_ja: こう反論されるかもしれない。「だが通説となっている原理の中には、とりわけ最も重大で切実な事柄について、半分の真理どころではないものもある。たとえばキリスト教の道徳は、その主題についての真理のすべてであり、それと異なる道徳を説く者は、全面的に間違っている。」実際上は、どの事例よりもこれが重要なのだから、一般原理を試すのに、これほどふさわしい例もない。だが何がキリスト教の道徳で、何がそうでないかを断じる前に、キリスト教の道徳とは何を意味するかを決めたほうがよい。新約聖書の道徳を指すのなら、その本自体から知識を得た人が、それを完結した道徳の教説として告げられた、あるいはそのつもりで書かれたと考えうるのは、私には不思議である。福音書は常に、すでにある道徳に言及し、それを正すべき点、あるいはもっと広く高い道徳と取り替えるべき点だけに戒めを限っている。それに、きわめて一般的な言葉で述べ、文字どおりには解釈できない場合も多く、法律のような正確さというより、詩や雄弁のように心を揺さぶる力を持つ。旧約聖書、すなわち体系としては確かによくできていても、多くの点で粗野であり、粗野とされた民だけを対象としたものから補わずに、福音書から一つの道徳体系を取り出せたためしはない。師の教えを解釈し、体系を補うこのユダヤ的な方法に公然と反対した聖パウロも、同じように既存の道徳、つまりギリシャ人とローマ人の道徳を前提にする。キリスト教徒への助言の大部分は、それに合わせるための体系であり、奴隷制に表向きの承認を与えるほどであった。キリスト教の道徳と呼ばれているが神学の道徳と呼ぶほうがふさわしいものは、キリストや使徒たちが作ったのではない。ずっと後に始まり、最初の五世紀のあいだにカトリック教会が徐々に築き上げた。近代人やプロテスタントは丸ごと受け入れたわけではないが、予想されたほどには手を加えていない。中世に付け加えられたところを切り取り、宗派ごとに自らの性格と傾向に合わせた新しいものをそこに足すだけで、たいていは満足した。この道徳と、初期の教師たちに人類が大きな恩を負うことは、私こそ誰より否定する気はない。だが多くの大切な点で不完全で、一面に偏っているとも、ためらわずに言う。この道徳が認めてはいない考えや感情がヨーロッパの暮らしと人柄をつくるのに役立たなければ、人の世は今より悪くなっていただろう。いわゆるキリスト教道徳は、何かに反発して生まれたものの特徴をすべて持っており、大部分は異教への抗議である。理想とするのは積極より消極、能動より受動、高潔さより潔白、力を尽くして善を求めることより悪を避けることだ。うまい言葉で指摘されたとおり、戒めでは「してはならない」が「しなさい」に勝ちすぎている。肉体の欲を嫌うあまり、禁欲を偶像に仕立てたが、次第に妥協を重ね、ただ規則に従うことを偶像にするに至った。有徳な生涯を送る、定められたふさわしい動機として、天国の望みと地獄の脅しを差し出す。この点で最もすぐれた古代人にはるかに劣る。自分のためになる誘いがあって他人の利益を気にする場合を除き、一人ひとりの義務感を仲間の利益から切り離すことで、人間の道徳を本質的に利己的なものにするため、できるかぎりのことをしている。本質的には、受動的に従うという教えである。すでに立っているあらゆる権威に服従するように教え込む。その権威が宗教の禁じることを命じれば、進んで従うべきではないが、どれほどひどい仕打ちを受けても、抵抗はもとより、反乱などもってのほかである。また最もすぐれた異教の民の道徳では、国家への義務が不釣り合いなほど重い位置を占めて、個人の正当な自由を侵している一方で、純粋にキリスト教的な倫理では、この大きな領域の義務はほとんど顧みられず、認められもしない。「領内にもっと適任の者がいるのに、ある者を役職に就ける統治者は、神と国家に対して罪を犯す」という格言が載っているのは、新約聖書ではなくコーランである。近代の道徳でも、公に対する責務という考えがわずかに認められているとすれば、それはキリスト教からではなく、ギリシャとローマに由来する。私生活の道徳でも、度量の大きさ、高潔さ、個人の尊厳、さらには名誉の感覚まで、あるものはすべて、私たちの教育のうち、宗教ではなく、人間としての教育の部分に由来する。公然と認められる価値が服従だけという倫理の規範からは、決して育ちえなかったものである。
  translation_status: reviewed

    source_sequence: 57
  source_text: In politics, again, it is almost a commonplace, that a party of order or stability, and a party of progress or reform, are both necessary elements of a healthy state of political life; until the one or the other shall have so enlarged its mental grasp as to be a party equally of order and of progress, knowing and distinguishing what is fit to be preserved from what ought to be swept away. Each of these modes of thinking derives its utility from the deficiencies of the other; but it is in a great measure the opposition of the other that keeps each within the limits of reason and sanity. Unless opinions favourable to democracy and to aristocracy, to property and to equality, to co-operation and to competition, to luxury and to abstinence, to sociality and individuality, to liberty and discipline, and all the other standing antagonisms of practical life, are expressed with equal freedom, and enforced and defended with equal talent and energy, there is no chance of both elements obtaining their due; one scale is sure to go up and the other down. Truth, in the great practical concerns of life, is so much a question of the reconciling and combining of opposites, that very few have minds sufficiently capacious and impartial to make the adjustment with an approach to correctness, and it has to be made by the rough process of a struggle between combatants fighting under hostile banners. On any of the great open questions just enumerated, if either of the two opinions has a better claim than the other, not merely to be tolerated, but to be encouraged and countenanced, it is the one which happens at the particular time and place to be in a minority. That is the opinion which, for the time being, represents the neglected interests, the side of human well-being which is in danger of obtaining less than its share. I am aware that there is not, in this country, any intolerance of differences of opinion on most of these topics. They are adduced to show, by admitted and multiplied examples, the universality of the fact, that only through diversity of opinion is there, in the existing state of human intellect, a chance of fair-play to all sides of the truth. When there are persons to be found, who form an exception to the apparent unanimity of the world on any subject, even if the world is in the right, it is always probable that dissentients have something worth
    hearing to say for themselves, and that truth would lose something by their silence.
  translation_ja: また政治では、秩序や安定を重んじる党と、進歩や改革を求める党が、健全な政治生活にはどちらも欠かせないというのは、ほとんど決まり文句である。どちらかが見通せる範囲を広げて、残すにふさわしいものと一掃すべきものを知り、区別する、秩序と進歩を等しく重んじる党にならないかぎりは、そうである。どちらの考え方も、もう一方が欠いているところに自分の有益さがある。だがどちらも理性と分別の限界の内にとどまるのは、大部分、もう一方が反対するおかげである。民主政と貴族政、財産と平等、協同と競争、ぜいたくと節制、社会性と個性、自由と規律、その他日常の営みに絶えずあるあらゆる対立について、どちらを支持する意見も同じ自由さで述べられ、同じ才覚と熱意で主張され弁護されないなら、双方がそれぞれ受けるに値する重みを与えられる望みはない。秤は片方が必ず上がり、もう片方が下がる。人生の重大な実際の事柄では、真理は対立するものを折り合わせ、結び合わせることに、あまりに大きくかかっている。ほぼ正しく調整できるほど、広く偏りのない心を持つ人はごく少数なので、敵対する旗を掲げた闘士同士が争う、荒っぽい過程で調整が行われるほかない。今挙げた大きな未決の問題のどれでも、二つの意見のうち一方に、ただ許されるだけでなく励まされ支持される、もう一方よりよい理由があるとすれば、それは、その時そのところでたまたま少数派である意見だ。その意見こそ、当面、顧みられない利害を、受けるべき分に満たなくなるおそれのある、人間の幸福の側面を代表する。この国では、これらの問題のたいていについて、意見が違うことへの不寛容はないと私は知っている。例をいくつも、それもよく認められているものを挙げたのは、次のことがどこでも当てはまると示すためだ。今の人間の知性の状態では、意見が多様であって初めて、真理のあらゆる面が公正に扱われる望みがある。ある主題について世間が一致しているように見えるとき、その例外となる人が見つかるなら、世間のほうが正しくても、異を唱える人には耳を傾ける値うちのある言い分があり、その人が黙れば真理は何かを失うことが、いつでも十分にありそうなのである。

    precision: page
    printed_page: '177'
    printed_page_end: '178'
    source_sequence: 120
  source_text: The maxims are, first, that the individual is not accountable to society for his actions, in so far as these concern the interests of no person but himself. Advice, instruction, persuasion, and avoidance by other people if thought necessary by them for their own good, are the only measures by which society can justifiably express its dislike or disapprobation of his conduct. Secondly, that for such actions as are prejudicial to the interests of others, the individual is accountable and may be subjected either to social or to legal punishments, if society is of opinion that the one or the other is requisite for its protection.
  translation_ja: 格言の第一は、自分以外の誰の利益にも関わらないかぎり、個人は自分の行動について、社会に責任を負わないということだ。助言、指導、説得、そしてほかの人々が自らのために必要と考えれば付き合いを避けること。個人の行動を嫌ったり非難したりする気持ちを社会が正当に表現できる手段は、それだけである。第二に、他人の利益を害する行いについて、個人は責任を負い、社会が自らを守るのに必要だと考えるなら、社会による罰か、法律による罰を受けうる。
  translation_status: reviewed
- id: ol-05-003
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '178'
    printed_page_end: '179'
    source_sequence: 121
  source_text: In the first place, it must by no means be supposed, because damage, or probability of damage, to the interests of others, can alone justify the interference of society, that therefore it always does justify such interference. In many cases, an individual, in pursuing a legitimate object, necessarily and therefore legitimately causes pain or loss to others, or intercepts a good which they had a reasonable hope of obtaining. Such oppositions of interest between individuals often arise from bad social institutions, but are unavoidable while those institutions last; and some would be unavoidable under any institutions. Whoever succeeds in an overcrowded profession, or in a competitive examination; whoever is preferred to another in any contest for an object which both desire, reaps benefit from the loss of others, from their wasted exertion and their disappointment. But it is, by common admission, better for the general interest of mankind, that persons should pursue their objects undeterred by this sort of consequences. In other words, society admits no rights, either legal or moral, in the disappointed competitors, to immunity from this kind of suffering; and feels called on to interfere, only when means of success have been employed which it is contrary to the general interest to permit—namely, fraud or treachery, and force.
  translation_ja: まず、他人の利益への損害か、そのおそれだけが、社会の介入を正当化できるからといって、それがいつも介入を正当化すると、決して考えてはならない。正当な目的を追うなかで、どうしても、したがって正当に、他人に苦痛や損失をもたらし、あるいは、他人が手に入れられると合理的に望んでいた利益を、先に取ってしまう場合は多い。このような個人どうしの利害の対立は、悪い社会制度から生じることが多い。だが制度が続くあいだは避けられず、どんな制度のもとでも避けられないものもある。志望者のひしめく職業や競争試験で成功する人も、二人が望むものを競い、もう一人より選ばれる人も、他人が失うこと、その努力がむだに終わり、望みがかなわないことから、利益を得る。だが誰もが認めるように、この種の結果にひるまずに、人が自分の目的を追うほうが、人類全体の利益にかなう。言い換えれば、競争に敗れた人に、こういう苦しみを免れる法律上あるいは道徳上の権利があるとは、社会は認めない。成功するために、許せば全体の利益に反する手段、つまり詐欺や裏切り、暴力が用いられたときだけ、介入する必要があると考える。
  translation_status: reviewed
- id: ol-05-004
  section_id: ch-05

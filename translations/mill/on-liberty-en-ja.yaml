    source_sequence: 9
  source_text: 'Like other tyrannies, the tyranny of the majority was at first, and is still vulgarly, held in dread, chiefly as operating through the acts of the public authorities. But reflecting persons perceived that when society is itself the tyrant—society collectively, over the separate individuals who compose it—its means of tyrannising are not restricted to the acts which it may do by the hands of its political functionaries. Society can and does execute its own mandates: and if it issues wrong mandates instead of right, or any mandates at all in things with which it ought not to meddle, it practises a social tyranny more formidable than many kinds of political oppression, since, though not usually upheld by such extreme penalties, it leaves fewer means of escape, penetrating much more deeply into the details of life, and enslaving the soul itself. Protection, therefore, against the tyranny of the magistrate is not enough: there needs protection also against the tyranny of the prevailing opinion and feeling; against the tendency of society to impose, by other means than civil penalties, its own ideas and practices as rules of conduct on those who dissent from them; to fetter the development, and, if possible, prevent the formation, of any individuality not in harmony with its ways, and compel all characters to fashion themselves upon the model of its own. There is a limit to the legitimate interference of collective opinion with individual independence: and to find that limit, and maintain it against encroachment, is as indispensable to a good condition of human affairs, as protection against political despotism.'
  translation_ja: ほかの専制と同じく、多数者の専制も、当初は主として公の権力機関の行為を通して働くものとして恐れられた。今でも一般にはそう受け取られている。だが考えをめぐらせた人には、社会そのものが、つまり社会全体がそれを構成する各個人に対して専制者となるとき、使える手段は政治上の役人の手を借りて行うことに限られないと分かった。社会は自分の命令を自分で執行できるし、現にそうする。正しい命令の代わりに誤った命令を出したり、そもそも口を出すべきでない物事に何かしら命令を出したりすれば、政治的な圧迫の多くより恐ろしい、社会的な専制を行うことになる。たいていは政治的な圧迫ほど極端な罰を後ろ盾にしないが、逃げ道はかえって少ない。暮らしの細部にずっと深く入り込み、心そのものを縛るからだ。したがって、役人の専横から守られるだけでは足りない。世を覆う意見や感情の専制からも守られなくてはならない。すなわち、法の罰以外の手段で、異を唱える者に社会自身の考えや慣行を行動の規範として押しつけ、自分の流儀に合わない個性が育つのを妨げ、できれば芽生えることさえ阻み、あらゆる人の性格を自分の型に当てはめようとする社会の傾向からも、守られなくてはならないのである。世間の意見が個人の自立を正当に妨げてよい範囲には限りがある。その限界を見つけ、侵されないよう守ることは、人々が健全に暮らすために、政治的な専制を防ぐのと同じほど欠かせない。
  translation_status: reviewed
- id: ol-01-006
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '9'
    printed_page_end: '12'
    source_sequence: 10
  source_text: 'But though this proposition is not likely to be contested in general terms, the practical question, where to place the limit—how to make the fitting adjustment between individual independence and social control—is a subject on which nearly everything remains to be done. All that makes existence valuable to any one, depends on the enforcement of restraints upon the actions of other people. Some rules of conduct, therefore, must be imposed, by law in the first place, and by opinion on many things which are not fit subjects for the operation of law. What these rules should be, is the principal question in human affairs; but if we except a few of the most obvious cases, it is one of those which least progress has been made in resolving. No two ages, and scarcely any two countries, have decided it alike; and the decision of one age or country is a wonder to another. Yet the people of any given age and country no more suspect any difficulty in it, than if it were a subject on which mankind had always been agreed. The rules which obtain among themselves appear to them self-evident and self-justifying. This all but universal illusion is one of the examples of the magical influence of custom, which is not only, as the proverb says, a second nature, but is continually mistaken for the first. The effect of custom, in preventing any misgiving respecting the rules of conduct which mankind impose on one another, is all the more complete because the subject is one on which it is not generally considered necessary that reasons should be given, either by one person to others, or by each to himself. People are accustomed to believe, and have been encouraged in the belief by some who aspire to the character of philosophers, that their feelings, on subjects of this nature, are better than reasons, and render reasons unnecessary. The practical principle which guides them to their opinions on the regulation of human conduct, is the feeling in each person''s mind that everybody should be required to act as he, and those with whom he sympathises, would like them to act. No one, indeed, acknowledges to himself that his standard of judgment is his own liking; but an opinion on a point of conduct, not supported by reasons, can only count as one person''s preference; and if the reasons, when given, are a mere appeal to a similar preference felt by other people, it is still
    only many people''s liking instead of one. To an ordinary man, however, his own preference, thus supported, is not only a perfectly satisfactory reason, but the only one he generally has for any of his notions of morality, taste, or propriety, which are not expressly written in his religious creed; and his chief guide in the interpretation even of that. Men''s opinions, accordingly, on what is laudable or blamable, are affected by all the multifarious causes which influence their wishes in regard to the conduct of others, and which are as numerous as those which determine their wishes on any other subject. Sometimes their reason—at other times their prejudices or superstitions: often their social affections, not seldom their anti-social ones, their envy or jealousy, their arrogance or contemptuousness: but most commonly, their desires or fears for themselves—their legitimate or illegitimate self-interest. Wherever there is an ascendant class, a large portion of the morality of the country emanates from its class interests, and its feelings of class superiority. The morality between Spartans and Helots, between planters and negroes, between princes and subjects, between nobles and roturiers, between men and women, has been for the most part the creation of these class interests and feelings: and the sentiments thus generated, react in turn upon the moral feelings of the members of the ascendant class, in their relations among themselves. Where, on the other hand, a class, formerly ascendant, has lost its ascendancy, or where its ascendancy is unpopular, the prevailing moral sentiments frequently bear the impress of an impatient dislike of superiority. Another grand determining principle of the rules of conduct, both in act and forbearance, which have been enforced by law or opinion, has been the servility of mankind towards the supposed preferences or aversions of their temporal masters, or of their gods. This servility, though essentially selfish, is not hypocrisy; it gives rise to perfectly genuine sentiments of abhorrence; it made men burn magicians and heretics. Among so many baser influences, the general and obvious interests of society have of course had a share, and a large one, in the direction of the moral sentiments: less, however, as a matter of reason, and on their own account, than as a consequence of the sympathies and antipathies which grew out
    of them: and sympathies and antipathies which had little or nothing to do with the interests of society, have made themselves felt in the establishment of moralities with quite as great force.'
  translation_ja: もっとも、この主張に一般論として反対する人はまずいないとしても、実際にどこに限界を引くのか、個人の自立と社会の統制とをどう釣り合わせるのかという問題は、ほとんど手つかずのままである。誰にとっても、生きていることに価値を与えるものはすべて、他の人々の行動に制約が課されることにかかっている。ゆえに、まず法律によって何らかの行動規範を課さねばならず、法が働くのに適さない多くの事柄では、世論によって規範を課す必要がある。その規範を何とするかは、人の世の第一の問題である。だが、最も明白ないくつかの事例を除けば、答えを見つけるうえでほとんど進歩のなかった問題の一つでもある。どの二つの時代も同じ答えを出したことはなく、二国を取ってみても、ほぼ同じことが言える。ある国、ある時代の答えを見て、ほかの国や時代の人々は驚く。にもかかわらず、どの時代、どの国の人々も、人類の意見が古来一致してきた問題ででもあるかのように、そこに難しさがあるとは思いもしない。自分たちのあいだで通用している規範は、説明するまでもなく明白で、それ自体で正しいと思えるからだ。このほぼ普遍的な錯覚は、慣習の魔力が現れた一例である。ことわざにいう第二の天性であるばかりか、しょっちゅう第一の天性と取り違えられる。慣習が、人々が互いに課す行動規範について疑いを抱かせないのは、この種の事柄では、他人に対しても自分に対しても、理由を述べる必要があるとはふつう考えないことによって、いっそう徹底している。人々は、こうした問題では自分の感じ方は理由よりも頼りになり、理由など要らなくなると考え慣れており、哲学者を気取る一部の人にも、その考えを後押しされてきた。人の行動をどう規制するかについて、実際に彼らの考えを導いているのは、誰もが自分や自分の共感する人たちの望むとおりに振る舞うよう求められるべきだ、という一人ひとりの気持ちである。むろん、判断の基準は自分の好みだなどと、自分に対してさえ認める人はいない。だが行動の是非について理由の裏づけのない意見は、一人の好み以上のものではない。理由を示しても、他人にも同じ好みがある、と訴えるだけなら、一人の好みが大勢の好みになっただけのことだ。ところがふつうの人には、こうして裏づけを得た好みはとうに十分すぎる理由であるばかりか、信仰の教えにはっきり書かれていない事柄については、道徳も趣味も礼儀作法も、それを判断するためのたいてい唯一の理由であり、その教え自体を解釈するときにさえ、主な道しるべになる。したがって、行いの何を褒め、何をとがめるかについての意見は、他人にどう行動してほしいと思うかを左右する多種多様な原因すべてに影響される。他の事柄について願いを決める原因と同じくらい数が多い。理性が働くときもあれば、偏見や迷信が働くときもある。人を思いやる気持ちもしばしば働くが、反対に、ねたみや嫉妬、思い上がりや侮りが働くこともまれではない。だが最も多いのは、自分のために何を望み、何を恐れるか、正当であれ不当であれ、自分の利害である。優勢な階級があればどこでも、その国の道徳の大きな部分が、その階級の利害と、自分たちが他より上にいるという意識から生まれる。スパルタ市民と隷属民ヘイロータイ、農園主と黒人、君主と臣民、貴族と平民、男と女のあいだの道徳は、大部分、このような利害や意識が作ったものだ。そうして生まれた感情は今度は、優勢な階級の人々が互いに接するときの道徳感情にも跳ね返ってくる。逆に、かつて優勢だった階級が勢いを失ったか、その優位が不評であるところでは、世の中に広まっている道徳感情には、上に立つ者へのいらだたしい嫌悪が刻まれていることが多い。法律や世論が強いてきた行動規範、すべきこととすべきでないことの両方を決めたもう一つの大きな原理は、人々が、この世の主人や神々が好むと、または嫌うと信じるものに、へつらうことであった。このへつらいは本質的に利己的ではあるが、偽善ではない。まぎれもない嫌悪を生み、かつては魔術師や異端者を火あぶりにさせた。このように卑しい影響がいくつもあるなかで、社会の全体にとって明らかな利益も、むろん、道徳感情をかたちづくるうえで大きな役割を果たしてきた。ただし、その利益自体が理性的に考慮されたというより、そこから生まれた共感や反感の結果としてである。社会の利益とはほとんど、あるいはまったく関係のない共感や反感も、道徳が定まるときには、それと同じほどの力を発揮してきた。
  translation_status: reviewed
- id: ol-01-007
  section_id: ch-01
  kind: paragraph
  origin: source

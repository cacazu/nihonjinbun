    printed_page_end: '177'
    source_sequence: 119
  source_text: The principles asserted in these pages must be more generally admitted as the basis for discussion of details, before a consistent application of them to all the various departments of government and morals can be attempted with any prospect of advantage. The few observations I propose to make on questions of detail, are designed to illustrate the principles, rather than to follow them out to their consequences. I offer, not so much applications, as specimens of application; which may serve to bring into greater clearness the meaning and limits of the two maxims which together form the entire doctrine of this Essay, and to assist the judgment in holding the balance between them, in the cases where it appears doubtful which of them is applicable to the case.
  translation_ja: 政府と道徳のさまざまな分野すべてに、ここで唱えた原理を一貫して当てはめ、何か益を期待するためには、まず細かい問題を議論する土台として、原理そのものが、もっと広く認められる必要がある。個々の問題についてこれからいくらか述べようと思うのは、原理をその帰結まで追うためではなく、原理を具体的に示すためだ。ここで示すのは、原理を全面的に適用した結果ではなく、その適用例である。両方を合わせて本論の教えのすべてをなす二つの格言が、何を意味し、どこまで及ぶかをいっそう明らかにし、どちらが当てはまるのか疑わしい場合に、両方をはかりにかけるうえで、判断の助けになるだろう。
  translation_status: reviewed
- id: ol-05-002
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:

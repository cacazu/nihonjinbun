    source_sequence: 90
  source_text: 'What is it that has hitherto preserved Europe from this lot? What has made the European family of nations an improving, instead of a stationary portion of mankind? Not any superior excellence in them, which, when it exists, exists as the effect, not as the cause; but their remarkable diversity of character and culture. Individuals, classes, nations, have been extremely unlike one another: they have struck out a great variety of paths, each leading to something valuable; and although at every period those who travelled in different paths have been intolerant of one another, and each would have thought it an excellent thing if all the rest could have been compelled to travel his road, their attempts to thwart each other''s development have rarely had any permanent success, and each has in time endured to receive the good which the others have offered. Europe is, in my judgment, wholly indebted to this plurality of paths for its progressive and many-sided development. But it already begins to possess this benefit in a considerably less degree. It is decidedly advancing towards the Chinese ideal of making all people alike. M. de Tocqueville, in his last important work, remarks how much more the Frenchmen of the present day resemble one another, than did those even of the last generation. The same remark might be made of Englishmen in a far greater degree. In a passage already quoted from Wilhelm von Humboldt, he points out two things as necessary conditions of human development, because necessary to render people unlike one another; namely, freedom, and variety of situations. The second of these two conditions is in this country every day diminishing. The circumstances which surround different classes and individuals, and shape their characters, are daily becoming more assimilated. Formerly, different ranks, different neighbourhoods, different trades and professions, lived in what might be called different worlds; at present, to a great degree in the same. Comparatively speaking, they now read the same things, listen to the same things, see the same things, go to the same places, have their hopes and fears directed to the same objects, have the same rights and liberties, and the same means of asserting them. Great as are the differences of position which remain, they are nothing to those which have ceased. And the assimilation is still proceeding.
    All the political changes of the age promote it, since they all tend to raise the low and to lower the high. Every extension of education promotes it, because education brings people under common influences, and gives them access to the general stock of facts and sentiments. Improvements in the means of communication promote it, by bringing the inhabitants of distant places into personal contact, and keeping up a rapid flow of changes of residence between one place and another. The increase of commerce and manufactures promotes it, by diffusing more widely the advantages of easy circumstances, and opening all objects of ambition, even the highest, to general competition, whereby the desire of rising becomes no longer the character of a particular class, but of all classes. A more powerful agency than even all these, in bringing about a general similarity among mankind, is the complete establishment, in this and other free countries, of the ascendency of public opinion in the State. As the various social eminences which enabled persons entrenched on them to disregard the opinion of the multitude, gradually become levelled; as the very idea of resisting the will of the public, when it is positively known that they have a will, disappears more and more from the minds of practical politicians; there ceases to be any social support for non-conformity—any substantive power in society, which, itself opposed to the ascendency of numbers, is interested in taking under its protection opinions and tendencies at variance with those of the public.'
  translation_ja: これまでヨーロッパをこの運命から守ったのは何か。ヨーロッパ諸国を、人類の止まっている部分でなく、進歩する部分にしたのは何か。それはヨーロッパそのものの何かすぐれた性質ではない。そういう性質がある場合も、それは原因でなく結果である。原因は、ヨーロッパの人柄と文化が目を見張るほど多様なことだ。個人、階層、国民は、互いにきわめて違った。道をさまざまに切り開き、どの道も何か価値あるものに通じた。どの時代にも、違う道を行く者同士は不寛容で、ほかの皆に自分の道を歩ませられたら申し分ないと思っただろうが、互いの発達を妨げる試みが、長く成功することはほとんどなかった。そのうちには、誰もがほかの道からもたらされる利益を、しぶしぶながら受け入れるようになった。私の考えでは、ヨーロッパの進歩と多面的な発達は、ひとえにこの道の多さのおかげである。だが今や、この利益はかなり減りはじめている。人をみな同じにするという中国の理想に、着実に向かっている。トクヴィル氏は最後の主要な著作で、今のフランス人は、ほんの一世代前よりも、どれほど互いによく似ているかを指摘する。イングランド人については、ずっと強い意味で同じことが言えるだろう。先ほど引いたヴィルヘルム・フォン・フンボルトの文章で、彼は人々が互いに異なるために必要であり、それゆえ人間の発達に必要な条件として、自由と、状況の多様さの二つを指摘している。この国では、二番目が日に日に失われている。階層や個人を取り囲み、その性格を形づくる事情が、日々似通っていく。以前には、身分や住む場所、商売や職業が違えば、それぞれ別世界といってよいところに暮らしていた。今は大体同じ世界である。比べてみれば、同じものを読み、同じものを聞き、同じものを見、同じ所に行き、同じものを望み、恐れ、同じ権利と自由を持ち、それを主張する手段も同じである。なお残る地位の違いは大きいが、なくなった違いと比べれば、何でもない。そして同質化はまだ進んでいる。時代の政治上の変化はすべて、低いところを上げ、高いところを下げる傾向があるから、それを促す。教育が広がるたびに、人々は共通の影響のもとに置かれ、広く共有される事実と感情に触れられるようになるので、それを促す。交通や通信の手段がよくなると、離れた土地の住民がじかに接し、ある土地から別の土地へ住みかを移す人の流れが速く途絶えなくなるので、それを促す。商工業が増すと、暮らしのゆとりがもたらす有利さが広まり、最も高いものまで、望みうる地位はすべて、誰もが競えるものになる。そのため上に行きたいという欲が一つの階層だけでなく、あらゆる階層の特徴になって、それを促す。これらすべてよりも、人のあいだの広い同質化をもたらす強い力は、わが国やほかの自由な国で、国家における世論の優位がまったく確立したことである。その上に身を固めれば大衆の意見を気にせずに済んだ、さまざまな社会的高みが、次第にならされていく。世間に確かに意志があると分かったとき、それに逆らうという考えそのものが、実務に当たる政治家の心からますます消えていく。人と違うことへの社会の支えは、なくなってしまう。数の優位に自ら反対して、世間と合わない意見や傾向を守ることに関心を持つ、実体のある力が、社会からなくなるのである。
  translation_status: reviewed
- id: ol-03-019

    printed_page_end: '109'
    source_sequence: 75
  source_text: 'Little, however, as people are accustomed to a doctrine like that of Von Humboldt, and surprising as it may be to them to find so high a value attached to individuality, the question, one must nevertheless think, can only be one of degree. No one''s idea of excellence in conduct is that people should do absolutely nothing but copy one another. No one would assert that people ought not to put into their mode of life, and into the conduct of their concerns, any impress whatever of their own judgment, or of their own individual character. On the other hand, it would be absurd to pretend that people ought to live as if nothing whatever had been known in the world before they came into it; as if experience had as yet done nothing towards showing that one mode of existence, or of conduct, is preferable to another. Nobody denies that people should be so taught and trained in youth, as to know and benefit by the ascertained results of human experience. But it is the privilege and proper condition of a human being, arrived at the maturity of his faculties, to use and interpret experience in his own way. It is for him to find out what part of recorded experience is properly applicable to his own circumstances and character. The traditions and customs of other people are, to a certain extent, evidence of what their experience has taught them; presumptive evidence, and as such, have a claim to his deference: but, in the first place, their experience may be too narrow; or they may not have interpreted it rightly. Secondly, their interpretation of experience may be correct, but unsuitable to him. Customs are made for customary circumstances, and customary characters: and his circumstances or his character may be uncustomary. Thirdly, though the customs be both good as customs, and suitable to him, yet to conform to custom, merely as custom, does not educate or develop in him any of the qualities which are the distinctive endowment of a human being. The human faculties of perception, judgment, discriminative feeling, mental activity, and even moral preference, are exercised only in making a choice. He who does anything because it is the custom, makes no choice. He gains no practice either in discerning or in desiring what is best. The mental and moral, like the muscular powers, are improved only by being used. The faculties are called into no exercise by doing
    a thing merely because others do it, no more than by believing a thing only because others believe it. If the grounds of an opinion are not conclusive to the person''s own reason, his reason cannot be strengthened, but is likely to be weakened by his adopting it: and if the inducements to an act are not such as are consentaneous to his own feelings and character (where affection, or the rights of others, are not concerned), it is so much done towards rendering his feelings and character inert and torpid, instead of active and energetic.'
  translation_ja: もっとも、フォン・フンボルトのような考えに人々がいかになじみなく、個性にこれほど高い値うちが認められているのを見て、いかに驚こうとも、問題はやはり程度の違いでしかないと思われる。人がまったく互いのまねしかしないのが、行動として立派だなどと考える人はいない。暮らし方や自分の事柄の取り扱いに、自分の判断や個人としての性格の跡を一切残すべきではない、と主張する人もいない。逆に、自分がこの世に生まれる前には、何一つ知られていなかったかのように、ある暮らし方、ある行い方が、別のものより望ましいと知るうえで、経験が何の役にも立っていなかったかのように、生きるべきだと唱えるのは、ばかげている。若いうちに、人類の経験から確かめられた結果を知り、それを役立てられるように教え、訓練すべきことは、誰も否定しない。だが能力の成熟した人には、自分なりに経験を使い、自分なりに解釈することが、特権であり当然の状態である。記録された経験のどの部分が、自らの事情や性格に適切に当てはまるかは、自ら見つけるべきものだ。他人の伝統や慣習は、ある程度、その人たちの経験が教えたことを示す証拠となる。間接的な証拠であり、それとして尊重に値する。ただし第一に、その人たちの経験はあまりに狭いか、正しく解釈されていないかもしれない。第二に、経験の解釈は正しくても、本人には合わないかもしれない。慣習ができるのは、ありふれた事情やありふれた性格に合わせてである。ある人の事情や性格は、ありふれてはいないかもしれない。第三に、慣習としてよく、当人にも合っているとしても、単に慣習だから従うのでは、人間に特有の能力は何一つ鍛えられず、発達しない。ものを見る力、判断する力、感じとって見分ける力、精神の活動、さらに道徳的にどちらを選ぶかを決める力まで、人の力は何かを選ぶときにしか使われない。慣習であるからそうする人は、何も選んでいない。何が最善かを見分ける練習も、それを望む練習もできない。筋力と同じで、知性や道徳の力は使って初めて伸びる。ただ他人がするからという理由で行動しても、ただ他人が信じるからという理由で信じても、能力はまったく使われない。ある意見の根拠が自分自身の理性を納得させないなら、その意見を採り入れても、自分の理性は強められず、かえって弱まりそうである。また、行動への誘いが、ほかの人への愛情や権利が関係していない場合に、自分自身の感情や性格に沿うものでないなら、感情や性格を活発で力あるものにするのでなく、鈍く、動きのないものに近づける。
  translation_status: reviewed

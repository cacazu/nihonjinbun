    precision: page
    printed_page: '56'
    printed_page_end: '61'
    source_sequence: 40
  source_text: 'These, indeed, are but rags and remnants of persecution, and may be thought to be not so much an indication of the wish to persecute, as an example of that very frequent infirmity of English minds, which makes them take a preposterous pleasure in the assertion of a bad principle, when they are no longer bad enough to desire to carry it really into practice. But unhappily there is no security in the state of the public mind, that the suspension of worse forms of legal persecution, which has lasted for about the space of a generation, will continue. In this age the quiet surface of routine is as often ruffled by attempts to resuscitate past evils, as to introduce new benefits. What is boasted of at the present time as the revival of religion, is always, in narrow and uncultivated minds, at least as much the revival of bigotry; and where there is the strong permanent leaven of intolerance in the feelings of a people, which at all times abides in the middle classes of this country, it needs but little to provoke them into actively persecuting those whom they have never ceased to think proper objects of persecution.[10] For it is this—it is the opinions men entertain, and the feelings they cherish, respecting those who disown the beliefs they deem important, which makes this country not a place of mental freedom. For a long time past, the chief mischief of the legal penalties is that they strengthen the social stigma. It is that stigma which is really effective, and so effective is it that the profession of opinions which are under the ban of society is much less common in England, than is, in many other countries, the avowal of those which incur risk of judicial punishment. In respect to all persons but those whose pecuniary circumstances make them independent of the good will of other people, opinion, on this subject, is as efficacious as law; men might as well be imprisoned, as excluded from the means of earning their bread. Those whose bread is already secured, and who desire no favours from men in power, or from bodies of men, or from the public, have nothing to fear from the open avowal of any opinions, but to be ill-thought of and ill-spoken of, and this it ought not to require a very heroic mould to enable them to bear. There is no room for any appeal ad misericordiam in behalf of such persons. But though we do not now inflict so much evil on
    those who think differently from us, as it was formerly our custom to do, it may be that we do ourselves as much evil as ever by our treatment of them. Socrates was put to death, but the Socratic philosophy rose like the sun in heaven, and spread its illumination over the whole intellectual firmament. Christians were cast to the lions, but the Christian church grew up a stately and spreading tree, overtopping the older and less vigorous growths, and stifling them by its shade. Our merely social intolerance kills no one, roots out no opinions, but induces men to disguise them, or to abstain from any active effort for their diffusion. With us, heretical opinions do not perceptibly gain, or even lose, ground in each decade or generation; they never blaze out far and wide, but continue to smoulder in the narrow circles of thinking and studious persons among whom they originate, without ever lighting up the general affairs of mankind with either a true or a deceptive light. And thus is kept up a state of things very satisfactory to some minds, because, without the unpleasant process of fining or imprisoning anybody, it maintains all prevailing opinions outwardly undisturbed, while it does not absolutely interdict the exercise of reason by dissentients afflicted with the malady of thought. A convenient plan for having peace in the intellectual world, and keeping all things going on therein very much as they do already. But the price paid for this sort of intellectual pacification, is the sacrifice of the entire moral courage of the human mind. A state of things in which a large portion of the most active and inquiring intellects find it advisable to keep the genuine principles and grounds of their convictions within their own breasts, and attempt, in what they address to the public, to fit as much as they can of their own conclusions to premises which they have internally renounced, cannot send forth the open, fearless characters, and logical, consistent intellects who once adorned the thinking world. The sort of men who can be looked for under it, are either mere conformers to commonplace, or time-servers for truth, whose arguments on all great subjects are meant for their hearers, and are not those which have convinced themselves. Those who avoid this alternative, do so by narrowing their thoughts and interest to things which can be spoken of without venturing
    within the region of principles, that is, to small practical matters, which would come right of themselves, if but the minds of mankind were strengthened and enlarged, and which will never be made effectually right until then: while that which would strengthen and enlarge men''s minds, free and daring speculation on the highest subjects, is abandoned.'
  translation_ja: たしかに、これは迫害のぼろ切れや残りかすにすぎない。迫害したいという気持ちの現れというより、イングランド人の心によくある弱点の一例に思えるかもしれない。悪い原則を実行に移したいほどにはもう悪くないのに、それを唱えることにはばかげた喜びを感じるという弱点である。だが残念ながら、世間の気持ちのありようを見れば、この一世代ほど続いた、もっと悪質な法的迫害の中断が続く保証はない。今の時代、何事もなく慣習が流れる水面は、新しい利益を持ち込もうとするときとほとんど同じくらい、昔の害悪をよみがえらせようとしても波立つ。今日、宗教の復興として誇られているものは、心の狭い、教養のない人にあっては、いつも少なくともそれと同じくらい偏狭な信仰の復興である。国民の感情の中に不寛容という強くしぶとい酵母が残っているところでは、この国では中産階級にいつも残っているが、彼らが迫害して当然だと思い続けてきた人々を実際に迫害するには、わずかな刺激で足りる。[10] この国が精神の自由な場所でないのは、まさにこれ、自分たちが大切とみなす信仰を拒む者に対して、人々がどんな意見を抱き、どんな感情を育てるかのためだ。長いこと、法による罰のおもな害は、社会から押される烙印を強めることにある。実際に効くのはその烙印であり、効果はあまりに大きい。イングランドで世間に禁じられた意見を公言する人がいるのは、ほかの多くの国で裁判による罰を受けかねない意見を公言する人がいるより、はるかにまれである。金銭面で人の好意に頼らずに済む人を除いて、この問題で世論は法と同じくらい効き目がある。生計を立てる手段から締め出されるくらいなら、牢に入れられるのと変わらない。生活の糧はもう確保され、権力者や人々の集団や世間の引き立てを望まない者には、どんな意見を公にしても、悪く思われ悪く言われることのほかに、恐れるものはない。これを耐えぬくのに、さほど英雄的な性格は要らないはずだ。こうした人々を憐れんでくれと訴える余地はない。かつての習わしほどには、考えを異にする人々に害を加えなくなっても、その扱いによって私たち自身が受ける害は、昔に劣らないかもしれない。ソクラテスは死刑となったが、その哲学は空に昇る太陽のように現れ、知の世界全体を照らした。キリスト教徒はライオンの餌にされたが、キリストの教会は堂々と枝を広げる木に育ち、古くて勢いのない木々より高くそびえ、陰でそれらを枯らした。今の社会上の不寛容は、誰も殺さず、何の意見も根絶やしにはしないが、人々に意見を隠させ、広めるために進んで働きかけるのをやめさせる。この国では、異端とされる意見は、十年たとうが一世代たとうが、目に見えて勢いを増しも減らしもしない。遠く広く燃え上がることもなく、その意見が生まれた、考え、学ぶ人の狭い輪の中でくすぶりつづける。本当の光も、偽りの光も、人の世全体に投げかけない。こうして保たれる状態は、一部の人にはまことに満足のゆくものだ。罰金を取ったり投獄したりする嫌な手続きをせずに、世に通用する意見の表向きの平穏を守り、しかも考えるという病気にかかった異論者が理性を働かせることを、絶対には禁じないのだから。知の世界の平和を保ち、万事をおおむね今のまま動かしていくのに便利な方法である。しかし、このような知の平和の代価として、人間の精神は道徳的な勇気のすべてを失う。最も活発で探究心のある知性の多くが、自分の信念の本当の原理や理由は胸の内にしまっておき、世間に語るときは、心の内では捨てた前提に、自分の結論をなんとか当てはめるほうが得策と考える。そのような状態から、かつて思想の世界を飾ったような、率直で怖じない人物、論理的で一貫した知性は出ない。望めるのはありふれた意見に迎合するだけの人か、真理について世情しだいで話を変える人、どんな大きな問題でも聞く人に合わせて議論をつくり、自分自身を納得させた議論は語らない人だけだ。その二者択一を逃れる人は、原理の領域に踏み込まずに話せること、つまり小さな実際上の問題に、考えと関心を狭める。人の心が強く広くなれば、おのずと解決するような問題であり、そのときまで本当には解決できない問題である。それなのに、まさに人の心を強く広くするもの、最も重大な問題について自由に大胆に考えることが、見捨てられるのだ。

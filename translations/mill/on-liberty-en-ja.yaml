    printed_page_end: '31'
    source_sequence: 23
  source_text: It is necessary to consider separately these two hypotheses, each of which has a distinct branch of the argument corresponding to it. We can never be sure that the opinion we are endeavouring to stifle is a false opinion; and if we were sure, stifling it would be an evil still.
  translation_ja: この二つの場合は、議論の別々の筋に対応するので、分けて考える必要がある。私たちが押しつぶそうとする意見が誤っていると、確信することは決してできない。たとえ確信できても、押しつぶすことはやはり害である。
  translation_status: reviewed
- id: ol-02-003
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '31'
    printed_page_end: '32'
    source_sequence: 24
  source_text: 'First: the opinion which it is attempted to suppress by authority may possibly be true. Those who desire to suppress it, of course deny its truth; but they are not infallible. They have no authority to decide the question for all mankind, and exclude every other person from the means of judging. To refuse a hearing to an opinion, because they are sure that it is false, is to assume that their certainty is the same thing as absolute certainty. All silencing of discussion is an assumption of infallibility. Its condemnation may be allowed to rest on this common argument, not the worse for being common.'
  translation_ja: 第一に、権力で押さえつけようとする意見が、真実であるかもしれない。抑圧したい人々はむろん、それが真実だとは認めない。だが彼らは絶対に誤らないわけではない。全人類に代わって問題を決め、ほかの誰からも判断の手段を奪ってよい権限はない。その意見が誤りだと確信しているから、聞くことさえ拒むのは、自分たちの確信を絶対の確かさと同じものとみなすことだ。議論を封じるのは、どんな場合も、自分は誤りえないと決めてかかることである。それを非難する根拠は、このありふれた議論で足りよう。ありふれているからといって、少しも力が落ちるわけではない。
  translation_status: reviewed
- id: ol-02-004
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '32'
    printed_page_end: '33'
    source_sequence: 25
  source_text: 'Unfortunately for the good sense of mankind, the fact of their fallibility is far from carrying the weight in their practical judgment, which is always allowed to it in theory; for while every one well knows himself to be fallible, few think it necessary to take any precautions against their own fallibility, or admit the supposition that any opinion, of which they feel very certain, may be one of the examples of the error to which they acknowledge themselves to be liable. Absolute princes, or others who are accustomed to unlimited deference, usually feel this complete confidence in their own opinions on nearly all subjects. People more happily situated, who sometimes hear their opinions disputed, and are not wholly unused to be set right when they are wrong, place the same unbounded reliance only on such of their opinions as are shared by all who surround them, or to whom they habitually defer: for in proportion to a man''s want of confidence in his own solitary judgment, does he usually repose, with implicit trust, on the infallibility of "the world" in general. And the world, to each individual, means the part of it with which he comes in contact; his party, his sect, his church, his class of society: the man may be called, by comparison, almost liberal and large-minded to whom it means anything so comprehensive as his own country or his own age. Nor is his faith in this collective authority at all shaken by his being aware that other ages, countries, sects, churches, classes, and parties have thought, and even now think, the exact reverse. He devolves upon his own world the responsibility of being in the right against the dissentient worlds of other people; and it never troubles him that mere accident has decided which of these numerous worlds is the object of his reliance, and that the same causes which make him a Churchman in London, would have made him a Buddhist or a Confucian in Pekin. Yet it is as evident in itself as any amount of argument can make it, that ages are no more infallible than individuals; every age having held many opinions which subsequent ages have deemed not only false but absurd; and it is as certain that many opinions, now general, will be rejected by future ages, as it is that many, once general, are rejected by the present.'
  translation_ja: 人間の分別にとって残念なことに、誰にも誤りはあるという事実は、理屈ではいつも認められるほどには、実際の判断で重く見られない。誰でも、自分は間違うことがある、とよく知っている。だが自分の誤りに備える必要があると思ったり、間違うことはあると自分でも認めているのだから、自信のあるその意見が実は一つの誤りかもしれないと考えたりする人は少ない。絶対君主など、限りなく敬意を払われるのに慣れた人は、たいていほとんどあらゆる問題について、自分の意見にこの完全な自信を抱く。もう少し幸いな境遇にあり、ときには自分の意見に異を唱える声を聞き、間違いを直されることにもまったく慣れていないわけではない人は、まわりの皆が共有するか、自分が日ごろ尊敬している人たちが共有する意見についてだけ、この同じ無限の信頼を置く。というのも普通、人は自分ひとりの判断に自信がないほど、「世の中」全体は間違えないと、無条件に信じこむからだ。しかも一人ひとりにとって世の中とは、実際に接する一部分、自分の党派、宗派、教会、社会階層のことだ。自分の国や生きる時代ほども広い範囲を指す人なら、比べてみれば、ほとんど寛容で心が広いと言ってよい。それに、ほかの時代、国、宗派、教会、階層、党派が正反対に考えてきたし、今もそう考えていると知っても、この集団の権威への信頼は少しも揺るがない。別の人々が属する、異論を唱える別の世界に対して、自分の世界のほうが正しいことを保証する役目は、自分の世界に任せておく。そして、こうしたいくつもの世界のうちどれを信頼することになったかなど、たまたまそうなっただけで、自分をロンドンで国教会の信徒にしたのと同じ事情が、北京なら、自分を仏教徒か儒教徒にしていたはずだ、ということは全然気にかけない。だがいくら議論を重ねてもそれ以上明らかにはならないほど、もともと明らかなことがある。個人と同じく、時代も誤りを免れない。どの時代も、後の時代には誤りどころかばかげていると思われる意見をいくつも持ってきた。かつて通用した多くの意見が今では退けられているのと同じように、今通用している意見の多くが後の時代に退けられることは確実である。
  translation_status: reviewed
- id: ol-02-005
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en

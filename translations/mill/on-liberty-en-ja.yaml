    precision: page
    printed_page: '113'
    printed_page_end: '115'
    source_sequence: 78
  source_text: 'In some early states of society, these forces might be, and were, too much ahead of the power which society then possessed of disciplining and controlling them. There has been a time when the element of spontaneity and individuality was in excess, and the social principle had a hard struggle with it. The difficulty then was, to induce men of strong bodies or minds to pay obedience to any rules which required them to control their impulses. To overcome this difficulty, law and discipline, like the Popes struggling against the Emperors, asserted a power over the whole man, claiming to control all his life in order to control his character—which society had not found any other sufficient means of binding. But society has now fairly got the better of individuality; and the danger which threatens human nature is not the excess, but the deficiency, of personal impulses and preferences. Things are vastly changed, since the passions of those who were strong by station or by personal endowment were in a state of habitual rebellion against laws and ordinances, and required to be rigorously chained up to enable the persons within their reach to enjoy any particle of security. In our times, from the highest class of society down to the lowest, every one lives as under the eye of a hostile and dreaded censorship. Not only in what concerns others, but in what concerns only themselves, the individual, or the family, do not ask themselves—what do I prefer? or, what would suit my character and disposition? or, what would allow the best and highest in me to have fair-play, and enable it to grow and thrive? They ask themselves, what is suitable to my position? what is usually done by persons of my station and pecuniary circumstances? or (worse still) what is usually done by persons of a station and circumstances superior to mine? I do not mean that they choose what is customary, in preference to what suits their own inclination. It does not occur to them to have any inclination, except for what is customary. Thus the mind itself is bowed to the yoke: even in what people do for pleasure, conformity is the first thing thought of; they like in crowds; they exercise choice only among things commonly done: peculiarity of taste, eccentricity of conduct, are shunned equally with crimes: until by dint of not following their own nature, they have no nature to follow: their
    human capacities are withered and starved: they become incapable of any strong wishes or native pleasures, and are generally without either opinions or feelings of home growth, or properly their own. Now is this, or is it not, the desirable condition of human nature?'
  translation_ja: 社会がまだ発達していないころには、こうした力が、社会に備わっていた、それを律し抑える力を大きく上回ることがありえたし、実際そうなったこともある。自発性と個性という要素が強すぎて、社会を成り立たせる原理が、それと大変な闘いをしなければならない時代があった。当時難しかったのは、身体や心に力のある人に、自らの衝動を抑えるよう求める規則なら何であれ、それに従わせることだった。この難しさを克服するために、皇帝と争う教皇たちのように、法律と規律は人間の全体に及ぶ権力を主張した。人の性格を律するために、生活全体を支配してよいと求めたのである。社会はほかに性格を十分に律する手段を見つけられずにいた。ところが今や、社会はすっかり個性に勝った。人の本性を脅かす危険は、一人ひとりの衝動や好みが多すぎることでなく、足りないことだ。地位のため、または生まれつきの資質のために強かった人々の情念が、法律や規則にいつも反抗していて、手の届く範囲にいる人々がわずかでも安全を保つには、厳しく縛っておく必要のあったころとは、事情が大きく変わった。今の時代、社会の最高の階層から最低の階層まで、誰もが敵意を抱く恐ろしい監視の目の下にいるかのように暮らす。他人に関わることだけでなく、自分たちだけに関わることでも、個人は、あるいは家族は、自分は何を好むか、自分の性格と気質には何が合うか、自分の中の最もよい面、高い面を何なら伸び伸び発揮させ、育ち栄えさせられるか、とは問わない。自分の地位にふさわしいことは何か、自分と同じ地位と経済状態の人はたいてい何をするか、悪くすると、自分より地位も経済状態も上の人はたいてい何をするか、と問う。自分の好みに合うことより、習わしに合うことを選ぶ、と言いたいのではない。習わしに合うことのほかは、何かを好むこと自体、思いもよらないのだ。こうして心そのものが軛の下に頭を垂れる。楽しみのためにすることですら、まず考えるのは、人と同じであることだ。大勢と一緒になって好み、皆がすることの間でしか選ばない。人と違う趣味や風変わりな行いは、罪と同じほど避けられる。自分の本性に従わずにいるあまり、ついには従える本性がなくなる。人間としての力はしなび、やせ細る。強い願いも、自然にわく喜びも持てなくなり、自分の内に育った、自分のものと言える意見も気持ちも、たいていは持たなくなる。さて、これが、人間の本性にとって望ましい状態だろうか、そうではないのだろうか。
  translation_status: reviewed

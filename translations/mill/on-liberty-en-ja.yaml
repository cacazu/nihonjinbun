    source_sequence: 79
  source_text: 'It is so, on the Calvinistic theory. According to that, the one great offence of man is Self-will. All the good of which humanity is capable, is comprised in Obedience. You have no choice; thus you must do, and no otherwise: "whatever is not a duty, is a sin." Human nature being radically corrupt, there is no redemption for any one until human nature is killed within him. To one holding this theory of life, crushing out any of the human faculties, capacities, and susceptibilities, is no evil: man needs no capacity, but that of surrendering himself to the will of God: and if he uses any of his faculties for any other purpose but to do that supposed will more effectually, he is better without them. That is the theory of Calvinism; and it is held, in a mitigated form, by many who do not consider themselves Calvinists; the mitigation consisting in giving a less ascetic interpretation to the alleged will of God; asserting it to be his will that mankind should gratify some of their inclinations; of course not in the manner they themselves prefer, but in the way of obedience, that is, in a way prescribed to them by authority; and, therefore, by the necessary conditions of the case, the same for all.'
  translation_ja: カルヴァン主義によれば、望ましい。そこでは、人が犯す一つの大きな罪は、自分の意志を通すことだ。人がなしうる善はすべて服従に含まれる。選ぶ余地はない。こうすべきで、ほかの仕方でしてはならない。「義務でないことは何であれ罪である。」人の本性は根本から腐敗しているので、自分の内の人間性を殺すまでは、誰も救われない。このような人生観をとる人には、人に備わる能力や可能性、感受性のどれをつぶしても悪いことではない。人に必要な力は自分を神の意志にゆだねる力だけだ。神の意志とされるものをうまく実行する以外の目的のために、自らの能力の何かを使うのなら、その能力はないほうがましだ。これがカルヴァン主義の考え方であり、自らカルヴァン派とは思っていない人の多くが、緩めた形で信じている。緩めるといっても、神の意志とされるものを以前ほど禁欲的には解釈しないということにある。人間が自分の欲することの一部を満たすのも神の意志であると主張する。ただし当然、自分の好むやり方でなく、服従の仕方で、つまり権威が定めたやり方で、したがって事の性質上、誰にも同じやり方で、である。
  translation_status: reviewed

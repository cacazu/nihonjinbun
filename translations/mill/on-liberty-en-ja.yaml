    precision: page
    printed_page: '18'
    printed_page_end: '19'
    source_sequence: 14
  source_text: It is, perhaps, hardly necessary to say that this doctrine is meant to apply only to human beings in the maturity of their faculties. We are not speaking of children, or of young persons below the age which the law may fix as that of manhood or womanhood. Those who are still in a state to require being taken care of by others, must be protected against their own actions as well as against external injury. For the same reason, we may leave out of consideration those backward states of society in which the race itself may be considered as in its nonage. The early difficulties in the way of spontaneous progress are so great, that there is seldom any choice of means for overcoming them; and a ruler full of the spirit of improvement is warranted in the use of any expedients that will attain an end, perhaps otherwise unattainable. Despotism is a legitimate mode of government in dealing with barbarians, provided the end be their improvement, and the means justified by actually effecting that end. Liberty, as a principle, has no application to any state of things anterior to the time when mankind have become capable of being improved by free and equal discussion. Until then, there is nothing for them but implicit obedience to an Akbar or a Charlemagne, if they are so fortunate as to find one. But as soon as mankind have attained the capacity of being guided to their own improvement by conviction or persuasion (a period long since reached in all nations with whom we need here concern ourselves), compulsion, either in the direct form or in that of pains and penalties for non-compliance, is no longer admissible as a means to their own good, and justifiable only for the security of others.
  translation_ja: おそらく断るまでもないが、この原理が当てはまると考えているのは、能力が成熟した人に限られる。子どもや、法律の定める成人年齢に達していない若者について語っているのではない。他人の世話をまだ必要とする人は、外からの害だけでなく、自分の行動が招く害からも守られなくてはならない。同じ理由から、人々の集団そのものがまだ未成年と見なしうる、発達の遅れた社会も考慮の外に置いてよい。おのずから進歩していく道の初めには、あまりにも大きな困難があり、それを乗り越える手段はめったに選べない。改革に熱心な統治者が、ほかの方法ではかなわないかもしれない目的を達するため、成果の上がる手段ならどれを取っても正当である。いわゆる野蛮な人々を扱う場合、目的がその人々の向上であり、現にそれを成し遂げることで手段が正当化されるかぎり、専制も正当な統治の仕方である。原理としての自由は、人々が自由かつ対等な議論を通して自らを向上させることができるようになる以前には、どのような状態にも当てはまらない。それまでは、幸いアクバルやシャルルマーニュのような統治者が見つかれば、無条件に従うほかに何もない。だが人々が、納得や説得を通して自らの向上へ導かれる力をひとたび得れば、ここで考慮すべき国はどこもとうにその段階に達しているが、直接の強制も、従わない者に苦痛や罰を課す形の強制も、もはや本人のための手段としては許されず、他人の安全のためにしか正当化できない。
  translation_status: reviewed
- id: ol-01-011
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '19'
    printed_page_end: '21'
    source_sequence: 15
  source_text: 'It is proper to state that I forego any advantage which could be derived to my argument from the idea of abstract right, as a thing independent of utility. I regard utility as the ultimate appeal on all ethical questions; but it must be utility in the largest sense, grounded on the permanent interests of man as a progressive being. Those interests, I contend, authorise the subjection of individual spontaneity to external control, only in respect to those actions of each, which concern the interest of other people. If any one does an act hurtful to others, there is a primâ facie case for punishing him, by law, or, where legal penalties are not safely applicable, by general disapprobation. There are also many positive acts for the benefit of others, which he may rightfully be compelled to perform; such as, to give evidence in a court of justice; to bear his fair share in the common defence, or in any other joint work necessary to the interest of the society of which he enjoys the protection; and to perform certain acts of individual beneficence, such as saving a fellow-creature''s life, or interposing to protect the defenceless against ill-usage, things which whenever it is obviously a man''s duty to do, he may rightfully be made responsible to society for not doing. A person may cause evil to others not only by his actions but by his inaction, and in either case he is justly accountable to them for the injury. The latter case, it is true, requires a much more cautious exercise of compulsion than the former. To make any one answerable for doing evil to others, is the rule; to make him answerable for not preventing evil, is, comparatively speaking, the exception. Yet there are many cases clear enough and grave enough to justify that exception. In all things which regard the external relations of the individual, he is de jure amenable to those whose interests are concerned, and if need be, to society as their protector. There are often good reasons for not holding him to the responsibility; but these reasons must arise from the special expediencies of the case: either because it is a kind of case in which he is on the whole likely to act better, when left to his own discretion, than when controlled in any way in which society have it in their power to control him; or because the attempt to exercise control would produce other evils, greater than those
    which it would prevent. When such reasons as these preclude the enforcement of responsibility, the conscience of the agent himself should step into the vacant judgment seat, and protect those interests of others which have no external protection; judging himself all the more rigidly, because the case does not admit of his being made accountable to the judgment of his fellow-creatures.'
  translation_ja: 私は、効用とは別個の抽象的な権利という考えを持ち出して、議論を有利にするつもりはない。このことを断っておくのがよいだろう。あらゆる倫理上の問いで最後に頼るのは効用だと私は考える。だがそれは最も広い意味での効用、進歩する存在としての人間の永続的な利益に根ざすものでなくてはならない。私の主張では、その利益を根拠に、個人の自発性を外からの統制に従わせることが許されるのは、個人の行為が他人の利益に関わるときだけである。誰かが他人に害を与える行為をしたなら、まずは処罰する理由が成り立つ。法律で罰するか、法の処罰を安全に適用できないときは、社会の非難をもってする。他人のために、何かを実際に行うよう強いるのも、正当な場合が多い。たとえば法廷で証言すること。共同の防衛、あるいは、自らも保護を受けている社会の利益に欠かせない他の共同作業で、公平な負担を引き受けること。人の命を救い、無抵抗の人がひどい仕打ちを受けるところに割って入るといった、他人を個人として助ける行いをすること。このようなことが明らかにその人の義務であるなら、しなかった場合に社会に対して責任を負わせるのは正当である。人は、自分がしたことでばかりでなく、しなかったことでも他人に害を与えることがあり、どちらの場合も、害を受けた人に責任を負うのは当然である。もっとも、後者で強制を行うときは、前者よりはるかに慎重でなくてはならない。他人を害したことについて責任を問うのが原則であり、害を防がなかったことの責任を問うのは、比較していえば例外である。とはいえ、その例外が正当になるほど明らかで重大な場合はいくらもある。個人と他人との関係に関わるあらゆる事柄について、個人は当然、利害の関わる人々に対して、必要ならばその保護者である社会に対して、責任を負う。その責任を実際には問わない、もっともな理由もよくある。ただしそれは、その事例特有の実際上の事情から生じるものでなくてはならない。社会が実行できるどのような統制を加えるよりも、本人の判断にゆだねたほうが、全体としてよりよい行動をする見込みがある場合か、統制を加えようとすると、それで防げるよりも大きな別の害を生む場合である。このような理由で責任を問えないなら、行為する本人の良心が、空いている裁きの座に就いて、外からは守られない他人の利益を守るべきである。ほかの人の裁きに服させることはできないのだから、それだけいっそう厳しく自分を裁かなければならない。
  translation_status: reviewed
- id: ol-01-012
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

  source_text: A further question is, whether the State, while it permits, should nevertheless indirectly discourage conduct which it deems contrary to the best interests of the agent; whether, for example, it should take measures to render the means of drunkenness more costly, or add to the difficulty of procuring them, by limiting the number of the places of sale. On this as on most other practical questions, many distinctions require to be made. To tax stimulants for the sole purpose of making them more difficult to be obtained, is a measure differing only in degree from their entire prohibition; and would be justifiable only if that were justifiable. Every increase of cost is a prohibition, to those whose means do not come up to the augmented price; and to those who do, it is a penalty laid on them for gratifying a particular taste. Their choice of pleasures, and their mode of expending their income, after satisfying their legal and moral obligations to the State and to individuals, are their own concern, and must rest with their own judgment. These considerations may seem at first sight to condemn the selection of stimulants as special subjects of taxation for purposes of revenue. But it must be remembered that taxation for fiscal purposes is absolutely inevitable; that in most countries it is necessary that a considerable part of that taxation should be indirect; that the State, therefore, cannot help imposing penalties, which to some persons may be prohibitory, on the use of some articles of consumption. It is hence the duty of the State to consider, in the imposition of taxes, what commodities the consumers can best spare; and à fortiori, to select in preference those of which it deems the use, beyond a very moderate quantity, to be positively injurious. Taxation, therefore, of stimulants, up to the point which produces the largest amount of revenue (supposing that the State needs all the revenue which it yields) is not only admissible, but to be approved of.
  translation_ja: さらに、国家は、本人の最善の利益に反すると思う行動も許すが、その一方で、間接には控えるよう仕向けるべきだろうか。たとえば、酔うための手段を高価にするか、売る場所の数を制限して手に入れにくくする措置を取るべきだろうか。この問題も、大半の実際上の問題と同じく、いくつも区別しなくてはならない。酒などを手に入れにくくするというただ一つの目的で課税するのは、完全な禁止と程度の違いしかない。禁止が正当な場合にしか、正当でないだろう。値段を上げるたび、新しい値段を払う資力のない人にとっては禁止になる。払える人にとっては、特定の好みを満たすことに課された罰になる。国家と個人に対する法的・道徳的な義務を果たしたあとの楽しみの選び方と所得の使い方は、本人の事柄であり、自分の判断に任せなくてはならない。こう考えると、一見したところ、歳入のため酒などを特別に課税の対象に選ぶことも、非難すべきように思われるかもしれない。だが税収のための課税はどうしても避けられず、大抵の国では、その相当部分を間接税にせざるをえない。したがって国家は、消費財のいくつかを使うことに、負担を課さないではいられない。それが一部の人には禁止になることもある。だから国家には、税を課す際、どの商品なら消費者が最も手放しやすいかを考える義務がある。まして、ごく控えめな量を超えて使えば明らかに有害だと考えるものを優先して選ぶべきである。したがって酒などへの課税は、国がそこからの税収をすべて必要とするなら、その税収が最大になる税率までは、認めてよいだけでなく、賛成すべきである。
  translation_status: reviewed

    printed_page_end: '123'
    source_sequence: 84
  source_text: 'I insist thus emphatically on the importance of genius, and the necessity of allowing it to unfold itself freely both in thought and in practice, being well aware that no one will deny the position in theory, but knowing also that almost every one, in reality, is totally indifferent to it. People think genius a fine thing if it enables a man to write an exciting poem, or paint a picture. But in its true sense, that of originality in thought and action, though no one says that it is not a thing to be admired, nearly all, at heart, think that they can do very well without it. Unhappily this is too natural to be wondered at. Originality is the one thing which unoriginal minds cannot feel the use of. They cannot see what it is to do for them: how should they? If they could see what it would do for them, it would not be originality. The first service which originality has to render them, is that of opening their eyes: which being once fully done, they would have a chance of being themselves original. Meanwhile, recollecting that nothing was ever yet done which some one was not the first to do, and that all good things which exist are the fruits of originality, let them be modest enough to believe that there is something still left for it to accomplish, and assure themselves that they are more in need of originality, the less they are conscious of the want.'
  translation_ja: 天才が大切で、考えることでも実際の行動でも、それが自由に開花するのを許さなければならないと、これほど強調するのは、理屈では誰も否定しないとよく知りながら、実際には、ほとんど誰も関心を持たないと知っているからだ。刺激的な詩を書ける、絵を描ける、そういう人が出るのなら、世間は天才を立派なものと思う。だが本当の意味での天才、すなわち思想と行動における独創性となると、称賛に値しないと言う者こそいないが、ほとんど誰もが腹の底では、そんなものはなくても十分やっていけると思っている。残念ながら、これはあまりに自然で、驚くにもあたらない。独創性こそ、独創性のない心には役立つと感じられないものだ。それが自分に何をしてくれるか見えない。どうして見えるだろう。見えるとすれば、独創とは呼べないではないか。独創性がそういう人のためにまず果たす役目は、目を開かせることである。すっかり目が開けば、自分も独創的になれる機会がある。それまでは、誰かが最初にしたのでないことは一つもなく、今ある善いものはすべて独創性の実りだと思い出し、独創性にはまだなすべきことが残っていると信じるだけの謙虚さを持ってほしい。そして、それが足りないと気づかない人ほど、独創性をいっそう必要としているのだと、心に留めてほしい。
  translation_status: reviewed
- id: ol-03-013
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '123'
    printed_page_end: '126'
    source_sequence: 85
  source_text: 'In sober truth, whatever homage may be professed, or even paid, to real or supposed mental superiority, the general tendency of things throughout the world is to render mediocrity the ascendant power among mankind. In ancient history, in the middle ages, and in a diminishing degree through the long transition from feudality to the present time, the individual was a power in himself; and if he had either great talents or a high social position, he was a considerable power. At present individuals are lost in the crowd. In politics it is almost a triviality to say that public opinion now rules the world. The only power deserving the name is that of masses, and of governments while they make themselves the organ of the tendencies and instincts of masses. This is as true in the moral and social relations of private life as in public transactions. Those whose opinions go by the name of public opinion, are not always the same sort of public: in America they are the whole white population; in England, chiefly the middle class. But they are always a mass, that is to say, collective mediocrity. And what is a still greater novelty, the mass do not now take their opinions from dignitaries in Church or State, from ostensible leaders, or from books. Their thinking is done for them by men much like themselves, addressing them or speaking in their name, on the spur of the moment, through the newspapers. I am not complaining of all this. I do not assert that anything better is compatible, as a general rule, with the present low state of the human mind. But that does not hinder the government of mediocrity from being mediocre government. No government by a democracy or a numerous aristocracy, either in its political acts or in the opinions, qualities, and tone of mind which it fosters, ever did or could rise above mediocrity, except in so far as the sovereign Many have let themselves be guided (which in their best times they always have done) by the counsels and influence of a more highly gifted and instructed One or Few. The initiation of all wise or noble things, comes and must come from individuals; generally at first from some one individual. The honour and glory of the average man is that he is capable of following that initiative; that he can respond internally to wise and noble things, and be led to them with his eyes open. I am not countenancing the sort
    of "hero-worship" which applauds the strong man of genius for forcibly seizing on the government of the world and making it do his bidding in spite of itself. All he can claim is, freedom to point out the way. The power of compelling others into it, is not only inconsistent with the freedom and development of all the rest, but corrupting to the strong man himself. It does seem, however, that when the opinions of masses of merely average men are everywhere become or becoming the dominant power, the counterpoise and corrective to that tendency would be, the more and more pronounced individuality of those who stand on the higher eminences of thought. It is in these circumstances most especially, that exceptional individuals, instead of being deterred, should be encouraged in acting differently from the mass. In other times there was no advantage in their doing so, unless they acted not only differently, but better. In this age the mere example of nonconformity, the mere refusal to bend the knee to custom, is itself a service. Precisely because the tyranny of opinion is such as to make eccentricity a reproach, it is desirable, in order to break through that tyranny, that people should be eccentric. Eccentricity has always abounded when and where strength of character has abounded; and the amount of eccentricity in a society has generally been proportional to the amount of genius, mental vigour, and moral courage which it contained. That so few now dare to be eccentric, marks the chief danger of the time.'
  translation_ja: 冷静に事実を言えば、本物かそう思われている知的な優秀さに、どれほど敬意が口にされ、実際に払われようと、世界全体の物事の傾きは、平凡さを人間社会の優勢な力にしていく方向にある。古代や中世、そして封建時代から現在までの長い移行期にも程度は弱まりながら、個人はそれ自体が一つの力であり、すぐれた才能か高い社会的地位を持てば、相当の力だった。今は、個人は群衆に埋もれている。政治では、世界を今動かしているのは世論だと言っても、ほとんど当たり前の話である。力の名に値するのは大衆の力と、政府が大衆の傾向や本能の代弁者になっているあいだの、その政府の力だけだ。公の事柄と同じように、私生活の道徳上また社会上の関わりにも、これは当てはまる。世論と呼ばれる意見の持ち主は、いつも同じ種類の人々ばかりではない。アメリカでは白人住民全体であり、イングランドでは主に中産階級である。だがいつでも大衆、つまり集団としての平凡さである。そのうえもっと新しいことに、今は大衆は、教会や国家のお偉方からも、表向きの指導者からも、本からも意見を得ない。大衆によく似た人が、新聞で、その場の勢いに任せ、大衆に向かって、あるいは大衆の名において語り、彼らに代わって考える。これらに文句をつけているのではない。今の人の精神の状態がこれほど低い以上、一般にそれよりよいことができると言うのでもない。だからといって、平凡な人々による統治が、平凡な統治であることに変わりはない。民主政でも人数の多い貴族政でも、その政治上の行為や、それが養う意見、性質、考え方において、平凡さを越えたことはなく、越ええなかった。ただし、主権者である多数の人々が、より才に恵まれ、教養のある一人または少数の人の助言と影響に自ら進んで導かれたかぎりにおいては別で、最もよい時代にはいつもそうしてきた。賢明で気高いことはすべて、個人から、そしてたいていはまずある一人の個人から始まる。それ以外から始まりようもない。ふつうの人の名誉であり誇りであるのは、その先駆けにつづく力、賢明で気高いものに内心で応じ、目を見開いてそれに導かれる力があることだ。強い天才が、世を治める力を乱暴につかみ取り、ひとの意に反して望むとおりにさせることを称賛するような「英雄崇拝」に賛成するのではない。その人が求めうるのは、道を指し示す自由だけである。その道を他人に強いる権力は、残りの人々の自由や発達と相いれないだけでなく、その強い人自身を腐らせる。もっとも、平凡な人ばかりが集まった大衆の意見がどこでも支配的な力になるか、なりつつあるとき、その傾きを釣り合わせ、正すのは、思想の高みに立つ人の個性がますますはっきりすることだと思われる。まさにこういう事情のときこそ、例外的な個人が大衆と違うように行動するのを、抑えるのではなく励ますべきである。別の時代には、違うだけでなく、よりよい行動でないかぎり、それに何の利点もなかった。今では、人に合わせないという実例、慣習の前にただ跪かないというだけで、一つの役に立つ。世論の専制が、風変わりであることを恥とするほどだからこそ、その専制を打ち破るために、人が風変わりであるのは望ましい。強い性格が多かったところ、強い性格が多かった時代には、いつも風変わりな人も多かった。一つの社会にどれだけ風変わりな人がいるかは、たいていそこに含まれる天才と精神の活力、道徳的な勇気がどれほどあるかに比例してきた。今、あえて風変わりであろうとする人がこんなに少ないのは、この時代の主な危険を示している。
  translation_status: reviewed

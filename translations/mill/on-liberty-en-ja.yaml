    source_sequence: 109
  source_text: As a first instance, consider the antipathies which men cherish on no better grounds than that persons whose religious opinions are different from theirs, do not practise their religious observances, especially their religious abstinences. To cite a rather trivial example, nothing in the creed or practice of Christians does more to envenom the hatred of Mahomedans against them, than the fact of their eating pork. There are few acts which Christians and Europeans regard with more unaffected disgust, than Mussulmans regard this particular mode of satisfying hunger. It is, in the first place, an offence against their religion; but this circumstance by no means explains either the degree or the kind of their repugnance; for wine also is forbidden by their religion, and to partake of it is by all Mussulmans accounted wrong, but not disgusting. Their aversion to the flesh of the "unclean beast" is, on the contrary, of that peculiar character, resembling an instinctive antipathy, which the idea of uncleanness, when once it thoroughly sinks into the feelings, seems always to excite even in those whose personal habits are anything but scrupulously cleanly, and of which the sentiment of religious impurity, so intense in the Hindoos, is a remarkable example. Suppose now that in a people, of whom the majority were Mussulmans, that majority should insist upon not permitting pork to be eaten within the limits of the country. This would be nothing new in Mahomedan countries.[14] Would it be a legitimate exercise of the moral authority of public opinion? and if not, why not? The practice is really revolting to such a public. They also sincerely think that it is forbidden and abhorred by the Deity. Neither could the prohibition be censured as religious persecution. It might be religious in its origin, but it would not be persecution for religion, since nobody's religion makes it a duty to eat pork. The only tenable ground of condemnation would be, that with the personal tastes and self-regarding concerns of individuals the public has no business to interfere.
  translation_ja: 最初の例として、宗教上の意見を異にする人が、自分たちの宗教上のしきたり、とくに信仰上禁じられたことを控えないというだけの理由で、人が抱く反感を考えてみよう。さほど大きな問題でない例を引くと、キリスト教徒の信仰や習慣のうち、彼らが豚肉を食べることほど、イスラム教徒が彼らに抱く憎しみをかき立てるものはない。イスラム教徒が空腹を満たすこの特定の仕方に向けるほどの、心からの嫌悪を、キリスト教徒やヨーロッパ人が向ける行いはほとんどない。まず、豚肉を食べることはイスラム教に反する。しかしその事情では、嫌悪の強さもその性質も説明できない。ぶどう酒も教えで禁じられ、飲むのはよくないとイスラム教徒はみな考えるが、気味が悪いとは思わないからだ。これに対し、「不浄な獣」の肉への嫌悪は、本能的な反感に似た独特のものである。不浄という考えが、ひとたび感情に深くしみこむと、日ごろの暮らしで清潔に気をつかうとはおよそ言いがたい人にさえ、いつでもこういう反感を起こすようだ。ヒンドゥー教徒のあいだでとても強い、宗教上の不浄の感覚は、その目立った例である。では、多数がイスラム教徒である国民にあって、多数派が、国内では豚肉を食べることを許さないと言い張ったとしよう。イスラムの国では、何も新しいことではない。[14] それは世論がその道徳上の権力を行使する正当な仕方だろうか。そうでなければ、なぜ違うのだろう。豚肉を食べることは、そのような世間には心から気持ちの悪いものだ。神がこれを禁じ、忌み嫌うとも、彼らは本気で信じる。禁令を宗教上の迫害だと非難することもできない。もとに宗教はあっても、信仰を理由にした迫害ではない。豚肉を食べる義務のある宗教は誰のものにもないからだ。非難するのに成り立つ理由は一つ、個人の好みと個人自身にしか関わらない事柄に、世間は口を出すべきでないということだけだ。
  translation_status: reviewed

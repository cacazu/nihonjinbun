    printed_page_end: '154'
    source_sequence: 105
  source_text: I fully admit that the mischief which a person does to himself, may seriously affect, both through their sympathies and their interests, those nearly connected with him, and in a minor degree, society at large. When, by conduct of this sort, a person is led to violate a distinct and assignable obligation to any other person or persons, the case is taken out of the self-regarding class, and becomes amenable to moral disapprobation in the proper sense of the term. If, for example, a man, through intemperance or extravagance, becomes unable to pay his debts, or, having undertaken the moral responsibility of a family, becomes from the same cause incapable of supporting or educating them, he is deservedly reprobated, and might be justly punished; but it is for the breach of duty to his family or creditors, not for the extravagance. If the resources which ought to have been devoted to them, had been diverted from them for the most prudent investment, the moral culpability would have been the same. George Barnwell murdered his uncle to get money for his mistress, but if he had done it to set himself up in business, he would equally have been hanged. Again, in the frequent case of a man who causes grief to his family by addiction to bad habits, he deserves reproach for his unkindness or ingratitude; but so he may for cultivating habits not in themselves vicious, if they are painful to those with whom he passes his life, or who from personal ties are dependent on him for their comfort. Whoever fails in the consideration generally due to the interests and feelings of others, not being compelled by some more imperative duty, or justified by allowable self-preference, is a subject of moral disapprobation for that failure, but not for the cause of it, nor for the errors, merely personal to himself, which may have remotely led to it. In like manner, when a person disables himself, by conduct purely self-regarding, from the performance of some definite duty incumbent on him to the public, he is guilty of a social offence. No person ought to be punished simply for being drunk; but a soldier or a policeman should be punished for being drunk on duty. Whenever, in short, there is a definite damage, or a definite risk of damage, either to an individual or to the public, the case is taken out of the province of liberty, and placed in that of morality or law.
  translation_ja: 人が自分に与える害が、親しい人々にはその共感を通じても実際の利害を通じても、深い影響を及ぼし、またそれより小さな程度で社会全体にも及ぶことは、私もすっかり認める。こういう行動のため、他の一人または何人かに対して、特定できるはっきりした義務に違反したなら、自分だけに関わる場合ではなくなり、正確な意味で道徳的な非難を受けることになる。たとえば、節度を失ったり浪費したりして、借金を返せなくなった人、あるいは一家への道徳的な責任を引き受けておきながら、同じ理由で家族の暮らしや教育の費用をまかなえなくなった人は、非難されて当然で、正当に罰せられてもよい。だがそれは家族や債権者への義務を破ったためであり、浪費のためではない。その人たちのために使うべき資金を、この上なく思慮深い投資へ回したとしても、道徳上の責任は同じである。ジョージ・バーンウェルは愛人に渡す金を得るためにおじを殺したが、自分で事業を始める金のためであっても、同じように絞首刑になっただろう。また、よくあるように、悪い習慣にふけって、家族を悲しませている者は、その冷たさや恩知らずのため非難に値する。だが、習慣自体には悪いところがなくても、生活を共にする人や、親しい絆ゆえに安らぎをその人に頼る人につらいものなら、その習慣を育てるだけでも、非難されうる。他人の利益や気持ちにふつう尽くすべき配慮を、もっと差し迫った義務に迫られたわけでも、許される範囲で自分を優先したという理由があるわけでもないのに欠いたなら、誰であれ、その欠けたことについて道徳上非難される。ただ、それを生んだ原因についてでも、遠くから原因となったかもしれない本人だけの誤りについてでもない。同じように、自分だけに関わる行動のために、公に対して負う何かはっきりした義務を果たせなくなった人は、社会に対する罪を犯す。酔っているというだけで罰せられるべき人はいない。だが勤務中に酔っている兵士や警察官は罰するべきだ。要するに個人にせよ公衆にせよ、特定できる損害、または特定できる損害のおそれがあればいつでも、その事例は自由の領域から、道徳か法の領域に移る。
  translation_status: reviewed
- id: ol-04-011
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:

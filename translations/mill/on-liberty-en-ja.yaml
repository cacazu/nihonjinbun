    precision: page
    printed_page: '184'
    printed_page_end: '185'
    source_sequence: 124
  source_text: The right inherent in society, to ward off crimes against itself by antecedent precautions, suggests the obvious limitations to the maxim, that purely self-regarding misconduct cannot properly be meddled with in the way of prevention or punishment. Drunkenness, for example, in ordinary cases, is not a fit subject for legislative interference; but I should deem it perfectly legitimate that a person, who had once been convicted of any act of violence to others under the influence of drink, should be placed under a special legal restriction, personal to himself; that if he were afterwards found drunk, he should be liable to a penalty, and that if when in that state he committed another offence, the punishment to which he would be liable for that other offence should be increased in severity. The making himself drunk, in a person whom drunkenness excites to do harm to others, is a crime against others. So, again, idleness, except in a person receiving support from the public, or except when it constitutes a breach of contract, cannot without tyranny be made a subject of legal punishment; but if either from idleness or from any other avoidable cause, a man fails to perform his legal duties to others, as for instance to support his children, it is no tyranny to force him to fulfil that obligation, by compulsory labour, if no other means are available.
  translation_ja: 先回りした用心によって、自分に対する犯罪を防ぐという、社会に本来備わる権利は、自分だけに関する悪い行いには、予防や処罰のため正当に口を出せないという格言に、明らかな限界があることを示す。たとえば泥酔は、ふつうの場合なら、立法が介入するのにふさわしくない。だが酒に酔って他人に何か暴力をふるい、一度有罪となった者に、その人に限る特別な法的制限を設けること、その後また酔っていると分かれば罰の対象とすること、その状態で別の犯罪を犯したら、その犯罪に対する罰を重くすることは、完全に正当だと思う。酒に酔うと他人に害を加える人が、自ら酔うのは、他人に対する犯罪である。同じように、怠けることは、公の生活援助を受ける者か、それが契約違反となる場合でないかぎり、専制を行わずには法律の罰の対象にできない。だが怠惰か、ほかの避けられる原因のため、たとえば自分の子どもを養うなど、他人に対する法律上の義務を果たさない人がいれば、ほかに手がないときに、強制的に働かせて責務を果たさせても、専制ではない。
  translation_status: reviewed
- id: ol-05-007
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '185'
    printed_page_end: '186'
    source_sequence: 125
  source_text: Again, there are many acts which, being directly injurious only to the agents themselves, ought not to be legally interdicted, but which, if done publicly, are a violation of good manners and coming thus within the category of offences against others may rightfully be prohibited. Of this kind are offences against decency; on which it is unnecessary to dwell, the rather as they are only connected indirectly with our subject, the objection to publicity being equally strong in the case of many actions not in themselves condemnable, nor supposed to be so.
  translation_ja: また、じかに害を受けるのがする人だけなので、法によって禁じるべきでないが、公の場でするなら礼儀に反し、こうして他人に対する違反となるので、正当に禁止できる行為は多い。公の場での品位を損なう振る舞いがそれである。長く述べる必要はないし、この主題と関わるのは間接的にすぎないから、なおさらだ。行い自体は非難に値せず、そう思われてもいない場合でも、公に行うのには、同じほど強い反対のある行動が多いのである。
  translation_status: reviewed
- id: ol-05-008
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '186'
    printed_page_end: '190'
    source_sequence: 126
  source_text: 'There is another question to which an answer must be found, consistent with the principles which have been laid down. In cases of personal conduct supposed to be blamable, but which respect for liberty precludes society from preventing or punishing, because the evil directly resulting falls wholly on the agent; what the agent is free to do, ought other persons to be equally free to counsel or instigate? This question is not free from difficulty. The case of a person who solicits another to do an act, is not strictly a case of self-regarding conduct. To give advice or offer inducements to any one, is a social act, and may therefore, like actions in general which affect others, be supposed amenable to social control. But a little reflection corrects the first impression, by showing that if the case is not strictly within the definition of individual liberty, yet the reasons on which the principle of individual liberty is grounded, are applicable to it. If people must be allowed, in whatever concerns only themselves, to act as seems best to themselves at their own peril, they must equally be free to consult with one another about what is fit to be so done; to exchange opinions, and give and receive suggestions. Whatever it is permitted to do, it must be permitted to advise to do. The question is doubtful, only when the instigator derives a personal benefit from his advice; when he makes it his occupation, for subsistence or pecuniary gain, to promote what society and the state consider to be an evil. Then, indeed, a new element of complication is introduced; namely, the existence of classes of persons with an interest opposed to what is considered as the public weal, and whose mode of living is grounded on the counteraction of it. Ought this to be interfered with, or not? Fornication, for example, must be tolerated, and so must gambling; but should a person be free to be a pimp, or to keep a gambling-house? The case is one of those which lie on the exact boundary line between two principles, and it is not at once apparent to which of the two it properly belongs. There are arguments on both sides. On the side of toleration it may be said, that the fact of following anything as an occupation, and living or profiting by the practice of it, cannot make that criminal which would otherwise be admissible; that the act should either be consistently permitted
    or consistently prohibited; that if the principles which we have hitherto defended are true, society has no business, as society, to decide anything to be wrong which concerns only the individual; that it cannot go beyond dissuasion, and that one person should be as free to persuade, as another to dissuade. In opposition to this it may be contended, that although the public, or the State, are not warranted in authoritatively deciding, for purposes of repression or punishment, that such or such conduct affecting only the interests of the individual is good or bad, they are fully justified in assuming, if they regard it as bad, that its being so or not is at least a disputable question: That, this being supposed, they cannot be acting wrongly in endeavouring to exclude the influence of solicitations which are not disinterested, of instigators who cannot possibly be impartial—who have a direct personal interest on one side, and that side the one which the State believes to be wrong, and who confessedly promote it for personal objects only. There can surely, it may be urged, be nothing lost, no sacrifice of good, by so ordering matters that persons shall make their election, either wisely or foolishly, on their own prompting, as free as possible from the arts of persons who stimulate their inclinations for interested purposes of their own. Thus (it may be said) though the statutes respecting unlawful games are utterly indefensible—though all persons should be free to gamble in their own or each other''s houses, or in any place of meeting established by their own subscriptions, and open only to the members and their visitors—yet public gambling-houses should not be permitted. It is true that the prohibition is never effectual, and that whatever amount of tyrannical power is given to the police, gambling-houses can always be maintained under other pretences; but they may be compelled to conduct their operations with a certain degree of secrecy and mystery, so that nobody knows anything about them but those who seek them; and more than this, society ought not to aim at. There is considerable force in these arguments; I will not venture to decide whether they are sufficient to justify the moral anomaly of punishing the accessary, when the principal is (and must be) allowed to go free; or fining or imprisoning the procurer, but not the fornicator, the gambling-house
    keeper, but not the gambler. Still less ought the common operations of buying and selling to be interfered with on analogous grounds. Almost every article which is bought and sold may be used in excess, and the sellers have a pecuniary interest in encouraging that excess; but no argument can be founded on this, in favour, for instance, of the Maine Law; because the class of dealers in strong drinks, though interested in their abuse, are indispensably required for the sake of their legitimate use. The interest, however, of these dealers in promoting intemperance is a real evil, and justifies the State in imposing restrictions and requiring guarantees, which but for that justification would be infringements of legitimate liberty.'
  translation_ja: ここまで述べた原理に沿って、もう一つ答えを見つけなくてはならない。ある個人の行動は非難に値するとされるが、そこからじかに生じる害はすべて本人にかかるので、自由を尊重する社会には、妨げたり罰したりできないとする。本人にする自由があることなら、他人もそれを勧めたり誘ったりする同じ自由を持つべきだろうか。これは難しさのない問いではない。他人があることをするように働きかけるのは、厳密には自分だけに関わる行動ではない。誰かに助言をし、するように誘うのは社会上の行為であり、他人に影響する行動一般と同じく、社会の統制に従うべきだと思われてもおかしくない。だが少し考えれば、最初の印象は改まる。厳密には個人の自由の定義に入らなくても、その原理の土台となる理由は当てはまるからだ。自分だけに関わることなら、自ら危険を引き受けて、最善と思うことを行うのを認められるべきなら、何をそう行うのがふさわしいかについて、互いに相談し、意見を交わし、提案をし、提案を受ける自由も同様になくてはならない。してよいことなら何でも、するよう勧めてもよいはずだ。疑いが生じるのは、誘う者が助言から個人的な利益を得るときに限られる。社会や国家が害とみなすことを広めるのを、生計や金銭上の利益のために仕事とする場合である。このとき確かに問題を複雑にする要素が新たに加わる。公共の幸福とみなされるものと反対の利害を持ち、これを妨げるのを生活の土台とする一群の人々がいるのだ。介入すべきか、すべきでないか。たとえば婚外の性交も賭け事も許さなくてはならないが、売春をあっせんしたり賭場を営んだりする自由も認めるべきか。これは二つの原理のまさに境目にあり、どちらのもとに置くのが正しいかは、すぐには分からない。どちらにも理屈はある。寛容の側からは、ある行為を職とし、生計を立て、利益を得るという事実だけで、そうでなければ許してよい行為を罪にはできないと言える。一貫して認めるか一貫して禁じるか、どちらかであるべきだ。これまで擁護してきた原理が正しければ、個人にしか関わらないことを悪いと決めるのは、社会としての役目ではない。やめるよう説得する以上のことはできず、ある人に思いとどまらせる自由があるのと同じように、別の人には勧める自由がなくてはならない。反対の側からは、こう言いうる。世間や国家には、個人の利益だけに関わるあれこれの行動がよいか悪いかを、取り締まりや処罰のため、権力を用いて決めてよいわけではない。だが悪いと考えるなら、少なくともよいか悪いかに議論の余地があると見なすのは、十分に正当である。そうなら、公正な立場を取りえない者が、自分の利益のために勧誘することの影響を除こうとしても、間違ってはいない。誘う側には、一方、それも国家が悪いと思う側に、直接の個人的な利害があり、個人的な目的だけのためにそちらを勧めると自分でも認めているのだから。うまく選ぶにせよ愚かに選ぶにせよ、他人の好みを刺激して自分の得を図ろうとする者の手からできるだけ自由に、自分自身の思いから選ぶよう物事を整えても、失われるものも、犠牲になる利益もないだろう。だから、違法な賭けを取り締まる法令はまったく擁護できない、自分や互いの家で、または自分たちで金を出して設け、会員とその客だけが入れる集会所で賭け事をする自由は、誰にでもあるべきだが、なお公衆を入れる賭場は許すべきでない、と言われるかもしれない。たしかに、禁令は決して完全には効かず、警察にどれほど専制的な権力を与えても、賭場はいつでも別の名目で続けられる。だがひそかに、表に出ない形で営むようにして、探す人以外には何も分からないようにさせることはできる。社会はそれ以上を目指すべきではない。こういう議論には相当の力がある。だが本人を自由にしておき、またそうしなければならないのに、手引きした人を罰する、婚外の性交をした本人でなくあっせん者を、賭けた人でなく賭場の主人を、罰金や拘禁の対象とするような道徳上の矛盾を正当化するのに十分か、私はあえて決めない。同じような理由で、ふつうの売り買いに介入すべきでないことは、なおさらだ。売買されるほとんどどんな品物も使い過ぎることはでき、売る側にはそれを勧める金銭上の利益がある。だがそこから、たとえばメイン州の禁酒法を支持する論拠は得られない。酒を売る人は、飲みすぎを勧める利害を持つとはいえ、正当に使えるようにするためには欠かせないからだ。それでも、酒の売り手が度を越した飲酒を勧めて得をするというのは、現実の害である。その理由がなければ正当な自由を侵すような制限を国家が課し、適切な保証を求めることを、正当化する。
  translation_status: reviewed

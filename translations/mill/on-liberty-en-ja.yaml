- id: ol-fn-10-01
  section_id: ch-02
  kind: note_body
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: block
    url: https://raw.githubusercontent.com/GITenberg/On-Liberty_34901/5f5238d21f3be5cfc51f00344934c98fe801d7b2/34901-h/34901-h.htm#Footnote_10_10
    anchor: Footnote_10_10
    source_sequence: 71
  source_text: 'Ample warning may be drawn from the large infusion of the passions of a persecutor, which mingled with the general display of the worst parts of our national character on the occasion of the Sepoy insurrection. The ravings of fanatics or charlatans from the pulpit may be unworthy of notice; but the heads of the Evangelical party have announced as their principle, for the government of Hindoos and Mahomedans, that no schools be supported by public money in which the Bible is not taught, and by necessary consequence that no public employment be given to any but real or pretended Christians. An Under-Secretary of State, in a speech delivered to his constituents on the 12th of November, 1857, is reported to have said: "Toleration of their faith" (the faith of a hundred millions of British subjects), "the superstition which they called religion, by the British Government, had had the effect of retarding the ascendency of the British name, and preventing the salutary growth of Christianity.... Toleration was the great corner-stone of the religious liberties of this country; but do not let them abuse that precious word toleration. As he understood it, it meant the complete liberty to all, freedom of worship, among Christians, who worshipped upon the same foundation. It meant toleration of all sects and denominations of Christians who believed in the one mediation." I desire to call attention to the fact, that a man who has been deemed fit to fill a high office in the government of this country, under a liberal Ministry, maintains the doctrine that all who do not believe in the divinity of Christ are beyond the pale of toleration. Who, after this imbecile display, can indulge the illusion that religious persecution has passed away, never to return?'
  translation_ja: セポイの反乱に際し、わが国民性の最も悪い部分があらわになるなかに、迫害者の激情が濃くまじったことから、十分な警告を読み取れる。狂信者やいかさま師が説教壇でわめくことは、気に留めなくてよいかもしれない。だが福音主義派の指導者たちは、ヒンドゥー教徒とイスラム教徒を統治する原則として、聖書を教えない学校は公費で支援しないこと、それに必然的に伴うこととして、本物あるいは名目だけでもキリスト教徒でなければ、公の職に就けないことを発表した。一八五七年十一月十二日、ある国務次官が選挙区の有権者に行った演説では、こう言ったと伝えられる。「彼らの信仰への寛容」、つまり一億のイギリス臣民の信仰への寛容であるが、「彼らが宗教と呼ぶ迷信をイギリス政府が許したせいで、イギリスの名が勢力を得るのが遅れ、キリスト教の健全な発展が妨げられた。……寛容は、この国の宗教的自由を支える大きな礎石だった。だが、寛容というこの貴い言葉は乱用してはならない。私の理解では、それは、同じ土台の上で礼拝するキリスト教徒のあいだで、すべての人に完全な自由、礼拝の自由を認めるという意味だった。唯一の仲保を信じるキリスト教徒の、あらゆる宗派と教派を許すという意味だった。」私が注意を促したいのは、自由主義の内閣でこの国の政府の高い職にふさわしいと認められた人物が、キリストの神性を信じない者はすべて寛容の範囲外だという教えを主張している事実だ。この愚かしい見せつけのあとで、宗教上の迫害は過ぎ去って二度と帰らないという幻想を、誰が抱いていられるだろう。
  translation_status: reviewed

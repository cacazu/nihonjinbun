    printed_page_end: '131'
    source_sequence: 87
  source_text: 'There is one characteristic of the present direction of public opinion, peculiarly calculated to make it intolerant of any marked demonstration of individuality. The general average of mankind are not only moderate in intellect, but also moderate in inclinations: they have no tastes or wishes strong enough to incline them to do anything unusual, and they consequently do not understand those who have, and class all such with the wild and intemperate whom they are accustomed to look down upon. Now, in addition to this fact which is general, we have only to suppose that a strong movement has set in towards the improvement of morals, and it is evident what we have to expect. In these days such a movement has set in; much has actually been effected in the way of increased regularity of conduct, and discouragement of excesses; and there is a philanthropic spirit abroad, for the exercise of which there is no more inviting field than the moral and prudential improvement of our fellow-creatures. These tendencies of the times cause the public to be more disposed than at most former periods to prescribe general rules of conduct, and endeavour to make every one conform to the approved standard. And that standard, express or tacit, is to desire nothing strongly. Its ideal of character is to be without any marked character; to maim by compression, like a Chinese lady''s foot, every part of human nature which stands out prominently, and tends to make the person markedly dissimilar in outline to commonplace humanity.'
  translation_ja: 現在の世論の向かう方向には、個性が目立って表れることを許さないようにするうえで、とりわけ働きやすい特徴がある。人の大方は、並の知性を持つだけでなく、欲求や好みにも強いところがない。変わったことをしたくなるほど強い好みや願いは持たない。そのため、持つ人を理解できず、そういう人を皆、日ごろ見下ろしている向こう見ずな節度のない者と同じに扱う。この一般的な事実に加えて、道徳を改善しようという強い動きが始まったと考えるだけで、どんな結果を予想すべきかは明らかだ。今の時代、実際にそのような動きが始まった。行動はいっそう規則に沿い、度を越すことは控えられるようになり、実際に多くの成果があった。慈善の精神が世に広まっており、それを働かせる場所として、仲間の道徳や分別を向上させることほど魅力を感じさせるものはない。こうした時代の傾きのため、世間はたいていの昔の時代より、一般的な行動規範を指図し、誰もが公認の基準に従うよう努めたがる。その基準は、はっきり言うにせよ暗黙にせよ、何も強く望むなというものだ。理想の人格とは、目につく人格を持たないことだ。纏足をした中国の婦人の足のように、人間の性質のうち出っ張っていて、並の人と目立って輪郭が違うようにする部分を、すべて押さえつけて損なうのだ。

    source_sequence: 80
  source_text: In some such insidious form there is at present a strong tendency to this narrow theory of life, and to the pinched and hidebound type of human character which it patronises. Many persons, no doubt, sincerely think that human beings thus cramped and dwarfed, are as their Maker designed them to be; just as many have thought that trees are a much finer thing when clipped into pollards, or cut out into figures of animals, than as nature made them. But if it be any part of religion to believe that man was made by a good being, it is more consistent with that faith to believe, that this Being gave all human faculties that they might be cultivated and unfolded, not rooted out and consumed, and that he takes delight in every nearer approach made by his creatures to the ideal conception embodied in them, every increase in any of their capabilities of comprehension, of action, or of enjoyment. There is a different type of human excellence from the Calvinistic; a conception of humanity as having its nature bestowed on it for other purposes than merely to be abnegated. "Pagan self-assertion" is one of the elements of human worth, as well as "Christian self-denial."[12] There is a Greek ideal of self-development, which the Platonic and Christian ideal of self-government blends with, but does not supersede. It may be better to be a John Knox than an Alcibiades, but it is better to be a Pericles than either; nor would a Pericles, if we had one in these days, be without anything good which belonged to John Knox.
  translation_ja: このように気づかれにくい形で、今世の中には、狭い人生観と、それがよしとする、窮屈で融通のきかない人間の型に向かう強い傾きがある。そのように縮められ、育ちを抑えられた人間こそ、造り主がそうあれと望む人間であると、心底から考える人が多いことは疑いない。自然に生えた木より、枝を刈りこんだり、動物の姿に切りそろえたりした木のほうがずっと立派だ、と考えた人が多いのと同じだ。だが、人間は善い存在に造られたと信じることがいくらかでも信仰の一部であるなら、その存在が人の諸能力をすべて授けたのは、それを根から掘り起こし、消し去るのでなく、育てて伸ばすためであると信じることのほうが、その信仰に沿っている。造られた者が、自分に形をとった理想に少しでも近づき、理解する力、行動する力、楽しむ力をどれであれ強めるたびに、造り主も喜ぶと信じるほうが、沿っている。カルヴァン主義とは別の、人間のすぐれたあり方がある。本性はただ捨て去るためではなく、ほかの目的のために人間に授けられた、という人間観である。「異教的な自己主張」も、「キリスト教的な自己否定」と同じく、人間の価値をつくる一つの要素だ。[12] ギリシャには自己を発達させる理想がある。それはプラトン的・キリスト教的に自らを治める理想と調和するが、それで置き換えられることはない。アルキビアデスよりジョン・ノックスであるほうがよいかもしれないが、どちらよりも、ペリクレスであるほうがよい。今ペリクレスのような人がいるとして、その人にジョン・ノックスのすぐれたところが欠けるとはかぎらない。
  translation_status: reviewed
- id: ol-03-009
  section_id: ch-03

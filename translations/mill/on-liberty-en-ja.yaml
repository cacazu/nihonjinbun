    precision: page
    printed_page: '15'
    printed_page_end: '17'
    source_sequence: 12
  source_text: In England, from the peculiar circumstances of our political history, though the yoke of opinion is perhaps heavier, that of law is lighter, than in most other countries of Europe; and there is considerable jealousy of direct interference, by the legislative or the executive power, with private conduct; not so much from any just regard for the independence of the individual, as from the still subsisting habit of looking on the government as representing an opposite interest to the public. The majority have not yet learnt to feel the power of the government their power, or its opinions their opinions. When they do so, individual liberty will probably be as much exposed to invasion from the government, as it already is from public opinion. But, as yet, there is a considerable amount of feeling ready to be called forth against any attempt of the law to control individuals in things in which they have not hitherto been accustomed to be controlled by it; and this with very little discrimination as to whether the matter is, or is not, within the legitimate sphere of legal control; insomuch that the feeling, highly salutary on the whole, is perhaps quite as often misplaced as well grounded in the particular instances of its application. There is, in fact, no recognised principle by which the propriety or impropriety of government interference is customarily tested. People decide according to their personal preferences. Some, whenever they see any good to be done, or evil to be remedied, would willingly instigate the government to undertake the business; while others prefer to bear almost any amount of social evil, rather than add one to the departments of human interests amenable to governmental control. And men range themselves on one or the other side in any particular case, according to this general direction of their sentiments; or according to the degree of interest which they feel in the particular thing which it is proposed that the government should do, or according to the belief they entertain that the government would, or would not, do it in the manner they prefer; but very rarely on account of any opinion to which they consistently adhere, as to what things are fit to be done by a government. And it seems to me that in consequence of this absence of rule or principle, one side is at present as often wrong as the other; the interference of government
    is, with about equal frequency, improperly invoked and improperly condemned.
  translation_ja: イングランドでは政治史の特有の事情から、ヨーロッパのたいていの国と比べて、世論の軛はおそらく重い一方で、法律の軛は軽い。立法権や行政権が私人の行動にじかに口を出すことへの警戒は強い。ただし、これは個人の自立を当然のものとして尊重するからというより、政府は世間と相反する利害の代表者だという、今なお残る習慣による。多数派はまだ、政府の力は自分たちの力だ、政府の意見は自分たちの意見だとは感じていない。そう感じるようになれば、個人の自由はすでに世論から侵されかねないのと同じくらい、政府からも侵されかねなくなるだろう。しかし今のところ、法律がこれまで統制してこなかった物事について個人を縛ろうとすれば、それに反発する気持ちは相当に強い。それが法による規制の正当な範囲内かどうかは、ほとんどおかまいなしである。そのため、全体としてきわめて望ましいこの気持ちも、個々の場合に役立てるとなると、的を射るのとほぼ同じくらい的を外すことがある。実際、政府が介入してよいかどうかをふだん検討するときの、公認の原則がない。人は自分の好みで決める。何かよいことができそうだ、悪いことが正せそうだと見るたび、政府にその仕事をさせたがる人もいる。一方、政府の統制に服する人間生活の領域を一つでも増やすくらいなら、どんなひどい社会悪でもほぼ我慢するほうを選ぶ人もいる。個別の事例では、自分の気持ちのおおよその傾向や、政府にやらせようというその事柄に自分がどれだけ関心を持つか、政府が自分好みの仕方でそれを行うと思うかどうかに従って、どちらかの側につく。何が政府のするのにふさわしいことかについて、一貫した考えを持っているから、ということはめったにない。そして、このような規則なり原則なりがないために、今はどちらの側も同じくらいしばしば間違えている、と私には思われる。政府の介入が、不当に求められるのと不当に非難されるのとは、ほぼ同じ頻度なのである。
  translation_status: reviewed

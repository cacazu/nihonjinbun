  source_text: To the beloved and deplored memory of her who was the inspirer, and in part the author, of all that is best in my writings—the friend and wife whose exalted sense of truth and right was my strongest incitement, and whose approbation was my chief reward—I dedicate this volume. Like all that I have written for many years, it belongs as much to her as to me; but the work as it stands has had, in a very insufficient degree, the inestimable advantage of her revision; some of the most important portions having been reserved for a more careful re-examination, which they are now never destined to receive. Were I but capable of interpreting to the world one-half the great thoughts and noble feelings which are buried in her grave, I should be the medium of a greater benefit to it than is ever likely to arise from anything that I can write, unprompted and unassisted by her all but unrivalled wisdom.
  translation_ja: 私の著作で最もよいところは、すべて彼女が着想を与え、一部は自ら書いたものだ。真実と正義に対する彼女の気高い感覚ほど強く私を励ましたものはなく、彼女に認めてもらうことほど大きな報いはなかった。いとおしく、失って悲しみの尽きないその人、私の友であり妻であった人を偲び、この一冊を捧げる。長年書いてきたものと同じく、この本は私のものであると同じだけ、彼女のものでもある。ただ、今の形のままでは、彼女の見直しという何ものにも代えがたい恩恵に、ほんのわずかしかあずかっていない。最も大切な箇所のいくつかは改めて丹念に見直すため取り置いていたが、もうその機会は永遠に訪れない。彼女とともに墓に眠る優れた考えや気高い感情を、もし半分でも世に伝えられるものなら、ほとんど並ぶもののない彼女の知恵に導かれも助けられもせずに私が何を書こうと、望めないほど大きな益を、世にもたらせるだろう。
  translation_status: reviewed

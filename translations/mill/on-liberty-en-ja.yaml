    precision: page
    printed_page: '193'
    printed_page_end: '198'
    source_sequence: 129
  source_text: 'It was pointed out in an early part of this Essay, that the liberty of the individual, in things wherein the individual is alone concerned, implies a corresponding liberty in any number of individuals to regulate by mutual agreement such things as regard them jointly, and regard no persons but themselves. This question presents no difficulty, so long as the will of all the persons implicated remains unaltered; but since that will may change, it is often necessary, even in things in which they alone are concerned, that they should enter into engagements with one another; and when they do, it is fit, as a general rule, that those engagements should be kept. Yet in the laws, probably, of every country, this general rule has some exceptions. Not only persons are not held to engagements which violate the rights of third parties, but it is sometimes considered a sufficient reason for releasing them from an engagement, that it is injurious to themselves. In this and most other civilised countries, for example, an engagement by which a person should sell himself, or allow himself to be sold, as a slave, would be null and void; neither enforced by law nor by opinion. The ground for thus limiting his power of voluntarily disposing of his own lot in life, is apparent, and is very clearly seen in this extreme case. The reason for not interfering, unless for the sake of others, with a person''s voluntary acts, is consideration for his liberty. His voluntary choice is evidence that what he so chooses is desirable, or at the least endurable, to him, and his good is on the whole best provided for by allowing him to take his own means of pursuing it. But by selling himself for a slave, he abdicates his liberty; he foregoes any future use of it, beyond that single act. He therefore defeats, in his own case, the very purpose which is the justification of allowing him to dispose of himself. He is no longer free; but is thenceforth in a position which has no longer the presumption in its favour, that would be afforded by his voluntarily remaining in it. The principle of freedom cannot require that he should be free not to be free. It is not freedom, to be allowed to alienate his freedom. These reasons, the force of which is so conspicuous in this peculiar case, are evidently of far wider application; yet a limit is everywhere set to them by the necessities of life,
    which continually require, not indeed that we should resign our freedom, but that we should consent to this and the other limitation of it. The principle, however, which demands uncontrolled freedom of action in all that concerns only the agents themselves, requires that those who have become bound to one another, in things which concern no third party, should be able to release one another from the engagement: and even without such voluntary release, there are perhaps no contracts or engagements, except those that relate to money or money''s worth, of which one can venture to say that there ought to be no liberty whatever of retractation. Baron Wilhelm von Humboldt, in the excellent essay from which I have already quoted, states it as his conviction, that engagements which involve personal relations or services, should never be legally binding beyond a limited duration of time; and that the most important of these engagements, marriage, having the peculiarity that its objects are frustrated unless the feelings of both the parties are in harmony with it, should require nothing more than the declared will of either party to dissolve it. This subject is too important, and too complicated, to be discussed in a parenthesis, and I touch on it only so far as is necessary for purposes of illustration. If the conciseness and generality of Baron Humboldt''s dissertation had not obliged him in this instance to content himself with enunciating his conclusion without discussing the premises, he would doubtless have recognised that the question cannot be decided on grounds so simple as those to which he confines himself. When a person, either by express promise or by conduct, has encouraged another to rely upon his continuing to act in a certain way—to build expectations and calculations, and stake any part of his plan of life upon that supposition, a new series of moral obligations arises on his part towards that person, which may possibly be overruled, but cannot be ignored. And again, if the relation between two contracting parties has been followed by consequences to others; if it has placed third parties in any peculiar position, or, as in the case of marriage, has even called third parties into existence, obligations arise on the part of both the contracting parties towards those third persons, the fulfilment of which, or at all events the mode of fulfilment, must
    be greatly affected by the continuance or disruption of the relation between the original parties to the contract. It does not follow, nor can I admit, that these obligations extend to requiring the fulfilment of the contract at all costs to the happiness of the reluctant party; but they are a necessary element in the question; and even if, as Von Humboldt maintains, they ought to make no difference in the legal freedom of the parties to release themselves from the engagement (and I also hold that they ought not to make much difference), they necessarily make a great difference in the moral freedom. A person is bound to take all these circumstances into account, before resolving on a step which may affect such important interests of others; and if he does not allow proper weight to those interests, he is morally responsible for the wrong. I have made these obvious remarks for the better illustration of the general principle of liberty, and not because they are at all needed on the particular question, which, on the contrary, is usually discussed as if the interest of children was everything, and that of grown persons nothing.'
  translation_ja: 本論の先の箇所で指摘した。個人だけが関わることについて個人に自由があるなら、幾人であろうと、その者たちが一緒に関わり、ほかの誰も関わらないことを、相互の合意によって取り決める同じ自由があるはずだ。この問題は、関係する人みなの意志が変わらないかぎり、難しくない。だが意志は変わることがあるから、自分たちしか関わらないことでも、互いに約束する必要がしばしば生じる。いったん約束したなら、原則として、それは守るのがよい。それでも、おそらくどの国の法にも、この原則には何か例外がある。第三者の権利に反する約束は守らせないだけでなく、その約束が本人に害になる、というだけで、約束から解く十分な理由とされることもある。たとえばわが国や、ほかのたいていの発達した国では、自らを奴隷に売り、または売られるのを認める約束は、無効である。法も世論もそれを強制しない。自ら選んで自分の運命を処分する権限をこうして制限する理由は、明白であり、この極端な場合なら、とりわけはっきり分かる。他人のためでなければ、本人の意志による行為に介入しない理由は、その人の自由への配慮だ。自分で選んだことは、その人にとって望ましいか、少なくとも耐えられることだと分かるし、本人が選ぶ手段で自分の益を求めさせるのが、全体としてその人のために最もよい。だが自身を奴隷として売れば、自ら自由を捨てることになる。この一回の行為を除いて、それ以降に自由を使うことをすべて放棄する。したがって、自分のことを自分で決めてよいとする根拠になった目的そのものを、自らの場合には損なってしまう。もう自由でなく、そのときから置かれる立場について、本人が進んでその立場にとどまるなら得られたであろう、そこにいるのは本人のためだという推定もない。自由の原理は、自由でなくなる自由まで求めることはできない。自由を手放してよいというのは、自由ではない。この特別な例ではっきり力を示すこれらの理由は、明らかに、もっと広い場合に当てはまる。しかしどこでも人生の必要が限界を設ける。私たちは絶えず、自由そのものを捨てるようでないにせよ、あれこれの制限に同意するよう求められるからだ。それでも、自分たちにしか関わらないすべての事柄では、制限されずに行動できなければならないという原理からすれば、第三者に関わらないことについて、互いに拘束を受けるようになった人々は、相手を約束の拘束から解けるべきである。また、こうして自ら解くことがなくても、金銭か、金銭に換えられるものに関わる場合以外に、取り消す自由がまったくないほうがよいと断言できる契約や約束は、おそらくない。前に引用したすぐれた論考で、ヴィルヘルム・フォン・フンボルト男爵は、人と人の関係や役務を伴う約束が、限られた期間を越えて法的に拘束することは決してあるべきでないという確信を述べている。この種の約束のうち最も重要な婚姻は、双方の感情が一致しなければ目的が果たされないという特徴を持つから、関係を解くために必要なのはどちらか一方がそう望むと宣言することだけだとも言う。これはあまりに大切で複雑な問題なので、ついでに論じられない。例にするのに必要なところまでだけ、触れる。男爵の論考が短く、一般的なために、この問題では前提を論じず結論を述べるだけにとどめる必要がなかったなら、本人が限ったような、単純な理由では決められないと、認めたに違いない。はっきり約束したり、そう振る舞ったりすることで、ある者の行いが一定の仕方で続くと相手に信じさせ、それをもとに見込みを立て、計算し、自分の人生計画の一部を賭けるようにさせたなら、その人は相手に対して、新たにいくつもの道徳上の義務を負う。時にはほかの義務が優先するが、無視はできない。また契約した二人の関係がほかの人に何らかの結果をもたらし、第三者が特別な立場に置かれたり、婚姻の場合のように、子どもという第三者が生まれたりした場合は、契約した双方が、その第三者に義務を負う。その義務が果たされるか、少なくともどう果たされるかは、もとの契約当事者の関係が続くか、断たれるかによって、大きく影響されるに違いない。これらの義務が、もう続けたくない側の幸福をどれほど犠牲にしても、契約を履行させることにまで及ぶ、ということにはならず、私はそれを認められない。ただこの義務は問題に欠かせない要素である。フンボルトの唱えるとおり、これによって当事者が約束を解く法的な自由が変わるべきでないとしても、私も大きく変わるべきではないと思うが、道徳上どこまで自由に決めてよいかは、大きく変わらざるをえない。他人のこれほど重要な利益に影響を及ぼしかねない一歩を決める前には、こうした事情をすべて考慮する義務がある。その利益をしかるべき重さで考えないなら、その不正について道徳的な責任がある。これらの明らかなことを述べたのは、自由の一般原理をよりよく説明するためであって、特定の問題にとくに必要だからではない。それどころか、ふつうは子どもの利益がすべてで、成人の利益は何でもないかのように論じられる問題である。

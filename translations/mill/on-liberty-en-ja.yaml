    printed_page_end: '69'
    source_sequence: 44
  source_text: 'If the intellect and judgment of mankind ought to be cultivated, a thing which Protestants at least do not deny, on what can these faculties be more appropriately exercised by any one, than on the things which concern him so much that it is considered necessary for him to hold opinions on them? If the cultivation of the understanding consists in one thing more than in another, it is surely in learning the grounds of one''s own opinions. Whatever people believe, on subjects on which it is of the first importance to believe rightly, they ought to be able to defend against at least the common objections. But, some one may say, "Let them be taught the grounds of their opinions. It does not follow that opinions must be merely parroted because they are never heard controverted. Persons who learn geometry do not simply commit the theorems to memory, but understand and learn likewise the demonstrations; and it would be absurd to say that they remain ignorant of the grounds of geometrical truths, because they never hear any one deny, and attempt to disprove them." Undoubtedly: and such teaching suffices on a subject like mathematics, where there is nothing at all to be said on the wrong side of the question. The peculiarity of the evidence of mathematical truths is, that all the argument is on one side. There are no objections, and no answers to objections. But on every subject on which difference of opinion is possible, the truth depends on a balance to be struck between two sets of conflicting reasons. Even in natural philosophy, there is always some other explanation possible of the same facts; some geocentric theory instead of heliocentric, some phlogiston instead of oxygen; and it has to be shown why that other theory cannot be the true one: and until this is shown, and until we know how it is shown, we do not understand the grounds of our opinion. But when we turn to subjects infinitely more complicated, to morals, religion, politics, social relations, and the business of life, three-fourths of the arguments for every disputed opinion consist in dispelling the appearances which favour some opinion different from it. The greatest orator, save one, of antiquity, has left it on record that he always studied his adversary''s case with as great, if not with still greater, intensity than even his own. What Cicero practised as the means of forensic success,
    requires to be imitated by all who study any subject in order to arrive at the truth. He who knows only his own side of the case, knows little of that. His reasons may be good, and no one may have been able to refute them. But if he is equally unable to refute the reasons on the opposite side; if he does not so much as know what they are, he has no ground for preferring either opinion. The rational position for him would be suspension of judgment, and unless he contents himself with that, he is either led by authority, or adopts, like the generality of the world, the side to which he feels most inclination. Nor is it enough that he should hear the arguments of adversaries from his own teachers, presented as they state them, and accompanied by what they offer as refutations. That is not the way to do justice to the arguments, or bring them into real contact with his own mind. He must be able to hear them from persons who actually believe them; who defend them in earnest, and do their very utmost for them. He must know them in their most plausible and persuasive form; he must feel the whole force of the difficulty which the true view of the subject has to encounter and dispose of; else he will never really possess himself of the portion of truth which meets and removes that difficulty. Ninety-nine in a hundred of what are called educated men are in this condition; even of those who can argue fluently for their opinions. Their conclusion may be true, but it might be false for anything they know: they have never thrown themselves into the mental position of those who think differently from them, and considered what such persons may have to say; and consequently they do not, in any proper sense of the word, know the doctrine which they themselves profess. They do not know those parts of it which explain and justify the remainder; the considerations which show that a fact which seemingly conflicts with another is reconcilable with it, or that, of two apparently strong reasons, one and not the other ought to be preferred. All that part of the truth which turns the scale, and decides the judgment of a completely informed mind, they are strangers to; nor is it ever really known, but to those who have attended equally and impartially to both sides, and endeavoured to see the reasons of both in the strongest light. So essential is this discipline to a real understanding
    of moral and human subjects, that if opponents of all important truths do not exist, it is indispensable to imagine them, and supply them with the strongest arguments which the most skilful devil''s advocate can conjure up.'
  translation_ja: 人間の知性と判断力を養うべきだとして、少なくともプロテスタントはそれを否定しないが、自分にとってあまりに大切なので意見を持つ必要があるとされる事柄ほど、誰にとっても、そのような能力をふさわしく働かせられるものがあるだろうか。理解力を養うのに何かがほかよりも役に立つとすれば、それは確かに自分の意見の根拠を学ぶことだ。正しく信じることが何より大切な主題で何を信じるにせよ、少なくともありふれた反論から自分の考えを守れなければならない。だがこう言う人もいるだろう。「自分の意見の根拠を教えればよい。その意見に反対する人の声を聞かないからといって、オウム返しをするしかないことにはならない。幾何学を学ぶ者は、定理を暗記するだけではなく、証明も理解し、身につける。それを否定し、誤りを証明しようとする人に出会わないからといって、幾何学の真理の根拠を知らないままだと言うのはばかげている。」そのとおりだ。数学のように、誤った側からは何一つ言うことがない主題には、そのような教え方で足りる。数学上の真理の証拠に特有なのは、論拠がすべて片側にあることだ。反論もなく、反論への答えもない。だが意見が分かれうる主題ではどれも、対立する二組の理由を秤にかけて、どちらが重いかを判断することに、真理はかかっている。自然科学でさえ、同じ事実に別の説明は常にありうる。地動説の代わりに天動説が、酸素の代わりにフロギストンがありうる。なぜほかの説が真実たりえないのかを示す必要があり、それが示され、どう示されたかを私たちが知るまでは、自分の意見の根拠は分かっていない。だが、道徳や宗教、政治、社会関係や暮らしの営みなど、はるかに込み入った主題に目を向ければ、論争になっている意見の論拠の四分の三は、別の意見をもっともらしく見せている事情を、一つ一つ取り除くことに成り立つ。古代の弁論家で、一人を除けば最も偉大だった人物は、相手の言い分をいつも、自分の言い分と同じ熱心さで、いや、それ以上の熱心さで研究した、と書き残している。キケロが法廷で勝つ手段として行ったことは、真理にたどり着くために、どんな主題を研究する人もまねる必要がある。問題の自分の側しか知らない人は、その側についてさえほとんど知らない。自分の理由は十分で、誰も反駁できなかったのかもしれない。だが反対側の理由も同じく反駁できない、いや、どんな理由かさえ知らないなら、どちらかの意見を選ぶ根拠はない。その人が理にかなった態度を取るなら、判断は保留するしかない。それで満足しなければ、権威に導かれるか、世間の大方と同じく、自分の好みに最も合う側につくだけだ。相手の議論を、自分の先生が説明する形で、その先生の反駁と一緒に聞くだけでも足りない。それでは相手の議論を公正に扱うことにも、自分の心と本当に触れ合わせることにもならない。その議論を実際に信じ、まじめに弁護し、できるかぎり力を尽くす人から、聞けなくてはならない。もっとも筋が通り、説得力のある形で知る必要がある。その問題の正しい見方が立ち向かい、解決しなければならない難点の重みを、余すところなく感じとらなければならない。さもなければ、その難点に応え、取り除く真理の一部分を、本当に自分のものにはできない。教養人と呼ばれる人々の百人に九十九人がそういう状態にある。自分の意見をよどみなく弁護できる人のあいだでさえ、そうだ。彼らの結論は正しいかもしれないが、自分が知っているかぎりでは間違っているかもしれない。違う考えを持つ人の心の位置に身を置き、その人に何が言えるか考えたことがなく、そのため、自ら掲げる教えさえ、正確な意味では知らない。他の部分を説明し、正当化する部分を知らない。一見するとぶつかり合う二つの事実が両立しうると見抜く考え方も、どちらも強く見える二つの理由のうち、なぜ一方を選び、他方を選ばないのかを示す考え方も知らない。何が重いかを決め、十分な知識を得た人の判断を定める真理のその部分とは、まったく縁がない。それを本当に知るのは、両方に等しく、偏らずに耳を傾け、双方の理由を最も強い形で見ようと努めた人だけである。道徳や人間に関する事柄を本当に理解するには、この訓練が欠かせない。だから大切な真理の一つずつに反対者がいるのでなければ、反対者を想像でつくり出し、最も巧みな悪魔の代弁者にも思いつけるかぎり最強の反論を、その人物に言わせる必要がある。
  translation_status: reviewed

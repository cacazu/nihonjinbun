  source_text: The struggle between Liberty and Authority is the most conspicuous feature in the portions of history with which we are earliest familiar, particularly in that of Greece, Rome, and England. But in old times this contest was between subjects, or some classes of subjects, and the government. By liberty, was meant protection against the tyranny of the political rulers. The rulers were conceived (except in some of the popular governments of Greece) as in a necessarily antagonistic position to the people whom they ruled. They consisted of a governing One, or a governing tribe or caste, who derived their authority from inheritance or conquest, who, at all events, did not hold it at the pleasure of the governed, and whose supremacy men did not venture, perhaps did not desire, to contest, whatever precautions might be taken against its oppressive exercise. Their power was regarded as necessary, but also as highly dangerous; as a weapon which they would attempt to use against their subjects, no less than against external enemies. To prevent the weaker members of the community from being preyed upon by innumerable vultures, it was needful that there should be an animal of prey stronger than the rest, commissioned to keep them down. But as the king of the vultures would be no less bent upon preying on the flock than any of the minor harpies, it was indispensable to be in a perpetual attitude of defence against his beak and claws. The aim, therefore, of patriots, was to set limits to the power which the ruler should be suffered to exercise over the community; and this limitation was what they meant by liberty. It was attempted in two ways. First, by obtaining a recognition of certain immunities, called political liberties or rights, which it was to be regarded as a breach of duty in the ruler to infringe, and which if he did infringe, specific resistance, or general rebellion, was held to be justifiable. A second, and generally a later expedient, was the establishment of constitutional checks; by which the consent of the community, or of a body of some sort, supposed to represent its interests, was made a necessary condition to some of the more important acts of the governing power. To the first of these modes of limitation, the ruling power, in most European countries, was compelled, more or less, to submit. It was not so with the second; and to attain this,
    or when already in some degree possessed, to attain it more completely, became everywhere the principal object of the lovers of liberty. And so long as mankind were content to combat one enemy by another, and to be ruled by a master, on condition of being guaranteed more or less efficaciously against his tyranny, they did not carry their aspirations beyond this point.
  translation_ja: 私たちがまず親しむ歴史、なかでもギリシャ、ローマ、イングランドの歴史で最も目立つのは、自由と権力との争いである。ただし昔は、臣民、またはその一部と、政府との争いだった。自由とは、政治の支配者の専横から守られることを意味した。ギリシャの一部の民衆政体を例外として、支配者は支配される民衆と必然的に対立するものと考えられていた。支配者は一人の君主か、一つの部族か身分集団であり、その権力は世襲か征服によって得たものだった。いずれにせよ、支配される人々が任せておくかどうかを決められるものではない。圧政を防ぐためにどんな手を打っても、支配者の優位そのものには、人々はあえて異議を唱えず、恐らく唱えたいとも思わなかった。その力は必要であると同時にきわめて危険であり、支配者は外敵に向けるのと同じように臣民に向けても、それを武器に使おうとするだろうと考えられた。共同体の弱い者が無数のハゲタカの餌食にならないようにするには、ほかのどれよりも強い猛禽を一羽置き、ほかの猛禽を押さえさせる必要があった。だがハゲタカの王も、ほかの小さな猛禽と同じように群れをつけ狙うのだから、そのくちばしと爪にはいつでも身構えていなければならなかった。したがって愛国者たちが目指したのは、支配者が共同体に対してふるってよい権力に限界を設けることだった。彼らが自由といったのは、この制限のことである。方法は二つあった。第一は、政治的自由ないし権利と呼ばれた、支配者が踏み込めない領域を認めさせることだった。支配者が侵せば義務違反であり、実際に侵したなら、その措置に抗うことも、広く反乱を起こすことも正当とされた。第二の、ふつう後に現れた策は、憲法による抑制を設けることだった。統治権力が重要な行為をするには、共同体か、その利益を代表するものとされた何らかの機関の同意を欠かせないようにするのである。第一の制限には、ヨーロッパの大半の国で、統治権力も多少は従わざるを得なかった。第二の制限はそうではなかった。この制限を勝ち取ること、すでにある程度得ていればそれをさらに完全にすることが、どこでも自由を愛する人々の主な目標になった。人々は、敵を別の敵に当たらせて、ある程度有効に専横から守ってもらえるなら主人に治められてもよい、と考えていたあいだは、それ以上を望まなかった。
  translation_status: reviewed

    precision: page
    printed_page: '98'
    printed_page_end: '102'
    source_sequence: 65
  source_text: 'Before quitting the subject of freedom of opinion, it is fit to take some notice of those who say, that the free expression of all opinions should be permitted, on condition that the manner be temperate, and do not pass the bounds of fair discussion. Much might be said on the impossibility of fixing where these supposed bounds are to be placed; for if the test be offence to those whose opinion is attacked, I think experience testifies that this offence is given whenever the attack is telling and powerful, and that every opponent who pushes them hard, and whom they find it difficult to answer, appears to them, if he shows any strong feeling on the subject, an intemperate opponent. But this, though an important consideration in a practical point of view, merges in a more fundamental objection. Undoubtedly the manner of asserting an opinion, even though it be a true one, may be very objectionable, and may justly incur severe censure. But the principal offences of the kind are such as it is mostly impossible, unless by accidental self-betrayal, to bring home to conviction. The gravest of them is, to argue sophistically, to suppress facts or arguments, to misstate the elements of the case, or misrepresent the opposite opinion. But all this, even to the most aggravated degree, is so continually done in perfect good faith, by persons who are not considered, and in many other respects may not deserve to be considered, ignorant or incompetent, that it is rarely possible on adequate grounds conscientiously to stamp the misrepresentation as morally culpable; and still less could law presume to interfere with this kind of controversial misconduct. With regard to what is commonly meant by intemperate discussion, namely invective, sarcasm, personality, and the like, the denunciation of these weapons would deserve more sympathy if it were ever proposed to interdict them equally to both sides; but it is only desired to restrain the employment of them against the prevailing opinion: against the unprevailing they may not only be used without general disapproval, but will be likely to obtain for him who uses them the praise of honest zeal and righteous indignation. Yet whatever mischief arises from their use, is greatest when they are employed against the comparatively defenceless; and whatever unfair advantage can be derived by any opinion from this mode of asserting
    it, accrues almost exclusively to received opinions. The worst offence of this kind which can be committed by a polemic, is to stigmatise those who hold the contrary opinion as bad and immoral men. To calumny of this sort, those who hold any unpopular opinion are peculiarly exposed, because they are in general few and uninfluential, and nobody but themselves feel much interest in seeing justice done them; but this weapon is, from the nature of the case, denied to those who attack a prevailing opinion: they can neither use it with safety to themselves, nor, if they could, would it do anything but recoil on their own cause. In general, opinions contrary to those commonly received can only obtain a hearing by studied moderation of language, and the most cautious avoidance of unnecessary offence, from which they hardly ever deviate even in a slight degree without losing ground: while unmeasured vituperation employed on the side of the prevailing opinion, really does deter people from professing contrary opinions, and from listening to those who profess them. For the interest, therefore, of truth and justice, it is far more important to restrain this employment of vituperative language than the other; and, for example, if it were necessary to choose, there would be much more need to discourage offensive attacks on infidelity, than on religion. It is, however, obvious that law and authority have no business with restraining either, while opinion ought, in every instance, to determine its verdict by the circumstances of the individual case; condemning every one, on whichever side of the argument he places himself, in whose mode of advocacy either want of candour, or malignity, bigotry, or intolerance of feeling manifest themselves; but not inferring these vices from the side which a person takes, though it be the contrary side of the question to our own: and giving merited honour to every one, whatever opinion he may hold, who has calmness to see and honesty to state what his opponents and their opinions really are, exaggerating nothing to their discredit, keeping nothing back which tells, or can be supposed to tell, in their favour. This is the real morality of public discussion; and if often violated, I am happy to think that there are many controversialists who to a great extent observe it, and a still greater number who conscientiously strive towards it.'
  translation_ja: 意見の自由の話を終える前に、どの意見も、述べ方が節度を守り、公正な議論の範囲を越えないかぎりは、自由に述べさせるべきだという人を、いくらか考慮するのがふさわしい。そのいわゆる範囲をどこに定めるか、決めようがないことについては、多くを語れる。攻撃される意見の持ち主が気を悪くすることが目安なら、経験が示すのは、攻撃が的を射て力強いときはいつでも、相手は気を悪くすることだと思う。手厳しく迫り、答えるのが難しい相手は誰でも、その主題について強い気持ちを少しでも表せば、相手には節度のない論敵に見える。とはいえ、実際上では重要なこの問題にも、もっと根本的な異議がある。意見を主張する仕方は、たとえ意見が正しくても、ひどく問題があり、強く非難されて当然な場合が、確かにある。だがおもな不正は、当人がたまたま尻尾を出すのでなければ、ほとんど立証しようがないものだ。最も重大なのは、こじつけで論じること、事実や論拠を伏せること、事柄の要点を誤って述べること、相手の意見をゆがめて伝えることだ。しかし人は、無知や無能だと思われておらず、ほかの多くの点でも、実際そう見られるいわれがないとしても、心からの誠意をもって、極端なほどにさえ、これを絶えず行う。そのため、十分な根拠に立ち、良心に従って、意見をゆがめて伝えたことは道徳的な罪だと断じることはめったにできない。法律がこのような議論の不正に、あえて介入できる見込みは、なおさらに小さい。ふつう節度のない議論と言われる、ののしり、皮肉、人格攻撃などのことなら、これらの武器を非難することにもっと共感を寄せてもよいのは、双方に等しく禁じるという話があるときだ。ところが望まれているのは、通説を攻撃する場合にだけこれを抑えることだ。少数の意見に対しては、世間からとがめられずに使ってよいばかりか、使った者は、誠実な熱意と正しい憤りを持つと褒められそうである。だが、こうしたやり方が害を生むなら、比較的身を守れない人に対して使われるときが、最も害が大きい。こう述べることで意見が得る不公正な利益は、ほぼもっぱら通説のものである。論争する者がこのたぐいで犯しうる最悪の振る舞いは、反対の意見の持ち主は悪人で不道徳だという烙印を押すことだ。世間で人気のない意見を持つ人は、たいてい少数で影響力がなく、公正に扱ってもらおうという関心は自分たちのほかにはほとんどないので、このような中傷をとくに受けやすい。だが通説を攻撃する人には、事柄の性質からして、この武器は使えない。使えば身に危険が及ぶし、使えたとしても、自分の主張に跳ね返るだけだ。一般に、通説に反対する意見は、言葉遣いによく注意して節度を守り、不必要に気分を害さないよう細心の用心をしなければ、聞いてもらうことさえできない。わずかでもそこから外れれば、ほとんど必ず立場を悪くする。一方、通説の側で際限のない悪口を使えば、実際に、反対の意見を公言する人も、その人の話を聞く人も、二の足を踏む。したがって真理と正義のためには、悪口を使うなら、反対の場合よりこちらを抑えるほうが、はるかに重要だ。どちらかを選ぶ必要があるなら、たとえば宗教への攻撃より、信仰のない者への害意ある攻撃をとめる必要がはるかに強い。とはいえ、法や権力には、いずれも抑えるいわれはないことは明白だ。世論のほうは、どの場合にも個別の事情によって裁くべきである。どちら側で論じるにせよ、弁護の仕方に率直さが欠け、悪意、偏狭、または不寛容な感情が現れる者は、誰であれ非難する。ただ、その人の側が自分たちと反対だからといって、その側についたことを理由に、こうした欠点があると推し量ってはいけない。逆に、どんな意見を持とうと、相手と相手の意見のありのままを見る冷静さ、それを述べる正直さがあって、相手に不利なことは誇張せず、相手に有利に働く事柄、あるいはそう思われうる事柄を何も隠さない人には、ふさわしい敬意を払う。これが公の議論の本当の道徳である。しばしば破られるとはいえ、かなりの程度守る論客が多く、良心に従ってこれに近づこうと努める人はもっと多いと思えるのは、喜ばしいことだ。
  translation_status: reviewed
- id: ol-fn-6-01
  section_id: ch-02
  kind: note_body
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: block
    url: https://raw.githubusercontent.com/GITenberg/On-Liberty_34901/5f5238d21f3be5cfc51f00344934c98fe801d7b2/34901-h/34901-h.htm#Footnote_6_6
    anchor: Footnote_6_6
    source_sequence: 66
  source_text: These words had scarcely been written, when, as if to give them an emphatic contradiction, occurred the Government Press Prosecutions of 1858. That ill-judged interference with the liberty of public discussion has not, however, induced me to alter a single word in the text, nor has it at all weakened my conviction that, moments of panic excepted, the era of pains and penalties for political discussion has, in our own country, passed away. For, in the first place, the prosecutions were not persisted in; and, in the second, they were never, properly speaking, political prosecutions. The offence charged was not that of criticising institutions, or the acts or persons of rulers, but of circulating what was deemed an immoral doctrine, the lawfulness of Tyrannicide.
  translation_ja: この言葉を書いてまもなく、あたかも強く反証するかのように、一八五八年、政府は出版物をめぐって訴追を行った。だが公の議論の自由へのこの軽率な介入を理由に、私は本文の一語も改めなかった。一時の恐慌を除けば、政治上の議論に苦痛や罰が科される時代は、わが国では過ぎ去ったという確信も、少しも揺らいでいない。第一に、訴追は最後まで続けられず、第二に、そもそも厳密には政治上の訴追でもなかったからである。問われたのは制度、支配者の行為、または支配者自身を批判した罪ではなかった。不道徳だとみなされた教説、すなわち暴君の殺害は合法だとする教説を広めた罪であった。
  translation_status: reviewed
- id: ol-fn-6-02
  section_id: ch-02
  kind: note_body
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: block
    url: https://raw.githubusercontent.com/GITenberg/On-Liberty_34901/5f5238d21f3be5cfc51f00344934c98fe801d7b2/34901-h/34901-h.htm#Footnote_6_6
    anchor: Footnote_6_6
    source_sequence: 67
  source_text: If the arguments of the present chapter are of any validity, there ought to exist the fullest liberty of professing and discussing, as a matter of ethical conviction, any doctrine, however immoral it may be considered. It would, therefore, be irrelevant and out of place to examine here, whether the doctrine of Tyrannicide deserves that title. I shall content myself with saying, that the subject has been at all times one of the open questions of morals; that the act of a private citizen in striking down a criminal, who, by raising himself above the law, has placed himself beyond the reach of legal punishment or control, has been accounted by whole nations, and by some of the best and wisest of men, not a crime, but an act of exalted virtue; and that, right or wrong, it is not of the nature of assassination, but of civil war. As such, I hold that the instigation to it, in a specific case, may be a proper subject of punishment, but only if an overt act has followed, and at least a probable connection can be established between the act and the instigation. Even then, it is not a foreign government, but the very government assailed, which alone, in the exercise of self-defence, can legitimately punish attacks directed against its own existence.
  translation_ja: 本章の議論にいくらかでも妥当なところがあるなら、どれほど不道徳とみなされた教説でも、倫理上の信念として公言し議論する、最大限の自由がなければならない。したがって、暴君殺害を認める説が不道徳の名に値するかを調べるのは、ここでは関係がなく場違いである。どの時代にも、これは結論の出ていない道徳上の問いの一つであったと述べるにとどめたい。法の上に自分を置き、法律の処罰や統制の手の届かないところに身を置いた罪人を、一市民が倒す行為は、いくつもの国民全体や、最も立派で賢明といえる人の一部に、犯罪ではなく、気高い徳の行為とされてきた。また、その是非はともかく、暗殺の性質を持つのではなく、内戦の性質を持つ。したがって個別の事件で、この行為をそそのかすことは、処罰にふさわしい場合があると、私は考える。ただし、実際に公然とした行為がその後に起こり、その行為と扇動のあいだに、少なくともありそうな関連を立証できる場合に限る。それでも、外国の政府ではなく、現に攻撃された当の政府だけが、自らを守るため、その存続をねらった攻撃を正当に処罰できる。
  translation_status: reviewed

    precision: page
    printed_page: '151'
    printed_page_end: '152'
    source_sequence: 104
  source_text: 'And even (it will be added) if the consequences of misconduct could be confined to the vicious or thoughtless individual, ought society to abandon to their own guidance those who are manifestly unfit for it? If protection against themselves is confessedly due to children and persons under age, is not society equally bound to afford it to persons of mature years who are equally incapable of self-government? If gambling, or drunkenness, or incontinence, or idleness, or uncleanliness, are as injurious to happiness, and as great a hindrance to improvement, as many or most of the acts prohibited by law, why (it may be asked) should not law, so far as is consistent with practicability and social convenience, endeavour to repress these also? And as a supplement to the unavoidable imperfections of law, ought not opinion at least to organise a powerful police against these vices, and visit rigidly with social penalties those who are known to practise them? There is no question here (it may be said) about restricting individuality, or impeding the trial of new and original experiments in living. The only things it is sought to prevent are things which have been tried and condemned from the beginning of the world until now; things which experience has shown not to be useful or suitable to any person''s individuality. There must be some length of time and amount of experience, after which a moral or prudential truth may be regarded as established: and it is merely desired to prevent generation after generation from falling over the same precipice which has been fatal to their predecessors.'
  translation_ja: さらにこう付け加える人もいよう。悪い行動の結果が、悪癖のある、あるいは軽はずみな当人だけに及ぶとしても、自分で自分を導くのに明らかに向かない人は、社会が本人任せにしてよいのか。子どもや未成年の人を自分自身から守るべきだと認めるなら、同じように自分を治められない成人にも、同じ保護を与える義務があるのではないか。賭け事、泥酔、放縦、怠惰、不潔が、法律で禁じられている行いの多く、あるいは大半と同じほど、幸福を害し、向上を妨げるなら、実行でき、社会全体に都合がつくかぎり、法律はこれらをも抑えようとするべきではないか。また、どうしても不完全な法律を補うものとして、せめて世論がこれらの悪癖に強力な取り締まりを設け、そうしていると分かった人に厳しく社会の罰を課すべきではないか。ここで問題なのは、個性を制限したり、新しい独創的な生き方を試みるのを妨げたりすることではない、とも言われるだろう。防ぎたいのは、世の始まりから今まで試され、退けられてきた事柄、誰の個性にも役立たず、誰にも合わないことが経験で示されたものだけである。ある期間とある量の経験を経れば、道徳や分別についての真理が確立したと考えてよいはずだ。先の世代の命取りになった同じ崖から、一世代また一世代と落ちるのを防ごうというだけなのだ。
  translation_status: reviewed
- id: ol-04-010
  section_id: ch-04
  kind: paragraph
  origin: source

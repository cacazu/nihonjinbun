    printed_page_end: '160'
    source_sequence: 108
  source_text: The evil here pointed out is not one which exists only in theory; and it may perhaps be expected that I should specify the instances in which the public of this age and country improperly invests its own preferences with the character of moral laws. I am not writing an essay on the aberrations of existing moral feeling. That is too weighty a subject to be discussed parenthetically, and by way of illustration. Yet examples are necessary, to show that the principle I maintain is of serious and practical moment, and that I am not endeavouring to erect a barrier against imaginary evils. And it is not difficult to show, by abundant instances, that to extend the bounds of what may be called moral police, until it encroaches on the most unquestionably legitimate liberty of the individual, is one of the most universal of all human propensities.
  translation_ja: ここで指摘した害は、理屈の上だけにあるのではない。この国のこの時代の世間が、自分たちの好みを不当に道徳上の法とした場合を、具体的に挙げてほしいと思われるかもしれない。私が書いているのは、今ある道徳感情の逸脱についての論文ではない。それは話のついでに、例として扱うには重い主題である。しかし、私が主張する原理が、実際上まことに重要であり、ありもしない害を防ぐために壁を築こうとしているのではないと示すには、例が要る。道徳を取り締まるとでも呼べる範囲を広げて、疑いなく正当な個人の自由にまで踏み込むことが、人間の性向のうちでもとりわけ普遍的であると示すのは、たくさんの実例があるので難しくない。
  translation_status: reviewed

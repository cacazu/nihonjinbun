  source_text: 'The subject of this Essay is not the so-called Liberty of the Will, so unfortunately opposed to the misnamed doctrine of Philosophical Necessity; but Civil, or Social Liberty: the nature and limits of the power which can be legitimately exercised by society over the individual. A question seldom stated, and hardly ever discussed, in general terms, but which profoundly influences the practical controversies of the age by its latent presence, and is likely soon to make itself recognised as the vital question of the future. It is so far from being new, that in a certain sense, it has divided mankind, almost from the remotest ages; but in the stage of progress into which the more civilised portions of the species have now entered, it presents itself under new conditions, and requires a different and more fundamental treatment.'
  translation_ja: 本論の主題は、いわゆる意志の自由ではない。この言葉は、哲学的必然という、これも名のつけ方を誤った学説と、不幸にも対立させられてきた。ここで扱うのは市民の自由、あるいは社会的自由である。社会は個人に対してどのような力をふるうことが正当に許され、どこまでがその限界なのか。これが問題である。一般的な形で問いにされることはまれで、論じられることはほとんどない。それでもこの問題は、潜んでいながら時代の現実の論争に深い影響を及ぼしており、ほどなく、将来を左右する問題だと認められるだろう。新しい問題どころか、ある意味では、ほとんど有史のはじめから人類を二つに分けてきたものだ。ただ、人類のうち社会の発達した地域が今や達した段階では、この問題は新しい条件のもとに現れており、これまでとは違う、いっそう根本からの取り組みを必要とする。
  translation_status: reviewed
- id: ol-01-002
  section_id: ch-01
  kind: paragraph
  origin: source

    printed_page_end: '165'
    source_sequence: 111
  source_text: 'The preceding instances may be objected to, although unreasonably, as drawn from contingencies impossible among us: opinion, in this country, not being likely to enforce abstinence from meats, or to interfere with people for worshipping, and for either marrying or not marrying, according to their creed or inclination. The next example, however, shall be taken from an interference with liberty which we have by no means passed all danger of. Wherever the Puritans have been sufficiently powerful, as in New England, and in Great Britain at the time of the Commonwealth, they have endeavoured, with considerable success, to put down all public, and nearly all private, amusements: especially music, dancing, public games, or other assemblages for purposes of diversion, and the theatre. There are still in this country large bodies of persons by whose notions of morality and religion these recreations are condemned; and those persons belonging chiefly to the middle class, who are the ascendant power in the present social and political condition of the kingdom, it is by no means impossible that persons of these sentiments may at some time or other command a majority in Parliament. How will the remaining portion of the community like to have the amusements that shall be permitted to them regulated by the religious and moral sentiments of the stricter Calvinists and Methodists? Would they not, with considerable peremptoriness, desire these intrusively pious members of society to mind their own business? This is precisely what should be said to every government and every public, who have the pretension that no person shall enjoy any pleasure which they think wrong. But if the principle of the pretension be admitted, no one can reasonably object to its being acted on in the sense of the majority, or other preponderating power in the country; and all persons must be ready to conform to the idea of a Christian commonwealth, as understood by the early settlers in New England, if a religious profession similar to theirs should ever succeed in regaining its lost ground, as religions supposed to be declining have so often been known to do.'
  translation_ja: ここまでの例は、わが国ではありえない事態から取られた、と、道理には合わなくても、反論されるかもしれない。この国の世論が、肉を断つように強いたり、信条や好みに沿って礼拝し、結婚し、あるいは結婚しない人を邪魔したりすることはなさそうだからである。そこで次は、私たちが少しも危険を免れたわけではない、自由への介入から例を取ろう。ニューイングランドや、共和国時代のイギリスのように、清教徒が十分な力を持ったところではどこでも、公の娯楽をすべて、私的な娯楽もほとんどすべて、とくに音楽、踊り、人の集まる競技、ほかの気晴らしのための集まり、そして芝居を抑え込もうとし、かなり成功した。彼らの道徳や宗教の考えでは、こうした楽しみはよくないとされる。そういう人々の大きな集団は、今もなお、この国にある。そうした人々は、現在のこの国の社会と政治で優勢な勢力である中産階級におもに属する。そのような感情を持つ人々が、いつか議会の多数を占めることは、決してありえない話ではない。共同体のほかの人々は、許される娯楽まで、厳格なカルヴァン派やメソジスト派の宗教心と道徳心によって決められるのを、どう思うだろう。この出しゃばりな信心家たちに、自分のことだけ気にしていろと、かなり断固として言いたくならないだろうか。まさにそう言うべきなのは、自分たちが悪いと思う楽しみは誰も享受してはならないと称する、あらゆる政府、あらゆる世間に対してである。だが、その要求の原理をひとたび認めれば、多数派やほかの国内の優勢な勢力がその意味で実行に移すのに、誰も理にかなって異議を唱えられない。最初にニューイングランドに定住した人々が考えたキリスト教の共和国に、皆が従う用意をしなければならない。彼らと似た信仰がもし、失った足場をいつか取り戻したらの話だが、衰えていると思われた宗教がそうすることは、しばしばあった。
  translation_status: reviewed

    precision: page
    printed_page: '21'
    printed_page_end: '23'
    source_sequence: 16
  source_text: 'But there is a sphere of action in which society, as distinguished from the individual, has, if any, only an indirect interest; comprehending all that portion of a person''s life and conduct which affects only himself, or if it also affects others, only with their free, voluntary, and undeceived consent and participation. When I say only himself, I mean directly, and in the first instance: for whatever affects himself, may affect others through himself; and the objection which may be grounded on this contingency, will receive consideration in the sequel. This, then, is the appropriate region of human liberty. It comprises, first, the inward domain of consciousness; demanding liberty of conscience, in the most comprehensive sense; liberty of thought and feeling; absolute freedom of opinion and sentiment on all subjects, practical or speculative, scientific, moral, or theological. The liberty of expressing and publishing opinions may seem to fall under a different principle, since it belongs to that part of the conduct of an individual which concerns other people; but, being almost of as much importance as the liberty of thought itself, and resting in great part on the same reasons, is practically inseparable from it. Secondly, the principle requires liberty of tastes and pursuits; of framing the plan of our life to suit our own character; of doing as we like, subject to such consequences as may follow: without impediment from our fellow-creatures, so long as what we do does not harm them, even though they should think our conduct foolish, perverse, or wrong. Thirdly, from this liberty of each individual, follows the liberty, within the same limits, of combination among individuals; freedom to unite, for any purpose not involving harm to others: the persons combining being supposed to be of full age, and not forced or deceived.'
  translation_ja: しかし、個人とは区別された社会には、利害があるとしても間接の利害しかない行動の領域がある。その人の生活や行動のうち、本人にしか影響しないか、ほかの人に影響しても、その人たちが欺かれることなく、自由に自分の意志で同意し、参加した場合だけに限られるもの、すべてがそうである。本人にしか、と言うのは、直接に、さしあたり、という意味である。本人に影響することは、その人を通して他人にも影響しうる。この可能性をもとにした反論は、後で取り上げる。さて、ここにこそ人間の自由にふさわしい領域がある。その第一は、意識の内面である。最も広い意味での良心の自由、思考と感情の自由、そして実践上の問題でも思弁上の問題でも、科学でも道徳でも神学でも、あらゆる問題についての意見と心情の絶対の自由が必要だ。意見を表し、公にする自由は、個人の行動のうち他人に関わる部分に属するので、別の原理のもとに置かれるように見えるかもしれない。だが思考そのものの自由にほぼ等しい重要性を持ち、その根拠も大部分同じなので、事実上切り離すことはできない。第二に、好みと取り組むことを選ぶ自由、自分の性格に合うよう自分の暮らし方を組み立てる自由、どんな結果が生じようとそれは自分で引き受けて、好きなようにする自由が要る。しようとすることがほかの人を害さないかぎり、たとえ他人がこちらの行いを、愚かだ、ひねくれている、間違っていると思っても、妨げられてはならない。第三に、この個人一人ひとりの自由から、同じ限界の内側で、個人同士が結びつく自由が出てくる。他人に害を与えない目的なら何のためにでも団結してよい。ただし結びつく人は、成人で、強制も欺きも受けていないことが前提である。
  translation_status: reviewed
- id: ol-01-013
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '23'
    printed_page_end: '23'
    source_sequence: 17
  source_text: No society in which these liberties are not, on the whole, respected, is free, whatever may be its form of government; and none is completely free in which they do not exist absolute and unqualified. The only freedom which deserves the name, is that of pursuing our own good in our own way, so long as we do not attempt to deprive others of theirs, or impede their efforts to obtain it. Each is the proper guardian of his own health, whether bodily, or mental and spiritual. Mankind are greater gainers by suffering each other to live as seems good to themselves, than by compelling each to live as seems good to the rest.
  translation_ja: これらの自由がおおむね尊重されていない社会は、どんな統治形態であっても自由ではない。また、これらの自由が無条件かつ完全に認められていなければ、完全に自由な社会ではない。自由の名に値するのは、他人からその人自身の利益を奪ったり、それを得ようとする努力を妨げたりしないかぎり、自分の利益を自分のやり方で求めることだけである。身体であれ、知性や精神であれ、自分の健康を守るべき人は自分である。互いに自分がよいと思うように生きさせるほうが、皆がよいと思うように一人ひとりに生きることを強いるよりも、人類は多くを得る。
  translation_status: reviewed
- id: ol-01-014
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '23'
    printed_page_end: '25'
    source_sequence: 18
  source_text: 'Though this doctrine is anything but new, and, to some persons, may have the air of a truism, there is no doctrine which stands more directly opposed to the general tendency of existing opinion and practice. Society has expended fully as much effort in the attempt (according to its lights) to compel people to conform to its notions of personal, as of social excellence. The ancient commonwealths thought themselves entitled to practise, and the ancient philosophers countenanced, the regulation of every part of private conduct by public authority, on the ground that the State had a deep interest in the whole bodily and mental discipline of every one of its citizens; a mode of thinking which may have been admissible in small republics surrounded by powerful enemies, in constant peril of being subverted by foreign attack or internal commotion, and to which even a short interval of relaxed energy and self-command might so easily be fatal, that they could not afford to wait for the salutary permanent effects of freedom. In the modern world, the greater size of political communities, and above all, the separation between spiritual and temporal authority (which placed the direction of men''s consciences in other hands than those which controlled their worldly affairs), prevented so great an interference by law in the details of private life; but the engines of moral repression have been wielded more strenuously against divergence from the reigning opinion in self-regarding, than even in social matters; religion, the most powerful of the elements which have entered into the formation of moral feeling, having almost always been governed either by the ambition of a hierarchy, seeking control over every department of human conduct, or by the spirit of Puritanism. And some of those modern reformers who have placed themselves in strongest opposition to the religions of the past, have been noway behind either churches or sects in their assertion of the right of spiritual domination: M. Comte, in particular, whose social system, as unfolded in his Traité de Politique Positive, aims at establishing (though by moral more than by legal appliances) a despotism of society over the individual, surpassing anything contemplated in the political ideal of the most rigid disciplinarian among the ancient philosophers.'
  translation_ja: この原理は新しいどころではなく、人によっては当たり前のことのようにも聞こえるかもしれない。それでも、今ある意見と慣行の一般的な傾向に、これほど真っ向から反する学説はほかにない。社会は、自分なりの見地から、社会の一員としてこうあるべきだという考えを人々に押しつけるのと少なくとも同じくらい努力して、一個人としてこうあるべきだという考えを押しつけてきた。古代の諸国家は、国家には市民一人ひとりの身体と精神がどのように鍛えられるか、その一切に重大な利害があることを理由に、公の権力で私的な行動のあらゆる部分を規制してよいと考え、当時の哲学者はそれを支持した。この考え方は、強い敵に囲まれ、外からの攻撃や内部の騒乱で覆されかねない小さな共和国なら、認める余地があったかもしれない。そうした国では、活動の力と自制とがほんの少しのあいだ緩むだけでも、簡単に命取りになりえたから、自由が長い時間をかけてもたらす健全な効果を待ってはいられなかった。近代の世界では、政治共同体が大きくなり、とりわけ精神の権威と世俗の権力が分かれ、人々の良心を導くことが、世の暮らしを支配する者とは別の手に移った。そのため、法律が私生活の細部にそれほど大きく介入するのは防がれた。だが道徳による抑圧の仕掛けは、世に通用している意見から外れた人に対して、社会に関わる事柄でよりも、自分だけに関わる事柄で、いっそう強力に使われてきた。道徳感情をかたちづくったもののうち最も力のある宗教が、ほぼいつも、人の行動のあらゆる領域を支配しようとする聖職者組織の野心か、清教徒の精神に支配されていたからである。また近代の改革者のうち、これまでの宗教に最も強く反対してきた人々が、精神を支配する権利を主張する点では、教会や宗派に少しも引けを取らなかった。とりわけコント氏である。その社会制度は『実証政治体系』に述べられたとおり、法律よりも主に道徳の手段で、社会による個人の専制支配を目指す。古代の哲学者のうち最も厳格に規律を求めた人が描いた政治の理想にも、これほどのものはなかった。
  translation_status: reviewed
- id: ol-01-015
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '25'
    printed_page_end: '26'
    source_sequence: 19
  source_text: 'Apart from the peculiar tenets of individual thinkers, there is also in the world at large an increasing inclination to stretch unduly the powers of society over the individual, both by the force of opinion and even by that of legislation: and as the tendency of all the changes taking place in the world is to strengthen society, and diminish the power of the individual, this encroachment is not one of the evils which tend spontaneously to disappear, but, on the contrary, to grow more and more formidable. The disposition of mankind, whether as rulers or as fellow-citizens to impose their own opinions and inclinations as a rule of conduct on others, is so energetically supported by some of the best and by some of the worst feelings incident to human nature, that it is hardly ever kept under restraint by anything but want of power; and as the power is not declining, but growing, unless a strong barrier of moral conviction can be raised against the mischief, we must expect, in the present circumstances of the world, to see it increase.'
  translation_ja: 個々の思想家に特有の見解はさておき、世の中全体でも、世論の力で、さらには法律の力でさえ、個人に対する社会の権力をむやみに広げようとする傾向が強まっている。そして世に起きている変化はすべて、社会を強くし、個人の力を弱くする方向に向かっている。だからこの侵害は、自然に消えてゆくたぐいの害ではなく、反対にますます恐ろしいものになる。人は統治者としてであれ同じ市民としてであれ、自分の考えや好みを他人の行動規範として押しつけがちである。この性向を、人間性から生まれる最も立派な感情のいくつかも、最も悪い感情のいくつかも、強く後押ししている。そのため、押しつける力がない場合を除けば、ほとんど抑えられることがない。その力は衰えるどころか増しているのだから、この害を防ぐ強固な道徳的信念の壁を築けないかぎり、今の世の事情からして、害が増すのは覚悟しなければならない。
  translation_status: reviewed
- id: ol-01-016
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '26'
    printed_page_end: '27'
    source_sequence: 20
  source_text: 'It will be convenient for the argument, if, instead of at once entering upon the general thesis, we confine ourselves in the first instance to a single branch of it, on which the principle here stated is, if not fully, yet to a certain point, recognised by the current opinions. This one branch is the Liberty of Thought: from which it is impossible to separate the cognate liberty of speaking and of writing. Although these liberties, to some considerable amount, form part of the political morality of all countries which profess religious toleration and free institutions, the grounds, both philosophical and practical, on which they rest, are perhaps not so familiar to the general mind, nor so thoroughly appreciated by many even of the leaders of opinion, as might have been expected. Those grounds, when rightly understood, are of much wider application than to only one division of the subject, and a thorough consideration of this part of the question will be found the best introduction to the remainder. Those to whom nothing which I am about to say will be new, may therefore, I hope, excuse me, if on a subject which for now three centuries has been so often discussed, I venture on one discussion more.'
  translation_ja: 議論の進め方としては、すぐ全体の主張に入るより、ここで述べた原理が、今日の意見によって、全面的にではなくともある程度までは認められている一つの分野を、まず取り上げるのがよいだろう。それが思想の自由である。それと同じ性質を持つ発言と著述の自由を、思想の自由から切り離すことはできない。宗教的寛容と自由な制度を掲げる国々では、これらの自由はどこでも、少なからず政治道徳の一部になっている。だがその根拠となる哲学上および実際上の理由は、予想されるほど一般に知られず、世論を導く人々の多くにさえ、十分に理解されてはいないようだ。その理由を正しく理解すれば、一つの分野にとどまらず、ずっと広く当てはまる。問題のこの部分をよく考えることが、残る部分への最もよい手引きになると分かるだろう。これから言うことに何一つ新しいところがないという人にも、ここ三百年、何度となく論じられた主題に、もう一度あえて論を加えることを、どうかお許し願いたい。
  translation_status: reviewed

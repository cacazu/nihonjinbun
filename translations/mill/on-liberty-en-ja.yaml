    precision: page
    printed_page: '154'
    printed_page_end: '157'
    source_sequence: 106
  source_text: 'But with regard to the merely contingent, or, as it may be called, constructive injury which a person causes to society, by conduct which neither violates any specific duty to the public, nor occasions perceptible hurt to any assignable individual except himself; the inconvenience is one which society can afford to bear, for the sake of the greater good of human freedom. If grown persons are to be punished for not taking proper care of themselves, I would rather it were for their own sake, than under pretence of preventing them from impairing their capacity of rendering to society benefits which society does not pretend it has a right to exact. But I cannot consent to argue the point as if society had no means of bringing its weaker members up to its ordinary standard of rational conduct, except waiting till they do something irrational, and then punishing them, legally or morally, for it. Society has had absolute power over them during all the early portion of their existence: it has had the whole period of childhood and nonage in which to try whether it could make them capable of rational conduct in life. The existing generation is master both of the training and the entire circumstances of the generation to come; it cannot indeed make them perfectly wise and good, because it is itself so lamentably deficient in goodness and wisdom; and its best efforts are not always, in individual cases, its most successful ones; but it is perfectly well able to make the rising generation, as a whole, as good as, and a little better than, itself. If society lets any considerable number of its members grow up mere children, incapable of being acted on by rational consideration of distant motives, society has itself to blame for the consequences. Armed not only with all the powers of education, but with the ascendency which the authority of a received opinion always exercises over the minds who are least fitted to judge for themselves; and aided by the natural penalties which cannot be prevented from falling on those who incur the distaste or the contempt of those who know them; let not society pretend that it needs, besides all this, the power to issue commands and enforce obedience in the personal concerns of individuals, in which, on all principles of justice and policy, the decision ought to rest with those who are to abide the consequences. Nor is there
    anything which tends more to discredit and frustrate the better means of influencing conduct, than a resort to the worse. If there be among those whom it is attempted to coerce into prudence or temperance, any of the material of which vigorous and independent characters are made, they will infallibly rebel against the yoke. No such person will ever feel that others have a right to control him in his concerns, such as they have to prevent him from injuring them in theirs; and it easily comes to be considered a mark of spirit and courage to fly in the face of such usurped authority, and do with ostentation the exact opposite of what it enjoins; as in the fashion of grossness which succeeded, in the time of Charles II., to the fanatical moral intolerance of the Puritans. With respect to what is said of the necessity of protecting society from the bad example set to others by the vicious or the self-indulgent; it is true that bad example may have a pernicious effect, especially the example of doing wrong to others with impunity to the wrong-doer. But we are now speaking of conduct which, while it does no wrong to others, is supposed to do great harm to the agent himself: and I do not see how those who believe this, can think otherwise than that the example, on the whole, must be more salutary than hurtful, since, if it displays the misconduct, it displays also the painful or degrading consequences which, if the conduct is justly censured, must be supposed to be in all or most cases attendant on it.'
  translation_ja: しかし公に対する特定の義務に反せず、本人以外の特定の誰かに目に見える害をもたらすわけでもない行動から、たまたま社会が受ける、あるいは間接的なものと呼べる害はどうか。それは、人間の自由というさらに大きな善のために、社会が耐えられる不都合である。自分の面倒を十分に見なかったために大人を罰するつもりなら、社会に利益をもたらす力を損なうのを防ぐという口実からでなく、本人のためだと言うほうがよい。その利益を要求する権利があると、社会自体、主張してはいないのである。だが理にかなった行動についてのふつうの基準まで、弱い立場の人々を引き上げるのに、理不尽なことをするまで待ってから、それを法や道徳で罰する以外に社会には方法がないかのように、話を進める気にはなれない。彼らが生きはじめてからしばらくのあいだ、社会は彼らに完全な力を持っていた。子ども時代と未成年の全期間にわたって、人生で理にかなった行動ができるようにしてみる機会があった。今の世代は、次の世代の訓練と、それを取り巻く事情のすべてを握っている。もっとも、自らの善良さも知恵も嘆かわしいほど足りないから、次の世代をまったく賢く善良にはできない。一人ひとりの場合、力を尽くしたときに、いつも最もよい結果が出るともかぎらない。それでも育ちゆく世代を全体として、自分たちと同じくらいよく、いや少しばかりよくすることなら、十分にできる。将来の結果を理にかなって考えても行動を変えられない、ただの子どものまま成長する人を、少なからず社会が出すのなら、その結果について社会自身を責めるほかない。教育のあらゆる力を備えるばかりか、通説の権威が、自分で判断する力の最も乏しい人の心にいつもふるう力も備え、自分を知る人々から嫌われたり軽んじられたりする人に避けようなく降りかかる自然な罰にも助けられている。これらすべてのほかに、社会が個人的な事柄で命令を出し、服従させる力まで要ると、言いつくろってはいけない。こういう事柄では、正義と政策のあらゆる原理から、結果を引き受ける者が決めるべきなのだ。また、人の行いに働きかけるよりよい手段を、信用できない、役に立たないものにするのに、それより悪い手段を用いることにまさるものはない。用心深く、節度あるよう強いられる人の中に、力強く独立した人間になる素質を持つ者がいれば、必ずその軛に反抗する。そういう人は、自分が他人の事柄に害を与えるのを防ぐ権利と同じように、自分自身の事柄を他人が統制する権利があるとは、決して感じない。そしてこのような横取りされた権威に真っ向から逆らい、これ見よがしに、その命じるのと正反対のことをするのが、気概や勇気のしるしと見なされやすい。清教徒の道徳上の狂信的な不寛容のあと、チャールズ二世の時代に粗野な振る舞いが流行したのは一例である。悪人や自分を甘やかす人が他人に示す悪い手本から、社会を守る必要があるとも言われる。たしかに、悪い手本は害を与えうる。とりわけ他人に悪いことをしても、した人が罰せられないという手本はそうである。だが今話しているのは、他人に害を与えず、した本人に大きな害を与えると思われている行いだ。そう信じる人なら、その手本は、全体として害よりも教訓のほうが大きいものとしか思えないはずである。悪い行いを見せるなら、その行いが非難されて正当なものであるかぎり、すべて、あるいは大半の場合に伴うと思われる、つらく、品位を落とす結果も見せるからである。
  translation_status: reviewed

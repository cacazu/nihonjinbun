    source_sequence: 122
  source_text: 'Again, trade is a social act. Whoever undertakes to sell any description of goods to the public, does what affects the interest of other persons, and of society in general; and thus his conduct, in principle, comes within the jurisdiction of society: accordingly, it was once held to be the duty of governments, in all cases which were considered of importance, to fix prices, and regulate the processes of manufacture. But it is now recognised, though not till after a long struggle, that both the cheapness and the good quality of commodities are most effectually provided for by leaving the producers and sellers perfectly free, under the sole check of equal freedom to the buyers for supplying themselves elsewhere. This is the so-called doctrine of Free Trade, which rests on grounds different from, though equally solid with, the principle of individual liberty asserted in this Essay. Restrictions on trade, or on production for purposes of trade, are indeed restraints; and all restraint, quâ restraint, is an evil: but the restraints in question affect only that part of conduct which society is competent to restrain, and are wrong solely because they do not really produce the results which it is desired to produce by them. As the principle of individual liberty is not involved in the doctrine of Free Trade, so neither is it in most of the questions which arise respecting the limits of that doctrine: as for example, what amount of public control is admissible for the prevention of fraud by adulteration; how far sanitary precautions, or arrangements to protect work-people employed in dangerous occupations, should be enforced on employers. Such questions involve considerations of liberty, only in so far as leaving people to themselves is always better, cæteris paribus, than controlling them: but that they may be legitimately controlled for these ends, is in principle undeniable. On the other hand, there are questions relating to interference with trade, which are essentially questions of liberty; such as the Maine Law, already touched upon; the prohibition of the importation of opium into China; the restriction of the sale of poisons; all cases, in short, where the object of the interference is to make it impossible or difficult to obtain a particular commodity. These interferences are objectionable, not as infringements on the liberty of the producer or
    seller, but on that of the buyer.'
  translation_ja: さて取引は社会的な行為である。どんな品物であれ、公衆に売ろうとする者は、他人や社会全体の利害に影響することを行う。したがって原理上、その人の行動は社会の管轄下に入る。そこで以前には、重要だと見なされる場合にはどれも、価格を決め、製造の過程を規制するのが政府の義務だと考えられた。だが今では、長い争いを経て、買い手にもほかから買う同じ自由があるという一点だけで抑えをきかせ、生産者と売り手を完全に自由にしておくことが、品物を安く質よくする最も有効な方法だと、認められている。これがいわゆる自由貿易の教えであり、本論で唱える個人の自由の原理と同じくらい確かでも、別の根拠に立つ。取引や取引のための生産の制限は、もちろん制約であり、制約はすべて、制約である点では害である。だがこれらの制約が及ぶのは、社会が制約する権限を持つ行動に限られる。それでも誤っているのは、望む結果を実際にはもたらさないからにすぎない。個人の自由の原理が、自由貿易の教えに関わらないのと同じように、その教えの限度をめぐって生じる問題の大部分にも関わらない。たとえば、混ぜ物による詐欺を防ぐため、どれほど公の統制を認めるか、衛生上の安全策や危険な仕事をする人を守る手立てを、どこまで雇い主に強いるか、といった問題だ。こうした問題に自由を考える余地があるのは、ほかの条件が同じなら、人を統制するより自主性に任せるほうがいつでもよいという程度に限られる。こうした目的のためには統制も正当にできることは、原理上否定できない。だが取引への介入に関する問題の中にも、本質的に自由が問題となるものがある。すでに触れたメイン州の禁酒法、中国へのアヘンの輸入禁止、毒物の販売の制限。要するに、ある品物を手に入れることを不可能か、難しくするのを目的とする介入は、すべてそうである。このような介入が問題なのは、生産者や売り手の自由でなく、買い手の自由を侵すからである。
  translation_status: reviewed
- id: ol-05-005
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '181'
    printed_page_end: '184'
    source_sequence: 123
  source_text: 'One of these examples, that of the sale of poisons, opens a new question; the proper limits of what may be called the functions of police; how far liberty may legitimately be invaded for the prevention of crime, or of accident. It is one of the undisputed functions of government to take precautions against crime before it has been committed, as well as to detect and punish it afterwards. The preventive function of government, however, is far more liable to be abused, to the prejudice of liberty, than the punitory function; for there is hardly any part of the legitimate freedom of action of a human being which would not admit of being represented, and fairly too, as increasing the facilities for some form or other of delinquency. Nevertheless, if a public authority, or even a private person, sees any one evidently preparing to commit a crime, they are not bound to look on inactive until the crime is committed, but may interfere to prevent it. If poisons were never bought or used for any purpose except the commission of murder, it would be right to prohibit their manufacture and sale. They may, however, be wanted not only for innocent but for useful purposes, and restrictions cannot be imposed in the one case without operating in the other. Again, it is a proper office of public authority to guard against accidents. If either a public officer or any one else saw a person attempting to cross a bridge which had been ascertained to be unsafe, and there were no time to warn him of his danger, they might seize him and turn him back, without any real infringement of his liberty; for liberty consists in doing what one desires, and he does not desire to fall into the river. Nevertheless, when there is not a certainty, but only a danger of mischief, no one but the person himself can judge of the sufficiency of the motive which may prompt him to incur the risk: in this case, therefore (unless he is a child, or delirious, or in some state of excitement or absorption incompatible with the full use of the reflecting faculty), he ought, I conceive, to be only warned of the danger; not forcibly prevented from exposing himself to it. Similar considerations, applied to such a question as the sale of poisons, may enable us to decide which among the possible modes of regulation are or are not contrary to principle. Such a precaution, for example, as that of labelling
    the drug with some word expressive of its dangerous character, may be enforced without violation of liberty: the buyer cannot wish not to know that the thing he possesses has poisonous qualities. But to require in all cases the certificate of a medical practitioner, would make it sometimes impossible, always expensive, to obtain the article for legitimate uses. The only mode apparent to me, in which difficulties may be thrown in the way of crime committed through this means, without any infringement, worth taking into account, upon the liberty of those who desire the poisonous substance for other purposes, consists in providing what, in the apt language of Bentham, is called "preappointed evidence." This provision is familiar to every one in the case of contracts. It is usual and right that the law, when a contract is entered into, should require as the condition of its enforcing performance, that certain formalities should be observed, such as signatures, attestation of witnesses, and the like, in order that in case of subsequent dispute, there may be evidence to prove that the contract was really entered into, and that there was nothing in the circumstances to render it legally invalid: the effect being, to throw great obstacles in the way of fictitious contracts, or contracts made in circumstances which, if known, would destroy their validity. Precautions of a similar nature might be enforced in the sale of articles adapted to be instruments of crime. The seller, for example, might be required to enter into a register the exact time of the transaction, the name and address of the buyer, the precise quality and quantity sold; to ask the purpose for which it was wanted, and record the answer he received. When there was no medical prescription, the presence of some third person might be required, to bring home the fact to the purchaser, in case there should afterwards be reason to believe that the article had been applied to criminal purposes. Such regulations would in general be no material impediment to obtaining the article, but a very considerable one to making an improper use of it without detection.'
  translation_ja: 今の例の一つ、毒物の販売は、取り締まりの役割とでも呼べるものの正当な限界はどこか、犯罪や事故を防ぐためなら、どこまで正当に自由に踏み込めるか、という新しい問いを開く。起きた犯罪を見つけ罰するのと同じように、起きる前に用心して犯罪を防ぐのは、異論のない政府の役割の一つだ。だが政府の予防の役割は、罰する役割よりも、はるかに自由を犠牲にして乱用されやすい。人間の正当な行動の自由のうち、何かの違法行為をいっそう容易にすると説明できないものは、しかも、そう説明しても無理のないものは、ほとんどないからだ。それでも、公の機関であれ、私人であれ、誰かが明らかに犯罪を犯そうと用意していることを認めれば、犯罪が実行されるまで何もせず眺める必要はなく、それを防ぐために介入できる。毒物が人殺しをするほかには決して買われず使われないなら、製造と販売を禁じるのは正しい。だが、害がないだけでなく、役に立つ目的にも必要となりうるし、一方で制限を課せば、他方にも及ぶ。また、事故を防ぐのは、公の機関の正当な役目である。安全でないと確認済みの橋を、人が渡ろうとしているのを、役人であれほかの人であれ見かけ、危険を知らせる時間もないなら、引きとめて向こうへ行かせなくても、その人の自由を実際にはまったく侵さない。自由は望むことをすることだが、その人は川に落ちたいのではないからだ。それでも、害が確実なのではなく、おそれがあるだけなら、危険を引き受けようという動機が十分に強いかを判断できるのは、本人だけである。だからこの場合、子どもか、意識が混乱しているか、興奮や没頭でよく考える力を十分に使えない状態でないかぎり、危険を知らせるだけにして、危険に身をさらすことを力で止めるべきではない、と私は考える。毒物の販売についても同じように考えれば、可能な規制のどれが原理に反し、どれが反しないのかを決められるだろう。たとえば、その薬品が危険だと分かる表示を付けるという予防策は、自由を侵さずに強制できる。持っている物に毒性があることを知りたくない買い手はいないからだ。しかし、必ず医師の証明を要求したら、正当な目的に使うのに、時には手に入らず、いつも費用がかかる。毒物をほかの目的で必要とする人の自由を、問題にすべきほどには侵さずに、毒物を使った犯罪を難しくする方法として、私に思いつくのは一つである。ベンサムの的確な言葉で「前もって用意された証拠」と呼ばれるものを備えることだ。この備えは、契約の場合なら誰でもよく知っている。契約が結ばれたとき、法によってその履行を強制できる条件として、署名、証人による確認など、一定の形式を守ることを法が求めるのは、ふつうであり、正しい。あとで争いになれば、実際に契約が結ばれ、法的に無効となる事情がなかったことを証明する証拠があるようにするためだ。実体のない契約や、事情が知られれば無効になる契約にとって、これは大きな障害になる。犯罪の道具になりうる品物を売る場合にも、似た用心を法律で強制できるだろう。たとえば売り手には、取引の正確な時刻、買い手の氏名と住所、売った品物の正確な種類と量を帳簿に記し、何のために必要かを尋ね、答えも記録するよう求められる。医師の処方がなければ、第三者の立ち会いを求めることもできる。あとで犯罪に用いられたと信じるに足る理由が現れたとき、その品物を買ったという事実を立証できるようにするためだ。こうした規制はたいてい、品物を手に入れるのに重大な妨げとはならないが、発覚せずに悪用するには、かなり大きな妨げとなるだろう。
  translation_status: reviewed
- id: ol-05-006
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en

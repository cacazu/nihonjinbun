    source_sequence: 88
  source_text: 'As is usually the case with ideals which exclude one-half of what is desirable, the present standard of approbation produces only an inferior imitation of the other half. Instead of great energies guided by vigorous reason, and strong feelings strongly controlled by a conscientious will, its result is weak feelings and weak energies, which therefore can be kept in outward conformity to rule without any strength either of will or of reason. Already energetic characters on any large scale are becoming merely traditional. There is now scarcely any outlet for energy in this country except business. The energy expended in that may still be regarded as considerable. What little is left from that employment, is expended on some hobby; which may be a useful, even a philanthropic hobby, but is always some one thing, and generally a thing of small dimensions. The greatness of England is now all collective: individually small, we only appear capable of anything great by our habit of combining; and with this our moral and religious philanthropists are perfectly contented. But it was men of another stamp than this that made England what it has been; and men of another stamp will be needed to prevent its decline.'
  translation_ja: 望ましいものの半分を締め出す理想はふつうそうだが、今の世間がほめる基準が生むのは、もう半分のできの悪いまねにすぎない。力ある理性に導かれる大きな活力と、良心による意志にしっかりと治められる強い感情が生まれる代わりに、結果は弱い感情と弱い活力である。そのため意志にも理性にも強さがなくても、外から見て規則に従うようにしておける。大きな活力を持つ人物はすでに、昔語りの中にしかいなくなりつつある。今のこの国では、商売を除けば活力を注ぐ場所はほとんどない。商売に注がれる活力はまだ相当のものだと言ってよい。仕事を別にしてわずかに残る力は、何か一つの趣味に注がれる。その趣味は有益かもしれず、慈善にかなうことさえあるが、いつも何か一つ、たいていは規模の小さなものだ。イングランドの偉大さは今やすべて集団のものである。個々には小さく、結び合う習慣のおかげでしか、大きなことはできないように見える。道徳と宗教の慈善家たちは、これでまったく満足である。だがイングランドをこれまでの姿につくり上げたのは、これとは別の型の人々であった。衰えを防ぐのにも、別の型の人々が要るだろう。
  translation_status: reviewed

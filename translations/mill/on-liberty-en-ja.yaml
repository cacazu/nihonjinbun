    printed_page_end: '193'
    source_sequence: 128
  source_text: The question of making the sale of these commodities a more or less exclusive privilege, must be answered differently, according to the purposes to which the restriction is intended to be subservient. All places of public resort require the restraint of a police, and places of this kind peculiarly, because offences against society are especially apt to originate there. It is, therefore, fit to confine the power of selling these commodities (at least for consumption on the spot) to persons of known or vouched-for respectability of conduct; to make such regulations respecting hours of opening and closing as may be requisite for public surveillance, and to withdraw the licence if breaches of the peace repeatedly take place through the connivance or incapacity of the keeper of the house, or if it becomes a rendezvous for concocting and preparing offences against the law. Any further restriction I do not conceive to be, in principle, justifiable. The limitation in number, for instance, of beer and spirit-houses, for the express purpose of rendering them more difficult of access, and diminishing the occasions of temptation, not only exposes all to an inconvenience because there are some by whom the facility would be abused, but is suited only to a state of society in which the labouring classes are avowedly treated as children or savages, and placed under an education of restraint, to fit them for future admission to the privileges of freedom. This is not the principle on which the labouring classes are professedly governed in any free country; and no person who sets due value on freedom will give his adhesion to their being so governed, unless after all efforts have been exhausted to educate them for freedom and govern them as freemen, and it has been definitively proved that they can only be governed as children. The bare statement of the alternative shows the absurdity of supposing that such efforts have been made in any case which needs be considered here. It is only because the institutions of this country are a mass of inconsistencies, that things find admittance into our practice which belong to the system of despotic, or what is called paternal, government, while the general freedom of our institutions precludes the exercise of the amount of control necessary to render the restraint of any real efficacy as a moral education.
  translation_ja: このような品物の販売を、程度の差はあれ独占的な特権にする問題は、その制限が何のためにあるべきかによって、答えが違ってくる。人の集まる場所はどれも警察による抑えが要るが、この種の場所はとくに要る。社会に対する犯罪がそこで始まりやすいからだ。だから、少なくともその場で飲むためにこれらの品物を売る権限は、日ごろの行いが信頼できると分かっているか、保証されている者に限るのがふさわしい。公の監視に必要なら開店と閉店の時刻を定め、店の主人が陰で許し、または統制できないために、繰り返し平穏が乱されたり、法に反する行いを企て準備する者の集合場所となったりしたら、免許を取り消すのもよい。それ以上の制限は、原理上、正当化できるとは考えない。たとえばビールや蒸留酒を出す店を利用しづらくし、誘惑の機会を減らす目的で、店の数を制限する。便利さを乱用する人がいるために、誰もが不便をこうむるだけではない。それは労働階級が公然と子どもか、いわゆる野蛮人と同じに扱われ、いつか自由の特権を与えるにふさわしくするため、制約に従う教育のもとに置かれている社会にしかふさわしくない。この原理で労働階級を治めると公言する自由国はない。彼らが自由になれるように教育し、自由人として治める努力をすべて尽くし、子どもとしてしか治められないと決定的に証明されたのでなければ、自由を当然に大切にする者が、そのように治めることに賛成はしない。その二者択一をただ言い表すだけで、ここで考える必要のある場合に、どこかでそういう努力がなされたと仮定するのが、ばかげていると分かる。この国の制度が矛盾のかたまりだからこそ、私たちの実際の慣行には、専制的な、あるいは父権的と呼ばれる統治の仕組みに属するものが入り込む。その一方で、制度は全体として自由であるため、その制限を道徳教育として本当に役に立てるのに要るだけの統制は、行えないのである。
  translation_status: reviewed
- id: ol-05-011
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:

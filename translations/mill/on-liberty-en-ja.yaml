    printed_page_end: '64'
    source_sequence: 42
  source_text: Let us now pass to the second division of the argument, and dismissing the supposition that any of the received opinions may be false, let us assume them to be true, and examine into the worth of the manner in which they are likely to be held, when their truth is not freely and openly canvassed. However unwillingly a person who has a strong opinion may admit the possibility that his opinion may be false, he ought to be moved by the consideration that however true it may be, if it is not fully, frequently, and fearlessly discussed, it will be held as a dead dogma, not a living truth.
  translation_ja: では議論の第二の部分に移ろう。通説のどれかが誤りかもしれないという仮定は置いて、通説が正しいとし、その真偽が公然と自由に検討されないとき、人々がそれを受け入れるあり方にどれだけ価値があるかを調べたい。強い確信を持つ人が、自分の意見も誤りかもしれないと、いかに認めたがらないにせよ、その意見がどれだけ正しくても、十分に、たびたび、恐れずに議論されないなら、生きた真理としてではなく、死んだ教条としてしか抱かれない、と考えれば、心を動かさずにはいられないはずである。
  translation_status: reviewed
- id: ol-02-022
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '64'
    printed_page_end: '65'
    source_sequence: 43
  source_text: There is a class of persons (happily not quite so numerous as formerly) who think it enough if a person assents undoubtingly to what they think true, though he has no knowledge whatever of the grounds of the opinion, and could not make a tenable defence of it against the most superficial objections. Such persons, if they can once get their creed taught from authority, naturally think that no good, and some harm, comes of its being allowed to be questioned. Where their influence prevails, they make it nearly impossible for the received opinion to be rejected wisely and considerately, though it may still be rejected rashly and ignorantly; for to shut out discussion entirely is seldom possible, and when it once gets in, beliefs not grounded on conviction are apt to give way before the slightest semblance of an argument. Waiving, however, this possibility—assuming that the true opinion abides in the mind, but abides as a prejudice, a belief independent of, and proof against, argument—this is not the way in which truth ought to be held by a rational being. This is not knowing the truth. Truth, thus held, is but one superstition the more, accidentally clinging to the words which enunciate a truth.
  translation_ja: こういう一群の人がいる。幸い昔ほど多くはない。誰かが、自分たちの真実とみなすものに疑わず同意していれば、その意見の根拠を何一つ知らず、うわべだけの反論にさえまともな弁護ができないとしても、それで十分だと思う人々である。自分たちの教えをひとたび権威のあるところから教えさせられれば、その教えに疑問を持つのを許しても、益はなく、いくらか害があるだけだと考えるのも自然だ。こうした人が力を持つところでは、通説を賢明かつ慎重に考えたうえで退けることは、ほとんどできなくなる。だが浅はかに、何も知らずに退けることは、なお起こりうる。まったく議論を締め出すことはめったにできず、ひとたび入り込めば、確かな納得に根ざしていない信念は、議論らしいものがわずかに現れるだけで、崩れがちだからだ。この可能性は措くとして、正しい意見が心に残りながら、偏見として、理屈に基づかず、理屈が通用しない信念として残ると仮定しよう。理性のある者が真理を受け入れるべきなのは、そのような仕方ではない。これは真理を知ることではない。こうして受け入れられる真理は、たまたま真理を述べた言葉にしがみついた、もう一つの迷信にすぎない。
  translation_status: reviewed

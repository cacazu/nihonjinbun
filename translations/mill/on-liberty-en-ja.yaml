    printed_page_end: '35'
    source_sequence: 27
  source_text: I answer that it is assuming very much more. There is the greatest difference between presuming an opinion to be true, because, with every opportunity for contesting it, it has not been refuted, and assuming its truth for the purpose of not permitting its refutation. Complete liberty of contradicting and disproving our opinion, is the very condition which justifies us in assuming its truth for purposes of action; and on no other terms can a being with human faculties have any rational assurance of being right.
  translation_ja: 私の答えは、それよりずっと多くを前提にしている、というものだ。異議を唱える機会があらゆる面で開かれていたのに反駁されなかったから、ある意見を真実と見なすことと、反駁させまいとして真実と決めてかかることのあいだには、最大の違いがある。まさに、私たちの意見に反対し、誤りを証明する完全な自由があるからこそ、行動にあたってそれを真実と見なすことが正当になる。この条件がなくては、人間の能力で自分は正しいと理にかなって確信することはできない。
  translation_status: reviewed
- id: ol-02-007
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '36'
    printed_page_end: '38'
    source_sequence: 28
  source_text: 'When we consider either the history of opinion, or the ordinary conduct of human life, to what is it to be ascribed that the one and the other are no worse than they are? Not certainly to the inherent force of the human understanding; for, on any matter not self-evident, there are ninety-nine persons totally incapable of judging of it, for one who is capable; and the capacity of the hundredth person is only comparative; for the majority of the eminent men of every past generation held many opinions now known to be erroneous, and did or approved numerous things which no one will now justify. Why is it, then, that there is on the whole a preponderance among mankind of rational opinions and rational conduct? If there really is this preponderance—which there must be, unless human affairs are, and have always been, in an almost desperate state—it is owing to a quality of the human mind, the source of everything respectable in man either as an intellectual or as a moral being, namely, that his errors are corrigible. He is capable of rectifying his mistakes, by discussion and experience. Not by experience alone. There must be discussion, to show how experience is to be interpreted. Wrong opinions and practices gradually yield to fact and argument: but facts and arguments, to produce any effect on the mind, must be brought before it. Very few facts are able to tell their own story, without comments to bring out their meaning. The whole strength and value, then, of human judgment, depending on the one property, that it can be set right when it is wrong, reliance can be placed on it only when the means of setting it right are kept constantly at hand. In the case of any person whose judgment is really deserving of confidence, how has it become so? Because he has kept his mind open to criticism of his opinions and conduct. Because it has been his practice to listen to all that could be said against him; to profit by as much of it as was just, and expound to himself, and upon occasion to others, the fallacy of what was fallacious. Because he has felt, that the only way in which a human being can make some approach to knowing the whole of a subject, is by hearing what can be said about it by persons of every variety of opinion, and studying all modes in which it can be looked at by every character of mind. No wise man ever acquired his wisdom in any mode but
    this; nor is it in the nature of human intellect to become wise in any other manner. The steady habit of correcting and completing his own opinion by collating it with those of others, so far from causing doubt and hesitation in carrying it into practice, is the only stable foundation for a just reliance on it: for, being cognisant of all that can, at least obviously, be said against him, and having taken up his position against all gainsayers—knowing that he has sought for objections and difficulties, instead of avoiding them, and has shut out no light which can be thrown upon the subject from any quarter—he has a right to think his judgment better than that of any person, or any multitude, who have not gone through a similar process.'
  translation_ja: 意見の歴史を考えても、人間の日常の行動を考えても、そのどちらも現状よりひどい状態ではないのは、何のおかげだろう。人間の理解力それ自体に備わる力のおかげでないことは確かだ。自明でないことなら何についてであれ、判断できる人一人に対して、まったく判断できない人が九十九人はいる。その百人目の能力も、ほかの人と比べればの話だ。過去のどの世代でも、すぐれた人の大半は、今では誤りと知られている意見をいくつも持ち、今では誰も弁護しないことを数多く行い、または認めていた。ではなぜ、全体として人間の意見や行動には、理にかなったもののほうが多いのだろう。もし本当に多いのなら、そして人の世のいまも昔も、ほぼ絶望的でないかぎり、実際に多いはずだが、それは人間の心がある性質を備えているおかげである。その性質は、人間が知的な存在として、また道徳的な存在として尊敬に値するすべての源、つまり誤りを正せるという性質だ。人間は議論と経験を通じて自らの間違いを直すことができる。経験だけでは無理だ。経験をどう解釈すべきかを示すために、議論が要る。誤った意見や慣行は、次第に事実と議論に道を譲る。だが事実と議論が心に少しでも働きかけるには、まず心の前に持ち出されなければならない。その意味を引き出す説明がなくてもひとりでに事情を語れる事実など、ごくわずかである。したがって、人の判断の力と価値は、誤れば直せるというただ一つの性質から来るのだから、いつでも直せる手段を身近に置いているときにしか、判断は頼りにならない。本当に信頼に値する判断を下す人は、どうしてそうなったのだろう。自分の意見や行動に対する批判に心を開いてきたからである。反対して言えることはすべて聞き、そのうち正当なことから学び、誤ったことはどこが誤りかを自分で明らかにし、ときには他人にも説明することを心がけてきたからである。人がある問題について全体を知ることに少しでも近づける唯一の道は、およそあらゆる意見の持ち主が、その問題について何を言うかを聞き、およそあらゆる考え方の持ち主がどう見るかを研究することだと感じてきたからである。知恵のある人が、これ以外の流儀で知恵を得たためしはない。人間の知性は、ほかの方法で賢くなれるようにできていない。自分の意見を人の意見と突き合わせて正し、足りないところを補う習慣をしっかり持つことは、自分の意見を実行に移すとき疑ったりためらったりさせるどころか、それを正当に信頼できるただ一つの確かな土台となる。少なくとも容易に思いつく反論はすべて知ったうえで、あらゆる反対者を相手にして自分の立場を定め、異論や難点を避けずに探し、どこからこの問題に光が当てられようと、さえぎったことはないと分かっているからだ。同じ経過をたどっていない者が一人であろうと大勢であろうと、それより自分の判断がすぐれていると考えてもよいのである。
  translation_status: reviewed
- id: ol-02-008
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '38'
    printed_page_end: '39'
    source_sequence: 29
  source_text: 'It is not too much to require that what the wisest of mankind, those who are best entitled to trust their own judgment, find necessary to warrant their relying on it, should be submitted to by that miscellaneous collection of a few wise and many foolish individuals, called the public. The most intolerant of churches, the Roman Catholic Church, even at the canonisation of a saint, admits, and listens patiently to, a "devil''s advocate." The holiest of men, it appears, cannot be admitted to posthumous honours, until all that the devil could say against him is known and weighed. If even the Newtonian philosophy were not permitted to be questioned, mankind could not feel as complete assurance of its truth as they now do. The beliefs which we have most warrant for, have no safeguard to rest on, but a standing invitation to the whole world to prove them unfounded. If the challenge is not accepted, or is accepted and the attempt fails, we are far enough from certainty still; but we have done the best that the existing state of human reason admits of; we have neglected nothing that could give the truth a chance of reaching us: if the lists are kept open, we may hope that if there be a better truth, it will be found when the human mind is capable of receiving it; and in the meantime we may rely on having attained such approach to truth, as is possible in our own day. This is the amount of certainty attainable by a fallible being, and this the sole way of attaining it.'
  translation_ja: 人類のうち最も賢い、自分の判断を信じる資格が最もある人たちが、その判断を信じてよいと思うために欠かせないと考えることを、少数の賢者と大勢の愚か者が入り交じった「世間」にも求めるのは、無理な注文ではない。諸教会のうち最も不寛容なローマ・カトリック教会でさえ、列聖のときには「悪魔の代弁者」を迎え、その言い分を根気よく聴く。この上なく聖なる人さえ、その人に対して悪魔が言えることをすべて知り、吟味してからでなければ、死後の誉れを授けてもらえないらしい。ニュートンの学説でさえ、疑問を投げかけることが許されなかったなら、人は今日ほどその真実を確信できなかっただろう。最も確かな根拠がある信念でさえ、その拠りどころには、誤りだと証明できるならやってみよと世界中の人にいつも呼びかけること以外、何の保証もない。誰もその挑戦に応じないか、応じても証明に失敗したなら、まだ確実とはほど遠い。だが、今の人間の理性でできるかぎりのことはした。こちらに真理が届く可能性を何一つ見捨てなかった。論争の場を開けておけば、今よりよい真理があるなら、人間の心がそれを受け取れるようになったときに見つかると期待できる。それまでのあいだは、私たちの時代にできるかぎり真理に近づいたと信じてよい。誤ることのある存在が得られる確かさはこの程度であり、それを得るのはこの方法しかない。
  translation_status: reviewed
- id: ol-02-009
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '39'
    printed_page_end: '40'
    source_sequence: 30
  source_text: Strange it is, that men should admit the validity of the arguments for free discussion, but object to their being "pushed to an extreme;" not seeing that unless the reasons are good for an extreme case, they are not good for any case. Strange that they should imagine that they are not assuming infallibility, when they acknowledge that there should be free discussion on all subjects which can possibly be doubtful, but think that some particular principle or doctrine should be forbidden to be questioned because it is so certain, that is, because they are certain that it is certain. To call any proposition certain, while there is any one who would deny its certainty if permitted, but who is not permitted, is to assume that we ourselves, and those who agree with us, are the judges of certainty, and judges without hearing the other side.
  translation_ja: 自由な議論を擁護する理由には納得していながら、その理由を「極端にまで押し進める」のには反対する人がいるのは奇妙だ。極端な事例では通用しない理由なら、どんな事例にも通用しないことが見えないのである。また、疑いの余地がありうる問題はすべて自由に議論すべきだと認めながら、ある特定の原理や教説を疑ってはならない、その原理や教説がそれほど確かだから、つまり自分がその確かさを確信しているからだと考える人が、自分は誤らないと決めてかかってはいないと思うのも奇妙だ。許されさえすれば確かさを否定する人がいるのに、それを許さないままある命題を確かと呼ぶことは、私たちや私たちに賛同する人たちが、反対論を聞きもせず何が確かかを判定できると決めてかかることだ。
  translation_status: reviewed
- id: ol-02-010
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '40'
    printed_page_end: '42'
    source_sequence: 31
  source_text: 'In the present age—which has been described as "destitute of faith, but terrified at scepticism"—in which people feel sure, not so much that their opinions are true, as that they should not know what to do without them—the claims of an opinion to be protected from public attack are rested not so much on its truth, as on its importance to society. There are, it is alleged, certain beliefs, so useful, not to say indispensable to well-being, that it is as much the duty of governments to uphold those beliefs, as to protect any other of the interests of society. In a case of such necessity, and so directly in the line of their duty, something less than infallibility may, it is maintained, warrant, and even bind, governments, to act on their own opinion, confirmed by the general opinion of mankind. It is also often argued, and still oftener thought, that none but bad men would desire to weaken these salutary beliefs; and there can be nothing wrong, it is thought, in restraining bad men, and prohibiting what only such men would wish to practise. This mode of thinking makes the justification of restraints on discussion not a question of the truth of doctrines, but of their usefulness; and flatters itself by that means to escape the responsibility of claiming to be an infallible judge of opinions. But those who thus satisfy themselves, do not perceive that the assumption of infallibility is merely shifted from one point to another. The usefulness of an opinion is itself matter of opinion: as disputable, as open to discussion, and requiring discussion as much, as the opinion itself. There is the same need of an infallible judge of opinions to decide an opinion to be noxious, as to decide it to be false, unless the opinion condemned has full opportunity of defending itself. And it will not do to say that the heretic may be allowed to maintain the utility or harmlessness of his opinion, though forbidden to maintain its truth. The truth of an opinion is part of its utility. If we would know whether or not it is desirable that a proposition should be believed, is it possible to exclude the consideration of whether or not it is true? In the opinion, not of bad men, but of the best men, no belief which is contrary to truth can be really useful: and can you prevent such men from urging that plea, when they are charged with culpability for denying some doctrine
    which they are told is useful, but which they believe to be false? Those who are on the side of received opinions, never fail to take all possible advantage of this plea; you do not find them handling the question of utility as if it could be completely abstracted from that of truth: on the contrary, it is, above all, because their doctrine is "the truth," that the knowledge or the belief of it is held to be so indispensable. There can be no fair discussion of the question of usefulness, when an argument so vital may be employed on one side, but not on the other. And in point of fact, when law or public feeling do not permit the truth of an opinion to be disputed, they are just as little tolerant of a denial of its usefulness. The utmost they allow is an extenuation of its absolute necessity, or of the positive guilt of rejecting it.'
  translation_ja: 今の時代は「信仰を持たないが、懐疑を恐れる」と評されたことがある。人々が確信しているのは、自分の意見が真実だということよりも、それがなければどうしたらいいか分からないということだ。だからある意見を公然たる攻撃から守る根拠とされるのは、それが真実かどうかよりも、社会にとってどれほど大切かということである。人々が幸福に暮らすのに、欠かせないとまでは言わないにせよ、たいへん役立つ信念がいくつかあり、それを守ることは、社会のほかのどんな利益を守るのにも劣らない政府の義務だ、と言われる。これほど必要があり、政府の義務にこれほどじかに関わる場合には、政府に誤りの可能性があっても、世間一般の意見に裏づけられた自分の意見に従って行動することは許されるし、義務でさえある、というのだ。またこの有益な信念を弱めようとするのは悪い人間だけだ、という議論もよくなされ、口にしないまでも、そう思う人はさらに多い。悪人を抑え、悪人しかしたいと思わないことを禁じるのに、何の間違いもありはしないと思われている。この考え方は、議論の制限を正当化できるかどうかを、教説が真実かどうかではなく、役に立つかどうかの問題に置き換える。それで、自分は意見を裁いて決して誤らないなどと称する責任を逃れられたと安心する。だがそれで満足する人々には、自分は誤りえないという前提を、ただ別の点に移しただけだということが見えていない。ある意見が役に立つかどうかも、それ自体が一つの意見であり、意見そのものと同じように争いうるし、議論に開かれ、また同じだけ議論を必要とする。非難された意見に十分な自己弁護の機会を与えないかぎり、その意見は有害だと決めるにも、それは間違いだと決めるのと同じく、誤りを知らない審判者が必要になる。異端者は自説の有用性ないし無害さを主張するのは許されるが、真実だと主張してはならない、と言ってもだめである。意見が真実であることは、その有用性の一部なのだ。ある命題が信じられることが望ましいかどうかを知りたいのに、それが本当かどうかを考慮から外せるだろうか。悪い人々どころか最も立派な人々こそ、真実に反する信念が本当に役立つことはないと考える。役に立つと聞かされてはいるが、間違っていると自分たちは信じる教説を否定したために責められたとき、そう弁護するのを禁じられるだろうか。通説の側の人々は、この弁護をできるかぎり利用する。役立つかどうかが、真実かどうかと完全に切り離せるかのように問題を扱いはしない。反対に、主として自分たちの教説は「真理」なのだからこそ、知り、または信じることがこのうえなく欠かせないと言う。一方だけがこの肝心な論拠を使え、もう一方は使えないなら、役に立つかどうかについて公正な議論は成立しない。実際、法律や世間の気分が、ある意見の真偽を争うことを許さないときは、その意見が役立つことを否定するのもやはり許さない。せいぜい、絶対に欠かせないとまでは言えない、とか、退けることが明らかな罪だとまでは言えない、と言うことを許すだけだ。
  translation_status: reviewed
- id: ol-02-011
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '42'
    printed_page_end: '44'
    source_sequence: 32
  source_text: In order more fully to illustrate the mischief of denying a hearing to opinions because we, in our own judgment, have condemned them, it will be desirable to fix down the discussion to a concrete case; and I choose, by preference, the cases which are least favourable to me—in which the argument against freedom of opinion, both on the score of truth and on that of utility, is considered the strongest. Let the opinions impugned be the belief in a God and in a future state, or any of the commonly received doctrines of morality. To fight the battle on such ground, gives a great advantage to an unfair antagonist; since he will be sure to say (and many who have no desire to be unfair will say it internally), Are these the doctrines which you do not deem sufficiently certain to be taken under the protection of law? Is the belief in a God one of the opinions, to feel sure of which, you hold to be assuming infallibility? But I must be permitted to observe, that it is not the feeling sure of a doctrine (be it what it may) which I call an assumption of infallibility. It is the undertaking to decide that question for others, without allowing them to hear what can be said on the contrary side. And I denounce and reprobate this pretension not the less, if put forth on the side of my most solemn convictions. However positive any one's persuasion may be, not only of the falsity, but of the pernicious consequences—not only of the pernicious consequences, but (to adopt expressions which I altogether condemn) the immorality and impiety of an opinion; yet if, in pursuance of that private judgment, though backed by the public judgment of his country or his contemporaries, he prevents the opinion from being heard in its defence, he assumes infallibility. And so far from the assumption being less objectionable or less dangerous because the opinion is called immoral or impious, this is the case of all others in which it is most fatal. These are exactly the occasions on which the men of one generation commit those dreadful mistakes, which excite the astonishment and horror of posterity. It is among such that we find the instances memorable in history, when the arm of the law has been employed to root out the best men and the noblest doctrines; with deplorable success as to the men, though some of the doctrines have survived to be (as if in mockery) invoked, in defence of
    similar conduct towards those who dissent from them, or from their received interpretation.
  translation_ja: 自分の判断で退けた意見だからといって聞こうとしないことが、どんな害をもたらすかをよりよく示すために、議論を具体的な場合に絞ろう。あえて、私にとって最も不利な例、真実かどうか、有用かどうか、その両方について意見の自由に反対する論拠が最も強いとされる例を取る。異を唱えられる意見を、神と来世の存在を信じること、あるいは広く受け入れられている道徳上の教説のいずれかとしよう。こういう例で争うと、公正でない相手にはずいぶん有利になる。きっとこう言い出すだろうからだ。法で保護するほど確かとは認めない、というのは、このような教えのことなのか。神が存在するという信仰も、確信すれば自分が誤らないと決めてかかることになる、そういう意見の一つだというのか。ことさら不公正でありたくない人でも、心のうちではそう言う者が多い。だが断っておきたい。どんな教えであれ、それを確信することを、私は誤りえないと決めてかかることとは呼ばない。逆の立場から何が言えるかを他人に聞かせずに、他人の分までこの問題を決めようとすることを言うのである。この思い上がりは、自分が最もおごそかに信じていることを守るために現れたとしても、少しも割り引くことなく批判し、非難する。ある意見が誤っているばかりか有害な結果を招く、いや、有害な結果どころか、不道徳で不敬だとさえ、誰かがどれほど確信していたとしても、後の言い方は私はまったく認めないが、その個人的判断に従って、たとえ国や同時代の社会が支持していても、その意見が自らを弁護する言葉を聞かせまいとすれば、自分は誤らないと決めてかかっている。意見が不道徳または不敬と呼ばれれば、その思い込みが許しやすく、あるいは危険でなくなるどころか、まさにこういうときに最も致命的になる。ある世代の人々が、後の人々を驚愕させ、戦慄させる、とんでもない誤りを犯すのは、まさにこういうときだ。法律の力が最もすぐれた人々と最も気高い教えを根絶するのに使われた、歴史に残る事件もこういうところに見いだせる。人々は嘆かわしいことに実際に抹殺された。だが教えのいくつかは生き残り、あたかもあざ笑うかのように、自分たちの教えやその通説的な解釈に異を唱える人に対し、同じ仕打ちを正当化する根拠として持ち出されている。
  translation_status: reviewed
- id: ol-02-012
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '44'
    printed_page_end: '45'
    source_sequence: 33
  source_text: Mankind can hardly be too often reminded that there was once a man named Socrates, between whom and the legal authorities and public opinion of his time, there took place a memorable collision. Born in an age and country abounding in individual greatness, this man has been handed down to us by those who best knew both him and the age, as the most virtuous man in it; while we know him as the head and prototype of all subsequent teachers of virtue, the source equally of the lofty inspiration of Plato and the judicious utilitarianism of Aristotle, "i maëstri di color che sanno," the two headsprings of ethical as of all other philosophy. This acknowledged master of all the eminent thinkers who have since lived—whose fame, still growing after more than two thousand years, all but outweighs the whole remainder of the names which make his native city illustrious—was put to death by his countrymen, after a judicial conviction, for impiety and immorality. Impiety, in denying the gods recognised by the State; indeed his accuser asserted (see the "Apologia") that he believed in no gods at all. Immorality, in being, by his doctrines and instructions, a "corruptor of youth." Of these charges the tribunal, there is every ground for believing, honestly found him guilty, and condemned the man who probably of all then born had deserved best of mankind, to be put to death as a criminal.
  translation_ja: かつてソクラテスという人がいて、その時代の法の権威や世論と、記憶に残る衝突を起こしたことは、何度人類に思い起こさせても多すぎることはない。すぐれた人物の多い時代と国に生まれたこの人を、その人と時代を最もよく知る人々は、同時代で最も徳のある人として私たちに伝えた。私たちは、彼を後世のあらゆる徳の教師の先頭に立つ手本、プラトンの高い霊感とアリストテレスの分別ある功利主義の両方の源として知る。「知る者たちの師」と呼ばれるこの二人は、倫理学とほかのあらゆる哲学の、二つの源泉である。その後現れたあらゆるすぐれた思想家の師と認められ、その名声は二千年以上たった今も大きくなりつづけ、彼の生まれた都市を輝かせるほかの名をすべて合わせたほどにも達する。この人が、法廷で不敬と不道徳の罪を認められ、同国人によって死刑にされた。不敬とされたのは、国家が認めた神々を否定したことだ。それどころか、告発者は彼がいかなる神も信じないと主張した。『ソクラテスの弁明』を参照されたい。不道徳とされたのは、自分の教説や教育によって「若者を堕落させる者」だったことだ。裁判官たちは、これらの訴えについて、まったく心から有罪だと判断したと思う理由が十分にある。そして当時生を受けた人間のうち、おそらく最も人類に尽くしたこの人を、罪人として死刑にしたのである。
  translation_status: reviewed

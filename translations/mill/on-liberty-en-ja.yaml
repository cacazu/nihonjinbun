  source_text: 'I have said that it is important to give the freest scope possible to uncustomary things, in order that it may in time appear which of these are fit to be converted into customs. But independence of action, and disregard of custom are not solely deserving of encouragement for the chance they afford that better modes of action, and customs more worthy of general adoption, may be struck out; nor is it only persons of decided mental superiority who have a just claim to carry on their lives in their own way. There is no reason that all human existences should be constructed on some one, or some small number of patterns. If a person possesses any tolerable amount of common-sense and experience, his own mode of laying out his existence is the best, not because it is the best in itself, but because it is his own mode. Human beings are not like sheep; and even sheep are not undistinguishably alike. A man cannot get a coat or a pair of boots to fit him, unless they are either made to his measure, or he has a whole warehouseful to choose from: and is it easier to fit him with a life than with a coat, or are human beings more like one another in their whole physical and spiritual conformation than in the shape of their feet? If it were only that people have diversities of taste, that is reason enough for not attempting to shape them all after one model. But different persons also require different conditions for their spiritual development; and can no more exist healthily in the same moral, than all the variety of plants can in the same physical, atmosphere and climate. The same things which are helps to one person towards the cultivation of his higher nature, are hindrances to another. The same mode of life is a healthy excitement to one, keeping all his faculties of action and enjoyment in their best order, while to another it is a distracting burthen, which suspends or crushes all internal life. Such are the differences among human beings in their sources of pleasure, their susceptibilities of pain, and the operation on them of different physical and moral agencies, that unless there is a corresponding diversity in their modes of life, they neither obtain their fair share of happiness, nor grow up to the mental, moral, and aesthetic stature of which their nature is capable. Why then should tolerance, as far as the public sentiment is concerned, extend
    only to tastes and modes of life which extort acquiescence by the multitude of their adherents? Nowhere (except in some monastic institutions) is diversity of taste entirely unrecognised; a person may, without blame, either like or dislike rowing, or smoking, or music, or athletic exercises, or chess, or cards, or study, because both those who like each of these things, and those who dislike them, are too numerous to be put down. But the man, and still more the woman, who can be accused either of doing "what nobody does," or of not doing "what everybody does," is the subject of as much depreciatory remark as if he or she had committed some grave moral delinquency. Persons require to possess a title, or some other badge of rank, or of the consideration of people of rank, to be able to indulge somewhat in the luxury of doing as they like without detriment to their estimation. To indulge somewhat, I repeat: for whoever allow themselves much of that indulgence, incur the risk of something worse than disparaging speeches—they are in peril of a commission de lunatico, and of having their property taken from them and given to their relations.[13]'
  translation_ja: 慣習にないことが、できるだけ自由に起こる余地を与えるのが大切だと言った。そうすれば、どれが慣習にするにふさわしいか、やがて分かるからだ。だが、自立して行動することや、慣習を顧みないことが励ましに値するのは、よりよい行動の仕方や、世に広く受け入れられるに値する慣習を考え出せるかもしれないからだけではない。自分なりに人生を営む正当な権利を持つのは、精神が明らかにすぐれた人ばかりでもない。人の生涯がすべて、一つか少数の型に従ってできあがらなければならない理由はない。いくらかは分別と経験のある人なら、自分で考えた人生の組み立て方が、その人には最善である。それ自体が最善だからではなく、自分のやり方だからだ。人間は羊ではない。羊でさえ、見分けられないほど同じではない。上着や長靴が体にぴたりと合うには、採寸して作るか、倉庫いっぱいの品から選べなくてはならない。上着よりも人生のほうが、その人に合わせるのが簡単なのだろうか。それとも人間は、足の形においてよりも、身体と精神の成り立ち全体において、互いによく似ているのだろうか。人の好みがさまざまだというだけでも、皆を一つの型に合わせようとしない理由としては十分である。だが人によって、精神を伸ばすのに必要な条件も違う。ありとあらゆる植物が同じ空気と気候で元気にいられないように、違う人々が、同じ道徳的な雰囲気で健やかに生きることはできない。ある人が本性のより高い部分を養うのに役立つものが、別の人には妨げになる。同じ暮らし方が、ある人には健康な刺激となり、行動し、楽しむ能力をすべて最もよい状態に保つ一方で、別の人には気が散ってたまらない重荷となり、内面の生のすべてを止めるか、押しつぶす。人は、何に喜びを感じ、何につらさを感じるか、さまざまな物理的な力や道徳的な力がどう働くかで、これほどにも異なる。生き方もそれに応じて多様でなければ、正当に得るべきだけの幸福を得ることも、本性が達しうる知的・道徳的・美的な高さまで育つこともできない。ならば、世間の気持ちのうえで、支持者の多さによって渋々認めさせることのできる好みや生き方だけが、寛容に扱われるのはなぜだろう。いくつかの修道院を除けば、好みの多様さがまったく認められないところはない。ボートをこぐこと、喫煙、音楽、運動競技、チェス、カード、勉強を好んでも嫌っても、とがめられずに済む。どれも、好きな人も嫌いな人も、抑えつけられないほど多いからである。だが「誰もしないこと」をするとか「誰もがすること」をしないとか言われる男性、まして女性は、何か重大な道徳上の罪を犯したかのように、こき下ろされる。多少なりとも、好きなようにするというぜいたくを、評判を落とさずに楽しむには、爵位か、ほかの身分のしるしか、身分の高い人から大切に扱われているしるしが要る。多少なりとも、と繰り返そう。そのぜいたくを大いに楽しめば、けなされるより悪いことになりかねない。精神の正常さを調べる審査にかけられ、財産を取り上げられて親類に渡されるおそれがある。[13]

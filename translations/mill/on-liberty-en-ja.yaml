    precision: page
    printed_page: '120'
    printed_page_end: '122'
    source_sequence: 83
  source_text: 'In the first place, then, I would suggest that they might possibly learn something from them. It will not be denied by anybody, that originality is a valuable element in human affairs. There is always need of persons not only to discover new truths, and point out when what were once truths are true no longer, but also to commence new practices, and set the example of more enlightened conduct, and better taste and sense in human life. This cannot well be gainsaid by anybody who does not believe that the world has already attained perfection in all its ways and practices. It is true that this benefit is not capable of being rendered by everybody alike: there are but few persons, in comparison with the whole of mankind, whose experiments, if adopted by others, would be likely to be any improvement on established practice. But these few are the salt of the earth; without them, human life would become a stagnant pool. Not only is it they who introduce good things which did not before exist; it is they who keep the life in those which already existed. If there were nothing new to be done, would human intellect cease to be necessary? Would it be a reason why those who do the old things should forget why they are done, and do them like cattle, not like human beings? There is only too great a tendency in the best beliefs and practices to degenerate into the mechanical; and unless there were a succession of persons whose ever-recurring originality prevents the grounds of those beliefs and practices from becoming merely traditional, such dead matter would not resist the smallest shock from anything really alive, and there would be no reason why civilisation should not die out, as in the Byzantine Empire. Persons of genius, it is true, are, and are always likely to be, a small minority; but in order to have them, it is necessary to preserve the soil in which they grow. Genius can only breathe freely in an atmosphere of freedom. Persons of genius are, ex vi termini, more individual than any other people—less capable, consequently, of fitting themselves, without hurtful compression, into any of the small number of moulds which society provides in order to save its members the trouble of forming their own character. If from timidity they consent to be forced into one of these moulds, and to let all that part of themselves which cannot expand under the pressure
    remain unexpanded, society will be little the better for their genius. If they are of a strong character, and break their fetters, they become a mark for the society which has not succeeded in reducing them to commonplace, to point at with solemn warning as "wild," "erratic," and the like; much as if one should complain of the Niagara river for not flowing smoothly between its banks like a Dutch canal.'
  translation_ja: そこでまず、ほかの人から学べることがあるかもしれない、と提案したい。独創性が人の世で価値ある要素だということは、誰も否定しないだろう。新しい真理を見つけ、かつて真理だったものがいまは真理でないと指摘してくれる人だけでなく、新しい慣行を始め、もっと見識のある行いや、人生におけるよりよい趣味や分別の例を示す人が、いつでも必要だ。世界がすでに、その流儀と慣行のすべてにおいて完全なところに達したと信じる人でなければ、これに反論はできまい。たしかに、誰もが同じようにこの恩恵をもたらせるわけではない。人類全体に比べれば、その人が試したことをほかの人もまねたら、今ある慣行が何かよくなりそうだ、という人は少ない。だがこの少数の人こそ地の塩であり、いなければ人生はよどんだ池となる。それまでなかった善いものを持ち込むのが彼らであるばかりか、すでにあった善いものの生命を保つのも彼らなのだ。新しくすることが何もなければ、人の知性は要らなくなるのだろうか。それを理由に、古くからの仕事を続ける人が、なぜそれをするかを忘れ、人でなく家畜のように行ってよいのだろうか。最もよい信念や慣行にさえ、機械のようなものに堕する傾きがありすぎる。その根拠がただ伝統だからというだけにならないよう、絶えず新しいものの見方をする人が次々に出てこなければ、そんな死んだものは、本当に生きているものからどんな小さな衝撃を受けても耐えられない。そうなれば文明は、ビザンツ帝国の場合のように、滅びずにいる理由がなくなる。たしかに、天才は少数であり、これからもおそらくそうである。だが天才が現れるには、天才が育つ土を守らねばならない。天才が伸び伸びと呼吸できるのは、自由という空気の中だけだ。天才は言葉の定義からして、ほかの誰よりも個性的であり、したがって社会が人々に自分の性格を自分で形づくらせる手間を省くため用意する、わずかな型のどれかに、有害なほど押し縮められずに収まることは、いっそう難しい。臆病さのため、無理に型の一つに入れられることに同意し、その圧力の下では伸びられない部分をすべて伸ばさないままにしておけば、その天才から社会が得るものはほとんどない。性格が強く、縛りを断ち切れば、彼らを平凡なところに引き下げられなかった社会は、いかにもまじめな警告を発しながら、「奔放だ」「変わり者だ」と彼らを指さす。ナイアガラ川がオランダの運河のように、岸と岸のあいだを穏やかに流れないと文句をつけるようなものだ。
  translation_status: reviewed
- id: ol-03-012

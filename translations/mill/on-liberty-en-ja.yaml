  source_text: CHAPTER II. OF THE LIBERTY OF THOUGHT AND DISCUSSION.
  translation_ja: 第二章　思想と言論の自由について
  translation_status: reviewed
- id: ol-02-001
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '28'
    printed_page_end: '31'
    source_sequence: 22
  source_text: 'The time, it is to be hoped, is gone by, when any defence would be necessary of the "liberty of the press" as one of the securities against corrupt or tyrannical government. No argument, we may suppose, can now be needed, against permitting a legislature or an executive, not identified in interest with the people, to prescribe opinions to them, and determine what doctrines or what arguments they shall be allowed to hear. This aspect of the question, besides, has been so often and so triumphantly enforced by preceding writers, that it need not be specially insisted on in this place. Though the law of England, on the subject of the press, is as servile to this day as it was in the time of the Tudors, there is little danger of its being actually put in force against political discussion, except during some temporary panic, when fear of insurrection drives ministers and judges from their propriety;[6] and, speaking generally, it is not, in constitutional countries, to be apprehended that the government, whether completely responsible to the people or not, will often attempt to control the expression of opinion, except when in doing so it makes itself the organ of the general intolerance of the public. Let us suppose, therefore, that the government is entirely at one with the people, and never thinks of exerting any power of coercion unless in agreement with what it conceives to be their voice. But I deny the right of the people to exercise such coercion, either by themselves or by their government. The power itself is illegitimate. The best government has no more title to it than the worst. It is as noxious, or more noxious, when exerted in accordance with public opinion, than when in or opposition to it. If all mankind minus one, were of one opinion, and only one person were of the contrary opinion, mankind would be no more justified in silencing that one person, than he, if he had the power, would be justified in silencing mankind. Were an opinion a personal possession of no value except to the owner; if to be obstructed in the enjoyment of it were simply a private injury, it would make some difference whether the injury was inflicted only on a few persons or on many. But the peculiar evil of silencing the expression of an opinion is, that it is robbing the human race; posterity as well as the existing generation; those who dissent from the opinion,
    still more than those who hold it. If the opinion is right, they are deprived of the opportunity of exchanging error for truth: if wrong, they lose, what is almost as great a benefit, the clearer perception and livelier impression of truth, produced by its collision with error.'
  translation_ja: 腐敗した政府や専制的な政府に対する歯止めの一つとして、「出版の自由」を弁護しなければならない時代は過ぎ去ったと思いたい。人民と利害を共にしない立法機関や行政機関に、人民の意見を指図させ、どんな教えや議論なら聞いてよいか決めさせてはならない。今ではこのことに議論は要らないだろう。それに、この問題のこの面は、先の著述家たちが繰り返し、見事に論じているから、ここでとりわけ力を入れる必要はない。出版に関するイングランドの法律は、今日でもテューダー朝のころに劣らず権力に従順だが、一時の恐慌で、反乱を恐れる大臣や裁判官が分別を失うときを除けば、政治上の議論に対して実際に法が適用されるおそれは小さい。[6] 一般的に言えば、立憲国では、政府が人民に全面的に責任を負うかどうかにかかわらず、意見の表明をしばしば取り締まる心配はない。ただし、そうすることで世間に広まった不寛容の代弁者となるときは別である。それでは、政府と人民が完全に一つになっており、政府が人民の声だと受け取るものに沿う場合にしか、政府は強制力を使おうとしないと仮定しよう。だが、そのような強制を、直接にせよ政府を通じてにせよ行う権利が、人民にあるとは私は認めない。その権力自体が正当ではない。最善の政府にも、最悪の政府と同じく、その権利はない。世論に沿ってその権力をふるうのは、世論に逆らう場合に劣らず、時にはいっそう有害である。全人類のうちただ一人を除いて皆が同じ意見を持ち、その一人だけが反対の意見を持つとしよう。全人類がその人を黙らせることは、その人が、たとえできたとして、全人類を黙らせることより、正当だとは言えない。意見というものが、持ち主のほかには価値のない私物であり、それを思うままに持つことを妨げても単に一人が害をこうむるだけなら、少数が害を受けるのか、大勢が害を受けるのかには、いくらか違いがあるだろう。だが意見を表明させないことの特有の害は、それが人類全体から奪うことにある。今の世代だけでなく後世の人々からも、そしてその意見を持つ人たち以上に、反対する人たちから奪うのだ。その意見が正しければ、誤りから真理へ移る機会が奪われる。誤っていれば、それにほとんど劣らない利益、すなわち誤りとぶつかることで真理がいっそうはっきり見え、いっそう生き生きと感じられることが失われる。
  translation_status: reviewed

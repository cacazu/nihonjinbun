    printed_page_end: '163'
    source_sequence: 110
  source_text: 'To come somewhat nearer home: the majority of Spaniards consider it a gross impiety, offensive in the highest degree to the Supreme Being, to worship him in any other manner than the Roman Catholic; and no other public worship is lawful on Spanish soil. The people of all Southern Europe look upon a married clergy as not only irreligious, but unchaste, indecent, gross, disgusting. What do Protestants think of these perfectly sincere feelings, and of the attempt to enforce them against non-Catholics? Yet, if mankind are justified in interfering with each other''s liberty in things which do not concern the interests of others, on what principle is it possible consistently to exclude these cases? or who can blame people for desiring to suppress what they regard as a scandal in the sight of God and man? No stronger case can be shown for prohibiting anything which is regarded as a personal immorality, than is made out for suppressing these practices in the eyes of those who regard them as impieties; and unless we are willing to adopt the logic of persecutors, and to say that we may persecute others because we are right, and that they must not persecute us because they are wrong, we must beware of admitting a principle of which we should resent as a gross injustice the application to ourselves.'
  translation_ja: もう少しわが国に近づけよう。スペイン人の多数は、ローマ・カトリックと異なる仕方で至高の存在を礼拝することは、神をこのうえなく傷つける、ひどい不敬だと考える。スペインではそれ以外の公開礼拝は合法でない。南ヨーロッパ全体の人々は、聖職者が結婚することは信仰に反するだけでなく、不貞で、みだらで、下品で、吐き気がすることだと考える。これらの紛れもなく真剣な感情を、そしてそれをカトリックでない人にも強いようという試みを、プロテスタントはどう考えるだろう。だが他人の利益に関わらないことでも、人々が互いの自由に介入してよいのなら、どんな原理で一貫してこれらの事例を除けるのか。神と人の目から見て恥とみなすことを抑えたいと望むのを、誰が責められよう。個人の不道徳だと思われることを禁じる理由として、これらを不敬とみなす人の目に映る理由ほど強いものはない。自分たちは正しいから迫害してよく、相手は間違っているから自分たちを迫害してはならない、という迫害者の論法を採るつもりがないのなら、自分たちに当てはめられたときにはひどい不正と憤るような原理を、認めないよう気をつけなければならない。
  translation_status: reviewed

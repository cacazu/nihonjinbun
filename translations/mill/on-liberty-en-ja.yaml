  source_text: The case of the Bombay Parsees is a curious instance in point. When this industrious and enterprising tribe, the descendants of the Persian fire-worshippers, flying from their native country before the Caliphs, arrived in Western India, they were admitted to toleration by the Hindoo sovereigns, on condition of not eating beef. When those regions afterwards fell under the dominion of Mahomedan conquerors, the Parsees obtained from them a continuance of indulgence, on condition of refraining from pork. What was at first obedience to authority became a second nature, and the Parsees to this day abstain both from beef and pork. Though not required by their religion, the double abstinence has had time to grow into a custom of their tribe; and custom, in the East, is a religion.
  translation_ja: ボンベイのパールシーは、これに当てはまる興味深い例である。ペルシアの拝火教徒の子孫で、勤勉で進取の気性に富むこの一族は、カリフの勢力から逃れるために故国を後にし、西インドに着いたとき、牛肉を食べない条件で、ヒンドゥー教徒の君主たちからそこに住むことを許された。後にこの地方がイスラム教徒の征服者の支配下に入ると、今度は豚肉を控える条件で、パールシーは彼らから引き続きそこに住むことを許された。はじめは権力への服従であったことが、第二の天性となり、今でもパールシーは牛肉と豚肉の両方を食べない。自分たちの宗教で求められてはいないが、この二つの禁食は時間をかけて一族の慣習になった。東洋では、慣習が宗教なのである。

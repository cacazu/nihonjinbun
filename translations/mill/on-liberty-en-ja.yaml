  source_text: To abate the force of these considerations, an enemy of free discussion may be supposed to say, that there is no necessity for mankind in general to know and understand all that can be said against or for their opinions by philosophers and theologians. That it is not needful for common men to be able to expose all the misstatements or fallacies of an ingenious opponent. That it is enough if there is always somebody capable of answering them, so that nothing likely to mislead uninstructed persons remains unrefuted. That simple minds, having been taught the obvious grounds of the truths inculcated on them, may trust to authority for the rest, and being aware that they have neither knowledge nor talent to resolve every difficulty which can be raised, may repose in the assurance that all those which have been raised have been or can be answered, by those who are specially trained to the task.
  translation_ja: これらの理由の力をそぐため、自由な議論に反対する者は、おそらくこう言うだろう。ふつうの人々が、自分の意見を擁護したり反対したりして哲学者や神学者が言えることを、すべて知って理解する必要はない。巧妙な相手が述べる不正確なことやこじつけを、ふつうの人が一つ残らず暴ける必要もない。知識のない人を迷わせそうなことが反駁されずに残らないよう、いつでも誰か、反駁できる者がいれば十分である。学びに不慣れな人には、教えられた真理の明白な根拠だけを聞かせ、残りは権威に頼らせればよい。持ち出されうる難問を全部解く知識も才も自分にはないと知ったうえで、今まで出されたものはみな、その仕事の専門の訓練を受けた人がすでに答えたか、答えられる、と安心していてよいのである。
  translation_status: reviewed
- id: ol-02-025
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '70'
    printed_page_end: '72'
    source_sequence: 46
  source_text: 'Conceding to this view of the subject the utmost that can be claimed for it by those most easily satisfied with the amount of understanding of truth which ought to accompany the belief of it; even so, the argument for free discussion is no way weakened. For even this doctrine acknowledges that mankind ought to have a rational assurance that all objections have been satisfactorily answered; and how are they to be answered if that which requires to be answered is not spoken? or how can the answer be known to be satisfactory, if the objectors have no opportunity of showing that it is unsatisfactory? If not the public, at least the philosophers and theologians who are to resolve the difficulties, must make themselves familiar with those difficulties in their most puzzling form; and this cannot be accomplished unless they are freely stated, and placed in the most advantageous light which they admit of. The Catholic Church has its own way of dealing with this embarrassing problem. It makes a broad separation between those who can be permitted to receive its doctrines on conviction, and those who must accept them on trust. Neither, indeed, are allowed any choice as to what they will accept; but the clergy, such at least as can be fully confided in, may admissibly and meritoriously make themselves acquainted with the arguments of opponents, in order to answer them, and may, therefore, read heretical books; the laity, not unless by special permission, hard to be obtained. This discipline recognises a knowledge of the enemy''s case as beneficial to the teachers, but finds means, consistent with this, of denying it to the rest of the world: thus giving to the élite more mental culture, though not more mental freedom, than it allows to the mass. By this device it succeeds in obtaining the kind of mental superiority which its purposes require; for though culture without freedom never made a large and liberal mind, it can make a clever nisi prius advocate of a cause. But in countries professing Protestantism, this resource is denied; since Protestants hold, at least in theory, that the responsibility for the choice of a religion must be borne by each for himself, and cannot be thrown off upon teachers. Besides, in the present state of the world, it is practically impossible that writings which are read by the instructed can be kept from the uninstructed. If
    the teachers of mankind are to be cognisant of all that they ought to know, everything must be free to be written and published without restraint.'
  translation_ja: 真理を信じるのにほとんど理解を伴わなくてもよいと考える人に、できるかぎり譲歩して、この見方を認めよう。それでも、自由な議論を擁護する理由は、少しも弱まらない。この説でさえ、人々には、すべての反論に満足のゆく答えが出たと、理にかなって確信できる必要があると認めるからだ。答えの必要なことが口に出されなければ、どうして答えられるのか。反論した側が、その答えでは不十分だと示す機会を持たなければ、なぜ満足のゆく答えだと分かるのか。世間一般は無理にしても、少なくともその難点を解く哲学者や神学者は、最も解きにくい形でその難点をよく知らなくてはならない。そして難点を自由に述べられ、できるかぎり有利な形で示されなければ、それはかなわない。カトリック教会には、この厄介な問題を処理する独自の方法がある。自分で確信して教えを受け入れることを許す人と、教会を信頼して教えを受け入れねばならない人を、はっきり区別する。むろん、受け入れるものを選ぶ自由はどちらにも与えない。だが聖職者は、少なくとも十分信頼できる人なら、相手に答えるために反対の議論を知ることは許され、ほめられさえする。したがって異端の本も読んでよい。一方、信徒には、めったに出ない特別な許しがなければならない。この規律は、相手の言い分を知ることは教える人には有益だと認める一方で、世の中の残りの人々にはそれを許さない手段を見つけている。こうして大衆には認めない知的教養を、自由のほうは別として、選ばれた人々に、より多く与えている。この仕掛けで教会は、自分の目指すことに必要な知的な優位を得る。自由のない教養から広く寛容な心が生まれたことはないが、ある側の主張を手際よく弁護する法廷の弁護士なら生み出せるからだ。しかしプロテスタントを信奉する国では、この手は使えない。少なくとも彼らの理屈では、宗教を選ぶ責任は一人ひとりが自分で負うべきで、教師に肩代わりさせることはできない。また今の世では、学んだ人に読まれている著作を、学んでいない人には手の届かないものにしておくのは、事実上不可能である。人類に教えを授ける人々が、知るべきことをすべて知るには、何でも自由に書き、何の制限も受けずに刊行できなくてはならない。
  translation_status: reviewed

    source_sequence: 47
  source_text: If, however, the mischievous operation of the absence of free discussion, when the received opinions are true, were confined to leaving men ignorant of the grounds of those opinions, it might be thought that this, if an intellectual, is no moral evil, and does not affect the worth of the opinions, regarded in their influence on the character. The fact, however, is, that not only the grounds of the opinion are forgotten in the absence of discussion, but too often the meaning of the opinion itself. The words which convey it, cease to suggest ideas, or suggest only a small portion of those they were originally employed to communicate. Instead of a vivid conception and a living belief, there remain only a few phrases retained by rote; or, if any part, the shell and husk only of the meaning is retained, the finer essence being lost. The great chapter in human history which this fact occupies and fills, cannot be too earnestly studied and meditated on.
  translation_ja: しかし通説が正しい場合、自由な議論がないことの害が、その意見の根拠を知らないままにしておくことだけなら、知性にとって悪くても道徳にとっては悪くなく、その意見が人格に与える影響から見れば、その価値は変わらないと思われるかもしれない。ところが実際には、議論がなければ、意見の根拠だけでなく、意見そのものの意味まで忘れられることがあまりにも多い。それを伝える言葉は、何の考えも呼び起こさなくなるか、元来伝えるために使われたもののごく一部しか呼び起こさなくなる。鮮明な理解や生きた信念の代わりに、耳から覚えたいくつかの言い回ししか残らない。意味が残るとしても、殻や皮だけで、肝心の中身は失われる。この事実が占め、埋め尽くしている人類史の大きな一章は、いくら熱心に学び、思いをめぐらせても足りないくらいだ。
  translation_status: reviewed
- id: ol-02-027
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en

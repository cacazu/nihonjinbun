    printed_page_end: '97'
    source_sequence: 62
  source_text: First, if any opinion is compelled to silence, that opinion may, for aught we can certainly know, be true. To deny this is to assume our own infallibility.
  translation_ja: 第一に、ある意見が無理に黙らされたとすれば、その意見は、私たちが確かに知りうるかぎりでは、真実かもしれない。その可能性を否定するのは、自分には誤りがありえないと決めてかかることである。
  translation_status: reviewed
- id: ol-02-042
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '98'
    printed_page_end: '98'
    source_sequence: 63
  source_text: Secondly, though the silenced opinion be an error, it may, and very commonly does, contain a portion of truth; and since the general or prevailing opinion on any subject is rarely or never the whole truth, it is only by the collision of adverse opinions, that the remainder of the truth has any chance of being supplied.
  translation_ja: 第二に、黙らされた意見が誤っていても、真理の一部を含むことがあり、実際とても多い。またどんな主題についても、一般に広く通用する意見が真理のすべてであることは、めったにないか、まったくない。したがって真理の残る部分を補える見込みは、対立する意見がぶつかり合うことによってしか生まれない。
  translation_status: reviewed
- id: ol-02-043
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '98'
    printed_page_end: '98'
    source_sequence: 64
  source_text: 'Thirdly, even if the received opinion be not only true, but the whole truth; unless it is suffered to be, and actually is, vigorously and earnestly contested, it will, by most of those who receive it, be held in the manner of a prejudice, with little comprehension or feeling of its rational grounds. And not only this, but, fourthly, the meaning of the doctrine itself will be in danger of being lost, or enfeebled, and deprived of its vital effect on the character and conduct: the dogma becoming a mere formal profession, inefficacious for good, but cumbering the ground, and preventing the growth of any real and heartfelt conviction, from reason or personal experience.'
  translation_ja: 第三に、通説が正しいだけでなく真理のすべてであるとしても、力強く真剣に異を唱えることを許したうえで、実際にそれだけの反論にさらさなければ、それを受け入れる人の大半は、理にかなった根拠をほとんど理解も実感もせず、偏見のように受け入れる。そしてそれだけではない。第四に、教えそのものの意味まで失われたり弱まったりして、人格や行動に与える生きた効果を失うおそれがある。教条は口先だけの信奉となって、何の益も生まず、そのくせ場所ばかり占め、理性または自らの経験から、心からの本当の確信が育つのを妨げる。
  translation_status: reviewed
- id: ol-02-044
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

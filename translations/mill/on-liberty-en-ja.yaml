    printed_page_end: '119'
    source_sequence: 82
  source_text: 'Having said that Individuality is the same thing with development, and that it is only the cultivation of individuality which produces, or can produce, well-developed human beings, I might here close the argument: for what more or better can be said of any condition of human affairs, than that it brings human beings themselves nearer to the best thing they can be? or what worse can be said of any obstruction to good, than that it prevents this? Doubtless, however, these considerations will not suffice to convince those who most need convincing; and it is necessary further to show, that these developed human beings are of some use to the undeveloped—to point out to those who do not desire liberty, and would not avail themselves of it, that they may be in some intelligible manner rewarded for allowing other people to make use of it without hindrance.'
  translation_ja: 個性を伸ばすことと人間が発達することは同じであり、個性を養うだけが、よく発達した人間を生み出し、あるいは生み出せるのだと述べた以上、ここで議論を終えてもよい。人の世のある状態が、人間自身を、その人たちがなりうる最もよいものに近づける、と言った以上に、何を多く、またよく言えるのか。反対に、善を妨げるものについて、人がそのように成長するのを妨げると言う以上に、悪く言えることがあるだろうか。もっとも、どうしても納得してもらわなくてはならない人を納得させるには、これでは足りないだろう。成長した人たちが、成長していない人たちにも役に立つと、さらに示す必要がある。自由を望まず、与えられても使わない人にも、ほかの人が妨げられずに自由を使うのを認めれば、自分たちも、分かる形でいくらか報われる、と指摘する必要がある。
  translation_status: reviewed
- id: ol-03-011
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en

    precision: page
    printed_page: '111'
    printed_page_end: '113'
    source_sequence: 77
  source_text: 'It will probably be conceded that it is desirable people should exercise their understandings, and that an intelligent following of custom, or even occasionally an intelligent deviation from custom, is better than a blind and simply mechanical adhesion to it. To a certain extent it is admitted, that our understanding should be our own: but there is not the same willingness to admit that our desires and impulses should be our own likewise; or that to possess impulses of our own, and of any strength, is anything but a peril and a snare. Yet desires and impulses are as much a part of a perfect human being, as beliefs and restraints: and strong impulses are only perilous when not properly balanced; when one set of aims and inclinations is developed into strength, while others, which ought to co-exist with them, remain weak and inactive. It is not because men''s desires are strong that they act ill; it is because their consciences are weak. There is no natural connection between strong impulses and a weak conscience. The natural connection is the other way. To say that one person''s desires and feelings are stronger and more various than those of another, is merely to say that he has more of the raw material of human nature, and is therefore capable, perhaps of more evil, but certainly of more good. Strong impulses are but another name for energy. Energy may be turned to bad uses; but more good may always be made of an energetic nature, than of an indolent and impassive one. Those who have most natural feeling, are always those whose cultivated feelings may be made the strongest. The same strong susceptibilities which make the personal impulses vivid and powerful, are also the source from whence are generated the most passionate love of virtue, and the sternest self-control. It is through the cultivation of these, that society both does its duty and protects its interests: not by rejecting the stuff of which heroes are made, because it knows not how to make them. A person whose desires and impulses are his own—are the expression of his own nature, as it has been developed and modified by his own culture—is said to have a character. One whose desires and impulses are not his own, has no character, no more than a steam-engine has a character. If, in addition to being his own, his impulses are strong, and are under the government of a strong will, he has
    an energetic character. Whoever thinks that individuality of desires and impulses should not be encouraged to unfold itself, must maintain that society has no need of strong natures—is not the better for containing many persons who have much character—and that a high general average of energy is not desirable.'
  translation_ja: 人々が自分の理解力を働かせるのは望ましく、考えて慣習に従うほうが、さらにはときに考えて慣習から外れるほうが、盲目的に、ただ機械のように慣習にしがみつくよりよい。これはおそらく認められるだろう。自分の理解力は自分のものでなくてはならないということは、ある程度認められている。だが欲望や衝動も同じように自分のものであるべきだと、同じ気安さでは認めない。自分自身の、いくらかでも力のある衝動を持つことは、危険であり、わなである以外の何でもない、とされる。だが欲望や衝動も、信念や自制と同じだけ、十分に育った人間の一部である。強い衝動が危ないのは、ほかとの釣り合いが悪いとき、目的や傾向の一つの組だけが育って強くなり、共存すべきほかのものが弱く、働かないままのときだけだ。人が悪いことをするのは、欲望が強いせいではない。良心が弱いせいだ。強い衝動と弱い良心のあいだには、もともと結びつきがない。もともと結びつくのはむしろ逆の方である。ある人の欲望や感情が、ほかの人より強く多様だというのは、人間性の原料をより多く持ち、ひょっとすると悪いこともより多く行えるが、確かに善いこともより多く行えるというだけだ。強い衝動とは、活力の別の名にすぎない。活力は悪い使い方もできる。だが活力のある性質からは、怠惰で何にも動じない性質より、いつでも多くの善いものをつくることができる。生まれつき感情が最も豊かな人は、いつでも、その感情を養えば最も強くできる人である。個人的な衝動に生き生きとした力を与えるのと同じ強い感受性が、徳に対する最も熱い愛や、最も厳しい自制心の源でもある。社会が自らの義務を果たし、利益を守るのは、これらを養うことによってだ。英雄を作るすべを知らないからといって、英雄を作る材料を捨てることではない。自分の欲望や衝動が自分自身のものである人、つまり、みずからを養うなかで発達し変化した自分の本性を表す人を、性格があると言う。そうでない人には性格がなく、蒸気機関に性格がないのと同じである。自分の衝動が自分のものであるだけでなく、強く、しかも強い意志に治められているなら、その人の性格には活力がある。欲望や衝動の個性が開花するのは励ますべきでないと思う人は、社会に強い性質の人間は必要なく、はっきりした性格の人を大勢含んでも社会はよくならず、活力の一般的な水準が高いのは望ましくない、と主張しなければならない。
  translation_status: reviewed
- id: ol-03-006
  section_id: ch-03
  kind: paragraph
  origin: source

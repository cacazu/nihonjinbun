  source_text: Thus, in the eighteenth century, when nearly all the instructed, and all those of the uninstructed who were led by them, were lost in admiration of what is called civilisation, and of the marvels of modern science, literature, and philosophy, and while greatly overrating the amount of unlikeness between the men of modern and those of ancient times, indulged the belief that the whole of the difference was in their own favour; with what a salutary shock did the paradoxes of Rousseau explode like bombshells in the midst, dislocating the compact mass of one-sided opinion, and forcing its elements to recombine in a better form and with additional ingredients. Not that the current opinions were on the whole farther from the truth than Rousseau's were; on the contrary, they were nearer to it; they contained more of positive truth, and very much less of error. Nevertheless there lay in Rousseau's doctrine, and has floated down the stream of opinion along with it, a considerable amount of exactly those truths which the popular opinion wanted; and these are the deposit which was left behind when the flood subsided. The superior worth of simplicity of life, the enervating and demoralising effect of the trammels and hypocrisies of artificial society, are ideas which have never been entirely absent from cultivated minds since Rousseau wrote; and they will in time produce their due effect, though at present needing to be asserted as much as ever, and to be asserted by deeds, for words, on this subject, have nearly exhausted their power.
  translation_ja: 十八世紀には、学問を身につけた人のほとんどと、その人々に導かれる学のない人はみな、文明と呼ばれるものと、近代の科学、文学、哲学の驚くべき成果に、すっかり見とれていた。近代人と古代人の違いを大きく見積もりすぎ、その違いのすべてが自分たちに有利なのだと、思いたがっていた。そのさなか、ルソーの逆説の数々が爆弾のように炸裂し、片寄った意見の凝り固まった塊をほぐし、その成分に新たな材料を加え、よりよい形に組み直させた衝撃は、なんと有益だったろう。通説のほうがルソーの意見より全体として真理から遠かったのではない。反対に真理に近く、確かな真実は多く、誤りははるかに少なかった。それでもルソーの教えには、まさに世間の意見に欠けていた真理が相当含まれ、その教えとともに、意見の流れを下ってきた。大水が引いたときに置いていった土こそ、これらの真理である。質素に暮らすことのすぐれた価値、作りものの社会の束縛や偽善が、気力と道徳心を損なうこと。こういう考えは、ルソーが書いて以来、教養ある人の心から完全に消えたことはない。そのうち、それにふさわしい影響を及ぼすだろう。ただ今は、昔に劣らず、しかも実際の行いによって、しっかり主張される必要がある。この問題では言葉はほとんど力を使い果たしたからだ。
  translation_status: reviewed

    printed_page_end: '159'
    source_sequence: 107
  source_text: But the strongest of all the arguments against the interference of the public with purely personal conduct, is that when it does interfere, the odds are that it interferes wrongly, and in the wrong place. On questions of social morality, of duty to others, the opinion of the public, that is, of an overruling majority, though often wrong, is likely to be still oftener right; because on such questions they are only required to judge of their own interests; of the manner in which some mode of conduct, if allowed to be practised, would affect themselves. But the opinion of a similar majority, imposed as a law on the minority, on questions of self-regarding conduct, is quite as likely to be wrong as right; for in these cases public opinion means, at the best, some people's opinion of what is good or bad for other people; while very often it does not even mean that; the public, with the most perfect indifference, passing over the pleasure or convenience of those whose conduct they censure, and considering only their own preference. There are many who consider as an injury to themselves any conduct which they have a distaste for, and resent it as an outrage to their feelings; as a religious bigot, when charged with disregarding the religious feelings of others, has been known to retort that they disregard his feelings, by persisting in their abominable worship or creed. But there is no parity between the feeling of a person for his own opinion, and the feeling of another who is offended at his holding it; no more than between the desire of a thief to take a purse, and the desire of the right owner to keep it. And a person's taste is as much his own peculiar concern as his opinion or his purse. It is easy for any one to imagine an ideal public, which leaves the freedom and choice of individuals in all uncertain matters undisturbed, and only requires them to abstain from modes of conduct which universal experience has condemned. But where has there been seen a public which set any such limit to its censorship? or when does the public trouble itself about universal experience? In its interferences with personal conduct it is seldom thinking of anything but the enormity of acting or feeling differently from itself; and this standard of judgment, thinly disguised, is held up to mankind as the dictate of religion and philosophy, by nine-tenths of all moralists
    and speculative writers. These teach that things are right because they are right; because we feel them to be so. They tell us to search in our own minds and hearts for laws of conduct binding on ourselves and on all others. What can the poor public do but apply these instructions, and make their own personal feelings of good and evil, if they are tolerably unanimous in them, obligatory on all the world?
  translation_ja: しかし、純粋に個人的な行いに世間が介入するのに反対する最大の理由は、介入すれば、おそらく間違った仕方で、間違ったところに介入するということだ。社会の道徳や、他人への義務に関する問題では、世間、つまり逆らえない多数派の意見は、しばしば誤っても、それ以上にしばしば正しいと見込める。そのような問題では自分たちの利害、ある行動の仕方を許せば、自分たちにはどんな影響が及ぶかを判断するだけでよいからだ。しかし自分だけに関わる行動の問題で、同じような多数派の意見が、法のように少数派に課されるなら、正しいのと同じほど、間違う見込みがある。そういう場合、世論は、よくてほかの人にとって何がよく、何が悪いと思うかという、一部の人の考えにすぎない。しかもそれどころか、非難する相手の楽しみや都合は平然と通り過ぎ、自分たちの好みだけを考えることが、非常に多い。自分が嫌う行動は何でも、自分に対する害と考え、自分の感情をひどく傷つけられたと腹を立てる人は多い。宗教に凝り固まった人が、他人の信仰上の気持ちを無視したと責められて、自分の気持ちを無視しているのは、忌まわしい礼拝や信条に固執する彼らのほうだ、と切り返したことが知られている。だが、自分の意見に向ける本人の感情と、その意見があることを不快に思う他人の感情とは、同列に扱えない。財布を取りたい盗人の願いと、その財布を持ち続けたい持ち主の願いが同列でないのと同じである。人の好みは、その人の意見や財布に劣らず、本人だけの事柄だ。誰でも、判断の分かれる事柄では個人の自由と選択を邪魔せず、人類の経験が一致して退けた行動だけを、しないように求める理想の世間を、容易に想像できる。しかしこのような限界を、自分たちの取り締まりに設けた世間が、どこにあっただろう。そもそも世間は、いつ人類全体の経験を気にしたか。個人的な行動に介入するとき、世間が考えているのは、自分たちと違う行動や感情を持つことがどれほどけしからぬかということばかりだ。そしてこの判断の基準は、わずかに装いを変え、宗教と哲学の命令として、人類の前に道徳家や理論家の十人に九人から掲げられる。彼らは、正しい事柄は正しいから正しい、自分たちがそう感じるから正しいと教える。自分とほかのすべての人を縛る行動の法を、自分の心と感情の中から探せと言う。哀れな世間は、これらの教えを当てはめ、自分たち個々の善悪の気持ちがまあまあ一致していれば、全世界の義務とするほか、何ができるだろう。
  translation_status: reviewed
- id: ol-04-013
  section_id: ch-04

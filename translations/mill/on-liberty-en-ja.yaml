  source_text: A time, however, came, in the progress of human affairs, when men ceased to think it a necessity of nature that their governors should be an independent power, opposed in interest to themselves. It appeared to them much better that the various magistrates of the State should be their tenants or delegates, revocable at their pleasure. In that way alone, it seemed, could they have complete security that the powers of government would never be abused to their disadvantage. By degrees, this new demand for elective and temporary rulers became the prominent object of the exertions of the popular party, wherever any such party existed; and superseded, to a considerable extent, the previous efforts to limit the power of rulers. As the struggle proceeded for making the ruling power emanate from the periodical choice of the ruled, some persons began to think that too much importance had been attached to the limitation of the power itself. That (it might seem) was a resource against rulers whose interests were habitually opposed to those of the people. What was now wanted was, that the rulers should be identified with the people; that their interest and will should be the interest and will of the nation. The nation did not need to be protected against its own will. There was no fear of its tyrannising over itself. Let the rulers be effectually responsible to it, promptly removable by it, and it could afford to trust them with power of which it could itself dictate the use to be made. Their power was but the nation's own power, concentrated, and in a form convenient for exercise. This mode of thought, or rather perhaps of feeling, was common among the last generation of European liberalism, in the Continental section of which it still apparently predominates. Those who admit any limit to what a government may do, except in the case of such governments as they think ought not to exist, stand out as brilliant exceptions among the political thinkers of the Continent. A similar tone of sentiment might by this time have been prevalent in our own country, if the circumstances which for a time encouraged it, had continued unaltered.
  translation_ja: しかし人の世の歩みのなかで、統治者は自分たちから独立し、利害を異にする勢力でなければならない、とは考えない時代が来た。国の役人はそれぞれ、人民から地位を預かるか権限を委ねられる者とし、人民が望めばいつでも退けられるようにしたほうが、はるかによいと思われた。統治の権力が決して自分たちに不利なように乱用されないという確かな保証を得るには、それしかないと見えた。次第に、選挙で選ばれ任期に限りのある統治者を求めるこの新しい要求が、民衆派のあるところではどこでも、その運動の主要な目標となった。それまでの、統治者の権力を制限しようとする努力に、かなりの程度取って代わったのである。統治の権力を定期的に行われる被治者の選択から生まれるようにしよう、と争いが進むにつれ、権力そのものの制限が重んじられ過ぎたと考えはじめる人がいた。それはもともと、人民と日ごろ利害の対立する支配者を相手に取る手段と思われた。今必要なのは、統治者が人民と一体となり、統治者の利益と意志が国民の利益と意志になることだ。国民を自分自身の意志から守る必要などない。国民が自分自身を圧迫するおそれはない。統治者が現実に国民に対して責任を負い、国民の手ですぐに退けられるなら、国民が使い方を指図できる権力を彼らに託してもよい。彼らの権力は、国民自身の力を集めて、行使しやすい形にしただけのものだ。この考え方というより、むしろ感じ方は、一世代前のヨーロッパの自由主義者のあいだでは広く行き渡っていた。大陸の自由主義者のあいだでは、今もどうやら支配的である。そもそも存在すべきでないと考える政府を別とすれば、政府の行ってよいことに何らかの限界を認める大陸の政治思想家は、きわだって例外的な存在だ。わが国でも、一時この考えを後押しした事情がそのまま続いていたなら、今ごろ似たような気分が広く行き渡っていたかもしれない。
  translation_status: reviewed

    source_sequence: 13
  source_text: The object of this Essay is to assert one very simple principle, as entitled to govern absolutely the dealings of society with the individual in the way of compulsion and control, whether the means used be physical force in the form of legal penalties, or the moral coercion of public opinion. That principle is, that the sole end for which mankind are warranted, individually or collectively, in interfering with the liberty of action of any of their number, is self-protection. That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant. He cannot rightfully be compelled to do or forbear because it will be better for him to do so, because it will make him happier, because, in the opinions of others, to do so would be wise, or even right. These are good reasons for remonstrating with him, or reasoning with him, or persuading him, or entreating him, but not for compelling him, or visiting him with any evil in case he do otherwise. To justify that, the conduct from which it is desired to deter him must be calculated to produce evil to some one else. The only part of the conduct of any one, for which he is amenable to society, is that which concerns others. In the part which merely concerns himself, his independence is, of right, absolute. Over himself, over his own body and mind, the individual is sovereign.
  translation_ja: 本論の目的は、ごく単純な一つの原理を掲げることにある。社会が個人に何かを強い、また制限を加えるとき、用いる手段が法による処罰という形の物理的な力であろうと、世論による道徳的な圧力であろうと、例外なくこの原理に従わなければならない。その原理とは、人々が個人としてであれ集団としてであれ、仲間の誰かの行動の自由に口を出してよい唯一の目的は、自分たちを守ることだ、というものである。発達した社会で、その一員に本人の意に反して権力をふるうことが正当なのは、他人への危害を防ぐときに限られる。たとえ本人のためでも、身体にとってよいとか、道徳上よいということだけでは根拠にならない。そうするほうが本人のためになる、もっと幸せになる、他人から見て賢明だ、あるいは正しいことだとしても、何かをするよう、またはしないよう、その人に強いることは正当ではない。こうした理由があれば、いさめ、理を説き、説得し、頼むことはできる。だが強制したり、従わないからといって何か不利益を加えたりしてよい理由にはならない。それを正当化するには、やめさせようとする行為が、ほかの誰かに害を与える見込みのあるものでなければならない。人が社会に対して責任を負うのは、その行動のうち他人に関わる部分だけだ。自分自身だけに関わる部分では、自立は当然の権利として絶対である。自分自身について、自分の身体と心について、主権を持つのは個人である。
  translation_status: reviewed
- id: ol-01-010
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:

    precision: page
    printed_page: '33'
    printed_page_end: '35'
    source_sequence: 26
  source_text: 'The objection likely to be made to this argument, would probably take some such form as the following. There is no greater assumption of infallibility in forbidding the propagation of error, than in any other thing which is done by public authority on its own judgment and responsibility. Judgment is given to men that they may use it. Because it may be used erroneously, are men to be told that they ought not to use it at all? To prohibit what they think pernicious, is not claiming exemption from error, but fulfilling the duty incumbent on them, although fallible, of acting on their conscientious conviction. If we were never to act on our opinions, because those opinions may be wrong, we should leave all our interests uncared for, and all our duties unperformed. An objection which applies to all conduct, can be no valid objection to any conduct in particular. It is the duty of governments, and of individuals, to form the truest opinions they can; to form them carefully, and never impose them upon others unless they are quite sure of being right. But when they are sure (such reasoners may say), it is not conscientiousness but cowardice to shrink from acting on their opinions, and allow doctrines which they honestly think dangerous to the welfare of mankind, either in this life or in another, to be scattered abroad without restraint, because other people, in less enlightened times, have persecuted opinions now believed to be true. Let us take care, it may be said, not to make the same mistake: but governments and nations have made mistakes in other things, which are not denied to be fit subjects for the exercise of authority: they have laid on bad taxes, made unjust wars. Ought we therefore to lay on no taxes, and, under whatever provocation, make no wars? Men, and governments, must act to the best of their ability. There is no such thing as absolute certainty, but there is assurance sufficient for the purposes of human life. We may, and must, assume our opinion to be true for the guidance of our own conduct: and it is assuming no more when we forbid bad men to pervert society by the propagation of opinions which we regard as false and pernicious.'
  translation_ja: この議論に対しては、おそらく次のような反論があるだろう。誤りが広まるのを禁じるからといって、公の権力が自分の判断と責任で行うほかの事のどれよりも、自分は誤らないと決めてかかっているわけではない。判断力は、人が使うために与えられている。使い方を誤ることがあるからといって、まったく使ってはいけないと言うべきなのか。有害だと思うものを禁じるのは、自分に誤りがないと称するのではない。間違う可能性があっても、自分の良心が確かだと認めるところに従うという、負わされた義務を果たすのだ。意見が間違っているかもしれないというだけで、決して意見に従って行動しないとすれば、自分の利益は何一つ守れず、義務は何一つ果たせないだろう。あらゆる行動に当てはまる反論は、特定のどんな行動に対しても有効な反論にはならない。政府にも個人にも、できるだけ真実に近い意見を持つ義務がある。慎重に考え、自分が正しいと確信しないかぎり、人に押しつけない義務がある。だが確信しているならば、とこう論じる人々は言うだろう、昔の、今ほど知識の開けていない時代の人々が、今は真実と認められる意見を迫害したからといって、自分の意見に従って行動するのを避け、この世であれ来世であれ、人間の幸福にとって危険だと心底思う教説が、何の歯止めもなく広まるのを許すのは、良心的なのではなく、臆病なのである。同じ誤りをしないように気をつけよう、と彼らは言うかもしれない。だが政府や国民は、権力をふるうのがふさわしいと誰もが認める、ほかの事柄についても間違ってきた。悪い税を課し、不正な戦争をしてきた。では、税は何も課さず、どんな挑発を受けても戦争はしないほうがよいのだろうか。人も政府も、できるかぎりの判断をして行動しなければならない。絶対の確かさなど存在しないが、人が生きていくのに十分な確信は存在する。自分の行動の指針とするため自分の意見を真実と見なしてよいし、そうしなければならない。そして、自分たちが誤っていて有害だと思う意見を広めて社会を誤らせることを、悪い人たちに禁じるのも、それ以上のことを見込んでいるわけではない。
  translation_status: reviewed

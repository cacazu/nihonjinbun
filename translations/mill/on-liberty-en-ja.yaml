  source_text: Were the duty of enforcing universal education once admitted, there would be an end to the difficulties about what the State should teach, and how it should teach, which now convert the subject into a mere battle-field for sects and parties, causing the time and labour which should have been spent in educating, to be wasted in quarrelling about education. If the government would make up its mind to require for every child a good education, it might save itself the trouble of providing one. It might leave to parents to obtain the education where and how they pleased, and content itself with helping to pay the school fees of the poorer class of children, and defraying the entire school expenses of those who have no one else to pay for them. The objections which are urged with reason against State education, do not apply to the enforcement of education by the State, but to the State's taking upon itself to direct that education; which is a totally different thing. That the whole or any large part of the education of the people should be in State hands, I go as far as any one in deprecating. All that has been said of the importance of individuality of character, and diversity in opinions and modes of conduct, involves, as of the same unspeakable importance, diversity of education. A general State education is a mere contrivance for moulding people to be exactly like one another; and as the mould in which it casts them is that which pleases the predominant power in the government, whether this be a monarch, a priesthood, an aristocracy, or the majority of the existing generation, in proportion as it is efficient and successful, it establishes a despotism over the mind, leading by natural tendency to one over the body. An education established and controlled by the State, should only exist, if it exist at all, as one among many competing experiments, carried on for the purpose of example and stimulus, to keep the others up to a certain standard of excellence. Unless, indeed, when society in general is in so backward a state that it could not or would not provide for itself any proper institutions of education, unless the government undertook the task; then, indeed, the government may, as the less of two great evils, take upon itself the business of schools and universities, as it may that of joint stock companies, when private enterprise, in a shape fitted
    for undertaking great works of industry, does not exist in the country. But in general, if the country contains a sufficient number of persons qualified to provide education under government auspices, the same persons would be able and willing to give an equally good education on the voluntary principle, under the assurance of remuneration afforded by a law rendering education compulsory, combined with State aid to those unable to defray the expense.
  translation_ja: すべての人に教育を受けさせる義務がいったん認められれば、国家が何をどう教えるべきかをめぐる難しさは消えるだろう。今はそれが、教育という主題をたかだか宗派や党派の戦場に変え、教育に使うべき時間と手間を、教育をめぐるいさかいで浪費させている。すべての子どもに良い教育を与えよと、政府が求める決心をするなら、政府自身が教育を与える手間は省けるだろう。好むところで、好むように教育を受けさせることは親に任せ、政府は、より貧しい子の授業料を一部負担し、ほかに費用を出してくれる人のいない子には、就学の費用のすべてを負担することで満足してよい。国による教育に対して、道理のある異議が向けられるのは、国家が教育を義務づけることではなく、自らその教育を指図することである。まったく別のことなのだ。国民の教育のすべて、あるいは相当部分が国家の手に委ねられることには、誰にも劣らず反対する。性格の個性、意見や行動の仕方の多様さの重要性について述べたことからすれば、教育の多様性も、言い尽くせないほど同じように大切である。一律の国民教育は、人々を寸分たがわず似たものに作る装置にすぎない。型は政府の中で優位を占める権力、君主であれ聖職者であれ貴族であれ、今の世代の多数派であれ、その気に入る型である。だから制度が有効で成功するほど、精神に対する専制を築き、自然と身体に対する専制につながる。国家が設け、統制する教育は、存在するとしたら、多くの競い合う試みの一つにとどめ、手本と刺激を与えて、ほかの試みを一定の水準に保つために行うべきである。ただし、社会全体があまりに発達しておらず、政府が引き受けなければ、自ら適切な教育機関を設けられない、あるいは設けようとしない場合は別である。それならば、二つの大きな害のうち小さいほうとして、政府は学校や大学の仕事を引き受けてよいだろう。大きな産業の事業を引き受けられる形の民間の企業が国内にないときには、株式会社の仕事を引き受けてよいのと同じである。だが一般には、政府の後ろ盾のもとで教育を供せる人が国内に十分いるなら、教育を義務にする法と、費用をまかなえない人への国家の援助とによって、報酬を受け取れる保証があれば、その同じ人々は、民間の自由な取り組みとして、同じだけよい教育を提供できるし、提供する気にもなるだろう。
  translation_status: reviewed
- id: ol-05-014
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '203'
    printed_page_end: '205'
    source_sequence: 132
  source_text: 'The instrument for enforcing the law could be no other than public examinations, extending to all children, and beginning at an early age. An age might be fixed at which every child must be examined, to ascertain if he (or she) is able to read. If a child proves unable, the father, unless he has some sufficient ground of excuse, might be subjected to a moderate fine, to be worked out, if necessary, by his labour, and the child might be put to school at his expense. Once in every year the examination should be renewed, with a gradually extending range of subjects, so as to make the universal acquisition, and what is more, retention, of a certain minimum of general knowledge, virtually compulsory. Beyond that minimum, there should be voluntary examinations on all subjects, at which all who come up to a certain standard of proficiency might claim a certificate. To prevent the State from exercising, through these arrangements, an improper influence over opinion, the knowledge required for passing an examination (beyond the merely instrumental parts of knowledge, such as languages and their use) should, even in the higher class of examinations, be confined to facts and positive science exclusively. The examinations on religion, politics, or other disputed topics, should not turn on the truth or falsehood of opinions, but on the matter of fact that such and such an opinion is held, on such grounds, by such authors, or schools, or churches. Under this system, the rising generation would be no worse off in regard to all disputed truths, than they are at present; they would be brought up either churchmen or dissenters as they now are, the state merely taking care that they should be instructed churchmen, or instructed dissenters. There would be nothing to hinder them from being taught religion, if their parents chose, at the same schools where they were taught other things. All attempts by the state to bias the conclusions of its citizens on disputed subjects, are evil; but it may very properly offer to ascertain and certify that a person possesses the knowledge, requisite to make his conclusions, on any given subject, worth attending to. A student of philosophy would be the better for being able to stand an examination both in Locke and in Kant, whichever of the two he takes up with, or even if with neither: and there is no reasonable objection to examining
    an atheist in the evidences of Christianity, provided he is not required to profess a belief in them. The examinations, however, in the higher branches of knowledge should, I conceive, be entirely voluntary. It would be giving too dangerous a power to governments, were they allowed to exclude any one from professions, even from the profession of teacher, for alleged deficiency of qualifications: and I think, with Wilhelm von Humboldt, that degrees, or other public certificates of scientific or professional acquirements, should be given to all who present themselves for examination, and stand the test; but that such certificates should confer no advantage over competitors, other than the weight which may be attached to their testimony by public opinion.'
  translation_ja: 法を実行する手段は、幼いころからすべての子どもを対象に行う、公の試験以外にはない。どの子も、この年齢になったら、男の子も女の子も字を読めるかを調べる試験を受けなければならない、と定められるだろう。読めないと分かったら、父親にはよほどの理由がないかぎり、ほどほどの罰金を課し、必要なら働いてそれを払い、父親の負担で子どもを学校に入れることができる。試験は一年に一度行い、次第に科目を広げる。こうして、ある最低限の一般的な知識をすべての者が身につけること、さらに大切にはそれを覚えていることを、事実上義務とする。その最低限を越えた範囲では、あらゆる主題で任意の試験を行い、一定の習熟の水準に達した者は誰でも、証明書を求められるようにすべきだ。この仕組みによって、国家が意見に不当な影響を及ぼすのを防ぐため、試験に通るのに必要な知識は、高い水準の試験でさえ、言語とその使い方のような、ただ手段となる知識を除けば、事実と実証的な科学に限らなくてはならない。宗教や政治、ほかの意見の分かれる問題についての試験は、意見が真実か偽りかではなく、どの著者や学派や教会が、どんな理由でどの意見を持っているかという事実を問うべきである。この仕組みなら、真偽の争われているすべてのことに関して、次の世代は今より悪い立場には置かれない。今と同じように国教会員か非国教徒として育ち、国家が気を配るのは、知識のある国教会員や、知識のある非国教徒になることだけである。親が望めば、ほかのことを教わる学校で、宗教を教わるのを妨げるものはない。決着していない主題について、市民の結論をある方向に傾けようとする国家の試みは、すべて悪い。だが、ある主題について、その人の結論が耳を傾けるに値するために必要な知識を持つかを確認し、証明すると申し出ることは、まことに適切である。哲学を学ぶ人は、ロックとカントのどちらを受け入れようと、どちらも受け入れまいと、両方についての試験に耐えられるほうがよい。無神論者にキリスト教の根拠を問うことにも、信じると公言せよと求めなければ、理にかなった反対理由はない。ただし、高度な分野での試験は、すべて自由に受けるものとするべきだと思う。資格が足りないと称して、ある職業から、教師という職業からでさえ、誰かを締め出すことが政府に許されれば、危険すぎる権力を与えることになる。私もヴィルヘルム・フォン・フンボルトと同じく、学位や、学問や職業上の知識を証明するほかの公の証明書は、試験を受けるため出向き、その試験に合格した者すべてに、与えるべきだと思う。だがその証明書は、世間がその証明書の示すことにどれほど重みを置くかということのほか、競争相手に対する優位を、一切与えるべきではない。
  translation_status: reviewed
- id: ol-05-015
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '205'
    printed_page_end: '207'
    source_sequence: 133
  source_text: 'It is not in the matter of education only, that misplaced notions of liberty prevent moral obligations on the part of parents from being recognised, and legal obligations from being imposed, where there are the strongest grounds for the former always, and in many cases for the latter also. The fact itself, of causing the existence of a human being, is one of the most responsible actions in the range of human life. To undertake this responsibility—to bestow a life which may be either a curse or a blessing—unless the being on whom it is to be bestowed will have at least the ordinary chances of a desirable existence, is a crime against that being. And in a country either over-peopled, or threatened with being so, to produce children, beyond a very small number, with the effect of reducing the reward of labour by their competition, is a serious offence against all who live by the remuneration of their labour. The laws which, in many countries on the Continent, forbid marriage unless the parties can show that they have the means of supporting a family, do not exceed the legitimate powers of the state: and whether such laws be expedient or not (a question mainly dependent on local circumstances and feelings), they are not objectionable as violations of liberty. Such laws are interferences of the state to prohibit a mischievous act—an act injurious to others, which ought to be a subject of reprobation, and social stigma, even when it is not deemed expedient to superadd legal punishment. Yet the current ideas of liberty, which bend so easily to real infringements of the freedom of the individual, in things which concern only himself, would repel the attempt to put any restraint upon his inclinations when the consequence of their indulgence is a life, or lives, of wretchedness and depravity to the offspring, with manifold evils to those sufficiently within reach to be in any way affected by their actions. When we compare the strange respect of mankind for liberty, with their strange want of respect for it, we might imagine that a man had an indispensable right to do harm to others, and no right at all to please himself without giving pain to any one.'
  translation_ja: 自由について考え違いをしたために、親の側の道徳上の義務を認めず、法的な義務を課せなくなっているのは、教育のことだけではない。前の義務にはいつでも、後の義務にも多くの場合、きわめて強い理由がある。人を一人存在させること自体、人が一生のうちに行いうることのなかで、最も重い責任を負うことの一つだ。祝福にも呪いにもなりうる生を与えるこの責任を、与えられる者が少なくともふつうの人と同じくらい、望ましい暮らしを営める見込みがないのに引き受ければ、その人に対する罪である。また人が多すぎる国や、そうなるおそれがある国で、ごく少数を越えて子どもをつくり、その人々が競争に加わるために働く報いを減らすのは、労働の報いで暮らす人すべてへの重大な害である。ヨーロッパ大陸の多くの国で、当事者が家族を養う手段があることを示せないかぎり結婚を禁じる法は、国家の正当な権力を越えてはいない。それが適切な法かは、おもに土地の事情と人々の気持ちしだいだが、いずれにせよ自由を侵すとして異議を唱えるべきことではない。そのような法は、害のある行為、他人を害し、法の罰まで加えるのが得策とはされなくても、非難を受け、世間から恥ずべきとされてよい行為を禁じるために、国家が介入するものだ。だが今通用する自由の考え方は、本人にしか関わらないことで個人の自由が本当に侵されると、いとも簡単に折れるくせに、好きなようにすれば、その子に悲惨で堕落した一生を、また、その行動の影響が何か及ぶ所にいる人々にさまざまな害をもたらす場合でさえ、個人の願いに何かの制限を設けることを、はねつけるだろう。自由への奇妙な尊重と、自由への奇妙な無関心を比べると、人は他人を害する権利だけは決して奪われず、誰にもつらい思いをさせずに自分を楽しませる権利は一切ないのかと思いたくなる。
  translation_status: reviewed
- id: ol-05-016
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '207'
    printed_page_end: '207'
    source_sequence: 134
  source_text: 'I have reserved for the last place a large class of questions respecting the limits of government interference, which, though closely connected with the subject of this Essay, do not, in strictness, belong to it. These are cases in which the reasons against interference do not turn upon the principle of liberty: the question is not about restraining the actions of individuals, but about helping them: it is asked whether the government should do, or cause to be done, something for their benefit, instead of leaving it to be done by themselves, individually, or in voluntary combination.'
  translation_ja: 政府による介入の限度について、本論の主題に密接な関係はあっても厳密には主題に入らない、大きな一群の問題を最後に残してきた。介入に反対する理由が、自由の原理によらない場合である。個人の行動を抑えるのでなく、助けることが問題だ。人々が一人ひとりで、あるいは自発的に団結して行うに任せるのでなく、政府が人々のために何かを行うか、行わせるべきか、と問われているのだ。
  translation_status: reviewed
- id: ol-05-017
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '207'
    printed_page_end: '207'
    source_sequence: 135
  source_text: The objections to government interference, when it is not such as to involve infringement of liberty, may be of three kinds.
  translation_ja: 自由の侵害を伴わない場合に、政府の介入に反対する理由は、三種類あるだろう。
  translation_status: reviewed
- id: ol-05-018
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '207'
    printed_page_end: '208'
    source_sequence: 136
  source_text: The first is, when the thing to be done is likely to be better done by individuals than by the government. Speaking generally, there is no one so fit to conduct any business, or to determine how or by whom it shall be conducted, as those who are personally interested in it. This principle condemns the interferences, once so common, of the legislature, or the officers of government, with the ordinary processes of industry. But this part of the subject has been sufficiently enlarged upon by political economists, and is not particularly related to the principles of this Essay.
  translation_ja: 第一は、行うべきことを政府より個人のほうがうまくできそうな場合である。一般に、ある事業を営むにも、どうやって誰に営ませるかを決めるにも、直接利害のある当事者ほどふさわしい人はいない。この原理からすれば、立法府や役人が、産業の日常の営みに介入するかつての慣行は、退けられる。だがこの主題のこの部分は経済学者が十分詳しく述べており、本論の原理と特別に関係するわけではない。
  translation_status: reviewed
- id: ol-05-019
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '208'
    printed_page_end: '209'
    source_sequence: 137
  source_text: The second objection is more nearly allied to our subject. In many cases, though individuals may not do the particular thing so well, on the average, as the officers of government, it is nevertheless desirable that it should be done by them, rather than by the government, as a means to their own mental education—a mode of strengthening their active faculties, exercising their judgment, and giving them a familiar knowledge of the subjects with which they are thus left to deal. This is a principal, though not the sole, recommendation of jury trial (in cases not political); of free and popular local and municipal institutions; of the conduct of industrial and philanthropic enterprises by voluntary associations. These are not questions of liberty, and are connected with that subject only by remote tendencies; but they are questions of development. It belongs to a different occasion from the present to dwell on these things as parts of national education; as being, in truth, the peculiar training of a citizen, the practical part of the political education of a free people, taking them out of the narrow circle of personal and family selfishness, and accustoming them to the comprehension of joint interests, the management of joint concerns—habituating them to act from public or semi-public motives, and guide their conduct by aims which unite instead of isolating them from one another. Without these habits and powers, a free constitution can neither be worked nor preserved, as is exemplified by the too-often transitory nature of political freedom in countries where it does not rest upon a sufficient basis of local liberties. The management of purely local business by the localities, and of the great enterprises of industry by the union of those who voluntarily supply the pecuniary means, is further recommended by all the advantages which have been set forth in this Essay as belonging to individuality of development, and diversity of modes of action. Government operations tend to be everywhere alike. With individuals and voluntary associations, on the contrary, there are varied experiments, and endless diversity of experience. What the State can usefully do, is to make itself a central depository, and active circulator and diffuser, of the experience resulting from many trials. Its business is to enable each experimentalist to benefit by the experiments
    of others, instead of tolerating no experiments but its own.
  translation_ja: 第二の反対理由は、私たちの主題により近い。平均して個々人は役人ほどにはうまくできないとしても、政府ではなく個々人がするほうが、望ましい場合は多い。その人々自身の精神を教育する手立てとしてだ。自分で活動する能力を強め、判断を働かせ、こうして任されたことを、よく知るようにする方法である。政治が関わらない事件での陪審裁判、自由で住民が参加する地方や都市の制度、自発的に集まった人々による産業や慈善事業を勧める、大きな理由の一つはこれだ。ただし唯一の理由ではない。これらは自由の問いではなく、自由に関係するのは、長い目で見た傾向においてだけだ。しかし発達の問いではある。国民教育の一部としてこれらを詳しく考えるのは、また別の機会の仕事だ。実際にそれは市民特有の訓練、自由な国民の政治教育の実践の部分である。個人と家族の利己心という狭い輪の外に人々を連れ出し、共通の利益を理解し、共同の事柄を取り扱うのに慣れさせる。公の、または半ば公の動機から行動し、人々を互いに孤立させず結びつける目標で、行いを導くのに慣れさせる。こうした習慣と能力なしには、自由な政体を動かすことも保つこともできない。地方の自由を十分な土台としない国では、政治的な自由がつかの間のものに終わることがあまりに多い。それが実例だ。地域だけに関わる事業を地域が進め、大きな産業上の事業を、自ら資金を出し合う人々が力を合わせて進めることには、さらに勧める理由がある。この論考で、個々の発達の独自さと行動の仕方の多様さに属すると述べた利益のすべてである。政府の活動はどこでも似通う傾向がある。一方、個人や自発的な団体には、多様な試みと尽きることのないさまざまな経験がある。国家にできる有益なことは、数多くの試みが生んだ経験を一か所に集めて蓄え、率先して流通させ、広めることだ。自分の試み以外は認めないのでなく、試みる人が、それぞれほかの人の試みから利益を得られるようにするのが、国家の仕事である。
  translation_status: reviewed
- id: ol-05-020
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '209'
    printed_page_end: '213'
    source_sequence: 138
  source_text: 'The third, and most cogent reason for restricting the interference of government, is the great evil of adding unnecessarily to its power. Every function superadded to those already exercised by the government, causes its influence over hopes and fears to be more widely diffused, and converts, more and more, the active and ambitious part of the public into hangers-on of the government, or of some party which aims at becoming the government. If the roads, the railways, the banks, the insurance offices, the great joint-stock companies, the universities, and the public charities, were all of them branches of the government; if, in addition, the municipal corporations and local boards, with all that now devolves on them, became departments of the central administration; if the employés of all these different enterprises were appointed and paid by the government, and looked to the government for every rise in life; not all the freedom of the press and popular constitution of the legislature would make this or any other country free otherwise than in name. And the evil would be greater, the more efficiently and scientifically the administrative machinery was constructed—the more skilful the arrangements for obtaining the best qualified hands and heads with which to work it. In England it has of late been proposed that all the members of the civil service of government should be selected by competitive examination, to obtain for those employments the most intelligent and instructed persons procurable; and much has been said and written for and against this proposal. One of the arguments most insisted on by its opponents, is that the occupation of a permanent official servant of the State does not hold out sufficient prospects of emolument and importance to attract the highest talents, which will always be able to find a more inviting career in the professions, or in the service of companies and other public bodies. One would not have been surprised if this argument had been used by the friends of the proposition, as an answer to its principal difficulty. Coming from the opponents it is strange enough. What is urged as an objection is the safety-valve of the proposed system. If indeed all the high talent of the country could be drawn into the service of the government, a proposal tending to bring about that result might well inspire uneasiness. If every
    part of the business of society which required organised concert, or large and comprehensive views, were in the hands of the government, and if government offices were universally filled by the ablest men, all the enlarged culture and practised intelligence in the country, except the purely speculative, would be concentrated in a numerous bureaucracy, to whom alone the rest of the community would look for all things: the multitude for direction and dictation in all they had to do; the able and aspiring for personal advancement. To be admitted into the ranks of this bureaucracy, and when admitted, to rise therein, would be the sole objects of ambition. Under this régime, not only is the outside public ill-qualified, for want of practical experience, to criticise or check the mode of operation of the bureaucracy, but even if the accidents of despotic or the natural working of popular institutions occasionally raise to the summit a ruler or rulers of reforming inclinations, no reform can be effected which is contrary to the interest of the bureaucracy. Such is the melancholy condition of the Russian empire, as is shown in the accounts of those who have had sufficient opportunity of observation. The Czar himself is powerless against the bureaucratic body; he can send any one of them to Siberia, but he cannot govern without them, or against their will. On every decree of his they have a tacit veto, by merely refraining from carrying it into effect. In countries of more advanced civilisation and of a more insurrectionary spirit, the public, accustomed to expect everything to be done for them by the State, or at least to do nothing for themselves without asking from the State not only leave to do it, but even how it is to be done, naturally hold the State responsible for all evil which befalls them, and when the evil exceeds their amount of patience, they rise against the government and make what is called a revolution; whereupon somebody else, with or without legitimate authority from the nation, vaults into the seat, issues his orders to the bureaucracy, and everything goes on much as it did before; the bureaucracy being unchanged, and nobody else being capable of taking their place.'
  translation_ja: 政府の介入を制限する第三の、そして最も強い理由は、不必要に政府の権力を増すことの大きな害にある。すでに行っている仕事に新しく一つ役割を加えるたびに、政府は人々が願い、恐れるものへの影響をもっと広げ、世間の活発で野心のある人々を、ますます、政府か、政府になろうとする党派の取り巻きに変える。道路、鉄道、銀行、保険会社、大きな株式会社、大学、公の慈善団体がすべて、政府の一部になったとしよう。そのうえ、市町村の自治体や地方の委員会も、今日任されていることをすべて携えて中央行政の部局になり、これらのさまざまな事業の職員がみな政府に任命され、給料を受け、人生で少しでも出世するたびに政府を頼ったら、どれほど出版の自由があろうと、立法府がどれほど民衆的に構成されていようと、この国もほかの国も、名ばかりの自由国となるだろう。行政の仕組みが有効に、科学的に作られて、その仕事に最もふさわしい手と頭を得る仕掛けがすぐれているほど、害は大きくなる。イングランドでは近ごろ、政府のすべての文官を競争試験で選んで、得られる最も明敏で学識のある人をその職に就けようと提案され、賛成と反対の双方が盛んに意見を述べ、書いてきた。反対者が最も力を入れる論拠の一つは、常勤の国家公務員では、最もすぐれた人材を引きつけるのに十分な報酬や重要な地位を望めず、そうした人は、専門の職業、会社やほかの公的組織で、より魅力のある道をいつでも見つける、というものである。この論拠を提案の支持者が主な難点に答えるために使ったなら、驚くにはあたらなかっただろう。反対者が持ち出すのは随分と奇妙だ。反対の理由とされるところは、この仕組みの安全弁なのである。国のすぐれた才能をすべて政府の仕事へ引き入れられるなら、そんなことをもたらそうとする提案は、心配を呼んで当然だ。組織だった協力、または広い包括的な見通しが要る社会の仕事のすべてを政府が握り、政府の官職がどこでも最も有能な者に占められれば、純粋に思索をする者を別として、国中の広い教養と実地に通じた知性が、数の多い官僚組織に集中する。ほかの人々は何事もそこだけを頼る。大衆はしなければならないすべてのことについて指図を、能力と向上心のある者は自分の出世を、そこに求める。その組織の一員となり、入ったらそこで上がることだけが、野心の対象になる。この体制では、外部の人々は実際の経験を欠くため、官僚の仕事の仕方を批判し、抑える力が乏しいばかりではない。専制の偶然や民衆的制度の自然な働きで、ときに改革好きの一人か数人が頂点に立っても、官僚の利益に反する改革は、何一つ実行できない。それがロシア帝国の悲しい状態であり、十分に観察する機会を得た人の報告が示すとおりだ。皇帝自身が、官僚組織には無力である。一人をシベリアへ送ることはできても、官僚なしでは、また官僚の意に反しては、国を治められない。何の勅令でも、官僚には、実施しないだけで黙って拒否できる力がある。より文明の発展した、反乱の気性の強い国では、何でも国家がやってくれると期待するのに慣れ、少なくとも、やってよいかだけでなく、どうやったらよいかまで国家に尋ねずには、自分たちでは何もしないことに慣れた世間は、降りかかるすべての害の責任を当然のように国家に負わせる。害が忍耐の限度を越えると、政府に対して立ち上がり、いわゆる革命を起こす。すると別の誰かが、国民から正当な権限を託されていてもいなくても、政府の席に飛び乗り、官僚に命令を出す。官僚は変わらず、その代わりを務めうる人はほかにいないので、万事はおおむね前のまま進む。
  translation_status: reviewed
- id: ol-05-021
  section_id: ch-05
  kind: paragraph
  origin: source

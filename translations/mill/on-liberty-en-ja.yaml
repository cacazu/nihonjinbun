  source_text: To imagine another contingency, perhaps more likely to be realised than the one last mentioned. There is confessedly a strong tendency in the modern world towards a democratic constitution of society, accompanied or not by popular political institutions. It is affirmed that in the country where this tendency is most completely realised—where both society and the government are most democratic—the United States—the feeling of the majority, to whom any appearance of a more showy or costly style of living than they can hope to rival is disagreeable, operates as a tolerably effectual sumptuary law, and that in many parts of the Union it is really difficult for a person possessing a very large income, to find any mode of spending it, which will not incur popular disapprobation. Though such statements as these are doubtless much exaggerated as a representation of existing facts, the state of things they describe is not only a conceivable and possible, but a probable result of democratic feeling, combined with the notion that the public has a right to a veto on the manner in which individuals shall spend their incomes. We have only further to suppose a considerable diffusion of Socialist opinions, and it may become infamous in the eyes of the majority to possess more property than some very small amount, or any income not earned by manual labour. Opinions similar in principle to these, already prevail widely among the artisan class, and weigh oppressively on those who are amenable to the opinion chiefly of that class, namely, its own members. It is known that the bad workmen who form the majority of the operatives in many branches of industry, are decidedly of opinion that bad workmen ought to receive the same wages as good, and that no one ought to be allowed, through piecework or otherwise, to earn by superior skill or industry more than others can without it. And they employ a moral police, which occasionally becomes a physical one, to deter skilful workmen from receiving, and employers from giving, a larger remuneration for a more useful service. If the public have any jurisdiction over private concerns, I cannot see that these people are in fault, or that any individual's particular public can be blamed for asserting the same authority over his individual conduct, which the general public asserts over people in general.
  translation_ja: もう一つ、おそらく前の例より実現しやすい事態を、想像してみよう。近代の世界には、民衆的な政治制度を伴うかどうかは別として、社会を民主的に構成する強い傾向があることは、認められている。その傾向が最も完全に実現し、社会も政府も最も民主的な合衆国では、有力な多数の人々は、自分たちが張り合えそうもないほど華やかで金をかけた暮らしの気配を嫌い、その気持ちが、かなり有効なぜいたく禁止令のように働くと言われる。連邦の多くの所では、非常に多くの収入を持つ人が、それをどう使えば世間の非難を受けないかを見つけるのは、実際、難しいとされる。このような話は、現状の描写としては確かにかなり誇張されている。だがそこに描かれたことは、民主的な心情に、個人が自分の収入をどのように使うかには世間が拒否権を持つという考えが加わった場合に、考えられる、ありうる結果であるばかりか、起こりそうな結果でもある。さらに社会主義の意見がかなり広がると仮定するだけで、ごく少しを越えた財産や、手を使う労働で得られたのでない収入を持つのは、多数の人の目には恥ずべきことになるかもしれない。原理上似た意見は、すでに職人の階級に広く行き渡っており、おもにその階級の意見に従うほかない人、すなわち階級の一員である人を、重く押さえつけている。多くの産業分野で労働者の多数を占める腕の悪い職人は、腕の悪い人もよい職人と同じ賃金を受けるべきだ、出来高払いであれほかの方法であれ、すぐれた腕前や勤勉さで、それを持たない人より多く得ることは、誰にも許すべきでないと、固く考えていることが知られている。そして彼らは、道徳的な取り締まりを使い、それがときに物理的な取り締まりにもなるが、有能な職人が、より役立つ仕事で高い報酬を受けるのを、また雇い主がそれを与えるのを妨げる。もし私的な事柄に世間が何かの管轄権を持つなら、この人たちが間違っているとは、私には言えない。世間一般が人々一般に対して主張するのと同じ権限を、ある人のまわりの限られた世間が、その人の行動に対して主張することは、非難できないだろう。
  translation_status: reviewed

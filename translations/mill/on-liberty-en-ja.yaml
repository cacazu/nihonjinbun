  source_text: 'But, in political and philosophical theories, as well as in persons, success discloses faults and infirmities which failure might have concealed from observation. The notion, that the people have no need to limit their power over themselves, might seem axiomatic, when popular government was a thing only dreamed about, or read of as having existed at some distant period of the past. Neither was that notion necessarily disturbed by such temporary aberrations as those of the French Revolution, the worst of which were the work of a usurping few, and which, in any case, belonged, not to the permanent working of popular institutions, but to a sudden and convulsive outbreak against monarchical and aristocratic despotism. In time, however, a democratic republic came to occupy a large portion of the earth''s surface, and made itself felt as one of the most powerful members of the community of nations; and elective and responsible government became subject to the observations and criticisms which wait upon a great existing fact. It was now perceived that such phrases as "self-government," and "the power of the people over themselves," do not express the true state of the case. The "people" who exercise the power are not always the same people with those over whom it is exercised; and the "self-government" spoken of is not the government of each by himself, but of each by all the rest. The will of the people, moreover, practically means, the will of the most numerous or the most active part of the people; the majority, or those who succeed in making themselves accepted as the majority: the people, consequently, may desire to oppress a part of their number; and precautions are as much needed against this, as against any other abuse of power. The limitation, therefore, of the power of government over individuals, loses none of its importance when the holders of power are regularly accountable to the community, that is, to the strongest party therein. This view of things, recommending itself equally to the intelligence of thinkers and to the inclination of those important classes in European society to whose real or supposed interests democracy is adverse, has had no difficulty in establishing itself; and in political speculations "the tyranny of the majority" is now generally included among the evils against which society requires to be on its guard.'
  translation_ja: しかし政治や哲学の学説も、人と同じで、失敗していたときには目につかなかった欠点や弱点が、成功によって露呈する。民衆による統治が夢のなかにあるか、遠い昔にあったと本で読むだけのものだったころは、人民が自分たちに対する自分たちの権力を制限する必要はない、という考えも、自明の理に見えたかもしれない。フランス革命にあった一時の逸脱も、この考えを必ずしも揺るがさなかった。最悪の逸脱は、権力を奪った少数者の仕業であり、いずれにせよ、民衆の制度が平常どおりに働いた結果ではなく、王と貴族の専制に対して一挙に噴き上がった激しい反動だったからだ。だがやがて、民主的な共和国が地上の広い部分を占め、国際社会で最も強い国の一つとしてその存在を感じさせるようになった。選挙で選ばれ、人民に対して責任を負う政府は、一つの大きな現実として、観察と批判を受けるようになった。そのとき、「自治」や「人民が自らを治める力」といった言葉は、事の実情を言い表していないと分かった。「人民」のうち権力をふるう人々は、それをふるわれる人々といつも同じではない。そこでいう「自治」は、一人ひとりが自分を治めることではなく、一人ひとりを残りの皆が治めることだ。そのうえ「人民の意志」は、実際には最も人数の多いか、最も活発な一部分の意志、つまり多数派か、多数派として認められることに成功した者たちの意志を意味する。したがって人民は、自分たちのうちの一部を圧迫しようとすることがある。他のどんな権力濫用に対してと同じように、これに対しても備えが要る。だから、政府が個人に対してふるう権力を制限することは、権力の持ち主が共同体、つまりそこで最も強い勢力に対し、制度上責任を負っているからといって、少しも重要性を失わない。この見方は、思想家の知性にも、民主政が自分たちの真の、あるいはそう思い込んでいる利益に反する、ヨーロッパの有力な階層の気分にも合っていたので、難なく根を下ろした。今では政治を考えるとき、「多数者の専制」はふつう、社会が警戒すべき害の一つに数えられている。
  translation_status: reviewed

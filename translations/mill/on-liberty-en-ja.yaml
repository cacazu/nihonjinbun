  source_text: The distinction here pointed out between the part of a person's life which concerns only himself, and that which concerns others, many persons will refuse to admit. How (it may be asked) can any part of the conduct of a member of society be a matter of indifference to the other members? No person is an entirely isolated being; it is impossible for a person to do anything seriously or permanently hurtful to himself, without mischief reaching at least to his near connections, and often far beyond them. If he injures his property, he does harm to those who directly or indirectly derived support from it, and usually diminishes, by a greater or less amount, the general resources of the community. If he deteriorates his bodily or mental faculties, he not only brings evil upon all who depended on him for any portion of their happiness, but disqualifies himself for rendering the services which he owes to his fellow-creatures generally; perhaps becomes a burthen on their affection or benevolence; and if such conduct were very frequent, hardly any offence that is committed would detract more from the general sum of good. Finally, if by his vices or follies a person does no direct harm to others, he is nevertheless (it may be said) injurious by his example; and ought to be compelled to control himself, for the sake of those whom the sight or knowledge of his conduct might corrupt or mislead.
  translation_ja: 人の一生のうち、自分にしか関係しない部分と、他人に関係する部分との、この区別を認めようとしない人は多いだろう。社会の一員の振る舞いのどの部分が、残りの人にとってどうでもよいと言えるのか、と問うかもしれない。完全に孤立している人はいない。自分自身に深い、また長く続く害を与えて、少なくとも親しい人々にまで、しばしばずっとその先にまで、害が及ばないようにすることはできない。財産を損なえば、直接または間接にそこから暮らしの支えを得ていた人を害し、ふつう共同体全体の資源も、いくらかは減らす。身体や精神の能力を衰えさせれば、幸福の一部を頼られていたすべての人に害をもたらすだけでなく、人々につくす義務を果たす力を失う。人々の愛情や善意にとって、重荷になることさえありうる。そんな行いが甚だ多ければ、社会全体の善の総量をそれ以上に減らす罪は、ほとんどないだろう。最後に、悪癖や愚行で他人に直接の害を与えないとしても、悪い手本として有害ではある、と言われるかもしれない。その振る舞いを見たり知ったりしたために堕落し、道を誤りかねない人のために、自分を抑えるよう、強制されるべきだというのだ。
  translation_status: reviewed
- id: ol-04-009
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

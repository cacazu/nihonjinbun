  source_text: 'The despotism of custom is everywhere the standing hindrance to human advancement, being in unceasing antagonism to that disposition to aim at something better than customary, which is called, according to circumstances, the spirit of liberty, or that of progress or improvement. The spirit of improvement is not always a spirit of liberty, for it may aim at forcing improvements on an unwilling people; and the spirit of liberty, in so far as it resists such attempts, may ally itself locally and temporarily with the opponents of improvement; but the only unfailing and permanent source of improvement is liberty, since by it there are as many possible independent centres of improvement as there are individuals. The progressive principle, however, in either shape, whether as the love of liberty or of improvement, is antagonistic to the sway of Custom, involving at least emancipation from that yoke; and the contest between the two constitutes the chief interest of the history of mankind. The greater part of the world has, properly speaking, no history, because the despotism of Custom is complete. This is the case over the whole East. Custom is there, in all things, the final appeal; justice and right mean conformity to custom; the argument of custom no one, unless some tyrant intoxicated with power, thinks of resisting. And we see the result. Those nations must once have had originality; they did not start out of the ground populous, lettered, and versed in many of the arts of life; they made themselves all this, and were then the greatest and most powerful nations in the world. What are they now? The subjects or dependants of tribes whose forefathers wandered in the forests when theirs had magnificent palaces and gorgeous temples, but over whom custom exercised only a divided rule with liberty and progress. A people, it appears, may be progressive for a certain length of time, and then stop: when does it stop? When it ceases to possess individuality. If a similar change should befall the nations of Europe, it will not be in exactly the same shape: the despotism of custom with which these nations are threatened is not precisely stationariness. It proscribes singularity, but it does not preclude change, provided all change together. We have discarded the fixed costumes of our forefathers; every one must still dress like other people, but the fashion may
    change once or twice a year. We thus take care that when there is change, it shall be for change''s sake, and not from any idea of beauty or convenience; for the same idea of beauty or convenience would not strike all the world at the same moment, and be simultaneously thrown aside by all at another moment. But we are progressive as well as changeable: we continually make new inventions in mechanical things, and keep them until they are again superseded by better; we are eager for improvement in politics, in education, even in morals, though in this last our idea of improvement chiefly consists in persuading or forcing other people to be as good as ourselves. It is not progress that we object to; on the contrary, we flatter ourselves that we are the most progressive people who ever lived. It is individuality that we war against: we should think we had done wonders if we had made ourselves all alike; forgetting that the unlikeness of one person to another is generally the first thing which draws the attention of either to the imperfection of his own type, and the superiority of another, or the possibility, by combining the advantages of both, of producing something better than either. We have a warning example in China—a nation of much talent, and, in some respects, even wisdom, owing to the rare good fortune of having been provided at an early period with a particularly good set of customs, the work, in some measure, of men to whom even the most enlightened European must accord, under certain limitations, the title of sages and philosophers. They are remarkable, too, in the excellence of their apparatus for impressing, as far as possible, the best wisdom they possess upon every mind in the community, and securing that those who have appropriated most of it shall occupy the posts of honour and power. Surely the people who did this have discovered the secret of human progressiveness, and must have kept themselves steadily at the head of the movement of the world. On the contrary, they have become stationary—have remained so for thousands of years; and if they are ever to be farther improved, it must be by foreigners. They have succeeded beyond all hope in what English philanthropists are so industriously working at—in making a people all alike, all governing their thoughts and conduct by the same maxims and rules; and these are the fruits. The modern régime
    of public opinion is, in an unorganised form, what the Chinese educational and political systems are in an organised; and unless individuality shall be able successfully to assert itself against this yoke, Europe, notwithstanding its noble antecedents and its professed Christianity, will tend to become another China.'
  translation_ja: 慣習の専制は、どこでも絶えず人類の進歩を妨げている。習わしより少しでもよい何かを目指す性向、場合によって自由の精神とも、進歩や改善の精神とも呼ばれるものに、いつも敵対するからだ。改善の精神がいつも自由の精神であるわけではない。望まない人々に改善を強いることを目指す場合がある。また自由の精神は、その試みに抗するかぎりで、ある所では、ある間だけ、改善の反対者と手を組むことがある。しかし改善が尽きずに続く唯一の源は自由である。自由があれば、個人の数だけ、改善が別々に始まる拠点がありうるからだ。ただし、自由を愛する形であれ、改善を愛する形であれ、前に進む原理は、少なくとも慣習の軛からの解放を求めるので、慣習の支配と敵対する。その二つの争いが、人類史のいちばん興味を引くところをなす。世界の大半には、厳密に言えば歴史がない。慣習の専制が完全だからだ。東洋全体でそうである。そこではどんな事柄も、最後に訴える先は慣習であり、正義と権利とは慣習に従うことを意味する。権力に酔った専制者でもないかぎり、慣習を根拠とする議論に抵抗しようとは思わない。結果は目の前にある。それらの国々にも、昔は独創性があったに違いない。大勢の人口を持ち、文字を知り、生活のさまざまな技術に通じた国が、地面から突然生えて出たのではない。自らをそのような国にし、そのころは世界で最も大きく強い国だった。今はどうか。彼らの祖先が壮大な宮殿や華麗な寺院を持ったころ、森をさまよっていた人々の、その子孫の支配下や従属下にある。だがその人々の上では、慣習は自由や進歩と権力を分け持つにとどまったのである。どうやら国民はある程度の期間は進歩しても、やがて止まることがある。いつ止まるのか。個性を失ったときだ。似た変化がヨーロッパの国々に起こるとしても、まったく同じ形ではないだろう。これらの国を脅かす慣習の専制は、正確には停滞ではない。人と違うことを禁じるが、皆が一緒に変われば、変化はさまたげない。先祖の決まりきった服装は捨てた。誰もが、人と同じように装わなくてはならない点は変わらないが、流行は年に一度か二度、変わってよい。そうして私たちは、変わるときには変わるために変わり、美しさや使いよさを考えるためではないよう、気を配る。同じ美しさや便利さの考えが、同じ瞬間に世界中の人の心をとらえ、別の瞬間に皆に同時に捨て去られるとは考えられないからだ。もっとも私たちは、変わりやすいだけでなく進歩する。機械に関する新しい発明を絶えず行い、もっとよいものが取って代わるまで使い続ける。政治や教育、道徳さえ、改善しようと熱心になっている。もっとも、道徳を改善するという考えは、主に、私たちと同じだけ善良になれと他人を説得するか、強いることにある。私たちが反対するのは進歩ではない。反対に、これまで生きたうち最も進歩的な人間は自分たちだと思って、悦に入っている。私たちが戦う相手は個性であり、みんな同じにできたなら、偉業を成し遂げたと思うだろう。ある人と別の人とが違うことが、たいていまず両者に、自分の型に足りないところがある、相手にはすぐれたところがある、あるいは両方の長所を組み合わせればどちらよりもよいものができる、と気づかせるのを忘れている。中国には警告となる例がある。才能に恵まれ、ある点では知恵さえ持つ国民である。早くから、とりわけすぐれた慣習の一組を授けられるという、まれな幸運にあずかったからだ。その慣習は、最も開けたヨーロッパ人でさえ、いくらか条件をつければ、賢者や哲学者と呼ばずにいられない人々が、一部は作ったものだ。また彼らが持つ最善の知恵を、共同体のあらゆる心にできるかぎり刻みつけ、最も身につけた人が、名誉と権力のある地位を占める仕組みのすぐれたことも、注目に値する。これを成し遂げた人々なら、人間が進歩する秘訣を見つけ、世界の動きの先頭に着実に立ち続けたはずだ。ところが逆に、彼らは止まり、何千年もそのままでいる。これ以上よくなることがあるなら、外国の手によるほかない。イギリスの慈善家たちがせっせと取り組んでいること、すなわち、人々をすべて同じにし、みな同じ格言と規則で自分の考えと行いを治めるようにすることに、彼らは望みを超えて成功した。これがその実りである。近代の世論の支配は、中国の教育制度と政治制度が組織立てて行っていることを、組織立てずに行うものだ。この軛に抗して個性がうまく自らを主張できないかぎり、ヨーロッパは、気高い過去を持ち、キリスト教を掲げながら、もう一つの中国に向かうだろう。
  translation_status: reviewed

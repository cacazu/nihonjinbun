  source_text: We have now recognised the necessity to the mental well-being of mankind (on which all their other well-being depends) of freedom of opinion, and freedom of the expression of opinion, on four distinct grounds; which we will now briefly recapitulate.
  translation_ja: これまで、意見を持つ自由と、それを表す自由が、人間の精神の健全さに不可欠だと（ほかのあらゆる面での健全さも、これにかかっている）、四つの異なる根拠によって認めてきた。では手短に振り返ろう。
  translation_status: reviewed

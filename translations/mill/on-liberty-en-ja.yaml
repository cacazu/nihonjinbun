    precision: page
    printed_page: '50'
    printed_page_end: '50'
    source_sequence: 36
  source_text: Aware of the impossibility of defending the use of punishment for restraining irreligious opinions, by any argument which will not justify Marcus Antoninus, the enemies of religious freedom, when hard pressed, occasionally accept this consequence, and say, with Dr. Johnson, that the persecutors of Christianity were in the right; that persecution is an ordeal through which truth ought to pass, and always passes successfully, legal penalties being, in the end, powerless against truth, though sometimes beneficially effective against mischievous errors. This is a form of the argument for religious intolerance, sufficiently remarkable not to be passed without notice.
  translation_ja: 宗教に反する意見を罰で抑えることは、マルクス・アントニヌスの行いまで正当化する理由なしには弁護できない。そうと知っている宗教の自由の敵は、追いつめられると、時にこの帰結を引き受ける。ジョンソン博士に同調して、キリスト教を迫害した人々は正しかったと言う。迫害は真理が通るべき試練であり、いつも無事に通り抜ける。法の罰は有害な誤りに対しては時に有益な効果を上げるが、真理には結局力が及ばない、と言うのだ。これは宗教上の不寛容を擁護する議論の一つだが、あまりに異様なので、見過ごすわけにはいかない。
  translation_status: reviewed
- id: ol-02-016
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '50'
    printed_page_end: '51'
    source_sequence: 37
  source_text: A theory which maintains that truth may justifiably be persecuted because persecution cannot possibly do it any harm, cannot be charged with being intentionally hostile to the reception of new truths; but we cannot commend the generosity of its dealing with the persons to whom mankind are indebted for them. To discover to the world something which deeply concerns it, and of which it was previously ignorant; to prove to it that it had been mistaken on some vital point of temporal or spiritual interest, is as important a service as a human being can render to his fellow-creatures, and in certain cases, as in those of the early Christians and of the Reformers, those who think with Dr. Johnson believe it to have been the most precious gift which could be bestowed on mankind. That the authors of such splendid benefits should be requited by martyrdom; that their reward should be to be dealt with as the vilest of criminals, is not, upon this theory, a deplorable error and misfortune, for which humanity should mourn in sackcloth and ashes, but the normal and justifiable state of things. The propounder of a new truth, according to this doctrine, should stand, as stood, in the legislation of the Locrians, the proposer of a new law, with a halter round his neck, to be instantly tightened if the public assembly did not, on hearing his reasons, then and there adopt his proposition. People who defend this mode of treating benefactors, cannot be supposed to set much value on the benefit; and I believe this view of the subject is mostly confined to the sort of persons who think that new truths may have been desirable once, but that we have had enough of them now.
  translation_ja: 迫害しても真理には何の害も与えられないから、迫害してよい。こう主張する考えが、新しい真理を受け入れることにわざと敵対しているとは言えない。だが新しい真理を人類にもたらした人々への仕打ちを、寛大とは言いようがない。世界に深く関わるのに、世界がそれまで知らなかったことを明らかにすること。この世の大事にせよ精神の大事にせよ、極めて重要な点で世界が間違っていたと証明すること。これこそ、人が仲間に尽くせる最も大切な仕事にも等しい。初期のキリスト教徒や宗教改革者の場合などには、人類に贈りうる最も貴い贈り物であったと、ジョンソン博士に同調する人々も信じている。こうした目ざましい益を与えた人々が、殉教で報いられる。最も卑しい罪人として扱われることが、彼らの受ける報いである。しかもこの説によれば、これは人類が粗布をまとい灰をかぶって嘆くべき、痛ましい誤りや不幸ではなく、当然で正当なことなのである。この説で新しい真理を唱える人の立場は、ロクリス人の立法で新しい法律を提案する者の立場と同じだ。首に縄をかけられ、民会が理由を聞いたうえで即座に提案を採らなければ、その場で絞首にされる。恩人をこんなふうに扱うのを弁護する人々が、恩恵をそれほど重く見ているとは思えない。昔は新しい真理も望ましかったかもしれないが、今ではもう十分手に入れたと思う種類の人に、たいていは限られる見方だと私は思う。
  translation_status: reviewed
- id: ol-02-017
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '51'
    printed_page_end: '53'
    source_sequence: 38
  source_text: 'But, indeed, the dictum that truth always triumphs over persecution, is one of those pleasant falsehoods which men repeat after one another till they pass into commonplaces, but which all experience refutes. History teems with instances of truth put down by persecution. If not suppressed for ever, it may be thrown back for centuries. To speak only of religious opinions: the Reformation broke out at least twenty times before Luther, and was put down. Arnold of Brescia was put down. Fra Dolcino was put down. Savonarola was put down. The Albigeois were put down. The Vaudois were put down. The Lollards were put down. The Hussites were put down. Even after the era of Luther, wherever persecution was persisted in, it was successful. In Spain, Italy, Flanders, the Austrian empire, Protestantism was rooted out; and, most likely, would have been so in England, had Queen Mary lived, or Queen Elizabeth died. Persecution has always succeeded, save where the heretics were too strong a party to be effectually persecuted. No reasonable person can doubt that Christianity might have been extirpated in the Roman Empire. It spread, and became predominant, because the persecutions were only occasional, lasting but a short time, and separated by long intervals of almost undisturbed propagandism. It is a piece of idle sentimentality that truth, merely as truth, has any inherent power denied to error, of prevailing against the dungeon and the stake. Men are not more zealous for truth than they often are for error, and a sufficient application of legal or even of social penalties will generally succeed in stopping the propagation of either. The real advantage which truth has, consists in this, that when an opinion is true, it may be extinguished once, twice, or many times, but in the course of ages there will generally be found persons to rediscover it, until some one of its reappearances falls on a time when from favourable circumstances it escapes persecution until it has made such head as to withstand all subsequent attempts to suppress it.'
  translation_ja: そもそも、真理は迫害に必ず勝つという言い分は、人々が互いに受け売りして決まり文句にしてしまう、耳には心地よい嘘の一つであり、経験のすべてがそれに反している。迫害によって真理が押さえつけられた例を、歴史はいくらでも持っている。永久に押さえつけられないとしても、何世紀も遅らせられることはある。宗教上の意見だけを取っても、ルターより前に、宗教改革は少なくとも二十度起こり、そして押しつぶされた。ブレシアのアルナルドは押しつぶされた。修道士ドルチーノは押しつぶされた。サヴォナローラも、アルビジョワ派も、ヴァルド派も、ロラード派も、フス派も押しつぶされた。ルターの時代のあとでさえ、迫害が続けられたところでは、どこでもそれは成功した。スペイン、イタリア、フランドル、オーストリア帝国では、プロテスタントは根絶やしにされた。おそらくメアリー女王が生き長らえたか、エリザベス女王が亡くなっていたなら、イングランドでもそうなっただろう。迫害は、異端者があまりにも大きな力を持っていて、実効的に迫害できなかった場合を除けば、いつも成功してきた。キリスト教がローマ帝国で根絶やしにされることは可能だった。分別ある人でこれを疑える者はいない。それが広がり、ついには優勢になったのは、迫害が時おり、短期間しか行われず、迫害と迫害のあいだに長く、ほとんど妨げられずに広がる時期があったからだ。ただ真理であるというだけで、誤りにはない、牢獄や火刑をものともしない力が備わっているとは、感傷にすぎない。人は真理を支持するときでも、誤りを支持するときより熱心とはかぎらない。法による罰でも、あるいは社会による罰でも、十分に加えれば、たいていはどちらが広まることも止められる。真理が実際に有利なのは、ある意見が真実なら、一度、二度、あるいは何度消されようと、長い時代のうちにはたいてい再発見する人が現れることだ。そうしていつか現れ直したときに、たまたま事情に恵まれ、その後の抑圧の試みに耐えられるほど力を得るまで、迫害を免れることがある。
  translation_status: reviewed
- id: ol-02-018
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '53'
    printed_page_end: '56'
    source_sequence: 39
  source_text: 'It will be said, that we do not now put to death the introducers of new opinions: we are not like our fathers who slew the prophets, we even build sepulchres to them. It is true we no longer put heretics to death; and the amount of penal infliction which modern feeling would probably tolerate, even against the most obnoxious opinions, is not sufficient to extirpate them. But let us not flatter ourselves that we are yet free from the stain even of legal persecution. Penalties for opinion, or at least for its expression, still exist by law; and their enforcement is not, even in these times, so unexampled as to make it at all incredible that they may some day be revived in full force. In the year 1857, at the summer assizes of the county of Cornwall, an unfortunate man,[7] said to be of unexceptionable conduct in all relations of life, was sentenced to twenty-one months'' imprisonment, for uttering, and writing on a gate, some offensive words concerning Christianity. Within a month of the same time, at the Old Bailey, two persons, on two separate occasions,[8] were rejected as jurymen, and one of them grossly insulted by the judge and by one of the counsel, because they honestly declared that they had no theological belief; and a third, a foreigner,[9] for the same reason, was denied justice against a thief. This refusal of redress took place in virtue of the legal doctrine, that no person can be allowed to give evidence in a court of justice, who does not profess belief in a God (any god is sufficient) and in a future state; which is equivalent to declaring such persons to be outlaws, excluded from the protection of the tribunals; who may not only be robbed or assaulted with impunity, if no one but themselves, or persons of similar opinions, be present, but any one else may be robbed or assaulted with impunity, if the proof of the fact depends on their evidence. The assumption on which this is grounded, is that the oath is worthless, of a person who does not believe in a future state; a proposition which betokens much ignorance of history in those who assent to it (since it is historically true that a large proportion of infidels in all ages have been persons of distinguished integrity and honour); and would be maintained by no one who had the smallest conception how many of the persons in greatest repute with the world, both for virtues and for
    attainments, are well known, at least to their intimates, to be unbelievers. The rule, besides, is suicidal, and cuts away its own foundation. Under pretence that atheists must be liars, it admits the testimony of all atheists who are willing to lie, and rejects only those who brave the obloquy of publicly confessing a detested creed rather than affirm a falsehood. A rule thus self-convicted of absurdity so far as regards its professed purpose, can be kept in force only as a badge of hatred, a relic of persecution; a persecution, too, having the peculiarity, that the qualification for undergoing it, is the being clearly proved not to deserve it. The rule, and the theory it implies, are hardly less insulting to believers than to infidels. For if he who does not believe in a future state, necessarily lies, it follows that they who do believe are only prevented from lying, if prevented they are, by the fear of hell. We will not do the authors and abettors of the rule the injury of supposing, that the conception which they have formed of Christian virtue is drawn from their own consciousness.'
  translation_ja: 新しい意見を持ち込んだ人を今では殺しはしない、預言者を殺した先祖とは違い、私たちは預言者の墓を建てさえする、と言われるだろう。たしかに私たちはもう異端者を死刑にしない。今の人情が、おそらく、いちばん嫌われる意見に対しても許す限度の罰では、その意見を根絶やしにできない。だが、法による迫害の汚点さえ、もうなくなったなどと思い上がってはいけない。意見、あるいは少なくとも意見の表明を罰する法律は今でもある。その適用も、今の時代にさえ、それがいつか完全な力をもって復活することをとうてい信じられないほど、珍しいわけではない。一八五七年、コーンウォール州の夏の巡回裁判で、不運なある男性が、キリスト教について人の気に障る言葉を口にし、門に書いたことを理由に、二十一か月の禁錮を言い渡された。[7] 生活のあらゆる面で非の打ちどころのない行いをする人だったそうである。その前後一か月以内には、ロンドンの中央刑事裁判所で、二人の人が別々の機会に、神について何の信仰もないと正直に述べたため、陪審員になる資格はないとされ、一人は裁判官と弁護士の一人にひどい侮辱を受けた。[8] さらに三人目の外国人は、同じ理由から、盗みに対する裁判上の救済を拒まれた。[9] 救済を拒むのに使われた法理によれば、神の存在、どの神でも足りる、そして来世の存在を信じると公言しない者は、法廷で証言を許されない。これは、そのような人は法の外にあり、裁判所の保護から除かれると宣言するのに等しい。その人たち自身か同じ考えの人たちしか居合わせなければ、盗みや暴行にあっても犯人は罪を問われないばかりか、事実の立証がその人たちの証言にかかっている場合には、ほかの誰が盗みや暴行にあっても、犯人は罪を問われない。根拠となる前提は、来世を信じない人の宣誓には価値がないというものだ。これを認める人は、歴史をろくに知らないことを露呈する。どの時代でも、信仰を持たぬ人々の多くが、際立って誠実で名誉を重んじる人であったことは、歴史が示している。徳と学識の両方で世間の最高の評判を得ていても、少なくとも親しい人のあいだでは信仰がないとよく知られている人がどれほど多いか、わずかでも知る人なら、こんな意見は主張しない。それにこの規則は、自分の足もとを崩し、自分自身を滅ぼす。無神論者は嘘つきに違いないと称して、嘘をつく気のある無神論者の証言はすべて認め、偽りを述べるよりは憎まれている信条を公に打ち明けて非難を受けようという人だけを、退けるのだ。掲げる目的から見れば、自分で自分のばかばかしさを証明する規則だから、憎しみのしるし、迫害の名残としてしか維持できない。しかもこの迫害には奇妙な特徴があり、迫害を受ける資格は、それを受けるいわれがないと、はっきり証明されることなのだ。この規則と、そこに含まれる考えは、信仰のない人を侮辱するのとほとんど同じくらい、信仰のある人を侮辱する。来世を信じない者は必ず嘘をつくとすれば、信じる者も、嘘をつかずに済む場合には、地獄が怖いという理由だけで、そうすることになるからだ。この規則を作った人や後押しした人が、自分の心のうちをのぞいて、キリスト教の徳をこのように考えるに至ったとは、彼らの名誉のためにも、考えまい。
  translation_status: reviewed
- id: ol-02-019
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en

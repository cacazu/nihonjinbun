    precision: page
    printed_page: '73'
    printed_page_end: '75'
    source_sequence: 48
  source_text: 'It is illustrated in the experience of almost all ethical doctrines and religious creeds. They are all full of meaning and vitality to those who originate them, and to the direct disciples of the originators. Their meaning continues to be felt in undiminished strength, and is perhaps brought out into even fuller consciousness, so long as the struggle lasts to give the doctrine or creed an ascendency over other creeds. At last it either prevails, and becomes the general opinion, or its progress stops; it keeps possession of the ground it has gained, but ceases to spread further. When either of these results has become apparent, controversy on the subject flags, and gradually dies away. The doctrine has taken its place, if not as a received opinion, as one of the admitted sects or divisions of opinion: those who hold it have generally inherited, not adopted it; and conversion from one of these doctrines to another, being now an exceptional fact, occupies little place in the thoughts of their professors. Instead of being, as at first, constantly on the alert either to defend themselves against the world, or to bring the world over to them, they have subsided into acquiescence, and neither listen, when they can help it, to arguments against their creed, nor trouble dissentients (if there be such) with arguments in its favour. From this time may usually be dated the decline in the living power of the doctrine. We often hear the teachers of all creeds lamenting the difficulty of keeping up in the minds of believers a lively apprehension of the truth which they nominally recognise, so that it may penetrate the feelings, and acquire a real mastery over the conduct. No such difficulty is complained of while the creed is still fighting for its existence: even the weaker combatants then know and feel what they are fighting for, and the difference between it and other doctrines; and in that period of every creed''s existence, not a few persons may be found, who have realised its fundamental principles in all the forms of thought, have weighed and considered them in all their important bearings, and have experienced the full effect on the character, which belief in that creed ought to produce in a mind thoroughly imbued with it. But when it has come to be a hereditary creed, and to be received passively, not actively—when the mind is no longer compelled, in
    the same degree as at first, to exercise its vital powers on the questions which its belief presents to it, there is a progressive tendency to forget all of the belief except the formularies, or to give it a dull and torpid assent, as if accepting it on trust dispensed with the necessity of realising it in consciousness, or testing it by personal experience; until it almost ceases to connect itself at all with the inner life of the human being. Then are seen the cases, so frequent in this age of the world as almost to form the majority, in which the creed remains as it were outside the mind, encrusting and petrifying it against all other influences addressed to the higher parts of our nature; manifesting its power by not suffering any fresh and living conviction to get in, but itself doing nothing for the mind or heart, except standing sentinel over them to keep them vacant.'
  translation_ja: ほとんどすべての倫理の教説と宗教の信条の歩みに、この例が見られる。それを生み出した人々と、そのじかの弟子たちにとっては、どれも意味と生命にあふれている。教えや信条をほかのものより優勢にしようとする闘いが続くあいだは、その意味は少しも力を失わずに感じられ、おそらくいっそうはっきりと意識にのぼる。やがて勝って一般の意見になるか、広がりが止まる。後者なら、得た地歩は保っても、それ以上広がらない。どちらの結果でも、明らかになれば、その主題の論争は勢いを失い、次第に消えていく。教えは、通説とならなくても、公認の宗派や意見の分派の一つとして地位を得る。それを信じる人はたいてい自分で選んだのではなく、受け継いだだけである。一つの教えからほかの教えに移るのはもはや例外なので、信奉する人はそんなことをほとんど考えない。はじめのころのように、世間に対して身を守ったり、世間を味方につけたりするために絶えず身構える代わりに、落ち着いてそのままを受け入れる。できれば、自分たちの信条に反対する議論を聞こうともせず、異を唱える人がいたところで、信条を弁護する議論を聞かせて煩わせようともしない。ふつうはこの時から、教えの生きた力が衰えはじめる。どの信条の教師からもよく聞く嘆きは、信徒が名目上認めている真理を生き生きと理解させ、それが感情にしみ入り、実際の行動を支配するように保つのは難しい、ということである。信条がまだ生き残るために闘っているあいだは、そのような難しさを訴える者はいない。そのときには弱い闘士でさえ、何のために闘っているのか、それがほかの教えとどう違うかを知り、感じている。どの信条もこの段階では、その根本原理を思考のあらゆる形で自分のものとし、重要な関わりのすべてについてよく考え、吟味し、その信念のしみわたった心なら人格に及ぼされるはずの効果を、十分に体験した人が少なからず見つかる。だが、受け継ぐ信条になり、能動的にでなく受け身で受け入れられ、信念が突きつける問いに対して、心が最初ほどには生きた力を働かせなくてよくなると、次第に、信念のうち決まり文句以外のすべてを忘れるか、鈍く生気のない同意しか与えなくなる。信頼して受け入れれば、自ら意識し、自分の経験で試す必要はないかのように思い、人の内面の生活と、ついにはほとんど関係を持たなくなる。そこで、今の時代にあまりにも多く、ほとんど過半を占めるような例が現れる。信条が心の外にとどまるかのようになり、私たちの本性のより高い部分にはたらきかけるほかのあらゆる影響を防ぐ殻となり、心を石のようにしてしまう。新しく生きた確信を入れないことで力を示すが、心や感情のためには、そこを空っぽにしておく見張りをするほか、何一つしない。
  translation_status: reviewed
- id: ol-02-028
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '75'
    printed_page_end: '77'
    source_sequence: 49
  source_text: To what an extent doctrines intrinsically fitted to make the deepest impression upon the mind may remain in it as dead beliefs, without being ever realised in the imagination, the feelings, or the understanding, is exemplified by the manner in which the majority of believers hold the doctrines of Christianity. By Christianity I here mean what is accounted such by all churches and sects—the maxims and precepts contained in the New Testament. These are considered sacred, and accepted as laws, by all professing Christians. Yet it is scarcely too much to say that not one Christian in a thousand guides or tests his individual conduct by reference to those laws. The standard to which he does refer it, is the custom of his nation, his class, or his religious profession. He has thus, on the one hand, a collection of ethical maxims, which he believes to have been vouchsafed to him by infallible wisdom as rules for his government; and on the other, a set of every-day judgments and practices, which go a certain length with some of those maxims, not so great a length with others, stand in direct opposition to some, and are, on the whole, a compromise between the Christian creed and the interests and suggestions of worldly life. To the first of these standards he gives his homage; to the other his real allegiance. All Christians believe that the blessed are the poor and humble, and those who are ill-used by the world; that it is easier for a camel to pass through the eye of a needle than for a rich man to enter the kingdom of heaven; that they should judge not, lest they be judged; that they should swear not at all; that they should love their neighbour as themselves; that if one take their cloak, they should give him their coat also; that they should take no thought for the morrow; that if they would be perfect, they should sell all that they have and give it to the poor. They are not insincere when they say that they believe these things. They do believe them, as people believe what they have always heard lauded and never discussed. But in the sense of that living belief which regulates conduct, they believe these doctrines just up to the point to which it is usual to act upon them. The doctrines in their integrity are serviceable to pelt adversaries with; and it is understood that they are to be put forward (when possible) as the reasons for whatever people
    do that they think laudable. But any one who reminded them that the maxims require an infinity of things which they never even think of doing, would gain nothing but to be classed among those very unpopular characters who affect to be better than other people. The doctrines have no hold on ordinary believers—are not a power in their minds. They have a habitual respect for the sound of them, but no feeling which spreads from the words to the things signified, and forces the mind to take them in, and make them conform to the formula. Whenever conduct is concerned, they look round for Mr. A and B to direct them how far to go in obeying Christ.
  translation_ja: 本来は心に最も深い印象を与えるのにふさわしい教えが、想像力にも感情にも理解力にも現実のものとしてとらえられず、死んだ信念のままどれほど心にとどまりうるか。信徒の大半がキリスト教の教えを受け入れるあり方が、その例である。ここでキリスト教と呼ぶのは、どの教会もどの宗派もキリスト教と認めるもの、つまり新約聖書にある格言と戒めだ。自らキリスト教徒と称する者はみな、これらを神聖とみなし、法として受け入れる。それでも、その法を参照して自分の行動を導いたり、試したりしているのは、千人に一人もいないと言ってもほとんど言いすぎではない。実際に行動を照らし合わせる規範は、自分の国民、階層、宗派の慣習である。だから一方には、誤りを知らない知恵が、自分を治める規則として授けたと信じている道徳上の格言がある。もう一方には、日常の判断と慣行があり、そのいくつかは格言の一部にある程度沿っていても、ほかにはそれほど沿わず、いくつかには正面から反している。全体としては、キリスト教の信条と世間の生活上の利害や要求との折り合いである。第一の規範には敬意を払うが、実際に従うのはもう一方の規範だ。キリスト教徒はみな、貧しい人、へりくだる人、世間からひどい扱いを受ける人は幸いだと信じる。金持ちが天の国に入るよりラクダが針の穴を通るほうがたやすい、裁かれないよう人を裁いてはならない、何事にも誓いを立ててはならない、自分を愛するように隣人を愛しなさい、外套を取る者には上着まで渡しなさい、明日のことを思いわずらってはならない、完全になりたいなら持ち物をすべて売り、貧しい人に与えなさい、という教えを信じる。それを信じていると言うとき、彼らは不誠実なのではない。いつも称賛され、論じられるのを聞いたことのない事柄を信じる、あの信じ方で信じているのである。だが行いを導く生きた信念という意味では、この教えに従う人がふつうどこまで実行するか、その程度までしか信じていない。教えをそっくり取り出せば、相手を打つのには便利だ。人が褒めるに値すると思うことなら何をしたときでも、できれば理由としてこれらの教えを掲げるのがよいとされている。ところが、この格言では、ふだんしようとさえ思わない無数のことが求められているのだと気づかせた人は、ひどく嫌われる、他人より立派ぶる者の仲間にされるだけである。教えはふつうの信徒をとらえず、その心で力を持たない。響きには習慣から敬意を払ってはいても、言葉からその指すものへと広がり、心にその意味を受け入れさせ、教えと一致させる感情には結びつかない。いざ行動となれば、キリストにどこまで従うのかを、かの何某たちに指図してもらおうと、まわりを見回すのだ。
  translation_status: reviewed
- id: ol-02-029
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '77'
    printed_page_end: '79'
    source_sequence: 50
  source_text: Now we may be well assured that the case was not thus, but far otherwise, with the early Christians. Had it been thus, Christianity never would have expanded from an obscure sect of the despised Hebrews into the religion of the Roman empire. When their enemies said, "See how these Christians love one another" (a remark not likely to be made by anybody now), they assuredly had a much livelier feeling of the meaning of their creed than they have ever had since. And to this cause, probably, it is chiefly owing that Christianity now makes so little progress in extending its domain, and after eighteen centuries, is still nearly confined to Europeans and the descendants of Europeans. Even with the strictly religious, who are much in earnest about their doctrines, and attach a greater amount of meaning to many of them than people in general, it commonly happens that the part which is thus comparatively active in their minds is that which was made by Calvin, or Knox, or some such person much nearer in character to themselves. The sayings of Christ coexist passively in their minds, producing hardly any effect beyond what is caused by mere listening to words so amiable and bland. There are many reasons, doubtless, why doctrines which are the badge of a sect retain more of their vitality than those common to all recognised sects, and why more pains are taken by teachers to keep their meaning alive; but one reason certainly is, that the peculiar doctrines are more questioned, and have to be oftener defended against open gainsayers. Both teachers and learners go to sleep at their post, as soon as there is no enemy in the field.
  translation_ja: 初期のキリスト教徒の場合はそうではなく、まったく違っていたと確信してよい。もし同じであったなら、侮られたヘブライ人の無名の一派から、ローマ帝国の宗教にまで広がることはなかった。敵が「あのキリスト教徒たちが互いに愛し合っているさまを見よ」と言っていたころ、今では誰も言いそうにないことだが、初期の信徒はその信条の意味を、その後のどの時代よりも生き生きと感じていたことは確かである。おそらく主にそのために、今のキリスト教はその領域をほとんど広げられず、十八世紀が過ぎても、ほぼヨーロッパ人とその子孫に限られている。信仰に厳格で、教えのことを真剣に考え、その多くに世間一般よりも豊かな意味を見いだす人にさえ、心の中で比較的活発に働く部分は、たいてい、カルヴァンやノックスなど、自分とずっと性格の近い人がつくった部分である。キリストの言葉は、その人の心にただ一緒にあるだけで、そのように穏やかで温和な言葉を聞くこと自体のほかには、ほとんど何の作用ももたらさない。宗派のしるしとなる教えのほうが、公認の諸宗派に共通する教えより、生命をよく保っているのには、また教師がその意味を生かしておくために多くの力を尽くすのには、いくつも理由があるに違いない。だが、その宗派独特の教えのほうがよく疑問を向けられ、公に異議を唱える人にしばしば弁護しなければならないことは、確かに一つの理由である。戦場に敵がいなくなれば、教える者も学ぶ者も、その持ち場で眠りこんでしまう。
  translation_status: reviewed
- id: ol-02-030
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '79'
    printed_page_end: '80'
    source_sequence: 51
  source_text: 'The same thing holds true, generally speaking, of all traditional doctrines—those of prudence and knowledge of life, as well as of morals or religion. All languages and literatures are full of general observations on life, both as to what it is, and how to conduct oneself in it; observations which everybody knows, which everybody repeats, or hears with acquiescence, which are received as truisms, yet of which most people first truly learn the meaning, when experience, generally of a painful kind, has made it a reality to them. How often, when smarting under some unforeseen misfortune or disappointment, does a person call to mind some proverb or common saying, familiar to him all his life, the meaning of which, if he had ever before felt it as he does now, would have saved him from the calamity. There are indeed reasons for this, other than the absence of discussion: there are many truths of which the full meaning cannot be realised, until personal experience has brought it home. But much more of the meaning even of these would have been understood, and what was understood would have been far more deeply impressed on the mind, if the man had been accustomed to hear it argued pro and con by people who did understand it. The fatal tendency of mankind to leave off thinking about a thing when it is no longer doubtful, is the cause of half their errors. A contemporary author has well spoken of "the deep slumber of a decided opinion."'
  translation_ja: 一般に、伝統で受け継いだ教えならどれにも、同じことが当てはまる。道徳や宗教の教えばかりでなく、分別や世の中を知ることについての教えもそうである。どんな言葉や文学にも、人生とは何か、どう生きるべきかについて、一般的な見方があふれている。誰もが知っていて、誰もが繰り返し、あるいは異議なく聞き、あたりまえと認める見方であるのに、たいていの人がその意味を初めて本当に知るのは、概してつらい経験がそれを現実のものにしたときである。予期せぬ不幸や落胆に心を痛めながら、一生聞き慣れてきたことわざや決まり文句を思い出すことが、いかに多いだろう。今感じるように、以前に一度でもその意味が感じられていたなら、その災難は避けられたはずである。確かにこうなる理由は、議論がないことのほかにもある。自分の経験で思い知らされるまで、意味が完全には分からない真理は多い。だがそういう真理でも、その意味が分かっている人々が賛否の両面から論じるのを聞き慣れていたなら、ずっと多くの意味をつかみ、つかんだものも、はるかに深く心に刻んでいたはずだ。疑いがなくなるとそのことを考えるのをやめる、人のこの致命的な傾向が、人の誤りの半分を生む。同時代のある著述家が「決着のついた意見の深い眠り」と言ったのは、よく言ったものだ。
  translation_status: reviewed
- id: ol-02-031
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '80'
    printed_page_end: '80'
    source_sequence: 52
  source_text: 'But what! (it may be asked) Is the absence of unanimity an indispensable condition of true knowledge? Is it necessary that some part of mankind should persist in error, to enable any to realise the truth? Does a belief cease to be real and vital as soon as it is generally received—and is a proposition never thoroughly understood and felt unless some doubt of it remains? As soon as mankind have unanimously accepted a truth, does the truth perish within them? The highest aim and best result of improved intelligence, it has hitherto been thought, is to unite mankind more and more in the acknowledgment of all important truths: and does the intelligence only last as long as it has not achieved its object? Do the fruits of conquest perish by the very completeness of the victory?'
  translation_ja: 待ってほしい、と問う人もいよう。本当に知るためには、意見が一致しないことがどうしても必要なのか。誰かが真理を自分のものにするには、人類の一部が誤りに固執しなければならないのか。広く受け入れられたとたん、信念は本物でなくなり、命を失うのか。疑いが多少でも残っていなければ、ある命題を十分に理解し、感じることは決してできないのか。人類が全員で真理を受け入れたとたん、その真理は人々の中で死んでしまうのか。これまでは、知性が進歩する最高の目標、最善の結果とは、重要な真理をすべて認める点で、人類がますます一つになることだと思われてきた。では知性は、その目標を果たすまでしか続かないのか。勝利の成果は、勝利が完全になったからこそ、失われるのか。
  translation_status: reviewed
- id: ol-02-032
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '81'
    printed_page_end: '82'
    source_sequence: 53
  source_text: 'I affirm no such thing. As mankind improve, the number of doctrines which are no longer disputed or doubted will be constantly on the increase: and the well-being of mankind may almost be measured by the number and gravity of the truths which have reached the point of being uncontested. The cessation, on one question after another, of serious controversy, is one of the necessary incidents of the consolidation of opinion; a consolidation as salutary in the case of true opinions, as it is dangerous and noxious when the opinions are erroneous. But though this gradual narrowing of the bounds of diversity of opinion is necessary in both senses of the term, being at once inevitable and indispensable, we are not therefore obliged to conclude that all its consequences must be beneficial. The loss of so important an aid to the intelligent and living apprehension of a truth, as is afforded by the necessity of explaining it to, or defending it against, opponents, though not sufficient to outweigh, is no trifling drawback from, the benefit of its universal recognition. Where this advantage can no longer be had, I confess I should like to see the teachers of mankind endeavouring to provide a substitute for it; some contrivance for making the difficulties of the question as present to the learner''s consciousness, as if they were pressed upon him by a dissentient champion, eager for his conversion.'
  translation_ja: 私はそのようなことを何一つ主張していない。人類が進歩すれば、論争にも疑いにもさらされなくなった教えの数は、絶えず増えるだろう。もはや異議を申し立てられなくなった真理がいくつあり、どれほど重要かで、人類の幸福をほぼ測れるほどだ。次々に問題について真剣な論争が終わるのは、意見が定まっていくときに必ずともなうことである。意見が正しい場合に定まるのは、誤っている場合に定まることが危険で有害であるのと同じほど、有益で健全である。このように多様な意見が存在できる範囲が徐々に狭まることは、避けられないし、欠かすこともできない。この二つの意味で必然だが、だからといって、結果がみな有益と結論する必要はない。反対する人に説明し、また反論に抗して擁護しなければならないときに得られる、真理を知的に、生き生きとつかむための大きな助けが失われる。それは人類全体に認められるという利益を上回りはしないが、その利益をかなり損なう。もはやこの助けを得られないところでは、人々を教える立場にある者に、代わりを用意しようとしてほしいと私は思う。どうにかして、改宗させようと熱心にせまってくる反対者がいるときのように、その問題の難点を、学ぶ人の意識にはっきりと浮かび上がらせてほしい。
  translation_status: reviewed
- id: ol-02-033
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '82'
    printed_page_end: '84'
    source_sequence: 54
  source_text: 'But instead of seeking contrivances for this purpose, they have lost those they formerly had. The Socratic dialectics, so magnificently exemplified in the dialogues of Plato, were a contrivance of this description. They were essentially a negative discussion of the great questions of philosophy and life, directed with consummate skill to the purpose of convincing any one who had merely adopted the commonplaces of received opinion, that he did not understand the subject—that he as yet attached no definite meaning to the doctrines he professed; in order that, becoming aware of his ignorance, he might be put in the way to attain a stable belief, resting on a clear apprehension both of the meaning of doctrines and of their evidence. The school disputations of the middle ages had a somewhat similar object. They were intended to make sure that the pupil understood his own opinion, and (by necessary correlation) the opinion opposed to it, and could enforce the grounds of the one and confute those of the other. These last-mentioned contests had indeed the incurable defect, that the premises appealed to were taken from authority, not from reason; and, as a discipline to the mind, they were in every respect inferior to the powerful dialectics which formed the intellects of the "Socratici viri": but the modern mind owes far more to both than it is generally willing to admit, and the present modes of education contain nothing which in the smallest degree supplies the place either of the one or of the other. A person who derives all his instruction from teachers or books, even if he escape the besetting temptation of contenting himself with cram, is under no compulsion to hear both sides; accordingly it is far from a frequent accomplishment, even among thinkers, to know both sides; and the weakest part of what everybody says in defence of his opinion, is what he intends as a reply to antagonists. It is the fashion of the present time to disparage negative logic—that which points out weaknesses in theory or errors in practice, without establishing positive truths. Such negative criticism would indeed be poor enough as an ultimate result; but as a means to attaining any positive knowledge or conviction worthy the name, it cannot be valued too highly; and until people are again systematically trained to it, there will be few great thinkers, and a low general average
    of intellect, in any but the mathematical and physical departments of speculation. On any other subject no one''s opinions deserve the name of knowledge, except so far as he has either had forced upon him by others, or gone through of himself, the same mental process which would have been required of him in carrying on an active controversy with opponents. That, therefore, which when absent, it is so indispensable, but so difficult, to create, how worse than absurd is it to forego, when spontaneously offering itself! If there are any persons who contest a received opinion, or who will do so if law or opinion will let them, let us thank them for it, open our minds to listen to them, and rejoice that there is some one to do for us what we otherwise ought, if we have any regard for either the certainty or the vitality of our convictions, to do with much greater labour for ourselves.'
  translation_ja: だがそのための仕掛けを探すどころか、彼らは以前持っていた仕掛けを失った。プラトンの対話篇に見事な例があるソクラテスの問答法は、そのような仕掛けだった。本質的には、哲学と人生の大問題を批判的に議論する方法である。ただ通説の決まり文句を受け入れただけの人に、その主題を分かっていない、自分が唱える教えには、まだこれといった意味を結びつけていない、と納得させることに、巧みの限りを尽くした。それは、自分の無知に気づけば、教えの意味とその証拠の両方をはっきりと理解したうえで、確かな信念を得る道に進めるからだ。中世の学校で行われた討論にも、いくらか似た目的があった。学ぶ者が自分の意見を理解し、したがって当然、それに反対する意見も理解し、一方の理由を力強く述べ、他方の理由を論破できることを確かめようとした。中世の討論にはたしかに、根拠にした前提を理性からでなく権威から取るという、治しようのない欠点があった。心を鍛える方法としても、「ソクラテスの一門」の知性を形づくった力強い問答法には、どの点でも及ばなかった。それでも近代の精神は、ふつう認めたがるよりはるかに多くのものを両者に負っている。今日の教育の方法には、どちらの代わりにも、少しでもなれるものが皆無である。教師や本から教育のすべてを得る人は、詰め込みで満足しようというつきまとう誘惑を逃れたとしても、双方の話を聞かなければならないわけではない。だから両方を知るという力は、思想家のあいだでさえ、まれにしか見ない。誰もが自分の意見を守るために言うことのうち、最も弱いのは、相手への返答にするつもりの部分である。今日の流行は、積極的な真理を打ち立てはしないが、理論の弱いところや実践での誤りを指摘する、否定の論法を軽く見ることだ。そのような批判しか最終的な結果がないなら、確かに貧しい。だが、知識や確信の名に値する積極的な知識や確信に達する手段としては、いくら高く評価してもしすぎることはない。人が再び系統立ててこれを訓練されるようになるまでは、数学や物理の分野を除けば、偉大な思想家はほとんど現れず、知性の平均も低いままだろう。ほかの主題では、反対者と活発に論争するなら求められたはずの心の働きを、他人に強いられてか自分からか、どこまで実際に経てきたかによってしか、誰の意見も知識の名に値しない。なければどうしてもつくる必要があるが、つくり出すのは難しい。それなのに自然と得られるときに見捨てるのは、ばかげているどころではない。通説に異を唱える人がいるなら、あるいは法や世論が許せば唱える人がいるなら、感謝して心を開き、その話を聞こう。そして喜ぼう。自分の確信が確かであることか、生きていることか、どちらかでも大切だと思うなら、さもなければもっとずっと苦労して、自分でやるべきことを、してくれる人がいるのだから。
  translation_status: reviewed

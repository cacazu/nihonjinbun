  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '61'
    printed_page_end: '64'
    source_sequence: 41
  source_text: Those in whose eyes this reticence on the part of heretics is no evil, should consider in the first place, that in consequence of it there is never any fair and thorough discussion of heretical opinions; and that such of them as could not stand such a discussion, though they may be prevented from spreading, do not disappear. But it is not the minds of heretics that are deteriorated most, by the ban placed on all inquiry which does not end in the orthodox conclusions. The greatest harm done is to those who are not heretics, and whose whole mental development is cramped, and their reason cowed, by the fear of heresy. Who can compute what the world loses in the multitude of promising intellects combined with timid characters, who dare not follow out any bold, vigorous, independent train of thought, lest it should land them in something which would admit of being considered irreligious or immoral? Among them we may occasionally see some man of deep conscientiousness, and subtle and refined understanding, who spends a life in sophisticating with an intellect which he cannot silence, and exhausts the resources of ingenuity in attempting to reconcile the promptings of his conscience and reason with orthodoxy, which yet he does not, perhaps, to the end succeed in doing. No one can be a great thinker who does not recognise, that as a thinker it is his first duty to follow his intellect to whatever conclusions it may lead. Truth gains more even by the errors of one who, with due study and preparation, thinks for himself, than by the true opinions of those who only hold them because they do not suffer themselves to think. Not that it is solely, or chiefly, to form great thinkers, that freedom of thinking is required. On the contrary, it is as much, and even more indispensable, to enable average human beings to attain the mental stature which they are capable of. There have been, and may again be, great individual thinkers, in a general atmosphere of mental slavery. But there never has been, nor ever will be, in that atmosphere, an intellectually active people. Where any people has made a temporary approach to such a character, it has been because the dread of heterodox speculation was for a time suspended. Where there is a tacit convention that principles are not to be disputed; where the discussion of the greatest questions which can occupy humanity is considered
    to be closed, we cannot hope to find that generally high scale of mental activity which has made some periods of history so remarkable. Never when controversy avoided the subjects which are large and important enough to kindle enthusiasm, was the mind of a people stirred up from its foundations, and the impulse given which raised even persons of the most ordinary intellect to something of the dignity of thinking beings. Of such we have had an example in the condition of Europe during the times immediately following the Reformation; another, though limited to the Continent and to a more cultivated class, in the speculative movement of the latter half of the eighteenth century; and a third, of still briefer duration, in the intellectual fermentation of Germany during the Goethian and Fichtean period. These periods differed widely in the particular opinions which they developed; but were alike in this, that during all three the yoke of authority was broken. In each, an old mental despotism had been thrown off, and no new one had yet taken its place. The impulse given at these three periods has made Europe what it now is. Every single improvement which has taken place either in the human mind or in institutions, may be traced distinctly to one or other of them. Appearances have for some time indicated that all three impulses are well-nigh spent; and we can expect no fresh start, until we again assert our mental freedom.
  translation_ja: このように異端者が口をつぐむことを害だと思わない人には、まず考えてもらいたい。その結果、異端の意見については公正で徹底した議論が一度もなされない。そうした議論に耐えられないような意見も、広まるのは防げても、消えることはない。だが、正統的な結論に終わらない探究すべてが禁じられて、一番ひどく損なわれるのは、異端者の心ではない。最大の害を受けるのは、異端者でない人々である。異端を恐れるあまり、精神の発達のすべてを押さえ込まれ、理性が萎縮してしまう人々だ。明敏で将来性がありながら気が弱く、大胆で力のある独立した考えの筋道をたどれば、宗教や道徳に背くと見られかねないところに行き着くのが怖くて、突きつめる勇気がない。そういう人々が無数にいるために世界が失うものを、誰に測れるだろう。その中には、ときに、良心が深く、細やかで研ぎ澄まされた理解力の持ち主がいる。黙らせられない自分の知性を詭弁でなだめることに生涯を費やし、良心と理性の促すところを正統の教えに折り合わせようと、知恵を絞り切って、しかもおそらく、最後まで折り合わせられない人である。思想家として第一の義務は、自分の知性がどんな結論へ導こうとも、それに従うことだと認めなければ、偉大な思想家にはなれない。しかるべき勉強と用意のうえで自分で考える人なら、たとえ誤っても、真理には、自分で考えるのを許さないがために正しい意見を持つ人より、ずっと役に立つ。とはいえ、思想の自由が必要なのは、ただ偉大な思想家を育てるためでも、おもにそのためでもない。反対に、ふつうの人が、自分に備わる能力に見合った精神の高さに達するには、それと同じほど、いやそれ以上に欠かせない。精神の奴隷状態が広がるなかでも、個人として偉大な思想家はこれまでにいたし、今後もいるかもしれない。しかしそういう空気のなかで、国民全体が知的に活発になったことは、これまでもなく、これからもない。ある国民が一時そこに近づいたとしたら、それは異端の思想に対する恐れが、束の間なくなったからだ。原理に異を唱えてはいけないという暗黙の取り決めがあり、人類が考えうる最も大きな問題について議論は終わったとされるところで、歴史のある時代を際立たせたような、精神の活動が全般に高まる状態を期待することはできない。論争が、熱意をかきたてるほど大きく重要な主題を避けるところで、国民の心が根底から揺り動かされ、ごくありふれた知性の人までが考える存在としての尊厳を多少とも持つに至るような勢いが与えられたことはない。そのような例が、宗教改革直後のヨーロッパにあった。もう一つは、ヨーロッパ大陸と、より教養のある階層に限られたが、十八世紀後半の思想の運動であった。三番目の例は、さらに短く、ゲーテとフィヒテの時代のドイツの知的な沸き立ちだった。生み出した個々の意見は大きく違うが、三つの時代とも、権威の軛が折られた点で同じである。古い精神の専制が脱ぎ捨てられ、どれにも新しい専制がまだ取って代わっていなかった。この三つの時代に与えられた勢いが、今のヨーロッパをつくった。人間の心においても制度においても、成し遂げられた改善は一つ残らず、どれかの時代にはっきりとたどっていける。ところがしばらく前から、三つの勢いはどれもほぼ尽きたと見える。私たちが再び精神の自由を主張するまで、新たな出発は期待できない。

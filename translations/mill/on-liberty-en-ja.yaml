    precision: page
    printed_page: '140'
    printed_page_end: '140'
    source_sequence: 96
  source_text: What, then, is the rightful limit to the sovereignty of the individual over himself? Where does the authority of society begin? How much of human life should be assigned to individuality, and how much to society?
  translation_ja: では、個人が自分自身に対して持つ主権には、どこまでが正当な限界なのか。どこから社会の権限が始まるのか。人の一生のうち、どれだけを個性に、どれだけを社会にゆだねるべきなのか。
  translation_status: reviewed
- id: ol-04-002
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '140'
    printed_page_end: '140'
    source_sequence: 97
  source_text: Each will receive its proper share, if each has that which more particularly concerns it. To individuality should belong the part of life in which it is chiefly the individual that is interested; to society, the part which chiefly interests society.
  translation_ja: それぞれに、よりじかに関わるものを持たせれば、双方がふさわしい分を受け取る。人生のうち、おもに当人が利害を持つ部分は個性に、おもに社会が利害を持つ部分は社会に属すべきである。
  translation_status: reviewed
- id: ol-04-003
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '140'
    printed_page_end: '142'
    source_sequence: 98
  source_text: Though society is not founded on a contract, and though no good purpose is answered by inventing a contract in order to deduce social obligations from it, every one who receives the protection of society owes a return for the benefit, and the fact of living in society renders it indispensable that each should be bound to observe a certain line of conduct towards the rest. This conduct consists, first, in not injuring the interests of one another; or rather certain interests which, either by express legal provision or by tacit understanding, ought to be considered as rights; and secondly, in each person's bearing his share (to be fixed on some equitable principle) of the labours and sacrifices incurred for defending the society or its members from injury and molestation. These conditions society is justified in enforcing, at all costs to those who endeavour to withhold fulfilment. Nor is this all that society may do. The acts of an individual may be hurtful to others, or wanting in due consideration for their welfare, without going the length of violating any of their constituted rights. The offender may then be justly punished by opinion though not by law. As soon as any part of a person's conduct affects prejudicially the interests of others, society has jurisdiction over it, and the question whether the general welfare will or will not be promoted by interfering with it, becomes open to discussion. But there is no room for entertaining any such question when a person's conduct affects the interests of no persons besides himself, or needs not affect them unless they like (all the persons concerned being of full age, and the ordinary amount of understanding). In all such cases there should be perfect freedom, legal and social, to do the action and stand the consequences.
  translation_ja: 社会は契約を土台にしていないし、契約を作り上げてそこから社会の義務を引き出しても、よいことは何もない。とはいえ、社会の保護を受ける者は誰もが、その恩に報いる責めを負う。そして社会の中に住むという事実のため、一人ひとりがほかの人に対し、ある一線を守って行動しなければならない。これには第一に、互いの利益、より正確に言えば、明文の法律か暗黙の了解によって権利と見なすべき一定の利益を害さないことがある。第二に、社会またはその一員を危害や妨害から守るためにかかる仕事と犠牲について、公平な何らかの原理で定めた、それぞれの取り分を引き受けることがある。果たさずに済まそうとする者にどんな負担がかかろうと、これらの条件を社会が強いるのは正当である。社会がしてよいのは、それだけではない。個人の行為が、他人の確立した権利を一つでも侵すまでに至らなくても、他人に害を与えたり、その人の幸福について相応の配慮を欠いたりすることがある。そのとき、法ではなく世論がとがめることは正当であろう。ある人の行動の一部分が他人の利益を害したとたん、その行動は社会の管轄に入り、介入することが皆の幸福を増すかどうかを議論できるようになる。だが、本人以外の誰の利害にもその行動が影響せず、またはほかの人が望まないならその人たちに影響する必要がないなら、そのような問題を考える余地はない。関係者がみな成人で、ふつうの理解力を持つことが前提だ。そういう場合にはいずれも、行い、その結果を引き受ける完全な自由が、法律の面でも社会の面でもなくてはならない。
  translation_status: reviewed
- id: ol-04-004
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '142'
    printed_page_end: '144'
    source_sequence: 99
  source_text: 'It would be a great misunderstanding of this doctrine, to suppose that it is one of selfish indifference, which pretends that human beings have no business with each other''s conduct in life, and that they should not concern themselves about the well-doing or well-being of one another, unless their own interest is involved. Instead of any diminution, there is need of a great increase of disinterested exertion to promote the good of others. But disinterested benevolence can find other instruments to persuade people to their good, than whips and scourges, either of the literal or the metaphorical sort. I am the last person to undervalue the self-regarding virtues; they are only second in importance, if even second, to the social. It is equally the business of education to cultivate both. But even education works by conviction and persuasion as well as by compulsion, and it is by the former only that, when the period of education is past, the self-regarding virtues should be inculcated. Human beings owe to each other help to distinguish the better from the worse, and encouragement to choose the former and avoid the latter. They should be for ever stimulating each other to increased exercise of their higher faculties, and increased direction of their feelings and aims towards wise instead of foolish, elevating instead of degrading, objects and contemplations. But neither one person, nor any number of persons, is warranted in saying to another human creature of ripe years, that he shall not do with his life for his own benefit what he chooses to do with it. He is the person most interested in his own well-being: the interest which any other person, except in cases of strong personal attachment, can have in it, is trifling, compared with that which he himself has; the interest which society has in him individually (except as to his conduct to others) is fractional, and altogether indirect: while, with respect to his own feelings and circumstances, the most ordinary man or woman has means of knowledge immeasurably surpassing those that can be possessed by any one else. The interference of society to overrule his judgment and purposes in what only regards himself, must be grounded on general presumptions; which may be altogether wrong, and even if right, are as likely as not to be misapplied to individual cases, by persons no better acquainted with the
    circumstances of such cases than those are who look at them merely from without. In this department, therefore, of human affairs, Individuality has its proper field of action. In the conduct of human beings towards one another, it is necessary that general rules should for the most part be observed, in order that people may know what they have to expect; but in each person''s own concerns, his individual spontaneity is entitled to free exercise. Considerations to aid his judgment, exhortations to strengthen his will, may be offered to him, even obtruded on him, by others; but he himself is the final judge. All errors which he is likely to commit against advice and warning, are far outweighed by the evil of allowing others to constrain him to what they deem his good.'
  translation_ja: この教えを、人の行動には互いに何の関わりもなく、自分の利害が関係しなければ、人がよく行っているか、幸せに暮らしているかを気にかけるべきではないとする、利己的な無関心の教えと考えるなら、大きな誤解である。私心なく他人のために力を尽くすことは、減らすどころか、大いに増やさなくてはならない。ただし私心のない善意は、人が自分のためになることをするように説得するのに、文字どおりの鞭にも、比喩としての鞭にも頼らず、ほかの道具を見つけられる。自分自身に関する徳を軽く見る気は、私にはまったくない。他人に関する徳に次いで重要であり、次ぐと言えるかさえ分からない。両方を育てるのが、等しく教育の仕事である。しかし教育でさえ、強制だけでなく、納得させ、説得することで働く。教育の時期が過ぎたあと、自分自身に関する徳を教えるのに使ってよいのは後者だけだ。何がよりよく、何がより悪いかを見分ける手助けをし、前者を選び、後者を避けるよう励ますことは、人が互いに負う務めである。人は、互いに、より高い能力をもっと使い、愚かな事物でなく賢明な事物へ、卑しくするものでなく高めるものへと、感情と目標、物思いをもっと向けるよう、絶えず働きかけるべきである。だが一人であれ、どれほど大勢であれ、十分に成熟した人に向かって、自分の益のためでも、選んだように自分の人生を用いてはならないと言ってよいわけではない。本人の幸福に最も大きな利害を持つのは、当人である。格別に強い愛着がないかぎり、ほかの誰がその幸福に持ちうる関心も、本人に比べれば、わずかなものだ。社会が個人としてのその人に持つ利害は、他人に対してどう行動するかを別にすれば、ごく一部に限られ、まったく間接的である。一方、自分自身の気持ちと境遇については、どんな平凡な男女にも、ほかの誰が持ちうるより、はるかによく知る手立てがある。自分だけに関わる事柄で本人の判断や意図をくつがえすために社会が介入するなら、一般的な推測を根拠にするほかない。それは全体として誤っているかもしれず、正しくても、まるで外から眺めている人以上に個別の事情をよく知っているわけではない者に当てはめさせれば、正しく当てはまるのと同じくらい、はずれるおそれがある。だから、人の営みのこの領域こそ、個性が働くのにふさわしい。人が互いにどう振る舞うかについては、何を期待すればよいか分かるように、大半の場合、一般的な規則を守る必要がある。だが一人ひとりが自分だけに関わることでは、自発性を自由に働かせてよい。判断の助けとなる考えや、意志を強める励ましを、他人が持ちかけてもよく、ときには望まれなくても差し出してよい。だが最終的に判断するのは当人である。助言や警告を聞かずにどんな間違いを犯しかねないにせよ、本人の益になると他人の判断したことを強いるのを許す害のほうが、はるかに大きい。
  translation_status: reviewed
- id: ol-04-005
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '144'
    printed_page_end: '146'
    source_sequence: 100
  source_text: 'I do not mean that the feelings with which a person is regarded by others, ought not to be in any way affected by his self-regarding qualities or deficiencies. This is neither possible nor desirable. If he is eminent in any of the qualities which conduce to his own good, he is, so far, a proper object of admiration. He is so much the nearer to the ideal perfection of human nature. If he is grossly deficient in those qualities, a sentiment the opposite of admiration will follow. There is a degree of folly, and a degree of what may be called (though the phrase is not unobjectionable) lowness or depravation of taste, which, though it cannot justify doing harm to the person who manifests it, renders him necessarily and properly a subject of distaste, or, in extreme cases, even of contempt: a person could not have the opposite qualities in due strength without entertaining these feelings. Though doing no wrong to any one, a person may so act as to compel us to judge him, and feel to him, as a fool, or as a being of an inferior order: and since this judgment and feeling are a fact which he would prefer to avoid, it is doing him a service to warn him of it beforehand, as of any other disagreeable consequence to which he exposes himself. It would be well, indeed, if this good office were much more freely rendered than the common notions of politeness at present permit, and if one person could honestly point out to another that he thinks him in fault, without being considered unmannerly or presuming. We have a right, also, in various ways, to act upon our unfavourable opinion of any one, not to the oppression of his individuality, but in the exercise of ours. We are not bound, for example, to seek his society; we have a right to avoid it (though not to parade the avoidance), for we have a right to choose the society most acceptable to us. We have a right, and it may be our duty, to caution others against him, if we think his example or conversation likely to have a pernicious effect on those with whom he associates. We may give others a preference over him in optional good offices, except those which tend to his improvement. In these various modes a person may suffer very severe penalties at the hands of others, for faults which directly concern only himself; but he suffers these penalties only in so far as they are the natural, and, as it were, the spontaneous
    consequences of the faults themselves, not because they are purposely inflicted on him for the sake of punishment. A person who shows rashness, obstinacy, self-conceit—who cannot live within moderate means—who cannot restrain himself from hurtful indulgences—who pursues animal pleasures at the expense of those of feeling and intellect—must expect to be lowered in the opinion of others, and to have a less share of their favourable sentiments; but of this he has no right to complain, unless he has merited their favour by special excellence in his social relations, and has thus established a title to their good offices, which is not affected by his demerits towards himself.'
  translation_ja: 自分自身に関する長所や欠点が、人にどう思われるかに、まったく影響してはならないと言うのではない。それは不可能であり、望ましくもない。自分の益につながる何かの性質にすぐれている人は、それだけの理由で、当然敬意に値する。人間性の理想の完成にそれだけ近いからだ。その性質がひどく欠けていれば、敬意とは反対の感情を呼び起こす。ある程度までいった愚かさや、言葉に異論はあろうが、趣味の下品さ、堕落と呼べるものは、そういう人を害してよい理由にはならないが、当然、また正当に嫌悪を覚えさせる。極端な場合は、軽蔑さえ覚えさせる。反対の性質を十分に持つ人なら、このように感じないわけにはいかない。誰にも不正を働いていなくても、愚か者だ、または人として劣っている、と私たちに判断させ、そう感じさせざるを得ない行いをする人がいる。そのような判断や感情を向けられることは、本人もできれば避けたいことだから、それ以外の不快な結果を自分で招くおそれがあるときと同じく、あらかじめ警告するのは、本人のためになる。世間ふつうの礼儀の考えが今許すより、ずっと気軽にこうした好意を示せるなら、人が人に、どこがよくないと思っているかを、無礼とも出すぎとも思われず、率直に指摘できるなら、たしかによいことだ。また私たちには、人によくない印象を持ったら、それに従ってさまざまに行動する権利がある。その人の個性を抑圧するのでなく、自分たちの個性を行使するために、である。たとえば、その人との付き合いを求めなくてはならないわけではない。避ける権利がある。避けていることを見せびらかすことは別だが、自分にとっていちばんよい付き合いを選ぶ権利があるからだ。その人の振る舞いや話が、付き合いのある人に悪い影響を及ぼしそうだと思えば、その人に用心するよう他人に言う権利があり、そうする義務さえあるかもしれない。しなくてもよい親切は、その人の向上に役立つ親切でないかぎり、ほかの人に優先してしてもよい。こうしたいくつものやり方で、じかには本人だけに関わる欠点のために、他人からたいへんな罰を受けることがある。だがその罰を受けるのは、欠点そのものが自然に、いわばおのずから生み出した結果であるかぎりにおいてだ。罰するため、わざと加えられるからではない。軽率、頑固、うぬぼれを見せる、限られた資力の範囲で暮らせない、害のある楽しみを自分で節制できない、感情や知性の楽しみを犠牲にして動物的な楽しみを追う人は、世間の意見の中で評価が落ち、好意を受ける分が少なくなるのを覚悟しなければならない。ただし、人との付き合いでとりわけすぐれた行いをして好意を受けるに値し、こうして、自分に関する欠点には左右されない親切を受ける資格を得ていないかぎり、それに不平を言う権利はない。
  translation_status: reviewed
- id: ol-04-006
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '146'
    printed_page_end: '148'
    source_sequence: 101
  source_text: 'What I contend for is, that the inconveniences which are strictly inseparable from the unfavourable judgment of others, are the only ones to which a person should ever be subjected for that portion of his conduct and character which concerns his own good, but which does not affect the interests of others in their relations with him. Acts injurious to others require a totally different treatment. Encroachment on their rights; infliction on them of any loss or damage not justified by his own rights; falsehood or duplicity in dealing with them; unfair or ungenerous use of advantages over them; even selfish abstinence from defending them against injury—these are fit objects of moral reprobation, and, in grave cases, of moral retribution and punishment. And not only these acts, but the dispositions which lead to them, are properly immoral, and fit subjects of disapprobation which may rise to abhorrence. Cruelty of disposition; malice and ill-nature; that most anti-social and odious of all passions, envy; dissimulation and insincerity; irascibility on insufficient cause, and resentment disproportioned to the provocation; the love of domineering over others; the desire to engross more than one''s share of advantages (the πλεονεξἱα [Greek: pleonexia] of the Greeks); the pride which derives gratification from the abasement of others; the egotism which thinks self and its concerns more important than everything else, and decides all doubtful questions in its own favour;—these are moral vices, and constitute a bad and odious moral character: unlike the self-regarding faults previously mentioned, which are not properly immoralities, and to whatever pitch they may be carried, do not constitute wickedness. They may be proofs of any amount of folly, or want of personal dignity and self-respect; but they are only a subject of moral reprobation when they involve a breach of duty to others, for whose sake the individual is bound to have care for himself. What are called duties to ourselves are not socially obligatory, unless circumstances render them at the same time duties to others. The term duty to oneself, when it means anything more than prudence, means self-respect or self-development; and for none of these is any one accountable to his fellow-creatures, because for none of them is it for the good of mankind that he be held accountable to them.'
  translation_ja: 私が主張するのは、行動や性格のうち、自分自身の益に関わりながら、他人がその人と関わる際の利益には影響を及ぼさない部分につき、その人に課してよい不都合は、他人から悪く判断されることにどうしても伴うものに限る、ということである。他人を害する行いには、まったく違った扱いが必要だ。他人の権利を侵すこと、自分の権利で正当化できない損失や損害を他人に加えること、他人と接するのに嘘をつき、二枚舌を使うこと、他人より有利な立場を不公平に、あるいは狭量に利用すること、危害を受ける他人を利己心から守らないことさえ、道徳的な非難を受けてよく、重大な場合には、道徳的な制裁や処罰を受けてよい。行為だけでなく、それを起こす性向も、まさしく不道徳であり、ひどい嫌悪にまで至りうる非難の、ふさわしい対象である。性質の残酷さ、悪意と意地の悪さ、感情のうちいちばん反社会的で憎むべきねたみ、心を隠すことと不誠実、たいした理由もないのに怒りやすく、きっかけに釣り合わないほど恨みを抱くこと、他人を支配したがること、自分の取り分を越えて利益を手にしたがること、ギリシャ人のいうプレオネクシア、他人をおとしめることから満足を得る傲慢、自分と自分の関心がほかのすべてより大切だと考え、判断の分かれる問題すべてを自分のためになるように決める自己中心。これらは道徳的な悪徳であり、道徳上悪く、憎むべき性格をつくる。一方、先に述べた自分だけに関わる欠点は、厳密には不道徳ではなく、どんな程度に達しても、邪悪ではない。いかに愚かか、人としての尊厳や自尊心を欠くかの証拠にはなっても、他人への義務に反するときにしか、道徳的非難の対象にはならない。その人たちのために、本人は自らを大事にする義務を負うからである。いわゆる自分自身への義務は、事情によって同時に他人への義務となるのでなければ、社会が履行を求められる義務ではない。自分自身への義務という言葉が、慎重に振る舞うこと以上を意味するなら、それは自尊心か自己の発達を意味する。このどれについても人は、仲間に責任を負わない。どれについても、その責任を負わせるのは人類の益にならないからである。
  translation_status: reviewed
- id: ol-04-007
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '148'
    printed_page_end: '150'
    source_sequence: 102
  source_text: 'The distinction between the loss of consideration which a person may rightly incur by defect of prudence or of personal dignity, and the reprobation which is due to him for an offence against the rights of others, is not a merely nominal distinction. It makes a vast difference both in our feelings and in our conduct towards him, whether he displeases us in things in which we think we have a right to control him, or in things in which we know that we have not. If he displeases us, we may express our distaste, and we may stand aloof from a person as well as from a thing that displeases us; but we shall not therefore feel called on to make his life uncomfortable. We shall reflect that he already bears, or will bear, the whole penalty of his error; if he spoils his life by mismanagement, we shall not, for that reason, desire to spoil it still further: instead of wishing to punish him, we shall rather endeavour to alleviate his punishment, by showing him how he may avoid or cure the evils his conduct tends to bring upon him. He may be to us an object of pity, perhaps of dislike, but not of anger or resentment; we shall not treat him like an enemy of society: the worst we shall think ourselves justified in doing is leaving him to himself, if we do not interfere benevolently by showing interest or concern for him. It is far otherwise if he has infringed the rules necessary for the protection of his fellow-creatures, individually or collectively. The evil consequences of his acts do not then fall on himself, but on others; and society, as the protector of all its members, must retaliate on him; must inflict pain on him for the express purpose of punishment, and must take care that it be sufficiently severe. In the one case, he is an offender at our bar, and we are called on not only to sit in judgment on him, but, in one shape or another, to execute our own sentence: in the other case, it is not our part to inflict any suffering on him, except what may incidentally follow from our using the same liberty in the regulation of our own affairs, which we allow to him in his.'
  translation_ja: 思慮や自分の尊厳を欠けば、当然その人への敬意は失われうる。それと、他人の権利を侵した人が受けるべき非難との違いは、名前だけの違いではない。その人を抑えてよいと私たちが思う事柄で不快にさせられるのか、抑える権利がないと分かっていることで不快にさせられるのかによって、その人に抱く気持ちにも、接し方にも大きな違いが出る。不快なら、嫌だと言ってよい。不快にさせる物事から足を遠ざけるのと同じように、人からも距離を取ってよい。だがそれで、その人の暮らしをわざとつらくする必要があるとは感じない。その人はすでに、またはやがて、誤りの代価をすべて身に受けることを考える。自分の不手際で人生を台無しにするからといって、私たちがさらに悪くしようとすることはない。罰したいと願うのでなく、その行いがおのずと降りかからせる害を、どう避け、どう癒やせるかを示して、負う罰をむしろ軽くしようと努める。その人を憐れむかもしれず、嫌うかもしれないが、怒りや恨みの対象にはしない。社会の敵のようには扱わない。気を配り、心配していると知らせて善意から関わるのでなければ、せいぜい本人に任せておくことが、正当だと考える最も厳しい仕打ちである。一人ひとり、または全体としての仲間を守るのに必要な規則を破ったなら、話はまったく違う。その行いの悪い結果を引き受けるのは、本人でなく他人である。社会は構成員すべての保護者として、その人に報いを与えなくてはならない。罰することをはっきりと目的にして、その人に苦痛を加え、十分厳しくなるようにしなければならない。一方の場合、その人は私たちの法廷に立つ違反者であり、私たちは有罪かどうかを裁くばかりか、何らかの形で自分たちが下した判決を執行することを求められる。他方の場合、私たちが相手に苦痛を加える役割を負うのではない。ただ、相手が自分のことを決めるために認められているのと同じ自由を、私たちが自分のことを決めるために使うとき、その結果として、たまたま苦痛が生じることがあるだけだ。
  translation_status: reviewed

    printed_page_end: '214'
    source_sequence: 139
  source_text: 'A very different spectacle is exhibited among a people accustomed to transact their own business. In France, a large part of the people having been engaged in military service, many of whom have held at least the rank of non-commissioned officers, there are in every popular insurrection several persons competent to take the lead, and improvise some tolerable plan of action. What the French are in military affairs, the Americans are in every kind of civil business; let them be left without a government, every body of Americans is able to improvise one, and to carry on that or any other public business with a sufficient amount of intelligence, order, and decision. This is what every free people ought to be: and a people capable of this is certain to be free; it will never let itself be enslaved by any man or body of men because these are able to seize and pull the reins of the central administration. No bureaucracy can hope to make such a people as this do or undergo anything that they do not like. But where everything is done through the bureaucracy, nothing to which the bureaucracy is really adverse can be done at all. The constitution of such countries is an organisation of the experience and practical ability of the nation, into a disciplined body for the purpose of governing the rest; and the more perfect that organisation is in itself, the more successful in drawing to itself and educating for itself the persons of greatest capacity from all ranks of the community, the more complete is the bondage of all, the members of the bureaucracy included. For the governors are as much the slaves of their organisation and discipline, as the governed are of the governors. A Chinese mandarin is as much the tool and creature of a despotism as the humblest cultivator. An individual Jesuit is to the utmost degree of abasement the slave of his order, though the order itself exists for the collective power and importance of its members.'
  translation_ja: 自分たちの仕事は自分たちで進めるのに慣れた国民では、まったく別の光景が見られる。フランスでは、国民の大きな部分が軍隊で勤め、そのうち多くが少なくとも下士官の位にあった。そのため民衆の反乱にはいつも、先頭に立ち、何はともあれ行動をまとめるだけの力を持つ人が何人かいる。軍事でのフランス人のようであるのが、あらゆる市民の仕事でのアメリカ人だ。政府がないままにされても、どの集団にも、臨時の政府をつくり、その仕事であれ公のほかの仕事であれ、十分な知性と秩序と決断をもって進める力がある。自由な国民はみなこのようであるべきだ。そしてそれができる国民は必ず自由である。ある一人か一団が中央行政の手綱を奪い、引けるというだけで、その奴隷になりはしない。このような人々に、好まないことをさせ、耐えさせることができると望める官僚組織はない。だがすべてを官僚組織を通して行うところでは、官僚が本気で反対することは一切できない。このような国の政体は、国民の経験と実務の能力を、残りの国民を治めるために、一つの規律ある組織にまとめる。その組織がそれ自体で完全であればあるほど、社会のあらゆる階層から、最も能力のある人を自分のところに引き寄せ、自分のために育てるのに成功するほど、官僚自身を含め、すべての人の束縛は完全になる。治める側も、自分の組織と規律の奴隷であることは、治められる側が治める側の奴隷であるのと変わらない。中国の高官も、最も身分の低い農民と同じく、専制の道具であり、手先である。イエズス会の会員一人ひとりは、会員全体の力と重要さを増すために会があるのに、最も屈辱的なほど、会の奴隷である。
  translation_status: reviewed
- id: ol-05-022
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '215'
    printed_page_end: '216'
    source_sequence: 140
  source_text: 'It is not, also, to be forgotten, that the absorption of all the principal ability of the country into the governing body is fatal, sooner or later, to the mental activity and progressiveness of the body itself. Banded together as they are—working a system which, like all systems, necessarily proceeds in a great measure by fixed rules—the official body are under the constant temptation of sinking into indolent routine, or, if they now and then desert that mill-horse round, of rushing into some half-examined crudity which has struck the fancy of some leading member of the corps: and the sole check to these closely allied, though seemingly opposite, tendencies, the only stimulus which can keep the ability of the body itself up to a high standard, is liability to the watchful criticism of equal ability outside the body. It is indispensable, therefore, that the means should exist, independently of the government, of forming such ability, and furnishing it with the opportunities and experience necessary for a correct judgment of great practical affairs. If we would possess permanently a skilful and efficient body of functionaries—above all, a body able to originate and willing to adopt improvements; if we would not have our bureaucracy degenerate into a pedantocracy, this body must not engross all the occupations which form and cultivate the faculties required for the government of mankind.'
  translation_ja: 国の主だった有能な人々がことごとく統治機構に取り込まれると、遅かれ早かれ、その組織自体の精神の活動と進歩する力にとっても致命的だ、ということを忘れてはならない。役人は団結して、どんな制度もそうであるように、多くの部分を一定の規則に従って動かざるをえない制度に携わるから、怠惰な決まり仕事に沈む誘惑に絶えずさらされている。たまにひき臼を回す馬のように同じところを回る仕事から外れれば、今度は、その組織の有力者の誰かの気に入った、ろくに検討されていない生煮えの考えに飛びつきがちだ。一見反対だが実は近いこの二つの傾向を抑える唯一のもの、組織の能力を高い水準に保てる唯一の刺激は、外部で同じくらい能力のある者から、注意深く批判されうることだ。したがって、そのような能力を作り、大きな実際の事柄を正しく判断するのに要る機会や経験を与える手段が、政府から独立して存在しなければならない。巧みで有能な役人の組織、とりわけ改善を考え出す力があり、進んで改善を取り入れる組織をいつまでも持ちたいなら、官僚による統治を、物知り顔の人々による統治に堕落させたくないなら、役人の組織は、人を治めるのに要る能力をつくり、育てるあらゆる仕事を独占してはならない。
  translation_status: reviewed
- id: ol-05-023
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '216'
    printed_page_end: '219'
    source_sequence: 141
  source_text: 'To determine the point at which evils, so formidable to human freedom and advancement, begin, or rather at which they begin to predominate over the benefits attending the collective application of the force of society, under its recognised chiefs, for the removal of the obstacles which stand in the way of its well-being; to secure as much of the advantages of centralised power and intelligence, as can be had without turning into governmental channels too great a proportion of the general activity, is one of the most difficult and complicated questions in the art of government. It is, in a great measure, a question of detail, in which many and various considerations must be kept in view, and no absolute rule can be laid down. But I believe that the practical principle in which safety resides, the ideal to be kept in view, the standard by which to test all arrangements intended for overcoming the difficulty, may be conveyed in these words: the greatest dissemination of power consistent with efficiency; but the greatest possible centralisation of information, and diffusion of it from the centre. Thus, in municipal administration, there would be, as in the New England States, a very minute division among separate officers, chosen by the localities, of all business which is not better left to the persons directly interested; but besides this, there would be, in each department of local affairs, a central superintendence, forming a branch of the general government. The organ of this superintendence would concentrate, as in a focus, the variety of information and experience derived from the conduct of that branch of public business in all the localities, from everything analogous which is done in foreign countries, and from the general principles of political science. This central organ should have a right to know all that is done, and its special duty should be that of making the knowledge acquired in one place available for others. Emancipated from the petty prejudices and narrow views of a locality by its elevated position and comprehensive sphere of observation, its advice would naturally carry much authority; but its actual power, as a permanent institution, should, I conceive, be limited to compelling the local officers to obey the laws laid down for their guidance. In all things not provided for by general rules, those officers should be left to
    their own judgment, under responsibility to their constituents. For the violation of rules, they should be responsible to law, and the rules themselves should be laid down by the legislature; the central administrative authority only watching over their execution, and if they were not properly carried into effect, appealing, according to the nature of the case, to the tribunal to enforce the law, or to the constituencies to dismiss the functionaries who had not executed it according to its spirit. Such, in its general conception, is the central superintendence which the Poor Law Board is intended to exercise over the administrators of the Poor Rate throughout the country. Whatever powers the Board exercises beyond this limit, were right and necessary in that peculiar case, for the cure of rooted habits of maladministration in matters deeply affecting not the localities merely, but the whole community; since no locality has a moral right to make itself by mismanagement a nest of pauperism, necessarily overflowing into other localities, and impairing the moral and physical condition of the whole labouring community. The powers of administrative coercion and subordinate legislation possessed by the Poor Law Board (but which, owing to the state of opinion on the subject, are very scantily exercised by them), though perfectly justifiable in a case of first-rate national interest, would be wholly out of place in the superintendence of interests purely local. But a central organ of information and instruction for all the localities, would be equally valuable in all departments of administration. A government cannot have too much of the kind of activity which does not impede, but aids and stimulates, individual exertion and development. The mischief begins when, instead of calling forth the activity and powers of individuals and bodies, it substitutes its own activity for theirs; when, instead of informing, advising, and, upon occasion, denouncing, it makes them work in fetters, or bids them stand aside and does their work instead of them. The worth of a State, in the long run, is the worth of the individuals composing it; and a State which postpones the interests of their mental expansion and elevation, to a little more of administrative skill, or of that semblance of it which practice gives, in the details of business; a State which dwarfs its men, in order that
    they may be more docile instruments in its hands even for beneficial purposes, will find that with small men no great thing can really be accomplished; and that the perfection of machinery to which it has sacrificed everything, will in the end avail it nothing, for want of the vital power which, in order that the machine might work more smoothly, it has preferred to banish.'
  translation_ja: 人の自由と進歩にとってこれほど恐ろしい害がどこから始まるか、さらに正しくは、社会の幸福を妨げるものを取り除くために、社会の力を公に認められた指導者のもとにまとめて使う利益を、害がどこから上回りはじめるか。社会全体の活動を政府の経路へ回しすぎずに、権力と知識を集めることの利点をどれだけ得られるか。これを決めることは、統治の技の中でも最も難しく複雑な問題の一つである。大きな部分は細かな事情の問題で、さまざまな考慮をいつも忘れずにいなければならず、絶対の規則は立てられない。だが安全を保てる実際の原理、目を離してはならない理想、困難を乗り越えようとするあらゆる仕組みを試す基準は、こう表せると思う。能率を損なわないかぎり、権限はできるかぎり広く分散させる。一方、情報はできるかぎり中央に集め、そこから広める。たとえば市町村の行政では、よりじかに関わる人々に任せるほうがよいことを除いて、ニューイングランドの諸州のように、すべての仕事を、各地域で選ばれた別々の役人のあいだに細かく分ける。ただしそのほかに、地方の仕事の部門ごとに、政府全体の一角をなす、中央の監督機関を設ける。その部門の公の仕事について、あらゆる土地での取り扱いから得られる情報や経験、ほかの国々の似た取り組みから得られるもの、そして政治科学の一般原理から得られるものを、その機関に焦点を合わせるように集める。中央の機関には、行われることのすべてを知る権利があるべきだ。ある土地で得られた知識を、ほかの土地で役立てられるようにするのが、その特別な義務である。立場が高く、広く観察できるため、一つの土地のつまらない偏見や狭い見方から自由であり、その助言はおのずと大きな重みを持つだろう。だが恒常的な機関として実際に持つ権力は、地方の役人に、その指針として定められた法律を守らせることに限るべきだと思う。一般の規則に定めのない事柄では、役人が自らの判断で決めるに任せ、その判断については選挙で選んだ人々に対する責任を負わせる。規則に違反したら法に対して責任を負うべきで、規則を定めるのは立法府の役目だ。中央の行政機関はその実行を監督するだけで、適切に実行されなければ、場合に応じて、法を執行するよう法廷に訴えるか、法の精神に従って実行しなかった役人を退けるよう、その役人を選んだ人々に訴える。大まかな考え方では、これが救貧法委員会が全国の救貧税を管理する人々に対して行うことになっている、中央からの監督である。委員会がこの限界を越えて行使する権力は、この特別の事例では正しく、また必要なものだった。地域だけでなく共同体全体に深く影響する事柄で、根を張った悪い行政の習慣を治すためであった。というのも、行政を誤って自分の地域を貧困の巣にし、それが必ずほかの地域にあふれ出て、働く人々全体の道徳的、身体的な状態を悪くするようなことをする道徳的な権利は、どの地域にもないからだ。救貧法委員会の持つ行政上の強制力と、下位の規則を定める権限は、世論が今のとおりなので、実際にはごくわずかしか行使されていないが、第一級の国益に関わる場合にはまったく正当化できる。一方、地域だけの利害の監督には、まったくふさわしくない。だが、あらゆる地域に知らせ、教える中央機関は、どの行政部門でも等しく価値があるだろう。個人の努力と発達を妨げるのでなく、助け、促す種類の活動なら、政府がいくら行っても多すぎることはない。害は、個人や団体の活動と力を引き出す代わりに、政府が自分の活動で置き換えるときに始まる。知らせ、助言し、必要に応じて非難する代わりに、手足を縛って働かせるか、脇にどくよう命じて、彼らの仕事を肩代わりするときに始まる。長い目で見れば、国家の値うちは、それをつくる一人ひとりの人間の値うちである。その人たちの心を広げ高めることよりも、事務の細部で行政の手腕を少しばかり高めること、または、手慣れれば手腕があるように見えることを優先する国家は、たとえ有益な目的でも、自分の手の中でより従順な道具となるよう、人間を小さくしてしまう。そういう国家は、小さい人間には、本当に大きいことは何もできないと知るだろう。そして万事を犠牲にして得た仕組みの完全さも、機械をもっと滑らかに動かすため、自ら追い払った生きる力がない以上、結局なんの役にも立たないと知るだろう。

  source_text: In maintaining this principle, the greatest difficulty to be encountered does not lie in the appreciation of means towards an acknowledged end, but in the indifference of persons in general to the end itself. If it were felt that the free development of individuality is one of the leading essentials of well-being; that it is not only a co-ordinate element with all that is designated by the terms civilisation, instruction, education, culture, but is itself a necessary part and condition of all those things; there would be no danger that liberty should be under-valued, and the adjustment of the boundaries between it and social control would present no extraordinary difficulty. But the evil is, that individual spontaneity is hardly recognised by the common modes of thinking, as having any intrinsic worth, or deserving any regard on its own account. The majority, being satisfied with the ways of mankind as they now are (for it is they who make them what they are), cannot comprehend why those ways should not be good enough for everybody; and what is more, spontaneity forms no part of the ideal of the majority of moral and social reformers, but is rather looked on with jealousy, as a troublesome and perhaps rebellious obstruction to the general acceptance of what these reformers, in their own judgment, think would be best for mankind. Few persons, out of Germany, even comprehend the meaning of the doctrine which Wilhelm von Humboldt, so eminent both as a savant and as a politician, made the text of a treatise—that "the end of man, or that which is prescribed by the eternal or immutable dictates of reason, and not suggested by vague and transient desires, is the highest and most harmonious development of his powers to a complete and consistent whole;" that, therefore, the object "towards which every human being must ceaselessly direct his efforts, and on which especially those who design to influence their fellow-men must ever keep their eyes, is the individuality of power and development;" that for this there are two requisites, "freedom, and a variety of situations;" and that from the union of these arise "individual vigour and manifold diversity," which combine themselves in "originality."[11]
  translation_ja: この原則を唱えるうえで直面する最大の難しさは、誰もが認める目的に至る手段を見極めることではなく、世の大方の人が目的そのものに関心を持たないことだ。個性の自由な発達が幸福に欠かせない主な事柄の一つであり、文明や知識の伝授、教育、教養と呼ばれるものと並ぶ要素であるだけでなく、そのどれにも欠かせない一部であり条件でもある、と感じられていれば、自由が過小評価されるおそれはなく、自由と社会による統制の境目を調整することも、並外れて難しくはないだろう。だが困ったことに、普通の考え方では、個人が自発的に動くことは、それ自体に何か値うちがあり、そのことだけで尊重に値するとは、ほとんど認められていない。多数派は、今の世の人の行い方で満足していて、自分たちが今のとおりにしているのだから、なぜその行い方では誰にとっても十分ではないのか、理解できない。そのうえ、道徳や社会の改革者の大半にとっても、自発性は理想の一部ではない。それどころか、改革者自身の判断で人類に最もよいと考えるものを世の中に広く受け入れさせるのを妨げる、厄介な、あるいは反抗的な障害として、警戒されている。学者としても政治家としても傑出したヴィルヘルム・フォン・フンボルトが、ある論考の主題とした考えの意味さえ、ドイツの外で理解する人は少ない。その考えとは、「人間の目的とは、漠然とした一時の欲望に示唆されるものではなく、理性の永遠に変わらない命令に定められたものであり、自分の諸能力を最も高く調和して発達させ、完全で一貫した全体にすることである」。ゆえに「あらゆる人間が絶えず努力を向け、とりわけ他人に働きかけようとする者が、片時も目を離してはならない」目的は、「能力と発達の個性」である。これには「自由と、状況の多様さ」という二つの条件が要る。両者が一つになると「一人ひとりの活力と多様な違い」が生まれ、それが「独創性」のうちで結び合う。[11]
  translation_status: reviewed

  source_text: 'Another important example of illegitimate interference with the rightful liberty of the individual, not simply threatened, but long since carried into triumphant effect, is Sabbatarian legislation. Without doubt, abstinence on one day in the week, so far as the exigencies of life permit, from the usual daily occupation, though in no respect religiously binding on any except Jews, is a highly beneficial custom. And inasmuch as this custom cannot be observed without a general consent to that effect among the industrious classes, therefore, in so far as some persons by working may impose the same necessity on others, it may be allowable and right that the law should guarantee to each, the observance by others of the custom, by suspending the greater operations of industry on a particular day. But this justification, grounded on the direct interest which others have in each individual''s observance of the practice, does not apply to the self-chosen occupations in which a person may think fit to employ his leisure; nor does it hold good, in the smallest degree, for legal restrictions on amusements. It is true that the amusement of some is the day''s work of others; but the pleasure, not to say the useful recreation, of many, is worth the labour of a few, provided the occupation is freely chosen, and can be freely resigned. The operatives are perfectly right in thinking that if all worked on Sunday, seven days'' work would have to be given for six days'' wages: but so long as the great mass of employments are suspended, the small number who for the enjoyment of others must still work, obtain a proportional increase of earnings; and they are not obliged to follow those occupations, if they prefer leisure to emolument. If a further remedy is sought, it might be found in the establishment by custom of a holiday on some other day of the week for those particular classes of persons. The only ground, therefore, on which restrictions on Sunday amusements can be defended, must be that they are religiously wrong; a motive of legislation which never can be too earnestly protested against. "Deorum injuriæ Diis curæ." It remains to be proved that society or any of its officers holds a commission from on high to avenge any supposed offence to Omnipotence, which is not also a wrong to our fellow-creatures. The notion that it is one man''s duty that another should
    be religious, was the foundation of all the religious persecutions ever perpetrated, and if admitted, would fully justify them. Though the feeling which breaks out in the repeated attempts to stop railway travelling on Sunday, in the resistance to the opening of Museums, and the like, has not the cruelty of the old persecutors, the state of mind indicated by it is fundamentally the same. It is a determination not to tolerate others in doing what is permitted by their religion, because it is not permitted by the persecutor''s religion. It is a belief that God not only abominates the act of the misbeliever, but will not hold us guiltless if we leave him unmolested.'
  translation_ja: 個人の正当な自由への不当な介入の、もう一つの重要な例は、ただ危険があるだけでなく、とうの昔から徹底して施行されてきた、安息日を守らせる法律である。暮らしの必要が許すかぎり、一週間に一日は、日ごろの仕事を休むことは、たしかに非常に有益な習慣である。それが宗教上の拘束力を持つのは、ユダヤ教徒だけだとしても、である。また、この習慣は働く人々の全般的な同意なしには守れない。そこで、ある人が働くために、他人も働かなければならなくなるかぎり、特定の日に大部分の産業活動を止めて、誰にも他の人々がこの習慣を守ることを法律で保証するのは、許され、また正しいだろう。だが、一人ひとりがこのならわしを守ることに、他人が直接の利害を持つというこの根拠は、自分で選んで余暇を使おうとする活動には当てはまらない。娯楽を法律で制限することには少しも通用しない。ある人が遊ぶため、別の人はその日も働くのは事実だ。だが、仕事を自由に選び、自由に辞められるのなら、役立つ息抜きとまでは言わずとも、多数の楽しみには、少数の働きに値するものがある。皆が日曜に働けば、六日分の賃金で七日分働くはめになる、と労働者が考えるのはまったく正しい。ただし、仕事の大部分が止まるかぎり、ほかの人が楽しむために働かなくてはならない少数の者は、それに応じて収入が増える。収入より余暇がよければ、このような職を続ける義務はない。さらに手立てを求めるなら、このような人々に限り、週の別の日を休みとする習慣をつくるのもよい。したがって日曜の娯楽を制限する唯一の理由は、それが宗教上正しくないということになる。立法がこのような動機からなされることには、いくら真剣に抗議してもしすぎることはない。「神々への侮辱は神々に任せよ。」全能の神に対するものとみなす侮辱でも、仲間に対する不正でなければ、その仕返しをするよう社会またはその役人が天から委ねられたというなら、その証拠をまだ見せてもらっていない。他人が信仰を持つようにさせるのが人の義務だという考えは、これまで行われた宗教的迫害すべての土台であり、認めればそれらを完全に正当化する。日曜の鉄道利用をやめさせようとする繰り返しの試みや、博物館を開けるのに反対するときなどに噴き出す気持ちには、昔の迫害者の残酷さはないが、それに現れる心のありようは根本から同じである。相手の宗教が許しても、迫害する側の宗教が許さないから、相手がそれをするのを我慢しないと決めている。神は間違った信仰の人の行いを憎むばかりか、それを妨げずにおけば、私たちにも罪があると見なすと、信じているのだ。
  translation_status: reviewed
- id: ol-04-021

    printed_page_end: '47'
    source_sequence: 34
  source_text: 'To pass from this to the only other instance of judicial iniquity, the mention of which, after the condemnation of Socrates, would not be an anticlimax: the event which took place on Calvary rather more than eighteen hundred years ago. The man who left on the memory of those who witnessed his life and conversation, such an impression of his moral grandeur, that eighteen subsequent centuries have done homage to him as the Almighty in person, was ignominiously put to death, as what? As a blasphemer. Men did not merely mistake their benefactor; they mistook him for the exact contrary of what he was, and treated him as that prodigy of impiety, which they themselves are now held to be, for their treatment of him. The feelings with which mankind now regard these lamentable transactions, especially the later of the two, render them extremely unjust in their judgment of the unhappy actors. These were, to all appearance, not bad men—not worse than men commonly are, but rather the contrary; men who possessed in a full, or somewhat more than a full measure, the religious, moral, and patriotic feelings of their time and people: the very kind of men who, in all times, our own included, have every chance of passing through life blameless and respected. The high-priest who rent his garments when the words were pronounced, which, according to all the ideas of his country, constituted the blackest guilt, was in all probability quite as sincere in his horror and indignation, as the generality of respectable and pious men now are in the religious and moral sentiments they profess; and most of those who now shudder at his conduct, if they had lived in his time, and been born Jews, would have acted precisely as he did. Orthodox Christians who are tempted to think that those who stoned to death the first martyrs must have been worse men than they themselves are, ought to remember that one of those persecutors was Saint Paul.'
  translation_ja: ソクラテスへの有罪判決のあとに挙げても話の調子が落ちない裁判上の不正は、ほかに一つだけある。千八百年あまり前、カルバリの丘で起きたことだ。この人の生涯と言葉に接した人々は、その人格の偉大さに深く打たれ、その後十八世紀にわたり、人々は全能の神その人として彼を崇めてきた。その人が、何の罪で辱められ、殺されたのか。神を冒瀆した罪である。人々は自分たちに恵みをもたらした人を見誤っただけではない。その人を、実際とは正反対のものと思いこみ、不敬の極みを体現する者として扱った。今では、この人をそう扱った彼ら自身が、不敬の極みを体現する者とされている。今日、私たちがこの二つの嘆かわしい事件、とりわけ後の事件に抱く感情のせいで、不幸にもその場で行動した人々に対する判断はきわめて不公正になりがちだ。どう見ても悪人ではなかった。ふつうの人より劣るどころか、むしろその逆だった。自分たちの時代と民族の宗教心、道徳心、愛国心を十分に、あるいは並以上に持っていた人々である。つまり、今日も含めどんな時代でも、非難を受けることなく、尊敬されて一生を過ごせそうな人々だったのである。国中どこでもこの上ない罪だと見なされた言葉が発せられたとき、大祭司は自分の衣を裂いた。恐らくその恐れと憤りは、今日、世間で尊敬される敬虔な人々が口にする宗教心や道徳心と同じくらい、心からのものだった。今その行いに身震いする人の大半も、彼の時代に生き、ユダヤ人として生まれていたなら、寸分たがわず同じことをしただろう。最初の殉教者たちを石打ちにして殺した人々は、自分たちより悪い人間だったに違いないと言いたくなったら、正統派のキリスト教徒は、迫害者の一人が聖パウロだったことを思い出すとよい。
  translation_status: reviewed
- id: ol-02-014
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg34901
    precision: page
    printed_page: '47'
    printed_page_end: '50'
    source_sequence: 35
  source_text: 'Let us add one more example, the most striking of all, if the impressiveness of an error is measured by the wisdom and virtue of him who falls into it. If ever any one, possessed of power, had grounds for thinking himself the best and most enlightened among his cotemporaries, it was the Emperor Marcus Aurelius. Absolute monarch of the whole civilised world, he preserved through life not only the most unblemished justice, but what was less to be expected from his Stoical breeding, the tenderest heart. The few failings which are attributed to him, were all on the side of indulgence: while his writings, the highest ethical product of the ancient mind, differ scarcely perceptibly, if they differ at all, from the most characteristic teachings of Christ. This man, a better Christian in all but the dogmatic sense of the word, than almost any of the ostensibly Christian sovereigns who have since reigned, persecuted Christianity. Placed at the summit of all the previous attainments of humanity, with an open, unfettered intellect, and a character which led him of himself to embody in his moral writings the Christian ideal, he yet failed to see that Christianity was to be a good and not an evil to the world, with his duties to which he was so deeply penetrated. Existing society he knew to be in a deplorable state. But such as it was, he saw, or thought he saw, that it was held together, and prevented from being worse, by belief and reverence of the received divinities. As a ruler of mankind, he deemed it his duty not to suffer society to fall in pieces; and saw not how, if its existing ties were removed, any others could be formed which could again knit it together. The new religion openly aimed at dissolving these ties: unless, therefore, it was his duty to adopt that religion, it seemed to be his duty to put it down. Inasmuch then as the theology of Christianity did not appear to him true or of divine origin; inasmuch as this strange history of a crucified God was not credible to him, and a system which purported to rest entirely upon a foundation to him so wholly unbelievable, could not be foreseen by him to be that renovating agency which, after all abatements, it has in fact proved to be; the gentlest and most amiable of philosophers and rulers, under a solemn sense of duty, authorised the persecution of Christianity. To my mind this is one of the most
    tragical facts in all history. It is a bitter thought, how different a thing the Christianity of the world might have been, if the Christian faith had been adopted as the religion of the empire under the auspices of Marcus Aurelius instead of those of Constantine. But it would be equally unjust to him and false to truth, to deny, that no one plea which can be urged for punishing anti-Christian teaching, was wanting to Marcus Aurelius for punishing, as he did, the propagation of Christianity. No Christian more firmly believes that Atheism is false, and tends to the dissolution of society, than Marcus Aurelius believed the same things of Christianity; he who, of all men then living, might have been thought the most capable of appreciating it. Unless any one who approves of punishment for the promulgation of opinions, flatters himself that he is a wiser and better man than Marcus Aurelius—more deeply versed in the wisdom of his time, more elevated in his intellect above it—more earnest in his search for truth, or more single-minded in his devotion to it when found;—let him abstain from that assumption of the joint infallibility of himself and the multitude, which the great Antoninus made with so unfortunate a result.'
  translation_ja: もう一つ例を挙げよう。誤りを犯した人の知恵と徳が高いほどその誤りが目を引くとすれば、これが最も目を引く例である。権力を手にし、自分が同時代で最も徳が高く知識に開けた人であると考える理由を持つ人がいたとすれば、それは皇帝マルクス・アウレリウスであった。文明世界全体の絶対君主でありながら、生涯、一点の曇りもない正義を守り、ストア派の教育を受けた人にはむしろ意外なほど、やさしい心を持ちつづけた。彼にあったとされるわずかな欠点も、どれも寛大すぎるというものだった。その著作は古代の精神が生んだ最も高い倫理の成果であり、キリストの最も特徴ある教えと違いがあるとしても、ほとんど見分けがつかない。この人は、教義を受け入れたかどうかを別にすれば、その後の、表向きキリスト教徒であった君主のほとんどよりも、よほど立派なキリスト教徒だった。その人がキリスト教を迫害したのである。人類がそれまで成し遂げたすべての頂点に立ち、開かれた、縛られない知性を持ち、自分の道徳上の著述でおのずからキリスト教の理想を体現する人柄の持ち主だった。だがこの世界のための務めを深く自覚しながら、キリスト教が世界に害でなく益をもたらすとは見抜けなかった。今ある社会は嘆かわしい状態にあると彼も知っていた。ただ、それでも社会がまとまりを保ち、これ以上悪くならずにいるのは、古くから認められた神々への信仰と崇敬のおかげだと見たか、そう見たと思った。人々の統治者として、社会がばらばらになるのを許さぬことが自分の務めだと考えた。今ある絆を外せば、ほかにどういう絆が生まれ、社会を縫い合わせられるのか、見当がつかなかった。新しい宗教は公然と、この絆を断つことを目指していた。ならばその宗教を受け入れる義務がないかぎり、抑えるのが自分の義務に見えた。キリスト教の神学は彼には真実とも神に由来するとも思えなかった。磔にされた神の奇妙な物語は信じられず、まったく信じられない土台の上に全面的に成り立つとする教えが、さまざまに割り引いても、実際そうであったような、世界を新たにする力になるとは、予想できなかった。そのため、哲学者や統治者のうちで最も温厚で、人に好かれるこの人が、厳粛な義務の自覚をもって、キリスト教の迫害を認めたのである。私には、歴史全体のうちでも最も悲劇的な事実の一つである。コンスタンティヌス帝のもとでなく、マルクス・アウレリウスの肝いりで、帝国がキリスト教を国教としたなら、世界のキリスト教はどれほど違うものになっただろう。考えるとつらい。だが、反キリスト教の教えを罰するために持ち出せる理由は、実際にキリスト教の布教を罰したこの皇帝にも、すべてそろっていた。このことを否定するのは、彼に不公正であると同時に、真実に背く。無神論は偽りで、社会を崩すと信じるキリスト教徒も、キリスト教について彼が抱いた確信ほど強くそう信じはしない。当時生きていた誰よりもキリスト教の価値を分かりそうだった人が、である。意見を広めるのを罰してよいと思う者が、その皇帝より自分のほうが賢く立派だ、時代の知恵に通じ、知性では時代よりはるかに上に立ち、真理を追う熱心さでも、見つけた真理に専念する点でも勝っている、と思い上がるのでないなら、偉大なアントニヌスがこれほど不幸な結果を招いた、自分も大勢の人々も誤りを知らないと決めてかかることは、控えたがよい。
  translation_status: reviewed
- id: ol-02-015
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

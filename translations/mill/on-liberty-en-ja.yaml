  source_text: But, without dwelling upon supposititious cases, there are, in our own day, gross usurpations upon the liberty of private life actually practised, and still greater ones threatened with some expectation of success, and opinions proposed which assert an unlimited right in the public not only to prohibit by law everything which it thinks wrong, but in order to get at what it thinks wrong, to prohibit any number of things which it admits to be innocent.
  translation_ja: だが仮の例ばかり考えなくても、私生活の自由をひどく侵すことは、私たちの時代にも実際に行われている。いっそうひどいことが、成功の見込みも多少ありながら持ち出されている。また世間には、よくないと思うことをことごとく法で禁じるばかりか、悪いと思う行為を取り締まるためなら、罪がないと自分で認めることでさえ、いくらでも禁じられる、限りない権利があるとする意見も提案されている。
  translation_status: reviewed

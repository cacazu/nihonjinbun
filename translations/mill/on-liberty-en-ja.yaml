    printed_page_end: '86'
    source_sequence: 55
  source_text: 'It still remains to speak of one of the principal causes which make diversity of opinion advantageous, and will continue to do so until mankind shall have entered a stage of intellectual advancement which at present seems at an incalculable distance. We have hitherto considered only two possibilities: that the received opinion may be false, and some other opinion, consequently, true; or that, the received opinion being true, a conflict with the opposite error is essential to a clear apprehension and deep feeling of its truth. But there is a commoner case than either of these; when the conflicting doctrines, instead of being one true and the other false, share the truth between them; and the nonconforming opinion is needed to supply the remainder of the truth, of which the received doctrine embodies only a part. Popular opinions, on subjects not palpable to sense, are often true, but seldom or never the whole truth. They are a part of the truth; sometimes a greater, sometimes a smaller part, but exaggerated, distorted, and disjoined from the truths by which they ought to be accompanied and limited. Heretical opinions, on the other hand, are generally some of these suppressed and neglected truths, bursting the bonds which kept them down, and either seeking reconciliation with the truth contained in the common opinion, or fronting it as enemies, and setting themselves up, with similar exclusiveness, as the whole truth. The latter case is hitherto the most frequent, as, in the human mind, one-sidedness has always been the rule, and many-sidedness the exception. Hence, even in revolutions of opinion, one part of the truth usually sets while another rises. Even progress, which ought to superadd, for the most part only substitutes one partial and incomplete truth for another; improvement consisting chiefly in this, that the new fragment of truth is more wanted, more adapted to the needs of the time, than that which it displaces. Such being the partial character of prevailing opinions, even when resting on a true foundation; every opinion which embodies somewhat of the portion of truth which the common opinion omits, ought to be considered precious, with whatever amount of error and confusion that truth may be blended. No sober judge of human affairs will feel bound to be indignant because those who force on our notice truths which we should otherwise
    have overlooked, overlook some of those which we see. Rather, he will think that so long as popular truth is one-sided, it is more desirable than otherwise that unpopular truth should have one-sided asserters too; such being usually the most energetic, and the most likely to compel reluctant attention to the fragment of wisdom which they proclaim as if it were the whole.'
  translation_ja: 意見の多様さが有益であり、人類が今はどれほど遠いか見当もつかない知的進歩の段階に入るまで、そうあり続ける主な理由の一つが、まだ残っている。ここまで考えたのは二つの可能性だけだ。通説が誤りなら、ほかのある意見が真実でありうる。あるいは、通説が真理なら、その真理をはっきりと理解し、深く感じるために、反対の誤りと争わせることが欠かせない。だがいずれよりもよくある場合がある。対立する教説が、一方は真実、他方は誤りなのではなく、真理を分け持っている場合である。通説が真理の一部しか示していないとき、残る部分を補うには、そこから外れた意見が要る。感覚で直接分かるのではない事柄については、大衆の意見はしばしば正しいが、真理のすべてであることはめったになく、あるいは一度もない。それは真理の一部であり、ときに大きな部分、ときに小さな部分だが、誇張され、ゆがめられ、これに伴い、限界を示すはずの真理から切り離されている。一方、異端の意見は、たいていこうした抑えられ、顧みられなかった真理のいくつかが、自分たちを抑えていた縛りを破って出てきたものだ。通説に含まれる真理との和解を求めるか、敵として立ちはだかり、通説と同じ排他性で、自分たちこそ真理のすべてだと名乗り出る。今までのところ後者のほうが多い。人の心では一面に偏るのがいつも普通で、多くの面を持つのは例外だったからだ。だから意見の革命でも、一部の真理が昇るときは、ほかの部分がたいてい沈む。本来なら付け加えるべき進歩でさえ、たいていは、部分的で不完全な真理を別のそれに取り替えるだけである。新しい真理の断片のほうが、それに取って代わられるものよりも求められ、時代の必要に合っていることに、改善の主な意味がある。支配的な意見は、真実を土台とする場合にも、このように一部分しかとらえない性質を持つ。だから、通説が取りこぼしている真理のいくらかでも身に帯びる意見なら、その真理にどれほど多くの誤りや混乱がまじっていようと、貴重とみなすべきだ。そうして注意を向けさせられなければ、私たちが見落としたはずの真理を示す人が、こちらに見えている真理のいくつかを見落としたからといって、人間のことを冷静に考える人は、腹を立てなくてはならないとは思わない。むしろ、世間で通用する真理が一面だけであるかぎり、世間で人気のない真理にも、一面だけを主張する人がいたほうがよいと思うだろう。そういう人はたいてい最も熱心で、真理のすべてであるかのように触れ回っている知恵の断片に、気乗りしない人々の注意まで向けさせる見込みが最もあるからだ。
  translation_status: reviewed

    source_sequence: 114
  source_text: 'Under the name of preventing intemperance, the people of one English colony, and of nearly half the United States, have been interdicted by law from making any use whatever of fermented drinks, except for medical purposes: for prohibition of their sale is in fact, as it is intended to be, prohibition of their use. And though the impracticability of executing the law has caused its repeal in several of the States which had adopted it, including the one from which it derives its name, an attempt has notwithstanding been commenced, and is prosecuted with considerable zeal by many of the professed philanthropists, to agitate for a similar law in this country. The association, or "Alliance" as it terms itself, which has been formed for this purpose, has acquired some notoriety through the publicity given to a correspondence between its Secretary and one of the very few English public men who hold that a politician''s opinions ought to be founded on principles. Lord Stanley''s share in this correspondence is calculated to strengthen the hopes already built on him, by those who know how rare such qualities as are manifested in some of his public appearances, unhappily are among those who figure in political life. The organ of the Alliance, who would "deeply deplore the recognition of any principle which could be wrested to justify bigotry and persecution," undertakes to point out the "broad and impassable barrier" which divides such principles from those of the association. "All matters relating to thought, opinion, conscience, appear to me," he says, "to be without the sphere of legislation; all pertaining to social act, habit, relation, subject only to a discretionary power vested in the State itself, and not in the individual, to be within it." No mention is made of a third class, different from either of these, viz. acts and habits which are not social, but individual; although it is to this class, surely, that the act of drinking fermented liquors belongs. Selling fermented liquors, however, is trading, and trading is a social act. But the infringement complained of is not on the liberty of the seller, but on that of the buyer and consumer; since the State might just as well forbid him to drink wine, as purposely make it impossible for him to obtain it. The Secretary, however, says, "I claim, as a citizen, a right to legislate whenever my social
    rights are invaded by the social act of another." And now for the definition of these "social rights." "If anything invades my social rights, certainly the traffic in strong drink does. It destroys my primary right of security, by constantly creating and stimulating social disorder. It invades my right of equality, by deriving a profit from the creation of a misery, I am taxed to support. It impedes my right to free moral and intellectual development, by surrounding my path with dangers, and by weakening and demoralising society, from which I have a right to claim mutual aid and intercourse." A theory of "social rights," the like of which probably never before found its way into distinct language—being nothing short of this—that it is the absolute social right of every individual, that every other individual shall act in every respect exactly as he ought; that whosoever fails thereof in the smallest particular, violates my social right, and entitles me to demand from the legislature the removal of the grievance. So monstrous a principle is far more dangerous than any single interference with liberty; there is no violation of liberty which it would not justify; it acknowledges no right to any freedom whatever, except perhaps to that of holding opinions in secret, without ever disclosing them: for the moment an opinion which I consider noxious, passes any one''s lips, it invades all the "social rights" attributed to me by the Alliance. The doctrine ascribes to all mankind a vested interest in each other''s moral, intellectual, and even physical perfection, to be defined by each claimant according to his own standard.'
  translation_ja: 節度を失うのを防ぐという名目で、あるイギリスの植民地と、合衆国のほぼ半数の州では、人々は、医療の目的を除き、発酵酒をどんな形であれ使うことを、法で禁じられた。酒を売ることの禁止は、意図どおりに、事実上、酒を使うことの禁止だからである。この法を実施するのは無理だと分かって、それを採った州のいくつか、法の名の由来になった州でさえ、廃止した。それにもかかわらず、わが国にも似た法律を求める運動が始まり、慈善家を名乗る多くの人々によって、かなり熱心に続けられている。この目的のためにつくられた団体、自ら言うところの「同盟」は、その事務局長と、政治家の意見は原理に基づくべきだと考えるごくわずかなイングランドの公人の一人との、書簡のやりとりを公にすることで、多少名が知られた。スタンリー卿がこのやりとりで見せた役割は、卿が公の場で見せた資質を持つ者が政治家のあいだには残念ながらまれだと知り、かねて期待を寄せていた人々の、その期待を強めるものだ。「信仰の偏狭や迫害を正当化するようねじ曲げられる原理が、一つでも認められれば、深く嘆くだろう」と述べる同盟の代弁者は、そのような原理と同盟の原理を分ける「幅広く、越えがたい境」を指摘しようとする。「思想、意見、良心に関するあらゆる事柄は、私には立法の範囲外と思われる。社会的な行為、習慣、関係に属することはすべて、個人でなく国家自身に任された裁量にのみ服し、その範囲内にある。」これらのいずれとも違う第三の種類、社会的でなく個人的な行為や習慣には、言及がない。発酵酒を飲むことは、確かにそこに入るのだが。ただし、発酵酒を売ることは取引であり、取引は社会上の行為である。だが不服とされている侵害は、売り手の自由ではなく、買って飲む人の自由に対するものである。わざと酒を手に入れられなくするのなら、酒を飲むことを禁止するのと同じだからだ。ところが事務局長は言う。「他人の社会的な行為が私の社会的権利を侵害するときはいつでも、私は一市民として、法律をつくる権利を主張する。」では、その「社会的権利」の定義を見よう。「私の社会的権利を侵すものがあるなら、強い酒の取引こそ間違いなくそうだ。社会の秩序の乱れを絶えず生み、あおるので、安全に暮らす私の第一の権利を壊す。それが生んだ不幸を支えるため私が税を課される一方で、そこから利益を得るのだから、平等である私の権利を侵す。私の行く先を危険で囲み、助け合いや交流を求める権利がある社会を弱らせ、腐らせるので、道徳的にも知的にも自由に発達する私の権利を妨げる。」これに似た「社会的権利」の学説がおそらくかつて明瞭な言葉で述べられたことはない。その意味するところは、ほかの誰もが、あらゆる点で寸分たがわずそうすべきように振る舞うことが、すべての個人の絶対の社会的権利だというにほかならない。誰かが少しでも怠れば、私の社会的権利を侵し、侵害を取り除くよう立法府に求める資格を、私に与える。こうまで途方もない原理は、どんな個別の自由への介入よりもはるかに危険である。それで正当化できない自由の侵害が一つもない。どんな自由への権利も認めず、おそらく認めるのは、一度も明かさずひそかに意見を持つ自由だけだ。誰かの口から私が有害だと思う意見が出たとたん、同盟が私にあるとする「社会的権利」のすべてを侵すからだ。この学説は、すべての人に、互いの道徳的、知的、さらには身体的な完全さにさえ、確立した利害を認める。何を完全とするかは、それを要求する人が自分の基準に従って決めるのである。

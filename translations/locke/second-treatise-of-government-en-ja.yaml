          "precision": "page",
          "anchor": "tcp:96077:237",
          "printed_page": "462",
          "printed_page_end": "463",
          "source_sequence": 285
        }
      ],
      "source_text": "238. The other Case is, When a King makes himself the dependent of another, and subjects his Kingdom which his Ancestors left him, and the People put free into his hands, to the Dominion of another. For however perhaps it may not be his intention to prejudice the People; yet because he has hereby lost the principal part of Regal Dignity, viz. to be next and immediately under God, Supream in his Kingdom; and also because he betray'd or forced his People, whose liberty he ought to have carefully preserved, into the Power and Dominion of a Foreign Nation. By this as it were alienation of his Kingdom, he himself loses the Power he had in it before, without transferring any the least right to those on whom he would have bestowed it; and so by this act sets the People free, and leaves them at their own disposal. One Example of this is to be found in the Scotch Annals.",
      "translation_ja": "第238節　「もう一つは、王が自ら他人に従う身となり、先祖が残し、人民が自由な国としてその手に置いた王国を、他人の支配に従わせるときである。ひょっとすると、民の不利益を意図したのではないかもしれない。だが、そのために王としての尊厳の第一の部分、すなわち神のすぐ下に、その次の者として、王国で最高の者であることを失った。それに加え、自由を大切に守るべきだった人民を裏切り、あるいは力ずくで、外国の力と支配に服させた。このいわば王国を譲り渡すことで、譲り渡そうと思った相手に少しの権利も移さず、王はそれまでその国に持っていた権力をみずから失う。この行為によって人民を自由にし、身の処し方を自分たちに委ねることになる。その一例が、スコットランドの年代記に見つかる。」",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s239",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:237",
          "printed_page": "463",
          "printed_page_end": "464",
          "source_sequence": 286
        }
      ],
      "source_text": "239. In these Cases Barclay, the great Champion of Absolute Monarchy, is forced to allow, That a King may be resisted, and ceases to be a King. That is in short, not to multiply Cases: In whatsoever he has no Authority, there he is no King, and may be resisted: For wheresoever the Authority ceases, the King ceases too, and becomes like other Men who have no Authority. And these two Cases he instances in, differ little from those above mention'd, to be destructive to Governments, only that he has omitted the Principle from which his Doctrine flows; and that is, The breach of trust, in not preserving the Form of Government agreed on, and in not intending the end of Government it self; which is the publick good and preservation of Property. When a King has Dethron'd himself, and put himself in a state of War with his People, what shall hinder them from prosecuting him who is no King, as they would any other Man, who has put himself into a state of War with them. Barclay, and those of his Opinion, would do well to tell us. Bilson, a Bishop of our Church, and a great Stickler for the Power and Prerogative of Princes, does, if I mistake not, in his Treatise of Christian Subjection, acknowledge, That Princes may forfeit their Power, and their title, to the Obedience of their Subjects; and if there needed authority in a Case where reason is so plain, I could send my Reader to Bracton, Fortescue, and the Author of the Mirror, and others, Writers, that cannot be suspected to be ignorant of our Government, or Enemies to it. But I thought Hooker alone might be enough to satisfie those Men, who relying on him for their Ecclesiastical Polity, are by a strange fate carried to deny those Principles upon which he builds it. Whether they are herein made the Tools of Cunninger Workmen, to pull down their own Fabrick, they were best look. This I am sure, their civil Policy is so new, so dangerous, and so destructive to both Rulers and People, that as former Ages never could bear the broaching of it; so it may be hoped, those to come, redeem'd from the Impositions of these Egyptian Under-Taskmasters, will abhor the Memory of such servile Platterers, who whilst it seem'd to serve their turn, resolv'd all Government into absolute Tyranny, and would have all Men born to what their mean Souls fitted them, Slavery.",
      "translation_ja": "第239節　こうした場合には、絶対君主政の大擁護者であるバークリーも、王が抵抗を受けてよく、王でなくなると認めざるをえない。つまり、場合をいくつも挙げずに手短に言えば、王に権威のない事柄では、その人は王ではなく、抵抗されてよい。権威が消えるところでは王も消え、権威のないほかの人と同じになるからである。彼の挙げるこの二例は、政府を破壊するものとして先に述べた事例と、あまり違わない。ただ、彼は自説の源である原理を抜かしている。それは、合意された政体を守らず、政府そのものの目的である公共の利益と財産の保全を目指さないことによって、信任を破ることである。王がみずから王座を降り、人民との戦争状態に入ったとき、もはや王ではない者を、人民に戦争状態を仕掛けた他の誰かと同じように追及するのを、何が妨げるのか。バークリーとその意見に与する者は、ぜひ教えてほしい。わが教会の司教であり、君主の力と大権を熱心に主張するビルソンも、私の思い違いでなければ、その『キリスト教徒の服従についての論考』で、君主が自らの権力と、臣民の服従を受ける権原を失いうることを認めている。理性に照らしてこれほど明らかな事柄について、なお権威を引く必要があるなら、読者にはブラクトンやフォーテスキュー、『鏡』の著者その他を挙げられる。わが国の政府を知らなかったとか、その敵であったとか疑えない著者たちである。だが、自分たちの教会統治についてはフッカーに頼りながら、奇妙な運命によって、フッカーがそこから論を組み立てた原理を否定する人たちを納得させるには、フッカー一人で十分だと思った。彼らは、より抜け目のない職人の道具となって、自分たちの建物を取り壊しているのではないか。よく考えた方がよい。これだけは確かである。彼らの政治論は、あまりに目新しく、危険で、統治者にも人民にも破滅を招くため、昔ならこれを説き始めることさえ許さなかっただろう。後の時代の人々も、こうしたエジプトの下働きの監督人による押しつけから解放され、卑しいおべっか使いたちの記憶を忌み嫌うことを願いたい。彼らは、自分たちの都合に合ううちは、政府をことごとく絶対的な圧政に変え、すべての人に、自分たちの卑しい心にふさわしい奴隷の身に生まれてほしいと望むのだから。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s240",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:238",
          "printed_page": "269",
          "source_sequence": 287
        }
      ],
      "source_text": "240. Here, 'tis like, the common Question will be made, who shall be Judge whether the Prince, or Legislative, act contrary to their Trust? This, perhaps, ill-affected, and factious Men may spread amongst the People, when the Prince only makes use of his due Prerogative. To this I reply; The People shall be Judge; for who shall be Judge whether his Trustee or Deputy acts well, and according to the Trust reposed in him, but he who deputes him, and must, by having deputed him; have still a Power to discard him, when he fails in his Trust? If this be reasonable, in particular Cases of private Men, why should it be otherwise in that of the greatest moment, where the Welfare of Millions is concerned, and also where the evil, if not prevented, is greater, and the Redress very difficult, dear, and dangerous?",
      "translation_ja": "第240節　ここで、いつもの問いが持ち出されるだろう。君主か立法機関が託された信任に反して行動しているかを、誰が裁くのか。おそらく悪意のある党派の人たちが、君主が当然の大権を使うだけのときにも、人民の間にこの問いを広めるかもしれない。これには、人民が裁く、と答える。受託者や代理人が、正しく、託された信任にかなうように行動しているかを判断するのは、その人を任じた者以外に誰だろう。また任じたからには、その信任に応えられなかったときに、その者を退ける力をなお持つべきなのも、任じた者である。私人の個々の問題でそれが理にかなうなら、何百万もの人々の福利に関わる、最も重大な場合に、なぜそうではないのか。しかも放っておけば害はさらに大きく、救済には大きな難しさと費用と危険が伴うのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s241",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:238",
          "printed_page": "269",
          "printed_page_end": "270",
          "source_sequence": 288
        }
      ],
      "source_text": "241. But farther, this Question, (Who shall be Judge?) cannot mean, that there is no Judge at all. For where there is no Judicature on Earth, to decide Controversies amongst Men, God in Heaven is Judge. He alone, 'tis true, is Judge of the Right. But every Man is Judge for himself, as in all other Cases, so in this, whether another hath put himself into a State of War with him, and whether he should appeal to the Supreme Judge, as Iephtha did.",
      "translation_ja": "第241節　しかし、さらに、「誰が裁くのか」というこの問いが、裁く者がまるでないことを意味するはずはない。この世に、人々の争いを裁く機関がないところでは、天上の神が裁き手だからだ。確かに正しいのがどちらかを裁くのは神だけである。だがほかのすべての場合と同じように、この場合も、相手が自分との戦争状態に入ったか、エフタと同じように最高の裁き手に訴えるべきかは、人それぞれが自ら判断する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s242",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:239",
          "printed_page": "270",
          "source_sequence": 289
        }
      ],
      "source_text": "242. If a Controversie arise betwixt a Prince, and some of the People, in a matter where the Law is silent, or doubtful, and the thing be of great Consequence, I should think, the proper Umpire, in such a Case, should be the Body of the People. For in Cases, where the Prince hath a Trust reposed in him, and is dispensed from the common, ordinary Rules of the Law; there, if any Men find themselves aggrieved, and think the Prince acts contrary to, or beyond that Trust, who so proper to judge, as the Body of the People, (who, at first, lodg'd that Trust in him) how far they meant it should extend? But if the Prince, or who-ever they be in the Administration, decline that way of Determination, the Appeal then lies no where but to Heaven. Force between either Persons, who have no known Superiour on Earth, or which permits no Appeal to a Judge on Earth, being properly a State of War, wherein the Appeal lies only to Heaven, and in that State the injured Party must judge for himself, when he will think fit to make use of that Appeal, and put himself upon it.",
      "translation_ja": "第242節　法が何も言わないか、不明確な事柄について、君主と人民の一部との間に争いが生まれ、しかもそれが重大であるなら、その場合にふさわしい仲裁者は、人民全体であるべきだと、私は思う。君主に信任が託されていて、法の日常の一般的な規則を免れている場合、被害を受けたと考え、君主が信任に反して、あるいはその範囲を越えて行動していると思う者がいるなら、初めにその信任を君主に託した人民全体以上に、自分たちがどこまで託すつもりだったかを判断するのにふさわしい者は、誰だろう。しかし君主や、その他政務に当たる者が、そのような決め方を拒むなら、訴え先は天よりほかにない。この世に共通して知られた上位者がいない者同士の間で用いられた力、あるいは、この世の裁判官に訴えることを許さない力は、まさに戦争状態である。そこでは天に訴えるほかに道はなく、その状態では、被害を受けた側が、いつ訴えることをよいと考え、自分をその判断に委ねるかを、自ら決めなければならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s243",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:239",
          "printed_page": "270",
          "printed_page_end": "271",
          "source_sequence": 290
        }
      ],
      "source_text": "243. To conclude, The Power that every individual gave the Society, when he entered into it, can never revert to the Individuals again, as long as the Society lasts, but will always remain in the Community; because without this, there can be no Community, no Commonwealth, which is contrary to the original Agreement: so also when the Society hath placed the Legislative in any Assembly of Men, to continue in them and their Successors, with Direction and Authority for providing such Successors, the Legislative can never revert to the People whilst that Government lasts: Because having provided a Legislative with Power, to continue for ever, they have given up their Political Power to the Legislative, and cannot resume it. But if they have set Limits to the Duration of their Legislative, and made this Supreme Power, in any Person, or Assembly, only temporary: Or else when, by the Miscarriages of those in Authority, it is forfeited; upon the Forfeiture of their Rulers, or at the Determination of the Time set, it reverts to the Society, and the People have a Right to act as Supreme, and continue the Legislative in themselves, or place it in a new Form, or new hands, as they think good.",
      "translation_ja": "第243節　結論として、社会に入るときに一人ひとりが社会へ与えた力は、社会が存続するかぎり、ふたたび個々人に戻ることはできず、常に共同体に残る。それがなければ、共同体も国家もないことになり、初めの合意に反するからである。同じように、社会が立法権をある人々の集まりに置き、その集まりとその後継者に続くものとし、後継者を備える手順と権限を定めたなら、その政府が存続する間、立法権は人民に帰ることはできない。永久に続く力を持つ立法機関を設けたとき、人民は自らの政治権力を立法機関に委ね、取り戻すことはできなくなったからである。だが、人民が立法機関の続く時間に限度をつけ、ある人や集まりのこの最高権力を一時的なものとした場合や、権威にある者の過ちのために、その権力が失われた場合には、統治者が権力を失ったとき、または定められた期間が終わったときに、それは社会に帰る。そこで人民には、最高の権力として行動し、立法権を自分たちのもとに保つことも、新たな形、あるいは新たな手に、ふさわしいと思うとおりに置くこともできる権利がある。",
      "translation_status": "reviewed"
    },

      ],
      "source_text": "6. But though this be a State of Liberty, yet it is not a State of Licence, though Man in that State have an uncontroleable Liberty, to dispose of his Person or Possessions, yet he has not Liberty to destroy himself, or so much as any Creature in his Possession, but where some nobler use, then its bare Preservation calls for it. The State of Nature, has a Law of Nature to govern it, which obliges every one, and reason, which is that Law, teaches all Mankind, who will but consult it; That being all equal and independent, no one ought to harm another in his Life, Health, Liberty or Possessions; for Men being all the Workmanship of one Omnipotent, and infinitely wise maker: All the Servants of one Sovereign Master, sent into the World by his order and about his business. They are his Property, whose Workmanship they are made to last during his, not one anothers Pleasure. And being Furnished with like Faculties, sharing all in one Community of Nature, there cannot be supposed any such Subordination among us, that may Authorize us to destroy one another, as if we were made for one anothers uses, as the inferior ranks of Creatures are for ours, every one as he is bound to preserve himself, and not to quit his Station willfully, so by the like reason when his own Preservation comes not in competition, ought he as much as he can to preserve the rest of Mankind, and not unless it be to do Justice on an offender, take a way, or impair the the life, or what tends to the Preservation of the Life, the Liberty, Health, Limb or Goods of another.",
      "translation_ja": "第6節　しかし、これは自由の状態ではあっても、何をしてもよい状態ではない。そこでは人は、自分自身や持ち物をどう扱おうと他人に制せられない自由を持っているが、自らを滅ぼす自由はなく、また手もとの生き物一つでさえ、ただ生かしておくよりも尊い用途がそれを求めないかぎり、滅ぼす自由はない。自然状態を律する自然法があり、これは誰もが守らねばならない。この法にほかならない理性は、耳を傾けさえすれば、人がみな平等で独立している以上、他人の生命、健康、自由、持ち物を害してはならないと教える。人はみな、全能で限りなく賢い一人の造り主が造ったものであり、一人の至高の主に仕え、その命令で、その御用のために世に遣わされている。造った方のものであって、互いの気まぐれによってではなく、造り主の意向に従うあいだ存続するよう造られている。さらに、同じような能力を備え、自然の一つの共同体を分かち合っているのだから、下等な生き物が私たちのために造られたように、人間も互いに他人の用途のために造られたとでもいうような、互いに滅ぼし合うことを許す上下関係があるとは考えられない。誰もが自分を保全し、勝手に持ち場を捨ててはならない。それと同じ理由で、自分の保全と衝突しないかぎり、できるだけ他の人々をも保全しなければならない。違反者に正当な裁きを加えるとき以外、他人の生命を奪ったり、生命の維持に役立つものや、自由、健康、身体、財物を取り上げたり損なったりしてはならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s007",
      "section_id": "ch-02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:117",
          "printed_page": "223",
          "printed_page_end": "224",
          "source_sequence": 17
        }
      ],
      "source_text": "7. And that all Men may be restrained from invading others Rights, and from doing hurt to one another, and the Law of Nature be observed, which willeth the Peace and Preservation of all Mankind, the Execution of the Law of Nature is in that State, put into every Mans hands, whereby every one has a Right to punish the transgressors of that Law to such a Degree, as may hinder its Violation. For the Law of Nature would, as all other Laws that concern Men in this World, be in vain, if there were no body that in the State of Nature, had a Power to Execute that Law, and thereby preserve the innocent and restrain offenders, and if any one in the State of Nature may punish another, for any evil he has done, every one may do so. For in that State of perfect Equality, where naturally there is no superiority or jurisdiction of one over another, what any may do in Prosecution of that Law, every one must needs have a Right to do.",
      "translation_ja": "第7節　人が他人の権利を侵し、互いを害することを食い止め、全人類の平和と保全を求める自然法を守らせるために、この状態では自然法の執行が一人ひとりの手に委ねられている。誰もが、その法への違反を食い止められる限度で、違反者を罰する権利を持つ。およそこの世で人に関わる法と同じように、自然状態で自然法を執行して、罪のない者を守り、違反者を抑える力を持つ者がいなければ、自然法は何の役にも立たない。自然状態で、犯された悪事についてある人が他人を罰することができるなら、誰もがそれをできる。完全に平等なこの状態では、生まれながらの優劣も、他人を裁く権限もないのだから、その法の執行のために一人ができることは、必ず誰にも行う権利があるはずだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s008",
      "section_id": "ch-02",
      "kind": "paragraph",

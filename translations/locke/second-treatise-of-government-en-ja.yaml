          "printed_page": "264",
          "printed_page_end": "266",
          "source_sequence": 60
        }
      ],
      "source_text": "46. The greatest part of things really useful to the Life of Man, and such as the necessity of subsisting made the first Commoners of the World look after, as it doth the Americans now, are generally things of short duration, such as, if they are not consumed by use, will decay and perish of themselves. Gold, Silver, and Diamonds, are things, that Phancy, or Agreement hath put the Value on, more than real Use, and the necessary Support of Life: Now of those good things which Nature hath provided in common, every one hath a Right (as hath been said) to as much as he could use, and had a Property in all he could effect with his Labour: all that his Industry could extend to, to alter from the State Nature had put it in, was his. He that gathered a Hundred Bushels of Acorns or Apples, had thereby a Property in them; they were his Goods, as soon as gathered. He was only to look that he used them before they spoiled; else he took more than his share, and robb'd others. And indeed it was a foolish thing, as well as dishonest, to hoard up more than he could make use of. If he gave away a part to any body else, so that it perished not uselesly in his Possession, these he also made use of. And if he also bartered away Plumbs, that would have rotted in a Week', for Nuts that would last good for his eating a whole Year, he did no injury; he wasted not the common Stock; destroyed no part of the portion of Goods that belonged to others, so long as nothing perished uselesly in his hands. Again, If he would give his Nuts for a piece of Metal, pleased with its colour; or exchange his Sheep for Shells, or Wooll for a sparkling Pebble or a Diamond, and keep those by him all his Life, he invaded not the Right of others; he might heap up as much of these durable things as he pleased: the exceeding of the bounds of his just Property not lying in the largeness of his Possession, but the perishing of any thing uselesly in it.",
      "translation_ja": "第46節　人間の暮らしに本当に役立つ物の大部分、つまりアメリカの人々がいまもそうするように、暮らしを支える必要に迫られて、世界を初めに共有した人々が求めた物は、たいてい長もちしない。使って消費しなければ、ひとりでに腐り、損なわれる。金、銀、ダイヤモンドは、現実に役立つとか、生命を支えるのに必要だとかいう以上に、人の好みや取り決めによって値打ちを得たものである。さて、自然が共有に供した有用な物のうち、人は誰でも、すでに述べたように、自分が使えるだけを得る権利を持ち、労働で手に入れられる物のすべてについて所有権を持った。勤勉に働いて、自然が置いた状態から変えることができたものは、みなその人のものだった。ドングリなりリンゴなりを百ブッシェル集めた人は、そうすることでその所有権を得た。それらは集めたとたんにその人の持ち物になった。ただし腐らないうちに使うよう心がける必要があった。さもなければ、自分の取り分以上を取り、ほかの人から奪ったことになる。使いきれないほど貯め込むのは、不正なばかりでなく愚かなことでもあった。一部を他の人に与え、自分の手にあるうちに役にも立たず腐らせることがなければ、それも使ったことになる。また、一週間で腐るスモモを、一年じゅう食べられる堅果と物々交換しても、誰にも害はない。何ひとつ自分の手もとで無駄に腐らなければ、共有の蓄えを浪費せず、ほかの人の取り分に属する物は失われない。さらに、色が気に入ったからと堅果を金属片と取り替えたり、羊を貝殻と、羊毛をきらめく小石やダイヤモンドと取り替えたりし、それを一生手もとに置いても、他の人の権利を侵すことにはならない。こうした長もちする物なら、いくらでも貯め込んでよかった。正当な所有の限度を超えるかどうかは、持ち物の量ではなく、その中の何かを無駄に腐らせたかどうかによるからである。",
      "translation_status": "reviewed"
    },
    {

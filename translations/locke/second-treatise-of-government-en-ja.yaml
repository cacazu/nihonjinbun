      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:187",
          "printed_page": "362",
          "printed_page_end": "363",
          "source_sequence": 171
        }
      ],
      "source_text": "139. But Government into whosesoever hands it is put, being as I have before shew'd, intrusted with this condition, and for this end, that Men might have and secure their Properties, the Prince or Senate, however it may have power to make Laws for the regulating of Property between the Subjects one amongst another, yet can never have a Power to take to themselves the whole, or any part of the Subjects Property, without their own consent. For this would be in effect to leave them no Property at all. And to let us see, that even absolute Power, where it is necessary, is not arbitrary by being absolute, but is still limited by that reason, and confined to those ends which required it in some Cases to be absolute, we need look no farther than the common practice of Martial Discipline. For the preservation of the Army, and in it of the whole Commonwealth, requires an absolute Obedience to the Command of every superiour Officer, and it is justly Death to disobey or dispute the most dangerous or unreasonable of them; but yet we see, that neither the Serjeant that could command a Souldier to march up to the mouth of a Cannon, or stand in a Breach where he is almost sure to perish; can command that Souldier to give him one penny of his money: nor the General that can condemn him to Death for deserting his Post, or not obeying the most desperate Orders, cannot yet with all his absolute Power of Life and Death, dispose of one Farthing of that Souldiers Estate, or seize one jot of his Goods; whom yet he can command any thing, and hang for the least disobedience. Because such a blind Obedience is necessary to that end for which the Commander has his Power, viz. the preservation of the rest, but the disposing of his goods has nothing to do with it.",
      "translation_ja": "第139節　政府が誰の手に置かれようとも、すでに示したように、人々が自分の財産を保有し、確保できるという条件と目的のもとで信任を託されている。したがって君主や議会は、臣民同士の所有を律する法律を制定する権力はあっても、本人の同意なしに、臣民の財産の全部なり一部なりを、自分のものにする権力は決して持ちえない。それでは事実上、臣民に何の財産も残さないことになるからだ。また、絶対権力でさえ、必要とされるときに絶対的であるというだけで恣意的になるわけではない。そうした事例で絶対的であることを求めた理由により、なお限度を持ち、その目的に限られることは、軍隊で一般に行われる規律を見れば分かる。軍の、ひいては国家全体の保全には、あらゆる上官の命令への絶対的な服従が必要であり、どんなに危険な命令でも無理な命令でも、背いたり異議を申し立てたりすれば、死罪とされるのは正当だとされる。それでも、砲口の前まで進めと、あるいはほとんど生き残れそうにない城壁の破れ口に立てと兵士に命じることのできる軍曹も、その兵士に一ペニーの金も渡せとは命じられない。持ち場を捨てたり、最も危険な命令に従わなかったりしたために、兵士を死罪にできる将軍も、どれほど絶対的な生殺の力を持つとはいえ、その兵士の財産の四分の一ペニーを処分することも、持ち物をほんの少し取り上げることもできない。何でも命じ、ささいな不服従で絞首刑にできる相手についてさえ、そうである。そうした盲目的な服従は、指揮官に力が与えられた目的、すなわちほかの人々の保全に必要だが、その兵士の財産を処分することは、その目的に何の関係もないからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s140",
      "section_id": "ch-11",
      "kind": "paragraph",

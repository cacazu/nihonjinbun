          "printed_page_end": "309",
          "source_sequence": 107
        }
      ],
      "source_text": "90. And hence it is evident, that Absolute Monarchy which by some Men is counted for the only Government in the World, is indeed inconsistent with civil Society, and so can be no Form of civil Government at all: For the end of civil Society, being to avoid and remedy those inconveniencies of the state of Nature which necessarily follow from every Man's being Judge in his own Case, by setting up a known Authority, to which every one of that Society may appeal upon any injury received, or Controversy that may arise, and which every one of the Society ought to obey. Whereever any persons are who have not such an authority to appeal to, and decide any difference between them there, those persons are still in the state of nature. And so is every absolute Prince in respect of those who are under his Dominion.",
      "translation_ja": "第90節　だから、ある人々が世の中で唯一の政府と見なす絶対君主政は、実は市民社会と両立せず、いかなる意味でも市民政府の一形態ではありえない。市民社会の目的は、誰もが自分の事件で裁判官になることから避けがたく生じる、自然状態の不都合を避け、正すことにある。そのため、受けた被害や起きそうな争いについて誰でも訴えることができ、社会の成員全員が従うべき、誰もが知る権威を設ける。人々の争いを決着させる、このような訴え先のないところでは、人々はなお自然状態にいる。そしてすべての絶対君主が、自分の支配下にある人々に対して置かれているのは、この状態にほかならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-n02",
      "section_id": "ch-07",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

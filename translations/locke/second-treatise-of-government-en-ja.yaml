        }
      ],
      "source_text": "72. Though the Obligation on the Parents to bring up their Children, and the Obligation on Children to honour their Parents, contain all the Power on the one hand, and Submission on the other, which are proper to this Relation; yet there is another Power, ordinarily, in the Father, whereby he has a tye on the Obedience of his Children, which, though it be common to him with other men, yet the Occasions of shewing it, almost constantly happening to Fathers in their private Families, and in Instances of it else-where being rare, and less taken notice of, it passes in the World for a part of paternal Iurisdiction. And this is the Power Men generally have, to bestow their Estates on those who please them best. The Possession of the Father, being the Expectation and Inheritance of the Children ordinarily, in certain proportions, according to the Law and Custom of each Country; yet it is commonly in the Father's Power to bestow it with a more sparing or liberal hand, according as the Behaviour of this or that Child hath comported with his Will and Humour.",
      "translation_ja": "第72節　子を育てる親の義務と、親を敬う子の義務とには、この関係に固有の、一方の権力と他方の服従のすべてが含まれている。だが父には普通、子どもの服従を確かなものとする、別の権力がある。それは父にだけでなく、ほかの人にもあるのだが、父が家庭でそれを行使する機会はほとんどいつもあり、ほかの関係での実例はまれであまり目につかない。そのため世間では、これも父の権限の一部とされている。つまり、一般に人が、自分の財産を、最も自分の気に入った人に譲り渡せることである。父の所有物は普通、その国の法と慣習に従い、一定の割合で子の相続分になると見込まれている。それでも、どの子の振る舞いが自分の意向や気持ちにかなったかによって、多めに与えたり少なめに与えたりできるのは、一般に父の裁量のうちである。",
      "translation_status": "reviewed"
    },
    {

          "printed_page": "293",
          "source_sequence": 90
        }
      ],
      "source_text": "It is no improbable Opinion, therefore, which the Arch-Philosopher was of, That the chief Person in every Houshold, was always, as it were, a King; so when Numbers of Housholds joyn'd themselves in civil Societies together, Kings were the first kind of Governours amongst them, which is also, as it seemeth, the reason why the name of Fathers continued still in them, who of Fathers, were made Rulers; as also the ancient Custom of Governours to do as Melchizedec, and being Kings, to exercise the Office of Priests, which Fathers did, at the first grew, perhaps, by the same Occasion. Howbeit, this is not the only kind of Regiment that has been received in the World. The Inconveniences of one kind have caused sundry other to be devised, so that, in a word, all publique Regiment, of what kind soever, seemeth evidently to have risen from the deliberate Advice, Consultation and Composition between Men, judging it convenient, and behovefull, there being no impossibility in Nature, considered by it self, but that Man might have lived without any publique Regiment. Hooker's Eccl. l. 1. §. 10.",
      "translation_ja": "「だから、大家であるあの哲学者が、家々で最も重きをなす者はいつもいわば王であったと考えたのも、ありそうにない説ではない。多くの家が集まって市民社会になると、その間で最初のかたちの統治者になったのは王だった。父から統治者となった人々が、なおも父と呼ばれたのは、このためであるように見える。統治者がメルキゼデクのように、王であると同時に、初めは父の務めであった祭司の職を担った古い慣習も、同じ事情から生まれたのかもしれない。もっとも、世に受け入れられた統治は、この一種類だけではない。一つのやり方に不都合があれば、そのためにさまざまな別のやり方が考え出された。ひと言でいえば、どんな形の公の統治も、それが都合がよく役に立つと考えた人々が、熟慮して助言を求め、協議し、取り決めを交わした結果として生じたのは明らかである。自然そのものだけを考えるなら、人は公の統治なしに生きられなかったわけではないのだから。」フッカー『教会統治の法』第一巻第十節。",
      "translation_status": "reviewed"
    },

      "source_text": "41. There cannot be a clearer demonstration of any thing, than several Nations of the Americans are of this, who are rich in Land, and poor in all the Comforts of Life; whom Nature having furnished as liberally as any other people, with the materials of Plenty, i. e. a fruitful Soil, apt to produce in abundance, what might serve for food, rayment, and delight; yet for want of improving it by labour, have not 1/100 part of the Conveniencies we enjoy. And a King of a large and fruitful Territory there, feeds, lodges, and is clad worse than a day Labourer in England.",
      "translation_ja": "第41節　この点を最もはっきり示すのは、土地には恵まれながら、暮らしの快適さには乏しい、アメリカの幾つかの民族である。自然は他のどの民族にも劣らず豊かに、食物、衣服、楽しみに役立つものをふんだんに生みうる肥沃な土、つまり豊かさのもとを与えた。それでも、労働によってそれに手を入れなかったために、私たちが享受する暮らしの便宜の百分の一にも恵まれていない。広く肥沃な領土の王でさえ、食べる物も、住まいも、身に着ける物も、イングランドの日雇い労働者より劣っているのである。",

      "source_text": "204. To this I answer: That Force is to be opposed to nothing but to unjust and unlawful Force; who ever makes any opposition, in any other Case, draws on himself a just Condemation, both from God and Man; and so no such Danger or Confusion will follow, as is often suggested. For,",
      "translation_ja": "第204節　これにはこう答える。力で対抗するのは、不正かつ不法な力に対してだけである。ほかの場合に抵抗に出る者は、神と人との双方から、正当に非難される。だから、しばしば危ぶまれるような危険や混乱は生じない。その理由を挙げよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s205",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:218",
          "printed_page": "425",
          "printed_page_end": "426",
          "source_sequence": 245
        }
      ],
      "source_text": "205. First, As, in some Countries, the Person of the Prince, by the Law, is Sacred, and so, what-ever he commands, or does, his Person is still free from all Question or Violence; not liable to Force, or any judicial Censure or Condemnation. But yet opposition may be made to the illegal Acts of any inferiour Officer, or other commissioned by him; unless he will, by actually putting himself into a State of War with his People, dissolve the Government, and leave them to that defence, which belongs to every one in the state of Nature. For of such things who can tell what the end will be? And a Neighbour Kingdom has shewed the World an odd Example. In all other Cases the Sacredness of the Person exempts him from all Inconveniencies, whereby he is secure, whilst the Government stands, from all violence and harm whatsoever. Than which, there cannot be a wiser Constitution. For the harm he can do, in his own Person, not being likely to happen often, nor to extend it self far; nor being able, by his single strength, to subvert the Laws, nor oppress the Body of the People, should any Prince have so much Weakness, and ill Nature as to be willing to do it. The Inconveniency of some particular mischiefs that may happen, sometimes, when a heady Prince comes to the Throne, are well recompenced by the peace of the Publick, and security of the Government, in the Person of the chief Magistrate, thus set out of the reach of danger. It being safer for the Body, that some few private Men should be sometimes in danger to suffer, than that the Head of the Republick should be easily, and upon slight occasions exposed.",
      "translation_ja": "第205節　第一に、ある国では、法によって君主の身が不可侵とされ、何を命じ、何を行おうとも、君主自身が責められたり、暴力を向けられたりすることはない。力で抗されることも、司法の非難や処罰を受けることもない。それでも、下位の官吏や君主から委任を受けたほかの者の違法な行いには、抵抗できる。ただし、君主自身が現に人民との戦争状態に入り、政府を解体して、自然状態にあれば誰にも属する自衛を人民に任せる場合は別である。そのようなことがどんな結末を迎えるか、誰に分かるだろう。近隣のある王国が、その珍しい例を世に示した。ほかのすべての場合には、不可侵の身であるために、君主はあらゆる不都合を免れ、政府が存続するかぎり、どんな暴力や害からも安全である。これほど賢明な国制はない。たとえある君主が、それを望むほど意志が弱く、性質が悪くても、君主が自分の身一つで与えられる害は、たびたび起きたり遠くまで及んだりする見込みが小さく、ただ一人の力で法律を覆し、人民全体を抑圧することはできないからである。向こう見ずな君主が王位についたとき、ときどき起きうる個別の害の不都合は、最高の公職者の身がこうして危険の届かないところに置かれることによる、公の平和と政府の安全で、十分に償われる。国全体にとっては、私人の少数がときに被害の危険にさらされる方が、国の長が、ささいなことでたやすく危険にさらされるよりも、安全だからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s206",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:219",
          "printed_page": "426",
          "printed_page_end": "427",
          "source_sequence": 246
        }
      ],
      "source_text": "206. Secondly, But this Priviledge belonging only to the King's Person, hinders not but they may be questioned, opposed, and resisted, who use unjust force, though they pretend a Commission from him, which the Law authorizes not. As is plain, in the Case of him that has the King's Writ to arrest a Man, which is a full Commission from the King; and yet he that has it cannot break open a Man's House to do it, nor execute this Command of the King upon certain days, nor in certain places, though this Commission have no such exception in it; but they are the Limitations of the Law, which, if any one transgress, the King's Commission excuses him not. For the King's Authority being given him only by the Law, he cannot impower any one to act against the Law, or justifie him, by his Commission, in so doing. The Commission, or Command of any Magistrate, where he has no Authority, being as void and insignificant as that of any private Man. The difference, between the one and the other, being, that the Magistrate has some Authority, so far, and to such ends, and the private Man has none at all. For 'tis not the Commission, but the Authority, that gives the Right of acting; and against the Laws there can be no Authority. But, notwithstanding such Resistance, the King's Person and Authority are still both secured, and so no danger to Governour or Government.",
      "translation_ja": "第206節　第二に、この特権は王の身にだけ属するので、不正な力を用いる者が、国王の委任を受けたと称しても、それが法で認められないなら、その者を問いただし、抵抗し、力に抗することを妨げない。ある人を逮捕する国王の令状を持つ者の例を見れば明らかだ。その令状は国王からのれっきとした委任であるが、それを持つ者は、逮捕のために人の家へ押し入ることも、一定の日や一定の場所で国王の命令を執行することもできない。委任そのものにその例外が書かれていなくても、これは法による制限であり、誰かがこれを越えれば、国王の委任でその者の行為が免責されることはない。国王の権威を与えるのは法だけだから、法に反して行動する権限を誰かに与えることも、委任によってその行為を正当化することもできないのである。権限のないところで公職にある者が出す委任や命令は、一私人のものと同じく、効力も意味もない。相違はただ、公職者にはある限度まで、ある目的のための権威があるが、私人にはそれがまったくないことである。行動する権利を授けるのは委任ではなく権威であり、法律に背くことに権威はありえない。しかも、こうした抵抗があっても、国王の身も権威も守られたままであり、統治者にも政府にも危険はない。",
      "translation_status": "reviewed"
    },

          "printed_page": "389",
          "printed_page_end": "390",
          "source_sequence": 202
        }
      ],
      "source_text": "167. The Power of calling Parliaments in England, as to precise time, place, and duration, is certainly a Prerogative of the King, but still with this trust, that it shall be made use of for the good of the Nation, as the exigencies of the Times, and variety of Occasion shall require. For it being impossible to foresee which should always be the fittest place for them to assemble in, and what the best season: the choice of these was left with the Executive Power, as might be best subservient to the publick good, and best suit the ends of Parliaments.",
      "translation_ja": "第167節　イングランドで議会の招集の日時、場所、会期を具体的に決める力は、確かに国王の大権である。ただし、時の切迫した事情やさまざまな場合に応じて、国の利益に用いるという信任を伴う。集まる場所や時期として何がいつもいちばん適しているかを、前もって見通すことはできない。だからそれを選ぶことは、公共の利益に最も役立ち、議会の目的にも最もかなうよう、執行権を持つ者に委ねられていた。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s168",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:201",
          "printed_page": "390",
          "printed_page_end": "391",
          "source_sequence": 203
        }
      ],
      "source_text": "168. The old Question will be asked in this matter of Prerogative, But who shall be Judge when this Power is made a right use of? I answer: Between an Executive Power in being, with such a Prerogative, and a Legislative, that depends upon his will for their convening, there can be no Judge on Earth. As there can be none between the Legislative and the People, should either the executive, or the Legislative, when they have got the Power in their hands, design, or go about to enslave or destroy them. The People have no other remedy in this, as in all other cases, where they have no Judge on earth, but to appeal to Heaven. For the Rulers, in such attempts, exercising a Power the people never put into their hands, who can never be supposed to consent that any body should rule over them for their harm, do that which they have not a right to do. And where the Body of the People, or any single Man, are deprived of their Right, or are under the Exercise of a power without right, having no Appeal on earth, they have a liberty to appeal to Heaven, when-ever they judge the Cause of sufficient moment. And therefore, though the People cannot be Judge, so as to have, by the Constitution of that Society, any Superiour power, to determine and give effective Sentence in the case; yet they have reserv'd that ultimate Determination to themselves, which belongs to all Mankind, where there lies no Appeal on Earth; by a Law antecedent, and paramount to all positive Laws of Men, whether they have just Cause to make their Appeal to Heaven. And this Judgment they cannot part with, it being out of a Man's power so to submit himself to another, as to give him a liberty to destroy him; God and Nature never allowing a Man so to abandon himself, as to neglect his own preservation. And since he cannot take away his own Life, neither can he give another power to take it. Nor let any one think this lays a perpetual foundation for Disorder; for this operates not till the Inconvenience is so great, that the Majority feel it, and are weary of it, and find a necessity to have it amended. And this the Executive Power, or wise Princes never need come in the danger of. And 'tis the thing, of all others, they have most need to avoid, as, of all others, the most perilous.",
      "translation_ja": "第168節　大権については、昔からの問いが持ち出されよう。「ではこの力が正しく使われたかを、誰が裁くのか。」こう答えたい。このような大権を備え、現に存在する執行権と、その意向に従わなければ集まれない立法機関との間には、この世の裁き手はありえない。立法機関と人民の間にも、執行権または立法権を握った者が、人民を奴隷にしたり滅ぼしたりしようと企て、あるいはそれを始めるなら、裁き手はいない。この世の裁き手がいないほかのすべての場合と同様、人民には天に訴えるほかに救いはない。統治者はそのような企てによって、人民が一度も授けなかった力を使い、権利のないことをしている。人民が、自分を害するために誰かに治められることに同意するなど、考えられないからだ。人民全体あるいは一個人が、権利を奪われ、または権利のない力の行使を受け、地上に訴え先がなければ、十分重大な事柄だと判断するとき、天に訴える自由を持つ。したがって、その社会の国制によって、争いを決着させ、効力のある判決を出す上位の力を持つという意味では、人民は裁判官になれない。それでも、地上に訴える先がないときの最後の判断、つまり天へ訴える正当な理由があるかどうかを判断する力は、人民自身に残されている。それは、人間の実定法のすべてに先立ち、それを超える法により、全人類に属する。この判断を手放すことはできない。他人が自分を滅ぼしてよいほどに、自分を他人に従わせる力は人にはなく、自己の保全を怠るほどに自分を見捨てることは、神も自然も許さないからだ。自分の命を奪うことも許されていないのだから、それを奪う力を他人に与えることもできない。だが、これが絶え間ない混乱の種をまくと考えてはならない。不都合が大きくなりすぎ、多数者がそれを感じ、耐えられず、改める必要を認めるまでは、この判断は働かないからである。執行権を持つ者や賢い君主は、この危険に陥る必要はない。そしてこれは何よりも危険なことだから、ほかの何にもまして避けなければならない。",
      "translation_status": "reviewed"
    },
    {

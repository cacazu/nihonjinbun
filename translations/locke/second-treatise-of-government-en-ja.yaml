          "anchor": "tcp:96077:144",
          "printed_page": "276",
          "source_sequence": 73
        }
      ],
      "source_text": "58. The Power, then, that Parents have over their Children, arises from that Duty which is incumbent on them, to take care of their Off-spring, during the imperfect state of Childhood. To inform the Mind, and govern the Actions of their yet ignorant Nonage, till Reason shall take its place, and ease them of that Trouble, is what the Children want, and the Parents are bound to. For God haing given Man an Understanding to direct his Actions, has allowed him a freedom of Will, and liberty of Acting, as properly belonging thereunto, within the bounds of that Law he is under. But whilst he is in an Estate, wherein he has no Understanding of his own to direct his Will, he is not to have any Will of his own to follow: He that understands for him, must will for him too; he must prescribe to his Will, and regulate his Actions; but when he comes to the estate that made his Father a Free-man, the Son is a Free-man too.",
      "translation_ja": "第58節　したがって、親が子に対して持つ権力は、子どもが未熟な間、自分の子を世話するという、親に課された義務から生じる。子どもの理性が代わってその役目を果たし、親をその労から解放するまで、まだ何も知らない未成年の子の心を育て、その行動を導くことが、子に必要であり、親の務めである。神は、人の行動を導く分別を人に授けた。それにふさわしく、服する法の範囲で、自由に意志を持ち、自由に行動することも認めた。けれども自らの意志を導く分別がまだないうちは、自分だけの意志を持ってそれに従うわけにはいかない。代わりに分別を働かせる者が、代わりに意志を決め、その子の意志に方向を与え、行動を律しなければならない。だが、父を自由人としたのと同じ状態に達すれば、子も自由人である。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s059",
      "section_id": "ch-06",
      "kind": "paragraph",

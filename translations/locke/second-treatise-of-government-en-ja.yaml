          "precision": "page",
          "anchor": "tcp:96077:184",
          "printed_page": "357",
          "source_sequence": 168
        }
      ],
      "source_text": "Humane Laws are measures in respect of Men whose actions they must direct, howbeit such measures they are as have also their higher Rules to be measured by, which Rules are two, the Law of God, and the Law of Nature; so that Laws humane must be made according to the general Laws of Nature, and without contradiction to any positive Law of Scripture, otherwise they are ill made. Ibid. l. 3. § 9. To constrain Men to any thing inconvenient doth seem unreasonable. Ibid. l. 1. §. 10.",
      "translation_ja": "「人が定める法は、行いを導くべき人間にとっての尺度である。けれども、それ自身がそれに照らして測られる、より高い規則を持つ尺度なのだ。その規則は二つあり、神の法と自然法である。したがって、人の法は、自然の一般的な法に従って制定され、聖書の明示された法のどれとも矛盾してはならない。さもなければ、よく作られた法ではない。」同書第三巻第九節。「人に都合の悪いことを無理にさせるのは、理に反するように思われる。」同書第一巻第十節。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s137",
      "section_id": "ch-11",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:185",
          "printed_page": "358",
          "printed_page_end": "360",
          "source_sequence": 169
        }
      ],
      "source_text": "137. Absolute Arbitrary Power, or Governing without setled standing Laws, can neither of them consist with the ends of Society and Government, which Men would not quit the freedom of the state of Nature for, and tie themselves up under, were it not to preserve their Lives, Liberties and Fortunes; and by stated Rules of Right and Property to secure their Peace and Quiet. It cannot be suppos'd, that they should intend, had they a power so to do, to give any one or more an absolute Arbitrary Power over their Persons and Estates, and put a force into the Magistrates hand to execute his unlimited Will arbitrarily upon them: this were to put themselves into a worse condition than the state of Nature, wherein they had a Liberty to defend their Right against the Injuries of others, and were upon equal terms of force to maintain it, whether invaded by a single Man, or many in Combination. Whereas by supposing they have given up themselves to the absolute Arbitrary Power and Will of a Legislator, they have disarmed themselves, and armed him to make a prey of them when he pleases. He being in a much worse condition, that is exposed to the Arbitrary Power of one Man who has the Command of 100000. than he that is expos'd to the Arbitrary Power of 100000. single Men, no Body being secure, that his Will, who has such a Command, is better than that of other Men, though his Force be 100000. times stronger. And therefore whatever Form the Commonwealth is under, the Ruling Power ought to govern by declared and received Laws, and not by extempory dictates and undetermin'd Resolutions. For then Mankind will be in a far worse condition than in the state of Nature, if they shall have armed one or a few Men with the joint power of a multitude, to force them to obey at pleasure the exorbitant and unlimited decrees of their sudden thoughts, or unrestrain'd, and till that moment unknown Wills without having any measures set down which may guide and justifie their actions. For all the power the Government has, being only for the good of the Society, as it ought not to be Arbitrary and at Pleasure: so it ought to be exercised by established and promulgated Laws; that both the People may know their Duty, and be safe and secure within the limits of the Law, and the Rulers too kept within their due bounds, and not be tempted by the power they have in their hands to imploy it to purposes, and by such measures as they would not have known, and own not willingly.",
      "translation_ja": "第137節　絶対的で恣意的な権力も、確立した恒常的な法律なしに治めることも、社会と政府の目的には両立しえない。人々は、生命、自由、財産を保全し、権利と所有について定められた規則で、平和と平穏を確かにするのでなければ、そうした目的のために自然状態の自由を手放して、制約の下に身を置かなかっただろう。たとえそうできる力を持っていたとしても、一人か複数の者に、自分たちの身体と財産に対する絶対的で恣意的な力を与え、公職者が自分の意志を何の限度もなく人々に押しつけられる力まで手渡そうとしたとは考えられない。それでは、自然状態よりも悪い境遇に落ちることになる。自然状態では、他人からの害に対して自分の権利を守る自由があり、一人から侵害されようと何人もの結託から侵害されようと、権利を守るには力の上で同じ条件にいた。これに対して立法者の絶対で恣意的な権力と意志に自分たちを引き渡したことにすると、自分たちは力を手放し、立法者には、気の向くままに自分たちを獲物にする力を与えたことになる。十万人に命じられる一人の恣意的な権力にさらされる者は、十万人が一人ずつ振るう恣意的な力にさらされる者より、ずっとひどい境遇にいる。その一人の力が十万倍強くても、その意志がほかの人より良いとは、誰にも保証できないからだ。だから国家がどんな形をとっていても、統治する力は、公にされ、認められた法律で治め、その場かぎりの命令や、定まっていない決定で治めるべきではない。もし、人々が大勢の力を合わせて一人か少数の人の手に与え、その人たちが、突発的な思いつきや、抑えがきかずその時まで誰も知らなかった意志から出る、行き過ぎた無制限な布告に、人々を好きなときに従わせ、しかも人々を導き、その行いを正当と認める規準も定めていないなら、人類の境遇は自然状態よりはるかに悪くなってしまう。政府の持つ力はみな社会のためだけにあるのだから、好きなように恣意的に使ってはならないのと同じように、確立し公布された法によって行使すべきである。そうすれば、人民は自分の義務を知り、法の範囲内で安全を保つことができる。また統治者も、しかるべき限度にとどめられ、手の内にある力を、人々には知られたくなく、人々が進んで認めるわけでもない目的ややり方に、使ってみたいという誘惑にかられずにすむ。",
      "translation_status": "reviewed"
    },

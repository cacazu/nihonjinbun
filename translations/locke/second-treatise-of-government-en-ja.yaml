      "source_text": "38. The same measures governed the Possession of Land too: Whatsoever he tilled and reaped, laid up and made use of, before it spoiled, that was his peculiar Right; whatsoever he enclosed, and could feed, and make use of, the Cattle and Product was also his. But if either the Grass of his Inclosure rotted on the Ground, or the Fruit of his planting perished without gathering, and laying up, this part of the Earth, notwithstanding his Inclosure, was still to be looked on as Waste, and might be the Possession of any other. Thus, at the beginning, Cain might take as much Ground as he could till, and make it his own Land, and yet leave enough to Abel's Sheep to feed on; a few Acres would serve for both their Possessions. But as Families increased, and industry inlarged their stocks, their Possessions inlarged with the need of them; but yet it was commonly without any fixed property in the ground they made use of, till they incorporated, setled themselves together, and built Cities, and then, by consent, they came in time, so set out the bounds of their distinct Territories, and agree on limits between them and their Neighbours; and by Laws within themselves, setled the Properties of those of the same Society. For we see, that in that part of the World which was first inhabited, and therefore like to be best peopled, even as low down as Abraham's time, they wandered with their Flocks, and their Herds, which was their substance, freely up and down; and this Abraham did, in a Country where he was a stranger. Whence it is plain, that, at least, a great part of the Land lay in Common. That the Inhabitants valued it not, nor claimed Property in any more than they made use of. But when there was not room enough in the same place, for their Herds to feed together, they, by consent, as Abraham and Lot did, Gen. xiii. 5. separated and inlarged their Pasture, where it best liked them. And for the same Reason Esau went from his Father, and his Brother, and planted in Mount Seir, Gen. xxxvi. 6.",
      "translation_ja": "第38節　土地の所有にも同じ尺度が当てはまった。耕して収穫し、蓄えて、腐る前に使ったものは、その人に固有の権利に属した。また、囲い込んだ土地も、そこで家畜を養い、家畜や産物を利用できるかぎり、その人のものだった。だが、囲ったところに生えた草がその場で腐ったり、植えた木の実が集めて蓄えられないまま腐ったりすれば、囲いがあってもその部分は荒れ地とみなされ、他の誰でも所有できた。こうして、初めにカインが耕しきれるだけの土地を自分のものとしても、アベルの羊にはなお十分な牧草が残った。二人の所有には、数エーカーもあれば足りたのである。しかし家族が増え、勤勉によって蓄えが増すにつれ、必要に応じて所有する土地も広がった。それでも、人々が一つの社会にまとまり、共に定住して都市を築くまでは、使っている土地に確定した所有権は普通なかった。都市を築いてから、時が経つにつれ、同意によってそれぞれの領土の境を定め、隣人との境界を取り決め、内部では法によって同じ社会の成員の所有権を確定した。そもそも、世界で最初に人が住み、したがって最も人口が多かったと思われる地域でさえ、アブラハムの時代になってもなお、人々はその財産である羊や牛の群れを連れて、行きたいところへ自由に移り歩いていた。アブラハム自身も、よそ者であった国でそうしていた。これから、大地は少なくとも相当の部分が共有であったと分かる。住民は土地を重んじず、自分の使う範囲を超えて所有を主張しなかったのである。しかし同じところで双方の家畜を放すには狭すぎるとなると、アブラハムとロトのように、互いに同意して分かれ、好みの地で放牧地を広げた（『創世記』13章5節）。同じ理由でエサウも父と弟のもとを離れ、セイル山に住み着いた（同36章6節）。",
      "translation_status": "reviewed"
    },

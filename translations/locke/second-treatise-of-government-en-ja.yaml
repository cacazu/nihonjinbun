    {
      "id": "locke-s063",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:146",
          "printed_page": "281",
          "printed_page_end": "282",
          "source_sequence": 78
        }
      ],
      "source_text": "63. The Freedom then of Man, and Liberty of acting, according to his own Will, is grounded on his having Reason, which is able to instruct him in that Law he is to govern himself by, and make him know how far he is left to the freedom of his own will. To turn him loose to an unrestrain'd Liberty, before he has Reason to guide him, is not the allowing him the priviledge of his Nature, to be free; but to thrust him out amongst Brutes, and abandon him to a state as wretched, and as much beneath that of a Man, as theirs. This is that which puts the Authority into the Parents hands to govern the Minority of their Children. God hath made it their business to imploy this Care on their Off-spring, and hath placed in them suitable Inclinations of Tenderness and Concern to temper this power, to apply it as his Wisdom designed it, to the Childrens good, as long as they should need to be under it.",
      "translation_ja": "第63節　このように、人が自由で、自分の意志どおりに行動できる根拠は、人が理性を持つことにある。理性は、自分の行動をどの法で律し、どこまで自分の意志の自由に委ねられているかを教えられるからだ。理性に導かれる前に、人を何の制約もない自由の中に放り出すのは、自由であるという本性上の特権を認めることではない。人を獣の中へ押し出し、獣と同じほど惨めで、人間にふさわしい状態に遠く及ばない境遇に放置することだ。このため、子が未成年のあいだ導く権威が親の手に置かれている。神は、わが子のためにそのように心を配ることを親の役目とし、その権力を和らげるのにふさわしい優しさや気遣いを親のうちに置いた。その権力が必要なあいだ、神が知恵によって意図したとおり、子のために用いられるようにしたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s064",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:147",
          "printed_page": "282",
          "source_sequence": 79
        }
      ],
      "source_text": "64. But what reason can hence advance this Care, of the Parents, due to their Off-spring, into an Absolute, Arbitrary Dominion of the Father, whose power reaches no farther, than by such a Discipline, as he finds most effectual, to give such strength and health to their Bodies, such vigour and rectitude to their Minds, as may best fit his Children to be most useful to themselves and others; and, if it be necessary to his Condition, to make them work, when they are able, for their own Subsistence. But, in this power, the Mother too has her share with the Father.",
      "translation_ja": "第64節　しかし、親が子に当然払うべきこの世話を、どういう理屈で、父の絶対的で恣意的な支配権にまで押し広げられるだろう。父の権力が及ぶのは、自分が最も効果的と思うしつけによって、子の身体に力と健康を、心に活力と正しさを与え、子が自分にも他の人にもできるだけ役立てるよう育てるところまでだ。父の境遇からそれが必要なら、子が働けるようになったとき、自分の生活を支えるために働かせるところまでである。だがこの権力には、父だけでなく母もあずかるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s065",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

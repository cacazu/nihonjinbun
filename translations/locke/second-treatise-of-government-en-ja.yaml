      ],
      "source_text": "CHAP. VI. Of Paternal Power.",
      "translation_ja": "第六章　父権について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s052",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:141",
          "printed_page": "271",
          "printed_page_end": "272",
          "source_sequence": 67
        }
      ],
      "source_text": "52. IT may perhaps be censured an impertinent Criticism in a discourse of this nature, to find fault with words and names that have obtained in the World: And yet possibly it may not be amiss to offer new ones when the old are apt to lead Men into mistakes, as this of Paternal Power probably has done, which seems so to place the Power of Parents over their Children wholly in the Father, as if the Mother had no share in it; whereas if we consult Reason or Revelation, we shall find she hath an equal title; which may give one reason to ask, Whether this might not be more properly called Parental Power? For whatever obligation Nature and the right of Generation lays on Children; it must certainly bind them equal to both the concurrent Causes of it. And accordingly we see the Positive Law of God every where joins them together, without distinction, when it commands the Obedience of Children, Honour thy Father and thy Mother, Exod. 20. 12. Whosoever curseth his Father or his Mother, Lev. 20. 9. Ye shall fear every Man his Mother and his Father, Lev. 19. 3. Children obey your Parents, &c. Eph. 6. 1. is the stile of the Old and New Testament.",
      "translation_ja": "第52節　すでに世に定着した言葉や名称に難をつけるのは、このような論考にはふさわしくないと、非難されるかもしれない。だが、古い呼び名が人を誤りに導きやすいなら、新しい呼び名を提案してもよいのではないか。「父権」という呼び名もおそらくそうした誤りを生んだ。両親が子に対して持つ権力が、すべて父親に属し、まるで母親にはその分け前がないように見えるからである。ところが理性に聞いても啓示に聞いても、母親にも等しい権原があると分かる。それなら、むしろ「親権」と呼ぶべきではないかと問う理由がある。自然と、子をもうけたという権利によって、子にどんな義務が課されるにせよ、確かにそれは、共に子をもうけた両親の双方に等しく子を結びつける。それゆえ、神が明示した法は、子どもに従うよう命じる場合、どこでも父と母を区別せず、並べて挙げている。「父と母を敬いなさい」（『出エジプト記』20章12節）、「父または母をのろう者は」（『レビ記』20章9節）、「おのおの、その母と父を畏れなさい」（同19章3節）、「子どもたちよ、両親に従いなさい」云々（『エフェソの信徒への手紙』6章1節）。旧約も新約も、このように語るのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s053",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:142",
          "printed_page": "272",
          "source_sequence": 68
        }
      ],
      "source_text": "53. Had but this one thing been well consider'd, without looking any deeper into the matter, it might perhaps have kept men from running into those gross mistakes they have made about this Power of Parents, which however it might, without any great harshness, bear the name of Absolute Dominion, and Regal Authority, when under the title of Paternal Power, it seem'd appropriated to the Father; would yet have sounded but odly, and in the very name shewn the absurdity, if this supposed Absolute Power over Children had been called Parental, and thereby discover'd that it belong'd to the Mother too: For it will but very ill serve the turn of those Men who contend so much for the Absolute Power and Authority of the Fatherhood, as they call it, that the Mother should have any share in it. And it would have but ill supported the Monarchy they contend for, when by the very name it appeared, that that Fundamental Authority from whence they would derive their Government of a single Person only, was not plac'd in one, but two Persons jointly. But to let this of names pass.",
      "translation_ja": "第53節　事柄をそれ以上深く調べなくても、この一点をよく考えさえすれば、人々は親の権力について、あれほど大きな思い違いに陥らなかったかもしれない。「父権」の名のもとで、もっぱら父親のものらしく見えるなら、その権力を絶対的支配権や王権と呼んでも、さほど耳障りではないかもしれない。ところが、子どもに対するこの絶対とされる権力を親権と呼び、母親にも属することが明らかになれば、やはり妙に聞こえ、名を口にするだけで不合理さが分かる。このいわゆる父性の絶対的な権力と権威を盛んに唱える人々にとって、それを母親が分かち持つというのは、ずいぶん都合が悪い。彼らは一人だけが治める政府を、その根本的な権威から導こうとするのに、名を見ただけで、その権威が一人ではなく、二人に共同で属すると分かってしまっては、擁護したい君主政の支えになどなりにくい。もっとも、名称の話はこれくらいにしよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s054",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:142",
          "printed_page": "273",
          "source_sequence": 69
        }
      ],
      "source_text": "54. Though I have said above (2.) That all Men by Nature are equal; I cannot be supposed to understand all sorts of Equality: Age or Virtue may give Men a just Precedency: Excellency of Parts and Merit may place others above the Common Level: Birth may subject some, and Alliance or Benefits others to pay an Observance to those, to whom Nature, Gratitude or other Respects may have made it due; and yet all this consists with the Equality which all Men are in, in respect of Jurisdiction or Dominion one over another: which was the Equality I there spoke of, as proper to the Business in hand, being that equal Right that every Man hath to his Natural Freedom, without being subjected to the Will or Authority of any other Man.",
      "translation_ja": "第54節　先に（底本では「二」）人はみな生まれながらに平等だと言ったが、どんな面でも平等であると言ったと思ってもらっては困る。年齢や徳によって、ある人が他の人より先に立つのはもっともである。優れた才能や功績で、並の人より上に立つ人もいる。生まれによって、また血縁や恩恵によって、ある人が他の人に敬意を払うこともある。その敬意は、自然、感謝、その他の理由で当然払うべきものかもしれない。しかもこうしたことは、人が互いを裁き、支配する権限の面ですべて平等であることと、何の矛盾もない。先に論旨に即して述べたのは、この意味での平等である。つまり、誰でも他人の意志や権威に服さず、自然の自由を等しく持つ権利がある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s055",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:142",
          "printed_page": "273",
          "source_sequence": 70
        }
      ],
      "source_text": "55. Children, I confess, are not born in this full state of Equality, though they are born to it. Their Parents have a sort of Rule and Jurisdiction over them when they come into the World, and for some time after, but 'tis but a temporary one. The Bonds of this Subjection are like the Swadling Cloths they are wrapt up in, and supported by, in the weakness of their Infancy. Age and Reason as they grow up, loosen them till atlength they drop quite off, and leave a Man at his own free Disposal.",
      "translation_ja": "第55節　子どもは完全に平等な状態に生まれるわけではないことを、私も認める。ただし、平等な状態に至るべく生まれてくる。子どもが世に生まれ、その後しばらくは、両親が子どもを導き、ある種の権限を持つ。とはいえ、それは一時的なものである。この服従の絆は、乳飲み子で弱い間、身体を包んで支える産着に似ている。成長して年齢を重ね、理性が働くようになるにつれて、絆はゆるみ、ついにはすっかりほどける。人はこうして自由に自分の身を処せるようになる。",
      "translation_status": "reviewed"
    },

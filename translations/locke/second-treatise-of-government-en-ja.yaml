          "source_sequence": 204
        }
      ],
      "source_text": "CHAP. XV. Of Paternal, Political, and Despotical Power, considered together.",
      "translation_ja": "第十五章　父権・政治権力・専制権をあわせて考える",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s169",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:202",
          "printed_page": "392",
          "source_sequence": 205
        }
      ],
      "source_text": "169. THough I have had occasion to speak of these separately before, yet the great mistakes, of late, about Government, having, as I suppose, arisen from confounding these distinct Powers one with another, it may not, perhaps, be amiss, to consider them here together.",
      "translation_ja": "第169節　これらはすでに別々に述べる機会があった。だが、近ごろの政府についての大きな誤りは、これらの違う力を互いに取り違えたところから生じたと思うので、ここであわせて考えてもよいだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s170",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:202",
          "printed_page": "392",
          "printed_page_end": "393",
          "source_sequence": 206
        }
      ],
      "source_text": "170. First then, Paternal or Parental Power, is nothing but that which Parents have over their Children, to govern them, for the Childrens good, till they come to the use of Reason, or a state of Knowledge, wherein they may be supposed capable to understand that Rule, whether it be the Law of Nature, or the municipal Law of their Countrey, they are to govern themselves by: Capable, I say, to know it, as well as several others, who live as Free-men under that Law. The Affection and Tenderness God hath planted in the breasts of Parents, towards their Children, makes it evident, that this is not intended to be a severe. Arbitrary Government; but only for the Help, Instruction, and Preservation of their Off-spring. But, happen it as it will, there is, as I have proved, no reason why it should be thought to extend to Life and Death, at any time, over their Children, more than over any body else, or keep the Child in subjection to the Will of his Parents, when grown to a Man, and the perfect use of Reason, any farther, than as having received Life and Education from his Parents, obliges him to Respect, Honour, Gratitude, Assistance, and Support, all his Life, to both Father and Mother. And thus, 'tis true, the Paternal is a natural Government; but not at all extending it self to the Ends and Jurisdictions of that which is Political. The Power of the Father doth not reach at all to the Property of the Child, which is only in his own disposing.",
      "translation_ja": "第170節　まず、父権あるいは親権とは、親が子に対し、子のために導く力にほかならない。それは子が理性を使えるようになるまで、すなわち、自分を律する規則が自然法であれ、自分の国の国内法であれ、それを理解できると認められる知識の段階に達するまでのことだ。つまり、その法のもとに自由人として暮らすほかの多くの人と、同じように規則を知ることができるまでである。神が親の胸に植えつけた、子に対する愛情と優しさから、この力が、厳しく恣意的な支配をするためにあるわけではなく、ただわが子を助け、教え、守るためにあることは明らかだ。だがどうあろうとも、すでに証明したように、これによって、ほかの誰かについてなら認められないような、子の生死をいつでも決められる力まで認められるわけではない。また、子が成人し、理性を完全に使えるようになっても、親の意志に服させる理由もない。両親から命と教育を受けた者が、生涯にわたり父母双方に、尊重、敬意、感謝、助力、扶養を返す義務を負う、その限度を除いてのことである。こういう意味で、父権が自然の統治であることは確かだが、政治権力の目的や管轄には少しも及ばない。子の財産には父の力はまったく及ばず、子自身だけがそれを処分できる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s171",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:202",
          "printed_page": "393",
          "printed_page_end": "394",
          "source_sequence": 207
        }
      ],
      "source_text": "171. Secondly, Political Power is that Power, which every Man, having in the state of Nature, has given up into the hands of the Society, and therein to the Governours, whom the Society hath set over it self, with this express, or tacit Trust, That it shall be imployed for their good, and the preservation of their Property: Now this Power, which every Man has in the state of Nature, and which he parts with to the Society, in all such cases where the Society can secure him, is to use such means for the preserving of his own Property, as he thinks good, and Nature allows him; and to punish the Breach of the Law of Nature in others; so as (according to the best of his Reason) may most conduce to the preservation of himself, and the rest of Mankind; so that the end and measure of this Power, when in every Man's hands, in the state of Nature, being the preservation of all of his Society, that is, all Mankind in general. It can have no other end or measure, when in the hands of the Magistrate, but to preserve the Members of that Society, in their Lives, Liberties, and Possessions; and so cannot be an Absolute, Arbitrary Power over their Lives and Fortunes, which are as much as possible to be preserved; But a Power to make Laws, and annex such Penalties to them, as may tend to the preservation of the whole, by cutting off those Parts, and those only, which are so corrupt, that they threaten the sound and healthy, without which no severity is lawful. And this Power has its Original only from Compact and Agreement, and the mutual Consent of those who make up the Community.",
      "translation_ja": "第171節　次に政治権力とは、一人ひとりが自然状態で持ち、社会の手に、したがって社会が自らの上に立てた統治者に引き渡した力である。それは、成員のため、またその財産の保全のためにだけ使うという、明示または暗黙の信任を伴う。この力は、誰もが自然状態で持っていて、社会がその人の安全を守れる場合には、社会に譲るものである。すなわち、自分の財産を保全するために、自分がよいと思い、自然が認める手立てを用い、他人が自然法に背いたときには、自分の理性で最善と判断するところに従い、自らとほかの人々の保全に最も役立つよう、その違反を罰する力である。したがって、自然状態でそれが各人の手にあるとき、その目的と尺度は、その人の社会の全体、すなわち人類一般を保全することにある。公職にある者の手に渡ったときも、その社会の成員の命、自由、持ち物を保全することのほかには、何の目的も尺度も持ちえない。できるだけ保全すべき成員の命と財産に対する、絶対的で恣意的な力ではありえない。それは、全体の保全に役立つように法を定め、これに刑罰を付す力であり、健全な部分を脅かすほど腐敗した部分、それだけを切り離すための力である。この目的なくしては、どんな厳しい処置も正当ではない。この力の起源は、共同体を構成する人々の取り決めと合意、互いの同意だけにある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s172",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:203",
          "printed_page": "394",
          "printed_page_end": "396",
          "source_sequence": 208
        }
      ],
      "source_text": "172. Thirdly, Despotical Power is an Absolute, Arbitrary Power, one Man has over another, to take away his Life whenever he pleases; and this is a Power, which neither Nature gives, for it has made no such distinction between one Man and another, nor Compact can convey. For Man, not having such an Arbitrary Power over his own Life, cannot give another Man such a Power over it, but it is the effect only of Forfeiture, which the Aggressor makes of his own Life, when he puts himself into the state of War with another. For having quitted Reason, which God hath given to be the Rule betwixt Man and Man, and the peaceable ways which that teaches, and made use of Force to compass his unjust ends upon another, where he has no right, he renders himself liable to be destroyed by his Adversary, when-ever he can, as any other noxious and brutish Creature that is destructive to his Being. And thus Captives, taken in a just and lawful War, and such only, are subject to a Despotical Power, which as it arises not from Compact, so neither is it capable of any, but is the state of War continued. For what Compact can be made with a Man that is not Master of his own Life? What Condition can he perform? And if he be once allowed to be Master of his own Life, the Despotical, Arbitrary Power of his Master ceases. He that is Master of himself, and his own Life, has a right too to the means of preserving it; so that as soon as Compact enters, Slavery ceases, and he so far quits his Absolute Power, and puts an end to the state of War, who enters into Conditions with his Captive.",
      "translation_ja": "第172節　第三に専制権とは、ある人が他人に対して持つ絶対的で恣意的な力であり、気の向くときにその人の命を奪うことができる。自然は人と人との間にそんな違いを設けていないから、この力を与えないし、取り決めによって移すこともできない。自分の命を好きなままに処分する力を人は持たず、それを他人に与えられないからである。専制権はただ、攻撃者が他人との戦争状態に入ることで、自分の命を失ういわれを自ら作ったことの結果である。神が人と人との規準として与えた理性と、理性が教える平和なやり方を捨て、何の権利もなく他人に対して、不当な目的を遂げるために力を用いれば、相手の生存を脅かす有害で獣同然の生き物とみなされ、相手ができるなら滅ぼされうる身となる。こうして、正当で合法な戦争で捕らえられた捕虜だけが、専制権の下に置かれる。この力は取り決めから生まれるのではなく、取り決めを結べる性質のものでもなく、戦争状態が続いているのである。自分の命の主人でない相手と、どんな取り決めができるだろう。何の条件を果たせるだろう。一度でも自分の命の主人であることを認められれば、主人の専制的で恣意的な力は消える。自分自身と自分の命の主人である者は、それを保つ手段にも権利を持つ。そのため、取り決めが結ばれれば、たちまち奴隷状態は終わる。捕虜と条件を取り決める者は、それだけ絶対の力を手放し、戦争状態を終えるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s173",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:204",
          "printed_page": "396",
          "source_sequence": 209
        }
      ],
      "source_text": "173. Nature gives the first of these, viz. Paternal Power, to Parents, for the Benefit of their Children, during their Minority, to supply their want of Ability, and understanding how to manage their Property. (By Property I must be understood here, as in other places, to mean that Property which Men have in their Persons as well as Goods.) Voluntary Agreement gives the second, viz. Political Power, to Governours, for the Benefit of their Subjects, to secure them in the Possession and Use of their Properties. And Forfeiture gives the third, Despotical Power, to Lords, for their own Benefit over those who are stripp'd of all Property.",
      "translation_ja": "第173節　第一のもの、父権は、子のため、子が未成年の間、自分の財産を扱う能力と分別が足りないのを補うものとして、自然が親に与える。ここでいう財産とは、ほかの箇所と同様、人が財物に対して持つ権利だけでなく、自分自身に対して持つ権利も含む。第二のもの、政治権力は、臣民の利益のため、その財産の保有と利用を確保するものとして、自発的な合意が統治者に与える。第三のもの、専制権は、財産をすべて剝ぎ取られた者に対し、主人自身のために、その権利を相手が自ら失ったことによって主人に与えられる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s174",
      "section_id": "ch-15",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:204",
          "printed_page": "396",
          "printed_page_end": "397",
          "source_sequence": 210
        }
      ],
      "source_text": "174. He that shall consider the distinct rise and extent, and the different ends of these several Powers, will plainly see that Paternal Power comes as far short of that of the Magistrate, as Despotical exceeds it; and that Absolute Dominion, however placed, is so far from being one kind of civil Society, that it is as inconsistent with it as Slavery is with Property. Paternal Power is only where Minority makes the Child incapable to manage his Property; Political where Men have Property in their own disposal; and Despotical over such as have no Property at all.",
      "translation_ja": "第174節　これらの力の起源と及ぶ範囲はいずれも違い、目的も違う。それを考えるなら、父権が公職にある者の権力に及ばないのと同じほど、専制権は公の権力を越えると、はっきり分かる。そして絶対的な支配は、誰に置かれようと、市民社会の一種であるどころか、奴隷状態が財産と両立しないのと同じように、市民社会と両立しない。父権があるのは、未成年のため子が自ら財産を扱えないところだけである。政治権力があるのは人が自由に処分できる財産を持つところ、専制権が及ぶのは、まったく財産を持たない者に対してである。",
      "translation_status": "reviewed"
    },

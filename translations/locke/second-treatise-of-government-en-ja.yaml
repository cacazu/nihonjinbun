          "source_sequence": 42
        }
      ],
      "source_text": "29. By making an explicit consent of every Commoner, necessary to any ones appropriating to himself any part of what is given in common. Children or Servants could not cut the Meat which their Father or Master had provided for them in common, without assigning to every one his peculiar part. Though the Water running in the Fountain be every ones; yet who can doubt but that in the Pitcher is his only who drew it out? His labour hath taken it out of the hands of Nature where it was common, and belong'd equally to all her Children, and hath thereby appropriated it to himself.",
      "translation_ja": "第29節　共有に与えられた物の一部を誰かが自分のものにするのに、共有者一人ひとりの明示の同意を必要とすれば、子どもや使用人は、父親や主人が皆のために用意した肉を、一人ひとりの取り分を割り当てずに切ることすらできなくなる。泉を流れる水は誰のものでもあるが、水差しの水はそれを汲んだ人一人のものだということを、誰が疑うだろう。その人の労働が、自然のすべての子らに等しく属する共有の物だった水を、自然の手から取り出した。それによって水はその人のものとなったのである。",
      "translation_status": "reviewed"
    },
    {

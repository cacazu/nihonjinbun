          "source_sequence": 99
        }
      ],
      "source_text": "82. But the Husband and Wife, though they have but one common Concern, yet having different Understandings, will, unavoidably sometimes, have different wills too: it therefore being necessary, that the last Determination, i. e. the Rule, should be placed somewhere; it naturally falls to the Man's share, as the abler and the stronger. But this, reaching but to the things of their common Interest and Property, leaves the Wife in the full and true possession of what, by contract, is her peculiar Right; and at least gives the Husband no more Power over her than she has over his Life. The Power of the Husband being so far from that of an absolute Monarch, that the Wife has, in many cases, a liberty to separate from him; where natural Right, or their Contract allows it; whether that Contract be made by themselves, in the state of Nature, or by the Customs or Laws of the countrey they live in, and the Children, upon such Separation, fall to the Father or Mother's Lot, as such Contract does determine.",
      "translation_ja": "第82節　もっとも、夫婦は共に心を配るものを一つにしていても、分別の働き方が違う以上、意志が異なるときがどうしてもある。最後に決定する力、すなわち指図する権限は、どちらかに託さねばならない。そのため、それはより有能で強いとされる夫の側に、自然に帰する。だがそれが及ぶのは、夫婦に共通する利害と財産のことだけである。契約によって妻に固有の権利とされるものは、全面的に、名実ともに、妻の手に残る。また少なくとも、妻が夫の命に対して持つ以上の権力を、夫が妻に対して得ることはない。夫の権力が絶対君主の権力からほど遠いのは、自然の権利か夫婦の契約が許すなら、妻は多くの場合に夫から離れる自由を持つことからも分かる。その契約が自然状態で二人自身の結んだものであれ、住む国の慣習や法によって結ばれたものであれ、変わりはない。別れたとき子は、その契約が定めるところにより、父か母のもとに引き取られる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s083",
      "section_id": "ch-07",
      "kind": "paragraph",

      "source_text": "33. Nor was this appropriation of any parcel of Land, by improving it, any prejudice to any other Man, since there was still enough, and as good left; and more than the yet unprovided could use. So that in effect, there was never the less left for others because of his inclosure for himself. For he that leaves as much as another can make use of, does as good as take nothing at all. No Body could think himself injur'd by the drinking of another Man, though he took a good draught, who had a whole River of the same Water left him to quench his thirst. And the Case of Land and Water, where there is enough of both, is perfectly the same.",
      "translation_ja": "第33節　土地の一部に手を入れて自分のものにしても、ほかの者を害したわけではない。まだ同じように良い土地が十分にあり、土地を得ていない人々が使える以上に残っていたからだ。だから、自分のために土地を囲い込んでも、実質的に他人のために残されたものを減らしはしなかった。他人が使えるだけを残す人は、何も取らなかったに等しい。喉の渇きを癒やすのに同じ水が川いっぱいに流れているのなら、たとえ他の人がたっぷり飲んだとしても、誰もそれで害を受けたとは思わないだろう。どちらも十分にあるのなら、土地と水の場合はまったく同じなのである。",

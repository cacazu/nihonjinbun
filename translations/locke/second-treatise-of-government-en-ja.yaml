          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:160",
          "printed_page": "309",
          "printed_page_end": "311",
          "source_sequence": 109
        }
      ],
      "source_text": "91. For he being suppos'd to have all, both Legislative and Executive Power in himself alone, there is no Judge to be found, no appeal lies open to any one, who may fairly and indifferently, and with authority decide, and from whence relief and redress may be expected of any injury or inconveniency that may be suffered from him, or by his order. So that such a Man, however intitled Czar, or Grand Signior, or how you please, is as much in the state of nature, with all under his Dominion, as he is with the rest of Mankind. For wherever any two Men are, who have no standing Rule, and common Judge to appeal to on Earth, for the determination of Controversies of Right, betwixt them, there they are still in the state of Nature, and under all the inconveniencies of it, with only this woful difference to the Subject, or rather Slave of an absolute Prince; That whereas, in the ordinary state of Nature, he has a liberty to judge of his Right, and according to the best of his power, to maintain it: but whenever his Property is invaded by the Will and Order of his Monarch; he has not only no Appeal, as those in Society ought to have, but, as if he were degraded from the common state of rational Creatures, is denied a liberty to judge of, or defend his Right, and so is exposed to all the Misery and Inconveniencies that a Man can fear from one, who being in the unrestrained state of Nature, is yet corrupted with Flattery, and armed with Power.",
      "translation_ja": "第91節　絶対君主は立法権と執行権をすべて一人で持つとされる。だから、君主本人から、あるいはその命令によって被る害や不都合について、公平で偏りなく権限をもって裁き、救済や是正を期待できる裁判官は見つからず、誰にも訴える道はない。だからそうした人物は、ツァーリ、大スルタン、あるいは何と呼ばれようと、その支配下にいる人々に対し、ほかの人類に対するときと同じく、自然状態にいる。権利をめぐる争いを裁く、この世の共通の裁判官にも、確立した規則にも訴えられない二人は、どこにいようと、なお自然状態にいて、その不都合をすべて免れないからである。ただし、絶対君主の臣民、と言うより奴隷にとっては、ただ一つ惨めな違いがある。普通の自然状態では、自分の権利について自分で判断し、力の及ぶかぎり守る自由がある。ところが君主の意志や命令によって財産が侵されると、社会にいる者なら当然あるべき訴えの道がないうえに、理性のある者に共通する身分を奪われたかのように、自分の権利について判断し、これを守る自由さえ認められない。そのため、何の制約もない自然状態にいながら、おべっかで堕落し、権力で武装した者から、人が恐れうるあらゆる惨めさや不都合にさらされるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-n03",
      "section_id": "ch-07",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"

      "source_text": "19. And here we have the plain difference between the State of Nature, and the State of War, which however some Men have confounded, are as far distant as a State of Peace, Goodwill, mutual Assistance, and Preservation; and a State of Enmity, Malice, Violence and Mutual Destruction are one from another. Men living together according to reason without a common Superior on Earth, with Authority to judge between them, is properly the State of Nature. But force, or a declared design of force upon the Person of another, where there is no common Superior on Earth to appeal to for relief, is the State of War: And 'tis the want of such an appeal gives a Man the Right of War even against an aggressor, though he be in Society and a fellow Subject. Thus a Theif whom I cannot harm, but by appeal to the Law, for having stolen all that I am worth, I may kill when he sets on me to rob me, but of my Horse or Coat, because the Law which was made for my Preservation, where it cannot interpose to secure my Life from present force, which if lost, is capeable of no reparation, permits me my own Defence, and the Right of War, a liberty to kill the aggressor, because the aggressor allows not time to appeal to our common Judge, nor the decision of the Law, for remedy in a Case where the mischief may be irreparable. Want of a common Judge with Authority, puts all Men in a State of Nature; Force without Right, upon a Mans Person, makes a State of War both where there is, and is not, a common Judge.",
      "translation_ja": "第19節　ここには自然状態と戦争状態との明らかな区別がある。一部には両者を混同する人もいるが、その隔たりは、平和、善意、相互の助けと保全の状態と、敵意、悪意、暴力、相互破壊の状態との隔たりである。この世に争いを裁く権限を持つ共通の上位者がいなくても、理性に従って暮らすのが、正しく言えば自然状態である。しかし他人の身に力を加えるか、そうする意図を明らかに示し、この世で救済を求めて訴える共通の上位者がいないとき、それは戦争状態である。このように訴える道がないからこそ、攻撃者が同じ社会に住み、同じ君主の臣民であっても、攻撃を受ける側に戦争の権利が生まれる。だからたとえ全財産を盗まれても、法に訴えるほかにその盗人に害を加えることはできないが、馬一頭か上着一枚を奪うだけでも、襲われている最中であれば、その盗人に致命的な力を用いることが許される。私を保全するための法が、目前に迫った暴力から私の命を守るために間に入ることができなければ、取り返しのつかない損失が生じかねない。攻撃者は共通の裁判官に救済を訴え、法の裁断を仰ぐ時間を与えない。このような場合、法は自衛と戦争の権利、すなわち攻撃者の命を奪う自由を認めるのである。裁く権限を持つ共通の裁判官がいなければ、人はみな自然状態にある。他人の身に正当な権利もなく力を加えれば、共通の裁判官がいようといまいと、戦争状態が生まれる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s020",
      "section_id": "ch-03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

          "printed_page": "354",
          "source_sequence": 164
        }
      ],
      "source_text": "The lawful Power of making Laws to Command whole Politick Societies of Men, belonging so properly unto the same intire Societies, that for any Prince or Potentate of what kind soever upon Earth, to exercise the same of himself, and not by express Commission, immediately and personally received from God, or else by authority derived at the first from their consent, upon whose persons they impose Laws, it is no better than meer Tyranny. Laws they are not therefore which publick approbation hath not made so. Hooker's Eccl Pol. l. 1. §. 10. Of this point therefore we are to note, that sith Men naturally have no full and perfect Power to Command whole politick multitudes of Men, therefore utterly without our Consent, we could in such sort be at no Mans Commandment living. And to be commanded we do consent when that Society, whereof we be a part, hath at any time before consented, without revoking the same after by the like universal agreement. Laws therefore human, of what kind soever, are available by consent. Ibid.",
      "translation_ja": "「政治社会を成す人々全体に命じる法を正当に制定する力は、まさに、それらの社会の全体に属する。そのため、地上のどのような君主や権力者も、神から直接、個人として明示の委任を受けたか、法を課される当人たちが初めに同意し、それに由来する権威を得たのでないかぎり、自分一人でこの力を行使するなら、まったくの圧政にほかならない。したがって、公の承認によって法となったのでなければ、法ではない。」フッカー『教会統治の法』第一巻第十節。「この点について念頭に置くべきなのは、自然に備わるものとして、人が政治社会を成す大勢全体に命じる、十分で完全な権力はないということである。だから、私たちがまったく同意しなければ、このように、生きている誰の命令にも服さないことになる。そして私たちがその一員である社会が、以前いつであれ同意し、その後同じく全体の合意によってその同意を撤回していないとき、私たちは命じられることに同意している。したがって人の定める法は、どんな種類であれ、同意によって効力を持つ。」同書。",
      "translation_status": "reviewed"
    },

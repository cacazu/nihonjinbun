          "printed_page": "236",
          "printed_page_end": "238",
          "source_sequence": 28
        }
      ],
      "source_text": "17. And hence it is that he who attempts to get an other Man into his Absolute Power, does thereby put himself into a State of War with him; It being to be understood as a Declaration of a Design upon his Life. For I have reason to conclude, that he who would get me into his Power without my Consent, would use me as he pleased when he had got me there, and destroy me too when he had a phansy to it; for no body can desire to have me in his Absolute Power, unless it be to compel me by force to that which is against the Right of my Freedom, i. e. make me a Slave. To be free from such force, is the only security of my Preservation, and reason bids me look on him, as an Enemy to my Preservation, who would take away that Freedom, which is the Fence to it, so that he who makes an attempt to enslave me, thereby puts himself into a State of War with me. He that in the State of Nature, would take away the Freedom that belongs to any one in that State, must necessarily be supposed to have a design to take away every thing else, that Freedom being the Foundation of all the rest: As he that in the State of Society, would take away the Freedom belonging to those of that Society or Common-wealth, must be supposed to design to take away from them every thing else, and so be looked on as in a State of War.",
      "translation_ja": "第17節　だから、他人を自分の絶対的な支配下に置こうとする者は、それによって相手とのあいだで戦争状態に入る。それは相手の命を狙う意図を表明するものと理解されるからだ。私の同意なしに私を支配しようとする者なら、ひとたびその手に収めれば、意のままに私を扱い、その気になれば滅ぼしもするだろう、と考える理由が私にはある。というのも、誰であれ私を絶対的に支配しようとするのは、私の自由である権利に反することを力ずくで私にさせるため、つまり私を奴隷にするためでしかありえないからだ。その力から自由であることだけが私の身を守ってくれる。身を守る垣根である自由を奪おうとする者は、私の生存に対する敵とみなすべきだと、理性は告げている。それゆえ私を奴隷にしようとする者は、そうすることで私とのあいだで戦争状態に入る。自然状態で、その状態にある人に属する自由を奪おうとする者は、ほかのすべても奪おうとしていると考えざるをえない。他のすべてはその自由の上に成り立っているからだ。同じように、社会の中で、社会ないし国家の成員に属する自由を奪おうとする者は、ほかのすべても奪うつもりと考えざるをえず、したがって彼らとのあいだで戦争状態にあるとみなされる。",
      "translation_status": "reviewed"
    },

        }
      ],
      "source_text": "BOOK. II.",
      "translation_ja": "第二書",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-01",
      "section_id": "ch-01",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "source_sequence": 3
        }
      ],
      "source_text": "CHAP. I.",
      "translation_ja": "第一章",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001",
      "section_id": "ch-01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "source_sequence": 4
        }
      ],
      "source_text": "1. IT having been shewn in the foregoing Discourse.",
      "translation_ja": "第1節　前篇では、次のことを示した。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001-l01",
      "section_id": "ch-01",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "source_sequence": 5
        }
      ],
      "source_text": "1o. That Adam had not either by natural Right of Fatherhood, or by positive Donation from God, any such Authority over his Children, nor Dominion over the World as is pretended.",
      "translation_ja": "一、アダムは、父であることに伴う自然の権利によっても、神が明示して授けたことによっても、主張されているような子どもたちへの権威も、世界に対する支配権も持たなかった。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001-l02",
      "section_id": "ch-01",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "source_sequence": 6
        }
      ],
      "source_text": "2o. That if he had his Heirs, yet, had no Right to it.",
      "translation_ja": "二、たとえアダムにその権利があったとしても、相続人にはそれを受け継ぐ権利がなかった。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001-l03",
      "section_id": "ch-01",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "source_sequence": 7
        }
      ],
      "source_text": "3o. That if his Heirs had, there being no Law of Nature nor positive Law of God that determins, which is the Right Heir in all Cases that may arise, the Right of Succession, and consequently of bearing Rule, could not have been certainly determined.",
      "translation_ja": "三、たとえ相続人にその権利があったとしても、どんな場合にも誰が正当な相続人かを定める自然法も、神の明示した法もない。したがって、誰が継承する権利を持ち、そこから誰が統治する権利を持つのかを、確実に決めることはできなかった。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001-l04",
      "section_id": "ch-01",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:114",
          "printed_page": "217",
          "printed_page_end": "218",
          "source_sequence": 8
        }
      ],
      "source_text": "4o. That if even that had been determined, yet the knowledge of which is the Eldest Line of Adams Posterity, being so long since utterly lost that in the Races of Mankind and Families of the World, there remains not to one above another, the least pretence to be the Eldest House, and to have the Right of Inheritance.",
      "translation_ja": "四、仮にそれが決まっていたとしても、アダムの子孫のどれが長子の系統にあたるかは、とうの昔に分からなくなった。今や世界のさまざまな民族や家系のどれ一つとして、ほかより先に立つ本家であり、相続権があると名乗る根拠は、かけらも残っていない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s001-p01",
      "section_id": "ch-01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:115",
          "printed_page": "218",
          "source_sequence": 9
        }
      ],
      "source_text": "All these premises having, as I think, been clearly made out, it is impossible that the Rulers now on Earth, should make any benefit, or derive any the least shadow of Authority from that, which is held to be the Fountain of all Power, Adams Private Dominion and Paternal Iurisdiction, so that, he that will not give just occasion, to think that all Government in the World, is the product only of Force and Violence, and that Men live together by no other Rules but that of Beasts, where the strongest carries it, and so lay a Foundation for perpetual Disorder and Mischeif, Tumult, Sedition and Rebellion, (things that the followers of that Hipothesis so loudly cry out against) must of necessity find out another rise of Government, another Original of Political Power, and another way of designing and knowing the Persons that have it, then what Sr. Robt. E. hath taught us.",
      "translation_ja": "以上の前提は、いずれも十分明らかにできたと思う。だとすれば、今この世にいる統治者が、あらゆる権力の源とされるもの、すなわちアダムの私的な支配権と父としての権限から、何らかの利益を得たり、ほんのわずかでも権威を引き出したりすることはできない。世界中の政府はただ力と暴力から生まれ、人間は力の強い方が勝つという獣の掟だけで暮らしている、と人が考えるだけの理由を与えず、終わりのない無秩序、災い、騒乱、扇動、反乱の種をまきたくないなら（あの仮説を信奉する人々こそ、これらに声を張り上げて反対するのだが）、ロバート・フィルマー卿が教えるのとは別のところに政府の成り立ちと政治権力の起源を求め、その権力を持つ人を指し定め、見分ける方法もまた、別に見いださなくてはならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s002",
      "section_id": "ch-01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:115",
          "printed_page": "218",
          "printed_page_end": "219",
          "source_sequence": 10
        }
      ],
      "source_text": "2. To this purpose, I think it may not be amiss, to set down what I take to be Political Power. That the Power of a Magistrate over a Subject, may be distinguished from that of a Father over his Children, a Master over his Servant, a Husband over his Wife, and a Lord over his Slave. All which distinct Powers happening sometimes together in the same Man, if he be considered under these different Relations, it may help us to distinguish these Powers one from another, and shew the difference betwixt a Ruler of a Common-wealth, a Father of a Family, and a Captain of a Gally.",
      "translation_ja": "第2節　そこで、私が政治権力と呼ぶものを、まず説明しておくのがよいと思う。公職にある者が臣民に対して持つ権力は、父が子どもに、主人が使用人に、夫が妻に、奴隷所有者が奴隷に対して持つ権力とは別のものである。それぞれ違うこれらの権力が、ときには同じ一人の人に集まることがある。その人をこうした関係ごとに捉え直してみれば、これらの権力を互いに区別し、国家の統治者、家庭の父親、ガレー船の船長がどう違うのかを見分ける助けになるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s003",
      "section_id": "ch-01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:115",
          "printed_page": "219",
          "source_sequence": 11
        }
      ],
      "source_text": "3. Political Power, then I take to be a Right of making Laws with Penalties of death, and consequently all less Penalties, for the Regulating and Preserving of Property, and of employing the force of the Community, in the Execution of such Laws, and in the defence of the Common-wealth from Foreign Injury, and all this only for the Public Good.",
      "translation_ja": "第3節　そこで私は政治権力を、財産を規律し保全するため、死刑および当然それより軽いあらゆる刑罰を伴う法律を制定する権利と、その法律を執行し、国外からの侵害から国家を守るために、共同体の力を用いる権利と考える。これらすべては、ただ公共の利益のためにある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-02",
      "section_id": "ch-02",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:116",
          "printed_page": "220",
          "source_sequence": 12
        }
      ],
      "source_text": "CHAP. II. Of the State of Nature.",
      "translation_ja": "第二章　自然状態について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s004",
      "section_id": "ch-02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:116",
          "printed_page": "220",
          "source_sequence": 13
        }
      ],
      "source_text": "4. TO understand Political Power a right, and derive it from its Original, we must consider what Estate all Men are naturally in, and that is, a State of perfect Freedom to order their Actions, and dispose of their Possessions, and Persons as they think fit, within the bounds of the Law of Nature, without asking leave, or depending upon the Will of any other Man.",
      "translation_ja": "第4節　政治権力を正しく理解し、その起源から説明するためには、人がみな生まれながらにどんな状態に置かれているかを考えなくてはならない。そこでは誰もが、自然法の範囲内であれば、他人に許しを求めたり、その意向に頼ったりせず、自分の行いを律し、持ち物も自分自身も思うとおりに取り扱う完全な自由を持っている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s004-p01",
      "section_id": "ch-02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:116",
          "printed_page": "220",
          "printed_page_end": "221",
          "source_sequence": 14
        }
      ],
      "source_text": "A State also of Equality, wherein all the Power and Jurisdiction is reciprocal, no one having more then another, there being nothing more evident, then that Creatures of the same species and rank promiscuously born to all the same advantages of Nature, and the use of the same faculties, should also be equal one amongst another without Subordination or Subjection, unless the Lord and Master of them all, should by any manifest Declaration of his Will set one above another, and confer on him by an evident and clear appointment an undoubted Right to Dominion and Sovereignty.",
      "translation_ja": "また、それは平等の状態でもある。どんな権力や裁く権限も相互的であり、誰かが他人より多くを持つことはない。同じ種に属し同じ位にある被造物が、分け隔てなく生まれて自然の恵みを等しく受け、同じ能力を使えるのであれば、上下や服従の関係もなく互いに平等であるべきことは、この上なく明らかだ。ただし、すべての者の主が、その意志をはっきり示してある者をほかの者の上に置き、明白かつ明瞭な任命によって、支配と主権に対する疑いのない権利を授ける場合は別である。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s005",
      "section_id": "ch-02",
      "kind": "paragraph",
      "origin": "source",

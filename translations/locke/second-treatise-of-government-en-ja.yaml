        }
      ],
      "source_text": "134. THE great end of Mens entering into Society, being the enjoyment of their Properties in Peace and Safety, and the great instrument and means of that being the Laws establish'd in that Society: The first and fundamental positive Law of all Commonwealths, is the establishing of the Legislative Power, as the first and fundamental natural Law which is to govern even the Legislative: It self is the preservation of the Society, and (as far as will consist with the publick good) of every person in it. This Legislative is not only the supream power of the Commonwealth, but sacred and unalterable in the hands where the Community have once placed it; nor can any Edict of any Body else, in what form soever conceived, or by what Power soever backed, have the force and obligation of a Law, which has not its Sanction from that Legislative which the publick has chosen and appointed: for without this the Law could not have that which is absolutely necessary to its being a Law, the consent of the Society, over whom no Body can have a power to make Laws but by their own consent, and by Authority received from them; and therefore-all the Obedience, which by the most solemn ties any one can be obliged to pay, ultimately, terminates in this Supream Power, and is directed by those Laws which it enacts; nor can any Oaths to any Foreign Power whatsoever, or any Domestick subordinate Power, discharge any Member of the Society from his Obedience to the Legislative, acting pursuant to their trust, nor oblige him to any Obedience contrary to the Laws so enacted, or farther than they do allow; it being ridiculous to imagine one can be tied ultimately to obey any Power in the Society which is not the Supream.",
      "translation_ja": "第134節　人々が社会に加わる大きな目的は、自分の財産を平穏かつ安全に享受することである。それを実現する主な手段は、社会に確立された法律である。したがってあらゆる国家における第一の根本的な実定法は、立法権を確立することである。それに対して、立法権それ自体をも律する第一の根本的な自然法は、社会を保全し、公共の利益と両立するかぎり、そこにいる一人ひとりをも保全することである。この立法機関は国家の最高権力であるばかりでなく、共同体がいったんその権力を置いた手にあっては、侵してはならず、みだりに移してはならない。公の選択により任命された立法機関の承認を得ていなければ、ほかのいかなる者の布告も、どんな形式をとり、どんな権力に支えられていようと、法の効力も拘束力も持ちえない。というのも、それでは法であるために絶対に必要な、従う社会の同意がないからだ。社会のために法を定める権力は、その社会の同意と、そこから授かった権威がなければ、誰も持てない。したがって最も厳粛な誓いによって誰かが負う服従も、結局はすべてこの最高権力に帰し、それが制定した法に従う。外国のいかなる権力に対する誓いも、国内のどんな下位の権力への誓いも、託された信任に従う立法機関に服従する義務から、社会の成員を解くことはできない。また、こうして定められた法に反して、あるいは法の認める限度を超えて従うよう、義務づけることもできない。社会の内の最高でない権力に、結局は従わなければならないと想像するのは、ばかげているからである。",
      "translation_status": "reviewed"
    },

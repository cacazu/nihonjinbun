      "source_text": "24. This is the perfect condition of Slavery, which is nothing else, but the State of War continued, between a lawful Conquerour, and a Captive. For, if once Compact enter between them, and make an agreement for a limited Power on the one side, and Obedience, on the other; the State of War and Slavery ceases, as long as the Compact endures. For, as has been said, no Man can, by agreement, pass over to another that which he hath not in himself, a Power over his own Life.",
      "translation_ja": "第24節　これが完全な意味での奴隷状態である。つまり、正当な征服者と捕虜とのあいだで、戦争状態が続いていることにほかならない。もし両者のあいだに取り決めができ、一方は限られた権力だけを有し、他方はそれに従うと合意すれば、その取り決めが続くかぎり、戦争状態も奴隷状態も終わる。前に述べたように、誰も、自分にないもの、つまり自分の命を処分する権限を、合意で他人に譲ることはできないからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s024-p01",
      "section_id": "ch-04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"

          "precision": "page",
          "anchor": "tcp:96077:187",
          "printed_page": "363",
          "source_sequence": 172
        }
      ],
      "source_text": "140. 'Tis true, Governments cannot be supported without great Charge, and 'tis fit every one who enjoys his share of the Protection, should pay, out of his Estate, his proportion for the maintenance of it. But still it must be with his own Consent, i. e. the Consent of the Majority, giving it either by themselves, or their Representatives chosen by them; for if any one shall claim a Power to lay and levy Taxes on the People, by his own Authority, and without such consent of the People, he thereby invades the Fundamental Law of Property, and subverts the end of Government. For what property have I in that which another may by right take when he pleases to himself.",
      "translation_ja": "第140節　確かに、政府の維持には大きな費用がかかる。保護の分け前を受ける人が、自分の財産から、その負担の分を政府の維持のために払うのは当然である。それでも、なお本人の同意によらなければならない。すなわち、多数者が自ら、または自分たちで選んだ代表を通して与える同意である。誰かが、自分自身の権威で、そのような人民の同意なしに、人民に税を課し徴収する権力を求めるなら、これによって所有の根本法を侵し、政府の目的を覆してしまうからである。他人が好きなときに、自分のものとして正当に取り上げられるものに、私のどんな所有権があるというのだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s141",
      "section_id": "ch-11",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

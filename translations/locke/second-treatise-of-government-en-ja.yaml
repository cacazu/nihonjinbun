          "printed_page": "323",
          "source_sequence": 126
        }
      ],
      "source_text": "104. But, to conclude, Reason being plain on our side, that Men are naturally free; and the Examples of History shewing that the Governments of the World, that were begun in Peace, had their beginning laid on that foundation, and were made by the Consent of the People: There can be little room for doubt, either where the Right is, or what has been the Opinion, or Practice of Mankind about the first erecting of Governments.",
      "translation_ja": "第104節　結論を述べよう。理性がはっきり私たちの側に立って、人間が自然に自由だと教え、歴史の実例が、世にある政府で平和に始まったものは、この基礎の上に出発点を置き、人民の同意によって作られたと示している。そうであれば、権利がどちらの側にあるかについても、最初に政府を立てるにあたって人々がどう考え、実際にどうしたかについても、疑いの余地はほとんどない。",
      "translation_status": "reviewed"

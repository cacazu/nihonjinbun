      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:216",
          "printed_page": "420",
          "source_sequence": 239
        }
      ],
      "source_text": "199. AS Usurpation is the exercise of Power, which another hath a Right to; so Tyranny is the exercise of Power beyond Right, which no Body can have a Right to. And this is making use of the Power any one has in his hands; not for the good of those who are under it, but for his own private, separate Advantage. When the Governour, however entituled, makes not the Law, but his Will, the Rule, and his Commands, and Actions are not directed to the preservation of the Properties of his People, but the satisfaction of his own Ambition, Revenge, Covetousness, or any other irregular Passion.",
      "translation_ja": "第199節　簒奪が、他人に権利のある力を行使することであるように、圧政は、権利を越えて力を行使することであり、誰にもそうする権利はありえない。それは、手にある権力を、その下にいる人々のためでなく、自分個人の切り離された利益のために使うことである。統治者が、何と名乗っていようと、法ではなく自分の意志を規準とし、命令や行いを、人民の財産の保全ではなく、自分の野心、復讐心、貪欲、その他の道理を外れた情念の満足に向けるとき、そこに圧政がある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s200",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:216",
          "printed_page": "420",
          "printed_page_end": "422",
          "source_sequence": 240
        }
      ],
      "source_text": "200. If one can doubt this to be Truth, or Reason, because it comes from the obscure hand of a Subject; I hope the Authority of a King will make it pass with him. King Iames, in his Speech to the Parliament, 1603. tells them thus; I will ever prefer the Weale of the publick, and of the whole Commonwealth, in making of good Laws, and Constitutions, to any particular, and private Ends of mine. Thinking ever the Wealth and Weale of the Commonwealth, to be my greatest Weale, and worldly Felicity; a Point, wherein a lawful King doth directly differ from a Tyrant. For I do acknowledge that the special and greatest point of Difference, that is between a rightful King, and an usurping Tyrant, is this, That whereas the proud and ambitious Tyrant doth think, his Kingdom and People are only ordained for satisfaction of his Desires, and unreasonable Appetites; the righteous and just King doth, by the contrary, acknowledge himself to be ordained for the procuring of the wealth and Property of his People. And again, in his Speech to the Parliament, 1609 he hath these Words; The KING binds himself, by a double Oath, to the observation of the fundamental Laws of his Kingdom. Tacitly, as by being a King, and so bound to protect, as well the People, as the Laws of his Kingdom; and expresly by his Oath at his Coronation: so as every just King, in a setled Kingdom, is bound to observe that Paction made to his People, by his Laws, in framing his Government agreeable thereunto, according to that Paction which God made with Noah, after the Deluge. Hereafter, Seed-time, and Harvest, and Cold, and Heat, and Summer, and Winter, and Day, and Night, shall not cease, while the Earth remaineth. And therefore a King, governing in a setled Kingdom, leaves to be a King, and degenerates into a Tyrant, as soon as he leaves off to rule according to his Laws. And a little after: Therefore all Kings, that are not Tyrants, or perjured, will be glad to bound themselves within the Limits of their Laws. And they that perswade them the contrary, are Vipers, Pests both against them and the Commonwealth. Thus that learned King, who well understood the Notions of things, makes the difference, betwixt a King and a Tyrant, to consist only in this, That one makes the Laws the Bounds of his Power, and the Good of the publick the End of his Government; The other makes all give way to his own Will and Appetite.",
      "translation_ja": "第200節　無名の一臣民が書いたことだからと、これが真実か、道理にかなうかを疑う人がいれば、王の権威が納得させてくれるよう願いたい。ジェームズ王は一六〇三年の議会演説でこう告げた。「良い法律や制度を定めるにあたっては、いつも公と国家全体の福利を、自分のいかなる個人的で私的な目的にも優先させる。国家の繁栄と福利が、私の最大の福利であり、この世での幸福だと、いつも考える。この点で、正当な王は暴君とはっきり異なる。正しい王と権力を奪った暴君との、何より大きく決定的な違いは、このことであると認める。傲慢で野心的な暴君は、自らの王国と人民は、ただ自分の望みや道理に反した欲求を満たすために設けられたと考える。反対に、公正で正しい王は、人民の繁栄と財産をもたらすため、自分が立てられたのだと認める。」また一六〇九年の議会演説には、こういう言葉がある。「王は自らを二重の誓いで縛り、国の根本法を守る。暗黙には、王となることによって、国の法律も人民も、等しく守る義務を負う。明示には、戴冠の際の誓いによってそうする。だから、確立した王国の公正な王は誰でも、その法律によって民と交わした約束を守り、それにかなうよう政府を形づくらなければならない。それは洪水の後に神がノアと交わした約束に従うものである。『今から、地が残るかぎり、種まきも収穫も、寒さも暑さも、夏も冬も、昼も夜も、やむことはない。』だから、確立した王国で治める王が、法に従って治めることをやめるとき、王ではなくなり、暴君に落ちるのである。」また少し後でこう言う。「したがって、暴君でも誓いを破る者でもない王は皆、自らの法の範囲に自分を限ることを喜ぶ。これと反対のことを勧める者は毒蛇であり、王と国家双方の害である。」このように、物事の意味をよく理解していた学識あるこの王は、王と暴君との違いはただ次のことだとする。一方は法を自らの権力の限界とし、公共の利益を政府の目的とする。他方は、すべてを自分の意志と欲望に屈服させるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s201",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

          "printed_page": "268",
          "source_sequence": 63
        }
      ],
      "source_text": "49. Thus in the beginning all the World was America, and more so than that is now; for no such thing as Money was any where known. Find out something that hath the Use and Value of Money amongst his Neighbours, you shall see the same Man will begin presently to enlarge his Possessions.",
      "translation_ja": "第49節　こうしてはじめ世界全体がアメリカだった。いや、今日のアメリカ以上にそうだった。というのは、貨幣というものがどこにもなかったからだ。それでも、隣人とのあいだで貨幣の用途と価値を持つものを見つければ、同じその人が、すぐにでも所有地を広げ始めるのを見るだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s050",
      "section_id": "ch-05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:140",
          "printed_page": "268",
          "printed_page_end": "269",
          "source_sequence": 64
        }
      ],
      "source_text": "50. But since Gold and Silver, being little useful to the Life of Man, in proportion to Food, Rayment, and Carriage, has its value only from the consent of Men, whereof labour yet makes in great part the measure, It is plain, that the consent of Men have agreed to a disproportionate and unequal Possession of the Earth; I mean out of the bounds of Society and Compact: for in Governments the Laws regulate it, they having by consent, found out and agreed in a way how a Man may rightfully, and without injury, possess more than he himself can make use of by receiving Gold and Silver, which may continue long in a Mans Possession, without decaying for the overplus, and agreeing those Metals should have a value.",
      "translation_ja": "第50節　ところが金銀は、飲食物や衣服、運搬に役立つものに比べ、人間の暮らしに役に立つところは乏しく、その価値は人々の同意だけによる。もっとも、その価値の尺度の大部分をなお労働がなす。だとすれば、地上の所有に偏りや不平等があることを、人々は同意によって認めてきたのは明らかである。ここでいうのは、社会を成り立たせる取り決めの外での話だ。政府の下では法律が所有を規律するからである。人々は、自分が使いきれない分を、長いあいだ朽ちずに手もとに置ける金銀と引き換え、その金属に価値を認めることで、誰も害さず正当に、自分の使いきれる以上を持つ方法を見つけ、同意したのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s051",
      "section_id": "ch-05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:140",
          "printed_page": "269",
          "printed_page_end": "270",
          "source_sequence": 65
        }
      ],
      "source_text": "51. And thus, I think, it is very easy to conceive, without any difficulty, how labour could at first begin a title of Property in the common things of nature, and how the spending it upon our uses bounded it. So that there could then be no reason of quarrelling about title, nor any doubt about the largeness of Possession it gave. Right and Conveniency went together. For as a Man had a right to all he could imploy his labour upon, so he had no temptation to labour for more than he could make use of. This left no room for Controversie about the title, nor for incroachment on the right of others; what Portion a Man carved to himself, was easily seen; and it was useless as well as dishonest, to carve himself too much, or take more than he needed.",
      "translation_ja": "第51節　このように、労働が最初に、自然の共有物に対する所有の権原をどう生み、生活に役立てて消費することが、その所有をどこまでに限ったかは、たやすく理解できると思う。だから、もともと権原をめぐって争う理由も、それが認める所有の大きさを疑う余地もなかった。権利と暮らしの便宜とは歩調を合わせていた。人は労働を加えられるものすべてに権利を得たが、使える量以上を求めて働こうとする理由はなかったからである。こうして権原を争う余地も、ほかの人の権利を侵す余地もなかった。各人が自分の分として切り取った量は誰の目にも明らかで、取り分を大きくしすぎたり、必要以上に取ったりすることは、無益なだけでなく不正でもあったのである。",
      "translation_status": "reviewed"
    },

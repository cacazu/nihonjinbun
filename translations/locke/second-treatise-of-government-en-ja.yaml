          "printed_page_end": "362",
          "source_sequence": 170
        }
      ],
      "source_text": "138. Thirdly, The Supream Power cannot take from any Man any part of his Property without his own consent. For the preservation of Property being the end of Government, and that for which Men enter into Society, it necessarily supposes and requires, that the People should have Property, without which they must be suppos'd to lose that by entering into Society, which was the end for which they entered into it. Too gross an absurdity for any Man to own. Men therefore in Society having Property, they have such a right to the goods, which by the Law of the Community are theirs, that no Body hath a right to take them, or any part of them, from them, without their own consent; without this they have no Property at all. For I have truly no Property in that which another can by right take from me when he pleases, against my consent. Hence it is a mistake to think, that the Supream or Legislative Power of any Commonwealth, can do what it will, and dispose of the Estates of the Subject arbitrarily, or take any part of them at pleasure. This is not much to be fear'd in Governments where the Legislative consists wholly or in part in Assemblies which are variable, whose Members upon the dissolution of the Assembly, are Subjects under the common Laws of their Country, equally with the rest. But in Governments, where the Legislative is in one lasting Assembly, always in being, or in one Man, as in absolute Monarchies, there is danger still, that they will think themselves to have a distinct interest from the rest of the Community, and so will be apt to increase their own Riches and Power by taking what they think fit from the People. For a Mans Property is not at all secure, though there be good and equitable Laws to set the bounds of it between him and his Fellow Subjects, if he who commands those Subjects, have power to take from any private Man what part he pleases of his Property, and use and dispose of it as he thinks good.",
      "translation_ja": "第138節　第三に、最高権力は、当人の同意なしに、誰の財産も、その一部さえ取り上げることはできない。財産の保全は政府の目的であり、それこそ人が社会に入る目的なのだから、人民が財産を持つことは当然の前提であり、必要なことでもある。さもないと、人は入る目的だったものを、社会に入ることによって失うということになる。これは誰も認めようのない、あまりにひどい不合理である。したがって社会の中で財産を持つ人は、共同体の法で自分のものとされる財物について、本人の同意なしには誰にもその全部も一部も取り上げる権利がない、というだけの権利を持つ。これがなければ財産は少しもないことになる。他人が私の同意に反して、好きなときに正当に取り上げられるものを、私は本当に所有しているとはいえないからである。このため、国家の最高権力、すなわち立法権は、どんなことでも好きにでき、臣民の財産を恣意的に処分し、あるいは好きな部分を取り上げられると考えるのは誤りである。立法機関の全部か一部が入れ替わる議会で、議会が解かれればその成員は他の人と同じく、国の共通の法に服する臣民となる政体では、この点はさほど心配しなくてよい。だが、立法権が常に存在する一つの永続的な議会にあったり、絶対君主政のように一人の人にあったりする政体では、立法する者が、共同体のほかの人々とは別の利害を持つと考え、人民から好きなものを取り上げて、自分の富や権力を増やそうとする危険が残る。ある人とほかの臣民との間の所有の境界を、いかに良く公正な法律で定めても、その臣民に命令する者が、個人の財産の好きな部分を取り上げ、思いどおりに使い、処分する力を持つなら、その人の財産はまったく安全ではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s139",
      "section_id": "ch-11",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

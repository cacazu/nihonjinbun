      "source_text": "32. But the chief matter of Property being now not the Fruits of the Earth, and the Beasts that subsist on it, but the Earth it self; as that which takes in and carries with it all the rest: I think it is plain, that Property in that too is acquired as the former. As much Land as a Man Tills, Plants, Improves, Cultivates, and can use the Product of; so much is his Property. He by his labour does as it were inclose it from the Common. Nor will it invalidate his right to say, Every body else has an equal title to it; and therefore he cannot appropriate, he cannot inclose, without the consent of all his Fellow-Commoners, all Mankind. God when he gave the World in common to all Mankind, commanded Man also to labour, and the penury of his Condition required it of him. God and his Reason commanded him to subdue the Earth, i. e[?] improve it for the benefit of Life, and therein lay out something upon it that was his own, his labour. He that in obedience to this Command of God, subdued, tilled and sowed any part of it, thereby annexed to it something that was his Property, which another had no Title to, nor could without injury take from him.",
      "translation_ja": "第32節　だが今や、所有の主な対象は大地の実りや、そこで命をつなぐ獣ではなく、それらすべてを含み、付随させる土地そのものだ。土地の所有権も、先に述べたものと同じように得られるのは明らかだと思う。耕し、植え、手を入れ、作物を育て、その収穫を使いきれるだけの土地が、その人の財産になる。労働によって、いわば共有地からそこを囲い込むのである。誰にでも同じ権原があり、だから共有者全員、つまり全人類の同意なしに、自分のものとすることも、囲い込むこともできない、という言い分で、その人の権利が失われるわけではない。神は全人類に世界を共有させたとき、人に働くようにも命じ、人自身の貧しい境遇が労働を求めた。神と人自身の理性が、大地を従わせよ、つまり暮らしのために土地に手を入れ、自分のものの一部、すなわち労働をそこに費やせと命じた。神のこの命令に従って、土地の一部を従わせ、耕して種をまいた人は、そうすることで、自らの財産に属する何かを土地に付け加えた。他人にはそれを得る権原がなく、奪い取ればその人への不当な侵害となる。",

          "source_sequence": 114
        }
      ],
      "source_text": "At the first; when some certain kind of Regiment was once appointed, it may be that nothing was then farther thought upon for the manner of governing, but all permitted unto their Wisdom and Discretion, which were to Rule, till, by experience, they found this for all parts very inconvenient, so as the thing, which they had devised for a Remedy, did indeed but increase the Sore, which it should have cured. They saw, that to live by one Man's Will, became the cause of all Mens misery. This constrained them to come unto Laws wherein all Men might see their Duty beforehand, and know the Penalties of transgressing them. Hooker's Eccl. Pol. l. 1. §. 10.",
      "translation_ja": "「ある一定の統治の形を定めたとき、初めは、どう治めるかをそれ以上は考えず、すべてを統治者の知恵と判断に任せたのかもしれない。やがて経験に照らし、これはあらゆる点でひどく不都合で、治療のつもりで考えついたものが、癒やすはずだった傷をかえって深めたと分かった。一人の意志によって生きることが、万人の不幸の原因になると知った。これに迫られて、すべての人が、自分の義務と、それに背いた場合の罰をあらかじめ知りうる法律を定めるに至った。」フッカー『教会統治の法』第一巻第十節。",
      "translation_status": "reviewed"
    },

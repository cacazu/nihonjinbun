      ],
      "source_text": "11. From these two distinct Rights, the one of Punishing the Crime for restraint, and preventing the like Offence, which right of punishing is in every body; the other of taking reparation, which belongs only to the injured party, comes it to pass that the Magistrate, who by being Magistrate, hath the common right of punishing put into his hands, can often where the public good demands not the Execution of the Law, remit the punishment of Criminal Offences by his own Authority, but yet cannot remit the satisfaction due to any Private Man, for the damage he has received. That, he who has suffered the damage has a Right to demand in his own name, and he alone can remit; The damnified Person has this Power of appropriating to himself, the Goods or Service of the Offender, by Right of self Preservation, as every Man has a Power to punish the Crime, to prevent its being committed again, by the Right he has of Preserving all Mankind, and doing all reasonable things, he can in order to that end: And thus it is, that every Man in the State of Nature, has a Power to kill a muderer, both to deter others from doing the like injury, which no reparation can compensate, by the Example of the punishment that attends it from every body, and also to secure Men from the attempts of a Criminal, who having renounced reason, the common Rule and Measure God hath given to Mankind, hath by the unjust violence and slaughter, he hath committed upon one, declared War against all Mankind, and therefore may be destroyed as a Lion or a Tiger, one of those wild Savage Beasts, with whom Men can have no Society nor Security: And upon this is grounded that great Law of Nature, who so sheddeth Mans Blood, by Man shall his Blood be shed. And Cain was so fully convinced, that every one had a Right to destroy such a Criminal, that after the Murther of his Brother, he cries out, every one that findeth me, shall slay me, so plain was it writ in the Hearts of all Mankind.",
      "translation_ja": "第11節　この二つの別々の権利の一方は、犯罪を抑止し、同じ違反の再発を防ぐために処罰する権利で、誰もが持っている。もう一方は、被害を受けた者だけが持つ、償いを受ける権利である。この区別があるからこそ、公職にあるがゆえに万人に共通する処罰の権利を託された者は、公共の利益が法の執行を求めないときには、自らの権威でしばしば犯罪の刑罰を免じることができる。けれども、個人が被害に対して受けるべき償いまでは免除できない。それは被害を受けた本人が、自分の名において請求する権利を持ち、本人だけが免じることができる。被害者が違反者の財物や労務を自分のものとできるのは、自己保全の権利による。それと同じく、誰もが犯罪を罰して再発を防ぐ力を持つのは、全人類を保全し、その目的のためにできるかぎりの道理にかなったことを行う権利があるからだ。こうして自然状態では、誰もが殺人者を死に至らせる権限を持つことになる。誰の手からでも刑罰が下る例を示して、償いようのない同じ加害をほかの人に思いとどまらせるためでもあり、犯人が次に何かをしようとしても、人々をその手から守るためでもある。この犯人は、神が人類に共通の規則と尺度として授けた理性を捨て、不当な暴力で一人を殺すことにより、人類全体に戦争を宣言している。だから、人が共に暮らすことも安心して身を置くこともできない野獣、ライオンや虎と同じように、打ち滅ぼしてよいのである。「人の血を流す者は、人によってその血を流される」という自然法の大原則の根拠はここにある。カインも、こんな罪人を滅ぼす権利は誰にもあると心底思い知っていたからこそ、弟を殺したあと、「私を見つける者は誰でも私を殺すでしょう」と叫んだ。この法はそれほどはっきりと、すべての人の心に刻まれているのである。",
      "translation_status": "reviewed"
    },

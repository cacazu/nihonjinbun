          "printed_page": "279",
          "printed_page_end": "281",
          "source_sequence": 76
        }
      ],
      "source_text": "61. Thus we are born free, as we are born rational; not that we have actually the Exercise of either: Age that brings one, brings with it the other too. And thus we see how natural Freedom and Subjection to Parents may consist together, and are both founded on the same Principle. A Child is free by his Father's Title, by his Father's Understanding, which is to govern him, till he hath it of his own. The Freedom of a man, at years of discretion, and the Subjection of a Child to his Parents, whilst yet short of it, are so consistent, and so distinguishable, that the most blinded Contenders for Monarchy, by Right of Fatherhood, cannot miss of it; the most obstinate cannot but allow of it. For were their Doctrine all true, were the right Heir of Adam now known, and, by that Title, setled a Monarch in his Throne; invested with all the Absolute, Unlimited Power Sr. R. F. talks of; If he should dye as soon as his Heir were born, must not the Child, notwithstanding he were never so free, never so much sovereign, be in subjection to his Mother and Nurse, to Tutors and Gonours, till Age and Education brought him Reason and Ability to govern himself, and others? The Necessities of his Life, the Health of his Body, and the Information of his Mind would require him to be directed by the Will of others and not his own: and yet will any one think, that this Restraint and Subjection were inconsistent with, or spoiled him of that Liberty or Sovereignty he had a Right to: or gave away his Empire to those who had the Government of his Nonage? This Government over him only prepared him the better, and sooner for it. If any body should ask me, When my Son is of Age to be free; I shall answer, Just when his Monarch is of Age to govern. But at what time, says the judicious Hooker, Eccl. Pol. l. 1. §. 6. a man may be said to have attain'd so far forth the use of Reason, as sufficeth to make him capable of those Laws whereby he is then bound to guide his Actions: this is a great deal more easie for sense to discern, than for any one, by Skill and Learning, to determine.",
      "translation_ja": "第61節　こうして私たちは、理性を持って生まれるのと同じ意味で、自由に生まれる。ただし、実際にどちらかを使える状態で生まれる、というのではない。年齢が一方をもたらすと同時に、他方をももたらす。こうして、自然の自由と親への服従はどう両立し、同じ原理に基づくかが分かる。子に自由があるのは、父の資格と分別を通してであり、自ら分別を持つまでは父の分別が子を導く。分別のある年齢にある人の自由と、それに達していない子の親への服従とは、よく両立し、明瞭に区別できる。このことは、父権による君主政を擁護する者でも、どれほど目が曇っていようと見落とせないし、どれほど頑固でも認めざるをえない。仮に彼らの説がすべて真実で、今やアダムの正当な相続人が判明し、その権原によって王位につき、ロバート・フィルマー卿が言う絶対無制限の権力をすべて授かったとしよう。その君主が、相続人が生まれたとたんに死んだなら、子がどれほど自由で、どれほどの主権を持とうとも、成長と教育により自分と他人を治められる理性と能力が身につくまでは、母や乳母、後見人や養育係の指示に従わなければならないのではないか。生きるのに必要なものを得、身体を健やかに保ち、心を育てるためには、自分ではなく他人の意志に導かれなくてはならない。だがその制約や服従が、彼に権利のある自由や主権と両立せず、それを奪うとか、成年になるまで世話をした人々に君主の支配権を譲るとか、誰が考えるだろう。むしろ彼を導くことによって、より早く、よりよく、その地位に備えることができたのである。もし、いつ私の息子が自由になれる年齢に達するかと問われれば、私は、あなたの君主が統治できる年齢に達するのとちょうど同じと答える。だが、賢明なフッカーは言う。「従って行動しなければならない法を受け入れられるほどに理性を使えるようになったと、いつ言えるのか。これは、知識や学問で決めるよりも、実際に見分ける方がずっとたやすい。」（『教会統治の法』第一巻第六節）",
      "translation_status": "reviewed"
    },
    {

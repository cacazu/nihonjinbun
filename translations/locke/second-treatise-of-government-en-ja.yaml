          "source_sequence": 51
        }
      ],
      "source_text": "Before the Appropriation of Land, he who gathered as much of the wild Fruit, killed, caught, or tamed as many of the Beasts as he could; he that so employed his Pains about any of the spontaneous Products of Nature, as any way to alter them, from the state Nature put them in, by placing any of his Labour on them, did thereby acquire a Propriety in them: but if they perished, in his Possession, without their due use; if the Fruits rotted, or the Venison putrified, before he could spend it, he offended against the common Law of Nature, and was liable to be punished; he invaded his Neighbour's share, for he had no Right, farther than his Use called for any of them, and they might serve to afford him Conveniencies of Life.",
      "translation_ja": "土地が私有されるようになる前には、自分でできるだけ多くの野生の果実を集め、できるかぎり多くの獣を仕留め、捕らえ、あるいは飼いならす者がいた。このように、自然にひとりでに生まれたものの何かに骨を折り、労働を加えて、自然が置いた状態を何らかのかたちで変えた者は、それによってそのものの所有権を得た。だが、手もとに置いたまま、正しく使わずに駄目にしたり、使いきる前に果実や鹿の肉を腐らせたりすれば、万人に共通する自然法に背いたので、処罰を受けうる。隣人の取り分を侵したからである。自分にとって必要で、暮らしの役に立つ範囲を越えて、それらのものを得る権利はなかったのである。",
      "translation_status": "reviewed"
    },

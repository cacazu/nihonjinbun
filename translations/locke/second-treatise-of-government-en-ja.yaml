    {
      "id": "locke-s085",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:157",
          "printed_page": "303",
          "source_sequence": 102
        }
      ],
      "source_text": "85. Master and Servant are Names as old as History, but given to those of far different condition; for a Free-man makes himself a Servant to another, by selling him, for a certain time, the Service, he undertakes to do, in exchange, for Wages he is to receive: and though this commonly puts him into the Family of his Master, and under the ordinary discipline thereof; yet it gives the Master but a Temporary Power over him, and no greater than what is contained in the Contract between them. But there is another sort of Servants, which, by a peculiar Name, we call Slaves, who, being Captives, taken in a just War, are, by the Right of Nature, subjected to the Absolute Dominion, and Arbitrary Power of their Masters. These Men having, as I say, forfeited their Lives, and, with it, their Liberties, and lost their Estates; and being in the state of Slavery, not capable of any Property, cannot, in that state, be considered as any part of civil Society; the chief end whereof is the preservation of Property.",
      "translation_ja": "第85節　主人と使用人は歴史と同じほど古い呼び名だが、その下には境遇の大きく違う者がいる。自由人は、一定期間行うと約束した労務を、受け取る賃金と引き換えに他人に売り、使用人となる。普通は主人の家に入り、その家の日常の規律に従うことになるが、それで主人が得るのは、一時的な権力にすぎない。二人の契約に含まれるものを超えることもない。しかし、別の種類の使用人がいて、特に奴隷と呼ばれる。正当な戦争で捕らえられた捕虜であり、自然の権利に従って、主人の絶対的な支配と恣意的な権力に服するとされる人々である。先に述べたとおり、この人々は命を失ういわれがあり、それとともに自由を失い、財産も失っている。奴隷状態では何も所有できないので、その状態のままでは、財産を保全することを第一の目的とする市民社会の一員とみなされることはできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s086",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:157",
          "printed_page": "303",
          "printed_page_end": "304",
          "source_sequence": 103
        }
      ],
      "source_text": "86. Let us therefore consider a Master of a Family with all these subordinate Relations of Wife, Children, Servants and Slaves, united under the domestick rule of a Family; which what resemblance soever it may have in its order, offices, and number too, with a little Commonwealth; yet is very far from it, both in its constitution, power and end: or if it must be thought a Monarchy, and the Paterfamilias, the absolute Monarch in it, absolute Monarchy will have but a very shattered and short Power, when 'tis plain, by what has been said before, That the Master of the Family has a very distinct and differently limited Power, both as to time and extent, over those several persons that are in it; for excepting the Slave (and the Family is as much a Family, and his Power as Paterfamilias as great, whether there be any Slaves in his Family or no) he has no Legislative power of Life and Death over any of them, and none too but what a Mistress of a Family may have as well as he. And he certainly can have no absolute power over the whole Family, who has but a very limited one over every individual in it. But how a Family, or any other Society of Men differ from that which is properly political Society, we shall best see, by considering wherein political Society it self consists.",
      "translation_ja": "第86節　では、妻、子ども、使用人、奴隷という従属する関係のすべてを、一家の内の規律のもとに結び集める家の主人について考えよう。秩序や役割、人数まで小さな国家にどれほど似ていようとも、構成でも権力でも目的でも、一家は国家に遠く及ばない。もしこれを君主政とみなし、家父をその絶対君主だと考えなければならないなら、それはなんとばらばらで底の浅い絶対君主の権力だろう。先に述べたことから明らかなように、家の主人の権力は、その家にいる人ごとに別々で、期間にも及ぶ範囲にもそれぞれ限度があるからである。奴隷を別にすると（家に奴隷がいようといまいと、一家は同じく一家であり、家父としてのその人の権力もまったく変わらない）、家の主人は誰についても生殺を決める立法権を持たず、女主人にも持てる権力よりほかは持たない。それぞれの成員についてごく限られた権力しか持たない者が、一家全体への絶対権力を持つはずはない。それにしても、家族やほかの人間社会が、厳密な意味での政治社会とどう違うかは、政治社会が何に成り立つかを考えると、いちばんよく分かる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s087",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

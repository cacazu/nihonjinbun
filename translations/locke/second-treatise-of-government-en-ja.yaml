      "source_text": "First, The Legislative acts against the Trust reposed in them, when they [??]deavour to invade the Property of the Subject, and to make themselves, or any part of the Community, Masters, or Arbitrary Disposers of the Lives, Liberties, or Fortunes of the People.",

      "source_text": "13. To this strange Doctrine, viz. That in the State of Nature, every one has the Executive Power of the Law of Nature, I doubt not but it will be objected; That it is unreasonable for Men to be Judges in their own Cases, that self love will make Men partial to themselves and their Friends. And on the other side ill Nature, Passion and Revenge will carry them too far in punishing others. And hence nothing but confusion and disorder will follow, and that therefore God hath certainly appointed Government to restrain the partiality and violence of Men, I easily Grant, that Civil Government is the proper Remedy for the Inconveniences of the State of Nature, which must certainly be Great, where Men may be Judges in their own Case, since 'tis easiy to be imagined, that he who was so unjust as to do his Brother an Injury, will scarce be so just as to condemn himself for it: But I shall desire those who make this Objection, to remember that Absolute Monarchs are but Men, and if Government is to be the Remedy of those Evils, which necessarily follow from Mens being Judges in their own Cases, and the State of Nature is therefore not to be endured, I desire to know what kind of Government that is, and how much better it is then the State of Nature, where one Man commanding a multitude, has the Liberty to be Judge in his own Case, and may do to all his Subjects whatever he pleases, without the least question or controle of those, who Execute his Pleasure? And in whatsoever he doth, whether lead by reason, mistake or passion, must be submitted to? Which Men in the State of Nature are not bound to do one to another. And if he that Judges, Judges amiss in his own, or any other Case, he is answerable for it, to the rest of Mankind.",
      "translation_ja": "第13節　自然状態では誰もが自然法の執行権を持つというこの奇妙な説に対しては、きっとこういう反論が起こる。自分が当事者である事件で、自分が裁判官になるのは道理に合わない。自己愛のため、自分や友人にひいきするだろうし、反対に悪意や激情や報復心のため、他人を必要以上に罰するだろう。そこから生まれるのは混乱と無秩序ばかりだから、神は人の偏りや暴力を抑えるため、間違いなく政府をお定めになったのだ、と。市民政府こそ自然状態の不都合に対する適切な対策であることは、私もやすやすと認める。自分自身の事件を裁くことができる以上、不都合が大きいに決まっている。同胞に害を与えるほど不正な者が、その害のために進んで自分に有罪を言い渡すほど公正なことはまずないと、容易に想像できるからだ。だがその反論をする人々には、絶対君主も一人の人間にすぎないことを思い出してほしい。自分が当事者である事件を裁くことから必然的に生まれる害悪を政府が取り除くべきであり、そのために自然状態はとうてい容認できないというのなら、一人が大勢に君臨し、自分の事件の裁判官となる自由を得て、意のままに全臣民を扱い、その意向を執行する者は少しも疑問を表明したり抑えたりできない政府とは、いったい何なのか。それが自然状態よりどれほどましなのか、知りたいものだ。しかも君主が理性からしようと、思い違いからしようと、激情に駆られてしようと、何をしても服従しなければならないという。自然状態にある人々には、互いにそんな服従の義務はない。裁く者が自分の事件であれ、他人の事件であれ、誤った裁きをすれば、ほかの人々に対して責任を負うのである。",
      "translation_status": "reviewed"
    },

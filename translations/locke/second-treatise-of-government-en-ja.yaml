      ],
      "source_text": "CHAP. XIII. Of the Subordination of the Powers of the Commonwealth.",
      "translation_ja": "第十三章　国家の諸権力の上下関係について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s149",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:190",
          "printed_page": "369",
          "printed_page_end": "371",
          "source_sequence": 183
        }
      ],
      "source_text": "149. THough in a Constituted Commonwealth, standing upon its own Basis, and acting according to its own nature, that is, acting for the preservation of the Community, there can be but one Supream Power, which is the Legislative, to which all the rest are and must be subordinate, yet the Legislative being only a Fiduciary Power to act for certain ends, there remains still in the People a Supream Power to remove or alter the Legislative, when they find the Legislative act contrary to the trust reposed in them. For all Power given with trust for the attaining an end, being limited by that end, when ever that end is manifestly neglected, or opposed, the trust must necessarily be forfeited, and the Power devolve into the hands of those that gave it, who may place it a-new where they shall think best for their safety and security. And thus the Community perpetually retains a Supream Power of saving themselves from the attempts and designs of any Body, even of their Legislators, whenever they shall be so foolish, or so wicked, as to lay and carry on designs against the Liberties and Properties of the Subject. For no Man or Society of Men, having a Power to deliver up their Preservation, or consequently the means of it, to the absolute Will, and arbitrary Dominion of another; when ever any one shall go about to bring them into such a Slavish Condition, they will always have a right to preserve what they have not a Power to part with; and to rid themselves of those who invade this Fundamental, Sacred, and unalterable Law of Self-Preservation, for which they enter'd into Society. And thus the Community may be said in this respect, to be always the Supream Power, but not as considered under any Form of Government, because this Power of the People can never take place till the Government be dissolv'd.",
      "translation_ja": "第149節　すでに設けられた国家が自分の土台に立ち、その本来の性質どおり、つまり共同体の保全のために行動しているなら、最高権力は立法権一つしかありえず、他のすべての権力はこれに従属し、従属しなければならない。だが、立法権は一定の目的のために信任を託された権力にすぎない。だから立法機関が託された信任に反して行動すると分かったとき、その機関を取り除いたり改めたりする最高権力は、なお人民の手に残る。ある目的を達成するため信任とともに与えられた権力は、すべてその目的によって限られる。この目的が明らかにないがしろにされ、または妨げられるとき、信任を受けた者は当然それを失い、権力は与えた人々の手に戻る。人々は、安全と保障に最もよいと思うところに、改めて権力を置ける。こうして共同体は、誰であれその企てや意図から自らを救う最高権力を常に保つ。立法者たちであれ、愚かにも邪悪にも、臣民の自由や財産を害する企てを立てて実行に移すなら、変わりはない。個人にも人々の社会にも、自らを保つことや、その手段を他人の絶対の意志と恣意的な支配に渡す権限はないから、そういう奴隷のような境遇に置こうとする者がいれば、手放す権限のないものを守る権利を、いつでも持っている。また、人々が社会に入る目的とした、神聖で変わることのない自己保全の根本法を侵す者を退ける権利を持つ。こうした意味では、共同体がつねに最高権力だと言ってよい。ただし、どのような形にせよ、政府の下にある共同体を考える場合には当てはまらない。人民のこの権力が働くのは、政府が解体したときだけだからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s150",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:191",
          "printed_page": "371",
          "source_sequence": 184
        }
      ],
      "source_text": "150. In all Cases, whilst the Government subsists, the Legislative is the supream Power. For what can give Laws to another must needs be superiour to him; and since the Legislative is no otherwise Legislative of the Society, but by the right it has to make Laws for all the parts, and every Member of the Society prescribing Rules to their actions, and giving power of Execution where they are transgressed, the Legislative must needs be the Supream, and all other Powers in any Members or parts of the Society, derived from and subordinate to it.",
      "translation_ja": "第150節　政府が存続する間は、どんな場合も立法権が最高権力である。他者に法を与えられるものは、必ずその相手より上にあるからだ。立法機関が社会の立法機関であるのは、社会のどの部分、どの成員にも法を定め、その行動の規則を示し、規則に背く場合、執行する権限を授ける権利を持つからである。したがって、立法権は必ず最高権力であり、社会のどんな成員や部分にある他の権力も、みな立法権に由来し、これに従属する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s151",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:191",
          "printed_page": "371",
          "printed_page_end": "372",
          "source_sequence": 185
        }
      ],
      "source_text": "151. In some Commonwealths where the Legislative is not always in being, and the Executive is vested in a single Person, who has also a share in the Legislative; there that single Person in a very tolerable sense may also be called Supream; not that he has in himself all the Supream Power, which is that of Law-making: but because he has in him the supream Execution, from whom all inferiour Magistrates derive all their several subordinate Powers, or at least the greatest part of them; having also no Legislative superiour to him, there being no Law to be made without his consent, which cannot be expected should ever subject him to the other part of the Legislative, he is properly enough in this sense Supream. But yet it is to be observed, that though Oaths of Allegiance and Fealty are taken to him, 'tis not to him as Supream Legislator, but as Supream Executor of the Law, made by a joint Power of him with others; Allegiance being nothing but an Obedience according to Law, which when he violates, he has no right to Obedience, nor can claim it otherwise than as the publick Person vested with the Power of the Law, and so is to be consider'd as the Image, Phantom, or Representative of the Commonwealth, acted by the will of the Society, declared in its Laws; and thus he has no Will, no Power, but that of the Law. But when he quits this Representation, this publick Will, and acts by his own private Will, he degrades himself and is but a single private Person without Power, and without Will. The Members owing no Obedience but to the publick Will of the Society.",
      "translation_ja": "第151節　国家によっては、立法機関は常設でなく、執行権が立法にもあずかる一人に与えられている。その場合、かなり妥当な意味で、その人も最高の権力者と呼べる。最高権力、すなわち立法の力のすべてを一人で持っているからではない。最高の執行権を持ち、下位の公職者はそれぞれの従属する権限のすべて、あるいは少なくとも大部分をその人から授かるからである。しかも、その人の同意なしに法は一つも定められないので、その上に立つ立法機関もない。その同意によって、立法機関の他の部分に自分を従属させるとは期待できないのだから、この意味で最高の権力者と呼ぶのは、かなり適切である。ただし、彼に臣従と忠誠の誓いがなされても、最高の立法者としての彼に対してではない。ほかの者と彼とが力を合わせて定めた法の、最高の執行者としての彼に対してである。忠誠とは、法に従った服従にすぎない。彼が法に背けば、服従を受ける権利はなく、法の権力を委ねられた公の人としてしか、服従を求めることはできない。したがって、彼は国家の像、あるいはその写し、またはその代表として見られるべきであって、法に表明された社会の意志によって動く。彼には法のもの以外に、意志も権力もないのである。ところが、この代表としての立場、この公の意志を離れ、自分個人の意志に従って行動すれば、自分を卑しめて、権力も、皆に通用する意志もない一個人にすぎなくなる。成員が従う義務を負うのは、社会の公の意志だけである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s152",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:192",
          "printed_page": "372",
          "printed_page_end": "373",
          "source_sequence": 186
        }
      ],
      "source_text": "152. The Executive Power placed any where but in a Person that has also a share in the Legislative, is visibly subordinate and accountable to it, and may be at pleasure changed and displaced; so that it is not the Supream Executive Power that is exempt from Subordination, but the Supream Executive Power vested in one, who having a share in the Legislative, has no distinct superiour Legislative to be subordinate and accountable to, father than he himself shall join and consent, so that he is no more subordinate than he himself shall think fit, which one may certainly conclude will be but very little. Of other Ministerial and subordinate Powers in a Commonwealth, we need not speak, they being so multiply'd with infinite variety in the different Customs and Constitutions of distinct Commonwealths, that it is impossible to give a particular account of them all. Only thus much which is necessary to our present purpose we may take notice of concerning them, that they have no manner of Authority any of them, beyond what is by positive Grant and Commission delegated to them, and are all of them accountable to some other Power in the Commonwealth.",
      "translation_ja": "第152節　立法にもあずかる人物以外の手に置かれた執行権は、明らかに立法権に従属し、これに対して責任を負い、立法機関の判断で変更され、退けられうる。だから、従属を免れるのは、最高の執行権それ自体ではない。それを授かった人が立法にあずかるため、自分も同意に加わるのでなければ、自分が従属して責任を負うべき、別個の上位の立法機関を持たず、結局、自分がよいと思う限度でしか従属しない、その場合の最高の執行権である。そうした従属がごく小さいことは、まず間違いない。そのほか、国家で委任を受けて働く下位の権力については、述べる必要がない。各国の慣習や国制によって、非常に多く、限りなく形が異なり、その一つひとつを細かく述べることはできないからである。今の目的のために必要なのは、ただ次の点に注意することである。これらの権力には、明示の付与や委任によって任されたものを越えて、いかなる権威もない。またそのすべてが、国家にある何かほかの権力に対して責任を負う。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s153",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:192",
          "printed_page": "373",
          "printed_page_end": "374",
          "source_sequence": 187
        }
      ],
      "source_text": "153. It is not necessary, no nor so much as convenient, that the Legislative should be always in being. But absolutely necessary, that the Executive Power should, because there is not always need of new Laws to be made, but always need of Execution of the Laws that are made. When the Legislative hath put the Execution of the Laws they make into other hands, they have a power still to resume it out of those hands when they find cause, and to punish for any mall-administration against the Laws. The same holds also in regard of the Federative Power, that and the Executive being both Ministerial and subordinate to the Legislative, which as has been shew'd in a Constituted Commonwealth, is the Supream. The Legislative also in this Case being suppos'd to consist of several Persons; for if it be a single Person, it cannot but be always in being, and so will as Supream, naturally have the Supream Executive Power, together with the Legislative, may assemble and exercise their Legislative, at the times that either their original Constitution, or their own Adjournment appoints, or when they please; if neither of these hath appointed any time, or there be no other way prescribed to convoke them. For the Supream Power being placed in them by the People, 'tis always in them, and they may exercise it when they please, unless by their original Constitution, they are limited to certain Seasons, or by an Act of their Supream Power, they have Adjourned to a certain time, and when that time comes, they have a right to Assemble and act again.",
      "translation_ja": "第153節　立法機関が常に存在する必要はなく、都合がよいとさえいえない。しかし執行権が常に存在することは、絶対に必要である。新しい法をつねに定める必要はないが、定めた法はいつも執行する必要があるからだ。立法機関が自ら定めた法の執行を別の手に置いたなら、理由があると判断するとき、その手から執行権を取り戻し、法に背く失政を処罰する力をなお持っている。同じことは対外権にも当てはまる。これと執行権はともに、任された仕事を行う権力であり、立法権に従属する。示したように、すでに設けられた国家で、立法権は最高である。また、この場合の立法機関は複数の人から成るものとする。一人の人であるなら、いつも存在することになり、最高の者として、立法権とともに最高の執行権を自然に持つからである。複数の人から成る立法機関は、初めの国制が定めた時、自分たちが休会にあたり定めた時、あるいはいずれも時を定めず、招集の別の方法も規定されていないなら、望む時に、集まって立法権を行使できる。人民が最高権力を彼らに置いた以上、それはいつも彼らのもとにあり、望む時に行使できる。ただし、初めの国制が一定の時期に限っているか、自らの最高権力を使って一定の時まで休会している場合を除く。その時が来れば、また集まって行動する権利がある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s154",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:193",
          "printed_page": "375",
          "source_sequence": 188
        }
      ],
      "source_text": "154. If the Legislative, or any part of it be of Representatives, chosen for that time by the People, which afterwards return into the ordinary state of Subjects, and have no share in the Legislature but upon a new choice, this power of chuseing must also be exercised by the People, either at certain appointed Seasons, or else when they are summon'd to it; and in this latter Case, the power of convokeing the Legislative, is ordinarily placed in the Executive, and has one of these two limitations in respect of time: That either the Original Constitution requires their Assembling and acting at certain intervals, and then the Executive Power does nothing but Ministerially issue directions for their Electing and Assembling, according to due Forms: Or else it is left to his Prudence to call them by new Elections, when the occasions or exigencies of the publick require the amendment of old, or making of new Laws, or the redress or prevention of any inconveniencies that lye on, or threaten the People.",
      "translation_ja": "第154節　立法機関の全部か一部が、そのときのために人民から選ばれ、後で普通の臣民の立場に戻り、改めて選ばれるまでは立法に関わらない代表者から成るなら、代表者を選ぶ力も、定められた時期か、選ぶよう招集されたときに、人民が行使しなければならない。後の場合、立法機関を招集する力は、普通、執行権を持つ者に置かれ、時期の点では次のどちらかに限られる。初めの国制が、一定の間隔で会合して行動するよう求めているなら、執行権は、しかるべき手続きに従って代表者を選び、集まるよう、委ねられた事務として指示を出すだけである。あるいは、公の事情や切迫した必要により、古い法律を改め、新しい法律を定め、また人民にすでに及ぶか、及ぶおそれのある不都合を正し、予防するために必要なとき、新たな選挙で彼らを招集することが、執行権を持つ者の分別に委ねられている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s155",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:193",
          "printed_page": "375",
          "printed_page_end": "376",
          "source_sequence": 189
        }
      ],
      "source_text": "155. It may be demanded here, what if the Executive Power, being possessed of the force of the Commonwealth, shall make use of that force to hinder the meeting and acting of the Legislative, when the original Constitution, or the publick Exigencies require it? I say using Force upon the People, without Authority, and contrary to the Trust put in him that does so, is a state of War with the People, who have a right to reinstate their Legislative in the Exercise of their Power. For having erected a Legislative with an intent they should exercise the Power of making Laws, either at certain set times, or when there is need of it; when they are hinder'd by any force from what is so necessary to the Society, and wherein the safety and preservation of the People consists, the People have a right to remove it by force. In all states and conditions the true remedy of Force without Authority, is to oppose Force to it. The use of Force without Authority, always puts him that uses it into a state of War, as the Aggressor, and renders him liable to be treated accordingly.",
      "translation_ja": "第155節　そこで、執行権を持つ者が国家の力を掌握しており、初めの国制や公の切迫した事情が求めるときに、立法機関が集まって行動することを、その力で妨げたならどうなるのか、と問われるかもしれない。私はこう考える。権限なしに、しかも託された信任に反して人民に力を用いることは、人民とのあいだに戦争状態を作る。人民には、自分たちの立法機関に権力を再び行使させる権利がある。人民は、定まった時か必要な時に法を制定できるよう、立法機関を設けたのである。社会にこれほど必要で、人民の安全と保全に関わることを力で妨げられたなら、人民にはその妨げを力で取り除く権利がある。どんな状態や事情にせよ、権限なく用いられた力には、力で対抗するのが真の救済である。権限なく力を用いる者は、いつでも、そのことによって攻撃者として戦争状態に入り、それに応じて扱われる立場に身を置く。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s156",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:194",
          "printed_page": "376",
          "printed_page_end": "378",
          "source_sequence": 190
        }
      ],
      "source_text": "156. The Power of Assembling, and dismissing the Legislative, placed in the Executive, gives not the Executive a superiority over it, but is a Fiduciary Trust placed in him for the safety of the People, in a Case where the uncertainty and variableness of humane affairs could not bear a steady fixed rule. For it not being possible, that the first Framers of the Government, should by any foresight, be so much Masters of future Events, as to be able to prefix so just periods of return and duration to the Assemblies of the Legislative, in all times to come, that might exactly answer all the Exigences of the Commonwealth; the best remedy could be found for this defect, was to trust this to the prudence of one who was always to be present, and whose business it was to watch over the publick good. Constant frequent meetings of the Legislative, and long Continuations of their Assemblies, without necessary occasion, could not but be burthensome to the People, and must necessarily in time produce more dangerous inconveniencies, and yet the quick turn of affairs, might be sometimes such as to need their present help: any delay of their Convening might endanger the publick, and sometimes too their business might be so great, that the limited time of their sitting might be too short for their work, and rob the publick of that benefit which could be had only from their mature deliberation. What then could be done in this Case to prevent the Community from being exposed sometime or other to eminent hazard on one side, or the other, by fixed intervals and periods, set to the meeting and acting of the Legislative. But to intrust it to the prudence of some, who being present, and acquainted with the state of publick affairs, might make use of this Prerogative for the publick good? And where else could this be so well placed as in his hands who was intrusted with the Execution of the Laws for the same end? Thus supposing the regulation of times for the Assembling and Sitting of the Legislative, not setled by the original Constitution, it naturally fell into the hands of the Executive; not as an Arbitrary Power depending on his good pleasure, but with this trust always to have it exercised only for the publick Weal, as the Occurrences of times and change of affairs might require. Whether setled periods of their Convening, or a liberty left to the Prince for Convoking the Legislative, or perhaps a mixture of both, hath the least inconvenience attending it, 'tis not my business here to inquire, but only to shew, that though the Executive Power may have the Prerogative of Convoking and dissolving such Conventions of the Legislative, yet it is not thereby superiour to it.",
      "translation_ja": "第156節　執行権を持つ者に、立法機関の招集と解散の力を置いても、立法機関より上に置くことにはならない。それは、先の読めない、変わりやすい人の世の事情に、動かせない一定の規則では対応できないところで、人民の安全のために彼に託した権限である。政府を最初に作る人々には、どれほど先を見通しても、後に起こる出来事をすべて見越すことはできない。そこで、立法機関がいつ再び集まり、どれだけ会合を続けるかを、将来のいかなる時にも、国家のどのような切迫した事情にもぴたりと合うように、前もって定めることもできない。この不足に対して見つけうる最善の対策は、いつでもその場におり、公の利益を見守ることを仕事とする人の分別に、これを委ねることだった。必要もないのに立法機関がたびたび集まり、会合を長く続けることは、どうしても人民の負担になり、時がたてばいっそう危険な不都合をもたらさざるをえない。だが、事態が急変し、すぐ立法機関の助けが必要となることもあり、招集を遅らせることは公に危険を及ぼしかねない。時には仕事があまりに大きく、決められた会期では短すぎ、よく考え抜いて議論することでしか得られない利益を、公から奪うことにもなる。では、会合と活動について間隔や期間を固定したために、いずれかの側から共同体がいつか差し迫った危険にさらされることを防ぐには、どうすればよいか。公の事務の事情を知り、その場にいる者の分別に託し、この大権を公共の利益のために使えるようにするほかない。そして同じ目的のために法の執行を任された人の手ほど、これをよく置けるところがどこにあるだろうか。そこで、立法機関の招集と会期を規律する時期が、初めの国制で定められていないなら、この力は自然に執行権の手に帰した。ただし、執行権を持つ者の好みに任された恣意的な力ではない。折々の出来事や事態の変化に応じ、常にただ公の福利のために行使するという信任のもとに置かれた力である。定期的な招集、君主が自由に立法機関を招集できるやり方、あるいはその組み合わせのうち、どれが最も不都合が少ないかは、ここで調べることではない。ここで示したいのは、執行権がこのような立法機関の会合を招集し解散する大権を持っていても、それによって立法機関の上に立つわけではないということだけである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s157",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:195",
          "printed_page": "378",
          "printed_page_end": "380",
          "source_sequence": 191
        }
      ],
      "source_text": "157. Things of this World are in so constant a Flux, that nothing remains long in the same State. Thus People, Riches, Trade, Power, change their Stations; flourishing mighty Cities come to ruine, and prove in time neglected desolate Corners, whilst other unfrequented places grow into populous Countries, fill'd with Wealth and Inhabitants. But things not always changing equally, and private interest often keeping up Customs and Priviledges when the reasons of them are ceased, it often comes to pass, that in Governments, where part of the Legislative consists of Representatives chosen by the People, that in tract of time, this Representation becomes very unequal and disproportionate to the reasons it was at first establish'd upon. To what gross absurdities the following of Custom when Reason has left it may lead, we may be satisfied when we see the bare name of a Town, of which there remains not so much as the ruins, where scarce so much Housing as a Sheepcoat, or more Inhabitants than a Shepherd is to be found, send as many Representatives to the grand Assembly of Law-makers, as a whole County numerous in People, and powerful in riches. This Strangers stand amazed at, and every one must confess needs a remedy. Though most think it hard to find one, because the Constitution of the Legislative being the original and supream act of the Society, antecedent to all positive Laws in it, and depending wholly on the People, no inferiour Power can alter it. And therefore the People, when the Legislative is once Constituted, having in such a Government as we have been speaking of, no Power to act as long as the Government stands; this inconvenience is thought incapable of a remedy.",
      "translation_ja": "第157節　この世の物事は絶えず移り変わり、長い間、同じままでいるものはない。人口、富、商業、権力の中心も移り変わる。栄え、力のあった都市が衰え、やがて見捨てられた寂しい片隅となる一方、人の訪れなかった場所が、財と住民で満ち、人口の多い土地になる。ところが、物事は必ずしも一様に変わらず、慣習や特権を支えた理由が消えてからも、私的な利害がそれを残すことが多い。そのため、立法機関の一部が人民の選んだ代表から成る政府では、時がたつにつれ、最初の制度の根拠となった理由に照らして、代表の割り当てがひどく不平等で、不釣り合いになることがよくある。理にかなわなくなった慣習になお従うと、どれほど甚だしく不合理なことになるかは、次の例で十分分かる。町の名しか残らず、廃墟さえなく、羊小屋ほどの建物も、羊飼いより多くの住民もいるかどうかというところが、住民が多く富の力もある一州全体と同数の代表を、立法者の大議会に送り出す。よその人はこれに驚き、何とかしなければならないとは誰もが認めざるをえない。それでもたいていの人は、対策を見つけるのは難しいと考える。立法機関の構成は社会の最初の最高の行為であり、社会のすべての実定法に先立ち、もっぱら人民に依存するので、下位の権力には改められないからである。したがって、これまで述べてきたような政府では、立法機関がいったん設けられると、政府が存続する間は人民に行動する力がないため、この不都合は救いようがないと思われている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s158",
      "section_id": "ch-13",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:196",
          "printed_page": "380",
          "printed_page_end": "382",
          "source_sequence": 192
        }
      ],
      "source_text": "158. Salus Populi Suprema Lex, is certainly so just and fundamental a Rule, that he who sincerely follows it cannot dangerously err. If therefore the Executive, who has the Power of Convoking the Legislative, observing rather the true proportion than fashion of Representation, regulates not by old custom, but true reason, the number of Members, in all places, that have a right to be distinctly represented, which no part of the People, however incorporated, can pretend to; but in proportion to the assistance which it affords to the publick, it cannot be judg'd to have set up a new Legislative, but to have restored the old and true one, and to have rectified the disorders which succession of time had insensibly as well as inevitably introduced; for it being the interest as well as intention of the People to have a fair and equal Representative; whoever brings it nearest to that, is an undoubted Friend to, and Establisher of the Government, and cannot miss the Consent and Approbation of the Community. Prerogative being nothing but a Power in the hands of the Prince to provide for the publick good, in such Cases, which depending upon unforeseen and uncertain Occurrences, certain and unalterable Laws could not safely direct. Whatsoever shall be done manifestly for the good of the People, and establishing the Government upon its true Foundations, is, and always will be, just Prerogative. The Power of Erecting new Corporations, and therewith new Representatives, carries with it a supposition, that in time, the measures of representation might vary, and those have a just right to be represented which before had none; and by the same reason, those cease to have a right, and be too inconsiderable for such a priviledge which before had it. 'Tis not a Change from the present State which perhaps Corruption or decay has introduced, that makes an Inroad upon the Government, but the tendency of it to injure or oppress the People, and to set up one part or Party with a distinction from, and an unequal subjection of the rest. Whatsoever cannot but be acknowledged to be of advantage to the Society and People in general, upon just and lasting measures, will always, when done, justify it self; and whenever the People shall chuse their Representatives upon just and undeniably equal measures, suitable to the original Frame of the Government, it cannot be doubted to be the will and act of the Society, whoever permitted or propos'd to them so to do.",
      "translation_ja": "第158節　「人民の安全こそ最高の法である」とは、実に正当で根本的な規則で、誠実に従う者は、危険な誤りに陥りようがない。したがって、立法機関を招集する力を持つ執行権の担い手が、これまでの代表のしきたりより正しい比率に目を向け、独自に代表を送る権利のあるすべての場所について、古い慣習でなく真の道理によって、議員の数を整えたとする。そのような権利は、人民の一部がどのように団体を作っていようとも、公に対して果たす助けに見合うかぎりでしか、主張できない。この調整は新しい立法機関を設けたのではなく、古くからの、本来の立法機関を立て直し、時の経過が気づかぬうちに、しかも必然的に持ちこんだ乱れを正したと見るべきである。公平で平等な代表を得ることは、人民の意図であるとともにその利益でもあり、それに最も近づけた者は、疑いなく政府の味方であり、その土台を固める者であり、共同体の同意と承認を得ないはずはない。大権とは、予想できず、先の定まらない出来事に左右されるので、一定不変の法律では安全な指図ができない場合に、公共の利益を図るため君主の手にある力にほかならない。人民のために、そして政府を本来の土台の上に確立するために、明らかに行われることは、今も今後も、正当な大権である。新しい自治体を設け、それとともに新しい代表を置く力には、やがて代表を置く基準が変わり、以前は代表を送る権利がなかったところが、正当にその権利を持つようになりうるという前提がある。同じ理由から、以前その特権を持ったところが、今は重要性を欠き、そうした権利を失うこともある。政府への侵害となるのは、おそらく腐敗や衰えが招いた今の状態を変えることではない。人民を害し、圧迫し、その一部や一党を残りから区別して上に立て、残りを不平等な従属に置こうとする傾きである。正当で長続きする尺度に照らし、社会と一般の人民の利益になると認めざるをえないことは、実際に行われれば、いつも自らの正しさを示す。人民が、政府のもとの構成にふさわしい、正しく疑いなく平等な尺度で、自分たちの代表を選ぶなら、誰がそうすることを許したり提案したりしたにせよ、それが社会の意志と行為であることに疑いはない。",
      "translation_status": "reviewed"
    },
    {

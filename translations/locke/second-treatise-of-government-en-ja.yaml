          "source_sequence": 61
        }
      ],
      "source_text": "47. And thus came in the use of Money, some lasting thing that Men might keep without spoiling, and that, by mutual consent, Men would take in exchange for the truly useful, but perishable Supports of Life.",
      "translation_ja": "第47節　こうして貨幣が使われるようになった。損なわずに蓄えておける、長もちする何かを、本当に役立つが長もちしない生活の糧と引き換えに、人々が互いの同意によって受け取るようになったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s048",
      "section_id": "ch-05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:139",
          "printed_page": "266",
          "printed_page_end": "268",
          "source_sequence": 62
        }
      ],
      "source_text": "48. And as different degrees of Industry were apt to give Men Possessions in different Proportions, so this Invention of Money gave them the opportunity to continue and enlarge them. For supposing an Island, separate from all possible Commerce with the rest of the World, wherein there were but a Hundred Families, but there were Sheep, Horses and Cowes, with other useful Animals, wholesome Fruits, and Land enough for Corn, for a Hundred thousand times as many, but nothing in the Island, either because of its Commonness, or perishableness, fit to supply the Place of Money: What reason could any one have there to enlarge his Possessions, beyond the use of his Family, and a plentiful supply to its Consumption, either in what their own Industry produced, or they could barter for like perishable, useful Commodities, with others? Where there is not something both lasting and scarce, and so valuable to be hoarded up, there Men will not be apt to enlarge their Possessions of Land, were it never so rich, never so free for them to take. For I ask, What would a Man value Ten thousand, or an Hundred thousand Acres of excellent Land, ready cultivated, and well stocked too with Cattle, in the middle of the in-land Parts of America, where he had no hopes of Commerce with other parts of the World, to draw Money to him, by the Sale of the Product. It would not be worth the inclosing, and we should see him give up again to the wild Common of Nature what-ever was more than would supply the Conveniencies of Life, to be had there, for him and his Family.",
      "translation_ja": "第48節　働きぶりの違いから、人々の持ち物にはもともと多い少ないが生じやすかったが、貨幣の発明は、さらにそれを持ち続け、増やす機会を与えた。世界のほかの部分と取引する可能性がまるでない島に、たった百家族が暮らすとしよう。羊、馬、牛その他の役に立つ動物がいて、体によい果実も、十万倍もの家族を養う穀物を作れる土地もあるが、ありふれているか、腐りやすいために、貨幣の代わりになるものは島にはない。そこで、家族が使う分を超えて、また自分たちの労働で作ったものや、他の人から物々交換で手に入れられる、同じように腐りやすく有用な物で、家族の消費を豊かにまかなえる分を超えて、所有地を広げる理由が誰かにあるだろうか。長もちするうえに稀少で、それゆえ貯め込む値打ちのある何かがなければ、いくら肥沃で、いくら自由に取ってよい土地でも、誰もその所有を広げようとはしないだろう。そこで聞きたい。アメリカの奥まった内陸に、よく耕され、家畜も十分にいる良質な土地が一万、あるいは十万エーカーあっても、世界のほかの地域と取引して、産物を売って貨幣を得る見込みがなければ、その土地をどれほどありがたいと思うだろうか。わざわざ囲い込む値打ちはない。その人は、そこで自分と家族に手に入る暮らしの便宜をまかなうのに必要な分を超える土地を、手つかずの自然の共有地へ返すことになるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s049",
      "section_id": "ch-05",

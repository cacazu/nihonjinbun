      "source_text": "39. And thus, without supposing any private Dominion, and property in Adam, over all the World, exclusive of all other Men, which can no way be proved, nor any ones Property be made out from it; but supposing the World given as it was to the Children of Men in common, we see how labour could make Men distinct titles to several parcels of it, for their private uses; wherein there could be no doubt of right, no room for quarrel.",
      "translation_ja": "第39節　こうして、アダムがほかの全人類を除いて世界全体に私的支配権と所有権を得たなどと仮定する必要はない。そのようなことは証明できず、その仮定から、いま誰かの所有権を導くこともできない。むしろ実際どおり世界は人の子らに共有で与えられたとすれば、いかに労働が、世界のそれぞれの部分を私的に使うための別個の権原を人々に与えたかが分かる。そこに権利を疑う余地も争いの種もなかったのである。",

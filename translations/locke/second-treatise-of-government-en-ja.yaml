      "source_text": "20. But when the actual force is over, the State of War ceases between those that are in Society, and are equally on both sides Subject to the Judge: And therefore in such controversies, where the question is put, who shall be Iudge? It cannot be meant, who shall decide the controversie: every one knows what Iephtha here tells us, that the Lord the Iudge, shall Judge. Where there is no Judge on Earth, the Appeal lies to God in Heaven. That question then cannot mean who shall Judge, whether another hath put himself in a State of War with me, and whether I may as Iephtha did appeal to Heaven in it? Of that I my self can only be Judge in my own Conscience, as I will answer it at the great day, to the Supream Judge of all Men.",
      "translation_ja": "第20節　ただし、現実の暴力がやめば、社会の内にいて、どちらも等しく裁判官の権限に服する人々のあいだでは、戦争状態も終わる。そこで、この種の争いで「誰が裁くのか」と問うとき、それは争いを誰が裁定するのかという意味ではありえない。エフタがここで述べているように、裁くのは裁き主なる主であることは、誰でも知っている。この世に裁判官がいないなら、訴えの先は天の神である。とすればこの問いの意は、相手が私とのあいだで戦争状態に入ったのか、その件について私もエフタと同じように天に訴えてよいのかを、判断するのは誰か、ということにほかならない。それを判断できるのは、私自身の良心だけである。最後の大いなる日に、すべての人を裁く最高の裁き主に答えるのは、私自身なのだから。",
      "translation_status": "reviewed"
    },

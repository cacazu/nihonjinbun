          "printed_page": "226",
          "source_sequence": 19
        }
      ],
      "source_text": "9. I doubt not but this will seem a very strange Doctrin to some Men, but before they condemn it, I desire them to resolve me by what Right any Prince or State can put to death, or punish an Alien, for any Crime he commits in their Country. 'Tis certain their Laws by vertue of any Sanction, they receive from the promulgated Will of the Legislative, reach not a Stranger. They speak not to him, nor if they did, is he bound to hearken to them. The Legislative Authority, by which they are in Force over the Subjects of that Common-wealth, hath no Power over him. Those who have the Supream Power of making Laws in England, France or Holland, are to an Indian, but like the rest of the World, Men without Authority: And therefore if by the Law of Nature, every Man hath not a Power to punish Offences against it, as he soberly Judges the Case to require, I see not how the Magistrates of any Community, can punish an Alien of another Country, since in reference to him, they can have no more Power, then what every Man naturally may have over another.",
      "translation_ja": "第9節　これをひどく奇妙な説と思う人がいるに違いない。ただ私の説を退ける前に、君主なり国家なりが、外国人がその国で犯した罪について、その人を死刑にしたり処罰したりするのは、どんな権利によるのかを答えてほしい。公布された立法権者の意志によって法律がどれほどの効力を与えられていようと、その効力がよそ者には及ばないのは確かである。法律はよそ者に向かって語るものではないし、たとえ語ったとしても、彼には耳を傾ける義務がない。国家の臣民に法律の効力を及ぼす立法権も、よそ者に対しては権力を持たない。イングランド、フランス、オランダで法を定める最高権力を持つ人々も、アメリカ先住民の一人にとっては、世界のほかの人々と同じ、何の権威もない人にすぎない。それゆえ、誰もが事案に照らして穏当に判断する限度で自然法違反を罰する権力を、自然法によって持つのでないかぎり、どんな共同体の役人がよその国の人を処罰できるのか、私には分からない。その人に対しては、自然に一人が他人に持ちうる以上の権力を持てないからである。",
      "translation_status": "reviewed"
    },

      "source_text": "44. From all which it is evident, that tho' the things of Nature are given in common: Man (by being Master of himself, and Proprietor of his own Person, and the Actions or Labour of it) had still in himself the great Foundation of Property: and that which made up the great part of what he applyed to the Support or Comfort of his being, when Invention and Arts had improved the conveniencies of Life, was perfectly his own, and did not belong in common to others.",
      "translation_ja": "第44節　以上から明らかなように、自然のものは共有で与えられていても、人は自分の主人であり、自分自身とその行為や労働の所有者であることで、所有の大きな根拠をいつも自分のうちに持っていた。発明や技術が暮らしの便宜を増してから、人が命をつなぎ快適に暮らすために使ったものの大部分をなすものは、完全にその人自身のものであり、ほかの人々との共有には属さなかった。",

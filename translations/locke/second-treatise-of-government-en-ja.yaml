          "printed_page_end": "453",
          "source_sequence": 275
        }
      ],
      "source_text": "231. That Subjects or Foreigners attempting by force, on the Properties of any People, may be resisted with force, is agreed on all hands. But that Magistrates, doing the same thing, may be resisted, hath of late been denied: As if those who had the greatest Priviledges and Advantages by the Law, had thereby a Power to break those Laws, by which alone they were set in a better place than their Brethren: whereas their Offence is thereby the greater, both as being ungrateful for the greater share they have by the Law, and breaking also that Trust which is put into their hands by their Brethren.",
      "translation_ja": "第231節　臣民や外国人が、ある人民の財産を力で侵そうとするなら、力で抵抗してよいことには、誰もが同意する。だが近ごろでは、公職者が同じことをしたとき、抵抗してよいことが否定されている。法によって最も大きな特権と利益を受けた者は、まさにその法によって同胞より上に置かれたのに、今度はその法を破る力を得たかのようである。実際は、法によって大きな取り分を得た恩に背き、同胞がその手に置いた信任までも破るのだから、罪はその分重い。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s232",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"

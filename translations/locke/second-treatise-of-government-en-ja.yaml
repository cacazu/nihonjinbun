    {
      "id": "locke-s224-p01",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:228",
          "printed_page": "445",
          "printed_page_end": "446",
          "source_sequence": 268
        }
      ],
      "source_text": "First, No more than any other Hypothesis. For when the People are made miserable, and find themselves exposed to the ill usage of Arbitrary Power; cry up their Governours as much as you will for Sons of Iupiter, let them be Sacred and Divine, descended or authoriz'd from Heaven; give them out for whom or what you please, the same will happen. The People generally ill treated, and contrary to right, will be ready upon any occasion to ease themselves of a burden that sits heavy upon them. They will wish and seek for the opportunity, which in the change, weakness and accidents of human affairs seldom delays long to offer it self. He must have lived but a little while in the World, who has not seen Examples of this in his time; and he must have read very little, who cannot produce Examples of it in all sorts of Governments in the World.",
      "translation_ja": "第一に、ほかの仮説より多く反乱を生むことはない。人民が惨めな状態にされ、恣意的な権力のひどい扱いにさらされていると気づけば、統治者はユピテルの息子だといくら持ち上げ、神聖で神のごとく、天から下った、あるいは天から権威を授かったと言い、何者であると好きなように触れ回っても、同じことが起きる。広くひどい扱いを受け、正当な道理に背いて扱われた人民は、機会があれば、重くのしかかる負担から逃れようとする。その機会を望み、探し求める。人の世の移り変わり、弱さ、思いがけない出来事の中では、機会が訪れるまで長くかかることはめったにない。自分の時代にこの例を見たことがないなら、ごくわずかしか世に生きていないはずであり、世界のどんな政体についてもこの例を挙げられないなら、ごくわずかしか本を読んでいないはずである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s225",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:229",
          "printed_page": "446",
          "printed_page_end": "447",
          "source_sequence": 269
        }
      ],
      "source_text": "225. Secondly, I Answer, such Revolutions happen not upon every little mismanagement in publick affairs. Great mistakes in the ruling part, many wrong and inconvenient Laws, and all the slips of human frailty will be born by the People, without mutiny or murmur. But if a long train of Abuses, Prevarications and Artifices, all tending the same way, make the design visible to the People, and they cannot but feel what they lye under, and see whither they are going; 'tis not to be wonder'd that they should then rouze themselves, and endeavour to put the rule into such hands which may secure to them the ends for which Government was at first erected; and without which, ancient Names and specious Forms, are so far from being better, that they are much worse than the state of Nature, or pure Anarchy; the inconveniencies being all as great and as near, but the remedy farther off and more difficult.",
      "translation_ja": "第225節　第二に、公の事務のささいな失敗ごとに、そのような変革は起こらない、と答える。統治する側が大きな過ちを犯そうと、間違っていて不都合な法が多くあろうと、人間の弱さからどんな落ち度があろうと、人民は反抗も不平もなく耐える。だが、濫用、ごまかし、策略が長く続き、どれも同じ方向へ向かって、その企てが人民の目に明らかになり、自分たちが何の下に置かれ、どこへ向かっているかを、どうしても身に感じ、見るようになるなら、立ち上がり、政府が初めに立てられた目的を確保してくれる者の手に統治を置こうとするのも、驚くにあたらない。この目的なしには、古くからの名称や見栄えのする制度は、自然状態や完全な無政府状態より、ましどころか、はるかに悪い。不都合はどれも同じほど大きく、同じほど差し迫っているのに、救う手段はより遠く、得ることも難しいからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s226",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:229",
          "printed_page": "447",
          "source_sequence": 270
        }
      ],
      "source_text": "226. Thirdly, I Answer, that this Power in the People of providing for their safety anew, by a new Legislative, when their Legislators have acted contrary to their trust, by invading their Property, is the best fence against Rebellion, and the probablest means to hinder it. For Rebellion being an Opposition, not to Persons but Authority, which is founded only in the Constitutions and Laws of the Government; those, whoever they be, who by force break through, and by force j[?]stify their violation of them, are truly and properly Rebels. For when Men by entering into Society and civil Government, have excluded force, and introduced Laws for the preservation of Property, Peace and Unity amongst themselves; those who set up force again in opposition to the Laws, do rebellare, that is, bring back again the state of War, and are properly Rebels: which they who are in Power, by the pretence they have to Authority, the temptation of force they have in their hands, and the Flattery of those about them being likeliest to do; the properest way to prevent the evil, is to shew them the danger and injustice of it, who are under the greatest temptation to run into it.",
      "translation_ja": "第226節　第三に、立法者が財産を侵し、信任に反して行動した場合、人民が新たな立法機関で自らの安全に備え直すこの力は、反乱を防ぐ最善のとりでであり、それを食い止める最も確かな手立てだと答えよう。反乱とは、人に対するものではなく、政府の国制と法律だけに成り立つ権威に対する抵抗である。だから、それが誰であれ、力で国制や法律を踏み破り、力で自らの違反を正当化する者が、本当の、正しい意味での反乱者である。人は社会と市民政府に入ることで、力を締め出し、互いの財産、平和、一体性を守るために法を導入した。これに対して、法に逆らってふたたび力を立てる者は、ラテン語でレベラーレ、つまり戦争状態を呼び戻すのであり、正しい意味での反乱者となる。権力の座にある者は、権威があるという口実を持ち、手もとの力に誘惑され、取り巻きのおべっかも受けるので、これをする見込みが最も高い。したがって、害を防ぐ最もふさわしい方法は、その害の危険と不正を、それに走る誘惑を最も強く受ける人々に示すことである。",
      "translation_status": "reviewed",

      "source_text": "36. The measure of Property, Nature well set, by the Extent of Mens Labour, and the Conveniency of Life: no Man's Labour could subdue, or appropriate all; nor could his Enjoyment consume more than a small part; so that it was impossible for any Man, this way, to intrench upon the Right of another, or acquire, to himself, a Property, to the Prejudice of his Neighbour, who would still have room, for as good, and as large a Possession (after the other had taken out his) as before it was appropriated; which measure did confine every Man's Possession, to a very moderate Proportion, and such as he might appropriate to himself, without Injury to any Body, in the first Ages of the World, when Men were more in danger to be lost, by wandering from their Company, in the then vast Wilderness of the Earth, than to be striatned for want of room to plant in. And the same measure may be allowed still, without prejudice to any Body, as full as the World seems. For supposing a Man, or Family, in the state they were at first, peopling of the World by the Children of Adam, or Noah; let him plant in some in-land, vacant places of America, we shall find that the Possessions, he could make himself, upon the measures we have given, would not be very large, nor, even to this day, prejudice the rest of Mankind, or give them reason to complain, or think themselves injured by this Man's Incroachment, though the Race of Men have now spread themselves to all the corners of the World, and do infinitely exceed the small number was at the beginning. Nay the extent of Ground is of so little value, without Labour, that I have heard it affirmed, that, in Spain it self, a Man may be permitted to plough, sow, and reap, without being disturbed, upon Land he has no other Title to, but only his making use of it. But, on the contrary, the Inhabitants think themselvs beholden to him, who, by his Industry, on neglected, and consequently waste Land, has increased the stock of Corn, which they wanted. But be this as it will, which I lay no stress on; this I dare boldly affirm, That the same Rule of Propriety, (viz.) that every Man should have as much as he could make use of, would hold still in the World, without straitning any body, since there is Land enough in the World, to suffice double the Inhabitants, had not the Invention of Money, and the tacit Agreement of Men, to put a value on it, introduced (by Consent) larger Possessions, and a Right to them; which, how it has done, I shall, by and by, shew more at large.",
      "translation_ja": "第36節　自然は、各人の労働が及ぶ範囲と、暮らしに役立つ度合いを、財産のちょうどよい尺度に定めた。一人の労働ですべてを従わせたり、自分のものにしたりはできないし、使って消費できるものも、ほんの一部にかぎられる。だから、この方法で他人の権利を侵したり、近隣の人を害して自分の財産を得たりすることはできなかった。一人が自分の分を取ったあとも、もう一人には、取られる前と同じように良い土地を同じだけ広く持つ余地があったからである。この尺度によって各人の所有はごく適度の広さにとどまり、まだ世界のはじめのころには、誰をも害さず自分のものにできるほどだった。当時は、耕作地が足りなくて困るより、仲間から離れ、どこまでも続く荒野で迷子になる方が危険だった。世界に人が満ちたように見える今でも、同じ尺度なら誰も害を受けずに済むだろう。アダムやノアの子孫が世界に最初に住み始めたころと同じ状態にある人か一家が、アメリカの内陸の空いた土地で栽培を始めるとしよう。ここまで述べた尺度に従えば、その人が自分のものにできる土地はそれほど広くない。今では人類が世界のすみずみまで広がり、初めのころの少人数をはるかに上回っているとはいえ、今日でさえ、その人は他の人類を害さず、彼らに不平を言ったり、侵害を受けたと思ったりする理由を与えないだろう。それどころか、労働を加えなければ、いくら広くても土地の値打ちは乏しい。スペインでさえ、利用していること以外には何の権原もない土地を、邪魔されることなく耕し、種をまき、収穫することを許されると聞いたことがある。住民はかえって、見捨てられ、そのため荒れた土地で骨を折って、不足していた穀物を増やした者に感謝するという。この話が事実かどうかは、私の論にはさほど関わらない。ただこれだけは、はっきり言える。どの人も使えるだけを持つ、という同じ所有の原則は、今でも誰をも窮屈な立場に置かず、世界中で通用したはずである。世界には住民が倍になっても足りるだけの土地がある。貨幣が発明され、人々がそれに価値を認める暗黙の合意をし、その同意によって、より大きな所有とそれを持つ権利が生まれたのでなければ、そうなっていたはずだ。それがどのように起きたかは、もう少し先で詳しく示す。",
      "translation_status": "reviewed"
    },

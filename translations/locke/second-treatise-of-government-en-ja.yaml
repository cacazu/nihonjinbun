          "printed_page": "233",
          "printed_page_end": "234",
          "source_sequence": 25
        }
      ],
      "source_text": "15. To those that say, there were never any Men in the State of Nature, I will not only oppose the Authority of the Judicious Hooker, Eccl. Pol. Li. 1 Sect. 10. where he says; The Laws which have been hitherto mentioned, i. e. the Laws of Nature, do bind Men Absolutely, even as they are Men, although they have never any settled fellowship, never any Solemn Agreement amongst themselves what to do or not to do, but for as much as we are not by our selves sufficient to furnish our selves with competent store of things, needful for such a Life, as our Nature doth desire; a Life, fit for the dignity of Man, therefore to supply those defects and imperfections which are in us, as living single and solely by our selves, we are naturally induced to seek Communion and Fellowship with others, this was the Cause of Mens uniting themselves, at first in Politic Societies. But I Moreover affirm, that all Men are naturally in that State, and remain so till by their own consents, they make themselves Members of some Politic Society, and I doubt not in the Sequel of this Discourse, to make it very clear.",
      "translation_ja": "第15節　かつて自然状態にあった人間などいないと言う人々に対しては、私はまず賢明なフッカーの権威を挙げよう。彼は『教会統治の法』第一巻第十節でこう述べている。「これまで述べてきた法、すなわち自然法は、人がただ人間であるだけで、無条件に彼らを拘束する。その人たちが定まった交わりを持ったことがなく、何をして何をしてはならないかについて、厳粛な取り決めを互いに交わしたことがなくとも変わらない。しかし、われわれの本性が望む暮らし、人間の尊厳にふさわしい暮らしに必要なものを、各人が自分の力だけで十分にまかなうことはできない。そこで、一人きりで、自分の力だけで生きるわれわれに欠けていること、至らないところを補うために、自然と他の人との共同や交わりを求めるようになる。これこそが、もともと人々が政治社会に結びついた理由である。」これに加え、私はこう主張する。人はみな自然にはあの状態にあって、自ら同意して何らかの政治社会の一員になるまでは、そこにとどまる。論を進めるうちに、この点は間違いなく明らかになると思う。",
      "translation_status": "reviewed"
    },

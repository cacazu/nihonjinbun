      "source_text": "102. He must shew a strange inclination to deny evident matter of fact when it agrees not with his Hypothesis; who will not allow, that the beginning of Rome and Venice were by the uniting together of several Men free and independent one of another, amongst whom there was no natural Superiority or Subjection. And if Iosephus Acosta's word may be taken, he tells us, that in many parts of America there was no Government at all. There are great and apparent Conjectures, says he, that these men, speaking of those of Peru, for a long time had neither Kings nor Commonwealths, but lived in Troops, as they do this day in Florida, the Cheriquanas, those of Bresil, and many other Nations, which have no certain Kings, but as occasion is offered in Peace or War, they choose their Captains as they please. l. 1. c. 25. If it be said, that every Man there was born subject to his Father, or the head of his Family. That the subjection due from a Child to a Father, took not away his freedom of uniting into what political Society he thought fit, has been already proved. But be that as it will, these Men, 'tis evident, were actually free; and whatever superiority some Politicians now would place in any of them, they themselves claimed it not; but by consent were all equal, till by the same consent they set Rulers over themselves. So that their politick Societies all began from a voluntary Union, and the mutual agreement of Men freely acting in the choice of their Governours, and forms of Government.",
      "translation_ja": "第102節　ローマやヴェネツィアは、互いに自由で独立し、生まれながらの上下関係も従属もない人々が結びついて始まった。このことさえ認めない者は、自説に合わないと、明らかな事実まで否定したがることになる。ホセ・デ・アコスタの証言を受け入れるなら、アメリカには政府が何一つなかった地方が多かったという。彼はペルーの人々について、こう語っている。「長いあいだ、この人々には王も国家もなく、幾つかの集団に分かれて暮らしたと考える、明白で大きな根拠がある。それは今、フロリダの人々やチリグアノ、ブラジルの人々、その他多くの民族が暮らすのと同じである。彼らには定まった王がなく、平時であれ戦時であれ、必要に応じて、ふさわしいと思う指導者を自由に選ぶ。」（第一巻第二十五章）誰でも、そこで父か一家の長に従う者として生まれたではないか、と言うかもしれない。だが子が父に従う義務が、自分のよいと思う政治社会に加わる自由を奪わないことは、すでに証明した。いずれにせよ、この人々が実際には自由であったことは明らかだ。今日の政治論者が彼らの何人かにどんな優越を認めようと、彼ら自身はそれを要求しなかった。同意によって自らの上に統治者を立てるまで、同意のもとで誰もが平等だった。だから、彼らの政治社会はすべて、統治者と政体を自由に選ぶ人々が、自発的に結びつき、互いに合意したことから始まったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s103",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

    {
      "id": "locke-s159",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:197",
          "printed_page": "382",
          "printed_page_end": "383",
          "source_sequence": 194
        }
      ],
      "source_text": "159. WHere the Legislative and Executive Power are in distinct hands, as they are in all moderated Monarchies and well-framed Governments, there the good of the Society requires, that several things should be left to the discretion of him that has the Executive Power. For the Legislators not being able to foresee and provide, by Laws, for all that may be useful to the Community, the Executor of the Laws having the power in his hands, has by the common Law of Nature, a right to make use of it for the good of the Society, in many Cases where the municipal Law has given no direction, till the Legislative can conveniently be Assembled to provide for it; nay many things there are which the Law can by no means provide for, and those must necessarily be left to the discretion of him that has the Executive Power in his hands, to be ordered by him as the publick good and advantage shall require; nay, 'tis fit that the Laws themselves, should in some Cases, give way to the Executive Power, or rather to this Fundamental Law of Nature and Government, viz. That as much as may be, all the Members of the Society are to be preserved. For since many accidents may happen wherein a strict and rigid observation of the Laws may do harm, as not to pull down an innocent Mans House to stop the Fire when the next to it is burning; and a Man may come sometimes within the reach of the Law, which makes no distinction of Persons, by an action that may deserve reward and pardon. 'Tis fit the Ruler should have a Power in many Cases to mitigate the severity of the Law, and pardon some Offenders, since the end of Government, being the preservation of all as much as may be, even the guilty are to be spared where it can prove no prejudice to the innocent.",
      "translation_ja": "第159節　制限君主政とよく整えられた政府ではすべてそうであるように、立法権と執行権が別の手にあるところでは、社会の利益のため、幾つかの事柄を執行権を持つ者の裁量に任せる必要がある。立法者は、共同体の役に立ちうるすべてのことを予測し、法律で備えることができない。そこで、法を執行する力を持つ者には、国内法が指図していない多くの事柄で、それについて備えるため立法機関を無理なく招集できるまで、自然の共通の法により、その力を社会の利益のために使う権利がある。それどころか、法ではどうしても備えられないことも多く、それは必ず、執行権を掌握する者の裁量に委ね、公の利益と便宜が求めるとおり、処置してもらわなければならない。そればかりか、場合によっては、法それ自体が執行権に、いやむしろ自然と政府のこの根本法に譲るのがふさわしい。すなわち、できるかぎり社会の成員を一人残らず保全するという法である。法を厳格に、融通なく守ることで害が出る事態は数多く起こりうる。たとえば隣家が燃えている際、類焼を止めるためであっても、落ち度のない人の家を取り壊してはならないとすればそうである。また、褒美と赦しに値する行いによって、人を区別しない法に触れてしまうこともある。だから統治者は、多くの場合に法の厳しさを和らげ、一部の違反者に恩赦を与える力を持つのがふさわしい。政府の目的はできるだけ全員を保全することなのだから、罪のある者も、罪のない者の不利益にならないなら、罰を免れさせるべきである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s160",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:197",
          "printed_page": "383",
          "printed_page_end": "384",
          "source_sequence": 195
        }
      ],
      "source_text": "160. This Power to act according to discretion for the publick good, without the prescription of the Law, and sometimes even against it, is that which is called Prerogative; for since in fome Governments the Law-making Power is not always in being, and is usually too numerous, and so too slow for the dispatch requisite to Execution; and because also it is impossible to foresee, and so by Laws to provide for all accidents and necessities that may concern the publick, or make such Laws as will do no harm, if they are Executed with an inflexible rigour on all occasions, and upon all Persons that may come in their way, therefore there is a latitude left to the Executive Power, to do many things of choice which the Laws do not prescribe.",
      "translation_ja": "第160節　法律の定めがなくても、ときには法律に反してでも、公共の利益のために裁量で行動するこの力が、大権と呼ばれるものである。というのも、立法機関が常に存在するわけではない政府があり、また立法機関はふつう人数が多すぎ、それゆえ執行に必要な迅速さに欠ける。加えて公に関わるあらゆる出来事や必要を予見し、法律でこれに備えることはできない。法に触れるすべての場合とすべての人に、容赦なく厳格に適用しても、何の害もなさない法を作ることもできない。したがって執行権には、法律が指図しない多くのことを、自ら選んで行う余地が残されている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s161",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:198",
          "printed_page": "384",
          "source_sequence": 196
        }
      ],
      "source_text": "161. This Power whilst imployed for the benefit of the Community, and suitably to the trust and ends of the Government, is undoubted Prerogative, and never is questioned. For the People are very seldom, or never scrupulous or nice in the point, or questioning of Prerogative, whilst it is in any tolerable degree imploy'd for the use it was meant, that is, the good of the People, and not manifestly against it. But if there comes to be a question between the Executive Power and the People, about a thing claimed as a Prerogative; the tendency of the exercise of such Prerogative, to the good or hurt of the People, will easily decide that question.",
      "translation_ja": "第161節　この力が共同体の利益のため、政府に託された信任と目的にふさわしく用いられるあいだは、疑いなく大権であり、異議が唱えられることもない。本来使われるべき目的、すなわち人民のために、ある程度満足のいくかたちで用いられ、明らかに目的に反していないなら、人民がこの点で細かくこだわったり、大権に疑問を呈したりすることは、ほとんど、あるいはまったくないからだ。だが、大権だと主張された事柄について、執行権と人民との間で争いが起これば、その大権の行使が人民のためになるか害になるかによって、容易に決着がつくだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s162",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:198",
          "printed_page": "384",
          "printed_page_end": "385",
          "source_sequence": 197
        }
      ],
      "source_text": "162. It is easy to conceive, that in the Infancy of Governments, when Commonwealths differed little from Families in number of People, they differ'd from them too, but little in number of Laws: and the Governours being as the Fathers of them, watching over them for their good, the Government was almost all Prerogative. A few establish'd Laws served the turn, and the discretion and care of the Ruler supply'd the rest. But when mistake or flattery prevailed with weak Princes, to make use of this Power for private ends of their own, and not for the publick good, the people were fain by express Laws, to get Prerogative determin'd in those points wherein they found disadvantage from it: And declared limitations of Prerogative in those Cases which they and their Ancestors had left in the utmost latitude, to the Wisdom of those Princes who made no other but a right use of it, that is, for the good of their People.",
      "translation_ja": "第162節　政府がまだ幼く、国家は人数で一家とあまり変わらなかったころ、法の数でもたいした違いがなかったことは容易に想像できる。統治者は父親のように人々のために見守っていたので、政府の働きのほとんどが大権だった。確立された法はいくつかあれば足り、残りは統治者の分別と気遣いで補った。ところが、意志の弱い君主が、思い違いやおべっかに動かされ、この力を公の利益のためではなく、自分の私的な目的に使うようになると、人民はその大権で不利益を被った点について、明示の法で範囲をはっきり定めざるをえなかった。彼らも祖先も、力を正しく、つまり人民の利益のためにしか使わない君主の知恵に、どこまでも広く委ねていた場合について、大権の限界を公に定めたのである。",
      "translation_status": "reviewed"
    },

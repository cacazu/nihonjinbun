          "source_sequence": 101
        }
      ],
      "source_text": "84. The Society betwixt Parents and Children, and the distinct Rights and Powers, belonging respectively to them, I have treated of so largely, in the foregoing Chapter, that I shall not here need to say any thing of it. And I think it is plain, that it is far different from a politick Society.",
      "translation_ja": "第84節　親と子の社会、およびそれぞれに属する別々の権利と権力については、前章ですでに十分詳しく述べたから、ここで改めて何か言う必要はない。それが政治社会と大きく違うことは、明らかだと思う。",

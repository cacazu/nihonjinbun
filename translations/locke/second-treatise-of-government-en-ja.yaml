        }
      ],
      "source_text": "163. And therefore they have a very wrong notion of Government, who say, that the People have incroach'd upon the Prerogative when they have got any part of it to be defined by positive Laws. For in so doing they have not pulled from the Prince any thing that of right belong'd to him, but only declared, that that Power which they indefinitely left in him, or his Ancestors hands, to be exercised for their good, was not a thing they intended him, when he used it otherwise. For the End of Government being the good of the Community, whatsoever alterations are made in it, tending to that end, cannot be an incroachment upon any body; since no body, in Government, can have a right tending to any other end. And those only are incroachments which prejudice or hinder the publick good. Those who say otherwise, speak as if the Prince had a distinct and separate Interest from the good of the Community, and was not made for it. The Root and Source from which spring almost all those Evils and Disorders, which happen in Kingly Governments. And indeed, if that be so, the People, under his Government, are not a Society of Rational Creatures, entered into a Community, for their mutual good, such as have set Rulers over themselves, to guard and promote that good; but are to be looked on as an Herd of inferiour Creatures, under the Dominion of a Master, who keeps them, and works them, for his own Pleasure or Profit. If Men were so void of Reason, and brutish, as to enter into Society upon such Terms, Prerogative might indeed be, what some Men would have it, an Arbitrary Power to do things hurtful to the People.",
      "translation_ja": "第163節　だから、その一部を実定法で定義させたというだけで、人民が大権を侵したと言う者は、政府というものをたいへん誤って捉えている。人民は、権利として君主に属していたものを取り上げたのではない。自分たちのために行使してもらうべく、その君主や先祖の手に範囲を定めず残していた力は、君主が別の使い方をするなら、与えるつもりだったものではないと明言しただけである。政府の目的は共同体の利益なのだから、この目的に向けて政府をどれほど改めても、誰の権利も侵したことにはならない。政府にあって、他の目的を求める権利を誰も持ちえないからだ。公共の利益を害し、妨げるものだけが侵害である。そうではないと言う者は、君主に共同体の利益とは別の、切り離された利益があり、共同体のために立てられたのではないとでもいうように語る。君主政に起きる災いと混乱のほとんどは、この見方に根を持つ。実際そうであれば、君主の下の人民は、互いの利益のため共同体に入り、その利益を守り増すため、自分たちを治める者を立てた理性的な生き物の社会ではなくなる。ある主人が自らの楽しみや利益のために養い、働かせ、その支配に服させる下等な生き物の群れと見なすべきだろう。人がそれほど理性を欠き、獣同然で、そんな条件で社会に入るなら、大権は確かに、ある人たちが望むように、人民に害を及ぼすことをする恣意的な力となりうるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s164",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:199",
          "printed_page": "387",
          "source_sequence": 199
        }
      ],
      "source_text": "164. But since a Rational Creature cannot be supposed, when free, to put himself into Subjection to another, for his own harm: (though where he finds a good and a wise Ruler, he may not, perhaps, think it either necessary or useful to set precise Bounds to his Power in all things) Prerogative can be nothing but the Peoples permitting their Rulers to do several things of their own free choice, where the Law was silent, and sometimes too against the direct Letter of the Law, for the publick good, and their acquiescing in it when so done. For as a good Prince, who is mindful of the trust put into his hands, and careful of the good of his People, cannot have too much Prerogative, that is, Power to do good: So a weak and ill Prince, who would claim that Power his Predecessors exercised, without the direction of the Law, as a Prerogative belonging to him by Right of his Office, which he may exercise at his pleasure, to make or promote an Interest distinct from that of the publick, gives the People an occasion to claim their Right, and limit that Power, which, whilst it was exercised for their good, they were content should be tacitly allowed.",
      "translation_ja": "第164節　しかし、理性ある生き物が、自由でいながら、自分に害が及ぶよう、他人に従う身になるとは考えられない。もっとも、善良で賢い統治者が見つかれば、何事についても権力の限界を厳密に決めておくのを、必要とも役に立つとも思わないかもしれない。だから大権とは、法が何も述べていないところで、ときには法の文字どおりの意味に直接反してでも、公共の利益のため、統治者が自分の判断でいくつかのことをしてよいと人民が許し、そうして行ったことを受け入れることにほかならない。託された信任を忘れず、人民のためを思う良い君主には、大権、すなわち良いことをする力がありすぎることはない。それと同じく、弱く悪い君主が、先代が法の指図なしに行使した力を、職位の権利として自分に属し、公共とは別の利益を作り、または進めるため、好きなように使える大権だと主張するなら、それは、人民が自らの権利を主張し、自分たちのために使われているあいだは暗黙に許してもよいとしていた力に、限界を課すきっかけとなる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s165",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:199",
          "printed_page": "387",
          "printed_page_end": "388",
          "source_sequence": 200
        }
      ],
      "source_text": "165. And therefore he that will look into the History of England will find that Prerogative was always largest in the hands of our wisest and best Princes: Because the People observing the whole tendency of their Actions to be the publick good, or if any humane frailty or mistake (for Princes are but Men, made as others) appear'd in some small declinations from that end; yet 'twas visible, the main of their Conduct tended to nothing but the care of the publick. The People therefore finding reason to be satisfied with these Princes, whenever they acted without, or contrary to the Letter of the Law, acquiesced in what they did, and without the least complaint, let them inlarge their Prerogative as they pleased, judging rightly that they did nothing herein to the prejudice of their Laws, since they acted conformable to the Foundation and End of all Laws, the publick good.",
      "translation_ja": "第165節　だから、イングランドの歴史を調べれば、私たちの最も賢明で良い君主が握ったとき、大権はいつも最も大きかったと分かる。人民は、彼らの行いの全体が公の利益に向かっていると見ていたからである。もし人間の弱さや過ちが、目的から少し外れるところに現れても（君主もまた他の者と同じく、人にすぎない）、行いの肝心なところは公の利益への気遣いだけに向かっていると、はっきり分かった。そこで人民はこの君主たちで満足する理由を見いだし、彼らが法の文字に従わず、また文字に反して行動しても、行ったことを受け入れ、少しも不平を言わず、大権を思うように広げるに任せた。人民は、彼らがあらゆる法の土台であり目的である公共の利益と一致して行動しているのだから、この点で法に不利益となることは何もしていないと、正しく判断したのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s166",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:200",
          "printed_page": "388",
          "printed_page_end": "389",
          "source_sequence": 201
        }
      ],
      "source_text": "166. Such God-like Princes indeed had some Title to Arbitrary Power, by that Argument that would prove Absolute Monarchy the best Government, as that which God himself governs the Universe by, because such Kings partake of his Wisdom and Goodness. Upon this is founded that saying, That the Reigns of good Princes have been always most dangerous to the Liberties of their People. For when their Successors, managing the Government with different Thoughts, would draw the Actions of those good Rulers into Precedent, and make them the Standard of their Prerogative; as if what had been done only for the good of the People, was a right in them to do for the harm of the People, if they so pleased: It has often occasioned Contest, and sometimes publick Disorders, before the People could recover their original Right, and get that to be declared not to be Prerogative which truly was never so: since it is impossible any body, in the Society, should ever have a right to do the People harm, though it be very possible and reasonable that the People should not go about to set any Bounds to the Prerogative of those Kings or Rulers, who themselves transgressed not the Bounds of the publick good. For Prerogative is nothing but the Power of doing publick good, without a Rule.",
      "translation_ja": "第166節　こうした神のような君主には、確かに恣意的な力を求める多少の権原があった。神自身が宇宙を治めるのも絶対君主政であり、このような王は神の知恵と善良さを分かち持つのだから、それが最良の政府だと証明しようとする、あの議論に従えばの話である。良い君主の治世は、いつも人民の自由にとって最も危険であった、という言葉があるのも、このためである。その後継者たちは、別の考えで政府を動かしながら、良い統治者たちの行いを先例として引き、自分たちの大権の規準にしようとした。まるで人民のためだけに行われたことが、自分たちの気が向けば、人民を害するために行う権利であるかのように。だから人民がもとの権利を取り戻し、実は一度も大権でなかったものを大権ではないと公にさせるまでに、しばしば争いが起き、ときには公の混乱に至った。社会の中で、人民を害する権利を誰かが持つなどありえない。もっとも、公の利益の限度を踏み越えない王なり統治者なりの大権に、人民が別に限界を設けようとしないことは、十分ありえ、道理にもかなっている。大権とは、決められた規則なしに公共の利益を図る力にほかならないからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s167",
      "section_id": "ch-14",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:127",
          "printed_page": "242",
          "source_sequence": 34
        }
      ],
      "source_text": "23. This Freedom from Absolute, Arbitrary Power, is so necessary to, and closely joyned with a Man's Preservation, that he cannot part with it, but by what forfeits his Preservation and Life together. For a Man, not having the Power of his own Life, cannot, by Compact, or his own Consent, enslave himself to any one, nor put himself under the Absolute, Arbitrary Power of another, to take away his Life, when he pleases. No body can give more Power than he has himself; and he that cannot take away his own Life, cannot give another Power over it. Indeed having, by his fault, forfeited his own Life, by some Act that deserves Death; he, to whom he has forfeited it, may (when he has him in his Power) delay to take it, and make use of him to his own service; and he does him no injury by it. For, when-ever he finds the hardship of his Slavery out-weigh the value of his Life, 'tis in his Power, by resisting the Will of his Master, to draw on himself the Death he desires.",
      "translation_ja": "第23節　絶対的で恣意的な権力に服さない自由は、人の身の保全に欠かせず、これに深く結びついている。だから、身の保全も命も一緒に失うのでなければ、その自由を手放すことはできない。人は自らの命を処分する権限を持たないため、取り決めや自らの同意によって誰かの奴隷になることも、また他人が気の向くままに自分の命を奪えるような絶対的で恣意的な権力に服することもできない。誰も自分の持つ以上の権力を与えることはできず、自分の命を奪う権能を持たない者は、その権能を他人に与えられない。もっとも、死に値する行為を犯したために、自らの過ちで命を取られるいわれがある場合、その命を取る権利を持つ者は、相手を手中に収めていながら、命を取ることを延ばし、代わりに自分に仕えさせても、その相手に不当な害を加えたことにはならない。というのも、奴隷の境遇の苦しさが自分の命の値打ちを上回ると思えば、主人の意志に抵抗して、望む死を自分に招くことができるからだ。",
      "translation_status": "reviewed"
    },

          "printed_page": "453",
          "printed_page_end": "455",
          "source_sequence": 276
        }
      ],
      "source_text": "232. Whosoever uses force without Right, as every one does in Society, who does it without Law; puts himself into a state of War with those, against whom he so uses it, and in that state all former Ties are cancelled, all other Rights cease, and every one has a Right to defend himself, and to resist the Aggressour. This is so evident, that Barclay himself, that great Assertor of the Powe[?] and Sacredness of Kings, is forced to confess, That it is lawful for the People, in some Cases, to resist their King; and that too in a Chapter, wherein he pretends to shew that the Divine Law shuts up the People from all manner of Rebellion. Whereby it is evident, even by his own Doctrine, that, since they may, in some Cases, resist, all resisting of Princes is not Rebellion. His Words are these. Quod siquis dicat, Ergone populus tyrannicae crudelitati & furori jugulum semper praebebit? Ergone multitudo civitates suas fame, ferro, & flammâ vastari, seque, conjuges, & liberos fortunae ludibrio & tyranni libidini exponi, inque omnia vitae pericula omnesque miserias & molestias à Rege deduci patientur? Num illis quod omni animantium generi est à naturâ tributum, denegari debet, ut s[?]. vim vi repellant, seseque ab injuriâ tueantur? Huic breviter responsum sit, Populo universo negari defensionem, quae juris naturalis est, neque ultionem quae praeter naturam est adversus Regem concedi debere. Quapropter si Rex non in singulares tantum personas aliquot privatum odium exerceat, sed corpus etiam Reipublicae, cujus ipse caput est, i.e. totum populum, vel insignem aliquam ejus partem immani & intolerandâ saevitiâ seu tyrannide divexet; populo, quidem hoc casu resistendi ac tuendi se ab injuriâ potestas competit, sed tuendi se tantum, non enim in principem invadendi: & restituendae injuriae illatae, non recedendi à debitâ reverentiâ propter acceptam injuriam. Praesentem denique impetum propulsandi non vim praeteritam ulciscendi jus habet. Horum enim alterum à naturâ est, ut vitam scilicet corpusque tueamur. Alterum vero contra naturam, ut inserior de superiori supplicium sumat. Quod itaque populus malum, antequam factum sit, impedire potest, ne fiat, id postquam factum est, in Regem authorem sceleris vindicare non potest: populus igitur hoc ampliùs quam privatus quispiam habet: Quod huic, vel ipsis adversariis judicibus, excepto Buchanano, nullum nisi in patientia remedium superest. Cùm ille si intolerabilis tyrannis est (modicum enim ferre omnino debet) resistere cum reverentiâ possit, Barclay contra Monarchom. l. 3. c. 8. In English thus:",
      "translation_ja": "第232節　権利なく力を用いる者は誰でも、その力を用いた相手との戦争状態に入る。社会の内で、法によらず力を用いる者は皆そうである。この状態では以前の絆はすべて解かれ、ほかの権利はすべて消え、誰もが自らを守り、攻撃者に抵抗する権利を持つ。これはあまりに明らかなので、王の権力と不可侵性を大いに擁護するバークリーさえ、場合によっては人民が王に抵抗することも正当である、と認めざるをえなかった。それも、神の法が人民にあらゆる種類の反乱を禁じていることを示すという章の中で、そう認めたのである。したがって、その説をそのまま受け入れても、ある場合に抵抗できるのなら、君主に対する抵抗のすべてが反乱ではないことは明らかだ。彼は次のように述べる。「だが、ある人がこう言うとしよう。では人民は、暴君の残虐さや狂乱に、いつも喉を差し出すのか。群衆は、都市が飢えと剣と炎で荒らされ、自分たちも妻子も運命のもてあそびと暴君の欲にさらされ、王にあらゆる生命の危険、あらゆる惨めさや苦しみへ引きずり込まれるのに、耐えるのか。自然があらゆる動物に授けたもの、つまり力を力で退け、害から身を守ることを、彼らに拒むべきなのか。これには短くこう答えよう。自然の権利である防御を人民全体に拒むべきではなく、また自然に反する王への報復を認めるべきでもない。だから王が、少数の個人にだけ私的な憎しみを向けるのではなく、自らがその長である国家の本体、つまり人民の全体か、その相当な部分を、恐ろしく耐えがたい苛酷さや圧政で苦しめる場合、人民には抵抗し、害から身を守る力が認められる。ただ身を守るだけであって、君主を攻撃するためではない。加えられた害を元に戻すためであって、害を受けたからと、当然払うべき敬意から離れるためではない。つまり、いま加えられる攻撃を防ぐ権利はあっても、過去の暴力に報復する権利はない。命と身体を守る前者は自然であるが、下位の者が上位の者を罰する後者は自然に反する。だから人民は、害が起こる前にそれを妨げ、起こさせないことはできても、害が起きた後に、その罪を犯した王に報復することはできない。ただし人民は、個人よりここで多くを持っている。私たちに反対する人々でさえ、ブキャナンを除けば、一個人には耐えるほか救いがないと判断する。それに対し人民なら、耐えがたい圧政においては（穏やかなものであれば必ず耐えるべきだ）、敬意をもって抗うことができる。」バークリー『君主政の擁護』第三巻第八章。英語にすると次のようになる。",

      "source_text": "233. But if any one should ask, Must the People then always lay themselves open to the Cruelty and Rage of Tyranny? Must they see their Cities pillaged, and laid in ashes, their Wives and Children exposed to the Tyrant's Lust, and Fury, and themselves and Families reduced, by their King, to Ruine, and all the Miseries of Want and Oppression, and yet sit still? Must Men alone be debarred the common Priviledge of opposing force with force, which Nature allows so freely to all other Creatures, for their preservation from Injury? I answer: Self-defence is a part of the Law of Nature; nor can it be denied the Community, even against the King himself: but to revenge themselves upon him, must by no means, be allowed them; it being not agreeable to that Law. Wherefore if the King shall shew an hatred, not only to some particular Persons, but sets himself against the Body of the Commonwealth, whereof he is the Head, and shall, with intolerable ill usage, cruelly tyrannize over the whole, or a considerable part of the People; in this case, the People have a right to resist and defend themselves from Injury: but it must be with this Caution, that they only defend themselves, but do not attack their Prince: They may repair the Damages received, but must not, for any provocation, exceed the bounds of due Reverence and Respect. They may repulse the present attempt, but must not revenge past violences. For it is natural for us to defend Life and Limb, but that an Inferiour should punish a Superiour is against Nature. The mischief which is designed them, the People may prevent before it be done, but when it is done, they must not revenge it on the King, though Author of the Villany. This therefore is the Priviledge of the People in general, above what any private Person hath; That particular Men are allowed, by our Adversaries themselves, (Buchanan only excepted) to have no other Remedy but Patience; but the Body of the People may, with Respect, resist intolerable Tyranny; for when it is but moderate, they ought to endure it.",
      "translation_ja": "第233節　「だが誰かが、人民はいつも圧政の苛酷さと猛威に身をさらさなければならないのか、と問うとしよう。都市が略奪され、灰にされ、妻子が暴君の欲望と狂気にさらされ、自分と家族が王のせいで破滅し、欠乏と圧迫のあらゆる悲惨にあえぐのを黙って見ていなければならないのか。害から身を守るために力には力で抗することは、自然がほかのあらゆる生き物に惜しみなく認める共通の特権なのに、人間だけがそこから締め出されねばならないのか。私はこう答える。自己防衛は自然法の一部であり、たとえ王自身に対してでも、共同体がこの権利を拒まれることはない。しかし王に報復することは、決して許せない。それはこの法にかなわないからである。それゆえ王が特定の少数者に憎しみを示すだけでなく、自分がその長である国家そのものを敵とし、人民全体か相当な部分を、耐えがたい仕打ちで残忍に圧迫するなら、そのとき人民には抵抗して害から身を守る権利がある。ただし、ひたすら身を守るだけで、君主を攻めないよう注意しなければならない。被った損害は回復してよいが、どんな挑発を受けても、払うべき敬意と尊重の限界を越えてはならない。いま迫る攻撃は退けてよいが、過去の暴力に報復してはならない。命と身体を守るのは自然だが、下位の者が上位の者を罰することは自然に反するからだ。人民を害する企ては、実行前であれば人民が防いでよいが、実行された後は、王がその悪事を起こした者でも、報復してはならない。だから、一私人にまさる人民全体の特権は、次のとおりである。私たちに反対する人々でさえ、ブキャナンを唯一の例外として、一人ひとりの私人には、耐えるほか救いはないと認める。ところが人民全体は、耐えがたい圧政に対して、敬意を保ちながら抵抗することができる。穏やかな圧政にとどまるなら、耐えなければならない。」",
      "translation_status": "reviewed"
    },

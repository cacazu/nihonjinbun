      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:143",
          "printed_page": "274",
          "printed_page_end": "276",
          "source_sequence": 72
        }
      ],
      "source_text": "57. The Law that was to govern Adam, was the same that was to govern all his Posterity, the Law of Reason. But his Off-spring having another way of entrance into the World, different from him, by a natural Birth, that produced them ignorant, and without the Use of Reason, they were not presently under that Law: For no Body can be under a Law that is not promulgated to him; and this Law being promulgated or made known by Reason only, he that is not come to the Use of his Reason, cannot be said to be under this Law: and Adam's Children being not presently as soon as born, under this Law of Reason, were not presently free. For Law, in its true Notion, is not so much the Limitation as the direction of a free and intelligent Agent to his proper Interest, and prescribes no farther, than is for the general Good of those under that Law. Could they be happier without it, the Law, as an useless thing, would of it self vanish; and that ill deserves the Name of Confinement, which hedges us in only from Bogs and Precipices. So that however it may be mistaken, the end of Law, is not to abolish or restrain, but to preserve and enlarge Freedom. For in all the states of created Beings, capable of Laws, where there is no Law there is no Freedom. For, Liberty is, to be free from Restraint and Violence from others, which cannot be where there is no Law, and is not, as we are told, A Liberty for every Man to do what he lists: For who could be free, when every other Man's Humour might domineer over him? But a Liberty to dispose and order freely as he lists his Person, Actions, Possessions, and his whole Property within the Allowance of those Laws, under which he is, and therein not to be subject to the the arbitrary Will of another; but freely follow his own.",
      "translation_ja": "第57節　アダムを律する法は、子孫のすべてを律する法と同じ、理性の法だった。ただ、子孫はアダムと違い、自然な出産によって世に出て、何も知らず、理性を使えない状態で生まれたため、すぐにはその法の下に置かれなかった。誰も、告げ知らされていない法に服することはできない。しかもこの法は理性だけによって告げられ、知られる。理性が使える段階に達していない者は、この法の下にあるとは言えない。だから、アダムの子らは生まれてすぐには理性の法の下になく、したがって、すぐに自由だったのでもない。法とは本来、自由で分別のある行為者に制限を加えるというより、その人にとって真に利益となることへ導くものであり、法に服する人々全体の利益を図るところまでしか、何かを命じない。もし法なしに人々がより幸福になれるなら、法は無用のものとして、おのずと消えていくだろう。沼や崖から遠ざけるためだけに囲いを設けるのなら、それを束縛と呼ぶのは当たらない。だから、どんな誤解があろうと、法の目的は自由を廃止したり狭めたりすることではなく、自由を守り、広げることにある。法を受け入れることのできる被造物がどのような状態にあろうと、法のないところに自由はない。自由とは、他人の拘束や暴力から解かれていることであり、法なしにはありえない。それは、ある人の言うように、誰でも好き勝手なことをしてよいという自由ではない。他人の気まぐれが自分を支配できるのなら、誰に自由があるだろう。自由とは、自分が服する法の許す範囲で、自分自身、自分の行為、持ち物、そして財産全般を、思うとおりに取り扱い、律することができ、その際に他人の恣意的な意志に服さず、自らの意志に自由に従えることである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s058",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

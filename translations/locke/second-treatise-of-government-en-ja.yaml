      ]
    },
    {
      "id": "locke-s185",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:211",
          "printed_page": "410",
          "source_sequence": 223
        }
      ],
      "source_text": "185. Over those then that joined with him in the War, and over those of the subdued Countrey that opposed him not, and the Posterity even of those that did, the Conquerour, even in a just War, hath, by his Conquest, no right of Dominion. They are free from any subjection to him, and if their former Government be dissolved, they are at liberty to begin and erect another to themselves.",
      "translation_ja": "第185節　したがって、戦争で自分に加勢した者、屈服させた国のうち自分に抵抗しなかった者、抵抗した者でさえその子孫に対しては、征服者は、正しい戦争で勝ったとしても、征服によって何らの支配権も持たない。彼らは征服者に服従する義務から自由であり、以前の政府が解体したなら、自らのために新たな政府を自由に始め、打ち立てられる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s186",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:211",
          "printed_page": "410",
          "printed_page_end": "411",
          "source_sequence": 224
        }
      ],
      "source_text": "186. The Conquerour, 'tis true, usually, by the Force he has over them, compels them, with a Sword at their Breasts, to stoop to his Conditions, and submit to such a Government as he pleases to afford them; but the enquiry is, What right he has to do so? If it be said, they submit by their own consent; then this allows their own consent to be necessary to give the Conquerour a Title to rule over them. It remains only to be considered, whether Promises, extorted by Force, without Right, can be thought Consent, and how far they bind. To which I shall say, they bind not at all, because whatsoever another gets from me by force, I still retain the Right of, and he is obliged presently to restore. He that forces my Horse from me, ought presently to restore him, and I have still a right to retake him. By the same reason, he that forced a Promise from me ought presently to restore it, i. e. quit me, of the Obligation of it; or I may resume it my self, i. e. chuse whether I will perform it. For the Law of Nature laying an obligation on me, only by the Rules she prescribes, cannot oblige me by the violation of her Rules: such is the extorting any thing from me by force. Nor does it at all alter the case, to say I gave my Promise, no more than it excuses the force, and passes the right, when I put my hand in my Pocket, and deliver my Purse my self to a Thief, who demands it with a Pistol at my Breast.",
      "translation_ja": "第186節　確かに征服者は、その人々に対する力を持つので、普通は剣を胸に突きつけて、自分の条件に屈するよう強い、気ままに与える政府に服させる。しかし問われているのは、そうするどんな権利があるか、ということだ。人々は自分の同意により服するのだと言うのなら、征服者が彼らを支配する権原を得るには、彼ら自身の同意が必要だと認めたことになる。残るのは、権利もなく力で取りつけた約束を、同意と見なせるか、また、どこまで拘束するかである。このような約束はまったく人を拘束しない、と私は言う。他人が力で私から得たものについては、私はなおその権利を保ち、相手はすぐに返す義務を負うからだ。馬を私から力ずくで奪った人は、すぐに返さなければならず、私にはなおそれを取り返す権利がある。同じ理由から、私から約束を強いて取りつけた者は、すぐにそれを返す、つまり、その義務から私を解くべきであり、そうでなければ私は、自分でその約束を取り返し、すなわち果たすかどうかを選べる。自然法は、それが定める規則によってのみ私に義務を課すので、その規則に背くことによって私を拘束できない。私から力で何かを取りつけることが、その違反である。私自身が約束したと言っても、少しも事情は変わらない。胸に拳銃を突きつけて財布をよこせと要求する盗人に、私が自分でポケットに手を入れて財布を渡しても、私の行為がその暴力を免責し、盗人に権利を移すことはないのと同じである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s187",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:211",
          "printed_page": "411",
          "source_sequence": 225
        }
      ],
      "source_text": "187. From all which it follows, that the Government of a Conquerour, impoposed, by force, on the subdued, against whom he had no right of War, or who joined not in the War against him, where he had right, has no obligation upon them.",
      "translation_ja": "第187節　以上すべてから、征服者が屈服した者に力で押しつけた政府に、彼らを拘束する力はない。もともとその人々に戦いを仕掛ける権利がなかった場合も、戦う権利はあったが、その人々が征服者に対する戦いに加わらなかった場合も、同じである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s188",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:211",
          "printed_page": "411",
          "source_sequence": 226
        }
      ],
      "source_text": "188. But let us suppose that all the Men of that Community being all Members of the same Body Politick, may be taken to have join'd in that unjust War, wherein they are subdued, and so their Lives are at the Mercy of the Conquerour.",
      "translation_ja": "第188節　だが、その共同体の人々がみな同じ政治体の成員であり、敗れた不正な戦争に全員が加わったと見なせるとしよう。この場合、その命は征服者の情けに委ねられていることになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s189",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:212",
          "printed_page": "412",
          "source_sequence": 227
        }
      ],
      "source_text": "189. I say, this concerns not their Children, who are in their Minority. For since a Father hath not, in himself, a Power over the Life or Liberty of his Child; no act of his can possibly forfeit it: so that the Children, whatever may have happened to the Fathers, are Free men, and the Absolute Power of the Conquerour reaches no farther than the Persons of the Men, that were subdued by him, and dies with them; and should he govern them as Slaves, subjected to his Absolute, Arbitrary Power, he has no such Right of Dominion over their Children. He can have no Power over them, but by their own consent, whatever he may drive them to say or do; and he has no lawful Authority, whilst Force, and not Choice, compels them to submission.",
      "translation_ja": "第189節　しかしこれは、彼らの未成年の子どもには関わらない。父自身が子の生命や自由を左右する力を持たないのだから、父が何をしても、子にそれを失わせることはできない。したがって父たちに何が起きようとも、子らは自由人である。征服者の絶対権力は、征服者が屈服させた人々自身より先へは及ばず、彼らとともに消える。たとえ征服者が、その人々を自分の絶対的で恣意的な力の下に置かれた奴隷として治めても、その子らについて同じ支配権を持たない。何を言わせようと何をさせようと、子ら自身の同意なしに、彼らに対する権力を持てない。自ら選んだのではなく、ただ力のために従っているあいだは、正当な権威を少しも持たないのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s190",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:212",
          "printed_page": "412",
          "source_sequence": 228
        }
      ],
      "source_text": "190. Every Man is born with a double Right, First, A Right of Freedom to his Person, which no other Man has a Power over, but the free Disposal of it lies in himself. Secondly, A Right, before any other Man, to inherit, with his Brethren, his Father's Goods.",
      "translation_ja": "第190節　人はみな、二つの権利を持って生まれる。第一に、自分の身の自由への権利である。ほかの誰にもその人を支配する権力はなく、自分の身を自由に処する権利は本人にある。第二に、ほかの誰より先に、きょうだいとともに父の財物を受け継ぐ権利である。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s191",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:212",
          "printed_page": "412",
          "printed_page_end": "413",
          "source_sequence": 229
        }
      ],
      "source_text": "191. By the first of these, a Man is naturally free from subjection to any Government, though he be born in a place under its Jurisdiction. But if he disclaim the lawful Government of the Countrey he was born in, he must also quit the Right, that belong'd to him, by the Laws of it, and the Possessions there descending to him, from his Ancestors, if it were a Government made by their consent.",
      "translation_ja": "第191節　第一の権利によって、人は、ある政府の管轄にある土地に生まれても、自然にはどの政府にも従わない。ただし、生まれた国の正当な政府が先祖の同意によって作られたもので、それを認めないというなら、その政府の法が認めていた権利も、そこで先祖から伝わる財産も、手放さなければならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s192",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:212",
          "printed_page": "413",
          "printed_page_end": "414",
          "source_sequence": 230
        }
      ],
      "source_text": "192. By the second, the Inhabitants of any Countrey, who are descended, and derive a Title to their Estates from those who are subdued, and had a Government forced upon them, against their free consents, retain a Right to the Possession of their Ancestours, though they consent not freely to the Government, whose hard Conditions were, by force, imposed on the Possessors of that Countrey. For the first Conqueror never having had a Title to the Land of that Country, the People, who are the Descendants of, or claim under those, who were forced to submit to the Yoke of a Government by constraint, have always a Right to shake it off, and free themselves from the Usurpation, or Tyranny the Sword hath brought in upon them; till their Rulers put them under such a Frame of Government, as they willingly, and of choice consent to (which they can never be supposed to do, till either they are put in a full state of Liberty to chuse their Government and Governours, or at least till they have such standing Laws, to which they have, by themselves, or their Representatives, given their free consent, and also till they are allowed their due Property, which is so to be Proprietors of what they have, that no body can take away any part of it without their own consent, without which, Men under any Government are not in the state of Free-men, but are direct Slaves, under the force of War.) And who doubts but the Grecian Christians, Descendants of the antient Possessors of that Countrey, may justly cast off the Turkish Yoke they have so long groaned under, when-ever they have a Power to do it?",
      "translation_ja": "第192節　第二の権利によれば、ある国の住民が、自由な同意に反して政府を押しつけられた敗者の子孫であって、土地の権原をその先祖から受けている場合、その住民は、先祖が所有したものへの権利を保持する。かつてこの国を所有していた人々に厳しい条件を力で押しつけた政府に、自由に同意しなかったとしてもである。初めの征服者がその国の土地への権原を決して持たなかった以上、強制によって政府のくびきに服させられた人々の子孫や、その人々から権利を受け継ぐ者は、いつでもそのくびきを振り払い、武力が押しつけた簒奪や圧政から自由になる権利を持つ。統治者が、人民が進んで、自ら選んで同意するような政府の形を与えるまではそうである。その同意がありうるのは、自分たちの政府と統治者を選ぶ完全な自由が与えられるか、少なくとも自分たち自身か代表を通じて自由に同意した恒常的な法律があり、また正当に持つべき財産が認められるときである。つまり、持っているものを自ら所有し、本人の同意なしに一部でも奪われないということである。これがなければ、どの政府の下でも、人々は自由人ではなく、戦争の力の下にあるまったくの奴隷である。古くからその国を所有してきた人々の子孫であるギリシアのキリスト教徒が、果たす力を得たとき、長く苦しめられてきたトルコのくびきを振り払ってよいことを、誰が疑うだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s193",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:213",
          "printed_page": "414",
          "source_sequence": 231
        }
      ],
      "source_text": "193. But granting that the Conquerour, in a just War, has a Right to the Estates, as well as Power over the Persons of the Conquered; which, 'tis plain, he hath not: nothing of Absolute Power will follow from hence, in the continuance of the Government. Because the Descendants of these being all Free-men, if he grants them Estates, and Possessions to inhabit his Countrey, without which it would be worth nothing, whatsoever he grants them, they have so far as it is granted, Property in. The nature whereof is, that, without a Man's own consent, it cannot be taken from him.",
      "translation_ja": "第193節　しかし仮に、正しい戦争で勝った者が、征服された人々の身に対する力を持つだけでなく、その財産への権利も持つと認めよう。実際にはこれがないのは明らかだが、認めたところで、その政府が続くにあたって、絶対権力など少しも生じはしない。彼らの子孫はみな自由人であるから、征服者が、自分の国に住んでもらうために土地や持ち物を与えたなら（彼らに住んでもらわなければ、その国は何の値打ちもないのである）、与えたものは何であれ、与えられた限りで彼らの財産となる。財産というものの性質は、本人の同意なしには取り上げられないことにある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s194",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:213",
          "printed_page": "414",
          "printed_page_end": "416",
          "source_sequence": 232
        }
      ],
      "source_text": "194. Their Persons are free, by a native Right, and their Properties, be they more or less, are their own, and at their own dispose, and not at his; or else it is no Property. Supposing the Conquerour gives to one Man a Thousand Acres, to him and his Heirs for ever; to another he lets a Thousand Acres, for his Life, under the Rent of 50l. or 500l. per An. Has not the one of these a Right to his Thousand Acres for ever, and the other, during his Life, paying the said Rent? And hath not the Tenant, for Life, a Property in all that he gets over and above his Rent, by his Labour and Industry, during the said term, supposing it be double the Rent? Can any one say, the King, or Conquerour, after his Grant, may, by his Power of Conquerour, take away all, or part of the Land, from the Heirs of one, or from the other, during his Life, he paying the Rent? Or can he take away, from either, the Goods or Money they have got upon the said Land, at his pleasure? If he can, then all free and voluntary Contracts cease, and are void, in the World; there needs nothing but Power enough to dissolve them at any time. And all the Grants and Promises of Men, in Power, are but Mockery and Collusion. For can there be any thing more ridiculous than to say, I give you and yours this for ever, and that in the surest and most solemn way of conveyance can be devised: and yet it is to be understood, that I have Right, if I please, to take it away from you again to morrow?",
      "translation_ja": "第194節　敗者の子孫は、生まれながらの権利によってその身が自由であり、財産は多くても少なくても、彼ら自身のものである。自分たちで処分でき、征服者に処分されるものではない。さもなければ、財産ではない。征服者がある人に千エーカーを与え、本人と相続人が永遠に持つものとし、別の人には、年五十ポンドか五百ポンドの地代で、生涯にわたって千エーカーを貸したとしよう。一方は千エーカーを永久に持つ権利を、他方は地代を払うかぎり、生涯持つ権利を得たのではないか。また終身の借り手には、その期間、自分の労働と勤勉で地代以上に得たものすべてについて、仮にそれが地代の二倍でも、所有権があるのではないか。王か征服者が、授けたあとでなお、征服者の力によって、一方の相続人から土地の全部なり一部なりを取り上げられると、誰が言えるだろうか。他方も、本人が生きて地代を払っている間に、取り上げられると誰が言えるだろうか。あるいは、どちらからも、その土地で手に入れた財物や貨幣を、好きなときに取り上げてよいというのだろうか。それができるなら、世界の自由で自発的な契約はすべて成り立たず、効力を失う。いつでもそれを破るだけの力があればよいことになる。権力を持つ者の譲与や約束は、すべてお芝居とだまし合いにすぎなくなる。あなたとあなたの一族に、思いつくかぎり最も確実で厳粛な譲渡の方法で、これを永久に与えよう、ただし、私がその気になれば明日にもあなたからまた取り上げる権利がある、と言う以上に笑うべきことがあるだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s195",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:214",
          "printed_page": "416",
          "source_sequence": 233
        }
      ],
      "source_text": "195. I will not dispute now whether Princes are exempt from the Laws of their Countrey, but this I am sure, they owe subjection to the Laws of God, and Nature. No Body, no Power can exempt them from the Obligations of that Eternal Law. Those are so great, and so strong, in the case of Promises, that Omnipotency it self can be tyed by them. Grants, Promises, and Oaths are Bonds that hold the Almighty: what-ever some Flatterres say to Princes of the World, who, all together, with all their People joined to them, are, in comparison of the great God, but as a Drop of the Bucket, or a Dust on the Balance, inconsiderable, nothing!",
      "translation_ja": "第195節　君主が自国の法を免れるかは、いま論じない。ただし、神と自然の法に服する義務を負うのは、確かである。どんな人間も、どんな権力も、この永遠の法の義務から君主を免れさせられない。約束については、この義務はあまりに大きく強いので、全能の神さえこれによって拘束されうる。譲与と約束と誓いは、全能者をも縛る絆である。この世の君主に向かって、おべっかを使う者が何を言おうと変わらない。君主を全部集め、すべての民を加えても、偉大な神と比べれば、桶の中の一滴、天秤の上の塵ほどにもならず、取るに足らず、無に等しいのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s196",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:214",
          "printed_page": "416",
          "printed_page_end": "418",
          "source_sequence": 234
        }
      ],
      "source_text": "196. The short of the Case, in Conquest, is this, The Conquerour, if he have a just Cause, has a Despotical Right over the Persons of all that actually aided, and concurred in the War against him, and a Right to make up his Damage and Cost, out of their Labour and Estates, so he injure not the Right of any other. Over the rest of the People, if there were any that consented not to the War, and over the Children of the Captives themselves, or the Possessions of either he has no Power, and so can have, by Virtue of Conquest, no lawful Title himself to Dominion over them, or derive it to his Posterity; but is an Aggressour, and puts himself in a state of War against them, and has no better a Right of Principality, he, nor any of his Successours, than Hingar, or Hubba, the Danes, had here in England, or Spartacus, had he conquered Italy; which is to have their Yoke cast off, as soon as God shall give those, under their subjection, Courage, and Opportunity to do it. Thus, notwithstanding whatever Title the Kings of Assyria had over Iudah, by the Sword, God assisted Hezekiah to throw off the Dominion of that conquering Empire. And the Lord was with Hezekiah, and he prospered; wherefore he went forth, and he rebelled against the King of Assyria, and served him not, 2 Kings XVIII. vij. Whence it is plain, that shaking off a Power, which Force, and not Right, hath set over any one, though it hath the Name of Rebellion; yet is no Offence before God, but that which he allows and countenances, though even Promises and Covenants, when obtain'd by force, have intervened. For 'tis very probable, to any one that reads the Story of Ahaz and Hezekiah, attentively, that the Assyrians subdued Ahaz, and deposed him, and made Hezekiah King in his Father's life time; and that Hezekiah, by agreement, had done him Homage, and paid him Tribute till this time.",
      "translation_ja": "第196節　征服について要するにこう言える。正当な理由を持つ征服者には、自分に対する戦争に現に加勢し、参加した人すべての身に対する専制的な権利があり、その労働と財産から、自分の損害と費用をまかなう権利もある。ただし、ほかの人の権利を害さないことが条件である。残りの人民、戦争に同意しなかった人がいればその人々、捕虜自身の子ら、また、どちらの財産にも、征服者は何らの力を持たない。したがって征服ゆえに彼らを支配する正当な権原を、自ら持つことも、それを子孫に引き渡すこともできない。むしろ征服者が攻撃者であり、その人々と戦争状態に入る。征服者もその後継者も、イングランドに来たデーン人のインガルやフッバ、あるいは仮にイタリアを征服した場合のスパルタクスより、よい支配の権利は持たない。この権利というものは、服従する側に、神がその気力と機会を授けるやいなや、くびきを振り払われるような権利なのである。こうして、アッシリアの王たちが剣によってユダにどんな権原を持ったにせよ、神はヒゼキヤを助け、その征服帝国の支配を振り払わせた。「主はヒゼキヤと共にあり、彼は栄えた。そこで出て行き、アッシリア王に背き、これに仕えなかった」（『列王記下』18章7節）。ここから、権利でなく力によって人の上に置かれた権力を振り払うのは、反乱と呼ばれても、神の前で罪ではなく、神が許し、支持することだと分かる。間に約束や誓約があったとしても、力によって得たものなら変わりはない。アハズとヒゼキヤの話をよく読めば、アッシリア人がアハズを服従させて退位させ、その生前にヒゼキヤを王としたこと、またヒゼキヤが取り決めによってアッシリア王に臣従を誓い、この時まで貢ぎ物を納めていたことは、十分ありそうなことだからである。",
      "translation_status": "reviewed"
    },

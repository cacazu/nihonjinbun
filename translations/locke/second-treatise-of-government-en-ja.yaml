      "source_text": "224. But 'twill be said, this Hypothesis lays a ferment for frequent Rebellion. To which I Answer,",
      "translation_ja": "第224節　しかし、この仮説は、反乱をたびたび起こす種をまくのだと言われよう。これにはこう答える。",

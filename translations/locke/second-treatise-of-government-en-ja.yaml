          "printed_page": "433",
          "source_sequence": 253
        }
      ],
      "source_text": "212. Besides this over-turning, from without, Governments are dissolved from within,",
      "translation_ja": "第212節　外から覆されるほかに、政府が内から解体する場合もある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s212-p01",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:222",
          "printed_page": "433",
          "printed_page_end": "435",
          "source_sequence": 254
        }
      ],
      "source_text": "First, When the Legislative is altered, Civil Society being a state of Peace amongst those who are of it, from whom the state of War is excluded by the Umpirage, which they have provided in their Legislative, for the ending all differences, that may arise amongst any of them. 'Tis in their Legislative, that the Members of a Commonwealth are united and combined together into one coherent, living Body. This is the Soul that gives Form, Life, and Unity to the Commonwealth: from hence the several Members have their mutual Influence, Sympathy, and Connexion: and therefore, when the Legislative is broken, or dissolved, Dissolution and Death follows. For the Essence, and Union of the Society consisting in having one Will, the Legislative, when once established by the Majority, has the declaring, and, as it were, keeping of that Will. The Constitution of the Legislative is the first and fundamental Act of Society, whereby provision is made for the Continuation of their Union, under the Direction of Persons, and Bonds of Laws, made by Persons authorized thereunto, by the Consent and Appointment of the People, without which no one Man, or number of Men, amongst them, can have Authority of making Laws that shall be binding to the rest. When any one, or more, shall take upon them to make Laws, whom the People have not appointed so to do, they make Laws without Authority, which the People are not therefore bound to obey; by which means they come again to be out of subjection, and may constitute to themselves a new Legislative, as they think best, being in full liberty to resist the force of those, who, without Authority, would impose any thing upon them. Every one is at the disposure of his own Will, when those, who had, by the delegation of the Society, the declaring of the publick Will, are excluded from it, and others usurp the place, who have no such Authority or Delegation.",
      "translation_ja": "第一に、立法機関が変えられるときである。市民社会は、その成員のあいだの平和な状態であり、成員の間に生じうる争いをすべて決着させるため、立法機関に設けた裁定の仕組みによって、戦争状態は成員の間から除かれている。国家の成員が一つにつながり、一つの生きたまとまりになっているのは、この立法機関においてである。この機関は国家に形と生命と一体性を与える魂であり、そのおかげで成員同士が互いに作用し、感じ合い、つながる。したがって、立法機関が壊され、あるいは解体すれば、解体と死がそれに続く。社会の本質と一体性は、一つの意志を持つことにあるので、多数者によっていったん立法機関が設けられれば、それがその意志を表明し、いわば保管する。立法機関の構成は、社会の第一の根本的な行為である。これによって、人民の同意と指名によって権限を与えられた人々の指図と、その人々が定めた法の拘束のもとに、一体性が保たれるよう備えられる。これがなければ、社会の誰一人も、一部の者が集まっても、残りを拘束する法を定める権威は持てない。人民からその任を受けていない一人ないし何人かが、法を定める資格を勝手に引き受ければ、権威なしに法を定めたのであり、人民はそれに従う義務を負わない。そうなると、人民はふたたび従属を離れ、最善と思う形で新たに立法機関を作ることができる。何の権威もなく何かを押しつけようとする者たちの力に抗する、完全な自由があるからだ。社会から公の意志を表明する権限を委ねられた者が、その務めから排除され、権威も委任もない者が地位を奪うなら、誰もが自分の意志のままに行動できる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s213",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:223",
          "printed_page": "435",
          "source_sequence": 255
        }
      ],
      "source_text": "213. This being usually brought about by such, in the Commonwealth, who mis-use the Power they have: It is hard to consider it aright, and know at whose door to lay it, without knowing the Form of Government in which it happens. Let us suppose then the Legislative placed in the Concurrence of three distinct Persons. First, A single, hereditary Person having the constant, supream, executive Power, and, with it, the Power of convoking, and dissolving the other two, within certain Periods of Time. Secondly, An Assemby of hereditary Nobility. Thirdly, An Assembly of Representatives chosen, pro tempore, by the People: Such a Form of Government supposed, it is evident,",
      "translation_ja": "第213節　これは普通、国家で、自分の権力を濫用する者によってもたらされる。そのため、それがどんな政体で起こるのかを知らずに、正しく考え、誰に責任があるかを知ることは難しい。そこで、立法権が、別個の三者の合意に置かれているとしよう。第一に、常設の最高執行権と、定められた時期のうちに残る二者を招集し解散する力を持つ、世襲の一人。第二に、世襲の貴族たちの会議。第三に、その時々に人民が選ぶ代表者の会議。このような形の政府を考えれば、次のことが明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s214",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:223",
          "printed_page": "435",
          "printed_page_end": "436",
          "source_sequence": 256
        }
      ],
      "source_text": "214. First, That when such a single Person, or Prince sets up his own Arbitrary Will, in place of the Laws, which are the Will of the Society, declared by the Legislative, then the Legislative is changed. For that being, in effect, the Legislative whose Rules and Laws are put in execution, and required to be obeyed, when other Laws are set up, and other Rules pretended and inforced, than what the Legislative, constituted by the Society, have enacted, 'tis plain that the Legislative is changed. Who-ever introduces new Laws, not being thereunto authorized, by the fundamental Appointment of the Society, or subverts the old, disowns and overturns the Power, by which they were made, and so sets up a new Legislative.",
      "translation_ja": "第214節　第一に、この一人の人物、すなわち君主が、立法機関の表明した社会の意志である法律に代えて、自分の恣意的な意志を立てるなら、立法機関が変わる。実際に執行され、従うことを求められる規則や法律を定める者が、事実上の立法機関だからである。社会が設けた立法機関の制定したものとは別の法律が立てられ、別の規則が正しいと称され、守るよう強制されるなら、立法機関が変わったのは明らかだ。社会の根本的な取り決めによって権限を与えられていないのに、新たな法を導入し、あるいは古い法を覆す者は、それを作った権力を認めず、その権力を覆し、こうして新しい立法機関を立てるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s215",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:224",
          "printed_page": "436",
          "printed_page_end": "437",
          "source_sequence": 257
        }
      ],
      "source_text": "215. Secondly, When the Prince hinders the Legislative from assembling in its due time, or from acting freely, pursuant to those ends for which it was constituted, the Legislative is altered. For 'tis not a certain number of Men, no, nor their meeting, unless they have also Freedom of debating, and Leisure of perfecting what is for the good of the Society, wherein the Legislative consists, when these are taken away, or altered, so as to deprive the Society, of the due exercise of their Power, the Legislative is truly altered. For it is not Names that constitute Governments, but the use and exercise of those Powers that were intended to accompany them: so that he who takes away the Freedom, or hinders the acting of the Legislative in its due seasons, in effect takes away the Legislative, and puts an end to the Government.",
      "translation_ja": "第215節　第二に、君主が、立法機関がしかるべき時に集まることを妨げたり、立法機関が、自分の設けられた目的に従い、自由に行動することを妨げたりするなら、立法機関は変えられる。立法機関は、一定の人数の人々がいるだけでは成り立たず、単に会合するだけでも足りない。自由に議論し、社会のためになることをやり遂げる時間も必要だからである。これらが奪われ、あるいは社会が権力をしかるべく行使できなくなるように変えられるなら、立法機関は実際に変えられている。政府を形づくるのは名称ではなく、その名前に伴うべきとされた権力の使用と行使である。だから、立法機関の自由を奪い、あるいはしかるべき時期に活動するのを妨げる者は、事実上、立法機関を取り除き、政府を終わらせる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s216",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:224",
          "printed_page": "437",
          "source_sequence": 258
        }
      ],
      "source_text": "216. Thirdly, When, by the Arbitrary Power of the Prince, the Electours, or ways of Election are altered, without the Consent, and contrary to the common Interest of the People, there also the Legislative is altered. For if others, then those whom the Society hath authorized thereunto, do chuse, or in another way than what the Society hath prescribed, those chosen are not the Legislative appointed by the People.",
      "translation_ja": "第216節　第三に、君主が恣意的に権力をふるい、人民の同意なしに、共通の利益に反して、選挙人や選挙方法を改めるなら、そこでも立法機関は変えられる。社会からその権限を与えられた者以外が、あるいは社会が定めたのとは違う方法で選ぶなら、選ばれた者たちは、人民が指名した立法機関ではないからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s217",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:224",
          "printed_page": "437",
          "source_sequence": 259
        }
      ],
      "source_text": "217. Fourthly, The delivery also of the People into the subjection of a foreign Power, either by the Prince, or by the Legislative, is certainly a change of the Legislative, and so a Dissolution of the Government. For the end, why People entered into Society, being to be preserved one intire, free, independent Society, to be governed by its own Laws; this is lost when-ever they are given up into the Power of another.",
      "translation_ja": "第217節　第四に、君主であれ立法機関であれ、人民を外国の権力に従う者として引き渡すことも、確かに立法機関を変えることであり、したがって政府の解体となる。人民が社会に入った目的は、自らの法律で治められる、一つの、完全で自由で独立した社会としてあり続けることだった。ほかの者の力のもとに引き渡されれば、それは失われる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s218",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:224",
          "printed_page": "437",
          "printed_page_end": "438",
          "source_sequence": 260
        }
      ],
      "source_text": "218. Why, in such a Constitution as this, the Dissolution of the Government, in these Cases, is to be imputed to the Prince, is evident, because he having the Force, Treasure, and Offices of the State, to imploy, and often perswading himself, or being flattered by others, that as supreme Magistrate, he is uncapable of controul; he alone is in a Condition to make great Advances toward such Changes, under pretence of lawful Authority, and has it in his hands to terrifie, or suppress Opposers, as factious, seditious, and Enemies to the Government: whereas no other part of the Legislative, or People, is capable, by themselves, to attempt any alteration of the Legislative, without open and visible Rebellion, apt enough to be taken notice of; which, when it prevails, produces Effects very little different from foreign Conquest. Besides the Prince, in such a Form of Government, having the Power of dissolving the other Parts of the Legislative, and thereby rendring them private Persons, they can never, in opposition to him, or without his Concurrence, alter the Legislative by a Law; his Consent being necessary to give any of their Decrees that Sanction. But yet so far as the other parts of the Legislative any way contribute to any attempt upon the Government, and do either promote, or not, what lies in them, hinder such designs, they are guilty, and partake in this, which is certainly the greatest Crime Men can be guilty of one towards another.",
      "translation_ja": "第218節　このような国制で、このような場合に政府の解体の責任を負うのが君主である理由は明らかだ。君主は国家の武力、財宝、官職を自由に使え、最高の公職者である以上、誰にも抑えられないと、しばしば自分で思い込むか、おべっかで思い込まされる。そのため、正当な権威を装ってこうした変更を大きく進める地位にあり、反対する者を党派の徒、扇動者、政府の敵と見なして、脅し、あるいは抑える力を手にしているのは、君主一人なのである。それに対して、立法機関のほかの部分も人民も、それだけで立法機関を少しでも変えようとするには、明らかで目につく反乱を起こすほかない。この反乱が勝てば、外国の征服とほとんど変わらない結果が生じる。そのうえ、このような政体では、立法機関のほかの部分を君主は解散でき、それによって彼らを私人に戻せるので、彼らは君主の反対を押し切って、あるいは君主の同意なく、法律によって立法機関を変えられない。彼らのどんな決議にも、法の承認を与えるには君主の同意が必要だからである。ただし、立法機関のほかの部分も、政府を害する何らかの企てに力を貸し、これを進め、あるいは力の及ぶかぎり阻もうとしなかったなら、それだけ罪があり、これに加わったことになる。これは確かに、人が互いに対して犯しうる、最も大きな罪である。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s219",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:225",
          "printed_page": "439",
          "source_sequence": 261
        }
      ],
      "source_text": "219. There is one way more, whereby such a Government may be dissolved, and that is; When he, who has the supreme, executive Power, neglects, and abandons that charge, so that the Laws, already made, can no longer be put in execution. This is demonstratively to reduce all to Anarchy, and so effectually to dissolve the Government. For Laws not being made for themselves, but to be, by their execution, the Bonds of the Society, to keep every part of the Body Politick in its due place, and function. When that totally ceases, the Government visibly ceases, and the People become a confused Multitude, without Order or Connexion. Where there is no longer the administration of Justice, for the securing of Mens Rights; nor any remaining Power within the Community to direct the Force, or provide for the Necessities of the publick; there certainly is no Government left. Where the Laws cannot be executed it is all one as if there were no Laws; and a Government without Laws, is, I suppose, a Mystery in Politicks, unconceivable to humane Capacity, and inconsistent with humane Society.",
      "translation_ja": "第219節　このような政府が解体する道がもう一つある。最高の執行権を持つ者がその務めを怠り、放棄して、すでに制定された法がもはや執行できなくなる場合である。これで何もかもが無政府状態に落ち、実際に政府が解体することは、疑いの余地がない。法律はそれ自体のために作られるのではなく、執行されることによって社会の絆となり、政治体の各部をしかるべき位置と働きにとどめるためにある。執行がまったくやめば、政府は明らかに消滅し、人民は秩序もつながりもない、混乱した群衆になる。人々の権利を守る裁判がもはや行われず、社会の力を指図し、公の必要に備えるための権力も共同体の内に残っていないところでは、確かに政府は何も残っていない。法が執行できないなら、法がないのと同じである。法律のない政府とは、私の考えでは、人間の能力には理解できず、人間の社会とも両立しない、政治上の謎である。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s220",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:225",
          "printed_page": "439",
          "printed_page_end": "440",
          "source_sequence": 262
        }
      ],
      "source_text": "220. In these, and the like Cases, when the Government is dissolved, the People are at liberty to provide for themselves, by erecting a new Legislative, differing from the other, by the change of Persons, or Form, or both, as they shall find it most for their safety and good. For the Society can never, by the fault of another, lose the native and original Right it has to preserve it self; which can only be done by a setled Legislative, and a fair and impartial execution of the Laws made by it. But the state of Mankind is not so miserable, that they are not capable of using this Remedy, till it be too late to look for any. To tell People they may provide for themselves, by erecting a new Legislative; when, by Oppression, Artitifice, or being delivered over to a foreign Power, their old one is gone, is only to tell them, they may expect Relief, when it is too late, and the evil is past Cure. This is, in Effect, no more, than to bid them, first be Slaves, and then to take care of their Liberty; and, when their Chains are on, tell them, they may act like Free-men. This, if barely so, is rather Mockery than Relief, and Men can never be secure from Tyranny, if there be no means to escape it, till they are perfectly under it: And therefore it is, that they have not only a Right to get out of it, but to prevent it.",
      "translation_ja": "第220節　このような場合に政府が解体すれば、人民は自由に、新たな立法機関を設けて、自らの身に備えることができる。自分たちの安全と利益にいちばんかなうと考えるように、構成員を変え、形を変え、あるいはその両方を変えればよい。社会は他人の過ちで、自らを保全する、生まれながらの根本の権利を決して失わない。その権利を実現するには、確立した立法機関と、その機関が定めた法の、公正で偏りのない執行がどうしても必要である。だが人間の境遇は、もう何をしても遅いところまで救済策を使えずにいるほど惨めなものではない。圧迫、策略、あるいは外国の権力に引き渡されることで、古い立法機関がなくなってからなら、新しい立法機関を設けて身に備えてよい、と人民に言うのは、救済を期待してよいのは、もう手遅れで、害を治しようがなくなったときだ、と言うにすぎない。事実上、まず奴隷になり、それから自由を守れ、と命じ、鎖につながれてから、自由人として行動してよい、と言うのと変わらない。それだけなら救いというより嘲りである。完全に圧政の下に置かれるまでそこから逃れる手立てがないなら、人は決して圧政から安全ではない。そのため、圧政から出る権利だけでなく、それを防ぐ権利も持つのである。",
      "translation_status": "reviewed"
    },

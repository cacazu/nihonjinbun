          "printed_page": "296",
          "source_sequence": 92
        }
      ],
      "source_text": "76. Thus the natural Fathers of Families, by an insensible change, became the politick Monarchs of them too; and as they chanced to live long, and leave able and worthy Heirs, for several Successions, or otherwise: so they laid the Foundations of Hereditary, or Elective Kingdoms under several Constitutions, and Manors, according as Chance, Contrivance, or Occasions happen'd to mould them. But if Princes have their Titles in the Fathers Right, and it be a sufficient proof of the natural Right of Fathers to political Authority; because, they commonly were those, in whose hands, we find, de facto, the Exercise of Government: I say, if this Argument be good, it will as strongly prove that all Princes, nay Princes only, ought to be Priests, since 'tis as certain that in the Beginning, The Father of the Family was Priest, as that he was Ruler in his own Houshold.",
      "translation_ja": "第76節　こうして家族の実の父が、気づかないほどの変化を経て、政治の上でもその家族の君主となった。たまたま長生きして、何代かにわたって有能でふさわしい後継者を残したか、そうでなかったかに応じて、世襲または選挙による王国の土台が築かれた。偶然、考案、折々の事情がそれをどのように形づくったかによって、その構成やあり方もさまざまであった。ところが、君主の権原は父の権利に由来し、実際に父が統治を行う場合が多かったということが、父に政治権力を持つ自然の権利があるという十分な証拠だとするなら、その論証で証明できるのはそればかりではない、と私は言いたい。すべての君主が、しかも君主だけが祭司であるべきだということも、同じ強さで証明できるだろう。初めに家の父が祭司であったことも、一家の統治者であったことと同じくらい確かだからである。",
      "translation_status": "reviewed"
    },

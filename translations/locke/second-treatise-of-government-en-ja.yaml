        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:220",
          "printed_page": "429",
          "printed_page_end": "430",
          "source_sequence": 249
        }
      ],
      "source_text": "209. But if either these illegal Acts, have extended to the Majority of the People; or if the Mischief and Oppression has light only on some few, but in such Cases as the Precedent and Consequences seem to threaten all; and they are perswaded in their Consciences that their Laws, and with them, their Estates, Liberties, and Lives are in danger, and perhaps their Religion too; how they will be hindred from resisting illegal Force, used against them, I cannot tell. This is an Inconvenience, I confess, that attends all Governments whatsoever, when the Governours have brought it to this pass, to be generally suspected of their People, the most dangerous state they can possibly put themselves in; wherein they are the less to be pityed, because it is so easie to be avoided. It being as impossible, for a Governour, if he really means the good of his People, and the preservation of them, and their Laws together, not to make them see and feel it; as it is for the Father of a Family not to let his Children see he loves, and takes care of them.",
      "translation_ja": "第209節　しかし、こうした不法な行いが人民の多数に及んだ場合はどうか。害や圧迫がわずかな人に降りかかっただけでも、その先例と結果が全員を脅かすと思われ、人々が、自分たちの法と、それとともに財産、自由、命、おそらく信仰までも危険にさらされていると、良心において確信する場合はどうか。自分たちに向けられた不法な力に抵抗するのを、どうやって妨げられるのか、私には分からない。統治者が、自らの民に広く疑いをかけられるところまで事態を進めてしまったとき、この不都合がどんな政府にもつきまとうことは、認めよう。それは統治者が身を置きうる最も危険な状態である。しかも、それを避けるのがたやすいだけに、彼らを気の毒に思う理由はなお少ない。本当に民のためを思い、民とその法律の双方を守ろうとする統治者が、そのことを民に見せず、感じさせずにいるのは、家の父が、子を愛し世話をしていることを、子に少しも分からせずにいるのと同じくらい不可能だからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s210",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:221",
          "printed_page": "430",
          "printed_page_end": "431",
          "source_sequence": 250
        }
      ],
      "source_text": "210. But if all the World shall observe Pretences of one kind, and Actions of another; Arts used to elude the Law, and the Trust of Prerogative (which is an Arbitrary Power in some things, left in the Prince's hand, to do good, not harm, to the People) employed contrary to the end, for which it was given, If the People shall find the Ministers, and subordinate Magistrates chosen, suitable to such ends, and favoured, or laid by proportionably as they promote, or oppose them: If they see several Experiments made of Arbitrary Power, and that Religion underhand favoured, though publickly proclaimed against, which is readiest to introduce it, and the Operators in it supported as much as may be; and when that cannot be done, yet approved still, and liked the better, and a long Train of Actings shew the Councils all tending that way: how can a Man any more hinder himself from being perswaded in his own Mind, which way things are going; or from casting about how to save himself, than he could from believing the Captain of the Ship he was in, was carrying him, and the rest of the Company, to Algiers, when he found him always stearing that Course, though cross Winds, Leaks in his Ship, and want of Men, and Provisions, did often force him to turn his Course another way, for some time, which he steadily returned to again, as soon as the Wind, Weather, and other Circumstances would let him?",
      "translation_ja": "第210節　だが、口実は一つ、行いは別だと世の誰もが認める場合はどうか。法をすり抜ける策が弄され、人民のためになることをするのであって、害するためではない、ある事柄について君主に任された裁量の力、すなわち大権が、授けられた目的に反して用いられている。人々が見るところ、大臣や下位の公職者はそのような目的にかなうよう選ばれ、目的を進めるか妨げるかに応じて遇され、または脇へ追いやられる。恣意的な権力の行使がいくつも試され、それを最も持ち込みやすい宗教が、公には非難されながら、ひそかにひいきされ、それを推し進める者たちができるだけ支援されている。それさえできないときも、なお認められ、前より好まれている。そして長い一連の行為から、すべての方策がその方を向いていると分かる。こうしたとき、事態がどちらに向かっているかを確信し、どうやって身を守るかを考える気持ちを、どう抑えられようか。乗った船の船長が、自分たちをアルジェへ連れていこうとしていると信じないではいられないのと同じである。船長はつねにそちらを目指して舵を取り、逆風や浸水、乗組員や食料の不足のため、しばらく進路を変えざるをえないことが何度もあっても、風、天気、その他の事情が許すやいなや、着実にもとの針路に戻るのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-19",
      "section_id": "ch-19",

          "printed_page_end": "445",
          "source_sequence": 266
        }
      ],
      "source_text": "223. To this perhaps it will be said, that the People being ignorant and always discontented; to lay the Foundation of Government in the unsteady opinion and uncertain humour of the People, is to expose it to certain ruin: and no Government will be able long to subsist, if the People may set up a new Legislative whenever they take offence at the old one. To this I Answer quite the contrary. People are not so easily got out of their old Forms as some are apt to suggest. They are hardly to be prevailed with to amend the acknowledg'd Faults in the Frame they have been accustom'd to. And if there be any original defects, or adventitious ones introduced by time or corruption; 'tis not an easy thing to get them changed, even when all the World sees there is an opportunity for it. This slowness and aversion in the People to quit their old Constitutions, has in the many Revolutions have been seen in this Kingdom, in this and former Ages, still kept us to, or aftersome interval of fruitless attempts, still brought us back again to our old Legislative of King, Lords and Commons: and whatever provocations have made the Crown be taken from some of our Princes Heads, they never carried the people so far as to place it in another Line.",
      "translation_ja": "第223節　これには、おそらくこう言う人がいるだろう。人民は何も知らず、いつも不満を抱く。政府の土台を、人民の揺れ動く意見やあてにならない気分に置けば、必ず滅びにさらす。古い立法機関が気に入らないたびに、人民が新しいものを設けられるなら、どんな政府も長く持つはずがない、と。私は、まったく反対だと答えよう。一部の人が言いたがるほど、人々が古くからの形をたやすく捨てることはない。慣れ親しんだ仕組みに誰もが認める欠点があっても、改める気にさせるのは難しい。初めからの欠陥であれ、時の経過や腐敗が後から持ち込んだ欠陥であれ、今こそ変える機会だと世の誰もが分かっても、実際に改めてもらうのは簡単ではない。人民が古い国制を捨てるのに気が進まず、なかなか動かないため、この国でこの時代にも昔にも起きた多くの変革の中でも、私たちはずっと、王と貴族院と庶民院からなる古い立法機関を保った。あるいは、うまくいかない試みを間に挟んでも、結局はそこに戻ってきた。どんな行いが怒りを招き、私たちの君主のうち何人かがその頭から王冠を取られようとも、別の家系に王冠を渡すところまで、人民を進ませることはついになかった。",
      "translation_status": "reviewed"
    },

      ],
      "source_text": "135. Though the Legislative, whether placed in one or more, whether it be always in being, or only by intervals, though it be the Supream Power in every Commonwealth; yet, First, it is not, nor can possibly be absolutely Arbitrary, over the Lives and Fortunes of the People. For it being but the joint power of every Member of the Society given up to that person, or Assembly, which is Legislator; it can be no more than those persons had in a state of Nature before they enter'd into Society, and gave it up to the Community. For no Body can transfer to another more power than he has in himself; and no Body has an absolute Arbitrary Power over himself, or over any other, to destroy his own Life, or take away the Life or Property of another. A Man, as has been proved, cannot subject himself to the Arbitrary Power of another; and having in the state of Nature no Arbitrary Power over the Life, Liberty, or Possession of another, but only so much as the Law of Nature gave him for the preservation of himself, and the rest of Mankind; this is all he doth, or can give up to the Commonwealth, and by it to the Legislative Power, so that the Legislative can have no more than this. Their Power in the utmost bounds of it, is limited to the publick good of the Society. It is a Power that hath no other end but preservation, and therefore can never have a right to destroy, enslave, or designedly to impoverish the Subjects; the obligations of the Law of Nature cease not in Society, but only in many Cases are drawn closer, and have by human Laws, known Penalties annexed to them, to inforce their observation. Thus the Law of Nature stands as an Eternal Rule to all Men, Legislators as well as others. The Rules that they make for other Mens actions, must as well as their own, and other Mens actions, be conformable to the Law of Nature, i. e. to the will of God, of which that is a Declaration, and the fundamental Law of Nature being the preservation of Mankind, no humane Sanction can be good or valid against it.",
      "translation_ja": "第135節　立法権は、一人に置かれようと複数に置かれようと、常に存在しようと一定の時にだけ存在しようと、どの国家でも最高の力ではある。だが第一に、人民の命や財産に対して、絶対的で恣意的ではなく、そうなることはありえない。その権力は、社会の成員一人ひとりの力を合わせ、それを立法者である個人か議会に渡したものにすぎない。だから、その人々が社会に入って共同体に力を渡す前の、自然状態で持っていた力を超えることはできない。誰も自分が持つ以上の力を他人に譲れないし、誰も、自分自身や他人に対し、自分の命を滅ぼすとか、他人の命や財産を奪うとかいう、絶対的で恣意的な力を持ってはいないからだ。すでに証明したように、人は他人の恣意的な権力の下に、自分自身を置くことができない。自然状態では、他人の命、自由、持ち物に対する恣意的な力を持たず、自分とほかの人類を保全するために自然法から与えられた分しか持たない。これが、国家に、また国家を通して立法機関に渡す、そして渡せるすべてなのだから、立法機関もそれ以上を持ちえない。立法機関の権力は、目いっぱい広くとっても、社会の公共の利益に限られる。保全以外の目的を持たない力だから、臣民を滅ぼし、奴隷とし、また意図して貧しくする権利を、決して持ちえない。自然法の課す義務も、社会に入れば消えるのではなく、多くの場合、いっそう厳密になり、人が定める法によって、その義務を守らせるための周知の罰が加わるだけである。このように自然法は、立法者であれほかの者であれ、万人にとって永遠の規準であり続ける。他の人々の行動について立法者が定める規則は、立法者自身やその他の人々の行動と同じく、自然法、すなわちこの法が明らかにする神の意志にかなわなければならない。そして自然の根本法が人類の保全である以上、それに反して、人が与える承認に正当さも効力もありえない。",
      "translation_status": "reviewed"
    },
    {

      "source_text": "227. In both the forementioned Cases, when either the Legislative is changed, or the Legislators act contrary to the end for which they were constituted; those who are guilty are guilty of Rebellion. For if any one by force takes away the establish'd Legislative of any Society, and the Laws by them made, pursuant to their trust, he thereby takes away the Umpirage which every one had consented to, for a peaceable decision of all their Controversies, and a bar to the state of War amongst them. They who remove, or change the Legislative, take away this decisive power, which no Body can have but by the appointment and consent of the People; and so destroying the Authority which the People did, and no Body else can set up, and introducing a Power which the People hath not authoriz'd; actually introduce a state of War, which is, that of Force without Authority: and thus by removing the Legislative establish'd by the Society, in whose decisions the People acquiesced and united, as to that of their own will; they unty the Knot, and expose the People anew to the state of War. And if those, who by force take away the Legislative, are Rebels, the Legislators themselves, as has been shewn, can be no less esteemed so; when they who were set up for the protection and preservation of the People, their Liberties and Properties, shall by force invade and indeavour to take them away; and so they, putting themselves into a state of War with those who made them the Protectors and Guardians of their Peace, are properly, and with the greatest aggravation, Rebellantes Rebels.",
      "translation_ja": "第227節　以上の二つの場合、すなわち立法機関が変えられたときも、立法者が任を与えられた目的に反して行動したときも、そうした者は反乱の罪を負う。誰かが力で、ある社会の確立した立法機関を取り除き、その機関が信任に沿って制定した法を取り除けば、皆が同意していた裁定の手段を、これによって奪うことになる。その手段は、人々の間の争いをすべて平和に解決し、戦争状態を防ぐためのものである。立法機関を取り除き、あるいは変える者は、人民の指名と同意によらなければ誰も持ちえない、この裁定の力を奪う。そうして人民が設けた、ほかの誰にも設けられない権威を壊し、人民が権限を与えていない力を持ち込むことで、実際に戦争状態、つまり権威のない力の状態をもたらすのである。このように、社会が設けた立法機関の決定を、人民は自らの意志の決定として受け入れ、一つにまとまっていたのに、その機関を取り除くことで、人々を結ぶ結び目をほどき、人民をもう一度戦争状態にさらす。立法機関を力で取り除く者が反乱者なら、すでに示したように、立法者自身も、同じく反乱者と見なされなければならない。人民とその自由と財産を守って保全するために立てられた者が、それを力で侵し、奪おうとするなら、そうである。こうして自分たちを平和の保護者、守り手とした人々に対して、自ら戦争状態に入る者こそ、文字どおり、しかも最も重い意味で、戦争を再び起こす反乱者である。",
      "translation_status": "reviewed"
    },

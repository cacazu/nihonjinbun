      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:159",
          "printed_page": "306",
          "printed_page_end": "307",
          "source_sequence": 105
        }
      ],
      "source_text": "88. And thus the Commonwealth comes by a power to set down what punishment shall belong to the several transgressions they think worthy of it, committed amongst the Members of that Society (which is the power of making Laws) as well as it has the power to punish any injury done unto any of its Members, by any one that is not of it, (which is the power of War and Peace;) and all this for the preservation of the property of all the Members of that Society, as far as is possible. But though every Man enter'd into Society, has quitted his power to punish offences against the Law of Nature, in prosecution of his own private Judgment; yet with the Judgment of offences which he has given up to the Legislative, in all Cases where he can appeal to the Magistrate, he has given up a right to the Commonwealth, to imploy his Force for the Execution of the Judgments of the Commonwealth, whenever he shall be called to it, which indeed are his own Judgments, they being made by himself or his representative. And herein we have the original of the Legislative and Executive Power of Civil Society, which is to judge by standing Laws how far offences are to be punished when committed within the Commonwealth; and also by occasional Judgments founded on the present circumstances of the fact, how far injuries from without are to be vindicated, and in both these to imploy all the force of all the Members when there shall be need.",
      "translation_ja": "第88節　こうして国家は、その社会の成員の間で犯されたさまざまな違反のうち、処罰に値すると判断するものについて、どんな刑罰を科すかを定める力を得る。これが法を制定する力である。同時に、成員の誰かが外部の者から受けた加害を罰する力も得る。これが戦争と平和を決める力である。すべては、その社会の成員全員の財産をできるだけ保全するためにある。ところで、社会に入った者は、自然法違反を自らの私的な判断によって罰する力を手放している。だが、公職にある者に訴えることができるすべての事件について、違反を裁く力を立法機関に譲ったのと同時に、国家が判決を執行するために協力を求めれば、いつでもその人の力を用いてよいという権利を、国家に譲ったのである。判決は、その人自身か代表者が下したものなのだから、実のところ、本人の判断でもある。ここに市民社会の立法権と執行権の起源がある。すなわち国家の内で犯された違反をどこまで罰するかを、確立した法律によって裁き、また外からの加害にどこまで償いを求めるかを、そのときの事実関係に照らした個別の判断で裁く。そしていずれの場合も、必要が生じれば全成員の力を残らず用いるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s089",
      "section_id": "ch-07",
      "kind": "paragraph",

        }
      ],
      "source_text": "148. Though, as I said, the Executive and Federative Power of every Community be really distinct in themselves, yet they are hardly to be separated and placed at the same time in the hands of distinct Persons. For both of them requiring the force of the Society for their exercise, it is almost impracticable to place the Force of the Commonwealth in distinct, and not subordinate hands; or that the Executive and Federative Power should be placed in Persons that might act separately, whereby the Force of the publick would be under different Commands, which would be apt sometime or other to cause disorder and ruin.",
      "translation_ja": "第148節　先に言ったとおり、どんな共同体でも、執行権と対外権はそれ自体としては実際に区別できる。それでも、二つを分けて、同時に別々の人の手に置くことは難しい。どちらも行使するには社会の力が要るからだ。国家の力を、互いに従属しない別の手に置くことも、執行権と対外権を、それぞれ別々に行動できる人たちに持たせることも、まず実行できない。それでは公の力が異なる命令の下に置かれ、いずれは混乱と破滅を招きかねない。",
      "translation_status": "reviewed"
    },

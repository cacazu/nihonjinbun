          "source_sequence": 98
        }
      ],
      "source_text": "81. But though these are Ties upon Mankind, which make the Conjugal Bonds more firm and lasting, in a Man, than the other species of Animals; yet it would give one reason to enquire, why this compact, where Procreation and Education are secured, and Inheritance taken care for, may not be made determinable, either by consent, or at a certain time, or upon certain conditions, as well as any other voluntary compacts; there being no necessity, in the nature of the thing, nor to the ends of it, that it should always be for life; I mean, to such as are under no Restraint of any positive Law, which ordains all such contracts to be perpetual.",
      "translation_ja": "第81節　以上のような結びつきが人間を拘束しているため、人の夫婦の絆は、ほかの種類の動物より強く、長続きする。それでも、子をもうけ育てることが確実にでき、相続にも手当てがあるなら、ほかの自発的な取り決めと同じように、なぜこの取り決めも、合意によって、あるいは一定の時期や条件に達したときに終えられないのかと、尋ねる理由がある。事柄それ自体の性質からも、その目的からも、つねに一生続けなければならない必然性はないからだ。むろん、そうした契約はすべて永続すべきだと命じる実定法の制約を受けていない人々について言っているのである。",
      "translation_status": "reviewed"
    },
    {

          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:167",
          "printed_page": "322",
          "printed_page_end": "323",
          "source_sequence": 125
        }
      ],
      "source_text": "103. And I hope those who went away from Sparta, with Palantus, mentioned by Iustin l. will be allowed to have been Freemen independent one of another, and to have set up a Government over themselves, by their own consent. Thus I have given several Examples out of History, of people free and in the state of Nature, that being met together incorporated and began a Commonwealth. And if the want of such instances be an argument to prove, that Government were not, nor could not be so begun, I suppose the Contenders for Paternal Empire were better let it alone, than urge it against natural Liberty. For if they can give so many instances out of History, of Governments began upon paternal Right, I think (though at least an Argument from what has been, to what should of right, be of no great force) one might, without any great danger, yield them the cause. But if I might advise them in the Case, they would do well not to search too much into the original of Governments, as they have begun de facto, lest they should find at the foundation of most of them, something very little favourable to the design they promote, and such a power as they contend for.",
      "translation_ja": "第103節　ユスティヌスの著作に出てくる、パラントスとともにスパルタを去った人々も、互いに独立した自由人であり、自らの同意で、自分たちを治める政府を設けたと、認めてもらえるだろう。こうして、自由で自然状態にあった人々が、集まって一つになり、国家を始めた実例を、歴史からいくつか挙げた。そういう実例がないことをもって、政府はそのように始まらなかった、始まりえなかったと証明するつもりなら、父権による支配を唱える者は、自然の自由に対してその論法を持ち出すより、黙っていた方がよかろう。もし父の権利に基づいて始まった政府の実例を、歴史から同じだけ挙げられるのなら、たいして危険もなく、相手の主張を認めてもよいと思う。もっとも、実際にそうであったことから、権利としてどうあるべきかを論じるのは、そもそもたいした力を持たない。私から助言できるものなら、政府が現にどのように始まったか、その起源を探りすぎない方がよいと言おう。そのほとんどの基礎に、彼らが広めようとする企てや、その権力の主張にとって、ひどく都合が悪いものを見つけかねないからである。",
      "translation_status": "reviewed"
    },
    {

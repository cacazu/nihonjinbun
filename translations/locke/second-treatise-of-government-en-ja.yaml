      "source_text": "18. This makes it Lawful for a Man to kill a Theif, who has not in the least hurt him, nor declared any design upon his Life, any farther then by the use of Force, so to get him in his Power, as to take away his Money, or what he pleases from him, because using force, where he has no Right to get me into his Power, let his pretence be what it will, I have no reason to suppose, that he, who would take away my Liberty, would not when he had me in his Power, take away every thing else. And therefore it is Lawful for me to treat him, as one who has put himself into a State of War with me, i. e. kill him if I can; For to that hazard does he justly expose himself, whoever introduces a State of War, and is aggresser in it.",
      "translation_ja": "第18節　これが、盗人に致命的な力を用いることが許される理由である。その盗人がまだ相手を少しも傷つけておらず、ただ力でその人を屈服させ、金なり欲しいものなりを奪おうとしたこと以外に、命を狙う意図を示していなかったとしても変わらない。どんな口実を掲げようと、私を支配する権利もないのに力を用いて自由を取り上げようとする者が、ひとたび私をその手中に収めれば、ほかのすべても奪わないと考える理由はない。だから、私とのあいだで戦争状態に入った者として扱い、できるなら命を奪うことまで許される。自分から戦争状態を持ちこんで攻撃する者が、それだけの危険にさらされるのは当然なのである。",
      "translation_status": "reviewed"
    },

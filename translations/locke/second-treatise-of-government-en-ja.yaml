          "printed_page": "227",
          "source_sequence": 20
        }
      ],
      "source_text": "10. Besides the Crime which consists in violating the Laws, and varying from the right Rule of reason, whereby a Man so far becomes degenerate, and declares himself to quit the Principles of Human Nature, and to be a noxious Creature, there is commonly injury done, and some Person or other, some other Man, receives damage by his transgression, in which Case he who hath received any damage, has besides the Right of punishment common to him, with other Men, a particular Right, to seek Reparation from him that has done it. And any other Person who finds it just, may also joyn with him that is injur'd, and assist him in recovering from the Offender, so much as may make satisfaction for the harm he has suffer'd.",
      "translation_ja": "第10節　法を破り、理性の正しい規準からそれること自体が罪である。人はそのかぎりで堕落し、人間の本性の原則を捨て、害をなす者となったことを自ら示す。だが普通はそれに加えて、何らかの害が加えられ、別の誰かがその違反によって損失を被る。そんな場合、損失を被った者は、ほかの人と同じく処罰する権利に加え、害をなした相手に償いを求める固有の権利を持つ。また、これを正当と認める者なら誰でも、被害を受けた者に力を貸し、被った害を償うだけのものを違反者から取り戻すのを助けることができる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s011",

      ],
      "source_text": "Secondly, It must be without Retribution, or Punishment; and the Reason he gives, is, Because an Inferiour cannot punish a Superiour.",
      "translation_ja": "第二に、報復したり罰したりしてはならない。なぜなら、下位の者は上位の者を罰することができないからだという。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s235-p03",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:234",
          "printed_page": "457",
          "printed_page_end": "458",
          "source_sequence": 282
        }
      ],
      "source_text": "First, How to resist Force without striking again, or how to strike with Reverence, will need some Skill to make intelligible. [Specific weapon-use illustration omitted.] Locke argues that purely passive resistance will be quickly overcome and invite worse treatment. This is as ridiculous a way of resisting, as Iuvenal thought it of fighting; ubi tu pulsas, ego vapulo tantum. And the Success of the Combat, will be unavoidably the same he there describes it: — Libertas pauperis haec est: Pulsatus rogat, & pugnis concisus, adorat, Vt liceat paucis cum dentibus inde reverti. This will always be the event of such an imaginary Resistance, where Men may not strike again. He therefore who may resist, must be allowed to strike. And then let our Author, or any Body else, join [specific examples of blows omitted] with as much Reverence, and Respect as he thinks fit. He that can reconcile Blows and Reverence, may, for ought I know, deserve for his pains, a Civil, Respectful Cudgelling, where-ever he can meet with it.",
      "translation_ja": "第一の点から言えば、打ち返すことなく、どうすれば力に抗することができるのか。また、どう打てば敬意を示したことになるのか。これを分かるように説明するには、少々腕が要る。［武器の具体的な用い方は省略。］まともに反撃できない防御は、たちまち尽き、かえってひどい仕打ちを招くだけだと、ここでロックは説く。これは、ユウェナリスが戦いについて笑いものにしたのと同じくらい、ばかげた抵抗の仕方である。「お前は殴り、私はただ殴られる。」戦いの結末も、必ずユウェナリスがそこで描いたとおりになる。「これが貧乏人の自由だ。殴られ、拳でたたきのめされて、せめて歯を何本か残して帰らせてくださいと、請い、拝むのだ。」打ち返してはならないという、こんなありもしない抵抗は、いつもこの結末を迎える。抗うことが許されるなら、打ち返すことも許されなくてはならない。ならば、ここで論じている著者でも他の誰でも、［打撃の具体例は省略。］思う存分の敬意と尊重を、打ち返すことに添えてみるがよい。打つことと敬意を両立させられる人なら、ひょっとすると、その骨折りの報いとして、どこで出くわしても、礼儀正しく敬意をこめた棒打ちを受ける値打ちがあるのかもしれない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s235-p04",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:235",
          "printed_page": "458",
          "printed_page_end": "460",
          "source_sequence": 283
        }
      ],
      "source_text": "Secondly, As to his Second, An Inferiour cannot punish a Superiour; that's true, generally speaking, whilst he is his Superiour. But to resist Force with Force, being the State of War, that levells the Parties, cancels all former relation of Reverence, Respect, and Superiority: and then the odds, that remains, is, That he, who opposes the unjust Aggressour, has this Superiority over him, that he has a Right, when he prevails, to punish the Offender, both for the Breach of the Peace, and all the Evils that followed upon it. Barclay therefore, in another place, more coherently to himself, denies it to be lawful to resist a King in any Case. But he there assigns Two Cases, whereby a King may Un-king himself. His Words are, Quid ergo, nulline casus incidere possunt quibus populo sese erigere atque in Regem impotentius dominantem arma capere & invadere jure suo suâque authoritate liceat? Nulli certe quamdiu Rex manet. Semper enim ex divinis id obstat, Regem honorificato; & qui potestati resistit, Dei ordinationi resistit: Non aliàs igitur in eum populo potestas est quam si id committat propter quod ipso jure rex esse desinat. Tunc enim se ipse principatu exuit atque in privatis constituit liber: hoc modo populus & superior efficitur, reverso ad eum sc. jure illo quod ante regem inauguratum in interregno habuit. At sunt paucorum generum commissa ejusmodi quae hunc effectum pariunt. At ego cum plurima animo perlustrem, duo tantum invenio, duos, inquam, casus quibus rex ipso facto ex Rege non regem se facit & omni honore & dignitate regali atque in subditos potestate destituit; quorum etiam meminit Winzerus. Horum unus est, Si regnum disperdat, quemadmodum de Nerone fertur, quod is nempe senatum populumque Romanum, atque adeo urbem ipsam ferro flammaque vastare, ac novas sibi sedes quaerere decrevisset. Et de Caligula, quod palam denunciarit se neque civem neque principem senatui amplius fore, inque animo habuerit, interempto utriusque ordinis Electissimo quoque Alexandriam commigrare, ac ut populum uno ictu interimeret, unam ei cervicem optavit. Talia cum rex aliquis meditatur & molitur serio, omnem regnandi curam & animum ilico abjicit, ac proinde imperium in subditos amittit, ut dominus servi pro derelicto habiti, dominium. 236. Alt[?]r casus est, Si rex in alicujus olientelam se contulit, ac regnum quod liberum à majoribus & populo traditum accepit, alienae ditioni mancipavit. Nam tunc quamvis forte non eâ mente id agit populo plane ut incommodet: tamen quia quod praecipuum est regiae dignitatis amisit, ut summus scilicet in regno secundum Deum sit, & solo Deo inferior, atque populum etiam totum ignorantem vel invitum, cujus libertatem sartam & tectam conservare debuit, in alterius gentis ditionem & potestatem dedidit; hác velut quadam regni abalienatione effecit, ut nec quod ipse in regno imperium habuit r[?]tineat, nec in eum cui collatum voluit, juris quicquam transera[?]; atque ita eo facto liberum jam & suae potestatis populum relinquit, cujus rei exemplum unum annales Scotici suppeditant. Barclay contra Monarchom. l. 3. c. 16. which may be thus Englished.",
      "translation_ja": "第二に、彼の二番目の点、すなわち下位の者は上位の者を罰せられないというのは、おおむね、相手が上位の者であるあいだは正しい。しかし力に力で抗することは戦争状態であり、それは双方を同じ立場に置き、以前の敬意、尊重、優越の関係をすべて消す。そのとき残る一方の優位は、不当な攻撃者に抗する側は、勝ったときに、平和を破ったことと、そこから起きたあらゆる害について、違反者を罰する権利を持つことだ。だからバークリーは別の箇所で、むしろ自分の言い分と一貫するように、いかなる場合であれ王に抵抗することの正当性を否定する。ただしそこで、王が自ら王でなくなる二つの場合を挙げる。彼はこう述べている。「では、人民がみずから立ち、自分の権利と権威によって、思うままに支配する王に武器を取り、これに立ち向かってよい場合は一つも起こりえないのか。確かに、その人が王であるかぎり、何一つない。神の言葉で、王を敬え、権威に抗う者は神の定めに抗う、とあることが、いつもそれを妨げるからだ。従って、王が法の定めそのものによって王でなくなることを犯さないかぎり、人民にはその者に対する力がない。その場合には、王は自ら君主の位を脱ぎ、自由な私人の一人となる。こうして人民は、王を立てる前の空位の時期に持っていた権利を取り戻し、上位に立つ。しかし実際に、こうした結果を生む過失は数少ない。さまざまな事例を心に浮かべて見渡しても、私は二つしか見つけられない。この二つの場合、王は事実そのものによって、王でありながら自ら王でなくなり、臣民に対するすべての王としての栄誉も威厳も権力も失う。ウィンゼルスもこれに言及している。一つは王が国を滅ぼそうとするときである。ネロについては、元老院もローマの民も、ローマの市そのものさえ剣と火で荒らし、自分は新たな居場所を探そうと決めていた、と伝わる。またカリグラについては、王は公然と、元老院にとってもはや市民でも君主でもないと宣言し、両身分のとりわけ優れた者をことごとく殺して、アレクサンドリアに移ろうと考えていたという。民全体を一撃で殺せるよう、首は一つであればよいと望んだ。王がこのようなことを真剣に考え、企てるなら、ただちに統治する気遣いと心をすべて捨て、臣民に対する支配権を失う。主人が、見捨てた奴隷への支配権を失うのと同じである。」第236節　「もう一つは、王が他人の庇護に入り、祖先と人民から自由な国として引き渡された王国を、よその支配に委ねる場合だ。その場合、明らかに人民を害する意図で行ったわけではないかもしれない。それでも、国で神に次ぐ最高の者となり、神だけの下に立つ、王位の最も大切なものを失った。しかも、損なわれないよう守るはずだった全国民の自由を、彼らの知らぬうちに、あるいはその意に反して、外国の支配と権力に渡してしまった。このいわば王国の譲渡によって、王は、自分が国に持っていた支配権を保つことも、それを与えようとした相手にいささかの権利を渡すこともできない。こうして、その行為によって、人民を自由にし、自分たちのことを自分たちで決められるようにするのである。この一例を、スコットランドの年代記が伝えている。」バークリー『君主政の擁護』第三巻第十六章。英語にすれば次のようになる。",
      "translation_status": "reviewed",

      "source_text": "31. It will perhaps be objected to this, That if gathering the Acorns, or other Fruits of the Earth, &c. makes a right to them, then any one may ingross as much as he will. To which I Answer, Not so. The same Law of Nature that does by this means give us Property, does also bound that Property too. God has given us all things richly, 1 Tim. vi. 12. Is the Voice of Reason confirmed by Inspiration. But how far has he given it us, to enjoy? As much as any one can make use of to any advantage of life before it spoils; so much he may by his labour fix a Property in. Whatever is beyond this, is more than his share, and belongs to others. Nothing was made by God for Man to spoil or destroy. And thus considering the plenty of natural Provisions there was a long time in the World, and the few spenders, and to how small a part of that provision the industry of one Man could extend it self, and ingross it to the prejudice of others; especially keeping within the bounds set by reason of what might serve for his use; there could be then little room for quarrels or contentions about Property so establish'd.",
      "translation_ja": "第31節　ドングリやその他の大地の実りを集めることで、それに対する権利が得られるなら、誰でも好きなだけ独り占めできるではないか、という反論があるかもしれない。私の答えは、そうではない、というものだ。このように所有を認める自然法こそ、その所有に限りを設ける。「神は私たちにすべてのものを豊かに与えてくださった」（『テモテへの第一の手紙』第6章、底本では12節）とは、理性の声を神の啓示が裏づけたものである。しかし、神はどこまで、享受してよいと認めたのか。損なわれる前に、何か暮らしの役に立つように使いきれるだけである。その分だけを労働によって自らの財産としうる。それを超えるものは自分の取り分を越え、ほかの人々に属する。神は人に腐らせたり壊されたりするために、何かを造ったのではない。だから、世界には長いあいだ自然の恵みがあふれ、それを使う人は少なかったこと、また一人の力では、そのうちわずかな分しか手に入れて、他人の不利益になるほど独り占めできなかったことを考えれば、とりわけ、役に立つだけという理性の限度を人が守るなら、こうして成り立つ所有をめぐって、もめ事や争いが起きる余地はほとんどなかった。",
      "translation_status": "reviewed"
    },

          "printed_page_end": "300",
          "source_sequence": 97
        }
      ],
      "source_text": "80. And herein, I think, lies the chief, if not the only reason, why the Male and Female, in Mankind, are tyed to a longer conjunction, than other Creatures; viz. because the Female is capable of conceiving, and de facto is commonly with Child again, and brings forth too a new Birth, long before the former is out of a dependency for support on his Parents help, and able to shift for himself, and has all the assistance is due to him from his Parents, whereby the Father, who is bound to take care for those he hath begot, is under an obligation to continue in Conjugal Society, with the same Woman, longer than other Creatures, whose Young being able to subsist of themselves, before the time of Procreation returns again, the Conjugal Bond dissolves of it self, and they are at liberty; till Hymen, at his usual anniversary Season, summons them again to chuse new Mates. Wherein one cannot but admire the Wisdom of the great Creator, who, having given to Man an Ability, to lay up for the future, as well as supply the present necessity, hath made it necessary, that Society of Man and Wife should be more lasting, than of Male and Female amongst other Creatures: that so their Industry might be encouraged, and their Interest better united, to make provision, and lay up Goods for their common Issue; which uncertain mixture, or easie, and frequent solutions of Conjugal Society would mightily disturb.",
      "translation_ja": "第80節　人の男女が他の生き物より長く結びついているのも、唯一の理由とは言わないまでも、主にはここに理由があると思う。すなわち女性は、先に生まれた子が親の助けに頼って生きる状態を抜け出し、自分の力で暮らしていけるようになり、親から受けるべき援助をすべて受け終わるよりはるかに前に、次の子を身ごもることができ、実際また妊娠して産むのが普通だからだ。そのため、生まれた子の世話をする義務を負う父は、他の生き物より長く、同じ女性と夫婦の社会を保つ義務を負う。ほかの生き物では、次の繁殖期を迎える前に子が自力で生きられるようになるから、つがいの絆はおのずと解け、自由になる。年ごとのいつもの季節が来て、婚姻の神ヒュメンに呼ばれ、また新たなつがいを選ぶまでのことだ。この点では、偉大な造り主の知恵に感嘆せずにいられない。人に、いま必要なものをまかなうだけでなく将来のために蓄える力も授けたうえで、人の夫婦の社会が、ほかの生き物の雄と雌の結びつきより長く続くことを必要なものとした。こうして二人が励んで働き、利害をいっそう確かに合わせ、二人の子のために暮らしの備えをし、財を蓄えられるようにしたのである。誰と結びつくかが定まらず、夫婦の社会がいとも簡単に、しばしば解かれるなら、これは大きく妨げられるだろう。",
      "translation_status": "reviewed"
    },

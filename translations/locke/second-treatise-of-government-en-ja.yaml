      ],
      "source_text": "222. The Reasons why Men enter into Society, is the preservation of their Property; and the end why they chuse, and authorize a Legislative, is, that there may be Laws made, and Rules set, as Guards and Fences to the Properties of all the Society, to limit the Power, and moderate the Dominion of every Part and Member of the Society. For since it can never be supposed to be the Will of the Society, that the Legislative should have a Power to destroy that which every one designs to secure, by entering into Society, and for which the People submitted themselves to Legislators of their own making; whenever the Legislators endeavour to take away, and destroy the Poperty of the People, or to reduce them to Slavery, under Arbitrary Power, they put themselves into a state of War with the People, who are thereupon absolved from any farther Obedience, and are left to the common Refuge, which God hath provided for all Men, against Force and Violence. Whensoever therefore the Legislative shall transgress this fundamental Rule of Society; and either by Ambition, Fear, Folly or Corruption, endeavour to grasp themselves, or put into the hands of any other, an Absosolute Power, over the Lives, Liberties, and Estates of the People: by this breach of Trust they forfeit the Power, the People had put into their hands, for quite contrary ends, and it devolves to the People; who have a Right to resume their original Liberty, and, by the Establishment of a new Legislative (such as they shall think fit) provide for their own Safety and Security, which is the end for which they are in Society. What I have said here, concerning the Legislative, in general, holds true also concerning the supreme Executor, who having a double Trust put in him, both to have a part in the Legislative; and the supreme Execution of the Law, acts against both, when he goes about to set up his own Arbitrary Will, as the Law of the Society. He acts also contrary to his Trust, when he imploys the Force, Treasure, and Offices of the Society, to corrupt the Representatives, and gain them to his purposes: when he openly pre-ingages the Electors, and prescribes, to their choice, such, whom he has, by Sollicitation, Threats, Promises, or othewise, won to his designs; and imploys them to bring in such, who have promised before-hand what to vote, and what to enact. Thus to regulate Candidates and Electors, and new model the ways of Election, what is it, but to cut up the Government by the Roots, and poison the very Fountain of publick Security? For the People having reserved to themselves the Choice of their Representatives, as the Fence to their Properties, could do it for no other end, but that they might always be freely chosen, and so chosen, freely act and advise, as the necessity of the Commonwealth, and the publick Good should, upon examination, and mature debate, be judged to require. This, those who give their Votes before they hear the Debate, and have weighed the Reasons on all sides, are not capable of doing. To prepare such an Assembly as this, and endeavour to set up the declared Abettors of his own Will, for the true Representatives of the People, and the Law-makers of the Society, is certainly as great a breach of trust, and as perfect a Declaration of a design to subvert the Government, as is possible to be met with. To which, if one shall add rewards and punishments visibly imploy'd to the same end, and all the arts of perverted Law made use of to take off and destroy all that stand in the way of such a design, and will not comply and consent to betray the Liberties of their Country, 'twill be past doubt what is doing. What Power they ought to have in the Society who thus imploy it contrary to the trust went along with it in its first Institution, is easy to determine; and one cannot but see, that he who has once attempted any such thing as this, cannot any longer be trusted.",
      "translation_ja": "第222節　人が社会に入る理由は、財産を守ることである。立法機関を選び、これに権限を与える目的は、社会のすべての人の財産を守るとりでとして、法律が制定され、規則が置かれるようにすることだ。それによって、社会の各部、各人の力を限り、支配を抑えるのである。誰もが社会に入ることで確保しようとし、人民が自ら選んだ立法者に従ったのもそのためであったものを、立法機関に打ち壊す力を与えようと社会が望んだとは、決して考えられない。そこで立法者が人民の財産を奪って滅ぼし、あるいは恣意的な力の下で奴隷にしようとするとき、人民との戦争状態に入る。そのため人民はそれ以上従う義務から解かれ、神が力と暴力に対して万人に備えた、共通の逃れ場に委ねられる。したがって立法機関が社会のこの根本規則を越え、野心や恐れ、愚かさや腐敗によって、人民の生命、自由、財産に対する絶対権力を、自分たちで握り、または他人の手に渡そうとするなら、信任を破ったために、全く反対の目的で人民から預かっていた権力を失う。その権力は人民に戻り、人々は初めに持っていた自由を取り戻す権利を持つ。そして、自分たちが適切と考える新たな立法機関を設け、自らの安全と保障を図る権利を持つ。それこそ社会にいる目的なのである。立法機関についてここで一般的に言ったことは、最高の執行者にも当てはまる。彼は立法に加わることと、法の最高の執行を行うことの二重の信任を託されている。自らの恣意的な意志を、社会の法として立てようとするとき、どちらにも反して行動する。社会の武力、財宝、官職を使って代表者を腐敗させ、自らの目的に引き寄せたり、選挙人を公然と前もって取り込み、懇願、脅迫、約束などで自分の企てに味方させた者を選ぶよう指図したり、またその選挙人を使って、何に票を投じ、何を法として定めるかを前もって約束した者を送り込んだりするのも、信任に反する。こうして候補者と選挙人を意のままに操り、選挙の仕組みを作り変えることは、政府を根こそぎにし、公の安全の源に毒を入れることにほかならない。人民が財産を守るとりでとして代表を選ぶ力を手もとに残したのは、いつでも代表を自由に選び、選ばれた者が、調査と熟議を経て、国の必要と公共の利益が求めると判断したことを、自由に行い、助言できるようにするためである。議論を聞き、どちらの側の理由もよく量る前に、どう票を投じるかを決めた者に、これはできない。このような議会をあらかじめ用意し、自分の意向を公然と助ける者を、人民の真の代表、社会の立法者に立てようとするのは、これ以上ないほど大きな信任の侵害であり、政府を覆す企てがあることの、これ以上ないほど明白な宣言である。加えて、褒賞と処罰があからさまに同じ目的に用いられ、法律を曲げて使うありとあらゆる手が、その企てに立ちはだかり、国の自由を裏切ることに従わず同意しない人々を排し、滅ぼすために弄されているなら、何が行われているかはもはや疑いようがない。初めに権力を設けたときにそれに伴っていた信任に反して、こうして権力を用いる者が、社会でどんな力を持つべきかは、決めるのがたやすい。そしてそのようなことを一度でも企てた者は、もはや信頼してはならないことも、誰もが認めざるをえない。",

      "source_text": "203. May the Commands then of a Prince be opposed? May he be resisted, as often as any one shall find himself aggrieved, and but imagine he has not Right done him? This will unhinge and overturn all Politi[?]s, and, instead of Government and Order, leave nothing but Anarchy and Confusion.",
      "translation_ja": "第203節　では君主の命令には逆らってもよいのか。被害を受けたと思うたびに、正当に扱われなかったと想像するだけで、抵抗できるのか。それでは政治体がみなばらばらになり、覆され、政府と秩序に代わって、無政府と混乱しか残らないだろう。",

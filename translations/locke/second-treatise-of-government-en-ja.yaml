      "source_text": "56. Adam was created a perfect Man, his Body and Mind in full possession of their Strength and Reason, and so was capable, from the first Instance of his being, to provide for his own Support and Preservation, and govern his Actions according to the Dictates of the Law of Reason God had implanted in him. From him the World is peopled with his Descendants, who are all born Infants, weak and helpless, without Knowledge or Understanding. But to supply the Defects of this imperfect State, till the improvement of Growth and Age had removed them, Adam and Eve, and after them all Parents were, by the Law of Nature, under an Obligation to preserve, nourish, and educate the Children they had begotten, not as their own Workmanship, but the Workmanship of their own Maker, the Almighty, to whom they were to be accountable for them.",
      "translation_ja": "第56節　アダムは完全な大人として造られ、身体は力を、心は理性を、初めから十分に備えていた。だから、存在の最初の瞬間から、自分を養い保全することができ、神が彼に植えつけた理性の法の命じるとおりに、自分の行動を律することができた。世界に住む人々はみなアダムの子孫だが、誰もが生まれたときは、知識も分別もなく、弱く、人の助けを借りるほかない乳飲み子である。そこで、成長して年を重ねるにつれて、この未熟な状態の足りない点が取り除かれるまで、アダムとエバも、その後のすべての親も、自分たちがもうけた子を守り、養い、教育する義務を、自然法によって負った。子どもは親自身が造ったものではなく、親をも造った全能の神の作品であり、親は子どものことについて、その神に対して責任を負うのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s057",
      "section_id": "ch-06",

      ],
      "source_text": "180. Thirdly, The Power a Conquerer gets over those he overcomes in a just War, is perfectly despotical; he has an absolute Power over the Lives of those, who by putting themselves in a state of War, have forfeited them; but he has not thereby a right and title to their Possessions. This I doubt not, but at first sight, will seem a strange Doctrine, it being so quite contrary to the practice of the World. There being nothing more familiar in speaking of the dominion of Countries, than to say such an one Conquer'd it. As if Conquest, without any more ado, convey'd a right of Possession. But when we consider, that the practice of the strong and powerful, how universal soever it may be, is seldom the rule of Right, however it be one part of the subjection of the Conquer'd not to argue against the Conditions cut out to them by the Conquering Swords.",
      "translation_ja": "第180節　第三に、正しい戦争で打ち負かした人々に対して、征服者が得る力は、完全に専制的である。戦争状態に入ることで命を失ういわれを自ら作った者の命については、絶対の力を持つが、それによって彼らの財産への権利や権原を得るわけではない。これは世界で行われていることにあまりに反するので、一見すると、きっと奇妙な説に思われるだろう。国々の支配について話すとき、「誰それが征服した」と言うほどありふれたことはない。まるで征服するだけで、その国の所有権まで手に入るかのようだ。だが、征服された側が、征服者の剣で押しつけられた条件に異を唱えないことは、その従属の一部であるにしても、強い者や権力を持つ者がどうふるまうかは、どんなに広く行われていようとも、正しいことを見極める規準になることはめったにない。",
      "translation_status": "reviewed"
    },

      "source_text": "34. God gave the World to Men in Common, but since he gave it them for their benefit, and the greatest Conveniencies of Life they were capable to draw from it; it cannot be supposed he meant it should always remain common and uncultivated. He gave it to the use of the industrious and rational, (and labour was to be his title to it;) not to the phancy or covetousness of the quarrelsome and contentious. He that had as good left for his improvement, as was already taken up, needed not complain, ought not to meddle with what was already improved by another's labour: if he did, 'tis plain he desired the benefit of anothers pains which he had no right to, and not the ground which God had given him in common with others to labour on, and whereof there was as good left as that already possessed; and more than he knew what to do with, or his industry could reach to.",
      "translation_ja": "第34節　神は世界を人々に共有させたが、それを人の益のため、そこから得られるだけの暮らしの便宜を得させるために与えた以上、いつまでも共有のまま、耕さずにおくことを神が望んだとは考えられない。争い好きで言いがかりをつける人間の気まぐれや欲に委ねたのではなく、勤勉で理性を働かせる者に使わせ、その労働を所有の根拠とするために与えたのだ。すでに取得されたものに劣らない土地が、自分で手を入れるために残されていた者には、不平を言う必要もなく、他人が労働によって手を入れた土地に干渉すべきでもなかった。そうした者が干渉したとすれば、自分の権利でない他人の骨折りの益を求めていたことは明らかだ。神がほかの人々と共有させ、自分でも耕せるようにした土地を求めたのではない。そこには、すでに所有された土地に劣らぬものが、その人がどう使うか思いつくよりも、その働きが及ぶよりも、ずっと多く残っていたのである。",
      "translation_status": "reviewed"

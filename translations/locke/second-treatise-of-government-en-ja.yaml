      ],
      "source_text": "73. This is no small Tye to the Obedience of Children: and there being always annexed to the Enjoyment of Land, a Submission to the Government of the Country, of which that Land is a part. It has been commonly suppos'd, That, a Father could oblige his Posterity to that Government, of which he himself was a Subject, that his Compact held them, whereas, it being only a necessary Condition annex'd to the Land, which is under that Government, reaches only those who will take it on that Condition, and so is no natural Tye or Engagement, but a voluntary Submission. For every Man's Children being, by Nature, as free as himself, or any of his Ancestours ever were, may, whilst they are in that Freedom, choose what Society they will join themselves to, what Commonwealth they will put themselves under. But if they will enjoy the Inheritance of their Ancestours, they must take it on the same terms their Ancestours had it, and submit to all the Conditions, annex'd to such a Possession. By this Power indeed, Fathers oblige their Children to Obedience to themselves, even when they are past Minority, and most commonly too, subject them to this or that political Power. But neither of these by any peculiar right of Father-hood, but by the Reward they have in their hands to inforce and recompence such a Compliance; and is no more Power than what a French-man has over an English-man, who by the hopes of an Estate he will leave him, will certainly have a strong tye on his Obedience: and if when it is left him, he will enjoy it, he must certainly take it upon the Conditions annex'd to the Possession of Land, in that Country where it lies, whether it be France or England.",
      "translation_ja": "第73節　これは、子どもを従わせる力として小さくない。しかも、土地を享受することには、常に、その土地が属する国の政府に服することが伴う。そのため父は、自分が臣民である政府に子孫を従わせることができ、父の結んだ取り決めが子孫を拘束すると、よく考えられてきた。だが実際には、その政府の下にある土地に付された必要な条件にすぎない。その条件で土地を受け取る者にしか及ばず、自然に人を拘束する約束や関係ではなく、自ら選んで従うことなのである。人の子は誰でも、その父や祖先がそうだったように、生まれながら自由である。この自由にあるうちは、どの社会に加わり、どの国家に身を置くかを選べる。だが祖先の遺産を享受したければ、祖先が保有したときと同じ条件で受け取り、その所有に付された条件のすべてに従わなければならない。この力によって父は確かに、成年になったあとも子を自分に従わせ、多くの場合、ある政治権力か別の政治権力に服させる。しかしどちらも父であることに固有の権利によるのではなく、そうした同意を促し、報いるための褒美を手にしていることによる。これは、あるフランス人が、自分の財産を遺してもらえるとあるイングランド人に期待させ、その人を強く従わせられるのと、違う力ではない。そのイングランド人が、財産を遺されたとき、それを享受しようとすれば、フランスであれイングランドであれ、その土地がある国で、土地所有に伴う条件を受け入れなくてはならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s074",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

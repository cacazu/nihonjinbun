          "printed_page": "248",
          "printed_page_end": "249",
          "source_sequence": 43
        }
      ],
      "source_text": "30. Thus this Law of reason makes the Deer, that Indian's who hath killed it; 'tis allowed to be his goods who hath bestowed his labour upon it, though before, it was the common right of every one. And amongst those who are counted the Civiliz'd part of Mankind, who have made and multiplied positive Laws to determine Property, this original Law of Nature for the beginning of Property, in what was before common, still takes places; and by vertue thereof, what Fish any one catches in the Ocean, that great and still remaining Common of Mankind; or what Ambergriese any one takes up here, is by the labour that removes it out of that common state Nature left it in, made his Property who takes that pains about it. And even amongst us the Hare that any one is Hunting, is thought his who pursues her during the Chase. For being a Beast that is still looked upon as common, and no Man's private Possession; who-ever has imploy'd so much labour about any of that kind, as to find and pursue her, has thereby removed her from the state of Nature wherein she was common, and hath began a Property.",
      "translation_ja": "第30節　こうして理性の法は、鹿を仕留めた先住民に、その鹿を帰属させる。以前は万人の共有の権利に属していた鹿も、労働を費やした人の持ち物だと認められる。また、財産の帰属を定める実定法を作り、ふやしてきた、いわゆる文明社会の人々のあいだでも、それまで共有だったものに所有が始まるときには、このもとからある自然法が、なお妥当する。人類の大きな共有地として今も残る大海で釣り上げた魚も、そこで拾い上げた龍涎香も、この法によって、自然が置いた共有状態から取り出す労働を費やした人の財産となる。私たちのあいだでさえ、狩りの最中の野ウサギは、追っている者のものと考えられている。いまなお共有のもので、誰かの私有に属さない動物とみなされる野ウサギも、見つけて追いかけるだけの労働を費やした者は、その労働によって、ウサギを共有のものとする自然状態から外に出し、所有の端緒を開いたのである。",
      "translation_status": "reviewed"
    },

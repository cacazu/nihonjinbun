      "source_text": "43. An Acre of Land that bears here Twenty Bushels of Wheat, and another in America, which, with the same Husbandry, would do the like, are, without doubt, of the same natural, intrinsick Value. But yet the Benefit Mankind receives from one in a Year is worth 5l. and the other possibly not worth a Penny; if all the Profit an Indian received from it were to be valued, and sold here; at least, I may truly say, not 1/[?]000. 'Tis Labour then which puts the greatest part of Value upon Land, without which it would scarcely be worth any thing; 'tis to that we owe the greatest part of all its useful Products; for all that the Straw, Bran, Bread, of that Acre of Wheat, is more worth than the Product of an Acre of as good Land, which lies waste, is all the Effect of Labour. For 'tis not barely the Plough-man's Pains, the Reaper's and Thresher's Toil, and the Baker's Sweat, is to be counted into the Bread we eat; the Labour of those who broke the Oxen, who digged and wrought the Iron and Stones, who felled and framed the Timber imployed about the Plough, Mill, Oven, or any other Utensils, which are a vast Number, requisite to this Corn, from its sowing to its being made Bread, must all be charged on the account of Labour, and received as an effect of that: Nature and the Earth furnished only the almost worthless Materials, as in themselves. 'Twould be a strange Catalogue of things, that Industry provided and made use of, about every Loaf of Bread before it came to our use, if we could trace them; Iron, Wood, Leather, Bark, Timber, Stone, Bricks, Coals, Lime, Cloth, Dying[?] Drugs, Pitch, Tar, Masts, Ropes, and all the Materials made use of in the Ship, that brought any of the Commodities, made use of by any of the Work-men, to any part of the Work, all which, 'twould be almost impossible, at least too long, to reckon up.",
      "translation_ja": "第43節　こちらで小麦を二十ブッシェル生む一エーカーの土地と、アメリカにあって、同じように耕せば同じだけ穫れる土地とには、疑いなく同じ自然の値打ちがある。だが、人類が一年で一方から得る益は五ポンドに値するのに、他方については、先住民が得た利益をすべて値に換算し、ここで売りに出しても、一ペニーにもならないかもしれない。少なくとも前者の千分の一にもならないと言ってよい。土地に値打ちの大部分を与えるのは労働だ。労働がなければ土地にはほとんど何の値打ちもない。土地から得る有用な産物の大部分は、労働のおかげだ。一エーカーから収穫された小麦の藁、ふすま、パンが、同じだけ良質でも荒れたままの一エーカーから得られるものより価値があるなら、その差はすべて労働の成果である。私たちが食べるパンに数えるべきは、畑を耕した者の骨折り、刈り入れと脱穀の苦労、パン職人の汗だけではない。牛をならし、鉄や石を掘り出して加工し、鋤や製粉機やかまどなど、種をまいてからパンになるまでに要るおびただしい道具のために材木を切り出して組んだ者の働きも、すべて労働の勘定に入れ、その成果と認めねばならない。自然や大地が与えたのは、それだけではほとんど値打ちのない材料にすぎない。パンが一つ手もとに届くまで、勤勉によって何が作られ、何が用いられたかをたどるなら、実に奇妙な目録ができるだろう。鉄、木、革、樹皮、材木、石、煉瓦、石炭、石灰、布、染料、瀝青、タール、帆柱、綱、さらには、どの工程で働く職人にせよ、その人が使った何らかの品を運んだ船に用いられた部材のすべて。これらを一つずつ数えるのはほとんど不可能で、少なくとも長すぎてここではできない。",

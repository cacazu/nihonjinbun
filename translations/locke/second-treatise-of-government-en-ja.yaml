          "printed_page": "224",
          "printed_page_end": "225",
          "source_sequence": 18
        }
      ],
      "source_text": "8. And thus in the State of Nature, one Man comes by a Power over another; but yet no Absolute or Arbitrary Power, to use a Criminal when he has got him in his hands, according to the passionate heats, or boundless extravagancy of his own Will, but only to retribute to him, so far as calm reason and conscience dictates, what is proportionate to his Transgression, which is so much as may serve for Reparation and Restraint. For these two are the only reasons, why one Man may lawfully do harm to another, which is that we call punishment. In trangressing the Law of Nature, the Offender declares himself to live by another Rule, then that of reason and common equity, which is that measure God has set to the actions of Men, for their mutual security, and so he becomes dangerous to Mankind, the tye, which is to secure them from injury and violence, being slighted and broken by him, which being a trespass against the whole Species, and the Peace and Safety of it, provided for by the Law of Nature, every Man upon this score, by the Right he hath to preserve Mankind in general, may restrain, or where it is necessary, destroy things noxious to them, and so may bring such evil on any one, who hath transgressed that Law, as may make him repent the doing of it, and thereby deter him, and by his Example others, from doing the like mischief. And in this case, and upon this ground, every Man hath a Right to punish the Offender, and be Executioner of the Law of Nature.",
      "translation_ja": "第8節　こうして自然状態でも、人は他人に対して権力を得る。ただし、犯人を手中に収めたとき、激情の高ぶりや果てしないわがままのままに扱ってよいという、絶対的で恣意的な権力ではない。冷静な理性と良心の判断に従い、違反に釣り合うものを報いとして科す権力にすぎない。その限度は、被害を償わせ、違反を抑止するのに役立つところまでである。他人に害を加えても正当とされるのは、この二つの理由による場合だけであり、それを私たちは処罰と呼ぶ。自然法に背くことによって、違反者は理性と公平という共通の基準とは別の掟で生きると宣言する。理性と公平は、人が互いに安全に暮らせるよう、神が人の行いに定めた尺度である。人を加害や暴力から守るはずの絆を軽んじて断ち切る者は、こうして人類にとって危険となる。これは自然法の守ろうとする人類全体と、その平和と安全を侵すことだから、誰もが、人類一般を保全する権利によって、人類に害をなすものを抑え、必要なら除くことができる。それゆえ自然法を破った者には、犯したことを悔やませ、当人を思いとどまらせ、その例を見てほかの人にも同じ害を起こさせないだけの苦痛を科すことができる。この場合に、この根拠に立って、誰もが違反者を罰し、自然法の執行者となる権利を持つのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s009",
      "section_id": "ch-02",
      "kind": "paragraph",

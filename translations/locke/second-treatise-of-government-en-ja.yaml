      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:148",
          "printed_page": "284",
          "printed_page_end": "285",
          "source_sequence": 81
        }
      ],
      "source_text": "66. But though there be a time when a Child comes to be as free from subjection to the will and Command of his Father, as he himself is free from subjection to the will of any body else, and they are both under no other restraint, but that which is common to them both, whether it be the Law of Nature, or municipal Law of their Country; yet this freedom exempts not a Son from that honour which he ought, by the Law of God and Nature, to pay his Parents. God having made the Parents Instruments in his great design of continuing the Race of Mankind, and the occasions of Life to their Children, as he hath laid on them an obligation to nourish, preserve, and bring up their Off-spring: so he has laid on the Children a perpetual obligation of honouring their Parents, which containing in it an inward esteem and reverence to be shewn by all outward expressions, ties up the Child from any thing that may ever injure or affront, disturb, or endanger the happiness, or life of those from whom he received his: and engages him in all actions of defence, relief, assistance and comfort of those by whose means he entred into being, and has been made capable of any enjoyments of life. From this obligation no State, no freedom, can absolve Children. But this is very far from giving Parents a power of command over their Children, or an Authority to make Laws, and dispose as they please of their Lives or Liberties. 'Tis one thing to owe honour, respect, gratitude and assistance; another to require an absolute obedience and submission. The honour due to Parents, a Monarch in his Throne owes his Mother, and yet this lessens not his Authority, nor subjects him to her Government.",
      "translation_ja": "第66節　こうして子が父の意志や命令への服従から、父自身が他人の意志への服従から自由であるのと同じだけ自由になるときがくる。二人を拘束するのは、自然法であれ、その国の国内法であれ、二人に共通するものだけである。とはいえ、この自由が、神と自然の法により両親に払うべき敬意から子を免れさせるわけではない。神は、人類を存続させるという大きな計画を実現する手立てとして両親を選び、両親を通して子に命を与えた。それゆえ、親に子を養い、守り、育てる義務を課したのと同じように、子には親を敬う永続的な義務を課した。この義務には、あらゆる外に現れる形で示すべき、心のうちからの尊敬と敬意が含まれ、命を授かった相手をいつであれ傷つけ、侮り、困らせたり、その幸福や命を危うくしたりすることを禁じる。また、そのおかげで自分が生まれ、人生の喜びを味わえるようになった相手を、守り、救い、支え、慰めるあらゆる行いを求める。どんな身分も、どんな自由も、子をこの義務から解くことはできない。とはいえ、子に命令する権力や、法を定め、子の生命と自由を思いどおりに処分できる権限を、親に与えることからはほど遠い。敬意と尊重、感謝と助けを負うことと、絶対的な服従と従属を求められることとは別である。王座にある君主も母に、親にふさわしい敬意を払う義務がある。だが、そのために君主としての権威が減ることも、母の統治に服することもない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s067",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"

        }
      ],
      "source_text": "237. What then, Can there no Case happen wherein the people may of right, and by their own Authority, help themselves, take Arms, and set upon their King, imperiously domineering over them? None at all, whilst he remains a King. Honour the King, and he that resists the Power, resists the Ordinance of God; are divine Oracles that will never permit it. The People therefore can never come by a Power over him, unless he does something that makes him cease to be a King. For then he divests himself of his Crown and Dignity, and returns to the state of a private Man, and the People become free and superiour; the Power which they had in the Interregnum, before they Crown'd him King, devolving to them again. But there are but few miscarriages which bring the matter to this state. After considering it well on all sides, I can find but two. Two Cases there are, I say, whereby a King, ipso facto, becomes no King, and loses all Power and Regal Authority over his People; which are also taken notice of by Winzerus. The first is, if he indeavour to overturn the Government, that is, if he have a purpose and design to ruin the Kingdom and Commonwealth, as it is recorded of Nero, that he resolved to cut off the Senate and People of Rome, lay the City wast with Fire and Sword, and then remove to some other place. And of Caligula, that he openly declar'd, that he would be no longer a head to the People or Senate, and that he had it in his thoughts to cut off the worthiest Men of both Ranks, and then retire to Alexandria: and he wisht that the People had but one Neck, that he might dispatch them all at a blow. Such designs as these, when any King harbours in his thoughts, and seriously promotes, he immediately gives up all care and thought of the Commonwealth; and consequently forfeits the Power of Governing his Subjects, as a Master does the dominion over his Slaves whom he hath abandon'd.",
      "translation_ja": "第237節　「では、人民が自らの権利と権威によって、自力で身を助け、武器を取って、自分たちに横暴に君臨する王に立ち向かってよい場合など起こりえないのか。王が王であるかぎり、まったくない。『王を敬いなさい』、『権威に抗う者は神の定めに抗う』とは、決してそれを許さない神の言葉である。だから、人民が王をどうにかする力を得られるのは、王が何かをして、そのために王でなくなったときだけである。そのとき王は自ら王冠と尊厳を脱ぎ捨て、私人に戻る。人民は自由になり、上位に立つ。彼に王冠を授ける前の空位期に持っていた力が、人民のもとに戻るからである。だが事態をここまで進める過ちは少ない。どの面からもよく考えたが、私には二つしか見つからない。王が、事実そのものによって王でなくなり、人民に対するすべての力と王としての権威を失う場合が二つある、と言っているのである。これにはウィンゼルスも言及している。第一は、王が政府を覆そうとする、つまり王国と国家を滅ぼす意図を持ち、企てる場合である。ネロについては、元老院とローマの民を滅ぼし、火と剣で市を荒廃させ、それから他の場所に移ると決意したと記録されている。カリグラについても、人民や元老院の長ではもはやないと公然と宣言し、どちらの身分でも最も立派な人々を滅ぼしてから、アレクサンドリアに引きこもろうと考えたという。民に首が一つしかなければ、一撃で皆を片づけられるのに、と望んだ。王がこういう企てを心に抱き、真剣に進めるとき、そのときすぐに国家について考え、その面倒を見ることをすべて放棄したのであり、結果として臣民を治める力を失う。主人が、見捨てた奴隷に対する支配を失うのと同じである。」",
      "translation_status": "reviewed"
    },

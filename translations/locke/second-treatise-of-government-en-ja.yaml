          "source_sequence": 166
        }
      ],
      "source_text": "Two Foundations there are which bear up publick Societies; the one a natural inclination, whereby all Men desire sociable Life and Fellowship; the other an Order, expresly or secretly agreed upon, touching the manner of their union in living together; the latter is that which we call the Law of a Commonweal, the very Soul of a politick Body, the parts whereof are by Law animated, held together, and set on work in such actions as the common good requireth. Law[?] politick, ordain'd for external order and regiment amongst Men, are never framed as they should be, unless presuming the will of Man to be inwardly obstinate, [?]rebellious, and averse from all obedience to the sacred Laws of his nature; in a word, unless presuming Man to be in regard of his depraved Mind, little better than a wild Beast, they do accordingly provide notwithstanding, so to frame his outward actions, that they be no hindrance unto the common good, for which Societies are instituted. Vnless they do this they are not perfect. Hooker's Ec. Pol. l. 1. §. 10.",
      "translation_ja": "「公の社会を支える土台は二つある。一つは、人々を皆、交わりのある生活と仲間へと引く自然の性向である。もう一つは、どのように結ばれて共に暮らすかについて、明らかにか、ひそかにか、合意された秩序である。後者を国家の法と呼ぶ。それこそが政治体の魂であり、その体の各部は法によって生気を与えられ、結びつけられ、共通の利益が求める行いをするよう動かされる。人の外から見える秩序と統治のために設けられる政治上の法が、あるべき形をとることはない。人の意志は内心では頑強で、反抗的で、人間の本性にある神聖な法に従うことをことごとく嫌がる、と見なさなければならない。ひと言でいえば、心が堕落している点で、人は野獣よりいくらもましでないと見なしたうえで、それでも外に現れる行いを整え、その行いが、社会を設けた目的である共通の利益を妨げないよう、法が手立てを講じなければならない。そうでなければ、法は完全ではない。」フッカー『教会統治の法』第一巻第十節。",

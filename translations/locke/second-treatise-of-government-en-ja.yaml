      "source_text": "22. THE natural Liberty of Man is to be free from any Superiour Power on Earth, and not to be under the Will or Legislative Authority of Man, but to have only the Law of Nature for his Rule. The Liberty of Man, in Society, is to be under no other Legislative Power, but that established, by consent, in the Commonwealth; nor under the Dominion of any Will, or Restraint of any Law, but what that Legislative shall enact, according to the Trust put in it. Freedom then is not what Sr. R. F. tells us, O. A. 55. A Liberty for every one to do what he lists, to live as he pleases, and not to be tyed by any Laws: but Freedom of Men, under Government, is, to have a standing Rule to live by, common to every one of that Society, and made by the Legislative Power erected in it. A Liberty to follow my own Will in all things, where that Rule prescribes not; not to be subject to the inconstant, uncertain, unknown, Arbitrary Will of another Man. As Freedom of Nature is to be under no other restraint but the Law of Nature.",
      "translation_ja": "第22節　人間の自然の自由とは、この地上で自分より上位のいかなる権力からも自由で、他人の意向にも立法権にも服さず、ただ自然法だけを行動の規準とすることである。社会の中での人間の自由とは、国家で同意によって設けられた立法権以外には服さず、その立法機関が託された信任に従って制定する法律のほかには、いかなる者の意向にも支配されず、いかなる法律にも制約されないことである。したがって自由とは、ロバート・フィルマー卿が言うように「誰もがしたいことをし、好きに暮らし、どのような法にも縛られない自由」ではない（『所見』55頁）。政府の下での人間の自由は、そこに設けられた立法権がつくり、社会の誰にでも共通に適用される、変わらぬ規則を持って暮らすことなのである。その規則に定めのないことは何であれ、自分の意向に従う自由であり、他人の気まぐれで不確かで知りえない、恣意的な意志に服さない自由である。それは、自然の自由が自然法以外の制約に服さないのと同じである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s023",
      "section_id": "ch-04",

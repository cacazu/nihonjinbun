          "printed_page": "243",
          "source_sequence": 36
        }
      ],
      "source_text": "I confess, we find among the Iews, as well as other Nations, that Men did sell themselves; but, 'tis plain, this was only to Drudgery, not to Slavery. For, it is evident, the Person sold was not under an Absolute, Arbitrary, Despotical Power. For the Master could not have Power to kill him, at any time, whom, at a certain time, he was obliged to let go free out of his service: And the Master of such a Servant was so far from having an Arbitrary Power over his Life, that he could not, at pleasure, so much as maim him, but the Loss of an Eye, or Tooth, set him free, Exod. XXI.",
      "translation_ja": "ユダヤ人にも、ほかの諸民族と同じく、自らを売り渡した人々がいたことは認める。だが、これはただ苦役に就いたのであって、奴隷になったのではない。売られた人が、絶対的で恣意的な専制権力に服してはいなかったことは明らかだ。決められた時が来れば、主人はその人を労役から解いて自由にしなくてはならないのだから、いつでもその人を殺せる権力を持つはずはない。そのような使用人の主人は、相手の命を勝手に左右できないばかりか、意のままに身体を傷つけることさえ許されなかった。片目や歯一本を失えば、その使用人は自由になったのである（『出エジプト記』第21章）。",
      "translation_status": "reviewed"
    },

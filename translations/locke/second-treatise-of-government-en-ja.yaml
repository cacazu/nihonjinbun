      ],
      "source_text": "201. 'Tis a Mistake, to think this Fault is proper only to Monarchies, other Forms of Government are liable to it, as well as that: for where-ever the Power, that is put in any hands, for the Government of the People, and the Preservation of their Properties, is applied to other ends, and made use of to impoverish, harass, or subdue them to the Arbitrary, and Irregular Commands of those that have it: There it presently becomes Tyranny, whether those, that thus use it, are one, or many. Thus we read of the Thirty Tyrants at Athens, as well as one at Syracuse; and the intolerable Dominion of the Decemviri, at Rome, was nothing better.",
      "translation_ja": "第201節　この過ちは君主政にだけ特有だと考えるのは間違いで、ほかの政体にも、同じように起こりうる。人民を治め、その財産を守るために誰かの手に置かれた力が、別の目的に向けられ、人民を貧しくし、苦しめ、その力を持つ者の恣意的で道理を外れた命令に屈服させるのに用いられるところでは、それをそう使うのが一人でも複数でも、ただちに圧政になる。だから史書には、シラクサの一人の暴君だけでなく、アテナイの三十人の暴君が現れる。ローマの十人委員の耐えがたい支配も、それと少しも変わらなかった。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s202",
      "section_id": "ch-18",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:217",
          "printed_page": "423",
          "printed_page_end": "424",
          "source_sequence": 242
        }
      ],
      "source_text": "202. Where-ever Law ends, Tyranny begins, if the Law be transgressed to another's harm. And whosoever, in Authority, exceeds the Power given him by the Law, and makes use of the Force, he has under his Command, to compass that upon the Subject which the Law allows not; ceases, in that, to be a Magistrate, and acting without Authority, may be opposed, as any other Man, who by force invades the Right of another. This is acknowledged in subordinate Magistrates. He that hath Authority to seize my Person in the street, may be opposed as a Thief, and a Robber, if he indeavours to break into my House to execute a Writ, notwithstanding that I know he has such a Warrant, and such a legal Authority as will impower him to arrest me abroad. And why this should not hold in the highest, as well as in the most inferiour Magistrate, I would gladly be informed. Is it reasonable that the eldest Brother, because he has the greatest part of his Father's Estate, should thereby have a Right to take away any of his younger Brothers Portions? Or that a rich Man, who possessed a whole Countrey, should from thence have a Right to seize, when he pleased, the Cottage and Garden of his poor Neighbour? The being rightfully possessed of great Power and Riches, exceedingly beyond the greatest part of the Son of Adam, is so far from being an excuse, much less a reason for Rapine and Oppression, which the endamaging another, without Authority, is; that it is a great Aggravation of it. For the exceeding the Bounds of Authority, is no more a Right, in a great, than a petty Officer: no more justifiable in a King, than a Constable. But so much the worse in him, as that he has more trust put in him, is supposed, from the advantage of Education, and Counsellours to have better Knowledge, and less reason to do it, having already a greater share than the rest of his Brethren.",
      "translation_ja": "第202節　法が踏み越えられて人に害が及ぶなら、法の終わるところに圧政が始まる。権威ある者が誰であれ、法から与えられた権力を越え、自分の指揮下の力を使い、臣民に対して法の認めないことを行うなら、その行いにおいて、もはや公職者ではない。権威なく行動しているのだから、力で他人の権利を侵す者なら誰に対してもそうできるように、抵抗を受けうる。下位の公職者については、これは認められている。街路で私の身柄を拘束する権限がある者でも、令状を執行しようと我が家に押し入るなら、盗人や強盗として抵抗しうる。その者が、屋外で私を逮捕できる令状と法の権威を持つと、私が知っていても同じである。最下位の役人だけでなく、最高位の者にもこれが当てはまらない理由があるなら、ぜひ教えてほしい。長兄は父の財産の大半を手にするから、弟たちの取り分をいくらか奪う権利も持つと言うのは、道理にかなうだろうか。地方一つを持つ金持ちが、だからといって、貧しい隣人の小屋と庭を、好きなときに押収する権利を得るだろうか。アダムの子らの大多数をはるかに上回る権力と富を正当に持つことは、権威なく他人を害するという略奪と圧制の理由になるどころか、その言い訳にさえならず、むしろ罪を重くする。権威の限度を越えることは、大官の権利でないのと同じく、下っ端の役人の権利でもない。巡査の場合より、王の場合に正当化されるわけでもない。王の方がより多くの信任を託され、教育と助言者の恵みを受けて、よりよく知っているはずであり、同胞たちよりすでにずっと多くを得ていて、そんなことをする理由は少ないのだから、罪はそれだけ重い。",
      "translation_status": "reviewed"
    },
    {

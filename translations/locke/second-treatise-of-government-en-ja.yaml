      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:145",
          "printed_page": "278",
          "printed_page_end": "279",
          "source_sequence": 75
        }
      ],
      "source_text": "60. But if, through defects, that may happen, out of the ordinary Course of Nature, any one comes not to such a degree of Reason, wherein he might be supposed capable of knowing the Law, and so living within the Rules of it, he is never capable of being a Free Man; he is never let loose to the disposure of his own Will, because he knows no bounds to it, has not Understanding, its proper Guide; but is continued under the Tuition and Government of others, all the time his own Understanding is uncapable of that Charge. And so Lunaticks and Ideots are never set free from the Government of their Parents; Children, who are not as yet come unto those years whereat they may have; and Innocents, which are excluded, by a natural defect, from ever having. Thirdly, Madmen, which, for the present, cannot possibly have the use of right Reason to guide themselves, have, for their Guide, the Reason that guideth other Men, which are Tutors over them, to seek and procure their good for them, says Hooker Eccl. Pol. lib. 1. §. 7. All which seems no more than that Duty which God and Nature has laid on Man, as well as other Creatures, to preserve their Off-spring till they can be able to shift for themselves, and will scarce amount to an instance or proof of Parents Regal Authority.",
      "translation_ja": "第60節　しかし、自然の通常の成り行きから外れて時に生じる障害のため、法を知り、その規則の範囲で生きられると見込めるだけの理性が身につかない人は、自由人になれない。自分の意志に限度を設けることを知らず、それを正しく導く分別がないため、自分の意志だけに任されることはない。自分の分別がその役目を負えない間は、他人の保護と指導の下に置かれる。こうして、精神に病のある者や、知的な障害のある者は、親の指導から解かれない。「まだ理性を持てる年齢に達していない子ども、生来の障害のため決して理性を持てない者、そして第三に、さしあたり自分を導く正しい理性を使うことのできない狂気の状態にある者は、みな、後見人としてその人の利益を求め、実現する他の人々を導く理性を、自らの導き手とする」とフッカーは述べている（『教会統治の法』第一巻第七節）。これは、神と自然が、人間にも他の生き物にも課した、自分の子が自力でやっていけるまで保全する義務にすぎないように見える。親の王としての権威の実例ないし証拠には、ほとんどなりえない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s061",
      "section_id": "ch-06",

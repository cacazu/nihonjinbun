          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:127",
          "printed_page": "243",
          "printed_page_end": "244",
          "source_sequence": 38
        }
      ],
      "source_text": "25. WHether we consider natural Reason, which tells us, that Men, being once born, have a right to their Preservation, and consequently to Meat and Drink, and such other things, as Nature affords for their Subsistence: Or Revelation, which gives us an account of those Grants God made of the World to Adam, and to Noah, and his Sons; 'tis very clear, that God, as K. David says, Psal. CXV. xvj. has given the earth to the Children of men, given it to Mankind in common. But this being supposed, it seems to some a very great difficulty how any one should ever come to have a Property in any thing; I will not content my self to answer, That if it be difficult to make out Property, upon a supposition, That God gave the World to Adam and his Posterity in common; it is impossible that any Man, but one universal Monarch, should have any Property upon a supposition, That God gave the World to Adam, and his Heirs in Succession, exclusive of all the rest of his Posterity. But I shall endeavour to shew, how Men might come to have a Property in several parts of that which God gave to Mankind in common, and that without any express Compact of all the Commoners.",
      "translation_ja": "第25節　自然の理性は、人はいったん生まれた以上、自分を保全する権利を持ち、したがって飲食物をはじめ、暮らしを支えるために自然が与える物を手にする権利があると教える。啓示には、神がアダムに、またノアとその息子たちに世界を授けたことが語られている。どちらから考えても、ダビデ王が言うように、神は地を「人の子らに与えた」、つまり全人類に共有させたのだということは、たいへん明らかだ（『詩篇』115篇16節）。だが、これを前提とすれば、そもそもどうやって人が何かの所有権を得られるのか、ひどく説明しがたいと考える人がいる。神がアダムと子孫に共有させたと仮定するなら、どう所有が成り立つか示すのは難しくても、神がほかの子孫をすべて除いて、アダムと、代々その権利を継ぐ相続人だけに世界を与えたと仮定すれば、世界にただ一人の君主以外の誰も何も所有できない。だが私は、そう答えるだけでは満足しない。神が人類に共有させたもののうち、その一部を人々がどうやってそれぞれ所有するようになりえたのか、しかも共有者全員が明示の取り決めを交わさずにどうしてそれができたのかを、ここで示したい。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s026",
      "section_id": "ch-05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:128",
          "printed_page": "244",
          "printed_page_end": "245",
          "source_sequence": 39
        }
      ],
      "source_text": "26. God, who hath given the World to Men in common, hath also given them reason to make use of it to the best advantage of life, and convenience. The Earth, and all that is therein, is given to Men for the Support and Comfort of their being. And though all the Fruits it naturally produces, and Beasts it feeds, belong to Mankind in common, as they are produced by the spontaneous hand of Nature: and no body has originally a private Dominion, exclusive of the rest of Mankind, in any of them, as they are thus in their natural state: yet being given for the use of Men, there must, of necessity, be a means to appropriate them some way or other before they can be of any use, or at all beneficial to any particular Men. The Fruit, or Venison which nourishes the wild Indian, who knows no Inclosure, and is still a Tenant in common, must be his, and so his, i.e. a part of him, that another can no longer have any right to it, before it can do him any good for the support of his Life.",
      "translation_ja": "第26節　世界を人類に共有させた神は、それを暮らしのためにできるかぎり有利に、便利に使う理性も人々に与えた。大地もそこにあるすべても、人が命をつなぎ、心地よく暮らすようにと与えられている。大地にひとりでに実る果実と、そこで育つ獣はすべて、自然の手がみずから生み出すものだから、人類の共有に属する。自然のままなら、そのどれにも、もとから他の人々を締め出す私的な支配権を持つ人はいない。だが、これらは人が使うために与えられたのであり、誰かの役に立ち、少しでもその人の益になるまでには、何らかの仕方でその人のものとする手立てが、どうしてもなくてはならない。土地の囲い込みを知らず、今も共有の一員として暮らす先住民を養う果実や鹿の肉も、その人の命を支える役に立つより前に、その人だけのものとなり、つまり他人がもはや何の権利も主張できないほどに、その人の一部になるのでなくてはならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s027",
      "section_id": "ch-05",
      "kind": "paragraph",

        }
      ],
      "source_text": "62. Commonwealths themselves take notice of, and allow, that there is a time when Men are to begin to act like Free Men, and therefore, till that time, require not Oaths of Fealty or Allegiance, or other publick owning of, or Submission to the Government of their Countreys.",
      "translation_ja": "第62節　国家も、人には自由人として行動し始めるべき時があることを認め、それを考慮に入れている。だからその時になるまでは、臣従や忠誠の誓いを立てさせたり、自国の政府を公に認めることや、それに従うことを求めたりしない。",

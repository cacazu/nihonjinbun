          "source_sequence": 91
        }
      ],
      "source_text": "75. Thus 'twas easie and almost natural for Children by a tacit and almost natural consent, to make way for the Father's Authority and Government. They had been accustomed in their Child-hood, to follow his Direction, and to refer their little differences to him, and when they were Men, who fitter to rule them? Their little Properties, and less Covetousness, seldom afforded greater Controversies; and when any should arise, where could they have a fitter Umpire, than he, by whose Care they had every one been sustain'd and brought up, and who had a tenderness for them all? 'Tis no wonder that they made no distinction betwixt Minority and full Age, nor looked after one and Twenty, or any other Age, that might make them the free Disposers of themselves and Fortunes, when they could have no desire to be out of their Pupilage. The Government they had been under, during it, continued still to be more their Protection than Restraint: and they could no where find a greater security to their Peace, Liberties, and Fortunes, than in the Rule of a Father.",
      "translation_ja": "第75節　こうして子どもが、暗黙の、ほとんど自然な同意によって、父の権威と統治に道を譲るのは、たやすく、ほとんど自然なことだった。幼いころから父の指示に従い、小さなもめ事を父に持ち込むことに慣れていたのであり、成人したとき、父以上に彼らを治めるのに適した人がいただろうか。わずかな財産しか持たず、欲もそれ以上に乏しかったから、大きな争いはめったに起きなかった。起きたとしても、皆を世話して養い育て、誰にでも優しさを示してきた父以上に、ふさわしい仲裁者をどこに見いだせたろう。まだ養育の下にいるのをやめたい理由がなかったのだから、未成年と成年を区別せず、二十一歳その他の年齢になれば、自分自身や財産を自由に処分できるなどと気にかけなかったとしても不思議ではない。それまで服してきた統治は、拘束というよりは、なおも保護であり続けた。彼らの平穏、自由、財産を守るには、父の統治の内にいる以上に確かなところは、どこにもなかったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s076",
      "section_id": "ch-06",
      "kind": "paragraph",

    {
      "id": "locke-s175",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:204",
          "printed_page": "397",
          "printed_page_end": "398",
          "source_sequence": 212
        }
      ],
      "source_text": "175. THough Governments can originally have no other Rise, than that before mentioned, nor Polities be founded on any thing but the Consent of the People; yet such has been the Disorders, Ambition has fill'd the World with, that in the noise of War, which makes so great a part of the History of Mankind, this Consent is little taken notice of: and therefore many have mistaken the force of Arms for the Consent of the People, and reckon Conquest as one of the Originals of Government. But Conquest is as far from setting up any Government, as demolishing an House is from building a new one in the place. Indeed it often makes way for a new Frame of a Commonwealth, by destroying the former; but, without the Consent of the People, can never erect a new one.",
      "translation_ja": "第175節　政府の起源は先に述べたもののほかにありえず、政治体は人民の同意のほかに何を土台にすることもできない。それでも、野心が世に満たした混乱は甚だしく、人類の歴史の大半を占める戦いの騒がしさにあって、この同意はほとんど顧みられない。そのため多くの人が、武力と人民の同意を取り違え、征服を政府の起源の一つに数えてきた。だが、征服によって政府が設けられるというのは、家を取り壊すことでそこに新しい家が建つというのと同じくらい、実際から遠い。確かに、すでにある国家を滅ぼせば、新しい国家の形への道が開くのはよくあることだ。だが、人民の同意なしに、新しい国家を建てることは決してできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s176",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:205",
          "printed_page": "398",
          "printed_page_end": "400",
          "source_sequence": 213
        }
      ],
      "source_text": "176. That the Aggressor, who puts himself into the state of War with another, and unjustly invades another Man's right, can, by such an unjust War, never come to have a right over the Conquered, will be easily agreed by all Men, who will not think that Robbers and Pyrates have a Right of Empire over whomsoever they have Force enough to master, or that Men are bound by Promises, which unlawful Force extorts from them. Should a Robber break into my House, and with a Dagger at my Throat, make me seal Deeds to convey my Estate to him, would this give him any Title? Just such a Title by his Sword, has an unjust Conquerour, who forces me into Submission. The Injury and the Crime is equal, whether committed by the wearer of a Crown, or some petty Villain. The Title of the Offender, and the Number of his Followers make no difference in the Offence, unless it be to aggravate it. The only difference is, Great Robbers punish little ones to keep them in their Obedience; but the great ones are rewarded with Laurels and Triumphs, because they are too big for the weak hands of Justice, in this World, and have the Power in their own possession which should punish Offenders. What is my Remedy against a Robber that so broke into my House? Appeal to the Law for Justice. But perhaps Justice is deny'd, or I am crippled and cannot stir; Robbed and have not the means to do it. If God has taken away all means of seeking remedy, there is nothing left but Patience. But my Son, when able, may seek the Relief of the Law, which I am denyed: he or his Son may renew his Appeal, till he recover his Right. But the Conquered, or their Children, have no Court, no Arbitrator on Earth to appeal to. Then they may appeal, as Iephtha did, to Heaven, and repeat their Appeal, till they have recovered the native Right of their Ancestours, which was, to have such a Legislative over them, as the Majority should approve, and freely acquiesce in. If it be objected, this would cause endless trouble; I answer, No more than Justice does, where she lies open to all that appeal to her. He that troubles his Neighbour, without a Cause, is punished for it, by the Justice of the Court he appeals to. And he that appeals to Heaven, must be sure he has Right on his side: and a Right too that is worth the Trouble and Cost of the Appeal, as he will answer at a Tribunal that cannot be deceived, and will be sure to retribute to every one according to the Mischiefs he hath created to his Fellow-Subjects; that is, any part of Mankind. From whence 'tis plain, that he that conquers, in an unjust War, can thereby have no Title to the Subjection and Obedience of the Conquered.",
      "translation_ja": "第176節　相手との戦争状態に入り、不正に他人の権利を侵した攻撃者は、そのような不正な戦争によって征服した相手に対する権利を決して持てない。このことは、力で屈服させられる相手なら誰にでも、強盗や海賊は支配権を持つとか、不法な力が無理に取りつけた約束が人を拘束するとか考えない人には、たやすく認められるだろう。強盗が私の家に押し入り、喉もとに短剣を突きつけて、財産を譲る証書に印を押させたとして、それで何かの権原を得られるだろうか。不正な征服者が武力で私を服従させて得る権原も、まさにこれと同じだ。行ったのが王冠をかぶる人であろうと、どこかの小悪党であろうと、加害も罪も等しい。犯人の肩書や従う者の数は、罪を重くすることはあっても、罪に違いは作らない。違いはただ、大盗賊が小盗賊を罰して従わせるのに、大盗賊の方は月桂冠と凱旋で報われることだ。この世の正義の手は、それをつかまえるには弱すぎる。本来なら悪事を罰するはずの力を、彼ら自身が握っているからである。家にこうして押し入った強盗に対し、私にはどんな救済があるか。正義を求め、法に訴えることである。しかし正しい裁きを得られないかもしれない。私が負傷して動けず、財産を奪われ、訴える手立てがないかもしれない。神が救済を求める手立てをすべて取り去ったなら、耐えるほかにない。だが私の息子が、できるようになったとき、私には拒まれた法の救済を求めてもよい。私の息子か孫が、権利を取り戻すまで、訴えを繰り返してよい。これに対して、征服された人々やその子どもには、この世に訴える裁判所も仲裁人もいない。そのときは彼らも、エフタと同じように天に訴え、先祖に本来あった権利、すなわち多数者が認め、自由に従う立法機関を自分たちの上に置く権利を取り返すまで、訴えを重ねてよい。これは際限なく争いを呼ぶという異議があれば、訴える者すべてに門を開いた裁判が争いを招くのと、少しも変わらないと答えよう。理由もなく隣人を煩わせる者は、自ら訴えた裁判所の正義によって罰せられる。天に訴える者は、道理が自分の側にあり、しかも訴えの労や費用に見合う権利であることを、確かめておかなければならない。決して欺かれず、同じ臣民、つまり人類の誰かに及ぼした害に応じて、誰にも必ず報いる法廷で、申し開きするのだから。不正な戦争に勝った者には、それによって、征服された人の従属や服従を求める権原が少しもないのは明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s177",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:206",
          "printed_page": "400",
          "source_sequence": 214
        }
      ],
      "source_text": "177. But, supposing Victory favours the right side, let us consider a Conquerour in a lawful War, and see what Power he gets, and over whom.",
      "translation_ja": "第177節　だが、正しい側に勝利がもたらされたとしよう。正当な戦争をした征服者が、誰に対してどんな力を得たのかを考えてみよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s177-p01",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:206",
          "printed_page": "400",
          "printed_page_end": "401",
          "source_sequence": 215
        }
      ],
      "source_text": "First, 'Tis plain he gets no Power by his Conquest over those that Conquered with him. They that fought on his side cannot suffer by the Conquest, but must, at least, be as much Free-men as they were before. And most commonly they serve upon Terms, and on Condition to share with their Leader, and enjoy a part of the Spoil, and other Advantages that attend the conquering Sword: Or, at least, have a part of the subdued Countrey bestowed upon them. And the conquering People, are not, I hope, to be Slaves by Conquest, and wear their Laurels only to shew they are Sacrifices to their Leader's Triumph. They that found Absolute Monarchy upon the Title of the Sword, make their Heroes, who are the Founders of such Monarchies, arrant Draw-can-Sirs, and forget they had any Officers and Souldiers that fought on their side, in the Battles they won, or assisted them in the subduing, or shared in possessing the Countries they Master'd. We are told by some, that the English Monarchy is founded in the Norman Conquest, and that our Princes have thereby a Title to absolute Dominion: which if it were true, (as by the History it appears otherwise) and that William had a right to make War on this Island; yet his Dominion by Conquest, could reach no farther than to the Saxons and Britans, that were then Inhabitants of this Country. The Normans that came with him, and helped to Conquer, and all descended from them are Freemen, and no Subjects by Conquest; let that give what Dominion it will. And if I, or any Body else, shall claim freedom, as derived from them, it will be very hard to prove the contrary: And 'tis plain, the Law that has made no distinction between the one and the other, intends not there should be any difference in their Freedom or Priviledges.",
      "translation_ja": "第一に、共に征服した者に対しては、征服による力を何も得ないことが明らかだ。征服者の側で戦った人々が征服で不利益を受けるはずはなく、少なくとも以前と同じだけ自由人でなくてはならない。たいていは、指揮官とともに戦利品や、勝利に伴うその他の利益の一部を分かち持つ条件で仕える。少なくとも征服した国の一部を与えられる。まさか、征服した人々が征服によって奴隷となり、月桂冠をかぶるのも、自分が指揮官の凱旋に供えられた犠牲だと示すためにすぎない、というのではあるまい。絶対君主政を武力の権原に基づかせる人々は、その君主国を建てた英雄たちを、まるで何もかも一人で征服した芝居がかりの豪傑にしてしまう。勝った戦いで彼らと同じ側に立って戦った将校と兵士、国を従わせるのに協力した者や、手に入れた国の所有を分け合った者がいたことを、忘れているのだ。イングランドの君主政はノルマン征服に基づき、私たちの君主たちは、それによって絶対的に支配する権原を得たと言う人がいる。仮にそうであり、ウィリアムにこの島に戦いを仕掛ける権利があったとしても（歴史を見ると、そうではなかったと分かる）、征服によるウィリアムの支配は、当時この国にいたサクソン人とブリトン人よりほかには及びえない。彼と共に来て、征服を助けたノルマン人とその子孫は、すべて自由人で、征服による臣民ではない。征服によってどんな支配が得られたにせよ、そうである。私でもほかの人でも、ノルマン人の子孫として自分の自由を主張すれば、その反対を証明するのはきわめて難しい。いずれの出身も区別しなかった法は、両者の自由や特権に違いを設けるつもりがなかったのも明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s178",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:206",
          "printed_page": "401",
          "printed_page_end": "402",
          "source_sequence": 216
        }
      ],
      "source_text": "178. But supposing, which seldom happens, that the Conquerers and Conquer'd never incorporate into one People, under the same Laws and Freedom. Let us see next, what Power a lawful Conquerer has over the subdued, and that I say is purely Despotical. He has an Absolute Power over the Lives of those, who, by an unjust War, have forfeited them; but not over the Lives or Fortunes of those, who ingaged not in the War, nor over the Possessions even of those who were actually engaged in it.",
      "translation_ja": "第178節　ところで、めったにないことだが、征服する側と征服された側が、同じ法と自由の下で一つの国民にまとまらなかったとしよう。次に、正当な征服者が屈服した側に対してどんな力を持つかを見よう。私の考えでは、これは純粋な専制権である。不正な戦争によって命を失ういわれを自ら作った者の命に対しては、絶対的な力がある。だが、戦争に加わらなかった者の命や財産には及ばず、現に加わった者に対してさえ、その所有物には及ばない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s179",
      "section_id": "ch-16",

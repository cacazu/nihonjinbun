      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:161",
          "printed_page": "310",
          "source_sequence": 110
        }
      ],
      "source_text": "To take away all such mutual Grievances, Injuries and Wrongs, i. e. such as attend Men in the state of Nature. There was no way but only by growing into Composition and Agreement amongst themselves by ordaining some kind of Government publick, and by yielding themselves subject thereunto, that unto whom they granted Authority to rule and govern: by them the Peace, Tranquillity, and happy Estate of the rest might be procured. Men always knew that where Force and Injury was offered, they might be Defenders of themselves; they knew that however Men may seek their own Commodity; yet if this were done with Injury unto others, it was not to be suffered, but by all Men, and all good means to be withstood. Finally, they knew that no Man might, in reason, take upon him to determine his own Right, and according to his own Determination proceed in maintenance thereof, in as much as every man is towards himself, and them whom he greatly affects, partial; and therefore, that Strifes and Troubles would be endless, except they gave their common Consent, all to be ordered by some, whom they should agree upon, without which Consent, there would [?]e no reason that one man should take upon him to be Lord or Iudge over another. Hooker's Eccl. Pol. l. 1. §. 10.",
      "translation_ja": "「人々が互いにこのような苦情や加害や不正、つまり自然状態の人につきまとうものを取り除く方法は、ただ一つだった。何らかの公の政府を設け、自らその政府に従って、治め、導く権威を与えられた者が、残りの人々に平和と平穏、そして幸福な境遇をもたらすよう、互いに和解し合意していくことである。人々は昔から、暴力を向けられ、害が加えられれば、自分を守ってよいと知っていた。人がどう自分の利益を求めようと、それによって他人が害を受けるなら、許すべきでなく、すべての人が、正当なあらゆる手立てでこれに抗すべきであることも知っていた。最後に、人は誰でも、自分と、自分が大いに心を寄せる者に偏るため、自分で自分の権利を決め、自分の決定に従ってそれを守ろうとするのは、道理に合わないと知っていた。だから、皆で選んだ人々の裁定に全員が従うと同意しなければ、争いと苦しみに終わりはなかったであろう。この同意なくしては、ある人が他人に対し、主人や裁判官を名乗る理由はない。」フッカー『教会統治の法』第一巻第十節。",
      "translation_status": "reviewed",
      "source_variants": [

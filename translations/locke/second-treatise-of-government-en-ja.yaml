      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:208",
          "printed_page": "405",
          "printed_page_end": "406",
          "source_sequence": 220
        }
      ],
      "source_text": "182. But because the miscarriages of the Father are no faults of the Children, and they may be rational and peaceable, notwithstanding the brutishness and injustice of the Father; the Father, by his miscarriages and violence, can forfeit but his own Life, but involves not his Childten in his guilt or destruction. His goods which nature, that willeth the preservation of all Mankind as much as is possible, hath made to belong to the Children to keep them from perishing, do still continue to belong to his Children. For supposing them not to have join'd in the War, either through infancy or choice, they have done nothing to forfeit them, nor has the Conquerour any right to take them away, by the bare right of having subdued him that by force attempted his destruction, though perhaps he may have some right to them to repair the dammages he has sustained by the War, and the defence of his own right, which how far it reaches to the possessions of the Conquer'd, we shall see by and by; so that he that by Conquest has a right over a Mans Person, to destroy him if he pleases, has not thereby a right over his Estate to possess and enjoy it. For it is the brutal force the Aggressor has used, that gives his Adversary a right to take away his Life, and destroy him, if he pleases, as a noxious Creature; but 'tis damage sustain'd that alone gives him title to another Mans Goods: For though I may kill a Thief that sets on me in the Highway, yet I may not (which seems less) take away his money, and let him go; this would be Robbery on my side. His force, and the state of War he put himself in, made him forfeit his Life, but gave me no title to his Goods. The right then of Conquest extends only to the Lives of those who join'd in the War, but not to their Estates, but only in order to make reparation for the damages received, and the Charges of the War, and that too with reservation of the right of the innocent Wife and Children.",
      "translation_ja": "第182節　しかし、父の過ちは子の罪ではなく、父が獣同然で不正であっても、子らは理性を備え、平和に暮らすことがある。だから父が自らの過ちと暴力で失うのはただ自分の命だけで、子どもたちをその罪や破滅に巻き込むことはできない。人類をできるかぎり一人残らず保全しようとする自然は、父の財物を、子らが滅びないように子らに属するものとした。その財物は、引き続き子らに属する。子どもたちが、幼さのためであれ自分で選んでであれ、戦争に加わらなかったとすれば、財物を失うべきことは何もしていない。征服者にも、力で自分を滅ぼそうとした者を降伏させたというだけの権利で、財物を取り上げる権利はない。もっとも、自らの権利を守るために戦った戦争で被った損害を償わせるために、いくらかの権利があるかもしれない。それが征服された者の財産のどこまで及ぶかは、このあと見ていこう。したがって、征服によって、ある人の身に対し、望めば命を奪える権利を持つからといって、その人の土地や財産を所有し、享受する権利を持つことにはならない。相手と争う者に、その攻撃者を有害な生き物として、望めば命を奪い滅ぼす権利を与えるのは、攻撃者の用いた獣のような力である。だが、他人の財物への権原を与えるのは、ただ実際に被った損害だけである。街道で襲いかかる盗人の命を奪うことは許されても、いかにもそれより軽く見えるが、金だけ奪ってその者を放免するのは許されない。それは、私の側の強盗になる。盗人は力を用いて戦争状態に入ったことで、自分の命を失ういわれを作った。だからといって、私に財物を取る権原を与えたのではない。それゆえ征服の権利は、戦争に加わった者の命にしか及ばず、財産には及ばない。ただし、受けた損害と戦争の費用を償うためなら別であり、それも、罪のない妻と子の権利を損なわないかぎりである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s183",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:209",
          "printed_page": "406",
          "printed_page_end": "407",
          "source_sequence": 221
        }
      ],
      "source_text": "183. Let the Conquerer have as much Justice on his side as could be suppos'd, he has no right to seize more than the vanquish'd could forfeit; his Life is at the Victors Mercy, and his service and goods he may appropriate to make himself reparation; but he cannot take the goods of his Wife and Children, they too had a title to the goods he enjoy'd, and their shares in the estate he possessed. For Example, I in the state of nature (and all Commonwealths are in the state of nature one with another) have injured another Man, and refusing to give satisfaction, it is come to a state of War, wherein my defending by force, what I had gotten unjustly, makes me the Aggressour; I am conquered: my Life, 'tis true, as forfeit, is at mercy, but not my Wives and Childrens. They made not the War, nor assisted in it. I could not forfeit their Lives, they were not mine to forfeit. My Wife had a share in my Estate, that neither could I forfeit. And my Children also, being born of me, had a right to be maintain'd out of my Labour or Substance. Here then is the Case; The Conquerour has a Title to Reparation for Damages received, and the Children have a Title to their Father's Estate for their Subsistence. For as to the Wife's share, whether her own Labour or Compact gave her a Title to it, 'tis plain, her Husband could not forfeit what was hers. What must be done in the case? I answer; The Fundamental Law of Nature being, that all, as much as may be, should be preserved, it follows, that if there be not enough fully to satisfie both, viz. for the Conquerour's Losses, and Childrens Maintenance, he that hath, and to spare, must remit something of his full Satisfaction, and give way to the pressing and preferible Title of those, who are in danger to perish without it.",
      "translation_ja": "第183節　征服者の側が、考えられるかぎり正しかったとしても、敗者が自ら失いうる以上のものを押収する権利はない。敗者の命は勝者の情けに委ねられ、その働きと財物は、勝者が償いとして自分のものとすることができる。しかし妻と子の財物を奪うことはできない。彼らにも、敗者が享受していた物への権原があり、敗者の財産には、その人たちの取り分があったからだ。たとえば、自然状態で（国家はすべて互いに自然状態にある）、私が他人に害をなし、償いを拒み、戦争状態となったとしよう。不正に得たものを力で守る私は、攻撃者である。そして私は敗れた。確かに私は命を失ういわれを作り、命は勝者の情け次第である。だが、妻子の命はそうではない。彼らは戦争を始めず、助けもしなかった。彼らの命は、私が失わせられるものではなかった。私の妻は私の財産に取り分があったが、それも私には失わせられなかった。また子らは、私から生まれたのだから、私の労働や財産から扶養される権利があった。さて、こういう場合である。征服者には受けた損害の償いへの権原があり、子らには、自分の暮らしを支えるため、父の財産への権原がある。妻の取り分については、自分の労働であれ取り決めであれ、そこから権原を得ていたのなら、妻のものを夫が失わせられなかったのは明らかである。この場合どうすべきか。私はこう答えよう。すべての人ができるかぎり保全されるべきだというのが、自然の根本法である。すると、征服者の損害を償い、子どもの暮らしを支えるための両方を満たせない場合には、自分の分があり、なお余裕のある者が、十分な償いの一部を免除し、それがなければ滅びるおそれのある人の、より切迫し、優先すべき権原に道を譲らなければならない。",
      "translation_status": "reviewed"
    },

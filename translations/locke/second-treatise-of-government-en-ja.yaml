      "source_text": "AN ESSAY Concerning the True Oringinal, Extent and End OF CIVIL GOVERNMENT.",
      "translation_ja": "市民政府の真の起源、その権限の範囲と目的についての論考",
      "translation_status": "reviewed"
    },
    {

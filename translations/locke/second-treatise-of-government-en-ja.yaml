      "source_text": "229. The end of Government is the good of Mankind, and which is best for Mankind, that the People should be always expos'd to the boundless will of Tyranny, or that the Rulers should be sometimes liable to be oppos'd, when they grow exorbitant in the use of their Power, and imploy it for the destruction, and not the preservation of the Properties of their People?",
      "translation_ja": "第229節　政府の目的は人類の利益である。では、人類にとってどちらがよいだろうか。人民がいつまでも圧政の際限ない意志にさらされていることか、それとも統治者の権力行使が度を越し、人民の財産を保全するのでなく、壊すために使うときには、ときどき抵抗を受けうることであろうか。",
      "translation_status": "reviewed"

      "source_text": "40. Nor is it so strange as perhaps before consideration it may appear, that the Property of labour should be able to overballance the Community of Land. For 'tis labour indeed that puts the difference of value on every thing; and let any one consider, what the difference is between an Acre of Land planted with Tabaco, [?]r Sugar, sown with Wheat or Barley; and an Acre of the same Land lying in common, without any Husbandry upon it; and he will find, that the improvement of labour makes the far greater part of the value. I think it will be but a very modest Computation to say, that of the Products of the Earth useful to the Life of Man 9/10 are the eff[?]cts of labour: nay, if we will rightly estimate things as they come to our use, and cast up the several expences about them, what in them is purely owing to Nature, and what to labour, we shall find, that in most of them 99/100 are wholly to be put on the account of labour.",
      "translation_ja": "第40節　労働が個人のものだということが、土地が共有であることにまさりうるのも、考えてみれば、初めに感じるほど不思議ではない。何であれ物の値打ちに差をつけるのは、実に労働だからである。一エーカーの土地にタバコやサトウキビを植え、小麦や大麦をまいたときと、まったく同じ土地を何も耕さず共有地のままにしておくときとを比べてみればよい。値打ちの圧倒的な部分を生み出すのは、労働によって手が加えられることだと分かるだろう。人の暮らしに役立つ大地の産物のうち、十分の九は労働の成果だと言っても、私はかなり控えめな見積もりだと思う。それどころか、物が手もとに来て使われる時点で、かかった費用を一つずつ数え上げ、そのうち何が自然だけによるのか、何が労働によるのかを適切に見積もれば、たいていの物で百分の九十九が、まるごと労働の勘定に入ると分かる。",

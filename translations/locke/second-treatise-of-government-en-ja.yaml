      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:147",
          "printed_page": "282",
          "printed_page_end": "284",
          "source_sequence": 80
        }
      ],
      "source_text": "65. Nay this power so little belongs to the Father, by any peculiar right of Nature, but only as he is Guardian of his Children, that when he quits his Care of them, he loses his power over them, which goes along with their Nourishment and Education, to which it is inseparably annexed, and belongs as much to the Foster-Father of an exposed Child, as to the Natural Father of another. So little power does the bare act of begetting give a Man over his Issue: if all his Care ends there, and this be all the Title he hath to the Name and Authority of a Father: and what will become of this Paternal Power in that part of the World where one Woman hath more than one Husband at a time? Or in those parts of America, where, when the Husband and Wife part, which happens frequently, the Children are all left to the Mother, follow her, and are wholly under her Care and Provision? And if the Father die whilst the Children are young, do they not naturally every where owe the same Obedience to their Mother, during their Minority, as to their Father, were he alive? And will any one say, that the Mother hath a legislative Power over her Children; that she can make standing Rules, which shall be of perpetual Obligation, by which they ought to regulate all the Concerns of their Property, and bound their Liberty all the course of their Lives, and inforce the observation of them with Capital Punishments? For this is the proper power of the Magistrate, of which the Father hath not so much as the shadow. His Command over his Children, is but temporary, and reaches not their Life or Property. It is but a help to the weakness and imperfection of their Non-age; a Discipline necessary to their Education: and though a Father may dispose of his own Possessions, as he pleases, when his Children are out of danger of perishing for want; yet his power extends not to the lives or goods, which either their own industry, or anothers bounty, has made theirs; nor to their liberty neither, when they are once arrived to the infranchisement of the years of discretion. The Father's Empire then ceases, and he can from thence forwards no more dispose of the liberty of his Son than that of any other Man. And it must be far from an absolute, or perpetual Jurisdiction, from which a Man may withdraw himself, having Licence from Divine Authority, to leave Father and Mother, and cleave to his Wife.",
      "translation_ja": "第65節　いや、父がこの権力を持つのは、父だけに備わる自然の権利によってではなく、子どもを養い導く者であることによってにすぎない。それほどだから、子の世話をやめれば、この権力を失う。この権力は養育と教育についてまわり、そこから切り離せない。捨てられた子を引き取って育てる父にも、わが子を育てる実の父と同じだけ属する。自分からの世話が子をもうけたところで終わり、父の名と権威を持つ根拠がほかにないのなら、子をもうけただけで父が子に対して持つ力は、まるで取るに足りないのである。一人の女性が同時に何人もの夫を持つ世界の一角では、この父権はどうなるのか。アメリカの地方では、夫婦が別れることがよくあり、そのとき子はみな母のもとに残され、母について行き、もっぱら母の世話と扶養を受けるというが、そこではどうなるのか。また、子どもが幼いあいだに父が死ねば、未成年のあいだ、父が生きていたなら父に果たしたのと同じ服従を、当然どこでも母に果たすのではないか。それなら誰か、母は子に対して立法権を持つ、それゆえ永久に子を拘束する規則を定め、これで子の財産に関わる一切を律し、生涯にわたりその自由を制限し、死刑まで科してこれを守らせられる、と言うだろうか。それは公職にある者に固有の権力であって、父にはその影すらない。子に命じる力は一時的であり、子の命や財産までは及ばない。未成年の弱さや未熟さを補うものであって、教育に必要なしつけにすぎない。子が物に事欠いて死ぬ心配がないなら、父は自分の持ち物を意のままに処分できる。だが、子の命や、自らの勤勉や他人の好意で子自身のものとなった財物に、父の権力は及ばない。分別のある年齢になって自由を得れば、子の自由にも及ばない。このとき父の支配は終わり、父はその後、他人の自由を左右できないのと同じく、子の自由を左右できない。神の許しを得て、父母を離れ、妻と結ばれることのできる者が抜け出せるような権限は、絶対的、永続的な権限とはおよそかけ離れている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s066",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

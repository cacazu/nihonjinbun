          "printed_page": "309",
          "source_sequence": 108
        }
      ],
      "source_text": "The publick Power of all Society is above every Soul contained in the same Society; and the principal use of that power is to give Laws unto all that are under it, which Laws in such Cases we must obey, unless there be reason shew'd which may necessarily inforce, that the Law of Reason, or of God, doth injoin the contrary, Hook. Eccl. Pol. 1. §. 16.",
      "translation_ja": "「どんな社会でも、公の権力はその社会の一人ひとりの上にある。その権力の主な使い道は、その下にいるすべての者に法を与えることである。そうしたときには、その法に従わなければならない。ただし、理性の法または神の法が逆のことを命じていると、認めざるをえないだけの理由が示されるなら別である。」フッカー『教会統治の法』第一巻第十六節。",
      "translation_status": "reviewed"

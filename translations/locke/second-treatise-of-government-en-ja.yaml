      ],
      "source_text": "12. By the same reason, may a Man in the State of Nature punish the lesser breaches of that Law; It will perhaps be demanded with death? I answer each transgression, may be punished to that Degree, and with so much Severity as will suffice to make it an ill bargain to the Offender, give him Cause to repent, and terrifie others from doing the like: Every Offence that can be committed in the State of Nature, may in the State of Nature, be also punished, equally, and as far forth, as it may, in a Common-wealth; for though it would be besides my present purpose, to enter here into the particulars of the Law of Nature, or its measures of punishment[?]; yet, it is certain there is such a Law and that too, as intelligible and plain to a rational Creature, and a Studier of that Law, as the positive Laws of Common-wealths, nay possibly plainer; As much as reason is easier to be understood, then the Phansies and intricate Contrivances of Men, following contrary and hidden interests put into Words; For truly, so are a great part of the municipal Laws of Countries, which are only so far Right, as they are founded on the Law of Nature, by which they are to be regulated and interpreted.",
      "translation_ja": "第12節　同じ理由から、自然状態では、この法へのそれほど重くない違反を罰することもできる。死刑にもできるのか、と聞かれるかもしれない。私の答えはこうである。罪ごとに、犯人に割に合わないと思わせ、悔いさせ、ほかの者にも恐れて同じことを控えさせるのに十分な程度と厳しさで罰することができる。自然状態で犯しうるどんな罪も、国家において罰せられるのと同じように、同じ限度まで、自然状態で罰することができる。ここで自然法の細かな条項や、刑罰の度合いにまで立ち入るのは本論の目的ではない。だが、確かにそのような法はある。理性を持つ者やこの法を学ぶ者には、国家の実定法と同じだけ理解しやすく明瞭であり、おそらくはそれ以上に明瞭だ。理性は、互いに相いれない隠れた利害を追う人たちの思いつきや、入り組んだ工夫を言葉にして並べたものより、それだけ分かりやすい。実際、各国の国内法の多くはそうしたものであり、その規準となり解釈を導く自然法に立脚しているかぎりにおいてのみ、正しいのである。",

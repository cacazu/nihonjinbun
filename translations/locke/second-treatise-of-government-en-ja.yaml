      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:158",
          "printed_page": "305",
          "printed_page_end": "306",
          "source_sequence": 104
        }
      ],
      "source_text": "87. Man being born, as has been proved, with a title to perfect freedom, and an uncontrouled enjoyment of all the Rights and Priviledges of the Law of Nature, equally with any other Man, or number of Men in the World, hath by nature a power, not only to preserve his Property, that is, his Life, Liberty and Estate, against the injuries and attempts of other men; but to judge of and punish the breaches of that Law in others, as he is perswaded the offence deserves, even with death it self, in Crimes where the heinousness of the fact, in his opinion, requires it. But because no political Society can be, nor subsist without having in it self the power to preserve the property, and in order thereunto, punish the offences of all those of that Society; There, and there only is political Society, where every one of the Members hath quitted this natural Power, refign'd it up into the hands of the Community in all cases that exclude him not from appealing for protection to the law established by it. And thus all private judgment of every particular Member being excluded, the Community comes to be Umpire; and by understanding indiff[??]ent rules and men authorised by the community for their execution, decides all the differences that may happen between any Members of that Society, concerning any matter of right, and punishes those offences which any member hath committed against the Society with such penalties as the law has established; whereby it is easy to discern who are, and are not, in political Society together. Those who are united into one Body, and have a common establish'd Law and Judicature to appeal to, with Authority to decide Controversies between them, and punish Offenders, are in civil Society one with another; but those who have no such common Appeal, I mean on Earth, are still in the state of Nature, each being where there is no other, Judge for himself, and Executioner; which is, as I have before shew'd it, the perfect state of Nature.",
      "translation_ja": "第87節　すでに証明したように、人は完全な自由への権原を持って生まれ、世界中の誰とも、また何人の集まりとも等しく、自然法が認めるすべての権利と特権を妨げられることなく享受できる。だから人は、自分の財産、すなわち生命と自由と所有物を、他人の加害や企てから守る力を自然に持つだけでなく、他人による自然法違反を裁き、その罪にふさわしいと確信するだけの罰を科す力を持つ。犯行が凶悪で、死刑が必要だと判断するなら、死刑でも罰しうる。しかし、政治社会は、財産を守る力、またそのために社会の成員すべての違反を処罰する力を自ら持たなければ、成り立つことも存続することもできない。したがって、各成員がこの自然の力を手放し、共同体が定めた法に保護を求められるすべての場合について、その力を共同体の手に委ねているところにだけ、政治社会がある。こうして各成員の私的な判断が退けられ、共同体が裁定者となる。公平な規則を心得、その執行を共同体から委ねられた者を通じて、どんな権利の問題であれ、その社会の成員間に生じる争いをすべて裁き、成員が社会に対して犯した違反を、法の定めた刑罰によって罰する。これによって、誰が一緒に政治社会の内にいるか、誰がそうでないかが見分けやすくなる。一つの集団にまとまり、訴えを受け、争いを裁き、違反者を罰する権限を備えた共通の法と裁判機関を確立している者同士は、市民社会の内にいる。しかしこの世にそうした共通の訴え先のない人々は、なお自然状態にある。ある事件にほかの裁き手がいないとき、自分で裁き、自分で執行することになる。これこそ、先に示したとおり、完全な自然状態である。",
      "translation_status": "reviewed",

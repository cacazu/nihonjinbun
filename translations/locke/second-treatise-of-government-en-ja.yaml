    {
      "id": "locke-s105",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:168",
          "printed_page": "324",
          "printed_page_end": "325",
          "source_sequence": 127
        }
      ],
      "source_text": "105. I will not deny, that if we look back, as far as History will direct us, towards the Original of Commonwealths, we shall generally find them under the Government and Administration of one Man. And I am also apt to believe, that where a Family was numerous enough to subsist by it self, and continued entire together, without mixing with others, as it often happens; where there is much Land, and few People, the Government commonly began in the Father. For the Father having, by the Law of Nature, the same Power, with every Man else, to punish, as he thought fit, any Offences against that Law, might thereby punish his transgressing Children, even when they were Men, and out of their Pupilage; and they were very likely to submit to his punishment, and all join with him against the Offender in their turns, giving him thereby power to Execute his Sentence against any transgression, and so in effect make him the Law-maker and Governour over all that remained in Conjunction with his Family. He was fittest to be trusted; Paternal affection secured their Property and Interest under his Care, and the Custom of obeying him in their Childhood, made it easier to submit to him rather than any other. If therefore they must have one to rule them, as Government is hardly to be avoided amongst Men that live together; who so likely to be the Man as he that was their common Father, unless Negligence, Cruelty, or any other defect of Mind or Body, made him unfit for it. But when either the Father died, and left his next Heir for want of Age, Wisdom, Courage, or any other qualities less fit for Rule, or where several Families met and consented to continue together: There, 'tis not to be doubted, but they used their natural freedom to set up him whom they judged the ablest and most likely to Rule well over them. Conformable hereunto we find the People of America, who living out of the reach of the Conquering Swords and spreading domination of the two great Empires of Peru and Mexico, enjoy'd their own natural freedom; though, caeteris paribus, they commonly prefer the Heir of their deceased King; yet if they find him any way weak or uncapable, they pass him by, and set up the stoutest and bravest Man for their Ruler.",
      "translation_ja": "第105節　歴史が導いてくれるかぎり国家の起源へとさかのぼれば、一般に、治め導くのは一人の人だったと分かることを、私は否定しない。土地が広く人の少ないところで、一つの家の人数が自分たちだけで暮らせるほど多く、他と交わらず一家そろって暮らし続けることはよくある。そんな場合、まず父に統治の力があったのが普通だろうとも思う。父にも生まれながら、自然法に反した行為をふさわしいと思う程度で罰する、誰もが持つのと同じ力があった。だから、子が成長して養育を終えていても、違反した子を罰することができた。子らは罰に従う見込みが高く、順に誰かが違反をすれば、皆が父に加勢することもあったろう。こうして父に、どんな違反についても判決を執行する力を与え、事実上、なお一家と共に暮らしている者すべての立法者かつ統治者としたのである。父こそ信頼を置くのにふさわしかった。父親の愛情のおかげで、その世話のもとに財産と利害の安全が保たれた。幼いときから従ってきたので、他人より父に従う方が自然だった。共に暮らす人々に統治が不可避に近く、誰か一人を立てなくてはならないなら、不注意や残酷さ、また心身の何かの弱点のために適さないのでないかぎり、皆の父以上に選ばれそうな人がいただろうか。しかし父が亡くなって、次の相続人が年齢、知恵、勇気その他の資質を欠いて治めるのに適さなかったとき、あるいはいくつもの家が集まって一緒に暮らし続けることに同意した場合には、誰が最も有能で、その上に立ってよく治めてくれそうかを自ら判断し、その人を立てる自然の自由を行使したことは疑いない。それにかなう例が、ペルーとメキシコの二大帝国の征服と、その勢力の及ぶところの外に住んで、自然の自由を享受していたアメリカの人々に見られる。他の条件が等しければ、亡くなった王の相続人を優先するのが普通だったが、その者に何か弱点があったり統治できなかったりすると判断すれば、その者を飛び越え、最も強く勇敢な人を統治者に立てたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s106",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

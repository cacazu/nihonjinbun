      "source_text": "CHAP. VII. Of Political or Civil Society.",
      "translation_ja": "第七章　政治社会、すなわち市民社会について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s077",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:154",
          "printed_page": "297",
          "source_sequence": 94
        }
      ],
      "source_text": "77. GOD having made Man such a creature, that, in his own Judgment, it was not good for him to be alone, put him under strong Obligations of Necessity, Convenience, and Inclination, to drive him into Society, as well as fitted him with Understanding and Language to continue and enjoy it. The first Society was betwen Man and Wife, which gave beginning to that between Parents and Children; to which, in time, that between Master and Servant came to be added: and though all these might, and commonly did meet together, and make up but one Family, wherein, the Master or Mistriss of it had some sort of Rule, proper to a Family; each of these, or all together came short of Political Society, as we shall see if we consider the different Ends, Ties, and Bounds of each of these.",
      "translation_ja": "第77節　神は、人が一人でいるのはよくないとみずから判断し、必要、暮らしの便宜、そして人の性向によって社会へと強く向かう生き物に人を造った。それとともに、社会を維持し、そこで暮らす利益を得られるよう、人に知性と言語を備えた。初めの社会は男女が夫婦として結ぶものであった。そこから親と子のあいだの社会が始まり、時が経つと、主人と使用人のあいだの社会が加わった。こうした関係はみな一つに合わさり、一家を成すことができ、実際にもそうなるのが普通だった。家の主人か女主人は、その中で家庭にふさわしいある種の支配を行った。それでも、こうした関係は、一つずつ取り上げても、すべてを合わせても、政治社会には至らない。それぞれの目的と結びつきと限界の違いを考えれば、分かるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s078",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:154",
          "printed_page": "297",
          "printed_page_end": "298",
          "source_sequence": 95
        }
      ],
      "source_text": "78. Conjugal Society is made by a voluntary compact between Man and Woman, and though it consist chiefly in such a Communion and Right in one anothers Bodies, as is necessary to its chief End, Procreation; yet it draws with it mutual Support and Assistance; and a Communion of Interests too, as necessary, not only to unite their Care and Affection, but also necessary to their common Off-spring, who have a Right to be nourished and maintained by them, till they are able to provide for themselves.",
      "translation_ja": "第78節　夫婦の社会は、男女の自発的な取り決めによって成り立つ。主として、主な目的である子をもうけることに必要な、身体の交わりと互いの身体についての権利から成る。だが、それとともに、互いに支え助け合い、利益を分かち合うことも伴う。それは二人が気遣いや愛情を合わせるために欠かせないだけでなく、二人の子を育てるうえでも欠かせない。子には、自分で暮らしを立てられるようになるまで、二人に養い支えられる権利があるからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s079",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:155",
          "printed_page": "298",
          "printed_page_end": "299",
          "source_sequence": 96
        }
      ],
      "source_text": "79. For the end of conjunction between Male and Female, being not barely Procreation, but the continuation of the Species. This conjunction betwixt Male and Female ought to last, even after Procreation, so long as is necessary to the nourishment and support of the young Ones, who are to be sustained by those that got them, till they are able to shift and provide for themselves. This Rule, which the Infinite wise Maker hath set to the Works of his hands, we find, the inferiour Creatures steadily obey. In those viviparous Animals, which feed on Grass, the conjunction between Male and Female lasts no longer than the very Act of Copulation; because the Teat of the Dam being sufficient to nourish the Young, till it be able to feed on Grass: the Male only begets, but concerns not himself for the Female or Young, to whose Sustenance he can contribute nothing. But in Beasts of Prey the conjunction lasts longer; because the Dam not being able well to subsist her self, and nourish her numerous Off-spring, by her own Prey alone, a more laborious, as well as more dangerous way of living, than by feeding on Grass: the Assistance of the Male is necessary to the Maintenance of their common Family, which cannot subsist, till they are able to prey for themselves, but by the joint Care of Male and Female. The same is to be observed in all Birds (except some domestick ones, where plenty of food excuses the Cock from feeding, and taking care of the young Brood) whose Young needing Food in the Nest, the Cock and Hen continue Mates till the Young are able to use their wing, and provide for themselves.",
      "translation_ja": "第79節　雄と雌が結びつく目的は、ただ子をもうけることだけでなく、種を存続させることにある。したがって二者の結びつきは、子が生まれたあとも、その子を養い支えるのに必要な間は続くべきである。子は自力で身を持ちこたえ、暮らしを立てられるようになるまで、自分をもうけた親に養われねばならない。限りなく賢い造り主がみずから造った生き物に定めたこの規則を、人よりも下位の生き物も、確かに守っている。草を食べ、胎内で子を育てて産む動物では、雄と雌の結びつきは交尾そのものより長くは続かない。草が食べられるようになるまでは母親の乳で十分養えるから、雄は子をもうけるだけで、雌にも子にも関わらない。その生活を支えるのに、雄には何もできないからだ。だが、獣を捕食する動物の結びつきはもっと長く続く。獲物を捕るのは草を食べるよりも労がかかり、危険な暮らし方であり、母親一頭の獲物だけでは、自分を養うことも、たくさんの子を養うことも難しい。その一家が暮らしていくには雄の助けが必要だ。子が自分で獲物を捕れるようになるまでは、雄と雌が一緒に世話をしなければ一家は成り立たない。同じことは鳥全般についても見られる。ただし餌が豊富で、雄が幼い雛に餌をやり世話をせずにすむ一部の家禽は別である。巣の雛には餌が必要だから、雛が自分の翼で飛び、自力で餌を取れるようになるまで、雄と雌はつがいであり続ける。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s080",
      "section_id": "ch-07",

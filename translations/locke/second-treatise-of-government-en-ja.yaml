          "printed_page": "307",
          "printed_page_end": "308",
          "source_sequence": 106
        }
      ],
      "source_text": "89. Whereever therefore any number of Men so unite into one Society, as to quit every one his Executive Power of the Law of Nature, and to resign it to the publick, there and there only is a political, or civil Society. And this is done whereever any number of Men, in the State of Nature, enter into Society to make one People, one Body Politick under one Supream Government; or else when any one joins himself to, and incorporates with any Government already made. For hereby he authorizes the Society, or which is all one, the Legislative thereof to make Laws for him as the publick good of the Society shall require; to the Execution whereof, his own assistance (as to his own decrees) is due. And this puts men out of a state of nature into that of a Commonwealth, by setting up a Judge on Earth, with Authority to determine all the Controversies, and redress the injuries that may happen to any Member of the Commonwealth; which Judge is the Legislative or Magistrates appointed by it. And whereever there are any number of Men, however associated, that have no such decisive power to appeal to, there they are still in the state of Nature.",
      "translation_ja": "第89節　したがって、何人であれ、人々が一つの社会に結びつき、一人ひとりが自然法の執行権を手放して公に委ねるとき、そこにだけ政治社会、つまり市民社会がある。これは、自然状態にある人々が社会に入り、一つの最高政府の下で、一つの国民、一つの政治体となるときには、いつでも起こる。一人の人がすでにできている政府に加わり、その一員となるときにも起こる。それによってその人は、社会、言い換えればその立法機関に、社会の公共の利益が求めるとおり、自分を律する法律を制定する権限を与える。その執行には、自分で決めたことの執行と同じく、自ら協力する務めを負う。こうしてこの世に、争いをすべて裁き、国の成員が受ける害を正す権限を持つ裁き手が設けられ、人々は自然状態から出て国家に入る。その裁き手とは立法機関か、それが任命した公職者である。どれほど人々が結びついていても、訴えを受けて最終的に裁く権力がないなら、その人々はなお自然状態にいる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s090",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:168",
          "printed_page": "325",
          "printed_page_end": "326",
          "source_sequence": 128
        }
      ],
      "source_text": "106. Thus, though looking back as far as Records give us any account of Peopling the World, and the History of Nations, we commonly find the Government to be in one hand, yet it destroys not that which I affirm (viz.) That the beginning of Politick Society depends upon the consent of the Individuals to join into and make one Society; who when they are thus incorporated, might set up what form of Government they thought fit. But this having given occasion to Men to mistake and think, that by Nature Government was Monarchical, and belong'd to the Father, it may not be amiss, here to consider, why People, in the beginning, generally pitch'd upon this form, which though perhaps the Father's Preheminency might, in the first institution of some Commonwealths, give a rise to, and place in the beginning, the Power in one hand: yet it is plain that the reason that continued the Form of Government in a single Person, was not any Regard or Respect to Paternal Authority; since all petty Monarchies, that is, almost all Monarchies, near their Original, have been commonly, at least upon occasion, elective.",
      "translation_ja": "第106節　このように、世界に人が住み始めたころまで、各国の歴史の記録が残るところをさかのぼれば、政府が一人の手にあるのが普通だが、そのことは、私の主張を崩さない。すなわち、政治社会の始まりは、個々人が一つの社会に加わり、それを作ることへの同意による。まとまった人々は、自分たちがよいと思うどんな形の政府でも設けることができた。しかし、ここから、人々は政府が生まれながらに君主制で、父に属していると誤って考えた。だから、初めに一般の人々がなぜこの形を選んだか、ここで考えてみてもよいだろう。ある国家が最初に作られたとき、父の優位がこの形を生み、はじめの権力を一人の手に置いたこともあったかもしれない。それでも、政府が引き続き一人にある形をとったのは、父の権威を考慮し尊重したからでないことが明らかだ。というのも、小さな君主国はすべて、つまりほとんどすべての君主国はその起源の近くでは、少なくとも時折、選挙で君主を選ぶのが普通だったからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s107",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:169",
          "printed_page": "326",
          "printed_page_end": "328",
          "source_sequence": 129
        }
      ],
      "source_text": "107. First then, in the beginning of things, the Father's Government of the Childhood of those sprung from him, having accustomed them to the Rule of one Man, and taught them, that where it was exercised with Care and Skill, with Affection and Love to those under it, it was sufficient to procure and preserve Men (all the political Happiness they sought for, in Society.) It was no wonder that they should pitch upon, and naturally run into that Form of Government, which, from their Infancy, they had been all accustomed to; and which, by experience, they had found both easie and safe. To which, if we add, that Monarchy being simple, and most obvious to Men, whom neither experience had instructed in Forms of Government, nor the Ambition or Insolence of Empire had taught to beware of the Encroachments of Prerogative, or the Inconveniencies of Absolute Power; which Monarchy, in Succession, was apt to lay claim to, and bring upon them. It was not at all strange, that they should not much trouble themselves to think of methods of restraining any Exorbitances of those, to whom they had given the Authority over them; and of ballancing the Power of Government, by placing several parts of it in different hands. They had neither felt the Oppression of Tyrannical Dominion, nor did the Fashion of the Age, nor their Possessions, or way of living, which afforded little matter for Covetousness or Ambition; give them any reason to apprehend or provide against it; and therefore 'tis no wonder they put themselves into such a Frame of Government, as was, not only, as I said, most obvious and simple, but also best suited to their present State and Condition; which stood more in need of defence against foreign Invasions and Injuries, than of multiplicity of Laws, where there was but very little Property: and wanted not variety of Rulers and abundance of Officers to direct and look after their Execution, where there were but few Trespasses, and few Offenders. Since then, those who liked one another so well as to join into Society, cannot but be supposed to have some Acquaintance and Friendship together, and some Trust one in another. They could not but have greater Apprehensions of others, than of one another; and therefore their first care and thought cannot but be supposed to be how to secure themselves against foreign Force. 'Twas natural for them to put themselves under a Frame of Government, which might best serve to that end; and chuse the wisest and bravest Man to conduct them in their Wars, and lead them out against their Enemies, and in this chiefly be their Ruler.",
      "translation_ja": "第107節　第一に、物事の始まりには、父が幼い子らを導いたので、子らは一人に治められることに慣れていた。この統治も、その下にある人々に気を配り、手際よく、愛情と親しみをもって行われれば、社会に求めるすべての政治上の幸福をもたらして保つのに十分だと学んだ。物心つく前から慣れ、実際に楽で安全だと知っていた形の政府を選び、おのずとそちらへ向かったのも不思議はない。そのうえ、君主政は単純で、さまざまな政体を経験から学んだことのない人々にとって最も分かりやすいものだった。それまで王権の野心や傲慢さに味わわされることもなく、君主政が代を重ねるにつれて要求しがちな大権の拡張に用心することも、被りがちな絶対権力の不都合に備えることも、教えられていなかった。だから自らに対する権威を与えた者の行き過ぎをどう抑えるか、また政府の権力を切り分け、別々の手に置いてどう釣り合わせるかを、ことさらに考えようとしなかったのは当然である。圧政による抑圧を感じたこともなかったし、時代のあり方も、持ち物も、暮らし方も、欲や野心をかきたてるものに乏しく、これを恐れたり、備えたりする理由にならなかった。したがって、先に述べたように最も明白で単純なばかりか、当時の境遇と状態にいちばん合う形の政府の下に、自ら身を置いたとしても驚くにあたらない。財産がほんのわずかしかないうちは、多数の法律を作ることより外からの侵入や害に備えることが必要だった。違反する者も違反そのものも少ないうちは、執行を指示し見守るために、多数の統治者や役人を置く必要もなかった。それほど互いが気に入って一緒に社会に入った者の間には、知り合いとしての付き合いや友情があり、いくらか信頼もあったはずである。互いより他所の者を恐れ、まず考え、気を配ったのは、外からの暴力にどう身を守るかだったに違いない。それなら、この目的に最も役立つ形の政府の下に身を置き、最も分別があって勇敢な人を選んで、戦いの際に自分たちを率いて敵に立ち向かってもらうこと、そして主にその点で統治者になってもらうことは、自然だったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s108",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",

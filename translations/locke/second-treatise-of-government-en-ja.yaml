          "printed_page_end": "302",
          "source_sequence": 100
        }
      ],
      "source_text": "83. For all the ends of Marriage being to be obtained, under politick Government, as well as in the state of Nature, the civil Magistrate doth not abridge the Right or Power of either, naturally necessary to those ends, viz. Procreation, and mutual Support, and Assistance, whilst they are together; but only decides any Controversie that may arise, between Man and Wife, about them. If it were otherwise, and that absolute Soveraignty and Power of life and death naturally belong'd to the Husband, and were necessary to the Society between Man and Wife, there could be no Matrimony in any of these Countries, where the Husband is allowed no such absolute Authority; but the ends of Matrimony requiring no such Power in the Husband, it was not at all necessary to it: the condition of Conjugal Society put it not in him, but whatsoever might consist with Procreation and Support of the Children, till they could shift for themselves: mutual Assistance, Comfort, and Maintenance might be varied, and regulated, by that contract which first united them in that Society; nothing being necessary to any Society, that is not necessary to the ends for which it is made.",
      "translation_ja": "第83節　結婚の目的はすべて、自然状態だけでなく政治のある社会でも果たせるため、市民政府の公職にある者も、目的に自然とついてまわる夫婦いずれかの権利や権力を削ることはない。その目的とは、子をもうけること、また夫婦でいるあいだに互いを支え、助けることである。公職にある者は、このことについて夫婦の間に争いが生じれば、それを裁くにすぎない。仮にそうではなく、絶対の主権と生殺の権が自然に夫に属し、夫婦の社会に欠かせないなら、夫にそうした絶対の権威が認められないすべての国では、結婚も成り立たないはずだ。だが、結婚の目的には夫のそうした権力は要らず、したがって結婚に少しも必要ではなかった。夫婦の関係は夫にその権力を与えない。その関係で認められるのは、子をもうけ、子が自力で暮らせるまで支えることにかなうものにかぎられる。互いに助け、慰め、支えることは、初めに二人をこの関係で結んだ契約によって、さまざまに変えたり定めたりできる。どんな社会にも、その社会の作られた目的に必要でないものまで欠かせない、ということはない。",
      "translation_status": "reviewed"
    },

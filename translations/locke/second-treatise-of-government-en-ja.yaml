      "source_text": "42. To make this a little clearer, let us but trace some of the ordinary provisions of Life, through their several progresses, before they come to our use, and see how much they receive of their value from human industry. Bread, Wine and Cloth are things of daily use and great plenty, yet notwithstanding Acorns, Water, and Leaves, or Skins, must be our Bread, Drink and Cloathing, did not labour furnish us with these more useful Commodities. For whatever Bread is more worth than Acorns, Wine than Water, and Cloth or Silk than Leaves, Skins or Moss, that is wholly owing to labour and industry. The one of these being the food and rayment which unassisted Nature furnishes us with; the other Provisions which our industry and pains prepare for us, which how much they exceed the other in value, when any one hath computed, he will then see how much labour makes the far greatest part of the value of things we enjoy in this World: and the ground which produces the materials, is scarce to be reckon'd in as any, or at most, but a very small part of it: so little, that even amongst us, Land that is left wholly to Nature, that hath no improvement of Pasturage, Tillage, or Planting, is called, as indeed it is, wast; and we shall find the benefit of it amount to little more than nothing.",
      "translation_ja": "第42節　これをもう少し明らかにするため、暮らしで普通に使う物が手もとに届くまでにどんな段階を経るかをたどり、人の働きがどれほどその価値を高めているかを見てみよう。パン、葡萄酒、布は日ごろから使い、ありふれたものだ。ところが労働がこうしたもっと役に立つ品々をもたらさなければ、ドングリをパンの代わりに食べ、水を飲み、葉や獣の皮を着るほかない。パンがドングリより、葡萄酒が水より、布や絹が葉や皮や苔よりどれだけ価値が高くても、その差はすべて労働と勤勉による。一方は、人が手を貸さなくても自然が食べ物や衣服として与えるもの、もう一方は、私たちの勤勉と骨折りが用意する品である。後者が前者の価値をどれほど上回るかを誰かが計算すれば、この世で私たちの享受する物の価値の圧倒的な部分を、労働が生み出すのだと分かるだろう。原料を生む土地の分は、ほとんど、あるいはせいぜいごくわずかしか勘定に入らない。実際、私たちのところでも、放牧も耕作も植えつけもせず、まったく自然のままの土地を荒れ地と呼ぶし、実際に荒れ地であり、そこから得られる益は、ほとんどないに等しい。",

      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:161",
          "printed_page": "311",
          "source_sequence": 111
        }
      ],
      "source_text": "92. For he that thinks absolute Power purifies Mens Bloods, and corrects the baseness of humane Nature, need read but the History of this, or any other Age, to be convinced of the contrary. He that would have been insolent and injurious in the Woods of America, would not probably be much better in a Throne, where perhaps Learning and Religion shall be found out to justifie all that he shall do to his Subjects; and the Sword presently silence all those that dare question it. For what the Protection of Absolute Monarchy is; what kind of Fathers of their Countries it makes Princes to be; and to what a degree of Happiness, and Security it carries civil Society, where this sort of Government is grown to perfection, he that will look into the late Relation of Ceylon may easily see.",
      "translation_ja": "第92節　絶対権力が人の血を浄め、人間の本性の卑しさを正してくれると思う者は、この時代か、ほかのどんな時代でもよい、その歴史を読むだけで、逆であることが分かるだろう。アメリカの森にいれば横柄に人を傷つけたであろう者が、王座に上って、いくらもましになることはありそうにない。そこでは、おそらく学問と宗教が、その者が臣民にすることを何でも正当化するのに持ち出され、問いを発する勇気のある者は、たちまち剣で黙らされるだろう。絶対君主政の保護とはどんなものか、それによって君主はどのような祖国の父となるのか、この形の政府が完全に育ったところで、市民社会をどれほどの幸福と安全に導くのか。最近のセイロンの報告を読めば、すぐに分かるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s093",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:161",
          "printed_page": "311",
          "printed_page_end": "313",
          "source_sequence": 112
        }
      ],
      "source_text": "93. In Absolute Monarchies indeed, as well as other Governments of the World, the Subjects have an Appeal to the Law, and Judges to decide any Controversies, and restrain any violence that may happen betwixt the Subjects themselves, one amongst another. This every one thinks necessary, and believes, he deserves to be thought a declared Enemy to Society and Mankind, who should go about to take it away. But whether this be from a true Love of Mankind and Society, & such a Charity as we owe all one to another, there is reason to doubt. For this is no more than what every Man, who loves his own Power, Profit, or Greatness, may, and naturally must do; keep those Animals from hurting, or destroying one another, who labour and drudge only for his Pleasure and Advantage; and so are taken care of, not out of any Love the Master has for them, but Love of himself, and the Profit they bring him. For if it be asked what Security, what Fence is there, in such a State, against the Violence and Oppression of this Absolute Ruler? The very Question can scarce be born. They are ready to tell you, that it deserves Death only to ask after Safety. Betwixt Subject and Subject, they will grant, there must be Measures, Laws, and Judges for their mutual Peace and Security. But as for the Ruler, he ought to be Absolute, and is above all such Circumstancés; because he has a Power to do more hurt and wrong, 'tis right when he does it. To ask how you may be guarded from harm, or injury, on that side, where the strongest hand is to do it, is presently the Voice of Faction and Rebellion. As if when Men, quitting the state of Nature, entered into Society, they agreed that all of them, but one, should be under the restraint of Laws; but that he should still retain all the Liberty of the state of Nature, increased with Power, and made licentious by Impunity. This is to think that Men are so foolish, that they take care to avoid what Mischiefs may be done them by Pole-Cats, or Foxes, but are content, nay think it Safety, to be devoured by Lions.",
      "translation_ja": "第93節　確かに絶対君主国でも、世界のほかの政府と同じように、臣民は法に訴えることができ、臣民同士に起きる争いを裁き、暴力を抑える裁判官がいる。これは必要だと誰もが考え、それを廃そうとする人は、社会と人類に公然と敵対する者と見なされて当然だと信じている。しかし、これが人類や社会への真の愛情、そして互いに負う慈愛のためかは、疑う理由がある。これは、自分の権力や儲けや偉さを愛する者なら誰でもでき、当然するはずのことにすぎない。自らの喜びと利益のためだけに働き、苦役を担う動物が、互いに傷つけ合い、殺し合わないようにするのだ。その世話をするのは、主人が動物を愛しているからではなく、自分自身と、動物のもたらす利益を愛しているからである。この絶対的な支配者の暴力や圧制から、この国ではどんな安全が保障され、どんな守りがあるのか、と問うてみよう。その問いを口にすることさえ、ほとんど許されない。安全を求めて尋ねるだけで、死に値すると、彼らはすぐに言うだろう。臣民同士の平和と安全のためには、規準、法、裁判官が必要だと認める。だが統治者は絶対であるべきで、そんな条件の一切を超えているという。ほかより大きな害と不正をなせる力があるから、その者がすれば正しい、というのである。害を加えるのに最も強い手の持ち主から、どうすれば身を守れるかと尋ねれば、すぐに党派や反乱の声だと言われる。まるで人々は自然状態を出て社会に入るにあたって、一人を除く全員が法律の拘束を受け、その一人だけは自然状態の自由をすべて残したうえ、それを権力で増し、処罰を免れることで放縦に使えることに、同意したかのようではないか。それほど人々が愚かだと考えるなら、イタチやキツネに害されないよう用心するのに、ライオンに食われるのはよい、いや安全だと喜ぶと思うのと同じである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s094",
      "section_id": "ch-07",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:162",
          "printed_page": "313",
          "printed_page_end": "315",
          "source_sequence": 113
        }
      ],
      "source_text": "94. But, whatever Flatterers may talk, to amuze Peoples Understandings, it never hinders Men from feeling; and when they perceive that any Man, in what Station soever, is out of the Bounds of the civil Society they are of, and that they have no Appeal, on Earth, against any harm they may receive from him, they are apt to think themselves in the state of Nature, in respect of him, whom they find to be so; and to take care, as soon as they can, to have that Safety and Security, in civil Society, for which it was first instituted, and for which only they entered into it. And therefore, though perhaps at first, as shall be shewed more at large hereafter, in the following part of this Discourse, some one good and excellent Man having got a Preheminency, amongst the rest, had this Deference paid to his Goodness and Vertue, as to a kind of Natural Authority, that the chief Rule, with Arbitration of their differences, by a tacit Consent, devolved into his hands, without any other caution, but the assurance they had of his Uprightness and Wisdom; yet when time giving Authority, and, as some Men would perswade us, Sacredness to Customs, which the negligent, and unforeseeing Innocence of the first Ages began, had brought in Successors of another stamp, the People finding their Properties not secure under the Government as then it was. (Whereas Government has no other end but the preservation of Property) could never be safe, nor at rest, nor think themselves in civil Society, till the Legislative was so placed in collective Bodies of Men, call them Senate, Parliament, or what you please, by which means every single person became subject equally, with other the meanest Men, to those Laws, which he himself, as part of the Legislative, had established; nor could any one, by his own Authority, avoid the force of the Law, when once made, nor by any pretence of Superiority plead exemption, thereby to license his own, or the Miscarriages of any of his Dependants: No Man in civil Society can be exempted from the Laws of it. For if any Man may do what he thinks fit, and there be no appeal on Earth, for Redress or Security against any harm he shall do; I ask, whether he be not perfectly still in the state of Nature, and so can be no Part or Member of that civil Society, unless any one will say, the state of Nature and civil Society, are one and the same thing, which I have never yet found any one so great a Patron of Anarchy as to affirm.",
      "translation_ja": "第94節　だが、おべっか使いが何を言って人の頭を惑わせようと、身に何が起きるかまで感じなくなることはない。どんな地位にいる者であれ、自分の属する市民社会の制約の外にいて、その人から害を受けても、この世に訴え先がないと分かったとき、人々は、相手が自然状態にいるのだから、自分たちもその相手に対しては自然状態にいると考えやすい。そしてできるだけ早く、市民社会が初めにそのために設けられ、自分たちがただそのためだけに加わった、あの安全と保障を、そこで手に入れようとする。そこで、この論考の先でもっと詳しく示すように、初めは善良で優れたある人がほかの人々より上に立ったのかもしれない。その善良さと徳が一種の自然な権威と見なされて尊重され、正しさと知恵を信頼する以外に何の用心もなく、暗黙の同意で、統治の中心と争いを仲裁する権限がその人の手に渡ったのかもしれない。それでも、初めの時代の、用心も先への見通しもなかった無邪気さが始めた慣習に、時が権威を与え、ある人たちが信じさせようとするように神聖さを与え、別の性格の後継者を招くと、人々は当時の政府の下で財産の安全が保障されないと知った。政府には財産を守る以外の目的はない。それゆえ、上院、議会、あるいは何と呼んでもよいが、立法権を何人もの人から成る機関に置くまでは、安全とも安心とも思えず、自分たちが市民社会にいるとも思えなかった。それを行うことで、一人ひとりが、自ら立法の一員として制定した法律に、最も身分の低い者と等しく服するようになった。いったん法が制定されれば、いかなる者も、自分自身の権威によってその効力を免れたり、他より上にいるという口実で法の適用免除を申し立て、自分や配下の誰かが不正をしてもよいことにしたりはできなかった。市民社会では誰もその法を免れない。誰かが思うままに行動でき、その者が加えた害について、救済や保護をこの世に訴えられないなら、その人は完全に自然状態のままであり、市民社会の一部、一員ではありえないではないか。自然状態と市民社会は一つの同じものだと言うなら別だが、それほどまでに無政府を擁護する者には、私はまだ一人も出会ったことがない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-n04",
      "section_id": "ch-07",

      ],
      "source_text": "207. Thirdly, Supposing a Government, wherein the Person of the chief Magistrate is not thus Sacred; yet this Doctrine, of the lawfulness of resisting all unlawful exercises of his Power, will not, upon every slight occasion, indanger him, or imbroil the Government. For, where the injured Party may be relieved, and his damages repaired, by Appeal to the Law, there can be no pretence for Force; which is only to be used, where a Man is intercepted from appealing to the Law. For nothing is to be accounted Hostile Force, but where it leaves not the remedy of such an Appeal. And 'tis such Force alone, that puts him that uses it, into a state of War, and makes it lawful to resist him. A Man, with a Sword in his hand, demands my Purse, in the High-way, when, perhaps, I have not 12d. in my Pocket; This Man I may lawfully kill. To another I deliver 100l. to hold, only whilst I alight, [?]hich he refuses to restore me when I am got up again, but draws his Sword to defend the possession of it, by force: I endeavour to retake it. The mischief, this Man does me, is a hundred, or possibly a thousand times more than the other perhaps intended me, (whom I kill'd, before he really did me any) and yet I might lawfully kill the one, and cannot so much as hurt the other lawfully. The Reason whereof is plain; because the one using force, which threatned my Life, I could not have time to appeal to the Law to secure it: And when it was gone, 'twas too late to appeal. The Law could not restore Life to my dead Carcass. The Loss was irreparable; which, to prevent, the Law of Nature gave me a Right to destroy him, who had put himself into a state of War with me, and threatned my destruction. But, in the other case, my Life not being in danger, I might have the benefit of appealing to the Law, and have Reparation, for my 100l. that way.",
      "translation_ja": "第207節　第三に、最高の公職者の身がこのように不可侵とされない政府を考えても、その者の不法な権力行使にはすべて抵抗してよいとする説が、ささいなことでその身を危うくし、政府を混乱させるわけではない。被害者が法に訴えて救済を得て、損害を償ってもらえるなら、力を用いる口実はないからだ。力が許されるのは、法に訴える道をふさがれたところだけである。そのような訴えによって救いを求められないものだけが、敵対する力と見なされる。そうした力だけが、用いる者を戦争状態に置き、それに抗することを正当とする。ある人が街道で剣を手に、財布をよこせと私に迫る。ポケットには十二ペンスもないかもしれないが、私は正当にその者の命を奪うことができる。他方、馬から下りるあいだだけ、百ポンドを誰かに預けたとしよう。私がまた乗った後も、相手はそれを返そうとせず、剣を抜いて力で持ち続けようとし、私は取り返そうとする。この者が私に与えた害は、もう一方の者が加えるつもりだった害の百倍、あるいは千倍もあろう。もう一方は、実際に何一つ害を加える前に私が殺したのである。それでも一方は正当に殺せるのに、もう一方は正当に傷つけることさえできない。その理由は明らかである。一方は私の命を脅かす力を用いたので、命を守るために法に訴える時間がなかった。命を失ってからでは、訴えるには遅すぎる。法でも、死んだ私の身体に命を戻せない。その失われたものは償いようがない。そのため自然法は、それを防ぐため、私との戦争状態に入り、私の命を脅かした者の命を奪う権利を認めた。だがもう一方の場合には、私の命に危険がなかったので、法に訴え、そうして百ポンドを償ってもらう道があったのである。",
      "translation_status": "reviewed",

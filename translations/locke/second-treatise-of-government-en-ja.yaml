          "printed_page_end": "329",
          "source_sequence": 130
        }
      ],
      "source_text": "108. Thus we see that the Kings of the Indians, in America, which is still a Pattern of the first Ages in Asia and Europe, whilst the Inhabitants were too few for the Countrey, and want of People and Money gave Men no temptation to enlarge their Possessions of Land, or contest for wider extent of Ground; are little more than Generals of their Armies: and though they command absolutely in War, yet at home, and in time of Peace, they exercise very little Dominion, and have but a very moderate Sovereignty; the Resolutions of Peace and War, being ordinarily either in the People, or in a Council. Though the War it self, which admits not of Pluralities of Governours, naturally devolves the Command into the King's sole Authority.",
      "translation_ja": "第108節　こうして見ると、アメリカ先住民の王は、軍勢の将軍に近い。アメリカはいまなお、住民の数のわりに土地が広く、人と貨幣が少ないために所有地を広げる気にも、もっと広い土地を争う気にもならなかった、アジアとヨーロッパの初期の姿を示している。戦いにあたって王は絶対的に命令するが、自国で平時に振るう支配はわずかで、主権もごく限られている。平和か戦争かを決めるのは、普通、人民か評議会のどちらかである。もっとも、戦争そのものは、何人もの統治者を置くことには向かないので、指揮権は自然に王一人の権限に帰する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s109",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:170",
          "printed_page": "329",
          "printed_page_end": "331",
          "source_sequence": 131
        }
      ],
      "source_text": "109. And thus in Israel it self, the chief Business of their Judges, and first Kings, seems to have been to be Captains in War, and Leaders of their Armies; which, (besides what is signified by, going out and in before the People, which was, to march forth to War, and home again in the Heads of their Forces) appears plainly in the story of Iephtha. The Ammonites making War upon Israel, the Gileadites, in fear, send to Iephtha, a Bastard of their Family, whom they had cast off, and article with him, if he will assist them against the Ammonites, to make him their Ruler; which they do in these Words, And the People made him head and captain over them, Iudg. 11. 11. which was, as it seems, all one as to be Judge. And he judged Israel, Iudg. 12. 7. that is, was their Captain-general, six Years. So when Iotham upbraids the Shechemites with the Obligation they had to Gideon, who had been their Judge and Ruler, he tells them, He fought for you, and adventured his life far, and delivered you out of the hands of Midian, Iudg. 9.17. Nothing mentioned of him, but what he did as a General, and indeed, that is all is found in his History, or in any of the rest of the Judges. And Abimelech particularly is called King, though at most he was but their General. And when, being weary of the ill Conduct of Samuel's Sons, the Children of Israel desired a King, like all the nations to judge them, and to go out before them, and to fight their battels, 1 Sam. 8. 20. God granting their Desire, says to Samuel, I will send thee a man, and thou shalt anoint him to be captain over my people Israel that he may save my peole out of the hands of the Philistines, c. 9. v. 16. As if the only business of a King had been to lead out their Armies, and fight in their Defence; and, accordingly, at his Inauguration, pouring a Vial of Oyl upon him, declares to Saul, that, the Lord had anointed him to be Captain over his inheritance, c. 10. v. 1. And therefore those, who after Saul's being solemnly chosen, and saluted King by the Tribes, at Mispah, were unwilling to have him their King, make no other Objection but this, How shall this man save us? v. 27. as if they should have said, This Man is unfit to be our King, not having Skill and Conduct enough in War, to be able to defend us. And when God resolved to transfer the Government to David, it is in these Words, But now thy Kingdom shall not continue: the Lord hath sought him a man after his own heart, and the Lord hath commanded him to be captain over his people, c. 13. v. 14. As if the whole Kingly Authority were nothing else but to be their General: and therefore the Tribes who had stuck to Saul's Family, and opposed David's Reign, when they came to Hebron with terms of Submission to him, they tell him, amongst other Arguments they had to submit to him as to their King, That he was, in effect, their King in Saul's time, and therefore, they had no reason but to receive him as their King now. Also (say they) in time past, when Saul was King over us, thou wast he that leddest out and broughtest in Israel, and the Lord said unto thee, thou shalt feed my People Israel, and thou shalt be a Captain over Israel.",
      "translation_ja": "第109節　イスラエルでも、士師や最初の王の主な仕事は、戦いの指揮者となって軍勢を率いることだったらしい。「民の先に立って出入りする」という言葉が、軍の先頭に立って出陣し、また帰ってくることを言うのに加え、これはエフタの話からもはっきり分かる。アンモン人がイスラエルに戦いを仕掛けると、恐れたギレアドの人々は、かつて追い出した一族の庶子エフタのもとに使いを送り、アンモン人と戦うのを助けてくれれば統治者にすると取り決めた。「民は彼を自分たちの頭、指揮者とした」とある（『士師記』11章11節）。これは、士師になるのと同じであったらしい。「彼はイスラエルを裁いた」（同12章7節）、つまり六年間、民の総指揮官だったのである。同じようにヨタムは、シェケムの民を裁き、治めたギデオンに対して彼らがどれだけ恩を負うかを責める際、「彼はあなたがたのために戦い、自らの命を危険にさらし、ミディアンの手からあなたがたを救い出した」と語った（同9章17節）。言及されるのは、将軍として行ったことだけであり、実際、ギデオンやその他の士師の物語を見ても、それ以外のことは見当たらない。アビメレクは特に王と呼ばれるが、せいぜい将軍にすぎなかった。また、イスラエルの子らがサムエルの息子たちの悪い振る舞いにうんざりし、ほかの国々のように、自分たちを裁き、先頭に立って出陣し、戦いを戦ってくれる王を求めたとき（『サムエル記上』8章20節）、神は望みを聞き入れ、サムエルに言った。「あなたのもとに一人の人を送ろう。その人に油を注いで、わが民イスラエルの指揮者としなさい。彼が民をペリシテ人の手から救うためである」（同9章16節）。まるで王の仕事は、軍を率いて出ていき、その民を守って戦うだけであるかのようだ。それに従って、即位にあたって小瓶の油を注ぎ、サウルに、主はあなたに油を注いでその嗣業の指揮者とされた、と告げた（同10章1節）。そこで、サウルがミツパで部族から正式に選ばれ、王として迎えられたあと、なお彼を王に望まなかった人々も、「この人がどうやって私たちを救うのか」（同10章27節）と以外には異議を唱えなかった。それはまるで、いざ戦いとなっても私たちを守る技能と指揮力が足りない、だからこの人は王に向かない、と言ったようなものである。また、神が統治をダビデに移そうと決めたときは、次の言葉を用いた。「だが今や、あなたの王国は続かない。主は御心にかなう人を求め、主はその人に御自分の民の指揮者となるようお命じになった」（同13章14節）。まるで王の権威のすべては将軍となることにほかならないかのようだ。だから、サウルの家に従い続け、ダビデの治世に反対した部族が、服従の条件を携えてヘブロンに来た際も、彼を王として受け入れるべき理由の一つに、サウルの頃に彼が事実上、自分たちの王だったことを挙げ、今になって王として迎えない理由はないと述べた。「しかも、かつてサウルが私たちの王だったころ、イスラエルを率いて出入りしたのはあなたでした。主はあなたに、わが民イスラエルを牧し、イスラエルの指揮者となれ、と仰せになりました。」",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s110",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:172",
          "printed_page": "332",
          "printed_page_end": "333",
          "source_sequence": 132
        }
      ],
      "source_text": "110. Thus, whether a Family, by degrees, grew up into a Commonwealth, and the Fatherly Authority being continued on to the elder Son, every one in his turn growing up under it, tacitly submitted to it, and the easiness and equality of it not offending any one, every one acquiesced, till time seemed to have confirmed it, and setled a right of Succession, by Prescription: or whether several Families, or the Descendants of several Families, whom Chance, Neighbourhood, or Business brought together, united into Society; the need of a General, whose Conduct might defend them against their Enemies in War, and the great confidence the Innocence and Sincerity of that poor but vertuous Age, such as are almost all those which begin Governments that ever come to last in the World, gave Men one of another, made the first Beginners of Commonwealths generally put the Rule into one Man's hand, without any other express Limitation or Restraint, but what the Nature of the thing, and the End of Government required. It was given them for the publick Good and Safety, and to those Ends in the Infancies of Commonwealths, they commonly used it, and unless they had done so, young Societies could not have subsisted; without such nursing Fathers: without this care of the Governours, all Governments would have sunk under the Weakness and Infirmities of their Infancy, the Prince and the People had soon perished together.",
      "translation_ja": "第110節　こうして、一つの家族がしだいに国家となり、父の権威が長男へ引き継がれ、成長する者が順に暗黙のうちに従い、その穏やかさと公平さに誰も腹を立てず、皆が受け入れた結果、時がこれを裏づけ、長い慣行によって継承の権利を確立した場合でも、あるいは偶然、近所の付き合いや用向きで集まった幾つかの家やその子孫が、一つの社会にまとまった場合でも、結局は同じであった。戦時に指揮を執って敵から守ってくれる将軍が必要だったからであり、また、貧しくとも徳のあったあの時代の無邪気さと誠実さが、人々の間に大きな信頼を生んだからである。世に長続きするような政府のほとんどは、こうした時代に始まる。こうした事情から、国を初めに作った人々はたいてい一人の手に統治を置き、事柄の性質と政府の目的が要求するほかは、明示の限度や制約を設けなかった。公共の利益と安全のために与えられた力は、国家が幼いころには、ふつうそのために用いられた。そうでなければ、若い社会は存続できなかっただろう。養い育てる父のような者なしには、統治者の気遣いなしには、どんな政府も幼いころの弱さと力不足に沈み、君主も民もまもなく共に滅んでいたであろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s111",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:172",
          "printed_page": "333",
          "printed_page_end": "334",
          "source_sequence": 133
        }
      ],
      "source_text": "111. But the golden Age (tho' before vain Ambition, and amor sceleratus habendi, evil Concupiscence had corrupted Mens minds into a Mistake of true Power and Honour) had more Virtue, and consequently, better Governours, as well as less vicious Subjects; and there was then no stretching Prerogative on the one side to oppress the People; nor, consequently, on the other, any Dispute about Priviledge, to lessen or restrain the Power of the Magistrate: and so no contest betwixt Rulers and People, about Governours or Government. Yet, when Ambition, and Luxury, in future Ages, would retain, and increase the Power, without doing the Business, for which it was given, and aided by Flattery, taught Princes to have distinct and separate Interests, from their People; Men found it necessary to examine, more carefully, the Original and Rights of Government; and to find out ways to restrain the Exorbitances, and prevent the Abuses of that Power, which they having intrusted in another's hands, only for their own good, they found, was made use of to hurt them.",
      "translation_ja": "第111節　黄金時代には徳が今より多かった。空しい野心と、むさぼって持とうとする罪深い欲望、つまり邪な貪りが人の心を腐らせ、真の権力や名誉についての誤りへと導く前のことだった。そのため、臣民は今ほど悪に染まらず、統治者も今よりよかった。一方では人民を抑圧するため大権が押し広げられることもなく、したがって他方では、公職にある者の権力を縮めたり抑えたりするため、特権を争うこともなかった。こうして統治者や統治をめぐり、治める者と民の間に争いはなかった。だが後の時代、野心と贅沢さは、権力を与えられた目的である仕事を果たさずに権力を保ち、広げようとした。そのうえ、おべっかの助けを借りて、君主は民とは別に切り離された自分の利益を抱くようになった。そこで人々には、政府の起源と権利をいっそう注意深く調べ、権力の行き過ぎを抑え、濫用を防ぐ方法を見つける必要が生じた。ただ自分たちのために他者の手に託した権力が、自分たちを害するのに使われていると分かったからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-n06",
      "section_id": "ch-08",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:172",
          "printed_page": "333",
          "source_sequence": 134
        }
      ],
      "source_text": "At first, when some certain kind of Regiment was once approved, it may be, nothing was then further thought upon, for the manner of governing, but all permitted unto their Wisdom, and Discretion, which were to Rule, till, by experience, they found this for all parts very inconvenient, so as the thing, which they had devised for a Remedy, did indeed but increase the Sore, which it should have cured. They saw, that to live by one Man's Will, became the cause of all Mens misery. This constrained them to come unto Laws wherein all Men might see their Duty beforehand, and know the Penalties of transgressing them. Hooker's Eccl. Pol. l. 1. §. 10.",
      "translation_ja": "「ある一定の統治の形が認められたとき、初めは、どう治めるかをそれ以上は考えず、すべてを統治者の知恵と判断に任せたのかもしれない。やがて経験に照らし、これはあらゆる面でひどく不都合で、治療のつもりで考えついたものが、癒やすはずだった傷をかえって深めたと分かった。一人の意志によって生きることが、万人の不幸の原因になると知った。これに迫られて、すべての人が、自分の義務と、それに背いた場合の罰をあらかじめ知りうる法律を定めるに至った」フッカー『教会統治の法』第一巻第十節。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s112",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:173",
          "printed_page": "334",
          "printed_page_end": "345",
          "source_sequence": 135
        }
      ],
      "source_text": "112. Thus we may see how probable it is, that People, that were naturally free, and, by their own consent, either submitted to the Government of their Father, or united together, out of different Families, to make a Government; should generally put the Rule into one Man's hands, and chuse to be under the Conduct of a single Person; without so much, as by express Conditions, limiting or regulating his Power, which they thought safe enough in his Honesty and Prudence. Though they never dream'd of Monarchy being Iure Divino, which we never heard of among Mankind, till it was revealed to us by the Divinity of this last Age; nor ever allowed Paternal Power to have a right to Dominion, or to be the Foundation of all Government. And thus much may suffice to shew, that, as far as we have any light from History, we have reason to conclude, that all peaceful beginnings of Government have been laid in the Consent of the People. I say peaceful, because I shall have occasion, in another place, to speak of Conquest, which some esteem a way of beginning of Governments.",
      "translation_ja": "第112節　以上から、自然に自由であった人々が、自ら同意して父の統治に従うか、違う家族から集まって一緒に政府を作る場合、たいてい統治を一人の手に置き、一人の指揮の下に入ることを選んだのは、いかにもありそうなことだと分かる。その権力は、その人の誠実さと分別に任せれば十分に安全だと考え、わざわざ明示の条件で限度を設けたり、規律したりもしなかった。もっとも君主政は神の権利に基づくなどとは、夢にも思わなかった。先ごろの時代の神学が私たちにこれを啓示するまで、人の間でそんなことが聞かれたこともなかった。また父の権力が支配の権利を持ち、すべての政府の土台になるとも認めなかった。歴史が光を当ててくれるかぎり、政府の平和な始まりはすべて、人民の同意の上に置かれたと結論する理由があることを示すには、以上で足りるだろう。平和な、と言うのは、政府が始まる方法の一つだと考える人もいる征服について、ほかの箇所で述べる機会があるからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s112-p01",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:173",
          "printed_page": "345",
          "source_sequence": 136
        }
      ],
      "source_text": "The other Objection, I find, urged against the beginning of Polities, in the way I have mentioned, is this, viz.",
      "translation_ja": "私が述べたかたちで政治体が始まることに対しては、もう一つ、次の反論が出されている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s113",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:173",
          "printed_page": "345",
          "printed_page_end": "336",
          "source_sequence": 137
        }
      ],
      "source_text": "113. That all Men being born under Government, some or other, it is impossible any of them should ever be free, and at liberty, to unite together, and begin a new one, or ever be able to erect a lawful Government. If this Argument be good; I ask, how came so many lawful Monarchies into the World? For if any body, upon this supposition, can shew me any one Man, in any Age of the World, free to begin a lawful Monarchy; I will be bound to shew him Ten other free Men at liberty, at the same time, to unite and begin a new Government under a Regal, or any other Form. It being demonstration, that if any one, born under the Dominion of another, may be so free, as to have a right to command others, in a new and distinct Empire; every one that is born under the Dominion of another may be so free too, and may become a Ruler, or Subject, of a distinct separate Government. And so by this their own Principle, either all Men however born are free, or else there is but one lawful Prince, one lawful Government in the World. And then they have nothing to do but barely to shew us which that is. Which when they have done, I doubt not but all Mankind will easily agree to pay obedience to him.",
      "translation_ja": "第113節　すべての人は、何であれいずれかの政府の下に生まれるため、誰も自由になって、一緒に新しい政府を始めることはできず、正当な政府を立てることも決してできない、というのだ。この論が正しいというなら、どうしてあれほど多くの正当な君主国が世に生まれたのか。この仮定に立って、世界のどんな時代でもよい、正当な君主政を自由に始められた人を一人でも示せるなら、私は同じ時に、自由に結びついて、君主政であれ別の形であれ、新しい政府を始められた、ほかの十人の自由人を示してみせよう。他人の支配の下に生まれた一人が、新しく別個の国で他人に命令する権利を持てるほど自由になれるなら、他人の支配の下に生まれた人は誰でも同じように自由になれ、別個の独立した政府の統治者なり臣民なりになれるのは、証明の余地もないほど明らかだ。したがってこの人々自身の原則によれば、生まれがどうであれ全員が自由であるか、世界に正当な君主は一人、正当な政府は一つしかないか、どちらかである。そうなれば残るのは、どれがその君主や政府なのかを彼らが示すことだけだ。それが済めば、人類はみな、たやすくその君主に従うことに同意するに違いない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s114",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:174",
          "printed_page": "336",
          "source_sequence": 138
        }
      ],
      "source_text": "114. Though it be a sufficient Answer to their Objection to shew, that it involves them in the same difficulties that it doth those they use it against; yet I shall endeavour to discover the weakness of this Argument a little farther.",
      "translation_ja": "第114節　この反論は、彼らがそれによって攻撃する相手を困らせるのと同じ難点に、当の彼ら自身を巻き込む。それを示すだけで十分な答えだが、私はこの議論の弱さを、もう少し踏み込んで明らかにしよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s114-p01",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:174",
          "printed_page": "336",
          "source_sequence": 139
        }
      ],
      "source_text": "All men, say they, are born under Government, and therefore they cannot be at liberty to begin a new one. Every one is born a Subject to his Father, or his Prince, and is therefore under the perpetual tie of Subjection and Allegiance. 'Tis plain, Mankind never owned nor considered any such natural subjection that they were born in, to one or to the other, that tied them, without their own consents, to a subjection to them and their Heirs.",
      "translation_ja": "彼らの言い分では、人はみな政府の下に生まれる。だから新しい政府を始める自由はない。誰もが父か君主に服する者として生まれるため、服従と忠誠の永遠の絆に縛られる、と。だが人類は、自分で同意しないのに、父か君主のいずれかと、その後継者に服従するよう縛る、生まれながらの従属など認めたことも、念頭に置いたこともない。それは明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s115",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:174",
          "printed_page": "336",
          "printed_page_end": "337",
          "source_sequence": 140
        }
      ],
      "source_text": "115. For there are no Examples so frequent in History, both sacred and prophane, as those of Men withdrawing themselves, and their Obedience, from the Jurisdiction they were born under, and the Family or Community they were bred up in, and setting up new Governments in other places, from whence sprang all that number of petty Commonwealths in the beginning of Ages, and which always multiplied as long as there was room enough, till the stronger, or more fortunate swallow'd the weaker; and those great ones again breaking to pieces, dissolved into lesser Dominions. All which are so many testimonies against paternal Soveraignty, and plainly prove, That it was not the natural right of the Father descending to his Heirs, that made Governments in the beginning; since it was impossible, upon that ground, there should have been so many little Kingdoms, but only one universal Monarchy, if Men had not been at liberty to separate themselves from their Families and their Government, be it what it will that was set up in it, and go and make distinct Commonwealths and other Governments as they thought fit.",
      "translation_ja": "第115節　というのも、聖書にも世俗の歴史にも、人々が、生まれたときから服していた支配や、育った家族や共同体を離れて従うのをやめ、ほかの場所に新たな政府を設けた実例ほど、ありふれたものはないからだ。時代の初めに数多くあった小国は、みなそこから生まれた。場所が十分にあるかぎり増え続け、ついには強い国や運のよい国が弱い国をのみ込み、その大国も、今度はばらばらに砕けて、より小さな支配領域に分かれた。これらはどれも父の主権を否定する証しであって、もともと政府を作ったのが、相続人に伝わる父の自然の権利ではなかったことをはっきり証明する。人々が、自分たちの家族と、そこに置かれた政府がどんなものであれその政府とから離れ、別の国家や思うとおりの政府を作る自由を持たなかったなら、その権利によって、あれほど多くの小王国が成り立つはずはなく、世界を一つに治める君主政しかありえなかったからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s116",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:174",
          "printed_page": "337",
          "printed_page_end": "339",
          "source_sequence": 141
        }
      ],
      "source_text": "116. This has been the practice of the World from its first beginning to this day: nor is it now any more hindrance to the freedom of Mankind, that they are born under constituted and ancient Polities, that have established Laws and set Forms of Government, than if they were born in the Woods, amongst the unconfined Inhabitants that run loose in them. For those who would perswade us, that by being born under any Government, we are naturally Subjects to it, and have no more any title or pretence to the freedom of the state of Nature, have no other reason (bating that of Paternal Power, which we have already answer'd) to produce for it, but only because our Fathers or Progenitors passed away their natural Liberty, and thereby bound up themselves and their Posterity to a perpetual subjection to the Government, which they themselves submitted to. 'Tis true, that whatever Engagements or Promises any one made for himself, he is under the obligation of them, but cannot by any Compact whatsoever, bind his Children or Posterity. For his Son, when a Man, being altogether as free as the Father, any act of the Father can no more give away the liberty of the Son, than it can of any body else. He may indeed annex such Conditions to the Land he enjoyed, as a Subject of any Commonwealth, as may oblige his Son to be of that Community, if he will enjoy those Possessions which were his Fathers; because that Estate being his Fathers Property, he may dispose or settle it as he pleases.",
      "translation_ja": "第116節　これは世界の始まりから今日に至るまでの人々のやり方であった。今でも、確立した法と定まった政体を持つ古くからの政治体の下に生まれることは、森の中で、拘束を受けず自由に歩き回る人々の間に生まれることと比べて、人類の自由を少しも妨げない。何かの政府の下に生まれたら、人は当然その臣民であり、自然状態の自由への権原や主張を、もう持たないと説く人たちには、すでに答えた父権のほかには、次の理由しか挙げられない。私たちの父や先祖が自らの自然の自由を譲り、自分たちが服した政府に、子孫も自身も永久に服従するよう拘束したというのだ。確かに誰でも、自分について結んだ約束や誓約には縛られる。だがどんな取り決めでも、自分の子や子孫を縛れはしない。息子は成人すれば父とまったく同じく自由だから、他の誰の自由も父は手放せないのと同じく、自分のどんな行為によっても、息子の自由を手放せないのである。もっとも、自分が何らかの国家の臣民として所有した土地に、息子がかつて父のものだった財産を享受するなら、その共同体に属すること、といった条件をつけることはできる。その財産は父自身のものであり、思うとおりに譲り、帰属を定められるからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s117",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:175",
          "printed_page": "339",
          "source_sequence": 142
        }
      ],
      "source_text": "117. And this has generally given the occasion to the mistake in this matter; because Commonwealths not permitting any part of their Dominions to be dismembred, nor to be enjoyed by any but those of their Community, the Son cannot ordinarily enjoy the Possessions of his Father, but under the same Terms his Father did; by becoming a Member of the Society; whereby he puts himself presently under the Government, he finds there established, as much as any other Subject of that Commonweal. And thus the Consent of Free-men, born under Government, which only makes them Members of it, being given separately in their turns, as each comes to be of Age, and not in a multitude together; People take no notice of it, and thinking it not done at all, or not necessary, conclude they are naturally Subjects as they are Men.",
      "translation_ja": "第117節　普通この問題に誤解を招いたのは、このことである。国家は領土のどの部分も切り離されることを認めず、共同体に属するもののほかは、誰にもそこを享受させない。そのため息子はたいてい、父と同じ条件、すなわちその社会の一員になるという条件でしか、父の持ち物を享受できない。それによって、その国の他の臣民と同じだけ、そこにすでにある政府の下に、すぐ身を置くことになる。こうして、政府の下に生まれた自由人がその成員になる唯一の手立てである同意が、いっせいにではなく、それぞれ成年に達する順に別々に与えられるので、人々は気に留めない。同意などまったくなかったとか、必要でないとか思い込み、人間として生まれる以上、自然に臣民なのだと結論する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s118",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:175",
          "printed_page": "339",
          "printed_page_end": "340",
          "source_sequence": 143
        }
      ],
      "source_text": "118. But, 'tis plain, Governments themselves understand it otherwise; they claim no Power over the Son, because of that they had over the Father; nor look on Children as being their Subjects, by their Fathers being so. If a Subject of England have a Child, by an English Woman, in France, whose Subject is he? Not the King of England's; for he must have leave to be admitted to the Priviledges of it. Nor the King of France's; for how then has his Father a liberty to bring him away, and breed him as he pleases: and who ever was judged as a Traytor or Deserter, if he left, or warr'd against a Countrey, for being barely born in it of Parents that were Aliens there? 'Tis plain then, by the Practice of Governments themselves, as well as by the Law of right Reason, that a Child is born a Subject of no Country nor Government. He is under his Father's Tuition and Authority, till he come to Age of Discretion; and then he is a Free-man, at liberty what Government he will put himself under; what Body Politick he will unite himself to. For if an English-Man's Son, born in France, be at liberty, and may do so, 'tis evident there is no Tye upon him, by his Father's being a Subject of that Kingdom; nor is he bound up, by any Compact of his Ancestors: and why then hath not his Son, by the same reason, the same liberty, though he be born any where else! Since the Power that a Father hath naturally, over his Children, is the same, where-ever they be born; and the Ties of natural Obligations, are not bounded by the positive Limits of Kingdoms and Commonwealths.",
      "translation_ja": "第118節　だが、政府そのものがそうは理解していないことは明らかだ。父に対して持った権力のゆえに、息子に対して権力を要求したり、父が臣民だったからと子も自国の臣民だと見なしたりすることはない。イングランドの臣民がフランスでイングランド人の女性との間に子をもうけたら、その子は誰の臣民だろうか。イングランド王の臣民ではない。その国の特権を認めてもらうには、許しを得なければならないからである。フランス王の臣民でもない。そうであれば、どうして父がその子を連れ帰って思うように育てる自由を持つだろうか。またその国では外国人だった両親のもとに、たまたまその国で生まれたというだけで、その国を離れ、あるいはその国と戦った者が、反逆者や逃亡者と裁かれたことなどあるだろうか。そこで理性の正しい法によっても、政府自身の実際の扱いによっても、生まれた子はどこの国や政府の臣民でもないことが明らかだ。分別のある年齢に達するまでは父の保護と権威の下にあり、そのときになれば自由人となり、どの政府の下に身を置き、どの政治体に加わるかを自由に決められる。イングランド人の息子がフランスで生まれても、自由にそうできるなら、父がイングランドの臣民だったということは、その子の何の縛りにもならず、祖先が交わした取り決めにも縛られないのは明らかだ。それなのに、同じ理由から、息子がどこで生まれようとも、同じ自由を持つことにならないのはなぜか。父が自然に子に対して持つ力は、子が生まれたところがどこでも同じであり、自然の義務の絆は、王国や国家が法で定めた境界に限られないからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s119",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:176",
          "printed_page": "341",
          "printed_page_end": "342",
          "source_sequence": 144
        }
      ],
      "source_text": "119. Every Man being, as has been shewed, naturally free, and nothing being able to put him into subjection to any earthly Power, but only his own Consent: It is to be considered, what shall be understood to be a sufficient Declaration of a Man's Consent, to make him subject to the Laws of any Government. There is a common distinction of an express, and a tacit Consent; which will concern our present Case. No body doubts but an express Consent, of any Man, entering into any Society, makes him a perfect Member of that Society, a Subject of that Government. The difficulty is, what ought to be look'd upon as a tacit Consent, and how far it binds, i. e. how far any one shall be looked on to have consented, and thereby submitted to any Government, where he has made no Expressions of it at all. And to this I say, that every Man, that hath any Possession, or Enjoyment, of any part of the Dominions of any Government, doth thereby give his tacit Consent, and is as far forth obliged to Obedience to the Laws of that Government, during such Enjoyment, as any one under it; whether this his Possession be of Land, to him and his Heirs for ever, or a Lodging only for a Week; or whether it be barely travelling freely on the Highway; and, in Effect, it reaches as far as the very being of any one within the Territories of that Government.",
      "translation_ja": "第119節　示してきたように、人は誰もが自然に自由で、自らの同意だけがこの世の権力にその人を服させうる。そこで、ある政府の法に服するための十分な同意の表明と見なされるべきものは、何かを考えなければならない。よく行われる区別に、明示の同意と暗黙の同意との区別があり、今の問題に関係する。ある社会に加わることに明示で同意する人が、社会の正式な成員となり、政府の臣民になることは、誰も疑わない。難しいのは、何を暗黙の同意とみなすべきか、それがどこまで拘束するか、つまり、何も表明していない人が、どこまで同意し、その結果、政府に服したと見なされるかである。これについて、私はこう言う。どんな政府であれ、その領土のどこかを所有し、あるいは利用している者は、そうすることによって暗黙の同意を与える。その利用が続く間は、政府の下にある者と同じ限度で、その法に従う義務を負う。自分と相続人が永久に保有する土地であれ、わずか一週間の宿であれ、また公道を自由に旅するだけであれ、変わりはない。事実上、その政府の領域の中に身を置くだけのことにまで及ぶ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s120",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:177",
          "printed_page": "342",
          "printed_page_end": "343",
          "source_sequence": 145
        }
      ],
      "source_text": "120. To understand this the better, it is fit to consider, that every Man, when he, at first, incorporates himself into any Commonwealth, he, by his uniting himself thereunto, annexed also, and submits to the Community those Possessions, which he has, or shall acquire, that do not already belong to any other Government. For it would be a direct Contradiction, for any one, to enter into Society with others for the securing and regulating of Property: and yet to suppose his Land, whose Property is to be regulated by the Laws of the Society, should be exempt from the Jurisdiction of that Government, to which he himself, and the Property of the Land, is a Subject. By the same Act therefore, whereby any one unites his Person, which was before free, to any Commonwealth; by the same he unites his Possessions, which were before free, to it also; and they become, both of them, Person and Possession, subject to the Government and Dominion of that Commonwealth, as long as it hath a being. Who-ever therefore, from thenceforth, by Inheritance, purchases Permission, or otherwise enjoys any part of the Land, so annext to, and under the Government of that Commonweal, must take it with the Condition it is under; that is, of submitting to the Government of the Commonwealth, under whose Jurisdiction it is, as far forth, as any Subject of it.",
      "translation_ja": "第120節　この点をよく理解するため、誰でも初めてある国家の一員となるとき、そこへ加わることによって、自分が今持ち、またはこれから手に入れる財産のうち、すでにほかの政府に属していないものを、同じ共同体に付属させ、その権限の下に置くことを考えるとよい。財産を守り律するために他人と共に社会に入りながら、自分もその土地の所有権もその社会の政府に服し、土地の所有は社会の法に律せられるべきであるのに、自分の土地だけはその政府の管轄を免れると考えるのは、まっこうから矛盾するからである。したがって、以前は自由だった自分自身をある国家に加える行為が、そのまま、以前は自由だった財産をそこへ加える行為となる。人と財産はともに、その国家が存続するかぎり、その統治と支配に服するようになる。だから、その後、相続や購入、許可その他によって、そうして国家のもとに加わり、その政府に服する土地のどこかを享受する人は、誰であれ、その土地に伴う条件を受け入れなくてはならない。すなわち、土地を管轄する国家の政府に、ほかの臣民と同じ限度で服することである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s121",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:177",
          "printed_page": "343",
          "source_sequence": 146
        }
      ],
      "source_text": "121. But since the Government has a direct Jurisdiction only over the Land, and reaches the Possessor of it, (before he has actually incorporated himself in the Society) only as he dwells upon, and enjoys that: the Obligation any one is under, by Virtue of such Enjoyment, to submit to the Government, begins and ends with the Enjoyment; so that when-ever the Owner, who has given nothing but such a tacit Consent, to the Government, will, by Donation, Sale, or otherwise, quit the said Possession: He is at liberty to go and incorporate himself into any other Commonwealth, or agree with others to begin a new one, in vacuis locis, in any part of the World they can find free and unpossessed: whereas he that has once, by actual Agreement, and any express Declaration, given his Consent to be of any Commonweal, is perpetually and indispensably obliged to be, and remain unalterably a Subject to it, and can never be again in the liberty of the state of Nature; unless, by any Calamity, the Government, he was under, comes to be dissolved.",
      "translation_ja": "第121節　しかし、政府の直接の管轄は土地にしか及ばない。所有者については、その人が実際に社会に加わっていないうちは、そこに住んでその土地を利用する限りにおいてしか及ばない。だから利用によって政府に服する義務は、その利用とともに始まり、それとともに終わる。したがって政府に暗黙の同意しか与えていない所有者は、贈与や売却その他の方法でその土地を手放すなら、いつでも自由に出て、ほかの国家に加わることも、世界のどこか、誰のものにもなっていない空いた土地を見つけ、他の人と合意して、新しい国家を始めることもできる。それに対し、実際の取り決めと明示の表明によって、一度ある国家に属する同意を与えた者は、永久に必ずその臣民であり続けるよう拘束される。何らかの災厄によってその政府が解体しないかぎり、ふたたび自然状態の自由に戻ることはできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s122",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:178",
          "printed_page": "344",
          "printed_page_end": "345",
          "source_sequence": 147
        }
      ],
      "source_text": "122. But submitting to the Laws of any Countrey; living quietly, and enjoying Priviledges and Protection under them, makes not a Man a Member of that Society; 'tis only a local Protection and Homage due to, and from all those, who, not being in a state of War, come within the Territories belonging to any Government, to all parts whereof the force of its Law extends. But this no more makes a Man a Member of that Society, a perpetual Subject of that Commonwealth; than it would make a Man a Subject to another in whose Family he found it convenient to abide for some time; though, whilst he continued in it, he were obliged to comply with the Laws, and submit to the Government he found there. And thus we see, that Foreigners, by living all their Lives under another Government, and enjoying the Priviledges and Protection of it, though they are bound, even in Conscience, to submit to its Administration, as far forth as any Denison; yet do not thereby come to be Subjects or Members of that Commonwealth. Nothing can make any Man so, but his actually entering into it by positive Engagement, and express Promise and Compact. This is that, which I think, concerning the beginning of Political Societies, and that Consent which makes any one a Member of any Commonwealth.",
      "translation_ja": "第122節　しかし、ある国の法に従い、平穏に暮らし、その法の下で特権と保護を享受しても、そのことがその人を社会の成員にするわけではない。それはただ、政府と戦争状態にないまま、その領域に入る者のすべてに対して、土地に限った保護が与えられ、その代わりに服従が求められるということにすぎない。その政府の法の効力は、領域のどの部分にも及ぶからである。しかし、それによって社会の成員、その国家の永久の臣民になるわけではない。しばらく身を寄せるのに都合のよい家を見つけても、家にいる間はそこで見いだした規則を守り、そこにある統治に従う義務を負うとはいえ、そのために家の主人の臣民になるわけではないのと同じである。したがって外国人は、よその政府のもとで一生暮らしてその特権と保護を享受すれば、市民権を認められた人と同じ程度に、良心の上でも政府の運用に従う義務を負うが、それだけでその国家の臣民や成員にはならない。現にその社会に入り、明確に誓約し、明示で約束と取り決めを交わすこと以外には、これを可能にするものはない。政治社会の起源と、誰かをある国家の成員とする同意について、私はこのように考える。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-09",
      "section_id": "ch-09",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",

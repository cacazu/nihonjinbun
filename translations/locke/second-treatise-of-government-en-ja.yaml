      ],
      "source_text": "35. 'Tis true, in Land that is common in England, or any other Country, where there is plenty of people under Government, who have Money and commerce, no one can inclose or appropriate any part, without the consent of all his Fellow-Commoners: Because this is left common by Compact, i. e. by the Law of the Land, which is not to be violated. And though it be Common, in respect of some Men, it is not so to all Mankind; but is the joint propriety of this Country, or this Parish. Besides, the remainder, after such inclosure, would not be as good to the rest of the Commoners as the whole was, when they could all make use of the whole; whereas in the beginning and first peopling of the great Common of the World, it was quite otherwise. The Law Man was under was rather for appropriating. God Commanded, and his wants forced him to labour. That was his Property which could not be taken from him whereever he had fixed it. And hence subduing or cultivating the Earth, and having Dominion, we see, are join'd together. The one gave Title to the other. So that God, by commanding to subdue, gave Authority so far to appropriate. And the Condition of humane Life, which requires labour and materials to work on, necessarily introduce private Possessions.",
      "translation_ja": "第35節　もっとも、イングランドなど、政府の下で貨幣を使い、商取引をする人が多く暮らす国の共有地では、仲間である共有者全員の同意なしには、誰もその一部を囲い込み、自分のものにすることはできない。そこは取り決めによって、すなわち侵してはならないその国の法によって、共有のままにされているからである。共有とはいっても、一部の人の共有であり、全人類の共有ではない。その国、あるいはその教区の共同財産なのである。そのうえ、一部が囲い込まれて残った土地は、全員が全体を使えていたときほど、残りの共有者の役に立たない。ところが、世界という広大な共有地に人が住み始めたころは、事情がまるで違った。人を律する法は、むしろ自分のものとすることを促したのである。神が命じ、人自身の必要に迫られて、人は労働した。労働によって自らのものとした物は、どこで手に入れたのであれ、その人の財産となり、奪い取られるいわれはなかった。こうして見ると、大地を従わせ、耕すことと、土地に支配権を持つことは結びついている。一方が他方の根拠となる権原を与える。だから、大地を従わせよという神の命令は、そのかぎりで土地を自分のものにしてよいという権限をも認めたのである。そして人間の暮らしには労働が要り、その労働を施す対象が要る。この暮らしの条件から、私有は必然的に生まれる。",
      "translation_status": "reviewed"
    },

      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:144",
          "printed_page": "276",
          "printed_page_end": "278",
          "source_sequence": 74
        }
      ],
      "source_text": "59. This holds in all the Laws a Man is under, whether natural or civil. Is a man under the Law of Nature? what made him free of that Law? what gave him a free disposing of his Property, according to his own Will, within the compass of that Law? I answer, an Estate wherein he might be suppos'd capable to know that Law, that so he might keep his Actions within the Bounds of it. When he has acquired that state, he is presumed to know how far that Law is to be his Guide, and how far he may make use of his Freedom, and so comes to have it; till then, some body else must guide him, who is presumed to know how far the Law allows a Liberty. If such a state of Reason, such an Age of Discretion made him free, the same shall make his Son free too. Is a Man under the Law of England? what made him free of that Law? that is, to have the Liberty to dispose of his Actions and Possessions, according to his own Will, within the Permission of that Law? A capacity of knowing that Law. Which is supposed, by that Law, at the Age of Twenty one, and in some cases sooner. If this made the Father free, it shall make the Son free too. Till then, we see, the Law allows the Son to have no Will, but he is to be guided by the Will of his Father or Guardian, who is to understand for him. And if the Father die, and fail to substitute a Deputy in this Trust, if he hath not provided a Tutor to govern his Son, during his Minority, during his Want of Understanding, the Law takes care to do it; some other must govern him, and be a Will to him, till he hath attained to a state of Freedom, and his Understanding be fit to take the Government of his Will. But after that, the Father and Son are equally free, as much as Tutor and Pupil, after Nonage; equally Subjects of the same Law together, without any Dominion left in the Father, over the Life, Liberty, or Estate of his Son, whether they be only in the State, and under the Law of Nature, or under the positive Laws of an Establish'd Government.",
      "translation_ja": "第59節　これは、人が服する自然法にも、市民の法にも当てはまる。自然法の下にいる人が、その法の下で自由になるのは何によってか。その範囲で、自らの意志によって財産を自由に取り扱えるのは何によってか。私の答えは、その法を知り、行為をその限度内に保てると思われる状態になったから、である。その段階に達すれば、どこまで法に導かれ、どこまで自由を使えるかを知っていると見込まれ、自由を手にする。それまでは、法がどこまで自由を認めるかを知っていると見込まれる他人が、導かなければならない。このようにある程度理性が備わり、分別のある年齢に達することによって父が自由だったのなら、同じことによってその息子も自由になる。イングランド法の下にいる人が、その法の下で自由になるのは何によってか。言い換えれば、法が認める範囲で行為や財産を意のままに取り扱えるのは、何によってか。その法を知る能力によってである。その法では、二十一歳になれば、一部の場合にはそれより早く、その能力があると見込む。父がこれによって自由になったなら、息子もこれによって自由になる。それまでは、法は息子に独立した意志を認めず、父か後見人の意志に導かれ、代わりに分別を働かせてもらうよう求めている。父がこの務めを託す代理人を決めずに死に、息子が未成年で分別を欠く間、導いてくれる後見人を置かなかったなら、法がその手配をする。自由な状態に達し、自らの分別が自分の意志を導けるようになるまで、誰かが代わりに導き、意志の役を果たさねばならない。だがその後は、父も息子も、成年に達した者とその後見人と同じように、等しく自由だ。ともに等しく同じ法の下にあり、父には息子の命、自由、財産を支配する力は残らない。二人がただ自然状態にあって自然法の下にいるか、確立した政府の実定法の下にいるかで、違いはない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s060",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"

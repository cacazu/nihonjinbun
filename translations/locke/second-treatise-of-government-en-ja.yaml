    {
      "id": "locke-s095",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:164",
          "printed_page": "316",
          "source_sequence": 117
        }
      ],
      "source_text": "95. MEN being, as has been said, by Nature, all free, equal and independent; no one can be put out of this Estate, and subjected to the Political Power of another, without his own Consent, which is done by agreeing, with other Men, to join and unite into a Community, for their comfortable, safe, and peaceable living, one amongst another, in a secure Enjoyment of their Properties, and a greater Security against any that are not of it. This any number of Men may do, because it injures not the Freedom of the rest; they are left, as they were, in the Liberty of the state of Nature. When any number of Men have so consented to make one Community or Government, they are thereby presently incorporated, and make one Body Politick, wherein the Majority have a Right, to act and conclude the rest.",
      "translation_ja": "第95節　すでに述べたように、人はみな生まれながらに自由で平等で独立している。それゆえ、自らの同意なしに、その状態から離れさせられ、他人の政治権力に服させられることはない。これが起きるのは、人々が互いに快適に、安全に、平和に暮らし、財産を安心して享受し、外の者に対してはより確かな安全を得るため、ほかの人々と共に一つの共同体に入り、結びつくことに合意するときである。何人でも、これはできる。ほかの人々の自由を害さないからである。その人々は、以前と変わらず、自然状態の自由にとどめられる。何人であれ、人々がこうして一つの共同体または政府を作ることに同意すると、その場で一体となり、一つの政治体を成す。その中では、多数者に行動する権利があり、その決定は残りの者を拘束する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s096",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:164",
          "printed_page": "316",
          "printed_page_end": "317",
          "source_sequence": 118
        }
      ],
      "source_text": "96. For when any number of Men, have by the consent of every individual, made a Community, they have thereby made that Community one Body, with a power to act as one Body, which is only by the will and determination of the majority. For that which acts any Community, being only the consent of the individuals of it, and it being one Body must move one way; it is necessary the Body should move that way whither the greater force carries it, which is the consent of the majority: or else it is impossible it should act or continue one Body, one Community, which the consent of every individual that united into it, agreed that it should; and so every one is bound by that consent to be concluded by the majority. And therefore we see, that in Assemblies impowred to act by positive Laws where no number is set, by that positive Law which impowers them, the act of the majority passes for the act of the whole, and of course determines, as having by the Law of Nature and Reason, the power of the whole.",
      "translation_ja": "第96節　何人かの人々が、一人ひとりの同意で共同体を作るとき、その共同体を、一つの体として行動する力を持つ一つの体にしている。そして一体として動けるのは、多数者の意志と決定によってだけである。というのも、共同体を動かすものは、その成員一人ひとりの同意のほかにない。一つの体である以上、同じ方へ動かなくてはならないから、いっそう大きな力の運ぶ方、すなわち多数者の同意の示す方へ動く必要がある。そうでなければ、一つの体、一つの共同体として動き、あり続けることができない。ところがそれこそ、結びついた各人が同意したことである。だから、誰もがその同意によって、多数者の決定に従う義務を負う。したがって、実定法から行動する権限を授けられた議会で、その権限を授けた実定法自体に必要な人数の定めがなければ、多数者の行為が全体の行為として通用し、当然に結論を決める。自然法と理性の法によって、全体の力を備えているからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s097",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:164",
          "printed_page": "317",
          "printed_page_end": "318",
          "source_sequence": 119
        }
      ],
      "source_text": "97. And thus every Man by consenting with others to make one Body Politick, under one Government, puts himself under an obligation to every one of that Society, to submit to the determination of the majority, and to be concluded by it; or else this original Compact, whereby he with others incorporates into one Society, would signifie nothing, and be no Compact if he be left free, and under no other ties than he was in before in the state of Nature. For what appearance would there be of any Compact? What new engagement, if he were no farther tied by any Decrees of the Society, than he himself thought fit, and did actually consent to? This would be still as great a liberty as he himself had before his Compact, or any one else in the state of Nature, who may submit himself and consent to any acts of it if he thinks fit.",
      "translation_ja": "第97節　こうして、ほかの人と一緒に、一つの政府の下で一つの政治体を作ることに同意する人は、その社会の一人ひとりに対して、多数者の決定に従い、これに拘束される義務を自分に課す。そうでなければ、その人が他人と一つの社会にまとまるそもそもの取り決めは、何の意味もなくなる。自然状態にいたときと同じ自由があり、それ以上の何の絆もないままなら、取り決めらしいものはない。結局、自分がよいと思い、現に同意した限度でしか社会の決定に縛られないなら、どこが取り決めで、何を新たに約束したことになるのか。取り決め以前にその人が持っていたのと同じだけの自由が、依然として残ることになる。自然状態の誰でも、よいと思えば、その社会のどんな行為にも、自ら従い、同意できるのだから。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s098",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:165",
          "printed_page": "318",
          "printed_page_end": "319",
          "source_sequence": 120
        }
      ],
      "source_text": "98. For if the consent of the majority shall not in reason be received as the act of the whole, and conclude every individual; nothing but the consent of every individual can make any thing to be the act of the whole, which, considering the infirmities of health, and avocations of business, which in a number, though much less than that of a Commonwealth, will necessarily keep many away from the publick Assembly; and the variety of Opinions and contrariety of interests which unavoidably happen in all Collections of Men, 'tis next impossible ever to be had. And therefore if coming into Society be upon such terms, it will be only like Cato's coming into the Theatre, tantum at exiret. Such a Constitution as this would make the mighty Leviathan of a shorter duration than the feeblest Creatures; and not let it outlast the day it was born in, which cannot be suppos'd till we can think that rational Creatures should desire and constitute Societies only to be dissolved. For where the majority cannot conclude the rest, there they cannot act as one Body; and consequently, will be immediately dissolved again.",
      "translation_ja": "第98節　理性に照らして、多数者の同意が全体の行為として認められず、一人ひとりを拘束しないとすれば、あることを全体の行為にできるのは、一人残らず同意したときだけになる。だが国家よりはるかに小さな集まりでも、病気や仕事で公の集会に来られない人が大勢いるのは避けられないし、人が集まれば、意見はさまざまで利害も衝突せざるをえない。これを考えれば、全員の同意はまず得られない。それなのに、そのような条件で社会に入るというなら、カトーが劇場に入ったのと同じで、ただ出ていくために入るにすぎない。このような構成では、あの強大なリヴァイアサンの寿命も、最もか弱い生き物より短く、生まれたその日を越せまい。理性のある生き物が、解散するためだけに社会を望み、設立すると考えないかぎり、そんな想定はできない。多数者が残りを拘束できないところでは、一体として動けず、たちまちまた解体してしまうからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s099",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:165",
          "printed_page": "319",
          "source_sequence": 121
        }
      ],
      "source_text": "99. Whosoever therefore, out of a state of Nature, unite into a Community, must be understood to give up all the power necessary to the ends for which they unite into Society, to the majority of the Community, unless they expresly agreed in any number greater than the majority. And this is done by barely agreeing to unite into one political Society, which is all the Compact that is, or needs be, between the individuals that enter into or make up a Commonwealth. And thus that which begins and actually constitutes any Political Society, is nothing but the consent of any number of Freemen capable of majority, to unite and incorporate into such a Society. And this is that, and that only, which did or could give beginning to any lawful Government in the World.",
      "translation_ja": "第99節　したがって、自然状態を出て一つの共同体に結びつく者は誰でも、単純過半数を超える賛成が必要だと明示の取り決めをしていないかぎり、社会に結びつく目的のために必要な力をすべて、共同体の多数者に譲ると理解すべきである。これには、一つの政治社会にまとまることに同意するだけで足りる。それが、国家に入るか、国家を作る個人のあいだの取り決めのすべてであり、ほかには必要ない。このように、政治社会を始め、現に作るものは、多数を決められるだけの自由人が、そのような社会に結びつき、まとまることに同意することにほかならない。この世の正当な政府を始めた、あるいは始めうるものは、これであり、ただこれだけである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s100",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:165",
          "printed_page": "319",
          "printed_page_end": "320",
          "source_sequence": 122
        }
      ],
      "source_text": "100. To this I find two Objections made. 1. That there are no instances to be found in story, of a Company of Men independant and equal one amongst another, that met together, and in this way began and set up a Government. 2. 'Tis impossible of right that Men should do so; because all Men being born under Government, they are to submit to that, and are not at liberty to begin a new one.",
      "translation_ja": "第100節　これには二つの反論がある。一、互いに独立し、平等な人々が集まって、このようなやり方で政府を始め、設けた実例は、歴史上どこにも見当たらない。二、正当な権利からいって、人々にそんなことができるはずはない。誰でも生まれたときにはすでに何らかの政府の下にある以上、それに従わなくてはならず、新たな政府を始める自由はないからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s101",
      "section_id": "ch-08",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:166",
          "printed_page": "320",
          "printed_page_end": "321",
          "source_sequence": 123
        }
      ],
      "source_text": "101. To the first, there is this to Answer, That it is not at all to be wonder'd that History gives us but a very little account of Men that lived together in the state of Nature. The inconveniencies of that condition, and the love and want of Society, no sooner brought any number of them together, but they presently united and incorporated, if they designed to continue together. And if we may not suppose Men ever to have been in the state of Nature, because we hear not much of them in such a state; we may as well suppose the Armies of Salmanasser, or Xerxes, were never Children, because we hear little of them till they were Men, and imbodied in Armies. Government is every where antecedent to Records, and Letters seldom come in amongst a People till a long continuation of Civil Society, has by other more necessary arts, provided for their Safety, Ease and Plenty. And then they begin to look after the History of their Founders, and search into their original when they have outlived the memory of it. For 'tis with Commonwealths as with particular Persons, they are commonly ignorant of their own Births and Infancies: and if they know any thing of it, they are beholding for it to the accidental Records that others have kept of it. And those that we have of the beginning of any Polities in the World, excepting that of the Jews, where God himself immediately interpos'd, and which favours not at all Paternal Dominion; are all either plain instances of such a beginning as I have mentioned, or at least have manifest footsteps of it.",
      "translation_ja": "第101節　第一の反論には、こう答えられる。自然状態で共に暮らした人々について歴史がほとんど何も語らないのは、少しも不思議ではない。その境遇の不都合、そして社会を求め、必要とする心から人々が寄り集まると、一緒に暮らし続けるつもりなら、たちまち結びつき、一体となったのである。その状態にある人の話をあまり聞かないから、人が自然状態にいたはずはないと言うのなら、シャルマネセルやクセルクセスの軍勢も、大人になって軍隊をなすまではほとんど知られていなかったから、子どもだったことなどないと考えてもよいことになる。どこでも政府が記録に先立つ。市民社会が長く続き、まずほかのもっと必要な技を手に入れ、安全と安楽と豊かさを備えるまで、文字がその国民の間に入ることはめったにない。国を築いた人々の歴史を調べ、自分たちの起源を探り始めるのは、その記憶がすでに失われてからである。国も一人の人と同じで、自分の誕生や幼い時期については、たいてい知らない。何か知っているとすれば、それは人がたまたま残していた記録のおかげである。世界の政治体の起源について私たちが持つ記録は、ユダヤ人の例を別にすれば、すべて私が述べたような起源の明らかな実例か、少なくともそのはっきりした跡をとどめている。ユダヤ人には神自らが直接に介入したが、それも父としての支配を少しも裏づけるものではない。",
      "translation_status": "reviewed"
    },

          "printed_page": "364",
          "source_sequence": 173
        }
      ],
      "source_text": "141. Fourthly, The Legislative cannot transfer the Power of making Laws to any other hands, for it being but a delegated Power from the People, they who have it cannot pass it over to others. The People alone can appoint the Form of the Commonwealth, which is by Constituting the Legislative, and appointing in whose hands that shall be. And when the People have said, We will submit, and be govern'd by Laws made by such Men, and in such Forms; no Body else can say other Men shall make Laws for them: nor can they be bound by any Laws but such as are Enacted by those whom they have Chosen, and Authorised to make Laws for them.",
      "translation_ja": "第141節　第四に、立法機関は法律を制定する力を、ほかの誰の手にも移すことはできない。この力は人民から委ねられたものにすぎず、持っている者が他人に譲ってよいものではないからだ。国家の形を定められるのは、人民だけである。立法機関を設け、どの手に立法権を置くのかを決めることで、人民は国家の形を定める。人民が、これこれの人がこれこれの手続きで定めた法律に従い、その下に治められる、と表明したとき、ほかの者が人民のために法律を作るべきだとは、誰にも言えない。人民は、自分たちが選び、自分たちのために法を作る権限を与えた者が定めた法のほかには、いかなる法にも拘束されない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s142",
      "section_id": "ch-11",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:188",
          "printed_page": "364",
          "printed_page_end": "365",
          "source_sequence": 174
        }
      ],
      "source_text": "142. These are the Bounds which the trust that is put in them by the Society, and the Law of God and Nature, have set to the Legislative Power of every Commonwealth, in all Forms of Government: First, They are to govern by promulgated establish'd Laws, not to be varied in particular Cases, but to have one Rule for Rich and Poor, for the Favourite at Court, and the Country Man at Plough. Secondly, These Laws also ought to be designed for no other end ultimately but the good of the People. Thirdly, They must not raise Taxes on the Property of the People, without the Consent of the People, given by themselves, or their Deputies. And this properly concerns only such Governments where the Legislative is always in being, or at least where the People have not reserv'd any part of the Legislative to Deputies, to be from time to time chosen by themselves. Fourthly, Legislative neither must nor can transfer the Power of making Laws to any Body else, or place it any where but where the People have.",
      "translation_ja": "第142節　以上が、統治の形が何であれ、社会から託された信任と、神と自然の法が、どの国家の立法権にも課した限度である。第一に、公布され確立された法律で治めること。個々の事例ごとに法を変えず、富める者と貧しい者、宮廷の寵臣と畑を耕す農民に、一つの規則を適用する。第二に、これらの法は、結局は人民の利益だけを目的とすべきである。第三に、人民自身かその代理人が与えた人民の同意なしに、人民の財産に税を課してはならない。この点が厳密に関わるのは、立法機関が常設されている政府、または少なくとも、人民が時々自ら選ぶ代表者のために、立法権の一部を留保することもない政府だけである。第四に、立法機関は、法を制定する力をほかの誰かに移してはならず、移すこともできない。また、人民がその力を置いたところ以外に置くこともできない。",
      "translation_status": "reviewed"
    },
    {

          "printed_page": "245",
          "printed_page_end": "246",
          "source_sequence": 40
        }
      ],
      "source_text": "27. Though the Earth, and all inferior Creatures be common to all Men, yet every Man has a Property in his own Person. This no Body has any Right to but himself. The Labour of his Body, and the Work of his Hands, we may say, are properly his. Whatsoever then he removes out of the State that Nature hath provided, and left it in, he hath mixed his Labour with it, and joined to it something that is his own, and thereby makes it his Property. It being by him removed from the common state Nature placed it in, it hath by this labour something annexed to it, that excludes the common right of other Men. For this labour being the unquestionable Property of the Labourer, no Man but he can have a right to what that is once joined to, at least where there is enough, and as good left in common for others.",
      "translation_ja": "第27節　大地も下等な生き物もすべての人の共有だが、各人は自分自身に対する所有権を持つ。これに権利を有するのは本人だけである。身体を使って行う労働も、手を動かしてした仕事も、正しくその人自身のものだと言ってよい。そこで、自然が用意したままに置いたものを、そこから自分が取り出すとき、そのものに自分の労働を混ぜ合わせ、自分に属する何かを付け加える。こうしてそれはその人の財産となる。自然が置いた共有の状態から取り出されたものには、その労働によって、ほかの人たちに共通だった権利を排する何かが付け加わる。労働は疑いもなく働いた者自身のものなのだから、いったんそれが付け加えられたものに権利を持ちうるのは、働いた当人のほかにない。少なくとも、ほかの人々の共有に、同じように良いものが十分残されている場合はそうである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s028",
      "section_id": "ch-05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:129",
          "printed_page": "246",
          "printed_page_end": "247",
          "source_sequence": 41
        }
      ],
      "source_text": "28. He that is nourished by the Acorns he pickt up under an Oak, or the Apples he gathered from the Trees in the Wood; has certainly appropriated them to himself. No Body can deny but the nourishment is his. I ask then, when did they begin to be his? When he digested? or when he eat? Or when he boiled? Or when he brought them home? Or when he pickt them up? And 'tis plain, if the first gathering made them not his, nothing else could. That labour put a distinction between them and common. That added something to them more than Nature, the common Mother of all, had done; and so they became his private right. And will any one say he had no right to those Acorns or Apples he thus appropriated, because he had not the consent of all Mankind to make them his? Was it a Robbery thus to assume to himself what belonged to all in Common? If such a consent as that was necessary, Man had starved, notwithstanding the Plenty God had given him. We see in Commons, which remain so by Compact, that 'tis the taking any part of what is common, and removing it out of the state Nature leaves it in, which begins the Property; without which the Common is of no use. And the taking of this or that part, does not depend on the express consent of all the Commoners. Thus the Grass my Horse has bit; the Turfs my Servant has cut; and the Ore I have dig'd in any place where I have a right to them in common with others, become my Property, without the assignation or consent of any body. The labour that was mine, removing them out of that common state they were in, hath fixed my Property in them.",
      "translation_ja": "第28節　オークの木の下で拾ったドングリや、森の木からもいだリンゴで腹を満たした人は、確かにそれらを自分のものにしている。その滋養がその人のものだということは、誰も否定できまい。ではいつからその人のものになったのか。消化したときか。食べたときか。煮たときか。家に持ち帰ったときか。それとも拾いあげたときか。最初に手に取ったことによってその人のものにならなかったなら、ほかの何をしてもその人のものにはならなかったことは明らかだ。この労働が、それらと共有のものとの区別をつけた。万人の母なる自然がしてくれたことに、何かを付け加えたのである。だからその人の私的な権利の対象になった。それを自分のものにするため全人類の同意を得ていなかったからといって、そうして手にしたドングリやリンゴに何の権利もないと言う人がいるだろうか。万人の共有だった物をこうして自分のものにすることは、強奪だったのか。そのような同意が必要だったなら、神がいくら豊かに与えてくれたとしても、人は飢え死にしただろう。取り決めによって共有のままに置かれている土地でも、共有物の一部を取り、自然のままの状態から取り除くときに、その物への所有権が生じる。それがなければ、共有地は何の役にも立たない。そしてこの部分、あの部分を取るのに、共有するすべての人の明示の同意は要らない。だから私の馬が食んだ草、私の使用人が切り出した芝土、私がほかの人と共有する権利のある土地から掘り出した鉱石は、誰にも割り当ててもらわず、同意も得ずに、私の財産になる。共有の状態からそれらを取り除いた、私の労働が、それらに対する私の所有権を定めたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s029",
      "section_id": "ch-05",

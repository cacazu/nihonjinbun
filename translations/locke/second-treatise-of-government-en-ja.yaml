      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:148",
          "printed_page": "285",
          "printed_page_end": "287",
          "source_sequence": 82
        }
      ],
      "source_text": "67. The subjection of a minor places in the Father a temporary Government, which terminates with the minority of the Child. And the honour due from a Child, places in the Parents a perpetual right to respect, reverence, support and compliance to more, or less, as the Father's care, cost and kindness, in his Education, has been more or less. And this ends not with minority, but holds in all parts and conditions of a Man's Life. The want of distinguishing these two powers which the Father hath in the right of tuition, during minority, and the right of honour all his Life, may perhaps have caused a great part of the mistakes about this matter. For to speak properly of them, the first of these is rather the priviledge of Children, and duty of Parents, than any Prerogative of Paternal Power. The nourishment and Education of their Children, is a Charge so incumbent on Parents for their Childrens good, that nothing can absolve them from taking care of it. And though the power of commanding and chastising them go along with it, yet God hath woven into the principles of humane nature, such a tenderness for their Off-spring, that there is little fear that Parents should use their power with too much rigour; the excess is seldom on the severe side, the strong biass of nature drawing the other way. And therefore God Almighty, when he would express his gentle dealing with the Israelites, he tells them, that though he chasten'd them, he chasten'd them as a man chastens his Son, Deut. 8. 5. i. e. with tenderness and affection, and kept them under no severer discipline than what was absolutely best for them; and had been less kindness to have slacken'd. This is that power to which Children are commanded obedience, that the pains and care of their Parents may not be increased, or ill rewarded.",
      "translation_ja": "第67節　子が未成年のあいだ従うことで、父はその子が未成年でなくなるまで、一時的に導く力を持つ。他方、子が敬意を払うべきであることは、親に、尊重され、敬われ、支えられ、その意向を汲んでもらう永続的な権利を与える。ただしその程度は、父が教育にどれほど気を配り、費用をかけ、親切にしたかによって異なる。これは成年になって終わるのではなく、人生のどの時期、どんな境遇にも及ぶ。未成年のあいだの養育の権利と、子の生涯にわたって敬われる権利という、父が持つこの二つの力を区別しなかったために、この問題について、多くの誤りが生じたのかもしれない。厳密に言えば、第一のものは、父権の特権というより、子どもの特権、そして親の義務である。子のためにその子を養い教育することは、親に課された務めであり、何があっても世話を免れない。命令し、しつける権力もこれに伴うが、神は、人間の本性の根に、わが子への深い優しさを織り込んだ。だから、親がこの権力を厳しすぎるほど振るう心配はほとんどない。自然の強い傾きは反対に働くので、行き過ぎるとしても、厳しすぎることはめったにない。それゆえ全能の神は、イスラエルの民をどれほど優しく扱ったかを語ろうとして、彼らを懲らしめたとはいえ、人が自分の子をしつけるようにしつけた、と言う（『申命記』8章5節）。すなわち、優しさと愛情をもって、彼らにとってどうしても必要な以上の厳しいしつけはしなかった。それを緩めていれば、かえって親切ではなかったのだ。子が従えと命じられているのは、この権力についてである。親の骨折りと世話をこれ以上増やさず、またそれに悪い報いを返さないためである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s068",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:149",
          "printed_page": "287",
          "printed_page_end": "288",
          "source_sequence": 83
        }
      ],
      "source_text": "68. On the other side, honour and support all that which gratitude requires to return; for the benefits received by and from them is the indispensible duty of the Child, and the proper priviledge of the Parents. This is intended for the Parents advantage, as the other is for the Childs; though Education, the Parents duty, seems to have most power, because the ignorance and infirmities of Childhood, stand in need of restraint and correction; which is a visible exercise of Rule, and a kind of Dominion. And that duty which is comprehended in the word honour, requires less obedience, though the obligation be stronger on grown than younger Children. For who can think the Command, Children obey your Parents, requires in a Man that has Children of his own, the same submission to his Father, as it does in his yet young Children to him; and that by this Precept, he were bound to obey all his Father's Commands, if out of a conceit of authority he should have the indiscretion to treat him still as a Boy.",
      "translation_ja": "第68節　他方、親を敬い、支えること、すなわち親から、また親を通じて受けた恩恵に報いるため、感謝が求めるあらゆることは、子の避けられない義務で、親に固有の特権である。先の場合が子のためだったように、これは親のためである。もっとも、親の義務である教育の方が強い権力を伴うように見える。幼い子は無知で弱く、制止や矯正を必要とし、それは目に見える形で導くこと、つまり一種の支配だからである。「敬う」という言葉に含まれる義務は、大きくなった子に対する方が幼い子に対するより重いのに、求める服従の程度は小さい。「子どもたちよ、両親に従いなさい」という命令が、すでに子を持つ者に対し、その幼い子が本人に従うのと同じように、父に服従することを求めると、誰が考えられよう。父が自分の権威を思い込み、分別を欠いて、なおも息子を少年扱いするなら、この教えにより、息子は父の命令すべてに従わなければならなくなるではないか。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s069",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:150",
          "printed_page": "288",
          "printed_page_end": "289",
          "source_sequence": 84
        }
      ],
      "source_text": "69. The first part then of Paternal Power, or rather Duty, which is Education, belongs so to the Father, that it terminates at a certain season; when the business of Education is over it ceases of it self; and is also alienable before. For a Man may put the tuition of his Son in other hands; and he that has made his Son an Apprentice to another, has discharged him, during that time, of a great part of his Obedience, both to himself and to his Mother. But all the duty of honour, the other part, remains never the less entire to them; nothing can cancel that. It is so inseparable from them both, that the Father's Authority cannot dispossess the Mother of this right, nor can any Man discharge his Son from honouring her that bore him. But both these are very far from a power to make Laws, and inforceing them with Penalties, that may reach Estate, Liberty, Limbs and Life. The power of Commanding ends with Non-age; and though after that, honour and respect, support and defence, and whatsoever gratitude can oblige a Man to, for the highest benefits he is naturally capable of, be always due from a Son to his Parents; yet all this puts no Scepter into the Father's hand, no Soveraign Power of Commanding. He has no Dominion over his Sons property or actions, nor any right that his Will should prescribe to his Sons in all things; however it may become his Son in many things, not very inconvenient to him and his Family, to pay a Deference to it.",
      "translation_ja": "第69節　したがって、父権、いやむしろ父の義務の第一の部分である教育は、父の務めではあるが、決まった時期に終わる。教育の仕事が終われば、おのずと消える。また、それ以前に他人に委ねることもできる。父は息子の教育を他人の手に任せられるし、息子を他人のもとへ徒弟として出した者は、その期間、父自身にも母にも従う義務の大部分から息子を解いている。だが、もう一方の、敬う義務は、父母に対して変わらず、すべて残る。何ものも、これを取り消せない。それほど父母の双方に切り離せずに属するので、父の権威によっても母からこの権利を奪うことはできず、誰も、自分を産んだ母を敬う義務から息子を免れさせることはできない。しかしそのどちらも、法律を制定し、財産、自由、身体、命にまで及ぶ刑罰によって守らせる権力とは、遠く隔たっている。命じる権力は未成年期の終わりと共に尽きる。その後も息子は、親に敬意と尊重、扶養と保護、また人が自然に受けうる最大の恩恵に対して感謝が求めるあらゆることを、いつも果たすべきである。だがこれらはすべて、父の手に王笏を握らせるものではなく、命令する主権を与えはしない。父には息子の財産や行為に対する支配権がなく、何でも自分の意志によって息子に指図する権利はない。もっとも息子の方からは、自分と家族によほど不都合でなければ、多くの事柄で父の意向を尊重するのがふさわしい。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s070",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:150",
          "printed_page": "289",
          "source_sequence": 85
        }
      ],
      "source_text": "70. A Man may owe honour and respect to an ancient or wise Man; defence to his Child or Friend; relief and support to the distressed; and gratitude to a Benefactor; to such a degree, that all he has, all he can do, cannot sufficiently pay it. But all these give no Authority, no right of making Laws to any one over him from whom they are owing. And 'tis plain, all this is due, not to the bare title of Father; not only because, as has been said, it is owing to the Mother too: but because these obligations to Parents, and the degrees of what is required of Children, may be varied by the different care and kindness, trouble and expence, is often imployed upon one Child more than another.",
      "translation_ja": "第70節　年長者や賢者には敬意と尊敬を、自分の子や友人には保護を、困っている者には救いや援助を、恩人には感謝を、人は負うことがある。持てるすべてを差し出し、できることをすべてしても、払いきれないほどかもしれない。だが、それらはいずれも、相手に権威を与えたり、その恩を負う人を律する法を定める権利を与えたりしない。こうしたことが父という名だけによって果たされるべきでないのは明らかだ。すでに述べたように母にも負うからだけではない。親に対する義務や、子に求められることの程度は、どれほど世話を焼き、親切にし、苦労し、費用をかけたかによって違い、きょうだいの一人には他よりも多くの労がかけられることがよくあるからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s071",
      "section_id": "ch-06",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:150",
          "printed_page": "289",
          "printed_page_end": "290",
          "source_sequence": 86
        }
      ],
      "source_text": "71. This shews the reason how it comes to pass, that Parents in Societies, where they themselves are Subjects, retain a power over their Children, and have as much right to their Subjection, as those who are in the state of Nature, which could not possibly be, if all political Power were only paternal, and that, in truth, they were one and the same thing: for then, all paternal Power being in the Prince, the Subject could naturally have none of it; but these two Powers, political and paternal, are so perfectly distinct and separate, and built upon so different Foundations, and given to so different Ends, that every Subject, that is a Father, has as much a paternal Power over his Children, as the Prince has over his. And every Prince that has Parents, owes them as much filial Duty and Obedience, as the meanest of his Subjects do to theirs; and can therefore contain, not any part or degree of that kind of Dominion, which a Prince, or Magistrate has over his Subject.",
      "translation_ja": "第71節　以上から、親自身も臣民である社会で、親がなお子どもへの権力を保ち、自然状態の親と同じだけ、子の服従を求める権利を持つ理由が分かる。すべての政治権力が父の権力にすぎず、実は両者が一つの同じものであれば、これはありえない。その場合、父の権力はすべて君主の手にあるので、臣民が自然にその一部を持つはずはないからだ。ところが政治権力と父の権力とは、まったく違う別個のもので、まったく異なる土台の上に築かれ、まったく異なる目的のために与えられている。だから、父である臣民は誰でも、君主が自分の子に持つのと同じだけの父としての権力を、自分の子に対して持つ。また、親のある君主は誰でも、その最も身分の低い臣民が親に対して負うのと同じだけの、子としての義務と服従を、自分の親に負う。したがって父の権力には、君主や公職にある者が臣民に対して持つたぐいの支配は、いささかも含まれえない。",
      "translation_status": "reviewed"
    },

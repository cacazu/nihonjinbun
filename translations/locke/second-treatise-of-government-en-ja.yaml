          "precision": "page",
          "anchor": "tcp:96077:220",
          "printed_page": "429",
          "source_sequence": 248
        }
      ],
      "source_text": "208. Fourthly, But if the unlawful acts, done by the Magistrate, be maintained, (by the Power he has got) and the remedy, which is due by Law, be, by the same Power, obstructed; ye[?] the Right of resisting, even in such manifest Acts of Tyranny, will not suddenly, or on slight occasions, disturb the Government. For if it reach no farther than some private Mens Cases, though they have a right to defend themselves, and to recover, by force, what, by unlawful force, is taken from them; yet the Right to do so, will not easily ingage them in a Contest, wherein they are sure to perish: It being as impossible, for one or a few oppressed Men, to disturb the Government, where the Body of the People do not think themselves concerned in it, as for a raving mad Man, or heady Male content to overturn a well setled State; the People being as little apt to follow the one, as the other.",
      "translation_ja": "第208節　第四に、公職者が手にした力で、自らの不法な行いを押し通し、法によって受けられるはずの救済をも妨げたとしよう。これほど明白な圧政に対する抵抗の権利であっても、突然に、あるいはささいなことで政府を乱すものではない。何人かの私人の事案より先に及ばなければ、彼らには自分を守り、不法な力で奪われたものを力で取り返す権利があっても、必ず身を滅ぼす争いに、その権利がたやすく彼らを引き込むわけではない。人民全体が自分に関わると思わないところで、一人か何人かの圧迫された人が政府を乱すのは、荒れ狂う人や向こう見ずな不平家が、よく治まった国家を覆すのと同じほど不可能である。人民は、そうした不平家を支持しないのと同じく、少数の圧迫された人々についていくこともないからだ。",
      "translation_status": "reviewed",
      "issues": [

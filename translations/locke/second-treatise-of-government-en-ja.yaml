      ],
      "source_text": "74. To conclude then, though the Father's Power of commanding, extends no farther than the Minority of his Children, and to a degree only fit for the Discipline, and Government of that Age. And though that Honour and Respect, and all that which the Latins called Piety, which they indispensibly owe to their Parents all their Life times, and in all estates, with all that Support and Defence, is due to them, gives the Father no Power of governing, i. e. making Laws and exacting Penalties on his Children. Though by this he has no Dominion over the Property or Actions of his Son; yet 'tis obvious to conceive, how easie it was, in the first Ages of the World, and in places still where the thinness of People gives Families leave to separate into unpossessed Quarters, and they have room to remove and plant themselves in yet vacant habitations, for the Father of the Family to become the Prince of it; he had been a Ruler from the Beginning of the infancy of his Children, and when they were grown up: since without some Government it would be hard for them to live together, it was likelyest it should, by the express or tacit Consent of the Children, be in the Father, where it seemed, without any change, barely to continue. And when indeed nothing more was required to it, than the permitting the Father to exercise alone, in his Family, that executive Power of the Law of Nature, which every Free-man naturally hath, and by that Permission resigning up to him a Monarchical Power, whilst they remained in it. But that this was not by any paternal Right, but only by the Consent of his Children, is evident from hence, That no Body doubts but if a Stranger, whom Chance or Business had brought to his Family, had there kill'd any of his Children, or committed any other Fact, he might condemn and put him to Death, or otherwise have punished him as well as any of his Children, which was impossible he should do by virtue of any paternal Authority, over one who was not his Child; but by virtue of that executive Power of the Law of Nature, which, as a Man, he had a right to: and he alone could punish him in his Family, where the Respect of his Children had laid by the Exercise of such a Power, to give way to the Dignity and Authority they were willing should remain in him above the rest of his Family.",
      "translation_ja": "第74節　まとめると、父が命じる権力は、子の未成年期を越えず、またその年齢のしつけと指導にふさわしい限度を越えない。子が生涯、どんな境遇でも親に負う敬意と尊重、ラテン人が孝敬と呼んだもののすべてと、親に負う援助と保護も、子を統治する権力、すなわち子に法を定め、罰を科す権力を父に与えるものではない。このため父は、子の財産や行動に支配権を持たない。それでも世界の初期に、あるいは今でも人が少なく、家族同士が分かれてまだ誰のものでもない地へ移り、空いた場所に住めるところで、家の父がその家の君主になりやすかったのは、考えてみれば明らかだ。子らが乳飲み子であった初めから、彼は子を導いてきた。子らが成人しても、何らかの統治なしに一緒に暮らすことは難しい。ならば、明示であれ暗黙であれ、子らの同意によって、やはり父にその権力があるのが最もありそうなことであり、何も変わらず、ただ以前のまま続くように見えた。それに実際、そこに必要なのは、自由人なら誰でも生まれながら持つ自然法の執行権を、一家の中では父一人が行使することを許し、ともに暮らす間は、その許しによって君主としての権力を父に譲ることだけであった。だがこれは父である者の権利ではなく、ただ子らの同意による。それは次のことからも明らかだ。たまたま、あるいは用があって一家に来たよそ者が、そこで子の一人を殺したり、その他の犯罪を犯したりした場合には、父は自分の子に対してと同じように、その者に死罪を宣告し、執行し、あるいは別の罰を科せると誰も疑わない。それは、自分の子ではない者に父としての権威を振るうことでできたはずはない。一人の人として権利を持つ、自然法の執行権によってできたのである。また、自分の一家にあっては、父一人がその者を罰することができた。子らは父を敬い、一家のほかの者にまさる威厳と権威を父に残そうと、この種の力を自ら行使しなかったからである。",
      "translation_status": "reviewed"
    },

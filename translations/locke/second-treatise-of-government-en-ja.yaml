      "source_text": "37. This is certain, That in the beginning, before the desire of having more than Men needed, had altered the intrinsick value of things, which depends only on their usefulness to the Life of Man; or had agreed, that a little piece of yellow Metal, which would keep without wasting or decay, should be worth a great piece of Flesh, or a whole heap of Corn; though Men had a Right to appropriate, by their Labour, each one to himself, as much of the things of Nature, as he could use: yet this could not be much, nor to the Prejudice of others, where the same plenty was still left, to those who would use the same Industry.",
      "translation_ja": "第37節　少なくとも次のことは確かである。必要以上に持ちたいという欲望が、人の暮らしに役立つ度合いだけで決まる物の本来の価値を変えたり、目減りも腐りもしない黄色い金属の小片が、大きな肉の塊や山ほどの穀物と同じ値打ちだと人々が取り決めたりする前には、人は自然の恵みのうち、自分で使えるだけを、労働によって自分のものとする権利を持っていた。だが、それはたいした量になりえなかったし、同じように働こうとする人には、同じだけの豊かさがなお残されていたのだから、他人に不利益を与えることもなかった。",

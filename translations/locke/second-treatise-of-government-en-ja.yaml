      "source_text": "228. But if they who say it lays a foundation for Rebellion, mean that it may occasion civil Wars, or intestine Broils, to tell the People they are absolved from Obedience, when illegal attempts are made upon their Liberties or Properties, and may oppose the unlawful violence of those who were their Magistrates when they invade their Properties, contrary to the trust put in them; and that therefore this Doctrine is not to be allow'd, being so destructive to the Peace of the World. They may as well say upon the same ground, that honest Men may not oppose Robbers or Pirars, because this may occasion disorder or bloodshed. If any mischief come in such Cases, it is not to be charged upon him who defends his own right, but on him that invades his Neighbours. If the innocent honest Man, must quietly quit all he has for Peace sake, to him who will lay violent hands upon it, I desire it may be consider'd, what a kind of Peace there will be in the World, which consists only in Violence and Rapine; and which is to be maintain'd only for the benefit of Robbers and Oppressors. Who would not think it an admirable Peace betwixt the Mighty and the Mean, when the Lamb, without resistance, yielded his Throat to be torn by the imperious Wolf? Polyphemus's Den gives us a perfect Pattern of such a Peace. Such a Government wherein Vlysses and his Companions had nothing to do, but quietly to suffer themselves to be devour'd. And no doubt, Vlysses, who was a prudent Man, preach'd up Passive Obedience, and exhorted them to a quiet Submission, by representing to them of what concernment Peace was to Mankind; and by shewing the inconveniencies might happen, if they should offer to resist Polyphemus, who had now the Power over them.",
      "translation_ja": "第228節　とはいえ、反乱の土台を築くという人たちが、こういう意味で言うのだとしよう。すなわち、人民の自由や財産を不法に侵す企てがなされれば、人民は従う義務を免れ、かつて公職にあった者が託された信任に反して財産を侵せば、その不法な暴力に抗しうる、と人民に告げることが、内戦や内紛を招きかねない。だから、世の平和をこうも壊しかねない説は認めてはならない、と。だが同じ理由なら、正直な人は強盗や海賊に抵抗してはならない、混乱や流血を引き起こしかねないから、と言ってもよいだろう。この場合に何か害が生じても、自分の権利を守る者でなく、隣人の権利を侵す者が責めを負う。落ち度のない正直者が、平和のために、自分の持つすべてを、暴力で手を出す者へ黙って渡さなければならないなら、それは、いったいどんな世の平和なのか、考えてほしい。暴力と略奪だけから成り、強盗と圧制者の利益だけのために保たれる平和なのである。横暴なオオカミが喉を食い裂くのに、子羊が抵抗一つせず身を任せるとき、強い者と弱い者の間に結ばれた、なんとすばらしい平和だと、誰が思わないだろう。ポリュペモスの洞窟は、そんな平和の完全な見本である。そこでは、オデュッセウスと仲間たちに、黙って食われるのを許すよりほかにできることはなかった。思慮深いオデュッセウスは、きっと無抵抗の服従を説き、平和が人類にどれほど大切か、いま力を握るポリュペモスに抗おうものなら、どんな不都合が起こりうるかを説明して、静かに屈服するよう皆に勧めたことだろう。",
      "translation_status": "reviewed"

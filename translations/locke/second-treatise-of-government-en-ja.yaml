        }
      ],
      "source_text": "136. Secondly, The Legislative, or Supream Authority, cannot assume to its self a power to Rule by extemporary Arbitrary Decrees, but is bound to dispense Justice, and decide the Rights of the Subject by promulgated standing Laws, and known Authoris'd Judges. For the Law of Nature being unwritten, and so no where to be found but in the minds of Men, they who through Passion or Interest, shall mis-cite, or misapply it, cannot so easily be convinced of their mistake where there is no establish'd Judge: and so it serves not as it ought, to determine the Rights, and fence the Properties of those that live under it, especially where every one is Judge, Interpreter, and Executioner of it too, and that in his own Case: and he that has right on his side, having ordinarily but his own single strength, hath not force enough to defend himself from Injuries, or punish Delinquents. To avoid these Inconveniencies which disorder Mens Properties in the state of Nature, Men unite into Societies, that they may have the united strength of the whole Society to secure and defend their Properties, and may have standing Rules to bound it, by which every one may know what is his. To this end it is that Men give up all their natural power to the Society they enter into, and the Community put the Legislative Power into such hands as they think fit, with this trust, that they shall be govern'd by declared Laws, or else their Peace, Quiet and Property, will still be at the same uncertainty as it was in the state of Nature.",
      "translation_ja": "第136節　第二に、立法機関、すなわち最高の権威であっても、それだけで、その場かぎりの恣意的な布告によって治める力を、自らのものにはできない。公布された恒常的な法律と、権限を持つことが周知の裁判官によって、正義を行い、臣民の権利を裁かなければならない。自然法は書かれておらず、人の心のほかにはどこにも見つからない。このため、情念や利害から自然法を誤って引いたり適用したりする人に、正式な裁判官がいなければ、そうたやすく間違いを納得させられない。そのため、そこで暮らす人々の権利を定め、財産を守るという本来の役割を、自然法は果たさない。とりわけ、誰もが、自然法の裁判官で、解釈者で、執行者でもあり、しかも自分の事件でそうなのだから、なおさらである。正しい側の人も、普通は自分一人の力しか持たず、被害から自分を守ったり、違反者を罰したりする力が足りない。自然状態で人々の財産を乱すこうした不都合を避けるために、人は社会にまとまり、社会全体の力を合わせて財産を守り、保全できるようにする。また、所有の範囲を定め、誰でも自分のものが何かを知るための恒常的な規則を持つようにする。この目的で、人は自分の自然の力をすべて、加わる社会へ譲る。共同体は立法権をふさわしいと思う者の手に置き、公にされた法によって統治するという信任を託す。さもなければ、平和も平穏も財産も、自然状態にあったのと同じように、なお不確かなままである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-n09",
      "section_id": "ch-11",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

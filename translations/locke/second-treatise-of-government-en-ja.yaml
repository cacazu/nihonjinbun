      "source_text": "14. 'Tis often asked as a mighty Objection, where are, or ever were, there any Men in such a State of Nature? To which it may suffice as an answer at present; That since all Princes and Rulers of Independant Governments all through the World, are in a State of Nature, 'tis plain the World never was, nor never will be, without numbers of Men in that State, I have named all Governors of Independent Communities whether they are, or are not, in League with others; For 'tis not every compact, that puts an end to the State of Nature between Men, but only this one of agreeing together mutually to enter into one Community, and make one body Politic, other promises and compacts, Men may make one with another, and yet still be in the State of Nature. The promises and bargains for Truck, &c. Between the two Men, in Soldania, in or between, a Swiss and an Indian, in the Woods of America are binding to them, though they are perfectly in a State of Nature, in reference to one another for Truth, and keeping of Faith belongs to Men, as Men, and not as Members of Society.",
      "translation_ja": "第14節　重大な反論としてよく尋ねられるのは、そんな自然状態にある人間が今どこにいるのか、今までにいたのか、ということだ。当面はこう答えれば十分だろう。世界中の独立した政府の君主や統治者はすべて自然状態にあるのだから、その状態の人が大勢いることは、昔も今もこれからも変わらない。私は、他と同盟していようといまいと、独立した共同体のすべての統治者を挙げた。どんな取り決めでも人と人との自然状態を終わらせるわけではない。同じ共同体に入り、一つの政治体をつくることに互いに同意する、この取り決めだけがそうするのである。ほかの約束や契約なら、人は自然状態にとどまったまま、互いに交わすことができる。ソルダニアの二人の間であれ、アメリカの森でスイス人と先住民が出会ってであれ、物々交換などの約束や取引は、互いに関して完全に自然状態にある人々をも拘束する。真実を述べ、約束を守ることは、人間が社会の一員だからではなく、人間だからこそ負う義務である。",
      "translation_status": "reviewed"
    },

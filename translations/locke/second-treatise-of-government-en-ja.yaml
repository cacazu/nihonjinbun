      "source_text": "5. This equality of Men by Nature, the Judicious Hooker looks upon as so evident in it self, and beyond all question, that he makes it the Foundation of that Obligation to mutual Love amongst Men, on which he Builds the Duties they owe one another, and from whence he derives the great Maxims of Iustice and Charity. His words are; The like natural inducement, hath brought Men to know that it is no less their Duty, to Love others then themselves, for seeing those things which are equal, must needs all have one measure; If I cannot but wish to receive good, even as much at every Mans hands, as any Man can wish unto his own Soul, how should I look to have any part of my desire herein satisfied, unless my self be careful to satisfie the like desire, which is undoubtedly in other Men weak, being of one and the same nature; to have any thing offered them repugnant to this desire, must needs in all respects grieve them as much as me, so that if I do harm, I must look to suffer, there being no reason that others should shew greater measure of love to me, then they have, by me, shewed unto them; my desire therefore to be loved of my equals in nature, as much as possible may be, imposeth upon me a natural Duty of bearing to themward, fully the like affection; From which relation of equality between our selves and them, that are as our selves, what several Rules and Canons, natural reason hath drawn for direction of life, no Man is Ignorant. Eccl. Pol. Li. 1.",
      "translation_ja": "第5節　賢明なフッカーによれば、人間が自然に平等であることは、それ自体あまりにも明白で、議論の余地がない。だから彼は、人がお互いを愛さなければならない義務をこの平等の上に置き、そこから互いに果たすべき義務を組み立て、正義と慈愛の大原則を引き出す。彼はこう述べている。「同じ自然の導きによって、人は、自分を愛するのと同じように他人を愛する義務があることを知るに至った。等しいものには、みな同じ尺度を当てなければならないからである。私は誰からも、各人が自分自身に望みうるのと同じだけの善意を受けたいと願わずにはいられない。同じ人間である以上、他の人にも間違いなくある同じ願いをかなえるよう、自分から心がけなければ、その願いが少しでもかなうと、どうして期待できようか。この願いに反することをされれば、他の人もどの点でも私と同じだけ苦しむはずである。だから私が害をなせば、自分も害を受けると思わなければならない。私が人に示した以上の愛情を、人が私に示す理由などないからだ。だから、自然において私と等しい者たちに、できるかぎり愛されたいと望むなら、私は彼らに、まったく同じ愛情を抱く自然の義務を負う。自然の理性が、私たちと私たちに等しい人とのこうした関係から、日々の生き方を導くために、さまざまな規則や規範を導き出したことは、知らぬ者もない。」（『教会統治の法』第一巻）",
      "translation_status": "reviewed"
    },

      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:210",
          "printed_page": "408",
          "printed_page_end": "410",
          "source_sequence": 222
        }
      ],
      "source_text": "184. But supposing the Charge and Damages of the War are to be made up to the Conquerour, to the utmost Farthing, and that the Children of the vanquished, spoiled of all their Father's Goods, are to be left to starve, and perish[?] yet the satisfying of what shall, on this score, be due to the Conquerour, will scarce give him a Title to any Countrey he shall conquer. For the Damages of War can scarce amount to the value of any considerable Tract of Land, in any part of the World, where all the Land is possessed, and none lies waste. And if I have not taken away the Conquerour's Land, which, being vanquished, it is impossible, I should; scarce any other spoil I have done him can amount to the value of mine, supposing it of an extent any way coming near what I had over-run of his, and equally cultivated too. The destruction of a Years Product or two, (for it seldom reaches four or five) is the utmost spoil that usually can be done. For as to Money, and such Riches and Treasure taken away, these are none of Natures Goods, they have but a phantastical imaginary value, Nature has put no such upon them. They are of no more account by her standard, than the Wampompeke of the Americans to an European Prince, or the Silver Money of Europe would have been formerly to an American. And five years Product is not worth the perpetual Inheritance of Land, where all is possessed, and none remains waste, to be taken up by him that is disseiz'd: which will be easily granted, if one do but take away the imaginary value of Money, the disproportion being more than between five, and five thousand. Though, at the same time, half a years product is more worth than the Inheritance, where there being more Land than the Inhabitants possess and make use of, any one has liberty to make use of the waste: But there Conquerours take little care to possess themselves of the Lands of the vanquished. No damage therefore, that Men, in the state of Nature (as all Princes and Governments are in reference to one another) suffer from one another, can give a Conquerour Power to dispossess the Posterity of the vanquished, and turn them out of that Inheritance which ought to be the Possession of them, and their Descendants to all Generations. The Conquerour indeed will be apt to think himself Master. And 'tis the very condition of the subdued not to be able to dispute their Right: But, if that be all, it gives no other Title, than what bare Force gives to the stronger over the weaker. And, by this reason, he that is strongest will have a right to whatever he pleases to seize on.",
      "translation_ja": "第184節　しかし仮に、戦争の費用と損害を、わずかな端数に至るまで征服者に償い、敗者の子どもには、父の財物を何一つ残さず、飢え死にするに任せるとしよう。それでも、これを理由に征服者が受け取るべき額をすべて満たすことで、征服した国の権原を得られることは、まずない。すべての土地が所有され、荒れ地の残っていない世界のどこの地域であれ、戦争の損害が相当な広さの土地の価値に達することは、まずないからだ。もし私が征服者の土地を奪っていなければ（私は敗者なのだから、奪っているはずがない）、ほかにどんな損害を相手に与えていても、私の土地の価値に達するとは考えにくい。かつて私が相手側で踏みにじった土地と、こちらの土地とが、同じくらい耕され、広さもいくらか近いとした場合はそうである。普通に加えうる損害は、一年か二年の産物を失わせるのがせいぜいで、四年、五年分に及ぶことはめったにない。奪った貨幣や宝物、財宝などは、自然が与えた財とは違い、人が思い描いて認めた価値しかない。自然はそこに何の価値も与えなかった。自然の尺度では、アメリカ先住民の貝玉がヨーロッパの君主にとって、またかつてヨーロッパの銀貨がアメリカの人にとって、どれほどの値打ちもなかったのと同じである。すべての土地が所有され、追い出された者が手にできる荒れ地がないなら、五年間の収穫でも、土地を代々受け継ぐ価値には等しくない。貨幣の架空の価値を除けば、容易に認められるはずだ。その隔たりは、五と五千の隔たりよりも大きい。一方で、住民が所有し利用しているより土地が広く、誰でも手つかずの土地を使えるところでは、半年の収穫でも土地を受け継ぐ以上の価値がある。しかしそういうところでは、征服者も敗者の土地を手に入れることには、ほとんど関心を示さない。だから、自然状態において人が人から受けるどんな損害も（君主や政府はすべて、互いにそうした状態にある）、敗者の子孫から所有物を取り上げ、その人々とこれからの子孫に代々属すべき相続財産から追い出す力を、征服者に与えることはできない。征服者はもちろん、自分が主人だと考えがちである。屈服させられた側は、自分たちの権利を言い立てられないのが、その境遇そのものなのだ。だが、それだけであれば、強い者が弱い者に対して裸の力で得る以上の権原は、少しも得られない。それを道理とするなら、最も強い者は、思いどおりに奪うものすべてに、権利を持つことになる。",

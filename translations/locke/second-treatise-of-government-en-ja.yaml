          "anchor": "tcp:96077:178",
          "printed_page": "345",
          "source_sequence": 148
        }
      ],
      "source_text": "CHAP. IX. Of the Ends of Political Society and Government.",
      "translation_ja": "第九章　政治社会と政府の目的について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s123",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:178",
          "printed_page": "345",
          "printed_page_end": "346",
          "source_sequence": 149
        }
      ],
      "source_text": "123. IF Man in the state of Nature be so free as has been said; If he be absolute Lord of his own Person and Possessions, equal to the greatest, and subject to no Body, why will he part with his Freedom, this Empire, and subject himself to the Dominion and Controul of any other Power? To which 'tis obvious to Answer, that though in the state of Nature he hath such a right, yet the Enjoyment of it is very uncertain, and constantly exposed to the Invasion of others; for all being Kings as much as he, every Man his Equal, and the greater part no strict Observers of Equity and Justice; the enjoyment of the property he has in this state is very unsafe, very unsecure. This makes him willing to quit this Condition, which however free, is full of fears and continual dangers: and 'tis not without reason, that he seeks out, and is willing to join in Society with others who are already united, or have a mind to unite for the mutual preservation of their Lives, Liberties and Estates, which I call by the general name, Property.",
      "translation_ja": "第123節　自然状態で人がこれまで述べたほど自由であるなら、つまり、最も偉い者にも等しく、誰にも服さず、自分自身と持ち物の絶対的な主人であるなら、なぜその自由と支配を手放し、何かほかの権力の支配や規制に身を置くのだろうか。答えは明らかである。自然状態でそのような権利を持っていても、それを現に享受できるかはたいへん不確かで、絶えず他人からの侵害にさらされる。誰もが自分と同じように王であり、どんな人も自分に等しく、しかも大部分は公平や正義を厳密に守る者ではない。この状態で持つ財産を享受することはとても危うく、何の保障もないのである。そのため人は、自由ではあっても、恐れと絶え間ない危険に満ちた、この境遇を去ろうとする。そして、生命と自由と所有物、私がまとめて財産と呼ぶものを互いに保全するために、すでに結びついた人、あるいは結びつこうとする人を探し、進んで社会に加わろうとする。これはもっともなことである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s124",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:179",
          "printed_page": "346",
          "source_sequence": 150
        }
      ],
      "source_text": "124. The great and chief end therefore, of Mens uniting into Commonwealths, and putting themselves under Government, is the preservation of their Property. To which in the state of Nature there are many things wanting.",
      "translation_ja": "第124節　したがって、人が国家にまとまり、政府のもとに入る最大の、第一の目的は、財産を保全することにある。自然状態ではこれを果たすために、多くのものが欠けている。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s124-p01",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:179",
          "printed_page": "346",
          "source_sequence": 151
        }
      ],
      "source_text": "First, There wants an establish'd, setled, known Law, received and allowed by common consent to be the Standard of Right and Wrong, and the common measure to decide all Controversies between them. For though the Law of Nature be plain and intelligible to all rational Creatures; yet Men being biassed by their interest, as well as ignorant for want of study of it, are not apt to allow of it as a Law binding to them in the application of it to their particular Cases.",
      "translation_ja": "第一に、確立され、一定していて、誰もが知る法がない。共通の同意によって、正と不正の規準であり、人々の間のあらゆる争いを裁く共通の尺度だと受け入れられ、認められている法である。自然法は理性のあるすべての者にとって明らかで分かりやすい。しかし人は自分の利害に引かれ、また自然法を学んでいないために無知でもある。だから、個々の自分の事案に適用するときにまで、自分を拘束する法としてこれを認めようとはしないのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s125",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:179",
          "printed_page": "346",
          "printed_page_end": "347",
          "source_sequence": 152
        }
      ],
      "source_text": "125. Secondly, In the State of Nature there wants a known and indifferent Judge, with Authority to determine all differences according to the established Law. For every one in that state being both Judge and Executioner of the Law of Nature, Men being partial to themselves, Passion and Revenge is very apt to carry them too far, and with too much heat in their own Cases, as well as negligence and unconcernedness, make them too remiss in other Mens.",
      "translation_ja": "第125節　第二に、自然状態には、確立された法に従い、あらゆる争いを決める権限を持つ、誰もが知る、偏りのない裁判官がいない。その状態では、誰もが自然法の裁判官であり、また執行者でもあるからだ。人は自分にひいきするので、自分の事件では激情や復讐心に駆られ、熱くなりすぎて度を越す。逆に、他人の事件では、怠慢や無関心から甘くなりすぎる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s126",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:179",
          "printed_page": "347",
          "source_sequence": 153
        }
      ],
      "source_text": "126. Thirdly, In the state of Nature there often wants Power to back and support the Sentence when right, and to give it due Execution. They who by any Injustice offended, will seldom fail, where they are able, by force to make good their Injustice; such resistance many times makes the punishment dangerous, and frequently destructive to those who attempt it.",
      "translation_ja": "第126節　第三に、自然状態では、判決が正しいときに、その判決を裏づけて支え、しかるべく執行する力が足りないことが多い。不正を働いた者は、力があれば、力ずくで自分の不正を押し通そうとするのが普通だ。その抵抗によって、罰を科すことはしばしば危険になり、実行しようとする者は、しばしば身を滅ぼす。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s127",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:179",
          "printed_page": "347",
          "printed_page_end": "348",
          "source_sequence": 154
        }
      ],
      "source_text": "127. Thus Mankind, notwithstanding all the Priviledges of the state of Nature, being but in an ill condition while they remain in it, are quickly driven into Society. Hence it comes to pass, that we seldom find any number of Men live any time together in this State. The inconveniencies that they are therein exposed to, by the irregular and uncertain exercise of the Power every Man has of punishing the transgressions of others, make them take Sanctuary under the establish'd Laws of Government, and therein seek the preservation of their Property. 'Tis this makes them so willingly give up every one his single power of punishing to be exercised by such alone as shall be appointed to it amongst them; and by such Rules as the Community, or those authorised by them, to that purpose shall agree on. And in this we have the original right and rise of both the Legislative and Executive Power, as well as of the Governments and Societies themselves.",
      "translation_ja": "第127節　こうして、自然状態の特権をすべて持ちながらも、人類はそこにいる間は恵まれない境遇であるため、すぐに社会へと追いやられる。だから、多数の人々がいくらかの間、自然状態で共に暮らすのは、めったに見られない。誰もが他人の違反を処罰する力を、規則もなく不確かに振るうため、そこで人々は不都合にさらされる。そこで政府が確立した法のもとに庇護を求め、その中で財産を保全しようとする。だからこそ人々は、個々に罰する力を進んで手放し、自分たちの中でそのために任命された者だけに行使させ、また共同体か、その目的で共同体が権限を与えた者が合意する規則に従わせようとする。ここに立法権と執行権の、また政府や社会そのものの、正当な根拠と起源がある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s128",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:180",
          "printed_page": "348",
          "source_sequence": 155
        }
      ],
      "source_text": "128. For in the state of Nature, to omit the liberty he has of innocent delights, a Man has two Powers. The first is to do whatsoever he thinks fit for the preservation of himself and others within the permission of the Law of Nature; by which Law, common to them all, he and all the rest of Mankind, are one Community, make up one Society distinct from all other Creatures, and were it not for the corruption and vitiousness of degenerate Men, there would be no need of any other, no necessity that Men should separate from this great and natural Community, and associate into lesser Combinations. The other power a Man has in the state of Nature, is the power to punish the Crimes committed against that Law. Both these he gives up when he joins in a private, if I may so call it, or particular Political Society, and incorporates into any Commonwealth, separate from the rest of Mankind.",
      "translation_ja": "第128節　自然状態では、罪のない楽しみを味わう自由は別にして、人に二つの力がある。第一は、自然法の許す範囲で、自分と他人を保全するためによいと思うことを何でもする力である。万人に共通するこの法によって、本人もほかの人類も、一つの共同体となり、ほかのあらゆる生き物と区別された一つの社会を成す。堕落した人々の腐敗と悪がなければ、それ以外の社会は必要なく、この大きな自然の共同体から分かれ、より小さな集団に結びつく必要もない。自然状態で人が持つもう一つの力は、その法に対して犯された罪を罰する力である。言ってよければ、私的な、あるいは個別の政治社会に加わり、ほかの人類とは分かれたある国家の一員となるとき、その人はこの両方の力を手放す。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s129",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:180",
          "printed_page": "348",
          "printed_page_end": "349",
          "source_sequence": 156
        }
      ],
      "source_text": "129. The first power, viz. of doing whatsoever he thought fit for the preservation of himself, and the rest of Mankind, he gives up to be regulated by Laws made by the Society, so far forth as the preservation of himself and the rest of that Society shall require; which Laws of the Society in many things confine the liberty he had by the Law of Nature.",
      "translation_ja": "第129節　第一の力、つまり自分とほかの人類を保全するために自らよいと思ったことは何でもできる力を、自分とその社会のほかの人々の保全が求めるかぎりで、手放し、社会の定めた法律の規律に委ねる。社会の法律は、多くの事柄で、その人が自然法のもとで持っていた自由を狭める。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s130",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:180",
          "printed_page": "349",
          "source_sequence": 157
        }
      ],
      "source_text": "130. Secondly, The power of punishing he wholly gives up, and engages his natural force, which he might before imploy in the Execution of the Law of Nature, by his own single Authority, as he thought fit, to assist the Executive Power of the Society, as the Law thereof shall require. For being now in a new State, wherein he is to enjoy many Conveniencies from the labour, assistance and society of others in the same Community, as well as protection from its whole strength; he is to part also with as much of his natural liberty, in providing for himself, as the good, prosperity and safety of the Society shall require; which is not only necessary but just, since the other Members of the Society do the like.",
      "translation_ja": "第130節　第二に、罰する力はすっかり手放す。またかつて、自然法を執行するのに、自分だけの権威で、よいと思うとおりに用いることのできた自然の力を、社会の法が求めるとおり、その社会の執行権を助けるために差し出すと約束する。今や新しい状態にあり、同じ共同体にいる他の人々の労働や助力や交わりから多くの便宜を得るばかりでなく、共同体の総力に守られるのだから、自分のために備える自然の自由も、社会の利益、繁栄、安全が要求するだけ、手放さなくてはならない。それは必要なばかりか、公正でもある。社会のほかの成員も同じようにするからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s131",
      "section_id": "ch-09",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:180",
          "printed_page": "349",
          "printed_page_end": "350",
          "source_sequence": 158
        }
      ],
      "source_text": "131. But though Men when they enter into Society, give up the Equality, Liberty, and Executive Power they had in the state of Nature, into the hands of the Society, to be so far disposed of by the Legislative, as the good of the Society shall require; yet it being only with an intention in every one, the better to preserve himself, his Liberty and Property. (For no rational Creature can be supposed to change his condition with an intention to be worse) the power of the Society, or Legislative, constituted by them, can never be suppos'd to extend farther than the common good; but is obliged to secure every ones Property by providing against those three defects above-mentioned, that made the state of Nature so unsafe and uneasy. And so whoever has the Legislative or supream Power of any Commonwealth, is bound to govern by establish'd standing Laws, promulgated and known to the People, and not by Extemporary Decrees; By indifferent and upright Judges, who are to decide Controversies by those Laws. And to imploy the force of the Community at home, only in the Execution of such Laws, or abroad to prevent or redress Foreign Injuries, and secure the Community from Inroads and Invasion. And all this to be directed to no other end, but the Peace, Safety, and publick good of the People.",
      "translation_ja": "第131節　人は社会に入ると、自然状態で持っていた平等と自由と執行権を社会の手に委ね、社会の利益が求める限度で立法機関に扱わせる。だがそれは、一人ひとりが、自分自身と自由と財産をよりよく守るためにすることである。理性のある生き物が、自分の境遇を今より悪くするつもりで境遇を変えるとは思えない。それゆえ、彼らが設けた社会や立法機関の権力が、共通の利益を超えて及ぶとは決して考えられない。むしろそれは、自然状態をあれほど危うく不安にした、先の三つの欠落に備え、一人ひとりの財産を守る義務を負う。だから、どんな国家であれ、立法権、すなわち最高権力を持つ者は、人民に公布され、知られている確立した恒常的な法律で統治し、その場かぎりの命令では統治してはならない。公平で廉直な裁判官を通じて、その法律によって争いを裁かなければならない。そして共同体の力を国内で用いるのは、そのような法を執行するためだけであり、国外で用いるのは、外からの侵害を防ぎ、または正し、共同体を襲撃や侵入から守るためである。これらすべては、人民の平和、安全、公共の利益以外の、何の目的にも向けられてはならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-10",
      "section_id": "ch-10",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:181",
          "printed_page": "351",
          "source_sequence": 159
        }
      ],
      "source_text": "CHAP. X. Of the Forms of a Commonwealth.",
      "translation_ja": "第十章　国家の諸形態について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s132",
      "section_id": "ch-10",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:181",
          "printed_page": "351",
          "printed_page_end": "352",
          "source_sequence": 160
        }
      ],
      "source_text": "132. THE Majority having, as has been shew'd, upon Mens first uniting into Society, the whole power of the Community, naturally in them, may imploy all that power in making Laws for the Community from time to time, and Executing those Laws by Officers of their own appointing; and then the Form of the Government is a perfect Democracy: Or else may put the power of making Laws into the hands of a few select Men, and their Heirs or Successors; and then it is an Oligarchy: Or else into the hands of one Man, and then it is a Monarchy: If to him and his Heirs, it is an Hereditary Monarchy: If to him only for Life, but upon his Death the Power only of nominating a Successor, to return to them; an Elective Monarchy. And so accordingly of these make compounded and mixed Forms of Government, as they think good. And if the Legislative Power be at first given by the Majority to one or more Persons only for their Lives, or any limited time, and then the Supream Power to revert to them again; when it is so reverted, the Community may dispose of it again anew into what hands they please, and so constitute a new Form of Government. For the Form of Government depending upon the placing the Supream Power, which is the Legislative, it being impossible to conceive, that an inferiour Power should prescribe to a Superiour, or any but the Supream make Laws, According as the Power of making Laws is placed, such is the Form of the Commonwealth.",
      "translation_ja": "第132節　すでに示したとおり、人々が最初に社会にまとまる際、共同体の全権力は当然その多数者にある。多数者は、その全権力を用い、必要に応じて共同体のための法律を定め、自ら任命した公職者を通じて執行することができる。この場合、政体は完全な民主政である。あるいは法律を定める権力を、選ばれた少数者と、その相続人や後継者の手に置くこともできる。その場合、寡頭政である。またそれを一人の手に置くこともでき、この場合は君主政である。その人と相続人に与えれば世襲君主政であり、その人の生涯にだけ与え、死にあたって後継者を指名する力だけが多数者に戻るなら、選挙君主政である。こうして、これらを組み合わせ、混ぜ合わせて、よいと思う政体を作ることもできる。もし多数者が立法権を、一人または複数の者に、その生涯か、あるいは何らかの一定期間にかぎって与え、のちに最高権力を再び自分たちのもとへ戻すとするなら、権力が戻ったとき、共同体はその権力を好きな者の手に改めて置き、新しい政体を定めることができる。政体は、立法権という最高権力をどこに置くかで決まるからである。下位の権力が上位の権力に規則を与え、また最高の権力以外のものが法を定めることなど、考えようがない。したがって、法を定める権力がどこに置かれているかによって、国家の形が決まる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s133",
      "section_id": "ch-10",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:182",
          "printed_page": "352",
          "source_sequence": 161
        }
      ],
      "source_text": "133. By Commonwealth, I must be understood all along to mean, not a Democracy, or any Form of Government, but any Independent Community which the Latins signified by the word Civitas, to which the word which best answers in our Language, is Commonwealth, and most properly expresses such a Society of Men, which Community does not, For there may be subordinate Communities in a Government; and City much less; and therefore to avoid ambiguity, I crave leave to use the word Commonwealth in that sence; in which sense I find the word used by K. Iames himself, which I think to be its genuine signification; which if any Body dislike, I consent with him to change it for a better.",
      "translation_ja": "第133節　ここまで私が「国家」と言うとき、民主政や何らかの政体ではなく、ラテン人がキウィタスと呼んだ、独立の共同体のどれをも指すと受け取ってほしい。私たちの言葉でそれによく当てはまり、そのような人間の社会を最も正確に表すのがコモンウェルス、ここでいう「国家」である。単に「共同体」と言うだけでは、政府の下に従属する共同体もありうるし、「都市」ではなおさら当てはまらない。そこで、意味がまぎれないよう、コモンウェルスをこの意味で使うことを許してほしい。ジェームズ王自身も、この意味でこの言葉を使っている。私はこれが本来の意味だと思うが、誰かが気に入らないと言うのなら、もっとよい言葉に替えることに同意する。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-ch-11",

          "printed_page": "235",
          "printed_page_end": "236",
          "source_sequence": 27
        }
      ],
      "source_text": "16. THE State of War is a State of Enmity and Destruction; And therefore declaring by Word or Action, not a passionate and hasty, but sedate setled Design, upon another Mans Life, puts him in a State of War with him against whom he has declared such an Intention, and so has exposed his Life to the others Power to be taken away by him, or any one that joyns with him in his Defence, and espouses his Quarrel, it being reasonable and just I should have a Right to destroy that which threatens me with Destruction; For by the Fundamental Law of Nature, Man being to be preserved, as much as possible, when all cannot be preserved, the safety of the Innocent is to be preferred: And one may destroy a Man who makes War upon him, or has discovered an Enmity to his being for the same Reason, that he may kill a Wolf or a Lion, because they are not under the ties of the Common Law of Reason, have no other Rule, but that of Force and Violence, and so may be treated as a Beast of Prey, those dangerous and noxious Creatures that will be sure to destroy him, whenever he falls into their Power.",
      "translation_ja": "第16節　戦争状態とは、敵対して相手を滅ぼそうとする状態である。だから、一時の激情やはずみからではなく、落ち着いて決めたうえで他人の命を狙う意図を言葉や行いで示した者は、その相手とのあいだで戦争状態に入る。そして相手本人、あるいはその人を守ろうとしてその争いに味方する者の手で、自分の命を奪われかねない立場に身を置く。私を滅ぼそうとするものを滅ぼす権利が私にあるのは、道理にかない正当だからである。自然の根本法によれば、人間はできるかぎり保全されるべきであり、全員を保全できない場合には、罪のない者の安全が優先されるべきである。だから、自分に戦争を仕掛ける者や、自分の生存に対して敵意をあらわにする者を滅ぼせる理由は、オオカミやライオンを殺しうる理由と同じである。そうした者は共通の理性の法に縛られず、力と暴力のほかに何の掟も知らない。その手に落ちた者をきっと滅ぼす、危険で有害な猛獣と同じように扱うことができるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s017",
      "section_id": "ch-03",

      ],
      "source_text": "CHAP. XIX. Of the Dissolution of Governments.",
      "translation_ja": "第十九章　政府の解体について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s211",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:222",
          "printed_page": "432",
          "printed_page_end": "433",
          "source_sequence": 252
        }
      ],
      "source_text": "211. HE that will, with any clearness, speak of the Dissolution of Government, ought, in the first place, to distinguish between the Dissolution of the Society, and the Dissolution of the Government. That which makes the Community, and brings Men out of the loose State of Nature, into one Politick Society, is the Agreement, which every one has, with the rest, to incorporate and act as one Body, and so be one distinct Commonwealth. The usual, and almost only way, whereby this Union is dissolved, is the Inroad of foreign Force making a Conquest upon them. For in that Case, (not being able to maintain and support themselves, as one intire, and independent Body) the Union belonging to that Body, which consisted therein, must necessarily cease, and so every one return to the state he was in before, with a liberty to shift for himself, and provide for his own Safety, as he thinks fit, in some other Society. Whenever the Society is dissolved, 'tis certain, the Government of that Society cannot remain. Thus Conquerors Swords often cut up Governments by the Roots, and mangle Societies to pieces, separating the subdued or scattered multitude from the Protection of, and Dependence on that Society which ought to have preserved them from violence. The World is too well instructed in, and too forward to allow of this way of dissolving of Governments, to need any more to be said of it; and there wants not much Argument to prove, that where the Society is dissolved, the Government cannot remain: that being as impossible, as for the Frame of an house to subsist when the Materials of it are scattered and displaced by a Whirl-wind, or jumbled into a confused heap by an Earthquake.",
      "translation_ja": "第211節　政府の解体についていくらかでも明確に語ろうとするなら、まず社会の解体と、政府の解体とを区別すべきである。共同体を作り、自然状態のばらばらな境遇から、人々を一つの政治社会へと移すのは、一つの体にまとまり、そのように行動し、一つの独立した国家となるために、各人がほかの人々と結ぶ合意である。この結合が解かれる普通の、そしてほとんど唯一の道は、外国から力が押し寄せて人々を征服することだ。その場合、一つの完全で独立した体として自分たちを保ち支えることはできない。そのように成り立っていた体の結合は必ず消滅する。その結果、一人ひとりが以前の状態に戻り、自由に自分の身を立て、よいと思うほかの社会で、自らの安全を図る。社会が解体するとき、その社会の政府が残れないことは確かだ。こうして征服者の武力は、しばしば政府を根こそぎ断ち、社会をばらばらに引き裂く。そして、屈服し、散り散りとなった民衆を、暴力から守るべきだった社会の保護と、そこへの帰属の関係から切り離す。政府をこうして解体させる方法について、世界の人々はあまりに心得ていて、あまりにすすんでこれを認めるので、これ以上、語るまでもない。社会が解体すれば政府が残れないことを示すにも、議論はたいして要らない。つむじ風で材木が散らされ、もとのところから外されたり、地震で雑然とした山に崩れ落ちたりしたのに、家の骨組みだけが残るのと、同じほどありえないからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s212",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",

      ],
      "source_text": "CHAP. XII. Of the Legislative, Executive, and Federative Power of the Commonwealth.",
      "translation_ja": "第十二章　国家の立法権・執行権・対外権について",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s143",
      "section_id": "ch-12",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:188",
          "printed_page": "365",
          "printed_page_end": "366",
          "source_sequence": 176
        }
      ],
      "source_text": "143. THE Legislative Power is that which has a right to direct how the Force of the Commonwealth shall be imploy'd for preserving the Community and the Members of it. Because those Laws which are constantly to be Executed, and whose Force is always to continue, may be made in a little time; therefore there is no need that the Legislative should be always in being, not having always business to do. And because it may be too great temptation to humane frailty, apt to grasp at Power, for the same Persons who have the Power of making Laws, to have also in their hands the power to execute them, whereby they may exempt themselves from Obedience to the Laws they make, and suit the Law, both in its making and execution, to their own private advantage, and thereby come to have a distinct interest from the rest of the Community, contrary to the end of Society and Government. Therefore in well order'd Commonwealths, where the good of the whole is so considered as it ought, the Legislative Power is put into the hands of divers Persons, who duly Assembled, have by themselves, or jointly with others, a Power to make Laws, which when they have done, being separated again, they are themselves subject to the Laws they have made; which is a new and near tie upon them to take care that they make them for the publick good.",
      "translation_ja": "第143節　立法権とは、共同体とその成員を保全するため、国家の力をどう用いるべきかを指示する権利を持つ力である。いつも執行され、効力が持続すべき法律も短い時間で制定できるので、つねに仕事のあるわけでない立法機関を常設する必要はない。また、権力を握りたがる人間の弱さを考えれば、法律を定める力を持つ者が、その執行の力も手にするのは、あまりに大きな誘惑になりかねない。自分たちの定めた法に、自分たちは従わなくてよいことにしたり、法の制定も執行も、自分たちの私的な利益に合わせたりできるからである。そうすれば、社会と政府の目的に反して、共同体のほかの人たちとは別の利害を持つようになる。したがって、全体の利益がしかるべく考えられる、よく治まった国家では、立法権を何人もの人に持たせる。その人々は正式に集まり、自分たちだけで、あるいは他の者と共同して法律を定める力を持つ。それを終えてまた散会すれば、自分たちが定めた法律の下に、彼ら自身も服する。これが彼らに、公の利益のために法を定めるよう気を配らせる、もう一つの、切実な縛りとなる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s144",
      "section_id": "ch-12",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:189",
          "printed_page": "366",
          "printed_page_end": "367",
          "source_sequence": 177
        }
      ],
      "source_text": "144. But because the Laws that are at once, and in a short time made, have a constant and lasting force, and need a perpetual Execution, or an attendance thereunto: Therefore 'tis necessary there should be a Power always in being, which should see to the Execution of the Laws that are made, and remain in force. And thus the Legislative and Executive Power come often to be separated.",
      "translation_ja": "第144節　しかし、一時に短い期間で定められる法律は、絶えず長く効力を持ち、継続して執行され、あるいは少なくとも、そのための備えを絶やしてはならない。そのため、定められた後も効力を持ち続ける法の執行を見届ける、つねに存在する力が必要となる。このように、立法権と執行権は、しばしば別に置かれる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s145",
      "section_id": "ch-12",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:189",
          "printed_page": "367",
          "source_sequence": 178
        }
      ],
      "source_text": "145. There is another Power in every Commonwealth, which one may call natural, because it is that which answers to the Power every Man naturally had before he entered into Society. For though in a Commonwealth the Members of it are distinct Persons still in reference to one another, and as such are governed by the Laws of the Society; yet in reference to the rest of Mankind, they make one Body, which is, as every Member of it before was, still in the state of Nature with the rest of Mankind: so that the Controversies that happen between any Man of the Society with those that are out of it, are managed by the publick; and an injury done to a Member of their Body, engages the whole in the reparation of it. So that under this consideration, the whole Community is one Body in the state of Nature, in respect of all other States or Persons out of its Community.",
      "translation_ja": "第145節　どの国家にも、もう一つの力がある。これを自然の力と呼んでもよい。各人が社会に入る前に自然に持っていた力にあたるからである。国家の成員は、互いの関係では依然として別々の人であり、そうした者として社会の法によって治められる。だが、残りの人類との関係では、一つの体を成す。その体は、以前それぞれの成員がそうであったように、残りの人類との間ではなお自然状態にある。したがって、社会の成員の誰かと外部の者の間に争いが起きれば、公の機関がこれを扱う。その体の成員が害を受ければ、全体がその償いを得るために関わる。このように考えれば、共同体全体は一つの体であって、そこに属さないほかのすべての国家や個人との関係では、自然状態にある。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s146",
      "section_id": "ch-12",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:189",
          "printed_page": "367",
          "source_sequence": 179
        }
      ],
      "source_text": "146. This therefore contains the Power of War and Peace, Leagues and Alliances, and all the Transactions, with all Persons and Communities without the Commonwealth, and may be called Federative, if any one pleases. So the thing be understood, I am indifferent as to the name.",
      "translation_ja": "第146節　したがってこの力には、戦争と平和、盟約と同盟を決める力と、国家の外のすべての人や共同体との交渉を扱う力とが含まれる。望むなら、対外権と呼んでもよい。何を指しているかが分かれば、呼び方はどうでもよい。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s147",
      "section_id": "ch-12",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:190",
          "printed_page": "368",
          "source_sequence": 180
        }
      ],
      "source_text": "147. These two Powers, Executive and Federative, though they be really distinct in themselves, yet one comprehending the Execution of the Municipal Laws of the Society within its self, upon all that are parts of it; the other the management of the security and interest of the publick without, with all those, that it may receive benefit or damage from, yet they are always almost united. And though this Federative Power in the well or ill management of it be of great moment to the Commonwealth, yet it is much less capable to be directed by antecedent, standing, positive Laws, than the Executive; and so must necessarily be left to the Prudence and Wisdom of those whose hands it is in, to be managed for the publick good. For the Laws that concern Subjects one amongst another, being to direct their actions, may well enough precede them. But what is to be done in reference to Foreigners, depending much upon their actions, and the variation of designs and interests must be left in great part to the Prudence of those who have this Power committed to them, to be managed by the best of their Skill for the advantage of the Commonwealth.",
      "translation_ja": "第147節　執行権と対外権は、それ自体としては実際に区別される。一方は、社会を構成するすべての者に及ぶ国内法を、社会内で執行することを含む。他方は、社会に益をもたらすことも害を加えることもあるすべての相手に対して、公の安全と利益を外で取り扱う。それでも、ほとんどいつも、両方の力は一つにまとめられている。対外権をどれだけよく、あるいはどれだけ悪く扱うかは、国家にとって重大だが、執行権ほどには、あらかじめ定めた恒常的な実定法で、その行使を指示することができない。だから、これを公の利益のために扱うことは、その力を手に持つ人々の分別と知恵に、どうしても委ねなければならない。臣民同士に関わる法は、その行いを導くためのものだから、あらかじめ定めておいて差し支えない。だが、外国の人々について何をすべきかは、その人たちの行動、さまざまに変わる意図や利害に大いに左右される。だから大部分は、その力を託された人々の分別に委ねられ、国家の利益のために、できるかぎりの手腕をもって取り扱われなければならない。",
      "translation_status": "reviewed"
    },

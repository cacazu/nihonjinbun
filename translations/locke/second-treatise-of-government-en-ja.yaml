          "source_sequence": 219
        }
      ],
      "source_text": "181. Though in all War there be usually a complication of force and damage, and the Aggressor seldom fails to harm the Estate, when he uses force against the persons of those he makes War upon; yet 'tis the use of force only that puts a Man into the State of War. For whether by force he begins the injury; or else having quietly, and by fraud, done the injury, he refuses to make reparation, and by force maintains it, which is the same thing as at first to have done it by force; 'tis the unjust use of force that makes the War. For he that breaks open my House, and violently turns me out of Doors; or having peaceably got in, by force keeps me out, does in effect the same thing; supposing we are in such a state, that we have no common Judge on Earth, whom I may appeal to, and to whom we are both obliged to submit: for of such I am now speaking. 'Tis the unjust use of force then that puts a Man into the state of War with another, and thereby he that is guilty of it makes a forfeiture of his Life. For quitting reason, which is the rule given between Man and Man, and using force the way of Beasts, he becomes liable to be destroy'd by him he uses force against, as any savage ravenous Beast, that is dangerous to his being.",
      "translation_ja": "第181節　どんな戦争でも、たいてい力の行使と被害が絡み合い、攻撃者は戦いを仕掛けた相手の身体に力を用いるとき、財産にも害を及ぼすのが普通である。それでも、人を戦争状態に置くのは、力の行使だけである。力で加害を始めた場合も、静かに人を欺いて害をなし、それを償うことを拒み、力ずくで押し通した場合も同じだ。後の場合も、初めから力を用いたのと同じであり、戦争を起こすのは、正当でない力の行使だからである。私の家に押し入り、暴力で私を戸口から追い出す者も、穏便に中に入ってから、力で私を締め出す者も、事実上、していることは同じである。私が訴えることができ、また二人が従う義務を負う共通の裁判官が地上にいないような状態にあるとすればのことだ。いま述べているのは、そのような者たちについてである。それゆえ、他人との戦争状態に人を入らせるのは、不正な力の行使であり、それを犯した者は、それによって自分の命を失ういわれを作る。人と人の間に置かれた規準である理性を捨て、獣のように力を用いるため、その力にさらされる相手から、相手の生存を危うくする獰猛な獣と同様に、滅ぼされうる身となるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s182",
      "section_id": "ch-16",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

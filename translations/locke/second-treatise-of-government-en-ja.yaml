          "printed_page": "263",
          "printed_page_end": "264",
          "source_sequence": 59
        }
      ],
      "source_text": "45. Thus Labour, in the beginning, gave a Right of Property, where ever any one was pleased to imploy it, upon what was common, which remained, a long while, the far greater part, and is yet more than Mankind makes use of. Men, at first, for the most part, contented themselves with what un-assisted Nature offered to their Necessities; and though afterwards, in some parts of the World, where the Increase of People and Stock, with the Use of Money, had made Land scarce, and so of some Value, the several Communities setled the Bounds of their distinct Territories, and, by Laws, within themselves, regulated the Properties of the private Men of their Society, and so, by Compact and Agreement, setled the Property which Labour and Industry began. And the Leagues, that have been made between several States and Kingdoms, either expresly or tacitly dis-owning all Claim and Right to the Land in the others Possession, have, by common Consent, given up their Pretences to their natural common Right, which originally they had to those Countries: and so have, by positive Agreement, settled a Property amongst themselves, in distinct Parts of the World; yet there are still great Tracts of Ground to be found, which the Inhabitants thereof, not having joyned with the rest of Mankind, in the consent of the Use of their common Money, lye waste, and are more than the People, who dwell on it, do, or can make use of, and so still lye in common. Though this can scarce happen amongst that part of Mankind that have consented to the Use of Money.",
      "translation_ja": "第45節　こうして初めのころ、誰かが共有の物に労働を加えようとするところでは、どこでも労働が所有権を生んだ。共有地は長い間、土地の大部分を占め、今なお人類が利用する以上に広く残っている。はじめ、人々は自然が手を加えずとも差し出すもので必要を満たし、たいていそれで満足した。のちに世界の一部で、人と蓄えが増え、貨幣が使われるようになって土地が不足し、それにいくらかの値打ちが生まれたとき、各共同体は領土の境を定め、内部の法律によって社会の個々人の所有を規律した。こうして、労働と勤勉から始まった所有を、取り決めと合意によって確定したのである。また、国家や王国の間の条約では、相手が所有する土地に何ら権利や要求を持たないと、明示または暗黙に認めた。その共通の同意によって、そうした土地に元来もっていた自然の共有権の主張を放棄し、世界のそれぞれの部分の所有を明示の合意によって相互に確定したのである。それでも、今も広大な土地を見いだすことができる。その住民が、人類のほかの人々が広く用いる貨幣を使うという合意に加わっていない場合、そうした土地は荒れたままで、住民が使い、あるいは使いきれる範囲を超え、なお共有のままにある。もっとも、貨幣の使用に同意した人々の間では、このようなことはめったに起こりえない。",

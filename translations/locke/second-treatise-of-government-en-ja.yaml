          "printed_page": "418",
          "source_sequence": 236
        }
      ],
      "source_text": "197. AS Conquest may be called a foreign Usurpation; so Usurpation is a kind of domestick Conquest, with this difference, that an Usurper can never have Right on his side; it being no Usurpation but where one is got into the Possession of what another has Right to. This, so far as it is Usurpation, is a change only of Persons, but not of the Forms and Rules of the Government: for if the Usurper extend his Power beyond what, of Right, belonged to the lawful Princes, or Governours of the Commonwealth, 'tis Tyranny, added to Usurpation.",
      "translation_ja": "第197節　征服は外国からの簒奪と呼べるが、簒奪は国内での一種の征服である。ただし一つ違うのは、簒奪者の側に正当な権利がありえないことである。他人に権利のあるものを手に入れているのでなければ、簒奪ではないからだ。簒奪であるかぎり、それは人の入れ替えにすぎず、政府の形や規則を変えることではない。簒奪者が、国家の正当な君主や統治者に正しく属した力より先まで自分の力を広げるなら、それは簒奪に圧政を加えたものとなる。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s198",
      "section_id": "ch-17",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:215",
          "printed_page": "418",
          "printed_page_end": "419",
          "source_sequence": 237
        }
      ],
      "source_text": "198. In all lawful Governments the designation of the Persons, who are to bear Rule, being as natural and necessary a part as the Form of the Government it self, and that which had its Establishment originally from the People. The Anarchy being much alike, to have no Form of Government at all, or to agree that it shall be Monarchical; but to appoint no way, to design the Person that shall have the Power, and be the Monarch. All Commonwealths therefore, with the Form of Government established, have Rules also of appointing and conveying the Right to those, who are to have any share in the publick Authority. And who-ever gets into the exercise of any part of the Power, by other ways, than what the Laws of the Community have prescribed, hath no Right to be obeyed, though the Form of the Commonwealth be still preserved; since he is not the Person the Laws have appointed, and consequently not the Person the People have consented to. Nor can such an Usurper, or any, deriving from him, ever have a Title, till the People are both at liberty to consent, and have actually consented to allow, and confirm in him the Power he hath, till then, Usurped.",
      "translation_ja": "第198節　正当な政府ではすべて、誰が治めるのかを定めることは、政府の形そのものと同じほど自然で必要な部分であり、もとをたどれば人民によって確立された。政体がまったくないのも、君主政にすることには合意していながら、権力を持ち君主となる人を定める方法がないのも、同じくらい無政府に近い。したがってどの国家も、政体を定めるとともに、公の権威の一部分でも担うことになる者を任命し、その権利を引き渡すための規則を持つ。国の形が元のままでも、共同体の法が定めた方法以外で、権力を少しでも行使するところに至った者には、従ってもらう権利はない。法が任命した人ではなく、したがって人民が同意した人でもないからである。人民が自由に同意できるようになり、それまで簒奪していた力をその者が持つことを認め、確定することに、実際に同意するまでは、簒奪者にも、その者から権力を引き継ぐ誰にも、権原はないのである。",
      "translation_status": "reviewed"
    },

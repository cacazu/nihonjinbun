          "printed_page_end": "452",
          "source_sequence": 274
        }
      ],
      "source_text": "230. Nor let any one say, that mischief can arise from hence, as often as it shall please a busy head or turbulent spirit to desire the alteration of the Government. 'Tis true, such Men may stir whenever they please, but it will be only to their own just ruin and perdition. For till the mischief be grown general, and the ill designs of the Rulers become visible, or their attempts sensible to the greater part, the People, who are more disposed to suffer, than right themselves by Resistance, are not apt to stir. The examples of particular Injustice, or Oppression of here and there an unfortunate Man, moves them not. But if they universally have a perswasion grounded upon manifest evidence, that designs are carrying on against their Liberties, and the general course and tendency of things cannot but give them strong suspicions of the evil intention of their Governours, who is to be blamed for it? Who can help it, if they, who might avoid it, bring themselves into this suspicion? Are the People to be blamed, if they have the sence of rational Creatures, and can think of things no otherwise than as they find and feel them? And is it not rather their fault who put things in such a posture that they would not have them thought as they are? I grant, that the Pride, Ambition, and Turbulency of private Men have sometimes caused great Disorders in Commonwealths, and Factions have been fatal to States and Kingdoms. But whether the mischief hath oftner began in the Peoples Wantonness, and a Desire to cast off the lawful Authority of their Rulers; or in the Rulers Insolence, and Endeavours to get, and exercise an Arbitrary Power over their People; whether Oppression, or Disobedience gave the first rise to the Disorder, I leave it to impartial History to determine. This I am sure, who-ever, either Ruler or Subject, by force goes about to invade the Rights of either Prince or People, and lays the foundation for overturning the Constitution and Frame of any Just Government; he is guilty of the greatest Crime, I think, a Man is capable of, being to answer for all those mischiefs, of Blood, Rapine, and Desolation, which the breaking to pieces of Governments bring on a Countrey. And he, who does it, is justly to be esteemed the common Enemy and Pest of Mankind; and is to be treated accordingly.",
      "translation_ja": "第230節　おせっかいな者や騒ぎを好む者が、政府を変えたいと思うたびに、ここから害が生じるなどと言わないでほしい。確かにそうした者は、好きなときに動き出すかもしれない。だが、自分で招いた破滅と滅亡に向かうだけだ。害が全体に及び、統治者の悪いたくらみが目に見え、あるいは大半の人に企てが感じられるまでは、人民は、抵抗して自らを正当に扱わせるより、むしろ耐えようとし、なかなか動き出さない。あちらこちらの不幸な一人に加えられた個々の不正や圧迫の実例では動かない。だが人民のあいだに、明白な証拠に基づいて、自分たちの自由を害する企てが進んでいるという確信が広まり、物事の全体の運びや傾きから、統治者の悪意を強く疑うほかないなら、責められるべきは誰なのか。疑いを避けられた人々が、自分から疑いを招いたなら、誰にどうできよう。理性ある生き物として分別を持ち、見て感じたとおりにしか物事を考えられないために、人民を責めるべきなのか。むしろ、現にそうであるようには見られたくない状態を、自分で作り出した者の責任ではないか。私人の傲慢、野心、騒乱を好む心が、時に国家に大きな混乱を起こし、党争が国家や王国を滅ぼしてきたことは認める。だが災いの始まりが、人民が放縦になり、統治者の正当な権威を捨てたがったせいである方が多かったか、それとも、統治者の横柄さや、人民を恣意的に支配する力を得て行使しようとしたせいである方が多かったか。混乱の出発点が圧迫だったのか不服従だったのか。私は偏りのない歴史に判断を任せる。ただこれだけは確かだ。治める者であれ臣民であれ、力で君主か人民の権利を侵そうとし、何であれ正当な政府の国制と仕組みを覆す土台を築く者は、人が犯しうる最も大きな罪を負うと私は考える。政府を壊すことで国に降りかかる流血、略奪、荒廃のすべてについて、責を負うからである。これをする人は、当然、人類すべてにとっての敵、災厄と見なされ、それにふさわしく扱われるべきである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s231",
      "section_id": "ch-19",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

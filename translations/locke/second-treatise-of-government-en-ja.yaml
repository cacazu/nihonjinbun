        {
          "source_id": "eebo-tcp-a48901",
          "precision": "page",
          "anchor": "tcp:96077:207",
          "printed_page": "402",
          "printed_page_end": "403",
          "source_sequence": 217
        }
      ],
      "source_text": "179. Secondly, I say then the Conquerour gets no Power but only over those who have actually assisted, concurr'd, or consented to that unjust force that is used against him. For the People having given to their Governours no Power to do an unjust thing, such as is to make an unjust War, (for they never had such a Power in themselves:) They ought not to be charged, as guilty of the violence and injustice that is committed in an unjust War, any farther than they actually abet it, no more than they are to be thought guilty of any Violence or Oppression their Governours should use upon the People themselves, or any part of their Fellow-Subjects, they having impowered them no more to the one than to the other. Conquerours, 'tis true, seldom trouble themselves to make the distinction, but they willingly permit the confusion of War to sweep all together; but yet this alters not the Right: for the Conquerour's Power over the Lives of the Conquered, being only because they have used force to do or maintain an injustice, he can have that power only over those who have concur'd in that force, all the rest are innocent; and he has no more title over the people of that Country, who have done him no injury, and so have made no forfeiture of their Lives, than he has over any other, who without any injuries or provocations, have lived upon fair terms with him.",
      "translation_ja": "第179節　そこで第二に、征服者は、自分に対して用いられた不正な力を、現に助け、共に振るい、あるいは認めた者に対してしか、力を得ないと言ってよい。人民は不正な戦争を仕掛けるような不正を行う力を、統治者に何も授けていない。人民自身がもともとそのような力を持たなかったからである。それゆえ、人民は自ら現にそれを助けた限度を越えて、不正な戦争のさなかに犯された暴力や不正の責めを負うべきではない。これは、統治者が人民自身やほかの臣民の一部に向けた暴力や圧制について、人民を責めるべきでないのと同じである。人民は、後者に対してと同じく、前者に対しても統治者に権限を与えていない。確かに征服者は、わざわざこの区別をつけることはめったになく、戦争の混乱によって、すべての人がひとまとめになることを平気で許す。だがそれで権利が変わるわけではない。征服者が征服された人々の命に対する力を持つのは、彼らが不正を行い、または維持するため、力を用いたからにすぎない。その力を用いるのに加わった人々に対してしか、力を持ちえない。ほかのすべての人は潔白である。征服者を害することなく、したがって自分の命を失ういわれもない、征服された国の人々に対して、征服者に何らの権原もない。害や挑発を加えず、征服者と公正に付き合ってきた、ほかの人に対するのと同じである。",
      "translation_status": "reviewed"
    },
    {
      "id": "locke-s180",
      "section_id": "ch-16",
      "kind": "paragraph",

- "id": "becq-0290"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ainsi nous constatons une confusion constante entre les actes et les tableaux, et il est manifeste que parfois on emploie le mot tableau uniquement parce que la durée paraît un peu petite pour un acte, ce qui est une très mauvaise raison, un acte n'ayant pas en soi de durée déterminée. D'un autre côté, la même confusion éclate quand il s'agit de la représentation des chefs-d'oeuvre étrangers. Hamlet est un drame en cinq actes et vingt tableaux; Othello, un drame en cinq actes et quinze tableaux. Or, pour les adapter à la scène française, ou modifie la physionomie de ces oeuvres par la préoccupation qu'on a de diminuer le nombre des tableaux et d'éviter ainsi des frais et des difficultés de mise en scène. C'est ainsi que l'Othello de M. de Gramont, représenté il y a deux ans à l'Odéon, est dénommé drame en cinq actes, huit tableaux. On a fait une économie de sept tableaux, qui sont, il est vrai, les moins importants; mais, ce qui est plus grave, c'est que l'on a modifié la division de l'action dramatique, de telle sorte l'Othello est devenu une pièce en huit actes. Il est clair ici que je ne m'en prends pas à l'auteur qui n'a fait en somme que se plier aux exigences théâtrales. C'est donc à la mise en scène que j'en ai."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 290
    "line_start": 4130
    "line_end": 4147
  "translation_ja": "こうして幕と場はいつも混同される。ときには、幕と呼ぶには少し短いと思っただけで場という語を使うようだ。幕それ自体には決まった長さがないのだから、じつに悪い理由である。一方、外国の名作の上演でも同じ混同があからさまに出る。『ハムレット』は五幕二十場、『オセロー』は五幕十五場だ。ところがフランスの舞台向けに直すときには、場の数を減らし、演出の費用や手間を省くことに気を取られ、もとの作品の顔つきを変えてしまう。二年前にオデオン座で上演されたド・グラモン氏の『オセロー』も、「五幕八場の劇」と銘打っていた。たしかに、比較的重要でない七つの場を節約したにすぎない。だがもっと重大なのは、劇の筋を区切るところが変わり、『オセロー』が八幕の芝居になったことだ。ここで私が責めているのは脚色者ではない。結局のところ、劇場の要求に従っただけだからだ。私が問題にするのは、演出である。"
  "translation_status": "reviewed"

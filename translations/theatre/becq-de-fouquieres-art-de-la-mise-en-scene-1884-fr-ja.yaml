- "id": "becq-0325"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il semble résulter de ce que nous venons de dire, sur la façon dont on procède à la composition d'un rôle, que la première qualité pour un comédien est l'imagination; accompagnée de cette faculté d'introspection qui lui permet d'apercevoir et de dégager les images subjectives inconsciemment accumulées dans son esprit. Viennent ensuite l'intelligence et le travail, au moyen desquels il pousse la représentation de ces images au degré désirable de fini et de ressemblance. Un jeune homme ou une jeune fille peuvent avoir en partage un physique heureux, une voix enchanteresse, une intelligence très fine, et faire présager un comédien ou une comédienne de talent; mais ils ne posséderont pas de véritable génie dramatique s'ils n'ont pas d'imagination et si par conséquent ils ne possèdent pas cette faculté d'intuition qui en découle. C'est pourquoi les débuts sont si souvent trompeurs; on y fait montre de qualités charmantes et même supérieures, mais le véritable comédien ne se révèle que le jour où, abandonné de ses maîtres, seul vis-à-vis de lui-même, il aborde la création d'un rôle. C'est là que la faculté maîtresse se dévoile ou se montre décidément absente. On ne serait pas embarrassé de citer grand nombre d'acteurs qui ont parcouru une carrière honorable, qui se sont même distingués dans leur emploi, mais qui en réalité n'étaient pas fatalement destinés à être comédiens, et qui n'ont réussi que grâce à la mise en oeuvre de qualités très estimables, mais secondaires au point de vue de l'art et qui auraient pu trouver leur emploi dans toute autre carrière. Ces acteurs tiennent cependant une grande place et une place méritée dans l'histoire dramatique; car instruits, attentifs, scrupuleux et toujours égaux à eux-mêmes, ils sont les gardiens les plus fidèles des traditions et forment ensuite les meilleurs professeurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 325
    "line_start": 4744
    "line_end": 4770
  "translation_ja": "ここまで役の組み立て方について述べたことからすると、俳優の第一の資質は想像力だと思われる。それとともに、自分では知らずに心に蓄えた主観的な像を見つけ、引き出せる内省の力がいる。その次に知性と努力があり、これらによって、像を望ましい出来ばえと似かよりの度合いまで表す。見た目に恵まれ、人を魅了する声があり、非常に鋭い知性を持つ若い男女なら、すぐれた俳優になると思われることはあろう。だが想像力と、そこから生まれる直観する力がなければ、本物の劇の才能はない。そのため初舞台には人の目をあざむくことが多い。魅力のある、時には抜きんでた資質まで見せられるが、本物の俳優は、師の手を離れ、自分とだけ向き合って、一つの役を創造するときになってようやく現れる。肝心の力が姿を現すか、いよいよないとはっきりするのはこのときだ。立派な経歴を歩み、自分の得意な役柄で際立ったが、実はどうしても俳優になる運命にあったわけではない人を、数多く挙げるのは難しくない。成功したのは、高く評価できるものの、芸術の目から見れば二次的で、他のどんな職業でも使えそうな資質を働かせたおかげだった。それでもこうした俳優は演劇史で大きな、ふさわしい位置を占める。知識があり、気を配り、よく吟味し、いつもゆらがないので、伝統をもっとも忠実に守り、その後はもっともよい教師になるからだ。"
  "translation_status": "reviewed"

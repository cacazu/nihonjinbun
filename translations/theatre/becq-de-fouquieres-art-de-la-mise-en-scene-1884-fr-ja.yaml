    "line_start": 3907
    "line_end": 3929
  "translation_ja": "舞台奥が開く。神殿の内部が見え、武装したレビ人が舞台に進み出る。コメディ・フランセーズがこの演出をすべて実行していないのはまずい。ヨアシュが座る玉座の後ろで舞台奥を開き、奥の奥まで、大勢の武装したレビ人がいるのを客席から見えるようにすべきなのだ。実際には、剣を手にしたレビ人が何人か、左右から入ってくるだけである。これでは群衆役に壮大さがなく、聖なる軍勢がアタリーの誇りと怒りにのしかかる重さを、観客に感じさせられない。この場面で私たちが理解し、ともに味わわなくてはならないのは、まさにアタリーの心の動きだ。レビ人が剣を手に持つだけでは足りない。もっと圧倒されるような構えがいるし、何より側面からレビ人が順に入ってくるのは避けなくてはならない。舞台奥が開いて、武装したレビ人のひしめく列が見えた瞬間に、群衆は玉座の左と右、二組に分かれて全体でわずか二歩か三歩、前に進み出る。これがここでの合唱隊の動きであるべきだ。二手から迫る圧力はさぞ強いだろうし、一斉に動くことでその力は倍になる。そうなれば、アタリーの胸をおそう驚きと恐怖を私たちも味わうだろう。一斉に動くことがどれほど強い効果を生むかは、イタリア・バレエを見れば分かる。それがほとんど唯一の取り柄といってもよいほどだ。"
  "translation_status": "reviewed"
- "id": "becq-0279"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand le choeur est appelé à jouer un rôle passif, ce qui avait lieu en général chez les anciens, la mise en scène demande plus de soins encore et plus de science; car, dans ce cas, c'est le choeur lui-même qui devient le personnage complexe auquel nous nous intéressons et avec lequel nous sympathisons. Il exprime alors les sentiments divers qui doivent passer dans notre âme et nous agiter comme lui-même. Tout le public participe à la situation du choeur, et le triomphe du poète est de réussir à troubler l'âme du spectateur des mêmes émotions qui sont censées troubler l'âme des personnages qui composent la figuration. On en a un exemple saisissant dans l'Oedipe roi, tel qu'on le joue à la Comédie-Française où il est admirablement mis en scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 279
    "line_start": 3931
    "line_end": 3941
  "translation_ja": "古代ではたいていそうだったように、合唱隊が受動的な役割を受け持つときは、演出にいっそうの注意と知識が求められる。この場合は、合唱隊そのものが複雑な一人の人物となり、私たちの関心と共感を引くからだ。合唱隊は、同じように私たちの心に入りこんで揺さぶるはずのさまざまな感情を、身をもって表す。観客全体が合唱隊の置かれた状況に加わる。群衆役をなす人々の心を乱すとされる感情と同じものによって、観客の心を乱すことができたとき、劇作家は勝ったのである。目を見張る例は、コメディ・フランセーズで上演される『オイディプス王』だ。みごとな演出がなされている。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 663
      "end": 673
      "exact": "Oedipe roi"
- "id": "becq-0280"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au lever du rideau, le peuple est à genoux, tendant ses mains suppliantes vers le palais d'Oedipe. Les sentiments qu'il exprime et qui l'agitent sont ceux-là mêmes qui doivent pénétrer dans notre âme. C'est donc de l'attitude de la figuration que dépend l'impression que recevra le public. Cela demande une préparation savante, et une très grande sévérité de discipline. La difficulté est d'ailleurs moins grande quand le choeur est en majorité composé de femmes; car la femme a une faculté d'assimilation et d'imitation très supérieure à celle de l'homme. Le premier soin est de déterminer l'attitude du corps, le mouvement des bras, des mains, et d'exiger que les regards ne quittent pas le point fixe sur lequel ils sont dirigés. On obtient de la sorte l'attitude suppliante, qui détermine chez les femmes agenouillées une disposition morale conforme à leur aspect physique. A son tour, cette disposition morale se réfléchit et donne à leur attitude celle ressemblance frappante avec la nature qui agit sur nous par une sorte d'influence identique. Il s'établit ainsi, chez les femmes agenouillées, un double courant qui va du physique au moral et qui retourne du moral au physique, double courant dont il ne faut qu'aucune distraction vienne interrompre le circuit. Le public subit, comme nous l'avons dit, l'influence du tableau qu'on compose pour ses yeux, et ses dispositions morales se conforment à celles que les figurantes doivent à leur propre attitude. On voit que la science de la mise en scène a là un point de contact remarquable avec la physiologie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 280
    "line_start": 3943
    "line_end": 3965
  "translation_ja": "幕が上がると、民衆はひざまずき、すがる手をオイディプスの宮殿に向けて差し出している。彼らを揺さぶり、身に現れる感情こそ、私たちの心にしみこむべき感情である。だから観客がどんな印象を受けるかは、群衆役の姿勢にかかっている。これには周到な準備と、非常に厳しい規律がいる。もっとも、合唱隊の大半が女性の場合は難しさがいくぶん減る。人のありようをのみこみ、まねる力は、女の方が男よりずっとすぐれているからだ。まず身体の姿勢、腕や手の動きを決め、目は決められた一点からそらさないようにする。そうしてすがる姿勢ができると、ひざまずく女たちの心にも、身体の外に現れた姿にふさわしい気持ちが生じる。その気持ちが、今度は姿勢に現れ、実際の人の姿と見まがうほどになる。その結果、似たような作用が私たちにも及ぶ。こうして、ひざまずく女たちの中では、身体から心へ、そして心から身体へと戻る二重の流れが生まれる。気を散らしてこの流れを途切れさせてはいけない。先に述べたように、観客は目の前に整えられた舞台の構図に影響される。そしてその気持ちは、群衆役の女たちが自分たちの姿勢から得た気持ちに寄り添う。ここで演出の知識が生理学と見事に接していることが分かる。"
  "translation_status": "reviewed"
- "id": "becq-0281"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au dernier acte d'Oedipe roi, le rôle du choeur est plus important encore. Il est réglé à la Comédie-Française d'une manière tout à fait remarquable, et les mouvements de la figuration peuvent s'y comparer aux évolutions savantes et mesurées des choeurs antiques. Le peuple de Thèbes est groupé au fond du théâtre, devant le palais d'Oedipe. Il vient d'apprendre la mort violente de Jocaste et d'entendre le récit lamentable de l'attentat d'Oedipe sur lui-même. Le misérable, en effet, s'est enfoncé dans les yeux une épingle d'or arrachée au cadavre de la reine. Mais l'infortuné s'approche. Alors le choeur s'ébranle, entraîné par ce mouvement de poignante curiosité qui pousse les foules au-devant des spectacles tragiques. Dans une suite de mouvements successifs, en quelque sorte musicalement mesurés, le choeur monte et envahit les marches du palais. Soudain l'effroi s'empare de cette foule dès qu'elle aperçoit le malheureux que le public ne voit point encore, et un mouvement de recul se dessine, harmonieusement mesuré. Le peuple alors, marche à marche et en des temps égaux, redescend les degrés du palais, s'écartant devant un spectacle horrible; et c'est lorsque le public a participé à ce double sentiment de curiosité anxieuse et d'effroi qu'apparaît le spectre aux yeux sanglants. Spectacle véritablement tragique, mais qui n'est si grand que parce que notre douloureuse sympathie a été préalablement éveillée par les angoisses du choeur qui se sont répercutées dans notre âme. Voilà de la véritable science de mise en scène. Élevée à ce degré, la mise en scène est un art qui n'a rien à envier à l'orchestrique des anciens, et la Comédie-Française est en cela égale, si ce n'est supérieure, aux théâtres d'Athènes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 281
    "line_start": 3967
    "line_end": 3991
  "translation_ja": "『オイディプス王』の最終幕では、合唱隊の役割はいっそう大きい。コメディ・フランセーズではその動きが目を見張るほど見事に決められており、群衆役の動作を、古代の合唱隊の練り上げられた、拍のそろった動きに比べることができる。テーバイの民衆は舞台奥、オイディプスの宮殿の前に集まっている。イオカステの非業の死を知ったばかりで、そのうえオイディプスがわが身を傷つけたという痛ましい知らせを聞く。あわれな王は、王妃の亡骸から外した金の留め針で、みずから両目の光を奪ったのである。そこへ、当の不幸な王が近づいてくる。すると群衆は、悲惨な光景を一目見ずにはいられない切実な好奇心に押され、動きはじめる。まるで音楽に合わせて間を測ったような動きがいくつも続き、合唱隊は宮殿の階段を上り、階段を埋める。客席からはまだ見えない不幸な王を見たとたん、群衆はにわかに恐怖にとらわれる。そこから、調子のそろった後ずさりが始まる。人々はおそろしい光景を前に左右へ開きながら、同じ間を置いて、宮殿の石段を一段、また一段と下りてくる。はやる好奇心と恐怖の両方を観客が分かち合った、そのときになって、血に染まった目をした亡霊めいた王が姿を現す。まことに悲劇というべき光景だ。これほどの力を持つのは、合唱隊の苦しみが私たちの胸に響き、痛みをともにする気持ちが前もって起こされていたからにほかならない。これこそ本物の演出の知恵である。ここまで高められた演出は、古代の合唱隊の動きに何ひとつ引けを取らない芸術だ。この点でコメディ・フランセーズは、アテナイの劇場に劣らない。むしろまさっているかもしれない。"
  "translation_status": "reviewed"

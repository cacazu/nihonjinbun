- "id": "becq-0137"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Combien seront différents les effets que l'on devra se proposer d'obtenir dans la représentation de l'Ami Fritz, de MM. Erckmann-Chatrian. Dans ce drame; les causes immédiates sont toutes objectives. Fritz est un homme jeune, bien portant, égoïste et heureux. Tout lui sourit dans la vie, et il possède ce qui à ses yeux compose le véritable bonheur ici-bas, une maison bien ensoleillée, des buffets bien garnis d'argenterie et de beau linge, une gouvernante qui prévient ses moindres désirs, et un estomac capable de tenir tête aux amis qu'il rassemble à sa table et avec lesquels il sable les vins de la Moselle et du Rhin ou savoure, en fumant, la bonne bière d'Alsace. Tout ce qui a sur le caractère de Fritz une influence si heureuse compose précisément tous les éléments de la mise en scène. Ici, il faut que les regards du spectateur se reposent avec plaisir, comme ceux de Fritz, sur les moindres détails de l'ameublement, sur le service de table et sur le linge que la gouvernante étale avec orgueil et complaisance. Le repas lui-même auquel il convie ses amis ne peut avoir la simplicité sommaire des repas de théâtres, car c'est là un des facteurs principaux du seul bonheur qu'il a connu jusqu'ici. Quand l'amour s'insinue dans son coeur, c'est encore par les côtés sensuels de sa nature qu'il se laisse séduire: c'est la bonne odeur de la fenaison, la voix pure de Sûzel, qui s'unit à celles des faucheurs, les cerises, toutes glacées de la rosée du matin, que du haut de l'arbre lui jette en riant la jeune fille, les beignets succulents qu'elle a confectionnés de ses blanches mains, les oeufs frais dont elle lui donne le désir, et les belles truites qu'elle lui permet d'espérer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 137
    "line_start": 1724
    "line_end": 1748
  "translation_ja": "エルクマン＝シャトリアン両氏の『友人フリッツ』を上演するときに求めるべき効果は、それとはどれほど違うだろう。この劇では、直接の原因はすべて外にある。フリッツは若く、健康で、わがままで、幸せな男だ。人生は何もかも彼にほほえみかける。日当たりのいい家、銀器や上等なリネンが一杯の戸棚、どんな小さな望みも先にかなえてくれる家政婦、そして卓を囲む友人たちと張り合える胃袋。友人たちと、モーゼルやラインのワインを心ゆくまで飲み、煙草をくゆらせながらアルザスのうまいビールを味わう。彼がこの世のほんとうの幸せだと思うものを、すっかり手にしているのだ。フリッツの性格にこれほど好ましく働くものが、ちょうど演出のすべての要素になる。ここでは観客の目も、フリッツの目と同様、家具のささいな細部や食卓の器、家政婦が誇らしげに満足して並べるリネンに、喜んでとどまらなければならない。友人たちを招く食事そのものも、舞台の食事にありがちな、間に合わせの簡素さではいけない。それは、そこまで彼が知ったただ一つの幸せの、大きな要素であるからだ。恋が彼の胸に忍び込んでくるときも、彼が誘われるのは、性分のうちでも感覚を喜ばせるものを通してである。干し草を刈るいい匂い、草刈り人たちの声に重なるスーゼルの澄んだ声、朝の露でひんやりとしたサクランボを、娘が木の上から笑って投げてよこすこと、白い手で作ってくれたおいしい揚げ菓子、食べてみたくさせる新鮮な卵、そして、手に入るかもしれないと思わせる見事なマスである。"
  "translation_status": "reviewed"

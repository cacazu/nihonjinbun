- "id": "becq-0007"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il n'existe pas d'ouvrage d'ensemble sur la mise en scène; c'est donc sans fausse modestie que j'ai donné le titre d'Essai à cette étude. Ceux qui, après moi, s'intéresseront à ce sujet et voudront le traiter de nouveau auront sans doute à combler quelques lacunes, à compléter ou à rectifier quelques-unes des théories exposées et peut-être à pousser plus loin et en différents sens leurs investigations."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 7
    "line_start": 52
    "line_end": 57
  "translation_ja": "演出を全体として論じた書物は、まだない。だからこの研究を「試論」と呼んだのは、見せかけの謙遜からではない。私のあとでこの問題に関心を持ち、あらためて取り上げようとする人たちには、きっと、抜けているところを埋め、ここに述べた説のいくつかを補ったり訂正したり、さらには幾つもの方向へ探究を押し進めたりする仕事が残るだろう。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 117
      "end": 122
      "exact": "Essai"
- "id": "becq-0008"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au premier abord, le sujet paraît simple et très limité; mais plus on y réfléchit, plus il apparaît tel qu'il est en réalité, complexe et d'une étendue infinie. Pour beaucoup de personnes il se résume dans une question toute matérielle; et la mise en scène se réduit au plus ou moins de splendeur apportée à la représentation d'un ouvrage dramatique, au plus ou moins de richesse des costumes et à une plus ou moins nombreuse figuration. Ce ne sont là cependant que les dehors les plus apparents du sujet, car, en y regardant bien, la mise en scène se confond presque avec l'art dramatique, et c'est dans le cerveau même du poète qu'il faudrait en commencer l'étude."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 8
    "line_start": 59
    "line_end": 68
  "translation_ja": "一見すると、簡単な、ごく限られた問題に思える。だが考えれば考えるほど、複雑で際限がないというその本来の姿が見えてくる。多くの人にとっては、これはまったく物の問題にすぎない。演出とは、芝居を上演するときにどれほど華やかに見せるか、衣装がどれほど豪華か、端役や群衆役を何人出せるか、それだけだというのである。しかしそれは、外からいちばん目につくところにすぎない。よく見れば、演出と劇作のわざはほとんど一つに溶け合っている。その研究は本来、劇作家の頭のなかから始めるべきなのだ。"
  "translation_status": "reviewed"
- "id": "becq-0009"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutefois, il y a là une ligne de partage assez nettement tracée: d'un côté, l'art dramatique, c'est-à-dire tout ce qui est l'oeuvre propre du poète; de l'autre, la mise en scène, c'est-à-dire ce qui est l'oeuvre commune de tous ceux qui, à un degré quelconque, concourent à la représentation. Sans doute ces deux arts se pénètrent réciproquement. Quand le poète se préoccupe de dispositions scéniques, qui ne se déduisent pas nécessairement des caractères et des passions, il fait de l'art théâtral; quand un comédien met en relief certains sentiments auxquels l'auteur n'avait pas tout d'abord accordé une importance suffisante, il fait de l'art dramatique. Cependant, comme il est nécessaire que tout sujet soit délimité, je maintiendrai la distinction au moins apparente qui sépare l'art dramatique de l'art théâtral. Cette étude commence donc au moment où le poète a terminé son oeuvre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 9
    "line_start": 70
    "line_end": 82
  "translation_ja": "それでも境目はかなりはっきり引ける。一方には、もっぱら劇作家自身が成し遂げる仕事、すなわち劇作のわざがある。他方には、どれほど小さな役割であれ、上演に携わる者が力を合わせて成し遂げる仕事、すなわち演出がある。もちろん二つのわざは互いに入り込む。劇作家が、人物の性格や情念から必然的に決まるわけではない舞台の配置を考えるとき、彼は上演のわざを働かせている。俳優が、作者が初めはさほど重く見ていなかった感情を際立たせるとき、彼は劇作のわざを働かせている。それでも、どんな研究にも範囲を定める必要があるから、少なくとも見かけのうえで成り立つこの区別は保っておこう。したがって本書の出発点は、劇作家が作品を書き上げたところである。"
  "translation_status": "reviewed"
- "id": "becq-0010"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ainsi limitée, elle est encore fort complexe; elle comprend la recherche de l'effet général que doit produire la représentation et la détermination des effets particuliers des actes et des tableaux, dans lesquels se décomposent la pièce. Il faut donc arrêter le caractère pittoresque de la décoration, son plus ou moins de relief et de profondeur, etc. L'artiste chargé d'exécuter une décoration en trace d'abord une vue d'ensemble sur un plan vertical, qu'il suppose place dans l'encadrement de la scène à la place du rideau. Ensuite il exécute la maquette, c'est-à-dire une réduction du décor tel qu'il doit être disposé sur le plan géométral. Le public a pu voir dans plusieurs expositions quelques maquettes célèbres, conservées à la bibliothèque de l'Opéra. Pendant que les peintres préparent et brossent les décors, on monte la pièce. L'opération préliminaire, qui est la distribution des rôles, est peut-être la plus importante, car le succès définitif en dépend. Une fois les rôles distribués, chaque acteur apprend le sien. La conception et la composition d'un rôle imposent à l'acteur qui en est chargé un labeur considérable et un grand effort subjectif. Quand tous les rôles sont sus, on les assemble; alors commence le travail long et minutieux des répétitions, car on se propose d'arriver à une harmonie générale et à un ensemble, qui souvent, à défaut d'acteurs de premier ordre, suffisent à assurer le succès. Tel rôle doit être éteint, tel autre doit être au contraire plus accentué. En même temps, on étudie les mouvements scéniques; on détermine les places successives que les personnages doivent occuper les uns par rapport aux autres ou par rapport à la décoration; on règle les entrées et les sorties, ce qui exige parfois des remaniements dans le texte de la pièce. Puis vient la composition de la figuration, et son instruction orchestrique, s'il y a lieu. Pendant le temps des répétitions, on confectionne les costumes, dont les dessins exigent beaucoup de goût et demandent souvent de longues recherches. Bientôt, aux répétitions partielles succèdent les répétitions d'ensemble, où tous les accessoires jouent le rôle qui leur est assigné. La répétition générale a lieu en costume: c'est une première anticipée. Enfin arrive le jour de la première représentation, qui délivre tout le personnel du théâtre de l'anxiété finale et libère auteur, directeur et acteurs d'un labeur où commençaient à s'user les meilleures volontés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 10
    "line_start": 84
    "line_end": 119
  "translation_ja": "こう限ってなお、問題はずいぶん複雑だ。上演が全体としてどんな効果を生むべきかを探り、戯曲を成す一幕一幕、一景一景の効果を定めなければならない。そこで、舞台装置をどんな絵柄にまとめるか、凹凸や奥行きをどこまでつけるか、といったことを決める。装置を任された美術家は、まず幕の代わりに舞台の額縁にはめたと想定する垂直の平面に、全景を描く。続いて模型を作る。平面図に沿って実際に配置される装置を縮尺どおりに組み立てるのである。オペラ座の図書館に保存されている有名な模型のいくつかは、これまで幾度か展覧会で一般の目にも触れている。画家たちが装置を用意し、大道具の絵を描いているあいだに、芝居の稽古も動きだす。最初の仕事である配役は、おそらく何より大事だろう。成否が最後にはここにかかっているからだ。配役が済めば、俳優はそれぞれ自分の役を覚える。一つの役をどう捉え、どう作り上げるかは、それを任された俳優に、並々ならぬ労力と、自分の内面を働かせる大きな努力を求める。皆が役を覚えたところで、初めてそれを合わせる。ここから長く綿密な稽古が始まる。目指すのは全体の調和と一座の息が合うことで、一流の俳優がそろわなくても、しばしばそれだけで成功は手に入る。ある役は抑え、別の役は逆にはっきり押し出さねばならない。同時に舞台上の動きも吟味する。人物が互いに、あるいは装置との関係でどこに位置し、そこから次にどこへ移るかを決め、出入りの段取りをつける。そのために戯曲の台詞を直すこともある。続いて群衆役を組み、必要なら、そろって動き踊るための稽古を施す。稽古が続くあいだに衣装も仕立てる。その意匠には豊かな趣味が要るし、長い調査を要することも少なくない。やがて部分稽古が通し稽古に代わると、小道具もすべて、それぞれに与えられた役目を果たす。総稽古は衣装を着けて行う。いわばひと足早い初日である。ようやく初演の日が来て、劇場で働く誰もが最後までつきまとった不安から解き放たれる。作者も座長も俳優も、どんな熱意の持ち主をもすり減らしかけていた仕事から解放されるのだ。"
  "translation_status": "reviewed"
- "id": "becq-0011"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Telle est l'esquisse sommaire du sujet complexe dont j'ai entrepris l'étude. Si celle-ci devait être poussée à fond, elle exigerait plusieurs volumes, car elle comprendrait: l'architecture théâtrale, la peinture décorative, la science très compliquée de la perspective, la mécanique particulière des machines, les applications de l'électricité, la description des dessous, du cintre et des coulisses, le rôle de ces différentes parties, la plantation des décors, la composition et l'examen des magasins d'accessoires, puis les sciences de l'optique et de l'acoustique, et enfin l'art sans limites précises du comédien, etc."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 11
    "line_start": 121
    "line_end": 129
  "translation_ja": "以上が、私の取り組んだ複雑な主題のほんの見取り図である。もし隅々まで追究するなら、それだけで何巻も必要になる。劇場建築、装飾画、たいへん入り組んだ遠近法の学理、舞台機構特有の力学、電気の応用、舞台下・舞台上方の吊り物空間・舞台袖の構造とそれぞれの役目、装置の建て込み、小道具倉庫に何をそろえどう吟味するか、それに光学と音響学、そして最後には、ここまでと線を引くことのできない俳優の芸術まで含まれるからだ。"
  "translation_status": "reviewed"
- "id": "becq-0012"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De tout ce vaste ensemble, je ne retiendrai que l'ESTHÉTIQUE THÉATRALE, c'est-à-dire l'étude des principes et des lois générales ou particulières qui régissent la représentation des oeuvres dramatiques et concourent à la production du pathétique et du beau."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 12
    "line_start": 131
    "line_end": 134
  "translation_ja": "この広大な領域のうち、ここで私が取り上げるのは舞台美学だけである。すなわち、戯曲の上演を律し、人の心を揺さぶるもの、美しいものを生み出すためにともに働く原理と、一般および個別の法則を探究する。"
  "translation_status": "reviewed"
- "id": "becq-0013"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour la composition de cet ouvrage, la division du sujet et la répartition des matières, j'avais le choix entre l'ordre historique et l'ordre esthétique. Le premier exigeait que je suivisse pas à pas le travail de la mise en scène, à partir du moment où l'auteur dépose son manuscrit jusqu'au moment où le rideau se lève pour la première représentation. J'ai préféré le second, qui va du général au particulier et qui, des principes généraux, déduit les lois particulières. Le premier aurait été préférable si cet ouvrage avait dû être anecdotique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 13
    "line_start": 136
    "line_end": 143
  "translation_ja": "本書を組み立て、主題を分け、材料を配するには、時間を追う順序と、美学上の順序のどちらかを選べた。前者であれば、作者が原稿を届けたときから、初演の幕が上がるときまで、演出の仕事を一歩ずつたどることになった。私は後者を選んだ。一般から個別へ進み、一般原理から個々の法則を導く順序である。もしこの本を逸話集にするつもりであったなら、前者のほうがよかったろう。"
  "translation_status": "reviewed"
- "id": "becq-0014"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quant à la méthode de travail qui a présidé à l'élaboration de cette étude, je crois devoir en dire ici quelques mots. La méthode érudite consiste à suivre chaque jour le mouvement littéraire, à noter les faits à mesure qu'ils éveillent l'attention du public et les discussions critiques auxquelles ils donnent lieu dans les journaux et dans les revues; à extraire des ouvrages spéciaux les remarques utiles à l'éclaircissement du sujet; puis à classer les notes innombrables ainsi accumulées, a les répartir en un certain nombre de chapitres et à relier le tout au moyen des idées générales qui naissent du groupement des faits. Cette méthode implique l'indication de tous les emprunts qu'on a pu faire, et la citation, de tous les auteurs dont on reproduit intégralement les idées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 14
    "line_start": 145
    "line_end": 156
  "translation_ja": "この研究を進めるにあたってどんな方法をとったかも、ここで少し述べておきたい。博識を積み重ねる研究法では、まず日々の文芸の動きを追い、公衆の注意を引いた出来事や、それをめぐって新聞・雑誌に起こる批評上の論議をそのつど書き留める。専門書からは問題を明らかにするのに役立つ指摘を抜き出す。そうして積んだ無数の覚え書きを分類していくつかの章に振り分け、事実を集めるうちに浮かび上がった一般的な考えによって全体をつなぐのである。この方法をとるなら、どこから何を借りたかをすべて明らかにし、誰かの考えをそっくり再現したなら、その著者を一人残らず示さねばならない。"
  "translation_status": "reviewed"
- "id": "becq-0015"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il suffira au lecteur de feuilleter cet ouvrage sans notes et sans références pour conclure que je n'ai pas employé cette méthode. Il a été écrit en effet d'un bout à l'autre sans le secours d'aucune note et d'aucun livre, par la simple méthode spéculative. Chacune des deux méthodes que j'oppose l'une à l'autre a ses vertus et ses défauts: ce n'est pas ici le lieu de les comparer entre elles. Si j'ai cru devoir indiquer celle que j'ai suivie, c'est uniquement pour expliquer l'absence absolue de citations et afin qu'on ne l'attribuât pas à un dédain, qui ne serait nullement justifié, pour les travaux de tous ceux qui, avant moi, ont étudié en artistes ou en critiques l'art de la mise en scène. Pour être accessible à un pareil sentiment, il faudrait ne pas être convaincu comme je le suis que l'esprit de l'homme doit la majeure et la meilleure partie de ses créations en apparence les plus originales à une collaboration incessante, quoique souvent insaisissable et secrète. Pour moi, j'éprouve le plus vif plaisir à avouer ici la double dette de reconnaissance que j'ai contractée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 15
    "line_start": 158
    "line_end": 173
  "translation_ja": "注も典拠の記載もないこの本をぱらぱらめくるだけで、読者は、私がその方法を用いなかったとおわかりになるだろう。じつは初めから終わりまで、一枚の覚え書きも一冊の本も手元に置かず、ただ自分で考えをたどる方法で書いた。私が対置した二つの方法にはそれぞれ長所と欠点があるが、ここは両者を比較する場ではない。自分の方法を断っておこうと思ったのは、引用が一つもない理由を説明するためだけである。私より先に芸術家として、あるいは批評家として演出を研究したすべての人の仕事を軽んじたのだとは思ってほしくない。そんな軽蔑には何の根拠もない。いかにも独創的に見える人間精神の産物も、その大部分を、しかも最良の部分を、絶えず続く、とらえがたく人目につかないことも多い共同の営みに負っている。私と同じようにそう確信する者に、そんな気持ちが起ころうはずはない。私としては、この場で二つの恩義を認めることを心から喜ばしく思う。"
  "translation_status": "reviewed"
- "id": "becq-0016"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Suivant assidûment les représentations de la Comédie-Française, j'y puise un enseignement dont le prix augmente chaque jour à mes yeux. Depuis que mon attention s'est arrêtée sur la mise en scène, j'ai pu admirer la science et le goût qui président à la composition artistique des décorations, à la recherche des effets pittoresques ou grandioses, au choix étudié des costumes, à la juste somptuosité des ameublements, à l'instruction orchestrique de la figuration et à la merveilleuse précision des jeux de scène. C'est cet art exquis, joint au labeur consciencieux et à l'incomparable talent des comédiens, qui fait de la Comédie-Française la première école dramatique et théâtrale de l'Europe, c'est-à-dire du monde entier. Or, ce goût irréprochable et cette science, qui s'appuie sur une longue expérience, sont les deux qualités maîtresses de son administrateur actuel. Je suis donc heureux de saluer ici M. Émile Perrin comme un des maîtres de la mise en scène moderne. Si cet ouvrage a quelque mérite, il lui en est redevable en grande partie, car c'est devant ses belles conceptions théâtrales que j'ai pu apprécier la portée artistique de la mise en scène et le rôle important qu'elle est appelée à jouer dans l'art dramatique moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 16
    "line_start": 175
    "line_end": 192
  "translation_ja": "私はコメディ・フランセーズの舞台に足しげく通い、そこから教えを汲んできた。そのありがたさは日に日に増す。演出に目を向けるようになって以来、装置を一幅の絵のようにまとめ、絵になる効果や壮大な効果を探り、衣装を選び抜き、調度を程よくぜいたくに整え、群衆役の動きや踊りを仕込み、舞台上の芝居を驚くほど正確に運ぶ、その一つ一つに行き届いた知識と趣味に感嘆してきた。この洗練された技術に俳優たちの誠実な努力と比類ない才能とが加わって、コメディ・フランセーズは、劇作と上演の双方について、ヨーロッパで、つまり全世界で第一の学びの場となっている。そして、その非の打ちどころのない趣味と、長年の経験に裏づけられた知識こそ、現在の総支配人を際立たせる二つの資質である。ここでエミール・ペラン氏を近代演出の大家の一人としてたたえることができて、私はうれしい。本書に何らかの取り柄があるとすれば、その大半は氏のおかげである。氏の見事な舞台構想を目の当たりにしてこそ、私は演出が芸術として持つ広がりと、今日の劇芸術において果たすべき大きな役割とを知り得たからだ。"
  "translation_status": "reviewed"
- "id": "becq-0017"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Par une rencontre piquante, c'est précisément à un adversaire de M. Perrin que je me sens le devoir de payer ma seconde dette de reconnaissance. On se rappelle la discussion récente qui, dans un tournoi littéraire, a armé l'un contre l'autre M. Sarcey et l'administrateur de la Comédie-Française, tous deux, au fond, amoureux du même objet, Tournoi heureusement sans fin, sans vainqueur ni vaincu, et dont après tout l'art fait son profit, car, à la lumière qui jaillit du choc de tels esprits, la vérité trouve mieux son chemin qu'au milieu du silence et de la nuit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 17
    "line_start": 194
    "line_end": 202
  "translation_ja": "面白い巡り合わせだが、二つ目の恩を返すべきだと私が感じている相手は、ほかならぬペラン氏の論敵である。つい先ごろ、サルセー氏とコメディ・フランセーズの総支配人が文壇の試合場で互いに武器を取った論争を、人々は覚えておいでだろう。二人とも心の底では同じものを愛している。幸い、この試合には終わりも、勝者も敗者もなく、結局は芸術の得になる。こうした知性がぶつかり合って放つ光のなかでなら、沈黙と闇のただなかでよりも、真理ははるかに自分の道を見つけやすいからだ。"
  "translation_status": "reviewed"
- "id": "becq-0018"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais je ne puis taire que si M. Sarcey rédige depuis plus de quinze ans le feuilleton dramatique du Temps, je le lis assidûment depuis le même nombre d'années. Or, s'il m'eût été impossible de désigner avec précision les idées que j'ai pu directement lui emprunter, j'ai la conscience de beaucoup lui devoir, et d'avoir souvent, en le lisant, senti ma pensée s'agiter à l'agitation intellectuelle de la sienne. J'ai donc contracté vis-à-vis de lui une dette, dont je ne saurais méconnaître la valeur; et il m'est agréable d'avouer hautement l'influence qu'a pu avoir sur mon oeuvre un des maîtres incontestés de la critique contemporaine."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 18
    "line_start": 204
    "line_end": 213
  "translation_ja": "一つ黙ってはいられないことがある。サルセー氏が十五年以上『ル・タン』紙の演劇時評を書いておられるなら、私も同じだけの年月、欠かさずそれを読んできた。氏から直接借りたのがどの考えなのかをはっきり指し示すことはできなかったろうが、私が氏に多くを負っていることはわかっている。氏の文章を読むと、その思考の躍動がこちらにも伝わって、自分の考えまで動きだすのを何度も感じたものだ。この恩がどれほどのものか、知らぬ顔はできない。現代の批評界で誰もが大家と認める一人の仕事が、本書に及ぼしたであろう影響を、公然と認められるのは喜ばしい。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 100
      "end": 105
      "exact": "Temps"
- "id": "becq-0019"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je n'ai plus à ajouter que quelques mots explicatifs, pour clore cette préface. Ayant senti la nécessité d'appuyer d'un certain nombre d'exemples l'exposition de mes idées, j'ai cru cependant devoir me restreindre à ceux que je pouvais tirer des ouvrages modernes représentés depuis peu, ou des oeuvres classiques jouées le plus récemment. Il était nécessaire, en effet, que le public eût encore présents à la mémoire les faits sur lesquels j'attire son attention."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 19
    "line_start": 215
    "line_end": 221
  "translation_ja": "序を結ぶ前に、説明をもう少しだけ加えよう。自分の考えを述べるには例をいくつか添える必要を感じたが、例は、近ごろ上演された現代の作品と、ごく最近再演された古典に限ることにした。私が注意を向けていただきたい事柄が、観客の記憶にまだ生々しく残っていることが必要だったからである。"
  "translation_status": "reviewed"
- "id": "becq-0020"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J'ai souvent employé l'expression de metteur en scène; mais la plupart du temps c'est pour moi une expression complexe qui ne répond pas à une personnalité distincte et à une fonction réelle. En parlant du travail théâtral, des décors, des jeux et des combinaisons scéniques, j'ai d'ailleurs évité de me servir d'expressions techniques peu familières aux lecteurs. Par contre, chaque fois que j'ai dû me servir de mots appartenant à la langue esthétique ou psychologique, je me suis efforcé d'atteindre à la clarté par l'exactitude et la propriété des termes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 20
    "line_start": 223
    "line_end": 230
  "translation_ja": "私は「演出家」という言葉を何度も用いた。だが私にとってはたいてい、幾つもの働きをまとめてそう呼ぶのであって、一人の特定の人間や実在の職務を指すわけではない。また、上演の仕事や装置、舞台上の演技やその組み合わせを語る際には、読者に耳慣れない専門用語を使わぬようにした。一方、美学や心理学の言葉を使わざるを得なかったところでは、意味にかなう正確な語を選ぶことで、明快さに達するよう努めた。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 37
      "end": 53
      "exact": "metteur en scène"
- "id": "becq-0021"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Enfin, dirai-je pour terminer, j'ai rencontré comme cela était fatal, la théorie réaliste ou naturaliste. Je ne me suis pas dérobé à l'obligation de la soumettre à l'analyse critique. Je l'ai fait sans idée préconçue et sans aucun parti pris d'hostilité. On pourra trouver, je crois, que le jugement que je porte sur cette école, sans être complaisant, n'est ni rigoureux ni injuste. Je n'ai eu d'ailleurs à examiner ses théories qu'au point de vue particulier du théâtre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 21
    "line_start": 232
    "line_end": 238
  "translation_ja": "最後にもう一つ。この道を行けば避けがたく、私は写実主義あるいは自然主義の理論に行き当たった。それを批判的な分析にかける務めから目をそらしはしなかった。先入観を持たず、あらかじめ敵意を抱くこともなく取り組んだつもりである。この一派に対する私の判定は、甘くはないが、過酷でも不当でもないとお認めいただけるだろう。もとより、その理論を検討したのは演劇という特定の観点からだけである。"
  "translation_status": "reviewed"
- "id": "becq-0022"

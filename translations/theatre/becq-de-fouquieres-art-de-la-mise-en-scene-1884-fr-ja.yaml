    "kind": "emphasis"
    "span":
      "start": 194
      "end": 198
      "exact": "acte"
- "id": "becq-0296"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La vérité dramatique et la logique de l'action opposent donc des bornes naturelles à l'exagération de la mise en scène. C'est un fait important à constater, puisqu'il nous montre que les progrès de l'art dramatique sont loin d'exiger un luxe disproportionné de mise en scène, et que souvent c'est en s'effaçant modestement que la mise en scène mérite le nom d'art. Ce qui entraîne souvent les poètes, c'est que les changements les plus compliqués n'exigent d'eux qu'un trait de plume; et que leur imagination élève ou renverse des palais avec une rapidité telle qu'elle n'altère en rien la contiguïté des différents moments d'une action partielle qui pour leur esprit reste une et indissoluble. L'art pour eux n'est qu'un jeu de leur imagination; et de même qu'ils ne nous doivent que l'apparence des êtres, de même ils ne nous doivent que l'apparence des choses. Mais alors il ne faut pas que la mise en scène s'attarde à remuer d'énormes machines; il faut qu'elle se fasse alerte et quelque peu féerique pour répondre aux coups d'aile de l'imagination poétique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 296
    "line_start": 4237
    "line_end": 4251
  "translation_ja": "したがって、劇の真実と筋の論理が、演出の行き過ぎにおのずと歯止めをかける。この点は見逃してはならない。演劇の進歩は、分不相応に贅沢な演出を求めるどころか、つつましく一歩退いてこそ、演出が芸術の名に値することも多いからだ。作者の心をつい先へ走らせるのは、いくら込み入った変化も作者の筆にはひと筋ですむことである。想像の中では宮殿を建て、倒すこともたちまちで、ひとまとまりの筋の各局面は少しも離れない。作者の心には切り離せない一つのものなのだ。芸術は作者にとって想像の戯れである。人物を実在させずに姿だけを見せればよいように、物も姿だけを見せればよい。そうであれば、演出は巨大な仕掛けを動かして手間取ってはいけない。作者の想像の羽ばたきに応えるには、すばしこく、少し魔法めいていなくてはならない。"
  "translation_status": "reviewed"
- "id": "becq-0297"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J'ajouterai une remarque générale pour clore ce chapitre. Les directeurs ont le défaut de faire les entr'actes trop longs. La plupart du temps sans doute le spectateur n'éprouve qu'un ennui que dissipe le lever du rideau; mais quelquefois la longueur de l'entr'acte nuit à l'effet dramatique. Je citerai comme exemple le drame d'Antony. Si, entre le second et le troisième acte, ainsi qu'entre le quatrième et le cinquième, on n'intercalait qu'un entr'acte d'une ou deux minutes, juste le temps de changer les décors par des procédés rapides, on doublerait la puissance du drame en ne laissant pas au spectateur le temps de recouvrer son sang-froid et de se dégager de l'étreinte du poète. Mais, objectera-t-on, au lieu de finir à minuit le spectacle finirait à onze heures: on me permettra, je pense, de mépriser absolument cette objection. Au surplus, quand je dis qu'entre deux actes, liés par le pathétique d'une même situation, l'entr'acte doit être réduit à la plus petite durée possible, ce n'est pas un conseil discutable que je donne, mais une règle indiscutable que j'énonce et qui s'impose au nom de principes artistiques qui ne souffrent pas d'objections."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 297
    "line_start": 4253
    "line_end": 4269
  "translation_ja": "章を閉じるにあたって、一般的な注意をもう一つ述べておきたい。劇場の支配人は幕間を長くしすぎる。たいてい観客は退屈するだけで、幕が上がればその気分も消える。だがときには幕間の長さが劇の効果を損なう。例は『アントニー』だ。第二幕と第三幕のあいだ、また第四幕と第五幕のあいだの幕間を一分か二分、素早く装置を替えるだけの時間にとどめたらどうだろう。観客は冷静さを取り戻したり、作者にとらえられた気持ちから逃れたりする暇がないので、劇の力は倍になる。そうすると芝居が真夜中でなく十一時に終わってしまう、という反論もあろう。そんな反論はまったく相手にしないでよいとお許し願いたい。そもそも、一つの状況の切実な力で結びつけられた二幕のあいだでは、幕間をできるだけ短くしなければならないと言うとき、私が述べるのは、意見の分かれうる助言ではない。異を差しはさむ余地のない芸術の原則から当然に出る、疑いようのない規則なのである。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 329
      "end": 335
      "exact": "Antony"

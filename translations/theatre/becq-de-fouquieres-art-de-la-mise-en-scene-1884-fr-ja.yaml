  "translation_ja": "劇の進行の中で音楽の役割は多様だが、つねに調和か対照の効果を生み、人の心の最も深い、最も隠れた感情をあらわにしようとする。近代の作家が劇や喜劇でどう音楽を使ったかをはっきり示す例を、順に見ていこう。まず単純な効果、音楽の性格と、それが人物の感情とどう結びつくかだけで出る効果を取ろう。『退屈する社交界』の第一幕。副知事夫妻が案内され、レヴィル公爵夫人の応接間に二人きりになる。若い夫人は蓋の開いたピアノに近づき、オペレッタの曲を弾き始める。その曲調が、若い妻の浮き立つ気分と、新婚の二人の陽気さを表す。そこへ使用人がやってくる。見つかる寸前、夫人はその軽い旋律から、手際よく古典音楽の主題に移る。二人が足を踏み入れる社交界では、真面目なふりをしていなくてはならないと思っていることを、こちらの曲が表す。観客はたちまち、二人が実際には何者で、どう見せようとしているかを知る。それと同時に、喜劇の筋がもつれ、ほどけてゆく社交界の性格も、すっかり明らかになる。ここで音楽は劇の導入を担い、打ち明け話をする相手の位にまで引き上げられている。作者が筋を動かし始めるのを大いに助け、人物には奥深い感情を語って聞かせるわずらわしさを、観客には聞くわずらわしさを免れさせる。これは音楽のいちばんよくある、もっとも単純な役目の一つだ。同じ芝居で、嫉妬して気が立っている娘は、せっかちな、切りつけるような手つきで鍵盤を走らせる。彼女をとらえる感情がすぐにむき出しになる。ここでは音楽の介入は劇を動かす役に転じる。音楽が、娘の深い動揺をほかの人物に明かすからだ。『エルナニ』の第五幕に移ろう。ドーニャ・ソルは美しい婚礼の夜に小夜啼鳥の歌が聞こえてほしいと思っている。すると、思いがけない角笛の音が夜の静けさに響き、エルナニに死の時が来たと知らせる。ここで角笛にはっきり定まった意味がある。リュイ・ゴメス自身の声であって、観客の目の前にその恐ろしい姿を呼び起こす。愛に約束された夜に死を放ち、悲劇の結末を早めるのは角笛である。しかしこの最後の例を音楽の介入と呼ぶのは難しい。音楽はここでは一つの音にまで縮められているからである。それより前のような例は舞台にずっと多い。いずれも若い娘か若い女が、どの曲を弾くか、どの恋の歌を歌うかを通して、自分の心を観客に明かす。例は数えきれない。どの場合も音楽が観客にじかに働くわけではない。その感情を動かす力は、観客の心に届く前に通ってゆく人物の心から汲まれるのだ。"

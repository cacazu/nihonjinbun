- "id": "becq-0338"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'hétérogénéité, il faut en faire l'aveu, conspire en faveur de l'école réaliste. Je ne sais si celle-ci se rend bien compte de l'arme puissante que les révolutions de l'esprit remettent entre ses mains. On peut le croire, car elle pousse furieusement à l'envahissement de la scène par le réel, et elle n'y réussit que trop bien. Cette année, on a remonté à la Comédie-Française Bertrand et Raton, dont un des actes se passe dans le modeste magasin de soieries de Raton Burgenstaf. Une décoration peinte suffit à l'amoncellement modéré des étoffes, un comptoir de chêne s'étale sans orgueil, un escalier de bois conduit au logement du gros marchand de la Cour, et dans la boutique même s'ouvre la porte de la cave: mise en scène très justement appropriée au théâtre de Scribe. Que nous sommes déjà loin cependant des tréteaux sur lesquels, dans l'Avocat Patelin, maître Guillaume vient étaler ses pièces de draps! Or la veille du jour où vous avez vu Bertrand et Raton, vous aviez pu voir Pot-Bouille à l'Ambigu et admirer le magasin des Vabre avec son élégant escalier en spirale, avec ses commis, ses acheteuses qu'un équipage réel attend à la porte; et le lendemain vous avez peut-être vu la Charbonnière à la Gaîté. Là se trouvait transplanté et formant décor l'escalier monumental d'un des plus grands magasins de Paris, spectacle extraordinaire pour les yeux, présentant l'encombrement et l'affolement d'un grand jour de vente, la presse des acheteurs, la foule des commis, un étalage savamment fait dans les règles du genre, les comptoirs, les caisses, et, dans l'angle de la décoration, un ascenseur, inutile à l'action, mais montant et descendant alternativement dans sa lente majesté, et semblant être l'organe respiratoire de ce mastodonte industriel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 338
    "line_start": 4965
    "line_end": 4990
  "translation_ja": "認めなければならないが、諸要素が異質になったことで、写実派は有利になった。精神の変革がどんなに強力な武器を手に渡したか、写実派自身がよくわきまえているかどうか、私にはわからない。もっとも、現実で舞台を占領しようと猛然と押し進み、うまくいきすぎているくらいだから、わかっていると考えていいのだろう。今年、コメディ・フランセーズは『ベルトランとラトン』を再演した。その一幕の舞台は、ラトン・ブルゲンスタフのささやかな絹織物店である。織物の山は控えめで、絵に描いた装置で間に合う。樫の勘定台も威張らずにどっしりしている。木の階段は王室御用達の大店主の住まいへ通じ、地下室の扉は店の中に口を開けている。スクリーブの芝居に正しく見合った演出だ。それでも、『パトラン先生』で親方ギヨームが毛織物の反物を並べに出てくる、あの板張りの仮舞台からはなんと遠く来たことか。さて、『ベルトランとラトン』を見た前日、観客はアンビギュ座で『ごった煮』を見て、ヴァーブル家の店に感心していたかもしれない。優美な螺旋階段、店員たち、戸口で本物の馬車に待たせている女客たち。そして翌日には、ゲテ座で『石炭屋の女』を見たかもしれない。そこではパリ有数の百貨店の巨大な階段がそのまま移されて装置となり、目を見張る眺めをなしていた。大売り出しの日の大混雑と騒ぎ、押し寄せる買い手、店員の群れ、心得どおりに巧みに並べた品物、売り台、レジ。そして装置の片隅には昇降機があって、筋には何の役にも立たないが、ゆったりと威厳をもって上り下りを繰り返し、この商業の巨獣が呼吸する器官のように見えた。"

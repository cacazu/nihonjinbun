- "id": "becq-0081"
  "section_id": "ch09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour suivre avec profit une oeuvre dramatique, forte et bien liée dans toutes ses parties, il faut une grande contention d'esprit, dont en général on n'apprécie pas assez la puissance. On en aura une idée approximative quand on se sera rendu compte que l'esprit est occupé à la coordination d'un nombre considérable d'impressions auditives, visuelles et intellectuelles, dont les éléments changent constamment, se compliquent, se croisent, s'ajoutent ou se retranchent dans un mouvement incessant. Il faudrait une longue analyse pour décomposer ce travail, dont on aura une mesure bien affaiblie si nous disons que l'esprit coordonne d'abord, non seulement son état de conscience présent, mais encore ses états de conscience antérieurs, avec les lieux, les costumes et le langage des personnages; ensuite qu'il coordonne entre eux les mouvements, les attitudes, les gestes, la physionomie, les regards, les mots, les phrases, la hauteur des sons, leurs relations, leur intensité, le rythme, et enfin les idées, qui se dérobent sous une foule d'images, faibles ou vives, souvent lointaines, et qu'il calcule encore leurs rapports avec toute la succession des faits écoulés et des faits possibles, etc."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 81
    "line_start": 965
    "line_end": 982
  "translation_ja": "力があり、隅々がよく結びついた戯曲を、その値打ちを受け取りながら追うには、精神を大いに集中させなければならない。その集中がどれほどのものかは、たいてい十分に認められていない。精神は、聴覚、視覚、知性に入るおびただしい印象を結びつけている。それぞれの要素はたえず変わり、入り組み、交差し、加わったり消えたりして止まらない。その働きを一つひとつに分けるには長い分析が必要だ。精神はまず、そのとき意識していることだけでなく、それまでに意識していたことも、場所や登場人物の衣裳、ものの言い方と結びつける。次に、動き、姿勢、身ぶり、表情、まなざし、語、文、声の高さと相互の関係、その強さ、リズム、そして最後に、淡くもあれば鮮明なこともあり、しばしば遠くに思い浮かぶ無数のイメージの裏に隠れた観念を、互いに結びつける。またそれらが、それまでの一連の出来事や、起こりうる出来事とどう関わるかまで考える。こう述べたところで、その働きをほんの一部しか伝えられない。"
  "translation_status": "reviewed"
- "id": "becq-0082"
  "section_id": "ch09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il faut à l'esprit, pour suffire à cette coordination presque incommensurable, un influx constant de force nerveuse dont rien ne doit venir troubler ou détourner le cours. On doit donc se garder de soumettre à l'esprit des coordinations contradictoires. C'est bien assez qu'il ait à résoudre les contradictions qui résultent du jeu ou de la diction imparfaite des acteurs, ou de tant d'autres causes qui proviennent souvent, du poète lui-même. Il faut éviter les contradictions qui pourraient naître de la mise en scène, telles que les détails du décor qui ne répondraient à aucune des circonstances du poème; les costumes qui ne conviendraient pas à la condition des personnages ou à leur situation actuelle, le désaccord entre la figuration et les exigences du drame. Il suffit souvent d'une négligence de détail, telle par exemple que le mouvement intempestif d'un figurant au milieu d'une scène pathétique, pour détourner le cours de l'influx nerveux, que l'esprit emploie immédiatement à des coordinations tout à fait étrangères à l'oeuvre représentée sous nos yeux, ou pour que cette force nerveuse se dissipe brusquement en se jetant sur les muscles du rire. Les contrastes qui ne résultent ni de l'action ni des péripéties du drame sont au nombre des causes les plus puissantes qui détournent fatalement l'attention du spectateur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 82
    "line_start": 984
    "line_end": 1003
  "translation_ja": "ほとんど測りようのないこの結びつけの働きを果たすには、絶えず神経の力が精神に流れ込み、その流れを何一つ乱したりそらしたりしないことが欠かせない。だから、矛盾する印象を精神に結びつけさせないようにしなければならない。俳優の演技や台詞回しが不十分なために生じる矛盾や、しばしば作家自身から生じる、いくつもの別の矛盾を解くだけでも、精神には十分すぎる仕事である。舞台装置の細部が戯曲の事情のどれにも当てはまらない、衣裳が登場人物の身分やそのときの境遇にそぐわない、端役が劇の必要に合わない、といった、演出から生まれかねない矛盾は避けねばならない。胸を打つ場面のさなかに端役が不用意に動くなど、細部の不注意一つで、神経の力の流れはそれることがよくある。すると精神はその力を、目の前で上演されている作品とはまるで関係のない印象を結びつけることにすぐ使ってしまう。あるいは、その力は笑いに使う筋肉へ流れ込み、たちまち散ってしまう。劇の筋やその展開から生じたのでない対照は、観客の注意を否応なくそらす、もっとも強い原因の一つである。"
  "translation_status": "reviewed"
- "id": "becq-0083"
  "section_id": "ch09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous nous en tiendrons à ces considérations générales, en évitant d'entrer dans les détails d'une analyse qui nous entraînerait trop loin, sans beaucoup de profit. Ce que nous avons dit suffit pour démontrer que la mise en scène ne doit jamais contredire le texte poétique ou l'idée qu'on peut se faire des lieux, de l'époque, des costumes, de l'attitude et du langage des personnages."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 83
    "line_start": 1005
    "line_end": 1010
  "translation_ja": "これ以上分析の細部に入れば、得られるものは少ないのに話が遠くへ行きすぎるから、以上の一般的な考察にとどめよう。演出は、詩の言葉にも、そこから思い浮かぶ場所、時代、衣裳、登場人物の態度やものの言い方にも、けっして反してはならない。ここまでに述べたことで、それは十分に示せたはずである。"
  "translation_status": "reviewed"
- "id": "becq-0084"
  "section_id": "ch10"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE X"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 84
    "line_start": 1014
    "line_end": 1014
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "36"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n55/mode/1up"
  "translation_ja": "第10章"
  "translation_status": "reviewed"
- "id": "becq-0085"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la perspective théâtrale.--Contradiction du personnage humain avec la perspective des décors.--Précautions à prendre par le décorateur et par le metteur en scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 85
    "line_start": 1016
    "line_end": 1018
  "translation_ja": "舞台の遠近法。人間の姿と舞台装置の遠近法との矛盾。舞台美術家と演出家が取るべき注意。"
  "translation_status": "reviewed"
- "id": "becq-0086"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il peut être utile de comparer l'art de la peinture à l'art de la décoration théâtrale, en se tenant à un point de vue général et en laissant de côté toute explication mathématique. La perspective d'un tableau se rapporte à un unique plan vertical. Il n'en est pas de même sur un théâtre, où les acteurs se meuvent sur un plan supposé horizontal, terminé par un plan vertical qui forme le décor du fond. En réalité, le plan sur lequel marchent les acteurs est incliné et forme approximativement un angle de trois degrés avec le plan horizontal. Le but de cette inclinaison est de faire fuir la perspective plus vite que dans la nature et de faire paraître ainsi la scène plus profonde qu'elle ne l'est véritablement. On rapproche ainsi les acteurs de l'avant-scène et on évite que la voix aille se perdre dans le cintre et dans les dessous, ce qui arriverait inévitablement si on jouait sur des scènes profondes. La perspective d'un décor doit être considérée comme rationnelle, par rapport du moins à une rangée de spectateurs. Quand l'acteur est sur l'avant-scène il est à son plan; mais à mesure qu'il s'avance vers le fond de la scène, il monte, et, par conséquent, loin de diminuer dans la proportion exigée par la perspective du décor, il semble au contraire grandir et n'est plus en rapport avec les objets dont les dimensions sont calculées d'après le plan qu'ils occupent dans la perspective fuyante de la scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 86
    "line_start": 1021
    "line_end": 1041
  "translation_ja": "数学的な説明はひとまず置き、大づかみな視点から、絵画の技と舞台装置の技を比べてみるとよい。絵画の遠近法は、ただ一枚の垂直な面にかかわる。劇場はそうではない。俳優は水平と見なされた面を動き、その突き当たりには垂直な面が立ち、舞台奥の背景を形づくる。実際には、俳優の歩く面は傾いており、水平面とのあいだにおよそ三度の角をなす。そのねらいは、自然のままよりも遠近を早く縮め、舞台が実際以上に奥深く見えるようにすることだ。こうすれば俳優を舞台前方に寄せることができ、奥の深い舞台で演じれば避けられないように、声が舞台上部の空間や奈落に吸い込まれてしまうことも防げる。舞台装置の遠近法は、少なくとも一列の観客を基準とするかぎり、理にかなったものと考えなければならない。舞台前方に立つ俳優は、装置の遠近法から見ても正しい位置にいる。だが奥へ進むと、俳優は坂を上る。このため、装置の遠近法が求める割合で小さくなるどころか、むしろ大きくなったように見える。舞台の奥へ向かう遠近に従い、それぞれの位置に合わせて大きさを割り出した物と、つり合わなくなるのである。"
  "translation_status": "reviewed"
- "id": "becq-0087"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est un contraste qu'on ne peut entièrement éviter, mais qu'il ne faut pas rechercher de parti pris. Aussi la mise en scène, qui se rapproche un peu par là de l'art du bas-relief, doit autant que possible maintenir les acteurs sur les premiers plans et ne pas laisser les jeux de scène, surtout ceux auxquels participent les personnages principaux, se prolonger inutilement le long et près de la toile du fond. En résumé, il y a contradiction entre la perspective trompeuse du décor et la perspective véritable à laquelle se soumet naturellement l'acteur. Celui-ci, en parcourant la scène dans le sens de la profondeur, détruit donc toujours plus ou moins l'illusion habilement produite par le décor. Dans un tableau, cette contradiction serait absolument choquante et constituerait une faute grossière. Au théâtre, des considérations de premier ordre font passer par-dessus cette anomalie. Le spectateur l'accepte, et quand le personnage en scène captive son attention, il aperçoit vaguement l'incohérence mathématique qu'il y a entre la décoration et les personnages, mais il concentre ses regards sur ceux-ci et n'accorde qu'une importance secondaire au milieu fictif qui les entoure. Toutefois, on conçoit que, dans la mesure du possible, il soit nécessaire d'atténuer la disproportion qui existe entre les acteurs et les objets figurés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 87
    "line_start": 1043
    "line_end": 1062
  "translation_ja": "この食い違いをすっかり避けることはできないが、わざと作り出すべきものではない。そこで演出は、この一点では浅浮彫りの技にいくらか近づくことになる。俳優をできるだけ舞台の前寄りに置き、特に主な登場人物が加わる動きが、背景幕のすぐそばで、幕に沿ってむやみに長く続かないようにするのだ。要するに、舞台装置の見かけの遠近と、俳優の身体が自然に従う本当の遠近とが、食い違っている。俳優が舞台を奥行き方向に行き来すれば、装置が巧みに作った錯覚は、多少なりとも必ず壊れる。絵画なら、この矛盾はまったく目障りで、甚だしい誤りになるだろう。劇場では、もっと大切な理由があって、この不自然さは大目に見られる。観客はそれを受け入れる。舞台の人物に注意を奪われれば、装置と人物との数学的な食い違いにぼんやり気づいても、視線は人物に集中し、彼らを包む架空の環境には二の次の重みしか与えない。ただし、俳優と舞台上に表された物の大きさの不釣り合いは、できるかぎり和らげる必要がある。"
  "translation_status": "reviewed"
- "id": "becq-0088"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il ressort de là que le décorateur doit éviter dans les derniers plans la représentation d'objets à dimensions déterminées, attirant, d'une manière trop spéciale l'oeil du spectateur; car il peut arriver un moment où cet objet se trouve en réalité sur le même plan qu'un des acteurs, bien qu'il soit censé appartenir à un plan beaucoup plus éloigné, effet de contraste qui soumettrait à l'esprit une coordination contradictoire. C'est là d'ailleurs, empressons-nous de l'ajouter, un de ces détails techniques qui ne sont de la compétence ni de la direction, ni du metteur en scène; ils rentrent dans l'art spécial du décorateur, exercé en général par des perspecteurs très habiles, qui usent de différents procédés pour masquer les contacts entre les personnages et les décors trop lointains."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 88
    "line_start": 1064
    "line_end": 1075
  "translation_ja": "ここから、舞台美術家は、奥のほうに、大きさが決まっていて、ひときわ観客の目を引くような物を描くのは避けるべきだということが分かる。その物はずっと遠くの位置にあるはずなのに、実際には、ある時点で俳優の一人と同じ場所に並んでしまいかねない。この対照にぶつかると、観客の精神は、矛盾するものを結びつけなければならなくなる。もっとも、ここで急いで付け加えておくが、こうした技術上の細部は、劇場の経営者にも演出家にもその専門外である。舞台美術家固有の技であり、たいていは遠近法にたいへん熟達した人々が担っていて、登場人物と遠くに見せる装置が接してしまうのを隠すため、さまざまな手立てを用いる。"
  "translation_status": "reviewed"
- "id": "becq-0089"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutefois, comme cet art présente des difficultés quelquefois insurmontables, il est nécessaire que le metteur en scène aide le décorateur à éviter à l'oeil du spectateur la nécessité d'une coordination impossible. Dans les cas où cette conjonction de perspectives se produit, on remarquera combien l'acteur, tout en se trouvant démesurément grandi, perd en importance dramatique. L'illusion qui nous faisait voir en lui un personnage du drame, faisant corps avec le milieu figuré, créé par le poète et le décorateur, s'évanouit en un instant, et nous n'avons plus devant les yeux qu'une marionnette trop grande, se promenant dans un théâtre d'enfant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 89
    "line_start": 1077
    "line_end": 1086
  "translation_ja": "とはいえ、この技にも、ときにはどうしても片づかない難題がある。観客の目が両立しないものを結びつけずに済むよう、演出家も舞台美術家を助けなければならない。二つの遠近が鉢合わせになる場合、俳優の姿が途方もなく大きく見えるにもかかわらず、劇のうえでの存在感がどれほど薄れるかに気づくだろう。作家と舞台美術家が生み出した架空の環境に溶け込み、目の前に劇の登場人物がいると思わせてくれた錯覚が、たちまち消える。あとに残るのは、子供のおもちゃの劇場を歩き回る、大きすぎる操り人形だけだ。"
  "translation_status": "reviewed"
- "id": "becq-0090"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tous les spectateurs ont souvent remarqué combien est maigre l'effet représentatif d'objets qui, appartenant censément à l'un des plans représentés en peinture sur la toile de fond, semblent s'en détacher et viennent jouer un rôle sur le plan horizontal de la scène. Je citerai surtout les navires dont les proportions sont toujours ridicules par rapport aux personnages qui s'approchent d'eux. Ce sont là de ces contradictions scéniques qu'on doit considérer comme absolument mauvaises: c'est de l'art incohérent. De même sont les chevaux qui entrent sur la scène en longeant la toile de fond; ils font l'effet grotesque d'animaux démesurés. D'ailleurs, pour d'autres raisons qui tiennent à l'essence même de l'art dramatique, l'exhibition d'animaux quelconques sur la scène est absolument antiartistique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 90
    "line_start": 1088
    "line_end": 1099
  "translation_ja": "背景幕に描かれた奥行きのうち、ある位置にあるはずの物が、その背景から離れ、舞台床の上で何かの役目を果たしているように見えるとき、上演効果がどんなに乏しいかは、どんな観客もよく気づくことである。とりわけ船がそうで、近づいてくる登場人物に比べた大きさは、決まってばかげて見える。こうした舞台上の矛盾は、まったくよくないと言わざるをえない。作品のつじつまが合わないのである。背景幕に沿って登場する馬も同じで、途方もなく大きな動物が出てきたように見えて、滑稽である。もっとも、演劇そのものの本質にかかわる別の理由からいっても、動物が何であれ、舞台に見せ物として出すことはまったく芸術に反する。"
  "translation_status": "reviewed"
- "id": "becq-0091"
  "section_id": "ch10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les conditions scientifiques de la mise en scène et de la décoration n'admettent donc pas toutes les possibilités réelles; comme tous les arts, c'est un art qui a ses limites. Souvent un théâtre se met en grands frais pour retomber dans un art absolument enfantin, où se coudoient le réel et l'imaginaire. En se plaçant à un point de vue littéraire, on peut dire que, dès que le poète, par ses inventions déréglées, impose une mise en scène inconciliable avec les lois pourtant complaisantes de la perspective théâtrale, il fait oeuvre de poète épique, pour lequel la distance n'existe pas, et non de poète dramatique, qui doit se renfermer dans le lieu immédiat de l'action."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 91
    "line_start": 1101
    "line_end": 1110
  "translation_ja": "だから、演出と舞台装置を支える科学的な条件は、現実に可能なことを何でも受け入れるわけではない。あらゆる芸術と同じく、この芸術にも限界がある。劇場が大金を使っても、現実と空想が脈絡なく隣り合う、まるで子供じみた芸術に逆戻りすることは少なくない。文学の側から見るなら、作家が奔放すぎる創案によって、舞台の遠近法のかなり寛容な法則とさえ両立しない演出を強いるとき、その仕事はもはや劇詩人のものではなく、叙事詩人のものである。叙事詩人には距離など存在しない。劇詩人は、出来事がいま起きている場所にとどまらなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0092"
  "section_id": "ch11"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE XI"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 92
    "line_start": 1114
    "line_end": 1114
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "41"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n60/mode/1up"
  "translation_ja": "第11章"
  "translation_status": "reviewed"
- "id": "becq-0093"
  "section_id": "ch11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La décoration doit avoir une valeur générale et non particulière à un moment déterminé.--Modération dans l'emploi des moyens accessoires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 93
    "line_start": 1116
    "line_end": 1117
  "translation_ja": "舞台装置には全体を支える働きが要り、特定の一瞬だけに合わせてはならない。補助となる手段は控えめに使うこと。"
  "translation_status": "reviewed"
- "id": "becq-0094"
  "section_id": "ch11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La comparaison entre la peinture et la décoration théâtrale peut encore nous suggérer quelques réflexions importantes. Un tableau ne représente jamais qu'un moment d'une action, tandis que la mise en scène doit s'adapter à des moments successifs. Mais, pour un même moment, le peintre et le décorateur ne peuvent de la même manière associer la nature à des actes humains. Le premier peut saisir la nature dans un mouvement qui ne s'achève pas, tandis que le décorateur sera obligé d'achever le mouvement, ce qui est incompatible avec l'immobilité décorative. Ainsi le Titien, dans un de ses plus beaux tableaux, aujourd'hui détruit par un incendie, a représenté un arbre tordu par le vent et aux pieds duquel un dominicain succombe sous le poignard d'un assassin. Le peintre a ainsi associé une tourmente de la nature à un acte criminel. La représentation n'en serait pas possible au théâtre par les mêmes moyens; car la nature y est immobile et le vent n'y courbe pas les arbres. C'est par le sifflement du vent et le bruit du tonnerre que le metteur en scène arriverait à produire un effet analogue. L'effet obtenu, qu'augmenterait encore l'assombrissement du jour et le mouvement des nuages sur le disque lunaire, obtenu par l'électricité, dépasserait peut-être en intensité d'impression l'effet obtenu par le peintre; mais, qu'on le remarque, il serait produit par un appareil étranger à la scène. Les arbres de la décoration, quelque fort que soit le sifflement du vent, ne resteront pas moins immobiles, et que ce soit avant, pendant ou après la tempête, ils seront toujours identiques, à eux-mêmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 94
    "line_start": 1120
    "line_end": 1142
  "translation_ja": "絵画と舞台装置とを比べると、さらにいくつか大切なことが考えられる。絵はある出来事の一瞬しか描かないが、演出は次々に訪れる瞬間の一つひとつに合わなければならない。だが同じ一瞬を取っても、画家と舞台美術家とでは、自然と人間の行いとを同じようには結びつけられない。画家は自然を、一つの動きが終わらないところで捉えられる。舞台美術家はその動きを終わらせなければならないが、装置は動かないので、それができない。たとえばティツィアーノの、いまは火災で失われたもっとも美しい絵の一つには、風にねじ曲げられた木が描かれ、その根元でドミニコ会の修道士が刺客の短剣に倒れている。こうして画家は、自然の荒れ狂うさまと人間の犯罪を結びつけた。舞台では同じ手立てで表すことはできない。舞台の自然は動かず、風が木をしならせることもないからだ。演出家が似た効果を得られるとすれば、風のうなりや雷鳴によってである。そこへ陽がかげり、月の面を雲が横切るところを電気で作れば、印象はいっそう強まり、ひょっとすると画家の得た効果をしのぐかもしれない。だが注目してほしいのは、その効果は舞台に描かれた風景そのものではなく、外からの仕掛けが生み出すということだ。風がどれほど強く鳴っても、装置の木々は少しも動かない。嵐の前も、さなかも、過ぎたあとも、同じ姿のままである。"
  "translation_status": "reviewed"
- "id": "becq-0095"
  "section_id": "ch11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aussi, comme la décoration ne peut varier ses effets selon les moments successifs d'une action, elle doit être, soit dans le mouvement, soit dans le ton des choses inanimées, en relation générale avec l'action et non en relation spéciale avec un des moments particuliers de cette action. Un décorateur qui voudrait associer sa toile avec un instant unique exercerait une impression préventive et détruirait par avance l'effet qu'il aurait voulu obtenir; et si l'effet persistait après l'achèvement de l'acte associé, il redeviendrait contradictoire comme il l'était antérieurement au moment choisi. C'est donc une impression générale que doit s'attacher à produire le décorateur; et cette loi n'est pas sans créer des obligations semblables au metteur en scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 95
    "line_start": 1144
    "line_end": 1154
  "translation_ja": "装置は、出来事が次々に移るのに合わせて、効果を変えられない。それゆえ、命のない物の動きを描くにせよ、その色調を決めるにせよ、出来事全体に関わり、一つの場面の特定の一瞬だけに関わることは避けなければならない。装置の絵をただ一瞬と結びつけようとする舞台美術家は、先に印象を与えて、得たかった効果を出る前に壊してしまう。その行いが終わっても効果が残れば、選んだ瞬間が来る前と同じく、また矛盾になる。舞台美術家が心がけるべきは、したがって、全体に通じる印象を作ることだ。この法則は、演出家にも似た務めを負わせる。"
  "translation_status": "reviewed"
- "id": "becq-0096"
  "section_id": "ch11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Celui-ci sans doute peut à son gré déchaîner le vent et le tonnerre; il a sous la main, dans son magasin d'accessoires, l'outre d'Éole et le foudre de Jupiter; mais, pour peu qu'il ait conscience des conditions particulières de son art, il se gardera bien d'abuser de pareils effets. Outre qu'il serait absurde de couvrir la voix de l'acteur, il sait qu'il ne produira d'illusion que pendant un temps relativement court, à la condition qu'il ne fera que déterminer chez le spectateur une sensation rapide, destinée à s'associer à l'action, et qu'il ne détournera pas l'attention de celui-ci sur ses imitations approximatives des phénomènes de la nature. Quand bien même d'ailleurs celles-ci seraient parfaites, leur persistance forcerait l'esprit du spectateur à une coordination tout à fait contradictoire, l'immobilité de l'air et de la nature peinte s'associant fort mal au grondement perpétuel de la foudre et au bruit ininterrompu du vent. Il est toujours maladroit de rappeler au spectateur, quand le pathétique du drame le lui fait oublier, la contradiction et l'impuissance de la mise en scène. Tout est faux dans la nature peinte qui enveloppe les acteurs; il est donc inutile de faire ressortir ce défaut inhérent aux représentations théâtrales, tandis que tout est vrai, absolument vrai, ou doit le paraître, dans les passions qui animent les personnages du drame."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 96
    "line_start": 1156
    "line_end": 1175
  "translation_ja": "演出家なら、なるほど思いどおりに風を吹き荒れさせ、雷を鳴らせる。道具倉には風の神アイオロスの革袋も、ユピテルのいかずちも控えている。だが、自分の技に固有の条件を少しでも意識していれば、そんな効果をむやみに使おうとはしない。俳優の声をかき消すのはばかげている。それだけでなく、効果が錯覚をもたらすのは比較的短い間だけで、観客のうちに一瞬の感覚を呼び起こして筋の運びに結びつけるにとどめ、不完全にまねた自然現象のほうへ観客の注意をそらさないときにかぎる、と演出家は知っている。模倣がたとえ完璧でも、長く続ければ、観客の精神に、まるで矛盾するものを結びつけさせるだろう。空気も描かれた自然も動かないのに、絶えず雷が鳴り、風が音を立てるのでは、まったくつり合わない。胸を打つ劇にとらわれた観客が忘れているのに、演出の矛盾や限界をわざわざ思い出させるのは、いつでも下手なやり方である。俳優を囲む描かれた自然では、すべてが偽物だ。この、舞台の上演につきものの欠点を際立たせる必要はない。劇の登場人物を動かす情念のほうは、そのすべてが真実、まったくの真実であるか、そう見えなければならないのだから。"
  "translation_status": "reviewed"
- "id": "becq-0097"
  "section_id": "ch11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mise en scène doit donc respecter la vérité dramatique, la laisser se produire dans toute son intégrité et ne pas maladroitement détruire le courant sympathique qui va de l'âme du spectateur à ceux des personnages du drame. L'art du metteur en scène demande beaucoup plus de précaution que d'audace. Il doit mettre tous ses soins à ne diriger sur les yeux attentifs des spectateurs que des faisceaux d'impressions visuelles nécessaires, et surtout à éteindre ou à atténuer les rayons trop brillants. Par cette harmonie, dans laquelle il maintient tout l'appareil objectif de la scène, il se rapproche du peintre qui n'obtient un effet réellement puissant qu'en sachant se décider à une foule de sacrifices nécessaires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 97
    "line_start": 1177
    "line_end": 1187
  "translation_ja": "演出は、だから、劇の真実を尊重し、それが損なわれることなく現れるに任せ、観客の心から劇の登場人物の心へ流れる共感を、不器用に断ってはならない。演出家の技に要るのは、大胆さよりも、はるかに用心深さである。注視する観客の目には、必要な視覚的印象の束だけを向け、強く輝きすぎる光はとりわけ消すか、弱めるために、心を尽くさなければならない。舞台に実際に置くすべてのものをこのように調和させる点で、演出家は画家に近づく。画家もまた、必要とあればあれもこれも手放すことができてはじめて、ほんとうに力のある効果を得るのである。"
  "translation_status": "reviewed"
- "id": "becq-0098"
  "section_id": "ch12"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE XII"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 98
    "line_start": 1191
    "line_end": 1191
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "45"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n64/mode/1up"
  "translation_ja": "第12章"
  "translation_status": "reviewed"
- "id": "becq-0099"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mise en scène est conditionnée par la logique de l'esprit.--De la décoration peinte et du matériel figuratif.--Leurs relations avec le drame.--Leur action différente sur l'esprit du spectateur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 99
    "line_start": 1193
    "line_end": 1195
  "translation_ja": "演出は精神の論理に従う。描かれた装置と舞台上の実物。劇との関わり。観客の精神に対する二つの異なる働き。"
  "translation_status": "reviewed"
- "id": "becq-0100"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En peinture, l'art de la composition est en grande partie fondé sur l'association des idées et sur la logique de l'esprit. Socrate, assis sur un lit, s'entretient avec ses disciples; tout en parlant, il tend la main vers une coupe que lui présente le serviteur des Onze: ce tableau représente la mort de Socrate. L'esprit du spectateur achève le mouvement commencé de Socrate; et le sujet ainsi présenté est beaucoup plus dramatique parce que la mort, au lieu d'être un fait accompli, est instante, et que l'attente tragique agit éternellement sur l'âme du spectateur. Il en est de même de la mort de Jane Grey. L'esprit achève le mouvement de la victime, qui, les yeux bandés tend la main vers le billot, tandis que le bourreau se tient à côté, appuyé sur sa hache. Le spectateur souffre de l'angoisse des derniers instants, plus terribles que la mort elle-même. La composition de ces tableaux est donc fondée sur la fatalité de l'événement; et tous deux, par suite de la logique rigoureuse de l'esprit, représentent la mort de Socrate et celle de Jane Grey aussi sûrement que si les cadavres des deux victimes étaient étalés à nos yeux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 100
    "line_start": 1198
    "line_end": 1214
  "translation_ja": "絵画の構図を組む技は、その大半が、観念の連想と精神の論理に基づいている。ソクラテスが寝台に腰をかけ、弟子たちと語っている。話しながら、十一人の官吏に仕える者が差し出す杯へ手を伸ばす。この絵が表すのは、ソクラテスの死である。ソクラテスがしかけた動作を、観客は心の中で終わらせる。こう描くほうが、はるかに劇的だ。死がすでに起きた事実ではなく、すぐそこまで来ており、悲劇の到来を待つ気持ちが、いつまでも観客の心に働きかけるからである。ジェーン・グレイの死も同じだ。目隠しをされ、処刑台の首置き台へ手を伸ばす犠牲者の動きを、観客の精神は心の中で終わらせる。かたわらには処刑人が斧にもたれて立っている。観客は、死そのものより恐ろしい最後の一瞬一瞬の苦しみを味わう。こうした絵の構図は、したがって、避けられない出来事に基づいている。精神の厳密な論理が働くので、両方の絵は、あたかも二人の遺骸が目の前に横たわっているのと同じほど確かに、ソクラテスとジェーン・グレイの死を表すのである。"
  "translation_status": "reviewed"
- "id": "becq-0101"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette loi, qui ouvre un champ fécond à l'imagination du peintre, domine l'art de la mise en scène. Sous aucun prétexte il n'est permis de s'y soustraire. En peinture, quand-il ne s'agit pas d'un événement historique, et que la nécessité d'une fin ne s'impose pas, le peintre choisit souvent les attitudes et les gestes de ses personnages pour le charme et le pittoresque de leur mouvement, et non pour déterminer l'esprit à envisager un événement subséquent, dont la possibilité n'est pas en cause. La peinture se renferme alors dans une pure actualité; et l'oeil est ici le seul juge compétent, car c'est à lui procurer un plaisir spécial et sans mélange que le génie du peintre conspire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 101
    "line_start": 1216
    "line_end": 1225
  "translation_ja": "画家の想像力に豊かな領域を開くこの法則は、演出の技をも律している。どんな口実があっても、これを逃れることは許されない。絵画では、歴史上のある事件を扱うのではなく、必然の結末が決まってもいないとき、画家はしばしば、動きの魅力や絵になる面白さを求めて、人物の姿勢や身ぶりを選ぶ。観客の精神を次に起こる出来事へ導こうとするのでなく、そもそもそんな出来事がありうるかどうかは問題にしない。このとき絵画は純粋にその一瞬の現前にとどまり、目だけが正当に判断できる。画家は、ほかのものの交じらない、目だけの喜びを与えることに才能を注ぐからだ。"
  "translation_status": "reviewed"
- "id": "becq-0102"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la mise en scène, il n'en est pas de même: là, rien n'est suspendu, tout se précipite irrévocablement à sa fin; les moments se succèdent nécessairement, et l'esprit, par le double moyen de la déduction et de l'induction, devance l'action même dans la voie où elle s'avance vers un dénouement fatal. Tandis que l'oeil du spectateur enveloppe la scène, interroge tous les objets témoins de l'action qui va se dérouler, scrute jusqu'au moindre détail de la décoration, suit les personnages dans leurs mouvements, dans leurs attitudes, dans leurs gestes, son oreille est suspendue aux lèvres des acteurs, analyse toutes les impressions sonores qu'elle reçoit; et ces deux organes fournissent incessamment à l'esprit les éléments qu'il va successivement coordonner avec les faits ainsi qu'avec les caractères et les passions des personnages. L'auteur et le metteur en scène ne doivent jamais oublier que, depuis le moment où le rideau se lève, jusqu'à celui où il retombe, ils vont se trouver aux prises avec la logique inexorable de l'esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 102
    "line_start": 1227
    "line_end": 1241
  "translation_ja": "演出では、そうはいかない。そこで何かが宙に浮いたままになることはなく、すべてが引き返せずに終わりへ向かってなだれ込む。一瞬が次の一瞬に必ずつながり、精神は演繹と帰納の二つを用いて、避けられない結末へ進んでいく出来事の先回りをする。観客の目が舞台全体を見渡し、これから始まる出来事の証人となるあらゆる物に問いかけ、装置のごく細かなところまで探り、人物の動き、姿勢、身ぶりを追うあいだ、耳は俳優の唇に釘づけになり、聞こえてくる印象を一つひとつ吟味する。この二つの器官は休むことなく材料を精神に渡し、精神はそれらを、出来事や人物の性格や情念と、次々に結びつけていく。幕が上がるときからふたたび下りるときまで、容赦のない精神の論理を相手にするのだと、作家と演出家はけっして忘れてはならない。"
  "translation_status": "reviewed"
- "id": "becq-0103"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette nécessité inéluctable de ne pas blesser la raison du spectateur, de ne pas l'induire à de faux jugements, de ne pas l'égarer sur de fausses pistes, a fait imaginer de classer tout ce qui, en dehors des acteurs, se rapporte à la mise en scène du drame en deux catégories distinctes, la première feinte et immobile, la seconde réelle et mobile. Tout ce qui doit faire partie de la première catégorie est peint et fait corps avec les panneaux décoratifs et avec la toile du fond; tout ce qui doit être compris dans la seconde, prend place en réalité sur la scène et compose le matériel figuratif. Les objets de mise en scène de la première catégorie n'ont qu'un rapport général avec l'action, tandis que ceux de la seconde ont avec elle un rapport particulier, plus ou moins étroit. C'est cette différence qui tout d'abord frappe l'esprit du spectateur dès que la toile se lève et avant même que l'action commence. Tout ce que son oeil juge peint et sans réalité n'a qu'une influence générale et faible sur son esprit; il ne lui accorde, avec raison, qu'une attention de surface. Il n'y a là rien de plus que la constatation du milieu où va se dérouler la suite des événements. Tous les objets qui font corps avec la décoration ne sont que des caractéristiques de ce milieu, et le spectateur n'est pas entraîné à chercher une relation, qu'il sait devoir être impossible, entre ces objets sans réalité et un moment quelconque de l'action. Si, par exemple, une porte est peinte sur un des panneaux, le spectateur sait bien que personne ne la poussera."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 103
    "line_start": 1243
    "line_end": 1265
  "translation_ja": "観客の理性を傷つけず、誤った判断に導かず、見当違いの手がかりに迷わせてはならない。この避けられない必要から、俳優を除いて劇の演出にかかわるものをすべて、二つにはっきり分ける考えが生まれた。第一は見せかけの、動かないもの。第二は実物で、動かせるものだ。第一に入るものはみな絵に描かれ、舞台装置のパネルや背景幕と一体になっている。第二に入るものは実際に舞台に置かれ、舞台上の実物をなす。第一のものは劇の進行に全体として関わるだけだが、第二のものは、劇と、多かれ少なかれ密接な、個別の関わりをもつ。この違いが、幕が上がるなり、まだ劇の筋が動き出さないうちに、何より先に観客の精神をとらえる。目が絵に描かれた実物でないものと見定めたものはみな、精神には全般的な、弱い作用しか及ぼさない。観客が表面だけを見てそれ以上注意を向けないのは、当然のことだ。これから一連の出来事が起こる環境を確かめる以上のことは、そこには何もない。装置と一体になった品々は、その環境を特徴づける手がかりにすぎない。観客は、実物ではない品々と、劇のどこかの瞬間とのあいだに、ありえないと知っている関わりを探そうとはしない。たとえばパネルに扉が描かれていれば、誰もその扉を押して開きはしないことを、観客はちゃんと知っている。"
  "translation_status": "reviewed"
- "id": "becq-0104"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais, au contraire, tout ce que son oeil juge réel et voit détaché de la décoration éveille son attention, et il devine un rapport particulier entre tel ou tel objet et l'action du drame. Ce sera un secrétaire, une bibliothèque, une table chargée de papiers ou un trophée d'armes, dont la vue détermine dans l'esprit soit une possibilité, soit une probabilité. Le spectateur se trouve ainsi préparé à telle évolution du drame, à tel acte tragique d'un personnage, à tel dénouement. Le drame commence donc par une entente tacite entre le spectateur et le poète; celui-ci est certain qu'au moment voulu l'esprit du public prendra telle direction, appellera et par suite acceptera telle péripétie qui, sans cette sorte de complicité préalable, aurait peut-être paru inutile ou contraire à la logique, et qui, en tout cas, à un moment inopportun, aurait compliqué l'action d'un élément nouveau et distrait l'attention du public en exigeant de lui une coordination immédiate et inattendue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 104
    "line_start": 1267
    "line_end": 1280
  "translation_ja": "その反対に、目が実物だと判断し、装置から離れて見えるものは、すべて観客の注意を引く。観客は、あの物やこの物には劇の進行と何か特別な関わりがあると察する。たとえば書き物机、書棚、書類の積まれた卓、壁を飾る武具のひとそろい。目に入っただけで、精神には、あることが起こりうる、あるいは起こりそうだ、と思い浮かぶ。こうして観客は、劇のある展開、ある人物の悲劇的な行い、ある結末を迎える心の準備をする。したがって劇は、観客と劇作家のあいだに暗黙の了解ができるところから始まる。作家は、ここぞというときに観客の精神がある方向へ向かい、ある展開を求め、その結果それを受け入れると確信する。この一種の共犯関係があらかじめ成り立っていなければ、その展開は、なくてもよかったり、筋道に反したりするように見えたかもしれない。いずれにせよ、都合の悪い時点で、筋に新しい要素を加えて込み入らせ、予期しない関係をその場で結びつけるよう求めて、観客の注意をそらすことになっただろう。"
  "translation_status": "reviewed"
- "id": "becq-0105"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au surplus, je ferai remarquer que dans tout ce qui précède il ne s'agit nullement de conventions esthétiques plus ou moins fondées. La mise en scène est conditionnée par la logique de l'esprit, qui est exactement la même au théâtre que dans la vie réelle. Supposez, par exemple, qu'une violente querelle, s'élève entre deux hommes irascibles et que vous eu soyez les témoins, ne frémirez-vous pas si vous apercevez un couteau placé sur une table à portée de ces deux hommes? Eh bien, le spectateur est un témoin qui calcule les conséquences fatales d'un fait; et que ce soit au théâtre ou dans la vie réelle, la vue du couteau déterminera la même émotion, qui dans les deux cas sera identique, en qualité sinon en quantité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 105
    "line_start": 1282
    "line_end": 1292
  "translation_ja": "なお、ここまでに述べたことは、いくらか根拠があるかもしれない美的なしきたりの話では、少しもない。演出を律するのは精神の論理であり、その論理は劇場でも現実の生活でも、まったく同じである。たとえば、気の短い男二人のあいだで激しい口論が始まるところに居合わせたとしよう。二人の手が届く卓の上にナイフが置かれていると気づいたら、ぞっとするのではないか。観客は、このように、ある事実から何が避けがたく起こりうるかを見て取る目撃者である。だから劇場でも現実の生活でも、ナイフが目に入れば同じ感情が起こる。強さは異なるとしても、その質はまったく同じである。"
  "translation_status": "reviewed"
- "id": "becq-0106"
  "section_id": "ch12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Concluons donc que les conditions de la mise en scène ne sont pas soumises aux vues plus ou moins arbitraires d'une école, mais dépendent uniquement des lois mêmes de l'esprit humain."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 106
    "line_start": 1294
    "line_end": 1296
  "translation_ja": "したがって、演出の条件は、どこかの流派の多かれ少なかれ恣意的な見解に従うものではなく、ただ人間の精神それ自体の法則にのみ従う。これを結論としよう。"
  "translation_status": "reviewed"

- "id": "becq-0044"
  "section_id": "ch04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rapports de la mise en scène avec la valeur d'une oeuvre dramatique. --Le peu d'appareil des théâtres de province favorisait l'art dramatique.--L'excès de mise en scène lui est nuisible."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 44
    "line_start": 508
    "line_end": 510
  "translation_ja": "演出と戯曲の価値との関係。地方の劇場で装置が乏しかったことは、劇作の発展に役立っていた。演出の行き過ぎは劇作を損なう。"
  "translation_status": "reviewed"
- "id": "becq-0045"
  "section_id": "ch04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Puisqu'il n'y a pas équation entre l'effet représentatif d'une oeuvre dramatique et sa valeur intrinsèque, nous pouvons en conclure qu'en augmentant son effet représentatif on n'ajoute rien à sa valeur intrinsèque, et que les valeurs relatives de deux oeuvres dramatiques ne sont pas entre elles comme leurs effets représentatifs. Mais, dans la généralité des cas, le plaisir que l'on cherche à procurer au spectateur est un plaisir général et total qui se compose de la somme de toutes ses sensations et de toutes ses émotions, de quelque nature qu'elles soient. Il suit de là, premièrement, que la mise en scène pourra être souvent considérée comme un correctif à la faiblesse d'une oeuvre dramatique; deuxièmement, que la mise en scène peut par son excès être un dérivatif à l'attention que mériterait la valeur intrinsèque d'une oeuvre dramatique. C'est à peine si la première proposition mérite que nous nous y arrêtions. Tout le monde sait qu'un certain nombre des théâtres de Paris ne vivent que par la mise en scène. Les ouvrages médiocres qu'ils montent ne réussissent la plupart du temps à captiver le public que par le pittoresque des décors, la richesse des costumes, l'ampleur de la figuration, ou même par les exhibitions les plus excentriques. L'art dramatique ramené ainsi à n'être que de l'art théâtral devient un art tout à fait inférieur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 45
    "line_start": 513
    "line_end": 532
  "translation_ja": "戯曲の上演効果と作品そのものの価値に等号がつかない以上、上演効果を高めても作品自体の価値には何も加わらず、二つの戯曲の価値の比は、それぞれの上演効果の比とは等しくない、と結論できる。しかし、たいていの場合、観客に与えようとする喜びは総体としての喜びである。どんな性質であれ、観客が味わった感覚と感動とをすべて足し合わせてできている。ここから二つのことが言える。第一に、演出はしばしば、戯曲の弱さを補うものと見なせる。第二に、演出が行き過ぎると、作品そのものの価値に向けられてしかるべき注意を、ほかへ逸らすおそれがある。第一の点は、ほとんど立ち止まって考えるまでもあるまい。パリのいくつかの劇場が演出だけで食べていることは誰でも知っている。そこでかかる平凡な作品が客の心をつかめるとすれば、それはほとんどいつでも、絵になる装置、豪華な衣装、大がかりな群衆場面、時にはこのうえなく風変わりな見世物のおかげでしかない。劇作のわざがこのように上演のわざだけに切り詰められれば、ひどく低級な芸術になってしまう。"
  "translation_status": "reviewed"
- "id": "becq-0046"
  "section_id": "ch04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutefois, si la première proposition ne demande que quelques mots d'explication, elle est cependant importante par une des conclusions qu'on en peut tirer et qui nous offre la résolution d'un problème intéressant. Jadis, quand il y avait des théâtres en province et des troupes qui s'y établissaient à demeure pour la saison d'hiver, les directeurs, n'ayant en général à leur disposition qu'un très maigre appareil représentatif, avaient à se préoccuper dans une certaine mesure de la valeur des pièces qu'ils montaient. Ces théâtres étaient ainsi favorables au progrès de l'art dramatique. Aujourd'hui, un autre système a prévalu. Une troupe part de Paris, avec armes et bagages, et s'en va de ville en ville, montant partout l'unique pièce qui compose son répertoire et pour laquelle elle a pu faire les dépenses d'un appareil représentatif, très supérieur à celui qu'aurait eu à sa disposition un directeur de province. Or, à la faveur de cet appareil et grâce au prestige de quelques acteurs en renom, on parvient à imposer aux applaudissements de la province des pièces d'une valeur intrinsèque inférieure. C'est ainsi que les nouvelles moeurs théâtrales et que ces troupes de voyage sont contraires au progrès de l'art dramatique. Ici, je n'ai pas d'ailleurs à examiner cette question dans les détails infinis qu'elle comporterait: je l'ai ramenée à sa plus simple expression. Je ne puis cependant résister au désir de signaler, comme la conséquence, la plus grave peut-être, du système actuel, l'anéantissement du répertoire classique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 46
    "line_start": 534
    "line_end": 556
  "translation_ja": "もっとも、第一の命題それ自体は数語で説明がつくとしても、そこから引き出せる結論の一つは重要である。ひとつの興味深い問題に答えを与えてくれるからだ。かつて地方にも劇場があり、冬の興行期間には劇団がそこに腰を落ち着けていたころ、座長の使える装置は一般にたいへん乏しかった。それだけに、上演する戯曲の値打ちをある程度は気にかけないわけにいかなかった。地方の劇場が劇作の進歩に好都合だったのはそのためだ。今日では別のやり方が広まった。一座は道具一式を引っさげてパリを出発し、町から町へと回る。どこへ行っても演じるのは、持ち演目のすべてでもあるたった一本の芝居だ。こうしてその一本に費用をかければ、地方の座長が用意できたものをはるかにしのぐ舞台装置がそろう。ところが、そうして用意した装置と、名のある何人かの俳優の威光にものを言わせれば、作品自体の価値が低くても地方の観客に拍手させることができる。今日の新しい興行の慣行とこうした巡業劇団とが劇作の進歩に逆らうのは、このためだ。この問題の尽きせぬ細部にここで立ち入るつもりはない。いちばん簡単な形に絞って述べておいた。それでも、いまの仕組みがもたらした、おそらく最も深刻な結果を一つだけ、指摘せずにはいられない。古典の演目が消滅してしまったことだ。"
  "translation_status": "reviewed"
- "id": "becq-0047"
  "section_id": "ch04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'examen de la seconde proposition nous conduira à une conclusion identique. L'abus ou l'excès de la mise en scène détourne le jugement du spectateur de l'objet qui devrait faire sa préoccupation principale, par suite abaisse son goût, et en même temps pousse les auteurs, qui peuvent compter sur l'effet d'un puissant appareil représentatif, à se contenter d'un succès plus facile à obtenir et à négliger la conception de leur oeuvre et la conduite de l'action. L'abus ou l'excès de la mise en scène est donc ainsi contraire aux progrès de l'art dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 47
    "line_start": 558
    "line_end": 565
  "translation_ja": "第二の命題を吟味しても、結論は同じになる。演出の乱用や過剰は、観客の判断を、本来まず心を向けるべき対象からそらし、その結果、鑑賞の趣味を低くする。同時に作者の側も、大仕掛けの舞台効果を当てにできるので、もっとたやすい成功で満足し、作品の構想や筋運びをおろそかにするようになる。こうして演出の乱用や過剰は、劇作の進歩を妨げるのである。"
  "translation_status": "reviewed"
- "id": "becq-0048"
  "section_id": "ch05"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE V"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 48
    "line_start": 569
    "line_end": 569
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "16"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n35/mode/1up"
  "translation_ja": "第5章"
  "translation_status": "reviewed"
- "id": "becq-0049"
  "section_id": "ch05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Recherche d'un principe physiologique auquel puissent se rattacher les lois de la mise eu scène.--Les impressions intellectuelles et les sensations organiques s'annihilent réciproquement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 49
    "line_start": 571
    "line_end": 573
  "translation_ja": "演出の法則のよりどころとなる生理学上の原理を探る。精神に受ける印象と身体器官に生じる感覚とは、互いの働きを打ち消し合う。"
  "translation_status": "reviewed"
- "id": "becq-0050"
  "section_id": "ch05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On a pu m'accorder les propositions émises précédemment et en reconnaître la justesse. En effet, elles résultent de la constatation de faits que chacun a pu observer. Mais il me paraît nécessaire de les rattacher à un point fixe et de chercher, en dehors du théâtre, une méthode de démonstration."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 50
    "line_start": 576
    "line_end": 580
  "translation_ja": "ここまでに述べた命題には同意し、その正しさを認めていただけたかもしれない。実際、それは誰でも観察する機会のあった事実を確かめることから生まれた。しかし私は、それらの命題を一つの動かぬ点につなぎとめ、演劇の外に、論証の方法を求める必要があると思う。"
  "translation_status": "reviewed"
- "id": "becq-0051"
  "section_id": "ch05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, en physiologie, ou en psychologie, comme on voudra, on admet, en se basant sur des séries d'expériences pour ainsi dire quotidiennes, et que chacun peut contrôler par ses propres observations, que notre attention, ordinairement diffuse et mobile, peut, en se concentrant sur des impressions reçues par notre esprit ou sur des sensations éprouvées par un de nos organes, nous rendre insensibles à tout ce qui ne se rapporte pas exclusivement soit à ces impressions intellectuelles, soit à ces sensations organiques. En d'autres termes, sous l'influence de préoccupations spéciales, un groupe de sensations, d'images ou d'idées, s'impose à nous à l'exclusion de tous les autres qui restent alors inaperçus. On pourrait dire, en quelque sorte, que la sensibilité énergiquement surexcitée d'un de nos organes anesthésie momentanément nos autres organes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 51
    "line_start": 582
    "line_end": 594
  "translation_ja": "生理学であれ、お好みなら心理学であれ、ほとんど日ごとに繰り返し、誰もが自分で観察して確かめられる一連の経験をもとに、次のことが認められている。ふだんはあちこちに散り、移ろっている私たちの注意も、精神が受けたある印象か、器官の一つが感じたある感覚に集中すれば、その知的な印象なり身体の感覚なりに直接かかわらないものを、いっさい感じなくさせることがある。言い換えるなら、関心を一つの物事に占められると、感覚やイメージや観念のある一群だけがこちらを捉え、ほかのものはことごとく押しのけられて、私たちには気づかれない。いわば、一つの器官で感受性が激しく高ぶると、ほかの器官はしばらく麻酔をかけられたようになるのだ。"
  "translation_status": "reviewed"
- "id": "becq-0052"
  "section_id": "ch05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les exemples sont nombreux et bien connus. Une personne absorbée par une pensée regarde fixement sans les voir les autres personnes qui sont devant elle; ou bien, captivée par un spectacle, elle n'entendra pas qu'on lui parle. Un soldat, au milieu de la mêlée, n'a pas immédiatement conscience d'une blessure qu'il vient de recevoir; il ne s'en aperçoit que lorsque le sang qui coule attire son attention. Pascal domptait la douleur par le travail, et Archimède, occupé de la résolution d'un problème, ne percevait pas le bruit du combat qui se livrait dans les rues de Syracuse. La vue des images divines, qui hantaient l'esprit des martyrs, les absorbait souvent à tel point qu'ils ne sentaient ni le fer ni le feu qui torturaient leurs chairs. Mais, pour prendre un exemple moins tragique et d'observation plus aisée, tout le monde sait que, lorsque nous voulons concentrer notre esprit sur une idée, nous fermons instinctivement les yeux, ou bien que nous fixons nos regards sur quelque angle banal et obscur de la chambre; que l'enfant, pour apprendre ses leçons, se bouche les oreilles de ses deux mains, et que le collégien qui regarde les mouches voler ne profite pas beaucoup des démonstrations du professeur. C'est à l'infini qu'on pourrait recueillir des faits semblables. Tantôt, c'est la préoccupation de l'esprit qui empêche nos regards de percevoir les formes et les couleurs ou nos oreilles de percevoir les sons, tantôt ce sont des images optiques ou des sons qui s'opposent à toute autre association d'idées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 52
    "line_start": 596
    "line_end": 617
  "translation_ja": "例は数多く、よく知られている。考え事に没頭した人は、目の前の相手をじっと見つめながら、その人が見えていない。逆に、ある光景に見とれていると、話しかけられても聞こえない。混戦のさなか、兵士は負傷したことにすぐには気づかず、流れる血に注意を引かれてようやく知る。パスカルは仕事によって痛みを抑えた。アルキメデスは問題を解くのにかかりきりで、シラクサの通りで繰り広げられていた戦いの物音に気づかなかった。殉教者たちは、心を占める神々しい像を見つめるのにしばしば没頭しきって、肉体を責めさいなむ鉄も火も感じなかった。だが、もっと悲劇性の薄い、観察しやすい例を取ろう。何か一つの考えに集中しようとすると、私たちは思わず目を閉じたり、部屋の片隅の何の変哲もない薄暗いところに視線を据えたりする。子供は課業を覚えるとき両手で耳をふさぐし、蠅が飛ぶのを眺めている生徒の身には先生の論証がさっぱりつかない。そんなことは誰もが知っている。この種の事例は際限なく集められよう。あるときは心が何かに占められ、目には形や色が、耳には音が入らなくなる。あるときは目に映る像や耳に入る音が、ほかの観念の連なりを妨げるのだ。"
  "translation_status": "reviewed"
- "id": "becq-0053"
  "section_id": "ch05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A cette observation d'ordre physiologique on objectera, qu'en réalité il nous est possible dans le même moment d'écouter, de regarder et de penser. En effet, c'est là le cours perpétuel de la vie; mais, dans ce cas, les impressions auditives, optiques et intellectuelles doivent être assez faibles pour pouvoir être perçues toutes à la fois, car, si l'équilibre entre ces impressions également faibles vient à se rompre, la loi physiologique s'impose. Nous pouvons donc dire que, pour être perçues à la fois, des impressions auditives, optiques et intellectuelles doivent, premièrement, être très faibles ou avoir un rapport commun, et, deuxièmement, conserver entre elles la proportion d'intensité qui leur a permis de se manifester dans le même moment."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 53
    "line_start": 619
    "line_end": 629
  "translation_ja": "この生理学的な観察に対して、実際には同時に聞くことも見ることも考えることもできるではないか、との反論があろう。なるほど、ふだんの生活ではそれが絶えず起きている。だがその場合は、耳で受ける印象も、目で受ける印象も、知性が受ける印象も、すべてを同時に知覚できる程度に弱いのでなければならない。等しく弱いこれらの印象の釣り合いがひとたび崩れれば、生理学の法則はいやおうなく働くからだ。したがって、聴覚・視覚・知性の印象が同時に知覚されるには、第一に、それらがごく弱いか、さもなくば互いに共通の関わりを持つこと、第二に、そもそも同時に現れることを可能にした相互の強さの比が、そのまま保たれることが必要だと言える。"
  "translation_status": "reviewed"
- "id": "becq-0054"
  "section_id": "ch06"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE VI"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 54
    "line_start": 633
    "line_end": 633
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "19"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n38/mode/1up"
  "translation_ja": "第6章"
  "translation_status": "reviewed"
- "id": "becq-0055"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la fin que se proposent les beaux-arts.--L'excès de la mise en scène nuit à l'intégrité du plaisir de l'esprit.--La lecture est la pierre de touche des oeuvres dramatiques.--La mise en scène est tantôt une question de goût, tantôt une question d'habileté."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 55
    "line_start": 635
    "line_end": 638
  "translation_ja": "諸芸術の目指すもの。過剰な演出は精神の喜びを損なう。読むことは戯曲の試金石である。演出は、美的判断の問題である場合と、手腕の問題である場合がある。"
  "translation_status": "reviewed"
- "id": "becq-0056"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les arts (et pour plus de simplicité, je ne considérerai ici que la poésie, la peinture et la musique), les arts, dis-je, n'ont d'autre but que de nous fournir des impressions auditives, optiques et intellectuelles. Ils se proposent, pour fin unique: la poésie, le plaisir de l'esprit; la peinture, celui des yeux et la musique celui de l'oreille. Tant qu'un de ces trois arts borne son ambition à nous procurer, dans toute son intégrité, le plaisir particulier pour lequel il a été créé, il se maintient dans la sphère élevée qui lui est propre; il déchoit dès qu'il empiète sur le domaine des deux autres. Telles sont la musique descriptive et pittoresque, et la peinture spirituelle ou philosophique, genres bâtards, auxquels ne se laissent jamais entraîner les véritables artistes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 56
    "line_start": 641
    "line_end": 652
  "translation_ja": "芸術は、と言っても話を簡単にするため、ここでは詩、絵画、音楽だけを考えるのだが、耳で受ける印象、目で受ける印象、知性で受ける印象を私たちにもたらすことのほかに目的をもたない。唯一の目標は、詩なら精神の喜び、絵画なら目の喜び、音楽なら耳の喜びである。この三つの芸術は、自分がそのために生まれた固有の喜びを余すところなく私たちに与えることだけを志しているかぎり、それぞれの高い領域にとどまる。ほかの二つの領分に入り込むやいなや、品位を落とす。光景を描写して絵のように聴かせる音楽も、機知や哲学を披露する絵画も、そうした混成のジャンルであり、真の芸術家はけっしてそこへ引き込まれない。"
  "translation_status": "reviewed"
- "id": "becq-0057"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le cas de la poésie est plus complexe, parce que rien ne parvient à notre esprit que par l'intermédiaire obligé de nos organes; mais la poésie elle-même déchoit si, au lieu de considérer le plaisir des yeux et de l'oreille comme subordonné à celui de l'esprit, elle emploie, pour captiver l'esprit, le prestige de la peinture ou la séduction de la musique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 57
    "line_start": 654
    "line_end": 659
  "translation_ja": "詩の場合は、少し話が込み入っている。感覚器官を通らずに精神へ達するものは何一つないからだ。だが詩でさえ、目や耳の喜びを精神の喜びに仕えるものと考えず、絵画のまばゆさや音楽の魅惑を借りて精神を引きつけようとすれば、品位を落とす。"
  "translation_status": "reviewed"
- "id": "becq-0058"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La poésie dramatique, que sa nature même placerait dans une sphère inférieure à la poésie épique et à la poésie lyrique, reprend cependant sa place élevée lorsque, dans la lecture, par exemple, rien ne vient distraire notre esprit du plaisir idéal qu'elle nous procure, et que notre imagination seule fait tous les frais de la mise en scène. L'art dramatique est donc sur une pente toujours dangereuse, sur laquelle il lui est malheureusement trop facile de se laisser glisser."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 58
    "line_start": 661
    "line_end": 667
  "translation_ja": "劇詩は、その性質だけからいえば叙事詩や抒情詩より下に置かれるだろう。だが、たとえば読んでいるときのように、劇詩が与える理想的な喜びから私たちの精神をそらすものがなく、すべての演出を想像力だけが引き受けるとき、劇詩はふたたび高い位置を取り戻す。演劇はつねに危うい坂の上にあり、不幸にも、ひとたび足を滑らせれば下へ落ちるのはあまりにたやすい。"
  "translation_status": "reviewed"
- "id": "becq-0059"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la représentation d'une oeuvre dramatique, tout ce qu'au delà d'une certaine limite un directeur ajoute, pour le plaisir des yeux ou pour celui de l'oreille, détruit l'intégrité d'un plaisir qui n'aurait dû être destiné qu'à l'esprit. Le spectateur, dont les magnificences de la mise en scène captivent les yeux, n'est plus dans un état de conscience susceptible de goûter, soit la beauté littéraire de l'oeuvre représentée, soit la profondeur et la vérité psychologique des passions qu'elle met en jeu. L'attention est détournée de son objet principal, et, dans ce cas, le plaisir que nous goûtons, véritable plaisir des sens, est inférieur à celui que nous aurions dû ressentir. On peut donc affirmer, sans crainte de se tromper, que l'abus et l'excès de la mise en scène tendent à la décadence de l'art dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 59
    "line_start": 669
    "line_end": 680
  "translation_ja": "戯曲の上演では、劇場の責任者が一定の限度を越えて目や耳を喜ばせるものを付け加えると、そのすべてが、本来はただ精神に向けられるべき喜びを損なう。演出の華麗さに目を奪われた観客は、上演される作品の文学的な美しさも、作品が描き出す情念の深さや心理的な真実も、味わえる心の状態になくなる。注意は本来向けられるべきところからそれ、このとき味わう感覚の喜びは、私たちが感じるはずだったものに及ばない。したがって、演出の乱用や過剰は演劇を衰退へ向かわせるといっても、誤りではない。"
  "translation_status": "reviewed"
- "id": "becq-0060"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A un autre point de vue, il est juste de dire que la nécessité de la mise en scène s'impose d'autant plus que l'oeuvre est plus faible. Sans le secours des décors, des costumes, d'une nombreuse figuration, combien de pièces, privées de ces moyens artificiels de détourner notre attention, n'oseraient ou ne pourraient affronter le jugement intégral de notre esprit. Sans doute c'est un mérite, et même un grand mérite, d'amuser les spectateurs, et nous nous plaisons souvent à nous laisser duper par de brillantes images; cela nous évite un effort intellectuel, et quand nous arrivons fatigués au théâtre, nous sommes reconnaissants envers un auteur de son habileté à nous procurer une délectation facile et à ménager la paresse de notre esprit. Mais combien souvent le lendemain nous nous vengeons cruellement de cette duperie, dont cependant nous nous sommes faits les complices; car, tout en avouant le plaisir que nous avons goûté, nous condamnons la pièce en déclarant qu'elle ne supporte pas la lecture. Aucun jugement critique ne dépasse celui-là, en rigueur et en vérité tout à la fois, car il est porté par l'esprit, dégagé des séductions de la mise en scène et soustrait aux complaisances faciles de nos organes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 60
    "line_start": 682
    "line_end": 699
  "translation_ja": "別の見方をすれば、作品が弱ければ弱いほど演出が必要になる、というのも事実である。舞台装置や衣裳、大勢の端役の助けがなければ、注意をそらすこうした人為の手立てを失い、私たちの精神が下す全面的な判断に、あえてさらされようとしないか、さらされても耐えられない芝居が、いかに多いことか。観客を楽しませるのが一つの功績、それも大きな功績であることは疑いない。私たちも、きらびやかな光景にだまされるのを楽しむことがよくある。頭を働かせずに済むからだ。疲れて芝居に来たときなどは、苦もなく楽しめるものを作り、頭を休ませてくれた作家の手腕に感謝している。ところが翌日になると、自分たちも共犯だったはずのそのだましに、なんと残酷な仕返しをすることか。楽しかったと認めながら、その芝居は読んでみるに堪えないと言い切って退けるのである。これほど厳しく、しかも的確な批評の判断はない。演出の魅惑を脱し、安易な感覚の喜びに引きずられずにすむ精神が下す判断だからだ。"
  "translation_status": "reviewed"
- "id": "becq-0061"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La lecture infirme ou confirme donc le jugement porté par le spectateur après la représentation. La plupart des pièces dont le comique touche à l'extravagance nous paraissent en effet, dès qu'elles sont imprimées, d'une telle platitude que nous avons peine à comprendre le plaisir que nous avons pu y prendre. Au contraire, la lecture des comédies de M. Labiche, même des plus folles, ajoute encore à leur valeur en mettant en relief la finesse et la justesse d'observation de l'auteur. La lecture est donc la véritable pierre de touche des oeuvres dramatiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 61
    "line_start": 701
    "line_end": 708
  "translation_ja": "読むことは、観客が上演後に下す判断を、覆しも裏づけもする。笑いが途方もないところまで行く芝居の大半は、印刷されるやいなや驚くほど平板に見え、よくもあれを楽しめたものだと思う。反対にラビッシュ氏の喜劇は、どんなに破天荒なものでも、読むと作者の観察の繊細さと的確さが際立ち、いっそう価値が高まる。だから、読むことこそ戯曲の真の試金石である。"
  "translation_status": "reviewed"
- "id": "becq-0062"
  "section_id": "ch06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ainsi, nous revenons, par un autre chemin et en nous appuyant de l'expérience physiologique et psychologique, aux propositions que nous avons émises précédemment. L'art dramatique ne peut se soustraire aux lois qui dominent notre être tout entier. Quand nous sommes sollicités à la fois par un plaisir de l'esprit et par un plaisir des sens, nous ne pouvons nous dédoubler et jouir intégralement et également de l'un et de l'autre; nous nous abandonnons, à celui qui s'impose avec le plus de force, de même que de deux douleurs, la plus forte éteint la plus faible. Il y a donc dans l'art théâtral une juste balance à tenir, un état d'équilibre à observer. Pour monter telle pièce, c'est faire acte de goût que de tempérer l'éclat de la mise en scène; pour monter telle autre pièce, c'est faire acte d'habileté que de détourner l'attention du spectateur en agitant un lambeau de pourpre à ses yeux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 62
    "line_start": 710
    "line_end": 722
  "translation_ja": "こうして別の道から、生理と心理の経験に支えられて、先に述べた命題へ戻ってきた。演劇も、私たちの存在全体を律する法則からは逃れられない。精神の喜びと感覚の喜びに同時に誘われても、私たちは自分を二つに分けて、両方をそのまま、同じだけ味わうことはできない。二つの痛みのうち強いほうが弱いほうを消すと同じく、より強く迫る喜びに身を任せる。演劇では、それゆえ正しい釣り合いを取り、均衡を守らなければならない。この芝居を上演するなら、演出の華やかさを抑えるのが美的判断の働きである。別の芝居なら、観客の目の前に緋色の布きれをひらひらさせて注意をそらすのが、手腕の見せどころである。"
  "translation_status": "reviewed"
- "id": "becq-0063"
  "section_id": "ch07"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE VII"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 63
    "line_start": 726
    "line_end": 726
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "23"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n42/mode/1up"
  "translation_ja": "第7章"
  "translation_status": "reviewed"
- "id": "becq-0064"
  "section_id": "ch07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Compétence littéraire nécessaire à un directeur de théâtre.--Établissement théorique des frais généraux de mise eu scène.--L'art dramatique exigerait des vues à longue portée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 64
    "line_start": 728
    "line_end": 730
  "translation_ja": "劇場の責任者に要る文学的な判断力。演出全体にかかる費用の理論的な見積もり。演劇には長い目で見ることが必要である。"
  "translation_status": "reviewed"
- "id": "becq-0065"
  "section_id": "ch07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous avons jusqu'à présent insisté sur ce fait que l'effet représentatif, obtenu par la mise en scène, devait être inversement proportionnel à la valeur intrinsèque de l'oeuvre dramatique. En un mot, il faut contre-balancer, par l'emploi des arts accessoires, ce que l'effet direct de la poésie sur l'esprit du spectateur serait impuissant à obtenir. Ainsi il arrive assez souvent que dans une pièce ayant une valeur intrinsèque incontestable, mais dont les différents actes ont une puissance dramatique inégale, on est obligé de masquer la langueur momentanée de l'action par un habile déploiement de mise en scène. Ce qui domine donc tout d'abord la mise en scène d'une oeuvre dramatique, c'est le jugement littéraire qu'en porte le directeur chargé des soins et de la responsabilité de la représentation. Un directeur incapable de formuler un jugement sur une pièce n'est qu'un entrepreneur de spectacles. En dehors de ce cas, il est clair que l'intérêt même de l'exploitation est lié à la sûreté de jugement du directeur; car, s'il parvient à tirer quelque profit d'une oeuvre faible au moyen de quelques dépenses de mise en scène, d'un autre côté, ce serait une dépense perdue et par là inintelligente que de se résoudre aux mêmes frais pour une pièce qui ne l'exigerait pas."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 65
    "line_start": 733
    "line_end": 751
  "translation_ja": "これまで私たちは、演出によって得られる上演効果は、戯曲の持つ内在的な価値に反比例すべきだと繰り返し述べた。ひとことでいえば、詩が観客の精神に直接働きかけるだけでは得られない効果を、補助となる諸芸術で補う必要がある。したがって、内在的な価値は疑いないが、幕ごとに劇的な力にむらのある芝居では、一時的に弛んだ筋の運びを、巧みで華やかな演出で覆うほかないことが少なくない。戯曲を演出するうえで何より大きな意味を持つのは、上演の世話と責任を引き受ける劇場の責任者が、その戯曲について下す文学的な判断である。芝居を見極められない責任者は、興行を請け負う者にすぎない。それは別としても、経営上の利益そのものが責任者の判断の確かさにかかっていることは明らかだ。演出にいくらか費用をかけて弱い作品からも多少の利益を得られたとして、反対に、そのような出費を必要としない芝居にも同じ額をつぎ込めば、無駄な、分別を欠いた出費になるからである。"
  "translation_status": "reviewed"
- "id": "becq-0066"
  "section_id": "ch07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Chaque fois qu'on met un train de chemin de fer en marche, le nombre des wagons que la machine doit tirer est calculé sur le nombre présumé des voyageurs; et le poids du train détermine la force que doit produire la machine et par suite la dépense qu'occasionnera la traction. Que dirait-on du chef d'exploitation qui ferait une grande dépense de combustible pour mettre en marche un train toujours composé d'un même nombre de wagons, quel que soit le nombre des voyageurs? Que dirait-on d'un mécanicien qui ne saurait pas profiter de la déclivité du sol et de la vitesse déterminée par le seul poids du train pour diminuer la force de traction et par suite la dépense de combustible? On pourrait ainsi rassembler un grand nombre d'exemples ayant tous un rapport plus ou moins prochain avec les devoirs et les préoccupations d'un directeur de théâtre. Tous conduiraient à la même conclusion: à savoir que les frais de mise en scène doivent être en raison inverse de la valeur propre de l'oeuvre représentée. L'idéal pour un directeur, serait de n'avoir à monter que des pièces qu'on pût représenter dans un décor banal."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 66
    "line_start": 753
    "line_end": 768
  "translation_ja": "列車を走らせるたびに、機関車が牽く客車の数は見込み乗客数に合わせて計算され、列車の重さに応じて機関車に必要な力、したがって牽引に要る費用が決まる。乗客がどれだけいようと同じ数の客車をつないだ列車を走らせるために、多量の燃料を使う運行責任者がいたら、何といわれるだろう。線路の勾配や列車が自重だけで出せる速度を利用して、牽引力と燃料支出を減らすことのできない機関士なら、どういわれるだろう。同じように、劇場の責任者の務めや気がかりと多かれ少なかれ関わる例は、いくつでも挙げられる。それらはみな一つの結論に至る。演出費は上演される作品そのものの価値に反比例すべきなのだ。劇場の責任者の理想は、ありふれた舞台装置でも上演できる芝居ばかりを掛けられることだろう。"
  "translation_status": "reviewed"
- "id": "becq-0067"
  "section_id": "ch07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ainsi donc, la direction d'un théâtre exige deux conditions de celui qui assume la responsabilité d'une pareille entreprise. La première est qu'il soit en état de porter un jugement sur la valeur intrinsèque des oeuvres dramatiques; la seconde, qu'il ait la sagesse de faire dépendre les frais de mise en scène du jugement qu'il a porté. Je ne sais si beaucoup de directeurs remplissent ces deux conditions. En tout cas, ce qu'on voit fréquemment, ce sont des pièces, que la critique qualifie d'ineptes, rapporter de grosses sommes d'argent à la faveur d'une éblouissante mise en scène. On peut donc croire que les directeurs remplissent la seconde condition, au moins chaque fois qu'il ne s'agit que d'exagérer la mise en scène. La première condition paraît beaucoup plus rare; elle exige non seulement une compétence spéciale, mais encore un labeur quotidien et persévérant, sans lequel la direction d'un théâtre n'est pas très différente d'une simple partie de baccarat. Les directeurs se plaignent de ne pas rencontrer de chefs-d'oeuvre; mais ont-ils la conscience de faire tout ce qu'il faut pour trouver, non des chefs-d'oeuvre qui sont toujours choses rares, mais seulement des pièces véritablement estimables? Malheureusement, la direction d'un théâtre n'est trop souvent qu'une entreprise financière dont les gains doivent être immédiats, ce qui ne se concilie pas avec des vues à longue portée. Un directeur avisé et prévoyant serait celui qui monterait une pièce, même médiocre, s'il devinait dans son auteur un sens dramatique capable de produire un chef-d'oeuvre dans dix ans. Faute de cette prévision d'avenir, que leur interdit la nécessité d'un gain immédiat, les directeurs forcent les auteurs à rester de jeunes auteurs jusqu'à soixante ans. C'est ainsi que les directeurs, qui se plaignent, contribuent plus que tout autre à la décadence de l'art dramatique et à la ruine de ceux qui leur succéderont."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 67
    "line_start": 770
    "line_end": 797
  "translation_ja": "したがって、劇場経営という企てを引き受ける人には二つの条件が求められる。第一に、戯曲の内在的な価値を見極められること。第二に、その判断に従って演出の費用を決める分別があることだ。両方を満たす責任者が多いかどうか、私には分からない。とにかく、批評にお粗末だと評された芝居が、華やかな演出のおかげで大金を稼ぐのは、よく見ることだ。ならば、せめて演出を派手にするだけでよいときには、責任者たちも第二の条件を満たしていると考えてよかろう。第一の条件を満たす場合はずっと少ないようだ。専門的な判断力だけでなく、絶え間ない日々の労苦を要するからである。それを抜きにした劇場経営は、バカラ賭博と大して変わらない。責任者たちは傑作に巡り合えないとこぼす。だが、いつの時代にもまれな傑作とまではいわずとも、本当に価値のある芝居を探すために、すべきことはすべてしたという自覚があるのだろうか。残念なことに劇場経営は、すぐに収入を得なければならない金儲けでしかない場合があまりに多く、長い目で見ることとは両立しない。目が利き、先を見通す責任者とは、たとえ目の前の作品は平凡でも、その作家に、十年後に傑作を生み出せる劇の勘を見抜くなら、上演する人のことだろう。すぐに利益を出さねばならないために先のことまで見通せず、責任者たちは作家を六十歳まで若手のままにしてしまう。こうして、不満を口にする当の責任者たちが、誰よりも演劇の衰退を進め、後を継ぐ者たちを破滅に追いやる手助けをしているのである。"
  "translation_status": "reviewed"
- "id": "becq-0068"

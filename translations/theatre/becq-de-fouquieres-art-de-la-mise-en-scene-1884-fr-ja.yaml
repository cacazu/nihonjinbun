- "id": "becq-0419"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour aborder certaines représentations, l'école, pour être conséquente avec elle-même et pour réaliser quelques-uns de ses principes les plus chers, devra se résoudre à faire construire des théâtres spéciaux, à scènes rectangulaires très profondes, dans lesquels le plancher de l'orchestre et du parterre sera sensiblement élevé, et le plancher de la scène ramené à l'horizontalité. Alors, c'est, l'oeil seul du spectateur qui inclinera toutes les lignes des décors au point de fuite, et les acteurs, en s'enfonçant dans les profondeurs de la scène, seront partout à leur place et n'auront que les dimensions qu'ils doivent avoir. Mais ce sera en même temps la fin du théâtre parlé et le retour aux drames mimés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 419
    "line_start": 6412
    "line_end": 6422
  "translation_ja": "ある種の上演に取り組むなら、この派は自らの考えに筋を通し、ことのほか大切な原則のいくつかを実現するため、特別な劇場を建てることを決意しなければならない。奥行きの深い長方形の舞台を備え、舞台寄りの客席と平土間の床を目に見えて高くし、舞台の床を水平にする劇場である。そうすれば装置のすべての線を消失点へ傾けるのは、観客の目だけになる。舞台の奥へ入る俳優はどこでも正しい場所におさまり、本来あるべき大きさだけを持つ。だが同時に、それは台詞のある劇の終わりであり、無言の身振りの劇への回帰である。"
  "translation_status": "reviewed"
- "id": "becq-0420"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En résumé et pour conclure, l'école naturaliste, en abordant le théâtre, se verra enfermée dans un cercle très étroit, dont il lui sera artistiquement et scientifiquement impossible de franchir les limites. C'est pourquoi nous ne verrons jamais se produire une pièce naturaliste, telle que les adeptes de l'école l'imaginent dans leur naïveté esthétique. Est-ce à dire que les efforts de l'école seront vains et inutiles? Une telle conclusion serait injuste et contraire à la vérité. Par la présentation du réel, chaque fois qu'elle pourra éviter la double contradiction que nous lui signalons dans ce chapitre, l'école réaliste pourra agrandir l'étendue superficielle de l'art théâtral, de même qu'elle pourra agrandir l'étendue superficielle de l'art dramatique en s'attachant à la peinture des traits particuliers et des caractères individuels. Ce sera un résultat qui n'est pas à dédaigner et auquel elle serait sage de borner son ambition. Si elle vise un but plus élevé, elle devra alors modifier ses principes; et, de même que les sciences, dans leur période d'analyse patiente, nourrissent le long espoir d'une synthèse future, de même l'école réaliste ne devra chercher dans ses expériences actuelles, dans l'étude des faits et des phénomènes, que les éléments d'une idéalisation future. Après la période actuelle d'apprentissage artistique, qui n'était pas inutile pour corriger les visibles déviations d'un art depuis trop longtemps traditionnel et conventionnel, elle redeviendra à son tour une école idéaliste, et c'est seulement alors qu'on pourra décider si le nouvel idéal de nos petits-neveux sera d'un degré supérieur ou inférieur à celui de l'école classique, et si la route douteuse, où nous sommes aujourd'hui engagés, aura conduit l'esprit français à un nouveau progrès ou à une décadence définitive."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 420
    "line_start": 6424
    "line_end": 6450
  "translation_ja": "まとめよう。自然主義派は劇場に取り組むと、ごく狭い円の中に閉じこめられていると知る。その限界を越えることは芸術の上でも科学の上でも不可能である。それゆえこの派の信奉者が美学上の無邪気さゆえ思い描くような自然主義の芝居を、私たちは決して見ないだろう。ではこの派の努力はむなしく無益なのか。そう結論するのは不公正であり、真実に反する。この章で指摘した二重の矛盾を避けられるたびに、写実派は、現実そのものを提示して上演の芸術の面積を広げられるし、個別の特徴と一人ひとりの性格を描くことに打ち込んで、劇作の芸術の面積も広げられる。それだけでも侮れない結果であり、野心をそこに限るのが賢明だろう。もっと高い目標を目指すなら、その原則を改めねばならない。科学が辛抱強く分析する時期には、いつか総合ができると長く期待しているように、写実派もいまの実験や事実と現象の研究から、将来、理想を描くための素材だけを求めるべきである。あまりに長く伝統と取り決めに縛られた芸術の、目に見えるゆがみを直すのに、いまの修業の時期は無益ではなかった。それを過ぎれば、この派はふたたび理想を描く流派となる。そのとき初めて、私たちのずっと後の世代の新しい理想が古典派より高いか低いか、今日の私たちが踏み込んでいる不確かな道は、フランスの精神に新しい進歩をもたらしたのか、取り返しのつかない衰退に導いたのかを、決められる。"
  "translation_status": "reviewed"

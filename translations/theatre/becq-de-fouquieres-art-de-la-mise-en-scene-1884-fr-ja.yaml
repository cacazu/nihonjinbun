- "id": "becq-0267"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand il y a dualité de personnages, les deux personnages ou les deux groupes s'équilibrent, placés à peu près à la même distance de la ligne optique. Au troisième acte du Marquis de Villemer, celui-ci est à droite évanoui sur le canapé, et Mlle de Saint-Geneix est à gauche devant la table de travail et le regarde. La toile tombe sur ce tableau qui est ainsi très bien pondéré. Dans ces cas de dualité, il y a quelques précautions à prendre. Ainsi, si l'on voulait représenter la mort du duc de Guise, et que l'on s'appliquât à reproduire le tableau de Paul Delaroche, la mise en scène serait très défectueuse par la raison que le corps du duc de Guise à droite, et surtout le roi qui soulève la tapisserie à gauche seraient dans les zones invisibles. Au théâtre, on serait obligé de disposer la scène autrement, soit qu'on rapprochât les deux groupes de la ligne optique, soit qu'on obliquât la scène en plaçant dans un pan coupé la porte dont le roi soulèverait la portière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 267
    "line_start": 3759
    "line_end": 3772
  "translation_ja": "二人の人物が対になるときは、その二人、あるいは二組を、視線基準線からほぼ等しく離して置くと、釣り合いが取れる。『ヴィルメール侯爵』の第三幕では、侯爵が右のソファに気を失って横たわり、サン＝ジュネ嬢は左の仕事机の前に立って彼を見つめる。このよく釣り合った光景に、幕が下りる。対になる場合には、いくつか気をつけることがある。たとえばギーズ公の死を舞台に出し、ポール・ドラローシュの絵を再現しようとすれば、ひどい演出になるだろう。右のギーズ公の遺体も、ことに左で壁掛けを持ち上げる王も、死角に入ってしまうからである。劇場では別の配置にしなければならない。二組を視線基準線に近づけるか、扉を角を落とした斜めの面に置いて舞台を斜めに振り、その扉の幕を王が持ち上げるようにするかである。"
  "translation_status": "reviewed"

  "translation_ja": "この美学の変革の最初の結果は、劇場からオーケストラを追い出したことだった。今日ではコメディ・フランセーズからも、オデオン座、ヴォードヴィル座、ジムナーズ座からもすっかり姿を消した。居場所を守ったのは、今もメロドラマを専門とする劇場と、オペレッタと昔のヴォードヴィルを掛け合わせた形式を扱う劇場だけである。オーケストラがいなくなったため、音楽が芝居で役割を果たすとすれば、演奏するのは人物自身ということになる。伴奏つき、あるいは無伴奏で歌うか、一つかいくつかの楽器を弾くのである。人物自身が演奏するというが、演奏するように見えるだけのこともしばしばある、とつけ加えなくてはいけない。歌ったり弾いたりしていることになっている俳優が舞台上にいなければ、それで十分である。だが今日、その俳優が舞台上にいる場合には、まず認められない。まだ許されるのは弦楽器の場合で、たとえば『フィガロの結婚』で、小姓の歌う恋の歌にシュザンヌがギターで伴奏する場面ならそうだ。けれども音楽を身につけていない女優には、『ヴィルメール侯爵』のサン＝ジュネ嬢のように一曲ピアノで弾く役は、たいてい務まらない。『バルブリーヌ』なら、歌声に恵まれない女優にも主役が務まる。バルブリーヌは舞台の外で歌い、そこでは歌手が代われるからである。『王は楽しむ』のフランソワ一世役もおおむね同じである。"

- "id": "becq-0402"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aujourd'hui, au théâtre, avec l'aide de la lumière électrique, la mise en scène pourrait réaliser le paysage nocturne décrit par le poète. Au commencement de l'acte, de lourds nuages sombres passeraient sur le ciel étoilé et sur la lune qu'ils obscurciraient. Enfin les nuages, en fuyant, laisseraient voir dans toute sa pureté un ciel profond et étoilé, au milieu duquel brillerait le disque lunaire. Les arbres, des bouleaux au feuillage léger, aux troncs clairs, disposés par bouquets, laisseraient le regard du spectateur se perdre dans «l'océan des nuits.» Le public participerait ainsi, comme les personnages du drame, à la vue de ces beaux effets de la nature, qui sont, en plus d'un endroit, pour Valentin et Cécile, les causes formelles de leurs pensées. Cependant, c'est par un motif de premier ordre que la Comédie-Française n'a pas dû chercher à réaliser cette poétique mise en scène, en admettant, pour un moment, qu'elle eût pu avoir la pensée de le faire. C'est qu'en effet, ce dont on peut juger par certains détails du dialogue (je t'aime! voilà ce que je sais, ma chère; voilà ce que cette fleur te dira, etc.), qui sont incompatibles avec un décor nocturne, c'est qu'en effet, dis-je, la nature évoquée par le poète est purement idéale, c'est-à-dire conçue par son esprit, et que la mise en scène décrite par lui n'est pas la peinture réelle d'un effet vu et observé par ses yeux. Dans la conception de cette scène, ce n'est pas la vue d'un phénomène qui a déterminé l'idée, mais, au contraire, l'idée qui a ramené dans l'imagination du poète la représentation d'un phénomène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 402
    "line_start": 6106
    "line_end": 6128
  "translation_ja": "今日の劇場なら、電灯の力を借り、作者が描いた夜景を演出で実現できるだろう。幕の初め、重く暗い雲が星空と月の前を横切り、月を暗くする。ついに雲が遠のくと、澄みわたる奥深い星空の真ん中に、月の円盤が輝く。木立にまとめた、葉が軽く、幹の明るい白樺は、観客の目が「夜の海」に迷い込むのを妨げない。こうして観客は、劇の人物と同じように、自然の美しい効果を目にする。それは何か所かでヴァランタンとセシルの考えの形相因になっている。しかしコメディ・フランセーズのほうでは、この詩的な演出をやろうと思いつけたと仮定しても、それを実現しようとしてはならない第一級の理由があった。実際、夜間の装置とは相いれない台詞の細部（「愛している！　いとしい人、それだけはわかっている。この花がきみにそう言うだろう」など）から判断できるとおり、作者が呼び起こす自然は純粋に観念的なもの、作者の精神が考えたものだ。作者の描いた演出は、目で見、観察した効果を実際に写したものではない。この場面の構想では、現象を見たことが考えを決めたのではない。反対に考えが、作者の想像の中に現象の表象を迎え入れたのだ。"
  "translation_status": "reviewed"
- "id": "becq-0403"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La Comédie-Française a donc dû chercher l'idée générale du décor au delà des causes formelles de la pensée du poète; et elle a placé Valentin et Cécile au milieu d'une solitude profonde, qui rendît possible au séducteur toute tentative de profanation et fît resplendir l'angélique pureté de cette jeune fille qui, seule, la nuit, vient, sereine et candide, poser son front sur la poitrine de celui qu'elle aime. Le véritable orage qui s'apaise, c'est celui qui s'était soulevé dans le coeur de Valentin, et la véritable étoile, ce n'est pas celle que pourrait allumer le metteur en scène dans le ciel de son décor, c'est celle de l'amour qui se lève dans l'âme purifiée de Valentin. On voit donc combien l'effet général du décor répond mieux à l'idée poétique que les effets particuliers d'une mise en scène plus naturaliste."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 403
    "line_start": 6130
    "line_end": 6141
  "translation_ja": "したがってコメディ・フランセーズは、作者の考えの形相因を越えて装置の全体の考えを探さなければならなかった。ヴァランタンとセシルをひっそりと深い孤独の中に置いた。そこでは男が娘の純潔を汚そうとすれば何でもできた。そのぶん、ただ一人で夜にやって来て、穏やかに、疑いもなく、愛する人の胸に額を置く娘の天使のような純粋さが、きらめくのである。静まってゆく本当の嵐は、ヴァランタンの心に起きていた嵐だ。本物の星は、演出家が装置の空にともせる星ではない。心を洗われたヴァランタンの魂に昇る、愛の星である。だから装置全体の効果は、より自然主義的な演出の個々の効果よりも、詩的な考えにずっとよく応えている。"
  "translation_status": "reviewed"
- "id": "becq-0404"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cet exemple montre qu'il faut lire avec la plus grande attention l'oeuvre que l'on doit mettre en scène et déterminer la nature de l'inspiration de l'auteur. S'il est sensible que le poète a remonté de l'idée au phénomène, comme c'est le cas dans l'exemple précédent, il ne faut pas présenter un ordre inverse au spectateur, et, par conséquent, la mise en scène doit laisser l'idée seule se manifester et éveiller le phénomène dans l'imagination du spectateur, comme cela a eu lieu dans celle du poète. Si, au contraire, il est sensible que l'auteur a voulu subordonner la représentation de l'idée à la présentation du phénomène, il faut s'efforcer de réaliser la mise en scène décrite par lui. Il est clair que dans l'Ami Fritz, sans l'eau qui coule de la fontaine, la légende de Rébecca n'a aucune raison de se représenter à la mémoire de Sichel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 404
    "line_start": 6143
    "line_end": 6155
  "translation_ja": "この例は、演出しようとする作品を最大限注意して読み、作者が何に触発されたかを見きわめねばならないことを示す。前の例のように、作者が考えから現象へとさかのぼったのがはっきりしていれば、逆の順で観客に見せてはならない。したがって演出は考えだけを現れさせ、その現象を、作者の想像の中で起こったとおりに観客の想像の中で呼び起こすべきだ。反対に、作者が考えの表象を現象の提示に従わせようとしたのがはっきりしていれば、作者が描く演出の実現に努めなければならない。『友人フリッツ』で泉から水が流れなければ、リベカの物語がジシェルの記憶によみがえる理由はない。それは明らかだ。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 717
      "end": 728
      "exact": "l'Ami Fritz"
- "id": "becq-0405"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les cas où une mise en scène réaliste s'imposera ne sont pas aussi fréquents ni aussi nombreux qu'on pourrait le croire au premier abord. Le plus souvent, il sera prudent de s'en tenir à l'ancienne conception décorative qui ne recherche qu'un effet simple et général. Et cela pour deux raisons d'ordre supérieur. La première, c'est que l'impression que nous cause la nature se ramène toujours dans la réalité à quelques sensations très simples, telles que la présence ou l'absence de la lumière, le mouvement ou le repos des objets, le bruit ou le silence, le plus ou le moins de vapeur humide dans l'atmosphère, le plus ou le moins de grandeur ou de profondeur, etc. Tout le surplus de nos impressions, souvent très complexes, naît du rapport que ces sensations simples ont avec l'état moral de notre âme. Il faut, par conséquent, dans la représentation des effets de la nature ne pas tenir compte de ce que, précisément, y mettra le spectateur, pour peu que l'action dramatique ait incliné son âme vers tel ou tel état psychologique. C'est là une raison toute philosophique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 405
    "line_start": 6157
    "line_end": 6172
  "translation_ja": "写実的な演出をどうしてもしなければならない場合は、一見考えるほどひんぱんでも、多くもない。たいていは単純な、全体としての効果だけを求める昔の装置の考えにとどまるのが賢明である。それには二つ、より根本的な理由がある。第一に、自然が私たちに与える印象は、実際にはいつも少数のごく単純な感覚に帰着する。光があるかないか、物が動くか静かか、音があるか沈黙か、大気に湿った靄が多いか少ないか、どのくらい広いか奥深いか、といったことである。ときにきわめて複雑な残りの印象は、単純な感覚が私たちの心の状態と結ぶ関係から生まれる。だから自然の効果を表すときには、劇が観客の魂をある心の状態に少しでも向けたなら、観客がまさに自ら補うものまで、先回りして入れるべきではない。これが哲学の上での理由である。"
  "translation_status": "reviewed"
- "id": "becq-0406"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La seconde raison a une portée esthétique à laquelle j'ai déjà fait allusion ci-dessus, et sur laquelle j'appelle l'attention des personnes qui se laissent trop facilement séduire par les promesses de l'école réaliste ou naturaliste. Quand on transporte le monde extérieur, objets ou phénomènes, sur la scène, on n'en donne naturellement qu'une copie, qu'une imitation. Sur la scène, on ne bâtit pas de vraies maisons, on ne plante pas de vrais arbres, on ne déroule pas de véritables flots, on ne pousse pas dans le ciel de vrais nuages, etc.; on ne nous donne de toutes ces choses que des imitations. Or, du moment que l'on ne présente pas au spectateur les objets réels qui, selon le poète, devraient avoir une influence psychologique sur les personnages du drame, on ne peut pas compter que les objets imités auront la même portée, attendu que l'attention du spectateur est, non pas attirée par la contemplation du phénomène naturel, mais préoccupée uniquement du phénomène artistique de l'imitation. Plus l'on compliquera la mise en scène, plus on cherchera à reproduire avec exactitude les impressions de la nature, plus l'on comptera sur la perfection décorative pour agir sur l'inclination morale des spectateurs, et plus l'école réaliste s'éloignera du but qu'elle poursuit; car l'esprit du spectateur, sollicité, par des impressions optiques, et sensible à toute création artistique, s'attachera obstinément à ce qui lui offrira un intérêt immédiat, c'est-à-dire à l'art particulier de la mise en scène, aux procédés scientifiques ou autres de l'imitation, et ne subira par conséquent pas l'influence psychologique qu'on aura eu la prétention d'exercer sur lui. Dans ce cas, c'est tout simplement un art d'ordre inférieur qui prend le pas sur un art d'ordre supérieur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 406
    "line_start": 6174
    "line_end": 6199
  "translation_ja": "第二の理由には、美学上の意味がある。先にも触れたが、写実派や自然主義派の約束にあまりにたやすくひかれる人の注意を引きたい。外の世界の物や現象を舞台へ運べば、当然、写し、模倣しか舞台には出せない。舞台に本物の家を建てず、本物の木を植えず、本物の波をうねらせず、本物の雲を空に走らせることもない。どれも模倣しか与えられない。ところで作者によれば人物の心に作用するはずの、それらの本物を観客に出さない以上、模倣の物が同じ力を持つと当てにできない。観客の注意は、自然現象を眺めることに引かれず、模倣という芸術上の現象ばかりに取られるからだ。演出を複雑にし、自然の印象を正確に再現しようとし、装置の完璧さによって観客の心の向きを変えようとするほど、写実派は目指すところから離れる。目の印象に引かれ、どんな創造にも敏感な観客は、すぐに関心を引くもの、つまり演出の独自の芸術と模倣の科学的その他の手法に固執する。こうして心に影響を及ぼそうとしたはずなのに、影響は及ばない。要するに、次元の低い芸術が次元の高い芸術より前へ出たのである。"
  "translation_status": "reviewed"

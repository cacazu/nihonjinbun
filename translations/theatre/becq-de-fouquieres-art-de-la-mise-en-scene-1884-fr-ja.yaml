- "id": "becq-0381"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est à satisfaire à ce nouveau besoin intellectuel que s'ingénie l'école réaliste ou naturaliste. Nous sommes encore au fort de la bataille que cette école livre aux classiques et aux romantiques et dont les injures sont des deux côtés les projectiles ordinaires. Nous n'y ajouterons pas les nôtres, bien que l'école réaliste ait souvent mérité les sévérités de la critique en flattant les instincts les moins nobles de l'humanité et en prenant le succès d'une oeuvre d'art pour la mesure de sa moralité. Mais les adeptes d'une école quelconque sont des hommes, c'est-à-dire des êtres essentiellement faillibles, dont la vue est courte et le jugement borné. Bien que la plupart aient fait un emploi déplorable et parfois peu recommandable de leur faculté d'observation, il est intéressant de dégager et de mettre en lumière l'idée qui les meut et à laquelle ils ont obéi inconsciemment, et de déterminer la force génératrice dont ils ne sont que des rouages de transmission."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 381
    "line_start": 5742
    "line_end": 5755
  "translation_ja": "この新しい知的欲求を満たそうと工夫をこらすのが、写実派あるいは自然主義派である。この派が古典派、ロマン派に挑んだ戦いはいまも真っ盛りであり、両陣営がふつう投げ合うのは悪口である。こちらからその数を増やしはしない。もっとも、写実派が人間の最も卑しい本能におもねり、作品の成功を道徳性の尺度としたことで、厳しい批判に値することはしばしばあった。だがどの派の信奉者も人間だ。人間は本来誤りやすく、視野が狭く、判断に限界がある。大半の者は観察力を嘆かわしく、ときにはほめられないことに使ってきた。とはいえ、彼らを動かし、彼らが知らずに従った考えを取り出して見えるようにし、彼ら自身は歯車として伝えているだけの原動力が何なのかを見極めるのはおもしろい。"
  "translation_status": "reviewed"
- "id": "becq-0382"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, on peut aisément reconnaître que l'école réaliste, ses excès mis à part, obéit, mais aveuglément et sans conscience du but final de l'art, à l'esprit qui gouverne le monde moderne. La science s'est d'abord lancée à la conquête de l'infiniment grand; aujourd'hui, elle pénètre dans l'infiniment petit. Après la synthèse audacieuse est venue l'analyse patiente; et nous sommes à l'ère des sciences et des arts microscopiques, qui poursuivent la vie jusque dans ses retraites les plus secrètes et les plus ignorées. L'auteur dramatique ne fait donc qu'obéir à la tendance générale quand il fouille les plis les plus cachés de l'âme humaine et soumet à son étude les ferments de sa désorganisation morale. En même temps, les couches humaines les plus profondes, entraînées par le grand mouvement des révolutions s'élèvent comme une écume à la surface des sociétés et viennent d'elles-mêmes se placer dans le champ de ses observations. Son oeil patient décompose ces masses et s'attache aux caractères particuliers qui différencient ces millions d'individualités. Chacune d'elles est un nouveau monde, complexe et complet en soi, qui obéit à ses lois propres et relatives, dérivées des lois générales et absolues. Par suite, le problème dramatique semble être aujourd'hui de mettre en relief, non les caractères communs et collectifs que ces individualités offrent à un observateur attentif, mais les caractères particuliers qui de chacune font un être distinct."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 382
    "line_start": 5757
    "line_end": 5778
  "translation_ja": "写実派が行き過ぎを別にすれば、近代世界を支配する精神に従っていることは、たやすく認められる。ただし盲目的に、芸術の究極の目的に気づかずに、である。学問はまず限りなく大きいものの征服に乗り出した。いまは限りなく小さいものに分け入る。大胆な総合のあとに忍耐強い分析が来て、私たちは生命の最もひそかで未知の隠れ家まで追ってゆく、顕微鏡の学問と芸術の時代にいる。したがって劇作家が人間の魂の最も隠れたひだを探り、その道徳的な崩壊の種を研究にかけるときも、全体の傾向に従っているにすぎない。同時に、社会の最も深い層が革命の大きな動きに運ばれ、泡のように社会の表面に浮かび上がって、自ら観察の視野へ入る。忍耐強い作者の目はこの集団を分解し、何百万もの個人を区別するそれぞれの特徴に注目する。一人ひとりが新しい世界であり、それ自体で複雑かつ完結していて、普遍的で絶対の法則から導かれる、固有で相対的な法則に従う。したがって今日の劇作の問題は、注意して見る者に明らかな、これらの個人に共通する集団的性格ではなく、一人ひとりを別の人間にする特別の性格を浮き彫りにすることのようだ。"
  "translation_status": "reviewed"
- "id": "becq-0383"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'art réaliste vise donc l'individuel et partant l'exceptionnel, d'où l'extrême difficulté d'en obtenir une représentation, toute représentation étant toujours le résultat d'un travail idéal et d'une généralisation. C'est pourquoi la nouvelle école voudrait ramener l'art à la présentation du réel, sans se rendre compte de ce que cette ambition a précisément de chimérique. Toute oeuvre d'art ne peut être qu'une représentation du réel et partant est une création idéale: il suffit pour arriver à cette conclusion de ne pas raisonner par à peu près et de prendre les mots avec leur sens exact. Une oeuvre dramatique, conçue selon les visées réalistes, est uniquement une oeuvre dont l'idéal est moins général et moins élevé, et que son infériorité seule rapproche des données de la réalité courante et journalière. Ce but, quoique plus humble, est cependant celui qui seul justifie les prétentions de l'école réaliste. Étant données des passions humaines, qui sont de tous les temps, il s'agit de leur chercher des motifs dans notre monde actuel et de les développer selon des raisons déduites des lois complexes des sociétés modernes. Ramenée ainsi dans ces limites plus étroites, l'école réaliste peut se défendre et se justifier."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 383
    "line_start": 5780
    "line_end": 5797
  "translation_ja": "写実芸術が目指すのは個別的なもの、したがって例外的なものである。ゆえにそれを表象するのはきわめて難しい。表象はいつも、観念上の働きと一般化の結果だからだ。そこで新しい流派は、芸術を現実そのものの提示に戻したいと望むが、まさにその野心の空しさには気づかない。どんな芸術作品も現実の表象でしかありえず、それゆえ観念的な創造である。曖昧な推論を避け、言葉を正確な意味で取れば、その結論に達するには十分だ。写実派の目標に沿って構想された劇は、ただ、その理想がいっそう普遍的でなく、いっそう低い劇にすぎない。その低さゆえに、日常の現実の事実に近づくのである。よりつつましい目標だが、写実派の主張を正当化できるのは、これだけだ。どの時代にもある人間の情念について、いまの世界でその動機を見つけ、近代社会の複雑な法則から引き出した理由に沿って展開する。この狭い限界に戻ったなら、写実派は自らを守り、正当化できる。"
  "translation_status": "reviewed"
- "id": "becq-0384"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans ses fouilles au fond de l'homme moderne, et dans son étude directe de toutes les choses de la nature, le réalisme trouvera la vie, une vie intense mêlée à un mouvement vertigineux. Les limites superficielles de l'art se trouveront ainsi reculées; et l'exploration mettra le pied sur quelques-unes des terres encore peu foulées de l'humanité et de la vie. Le nombre des personnages de théâtre s'accroîtra considérablement, et chacun d'eux ne nous apparaîtra plus qu'avec son idéal particulier, c'est-à-dire un idéal ramené à la mesure de son intelligence, de son développement moral et de sa fonction sociale. D'où la diversité extraordinaire du spectacle, ce qui est une séduction pour l'esprit moins généralisateur du public actuel. Aussi l'avenir immédiat semble appartenir à l'art nouveau. Il était d'ailleurs fatal que l'apparition de l'école réaliste ou naturaliste fût synchronique à l'épanouissement de l'esprit démocratique dans les sociétés modernes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 384
    "line_start": 5799
    "line_end": 5812
  "translation_ja": "近代人の深みを掘り、自然のあらゆるものをじかに調べることで、写実主義は生命を見出す。目が回るような運動と混じった、強烈な生命である。こうして芸術の外縁が広がり、人間と生命の、まだあまり踏み入られていない土地のいくつかに、探究の足が届く。舞台人物は著しく増え、一人ひとりが独自の理想、つまりその知性、道徳的な成熟、社会での役割に見合う理想だけを持って私たちの前に現れる。そこから、舞台上の並外れた多様さが生まれ、一般化する力の弱まった今日の観客を魅了する。すぐ先の未来は、新しい芸術のもののようだ。写実派あるいは自然主義派の出現が、近代社会に民主主義の精神が花開くのと同時だったのも、避けがたいことだった。"
  "translation_status": "reviewed"
- "id": "becq-0385"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais toute la poussée furieuse de cette école n'aboutira qu'à un avortement, si elle s'enfonce de plus en plus dans l'analyse de matières au sein desquelles la vie n'a jamais été et ne sera jamais. Ce sont les manifestations seules de la vie qui doivent faire l'objet de ce que l'école appelle ambitieusement ses expériences. La nature ne doit y entrer que par ses rapports avec la vie, et par le rôle passif qu'elle joue dans le développement de l'activité humaine. L'étude de la nature inerte, de la matière en soi, est donc une première cause d'avortement que devra éviter l'école réaliste. Une autre cause est le manque de contrôle, partant le manque d'intérêt et de sympathie qu'offre toute manifestation individuelle et exceptionnelle de la vie. C'est pourquoi, à mesure que l'analyse descendra dans l'infiniment petit, l'intérêt du spectateur décroîtra dans la même proportion."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 385
    "line_start": 5814
    "line_end": 5826
  "translation_ja": "だがこの派の猛烈な勢いも、生命がかつて存在せず、これからも存在しない素材の分析にひたすら沈み込むなら、挫折しかもたらさない。この派が大仰に実験と呼ぶものは、生命の現れだけを対象としなければならない。自然が入ってよいのは、生命との関係を通じてだけ、また人間活動が発達するうえで自然が果たす受け身の役割によってだけだ。動かない自然、物質そのものの研究は、写実派が避けなければならない挫折の第一の原因である。もう一つは、生命の個別的、例外的な現れには確かめる手がかりがなく、したがって興味も共感も乏しいことである。だから分析が限りなく小さいものへ下るにつれ、観客の関心も同じ割合で薄れるだろう。"
  "translation_status": "reviewed"
- "id": "becq-0386"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une troisième cause, parmi beaucoup d'autres que nous pourrions encore citer, est le dédain irréfléchi de l'école pour la psychologie et pour la morale. Il est particulièrement un point important sur lequel elle se trompe étrangement. L'intérêt qu'elle paraît porter aux classes populaires part d'un bon naturel, je veux le croire, mais l'entraîne à nous représenter trop souvent comme contradictoires l'élévation morale et l'élévation sociale, tandis que ce sont, en définitive, les exceptions mises à part, les deux colonnes égales et parallèles qui supportent tout l'édifice de la société et de la civilisation. A ce dédain de la psychologie se joint un amour immodéré pour la physiologie. Tout le monde sait que le physique réagit sur le moral; c'est un sujet que Cabanis, au point de vue descriptif, me semble avoir épuisé du premier coup. Malheureusement, le naturalisme tend à remplacer l'étude psychologique par la description du phénomène physiologique qui en est l'antécédent. Or ce qu'on peut reprocher à ce procédé c'est-d'être absolument puéril. Tous ceux qui ont un instant réfléchi sur les conditions de la production artistique savent que la description physiologique est ce qu'il y a au monde de plus facile et de plus banal. La difficulté et l'intérêt ne commencent que lorsque l'artiste entreprend l'étude du moral."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 386
    "line_start": 5828
    "line_end": 5847
  "translation_ja": "まだいくつも挙げられるが、第三はこの派が心理と道徳をよく考えずに軽んじることだ。一つの重要な点でとりわけ奇妙な誤りを犯している。民衆に関心を寄せるのは、人柄がよいからだと思いたい。だがその関心のため道徳上の高みと社会的な高みを、あまりにしばしば対立するかのように描いてしまう。例外は措いて結局、二つは等しく並行し、社会と文明の建物全体を支える二本の柱なのに。心理を侮る一方、生理学をむやみに好む。身体が心に作用することは誰でも知っている。記述という点ならカバニスが一挙に論じ尽くした主題だと思う。不幸にも自然主義は、心理の研究を、その前に起こる生理現象の描写で置き換えようとする。この手法はまったく子供じみていると言わざるを得ない。芸術の成立条件を少しでも考えた人は、生理の描写ほど世の中で簡単でありふれたものはないことを知っている。難しさとおもしろさは、芸術家が心の研究に乗り出すところから初めて始まる。"
  "translation_status": "reviewed"
- "id": "becq-0387"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans l'état de la question, il est nécessaire que l'école aborde le théâtre: elle y trouvera peut-être le salut, car c'est le théâtre seul qui la forcera d'abandonner ses vaines prétentions physiologiques et qui l'amènera à relever son idéal, en lui imposant des généralisations nécessaires. En effet, l'école réaliste trouvera dans l'observation des réalités vivantes plus d'éléments de drames et de comédies, que de drames tout composés et de comédies toutes faites. Pour construire un drame ou une comédie, il faut rassembler ces éléments épars, les faire concourir à une même action, et par une logique sévère, qui ne réside que rarement dans l'esprit des êtres réels, mener cette action d'un commencement à une fin. Cette nécessité théâtrale sera pour l'école réaliste un retour forcé à l'idéal. Si celle-ci est assez sensée pour joindre à l'observation réaliste la méthode classique, toute psychologique, elle assurera le salut de l'art moderne, en lui infusant une vie nouvelle; mais, si elle rejette tout compromis, par mépris irraisonné de l'idéal, elle usera ses forces à des besognes minuscules, et l'art désagrégé se dispersera en poussière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 387
    "line_start": 5849
    "line_end": 5865
  "translation_ja": "こうした状況では、この派が実際に演劇に取り組む必要がある。そこに救いが見つかるかもしれない。なにしろ、むなしい生理学上の要求を捨てさせ、必要な一般化を課すことで理想を引き上げさせられるのは、演劇だけだからだ。じっさい、写実派が生きた現実を観察して見出すのは、出来上がった劇や喜劇というより、劇や喜劇を作る素材である。劇や喜劇を作るには、散らばった素材を集め、一つの筋を共に支えさせ、実在の人間の精神にはめったにない厳密な論理によって、その筋を初めから終わりへ運ばなければならない。この演劇の必然が、写実派を無理にでも理想へ戻す。写実的な観察に、あくまで心理的な古典の方法を合わせるだけの判断があるなら、新しい生命を注ぎ、近代の芸術を救うだろう。だが理想を考えもなく侮り、どんな折り合いも拒否するなら、細かな作業に力を費やし、ばらばらになった芸術はちりとなって散るだろう。"
  "translation_status": "reviewed"
- "id": "becq-0388"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jusqu'à présent, l'école hésite à aborder le théâtre par le pressentiment qu'elle a d'échouer ou d'être obligée d'abandonner ce que ses théories ont d'absolu. Toutefois je crois à des tentatives prochaines, car laisser le théâtre en dehors de sa sphère d'action serait pour l'école un aveu d'impuissance. Après avoir bataillé sur les ouvrages avancés, il lui faut donner l'assaut au corps de place. Si l'expérience échoue, elle sera courte, mais laissera pendant assez longtemps l'art dans une très grande confusion; si elle réussit, elle renouvellera le théâtre, en agrandissant en quelque sorte la superficie dramatique; et l'art, bien qu'abaissé en dignité, puisque son idéal sera moins élevé, entrera cependant dans une période de fécondité extraordinaire, car tous les sujets traités depuis deux mille ans, et quelques-uns à satiété, reprendront une vie nouvelle par suite de cette transfusion de sang moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 388
    "line_start": 5867
    "line_end": 5880
  "translation_ja": "この派は、失敗するか、理論の絶対的な部分を捨てざるをえないだろうという予感から、これまで演劇に取り組むのをためらっている。もっとも、近いうちに試みがあると思う。演劇を活動範囲から外すのは、力不足を認めることになるからだ。前哨をめぐって戦ったら、今度は要塞そのものに攻めかからなければならない。試みが失敗すれば期間は短くても、芸術はかなり長いあいだ、大きな混乱に置かれるだろう。成功すれば、いわば劇作の面積を広げ、演劇を一新する。理想が低くなるため品位は下がるとはいえ、芸術は実りの並外れて豊かな時代に入る。二千年来扱われ、もううんざりするほど扱われたものもあるあらゆる題材が、近代という血を注ぎ込まれることで、新しい生命を得るからだ。"
  "translation_status": "reviewed"
- "id": "becq-0389"
  "section_id": "ch39"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE XXXIX"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 389
    "line_start": 5884

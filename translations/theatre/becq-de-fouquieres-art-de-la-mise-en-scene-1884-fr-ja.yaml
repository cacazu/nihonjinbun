- "id": "becq-0327"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aptitude à jouer certains rôles.--De la personnalité scénique de l'acteur.--Complexité et hétérogénéité des rôles modernes.--Leur influence sur l'art dramatique et sur l'art théâtral.--Déformation du talent de l'acteur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 327
    "line_start": 4776
    "line_end": 4779
  "translation_ja": "ある役を演じる適性。俳優の舞台上の個性。近代の役は複雑で、互いに異なる。それが戯曲と舞台の芸術に及ぼす影響。俳優の才能が変形すること。"
  "translation_status": "reviewed"
- "id": "becq-0328"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si on examine un certain nombre de rôles avec quelque attention, on s'apercevra que les uns et les autres sont à quelque degré semblables ou dissemblables entre eux, et qu'ils peuvent se répartir en diverses classes plus ou moins séparées les unes des autres. Ainsi, si nous revenons aux exemples que nous avons cités dans le chapitre précédent, nous trouverons que les rôles d'Olivier de Jalin, de Gaston de Presle et du duc de Richelieu forment une certaine classe et que ceux de Raymond de Nanjac, de Montmeyran et du chevalier d'Aubigny en forment une autre. Dans chaque classe, les rôles ont entre eux quelque analogie, quelque rapport plus ou moins proche, quelque affinité secrète, tandis que d'une classe à l'autre ce sont des dissemblances qui s'affirmeront, des oppositions plus ou moins fortes et plus ou moins saillantes. Par conséquent, toutes les images initiales, qui sont les points de départ des rôles d'une même classe ayant quelques caractères communs, dériveront toutes d'une même image plus lointaine, plus générale, hiérarchie d'images absolument semblable à la hiérarchie des idées. Ces images générales constituent en quelque sorte des personnalités complexes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 328
    "line_start": 4782
    "line_end": 4799
  "translation_ja": "いくつかの役を注意して見ると、どの役も互いにいくらか似ていたり違っていたりして、多少の隔たりを持ついろいろな種類に分けられると気づく。たとえば前の章で引いた例に戻れば、オリヴィエ・ド・ジャラン、ガストン・ド・プレル、リシュリュー公爵の役はある種類を作り、レーモン・ド・ナンジャック、モンメラン、ドービニー騎士の役は別の種類を作る。種類の中では、役どうしに類似や、近いにせよ遠いにせよ関係があり、人目につかない親和性もある。一方、種類から種類へ移れば、違いがはっきりし、強いにせよ弱いにせよ、目につきやすいにせよつきにくいにせよ、対照が出てくる。だから、同じ種類の役の出発点にあり、いくつかの共通の特徴を持つ初めの像は、すべて同じ、より遠く、より一般的な像から生まれたことになる。この像の階層は、観念の階層とまったく同じだ。一般の像は、いわば複合的な個性をなしている。"
  "translation_status": "reviewed"
- "id": "becq-0329"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De même on pourrait diviser une agglomération d'hommes en groupes plus ou moins nombreux, constituant des personnalités complexes, et dont tous les membres auraient entre eux un certain air de parentage. Eu faisant encore un pas, on pourrait dès lors établir une correspondance entre ces groupes d'êtres humains et ces classes dans lesquelles nous avons dit que se répartissaient tous les rôles; et l'on verrait que le comédien, en tant qu'homme, appartenant à quelque groupe, porte en lui l'air de cette personnalité complexe à laquelle se rattache la sienne propre, et que par conséquent son aspect, son image a quelque rapport avec l'image générale de laquelle se déduisent les images initiales d'une série plus ou moins nombreuse de personnages de théâtre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 329
    "line_start": 4801
    "line_end": 4811
  "translation_ja": "同じように、人の集まりを大小さまざまな組に分けることもできよう。それぞれ複合的な個性をなし、その一員にはどこか互いに似通ったところがある。もう一歩進んで、こうした人間の組と、先ほどすべての役を割り振った種類とを対応させることもできよう。そうしてみれば、一人の人間としてはどこかの組に属する俳優は、自分の個性がつながる複合的な個性に似たところを、身に持っていると分かる。ゆえにその外見、その像は、舞台に出るいくつもの人物の初めの像を引き出すもとである一般の像と、何らかの関係を持つ。"
  "translation_status": "reviewed"
- "id": "becq-0330"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un acteur possède donc par lui-même une aptitude particulière à remplir certains rôles. C'est cette aptitude, cette conformité naturelle que consultent surtout les auteurs et les directeurs de théâtre quand il s'agit de distribuer les rôles d'une pièce; et l'importance en est tellement grande pour le résultat final, qu'il arrive à chaque instant aux auteurs, en concevant et en écrivant leurs pièces, de se composer une troupe idéale de comédiens connus, et, bien mieux encore, de conformer l'image du rôle qu'ils dessinent à l'image personnelle de tel ou tel artiste. Bien entendu il ne faudrait pas restreindre cette concordance entre un artiste et un groupe de rôles à de simples similitudes physiques. Sans doute le physique n'est pas sans importance, mais en tout cas il ne peut s'agir que du physique tel qu'il est modifié par les conditions scéniques, et vu à la lumière de la rampe, dans la perspective du décor. Il est des acteurs que la scène grandit, d'autres qu'elle rapetisse; mais c'est surtout la physionomie que l'optique théâtrale modifie profondément, ce qui se conçoit aisément, puisque la lumière du jour et celle de la rampe avivent les mêmes traits en sens inverse. Mais cette concordance tient, en outre, à la prédisposition nerveuse qui est la source de la sensibilité, à l'inclination morale, à la qualité et au timbre de la voix, à l'expression du regard et à la plasticité générale. Dans la mise en scène, la distribution des rôles est donc d'une importance capitale. Une faute dans cette distribution est en tout point semblable à celle que commettrait un musicien qui se tromperait sur le caractère physiologique des instruments et ferait exprimer par les hautbois ce qui ne peut l'être que par les trompettes, ou voudrait forcer les clarinettes à nous faire éprouver les mêmes sentiments que les violoncelles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 330
    "line_start": 4813
    "line_end": 4839
  "translation_ja": "したがって俳優には、おのずとある役を務める特別の適性がある。芝居の役を割り振るとき、作者と劇場の支配人が何よりも見るのは、この適性、自然な似かよりである。出来上がりにとってあまりに重大なので、作者が芝居を考え書くとき、よく知る俳優たちで理想の一座を頭の中に作ることは珍しくない。それどころか、描いている役のイメージを、ある芸術家その人のイメージに合わせることまである。むろん、俳優とある一群の役とのこの一致を、単に見た目の似かよりに限ってはならない。たしかに見た目も大事だが、ここで言うのは、舞台の条件によって変わり、装置の遠近の中でフットライトに照らされた見た目だけだ。舞台で大きく見える俳優も、小さく見える俳優もいる。だが舞台の光の具合がとりわけ大きく変えるのは、顔つきである。同じ顔の特徴でも、日光とフットライトとは反対の方から際立たせるのだから、分かりやすい話だ。それだけでなく、この一致は感受性のもととなる神経の傾き、気立て、声の性質や音色、まなざしの表情、そして体の形やしなやかさ全般にもよる。ゆえに演出において配役はきわめて重要だ。ここで誤るのは、楽器の身体的な特性を取り違えた音楽家が、トランペットにしか表せないことをオーボエに表させたり、チェロと同じ感情を無理にクラリネットで起こそうとしたりするのとまったく同じだ。"
  "translation_status": "reviewed"
- "id": "becq-0331"

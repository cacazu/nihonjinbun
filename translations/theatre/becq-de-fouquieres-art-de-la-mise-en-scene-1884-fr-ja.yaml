      "exact": "la Charbonnière"
- "id": "becq-0418"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans le Pavé de Paris, joué à la Porte-Saint-Martin, un tableau représentait l'intérieur d'un tunnel. A un moment donné, un train de chemin de fer traversait la scène à l'arrière-plan. Je ne me souviens pas bien au juste de la fable dramatique; en tous cas, à l'arrivée du train, en tête duquel s'avançait la locomotive, armée de ses feux rouges comme de deux yeux sinistres, la déception du spectateur était complète, et ce chemin de fer de carton frisait le ridicule. C'est qu'en effet ce n'était qu'un joujou. La locomotive et les voitures du train n'avaient que les dimensions que leur imposait la perspective théâtrale, et par conséquent elles étaient trop petites pour la distance réelle. Dans la Jeunesse du roi Henri, un des décors représentait un carrefour dans une forêt, et la perspective habile donnait à cette forêt de vastes proportions. Soudain, deux ou trois cavaliers débouchent du fond, suivis d'une meute de vrais chiens: immédiatement la forêt devient un joujou. C'est Gulliver s'ébattant maladroitement dans un paysage de l'île de Lilliput. Cette contradiction optique provient, on le sait, de ce que la profondeur de la scène est en grande partie fictive. Voilà encore un obstacle que ne pourra surmonter l'école naturaliste. Il lui est donc interdit de composer des tableaux où doit éclater la contradiction qui résulte de la juxtaposition d'êtres soumis à la perspective réelle de la nature et d'objets soumis à la perspective fictive des théâtres."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 418
    "line_start": 6390
    "line_end": 6410
  "translation_ja": "ポルト＝サン＝マルタン座で上演した『パリの敷石』では、一場面がトンネルの中を表した。あるとき舞台奥を鉄道の列車が横切った。芝居の筋はもう正確には思い出せないが、ともかく、物騒な二つの目のような赤い灯火をつけた機関車を先頭に列車が入ってくると、観客はすっかり幻滅した。厚紙の鉄道が滑稽すれすれだったのだ。事実、ただのおもちゃなのである。機関車と車両には舞台の遠近法が課した大きさしかなく、本当の距離に対しては小さすぎた。『アンリ王の若き日』ではある装置が森の辻を見せ、巧みな遠近法でその森は広々と見えた。とつぜん二、三人の騎馬の男が奥から飛び出し、本物の犬の群れがあとを追う。とたんに森はおもちゃになる。小人の国の風景を不器用に走り回るガリヴァーだ。この目の矛盾は、周知のとおり、舞台の奥行きが大部分は虚構であることから生じる。自然主義派には、これも越えられない。自然の実際の遠近法に従う生きものと、劇場の架空の遠近法に従う物を並べた矛盾があらわになる場面は、したがって作れないのだ。"
  "translation_status": "reviewed"

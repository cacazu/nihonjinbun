- "id": "becq-0309"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le metteur en scène et l'acteur doivent donc s'attacher à bien déterminer les traits généraux des êtres dont ils doivent exposer aux yeux du public la représentation théâtrale, et les caractères communs de tous les phénomènes particuliers qui composent l'idée qu'ils veulent rendre sensible et visible. Dans toute nouvelle création, leur mérite consiste, surtout pour l'acteur, dont l'art est plus fécond et plus personnel, à amener la représentation scénique à son point de perfection, c'est-à-dire à déterminer jusqu'où ils peuvent pousser la réalisation de l'idée dont ils possèdent en eux l'image subjective. A mesure que le temps s'écoule, que les générations se succèdent, il y a des images qui s'affaiblissent et d'autres qui, au contraire, s'éclaircissent et se précisent. Les idées qui flottent dans l'imagination des hommes sont semblables aux images que nous tenons dans le champ de notre lorgnette et qui, selon les dispositions relatives que nous donnons aux foyers des lentilles, se rapprochent et se précisent ou s'éloignent en se diffusant. Le comédien doit donc s'efforcer de bien discerner les traits dont se composent les idées des spectateurs; et son ambition constante est de découvrir quelques-uns des caractères communs, si faibles qu'ils soient, que ses prédécesseurs ont négligé de mettre en évidence; enfin de se rendre compte des modifications que le temps ou des circonstances particulières ont apporté à ces idées. C'est en ce sens que le comédien doit toujours étudier la nature; car il est nécessaire qu'il compare, le plus souvent possible, la présentation et la représentation des phénomènes, afin de discerner si les traits dont il revêt ses imitations ont bien tous le caractère général qui sera pour tous les spectateurs la marque de la vérité, et de découvrir peut-être quelque trait nouveau qui soit de nature à rendre la ressemblance plus parfaite."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 309
    "line_start": 4426
    "line_end": 4453
  "translation_ja": "そこで演出家と俳優は、舞台で観客の目にさらす人物の全般的な特徴と、感じられ、見える形にしようとする観念を作る個々の現象の共通の特徴を、よく見きわめなくてはならない。新しい創造のつど、その持ち味が発揮されるのは、舞台の表象を完成へ導くとき、すなわち、自分の内にある主観的なイメージを、どこまで実現できるか見定めるときだ。とりわけ、俳優の技は実りが多く、個性が出るので、これは俳優によく当てはまる。時が進み、世代が変わるにつれて、薄らいでいくイメージもあれば、かえって明るくなり、輪郭が定まっていくイメージもある。人々の想像に浮かぶ観念は、観劇用の眼鏡の視野に入った像に似ている。レンズの焦点の位置関係を変えると、像は近づいてはっきりし、あるいは遠のいてぼやける。ゆえに俳優は、観客の観念がどんな特徴からできているか、よく見分けなくてはならない。どんなに小さくても、先人がはっきりさせなかった共通の特徴をいくつか見つけ、時代や特別な事情がこれらの観念をどう変えたかを知る。そこに俳優はいつも努めることになる。その意味で、俳優はいつも自然を観察しなくてはならない。できる限り何度も、現象そのものが現れるときと心に表象されるときとを比べ、自分が模倣に与えた特徴がすべて、観客の誰にとっても真実の印となるような一般性を持つか見きわめる必要がある。そして、似せ方をさらに完全にするような新しい特徴が、ひょっとしたら見つかるかもしれない。"
  "translation_status": "reviewed"
- "id": "becq-0310"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si, par suite de circonstances fortuites, les hommes d'une génération ont été à même d'observer plus souvent ou mieux que ceux qui les ont précédés un certain ordre de faits, l'idée qu'ils en conçoivent sera sensiblement différente de celle qu'en possédaient les générations antérieures; et le comédien, s'il a de l'intuition et de la pénétration, ne se contentera plus pour les représenter des traditions de métier, mais modifiera son jeu de manière à reproduire l'image actuelle et à trouver sa ressemblance exacte. Supposons qu'une actrice, ayant créé il y a vingt ans le rôle d'une convulsionnaire, dût de nouveau en créer un semblable aujourd'hui, devrait-elle se contenter de reproduire identiquement le jeu de scène qui lui a valu jadis un succès? Nullement, car les idées que nous avons aujourd'hui sur les névroses sont sensiblement différentes de celles que nous avions il y a vingt ans. On s'est beaucoup occupé de cette question; les journaux l'ont agitée, ont rendu compte avec force détails des nombreuses expériences faites avec éclat sur l'hystérie; et l'idée que nous nous faisons actuellement d'une convulsionnaire a des formes plus nettes et plus accusées. L'actrice devra donc procéder à une nouvelle mise au point, ajouter à son jeu d'autrefois et le mettre en harmonie avec l'idée actuelle des spectateurs, avec discernement, d'ailleurs, et sans exagération, car les idées humaines n'ont que de lentes évolutions. Mais enfin tel trait qui, dans son jeu, eût paru extravagant il y a vingt ans, paraîtrait aujourd'hui vrai et naturel. Ce n'est pas la réalité cependant qui a changé, mais l'image idéale qu'en possède l'esprit des spectateurs. On voit en quels sens divers le talent d'un comédien peut toujours progresser par l'observation; c'est un art qui n'est jamais immobile, mais qui se renouvelle constamment et qui, dans son évolution, suit les évolutions des idées humaines."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 310
    "line_start": 4455
    "line_end": 4482
  "translation_ja": "偶然の事情から、ある世代の人が、先の世代よりもある種の出来事をたびたび、またはよく見ることができたとしよう。その出来事について抱く観念は先の世代のものとは目立って異なる。直観と洞察力のある俳優なら、その出来事を表すときに職業上の伝統だけでは満足せず、いまのイメージを再現し、正確に似せられるよう演技を変える。たとえば二十年前にけいれん発作を起こす女の役を初めて演じた俳優が、今日また同じような役を新たに演じるとしよう。昔成功した演技をそっくり再現して満足すべきだろうか。そうではない。神経症について今日の私たちが抱く観念は、二十年前とは明らかに違う。この問題は多くの関心を集めた。新聞は問題を取り上げ、いわゆる「ヒステリー」について公然と行われた数々の実験を詳しく報じた。いま私たちがけいれん発作を起こす女性について持つ観念は、以前より明瞭で輪郭が際立っている。したがって俳優は、もう一度焦点を合わせ直し、昔の演技に足して、観客がいま抱く観念と調和させなければならない。もっとも、人の観念は少しずつしか変わらないから、分別をもって誇張せずに行う。それでも、二十年前なら演技のなかで途方もなく見えたところが、今日なら真に迫り自然に見えるだろう。変わったのは現実ではない。観客の心にある、現実を理想化したイメージだ。観察によって俳優の腕がさまざまな方向へいくらでも伸びてゆけることが分かる。俳優の芸は止まってはおらず、絶えず新しくなり、その変化は人間の観念の変化を追ってゆく。"
  "translation_status": "reviewed"
- "id": "becq-0311"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La méthode de travail du comédien se résume donc en deux points: premièrement, détermination des traits généraux de l'image qui est la synthèse idéale d'un ensemble de phénomènes particuliers et réels; deuxièmement, retour fréquent à l'observation de la nature, afin de découvrir si l'examen comparé des phénomènes ne lui fournira pas quelque caractère commun jusqu'ici négligé ou inaperçu, ou si, dans les présentations fortuitement fréquentes d'un phénomène, la réapparition d'un trait particulier ne l'élève pas à l'importance d'un trait général. Ce deuxième point est extrêmement délicat, car il est toujours tentant d'ajouter quelque chose au jeu de ses prédécesseurs ou de ses émules; et c'est presque toujours par excès que pèchent les comédiens, par suite de l'attention que plus que tout autre ils apportent à l'observation des phénomènes. Quand, dans le jeu d'un comédien, un trait paraît contraire à la nature, on peut presque toujours être certain que ce trait a cependant été observé et pris sur la nature par le comédien, dont l'erreur a uniquement consisté à lui attribuer un caractère général qu'il n'avait pas, et par conséquent à évoquer aux yeux des spectateurs une image différant par excès de l'idée qui a pu se former dans l'esprit du plus grand nombre d'entre eux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 311
    "line_start": 4484
    "line_end": 4502
  "translation_ja": "そこで俳優の仕事の方法は、二つにまとめられる。第一に、現実にある個別の現象を心の内で一つにまとめたイメージについて、その全般的な特徴を見定める。第二に、たびたび自然の観察に戻る。現象を比べて調べて、今まで見落としたり気づかなかったりした共通の性質が見つからないか。偶然にも一つの現象をたびたび目にするとき、同じ特徴が繰り返し現れるために、個別の性質が全般的な特徴に値するほどになることがないか。それを確かめる。第二の点はたいへん繊細だ。先人や同業の競争相手の演技に何かを付け足したくなるのは、いつものことだからだ。俳優は誰よりも現象の観察に注意を払うので、たいていはやり過ぎる方の過ちを犯す。俳優の演技に自然に反する一面があっても、ほとんど確実に、それを俳優は自然のうちに見つけ、取ってきたのである。ただ、それにない一般性まであると思ったこと、したがって、多くの観客の心にできていた観念からはみだすようなイメージを観客の目に呼び出したことが、誤りなのだ。"
  "translation_status": "reviewed"
- "id": "becq-0312"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici entre autres un exemple. Dans un drame intitulé Smilis, joué récemment à la Comédie-Française, on voyait, au premier acte, deux vieux amis, l'un amiral, l'autre commandant, se retrouvant après une longue séparation, tomber dans les bras l'un de l'autre. Or les acteurs avaient cru devoir ajouter le baiser à l'accolade, baiser franchement donné et reçu, et entendu de tous les spectateurs qui ne pouvaient réprimer un sourire, témoignage instinctif de leur étonnement. C'est qu'en effet c'était une faute de mise en scène de la part des deux excellents comédiens, provenant précisément d'une judicieuse et réelle observation: beaucoup de personnes savent que les militaires et les marins ont l'inoffensive habitude de s'embrasser fraternellement quand ils se retrouvent dans leur carrière aventureuse. Mais les comédiens avaient eu le tort de relever un trait particulier ne s'accordant pas avec l'idée générale que se forme le public de deux hommes qui se jettent dans les bras l'un de l'autre. L'embrassade, en effet, n'admet, dans la vie réelle, que le simulacre du baiser, qui aux yeux de la plupart des hommes est un acte entaché d'un peu de ridicule. Voilà donc une légère faute de mise en scène qui a précisément pour cause l'observation exacte de la nature dans certains cas particuliers; et la faute a consisté dans la substitution d'une image particulière à l'image générale qui seule répondait à l'idée que se faisaient du fait représenté les dix-huit cents spectateurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 312
    "line_start": 4504
    "line_end": 4525
  "translation_ja": "一例を挙げよう。近ごろコメディ・フランセーズで演じられた『スミリス』という芝居の第一幕で、旧友どうしの提督と隊長が、長く会わなかった末に再会し、互いの腕に飛びこむ。俳優二人は、抱擁に口づけを添えるべきだと考えた。遠慮なく口づけをし、受けたので、音が観客みんなに聞こえた。観客が思わず浮かべた微笑は、その驚きを無意識に物語るものだった。じつは優れた二人の俳優の演出上の誤りで、しかも適切で確かな観察から来ている。軍人や船乗りが、危険の多い職業についていてまた出会ったとき、兄弟のように抱き合って口づけをする害のない習慣があることは、よく知られている。だが二人の俳優は、男同士が抱き合うことについて観客が抱く一般の観念に合わない、個別の特徴を浮き立たせてしまった。現に、たいていの男にとって口づけは少しおかしく見える行為なので、実際の生活でも抱き合う際にはまねをするだけだ。こうして、演出の小さな誤りは、ある特別な場合に自然を正確に観察したことから生じた。千八百人の観客が舞台の出来事に抱く観念に合うのは一般のイメージだけなのに、個別のイメージをその代わりにしたことが、誤りだったのである。"
  "translation_status": "reviewed"

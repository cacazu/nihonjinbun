- "id": "becq-0146"
  "section_id": "ch17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour en revenir à la mise en scène, si l'on faisait une étude comparative des pièces d'observation pure et des pièces qui sont fondées sur la fantaisie, on remarquerait que les premières demandent plus de vérité que les secondes dans l'effet représentatif, et surtout plus de soin dans la composition du matériel figuratif. Dans une pièce où un acte d'observation se mêlerait à plusieurs actes de fantaisie, on verrait de même la nécessité de modifier les conditions de la mise en scène, et tandis que dans celui-là elle serait d'une grande exactitude jusque dans les moindres détails, dans ceux-ci au contraire elle devrait rester sommaire et restreinte aux nécessités scéniques. On en a un exemple frappant dans Ma Camarade, où un acte d'observation et de fine comédie s'intercale entre deux actes de pure fantaisie. Tandis que dans ceux-ci la mise en scène reste sommaire et tout à fait approximative, elle est traitée dans celui-là avec les plus grands soins, tant dans l'ensemble de la décoration que dans tous les détails du matériel figuratif."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 146
    "line_start": 1882
    "line_end": 1897
  "translation_ja": "演出に話を戻そう。観察に徹した芝居と、奔放な空想に基づく芝居とを比べてみれば、前者は上演効果に、後者より多くの真実らしさを求め、とくに舞台上の実物をそろえることに、いっそうの注意を要すると分かるだろう。観察に基づく幕が、奔放な空想に基づくいくつかの幕に混じっている芝居なら、同じように、演出の条件を変えなければならないと分かる。観察に基づく幕では、ごく小さな細部までたいへん正確でなければならない。それ以外の幕では反対に、おおまかで、舞台上の必要に限るべきである。目立つ例が『私の仲間』で、純粋に奔放な空想の二幕のあいだに、観察に基づく繊細な喜劇の一幕が挟まっている。前後の幕では演出が大づかみで、まったくの間に合わせにとどまるのに、真ん中の幕では、装置全体にも、舞台に置くすべての実物にも、この上ない気が配られている。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":

- "id": "becq-0375"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Décadence de l'art dramatique.--Des conventions dans l'art classique.--Grandeur de l'art idéal.--De l'évolution démocratique.--Caractère de la sensibilité du public.--Son jugement artistique.--De l'école réaliste.--De l'esprit moderne.--De l'individuel et de l'exceptionnel.--Causes d'avortement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 375
    "line_start": 5606
    "line_end": 5610
  "translation_ja": "劇作の衰退。古典芸術の取り決め。理想を描く芸術の偉大さ。民主化の進展。観客の感受性の性格。その芸術的な判断。写実派。近代の精神。個別的なものと例外的なもの。挫折の原因。"
  "translation_status": "reviewed"
- "id": "becq-0376"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J'ai parcouru les différentes phases du sujet que je m'étais proposé. Sans doute j'ai laissé beaucoup à dire et je suis loin d'avoir épuisé une matière qui est de sa nature inépuisable. Cependant j'aurai peut-être atteint le but si j'ai pu faire comprendre le sens assez marqué de l'évolution de l'art dramatique et de l'art théâtral. Tous les arts modernes, ainsi que toutes les sciences, ne cessent de croître en complexité et en hétérogénéité. La mise en scène ne peut que suivre ce mouvement, malgré les vaines réclamations d'une rhétorique, surannée, dit-on, avec laquelle je ne me sens moi-même que trop de liens. Par une habitude d'esprit, née de l'éducation et de l'instruction, nous accordons à la tradition un empire et un prestige que ne lui reconnaissent pas ceux qui ne l'ont pas reçue toute formée des leçons d'un maître, ou ne l'ont pas puisée dans l'étude des chefs-d'oeuvre des siècles passés. Il n'y a pas d'entente artistique possible entre un homme qui éprouve des émotions profondes à la lecture d'Homère ou de Sophocle et un homme qui n'a jamais connu leurs oeuvres que par ouï-dire, ce qui cependant est déjà un progrès sur l'ignorance absolue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 376
    "line_start": 5613
    "line_end": 5629
  "translation_ja": "取り上げようと思った題目を、いくつもの段階にわたって見てきた。たしかに言い残したことは多く、本来尽きることのない分野を究めたとはとても言えない。だが劇作のわざと上演のわざがどんな方向に変化しているか、そのかなり明瞭な方向をお伝えできたなら、目的を果たしたのかもしれない。あらゆる近代の芸術は、あらゆる学問と同じく、複雑さと異質性を増し続けている。演出もその流れについてゆくしかない。時代遅れだと言われ、私自身なお結びつきが強すぎると感じる古い流儀が、いくらむなしく抗議しても、そうなる。教育と学問で身についた心の習慣から、私たちは伝統に力と威光を認める。だが、出来上がったその伝統を師から教わらず、過ぎた世紀の傑作を学んで汲み取ったこともない人たちは、そうは認めない。ホメロスやソポクレスを読んで深く心を動かされる人と、その作品を人づてにしか知らない人の間に、芸術上の了解は成り立たない。伝え聞いたことがあるだけでも、何も知らないよりは進歩なのだが。"
  "translation_status": "reviewed"
- "id": "becq-0377"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous assistons donc à la décadence certaine de l'art, dans la forme du moins que nous avons été habitués à lui reconnaître et sous laquelle nous l'avons aimé, respecté et cultivé. Cet art était le privilège d'une élite peu nombreuse qui, dédaigneuse des spectacles vulgaires et ne recherchant que les sensations exquises, n'en respirait que la fleur et laissait tomber le reste en poussière. Tout drame ou toute comédie était un conflit psychologique et moral et mettait en présence des êtres qui, sous des apparences réelles, n'étaient qu'idéalement vrais. Sous les traits individuels que leur prêtaient les acteurs, les personnages de théâtre étaient des types généraux que la nature ne nous offre jamais et que l'esprit peut seul concevoir et se représenter. Aussi le point de départ essentiel de cet art transcendant était la convention. Ce qui, dans tout drame et dans toute comédie, était idéalement vrai, c'étaient les vertus, les vices, les caractères ou les passions. C'était là que portait tout l'effort de la création artistique, de l'observation philosophique et de l'imagination poétique; et ces êtres, en quelque sorte abstraits, prenaient alors une intensité de vie morale d'une puissance extraordinaire et véritablement surhumaine. Comparés aux personnages de théâtre, les êtres réels n'en paraissaient que des extraits incomplets et inachevés, à peine ébauchés. Jamais, en effet, l'humanité n'aurait pu les réaliser en entier. Seule la poésie pouvait créer de toutes pièces ces êtres dont la nature avait éparpillé tous les traits sur des milliers d'exemplaires humains. Mais quelle était alors la grandeur tragique ou la profondeur comique du spectacle qu'offraient aux esprits, longuement préparés à le comprendre et à le goûter, la rencontre et le conflit de ces personnages plus vrais que la réalité elle-même! L'intérêt de ce jeu poétique était si puissant, que le reste était de peu d'importance: ce n'était qu'une affaire de convention définitivement et préalablement réglée entre le poète et le spectateur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 377
    "line_start": 5631
    "line_end": 5659
  "translation_ja": "したがって私たちは、芸術がまちがいなく衰えてゆくのを見ている。少なくとも、芸術といえばこれだと思い慣れ、愛し、敬い、培ってきたその形においては。この芸術は少数の限られた人々の特権であった。彼らは俗な見世物を見下し、えりすぐった感動しか求めず、その花の香だけを吸って、残りがちりとなって落ちるにまかせた。どの劇や喜劇も心と道徳の葛藤であって、見かけは現実めいていても理想の上でしか真実ではない人物を向き合わせた。俳優が貸し与える個別の特徴の下で、登場人物は、自然の中には決して現れず、精神だけが考え、思い描ける普遍的な類型だった。だからこの高い芸術の肝心な出発点は、取り決めだった。劇や喜劇の中で理想の上で真実だったものは、美徳、悪徳、性格、情念である。芸術の創造、哲学的な観察、詩の想像力はすべてそこに力を注ぐ。そのため、いわば抽象的なこれらの人物は、並外れた、まことに人間離れした力をもつ道徳的な生命を帯びた。舞台の人物と比べると、実在する人間は、その一部を不完全に抜き取って未完成のままにし、ようやく下描きにしたものにすぎないように思われた。現に、人類は彼らを完全に実現することなどできなかった。自然が何千人もの人間に散らした特徴を持つ人々を、初めから作り出せるのは詩だけだった。しかし、それを理解し味わえるよう長く準備された精神にとって、現実そのものより真実な人物たちが出会い、衝突するさまの、悲劇としての偉大さ、喜劇としての深さは、なんというものだったろう。この詩的な遊びには巨大な力があり、ほかは大したことではなかった。作者と観客があらかじめ、きっぱりと決めていた取り決めにすぎなかった。"
  "translation_status": "reviewed"
- "id": "becq-0378"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qu'importe d'où viennent et où vont Scapin, Lisette, Géronte, Éraste et Isabelle, réunis par le caprice du poète dans un même enchevêtrement d'événements, pourvu que nous riions des fourberies de l'un, de la malice de l'autre, de la sottise de celui-ci, et que nous assistions au triomphe final des amants! Qu'importe qu'ils se rencontrent ici ou là, dans un décor représentant un appartement ou une place publique! C'est par pure bonté d'âme que le poète daigne parfois nous apprendre que la scène se passe à Naples ou à Paris: nous n'avons que faire de le savoir, puisque ce sont les mêmes personnages, qu'il transporte à son gré aux quatre coins du monde. Qui songe à reprocher à ces personnages de s'asseoir et de discourir au beau milieu d'une place publique? Qu'importe, pourvu que ces personnages nous éblouissent des étincelles de leur esprit, que la vérité psychologique et que l'observation morale naissent du choc de leurs caractères et du conflit où les engagent leurs passions! Ce spectacle a le pouvoir magique d'offrir à nos méditations l'être humain, dégagé de toutes les réalités qui l'encombrent et le masquent. Mais, pour s'y plaire, il faut que l'esprit soit dès longtemps formé à l'abstraction et à la synthèse, et qu'il accorde au fait moral une supériorité constante sur le fait matériel. En un mot, il lui faut la foi, une foi en quelque sorte innée, pour croire à la vérité dégagée du réel, pour être convaincu que la peinture de l'idéal est l'unique raison d'être de l'art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 378
    "line_start": 5661
    "line_end": 5682
  "translation_ja": "作者の気まぐれで同じもつれあいに放り込まれたスカパン、リゼット、ジェロント、エラスト、イザベルが、どこから来てどこへ行こうが、それがなんだろう。ある者の狡猾さ、ある者のいたずら心、ある者の愚かさに笑い、最後に恋人たちの勝利を見届けられるなら、それでよい。彼らがここで会おうがあそこで会おうが、部屋を表す装置の中でも広場でも、どうでもよい。場面がナポリかパリかを、作者がときに教えてくれるのは、まったくの親切心からである。登場人物は同じであって、作者の思いのまま世界の四隅に運ばれていくのだから、私たちは知る必要もない。広場の真ん中に座って長話するからといって、誰がとがめよう。彼らの機知が火花となって目をくらませ、性格どうしの衝突と情念が引き起こす争いから、心理の真実と道徳の観察が生まれるなら、それでよいのだ。この見世物には、人間をふさいで隠す現実の一切から解き放ち、私たちが考える対象として差し出す魔法の力がある。ただしこれを楽しむためには、精神が以前から抽象と総合に慣れ、精神上の事実を物質上の事実よりつねに高く置くのでなければならない。一言で言えば、現実から解き放たれた真実を信じ、理想を描くことが芸術のただ一つの存在理由だと確信する、いわば生まれながらの信が必要なのである。"
  "translation_status": "reviewed"
- "id": "becq-0379"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les foules qui montent des ténèbres à la lumière et qui des bas-fonds de l'humanité s'élèvent à toutes les jouissances d'une vie sociale supérieure ne sont pas prédisposées par l'éducation, par l'instruction, par l'influence héréditaire que les générations exercent les unes sur les autres, à jouir d'un art qui s'est dégagé de la réalité, c'est-à-dire de ce qui leur semble être toute la vérité. Elles ne savent pas voir par les yeux seuls de l'esprit et sont dominées par les sensations directement perçues par les organes de l'ouïe, de la vue et du toucher. Toujours en contact avec la réalité, elles n'apprécient les objets qu'un à un, les estiment pour leur qualité visible ou tangible, et, ne s'élevant pas aux classifications générales, ne s'intéressent aux êtres et aux objets que par leurs traits individuels et particuliers. Comme cependant elles ont une sensibilité très vive, d'autant plus vive qu'elle n'a pas été émoussée ou affinée par de fréquentes émotions esthétiques, elles prennent souvent plaisir aux spectacles tragiques ou comiques de l'art classique, mais dans des conditions intellectuelles et morales toutes particulières. Elles ne séparent pas l'action tragique ou comique de la possibilité réelle, ramènent les héros de la tragédie et les personnages de la comédie dans le cercle étroit de leur vue immédiate, et leur esprit en change singulièrement les proportions, en appliquant à ces créations idéales une sorte de compas de réduction. Elles s'intéressent non au développement poétique et moral des personnages, mais à l'acte qu'ils accomplissent; non à la vérité générale qu'ils représentent, mais aux traits particuliers sous lesquels la vérité se manifeste et au fait qui en est l'occasion. Leur émotion au théâtre n'est jamais ou n'est que très rarement esthétique: c'est pourquoi elles ne pleurent pas exactement aux mêmes endroits ni pour les mêmes causes, et quelquefois, dans la comédie, rient franchement d'un trait qui nous serre le coeur. En un mot, elles sont frappées de l'action tragique et en sont impressionnées comme elles le seraient d'un drame de cour d'assises."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 379
    "line_start": 5684
    "line_end": 5714
  "translation_ja": "暗闇から光へ出て、社会の底から、より恵まれた社会生活のあらゆる楽しみへ上ってくる群衆は、現実を脱した芸術、すなわち彼らにとって真実のすべてと思えるものから離れた芸術を楽しむようには、教育や学問、世代から世代へ伝わる影響を通じて用意されてはいない。精神の目だけで見ることができず、聴覚、視覚、触覚がじかに受け取る感覚に支配される。いつも現実に触れているので、ものを一つずつしか評価せず、見えたり触れたりできる性質で値踏みする。一般的な種類の区別にまで上らないので、人や物に関心を持つのも、個々の、独自の特徴によってである。だがその感受性はたいへん鋭い。芸術の感動をたびたび経験して鈍らせたり磨いたりしていないだけに、いっそう鋭い。そのため古典の悲劇や喜劇をしばしば楽しむものの、そこでの知性と道徳の条件は独特である。悲劇や喜劇の行為を現実に起こりうることから区別せず、悲劇の主人公や喜劇の人物を、目の届く狭い範囲に連れ戻す。こうした理想上の創造物に一種の縮尺定規を当てるので、その釣り合いは大きく変わる。関心を持つのは人物が詩や道徳の上でどう展開するかではなく、何をするかである。人物の表す普遍的な真実ではなく、真実がどんな個別の特徴を通じて現れ、何がそのきっかけとなるかである。彼らが劇場で心を動かされても、それが美的であることはないか、あってもごくまれだ。私たちとは違うところ、違う理由で泣き、ときには私たちの胸を締めつけるところで、喜劇を見てあっけらかんと笑う。一言で言うと、悲劇の事件に打たれ、重罪裁判所の事件を聞いたときと同じような印象を受ける。"
  "translation_status": "reviewed"
- "id": "becq-0380"
  "section_id": "ch38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une telle manière de comprendre et de juger les oeuvres dramatiques et d'en apprécier la moralité n'est sans doute pas très élevée; cependant elle n'est ni fausse ni injuste: on peut même affirmer qu'elle est exacte et rigoureuse. Mais la vérité, ainsi vue sous un angle étroit, n'est plus la vérité idéale: c'est en quelque sorte une vérité tangible et mesurable, née de l'observation directe des faits, de l'examen des objets et de la confrontation des êtres particuliers qu'a réunis un même acte criminel ou une même situation comique. Ce nouveau public, vierge d'émotions esthétiques, auquel s'adressent aujourd'hui les poètes dramatiques, n'est pas formé à juger une passion ou un caractère en soi, indépendamment du circonstanciel des faits; mais il rapporte cette passion et ce caractère à son expérience personnelle et actuelle, et pour apprécier ce que l'une a d'horrible et l'autre de ridicule n'a d'autre étalon que la réalité. Ce n'est donc qu'en multipliant les traits particuliers, d'observation courante et journalière, qu'on lui procure la sensation de la vérité et de la vie. Il est bien heureux que Don Juan, Tartufe et le Misanthrope soient écrits, car un nouveau Molière ne saurait concevoir aujourd'hui sous la même forme ces comédies idéalement humaines et vraies, mais dont les personnages sont des types généraux tout à fait en dehors de notre expérience personnelle et de nos observations quotidiennes. Le public actuel s'intéresse donc moins à l'homme en général qu'aux hommes en particulier, et ne conçoit pas plus ceux-ci soustraits à toutes les conditions de climat, de race, de tempérament et de milieu social, qu'il ne les conçoit dégagés des influences extérieures, des circonstances et des faits."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 380
    "line_start": 5716
    "line_end": 5740
  "translation_ja": "こうして劇の作品を理解し、判断し、その道徳性を量るやり方は、たしかに高尚とは言えない。だが間違っても不公正でもない。それどころか、正確で厳密だとさえ言える。しかし狭い角度から見た真実は、もう理想の真実ではない。事実をじかに観察し、物を調べ、一つの犯罪や同じ喜劇的な状況に巻き込まれた個々人を突き合わせることで生まれる、いわば触れられ、測れる真実である。今日、劇作家が相手にする、美の感動をまだ知らない新しい観客は、情念や性格を、具体的な出来事の事情から離して判断できるようには育っていない。情念も性格も自分の現在の経験に引き合わせ、どれほど恐ろしく、どれほど滑稽かを見る手がかりは現実だけだ。だから日々よく見かける個別の特徴をたくさん揃えてやって初めて、真実や生命を感じさせられる。『ドン・ジュアン』、『タルチュフ』、『人間嫌い』がすでに書かれているのは幸運である。新しいモリエールが現れたとしても、理想の上で人間的で真実でありながら、私たちの個人的な経験と日々の観察からはすっかり離れた一般的類型を人物とする喜劇を、今日同じ形では思いつけない。今日の観客は、人間一般より個々の人間に興味がある。外からの影響や個々の事情や事件から解放された人間を考えられないように、風土、人種、気質、社会環境という条件をことごとく離れた人間も考えられない。"
  "translation_status": "reviewed"

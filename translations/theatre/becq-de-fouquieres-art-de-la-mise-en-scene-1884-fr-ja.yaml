- "id": "becq-0362"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Victor Hugo a eu dès longtemps l'intuition du rôle nouveau qu'est appelée à jouer la musique au théâtre et l'a souvent introduite dans ses oeuvres dramatiques. Qui ne se souvient de l'effet saisissant du De profundis qui glace d'effroi Gennaro et ses compagnons, à la fin du festin où Lucrèce Borgia vient de leur faire verser du poison? Au premier et au second acte de Marie Tudor, la même romance chantée par Fabiani, qui s'accompagne sur une guitare, est employée comme une poétique formule d'amour. La musique est ici la caractéristique de la passion qui a jeté Fabiani aux pieds de la reine. Mais dans cet exemple la romance de Fabiani, quoiqu'elle résulte physiologiquement de l'état d'un coeur qui éprouve le besoin, d'épancher son bonheur, ne joue que le rôle d'un aparté musical et n'est en quelque sorte qu'une confidence faite directement au public. Dans Lucrèce Borgia, au contraire, le De profundis ne nous émeut si profondément que parce qu'il terrifie les personnages du drame. Voilà le véritable emploi de la musique au théâtre. Nous éprouvons sympathiquement l'effroi de Gennaro, mais c'est sur lui que tombe directement la sensation musicale: c'est dans son âme que se joue le drame affreux dont nous attendons, haletants, la péripétie suprême; et c'est, les yeux fixés sur lui et participant à toutes les poignantes émotions qui le traversent, que nous suivons d'une oreille attentive les versets du chant lugubre qui se rapproche."

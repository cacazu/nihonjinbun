- "id": "becq-0079"
  "section_id": "ch09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mise en scène ne doit par pécher par défaut.--De la contention d'esprit du spectateur.--La mise en scène ne doit pas proposer à l'esprit de coordinations contradictoires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 79
    "line_start": 943
    "line_end": 945
  "translation_ja": "演出は不足でも過ちを犯す。観客の精神の集中。演出は、矛盾する印象を精神に結びつけさせてはならない。"
  "translation_status": "reviewed"
- "id": "becq-0080"
  "section_id": "ch09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous avons insisté sur l'accord qui devait régner entre l'effet représentatif d'une oeuvre dramatique et sa valeur intrinsèque, et nous avons surtout montré que tout ce qui s'ajoutait inutilement à cet effet représentatif était nuisible à l'oeuvre elle-même, en distrayant l'esprit de ce qui devait être sa principale et quelquefois son unique préoccupation. Mais il est évident que, pour réaliser cet accord, s'il convient de ne rien ajouter à la juste mise en scène, il ne faut pas non plus en rien retrancher. De même que la mise en scène peut pécher par excès, elle peut aussi pécher par défaut. L'esprit est toujours frappé fortement par un contraste. Le décor, les costumes, les jeux de scène, la figuration, doivent donc convenir au texte poétique; c'est ce que jadis on aurait exprimé en disant que la mise en scène doit être décente. Elle ne le serait pas si, par exemple, on jouait le Misanthrope dans le même décor que les Femmes savantes; elle ne l'est pas quand l'aspect de la figuration répugne à l'idée avantageuse qu'en fait naître le texte de la pièce."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 80
    "line_start": 948
    "line_end": 963
  "translation_ja": "戯曲の上演効果と内在的な価値を一致させなければならない、ということを私たちは繰り返し述べた。とりわけ、上演効果に何かをむやみに付け足せば、精神の主な関心、ときには唯一の関心となるべきものから注意をそらし、作品そのものを損なうことを示した。ただし、両者を一致させるために、適切な演出に何も足さないのがよいとしても、そこから何かを引いてもならないのは明らかである。演出は多すぎても少なすぎても過ちを犯す。精神は対照をつねに強く感じる。そのため、舞台装置、衣裳、舞台上の動き、端役のあり方は、詩の言葉に合っていなければならない。かつてなら、演出は「ふさわしくなければならない」と言ったところだろう。たとえば『人間嫌い』を『女学者たち』と同じ舞台装置で上演すれば、ふさわしいとはいえない。端役たちの見た目が、戯曲の言葉から浮かぶ好ましいイメージと合わないときも、同じである。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 892
      "end": 906
      "exact": "le Misanthrope"
  - "side": "source"

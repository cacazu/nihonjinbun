    "precision": "line"
    "source_sequence": 134
    "line_start": 1666
    "line_end": 1668
  "translation_ja": "感情が優位に立つ芝居。感動の原因が主観的な場合。『ヴィクトリーヌの結婚』。感動の原因が客観的な場合。『友人フリッツ』。"

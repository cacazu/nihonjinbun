    "kind": "emphasis"
    "span":
      "start": 64
      "end": 75
      "exact": "Misanthrope"
- "id": "becq-0113"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette observation pourra paraître subtile. Pour comprendre toute son importance, il nous suffira de nous reporter à la mise en scène des Femmes savantes. A la seconde scène de l'acte III, lorsque le valet approche les sièges sur lesquels prennent place Henriette, Philaminte, Trissotin, Bélise et Armande, il dispose, sur le premier plan, six sièges, dont cinq seulement sont occupés par les personnages en scène, tandis que le sixième reste vide. Voilà bien ce siège d'attente dont nous parlions; or, ici, il annonce une scène subséquente dont le public est ainsi averti, qu'il attend, et qui se produira en effet. Pendant tout le temps que dure la scène où Trissotin lit ses vers, ce siège vide est un témoin muet; sa présence est déjà une protestation contre les méchants vers de Trissotin, et le public se dit qu'il annonce nécessairement un autre personnage qui vengera le bon sens outragé. Et ce vengeur, en effet, c'est un autre pédant, Vadius, qui, tout pédant qu'il est lui-même, fera entendre à Trissotin de dures, mais justes vérités. On voit par cet exemple comment la mise en scène conspire à l'évolution de l'action dramatique, en fondant ses dispositions quelquefois les plus simples sur la logique rigoureuse qui régit l'esprit du spectateur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 113
    "line_start": 1385
    "line_end": 1403
  "translation_ja": "この指摘は細かすぎるように思われるかもしれない。その重要さを十分に分かるには、『女学者たち』の演出を振り返ればよい。第三幕第二場で召使いが、アンリエット、フィラマント、トリソタン、ベリーズ、アルマンドの腰かける椅子を持ってくると、舞台前方に椅子を六つ並べる。五つだけを舞台上の登場人物が占め、第六の椅子は空いたままである。これがまさに、先ほど述べた誰かを待つ席だ。この場合には、それはこのあと来る場面の予告になる。観客は知らされてその場面を待ち、実際にその場面が来る。トリソタンが自作の詩を読む場面のあいだ、その空席は物言わぬ目撃者である。そこにあるだけで、トリソタンのひどい詩に対する抗議になっている。観客は、侮辱された常識の仇を取る、別の人物が現れるに違いないと思う。実際、その仇を取るのはヴァディウスという別の衒学者である。彼もまた衒学者でありながら、厳しいがもっともな真実を、トリソタンに聞かせるのだ。この例から、いかに演出が劇の展開を助けるかが分かる。ときにはごく単純な配置でさえ、観客の精神を律する厳密な論理に基づいているのである。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 137
      "end": 152
      "exact": "Femmes savantes"
- "id": "becq-0114"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il n'est pas jusqu'aux objets non visibles qu'il soit permis de produire sans préparation et sans précaution. Tous les jours, nous croisons dans la rue des personnes qui portent un revolver sur elles et auxquelles il pourrait arriver d'être en situation de le tirer de leur poche. Sur la scène, un personnage ne peut impunément tirer à l'improviste un revolver de sa poche; il faut, ou que le public soit averti de la présence d'une arme dans la poche de tel personnage, ou que tout au moins il soit prédisposé à voir cette arme apparaître. Il ne serait pas non plus permis à un personnage de parler d'un pistolet qu'il porte sur lui, l'occasion même serait-elle naturelle, si cette arme ne devait point jouer un rôle subséquent. Mais ces deux derniers exemples ont trait aux fautes de mise en scène qui peuvent être commises, non par la direction du théâtre, mais par l'auteur lui-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 114
    "line_start": 1405
    "line_end": 1417
  "translation_ja": "それまで見えていなかった物でさえ、伏線も用心もなしに出すことは許されない。日々、私たちは、拳銃を携帯し、場合によってはポケットから取り出すこともありうる人と、街ですれ違う。だが舞台では、登場人物が何の前触れもなくポケットから拳銃を取り出せば、そのままでは済まない。ある人物のポケットに武器があることを観客に知らせておくか、少なくとも、その武器が現れる心の準備をさせておかなければならない。自然なきっかけがあったとしても、あとで役割を果たさない拳銃について、登場人物が自分で携帯していると話すことも許されない。ただし最後の二例は、劇場の責任者ではなく、作者自身の犯しうる演出上の誤りに属する。"
  "translation_status": "reviewed"
- "id": "becq-0115"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le hasard, en résumé, ne peut jamais être un ressort dramatique, et la raison en est simple: le mot hasard et le mot art s'excluent mutuellement, le premier impliquant une rencontre fortuite, le second un arrangement préalable. Si donc, par impossible, le hasard montait sur la scène, l'art en descendrait. Il n'y a pas là une question d'appréciation que des écoles opposées puissent résoudre différemment. La signification exacte du mot art entraîne nécessairement l'idée que nous devons nous faire d'une oeuvre artistique, dont toutes les parties doivent être articulées, et dont le moindre objet doit être un article nécessaire. Si des personnes pensaient différemment, il faudrait, au préalable, qu'elles cherchassent d'autres mots qui correspondissent à leurs manières de voir. Au théâtre, toute péripétie doit avoir été antérieurement à l'état de possibilité, et dans les dénouements, par exemple, le grand art consiste à surprendre le spectateur par un trait ou un acte final, qu'il a la satisfaction de déduire immédiatement ou du caractère du personnage tel qu'il a été exposé, ou d'une situation antérieure, opération mentale rapide comme l'éclair et qui est l'épanouissement du plaisir esthétique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 115
    "line_start": 1419
    "line_end": 1436
  "translation_ja": "要するに、偶然は決して劇を動かす仕掛けにはならない。理由は単純である。「偶然」という言葉と「芸術」という言葉は、互いを排除する。前者にはたまたま出会うという意味があり、後者にはあらかじめ組み立てるという意味があるからだ。ありえないことだが、もし偶然が舞台に上がれば、芸術は舞台から降りてしまう。これは対立する流派によって異なる答えの出る、評価の問題ではない。「芸術」という言葉の厳密な意味に従えば、芸術作品のどの部分も組み合わされ、もっとも小さな物でさえ、欠かせない一部分をなすという考えが、必然的に導かれる。そう考えない人がいるなら、まずは自分の見方に合うほかの言葉を探さなければならない。劇場では、劇のあらゆる展開が、その前から起こりうるものでなければならない。たとえば結末では、最後の一手、一つの振る舞いによって観客を驚かせながら、それまでに示された人物の性格、あるいはそれ以前の状況から、観客がすぐにその一手を導き出す満足を覚えるようにするのが、すぐれた技である。この、稲妻のようにすばやい精神の働きにおいて、美の喜びは花開く。"
  "translation_status": "reviewed"

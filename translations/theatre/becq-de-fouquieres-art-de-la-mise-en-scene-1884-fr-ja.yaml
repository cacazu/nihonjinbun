  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De l'acteur.--De la formation subjective des images.--Rapport de la création de l'acteur avec l'idéal du public.--Toute évolution idéale implique une modification dans l'image représentée.--C'est la généralité d'un phénomène qui justifie sa représentation.--Smilis.--L'acteur doit éviter l'accidentel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 308
    "line_start": 4419
    "line_end": 4423
  "translation_ja": "俳優について。心の内にイメージができること。俳優の創造と観客の観念の関係。観念が変われば、舞台に表すイメージも変わる。広く共通する現象だからこそ表象に値する。『スミリス』。俳優は偶然の細部を避ける。"
  "translation_status": "reviewed"

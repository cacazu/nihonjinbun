  "translation_status": "reviewed"
- "id": "becq-0117"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la sensualité et de l'individualité dans le goût actuel.--Dérogations aux principes.--Rapports de la mise en scène avec le milieu théâtral.--Caractère d'un théâtre, de son répertoire et du public qui le fréquente."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 117
    "line_start": 1442
    "line_end": 1445
  "translation_ja": "今日の好みにおける感覚性と個性。原則の例外。演出と劇場の環境との関係。劇場とその演目、そこに通う観客の性質。"
  "translation_status": "reviewed"
- "id": "becq-0118"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les principes que nous venons d'exposer dominent l'art de la mise en scène et ne sont pas impunément violés en ce qu'ils ont d'essentiel. Cependant, on ne peut nier que notre époque n'ait une tendance à en atténuer la rigueur. Nous inclinons, à ce qu'il semble, à goûter les arts par leurs côtés sensualistes, et nous apportons au théâtre cette tendance qui nous prédispose à tenir un grand compte du plaisir de nos yeux dans le charme qu'exercent sur nous les ouvrages dramatiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 118
    "line_start": 1448
    "line_end": 1454
  "translation_ja": "ここまで述べてきた原則は演出の技を律している。その根幹を破って、何の悪い結果もないわけにはいかない。ただし、私たちの時代に、原則の厳しさを和らげようとする傾向があることも否定できない。どうやら私たちは、芸術を感覚に訴える面から味わいがちで、その傾向を劇場へも持ち込む。このため、戯曲が私たちに及ぼす魅力のうちでも、目にとっての喜びに大きな重みを置きやすい。"
  "translation_status": "reviewed"
- "id": "becq-0119"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En outre, dans la vie moderne, l'individualité des goûts suppose un rapport plus étroit entre le sujet et les objets qui l'entourent, et crée en quelque sorte pour chaque homme un milieu individuel dont nous ne pouvons l'abstraire absolument. En peinture, on se préoccupe à juste titre de la coloration et de l'intensité des reflets; il en sera de même au théâtre, et puisque notre tournure d'esprit elle-même se reflète sur les objets dont nous meublons notre vie, l'auteur et le metteur en scène devront s'attacher à satisfaire la prédisposition qu'ont les spectateurs modernes à chercher dans les objets le reflet des qualités morales ou intellectuelles du sujet."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 119
    "line_start": 1456
    "line_end": 1465
  "translation_ja": "さらに今日の生活では、好みに個性があるということは、その人と身の回りの物とが、以前より密な関係にあることを意味する。いわば一人ひとりに個別の環境ができ、その人だけをそこからまるきり切り離すことはできない。絵画では、周りの物が映す反射光の色合いと強さに気を配るのは正しい。劇場でも同じことになる。生活のまわりに置く物には、私たちの考え方そのものが映るのだから、作者と演出家も、人物の精神や知性の特色が物に映っているところを探そうとする現代の観客の性向に、応えなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0120"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les théâtres sont donc amenés presque fatalement, pour ces diverses raisons, à apporter à la mise en scène des soins de plus en plus minutieux, et à descendre du général au particulier dans la représentation de la réalité. En outre, ils ont dû obéir à la nécessité d'augmenter l'effet représentatif des pièces qu'ils remontent ou qu'ils exposent pour la première fois devant les yeux du public. Il est donc intéressant d'examiner dans quelle mesure les principes peuvent s'infléchir et s'accommoder à notre goût actuel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 120
    "line_start": 1467
    "line_end": 1474
  "translation_ja": "以上のさまざまな理由から、劇場はほとんど必然的に、演出にますます細やかな気を配り、現実を表すときに、一般的なものから個別のものへと下っていくようになる。さらに劇場は、再演する芝居にも、観客の目に初めてさらす芝居にも、上演効果を増さなければならなかった。だから、原則がどの程度までしなやかになり、今日の好みに合わせられるのかを調べるのは興味深い。"
  "translation_status": "reviewed"
- "id": "becq-0121"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Après avoir étudié les principes de la mise en scène en ce qu'ils ont d'absolu, il nous faut donc les étudier dans ce qu'ils ont de relatif. Nous allons passer en revue le plus rapidement possible les modifications dont est susceptible la mise en scène, selon qu'on l'étudié dans ses rapports soit avec le milieu théâtral, soit avec le milieu dramatique, soit avec le milieu social."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 121
    "line_start": 1476
    "line_end": 1481
  "translation_ja": "演出の原則の絶対的な面を調べたのだから、次はその相対的な面を調べなければならない。劇場の環境、劇中の環境、あるいは社会環境と、それぞれ演出との関わりを調べるにつれ、演出をどう変えられるか、できるかぎり手早く見ていこう。"
  "translation_status": "reviewed"
- "id": "becq-0122"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Occupons-nous d'abord du milieu théâtral. Il est certain que nous n'allons pas à la Comédie-Française, à l'Ambigu ou au Châtelet dans les mêmes dispositions d'esprit, et que selon le milieu théâtral nous inclinons à rechercher tantôt un plaisir où l'esprit aura la plus grande part, tantôt un plaisir plus ou moins fortement imprégné de sensualisme. Dans le premier cas, nous serons moins exposés à subir l'influence de nos yeux, et l'attention de notre esprit sera une force subjective très résistante à toutes les causes objectives de distraction, tandis que dans le second notre esprit, mobile et flottant, ouvert aux impressions du dehors, sera disposé à se laisser séduire par le charme des images optiques. En outre, le choix même du théâtre a été ordinairement déterminé par le caractère particulier de son répertoire habituel. Nous savons qu'en général ici la crise dramatique éclatera par suite du conflit probable de passions plus ou moins fortes ou par suite du choc inévitable de caractères dissemblables; tandis que là l'intérêt pourra naître du concours des événements et de l'influence qu'exercera sur eux, comme dans la vie réelle, la contingence inévitable des choses. Dans le premier cas, le monde intérieur de l'âme nous enveloppe en quelque sorte tout entier et nous protège contre toute influence étrangère; dans le second, le monde extérieur nous sollicite avec l'extrême diversité des sensations qui nous attendent de tous les côtés. Donc, ici, à la Comédie-Française, par exemple, un peu d'excès dans la mise en scène ne modifiera pas sensiblement le caractère général qu'elle doit conserver, et nous ne serons pas tentés de scruter les rapports spéciaux que le matériel figuratif, un peu trop amplifié, pourrait avoir avec la marche du drame, tandis que là, au Châtelet par exemple, chacun des détails du matériel figuratif nous attirera par le rapport probable que nous le soupçonnerons d'avoir avec la suite du drame. Ainsi, à la Comédie-Française, tel meuble, inutile à l'action, ne sera à priori qu'un témoignage de confortable ou de somptuosité, tandis qu'au Châtelet, nous serons tentés, à priori, de regarder ce même meuble comme indispensable à l'action ou même comme une boîte à surprise possible."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 122
    "line_start": 1483
    "line_end": 1515
  "translation_ja": "まずは劇場の環境である。コメディ・フランセーズ、アンビギュ、シャトレへ、同じ心構えで行くわけでないのは確かだ。劇場の環境によって、あるときには精神が大半を占める喜びを求め、あるときには多かれ少なかれ感覚的なものに染まった喜びを求めがちである。前の場合、私たちは目に入るものにあまり影響されず、精神を集中させるという内からの力は、外から注意をそらすものすべてに強く抵抗する。後の場合には、精神の注意は動きやすく漂い、外からの印象に開かれ、視覚による像の魅力にとらわれやすい。そのうえ、そもそも劇場を選んだのは、たいてい、そこでふだん掛ける演目の固有の性質にひかれたためだ。こちらの劇場では一般に、多かれ少なかれ強い情念がぶつかるべくしてぶつかったり、似ても似つかない性格の人物が避けがたく衝突したりした末に、劇的な危機が生じると知っている。あちらでは、出来事が巡り合い、現実と同じく避けがたい物事の偶然がそれらに影響するところから、興味が湧くことがある。前の場合、心の内の世界が私たちをすっかり包み、無関係な影響を防いでくれる。後の場合は、あらゆる方角に待ち受ける感覚の雑多さをもって、外の世界が私たちを誘う。だから、たとえばコメディ・フランセーズで、演出にほんの少し過剰があっても、その演出が保つべき全体の性質は、目立って変わらない。少しばかり増やしすぎた舞台上の実物が、劇の進行に特別な関係をもつかを探ろうとは思わない。一方、たとえばシャトレでは、舞台上の実物の細部が一つずつ、先の展開と何かの関係がありそうだと疑わせ、私たちの目を引く。こうして、コメディ・フランセーズなら、ある家具が筋に関係なくても、まずは居心地のよさや、ぜいたくさのしるしとしか思われない。シャトレなら、同じ家具を、まずは筋に欠かせないもの、さらには何か驚きを秘めたびっくり箱だと考えたくなるだろう。"
  "translation_status": "reviewed"

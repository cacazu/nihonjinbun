- "id": "becq-0276"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le rôle du choeur, en effet, est tantôt actif, tantôt passif. Il est actif quand la présence du choeur est un élément de l'action dramatique, quand il agit sur les personnages du drame et qu'il impose une direction aux sentiments moraux et aux passions qui les agitent. Dans ce cas, il faut obtenir de la figuration une grande sobriété de mouvements, de gestes et d'attitudes; car pour le public l'intérêt n'est pas dans le choeur lui-même, mais dans le personnage et dans son évolution morale à laquelle nous assistons et à laquelle nous participons. On peut citer comme exemple le rôle de la figuration au cinquième acte d'Athalie. Au moment où Joad s'écrie:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 276
    "line_start": 3894
    "line_end": 3903
  "translation_ja": "合唱隊の役割には、能動的なものと受動的なものがある。合唱隊がいること自体が劇の展開を左右し、登場人物に働きかけ、人物たちを動かしている感情や情念に方向を与えるなら、それは能動的な役割である。こういう場合は、群衆役の動きも、身ぶりも、姿勢も、ごく抑えて演じてもらわなければならない。観客の関心は合唱隊そのものではなく、登場人物と、その心が変わってゆくさまにあるからだ。私たちはそれを見届け、心の動きをともにする。この例として『アタリー』第5幕の群衆役を挙げられる。ジョアドがこう叫ぶときである。"
  "translation_status": "reviewed"

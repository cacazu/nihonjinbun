- "id": "becq-0258"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au second acte, Clytemnestre et Iphigénie doivent porter des costumes simples; mais, si Clytemnestre, qui ne quitte pas la tente d'Agamemnon, conserve jusqu'à la fin le même vêtement, il ne doit pas en être de même d'Iphigénie, qui au troisième acte doit paraître le front couronné de fleurs et enveloppée jusqu'aux pieds d'un voile d'une éblouissante blancheur, dont au cinquième acte, en s'abandonnant aux mains des soldats, elle se couvrira le visage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 258
    "line_start": 3624
    "line_end": 3630
  "translation_ja": "第二幕ではクリテムネストルとイフィジェニーは簡素な服を着る。だがアガメムノンの天幕を出ないクリテムネストルは、最後まで同じ服でよいとしても、イフィジェニーは違う。第三幕では頭に花の冠を載せ、目もくらむほど白いヴェールに足先まで包まれて現れ、第五幕で兵士たちに身を任せるとき、そのヴェールで顔を覆うべきだ。"
  "translation_status": "reviewed"
- "id": "becq-0259"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Plus importantes encore sont les modifications qu'exigerait le costume d'Agamemnon. On peut, au premier acte, admettre et conserver celui qu'il porte actuellement. C'est la nuit, tout dort dans le camp des Grecs. Seul, Agamemnon veille dans sa tente, en proie à l'insomnie; il a débouclé sa cuirasse et déposé son casque et ses armes. Loin des yeux des soldats, il est redevenu père, et s'abandonne aux mouvements généreux de son âme. Mais, au second acte, le jour s'est levé; Agamemnon va paraître aux regards de l'armée, et il ne le fera que sous l'appareil imposant qui convient à celui que les Grecs ont nommé le roi des rois. Autour de ses jambes sont attachées de riches cnémides que maintiennent des agrafes d'argent. Sa poitrine est couverte d'une cuirasse, formée de bandes de métal, alternativement d'or et d'acier bruni. Trois dragons d'azur rayonnent jusqu'au col. Son glaive, brillant de clous d'or, est renfermé dans un fourreau d'argent, que soutient un baudrier tissu d'or. Sur son front se pose un casque étincelant: d'abondantes crinières s'échappent des quatre cimiers, et l'aigrette qui le surmonte s'agite en ondulations terribles. Sur ses épaules flotte la pourpre des rois. Voilà le costume homérique sous lequel doit apparaître aux spectateurs le chef suprême des Grecs. Ce costume, splendide et majestueux, amortirait heureusement le trop juvénile éclat de celui d'Achille. Dans la superbe scène du quatrième acte, où les deux héros se mesurent, on aurait devant les yeux une scène digne de l'Iliade. Sous les dehors trompeurs d'une querelle de famille, on verrait apparaître une rivalité guerrière, prélude des longues dissensions des Grecs sous les murs de Troie. Cet appareil formidable hausserait le génie tragique de l'acteur; et le spectateur aurait alors la sensation nécessaire de l'ambition démesurée et de l'indomptable orgueil d'Agamemnon."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est cette même concordance entre la personnalité scénique d'un acteur et les rôles du répertoire qu'il est si important de découvrir quand il s'agit d'un début. On se trompe souvent, soit que l'acteur ne donne pas tout ce qu'il promettait, soit que la scène modifie complètement son image théâtrale. Quand il s'agit de discerner le meilleur emploi qu'il sera possible de faire de qualités moyennes et tempérées, il vaut mieux choisir de modestes rôles de début, afin de laisser le tempérament de l'artiste se révéler et s'affirmer peu à peu. Quand on croit avoir affaire à un tempérament personnel d'une certaine valeur, il est préférable de mettre l'artiste aux prises avec un grand rôle, dût ce premier essai ne pas être couronné de succès, car le contraste même, entre le rôle qu'il remplit et sa personnalité scénique, mettra celle-ci en pleine lumière et lui permettra de s'affirmer au grand jour de la rampe. Dans ce cas, même après un début malheureux, un directeur avisé aura la certitude d'avoir mis la main sur un artiste hors ligne et il aura du même coup déterminé vers quels rôles l'incline son tempérament."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 331
    "line_start": 4841
    "line_end": 4856
  "translation_ja": "初舞台で見抜くことが何より大事なのも、俳優の舞台上の個性と、持ち芝居の役とのこの一致である。俳優が期待されたほどの力を出さなかったり、舞台に立つと見え方がすっかり変わったりして、見立てはしばしば外れる。抜きんでてはいないが落ち着いた資質をいちばんよく生かせる役どころを見きわめたいなら、控えめな役を初舞台に選び、本人の気質が少しずつ現れるに任せる方がよい。相応の値打ちがある独自の気質を目の前にしていると思うなら、最初の試みが成功しなくとも、大きな役と取っ組み合わせる方がよい。その人が引き受けた役と舞台で現れる個性の間の対照こそが、かえって個性をすっかり照らし、フットライトの中でそれが確かなかたちを取れるようにするからだ。こういう場合、初舞台が不評だったとしても、目の利く支配人なら並外れた俳優を手にしたと確信し、同時に、その気質がどんな役へ向くかも見定めるだろう。"
  "translation_status": "reviewed"
- "id": "becq-0332"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une troupe, quelque nombreuse qu'elle soit, présente toujours des lacunes, ce qu'on comprendra aisément après les explications qui précèdent. C'est pourquoi il se présente dans l'histoire d'un théâtre des périodes pendant lesquelles telle pièce ne produit pas tout l'effet qu'on en devrait attendre et quelquefois ne peut absolument pas être reprise. Souvent il se passe dix ans, vingt ans même, pendant lesquels un groupe de pièces ne peut être remonté avec succès, par suite du manque d'un acteur d'un certain tempérament. Cela se fait surtout sentir dans les pièces modernes, et cela tient à l'hétérogénéité des rôles qui tend et tendra à s'accuser de plus en plus. L'art dramatique suit en cela l'évolution de la vie moderne, et de même que dans le monde chacun prend une personnalité de plus en plus distincte, de même dans le théâtre qui reflète le monde les rôles augmentent en nombre à mesure qu'ils se différencient les uns des autres. Et même, c'est par une sorte de tendance philosophique instinctive que les auteurs se laissent si facilement aller à composer des pièces entières pour tel acteur ou pour telle actrice. Ils profitent habilement d'une personnalité distincte et très particulière que leur offre bénévolement la nature, qu'ils s'ingénient à développer et à pousser dans ses différents sens, et ils composent toutes leurs pièces en vue d'une personnalité théâtrale que le hasard probablement ne leur offrira pas une seconde fois. C'est surtout dans les théâtres de genre que ce système tend à prévaloir, et on arrive réellement à produire sur le public des impressions piquantes et originales; mais le danger est dans la répétition trop souvent renouvelée du même procédé. Pour arriver à satisfaire le public et pour prévenir en lui la satiété, il faudrait un peu plus souvent casser et remplacer le joujou dont on l'amuse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 332
    "line_start": 4858
    "line_end": 4884
  "translation_ja": "一座はどんなに大きくても、つねにどこか人が足りない。ここまでの説明でたやすく分かるだろう。このため劇場の歴史には、ある芝居が期待される効果を出しきれず、ときにはまるで再演できない時期がある。ある気質を持つ俳優がいないばかりに、ある一群の芝居が、十年、ときには二十年、うまく再演できないことも珍しくない。これはとりわけ近代劇でよく感じられ、役が互いに異なるところが、ますます、そして今後もいっそう際立つことによる。演劇はここで近代の生活の変化を追っている。世の中で一人ひとりがますます別の個性を持つようになるのと同じように、世の中を映す劇場では、役は互いの違いが増すほど数を増す。しかも作者がある俳優一人、女優一人のために、こんなにもたやすく芝居をまるごと書いてしまうのは、一種の哲学的な傾向がひとりでに働くからだ。自然が惜しみなく与えてくれた、はっきりとした、きわめて特有の個性を抜け目なく生かし、工夫していろいろな方向に発展させる。偶然が二度と与えてくれまい一つの舞台上の個性を念頭に、芝居を次々と作る。とくに特定のジャンルを扱う劇場では、このやり方が優勢になりつつある。確かに、観客には刺激的で新しい印象を与えられる。だが危ないのは、同じやり方を何度も使いすぎることだ。観客を満足させ、もう十分だと思わせないためには、客を喜ばせているおもちゃをもう少し頻繁に壊し、別のものに替えるべきだろう。"
  "translation_status": "reviewed"
- "id": "becq-0333"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette hétérogénéité de l'art a pour conséquence une différenciation de plus en plus grande entre les images initiales des personnages du théâtre moderne; et, par suite, un acteur devient de moins en moins apte à remplir avec succès un grand nombre de rôles: son image s'associe avec des groupes de rôles de plus en plus restreints. D'où résulterait la nécessité d'accroître indéfiniment le nombre d'acteurs composant une troupe de théâtre. Cette nécessité a pour conséquence immédiate: premièrement, la disparition des troupes de province; deuxièmement, la fusion en une seule de toutes les troupes existant à Paris; troisièmement, l'exploitation des théâtres de province par les troupes de Paris. La première conséquence s'est aujourd'hui entièrement réalisée: les quelques troupes qui résistent encore se ruinent ou se ruineront. Le moment approche où il n'y aura plus un seul théâtre de province vivant de sa vie propre. La seconde conséquence se fait déjà sentir. Les acteurs, pour la plupart, ne contractent plus que des engagements temporaires, qui se restreignent souvent à l'exploitation d'une pièce. Les acteurs passent d'un théâtre à l'autre sans se fixer définitivement. Les directeurs font des emprunts quotidiens aux troupes de leurs confrères: d'où naît une tendance naturelle à mettre en commun leurs ressources, c'est-à-dire leurs théâtres, leurs capitaux, leurs acteurs, leurs décors et leur matériel. La troisième conséquence a porté tous ses fruits: troupes d'hiver, troupes d'été, troupes de villes d'eau ou de villes de jeu, toutes s'organisent à Paris au moyen des disponibilités existantes en personnel et en matériel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 333
    "line_start": 4886
    "line_end": 4909
  "translation_ja": "芸術のこの異質性のために、近代劇の人物の初めの像は、ますます互いに違ってくる。そのため一人の俳優が多くの役をうまく演じきる力は相対的に小さくなり、その俳優の像が結びつく役の集まりも狭くなる。このままなら、一座を組む俳優の数はいくらでも増やさなくてはならない。それがすぐ引き起こすのは、第一に地方の一座が消えること、第二にパリにある一座がみな一つにまとまること、第三に地方の劇場がパリの一座によって運営されることだ。今日、第一の結果はすっかり現実になった。なお抵抗しているわずかな一座は破産しているか、いずれ破産する。独り立ちしている地方の劇場が一つもなくなる時は近い。第二の結果はもう感じられる。俳優の大半は短期の契約しか結ばず、一作を上演するあいだだけのものも多い。俳優は劇場から劇場へ移ってゆき、どこにも腰を落ち着けない。支配人は毎日のように同業者の一座から人を借りる。そこで劇場、資金、俳優、装置、機材など、持っているものを共同で使いたいと思うのは自然なことだ。第三の結果もすっかり現れた。冬の一座も、夏の一座も、温泉地や賭博場のある町へ行く一座も、みなパリで、手の空いた人員や余っている機材を使って編成される。"
  "translation_status": "reviewed"
- "id": "becq-0334"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quelles sont maintenant les conséquences de cette hétérogénéité sur l'art théâtral. Produit de l'analyse, elle pousse les artistes dans la voie de l'analyse. Les images ou idées, de générales qu'elles étaient, se décomposent en images ou idées particulières; celles-ci se différencient les unes des autres par des caractères qui, négligés jadis ou habilement fondus dans l'ensemble, s'accusent et prennent un relief inattendu. De là un travail incessant des comédiens pour mettre en saillie ces traits particuliers et spéciaux; de là, la recherche du détail et par suite l'introduction de plus en plus fréquente du réel. Dans la comédie de Molière, pour prendre un exemple, l'argent ne s'est pas encore incarné dans un personnage spécial; mais au XVIIIe siècle nous voyons se dessiner l'image du financier. Aujourd'hui cette image, beaucoup trop générale pour nous, s'est décomposée et nous fournit les images du banquier, de l'agent de change, du quart d'agent de change, du boursier, du coulissier, etc. Ce qui distingue ces personnalités, issues d'une personnalité plus générale, ce sont, non des différences essentielles, mais des différences de surface, des détails pris sur le vif de la société actuelle, des traits de moeurs particulières. L'esprit d'analyse du comédien est obligé de s'affiner; il creuse ses personnages, se met en observation, à l'affût des types particuliers qui se croisent sous ses yeux; et, quand il monte sur la scène, il ressemble souvent à tel que nous venons de coudoyer une heure avant d'entrer au théâtre. Ce n'est plus le portrait à l'huile, peint largement, qui doit la flamme de la vie au tempérament de l'artiste: c'est l'implacable photographie qui fouille les rides, exagère les défauts et grossit les plus charmants détails."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 334
    "line_start": 4911
    "line_end": 4936
  "translation_ja": "ではこの異質性は、舞台の芸術に何をもたらすのか。細かく分けて考えることから生まれた異質性は、芸術家たちを、もっと細かく分けて考える方向へ向かわせる。一般的だった像や観念は個別のものに分かれ、かつては顧みられなかったり全体にうまく溶かしこまれたりした特徴が、目立って思いがけず浮き立つために、互いの違いが出る。そのため俳優はその個別で特殊な特徴を際立たせようと絶えず働く。そのため細部が追われ、現実そのものが舞台に持ちこまれることが増える。例を挙げよう。モリエールの喜劇では、金銭はまだ特定の人物に姿を取っていない。ところが十八世紀には財界人の像が現れる。今日、あまりに漠然として見えるその像はばらばらになり、銀行家、公認の証券仲買人、その四分の一持分を持つ者、取引所で投機する者、公認市場の外で仲買をする者などの姿を私たちに与える。もっと一般の個性から出たこうした個性を区別するのは、本質の違いではない。その表面の違い、当世の社交を生きたまま写し取った細部、それぞれの風俗ゆえの特徴である。俳優はものを見分ける力を磨かざるを得ない。登場人物を掘り下げ、目の前を行き交う特有の人間類型をつかもうと観察する。舞台に上がるころには、劇場へ入る一時間前に袖すり合った誰かにそっくりだったりする。それはもう、おおらかな筆づかいで描かれ、芸術家の気質から命の炎を得る油絵の肖像ではない。しわまでほじくり出し、欠点を誇張し、いちばん魅力ある細部まで拡大する、容赦のない写真だ。"
  "translation_status": "reviewed"
- "id": "becq-0335"
  "section_id": "ch34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De là, pour le comédien, naît une certaine tendance à devenir caricaturiste, tendance qui s'affirme surtout dans les théâtres de genre. En outre, comme le nombre de représentations des pièces à succès a décuplé, et que telle qu'on aurait jouée autrefois une cinquantaine de fois arrive souvent aujourd'hui à la trois-centième représentation, il s'ensuit que cette répétition forcée des mêmes rôles tend à déformer le talent de l'artiste et à transformer en traits permanents des traits qui ne devraient être que passagers. Le comédien, malgré lui, sans d'ailleurs qu'il en ait conscience, est la proie d'une personnalité qu'il revêt trop souvent et dont la nature composée se substitue peu à peu par l'habitude à sa propre nature. Il arrive même un moment où l'acteur a perdu toute faculté de création nouvelle, et semble absorbé dans un rôle unique dont il ne pourra désormais se débarrasser, car il en a pris définitivement la ressemblance, la voix, le port, les allures, les manières et jusqu'aux tics particuliers. C'est la vengeance de l'art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 335
    "line_start": 4938
    "line_end": 4953
  "translation_ja": "こうして俳優には、何かと似顔絵描きになろうとする傾向が生まれ、特定のジャンルを扱う劇場でとりわけはっきりする。おまけに当たり芝居の上演回数が十倍になり、以前なら五十回ほど演じられた芝居が、今ではしばしば三百回目にまで達する。同じ役をいやおうなしに繰り返した結果、俳優の才能は変形し、その場かぎりであるべき特徴がいつまでも残るようになる。俳優は自分で望んでもいないのに、それと気づきもしないまま、あまりにたびたび身にまとう別の個性にとらわれる。演じるために組み立てたその性格が、習慣の力で少しずつ本人の性格に取って代わる。新しく創造する力をすっかり失い、一つの役に呑みこまれ、二度とその役を振りほどけないように見える時さえ来る。その役の顔つき、声、姿勢、足取り、物腰から、ちょっとした特有の癖までが、すっかり身についてしまったからだ。それが芸術の復讐である。"
  "translation_status": "reviewed"

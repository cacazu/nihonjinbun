      "end": 12
      "exact": "Tartufe"
- "id": "becq-0156"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette révolution esthétique s'accorde d'ailleurs avec nos idées métaphysiques, psychologiques et physiologiques actuelles. Comme le monde, comme les sociétés, comme toutes les sciences, l'esthétique a crû en complexité et en hétérogénéité, et nous ne sommes pas sans doute encore au bout des transformations que l'avenir lui imposera. La mise en scène ne peut pas s'isoler et se séparer de l'esthétique, dont elle n'est qu'une partie subordonnée; elle ne doit pas obéir à des principes différents. C'est pourquoi l'évolution de la mise en scène n'est pas le résultat d'un parti pris, mais au contraire résulte d'une transformation insensible de l'esthétique dramatique et de la société moderne. La mise en scène a ainsi acquis une plasticité qu'elle n'avait pas autrefois, et sur ce point semble se soumettre ou tout au moins se prêter aux théories de l'école réaliste ou naturaliste, dont le plus grand tort est de vouloir précipiter une évolution, qui, ainsi que nous le verrons plus loin, amènerait fatalement une déchéance de l'art, si elle n'était modifiée et retardée par une lente diffusion de la culture générale de l'esprit et par un relèvement graduel de l'idéal artistique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 156
    "line_start": 2014
    "line_end": 2030
  "translation_ja": "この美学の革命は、また、今日の私たちの形而上学、心理学、生理学の考えとも一致する。世界や社会やあらゆる科学と同じく、美学も複雑に、また雑多になってきた。未来に強いられる変化の果てには、まだ至っていないに違いない。演出は、美学に従う一部でしかない以上、自分だけ切り離れて、美学と別の存在になるわけにはいかず、異なる原則に従ってはならない。だから演出の変化は、決めてかかったことの結果ではなく、劇の美学と近代社会が気づかないほど少しずつ変わった結果なのだ。こうして演出は、かつてなかった柔軟さを得た。この点では写実主義や自然主義の流派の理論に従うか、少なくともその理論に応じる余地があるように見える。これらの流派のもっとも大きな誤りは、一つの変化を急に進めようとすることだ。あとで見るように、精神の幅広い教養がゆっくりと広がり、芸術の理想がしだいに高まることで、その変化が整えられ、速度を落とさなければ、芸術の衰えを必然的に招くだろう。"
  "translation_status": "reviewed"
- "id": "becq-0157"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutefois, cette physionomie particulière de la mise en scène pourrait être un obstacle à la reprise future de nos pièces modernes; car ce qui nous parait aujourd'hui un trait de jeunesse sera un jour une ride d'autant plus marquée que le trait aura été plus précis. Toutefois, une réflexion s'impose, qui nous permet de ne pas tenir grand compte de ce vieillissement certain: c'est que, dans une oeuvre dramatique, la mise en scène est la partie essentiellement destructible. Au bout d'un petit nombre d'années, les décorations d'une pièce et son matériel figuratif n'existent plus. Par conséquent, une reprise nécessite une mise en oeuvre nouvelle, qui devra être sensiblement différente de la mise en oeuvre primitive, ainsi que nous le ferons voir plus loin. Ici, il nous suffira de dire que l'appareil décoratif et figuratif, mis de nouveau en concordance, d'une part avec la pièce, et d'autre part avec le goût actuel, n'aura nécessairement que les rides que lui infligera l'oeuvre dramatique elle-même. Malheureusement, elles seront nombreuses si l'art continue, comme la société, à croître en complexité et en hétérogénéité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 157
    "line_start": 2032
    "line_end": 2047
  "translation_ja": "もっとも、演出がそれぞれの作品に固有の顔つきをもつことは、現代の戯曲の将来の再演を妨げるかもしれない。今は若々しさのしるしと思える特徴が、いつかはしわになり、その特徴がはっきりしていたほど、そのしわも濃くなるからだ。ただし、この避けられない老いをさほど気にしなくてもよいわけが、一つ思い浮かぶ。戯曲において、演出はなにより壊れやすく、消えてしまう部分である。わずか数年たてば、どんな芝居でも、舞台装置や舞台上の実物はもはや残っていない。したがって、再演には一から作り直すことが必要で、あとで見るように、新しい上演はもともとの上演とは、目に見えて違うものになるだろう。ここでは、装置や舞台上の実物のしつらえを、一方では芝居に、もう一方ではその時代の好みに、改めて合わせるなら、そのしつらえに残るしわは、必然的に、戯曲そのものから刻み込まれたものだけだ、と言えば足りる。残念ながら、芸術が社会と同じように、ますます複雑で雑多になってゆくなら、そのしわは多くなるだろう。"
  "translation_status": "reviewed"

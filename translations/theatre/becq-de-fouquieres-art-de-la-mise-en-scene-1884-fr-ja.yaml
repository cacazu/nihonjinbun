- "id": "becq-0024"
  "section_id": "ch01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le succès n'est pas la mesure de la valeur intrinsèque d'une oeuvre dramatique.--Les variations de l'art correspondent aux variations de l'esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 24
    "line_start": 248
    "line_end": 250
  "translation_ja": "成功は戯曲そのものの価値を測る尺度ではない。芸術の変化は人間精神の変化に対応する。"
  "translation_status": "reviewed"
- "id": "becq-0025"
  "section_id": "ch01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J'examinerai tout d'abord la question de la mise en scène dans ses termes les plus généraux, ce qui me permettra de formuler des lois générales d'où il sera ensuite plus facile de déduire les règles particulières. Je commencerai par rappeler cette vérité universellement admise et acceptée couramment comme un lieu commun: la valeur intrinsèque d'une oeuvre dramatique n'a pas toujours pour mesure la valeur que lui attribuent les contemporains."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 25
    "line_start": 253
    "line_end": 259
  "translation_ja": "まず演出という問題を、できるだけ広く捉えて考えよう。そうすれば一般的な法則を言い表すことができ、そこから先は個々の規則を導きやすくなる。手始めに、誰もが認め、もはや決まり文句のように受け取っている一つの真実を思い起こそう。戯曲そのものが持つ価値は、同時代人がそれにつける値打ちでは必ずしも測れない。"
  "translation_status": "reviewed"
- "id": "becq-0026"
  "section_id": "ch01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette proposition ne peut rencontrer beaucoup de contradicteurs. Il suffit de rappeler l'engouement peu justifié du public, à toutes les époques, pour tel poète ou pour telle oeuvre dramatique. Les exemples que l'on pourrait citer sont innombrables. Si l'on dressait la liste de tous les auteurs ayant joui d'une grande réputation de leur vivant et ayant remporté de très vifs succès au théâtre, on pourrait constater qu'il en est quelques-uns dont les noms ont disparu de la mémoire des hommes, et que la plupart ne nous sont aujourd'hui connus que par les titres de pièces qu'on ne lit plus. Comme toute chose ici-bas, les oeuvres d'art se plient aux caprices passagers de la mode et aux perversions momentanées du goût. Une élite peu nombreuse porte seule des jugements certains que ratifie l'avenir, tandis que la foule se complaît dans le plaisir qu'elle éprouve à sentir caresser ses passions et favoriser ses penchants. Elle s'admire dans les oeuvres qui flattent ses goûts, comme le fat devant un miroir qui reflète son air à la mode. Chaque pas du temps fait des hécatombes d'oeuvres dramatiques; et la grande réputation d'une oeuvre passée n'a souvent d'égal que l'étonnement plein de tristesse et de désenchantement que nous cause sa reprise. Qui ne sait même, à un point de vue plus général encore, combien nous sommes exposés à gâter nos plus chers souvenirs, quand dans l'âge mûr nous avons la faiblesse de rouvrir les livres qui nous ont ravi dans notre jeunesse. En pareil cas, on se console naïvement en disant que l'oeuvre a vieilli, tandis que c'est tout le contraire qui est le vrai: l'oeuvre a gardé son âge, et nous seuls nous avons vieilli."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 26
    "line_start": 261
    "line_end": 284
  "translation_ja": "この命題に異を唱える人は多くあるまい。どの時代にも、観客がさしたる根拠もなく特定の劇作家や戯曲に夢中になってきたことを思い出せばよい。例は数えきれない。生前に大評判をとり、劇場で大成功を収めた作家をすべて一覧にしてみれば、中には名さえ人の記憶から消えた者もおり、大半は、もはや読まれなくなった戯曲の題名によってかろうじて今日に知られているとわかるだろう。この世のあらゆるものと同じく、芸術作品も、一時の流行の気まぐれや、趣味が束の間道を踏み外すのに従う。未来がやがて裏書きする確かな判断を下すのは、ごく少数の目利きにすぎない。一方、群衆は、自分の情念をくすぐられ、自分の好みを後押しされる快さに浸っている。気取り屋が、流行どおりの自分の姿を映す鏡の前で見とれるように、大衆はその趣味におもねる作品のうちに自分を見てうっとりする。時が一歩進むたび、戯曲はおびただしい犠牲を出す。往年の作品の大評判に匹敵するものは、しばしば、その再演に接した私たちが感じる、悲しさと幻滅を帯びた驚きしかない。もっと広く考えても、若いころ心を奪われた本を、分別のついた年齢になってまた開いてしまうと、いちばん大切な思い出まで台無しにしかねないのを、誰が知らないだろう。そんなとき人は無邪気に「作品が年をとったのだ」と言って自分を慰める。本当はまるで逆だ。作品の年齢は変わらない。年をとったのは私たちのほうだけなのだ。"
  "translation_status": "reviewed"
- "id": "becq-0027"
  "section_id": "ch01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, ce qui se passe dans la vie d'un homme se passe dans la vie d'une nation et dans celle de l'humanité. Les jugements des hommes sont soumis à des transformations perpétuelles, car les éléments de leur esprit se combinent de mille manières selon leur nombre et leur nature. Il est à croire que ces combinaisons donnent lieu, comme en chimie, à des composés dont les uns sont très stables et les autres particulièrement instables. Quand les oeuvres littéraires correspondent aux premiers, ils vivent dans la même estime aussi longtemps que la combinaison persiste; quand elles se rapportent aux seconds, elles ne plaisent qu'un jour, et tout ce que l'on peut espérer pour elles c'est que la même combinaison, venant à se reproduire fortuitement, leur ramène momentanément la fortune. Il est, au contraire, quelques oeuvres privilégiées qui correspondent à des combinaisons indissolubles: elles sont immortelles; et l'esprit en savourera sans fin la beauté et la vérité éternelle, de même que le corps humain puisera la vie, jusqu'à la consommation des temps, dans l'air immuable qui l'enveloppe."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 27
    "line_start": 286
    "line_end": 301
  "translation_ja": "一人の人間の生涯に起こることは、一つの国民の生涯にも、人類の生涯にも起こる。人間の判断は絶えず変わってゆく。精神を成すさまざまな要素は、その数と性質に応じて幾通りにも結びつくからだ。その組み合わせからは、化学でいう化合物と同じように、ごく安定したものも、とりわけ不安定なものも生じるのだろう。文学作品が前者に応じているときには、その組み合わせが続くかぎり、同じように高く評価され続ける。後者に応じているときには、一日だけ人に好かれるにすぎない。その作品に望み得るせいぜいの幸運は、いつか偶然おなじ組み合わせが現れて、しばし運がまた向いてくることだ。これに対して、ごく少数の恵まれた作品は、決して解けない結びつきに応じている。それらは不滅である。人間の肉体が、世の終わりまで、それを包む変わらぬ空気から命を汲み続けるように、精神もそうした作品の永遠の美と真実を、どこまでも味わい続けるだろう。"
  "translation_status": "reviewed"
- "id": "becq-0028"
  "section_id": "ch02"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE II"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 28
    "line_start": 305
    "line_end": 305
  - "source_id": "paper-1884-ia"
    "precision": "page"
    "printed_page": "4"
    "url": "https://archive.org/details/lartdelamiseensc00becq/page/n23/mode/1up"
  "translation_ja": "第2章"
  "translation_status": "reviewed"
- "id": "becq-0029"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La valeur d'une pièce ne dépend pas de son effet représentatif.--Ce n'est pas l'effet représentatif qui a assuré la renommée du théâtre des Grecs, non plus que des théâtres étrangers et de notre théâtre classique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 29
    "line_start": 307
    "line_end": 310
  "translation_ja": "戯曲の価値は、上演がもたらす効果に左右されない。ギリシア劇も、諸外国の演劇も、わが国の古典劇も、名声を得たのは上演効果のおかげではない。"
  "translation_status": "reviewed"
- "id": "becq-0030"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous ferons un pas de plus dans la connaissance du sujet en émettant cette seconde proposition: la valeur intrinsèque d'une oeuvre dramatique ne dépend pas de son effet représentatif. Si nous n'avions en vue que l'effet représentatif produit sur des contemporains à une époque donnée, il est clair que cette proposition rentrerait dans la précédente: Mais il s'agit ici de l'effet représentatif absolu, et à ce titre elle mérite de nous arrêter."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 30
    "line_start": 313
    "line_end": 319
  "translation_ja": "ここで第二の命題を立てれば、問題への理解は一歩進む。戯曲そのものの価値は、その上演が生む効果に左右されない。ある時代の同時代人に及ぼす効果だけを考えるなら、これが前の命題に含まれることは明らかだ。しかし、ここで問題にしているのは上演効果それ自体である。その意味で、しばらく立ち止まって考えるに値する。"
  "translation_status": "reviewed"
- "id": "becq-0031"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je remarquerai d'abord, au sujet des oeuvres appartenant aux littératures anciennes ou étrangères, que si la représentation d'une oeuvre dramatique a servi à la mettre en lumière, ce qui n'est pas niable, elle n'a pas suffi à lui assurer la renommée durable qui en a perpétué le souvenir dans la postérité. L'effet représentatif est dans ce cas sans influence sur le jugement que nous portons de la valeur d'une oeuvre dramatique. En effet, si nous considérons le théâtre des Grecs, nous pouvons dire que nous n'avons aucune idée, ou tout au moins que des idées excessivement confuses, de ce que pouvait être la représentation des tragédies d'Eschyle, de Sophocle et d'Euripide, ou celle des comédies d'Aristophane. C'est uniquement par leur valeur intrinsèque qu'elles s'imposent à notre admiration, et c'est avec raison que nous les considérons comme des modèles presque inimitables, sans que nous ayons besoin de tenir compte d'un effet représentatif que nous ne pouvons imaginer qu'à grand renfort d'érudition, sans jamais pouvoir être sûr de l'apprécier à sa juste valeur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 31
    "line_start": 321
    "line_end": 336
  "translation_ja": "まず、古代や外国の文学に属する作品を考えよう。上演は戯曲を世に知らしめる役に立った。それは否定しようもない。だが、上演だけでは、作品を後世の記憶にとどめる永続的な名声までは保証し得なかった。この場合、ある戯曲の価値に私たちが下す判断に、上演の効果は何の影響も与えていない。たとえばギリシア劇では、アイスキュロス、ソポクレス、エウリピデスの悲劇やアリストパネスの喜劇がどう演じられたか、私たちには見当もつかず、つくとしてもひどく曖昧なものだと言ってよい。私たちに賛嘆の念を起こさせるのは、ひとえに作品そのものの価値である。それらをほとんどまねようのない手本と見るのは正しい。そのために当時の上演効果まで考慮する必要はない。それを想像するには膨大な学識の助けが要り、しかも正当に評価できたとの確信など決して持てないのだから。"
  "translation_status": "reviewed"
- "id": "becq-0032"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il en est à peu près de même du théâtre des Espagnols, aussi bien que de celui des Anglais et des Allemands. Bien que les sujets en soient pris dans un monde en tout moins éloigné du nôtre et qui est celui où se meuvent souvent encore nos personnages de théâtre, ce n'est nullement dans leur effet représentatif que nous cherchons et que nous trouvons les justes motifs de leur renommée. Nous n'en sommes que très rarement les spectateurs, et c'est uniquement comme lecteurs que nous apprenons à les connaître et que nous les jugeons. C'est bien dans ce cas l'esprit seul qui en goûte la poésie, sans que nos yeux soient dupes des séductions de la mise en scène. Le théâtre français lui-même n'échappe pas au même phénomène. La représentation l'amoindrit presque toujours, en atténue les proportions psychologiques et en rapetisse sensiblement les héros. Que serait-ce si nous tenions compte du maigre appareil dont, jusqu'à la fin du XVIIIe siècle, on entourait la représentation de notre théâtre classique! L'effet représentatif des tragédies de Corneille et de Racine n'a donc que peu d'influence sur l'admiration que nous éprouvons pour elles. Bien au contraire, la représentation nous apporte souvent un désenchantement en quelque sorte prévu. Cette remarque ne tend pas à en proscrire la représentation, qu'en rendent, au contraire, nécessaire et désirable d'autres raisons que nous exposerons plus loin."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 32
    "line_start": 338
    "line_end": 357
  "translation_ja": "スペインの演劇についても、イギリスやドイツの演劇についても、おおむね同じである。題材の取られる世界は古代劇の世界ほどには、どの点でも私たちの世界から遠くなく、今でもしばしばわが国の芝居の登場人物が動き回る世界でもある。けれども、その名声を正当とする理由を私たちが求め、見いだすのは、けっして上演の効果のうちではない。私たちがその観客になるのはごくまれで、ほとんどもっぱら読者として作品を知り、判断する。この場合、演出の魅力に目を欺かれることなく、精神だけがその詩を味わうのだ。フランスの演劇にしても同じ現象を免れない。舞台にかけると、ほとんどいつも、作品は小さく見え、人物の心の広がりが薄れ、主人公まで目に見えて小粒になる。まして十八世紀の末まで、わが国の古典劇がどれほど乏しい装置で上演されていたかまで考えに入れたら、どうなるだろう。したがって、コルネイユやラシーヌの悲劇をたたえる私たちの気持ちに、実演の効果はほとんど関与していない。それどころか、観劇がもたらすのは、しばしばいわば予想どおりの幻滅なのだ。とはいえ、その上演を禁ずるべきだと言うのではない。逆に、上演を必要とし、望ましくもする別の理由がある。それについてはのちに述べよう。"
  "translation_status": "reviewed"
- "id": "becq-0033"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On a souvent voulu transporter les théâtres étrangers sur la scène française, notamment les drames de Shakspeare. Toujours l'effet a été inférieur à celui qu'on en attendait, ce qui pourtant n'a jamais diminué l'admiration que nous ressentons pour le grand poète anglais. Il serait d'ailleurs puéril d'en rechercher la cause dans le changement de langue que nécessite la translation de ses oeuvres sur notre théâtre, car c'est par la traduction seule qu'un grand nombre de lecteurs français connaissent Shakspeare et apprennent à l'aimer et à l'apprécier. La traduction d'une oeuvre ancienne ou étrangère, loin de lui nuire, la rajeunit souvent en atténuant ou en modifiant des idées ou des images qui seraient de nature à choquer notre goût actuel; elle tient forcément compte, rien que par l'emploi de la langue dont elle se sert, de la différence des temps, des lieux et des transformations de l'esprit. C'est une nouvelle mise au point, qui dégage ce qu'il y a dans toute oeuvre d'essentiellement humain et d'éternellement beau."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 33
    "line_start": 359
    "line_end": 373
  "translation_ja": "外国の劇、とりわけシェイクスピアの戯曲をフランスの舞台に移す試みは何度もあった。その効果はいつも期待を下回ったが、だからといって、あの偉大なイギリスの詩人への敬愛が薄れたためしはない。わが国の舞台に移すには言語を変えねばならないからだ、と原因を求めるのは子供じみている。多くのフランスの読者はそもそも翻訳だけでシェイクスピアを知り、愛し、味わうことを覚えたのだから。古代や外国の作品の翻訳は、作品を損なうどころか、今日の私たちの趣味に障りそうな考えやイメージを和らげたり変えたりして、しばしば作品を若返らせる。翻訳は、訳す言葉を用いるというだけで、時代や土地の違い、精神の変化をおのずと織り込む。それはいわば新しく焦点を合わせ直すことであり、どの作品にも含まれている、本質において人間的なもの、永遠に美しいものを浮かび上がらせるのである。"
  "translation_status": "reviewed"
- "id": "becq-0034"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "D'ailleurs, à un autre point de vue, il suffit d'un moment de réflexion pour s'apercevoir que l'effet représentatif n'est pas la mesure de la valeur intrinsèque d'une oeuvre dramatique. Si nous comparons entre eux le Guillaume Tell et les Brigands de Schiller, l'Iphigénie et l'Egmont de Goethe, le Polyeucte et le Cid de Corneille, le Misanthrope et le Tartufe de Molière, il est certain que de toutes ces pièces les premières ont une valeur intrinsèque au moins aussi grande, si ce n'est plus grande, que les secondes, tandis que celles-ci ont un effet représentatif beaucoup plus grand. C'est que la valeur représentative et la valeur poétique d'une oeuvre dramatique ne se composent pas des mêmes éléments, et par conséquent n'ont pas de commune mesure. Si les contemporains se trompent souvent sur la valeur d'une pièce, c'est que dans leurs jugements ils tiennent compte de l'effet représentatif qui précisément s'adapte à leur goût actuel. La postérité, au contraire, fait abstraction de cet effet et souvent n'en a pas même l'idée; c'est pourquoi son jugement, portant uniquement sur la valeur poétique de l'oeuvre, est plus durable. Négligeant ce qui est variable et passager, elle ne fonde son jugement que sur ce qui est invariable et constant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 34
    "line_start": 375
    "line_end": 393
  "translation_ja": "また別の見方をしても、上演効果が戯曲そのものの価値の尺度ではないことは、少し考えるだけでわかる。シラーの『ヴィルヘルム・テル』と『群盗』、ゲーテの『イフィゲーニエ』と『エグモント』、コルネイユの『ポリュクト』と『ル・シッド』、モリエールの『人間嫌い』と『タルチュフ』を、それぞれ比べてみよう。いずれの組でも前者の作品自体の価値は、後者にまさるとは言わないまでも、少なくとも劣らない。ところが、上演の効果がはるかに大きいのはいずれも後者だ。つまり戯曲の、舞台にかけたときの価値と詩としての価値は、成り立つ要素が違う。ゆえに両者を同じ物差しでは測れない。同時代人がしばしば戯曲の価値を見誤るのは、自分たちのその時々の好みにぴたりと合った上演効果を判断に入れるからである。後世の人は、これとは反対に、そうした効果を度外視する。そもそもその効果について何の観念も持たないことが少なくない。後世の判断がより長く持ちこたえるのは、作品の詩としての価値だけにかかわるからだ。移り変わるもの、過ぎ去るものを捨て、変わらず、つねにあるものだけを判断のよりどころとするのである。"
  "translation_status": "reviewed"

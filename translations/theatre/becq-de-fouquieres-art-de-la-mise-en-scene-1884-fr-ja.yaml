- "id": "becq-0205"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand commence une représentation tragique les spectateurs sont d'abord simplement attentifs, les uns parce qu'ils se disposent à un plaisir ineffable qu'ils connaissent, les autres par l'intuition qu'ils ont de ce plaisir, un certain nombre enfin par respect, par convenance ou même seulement par imitation. La plupart n'entrent que très peu dans les raisons longuement déduites de l'exposition et ne s'attachent que médiocrement aux préliminaires de l'action. Mais peu à peu l'intérêt s'accroît, à mesure que la passion se dégage et que sous le personnage historique ou légendaire apparaît le type humain créé et mis en scène par le poète, c'est-à-dire à mesure que l'art se manifeste et que le génie du poète, s'essayant à un jeu divin, infuse dans les fantômes qu'il évoque à nos yeux la vie et toutes les passions qui en font le charme ou l'horreur. Alors, pour peu que la décoration soit décente, que le jeu et la déclamation des acteurs s'accordent avec le texte poétique, il arrive un moment, une scène, une situation où l'art se manifeste sous sa plus parfaite expression, où tous les moyens si patiemment combinés, où tous les efforts si longuement accumulés aboutissent enfin, et où l'idée, arrachée de l'esprit, de l'âme et des entrailles du poète, se dégage de ses langes et se dresse à nos yeux, éclatante de vérité et toute palpitante de vie, belle dans sa nudité sans défauts comme l'Anadyomène antique. A ce moment un trouble profond et délicieux envahit notre être tout entier, une angoisse inquiète, haletante nous étreint, pareille à l'émotion de l'amant qui surprend un signe adoré; un besoin d'air et d'espace infini semble nous soulever, comme ces rêves qui nous donnent des ailes; puis à cette volupté étrange et rapide succède un attendrissement qui se résout en larmes, et bientôt la lassitude qui suit ce moment de plaisir suprême nous permet de mesurer la puissance de la commotion dont tout notre être a été ébranlé. Or cette sensation, ce n'est pas la pitié que nous inspire Iphigénie qui nous la donne, ni la double anxiété de Chimène, ni l'enthousiasme contagieux de Pauline, ni la rage d'Hermione; non, cette sensation, dont le dieu nous secoue après avoir secoué le poète, n'est autre chose que la sensation du beau, c'est-à-dire ce trouble presque superstitieux de stupéfaction et d'admiration qui s'empare de nous, lorsque nous voyons une ébauche faite de main d'homme se revêtir soudain des signes supérieurs de la vie dont la volonté divine a marqué le front de ses créatures."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 205
    "line_start": 2833
    "line_end": 2869
  "translation_ja": "悲劇の上演が始まると、観客はまず、静かに注意を向ける。言葉には尽くせない、すでに知っている喜びに備える人もいれば、その喜びを直感している人もいる。敬意から、礼儀から、あるいはただ周りに倣ってそうする者もいる。多くの人は、冒頭で長々と説明される事情にはあまり立ち入らず、筋が動き出す前の段取りにもさほど気を取られない。だが情熱が次第に姿を現し、歴史や伝説の人物の奥から、劇作家が創り舞台に乗せた人間の型が立ち現れるにつれて、関心が高まっていく。つまり芸術が姿を現し、劇作家の天分が神にも似た営みを試み、目の前に呼び出した幻に命を吹き込み、その魅力や恐ろしさを形づくるあらゆる情熱を注ぎ込むにつれてである。そのとき、美術に見苦しさがなく、俳優の演技と台詞回しが戯曲の言葉に合ってさえいれば、やがてある瞬間、ある場面、ある状況が訪れ、芸術が最も完全な表現をとる。丹念に組み合わせてきたすべての手段と、長い間積み重ねたすべての努力がついに結実し、劇作家の頭と魂と腹の底から取り出された着想は、おくるみからほどけて、真実にきらめき、命を脈打たせながら、私たちの目の前に立ち上がる。古代のアナデュオメネ、海から生まれるアフロディテのように、隠すもののない姿のまま、欠点なく美しい。そのとき、心地よくも深い動揺が全身を満たし、息が詰まるほど切実な不安が身を締めつける。恋する者が思いがけず、愛する相手のしるしを見つけたときのような気持ちだ。どこまでも広い大気と空間を求める心が、私たちに翼の生える夢のように、体を浮き上がらせるかに思える。すると、奇妙でつかの間の恍惚に続いて、やわらかな感動が涙となってあふれ、ほどなく至高の喜びに続く疲れが訪れる。そこでようやく、全身を揺さぶった衝撃が、どれほど強かったのかが分かる。だが、この感覚を与えるのは、イフィジェニーへの憐れみでも、シメーヌの二重の不安でも、ポーリーヌの人にうつる熱情でも、エルミオーヌの激怒でもない。そうではなく、まず詩人を揺さぶった神が、次にこちらを揺さぶるこの感覚は、美の感覚にほかならない。人の手で作られたこしらえものが、不意に生の高いしるしをまとうのを見たとき、ほとんど迷信にも近い畏れに似た驚きと感嘆が、私たちをとらえる。そのしるしこそ、神の意志がその創造物の額に刻んだものである。"
  "translation_status": "reviewed"
- "id": "becq-0206"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cela est si vrai que cette sensation pourtant si forte peut être éprouvée, identique dans tous ses effets, aussi bien à la représentation d'une comédie de Molière qu'à la représentation d'une tragédie de Corneille ou de Racine, ce qui ne se concevrait pas si on devait en chercher la source dans le pathétique des situations, au lieu d'y voir un effet de la puissance de la poésie et du jaillissement de la vie, en un mot une manifestation du beau idéal, c'est-à-dire du beau conçu par l'esprit et enfermé par l'artiste dans un simulacre humain. C'est donc en résumé cette sensation réelle et tout organique qui constitue le plaisir particulier que nous allons demander aux oeuvres classiques. Si elle paraît plus intense à la représentation des oeuvres tragiques, c'est que celles-ci exaltent notre sensibilité, et, comme d'une corde plus tendue, nous arrachent des tressaillements plus aigus."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 206
    "line_start": 2871
    "line_end": 2883
  "translation_ja": "このことは、これほど強い感覚が、作用の一つひとつまで変わらぬまま、コルネイユやラシーヌの悲劇の上演だけでなく、モリエールの喜劇の上演でも味わいうることから、よく分かる。その源を場面の悲痛さに求めていたのでは、説明がつかない。詩の力と、命が湧き出すことの効果、ひとことでいえば理想の美が現れたのだ。精神が思い描いた美を、芸術家が人間の似姿の中に封じ込めたのである。まとめれば、古典作品に求めにいく独特な喜びは、確かに体で味わうこの感覚である。悲劇の上演でいっそう強く感じられるように見えるのは、悲劇が私たちの感受性を高め、張りの強い弦から音を引き出すように、私たちからより鋭い震えを引き出すからだ。"
  "translation_status": "reviewed"
- "id": "becq-0207"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette sensation ne se produit pas toujours, soit par suite de nos dispositions personnelles, soit par suite de celles des comédiens. Mais quand une fois on l'a ressentie, on en conserve un souvenir impérissable; on constate en soi ce goût des grandes oeuvres dont nombre de personnes parlent sans le connaître, et on se sent en possession d'un plaisir ineffable qui surpasse de beaucoup celui que pourraient nous procurer les situations dramatiques les plus émouvantes. Quand on s'efforce d'élever et de purifier le goût des jeunes gens, de leur ouvrir l'esprit, de leur faciliter l'accès des oeuvres immortelles qui sont la gloire de l'esprit humain, on travaille en définitive (que n'en sont-ils persuadés!) à leur procurer des plaisirs réels, des émotions aussi vraies, moralement et physiquement, que toutes celles auxquelles ils aspirent et enfin cette sensation du beau, qui est la jouissance suprême de l'être humain et la raison dernière de l'art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 207
    "line_start": 2885
    "line_end": 2898
  "translation_ja": "この感覚は、いつも生まれるわけではない。私たち自身の心のありようにも、俳優の状態にもよる。だが一度でも感じれば、その記憶は消えない。知らないまま語る人も多い傑作への愛着が、自分の中に確かにあると分かる。そして、どれほど胸に迫る劇的な場面がもたらす喜びよりもはるかにまさる、言葉にできない喜びを手にしたと感じる。若い人たちの趣味を高めて磨き、心を開き、人間の精神の栄光である不朽の作品に触れやすくしようと努めるのは、結局のところ、彼らに現実の喜びをもたらそうとしているのだ。どうか本人たちにもそれを信じてもらいたい。心でも体でも、彼らが望むどんな感動にも劣らない本物の感動を、そしてついには、人間にとって至高の喜びであり、芸術の究極の理由でもある、美の感覚を味わってもらうためである。"
  "translation_status": "reviewed"
- "id": "becq-0208"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais les hommes, ai-je besoin de l'ajouter, sont de complexion différente. Aux uns, c'est la poésie qui procure seule cette sensation du beau; aux autres, c'est la peinture, à ceux-ci c'est la musique, à ceux-là c'est la nature. Dans le domaine littéraire, on peut la ressentir à l'audition ou à la lecture des oeuvres les plus diverses, et elle est d'ailleurs variable d'intensité. Si je n'ai parlé que des chefs-d'oeuvre classiques, c'est d'abord qu'eux seuls nous font éprouver cette sensation dans toute son intégrité et qu'ensuite je n'ai pas la prétention de juger sommairement les écrivains et les poètes de mon époque. Il me sera permis toutefois d'ajouter que j'ai éprouvé cette sensation du beau à la représentation (pour m'en tenir au théâtre) de la plupart des oeuvres d'Alfred de Musset, dont le génie sait découvrir et ouvrir cette source de vie dont le jaillissement inonde notre âme."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 208
    "line_start": 2900
    "line_end": 2912
  "translation_ja": "もっとも、言うまでもなく、人の性質はさまざまである。ある人にとっては詩だけが美の感覚をもたらし、別の人には絵画が、また別の人には音楽が、あるいは自然がそれをもたらす。文学の領域では、実にさまざまな作品を耳で聞いたり目で読んだりして感じることができ、その強さもまちまちだ。私が古典の傑作しか話に出さなかったのは、第一に、それだけがこの感覚を欠けるところなく味わわせてくれるからであり、第二に、同時代の作家や詩人を性急に裁くつもりはないからである。ただ、演劇に限っても、アルフレッド・ド・ミュッセの作品の大半を見たとき、私がこの美の感覚を覚えたことは、付け加えさせてほしい。彼の天分は、ほとばしって魂をひたす命の泉を見つけ、開くすべを知っている。"
  "translation_status": "reviewed"
- "id": "becq-0209"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour conclure, je dirai que c'est cette sensation du beau qui est la raison des représentations classiques, et la justification des subventions que l'État accorde à l'Odéon et à la Comédie-Française. Est-il un but plus noble que celui de convier à un plaisir aussi parfait et aussi pur un peuple récemment affranchi, mais libre, hélas! pour le mal comme pour le bien, échappé à la discipline avant la fin de son éducation intellectuelle et morale, et porté naturellement à toutes les satisfactions des sens? N'est-il pas à espérer que parmi ce peuple, ceux qui auront une fois goûté et apprécié un plaisir si délicat se sentiront moins entraînés vers des plaisirs grossiers? C'est là qu'est la moralité de l'art et la raison de son influence sur la destinée humaine et sur la marche de la civilisation."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 209
    "line_start": 2914
    "line_end": 2925
  "translation_ja": "結びに、美のこの感覚こそ、古典を上演する理由であり、国がオデオン座とコメディ・フランセーズに助成金を出す正当な理由でもある、と言っておこう。解放されて日が浅く、良いことにも、残念ながら悪いことにも自由となり、知性と道徳の教育を終える前に規律を逃れ、おのずとあらゆる感覚の満足に引かれる民を、この上なく完全で純粋な喜びへと招く。これより高貴な目的があるだろうか。この民のうちで、ひとたびこれほど繊細な喜びを味わい、その値打ちを知った人は、粗野な楽しみにさほど引き寄せられなくなるのではないか。そこにこそ芸術の道徳的な力があり、芸術が人間の運命と文明の歩みに影響を及ぼすわけがある。"
  "translation_status": "reviewed"

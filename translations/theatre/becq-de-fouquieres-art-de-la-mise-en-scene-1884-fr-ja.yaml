    "kind": "emphasis"
    "span":
      "start": 358
      "end": 371
      "exact": "le Demi-Monde"
- "id": "becq-0324"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans toutes les pièces, tous les rôles ont ainsi leur physionomie propre que l'acteur ne doit jamais perdre de vue. Cela paraît tout simple au spectateur qui ne paraît nullement s'en étonner, et qui n'y voit probablement aucune difficulté. Sans doute, la composition du rôle est relativement facile quand la personnalité des personnages est nettement déterminée, comme dans l'exemple que j'ai choisi; mais que le lendemain les deux mêmes comédiens aient à remplir les rôles de Montmeyran et du marquis de Presle, dans le Gendre de M. Poirier, la transition, pour ne pas être brusque, n'en sera que plus délicate; et le spectateur, s'il y pense, pourra commencer à s'apercevoir de toute la difficulté qui préside à la mise en scène d'un rôle. Montmeyran est un militaire comme Raymond; mais le second a fourni une image initiale aux contours un peu secs et tranchants, tandis que le premier se révèle sous les traits d'une image aux angles adoucis. La ressemblance entre les deux sera surtout dans une certaine rectitude morale. Le marquis de Presle est un homme du monde comme Olivier de Jalin, mais avec un peu plus de morgue et de hauteur; il s'est moins usé à tous les contacts de la vie, et il a gardé la part de préjugés qu'Olivier a, dès longtemps, échangés contre une aimable philosophie. Eh bien, ces nuances qui différencient les images initiales de ces rôles, il faut ne pas les laisser perdre; elles doivent se retrouver à tous les moments de l'action, dans toutes les attitudes, dans les moindres gestes, dans la façon d'entrer et de sortir. Que le surlendemain les deux mêmes acteurs reparaissent dans Mademoiselle de Belle-Isle, sous les traits du duc de Richelieu et du chevalier d'Aubigny, voilà encore des images initiales qui sont dans un certain rapport, d'une part, avec le marquis de Presle et Olivier de Jalin, d'autre part, avec Montmeyran et Raymond, mais qui se distinguent cependant par des nuances multiples d'une grande importance, auxquelles s'ajoute la différence des époques, des costumes, des milieux, des caractères historiques, etc. On comprendra, dès lors, que si l'intuition fournit aisément aux comédiens les images initiales de chacun de ces rôles, la réflexion, l'étude, la comparaison leur seront nécessaires pour arriver laborieusement à fixer toutes les images dérivées, dans lesquelles le spectateur doit toujours retrouver l'image initiale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 324
    "line_start": 4709
    "line_end": 4742
  "translation_ja": "どの芝居のどの役にもこのように固有の顔つきがあり、俳優はそれを決して見失ってはならない。観客にはごく単純に見え、驚いた様子もなく、おそらく難しいところがあるとも思わない。確かに、ここで出した例のように人物ごとの性格がはっきりしていれば、役を作るのは比較的やさしい。だが翌日、同じ二人の俳優が『ポワリエ氏の婿』でモンメランとド・プレル侯爵を演じるとしよう。切り替えが急に見えないようにするほど、仕事は繊細になる。観客も考えてみれば、役を舞台上で作ることがどれほど難しいか、いくらか気づくだろう。モンメランはレーモンと同じ軍人だが、後者の最初の像はややそっけなく鋭い輪郭を持つのに対し、前者は角の取れた姿で現れる。いちばん似ているのは、どこか心根がまっすぐなところだ。ド・プレル侯爵はオリヴィエ・ド・ジャランと同じ社交界の男だが、もう少し尊大で気位が高い。世間のさまざまなことに触れて、オリヴィエほどすり減っていない。オリヴィエがずっと前に物分かりのよい哲学と取り替えた偏見を、ある部分はまだ持っている。こうした、役の初めの像を分けるかすかな違いを、失ってはならない。筋のどの時点にも、姿勢にも、ごくささいな身ぶりにも、出入りの仕方にも、それが見つからなくてはならない。\nさらにその翌日、同じ二人が『ベル＝イル嬢』にリシュリュー公爵とドービニー騎士の姿で出るとしよう。これも一方でド・プレル侯爵とオリヴィエ・ド・ジャランに、他方でモンメランとレーモンに、ある程度関わりのある初めの像だが、大切な細かい違いがいくつもある。それに時代、衣裳、環境、歴史上の人物としての特質なども異なる。だから、俳優がそれぞれの役の初めの像を直観からたやすく得られるとしても、そこから派生する像を一つ一つ苦心して定めるには、考え、学び、比べることが必要になると分かるだろう。観客はどの像にも、変わらず元の像を見つけられなくてはならない。"
  "translation_status": "reviewed"

- "id": "becq-0408"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'école naturaliste au théâtre.--La théorie des milieux.--Des milieux générateurs.--Des milieux contingents.--Conjonction de l'idéal et du réel.--La Charbonnière.--Du réel dans la perspective théâtrale.--Le Pavé de Paris.--Le naturalisme imposerait des conditions nouvelles à l'architecture théâtrale.--L'école réaliste devra tendre à redevenir une école idéaliste."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 408
    "line_start": 6205
    "line_end": 6210
  "translation_ja": "演劇における自然主義派。環境の理論。人をつくる環境。偶然に出会う環境。理想と現実の並置。『石炭屋の女』。舞台の遠近法の中の現実。『パリの敷石』。自然主義は劇場建築に新しい条件を課す。写実派はふたたび理想を描く流派たらんとすべきである。"
  "translation_status": "reviewed"

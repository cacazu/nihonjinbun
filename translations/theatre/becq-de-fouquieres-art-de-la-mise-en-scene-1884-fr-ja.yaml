      "end": 725
      "exact": "Ma Camarade"
- "id": "becq-0147"
  "section_id": "ch17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Est-il besoin qu'en terminant ce chapitre j'aborde la mise en scène des féeries? Je ne le crois pas: il n'y a pas de conditions dans le domaine de l'impossible. Cependant il est même une limite à l'éblouissement des yeux et à l'effet produit sur nous par le nombre et par un mouvement même vertigineux. Ce n'est donc ni dans l'intensité croissante de la lumière ni dans l'exagération du nombre et du mouvement qu'on trouvera des effets nouveaux et amusants, mais en cherchant dans des séries d'images de plus en plus éloignées quelque rapport apparent entre le possible et l'impossible. La féerie est de la fantaisie hyperbolique; mais, comme telle, elle ne doit pas violer trop ouvertement les lois de la fantaisie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 147
    "line_start": 1899
    "line_end": 1909
  "translation_ja": "本章を終えるにあたって、幻想劇の演出に取り組む必要があるだろうか。そうは思わない。不可能なものの領分には、条件がないからだ。とはいえ、目がくらむことにも、数の多さや、目まぐるしい動きが私たちに及ぼす効果にも、限界がある。光をますます強くしたり、数や動きを大げさにしたりするところから、新しく楽しい効果が見つかるのではない。ますますかけ離れた一連の像のうちに、可能なものと不可能なものとのあいだの、ひと目で分かる何かの関係を探すところに、それは見つかる。幻想劇は極度に誇張した奔放な空想である。だからこそ、奔放な空想の法則をあまり露骨に破ってはならない。"
  "translation_status": "reviewed"

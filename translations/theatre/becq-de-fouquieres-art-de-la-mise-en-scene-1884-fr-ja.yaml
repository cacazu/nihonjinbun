      "exact": "le Misanthrope"
- "id": "becq-0186"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il va de soi que l'idée qui se forme en nous des costumes d'une époque est d'autant plus générale qu'elle repose sur un plus grand nombre d'exemplaires pris, soit dans un même temps, soit dans des temps successifs. Cette idée, d'ailleurs, naît en nous, comme toute idée, par la réunion des caractères communs qui nous frappent dans ce grand nombre d'exemplaires. Il suit de là que l'idée que nous avons du style d'une époque, que nous avons traversée, est générale et non particulière, et que, lorsqu'il s'agit de mise en scène, nous devons réaliser dans la décoration, dans l'ameublement et dans les costumes cette idée générale qui est seule intelligible pour notre esprit et qui, seule, est pour nous la vérité. En outre, on peut remarquer que les idées particulières des contemporains, se changeant peu à peu en idées de plus en plus générales à mesure que leur point de départ s'enfonce dans les brumes du passé, il arrive un moment où elles se fixent dans des types généraux désormais invariables, au moins dans les prévisions actuelles, et auxquels nous devons rapporter tout ce que nous créons aujourd'hui dans le but de représenter telle ou telle époque passée. Ce sont donc, dans ce cas, ces types généraux et invariablement fixés dont le théâtre nous doit la représentation fidèle, puisque eux seuls répondent aux formes que le temps a imposées à nos idées. Il y a donc un degré d'exactitude au delà duquel la mise en scène deviendrait non seulement antithéàtrale, mais même antiartistique. Une pièce qu'on exhumerait au bout de cinquante ans, dans les mêmes décorations et avec les mêmes costumes qu'à sa première représentation, nous ferait l'effet d'une véritable caricature; car, en bien des points, elle pourrait se trouver en contradiction avec les types que le temps aurait formés dans notre esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 186
    "line_start": 2554
    "line_end": 2580
  "translation_ja": "ある時代の衣裳について私たちにできあがる考えは、同じ時点からであれ、次々に移る時代からであれ、取ってきた見本が多いほど、一般的なものになる。これは言うまでもない。またこの考えはほかの考えと同じく、多くの見本に共通して、私たちの目を引く特徴を集めることから生まれる。だから、私たちが経験した時代の様式について抱く考えは、個別的ではなく一般的である。演出では、装置、調度、衣裳に、この一般的な考えを実現しなければならない。私たちの精神に理解でき、それが真実であるのは、その考えだけだからだ。さらに、同時代の人々の個別的な考えは、その出発点が過去の霧に沈むにつれて、少しずつ、ますます一般的な考えに変わる。やがて、少なくとも今見通せるかぎりでは、もはや変わらない普遍的な類型に固定されるときが来る。過去のある時代を表すために今日作るものはすべて、その類型に結びつけなければならない。この場合、劇場が忠実に表すべきは、この普遍的で、変わらないものとして定まった類型である。時間が私たちの考えに与えた形に合うのは、それだけだからだ。だから、演劇にそぐわないばかりか、芸術にも反する水準まで、演出の正確さを上げてはならない。初演と同じ装置、同じ衣裳のまま、五十年たってから掘り起こした芝居は、私たちには本物の戯画に見えるだろう。時が心のうちに形づくってきた類型と、いくつもの点で矛盾するかもしれないからである。"
  "translation_status": "reviewed"
- "id": "becq-0187"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce qui précède nous amène donc à deux conséquences importantes. La première est que, lorsqu'une pièce a fourni sa carrière et qu'on n'en peut prévoir une reprise prochaine, il est désirable de détruire la mise en scène. C'est d'ailleurs, lorsqu'une pièce quitte l'affiche après avoir épuisé son succès, l'effet de l'usure naturelle des choses. On ne peut emmagasiner à l'infini des décors dont on ne prévoit pas l'utilité prochaine, et dont quelques-uns peuvent être fatigués et détériorés par l'usage. Il en est de même des costumes. La mise en scène se trouve donc détruite ipso facto. La seconde conséquence est que, lorsqu'on reprend une pièce depuis longtemps disparue de l'affiche, il n'y a pas lieu de reproduire identiquement la mise en scène primitive."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 187
    "line_start": 2582
    "line_end": 2592
  "translation_ja": "以上から、二つの大切なことが導かれる。第一に、芝居が一通りの上演を終え、近く再演される見込みがないなら、演出の装置や衣裳は解体しておくのが望ましい。芝居が人気を使いきって看板を下ろせば、物は自然に消耗する。だから、これはそもそも自然の成り行きである。近く使い道のない装置、なかには使用ですり減り、傷んでいるものもある装置を、いつまでも倉に入れておくことはできない。衣裳も同じだ。演出のしつらえは、それだけで消えてしまう。第二に、長く演目から消えていた芝居を再演するときは、初めの演出をそのまま再現する必要はない。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 576
      "end": 586
      "exact": "ipso facto"
- "id": "becq-0188"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sur le premier point, on pourrait s'imaginer que la règle ne s'impose point au répertoire classique, tragédies et comédies, que la mise en scène en est immuable et si bien établie qu'on n'y puisse espérer faire aucun changement. Ce serait une erreur de penser ainsi d'autant que, par suite de la révolution qui, vers la fin du siècle dernier, a modifié l'art des décorations et des costumes, la mise en scène de nos chefs-d'oeuvre classiques est toute moderne. Elle a pu varier et, en effet, elle a souvent varié et variera encore. S'il s'agit de pièces grecques ou romaines, il est d'ailleurs évident que le point de vue d'où on a successivement jugé l'antiquité s'est fréquemment déplacé, et que la même représentation ne pourrait satisfaire les spectateurs actuels, après avoir satisfait ceux des deux derniers siècles. Si donc il y a des traditions en ce qui concerne le jeu et la diction des acteurs, il n'en saurait être de même des décorations et des costumes. En outre, les changements d'acteurs finissent par nécessiter une nouvelle mise au point. Le goût du public, variable d'une génération à l'autre, se lasse peu à peu du même spectacle, et il lui semble, à tort ou à raison, qu'en introduisant quelque variété dans l'appareil théâtral, on pourra se rapprocher d'un idéal qu'en fait on n'atteint jamais."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 188
    "line_start": 2594
    "line_end": 2612
  "translation_ja": "第一の点について、悲劇や喜劇の古典の演目にはこの決まりは当てはまらず、その演出は変わらず、よく定まっていて、何一つ変えられる見込みはないと思うかもしれない。だが、そう考えるのは誤りである。そもそも前世紀の終わりごろ、装置と衣裳の技を大きく変えた革命があったために、私たちの古典の傑作の演出は、すっかり近代のものになっている。演出は変わりえたし、実際、たびたび変わってきて、これからも変わるだろう。ギリシアやローマの芝居なら、古代を判断する視点はたびたび変わってきた。過去二世紀の観客を満足させた上演が、今日の観客を同じように満足させられないのは明らかである。俳優の演技や台詞回しに伝統があるとしても、装置や衣裳に同じことは言えない。そのうえ俳優が交代すれば、やがてすり合わせをやり直さなければならない。世代ごとに変わる観客の好みは、同じ光景にだんだん飽きる。舞台のしつらえに何か変化を加えれば、実際にはけっして到達しない理想に近づけるのではないかと、当たっていようといまいと、思うのである。"
  "translation_status": "reviewed"
- "id": "becq-0189"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces diverses raisons font donc une loi de ne pas laisser les oeuvres classiques s'éterniser dans le même état représentatif. Après les avoir fait figurer un an ou deux au répertoire courant, il est bon de les démonter complètement pour la plupart, et d'attendre quelque temps avant d'en faire une reprise."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 189
    "line_start": 2614
    "line_end": 2618
  "translation_ja": "以上のいくつもの理由から、同じ上演のあり方のまま、古典をいつまでも舞台に置いてはならないという規則が出てくる。一年か二年、通常の演目に入れたあとは、大半の古典について、いったん装置をすべて撤去し、しばらく待ってから再演するほうがよい。"
  "translation_status": "reviewed"
- "id": "becq-0190"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "D'ailleurs le procédé qui consiste à renouveler, les rôles un à un, soit par le moyen de doublures, soit en utilisant les nouvelles acquisitions du théâtre, est utile s'il ne s'agit que de remédier à un accident imprévu ou de favoriser les débuts d'un acteur; mais en soi il est mauvais, parce qu'il porte le trouble dans un ensemble habilement combiné, et parce qu'il ne permet pas de plus larges corrections qu'autorise seule une nouvelle mise en scène. C'est ainsi qu'à l'heure actuelle il me paraît nécessaire de retirer Phèdre du répertoire de la Comédie-Française (nous en verrons plus loin les raisons), et d'attendre un certain temps avant d'en faire une reprise étudiée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 190
    "line_start": 2620
    "line_end": 2629
  "translation_ja": "また、代役を使ったり、劇団に入った新しい俳優を起用したりして、一役ずつ交代する手は、思わぬ事故を補ったり、俳優の初舞台を助けたりするだけなら、役立つ。だが、それ自体はよくない。巧みに組み上げた全体を乱し、新しい演出でしかできない、もっと広い修正を可能にしないからだ。たとえば現在、私はコメディ・フランセーズの演目から『フェードル』を外して、しばらく待ってから入念に再演する必要があると思う。理由はあとで見ることにする。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 525
      "end": 531
      "exact": "Phèdre"
- "id": "becq-0191"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "S'il s'agit, non plus de pièces grecques ou romaines, mais d'une oeuvre dramatique dont le sujet a été pris dans le monde contemporain de l'époque où elle a paru pour la première fois à la scène, il faut distinguer si l'oeuvre est ancienne ou moderne. Les pièces qui datent d'une époque de l'histoire pour laquelle le temps a fait son office, en créant des types généraux qui sont aujourd'hui à peu près fixes, sont plus faciles à monter parce que déjà ces types ont été réalisés sur la scène et que d'autres arts, la peinture, la gravure et la sculpture, en ont en quelque sorte vulgarisé la connaissance. On a vu cependant, par l'exemple que nous avons cité du Misanthrope, qu'il y a place, même dans ces cas-là, pour des écarts considérables."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 191
    "line_start": 2631
    "line_end": 2641
  "translation_ja": "ギリシアやローマの劇ではなく、初めて舞台に出た時代と同時代の世間から題材を取った戯曲を考えるなら、作品が古いか近代かを区別しなければならない。歴史のある時代について時がすでに役目を果たし、今日おおむね安定している普遍的な類型を作ったなら、その時代に出た芝居は上演しやすい。それらの類型は舞台ですでに形になっているうえ、絵画、版画、彫刻といったほかの芸術が、その知識を広めてきたからである。ただし、『人間嫌い』の例で述べたように、この場合でも、かなり大きなずれが生じる余地はある。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 663
      "end": 674
      "exact": "Misanthrope"
- "id": "becq-0192"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La difficulté est quelquefois plus grande pour des oeuvres modernes, dans lesquelles il faut précisément réaliser pour la première fois des types qui commencent à se former dans notre esprit, et dans lesquels il y a encore prédominance de traits particuliers, variables dans la mémoire de chacun de nous. Cette question a été justement agitée, récemment à propos de la reprise d'Antony. C'est le cas de remarquer combien il est heureux que toute mise en scène soit de sa nature destructible; car si par impossible on avait conservé celle d'Antony et qu'on nous l'eût remise aujourd'hui sous les yeux, on aurait pu sans doute espérer piquer jusqu'à un certain point la curiosité d'une partie du public, mais très certainement elle aurait produit un effet définitif désastreux et aurait été contre le but qu'on s'était proposé et qui ne pouvait être que celui de nous toucher et de nous émouvoir. Il nous aurait été impossible de prendre au sérieux une gravure de mode surannée; et le ridicule du spectacle aurait été en nous un obstacle insurmontable à l'épanouissement de la sympathie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 192
    "line_start": 2643
    "line_end": 2658
  "translation_ja": "近代の作品では、ときには上演がもっと難しい。ちょうど心のうちにできはじめた類型を、今初めて形にしなければならないが、その類型にはまだ、私たち一人ひとりの記憶によって変わる個別の特徴が優勢だからだ。近ごろ、『アントニー』の再演をめぐり、まさにこの問題が論じられた。ここで、すべての演出が性質上消えうることが、どんなに幸いかに気づく。もしありえないことだが、昔の『アントニー』の演出が残され、それを今日また目の前に出したなら、一部の観客の好奇心を多少くすぐれたかもしれない。だが最後にはきっと、悲惨な結果を生み、私たちの胸を打ち、感動させること以外にありえない目的に反しただろう。時代遅れの流行を描く版画を、まじめに受け取ることはできなかっただろう。舞台が滑稽であれば、私たちの内に共感が広がるうえで、乗り越えられない妨げになったはずだ。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 377
      "end": 385
      "exact": "d'Antony"
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 538

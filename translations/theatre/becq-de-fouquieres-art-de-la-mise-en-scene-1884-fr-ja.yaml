- "id": "becq-0163"
  "section_id": "ch19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est cette loi de proportion qui permet de simplifier le matériel figuratif, en ne se préoccupant que des principaux objets qui le composent et en traitant les autres beaucoup plus sommairement et même en les reléguant parmi la partie décorative. Ainsi, si quelques livres d'une bibliothèque sont destinés à jouer un rôle spécial, à être déplacés et replacés, ils devront réellement figurer sur un rayon, mais il ne sera pas nécessaire que les autres parties de la bibliothèque soient composées de livres véritables. Des dos de volumes peints sur des rayons également peints constitueront une imitation suffisante. C'est ce que beaucoup de spectateurs ont pu observer au second acte du Marquis de Villemer. Dans un trophée d'armes, toutes n'auront pas besoin d'être réelles, si toutes ne doivent pas éveiller une égale attention dans l'esprit du public."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 163
    "line_start": 2135
    "line_end": 2147
  "translation_ja": "比例の法則があれば、舞台上の実物を簡略にできる。その中でもっぱら主な物に気を配り、ほかはずっと大づかみに作り、ときには、描く装置のほうへ回すことすらできる。たとえば書棚の何冊かが特別の役を果たし、取り出されたり戻されたりするなら、その本は実際に棚の一段に置かなければならない。だが、書棚のほかの部分まで本物の本にする必要はない。絵に描いた棚に、本の背を描くだけで、写しとしては十分である。多くの観客は『ヴィルメール侯爵』の第二幕で、これを見られたはずだ。飾りの武具も、その全部が観客の精神に同じだけの注意を起こさなくてよいなら、全部を本物にする必要はない。"
  "translation_status": "reviewed"

    "line_start": 3632
    "line_end": 3658
  "translation_ja": "アガメムノンの衣装に求められる変更は、いっそう重要である。第一幕では今着ているものを認め、そのままにしてよい。夜であり、ギリシアの陣営は寝静まっている。ただアガメムノンだけが天幕で眠れず、目を覚ましている。胸甲をほどき、兜と武具を置いている。兵士たちの目から離れ、再び父親に戻り、心に起こる情け深い気持ちに身を委ねる。だが第二幕では夜が明けた。アガメムノンは軍勢の前に現れる。ギリシア人に王の中の王と呼ばれる者にふさわしい、堂々たる装いでなければならない。脚には銀の留め具で留めた見事なすね当てを巻く。胸は金と磨いた鋼を交互に並べた金属板の胸甲で覆う。青い三匹の竜が襟まで放射状に伸びる。金の鋲がきらめく剣は銀の鞘に収まり、金糸を織り込んだ剣帯に支えられる。額を覆う兜はきらきらと輝き、四つのとさかから豊かな馬のたてがみが流れ、頂の羽飾りは恐ろしげに波打つ。肩には王者の紫の外套がひるがえる。これがギリシアの総大将が観客の前に姿を現すべき、ホメロスにふさわしい衣装である。この豪華で威厳ある衣装は、アキレウスの衣装の若々しすぎる輝きをほどよく抑えるだろう。二人の英雄が相まみえる第四幕の見事な場面では、『イリアス』にふさわしい一場を目にすることになる。家庭の争いという紛らわしい表面の下から、戦士どうしの対抗心が現れる。トロイアの城壁の下で長く続くギリシア勢の不和の前触れだ。この堂々たる装いで俳優の悲劇を演じる才はいっそう高められ、観客はアガメムノンの底のない野心と、抑えがたい傲慢さを、感じるべきところで感じ取ることになる。"
  "translation_status": "reviewed"

    "kind": "emphasis"
    "span":
      "start": 969
      "end": 980
      "exact": "l'Ami Fritz"
- "id": "becq-0400"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bien différente et moins justifiable serait l'intervention d'une cause objective, si celle-ci était une cause première, si, par exemple, le caractère de la décoration devait peser sur la résolution du personnage dramatique. Cela ne pourrait se tenter qu'en rentrant habilement dans les lois les plus certaines de la mise en scène, c'est-à-dire en agissant préalablement sur le spectateur, en concevant une décoration capable, par la grandeur, la hauteur et la profondeur de la scène, ainsi que par des effets d'ombre ou de lumière, de faire naître une impression morale, que le spectateur transporterait alors dans le personnage. Un pareil effet est toujours aléatoire, puisqu'il dépend des dispositions du public et de l'imagination des spectateurs. C'est sur la scène de l'Opéra qu'on pourrait et qu'on a pu employer ce procédé avec quelque sécurité, parce que là, la puissance de la musique sur l'inclination morale du spectateur vient en aide à la puissance pittoresque de la décoration. Ce serait donc s'exposer à de graves mécomptes que de vouloir élever le pittoresque de la décoration à l'état de ressort dramatique, ou autrement, de regarder le pittoresque comme une cause finale suffisante de l'évolution dramatique. Il ne peut en être qu'une des causes formelles. Nous aboutissons donc, pour l'ensemble décoratif, à la même loi que pour tout objet considéré dans son influence éventuelle sur la marche du drame."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 400
    "line_start": 6058
    "line_end": 6078
  "translation_ja": "外からの原因が第一の原因だった場合、たとえば装置の性格が人物の決断を左右しなければならない場合には、その介入はかなり異なり、正当化しにくい。試みるなら、演出の最も確かな法則に巧みに立ち戻るしかない。前もって観客に働きかけ、舞台の広さ、高さ、奥行きと、影や光の効果によって心の印象を生む装置を考える。そして観客がその印象を人物の中へ移すのである。こんな効果はいつも不確かだ。観客全体の気分と一人ひとりの想像力に頼るからである。オペラの舞台なら、ある程度安心してこの手法を使えるし、使われてもきた。装置の絵になる力を、音楽が観客の心の傾きに働く力が助けるからだ。だから装置の絵になるところを劇の仕掛けに高めようとすること、言い換えれば劇の展開の十分な目的因と見なすことは、大きな期待外れを招く。形相因の一つにしかなれない。したがって装置全体についても、劇の進行に影響しうる一つ一つの物と、同じ法則に行き着く。"
  "translation_status": "reviewed"
- "id": "becq-0401"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est certain que, dans toute conception poétique, le monde extérieur, réduit au milieu immédiat où s'agitent les personnages, fournit ou peut fournir incessamment à ceux-ci les causes formelles de leur langage. La mise en scène peut-elle nourrir l'ambition réaliste de rendre visible au spectateur tout ce qui, dans le milieu objectif, joue le rôle d'une cause formelle? C'est le dernier refuge de l'école nouvelle. Pour éclaircir cette question, prenons un exemple. Au troisième acte de Il ne faut jurer de rien, le décor, à la Comédie-Française, représente un bois sombre et sauvage. Les arbres qui montent jusqu'aux frises dérobent au spectateur la vue du ciel. C'est une belle solitude nocturne. Voyons maintenant la mise en scène imaginée par le poète. C'est un soir d'été. Après une chaude journée, l'orage à éclaté. Quand Van Buck et son neveu arrivent près du lieu où doit se rendre Cécile, Valentin, en quelques mots, esquisse la mise en scène: «La lune se lève et l'orage passe. Voyez ces perles sur les feuilles, comme ce vent tiède les fait rouler.» Enfin, dans la clairière où se rencontrent Valentin et Cécile, la mise en scène est conditionnée par le texte: «Venez là, où la lune éclaire...--Non, venez là, où il fait sombre; là, sous l'ombre de ces bouleaux... Y a-t-il longtemps que vous m'attendez?--Depuis que la lune est dans le ciel... Viens sur mon coeur; que le tien le sente battre, et que ce beau ciel les emporte à Dieu... Voyons, savez-vous ce que c'est que cela?--Quoi? cette étoile à droite de cet arbre?--Non, celle-là qui se montre à peine et qui brille comme une larme...» Toute cette scène, comme on le voit, est fortement empreinte d'un naturalisme plein de mélancolie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 401
    "line_start": 6080
    "line_end": 6104
  "translation_ja": "どの詩的な構想でも、人物が動き回るすぐ近くまでを切り出した外界は、たえず人物に言葉の形相因を与えるか、与えうる。それは確かである。外から来る環境の中で形相因の役を果たすものを、演出はすべて観客の目に見せようと望んでよいのだろうか。それが新しい流派の最後のよりどころだ。例を取ろう。『決して誓うな』の第三幕で、コメディ・フランセーズの装置は、暗く荒れた森を表している。上の飾り幕まで伸びる木々が観客の視線から空を奪う。美しい、夜の人けのない場所である。一方、作者が思い描いた演出を見よう。夏の夕べ。暑い一日のあと、嵐が起こった。ヴァン・バックと甥が、セシルが来ることになっている場所の近くに着くと、ヴァランタンが二言三言で場を描く。「月が昇って、嵐は過ぎてゆく。木の葉の真珠を見てください。生ぬるい風にころがっていく」。やがてヴァランタンとセシルが出会う林の空き地では、台詞が演出をしばる。「いらっしゃい、月の光の当たるところへ……」「いいえ、暗いところへ来て。この白樺の陰へ……ずっと待っていらしたの？」「月が空に出てからずっと……僕の胸においで。君の胸に鼓動が伝わって、この美しい空が二つの心を神のもとへ運ぶように……ほら、あれが何かご存じですか？」「何です、この木の右の星？」「いいえ、かすかに顔を出して、涙のように輝いているあれです……」。見てのとおり、この場面には憂いに満ちた自然主義が濃い。"
  "translation_status": "reviewed"

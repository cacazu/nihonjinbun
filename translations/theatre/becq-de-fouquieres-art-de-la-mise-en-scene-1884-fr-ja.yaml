- "id": "becq-0225"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si l'architecture me paraît heureusement appropriée, je ne saurais en dire autant de la toile du fond, qui, en définitive, représente l'acropole d'Athènes, ou une colline sainte qui lui ressemble à s'y méprendre. Trézène, comme toutes les villes grecques, avait son acropole bâtie sur une éminence qui dominait la ville. Le décor n'est donc pas fautif en soi, mais il peut dérouter le spectateur en éveillant dans son imagination le souvenir de l'acropole par excellence, qui est celle d'Athènes. Sans doute le lieu de l'action est clairement indiqué dès le début de la tragédie:"

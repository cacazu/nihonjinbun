    "line_start": 3024
    "line_end": 3071
  "translation_ja": "古代の劇場の仕組みについて、私たちの知識はかなりおぼろげである。それでも、古代の舞台美術や俳優の衣装は、ある部分は空想で、ある部分は儀礼で決まっていたと分かる。私たちが土地の色合いや歴史への忠実さと呼ぶものには、古代人はまったく関心を持たなかった。そもそも彼らの悲劇の人物は、伝説と叙事詩の過去にしか属さず、実際には想像力が生んだものだった。それ以外でありえただろうか。芸術は遊びであるところにまさに特色があり、それゆえ私たちの暮らしを魅了し、美しくする値打ちがある。今日も悲劇に登場するその同じ人物に、もともと持ち合わせなかった歴史上の実在感が、いったいどうして備わって見えるのだろう。私たちをまどわせるのは、俳優が自分の体を貸して形を与える情熱の真実と力である。そのことは芸術の大きな誉れにほかならない。だから間違えてはいけない。こうした悲劇の人物にぴったり対応する歴史上の環境は、今もなければ、かつてもなかった。演出を組み立てるのは、実際にあったものでなく、ありえたものでもなく、私たちの想像の中で古代世界を形づくるイメージである。どんな方針を取り、どれほど学術的な、考古学的な研究を案内にしようとも、まったく詩的な創造から生まれた人物が出る私たちの舞台が、本物の古代生活を見せてくれることはない。ホメロスやアイスキュロスが描いた英雄たちが、ある現代の学者が熱烈な信念をもってミュケナイやトロイで遺骸を掘り出す実在の人々に、似ていたためしがないのと同じことだ。ソポクレスと同時代のギリシア人なら、今コメディ・フランセーズで上演される『オイディプス王』を見ても、自分たちの最も偉大な詩人の悲劇とは、きっと気づかないだろう。翻訳はできるかぎり忠実であり、演出も申し分のない趣味で整えられているのだが。英雄や王たちが悲劇の厚底靴から降り、アテナイの商人ほどの背丈になっているのを見て、また、仮面もつけず、あれほど素朴で音楽性のない話し方をするのを聞いて、ギリシア人は衝撃を受けるだろう。合唱隊については、詩の韻律に合わない音楽に乗せて詩節を朗唱させるとは、どうしてそこまで趣味を誤れるのかと問うだろう。ギリシア人は自分たちの古代について、私たちが形づくるのとはまったく別のイメージを持ち、悲劇芸術についても、ずいぶん違う考えを抱いていたのである。彼ら自身が今や古代の人になったからこそ、私たちは彼らに関心を持つ。はるかに隔たった場所から見ているので、私たちは彼らを、彼らの英雄や神々とさえ、つい混同する。神話と英雄と歴史からなるこの世界が、舞台美術としては、私たち自身の想像の中にしかないことを、よく示している。それでも、ギリシア悲劇とフランス悲劇が、両国の演劇を特徴づける同じ根本原則に従っていることに、変わりはない。事実よりも着想が、物理的な行為よりも内面の展開が、つねに優先する、という原則である。"
  "translation_status": "reviewed"

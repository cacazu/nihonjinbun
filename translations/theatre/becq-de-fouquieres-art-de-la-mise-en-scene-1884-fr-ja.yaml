      "exact": "le Roi s'amuse"
- "id": "becq-0131"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans tous les drames de Victor Hugo, l'imagination est tellement instante et puissante, à tous les moments de l'action, qu'un jour, fait inouï dans les annales dramatiques, dans un tableau qui ouvre un des actes de Quatre-Vingt-Treize, le poète a soudain supprimé décors et acteurs, et, sans autre intermédiaire que l'orchestre et des comparses derrière la toile baissée, a fait assister toute une salle de théâtre à un drame sanglant, faisant ainsi passer directement de son imagination dans celle du spectateur une série d'images émouvantes, sans l'interposition nécessaire d'images sensibles et réelles. Quand je dis toute la salle, je me trompe, car tandis qu'une partie de l'orchestre s'associait à l'émotion esthétique du poète, des hauteurs du théâtre on réclamait à grands cris le lever du rideau. Là haut, ils voulaient voir ce qui n'existait pas, et ils réclamaient la vue directe d'un drame dont leur imagination était incapable de leur fournir une image subjective! Il leur aurait tout au moins fallu le récit classique que justifie donc, dans certains cas, le procédé du maître moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 131
    "line_start": 1639
    "line_end": 1654
  "translation_ja": "ヴィクトル・ユゴーの劇では、筋のあらゆる瞬間に、想像力がひしひしと迫り、力強く働く。あるとき、『九十三年』のある幕を開く場面で、この作家は急に装置も俳優も引っ込めた。演劇史にも聞いたことのない出来事である。演奏する楽団と、下ろした幕の奥の端役だけを介して、劇場一杯の観客に血なまぐさい劇に立ち会わせた。こうして感覚に直接訴える実物のイメージを必要とせず、心を揺さぶる一連のイメージを、自分の想像力から観客の想像力へ直接渡したのである。いや、劇場一杯と言っては言いすぎだ。階下の席にいた観客の一部が作家の美的な感動を分かち合うかたわら、上の階からは、幕を上げろという大声が飛んでいた。上の階の客は、そこに存在しないものを見たかったのであり、自分の想像力で心の中に描き出せない劇を、直接目で見せろと求めたのだ。せめて古典劇にあるような語りが、彼らには必要だったのだろう。この現代の大家の工夫そのものが、場合によっては古典劇の語りの意味を証明しているわけだ。"
  "translation_status": "reviewed"
  "annotations":

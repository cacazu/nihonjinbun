- "id": "becq-0179"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quelle que soit la prédilection que j'éprouve personnellement pour Racine, je ne crois cependant pas que l'on puisse dire que Corneille et Racine aient été de plus grands poètes que Victor Hugo. Si donc ce n'est pas dans l'inégalité de leur génie poétique que gît la différence de vitalité de leurs oeuvres dramatiques, il faut en faire remonter la cause à un excès de richesse dans l'imagination de Victor Hugo, qui l'a entraîné à un abus perpétuel d'effets uniquement représentatifs et à une recherche purement épique du pittoresque et de la couleur locale. Dans les préfaces ou les notes qui accompagnent ses pièces imprimées, Victor Hugo se fait un mérite d'avoir puisé une foule de traits particuliers, peu connus, dans tel ou tel auteur espagnol ou anglais; ce serait, en effet, un mérite pour un historien, mais ce n'en est pas un pour un poète dramatique. Ce que celui-ci doit au public, ce sont des êtres purement humains, uniquement revêtus, s'ils sont étrangers, de traits généraux suffisants à les faire reconnaître pour tels. Ajoutons d'ailleurs, pour être juste, qu'une aussi vaste imagination, nuisible au poète dramatique, est l'essence même du génie du poète épique; et Victor Hugo en est encore ici un illustre exemple, car le livre de la Légende des siècles est un chef-d'oeuvre, auquel rien ne peut être comparé dans la littérature française non plus que dans les littératures étrangères."
  "source_languages":
  - "fr"
  "source_locations":

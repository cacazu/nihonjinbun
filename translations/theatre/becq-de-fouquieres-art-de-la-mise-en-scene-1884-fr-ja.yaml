    "line_start": 4527
    "line_end": 4538
  "translation_ja": "別の観点から言えば、舞台では、子が親に向ける情を表すような特別な場合を除いて、口づけは女がするか、女が受けるのでなければ許されない、ともいえる。ふつう俳優は形だけにしておくべきだ。『フィガロの結婚』を見れば、どこから品位が傷つくかが分かりやすい。第5幕で、ケルビーノがスザンナだと思ってアルマヴィーヴァ伯爵に口づけするとき、自分がどう受け取ったかをよく考える観客なら、ケルビーノ役が男であれば、実際に口づけするのは不快に映ると気づくだろう。だがそう映らないのは、小姓の顔つきと衣裳の下にいるのは女で、その女が伯爵役の俳優に口づけしていると観客は知っているからだ。"
  "translation_status": "reviewed"
  "annotations":

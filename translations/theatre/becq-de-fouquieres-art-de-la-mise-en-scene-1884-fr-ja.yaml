- "id": "becq-0263"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nos salles de spectacle sont extrêmement défectueuses. Les théâtres des anciens leur étaient sans doute inférieurs sous le rapport de l'acoustique, mais ils étaient construits dans des conditions optiques très supérieures, attendu que le centre de convergence optique coïncidait presque avec le centre de figure. Dans nos théâtres, si tous les spectateurs étaient assis et dirigeaient leurs regards, comme cela serait désirable, normalement aux courbes parallèles des galeries et des loges, il y aurait un grand nombre d'entre eux qui n'apercevraient même pas la scène. Si l'on suppose une ligne horizontale, perpendiculaire à la rampe et passant par le trou du souffleur, et si l'on mène, par supposition, un plan vertical passant par ce grand axe du théâtre, ce plan sera dit le plan de symétrie optique. C'est sur ce plan que se trouveront les points d'intersection des regards des spectateurs de droite et de gauche, tandis que les regards des spectateurs faisant face à la scène lui seront parallèles. Mais en fait une partie des spectateurs prend une position oblique et tous ceux qui occupent le second rang des loges sont obligés de se lever et de se pencher d'une façon très sensible et très fatigante. Il est impossible que la mise en scène ne tienne pas compte de la disposition de nos salles de théâtre et des conditions optiques défectueuses dans lesquelles sont placés les spectateurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 263
    "line_start": 3673
    "line_end": 3693
  "translation_ja": "私たちの劇場の客席には、大きな欠陥がある。古代の劇場は、音響の面ではたしかに劣っていたが、見え方ではずっと優れた条件で造られていた。視線が集まる中心が、形の上での中心とほぼ一致したからである。私たちの劇場では、全員が座り、望ましいことだが、上階席や桟敷席をなす平行な曲線に直角に視線を向けたら、舞台さえ見えなくなる観客が大勢出る。舞台前縁の脚光に直角で、プロンプターの開口部を通る水平線を考え、その劇場の主軸を通る鉛直面を想定しよう。これを視線の対称面と呼ぶ。左右の観客の視線が交差する点は、この面に来る。一方、正面の観客の視線は面と平行である。だが実際には、観客の一部は体を斜めにし、桟敷席の二列目の人はみな、立ち上がって大きく身を乗り出さなければならず、たいへん疲れる。私たちの客席の造りと、観客の置かれる見え方の悪い条件を、演出で考えに入れないわけにはいかない。"
  "translation_status": "reviewed"
- "id": "becq-0264"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La scène est un trapèze à peu près invariable dans le sens de la largeur, mais très variable dans le sens de la hauteur et de la profondeur. A gauche et à droite sont deux zones, qui sont plus ou moins invisibles, celle de gauche à un certain nombre de spectateurs placés du côté gauche, celle de droite à un certain nombre de spectateurs placés du côté droit. Ce qui diminue toutefois un peu l'étendue de ces zones, c'est l'obliquité qu'on donne aux décors et le fréquent usage des pans coupés. Le point de l'axe du théâtre situé devant le trou du souffleur est par excellence le point de convergence optique. Quant aux spectateurs placés de face, ils échappent aux conditions médiocres ou mauvaises dont se plaignent ceux de gauche ou de droite. Pour eux toutefois le point de convergence optique représente encore une moyenne de distance et d'obliquité. Ces dispositions étant reconnues, supposons qu'un acteur, placé au point de convergence optique, s'éloigne dans le sens de l'axe du théâtre: chaque pas l'éloignera des spectateurs et le soustraira de plus en plus à la lumière de la rampe; si, au contraire, il marche, soit à gauche, soit à droite, parallèlement à la rampe, à mesure qu'il s'avancera il se soustraira aux regards d'un nombre toujours croissant de spectateurs, selon qu'il se rapprochera de la zone invisible de gauche ou de droite; s'il s'éloigne obliquement, les deux effets se composeront. Tous les jeux de scène qui auront lieu sur un même plan parallèle à la rampe seront pareillement éclairés, tandis que ceux qui auront lieu sur des plans de plus en plus reculés recevront une lumière proportionnellement dégradée, ou passeront de la lumière de la rampe, qui les éclaire de bas en haut, sous une gerbe de lumière tombant du cintre sous un angle de 45 degrés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 264
    "line_start": 3695
    "line_end": 3720
  "translation_ja": "舞台は台形である。幅はほとんど変わらないが、高さと奥行きは大きく変わる。左右には、程度の差こそあれ見えない領域が二つある。左の領域は左側に座る一部の観客に、右の領域は右側に座る一部の観客に見えない。ただし装置を斜めに置き、角を落とした面をよく使うので、この領域はいくらか狭くなる。劇場の主軸の上で、プロンプターの開口部の手前にある点は、視線の集まる最も肝心な点だ。正面に座る観客は、左右の観客が不満に思う見え方の悪さを免れる。ただ、彼らにとっても視線が集まるその点は、距離と見る角度の両面で中間の位置に当たる。以上の配置を踏まえ、視線が集まる点に立つ俳優が、劇場の主軸に沿って奥へ行くとしよう。一歩ごとに観客から遠ざかり、脚光もますます当たらなくなる。反対に、左か右へ脚光と平行に歩くなら、同じ側の見えない領域に近づくにつれ、より多くの観客から見えなくなる。斜めに遠ざかれば、二つの作用が重なる。脚光と平行で同じ奥行きで行われる動きには、等しく光が当たる。それより奥で行われる動きには、遠さに応じて弱くなった光が届くか、下から照らす脚光の光を離れ、舞台上部から45度の角度で降り注ぐ光に入る。"
  "translation_status": "reviewed"
- "id": "becq-0265"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il résulte donc des dispositions de la scène et des effets qui en sont la conséquence que la mise en scène doit établir un rapport de valeur entre l'importance d'un jeu de scène et l'endroit du théâtre où il faut l'exécuter, et que dans une scène, et par suite dans un acte, les positions relatives des personnages sont liées à l'importance qu'ils prennent alternativement dans le développement de l'action. Dans la plupart des cas, l'intuition, le goût, l'habitude suffisent pour décider si telle ou telle disposition fait bien ou mal; mais souvent la question mériterait d'être étudiée et soumise au raisonnement. Pour abréger, je donnerai à la ligne de convergence optique le nom plus court de ligne optique. Quant au point de convergence optique, c'est un point mathématique situé à l'intersection de l'axe du théâtre et d'une ligne perpendiculaire à cet axe, passant devant le trou du souffleur. Ce point est le centre d'un cercle, auquel je donnerai le nom de lieu optique, qui a à peu près pour diamètre le tiers de la largeur de la scène, et dont tous les points également éclairés sont facilement accessibles aux regards de tous les spectateurs. C'est le lieu scénique par excellence, d'où l'acteur tient le public sous son empire et d'où sa voix porte sans effort jusque dans les profondeurs de la salle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 265
    "line_start": 3722
    "line_end": 3740
  "translation_ja": "したがって、舞台の造りとそこから生じる効果を考えると、演出では、ある動きの重要さと、その動きを行う場所の効果の大きさを釣り合わせなければならない。一つの場面、ひいては一つの幕の中で人物どうしがどこにいるかは、筋が展開するにつれ、誰がどの時点で重要になるかに結びついている。たいていの場合、直感や趣味、慣れだけで、配置の良し悪しは決められる。だがしばしば、この問題は調べて筋道立てて考えるだけの値打ちがある。簡単のため、視線の収束線を短く「視線基準線」と呼ぶことにしよう。視線の収束点は、劇場の主軸と、その軸に垂直でプロンプターの開口部の手前を通る線とが交わる、数学上の一点である。この点を中心とする円を「視線の集中域」と呼ぶ。直径は舞台の幅のおよそ三分の一で、その中のどこも同じように照らされ、どの観客からも楽に見える。ここは何よりも舞台らしい場所である。俳優はここから観客の心をとらえ、声は無理なく、客席のいちばん奥まで届く。"
  "translation_status": "reviewed"
- "id": "becq-0266"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Posons maintenant quelques principes généraux de statique théâtrale. Dans toute péripétie ou dans tout dénouement, le personnage en qui se résume l'intérêt doit être placé dans le lieu optique, le plus près possible du centre optique, ou tout au moins sur la ligne optique si l'action l'exige. Ainsi, dans le dénouement de l'Aventurière, Clorinde est sur la ligne optique, tandis que les autres personnages sont placés à droite et à gauche de la porte par laquelle elle va sortir. Au deuxième acte du Misanthrope, dans la scène des portraits, Célimène occupe le centre optique; mais au dénouement, au cinquième acte, c'est Alceste qui prend cette place, tandis que Célimène est à gauche, correspondant au groupe de Philinte et d'Eliante qui occupe la droite. Dans l'Ami Fritz, c'est sur la ligne optique que Sûzel vient se jeter dans les bras de Fritz. Dans les Rantzau, les deux frères vont au-devant l'un de l'autre et s'embrassent au centre optique. C'est encore sur la ligne optique que les soldats déposent le lit de Mithridate mourant, etc."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 266
    "line_start": 3742
    "line_end": 3757
  "translation_ja": "さて、舞台配置の静力学について、いくつか一般原則を立てよう。筋が急転するところでも、結末でも、関心のすべてが集まる人物は、視線の集中域、なるべく視線の中心に近いところに置く。筋の都合があれば、少なくとも視線基準線の上に置く。たとえば『冒険女』の結末では、クロランドが視線基準線に立ち、ほかの人物は、彼女が出ていく扉の左右に並ぶ。『人間嫌い』の第二幕、人物評の場面では、セリメーヌが視線の中心を占める。だが第五幕の結末では、そこに立つのはアルセストであり、セリメーヌは左にいて、右のフィラントとエリアントの一組と釣り合う。『友人フリッツ』では、視線基準線の上で、シュゼルがフリッツの腕の中へ飛び込む。『ランツァウ家の人々』では、二人の兄弟が互いに向かって進み出て、視線の中心で抱き合う。兵士たちが死にゆくミトリダートの寝台を降ろすのも、視線基準線の上である。このほかにも例はある。"
  "translation_status": "reviewed"

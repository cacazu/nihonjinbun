- "id": "becq-0160"
  "section_id": "ch19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Après avoir établi les lois générales de la mise en scène, nous avons, dans les chapitres précédents, examiné les causes diverses qui peuvent les infléchir. Nous avons vu que toutes ces déviations, quelle qu'en fût l'importance, dérivaient de principes esthétiques, et qu'elles étaient en réalité comme les résultantes de plusieurs forces composées. Pour les légitimer, on ne peut jamais invoquer le caprice et le goût de l'art pour l'art. La mise en scène n'a pas sa fin en elle-même; la cause finale du drame est la cause formelle de la mise en scène. En partant du texte d'une oeuvre dramatique, on arrive aisément à établir le minimum de mise en scène nécessaire. Mais, quand on veut tenir compte de toutes les conditions de nature, de genre, d'époque et de milieu, qui peuvent entraîner à de larges accroissements de mise en scène, tant sous le rapport du personnel que sous celui du matériel figuratif, on peut légitimement se demander s'il n'y a pas des lois qui imposent une limite à cette extension; si, en d'autres termes, il n'y a pas, dans chaque cas, un maximum de mise en scène qu'il n'est pas permis artistiquement de dépasser. On sent combien serait salutaire l'application de telles lois somptuaires, à une époque où le luxe de la mise en scène atteint des proportions véritablement ruineuses. Or, ces lois semblent en effet exister. Il en est deux surtout qu'il paraît facile d'établir théoriquement et qu'observent d'ailleurs, par une intuition très sûre, les théâtres encore soucieux de la question artistique. Ces deux lois essentielles sont: la première, la loi de proportion, que nous étudierons dans le présent chapitre; la seconde, la loi d'apparence, dont nous réservons l'examen au chapitre suivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 160
    "line_start": 2058
    "line_end": 2082
  "translation_ja": "演出の一般法則を立てたあと、前の諸章では、それらを曲げうるさまざまな原因を検討した。どの程度の逸脱であろうと、それらはすべて美学上の原則から導かれ、実際にはいくつもの力が合わさった結果のようなものだと分かった。逸脱を正当化するのに、気まぐれや、芸術のための芸術を好む心を、持ち出せるはずがない。演出はそれ自体を目的にしない。戯曲が何のためにあるかという目的因こそ、演出を形づくる形相因なのである。戯曲の本文から出発すれば、必要な演出の最小限はたやすく定められる。だが、作品の性質、ジャンル、時代、環境といった条件をすべて考えに入れれば、演出は出演者の面でも舞台上の実物の面でも、大幅にふくらみうる。この拡大に歯止めをかける法則があるのではないか、言い換えれば、場合ごとに、芸術として越えてはならない演出の上限があるのではないか、と問うのはもっともだ。演出のぜいたくが本当に破滅的な規模に達した時代に、このような奢侈を戒める法則を適用すれば、どれほど有益かは感じ取れる。実際、この法則はあるようだ。とりわけ二つは理論的に立てやすいと思われるし、なお芸術上の問題を気にかける劇場では、確かな直感にもとづいて守られている。その二つの重要な法則とは、第一に、本章で調べる比例の法則であり、第二に、次章で検討する見かけの法則である。"
  "translation_status": "reviewed"
- "id": "becq-0161"
  "section_id": "ch19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous regardons d'abord avec attention un paysage, nous nous apercevrons que la distance a pour effet, dans la nature, de rendre de moins en moins visibles les nombreux détails de chaque objet et d'éteindre de plus eu plus l'éclat de leurs couleurs par l'épaississement progressif de la couche d'atmosphère; si ensuite nous examinons un tableau, nous verrons que les peintres produisent l'illusion de l'éloignement, d'une part, par l'effacement des traits particuliers, et, d'autre part, par la dégradation des tons. Mais, si nous transportions cette loi telle quelle dans la mise en scène, elle ne s'appliquerait qu'aux décorations, où elle est en effet très habilement observée par les peintres qui cultivent cette branche de l'art. Pour en faire utilement l'application à la mise en scène, il est nécessaire de la transformer. Nous ne considérerons plus, comme dans la peinture, des plans de distance, mais des plans d'importance scénique. Et nous dirons que, dans la mise en scène, le fini et la perfection d'imitation des objets qui composent le matériel figuratif doivent être proportionnels à leur importance hiérarchique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 161
    "line_start": 2084
    "line_end": 2100
  "translation_ja": "まず風景にじっと見入ると、自然の中では、遠ければ遠いほど一つひとつの物の数々の細部が見えなくなり、間にある空気の層がしだいに厚くなるため、色の輝きも薄れていくと分かる。次に絵を眺めると、画家が遠さの錯覚を、一方では個々の特徴をぼかすことによって、もう一方では色調をしだいに弱めることで作ると分かる。しかし、この法則をそのまま演出に移したら、装置にしか当てはまらない。この分野の画家たちは、実際巧みにその法則を守っている。演出にこれを役立てるには、形を変える必要がある。絵画のように遠近の段階を考えるのではなく、舞台上の重要度の段階を考える。すなわち、演出においては、舞台上の実物をなす品々の仕上がりの細やかさと模倣の完全さは、それぞれが占める重要度に比例すべきなのである。"
  "translation_status": "reviewed"
- "id": "becq-0162"
  "section_id": "ch19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je prendrai un exemple dans l'Ami Fritz. Le repas que l'on sert au premier acte nécessite un grand nombre d'accessoires, qui ont chacun une certaine importance, les uns parce qu'ils ont un rapport avec le texte, les autres parce qu'ils servent à des combinaisons scéniques. Il faut donc observer la loi de proportion. La nappe, sur laquelle l'attention des spectateurs est formellement appelée, doit être d'une imitation beaucoup plus parfaite que les autres parties du service. Les détails du repas ne doivent pas être traités tous avec le même soin, ni atteindre le même degré de fini, car ils ne sont pas tous destinés à faire également illusion. La fumée qui s'échappe de la soupière répond par la perfection d'imitation au jeu de scène qui ouvre le repas et sur lequel l'attention du spectateur est appelée et maintenue pendant un certain temps. Mais, après la soupe, toute la suite du repas est composée d'accessoires de théâtre, qui sont bientôt relégués au deuxième et troisième plan d'importance par la marche de l'action théâtrale. Si nous nous transportons dans un autre théâtre, à la Gaîté, par exemple, nous verrons qu'au premier tableau de la Charbonnière, pièce dans laquelle la mise en scène occupait le premier rang, la loi de proportion était cependant observée et exactement de la même façon, dans la disposition du banquet des fiançailles. La règle est générale et on en trouvera l'application dans toute mise en scène bien conçue. C'est ainsi que sont réglés le repas de don César au quatrième acte de Ruy Blas, celui d'Annibal et de Fabrice dans l'Aventurière, et celui de l'oncle et du neveu dans Il ne faut jurer de rien. Si j'ai choisi comme exemple un repas de théâtre, c'est que la mise en scène en est toujours périlleuse. Il ne faut insister que sur les détails qui ont un lien étroit avec l'action; dès que l'attention du public se détourne vers quelque autre objet, il faut que le repas s'efface et prenne fin. D'ailleurs l'observation du temps exact n'est jamais nécessaire au théâtre. Comme dans la vie réelle, le spectateur perd la notion du temps dès que son attention est détournée; il perd alors de vue ce concept abstrait pour lequel il ne possède pas d'unité de mesure absolue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 162
    "line_start": 2102
    "line_end": 2133
  "translation_ja": "『友人フリッツ』から例を取ろう。第一幕で出す食事には、小道具が数多く必要で、それぞれいくらかの重みがある。あるものは台詞に関わるからであり、別のものは舞台上の動きの組み合わせに使うからだ。だから、比例の法則を守らなければならない。観客には特に敷布に注意が向けられているので、敷布は食卓のほかの品より、はるかに本物らしく作らなければならない。食事の細部を何もかも同じだけ入念に作り、同じ程度まで仕上げるべきではない。どれも同じように、本物と思わせるためにあるわけではないからだ。スープ鉢から立つ湯気は、食事の初めの舞台上の動きにふさわしく、本物さながらに表されている。そこに観客の注意が向き、しばらくとどまるのである。しかしスープのあと、残りの食事は舞台用の小道具ばかりで、それらは劇の進行につれ、まもなく重要度の第二、第三の段階に退く。たとえばゲテ座という別の劇場に足を運べば、演出が第一の地位を占める芝居『炭焼き女』の第一景でも、婚約の祝宴のしつらえに、やはり比例の法則がまったく同じ仕方で守られていると分かる。これは一般的な決まりであり、よく練られたあらゆる演出に見つかる。『リュイ・ブラース』第四幕のドン・セザールの食事、『冒険女』のアンニバルとファブリスの食事、『決して誓うな』の叔父と甥の食事も、このように整えられている。舞台の食事を例に選んだのは、その演出がいつでも失敗しやすいからである。劇の進行と密接なつながりをもつ細部だけを強調すべきであり、観客の注意がほかのものへ向かったら、食事は引っ込み、終わらなければならない。そもそも劇場では、実際にかかる時間を厳密に守る必要はない。現実の生活と同様、注意がそらされれば、観客は時間の感覚を失う。時間とは、絶対的な尺度を持ち合わせない抽象的な概念であり、注意がそれると、その概念から目を離してしまうのである。"

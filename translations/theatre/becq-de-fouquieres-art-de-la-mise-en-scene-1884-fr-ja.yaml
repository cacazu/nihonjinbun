  "translation_ja": "ヴィクトル・ユゴーは早くから、音楽が演劇で果たすべき新しい役割を直感し、戯曲にしばしば取り入れた。ルクレツィア・ボルジアがジェンナーロと仲間たちに毒を盛った宴の終わり、彼らを恐怖に凍りつかせる「深き淵より」の息をのむ効果を、覚えていない人がいようか。『メアリー・テューダー』の第一幕と第二幕では、ファビアーニがギターで自分に伴奏をつけながら歌う同じ恋の歌が、愛を表す詩的な決まり文句として用いられる。ここで音楽は、ファビアーニを女王の足もとにひれ伏させた情熱のしるしだ。しかし幸福を訴え出ずにいられない心の状態から自然に生まれたとはいえ、この恋の歌は音楽による傍白にすぎず、いわば観客にじかに打ち明けるだけである。それとは逆に、『ルクレツィア・ボルジア』で「深き淵より」が私たちを深く揺さぶるのは、劇の人物たちを恐怖に陥れるからにほかならない。これが舞台での音楽の本当の使い方である。私たちはジェンナーロに共感して恐怖を覚える。だが音楽の感覚をじかに受けるのは彼だ。息を詰めて最後のどんでん返しを待つおぞましい劇は、彼の心の中で演じられる。私たちは彼に目を据え、その身を貫く痛切な感情のすべてを分かちながら、近づいてくる物悲しい歌の聖句に耳を澄ますのだ。"

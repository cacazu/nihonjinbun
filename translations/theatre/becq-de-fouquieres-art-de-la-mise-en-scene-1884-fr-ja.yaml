  "kind": "paragraph"
  "origin": "source"
  "source_text": "En résumé, il y a toujours une raison esthétique qui dans les dénouements rapproche ou écarte plus ou moins les personnages de la ligne ou du centre optique. Il en est de même dans les scènes successives; car chacune d'elles a en quelque sorte ses péripéties et son dénouement. On voit ainsi que le rythme scénique suit dans tous ses mouvements le rythme esthétique, et que les déplacements des personnages ne sont pas arbitraires. Il faut naturellement tenir compte des rapports qui enchaînent les personnages à des objets fixes, placés à droite ou à gauche, tels qu'un bosquet, une table, un canapé, un autel, etc. Toutefois, dans ces cas-là, il faut user d'artifice autant que possible dans la disposition et dans la plantation du décor. Dans Il ne faut jurer de rien, la scène charmante du dernier acte entre Valentin et Cécile se passe sur un banc, au pied d'une charmille placée malheureusement un peu trop près de la zone invisible de gauche. Il serait désirable que l'on pût tant soit peu rapprocher la charmille du lieu optique. Dans le dernier acte du Monde où l'on s'ennuie, très habilement mis en scène, les deux bosquets de droite et de gauche sont le lieu de scènes épisodiques qui s'équilibrent; mais la scène entre Roger et Suzanne se noue et se dénoue dans le lieu optique. Il y a là une heureuse hiérarchie dans les effets."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 268
    "line_start": 3774
    "line_end": 3793
  "translation_ja": "まとめれば、結末で人物を視線基準線や視線の中心に近づけたり、そこから離したりするのには、いつも美学上の理由がある。次々に続く各場面でも同じだ。それぞれの場面に、いわば独自の転機と結末があるからである。こうして舞台のリズムが、あらゆる動きにおいて美的なリズムに従い、人物の移動は勝手に決まるのでないことが分かる。木立、テーブル、ソファ、祭壇など、左右にある動かない物に人物の動きが結びついているときは、当然その関係を考えに入れなければならない。ただしそういう場合は、できるだけ工夫して装置を配し、建て込むべきだ。『決して誓うな』の最後の幕では、ヴァランタンとセシルの魅力的な場面が、クマシデの生け垣の下の腰掛けで演じられる。残念ながら、生け垣が左の死角にやや近すぎる。わずかでも、視線の集中域に近づけられればよい。巧みに演出されている『退屈する社交界』の最後の幕では、左右二つの木立で、それぞれ脇の場面が演じられ、釣り合っている。だがロジェとシュザンヌの場面が始まり、決着するのは、視線の集中域である。効果に見事な優先順位がついている。"
  "translation_status": "reviewed"

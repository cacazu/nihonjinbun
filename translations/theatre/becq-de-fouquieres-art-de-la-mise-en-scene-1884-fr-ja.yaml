- "id": "becq-0142"
  "section_id": "ch17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous examinerons, dans ce chapitre, les rapports de la mise en scène avec ce que nous avons appelé la fantaisie. Une première difficulté se présente, c'est de définir la fantaisie et de la distinguer de l'imagination. A ne considérer que le sens premier des mots, il n'y a guère de différence entre elles; cependant on ne peut contester qu'il n'y en ait une notable si nous considérons l'emploi que nous faisons de ces deux mots, quand nous les appliquons à des ouvrages dramatiques. L'imagination est la faculté que nous avons d'évoquer des images et des séries associées d'images, auxquelles correspondent des idées et des séries associées d'idées, et qui toutes sont reliées par un lien de contiguïté sérielle, sinon immédiate, au moins saisissable et certaine. La fantaisie, au contraire, associe entre elles des images qui n'appartiennent pas à une même série et n'ont par conséquent pas entre elles de rapport nécessaire et prochain. Le contraste apparent des images associées est donc la première loi de la fantaisie; mais la seconde loi est que ces images associées doivent présenter immédiatement à l'esprit un rapport inattendu, qui, bien que lointain et inaccoutumé, mette en relation des idées qu'on aurait pu croire absolument disparates. C'est en même temps l'étrangeté et la vérité relative de ce rapprochement qui en constitue le piquant et l'originalité. En un mot, on pourrait dire que la fantaisie, c'est de l'esprit dans l'imagination. Il y a quelque chose de cela dans ce que les Anglais appellent l'humour."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 142
    "line_start": 1784
    "line_end": 1806
  "translation_ja": "本章では、演出と、これまで奔放な空想と呼んできたものとの関係を調べる。最初にぶつかる難問は、奔放な空想という言葉の意味を定め、想像力と区別することだ。言葉の第一の意味だけを考えれば、両者にはほとんど違いがない。だが、戯曲に当てはめて二つの言葉をどう使うか考えれば、大きな違いがあることは否定できない。想像力とは、像や、互いにつながった一連の像を呼び起こす私たちの能力であり、それぞれに観念や、互いにつながった一連の観念が対応する。これらはどれも、一つの系列のなかで、すぐ隣り合うとはかぎらないが、少なくとも分かりやすく確かな近さによって結ばれている。これに対して奔放な空想は、同じ系列に属さないため、必然の、すぐに分かる関係がない像どうしをつなぎ合わせる。結ばれた像が一見食い違うことが、したがって、奔放な空想の第一の法則である。ただし第二の法則として、結びついた像は、遠くて見慣れない関係であっても、まるでばらばらのものと思われた観念を結び合わせる、思いがけない関係を、その場で精神に示さなければならない。この取り合わせの奇妙さと、なるほどと思わせる相対的な真実とが、ことの面白味と独自性を作る。ひとことでいえば、奔放な空想とは、想像力に宿る機知である。イギリス人のいうユーモアにも、このようなところがある。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 1521
      "end": 1527
      "exact": "humour"
- "id": "becq-0143"
  "section_id": "ch17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Par exemple, on peut, je crois, trouver que dans les oeuvres de M. Alexandre Dumas fils il y a plus d'esprit que de fantaisie, tandis que dans certaines oeuvres d'Alfred de Musset il y a plus de fantaisie que d'esprit. Dans les pièces de M. Meilhac et de M. Labiche, il y a tantôt de l'esprit, et du plus fin, tantôt de la fantaisie, et de la plus originale. Cette association de l'esprit et de la fantaisie est, en effet, le propre des oeuvres comiques, car les lois de l'esprit et de la fantaisie semblent être identiques à celles de la gaieté et du rire, et consister dans le rapport soudain que l'auteur nous fait apercevoir entre deux objets les plus disparates d'apparence. A mesure que décroît le nombre des parties justement associées dans les images mises en présence, la fantaisie perd de son prix, n'est bientôt qu'une sorte d'imagination vagabonde et déréglée, devient enfin grossière et tombe dans ce qu'on appelle familièrement la bêtise, qui n'est autre chose qu'une contradiction irrémédiable entre deux images conjuguées. La bêtise est donc encore susceptible d'exciter le rire par l'inattendu burlesque de la contradiction qu'elle propose à l'esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 143
    "line_start": 1808
    "line_end": 1824
  "translation_ja": "たとえばアレクサンドル・デュマ・フィスの作品には、奔放な空想より機知のほうが多く、アルフレッド・ド・ミュッセの作品のなかには、機知より空想の奔放さに富むものがあると思う。メイヤックやラビッシュの芝居では、あるときは機知が、それもきわめて繊細な機知が、あるときは奔放な空想が、それもきわめて独創的な空想が見られる。この機知と奔放な空想の取り合わせは、なるほど喜劇の固有の性質だ。機知と奔放な空想の法則は、陽気さと笑いの法則と同じらしく、一見もっともかけ離れた二つの物事の関係を、作者が突然こちらに見せてくれるところにあるからだ。合わせた像のうち、つじつまの合う部分が少なくなるにつれて、奔放な空想は値打ちを失う。やがて好き勝手にさまよう想像になるだけで、ついには下品になり、ふだん「ばかばかしさ」と呼ぶものになる。それは一緒にされた二つの像の、どうにも取り返しのつかない矛盾にほかならない。だからばかばかしさでさえ、精神に示した矛盾がおかしな、思いもよらないものであれば、笑いを誘いうるのである。"
  "translation_status": "reviewed"
- "id": "becq-0144"
  "section_id": "ch17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous avons réussi à présenter une idée juste de ce que nous entendons par fantaisie, on doit comprendre combien les oeuvres dramatiques qui sont des créations de la fantaisie, telles que la Cagnotte, le Chapeau de paille d'Italie, la Grande-Duchesse, la Cigale, etc., s'éloignent à chaque instant de la réalité des actes et des contingences possibles de la vie. Les comédiens qui traduisent sur la scène ces combinaisons originales et fantaisistes doivent s'y sentir dégagés du monde réel, sans quoi ils se trouveraient aussi mal à l'aise sur la scène que nous pourrions nous trouver gênés de nous voir en habit d'Arlequin dans la compagnie de gens graves et sérieux. La mise en scène ne doit avoir qu'un but, c'est de fournir un fond suffisant sur lequel se détachent en pleine lumière ces créations de la fantaisie. Elle doit donc être sommaire et pourvoir uniquement aux nécessités scéniques. Les costumes surtout demandent une appropriation heureuse, aussi éloignée de la correction que de l'excentricité banale. Il y faut conserver un certain rapport avec la vérité. Aussi ce sont les artistes les mieux doués sous le rapport de l'observation qui trouvent les costumes les plus comiques; car, en déformant la réalité, ils ne la perdent cependant pas de vue et font saillir aux yeux des spectateurs des rapprochements aussi piquants qu'inattendus. La diction et les gestes doivent, eux aussi, concourir au même effet général, s'écarter de la logique dans les limites du compréhensible, et présenter toujours un rapport, amusant pour l'esprit, entre la fiction et la réalité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 144
    "line_start": 1826
    "line_end": 1848
  "translation_ja": "奔放な空想という言葉の意味を正しく示せたとすれば、『共同の貯金』『イタリアの麦わら帽子』『大公妃』『セミ』など、そうした空想から生まれた戯曲が、現実の振る舞いや、人生で起こりうる偶然の出来事から、一瞬ごとにどれほど遠ざかっているかが分かるだろう。この独創的で奔放な取り合わせを舞台で演じる俳優は、現実の世界から解き放たれていると感じなければならない。そうでなければ、私たちがまじめくさった人たちの中に道化師アルルカンの服で出て、居心地が悪くなるのと同じほど、舞台で居心地が悪くなる。演出の目的はただ一つ、奔放な空想が生みだしたものが、十分な光の中でくっきりと浮かび上がる、足るだけの背景を用意することだ。だから大づかみに、舞台で必要なことだけに応えなければならない。とりわけ衣裳は、きちんとしすぎることからも、ありふれた奇抜さからも、同じほど遠く離れた、うまい加減が求められる。それでも真実とのつながりは、ある程度残さなければならない。そのため、観察の才能にもっとも恵まれた芸術家が、一番おもしろい衣裳を見つける。現実をゆがめながらも見失わず、意外で面白味のある取り合わせを観客の目に際立たせるからだ。台詞回しや身ぶりも、同じ全体の効果を助け、分かる範囲で筋道を外れ、虚構と現実のあいだに、精神を楽しませる関係をいつも見せなくてはならない。"
  "translation_status": "reviewed"

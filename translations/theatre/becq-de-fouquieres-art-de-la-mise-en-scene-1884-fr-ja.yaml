    "line_start": 1690
    "line_end": 1722
  "translation_ja": "ジョルジュ・サンドの『ヴィクトリーヌの結婚』で私たちが見るのは、父と娘それぞれの心で繰り広げられる、胸を打つ劇である。娘は、自分でもそう認める勇気がないが、父の主人であり恩人でもある人の息子を愛している。父は、娘が向こう見ずな恋に落ちるのを見て、主人の店員の一人と結婚させて、娘の恋心を断とうとする。父と娘は心が大きく、道徳の良心が潔い。社会の階層を尊重し、自分の品位を守り、自尊心をもち、誇りによって義務の意識を英雄的なまでに高めている。だから二人の心で続く気高い戦い、父の心での娘への愛と恩人への敬意との戦い、娘の心での恋と父への愛との戦いは、胸を刺す痛ましい光景になる。私たちの見る劇は、本当にこの二人の心の内で起こっており、私たちの心は、つらい共感を抱いてその展開を追う。二人の決断の原因がすべて内面的で主観的であり、この心理劇では外の世界のあらゆる魅力にどれほど値打ちがないかを、私たちは感じる。父と娘の目にも、観客の目にも、二人の道徳的な決断に多少なりとも影響を及ぼすに足るものは何もない。部屋のぜいたくさも、銀行家の金庫に積まれた財産も、衣裳の美しさもそうではない。要は、二人がつつましい身分のために望むことを許されない、上の身分を示すものは、何一つ決断を左右しないのである。したがって装置や演出で、こうした面へ目を向けさせるものがあれば、観客が待ち望む結末は、ほとんど成り立たなくなる。少なくとも、結末の道徳的な偉大さを損なってしまう。演出は質素で控えめで、ほとんど姿を消し、細部の乏しいものでなければならない。そこには私たちの興味を引くものは何もないのだから。衣裳は素朴でやや厳しく、俳優の演技は抑え、身ぶりにも台詞回しにも大げさなところがないようにする。要するに、筋を絞り、心だけを舞台とする環境で保ち、その中で結末をつけなければならない。演出のどんな細部も輝きすぎて、劇が観客のまなざしに下ろした涙の幕を、その鋭い先で引き裂くことがないようにするのである。"
  "translation_status": "reviewed"

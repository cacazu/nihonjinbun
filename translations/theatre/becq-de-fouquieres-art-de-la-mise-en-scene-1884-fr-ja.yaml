      "exact": "d'Antony"
- "id": "becq-0193"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais en fait la mise en scène d'Antony n'existait plus et il a fallu la recréer de toutes pièces. La difficulté était précisément dans le grand nombre de traits précis et particuliers dont, relativement à cette époque peu éloignée de nous, notre imagination est encore encombrée. Il fallait, pour le costume d'Antony, éviter le ridicule auquel il ne prêtait pas jadis et auquel il ne devait pas non plus prêter aujourd'hui. Il fallait créer, comme cela s'est fait, de soi-même et insensiblement, pour des époques plus anciennes, un type général qui eût le caractère du temps sans être le personnage à la mode de telle ou telle année. On devait donc avoir grand soin de ne pas feuilleter les gravures de modes, les journaux illustrés, mais de s'inspirer de portraits, de bustes, de gravures, c'est-à-dire, en un mot, d'oeuvres d'art. Leur examen collectif devait offrir un certain nombre de caractères communs et fournir les traits généraux du type à réaliser. En tout cas, ce dont il fallait bien se pénétrer, c'est que le costume d'Antony ne devait être ni une copie ni une réminiscence, mais une création au sens artistique du mot."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 193
    "line_start": 2660
    "line_end": 2676
  "translation_ja": "だが実際には、『アントニー』の演出はもう存在せず、何もかも新しく作らなければならなかった。難しさはまさに、さほど遠くないこの時代について、私たちの想像力が、まだたくさんの明確で個別的な特徴に占められていることにあった。アントニーの衣裳には、かつて笑いを誘わなかったのと同様、今日でも笑いを誘ってはならなかった。もっと昔の時代なら、いつのまにかおのずと出来上がったように、時代の特色を持ちながら、ある一つの年の流行に従う人物ではない、普遍的な類型を作る必要があった。このため、流行の版画や挿絵入りの雑誌をめくるのは慎み、肖像画や胸像や版画、要するに芸術作品から着想を得なければならなかった。それらをまとめて見れば、ある程度の共通の特徴が現れ、描くべき類型の普遍的な特徴を示したはずだ。いずれにせよ、よく承知していなければならなかったのは、アントニーの衣裳は写しでも、思い出をよみがえらせたものでもなく、芸術の意味での創造でなければならないということだ。"
  "translation_status": "reviewed"

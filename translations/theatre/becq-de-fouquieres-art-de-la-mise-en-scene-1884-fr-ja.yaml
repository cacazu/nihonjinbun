- "id": "becq-0211"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la mise en scène tragique.--Ce qu'elle était jadis en France.--Ce qu'elle était chez les Grecs.--Notre imagination seule crée la mise en scène tragique.--Du caractère général de la décoration et des costumes.--La mise en scène n'est pas immuable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 211
    "line_start": 2931
    "line_end": 2934
  "translation_ja": "悲劇の演出／かつてのフランス／古代ギリシア／悲劇の演出は私たちの想像力だけがつくる／舞台美術と衣装の基本的性格／演出は不変ではない"
  "translation_status": "reviewed"
  "source_kind": "chapter_summary"
- "id": "becq-0212"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous savons maintenant à quoi tendent les représentations classiques, le but qu'elles poursuivent et la sensation suprême qu'elles s'efforcent de faire éprouver à tous les spectateurs. Sans doute, tous ne sentent pas le beau avec une force égale, et ne sont pas d'ailleurs disposés ou préparés à subir le joug du poète; mais par l'effet physiologique de la contagion, qui se produit dans toute foule humaine, les plus indécis et les plus tièdes sont ébranlés par le spectacle de l'émotion que leur donnent les plus ardents, et bientôt il s'établit, entre ces spectateurs de tout âge et de toute condition, une sorte de communion émotionnelle, qui fait qu'une salle tout entière fond en larmes au même instant ou éclate en applaudissements."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 212
    "line_start": 2936
    "line_end": 2946
  "translation_ja": "これで、古典の上演が何を目指し、どんな目的を追うのか、また、観客すべてにどんな至高の感覚を味わわせようとするのかが分かった。もちろん皆が同じ強さで美を感じるわけではなく、劇作家の支配に身を委ねる気分や用意が、誰にもあるわけではない。しかし、人の集まりならどこにも起こる、生理的な感情の伝染がある。最も熱心な人たちが感動する様子を見て、どっちつかずだった人や反応の鈍かった人まで心を揺さぶられる。ほどなく、年齢も立場も異なる観客の間に、いわば一つの感情を分かち合う関係が生まれ、客席全体が同時に涙にくれたり、拍手をわき起こしたりする。"
  "translation_status": "reviewed"
- "id": "becq-0213"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a dans toute oeuvre dramatique un ou plusieurs moments psychologiques où doit se produire cette commotion, qu'il ne faut pas confondre avec celle qui est due au pathétique des situations. Elle se fait souvent sentir dès le second acte, et il suffit d'une idée, d'un vers, d'un mot, d'un geste, d'un regard, pour déterminer ce jaillissement de vérité et de vie qui nous atteint en pleine âme. Mais, dans les belles oeuvres, ces deux commotions du pathétique et du beau se résolvent enfin en une seule, qui se fait sentir, en général, au quatrième acte, après lequel il ne reste plus au poète qu'à apaiser l'émotion soulevée dans l'âme du spectateur, à ramener l'équilibre dans son esprit, et à lui laisser du spectacle tragique une impression complète en soi, dont le souvenir est destiné à s'associer avec une idée de plaisir organique et de joie morale. Ce double souvenir, qui retentit longtemps au fond de nous-mêmes, nous dispose à venir de nouveau savourer cette sensation exquise; et cette disposition est précisément la marque d'un goût qui s'aiguise au souvenir et à l'espoir d'un plaisir, dans lequel se combinent également l'intelligence et la sensibilité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 213
    "line_start": 2948
    "line_end": 2965
  "translation_ja": "どの戯曲にも、こうした衝撃が起こるべき、心理上の要となる瞬間が一つはあり、いくつもある場合もある。場面そのものの哀切さがもたらす衝撃とは混同してはならない。早くも第二幕に感じられることが多い。考え一つ、詩句一行、言葉一つ、身ぶり一つ、視線一つで、真実と生命がほとばしり、心のまん中に届く。だが美しい作品では、哀切さと美がもたらす二つの衝撃は、最後には一つに溶け合う。ふつうそれが感じられるのは第四幕であり、そのあと劇作家に残るのは、観客の魂に起こした感動を鎮め、精神の均衡を取り戻させ、悲劇の舞台から得た印象を、一つの完結したものとして残すことだけだ。その記憶は、やがて体で感じる喜びと、心の喜びとに結びつく。この二重の記憶は心の底に長く響き、その絶妙な感覚を味わいに、私たちをまた劇場に向かわせる。知性と感受性が等しく協力する喜びを思い出し、また味わいたいと願うことで、趣味が研ぎ澄まされている証拠である。"
  "translation_status": "reviewed"
- "id": "becq-0214"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les moments psychologiques déterminés, et ils ne le sont guère d'une façon certaine qu'après une suite de représentations, à moins que des reprises antérieures ne les aient traditionnellement fixés, tout doit concourir à faire produire au drame son plein et entier effet. Il arrive assez souvent que les effets attendus et prévus ne se manifestent pas, soit par suite de la défaillance d'un ou de plusieurs acteurs, soit par suite des dispositions du public ou de la composition de la salle. D'autres fois, il y a déplacement dans les points de plus grande intensité, par suite de la prépondérance inattendue que le jeu d'un acteur donne à l'un des personnages. En dehors du succès personnel que recueille cet acteur, il n'y a pas généralement lieu de s'en féliciter; car, si on admettait de pareilles transpositions, le succès des représentations serait abandonné au hasard. Le théâtre ne peut véritablement s'applaudir que lorsqu'aux moments précis les effets attendus se manifestent dans toute leur intégrité. Dans ce cas, assez fréquent d'ailleurs dans une troupe d'élite comme celle de la Comédie-Française, on sent longtemps d'avance se dessiner le succès; il suffit au commencement de la représentation d'une intonation particulièrement juste, d'un geste d'une saisissante précision, pour établir entre la scène et la salle ce courant sympathique qui électrise en même temps les acteurs et les spectateurs. Le jeu des acteurs s'assure et s'harmonise, leur voix prend des intonations chaudes et puissantes; ils semblent possédés du génie du poète dont les pensées et les vers franchissent incessamment la rampe; les spectateurs, de leur côté, sentent leur esprit se tendre sans fatigue, leurs sens devenir plus subtils, et leur coeur prêt à battre plus rapidement sous l'étreinte du poète. A mesure que la sensibilité des spectateurs s'accentue, les acteurs, tout en sentant leur être vibrer avec plus d'intensité, deviennent plus sûrs et plus maîtres d'eux-mêmes; ils se possèdent d'autant mieux que le public se possède moins; et, dans ces moments décisifs, quand les spectateurs sont en quelque sorte emportés hors d'eux-mêmes, c'est à la puissance sur soi-même que se reconnaissent précisément les grands acteurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 214
    "line_start": 2967
    "line_end": 2999
  "translation_ja": "心理上の要となる瞬間が定まったら、劇が存分に効果を発揮するよう、すべてをそこに向けなければならない。以前に再演を重ねて伝統としてすでに定まっているのでなければ、確実に見定められるのは、まず何度か上演してからである。予期した効果が現れないことはよくある。一人、または複数の俳優が力を出せなかったせいかもしれないし、観客の気分や、集まった人々の顔ぶれのせいかもしれない。別の場合には、ある俳優の演技で一人の登場人物が予想外に目立ち、最も強く響く箇所がずれてしまう。当の俳優が手にした個人としての成功は別にして、ふつう喜ぶことではない。こうしたずれを認めれば、上演の成功を偶然任せにすることになるからだ。劇場が本当に自賛してよいのは、まさにそれを見込んだ瞬間に、期待した効果が欠けるところなく現れるときだけである。コメディ・フランセーズのような選び抜かれた一座では、かなりよくあることだが、この場合は成功の輪郭がずっと前から見えてくる。舞台のはじまりに、とりわけ的を射た声の調子が一つ、目をみはるほど正確な身ぶりが一つあれば、舞台と客席の間に共感の流れが通い、俳優と観客の双方を奮い立たせる。俳優の演技は確かになり、息が合う。声の調子に熱と力がこもる。彼らに乗り移ったかのような劇作家の天分から生まれる考えと詩句は、絶えず舞台の縁を越えて客席へ届く。観客の方も、疲れを覚えずに精神が張り、感覚が鋭くなり、劇作家にとらえられた心臓が、さらに速く打ち出しそうなのを感じる。観客の感受性が強まるにつれ、俳優も自分の全身がますます強く震えるのを感じながら、いっそう確かに、自分を御するようになる。観客が自分を忘れるほど、俳優はいっそう自分を保つ。決定的な瞬間に観客がいわば我を失うとき、まさにこの自分を御する力によって、偉大な俳優が見分けられるのである。"
  "translation_status": "reviewed"
- "id": "becq-0215"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais on conçoit que pour faire produire à la représentation d'une oeuvre classique tout ce qu'elle doit donner, il faut une savante et minutieuse préparation. Or existe-t-il ou a-t-il existé quelque part un modèle que nous devions nous efforcer de reproduire dans la mise en scène tragique? Voilà, il semble, la question dont la réponse déterminera la direction de nos efforts dans la préparation d'une représentation théâtrale. Eh bien, on peut affirmer que ce modèle n'existe et n'a jamais existé que dans notre imagination. Tout d'abord, si nous remontons le cours de notre propre histoire littéraire, nous verrons comment ce modèle imaginé a été long à se former en nous. La mise en scène s'est bien lentement perfectionnée et nos idées sur le costume datent à peu près de la fin du siècle dernier. Le costume tragique était jadis de pure fantaisie, un mélange d'éléments modernes et anciens, un composé de plumes, de velours, de soie, le tout s'agençant en forme de tunique à l'antique, retombant sur des cnémides resplendissantes. Quant à la décoration et à la mise en scène, elles étaient ce qu'elles pouvaient au milieu des spectateurs privilégiés qui encombraient la scène. Ce n'est donc pas sur notre propre théâtre que nous pourrions trouver le modèle que nous cherchons. Pouvons-nous espérer, en remontant le cours du temps, le rencontrer sur la scène tragique elle-même où furent représentés les drames de Sophocle et d'Euripide? Nos recherches ne seraient pas couronnées de ce côté de plus de succès."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 215
    "line_start": 3001
    "line_end": 3022
  "translation_ja": "しかし、古典の上演から引き出すべきものをすべて引き出すには、知識に裏打ちされた入念な準備が必要だと分かる。では、悲劇の演出で私たちが再現すべき手本が、どこかにある、あるいはかつてあったのだろうか。この問いにどう答えるかで、舞台を準備する努力の方向が決まるように思われる。だが、そういう手本は、今も昔も私たちの想像の中にしかない、と断言できる。まず自国の文学史をさかのぼれば、想像の手本が私たちの中で形を取るまで、いかに時間がかかったかが分かる。演出の洗練はずいぶんゆっくり進み、衣装に対する現在の考え方が生まれたのも、およそ前世紀末にすぎない。昔の悲劇の衣装は気ままな空想の産物で、新旧の要素が混じっていた。羽根、ビロード、絹を組み合わせ、古代風のチュニカに仕立て、ぴかぴかのすね当ての上に垂らした。舞台美術と演出にいたっては、舞台をふさぐ特権階級の観客の間で、できることをやるだけだった。求める手本は、自国の舞台には見つからない。では、時代をさらにさかのぼり、ソポクレスやエウリピデスの戯曲が上演された、あの悲劇の舞台そのものになら、出会えるだろうか。そちらの探求も、同じように実らない。"
  "translation_status": "reviewed"
- "id": "becq-0216"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous n'avons que des idées assez confuses sur l'organisation des théâtres antiques; et le peu que nous en savons suffit pour nous démontrer que dans l'antiquité la décoration et le costume des acteurs étaient en partie fantaisistes et en partie hiératiques. Quant à ce que nous appelons la couleur locale et la vérité historique, les anciens ne s'en préoccupaient nullement. D'ailleurs leurs personnages tragiques appartenaient à un passé purement légendaire et épique, et étaient en réalité des créations de leur imagination. En pouvait-il être autrement? C'est précisément le caractère de l'art d'être un jeu, et c'est par là qu'il mérite de charmer et d'embellir la vie. Comment donc ces mêmes personnages, qui composent encore aujourd'hui notre personnel tragique, prendraient-ils à nos yeux une consistance historique qu'ils n'ont jamais eue? Ce qui nous trompe, et ce qui en cela fait le plus grand honneur à l'art, c'est la vérité et la puissance des passions auxquelles les acteurs prêtent l'apparence matérielle de leurs corps. Il ne faut donc pas s'y méprendre: il n'y a pas et il n'y a jamais eu de milieu historique concordant expressément avec ces figures tragiques. La mise en scène doit se composer non pas avec ce qui a été ou ce qui a pu être, mais avec les images qui, dans notre imagination, forment et composent le monde antique. Quelque parti que nous prenions, quelles que soient les recherches savantes et archéologiques dont nous nous fassions guider, jamais notre scène, avec ses personnages de création toute poétique, ne nous offrira un tableau véritable de la vie antique; pas plus d'ailleurs que les personnages héroïques qu'ont peints Homère et Eschyle n'ont jamais ressemblé aux êtres historiques dont un savant moderne, dans sa foi ardente, exhume les restes à Mycènes et à Troie. Les Grecs contemporains de Sophocle ne reconnaîtraient certainement pas la tragédie du plus grand de leur poète dans l'Oedipe roi qu'on joue actuellement à la Comédie-Française. Elle est pourtant une traduction aussi fidèle que possible, et la mise en scène en a été réglée avec un goût parfait. Ils seraient choqués de voir les héros et les rois descendus de leurs cothurnes et ramenés à la taille des marchands d'Athènes, et de les entendre parler sans masques d'une façon aussi simple et aussi peu mélodique. Quant aux choeurs, ils se demanderaient par quelle aberration du goût on ose leur faire déclamer des strophes sur une musique qui ne s'y adapte pas métriquement. C'est que les Grecs concevaient de leur propre antiquité une image toute différente de celle que nous nous en formons, et avaient sur l'art tragique des idées très différentes des nôtres. Maintenant qu'ils sont devenus eux-mêmes l'antiquité, ce sont eux qui nous intéressent, et, à la distance où nous sommes d'eux, nous les confondons volontiers avec leurs héros et avec leurs dieux mêmes, ce qui prouve bien que ce monde mythologique, héroïque et historique n'existe à l'état décoratif que dans notre propre imagination. Cela n'empêche pas d'ailleurs que la tragédie grecque et la tragédie française n'obéissent au même principe essentiel, qui est la caractéristique du théâtre grec et du théâtre français, à savoir la prédominance constante de l'idée sur le fait et du développement moral sur l'acte matériel."

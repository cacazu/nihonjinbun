- "id": "becq-0223"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si j'ai choisi Phèdre, ce n'est pas que cette tragédie offre une occasion exceptionnelle d'étude et fournisse une plus riche moisson d'exemples que toute autre; c'est uniquement qu'au moment même où je m'occupais de la mise en scène j'ai pu assister à plusieurs représentations de cette tragédie. Si toute autre, au lieu de Phèdre, eût fait partie du répertoire courant c'est celle-là que j'eusse choisie. J'en profiterai pour agiter quelques questions générales à mesure qu'elles se présenteront. Pour mettre un certain ordre dans l'ensemble des faits que nous devons passer en revue, j'examinerai successivement le décor, le matériel figuratif, les costumes et les dispositions scéniques; et ce que je chercherai surtout à mettre en lumière, c'est le rapport direct qu'a la mise en scène avec l'interprétation du drame, c'est-à-dire son influence sur le jeu et la diction des acteurs, et par conséquent sur le résultat final et total de la représentation."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 223
    "line_start": 3148
    "line_end": 3162
  "translation_ja": "私が『フェードル』を選んだのは、この悲劇が格別よい研究材料で、ほかの作品より例が豊富だからではない。ちょうど私が演出を調べていたとき、この悲劇の上演を何度か見られたからにすぎない。『フェードル』の代わりに別の悲劇がそのときの演目に入っていたなら、そちらを選んでいた。この機会に、いくつかの一般的な問題も、出てくるつど取り上げよう。見ていく事柄をいくらか整理するため、舞台装置、舞台上の実物、衣装、舞台上の配置を順に調べる。とりわけ明らかにしたいのは、演出が劇の解釈と直接どう結びつくかである。すなわち演出が、俳優の演技と台詞の言い方にどう影響し、その結果、上演全体の仕上がりをどう左右するか、ということだ。"
  "translation_status": "reviewed"

- "id": "becq-0318"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la composition d'un rôle.--Des traditions.--De l'intuition et de l'introspection.--Développement des images initiales.--Rapport ou contraste entre les images initiales de différents rôles.--Le Demi-Monde.--Le Gendre de M. Poirier.--Mademoiselle de Belle-Isle."

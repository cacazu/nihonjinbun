- "id": "becq-0182"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Vanité de toute recherche archéologique.--Des différents styles.--Les costumes du Misanthrope.--Le temps efface les traits particuliers.--Formation des types artistiques.--Destructibilité de la mise en scène.--Nécessité de démonter les oeuvres classiques.--Des reprises.--Antony.--La mise en scène est une création artistique.--Erreur de l'école réaliste."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 182
    "line_start": 2486
    "line_end": 2491
  "translation_ja": "考古学的な考証のむなしさ。さまざまな様式。『人間嫌い』の衣裳。時は個別の特徴を消す。芸術上の類型の形成。演出は失われうること。古典の演目をいったん舞台から外す必要。再演。『アントニー』。演出は芸術上の創造である。写実主義の流派の誤り。"
  "translation_status": "reviewed"

    "line_start": 2447
    "line_end": 2466
  "translation_ja": "私自身はいくらラシーヌをひいきにしていても、コルネイユやラシーヌがヴィクトル・ユゴーより偉大な詩人だったとは言えないと思う。こうした劇作家の作品の生命力の差が、詩の才能の不平等から来ないなら、原因はヴィクトル・ユゴーの想像力があまりに豊かなことに求めるべきだ。その豊かさに押されて、上演でだけ生きる効果を絶えず乱用し、絵になる効果と土地の色合いを、純然たる叙事詩のやり方で求めたのだ。ユゴーは印刷した芝居に添える前書きや注で、スペインやイギリスのさまざまな著者から、普通は知られていない細かな特徴をいくつも汲み取ったことを、手柄にする。歴史家なら確かに手柄だが、劇作家にとっては手柄ではない。劇作家が観客に差し出すべきは、ただ人間としての姿であって、異国の人物だとしても、そうと分かるだけの一般的な特徴をまとわせればよい。ただし公平を期すために付け加えれば、劇作家にとっては有害な、これほど広い想像力こそ、叙事詩人の才能の本質である。ヴィクトル・ユゴーはここでも、その輝かしい例だ。『諸世紀の伝説』は傑作であり、フランス文学にも外国文学にも、比べられるものはない。"
  "translation_status": "reviewed"

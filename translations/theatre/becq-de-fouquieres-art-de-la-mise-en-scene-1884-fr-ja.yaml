- "id": "becq-0247"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rapport du costume avec la personnalité.--Le costume doit s'accorder avec les états psychologiques d'un personnage.--Du costume de Phèdre.--Influence du costume sur le jeu et sur la diction.--Les costumes d'Iphigénie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 247
    "line_start": 3450
    "line_end": 3453
  "translation_ja": "衣装と人物の個性との関係／衣装は人物の心理状態の移り変わりに合っていなければならない／フェードルの衣装／衣装が演技と台詞の言い方に及ぼす影響／『イフィジェニー』の衣装"
  "translation_status": "reviewed"
  "source_kind": "chapter_summary"

- "id": "becq-0313"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A un autre point de vue, d'ailleurs, on peut dire qu'au théâtre, en dehors de certains cas particuliers, comme par exemple dans l'expression du sentiment filial, le baiser n'est toléré que s'il est donné ou reçu par une femme. En général, les acteurs n'en doivent jamais faire que le simulacre. Le Mariage de Figaro nous facilite la détermination de la limite au delà de laquelle on choquerait la bienséance. Au cinquième acte, lorsque Chérubin, croyant embrasser Suzanne, embrasse le comte Almaviva, tout spectateur attentif à ses propres impressions s'apercevra que la réalité du baiser serait choquante si le rôle de Chérubin était rempli par un homme, et que si elle ne l'est pas, c'est qu'il sait que sous les traits et sous le costume du page c'est une femme qui donne ce baiser à l'acteur qui joue le rôle du comte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"

- "id": "becq-0369"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce choeur entendu dans le lointain semble le gémissement de la nature entière, qui pleure le coeur brisé de la pauvre fille et son bonheur détruit. Que pourrait dire Sûzel et quelles paroles vaudraient l'éloquence de cette phrase musicale, qui arrive au public grossie de tous les sanglots qui gonflent le coeur de l'abandonnée? C'est là une belle fin dramatique, où, il est vrai, le sentiment l'emporte sur l'idée, mais qui est conforme à l'esthétique du drame moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 369
    "line_start": 5508
    "line_end": 5514
  "translation_ja": "遠くから聞こえるその合唱は、哀れな娘の砕けた心と壊れた幸福を嘆く、自然全体のすすり泣きのようだ。シュゼルが何を言えよう。見捨てられた娘の心をいっぱいにするあらゆる嗚咽を抱え、観客まで届くこの音楽の一句の雄弁さに、どんな言葉が並びうるだろう。美しい幕切れである。たしかにここでは観念より感情が勝るが、近代劇の美学にはかなっている。"
  "translation_status": "reviewed"
- "id": "becq-0370"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le premier acte de l'Ami Fritz présente un emploi de la musique plus remarquable encore, parce qu'il est plus rare: il s'agit de l'émotion produite uniquement par un morceau de musique instrumentale. Après une minutieuse exposition, dont tous les détails font ressortir l'épicurisme de Fritz et son égoïsme de vieux garçon, on s'est mis à table, et ce repas de gourmand, digne couronnement de toute cette exposition, un instant interrompu par l'arrivée de Sûzel, se continue, les vins les plus fumeux succédant aux plats les plus succulents, lorsque soudain résonne un coup d'archet: c'est le violon du bohémien Joseph, qui tous les ans, le jour de la fête de Fritz, vient avec quelques-uns de ses compagnons exécuter un morceau sous les fenêtres de son ami. Les trois convives s'arrêtent, lèvent la tête et prêtent l'oreille à la voix vibrante des instruments à cordes. A ce moment, les dix-huit cents spectateurs qui emplissent la salle sentent l'âme de Fritz s'ouvrir aux accents pathétiques des instruments à voix humaine, et tout ce qu'il a fait de bien, de bon, de juste dans sa vie remonter à son coeur, et le réparer de sa beauté morale au milieu de cette scène de vulgaire sensualité. En même temps, l'âme de Fritz, soustraite soudain aux liens matériels de son existence, s'élève et s'unit, dans une commune émotion, avec celle de Sûzel que la belle musique fait toujours pleurer. L'attendrissement qu'éprouve le public ne lui vient pas directement des instruments, mais de la profonde émotion dont ceux-ci troublent l'âme de Fritz et celle de Sûzel. C'est là un très bel exemple du rôle pathétique que peuvent remplir des instruments à cordes dans le drame ou dans la comédie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 370
    "line_start": 5516
    "line_end": 5540
  "translation_ja": "『友人フリッツ』の第一幕には、もっと珍しいだけに、さらにみごとな音楽の使い方がある。楽器だけの一曲が生む感動である。事細かな導入のすみずみが、フリッツの享楽ぶりと独身の年増男の利己心を浮き上がらせたあと、皆は食卓につく。こうした導入を締めくくるのにふさわしい美食家の食事は、シュゼルが来て一時止まるが、また続く。この上なくおいしい料理に続いて、とりわけ香り高い葡萄酒が出る。そのとき、ふいに弓が弦を鳴らす。ロマのヨーゼフのヴァイオリンである。毎年、フリッツの祝いの日に、何人かの仲間を連れて友の窓の下で一曲弾くのだ。三人の客は手を止め、頭を上げて、震える弦楽器の声に耳を傾ける。そこで客席を埋める千八百人は、人の声のような楽器の痛切な音にフリッツの魂が開くのを感じる。彼がそれまでの一生でしたよいこと、親切、正しいことのすべてが胸によみがえり、俗な享楽のただ中で、彼の心の美しさを余すところなく取り戻させる。同時にフリッツの魂は、生活の物質的な絆からふいに解かれて高まり、美しい音楽を聞くといつも泣いてしまうシュゼルの魂と、同じ感動に結ばれる。観客が心を動かされるのは楽器からじかにではない。その音がフリッツとシュゼルの心に起こす深い動揺のおかげだ。劇や喜劇で弦楽器が人の心を打つ役割を担いうることの、みごとな例である。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 21
      "end": 30
      "exact": "Ami Fritz"
- "id": "becq-0371"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une autre pièce des mêmes auteurs, les Rantzau, présente un curieux exemple de la musique employée comme ressort dramatique; mais cette fois l'exemple est bizarre, plus peut-être qu'il n'est heureux. La musique, en effet, y joue un rôle ingrat et n'a d'autre mérite, aux yeux de Jean Rantzau chez qui se donne un petit concert improvisé, que celui d'être un bruit désagréable et agaçant pour Jacques Rantzau. Jean insiste sur le but qu'il se propose et qu'il atteint, car soudain la colère de Jacques se traduit par le vacarme de sa batteuse qu'il fait mettre en mouvement. Les auteurs se sont trompés sur la mise en oeuvre du ressort musical. Sans me préoccuper de l'action du drame, je dirai que c'est le tableau contraire qu'ils auraient dû présenter. L'intérêt dramatique de la scène aurait dû être dans la colère de Jacques Rantzau, et c'est le concert que lui donne son frère Jean qui aurait dû être placé hors de la scène. Il y a eu transposition d'effets. C'est à l'agacement progressif de Jacques que le public aurait dû participer, et non pas au concert qui n'a par lui-même aucun charme musical et qui n'est qu'un ressort ayant précisément le défaut d'être trop apparent. Ce qui doit toujours être mis au premier rang, sous les regards des spectateurs, c'est le personnage sur qui doit s'exercer l'action musicale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 371
    "line_start": 5542
    "line_end": 5560
  "translation_ja": "同じ作家たちのもう一つの芝居『ランツァウ家』には、音楽を劇の仕掛けに使った奇妙な例がある。出来がよいというより、変わっていると言ったほうがよいかもしれない。音楽は、ありがたくない役を引き受ける。即席の小演奏会を開くジャン・ランツァウにとって、音楽はジャック・ランツァウをいらだたせる不快な騒音だという以外、何の取り柄もない。ジャンは狙いを執拗に追い、あてを外さない。突然ジャックの怒りが、彼の動かさせた脱穀機の轟音になって現れるからだ。作者たちは音楽の仕掛けを使う場所を誤った。劇全体の進行はさておき、ここでは反対の場面を見せるべきだったと思う。この場面のおもしろさはジャック・ランツァウの怒りに置き、兄弟のジャンが彼のために開く演奏会こそ舞台の外に置くべきだった。効果を置く場が逆になっている。観客が分かち合うべきはジャックの次第に募るいらだちであって、演奏会ではない。演奏会そのものには音楽の魅力がなく、いかにも目立ちすぎるという欠点のある仕掛けにすぎないからだ。観客の目の前、第一に見せるべきなのは、いつも音楽の働きを受ける人物である。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 35
      "end": 46
      "exact": "les Rantzau"
- "id": "becq-0372"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je ne puis résister au désir de citer un bel et dernier exemple, tiré d'une pièce toute moderne et essentiellement parisienne, les Rois en exil, que des susceptibilités politiques ont arrêtée trop tôt pour le plaisir de ceux qui sentent l'intérêt artistique qu'offrent tous les ouvrages de M. Daudet. C'est jour de grande soirée chez la reine d'Illyrie; sous l'apparence d'un bal, il s'agit d'une réunion politique où vont se prendre des résolutions viriles. On attend le roi, celui en qui se résume les espérances de tout un parti. Soudain sur l'escalier d'honneur, supposé en dehors de la scène, éclate la marche nationale illyrienne. Au son de cette musique guerrière, tous les courages s'affermissent; les coeurs se haussent et volent au-devant de ce roi qui s'apprête à tirer l'épée pour ressaisir sa couronne. C'est l'entrée triomphale d'un héros, d'un conquérant, du représentant et du sauveur de la monarchie. Tout ce que les accents de cet hymne national remuent chez la reine et chez ses fidèles de beau, de patriotique, de chevaleresque évoque dans l'imagination des spectateurs une figure noble et sans tache, une sorte d'archange royal prêt à couper les sept têtes de la Révolution de son épée flamboyante. C'est après quelques instants remplis d'une ardente espérance, sous tous les regards du public et sous ceux de la reine déjà anxieuse, que paraît enfin le roi. L'effet est foudroyant, implacable. Christian, le regard terne, la démarche légèrement avinée, entre, inconscient de l'écroulement définitif de sa fortune royale, hébété au milieu d'un désastre que rien ne peut plus conjurer. L'effet de contraste est irrésistible, entre ce viveur fatigué, ce protecteur de filles, protégé lui-même par des usuriers, et la figure de roi que la marche nationale illyrienne avait annoncée et parée d'avance d'une héroïque majesté."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 372
    "line_start": 5562
    "line_end": 5588
  "translation_ja": "最後に一つ、みごとな例を引用せずにいられない。まったく現代の、いかにもパリらしい芝居『亡命の王たち』である。政治上の反発から早々に打ち切られ、ドーデ氏の作品にすべて見いだせる芸術上のおもしろさを感じる人たちは残念がった。イリュリアの女王のもとで盛大な夜会が開かれる。舞踏会の形を借りて、断固たる決議を下そうという政治集会である。一派全体の望みを一身に担う王を待っている。突然、舞台の外にあるはずの正面の大階段で、イリュリアの国の行進曲が鳴り響く。勇ましい音楽に皆の気持ちは固まる。冠を取り戻そうと剣を抜く構えの王に向かい、人々の心は高まって飛んでゆく。英雄、征服者、王政を代表し救う者の凱旋である。国の賛歌の響きが女王と忠臣の中で目覚めさせる、美しく、愛国的で、騎士道に適ったものすべてが、観客の想像に一人の高潔で汚れのない姿を呼び起こす。燃える剣で革命の七つの首を断とうとする、王家の大天使といった姿である。熱い希望に満ちたしばらくのあとに、観客のすべての目と、すでに不安な女王のまなざしを浴びて、ついに王が姿を見せる。その効果は容赦なく、落雷のようだ。クリスティアンはくすんだ目、少し酒に酔った足取りで入ってくる。王家の運命が決定的に崩れたことには気づかず、もう何一つ救いようのない破局の中で呆然としている。くたびれた遊び人、女たちの面倒を見ながら自分は高利貸しの世話になる男と、イリュリアの行進曲が来ると告げ、先回りして英雄の威厳を授けた王の姿との対照には、抗しがたいものがある。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 127
      "end": 143
      "exact": "les Rois en exil"
- "id": "becq-0373"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Après ce dernier exemple, il ne nous reste plus qu'à ajouter quelques mots de conclusion sur ce sujet. Il ne serait pas impossible que l'introduction de la puissance musicale dans le drame moderne eût pour cause initiale une influence germanique. Mais, à en juger d'après l'Egmont de Goethe, le génie allemand accorde à la musique une puissance idéale et imaginative qu'elle ne peut avoir que dans l'opéra où le poète y ajoute un sens littéraire. Le génie français, fait essentiellement de clarté, n'a pas suivi le génie allemand qui lui avait peut-être suggéré cette tentative, et pour lui la puissance dramatique de la musique ne réside que dans la propriété qu'elle possède d'éveiller, de propager et d'exalter les sentiments."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 373
    "line_start": 5590
    "line_end": 5600
  "translation_ja": "この最後の例を挙げたので、残るのは結論を一言添えることだけである。音楽の力が近代劇に導入された最初の原因は、ドイツの影響だったのかもしれない。ただゲーテの『エグモント』から判断すると、ドイツの気質は音楽に、作家が文学上の意味を加えるオペラでしかありえない、観念的で想像力に働く力を認める。明晰さを本質とするフランスの気質は、こうした試みを示唆したかもしれぬドイツの気質にはついていかなかった。フランスにとって音楽の劇的な力は、感情を目覚めさせ、伝え、高める性質のうちにだけある。"
  "translation_status": "reviewed"

  "source_text": "L'esprit est relativement au temps dans les mêmes conditions que la vue relativement à la distance. L'espace et le temps sont d'ailleurs deux concepts corrélatifs qui ne peuvent s'expliquer l'un sans l'autre. On peut donc dire qu'une pièce dont l'action se déroule dans un milieu très éloigné de celui où nous vivons, présente les mêmes difficultés de représentation qu'une pièce dont l'action a été placée à une époque de beaucoup antérieure à la nôtre. Néanmoins, il ne serait pas juste de dire simplement que dans ces deux cas la difficulté est multipliée par la distance ou par le temps. Il est, en effet, nécessaire de tenir compte de la connaissance que nous avons de ce milieu ou de cette époque, et des rapports que les idées, les moeurs, les costumes peuvent avoir avec les nôtres. Les États-Unis, par exemple, quoique plus distants de nous que certains pays des bords du Danube, nous offriraient des difficultés de mise en scène beaucoup moins grandes. De même l'histoire, les idées, les moeurs de l'Athènes de Périclès nous sont plus familières que celles des premiers siècles de notre ère, et même que celles de nos ancêtres directs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 173
    "line_start": 2306
    "line_end": 2322
  "translation_ja": "時間に向き合う精神の条件は、距離に向き合う視覚の条件と同じである。そもそも空間と時間は互いに関わる概念であり、一方なしに他方を説明できない。このため、私たちの生活する環境からはるかに離れた環境で起こる芝居は、私たちの時代よりはるか昔に筋が置かれた芝居と、上演の困難が同じだと言える。ただし、どちらの場合も単に距離や時間の分だけ困難が増すと言うのは、正しくない。その環境や時代についてどれだけ知っているか、その考え方や風習、衣裳が、私たちのものとどのような関係にあるかを考えなくてはならないからだ。たとえばアメリカ合衆国は、ドナウのほとりのいくつかの国より私たちから遠いが、演出の困難ははるかに少ないだろう。同じように、ペリクレスのアテナイの歴史、考え方、風習は、西暦最初の数世紀や、私たち自身の先祖のものより身近である。"
  "translation_status": "reviewed"
- "id": "becq-0174"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il n'y a donc rien d'absolu dans les difficultés que le temps ou la distance offre à la mise en scène. C'est le plus ou moins d'instruction du spectateur, l'étendue de son savoir et l'ampleur de ses informations qui indiquent le point de vraisemblance auquel nous devons nous efforcer d'atteindre. Depuis un certain nombre d'années, les oeuvres traduites des romanciers russes nous ont fait connaître dans leurs détails les moeurs de la Russie, et nous ont initiés à des idées assez différentes des nôtres; aussi a-t-on pu, dans les Danicheff, intéresser le public français à un drame dont l'action n'aurait pu se dérouler dans le milieu où nous sommes habitués de vivre, et l'on a pu arriver à une représentation suffisamment exacte de moeurs, d'idées et de sentiments dans lesquels nous ne serions pas entrés il y a cinquante ans. Dans l'Oncle Sam, c'est la vie et, disons le mot, l'excentricité américaine qui ont été produites sur le théâtre, et la mise en scène a pu se rapprocher de la vérité relative par la connaissance que possède ou que croit posséder le public français de ce caractère américain qui est celui d'un type nouveau dans l'humanité moderne. Mais qu'il s'agisse de monter un drame dont l'action se déroulerait en Turquie, on éprouvera des difficultés presque insurmontables. Ce qu'on appelle la couleur locale serait dans ce cas-là beaucoup plus nuisible qu'utile, car elle serait sans doute en opposition avec l'idée que le public en général se forme des moeurs turques et du mystère qui entoure la vie privée des femmes. Tout le travail d'approximation que serait tenté de faire l'auteur laisserait le public froid et incrédule."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 174
    "line_start": 2324
    "line_end": 2347
  "translation_ja": "したがって、時間や距離が演出に突きつける困難には、絶対的なところは何もない。観客がどれほど学んでいるか、その知識の広さと知っている事柄の多さが、どの程度のもっともらしさを目指せばよいかを教える。この何年か、翻訳されたロシアの小説家たちの作品のおかげで、私たちはロシアの風習を細かく知り、自分たちのものとはずいぶん違う考え方にも触れた。このため『ダニチェフ家の人々』では、私たちの暮らし慣れた環境では起こりえない劇にフランスの観客の関心を引きつけ、五十年前ならとても入り込めなかったような風習、考え方、感情を十分な正確さで舞台に描くことができた。『アンクル・サム』では、アメリカの生活、それとはっきり言えば、アメリカ人の型破りなところが、舞台に出された。近代の人類に現れた新しい類型であるこのアメリカ人の性格を、フランスの観客が知っていたか、知っていると思っていたおかげで、演出は相対的な真実に近づくことができた。しかし、筋がトルコで進む劇を上演しようとすれば、ほとんど乗り越えられない困難にぶつかるだろう。いわゆる土地の色合いは、この場合、役立つよりずっと有害である。普通の観客がトルコの風習や女性の私生活を包む神秘について思い描くことと、おそらく食い違うからだ。作家が実際に近づこうとしてどれほど苦労しても、観客は心を動かされず、信じようともしないだろう。"
  "translation_status": "reviewed"

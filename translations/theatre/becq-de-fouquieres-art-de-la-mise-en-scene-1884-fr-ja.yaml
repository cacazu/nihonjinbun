- "id": "becq-0123"
  "section_id": "ch14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Donc, suivant le milieu théâtral, des effets de mise en scène, d'intensité égale, n'auront pas une portée identique. Plus le répertoire habituel d'un théâtre est intellectuellement relevé, moins l'accroissement de l'effet représentatif aura d'influence fâcheuse, à la condition cependant que tout le matériel figuratif soit soumis à la même proportion d'intensité, et qu'aucun détail n'éveille en nous une attention particulière. C'est pourquoi, à la Comédie-Française, on pourra apporter des soins presque excessifs à la composition des ameublements sans crainte de jeter l'esprit du spectateur sur de fausses pistes. Le goût plus délicat du public habituel en sera satisfait, et la mise en scène s'associera ainsi aux habitudes sociales du monde auquel appartiennent les spectateurs et les personnages de la plupart des pièces qu'on représente à ce théâtre. Au Châtelet, comme à la Gaîté ou à l'Ambigu, c'est au contraire au décor peint qu'il faudra uniquement demander un accroissement de mise en scène; car on ne peut modifier le matériel figuratif sans changer l'effet spécial qu'en attend le spectateur. En résumé, lorsque pour des raisons supérieures on croira nécessaire d'augmenter l'effet représentatif d'une oeuvre dramatique, la dérogation aux principes essentiels de la mise en scène trouvera dans le milieu théâtral soit des circonstances atténuantes, soit des circonstances aggravantes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 123
    "line_start": 1517
    "line_end": 1537
  "translation_ja": "それゆえ、劇場の環境によって、同じ強さの演出効果も、もたらす結果は同じにならない。劇場がふだん掛ける演目の知的な水準が高いほど、上演効果を強くしても、悪影響は少なくなる。ただし、舞台上の実物がすべて同じ強さの割合を保ち、どの細部もとくに注意を引かないことが条件だ。そのためコメディ・フランセーズなら、家具の選び方にほとんど過剰なほど手をかけても、観客の精神を誤った方向へ迷い込ませるおそれはない。常連の観客の、より細やかな好みが満たされ、演出はそうして、観客と、上演する戯曲の大半の登場人物とが属する世間の慣習と、結びつくことになる。シャトレ、ゲテ、アンビギュでは逆に、演出を豊かにしたければ、絵に描く装置だけにそれを求めなければならない。舞台上の実物を変えれば、観客が一つひとつの物から期待する特別な効果まで、変わってしまうからである。要するに、より重要な理由から、戯曲の上演効果を高める必要があると考えるとき、劇場の環境しだいで、演出の根本原則に背くことの影響は、和らぎもすれば、悪化もするのである。"
  "translation_status": "reviewed"

- "id": "becq-0069"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mise en scène est conditionnée par le nombre probable de spectateurs.--Grossissement par les acteurs des effets représentatifs.--Les actrices moins portées à exagérer les effets.--Le Monde où l'on s'ennuie.--Nécessité actuelle de plaire à la foule.--Abaissement de l'idéal.--Compensation.--Utilité et devoir des théâtres subventionnés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 69
    "line_start": 803
    "line_end": 808
  "translation_ja": "演出は見込み観客数に左右される。俳優による上演効果の誇張。女優は効果を誇張しにくい。『退屈する社交界』。大勢の観客を喜ばせねばならない今日。理想の低下とそれを補うもの。助成を受ける劇場の効用と務め。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 183
      "end": 209
      "exact": "Le Monde où l'on s'ennuie."
- "id": "becq-0070"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les deux conditions que nous venons d'énumérer ne sont pas les seules que doit remplir un directeur de théâtre. Une troisième condition indispensable est la connaissance des milieux: la même oeuvre qui réussit rue Richelieu ne réussira pas boulevard du Temple. Cette question du milieu est connexe à celle du nombre. Étant donnée une oeuvre dramatique d'une certaine valeur intrinsèque, si une mise en scène judicieuse et modérée lui fait produire un effet représentatif suffisant pour trente mille personnes, ce même effet représentatif sera insuffisant pour deux cent mille. La prévision du nombre possible de spectateurs entre donc dans les calculs préalables d'un directeur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 70
    "line_start": 811
    "line_end": 820
  "translation_ja": "先に挙げた二つは、劇場の責任者が満たすべき条件のすべてではない。欠かせない第三の条件は、客層を知ることである。リシュリュー街で当たる芝居が、タンプル大通りでも当たるとはかぎらない。客層は人数とも関わる。ある程度の内在的な価値のある戯曲を、分別ある穏当な演出で上演し、三万人には十分な上演効果が得られたとしても、二十万人となれば同じ効果では足りない。どれほどの観客を見込めるかの予測も、劇場の責任者が前もって立てる計算に入るのである。"
  "translation_status": "reviewed"
- "id": "becq-0071"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une fois la pièce lancée, l'ensemble de la mise en scène n'est plus modifiable, mais il arrive presque toujours que, lorsqu'une pièce reste longtemps sur l'affiche, les acteurs cèdent à la tentation d'exagérer l'effet représentatif de leurs rôles; et ils y sont encouragés par les applaudissements du public, qui devient moins délicat, à mesure qu'augmente le nombre des représentations. Mais tous les rôles ne possédant pas un effet représentatif susceptible d'un égal grossissement, et les acteurs cédant inégalement à la tentation des applaudissements, il en résulte ce fait remarquable que la pièce, à mesure que s'accroît le nombre des représentations, perd sa physionomie première en même temps que l'équilibre primitif résultant de l'accord entre sa valeur intrinsèque et son effet représentatif. C'est, en un mot, l'oeuvre représentée qui perd à cette transformation insensible; et si la direction du théâtre y gagne quelque profit actuel, c'est, il faut l'avouer, au détriment de la direction future et de l'art dramatique lui-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 71
    "line_start": 822
    "line_end": 837
  "translation_ja": "一度芝居が走り出せば、演出の全体はもう変えられない。だが、長く上演される芝居では、俳優が自分の役の上演効果を誇張したくなる誘惑に負けることが、ほとんど必ずといってよいほど起こる。上演回数が重なるにつれ、観客の感受性は鈍くなっていき、その拍手がまた俳優をあおる。しかし、すべての役が、その上演効果を同じだけ大きくできるわけではないし、俳優が拍手の誘惑に負ける程度も一様ではない。すると、上演の回を重ねるにつれ、もとの芝居の面影が失われ、作品の内在的な価値と上演効果が一致して生まれていた最初の均衡も失われるという、注目すべき事態になる。要するに、この気づかぬほど少しずつの変化で損をするのは、上演される作品である。劇場の経営が目先の利益をどれほど得ようと、将来の経営、そして演劇そのものが犠牲になることは、認めなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0072"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En général, les hommes se laissent aller beaucoup plus facilement que les femmes à grossir l'effet représentatif de leur rôle; cela tient sans doute à ce que les femmes possèdent à un plus haut degré la faculté d'imitation et d'assimilation, tandis que les hommes sont poussés par une puissance d'agir, difficile à contenir, à forcer leurs premiers effets et à en essayer de nouveaux. Je citerai comme un exemple remarquable le Monde où l'on s'ennuie, qui a tenu l'affiche pendant deux cent cinquante représentations. Les hommes se sont visiblement fatigués; les premiers acteurs ont été remplacés par d'autres, qui se sont eux-mêmes lassés, ce dont je suis bien loin de leur faire un crime; mais les actrices qui avaient créé les rôles les ont conservés sans interruption jusqu'à la fin, et non seulement elles ont résisté à la tentation de grossir des effets faciles à exagérer, mais encore elles ont eu le mérite peu commun de nous conserver jusque dans les dernières représentations la perfection de jeu et de diction qu'elles avaient atteinte dès les premières."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 72
    "line_start": 839
    "line_end": 854
  "translation_ja": "一般に男性は女性より、自分の役の上演効果を大げさにしやすい。おそらく女性は模倣し、自分のものにする力により富む一方、男性は抑えがたい行動力に押され、初めの効果を強め、新しい効果を試したくなるのだろう。顕著な例に、二百五十回上演された『退屈する社交界』がある。男性俳優は目に見えて疲れ、初めの配役は別の者に交代したが、交代した俳優たちも疲れてしまった。むろん、それを責めるつもりは少しもない。だが、初演で役を作った女優たちは、最後まで一度も交代せずに演じ通した。そればかりか、いかにも大げさにしやすい効果を誇張する誘惑に抵抗し、初めの数回ですでに達していた演技と台詞回しの完成度を、最後の数回まで保つという、並々ならぬ仕事をしとげた。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 425
      "end": 450
      "exact": "le Monde où l'on s'ennuie"
- "id": "becq-0073"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un directeur attentif s'aperçoit sans doute de la tendance qu'ont les acteurs d'une pièce à grossir l'effet représentatif de leur rôle; mais, outre qu'il est assez difficile d'enrayer un mouvement qui ne s'accélère qu'insensiblement, il faut reconnaître que la résolution à prendre dans ces cas-là, de la part du directeur, est souvent aussi délicate que difficile et complexe. D'un côté, c'est manquer à ce que l'on doit au génie d'un poète que de laisser altérer si peu que ce soit la physionomie de son oeuvre; d'un autre, sacrifier à l'effet représentatif, c'est augmenter l'attrait et la séduction que peut exercer une pièce et attirer à la connaissance et à l'estime des belles oeuvres un public de plus en plus nombreux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 73
    "line_start": 856
    "line_end": 866
  "translation_ja": "注意深い責任者なら、芝居の俳優たちがそれぞれの役の上演効果を大げさにしたがることに、気づくに違いない。だが、気づかぬほどゆっくり勢いを増す動きに歯止めをかけるだけでも、かなり難しい。そのうえこうした場合、責任者が取るべき決断は、難しく入り組んでいるばかりか、しばしば細やかな加減を要する。一方では、芝居の面影をわずかでも変えてしまうのを許すのは、作家の才能に対する義理に背く。もう一方では、上演効果を重んじることには、芝居が人を引きつける魅力と誘惑を増し、優れた作品を知り評価するところへ、ますます多くの観客を招くという利点もある。"
  "translation_status": "reviewed"
- "id": "becq-0074"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il semble qu'il y ait là une sorte de compensation, bien difficile à ne pas accepter dans l'état actuel de la société française. La Révolution a brisé les barrières qui séparaient les classes les unes des autres. La France est aujourd'hui une démocratie. Les plus humbles veulent jouir des mêmes plaisirs que les plus fortunés; aussi, depuis la fin du siècle dernier, on peut dire que le public qui suit les représentations dramatiques a presque centuplé. Il faut non seulement un plus grand nombre de théâtres pour satisfaire à tous ses goûts; mais encore une pièce qui, jadis, eût été arrêtée de la vingt-cinquième à la cinquantième représentation atteint facilement aujourd'hui la centième, la deux-centième même et souvent après un nombre pareil de représentations n'a épuisé que momentanément son succès."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 74
    "line_start": 868
    "line_end": 879
  "translation_ja": "そこには一種の埋め合わせがあるようで、今のフランス社会のありようでは、それを受け入れないわけにはなかなかいかない。革命は社会階級を隔てていた障壁を壊した。今日のフランスは民主社会である。もっともつつましい人ももっとも裕福な人と同じ喜びを味わいたい。このため、前世紀の末から、芝居の上演に通う観客はほとんど百倍に増えたといえる。その好みをすべて満たすには、劇場がもっと必要なばかりでない。以前なら二十五回から五十回で打ち切りになった芝居が、今日ではたやすく百回、ときには二百回にも達し、それだけ上演しても人気が一時的に一巡したにすぎないことさえ珍しくない。"
  "translation_status": "reviewed"
- "id": "becq-0075"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La nécessité de plaire à la foule s'impose donc, mais impose du même coup à l'art un sacrifice pénible; car l'idéal s'abaisse sensiblement à mesure qu'augmente en nombre le public dont on sollicite les applaudissements. Il n'y a relativement qu'un petit nombre d'esprits délicats et cultivés qui soient capables de sentir la beauté sévère d'une oeuvre d'art. En revanche, en attirant la foule, fût-ce au prix de quelques concessions, en la sollicitant, par l'attrait d'un plaisir facile, à goûter à son tour le charme des belles oeuvres, on rehausse et on purifie si peu que ce soit son idéal. Si donc la cime de l'art s'abaisse, la culture générale de l'esprit s'étend, s'élève même, et là encore il y a compensation. Or, dans une société démocratique, c'est une compensation qu'il n'est pas permis de négliger et qu'on serait même coupable de ne pas rechercher. Mais, si nous pouvons nous consoler de l'abaissement fatal de l'art par la compensation que nous trouvons dans la culture du plus grand nombre, c'est à la condition que nous ne perdions pas de vue le sommet auquel il s'est élevé et vers lequel il doit tendre à remonter, par un autre chemin peut-être, afin que nous ayons toujours conscience de l'effort qu'il nous faudrait faire pour l'atteindre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 75
    "line_start": 881
    "line_end": 899
  "translation_ja": "そこで大勢の観客を喜ばせることが避けがたくなるが、同時に芸術にはつらい犠牲が強いられる。拍手を求める観客の人数が増えるにつれ、理想の水準は目に見えて下がるのである。芸術作品のきびしい美しさを感じることのできる、細やかで教養ある精神は比較的少ない。反対に、ある程度の譲歩をしてでも大勢の観客を引きつけ、たやすく得られる喜びを手がかりに優れた作品の魅力を彼らにも味わってもらえば、わずかでも彼らの理想を高め、澄ませることができる。こうして芸術の頂は低くなっても、精神の教養は広まり、それどころか高まる。そこにも埋め合わせがある。民主社会では、この埋め合わせを無視してはならず、求めないことすら責められてよい。ただし、芸術の避けがたい水準低下を、より多くの人の教養が高まることで慰められるのは、一つの条件があってのことだ。芸術がかつて登りつめた頂と、たとえ別の道からとなってもふたたび目指すべき頂とを、見失わないことだ。そこに届くにはどれほどの努力が要るかを、私たちがつねに意識していられるようにするためである。"
  "translation_status": "reviewed"
- "id": "becq-0076"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est pourquoi, s'il est pardonnable à la plupart des directeurs de sacrifier à la moindre culture du plus grand nombre, il est du devoir de quelques directeurs privilégiés de maintenir, autant que possible, l'art dans toute son intégrité et de résister au désir de trop flatter les instincts moins délicats d'un public plus nombreux. Or, s'ils remplissent ce devoir, c'est à la condition de se résigner à une perte de gain possible, sacrifice qui trouve sa compensation dans les subventions de l'État. Un directeur privilégié et garanti par l'État contre des pertes trop sensibles a pour devoir de ne pas sacrifier l'art à un désir de gain immodéré. Il doit s'appliquer à mettre en lumière la valeur intrinsèque des ouvrages qu'il met en scène; à amener à son point de perfection leur effet représentatif, sans permettre qu'il puisse détourner l'esprit des spectateurs de ce qui doit être l'objet principal de son attention. Il doit, en outre, interdire aux comédiens de troubler l'harmonie générale de l'oeuvre en grossissant trop sensiblement l'effet représentatif de leur rôle. Il doit, en un mot, s'efforcer de mériter les applaudissements du public, mais se montrer sévère sur les moyens de les lui arracher. C'est son honneur et sa gloire de monter parfois des oeuvres qui ne soient susceptibles de plaire qu'à un public restreint, mais délicat et lettré. Car cette élite plus éclairée, que toute nation possède en elle-même, est destinée à voir peu à peu grossir ses rangs par l'adjonction de ceux qu'élèvent jusqu'à elle l'instruction et l'éducation de jour en jour plus répandues. Travailler pour cette élite, c'est donc travailler pour tous, c'est conspirer contre l'ignorance et le mauvais goût, en éveillant les meilleurs instincts de la foule, en la conviant à la jouissance d'un idéal supérieur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 76
    "line_start": 901
    "line_end": 926
  "translation_ja": "だから、劇場の責任者の多くが、大勢の観客の教養がまだ行き届いていないことに譲るのは、大目に見てもよいとしても、恵まれた一部の責任者には、できるかぎり芸術を完全な姿に保ち、より多く集まる人々の、まだ鍛えられていない感覚に迎合しすぎたいという欲を抑える義務がある。この義務を果たせば、得られたかもしれない収益を諦めるほかない。その犠牲の埋め合わせが国の助成である。助成を受け、大きすぎる損失から国に守られる劇場の責任者には、度を超した儲け心に芸術を売り渡さない義務がある。上演する作品の内在的な価値を明るみに出し、その上演効果を最善のところまで高めながら、観客の精神が本来向けられるべきものからそらされないよう努めなければならない。俳優たちが自分の役の上演効果をあまりに大きくして、作品全体の調和を乱すことも許してはならない。要するに、観客の拍手に値するよう努めるが、それを奪い取る手段の選び方には厳しくあるべきなのだ。時には、ごく限られた、しかし感受性が鋭く文学を知る観客だけが喜びうる作品を上演することが、その人の名誉であり栄誉である。どの国にも内に抱えるこの、より見識ある少数の人々には、日ごとに広がる学問と教育によって同じ水準に達する人が新たに加わり、やがてその数は増えていく。この少数の人々のために働くことは、だから、みなのために働くことでもある。大勢の人々のもっとも優れた感覚を呼び覚まし、より高い理想の喜びへ招くことで、無知と悪趣味に抗う仲間になるのである。"
  "translation_status": "reviewed"
- "id": "becq-0077"
  "section_id": "ch08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Malheureusement, le devoir qui incombe à un théâtre subventionné est rarement bien compris de la foule. Un grand nombre de spectateurs s'imaginent qu'une subvention impose au théâtre qui la reçoit la préoccupation constante d'une mise en scène luxueuse. Or, c'est précisément tout le contraire, comme nous l'avons fait voir dans ce chapitre. Ce qui rend donc difficile la position d'un directeur subventionné, c'est la nécessité de réagir contre ce préjugé de la foule, sans être assuré que ses intentions seront bien comprises, et qu'on ne blâmera pas tout ce qui, dans sa conduite, mériterait précisément l'éloge."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 77
    "line_start": 928
    "line_end": 937
  "translation_ja": "残念ながら、助成を受ける劇場の務めは、大方の人々にはめったに正しく理解されない。助成を受けた劇場は豪華な演出にいつも気を配る義務がある、と多くの観客は思い込んでいる。ところが、本章で見てきたとおり、それはまったくの逆である。それゆえ助成を受ける責任者の立場が難しいのは、大方のこうした思い込みに抗う必要がありながら、その意図が正しく理解される保証も、そのやり方のまさに褒められてよいすべてが責められずに済むという保証もないためである。"
  "translation_status": "reviewed"

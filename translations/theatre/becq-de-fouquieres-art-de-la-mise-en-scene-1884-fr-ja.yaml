- "id": "becq-0361"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le rôle de la musique dans l'action dramatique est multiple, mais tend toujours à produire un effet d'accord ou de contraste, et à mettre en évidence les sentiments les plus secrets et les plus profonds de l'âme humaine. Nous allons passer en revue quelques exemples qui feront ressortir clairement l'emploi que les auteurs modernes ont fait de la musique, soit dans le drame, soit dans la comédie. Prenons les effets les plus simples, d'abord, ceux qui résultent uniquement du caractère de la musique, et de son rapport avec le sentiment d'un personnage. Au premier acte du Monde où l'on s'ennuie, lorsque le sous-préfet et sa femme sont introduits et se trouvent seuls dans le salon de la duchesse de Réville, la jeune sous-préfète s'approche du piano ouvert et se met à jouer un air d'opérette. Cet air est représentatif, par son caractère, de l'humeur enjouée de la jeune femme et de la gaieté du nouveau ménage. Survient un domestique: au moment d'être surprise, la sous-préfète passe habilement de ce motif léger à un thème de musique classique, qui est, lui, représentatif du sérieux affecté que tous deux croient devoir garder dans le monde où ils font leur entrée. Voilà donc immédiatement les deux personnages connus du public pour ce qu'ils sont et pour ce qu'ils veulent paraître, en même temps qu'est parfaitement déterminé le caractère du monde où va se nouer et se dénouer l'intrigue de la comédie. La musique est donc ici chargée de l'exposition dramatique et élevée au rang de confident. Elle facilite singulièrement à l'auteur la mise en marche de l'action, et évite aux personnages l'ennui de faire et au public celui d'entendre l'exposé de leurs sentiments les plus intimes. C'est d'ailleurs là un des rôles les plus fréquents et des moins complexes de la musique. Dans la même pièce, la jeune fille, jalouse et nerveuse, raye le piano d'un geste sec et fiévreux; et les sentiments qui l'agitent se dévoilent instantanément. Ici l'intervention musicale passe au rôle d'excitateur dramatique, puisque c'est elle qui dévoile aux autres personnages le trouble profond de la jeune fille. Si nous nous transportons au cinquième acte d'Hernani, au moment où doña Sol voudrait entendre s'élever le chant du rossignol au milieu de cette belle nuit nuptiale, c'est le son inattendu du cor qui résonne au milieu de la solitude de la nuit et vient rappeler à Hernani qu'il est l'heure de mourir. Ici le cor a une signification exacte et déterminée: c'est la voix même de Ruy Gomez, dont il évoque l'image menaçante aux yeux des spectateurs. C'est le cor qui déchaîne la mort dans cette nuit promise à l'amour et qui précipite le dénouement tragique. Mais on peut à peine dire que dans ce dernier cas il s'agisse d'une intervention musicale, car celle-ci est réduite à un son. Les cas précédents sont beaucoup plus nombreux au théâtre, et se ramènent tous à une jeune fille ou à une jeune femme révélant au public l'état de son âme par le choix de la musique qu'elle joue ou de la romance qu'elle chante. Les exemples que l'on pourrait citer sont innombrables. Dans tous les cas, la musique n'a pas d'influence directe sur le spectateur; elle puise sa puissance émotionnelle dans l'âme du personnage qu'elle traverse avant d'arriver à celle du spectateur."

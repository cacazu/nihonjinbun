- "id": "becq-0287"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des actes et des tableaux.--Confusion fréquente.--Unité dramatique des actes.--Du théâtre espagnol, anglais, allemand.--Les changements de tableaux impliquent des changements à vue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 287
    "line_start": 4083
    "line_end": 4085
  "translation_ja": "幕と場面。よくある混同。幕がなす劇的なまとまり。スペイン・イギリス・ドイツの演劇。場面が変わるときには、観客の目の前で装置を転換する。"
  "translation_status": "reviewed"
- "id": "becq-0288"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans les cinquante dernières années, l'esthétique dramatique s'est modifiée. Jadis l'action devait être une, se dérouler dans le même lieu pendant l'unité de temps qui est le jour de vingt-quatre heures. L'action se divisait en général en cinq actes qui représentaient cinq moments successifs. Toutefois, la règle des trois unités, qui a fait couler des flots d'encre, n'a jamais été respectée que chez les Français. Chez les Espagnols, chez les Anglais, et enfin chez les Allemands, les poètes ne s'en sont jamais préoccupés. Entraînés par leur exemple, les Français à leur tour ont brisé cette triple entrave, ou plutôt ils n'en ont conservé qu'une seule, l'unité d'action. On a si bien transgressé l'unité de temps que parfois, en dépit de Boileau qui le reprochait au théâtre étranger, un personnage, enfant au premier acte, est barbon au dernier. Quant à l'unité de lieu, non seulement le lieu a pu changer d'acte en acte, mais encore, à l'exemple, de ce qui a lieu dans Shakspeare, les différentes scènes d'un acte se passent la plupart du temps dans des lieux différents. Je ne m'arrêterai pas à discuter les lois de cette esthétique nouvelle et à en peser les avantages et le mérite: cela est complètement en dehors du sujet que je traite. Je n'ai à m'occuper que de la mise en scène, et en particulier de la représentation des drames empruntés au théâtre des Anglais, des Espagnols et des Allemands."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 288
    "line_start": 4088
    "line_end": 4108
  "translation_ja": "この五十年で劇の美学は変わった。以前は筋が一つで、その全体が同じ場所で、一昼夜という時間の単位内に展開しなければならなかった。筋はたいてい五幕に分かれ、時間順に五つの局面を表した。だが、さんざん議論を呼んだ三一致の規則は、フランスでしか守られなかった。スペイン、イギリス、そしてドイツの作者は、そんなことには気を配らなかった。その例に引かれて、フランスも三重の足かせを断ち切った。いや、筋の統一だけを残したと言うべきだ。時間の統一はすっかり破られ、ときには、ボワローが外国の芝居を非難して言ったとおり、一幕目では子どもだった人物が、最後の幕では爺さんになっている。場所については幕ごとに変えてよくなったばかりか、シェイクスピアにならい、一幕の異なる場面がたいてい異なる場所で進む。こうした新しい美学の決まりを論じ、その利点や価値をはかるつもりはない。それはここで扱う話題からまったく外れる。私は演出だけを、なかでもイギリス、スペイン、ドイツの劇を借りて上演することだけを考えたい。"
  "translation_status": "reviewed"
- "id": "becq-0289"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sur nos affiches, nous voyons à chaque instant annoncé un drame en cinq actes et douze tableaux. Je dis douze pour prendre un exemple quelconque. Conformément aux principes de l'esthétique, les douze tableaux devraient se répartir dans les cinq actes, de telle sorte que la représentation mît en lumière et imposât à l'esprit des spectateurs les rapports que doivent avoir entre eux les tableaux renfermés dans un même acte. Or, en général, il n'en est absolument rien, et il est facile de constater que si les spectateurs savent à tout instant à quel tableau en est la pièce, ils perdent rapidement la notion des actes et sont dans l'impossibilité de dire à quel acte appartient tel ou tel tableau. Cela tient à ce que les tableaux sont presque toujours séparés les uns des autres par des entr'actes, absolument comme s'ils étaient des actes. Il n'y a que demi-mal quand il s'agit de pièces modernes, où le mot acte et le mot tableau sont si fréquemment confondus, et où l'expression de cinq actes n'est qu'une phraséologie de convention. Dans ce cas, il faudrait mieux indiquer simplement le nombre des tableaux, comme dans Nana Sahib, qui était dénommé par son auteur drame en sept tableaux. Mais, alors, pourquoi pas drame en sept actes? C'est un hommage tacite rendu à l'antique division dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 289
    "line_start": 4110
    "line_end": 4128
  "translation_ja": "劇場のポスターには「五幕十二場の劇」とひっきりなしに出てくる。十二というのは例に取りやすい数を出しただけだ。美学の原則に従えば、十二の場面を五つの幕に割り振って、同じ幕のうちにある場面どうしが持つべき関係を、上演ではっきりさせ、観客にはその関係を感じ取ってもらわなければならない。ところが実際にはたいていそうならない。観客は芝居が何場目かはいつでも分かるが、幕の感覚はたちまち失われ、この場面が何幕にあたるか言えないことがすぐ確かめられる。場面と場面のあいだにはほとんどいつも幕間があり、まるで各場面が一つの幕であるかのように区切られているからだ。近代の芝居なら害は半分で済む。「幕」と「場」の字がたびたび混同され、「五幕」は慣例で用いる口上にすぎないからだ。それなら、『ナナ・サーヒブ』を作者が「七場の劇」と呼んだように、単に場面の数を示した方がよい。だがその場合、どうして「七幕の劇」と言わないのか。昔からの劇の区分に、言葉にせずに敬意を払っているのである。"
  "translation_status": "reviewed"

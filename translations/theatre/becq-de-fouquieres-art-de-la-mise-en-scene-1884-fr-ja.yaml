- "id": "becq-0291"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un acte est une division dramatique qui doit avoir un commencement et une fin, dont toutes les parties sont indissolubles, et dont par conséquent la représentation ne doit pas offrir de solution de continuité pour les yeux, puisqu'elle n'en offre pas pour l'esprit. Dans un entr'acte, si court qu'il soit, un poète peut faire tenir un temps quelconque si grand qu'il soit. En généralisant le phénomène, on peut dire que dans un temps réel infiniment petit nous pouvons faire tenir un temps imaginaire infiniment grand. On en a une preuve dans ce fait que dans une seconde de sommeil le rêve fait entrer une suite considérable d'événements. La durée des entr'actes est donc sans rapports avec le temps supposé écoulé par le poète et avec le nombre d'événements qu'il imagine s'être passés entre deux actes. Donc, en allongeant un entr'acte, nous ne rendons nullement plus plausible l'intervalle plus ou moins grand de temps, supposé écoulé entre les deux moments de l'action au milieu desquels il s'intercale. La durée d'un entr'acte n'est pas proportionnelle à l'accroissement du temps. Voilà une des faces du phénomène; examinons l'autre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 291
    "line_start": 4149
    "line_end": 4165
  "translation_ja": "一幕は劇の一つの区切りである。始まりと終わりがあって、中の部分はすべて切り離せない。頭の中で切れ目がないのだから、目に見える上演にも切れ目があってはならない。幕間がいかに短くても、作者はどれほど長い時間でもその中に入れられる。これを一般化すると、限りなく短い実時間に、限りなく長い想像上の時間を収められると言える。ほんの一秒の睡眠に夢が数多くの出来事を繰り入れることが、その証拠になる。幕間の長さは、作者が経過したと考える時間や、二つの幕のあいだにあったと考える出来事の数とは関係がない。だから幕間を延ばしても、その両側の二つの局面のあいだに長かれ短かれ時間がたったという想定が、少しももっともらしくなるわけではない。幕間の長さは、経過した時間の増え方に比例しない。これが一面である。もう一面を見よう。"
  "translation_status": "reviewed"
- "id": "becq-0292"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand le rideau tombe, l'esprit du spectateur, dégagé de l'étreinte du poète, redevient immédiatement libre. Il y a dans cette chute du rideau, dans cette disparition absolue du spectacle, un signe manifeste de l'interruption de l'action dramatique. Une partie de cette action est dès lors accomplie, et l'esprit du spectateur est prêt à franchir l'espace de temps que voudra le poète, mais non à accepter, quand le rideau se relèvera, une contiguïté entre les deux tableaux, et une continuation, après interruption, du moment précédent de l'action. Un acte représente une suite de sensations étroitement associées; si donc, entre deux tableaux appartenant à un même acte, on intercale un entr'acte, on brise un anneau de la chaîne des sensations, qui doivent se succéder sans interruption pour se fondre dans une sensation générale et totale. L'esprit du spectateur est donc obligé de reconstruire rétrospectivement la suite interrompue de ses sensations, de revenir de lui-même sur l'idée de fin qui s'était formée en lui: au lieu d'un mouvement en avant, il éprouve donc, non seulement un temps d'arrêt, mais encore un mouvement de recul. L'action du drame, au lieu d'avancer, rétrograde, et l'impression de ralentissement se fait sentir à notre esprit, bien qu'elle ne résulte pas des dispositions imaginées par le poète. C'est par conséquent, dans ce cas, la mise en scène qui est responsable de ce sentiment de lenteur qui nous fait juger sous un jour faux l'action ininterrompue tracée par le poète."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 292
    "line_start": 4167
    "line_end": 4188
  "translation_ja": "幕が下りれば、観客の心は作者のしばりから解け、たちまち自由になる。幕が落ちて、舞台の光景がことごとく消える。このことは、劇の進行が止まる明らかな印になる。そこまでで筋の一部分は終わった。観客の心には、作者の望むだけの時間を飛び越える用意はある。だが幕が再び開いたとき、さっきと今との場面が時間的に接していて、一度中断した直前の局面がそのまま続くとは受け入れがたい。一幕は固く結び合った一連の感覚を表す。同じ幕に属する二つの場面に幕間を差し挟むと、感覚の鎖が一つ切れてしまう。それらは途切れず続いてこそ、全体を通した一つの感覚に溶け合うものなのだ。観客の心は、途切れた感覚の続き方を振り返って作り直し、胸に浮かんだ「終わった」という思いから自分で引き返すしかない。前に進むかわりに、しばらく足を止めるだけでなく、後ろへ退くことになる。劇の筋は前に進まず後戻りし、作者がそう作ったのではないのに、私たちには足取りが鈍ったと感じられる。したがって、この場合に、作者が途切れなく描いた筋を私たちが誤って遅いと見る責任は、演出にある。"
  "translation_status": "reviewed"
- "id": "becq-0293"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est une impression que, sans pouvoir l'expliquer, j'avais souvent éprouvée, quand de temps à autre on remontait sur une scène française un des drames de Shakspeare. Il me semblait que par moments l'action ne marchait pas et je n'étais pas loin d'en accuser le génie dramatique du poète. Cependant la lecture me donnait une impression tout autre. Mais, dès que mon attention se porta sur la mise en scène, je ne fus pas long à découvrir que l'ennui, provenant d'une action qui semblait trop lente ou stagnante, avait pour véritable cause les procédés de notre mise en scène appliqués aux drames de Shakspeare. Le rythme et la mesure de l'oeuvre se trouvaient altérés, absolument comme si dans une phrase musicale on eût intercalé mal à propos un temps de silence. Je n'ignore pas que la division en actes des drames de Shakspeare est postérieure au poète. A cela on peut toutefois répondre que la représentation devait forcément opérer la division des tableaux, dont la répartition en cinq actes a été le résultat d'un travail critique réfléchi, peu de temps après la mort de Shakspeare, et à laquelle il est assez raisonnable de nous tenir. En tout cas, il ne peut y avoir plusieurs manières également bonnes d'opérer cette division. Au surplus, à défaut de l'exemple de Shakspeare, il resterait celui de Goethe et de Schiller, et celui de Sheridan dans le théâtre anglais."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 293
    "line_start": 4190
    "line_end": 4209
  "translation_ja": "フランスの舞台でときおりシェイクスピアの劇を再演すると、私もその感じを何度となく覚えた。理由は説明できなかった。筋がときどき前に進まない気がして、作者の劇作の才能を責めたくなるほどだった。しかし本を読むと、受ける印象はまるで違う。やがて演出に注意を向けると、遅すぎるか止まっているような筋に退屈するのは、私たちの演出のやり方をシェイクスピアの劇に持ちこんだせいだと、ほどなく分かった。作品のリズムと拍子が狂っていた。音楽のひとまとまりの句に、時ならぬ休止を入れたようなものだ。シェイクスピアの劇が幕に分けられたのは作者の死後だと承知している。だが、上演するならどうしても場面を分けなくてはならず、それを五幕に割り振ったのは、シェイクスピアが死んで間もないころ、よく考えて検討した結果である。それに従っておくのは十分に理にかなうと答えられる。ともかく、区切り方がいくつもあって、どれも同じようによいというわけにはいかない。それにシェイクスピアの例を除いても、ゲーテとシラー、イギリスならシェリダンの例が残る。"
  "translation_status": "reviewed"
- "id": "becq-0294"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour conclure, je crois que l'on pourrait procurer un plaisir dramatique très vif aux spectateurs français, en montant sur nos scènes les plus belles oeuvres des théâtres étrangers, espagnols, anglais et allemands, à la condition qu'on respectât la division générale et qu'on n'altérât pas l'intégrité de chaque acte par l'introduction d'entr'actes entre les divers tableaux qui le composent. Il faudrait dans ce but prendre le parti d'une mise en scène spéciale et sommaire qui permît de faire à vue, entre les tableaux d'un même acte, tous les changements de décorations nécessités par les changements de lieux. Grâce à la continuité du spectacle, ces drames conserveraient leur physionomie propre, l'action son allure réelle et les différents moments de cette action leur marche ininterrompue. Dans ce système, il faudrait renoncer à toute somptuosité de mise en scène, autre que celle qui résulterait des décorations peintes. Je ne vois pas où serait l'inconvénient, ces drames ayant presque tous par eux-mêmes une puissance représentative très grande."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 294
    "line_start": 4211
    "line_end": 4226
  "translation_ja": "結論を言えば、スペイン、イギリス、ドイツのすぐれた演劇を私たちの舞台に載せれば、フランスの観客に鮮やかな芝居の喜びを味わってもらえると私は思う。ただし、全体の区切りを守り、一幕の中のさまざまな場面に幕間を入れて、一幕のまとまりを損なわないことが条件だ。そのためには、特別に簡素な演出を選び、同じ幕の中で場所が変わるために必要な装置の転換を、すべて観客の目の前で行えるようにしなくてはならない。舞台が途切れなければ、作品は本来の顔つきを、筋は本来の足取りを、各局面は切れ目のない進み方を保つ。このやり方では、背景画のもたらす華やかさを除いて、演出を豪華にすることはあきらめなくてはならない。だが、それの何が不都合だろう。こうした劇のほとんどは、それ自体が観客の目に物事を立ち上げるたいへんな力を持つのだから。"
  "translation_status": "reviewed"
- "id": "becq-0295"
  "section_id": "ch30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quant à nos pièces modernes, il me paraît nécessaire que les auteurs mettent un terme à la confusion qui dure depuis trop longtemps entre les actes et les tableaux, et qu'ils réservent le nom d'acte à toute suite de scènes formant un tout dramatique partiel, terminé par cette interruption du spectacle qu'on appelle un entr'acte. Dans ce système, qui est le seul logique, il faudrait faire abnégation de toute mise en scène exigeant entre les tableaux un entr'acte pour la plantation du décor."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 295
    "line_start": 4228
    "line_end": 4235
  "translation_ja": "私たちの近代劇については、作者が、長らく続きすぎた幕と場の混同に終止符を打つ必要があると思う。「幕」という名は、劇の一部分としてまとまり、幕間と呼ばれる上演の中断で終わる、一連の場面だけに用いるべきだ。このやり方こそ唯一筋が通っており、そうする以上、場と場のあいだに幕間を設けて装置を据え直さなくてはならないような演出は、あきらめる必要がある。"
  "translation_status": "reviewed"
  "annotations":

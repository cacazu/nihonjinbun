- "id": "becq-0299"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De l'imitation de la nature.--De la présentation et de la représentation d'un phénomène.--De la représentation de la mort.--Toute représentation est conditionnée par l'imagination du spectateur.--Le jugement du public est subordonné à l'idée qu'il se fait de la réalité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 299
    "line_start": 4275
    "line_end": 4278
  "translation_ja": "自然を模倣すること。現象が実際に現れることと、表象されること。死の表象。あらゆる表象は観客の想像力に左右される。観客の判断は、現実について抱く観念による。"
  "translation_status": "reviewed"
- "id": "becq-0300"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'auteur, dans la mise en scène qu'il imagine, le décorateur et le metteur en scène, dans celle qu'ils réalisent, les comédiens dans leur diction et dans leur jeu ainsi que dans leurs costumes, ont nécessairement pour légitime ambition d'arriver à une ressemblance frappante avec la nature qui est leur modèle. Tout le monde en convient; mais alors ne semble-t-il pas que cette direction imprimée à tant d'efforts divers soit contradictoire avec le jugement défavorable que l'on se croit en droit de porter sur la théorie réaliste? Ou bien y aurait-il un degré d'approximation que l'art ne doive pas franchir? Nous touchons là à l'éternelle question sur la nature et sur le but de l'art, question que je crois fort inutile de relever dans ce petit ouvrage où elle ne pourrait occuper qu'une place incidente. Je la ramènerai à des proportions plus modestes, et je la limiterai au sujet spécial que je traite. Je vais donc m'occuper de rechercher jusqu'à quel point le metteur en scène et l'acteur peuvent pousser la perfection de l'imitation, et si, dans les efforts qu'ils font pour y atteindre, ils ne doivent pas être dirigés par une méthode générale et un ensemble de règles suffisamment précises."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 300
    "line_start": 4281
    "line_end": 4298
  "translation_ja": "作者が想像する演出にも、美術家と演出家が実現する演出にも、俳優の語り方、演技、衣裳にも、手本である自然に驚くほど似せたいという、ごく正当な望みがある。その点は誰もが認める。だがそれなら、これほどさまざまな努力が同じ方向に向かう一方で、写実主義の理論を批判してよいと私たちは考えるのは、矛盾するように見えないか。それとも、芸術が現実に近づいてよい度合いに、越えてはならない線があるのだろうか。ここで芸術の本質と目的という永遠の問題に触れるが、この小さな本では付け足しの場所しかない論点を取り上げても仕方がない。もっと小さくし、ここで扱う主題だけに限ろう。演出家と俳優は模倣をどこまで完全にできるか。それを目指す努力を、一般的な方法と十分に明確な一連の規則で導くべきではないか。それを調べることにする。"
  "translation_status": "reviewed"
- "id": "becq-0301"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce problème est dominé par un mot dont il faut bien comprendre le sens et la portée; c'est le mot représentation. Tous les faits quelconques dont nous sommes chaque jour les témoins oculaires se présentent à nous; tandis que, lorsque le souvenir de ces mêmes faits nous revient à la mémoire, ceux-ci se représentent à notre esprit. Or, entre la présentation et la représentation d'un fait, il existe une différence qui consiste en ce qu'un nombre variable de détails d'importance diverse, plus ou moins bien observés dans la présentation, ne se retrouvent plus dans la représentation. En outre, si un même fait se présente à nous à différentes reprises, offrant chaque fois quelque variété dans l'ordre ou l'intensité des phénomènes, il est clair que les représentations successives que nous aurons eues de ces faits semblables varieront dans leurs caractères particuliers, mais se ressembleront dans leurs caractères généraux. Par suite, la synthèse de ces diverses représentations offrira donc à notre esprit une nouvelle représentation, rassemblant et fixant les caractères communs de toutes les représentations antérieures et laissant dans le vague une masse flottante, indécise de traits particuliers. Cette nouvelle représentation n'est autre chose que l'idée que nous avons acquise d'un certain ordre de faits."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 301
    "line_start": 4300
    "line_end": 4319
  "translation_ja": "この問題を決めるのは、一つの語である。その意味と働く範囲をよく理解しておかなければならない。「表象」という語だ。私たちが毎日、目で直接見る出来事は、私たちの前に現れる。一方、同じ出来事を思い出したとき、それは心の中に再び現れる。この後者が「表象」である。出来事が実際に現れるときと心に表象されるときの差は、前者で多少なりとも目に留まった細部が、その大事さにかかわらず、いくつか後者には残らないことにある。さらに、同じような出来事が何度か現れ、そのたびに現象の順序や強さが少し異なれば、それぞれの出来事の表象も、個々の特徴では違うが、大きな特徴では互いに似ることは明らかだ。そうして別々の表象を一つにまとめると、新しい表象が心に浮かぶ。それまでの表象に共通する特徴が集まり、定着し、個別の特徴はおぼろげな、定まりのないものとして残る。この新しい表象こそ、私たちがある種類の出来事について手に入れた観念にほかならない。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 98
      "end": 112
      "exact": "représentation"
- "id": "becq-0302"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Prenons pour exemple la représentation de la mort, qui est le phénomène naturel dont le théâtre nous offre le plus fréquemment la représentation. Il est peu de personnes qui n'aient assisté à la mort d'un être quelconque: l'un a vu mourir un vieillard, l'autre un enfant ou une femme; celui-ci a vu tomber des soldats sur le champ de bataille, celui-là a assisté à l'agonie de malades dans un hôpital; les uns ont observé la mort lente ou violente d'animaux, les autres la leur ont causée volontairement; tous enfin ont vu les mêmes phénomènes généraux se reproduire dans des conditions extrêmement variables. Si l'on ajoute à ce nombre plus ou moins grand d'expériences personnelles la description si souvent faite de ce même phénomène, on comprendra comment il s'est formé dans l'esprit de chacun de nous une idée de la mort, idée qui se compose des caractères communs à toutes les présentations de ce phénomène suprême, et qui pour chacun de nous est la même dans ses traits généraux et ne peut différer que par un certain nombre de traits particuliers d'importance secondaire. Or, c'est uniquement cette idée, ou cette image (ce qui revient au même), qui est seule artistiquement représentable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 302
    "line_start": 4321
    "line_end": 4338
  "translation_ja": "死の表象を例に取ろう。自然の現象のうち、劇場で最も頻繁に表されるのが死だからだ。生き物が死ぬのに立ち会ったことのない人は少ない。ある人は老人が死ぬところを、別の人は子どもや女性が死ぬところを見た。ある人は戦場で兵士が倒れるのを見、別の人は病院で患者の最期を看取った。動物がゆっくり死んだり激しい死を迎えたりするのを目にした者もいれば、わざとその死を引き起こした者もいる。ともかく誰もが、極めてさまざまな条件のなかで同じ大筋の現象が繰り返されるのを見てきた。それぞれの多少の経験に、この同じ現象について何度も見聞きした描写が加わると、私たち一人ひとりの心にどうして死の観念ができるか分かる。この最後の現象を見たときの共通の特徴が観念を作るので、誰にとっても輪郭は同じで、二次的な細部のいくつかにしか違いは出ない。そして芸術で表せるのは、この観念、あるいはイメージだけだ。どちらの言い方でも同じである。"
  "translation_status": "reviewed"
- "id": "becq-0303"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Transportons-nous dans une salle de théâtre où nous assisterons à un drame dans lequel un acteur ou une actrice doit nous donner le spectacle de la mort, et examinons bien les conditions du problème scénique à résoudre. L'acteur doit produire l'apparence de la mort, et son art consiste à atteindre un degré frappant de ressemblance. Mais de ressemblance avec quoi? Avec la mort d'un parent à laquelle il aura assisté dans sa famille ou d'un moribond d'hôpital dont il aura par scrupule été étudier l'agonie? Nullement; mais de ressemblance avec l'idée de la mort que possèdent les quinze cents spectateurs qu'il a devant lui. Si l'image qu'il évoque devant toute une salle est semblable dans ses caractères généraux à l'idée que chacun se fait de la mort, les quinze cents spectateurs déclareront à l'unanimité que le jeu de cet acteur est admirable de vérité, ce qui sera exact puisque l'art de l'acteur consiste précisément à objectiver devant les yeux du spectateur l'image ou l'idée que celui-ci a dans l'esprit. Et son jeu, qu'on le remarque, sera d'autant plus vrai qu'il sera moins réel, c'est-à-dire moins compliqué de détails particuliers et spéciaux, non observés par la majorité des spectateurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 303
    "line_start": 4340
    "line_end": 4357
  "translation_ja": "劇場に足を運び、俳優が人の死を見せる劇を見て、ここで解くべき舞台上の問題の条件をよく考えてみよう。俳優は死の外見を作り出さなければならない。その技は、目を見張るほどそれに似せることだ。だが何に似せるのか。家族の死に立ち会った、その死か。誠実に役を務めようと病院へ行って死に際を観察した、ある患者の死か。そうではない。目の前にいる千五百人の観客が抱く死の観念に似せるのだ。満場の前に呼び起こすイメージが、死についてそれぞれが抱く観念と大きな特徴で似ていれば、千五百人は声をそろえて、この俳優の演技は驚くほど真に迫っていると言うだろう。それは正しい。俳優の技とはまさしく、観客が心に持つ観念やイメージを、その観客の目の前に形として現すことだからだ。そして注意してほしい。その演技は現実そのものから離れるほど真に迫る。つまり大多数の観客が見たことのない、特有の細部で込み入ることが少ないほど、真に迫るのだ。"
  "translation_status": "reviewed"
- "id": "becq-0304"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si, en effet, un acteur s'ingéniait à reproduire trait pour trait telle façon extraordinaire de mourir, observée par lui-même, il s'exposerait, tout en étant plus réel, à paraître moins vrai, car l'image qu'il offrirait serait dissemblable à celle qu'ont dans l'esprit la plupart des quinze cents spectateurs. Nous pouvons donc conclure que, si le réel est le vrai dans la présentation des phénomènes, il n'est pas toujours le vrai dans la représentation de ces mêmes phénomènes. Or comme au théâtre il ne s'agit jamais que de la représentation de la vie et de tous les actes qui la composent, ni l'auteur, ni le metteur en scène, ni les acteurs ne doivent s'attacher à reproduire la réalité, mais seulement l'image qui est la représentation idéale du réel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 304
    "line_start": 4359
    "line_end": 4369
  "translation_ja": "実際、俳優が自分で見た珍しい死に方を一つ一つそっくり再現しようと工夫すれば、より現実的ではあっても、かえって真に迫らなく見えるおそれがある。見せたイメージが、千五百人の大半の心にあるものとは似ていないからだ。こう結論できる。現象が実際に現れるとき、現実であることは真実であることだが、同じ現象が表象されるときは、現実どおりであればいつも真実というわけではない。劇場では人生と、それを作るすべての行為が表象されるだけだ。したがって作者も演出家も俳優も、現実そのものを再現しようと努めるのではなく、それを理想化して表象するイメージだけを再現しようとすべきである。"
  "translation_status": "reviewed"

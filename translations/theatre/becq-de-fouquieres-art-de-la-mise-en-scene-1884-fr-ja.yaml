  "source_text": "On se demande, non sans inquiétude, où s'arrêtera la mise en scène? Sans doute, il y a des limites qu'elle ne pourra franchir, mais elle continuera à empiéter de plus en plus sur le domaine littéraire et déjà l'action qui relie tous les tableaux d'un drame est ténue et bien fugitive. Un obstacle qu'il lui faudra tourner est précisément la grandeur de la scène. En faisant monter les humbles et les déshérités sur le théâtre, en étalant à nos yeux les misères physiques et morales des dernières classes de la société, elle ne pourra rapetisser la scène à la taille d'une mansarde ou d'un bouge. Quoi qu'elle fasse, la chambrette de Jenny ou la hutte du chiffonnier sera toujours plus grande que le salon d'un ministre. Toutefois la complaisance du public est admirable, et son imagination, dont l'école réaliste sera forcée d'accepter le secours, consentira à ramener la grandeur de la scène aux proportions que désirera l'auteur: l'espace et le temps resteront toujours au théâtre forcément conventionnels."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 339
    "line_start": 4992
    "line_end": 5006
  "translation_ja": "演出はどこで止まるのだろう。多少の不安を抱かずにはいられない。無論、越えられない限界はある。だが演出は、これからも文学の領域をますます侵食してゆく。すでに、芝居のすべての場面をつなぐ筋は細く、消え入りそうである。とりわけ舞台の広さという障害は、どうにか回避しなければならない。貧しく恵まれぬ人々を舞台に上げ、社会の最下層の人々の身体と心の悲惨をこれ見よがしに並べても、舞台を屋根裏部屋やいかがわしい安宿ほどに小さくはできない。何をどうしようと、ジェニーの小部屋やくず拾いの小屋は、大臣の応接間より広くなってしまう。もっとも、見事なまでに物わかりのよい観客はいる。写実派は結局、その観客の想像力の助けを借りるしかない。観客の想像力は、舞台の大きさを作者の望む割合まで縮めることをいとわないからだ。演劇の時空はどうしても取り決めに従うほかない。"
  "translation_status": "reviewed"
- "id": "becq-0340"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais l'hétérogénéité des rôles continuera à s'accentuer, et c'est là qu'est le danger croissant de l'art dramatique; car, si l'on veut appliquer sa pensée à suivre cette progression ininterrompue, on verra peu à peu l'art descendre des hauteurs morales où règnent les idées générales, s'abaisser de plus en plus à mesure que les images se revêtiront de caractères plus particuliers, s'étendre à toutes les réalités, s'émanciper de toutes les conditions de règle, de choix, d'élection, et aller finalement s'absorber et disparaître dans la vie elle-même. C'est qu'en effet la croissance constante de l'hétérogénéité a pour limite extrême l'anéantissement de l'art. D'autres plus complaisants diront que ce sera la vie qui, en absorbant l'art, en recevra une beauté nouvelle. C'est bien loin pour décider. Mais d'ici là, quoi qu'il arrive, l'art dramatique aura ses jours d'épreuve. En ressortira-t-il rajeuni? C'est une grave question que nous examinerons dans les derniers chapitres de cet ouvrage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 340
    "line_start": 5008
    "line_end": 5022
  "translation_ja": "けれども、役の相互の異質性はいよいよ増す。劇作にとって増大する危険は、そこにある。この進行を頭の中でたどっていけば、芸術はまず一般的な観念の支配する精神の高みから下り、イメージがますます個別の特徴を帯びるにつれ、ますます低くなるのがわかる。あらゆる現実に手を伸ばし、規則や選択、選別といった条件からすべて解放され、ついには人生そのものに吸い込まれて消えてしまう。じつに、異質性が増え続けると、その極限には芸術の消滅があるのだ。もっと好意的な人は、芸術をのみ込んだ人生のほうが新しい美しさを受け取るのだろう、と言うかもしれない。まだあまりに先のことなので、判定はできない。だがそれまでに何が起ころうと、劇作には試練の日々があるだろう。そこを切り抜け、若返って出てこられるのか。これは本書の残りの章で検討する重い問題である。"
  "translation_status": "reviewed"
- "id": "becq-0341"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous entrons à peine dans la voie fatale, et c'est d'hier que l'antique homogénéité se désagrège: elle n'est pas encore réduite à l'état de poussière dramatique. D'ailleurs, si l'art nouveau est plein de dangers, il n'est pas toujours sans charmes, et nous nous laissons volontiers séduire de plus en plus par tous les traits, si exigus qu'ils soient, qui portent l'empreinte de la vérité. Nous-même, nous nous apercevons que notre esprit est moins homogène que celui de nos pères et qu'il est en proie à l'esprit d'analyse. Nous goûtons donc un art que nos pères n'auraient pas apprécié, et, en dépit de son infériorité, nous éprouvons des charmes secrets à pénétrer dans les replis des êtres et des choses. Malheureusement l'apparent et le matériel nous distraient de l'âme humaine: à trop partager son coeur, on abaisse l'idée que l'on se faisait de l'amitié. Au théâtre, l'artiste vise un but moins élevé; il a mis l'idéal à sa portée. Mêlé à la foule, il imite Malherbe qui allait étudier sa langue au port au foin, et, à la poursuite du réel, il saisit la vérité partout où il la rencontre, dans les assommoirs aussi bien que dans les alcôves des femmes perdues. Certes il y fait des trouvailles originales; et il met en saillie les caractéristiques de tous ces personnages nouveaux dans le monde de l'art et jusqu'à celles même des métiers les moins avouables. Je ne méprise nullement l'effort de l'artiste en quelque sens qu'il s'exerce; cet effort n'est ni vain ni puéril, mais c'est l'histoire des chercheurs d'or: après avoir épuisé les mines aux filons éblouissants, ils tamisent la poussière d'or mêlée au limon que charrient les fleuves."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 341
    "line_start": 5024
    "line_end": 5047
  "translation_ja": "私たちは、まだこの避けがたい道に入ったばかりだ。昔からの均質さが崩れ始めたのも、つい昨日のことにすぎない。まだ劇のちりにまで砕け散ったわけではない。それに新しい芸術は、危うさに満ちているとはいえ、魅力のないものではない。どれほどわずかでも、真実の刻印を帯びたところには、私たちはますます喜んでひきつけられる。自分たちの精神も先人ほど均質でなく、分析に駆り立てられていると気づくのだ。先人なら認めなかった芸術を私たちは味わい、その芸術が劣っているとしても、人やもののひだの内側に分け入ることに、ひそかな魅力を感じる。不幸にして、外見と物に気を取られると、私たちは人間の魂から目をそらす。心をあまり多くに分かてば、友情について抱いていた考えも低いものになる。演劇では芸術家の目標が以前より低くなった。理想を自分の手が届くところに置いたのだ。群衆に交じり、干し草の船着き場へ言葉を学びに行ったマレルブのまねをする。現実を追い、安酒場であれ身を持ち崩した女たちの閨房であれ、見つけたところで真実をつかまえる。たしかに独創的な発見もする。芸術には初めて現れる人々の特色、口にするのをためらうような職業の特色までも浮かび上がらせる。芸術家の努力を、その向かう先がどこであれ軽んじるつもりはない。無駄でも子供じみてもいない。だがそれは、まばゆい鉱脈を掘り尽くしたあと、川が運ぶ泥に混じった砂金をふるい分ける、金採りたちの話に似ている。"
  "translation_status": "reviewed"
- "id": "becq-0342"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Peu à peu le métier dramatique s'encombre de formules qui vont en se compliquant de plus en plus, et les règles d'autrefois se réduisent à une foule sans cesse grossissante de procédés. C'est là qu'est le danger immédiat; car l'homme est l'esclave des choses plus qu'il ne le croit. Son physique et jusqu'à son moral, jusqu'à son intelligence, sont des matières plastiques qui prennent aisément la forme des moules où il les enferme. Le réel des pièces modernes disloque le talent des comédiens; et quelques-uns gardent à perpétuité une souplesse d'acrobate. Dans l'intérêt de l'art moderne, dans l'intérêt même des plaisirs du spectateur, il est nécessaire de mettre un frein à cette poursuite aveugle du réel, et surtout à son influence sur le théâtre. Or il y a un remède efficace à la dégénérescence théâtrale qui nous menace; et ce remède c'est le retour fréquent au répertoire classique. Nous avons parlé plus haut de son influence sur le goût public, de son importance au point de vue du plaisir le plus pur qu'il nous soit donné d'éprouver au théâtre. Nous n'y reviendrons pas; mais il nous reste à dire un mot de son influence sur le talent des comédiens et de son importance au point de vue du métier dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 342
    "line_start": 5049
    "line_end": 5066
  "translation_ja": "劇作の技は、少しずつ、ますます複雑な決まりきった型にふさがれてゆき、昔の規則はひたすら数が増す一群の手法に成り下がる。差し迫った危険はそこにある。人は、自分で思うよりも物に支配されているからだ。肉体も心も知性さえも、押し込められた型の形をたやすく取る、可塑的な素材である。近代劇の現実は俳優の技量のまとまりを壊し、中にはいつまでも曲芸師のような身のこなししかできなくなる者もいる。今日の芸術のためにも、観客自身の喜びのためにも、現実を求めてやみくもに走ること、とりわけそれが舞台にもたらす影響には、歯止めをかけなければならない。いま演劇を脅かす堕落には、効き目のある薬がある。古典の演目をたびたび取り上げることだ。それが世の好みに及ぼす影響と、劇場で得られる最も純粋な喜びにとっての大切さはすでに述べた。繰り返さず、俳優の技量への影響と、劇作の技にとっての重要さを、ひと言述べておこう。"
  "translation_status": "reviewed"
- "id": "becq-0343"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si le lecteur a suivi avec quelque attention ce que nous avons dit sur la manière dont l'acteur procède à la composition d'un rôle, sur l'image initiale qui se dresse dans son esprit et sur toute la série d'images associées, il se rappellera que ces images seront d'autant plus marquées de traits particuliers que le personnage dont il revêt la personnalité est un type moins général. En suivant le développement historique du théâtre, qui se conforme aux révolutions sociales, on voit les types de théâtre se multiplier et se compliquer à mesure qu'on s'approche de l'époque actuelle, et au contraire diminuer et se simplifier à mesure qu'on remonte dans le passé. Plus les types sont généraux, et c'est le cas de la tragédie et de l'ancienne comédie, plus les images initiales sont générales. Pour traduire sur la scène les personnages classiques, le comédien doit donc éviter de marquer son attitude, son jeu, sa diction de trop de détails particuliers et caractéristiques, car il n'a que fort rarement à tenir compte des rapports du physique ou du moral avec une fonction sociale, une profession déterminée, une manière particulière de vivre. Tout le matériel, tout l'accidentel et le circonstanciel de la vie réelle n'entrent que pour fort peu de chose dans la représentation des personnages classiques. Ce sont surtout des passions héroïques ou criminelles et de grandes infortunes dans la tragédie, des vices et des travers généraux dans la comédie, qui demandent à être traitées synthétiquement, tandis que le théâtre moderne exige du comédien un esprit d'analyse toujours en éveil. La tragédie de Corneille et de Racine et la comédie de Molière commandent donc, sans appuyer ici sur l'étude psychologique des rôles, une grande largeur de diction, une élocution très nette dégagée des à peu près de la conversation courante, une science du geste d'autant plus grande qu'il est plus rare et qu'il a un rapport plus étroit avec le texte poétique, une attitude qui n'a jamais le droit d'être vulgaire ou qui, dans l'emportement même des passions, ne doit jamais manquer de dignité. Les acteurs qui abordent ces rôles sont obligés d'exercer sur eux une contrainte sévère, de maîtriser tout mouvement qui pourrait trahir leur personnalité moderne, de tenir enfin leur être tout entier sous la dépendance de la passion dont ils prennent le langage ou du caractère général aux impulsions duquel se plie l'action dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 343
    "line_start": 5068
    "line_end": 5102
  "translation_ja": "俳優がどのように役を作るか、心に最初に立ち上がる像と、それにつながってゆく一連の像についての話を注意深くお読みなら、俳優が身に引き受ける人物が普遍的な類型から離れるほど、それらの像には個別の特徴が刻まれることを覚えておられるだろう。社会の変革に沿って演劇が歴史的に変わるのをたどると、今日に近づくほど舞台の類型は増えて複雑になり、過去をさかのぼるほど数が減って単純になる。悲劇や昔の喜劇のように、類型が普遍的であるほど、最初の像も普遍的になる。したがって古典の人物を舞台に表す俳優は、姿勢、演技、台詞回しに、個人的で独特な細部を刻みすぎないようにしなければならない。身体や心と、社会での働き、特定の職業、独自の生き方との関係を考慮することは、ごくまれだからだ。現実の生活の物質的なこと、たまたまそうなったこと、個々の事情に属することは、古典の人物の表現にはごくわずかしか入らない。悲劇で中心になるのは英雄的あるいは罪深い情念と大きな不幸、喜劇なら誰にも通じる悪癖や欠点であり、それらは全体として扱うことを求める。近代劇が俳優に求めるのは、いつも働いている分析精神だ。コルネイユとラシーヌの悲劇、モリエールの喜劇には、それゆえ、役の心理の研究はさておき、ゆとりのある台詞回し、普段の会話の曖昧さを離れた明瞭な発音が要る。身振りは少ないほど、また詩の言葉に切実に結びつくほど、熟練を要する。立ち居振る舞いは、どんな情念の高ぶりの中でも俗に流れず、品位を失ってはならない。これらの役に取り組む俳優は自分を厳しく律し、自分が近代の人間であることを露呈する動きをことごとく抑え、自分の全存在を、言葉を借りて表す情念か、劇の展開をその衝動に従わせる普遍的な性格に従わせねばならない。"
  "translation_status": "reviewed"
- "id": "becq-0344"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Largeur, simplicité, sobriété, mais précision dans les effets, telle est la loi de composition de tous les rôles classiques. Il n'y a pas de meilleure école pour les comédiens; et c'est l'influence permanente de l'ancien répertoire qui fait la supériorité incontestable de la Comédie-Française sur tous les autres théâtres. Tour à tour, entre les représentations d'une pièce moderne qui doit garder l'affiche pendant trois ou quatre mois, chaque sociétaire reprend la tunique d'Hippolyte ou les rubans verts d'Alceste, reforme son corps, son attitude, sa démarche, ses gestes à la sévérité sculpturale de l'antique ou à l'aisance aristocratique du grand siècle, et accorde de nouveau son oreille aux harmonies du vers de Racine ou aux larges mouvements aisément cadencés de la prose de Molière. Les comédiens qui passent par ces épreuves se corrigent ainsi incessamment du maniéré, du cherché, des gestes inconscients et des défauts de diction inhérents à la conversation courante. Quand ils abordent les rôles du théâtre moderne, ils en élargissent les effets, les haussent en quelque sorte d'un ton, et ne sont pas sans influence sur les auteurs qui écrivent pour eux et qui par suite élèvent leur idéal et celui même de la foule qui les applaudit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 344
    "line_start": 5104
    "line_end": 5122
  "translation_ja": "幅の広さ、簡潔さ、節度、そして効果の正確さ。これが古典のあらゆる役を作る法則である。俳優にこれほどよい学校はない。古い演目がつねに影響を及ぼすからこそ、コメディ・フランセーズは他のどの劇場にもまさることが疑いない。三、四か月は看板を外せない近代劇の上演の合間に、劇団の正団員は代わる代わる、イポリットの衣をまとい、アルセストの緑のリボンを着ける。身体、姿勢、歩き方、身振りを、古代の彫刻の厳格さや十七世紀の貴族らしいゆとりに合わせて作り直す。ラシーヌの詩句の調べや、のびやかに打つモリエールの散文の大きなうねりにも、ふたたび耳を調律する。そうした鍛錬を経る俳優は、もったいぶった癖、わざとらしさ、無意識の身振り、ふだんの会話につきものの台詞の悪い癖を、絶えず直す。近代劇の役に戻ると、演技をおおらかにし、いわば一段高い調子に上げる。自分たちのために書く作家にも影響を及ぼし、作家は理想を高め、喝采する群衆の理想まで高めるのである。"
  "translation_status": "reviewed"
- "id": "becq-0345"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est par le commerce qu'elle entretient avec les grands écrivains du XVIIe siècle que la Comédie-Française maintient dans sa troupe d'élite les belles traditions et les principes les plus élevés de l'art dramatique, qu'elle agit à son tour sur les productions de l'esprit, et qu'elle exerce une influence intellectuelle et morale, non seulement sur la société française, mais encore sur l'Europe entière et sur tout le monde civilisé. C'est presque toujours à son école, au moins indirectement, que se sont formés les comédiens qui vont secouer le rire sur notre triste univers, et prouver par leur présence sur tous les points du globe l'universalité de la langue française et le charme encore triomphant de l'esprit français."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 345
    "line_start": 5124
    "line_end": 5134
  "translation_ja": "コメディ・フランセーズは、十七世紀の大作家たちとたえずつき合うことで、一流の一座の中に美しい伝統と劇作の最も高い原理を保つ。そして今度は自ら精神の生み出す作品に働きかけ、フランス社会ばかりでなく、ヨーロッパ全体と文明世界のすべてに、知的・道徳的な影響を及ぼす。私たちのもの悲しい世の中に笑いを振りまき、地球の隅々に姿を見せることで、フランス語の普遍性と、今なお人を征服するフランス精神の魅力を示す俳優たちは、ほとんどいつも、少なくとも間接的には、この学校で育ってきたのだ。"
  "translation_status": "reviewed"
- "id": "becq-0346"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Concluons donc que dans notre société démocratique, où le nombre tuera l'idéal, s'il n'est conquis par lui, le maintien du répertoire classique à l'Odéon et à la Comédie-Française (joint à une réformation urgente de l'enseignement du Conservatoire) est en quelque sorte une mesure de rénovation sociale, de relèvement intellectuel et moral et de salut artistique. Mais ce n'est que par de larges subventions qu'on peut leur imposer le maintien de ce répertoire, qui exige des sacrifices permanents et d'incessants labeurs. Le jour où le Corps législatif, dans un esprit d'ignorance ou d'aveuglement, supprimerait ou diminuerait seulement ces subventions, il porterait du même vote un coup funeste à l'art français; il assurerait à bref délai l'envahissement de tous les théâtres par les adeptes les moins scrupuleux de l'école, réaliste et tarirait à l'avance dans les yeux de nos enfants la source des plus douces larmes qui se puissent verser ici-bas."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 346
    "line_start": 5136
    "line_end": 5149
  "translation_ja": "こう結論しよう。民主社会では理想が多数の心をつかまなければ、数の力に殺されてしまう。そこでオデオン座とコメディ・フランセーズが古典の演目を保つことは（音楽・演劇学校の教育を早急に改めることと合わせて）、いわば社会を新しくし、知性と道徳を立て直し、芸術を救う一策なのである。ただし、絶えざる犠牲と労苦を要する演目を守らせるには、十分な助成を与えるしかない。議会が無知か盲目に駆られてその助成を打ち切り、あるいは減らすだけでも、その一票でフランスの芸術に致命的な打撃を与えるだろう。ほどなく写実派の最も無節操な信奉者があらゆる劇場を占領するのを確実にし、この世で流しうる最も優しい涙の泉を、子供たちの目に先回りして涸らしてしまうことになる。"
  "translation_status": "reviewed"
- "id": "becq-0347"
  "section_id": "ch35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Abandonnons cette perspective heureusement lointaine et reprenons pied sur la scène. Rappelons que, parmi les acteurs qui, en dehors de la Comédie-Française, forcent l'admiration du public, les meilleurs sont ceux qui, au Conservatoire ou à l'Odéon, ont eu le bonheur de traverser le répertoire classique. Que ne peuvent-ils aller de temps à autre s'y retremper librement, y refaire leurs forces, s'y perfectionner dans l'art de bien dire; et, après avoir trop longtemps joué un personnage laid et vulgaire, que ne peuvent-ils, comme Mercure, s'en aller au ciel, avec de l'ambroisie, s'en débarbouiller tout à fait!"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 347
    "line_start": 5151
    "line_end": 5159
  "translation_ja": "幸いまだ先のこの光景は措き、足元をもう一度舞台に戻そう。コメディ・フランセーズの外で観客に否応なく感嘆させるような俳優のうち、最もすぐれた者は、コンセルヴァトワールかオデオン座で古典の演目を学ぶ幸運に恵まれた者だと思い起こそう。ときどき自由に立ち戻り、力を養い直し、美しく語る技を磨くことができればよいのに。醜く下品な人物をあまり長く演じたあとには、メルクリウスさながら天へ昇り、神々の食物で汚れをすっかり洗い落とせたらよいのに！"
  "translation_status": "reviewed"
- "id": "becq-0348"
  "section_id": "ch36"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAPITRE XXXVI"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 348
    "line_start": 5163
    "line_end": 5163
  - "source_id": "paper-1884-ia"
    "precision": "page"

- "id": "becq-0269"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je ne puis, on le comprendra, qu'effleurer un sujet très complexe dans lequel chaque cas demanderait à être étudié en lui-même, ce qui serait d'un détail infini. Mais le peu que j'ai pu dire suffit à montrer que le mouvement scénique, la disposition et le balancement des groupes, les modifications successives des plans qu'occupent les personnages constituent un art qui s'appuie sur la connaissance psychologique du sujet. Il arrive souvent qu'une disposition scénique se trouve en contradiction avec la valeur relative des personnages: dans ce cas, l'effet sur lequel on comptait ne se produit pas, parce que la mise en scène a contrarié et amoindri l'effet dramatique. C'est pourquoi le sens particulier que les poètes ont de leur oeuvre leur donne une autorité dont il ne faut pas s'affranchir légèrement quand il s'agit de régler la mise en scène; et c'est pourquoi l'instinct dramatique est de toutes les qualités celle qui est la plus précieuse dans un metteur en scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 269
    "line_start": 3795
    "line_end": 3808
  "translation_ja": "お分かりのとおり、これは入り組んだ主題で、一つひとつの例をその場合に即して調べるなら、細部はきりがない。ここでは表面に触れることしかできない。だがここまで少し述べたことだけで、舞台上の動き、人物の組の配置と釣り合い、人物がいる奥行きの順次の変化は、題材の心理を知ることに支えられる一つの芸術だと分かる。舞台上の配置が、人物どうしの重要さと矛盾することはしばしばある。その場合、演出が戯曲の効果に逆らい、弱めてしまうので、予定していた効果は出ない。このため、劇作家が自作について持つ特別な感覚には権威があり、演出を決めるとき、たやすくそれを無視してはならない。またこのため、劇を感じ取る本能は、演出家に求められる資質の中で最も貴重なのである。"
  "translation_status": "reviewed"
- "id": "becq-0270"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je reviens maintenant, avant de clore ce chapitre, à la mise en scène de Phèdre, qui me fournira l'occasion de présenter une application des principes de statique théâtrale. La disposition scénique du premier acte ne me paraît pas heureusement conçue. La place qu'occupe Phèdre, à gauche de la scène et non loin de la zone invisible, n'est nullement en rapport avec l'importance psychologique et dramatique du personnage dans cet acte. C'est d'ailleurs une faute, à mon sens, que de faire entrer Phèdre par la gauche et de la faire asseoir du même côté, de telle sorte que l'acte s'achève sans que le personnage principal, non seulement de cet acte, mais encore du drame tout entier, ait mis le pied sur le centre optique. Cette place à gauche est celle qui lui conviendra au cinquième acte, lorsqu'elle sort mourante de ses appartements. Les moments lui sont précieux, c'est pourquoi Phèdre, soutenue par ses femmes, s'affaisse sur le premier siège à gauche qui se trouve à sa portée. Au surplus à ce moment, et par le fait seul qu'elle meurt et que, sinon son corps, son âme et son esprit du moins quittent la scène, tout le poids du drame retombe sur Thésée qui alors occupe justement le centre optique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 270
    "line_start": 3810
    "line_end": 3827
  "translation_ja": "この章を閉じる前に、『フェードル』の演出へ戻ろう。舞台配置の静力学の原則を適用した一例を示せるからだ。第一幕の配置は、うまく考えられているとは思えない。舞台の左、死角からそう遠くないフェードルの位置は、この幕で彼女が占める心理上、劇の上での重要さと、まったく釣り合わない。それに、フェードルを左から登場させ、同じ左に座らせたのは誤りだと思う。その結果、この幕だけでなく全篇の主人公が、視線の中心に一歩も立たないまま幕が終わる。左のこの場所がふさわしいのは、第五幕でフェードルが死にかけて部屋を出るときだ。そのとき時は一刻を争うので、フェードルは侍女に支えられ、左で手の届く最初の腰掛けに崩れ落ちる。さらにこのとき、彼女が死に、体はともかく、魂と精神が少なくとも舞台を去るということ自体によって、劇の重みはすべてテゼに移る。そこでテゼはまさに、視線の中心を占めるのである。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 73
      "end": 79
      "exact": "Phèdre"
- "id": "becq-0271"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais la situation est absolument différente au premier acte. Si d'ailleurs mes souvenirs me servent bien, il me semble que jadis Rachel venait occuper précisément le centre, optique, qui est la place psychologique de Phèdre, et celle qui s'offre à elle le plus naturellement. En effet, Phèdre sort de ses appartements et veut revoir la lumière du jour; mais à peine a-t-elle fait quelques pas, soutenue par ses femmes, que ses forces l'abandonnent. C'est sur la ligne optique, qu'épuisée et ne se soutenant plus, elle s'arrête soudain et refuse d'aller plus loin. Dès lors, il est inadmissible que ses femmes la traînent jusqu'à ce siège qui est à gauche, lorsqu'il leur est si facile et si naturel de l'approcher. Alors Phèdre se laisse aller sur ce siège vers lequel elle n'aurait pas eu la force de marcher; et c'est ainsi, par le jeu de scène le plus simple, que Phèdre se trouve assise au centre optique, concentrant sur elle tous les regards des spectateurs de même qu'elle concentre sur elle tout l'intérêt du drame."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 271
    "line_start": 3829
    "line_end": 3843
  "translation_ja": "だが第一幕の状況は、まったく異なる。記憶違いでなければ、昔はラシェルが、ちょうど視線の中心に来たように思う。そこは、フェードルが心理上占める場所であり、しかも最も自然に彼女に開かれる場所だ。実際、フェードルは部屋を出て、日の光を再び見たいと思う。だが侍女に支えられて何歩か進むと、もう力が続かない。疲れきって、自分では体を支えられず、不意に止まり、もう進もうとしなくなるのは、視線基準線の上である。そうであれば、腰掛けを近くまで持ってくるほうがずっと簡単で自然なのに、そこから左にある腰掛けまで彼女を引きずっていくことは、認めがたい。そこでフェードルは、そこまでは歩く力もなかったその腰掛けに体を預ける。この、ごく単純な舞台上の動きだけで、フェードルは視線の中心に腰を下ろせる。劇全体の関心を一身に集めるように、観客すべての視線も、一身に集めるのである。"
  "translation_status": "reviewed"
- "id": "becq-0272"
  "section_id": "ch28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Comme on a pu s'en rendre compte, une grande partie de la science de la mise en scène consiste dans l'oscillation des jeux de scène autour du centre optique ou à droite et à gauche de la ligne optique. C'est une science comparable à celle qui préside à la composition et à la disposition d'un tableau. Quand il s'agit d'une scène complexe à plusieurs personnages, auxquels s'ajoute une figuration nombreuse, il faut déterminer le centre de gravité de la scène, si je puis me servir de cette expression, de façon qu'il se trouve le plus rapproché possible du centre optique. On sent bien d'ailleurs qu'il ne s'agit point ici d'équilibre entre des nombres, non plus que d'une sorte d'équilibre visuel, mais d'un équilibre moral et dramatique. La mise en scène, considérée à ce point de vue, est non seulement un art, mais une science dont le fondement est pour ainsi dire mathématique. Tous les arts se rejoignent et ont pour point de départ commun les lois mêmes de la nature. Un metteur en scène et un directeur de théâtre doivent donc posséder une connaissance étendue des principes des arts et surtout de leurs fondements scientifiques, car ceux-ci sont dans l'art théâtral et particulièrement dans la mise en scène d'une application constante. Pour terminer par un exemple qui illustre la théorie, je ferai observer que la Comédie-Française doit certainement à la compétence artistique de son administrateur actuel la perfection de mise en scène qui depuis plusieurs années fait l'admiration du public."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 272
    "line_start": 3845
    "line_end": 3866
  "translation_ja": "ここまで見たように、演出の技術の大きな部分は、舞台上の動きを、視線の中心の周りか、視線基準線の左右に振ることから成り立つ。絵画の構図や配置を律する技術と比べられる。何人もの人物に、多くの群衆役まで加わる複雑な場面では、こう言ってよければ、その場面の重心を決め、視線の中心にできるだけ近づけなければならない。ただし釣り合わせるのは人数ではなく、見かけの釣り合いを取るということでもない。心の上で、戯曲の上での釣り合いである。この見方をすれば、演出は芸術であるだけでなく、土台がいわば数学的な一つの科学でもある。すべての芸術は互いに出会う。そして自然そのものの法則から出発する点が、共通している。したがって演出家と劇場の責任者は、諸芸術の原則、とりわけ科学的な基礎を、広く知らなければならない。その基礎は劇芸術で、とくに演出で、絶えず用いられるからである。最後に理論を示す一例を挙げておこう。この数年来、観客を感嘆させてきたコメディ・フランセーズの演出の完成度は、疑いなく、今の総支配人の芸術に関する見識のおかげである。"
  "translation_status": "reviewed"

    "line_start": 5322
    "line_end": 5354
  "translation_ja": "この芸術上の変革にはきっと深い原因がある。それは、人生を、また物理的・知的・道徳的なすべての力が内部で溶け合う人間という存在を、さらに高い水準で模倣する必要だったように思う。それまで劇作は、人物を人間を取り巻くあらゆる自然の力から取り除き、観念の力にだけ従わせていた。音楽は、人物を感覚の力に従わせる。いつしか音が感情を動かす力を文学の劇へ入り込ませた変革は、観念が想像力に働く力を音楽劇へ入り込ませた変革と、同じ種類のものらしい。こうした変革はゆっくり起こり、舞台転換のように突然には起こらない。自然でも同じである。水のしずくは一滴ずつ落ちても目に見える跡を残さないが、しばらくすると、絶え間なく水が落ちたために、この上なく硬い岩までえぐられていることに気づく。芸術でも、変化の進展を一歩ずつ追うことはできないが、ときどき進んだ距離を測ることはできる。今日、少しでも注意すれば目を引くのだが、私たちの芝居で音楽が大きな役目を果たし、それ自身の力を帯びて現れることは疑えない。あるときは人物の心に直接働き、あるときは心を動かされながら声に出せない魂に、自分の声を貸す。ときには音楽そのものが劇の俳優となり、文学による語りでは及ばない、まことに魔法のような強さと正確さで、私たちの目に像を呼び起こし、描き出す。一言で言えば、音楽は劇の力となった。そのようなものとして、筋に加わり、主人公の内に生む感情を通じて筋を進め、主人公がとらわれ、その声では語るのが遅すぎるか語りきれない感情を、私たちの中へ運ぶ。しかも、いつも題材の欠かせない一部であり、いわば触れられず目にも見えない登場人物である。それゆえ、この新しく詩的な登場人物をどう舞台に出すかを、現代の作家たちがどう考えているか、例を用いてできるかぎり明らかにしなければならない。"
  "translation_status": "reviewed"

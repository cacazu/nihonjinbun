- "id": "becq-0319"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans les chapitres précédents, nous avons parlé du jeu de scène, en le considérant comme un acte isolé, détaché d'un ensemble dramatique ou comique. Nous avons pris l'action dans un moment particulier. Nous devons maintenant examiner, au moins succinctement, la mise en scène d'un rôle et son rapport avec le développement de l'action, mais en nous préoccupant exclusivement de l'aspect du rôle et en laissant de côté tout ce qui touche à la déclamation."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 319
    "line_start": 4603
    "line_end": 4609
  "translation_ja": "前の章々では、舞台上の一つの動きを、悲劇や喜劇の全体から切り離した行為として考えた。筋のある一局面だけを取り出したのである。今度は少なくとも手短に、役を舞台上で作ることと、筋の進み方との関係を調べなければならない。ただし、関心を役がどう見えるかだけに限り、せりふの語り方に関わることは脇に置く。"
  "translation_status": "reviewed"
- "id": "becq-0320"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il n'y a, dans les arts, qu'un petit nombre de principes; nous ne devons donc pas ici rechercher et rencontrer de lois esthétiques différentes de celles que nous avons déjà mises en lumière. Ce qui, d'ailleurs, fait l'excellence d'une règle, c'est de ne pas être restreinte à un fait spécial: l'exiguïté du cercle où se meut une règle est un signe certain d'empirisme; et, dans ce cas, la règle prend le nom de procédé. Les procédés, je l'accorde, ont leur utilité et même leur prix, surtout lorsqu'ils portent ce beau nom de traditions, usité à la Comédie-Française. Dès qu'une pièce a fourni une longue carrière, et lorsque des acteurs ont particulièrement brillé dans certains rôles, il est très compréhensible que les nouveaux venus, qui plus tard sont chargés de reprendre ces rôles, s'ingénient à reproduire les effets qui ont si bien réussi à leurs prédécesseurs. La façon de dire ces rôles et d'exécuter tel ou tel jeu de scène, de faire tel geste, de prendre telle attitude, de faire même telle correction au texte, etc., donne donc lieu à ce qu'on appelle des traditions, soit que ces procédés aient été scrupuleusement notés, soit que le nouveau venu ait pu se rendre compte par lui-même du jeu de son prédécesseur, soit qu'ils se soient uniquement transmis de mémoire. Il y a, à la Comédie-Française, un assez grand nombre de jeux de scène qui n'ont pas d'autre raison d'être, et dont on se contente de dire pour les justifier qu'ils sont de tradition. En résumé, la tradition est une expérience accumulée dont il faut tenir grand compte. Il y a certaines façons exquises de dire, certains gestes empreints d'une éloquente grandeur, qui sont tout ce qui nous reste des grands artistes du passé. Toutefois, il ne faut pas que la tradition soit un esclavage, car nous avons vu précisément que quelques rôles peuvent changer d'aspect avec le temps dans la mesure où les idées elles-mêmes des spectateurs se modifient sous l'influence de circonstances fatales ou fortuites. Il faut donc maintenir la tradition au-dessous de la règle, et se dégager du procédé dès qu'on vient à s'apercevoir qu'il est en contradiction avec l'idée actuelle. C'est donc ici la règle qui nous importe, et ce sont uniquement les principes qui doivent nous arrêter. Un ouvrage spécial sur les traditions conservées à la Comédie-Française serait d'un très grand intérêt; mais il ne pourrait être entrepris que par quelque esprit attentif, appartenant depuis longtemps à la maison de Molière. On pourrait y joindre un assez grand nombre de faits extraits de mémoires ou conservés dans les ouvrages qui concernent l'art dramatique. Je serais, quant à moi, absolument incompétent en pareille matière. C'est donc là un sujet que je dois écarter de ma route; et je reviens à l'examen des principes, auquel d'ailleurs doit seul s'attacher un ouvrage théorique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 320
    "line_start": 4611
    "line_end": 4651
  "translation_ja": "芸術に原則はほんのいくつかしかない。ここでも、これまで明らかにしたのとは異なる美学の法則を探し、見つけるべきではない。そもそも、優れた規則であるのは、ある一つの出来事だけに限られないからだ。規則が通用する範囲の狭さは、もっぱら経験に頼ったものだと示す確かな印で、その場合は、規則でなく「やり方」と呼ぶ。むろん、やり方にも使い道があり、値打ちすらある。コメディ・フランセーズで用いられる「伝統」という美しい名で呼ばれる場合はなおさらだ。ある芝居が長く演じられ、ある役で以前の俳優の演技がひときわ光っていたなら、後年その役を引き継ぐ者が、先人の大成功を収めた効果を再現しようと工夫するのはよく分かる。その役をどう語るか、どの動作、どの身ぶりをし、どんな姿勢を取り、ときには本文をどこで直すか。こういったことから、いわゆる伝統が生まれる。やり方が細心に記録された場合も、引き継ぐ者が先人の演技を自分で確かめられた場合も、ただ記憶を通じて伝わった場合もある。コメディ・フランセーズには、そういう経緯以外には存在理由がなく、伝統だと言うだけで正当化される舞台の動きがかなりある。\n要するに、伝統は積み重ねた経験であり、大いに考慮すべきものだ。みごとな語り方、雄弁なほどの気品をたたえた身ぶり。昔の偉大な芸術家が残したものはそれだけになった場合もある。だが、伝統の奴隷になってはならない。いくつかの役は、必然や偶然の事情の影響で観客の観念そのものが変わるのにつれて、時とともに見え方を変える、とまさに見てきたからだ。だから伝統は規則の下に置き、今の観念に反すると気づいたら、そのやり方から離れる。ここで大事なのは規則であって、私たちが足を止めるべきなのは原則だけである。コメディ・フランセーズに伝わる伝統だけを扱う本があれば、たいへん興味深いだろう。ただし、モリエールの劇場に長く属してきた、物事をよく見られる人しか、取りかかれまい。回想録から抜き出した事実や、演劇についての本に残る事実も、かなり付け加えられるだろう。私自身には、そんな題を扱う力がまったくない。ゆえに道の先にあるその話はよけて、原則の検討に戻ろう。理論の本が力を注ぐべきなのは元来そこだけなのだ。"
  "translation_status": "reviewed"
- "id": "becq-0321"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous passons d'un jeu de scène particulier au rôle qui le contient, nous ne faisons que remonter de l'examen de la partie à celui du tout, et un moment de réflexion suffit pour conclure que tous les jeux de scène, toutes les attitudes, tous les gestes, toutes les inflexions doivent être dans le caractère du rôle. A cinquante ans, on n'aime pas comme à vingt-cinq, ou, si on est affecté de la même complexion amoureuse, on est qualifié différemment. Il y a telle occurrence où un magistrat ne se conduira pas comme un militaire. L'éducation, l'instruction, le commerce avec nos semblables nous inculquent certaines façons de penser, de dire, d'agir, qui varient suivant le milieu où nous avons vécu. Il y a donc dans tout rôle un aspect permanent et persistant dont le comédien doit se pénétrer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 321
    "line_start": 4653
    "line_end": 4664
  "translation_ja": "ある一つの舞台の動きから、それを含む役に移るときは、部分の検討から全体の検討へさかのぼるだけだ。少し考えれば、舞台での動き、姿勢、身ぶり、声の抑揚はすべて、その役の性格にかなっていなくてはならないと分かる。五十歳の人は二十五歳と同じように恋をしない。仮に恋する性分が同じなら、その人に対する評価は変わる。ある場面で司法官は軍人と同じように振る舞わない。しつけや学び、人とのつきあいは、育った環境に応じて異なる考え方、話し方、行い方を私たちに教えこむ。だからどの役にも、始めから終わりまで変わらない面があり、俳優はそれを深くのみこまなくてはならない。"
  "translation_status": "reviewed"
- "id": "becq-0322"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est ici que l'intuition, au sens exact et étymologique du mot, prend une importance de premier ordre. Si le comédien est bien doué, il possède en lui-même une riche collection d'observations, souvent inconscientes, suites et séries d'images qui peuplent son imagination. A la première connaissance qu'il prend du rôle, il obéit à un mouvement naturel tout subjectif: il regarde en lui-même, et de cet examen intuitif résulte une image initiale, sur laquelle il concentre alors son esprit de toute la force de son attention. C'est là son modèle; il s'efforce d'en bien concevoir les formes lumineuses, qui se dessineront dans la chambre noire de sa pensée. De la clarté de l'image dépendent la netteté et la sérénité du jeu. Quelquefois l'image est lente à se former, surtout à se compléter, et quelques acteurs ont en quelque sorte besoin de l'objectiver; il leur faut plusieurs répétitions pour en porter la représentation au point de perfection qu'ils sont capables d'atteindre. Quelquefois, au contraire, elle jaillit du cerveau sans effort, et, dans ce cas, l'artiste se sent dès le premier jour absolument maître de son rôle. Mais cette première phase intuitive d'un rôle est suivie d'une seconde phase plus laborieuse; car l'image apparue à l'esprit de l'artiste n'est, si je puis m'exprimer ainsi, qu'une image centrale, autour de laquelle oscillent un certain nombre d'images similaires, correspondant aux différents moments de l'action. C'est la variété qu'il s'agit dès lors d'introduire dans le rôle sans en détruire l'unité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 322
    "line_start": 4666
    "line_end": 4688
  "translation_ja": "ここで、「直観」が言葉の厳密な、語源どおりの意味で、第一に大切になる。よい素質の俳優はしばしば、自分でも気づかないうちに蓄えた、豊かな観察の集まりを持っている。想像を満たしている、イメージのさまざまなつながりや系列である。はじめて役を知ったとき、おのずと自分の内を向く。自分自身の中を見つめ、直観によるこの検討から、最初のイメージが現れる。するとそこへ、持てる限りの注意を注ぐ。これが俳優の手本になる。思考の暗箱に描き出される、光の像の形を、はっきりつかもうと努める。この像が澄んでいるかどうかで、演技が明晰で、落ち着くかが決まる。ときには像ができるのに、とりわけ像が完成するのに時間がかかる。いわばそれを外に形として現さないとつかめない俳優もおり、できるかぎり完全な表現へ運ぶには、何度か稽古を重ねる必要がある。反対に、像がたやすく頭からほとばしることもあり、その場合、俳優は初日から役を完全にものにしたと感じる。だが役を直観する第一段階のあとには、もっと骨の折れる第二段階が待っている。俳優の心に現れた像は、あえて言えば中心にある像にすぎず、そのまわりを筋の異なる局面に対応するいくつもの似た像が揺れ動いているからだ。そこでしなければならないのは、役の統一をこわさずに変化を与えることだ。"
  "translation_status": "reviewed"
- "id": "becq-0323"
  "section_id": "ch33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tous les jeux de scène, toutes les attitudes, tous les gestes, toutes les inflexions de voix ne sont et ne doivent être que des idées secondaires, dérivées de l'idée première, ou autrement des images en rapport de ressemblance avec l'image initiale. Tout cela, bien que ne présentant aucune difficulté, se comprendra mieux encore au moyen d'un exemple. Dans le Demi-Monde, si nous mêlions en regard le rôle d'Olivier de Jalin et celui de Raymond, l'un homme du monde, l'autre militaire, il est clair que les comédiens chargés de ces deux rôles ont immédiatement vu surgir à leurs yeux, des profondeurs de leur esprit, les images initiales de ces deux personnages. C'est alors que pour tous deux a commencé un travail de détail très difficile et très minutieux, consistant à déduire de cette image intuitive toute une série d'images secondaires reproduisant toujours la même personnalité. Ils n'auront jamais une attitude identique, Olivier s'abandonnant sans effort à une aisance familière, Raymond gardant toujours une certaine rectitude de maintien; ils ne feront pas un geste semblable, ni dans le même mouvement; ils ne s'assoiront pas, ne se lèveront pas, ne marcheront pas de même, et ils ne parleront pas sur des rythmes similaires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 323
    "line_start": 4690
    "line_end": 4707
  "translation_ja": "舞台での動き、姿勢、身ぶり、声の抑揚はみな、第一の観念から引き出された第二の観念、言い換えれば、初めのイメージに似ているところのある像でしかなく、またそうでなくてはならない。この話はとくにむずかしくはないが、例があればさらによく分かる。『ドゥミ・モンド』で社交界の男オリヴィエ・ド・ジャランと、軍人レーモンの役を並べてみよう。この二役を任された俳優二人には、その心の奥から二人の人物の最初の像がたちまち浮かんだに違いない。そこから、この直観的な像を手がかりに、同じ人物を表す二次的な像を一つ一つ引き出す、難しく、細かい仕事が二人それぞれに始まった。二人は同じ姿勢を取ることがない。オリヴィエは無理なく気のおけない身軽さに身を任せ、レーモンの身のこなしにはいつもどこかまっすぐなところがある。同じ身ぶりを、同じ動きですることもない。座り方も立ち方も歩き方も同じではなく、言葉の拍子も似ない。"
  "translation_status": "reviewed"

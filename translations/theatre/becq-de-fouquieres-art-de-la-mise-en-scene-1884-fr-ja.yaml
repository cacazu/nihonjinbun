      "end": 216
      "exact": "Iphigénie"
- "id": "becq-0248"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous arrivons à l'examen du costume le plus important de la tragédie, celui de Phèdre elle-même. Nous avons vu, à propos du rôle de Théramène et de celui de Thésée, que la variété ou l'uniformité de costume dépend d'une loi qui a sa raison d'être dans le développement de l'action dramatique. Le rôle de Phèdre nous montrera, avec bien plus de force encore, la nécessité d'achever la réforme du costume tragique, en l'associant en quelque sorte plus étroitement aux mouvements des passions."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 248
    "line_start": 3456
    "line_end": 3463
  "translation_ja": "いよいよこの悲劇で最も重要な衣装、フェードル自身の衣装を調べよう。テラメーヌとテゼの役を見たとき、衣装を変えるか一定に保つかは、劇の筋の展開に根拠を持つ一つの法則で決まると分かった。フェードルの役では、悲劇の衣装を情念の動きにいわばいっそう密接に結びつけ、改革を最後までやり遂げる必要が、さらに強く示されるだろう。"
  "translation_status": "reviewed"
- "id": "becq-0249"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans le monde, aussi bien que sur le théâtre, le costume est une partie visible de nous-même; c'est lui qui, avec notre figure et nos mains, compose notre aspect extérieur. C'est ainsi, les mains et la figure nues, mais couverts de leurs vêtements habituels ou de costumes de circonstance, que se fixent dans notre souvenir toutes les personnes qui appartiennent à notre vie intime, à celle de notre âme. Nous ne les voyons jamais dans leur nudité sculpturale; le nu est un état sous lequel nous ne les connaissons pour ainsi dire jamais et sous lequel, le cas échéant, nous ne les reconnaîtrions pas. Chez tous les peuples civilisés, qui ne vivent point sous des climats brûlants, le costume s'est superposé au corps, nous en voile les formes, un grand nombre de mouvements, et se substitue à lui dans les images qui se forment d'une façon durable dans notre esprit. Il est donc impossible que le costume n'ait point part à toutes les modifications physiques et morales auxquelles nous sommes soumis incessamment."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 249
    "line_start": 3465
    "line_end": 3479
  "translation_ja": "現実の世の中でも舞台でも、衣装は目に見える自分の一部である。顔や手とともに、衣装が私たちの外見をつくる。私たちの親しい暮らしに、心の暮らしに属する人々は、みな手と顔を出し、いつもの服かその場に合った服をまとう姿で、記憶に定着する。彼らを彫刻のような裸体で見ることはない。裸は、私たちがいわばその人をほとんど知らない状態であり、仮にそういう姿で会ったとしても、それがその人だと分からないだろう。焼けつくような気候に住まない文明の民ではどこでも、衣装は体の上に重ねられ、その形と多くの動きを覆い隠し、心に長く残る人のイメージの中では、体に取って代わる。だから、とどまることなく私たちに起こる体と心の変化に、衣装だけが関わらないということは、ありえない。"
  "translation_status": "reviewed"
- "id": "becq-0250"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et de fait il en est ainsi. Un homme vif, actif, ne s'habille pas ou ne porte pas ses vêtements comme un homme lent et paresseux. Une femme parée de sa dignité mondaine n'a pas le même aspect extérieur que la même femme, sous les mêmes vêtements, prête à s'abandonner dans l'intimité à l'entraînement de son coeur. Son corps, auquel sa fierté donnait une sorte de rigidité, ploie et assouplit ces mêmes vêtements sous l'effort du mouvement passionné qui l'agite. Voici un homme, il y a quelques heures correct dans sa tenue d'homme du monde, dont une nuit de jeu a pâli et bouleversé les traits: est-ce que ses vêtements ne porteront pas la trace de son anxiété fiévreuse et ne prendront pas, comme son visage, un aspect dévasté? A plus forte raison la femme languissante et malade ne s'habillera pas comme la femme qui recherche l'admiration des hommes et brave la jalousie des autres femmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 250
    "line_start": 3481
    "line_end": 3493
  "translation_ja": "実際、そのとおりである。生き生きと活動的な男は、動作の遅い怠け者と同じ服装をしたり、同じように服を着こなしたりはしない。社交の場で自分の品位をまとう女性は、同じ服を着ていても、親しい間柄で心のままに身を任せようとする同じ女性とは、見かけが違う。誇りのためにどこか硬かった体が、胸を揺さぶる情熱の勢いでしなやかに曲がり、その同じ衣装をやわらかくする。数時間前までは社交界の人間として身なりの整っていた男が、夜通し賭け事をし、顔が青ざめ、表情が乱れているとしよう。その服にも熱に浮かされたような不安の跡が残り、顔と同じように、荒れ果てて見えるのではないか。まして、病みしおれている女が、男たちの賛美を求め、ほかの女たちの嫉妬をものともしない女と、同じ身なりをすることはない。"
  "translation_status": "reviewed"
- "id": "becq-0251"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est inutile d'insister, car ce sont là en quelque sorte des lieux communs. Il me reste à faire remarquer que, précisément, notre théâtre contemporain tient grand compte, même parfois avec excès, de ces nuances psychologiques de costume. A la scène, les comédiens modifient leur costume selon les différents actes de la vie; et les femmes, soit qu'elles recherchent un effet de similitude ou de contraste, ajustent les couleurs de leurs robes à celles de leurs pensées. Aussi les personnages y prennent un caractère remarquable de vérité et de naturel. Comment se fait-il que dans la tragédie on n'ait pas davantage senti la nécessité d'ajuster l'aspect des personnages aux divers états psychologiques qu'ils traversent? Sans doute, il faut le faire avec une grande sobriété et ne pas se laisser entraîner à l'unique représentation de faits matériels qui jouent un rôle très restreint dans la tragédie; mais quand un état moral est de nature à agir sur tout l'être, l'unité absolue de costume peut être parfois un contresens et avoir une influence funeste sur la composition d'un rôle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 251
    "line_start": 3495
    "line_end": 3510
  "translation_ja": "いわばありふれた事柄なので、これ以上述べる必要はない。指摘しておきたいのは、まさに私たちの現代劇が、時には過剰なほど、衣装のこうした心理的な機微を重んじることだ。舞台では俳優が、生活のそれぞれの場に合わせて衣装を変える。女性たちは似た色を求めるにも、対照を出すにも、ドレスの色を自分の考えの色に合わせる。そのため人物には、見事な真実味と自然さが備わる。では、悲劇ではなぜ、人物の外見を、その人物が次々と通り抜ける心理状態に合わせる必要が、もっと感じられなかったのだろう。むろん、たいへん控えめに行い、悲劇ではごく小さな役割しか持たない物理的な事実だけを見せるほうへ、引きずられてはいけない。だが、ある心の状態が全身に作用するほどのものであるなら、衣装を絶対に変えないことは、ときに意味を逆にし、役づくりに有害な影響を与えかねない。"
  "translation_status": "reviewed"
- "id": "becq-0252"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la tragédie de Racine, telle qu'on la représente, Phèdre est vêtue d'une simple tunique rattachée sur l'épaule par des agrafes, serrée à la taille par une ceinture et tombant jusqu'aux talons. Phèdre est à demi décolletée et ses bras sont nus jusqu'aux épaules. Au premier acte, un simple voile de gaze est fixé sur sa tête. Sauf le voile, c'est le vêtement qu'elle conserve pendant tout le cours de la représentation. En soi, le costume est heureusement combiné, gracieux et en même temps d'une élégante sévérité. Mais, néanmoins, l'aspect de Phèdre, lorsqu'elle paraît sur la scène, n'est pas tel qu'il devrait être. Lorsque son chagrin inquiet l'arrache de son lit, est-ce bien là le costume d'une femme mourante et qui cherche à mourir? Phèdre, surexcitée par la pensée qui l'obsède sans trêve, agitée par la fièvre qui la dévore, a voulu quitter sa couche, revoir la lumière du jour, peut-être retrouver quelques traces fatales de cet Hippolyte dont le fantôme habite sa pensée. Ses femmes obéissent à ce caprice impérieux d'une malade; elles la lèvent, rattachent ses cheveux avec des épingles d'or, lui passent une large et chaude tunique qui couvre son cou, ses épaules et ses bras, et elles l'enveloppent d'une étoffe de laine ample et moelleuse qui la couvre entièrement. C'est même cette pièce d'étoffe qui devrait remplacer le voile, et que Phèdre devrait avoir ramené sur son front. Cette ample pièce d'étoffe, d'un caractère bien antique, ne joue pas, dans la mise en scène de nos tragédies, le rôle qui devrait lui appartenir. Les actrices trouveraient, dans le maniement de cette draperie toujours libre, flottante ou serrée à leur gré, l'occasion de beaux plis ou de gracieux enveloppements. Mais il faudrait apprendre à s'en servir et faire du port du costume antique une étude attentive."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 252
    "line_start": 3512
    "line_end": 3537
  "translation_ja": "今日のラシーヌの悲劇の上演では、フェードルは簡素なチュニカをまとう。肩を留め具でつなぎ、腰を帯で締め、裾はかかとに届く。胸元は半ば開き、両腕は肩までむき出しだ。第一幕でだけ、薄い紗のヴェールが頭に留められている。そのヴェールを除けば、上演の間じゅう同じ衣装を着ている。衣装そのものはうまく組み合わされ、優美であると同時に、上品な厳しさもある。だが舞台に現れたフェードルの見た目は、あるべき姿ではない。悲しみと不安のために床から出ずにはいられないとき、これが果たして、死にかけている、しかも死にたい女の衣装だろうか。絶えずつきまとう考えに興奮し、身を焦がす熱に揺さぶられたフェードルは、床を離れ、日の光をもう一度見たい、ひょっとしたら、心に取りついたあのイポリットの、破滅を招く何かの痕跡にもう一度出会いたいと思った。侍女たちは病人の有無を言わせぬ気まぐれに従い、起き上がらせ、髪を金のピンで留め直す。首と肩と腕を覆う、幅の広い暖かなチュニカを着せ、体を丸ごと、ゆったりした柔らかな毛織物で包む。この布でこそヴェールを置き換え、フェードル自身の手で額まで引き上げるべきだ。いかにも古代らしいこのたっぷりした布は、私たちの悲劇の演出で、果たすべき役割を果たしていない。俳優は、この自由に扱える布を、望むままにゆるく流したりきつく合わせたりして、美しいひだをつくり、優雅に身を包むことができる。だがその使い方を身につけ、古代の衣装の着方を丹念に研究する必要がある。"
  "translation_status": "reviewed"
- "id": "becq-0253"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour en revenir à Phèdre, c'est ainsi qu'elle doit sortir de son appartement, pâle et enveloppée de la tête aux pieds, succombant dans sa faiblesse sous le poids de sa coiffure et de ses vêtements. L'importance de ce costume de Phèdre est beaucoup plus grande qu'un examen superficiel ne permettrait de le croire. Dans un autre ouvrage, dans le Traité de Diction que j'ai publié il y a deux ans, j'ai insisté sur la nécessité pour un acteur de se composer un extérieur physique en rapport avec le sentiment moral du personnage qu'il représente. Or, nous avons dit que le costume fait partie de notre aspect extérieur; il faut donc le composer de manière qu'il réagisse, comme les traits du visage, sur la diction et sur le jeu qui conviennent au personnage. Dans son costume actuel, Phèdre nous apparaît, sous ses couleurs naturelles, le cou et les bras nus, vêtue d'une tunique légère qui ne pèse d'aucun poids sur ses épaules: or, il est certain que l'actrice qui remplit ce rôle ne se sentira gênée ou retenue dans ses mouvements par aucun obstacle, et que cet affranchissement de toute entrave matérielle laissera à sa personne, et par suite à ses gestes et à sa voix, une liberté qui formera contraste avec la triste réalité de la situation décrite par le poète. Si, au contraire, l'actrice sent le poids de sa coiffure, si ses bras ont quelque peine à soulever les plis du pallium qui l'enveloppe, relevé sur le sommet de la tête comme un voile; si ses pas traînent avec un certain effort la longue tunique qui descend jusqu'à ses pieds, alors elle laissera naturellement retomber sa tête; sa démarche trahira la lassitude qui l'accable; ses bras appesantis chercheront un appui sur les femmes qui l'accompagnent; ses gestes seront lents et languissants, et sa voix, sa diction prendront le caractère corrélatif de cet état physique qu'elle aura incliné vers celui qui convient au personnage de Phèdre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 253
    "line_start": 3539
    "line_end": 3566
  "translation_ja": "フェードルに戻ろう。こうして、青ざめ、頭から足先まで包まれ、衰弱して、髪の結い上げと衣装の重みに負けそうになりながら、部屋を出るべきである。その衣装の大切さは、うわべを見ただけで思うよりはるかに大きい。私は二年前に刊行した別の著書『発声・台詞術論』で、俳優は演じる人物の心情に見合う外見をつくらねばならないと強調した。さて、衣装も外見の一部をなすと先ほど述べた。したがって、顔立ちと同じように、その人物に合う台詞の言い方や演技へ、衣装のほうから働きかけるように仕立てる必要がある。今の衣装で見るフェードルは素の顔色で、首や腕は裸のまま、肩に負担のない軽いチュニカを着ている。この役の俳優の動きは、何にも妨げられず、抑えられないだろう。物理的な妨げから解放されれば、体と、したがって身ぶりと声に、ラシーヌが描く悲しい現実とは相いれない自由さが残る。反対に、俳優が結い上げた髪の重みを感じ、ヴェールのように頭まで引き上げ、身を包むパリウムのひだを持ち上げるのに腕がいくらか苦労し、足先まで垂れる長いチュニカを引きずるのに歩みがいくらか力を要するなら、頭は自然に垂れる。歩き方には、彼女を押しつぶす疲れが現れる。重くなった腕は付き添う侍女たちの支えを求め、身ぶりは遅く、弱々しくなる。声も台詞の言い方も、俳優がフェードルにふさわしい状態へ近づけた、その体の状態に応じたものになる。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 345
      "end": 362
      "exact": "Traité de Diction"
- "id": "becq-0254"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Avec un costume mieux approprié à la situation, l'actrice jouera plus facilement son rôle et le jouera mieux. Ses gestes seront plus rares, car le petit effort qu'il lui faudra faire sera un obstacle suffisant à la plupart de ceux qui ne sont pas le fait d'une volonté déterminée, et ceux qu'elle aura la résolution d'achever seront d'un effet beaucoup plus saisissant, parce qu'ils trahiront l'effort."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 254
    "line_start": 3568
    "line_end": 3573
  "translation_ja": "場面にもっと合う衣装なら、俳優は役を演じやすくなり、演技もよくなる。身ぶりは少なくなる。少し力を入れなければならないだけで、はっきりした意志から出ない身ぶりの大半は抑えられるからだ。逆に最後までやりとげようと決めた身ぶりは、力を要することが伝わるので、効果はいっそう強くなる。"
  "translation_status": "reviewed"
- "id": "becq-0255"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans tout le premier acte, Phèdre est sous l'empire du mal qui la tue, et l'actrice en exprimera facilement tous les sentiments, si elle a en quelque sorte revêtu l'aspect extérieur du personnage. Mais à la fin du premier acte, combien change la situation! En apprenant la mort de Thésée, Phèdre reste saisie, immobile, silencieuse, ouvrant l'oreille aux perfides conseils d'Oenone, qui ne vont que trop au-devant du coupable espoir qui lui fait horreur. Au second acte, elle n'est plus la femme mourante, qui, tout à l'heure, se traînait sur le seuil de son appartement. L'animation de la vie a de nouveau coloré ses joues. Sa tête ne ploie plus sous les tresses savantes d'une chevelure que serre une bandelette d'or. Elle a quitté le pallium qui l'enveloppait et elle paraît sur la scène couverte seulement de cette tunique légère qui laisse voir son cou et ses bras, nus jusqu'aux épaules. Ici, le costume de Phèdre, tel qu'il est composé à la Comédie-Française, a bien le caractère qui lui convient. Il décèle, chez la femme, l'espoir inavoué de toucher peut-être le farouche Hippolyte. Le contraste entre ce costume et celui du premier acte prépare la scène entre Phèdre et Hippolyte, et le jeu comme la diction de l'actrice en reçoivent une animation immédiate. En revêtant ce nouvel aspect, elle en prend le caractère. Ses gestes ne sont plus désormais emprisonnés dans ses voiles, et c'est avec toute la furie d'une femme embrasée des feux de Vénus, qu'après avoir fait au fils de son époux l'aveu de sa coupable passion, ramenée à l'horrible réalité, elle saisira le glaive d'Hippolyte pour le tourner contre elle-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 255
    "line_start": 3575
    "line_end": 3598
  "translation_ja": "第一幕を通じ、フェードルは自分を死に追いやる苦しみに支配される。俳優がいわばその人物の外見をまとっていれば、その心情のすべてをたやすく表せるだろう。だが第一幕の末に、事態は何と大きく変わることか。テゼの死を聞いて、フェードルは打たれたように動きを止め、黙りこくる。そして、彼女が忌まわしく思う罪深い望みを、あまりにも露骨に後押しする、エノーヌの卑劣な助言に耳を傾ける。第二幕では、少し前に自室の敷居まで体を引きずってきた、死にかけの女ではもうない。生命の張りが頬に色を戻し、金の帯で締めた凝った編み髪の下で、頭はもう垂れない。体を包んだパリウムを脱ぎ、首と肩までの両腕をあらわにする、あの軽いチュニカ一枚で舞台へ現れる。ここでは、コメディ・フランセーズのフェードルの衣装が、まさにふさわしい性質を持つ。女のうちにある、よそよそしいイポリットの心をもしかしたら動かせるのではないか、という口に出せない望みを明かしている。第一幕とこの衣装との対照が、フェードルとイポリットの場面を準備し、俳優の演技と台詞にたちまち活気を与える。新たな外見をまとうと、その外見の性質も身につく。身ぶりはもう布に閉じこめられていない。そこでウェヌスの炎に焼かれる女の狂おしさを残らず現しながら、夫の息子に罪深い情熱を打ち明け、恐ろしい現実へ引き戻されると、イポリットの剣をつかみ、自分の方へ向けるのだ。"
  "translation_status": "reviewed"
- "id": "becq-0256"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est étonnant qu'on n'ait pas dès longtemps senti la nécessité des modifications qui s'imposent dans le costume de Phèdre, au premier et au second acte. La raison en est certainement dans une fausse conception du costume tragique. En voulant pousser trop loin l'unité de costume, on crée, comme à plaisir, des contradictions entre l'aspect extérieur des personnages et les sentiments qui les font agir. Or, au point de vue théâtral, de telles contradictions entraînent une diction défectueuse et des gestes qui ne sont pas en situation. Entre l'aspect et le moral d'un personnage, il y a un lien qu'il n'est pas permis de briser; car, au théâtre, prendre l'aspect physique d'un être humain c'est, pour un acteur, disposer son âme à avoir le sentiment de l'état moral du personnage et se rendre capable d'exprimer les passions qui l'agitent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 256
    "line_start": 3600
    "line_end": 3611
  "translation_ja": "第一幕と第二幕でフェードルの衣装を変えなければならないことが、なぜずっと以前に感じられなかったのか、不思議である。悲劇の衣装の捉え方が誤っていたのは確かだろう。衣装を一つに保とうとするあまり、人物の外見と、その人物を動かす感情との矛盾を、まるで好んで作り出してしまう。演劇の面から見れば、こうした矛盾の結果は、場面にふさわしくない台詞回しと身ぶりである。人物の外見と心には、断ち切ってはならないつながりがある。舞台で人間の外見を身につけるのは、俳優にとって、その人物の心の状態を感じ取れるよう自分の心を整え、その人物を揺さぶる情念を表せるようにすることだからだ。"
  "translation_status": "reviewed"
- "id": "becq-0257"
  "section_id": "ch27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous nous sommes étendu sur Phèdre, cette tragédie n'est cependant qu'un exemple entre beaucoup d'autres, qui nous a permis de mettre en lumière une loi générale de la mise en scène, relative au costume. Iphigénie en Aulide se fût aisément prêtée à des remarques non moins importantes. La mise en scène de cette tragédie, telle qu'elle est actuellement réglée à la Comédie-Française, exigerait de nombreuses corrections. Laissant de côté les dispositions scéniques, qui ne sont pas toujours irréprochables, je ne dirai que quelques mots des costumes, qu'on a tort de ne pas mettre d'accord avec la marche de l'action et avec la situation des personnages."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 257
    "line_start": 3613
    "line_end": 3622
  "translation_ja": "『フェードル』を長く論じたが、この悲劇も、多くの中の一例でしかない。おかげで衣装に関わる演出の一般法則を、明るみに出すことができた。『アウリスのイフィジェニー』からも、劣らず重要な指摘が、たやすく得られただろう。現在コメディ・フランセーズで行われるこの悲劇の演出には、直すべき点が多い。舞台上の配置も申し分ないとは限らないが、それはおく。衣装を、筋の進み方と人物の状況に合わせていないのは誤りなので、衣装についてだけ少し述べよう。"
  "translation_status": "reviewed"

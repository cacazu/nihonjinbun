- "id": "becq-0135"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans les pièces fondées sur le sentiment, les ressorts principaux de l'action sont les émotions morales, tendres ou tristes, dont sont agités les personnages. Ce sont des mouvements de l'âme qui déterminent le mouvement scénique. L'auteur cherche à nous intéresser à ces émotions en éveillant sympathiquement notre sensibilité, c'est-à-dire notre susceptibilité à l'impression des choses morales. Ce que nous devons considérer, c'est la source d'où jaillit l'émotion, c'est-à-dire la cause d'où naît le sentiment qui agite les personnages et qui de leur âme passe sympathiquement dans la nôtre. Il est donc nécessaire, dans l'étude des oeuvres dramatiques fondées sur le développement psychologique des sentiments, de distinguer celles où les émotions découlent de causes subjectives de celles où elles proviennent de causes objectives. C'est la distinction qui importe et d'où se déduisent les conditions de la mise en scène. Pour éclaircir cette question, il convient d'examiner à ce point de vue deux oeuvres dramatiques dans lesquelles les émotions de tristesse ou de joie sont précisément fondées, dans l'une, sur des causes subjectives, dans l'autre, sur des causes objectives."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 135
    "line_start": 1671
    "line_end": 1688
  "translation_ja": "感情に根ざす芝居で筋を大きく動かすのは、登場人物が揺さぶられる、やさしい、あるいは悲しい心の動きである。魂の動きが舞台の動きを形づくるのだ。作家は、その感情に私たちの関心をひきつけるために、心にかかわるものから印象を受ける私たちの感受性を、共感によって呼び覚まそうとする。考えるべきは、感動がどこから湧くかである。つまり、どんな原因から感情が生まれて登場人物を揺さぶり、その人物の心から私たちの心へ、共感を通して渡ってくるのか。だから、感情が心理的に発展していくところに根ざす戯曲を研究するときは、感動が人物の内から生じる作品と、外界の物事から生じる作品を区別しなければならない。大切なのはこの区別で、演出の条件はそこから導かれる。この点を明らかにするために、悲しみや喜びが、一方では内からの原因、もう一方では外からの原因にそれぞれ根ざしている二つの戯曲を、この点から調べてみよう。"
  "translation_status": "reviewed"
- "id": "becq-0136"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans le Mariage de Victorine, de George Sand, nous assistons à un drame émouvant qui se joue dans le coeur d'un père et dans celui de sa fille. Celle-ci, sans oser se l'avouer, aime le fils du maître et du bienfaiteur de son père. Celui-ci, qui voit naître cette aveugle passion, veut la combattre en mariant sa fille à un des commis de son maître. La grandeur d'âme du père et de la fille, la pureté de leur conscience morale, leur respect pour les hiérarchies sociales, le soin de leur propre dignité, l'estime qu'ils ont d'eux-mêmes, la fierté qui relève jusqu'à l'héroïsme le sentiment de leur devoir, font un spectacle poignant et douloureux de la lutte généreuse qui se livre dans le coeur du père entre son amour paternel et le respect qu'il a pour son bienfaiteur, dans le coeur de la fille entre son amour et son affection filiale. Le drame auquel nous assistons se joue réellement dans ces deux âmes, et la nôtre en suit les péripéties avec une sympathie douloureuse. Nous sentons combien sont intimes et subjectives toutes les causes de leur détermination, et combien dans ce drame psychologique sont de peu de prix tous les attraits du monde extérieur. Rien aux yeux de ce père et de cette jeune fille, comme à ceux du spectateur, n'est digne d'exercer une influence quelconque sur leur résolution morale, ni le luxe des appartements, ni les richesses qui s'entassent dans les coffres de banquier, ni la beauté des costumes, rien enfin de ce qui est la marque de la position plus haute à laquelle leur position plus humble leur défend d'aspirer. Aussi tout ce qui, dans la décoration et dans la mise en scène, attirerait les regards à ce point de vue rendrait presque impossible le dénouement que le public attend et désire, et en tous cas en dénaturerait la grandeur morale. La mise en scène doit être humble, modeste, presque effacée, pauvre de détails, car rien n'y a d'intérêt pour nous; les costumes simples et un peu austères, le jeu des acteurs contenu, leurs gestes et leur diction sans emphase. Il faut, en un mot, resserrer l'action, la maintenir et la dénouer dans, un milieu purement moral, sans qu'aucun détail de la mise en scène vienne de sa pointe trop brillante déchirer le voile de larmes que le drame a fait descendre sur les regards des spectateurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"

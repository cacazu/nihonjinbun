      "exact": "Quatre-Vingt-Treize"
- "id": "becq-0132"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mise en scène d'un tel poète sera toujours difficile à réaliser. Elle devra souvent être d'ordre composite, associant le faux et le vrai, poursuivant souvent l'impossible, découpant ou étageant la scène, tantôt étalant au premier plan les pauvretés maladroites de ses décors peints, tantôt se lançant dans le luxe exagéré des décorations d'opéra."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 132
    "line_start": 1656
    "line_end": 1660
  "translation_ja": "このような作家の演出は、いつでも実現が難しい。偽物と本物を結び合わせ、しばしば不可能を追い、舞台を区切るか段をつけるという、混成のものになることも多い。描いた装置の不器用な貧弱さを舞台前面にさらけ出すときもあれば、オペラの装置の度を越えたぜいたくに乗り出すときもある。"
  "translation_status": "reviewed"

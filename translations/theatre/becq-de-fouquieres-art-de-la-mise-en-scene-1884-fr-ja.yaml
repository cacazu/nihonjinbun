- "id": "becq-0200"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la représentation des oeuvres classiques.--Du plaisir théâtral.--De la sensation du beau.--Analyse de cette sensation."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 200
    "line_start": 2755
    "line_end": 2756
  "translation_ja": "古典作品の上演／劇場で味わう喜び／美を感じること／その感覚の分析"
  "translation_status": "reviewed"
  "source_kind": "chapter_summary"
- "id": "becq-0201"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J'aborde un sujet dont l'intérêt ne le cède pas à l'importance: la mise en scène des chefs-d'oeuvre classiques de la littérature française. Sujet vaste, qu'il faut s'empresser de limiter, en écartant autant que possible tout ce qui dans l'étude esthétique de ces oeuvres dramatiques ne se rapporte pas à la mise en scène. Dès les premières pages de ce volume, nous avons dit l'intérêt supérieur qui s'attache à la représentation des oeuvres classiques. Elles marquent le niveau supérieur où s'est élevé le génie français, ou mieux le point culminant qu'a pu atteindre en France l'art dramatique, sous sa forme la plus simple et la plus sévère. Pour les poètes, c'est un exemple toujours présent, qui domine leurs efforts, ne les laisse jamais satisfaits de leurs propres ouvrages et les pousse dans la voie indéfinie du progrès. Corneille, Racine et Molière servent de conscience, soyons-en sûrs, à ceux-là mêmes qu'enivre la popularité, et que semble aveugler le contentement de soi-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 201
    "line_start": 2759
    "line_end": 2773
  "translation_ja": "これから、重要であると同時に興味深い問題、フランス文学の古典的傑作の演出を取り上げる。広い主題なので、これらの戯曲を美学の面から考えるにあたって、舞台演出と関わらない事柄をできるだけ除き、まず範囲を絞りたい。本書の冒頭で、古典作品の上演がとりわけ重要なことは述べた。そこにはフランスの才が到達した高み、より正確にいえば、最も単純で厳格な形式で、フランスの劇芸術が達することのできた頂点が刻まれている。劇作家にとっては、いつも目の前にあり、自分たちの努力を見下ろし、決して自作に満足させず、果てしない進歩の道へ導く手本である。世間の人気に酔い、自己満足で目が曇っているような当人たちにさえ、コルネイユ、ラシーヌ、モリエールは、きっと良心の役目を果たしている。"
  "translation_status": "reviewed"
- "id": "becq-0202"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces représentations ne sont pas moins salutaires au public; et n'auraient-elles que le mérite de former et de purifier son goût, d'élever et d'agrandir son esprit, qu'elles contribueraient ainsi à la culture générale des lettres, au maintien des bonnes moeurs et aux insensibles progrès de la civilisation. C'est surtout en se demandant comment les représentations classiques forment et épurent le goût qu'on met en évidence l'attrait qu'elles ont seules le privilège d'exercer et la raison secrète de l'empire qu'elles prennent sur ceux qui ont une fois senti le plaisir particulier qu'elles procurent. Depuis plusieurs années j'ai assisté à un très grand nombre de ces représentations, et c'est un point que je me suis efforcé d'éclaircir, en analysant mes propres impressions et en les comparant avec celles que me semblait éprouver la salle tout entière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 202
    "line_start": 2775
    "line_end": 2787
  "translation_ja": "こうした上演は、観客にとっても同じくらい有益である。観客の趣味を培い、磨き、精神を高め、その視野を広げるだけだとしても、広く文学を育て、良俗を保ち、文明を目立たず進歩させる役には立つ。とりわけ、古典の上演はどのように趣味を培い、磨くのかと問うてみると、そこにしかない魅力と、その独特の喜びを一度味わった人が引きつけられてやまない、ひそかな理由とが明らかになる。私はここ数年、古典の上演を数多く見てきた。自分が受けた印象を分析し、客席全体が味わっているように見えたものと照らし合わせ、この点を明らかにしようとしてきたのである。"
  "translation_status": "reviewed"
- "id": "becq-0203"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est certain que les hommes ne vont chercher au théâtre que des sensations, ce qu'en un mot nous appelons du plaisir. Personne n'entre à la Comédie-Française avec la prétention de se rendre meilleur, de former son goût, d'élever son esprit. A cet égard notre amour-propre, qui souvent se contente de peu, nous fait juger notre esprit assez élevé, notre goût suffisamment délicat et nous entretient dans l'estime de nous-mêmes. Les salles de théâtre seraient vides si elles ne devaient se remplir que de personnes qu'y amèneraient des motifs aussi louables. Non, le mobile qui nous pousse au théâtre n'est pas aussi désintéressé qu'on le pense; nous voulons y goûter du plaisir dans toute la force du terme et y éprouver des sensations réelles, qui mettent en émoi notre organisme tout entier. On se tromperait d'ailleurs si on croyait que nous sommes ici en contradiction avec ce que nous avons dit dans le commencement de cet ouvrage, car il y a un ordre de sensations auxquelles on ne parvient que par un effort constant et une puissante application de l'esprit, et que par conséquent la moindre distraction empêcherait de naître en nous."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 203
    "line_start": 2789
    "line_end": 2805
  "translation_ja": "人が劇場へ求めに行くのは、確かに心身で感じられること、ひとことでいえば喜びだけである。人柄を良くしたい、趣味を養いたい、精神を高めたいと思ってコメディ・フランセーズに足を踏み入れる者はいない。そういう点では私たちの自尊心は少しのもので満足することが多く、自分の精神は十分に高く、趣味も十分に洗練されていると思わせ、自分を高く買わせておく。そんな立派な理由で来る人だけで埋めるなら、劇場は空っぽになるだろう。私たちを劇場へ向かわせる動機は、考えられているほど無私ではない。文字どおりの喜びを味わい、心身を丸ごと揺り動かす、確かな感覚をそこで経験したいのである。もっとも、これが本書のはじめに述べたことと矛盾すると思うなら、それは誤りだ。絶えず努力して強く精神を集中させなければ達しえず、ほんの少し気を散らしただけで生まれなくなる、そういう種類の感覚があるからである。"
  "translation_status": "reviewed"
- "id": "becq-0204"
  "section_id": "ch23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tous les jours il peut nous arriver d'assister à des comédies plus spirituelles ou plus amusantes que les comédies de Molière, à des drames plus intéressants ou plus poignants que les tragédies de Corneille et de Racine. On outrepasserait la vérité en voulant prouver que toutes les pièces le cèdent en gaieté ou en force dramatique aux oeuvres classiques: ce n'est pas vrai. Pour moi, j'avoue très humblement, m'être souvent beaucoup plus amusé à certaines pièces du Palais-Royal, du Vaudeville ou des Variétés qu'à la représentation des Femmes savantes ou du Misanthrope; et en dépit d'une rhétorique froide et gourmée il faut reconnaître que le rire, le fou rire même, est un plaisir que nous recherchons et dont il ne faut pas rabaisser la valeur. De même, à des drames de l'Ambigu ou de la Porte-Saint-Martin, j'ai éprouvé des sensations de pitié, de terreur ou d'anxiété beaucoup plus fortes que celles que m'ont jamais causées les héros ou les héroïnes des plus belles tragédies; et ces impressions ont pour nous des voluptés auxquelles nous goûtons avidement et qui nous arrachent des applaudissements et des cris. Or ce qu'il faut bien comprendre, c'est que les sensations que nous font éprouver les oeuvres classiques sont tout aussi réelles, mais qu'elles sont d'un autre ordre, et d'un ordre supérieur. C'est donc précisément leur réalité qu'il faut mettre en évidence, car c'est par leur réalité que ces jouissances artistiques ont du prix pour les hommes, les attirent et les sollicitent avec une force qu'elles n'auraient pas si elles n'avaient à leur offrir qu'un semblant de plaisir idéal et platonique. Or, à l'égard de cette réalité, il n'y a pas de doute à avoir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 204
    "line_start": 2807
    "line_end": 2831
  "translation_ja": "モリエールの喜劇より機知に富み、よく笑わせる喜劇や、コルネイユやラシーヌの悲劇より興味をそそり、胸に迫るドラマに出会うことは、いつだってありうる。どの戯曲も陽気さや劇的な力で古典に劣ると立証しようとするのは、事実をはみ出すことになる。本当ではない。私自身、きわめて率直に白状すると、『女学者たち』や『人間嫌い』の上演よりも、パレ・ロワイヤル座やヴォードヴィル座、ヴァリエテ座のある芝居をずっと楽しく見たことはたびたびある。冷ややかで気取った修辞が何と言おうと、笑うこと、それも笑いが止まらなくなることは、人が求める喜びであり、その値打ちを低く見てはならない。同じように、アンビギュ座やポルト＝サン＝マルタン座でドラマを見たとき、最も美しい悲劇の男女の主人公が私に抱かせたことのないほど強い、憐れみや恐れや不安を感じた。それも、私たちが貪るように味わい、思わず拍手や叫び声を上げるほどの快感である。だが大切なのは、古典が呼び起こす感覚もそれと同じく現実のものだが、種類が違い、しかも一段高いものだと理解することだ。だからこそ、その感覚が現実だとはっきりさせる必要がある。芸術のこうした喜びが人にとって価値を持ち、人を引きつけ、強く誘うのは、それが現実だからだ。観念の中だけの、ただの見せかけの喜びなら、そんな力はない。さて、その感覚が現実であることに、疑いを差し挟む余地はない。"
  "translation_status": "reviewed"

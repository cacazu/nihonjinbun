- "id": "becq-0275"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A un point de vue général, la figuration est soumise aux lois qui règlent la disposition hiérarchique des personnages sur la scène. Elle entre dans le rythme scénique et concourt à la composition du tableau dont presque toujours elle occupe les derniers plans. Il faut donc la traiter comme un peintre traite les masses, c'est-à-dire sacrifier le détail particulier à l'ensemble. Si le metteur en scène se préoccupe à juste titre des places relatives que doivent occuper individuellement les personnages du drame, il a aussi à s'occuper de grouper la figuration, de la diviser en parties harmoniques, de telle sorte qu'elle produise un effet général où s'efface toute individualité. Sur la scène de l'Opéra, ce qui régit la composition des groupes, c'est la répartition des voix; mais, dans une oeuvre dramatique, il y a lieu de se préoccuper de l'effet optique, de l'importance des groupes par rapport à la situation et à la marche de l'action, et surtout du rôle qui est dévolu à la figuration à laquelle je donnerai souvent le nom de choeur, qu'elle avait chez les anciens."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 275
    "line_start": 3877
    "line_end": 3892
  "translation_ja": "大まかに言えば、群衆役も、人物の重要さに応じて舞台に配置する決まりに従う。舞台のリズムに加わり、舞台全体の構図を作る一助となる。ほとんどの場合、群衆役がいるのは舞台の奥である。だから画家が大きなまとまりを扱うように、群衆役も扱わなくてはならない。つまり全体のために個々の細部は犠牲にする。演出家が劇の登場人物一人ひとりの位置関係を考えるのは当然だが、群衆役をまとめ、互いに調和するいくつかの組に分け、個々人が目につかない全体の効果を作ることにも気を配らなければならない。オペラ座では声部の割り振りが集団の構成を決めるが、演劇では目にどう映るか、場面や筋の進み方から見てそれぞれの集団がどれほど重要か、何より群衆役にどんな役割が与えられているかを考える。ここでは群衆役を、古代の呼び名にならい、しばしば「合唱隊」と呼ぶことにする。"
  "translation_status": "reviewed"

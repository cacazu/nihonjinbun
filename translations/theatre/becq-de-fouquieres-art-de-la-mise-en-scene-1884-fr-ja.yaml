    "line_start": 3189
    "line_end": 3197
  "translation_ja": "建築はうまく適合していると思うが、背景の幕について同じことは言えない。結局それはアテナイのアクロポリスか、それと見間違えるほど似た聖なる丘を描いている。ギリシアのどの都市にもそうしたものがあったように、トレゼーヌにも、町を見下ろす高台に築かれたアクロポリスがあった。だから装置自体は間違っていない。だがアクロポリスといえばアテナイのあれだという記憶を呼び起こして、観客を惑わせるおそれがある。もちろん、物語の場所は悲劇のはじめからはっきり明かされている。"
  "translation_status": "reviewed"
- "id": "becq-0226"
  "section_id": "ch25"
  "kind": "verse"
  "origin": "source"
  "source_text": "Le dessein en est pris: je pars, cher Théramène,\nEt quitte le séjour de l'aimable Trézène,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 226
    "line_start": 3199
    "line_end": 3200
  "translation_ja": "心は決まった、テラメーヌよ、私は行く。\nこの愛すべきトレゼーヌの住まいを去るのだ。"
  "translation_status": "reviewed"
- "id": "becq-0227"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "dit Hippolyte en entrant. Mais précisément ces deux vers et la toile du fond offrent au spectateur des associations d'idées contradictoires. Il y a donc là une modification nécessaire à faire, d'autant plus que dans la pièce on parle d'Athènes à différentes reprises, et que par suite cette toile de fond doit légèrement brouiller les idées d'un certain nombre de personnes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 227
    "line_start": 3202
    "line_end": 3207
  "translation_ja": "イポリットは登場しながら、そう言う。だがまさにこの二行と背景の幕が、観客に相矛盾する連想をさせてしまう。手を入れる必要がある。劇中ではアテナイにたびたび触れるので、この背景幕が一部の観客をいくらか混乱させるのはなおさらだ。"
  "translation_status": "reviewed"
- "id": "becq-0228"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'ornementation du décor consiste principalement en statues dont une seule serait utile, celle de Neptune. Comme grandeur elle est, il est vrai, la principale; malheureusement elle est mal placée, reléguée qu'elle est au fond à droite, sur un plan reculé. Il serait donc désirable qu'on la changeât de place, et qu'on la mît, par exemple, au premier plan, à droite. De la sorte, lorsque Thésée invoque Neptune, l'acteur pourrait s'adresser directement au simulacre du dieu, et ne serait pas contraint de lui tourner le dos, comme cela a lieu actuellement, étant admis qu'il est plus poli de tourner le dos à un dieu qu'au public. Ce déplacement aurait en outre l'avantage de forcer à l'enlèvement d'un hémicycle dont nous parlerons plus loin. Dans nos pièces modernes, chaque fois qu'un personnage s'adresse à la divinité, il se tourne vers son image, si celle-ci figure dans la décoration. Il n'y a qu'un cas où l'acteur peut tourner le dos à celui qu'il évoque ou qu'il invoque, c'est lorsque celui-ci est un fantôme qui n'a de réalité que dans l'imagination du personnage. C'est alors pour le public qu'on objective une apparition qui est entièrement subjective pour le personnage. Mais chaque cas doit d'ailleurs être étudié en lui-même. Je ne ferai pas d'autre observation en ce qui concerne la décoration et je passe au matériel figuratif."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 228
    "line_start": 3209
    "line_end": 3228
  "translation_ja": "舞台装置の飾りは、おもに彫像である。そのうち役に立つのは、ネプトゥーヌスの像一つだけだ。たしかに大きさではいちばんの像だが、残念なことに置き場所が悪い。右の奥、引っ込んだ位置に追いやられている。したがって、たとえば右手の舞台前方に移すのが望ましい。そうすればテゼがネプトゥーヌスに呼びかけるとき、俳優はその神の像にじかに向かって話せる。観客に背を向けるより神に背を向けるほうが礼儀にかなうとして、今のように神に背を向けることを強いられずにすむ。そこへ移せば、あとで述べる半円形の長椅子を取り払わざるをえなくなるという利点もある。現代の芝居では登場人物が神に話しかけるとき、その像が装置にあれば、そちらへ向き直る。俳優が呼び出した相手や祈りかけた相手に背を向けてよいのは、一つの場合だけだ。それが、人物の想像にしか実在しない幻の場合である。その場合、登場人物にとってはまったく主観の中にある幻を、観客のために目に見える形にしているのだ。ただしどの例も、一つずつその場に即して考える必要がある。舞台装置についてはこれ以上述べず、舞台上の実物に移ろう。"
  "translation_status": "reviewed"
- "id": "becq-0229"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On sait ce qu'un homme d'esprit disait d'un distique qu'on venait de lui lire: il est fort joli, mais il y a des longueurs! Eh bien, le matériel figuratif consiste en trois sièges et l'on peut dire qu'il est excessif. A gauche on a placé un fauteuil, à droite un tabouret et un banc en forme d'hémicycle. Le premier siège est indispensable, car c'est lui que les suivantes de Phèdre approchent de leur maîtresse, lorsque, à son entrée, au premier acte, elle est près de défaillir. Le second peut être admis; et c'est lui qui servira à Thésée, si l'on croit, ce qui est pour moi un point douteux, qu'il soit nécessaire à celui-ci de s'asseoir. Mais c'est, à mon avis, une faute de mise en scène que d'avoir installé à droite, au premier plan, un banc en forme d'hémicycle. On pourrait tout d'abord insister sur le peu de convenance architecturale de cet hémicycle, attendu qu'il n'est pas nécessité par une forme particulière du mur du péristyle. Il n'est pas probable qu'un hémicycle ait jamais été placé de la sorte sous un portique. Mais toutes les raisons qu'on pourrait faire valoir dans cet ordre d'idées ne seraient que des raisons d'architecte ou d'archéologue, et par conséquent seraient les plus vaines du monde, si cet hémicycle était imposé par la mise en scène et favorisait, soit le développement de l'action, soit le jeu des acteurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 229
    "line_start": 3230
    "line_end": 3248
  "translation_ja": "ある機知に富む人が、読んで聞かされた二行詩についてこう言ったのは有名だ。「とてもきれいだ。でも、冗長なところがある！」さて、舞台上の実物は腰掛け三つだが、それでも多すぎると言える。左に肘掛け椅子、右に背もたれのない腰掛けと半円形の長椅子がある。最初の椅子は欠かせない。第一幕でフェードルが登場し、気を失いかけると、侍女たちが主人のところへ寄せる椅子だからだ。二つ目はあってもよい。テゼが腰を下ろす必要があると考えるなら、これを使えばよい。私には、その必要があるかどうかも疑わしいが。だが右手の舞台前方に半円形の長椅子を置いたのは、演出の誤りだと思う。列柱廊の壁の形からそうしなければならないわけでもないのだから、この半円形が建築上その場にふさわしくないことを、まず挙げてもよい。半円形の椅子がこのように柱廊の下に置かれたことは、おそらくない。しかし、この手の理由はすべて建築家か考古学者の理由でしかない。もし演出上どうしてもその長椅子が必要で、筋の展開か俳優の演技の役に立つなら、これほど空虚な理由もないだろう。"
  "translation_status": "reviewed"
- "id": "becq-0230"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, et c'est là la seule raison valable en fait de mise en scène, cet hémicycle, non seulement est inutile au développement de l'action, mais encore nuit au jeu des acteurs et a la plus funeste influence sur l'attitude de Thésée. L'acteur, en effet, supposant qu'un siège est fait pour s'en servir, a la malencontreuse idée de s'asseoir sur cet hémicycle. Malheureusement la forme semi-circulaire n'est pas favorable à la sévérité de l'attitude et favorise au contraire une certaine, nonchalance qui manque de grandeur au théâtre et nuit au caractère majestueux que doit conserver Thésée aux yeux des spectateurs. En outre, en offrant ainsi au héros un siège aussi défavorable, le metteur en scène devient en partie responsable de l'interprétation défectueuse du rôle. En dehors du cinquième acte, où Thésée écoute le récit de Théramène, accablé et par conséquent assis, il n'y a qu'un moment dans la tragédie où l'on puisse supposer que Thésée prenne un siège; c'est au commencement du quatrième acte. Quand la toile se lève, Thésée est assis (pour cela le siège sans bras suffit); et cette attitude résulte du sentiment qu'éprouve le héros. Il vient d'entendre l'accusation portée par Oenone, et il interroge celle-ci, méditant sur la cruauté de ce coup du destin qui l'attendait à son retour dans son palais. Toute cette première partie de l'acte a un caractère délibératif qui permet à Thésée d'être assis. L'agitation du héros est interne et ne deviendra en quelque sorte externe que lorsque le sentiment qui l'anime, de délibératif qu'il était, deviendra résolutif. Or, le discours de Thésée prend décidément le caractère actif et résolutif aux premiers mots que lui adresse Hippolyte. Le héros se dresse alors et jette à son fils ce vers qui l'accable:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 230
    "line_start": 3250
    "line_end": 3275
  "translation_ja": "ところが、演出上ものを言う理由はただ一つ、この長椅子は筋の展開の役に立たないばかりか、俳優の演技を損ない、テゼの姿勢に実に有害な影響を及ぼすのである。腰掛けは腰を下ろすためのものだと考えた俳優は、間の悪いことに、この長椅子に腰を下ろそうと思いつく。あいにく半円形では姿勢が引き締まらず、どことなくだらりとした姿勢になりやすい。舞台では風格を欠き、テゼが観客の目に保たねばならない威厳を損なう。さらに、これほど不向きな椅子を英雄に与えると、演出家は不十分な役の解釈の責任を一部負うことになる。テゼが打ちひしがれて、だから腰を下ろしてテラメーヌの報告を聞く第五幕を別にすれば、腰掛けに座りうるのは、悲劇の中で一度、第四幕のはじめだけだ。幕が上がるとテゼは座っている。そのためには肘掛けのない椅子で十分であり、この姿勢はそのときの英雄の心情から出る。エノーヌの告発を聞いたばかりのテゼは、宮殿へ戻ったところで待ち受けていた運命の一撃の残酷さを思いながら、エノーヌに問いただす。幕のこの初めの部分はずっと、考えをめぐらす性格を持つので、テゼは座っていてよい。英雄の動揺は内にあり、考えていた心が決断に向かうときだけ、いわば外に現れる。さてイポリットが最初の言葉をかけたとたん、テゼの言葉には行動と決断の色がはっきり出る。英雄はそこで立ち上がり、息子を打ちのめすこの一行を浴びせる。"
  "translation_status": "reviewed"
- "id": "becq-0231"
  "section_id": "ch25"
  "kind": "verse"
  "origin": "source"
  "source_text": "Perfide! oses-tu bien te montrer devant moi?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 231
    "line_start": 3277
    "line_end": 3277
  "translation_ja": "裏切り者め、よくも私の前に顔を出せたな。"
  "translation_status": "reviewed"
- "id": "becq-0232"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A partir de ce moment, jusqu'à celui où Thésée tombe sur son siège en apprenant la mort de son fils, jamais il ne doit plus s'asseoir. Le courroux aveugle qui s'est emparé de lui, l'exaspération nerveuse qui l'agite et qui s'échappe au dehors, comme une flamme d'une fournaise ardente, a pour premier effet une très forte tension musculaire qui s'oppose au fléchissement nécessaire à l'action de s'asseoir. Prendre un siège c'est, pour l'acteur qui joue le rôle de Thésée, mettre son état physique en contradiction avec l'état moral du personnage, car ce serait l'indice d'une détente dans la colère du héros. Si Thésée s'asseyait, c'est qu'il réfléchirait; et s'il réfléchissait, il suspendrait les imprécations qu'il lance contre Hippolyte. Si au quatrième acte il ne s'assied point, c'est qu'à la colère a succédé l'inquiétude, nouveau sentiment qui maintient son agitation et appelle encore de nouvelles décharges nerveuses sur le système musculaire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 232
    "line_start": 3279
    "line_end": 3292
  "translation_ja": "このときから息子の死を知って腰掛けに崩れ落ちるまで、テゼは決してもう座ってはならない。理性を失わせる怒りにとりつかれ、神経が激しく高ぶり、燃え盛る炉から炎が噴き出すように、それが外に現れる。まず筋肉がひどく張り、腰を下ろすのに必要な体の屈曲を妨げる。腰掛けに座れば、テゼ役の俳優は体の状態を人物の心の状態と矛盾させることになる。英雄の怒りがゆるんだしるしになってしまうからだ。テゼが座るなら、物を考えるはずだ。物を考えるなら、イポリットに浴びせている呪詛を中断するはずだ。第四幕で座らないのは、怒りのあとに不安が来るからである。その新しい感情は動揺を持続させ、神経から筋肉へ、なおも新たな興奮を伝える。"
  "translation_status": "reviewed"
- "id": "becq-0233"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au lieu de ce jeu naturel, dicté par l'état physiologique de Thésée, l'acteur qui remplit ce rôle a le tort, pendant une partie de la scène avec Hippolyte, tantôt de s'asseoir sur l'hémicycle, qui le force à une attitude abandonnée, absolument contradictoire, tantôt de jouer debout sur la marche de l'hémicycle: or Thésée, dans l'état d'agitation où il se trouve, ne pourrait supporter d'être ainsi rivé à un aussi étroit espace. Concluons donc que si on avait pensé que cet hémicycle ne pût servir on ne l'aurait pas placé au premier plan; il dénote, par conséquent, une fausse conception du rôle de Thésée, et c'est ainsi que la mise en scène pousse un acteur à une fâcheuse interprétation de son rôle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 233
    "line_start": 3294
    "line_end": 3304
  "translation_ja": "テゼの生理的な状態が求めるこの自然な演技の代わりに、役の俳優はイポリットとの場面の途中で、半円形の長椅子に座り、まったく矛盾した、しまりのない姿勢を取ることもあれば、長椅子の段の上に立って演じることもある。だがあれほど動揺したテゼが、こんな狭い場所に釘づけにされることに耐えられるはずがない。結局、その半円形の長椅子が役に立たないと考えていたなら、前方には置かなかっただろう。置いたこと自体がテゼの役どころを誤って捉えたしるしであり、このようにして演出が俳優を好ましくない役の解釈に追い込むのである。"
  "translation_status": "reviewed"
- "id": "becq-0234"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cet exemple est de nature, il me semble, à faire saisir toute l'importance de la mise en scène. Un objet, insignifiant à première vue, prend souvent une valeur considérable et agit alors fatalement sur le jeu des acteurs et sur l'effet général du drame. Les quelques réflexions que nous inspirera l'examen des costumes nous conduira à la même conclusion."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 234
    "line_start": 3306
    "line_end": 3311
  "translation_ja": "この例で、演出がいかに重要かはよく分かると思う。一見なんでもない物が、しばしばたいへん重要になり、そうなると必然的に、俳優の演技と劇全体の効果に作用する。衣装を調べて思いつくことをいくつか挙げても、結論は同じになる。"
  "translation_status": "reviewed"
- "id": "becq-0235"

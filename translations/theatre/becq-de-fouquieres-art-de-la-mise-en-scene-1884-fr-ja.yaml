- "id": "becq-0175"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce que nous cherchons dans le théâtre, en dépit de l'école réaliste, qui a absolument tort sur ce point, c'est une image des idées acquises et enregistrées par notre esprit; c'est le spectacle de passions analogues à celles qui pourraient nous agiter. Le théâtre est donc en quelque sorte fondé sur le transport de nos propres états de conscience dans les personnages du drame. Tout ce qui n'est pas concevable pour nous-mêmes n'est ni vrai ni vraisemblable à nos yeux. Tout le monde sait combien il nous est difficile, pour ne pas dire impossible, de concevoir des êtres ayant un sixième, un septième, un huitième sens, ou des corps ayant moins ou plus de trois dimensions. Il en est de même des idées: il nous est impossible de concevoir chez un autre des idées que nous ne concevons pas en nous. On peut en donner un exemple historique frappant. Supposons qu'un poète nous représente Périclès pleurant sur le tombeau du dernier de ses fils. Certes ce sera un spectacle touchant si nous ne voyons en lui qu'un père, en tout semblable à nous, se lamentant sur la perte d'un fils bien-aimé. Mais si l'auteur s'avise de faire de l'archéologie morale et veut nous intéresser au chagrin particulier qu'a ressenti Périclès à la pensée que son tombeau et ceux de tous les Alcméonides seraient désormais privés des honneurs et des rites héréditaires, il est certain que le chagrin de ce grand homme, démesurément grossi d'un trouble superstitieux que nous ne concevons plus, nous paraîtra purement oratoire et ne nous inspirera aucune sympathie, par la raison bien simple que ce sont des sentiments qui se sont éteints en se transformant et qui n'ont aujourd'hui aucune prise sur notre coeur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 175
    "line_start": 2349
    "line_end": 2373
  "translation_ja": "写実主義の流派はこの点でまったく間違っているが、私たちが芝居に求めるのは、すでに知って精神に刻んだ観念の像であり、私たち自身を揺さぶりうるものに似た情念を見ることである。劇場はそれゆえ、いわば、自分が意識している状態を戯曲の登場人物へ移すことに基づく。自分で思い描けないものは何であれ、私たちの目には真実でももっともらしくもない。第六、第七、第八の感覚を持つ存在や、三次元より少ない、あるいは多い次元の物体を思い描くことが、不可能と言わずともどれほど難しいかは、誰でも知っている。考えも同じで、自分のうちに思い浮かべられない考えを、ほかの人のうちに思い浮かべることはできない。歴史から目立つ例を挙げられる。作家が、最後に残った息子の墓の前で泣くペリクレスを描くとしよう。愛する息子を失って悲しむ、私たちと何も変わらない父親と見るかぎり、確かに心を打つ光景だ。しかし、作家が人の心の考古学に乗り出し、これからは自分の墓もアルクメオン家の一族すべての墓も、代々の栄誉と祭祀を受けられないと考えたペリクレスに、どんな特別の悲しみが生じたかに、私たちの関心を向けようとしたら、どうなるだろう。この偉人の悲しみは、私たちがもう理解できない迷信の不安で途方もなくふくらみ、口先の大げさな言葉にしか見えず、何の共感も呼ばないのは確実である。理由は簡単だ。そうした感情は姿を変えながら消えていき、今日の私たちの心には、もう何の力も及ぼさないからである。"
  "translation_status": "reviewed"
- "id": "becq-0176"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce que nous venons de dire des sentiments et des idées exprimées par le drame est également vrai de la mise en scène. Oserait-on, par exemple, dans la représentation d'un drame oriental, étaler à nos yeux cet amalgame étrange d'objets européens et d'objets asiatiques qui dépare la vie des plus grands seigneurs, ce mélange bizarre des modes séculaires de Constantinople et des modes les plus vulgaires de Paris? De pareilles disparates, qui sont fréquentes dans la vie orientale telle que l'a faite le cosmopolitisme moderne, nous choqueraient à ce point que nous ne pourrions en supporter la vue. Elles seraient, en effet, en contradiction avec la représentation que notre imagination nous fait de la vie orientale, et c'est cette représentation-là que nous doit le metteur en scène. La couleur locale n'a de prix que lorsque c'est celle-là même que peut imaginer le spectateur. Si on s'ingéniait à monter un drame chinois, se déroulant par exemple à Pékin, il est clair que ce qu'il y aurait de plus simple serait de nous montrer des kiosques, des arbres, des Chinois et des Chinoises de paravent, car ce sont ceux-là seulement que nous connaissons et qui ont à nos yeux le plus pur caractère chinois. Or, tout ce qui nous est étranger est, à un degré quelconque, un peu chinois pour nous."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 176
    "line_start": 2375
    "line_end": 2393
  "translation_ja": "劇が表す感情と考えについて述べたことは、演出にも同じように当てはまる。たとえば東方を舞台にした劇を上演するとき、身分の高い貴族の生活にさえ不釣り合いな、ヨーロッパの物とアジアの物との奇妙な混在、コンスタンティノープルの何世紀来の流行と、パリの通俗的な流行との妙な取り合わせを、あえて目の前に並べられるだろうか。近代の国際化がもたらした東方の暮らしでは、このような不釣り合いは珍しくない。だが、私たちには、見ていられないほど目障りに感じられるだろう。自分たちの想像力が作り出す東方の暮らしの像に反するためであり、演出家が私たちに与えるべきは、そのように思い描いた像のほうだからである。土地の色合いに値打ちがあるのは、観客が想像できるのと同じ色合いであるときだけだ。たとえば北京を舞台とする中国の劇を上演しようと思いをめぐらせたら、もっとも簡単なのは、屏風に描かれたようなあずまやや木々、中国の男や女を見せることだろうと分かる。私たちが知っていて、もっとも純粋に中国らしく見えるのは、それらだけだからだ。結局、私たちにとってなじみのないものは、どれも多かれ少なかれ「中国のこと」のように分かりにくいのだ。"
  "translation_status": "reviewed"
- "id": "becq-0177"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si donc on se demande quelle est la règle générale qui doit présider à la mise en scène d'une pièce dont la difficulté de représentation provient de la distance ou du temps, nous dirons que cette règle consiste dans la prédominance des traits généraux sur les traits particuliers, aussi bien dans les idées et dans le langage, ce qui est du domaine du poète, que dans la décoration, dans le matériel figuratif et dans les costumes, ce qui rentre dans le domaine du metteur en scène. Quelle que soit la distance ou quel que soit le temps, d'ailleurs, on descend du général au particulier en proportion de la connaissance que nous possédons du milieu représenté. En tout cas, il faut avoir le courage de répudier toute manifestation inutile et par conséquent inopportune de la couleur locale. Le romantisme en a singulièrement abusé, et c'est précisément cet abus qui est cause que les pièces d'il y a cinquante ans ont si vite vieilli et sont aujourd'hui singulièrement démodées. C'est que précisément ce qu'on appelle la couleur locale est plus qu'on ne pense une question de point de vue. Nous n'avons jamais qu'une notion imparfaite de ce qui est éloigné de nous par le temps ou par la distance, et ce que nous croyons être une vérité absolue n'est jamais qu'une vérité relative, fondée précisément sur nos goûts, sur nos idées, sur nos vues actuelles. On a abusé à un certain moment du moyen âge et de la chevalerie; or, ce qu'en 1830 on croyait être, soit le langage, soit l'esprit du moyen âge, n'est aujourd'hui à nos yeux que le langage et l'esprit de 1830. Nous voyons le passé sous un angle différent. Si donc, à cette époque, on s'était contenté de marquer le moyen âge de traits généraux, ceux-ci auraient conservé le privilège de nous le rendre à peu près tel que nous pouvons encore le concevoir aujourd'hui; mais ce sont les traits particuliers qui ont gâté le portrait et lui donnent maintenant un certain air de caricature."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 177
    "line_start": 2395
    "line_end": 2422
  "translation_ja": "では、遠い距離や昔の時代のために上演が難しい芝居を演出する、一般の決まりは何か。一般的な特徴を個別の特徴より優先することだ、と答えよう。作家の領分である考え方や言葉でも、演出家の領分である装置、舞台上の実物、衣裳でも、同じである。ただし、遠さや時代がどうであれ、描く環境をどれほど知っているかに応じて、一般的なところから細部へ進む。いずれにしても、役に立たず、したがって場にそぐわない土地の色合いは、一切退ける勇気をもたなければならない。ロマン派はことのほかこれを乱用した。五十年前の芝居がこんなに早く老い、今日、ひどく時代遅れになったのも、まさにこの乱用のせいだ。土地の色合いと呼ぶものは、思われている以上に、見方の問題なのだ。時間や距離で遠く隔たったものについて、私たちにはいつでも不完全な考えしかない。絶対の真実だと思うものも、私たちの現在の好み、考え方、見方にまさしく基づく、相対的な真実にすぎない。あるときは中世や騎士道が盛んに乱用されたが、1830年に中世の言葉や精神だと信じられたものは、今の私たちには1830年の言葉と精神にしか見えない。私たちは過去を違う角度から見ている。だから、当時の人々が、中世に一般的な特徴だけを与えていれば、その特徴は今なお、私たちが思い描けるのに近い中世を見せる力を保っていただろう。ところが個別の特徴が肖像を損ない、いまやいくらか戯画の面影を与えている。"
  "translation_status": "reviewed"
- "id": "becq-0178"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "N'est-ce pas, en effet, ce défaut, joint à l'abus du pittoresque et de l'antithèse, qui déjà, du vivant même de Victor Hugo, nuit à l'oeuvre dramatique du poète, en dépit de l'imagination poétique qu'on admire dans Hernani, cette oeuvre rayonnante de jeunesse et de passion, en dépit de la perfection littéraire à laquelle atteint le style de Ruy Blas. Au contraire, le Cid et Bajazet ont-ils vieilli? Ils n'ont pas aujourd'hui une ride de plus qu'au jour où ils ont paru sur la scène. Le Cid a par lui-même un effet représentatif considérable, mais Corneille ne s'est pas abandonné à la couleur locale; ses héros sont marqués de traits humains plus que particulièrement espagnols, sauf en ce qui concerne l'honneur. Sans doute l'enflure du style cornélien ne correspond plus à notre goût actuel, mais elle est corrigée par la franchise de l'accent et par la beauté morale des situations, sur laquelle la recherche du pittoresque n'empiète jamais. Quant à Bajazet, qui ne devrait jamais quitter pour longtemps le répertoire de la Comédie-Française, et que je ne puis jamais relire sans une profonde émotion esthétique, il devra son éternelle jeunesse à la prédominance des traits généraux sur les traits particuliers, ce qui est remarquable dans un sujet qui aurait comporté facilement un abus d'effets représentatifs, tirés de la vie orientale et des mystères qui planent sur les drames des harems, abus dans lequel ne manquerait peut-être pas de tomber un auteur moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 178
    "line_start": 2424
    "line_end": 2445
  "translation_ja": "実際、この欠点と、絵になる効果や対照の乱用が重なって、ヴィクトル・ユゴーの存命中から、この作家の戯曲に障りをきたしているのではないか。若さと情熱に輝く『エルナニ』に、感嘆すべき詩的想像力があっても、『リュイ・ブラース』の文体が文学的な完成に達していても、そうなのだ。逆に、『ル・シッド』や『バジャゼ』は老いただろうか。舞台に初めて出た日より、しわ一つ増えていない。『ル・シッド』はそれだけで大きな上演効果をもつが、コルネイユは土地の色合いに身を委ねなかった。名誉に関することを除けば、彼の英雄たちは、スペイン特有の特徴というより、人間に共通の特徴をそなえている。確かに、コルネイユの大仰な文体は私たちの現在の好みに合っていない。だが率直な語調と、絵になる効果をむやみに求めても侵されない、状況の道徳的な美しさが、それを補っている。『バジャゼ』は、いつまでもコメディ・フランセーズの演目から離すべきでなく、私が読み返すたびに深い美的感動を覚える戯曲である。長く若さを保つのは、個別の特徴より一般的な特徴を優先したおかげだろう。東方の生活や後宮の劇を包む神秘から取り出した上演効果を、たやすく乱用できた題材だと考えると、この点は注目に値する。近代の作家なら、きっとこの乱用に陥っていたかもしれない。"
  "translation_status": "reviewed"

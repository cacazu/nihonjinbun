  "source_text": "Cette loi de proportion est souvent difficile à appliquer avec sagacité et montre avec quel soin préalable il faut faire le départ de tout ce que doit comprendre la partie décorative et de tous les objets qui doivent composer le matériel figuratif. Cette loi empêche la mise en scène de dégénérer en une exhibition inutile ou encombrante et maintient les yeux du spectateur sur les objets qui ont une réelle importance. Un habile directeur de théâtre arrive ainsi à produire une illusion parfaite en ne cherchant la perfection d'imitation que pour les objets qui doivent fixer l'attention du spectateur. Quand, par exemple, on examine à ce point de vue la décoration du premier acte des Rantzau, on remarque tout d'abord une grande abondance dans l'ensemble décoratif. L'impression de l'intérieur du vieil instituteur alsacien est très vive; rien n'y manque de ce qui peut nous raconter l'histoire de sa vie de famille et de travail, depuis le berceau jusqu'à la bibliothèque et aux collections de papillons. Mais ce n'est là qu'une impression générale due au premier aspect. Sitôt que l'oeil examine la mise en scène pour en tirer une induction sur le développement de l'action, tout rentre dans la décoration peinte; et le matériel figuratif ne se trouve en réalité composé que d'un très petit nombre d'objets. L'exécution des décorations est donc précédée d'un travail très délicat où le goût et la science de composition ont également leur part."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 164
    "line_start": 2149
    "line_end": 2169
  "translation_ja": "この比例の法則を分別よく当てはめるのは、難しいことが多い。描く装置に含めるものと、舞台上の実物にする品々とを、前もってどれほど念入りに仕分けしなければならないかが、そこから分かる。この法則によって、演出が無用な見せ物や煩雑な陳列に変質するのを防ぎ、観客の目を、本当に重要な物にとどめることができる。手腕のある劇場の責任者は、観客の注意をとどめるべき物だけを完璧にまね、このようにして完璧な錯覚を作り出す。たとえばこの点から『ランツァウ家の人々』第一幕の装置を見ると、まず、全体がたいそう豊かなのに気づく。アルザスの年老いた小学校教師の住まいだという印象は、とても鮮やかだ。揺りかごから書棚や蝶の標本に至るまで、家庭生活や働いてきた年月を伝えてくれるものは、何一つ欠けていない。だがそれは、初めの見た目から来る全体的な印象にすぎない。筋がどう発展するか推論しようと目を凝らせば、何もかも描かれた装置へ戻り、舞台上の実物は、ごくわずかしかないことに気づく。装置を作る前には、美的判断と構成の知識が同じだけ役割を果たす、きわめて繊細な仕事があるのである。"
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un acteur doit donc être un observateur de la nature, non pour transporter servilement ses observations sur la scène, mais pour enregistrer en lui tous les traits communs dont se compose synthétiquement l'idée ou l'image qu'il s'efforcera de reproduire. C'est pour cela que dans la carrière du comédien l'intuition lui est d'un si grand secours; car, après le travail inconscient de généralisation qui se produit en lui, cette faculté d'introspection lui permet d'avoir une vue très nette de l'image intérieure qui s'est formée dans son esprit; et c'est précisément cette vue très claire des idées qui fait les grands comédiens. Si l'un d'eux doit représenter une scène de folie, ira-t-il à Bicêtre étudier un fou particulier dont il s'efforcera de reproduire identiquement les airs, les gestes et toutes les manies? Non pas; mais il cherchera dans une visite générale à rassembler dans sa mémoire les traits communs qui se retrouvent dans tous les fous d'une même catégorie; surtout il s'efforcera, par une attention toute subjective, de tirer des ténèbres de son esprit l'idée qu'il se fait d'un fou et de bien se pénétrer, pour les reproduire, des traits qui composent cette image idéale. C'est précisément dans la fixation de cette image subjective et dans la difficulté de la transformer en une image objective que les comédiens ont toujours quelques progrès à faire. C'est cette image qui est le modèle dont le théâtre nous doit la plus frappante copie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 305
    "line_start": 4371
    "line_end": 4392
  "translation_ja": "だから俳優は自然の観察者でなければならない。ただし観察したものをそっくり舞台へ持ちこむためではない。再現しようとする観念やイメージを組み立てている共通の特徴を、自分の内に記録するためである。それゆえ、俳優の仕事で直観は大きな助けになる。本人の内で意識しないうちに一般化がなされたあと、内面を見つめる力によって、心にできた内なるイメージをはっきり見ることができる。この観念の明晰さこそ、大俳優を作る。たとえば錯乱の場面を演じなければならない俳優が、ビセートルの施設に行き、ある一人の患者を見て、表情、身ぶり、癖をすべてそっくり演じようとするだろうか。そうではない。施設を見て回り、同じ類に入る人々のうちに共通して現れる特徴を記憶に集めようとするだろう。何より、自分の内に注意を向け、錯乱した人について自分が持っている観念を心の暗がりから引き出し、その理想化したイメージを作る特徴をよくのみこんで、再現しようとする。主観のイメージをしっかり留め、それを客観のイメージに変える難しさ。この二つこそ、俳優にはまだ伸びる余地のあるところだ。このイメージを手本に、劇場はもっとも印象深い写しを私たちに見せなくてはならない。"
  "translation_status": "reviewed"
- "id": "becq-0306"
  "section_id": "ch31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Autrement, s'il s'agissait au théâtre de réalité, comment le public serait-il apte à juger de la vérité, lui qui la plupart du temps n'a pas directement observé cette réalité? Au contraire, transportez-le au milieu de civilisations éteintes ou étrangères, dans un milieu populaire, bourgeois ou aristocratique, étalez devant ses yeux les crimes les plus monstrueux, les actes vertueux les plus rares, il s'écriera ingénument: comme c'est nature! comme c'est vrai! et vous, poètes et comédiens, vous savourerez cette manifestation de son admiration, et c'est pour mériter cet éloge que vous donnez toutes vos forces à un travail qui souvent vous tue. Or, d'où le public tiendrait-il cette compétence que vous lui reconnaissez, s'il ne devait formuler son jugement que d'après l'observation personnelle et directe du phénomène? S'il a le droit de porter ainsi l'éloge ou le blâme sur vos travaux, sur vos conceptions et sur les résultats de vos longues et pénibles études, c'est qu'il rapporte la représentation que vous lui offrez à l'idée qu'il se fait du phénomène et à l'image qu'il possède en lui-même; et ce qu'il applaudit, ce n'est pas la reproduction d'une réalité qu'il ne lui a pas été donné d'observer directement, mais le degré de ressemblance de l'image que vous dessinez à ses yeux avec l'idée qu'il s'est formée du fait représenté."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 306
    "line_start": 4394
    "line_end": 4413
  "translation_ja": "そうでなければ、もし劇場で問われるのが現実そのものだとして、たいていはその現実をじかに見ていない観客が、どうして真実かどうかを判断できよう。逆に、もう滅んだ文明、異国の文明、庶民や市民や貴族の暮らしのただ中に観客を連れて行き、おそるべき罪や世にもまれな徳ある行いを目の前で見せてみよう。観客は無邪気に「なんと自然だ、なんと本当らしい」と叫ぶだろう。作者や俳優のみなさんは、その感嘆を聞いて喜ぶ。ほめ言葉を得たいからこそ、身をすり減らすこともしばしばの仕事に全力を注ぐのだ。では、観客が自分でじかに見た現象に基づいてしか判断できないとしたら、みなさんが認めている判断力は、いったいどこから来るのか。みなさんの仕事、構想、長くつらい研究の結果をほめたり悪く言ったりする資格が観客にあるのは、見せられた表象を、自分がその現象について持つ観念、自分の中にあるイメージに照らすからだ。観客が拍手するのは、じかに見る機会のなかった現実を再現したことにではない。その目に映るようみなさんが描いたイメージが、舞台に表された出来事について自分で作り上げた観念にどれほど似ているかに対してなのだ。"
  "translation_status": "reviewed"

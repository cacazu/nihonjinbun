  "section_id": "ch19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lois restrictives de la mise en scène.--De la loi de proportion--Plans d'importance scénique.--L'Ami Fritz.--Des repas de théâtre.--Application de la loi au matériel figuratif."
  "source_languages":

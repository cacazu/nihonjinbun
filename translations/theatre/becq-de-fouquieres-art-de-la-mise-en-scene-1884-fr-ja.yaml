  "origin": "source"
  "source_text": "Le premier résultat de cette révolution esthétique a été de proscrire l'orchestre des théâtres. Aujourd'hui, il a complètement disparu de la Comédie-Française, de l'Odéon, du Vaudeville et du Gymnase. Il n'a gardé sa place que dans les théâtres voués encore au mélodrame et dans ceux où l'on cultive les genres mixtes qui tiennent de l'opérette et de l'ancien vaudeville. La disparition de l'orchestre entraîne cette conséquence que, lorsque la musique doit jouer un rôle dans une pièce, ce sont les personnages eux-mêmes qui sont les exécutants, soit qu'ils chantent avec ou sans accompagnement, soit qu'ils jouent d'un ou de plusieurs instruments. Quand je dis que les personnages sont les exécutants, il faut ajouter que souvent ils ne sont que les exécutants apparents, ce qui suffit naturellement si l'acteur, qui est censé chanter ou jouer, n'est pas sur la scène, mais ce qui aujourd'hui ne serait guère admis quand l'acteur est en scène. On le tolère encore quand il s'agit d'un instrument à cordes, lorsque, par exemple, dans le Mariage de Figaro, Suzanne accompagne sur la guitare la romance que chante le page; mais une actrice qui ne serait pas musicienne ne saurait en général prendre un rôle comportant l'exécution d'un morceau de piano, tel que celui de Mlle de Saint-Geneix dans le Marquis de Villemer. Dans Barberine, le rôle peut être tenu par une actrice n'ayant pas de voix, puisque Barberine chante hors de la scène et peut être remplacée par une cantatrice. Il en est à peu près de même du rôle de François Ier dans le Roi s'amuse."

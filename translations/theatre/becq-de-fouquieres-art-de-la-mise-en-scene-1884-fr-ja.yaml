- "id": "becq-0185"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais bien mieux, pendant qu'à la Comédie-Française, on joue le Misanthrope en manteaux courts, on continue à le jouer à l'Odéon en habits carrés. Toutefois, comme l'exemple est contagieux, un des acteurs a eu l'idée de jouer le rôle d'Acaste en manteau, comme rue de Richelieu, tandis que tous les autres personnages conservent l'habit carré. Or, bien peu de spectateurs s'aperçoivent de ce qu'il y a de disparate dans ce mélange de modes qui ne sont point de la même époque. Cependant, nous serions choqués si on introduisait dans une comédie contemporaine en habits noirs un personnage habillé à la mode de 1830. C'est qu'avec le temps, on ne s'attache qu'aux caractères généraux et qu'on néglige les différences, pourtant considérables, qui naissent de la comparaison des traits particuliers."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 185
    "line_start": 2541
    "line_end": 2552
  "translation_ja": "もっとはっきりした例がある。コメディ・フランセーズでは短いマントで『人間嫌い』を演じているのに、オデオンでは角張った上衣のまま演じている。ただし手本は人に移るもので、オデオンの俳優の一人は、リシュリュー街の劇場にならって、アカストをマントで演じようと思いついた。ほかの人物はみな角張った上衣のままである。ところが、それぞれ時代の違う流行のこの取り合わせに、不調和があると気づく観客はごく少ない。それなのに、黒い上衣で演じる同時代の喜劇に、1830年の流行の人物を一人入れれば、私たちは目障りに感じるだろう。時が過ぎるにつれ、人は一般的な特徴だけに目を向け、個別の特徴を比べれば分かる、かなり大きな違いも気にしなくなるからだ。"
  "translation_status": "reviewed"

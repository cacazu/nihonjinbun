- "id": "becq-0217"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la mise en scène d'une oeuvre tragique, il est donc sage d'abandonner toute prétention à une restauration antique, inutile et impossible. On se perdrait immanquablement dans des essais aussi vains que puérils. Ce que l'on prend d'ailleurs souvent pour des restaurations ne sont que des caricatures décoratives: c'est ainsi qu'il y a quelques années on avait une tendance générale à jouer dans des décors de style pompéien les tragédies dont l'action nous reporte au delà des temps historiques de la Grèce. Il faut donc s'efforcer d'effacer les traits particuliers et s'en tenir aux grandes lignes générales, se contenter d'une architecture simple et grande tout à la fois, de hauts et sévères portiques, peu surchargés d'ornements. Le vaste espace est de tous les milieux celui qui convient le mieux à la grandeur tragique. Quant aux costumes, il faut non sans doute s'en tenir à ceux dont se contente la statuaire, qui est l'art du nu par excellence, mais ne pas s'en écarter de parti pris, et s'en inspirer, dans le choix des tissus, auxquels on doit demander de beaux plis sculpturals. Tout en évitant la monotonie dans les couleurs et la constante uniformité des vêtements blancs, on ne doit pas rechercher des contrastes trop accentués, ni ce bariolage de tons crus auxquels il faut la brillante lumière de l'implacable soleil. L'éclairage plus que médiocre de nos scènes modernes n'admet pas l'abus du style polychrome."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 217
    "line_start": 3073
    "line_end": 3093
  "translation_ja": "だから悲劇を演出するとき、古代を復元するという考えは捨てるのが賢明だ。復元は不可能で、役にも立たない。無益で子どもじみた試みに、必ず迷い込むことになる。そもそも復元と見なされるものはしばしば、舞台美術の戯画にすぎない。数年前には、ギリシアの歴史時代より前にさかのぼる悲劇を、ポンペイ風の舞台装置で上演するのが広く行われたが、その一例だ。個々の特異な特徴を目立たなくし、大きな全体の線を守るよう努めるべきである。造りは単純でありながら雄大な建築、飾りを盛りすぎない、背の高い厳かな柱廊で十分だ。広大な空間は、あらゆる場所の中で、悲劇の偉大さに最もふさわしい。衣装も、もちろん、裸を表すのが最も得意な彫刻で事足りるものに限定する必要はない。だが、はじめから彫刻と違うように決めこまず、そこから布地を選ぶ着想を得て、彫刻のように美しくひだを作る素材を選ぶべきだ。色が単調にならず、いつも白一色の服にならないように気をつける一方で、強すぎる対照や、容赦ない太陽の眩しい光があって初めて成り立つ、どぎつい色の寄せ集めを求めてはならない。現代の舞台のお粗末きわまる照明では、多色仕上げは使いすぎられないからだ。"
  "translation_status": "reviewed"
- "id": "becq-0218"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En un mot, c'est nous, hommes du XIXe siècle, qui créons tout cet appareil théâtral par la puissance de notre imagination; nous projetons au dehors de nous et nous objectivons les images du monde antique qui se sont formées lentement en nous par la contemplation des statues, des vases, des médailles, des oeuvres des peintres de toutes les écoles et de tous les temps, par le souvenir de tout ce qui nous a été fourni par l'enseignement et par la lecture. L'idée du monde antique est en nous le résultat d'une synthèse qui a combiné en types généraux tous les éléments divers qui se sont tour à tour enregistrés en nous. Mais, puisque tout cet appareil théâtral n'est que le produit de notre imagination actuelle, il en résulte que la mise en scène de nos oeuvres classiques n'est pas en soi immuable, et qu'elle est susceptible de changer comme change de génération en génération l'image que les hommes se font du monde antique. Chacune de ces oeuvres doit donc, après un certain temps, être retirée du répertoire, pour y reparaître plus tard dans un nouvel état, plus conforme aux idées nouvelles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 218
    "line_start": 3095
    "line_end": 3110
  "translation_ja": "ひとことで言えば、この舞台の仕掛けをすべて作るのは、私たち19世紀の人間の想像力である。彫像、壺、メダル、あらゆる流派と時代の絵を見つめ、学んだり読んだりしたあらゆることを思い出すうちに、古代世界のイメージがゆっくり私たちの中に形をなしてきた。そのイメージを自分の外に映し出し、実物として形にするのである。私たちの古代世界の観念は、次々と心に刻まれたさまざまな要素を、一般的な型にまとめ上げた結果だ。しかし、この舞台の仕掛けすべてが、今の私たちの想像の産物でしかないなら、古典作品の演出そのものも不変ではない。世代が変わるごとに、人が古代世界に抱くイメージが変わるように、演出も変わりうる。だから古典の一作一作を、ある期間が過ぎたら演目から外し、後日、新しい考えにふさわしく姿を改めて、演目に戻す必要がある。"
  "translation_status": "reviewed"
- "id": "becq-0219"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous dirons de plus, au sujet des costumes, que, quelle que soit la vérité présumée de ceux que l'on choisit, ils ne peuvent être jugés et considérés à part de la personne même de l'acteur ou de l'actrice. Il est, en effet, à penser qu'une modification du costume sera nécessaire chaque fois que le rôle changera de titulaire; car la première loi du costume de théâtre, c'est d'être en rapport avec l'âge, la stature et l'air de la personne qui doit le porter. Pour produire un effet d'une puissance égale, il est nécessaire que le costume change suivant l'apparence de l'acteur. Le point fixe, immuable, c'est l'effet à produire; ce qui est mobile et changeant, c'est le moyen de produire cet effet. N'est-ce pas d'ailleurs la loi naturelle? Les femmes qui veulent plaire n'ajustent-elles pas leurs toilettes à l'air de leur visage? Les acteurs et les actrices sont soumis à la même loi. La première condition de tel costume est de donner à celui qui le porte un air majestueux, et non d'être à priori de telle forme et de telle couleur. D'ailleurs, au théâtre, un acteur ne se substitue pas à un autre, il lui succède; et il y a toujours au moins dans l'ajustement du costume quelque détail à modifier. Je ne parle bien entendu que des rôles importants, et je ne tiens pas compte des cas fortuits ou de force majeure."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 219
    "line_start": 3112
    "line_end": 3130
  "translation_ja": "衣装について、さらにこうも言える。選んだ衣装がいかに歴史にかなうように見えても、実際に着る俳優から切り離して、考えたり評価したりすることはできない。役を演じる人が代わるたびに、衣装を直す必要があるはずだ。年齢、体格、面差しなど、着る本人に合うことが、舞台衣装の第一の法則だからである。同じ強さの効果を出すには、俳優の見かけに応じて衣装も変えなくてはならない。動かず変わらないのは、出そうとする効果であり、動き変わるのは、その効果を出す手段である。それが自然の法則ではないだろうか。美しく見せたい女性が、顔立ちに合わせて装いを選ぶのと同じだ。その法則は俳優の男女を問わない。ある衣装の第一の条件は、着る人に威厳を与えることであり、初めから形や色が決まっていることではない。また、演劇で一人の俳優が別の俳優と引き換えになるのではなく、そのあとを継ぐ。だから衣装を合わせるとき、どうしても少なくとも一か所は細部を直さなければならない。もちろん重要な役だけを論じており、偶発の事態や、やむをえない交代は別とする。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 994
      "end": 1002
      "exact": "à priori"
- "id": "becq-0220"
  "section_id": "ch24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais je me hâte d'abandonner les généralités, car je crois plus profitable de prendre un exemple particulier, qui me fournira l'occasion d'agiter plusieurs questions intéressantes et importantes pour l'art de la mise en scène. Je vais donc passer en revue la mise en scène de la Phèdre de Racine, telle qu'elle est réglée actuellement à la Comédie-Française."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 220
    "line_start": 3132
    "line_end": 3137
  "translation_ja": "だが総論はもう切り上げよう。演出の芸術にとって興味深く重要な問題をいくつも取り上げるには、一つの具体例を選ぶほうが実りが多いと思うからだ。そこで、現在コメディ・フランセーズで定められているラシーヌの『フェードル』の演出を、順を追って見ていこう。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":

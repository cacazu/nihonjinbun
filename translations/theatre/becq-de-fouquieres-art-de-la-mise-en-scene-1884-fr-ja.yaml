- "id": "becq-0125"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rapports de la mise en scène avec le milieu dramatique.--Pièces où domine l'imagination.--Le théâtre de Scribe.--Le théâtre de Victor Hugo.--Effet curieux observé dans Quatre-vingt-treize."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 125
    "line_start": 1541
    "line_end": 1543
  "translation_ja": "演出と劇中の環境との関係。想像力が優位に立つ芝居。スクリーブの劇。ヴィクトル・ユゴーの劇。『九十三年』で見られた興味深い効果。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 168
      "end": 187
      "exact": "Quatre-vingt-treize"
- "id": "becq-0126"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le milieu dramatique est très différent du milieu théâtral, puisque le milieu dramatique peut varier dans un même milieu théâtral. Nous écartons tout d'abord les oeuvres classiques qui méritent une étude spéciale. Mais il est encore nécessaire de restreindre notre sujet; car il ne tendrait à rien moins qu'à passer en revue tous les genres de la littérature dramatique, tels que le drame héroïque, historique, romantique ou bourgeois, et la comédie d'intrigue, de caractère ou de sentiment. Nous croyons plus profitable de considérer le milieu dramatique dans ses rapports avec l'imagination, le sentiment et la fantaisie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 126
    "line_start": 1546
    "line_end": 1555
  "translation_ja": "劇中の環境と劇場の環境とでは、ずいぶん違う。同じ劇場を取り巻く環境のもとでも、劇中の環境は、芝居ごとに異なりうるからだ。独立に論じる値打ちがある古典作品は、まず除いておく。それでもなお、主題を絞らなければならない。さもなければ、英雄劇、歴史劇、ロマン派の劇、市民劇、それに筋立ての喜劇、性格の喜劇、感情の喜劇といった、あらゆる劇文学のジャンルを見て回ることにほかならなくなる。劇中の環境については、想像力、感情、奔放な空想との関わりを考えるほうが実り多いと思う。"
  "translation_status": "reviewed"
- "id": "becq-0127"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La nature de l'imagination dépend de la nature de l'esprit; elle varie suivant l'attrait que l'esprit éprouve pour telle qualité, tel caractère, telle forme ou telle coloration des images remémorées et associées. En se plaçant à un point de vue très général, on peut dire qu'il y a deux sortes d'imaginations; premièrement, celle qui est surtout séduite par les contours et les formes, les rapports des formes entre elles, leur agencement, les qualités extérieures et superficielles des objets; deuxièmement, celle qui se laisse charmer par la couleur, les effets d'ombre et de lumière, les rapports de nature entre les objets, leurs qualités substantielles et leur agencement pittoresque dans les profondeurs de l'espace. Quand il s'agit d'oeuvres théâtrales, la mise en scène devra naturellement varier selon la nature particulière de l'imagination du poète."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 127
    "line_start": 1557
    "line_end": 1569
  "translation_ja": "想像力の性質は精神の性質しだいである。思い起こして結びつけたイメージのうち、どのような性質、特徴、形、色合いに精神が惹かれるかによって、想像力はさまざまに変わる。ごく大づかみにいえば、想像力には二種類ある。一つはとりわけ、輪郭や形、形どうしの関係や組み合わせ、物の外面的で表面的な性質に魅せられる想像力。もう一つは、色、光と影の効果、物の性質どうしの関係、物の本質的な性質や、空間の奥行きの中での絵になる配置に魅せられる想像力である。演劇の作品を扱うときは、演出も当然、劇作家の想像力がどんな性質をもつかに応じて変わらなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0128"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Scribe, on ne peut le nier, avait une imagination féconde, mais celle-ci avait un caractère superficiel et était uniquement théâtrale. Pour lui, le monde extérieur n'était qu'un décor et les hommes n'étaient que des comédiens. Il n'y avait en quelque sorte aucun lien sympathique entre son âme et l'âme des êtres et des choses. Son regard ne pénètre pas plus profondément que sa pensée; l'un et l'autre s'arrêtent aux surfaces et son génie se complaît dans les apparences. Aussi serait-ce une faute, quand il s'agit des oeuvres de Scribe, de détacher l'action sur un décor trop étudié, trop nature en quelque sorte; il leur faut une décoration un peu banale, qui ne fasse pas trop illusion, qui soit bien du carton et du papier peints, et derrière laquelle notre esprit devine la coulisse. De même, les acteurs devront craindre de paraître trop humains et de trop se rapprocher de la nature, car ils se mettraient en contradiction avec le génie particulier de l'auteur; ils doivent s'attacher à rester comédiens. Aux yeux de Scribe, l'art est destiné à nous procurer une délectation facile, sans secousse violente; et dans la représentation de ses pièces tout doit conserver ce caractère tempéré. La décoration ne doit exercer sur nos yeux qu'une illusion facile à s'évaporer, comme ces brillantes bulles de savon qu'un souffle fait évanouir; de même, l'action et la diction des acteurs, les péripéties tristes ou gaies par lesquelles passent les personnages doivent garder le caractère aimable d'un jeu d'esprit, comme il sied à une société d'où la belle humeur a proscrit les passions troublantes. En un mot, rien ne doit avoir la prétention d'affecter trop profondément notre âme. C'est pourquoi il ne faut rien de trop riche dans la décoration, rien d'inutile dans le matériel figuratif, rien de trop vrai surtout: des apparences de tableaux, des apparences de pendules, des apparences de meubles; des costumes sentant le théâtre et des accessoires sortant ostensiblement du magasin. C'est là que les fourchettes piquent des morceaux chimériques dans des pâtés de carton et que les verres ne s'emplissent que du vide des bouteilles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 128
    "line_start": 1571
    "line_end": 1601
  "translation_ja": "スクリーブの想像力が豊かだったことは否定できないが、その性質は表面的で、あくまで芝居のためのものだった。彼にとって外の世界はただの舞台装置、人間はただの俳優にすぎない。彼の心と、生き物や物のそれぞれに宿る心とのあいだには、いわば共感の絆が一つもなかった。まなざしは思考より深く入らず、どちらも表面にとどまって、彼の才能はうわべを楽しむ。だからスクリーブの作品では、あまり作り込んだ、いわば本物めきすぎた装置を背景にして、劇の出来事を際立たせるのは誤りである。その劇には、少しありふれていて、錯覚を誘いすぎず、いかにも厚紙と色を塗った紙でできていて、その向こうに舞台裏があると分かる装置が要る。俳優も、あまりに人間味を見せ、自然に近づきすぎるのを恐れなければならない。そうすれば、この作家に固有の才能と矛盾するからだ。俳優は俳優らしいままでいるべきである。スクリーブの目には、芸術は、激しく心を揺さぶらずに、たやすく喜びをもたらすためのものである。彼の戯曲の上演では、すべてがこの穏やかな性質を保つ必要がある。装置が私たちの目に与える錯覚は、息をかければ消えてしまう輝くシャボン玉のように、消えやすいものであってよい。俳優の動きと台詞回しも、登場人物が経る悲しい、あるいは楽しい展開も同じで、心をかき乱す情念が陽気さによって追放された社交界にふさわしい、愉快な機知の遊びでなければならない。要するに、私たちの心の奥まで動かせるなどと、何一つうぬぼれてはならない。だから装置には豊かすぎるもの、舞台上の実物には無用なもの、そして何よりも、本物に見えすぎるものはいらない。絵らしく見えるもの、置時計らしく見えるもの、家具らしく見えるもの。いかにも芝居の衣裳と、いかにも道具倉から出した小道具でよい。この舞台では、フォークが厚紙のパイから空想のひとかけらを刺し取り、グラスを満たすのは空の瓶の空っぽさだけである。"
  "translation_status": "reviewed"
- "id": "becq-0129"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Transportons maintenant ces procédés de mise en scène dans un autre milieu dramatique, dans le théâtre de Victor Hugo, par exemple, nous n'obtiendrons souvent par ces mêmes moyens que des effets disparates. C'est que toute autre est l'imagination substantielle et pittoresque du poète; elle est une représentation embellie, agrandie et en quelque sorte outrée de la nature, et l'être humain s'y montre toujours à l'état héroïque, ou grandiose ou grotesque, sous une lumière intense qui rend les ombres plus profondes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 129
    "line_start": 1603
    "line_end": 1610
  "translation_ja": "今度はこのような演出の手立てを、たとえばヴィクトル・ユゴーの劇という、別の劇中の環境に移してみよう。同じ手立てでも、しばしば、ちぐはぐな効果しか得られない。作家の、実質に富み絵になる想像力は、スクリーブとはまるで違うからだ。自然は美しく、大きく、いわば極端にまで誇張されて描かれる。その中で人間は、影を深める強烈な光に照らされ、いつも英雄の域に達した、壮大な、あるいは異様なものとして姿を見せる。"
  "translation_status": "reviewed"
- "id": "becq-0130"
  "section_id": "ch15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce grand effet de clair-obscur, que le poète projette sur les êtres et sur les choses, leur donne un relief saisissant. Lui-même, dans les indications de mise en scène qu'il joint à son oeuvre, fouille les détails, décrit les ameublements et les costumes, sculpte les bahuts et cisèle les armes. Dans ses vers, pas plus que dans ses indications scéniques, il ne se contente de l'à peu près théâtral: il touche et façonne les objets du pouce de Michel-Ange et les revêt de la couleur du Titien. Il faut à ses personnages des pourpoints de velours et de soie, des épées brillantes et souples; il faut à ses heureux interprètes un visage majestueux ou farouche, une parole caressante ou hautaine, un jeu de proportion héroïque, de façon que, laissant bien loin d'eux le comédien, ils dépassent un peu le personnage lui-même. A ses drames conviennent les décorations splendides, les ameublements somptueux, les foules innombrables de la figuration; car partout et toujours, derrière la décoration, derrière les personnages, comme un dieu impalpable derrière un héros de l'Iliade, on devine la grande ombre du poète dont la volonté puissante assemble les choses ou pousse et fait mouvoir ses personnages à nos yeux. Génie essentiellement lyrique, bien plutôt que dramatique, qui jamais n'abstrait son oeuvre de lui-même, et qui se sent à l'étroit sur les planches et entre les coulisses d'un théâtre. La véritable scène où se meuvent les personnages du drame, c'est le cerveau même du poète: c'est là qu'il faut chercher les mobiles secrets de ses héros, qui obéissent bien plus à la volonté expresse de leur créateur qu'à la logique de leurs propres passions; et c'est là seulement que peuvent entièrement se réaliser ses conceptions scéniques et décoratives souvent à peu près irréalisables, comme dans le Roi s'amuse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 130
    "line_start": 1612
    "line_end": 1637
  "translation_ja": "作家が人や物へ投げかけるこの大きな明暗の効果が、目をみはるほどの立体感を与える。彼はみずから作品に添えた演出の指示で細部を掘り下げ、家具と衣裳を描き、櫃を彫り、武具に丹念に細工する。詩句でも舞台の指示でも、ありあわせの芝居らしさには満足しない。ミケランジェロの親指で物に触れて形を作り、ティツィアーノの色に染めるのだ。登場人物にはビロードと絹の胴着、輝き、しなう剣が要る。その役に恵まれた俳優には、威厳があるか荒々しい顔、甘くか高慢に響く言葉、英雄にふさわしい大きな演技が要る。そうして、いかにも俳優らしいところは遠く後に置きながら、登場人物そのものを少し越えなければならない。その劇には、華麗な装置、ぜいたくな調度、数えきれない群衆役がふさわしい。というのも、いつでもどこでも、装置や登場人物の背後に、『イリアス』の英雄の背後に姿なき神がいるように、作家の大きな影を感じるからだ。その力強い意志が、物を一つにまとめ、登場人物の背を押して、私たちの目の前で動かすのである。この才能は根っから抒情的で、劇的というよりも、はるかに抒情的だ。けっして自分から作品を切り離さず、劇場の板の上、両袖に挟まれて窮屈に感じる。劇の登場人物が動く本当の舞台は、作家自身の頭の中なのだ。英雄たちが何にひそかに動かされたかは、そこで探さなければならない。彼らは自分たちの情念の論理より、彼らを作った人の明らかな意志に、ずっとよく従う。そして、『王は楽しむ』のように、ほとんど実現不可能な舞台や装置の構想を完全に実現できるのは、そこだけなのだ。"
  "translation_status": "reviewed"

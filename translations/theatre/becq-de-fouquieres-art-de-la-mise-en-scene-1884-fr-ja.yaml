  "kind": "paragraph"
  "origin": "source"
  "source_text": "le fond du théâtre s'ouvre. On aperçoit l'intérieur du temple et les lévites armés s'avancent sur la scène. On a tort, à la Comédie-Française, de ne pas exécuter entièrement cette mise en scène. Le fond du théâtre devrait s'ouvrir derrière le trône où est placé Joas; et le public devrait apercevoir, jusque dans les derniers plans du théâtre, les masses nombreuses des lévites armés. Au lieu de cela, on voit simplement entrer par les côtés un certain nombre de lévites tenant un glaive à la main. Cette figuration manque de grandeur et n'est pas de nature à faire sentir au public le poids dont la sainte armée devrait peser sur l'orgueil et sur la colère d'Athalie. Et ici ce sont bien les sentiments par lesquels passe Athalie qu'il faut nous faire comprendre et partager. Un glaive à la main des lévites ne suffit pas; il faudrait un appareil plus formidable, et surtout éviter l'entrée successive des lévites par les bas côtés. Au moment où le fond du théâtre s'ouvre et où l'on aperçoit les rangs pressés des lévites hérissés d'armes, le mouvement orchestrique devrait consister en une marche d'ensemble, de deux ou trois pas seulement, de toute cette troupe armée, divisée en deux groupes, l'un à gauche, l'autre à droite du trône. Cette double poussée imposante agirait avec une puissance que doublerait l'ensemble du mouvement; et nous participerions au sentiment de surprise et d'effroi qui s'empare de l'esprit d'Athalie. On peut d'ailleurs juger de la puissance d'effet que possède un mouvement d'ensemble par les ballets italiens dont c'est à peu près le seul mérite."
  "source_languages":
  - "fr"

- "id": "becq-0109"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous pouvons tirer quelques conclusions des idées exposées dans le chapitre précédent. Puisque le décor ne doit avoir qu'une influence générale sur l'esprit du spectateur, il est nécessaire qu'il soit traité avec une grande modération de tons et une grande simplicité de détails; il ne doit pas trop attirer les yeux, et, si ceux-ci s'y reposent, il ne doit leur présenter aucun trait susceptible de produire sur l'esprit une excitation spéciale. Quant aux objets représentés, qui par leur nature auraient pu faire partie du matériel figuratif, il est important qu'ils soient peints largement, sans aucune recherche du trompe-l'oeil. Agir autrement serait une grande faute; car, puisqu'on a jugé que tel objet, inutile à l'action, ne devait pas figurer en réalité sur la scène, il ne faut pas donner à cet objet peint la valeur de l'objet réel. Il est à peine besoin de signaler le cas où un objet figurant réellement doit avoir un pendant similaire: il est clair que ce pendant doit être réel et non peint. Dans un cabinet de travail, à gauche et à droite de la porte du milieu, sont placées deux bibliothèques; il faut de toute évidence qu'elles soient peintes toutes deux, ou que, si l'une est utile à l'action, elles soient toutes deux réelles. Il est inutile d'insister sur d'aussi simples détails."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 109
    "line_start": 1307
    "line_end": 1325
  "translation_ja": "前章で述べた考えから、いくつかの結論を引き出せる。装置が観客の精神に及ぼすのは全体的な影響だけでなければならない。だから色調を大いに抑え、細部はごく簡素に作る必要がある。あまり観客の目を引いてはならず、目がたまたまそこにとどまっても、精神を特別に刺激しかねない特徴を、何一つ見せてはならない。舞台に実際に置いてもおかしくない物を描くときは、だまし絵を求めず、大づかみに描くことが大切である。それと違うやり方なら、大きな誤りになる。ある物は筋に必要がないから、実物を舞台に置くべきでないと決めたのなら、絵で描いたのに実物と同じほどの重みを与えてはならないからだ。実際に置かれる物に、それと同じような対の品が要る場合については、言うまでもない。対の品も、絵ではなく実物でなければならないのは明らかだ。書斎の中央に扉があり、その左右に本棚が二つある。明らかに、両方とも絵に描くべきであり、一方が筋に必要なら、両方とも実物でなければならない。これほど単純な細部に、これ以上こだわることはない。"
  "translation_status": "reviewed"
- "id": "becq-0110"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si les détails du décor ne doivent pas affecter outre mesure l'esprit du spectateur, on conçoit combien, par contraste, le matériel figuratif prendra d'importance aux yeux du public et s'imposera à son attention. Ainsi, par le seul effet de cette double loi, le poète agit d'une façon certaine sur la direction de nos pensées. En faisant apparaître certains objets à nos yeux, il nous prépare tacitement à une évolution du drame. Puisque nous avons dit que le matériel figuratif, avait un rapport particulier avec l'action, il suit de là qu'aucun des objets réels qui le composent ne peut être indifférent. C'est donc une loi absolue de la mise en scène qu'aucun objet réel, prédestiné par sa nature ou par sa place à attirer l'attention du spectateur, ne peut être mis sous nos yeux à moins qu'il n'ait un rapport certain avec la marche du drame. Chacun d'eux joue donc un rôle, plus ou moins important, et à un moment donné aide au développement du drame et souvent concourt à une de ses évolutions. Dans Tartufe, la table couverte d'un tapis et sous laquelle se cache Orgon remplit un rôle de premier ordre. La vue d'une table sur la scène est donc loin d'être indifférente, et on peut en dire autant de tout le matériel figuratif. Naturellement, il y a toujours un certain nombre d'objets réels qui peuvent figurer dans la décoration sans attirer notre attention. Par exemple, si la mise en scène comporte une cheminée, on y joindra une garniture, pendule, vases, flambeaux, etc., sans que cela tire à conséquence, puisque cela forme pour l'oeil un ensemble auquel il est habitué. D'ailleurs, il est clair que certains objets sont plus caractéristiques que d'autres. Il est inutile d'insister: il y a dans tous les arts des règles de détail qui ne relèvent que du bon sens. En outre, l'apparition d'objets, même caractéristiques, perd de son importance si elle se rattache à une méthode générale de mise en scène, et si l'amplification porte sur tout l'ensemble du matériel figuratif."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 110
    "line_start": 1327
    "line_end": 1355
  "translation_ja": "装置の細部が観客の精神に過度の影響を与えてはならないのなら、それとの対照によって、舞台上の実物が観客の目にどれほど重みを増し、注意を引かずにはおかないかも分かる。この二重の法則の働きだけで、劇作家は、私たちの考えの向きを確実に導ける。ある品々を私たちの目に見せることによって、劇がどう展開するか、口に出さずに心の準備をさせるのだ。舞台上の実物は一つひとつが筋と特別な関わりをもつと述べた以上、それらの何一つとして、あってもなくてもよいことにはならない。したがって、その性質や置かれた場所から、当然観客の注意を引くような実物は、劇の進行に確かな関わりがないかぎり、目の前に置いてはならない。これは演出の絶対的な法則である。それらは一つひとつ、多かれ少なかれ大事な役目を果たす。あるときには劇の進行を助け、しばしば展開の一つに関わる。『タルチュフ』では、布の掛かった卓の下にオルゴンが隠れるので、その卓は第一級の役を果たす。舞台に卓が見えることには、どうでもよいなどとはいえない意味がある。舞台上の実物全体についても、同じことが言える。もちろん、装置の一部として実際に置いても、こちらの注意を引かない品々はいつもある。たとえば演出上、暖炉があるなら、置時計、壺、燭台などを飾りつけても差し支えない。それらは、私たちの目に見慣れた一まとまりをなすからだ。また、ある品が別の品よりも、その場の特色を強く示すことも明らかだ。くどく言う必要はない。どんな芸術にも、ただ常識から来る細部の決まりごとがある。さらに、特色を持つ品であっても、姿を見せることが、演出全体に行きわたる手法にかなっており、舞台上の実物が一様に増やされているなら、その一品が現れる意味合いは薄れる。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 1007
      "end": 1014
      "exact": "Tartufe"
- "id": "becq-0111"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la vie, les objets n'ont qu'une importance contingente; dans une oeuvre dramatique, ils sont liés d'une façon nécessaire à l'action qui va se développer sous nos yeux. Dans un salon, par exemple, où une femme reçoit à certain jour des visites, le nombre de sièges formant cercle autour de la cheminée est invariable et en général supérieur au nombre de personnes présentes. Un peintre, choisissant une scène de visites pour sujet d'un tableau de genre, sera naturellement vrai en reproduisant la réalité, et il ne viendra à l'esprit d'aucun spectateur du tableau de comparer le nombre des visiteurs à celui des sièges. C'est qu'en effet la suite de cette scène a la contingence de la vie: il pourra venir d'autres visiteurs, comme il pourra n'en pas venir. Dans cette oeuvre d'art, la représentation est à elle-même sa propre fin. L'esprit n'est sollicité en rien à chercher un rapport entre cette scène et une scène subséquente qui ne viendra jamais."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 111
    "line_start": 1357
    "line_end": 1370
  "translation_ja": "日常生活では、物の意味はその場の成り行きで決まるだけだ。戯曲では、物は、目の前でこれから展開する筋と必然的に結びついている。たとえば、ある女性が決まった曜日に来客を迎える客間なら、暖炉を囲む椅子の数はいつも同じで、たいていそこにいる人の数より多い。訪問客の一場面を風俗画の題材に選んだ画家が、そのまま写せば自然で真実らしいし、絵を見る者の誰も、客と椅子の数を比べようとは思わない。この場面のなりゆきは、実際、暮らしと同じく偶然に任されている。ほかの客が来るかもしれないし、来ないかもしれない。この芸術作品では、描くこと自体が目的である。精神は、描かれた場面と、いつまでもやっては来ない次の場面との関係を、無理に探すよう求められない。"
  "translation_status": "reviewed"
- "id": "becq-0112"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Transportons-nous dans le salon de Célimène au deuxième acte du Misanthrope. Lorsque Basque avance des sièges sur l'ordre de sa maîtresse, il pourrait lui arriver, sur le théâtre comme dans la vie réelle, d'approcher un nombre de sièges supérieur à celui des personnages. Supposez que cela se produisît sur la scène, et imaginez qu'au milieu d'Éliante, de Philinte, d'Acaste, de Clitandre, d'Alceste et de Célimène, tous assis, il restât un siège vide: quelle importance ce détail ne prendrait-il pas aux yeux des spectateurs! Ce siège vide intriguerait le public et distrairait l'esprit d'une des plus belles scènes de l'ouvrage, car il serait là comme un siège d'attente et semblerait annoncer un nouveau personnage, et par suite une péripétie que notre esprit serait déçu de ne point voir se produire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 112
    "line_start": 1372
    "line_end": 1383
  "translation_ja": "『人間嫌い』第二幕のセリメーヌの客間に移ろう。召使いのバスクが女主人の言いつけで椅子を寄せてくるとき、登場人物の数より多く持ってくることは、現実と同様、舞台でも起こりうる。これが実際に舞台で起こったとして、エリアント、フィラント、アカスト、クリタンドル、アルセスト、セリメーヌが、みな腰をかけたあとに、空席が一つ残っていると想像してほしい。この細部は、観客の目にどれほど重く映るだろう。その空席は観客の気を引き、作品でももっとも美しい場面の一つから精神をそらしてしまう。誰かの到着を待つために置かれた席のように見え、新たな人物、それに伴う新たな展開を予告するかに思われるので、観客の精神は、それが起こらないとあてが外れてしまうからだ。"
  "translation_status": "reviewed"
  "annotations":

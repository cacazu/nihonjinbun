  "source_text": "Complexité de la mise en scène moderne.--L'Avocat Patelin; Bertrand et Raton; Pot-Bouille; la Charbonnière.--Invasion du réel.--Du procédé.--Retour nécessaire au répertoire classique.--Son influence sur le talent des acteurs.--Nécessité des théâtres subventionnés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 337
    "line_start": 4959
    "line_end": 4962
  "translation_ja": "近代演出の複雑さ。『パトラン先生』、『ベルトランとラトン』、『ごった煮』、『石炭屋の女』。現実の侵入。手法について。古典の演目に立ち戻る必要。その俳優の技量への影響。助成を受ける劇場の必要。"
  "translation_status": "reviewed"

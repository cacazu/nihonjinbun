- "id": "becq-0138"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Avec quel soin un directeur ne composera-t-il pas celte mise en scène, dont chaque détail est destiné à produire un effet psychologique! Ici, il ne faut plus que tous les accessoires sentent trop le théâtre; il y faut un certain naturel qui puisse faire quelque illusion à l'oeil complaisant du spectateur, et le séduire lui-même à cette bonne vie matérielle de Fritz. Plus tard, quand tout ce bonheur se sera abîmé dans la détresse de son coeur, toute cette mise en scène servira encore, par contraste, à accuser plus fortement la désespérance de Fritz."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 138
    "line_start": 1750
    "line_end": 1757
  "translation_ja": "一つひとつの細部で心理的な効果を生むこの演出を、劇場の責任者は、どれほど念入りに作ることだろう。ここでは小道具のどれもが、いかにも芝居めいていてはならない。喜んで見入る観客の目に多少の錯覚を与え、フリッツのこの豊かな暮らしへ観客自身を引き込むだけの、自然らしさが要る。あとになって、そうした幸せがみな、彼の心の苦しみの底に沈んでしまったときも、この演出全体は、対照によって、フリッツの絶望をいっそう強く際立たせるのに役立つ。"
  "translation_status": "reviewed"
- "id": "becq-0139"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais j'en ai dit assez, il me semble; pour faire saisir la différence essentielle qu'il y a entre la mise en scène d'une pièce fondée sur un sentiment subjectif et celle d'une oeuvre où domine, dans les sentiments, la puissance objective des choses. J'ajouterai, afin qu'on ne se méprenne pas sur ma pensée, que cette différence peut être considérée comme le fondement du jugement littéraire. De deux oeuvres, dissemblables par la nature des sentiments, un goût éclairé préférera toujours celle qui aura nécessité un moins grand appareil de mise en scène. Un mouvement généreux de l'âme vaut par lui-même, et c'est en diminuer le mérite que de le faire dépendre de causes matérielles et accidentelles. Nous en revenons à ce que nous avons exposé dans les premières pages de cet ouvrage, sur le rapport inverse qu'il y a entre la richesse de la mise en scène et la valeur intrinsèque d'une oeuvre dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 139
    "line_start": 1759
    "line_end": 1772
  "translation_ja": "内面の感情に根ざす芝居の演出と、感情のうちでも外界の物の力が大きな働きをする作品の演出との本質的な違いは、もう十分に伝わったと思う。私の考えが取り違えられないように付け加えると、この違いは、文学的な判断の土台と考えられる。感情の性質が違う二つの作品なら、よく鍛えられた好みはつねに、演出の装置をあまり必要としないほうを選ぶだろう。心の気高い動きには、それ自体に値打ちがある。それを物質的で偶然にも左右される原因しだいにすれば、その値打ちは小さくなる。こうして、演出の豊かさと戯曲の内在的な価値とのあいだには逆の関係があると、本書の冒頭で述べたところへ、私たちは戻ってくる。"
  "translation_status": "reviewed"

- "id": "becq-0037"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De l'effet représentatif idéal dans un esprit cultivé.--Imperfections de la mise en scène réelle.--Sa nécessité pour les esprits peu cultivés.--La mise en scène idéale est le modèle et le point de départ de la mise en scène réelle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 37
    "line_start": 405
    "line_end": 408
  "translation_ja": "教養のある精神に生まれる想像上の上演効果。現実の演出の不完全さ。教養に浴する機会の少ない人に実際の演出が必要なわけ。想像上の演出は実際の演出の手本であり出発点である。"
  "translation_status": "reviewed"
- "id": "becq-0038"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'effet représentatif, on le conçoit, n'est pas créé de toutes pièces par la mise en scène. Toute oeuvre dramatique possède par elle-même une valeur poétique et une valeur représentative. Seulement, dans l'imagination du poète, elles sont souvent dans une relation inverse de ce qu'elles nous paraissent sur un théâtre, où la mise en scène modifie et parfois renverse la proportion: on peut dire que la mise en scène est l'épanouissement, rendu visible, d'un germe idéal. C'est ce dont il est facile de se rendre compte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 38
    "line_start": 411
    "line_end": 418
  "translation_ja": "考えてみれば、上演効果は演出が無から作り出すものではない。どの戯曲も、それ自体に、詩としての価値と、演じられるものとしての価値を持っている。ただし、劇作家の想像の中での両者の関係は、実際の劇場で私たちに見える関係とは、しばしば逆になる。劇場では、演出が両者の釣り合いを変え、ときには逆転させるからである。演出とは、観念のうちにあった芽が花開いて目に見えるものとなった姿だ、と言ってもよい。このことはさほど難しくなく理解できる。"
  "translation_status": "reviewed"
- "id": "becq-0039"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous ne sommes à l'aurore ni de l'humanité, ni de l'histoire, ni de la littérature. Nous sommes, bien qu'à différents degrés, les produits d'une éducation poursuivie pendant des siècles à travers un grand nombre de générations. Modifiés par l'hérédité, par une somme sans cesse croissante de connaissances transmises ou acquises, nous avons passé par des états de conscience inconnus aux hommes que n'a pas visités la civilisation. Il est certain qu'un sauvage ne comprendrait rien à la lecture d'une tragédie de Racine ou d'un drame de Shakspeare, si même par impossible il pouvait saisir le sens des mots; il ne serait nullement dans les conditions nécessaires d'instruction et d'éducation intellectuelles et morales."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 39
    "line_start": 420
    "line_end": 430
  "translation_ja": "私たちは、人類の夜明けにも、歴史の夜明けにも、まして文学の夜明けにもいるわけではない。程度の差はあれ、何世紀にもわたって幾世代も重ねられてきた教育の産物である。私たちは、遺伝により、また受け継いだり自分で得たりして増え続ける知識により、少しずつ変わってきた。文明の訪れを経験していない人々には未知の、さまざまな意識の状態を通ってきたのだ。たとえあり得ないことながら、言葉の意味だけはつかめたとしても、いわゆる「未開人」がラシーヌの悲劇やシェイクスピアの戯曲を読んで何一つ理解できないことは確かだ。必要な知識も、知的・道徳的な教育の条件も、彼にはまったく備わっていないだろうからである。"
  "translation_status": "reviewed"
- "id": "becq-0040"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Que se passe-t-il donc en nous quand nous lisons une oeuvre dramatique? Il est clair qu'elle ne pénètre pas dans un esprit vierge de toute impression similaire. Nous avons tous vu des théâtres de formes les plus diverses, les uns ouverts, les autres fermés, souvent chez différents peuples; nous avons assisté à de nombreuses représentations dramatiques; nous possédons dans notre imagination une ample collection, un peu confuse, mais très riche, de costumes de tous les âges; nous connaissons plus ou moins les moeurs des nations anciennes et modernes ayant joué un rôle important dans l'histoire; enfin, nous sommes familiers avec les légendes héroïques, les mythologies, souvent même avec les langues des pays étrangers. Une foule innombrable d'objets se sont présentés à notre esprit et se trouvent enregistrés dans notre mémoire, où ils restent d'ordinaire à l'état latent. Mais aussitôt qu'une lecture en ravive le souvenir, il se fait dans notre esprit une représentation subjective de tous les objets dont nous avons conservé les images. Et cette représentation illustre immédiatement notre lecture et lui sert de mise en scène idéale: mise en scène toujours discrète, qui paraît, s'efface, disparaît et reparaît sans s'imposer à notre esprit, sans le distraire; décor mobile où tout reste à son plan et qui se rapproche ou s'éloigne au gré de notre imagination. Dans cette mise en scène idéale, tout se réduit souvent à des signes purement idéographiques; c'est un fond toujours un peu effacé, semé d'images confuses, qui s'évanouissent dès qu'on veut les considérer avec fixité, mais sur lequel l'oeuvre poétique s'enlève en pleine lumière, comme une belle pièce d'orfèvrerie se détache sur une tapisserie usée par le temps. Ce fond s'harmonise merveilleusement avec le texte poétique. Des images, diffuses ou instables, semblent venir du lointain le plus reculé et forment cette mise en scène idéale que nous projetons objectivement dans l'espace incertain. C'est sur ce fond propice que se détachent les héros du drame: ils ont la stature, le regard, le geste, la voix qu'ils doivent avoir. Dans cette jouissance un peu extatique rien ne vient contrarier le pathétique des situations, rien ne distrait de la beauté des vers, de la logique de l'action, de la justesse des pensées, de l'effet émotionnel des passions; et c'est alors que nous ressentons l'émotion esthétique, non la plus forte, ni la plus profonde, ni la plus complète, mais la plus pure de tout alliage, qu'il nous soit donné d'éprouver."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 40
    "line_start": 432
    "line_end": 467
  "translation_ja": "では、私たちが戯曲を読むとき、内側で何が起こるのだろう。似たような印象をかつて一度も受けたことのない、まっさらな精神に作品が入ってくるのではない。私たちは皆、野外劇場も屋内劇場も、時には国をいくつも渡って、じつにさまざまな形の劇場を見てきた。数多くの芝居に立ち会い、想像のうちには、少々取り散らかってはいても実に豊かな、ありとあらゆる時代の衣装のコレクションを持っている。歴史のなかで大きな役を果たした古今の国々の風俗を多かれ少なかれ知っているし、外国の英雄伝説や神話にも、しばしばその言語にさえ親しんでいる。数えきれない事物が精神の前に現れては記憶に刻まれ、ふだんはそこに潜んでいる。だが何かを読んで記憶が呼び覚まされるやいなや、かつてその像を留めておいた事物のすべてが、主観のうちに姿を現す。この内なる上演がたちまち読んでいるものに挿絵をつけ、想像上の演出となる。それはどこまでも控えめだ。現れ、薄れ、消え、また現れても、精神に何も押しつけず、気を散らさない。動く背景のなかでは何もかもがそれぞれの位置を保ち、私たちが思うままに近づいたり遠ざかったりする。想像上の演出にあっては、あらゆるものが、とかく観念を示すだけのしるしにまで簡略化される。背景はつねに幾分かすれ、あやふやな像がそこかしこに浮かんでは、じっと眺めようとすると消えてしまう。その上に詩作品は光を浴びてくっきりと浮かび上がる。時を経て擦り切れた綴れ織りを背に、見事な金銀細工が際立つように。この背景は詩の言葉と見事に調和する。ぼんやりと定まらぬ像がはるかな遠方から来るように思われ、その像を集めてできた内なる演出を、私たちは輪郭の定まらない空間に、外にあるもののように映し出す。この好ましい背景に劇の主人公たちが姿を現す。背丈も、まなざしも、身振りも、声も、まさにそうでなければならないものを備えている。いくらか我を忘れるこの喜びの中では、場面が人の心を揺さぶる力を何一つ損なわず、詩句の美しさからも、筋運びの必然からも、考えの的確さからも、情念が心に及ぼす効果からも、何一つ気をそらさない。そこで私たちが味わう美の感動は、最も強いものでも、最も深いものでも、最も完全なものでもないが、私たちに許されるうちで、最も混じりけのない感動なのである。"
  "translation_status": "reviewed"
- "id": "becq-0041"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Combien l'effet représentatif réel est violent par rapport à cet effet représentatif idéal! La main souvent brutale du décorateur ou du metteur en scène immobilise tout ce qui précisément avait une grâce mobile et fugitive; elle fait une sorte de trompe-l'oeil de ce qui n'était qu'un jeu de notre imagination. Au milieu d'une nature de carton peint, sous une lumière invraisemblable, s'accumulent alors des imperfections de toutes sortes, imperfections de décors, de costumes, de mouvements, de gestes, de diction, qui sont autant d'outrages à la beauté poétique. Ce sont là, en effet, les conditions désastreuses dans lesquelles une oeuvre dramatique paraît sur le théâtre. Mais, hâtons-nous de le dire, il faut s'y résigner. Pour un homme qui a assez de loisir, de goût, de délicatesse et d'imagination pour s'abandonner sans réserve à ce jeu de l'esprit qu'on appelle l'art, qui se laisse tout entier attendrir et subjuguer par les accents pathétiques d'Iphigénie ou par la mélancolique chanson d'Ophélie, combien y a-t-il d'hommes dont le cerveau n'est peuplé que des images cruelles de la réalité vivante, qui n'ont ni l'heur ni le loisir de s'essayer ainsi sur la flûte des dieux, et qui le soir, las et meurtris d'un labeur avilissant, ont besoin qu'un coup de baguette magique les transporte dans un monde nouveau, réveille leur imagination engourdie et les ravisse à eux-mêmes et à la bassesse de leurs travaux journaliers! Pour ces hommes, le plaisir de l'esprit n'est jamais pur; il s'y mêle toujours un plaisir des sens. C'est donc précisément par ses défauts mêmes que la mise en scène agit plus puissamment sur leur organisme."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 41
    "line_start": 469
    "line_end": 492
  "translation_ja": "想像上のこんな効果に比べ、現実の上演がもたらす効果のなんと手荒なことだろう！　装置家や演出家の、ともすれば乱暴な手は、揺れ動き、はかなく消えるところにこそ優美だったものをことごとくその場に縛りつけ、私たちの想像の戯れにすぎなかったものを、一種のだまし絵に作り替える。絵の具を塗った厚紙の自然のなか、不自然な照明のもとに、装置のまずさ、衣装のまずさ、動きや身振りや台詞回しのまずさなど、欠点という欠点が積み重なる。その一つ一つが詩の美しさを傷つける。戯曲が舞台に姿を見せるとき、実際に置かれるのはこんな惨めな条件のもとである。だが、急いで付け加えよう、これは甘んじて受け入れなければならない。芸術と呼ばれるこの精神の戯れにためらいなく身を任せるだけの暇も、趣味も、繊細さも、想像力も持ち合わせ、イフィゲーニエの切々たる声やオフィーリアのもの悲しい歌に心をすっかり和らげられ、奪われてしまう人が一人いるとして、その一方にはどれほど多くの人がいるだろう。頭のなかを満たすのは生々しくむごい現実の像ばかり、神々の笛であのように腕を試す幸運も暇もない。日が暮れ、人の尊厳を奪う労働に疲れ傷ついた彼らには、魔法の杖のひと振りで新しい世界へ運ばれ、しびれた想像力を呼び覚まされ、自分自身からも、日々の仕事のみじめさからも連れ去られることが必要なのだ！　彼らにとって精神の喜びはけっして純粋なままではなく、いつも感覚の喜びが交じる。だからこそ、演出はまさにその欠点そのものによって、いっそう強く彼らの身体に働きかけるのである。"
  "translation_status": "reviewed"
- "id": "becq-0042"
  "section_id": "ch03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quoi qu'il en soit, l'effet représentatif idéal sera toujours le modèle que le metteur en scène devra se proposer de réaliser, en tenant compte des nécessités psychologiques, intellectuelles et morales que lui impose la composition particulière de la foule des spectateurs à laquelle il s'adresse. Nous ajouterons, ce qui résulte des idées déjà exposées et sur lesquelles nous reviendrons, qu'on doit dans la mise en scène se rapprocher de la sobriété et de la discrétion de la mise en scène idéale, dans la proportion où l'oeuvre représentée s'approche de la perfection."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 42
    "line_start": 494
    "line_end": 502
  "translation_ja": "いずれにせよ、演出家が実現を目指す手本は、つねに想像上の上演効果である。ただし、自分の相手にする観客がどんな人々から成っているかによって課される、心理上、知性上、道徳上の要請は考慮しなくてはならない。これまで述べてきたことから導かれ、のちに再び取り上げることを一つ添えよう。上演する作品が完全さに近づくほど、それに応じて演出もまた、想像上の演出にそなわる節度と慎ましさに近づかなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0043"
  "section_id": "ch04"

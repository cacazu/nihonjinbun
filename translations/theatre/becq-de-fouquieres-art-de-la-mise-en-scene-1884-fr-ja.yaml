- "id": "becq-0390"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rôle actuel de la mise en scène.--La loi de concentration.--Du naturalisme moderne.--De la puissance psychologique de la nature.--La réalité est une cause formelle et non finale d'une évolution dramatique.--L'Ami Fritz.--Rapports de la mise en scène avec la conception poétique.--Il ne faut jurer de rien.--De l'imitation théâtrale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 390
    "line_start": 5886
    "line_end": 5891
  "translation_ja": "演出の現在の役割。注意が集中する法則。近代の自然主義。自然が心に及ぼす力。現実は、劇の展開の目的因ではなく形相因である。『友人フリッツ』。詩的構想と演出の関係。『決して誓うな』。舞台上の模倣について。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 207
      "end": 219
      "exact": "L'Ami Fritz."
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 280
      "end": 305
      "exact": "Il ne faut jurer de rien."
- "id": "becq-0391"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quel rôle particulier est appelée à jouer la mise en scène dans cette évolution de l'art dramatique? C'est un point qu'il me reste à examiner. Jusqu'à présent, il paraît y avoir beaucoup de confusion dans les idées de ceux qui se réclament de l'école réaliste. Les théâtres semblent obéir à une tendance dangereuse qui ne peut aboutir qu'à leur ruine sans profit pour l'art. Cette tendance consiste à transformer la représentation du réel en une sorte de présentation directe, de telle sorte qu'ils cherchent à s'affranchir du procédé artistique de l'imitation et mettent leur ambition à nous intéresser à la vue des objets eux-mêmes. Ainsi compris, l'art de la mise en scène aurait sa fin en lui-même, ce qui serait, pour qui réfléchit, son anéantissement, car il deviendrait, ici, l'art du peintre, là, l'art de l'architecte, là, l'art du sculpteur, là, l'art du tapissier, etc., mais il ne serait plus un art synthétique obéissant à ses lois propres."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 391
    "line_start": 5894
    "line_end": 5907
  "translation_ja": "劇作のこうした変化の中で演出はどんな独自の役割を担うのか。まだ検討すべき点である。これまで、写実派を名乗る人々の考えには、大きな混乱があるらしい。劇場は、芸術には何ももたらさず、ひたすら自滅へ向かう危険な傾向に従っているようだ。その傾向とは、現実の表象を一種の直接的な提示に変えることである。つまり、模倣という芸術上の手だてから自由になり、物そのものを見せて私たちの興味を引くことを目指す。そう捉えれば演出の芸術は自己を目的とするが、考えてみると、それは演出の消滅である。ここでは絵画、あそこでは建築術、また彫刻術、また室内装飾の技といったものにはなっても、固有の法則に従う総合的な芸術ではなくなるからだ。"
  "translation_status": "reviewed"
- "id": "becq-0392"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "D'ailleurs, dans cette direction, les efforts seraient hors de toute proportion avec le peu d'intérêt qu'offrirait l'atteinte du but. La mise en scène, en effet, subit fatalement la loi de concentration, en vertu de laquelle l'attention du spectateur est ramenée et se fixe sur le personnage humain. Dès que l'action dramatique éveille en nous la sympathie que nous ressentons pour toute douleur ou toute joie, le décor échappe rapidement à notre attention, et la mise en scène disparaît à nos yeux. Elle n'est plus dès lors qu'un danger; car la moindre discordance, comme un coup de baguette magique, anéantirait en un clin d'oeil tout le charme dramatique. Aussi arrive-t-il, quand nous avons assisté à la représentation d'une pièce ayant agi avec quelque force sur notre âme, que nous ne gardons qu'un souvenir vague de la mise en scène, ou que du moins elle ne nous laisse qu'une impression d'autant plus générale que la figure du personnage humain prend plus d'importance et de précision dans notre souvenir. C'est en somme le triomphe de l'être humain sur la nature, de l'intelligence sur la matière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 392
    "line_start": 5909
    "line_end": 5924
  "translation_ja": "しかも、その方向に進めば、目標に達して得られるわずかなおもしろさに、努力はまったく釣り合わない。演出は必然的に、注意が集中する法則に従う。それによって観客の注意は人間である登場人物に引き戻され、そこに定まる。劇中の行動が、悲しみや喜びのどれに対しても覚える共感を呼び起こすと、装置はすぐに注意から外れ、演出は視界から消える。それ以降は危険でしかない。ほんのわずかな不調和が、魔法の杖のひと振りのように、劇の魅力をたちまち消し去るからだ。心にいくらか強く働きかける芝居を見ても、演出の記憶はぼんやりとしか残らない。少なくとも、人物の姿が記憶の中で大きく、はっきりするほど、演出はおおまかな印象しか残さない。結局、人間の自然に対する、知性の物質に対する勝利なのである。"
  "translation_status": "reviewed"
- "id": "becq-0393"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Par conséquent, l'art de la mise en scène ne peut avoir la prétention de prendre le pas sur l'art dramatique. Il ne le pourrait qu'en annihilant celui-ci, ce qui serait contraire à sa propre destination. Il doit donc lui rester subordonné, tout en le suivant forcément et en se préoccupant, à son exemple, du caractère individuel et particulier des objets qu'il évoque à nos yeux. Nous avons d'ailleurs insisté déjà dans le courant de cet ouvrage sur la nécessité pour la mise en scène d'adapter les milieux aux types particuliers que recherche l'art moderne. C'est une des conditions actuelles de la mise en scène. Mais la mise en scène peut-elle aspirer à jouer un rôle personnel et actif dans l'évolution du drame? Et, s'il lui est permis d'envisager une telle perspective, quelles sont les limites infranchissables imposées à son ambition? On est conduit à envisager ce rôle de la mise en scène en reconnaissant la valeur, en quelque sorte psychologique et morale, qu'a prise la nature dans la littérature moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 393
    "line_start": 5926
    "line_end": 5940
  "translation_ja": "したがって、演出のわざは劇作のわざに先立つなどとは言えない。そうできるのは劇作を消滅させる場合だけで、それは演出自体の役目に反する。したがって劇作に従属し、それでもいやおうなくそのあとを追い、劇作と同じように、私たちの目に呼び起こすものの個別的で特別な性格に注意を払わねばならない。現代の芸術が求める独特の人物類型に環境を合わせる必要は、本書ですでに力説した。これが今日の演出の一条件である。だが演出は、劇の変化の中で、自分自身の積極的な役割を果たそうと望めるだろうか。もしそう望んでよいとして、野心が越えられない境はどこにあるか。近代文学で自然が得た、いわば心理的で道徳的な価値を認めれば、演出のこの役割を考えることになる。"
  "translation_status": "reviewed"
- "id": "becq-0394"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toute notre littérature dérive en grande partie de celles des peuples grecs et des peuples latins: elle a une origine toute méridionale. Or, dans les pays dévorés par une lumière ardente, la nature n'agit pas sur l'homme avec le charme pénétrant qu'elle a dans les pays du nord. La transparence de l'atmosphère, la netteté des lignes, l'égalité des effets, la coloration puissante des tons, ne semblent pas s'associer à la mélancolie humaine comme les paysages humides et crépusculaires du nord. Aussi tous les artistes, tous les poètes ont négligé ou n'ont que légèrement indiqué cette association de l'homme et de la nature. Au XVIIe siècle, la nature artistique est factice: ce ne sont que des paysages baignés dans la transparente lumière de l'Attique. Ce n'est que vers la fin du XVIIIe siècle que l'homme a laissé son âme s'ouvrir aux impressions profondes de la nature et qu'il a associé celle-ci à ses états psychologiques. Mais aujourd'hui toute notre littérature est fortement empreinte de naturalisme. Il n'est donc pas étonnant que la décoration théâtrale et que la mise en scène aient eu l'ambition de se parer de ce charme pittoresque qui a sur nous tant d'empire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 394
    "line_start": 5942
    "line_end": 5958
  "translation_ja": "私たちの文学は、大部分ギリシアとラテンの諸民族の文学に由来し、まったく南方の出である。さて、強い光に照りつけられる国では、自然は北方で持つような、心に染み入る魅力をもって人に働くことはない。透き通った大気、線のはっきりしたこと、均一な効果、色調の濃さは、北方の湿って薄暮にかすむ風景のようには、人の憂いと結びつかないらしい。だから芸術家も詩人もことごとく、人と自然のこの結びつきを無視するか、ちらりと示しただけだった。十七世紀、芸術の自然は作り物だった。アッティカの透き通る光に浴した風景ばかりである。人が自然の深い印象に心を開き、自分の心の状態と自然を結びつけたのは、十八世紀末ごろにすぎない。しかし今日の文学はどれも自然主義の強い色を帯びる。舞台の装置と演出も、これほど私たちをとらえる絵になる魅力で身を飾ろうとしたのは、不思議ではない。"
  "translation_status": "reviewed"
- "id": "becq-0395"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutefois, cette ambition n'avait pas eu jusqu'alors de visée plus haute que celle de plaire directement aux spectateurs, et de renforcer la puissance dramatique en dirigeant sur nos yeux ses effets les plus romantiques. Comme la musique dans le mélodrame et dans le vaudeville, la mise en scène n'avait eu jusqu'alors qu'un rôle, celui d'environner le spectateur d'une sorte d'atmosphère passionnelle, et de créer un milieu adapté à l'émotion née du développement de l'action dramatique. La mise en scène a donc été jusqu'à présent une force émotionnelle destinée à agir directement sur le spectateur, absolument comme dans le mélodrame une longue phrase chantée sur le violoncelle agit sur son système nerveux et le dispose à l'attendrissement. Eh bien! sans renoncer à cette puissance du pittoresque que le décorateur continuera à exercer directement sur les spectateurs et qui est en effet sa destination, la mise en scène peut-elle prétendre jouer sur le théâtre le rôle que la nature joue dans notre vie actuelle? Comme la musique, va-t-elle à son tour venir se mêler au drame, en devenir aussi un des personnages et concourir au développement de l'action elle-même?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 395
    "line_start": 5960
    "line_end": 5976
  "translation_ja": "もっとも、その野心はこれまで、観客をじかに楽しませ、もっともロマンチックな効果を目に向けて劇の力を増す以上の、高い目的を持ってはいなかった。メロドラマやヴォードヴィルの音楽と同じように、演出がこれまで担ったただ一つの役は、観客を情念の空気のようなもので包み、筋が運ぶうちに生まれた感情に合う環境を作ることだった。だから演出はこれまで、感情を動かして直接観客に働きかける力だった。メロドラマのチェロが長い旋律を歌い、観客の神経に働き、感じやすくさせるのとまったく同じである。それなら、装置家が観客にじかに及ぼし続けるであろう絵になる力を捨てずに、それこそがその持ち場なのだが、演出は現実の生活で自然が果たす役割を、舞台でも果たそうと言えるだろうか。音楽のように劇の中にまじり、劇の一人物になって、劇の進行そのものに加わるのだろうか。"
  "translation_status": "reviewed"
- "id": "becq-0396"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sans doute on ne peut comparer la nature, agissant directement sur nous, à l'imitation de la nature qui nous intéresse à ses procédés artistiques plus qu'aux phénomènes eux-mêmes qu'elle reproduit à nos yeux. On ne peut non plus comparer la mise en scène, où tout est factice, à la musique dont le théâtre ne modifie en rien les conditions et qui, au théâtre comme dans la vie, doit au charme mystérieux des sons réels l'empire qu'elle exerce sur notre sensibilité. Cependant la littérature, même avant qu'elle fût en proie au naturalisme, tenait compte dans une certaine mesure de l'influence des forces de la nature sur la décision humaine et partant sur l'évolution du drame. Et dans ce cas la mise en scène s'élevait au rôle d'une puissance mystérieuse, supérieure à la volonté humaine: elle nouait ou dénouait le drame comme la fatalité antique. Le théâtre en présente de nombreux exemples. Ainsi le voyageur, au moment de quitter l'auberge où il s'est mis à l'abri, est assailli par la tempête: le tonnerre se mêle au bruit de la grêle ou de la pluie; le vent repousse la porte avec violence; le voyageur, fortement impressionné, recule, reste et est assassiné."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 396
    "line_start": 5978
    "line_end": 5994
  "translation_ja": "確かに、じかに私たちに働く自然と、目の前に再現する現象そのものより、その芸術上の手法へ私たちの関心を向けさせる自然の模倣とは、同じにできない。すべてが作り物の演出と、舞台だからといって何一つ条件が変わらず、舞台でも生活でも本物の音の謎めいた魅力のおかげで感性を支配する音楽も、同じにできない。それでも、文学は自然主義のとりこになる前から、ある程度、自然の力が人間の決断に、ひいては劇の進行に及ぼす影響を考えていた。その場合演出は、人の意志より上にある神秘的な力の役にまで高まり、古代の宿命さながらに劇を結び、ほどいた。舞台にはその例が多い。たとえば旅人が身を寄せた宿を去ろうとすると、嵐に襲われる。雷鳴に雹や雨の音が混じり、風が激しく扉を押し戻す。旅人はひどくおびえて後ずさりし、とどまり、殺される。"
  "translation_status": "reviewed"
- "id": "becq-0397"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Certes, c'est un art inférieur que celui qui met une évolution, qui ne devrait être que passionnelle, sous la dépendance de phénomènes contingents. Cependant l'intervention des forces mystérieuses de la nature est dans ce cas tout à fait remarquable, en ce que l'illusion théâtrale agit directement sur le personnage du drame, à l'émotion duquel s'associe le spectateur. L'impression causée par la mise en scène est donc en même temps ressentie par le personnage et par le spectateur, et celui-ci ne comprendrait pas que celui-là y restât insensible. Cela tient sans doute à ce que la nature nous impose sa puissance en la transformant en mouvement et en bruit, double phénomène dont la représentation ne change pas le mode d'action. Quelle qu'en soit la raison d'ailleurs, nous sommes amenés à constater que, dans ce cas, l'évolution du drame est due à une cause naturelle objective."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 397
    "line_start": 5996
    "line_end": 6008
  "translation_ja": "確かに、情念だけで進むべき展開を、偶発的な現象に従わせるのは劣った芸術だ。しかしこの場合、自然の神秘的な力が介入するのには、まことに注目すべき点がある。舞台の錯覚が劇の人物にじかに働き、観客はその人物の感情に加わる。したがって、演出の生む印象は人物も観客も同時に感じる。人物が平気でいたなら、観客にはわけがわからないだろう。自然は自らの力を運動と音に変えて私たちに及ぼす。おそらく、舞台に表してもこの二つの現象の働き方が変わらないからだろう。理由はどうあれ、その場合の劇の展開が、外から来る自然の原因によることは認めざるをえない。"
  "translation_status": "reviewed"
- "id": "becq-0398"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais l'école moderne a fait un pas de plus, en cherchant à donner à l'évolution dramatique une cause naturelle objective, qui s'adressât à celui de nos sens qui est le plus artistique, à celui de la vue. C'est là, en réalité, que commencent les difficultés. Nous allons citer un exemple où l'intention réaliste de l'auteur est pleinement justifiée, ce qui nous permettra de déduire les conditions esthétiques dans lesquelles le problème peut en général être résolu. Je prendrai cet exemple dans le second acte de l'Ami Fritz, et je rappellerai aux lecteurs, qui tous connaissent la pièce, la fontaine où Sûzel vient puiser de l'eau, eau véritable que le public voit couler. Quelques-uns ont critiqué, à tort, à mon sens, cette recherche d'un effet réel. C'est la vue de l'eau qui éveille chez Sichel le désir de boire, et c'est l'action de boire à la cruche que penche la jeune fille qui ramène à la mémoire du rabbin l'histoire touchante de Rébecca et d'Eliézer. Ici, c'est très justement que l'art théâtral s'associe activement à une situation véritablement dramatique; et si on étudie attentivement l'enchaînement de cette cause toute objective à l'effet dramatique qui en découle, on verra que la présentation réelle de l'eau détermine une représentation idéale, dans l'imagination de Sichel et lui fournit la forme particulière dont va se revêtir sa pensée. Ce n'est pas l'eau qui suggère au rabbin l'idée de sonder le coeur de la jeune fille; elle ne lui offre que le moyen immédiat d'y parvenir. La fontaine, qui procure à nos yeux l'illusion de la réalité, n'est donc pas la cause finale de la scène entre Sichel et Sûzel; elle n'en est que la cause formelle. Sous ce rapport, cet emploi remarquablement habile de l'illusion théâtrale est un modèle puisqu'il nous permet d'en déduire une loi importante de l'esthétique théâtrale et dramatique, que l'on peut formuler ainsi: La réalité contingente ne peut jamais être une des causes finales du drame; elle ne peut en être qu'une des causes formelles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 398
    "line_start": 6010
    "line_end": 6038
  "translation_ja": "だが近代の流派は一歩進み、劇の展開に外から来る自然の原因を与え、感覚のうち最も芸術的な視覚に訴えるようにした。実はここからが難しい。作者の写実の意図が十分に正当な一例を挙げ、一般に問題を解ける美学上の条件を引き出そう。『友人フリッツ』の第二幕から取ろう。読者はみな芝居をご存じだろうが、シュゼルが水を汲みに来る泉を思い出してほしい。観客の目の前で、本物の水が流れる。この現実の効果を求めたことを非難した人もいるが、私には的外れと見える。水を見てジシェルは飲みたくなる。娘が傾ける水差しから飲むことで、ラビはリベカとエリエゼルの心を打つ物語を思い出す。ここで上演のわざが、真に劇的な状況に積極的に加わるのは正しい。このごく客観的な原因につながる劇的な効果を注意深く追えば、水を実際に見せることがジシェルの想像の中に観念的な表象を起こし、彼の考えがまとう特別な形を与えるとわかる。娘の心を探ろうとラビに思わせるのは水ではない。すぐにそうできる手だてを与えるだけだ。私たちの目に現実の錯覚を起こす泉は、だからジシェルとシュゼルの場面の目的因ではない。形相因にすぎない。この点で、舞台の錯覚を使うみごとな手本である。演劇と劇作の美学で重要な一法則が引き出せるからだ。偶発的な現実は、劇の目的因の一つには決してなれない。形相因の一つにしかなれない。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 513
      "end": 524
      "exact": "l'Ami Fritz"
- "id": "becq-0399"
  "section_id": "ch39"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On ne peut nier que la réalité, en montant sur la scène et en venant y jouer le rôle qui lui est propre et y exercer une influence contingente, ne contribue, absolument comme cela se passe dans la vie, à modifier, à diversifier et, par suite, à enrichir la pensée poétique en lui fournissant des formes nouvelles et imprévues. Deux âmes mises et maintenues en présence, en dehors de toute influence objective, ne peuvent échanger que des idées purement psychologiques. Ces deux âmes rentreront dans les données plus exactes de la vie, si elles puisent dans la réalité ambiante une forme plus variée de raisonnement et les éléments plus prochains de leur éloquence. Toutefois, il est à peine besoin de faire remarquer que l'intervention d'une cause objective ne peut être admise, que lorsqu'elle dérive d'une possibilité antérieure. Elle ne doit être, en effet, qu'une cause seconde; c'est ainsi que l'acte de venir puiser de l'eau à la fontaine, dans l'exemple pris de l'Ami Fritz, n'est qu'une conséquence de la condition de Sûzel et du milieu où se développe l'action; il se rattache donc logiquement aux données mêmes du poème dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 399
    "line_start": 6040
    "line_end": 6056
  "translation_ja": "現実が舞台に上り、自らの役割を演じ、偶発的な影響を及ぼせば、生活で起こることとまったく同じように、詩的な考えに新しく思いがけない形を与え、その考えを変え、多様にし、豊かにすることは否定できない。外からの影響が何もないまま向き合わされ、向き合い続ける二つの魂は、純然たる心の観念しか交わせない。周りの現実から、もっと多彩な論理の形と、言葉の力をすぐに助ける素材を汲み取れば、二つの魂は生活の現実にいっそう正確に近づく。ただし、外からの原因が介入してよいのは、前にすでに可能性があった場合だけなのは、ほとんど指摘するまでもない。第二の原因でしかあってはならない。たとえば『友人フリッツ』の例では、泉に水を汲みに来る行為は、シュゼルの身分と劇が展開する環境から帰結するにすぎない。したがって劇作自体の前提に、筋道をもってつながっている。"
  "translation_status": "reviewed"
  "annotations":

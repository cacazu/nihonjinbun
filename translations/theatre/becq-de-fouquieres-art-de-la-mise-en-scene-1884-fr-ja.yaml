- "id": "becq-0183"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tout ce qu'il y a de spécial et de circonstanciel dans les milieux différents de celui où nous vivons nous échappe à peu près complètement. Si, pour prendre un exemple frappant, nous revenons un instant à la Chine, qui est par excellence un pays excentrique par rapport à l'Europe, on peut affirmer que nos yeux ne sont pas formés à remarquer les différences d'usages, de moeurs et de costumes qui caractérisent les diverses époques de son histoire. De telle sorte que, sur un million de spectateurs, il n'y en aurait probablement pas un qui fût susceptible de saisir, à mille ans près, des différences dans les modes chinoises. Un tel exemple est de nature, il semble, à nous rendre légèrement sceptiques relativement à la valeur de la couleur locale. Et, en y réfléchissant, on peut se demander si nos connaissances sont beaucoup plus étendues en ce qui concerne toute l'Asie, l'Afrique, l'Égypte, la Grèce elle-même, ainsi que Rome et surtout les premiers siècles de notre propre histoire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 183
    "line_start": 2494
    "line_end": 2508
  "translation_ja": "私たちの暮らす環境とは異なる環境にあって、その環境だけに特有で、個別の事情に属するところは、ほとんどすべて私たちに見逃される。よく分かる例として、ヨーロッパから見てとりわけかけ離れた国、中国にしばらく戻ろう。中国の歴史のそれぞれの時代を特徴づける習慣、風習、衣裳の違いを見分けるようには、私たちの目はできていないと言い切れる。だから観客が百万人いても、中国の流行の違いを千年の幅に収まるほど的確に見抜ける者は、おそらく一人もいない。この例を考えると、土地の色合いの値打ちには、少し懐疑的にならざるをえないように思う。考えてみれば、アジア全体、アフリカ、エジプト、ギリシアそのもの、またローマ、とりわけ私たち自身の歴史の初めの数世紀について、私たちの知識はそれより大いに広いのだろうか。"
  "translation_status": "reviewed"
- "id": "becq-0184"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tout ce qui s'éloigne de notre expérience actuelle perd peu à peu toute précision, et même de sa vraisemblance, tellement que si on faisait passer devant les yeux d'un homme de soixante ans une suite chronologique de gravures représentant les modes qu'ont depuis sa naissance successivement adoptées ses contemporains, il ne les reconnaîtrait pas pour la plupart et en regarderait quelques-unes comme imaginées après coup et tout à fait invraisemblables. C'est pourquoi, dans la mise en scène d'une pièce dont l'action se déroule dans un autre temps, toute recherche trop précise d'archéologie, c'est-à-dire portant sur un trop grand nombre de détails, est non seulement inutile, mais contraire à la vraisemblance, et n'a pas par conséquent un caractère incontestable de vérité. Sans doute, s'il s'agit du passé de notre propre race, nous posséderons un ensemble de connaissances plus certaines que s'il s'agissait d'un peuple étranger, même contemporain. Un grand nombre de spectateurs sont aptes à distinguer entre eux, tant sous le rapport de la décoration et de l'ameublement que sous celui des costumes, les styles Louis XIII, Louis XIV, Louis XV et Louis XVI; mais combien peu sauraient établir des différences dans les modes diverses qui ont pu régner pendant le cours de ces grandes époques. Le public ne se choque pas de différences qui, pour des contemporains, eussent été monstrueuses. C'est ainsi qu'en 1878, à la Comédie-Française, on a repris le Misanthrope avec les costumes faits en 1837 pour une représentation de gala à Versailles et qui sont à la mode de la minorité de Louis XIV, bien que le Misanthrope, qui date de 1666, eût toujours été joué jusqu'alors en habits carrés de la seconde moitié du siècle. Nous, hommes du XIXe siècle, qui nous piquons d'exactitude, souvent plus que de raison, en sommes-nous choqués? Et d'ailleurs, combien de spectateurs songent à comparer la date des costumes avec celle de la pièce? La plupart ignorent sans doute que les costumes du Misanthrope peuvent faire question."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 184
    "line_start": 2510
    "line_end": 2539
  "translation_ja": "現在の経験から遠くなるものは、何であれ次第に細部の確かさを失い、もっともらしさまで薄れていく。六十歳の人の目の前に、その人が生まれて以来、同時代の人々が次々に取り入れた流行を描く版画を年代順に広げたら、大半は見覚えがないと思い、なかにはあとからでっち上げられた、まったくありそうにないものと見なすものもあるだろう。だから別の時代に筋が進む芝居を演出するのに、考古学的な考証をあまり細かく追う、つまりあまりに多くの細部を調べるのは、無用なばかりか、もっともらしさに反し、そのため、疑いのない真実の性質をもたない。なるほど、自分たちと同じ民族の過去なら、同時代であっても外国の人々を扱うより、いくらか確かな知識を持ち合わせているだろう。多くの観客が、装置や調度だけでなく衣裳でも、ルイ十三世、十四世、十五世、十六世の様式をおのおの見分けられる。だが、こうした大きな時代のうちの一つ一つで流行した、さまざまな様式の違いまで言える人は、なんと少ないことか。同時代の人ならひどいと思ったような違いも、今の観客には気にならない。たとえば1878年、コメディ・フランセーズで『人間嫌い』を再演したとき、1837年にヴェルサイユの祝賀上演用に作られ、ルイ十四世がまだ成人していなかったころの流行にならった衣裳を用いた。1666年の『人間嫌い』は、それまではいつも、十七世紀後半の角張った上衣で演じられていたのに、である。私たち十九世紀の人間は、ともすれば度を越すほど正確さを自慢する。だが、これを見て気を悪くしただろうか。そもそも、衣裳の年代と芝居の年代を比べようと思う観客が、どれほどいたか。『人間嫌い』の衣裳が問題になりうること自体、大半の人は知らないだろう。"
  "translation_status": "reviewed"

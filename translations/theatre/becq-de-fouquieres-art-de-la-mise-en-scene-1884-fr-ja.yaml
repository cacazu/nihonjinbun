- "id": "becq-0363"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ruy Blas, au second acte, nous offre encore un bel exemple d'intervention musicale. Au moment où la reine, émue d'un amour inconnu qu'elle sent monter jusqu'à elle, exhale en tristes plaintes l'ennui que lui causent sa solitude et son royal esclavage, des lavandières passent en chantant dans les bruyères et leurs voix qui meurent en s'éloignant jettent dans son âme des paroles enflammées d'amour. Considéré en dehors de l'action dramatique, le chant des lavandières n'aurait pour le public que le charme d'une poésie pleine de délicatesse et de fraîcheur et ne lui apporterait qu'un plaisir purement poétique et musical, mais il devient d'une ineffable tristesse en passant par l'âme de la reine. C'est sa propre émotion, croissant pendant tout le temps que dure la chanson des lavandières, qui se communique à nous sympathiquement. Ce n'est pas la musique qui fait couler nos larmes, ce sont celles qui tombent goutte à goutte des yeux et du coeur de la reine."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 363
    "line_start": 5460
    "line_end": 5473
  "translation_ja": "『リュイ・ブラス』の第二幕にも、音楽の介入の美しい例がある。どこから来るとも知れぬ愛が自分に届くのを感じ、心を動かされた女王が、孤独と王家の囚われの身につきまとう退屈を、悲しげにこぼす。そのときヒースの野を洗濯女たちが歌いながら通り、遠くなって消えてゆく声が、愛に燃える言葉を女王の魂に投げ入れる。劇の進行から切り離して考えれば、洗濯女たちの歌が観客に与えるのは、繊細で新鮮な詩の魅力、純粋に詩と音楽の喜びだけだ。だが女王の心を通ると、なんとも言いようのない悲しさを帯びる。洗濯女たちの歌が続くあいだ募ってゆく女王自身の感情が、共感を通して私たちに伝わる。私たちの涙を流させるのは音楽ではない。女王の目と心から一滴ずつこぼれる涙なのだ。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 0
      "end": 8
      "exact": "Ruy Blas"
- "id": "becq-0364"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous pouvons déjà remarquer que la meilleure manière de mettre en scène la musique, c'est d'en masquer l'exécution et de soustraire les exécutants aux yeux du public. Il ne faut pas, en effet, que l'exécution musicale puisse nous distraire de l'émotion que la puissance des sons musicaux n'est que médiatement destinée à faire naître en nous. Et cela se conçoit, puisque l'intérêt n'est pas, en ce cas, dans le personnage qui chante, mais dans le personnage dont les sentiments s'épanouissent au contact de la sensation musicale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 364
    "line_start": 5475
    "line_end": 5482
  "translation_ja": "ここまでで、音楽の演出では、演奏を見せず、演奏する人を観客の目から隠すのがいちばんよいと気づく。音楽の音の力が間接に生むはずの感動から、演奏そのものが私たちの注意をそらしてはいけないからだ。当然だろう。この場合、見るべきなのは歌う人ではなく、音楽に触れて感情が花開くほうの人物なのだから。"
  "translation_status": "reviewed"
- "id": "becq-0365"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'Ami Fritz nous offrira encore un exemple remarquable de l'emploi de la musique au théâtre, emploi trois fois renouvelé et chaque fois d'une manière différente. Au commencement du deuxième acte, au moment du départ des moissonneurs pour les champs, se place la chanson de Sûzel, dont le choeur reprend le dernier vers:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 365
    "line_start": 5484
    "line_end": 5488
  "translation_ja": "『友人フリッツ』にも、音楽を劇場で使うみごとな例がある。三度使われ、三度ともやり方が違う。第二幕の初め、刈り入れ人が畑へ出るときに、シュゼルが歌い、合唱が最後の一句を繰り返す。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 0
      "end": 11
      "exact": "L'Ami Fritz"
- "id": "becq-0366"
  "section_id": "ch37"
  "kind": "verse"
  "origin": "source"
  "source_text": "Ils ne se verront plus!"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 366
    "line_start": 5490
    "line_end": 5490
  "translation_ja": "もう二人は会うことがない！"
  "translation_status": "reviewed"
- "id": "becq-0367"
  "section_id": "ch37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le chant de Sûzel se trouve amené naturellement dans la pièce, et cependant, en dehors de l'effet touchant qu'il prépare pour la fin de l'acte, il n'offre guère que l'intérêt de l'exécution musicale, puisque Sûzel est en scène; et à la Comédie-Française cet intérêt est, il est vrai, très vif parce que l'actrice qui remplit ce rôle a une remarquable diction, aussi large et aussi pure quand elle chante, même sans accompagnement, que lorsqu'elle parle. Néanmoins, cette première scène de l'acte prépare surtout la dernière. En effet, quand Sûzel aperçoit de loin la voiture qui emporte Fritz, Fritz qui fuit éperdu, croyant guérir ainsi son inguérissable blessure, elle tombe anéantie sur un banc, et au même moment le choeur des moissonneurs, qui regagnent lentement la ferme, fait entendre de nouveau le dernier vers de la chanson de Sûzel, qui est ici d'une indicible mélancolie:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 367
    "line_start": 5492
    "line_end": 5504
  "translation_ja": "シュゼルの歌は自然に芝居の中に入ってくる。けれども、幕の終わりの感動を用意することを別にすれば、シュゼルが舞台上にいる以上、演奏それ自体のおもしろさしかほとんどない。実際コメディ・フランセーズでは、そのおもしろさがとりわけ強い。役を務める女優の発声がすばらしく、無伴奏で歌うときでさえ、話すときと同じほどのびやかで澄んでいるからだ。それでもこの幕の最初の場面は、何より最後の場面を用意する。じっさい、シュゼルがフリッツを乗せた馬車を遠くに見つけると、フリッツは癒えぬ傷を癒そうと取り乱して逃げており、シュゼルは打ちひしがれて長椅子に倒れる。同時にゆっくり農場へ戻る刈り入れ人の合唱が、シュゼルの歌の最後の一句をふたたび聞かせる。ここでは言いようもなく物悲しい。"
  "translation_status": "reviewed"

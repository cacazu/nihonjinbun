- "id": "becq-0180"
  "section_id": "ch21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si donc, pour en revenir à l'objet de ce chapitre, il s'agit de représenter un milieu éloigné du nôtre par la distance ou le temps, il sera toujours sage de se renfermer dans une mise en scène sobre et très simple, de se contenter d'une couleur locale discrète et modérée, d'éviter la recherche des effets trop spéciaux au milieu représenté, enfin de ne marquer l'oeuvre que des traits particuliers nécessités formellement par le texte lui-même. Les costumes doivent produire un effet d'ensemble, avoir ce caractère commun que nous attribuons soit à un pays, soit à une époque, ne pas présenter de recherches inutiles d'originalité; car le public n'entre que très difficilement dans les raisons des modes des anciens ou des étrangers, puisque ses goûts sont aujourd'hui totalement différents. Mais nous touchons là à un autre ordre d'idées qui a besoin de quelques développements."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 180
    "line_start": 2468
    "line_end": 2480
  "translation_ja": "本章の主題に戻れば、距離や時間によって私たちから離れた環境を描くときには、抑制のきいた、ごく簡素な演出にとどめ、土地の色合いは控えめで穏当なものにし、描く環境だけに特有の効果を求めすぎないのが、いつでも賢明だ。結局、作品に個別の特徴を刻むのは、台詞そのものがはっきり必要とするかぎりでよい。衣裳は全体として一つの効果を作り、私たちがある国や時代に認める共通の特色をもち、不必要に独自なものを追いかけるべきでない。今の観客の好みはまったく違っていて、昔の人や異国の人がそうした流行を選んだわけには、なかなか共感できないからだ。ただし、これで別の一連の考えに触れたので、それをいくらか展開する必要がある。"
  "translation_status": "reviewed"

- "id": "becq-0134"
  "section_id": "ch16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des pièces où domine le sentiment.--Cas où les causes de l'émotion sont subjectives.--Le Mariage de Victorine.--Cas où les causes de l'émotion sont objectives.--L'Ami Fritz."
  "source_languages":

    "source_sequence": 159
    "line_start": 2053
    "line_end": 2055
  "translation_ja": "演出を制限する法則。比例の法則。舞台上の重要度の段階。『友人フリッツ』。舞台での食事。舞台上の実物への法則の適用。"

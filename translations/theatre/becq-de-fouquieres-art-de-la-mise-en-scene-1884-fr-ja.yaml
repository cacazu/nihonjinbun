- "id": "becq-0236"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Du costume tragique.--Accord du costume avec les péripéties du drame.--Du costume de Théramène.--L'uniformité de costume concorde avec l'unité passionnelle d'un rôle.--Du costume de Thésée.--Les accessoires doivent convenir au texte et à l'action.--Du costume d'Hippolyte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 236
    "line_start": 3317
    "line_end": 3320
  "translation_ja": "悲劇の衣装／劇の成り行きと衣装の一致／テラメーヌの衣装／衣装の一貫性は役の情念の一貫性にかなう／テゼの衣装／小道具は台詞と筋に合っていなければならない／イポリットの衣装"
  "translation_status": "reviewed"
  "source_kind": "chapter_summary"
- "id": "becq-0237"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La réforme du costume tragique commencée par Lekain et Mlle Clairon a été achevée par Talma. Aujourd'hui, toute tragédie est jouée avec des costumes qui sont censés reproduire ceux de l'époque à laquelle se passe l'action. Il ne faut pas toutefois, ainsi que nous l'avons déjà dit, s'exagérer la vérité de ces costumes, qui n'est jamais que relative. On atteint une vraisemblance et une exactitude suffisantes quand les images que l'on produit aux yeux des spectateurs s'accordent avec les types qui se sont formés dans l'imagination de la plupart des hommes de notre temps. Toute recherche d'archéologie est vaine si elle contrarie l'idée que nous avons des costumes de telle ou telle époque. Les documents sur lesquels on peut s'appuyer, tels que statues, vases, camées, médailles, bas-reliefs, peintures, etc., sont déjà des oeuvres d'art, c'est-à-dire qu'ils ne nous offrent qu'une vérité idéale et des combinaisons purement imaginatives. Si par impossible on pouvait arriver à une vérité absolue et nous représenter nos tragédies dans les véritables costumes des contemporains de Thésée ou de Périclès, de Tarquin ou d'Auguste, nous ne les trouverions nullement ressemblants à ceux que nous propose notre imagination, et l'artiste en nous réclamerait avec raison contre ce mépris et cet oubli de l'idéal."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 237
    "line_start": 3323
    "line_end": 3341
  "translation_ja": "ルカンとクレロン嬢が始めた悲劇の衣装改革は、タルマによって完成した。今ではどんな悲劇も、筋の展開する時代の衣装を再現したとされる服で上演される。ただし前に述べたように、その衣装が真実であると考えすぎてはいけない。真実といっても相対的なものでしかない。観客の目に示す姿が、私たちの時代の大半の人の想像の中に形づくられた型と合っていれば、もっともらしさも正確さも十分である。ある時代の衣装について私たちが抱いている考えに逆らうなら、考古学の研究はいくらやっても無駄だ。手がかりにできる彫像、壺、カメオ、メダル、浮彫り、絵画などは、どれもすでに芸術作品である。つまりそこにあるのは、理想の真実と、想像の中だけの組み合わせだ。ありえないことだが、もし絶対の真実に到達し、テゼやペリクレス、タルクィニウスやアウグストゥスと同時代の人が実際にまとった衣装で悲劇を見せられたとしても、私たちの想像が示す衣装とは、さっぱり似ていないと感じるだろう。私たちの中の芸術家は、理想をこれほど軽んじ、忘れ去ったことに、もっともな抗議をするに違いない。"
  "translation_status": "reviewed"
- "id": "becq-0238"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qu'on ait encore et toujours à faire quelques progrès dans la composition et dans le port de ces costumes de théâtre, cela se conçoit, surtout si on ne perd pas de vue l'essentiel, c'est-à-dire l'harmonie générale. On peut dire toutefois qu'à notre époque l'art du costume a atteint un très haut degré de perfection, et que s'il se commet quelques fautes de goût ce n'est jamais que dans des cas isolés. Ce ne sont donc pas les costumes en eux-mêmes qui nous offrent un sujet d'étude intéressant, mais le rapport du costume à l'action et à la situation des personnages et son influence sur le jeu des acteurs. En se plaçant à ce point de vue, on s'aperçoit bien vite que l'art du costume tragique a encore un progrès nécessaire à faire pour que la réforme soit complète et que la mise en scène s'accorde avec les conceptions dramatiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 238
    "line_start": 3343
    "line_end": 3354
  "translation_ja": "こうした舞台衣装の仕立てや着こなしには、まだ改善すべきところがいくつもあると考えてよい。とりわけ、肝心なのは全体の調和だと忘れずにいれば、そう考えられる。それでも今日の衣装の芸術は、高い完成度に達したと言ってよい。趣味に背くことがあっても、ばらばらの個別の例でしかない。だから調べて面白いのは衣装そのものではなく、筋や登場人物の置かれた状況と衣装の関係、そして俳優の演技への影響である。この立場に立てば、改革を完全にし、劇作家の構想と演出を一致させるには、悲劇の衣装の芸術に、なお一歩必要な進歩が残っているとすぐに分かる。"
  "translation_status": "reviewed"
- "id": "becq-0239"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est précisément ce que nous allons voir en examinant les costumes de Phèdre. Il est admis que les costumes de confidents sont faits d'étoffes de couleur, et généralement de tons bruns ou jaunes. Le blanc sied aux grands rôles et la pourpre est particulièrement réservée aux rois. Dans Phèdre, Oenone et Théramène ont des costumes appropriés à leurs conditions. Toutefois celui de Théramène a un aspect un peu biblique, qui conviendrait mieux à un apôtre qu'au gouverneur d'un prince grec. Théramène paraît descendre d'une toile de Poussin. Mais ce n'est là qu'une critique peu importante. Le point plus intéressant sur lequel je crois devoir appeler l'attention, c'est sur la modification de costume qui s'impose à Théramène au cinquième acte. Est-ce vraiment dans cet accoutrement flottant, sans chapeau et sans armes, que Théramène accompagnait Hippolyte? Il semble qu'il vienne de faire une promenade idyllique autour du lac de Génésareth. Si on ne croit pas devoir adjoindre à son costume un chapeau de voyage et des armes, il est au moins essentiel que, lorsque bouleversé et atterré il reparaît aux yeux de Thésée, il porte son long et ample vêtement de dessus relevé et serré à la ceinture. Cette modification de costume (celle que j'indique ou toute autre produisant un effet analogue) concorderait avec la série des actes accomplis par Théramène; et, lorsqu'il se présente devant les spectateurs, son aspect seul indiquerait qu'il n'est pas demeuré dans le palais, et que, parti avec Hippolyte, il a précipité son retour pour apprendre à Thésée la mort de son malheureux fils. Voilà donc une modification de costume qui résulte des péripéties de la pièce; car il est nécessaire que Théramène porte et conserve ainsi la trace de l'événement tragique auquel il a été mêlé directement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 239
    "line_start": 3356
    "line_end": 3381
  "translation_ja": "それを『フェードル』の衣装に即して見よう。相談相手の役には色のある布を使い、ふつう茶や黄色にすることになっている。白は大役に合い、紫はとりわけ王のために取っておく。『フェードル』ではエノーヌもテラメーヌも、それぞれの身分にふさわしい衣装を着ている。ただ、テラメーヌはいささか聖書の人物めいており、ギリシアの王子の傅役より、使徒に合いそうだ。プッサンの絵からそのまま降りてきたように見える。だがこれはささいな批評にすぎない。もっと興味深く、注意を促しておきたいのは、第五幕でテラメーヌが衣装を変える必要があることだ。イポリットに付き添ったとき、果たして帽子も武具も持たず、あのひらひらした姿だったのだろうか。まるでゲネサレト湖のほとりを、のどかに散歩してきたように見える。旅の帽子や武具まで加えるべきではないと考えるなら、少なくとも動転し、打ちひしがれてテゼの目の前に再び現れるとき、長くゆったりした上着の裾をたくし上げ、帯に留めておくことが欠かせない。このような衣装の変更、あるいは同じ効果を出せる別の変更なら、テラメーヌが直前にした一連の行動と合う。観客の前に現れたとき、その姿だけで、宮殿にいたのではなく、イポリットと出かけ、不幸な息子の死をテゼに知らせようと急いで戻ったことが伝わる。このように劇の成り行きから、衣装の変更が生じる。テラメーヌは、自分が直接巻き込まれた悲劇の出来事の痕跡を身に帯び、そのままにしておかなければならないからだ。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"

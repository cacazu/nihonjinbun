- "id": "becq-0108"
  "section_id": "ch13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la fin nécessaire des objets composant le matériel figuratif.--Le Misanthrope et les Femmes savantes.--Le hasard n'est pas un ressort dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 108
    "line_start": 1302
    "line_end": 1304
  "translation_ja": "舞台上の実物は、何かに必ず役立たなければならない。『人間嫌い』と『女学者たち』。偶然は劇を動かす仕掛けにはならない。"
  "translation_status": "reviewed"

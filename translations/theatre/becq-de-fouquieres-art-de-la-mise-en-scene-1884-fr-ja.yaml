- "id": "becq-0282"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Chez les anciens, le rôle du choeur était bien plus considérable que ne l'est jamais chez les modernes la figuration. Le choeur fut d'abord le personnage principal et pour ainsi dire unique du drame; après Eschyle, à l'époque de Sophocle, d'Euripide et d'Aristophane, il conserva encore, sinon sa prépondérance dramatique, au moins toute sa magnificence et toute sa puissance poétique. Ce fut en lui que se résuma toujours la beauté du spectacle, qui en fit l'attrait et qui constituait la difficulté de la représentation. C'était, en effet, dans les évolutions du choeur que consistait presque toute la mise en scène. Écrites suivant les lois et les mètres de la poésie lyrique, les strophes étaient dansées, mimées et chantées; ou du moins, pour être plus exact, tandis qu'on les récitait sur un rythme musical, on marchait en mesure en appuyant le récit lyrique de gestes appropriés. On conçoit que la formation d'un choeur, son instruction musicale et orchestrique exigeaient de longues études et de nombreuses répétitions. Aujourd'hui, c'est tout le contraire; le choeur n'est qu'un accessoire, et parfois même on le supprime sans beaucoup de façons. C'est ainsi que dernièrement, à l'Odéon, à une représentation d'Andromaque, j'ai vu supprimer la figuration dans la dernière scène du cinquième acte, ce qui est absolument contraire au texte de Racine, ce qui nuit à l'effet représentatif de cette suprême scène et ce qui en outre entraîne la suppression des quatre derniers vers de la tragédie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 282
    "line_start": 3993
    "line_end": 4014
  "translation_ja": "古代の合唱隊は、近代の群衆役が果たしたどんな役割よりもはるかに大きな役割を担っていた。初めは劇の主要な、いわば唯一の人物だった。アイスキュロスの後、ソポクレス、エウリピデス、アリストファネスの時代にも、劇での優位を失ったとしても、壮麗さと詩の力はそっくり保った。舞台の美しさはいつも合唱隊に凝縮され、そこが上演の魅力であり、上演の難しいところでもあった。実際、演出のほとんどは合唱隊の動きで成り立っていた。抒情詩の決まりと韻律で書かれた詩節は、踊られ、身ぶりで表され、歌われた。いや、正確に言えば、音楽の拍に乗せて詩を唱えるかたわら、拍に合わせて歩き、詩の語りにそれにふさわしい身ぶりを添えたのである。合唱隊を組み、音楽と動きを教えるには、長い訓練と幾度もの稽古がいると分かるだろう。今日ではまったく逆で、合唱隊は添え物にすぎず、ときにはろくにためらいもなく省かれる。つい先日もオデオン座の『アンドロマック』を見たら、第5幕最後の場面の群衆役をなくしていた。ラシーヌの本文にはまったく反し、この最終場面の上演効果を傷つけ、そのうえ悲劇の結びの四行を落とさせることになる。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 1220
      "end": 1230
      "exact": "Andromaque"
- "id": "becq-0283"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est, en général, quand la pièce est sue et prête à être jouée que l'on forme et que l'on façonne la figuration. Les figurants, il est vrai, n'ont plus à réciter les choeurs de Sophocle, d'Euripide et d'Aristophane, qui comptent parmi les plus beaux morceaux que nous ait laissés la poésie lyrique. Aussi le dommage est-il moindre. Cependant pendant longtemps les figurants ont déparé la tragédie française. Jadis, on faisait généralement avancer les soldats, grecs et les licteurs romains en une sorte de file indienne; puis ils faisaient front, face au public, comme nos conscrits sur le terrain d'exercice. Or une marche de flanc est aussi dangereuse au théâtre qu'à la guerre, car le ridicule tue aussi bien et aussi sûrement qu'un boulet de canon. Et de fait, le public accueillait presque toujours ces pauvres licteurs d'un rire moqueur qui avait pour premier inconvénient de détruire son propre plaisir. Aujourd'hui, la tragédie est dans son ensemble beaucoup mieux jouée qu'autrefois, même que du temps de Rachel, que nous n'avons plus, hélas! La raison en est dans le soin que l'on prend de ne confier les rôles secondaires qu'à des acteurs capables de les tenir dignement et aux précautions qu'on prend pour éviter aux figurants leur antique mésaventure."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 283
    "line_start": 4016
    "line_end": 4034
  "translation_ja": "たいていは、せりふを覚えて芝居がいつでも上演できるようになってから、群衆役を集めて稽古をつける。確かに、現代の群衆役は、ソポクレス、エウリピデス、アリストファネスの合唱の詩まで唱える必要はない。あれは抒情詩が私たちに残したもっとも美しいものに数えられるので、その違いを考えれば害は小さい。とはいえ、長らく群衆役はフランスの悲劇の見栄えを損ねてきた。昔はたいてい、ギリシャの兵士やローマの護衛官を一列縦隊のような隊形で進ませ、それから新兵が練兵場でするように、正面を向いて観客に相対させていた。体の横を見せて行進するのは、舞台では戦場と同じくらい危ない。大砲の弾と同じほど確かに、滑稽さが芝居を殺してしまうからだ。実際に観客は、気の毒な護衛官たちをほとんど必ず嘲笑で迎えた。その第一の害は、観客自身の楽しみを台なしにすることだった。今日、悲劇は概して昔よりずっとよく演じられるようになった。今はもういない、あのラシェルの時代よりもよい。脇役を堂々と務められる俳優だけに任せる心がけと、群衆役に昔のような失敗をさせない用心のおかげである。"
  "translation_status": "reviewed"
- "id": "becq-0284"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici à ce sujet les deux prescriptions les plus importantes. Dans la tragédie, premièrement, les soldats, les gardes, les licteurs doivent se présenter sur la scène en groupe irrégulièrement serré, en ayant soin d'éviter toute disposition pouvant présenter l'apparence de files ou de rangs; deuxièmement, ils ne doivent jamais exécuter un mouvement ayant une apparence de manoeuvre. Au surplus, on n'aurait eu, pour découvrir cette règle bien simple, qu'à regarder les médailles antiques, qui sont des objets d'art, et comme tels en laissent apercevoir les procédés. Or toujours, dès qu'il y est figuré des soldats à pied ou à cheval, que ce soient des licteurs, des porte-étendards, des archers ou autres, ils sont formés en groupes irréguliers, présentant une disposition artistique bien plus que militaire. C'est là ce qu'il fallait imiter, et ce qu'on s'est décidé à faire par intuition peut-être plutôt que conduit par le raisonnement. Quand un groupe de figurants, soldats ou licteurs, arrive sur la scène, il doit se présenter vivement, en ayant l'attention de ne pas prendre l'allure cadencée du pas militaire, et s'arrêter franchement sans se préoccuper de la régularisation des rangs; s'il entre par le fond et s'il doit faire face au public, il faut que le mouvement soit un et jamais décomposé en deux mouvements. Si le choeur a défilé de flanc sous les yeux des spectateurs, il doit, en s'arrêtant, conserver, si c'est possible, cette position et ne pas exécuter le mouvement de front. Si l'on ne peut éviter ce mouvement, il faut qu'il soit accompli librement et vivement par chaque figurant, sans que son allure semble liée à celle de son voisin. Moyennant ces quelques précautions, on évitera ce que jadis l'entrée de ces figurants avait toujours de ridicule."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 284
    "line_start": 4036
    "line_end": 4061
  "translation_ja": "そこで何よりも大切な決まりを二つ挙げる。悲劇ではまず、兵士や衛兵や護衛官は、ばらつきのある密な一団で舞台に現れ、縦列や横列と見える配置を避けること。次に、軍隊の教練に見えるような動きを絶対にさせないことだ。そもそも、この単純な決まりに気づくには、古代の貨幣やメダルを眺めるだけでよかった。あれらも美術作品であり、作り手の技法がそこに見えるからだ。徒歩でも騎馬でも、兵士が絵柄に出るときは、護衛官であれ旗持ちであれ射手であれ、いつも不ぞろいな集団をなし、軍隊らしさより絵としてのよさを感じさせる配置になっている。まねるべきなのはここだった。理屈に導かれたというより、直感でそうするようになったのかもしれない。兵士や護衛官の群衆役は舞台に来たら、軍隊の歩調を思わせないよう気をつけながら勢いよく出てきて、列を整えようとせず、きっぱり止まる。奥から入って客席に正対するなら、一続きの動きにし、二つに分けてはならない。横向きに観客の前を通った合唱隊は、止まるときもなるべくその姿勢を保って、正面に向きなおらない。向きなおるのが避けられないなら、一人ひとりが自由にすばやく動き、隣の人と歩調がつながって見えないようにする。いま挙げたわずかな注意で、昔は決まって滑稽だった群衆役の登場を、滑稽に見せずに済む。"
  "translation_status": "reviewed"
- "id": "becq-0285"
  "section_id": "ch29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il restera encore de grandes difficultés à faire manoeuvrer un personnel nombreux, surtout à présenter décemment au public une image de ce qu'on appelle le monde, et à figurer par exemple une soirée ou un bal. On se heurte en quelque sorte à des impossibilités, car on n'a pas la faculté de donner à ses figurants la jeunesse, la beauté et la distinction des manières. On relègue bien la figuration dans les derniers plans; on en masque autant que possible la vue, en ne la montrant que par échappées; mais il faut que le texte se prête à ces subterfuges. On peut donc désirer que les poètes n'abusent pas de ces représentations qui sont de nature à nuire à leurs oeuvres. Dans les théâtres comiques, on prend résolument le taureau par les cornes, et l'on figure le bal le plus élégant au moyen de six ou huit figurants piètrement habillés. Le public se contente ici d'un signe abrégé, ce qui est possible dans un genre où l'on ne recherche la vérité que dans l'humour et dans l'esprit du dialogue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 285
    "line_start": 4063
    "line_end": 4077
  "translation_ja": "それでも、大勢の人員を動かすのはひどく難しい。とりわけ、いわゆる社交界を観客に見苦しくないかたちで見せ、夜会や舞踏会を舞台に出すのは難しい。ほとんどできないことを求められるのだ。群衆役に若さや美しさ、物腰の上品さを授けてやれるわけではない。群衆役を奥の方へやり、できるだけ客の目から隠し、隙間からちらりとのぞかせるだけにすればよいとはいえ、台本がそういう工夫を許してくれなくてはならない。詩人たちには、作品のためにならないかもしれないこの種の舞台を、むやみに使わないでもらいたいものだ。喜劇の劇場では、むしろ思いきって難題に立ち向かい、六人か八人のぱっとしない服を着た群衆役で、とびきり優雅な舞踏会を表す。観客はここでは簡略な印で満足する。真実らしさをせりふのおかしみや機知だけに求める種類の劇だからこそ、それができる。"
  "translation_status": "reviewed"

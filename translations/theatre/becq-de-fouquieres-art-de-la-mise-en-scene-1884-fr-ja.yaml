- "id": "becq-0240"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous passons à l'examen du costume de Thésée, nous verrons la marche de l'action exiger, au contraire, une uniformité absolue, sans modification aucune. En soi, ce costume ne me paraît approprié ni à la situation ni au caractère du héros grec. Quand il entre en scène, on est frappé de l'aspect magnifique de son costume, surtout de ses cnémides brillantes et de son casque à cimier que surmonte un panache éclatant. L'aspect n'est pas tel qu'il devrait être. Si on nous représentait Thésée au cours d'un de ses exploits amoureux, il ne saurait être trop magnifiquement vêtu; mais ici il nous apparaît comme un émule d'Hercule, un coureur d'aventures héroïques, un rude guerrier, à peine échappé des prisons d'Épire. L'aspect de Thésée doit être fruste et farouche, et ne pas éveiller en nous l'idée d'un Agamemnon majestueux et glorieux; il ne nous apparaît pas au milieu d'un camp, entouré de son peuple et escorté de héros, mais accompagné de quelques compagnons rudes comme lui, portant la trace des revers qu'il vient d'essuyer. Rien dans son costume ne doit sentir la parade. Son casque doit être sans panache ni cimier; ses armes, ses cnémides, fortes, d'un aspect plus solide que brillant. Par-dessus sa tunique, j'aimerais lui voir une casaque de guerre, sur laquelle pourrait alors flotter le royal manteau de pourpre. Surtout ce manteau devrait être taillé dans un tissu un peu épais, afin d'avoir l'aspect d'un vêtement de campement, propre aux embuscades et aux nuits passées dans les gorges sauvages des montagnes. Mais tel qu'il apparaît au début de la pièce, tel il doit rester jusqu'au dénouement. Une tragédie domestique l'attend au seuil de son palais; et l'inceste se dresse devant lui, sans lui laisser le temps de la réflexion. Son aspect farouche doit d'ailleurs imprimer dans l'esprit des spectateurs une idée de rudesse inexorable; or modifier quoi que ce soit dans le costume sous lequel il nous apparaît, substituer à ce vêtement de soldat un plus riche costume de roi, ce serait en quelque sorte laisser planer l'espoir d'une magnanimité qui n'est pas dans son caractère entier et violent. La marche de l'action exige donc l'uniformité dans le costume de Thésée, ce qui est admis d'ailleurs, mais réclame qu'on en éteigne tous les éclats."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 240
    "line_start": 3383
    "line_end": 3414
  "translation_ja": "テゼの衣装を調べれば、逆に筋の進み方が、何一つ変えない完全な一貫性を求めていることが分かる。その衣装は、それ自体このギリシアの英雄の状況にも性格にも合っていないと思う。登場すると、衣装の華やかさ、とりわけ輝くすね当てと、見事な羽飾りを頂いたとさか付きの兜に目を奪われる。だが、その見かけは本来の姿ではない。恋の手柄を立てる最中のテゼを見せるなら、いくら華やかに装わせても華やかすぎることはない。しかしここで姿を現すのは、ヘラクレスに張り合い、英雄的な冒険を追い、エピロスの牢獄を出たばかりの荒々しい戦士である。無骨で近寄りがたい姿をしていなければならず、威厳と栄光に包まれたアガメムノンを思い起こさせてはならない。陣営のただ中で、民に囲まれ、英雄たちに護衛されて現れるのではない。自分と同じように無骨な少数の仲間を伴い、受けたばかりの敗北の跡がまだ姿に残っている。衣装に晴れがましい気配があってはならない。兜には羽もとさかもつけず、武具やすね当ては頑丈で、輝くより実用に耐えそうに見えるようにする。チュニカの上に軍装の上着を着せ、その上に王の紫の外套をひるがえしてもよい。とりわけこの外套は、やや厚い生地で仕立て、待ち伏せや荒涼とした山峡での夜営に向く、野営着のように見せたい。だが最初に現れた姿のまま、結末まで変わってはならない。宮殿の敷居で家庭内の悲劇が待ち受けており、近親相姦の嫌疑が、考える暇も与えず目の前に立ちはだかる。近寄りがたいその外見は、容赦のない荒々しさを観客の心に刻みつけなければならない。そこで衣装をいくらかでも変え、兵士の服をより豪華な王の服に着替えさせれば、一本気で激しい人物にはありえない寛大さを、いわば期待させてしまう。したがって筋の進み方は、テゼの衣装を一貫させることを求める。それはすでに認められているが、華やかさも残らず抑えることを求めるのである。"
  "translation_status": "reviewed"
- "id": "becq-0241"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le costume d'Hippolyte ne me paraît pas prêter à la critique; il est ce qu'il doit être, jeune et élégant dans sa simplicité. Il consiste uniquement dans une tunique de laine blanche. Mais il est un détail sur lequel j'appellerai l'attention de l'acteur chargé de ce rôle, et dont je dois parler, puisqu'il se rapporte précisément à la mise en scène. Hippolyte paraît deux fois, son arc à la main, notamment dans la première scène, lorsqu'il ouvre la tragédie avec ce vers:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 241
    "line_start": 3416
    "line_end": 3422
  "translation_ja": "イポリットの衣装には、批判すべきところはないと思う。簡素な中に若々しさと優雅さがあり、あるべきとおりだ。白い毛織のチュニカだけである。ただしこの役を演じる俳優に注意してもらいたい細部が一つある。まさに演出に関わるので、述べておきたい。イポリットは二度、弓を手に現れる。とりわけ第一場では、悲劇の冒頭をこの一行で開く。"
  "translation_status": "reviewed"
- "id": "becq-0242"
  "section_id": "ch26"
  "kind": "verse"
  "origin": "source"
  "source_text": "Le dessein en est pris, je pars, cher Théramène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 242
    "line_start": 3424
    "line_end": 3424
  "translation_ja": "心は決まった、テラメーヌよ、私は行く。"
  "translation_status": "reviewed"
- "id": "becq-0243"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est même sans doute ce vers qui est cause de l'erreur. Hippolyte fait part à Théramène du dessein qu'il a formé de partir à la recherche de son père, et de partir sans délai, voulant se soustraire aux charmes de la jeune Aricie; mais son char n'est pas disposé, ses chevaux ne sont point attelés, ses gardes ne sont point prêts à l'accompagner: tous ces soins regarderaient précisément Théramène, son gouverneur. D'ailleurs Hippolyte n'a point revêtu le costume de voyage. Pourquoi dès lors tient-il son arc à la main, ses armes étant la dernière chose qu'il ceindra ou qu'il prendra avant de monter sur son char? J'ajouterai que cet arc est plutôt une arme de chasse qu'une arme de guerre et se trouve par suite en contradiction avec ce vers de la tragédie:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 243
    "line_start": 3426
    "line_end": 3436
  "translation_ja": "おそらく、まさにこの詩句が取り違えのもとである。イポリットは、父を捜しに行くと決めたこと、また若いアリシーの魅力を振り切りたいので、すぐに立つつもりであることをテラメーヌに打ち明ける。だが車は用意されず、馬をつないでもいない。護衛も同行の支度ができていない。こうした手配は、まさに傅役のテラメーヌの仕事になるはずだ。それにイポリットは旅装に着替えてもいない。それなのに、どうして弓を手に持っているのだろう。車に乗る前、武具を腰に帯び、あるいは手に取るのは、いちばん最後になるはずなのに。さらに言えば、この弓は戦の武器というより狩りの道具であり、そのことからして、悲劇の次の詩句とも矛盾する。"
  "translation_status": "reviewed"
- "id": "becq-0244"
  "section_id": "ch26"
  "kind": "verse"
  "origin": "source"
  "source_text": "Mon arc, mes javelots, mon char, tout m'importune."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 244
    "line_start": 3438
    "line_end": 3438
  "translation_ja": "弓も、投げ槍も、車も、何もかもうとましい。"
  "translation_status": "reviewed"
- "id": "becq-0245"
  "section_id": "ch26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est donc une faute de mise en scène que de faire paraître Hippolyle un arc à la main. Si on voulait nous le montrer en tenue de départ (ce qui est contraire à la situation), il aurait fallu lui mettre à la main une de ces lances que les vases grecs donnent aux héros, aux Ajax et aux Diomède."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 245
    "line_start": 3440
    "line_end": 3444
  "translation_ja": "したがってイポリットに弓を持たせて出すのは、演出の誤りである。旅立ちの支度をした姿を見せたかったのなら、そもそも場の事情に合わないのだが、ギリシアの壺絵がアイアスやディオメデスのような英雄たちに持たせている槍を、一本手に持たせるべきだった。"
  "translation_status": "reviewed"

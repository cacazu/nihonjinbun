    "kind": "emphasis"
    "span":
      "start": 295
      "end": 315
      "exact": "Le Mariage de Figaro"
- "id": "becq-0314"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La loi que nous avons cherché à élucider sur la représentation des idées nous permet d'expliquer certains jeux de scène dont la portée soi-disant conventionnelle dépasse de beaucoup la portée absolue. Le mot de convention, dans ces cas-là, ne me paraît cependant juste que si on lui donne uniquement sa signification véritable, qui est celle d'accord entre les manières de voir, et que si on n'y attache pas une idée d'arbitraire. Or, l'accord entre les manières de voir n'est autre chose que la possession commune d'une image générale identique. Dans le code du monde, par exemple, un homme est considéré comme outragé si un adversaire ou un ennemi ose lever la main sur lui et il se battra pour venger son honneur. Voilà l'idée générale. Cependant il y aura des hommes qui ne se sentiront outragés et qui ne se battront que s'ils ont reçu réellement le soufflet. Voilà l'idée particulière. Or le théâtre ne peut en toute sûreté aborder que la représentation de l'idée générale, de telle sorte que, si le cas particulier devait être représenté, il faudrait de la part de l'auteur beaucoup d'habileté et de préparation pour le faire admettre par le public. Quand nous apprenons qu'un mari a trouvé un homme aux pieds de sa femme, ou qu'au moment où il est entré il a surpris cet homme embrassant la main de sa femme, nous concluons avec certitude que cette femme trahissait son mari, le plus ou le moins étant sans valeur relativement à la conclusion morale. On se sert souvent, dans ce cas, du mot assez curieux de conversation criminelle, euphémisme qui n'est en somme qu'une idée générale, très suffisante dans l'espèce, et qui répond par conséquent à l'image générale, la seule dont le théâtre nous doive la représentation. Dans la réalité, au moment où le mari apparaît, l'amant a pu être surpris se livrant à tels ou tels actes plus ou moins caractéristiques; mais ce sont là des cas particuliers et des circonstances accidentelles qui n'ajoutent rien au fait fondamental, qui est la trahison de la femme. Ce n'est donc pas sans y avoir profondément réfléchi qu'un acteur pourra se croire permis d'ajouter quelque trait particulier à l'acte simple qui est la représentation de l'idée générale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 314
    "line_start": 4540
    "line_end": 4571
  "translation_ja": "観念の表象について明らかにしようとしてきた法則は、いわゆる約束事としての意味が、それ自体の意味をはるかにしのぐような舞台上の動きを説明してくれる。だがこういう場合、「約束事」という語が正しいと思えるのは、その本来の意味、つまりものの見方が互いに一致するという意味だけで使い、好き勝手に決めたという思いを結びつけないときだ。ものの見方の一致とは、同じ一般のイメージを共に持つことにほかならない。たとえば社交界の掟では、争っている相手や敵が男に手を上げただけで、侮辱を受けたと見なされ、男は名誉を取り返すため決闘する。これが一般の観念である。一方、実際に平手打ちを受けて、初めて侮辱されたと感じて決闘する男もいる。これが個別の観念である。劇場で安心して表せるのは一般の観念だけであり、個別の場合をどうしても出すなら、観客が納得するよう、作者はたっぷり手を尽くし、準備しなくてはならない。\n夫が妻の足もとに男がいるのを見つけたとか、部屋に入るやその男が妻の手に口づけするのを見たとか聞けば、妻は夫を裏切っていたと私たちは確信する。行為の程度は、そういう道徳的な結論に何の違いももたらさない。こういうときに「不義の交際」という少し妙な言い方をよくするが、この婉曲な言葉は結局、一般の観念にすぎない。ただこの場合にはそれで十分であり、だからこそ一般のイメージ、すなわち劇場が表すべき唯一のイメージに合う。現実には夫が現れたとき、愛人がもっとそれとはっきり分かるようなことをしているのを見とがめられたかもしれない。だがそれは個別の事情、偶然が重なった事情であって、妻が裏切ったという根本の事実には何も付け加えない。したがって俳優が、一般の観念を表す単純な動作に特別な細部を添えてよいと思うなら、まず深く考えてからにすることだ。"
  "translation_status": "reviewed"
- "id": "becq-0315"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On pourrait citer un plus grand nombre d'exemples. Ainsi, dans la comédie, quand une jeune fille pleure elle porte son mouchoir à ses yeux, et son air ainsi que le mouvement de sa poitrine suffisent à dessiner l'image du chagrin, parce que ces différents traits sont généraux et se retrouvent à peu près dans l'expression de toutes les douleurs de l'âme. Dans la réalité cependant que de traits particuliers et variables viennent s'y joindre, selon la nature de chacun, l'abondance des sanglots et des pleurs, les cris de timbres différents, les mouvements souvent désordonnés, l'abandon de soi-même, etc. On ferait également de semblables remarques au sujet de l'expression de la joie, où l'image générale suffit, sans qu'on y ajoute les images disgracieuses qui déparent souvent les plus jolis visages."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 315
    "line_start": 4573
    "line_end": 4584
  "translation_ja": "もっと例を挙げることもできる。喜劇で少女が泣くときは、ハンカチを目に当てる。顔つきと胸の動きだけで悲しみのイメージが描ける。これらが一般的な特徴で、心の痛みを表すほとんどすべての人に見られるからだ。ところが現実には、本人の性分に応じて、ひどくすすり泣いたり涙を流したり、さまざまな声を上げたり、ときには手足をむやみに動かし、自分をすっかり放り出すなど、いくつもの異なる特徴が現れる。喜びの表現についても同じことが言える。一般のイメージで十分で、いくら美しい顔でもときに崩れてしまうような、見苦しい顔つきまで付け足す必要はない。"
  "translation_status": "reviewed"
- "id": "becq-0316"
  "section_id": "ch32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais il est inutile de multiplier ces exemples; les deux que nous avons choisis plus haut suffisent. Il faut mieux donner à réfléchir que de tout dire. Il est juste d'ajouter que, dans beaucoup de cas, la dignité personnelle du comédien doit entrer en ligne de compte; mais c'est là une raison de sentiment qui me semble secondaire. Les raisons que nous avons présentées sont artistiques et comme telles de plus grande valeur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 316
    "line_start": 4586
    "line_end": 4591
  "translation_ja": "だが、こういう例をいくつも増やすことはない。先に選んだ二つで十分だ。何もかも言うよりは、考えるきっかけを渡した方がよい。多くの場合、俳優本人の尊厳も考慮に入れるべきだと付け加えるのが公平だろう。ただ、それは気持ちの上の理由で、二次的に思える。ここで述べた理由は芸術上のものであり、だからいっそう重いのである。"
  "translation_status": "reviewed"

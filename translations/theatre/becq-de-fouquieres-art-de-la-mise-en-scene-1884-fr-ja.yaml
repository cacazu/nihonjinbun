- "id": "becq-0149"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rapports de la mise en scène avec le milieu social.--La mise en scène se modifie comme la société.--Types généraux de l'ancienne comédie.--Le Tartufe.--Complexité et hétérogénéité de la société actuelle.--Plasticité nécessaire de la mise en scène.--Vieillissement rapide du théâtre moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 149
    "line_start": 1915
    "line_end": 1919
  "translation_ja": "演出と社会環境との関係。演出は社会とともに変わる。古い喜劇の普遍的な人物類型。『タルチュフ』。いまの社会の複雑さと雑多さ。演出に欠かせない柔軟さ。近代劇の急速な老い。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 142
      "end": 149
      "exact": "Tartufe"
- "id": "becq-0150"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les rapports de la mise en scène avec le milieu social sont très importants, eu égard à nos idées actuelles. Mais, pour plus de clarté et ne pouvant tout dire à la fois, nous nous réservons d'examiner plus loin tout ce que le temps et la distance amènent de modifications dans ces rapports."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 150
    "line_start": 1922
    "line_end": 1926
  "translation_ja": "私たちの今の考えに照らせば、演出と社会環境との関係はとても大切だ。だが、話を明らかにするため、また一度にすべては言えないため、時間と距離がこの関係にどのような変化をもたらすかは、あとで調べることにする。"
  "translation_status": "reviewed"
- "id": "becq-0151"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous poserons ce principe, qui n'a pas, il semble, besoin de démonstration: l'a mise en scène doit correspondre exactement au milieu social, c'est-à-dire doit convenir à l'état social des personnages mis en scène et s'adapter à leurs moeurs et à leurs usages. Toutefois, et c'est ici le point intéressant, ce n'est qu'à une époque relativement récente que la mise en scène a conquis un rôle de plus en plus prépondérant. Autrefois, on aurait pu concevoir uniquement trois décorations, autrement dit trois milieux, un milieu grand seigneur, un milieu bourgeois et un milieu populaire. Et encore c'est théoriquement que je compte ce dernier qui en fait n'existait pas et dont par conséquent la décoration correspondante serait restée d'une parfaite inutilité. Ce qui en tenait lieu, c'était le milieu villageois ou autrement dit le milieu pastoral. Jadis les classes étaient nettement séparées les unes des autres et ne se confondaient jamais. Le Bourgeois gentilhomme est là pour nous montrer combien était ridicule un bourgeois voulant trancher du grand seigneur. En fait, un grand seigneur, riche ou pauvre, était toujours un grand seigneur, tandis qu'un bourgeois, riche ou pauvre, n'était jamais qu'un bourgeois. C'était la naissance seule qui importait; on s'inquiétait fort peu de la fonction et du mérite social."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 151
    "line_start": 1928
    "line_end": 1947
  "translation_ja": "証明を必要としないと思われる原則を立てよう。演出は社会環境に正確に対応しなければならない。すなわち舞台に出る人物の社会的な境遇にかなって、その人々の風習や習慣に合わせなければならない。ただし、ここがおもしろいところだが、演出がますます優位な役割を得たのは、比較的最近のことでしかない。昔なら、考えうる舞台装置、言い換えれば、環境は三種類だけだった。大貴族、市民、庶民の環境である。といっても、最後のものを数えたのは、あくまで理論のうえでだ。実際には存在せず、したがってそれに合った装置はまったく無用なままだった。その代わりにあったのは、村の環境、あるいは牧歌の環境である。昔は階層がたがいにはっきりと分かれ、けっして混じらなかった。大貴族ぶろうとした市民が、なんとも滑稽であったことは、『町人貴族』が示している。実際、大貴族は富んでいようと貧しかろうと、いつも大貴族であり、市民は富んでいようと貧しかろうと、市民でしかなかった。大切だったのは生まれだけで、社会での役割や功績など、たいして気にかけられなかった。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 942
      "end": 966
      "exact": "Le Bourgeois gentilhomme"
- "id": "becq-0152"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aujourd'hui, malgré tout ce qui peut subsister de notre ancienne division sociale, nous ne sommes plus répartis selon les règles étroites d'une hiérarchie immuable. Les rangs sont confondus. C'est en général le talent et l'argent qui, bien plus que la naissance, assurent une haute position sociale. C'est pourquoi, au théâtre, l'ancienne unité décorative ne correspondrait plus en rien à nos idées actuelles. Tandis qu'il n'y avait jadis qu'un petit nombre de divisions générales, il y en a aujourd'hui une infinité, et nous assimilons à nos fonctions, à nos goûts, à nos moeurs, tout ce qui nous entoure et participe à notre existence. En un mot, ainsi que nous l'avons déjà dit plus haut, notre personnalité morale se reflète autour de nous jusque sur les moindres objets. De là le rôle de la mise en scène dans les pièces modernes, ou du moins dans celles qui s'ingénient à traduire sur le théâtre la société française actuelle, et la nécessité d'en accorder tous les éléments avec la personnalité morale des personnages représentés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 152
    "line_start": 1949
    "line_end": 1963
  "translation_ja": "昔の社会の区分が、今でもいくらか残っているかもしれない。とはいえ今日、私たちは変わらない階層秩序の狭い掟に従って、振り分けられてはいない。身分は混じり合っている。高い地位につくことを保証するのは、一般に生まれより、はるかに才能と金である。このため劇場でも、昔のような装置の画一性は、今の考え方には、まったく合わない。かつては少数の大まかな区分しかなかったが、今日では限りなく多くの区分があり、私たちは、自分を囲み生活に加わるあらゆるものを、自分の役割や好み、生活の習慣に合わせる。要するに、すでに述べたとおり、私たちの心の個性は、身の回りのごく小さな物にまで映る。近代劇、少なくとも現代のフランス社会を舞台で描こうと知恵を絞る戯曲で、演出が役割を得、演出のすべての要素を、描かれた人物それぞれの内面の個性に合わせることが必要になったのは、これが理由である。"
  "translation_status": "reviewed"
- "id": "becq-0153"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est donc par une conséquence logique que le décorateur et le metteur en scène se sont faits tapissiers et en quelque sorte bibelotiers, et qu'ils ont dû chercher à donner au matériel figuratif cette physionomie personnelle qui est la caractéristique de la mise en scène moderne. L'intérieur d'un jeune homme riche variera selon le monde au milieu duquel il vit, monde de cheval ou de galanterie. Le cabinet d'un financier ne sera pas celui d'un diplomate. Le salon d'une femme du monde n'aura pas le même aspect que celui d'une demi-mondaine, et celui-ci ne ressemblera pas à celui d'une femme galante. Dans l'effet général, qui est celui que doivent produire la décoration et la mise en scène, l'esthétique moderne a introduit une foule de spécialisations nécessaires. Nos pièces actuelles exigent une adaptation perpétuellement nouvelle de la mise en scène; c'est peut-être ce qui les fera vieillir assez vite, et, au bout d'un certain nombre d'années, rendra leur reprise très difficile."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 153
    "line_start": 1965
    "line_end": 1979
  "translation_ja": "したがって、舞台美術家と演出家が室内装飾を扱い、いわば飾り物まで商うようになり、近代の演出に固有の、人物らしい顔つきを、舞台上の実物に与えようとしなければならなかったのは、筋の通った結果である。金持ちの若者の住まいは、競馬や乗馬の社交に暮らすか、色恋の社交に暮らすかで違う。金融業者の書斎は外交官の書斎とは違う。社交界の婦人の客間は、社交界の周縁で暮らす女の客間と同じ様子ではなく、また後者は、高級娼婦の客間のようでもない。装置と演出が作るべき全体の効果に、近代の美学はいくつもの欠かせない区別を持ち込んだ。私たちの今の芝居は、演出が絶えず新しく適応することを求める。おそらくこのことが、芝居をかなり早く古びさせ、何年かすると、その再演をとてもむずかしくするのだろう。"
  "translation_status": "reviewed"
- "id": "becq-0154"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais la mise en scène est bien obligée de suivre en cela l'esthétique, qui ne se contente plus des types généraux de l'humanité. Dans les comédies de Molière, les personnages sont le moins possible de leur temps, ou du moins ils ne le sont que dans la mesure nécessaire; c'est l'homme que peint Molière plutôt que tel ou tel homme. Dans les pièces modernes, au contraire, dans les pièces de M. Emile Augier ou de M. Alexandre Dumas fils, par exemple, les personnages sont le plus possible de leur temps; et ce n'est plus l'homme en général qu'ils s'ingénient à nous peindre, mais l'homme plastiquement et moralement conformé ou déformé, selon le milieu social particulier où s'exerce son caractère et où s'agitent ses passions."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 154
    "line_start": 1981
    "line_end": 1991
  "translation_ja": "だがこの点では演出も、人間の普遍的な類型だけにはもう満足しない美学に、ついていかざるをえない。モリエールの喜劇では、登場人物は特定の時代にできるかぎり縛られず、ともかく必要な限度でしかその時代に属していない。モリエールが描くのは、この人あの人というより、人間である。反対に近代の芝居では、たとえばエミール・オージエやアレクサンドル・デュマ・フィスの芝居では、登場人物はできるかぎりその時代に属する。作者たちが工夫を凝らすのは、もはや人間一般を描くためではなく、人物の性格が働き、その情念が揺れ動く特定の社会環境に応じて、姿も内面も形づくられ、あるいはゆがめられた人間を描くためだ。"
  "translation_status": "reviewed"
- "id": "becq-0155"
  "section_id": "ch18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans Tartufe, par exemple, il nous serait tout à fait impossible de deviner quelle est la fonction sociale de chaque personnage, et, à ce point de vue, Tartufe lui-même est un grand embarras pour notre manière de voir toute moderne. C'est un dévot, mais ce n'est là que sa fonction psychologique. Qu'est-il, socialement parlant? Appartient-il ou non à un ordre, à une confrérie? A-t-il une fonction religieuse? Quelle est sa position dans la société? Quels sont ses antécédents? Ces questions ne recevront jamais de réponse; de telle sorte qu'aujourd'hui le costume de Tartufe est un problème insoluble. Dans une pièce moderne, au contraire, ce qu'on établit tout d'abord, c'est la fonction sociale des personnages, leur position dans le monde: l'un est député, l'autre banquier, celui-ci est militaire, celui-là est avocat, procureur général, magistrat, etc. Nos auteurs modernes partent d'une idée, qui n'est assurément pas fausse, et qui est en tout cas féconde: c'est que l'expression de nos passions varie suivant le milieu où nous vivons et suivant les idées transmises ou acquises, dont chacun de nous est en quelque sorte un recueil différent. Ils s'intéressent à l'humanité en détail et tiennent compte d'une foule de différenciations, dont autrefois on ne s'inquiétait nullement, parce qu'en somme elles étaient moins visibles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 155
    "line_start": 1993
    "line_end": 2012
  "translation_ja": "たとえば『タルチュフ』では、それぞれの人物の社会での役割を見抜くことは、どうしてもできない。この点で、タルチュフ自身も、ごく近代的な私たちの見方を大いに困らせる。彼は信心家ではあるが、それは心理上の役割でしかない。社会的に見て、彼は何者なのか。修道会なり信心会なりに属しているのか。宗教の職に就いているのか。社会での地位は何か。どのような経歴があるのか。これらの問いに答えが出ることはない。だから今日では、タルチュフの衣裳は、解きようのない問題なのだ。反対に近代の戯曲でまず決めるのは、人物たちの社会での役割と地位である。一人は議員、別の一人は銀行家、こちらは軍人、あちらは弁護士、検事長、裁判官などとなる。近代の作家たちの出発点は、たしかに間違いではなく、いずれにせよ実りの多い考えである。すなわち、私たちの情念の表し方は、その人が暮らす環境と、受け継いだり身につけたりした考えによって変わり、その考えの集まり方は、いわば一人ひとり異なるというのだ。彼らは人間を細部に至るまで考え、昔は気にかけられもしなかった数々の違いを考慮する。結局、昔はその違いがもっと目につきにくかったからである。"
  "translation_status": "reviewed"

- "id": "becq-0194"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A l'Odéon, on n'a pas fait une étude suffisamment artistique de la mise en scène. On a tout simplement modernisé le costume d'Antony en modifiant la forme de ses collets, de ses cols et de sa cravate; on a été jusqu'à lui permettre le gant Derby; on a de même modernisé la coiffure des femmes et trop allongé leurs robes. Toutefois, je reconnais qu'on a réussi à éviter le ridicule que n'eût pas manqué d'exciter une résurrection exacte des costumes de 1830. Seulement on n'a pas réussi, ce qui demandait un effort artistique, à constituer le type théâtral d'Antony."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 194
    "line_start": 2678
    "line_end": 2686
  "translation_ja": "オデオンでは、演出を芸術として十分に研究しなかった。ただ襟やカラーやネクタイの形を変えて、アントニーの衣裳を現代風にした。ダービー手袋まで許した。女性の髪型も同じように現代風にし、ドレスの丈を長くしすぎた。ただし、1830年の衣裳を正確によみがえらせれば必ず招いたはずの笑いを、避けられたことは認める。ただ、芸術的な努力を要するアントニーの舞台上の類型を作り上げることには、成功しなかった。"
  "translation_status": "reviewed"
- "id": "becq-0195"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ajoutons d'ailleurs que pour cette pièce tous les détails de mise en scène n'ont qu'une importance très secondaire, par la raison qu'Antony est un chef-d'oeuvre, qui restera tel au milieu des transformations scéniques que lui imposera le goût des générations successives. La postérité commence seulement pour cette oeuvre extraordinaire, qui est destinée tôt ou tard à faire partie du répertoire courant de la Comédie-Française. Les types et les costumes se fixeront d'eux-mêmes, sans qu'il soit besoin d'un travail critique réfléchi. Ce drame, pathétique et humain, rajeunira de lui-même à mesure que la société française vieillira."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 195
    "line_start": 2688
    "line_end": 2697
  "translation_ja": "ただしこの芝居では、演出の細部はどれも二の次の重要さしかないことも、付け加えておこう。『アントニー』は傑作であり、次々に世代が変わり、観客の好みがさまざまな舞台上の変更を強いても、傑作でありつづけるからだ。この一風変わった作品が後世に残る道は、まだ始まったばかりで、遅かれ早かれコメディ・フランセーズの通常の演目に入ることになる。類型も衣裳も、よく考えた批評の仕事を必要とせず、おのずと定まるだろう。この人間味あふれる、胸を打つ劇は、フランス社会が老いてゆくにつれて、おのずと若返るだろう。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 133
      "end": 139
      "exact": "Antony"
- "id": "becq-0196"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En résumé, la mise en scène est un art qui n'échappe pas aux conditions auxquelles sont soumis les autres arts. C'est une imitation visible et non déguisée de la nature, mais libre et synthétique, et partant créatrice, et qui est, par rapport aux choses et aux êtres pris comme modèles, ce que sont toutes nos idées par rapport aux objets ou aux phénomènes souvent innombrables qui ont contribué à les former en nous. Faire de la mise en scène une copie servile de la réalité serait d'abord une impossibilité matérielle, et ensuite, quand le temps est un des facteurs de la question, un non-sens artistique, puisqu'elle serait en perpétuelle contradiction avec les lentes, mais inéluctables transformations que les lois de l'esprit imposent à toutes nos idées. Enfin il faudrait que chaque objet du monde extérieur eût une représentation identique dans chaque cerveau humain. Quelques auteurs modernes qui se piquent d'une exactitude scrupuleuse se leurrent eux-mêmes, parce qu'ils ne se rendent pas compte que ce qu'ils prennent pour la réalité n'est qu'une image et qu'une interprétation de la nature, modifiable suivant le tempérament, la constitution physique et l'adaptation physiologique de chacun de nous."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 196
    "line_start": 2699
    "line_end": 2716
  "translation_ja": "要するに演出は、ほかの芸術が従う条件を免れない、一つの芸術である。自然を模倣していると隠さず、目に見えるかたちで模倣する。ただし自由に、複数のものを総合して模倣するため、創造的である。手本となった物や人に対する演出の関係は、しばしば数えきれない対象や現象の手助けで私たちのうちに形づくられた考えが、それを形づくった対象や現象に対して持つ関係と同じだ。演出を現実の奴隷のように忠実な写しにするのは、まず実際のところ不可能であり、そのうえ時間がかかわれば芸術として無意味である。精神の法則が私たちのあらゆる考えにもたらす、ゆっくりした、しかし避けられない変化と、つねに矛盾することになるからだ。そもそもそれには、外界の物の一つずつが、人間のあらゆる頭の中に、同じ像をもたなければならない。几帳面な正確さを誇る一部の近代作家は、自分で自分をあざむいている。現実だと思い込んでいるものは、自然の像であり解釈でしかなく、一人ひとりの気質や身体のつくり、生理的な適応に応じて変わるものだと、気づいていないからである。"
  "translation_status": "reviewed"
- "id": "becq-0197"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il faut reconnaître que la réalité est en soi quelque chose qui échappe à la certitude humaine, et que pour un même objet il y a autant d'images différentes de cet objet que d'observateurs. Et, en effet, ce que nous appelons réalité n'est en fait qu'une oeuvre d'art qui a pour auteur l'artiste que la nature a caché au fond de chacun de nous. La prétention qu'a l'école réaliste d'être plus vraie que l'école idéaliste n'est, chez beaucoup de ses adeptes, qu'une infirmité intellectuelle qui consiste à croire les images qui se forment dans notre oeil plus ressemblantes que celles qui se forment dans l'oeil de nos semblables. Où la théorie réaliste ou naturaliste reprend de sa valeur et de son importance, c'est lorsqu'elle nous fait une loi de substituer la vue directe et immédiate des objets à leur vue indirecte et médiate, c'est-à-dire de repousser l'interposition, entre la nature et nous, de tempéraments artistiques différents de notre propre tempérament."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 197
    "line_start": 2718
    "line_end": 2731
  "translation_ja": "現実それ自体は、人間が確かに捉えられないもので、同じ一つの物にも、観察する人の数だけ違う像があると、認めねばならない。実際、私たちが現実と呼ぶものは、一つの芸術作品にすぎず、その作者は、自然が私たち一人ひとりの奥に隠した芸術家である。写実主義の流派は、理想主義の流派より真実だと自負している。だが信奉者の多くでは、それは知性の限界にほかならない。自分たちの目にできる像のほうが、ほかの人の目にできる像より、本物によく似ていると思い込む限界だ。写実主義や自然主義の理論が値打ちと重要さを取り戻すのは、間接に、何かを通して物を見る代わりに、直接、じかに物を見ることを、私たちの規則とするときである。つまり自然と私たちのあいだに、私たちとは異なる芸術上の気質が入り込むのを、退けるときなのだ。"
  "translation_status": "reviewed"
- "id": "becq-0198"
  "section_id": "ch22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ajoutons que beaucoup de personnes restreignent la vérité à la particularité. Or une idée générale n'est pas moins vraie qu'une idée particulière; l'une s'applique à un plus grand nombre d'objets, l'autre à un plus petit nombre, voilà tout. Un décor représentant un paysage ne sera pas en contradiction avec la vérité parce qu'il laissera de côté un nombre plus ou moins grand de détails particuliers faciles à constater dans tel ou tel paysage réel. Seulement, il est une oeuvre artistique et correspond exactement, par son degré de généralité, à ce qu'est une idée dans l'ordre intellectuel. De même un costume de théâtre doit être une oeuvre d'art et nous donner l'idée du costume d'une époque, ce à quoi il parviendra sans être tel ou tel costume particulier de cette époque. C'est d'ailleurs là un sujet que des pages ajoutées à des pages n'épuiseraient pas. En ces matières, il est inutile de chercher à convaincre ceux qui ne se sont pas rendu compte de la manière synthétique dont se forment les idées dans leur esprit. Nous y reviendrons au surplus dans la suite, quand nous nous occuperons plus particulièrement de la mise en scène des personnages de théâtre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 198
    "line_start": 2733
    "line_end": 2749
  "translation_ja": "真実は個別的なものに限られると思う人が多いことも付け加えよう。だが、一般的な考えが個別的な考えより真実でないわけではない。一方はより多くの物に当てはまり、一方はより少ない物に当てはまる。それだけの違いだ。ある風景を舞台装置で表すとき、この現実の風景、あの現実の風景にたやすく見つかる個別の細部をいくつか省くからといって、真実に反するわけではない。その装置はあくまで芸術作品であり、どの程度一般的であるかによって、知性の領域で一つの考えが占める場所に、ぴたりと対応する。同様に舞台衣裳は、芸術作品でなければならず、ある時代の衣裳の考えを、私たちに与えなければならない。その時代の、この、あるいはあの衣裳そのものでなくても、それはできる。これは、何頁、何頁と書き足しても、尽くせない主題である。こうした事柄では、自分の精神でいくつものものを合わせて考えが形づくられるのに気づいていない人を、説得しようとしてもむだだ。それでも先に進み、舞台上の登場人物をどのように演出するかをとくに扱うときには、この話に戻る。"
  "translation_status": "reviewed"

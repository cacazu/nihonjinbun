- "id": "becq-0224"
  "section_id": "ch25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous commencerons par examiner la décoration. «La scène est à Trézène, ville du Péloponèse.» Telle est la seule indication portée par Racine en tête de Phèdre. Le théâtre représente le péristyle du palais de Thésée, entouré d'un portique à colonnes élevées. L'aspect du décor a de la grandeur et convient à l'action héroïque du drame. A travers la colonnade du fond, on aperçoit une haute colline que couronnent trois temples. Comme nous n'avons que des idées fort confuses sur ce que pouvait être la demeure d'un Thésée, je ne ferai aucune difficulté d'accepter l'architecture du décor, bien qu'elle pût convenir à toute autre tragédie grecque et même à une tragédie romaine. Mais je fais peu de cas d'une exactitude archéologique qui n'est pas vérifiable; et si l'on joue d'autres tragédies dans ce même décor, je n'y trouve rien à blâmer. Les Grecs, qui étaient des artistes, jouaient en général leurs drames devant la façade d'un palais à trois portes, décor banal et toujours le même; la porte du milieu donnait accès dans l'appartement du roi ou du maître du palais, celle de droite dans l'appartement consacré aux hôtes et aux étrangers, celle de gauche dans la partie du palais réservée aux femmes. Cette disposition éclairait immédiatement le public sur le rang et le rôle du personnage qui paraissait. Nos décorations ont perdu cet avantage. Dans Phèdre, les portes de gauche et de droite donnent accès dans les appartements. Celui de Phèdre est à gauche et celui d'Aricie à droite. Je ne ferai à cela aucune chicane archéologique, bien que dans les maisons antiques l'appartement réservé aux femmes ait dû être dans une même partie de la maison."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 224
    "line_start": 3164
    "line_end": 3187
  "translation_ja": "まず舞台装置を見てみよう。「舞台はペロポネソス半島の町トレゼーヌ」。ラシーヌは『フェードル』の巻頭に、これだけ記している。舞台はテゼの宮殿の列柱廊で、高い柱を並べた回廊に囲まれている。装置は壮大で、劇中の英雄的な行動にふさわしい。奥の列柱越しに、頂に神殿が三つ建つ高い丘が見える。テゼのような人物の住まいがどんなものだったか、私たちの考えはいかにもおぼろなので、この装置の建築を受け入れるのに異存はない。どんなギリシア悲劇にも、ローマ悲劇にさえ使えそうではあるが、確かめようのない考古学的正確さに私は重きを置かない。同じ装置でほかの悲劇を上演しても、責めるところは何もない。芸術を心得ていたギリシア人は、ふつう三つの扉のある宮殿の正面、いつも変わらないありふれた装置の前で劇を演じた。中央の扉は王または宮殿の主人の居室に、右の扉は客やよそ者のための部屋に、左の扉は女性に当てられた一角につながっていた。これで観客には、登場人物の身分と役どころがすぐ分かった。私たちの装置にはその利点がない。『フェードル』では左右の扉はそれぞれ居室に通じる。フェードルの部屋は左、アリシーの部屋は右だ。古代の家なら女性の部屋は同じ一角に集まっていたはずだが、だからといって考古学の立場から揚げ足を取るつもりはない。"
  "translation_status": "reviewed"

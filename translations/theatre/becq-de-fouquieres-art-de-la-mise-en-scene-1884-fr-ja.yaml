  "translation_ja": "役を組み立てること。伝統。直観と内省。初めのイメージを発展させること。異なる役どうしの初めのイメージにある共通点と対照。『ドゥミ・モンド』。『ポワリエ氏の婿』。『ベル＝イル嬢』。"

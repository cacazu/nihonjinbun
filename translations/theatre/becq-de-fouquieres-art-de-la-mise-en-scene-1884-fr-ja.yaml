- "id": "becq-0166"
  "section_id": "ch20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De la loi d'apparence.--De l'usage des lorgnettes.--Au théâtre, le sens du toucher ne s'exerce jamais.--Seules les sensations optiques sont directes.--Le théâtre ne nous doit que des apparences.--Des costumes et des toilettes des actrices."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 166
    "line_start": 2175
    "line_end": 2178
  "translation_ja": "見かけの法則。観劇用の小型双眼鏡。劇場で触覚が働くことはない。直接受けるのは視覚の感覚だけ。劇場が与えるべきは見かけだけである。女優の衣裳と装い。"
  "translation_status": "reviewed"
- "id": "becq-0167"
  "section_id": "ch20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La loi d'apparence est d'un genre différent et a une portée tout autre. Elle est basée sur ce fait important que, dans les beaux-arts, sur les cinq sens que nous possédons, deux ne sont jamais exercés, ce sont le goût et l'odorat, et qu'au théâtre sur les trois sens artistiques, la vue, l'ouïe et le toucher, deux seulement sont appelés à jouer un rôle. Les sensations tactiles ne figurent que comme des sensations ordinairement associées à des sensations optiques, et la sûreté de nos appréciations est au théâtre constamment mise en défaut par la distance. Sans doute la plupart des spectateurs sont armés de lorgnettes qui comblent en partie cette distance, mais il n'y a pas à s'arrêter à cette objection; car, s'il y a un fait certain, c'est que la lorgnette est destructive du plaisir théâtral, puisqu'elle a pour effet de rompre l'illusion que l'on a eu quelquefois tant de peine à produire. La lorgnette est nécessaire pour corriger une infirmité de la vue et même de l'ouïe; pour satisfaire un goût plastique, s'il s'agit de la beauté des actrices, ou, à un point de vue plus spécial, pour étudier les jeux de physionomie d'un acteur. En dehors de ces quelques cas, je considère la lorgnette comme essentiellement contraire au plaisir purement artistique que nous allons chercher au théâtre. Ce point écarté, je reviens à la loi d'apparence."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 167
    "line_start": 2181
    "line_end": 2200
  "translation_ja": "見かけの法則は種類が違い、意味するところもまるで異なる。これは、次の大切な事実に基づいている。芸術では、私たちの五感のうち、味覚と嗅覚はけっして使われない。さらに劇場では、芸術にかかわる三つの感覚、すなわち視覚、聴覚、触覚のうち、働くのは二つだけである。触覚が現れるとしても、ふだん視覚と結びついている感覚としてだけであり、劇場では距離があるため、いつも判断の確かさを欠く。なるほど、多くの観客は観劇用の小型双眼鏡を持ち、それで距離をいくらか埋める。だが、その反論にこだわる必要はない。小型双眼鏡は、時にはたいへんな苦労をして作った錯覚を破り、観劇の喜びを損なう。確かなことがあるとすれば、それだ。小型双眼鏡は、見えにくさや、ときには聞こえにくさを補うため、女優の美しさを眺めて造形への好みを満たすため、あるいはもっと特別な場合として、俳優の表情の動きを研究するためには必要だ。こうした少数の場合のほかでは、小型双眼鏡は、劇場に求める純粋に芸術的な喜びと根本から相いれないと思う。この点は脇に置き、見かけの法則に戻ろう。"
  "translation_status": "reviewed"
- "id": "becq-0168"
  "section_id": "ch20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si nous étalons devant nos yeux, à une distance assez faible pour que nous puissions saisir les détails des objets, un morceau de marbre, de pierre, d'ivoire, de bois, de carton ou de toile, de soie, de velours, nous remarquerons que la vue de ces différents objets éveille en nous une foule de sensations tactiles qui, même sans que nous les éprouvions directement, nous sont absolument indispensables pour formuler un jugement sur la nature réelle des objets. Il semble que nous les touchions, et si nous les touchions réellement les sensations éprouvées seraient plus fortes, mais nullement différentes de celles que la vue avait suffi à déterminer en nous. Or, au théâtre, le tact ne peut pas s'exercer, et la distance est toujours assez grande pour que les sensations tactiles associées aux sensations optiques soient excessivement faibles, car ce ne sont que des réminiscences. La distance, en effet, ne nous permet pas d'apprécier le poli du marbre, la transparence de l'ivoire, la qualité fibreuse du bois, la trame soyeuse des étoffes, non plus que l'habileté du tissage ou du brochage. Nos sensations optiques se réduisent au coloris des objets, aux relations de tons entre les ombres et les lumières et à la nature plus ou moins brillante ou mate des reflets."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 168
    "line_start": 2202
    "line_end": 2220
  "translation_ja": "一片の大理石、石、象牙、木、厚紙、布、絹、ビロードを、細部が分かるほど近くに並べてみよう。違った物が目に入ると、数々の触った感じが呼び起こされると気づくだろう。直接感じないにもかかわらず、物が本当は何なのかを判断するのに、その感覚は欠かせない。まるで手で触っているような気がする。実際に触れれば、感覚はもっと強いだろうが、目だけで呼び起こしたものと少しも違わない。ところが劇場で触覚は使えず、舞台までがつねに十分遠いため、視覚に結びつく触覚はきわめて弱い。記憶に残る感覚にすぎないからだ。遠くからでは実際、大理石の艶や象牙の透け具合、木の繊維、布地の絹らしい織り目、織りや浮き模様の巧みさは、見分けられない。私たちの視覚の感覚は、物の色合い、光と影の調子の関係、反射光がどれほど輝くか、あるいはつやを抑えているかに限られる。"
  "translation_status": "reviewed"
- "id": "becq-0169"
  "section_id": "ch20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous ne jugeons donc, au théâtre, des objets que par leur aspect extérieur. Par conséquent, pour que notre illusion soit suffisante, le théâtre ne nous doit que des apparences. A quoi servirait-il de nous montrer une colonne de marbre, si une colonne de carton peint nous produit l'effet du marbre? A quoi bon recouvrir des meubles d'une étoffe coûteuse, si une étoffe plus grossière produit un effet analogue? Du bois blanc habilement peint ne suffira-t-il pas à représenter à nos yeux le meuble le plus précieux? Qu'on le remarque, ce n'est pas là le résultat d'une convention préalable, conclue entre le décorateur et le public. Le théâtre nous donne absolument tout ce qu'il nous doit, des sensations optiques exactes; et comme nous ne pouvons contrôler ces sensations par le toucher, il n'a pas à se préoccuper d'une éventualité qui ne se produira pas. Un directeur inintelligent pourrait seul avoir la fantaisie de satisfaire un sens qui au théâtre ne s'exerce jamais. On en a vu des exemples, et jamais l'effet n'a répondu à l'attente. Seule, la ruine est au bout de ces essais aussi inutiles qu'extravagants. D'ailleurs, c'est précisément parce que la mise en scène est une fiction qu'elle est un art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 169
    "line_start": 2222
    "line_end": 2239
  "translation_ja": "したがって劇場で物を判断するのは、外から見た様子だけによる。ゆえに、十分な錯覚を起こすために、劇場が私たちに与えるべきは、見かけだけである。色を塗った厚紙の柱で大理石に見えるなら、本物の大理石の柱を見せて何になるのか。粗い布でも同じように見えるのなら、何のために家具を高価な布で張るのか。巧みに色を塗った白木で、どんなに高価な家具でも私たちの目に見せられるのではないか。よく見てほしいが、これは舞台美術家と観客があらかじめ取り交わした約束の結果ではない。劇場は、与えるべきものをすべて、すなわち正確な視覚の感覚を、間違いなく与えている。それを触って確かめられない以上、起こりもしないことを気にする必要はない。劇場でけっして使わない感覚まで満足させようと気まぐれを起こすのは、分別のない責任者だけだろう。そうした例もあったが、一度として結果は期待に応えなかった。無用で途方もないこうした試みの行き着く先は、破滅だけである。そもそも演出は、虚構であるからこそ芸術なのだ。"
  "translation_status": "reviewed"
- "id": "becq-0170"
  "section_id": "ch20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les costumes, eux aussi, devraient obéir à la loi d'apparence. On en tient compte, sans doute, dans une certaine mesure, les hommes surtout, car les femmes y résistent ou plutôt se révoltent contre elle. Mais est-ce bien aux actrices qu'il faut reprocher leurs excès de toilette? N'y a-t-il pas de la faute du public? Voyez dans une salle de spectacle toutes les lorgnettes se diriger sur l'actrice qui entre en scène, l'environner, la dévisager, la passer en revue dans toutes les parties de sa personne, examiner les mille détails de sa toilette, signer sa robe du nom du plus habile faiseur, faire l'inventaire et l'estimation de ses diamants et de ses dentelles. Du moment que le spectateur modifie les conditions de l'optique théâtral, l'actrice est-elle bien coupable de violer la loi d'apparence? Notez que ces superbes toilettes, si véritablement belles et luxueuses quand on les détaille au grossissement de la lorgnette, sont très souvent d'un très médiocre effet quand on les regarde à l'oeil nu, c'est-à-dire quand on les replace dans les conditions optiques qui conviennent au théâtre. C'est que l'art de la toilette à la ville obéit à de tout autres lois que l'art de la toilette à la scène. La toilette de ville est soumise de très près à la vue et à la possibilité du toucher; la toilette de théâtre n'est faite que pour nous procurer une satisfaction du sens de la vue, affaibli par la distance. En sculpture et en peinture, une oeuvre destinée à être regardée à une distance de trente mètres est d'un travail absolument différent de celle qui doit être vue à une distance de trois ou quatre mètres. Il en est de même de la toilette des actrices: un costume de théâtre doit, pour produire le même effet qu'un costume de ville, être traité différemment et exige des étoffes différentes qui fassent des plis plus larges et plus amples, et qui par conséquent soient d'une autre qualité. En outre, les tons doivent être plus francs et choisis en vue de l'éclairage spécial des théâtres; les ornements doivent être d'un dessin plus simple et d'une plus grande sobriété de détails. C'est souvent par des moyens contraires qu'on obtient des effets analogues. La même toilette ne peut également plaire le jour dans le monde et le soir au théâtre; elle ne peut non plus satisfaire également deux spectateurs dont l'un la détaille à l'aide de la lorgnette et l'isole ainsi de l'ensemble de la mise en scène, et dont l'autre se contente de la regarder dans la perspective théâtrale. Une actrice intelligente ne saurait hésiter. Mais le moyen le plus sûr de soumettre les actrices aux conditions esthétiques de l'art de la mise en scène serait de ne pas leur faire supporter les frais de leur toilette. Elles y gagneraient assurément, ainsi que les convenances artistiques. La différence que l'on a établie entre ce qu'on appelle le costume de théâtre et la toilette de ville est absurde et contraire à la vérité artistique. Au théâtre, il n'y a pas de toilettes de ville, il n'y a que des costumes de théâtre. Si la direction ne consent pas à payer tous les costumes, au même titre qu'elle fait les frais des décors et des accessoires, c'est elle qui est en partie responsable des fantaisies ruineuses que se permettent les actrices. Toutefois, parmi les causes de ce luxe exagéré, une des plus difficiles à détruire est précisément le goût de la société actuelle, je ne dirai pas pour la toilette, ce qui a existé de tout temps, mais pour la diversité de la toilette. Dans chaque mode générale chaque femme se taille une mode particulière; et les femmes de théâtre, dans la position en vue qu'elles occupent, sont excusables de chercher à faire preuve d'un goût personnel dont les spectatrices cherchent à découvrir la caractéristique, souvent dans un but avoué d'imitation."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 170
    "line_start": 2241
    "line_end": 2294
  "translation_ja": "衣裳も、もちろん見かけの法則に従うべきである。ある程度は守られており、とりわけ男性はそうだが、女性には抵抗、むしろ反抗するところがある。だが、装いの行きすぎを女優だけのせいにできるだろうか。観客のせいでもないのか。劇場で女優が出てくると、あらゆる小型双眼鏡が一斉に彼女に向けられ、まわりを取り囲み、顔を眺め、その身体の隅々を調べ、装いの細部を百も千も吟味し、もっとも腕利きの仕立屋の名を衣裳にあてがい、ダイヤやレースを一つずつ調べて値踏みするのを見てほしい。観客が舞台を見るための条件を変えてしまった以上、見かけの法則を破る女優は、本当に責められるべきだろうか。小型双眼鏡で拡大して詳しく見るとまことに美しく豪華な、見事な装いが、肉眼で見ると、とかく平凡にしか映らない点にも注意してほしい。すなわち舞台にふさわしい見え方の条件へ戻すと、効果はありふれたものになる。外出の装いの技と舞台の装いの技は、まったく違う法則に従うからだ。外出の装いなら、すぐそばから見られ、触られる可能性もある。劇場の装いは、距離で弱められた視覚の満足を与えるためだけにある。彫刻でも絵画でも、三十メートル離れて見る作品の仕上げは、三、四メートルのところから見る作品とは、まったく違う。女優の装いも同じだ。街着と同じ効果を出すために、舞台衣裳は別の作り方を要し、折り目の幅が広くゆったりした、したがって違う質の布が要る。それだけでなく、色調はもっとはっきりさせ、劇場特有の照明を考えて選ばなければならない。飾りは模様を簡素にし、細部を抑えるべきである。似た効果が得られるのは、反対の手段を使ったときであることが多い。同じ装いで、昼間の社交界と夜の劇場を同じように喜ばせることはできない。また、小型双眼鏡で詳しく見て演出全体から切り離す観客と、舞台本来の見え方で見るだけの観客を、同じように満足させることもできない。分別のある女優なら、どちらを選ぶかためらうはずがない。とはいえ女優に、演出の技の美学的な条件に従ってもらうもっとも確かな方法は、装いの費用を本人に負わせないことだ。女優自身も、芸術上の釣り合いも、確かによくなる。舞台衣裳と街着と呼ぶもののあいだに設けられた区別は、ばかげており、芸術の真実に反する。劇場に街着はなく、あるのは舞台衣裳だけである。劇場の経営が、装置や小道具の費用をもつのと同じようにすべての衣裳費を負担しないなら、女優がほしいままにする身代を傾けるほどのぜいたくの責任は、その経営にも一端がある。ただし、この行きすぎたぜいたくの原因で、取り除くのがとりわけ難しい一つは、まさに現在の社会の好みである。装い好きというならいつの時代にもあったが、ここで言っているのは、装いの多様さを求める好みだ。大まかな流行のなかで、女性は一人ひとり、自分だけの流行を作り出す。舞台の女性は人の目を引く立場にあるだけに、ときにはまねするためと公言している女性の観客が特色を見抜こうとしている、その自分の好みを見せようとするのも、許されることである。"
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est encore une limite que ne doit pas dépasser la fantaisie, c'est celle des convenances. Je ne parle pas seulement des convenances banales qui consistent à ne pas outrager les bonnes moeurs. Mais un exemple fera mieux comprendre la portée de cette observation. Quand un auteur veut traduire sur la scène, pour en tirer des effets comiques, des personnages de la vie réelle, auxquels nous attachons des idées, factices peut-être, mais très puissantes, de dignité, de fierté morale, et qui dans notre esprit sont associés à des sentiments extrêmement délicats, il ne peut le faire, sans nous blesser, qu'en exagérant ce qui est précisément chez eux une qualité essentielle. C'est pourquoi dans Lili, le rôle du Commandant était si amusant, tandis que ceux des autres officiers mêlés à la même action étaient si choquants. C'est qu'en effet c'est une qualité chez un militaire d'être bref, énergique, et d'avoir en même temps le coeur bon et sensible, et que par conséquent on peut rire des exagérations burlesques de ces mêmes qualités. La fantaisie conserve un rapport certain entre les images associées, et quand nous redescendons de la fantaisie au réel, nous ne trouvons rien que de respectable dans l'idée éveillée en nous par l'auteur. Notre rire ne se trouve pas en désaccord formel avec ce qui compose notre sentiment. Au contraire, une sentimentalité de goguette, la fréquentation d'un monde interlope, la trivialité du goût et des habitudes nous choqueront chez un militaire, auquel nous attachons des idées d'honorabilité, de rigidité même, de droiture et de dignité; et c'est pourquoi nous n'acceptons pas sur la scène, quand il s'agit de militaires, la représentation de ces défauts bien qu'ils soient humains. La fantaisie ne fera qu'exagérer notre répugnance, car il y aura une contradiction choquante entre l'image qu'on nous présente et l'image réelle que nous évoquons en nous: et nous nous sentirons d'autant plus blessés que l'image qui nous est chère repose sur une idée acquise, laborieusement fondée par nécessité sociale et soigneusement entretenue par amour-propre national."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 145
    "line_start": 1850
    "line_end": 1880
  "translation_ja": "奔放な空想が越えてはならない限界が、なお一つある。それは何がふさわしいか、という節度である。世間の風紀を傷つけないといった、ありふれた節度だけを言うのではない。例を挙げたほうが、この指摘の意味はよく分かるだろう。作家が笑いの効果を引き出すために、現実にいる人物を舞台に写すとしよう。私たちはその人物に、作られたものかもしれないが、この上なく強い尊厳や品格の考えを結びつけている。心の中では、とりわけ繊細な気持ちのかかった人物である。その場合、まさにその人物の本質的な美点を大きく描くのでなければ、私たちの気持ちを傷つけずに済まない。『リリ』で司令官の役があれほど面白く、同じ出来事に巻き込まれたほかの将校の役があれほど不快だったのは、そのためだ。軍人がものを簡潔に言い、気力に富み、そのうえ心がやさしく、感じやすいのは、美点である。それなら、まさにその美点が滑稽に誇張されても笑うことができる。奔放な空想は、取り合わせた像のあいだに確かな関係を残す。空想から現実に降りてきても、作者が私たちの内に呼び起こした考えには、尊敬に値しないところがない。笑いは、私たちの感情を形づくるものと、はっきり食い違うこともない。反対に、軍人が遊興の席でめそめそしたり、怪しげな世間とつきあったり、下品な好みや習慣を見せたりすれば、私たちは不快に思うだろう。軍人には高潔さ、厳格ささえ、また正直さと威厳を結びつけているからだ。こうした欠点も人間のものではあるが、軍人の場合は、舞台でそれを描くことを受け入れないのはそのためである。奔放な空想は、その嫌悪を増すだけだ。目の前に出された像と、内に思い浮かべるほんとうの像とのあいだに、目障りな矛盾があるからである。しかも、私たちの大切にする像が、社会の必要から苦心して形づくられ、国民の自尊心から念入りに保たれてきた考えに基づく以上、気持ちはなおいっそう傷つく。"
  "translation_status": "reviewed"

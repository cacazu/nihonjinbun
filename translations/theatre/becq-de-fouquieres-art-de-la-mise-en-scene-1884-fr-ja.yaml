  "translation_status": "reviewed"
- "id": "becq-0349"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Du rôle de la musique au théâtre.--La puissance musicale.--Le mélodrame.--Le vaudeville.--Évolution de l'art dramatique.--La musique devenue un personnage dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 349
    "line_start": 5165
    "line_end": 5167
  "translation_ja": "演劇における音楽の役割。音楽の力。メロドラマ。ヴォードヴィル。劇作の変化。劇の一人物となった音楽。"
  "translation_status": "reviewed"
- "id": "becq-0350"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans ce chapitre et le suivant je voudrais, au point de vue de l'esthétique et de la mise en scène, dire quelques mots du rôle de la musique dans les représentations théâtrales. La musique est en soi un art complet, absolu, comme la poésie et comme la peinture, et ce n'est pas naturellement de cet art, considéré dans son ensemble, dont je puis avoir à m'occuper ici, non plus que des productions de cet art qui sont fondées sur le plaisir propre de l'oreille. Mais la musique tient dans son empire l'expression des sentiments, et en dehors du charme qu'elle exerce sur l'oreille, ou conjointement avec lui, elle provoque dans tout notre être, toujours par l'intermédiaire de l'oreille, un ébranlement qui se propage dans tout le système nerveux, et qui détermine en nous des états généraux identiques à ceux que nous éprouvons dans la tristesse, dans la joie, dans l'enthousiasme, dans la langueur, dans l'attendrissement, etc. Associée en nous-mêmes avec tous les sentiments que notre âme est capable d'éprouver, elle a le merveilleux pouvoir, en nous replaçant dans les mêmes conditions d'ébranlement nerveux, de les rappeler, de les faire renaître en nous, de troubler et de bouleverser tout notre être par le mouvement qu'elle imprime aux ondes nerveuses qui le parcourent. Bien des conditions contribuent à l'effet que produit sur nous la musique: la qualité des sons, leur hauteur, leur timbre, les rapports mélodiques des sons successifs, les rapports harmoniques des sons simultanés, le mouvement, le rythme, etc. Mais ne considérons ici que la hauteur des sons; le reste s'y ajoute naturellement et multiplie ou affaiblit, en tout cas modifie profondément l'effet produit par la hauteur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 350
    "line_start": 5170
    "line_end": 5194
  "translation_ja": "この章と次の章では、美学と演出の観点から、演劇の上演で音楽が果たす役割を少し述べたい。音楽は、詩や絵画と同じく、それ自体で完全で自立した芸術である。もちろん、芸術としての音楽の全体をここで取り上げるわけでも、耳そのものの楽しみを根に置く作品を扱うわけでもない。だが音楽は感情の表現を支配している。耳を楽しませるのとは別に、またはそれと同時に、音楽は耳を通して全身を揺り動かす。その揺れは神経系全体へ広がり、悲しみ、喜び、熱狂、気だるさ、しみじみとした感動などを覚えるときと同じ、全身に及ぶ状態を作る。心が感じうるあらゆる感情と私たちの中で結びついており、神経が同じように揺れる条件に戻すことで、それらを呼び戻し、よみがえらせ、身体を走る神経の波に運動を与えて私たちをすっかりかき乱すという、みごとな力をもつ。音楽の効果には音の質、高さ、音色、続く音どうしの旋律上の関係、同時に鳴る音どうしの和声上の関係、速度、リズムなど、さまざまな条件が関わる。だが、ここでは音の高さだけを考えよう。残りの条件はおのずと加わり、高さの効果を増したり弱めたり、いずれにせよ大きく変えたりする。"
  "translation_status": "reviewed"
- "id": "becq-0351"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand nous parlons, les syllabes successives que nous prononçons sont à des hauteurs diverses; pour y monter ou pour en descendre, notre voix se traîne rapidement de l'une à l'autre, et, ne franchissant pas d'un bond les intervalles qui les séparent, ne se fixant d'ailleurs à aucune des hauteurs qu'elle effleure, ne nous fait éprouver que des sensations sonores, mais non musicales, aucun des sons émis ne pouvant se rapporter exactement à une gamme quelconque. Sans doute certaines voix nous semblent et sont en effet plus musicales que d'autres; sans doute dans le langage d'un acteur, et surtout d'une actrice, il passe instantanément des syllabes qui ont une réelle puissance musicale et nous font tressaillir comme un coup d'archet; mais nous devons voir ici le phénomène dans sa généralité et nous sommes fondés à dire que, dans le langage parlé, les sons, en dehors des idées qu'ils expriment, ne nous causent que des sensations musicales très légères, et par conséquent ne déterminent en nous que des sentiments très fugitifs. Au contraire, dans le chant, l'effort que fait le chanteur pour tenir le son à une hauteur exactement musicale détermine en nous un ébranlement nerveux identique et correspondant et fait vibrer notre être à l'unisson de celui du chanteur. Ainsi quand la voix passe du langage parlé au chant, l'auditeur passe d'états non persistants et très légèrement sentis à des états persistants et profondément sentis."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 351
    "line_start": 5196
    "line_end": 5216
  "translation_ja": "人が話すとき、次々に口にする音節の高さはさまざまである。次の高さへ上り下りするとき、声はその間をすばやく滑ってゆく。隔たりをひと跳びに越えるわけでも、かすめる途中の高さにとどまるわけでもない。そのため音は聞こえても、音楽としては感じられない。発する音のどれも、ある音階に正確に位置づけられないからだ。もちろん、人によって声は歌うように聞こえ、事実そういう声もある。俳優、とくに女優の台詞には、真に音楽的な力のある音節が一瞬通り過ぎ、弓が弦をひと引きするように私たちをはっとさせることもある。しかしここで見たいのは一般的なあり方だ。話し言葉の音は、表す観念を別にすれば、ごく軽い音楽的な感覚しかもたらさず、ごく短く消える感情しか起こさない、と言ってよい。逆に歌では、歌い手が音を音楽的に正確な高さに保とうとする努力が、私たちにもそれと対応する同じ神経の揺れを起こし、歌い手と同じ調子に全身を震わせる。こうして声が話し言葉から歌に移ると、聞き手は続かないかすかな感覚から、長く続き、深く感じられる状態へ移る。"
  "translation_status": "reviewed"
- "id": "becq-0352"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cela étant bien compris, voyons quel était jadis le rôle de la musique dans les représentations dramatiques. Deux genres faisaient alors un emploi constant de la musique, c'était le mélodrame et le vaudeville. Le mélodrame est un drame dont les situations pathétiques sont annoncées, soutenues et renforcées par la musique. C'est l'orchestre seul qui fait ici l'office de multiplicateur. Quand la situation est de nature à faire éprouver au spectateur un sentiment quelconque, l'orchestre s'en empare, ajoute à la sensation éprouvée toute la puissance musicale, détermine dans l'être du spectateur un ébranlement nerveux, jette l'âme dans un trouble profond et la tient sous l'empire d'un sentiment assez intense pour qu'elle ne puisse se soulager que par les larmes du poids qui l'oppresse. Telle est l'esthétique du mélodrame. La musique y vient donc en aide au pathétique; mais, point important à noter, elle reste complètement en dehors de l'action. C'est un moyen d'agir sur le système nerveux du spectateur, qui ne fait pas partie intégrante du drame; et si, par impossible, on pouvait concevoir un rapport entre un courant électrique et les ondulations nerveuses corrélatives de nos sentiments, on pourrait parfaitement dans les mélodrames remplacer l'orchestre par une pile électrique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 352
    "line_start": 5218
    "line_end": 5236
  "translation_ja": "以上を踏まえ、昔の演劇の上演で音楽が果たした役割を見よう。音楽をいつも使っていた形式は二つ、メロドラマとヴォードヴィルである。メロドラマでは人の心を打つ状況を、音楽が予告し、支え、強める。ここで気持ちを増幅するのはオーケストラだけだ。観客に何らかの感情を起こさせる状況になると、オーケストラはその感情を捉え、いま感じたことに音楽の力をそっくり加える。観客の神経を揺り動かし、魂を深い動揺に投げ込み、涙でしかその重苦しさから救われないほど強い感情にとらえる。これがメロドラマの美学である。音楽は、人を動かす情景の力を助ける。ただし大事なのは、それが筋の運びのまったく外側にあることだ。それは観客の神経系に働きかける手段であり、劇に不可欠な一部ではない。だから仮に、あり得ないことながら、電流と感情に対応する神経の波との関係を考えられたら、メロドラマではオーケストラの代わりに電池を置いても十分のはずだ。"
  "translation_status": "reviewed"
- "id": "becq-0353"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans le vaudeville, l'union de la musique et de l'action est plus intime. Un vaudeville, est une comédie mêlée de couplets. La musique y fait encore, comme dans le mélodrame, office de multiplicateur et d'amplificateur. L'orchestre souligne les situations qui tournent au sentiment, facilite aux acteurs le passage du langage parlé au chant, et en les accompagnant renforce leur puissance d'action sur l'âme du spectateur. Quant aux personnages, lorsque la situation détermine en eux l'apparition d'un sentiment de tristesse ou de joie, le chant qui succède chez eux au langage parlé donne à leur voix une qualité musicale corrélative de nos sentiments, et ajoute à la valeur de l'idée, exprimée par le couplet, l'expression intense qu'un genre aussi léger ne comporterait pas et que la musique ajoute sans transition, sans effort, par l'effet seul de sa puissance propre. Dans le vaudeville, la musique est donc un multiplicateur du sentiment qu'éprouvent ou qu'expriment les personnages. Mais, qu'on le remarque, elle n'a aucun pouvoir sur eux-mêmes; c'est un procédé accessoire d'expression qu'emploie l'auteur, aidé du musicien, pour donner à ses personnages plus d'action sur l'âme des spectateurs. Si la musique n'est plus ici, comme dans le mélodrame, en dehors du spectacle, elle n'en reste pas moins en dehors de l'action dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 353
    "line_start": 5238
    "line_end": 5257
  "translation_ja": "ヴォードヴィルでは音楽と筋の結びつきはもっと緊密である。ヴォードヴィルとは節をつけた歌を交えた喜劇だ。ここでもメロドラマと同じく、音楽は効果を増幅し、強める。オーケストラは感情に向かう状況をくっきりさせ、俳優が台詞から歌に移るのを助け、伴奏で観客の心に働きかける力を強める。登場人物のほうでは、状況が悲しみや喜びを生むと、話し言葉に代わる歌が、その声に私たちの感情と呼応する音楽的な性質を与える。歌詞の表す意味に、こんな軽い形式だけでは出せないほど強い表現を加える。音楽は、つなぎも苦労もなしに、自分自身の力だけでそれを加えるのである。だからヴォードヴィルで音楽は、人物が覚えたり表したりする感情を増幅する。ただし、人物自身に働きかける力はないことに注意してほしい。観客の心への働きを増すために、作者が音楽家の手を借りて使う、補助的な表現の工夫なのだ。メロドラマと違って、音楽はもう上演の外にはないが、筋の運びの外にはとどまる。"
  "translation_status": "reviewed"
- "id": "becq-0354"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'ancien vaudeville était presque toujours une pièce gaie, aimable, dans laquelle çà et là une pointe de sentiment, née de l'action, était habilement saisie par l'auteur, qui fixait ce sentiment dans un couplet et au moyen de la musique en multipliait l'effet. Puis le dialogue vif, alerte reprenait, et le vaudeville continuait sans grande ambition littéraire, éveillant ainsi de temps à autre la sensibilité du public. Spectacle aimable, sans fatigue, plaisir mêlé d'un attendrissement délicat et modéré, comme il sied à un public qui n'a pas besoin d'être violemment secoué. La vie était alors plus facile et plus unie; le spectacle était une récréation qu'on goûtait innocemment, un jeu dont on connaissait l'artifice et auquel on s'abandonnait sans arrière-pensée, pour le plaisir du jeu lui-même. Tous les hommes qui sont au déclin de leur vie ont connu le vaudeville dans toute sa gloire, surtout s'ils ont commencé de bonne heure à aller au théâtre, et ont conservé un souvenir ineffaçable des douces émotions qu'il leur a fait éprouver. Et cependant sa gloire aussi a passé. Aujourd'hui, le vaudeville est mort à jamais, et ses quelques soubresauts sont ceux d'une agonie qui se prolonge. Les hommes de ma génération le regrettent, mais c'est en vain qu'ils espèrent pour lui un retour de fortune. Ce ne pourrait être que le résultat d'une mode passagère. Le vaudeville a vécu; et il ne ressuscitera pas plus que le génie dramatique de Scribe."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 354
    "line_start": 5259
    "line_end": 5279
  "translation_ja": "昔のヴォードヴィルは、ほとんどいつも陽気で感じのよい芝居だった。筋からところどころに生まれるほんの少しの感情を、作者が器用につかまえて歌詞にとどめ、音楽でその効果を増幅する。それから生き生きと歯切れのよい会話が戻り、ヴォードヴィルは大きな文学的野心もなく運び、ときどき観客の感受性を目覚めさせる。気持ちよく見られて疲れない。繊細で穏やかな感動の混じる楽しみであり、強く揺さぶられる必要のない観客に似つかわしい。当時は暮らしがもっと楽で平穏だった。観劇は無心に味わう息抜きであり、作り物と承知していながら、遊びそれ自体を楽しもうと邪念なく身を委ねる遊びだった。人生の暮れに差しかかった人たちはみな、とくに若いうちから劇場に通った者は、ヴォードヴィルの花盛りを知っていた。それが味わわせてくれたやさしい感動の思い出は消えない。だがその栄光も過ぎた。今日、ヴォードヴィルは永遠に死んだ。わずかに身を跳ねさせるのは、長い臨終のけいれんである。私と同世代の人たちは惜しむが、ふたたび運が向くのを願っても無駄だ。あったとしても一時の流行にすぎない。ヴォードヴィルはその生を生き切った。スクリーブの劇作の天才がよみがえらないように、これもよみがえらない。"
  "translation_status": "reviewed"
- "id": "becq-0355"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais d'où vient la disparition de ce genre particulier de la littérature dramatique? Est-elle due au hasard? Est-elle le fait de la volonté déterminée de quelques auteurs? Est-ce par caprice ou par ennui que le public s'en est détourné? Je crois peu au hasard dans la destinée des choses et très peu à l'influence des hommes sur l'évolution de leurs idées et les modifications de leur goût. Nous nous développons sous l'empire de causes et de lois qui nous échappent, et nous savons aujourd'hui, par exemple, que nos langues, quels que soient les efforts souvent contraires des savants, naissent, se développent, s'épanouissent et meurent suivant des lois inéluctables. C'est dans ce cas l'ignorant qui est l'instrument inconscient de la nature, et tout ce que nous pouvons savoir ou deviner, c'est que les races humaines, leurs idées, leurs langues et leurs arts obéissent comme tous les êtres, comme les plantes elles-mêmes, dans leur lente évolution, aux mêmes causes premières et présentent aussi leur époque de germination, de croissance, de floraison et de mort. Mais nulle part ici-bas la mort n'est un anéantissement dans le sens exact du mot; c'est une dissolution de parties, une désagrégation suivie d'une redistribution des éléments suivant de nouvelles combinaisons, en un mot, une transformation de matière et un transport de forces. Si donc le vaudeville a disparu, il faut y voir non une perte absolue, définitive, mais une transformation dans la matière plastique du drame et un transport ainsi qu'une redistribution nouvelle de la force émotionnelle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 355
    "line_start": 5281
    "line_end": 5303
  "translation_ja": "では、劇文学のこの独特の形式が消えたのはなぜか。偶然だろうか。何人かの作者がはっきり意図したことなのか。気まぐれか、退屈のために観客がそっぽを向いたのか。物事の運命に偶然が働くとはあまり信じないし、人間が自分の考えの変化や好みの移り変わりを自由にできるとは、なおさら信じない。人間は、自分にはつかめない原因と法則のもとで発達する。たとえば、専門家の尽力がしばしば反対の方向に働くにもかかわらず、言語は抗しがたい法則に従って生まれ、伸び、花開き、死ぬことが今日ではわかっている。この場合、自覚もなく自然の道具となるのは、学識のない者だ。知りうること、見当をつけうることは、人間の諸集団も、その観念も言語も芸術も、あらゆる生きものと同じく、植物とさえ同じく、徐々に変化する際には同じ根本原因に従い、芽生え、成長し、花を咲かせ、死ぬ時期をもつということだけだ。だがこの世のどこにも、厳密な意味で完全に消滅する死はない。死とは諸部分の解体とくずれであり、そのあとに諸要素が新しい組み合わせに従って再配分されること、つまり物質が形を変え、力が移ることだ。だからヴォードヴィルが消えたのなら、絶対的で最終的な喪失ではなく、劇の形をつくる素材の変化と、感情を動かす力の移動、再配分をそこに見なければならない。"
  "translation_status": "reviewed"
- "id": "becq-0356"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et en effet, le vaudeville a disparu dans une évolution de l'art dramatique moderne, évolution qui a consisté en ce que la musique, d'extérieure et d'étrangère qu'elle était, est montée à son tour sur la scène et est devenue un personnage du drame. Jadis la musique était une puissance que le poète conservait dans la main, qu'il déchaînait directement sur le spectateur, renforçant ainsi les moyens dramatiques, et qu'il employait comme un résonateur destiné à amplifier et à multiplier le pathétique. C'était toujours par rapport au drame une puissance objective. Aujourd'hui, la musique est devenue une puissance subjective; elle fait partie intégrante de l'action dramatique, et le point où s'applique directement cette force émotionnelle n'est plus dans l'âme du spectateur, mais dans l'âme même des personnages du drame. Art plus profond et plus élevé, puisque l'émotion que provoque en nous la musique n'est plus étrangère à l'action, mais au contraire naît en nous sympathiquement du trouble qu'éprouve l'être même du personnage et de l'état psychologique de son âme."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 356
    "line_start": 5305
    "line_end": 5320
  "translation_ja": "事実、ヴォードヴィルは近代の劇作の変化の中に消えた。その変化とは、それまで外部にあって異質だった音楽が、今度は舞台へ上り、自分自身が劇の一人物になったことである。昔、音楽は作者が手中に保持する力だった。観客にじかに解き放って劇の手段を強め、人の心を動かすものを大きく増幅する響鳴器として用いた。劇にとっていつも客観的な力だった。今日、音楽は主観的な力になった。劇の運びに不可欠な一部であり、感情を動かす力がじかに届くのは、もう観客の魂ではなく、劇の人物の魂そのものである。いっそう深く、高い芸術である。音楽が私たちに起こさせる感動は、もう劇の運びと無縁ではない。むしろ人物自身が覚える動揺や、その心のありように共感することで、こちらに生まれるからだ。"
  "translation_status": "reviewed"
- "id": "becq-0357"
  "section_id": "ch36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a sans doute à cette révolution de l'art une cause profonde, qui semble être la nécessité d'une imitation plus transcendante de la vie et de l'être humain, au sein duquel s'opère la fusion de toutes les forces physiques, intellectuelles et morales. L'art dramatique avait jusqu'alors soustrait ses personnages à toutes les forces naturelles qui assiègent l'homme et les avait uniquement soumis à l'empire des idées. La musique les soumet à l'empire des sensations. La révolution qui s'est opérée insensiblement et qui a fait pénétrer la puissance émotionnelle des sons dans le drame littéraire semble de même ordre que celle qui a fait pénétrer la puissance imaginative des idées dans le drame musical. De telles révolutions sont lentes et ne se font pas par de brusques changements à vue. Dans la nature, il en est de même: chaque goutte d'eau qui tombe ne laisse pas de trace visible, mais au bout d'un certain temps on s'aperçoit que le roc le plus dur s'est creusé sous l'effort incessant des gouttes d'eau. Dans l'art, on ne peut suivre pas à pas les progrès d'une évolution, mais on peut périodiquement mesurer le chemin parcouru. Aujourd'hui, on en sera frappé pour peu que l'on porte son attention sur ce point, il est incontestable que la musique joue un rôle considérable dans nos pièces de théâtre, et qu'elle y apparaît avec sa puissance propre. Tantôt elle agit directement sur l'esprit d'un personnage, tantôt elle prête sa voix à son âme émue et muette; quelquefois, acteur elle-même dans le drame, elle évoque et dessine à nos yeux une image avec une puissance et une précision véritablement magiques et que n'atteindrait pas un récit littéraire. En un mot, la musique est devenue une puissance dramatique; et, comme telle, elle s'associe à l'action, y contribue par l'émotion qu'elle développe dans le héros du drame, et transporte; en nous l'émotion à laquelle il est en proie et que sa voix serait lente ou impuissante à exprimer. Mais toujours elle fait partie intégrante du sujet; elle en est en quelque sorte un personnage impalpable et invisible. C'est donc la façon dont les auteurs modernes comprennent la mise en scène de ce nouveau et poétique personnage qu'il nous faut éclaircir autant que possible par des exemples."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"

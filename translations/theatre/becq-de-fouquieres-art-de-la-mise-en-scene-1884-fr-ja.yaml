- "id": "becq-0409"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A la vérité, l'école qui s'intitule naturaliste paraît avoir une grande prédilection pour la forme du roman. Cela se conçoit; car c'est là seulement que, lorsque les personnages n'agissent pas ou ne prennent pas la parole, un acteur, et le principal, reparaissant en scène, décrit les beautés sévères ou riantes de la nature, la mélancolie des bois ombreux, l'immobile majesté des monts, la pesante solitude des espaces déserts; la mystérieuse circulation de la vie, ses ardeurs et ses épuisements, et en même temps cherche à montrer le lien sympathique qui rattache les états psychologiques de l'être humain à tous ces aspects de la nature. Cet acteur, c'est le poète lui-même, dont l'âme anime la nature inanimée. Mais, au théâtre, les personnages seuls ont le droit de s'adresser au public, et le poète, c'est-à-dire le démonstrateur psychologique, est réduit au silence. La nature n'agit donc dans la mise en scène que par ses effets simples et généraux, n'engendrant chez les spectateurs que des sensations initiales, simples et générales. Nous arrivons ainsi, par un autre chemin, à la même conclusion que dans le chapitre précédent. Au théâtre, le poète, présent mais silencieux, n'y peut plus animer la nature et lui insuffler, comme dans le roman, une sorte de force passionnelle active. C'est pourquoi, en abordant la scène, l'école naturaliste est contrainte d'abandonner toute sa puissance descriptive, et de sacrifier la nature pour s'attacher aux effets humains et sociaux de la vie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 409
    "line_start": 6213
    "line_end": 6234
  "translation_ja": "じっさい、自然主義を名乗る流派は小説の形式を大いに好むようだ。もっともである。人物が行動も話もしないとき、一人の俳優、しかも主役がまた舞台に上がれるのは、小説だけだからだ。自然の厳しい、あるいは晴れやかな美しさ、陰の深い森の憂うつ、山々の動かぬ威厳、人けのない空間の重苦しい孤独を描く。生命がひそかに巡るさま、その熱気と疲弊を描く。そしてこうした自然のありさまと、人の心の状態を結びつける共感の糸を見せようとする。この俳優は作者自身であって、その魂が生命のない自然に息を吹き込む。ところが演劇で観客に話しかける権利があるのは登場人物だけであり、心を解き明かす作者には沈黙しか許されない。自然が舞台で働くのは、その単純で全体的な効果を通してだけであり、観客に生まれるのも単純でおおまかな最初の感覚だけだ。こうして前章と同じ結論に、別の道から達する。演劇で作者は立ち会うが語らない。小説のように自然を生き生きさせ、能動的に心を動かす一種の力を吹き込むことはもうできない。だから舞台に取り組む自然主義派は、自らの描写力をことごとく手放し、自然を犠牲にし、生活が人間や社会にもたらす効果に専念せざるをえない。"
  "translation_status": "reviewed"
- "id": "becq-0410"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quelle est, sous ce rapport et en quelques mots, l'esthétique de l'école? Si je vois juste, la voici, dégagée des théories secondaires qui l'encombrent et présentée sans dénigrement avec toute l'impartialité dont je suis capable. On peut dire, sans exagération, qu'elle est tout entière contenue dans la théorie des milieux. Premièrement, les êtres humains ne peuvent s'abstraire des milieux où ils sont nés, où ils se sont développés et qui déterminent leur mode de sentir, leur mode de penser et leur mode d'agir. Deuxièmement, nulle action dramatique, née du conflit de passions humaines, ne peut s'isoler des milieux où elle se noue, se développe et tend à sa fin."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 410
    "line_start": 6236
    "line_end": 6245
  "translation_ja": "この点から見て、この派の美学を一言で言うとどうなるか。見立てが正しければ、邪魔になる二次的な理論を取り除き、けなさず、私にできるかぎり公平に述べて、次のとおりである。誇張ではなく、この派の美学は環境の理論にことごとく収まると言ってよい。第一に、人間は、自分が生まれ、育ち、感じ方、考え方、行動の仕方を決める環境から、自分を切り離せない。第二に、人の情念どうしの衝突から生まれる劇の筋は、それが結ばれ、展開し、終わりに向かう環境から離れられない。"
  "translation_status": "reviewed"
- "id": "becq-0411"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'école ne considère plus une passion en soi, mais l'envisage dans ses différents modes et met son ambition à traduire sur la scène, dans toute leur réalité complexe et relative, les états psychologiques et pathologiques des êtres, individuellement déterminés, qui agissent sous l'empire d'une passion. Ce qu'elle cherche, c'est donc une vérité plutôt relative qu'absolue. C'est pour cela que nous avons dit plus haut que l'école agrandissait la superficie de l'art, en abaissant sensiblement l'idéal. On peut, en effet, accorder au réalisme le droit qu'il réclame de différencier, par exemple, le mode d'aimer de l'homme du peuple de celui de l'homme du monde; mais dès que la jalousie armera d'un couteau la main de l'un et de l'autre, elle devrait à son tour reconnaître que toutes les distinctions sociales s'anéantissent devant un fait pathologique purement humain."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 411
    "line_start": 6247
    "line_end": 6259
  "translation_ja": "この派は情念をそれ自体としては考えず、さまざまな現れ方のうちに捉える。情念に支配されて行動する、個々に特定された人物の心理的・病理的な状態を、その複雑で相対的な現実のまま舞台に表そうとする。それゆえ求めるのは、絶対的な真実というより相対的な真実だ。理想を目に見えて低めることで芸術の面積を広げた、と先に言ったのはそのためだ。たとえば庶民と社交界の人とで愛し方を区別したいと写実主義が求めるなら、その権利は認めてよい。しかし嫉妬がどちらの手にも刃物を握らせたとき、その誰にも起こりうる病理的な事実の前では社会上の区別がことごとく消えることを、写実主義のほうでも認めるべきだ。"
  "translation_status": "reviewed"
- "id": "becq-0412"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'art, parti du particulier et du relatif, doit donc aboutir au général et à l'absolu; et par suite le poète, après avoir soigneusement pris ses types dans la réalité, doit tendre à l'idéal, c'est-à-dire à dégager l'être humain de toute contrainte sociale et à débarrasser les passions des masques sous lesquels cette contrainte les force à se cacher et à se dérober aux regards. C'est le transport du relatif au théâtre qui fait la richesse de l'art moderne; mais c'est seulement en dégageant l'absolu de ses données relatives que celui-ci assurera à ses productions une valeur générale et une portée psychologique universelle, et leur donnera l'espérance de vivre au delà du temps présent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 412
    "line_start": 6261
    "line_end": 6270
  "translation_ja": "だから芸術は、個別的で相対的なものを出発点として、普遍的で絶対的なものに行き着かなければならない。すると作者は、現実から注意深く類型を取ったあと、理想を目指さねばならない。つまり、人をあらゆる社会の縛りから解き、情念がその縛りのためにかぶり、人目を避けさせられる仮面を、取り除く必要がある。相対的なものを劇場に運んだことで近代芸術は豊かになった。しかし相対的な事実の中から絶対的なものを取り出して初めて、作品に誰にも通じる価値と普遍的な心理上の意味を持たせ、今日という時を越えて生きる望みを与えられる。"
  "translation_status": "reviewed"
- "id": "becq-0413"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En cela, l'esthétique théâtrale devra suivre l'esthétique dramatique. Si le poète a conduit rationnellement son oeuvre du relatif à l'absolu, la mise en scène devra s'efforcer de ne pas contrarier cette évolution ascendante. On peut donc, conclure que, dans une oeuvre dramatique moderne, la mise en scène devra réaliser avec le plus de soin possible tous les tableaux d'exposition, ceux où s'accusent le relatif des idées et des faits ainsi que l'influence des milieux sur les caractères et sur les passions; mais, à mesure que l'action s'approchera du dénouement, elle devra de plus en plus sacrifier, soit dans les décors, soit dans les costumes, soit dans la figuration, les traits particuliers qui faisaient la richesse des premiers tableaux, et peu à peu revêtir un aspect général qui puisse s'harmoniser avec ce qu'a d'absolu et de purement humain l'explosion psychologique et pathologique des passions."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 413
    "line_start": 6272
    "line_end": 6284
  "translation_ja": "この点では、上演の美学は劇作の美学に従わなければならない。作者が相対的なものから絶対的なものへ理にかなって作品を導いたなら、演出はこの上昇を妨げないよう努めねばならない。したがって近代の戯曲を演出するときには、考えと出来事が相対的であること、環境が性格や情念に働くことがはっきり出る導入の場面を、できるだけ入念に実現すべきである。だが筋が結末に近づくにつれ、装置であれ衣装であれ群衆役であれ、初めの場面を豊かにしていた個別の特徴をますます犠牲にしなければならない。そして、情念が心と病理の両面で噴き出すときの、絶対で純粋に人間的なところと調和するよう、しだいに普遍的な姿を取らなければならない。"
  "translation_status": "reviewed"
- "id": "becq-0414"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La seconde loi se rapporte, comme nous l'avons dit, à l'influence contingente des milieux. C'est l'aspect multiple et complexe de la vie que l'école cherche à réaliser par l'observation de cette loi. Poussez la porte d'un établissement public quelconque, et dans la foule des êtres humains qui y sont réunis, que de drames et de comédies! Ici un beau drame d'amour va naître, tandis que là une folle comédie se dénoue; dans le groupe prochain un marché honteux se conclut; dans celui-ci un crime horrible se prépare, tandis que dans celui-là s'épanouissent la jeunesse et le bonheur. Une action tragique ou comique ne se développe pas dans le vide, mais elle se meut en traversant des milieux successifs, qui souvent déterminent une modification dans la direction de sa trajectoire. Tous ces tableaux nous représentent la vie dans sa complexité et dans son hétérogénéité actuelles; ils forment le fond pittoresque sur lequel s'enlèvent en vigueur les personnages de premier plan. Si ce sont les personnages qui disparaissent, il n'y a plus d'action dramatique; mais si ce sont les tableaux qu'on soustrait à la vue, on enlève au drame ce qui précisément lui donnait l'aspect saisissant de la vie. En un mot, un drame ne se profile jamais ici-bas sur un fond neutre, semblable à ces fonds gris sur lesquels les peintres enlèvent vigoureusement un portrait, mais sur des tableaux animés eux-mêmes, sur des lambeaux d'histoire humaine et sociale qui sont souvent le commentaire le plus éloquent du drame, soit qu'ils expliquent la fatalité d'un acte par l'influence du milieu traversé, soit que par contraste ils en accusent plus fortement l'horreur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 414
    "line_start": 6286
    "line_end": 6309
  "translation_ja": "第二の法則は、すでに述べたように、たまたま行き合わせた環境から受ける影響に関わる。この法則に従うことで多様で複雑な生の姿を実現することが、この派の目標だ。人が集まる施設の扉をどれでも押してみればよい。そこにいる人間の群れには、どれほどの劇と喜劇があることか。こちらでは美しい恋の劇が生まれようとしている一方、あちらではばかばかしい喜劇が結末を迎える。隣の一団では恥ずべき取引がまとまり、こちらの一団ではおぞましい犯罪の準備が進み、あちらでは若さと幸福が花開く。悲劇や喜劇の筋は真空で展開するのではない。次々に環境を横切って進み、その環境はしばしば進路を変える。こうした場面のすべてが、今日の複雑で異質な生を私たちの前に表す。それらが絵のような背景をなし、前景の人物たちが鮮やかに浮かび上がる。人物が消えたら、劇の筋はなくなる。だが場面を見えなくすれば、まさに劇を息をのむ生の姿にしていたものが失われる。一言で言えば、この世の劇は、絵描きが肖像をくっきり浮かび上がらせる灰色の背景のような中立の地に影を落とすのではない。それ自体が生きた場面、人と社会の歴史の断片の上に黒々と浮かぶ。それらはしばしば劇に最も雄弁な解説となる。人が通った環境の影響で、ある行為が避けられなかったことを教えるか、対照によって、それがおぞましいことをいっそう際立たせるからだ。"
  "translation_status": "reviewed"
- "id": "becq-0415"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De là se déduisent la composition et la construction d'une pièce naturaliste. Il s'agit de peindre les différents moments de l'action au milieu des tableaux animés où celle-ci s'est successivement transportée. D'où la nécessité d'une mise en scène toujours changeante et variée. C'est une succession de tableaux de genre, faits d'après nature, à tous les degrés de la vie sociale, depuis ses bas-fonds jusqu'aux couches supérieures. Évidemment, cette suite d'exhibitions, souvent pleines de mouvement et d'expression, où le pittoresque atteint une grande intensité, constitue pour les yeux et même pour l'esprit un amusement parfois très vif. On arrive ainsi à renouveler et à diversifier, jusqu'à les rendre méconnaissables au premier abord, des drames à peu près aussi vieux que l'esprit humain. Prenez l'Andromaque de Racine, vous en pourrez transporter l'action dans tous les mondes, depuis le plus raffiné jusqu'au plus abject, et vous pourrez diversifier à l'infini votre drame en faisant traverser à vos personnages les milieux les plus étranges. Sans doute, c'est précisément cette possibilité qui constitue la critique du système. Mais ici, je ne critique pas, j'analyse et j'expose les théories d'une école, en cherchant au contraire à les montrer dans leur jour le plus favorable. Or, ce que l'école recherche par-dessus tout, c'est l'exactitude des tableaux, destinée à procurer au spectateur, une sensation très intense de la vie. C'est donc ici qu'apparaît la mise en scène, dont les lois imposent une limite aux prétentions de l'école. Ce qui nous reste donc à examiner, c'est jusqu'où la mise en scène peut se prêter à toutes les exigences naturalistes. Je le ferai très brièvement, attendu que le lecteur, arrivé au dernier chapitre de cet ouvrage, a son jugement formé sur les points principaux qu'il nous faut examiner."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 415
    "line_start": 6311
    "line_end": 6337
  "translation_ja": "ここから自然主義の戯曲の構成と組み立てが導かれる。筋が次々と移る生きた場面の中に、その展開の異なる時点を描くのだ。だから演出はいつも移り変わり、多様でなければならない。社会生活の底から上層まで、あらゆる段階を実物に倣って描く、風俗画の連なりである。絵になる効果が強く、動きや表情にあふれがちな一連の見世物が、目にも頭にも、ときに強い楽しみであることは確かだ。こうすれば、人間の精神と同じくらい古い劇を、一見それとはわからぬほど新しくし、多様にできる。ラシーヌの『アンドロマック』を取ってみよう。洗練の極みから卑しさの底まで、どんな社会にも筋を移せる。人物に極めつけに奇妙な環境を横切らせれば、劇を際限なく変えられる。無論、そのようなことができるという点こそ、このやり方への批判になる。だがいまは批判ではなく、ある派の理論を分析し、述べ、むしろいちばん好意的な角度から示したい。この派が何より求めるのは、観客に生命の強烈な感覚を与えるため、場面を正確にすることだ。そこで演出が現れ、その法則がこの派の要求に限界を設ける。だから残る問題は、演出が自然主義のあらゆる要求をどこまで受け入れられるかである。ごく簡潔に論じよう。この本の最後の章まで来た読者は、検討すべき主な点について、すでに自分で判断できるからだ。"
  "translation_status": "reviewed"
  "annotations":
  - "side": "source"
    "kind": "emphasis"
    "span":
      "start": 807
      "end": 817
      "exact": "Andromaque"
- "id": "becq-0416"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, en abordant la scène, l'école naturaliste rencontrera, sans pouvoir la résoudre, une double difficulté dramatique et théâtrale, qui ne dérive nullement de lois arbitraires ou de théories plus où moins contestables, comme celle des trois unités, mais qui tient uniquement à la structure de l'esprit et de l'oeil du spectateur. Cette difficulté consiste, au point de vue dramatique, dans la juxtaposition, incohérente pour l'esprit, de l'idéal et du réel, et, au point de vue théâtral, dans la juxtaposition incohérente pour l'oeil, du vrai et du faux. Ainsi, d'une part, toute représentation idéale détruira l'impression très vive que nous aurait causée la présentation du réel, ou réciproquement l'effet de la première sera détruit par celui que produira la seconde; d'autre part, toute opposition entre la réalité et la perspective théâtrale, qui met en présence le vrai et le faux, anéantira immédiatement l'illusion et réduira le réel à l'imaginaire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 416
    "line_start": 6339
    "line_end": 6352
  "translation_ja": "だが舞台に取り組むと、自然主義派は、劇作と上演の二つの難題に出会い、解けないだろう。それらは三一致のような、勝手な規則や多少なりとも疑わしい理論から来るのではない。観客の心と目の仕組みだけから来る。劇作から見れば、理想と現実を並べることは精神にとってつじつまが合わない。上演から見れば、本物と偽物を並べることは目にとってつじつまが合わない。一方、どんな理想上の表象も、現実そのものを提示して本来得られるはずの強い印象を壊すか、逆に、現実の提示の効果が、理想上の表象の効果を壊す。他方、現実と舞台の遠近法が対立し、本物と偽物が向き合えば、すぐに錯覚が消え、現実さえ想像上のことになってしまう。"
  "translation_status": "reviewed"
- "id": "becq-0417"
  "section_id": "ch40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On peut aisément fournir des exemples qui mettront en relief cette double contradiction. Dans la Charbonnière, un tableau représentait une salle d'hôpital. L'aspect de cette salle nue, blanchie à la chaux, que garnissaient deux rangées de lits entourés de leurs rideaux blancs, était d'un réalisme vraiment saisissant. Au pied du premier lit, à droite, une soeur, veillait; dans le lit était étendue une moribonde, dont le visage à demi fracassé était recouvert d'un voile de gaze. Le tableau, dans sa simplicité tragique, causait une double impression de pitié et de terreur; et cette impression ne se fût pas effacée si le drame n'eût amené dans ce tableau une représentation de la mort et ensuite une représentation de la folie. Ces deux représentations ne peuvent jamais être qu'idéales, c'est-à-dire conçues et rendues idéalement par la réduction forcée du temps nécessaire à la succession des phénomènes morbides, par la prédominance des effets généraux et par l'effacement des traits particuliers. Or, dès que l'idéal surgissait au milieu du réel, l'impression première se dissipait immédiatement, et l'esprit du spectateur, débarrassé de toute angoisse, s'intéressait à l'imitation artistique de la mort et de la folie. Dans ce tableau, la mort et la folie étaient, contre le voeu de l'auteur moins poignantes que le décor; et par conséquent la réalité tragique de celui-ci avait détruit d'avance l'effet que l'auteur devait attendre de ce double dénouement. En outre, la recherche de l'impression réelle avait d'avance annihilé tout l'effort artistique des comédiens. La juxtaposition de la réalité empêche donc l'illusion de se produire au même degré que si le dénouement se profilait sur un décor de carton. L'idée de juxtaposer l'art et la réalité est contradictoire et constitue pour l'école naturaliste un obstacle insurmontable. Celle-ci doit donc, si elle veut rester fidèle à ses théories, ne jamais introduire de représentation idéale au milieu de tableaux fondés sur la présentation du réel. Par conséquent, l'école est condamnée à n'introduire dans ses tableaux qu'un minimum d'action dramatique, et c'est à cela, en effet, qu'elle tend de plus en plus. Les pièces tournent chaque jour davantage à des exhibitions de tableaux vivants et animés, art inférieur, sensualiste et matérialiste, mais surtout très borné et qui ne peut fournir une longue carrière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 417
    "line_start": 6354
    "line_end": 6388
  "translation_ja": "この二重の矛盾を浮き彫りにする例は、たやすく挙げられる。『石炭屋の女』の一場面は、病院の病室を表した。石灰で白く塗られたがらんとした部屋に、白いカーテンで囲んだ寝台が二列に並び、実に息をのむほど写実的だった。右の最初の寝台の足もとでは、修道女一人が見守る。寝台には瀕死の女が横たわり、なかばつぶれた顔は薄いガーゼで覆われていた。悲劇的なほど簡素な光景は、哀れみと恐れを同時に呼んだ。そこへ劇が死の表象を、さらに狂気の表象を持ち込まなければ、その印象は消えなかっただろう。病の現象が続くのに必要な時間を強いて縮め、全体の効果を優先し、個別の特徴を消す以上、この二つは観念の上で構想し、舞台で表すほかない。ところが現実のただ中に理想が現れた途端、初めの印象はすぐに散り、観客は不安から解かれ、死と狂気を芸術としてまねることに興味を持った。この場面では、作者の願いに反し、死と狂気が装置ほど胸に迫らない。だから装置の悲劇的な現実性が、この二重の結末に作者が期待した効果を、先に壊していたわけだ。それだけではない。本物らしい印象を求めたため、俳優たちの芸術上の努力も初めから無に帰した。こうして現実を並べることは、厚紙の装置を背景に結末が浮かんだ場合ほど強い錯覚を妨げる。芸術と現実を並べようという考えは矛盾しており、自然主義派に越えられない障害となる。ならば自らの理論に忠実でいたいこの派は、現実の提示によって成り立つ場面の中に、理想上の表象を決して入れてはならない。するとこの派は、場面にごくわずかの筋しか入れられない。実際、ますますその方向へ進んでいる。芝居は日を追って、生きて動く絵を陳列するものになってゆく。低い、感覚に頼る、物質に偏った、何より限りがあり、長くは続きえない芸術である。"
  "translation_status": "reviewed"

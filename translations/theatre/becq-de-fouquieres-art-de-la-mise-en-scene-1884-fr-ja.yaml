- "id": "becq-0035"
  "section_id": "ch02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce n'est pas, en résumé, dans l'effet représentatif d'une oeuvre dramatique qu'il faut chercher la raison supérieure de l'appréciation qu'en a portée la postérité. Ce n'est donc pas en augmentant, par la mise en scène, l'effet représentatif d'une oeuvre dramatique que l'on ajoute à sa valeur intrinsèque."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg12489"
    "precision": "line"
    "source_sequence": 35
    "line_start": 395
    "line_end": 399
  "translation_ja": "要するに、後世が一つの戯曲に下した評価の根本の理由を、上演効果のうちに求めてはならない。だから、演出によって上演の効果を高めたからといって、戯曲そのものの価値を増したことにはならない。"
  "translation_status": "reviewed"

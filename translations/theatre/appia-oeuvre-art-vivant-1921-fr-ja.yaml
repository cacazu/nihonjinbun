    "printed_page_end": "48"
  "translation_ja": "ここで、どうしても避けて通れない、犠牲と埋め合わせの原理に話が及ぶ。自分の作品が動かないことから画家が得る大きな利点は、すでに見た。だが、動くことが舞台芸術と演劇に何を犠牲にさせ、それを何が埋め合わせるかは、まだ見ていない。まず犠牲から始めよう。第一に、画家や彫刻家のように、特別な一瞬、えり抜きの一瞬を選ぶことは、もはや問題にならない。動きは連続であり、どの連なりにするかは選べても、ある一点でそれを止めることはできない。（活人画については23頁参照。）画家は、選び取った身ぶりの前後の脈絡を、ある一瞬に封じ込める。一方、連なる動きを中断すれば、止まった姿勢は確かに直前の動きの結果であり、次の動きの準備にもなっているが、二つを秘めているだけだ。画家にできるように、それを実際に表してはいない。この中断は恣意的で、そこで得られた形は偶然のものである。そのため動きは、一瞬、芸術の領域から出てしまう。ところが絵画を完成させ、完全なものにするのは、まさに動かないという原理だ。だから生きた芸術はその完全さをあきらめねばならず、とりわけ色彩については、その犠牲が身にしみる。もし動きが機械的になれば、表現の要素を細かく固定して、完全さに近いものを望むことも、ぎりぎり想像はできる。ただし、そのとき犠牲にするのは芸術そのものであり、何を得ても取り戻せない。にもかかわらず、私たちと同じ道をたどって、関節のある操り人形に行き着き、これを取り入れた偉大な芸術家もいる。画家がアトリエでそうするように、舞台の前にただ一人でいたいという欲求が勝ったのだ。無理もないのかもしれない。だが身体をもって生きる人間が、機械仕掛けの演劇でいつまでも満足するなど、どうして考えられよう。劇場ですでに受け身になっている私たちに、いっそう受け身であれと求めることにはならないか。それとも、この芸術家たちは、観客の私たちが登場人物に絶えず生命を吹き込むことを求めるのか。だが、そんな営みは、どんな芸術作品も私たちに求める営みとは似ても似つかない。演劇は何よりも生命の芸術であり、私たちがまとめ上げるべきなのは、出発点として差し出された、その生命の表現なのだから。"
  "translation_status": "reviewed"
- "id": "appia-0112"
  "section_id": "color"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est salutaire de toucher à cet extrême d’une logique décevante entre toutes, et d’en respirer les miasmes destructeurs. L’on n’en aspire ensuite que plus largement l’atmosphère tonique de l’art, et l’on se soumet, désormais, mais en connaissance de cause, à sa discipline austère. En art, la logique c’est la vie (et non pas l’inverse). Nous pouvons pressentir la vie, suffisamment pour l’évoquer. Jamais nous ne pourrons la comprendre. Et si l’artiste de génie se trouve devant son œuvre achevée comme devant un mystère —, un mystère pour l’artiste créateur, — c’est qu’il nous a donné, sans le savoir, l’explication de la vie en un symbole ; et il le sent; il arrive jusqu’à le savoir; — et nous aussi ! — Un art mécanisé serait pareil à l’automobile qui met à notre disposition l’espace et le temps sans nous en donner l’expression. L’artiste, en nous offrant un symbole seulement, nous persuade à la fois de notre puissance mystérieuse et de nos limitations : il modifie notre désir passionné de connaître, et crée, par là, l’œuvre d’art dont l’existence vient transfigurer les murailles qui nous enserrent. Il ne nie pas la présence de ces murailles, mais il la rend diaphane: avec lui nous touchons bien l’obstacle, mais nous le pénétrons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 54
    "pdf_page_end": 55
    "printed_page": "48"
    "printed_page_end": "49"
  "translation_ja": "これほど期待を裏切る論理を突きつめ、その人を損なう瘴気を吸ってみるのも、ためにはなる。そのあと私たちは、芸術の生気ある大気をいっそう胸いっぱいに吸い、何に従うのかをわかったうえで、厳しいきまりに従うからだ。芸術では生命こそが論理である。その逆ではない。私たちは生命を、呼び起こせる程度には予感できる。だが生命を理解することは決してできない。天才的な芸術家が、仕上げた自らの作品を前にして、作った本人にも解けない謎に直面するのは、知らないうちに一つの象徴に生命の説明を託して私たちに渡していたからである。芸術家はそれを感じ、ついには知る。私たちも同じだ。機械仕掛けの芸術とは、自動車が空間と時間を私たちの自由にしてくれながら、その表現は与えてくれないようなものである。芸術家は、ただ一つの象徴を示すことで、私たちに備わる不思議な力と、私たちの限界の両方を納得させる。知ろうとする切実な欲求を変え、そのことによって、私たちを取り囲む壁の姿を一変させる芸術作品を作る。壁があることを否定するのではなく、壁を透き通らせる。その芸術家とともにあるとき、障害には確かに触れるが、それを通して向こうへ入れるのだ。"
  "translation_status": "reviewed"
- "id": "appia-0113"

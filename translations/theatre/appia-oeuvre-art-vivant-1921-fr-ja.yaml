    "printed_page": "44"
    "printed_page_end": "45"
  "translation_ja": "ここまで好意をもって読み進めてくれた方なら、私がしだいに、語られる台本より音楽を先に立たせていることに気づいたはずだ。驚いたり、不服だったりするかもしれない。だが明瞭に説明するため、いましばらくこの無理を通しているように見えるやり方を続け、その理由は間もなく明かすことにしたい。ひとまず音楽だけを考え、次の順序をもう一度確かめよう。音楽はそのさまざまな持続の連なりを身体の動きに課す。すると身体はそれを空間の比率へ伝える。生命のない形は、硬さで身体に対抗して、自らの固有の存在を示す。この抵抗がなければ、それをあれほどはっきりとは示せなかっただろう。こうして循環は閉じる。その先には何もないからだ。この序列において、私たち自身の手にあるのは音楽の台本、すなわち楽譜だけである。それより先は生きた身体を通じて、すべて自ずと展開する。"

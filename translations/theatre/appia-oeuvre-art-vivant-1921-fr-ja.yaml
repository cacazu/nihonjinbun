  "source_text": "La technique de l’art vivant, c’est justement ce pauvre spectateur qui la conditionne; sans lui, pas de technique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 94
    "printed_page": "88"
  "translation_ja": "生きた芸術の技術を成り立たせるのは、ほかならぬこの気の毒な観客である。その人なしに技術はない。"
  "translation_status": "reviewed"
- "id": "appia-0176"
  "section_id": "collaboration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et si l’auteur s’est vu, ici, obligé de commencer par la fin, et d’analyser les moyens, pour en arriver à découvrir leur producteur et constructeur initial, c’est que nous vivons encore dans le malentendu esthétique résultant d’une fausse hiérarchie, et qu’il craignait d’être peut-être mal compris s’il s’était avisé de présenter, dès l’abord, ce grand Inconnu... Maintenant, forts de sa connaissance, nous pouvons rebrousser chemin pour gagner une vue d’ensemble; car il semble qu’aucun malentendu ne soit possible encore."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 94
    "printed_page": "88"
  "translation_ja": "著者はここで、終わりのほうから始め、手段を一つ一つ調べて、その最初の作り手、組み立て手を見つけねばならなかった。それは、誤った序列から生まれた美をめぐる誤解のうちに、私たちがなお生きているからだ。初めからこの大いなる未知の者を示せば、誤解されるかもしれないと恐れたのである。いまはこの者を知っているのだから、来た道を引き返し、全体を見渡すことができる。もう誤解が生じる余地はなさそうだ。"
  "translation_status": "reviewed"
- "id": "appia-0177"
  "section_id": "collaboration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Par ce rapide coup d’œil rétrospectif, l’auteur cherchera à répondre à la question que sans doute le lecteur lui pose depuis longtemps: Comment faire ? Comment mettre en œuvre ? Comment en venir au fait et au prendre ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 94
    "printed_page": "88"
  "translation_ja": "こうして手短に振り返りながら、著者は、きっと読者がずっと前から問いかけていることに答えようと思う。どうすればよいのか。どう実現するのか。どう本題へ進み、実際に取りかかればよいのか。"
  "translation_status": "reviewed"
- "id": "appia-0178"
  "section_id": "unknown"
  "kind": "heading"
  "origin": "source"
  "source_text": "Le grand Inconnu et l’expérience de la beauté."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 95
    "printed_page": "89"
  "translation_ja": "大いなる未知と美の経験。"
  "translation_status": "reviewed"
- "id": "appia-0179"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A une époque où, dans tous les domaines du savoir, nous cherchons à nous mieux connaître, comment ne pas être frappé de l’ignorance où nous sommes encore de notre propre corps, de notre organisme entier, au point de vue esthétique ? Le développement magnifique des sports, de l’hygiène générale, nous a donné le goût du mouvement, du grand air, de la lumière; avec la santé, la beauté physique s’en est certainement accrue, et la force corporelle lui donne des airs de liberté que l’on ne peut méconnaître, et qui touchent même parfois à une indifférence un peu insolente ou inhumaine. Le corps recommence à exister pour nos yeux; nous ne le couvrons plus nécessairement, nous l’habillons seulement; et, si bien des préjugés restent encore tenaces et se manifestent de façon toujours regrettable, en mettant en suspicion le corps dévêtu, ou bien en conservant des coutumes d’habillements que nous nous croyons imposées par la bonne éducation, la situation sociale, la vie de bureau ou la vie mondaine, etc., il n’en reste pas moins qu’un bourgeois d’il y a cinquante ans serait fort surpris de notre désinvolture à cet égard. Nous sentons notre corps sous nos vêtements; et, quand nous nous dévêtons, nous sentons l’anomalie qu’il y a à considérer comme une précaution de moralité (en ce sens notre moralité est toujours sexuelle) ce que notre climat seul nous impose."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 95
    "printed_page": "89"
  "translation_ja": "あらゆる知の分野で自分たちをもっとよく知ろうとしている時代に、私たちはなお、美の観点から見ると、自分の身体、自分という有機体全体のことをあまりにも知らない。それに驚かずにいられるだろうか。スポーツと一般の衛生がめざましく発達して、私たちは身体を動かし、戸外の空気や光を楽しむようになった。健康とともに身体の美しさは確かに増した。身体の力強さから、隠しようのない自由さも出てきた。ときにそれは、少し人を見下した、あるいは人間味のない無関心にまで近づくほどである。身体は再び私たちの目に存在するようになった。必ず覆い隠すのではなく、ただ服を着せるだけだ。裸の身体をいかがわしいものと見たり、しつけや社会的地位、職場や社交上の生活などが押しつけるのだと思い込んだ服装の習慣を守ったりする偏見は、今でも根強く、困った形で現れる。それでも、五十年前のブルジョワなら、そのことについて私たちがあまり気にしないのを見て、たいそう驚くだろう。私たちは服の下の身体を感じている。服を脱いだとき、この気候のためにこそ服が必要なだけなのに、道徳を守る用心と考えるのは変だと感じる。その意味では、私たちの道徳はいつも性をめぐる道徳なのだ。"
  "translation_status": "reviewed"
- "id": "appia-0180"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De tout ceci il résulte que la beauté du corps humain tend à rentrer dans nos mœurs. Hypocritement, nous la reléguions dans nos musées ou dans les ateliers d’artistes, avec un soupir de tolérance et d’embarras, mais rassurés, cependant; ces corps ne bougeaient pas et ne bougeraient pas; l’art les immobilise, et, en ce sens du moins, ils étaient de tout repos; la morale et la censure publiques pouvaient veiller sur eux. Mais s’ils avaient bougé, s’ils bougeaient, seraient-ils de marbre, ou bien dessinés et peints ? Non ! ils seraient de belle chair vivante et c’est cela, paraît-il, que nous ne voulons pas. Le malaise et la curiosité que nous inspire un musée de cire ne vient-il pas de ce que le corps y est représenté presque jusqu’au mouvement, et souvent même au delà ? Et que pour rendre ce mouvement plausible il a fallu imiter ce corps jusqu’au trompe-l’œil. D’autre part, des acrobates qui s’immobilisent en groupes dits « plastiques » ne recouvrent-ils pas leurs corps d’une couleur uniforme, blanche à l’ordinaire, pour simuler la matière inanimée et, par conséquent, se rendre inoffensifs «moralement»...? Et, quand sous nos yeux, ils changent leurs attitudes, pour les immobiliser de nouveau et différemment, l’instant où ils agissent — celui de leur mouvement — n’est-il pas énigmatique et troublant ? Car pourquoi se couvrir de couleur si l’on bouge ? Du reste, autant l’immobilité du corps vivant est un non-sens esthétique, qu’aucun vernis ne peut justifier, autant le mouvement d’un corps verni est une chose repoussante, puisqu’il anime une forme que l’on veut présenter comme inanimée. L’un comme l’autre sont profondément immoraux, puisqu’ils faussent notre goût esthétique en se servant pour cela de ce qui devrait en être l’objet le plus sacré."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 96
    "printed_page": "90"
  "translation_ja": "こうした事情から、人間の身体の美は、私たちの暮らしの習慣に戻りつつある。私たちは偽善的にもこの美を美術館や芸術家のアトリエに追いやり、許してやるという気持ちといたたまれなさをため息に混ぜながら、それでも安心していた。そこにある身体はじっとしていて、動き出すことはない。芸術が動かなくするのだから、少なくともその点では安心できた。世間の道徳と検閲の目を光らせておけたのである。だがもし動いていたなら、いま動いていたなら、果たして大理石だったろうか、描かれたり塗られたりしたものだったろうか。そうではない。美しい生きた肉体だったろう。どうやら私たちが望まないのは、そのことらしい。蝋人形館にいたたまれなさや好奇心を感じるのは、そこで身体が、今にも動くと思われるほど、時にはそれ以上に、そっくり表されるためではないか。その動きをもっともらしく見せるために、目をだませるほど身体をまねなければならなかったためではないか。一方、「造形的」と称する集団で動きを止める曲芸師たちは、生命のない材料を装い、その結果「道徳上」無害なものになるために、ふつうは白一色で身体を覆うではないか。そして目の前で別の姿勢に変えてまた止まるとき、実際に動くその一瞬は、謎めいて、心を乱すものではないか。動くのならどうして色を塗るのだろう。生きた身体が動かないことは、美の上で意味をなさず、どんな上塗りもそれを正当化できない。それと同じほど、塗られた身体が動くことは目を背けたくなるものだ。生命がないように見せたい形に、生命を与えることになるからである。どちらも、美の好みのもっとも神聖な対象であるべきものを使って、その好みをゆがめるのだから、深く道徳に背いている。"
  "translation_status": "reviewed"
- "id": "appia-0181"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour la grande majorité, la beauté corporelle — et par conséquent le corps nu — n’est tolérable qu’en art; par quoi l’on entend inanimée et transfigurée par la synthèse. Et pour ce qui est de la « moralité » sexuelle, nous tolérons en art, les scènes les plus manifestement lascives; les uns parce qu’elles subviennent à la pauvreté de notre vie publique sur ce point pourtant essentiel, les autres pour ne pas risquer d’être accusés de ne rien comprendre aux beaux-arts."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 96
    "pdf_page_end": 97
    "printed_page": "90"
    "printed_page_end": "91"
  "translation_ja": "大多数の人にとって、身体の美、したがって裸の身体が許されるのは、芸術においてだけだ。ここで言うのは、生命をなくし、諸要素を総合することで姿を変えた美である。そして性にまつわる「道徳」について言えば、芸術では、あからさまにみだらな光景さえ許す。ある人々は、これほど大事なことなのに、私たちの公の生活が貧しいので、その埋め合わせになるからだと思う。別の人々は、美術が何一つわからないと非難されるおそれを避けたいのである。"
  "translation_status": "reviewed"
- "id": "appia-0182"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Notre pudeur vient de l’embarras que nous éprouvons à montrer notre propre corps, et de ce que nous éprouvons le même genre de trouble devant d’autres corps nus, parce que nous savons parfaitement que ces corps sont nous-même. Si nous conservons ce sentiment de gêne — pour ne pas dire plus — nous devons renoncer dès l’abord à l’art vivant, car cet art vit du sentiment de la collectivité des corps vivants et du bonheur que nous procure cette collectivité. Nous devons, ensuite, renoncer à toute espèce de pureté et d’ingénuité dans notre sentiment artistique en général, l’art, quel et comme qu’il soit, n’étant que l’expression de nous-même. Il n’y a pas de transigeance possible, et toute l’histoire de l’art en témoigne pour notre plus profonde confusion. Etre artiste, c’est premièrement n’avoir pas honte de son corps, mais l’aimer dans tous les corps, le sien compris. Si j’ai dit que l’art vivant nous apprendra que nous sommes des artistes, c’est que l’art vivant nous inspire l’amour et le respect — pas d’amour sans respect — pour notre propre corps, et cela en un sentiment collectif: l’artiste-créateur de l’art vivant, voit dans tous les corps son propre corps; il sent dans tous les mouvements des autres corps les mouvements du sien; il vit, ainsi, corporellement, dans l’humanité; il en est l’expression; l’humanité est la sienne; et cela non plus en symboles écrits, parlés, peints ou sculptés, mais dans le grand symbole vivant du corps vivant, librement animé."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 97
    "printed_page": "91"
  "translation_ja": "私たちが恥じらうのは、自分の身体を見せるときに戸惑い、ほかの人の裸の身体にも同じように心が乱れるからだ。そうした身体が自分自身でもあることを、よく知っているためである。この居心地の悪さ、それ以上は言わずにおくが、この気持ちを捨てなければ、最初から生きた芸術をあきらめるべきだ。生きた芸術を生かすのは、生きた身体の集まりを感じることと、その集まりに加わる幸福だからである。そのうえ、芸術を感じる心が、どんな意味でも純粋で素直であることを、あきらめなければならない。芸術とはどんな種類、どんな形であれ、自分自身を表すものでしかないからだ。折り合いはつかない。芸術の歴史全体がそれを証し立て、私たちを深く恥じ入らせる。芸術家であるとは、まず自分の身体を恥じず、自分のものを含むあらゆる身体の中で、その身体を愛することだ。生きた芸術が、私たちは芸術家であると教えてくれる、と言ったのは、生きた芸術が、自分の身体に愛と敬意を抱かせる、それも皆の感情として抱かせるからだ。敬意のないところに愛はない。生きた芸術を創る芸術家は、どの身体にも自分の身体を見る。ほかの人の身ぶりのすべてに、自分の身体の動きを感じる。こうして身体をもって人類の中で生き、人類を表すものとなり、人類を自分のものとする。それはもはや、書かれたり語られたり、描かれたり彫られたりした象徴によるのではない。自由に動く、生きた身体という偉大な、生きた象徴によるのである。"
  "translation_status": "reviewed"
- "id": "appia-0183"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Après une bonne hygiène et la part des sports qui lui est compatible, l’éducation esthétique du corps est, nous l’avons vu, le premier degré à franchir; sa maîtrise, proportionnée aux moyens individuels, le premier grade à obtenir. D’une juste pédagogie corporelle dépend l’avenir de toute notre culture artistique et, il va de soi, l’existence même de l’art vivant. Son importance n’est pas calculable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 98
    "printed_page": "92"
  "translation_ja": "適切に健康を保ち、それと両立する範囲でスポーツをしたうえで、身体に美を学ばせることが、すでに見たように、最初に上らねばならない段である。それを各自の力に応じて身につけることが、最初に達すべき水準である。私たちの芸術文化のすべての将来と、言うまでもなく生きた芸術そのものの存否が、正しい身体教育にかかっている。その大切さは測り知れない。"
  "translation_status": "reviewed"
- "id": "appia-0184"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et n’oublions pas, ici surtout, la responsabilité sérieuse, presque solennelle, qui incombe à tous ceux qui sont à même d’obtenir ce grade, puisqu’ils n’auront jamais assez de toute la puissance esthétique conquise sur eux-mêmes, pour en transfuser la portion indispensable en ceux qui, d’une façon ou d’une autre, sont moins privilégiés. Le socialisme esthétique est encore inconnu. Nous croyons faire acte d’humanité en plaçant l’œuvre d’art à la portée de tout le monde (selon le terme hypocritement convenu). Il est même des artistes qui conçoivent et exécutent leurs œuvres dans ce but, et qui s’en veulent du bien. Un gâteau n’est pas davantage à la portée du pauvre si l’on y met moins de beurre et de sucre. L’idée même de mettre un gâteau à la portée du pauvre est dépourvue de sens. C’est nous — nous-même — que nous devons mettre, non pas à sa portée, mais lui donner; et quand je dis nous, je n’entends certes pas nos œuvres, mais bien notre personne intégrale, le corps compris; et quand je dis corps, je ne dis pas seulement nos bras pour partager son travail ou secourir sa faiblesse, mais notre corps tout entier. Or nous ne le pouvons qu’en nous reconnaissant dans son corps à lui ; et lui ne sentira notre don que s’il se reconnaît dans le nôtre. En art nous n’avons rien d’autre à lui apporter. Ce geste est le point de départ. L’art vivant dépend de ce geste. Ce ne sont pas des fruits gonflés d’une sève qui n’est pas la sienne, mûris sous un soleil qui n’est pas son soleil, que le déshérité pourra jamais s’assimiler. Nous n’avons pas, non plus, à l’attirer à nous; il n’a pas à nous attirer à lui. Nous devons nous reconnaître mutuellement. Le rayon de lumière qui permettra cette pénétration divine doit trouver une atmosphère où il puisse se répandre en une clarté constante. Du point de vue esthétique, cette atmosphère, c’est notre corps, mis en une commune possession pour un but artistique défini. Les habitants de Tahiti ne concevaient l’amitié ou l’amour, que si deux êtres avaient eu peur ensemble. Leur vie était si calme qu’une impression très vive, ressentie en commun, était nécessaire pour unir leurs âmes. Dans notre vie — nivelée et monotone au point que les pires bouleversements, les plus cruelles souffrances ne suffisent pas à secouer notre torpeur sociale, à éclairer nos égoïsmes accumulés, notre dilettantisme barbare, — la joie indicible de l’art ressenti en commun veut consacrer notre union fraternelle. Or, ressentir en commun ne signifie pas avoir ensemble le même plaisir, comme dans une salle de concert ou de spectacle, mais être animé dans son être intégral — son corps autant que son âme — de la même flamme vivante, vivante donc active; d’avoir «eu peur ensemble» sous l’étreinte toute puissante de la beauté, et d’en avoir accepté, ensemble, l’impulsion créatrice et ses responsabilités."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 98
    "pdf_page_end": 99
    "printed_page": "92"
    "printed_page_end": "93"
  "translation_ja": "とりわけここで忘れてはならないのは、その水準に達しうるすべての人に、深刻な、ほとんど厳粛な責任があることだ。何らかの形で機会に恵まれない人に、欠かせないものを分け渡すには、自分自身のうちに獲得した美を表す力はいくらあっても足りない。美の領域での社会主義は、まだ知られていない。芸術作品を誰でも手の届くところに置けば、情け深い行いをしたと思っている。これが私たちの偽善的な決まり文句だ。実際、この目的で作品を構想し、作り、自分はよいことをしたと思う芸術家さえいる。バターと砂糖を減らしても、貧しい人にとって菓子が買いやすくなるわけではない。手が届くように菓子を置くという考え自体、意味がない。手の届くところに置くのではなく、手渡すべきものはほかならぬ私たち自身だ。私たちというのは、作品ではない。身体も含めた私たちという人間のすべてのことだ。身体というとき、その人の仕事を分けもつ腕や、弱っていれば助ける腕に限らず、身体全体のことを言っている。ところが自分を渡すには、相手の身体に自分を認めなければならない。そして相手がその贈り物を感じるのも、こちらの身体に自分を認めるときだけである。芸術において、私たちが相手に届けられるのはそれだけだ。それが出発点であり、生きた芸術はその身ぶりにかかっている。自分のものでない樹液でふくらみ、自分のものでない太陽の下で熟れた果実は、恵まれない者が自分の身にすることなどできない。私たちがその人をこちらへ引き寄せることも、その人が私たちを向こうへ引き寄せることもない。互いに、相手の中に自分を認めなければならない。この神々しい浸透を可能にする一条の光には、絶えず明るく広がってゆける空気がいる。美の観点から言えばその空気とは、一つのはっきりした芸術上の目的のために、皆のものとなった私たちの身体だ。タヒチの人々は、二人が一緒に恐れを味わったのでなければ、友情も愛も考えられなかったという。暮らしがあまりに穏やかなので、心を結びつけるには、強い印象を一緒に感じることが必要だった。私たちの生活はすっかり平板で単調になり、どんなにひどい動乱も残酷な苦しみも、社会の無気力を揺さぶらず、積み重なった利己心や乱暴な道楽ぶりを照らし出さないほどだ。そのなかで、皆で感じる芸術の言葉にしがたい歓びが、同胞としての結びつきを確かなものにしようとする。皆で感じるとは、演奏会や劇場の客席で同じ楽しみを味わうことではない。身体も心も含めた自分の全体が、同じ生きた、つまり働く火に動かされることだ。美の圧倒的な力に抱かれて「一緒に恐れ」、美が創造へと駆り立てる力と、そこから生まれる責任とを、ともに引き受けることである。"
  "translation_status": "reviewed"

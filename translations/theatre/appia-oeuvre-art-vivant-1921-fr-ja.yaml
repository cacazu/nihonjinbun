  "origin": "source"
  "source_text": "Le lecteur bienveillant qui m’aura suivi jusqu’ici, s’aperçoit sans doute que je laisse prendre, peu à peu, à la musique le pas sur le texte parlé, et, peut-être, il s’en étonne, ou s’en formalise. Pour la clarté de l’exposé je dois cependant continuer encore cette violence apparente, et me réserver d’en expliquer bientôt les motifs. Ne considérons donc, pour le moment, que la musique, et établissons une fois de plus la hiérarchie suivante: La musique impose aux mouvements du corps ses durées successives; ce corps les transmet alors aux proportions de l’espace; et les formes inanimées, en opposant au corps leur rigidité, affirment leur existence personnelle, — que, sans cette résistance, elles n’auraient pu manifester aussi clairement, — et ferment ainsi le cycle; car il n’est rien au delà. Dans cette hiérarchie nous possédons le texte musical seul; au delà duquel tout le reste suit automatiquement par le moyen du corps vivant."
  "source_languages":
  - "fr"
  "source_locations":

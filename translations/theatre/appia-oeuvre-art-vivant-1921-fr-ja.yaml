  "source_text": "Robinson Crusoë a dû chercher des mots dans sa mémoire, et tenter avec eux de reconstituer telle ou telle pièce lue jadis. La solitude le portant à s’oublier lui-même, il accompagnait, peu à peu, ces mots d’un geste, d’une mimique spontanée; quand sa mémoire faiblissait, le geste devenait plus insistant, pour remplacer le mot. Bientôt la joie de la fiction vécue s’emparait du pauvre solitaire: il vivait la pièce, il ne la récitait plus; et il s’éloignait toujours davantage des bibliothèques du continent. Et, le lendemain, en chassant ou en labourant, la vue de ses mains, de son corps, le remplissait d’émotion: ce corps n’avait-il pas contenu l’âme d’Othello par exemple, et n’avait-il pas fait rayonner cette âme dans l’espace; ses yeux n’avaient-ils pas vu Desdémone et n’avaient-ils pas pleuré sur son cœur innocent ? Le mot ! Ah ! il allait en avoir, il allait en forger, des mots, pour ce corps ! Et voilà le poète dramatique qui naît en Crusoë par la vue de son propre corps. « Tu veux des mots », lui dit-il, « tu en auras, et chaque fois différents s’il le faut; tu seras riche en mots, et tu lanceras royalement ta richesse vers le ciel; car il y en aura toujours, des mots, pour toi le corps unique ! Ils sont ta monnaie et tes serviteurs; tu leur dis: Venez! ils viennent; tu les chasses; ils s’enfuient; et toi, Toi, tu restes, toujours riche et comblé, débordant d’une vie que les mots ne savent pas ! Tu es ma bibliothèque, désormais, ma symphonie, mon poème et ma fresque: je possède l’art en toi ! Je suis l’art »."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 74
    "pdf_page_end": 75
    "printed_page": "68"
    "printed_page_end": "69"
  "translation_ja": "ロビンソン・クルーソーは、昔読んだ戯曲を何か再現しようと、記憶の中から言葉を探したに違いない。一人きりで自分を忘れるにつれ、少しずつ、ひとりでに言葉に身ぶりや表情が伴った。思い出せなくなると、言葉の代わりを果たそうと、身ぶりは強くなった。想像の出来事を生きる喜びに、この気の毒な孤独な男はすぐにとらわれた。芝居を生きており、もう暗唱するのではなかった。そして大陸の書棚からはますます遠ざかった。翌日、狩りをし、あるいは畑を耕しているときに、自分の手と身体を見て胸がいっぱいになった。たとえば、この身体はオセローの魂を宿し、その魂を空間に輝かせたのではなかったか。この目はデズデモーナを見て、その無垢な心に涙を流したのではなかったか。言葉だって！　この身体のためなら、言葉を持てる。自分で作りさえするだろう。こうしてクルーソーが自分の身体を見て、その内に劇作家が生まれる。「お前は言葉が欲しいのだね。ならば手に入る。必要ならそのたびに別の言葉にしよう。言葉をいくらでも持てるようになり、その富を王のように気前よく空に放てるだろう。たった一つの身体であるお前のためなら、いくらでも言葉はあるからだ。言葉はお前の貨幣であり、召使いだ。来いと言えば来る。追い払えば逃げる。それでもお前は、お前だけはそこに留まり、いつも満ち足りて豊かで、言葉の知らぬ生命があふれている！　今からお前は私の書庫、私の交響曲、私の詩、私の壁画だ。お前のうちに私は芸術を持つ！　私が芸術なのだ。」"
  "translation_status": "reviewed"
- "id": "appia-0151"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le théâtre s’est intellectualisé ; le corps n’y est plus que le porteur et représentant d’un texte littéraire, et ne s’adresse à nos yeux qu’en cette qualité; ses gestes et ses évolutions ne sont pas ordonnés par le texte, mais simplement inspirés par lui; l’acteur interprète à son gré ce qu’a écrit l’auteur, et la grande importance de sa personne sur la scène n’est pas technique, mais elle est due, exclusivement, à son interprétation; si bien qu’à l’ordinaire il compose son rôle d’un côté pendant que les décors se brossent de l’autre. Leur réunion est ensuite arbitraire et presque accidentelle. Ce procédé se répète à chaque nouvelle pièce, et son principe reste le même, quelque soin que l’on apporte, d’ailleurs, à la mise en scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 75
    "printed_page": "69"
  "translation_ja": "演劇は知性に偏るようになった。身体はその中で、文学として書かれた台本を担い、伝えるだけになり、その資格でしか私たちの目に語りかけない。身ぶりや動きは、台本に秩序を与えられるのではなく、台本から着想を得るだけだ。俳優は作者が書いたことを自分の思うままに解釈する。舞台上で俳優の人物が非常に大事なのは、技術上の理由からではない。解釈だけによる。だからふつう、俳優が一方で役を作っているあいだ、もう一方で装置が描かれる。あとで両者は、勝手に、ほとんど偶然に結びつけられる。新しい芝居ごとにこれが繰り返され、どれほど演出に力を入れても、やり方の原理は変わらない。"
  "translation_status": "reviewed"
- "id": "appia-0152"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Or, chose caractéristique, tout effort sérieux pour réformer notre théâtre se dirige instinctivement vers la mise en scène. Pour le texte de la pièce, les fluctuations du goût nous procurent du classicisme, du romantisme, du réalisme, etc., qui empiètent les uns sur les autres, se combinent, s’avouent ou se désavouent, et font désespérément appel au décorateur sans en être entendus. Et, malgré tant de variétés, nous restons à la même place. Les minutieuses indications scéniques que l’auteur joint, parfois, au texte de sa pièce, font toujours un effet puéril, tel l’enfant qui veut entrer à tout prix dans son petit paysage de sable et de brindilles; la présence réelle de l’acteur écrase la construction artificielle; leur contact seul est déjà grotesque, puisqu’il souligne l’effort impuissant. Tandis qu’en s’en prenant courageusement et directement à la mise en scène elle-même, l’on est surpris de voir que c’est, alors, au problème dramatique tout entier que l’on s’attaque. En effet, pour quelles pièces déjà existantes voulons-nous réformer la scène ? Quelle sera notre mesure des valeurs ? Nous voulions n’envisager que la scène, et celle-ci se dérobe; à elle seule que serait-elle? Evidemment rien du tout. C’est bien pour avoir voulu en faire quelque chose en elle-même que nous nous sommes éloignés si définitivement de l’Art. Il faudrait donc, dès l’abord, faire table rase; opérer dans notre imagination cette conversion si difficile, qui consiste à ne plus voir nos théâtres, nos scènes, nos salles de spectateurs ; à n’y plus même songer, et à libérer complètement l’idée dramatique de cette norme d’apparence immuable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 76
    "printed_page": "70"
  "translation_ja": "ところが特徴的なのは、演劇を本気で改めようとする努力が、どれも本能的に演出のほうへ向かうことだ。戯曲の台本には、好みの移り変わりによって、古典主義やロマン主義や写実主義が次々に現れる。互いの領分を侵し、結び合い、仲間だと認めたり違うと否定したりし、必死に舞台美術家に訴えるが、聞いてもらえない。これほどさまざまに変化しているのに、私たちは同じ場所にいる。作者がときどき台本に添えるこまごまとした舞台の指示は、何としてでも砂と小枝で作った小さな風景へ入り込もうとする子どものようで、いつも幼稚に見える。俳優がそこに実在するというだけで、作り物の構築物は踏みつぶされる。両者が触れるだけでも滑稽だ。成果のない努力が、いよいよ目立つからだ。それに対し、勇気を出して演出そのものに正面から取り組めば、取り組んでいるのが演劇の問題全体だと知って驚くことになる。実際、私たちは、すでにあるどの戯曲のために舞台を改めようとしているのか。価値を測る尺度は何なのか。舞台だけを見ようとしたのに、舞台は私たちの手をすり抜ける。舞台だけなら何なのか。当然、何でもない。舞台だけで何かになるようにしようとしてきたからこそ、芸術からこれほど決定的に遠ざかったのである。だから最初からすべてを白紙に戻さなければならない。私たちの劇場も舞台も客席も思い浮かべず、思いを向けることさえしないという、想像の上での難しい転換をやり遂げ、変えられないように見えるこの規範から、演劇の考えをまるごと解放するのだ。"
  "translation_status": "reviewed"
- "id": "appia-0153"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J’ai dit salles de spectateurs,... sans doute, pourtant l’art dramatique n’est pas de présenter pour d’autres l’être humain, il est indépendant du spectateur passif, il est vivant ou doit l’être, et la Vie concerne celui qui la vit. Notre premier geste sera de nous placer nous-même, en imagination, dans un espace illimité, et sans autre témoin que justement nous-mêmes, ainsi que le Crusoë de tout à l’heure. Pour fixer des proportions quelconques à cet espace, nous devons marcher, puis nous arrêter, puis marcher de nouveau pour nous arrêter encore. Ces étapes créeront une sorte de rythme qui se répercutera en nous et y éveillera le besoin de posséder l’Espace. Mais il est illimité; le seul point de repère, c’est nous-même. Nous en sommes donc le centre, où que nous nous trouvions. La mesure serait-elle en nous-même ? Serions-nous le créateur de l’Espace ? Et pour qui ? Nous sommes seul. Ce sera donc pour nous seul que nous créerons l’espace, c’est-à-dire des proportions que notre corps pourra mesurer dans l’espace sans limites qui lui échappe."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 76
    "pdf_page_end": 77
    "printed_page": "70"
    "printed_page_end": "71"
  "translation_ja": "私は客席と言った。たしかにそう言ったが、演劇は、他人のために人間を見せることではない。受け身の観客から独立している。演劇は生きているか、生きていなければならず、生命はそれを生きる者に関わる。まずすることは、先ほどのクルーソーのように、自分以外の誰にも見られることなく、果てのない空間に、想像の中で自分を置くことだ。この空間に何らかの比率を定めるには、歩いて止まり、また歩いて、また止まらなければならない。そうした区切りは一種のリズムを生み、内に響いて、空間をわがものにしたいという欲求を呼び覚ます。だがそこに果てはなく、目印になるのは自分しかいない。だからどこにいても、自分がその中心である。尺度は自分の中にあるのだろうか。自分が空間を創るのだろうか。誰のために？　自分一人しかいない。だから自分のためだけに空間を創ることになる。つまり身体では捉えきれない無限の空間の中に、身体で測れる比率を作るのである。"
  "translation_status": "reviewed"
- "id": "appia-0154"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bientôt le rythme caché, dont nous restons jusqu’ici inconscients, se révèle. D’où vient-il ? Il s’affirme, occasionne des réflexes. Sous quelle impulsion ? Notre vie intérieure grandit ; elle nous impose ce geste plutôt qu’un autre, ce pas délibéré plutôt que cette station incertaine, ou bien l’inverse. Et nos yeux s’ouvrent enfin: ils voient le pas, le geste, que nous ne faisons que ressentir; ils les regardent; la main s’est avancée jusqu’ici; le pied s’est posé jusque-là; ce sont deux portions de l’Espace qu’ils ont mesurées. L’ont-ils fait pour les mesurer ? Non. Alors, pourquoi jusque-là et pas plus loin, ou plus près ? Ils ont donc été conduits. Ce n’est pas mécaniquement que nous possédons l’Espace et en sommes le centre: c’est parce que nous sommes vivants; l’Espace est notre vie; notre vie crée l’Espace; notre corps l’exprime. Pour arriver à cette suprême conviction nous avons dû marcher, gesticuler, nous courber et nous redresser, nous coucher et nous relever. Pour arriver d’un point à un autre nous avons fait un effort, si minime fût-il, qui a correspondu aux battements de notre cœur. Les battements de notre cœur ont mesuré nos gestes. Dans l’Espace ? Non pas ! Dans le Temps. Pour mesurer l’Espace notre corps a besoin du Temps ! La durée de nos mouvements a donc mesuré leur étendue. Notre vie crée l’Espace et le Temps, l’un par l’autre. Notre corps vivant est l’Expression de l’Espace pendant le Temps, et du Temps dans l’Espace. L’Espace vide et illimité, où nous nous sommes placés au début pour effectuer la conversion indispensable, n’existe plus. Seuls nous existons."

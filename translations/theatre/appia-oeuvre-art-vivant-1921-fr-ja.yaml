  "source_text": "Supposons un poète — par quoi j’entends un artiste qui pense, sent et voit les choses dans une lumière particulièrement favorable à leur relief, et qui a le don de les exprimer de préférence par la parole (écrite ou non) — et supposons ce poète possédé de l’idée de collaborer à l’art vivant, et à une œuvre représentant cet art. Il sent bien que son choix ne saurait être arbitraire; du reste l’initiation à la vie corporelle artistique lui présente toujours davantage sa vie entière de poète d’une manière plus pure et dépouillée d’alliages superflus; donc plus simple. Les éléments éternels d’humanité tendent à dominer en lui, et de très haut, les contingences où il se complaisait, et que la parole à elle seule exprime supérieurement. Cette parole qui était sa joie et son orgueil ingénu, acquiert une puissance nouvelle qu’il ne s’explique pas encore. Il la possède bien, toujours; il sent, même, qu’il la possède mieux qu’auparavant et qu’il sait la douer de nouveaux accents, — pourtant ces accents lui échappent, comme en un appel vers d’autres accents... Plus maître que jamais de sa vie de poète, de sa richesse intérieure, de la vue claire de ses yeux, il entend les mots lui parler dans un langage nouveau où leur signification s’est agrandie en proportion de la valeur de chaque geste de sa pensée, et qui lui fait éprouver un sentiment de plénitude merveilleux. Analyste puisque poète, il revient à cette fonction, se place devant les mots nouveaux et les interroge. Mais les mots ne lui répondent pas; ils restent vibrants d’une vie mystérieuse, incitateurs de formes inconnues, et semblent demander de lui, avec insistance, quelque nouveau geste, quelque accomplissement suprême de son grand Désir. Il tend les mains pour tout attirer à lui, et les mots s’y refusent. Que faire ? Lentement, solennellement, il écoute, maintenant, leur appel. Il a compris: ses mots l’appellent; ses mains ne doivent plus se tendre pour saisir; elles doivent s’offrir, se donner, et, avec elles, son être tout entier, son être, cette fois-ci, intégral. La conversion est accomplie: le collaborateur est né dans le poète. Son choix est fait; ou plutôt il n’y a plus de choix ! Chacun des gestes de sa pensée, il pourra le donner, s’il le veut, à l’art vivant, au lieu de l’enfermer dans le symbole des mots; car, maintenant, l’expression de sa vie sera la Vie. Et les mots, délivrés, retentiront pour célébrer leur subordination à l’art vivant et lui demander de les animer: le poète les a donnés; de cet art seul il veut les recevoir en retour. Est-ce à dire que le poète n’écrira plus pour être lu, et cessera, par conséquent, d’être un littérateur ? Non, sans doute. Mais, comme les autres artistes qui se trouveront devant l’art vivant, il fera l’expérience d’une mise en place définitive, et telle qu’il n’en avait aucune idée auparavant. Il comprendra combien de notions et de sentiments il confiait aux seuls mots, alors qu’ils appartenaient, de droit, à l’Expression intégrale vivante; et, inversement, à combien d’objets dignes de son attention poétique il refusait l’expression littéraire, absorbé qu’il était par ceux dont les mots n’épuisent pourtant pas le sujet. Les autres arts l’avaient toujours sollicité; forcément, il les transposait un peu dans le sien, et en éprouvait une satisfaction mêlée d’embarras. Ce ne lui sera plus possible, maintenant; là où le peintre, le sculpteur, etc... lui sembleront incliner hors de leur cadre respectif, l’art vivant se dressera devant le poète pour lui dire : « Conduis-les-moi. » Dans tous les domaines de l’art, l’art vivant lui servira de régulateur, révélant les abus, pacifiant les rébellions; car, avec lui, l’anarchie n’est plus possible. Et, dans cette action libératrice, le poète joue un rôle prépondérant, de concert avec le musicien."

  "source_text": "Revenons à la musique. Les sons n’ont pas de signification qui puisse les ordonner; leur groupement est une opération spontanée de la sensibilité même du musicien. Leur notation abstraite sur les feuillets de la partition ne nous transmet pas la signification des sons, mais simplement leur ordonnance, mathématiquement fixée dans leur durée et leur intensité; et cette durée dépend de la sensibilité affective du musicien-compositeur, sans passer premièrement par son entendement. C’est donc la sensibilité du musicien, le degré d’affectibilité de ses sentiments propres, qui crée la durée musicale. Nos sentiments, nous le savons, sont indépendants du temps normal: ainsi le musicien crée un temps fictif, contenu sans doute dans le temps normal, mais, esthétiquement, indépendant de lui; et il a le pouvoir presque miraculeux de fixer définitivement cette création, ce temps fictif. De sorte que, pendant la durée de sa musique, le musicien nous oblige à mesurer et ressentir le temps selon la durée de ses propres sentiments: il nous place dans un temps véritable, puisque durée, et pourtant fictif. La réalité esthétique de la musique est, par là, supérieure à celle de tous les arts; elle seule est une création immédiate de notre âme."
  "source_languages":
  - "fr"
  "source_locations":

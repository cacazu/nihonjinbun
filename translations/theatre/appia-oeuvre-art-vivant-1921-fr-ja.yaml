  "source_text": "Décors pour les drames de Wagner."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 121
  "translation_ja": "ワーグナーの楽劇の舞台装置。"
  "translation_status": "reviewed"
- "id": "appia-0235"
  "section_id": "wagner-drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces décors, choisis parmi ceux de la période romantique de l’auteur, datent d’environ 25 ans. Ils appartiennent à des scénarios composés minutieusement, mesure par mesure, sur les partitions. — Lorsqu’un décor est né du texte poétique-musical, il se trouve si intimement uni à cette partition qu’il ne peut pas être compris sans le scénario qui en est la transposition dans l’espace. Il est impossible, ici, de donner une idée, même approximative, de ce travail, et l’auteur doit se borner à quelques orientations."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 121
  "translation_ja": "これらは著者のロマン主義時代の装置から選んだもので、制作はおよそ25年前である。楽譜に即し、一小節ずつ入念に組み立てた上演設計の一部をなしている。詩と音楽のテクストから生まれた装置は、楽譜とあまりに深く結びついているので、それを空間に移し替えた上演設計なしには理解できない。ここでこの仕事の大まかな見取り図を示すことさえできないので、著者は手がかりをいくつか挙げるにとどめる。"
  "translation_status": "reviewed"
- "id": "appia-0236"
  "section_id": "parsifal-1"
  "kind": "heading"
  "origin": "source"
  "source_text": "PARSIFAL Iᵉʳ acte ; la forêt sacrée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 121
  "translation_ja": "『パルジファル』第1幕。聖なる森。"
  "translation_status": "reviewed"
- "id": "appia-0237"
  "section_id": "parsifal-1"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette forêt figure, dans la musique, un Temple. Elle doit en avoir le caractère; et, cela, d’autant plus que le Temple véritable du Saint-Graal lui succède, progressivement, à la fin de l’acte. — Les arbres prendront donc des lignes et une disposition générale conformes à cette parenté architecturale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 121
  "translation_ja": "この森は音楽のなかで神殿を表す。したがって森は神殿の性格を帯びていなければならない。幕の終わりには本物の聖杯の神殿が徐々に森に取って代わるので、なおさらである。そこで木々には、この建築上の近さが伝わる線を与え、全体をそれに沿って配置する。"
  "translation_status": "reviewed"
- "id": "appia-0238"
  "section_id": "parsifal-1"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Alors, quand cette forêt-temple se déroulera lentement, solennellement sous nos yeux, pour nous conduire comme en un rêve vers le Temple divin, dans l’invraisemblable et tragique splendeur de l’orchestre, les troncs seront, peu à peu, placés sur des rochers plats, et non plus enracinés; la végétation disparaîtra; la lumière naturelle du jour fera place à celle, surnaturelle, venant du Temple surnaturel, et les colonnes de pierre remplaceront doucement les grands fûts de la forêt: nous passerons, ainsi, d’un Temple dans un autre Temple."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 121
  "translation_ja": "やがて森の神殿は、オーケストラがこの世のものとも思えぬ悲劇的な輝きを放つなか、ゆっくりと厳かに私たちの目の前に展開し、夢のなかを行くように聖なる神殿へと導いていく。その間、幹は少しずつ地に根を張った姿から、平らな岩の上に載る姿へと変わる。草木は消え、自然な昼の光は、超自然の神殿から来る超自然の光に道を譲る。石の柱が森の大きな幹にそっと取って代わり、私たちはこうして一つの神殿から別の神殿へ移る。"
  "translation_status": "reviewed"
- "id": "appia-0239"
  "section_id": "parsifal-2"
  "kind": "heading"
  "origin": "source"
  "source_text": "PARSIFAL IIᵐᵉ acte ; le donjon de Klingsor."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 125
  "translation_ja": "『パルジファル』第2幕。クリングゾルの城の主塔。"
  "translation_status": "reviewed"
- "id": "appia-0240"
  "section_id": "parsifal-2"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Klingsor, le magicien pervers, a construit son château sur le vide et les ténèbres du désespoir. Des oubliettes formidables de la désespérance morale il évoque celle qui doit perdre Parsifal. Au milieu de la scène atroce, le jeune héros paraît dans la plaine lumineuse. Nous ne le voyons pas, mais Klingsor, — debout, sur la terrasse du bas qui surplombe l’abîme, — l’a vu dans son miroir de nécromant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 125
  "translation_ja": "邪悪な魔術師クリングゾルは、絶望の空虚と闇の上に城を築いた。その人の心の絶望が生む恐るべき地下牢から、パルジファルを破滅させる女を呼び出す。このむごい場面のさなか、若い英雄が光に満ちた平原に現れる。私たちには見えないが、深い淵を見下ろす下の張り出しに立つクリングゾルは、魔術の鏡でその姿を見た。"
  "translation_status": "reviewed"
- "id": "appia-0241"
  "section_id": "parsifal-2"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Parsifal, inconscient du danger qui le menace, fait, à lui seul, le siège du château. Klingsor, pour le mieux contempler et clamer, à la fois, son enthousiasme et son mépris, monte alors rapidement vers le ciel lumineux et s’appuie contre la tour qui domine l’horizon. Afin de marquer le contraste, le plein air sera du bleu le plus intense, tandis que dans la profondeur régnera l’horreur livide de la souffrance et de la mort."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 125
  "translation_ja": "パルジファルは身に迫る危険を知らず、ただ一人で城を攻め立てる。クリングゾルは彼をもっとよく見渡し、同時に興奮と侮蔑を叫び上げようと、あわただしく明るい空の方へ上って、地平を見下ろす塔にもたれる。対照をはっきりさせるため、外の空はひときわ深い青に、底には苦しみと死の青ざめた恐怖が支配する。"
  "translation_status": "reviewed"
- "id": "appia-0242"
  "section_id": "parsifal-2"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bientôt après, toute la construction s’effondre pour laisser place au jardin parfumé de fleurs vivantes et sonores..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 125
  "translation_ja": "そのすぐ後、建物全体が崩れ、香り高く、生きて歌う花々の庭が現れる……。"
  "translation_status": "reviewed"
- "id": "appia-0243"
  "section_id": "parsifal-3"
  "kind": "heading"
  "origin": "source"
  "source_text": "PARSIFAL IIIᵐᵉ acte ; la prairie en fleurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 129
  "translation_ja": "『パルジファル』第3幕。花咲く草原。"
  "translation_status": "reviewed"
- "id": "appia-0244"
  "section_id": "parsifal-3"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous sommes de retour sur la terre sanctifiée du Graal. Les troncs et l’aspect général du paysage l’indiquent. Beaucoup de sérénité est nécessaire, sans doute; pourtant, les lignes de la montagne marquent un effort vers un but déterminé."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 129
  "translation_ja": "私たちは聖杯の聖地に戻ってきた。木の幹と風景全体のたたずまいが、それを示している。深い静けさは確かに必要だが、山の線には、定まった目標に向かう努力が現れている。"
  "translation_status": "reviewed"
- "id": "appia-0245"
  "section_id": "parsifal-3"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En effet, Parsifal cherche toujours encore Amfortas, pour le guérir et lui rendre la paix; mais après de longues années d’erreurs, il n’espère plus retrouver l’invisible chemin du Temple, le chemin des cœurs purs et simples. — Il apparaît au centre arrière-plan, venant de la plaine. L’on voit d’abord son buste seulement, car la montée est rude: puis, enfin, c’est lui tout entier, dans son armure de tristesse. Gurnemanz, du seuil de la hutte, le regarde passer, muet d’étonnement. — La source sacrée coule au milieu des rochers. C’est là que Parsifal trouvera le repos et l’assurance de sa mission divine. — A gauche sont les ronces abritant le sommeil de Kundry, au début de l’acte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 129
  "translation_ja": "実際、パルジファルはなおもアンフォルタスを捜し、病を癒やして安らぎを返そうとしている。だが長い年月をさまよった後では、神殿への見えない道、心の清らかで素朴な者の道を再び見つけられるとは思っていない。彼は平原から来て、舞台奥の中央に現れる。坂は険しく、初めは上半身だけが見える。ようやく悲しみの鎧をまとった全身が現れる。グルネマンツは小屋の入口から、驚きで声も出ずに彼が通り過ぎるのを見つめている。聖なる泉は岩のあいだを流れる。パルジファルはそこで休息を得、自分の使命が神から与えられたことを確信する。左には幕の初めにクンドリが眠る、いばらの茂みがある。"
  "translation_status": "reviewed"
- "id": "appia-0246"
  "section_id": "parsifal-3"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pendant la claire lumière du Vendredi Saint, des cloches lointaines annoncent les funérailles de Titurel. Les trois personnages montent, alors, vers la droite, parmi les troncs ; la forêt bientôt les enveloppe, glisse insensiblement de droite à gauche, — et nous entrons de nouveau dans le Temple du Graal."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 129
  "translation_ja": "聖金曜日の澄んだ光のなか、遠くの鐘がティトゥレルの葬儀を告げる。三人はそこで幹のあいだを右へと上っていく。まもなく森が彼らを包み、気づかぬほど静かに右から左へ流れ、私たちは再び聖杯の神殿に入る。"
  "translation_status": "reviewed"
- "id": "appia-0247"
  "section_id": "tristan"
  "kind": "heading"
  "origin": "source"
  "source_text": "TRISTAN IIIᵐᵉ acte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "『トリスタン』第3幕。"
  "translation_status": "reviewed"
- "id": "appia-0248"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Un burg breton, livré à l’abandon », nous dit Richard Wagner. Et pourtant, rien dans sa partition n’exprime ce qu’il indique là! Deux mots de Kurwenal, au début, suffisent à nous orienter. Ensuite nous sommes placés, par l’auteur lui-même, entre la lumière du jour, qui aveugle et tourmente un malade, et la nuit bienfaisante où ce malade trouve du repos en perdant connaissance."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "「打ち捨てられたブルターニュの城」と、リヒャルト・ワーグナーは言う。ところが楽譜には、そこに書かれたことがまるで表れていない。冒頭のクルヴェナールの二言で、事情は十分わかる。その後、作者自身は私たちを、病人の目をくらませ苦しめる昼の光と、その病人が意識を失って休息を得る恵み深い夜とのあいだに置く。"
  "translation_status": "reviewed"
- "id": "appia-0249"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est là tout. Car, assurément, ce n’est pas avec les yeux de Kurwenal que nous devons vivre cette heure de passion sans précédent dans aucune littérature."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "それだけだ。どの文学にも先例のないこの情念のひとときを、私たちが生きるのは、もちろんクルヴェナールの目を通してではないからだ。"
  "translation_status": "reviewed"
- "id": "appia-0250"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le jour augmente le délire de Tristan : Isolde vit dans cette lumière, et Tristan n’est pas auprès d’elle. Par contre, la nuit réunit leurs deux âmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "昼はトリスタンの錯乱をひどくする。イゾルデはこの光のなかに生きているのに、トリスタンは彼女のそばにいない。反対に、夜は二人の魂を結び合わせる。"
  "translation_status": "reviewed"
- "id": "appia-0251"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Soudain, du fond de cette nuit, une certitude s’est imposée comme un rayon divin: Isolde est proche, le vent gonfle ses voiles — Tristan la voit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "突如として夜の底から、神の光のように確信が差し込む。イゾルデは近い。風が彼女の船の帆をふくらませる。トリスタンには彼女が見える。"
  "translation_status": "reviewed"
- "id": "appia-0252"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et la réalité se montre alors compatissante : la voile paraît à l’horizon."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "そのとき現実が慈悲を示す。地平線に帆が現れる。"
  "translation_status": "reviewed"
- "id": "appia-0253"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bénie soit la lumière! Joyeux le sang qui jaillit de la blessure et resplendit au soleil couchant! Oh, bienheureux ce dernier rayon, car il porte Isolde !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "光に祝福あれ。傷からほとばしり、夕陽に照り輝く血は歓びに満ちよ。ああ、何と幸いな最後の光だろう。イゾルデを運んでくるのだから。"
  "translation_status": "reviewed"
- "id": "appia-0254"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais, hélas! pour rencontrer ce rayon et se confondre avec lui, le flambeau de la nuit doit s’éteindre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "だが、ああ、その光と出会い一つになるには、夜のたいまつが消えなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0255"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si l’on excepte les quelques signes indispensable pour situer l’action, le décor de cet acte doit seulement envelopper un malade ainsi qu’un paravent dont Kurwenal protège avec tendresse son maître et son ami."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "舞台上の出来事の状況を伝えるのに不可欠ないくつかのしるしを除けば、この幕の装置はただ一人の病人を包み込めばよい。クルヴェナールが主君であり友でもある人をいたわって守る衝立のように。"
  "translation_status": "reviewed"
- "id": "appia-0256"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans cette construction sommaire, l’éclairage tout puissant marquera la signification de la lumière, qui est particulière à cet acte: tant que la clarté du jour angoisse Tristan, il n’en sera pas touché: mais, du moment où la lumière s’identifie pour lui avec l’arrivée d’Isolde, elle l’envahira, peu à peu, jusqu’à illuminer sa tête. — Ensuite, le crépuscule tombera respectueusement sur les deux héros réunis."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "この簡素な作りのなかで、照明は力を存分に発揮し、この幕ならではの光の意味を際立たせる。昼の明るさがトリスタンを苦しめているあいだ、その光は彼に当たらない。しかし光が彼にとってイゾルデの到来と一つになるとき、光は少しずつ彼を覆い、頭まで照らし出す。その後、再会した二人に、敬意を表するように夕闇が降りる。"
  "translation_status": "reviewed"
- "id": "appia-0257"
  "section_id": "tristan"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce décor est en entier « praticable ». — Actuellement, l’auteur le simplifierait encore et supprimerait les branches. — Le coin de gauche est une sorte de tranche géologique, de couleur sombre et neutre, qui permet à l’acteur de se trouver au tout premier plan sans, nécessairement, être sur le plateau horizontal de la scène. L’auteur se sert souvent de ce procédé."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 133
  "translation_ja": "この装置は全体が、俳優が実際に乗って演技できる作りである。いまなら著者はもっと簡素にして、枝を取り除くだろう。左隅は暗く彩度を抑えた色の地層の断面のようになっており、俳優は舞台の水平な床にいなくても、最前面に立てる。著者がよく用いる方法である。"
  "translation_status": "reviewed"
- "id": "appia-0258"
  "section_id": "rhein"
  "kind": "heading"
  "origin": "source"
  "source_text": "L’OR DU RHIN ; le Walhall."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 139
  "translation_ja": "『ラインの黄金』。ヴァルハル。"
  "translation_status": "reviewed"
- "id": "appia-0259"
  "section_id": "rhein"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sur l’ordre de Wotan, les géants, trop confiants, ont construit en une nuit la forteresse qui doit protéger les dieux et justifier leur parjure. Walhall est donc une construction criminelle, faite d’artifices et amoncelée sur le monde par de grossiers manœuvres. Le Rhin le sépare d’un sommet gazonné qui, dans Wagner, n’est pas sans analogie avec un salon où les dieux bavardent et vident, non sans élégance, des querelles peu estimables. Pourtant, ainsi que dans bien des salons, deux portes restent menaçantes : l’une, à droite, conduit aux forges ténébreuses d’Albérich; l’autre, à gauche, donnera passage à Erda, — à celle dont la pensée domine tout le vain savoir des dieux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 139
  "translation_ja": "ヴォータンの命令で、信じやすい巨人たちは一夜にして、とりでを築いた。神々を守り、彼らが誓いを破ったことを正当化するはずのとりでである。だからヴァルハルは、まやかしでできた、粗野な作業人夫がこの世界の上に積み上げた、罪深い建物なのだ。ライン川を挟んで、草に覆われた高台がある。ワーグナーの劇では、そこは神々が談笑し、感心できない争いをそれなりに優雅に片づける客間に似ていなくもない。だが多くの客間と同じように、二つの戸口が不穏な気配を残している。右はアルベリヒの暗い鍛冶場へ通じ、左からは、神々のむなしい知識のすべてを超える知恵をもつエルダが現れる。"
  "translation_status": "reviewed"
- "id": "appia-0260"
  "section_id": "rhein"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce décor est, essentiellement, un décor de plein-air, et la lumière y joue un rôle prépondérant. — Tout le sommet est « praticable ». — Sur le rocher de gauche se place Froh ; de celui de droite, qui surplombe le fleuve, Donner, le dieu du tonnerre, appelle l’orage, et trace ensuite, par-dessus la vallée, l’arc-en-ciel mensonger pour l’entrée des dieux dans leur demeure mensongère."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 139
  "translation_ja": "この装置は本質的に戸外の装置であって、光が決定的な役割を果たす。高台はどこでも俳優が実際に使える。左の岩にはフローが立つ。川を見下ろす右の岩からは雷神ドンナーが嵐を呼び、続いて谷の上に、神々が偽りの住まいに入るための偽りの虹を描く。"
  "translation_status": "reviewed"
- "id": "appia-0261"
  "section_id": "walkuren"
  "kind": "heading"
  "origin": "source"
  "source_text": "La roche des Walküres."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 143
  "translation_ja": "ワルキューレたちの岩山。"
  "translation_status": "reviewed"
- "id": "appia-0262"
  "section_id": "walkuren"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est sur ce rocher que Wotan réduit à l’impuissance celle qui, seule, connaissait son plus secret vouloir. Car Brünhilde n’a pas consenti aux lâches compromissions exigées par son père. — Ce décor revient quatre fois dans l’anneau du Nibelungen, et ramène ainsi le spectateur, toujours à nouveau, au point le plus sensible du drame. Il a donc l’importance d’un rôle, et doit être traité comme tel. — Seulement, Wagner demande l’impossible. Il veut un sommet sur lequel s’élève un second sommet; un grand sapin doit abriter le sommeil de Brünhilde, et une grotte la recevoir avec Siegfried. — Une grotte au faîte d’une montagne est chose rare; et la masse d’un sapin anéantit l’effet d’une sommité."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 143
  "translation_ja": "ヴォータンはこの岩山で、自分の最もひそかな願いをただ一人知っていた者の力を奪う。父の求める卑怯な妥協に、ブリュンヒルデが同意しなかったためだ。この装置は『ニーベルングの指環』に四度現れ、観客をそのたびに劇の最も切実なところへ連れ戻す。登場人物の一役に匹敵する重要さがあり、そのつもりで扱わなくてはいけない。ところがワーグナーは不可能なことを求める。一つの山頂の上に、さらにもう一つ頂がそびえなくてはならない。大きなモミの木がブリュンヒルデの眠りを守り、洞窟が彼女とジークフリートを迎えなくてはいけない。山の頂に洞窟があることはまれであり、モミの大きさは頂の効果を台なしにする。"
  "translation_status": "reviewed"
- "id": "appia-0263"
  "section_id": "walkuren"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’auteur a cherché, pourtant, à concilier l’inconciliable: et la partition des 4 scènes (Walküre, Siegfried et deux dans le Crépuscule des dieux) a guidé son crayon. — L’étude de ce décor lui a révélé le rôle des plans dans un drame de Wagner. En voici le résumé : plus l’expression dramatique s’intériorise et, par cela, perd contact avec les apparences extérieures, plus l’acteur doit se rapprocher du premier plan, — par conséquent se détacher du décor. Plus, au contraire, l’expression poétique-musicale se répand au dehors et donne d’importance au milieu décoratif, et plus l’acteur doit s’y mêler. — Exemple, pour le IIIᵐᵉ acte de la Walküre: le tête-à-tête de Brünhilde et Wotan est tout intérieur; donc, premier plan. Mais lorsque Wotan endort Brünhilde, il gagne le plan intermédiaire, jusqu’à ce que le décor lui-même, (la roche inclinée, à droite) reçoive la Walküre endormie et la mêle complètement au paysage. — Dans Siegfried, IIIᵐᵉ acte, les nuances de plans sont infinies; ainsi que dans la scène de Waltraute, au Iᵉʳ acte du Crépuscule des dieux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 143
  "translation_ja": "それでも著者は相いれないものを両立させようとした。『ワルキューレ』、『ジークフリート』、『神々の黄昏』の二場面、合わせて四場面の楽譜が鉛筆を導いた。この装置の研究から、ワーグナーの劇における舞台の前後の位置の役割が明らかになった。要約すればこうだ。劇の表現が内面に入っていき、それに従って外に現れるものと関係を失うほど、俳優は前面に近づき、したがって装置から浮き立って見えなければならない。それとは反対に、詩と音楽の表現が外へ広がり、装置のつくる環境の重要さが増すほど、俳優はその環境に溶け込まなければならない。たとえば『ワルキューレ』第3幕。ブリュンヒルデとヴォータンが二人だけで話すのは、すべて内面のことだから、前面である。だがヴォータンがブリュンヒルデを眠らせるとき、彼は舞台の中ほどへ移り、やがて装置そのもの、つまり右の傾いた岩が眠ったワルキューレを受け止め、すっかり風景の一部とする。『ジークフリート』第3幕にも、『神々の黄昏』第1幕のヴァルトラウテの場にも、前後の位置に無数の微妙な変化がある。"
  "translation_status": "reviewed"
- "id": "appia-0264"
  "section_id": "promethee"
  "kind": "heading"
  "origin": "source"
  "source_text": "Prométhée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 151
  "translation_ja": "プロメテウス。"
  "translation_status": "reviewed"
- "id": "appia-0265"
  "section_id": "promethee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces deux décors sont de l’époque intermédiaire, entre le romantisme Wagnérien obligatoire et la libération. Il sont faits sur un scénario destiné à l’institut Jaques-Dalcroze, et datent de 1910."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 151
  "translation_ja": "この二つの装置は、ワーグナーのロマン主義に従わざるをえなかった時期から、そこを離れて自由になるまでの、中間の時期のものである。ジャック＝ダルクローズの研究所のための上演設計に基づいて、1910年に作った。"
  "translation_status": "reviewed"
- "id": "appia-0266"
  "section_id": "promethee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le premier représente l’atelier où Prométhée crée des hommes à son image. — Trahi par Pandore, Prométhée transporte ses créatures dans une île heureuse. C’est le second acte, dont le décor n’est pas ici. — Mais il est bientôt rejoint par ses ennemis qui l’enchaînent, directement, sur le fronton de son atelier détruit. — Enfin, délivré par Hercule, Prométhée se place sur une roche élevée, et, de là, il appelle l’humanité vers la lumière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 151
  "translation_ja": "最初の装置は、プロメテウスが自分に似せて人間を造る工房を表す。パンドラに裏切られ、プロメテウスは造った者たちを幸福な島へ連れていく。それが第2幕で、その装置はここに掲げていない。しかし敵がすぐに追いつき、壊された工房の破風に彼をじかに鎖でつなぐ。ついにヘラクレスに解放されたプロメテウスは、高い岩に立ち、そこから人類に光へ向かうよう呼びかける。"
  "translation_status": "reviewed"
- "id": "appia-0267"
  "section_id": "promethee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans l’atelier détruit l’on remarquera que toutes les surfaces, malgré leur aspect chaotique, peuvent servir à l’acteur. Par exemple la pierre oblique d’où Hercule pourra rejoindre Prométhée et le délivrer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 151
  "translation_ja": "壊された工房では、どの面も無秩序に見えながら俳優が使えることに注目したい。たとえば斜めの石があって、ヘラクレスはそこからプロメテウスに近づき、彼を解放できる。"
  "translation_status": "reviewed"
- "id": "appia-0268"
  "section_id": "promethee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le tronc-colonne, dont on aperçoit un fragment, veut orienter le spectateur en lui rappelant l’atelier tel qu’il l’a vu au premier acte. Ce tronc est celui de gauche avant la destruction."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 151
  "translation_ja": "柱になった木の幹の一部が見えるのは、観客に第1幕で見た工房を思い出させ、今いる場所がわかるようにするためである。壊される前には左にあった幹だ。"
  "translation_status": "reviewed"
- "id": "appia-0269"
  "section_id": "echo-narcisse"
  "kind": "heading"
  "origin": "source"
  "source_text": "Echo et Narcisse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 157
  "translation_ja": "エコーとナルキッソス。"
  "translation_status": "reviewed"
- "id": "appia-0270"
  "section_id": "echo-narcisse"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce décor a été adapté aux dimensions de la salle de l’institut Jaques-Dalcroze, pour les représentations de juin 1920."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 157
  "translation_ja": "この装置は1920年6月の公演に向けて、ジャック＝ダルクローズ研究所のホールの寸法に合わせた。"
  "translation_status": "reviewed"
- "id": "appia-0271"
  "section_id": "echo-narcisse"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La source, où se mire Narcisse, était animée, dans le bas, par cinq naïades, étendues en chaîne, et la tête tournée vers le rocher vertical. — Chaque fois que l’image de Narcisse se réfléchissait dans l’eau, ces naïades murmuraient des accords en attirant Narcisse de leurs regards et de leurs gestes. — A d’autres moments, leur silence et leurs têtes endormies exprimaient avec précision le chaud silence de la forêt pendant une après-midi d’été. Chose étrange, et pourtant naturelle : personne ne pouvait douter de la présence de l’eau, bien que l’on vît parfaitement le parquet de la salle au pied du rocher... —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 157
  "translation_ja": "舞台の低いところでは、五人の水の精が一列につながるように横たわり、まっすぐ立つ岩へ頭を向けて、ナルキッソスが姿を映す泉に生命を与えていた。水にナルキッソスの姿が映るたび、水の精たちは和音をささやき、まなざしと身ぶりで彼を引き寄せた。また別のときには、水の精たちの沈黙と、眠りに落ちた頭が、夏の午後の森の暑く静まり返ったさまをありありと表した。不思議なことだが、そうなるのは自然でもあった。岩の足もとにホールの板張りの床がはっきり見えるのに、水の存在を疑う者は誰もいなかったのである……。"
  "translation_status": "reviewed"
- "id": "appia-0272"
  "section_id": "echo-narcisse"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La pièce comportait, (en plus des naïades), Echo, Narcisse, et cinq nymphes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 157
  "translation_ja": "この劇には水の精のほか、エコー、ナルキッソス、五人のニンフが登場した。"
  "translation_status": "reviewed"
- "id": "appia-0273"
  "section_id": "orphee"
  "kind": "heading"
  "origin": "source"
  "source_text": "ORPHÉE DE GLÜCK ; les champs Elysées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 161
  "translation_ja": "グルックの『オルフェ』。エリュシオンの野。"
  "translation_status": "reviewed"
- "id": "appia-0274"
  "section_id": "orphee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Orphée traverse les enfers pour chercher Eurydice. La scène des enfers est construite en escaliers, très développés, interrompus par des terrasses; et le tout est soutenu par des piliers encastrés dans les murailles d’appui. Ce sont donc les escaliers qui caractérisent les enfers."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 161
  "translation_ja": "オルフェはエウリディーチェを捜して冥界を通り抜ける。冥界の舞台は、広く展開する階段の途中にいくつもの平場を挟んで構成し、全体を支持壁にはめこんだ柱で支える。つまり、冥界を特徴づけるのは階段である。"
  "translation_status": "reviewed"
- "id": "appia-0275"
  "section_id": "orphee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si l’on évoque, ensuite, la musique qui introduit Orphée auprès des âmes bienheureuses, l’on comprendra que les plans inclinés, sans la moindre ligne verticale les interrompant, (les escaliers sont un assemblage de lignes horizontales et verticales), pouvaient seuls exprimer la sérénité parfaite du lieu. — Leur groupement est particulièrement difficile; mais, heureusement, la partition donne, pour cela, des indices précieux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 161
  "translation_ja": "次に、オルフェを幸いな魂たちのもとへ導く音楽を思い起こしてみれば、その場所の完全な静けさを表せるのは、遮る垂直線が一本もない斜面だけだとわかる。階段は水平線と垂直線を組み合わせたものである。その斜面をどう組み合わせるかはとりわけ難しいが、幸い、楽譜が貴重な手がかりを与えてくれる。"
  "translation_status": "reviewed"
- "id": "appia-0276"
  "section_id": "orphee"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans un espace semblable, la démarche est naturellement calme et sans secousse aucune; et la lumière douce, uniforme et légèrement mobile, transforme la réalité matérielle de la construction en flots mouvants et berceurs. Les personnages participent, — par l’éclairage, — à cette atmosphère irréelle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 161
  "translation_ja": "そのような空間では、歩みはおのずと穏やかで、まったく揺れがない。柔らかく一様で、わずかに動く光は、装置の物質的な現実を、絶えず動き、やさしく揺らす波へと変える。登場人物も、照明によって、その現実離れした雰囲気を分かち合う。"
  "translation_status": "reviewed"
- "id": "appia-0277"
  "section_id": "espaces-rythmiques"
  "kind": "heading"
  "origin": "source"
  "source_text": "Espaces rythmiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 165
  "translation_ja": "律動空間。"
  "translation_status": "reviewed"
- "id": "appia-0278"
  "section_id": "espaces-rythmiques"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les dessins suivants, qui datent de 1909, font partie d’une série de projets appartenant à Jaques-Dalcroze, et destinés à la création d’un style propre à la mise en valeur du corps humain sous les ordres de la musique. — Sans autre destination, ils sont un point de départ."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 165
  "translation_ja": "次の素描は1909年のもので、ジャック＝ダルクローズが所有する一連の構想に属する。音楽に従う人間の身体を引き立たせるのにふさわしい様式を作るためのものである。それ以外に具体的な用途はなく、出発点となる素描である。"
  "translation_status": "reviewed"
- "id": "appia-0279"
  "section_id": "clairiere"
  "kind": "heading"
  "origin": "source"
  "source_text": "La clairière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 175
  "translation_ja": "森の空き地。"
  "translation_status": "reviewed"
- "id": "appia-0280"
  "section_id": "clairiere"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Exemple d’une forêt simplement évoquée par des rideaux découpés et un éclairage approprié. Elle peut se faire dans n’importe quelle salle, ou, même dans une chambre. La lumière est tamisée à volonté par des cartons découpés et invisibles, et les ombres qui tombent sur les personnages peuvent, ainsi, devenir mouvantes. La fusion est complète."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 175
  "translation_ja": "切り抜いた幕とそれにふさわしい照明だけで、森を思わせる例である。どんなホールでも、あるいは一室でもできる。見えないように置いた切り抜きの厚紙で光を思いどおりに弱めれば、登場人物に落ちる影を動かすこともできる。融合は完全である。"
  "translation_status": "reviewed"
- "id": "appia-0281"
  "section_id": "clairiere"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les trois troncs du premier plan sont, probablement, superflus."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 175
  "translation_ja": "前面の三本の木の幹は、おそらくなくてもよい。"
  "translation_status": "reviewed"
- "id": "appia-0282"
  "section_id": "cypres"
  "kind": "heading"
  "origin": "source"
  "source_text": "L’ombre du cyprès."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 179
  "translation_ja": "イトスギの影。"
  "translation_status": "reviewed"
- "id": "appia-0283"
  "section_id": "cypres"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour cet espace, l’auteur s’était d’abord proposé une avenue de cyprès. Il a supprimé, peu à peu, les arbres, n’en conservant que les ombres. Puis, enfin, cette ombre seule est restée: car elle est suffisante pour évoquer tout un paysage. — Il est à remarquer qu’elle peut être balancée au moyen de l’éclairage, et qu’elle s’accorderait, ainsi, à tel ou tel rythme musical."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 179
  "translation_ja": "著者はこの空間を当初、イトスギの並木にしようと考えた。少しずつ木を省き、影だけを残した。最後にはこの影一つだけになった。風景全体を思い起こさせるには、それで十分だからである。なお、照明で影を揺らせば、さまざまな音楽のリズムに調子を合わせられる。"
  "translation_status": "reviewed"
- "id": "appia-0284"

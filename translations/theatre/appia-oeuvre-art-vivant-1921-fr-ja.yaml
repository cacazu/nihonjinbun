  "origin": "source"
  "source_text": "Plus le peintre s’approchera de la sculpture, moins il sera peintre ; plus le sculpteur recherchera l’ambiance, moins il sera sculpteur; etc… — Moins l’auteur dramatique rendra son personnage dépendant du milieu, plus il sera dramaturge; car, qui dit dramaturge dit aussi metteur en scène ; il est sacrilège de spécialiser les deux fonctions. Nous pouvons donc établir que si l’auteur ne les cumule pas à lui seul, il ne sera capable ni de l’une ni de l’autre, puisque c’est de leur pénétration réciproque que l’art vivant doit naître. A de très rares exceptions près, cet art nous ne l’avons pas encore, pas plus que cet artiste. En déplaçant le centre de gravité nous l’avons comme divisé ; notre art dramatique repose d’une part sur l’auteur, de l’autre sur le metteur en scène, en s’appuyant tantôt davantage sur l’un que sur l’autre. Il devrait reposer clairement et simplement sur lui-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 67
    "printed_page": "61"
  "translation_ja": "画家は彫刻に近づけば近づくほど画家でなくなり、彫刻家は周囲の雰囲気を求めれば求めるほど彫刻家でなくなる。ほかも同様である。劇の作者が人物を環境に依存させないほど、真の劇作家となる。というのも、劇作家ということは演出家ということでもあり、この二つの働きを別々の専門に分けるのは冒瀆だからだ。だから作者が自分一人で両方を兼ねないなら、どちらも務まらないと、言い切ってよい。二つが互いに浸透しあってこそ、生きた芸術が生まれるはずなのだから。ごくまれな例外を除けば、私たちにはその芸術も、その芸術家もまだいない。重心を移したため、芸術をいわば二つに割ってしまった。私たちの演劇は作者と演出家の両方に頼り、その時々で、どちらか一方に余計に頼る。それ自身の上に、はっきりと、ただそれだけで立つべきなのだ。"
  "translation_status": "reviewed"

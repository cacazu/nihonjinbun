    "precision": "page"
    "pdf_page": 32
    "printed_page": "26"
  "translation_ja": "ここで確かめておきたい。台本と音楽を演出という観点から調べるのだから、少なくとも当面は、劇作、文学、作曲そのものの問題には立ち入らない。"
  "translation_status": "reviewed"
- "id": "appia-0068"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En quittant l’espace, avec ou sans durée latente, nous voici proprement dans le temps. Le caractère idéal et arbitraire de la notion de temps est trop connu pour qu’il soit nécessaire d’y revenir. Remarquons seulement que cette idéalité du temps s’affirme tout particulièrement dans l’art. De même qu’un long rêve a pu tenir dans cinq minutes, et, par conséquent, contenir une durée disproportionnée à celle du temps normal, de même les arts du temps n’utilisent le temps normal que comme un contenant, pour y placer leur durée spéciale. Pendant le rêve, nous avons cru à sa durée; pendant le texte ou la musique d’un drame, nous croyons à leur durée spéciale, et n’avons pas l’idée de consulter à cet égard notre montre; nous sentons qu’elle mentirait ! Les arts du temps disposent librement du temps et le dominent. Il n’en est pas ainsi de l’espace, pour les autres arts; c’est notre corps, par ses dimensions et possibilités, ce sont nos yeux aux facultés limitées, qui le déterminent. Une peinture qui nous obligerait à prendre le train pour en voir toute la succession dans l’espace, n’est guère imaginable. La sculpture, quelque gigantesque soit-elle, conserve, après tout, nos proportions relatives, et notre œil les transpose automatiquement. Pourtant, ces dimensions sont également dépendantes de nos facultés visuelles.* L’architecture qui dépasse en dimensions l’échelle applicable à notre présence, s’éloigne toujours, plus ou moins, de sa fonction artistique, jusqu’à l’abandonner complètement. Malheureusement de tels exemples abondent, et il importerait que nous en fussions sérieusement conscients. En architecture, les civilisations qui ont admis le colossal ne sont jamais celles des peuples vraiment artistes, des peuples dont l’art est vivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 32
    "pdf_page_end": 33
    "printed_page": "26"
    "printed_page_end": "27"
  "translation_ja": "持続が潜んでいようといまいと、空間を離れた私たちは、時間そのものに入る。時間という概念が観念的で、任意に定まるということは、よく知られているので繰り返さない。ただ、時間のこの観念性は、芸術の中でとりわけはっきり表れると指摘しておこう。長い夢が五分に収まったとすれば、そこに含まれていた持続は、ふつうの時間の長さとは釣り合わなかったことになる。それと同様に時間の芸術は、ふつうの時間を、自分に固有の持続を入れる器としてしか使わない。夢を見ている間、私たちは夢の長さを信じた。劇の台詞や音楽の間、そこに固有の持続を信じ、時計を確かめようとは思わない。時計には嘘をつかれると感じるからだ！　時間の芸術は時間を自在に扱い、支配する。それ以外の芸術にとっての空間は、そうはいかない。空間を決めるのは、寸法と動きうる範囲をもった身体であり、能力の限られた私たちの目だからだ。空間に広がる絵の全体を順に見るのに列車に乗らなければならないなんて、まず想像もつかない。どんなに巨大な彫刻でも、結局、人間の相対的な比率は保たれており、目が自然とそれを換算する。ただしこの寸法も、やはり視覚の能力に左右される。* 人間がそこに立つことを尺度にして作れる大きさを超えた建築は、程度に差はあれ、つねに芸術としての機能から遠ざかり、ついにはそれをすっかり手放してしまう。残念ながら、そういう例には事欠かない。このことを真剣に認識することが大切だろう。建築に巨大さを認めてきた文明は、真に芸術をなす民、芸術が生きている民の文明では決してない。"
  "translation_status": "reviewed"

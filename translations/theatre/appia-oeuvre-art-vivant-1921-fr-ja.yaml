  "source_text": "Ce chapitre devrait être nommé: la lumière vivante; mais il y aurait tautologie. La lumière est à l’espace ce que les sons sont au temps: l’expression parfaite de la vie. Aussi n’avons-nous pas parlé de musique vivante, mais seulement d’une durée musicale qui comporte l’espace. La couleur, par contre, est un dérivé de la lumière; elle en est dépendante, et, du point de vue scénique, dépendante de deux façons distinctes: ou bien la lumière s’empare d’elle pour la répandre, plus ou moins mobile, dans l’espace; dans ce cas la couleur participe au mode d’existence de la lumière; ou bien la lumière se borne à éclairer une surface colorée; la couleur reste alors attachée à l’objet et ne reçoit la vie que par cet objet et par les variations de la lumière qui le rendent visible. L’une est ambiante, pénètre l’atmosphère et, comme la lumière, prend sa part du mouvement ; elle est donc en relations intimes et directes avec le corps L’autre ne peut agir que par opposition et reflets; et, si elle se meut, ce n’est pas elle qui bouge mais bien l’objet qui la porte; sa vie n’est pourtant pas fictive comme en peinture, mais elle est tout à fait dépendante. Une tenture rouge, brusquement écartée, est entraînée dans le mouvement du geste; mais ce n’est pas la couleur rouge qui participe au mouvement, c’est la tenture, que la couleur ne saurait quitter; et la même quantité de la même couleur étendue sur le panneau d’une porte, suivrait le mouvement passif et massif de la porte. L’effet, souvent considérable, de la tenture qui s’écarte, résulte de la souplesse de l’étoffe colorée, et non essentiellement de la couleur sur l’étoffe. Ces distinctions sont nécessaires pour le juste maniement de la couleur dans l’espace vivant, et prouvent la différence qui existe entre la couleur en peinture, — fiction sur surface plane, — et la couleur en action, répandue effectivement dans l’espace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 52
    "pdf_page_end": 53
    "printed_page": "46"
    "printed_page_end": "47"
  "translation_ja": "この章は「生きた光」と題すべきなのかもしれない。だがそれでは同じことを二度言うようなものだ。空間にとっての光は、時間にとっての音と同じく、生命を余すところなく表すものだ。だから私たちは、生きた音楽とは言わず、空間を伴う音楽の持続とだけ言った。それに対し色は光から生まれ、光に依存している。舞台での依存には二通りある。一つには、光が色を取り込み、多かれ少なかれ動きながら空間に広げる。この場合、色は光と同じように存在する。もう一つには、光は色のついた面を照らすだけで、色は物に留まり、その物と、それを見えるものにする光の変化からしか生命を受け取らない。前者は周囲に広がり、空気に浸透して、光のように動きの一端を担う。だから身体とじかに、深い関わりを結ぶ。後者は対照と反射によってしか働けない。動いて見えても、動くのは色ではなく、色を帯びた物である。この色も、絵画のような架空の生命しか持たないわけではないが、その生命はすっかり他に依存している。赤い幕をさっと引けば、身ぶりにつられて幕も動く。だが動きに加わるのは赤という色ではない。赤が離れられない幕のほうだ。同じ赤を同じ量だけ扉の板に塗れば、色は扉の受け身で重々しい動きに従うだけである。幕が引かれるときにしばしば生まれる大きな効果は、色のついた布のしなやかさから生じ、布にのった色そのものから生じるわけではない。この区別は、生きた空間で色を適切に扱うために欠かせない。平面上の虚構である絵画の色と、実際に空間に広がって働く色とが違うことも、ここに示される。"
  "translation_status": "reviewed"

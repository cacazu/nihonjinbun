  "source_text": "* Une treille peut s’indiquer clairement par le seul découpage des ombres que la lumière d’en haut jette sur le sol et les murs ; et le corps vivant et les formes inanimées y participent. Ce découpage, fait d’obstructions invisibles, peut même prendre part au mouvement s’il remue, et il rend, par là, les ombres mobiles à notre gré."
  "source_languages":

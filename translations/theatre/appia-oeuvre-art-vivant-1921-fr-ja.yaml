  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les divisions systématiques s’atténuent ainsi tout naturellement dans l’exercice pratique du dramaturge — metteur en scène —, mais elles sont cependant indispensables au juste maniement des facteurs de la représentation. Il est encore un ordre de signes qui, sans être précisément issus du texte, ni servir d’orientation nécessaire, sont comme les remarques jointes à une partition pour la juste interprétation de la musique: ils précisent l’expression sans l’expliquer; ils confirment l’idéalité du lieu en un symbole visible, et entraînent le corps vivant dans ce symbole. Certains détails de l’espace, de la couleur fixée, joints à des fluctuations de lumière, de couleur ambiante, des obstructions partielles portant des ombres plus ou moins mobiles et qui ne signifient rien de précis mais contribuent à la vie du mouvement, sont de cet ordre-là. Toujours à condition que le corps les agrée comme faisant partie de sa création dans l’espace. Le dramaturge-metteur en scène est un peintre dont la palette serait vivante ; l’acteur guide sa main dans le choix des couleurs vivantes, leur mélange, leur disposition ; puis il se plonge lui-même dans cette lumière, et réalise, en durée, ce que le peintre n’aurait conçu qu’en espace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 59
    "printed_page": "53"
  "translation_ja": "こうした体系上の区別は、劇作家兼演出家が実際に仕事をするなかで、おのずと薄らいでゆく。それでも上演を形づくるものを適切に扱うには、欠くことができない。しるしには、もう一つ種類がある。台本に由来するわけでも、何を見ているか知るための不可欠な手がかりになるわけでもないが、音楽を適切に解釈するために楽譜に添えられた指示のようなものだ。表現を説明するのではなく、はっきりさせる。場所が観念のうちで構想されたものだと、目に見える象徴によって確かめ、その象徴の中へ生きた身体を引き入れる。空間のある細部や物に固定された色彩を、光や周囲の色の揺れと組み合わせること。光を部分的に遮り、あまり動かないか、よく動くかの違いはあっても、特定の何かを意味するわけではなく、動きを生かす陰を落とすこと。そうしたものが、この種類にあたる。つねに、身体が空間で自ら生み出す表現の一部として、それらを受け入れることが条件である。劇作家兼演出家は、生きた絵の具をパレットに持つ画家のようなものだ。生きた色彩を選び、混ぜ、配するときには、俳優がその手を導く。次いでその光の中へ俳優自身が入り、画家なら空間でしか思い描けなかったものを、持続の中で実現する。"
  "translation_status": "reviewed"
- "id": "appia-0122"

  "source_text": "Or, quand nous disons poète et musicien, nous n’en excluons certes pas les représentants corporels de l’art vivant ! L’expérience musicale, faite en son propre corps, ne peut que disposer favorablement quiconque l’a ressentie, et le diriger vers les motifs que l’art vivant sait et doit exprimer, en l’écartant, du même coup et de par son sentiment corporel avivé, des motifs destinés à l’immobilisation des autres arts. L’art vivant s’adresse à l’être tout entier, et plus ses collaborateurs pourront lui apporter de leur vie, plus haut il pourra placer sa mission. Le « métier » vivant est à la fois très simple et très complexe. La théorie en est simple, puisqu’elle demande le don complet de soi-même; mais l’application exige une étude multiple, qu’il n’est pas accordé à chacun de pouvoir faire intégralement. De là le principe de Collaboration, ou coopération. Et l’on remarquera que ce principe nous est déjà une garantie de la qualité purement humaine de l’œuvre; les contingences spéciales qui, nous l’avons vu, sont du domaine du Signe (par opposition à l’Expression), concernent plus les individus que la collectivité. Si, pour quelque raison, elles devenaient momentanément nécessaires, l’œuvre vivante inclinerait vers une application dramatique qui appelle un auteur plutôt qu’un autre, et les collaborateurs devront consentir, par exception, à n’être que les exécutants fidèles de la volonté d’un seul, et s’éloigner, pour un temps, de l’Expression collective plus spontanée. La vie de l’œuvre se manifeste aussi dans cette oscillation entre le Signe et l’Expression, qui l’empêche de se cristalliser en un code esthétique formel. Cette oscillation soutient l’attention, stimule l’émotion par les contrastes qu’elle oppose, et permet à l’individu de se manifester plus complètement qu’en une forme exclusive."
  "source_languages":

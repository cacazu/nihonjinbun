  "section_id": "ded"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    « Camarade, ceci n’est pas un livre :
    Celui qui le touche touche un homme. »
    W. WHITMAN
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 13
  "translation_ja": |-
    「友よ、これは本ではない。
    これに触れる者は、一人の人間に触れるのだ。」
    W・ホイットマン

    "printed_page": "43"
    "printed_page_end": "44"
  "translation_ja": "したがって重力と硬さの原理こそ、生きた空間が存在するための第一の条件だ。そこからさらに、どんな線を選ぶかが決まるように見える。身体の構造は決まっていて、空間で身体のあり方を変えられるのは動きによってだけだ。動きとは、持続の中で身体を表すものである。身体とつねに対立するよう空間の線を選ぶことは、私たちに任されている。美術について先に見たとおり、それは動かないことへの埋め合わせである。だとすれば、重さと硬さがどう表れるかを心得てさえいれば、道は自由に開け、ほかの芸術家と同じく、細やかな意図や工夫のなかから選び、それを存分に押し広げてゆけるように思うだろう。だがそこで忘れていることがある。画家や彫刻家のように、飾る壁や粘土の塊を前にして、一人でいるのではない。私たちには生きた身体がいる。空間で私たちが向き合うのは身体だけであり、指図するのも身体だけである。生命のない形に向かって語りかけられるとしても、身体を通じてしかそれはできない。身体が承知しなければ、どんな試みもむなしく、生まれる前から死んでいる。生きた芸術における序列では、創造する想像力の位置は、時間と、生きて動く身体のあいだにある。つまり、私たちが作る音楽と、その音楽を吸収し、体現しなければならない身体のあいだだ。その意味で、私たちは身体より手前にいる。その先では、ものを言うのは身体である。私たちはその通訳となるだけで、独断では何一つ作れない。内なる生の表現である音楽に、信頼を寄せ、自覚して従ったことで、私たちは生きた身体を思いどおりに導く力を得た。今度は身体が、私たちの呼びかけにすっかり身を任せることによって、自らを囲み、自らに触れる空間に秩序を与える権利を得る。私たちには、それを直接には行えない。"
  "translation_status": "reviewed"

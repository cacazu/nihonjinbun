  "translation_ja": "これらの考えはわかりにくく、逆説のように見えるかもしれない。だが演出において何にどれだけの値打ちがあるかを正しく判断するためには、決定的に重要である。もう一度断っておかねばならないが、この論証はその観点に限ってなされている。"

- "id": "appia-0021"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette étude avait primitivement l’étendue de deux fois ce volume. L’auteur s’imaginait rendre sa pensée plus claire et d’un abord plus facile, s’il la documentait à chaque pas et la développait sous tous ses aspects. Il croyait pouvoir exprimer, ainsi, le suc d’un fruit, qui s’est trouvé, au cours de son travail, inexprimable, — de cette façon du moins. En outre, il a dû se convaincre que l’on n’entraîne pas un hôte aimable et indulgent sur un chemin qui lui est inconnu et pour des fins qu’il doit ignorer au départ, si, par un rappel continuel à la route coutumière et à ses aspects familiers, on détourne ses regards, et probablement aussi ses pas, de la direction nouvelle et imprévue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 15
    "printed_page": "9"
  "translation_ja": "この研究は、初めは今の本の二倍の長さがあった。考えを一歩進めるたびに資料で裏づけ、あらゆる角度から展開してみせれば、いっそう明快で近づきやすくなると、著者は思っていた。そうすれば果実の汁を搾り出せると信じていたのだが、仕事を進めるうち、それは搾って出せるものではないとわかった。少なくとも、そんなやり方では。また、こうも思い知らされた。気立てがよく寛容な客人を、出発時には行き先さえ知らないまま、未知の道に連れ出そうとする。そのとき、おなじみの道とその見慣れた眺めをひっきりなしに思い出させていては、思いがけない新しい方角から客人の目がそれ、おそらく足もそれてしまう。これでは一緒に歩きだせないのだ。"
  "translation_status": "reviewed"
- "id": "appia-0022"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans tous les domaines, la documentation est une étude que l’on fait en stationnant. Elle est une préparation à l’acte volontaire du départ. Les jambes du Marcheur de Rodin se sont « documentées », — et c’est pourquoi elles se décident à partir ! Un touriste s’arrête pour consulter la carte, puis il la replie et s’avance sur la voie qu’il croit avoir comprise."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 15
    "printed_page": "9"
  "translation_ja": "どんな領域でも、資料にあたるというのは立ち止まってする勉強である。自分の意志で出発する、その行為の準備なのだ。ロダンの《歩く人》の両脚は、もう「資料にあたった」。だからこそ、歩きだす決心をしている！　旅人は足を止めて地図を見る。それから地図をたたみ、道筋がつかめたと思う方へ進んでゆく。"
  "translation_status": "reviewed"
- "id": "appia-0023"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Durant bien des années l’auteur a consulté les autres et s’est interrogé lui-même. Irrésistiblement attiré par un inconnu qu’il devinait merveilleux, il désirait pourtant se munir de toutes les garanties possibles avant de s’engager envers lui. Il comprenait que cet engagement devrait être définitif ; il le sentait, d’abord obscurément ; mais l’appréhension qui l’étreignit, peu à peu, ne lui laissa bientôt plus de doute : il n’y avait pas de retour possible, et, néanmoins, il fallait partir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 15
    "pdf_page_end": 16
    "printed_page": "9"
    "printed_page_end": "10"
  "translation_ja": "長い年月、著者はほかの人に意見を聞き、自分に問いかけてきた。素晴らしいに違いないと予感する未知のものに抗いようもなく引かれながら、それに身を託す前に、できるかぎりの確かな裏づけを持っておきたかった。その決断は後戻りのきかないものになるとわかっていた。初めはおぼろげな予感だったが、しだいに胸を締めつけた不安が、まもなく疑いの余地をなくした。引き返すことはできない。それでも出発しなければならなかった。"
  "translation_status": "reviewed"
- "id": "appia-0024"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il partit donc. Derrière lui s’arrachaient, une à une, les attaches bien chères qui le reliaient à un passé, qu’il avait cru ne jamais devoir et surtout ne jamais pouvoir quitter."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 16
    "printed_page": "10"
  "translation_ja": "そこで彼は出発した。背後では、かけがえのない絆が一本また一本と引きちぎられていった。そこから離れる日が来るはずはない、何より、自分に離れられるはずがないと信じていた過去に、彼をつなぎ止めていた絆である。"
  "translation_status": "reviewed"
- "id": "appia-0025"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le but de cet ouvrage est d’offrir au lecteur une sorte de préparation au voyage, et de le faire ainsi participer à la documentation dont s’est chargé l’auteur, sans lui en communiquer les hésitations ou les angoisses. — Changer de direction, et abandonner le connu, que l’on aime, pour un inconnu que l’on ne peut encore aimer, c’est accomplir un acte de foi. Dans n’importe quel domaine de notre vie, une conversion, — c’est-à-dire justement et à proprement parler un changement de direction, — est donc un événement grave et toujours tragique, puisqu’il comporte de nombreux abandons, un dépouillement progressif, que rien ne semble devoir ni remplacer ni compenser. Il l’est d’autant plus que l’on ne saurait consentir à rien abandonner, ni à se dépouiller de rien, avant d’avoir constaté l’insuffisance ou l’indignité de son vêtement et de l’atmosphère que l’on a respirée jusqu’ici, vêtu de la sorte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 16
    "printed_page": "10"
  "translation_ja": "本書の目的は、読者にいわば旅支度をしていただくこと、そうして、著者が引き受けた下調べには加わっていただきながら、その迷いや苦悩まではお分けしないことである。進む方向を変え、よく知って愛しているものを捨て、まだ愛することのできない未知のものへ向かう。それは信じて踏み出す行為だ。だから、生き方を転じること、つまり文字どおり進路を変えることは、生活のどの領域でも重大な、そしてつねに悲劇的な出来事である。多くのものを断念し、身につけてきたものを少しずつ脱ぎ捨てねばならないのに、代わりになるものも、埋め合わせるものも見えてこないからだ。しかも、それまでの衣と、その衣をまとって吸ってきた空気とが、もはや足りないか、自分にふさわしくないと認めるまでは、何一つ手放すことにも脱ぎ捨てることにも同意できない。だからなおさら重大なのだ。"
  "translation_status": "reviewed"
- "id": "appia-0026"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour en revenir à ce que nous avons appelé notre documentation, il va de soi que l’auteur d’un guide bien conçu ne vous facilitera pas un voyage en vous décrivant le pays que vous devez parcourir, mais bien en vous en donnant des notions exactes, des notions techniques. A vous, ensuite, de savoir si vous avez bien fait d’entreprendre le voyage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 16
    "pdf_page_end": 17
    "printed_page": "10"
    "printed_page_end": "11"
  "translation_ja": "下調べと呼んだものに話を戻そう。よくできた案内書の著者が旅をしやすくしてくれるのは、あなたがこれから歩く国を言葉で描いてみせるからではない。その国について正確で実用のきく知識を授けてくれるからだ。その旅に出たのがよかったかどうかは、あとであなた自身が確かめることである。"
  "translation_status": "reviewed"
- "id": "appia-0027"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ici, l’auteur se trouve à la fois guide et voyageur ; et cette étude porte ce double caractère, qui implique une responsabilité et une confidence, un ensemble technique et un journal de route. Mais, comme elle traite plus particulièrement d’une question d’esthétique, le caractère technique l’emportera toujours. C’est là son fatum, puisque l’art ne se décrit pas ; et c’est par là que cette étude est tragique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 17
    "printed_page": "11"
  "translation_ja": "ここでは著者が案内人であると同時に旅人でもある。本書はその二重の性格を帯びる。案内を引き受ける責任と胸の内の打ち明け話、まとまった技術論と旅の日記とが同居するのだ。だが、とりわけ美学の問題を扱う以上、つねに技術的な性格のほうが勝るだろう。芸術は言葉で描写できない。それがこの研究の宿命であり、まさにそこが悲劇的なのだ。"
  "translation_status": "reviewed"
- "id": "appia-0028"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le lecteur voudra bien pardonner d’avance à l’auteur, et ne pas oublier que la plus grande et la plus profonde joie que l’art sache nous procurer est d’essence tragique ; car, si l’art a le pouvoir de nous faire « vivre » notre vie, sans nous en imposer simultanément les souffrances, il nous demande, en revanche, — pour le ressentir avec joie, — d’avoir souffert auparavant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 17
    "printed_page": "11"
  "translation_ja": "どうか読者には、あらかじめ著者をお許しいただきたい。そして、芸術がもたらしうる最も大きく深い喜びが、本質において悲劇的であることを忘れないでいただきたい。芸術には、人生に伴う苦しみをその場で強いることなく、私たちに自分の人生を「生き」させる力がある。しかし引き換えに、それを喜びとして受け取るために、私たちがすでに苦しみを経験していることを求めるのだ。"
  "translation_status": "reviewed"
- "id": "appia-0029"
  "section_id": "pref"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    ADOLPHE APPIA.
    Chexbres, mai 1919.
  "source_languages":

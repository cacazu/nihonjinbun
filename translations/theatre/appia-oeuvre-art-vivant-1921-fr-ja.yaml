  "source_text": "Le principe de la pesanteur et celui de la rigidité sont donc les conditions premières à l’existence d’un espace vivant! D’elles semblerait résulter encore un choix de lignes. Le corps possède une structure définitive et nous ne pouvons le modifier dans l’espace qu’au moyen du mouvement: les mouvements sont l’interprétation du corps dans la durée. Toujours en opposition avec le corps, le choix des lignes de l’espace est à notre disposition; c’est la compensation à leur immobilité ainsi que nous l’avons vu dans les beaux-arts. Il nous semblerait donc qu’en tenant compte des expressions de poids et de rigidité nous ayons le champ libre et puissions, comme les autres artistes, choisir et pousser fort loin la subtilité de nos intentions et de nos inventions. Et nous oublions, là, que nous ne sommes plus seuls devant un bloc de glaise ou un pan de muraille à décorer, tel le peintre et le sculpteur: nous sommes avec un corps vivant ; c’est à lui seul que nous avons affaire dans l’espace; c’est à lui seul que nous donnons des ordres; c’est par lui seul et au travers de lui seul que nous pouvons nous adresser aux formes inanimées. Sans le consentement du corps, toutes nos recherches seraient vaines et mort-nées. Dans la hiérarchie de l’art vivant, la place de notre imagination créatrice est entre le temps et le corps vivant et mobile; c’est-à-dire, entre la musique que nous composons et le corps qui doit s’en pénétrer et l’incarner. Nous sommes donc, en ce sens, avant le corps; au delà, c’est lui qui a la parole ; nous devenons son interprète seulement, et ne pouvons rien créer de notre propre chef. Notre soumission confiante et consciente à la musique, — expression de notre vie intérieure, — nous a conféré la puissance de dominer impérieusement le corps vivant. A son tour, le corps, de par sa complète soumission à notre appel, conquiert le droit d’ordonner l’espace qui l’entoure et le touche: directement, nous en sommes incapables."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

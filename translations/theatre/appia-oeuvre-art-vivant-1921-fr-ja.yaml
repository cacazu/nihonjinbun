    "printed_page_end": "43"
  "translation_ja": "この働きが感じられるのは二通りである。空間の硬い形に触れる身体を見て、線が対立するのがわかるか、それらの形が突きつける抵抗を、自分の身体で感じるか。前者は結果を見るだけだが、後者は身をもってする経験であり、それだけに決定的である。例を挙げよう。まっすぐ立った角柱があって、四隅の直角がはっきり見えるとする。柱は台座なしに水平な敷石の上に置かれている。安定し、動かしがたい印象を与える。そこへ身体が近づく。その動きと柱の静かな不動との対照から、すでに生き生きとした表現が感じられる。柱のない身体にも、向かってくる身体のない柱にも、それは生み出せない。さらに、身体のうねる丸い線は、柱の平面や角とは根本から異なり、その対照だけでも表現になる。身体が柱に触れると、対立はさらに際立つ。ついに身体は、動かないことによって揺るぎない支えとなる柱にもたれる。柱は抵抗する。柱が働くのだ！　この対立が、生命のない形に生命を与え、空間は生きたものになった！　では今度は、柱が見かけだけ固く、何かが少しでも触れると、そのものの形になじんでしまうとしよう。生きた身体は柱の柔らかい材の中にめり込み、生命をその中に葬る。そして同時に柱も殺してしまう。（「墓のように深い寝椅子」。ボードレール。）あまりに明らかで、これ以上の説明はいらない。床でも同じことが試せる。たとえば弾力のある床で、一歩ごとに足が沈み、すぐに持ち上がって平らに戻るとする。床は動くわけだが、その動きは生きているだろうか。生きた身体が通過すると、元に戻った床は、次にまた屈するのを待っている。何にも抵抗しないのだから、死んでいる。これほど死んだものはない。踏む足は抵抗に出会わず、筋肉の働きは文字どおり鈍る。身体が自分の意志で歩くのを感じず、左右の足を交互に上げて進ませる仕掛けが動いているようにさえ思えるだろう。こうして床も身体も機械のようになる。それは生命を根底から否定するものであり、滑稽さが生まれるところでもある（ベルクソン参照）。では次に、力に屈するか、屈するのを待つだけのこの消極的な床を、硬い敷石に替えよう。敷石は逆に、足を待ち受けて抵抗し、一歩ごとに足を押し返し、新たな抵抗に備えさせる。この床は硬さによって、全身を歩こうとする意志に引き込む。柱と同じく、床は生命に対抗することによって、身体から生命を受け取れるのである。"
  "translation_status": "reviewed"

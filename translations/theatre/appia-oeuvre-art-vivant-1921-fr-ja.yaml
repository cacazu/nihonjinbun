    "printed_page": "61"
  "translation_ja": "芸術について、いつも蒸し返される問題が一つある。いくら議論しても、前も後も同じところにいるのだから、めったに決着しない。私が言っているのは芸術作品の題材のことだ。芸術作品にはどこまで題材が要るのか。題名を求めるような題材が、である。"

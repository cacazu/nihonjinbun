  "source_text": "Actuellement, tout s’intitule; depuis une fresque majestueuse et parfaitement explicite par elle seule; jusqu’à la plus futile improvisation pianistique. C’est à croire que les artistes doutent fâcheusement de la portée de leurs œuvres et de leur intérêt. S’il est évident que de pauvres et prétentieux accords ont besoin d’être placés sur quelque terrasse de fête, ou paysage suggestif, pour prendre un semblant de droit à la vie, beaucoup d’œuvres riches et viriles sont abaissées au niveau de simples illustrations par des titres superflus. En musique, par exemple, l’indication de la tonalité, ou du numéro d’ordre, donne toujours une impression de noblesse qu’aucun titre ne saurait atteindre. La symphonie héroïque ne gagne rien à son intitulation ; et nous serions révoltés de nommer la neuvième différemment..."

    "printed_page": "52"
  "translation_ja": "頭上からの光が床や壁に落とす影のかたちだけで、つる棚だとはっきり示せる。そこには生きた身体も生命のない形も一緒に加わる。目に見えない遮りで作るこの影のかたちは、遮るものが動けば、動きに加わることさえできる。こうして思いどおりに影を動かせる。"
  "translation_status": "reviewed"
- "id": "appia-0121"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nos habitudes de théâtre rendent très difficile de se figurer la liberté conquise sur la mise en scène et le nouveau maniement des éléments de la représentation. Toujours nous nous voyons assis devant cet espace limité par un cadre et rempli de peintures découpées au milieu desquelles se promènent des acteurs séparés de nous par une ligne de démarcation parfaitement nette. Toujours la présence des pièces et des partitions dans nos bibliothèques veut nous convaincre de l’existence de l’œuvre dramatique hors de sa représentation. Nous lisons la pièce ou jouons au piano la partition, et sommes convaincus qu’en effet elle vit ainsi et que nous la possédons. D’où viendrait sans cela la renommée d’un Racine ou d’un Wagner? N’est-il pas évident que leur œuvre est sur ces feuillets de papier? Qu’importe alors leur représentation, puisque ce texte, à lui seul, peut rester immortel? Nous en sommes là! L’auteur dramatique choisit une forme d’art qui s’adresse à nos yeux, et sa notation sur papier suffit néanmoins à sa gloire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 73
    "printed_page": "67"
  "translation_ja": "劇場での見方に慣れすぎているため、演出を自分のものにして得られる自由や、上演の要素の新しい扱い方は、思い浮かべることさえむずかしい。私たちはいつも枠で区切られた空間の前に座り、その中には形に沿って切り抜いた絵がいっぱいあり、その間を歩き回る俳優は、はっきりした境界線で私たちから隔てられていると思い描く。書棚には戯曲と楽譜があり、演劇作品は上演されなくても存在できるのだと、いつも私たちを納得させようとする。戯曲を読み、楽譜をピアノで弾いて、たしかにそれだけで作品は生きており、自分たちはそれを手にしていると思う。そうでなければラシーヌやワーグナーの名声はどこから来たのか。彼らの作品がこうした紙の上にあるのは明らかではないか。テクストだけでも不滅でありうるのなら、上演はどうでもいいではないか。私たちはここまで来てしまった。劇作家は目に語りかける芸術を選んでいるのに、紙に記したものだけで名声を得るのだ。"
  "translation_status": "reviewed"
- "id": "appia-0147"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Que serait un Rembrandt si nous n’avions que le récit de ses tableaux? Les couleurs ne se décrivent pas, direz- vous? Pourquoi pas, si vous acceptez que les mots et les sons décrivent et expriment la vie ardente dans l’espace? Si cette vie-là n’est pour l’œuvre d’art dramatique qu’un moment secondaire, voire même négligeable, pourquoi en faire alors tant d’état, en remplir notre vie publique et lui élever des temples coûteux? Si tel est le cas, que la pièce soit alors considérée comme un roman dialogué ou une symphonie plus ou moins chantée, et n’en parlons plus; et regardons de la peinture et de la sculpture; notre corps sera toujours assez vivant pour nous porter à notre travail, nos plaisirs, notre nourriture et notre sommeil ; car il ne peut pas être un livre ou une partition ; il n’est du reste pas immortel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 73
    "pdf_page_end": 74
    "printed_page": "67"
    "printed_page_end": "68"
  "translation_ja": "仮に絵についての語りしか残っていなかったなら、レンブラントはどんな画家だったろう。色彩は言葉で描写できないと言うのか。だが、言葉や音で空間の燃えるような生を描き、表せると認めるのなら、色彩だって描写できると考えないのはなぜだろう。その生が演劇作品にとって副次的な、あるいは無視してもよい一部でしかないのであれば、なぜ大げさに取り上げ、私たちの公の生活をそれで満たし、金のかかる殿堂まで建てるのか。そういうことなら、戯曲は会話で書いた小説か、多少とも歌のついた交響曲と考えて、もうその話は終わりにしよう。それより絵画や彫刻を見よう。私たちの身体は、仕事や遊びに出かけ、食べ、眠るのに十分なほどにはこれからも生き続ける。身体は本にも楽譜にもなりえないし、そもそも不滅でもない。"
  "translation_status": "reviewed"
- "id": "appia-0148"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Le théâtre au XIXᵐᵉ siècle », par exemple ; ouvrez le livre ; il analyse la pièce écrite; rien de plus. Je connais un petit garçon qui ouvrait avec un battement de cœur les volumes dont le titre portait ce mot fatidique de théâtre. Il croyait toujours y trouver autre chose que des mots. Nous avons grandi; à nous, les mots nous suffisent. Nos auteurs dramatiques sont des écrivains de mots. Si, dans une pièce classique, — c’est-à-dire dont les mots écrits sont très connus et acceptés, — un acteur se laisse aller, par la joie de son jeu, à retrancher ou ajouter des mots parlés, l’on crie au sacrilège. Qu’en dirait Shakespeare, l’homme de la Vie? Le véritable artiste ne s’attache pas obstinément à l’œuvre d’art. Il porte l’art en son âme, toujours vivant. Une œuvre détruite, une autre viendra la remplacer. Pour, lui la Vie passe avant sa représentation fixée et immobile, quelle qu’elle puisse être ; et, à plus forte raison, avant le mot! Nous sommes si dégradés que le mot passe avant la vie, et, dans le cas particulier, avant l’œuvre elle-même; puisque nous sommes prêts à renoncer facilement à son existence intégrale dans l’espace, pourvu que sa présence abstraite sur les rayons de notre bibliothèque soit sauvegardée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 74
    "printed_page": "68"
  "translation_ja": "たとえば『十九世紀の演劇』とある本を開いてみよ。書かれた戯曲を分析しているだけだ。私は「演劇」という運命めいた言葉が表題に入った本を、胸を躍らせながら開く少年を知っている。そこに言葉以外の何かが見つかるといつも信じていた。私たちは大人になった。今の私たちには言葉だけで十分だ。私たちの劇作家は、言葉を書く人になった。古典劇、つまり書かれた言葉がよく知られ、そのとおりと認められている芝居で、俳優が演技の楽しさに任せ、実際に口にする言葉を減らしたり足したりすれば、冒瀆だと騒ぎになる。生命の人シェイクスピアなら何と言うだろう。真の芸術家は一つの芸術作品に頑なに執着しない。いつも生きている芸術を魂に持っている。一つの作品が壊れれば、別の作品が代わる。真の芸術家にとって生命は、それを固定して動かなくした表現がどんなものであれ、それより先に来る。まして言葉より先である。私たちは、言葉を生命より、ここでは作品そのものより先に置くほど、堕落してしまった。書棚に抽象的な形で残ってさえいれば、空間で完全な形を取ることは、たやすくあきらめられるのだから。"
  "translation_status": "reviewed"
- "id": "appia-0149"

  "source_text": "Il en sera de même pour tous les emplacements que l’auteur choisira, s’il ne part pas exclusivement du corps plastique et vivant de l’acteur. C’est de ce corps que le décor doit naître et s’élever, et non pas de l’imagination isolée du dramaturge; et nous savons maintenant que c’est lui seul qui a la parole vis-à-vis de l’espace."
  "source_languages":

    "precision": "page"
    "pdf_page": 13
  "translation_ja": |-
    ……そして君に、
    ああ、ウォルト・ホイットマン。
    君なら私をわかってくれるだろう。君は生きているのだから。いつまでも！
  "translation_status": "reviewed"

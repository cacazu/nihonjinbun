  "origin": "source"
  "source_text": "Tout cela à propos de couleur, dira-t-on? Oui; le sacrifice, presque complet, que l’art scénique doit faire de la peinture, est l’un des plus sensibles, — et pour quelques-uns, des plus durs, — qu’exigera la nouvelle économie. Il nous demande une profonde transposition de nos notions habituelles et de nos désirs; et les arguments les plus sérieux sont juste assez forts pour nous convaincre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 55
    "printed_page": "49"
  "translation_ja": "色について、そこまで言うのかと思う人もいるだろう。そうだ。舞台芸術が絵画をほとんど完全に手放すことは、新たな仕組みが求める犠牲のうち、最も強く感じられるものの一つであり、人によっては最もつらいものの一つである。慣れ親しんだ考えや欲求を根底から組み替えることを求められるのだから、どんなに真剣な議論も、私たちを納得させるにはようやく足りる程度でしかない。"
  "translation_status": "reviewed"
- "id": "appia-0114"
  "section_id": "color"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En analysant le caractère propre à la peinture, nous avons vu qu’il n’a rien de commun avec l’espace et la durée vivante. Il convient donc de distinguer nettement l’idée de la peinture, — groupements fictifs de couleurs, — et l’idée de la couleur en elle-même. La modification de Taine trouve là son application la plus radicale ; car non seulement c’est au charme de la peinture qu’il faut renoncer, mais, et surtout, à un nombre incalculable d’objets que seule elle peut nous présenter. L’appauvrissement est ainsi extraordinaire, et suppose une compensation proportionnée à notre sacrifice. La moindre concession de l’artiste créateur nous refuserait la vie de l’art; sa révélation serait illusoire; elle se bornerait à recouvrir d’oripeaux nos murailles, au lieu de les pénétrer de lumière."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 55
    "printed_page": "49"
  "translation_ja": "絵画に固有の性質を考え分けてみると、それが生きた空間や持続と何も共有しないことがわかった。そこで、色を架空の形で組み合わせる絵画と、色それ自体とを、はっきり区別しなければならない。テーヌの言う「変更」はここで最も根本的な形を取る。あきらめるものは絵画の魅力だけではなく、何より、絵画にしか見せられない数え切れない事物なのだ。このように失うものは並外れて大きく、その犠牲に見合った埋め合わせが要る。創る者がわずかでも妥協すれば、私たちは芸術の生命を受け取れない。その啓示は見かけだけに終わり、私たちを囲む壁を光で貫く代わりに、まがい物の飾りで覆うだけになるだろう。"
  "translation_status": "reviewed"
- "id": "appia-0115"
  "section_id": "color"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour la première fois, et à propos de peinture, nous touchons à la source même de l’art dramatique. Jusqu’ici les principes élémentaires que nous avons exposés, et défendus, pouvaient s’appliquer à notre art dramatique à la manière dont le contrepoint rigoureux trouve son écoulement et sa libération dans la composition musicale libre; et nous aurions pu les enfreindre à notre gré, comme un peintre modifie les proportions du corps pour augmenter, occasionnellement, leur expression, mais, cela, toujours à condition qu’il connaisse parfaitement ces proportions. Avec la peinture, il n’est plus de choix pour nous ; c’est le principe même de la peinture qui s’oppose à son emploi sur la scène. L’art dramatique n’est un art, dans la force littérale du terme, qu’en renonçant à la peinture. C’est pour lui une question de vie ou de mort jusque dans sa conception même. Il est dans l’obligation absolue de remplacer, d’une façon ou de l’autre, ce que nous attendions du décor peint. La réforme concerne donc le drame lui-même. Mais, avant de l’aborder du point de vue général que nous avons atteint par nos recherches, quelques exemples et considérations de détail la rendront plus sensible."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 55
    "pdf_page_end": 56
    "printed_page": "49"
    "printed_page_end": "50"
  "translation_ja": "絵画をめぐって、私たちは初めて演劇の源そのものに触れる。これまでに述べ、擁護してきた基本原理は、厳格な対位法が自由な作曲のなかで流れ出て解き放たれるように、私たちの演劇に生かすことができた。画家が身体の比率を知り尽くしていれば、ときにその表現を強めるために比率を変えられるように、私たちも必要に応じて原理を破ることができた。絵画に関しては、もう選択の余地がない。絵画の原理そのものが、舞台で絵画を用いることと相いれないからだ。言葉の文字どおりの意味で演劇が芸術となるのは、絵画を手放して初めてである。それは構想にまで及ぶ、生きるか死ぬかの問題だ。描かれた装置に期待してきたものを、何らかの形で置き換えることは絶対に必要である。だから改革は劇そのものに及ぶ。だがここまでの考察でたどり着いた一般的な見地からこれを論じる前に、いくつかの例と細部の考察によって、問題を具体的に感じ取れるようにしよう。"
  "translation_status": "reviewed"
- "id": "appia-0116"

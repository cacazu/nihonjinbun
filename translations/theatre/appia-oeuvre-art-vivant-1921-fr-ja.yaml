    "printed_page": "61"
  "translation_ja": "上演を形づくる諸要素が技術のうえで融合するのは、演劇の出発点にある考えからだ。それは作者の構えにかかっている。その構えこそが作者を自由にする。それがなければ作者は芸術家ではない。"

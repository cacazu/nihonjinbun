    "precision": "page"
    "pdf_page": 32
    "printed_page": "26"
  "translation_ja": "俳優が片方の手に束ねる三つの要素、すなわち動かない三つの芸術、空間の諸芸術を分析してきた。ではもう片方の手で俳優が引き寄せ、抗いがたくそれらに結びつけようとする時間の諸芸術、台本と音楽についても、同じようにはっきりさせていこう。"
  "translation_status": "reviewed"
- "id": "appia-0067"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il faut rappeler ici qu’en examinant le texte et la musique du point de vue de la mise en scène nous n’abordons pas, pour le moment du moins, les questions de composition dramatique, littéraire ou musicale en soi."
  "source_languages":
  - "fr"
  "source_locations":

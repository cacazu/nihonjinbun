  "translation_ja": "画家はなんと幸せなのだろう。カンヴァスをアトリエへ持ちこみ、そこでパレットと結びつけ、親しい者だけの場でその婚礼をとり行える。劇作家は原稿を劇場へ届けるが、この結びつきは神秘や静かな集中のなかで、ましてや沈黙のなかで実現するのでは決してない。両者は互いを人づてにしか知らず、顔を合わせてはおかしな発見ばかりする。こうあるべきなのだ、昔からそうだったしこれからもそうなのだ、と言い聞かされて、二人ともあきらめる。花嫁である舞台は、相手の劇の好みなどかまわずに着飾る。劇は乱暴に扱われ、しわくちゃにされ、切り刻まれさえして、ついには花嫁のけばけばしい衣装に半ば隠れてしまう。そこで招待客が通され、これほどの不幸を生んだ作者の目の前で宴はたけなわになる。作者は拍手と騒ぎに、自分の恥を忘れる。この気の毒な人が、さっきまで登場人物でいっぱいだった仕事部屋へ戻って見つめるのは、もう落書きされた紙だけだ。舞台へ戻れば、もっとひどく塗りたくられた幕の、有害なほこりを浴びるだけである。両者の間をいつまでもさまよえば、作品がとこしえに手をすり抜け、路上に滑り落ちてゆくのを感じる。これが劇作家の作品である。だがほかの芸術家に話を戻そう。彼らの生は、味方にも制約にもなる自分たちの「仕事」の条件と一つになっている。この点は画家と同じだ。最高の芸術的な望みを、自分の芸術に固有の実現手段から切り離そうとは、思いもしないだろう。画家にとって自分を待つ筆、絵の具、平面は、いわば考え、作品を思い描くその方法である。それらをよく知り、ほかに手段を探さない。ほかの芸術家も同じである。ただ一人だけ例外がいる。名もない芸術の、名もない芸術家だ。劇作家は、私たちが今の形で差し出す舞台を、長く頼れる技術上の材料とは決してみなさない。そこに合わせることは承知し、芸術家としての考えをこのみじめな型に流し込みまでする。それしか多少の調和を得るすべがないから、さほど苦にはしない。使ってよい絵の具が足りず、ばかばかしい寸法の、いつも同じ大きさのカンヴァスしか許されない画家のようなものだが、実際にはさらに悪い。天才画家は、技術の本質的な原理がゆがめられないかぎり、つまり筆と絵の具と平面があるかぎり、表現する道を必ず見つける。ところが今の舞台が劇作家に差し出すのは、技術上の矛盾である。舞台はそのままでは劇作品に捧げられる場ではない。それを受け入れ、そういう場とみなすことまで、考えられないような無理強いによって求められている。不幸にもそれが習慣になった。私たちはそうした手段で作品を思い浮かべる。もっと重大なのは、「芝居になっていない」と言われないように、劇作家がそうした手段で作品を構想することだ。「芝居になっていない」とは決まり文句だが、そう非難されるのは、決して私たちの舞台ではない。いつも劇作家だけなのだ。だから彼は名もない芸術家である。技術を支配するのではなく、舞台の技術に支配されている。芸術家は自由でなければならないが、劇作家は奴隷だ。現状では芸術家ではなく、また芸術家になることもできない。"

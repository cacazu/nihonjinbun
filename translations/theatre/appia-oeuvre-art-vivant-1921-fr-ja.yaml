  "translation_ja": "音楽は、動かない芸術と生きた芸術とのあいだの、例外的な位置にあると述べた。ほかの芸術が空間の中でしか与えてくれないものを、時間の中で動き出す生命に移し替える。詩人も、別の資格でこの位置を共有している。その役割は、音楽家ほど技術に限られない。形に、頭で理解できる面がなければならないところで、形を導く。詩人は題であり、生きた建物を造るための足場なのである。建物が完成すると、姿を消したように見える。だが建材が上がってゆくあいだ、その重みを支え、全体の比率を決めたのは詩人だ。比率が実際に生まれる前に、それを空間に示しさえした。詩人なしに建物はなかっただろう。詩人はその建物を可能性のうちに宿していた。いまは反対に、建物が精神としての詩人を宿している。生きた芸術作品の形のいたるところに、詩人は存在する。一つの音にも、一つの身ぶりにも、詩人を宿さないものはない。こういうすばらしい存在の仕方のために、詩人は、まずは自らが足場にすぎないことを承知し、そのあとで自分をすっかり与えねばならない。とはいえ、よく整えられた建物なら、建物の構造も、材料の性質と重さも、はっきり表されなければならない。この点で詩人は自分自身の生を少し残す。そのしるしが、生きた詩の言葉となる。そのしるしには音楽家も従わなければならない。しるしがあって、聖域を立ち上げられたのであり、それを支え、釣り合いを保つのも、そのしるしだ。しるしは音楽が生命を吹き込む有機体の骨格を明らかにする。表現そのものではなく、その支えである。これほど緊密で、互いに従い合う共同作業は考えられない。こうして生きた芸術作品の建築家は、詩人と音楽家に分かれる。一方がほかの一方を成り立たせ、どちらか一方だけでは決してありえない。二人の釣り合いは、同じ分量だけ関わることにあるのではない。むしろ分量はいつも変わり、釣り合いの法則、つまり重心によって決まる。音楽家が一人で歌おうとすれば、建物は危うくなる。詩人が一人で語ろうとすれば、多少飾りのついた足場しか残らないおそれがある。詩人はいわば容器、あるいは担い支える手であり、音楽家は泡立つ液体、あるいは丹念に加工された貴重な材料である。身体が二人を結びつけることで、生きた芸術作品は生まれる。あまりにも完全な結びつきなので、二人とも、動かない芸術では実現しようとしてもむだな題材を扱い、見る力を無理に抑えていたものから解放できる。"

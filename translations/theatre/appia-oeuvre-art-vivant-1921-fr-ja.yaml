  "translation_ja": "ところが、芸術作品としての身体を見るだけで、すでにそれほどの影響があったなら、芸術としての動きを自分の身体で実際に経験したときには、どんな影響があるだろう！　建築家は、今度は自分自身のため、この空間の配列が欲しいと思い、以前は美しくもっともだと感じていた別の配列を拒むようになる。彫刻家はどうか。自分の肉体で経験した動きを石の中に閉じ込めるという仕事は、おそろしく、痛みを覚えるほどのものとなり、その責任を深く感じるだろう。動かないという原理が彫刻家に要求する総合は、ますます厳格になる。それでも、生きた形がもたらした幸福な時間を一秒でも固定したくなることがあれば、昔の無自覚さが苦い皮肉となって戻ってきたように思え、軽蔑して退けるだろう。退けないのであれば、自らの無力を証明することになる。生きた芸術からどの程度の影響を受けるかが、その人がどれほど芸術家であるかの試金石になるのだ。"
  "translation_status": "reviewed"
- "id": "appia-0163"

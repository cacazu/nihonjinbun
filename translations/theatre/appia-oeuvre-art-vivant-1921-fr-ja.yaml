  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le décor, nous le savons maintenant, n’est pas seulement une question d’opportunité, comme on voudrait nous le faire croire; au théâtre nous ne sommes pas au cinématographe; les lois qui régissent la scène sont avant tout d’ordre technique. Vouloir plus ou moins tout représenter, et invoquer, pour cela, la liberté de l’artiste, c’est sortir délibérément l’art dramatique de ses limites, et, par conséquent, du domaine de l’art. Tant que l’auteur en reste à l’exposé des caractères et de leur réaction, il se trouve relativement seul vis-à-vis de son œuvre. Mais, du moment où il se sert de l’influence du milieu pour varier ses motifs, il rencontre la mise en scène et doit compter avec elle. Actuellement, il ne se soucie que des possibilités de la représentation scénique des choses; il rejettera tel projet comme trop difficile à représenter, et, en général, restreindra son choix à ceux des emplacements qu’il sait faciles à réaliser et propres à conserver l’illusion qui lui est chère. Comme l’autruche, il veut ignorer le danger. Pourtant, comment ne pas s’apercevoir que la technique décorative est réglée par d’autres lois que celles des possibilités ? En jetant l’argent par les fenêtres l’auteur peut tout obtenir sur la scène. Les Romains faisaient passer une rivière dans le cirque, au milieu d’une végétation peuplée comme une forêt vierge. Le duc de Meiningen achetait des musées, des appartements, des palais, pour réaliser deux ou trois scènes, et le résultat était regrettable. — Non ; le décor est réglé par la présence du corps vivant ; ce corps se prononce sur les possibilités de réalisation ; c’est tout ce qui s’oppose à sa juste présence qui est « impossible » et qui supprime la pièce."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 65
    "pdf_page_end": 66
    "printed_page": "59"
    "printed_page_end": "60"
  "translation_ja": "装置は、そう思わせようとする人もいるが、都合がよいかどうかだけの問題ではない。これはもうわかっている。劇場は映画館とは違う。舞台を律する法則は、何よりも技術上のものである。何でもおおかた舞台に出そうとして、そのために芸術家の自由を持ち出すのは、演劇をあえてその限界から外し、芸術の領域から外すことだ。作者は人物の性格と応じ方を示すだけの間は、一人で作品に向き合える。だが劇のきっかけをさまざまにするため環境の影響を使うようになると、演出に出会い、それを勘定に入れなければならない。今の作者が気にするのは、物を舞台で表せるかどうかだけである。表すのが難しすぎる案を捨て、一般には実現がたやすく、自分の大切にする錯覚を保てる場所だけに、選択を絞る。ダチョウのように、危険を見ないようにしているのだ。だが、装置の技術を律するのは、できるかどうかとは別の法則だと、どうして気づかずにいられよう。金を湯水のように使えば、舞台では何でも手に入る。ローマ人は、原生林のように草木の茂る闘技場の中に、川を流した。マイニンゲン公爵は二つか三つの場面を作るため、博物館、邸宅、宮殿を買い、残念な結果に終わった。いや、装置を律するのは生きた身体がそこにいるという事実だ。実現できるかどうかの判断を下すのは身体である。身体があるべき姿でそこにいるのを妨げるものはすべて「不可能」であり、芝居を成り立たなくする。"
  "translation_status": "reviewed"
- "id": "appia-0132"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans le choix de son sujet, l’auteur n’a pas à interroger le metteur en scène, mais bien l’acteur; par quoi il ne faudrait pas entendre qu’il ait à demander conseil à tel ou tel acteur ! C’est l’Idée de l’acteur vivant, plastique et mobile, qui doit être son guide. Il doit se demander si, par exemple, la nécessité d’indiquer avec insistance tel milieu convient à la présence de l’acteur ; et non plus si cette indication est seulement « possible ». Du point de vue technique, son choix ne concerne que l’acteur; du point de vue dramatique, il concerne le plus ou moins d’importance qu’il veut ou doit donner à l’influence du milieu. Aux deux points de vue il doit choisir en pleine connaissance de cause, et, par conséquent, connaître parfaitement la hiérarchie scénique normale et ses résultats. Sa technique d’artiste détermine son choix. Le peintre ne se désole pas de ce que le relief plastique lui est refusé. Sa technique n’est pas une question de possibilités de cet ordre. Ainsi doit-il en être pour l’auteur dramatique. Il n’a pas à se chagriner de ne pouvoir placer son personnage dans une cathédrale, mais bien de l’embarrasser, au contraire, de contingences qui nuisent à sa pure apparition. Le romancier, le poète épique, peuvent évoquer leur héros par la description de son milieu; leur œuvre est un récit, et l’action se place dans le récit, puisqu’elle n’est pas vivante. L’auteur dramatique, lui, n’a rien à raconter; son action vivante se trouve libre, nue; toutes contingences tendent à la rapprocher du récit, — roman ou poème épique, — et à l’éloigner de l’art dramatique. Plus l’indication du milieu sera nécessaire à l’action, — c’est-à-dire à rendre plausibles les caractères, les circonstances et les réactions, — plus elle s’éloignera de l’Art vivant. La raison en est purement et simplement technique, et personne n’y peut rien changer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

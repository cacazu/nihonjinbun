  "source_text": "Nous avons mentionné le fait que l’œuvre d’art vivant est la seule qui existe complètement sans spectateurs (ou auditeurs) ; sans public, parce qu’elle le contient déjà implicitement en elle; et, que cette œuvre étant vécue dans une durée déterminée, ceux qui la vivent — les exécutants et créateurs de l’œuvre — lui assurent, par leur activité seule, une existence intégrale. En venant bénévolement nous en convaincre et la contempler, nous n’y ajoutons rien et devons en être conscients; l’apport spécifique, l’activité personnelle si chère à l’artiste, et qu’il réclame pour sa part devant toute œuvre d’art, ne nous est plus demandée. Mais, d’autre part, l’art vivant ne nous autorise pas non plus la mortelle passivité du public de nos théâtres. Qu’avons-nous donc à faire pour participer néanmoins à sa vie? quelle sera notre attitude vis-à-vis de lui ? Tout d’abord ne pas nous sentir vis-à-vis de lui. L’Art vivant ne se représente pas. Nous le savons déjà; il nous reste à l’éprouver. Comment ? En nous détournant de lui comme inabordable ? Mais, nous ne le pouvons pas; dès le moment où il est, nous sommes avec lui, en lui. Nous y refuser serait nous désavouer nous-mêmes, comme, hélas! nous le faisons, déjà, dans tant d’occasions de notre vie sociale. Ne laissons pas, au moins, cette floraison miraculeuse s’épanouir sous nos yeux seulement ! Tentons la grande expérience et sollicitons les créateurs de l’œuvre de nous prendre avec eux ! Ils chercheront alors quelque trait d’union qui transporte en nous la divine étincelle. Si petite soit notre part de collaboration dans l’œuvre, nous vivrons avec elle, et nous découvrirons que nous sommes des artistes."

  "source_text": "L’espace vivant sera donc, pour nos yeux, et grâce à l’intermédiaire du corps, la plaque de résonance de la musique. On pourrait même avancer le paradoxe que les formes inanimées de l’espace, pour devenir vivantes, ont à obéir aux lois d’une acoustique visuelle."

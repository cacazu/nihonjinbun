    "precision": "page"
    "pdf_page": 59
    "printed_page": "53"
  "translation_ja": "絵画での架空の役割を手放すことで、色彩は空間の中で生命を得る。だがそれによって、色の重みをそのつど決める光と立体の形とに頼ることになる。生きたものとして実在するようになったために、カンヴァスの上で架空の形で表していた物を失う。だから舞台の上で物を表したければ、色彩にそれを求めてはならない。（いま見たように、観客が見当をつけるのに欠かせない手がかり、すなわちしるしは例外である。）"

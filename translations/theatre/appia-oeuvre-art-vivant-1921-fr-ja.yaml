    "pdf_page": 36
    "printed_page": "30"
  "translation_ja": "音楽に戻ろう。音には、音の並びを決めるような意味がない。それらを組み合わせるのは、音楽家の感性そのものの自発的な働きである。楽譜の紙に抽象的に記譜しても、私たちに音の意味が伝わるのではない。音の長さと強さを数学的に定めた配列が伝わるだけだ。その長さは、まず作曲家の理解力を経るのではなく、心の感じ方に直接左右される。だから楽音の持続を創り出すのは、音楽家の感性、その人の心がどれほど動くかなのである。人の感情はふつうの時間から独立していることを、私たちは知っている。こうして音楽家は、たしかにふつうの時間の中に収まりながら、美的にはそれから独立した、虚構の時間を創り出す。そして自分の創り出したこの虚構の時間を、最終的な形にとどめるという、奇跡に近い力を持つ。だから音楽家は、自分の音楽が続く間、私たちにも、自分の感情が続く長さにしたがって時間を測り、感じることを求める。持続があるのだから本物の時間でありながら、にもかかわらず虚構である時間の中に、私たちを置くのだ。音楽の美的な現実性は、この点であらゆる芸術を上回る。魂がじかに創り出すのは、音楽だけである。"
  "translation_status": "reviewed"
- "id": "appia-0076"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On m’alléguera que son exécution constitue bien un intermédiaire entre elle est nous. — Non pas. L’exécution correcte d’une partition est à la musique ce qu’est à une fresque, par exemple, l’emplacement et l’éclairage appropriés. La musique représente le temps, sans autre intermédiaire qu’elle-même; c’est là son existence formelle, pour l’art dramatique en particulier. La musique est l’expression immédiate de nos sentiments; c’est là sa vie cachée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 36
    "pdf_page_end": 37
    "printed_page": "30"
    "printed_page_end": "31"
  "translation_ja": "演奏こそ、音楽と私たちとの仲立ちになるではないか、という反論があろう。そうではない。楽譜を正しく演奏することは、音楽にとって、たとえばフレスコにふさわしい場所と照明を用意するようなものだ。音楽は、自分自身のほかに何の仲立ちもなく、時間を表す。そこに、特に演劇芸術にとっての、音楽の形式上の存在がある。そして音楽は、私たちの感情をそのまま表すものである。そこに、音楽の隠れた生命がある。"
  "translation_status": "reviewed"
- "id": "appia-0077"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’aphorisme dangereux de l’art dramatique résultant de la réunion de tous les arts, nous a obligés d’analyser la nature particulière à chacun d’eux, de ce point de vue et de ce point de vue seulement. Nous pouvons entrevoir, maintenant, le travail qui nous reste à faire. — Pour s’unir et, par conséquent, se subordonner les uns aux autres, quels sacrifices nos arts doivent-ils consentir, et quelles compensations nous offriront-ils dans ce nouveau mode d’existence?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 37
    "printed_page": "31"
  "translation_ja": "演劇芸術はすべての芸術の結合から生まれる、という危険な格言のおかげで、私たちはこの観点からだけ、諸芸術それぞれに固有の性質を分析することになった。いまでは残る仕事のおおよそが見える。さまざまな芸術が一つになり、だからこそ互いに従属するためには、どんな犠牲を受け入れねばならないのか。その新しいあり方の中で、犠牲の代わりに何を私たちに与えてくれるのか。"
  "translation_status": "reviewed"
- "id": "appia-0078"
  "section_id": "duration"
  "kind": "heading"
  "origin": "source"
  "source_text": "La durée vivante."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 38
    "printed_page": "32"
  "translation_ja": "生きた持続。"
  "translation_status": "reviewed"
- "id": "appia-0079"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Quand la musique atteint sa plus noble puissance, elle devient forme dans l’espace. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 38
    "printed_page": "32"
  "translation_ja": "「音楽が最も気高い力に達するとき、それは空間の中の形となる。」"
  "translation_status": "reviewed"
- "id": "appia-0080"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici plus d’un siècle que Schiller a lancé dans le monde ce cri prophétique; et l’on peut se demander lequel de ses contemporains aura su le comprendre. Lui-même, a-t-il bien saisi la portée de son affirmation, et n’est-elle pas un éclair de l’intuition, plus encore que la décision d’un esprit réfléchi? Il est probable que c’est l’étude de l’Art antique qui l’aura poussé à cette extrémité de visionnaire. Peut-être aura-t-il commencé par voir un rhapsode dans le feu large ou rapide de l’improvisation mimée ; ou bien se sera-t-il représenté vivement quelque acte religieux ou dramatique de l’ancienne Grèce? Comment aurait-il trouvé une semblable conséquence dans la vie mesquine et conventionnelle de son temps et de son pays d’alors?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 38
    "printed_page": "32"
  "translation_ja": "シラーがこの予言の叫びを世に放ってから、もう一世紀以上になる。同時代の誰にこれが理解できただろう。彼自身、この断言がどこまで及ぶかをよくわかっていたのか。それは考え抜いた末の判断というより、直観のひらめきではなかったか。おそらく古代の芸術の研究が、この幻視の極みに彼を押しやったのだろう。ひょっとすると初めに浮かんだのは、身ぶりを交えた即興におおらかに、あるいは素早く打ち込む吟誦詩人の姿だったかもしれない。あるいは古代ギリシアの祭儀か劇の一場を、ありありと思い描いたのだろうか。彼の時代、彼の国の、狭く因習にとらわれた暮らしの中から、どうしてこのような結論が出せただろう。"
  "translation_status": "reviewed"
- "id": "appia-0081"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Schiller dit bien, — et seulement, — « forme dans l’espace ». Il ne précise pas; sa vision revêt le caractère incomplet et énigmatique commun à toute prophétie. Qui sait? Peut-être la contemplation d’une gravure du Parthénon l’a-t-elle inspiré; son regard allait de colonne en colonne, comme en une succession d’accords muets; la frise, le fronton ont témoigné à ses yeux d’une ordonnance définitive, d’une harmonie désormais fixée. En descendant au sol il aura ressenti le poids de la construction reposer directement, sans soubassements intermédiaires, sur les dalles du temple, par les bases frustes et sincères des colonnes... Une voix lui a-t-elle, alors, murmuré: « ce temple est vide » ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 38
    "pdf_page_end": 39
    "printed_page": "32"
    "printed_page_end": "33"
  "translation_ja": "シラーは確かに「空間の中の形」と言う。ただそれだけだ。細かくは述べない。その幻視は、あらゆる予言と同じように不完全で謎めいている。誰にわかるだろう。パルテノン神殿の版画を眺めて思いついたのかもしれない。彼の目は、音のない和音をたどるかのように、柱から柱へ移った。帯状の彫刻と破風には、これで決まった秩序、もはや動かぬ調和が見えた。地面へ目を下ろすと、建物の重みが、素朴で飾り気のない柱の根元を通り、間に土台を挟まず、神殿の敷石にじかにかかるのを感じたのだろう。そのとき、「この神殿は空っぽだ」と、どこかから声がささやいたのだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0082"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais voici une théorie d’officiants qui gravit les degrés de l’Acropole; elle s’approche des colonnes... et du poète; les pieds nus prennent possession des degrés ; les corps, devinés dans le pli des tuniques, se mesurent au contact des plis cannelés des colonnes... ! Schiller aurait-il compris? — Il s’est ensuite transporté, sans doute, sur les gradins du théâtre; il aura cherché à se représenter les évolutions du chœur. Là, c’est l’espace libre et nu autour de l’autel. Plus de colonnes bienveillantes; plus de jalons révélateurs... — Comment savoir, alors? Comment mesurer et goûter les proportions changeantes, et qui semblent nous échapper, à peine entrevues? Hors du temple, serions-nous livrés à l’arbitraire, sans contrôle possible?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 39
    "printed_page": "33"
  "translation_ja": "ところが見よ。祭儀をつかさどる一行がアクロポリスの階段を上り、柱へ、そして詩人へ近づいてくる。裸足が石段を踏みしめ、衣のひだ越しに見て取れる身体が、柱に刻まれた溝のひだに触れ合うようにして、自らの寸法を知る……！　シラーはわかっただろうか。それから彼はきっと劇場の段状の客席に移り、合唱隊の動きを思い描こうとしたのだろう。そこにあるのは、祭壇のまわりの、何も置かれていない自由な空間だ。導いてくれる柱も、教えてくれる目印ももうない。それならどうすればわかるのか。ちらりと見えたそばから逃げてゆくような、移り変わる比率をどう測り、どう味わえばよいのか。神殿の外へ出れば、何をよりどころにもできず、恣意に委ねられるだけなのか。"
  "translation_status": "reviewed"
- "id": "appia-0083"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est, j’en ai la conviction, l’ardent désir de saisir l’insaisissable relation des sons et des formes, la divine et fugitive étincelle allumée par leur contact, l’inimaginable volupté que procure leur identité constatée, qui a contraint le grand visionnaire à cette affirmation, que rien autour de lui ne venait justifier. Il nous a légué son désir et son appel: nous avons le bonheur infini de pouvoir maintenant lui répondre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 39
    "printed_page": "33"
  "translation_ja": "私にはこう思える。音と形の捉えがたい関係、その二つが触れたときにともる神々しい束の間の火花、両者が一つだと知るときの想像もできないほどの歓び。それらを捉えたいという切実な願いが、この偉大な幻視者に、まわりの何ものも裏づけてはくれない断言をさせたのだ。彼はその願いと呼びかけを私たちに遺した。いま私たちはそれに答えられるという、この上ない幸せに恵まれている。"
  "translation_status": "reviewed"
- "id": "appia-0084"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Non, ce ne sont pas les proportions et les lignes du temple qui ordonnent le développement des théories solennelles ou joyeuses; les degrés de l’Acropole ne dictent pas aux pieds nus leur démarche ; au théâtre, dans le libre espace autour de l’autel, le chœur n’évolue pas sur un rythme arbitraire. Un principe d’ordre et de mesure se trouve là, tout présent, toujours présent et tout puissant; l’espace même lui doit soumission. C’est lui qui a édifié le temple, mesuré les colonnes et les degrés. Invisible il parle à l’espace visible; il en anime les formes, en magnifie la ligne. Son interprète est le corps humain, le corps vivant, mobile; de ce corps il a puisé la vie. Ce principe est vivant; c’est par la vie qu’il ordonne; son langage est compris par le corps, qui le transmet ensuite, vibrant, à tout ce qui l’entoure."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 39
    "pdf_page_end": 40
    "printed_page": "33"
    "printed_page_end": "34"
  "translation_ja": "そうではない。荘厳であれ歓びに満ちていようと、行列の進み方を整えるのは神殿の比率や線ではない。アクロポリスの石段が裸足の歩き方を命じるのでもない。劇場の祭壇を囲む自由な空間で、合唱隊は勝手なリズムで動くわけではない。秩序と尺度の原理がそこにある。その力のすべてをたたえ、いつもそこにあり、何ものにも勝る。空間そのものさえ、それに従わなければならない。神殿を建て、柱と石段を測ったのはこの原理だ。目には見えないが、見える空間に語りかけ、その形に生命を与え、線を際立たせる。その通訳は人間の身体、生きて動く身体だ。この原理はその身体から生命を汲み取った。原理そのものが生きており、生命によって秩序を与える。身体はその言葉を理解し、今度は自ら震えながら、まわりのすべてにそれを伝える。"
  "translation_status": "reviewed"
- "id": "appia-0085"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Quand la musique atteint sa plus noble puissance elle devient forme dans l’espace. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 40
    "printed_page": "34"
  "translation_ja": "「音楽が最も気高い力に達するとき、それは空間の中の形となる。」"
  "translation_status": "reviewed"
- "id": "appia-0086"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La matière inanimée, le sol, les pierres, n’entendent pas les sons; mais le corps les entend !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 40
    "printed_page": "34"
  "translation_ja": "生命のないもの、地面や石に音は聞こえない。だが、身体には聞こえる！"
  "translation_status": "reviewed"
- "id": "appia-0087"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mieux l’on sait obéir, mieux l’on sait commander. La subordination réciproque restera toujours la seule garantie sérieuse dans une collaboration. Se subordonner implique un travail d’analyse: qu’ai-je à recevoir, et que dois-je donner en retour? Toutes les erreurs sociales et esthétiques viennent de ce que l’on a négligé, plus ou moins volontairement, ce travail préliminaire. Le dévouement déplacé ne consent pas à recevoir. L’égoïste veut conserver pour lui seul sa richesse; son mobile est souvent noble : c’est pour offrir plus tard davantage qu’il accumule son trésor. Pourtant la direction de son geste reste la même, et son offrande à la coopération ne se produit jamais. — Si la musique veut ordonner la mobilité du corps, elle doit s’informer, premièrement, de ce que le corps attend d’elle. Ensuite elle s’interrogera sur ce point, et cherchera à développer en elle-même la faculté qu’on lui demande, et qui dépendra strictement de ce qu’on lui offrira en retour. La musique ne peut rien donner de vivant au corps si elle n’en reçoit premièrement la vie. Cela est évident. Le corps abandonne donc sa vie propre à la musique, pour la recevoir à nouveau de sa main, mais ordonnée et transfigurée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 40
    "printed_page": "34"
  "translation_ja": "よく従うことを知るほど、うまく指図することができる。協働を確かなものにするのは、互いに相手に従うことだけだ。従うとは、よく考え分けることでもある。私は何を受け取り、代わりに何を与えるべきか。社会や美の上でのあらゆる誤りは、多かれ少なかれ承知のうえで、この下調べを怠ってきたことに由来する。見当違いの献身は、相手から受け取ろうとしない。利己的な人は、自分の富を自分一人のものにしたがる。その動機はしばしば気高い。後でもっと多く差し出すため、財を積むというのだ。それでも、その手は同じ向きに動くばかりで、協働のための贈り物はいつまでも差し出されない。音楽が身体の動きを整えようとするなら、まず身体が音楽に何を求めるかを知らねばならない。それから自らに問い、求められた力を自分のうちで育てようとする。その力は、引き換えに何を差し出されるかに厳密に左右される。身体からまず生命を受け取らなければ、音楽は身体に何一つ生きたものを与えられない。当然のことだ。それゆえ身体は、自らの生命を音楽に明け渡す。秩序を授かり、姿を一新した生命を、音楽の手からもう一度受け取るためである。"
  "translation_status": "reviewed"
- "id": "appia-0088"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La durée des sons musicaux s’extériorise, dans l’espace, en proportions visuelles. Si la musique n’avait qu’un son et qu’une durée pour ce son, elle resterait captive du temps. Ce sont les groupements de sons qui tendent à la rapprocher de l’espace. Les durées variables de ces groupements se combinent entre elles à l’infini, et produisent ainsi le phénomène du rythme, lequel non seulement touche à l’espace, mais peut s’unir indissolublement à lui par le mouvement. Et le corps est porteur du mouvement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 40
    "pdf_page_end": 41
    "printed_page": "34"
    "printed_page_end": "35"
  "translation_ja": "音楽の音の持続は、空間では目に見える比率となって外に現れる。音楽に一つの音と、その音の一つの長さしかなければ、音楽は時間のとりこにとどまるだろう。音のまとまりがあるからこそ、音楽は空間に近づいてゆく。まとまりごとに異なる長さは果てしなく組み合わさって、リズムという現象を生む。リズムは空間に触れるだけでなく、動きを通して空間と切り離せぬほど結びつくこともできる。そして動きを担うのは身体である。"
  "translation_status": "reviewed"
- "id": "appia-0089"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sous l’empire des nécessités matérielles, le corps agit. Mais les émotions de l’âme se répercutent également dans l’espace par le geste. Pourtant les gestes n’expriment pas directement la vie de notre âme. Leur intensité variable et leur durée ne sont qu’en relations très indirectes avec les fluctuations de cette vie intérieure et cachée. Nous pouvons souffrir pendant des heures, et ne l’avoir indiqué, du geste, qu’une seconde. Le geste, dans notre vie quotidienne, est un signe, un indice; rien de plus. Les acteurs le savent et règlent leur jeu sur la contradiction de ces durées: celle de la vie de notre âme et celle, qui lui est différente, des révélations qu’en fait notre corps. Dans le temps nous vivons par conséquent différemment que dans l’espace ; et cette opposition infirme forcément toutes les manifestations de notre existence intégrale; et nous resterions, peut-être, à cet égard, des énigmes vivantes, si nous ne possédions pas dans la musique, le souverain correctif et ordonnateur, issu directement de notre vie affective, et l’exprimant sans autre contrôle que celui de nos sentiments."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 41
    "printed_page": "35"
  "translation_ja": "身体は物質的な必要に迫られて行動する。だが心の動揺もまた、身ぶりを通して空間に波及する。それでも身ぶりは、私たちの心の生を直接には表さない。身ぶりの強弱やその長さは、この隠れた内面の生の揺れと、ごく間接にしかつながらない。何時間も苦しんでいても、身ぶりでそれを示すのは一秒だけということもある。日常生活で身ぶりはしるし、手がかりにすぎない。俳優はこれを知っていて、心が生きる時間と、それが身体に現れる時間の食い違いに合わせて演技を整える。したがって私たちは、時間の中と空間の中とでは異なる生き方をしている。この対立は、私たちの存在全体が現れるのをどうしても妨げる。もし、感情の生からじかに生まれ、感情以外の何ものにも律せられずそれを表す音楽という、ずれを正し、秩序を与えるこの上ない手段を持たなかったなら、私たちはある意味で、生きた謎のままだったかもしれない。"
  "translation_status": "reviewed"
- "id": "appia-0090"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La musique correspond aux durées de notre vie intérieure ; elle partage donc avec elle l’incompatibilité avec les durées de nos gestes quotidiens; et, si je viens de la nommer le correctif et l’ordonnateur, c’est en anticipant; car par là, justement, nous touchons au problème de la durée vivante."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 41
    "printed_page": "35"
  "translation_ja": "音楽は私たちの内なる生のさまざまな持続に対応している。だから内なる生と同じく、日常の身ぶりの長さとは折り合わない。先ほど音楽を、ずれを正し秩序を与えるものと呼んだのは、少し先へ話を進めてしまったからだ。まさしくそこで、「生きた持続」の問題に行きあたる。"
  "translation_status": "reviewed"
- "id": "appia-0091"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Déclarons tout de suite, que, sous peine de se renier elle-même, la musique doit conserver les proportions dans le temps qui sont la forme caractéristique de son existence. En cela, le vérisme dans l’art dramatique, aussi bien que dans la pantomime, est la négation grossière de la vie musicale. — Le corps, s’il modifiait les proportions et la durée de ses gestes, supprimerait-il son existence? Evidemment non. Par exemple, la gymnastique, dans le but de fortifier notre organisme, lui impose des gestes dont la proportion ne se retrouve pas dans notre vie quotidienne et naturelle; la vie de notre corps n’en est pas, pour cela, supprimée. Dans ce simple exercice technique, nous l’exprimons d’une façon particulière; voilà tout. Par contre, l’exercice technique, en musique, n’est déjà plus de la musique, et ces proportions ne nous concernent pas. La différence peut sembler subtile; elle n’est pourtant qu’évidente, puisque c’est de vie que nous traitons ici. — Notre corps porte le mouvement en puissance, — n’importe quel mouvement; et le mouvement est le signe de la vie. Par contre la musique renferme bien la durée en puissance, mais non pas n’importe quelle durée. Elle est l’expression de notre âme. Il n’y a pas parallélisme entre l’action normale du corps et l’existence effective de la musique. S’il existait, le problème serait résolu d’avance; la réunion de la musique s’opérerait automatiquement. Tel n’est pas le cas; et la solution est encore à trouver."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 41
    "pdf_page_end": 42
    "printed_page": "35"
    "printed_page_end": "36"
  "translation_ja": "先に言い切っておこう。音楽は、みずからを否定したくなければ、その存在に固有の形をなす、時間の中の比率を保たねばならない。この点で演劇でも無言劇でも、ありのままの再現を求める写実主義は、音楽の生命を粗雑に否定するものだ。身体は、身ぶりの比率や長さを変えたら、存在しなくなるだろうか。むろん、ならない。たとえば体操では、身体を鍛えるため、ふだんの自然な暮らしでは見られない比率の身ぶりを身体に課す。だからといって、身体の生命がなくなるわけではない。単なる技術上の練習で、生命を特別なしかたで表しているだけだ。一方、音楽で技術だけの練習をするなら、それはもう音楽ではなく、そこでの比率は私たちの問題とは関わらない。この違いは微妙に見えるかもしれないが、ここで論じているのが生命だと考えれば、明らかなことだ。身体は動く力を、どんな動きでもできる力を秘めていて、動きは生命のしるしである。音楽も確かに持続を秘めてはいるが、どんな持続でもよいわけではない。音楽は私たちの心の表現だ。身体の日常的な動きと、実際に鳴る音楽との間に並行関係はない。もしあるなら、問題は初めから解けていて、身体と音楽はひとりでに結びついているはずだ。実際にはそうではなく、解決はまだ見つかっていない。"
  "translation_status": "reviewed"
- "id": "appia-0092"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "D’après ce qui précède, ce sont les manifestations du corps qui possèdent le plus d’indépendance; ce seront donc elles qui auront à s’offrir, avec souplesse et docilité, aux proportions, plus dépendantes, de la musique. Et l’on peut en conclure, — chose étrange, — que notre corps, pour se mettre au service de l’expression de notre vie intérieure, pour l’exprimer au lieu d’en donner simplement les indices, est dans l’obligation de modifier très sensiblement sa vie normale. Or, en se soumettant de la sorte, ne perdra-t-il pas toute la valeur de cette vie, — de sa vie normale? Une modification si profonde est-elle désirable, et le résultat sera-t-il proportionné à la grandeur du sacrifice?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 42
    "pdf_page_end": 43
    "printed_page": "36"
    "printed_page_end": "37"
  "translation_ja": "以上からすれば、より独立しているのは身体の現れのほうだ。したがって、より制約の多い音楽の比率に、しなやかに、素直に身を差し出すのも身体でなければならない。奇妙なことだが、ここからこう結論できる。内なる生の表現に仕え、手がかりだけを示すのではなく、内なる生そのものを表すには、身体はふだんの生き方をかなり変えなければならない。だがそのように従って、ふだんの生の価値をすっかり失いはしないだろうか。これほど深く変えることは望ましいのか。得られる結果は、犠牲の大きさに見合うだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0093"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La réponse à ces questions se trouve dans le principe même de l’art. Taine l’arrête magistralement, et sans doute définitivement, en ces termes: « L’œuvre d’art a pour but de manifester quelque caractère essentiel et saillant, partant quelque idée importante, plus clairement et plus complètement que ne le font les objets réels. Elle y arrive en employant un ensemble de parties liées, dont elle modifie systématiquement les rapports. » Le propre de l’art est donc dans une modification des valeurs naturelles. Un peintre qui copie la nature, la transpose, seulement, par le procédé des couleurs, sur une surface plane. Le sculpteur, s’il copie son modèle, se borne, comme le peintre, à l’immobiliser, sans raison valable; il transpose comme lui, et appauvrit d’autant la nature. L’architecte semble mieux partagé; il n’a rien à copier; son œuvre est déjà par elle-même une modification des formes naturelles; mais s’il perd de vue les proportions du corps humain et les mouvements divers de la vie, ses modifications sont arbitraires et restent sans objet. Les arts du temps partagent le sort de l’architecture; ce sont eux qui s’en rapprochent même le plus, par leur parenté commune avec l’être vivant. On pourrait presque nommer du même souffle la poésie, la musique et l’architecture. Le poète modifie la forme et les durées de notre pensée quotidienne; et le musicien, nous l’avons vu, modifie les durées de notre vie normale. La musique serait, en ce sens, un comble d’arbitraire, si notre vie affective ne la guidait pas en la justifiant d’une façon constante."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 43
    "printed_page": "37"
  "translation_ja": "答えは芸術そのものの原理にある。テーヌは、この上なく明快に、おそらく決定的な形で、それをこう定めている。「芸術作品の目的は、ある本質的で際立った特徴、したがってある重要な観念を、現実の事物よりはっきりと、また余すところなく現すことにある。互いにつながるいくつかの部分を用い、その関係を体系的に変えることによって、芸術作品はこれを成し遂げる。」だから芸術に固有なのは、自然にある諸要素の重みを変えることである。自然をそっくり写す画家は、絵の具を使ってそれを平面へ移し替えるだけだ。彫刻家も、モデルをそっくり写すなら、画家と同じく、理由もなくそれを動かなくするだけである。画家と同じように移し替え、そのぶん自然を貧しくする。建築家はもう少し恵まれているらしい。写すべきものがない。作品はそれ自体ですでに自然の形を変えたものだ。ただし、人間の身体の比率や生命の多様な動きを見失えば、建築家の加える変更は勝手なものとなり、何を表すのでもなくなる。時間の芸術も建築と同じ境遇にある。ともに生きものと近いだけに、むしろ時間の芸術が建築に最も近い。詩、音楽、建築を、ほとんどひと息に並べて言えるほどだ。詩人は日常の思考の形や長さを変える。音楽家は先に見たように、ふだんの生のさまざまな持続を変える。絶えずそれを裏づけ、導く私たちの感情の生がなければ、音楽もこの意味ではまったく恣意的なものになるだろう。"
  "translation_status": "reviewed"
- "id": "appia-0094"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le corps humain, s’il accepte volontairement les modifications que lui impose la musique, prend, dans l’art, le rang d’un moyen d’expression ; il abandonne sa vie accidentelle et facultative, pour exprimer, sous les ordres de la musique, quelque caractère essentiel, quelque idée importante, plus clairement et plus complètement qu’il ne le ferait dans la vie normale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 43
    "pdf_page_end": 44
    "printed_page": "37"
    "printed_page_end": "38"
  "translation_ja": "人間の身体が、音楽から課された変化をみずから受け入れるなら、身体は芸術において表現の手段となる。たまたまそのようになっている、別様でもありうる生を手放し、音楽に導かれながら、ある本質的な特徴、ある重要な観念を、ふだんの生ではできないほど明らかに、余すところなく表すためである。"
  "translation_status": "reviewed"
- "id": "appia-0095"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Schopenhauer, le philosophe-artiste, nous assure que « la musique n’exprime jamais le phénomène, mais seulement l’essence intime du phénomène ». Sa conviction, dans sa forme ramassée, est pareille à celle de Taine ; car il est bien évident que l’essence du phénomène revêt une autre forme que le phénomène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 44
    "printed_page": "38"
  "translation_ja": "芸術家でもある哲学者ショーペンハウアーは言う。「音楽が表すのはけっして現象ではなく、現象の内なる本質だけである。」簡潔にまとめられたこの確信は、テーヌの確信と同じだ。現象の本質は、現象そのものとは別の形を取ることが明らかだからである。"
  "translation_status": "reviewed"
- "id": "appia-0096"
  "section_id": "duration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La durée vivante sera donc l’art d’exprimer, simultanément dans le temps et dans l’espace, une idée essentielle. Elle y parvient en rendant la succession des formes vivantes du corps humain, et la succession des durées musicales, solidaires les unes des autres."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 44
    "printed_page": "38"
  "translation_ja": "したがって、生きた持続とは、時間の中と空間の中とで、本質的な観念を同時に表す芸術である。それを可能にするのは、相次いで現れる人間の身体の生きた形と、相次ぐ音楽のさまざまな持続を、互いに切り離せないものにすることだ。"
  "translation_status": "reviewed"
- "id": "appia-0097"
  "section_id": "space"
  "kind": "heading"
  "origin": "source"
  "source_text": "L’espace vivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 45
    "printed_page": "39"
  "translation_ja": "生きた空間。"
  "translation_status": "reviewed"
- "id": "appia-0098"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jusqu’ici nous nous sommes plus particulièrement attachés à la musique et au corps vivant. L’idée d’espace ne nous a été donnée que par les mouvements du corps, proportionnés aux durées musicales. Ces mouvements vont maintenant se développer dans l’espace qui les entoure, dans l’atmosphère qui les enveloppe, et chercher en eux des alliés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 45
    "printed_page": "39"
  "translation_ja": "これまで特に見てきたのは、音楽と生きた身体だった。空間について考える手がかりは、音楽のさまざまな持続に見合う身体の動きだけだった。これからその動きは、周囲の空間と、身体を包む空気の中に広がり、そこに味方を探すことになる。"
  "translation_status": "reviewed"
- "id": "appia-0099"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le corps est l’interprète de la musique auprès des formes inanimées et sourdes. Nous pouvons donc abandonner momentanément la musique; le corps l’a absorbée et saura nous guider et la représenter dans l’espace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 45
    "printed_page": "39"
  "translation_ja": "身体は、生命も聴覚もない形に向かって、音楽を通訳する。だからいまは、音楽そのものをひとまず脇に置いてもよい。身体の中に音楽はすでに入り込んでいる。身体が私たちを導き、音楽を空間の中で表してくれるだろう。"
  "translation_status": "reviewed"
- "id": "appia-0100"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le corps couché, assis, ou debout sur un point du sol, s’exprime, dans l’espace qu’il occupe et qu’il mesure, par les mouvements des bras, combinés à ceux, plus limités, du torse et de la tête. Les jambes conservent bien, sans changer la place où repose le corps, un semblant de mobilité; mais leur activité normale est pourtant de parcourir l’espace. Nous pouvons donc, dès l’abord, distinguer deux ordres de plans: les plans destinés à la marche, plus ou moins rapide et plus ou moins interrompue, et les plans consacrés à la mise en valeur du corps en son ensemble, à l’exclusion de la marche. Ces deux ordres, il va de soi, se pénètrent; ce sont les mouvements du corps qui leur confèrent telle ou telle destination. Sur le sol, les plans inclinés, et surtout les escaliers, peuvent être considérés comme participant aux deux ordres de plans. L’obstacle qu’ils font à la libre marche, et l’expression qu’ils suscitent dans l’organisme, dérivent de la verticale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 45
    "pdf_page_end": 46
    "printed_page": "39"
    "printed_page_end": "40"
  "translation_ja": "床の一点で横たわり、座り、あるいは立つ身体は、自らが占め、また測りもする空間の中で、腕の動きに、それより幅の小さい胴や頭の動きを組み合わせて、自らを表現する。脚も、身体が落ち着いた場所を変えずに、多少は動かすことができる。だが脚の本来の役割は、空間を進むことだ。だからまず、二種類の面を区別できる。一つは、速いことも遅いこともあり、途中で止まることも止まらないこともある歩みに使う面。もう一つは、歩かせるのではなく、身体の全体を引き立てる面である。もちろん二種類の面は重なり合う。どちらの役割を持つかを決めるのは、身体の動きである。床に設けた斜面、とくに階段は、両方の面を兼ねるとみなせる。自由な歩みを妨げ、身体に表現を引き出すその働きは、垂直方向から生じる。"
  "translation_status": "reviewed"
- "id": "appia-0101"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous aurons donc à compter avec deux lignes principales: l’horizontale, tout d’abord, car le corps repose avant tout sur un plan pour exprimer sa pesanteur; ensuite la verticale, qui correspond à la station du corps et l’accompagne. La structure du sol, dérivée de l’horizontale, ne perdra jamais de vue la pesanteur, et cherchera à l’exprimer le plus simplement et le plus clairement possible. Je m’explique:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 46
    "printed_page": "40"
  "translation_ja": "そこで二つの主要な線を考えに入れなければならない。まず水平線。身体が重力の働きを表すには、第一に身体を支える面が要るからだ。次いで垂直線。これは立った身体に対応し、その姿勢に伴う。水平線から導かれる床の構造では、重力をつねに念頭に置き、その働きをできるかぎり単純に、明瞭に表そうとする。説明しよう。"
  "translation_status": "reviewed"
- "id": "appia-0102"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les divers meubles que nous fabriquons pour le confort de notre vie quotidienne et le repos de notre corps, sont combinés pour atténuer le contact que nous prenons avec la matière. Nous avons des ressorts, des capitonnages, des lignes courbes qui épousent nos formes; nous arrondissons les angles, amollissons les surfaces rigides par des étoffes qui étouffent les bruits et assourdissent les contacts. Nous poussons si loin cette atténuation du plan simple que l’expression de nos mouvements en est elle-même profondément diminuée. Pour s’en convaincre, il suffit de se dévêtir complètement dans une chambre bien meublée: notre corps, sans voile, sans l’intermédiaire du vêtement, devient subitement étranger à ce qui l’entoure; il devient indécent au sens étymologique du mot, c’est-à-dire déplacé, et son expression côtoie l’obscénité de très près. — Mais, dira-t-on, une dame, mise à son avantage et qui s’installe avec élégance dans un fauteuil, est d’une expression délicieuse. Sans doute; mais qu’elle se dévête et s’assoie de la même façon sur le même siège...? — Une salle de bain où se trouvent des tentures, des divans, des coussins, évoque des idées contraires à la véritable expression du corps ; tandis que si la même salle n’offre que des surfaces planes et rigides, le corps nu y semble, par avance et implicitement, présent et mis en valeur esthétique. Des pieds nus gravissant un escalier recouvert d’un tapis seront des pieds déchaussés, et l’on en cherchera la raison. Sur un escalier sans tapis ils seront simplement nus et pleins d’expression. Il est évident que les pieds des musulmans sur les tapis de leurs mosquées sont déchaussés et non pas nus; ils expriment une intention religieuse et non pas esthétique. Sortez de la mosquée et regardez les pieds nus de la femme qui descend les degrés d’une fontaine: ses pieds seront bienheureusement nus..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 46
    "pdf_page_end": 47
    "printed_page": "40"
    "printed_page_end": "41"
  "translation_ja": "暮らしを快適にし、身体を休ませるために作る家具は、どれも物質に触れる感触をやわらげるようにできている。ばねを使い、詰め物をし、身体の形に沿う曲線を用いる。角を丸め、音を吸い、触れる感触を鈍らせる布で、硬い面をやわらかくする。単純な面をそこまでやわらげてしまうと、私たちの動きそのものの表現まで、ひどく弱くなる。家具の行き届いた部屋ですっかり服を脱げば、よくわかる。覆いも、仲立ちする衣服もなくなった身体は、たちまちまわりのものになじまなくなる。語源どおりの意味で「不作法」、つまり場違いになり、その表現はわいせつさのすぐそばまで来る。だが、こう言う人もいるだろう。着飾って美しく見せた婦人が、優雅に肘掛け椅子に座る姿には、なんともいえない表情があるではないか。むろんだ。だが服を脱ぎ、同じ椅子に同じように座ったらどうか。浴室に壁掛けや寝椅子、クッションがあれば、身体本来の表現にそぐわないことを思い起こさせる。ところが同じ浴室に平らで硬い面しかなければ、まだ誰もいないうちから裸の身体が暗にそこにあり、美しく引き立てられているかのようだ。敷物を敷いた階段を裸足で上れば、「靴を脱いだ足」になり、なぜ靴を脱いだのかと思う。敷物のない階段なら、ただの裸足でありながら、豊かな表情を備える。モスクの敷物の上にいるイスラム教徒の足は、あきらかに裸足というより、靴を脱いだ足である。そこに表れるのは宗教上の意図であって、美のための意図ではない。モスクを出て、水場の階段を下りる女の裸足を見てごらんなさい。それは何の気兼ねもない裸足である……。"
  "translation_status": "reviewed"
- "id": "appia-0103"
  "section_id": "space"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toute altération de la pesanteur, quelque but qu’elle poursuive, infirmera l’expression corporelle. Le premier principe, peut-être même le seul dont tous les autres dérivent ensuite automatiquement, sera donc, pour l’art vivant, que les formes qui ne sont pas celles du corps cherchent à se mettre en opposition avec ces dernières et ne les épousent jamais. S’il se présentait néanmoins des cas où la souplesse d’une ligne fût désirable pour atténuer momentanément l’expression d’un mouvement ou d’une attitude, le seul fait de cette affirmation exceptionnelle en ferait un objet d’expression. Mais, si cela se prolonge, la présence effective du corps en sera toujours plus infirmée, jusqu’à sa complète suppression: le corps sera présent, mais sans effet corporel; ses mouvements deviendront superflus, et partant ridicules, ou bien se réduiront à des indices; nous retomberons alors dans la vie quotidienne et dans le théâtre de mœurs. De même, en architecture, avons-nous vu que la pesanteur est la condition sine qua non de l’expression corporelle. La pesanteur, et non pas la lourdeur ! La pesanteur est un principe; c’est par elle que la matière s’affirme; et les mille degrés de cette affirmation constituent son expression. Le volume, à lui seul, peut s’échapper dans les airs, tel un ballon; sa consistance est illusoire; il est une portion d’espace momentanément enfermée, rien de plus. C’est la poupée de baudruche, et, en ceci, la danseuse à l’italienne semble un ballon captif, que l’on ramène toujours de nouveau, et en mesure, à son point d’attache. Pour recevoir du corps vivant sa part de vie, l’espace doit faire opposition à ce corps; en épousant nos formes il augmente encore sa propre inertie. D’autre part, c’est l’opposition du corps qui anime les formes de l’espace. L’espace vivant, c’est la victoire des formes corporelles sur les formes inanimées. La réciprocité est parfaite."
  "source_languages":
  - "fr"
  "source_locations":

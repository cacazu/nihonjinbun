    "printed_page_end": "29"
  "translation_ja": "運動が一つの芸術作品の中にどう位置を得られるかは、第一に重要な問いである。だがそれを調べる前に、音とリズムの芸術を見た私たちには、もう一つ見るべきものが残っている。話すことの芸術、声に出して語られる台本の芸術である。* 音楽を伴わない言葉の声色も、場合によっては音楽の音にどこか似ていると感じさせるかもしれない。だが芸術の上では何の共通点もない。とりわけ決定的な違いは、声色が、言葉の意味と、その意味を私たちが理解することとの仲立ちでしかない点だ。楽音はじかに感性そのものを打ち、推論が必要になるとしても、それが働くのはそのあとにすぎない。意味を知らない言葉は、快くも不快にも聞こえる物音であって、楽音ではない。外国語がわかり始めると、この物音が意味を持つ。その響きが次第に理解力へ働きかけ、聞こえ方がすっかり変わるまでになる。言葉は間接に思考を伝え、音はじかに感情を伝える。話し言葉によって時間の観念性は、ごく初歩的に、きわめて限られた仕方でしか表れず、しかも脳がそれを理解して取り込める範囲にすっかり左右される。早口に過ぎる文は、私たちの理解力には受け取れない。逆に長くかかりすぎても、意味を伝える仲立ちの働きが損なわれる。言葉と楽音が時間を共有していなかったなら、美的な違いは完全なものとなるだろう。そして時間についてさえ、話し言葉のさまざまな長さを、きっちり、間違いなく測れるだろうか。そのための、朗誦にかかる時間へ置き換えられる記号があるだろうか。作者が余白にどれほど意図を書き添えたところで、それは書かれた記号によって、すでに私たちの理解力だけに向けられたものである。芸術作品に欠かせない精密さを、それで保障できるだろうか。できるはずがない。こう考えると、話し言葉の持続に観念性の名残が多少はあるように見えても、それはまぼろしだったとわかる。"
  "translation_status": "reviewed"

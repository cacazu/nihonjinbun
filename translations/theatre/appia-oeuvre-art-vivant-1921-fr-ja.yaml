    "printed_page_end": "87"
  "translation_ja": "著者は、生きた芸術作品が手本となる、皆で分かち合う美へと至る道は、技術しかないと確信している。この確信にほとんど支配されるようにして本を書き、いまの形を与えた。手段を身につけずに目的だけを望むことは、おそらくここでは、ほかの場合以上に、幻想にすぎず危険なのだ。芸術には悪魔が隠れていて、軽はずみに呼べばたやすく光の天使に姿を変える。厳密で誠実に技術を扱うことだけが、この悪魔を従わせておける。芸術を全体として、またある程度共同で実現しようとする試みは、不完全な技術のためにいくつも失敗したし、今も失敗している。作品の断片を全体と思い違え、その断片に、効き目のないやり方を使わざるをえないのである。私たちは無理に分類を作り、たとえば物に関する技術上の考慮を、個人に関するものとは別とみなしている。それが高じて、人間に関する理論も技術となり、作業の道具となりうるのに、物のほうを実践、人のほうを理論と呼びたがる。社会学や心理学などでは、近代の努力はことごとくこの方向を向き、道具の値打ちが論じられている。芸術ではまだ無秩序が支配しており、用いる手段の序列に、つまり作品を作る技術の道具に、人間を入れようなどとするのは、ありえない夢、子どもじみたことに見える。芸術家は相変わらず、同胞である人々を、自分と別の集団と考え、完成した作品を持っていって見せる。自分自身を作品でも道具でもあると捉え、それからその感覚と、そこから生まれる確信を同胞にも広げるという、すでに見てきた美の上での転換は、まだ芸術家に知られていない。最も善意のある人でさえ、気の毒な観客の鼻先に、その人に向けたことなど一度もなく、こういうやり方ではそもそも味わえない作品を差し出すことで、社会とのつながりを実践し、共同の芸術への願いを示しているつもりなのだ。"

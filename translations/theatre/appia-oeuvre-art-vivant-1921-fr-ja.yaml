    "printed_page_end": "59"
  "translation_ja": "現行の演出方法から離れ、演劇という観点だけから、さまざまな芸術を検討してきたことは、その弱点を見つける助けになるかもしれない。私たちの装置の原理は、もともと劇作家自身が思いついたものではないだろうか。しかも劇作家は、惰性から、いまでは場違いになった当初のやり方を引き延ばしているのではないだろうか。装置に絵を手当たりしだいに使うことは、私たちの演出すべてを特徴づけており、私たちにとって、絵を描いた布と演出はほとんど同じ意味になっている。もっとも、それらの布の目的は、表現力のある色や形の組み合わせを見せることではなく、上で見たように、多くの物や細部を知らせることだと、どの芸術家も知っている。そうした物をこちらに見せる必要があったからこそ、劇作家は画家に、このように助けを求めたと考えられる。そして画家は喜んで応じた。題材を選び、定めようとする劇作家の立場に身を置けば、その瞬間に、技術上の自由か他への依存かが決まるのは明らかだ。押しつけられた手段から解放されると思ってみるがよい。するとすぐに、何を題材にするかどころか、上演を前提とする作品にとって題材とは何なのか、という考えそのものにぶつかる。今の劇作家にとって題材とは、互いに対立する性格を示すことだ。対立によって特定の状況が生じ、登場人物はそれに何かしら応じざるをえない。その応じ方から劇のおもしろさが生まれる。彼にとってはそれがすべてで、それ以外を考えたことがない。演劇はまるごとその応じ方から成り、応じ方は限りなく変えられるように思える。だが実際はそうでなく、応じ方は無限に変わるどころか、いつも同じものが繰り返されることに気づく。その意味で人間の本性には限りがあり、一つ一つの情念には名前がある。そこで劇作家は、人物の性格を多様にしておもしろさを変えようとする。すると分量の問題が始まる。ある性格を示すには、舞台では時間、紙では場所が要る。だから選択の幅は限られる。小説や心理についての論考ではいくらでも紙を使えるが、芝居には三、四時間しかない。*　そこでほかを探さねばならず、環境の影響が問題となる。環境はつねに歴史的で地理的なもので、風土や文化によって決まり、それらは明確な事物のまとまりによって目に示される。そうした物が見えなければ、台詞に数多くの情報を背負わせることになり、芝居の進行は完全に止まってしまう。だから、どうしても環境は装置で表すことになる。"
  "translation_status": "reviewed"

    "printed_page": "60"
    "printed_page_end": "61"
  "translation_ja": "題材を選ぶとき、作者が問うべきなのは演出家ではなく俳優である。といっても、どこかの俳優に助言を求めるべきだ、というのではない。生きて形をなし、動く俳優という観念を、作者は導きとしなければならないのだ。たとえば、ある環境を強調して示す必要が、俳優がそこにいることと両立するかどうかを問うべきであって、単にそれが「可能」かどうかではない。技術の面で選択に関わるのは俳優だけであり、劇の面では環境の影響をどの程度重く見たいか、あるいはどの程度重く見るべきかが関わる。いずれについても、理由をよく知って選ぶため、舞台の本来の序列と、それがもたらす結果を知り尽くしていなければならない。芸術家としての技術が選択を決めるのだ。画家は、絵画に彫刻のような盛り上がりがないからといって嘆かない。その技術の問題は、そういうことができるかどうかではない。劇作家でも同じであるべきだ。人物を大聖堂に置けないことを悔やむのではない。むしろ人物そのものが現れるのを妨げる、枝葉の事情をまとわりつかせたことのほうを悔やむべきだ。小説家や叙事詩人は、主人公を取り巻く環境を描写して、主人公を呼び起こせる。彼らの作品は語りであって、筋は生きてはいないのだから、語りの中に置かれる。だが劇作家は何一つ物語る必要がない。劇の筋は生きており、自由で、むきだしだ。枝葉の事情はどれも劇を小説や叙事詩の語りに近づけ、演劇から遠ざける。環境を示すことが筋の進行に、すなわち性格や状況や応じ方をもっともらしくするために必要になればなるほど、筋は生きた芸術から離れてゆく。理由は純粋に技術上のものであり、誰にも変えようがない。"
  "translation_status": "reviewed"
- "id": "appia-0133"

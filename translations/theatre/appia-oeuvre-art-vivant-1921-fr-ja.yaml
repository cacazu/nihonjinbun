  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces notions qui peuvent paraître obscures ou paradoxales, sont d’une importance capitale pour la juste appréciation des valeurs en matière de mise en scène. Et je dois rappeler encore une fois que c’est à ce seul point de vue que cette démonstration est placée."

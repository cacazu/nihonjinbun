    "printed_page": "71"
    "printed_page_end": "72"
  "translation_ja": "これまで気づかなかった隠れたリズムが、やがて現れる。どこから来たのか。それは自らの存在を示し、反射を引き起こす。何に突き動かされているのか。内なる生が大きくなり、ほかの身ぶりではなく、この身ぶりを、ためらって立ち止まるのでなく、この確かな一歩を、あるいはその逆を、私たちに求める。そしてついに目が開く。感じているだけだった歩みや身ぶりが見え、目を向けてよく見る。手はここまで伸び、足はそこまで踏み出した。この二つは空間のそれぞれの部分を測ったのだ。測るためにそうしたのか。いや、そうではない。ではなぜ、もっと遠くでも近くでもなく、そこまでか。導かれてそうしたのである。機械的に空間をわがものとし、その中心にいるわけではない。私たちが生きているからだ。空間は私たちの生であり、その生が空間を創り、身体がそれを表す。このうえない確信に至るために、私たちは歩き、身ぶりをし、身をかがめ、背を伸ばし、横になり、起き上がらねばならなかった。一点から別の一点へ行くのにも、ごくわずかとはいえ、心臓の鼓動に応じた力を使った。鼓動が身ぶりを測ったのだ。空間で測ったのか。いや、時間でだ！　身体が空間を測るには時間が必要なのだ。ゆえに動きの長さが、動きの及ぶ広さを測ったのである。生は空間と時間を、一方によってもう一方を創る。生きた身体は、時間のうちで空間を、空間の中で時間を表す。どうしても必要な転換をするため、初めに身を置いた、空虚で果てしない空間はもうない。存在するのは私たちだけである。"
  "translation_status": "reviewed"
- "id": "appia-0155"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En art dramatique, seuls nous existons aussi. Il n’y a pas de salle, pas de scène sans nous et hors de nous. Il n’y a pas de spectateur, pas de pièce sans nous, sans nous seuls. Nous sommes la pièce et la scène ; nous, notre corps vivant ; parce que c’est ce corps qui les crée. Et l’art dramatique, c’est une création volontaire de ce corps. Notre corps est l’auteur dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 78
    "printed_page": "72"
  "translation_ja": "演劇でも、存在するのは私たちだけである。私たちなしに、私たちの外に、客席も舞台もない。私たちだけがいるのでなければ、観客も芝居もない。私たちこそ芝居であり舞台である。私たち、すなわち生きた身体がそれを創るからだ。演劇とは、この身体がみずからの意志で創り出すものだ。劇作家とは私たちの身体である。"
  "translation_status": "reviewed"
- "id": "appia-0156"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’œuvre d’art dramatique est la seule œuvre d’art qui se confonde avec son auteur. Elle est la seule dont l’existence soit certaine sans spectateur. Le poème doit être lu; la peinture, la sculpture regardées; l’architecture parcourue; la musique écoutée: l’œuvre d’art dramatique est vécue; c’est l’auteur dramatique qui la vit. Le spectateur vient s’en convaincre; là, se borne son rôle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 78
    "printed_page": "72"
  "translation_ja": "演劇の作品は、作者と一つになるただ一つの芸術作品だ。観客がいなくても確かに存在する、ただ一つの作品でもある。詩は読まれ、絵画や彫刻は見られ、建築は歩いて確かめられ、音楽は聴かれなければならない。演劇の作品は身をもって生きるものであり、その作品を生きるのは劇作家である。観客はそれを確かめに来る。それが観客の役割のすべてである。"
  "translation_status": "reviewed"
- "id": "appia-0157"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’œuvre vit à elle seule et sans le spectateur. L’auteur l’exprime, la possède et la contemple, tout à la fois. Nos yeux, nos oreilles, n’en obtiendront jamais que l’écho et le reflet. Le cadre de la scène n’est qu’un trou de serrure par lequel nous surprenons des manifestations de vie qui ne nous sont pas destinées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 78
    "printed_page": "72"
  "translation_ja": "作品は、自分だけで、観客なしに生きる。作者は同時にこれを表現し、わがものとし、見つめる。私たちの目と耳が受け取れるのは、いつもそのこだまと映りにすぎない。舞台を囲う枠は小さな鍵穴であり、私たちは自分たちに向けられていない生命の現れを、そこからひそかにのぞき見る。"
  "translation_status": "reviewed"
- "id": "appia-0158"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous avons donc fait table rase, et par notre mouvement nous avons conquis virtuellement le Temps avec l’Espace Ils ne nous sont imposés ni par la durée d’un texte, ni par une scène toute préparée; ils sont en notre main et attendent nos ordres. Par eux nous devenons conscients de notre puissance et pouvons l’exercer, pour créer librement l’œuvre vivant, mais librement, cette fois-ci ! Nous sommes revenus aux sources; c’est des sources que nous allons partir. Nos antécédents ne seront plus de la littérature et des beaux-arts séculaires. Nous tenons la vie à ses racines, d’où maintenant jaillira une sève nouvelle, pour un arbre nouveau dont aucune branche ne sera greffée arbitrairement. Et, si, comme pour les autres œuvres d’art, l’œuvre d’art dramatique est le résultat de modification des rapports (voir plus haut la citation de Taine), ce qui est incontestable, il nous reste à trouver en nous-même l’élément modificateur. En nous-même, car, partout ailleurs, il se présenterait déjà façonné pour des fins qui seraient étrangères à la vie de notre corps. Nous avons vu, précisément, que c’est notre vie affective, intérieure, qui donne à nos mouvements leur durée et leur caractère; nous savons aussi que la musique exprime cette vie d’une façon pour nous, indubitable et qui modifie profondément ces durées et ce caractère. En elle nous possédons un élément intimement issu de nous-même, et dont nous acceptons déjà, et par définition, la discipline. Ce sera donc de la musique que l’œuvre d’art vivant naîtra; sa discipline sera, pour l’arbre nouveau, le principe de culture par excellence, qui nous assure une riche floraison ; mais, à condition de l’incorporer organiquement à ses racines et d’en pénétrer ainsi la sève. L’Etre nouveau — nous-même — sera placé sous le signe de la musique. Incorporer l’art des sons et du rythme en notre propre organisme est le premier pas vers l’œuvre d’art vivant; et, comme toutes les études élémentaires, ce début prend une importance décisive. D’une juste assimilation dépendra tout le développement à venir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 78
    "pdf_page_end": 79
    "printed_page": "72"
    "printed_page_end": "73"
  "translation_ja": "こうしてすべてを白紙に戻し、自分たちの動きによって、時間を空間とともにいわばわがものにした。どちらも台本の持続や既製の舞台に押しつけられるのではない。私たちの手にあり、指図を待っている。そこから私たちは自分の力を知り、その力を使って生きた作品を自由に、このたびこそ自由に創り出せる。源に戻ってきた。これからはそこを出発点にするのだ。もはや、長く続いてきた文学や美術を先例とはしない。私たちは生命を根元からつかんでいる。そこから今、新しい樹液がほとばしり、新しい木が育つ。その枝に勝手に接ぎ木することはない。演劇作品も、ほかの芸術作品と同じく、関係を変えることで生まれるのが確かならば（先に引用したテーヌを参照）、次にすべきことは、変更を加える要素を私たちの中に見つけることだ。ほかのどこを探しても、身体の生命とは無縁な目的のためにすでに形づくられたものしか見つからないからである。動きの長さや性質を与えるのは、まさしく私たちの内なる感情の生だったことを見てきた。また音楽がそれを、私たちにとって疑いようのない仕方で表し、その長さや性質を大きく変えることも知っている。音楽の中に私たちは、自分の奥から生じ、音楽であるかぎりすでにその規律を受け入れている、一つの要素を持つ。生きた芸術作品は、だから音楽から生まれる。この新しい木にとって、音楽の規律は木を育て、豊かに花を咲かせる何よりの原理となる。ただし音楽を根に有機的に取り入れ、木の樹液にまで行き渡らせなければならない。新しい存在、すなわち私たち自身は、音楽のしるしの下に置かれるだろう。音とリズムの芸術を身体そのものに取り込むことが、生きた芸術作品への第一歩である。どんな基礎の勉強とも同じく、その始まりには決定的な大切さがある。どう取り込み、自分のものにするかで、これからの発展のすべてが決まる。"
  "translation_status": "reviewed"
- "id": "appia-0159"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans les chapitres précédents nous avons déterminé la place du corps dans l’art dramatique et cherché à tirer les conséquences techniques d’une hiérarchie organiquement fondée. Pour le Texte, point de départ, nous avons oscillé, intentionnellement, entre les durées de la parole et celles de la musique. Nous voici arrivés au point où l’hésitation n’est plus possible; nous avons fait table rase; tout est donc à recommencer par le commencement, c’est-à-dire par les facteurs en quelque sorte primordiaux: la présence du corps créant l’Espace et le Temps vivants, et l’instauration de la musique dans ce corps pour opérer la modification esthétique qui est le propre de l’œuvre d’art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 80
    "printed_page": "74"
  "translation_ja": "前の章までに、演劇における身体の位置を定め、有機的な基礎を持つ序列から、どんな技術上の結果が導かれるかを考えてきた。出発点となるテクストについては、ことさらに、言葉の持続と音楽の持続とのあいだを行き来してきた。もはやためらっていられないところへ来た。すべて白紙に戻したのだから、最初のところから、いわば根源的な要素から、すべてやり直さなければならない。その要素とは、生きた空間と時間を創る身体がそこにいること、そして芸術作品に固有の、美をもたらす変更を行うため、その身体の中に音楽を据えることである。"
  "translation_status": "reviewed"
- "id": "appia-0160"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le lecteur, peut-être, saisit-il maintenant pourquoi cet ouvrage n’est pas intitulé « L’art dramatique », mais bien L’Art vivant. Pour arriver à la notion claire d’un art vivant, possible, sans être nécessairement dramatique (au sens que nous attachons à ce mot), force était d’en passer par le théâtre, puisque nous n’avons que lui. Le théâtre n’est pourtant qu’une des formes de l’Art vivant, de l’art intégral; il se sert du corps pour des fins intellectuelles (sinon futiles) ; et il incline tellement vers ce que nous avons appelé le signe qu’il tend souvent à se confondre avec lui; ce qui est une violence faite au corps vivant, qui doit être l’Expression, et qu’il asservit de la sorte. Nous devons donc — et cela est de toute évidence — soumettre l’Idée même d’un art dramatique à cette expertise, si nous voulons lui assigner une place déterminée dans notre culture artistique et lui donner un nom. Probablement qu’alors, cet art, jusqu’ici bâtard et vacillant, trouvera une justification suffisante, un piédestal solide qui en augmentera beaucoup la valeur et la puissance en lui interdisant les vains oripeaux dont il se parait si malencontreusement. Nous pouvons déjà prévoir que l’art dramatique devra être considéré comme une application spéciale de l’Art vivant; quelque chose comme notre art décoratif l’est vis-à-vis des arts plastiques et picturaux; et, par lui, nous nous convaincrons, toujours de nouveau, qu’il n’y a en définitive que deux sortes d’arts: les arts immobiles, et l’art mobile; les beaux-arts (littérature comprise) et l’art vivant. La position exceptionnelle de la musique, c’est d’être placée au centre, entre les deux sortes d’art. Peut-être alors sortirons-nous de l’anarchie. Le critique d’art pourra se borner à dire devant un tableau, par exemple, et sûr d’être compris : « On ne conçoit pas pourquoi l’artiste immobilise ainsi son objet, puisque ses lignes sont sans contexte. » Ou bien, à la lecture d’une page: « Dans cette description l’on ne peut rien voir, rien saisir; les mots semblent en mouvement et le livre devient à charge. » Ou bien, à propos de telle manifestation d’art vivant: «Ici, les auteurs inclinent trop ostensiblement vers une application sans motif. » Ou bien encore : « Ces évolutions ne sont plus de pure Expression, et néanmoins les exécutants cherchent à les maintenir hors du Signe. Leur tort est d’avoir une partition de Lumière trop sommaire et qui fait désirer la parole. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

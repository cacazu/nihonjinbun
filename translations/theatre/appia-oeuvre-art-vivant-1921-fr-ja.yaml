  "source_text": "Lorsqu’un peintre cherche son sujet, il conserve, en imagination, les ressources que lui offre le procédé d’art qu’il emploie, et les restrictions, les sacrifices qu’il lui impose. Les possibilités et impossibilités de la peinture sont toujours présentes devant lui; et il s’y habitue si bien que sa vie de peintre et la conscience qu’il a des conditions de son métier s’identifient pour lui en une affirmation: il est peintre, donc il jouit de tels avantages et doit consentir à tels sacrifices. Cela est pour lui indiscutable, et c’est seulement dans l’intérieur de ce cadre qu’il tente ses recherches. De ce point de vue, qu’en est-il du dramaturge? S’il est vraiment dramaturge, toute son activité tend à la représentation de son œuvre écrite: il veut s’adresser non pas à des lecteurs mais à des spectateurs. Comme la représentation se fait au théâtre, et que ce n’est pas là que l’on élabore un manuscrit, le dramaturge se voit forcé de partager son attention entre un travail dont il est maître, — le manuscrit de sa pièce, — et un procédé qui échappe à sa concentration cérébrale, — la mise en scène de cette pièce. Il oscille entre les deux comme le ferait un peintre si sa toile était déjà suspendue, encore vide, dans l’exposition, tandis que sa palette resterait couverte de couleurs fraîches dans son atelier; à l’exposition il chercherait à évoquer l’ordonnance des couleurs ; à l’atelier il désirerait ardemment la surface libératrice de sa toile. Seulement, chez le dramaturge, le désir d’une scène est moins précisé que chez le peintre celui de la toile ; la palette dramatique déborde de situations et peut à la rigueur lui suffire; il joue donc en solitaire à ce jeu, jeu dangereux puisqu’il ne concerne que la moitié de son œuvre. Vient alors le moment de l’exposition, je veux dire de la représentation ! L’auteur porte au théâtre la notation d’un travail concentré et recueilli. Sa toile, la scène, a-t-elle les qualités et les dimensions rêvées dans le silence du cabinet de travail? Hélas! personne n’en prend souci. La scène est la scène, à prendre ou à laisser; c’est toujours à la pièce à s’en accommoder; la scène n’est jamais prête aux concessions; elle n’est même pas du tout faite pour cela; et il semble évident que c’est la chose écrite sur du papier qui doit posséder l’élasticité suffisante pour adopter des dimensions quelconques et imposées comme immuables."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

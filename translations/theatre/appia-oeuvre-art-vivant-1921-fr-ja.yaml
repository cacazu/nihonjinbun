    "printed_page_end": "79"
  "translation_ja": "説明を単純にするため、私たちはこれまでただ「身体」と言い、それを果てしない空間の中に切り離して置くことさえした。そうして本質的な要素としたのは生きた身体の観念であって、実際に生きた芸術に取り組むときには、自分の身体も含めた、いくつもの身体に向き合う。身体がこの芸術を創るのであれば、その観念にとらえられた芸術家は、暗にすべての身体をわがものにしている。だから芸術家は生命をもって創り、生命とともに遊ぶ。何人もの生きた者の生命と一緒にである。その人たちを関節のある操り人形にしたくなければ、みずから進んで協力してもらわなければならない。ゆえに共同作業という観念は、生きた芸術という観念の中にすでに含まれている。生きた芸術には共同作業が伴う。生きた芸術は社会的であり、徹底した意味で、社会の芸術である。美術をすべての人の手の届くところに置くのではない。すべての人が芸術にまで身を高めるのである。つまり、生きた芸術は一つの鍛錬から生まれる。その鍛錬は、必ずしも全員の身体で実際に行われなくても、身体の感覚を呼び覚ましてすべての心を方向づける点で、皆のものとなる。身体の観念だけ、そう呼んで許されるなら理想の身体の観念だけでも、美を表すものとしての身体が実現でき、また実現すべきだと、私たちは納得できた。同じように、身体で美を感じ取るという観念は、実際に形をなす動きを経験する機会のない人たちにも、方角を示し、導いてくれるだろう。そうした人々にとって、身体の生命に恵まれた人と接し、その影響を受けるのは貴重なことだ。教育では、師と弟子のあいだで確かにものを渡し合うことが、実りある鍛錬の条件である。一方がいなければ、もう一方は何ができよう。生きた芸術も同じだ。身体の鍛錬に使われた力は、自ずとほかの人々のよく考える身体の中へ流れ込み、身体を動かすだけでは難しくなる制作や目的に役立つ。この交換によって、一方で使われた力は、絶えず同じ水準を保つ生きた力として残り、日々、生きた芸術の存在を支えるだろう。"

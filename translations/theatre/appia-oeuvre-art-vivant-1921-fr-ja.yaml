    アドルフ・アッピア
    1919年5月、シェーブルにて。
  "translation_status": "reviewed"
- "id": "appia-0030"
  "section_id": "elements"
  "kind": "heading"
  "origin": "source"
  "source_text": "Les éléments."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 19
    "printed_page": "13"
  "translation_ja": "諸要素"
  "translation_status": "reviewed"
- "id": "appia-0031"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le langage nous donne souvent l’explication de nos propres sentiments et la clef de certains problèmes. Nous nous en servons avec inconscience, sans doute, et, si même là il nous dirige, c’est imparfaitement, et notre pensée échappe ainsi d’une manière regrettable à sa bienfaisante autorité. En voici un exemple qui intéresse l’objet de cette étude."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 19
    "printed_page": "13"
  "translation_ja": "言葉はしばしば、自分の感情が何なのかを教え、ある問題を解く鍵を与えてくれる。たしかに私たちは、言葉を意識せずに使っている。そんなときにも言葉は私たちを導いてはくれるが、その導きは不完全で、惜しいことに、私たちの思考は言葉のありがたい統制をすり抜けてしまう。本書の主題にかかわる例を一つ挙げよう。"
  "translation_status": "reviewed"
- "id": "appia-0032"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sous la vocable : Art, nous groupons diverses manifestations de notre vie ; et, pour nous épargner la peine de les situer avec précision, le langage vient à notre aide. Ainsi nous avons les beaux-arts : peinture, sculpture, architecture ; et nous ne disons : l’art de la peinture, l’art de la sculpture ou de l’architecture qu’au cours d’une analyse toute de réflexion ; dans le langage usuel, le seul nom de ces arts nous suffit. Nous disons aussi : la poésie, et nous ne la plaçons pas, cependant, parmi les beaux-arts ; ce qui est juste, puisque la beauté des mots et de leur ordonnance n’agit qu’indirectement sur nos sens. Nous disons aussi : l’art poétique, qui implique plus spécialement la technique du verbe, sans vouloir placer ni cette technique ni son résultat esthétique dans la notion de beaux-arts. Ces distinctions sont nettes ; nous n’avons plus qu’à en devenir conscients chaque fois que nous en faisons usage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 19
    "printed_page": "13"
  "translation_ja": "私たちは「芸術」という語のもとに、生のさまざまな表れをひとまとめにする。それら一つ一つの位置を正確に定める手間を省いてくれるのが言葉である。たとえば美術がある。絵画、彫刻、建築である。「絵画の芸術」「彫刻の芸術」「建築の芸術」などと言うのは、ことさらに立ち止まって分析するときだけで、日常はそれぞれの名だけで足りる。「詩」とも言うが、これを美術のうちには数えない。それでよい。言葉そのものとその配列の美しさは、私たちの感覚には間接的にしか働かないからだ。また「詩の技法」とも言う。とりわけ言葉を扱う技術を指すのであって、その技術も、そこから生まれた美的な成果も、美術という概念に含めるつもりはない。こうした区別は明瞭だ。ただ私たちは、使うたびにそれを意識すればよい。"
  "translation_status": "reviewed"
- "id": "appia-0033"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est cependant une forme d’art qui ne trouve sa place ni parmi les beaux-arts, ni dans la poésie (ou la littérature), et qui n’en constitue pas moins un art dans la force du terme. Je veux parler de l’art dramatique. Là, encore, le langage cherche à nous orienter. Le mot dramaturgie, que nous employons rarement et avec un peu de répugnance, est à l’art dramatique ce que, inversement, l’art poétique est à la poésie, il concerne exclusivement la technique du dramaturge, et, même, seulement une partie de cette technique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 19
    "pdf_page_end": 20
    "printed_page": "13"
    "printed_page_end": "14"
  "translation_ja": "ところが、美術にも、詩（あるいは文学）にも収まらず、しかも言葉の最も強い意味でやはり一つの芸術をなすものがある。私が言いたいのは「演劇芸術」のことだ。ここでも言葉は道案内をしようとする。私たちがめったに、それも多少しぶりながら使う「劇作術（ドラマトゥルジー）」と「演劇芸術」との関係は、呼び方の形からすれば逆だが、「詩の技法」と「詩」の関係に当たる。劇作術はただ劇作家の技術に、しかもその一部分にしかかかわらない。"
  "translation_status": "reviewed"
- "id": "appia-0034"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici donc une forme importante de l’art que nous ne pouvons dénommer qu’en la faisant précéder du mot : art. — Pourquoi ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 20
    "printed_page": "14"
  "translation_ja": "こうして、フランス語では名の前に「芸術（アール）」という語を置かなければ呼ぶことのできない、重要な芸術の一形式に出会った。なぜだろう。"
  "translation_status": "reviewed"
- "id": "appia-0035"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tout d’abord l’extrême complexité de cette forme, résultant du grand nombre de moyens dont elle doit disposer pour se manifester en une expression homogène. L’art dramatique comporte d’abord un texte (avec ou sans musique) ; c’est sa part de littérature (et de musique). Ce texte est confié à des êtres vivants qui le récitent ou le chantent et en représentent la vie sur la scène ; c’est sa part de sculpture et de peinture, si l’on en excepte la peinture des décors, dont nous traiterons plus loin. Enfin, l’architecture peut être aussi plus ou moins évoquée autour de l’acteur, de même qu’autour des spectateurs ; car la salle fait partie de l’art dramatique de par ses exigences d’optique et d’acoustique ; pourtant, là, l’architecture est absolument subordonnée à des fins précises qui ne la concernent qu’indirectement. L’art dramatique semble donc emprunter à chacun des autres arts quelques éléments. Peut-il se les assimiler ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 20
    "printed_page": "14"
  "translation_ja": "第一に、この形式がきわめて複雑だからだ。一つにまとまった表現として姿を現すのに、実に多くの手段を必要とする。演劇芸術にはまず、音楽を伴うにせよ伴わないにせよ、台本がある。これがそのうちの文学の、また音楽の受け持ちである。台本は生身の人たちに託される。彼らはそれを語り、あるいは歌い、その生命を舞台に表す。あとで扱う舞台装置の絵を別にすれば、これが彫刻と絵画の受け持ちだ。最後に、俳優を囲む空間にも観客を囲む空間にも、多かれ少なかれ建築の存在がうかがえる。客席は、見るため、聞くための条件を満たす必要によって、演劇芸術の一部をなすからだ。ただしここで建築は、建築自体には間接的にしかかかわらない特定の目的に、完全に従属している。となれば演劇芸術は、ほかの芸術のそれぞれから幾つかの要素を借りているらしい。それらを自分自身のものとして消化できるのだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0036"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Grâce à cette complexité, l’image que l’art dramatique évoque en nous est toujours un peu confuse. Nous nous arrêtons d’emblée à la composition d’un texte où les passions humaines soient exprimées d’une façon que nous puissions partager. Après nous être attardés un moment sur ce point, — sans doute essentiel —, nous sentons, avec quelque embarras, qu’au delà de ce texte, quel qu’il puisse être, se trouve encore quelque chose faisant partie intégrante de l’art dramatique ; un quelque chose dont nous n’avons pas encore la notion exacte, et à quoi nous sommes enclins à ne pas attacher beaucoup d’importance ; probablement parce que nous avons du mal à nous en faire une idée claire. Nous nommons sommairement ce quelque chose : la mise en scène, et nous fermons vite la parenthèse que nous avions à peine ouverte pour y placer cette notion délicate et encombrante. De même que pour certaines besognes fastidieuses, nous abandonnons la mise en scène aux spécialistes, dont c’est, après tout, l’affaire, croyons-nous, pour nous tourner, avec une nouvelle quiétude, vers le texte de l’art dramatique, comme étant, du moins lui, de tout repos, et s’offrant, en cette qualité, généreusement à notre sens critique. En ce faisant, ne conservons-nous pas, malgré nous, un sentiment de malaise ? Abordons-nous jamais de face la notion d’art que nous nommons art dramatique ? Et si nous en prenons le courage, — tel Monsieur Emile Faguet dans son beau livre : Le drame ancien, le drame moderne, — n’avons-nous pas conscience du moment exact où le souffle va nous manquer, et, tels Monsieur Faguet, n’abandonnons-nous pas, dès que cela nous semble décemment possible, une partie de notre bagage, pour ne consacrer notre analyse qu’aux colis facilement portatifs ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 20
    "pdf_page_end": 21
    "printed_page": "14"
    "printed_page_end": "15"
  "translation_ja": "その複雑さのせいで、演劇芸術という言葉が呼び起こすイメージはいつも少しぼやけている。まず私たちが足を止めるのは、人間の情念を、こちらも分かち持てるように表す台本の作り方だ。たしかに本質的であろうこの問題にしばらくかかずらった後、少々当惑しながら気づく。どんな台本であっても、その先にまだ何か、演劇芸術から切り離せないものがある。それが何なのか、私たちにはまだはっきりつかめず、さして重要ではないと見なしがちだ。おそらく明瞭に思い描くのが難しいせいだろう。私たちはそれを手っ取り早く「演出」と呼ぶ。この繊細で厄介な概念を入れるために、開いたばかりの括弧をもう閉じてしまう。退屈な仕事を人任せにするように、結局それは専門家の仕事じゃないかと、演出を専門家に預け、ほっとして台本に向き直る。少なくとも台本なら安心で、安心なぶんだけ、いくらでも批評の腕を振るわせてくれるというわけだ。だがそうしても、心ならずも何かすっきりしない思いが残りはしないか。私たちは「演劇芸術」と呼ぶ芸術の概念に、一度でも正面から取り組んだことがあるだろうか。エミール・ファゲ氏がすぐれた著書『古代の劇、近代の劇』で試みたように、意を決して取り組んでも、どこで息が続かなくなるか自分でわかってはいないか。そしてファゲ氏と同じく、もう体裁がつくと見るや荷物の一部を置いてゆき、楽に運べる包みだけを分析の相手にしてはいないだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0037"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le sujet de cet ouvrage est précisément l’analyse de ceux des facteurs de l’art dramatique sur lesquels nous glissons trop prudemment ; et, cela, dans le but d’en faire des notions claires et propres à devenir des objets de réflexion et de spéculation esthétique profitables au progrès et à l’évolution de l’art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 21
    "printed_page": "15"
  "translation_ja": "本書が分析するのは、まさしく、私たちが用心しすぎて素通りしてきた、こうした演劇芸術の要素である。それらを明瞭な概念にし、この芸術の進歩と発展に役立つ思考と美学的探究の対象にすること、それが私の目的だ。"
  "translation_status": "reviewed"
- "id": "appia-0038"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un aphorisme des plus périlleux nous a induits et continue à nous induire en erreur. Des hommes dignes de foi nous ont affirmé que l’art dramatique était la réunion harmonieuse de tous les arts; et que, s’il n’y était pas encore parvenu, il devait s’y efforcer pour créer ainsi, dans l’avenir, l’œuvre d’art intégral. Ils ont même nommé provisoirement cet art: l’œuvre d’art de l’avenir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 21
    "pdf_page_end": 22
    "printed_page": "15"
    "printed_page_end": "16"
  "translation_ja": "ひどく危うい一つの格言が、私たちを誤らせてきたし、いまも誤らせている。信を置ける人たちは、演劇芸術とはあらゆる芸術が調和して一つになることだと断言した。まだそこまで行っていないなら、将来、完全に統合された芸術作品を作り出せるよう、そこへ向けて努力するべきだ、と。彼らはこの芸術に「未来の芸術作品」という仮の名までつけた。"
  "translation_status": "reviewed"
- "id": "appia-0039"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cela est séduisant, séduisant par la simplification reposante que l’on nous offre ainsi; et nous avons accepté ce non-sens avec empressement. Rien dans notre vie artistique moderne ne le justifie; nos concerts, nos expositions d’art, notre architecture, notre littérature, nos théâtres même le désavouent; nous le sentons, nous le savons presque, et nous persistons à reposer facticement notre sens critique sur cet oreiller de paresse, quitte à ne plus rien comprendre à n’importe laquelle de nos manifestations artistiques; car il est évident qu’en faussant à ce point une définition pour y placer des objets qui n’ont rien à y faire, nous faussons, du même coup, notre jugement sur ces objets considérés isolément. — Si l’art dramatique doit être la réunion harmonieuse, la synthèse suprême de tous les arts, je ne comprends alors plus rien du tout à chacun de ces arts, et moins encore à l’art dramatique: le chaos est complet."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 22
    "printed_page": "16"
  "translation_ja": "いかにも魅力的だ。そうまで単純に考えさせてもらえるなら、気が楽だからである。私たちはこの途方もない話に飛びついた。だが現代の芸術生活には、それを裏づけるものが何もない。演奏会も美術展も、建築も文学も、劇場でさえ、それを否定している。そう感じているし、もう少しでそれをはっきり認めるところまで来ているのに、私たちはこの怠け者の枕にもたれ、批判する力を無理に眠らせようとする。自分たちの芸術の営みがどれ一つ理解できなくなってもかまわないというわけだ。本来そこに入るはずのないものを押し込むため、定義をそこまでねじ曲げれば、そのものを一つずつ見るときの判断まで同時に狂うのは明らかだ。演劇芸術があらゆる芸術の調和した結合、最高の総合でなければならないのなら、私はそれぞれの芸術について何一つわからなくなる。演劇芸術ならなおさらだ。何もかも混乱してしまう。"
  "translation_status": "reviewed"
- "id": "appia-0040"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qu’est-ce donc qui différencie si totalement chacun de nos arts, même la littérature, des facteurs qui composent, par leur subordination réciproque, l’art dramatique? Examinons, de ce point de vue, ces arts."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 22
    "printed_page": "16"
  "translation_ja": "では、文学をも含む個々の芸術と、互いに従属し合うことで演劇芸術を形づくる諸要素とを、そこまではっきり分けるものは何だろう。この観点から、各芸術を見てみよう。"
  "translation_status": "reviewed"
- "id": "appia-0041"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans des circonstances favorables de plastique, de lumière, de couleurs, la vue de la scène peut nous suggérer un morceau de peinture, un groupement sculptural. Dans des circonstances semblables, en ce qui concerne la déclamation (ou le chant et l’orchestre), nous nous rapprochons un instant, — un instant seulement — du plaisir purement littéraire (ou purement musical). Assis confortablement et dans un état de passivité complète, nous ne remarquons guère l’architecture de la salle, elle échappe du moins à nos yeux ; et les fictions fugitives des décors n’évoquent que bien indirectement l’art du volume et de la pesanteur. Confusément, nous devons constater la présence d’un élément inconnu qui échappe à notre réflexion, tout en s’imposant à notre sentiment, — tout en dominant notre sens réceptif de spectateurs. Nous entendons, nous regardons, nous écoutons et nous contemplons, remettant à plus tard l’examen du mystère. Or, plus tard, la reconstitution intégrale de la représentation nous fatigue; nous renonçons à chercher, dans nos souvenirs trop fragmentaires et trop exclusivement voués au contenu intelligible de la pièce, ce qui, durant la soirée, nous a troublés en nous échappant toujours; et une nouvelle expérience nous retrouve semblablement distraits, jusqu’à ce que nous ayons définitivement renoncé à l’enquête."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 22
    "pdf_page_end": 23
    "printed_page": "16"
    "printed_page_end": "17"
  "translation_ja": "形や照明、色の条件が整えば、目の前の舞台から、一幅の絵や彫刻のような人のまとまりを連想することがある。語り（あるいは歌とオーケストラ）にも同じような条件が整うと、純粋に文学だけの（あるいは音楽だけの）喜びに、一瞬、ほんの一瞬だけ近づく。心地よく座り、すっかり受け身になっているので、客席の建築にはほとんど気づかない。少なくとも目には入らない。装置が一時だけ見せる虚構も、量感と重さを扱う芸術を、ごく間接的に思わせるにすぎない。何か未知の要素がそこにあると、おぼろげながら認めざるを得ない。それは考えではつかめないのに感情には迫り、観客としてものを受け取る感覚そのものを支配する。私たちは耳に入る音を聞き、目の前のものを見、耳を傾け、じっと眺め、謎を吟味するのはあと回しにする。だがあとになって上演を丸ごと思い返そうとすると疲れてしまう。記憶はあまりに断片的で、しかも芝居の理解しやすい中身に偏りすぎている。その晩、心をかき乱されながら最後までつかめなかったものを、そんな記憶に探すのをあきらめる。次の上演でも同じように気を取られ、ついには探究そのものを放り出してしまう。"
  "translation_status": "reviewed"
- "id": "appia-0042"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pendant ce temps les musées et les expositions sont ouverts ; l’architecture, la littérature, la musique sont facilement accessibles; nous voletons de l’un à l’autre en croyant butiner des trésors, et, pourtant, sans sérénité, et, disons-le franchement, sans réel bonheur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 23
    "printed_page": "17"
  "translation_ja": "その間も美術館や展覧会は開いており、建築も文学も音楽も、たやすく触れられる。私たちは宝の蜜を集めるつもりであちこち飛び回る。けれども心は晴れやかではなく、率直に言えば、本当の幸福もない。"
  "translation_status": "reviewed"
- "id": "appia-0043"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’art dramatique s’adresse, comme nos arts respectifs, à nos yeux, nos oreilles, à notre entendement, — bref, à notre présence intégrale. Pourquoi tout effort de synthèse est-il réduit, et d’avance, à néant? Nos artistes sauront-ils nous renseigner?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 23
    "printed_page": "17"
  "translation_ja": "演劇芸術は、それぞれの芸術と同じように、目に、耳に、理解力に、要するに、そこにいる私たちの全存在に呼びかける。それなのに、総合しようという努力はなぜ初めから無に帰すのだろう。芸術家たちなら、そのわけを教えられるだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0044"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le poète, plume à la main, fixe sur du papier son rêve. Il en fixe le rythme, la sonorité et les dimensions. Cette écriture, il la donne à lire, à déclamer; et, de nouveau, elle se fixe dans l’aspect du lecteur, dans la bouche du récitant. — Le peintre, pinceau à la main, fixe sa vision telle qu’il la veut interpréter; et la toile ou la muraille en déterminent les dimensions; les couleurs en immobilisent les lignes, les vibrations, les lumières et les ombres. — Le sculpteur arrête, en sa vision intérieure, les formes et leurs mouvements au point exact qu’il désire; puis il les immobilise dans la glaise, la pierre ou le bronze. — L’architecte fixe minutieusement, par ses dessins, les dimensions, l’ordonnance et les formes multiples de sa construction; puis il les réalise dans son matériel de construction. — Le musicien fixe dans les pages de sa partition les sons et leur rythme; il possède même, à un degré mathématique, le pouvoir d’en déterminer l’intensité et, surtout, la durée; alors que le poète ne saurait le faire que très approximativement, puisque le lecteur peut lire vite ou lentement à son gré."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 23
    "pdf_page_end": 24
    "printed_page": "17"
    "printed_page_end": "18"
  "translation_ja": "詩人はペンを手に、夢を紙の上に定着させる。そのリズム、響き、広がりを定める。この書かれたものを人に読ませ、朗誦させると、今度は読む人の姿や朗誦する人の口に、それが定着する。画家は筆を手に、自分が表したいように見えている像を定着させる。画布や壁がその大きさを決め、色が線、震え、光と影を動かぬものにする。彫刻家は心に見えている形とその動きを、思いどおりの一点で止め、粘土、石、あるいは青銅の中に動かぬものとする。建築家は図面によって、建物の寸法、各部の配置、多様な形を細かく定め、それを建築材料で実現する。音楽家は楽譜のページに音とリズムを定着させる。それどころか、数学といってよいほど正確に、音の強さ、とりわけ長さを決めることができる。詩人に同じことができるとしても、ごく大まかにでしかない。読者は気の向くまま、速くも遅くも読めるからだ。"
  "translation_status": "reviewed"
- "id": "appia-0045"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici donc les artistes, dont l’activité réunie devrait constituer l’apogée de l’art dramatique : un texte poétique définitivement fixé; une peinture, une sculpture, une architecture, une musique définitivement fixées. Plaçons tout cela sur la scène : nous aurons la poésie et la musique qui se développeront dans le temps; la peinture, la sculpture, l’architecture qui s’immobilisent dans l’espace, et l’on ne voit guère comment concilier la vie propre à chacun d’eux en une harmonieuse unité !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 24
    "printed_page": "18"
  "translation_ja": "以上が、一緒に仕事をすれば演劇芸術をその頂点に至らせるはずの芸術家たちである。その手から出てくるのは、最終的な形に定められた詩の言葉と、やはり最終的な形に定められた絵画、彫刻、建築、音楽だ。これらをそっくり舞台にのせてみよう。詩と音楽は時間の中で展開を続ける。絵画、彫刻、建築は空間の中で動かぬままだ。それぞれに固有の生命をどう折り合わせ、調和した一つのものにするか、その方法など見えてはこない。"
  "translation_status": "reviewed"
- "id": "appia-0046"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ou bien, y aurait-il un moyen de le faire? Le temps et l’espace posséderaient-ils un terme conciliant, — un terme qui leur soit commun? La forme dans l’espace peut-elle prendre sa part des durées successives du temps? Et ces durées trouveraient-elles l’occasion de se répandre dans l’espace? Car, à cela se réduit le problème, si nous voulons réunir les arts du temps et les arts de l’espace en un même objet."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 24
    "printed_page": "18"
  "translation_ja": "いや、その方法があるとしたらどうだろう。時間と空間の間を取り持つ項、両者に共通する項が、ひょっとしてありはしないか。空間にある形は、時間の中を次々に流れる持続を、自分にも引き受けられるだろうか。反対に、それらの持続は空間に広がる機会を見いだせるだろうか。時間の芸術と空間の芸術を同じ対象に結びつけたいなら、問題はそこに尽きる。"
  "translation_status": "reviewed"
- "id": "appia-0047"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans l’espace, la durée s’exprimera par une succession de formes, donc par le mouvement. Dans le temps, l’espace s’exprimera par une succession de mots et de sons, c’est-à-dire par des durées diverses qui dictent l’étendue du mouvement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 24
    "printed_page": "18"
  "translation_ja": "空間の中では、持続は次々に移り変わる形、つまり運動によって表される。時間の中では、空間は次々に現れる言葉と音、つまり運動の広がりを決める、さまざまな長さの持続によって表される。"
  "translation_status": "reviewed"
- "id": "appia-0048"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le mouvement, la mobilité, voilà le principe directeur et conciliant qui réglera l’union de nos diverses formes d’art pour les faire converger, simultanément, sur un point donné, sur l’art dramatique; et, comme il s’annonce le seul et indispensable, il ordonnera hiérarchiquement ces formes d’art, les subordonnant les unes aux autres, aux fins d’une harmonie qu’à elles seules elles eussent cherché en vain."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 25
    "printed_page": "19"
  "translation_ja": "運動すること、動きうること。これこそ、さまざまな芸術形式を取り持ち、その結合を導き、それらを同時に一点へ、すなわち演劇芸術へと集める原理である。唯一欠くべからざる原理と見える以上、諸芸術を序列に沿って並べ、互いに従属させ、各々では求めても得られなかった調和へ導くことになる。"
  "translation_status": "reviewed"
- "id": "appia-0049"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous voici au nœud de la question, à savoir: comment appliquer le mouvement à ce que nous appelons les beaux-arts, qui sont, de par leur nature, immobiles? comment l’appliquer à la parole, et à la musique surtout, dont l’existence s’écoule exclusivement dans le temps, et qui sont donc également immobiles vis-à-vis de l’espace? Chacun de ces arts doit sa perfection, son achèvement, à son immobilité même; ne perdront-ils pas leur seule raison d’être si nous les en privons? Ou, du moins, leur valeur n’en sera-t-elle pas réduite à peu de chose?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 25
    "printed_page": "19"
  "translation_ja": "ここが問題の核心だ。本性からして動かない「美術」に、どうやって運動を取り入れるのか。また、存在のすべてが時間の中で流れ、空間から見ればやはり動かない話し言葉や、とりわけ音楽に、どうやって運動を取り入れるのか。どの芸術もまさに動かないおかげで完全さを得て、ひとつの完成に至る。それを取り上げたら、ただ一つの存在理由まで失われるのではないか。少なくとも価値はごくわずかになってしまうのではないか。"
  "translation_status": "reviewed"
- "id": "appia-0050"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une seconde question s’impose ici; sa résolution déterminera nos recherches et dirigera notre démonstration. Le mouvement n’est pas, en soi, un élément: le mouvement, la mobilité, est un état, une façon d’être. Il s’agirait d’examiner quels éléments de nos arts seraient capables d’abandonner l’immobilité qui leur est propre, qui est dans leur caractère."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 25
    "printed_page": "19"
  "translation_ja": "ここでもう一つの問いを避けて通れない。その答えが探究の方向を定め、論証を導くだろう。運動は、それだけでは一つの要素ではない。運動すること、動きうることは一つの状態、あり方なのだ。それぞれの芸術のどの要素なら、自らに固有の、性質の一部でもある不動性を手放せるのかを調べる必要がある。"
  "translation_status": "reviewed"
- "id": "appia-0051"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Peut-être gagnerons-nous des notions utiles à ce sujet si, laissant un instant la forme de chacun de nos arts, — des arts qui ont à s’unir, nous a-t-on affirmé, pour créer l’œuvre d’art suprême, — nous considérons cette union comme déjà réalisée sur la scène. Admettons le cas. Cela nous amène à définir premièrement ce qu’est une scène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 25
    "printed_page": "19"
  "translation_ja": "そこで一つ、考えの手がかりになるかもしれないことがある。最高の芸術作品を作るためには諸芸術が結合しなければならない、と断言された。では、その諸芸術の形それぞれはひとまず措き、舞台ではすでにその結合が実現したと考えてみよう。そう仮定すると、最初に舞台とは何かを定義しなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0052"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La scène est un espace vide, plus ou moins éclairé, et de dimensions arbitraires. L’une des parois qui bornent cet espace est partiellement ouverte sur la salle destinée aux spectateurs, et forme, ainsi, un cadre rigide, au delà duquel l’ordonnance des sièges est définitivement fixée. Seul, l’espace de la scène attend toujours une nouvelle ordonnance, et, par conséquent, doit être aménagé pour de continuels changements. Il est plus ou moins éclairé; les objets que l’on y placera attendront une lumière qui les rende visibles. Cet espace n’est donc, en quelque sorte, qu’en puissance (latente), tant pour l’espace que pour la lumière. — Voici deux éléments primordiaux de notre synthèse, l’espace et la lumière, que la scène contient en puissance et par définition."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 25
    "pdf_page_end": 26
    "printed_page": "19"
    "printed_page_end": "20"
  "translation_ja": "舞台は、ある程度の明るさをもった空っぽの空間で、寸法は特に決まっていない。この空間を囲む壁の一つは、観客のための客席に向け、その一部が開いている。それが動かない枠をなし、その向こうでは座席の配置が最終的な形に定まっている。舞台空間だけはいつも新しい配置を待っており、それゆえ絶えず変えられるように作っておかなくてはならない。ある程度明るくはあるが、そこに置かれる物は、自分を見えるようにしてくれる光を待っている。つまりこの場は、空間としても光に関しても、いわば潜在的な可能性でしかない。ここに、舞台が定義上、潜在的に含んでいる私たちの総合の二つの根本要素、空間と光がある。"
  "translation_status": "reviewed"
- "id": "appia-0053"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Examinons maintenant le mouvement sur la scène. Il est au texte et à la musique, — les arts du temps —, exactement du même secours qu’aux objets immobiles de l’espace: il est le point de ralliement, le seul possible. En lui s’opère sur la scène la synthèse annoncée. Reste à savoir comment."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 26
    "printed_page": "20"
  "translation_ja": "次に舞台上の運動を見てみよう。台本と音楽、つまり時間の芸術に対しても、運動は空間にある動かない物に対するとまったく同じ役に立つ。運動は両者が合流する、唯一可能な場である。先に述べた総合は、舞台上でこの運動のうちに起こる。残るのは、それがどう起こるかだ。"
  "translation_status": "reviewed"
- "id": "appia-0054"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le corps, vivant et mobile, de l’acteur, est le représentant du mouvement dans l’espace. Son rôle est donc capital. Sans texte (avec ou sans musique), l’art dramatique cesse d’exister; l’acteur est le porteur du texte; sans mouvement, les autres arts ne peuvent pas prendre de part à l’action. D’une main, l’acteur s’empare du texte, de l’autre il tient, en un faisceau, les arts de l’espace, puis il réunit, irrésistiblement, ses deux mains et crée, par le mouvement, l’œuvre d’art intégral. Le corps vivant est ainsi le créateur de cet art, et détient le secret des relations hiérarchiques qui en unissent les divers facteurs, puisqu’il est à leur tête. C’est du corps, plastique et vivant, que nous devons partir pour revenir à chacun de nos arts et déterminer leur place dans l’art dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 26
    "printed_page": "20"
  "translation_ja": "生きて動く俳優の身体が、空間の中で運動を体現する。それゆえ身体の役割は決定的である。音楽を伴おうと伴うまいと、台本がなければ演劇芸術は成り立たない。台本を担うのは俳優である。そして運動がなければ、それ以外の芸術は劇の行為に加われない。俳優は片手で台本をつかみ、もう片方で空間の諸芸術をひと束にして握る。やがて抗いがたく両手を合わせ、運動によって完全に統合された芸術作品を創り出す。こうして生きた身体がこの芸術の創り手となる。さまざまな要素を結びつける序列の秘密を握るのも、それらの先頭に立つ身体である。それぞれの芸術に立ち戻り、演劇芸術の中に占める位置を確かめるために、私たちは立体をなし、生きている身体から出発しなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0055"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le corps n’est pas seulement mobile: il est plastique. Cette plasticité le met en rapport direct avec l’architecture et le rapproche de la forme sculpturale, sans pouvoir néanmoins s’identifier avec elle, puisqu’il est mobile. Par contre, le mode d’existence de la peinture ne saurait lui convenir. A un objet plastique doivent correspondre des ombres et des lumières positives, effectives. Devant un rayon de lumière peint, une ombre portée peinte, le corps plastique reste dans son atmosphère propre, dans sa lumière et son ombre à lui. Il en est de même des formes indiquées par la peinture ; ces formes ne sont pas plastiques, n’ont pas trois dimensions ; le corps en a trois; leur rapprochement n’est pas possible. Les formes et la lumière peintes ne trouvent ainsi pas de place sur la scène: le corps humain la leur refuse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 26
    "pdf_page_end": 27
    "printed_page": "20"
    "printed_page_end": "21"
  "translation_ja": "身体はただ動けるだけではなく、立体的な形をもっている。その立体性によって身体は建築と直接結びつき、彫刻の形に近づく。とはいえ動くのだから、彫刻と同じものにはなれない。一方、絵画のあり方は身体にはなじまない。立体物に対応するのは、実際にそこにある光と影でなければならない。描かれた光線や、絵に描いた落ち影の前に立っても、立体である身体は自分を包む空気、自分自身の光と影の中にとどまる。さし示された形にしても同じだ。絵に描かれた形は立体でなく、三次元を持たない。身体には三次元がある。両者は近づきようがない。このように描かれた形と光には、舞台の上に居場所がない。人間の身体がそれを拒むのだ。"
  "translation_status": "reviewed"
- "id": "appia-0056"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Que restera-t-il alors de la peinture, puisque après tout il semble qu’elle ait à prendre sa part de l’art intégral? La couleur, probablement. Mais la couleur n’est pas l’apanage exclusif de la peinture; on pourrait même avancer qu’en peinture la couleur même est fictive, puisqu’elle est chargée d’immobiliser une seconde de lumière, sans pouvoir suivre le rayon ni l’ombre dans leur carrière. La couleur, du reste, est si étroitement unie à la lumière, qu’il est difficile de l’en séparer; et, comme la lumière est mobile au plus haut degré, la couleur le sera également. Nous voici loin de la peinture ! Car si la couleur y est une fiction, la lumière l’est aussi; et tout ce que la peinture peut demander à la lumière véritable, c’est de la rendre visible ; ce qui n’a rien à voir avec la vie lumineuse. Un tableau bien éclairé, c’est un ensemble fictif de formes, de couleurs, de clartés et d’ombres, présenté sur une surface plane, que l’on a placé le plus favorablement possible, en évidence et non pas dans l’obscurité. Mais c’est là tout."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 27
    "printed_page": "21"
  "translation_ja": "それでも絵画は、結局のところ、この統合された芸術にいくらか加わるはずだとしよう。では、絵画から何が残るのだろう。おそらく色だろう。だが色は絵画だけのものではない。それどころか、絵画では色そのものも虚構だと言ってよい。光の一秒をとどめておくのが色の務めであり、光線や影が移りゆくあとをついていけないからだ。また色は光とあまりに深く結びつき、切り離しにくい。光にはこの上なく動きがあるのだから、色も同じように動くことになる。これではもはや絵画とはほど遠い。絵の中で色が虚構なら、光もまた虚構だからだ。そして真の光に絵画が求められるのは、絵を見えるようにしてもらうことだけであり、光そのものの生命とは何の関係もない。よく照らされた絵画とは、形、色、明るさと影が虚構の一組をなして平面に示され、暗がりではなく、最もよく見える場所に置かれているものだ。それだけのことである。"
  "translation_status": "reviewed"
- "id": "appia-0057"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’absence de plastique prive la peinture d’un des éléments les plus puissants, les plus merveilleusement expressifs de notre vie sensorielle: la lumière. Et nous voudrions unir organiquement la peinture au corps vivant! Nous chercherions à lui conférer un rang dans la hiérarchie scénique ! Comme si sa qualité de bel art nous obligeait à l’accueillir nécessairement dans la composition de l’art intégral; toujours trompés que nous sommes par l’idée que cet art représente la synthèse harmonieuse de tous les arts."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 27
    "pdf_page_end": 28
    "printed_page": "21"
    "printed_page_end": "22"
  "translation_ja": "立体性の欠如は、私たちの感覚の生を成すもののうち、最も力があり、最もみごとな表現力を持つものの一つ、光を絵画から奪っている。それなのに私たちは、絵画を生きた身体と有機的に結びつけようというのか。舞台の序列の中に、絵画にも一席を与えようというのか。美術の一部門だというだけで、統合された芸術の中にどうしても迎え入れなくてはならないかのように。この芸術はあらゆる芸術の調和した総合だ、との考えに、私たちは飽きもせず欺かれている。"
  "translation_status": "reviewed"
- "id": "appia-0058"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous touchons là, comme du doigt, la fausseté grossière de cet aphorisme. — Ou bien la peinture doit renoncer à son existence fictive en faveur du corps vivant, ce qui équivaut à se supprimer elle-même; ou bien le corps doit renoncer à sa vie plastique et mobile, et donner à la peinture un rang supérieur au sien, ce qui est la négation de l’art dramatique. Nous n’avons donc pas le choix.*"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 28
    "printed_page": "22"
  "translation_ja": "ここに至って、あの格言のひどい誤りには、いわば指で触れられるほどだ。絵画に虚構としてのあり方を捨てさせて生きた身体に道を譲らせるか。だとすれば絵画が自分を消し去るに等しい。それとも身体が立体として動きながら生きることを捨てて、絵画に自分より上の位を与えるか。それでは演劇芸術を否定することになる。だから私たちに選択の余地はない。*"
  "translation_status": "reviewed"
- "id": "appia-0059"
  "section_id": "elements"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Notre mise en scène courante a opté pour la peinture : peut-être est-ce inutile de le dire?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 28
    "printed_page": "22"
  "translation_ja": "今日ふつうに見られる演出は絵画のほうを選んだ。わざわざ言うまでもないかもしれないが。"
  "translation_status": "reviewed"
- "id": "appia-0060"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais, faut-il vraiment, pour cela, renoncer complètement aux suggestions que la peinture nous donne? Rappelons-nous que ses restrictions lui sont une garantie de perfection; et cette perfection immobilisée nous permet de contempler à loisir un état de la nature, de la vie extérieure, souvent fugitif, et d’en observer les rapports multiples et les gradations. De plus, cet instant a été choisi soigneusement parmi tous les autres : il est un spécimen de choix ; ce qui implique de la part du peintre un genre d’interprétation à laquelle la plasticité mobile du corps vivant ne pourra jamais prétendre. Allons même plus loin. Le peintre n’immobilise pas seulement un état fugitif du monde extérieur ; il cherche à exprimer, par des moyens subtils qui lui sont propres, l’état précédent et celui qui va suivre, ou qui pourrait vraisemblablement suivre. Sa peinture contient, par conséquent, le mouvement en puissance; non plus exprimé dans l’espace ou le temps, mais dans la forme et les couleurs. Et c’est pourquoi celles-ci doivent être fictives."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 28
    "pdf_page_end": 29
    "printed_page": "22"
    "printed_page_end": "23"
  "translation_ja": "だからといって、絵画が私たちに促す想像を、ほんとうにすっかり手放すべきなのだろうか。絵画の制約こそが、絵画の完成度を保証することを思い起こそう。その完成されたものがとどまっているおかげで、私たちは自然の、外界の生の、しばしば束の間に過ぎゆく状態を、心ゆくまで眺められる。その状態に見えるさまざまな関係や微妙な移り目を観察できる。しかもその一瞬は、あらゆる瞬間の中から念入りに選ばれている。えり抜きの標本なのだ。そこには、生きた身体の動く立体性にはどうしてもできないような、画家による解釈がある。もう一歩進んでみよう。画家は外の世界の移ろいやすい一状態をとどめるだけではない。自分に固有の繊細な手だてで、その前の状態と、次に来るか、来そうな状態とを表そうとする。だから画家の絵には潜在的に運動がある。ただし運動はもう、空間や時間ではなく、形と色によって表される。それゆえ形や色は虚構でなくてはならない。"
  "translation_status": "reviewed"
- "id": "appia-0061"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous commençons à nous douter du rôle que joue la peinture dans l’art dramatique. Ce rôle est indirect; mais, pour être indirect il n’en est pas moins d’une certaine importance. L’œuvre du peintre détermine les restrictions que la mobilité nous impose, et nous y rend sensibles. Nous nous voyons forcés de renoncer à la perfection, à l’achèvement, que seule l’immobilité confère ; et, si, pour nous illusionner sur ce point, nous immobilisons un instant du jeu des acteurs, nous sacrifions le mouvement, sans, pour ce sacrifice, obtenir la moindre compensation; c’est pourquoi un « tableau vivant » répugne toujours à l’artiste, car il donne l’image figée du mouvement, mais sans son contexte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 29
    "printed_page": "23"
  "translation_ja": "絵画が演劇芸術の中で果たす役割が、少し見えてきた。役割は間接的だが、間接的であるからといって、重要でないわけではない。画家の作品は、動くものを扱う以上何を断念しなければならないかを明らかにし、その制約を身にしみてわからせる。動かないものだけが得られる完全さ、完成を、私たちは諦めざるを得ない。そこで、諦めずに済んだように錯覚するため俳優の演技の一瞬を静止させれば、私たちは運動を犠牲にしながら何の見返りも得られない。「活人画」が芸術家の気にいつも障るのはそのためだ。運動の止まった姿を示しはしても、それを取り巻く前後の事情を示さないからである。"
  "translation_status": "reviewed"
- "id": "appia-0062"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et la sculpture? Elle a ceci de commun avec la peinture qu’elle fixe et immobilise un instant choisi du mouvement et possède, peut-être à un degré supérieur, le pouvoir d’exprimer le contexte de ce mouvement. De même que la peinture, elle représente un spécimen de choix et en a les qualités de perfection, d’achèvement. Mais la diversité infinie de la lumière, des ombres et des couleurs fictives, lui est refusée. En compensation elle a la plasticité qui appelle la lumière effective. Voilà, certes, une large compensation ! Du point de vue où nous sommes ici, la sculpture est celui des arts qui paraît nous importer le plus, puisque son objet est le corps humain.* La seule chose qui lui manque, c’est la vie, donc le mouvement, qu’elle doit sacrifier à sa perfection; mais là est son seul sacrifice. Il va de soi qu’une statue peinte, comme l’étaient celles des Grecs, ne touche en rien à la peinture; elle n’est que coloriée, mais non pas peinte. La sculpture n’a pas de contact avec la peinture. — L’architecture est plastique; ainsi que la sculpture elle appelle la lumière effective et peut être coloriée. Elle est donc, en ce sens, du même ordre que la sculpture. La fresque, expression suprême de la peinture, et probablement la seule qu’elle devrait se permettre, ne saurait nous illusionner; en offrant à la peinture des surfaces planes, l’architecte n’entre pas pour cela en contact organique avec elle; les lignes, les reliefs d’une construction, encadrent les fictions peintes, et ne les feront valoir qu’à la condition de s’en différencier absolument. Nous savons que les trompe-l’œil où la peinture s’efforce de continuer, d’amplifier les lignes et la perspective architecturales, sont d’un goût déplorable; telle une musique jouée devant un tableau pour s’y identifier, ou telle autre juxtaposition naïve d’éléments d’art étrangers l’un à l’autre. L’architecture est l’art de grouper les masses dans le sens de leur pesanteur; la pesanteur est son principe esthétique ; exprimer la pesanteur en une ordonnance harmonieuse mesurée à l’échelle du corps humain vivant, et destinée à la mobilité de ce corps, tel est l’objet suprême de l’architecture. — L’architecture gothique exprime bien la pesanteur de la pierre, mais par sa négation; il entre là un effort moral. que nous apercevons partout où cette négation n’a rien de moral à exprimer et devient superflue. Que dirions-nous d’une salle de bal ou de spectacle en style gothique ? De plus, un édifice gothique qui serait construit en carton ou en bois, serait une monstruosité, puisque la victoire sur la pesanteur, — seule justification d’un style après tout dévoyé, — ne serait plus exprimée par la matière de la construction. Il est même pénible d’y songer.* Cet art de la pesanteur, en contact étroitement organique avec le corps humain, n’existant même que par lui, se développe dans l’espace; sans la présence du corps il reste muet. Art de l’espace, par excellence, il est conçu pour la mobilité de l’être vivant. Or, nous avons vu que le mouvement est le principe conciliant qui unit formellement l’espace au temps. L’architecture est donc un art qui contient, en puissance, le temps et l’espace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 29
    "pdf_page_end": 31
    "printed_page": "23"
    "printed_page_end": "25"
  "translation_ja": "では彫刻はどうか。運動の中から選んだ一瞬をとどめ、固定し、その運動の前後を表す力を、ひょっとすると絵画以上に備える。そこは絵画と共通している。絵画と同じように、えり抜きの標本を表し、その完全さ、完成度をもつ。しかし虚構の光と影、色がもつ無限の多様さは、彫刻には許されない。その代わり、彫刻には実際の光を呼び込む立体性がある。まことに大きな埋め合わせではないか。今の視点で言えば、諸芸術で私たちにとって最も重要そうなのが彫刻だ。人間の身体を対象とするからである。* 彫刻に欠けているのは生命、すなわち運動だけだ。完全さを得るため犠牲にしなければならないが、犠牲にするのはそれ一つである。ギリシア人の彫像がそうだったように、色を塗った像が、絵画とは何の関係もないのは言うまでもない。色がついているだけで、絵として描かれているのではない。彫刻は絵画に接するところを持たない。建築は立体的である。彫刻と同様、実際の光を呼び込み、色をつけることもできる。この意味では、建築は彫刻と同じ部類に属する。絵画の最高の表現で、おそらく絵画にとって許されるただ一つの表現でもあるフレスコにも、私たちはまやかされてはならない。建築家は絵画に平面を提供するが、それだけで有機的な関係に入るわけではない。建築の線や凹凸は描かれた虚構を縁取るが、それを引き立てるのは、あくまで互いが全く異なる場合に限られる。絵画が建築の線や遠近法を先へ伸ばし、拡張しようとするだまし絵には、まことに趣味がないことを、私たちは知っている。絵と一体にしようとその前で音楽を奏でるとか、互いに異質な芸術の要素を素朴に並べてしまうとか、そういうことと変わらない。建築は、物の塊をその重さの働く向きにまとめる芸術である。重力が建築美学の原理なのだ。生きた人間の身体を尺度とし、その身体が動くための調和ある配置によって重力を表現することが、建築の最高の目的である。ゴシック建築も確かに石の重さを表現するが、重さを否定することによって表現する。そこには精神的な努力が入り込む。重さを否定しても、何も精神的なものを表せず、無駄に終わるところでは、その努力ばかりが目につく。ゴシック様式の舞踏会場や劇場を、私たちはどう思うだろう。さらに、もしゴシック様式の建物が厚紙や木で建っていたら、それこそ怪物である。結局は道を誤った一様式を正当化するただ一つのこと、重さに打ち勝つことが、もはや建築の素材で表されなくなるからだ。考えるだけでつらくなる。* この重力の芸術は、人間の身体と緊密に、有機的に接しており、身体によって初めて存在し、空間に展開する。身体が臨まなければ、ものを言わない。空間の芸術の最たるものだが、生きものが動くことを念頭に置いて構想される。さて運動が、空間と時間を形式の上で結びつける仲立ちの原理であることを見てきた。だから建築は、時間と空間を潜在的に含む芸術なのだ。"
  "translation_status": "reviewed"
- "id": "appia-0063"
  "section_id": "elements"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Tout autre objet de sculpture ressort de l’architecture, dont il est alors l’un des ornements. L’animalier n’est qu’un dérivé du sculpteur, sans rivalité possible, bien que son art soit remarquable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 29
    "printed_page": "23"
  "translation_ja": "それ以外のものを対象にした彫刻は、建築に属し、その装飾の一つとなる。動物を彫る作家は彫刻家から枝分かれした存在にすぎず、その技がみごとでも、彫刻家に並び立つことはない。"
  "translation_status": "reviewed"
- "id": "appia-0064"
  "section_id": "elements"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Les construction en fer ne sont qu’indirectement sous la loi de la pesanteur, et ne ressortent, par conséquent, qu’indirectement de l’esthétique spéciale à l’architecture."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 30
    "printed_page": "24"
  "translation_ja": "鉄の建造物は、間接的にしか重力の法則に従わない。したがって、建築に固有の美学にも間接的にしか属さない。"
  "translation_status": "reviewed"
- "id": "appia-0065"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous avons marqué le caractère de fixité, d’achèvement définitif de chacun de nos arts; puis nous les avons classés en arts dans le temps et arts dans l’espace. Le mouvement s’est trouvé le seul terme conciliant entre les deux catégories, puisqu’il unit l’espace et le temps dans une même expression. Le corps humain, vivant et mobile, représente, donc, sur la scène, l’élément conciliant et doit, en cette qualité, obtenir le premier rang. Sa plasticité le rapproche de la sculpture et de l’architecture, mais l’éloigne définitivement de la peinture. De plus, nous avons vu que la plasticité appelle la vie même de la lumière, alors que la peinture n’en est que la représentation fictive. Tout cela étant déterminé, résumons encore les données précédentes, plus spécialement relatives à ce que nous appelons les beaux-arts, arts de l’espace. Tous trois, — peinture, sculpture, architecture, — sont immobiles; ils échappent au temps. La peinture n’étant pas plastique échappe de plus à l’espace, et, par lui, à la lumière effective. Ses grands sacrifices sont compensés par le pouvoir d’évoquer l’espace en une fiction de choix; et sa technique l’autorise à un nombre presque illimité d’objets, qu’elle a le moyen de fixer en suggérant le contexte de l’instant choisi. Sa participation à l’idée de durée est, en quelque sorte, symbolique. — La sculpture est plastique, elle vit dans l’espace et participe ainsi à la lumière vivante. Comme la peinture, elle sait évoquer le contexte des mouvements de son choix qu’elle immobilise; et, cela non plus en un symbole fictif, mais en une réalité matérielle. L’architecture est l’art de créer des espaces déterminés et circonscrits, destinés à la présence et aux évolutions du corps vivant. Elle exprime ce fait tant en hauteur qu’en profondeur, et par une superposition d’éléments solides dont le poids assure la solidité. C’est un art réaliste; l’emploi de la fiction y est un luxe. L’architecture contient l’espace par définition et le temps dans son application. C’est donc le plus favorisé des beaux-arts."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

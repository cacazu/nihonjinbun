    "printed_page_end": "42"
  "translation_ja": "目的が何であれ、重力の働きを変えてしまえば、身体の表現は損なわれる。そこで生きた芸術の第一の原理、ひょっとすると、ほかがすべて自ずと導かれる唯一の原理は、身体以外の形は身体の形と対立するようにし、けっしてその形になじませない、ということになる。それでも、動きや姿勢の表現を一時やわらげるため、線の柔らかさが望ましい場合もあるかもしれない。そうした例外をあえて示すこと自体が、表現になる。だがそれが長引くと、身体が実際にそこにいるという力は弱まる一方で、ついには失われてしまう。身体はいるのに、身体としての効果がない。動きは無用になり、ひいては滑稽になるか、しるしにすぎなくなる。こうして私たちは日常生活と風俗劇に舞い戻る。建築でも同じように、重力が身体の表現に不可欠だと見てきた。重力であって、鈍重さではない！　重力は一つの原理だ。物質は重力によって自らの存在を示し、その示し方の無数の度合いが、表現を作り出す。体積だけなら風船のように空へ逃れることもある。その確かさは見かけにすぎない。空間の一部をしばらく閉じ込めたもの、それだけである。ちょうど空気を入れた薄皮の人形だ。この点では、イタリア流の踊り手は、繰り返し拍子に合わせ、つなぎ留められた場所まで引き戻される風船のように見える。生きた身体から生命を分けてもらうには、空間はその身体に逆らわなければならない。身体の形になじんでしまえば、空間は自らの不活発さを増すだけだ。逆に、身体が逆らうことで、空間の形は生きる。生きた空間とは、身体の形が、生命のない形に勝つことだ。双方の働きは完全に応え合っている。"
  "translation_status": "reviewed"

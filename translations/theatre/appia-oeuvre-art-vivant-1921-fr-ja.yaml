  "kind": "paragraph"
  "origin": "source"
  "source_text": "Richard Wagner n’a opéré qu’une seule réforme essentielle. Par le moyen de la musique il a pu concevoir une action dramatique dont tout le poids — le centre de gravité — reposât à l’intérieur des personnages, et qui, néanmoins, put être complètement exprimée pour l’auditeur, et cela, non plus seulement par des mots et des gestes indicateurs, mais par un développement positif, qui épuisât, sans réserve, le contenu passionnel de cette action. Il voulut, alors, la porter à la scène, c’est-à-dire l’offrir à nos yeux; et c’est là qu’il échoua ! Doué, et comme personne avant lui, d’une puissance absolument incommensurable en ce qui concerne la technique dramatique hors de la représentation, Wagner a cru que la mise en scène en résulterait automatiquement; il ne s’imaginait pas une technique décorative différente de celle de ses contemporains. Un plus grand soin, plus de luxe encore, lui paraissaient suffisants. Sans doute que les acteurs, en tant que porteurs de la nouvelle action, furent l’objet de son attention spéciale; mais — chose vraiment fort étrange — s’il fixait minutieusement leur jeu, et purifiait, par là, nos tristes conventions d’opéra, il trouvait naturel, ensuite, de placer autour et derrière eux des toiles verticales et peintes, dont le non-sens réduisait à néant tout effort vers l’harmonie et la vérité esthétique de son drame représenté. En fut-il conscient ? Il serait difficile de l’affirmer, bien que, dans un opuscule consacré aux représentations de Parsifal à Bayreuth, en 1882 (quelques mois avant sa mort), il ait écrit qu’il sentait que son art dramatique représenté était encore dans l’enfance."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 116
    "pdf_page_end": 117
    "printed_page": "110"
    "printed_page_end": "111"
  "translation_ja": "リヒャルト・ワーグナーが行った本質的な改革は一つだけだった。音楽によって、重みのすべて、つまり重心が登場人物の内面にありながら、聴き手に余すところなく表現できる劇の行為を構想したのだ。それを表現するのは、何かを指し示す言葉や身ぶりだけではない。その行為にこもる情念を残らず展開させるのである。そこで彼は、その行為を舞台に載せ、私たちの目にも見せようとした。失敗したのはここだ。上演とは別のところで劇を組み立てる技術について、先人の誰にも比べられないほどの力をもっていたワーグナーは、そこから演出がひとりでに生まれると考えた。同時代の人々とは違う舞台美術の技術を思い描くことができなかった。もっと入念に、もっと豪華にすれば十分に思えた。新しい劇の行為を担う俳優たちには、たしかに特別な注意を払った。だが、じつに奇妙なことに、俳優の演技は細部まで定めて、嘆かわしいオペラの旧習を取り除いたのに、その周囲や背後に絵を描いた布を垂直に吊るすことは、当たり前だと思っていた。そんな道理に合わない装置は、上演される劇に調和と美の真実をもたらそうとする努力を無にした。本人に自覚があったのか。そうだと言い切るのは難しい。ただ、亡くなる数か月前の1882年、バイロイトでの『パルジファル』上演を論じた小冊子には、上演としての自分の演劇はまだ揺籃期にあると感じている、と書いている。"
  "translation_status": "reviewed"
- "id": "appia-0227"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En résumé: la réforme wagnérienne concerne la conception même du drame; la musique de Wagner en est la résultante; et, le tout confère à l’œuvre une si haute portée qu’il a fallu l’isoler en des représentations solennelles et d’exception. Cette dernière conséquence, Wagner l’applique à tout l’art dramatique; par là il est un Précurseur. Mais il n’a pas su faire concorder la forme représentative — la mise en scène — avec la forme dramatique qu’il adoptait. D’où est résulté un écart si considérable entre ses intentions et leur réalisation visuelle que toute son œuvre s’est trouvée infirmée et défigurée, au point qu’il n’était possible qu’à une infime minorité de comprendre ce dont il s’agissait. Tel est encore le cas; et l’on peut affirmer, sans exagération aucune, que personne n’a encore vu sur la scène un drame de Wagner."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 117
    "printed_page": "111"
  "translation_ja": "まとめると、ワーグナーの改革は劇の構想そのものにかかわり、彼の音楽はその結果として生まれた。そのすべてが作品にきわめて大きな意義を与えたため、厳粛で特別な上演の場に切り離して置かねばならなかった。この最後の帰結を、ワーグナーは演劇全体に当てはめた。この点で彼は先駆者である。しかし、彼が採用した劇の形式に、上演の形式、すなわち演出を一致させることはできなかった。そのため、意図と、舞台上で目に見える形にしたものとの隔たりがあまりに大きく、作品全体が損なわれ、姿をゆがめられ、何が試みられたのかを理解できたのは、ごくわずかな人だけだった。今も事情は変わらない。少しも大げさでなく、舞台上でワーグナーの劇を見た者はまだ一人もいないと言える。"
  "translation_status": "reviewed"
- "id": "appia-0228"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le sujet, tout simple qu’il paraisse, est d’une complication presque inextricable. De plus, la situation de Wagner est immortellement tragique. Il sera difficile pour celui qui l’éprouve et veut sauver ce qui reste à sauver de cette œuvre admirable, d’agir tout à fait de sang-froid: la figure du géant de Bayreuth se dresse toujours devant lui. Pourtant, il ne peut lui témoigner son respect infini qu’en restant, lui-même, parfaitement libre; et, cette liberté ne s’acquiert que par une connaissance approfondie et minutieuse, ligne par ligne, mesure par mesure, des œuvres du maître."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 117
    "pdf_page_end": 118
    "printed_page": "111"
    "printed_page_end": "112"
  "translation_ja": "一見単純そうな問題だが、ほとんど解きほぐせないほど複雑である。そのうえ、ワーグナーの置かれた立場には、いつまでも消えない悲劇性がある。それを身にしみて感じ、この見事な作品からなお救えるものを救おうとする人が、完全に冷静でいるのは難しい。バイロイトの巨人の姿がいつも眼前に立ちはだかるからだ。それでも、巨匠に限りない敬意を示すには、自分自身が完全に自由でなければならない。その自由を得るには、巨匠の作品を一行ずつ、一小節ずつ、深く念入りに知るほかない。"
  "translation_status": "reviewed"
- "id": "appia-0229"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Telle a été l’attitude de l’auteur, en cherchant et en trouvant dans ces partitions mêmes les décors que représentent quelques-uns de ces dessins. Il s’est efforcé d’atténuer, jusqu’à l’impossible, la contradiction wagnérienne ; de prendre l’acteur vivant comme point de départ, et de le placer, non plus devant, mais au milieu de terrains et de lignes qui lui fussent étroitement destinés et correspondissent aux espaces et durées dictés par la musique de son rôle. La musique étant chez Wagner la source de l’inspiration dramatique, l’auteur a cherché dans la musique de ces drames l’évocation visuelle qui pût s’y accorder sans effort. Sans doute que tout cela est encore un compromis; mais il l’est, au moins, en connaissance de cause, et peut, par là, prétendre se rapprocher le plus qu’il soit possible de l’harmonie intégrale, celle que Wagner n’a pas soupçonnée, bien que son œuvre la réclamât."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 118
    "printed_page": "112"
  "translation_ja": "素描のいくつかが示す舞台装置を、楽譜そのものに探し、そこに見いだしたときの著者の態度が、まさにこれだった。著者は、不可能の限界までワーグナーの矛盾を和らげようとし、生きた俳優を出発点にした。もう俳優を装置の前に置くのではなく、その人のために設けられ、役の音楽が定める空間と持続に対応した地形や線のただなかに置こうとした。ワーグナーにとって音楽が劇の着想の源である以上、著者はそれらの劇の音楽に、無理なく調和する視覚的な形を探した。これもまだ妥協には違いないが、少なくともそれと承知のうえでの妥協である。だからこそ、作品が求めていながらワーグナー自身には思いもよらなかった完全な調和に、できるだけ近づいたと言うことはできる。"
  "translation_status": "reviewed"
- "id": "appia-0230"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici, pour la compréhension de ceux de ces dessins qui s’appliquent aux drames de Wagner. Ils demandent, naturellement, du lecteur, une connaissance au moins approximative des pièces en question. Ceux qui suivent, ainsi qu’il est facile de s’en rendre compte, sont le développement du même principe, mais sans l’appui d’une œuvre positive. Ils sont donc de simples suggestions dans le but d’établir un style sous les ordres du corps humain, lui-même stylisé par la musique. Dépouillés, peu à peu, du romantisme inhérent à l’œuvre de Wagner — et que l’on est tenu d’y conserver — ils arrivent à une sorte de classicisme, d’où est sévèrement éliminé tout ce qui n’est pas issu de la présence vivante et mobile de l’acteur. Ce sont des Espaces destinés à cette présence souveraine. Aux œuvres, ensuite, de fixer leurs dimensions et leur développement respectif."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 118
    "printed_page": "112"
  "translation_ja": "ワーグナーの劇にあてた素描を理解するための説明は以上である。当然ながら読者は、該当する作品について少なくとも大まかな知識を持っていなければならない。続く素描は、一目でわかるように、同じ原理を発展させたものだが、具体的な作品を土台とはしていない。音楽によって様式を与えられた人間の身体に従って、舞台にも一つの様式を築くための提案にすぎない。ワーグナーの作品に固有で、そこでは維持すべきロマン主義的な趣は、少しずつ取り除かれる。こうして、動く生きた俳優の存在から出たものでなければ厳しく排除する、一種の古典主義に行き着く。これらは、そうした、何にもまして重要な俳優の存在のために設けられた空間である。その寸法と個々の展開の仕方は、後から作品が定める。"
  "translation_status": "reviewed"
- "id": "appia-0231"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’on voit, par ces considérations générales, le chemin qu’a suivi, presque malgré lui, l’auteur de cet ouvrage. Parti du sentiment douloureux que lui faisait éprouver la contradiction wagnérienne et le malentendu irréparable qu’elle établissait, il en est arrivé à fonder, sur cette contradiction même, un principe scénique non plus arbitraire ou traditionnel, mais organiquement construit sur une juste hiérarchie des éléments représentatifs, soit: en partant de la forme vivante et plastique de l’acteur. Dans son livre « La musique et la mise en scène », (paru, en allemand, en 1899, à Munich, chez Hugo Bruckmann), il a développé, dans le plus grand détail, ce principe et ses résultats dramatiques et techniques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 118
    "pdf_page_end": 119
    "printed_page": "112"
    "printed_page_end": "113"
  "translation_ja": "これらの大まかな考察から、本書の著者が、ほとんど自分でも意図しないうちにたどった道が見えてくる。きっかけはワーグナーの矛盾と、それが生んだ取り返しのつかない誤解に対する苦しみだった。そこから著者は、ほかならぬその矛盾の上に、恣意的でも伝統任せでもない舞台の原理を築いた。この原理は、上演の諸要素を正しい序列に置き、有機的に組み上げられている。すなわち、生きて立体的な俳優の姿を出発点とする。著書『音楽と演出』（1899年にミュンヘンのフーゴー・ブルックマンからドイツ語で刊行）では、この原理と、それが劇の構想と技術にもたらす帰結を、きわめて詳しく論じた。"
  "translation_status": "reviewed"
- "id": "appia-0232"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A cette époque, l’œuvre de Wagner était la seule qui pût servir de point de départ. Cet ouvrage est donc encore sous le signe de Wagner, tout en dépassant beaucoup la portée, forcément circonscrite, de cette oeuvre. Depuis, l’auteur a fait quelques expériences scéniques concluantes, à Paris, Dresde, Genève, et, en particulier, à l’institut Jaques-Dalcroze. Il s’est exprimé, aussi, dans nombre d’articles et d’opuscules, et il a publié des dessins dans les revues de plusieurs pays; l’on en a fait des projections pour des conférences, etc... Jaques-Dalcroze, par la création géniale de sa Rythmique, lui a donné la confirmation définitive de ce qu’il avait entrevu; car, déjà en 1895, longtemps avant les débuts de la Rythmique, l’auteur écrivait, dans Musique et mise en scène, qu’il fallait absolument trouver une « gymnastique musicale » pour entraîner l’acteur dans les durées et dimensions de la musique. Le présent ouvrage donne l’histoire technique de cette évolution, et va jusqu’au bout des conclusions qu’elle impose. Ces dessins ne vont pas aussi loin ! Mais, le lecteur bienveillant y trouvera, peut-être, la suggestion suffisante pour le suivre dans le merveilleux avenir de l’art vivant qu’il lui a entr’ouvert, et, s’il se place lui-même au milieu de ces espaces, il pourra évoquer le spectacle sans spectateurs, dont il fera alors partie, et qui doit rester, pour nous tous, un idéal à poursuivre sans relâche et sous n’importe quelle forme."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 119
    "printed_page": "113"
  "translation_ja": "当時、出発点に選べるのはワーグナーの作品だけであった。したがってこの本も、どうしても限りのあるその作品の射程を大きく越えながらも、なおワーグナーの影響下にある。以来、著者はいくつかの舞台実験で手応えを得た。場所はパリ、ドレスデン、ジュネーヴ、とりわけジャック＝ダルクローズの研究所である。多くの論文や小冊子でも考えを述べ、各国の雑誌に素描を発表してきた。講演で投影されたこともある。ジャック＝ダルクローズは、天才的なリトミックの創案によって、著者がほのかに見ていたものを決定的に裏づけてくれた。リトミックが始まるはるか前の1895年にはすでに、音楽の持続と広がりに沿って俳優を訓練するために「音楽体操」をどうしても見つける必要があると、著者は『音楽と演出』に記していたからである。本書はこの発展の技術的な経緯を述べ、そこから生じる帰結を最後までたどっている。素描はそこまでは行かない。それでも好意的な読者なら、著者が少し開いて見せた生きた芸術の見事な未来へとついていけるだけの手がかりを、素描のなかに見いだすかもしれない。そして自分の身をその空間のただなかに置けば、観客のいない上演を思い描けるだろう。そのとき読者自身がその上演の一部となる。それはどのような形であれ、私たちすべてがたゆまず追い求めるべき理想でありつづける。"
  "translation_status": "reviewed"

- "id": "appia-0165"
  "section_id": "collaboration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’artiste qui a ressenti en lui-même — en son propre corps — l’étincelle du mouvement esthétique, éprouvera le désir de la prolonger, de l’établir en des œuvres positives, et non plus seulement en des démonstrations fragmentaires; et le problème du choix se posera à lui dans toute sa nudité et toute son importance. Il sent parfaitement qu’il déchoirait en cherchant à transposer dans l’Art vivant les objets des arts inanimés; il constate, ainsi, que ce n’est pas là la source de l’inspiration qu’il souhaite. Il en fait même l’expérience concluante chaque fois que, dans une période de plasticité vivante, mobile, il cherche à réaliser, à animer, un sujet qui peut servir de propos à quelque autre art. La pierre de touche est là. Son objet est donc lui-même; il le savait; maintenant il l’expérimente corporellement. De quelle œuvre est-il capable, à lui seul, sans le secours d’un propos littéraire, plastique, sculptural ou pictural?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 84
    "printed_page": "78"
  "translation_ja": "自分のうちに、つまり自分自身の身体に、美を表す動きの火花を感じた芸術家は、その火花を長く保ち、部分的な実演にとどめず、実際の作品に定着させたいと思うだろう。すると何を選ぶべきかが、そのままの姿で、重要な問題として眼前に立つ。動かない芸術の対象を生きた芸術に移そうとすれば、かえって身を落とすことになると、芸術家にはよくわかっている。求める着想の源がそこにはない、と知るのだ。生きて動く形を探っている時期に、ほかの芸術でも扱える題材を、実際に生きたものにしようとするたび、それを決定的に経験する。試金石はここにある。対象は芸術家自身なのだ。知ってはいたが、今は身体で経験する。文学や造形、彫刻や絵画の題材を借りず、自分一人でどんな作品を作れるのだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0166"
  "section_id": "collaboration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour simplifier notre démonstration, nous avons toujours parlé du corps tout court; nous l’avons même isolé complètement dans l’espace indéfini. Il va de soi que c’est l’Idée du corps vivant que nous avons prise ainsi comme élément essentiel; il est évident qu’en abordant la pratique de l’art vivant, l’on se trouve en face des corps — le sien compris — et que, si le corps est le créateur de cet art, l’artiste qui est possédé de l’Idée possède implicitement tous les corps. Il en résulte que c’est avec la vie qu’il crée, qu’il joue — avec la vie d’êtres vivants et dont la collaboration volontaire lui est indispensable s’il n’en veut pas faire des marionnettes articulées. L’Idée de Collaboration est donc implicitement contenue dans celle de l’art vivant. L’art vivant implique une Collaboration. L’art vivant est social; il est d’une façon absolue l’art social. Non pas les beaux-arts mis à la portée de tous, mais tous s’élevant jusqu’à l’art. Cela revient à dire que l’art vivant sera le résultat d’une discipline — discipline rendue collective, si ce n’est pas toujours effectivement sur tous les corps, du moins déterminante sur toutes les âmes par l’éveil du sentiment corporel. Et, de même que l’Idée seule du corps — du corps idéal, si l’on me permet ce terme — a pu nous convaincre de sa réalité esthétique possible et souhaitable, de même l’Idée du sentiment corporel esthétique saura orienter et guider ceux auxquels l’expérience effective du mouvement plastique n’est pas accordée. Pour ceux-ci, le contact et l’influence des êtres privilégiés par la vie du corps seront précieux. En pédagogie, le strict échange entre le maître et l’élève est la condition d’une discipline productive; que ferait l’un sans l’autre ? Il en sera de même pour l’Art vivant : les forces employées à l’étude corporelle se transfuseront, automatiquement, dans l’organisme réfléchi des autres, pour des productions et des fins que l’effort corporel, à lui seul, rendrait plus difficile. Par cet échange, l’énergie dépensée d’un côté demeurera toujours une puissance vivante au niveau constant, et nous assurera, jour après jour, l’existence de l’art vivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

  "source_text": "Le travail est non seulement la source du contentement et, partant, du bonheur; il est aussi le seul moyen de mener à chef n’importe quel profond désir. Par conséquent, dans tous les domaines, la technique du travail est d’une importance capitale. Le chef-d’œuvre d’un maître d’état, dans les anciennes confréries, était, avant tout, la preuve d’une maîtrise technique. Ces anciens artisans sentaient combien par là seulement ils arrivaient à la beauté. La recherche de la beauté allait de soi, pour eux; et probablement qu’ils n’en parlaient jamais. Seule, la maîtrise technique restait un objet de discussion et d’efforts."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 92
    "printed_page": "86"
  "translation_ja": "仕事は満足の、したがって幸福の源であるだけではない。どんな切実な願いも成し遂げることのできる、ただ一つの手段である。したがって、どの分野でも仕事の技術がきわめて重要である。昔の職人組合で、親方と認められるために作る傑作は、まず技術を身につけている証拠だった。昔の職人たちは、この道によってだけ美に至れることをよく知っていた。美を求めることは当然で、おそらく口にしなかっただろう。技術を身につけることだけが、話し合いと努力の対象だった。"
  "translation_status": "reviewed"
- "id": "appia-0174"
  "section_id": "collaboration"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’auteur a la conviction que la voie technique peut seule nous conduire à la beauté collective dont l’œuvre d’art vivant est le modèle. C’est sous l’empire presque tyrannique de cette conviction qu’il a rédigé son ouvrage et lui a donné sa forme. Vouloir la fin sans acquérir les moyens serait là, peut-être, plus illusoire et dangereux qu’ailleurs, puisque l’art abrite un démon qui se change facilement, à notre appel inconsidéré, en ange de lumière; un démon que la scrupuleuse droiture technique est seule capable de maintenir en servitude. Bien des tentatives d’art intégral et plus ou moins collectif ont échoué, et échouent encore, à cause d’une technique incomplète; on y prend pour l’œuvre entière ce qui n’en est qu’un fragment; et c’est à ce fragment que l’on applique alors des procédés forcément impuissants. Nous avons créé abusivement une sorte de classement et considérons, par exemple, toute préoccupation technique concernant les objets comme différente de celles concernant les individus; cela si bien que nous nommons volontiers les unes la pratique, les autres la théorie, en oubliant que les théories humaines peuvent également devenir techniques et se transformer en outil de travail. En sociologie, psychologie, etc., les efforts modernes ont tous cette orientation, et l’on y discute de la valeur de l’outil. En art, l’anarchie règne encore, et vouloir placer l’être humain dans la hiérarchie des moyens à employer — dans la collection des outils de la technique d’une œuvre — paraît une utopie et un enfantillage. Toujours, l’artiste considère l’humanité — ses frères — comme une masse distincte de lui, et à laquelle il présente son œuvre achevée. La conversion esthétique, qui consiste, nous l’avons vu, à se prendre soi-même comme l’œuvre et l’outil, puis à étendre ce sentiment, et la conviction qui en résulte, jusqu’à ses frères, cette conversion est restée encore ignorée de l’artiste; et les mieux intentionnés s’imaginent faire acte de solidarité sociale, et témoigner de leur désir d’art collectif, en plaçant sous le nez du pauvre spectateur une œuvre qui ne lui a jamais été destinée, et que, du reste, il ne peut pas goûter ainsi."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

  "translation_ja": "この本の目的の一つは、劇作家が、値することもできる、あのうらやましい芸術家の地位を勝ち取ろうと努めるのを助けることだ。そのために、劇作家自身のものになる技術上の手段を与え、芸術家として作品を作れるようにすることである。"
  "translation_status": "reviewed"
- "id": "appia-0128"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’esclavage, comme toutes les habitudes, peut devenir une seconde nature; il l’est devenu pour l’auteur dramatique et pour son public. Il s’agit donc d’une conversion, au sens propre du mot. La fonction crée l’organe. Qu’en physiologie ou zoologie cette affirmation ne soit qu’approximative, peu importe ici, car il est évident qu’en art elle est solennellement exacte. Puisque, de nos jours, la fonction du dramaturge n’a pas créé son organe, — c’est-à-dire que ce n’est pas organiquement que l’œuvre d’art dramatique se présente à nos yeux, mais par un automatisme artificiel, extérieur, et qui n’appartient pas à son organisme, — ce sera probablement dans la fonction même que nous devrons chercher et trouver le point faible qui a placé le dramaturge en dépendance, et qui contribue à l’y maintenir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 63
    "printed_page": "57"
  "translation_ja": "あらゆる習慣と同じで、隷属は第二の本性となりうる。劇作家にもその観客にも、すでにそうなっている。だから文字どおり、ものの見方を一変させる必要がある。機能が器官を作る。この言葉が生理学や動物学ではおおよそしか正しくないとしても、ここではどうでもよい。芸術ではまさしく正しいことが明らかだからだ。今日、劇作家の機能はその器官を作っていない。つまり演劇の作品が私たちの目の前に現れるのは、作品自体の有機的な働きによってではなく、その有機体に属さない、人為的で外部の自動作用によってである。ならば、劇作家を他に依存させ、いまもそこにつなぎとめている弱点は、おそらくその機能自体に探し、見つけなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0129"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’analyse que nous venons de faire des différents arts, au seul point de vue de l’art dramatique et indépendamment de nos procédés de mise en scène actuels, nous aidera peut-être à découvrir ce point. Notre principe de décoration n’aurait-il pas été suggéré primitivement par le dramaturge lui-même ? Et ne prolongerait-il pas, actuellement, cette impulsion initiale par inertie et hors de propos? L’emploi désordonné de la peinture des décors est si bien la caractéristique de toute notre mise en scène que toiles peintes et mise en scène sont presque synonymes pour nous. Or tous les artistes savent que le but de ces toiles n’est pas de nous présenter une combinaison expressive de couleurs et de formes, mais d’indiquer (nous l’avons vu plus haut), une foule de détails et d’objets. Il est donc à présumer que c’est le besoin de nous montrer ces objets qui a déterminé le dramaturge à s’adresser de la sorte au peintre. Et le peintre lui a répondu avec empressement. Si l’on se met à la place de l’auteur lorsqu’il choisit son sujet et cherche à le fixer, il devient évident que c’est là la minute précise qui décide de sa liberté technique ou de sa dépendance. Supposons qu’il croie pouvoir s’affranchir des moyens imposés, il se heurtera, tout de suite, à la conception, non plus même d’un sujet, mais à l’idée même de ce qu’est un sujet pour une œuvre destinée à être représentée. Pour lui, c’est l’exposé de caractères en conflit les uns avec les autres; de ce conflit résultent des circonstances particulières qui obligent les personnages à réagir; et c’est de leur façon de réagir que naît l’intérêt dramatique. Tout est là pour lui; il n’a jamais songé à autre chose; à ses yeux l’art dramatique consiste, en entier, dans la façon de réagir, et lui paraît susceptible de varier indéfiniment. Pourtant il s’aperçoit que tel n’est pas le cas; que les réactions ne varient pas à l’infini, mais, au contraire, se répètent toujours les mêmes; qu’en ce sens la nature humaine est limitée, et que nos passions ont chacune un nom. Le dramaturge cherche alors à varier l’intérêt par la diversité des caractères; et là commencent les difficultés, difficultés de dimensions. Pour présenter un caractère il faut du temps sur la scène, de l’espace sur le papier. Le choix est ainsi limité. Le roman, ou l’étude psychologique, disposent, en papier, d’un espace indéfini; la pièce ne possède que trois ou quatre heures.* Il faut, alors, chercher ailleurs, et l’influence du milieu entre en jeu. Le milieu est toujours historique et géographique, dépendant d’un climat et d’une culture qui s’indiquent aux yeux par un ensemble d’objets définis. Sans la vue de ces objets, le texte de la pièce devrait se charger d’une foule de notions qui paralyseraient complètement l’action. Force est donc de le représenter par le décor."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

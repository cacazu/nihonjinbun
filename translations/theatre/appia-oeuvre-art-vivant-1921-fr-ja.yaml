"figures":
- "id": "appia-plate-p123"
  "asset_id": "appia-asset-p123"
  "caption_ja": null
  "alt_ja": "太い樹幹が並ぶ森の奥に、明るい山並みが見える。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0238"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0285"
- "id": "appia-plate-p127"
  "asset_id": "appia-asset-p127"
  "caption_ja": null
  "alt_ja": "暗い石壁の奥から階段が上り、右上に明るい空がのぞく。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0242"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0286"
- "id": "appia-plate-p131"
  "asset_id": "appia-asset-p131"
  "caption_ja": null
  "alt_ja": "手前右の木立の向こうに草原が広がり、斜面が遠くまで続く。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0246"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0287"
- "id": "appia-plate-p135"
  "asset_id": "appia-asset-p135"
  "caption_ja": null
  "alt_ja": "石造りの壁とアーチのそばで、曲がり道に光が落ちている。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0257"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0288"
- "id": "appia-plate-p137"
  "asset_id": "appia-asset-p137"
  "caption_ja": null
  "alt_ja": "同じ石造りの壁と道を暗がりが包み、奥に小さな明かりがともる。"
  "placement":
    "anchor_type": "figure"
    "anchor_id": "appia-plate-p135"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0289"
- "id": "appia-plate-p141"
  "asset_id": "appia-asset-p141"
  "caption_ja": null
  "alt_ja": "段差のついた岩地の向こうに、光の中で巨大な城の影が立ち上がる。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0260"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0290"
- "id": "appia-plate-p145"
  "asset_id": "appia-asset-p145"
  "caption_ja": null
  "alt_ja": "左から突き出た岩棚の下を斜面が走り、右端に木立が見える。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0263"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0291"
- "id": "appia-plate-p147"
  "asset_id": "appia-asset-p147"
  "caption_ja": null
  "alt_ja": "岩山の二つの場面。上は岩棚に人影が立つ。下は数人の人影が岩山に集まる。"
  "placement":
    "anchor_type": "figure"
    "anchor_id": "appia-plate-p145"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0292"
  - "appia-0293"
  "description_ja": "原刊1頁に収まる上下2図。図中文字は上段、下段の順。"
- "id": "appia-plate-p149"
  "asset_id": "appia-asset-p149"
  "caption_ja": null
  "alt_ja": "岩棚と木立が暗く沈み、岩山の背後に明るい空が広がる。"
  "placement":
    "anchor_type": "figure"
    "anchor_id": "appia-plate-p147"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0294"
- "id": "appia-plate-p153"
  "asset_id": "appia-asset-p153"
  "caption_ja": null
  "alt_ja": "庇のある工房の入口へ短い階段が続き、右側には木の根が伸びる。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0268"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0295"
- "id": "appia-plate-p155"
  "asset_id": "appia-asset-p155"
  "caption_ja": null
  "alt_ja": "破壊された工房の残骸が重なり、その間に崩れた段差が見える。"
  "placement":
    "anchor_type": "figure"
    "anchor_id": "appia-plate-p153"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0296"
- "id": "appia-plate-p159"
  "asset_id": "appia-asset-p159"
  "caption_ja": null
  "alt_ja": "舞台の手前に幅広い段があり、奥の直方体の台に右側から階段が上る。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0272"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0297"
- "id": "appia-plate-p163"
  "asset_id": "appia-asset-p163"
  "caption_ja": null
  "alt_ja": "淡い広がりの中で、重なる幾筋もの水平の陰影が波のように伸びる。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0276"
    "position": "after"
  "required": true
  "caption_segment_ids":
  - "appia-0298"
- "id": "appia-plate-p167"
  "asset_id": "appia-asset-p167"
  "caption_ja": null
  "alt_ja": "段の奥に太い柱が並び、その影が床の手前へまっすぐ伸びる。"
  "placement":
    "anchor_type": "segment"
    "anchor_id": "appia-0278"
    "position": "after"
  "required": true
- "id": "appia-plate-p169"
  "asset_id": "appia-asset-p169"
  "caption_ja": null
  "alt_ja": "左の高い柱状の面に淡い光が当たり、その奥へ低い段が続く。"
  "placement":
    "anchor_type": "figure"
    "anchor_id": "appia-plate-p167"
    "position": "after"
  "required": true
- "id": "appia-plate-p171"
  "asset_id": "appia-asset-p171"
  "caption_ja": null
  "alt_ja": "左に開口部のある壁、右に広い段。開口部から伸びるように明るい帯が床を横切る。"
  "placement":
    "anchor_type": "figure"

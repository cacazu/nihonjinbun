  "source_text": "Cet effort nous devient sensible de deux façons: soit par l’opposition des lignes quand nous regardons un corps en contact avec les formes rigides de l’espace; ou bien lorsque notre corps lui-même éprouve les résistances que ces formes lui opposent. La première n’est qu’un résultat; l’autre, une expérience personnelle, et, par là, décisive. — Prenons un exemple, et supposons un pilier vertical, carré, aux angles droits nettement accusés. Ce pilier repose, sans soubassement, sur des dalles horizontales. Il donne l’impression de stabilité et de résistance. Un corps s’en approche. Du contraste entre son mouvement et l’immobilité tranquille du pilier naît déjà une sensation de vie expressive, que le corps sans pilier et le pilier sans ce corps qui avance n’auraient pas atteinte. De plus, les lignes sinueuses et arrondies du corps diffèrent essentiellement des surfaces planes et des angles du pilier, et ce contraste est par lui-même expressif. Mais, le corps vient à toucher le pilier; l’opposition s’accentue davantage. Enfin le corps s’appuie contre le pilier dont l’immobilité lui offre un point d’appui solide: le pilier résiste; il agit ! L’opposition a créé la vie de la forme inanimée : l’espace est devenu vivant ! — Supposons maintenant que le pilier ne soit rigide qu’en apparence, et que sa matière, au moindre contact étranger, puisse épouser la forme du corps qui le touche. Le corps vivant s’incrusterait donc dans la matière molle du pilier, il y ensevelirait sa vie ; du même coup il tuerait le pilier. (Des divans profonds comme des tombeaux. Baudelaire.) Cela est trop évident pour devoir être autrement démontré. La même expérience pourrait être faite avec le sol; par exemple, un sol élastique, qui laisserait le pied s’enfoncer à chaque pas, mais qui se relèverait aussitôt après pour reprendre sa surface uniforme; ce sol bougerait donc; sa mobilité serait-elle vivante? Regardons la surface rétablie derrière les pas du corps vivant: elle attend, pour céder encore; n’opposant rien, elle est morte ; il n’y a même rien de plus mort. Et les pieds qui la foulent ne rencontrant pas de résistance, le jeu des muscles est amorti, au sens propre du mot. On pourrait même en arriver à ne pas ressentir la marche volontaire du corps, mais à croire à la mise en jeu d’un mécanisme qui soulève alternativement l’un et l’autre pied, et les force d’avancer. Le sol et le corps deviendraient ainsi mécaniques, ce qui est la négation suprême de la vie, et le commencement du ridicule (voir Bergson). — Et maintenant si ce sol négatif, qui cède ou attend de céder, se transforme en dalles rigides qui attendent, au contraire, le pied pour lui résister, pour le relancer à chaque pas de nouveau, et le préparer à une nouvelle résistance; ce sol entraîne, par sa rigidité, tout l’organisme dans la volonté de marche. C’est en s’opposant à la Vie que le sol peut la recevoir du corps, tel le pilier."
  "source_languages":

  "source_text": "Pourtant une action dramatique contient presque toujours des notions que le texte ne suffit pas à nous donner. Faudra-t-il en revenir à l’écriteau de la scène shakespearienne? Là ne serait pas le mal, après tout. Mais il se trouve certainement un autre moyen, plus discret, et moins disparate; car la chose écrite, et lue par le spectateur pendant la déclamation des acteurs, suggère une analogie fâcheuse, et les mots écrits sont décidément bien éloignés du corps en action. Ces notions, dont nous chargeons encore la peinture de décor, n’ont pas à exprimer quelque chose mais seulement à le signifier, puisqu’un écriteau suffisait autrefois pour orienter le spectateur. N’y aurait-il pas, disons-nous, dans l’économie scénique un élément d’indication, d’orientation, indépendant de la hiérarchie de l’art vivant, un élément qui se rapprocherait des signes du texte, qui serait, même, comme issu du texte, pour s’adresser, directement et de sa part, à l’espace, sans passer nécessairement par l’acteur? Cet élément serait, par conséquent, tout à fait distinct des éléments expressifs dépendant de l’acteur seul, et l’on pourrait le nommer le signe, par opposition à l’expression dont l’ordre est étroitement hiérarchique. Le signe représenterait sur la scène la portion du texte dont l’acteur n’est pas chargé, et serait, pour les yeux, ce que serait une description orale du lieu de l’action, et cela dans la mesure exacte où les éléments d’expression, — musique, corps, espace, lumière et couleur, — ne sauraient pas le donner et pourraient le tolérer ; il appartiendrait au texte, lequel signifie et n’exprime pas ; mais il s’adresserait à nos yeux. Par exemple, et par analogie, l’expression musicale lorsqu’elle n’est pas fécondée par le poète reste dans les généralités; l’art dramatique, qui précise, en serait embarrassé. Le texte parlé, à lui seul, manque de l’expression directe que lui confère la musique. Nous aurions, d’une part, l’expression sans le signe, sans l’orientation indispensable; d’autre part, le signe sans l’expression. Or, pour l’espace, il en est de même; l’expression souveraine que lui accorde la musique du corps doit être fécondée, dans l’art dramatique, par une signification, quelle qu’elle puisse être; nos yeux comme nos oreilles, ont besoin d’être orientés. Si donc les éléments de l’expression ne contiennent pas implicitement cette indication intelligible, et si le texte ne la contient pas en suffisance, c’est dans l’espace que nous devons la trouver. La peinture signifie les formes, la lumière, les couleurs, etc., en une fiction parente à celle du texte poétique sans musique; elle est donc qualifiée pour prendre le rôle du signe visible, de l’orientation quand elle est indispensable. Son rôle sera dépendant de toute la hiérarchie scénique à laquelle elle n’appartiendra pourtant pas. Les éléments de l’expression n’en feront usage qu’en cas d’urgence; et, de même que l’écriteau shakespearien ne mentionnait pas les détails d’un paysage ou d’une architecture, de même l’indication picturale ne donnera que l’indice le plus succinct, sans une ligne de plus qu’il n’est nécessaire à notre brève et prompte orientation : elle remplacera avantageusement l’écriteau, voilà tout. Dans bien des cas la lumière et la couleur vivante pourront se rapprocher du signe en précisant leur expression par la forme, le mouvement d’une ombre, la couleur ou la direction d’une clarté.*"

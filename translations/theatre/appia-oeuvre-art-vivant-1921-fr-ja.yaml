  "source_text": "Par exemple, dans une grande fête nationale et patriotique, les motifs historiques (plus ou moins, aussi, géographiques et sociaux) ont un rôle considérable à jouer; ils seront, là, plus que le titre; ils auront à se dérouler dans le temps et pour nos yeux. Si nous ne les présentons que sous leur forme intelligible, c’est-à-dire simplement dramatique, nous leur enlèverons leur valeur éternelle, ou, du moins, cette valeur ne sera pas représentée, mais restera enclose dans l’action historique; et c’est, alors, nous qui devrons silencieusement, dans notre for intérieur, la déduire de ce qui nous sera représenté, ou de ce que nous représenterons nous-mêmes si nous sommes exécutants. L’Expression de cette valeur éternelle des contingences accidentelles et historiques n’aura pas revêtu une forme artistique; elle ne sera pas révélée comme un bien commun, mais sera restée soumise au plus ou moins de sensibilité et de noblesse de chaque individu isolément: l’essence humaine de l’action historique — l’essence intime du phénomène, pour parler avec Schopenhauer — n’aura pas été exprimée ni représentée. C’est là que l’oscillation prendra sa haute portée sociale. L’émotion divine ne doit pas rester le privilège de quelques-uns, de ceux qui savent et peuvent la dégager de son enveloppe accidentelle; nous devons l’offrir en une forme clairement accessible à tous. Nous devons montrer aux yeux, faire entendre aux oreilles, le drame éternel caché sous les mœurs, les événements, les costumes historiques. Et l’art vivant, dans sa parfaite pureté, dans son idéalisation la plus haute, en est seul capable. La fête patriotique oscillera, donc, judicieusement, entre l’Indication dramatique historiquement précisée, et son contenu d’éternelle humanité hors d’une époque déterminée de l’histoire. A Genève, en juillet 1914, le premier acte de La Fête de Juin, grand spectacle patriotique commémorant l’entrée de Genève dans la Confédération suisse, composé et mis en scène par Jaques Dalcroze, a donné de ce phénomène esthétique un exemple grandiose et certainement sans précédent. Il réalisait la simultanéité des deux principes. Le spectateur avait sous les yeux, à la fois, les motifs historiques animés, dont la succession même formait une action dramatique majestueuse, et leur Expression purement humaine, dépouillée de tout appareil historique, comme un commentaire sacré et une réalisation transfigurée des événements. Cet acte fut une révélation définitive, et, certes, héroïquement conquise par l’auteur et ses collaborateurs !"

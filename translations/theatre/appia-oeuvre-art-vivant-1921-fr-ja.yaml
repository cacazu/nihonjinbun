    "pdf_page": 57
    "printed_page": "51"
  "translation_ja": "作者が俳優の形をなした生きた身体だけを出発点にしないかぎり、選ぶ場所がどこであっても同じことが起こる。舞台装置は、この身体から生まれ、そこを起点に組み上がらなければならない。劇作家ひとりの想像力からではない。空間を前にしてものを言えるのは、身体だけなのだから。"

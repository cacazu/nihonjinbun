    "printed_page": "25"
    "printed_page_end": "26"
  "translation_ja": "私たちは個別の芸術が固定されており、最終的な完成の形をもつと指摘した。次いで、時間の芸術と空間の芸術に分類した。両者を取り持つ唯一の項が運動だった。運動は、空間と時間を一つの表現に結びつけるからだ。よって生きて動く人間の身体は、舞台の上で両者を結ぶ要素を表し、そういうものとして第一位を占めなければならない。身体は立体であるため、彫刻と建築に近づき、絵画からは決定的に離れる。また、立体性が光そのものの生命を呼び込むのに対して、絵画は光を虚構として表すにすぎないことも見た。以上を確かめたところで、ここまでに得たことを、とりわけ美術、すなわち空間の芸術についてまとめておこう。その三つ、絵画・彫刻・建築は動かない。時間の外にある。絵画には立体性がないので、空間の外にあり、空間を介して受ける現実の光の外にもある。絵画はその大きな犠牲の見返りに、選び抜いた虚構によって空間を思い起こさせる力を持つ。技法のおかげで扱える対象はほぼ無限で、選んだ瞬間の前後を暗示しながら対象をとどめられる。持続という考え方に絵画が加わるのは、いわば象徴としてである。彫刻は立体的で、空間に生きている。それゆえ生きた光にあずかる。絵画と同じく、自分が選んで静止させる運動の前後を示すことができる。しかも虚構のしるしではなく、物質的な現実によって示す。建築とは、生きた身体がその場にいて動き回るための、はっきりと境界の定まった空間を作る芸術だ。高さと奥行きの双方、そして重量によって堅固さを確保する固体の積み重ねによって、それを表現する。現実を扱う芸術であって、虚構の使用は余分な贅沢だ。建築は定義上、空間を含み、使われるときには時間を含む。美術の中で最も恵まれているのは、だから建築なのだ。"
  "translation_status": "reviewed"
- "id": "appia-0066"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous venons d’analyser les trois éléments réunis dans l’une des mains de l’acteur: les trois arts immobiles, les arts de l’espace. Cherchons à nous éclairer de même pour les arts du temps, — le texte et la musique, — que l’acteur attire de son autre main et veut irrésistiblement leur associer."
  "source_languages":
  - "fr"
  "source_locations":

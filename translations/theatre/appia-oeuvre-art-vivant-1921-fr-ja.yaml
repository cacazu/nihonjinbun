    "printed_page": "54"
    "printed_page_end": "55"
  "translation_ja": "画家は題材を探すとき、自分が使う制作手段に何ができ、どんな制約があり、何をあきらめねばならないかを、頭に入れている。絵画にできることとできないことは、つねに画家の前にある。あまりによくなじんでいるので、画家としての生と、その仕事の条件を知っていることが、彼にとっては一つの確信になる。自分は画家であり、だからこれだけの利点があり、これだけの犠牲を受け入れねばならない。それは議論の余地のないことであり、画家はその枠のなかだけで探求を試みる。この点から見て、劇作家はどうだろう。本当に劇作家なら、書いた作品を上演することに、すべての仕事が向かっている。読者でなく観客に語りかけたいからだ。上演は劇場で行われるが、原稿を練るのはそこではない。劇作家はそこで、自分が思いどおりにできる仕事、すなわち戯曲の原稿と、一人で頭をしぼっても思いどおりにできない作業、すなわち戯曲の演出との間に、注意を分けざるをえない。描いてもいないカンヴァスがもう展覧会場に懸けられ、アトリエには新しい絵の具を並べたパレットだけがあるとしたら、画家もこの二つの間を行き来するだろう。展覧会場では絵の具の配置を思い浮かべ、アトリエでは自由に描けるカンヴァスの面を切実に欲しがる。ただし劇作家が舞台に求めるものは、画家がカンヴァスに求めるものほどはっきりしていない。劇作家のパレットには場面があふれ、どうにかそれだけでも用が足りてしまう。それで一人でこの遊びをするが、作品の半分にしか関わらない、危うい遊びである。すると展示のとき、つまり上演のときが来る。作者は一心に打ち込んだ仕事の記録を劇場へ運ぶ。彼のカンヴァスである舞台は、書斎の静けさのなかで夢見た性質や寸法を備えているのか。あいにく誰も気にしない。舞台は舞台だ。それを使うか、あきらめるか。いつも戯曲のほうが舞台に合わせる。舞台は決して譲らない。そもそも譲れるようにできていない。どんな寸法だろうと、変えられない条件として押しつけられたものを受け入れるだけの弾力がなければならないのは、紙に書かれたほうだということが、自明であるらしい。"
  "translation_status": "reviewed"

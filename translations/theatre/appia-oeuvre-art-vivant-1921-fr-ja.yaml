    "pdf_page": 68
    "printed_page": "62"
  "translation_ja": "今日では何にでも題がつく。それだけですっかり意味の明らかな壮大な壁画から、取るに足りないピアノの即興に至るまでだ。芸術家は、自分の作品にどれほど力があり、おもしろいのか、困ったことに自信がないらしい。中身の乏しい、もったいぶった和音は、「祝宴のテラス」か何か意味ありげな風景に置いてやらなければ、生きてもよいという見せかけの権利さえ得られない。それは確かだ。だが逆に、豊かで力のある作品の多くが、余計な題名によって、単なる挿絵にまで引き下げられる。たとえば音楽で調性や通し番号を記すだけで、どんな題にも出せない気品が生まれる。『英雄』交響曲は、題名のおかげで何かを得たわけではない。『第九』を別の名で呼べば、私たちは反発するだろう……。"
  "translation_status": "reviewed"
- "id": "appia-0138"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pourtant, — et ce pourtant est toujours gros d’orage, dans les discussions, — puisque ce sont les artistes eux-mêmes, la plupart du temps, qui intitulent leurs œuvres, ils ont probablement, en dehors des doutes qu’ils pourraient concevoir sur la perspicacité du public, d’autres motifs? Auraient-ils besoin d’un stimulant précis pour créer certaines œuvres? Il y a des penseurs profonds qui ne pensent que la plume à la main. Un titre tiendrait-il lieu de plume dans la main des artistes?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 68
    "printed_page": "62"
  "translation_ja": "もっとも、議論になれば、この「もっとも」にはいつも嵐がはらまれているのだが、作品に題をつけるのはたいてい芸術家自身なのだから、観客の理解力を疑う以外にも、何か理由があるのだろう。作品によっては、創作に向かうためのはっきりした刺激がいるのだろうか。深く考える人の中には、ペンを手にしてはじめて考える人がいる。題名は芸術家の手のペンにあたるのだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0139"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La question se poserait donc sous deux aspects différents: le souci du public et le besoin de stimulant. On sait avec quel soin et quelle ardeur les artistes exposent leurs œuvres ; quelle importance ils attachent, malgré tout, à la critique, et la douceur légitime qu’ils trouvent dans la notoriété. — Pourtant s’ils ne méprisent pas tous le public, ils sentent bien quel abîme les en sépare, — de nos jours du moins; et, là, incontestablement, leurs titres sont un trait d’union ; ils répondent à l’éternelle question : « Qu’est-ce que cela représente ? » — Cette question est la première que les yeux du visiteur expriment en se posant sur une œuvre d’art; ensuite, et c’est encore l’exception, le regard devient peu à peu contemplateur. Quand le visiteur sait ce que cela doit représenter, il y ajoute, par déférence, le nom de l’artiste, puis il se sent calme et satisfait et se met à juger si, à ses yeux, l’œuvre correspond bien à son titre. Un catalogue sans titre ne serait pas acheté. Un concert sans programme plongerait l’auditeur dans un grand désarroi. Pourquoi? Peut-il sérieusement avancer que, si c’est une symphonie, il se préparera à cette symphonie, etc.? Oh non ! Peu lui importe, après tout ; mais il tient à savoir « ce que c’est » ; cela flatte son inertie ; et si, par bonheur, le titre du morceau est suggestif, il entre dans un véritable bien-être. Qui n’a vu le regard de curiosité et de plaisir dont il parcourt le programme, puis les yeux vagues et désintéressés qu’il lève ensuite? Quand il s’ennuie trop, durant un morceau, il a recours de nouveau au programme et y trouve du réconfort ; il semble dire: « C’est pourtant vrai, il n’y a pas rien que des sons, il y a le titre; » et pendant une minute il écoute de nouveau, avec moins d’inertie. On peut affirmer que sans l’idée de se déplacer, d’arriver, d’entrer, de se dévêtir un peu, de se regarder mutuellement, de humer l’air particulier à une salle remplie, de considérer les exécutants au repos, d’acheter le programme et de s’en pénétrer, etc... le public du musicien se réduirait à peu de chose. Quelle différence entre l’expression affairée et souvent rayonnante du public qui arrive et s’installe, et celle qu’il prend aussitôt que la musique commence ! C’est que, voilà: la musique lui demande quelque chose, et il l’oublie toujours jusqu’au dernier moment, lorsque c’est trop tard; il a tout apporté sauf cela..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 68
    "pdf_page_end": 69
    "printed_page": "62"
    "printed_page_end": "63"
  "translation_ja": "問題には二つの面があることになる。観客への配慮と、創作の刺激の必要である。芸術家がどれほど心を配り、熱心に作品を展示するか、それでも批評をどれほど重く見て、名が知られることにもっともな喜びを覚えるかは、ご存じのとおりだ。もっとも、誰もが観客を見下しているわけではないにせよ、少なくとも今日、自分たちと観客との間にどんな深い溝があるかを、芸術家はよく感じている。そこで題が両者をつなぐのはまちがいない。題は「これは何を表しているのか」という、お決まりの問いに答えてくれる。その問いをまず口にするのは、作品にとまった来場者の目である。その後しだいに見入る目になることはあるが、これもやはり例外だ。来場者は何を表すはずの作品か知ると、敬意を払ってそこに作者の名を添え、落ち着いて満足し、自分の目から見て作品が題にふさわしいかを品定めし始める。作品名のない目録は売れないだろう。曲目表のない演奏会なら、聴き手は大いにうろたえるだろう。なぜか。交響曲なら、その曲を聴くために心の準備をする、などと本気で言えるだろうか。とんでもない。結局は何でもよいのだが、「何なのか」だけは知りたがる。何もしようとしない気持ちに、それが心地よい。うまい具合に曲名が何かを思わせるものであれば、すっかりいい気分になる。好奇心と楽しみを目に浮かべて曲目表を読み、それからぼんやりした、興味のない目を上げるところを、誰もが見たことがあるだろう。一曲の途中で退屈がすぎれば、また曲目表を頼り、それで気を取り直す。「そうだった、ただ音があるだけじゃない。題もある」とでも言いたげに、しばらくは少し熱心に聴き直す。出かけて会場に着き、中へ入り、上着を少し脱ぐこと。互いを眺め、人でいっぱいの会場独特の空気を吸い、演奏の始まる前の奏者を観察し、曲目表を買って読みふけること。そうしたことができると思わなければ、音楽家の聴衆はほんのわずかになると言ってよい。やってきて席に着くときには忙しげで、しばしば輝くばかりの顔をしていた人たちも、いざ音楽が始まるとどうだろう。というのも、音楽は聴き手に何かを求めているのに、聴き手はもう手遅れの最後の瞬間まで、きまってそれを忘れるからだ。それ以外ならすべて持ってきたのに……。"
  "translation_status": "reviewed"
- "id": "appia-0140"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Avec le programme il va pouvoir juger. Or, rien dans son être n’est jamais prêt à réagir fortement, à participer avec joie et courage à la création de l’artiste; il faut donc l’orienter d’avance pour qu’il puisse rapidement chercher dans ses souvenirs ou ses sensations quelque chose d’analogue au titre. Si, alors, il ne trouve rien, le titre augmente encore son trouble et l’œuvre est doublement énigmatique pour lui. Par exemple: « Regard dans l’infini ; » bien que les visiteurs, dans leur majorité, aient constamment les mots éternel et infini sur les lèvres, ils n’y ont même pas songé. Le symbole qui tente d’en donner comme l’essence humaine reste lettre close pour eux; ils ont beau s’éloigner un peu d’un air entendu, cligner des paupières, cette comédie ne les rapproche pas d’une oeuvre dont le titre même leur échappe. Du reste, ce titre vient ou d’une erreur de jugement, ou d’un besoin de stimulant chez l’artiste; peut-être des deux à la fois."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 69
    "pdf_page_end": 70
    "printed_page": "63"
    "printed_page_end": "64"
  "translation_ja": "曲目表があれば判断できる。だが聴き手の中には、強く反応したり、喜びと勇気をもって芸術家の創造に加わったりする用意が、まるでない。そこであらかじめ見当をつけさせ、題に似たものを、記憶や感覚のなかからすばやく探せるようにする必要がある。そこで何も見つからなければ、題はいっそう戸惑いを増し、作品は二重に謎めいてくる。たとえば「無限へのまなざし」だ。来場者の大半は、しょっちゅう永遠だ無限だと言っているが、そんなことは考えたこともない。その人間にとっての本質を示そうとする象徴があっても、彼らには閉ざされたままだ。わかった顔で少し離れたり、目をぱちぱちさせたりしても、その芝居で作品に近づけるわけではない。題さえつかめていないのだから。そもそもこの題は、芸術家の判断の誤りか、刺激を必要としたせいか、おそらくその両方から来ている。"
  "translation_status": "reviewed"
- "id": "appia-0141"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il ne faudrait pas confondre le titre et le sujet. Par exemple, nous savons, par l’histoire, que la vie des puissants de ce monde était le sujet imposé aux artisans-sculpteurs et peintres égyptiens; ou bien que les sujets religieux ont été longtemps la justification publique de l’œuvre d’art. Cela s’est même prolongé comme un tic. Claude Lorrain donne des titres bibliques à ses paysages ! Là, titre et sujet se confondent pour exprimer la culture, la disposition particulière d’une époque; le titre ne sert pas d’orientation problématique. Une belle femme avec un enfant nu sur les genoux ne pouvait être qu’une Madone; et si Raphaël l’avait appelée « Paysanne de la Campanie » on aurait crié au scandale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 70
    "printed_page": "64"
  "translation_ja": "題名と題材を混同してはいけない。歴史を見れば、たとえば古代エジプトの彫刻や絵の職人には、時の権力者の暮らしが題材として課されていたことがわかる。また宗教的な題材は長いあいだ、芸術作品が公に存在できる理由だった。それは癖のように続いたことさえある。クロード・ロランは風景画に聖書から取った題をつけるのだ。そこでは題名と題材が一つになって、ある時代の文化や特有の気分を表している。題は、迷う人に見当をつけさせるためのものではない。膝に裸の子を載せた美しい女は、聖母であるほかなかった。ラファエロがその絵に「カンパーニアの農婦」と題したなら、たいへんな騒ぎになっただろう。"
  "translation_status": "reviewed"
- "id": "appia-0142"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Notre culture moderne nous a ouvert tous les champs; l’embarras du choix touche à l’anarchie, tout comme la liberté de l’artiste. L’art n’a plus de public; le public plus d’art; l’art ne se soucie plus de nous, et pour cause. Force est alors de nous expliquer une production qui nous est aussi étrangère qu’un bijou exotique dont la forme n’indiquerait pas l’usage. De son côté l’artiste, ne trouvant pas en nous son œuvre, — en nous qui devrions être son sujet et son titre, — la cherche ailleurs. Or, ailleurs, le sujet et le titre ne se confondent plus, hélas...! et sa liberté anarchique pousse l’artiste, tout naturellement, à limiter prudemment et dès l’origine sa conception; il la détermine par un titre, et s’attache à ce point fixe et intelligible dans la mer angoissante des possibilités. Le public prend la chose pour du bon argent, sans trop se douter que presque toujours le titre n’est là que la plume pour le penseur; il a permis l’œuvre ; c’est tout ; sa valeur n’est pas intelligible, mais plutôt morale; l’artiste en avait besoin, et, son œuvre achevée, il le conserve abusivement, comme une construction qui, achevée, conserverait encore ses échafaudages."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 70
    "pdf_page_end": 71
    "printed_page": "64"
    "printed_page_end": "65"
  "translation_ja": "近代の文化はあらゆる分野を私たちに開いた。あまりに選択肢が多くて迷うことは、芸術家の自由と同じく、無秩序に近い。芸術にはもう観客がいない。観客にはもう芸術がない。芸術はもう私たちを気にかけない。それも無理はない。異国の宝飾品の形からは何に使うかわからないように、作品も私たちには縁遠く、人に説明してもらうしかない。他方、芸術家のほうも、本当なら題材にも題名にもなるべき私たちのなかに作品を見つけられず、ほかを探す。あいにくそこでは、題材と題名はもう重ならない。無秩序な自由を与えられた芸術家は、ごく自然に、初めから慎重に構想を絞ろうとする。題を付けて構想を定め、どうなるかわからない可能性の海のなかに、意味のはっきりした動かぬ一点を見つけ、すがるのである。観客はそれを額面どおりに受け取る。題はたいてい、考える人にとってのペンでしかないということには、ほとんど気づかない。題のおかげで作品ができた。それだけである。題の値打ちは、意味を頭で理解できるというより、心の働きに関わっている。芸術家にはそれが必要だったが、作品ができてもなお残しておくのは筋違いだ。建物が完成しても、足場をかけたままにしておくようなものである。"
  "translation_status": "reviewed"
- "id": "appia-0143"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Vouloir représenter un sujet, c’est toujours s’éloigner de l’œuvre d’art, qui est, en son essence, l’expression pure et simple, sans sujet donné. Intituler son œuvre, c’est convenir de sa qualité d’illustration. Prendre un sujet sans l’intituler, même dans son intime pensée, c’est tendre vers l’œuvre d’art. Réaliser une expression qui résulte d’un désir irrésistible et sans objet précis, c’est faire œuvre d’art. S’il se trouve ensuite que l’on puisse donner à cette œuvre telle ou telle dénomination approximative, cela n’a plus rien de commun avec l’illustration; c’est au contraire la preuve de la réalité du désir et de sa mystérieuse et profonde humanité. Si notre art avait un public, bien des titres d’œuvres seraient l’objet de notre vénération et nous procureraient une émotion féconde en nous introduisant dans le sanctuaire le plus secret de l’artiste, parfois le plus ignoré de lui-même."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 71
    "printed_page": "65"
  "translation_ja": "題材を表そうとすれば、必ず芸術作品から遠ざかる。芸術作品は本来、題材をあらかじめ与えられていない、純粋で単純な表現だからだ。作品に題をつけるのは、作品は挿絵にすぎないと認めることだ。一つの題材を取っても、心の奥でさえ題をつけなければ、芸術作品に近づく。何を求めるのかはっきりしないが、抗いがたい欲求から生まれた表現を実現することこそ、芸術作品を作ることである。その後、作品におおよその名を付けられるとわかっても、もはや挿絵とは何の関係もない。かえってそれは、欲求が実際にあったことと、それが人間の不思議な深みに根ざしていることの証しだ。もし私たちの芸術に観客がいたなら、作品の題の多くが敬意の対象となり、私たちに実りある感動をもたらしただろう。芸術家の最も奥深い、時には本人さえ知らない聖域へと入れてくれるからである。"
  "translation_status": "reviewed"
- "id": "appia-0144"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ceci nous ramène aux notions de Signe et d’Expression, du choix qu’en fait l’auteur dramatique, et de l’attitude résultant de ce choix. Comme les autres artistes, il se trouve entre le désir d’exprimer quelque chose et le besoin d’Expression; entre un sujet à exprimer et une Expression à représenter. En inclinant vers le signe, il se charge de notions intelligibles dont les conséquences sont sérieuses pour la mise en scène, — ainsi que nous l’avons vu, — et infirment, nécessairement, l’expression qu’il désire. En inclinant vers l’Expression, il peut se livrer à la hiérarchie normale et organique des éléments de la représentation, et « représenter » son Expression, aussi purement qu’il le désire. Les notions intelligibles seront alors, — telles qu’un titre pour l’œuvre d’art sans objet, — la simple consécration de son désir, mais non pas son prétexte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 71
    "pdf_page_end": 72
    "printed_page": "65"
    "printed_page_end": "66"
  "translation_ja": "こうして「しるし」と「表現」の考え、劇作家がそのどちらを選ぶか、その選択からどんな構えが生まれるかに話が戻る。劇作家もほかの芸術家と同じく、何かを表したいという欲求と、表現せずにいられないという欲求のあいだにいる。表したい題材と、形にしてみせたい表現とのあいだである。しるしのほうに傾けば、意味を頭でつかむための情報を背負う。それが演出に重大な結果を及ぼし、求める表現を弱めることは、すでに見てきたとおりである。表現のほうに傾けば、上演を形づくる要素の本来の、有機的な序列に任せ、望むかぎり純粋に、自分の表現を「上演する」ことができる。意味をつかむための情報は、そのとき、特定の対象を持たない芸術作品についた題名のように、作者の欲求が形を得たことを知らせるだけであって、作者が作る口実ではない。"
  "translation_status": "reviewed"
- "id": "appia-0145"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La fusion des éléments représentatifs ne peut pas être déterminée en elle-même, à elle seule. Si nous connaissons bien ces éléments, si nous savons mesurer leur puissance d’expression et leurs limites respectives, et les placer en conséquence, nous possédons les moyens dont la mise en œuvre dépend, alors, exclusivement de l’auteur. Et c’est pourquoi l’idée de sujet prend maintenant une portée technique; la fusion des éléments ne sera plus, comme sur nos scènes, réglée à l’avance et imposée au dramaturge, mais toute la responsabilité lui en incombera. Il a donc l’obligation d’être artiste; et, bien que les éléments qu’il emploie soient désormais à sa libre disposition, il ne les tient pourtant pas dans sa seule main; pour réaliser son rêve d’artiste il a besoin, sans doute, de collaborateurs. Sera-ce une nouvelle dépendance? A peine promu au rang d’artiste, de par la possession personnelle de sa technique, va-t-il retomber en tutelle et perdre le bénéfice de ses divers sacrifices? Quelle sera la portée de cette collaboration? Sera-t-elle une simple entr’aide, ou bien pénétrera-t-elle plus profond et jusqu’au choix de son sujet? Laissons de côté les services matériels que l’électricien, le menuisier et d’autres artisans seront disposés à lui offrir; ils vont de soi et, hiérarchiquement, concernent le corps de l’acteur qui les ordonne. Considérons, seulement, les éléments situés en deçà de ce corps, ceux qui lui dictent sa vie et son mouvement; puis, nous irons ensuite à ce corps, intermédiaire merveilleux, dominé par le dramaturge et dominant de son côté l’espace en lui confiant sa vie propre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 72
    "pdf_page_end": 73
    "printed_page": "66"
    "printed_page_end": "67"
  "translation_ja": "上演を形づくる諸要素をどう融合させるかは、融合自体を取り出して決められるものではない。要素をよく知り、それぞれの表現の力と限界を測り、それに応じて位置づけられるなら、その実現がひとえに作者にかかっている手段を、手に入れたことになる。題材という考えがいま技術上の意味を帯びるのは、そのためである。いまの舞台のように、要素の融合のしかたがあらかじめ決まり、劇作家に押しつけられるのではない。その責任はすべて劇作家が負う。だから劇作家は芸術家であるほかない。使う要素を自在に扱えるようになっても、それらを片手にすべて握っているわけではない。芸術家としての夢を実現するには、協力する人たちが必要だろう。それは新たな依存関係なのか。自分の技術を自分のものにして、ようやく芸術家の地位に上ったというのに、また人の後見を受け、払ったさまざまな犠牲の見返りも失うのか。この協働はどこまで及ぶのだろう。単に助け合うだけか、それとももっと深く、題材の選択にまで関わるのか。電気係、大工、その他の職人が進んで提供する実際の作業は、脇に置こう。そうした作業は当然あるもので、序列のうえでは、それを取り仕切る俳優の身体に関わる。今は、この身体より手前にあり、身体の生と動きを定める要素だけを取り上げよう。そのあとで、すばらしい仲立ちである身体へ向かう。劇作家に導かれ、自分の生命を空間に託すことで、今度はみずから空間を導く身体へ、である。"
  "translation_status": "reviewed"
- "id": "appia-0146"

    "printed_page": "28"
  "translation_ja": "語られるのであって、読まれるのではない。読むことはすべて文学それ自体に属する。舞台の上で自分の役を読んだり、読みながら歌ったりする俳優は、何の理由もなく歩き回る読み手か歌い手でしかない。"
  "translation_status": "reviewed"
- "id": "appia-0073"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Concluons en affirmant que la parole s’écoule bien dans le temps, mais qu’elle est incapable de créer dans le temps normal un temps nouveau qui lui appartienne en propre. Ce n’est donc qu’en apparence qu’elle touche à l’art par la durée; en réalité, elle n’y touche que par la signification des mots et l’ordonnance nécessaire à leur juste compréhension; abstraction faite ici de la beauté qui en peut résulter. C’est par l’ordonnance intelligible de la parole que le texte devient œuvre d’art ; son rôle auprès de la mobilité du corps n’a pas autorité de loi; il est indirect: transmis à la sensibilité de l’acteur par des mots, le texte abandonne à l’acteur le soin de décider en dernier ressort ce qu’il convient de faire pour l’extérioriser dans l’espace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 35
    "printed_page": "29"
  "translation_ja": "話し言葉はたしかに時間の中を流れるが、ふつうの時間の中に自分だけの新しい時間を生み出すことはできない、と結論しよう。だから、持続によって芸術に近づくのは見かけにすぎない。ほんとうに芸術に結びつくのは、言葉の意味と、それが正しく理解されるために必要な配列を通じてである。（そこから生まれうる美しさは、ここでは措く。）台本を芸術作品にするのは、話し言葉がわかるように組み立てられていることだ。だが身体の運動に対しては、それは法則としての力を持たず、働きは間接的である。言葉を通じて俳優の感性に届いた台本は、どうすればその内容を空間の中に表せるか、最後に決める仕事を俳優に任せる。"
  "translation_status": "reviewed"
- "id": "appia-0074"

  "origin": "source"
  "source_text": "Pourquoi donc le temps n’a-t-il pas une norme qui soit commune à celle de notre vie de veille et à celle de nos arts dans la durée? C’est précisément à cause de son idéalité. Le temps, c’est nous. Les arts qui s’adressent à nos yeux sont également nous, dans ce sens, mais ils le sont dans l’espace; et l’espace n’a pas d’idéalité; notre vue est trop bornée pour cela. Or, s’il est évident que notre ouïe a aussi ses limites pour la durée d’une œuvre d’art mesurée par le temps normal, elle est néanmoins susceptible d’adopter, occasionnellement, un temps fictif, disproportionné, en plus ou en moins, à ce temps normal. Notre sens auditif, quand il est frappé par les ondes sonores, nous les transmet directement, sans aucune opération intermédiaire. Là où les autres arts signifient, c’est-à-dire font usage de signes visuels pour parvenir à notre sensibilité, la musique, elle, elle est; les signes dont elle se sert, s’identifient avec son action directe. Elle est la voix même de notre âme: son idéalité dans le temps est donc parfaitement fondée et légitime. — Quelles pourront être ses relations avec l’espace, car c’est bien de cela qu’il s’agit pour la mise en scène? La mobilité exprime l’espace en une succession, donc en durée, nous l’avons vu. Les arts du temps trouvent ainsi dans la mobilité l’intermédiaire indispensable à leur présence invisible sur la scène. Et, puisqu’il y a réciprocité, les arts de l’espace se trouveront à même, grâce aux arts du temps, de se manifester en une durée qui leur serait restée étrangère sans eux. Ils participeront ainsi, implicitement, à l’idéalité du temps !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 33
    "pdf_page_end": 34
    "printed_page": "27"
    "printed_page_end": "28"
  "translation_ja": "ではなぜ、目を覚ましているときの生活にも、持続の中で展開する芸術にも共通する物差しを、時間は持たないのだろう。それはまさしく、時間が観念的なものだからだ。時間とは私たち自身なのだ。この意味では、目に訴える諸芸術も私たち自身である。ただし空間の中でそうなのだ。空間には観念性がない。視覚にはあまりに限界があるからだ。もちろん、ふつうの時間で測った作品の持続については、聴覚にも限界がある。とはいえ聴覚は、ときには、ふつうの時間と比べて長くも短くも大きくずれた、虚構の時間を受け入れることができる。音波が聴覚に届くと、聴覚はそれを間に何の過程も挟まず、じかに私たちへ伝える。他の芸術が「意味する」、つまり私たちの感覚に届くために目に見えるしるしを使うのに対し、音楽はそれ自体が「ある」。音楽の使うしるしが、その直接の働きそのものだからだ。音楽こそ私たちの魂の声である。したがって音楽が時間の中に持つ観念性には、まったく正当な根拠がある。では音楽と空間の関係はどうなるだろう。演出にとっての問題は、まさしくそれではないか。すでに見たように、運動は空間を、次々に起こるものとして、つまり持続として表す。時間の諸芸術が見えないまま舞台上に存在するのに不可欠な仲立ちを、こうして運動のうちに見いだす。作用は相互的だから、空間の芸術も時間の芸術のおかげで、それがなければ知ることのなかった持続の中に自らを表せるようになる。こうして空間の芸術も、暗黙のうちに時間の観念性にあずかるのだ。"
  "translation_status": "reviewed"
- "id": "appia-0071"
  "section_id": "elements"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Avant d’examiner comment la mobilité peut prendre sa place dans une œuvre d’art, — et la question est de première importance, — il nous reste encore à considérer, après l’art des sons et du rythme, l’art de la parole, du texte récité.* Le timbre de la parole, sans musique, peut suggérer, dans certains cas, quelque analogie avec le son musical, mais, dans l’art, il n’a rien de commun avec lui, et, par-dessus tout, il s’en différencie définitivement du fait qu’il n’est qu’un intermédiaire entre la signification des mots et leur intelligence dans notre entendement; alors que les sons frappent directement notre sensibilité même, et que l’opération de notre raisonnement, si tant est qu’elle devienne nécessaire, ne s’effectue qu’en second lieu. Des mots dont nous ignorons le sens sont des bruits, plus ou moins agréables, et non pas des sons. Lorsque nous commençons à comprendre une langue étrangère, ces bruits prennent une signification: leur vibration agit progressivement sur notre entendement, et cela si bien, que nous arrivons à les percevoir tout différemment. Ils sont les porteurs indirects de la pensée ; et les sons porteurs directs de nos sentiments. Au moyen de la parole, l’idéalité du temps ne s’exprime que d’une façon rudimentaire, très limitée, et complètement dépendante de nos facultés cérébrales d’assimilation. Une phrase prononcée trop rapidement n’est pas acceptée par notre entendement ; de même que, si elle dure trop longtemps, son rôle d’intermédiaire s’en trouve infirmé. La différence esthétique entre la parole et le son musical serait totale si ces deux facteurs n’avaient pas le temps en commun. Et, même en ce qui concerne le temps, comment pourrions-nous mesurer avec précision et sécurité les durées diverses de la parole? Possédons-nous pour cela un signe graphique transposable dans le temps de la récitation? L’auteur aurait beau marquer en marge ses intentions à cet égard, — intentions qui, par les signes écrits, ne s’adressent déjà qu’à notre entendement, — suffiront-elles à nous assurer la précision indispensable à l’œuvre d’art? Jamais. Et c’est là que tout vestige d’idéalité dans la durée de la parole nous apparaît illusoire."

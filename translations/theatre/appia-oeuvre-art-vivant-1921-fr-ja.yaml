  "source_text": "Que le peintre est heureux ! Il peut porter sa toile dans son atelier pour l’unir à sa palette; il préside à leurs noces dans l’intimité. L’auteur dramatique, lui, porte son manuscrit au théâtre, et ce n’est pas précisément dans le mystère et le recueillement, ni surtout dans le silence, que l’union se consomme ! Les deux parties se connaissent par ouï-dire, et font réciproquement de bien singulières découvertes. On leur assure qu’il doit en être ainsi, et qu’il en a été et en sera toujours ainsi. Ils se résignent donc. La mariée, — la scène, — s’attife sans souci du goût de son conjoint, — le drame, — lequel, malmené, froissé, mutilé même, finit par disparaître à demi dans la toilette criarde de l’épousée. On fait alors entrer les invités, et la fête bat son plein devant l’auteur de tant de mal, qui oublie sa honte dans les applaudissements et le tapage. Quand ce malheureux revient dans sa chambre de travail, tout à l’heure si peuplée..., il n’y contemple plus que du papier barbouillé. S’il retourne sur la scène, il n’y essuie que la poussière empoisonnée de toiles plus barbouillées encore. Et s’il s’attarde entre les deux, il sent son œuvre lui échapper à tout jamais et glisser sur le trottoir. Telle est l’œuvre de l’auteur dramatique. Mais revenons aux artistes, lesquels, ainsi que le peintre, identifient leur existence avec les exigences favorables ou restrictives de leur «métier»; jamais ils n’auraient l’idée de séparer leurs aspirations artistiques les plus élevées des moyens d’exécution caractéristiques à leur art. Pour un peintre, le pinceau, les couleurs et la surface plane qui l’attendent sont, en quelque sorte, sa façon de penser, d’imaginer son œuvre; il les connaît et ne cherche pas ailleurs. De même pour les autres artistes. Il en est un, pourtant, qui fait exception: l’artiste qui n’a pas de nom, pour un art qui n’en a pas non plus... — L’auteur dramatique ne considérera jamais la scène, telle que nous la lui offrons, comme un matériel technique définitif; il consent à s’en accommoder; il va jusqu’à mouler sa pensée d’artiste sur ce triste modèle, et n’en souffre pas trop puisque ainsi, seulement, il obtient un peu d’harmonie. Sa situation est donc celle d’un peintre auquel on n’autoriserait qu’un nombre insuffisant de couleurs et une toile de dimensions ridicules et toujours les mêmes. Elle est bien pire encore, car un peintre de génie trouvera toujours le moyen de s’exprimer, tant que le principe essentiel de sa technique n’est pas faussé, c’est-à-dire tant qu’il s’agit toujours de pinceaux, de couleurs et de surface plane. Mais notre scène moderne offre au dramaturge un contre-sens technique; elle n’est pas un milieu qui puisse être consacré à une œuvre dramatique; c’est par une violence inconcevable que l’on nous oblige de l’accepter, et même de la considérer comme telle. Malheureusement l’habitude en est prise; c’est avec ce matériel que nous évoquons cette œuvre et, ce qui est bien plus grave, c’est avec ce matériel que le dramaturge la conçoit, sous peine de ne pas faire «du théâtre». Le terme est consacré: ce n’est pas notre scène que l’on accusera jamais de ne pas être « du théâtre », mais bien toujours le dramaturge seul; voilà pourquoi il est un artiste sans nom: il ne domine pas une technique; c’est la technique de la scène qui le domine. L’artiste doit être libre; le dramaturge est esclave. Actuellement il n’est pas et ne peut pas être un artiste."

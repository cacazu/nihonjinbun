  "source_text": "En renonçant à son rôle fictif dans la peinture, la couleur obtient la vie dans l’espace; mais elle devient, alors, dépendante de la lumière et des formes plastiques qui en déterminent l’importance variable. Sa réalité vivante la prive des objets qu’elle représentait fictivement sur la toile; ce ne sera donc pas à elle qu’il faudra s’adresser pour la représentation des objets sur la scène. (Exception faite, nous venons de le voir, pour les indices, les signes, indispensables à l’orientation du spectateur.)"
  "source_languages":
  - "fr"
  "source_locations":

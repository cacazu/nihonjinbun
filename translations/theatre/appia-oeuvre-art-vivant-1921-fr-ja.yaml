  "source_text": "En art une question revient toujours sur le tapis provoquant des discussions qui n’aboutissent guère, puisque nous restons au même endroit, après comme avant. Je veux parler du Sujet d’une œuvre d’art, et jusqu’à quel point une œuvre d’art comporte un sujet, — un sujet qui appelle un titre ? —"

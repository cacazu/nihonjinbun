  "translation_ja": "それでも劇の進行には、台本だけでは伝えきれないことが、ほとんどいつも含まれる。シェイクスピアの舞台で使った立札に戻ればよいのか。結局のところ、それでも差し支えはない。しかし、もっと目立たず、調和を乱さない手段がきっとある。俳優が朗々と語っているそばで、観客が文字を読むのは、好ましくない類似を感じさせる。書き言葉は、動いている身体からどうしても遠いのだ。いまなお描き割りに伝えさせているこうした情報に必要なのは、何かを「表現する」ことではなく、単にその意味を知らせることだ。昔は立札だけで観客に見当をつけさせられたのだから。それなら、舞台全体の仕組みの中に、観客に情報を示し、見当をつけさせる一要素がないだろうか。生きた芸術の序列からは独立していながら、台本のことばに近く、いわば台本から生まれて、必ずしも俳優を通らずに、台本に代わってじかに空間に語りかける要素だ。それは俳優だけに依存する表現の諸要素とはまるで別のものになる。きびしい序列に従う「表現」と区別して、「しるし」と呼べるだろう。しるしは、台本のうち俳優が受け持たないところを舞台上で伝える。劇の出来事が起こる場所を口で説明するのと同じことを、目に向かって行う。ただし音楽、身体、空間、光、色彩という表現の諸要素からは伝えられず、しかもそれらを妨げない、ちょうどその範囲にとどまる。しるしは、意味を知らせても表現をしない台本に属しながら、私たちの目に語りかける。たとえば、似た例を挙げると、音楽の表現は、詩人がそこに意味を実らせないかぎり、一般的なものにとどまる。具体的でなくてはならない演劇は、それでは困る。語られる台本も、それだけでは音楽が与える直接の表現を持たない。一方には不可欠な手がかりであるしるしを欠いた表現があり、他方には表現を欠いたしるしがあるわけだ。空間でも事情は同じである。身体の音楽が空間に与える力強い表現も、演劇においては、どういうものであれ、何らかの意味を得て実を結ばねばならない。耳と同じく、目にも見当をつける手がかりがいる。それで、表現の諸要素にそのわかる手がかりが暗に含まれず、台本にも十分に見当たらなければ、空間の中で見つけなければならない。絵画は、音楽のない詩の言葉に親しい虚構のうちに、形や光や色などを示す。ゆえに、見えるしるし、不可欠な手がかりの役割なら務まる。その役割は舞台の序列全体に従うものの、その序列に属するわけではない。表現の諸要素が絵画を使うのは、どうしても必要なときだけだ。シェイクスピアの立札に風景や建物の細部が書かれていなかったように、絵による手がかりも、ごく短く簡潔なものだけを与える。私たちがすぐに見当をつけるために必要な線を、一本でも越えてはならない。立札をよりよい形で置き換えるだけだ。多くの場合、光と生きた色彩は、形、影の動き、明かりの色や向きによって表現をはっきりさせ、しるしの働きに近づくこともできる。*"
  "translation_status": "reviewed"

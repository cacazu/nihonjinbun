  "source_text": "J’ai dit que la musique se trouve à une place exceptionnelle entre les arts immobiles et l’art vivant, transposant en vie, animée dans le Temps, ce que ceux-ci ne nous offrent que dans l’Espace. Le poète partage cette place, mais à un autre titre; son rôle est moins spécialement technique. Il inspire la forme, dans ce qu’elle doit avoir d’intelligible; il est le titre, l’échafaudage pour la construction de l’édifice vivant. La construction achevée, il semble disparaître; mais c’est lui qui a soutenu le poids des matériaux dans leur ascension, et qui a donné les proportions; il les a même indiquées dans l’espace avant leur existence positive; sans lui l’édifice ne serait pas; il l’a contenu en puissance. Maintenant c’est l’édifice qui contient le poète, en esprit: dans la forme de l’œuvre d’art vivant, le poète réalise la toute présence. Pas un son musical, pas un geste corporel qui ne le possède. Pour cette existence merveilleuse, il doit consentir à n’être, lui-même, d’abord que l’échafaudage; puis, à se donner complètement. Pourtant, et ainsi que dans toute construction bien ordonnée, la structure du bâtiment, et la nature et la pesanteur des matériaux, doivent s’exprimer clairement. C’est là que le poète conservera un peu de sa vie personnelle, et ces indices seront les mots du poème vivant. A ces indices le musicien doit céder; ce sont eux qui lui ont permis d’élever le sanctuaire ; ce sont eux encore qui en supportent et assurent l’équilibre. Ils témoignent de l’ossature de l’organisme dans lequel la musique souffle la vie ; ils ne sont pas l’Expression, ils en sont les soutiens. La collaboration ne peut pas être à la fois plus étroite et marquer plus de subordination réciproque. L’architecte de l’œuvre d’art vivant se divise, ainsi, en poète et en musicien, l’un conditionnant l’autre, mais jamais l’un sans l’autre; leur équilibre n’est pas dans l’égalité des participations; leurs proportions, au contraire, seront toujours variables et conditionnées par les lois de l’équilibre, c’est-à-dire du centre de gravité. Si le musicien veut chanter seul, l’édifice courra quelque danger ; si le poète veut seul parler, nous risquons bien alors de n’avoir que l’échafaudage, plus ou moins décoré... Le poète est en quelque sorte le contenant, ou les mains qui portent et soutiennent ; le musicien, le liquide bouillonnant, ou les matériaux précieux et travaillés. Leur union, opérée par le corps, crée l’œuvre d’art vivant; et cette union est si complète que l’un comme l’autre peut se saisir des motifs que les arts immobiles voudraient en vain réaliser, et libérer ainsi leur vision de ce qui lui faisait violence."

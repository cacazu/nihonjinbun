    "printed_page_end": "84"
  "translation_ja": "もっとも、詩人、音楽家と言うからといって、生きた芸術を身体で表す人々が含まれないわけではもちろんない。自分の身体で音楽を経験したことは、それを感じた人すべての心を開き、生きた芸術にしか表せず、また表すべき題材へと導く。同時に、鋭くなった身体の感覚によって、ほかの芸術が静止した形にする題材から、その人を遠ざける。生きた芸術は存在の全体に語りかける。協力する人たちが自分の生を多く持ち寄れるほど、それだけ高い使命を掲げられる。生きた芸術の「仕事」は、とても単純であると同時に、とても複雑だ。理論は単純で、自分を丸ごと与えるように求める。だが実践には多方面の勉強が要り、それをすべて修められる人ばかりではない。そこから、共同作業、すなわち協力の原理が生まれる。この原理はすでに、作品が純粋に人間的なものであることを、私たちに保証している。これまで見たように、表現とは別のしるしの領分にある特殊な事情は、全体よりも個人に関わるからだ。何らかの理由で、そうした事情が一時的に必要になれば、生きた作品は、ほかならぬこの作者を必要とする演劇的な応用に傾く。その場合、共同作業をする人々は例外として、一人の意志を忠実に実行するだけでよいと承知し、より自然に生まれる共同の表現からしばらく離れることになる。しるしと表現のあいだを揺れ動くことにも、作品の生命は現れる。その揺れが、作品が形式的な美の規則に固まるのを防ぐ。対照によって注意をつなぎ、感情を刺激し、ただ一つの形式に閉じ込めるよりも、個人を余すところなく表に出す。"
  "translation_status": "reviewed"

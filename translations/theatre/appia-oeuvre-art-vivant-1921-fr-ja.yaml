    "printed_page": "74"
    "printed_page_end": "75"
  "translation_ja": "この本が『演劇芸術』でなく『生きた芸術』と題される理由が、読者にもいまならわかるかもしれない。必ずしも私たちの言う意味での演劇ではなくても成り立つ、生きた芸術という考えをはっきりさせるには、私たちにあるのは劇場だけなのだから、劇場を通って考えるほかなかった。しかし劇場での演劇は、全体を包む生きた芸術の、いくつもある形の一つにすぎない。身体を知的な目的に、取るに足りない目的でないとしても、ともかくそのために使う。そして私たちがしるしと呼んだものに大きく傾き、しばしばそれと区別がつかなくなる。こうして、本来は表現そのものでなければならない生きた身体に無理を強い、従わせるのだ。だから私たちの芸術文化の中で演劇にはっきりした位置を与え、その名を定めたいなら、演劇という観念そのものを、こうした吟味にかけねばならない。これはまったく明らかなことだ。おそらくそのとき、これまでよりどころもなく揺れ続けた演劇という芸術は、存在を十分に正当化できる根拠、揺るぎない台座を得るだろう。それによって、これまで間の悪いことに身につけていたむなしい飾りを禁じられ、その価値と力は大いに増すはずだ。演劇は、おそらく生きた芸術の特殊な応用とみなされることになる。私たちの装飾芸術が造形芸術や絵画の応用であるのと似ている。演劇を通じて私たちは、芸術には結局二種類しかないと、いくたびも確かめるだろう。動かない芸術と動く芸術、文学を含む美術と生きた芸術である。例外的なのは音楽の位置で、二種類の芸術のまん中に置かれる。そのとき私たちは無秩序を脱するかもしれない。たとえば美術批評家は、聞き手に通じると安心して、絵の前でこう言うだけで足りる。「線に前後のつながりがないのに、作者がなぜこのように対象を動かない形にしたのか、わからない。」ある頁を読んで、こうも言える。「この描写では何も見えず、何もつかめない。言葉が動き出しそうで、本が重荷になる。」あるいは生きた芸術の発表について、「ここでは作者たちが、題材を持たない応用へ傾きすぎていることが目に余る。」あるいはさらに、「この動きはもはや純粋な表現ではないのに、演じる人たちはしるしとは別に保とうとしている。照明の譜面が粗すぎて、言葉が欲しくなってしまうのがよくない。」"
  "translation_status": "reviewed"
- "id": "appia-0161"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’ignorance de la hiérarchie qu’impose en art l’emploi du corps vivant, a entraîné toute notre culture artistique dans l’anarchie et le flottement. Nous désirons toujours plus ardemment la vie corporelle artistique; là, comme ailleurs, le mouvement nous est devenu un besoin impérieux; chacune de nos formes d’art veut l’exprimer à tout prix, (et dieu sait, souvent, à quel prix !) ; chacun empiète sur l’autre; et, le plus souvent, ce que l’on appelle complaisamment « les recherches » d’un artiste, désigne, après tout, les efforts qu’il fait pour sortir de son art. La vue du corps en mouvement, devenu œuvre d’art sous les ordres de la musique, peut seule, nous en avons la conviction, remettre les choses à leurs places respectives. L’auteur de cet ouvrage a entendu un dramaturge en renom s’écrier devant un simple exercice de plastique rythmée exécuté avec perfection et solennité : « Mais, alors, je n’ai plus à écrire de pièces ! » Rentré chez lui, il aura sans doute continué à en écrire, seulement, en sachant ce que seul il peut faire, et, surtout, ce à quoi il doit renoncer. Sans doute que d’autres artistes, devant le même spectacle, auront poussé la même exclamation. Le sculpteur, de retour dans son atelier, aura cherché, avec inquiétude, celles de ses œuvres, de ses ébauches, qui ne faisaient qu’immobiliser le mouvement merveilleux qu’il venait de suivre et de contempler, et qui, par conséquent, devenaient péniblement superflues en sculpture. Jusqu’à l’architecte, dont les visions d’espace et de proportions se seront subitement modifiées, ou précisées; il ne peut plus seulement voir des murailles et des paliers..., mais désormais le corps vivant le hantera, et c’est pour lui seul, pour ce corps incomparable, qu’il travaillera maintenant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 81
    "pdf_page_end": 82
    "printed_page": "75"
    "printed_page_end": "76"
  "translation_ja": "芸術に生きた身体を用いるときに従うべき序列を知らなかったため、私たちの芸術文化はすべて、無秩序と動揺に陥った。私たちは身体が生きることを芸術として、ますます強く求めている。ここでも、ほかの個所でも、動きは切実な必要になった。私たちの芸術はどの形式も、何としても動きを表そうとし、しばしばそのためにどれほど犠牲を払うことか。互いの領分に踏み込み、芸術家の「探求」と好意的に呼ばれるものは、たいてい結局のところ、その人が自分の芸術をはみ出そうとする努力を指す。音楽に導かれて芸術作品となった、動く身体を目にすることだけが、物事をそれぞれの場へ戻せる。私たちはそう確信する。著者は名の通った劇作家が、完璧に、厳かなほどに行われた、ごく普通の律動による身体表現の稽古を前に、「それなら、私はもう芝居を書かなくていいではないか！」と叫ぶのを聞いたことがある。家に帰れば、おそらくまた芝居を書いた。ただし、自分だけにできることは何か、とりわけ、自分が手放さなければならないことは何かを知って書いたはずだ。同じ光景を見れば、ほかの芸術家もきっと同じ声を上げただろう。彫刻家は仕事場に戻ると、たったいま見守り、じっと見つめたすばらしい動きを止めただけで、そのために彫刻としては、つらいほど無用になった作品や習作がないか、不安になって探しただろう。建築家でさえ、空間や比率について思い浮かべるものが突然変わり、あるいは明確になったはずだ。もう壁や踊り場だけを見ることはできない。これからは生きた身体が彼に取りつき、ほかの何ものにも代えられないその身体だけのために、建築家は仕事をするだろう。"
  "translation_status": "reviewed"
- "id": "appia-0162"
  "section_id": "fusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pourtant, si la vue du corps, œuvre d’art, a déjà pu exercer une semblable influence, que sera celle de l’expérience même du mouvement artistique faite en son propre corps ! L’architecte se prendra à désirer — et cette fois pour lui-même — telle ou telle ordonnance de l’espace, et à refuser telle autre qu’il trouvait auparavant belle et légitime. Et le sculpteur ? Enfermer dans la pierre le mouvement qu’il a expérimenté dans sa propre chair deviendra une fonction terrible, presque douloureuse, dont il ressentira profondément la responsabilité ; la synthèse exigée de lui par le principe d’immobilité en sera toujours plus rigoureuse; et, si la velléité de fixer l’une des secondes de son bonheur plastique et vivant le prenait, ce lui paraîtrait une ironie de son passé d’inconscience qu’il repousserait avec mépris. S’il ne le fait pas, il donnera par là la preuve de son incapacité. Le degré d’influence qu’exercera l’Art vivant sur l’artiste, sera la pierre de touche de sa qualité d’artiste."

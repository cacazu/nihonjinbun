  "translation_ja": "たとえば国を挙げての大きな愛国的な祭典では、歴史上の題材が、多少は地理や社会に関する題材も、大きな役割を果たす。それは題名以上のものであり、時間のなかで、私たちの目に向かって展開しなければならない。それを頭で理解できる形、つまりただ劇として成り立つ形で示すだけなら、そこにある永遠の価値を奪うことになる。少なくともその価値は表されず、歴史上の出来事の中に閉じ込められる。すると、見せられたものや、もし私たち自身が演じるなら自分で表したものから、その価値を心の中で黙って引き出さねばならない。歴史上たまたま起きた出来事の永遠の価値は、芸術の形で表現されず、皆の財産として明らかになることもない。それぞれの人の感受性や気高さの程度に任されてしまう。歴史上の出来事の人間としての本質、ショーペンハウアーの言う「現象の内なる本質」は、表現も上演もされない。このとき、揺れ動くことは社会的に大きな意味を持つ。神々しい感動を、偶然の装いからそれを取り出すことのできる少数の者だけの特権にしてはならない。誰もがはっきり受け取れる形でそれを差し出すべきだ。歴史上の風習、出来事、衣装の下に隠れた永遠の劇を、目に見せ、耳に聞かせなければならない。そのことができるのは、生きた芸術が、完全に純粋な、最も高く理想化された姿を取ったときだけだ。だから愛国的な祭典は、歴史をはっきり示す劇のしるしと、特定の歴史の時代を離れた、永遠に人間的な内容のあいだを、よい釣り合いで行き来するだろう。1914年7月、ジュネーヴで、同市のスイス連邦加入を記念する大規模な愛国の催し『六月祭』の第一幕が、この美の現象の壮大で、確かに前例のない例を示した。ジャック＝ダルクローズが作り、演出したこの催しは、二つの原理を同時に成り立たせた。観客の眼前には、次々に移るだけで荘厳な劇をなす、生きた歴史の題材があり、それと同時に、歴史の装いをことごとく脱いだ、純粋に人間的な表現があった。聖なる注解、姿を変えて実現された出来事と言ってもよい。この一幕は決定的な啓示であり、作者と協力者が確かに英雄的な努力で勝ち取ったものだった。"

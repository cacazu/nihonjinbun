  "translation_ja": "ある詩人を考えよう。ここで詩人とは、物事が浮き立つような光のもとで考え、感じ、見て、書くにせよ書かないにせよ、何より言葉でそれを表す才のある芸術家を指す。この詩人が、生きた芸術と、それを形にする作品の共同作業に加わるという考えにとらわれたとしよう。自分の選択が恣意的であってはならないことをよく感じている。そのうえ、芸術として身体を生きることを学ぶにつれ、詩人としての生のすべてが、余計な混じりものを落とし、いっそう純粋に、したがって単純な姿で彼の前に現れる。彼が喜んで取り上げ、言葉だけがとりわけよく表せる個々の事情を、人間にとって永遠の要素が上から見下ろし、凌ぐようになる。彼の喜びであり無邪気な誇りだった言葉は、彼自身にまだ説明できない新しい力を得る。言葉は今も確かに彼のもので、前よりよく使いこなし、新しい響きを与えられるとさえ感じる。それなのに、その響きは、さらなる響きを呼ぶかのように、彼の手を離れてゆく。詩人としての生、内なる富、自分の目の明晰さを以前にも増して手にしているいま、言葉が新しいことばで自分に語りかけるのを聞く。そこで言葉の意味は、思考の身ぶり一つ一つの重みに応じて広がり、驚くほど満ち足りた気持ちを与えてくれる。詩人だからこそ物事を解きほぐす彼は、その仕事に戻り、新しい言葉を前にして問いかける。だが言葉は答えない。不思議な生命に震え、まだ知らない形を呼び起こそうとしながら、新しい身ぶりか、あるいは大きな望みをこのうえなく成し遂げることを、彼にしきりに求めているらしい。両手を伸ばしてすべてを引き寄せようとすると、言葉は拒む。どうすればいいのか。いま彼はゆっくり、厳かに、その呼びかけを聞く。わかった。言葉は彼を呼んでいる。両手はもう、つかむために伸ばしてはならない。両手を差し出し、贈り、両手とともに、今度こそ自分の存在を丸ごと与えなければならない。転換は成し遂げられた。詩人の中に共同制作者が生まれたのだ。選択は済んだ。いや、もう選ぶ必要はない。望むなら、思考の身ぶりの一つ一つを、言葉の象徴に閉じ込めずに、生きた芸術に与えられるだろう。いまや自らの生を表すのは生命そのものだからだ。解き放たれた言葉は声を上げて、生きた芸術に従えることを祝い、生かしてくれるように頼む。詩人は言葉を与えた。この芸術からだけ、それを受け取り直したいのである。それなら詩人は、読まれるためにはもう書かず、文学者でなくなるのだろうか。むろんそんなことはない。しかし生きた芸術に出会うほかの芸術家と同じく、それまで考えたこともなかった仕方で、物事があるべき場所に収まるのを経験するだろう。本来は生きた全体としての表現に属している考えや感情を、いかに多く言葉だけに託していたかがわかる。反対に、言葉では語り尽くせない事柄に夢中だったばかりに、詩人として注意を向けるに値する物事が、どれだけ文学の表現から外されていたかにも気づくだろう。ほかの芸術はたえず彼を誘ったので、どうしても少しずつ自分の芸術に移し替え、満足と困惑を一緒に味わってきた。これからは、そうはできなくなる。画家や彫刻家がそれぞれの枠を出そうに見えるとき、生きた芸術が詩人の前に立ちはだかり、「私のところへ連れてきてくれ」と言うだろう。どの芸術でも、生きた芸術は詩人にとって物事を正すものとなり、行き過ぎを明るみに出し、反発を静める。生きた芸術があれば、無秩序はもうありえないからだ。そしてこの解放の働きで、詩人は音楽家と力を合わせ、中心的な役割を担う。"

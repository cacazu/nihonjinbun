    "pdf_page": 113
    "printed_page": "107"
  "translation_ja": "素描"
  "translation_status": "reviewed"
- "id": "appia-0218"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ces quelques dessins ne sont pas, à proprement parler, les illustrations des pages qui précèdent. La réforme de la mise en scène entraîne avec elle une conception nouvelle de l’art dramatique, et cet art touche de si près à notre existence personnelle et à notre vie sociale qu’il n’est pas possible d’en traiter sans bouleverser une quantité de notions et d’habitudes qui nous semblaient presque immuables, ou, du moins, trop invétérées pour être changées d’un coup. Le spectacle de la scène, sous quelque angle qu’on l’envisage, est la reproduction d’un fragment de notre existence. Par quoi je n’entends pas qu’il soit le miroir des mœurs, comme on l’a bien voulu dire. Notre vie intérieure, ses joies, ses peines et ses conflits, est parfaitement indépendante de nos mœurs ; même là où les mœurs semblent déterminantes. Les passions humaines sont éternelles — éternellement les mêmes; les mœurs ne font que les colorer superficiellement, comme la forme d’un vêtement nous indique une époque. Mais, l’âme qui se cache sous ce vêtement, n’a pas de date; c’est l’âme humaine, simplement. Du point de vue dramatique, un fragment de notre existence est un fragment de l’histoire de cette âme. Par conséquent, la forme que nous donnons à nos spectacles est, ou bien adéquate à cette définition, et il n’y a pas lieu de la changer; ou bien, au contraire, elle résulte d’une inertie particulière, d’un conservatisme, qui devient un anachronisme. La question a deux faces: l’une artistique, l’autre purement humaine et sociale, puisque le théâtre est une jouissance que nous prenons en commun. Que l’on me permette, ici, quelques indications qui, tout en commentant ces dessins, éclaireront aussi l’ouvrage qui les a précédés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 114
    "printed_page": "108"
  "translation_ja": "ここに掲げる数点の素描は、厳密には前のページの挿図ではない。演出の改革には、演劇についての新しい考え方が伴う。そして演劇は一人ひとりの生き方にも社会生活にもあまりに近く、ほとんど変わりえない、あるいは少なくとも一挙には変えられないほど根深いと思っていた数々の観念や習慣を覆さずには、論じることができない。舞台の光景は、どの角度から眺めようと、私たちの生の断片を再現するものである。だからといって、よく言われるように風俗を映す鏡だと考えるわけではない。私たちの内面生活、その喜び、苦しみ、葛藤は、風俗とはまったく無関係である。風俗が決定的に見えるところでもそうだ。人の情念は永遠であり、永遠に同じである。風俗は、服の形がある時代を示すように、情念の表面を色づけるにすぎない。だが、その服の下に隠れた魂に時代はない。ただ人間の魂である。演劇の観点から見るなら、私たちの生の断片とは、この魂の歴史の断片なのだ。したがって、私たちの上演形式がこの定義にかなっているなら、変える必要はない。反対に、ある種の惰性や保守性の産物なら、それは時代にそぐわなくなる。演劇は私たちがともに味わう楽しみだから、問題には二つの面、一つは芸術上の面、もう一つは純粋に人間と社会にかかわる面がある。ここで、素描の解説を兼ねて、それに先立つ本書の論旨をも照らすようなことを少し述べさせていただきたい。"
  "translation_status": "reviewed"
- "id": "appia-0219"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La question artistique concerne les moyens dont nous nous servons au théâtre et notre manière de les employer. Or, l’on voit déjà qu’en art dramatique la technique même, est dépendante de la conception que nous nous faisons de cet art. Théoriquement, cette conception peut être discutée, car il nous est loisible de rechercher si la force d’inertie n’a pas retenu le dramaturge dans une forme rigide et incapable de suivre les évolutions de notre pensée et de notre goût. Mais, pratiquement, il s’agit tout d’abord d’accorder notre technique aux pièces déjà existantes; ce qui est fort malaisé, puisqu’il y a dépendance réciproque. Pourtant il semble évident que la conception dramatique prendra l’avant-garde ; car l’on n’aura guère l’idée de créer de nouveaux moyens techniques pour des œuvres encore inexistantes. La proportion n’est pas constante, il est vrai. Le dramaturge peut dépasser, à l’occasion, l’état scénique qui lui est offert ; et, de son côté, cet état scénique peut le devancer, momentanément, en sorte que de nouveaux moyens entraîneront avec eux un nouveau développement de la forme dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 114
    "pdf_page_end": 115
    "printed_page": "108"
    "printed_page_end": "109"
  "translation_ja": "芸術上の問題は、劇場でどんな手段を使い、それをどう扱うかにかかわる。演劇では技術そのものが、私たちが演劇をどう考えるかに左右されることが、ここですでにわかる。理論上は、その考え方に疑問を差し挟める。惰性の力が劇作家を硬直した形式に縛りつけ、私たちの考え方や好みの変化に追いつけなくしたのではないかと問い直せるからだ。しかし実際にまず必要なのは、すでにある戯曲に技術を合わせることである。これは互いが互いに依存しているのだから、たいへん難しい。それでも、演劇についての考え方が先に立つのは明らかに思われる。まだ存在しない作品のために新しい技術的手段を作ろうとは、まず思わないからだ。もっとも、どちらがどこまで先を行くかは一定しない。劇作家が、そのとき使える舞台の条件を越えることもある。逆に舞台の条件が一時的に劇作家の先を行き、新しい手段が劇の形式を新たな発展へと導くこともある。"
  "translation_status": "reviewed"
- "id": "appia-0220"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il en résulte que, si une œuvre dramatique ne trouve pas, dans l’économie théâtrale qui lui est contemporaine, une forme qui puisse lui convenir, c’est que, d’une part, le dramaturge n’a pas tenu compte des moyens mis à sa disposition; de l’autre, que la mise en scène n’a pas suivi l’évolution du goût dont cette œuvre témoigne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 115
    "printed_page": "109"
  "translation_ja": "したがって、ある劇作品が同時代の劇場の仕組みのなかで自分にふさわしい形式を見いだせないとすれば、一方で劇作家が使える手段を考慮に入れなかったためであり、他方で演出が、その作品に現れた好みの変化についていかなかったためである。"
  "translation_status": "reviewed"
- "id": "appia-0221"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En l’an 1876, Richard Wagner inaugura son théâtre de Bayreuth. Il dut le faire, puisqu’il ne trouvait nulle part ailleurs l’atmosphère d’exception et les éléments correspondant à une œuvre qui rompait délibérément avec les conventions et les traditions de son époque."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 115
    "printed_page": "109"
  "translation_ja": "1876年、リヒャルト・ワーグナーはバイロイトに自分の劇場を開いた。あえて同時代の慣例と伝統を断ち切った作品にふさわしい、日常から離れた雰囲気も、その作品に必要な要素も、ほかのどこにも見つけられなかったからだ。"
  "translation_status": "reviewed"
- "id": "appia-0222"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En quoi consistait sa réforme ? Etait-elle positivement technique ? Assurément non. Wagner, averti par une longue et douloureuse expérience, avait compris que l’art dramatique est un art d’exception, et qu’il fallait lui rendre ce caractère, sous peine de le voir décliner et mourir. Sa vie était, toujours davantage, orientée vers ce coup d’état dramatique; sa production en prenait le caractère décisif; et, ce n’est qu’au prix d’innombrables compromis et de souffrances personnelles inouïes qu’il arrivait à représenter ses drames sur nos scènes de répertoire. A Bayreuth, il était enfin libre ! Il put donner à ses représentations un caractère exceptionnel et leur conférer, par là, une solennité nouvelle pour nous. Tout a été dit à ce sujet. L’agencement de la salle et de l’orchestre sont également bien connus."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 115
    "pdf_page_end": 116
    "printed_page": "109"
    "printed_page_end": "110"
  "translation_ja": "その改革は何だったのか。はっきり技術上の改革だったのか。断じてそうではない。長く苦しい経験に教えられたワーグナーは、演劇は日常から離れた芸術であり、その性格を取り戻さなければ衰えて死んでしまうと悟っていた。彼の生涯はますます演劇におけるこの大転換へと向かい、その創作にも思い切ったところが現れた。しかし、持ち演目を回している劇場で自分の劇を上演するには、無数の妥協と想像を絶する個人的苦痛を代償にしなければならなかった。バイロイトでようやく自由になった。彼は上演を日常から切り離し、それによって私たちには新しい、厳かな性格を与えることができた。このことはすでに語り尽くされている。客席とオーケストラの配置もよく知られている。"
  "translation_status": "reviewed"
- "id": "appia-0223"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La prodigieuse évolution musicale — que l’on s’obstine à mettre sur le compte de Wagner-musicien, alors que seul Wagner-dramaturge en doit porter l’écrasante responsabilité — fait, dès longtemps, partie de notre bagage technique moderne. Son influence, néfaste au point de vue musical, a été reconnue; mais le mal est fait. Evidemment, l’on ne dénature pas impunément et à ce degré — ainsi que nous l’avons fait — le but d’une obligation technique !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 116
    "printed_page": "110"
  "translation_ja": "驚くべき音楽の発展は、とうの昔から現代の技術的な蓄えの一部になっている。人はそれを音楽家ワーグナーの業績にしたがるが、その重い責任を負うのは劇作家ワーグナーただ一人だ。音楽の観点から見て有害だったその影響は認められているが、害はもう生じている。当然ながら、技術上の必要から生まれた手段の目的を、私たちがしたようにこれほどまでにねじ曲げれば、何の報いもなしにはすまない。"
  "translation_status": "reviewed"
- "id": "appia-0224"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sans sa musique, Wagner courrait le risque de ne pas attirer notre attention; avec elle, il nous a corrompus, parce que nous avons pris la lettre musicale pour l’esprit dramatique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 116
    "printed_page": "110"
  "translation_ja": "音楽がなければ、ワーグナーは私たちの注意を引けなかったかもしれない。音楽があったために、彼は私たちを惑わした。私たちが音楽という文字面を、劇の精神と取り違えたからである。"
  "translation_status": "reviewed"
- "id": "appia-0225"
  "section_id": "drawings"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Wagner n’a pas voulu composer sa musique ainsi qu’il l’a fait; mais il y a été contraint par la nouvelle conception dramatique qu’il lui importait par-dessus toute autre chose de nous révéler. En fin d’analyse, l’on se trouve, avec lui, devant un dramaturge. S’il n’a pas réussi, malgré Bayreuth, c’est que son œuvre porte en elle-même une profonde contradiction. L’auteur de cet ouvrage s’est trouvé particulièrement sensible au dilemme posé par Wagner et son œuvre; et la souffrance qu’il en éprouvait le mit sur la voie d’une libération, pour laquelle l’œuvre du grand maître ne serait qu’un point de départ, ou, si l’on préfère, un grandiose et salutaire avertissement."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 116
    "printed_page": "110"
  "translation_ja": "ワーグナーは、実際にそうしたように音楽を書きたいと思っていたわけではない。何よりもまず私たちに示したいと思っていた新しい劇の構想が、そうさせたのである。突き詰めれば彼は劇作家だ。バイロイトがあっても成功しなかったのは、作品そのものが深い矛盾をはらんでいるからである。本書の著者は、ワーグナーとその作品が突きつけるジレンマをことのほか切実に感じた。その苦しみが著者を解放への道に向かわせた。その道にとって、巨匠の作品は出発点にすぎない。あるいは、壮大でありがたい警告だったと言ってもよい。"
  "translation_status": "reviewed"
- "id": "appia-0226"

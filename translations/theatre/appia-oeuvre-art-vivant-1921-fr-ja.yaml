  "kind": "paragraph"
  "origin": "source"
  "source_text": "Robinson dans sa cruelle solitude, devait se créer à lui-même des êtres pour se réjouir et souffrir avec lui, selon l’expression de Prométhée. C’est dans son propre corps qu’il devait les reconnaître; et le don réciproque n’était possible, pour lui, qu’en une fiction dramatique, qu’en une application spéciale de l’art vivant; et, l’art dramatique étant d’exprimer des sentiments que notre vie personnelle ne nous oblige pas de ressentir au même moment, donc des sentiments fictifs, il pouvait bien « avoir peur » avec les personnages de sa création, mais il restait seul: même le don qu’il faisait de lui-même restait fictif; bien que son œuvre existât, certes, et bien vivante ! Peut-être sommes-nous tous aussi solitaires que Robinson, mais — loué sois-tu, ô Prométhée — nous le sommes en commun! et quand nous nous reconnaissons en notre frère, c’est en un autre corps que le nôtre; aussi la fiction dramatique n’est-elle pas une condition indispensable à notre union; les modifications esthétiques imposées par la musique suffisent pour établir le courant qui doit unir nos âmes en unissant nos corps. Le grand Inconnu, notre corps — notre corps collectif — il est là ; nous devinons sa présence silencieuse, telle une grande force latente et qui attend; parfois, même, nous ressentons un peu de la joie qu’il a peine à contenir... Laissons déborder cette joie; l’art veut nous la donner!"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 99
    "pdf_page_end": 100
    "printed_page": "93"
    "printed_page_end": "94"
  "translation_ja": "ロビンソンは耐えがたい孤独の中で、プロメテウスの言葉を借りれば、ともに喜び苦しむ人々を、自分のために創らねばならなかった。人々を認めるのは自分の身体の中だった。互いに自分を贈ることができたのは、劇という虚構の中、生きた芸術の特殊な応用の中だけである。演劇とは、私生活でちょうど同じ時に感じる必要のない気持ち、つまり架空の気持ちを表すことだから、自分の創った登場人物と「一緒に恐れる」ことはできても、依然として一人だった。作品は確かに存在し、しかも生きていたのに、自分を贈ることさえ、虚構にとどまった。私たちは皆、ロビンソンと同じほど孤独かもしれない。だがプロメテウスよ、ほめたたえられよ。私たちは一緒に孤独なのだ。同胞のうちに自分を認めるとき、それは自分とは別の身体においてである。だから、私たちが結ばれるのに劇の虚構は不可欠ではない。音楽が要求する、美のための変更だけで、身体を一つにして心を結びつける流れを生み出せる。大いなる未知、私たちの身体、皆で一つの身体はそこにいる。秘められて何かを待っている大きな力のように、沈黙したままそこにいるのを予感する。抑えきれそうにないその歓びを、私たちもときには少し感じる。この歓びをあふれさせよう。芸術はそれを私たちに与えようとしているのだから。"
  "translation_status": "reviewed"
- "id": "appia-0186"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Apprenons à vivre l’art en commun; apprenons à en soutenir en commun les émotions profondes qui nous lient et nous engagent pour nous libérer. Soyons artistes ! Nous le pouvons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 100
    "printed_page": "94"
  "translation_ja": "芸術を皆で生きることを学ぼう。深い感動をともに受けとめることを学ぼう。その感動は、私たちを結び、私たちを自由にするために私たちに関わることを求める。芸術家になろう。私たちにはできる。"
  "translation_status": "reviewed"
- "id": "appia-0187"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est dans nos habitudes de considérer l’existence d’un artiste comme plus indépendante que la nôtre; nous lui pardonnons davantage et mêlons à cette bienveillance protectrice de l’envie et de l’admiration. Notre admiration est inspirée du caractère désintéressé de l’art, que nous reportons, inconsidérément, sur l’artiste pour y trouver l’excuse de bien des faiblesses; et nous envions alors l’être auquel nous accordons le droit de vivre plus ou moins en marge et dans une lumière très avantageuse. Tout cela résulte, nous le savons parfaitement, d’une faculté que nous ne possédons pas, et dont l’exercice procure des jouissances et un crédit enviables. Observons, cependant, que toutes les activités dont nous ne pouvons pas pénétrer le détail et dont nous constatons seulement le résultat, nous inspirent ce même genre d’admiration et d’envie. La personne d’un grand savant, astronome, chimiste, etc... est séparée de la nôtre par les mystères de son travail Un travail d’exception doit évidemment avoir une influence très particulière sur le caractère ; nous le croyons du moins, et sommes enclins à mettre respectueusement toutes les originalités sur le compte de cette influence. Le travail inconnu nous inspire ainsi de l’admiration, mais il nous sépare de l’individu ; nous nous distinguons nettement du grand savant comme de l’artiste. Socialement, nous nous maintenons en spectateurs, vis-à-vis d’eux. Nous tendons, éternellement, la main pour recevoir — là comme ailleurs — et si nous ne sollicitons pas un homme d’affaires de nous donner de l’argent, parce que nous nous sentons du même côté que lui..., nous mendions, notre vie durant, auprès de ceux dont l’activité nous semble assez désintéressée et distincte de la nôtre pour nous le permettre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 100
    "pdf_page_end": 101
    "printed_page": "94"
    "printed_page_end": "95"
  "translation_ja": "私たちは芸術家の生活を、自分たちの生活より独立したものと見ることに慣れている。芸術家には多めに目をつぶり、かばうような好意に、うらやましさと感嘆を混ぜる。感嘆するのは、芸術が利益とは関わりのないものだからである。それをよく考えもせず芸術家へ当てはめ、多くの弱さの言い訳にする。そして私たちは、世間からいくらか離れ、ひときわ好ましい光を浴びて生きる権利を認めたその人を、うらやむ。よくわかっているとおり、そのすべては私たちにない能力から来ており、それを使うと、うらやましいほどの歓びと信用が得られるのだ。だが私たちには詳しいところがわからず、結果を見るだけの活動なら、どれも同じような感嘆とうらやましさを呼び起こすことに注意しよう。偉大な学者、天文学者、化学者などは、何をしているのか知られないことで、私たちから隔てられている。並外れた仕事は人柄に特別な影響を及ぼすにちがいない、と少なくとも私たちは思う。そして敬意を込めて、変わっているところはみなその影響だとみなしがちだ。このように、知らない仕事は感嘆を呼ぶ一方、私たちをその人から切り離す。偉大な学者とも芸術家とも、自分たちをはっきり区別する。社会において、その人たちの前で私たちは観客のままでいる。そこでも、どこでも、絶えず受け取るために手を伸ばす。商売人にお金をくれと言わないのは、自分はその人と同じ側だと感じるからだ。それでも、自分の利益を顧みない活動をしており、私たちとはかなり違うから、こちらが物乞いしてもよいと思える人々に、私たちは生涯、ものをねだるのである。"
  "translation_status": "reviewed"
- "id": "appia-0188"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est de toute évidence que nous attendons toujours quelque chose de l’artiste, sans aucun souci de ce que nous pourrions lui offrir en retour. L’intermédiaire de l’argent nous laisse débiteurs de l’artiste. Nous savons qu’une paire de chaussures se fait avec de l’argent et, lorsque nous avons payé notre cordonnier, nous pouvons penser à autre chose. Lorsque nous contemplons une œuvre d’art achetée, nous sentons que nous n’avons rien donné en retour qui puisse lui être comparé, et que cette œuvre d’art n’est, après tout, pas à nous. « Propriété de Monsieur X... » est une étiquette mensongère. Celui qui achète un brevet sait bien qu’il n’achète pas l’invention. Rien ne peut être offert en échange d’une grande découverte; rien, en échange d’une œuvre d’art; l’une et l’autre restent à jamais la propriété de l’artiste et du savant. Le rôle intermédiaire de l’argent accentue, au contraire, davantage encore celui de spectateur incorrigible que nous sommes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 101
    "pdf_page_end": 102
    "printed_page": "95"
    "printed_page_end": "96"
  "translation_ja": "私たちは芸術家に、いつも何かを期待しながら、代わりに何を差し出せるかは少しも考えない。これはまったく明らかだ。金を間に入れても、芸術家への借りは残る。靴一足は金で作ってもらえることを、私たちは知っている。靴屋に金を払えば、あとはほかのことを考えられる。だが買った芸術作品を眺めるときは、引き換えに見合うものを何も渡さなかった、この作品は結局、自分たちのものではないと感じる。「某氏所蔵」は偽りの札である。特許を買った人は、発明そのものを買ったのではないとよく知っている。大きな発見に引き換えられるものは何もない。芸術作品にも何もない。どちらも芸術家や学者のものとして永遠に残る。金を仲立ちにすることは、かえって私たちがどうしようもなく観客でいることを、より際立たせる。"
  "translation_status": "reviewed"
- "id": "appia-0189"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lorsque nous achetons un billet de concert, théâtre ou conférence, ces tristes relations sont manifestes; faire queue dans les zigzags d’un bureau de location est toujours humiliant; aussi tout le monde cherche à ne pas trop s’en apercevoir... Et pourtant notre vie est une queue perpétuelle devant le guichet de l’artiste, du savant, de l’homme de foi. Nous persistons à croire que les choses s’achètent et, si nous ouvrons, pour ce faire, notre bourse, avec ou sans argent, nous n’en cadenassons que plus délibérément notre individualité. Le seul don qui puisse toujours suffire à l’échange, c’est le don de nous-même ; nous le savons parfaitement, et nous nous y refusons: la honte méprisable qui nous interdit de montrer notre corps, nous retient, aussi, pour découvrir notre âme. Et nous nous plaignons d’isolement ! Celui qui, sans préjugé, et d’un esprit droit, s’est approché de certains chrétiens sincèrement conséquents — ils sont rares — et les a suivis quelque temps, en observant leurs actes, leurs paroles, leur physionomie et leurs gestes, a dû s’écrier, presque douloureusement : « Ce sont des artistes ! » En effet, ces êtres d’exception accomplissent, heure après heure, l’acte essentiel, l’acte indispensable à l’existence de l’art: le don de soi. Et leur vie serait une œuvre d’art, si nous savions, si nous pouvions la posséder, c’est-à-dire donner la nôtre en échange. En ce sens, nous avons bien des œuvres d’art; nous n’en possédons aucune."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 102
    "printed_page": "96"
  "translation_ja": "演奏会や芝居や講演の切符を買うときは、こうした情けない関係がありありと見える。切符売場で折れ曲がる列に並ぶのは、いつでも屈辱的で、誰もがあまり気づかないようにする。にもかかわらず私たちの人生とは、芸術家や学者や信仰の人の、窓口の前にいつまでも並ぶ列である。私たちは物は買えると思い込み、金があってもなくても、そのため財布を開くたび、いよいよはっきりと、自分自身には錠をかける。どんな交換にもつねに足りるただ一つの贈り物は、自分自身を贈ることである。よく知っていながら、それは拒む。自分の身体を見せまいとする、情けない恥じらいが、魂をさらけ出すことも思いとどまらせる。それなのに私たちは、孤立していると嘆くのだ。数少ないながら、信仰を誠実に貫くキリスト教徒に、偏見なくまっすぐな心で近づき、行い、言葉、顔つき、身ぶりを見ながらしばらく過ごしたなら、胸が痛むような思いで「この人たちは芸術家だ」と言わずにいられなかったであろう。この並外れた人々は、一刻ごとに、芸術が存在するのに不可欠な、本質的な行為を成し遂げている。自分を贈ることだ。私たちがその人々の生をわがものにできるなら、つまり引き換えに自分の生を差し出せるなら、その人々の生は芸術作品となる。その意味で、私たちには芸術作品がいくつもあるが、わがものとしている作品は一つもない。"
  "translation_status": "reviewed"
- "id": "appia-0190"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Oh oui ! Nous sommes isolés sous les verrous de notre geôle ; nous ne recevons notre pitance qu’au travers d’un guichet. Comment saurions-nous, alors, ce qui se passe au delà de ce guichet ? Or, c’est là le mystère qui force notre respect, notre admiration; la liberté qui nous remplit d’envie ! L’artiste ? Mais, c’est celui qui vit au delà du guichet et de ses limitations, de ses dépendances pitoyables."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 102
    "pdf_page_end": 103
    "printed_page": "96"
    "printed_page_end": "97"
  "translation_ja": "そうなのだ。私たちは自分の牢に錠をかけられ、孤立している。窓口を通してしか、わずかな食い扶持をもらえない。窓口の向こうで何が起きているか、どうして知ることができよう。ところが、その向こうにこそ、私たちに敬意と感嘆を抱かせる神秘と、うらやまずにはいられない自由がある。芸術家とは何か。窓口の向こう、その制約や惨めな依存を離れたところで生きている者だ。"
  "translation_status": "reviewed"
- "id": "appia-0191"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une telle situation a dû, nécessairement, créer des formes d’art anormales. Vivre en prison n’est pas la vie normale. Notre art moderne est un art destiné à des prisonniers. Et l’artiste ne peut pas davantage se donner à des prisonniers que ceux-ci n’ont le pouvoir de se donner à lui; une porte verrouillée les sépare."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 103
    "printed_page": "97"
  "translation_ja": "こんな状況では、まともでない芸術の形が必然的に生まれたはずだ。牢に住むのはまともな生活ではない。私たちの近代の芸術は囚人向けの芸術である。そして芸術家には、囚人に自分を贈ることができず、囚人にも、芸術家に自分を贈る力がない。錠のかかった戸が両者を隔てている。"
  "translation_status": "reviewed"
- "id": "appia-0192"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aucune forme de notre art contemporain ne doit, désormais, nous servir de norme, ni même d’exemple. Nous voulons sortir de prison, respirer un air pur, et le respirer en commun. Toute œuvre inspirée par notre captivité, nous la rejetterons derrière nous, dans les tristes couloirs où nous avons végété. Et nos mains, libérées, ne se tendront plus pour recevoir mais pour donner. Que nous importe qu’elles soient vides: d’autres mains viendront les saisir, les remplir de la même chaleur vivante qui les pénètre, pour la recevoir en retour. Et le pacte immortel sera conclu. Nous voudrons tous vivre l’art, et non plus seulement en jouir ! Les uns vis-à-vis des autres, nous ne nous opposerons plus ainsi que dans nos salles et nos bibliothèques, mais nous nous pénétrerons ; et ce ne seront plus de pâles reflets extérieurs qui éclaireront nos yeux... Non ! Ce seront nos yeux mêmes qui lanceront dans l’espace leur flamme et qui créeront, en liberté, la lumière vivante au travers de l’espace vivant, dans la transfiguration du temps. Et qu’importe si nos premiers pas sont maladroits? Nous vivrons l’art; ou, mieux: nous lui apprendrons à vivre; et nous pourrons sourire de commisération à la vue, à l’ouïe, des œuvres dont la perfection factice était le fruit de notre esclavage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 103
    "printed_page": "97"
  "translation_ja": "これからは、同時代の芸術のどの形も、私たちの規範としたり、例に取ったりさえすべきでない。牢から出て、澄んだ空気を吸いたい。皆で吸いたい。囚われの暮らしが生んだ作品はすべて、私たちが生きるともなく生きてきた暗い廊下に、置き去りにしよう。自由になった手は、もう受け取るためではなく、与えるために伸びるだろう。手が空でも、かまうものか。別の手がその手を握り、自分が受け取るために、自分に浸みわたるのと同じ生きたぬくもりを、相手の手へ渡す。こうして不滅の約束が結ばれる。私たちは皆、芸術を楽しむだけでなく、芸術を生きたいと思う。客席や書庫でそうしているように、互いに向き合って隔たるのではなく、お互いの内に入ってゆくだろう。目を照らすのも、もはや外からのかすかな反射ではない。そうではない！　私たち自身の目が、空間へ火を放つ。時が姿を変えるなかで、生きた空間を貫く生きた光を、自由に創るのだ。最初の足どりが不器用でも、どうだというのか。私たちは芸術を生きる。いや、芸術に生きることを教えるのだ。私たちの隷属が生んだ、まがい物の完全さを備えた作品を前にして、見るにつけ聴くにつけ、気の毒に思ってほほえむこともできる。"
  "translation_status": "reviewed"
- "id": "appia-0193"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Notre pierre de touche sera notre expérience de la beauté, expérience faite en commun. Nous serons tous responsables de nos propres œuvres, et n’aurons plus à chercher les raisons d’œuvres accomplies sans nous. Nos œuvres seront le résultat suprême de notre vie intégrale, exprimée par un corps — le nôtre — soumis à l’austère discipline de la beauté. Notre but est dans cette activité même; aussitôt atteint nous le dépassons; la Vie est dans le Temps: sitôt réalisée, le passé l’engloutit, l’avenir la requiert, et le temps ne lui accorde pas de loisir pour la passivité... C’est en ce sens, surtout, que l’art doit être vécu !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 104
    "printed_page": "98"
  "translation_ja": "私たちの試金石となるのは、皆で分かち合う美の経験である。誰もが自分の作品について責任を持つようになり、自分抜きで作られた作品のわけを探す必要もなくなる。私たちの作品は、自分たちの身体が美の厳しい規律に従い、生活のすべてを表現する、その最高の結果となる。目的は、この活動そのものの中にある。達したと思うとすぐ、私たちはそこを越えている。生命は時間の中にある。生命が現れるやいなや、過去がそれをのみ込み、未来がそれを求め、時間は生命に受け身でいる暇を与えない。とりわけこの意味で、芸術は生きられなければならない！"
  "translation_status": "reviewed"
- "id": "appia-0194"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous abandonnerons le bouquiniste, et le collectionneur, à leurs toiles d’araignées. Un livre, une partition, un tableau, une statue, n’auront plus qu’une valeur relative; valeur d’éducation, de renseignement, d’émotion, de souvenir, de protection. Schopenhauer nous assure que tous les grands hommes, dans n’importe quel domaine de l’activité humaine, ont toujours dit, ou voulu dire, exactement «la même chose»... Cette « chose », nous la sentirons palpiter en nous, devenir toujours plus insistante, inspiratrice; et, libérés des chaînes de la Forme, nous la clamerons — cette « chose » — chacun à sa manière ! aussi certains de sa réalité suprême que nous le serons de la conquête de notre être intégral."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 104
    "printed_page": "98"
  "translation_ja": "古本屋も収集家も、蜘蛛の巣にまかせておこう。本、楽譜、絵画、彫像はもう、相対的な価値しか持たなくなる。学び、情報、感動、記憶、保護のための価値である。ショーペンハウアーによれば、人間の活動のどんな分野でも、偉大な人々はいつも、まったく「同じこと」を言ったか、言いたかったのだという。その「こと」が私たちの中で鼓動し、いよいよ強く何かを促し、着想を与えるのを感じるだろう。形の鎖から解き放たれた私たちは、その「こと」を、それぞれの仕方で声に出す。自分自身を丸ごとわがものにしたと確信するのと同じほど、それがこの上なく確かに存在すると信じて。"
  "translation_status": "reviewed"
- "id": "appia-0195"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’Expérience de la beauté, en nous donnant la clé de notre personnalité, nous rendra conscients des limitations de notre vie quotidienne, et nous enseignera la patience et la sérénité. Car elle entretiendra, dans les circonstances ternes ou douloureuses de notre vie, un ardent foyer d’espoir: tel celui de l’artiste quand il voit la destruction d’une belle œuvre d’art — peut-être même de son œuvre à lui, ainsi que nous le montre Léonard de Vinci — et qu’il sent en lui-même le pouvoir d’en créer mille autres nouvelles..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 104
    "printed_page": "98"
  "translation_ja": "美の経験は、自分がどんな人間かを知る鍵を与え、日常生活の制約を自覚させ、忍耐と心の平静を教える。なぜなら、美の経験は、人生の色あせた、あるいは苦しい局面にあっても、燃えさかる希望の火を保ってくれるからだ。美しい作品が破壊されるのを、あるいはレオナルド・ダ・ヴィンチがその例を示してくれたように、自分の作品が破壊されるのを見ても、そのほかに新しい作品を千でも作る力が自分にあると感じる、芸術家の希望の火に似ている。"
  "translation_status": "reviewed"
- "id": "appia-0196"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais ce nouveau pouvoir ne sera pas une joie seulement. L’accroissement de la puissance implique celui de la responsabilité; et le don de soi-même n’ira pas sans nous obliger à faire d’étranges constatations. Nous devrons convenir que donner n’est pas tout, et nous nous demanderons quelle est la valeur, la qualité, de ce que nous voulons offrir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 105
    "printed_page": "99"
  "translation_ja": "だがこの新しい力は、喜びだけをもたらすのではない。力が増せば責任も増す。自分を贈ることは、私たちに奇妙なことを認めさせずにはおかない。与えるだけで十分ではないと認め、差し出したいものにどんな値打ちがあり、どんな質を備えているのかを、問うようになる。"
  "translation_status": "reviewed"
- "id": "appia-0197"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Puisque l’expérience de la beauté a été le résultat d’une conscience nouvelle que nous avons prise de notre corps, la notion même de ce corps acquiert une portée que nous ne soupçonnions pas, ou que nous avions oubliée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 105
    "printed_page": "99"
  "translation_ja": "美の経験は、自分の身体に対する新たな自覚から生まれた。だから身体という考えそのものも、これまで思いも寄らなかった、あるいは忘れていた広がりを持つようになる。"
  "translation_status": "reviewed"
- "id": "appia-0198"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jusqu’ici l’auteur, entraîné par les nécessités techniques de son sujet s’est borné à nommer notre corps par son nom, sans autre; et plus d’un lecteur, peut-être, aura été choqué de cette insistance, et péniblement étonné de ce qu’aucun correctif ne venait le tempérer. En effet, notre morale nous a accoutumés à ne comprendre sous ce vocable qu’un organisme, sujet à des penchants si dangereux pour notre être spirituel, qu’une ligne de démarcation devait être sévèrement entretenue entre eux. Inutile de rappeler jusqu’à quel degré d’hypocrisie et de laideur ce principe criminel nous a fait descendre. Mais, par contre, il devient indispensable, ici, de se souvenir que par « corps » — le corps humain, sans plus — nous désignons la seule forme visible de notre être intégral, et qu’ainsi ce mot possède l’une des plus hautes dignités que notre vie puisse conférer au langage. Par conséquent, si l’auteur a dû souvent s’en servir pour désigner une simple forme mobile dans l’espace, il n’a jamais perdu de vue sa suprême fonction."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 105
    "printed_page": "99"
  "translation_ja": "ここまで著者は、主題を技術的に論じる必要に引かれて、私たちの身体を、ただ身体と呼ぶにとどめてきた。あまりにそれを強調するので、衝撃を受け、それをやわらげる言葉が何もないことに、不快な驚きを覚えた読者も少なくないかもしれない。事実、私たちの道徳は、私たちに、身体という言葉で、精神の存在を危うくするほどの性向に動かされる有機体しか思い浮かべないようにさせてきた。そういう身体と精神とを厳しく線引きして隔てねばならなかったのである。この罪深い原理が、私たちをどこまで偽善と醜さに落としたかは、言うまでもない。反対にいまこそ、私たちが「身体」、ただ人間の身体と言うとき、それは私たちという存在全体が取る、唯一目に見える形を指すことを、思い出さなければならない。だからこの言葉は、私たちの生が言葉に授けうる、この上ない尊さの一つを備えている。したがって著者は、身体という語を、空間の中で動く単純な形を指すのに、何度も使わねばならなかったとはいえ、身体の最高の働きを見失ったことは一度もない。"
  "translation_status": "reviewed"
- "id": "appia-0199"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le moment est venu de l’affirmer, puisque nous sommes arrivés au point de notre étude où la responsabilité de notre être intégral — corps compris — entre plus spécialement en ligne de compte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 105
    "printed_page": "99"
  "translation_ja": "そのことを、はっきり言うべき時が来た。私たちの考察は、身体を含めた、私たちの存在全体の責任が、特に考慮されるべきところまで進んだからだ。"
  "translation_status": "reviewed"
- "id": "appia-0200"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tant qu’il n’était question que du temps et de l’espace, de deux ou de trois dimensions, des mouvements et des durées, — la dignité du terme pouvait être sous-entendue ; car il est bien évident que nous ne prendrions pas tant de souci esthétique pour un organisme sans âme, pour une simple machine ! Maintenant tout malentendu doit être écarté. Nous avons vu que la dignité artistique du corps en mouvement constitue un problème technique important à résoudre pour l’avenir de notre culture. Il resterait à nous convaincre des obligations que cette dignité impose à notre être intégral dans la vie publique; et c’est là que doit s’arrêter l’étude présente. Car chacun peut mesurer dans les limites de son âge et de sa position sociale, de son degré de culture et de ses facultés personnelles, la place qu’il occupe, ou doit occuper, pour être un artiste vivant, un représentant de la vie de l’art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 106
    "printed_page": "100"
  "translation_ja": "時間と空間、二次元や三次元、動きと持続だけを扱っていた間は、身体という語の尊さを、ことさらに言わずに済んだ。魂のない有機体、ただの機械のためなら、美のためにこれほどまで気を配らないのは明らかである。いまは、あらゆる誤解を除かねばならない。動く身体の芸術的な尊さとは、私たちの文化の将来のために解かねばならない、重要な技術の問題であると見てきた。残るのは、この尊さが公の生活において、私たちの存在全体に課す義務を納得することである。本書の考察はそこで終わらなければならない。一人ひとりが、年齢や社会的立場、教養の程度、各自の力を勘案しながら、生きた芸術家、芸術の生命を表す人であるために、自分が占めている、あるいは占めるべき位置を測れるからである。"
  "translation_status": "reviewed"
- "id": "appia-0201"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette vie confère à ses disciples un rayonnement qu’aucune déformation professionnelle ne saurait intercepter. Elle est en nous un feu définitivement allumé. Aussi la Présence réelle, personnelle et intégrale, en acquiert une valeur nouvelle, puisqu’elle seule peut projeter directement, et sans autre intermédiaire qu’elle-même, le rayon divin, avec ou sans paroles, avec ou sans œuvre délimitée. Le moindre geste la révèle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 106
    "printed_page": "100"
  "translation_ja": "この生命は、それを学ぶ人に、職業上のどんな偏りにもさえぎれない輝きを授ける。私たちの中で消えることなくともる火である。したがって一人の人間が、現実に、全身全霊でそこにいることには、新しい価値が生じる。それだけが、自分以外の何ものも介さず、言葉があってもなくても、形の定まった作品があってもなくても、神々しい光をじかに投げかけられるからだ。かすかな身ぶりにも、それは現れる。"
  "translation_status": "reviewed"
- "id": "appia-0202"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est donc en se répandant le plus possible, en prenant part active ou sympathique à toutes les manifestations de notre vie publique, en se donnant sans réserve et sans retour — mais aussi sans compromissions — que nous préparerons l’avènement bienheureux de l’art vivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 106
    "printed_page": "100"
  "translation_ja": "だから私たちは、できるかぎり広く出ていき、公の生活のあらゆる現れに、自ら動いて、あるいは共感をもって関わり、何も取っておかず、見返りを求めず、ただし妥協もせずに自分を差し出すことで、生きた芸術のめでたい到来に備えるのだ。"
  "translation_status": "reviewed"
- "id": "appia-0203"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’auteur se propose de revenir dans une autre étude sur l’influence sociale de la vie de l’art et d’en développer les conséquences. Il entrevoit déjà des symptômes précurseurs remarquables. Par exemple: nos salles, quelles qu’elles soient, ont pris une élasticité qui ne peut échapper à personne. Des réunions politiques, religieuses, des conférences, des concerts, etc... se donnent fréquemment dans un cirque, un théâtre; et, par contre, le théâtre se transporte volontiers dans le cirque. L’étiquette, rigoureusement fixée aux façades de nos édifices, commence à flotter à tous les vents. La musique, la danse, sont entrées à la Comédie, et le drame à l’Opéra. Notre existence privée et notre vie en public ne sont plus aussi strictement délimitées que par le passé. Le foyer familial déborde dans la rue, et la vie au grand air fait irruption par nos fenêtres ; le téléphone rend nos conversations presque publiques, et nous ne craignons plus d’exposer au grand jour nos corps et, partant, nos âmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 106
    "pdf_page_end": 107
    "printed_page": "100"
    "printed_page_end": "101"
  "translation_ja": "著者はいずれ別の考察で、芸術の生命が社会に及ぼす影響に立ち返り、その結果を論じたいと思っている。注目すべき前触れはもう見えている。たとえば私たちの会場は、種類を問わず、誰の目にもわかるほど用途が柔軟になった。政治や宗教の集会、講演、演奏会などは、しばしばサーカス場や劇場で開かれる。反対に芝居は気軽にサーカス場へ出てゆく。建物の正面に厳然とつけられていた札が、四方の風にはためき始めている。音楽や舞踊が芝居小屋に入り、劇が歌劇場に入った。私生活と公の生活の境は、昔ほど厳しくない。家庭の暮らしは通りへあふれ、戸外の生活が窓からなだれ込む。電話が私たちの会話をほとんど公にする。もはや私たちは、自分の身体を白日のもとにさらし、それゆえ心をさらすことも、恐れなくなった。"
  "translation_status": "reviewed"
- "id": "appia-0204"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aussi éprouvons-nous un besoin toujours plus impérieux de nous réunir, soit en plein air, soit dans une salle qui n’ait pas été affectée, par avance, à l’une de nos manifestations publiques, à l’exclusion des autres, mais dont, au contraire, la seule raison d’être serait simplement de nous réunir, telle la cathédrale du passé..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 107
    "printed_page": "101"
  "translation_ja": "だから私たちは、いよいよ切実に、戸外か屋内の会場に集まりたいと感じる。その会場は、私たちの公の営みのうち、一つだけにあらかじめ割り当てられ、ほかを締め出す場ではない。反対に、ただ私たちが集まることだけが存在理由となる場だ。昔の大聖堂のような。"
  "translation_status": "reviewed"
- "id": "appia-0205"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le mot m’est échappé ! Je ne le reprendrai pas. Oui: c’est la cathédrale de l’avenir que nous appelons de tous nos vœux ! Nous nous refuserons toujours davantage à courir d’un lieu à un autre pour des activités qui ont à se regarder en face et à se pénétrer. Nous voulons un lieu où notre communauté naissante puisse s’affirmer nettement dans l’espace; et cela en un espace assez souple pour s’offrir à la réalisation de tous nos désirs de Vie intégrale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 107
    "printed_page": "101"
  "translation_ja": "ついこの言葉が出てしまった！　取り消すつもりはない。そうだ。私たちが心から望んでいるのは、未来の大聖堂である！　顔を合わせ、互いの内に入らなければならない活動のために、ある場所から別の場所へ掛け回ることを、私たちはますます拒むようになる。生まれつつある共同体が空間の中ではっきりと姿を現せる場所が欲しい。そしてそれは、生のすべてを生きたいという、私たちのあらゆる望みを実現するために開かれた、十分に柔軟な空間でなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0206"
  "section_id": "unknown"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Peut-être qu’alors d’autres étiquettes s’envoleront à leur tour comme des feuilles mortes: concert, représentation, conférence, exposition, sport, etc..., etc... deviendront des dénominations à jamais désuètes ; leur pénétration réciproque sera un fait accompli. Et nous vivrons en commun notre vie, au lieu de la regarder s’écouler par des canaux divers, entre des parois étanches."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 107
    "printed_page": "101"
  "translation_ja": "そのときまた別の札が、枯れ葉のように飛んでいくかもしれない。演奏会、上演、講演、展覧会、スポーツなど、そうした呼び方は永遠に古び、活動は互いに溶け合うようになる。こうして私たちは、仕切りの壁に囲まれた別々の水路を、生が流れてゆくのを見守るのではなく、自分たちの生を皆で生きるようになる。"
  "translation_status": "reviewed"
- "id": "appia-0207"
  "section_id": "flame"
  "kind": "heading"
  "origin": "source"
  "source_text": "Les porteurs de flamme."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 109
    "printed_page": "103"
  "translation_ja": "火を運ぶ者たち。"
  "translation_status": "reviewed"
- "id": "appia-editorial-poem-103"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "printed_page": "103"
    "pdf_page": 109
    "url": "https://archive.org/details/loeuvredartvivan00appiuoft/page/n108/mode/1up"
  "translation_ja": "訳者注：原刊103頁には、ジャック・シュヌヴィエール（Jacques Chenevière）の署名入りの詩があります。この版にはその原文・訳文を掲載していません。原刊103頁を見る。"
  "translation_status": "reviewed"
- "id": "appia-0208"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En poussant mon étude jusqu’aux dernières limites de ses conséquences, je crains d’avoir outrepassé mes droits vis-à-vis du lecteur. Et, pourtant, cela m’a semblé indispensable; car pour tenir fermement un objet dans la main, il faut l’avoir dépassé. De même d’une idée. — Maintenant nous avons pris possession de l’art vivant, de l’Idée qu’il représente et des responsabilités qu’il nous impose, et nous devons chercher l’usage pratique qu’il importe d’en faire au bénéfice de notre culture moderne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 110
    "printed_page": "104"
  "translation_ja": "この考察を、その帰結の行き着くところまで押し進めたため、読者に対して許される範囲を越えてしまったのではないかと心配している。それでも私には、こうするほかなかった。何かを手にしっかりと握るには、指先がそれを越えるところまで届かなければならない。考えをつかむにも同じことが言える。私たちはいま、生きた芸術と、それが体現する理念、そしてそれが私たちに課す責任とを手にした。では、現代の文化のために、これをどのように実際に役立てるべきかを探らなければならない。"
  "translation_status": "reviewed"
- "id": "appia-0209"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jusqu’ici c’est en consommant sacrifices sur sacrifices que nous sommes arrivés à l’idée pure de ce que représente le Mouvement — c’est-à-dire la Vie — dans l’art."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 110
    "printed_page": "104"
  "translation_ja": "ここまで私たちは、犠牲を重ねながら、芸術において運動、すなわち生命が何を意味するのか、その純粋な理念にたどり着いた。"
  "translation_status": "reviewed"
- "id": "appia-0210"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous avons dû procéder négativement sur presque tous les points, pour nous attacher le plus sûrement, le plus solidement possible à cette idée; et nous voici en face de nous-mêmes et de nos semblables, sans autre intermédiaire que le désir d’une communion esthétique. Comment allons-nous exprimer ce désir en vue d’une réalisation pratique, et comment le faire partager aux autres, d’une manière concrète et convaincante qui les incite à s’unir à nous pour la Grande Œuvre ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 110
    "printed_page": "104"
  "translation_ja": "この理念をできるだけ確実に、しっかりとつかむため、私たちはほとんどあらゆる点で、まず否定することから始めなければならなかった。いま私たちは、美を分かち合いたいという願いだけを介して、自分自身と、同じ人間である他の人たちとに向き合っている。この願いを実現するには、どう表せばよいのだろう。また、具体的で説得力のあるどんな方法なら、他の人たちにもこの願いを分かち合ってもらい、この大いなる仕事に私たちと力を合わせようと思ってもらえるのだろうか。"
  "translation_status": "reviewed"
- "id": "appia-0211"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une attitude simplement restrictive, un renoncement passif à tout ce qui dans notre vie moderne contredit à l’art vivant, n’auraient-ils pas une influence décourageante et, partant, déprimante sur les êtres de bonne volonté ? Ne serait-ce pas prendre la lettre pour l’esprit ? Qui donnerait alors l’impulsion ? Qui se trouverait là pour notre sûre orientation, si ceux qui en possèdent la clef l’enferment dans un coffret scellé, sous prétexte de ne la livrer à aucune compromission ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 110
    "pdf_page_end": 111
    "printed_page": "104"
    "printed_page_end": "105"
  "translation_ja": "ただ制限を課すだけの態度や、現代生活のうち生きた芸術と相いれないものすべてを消極的に断つことは、進んで力を貸そうとする人たちの意気をそぎ、気持ちを沈ませないだろうか。それでは文字面を精神と取り違えることにならないか。では誰が最初の一歩を促すのか。鍵を持つ人たちが、一切の妥協にさらしたくないという口実で、それを封をした小箱に閉じ込めてしまったら、いったい誰が、私たちを確かな方向へ導いてくれるのか。"
  "translation_status": "reviewed"
- "id": "appia-0212"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’art vivant, nous l’avons vu, demande à l’auteur dramatique une attitude nouvelle; et cette attitude résulte de la concentration de son imagination sur l’être vivant seulement, à l’exclusion de toutes contingences. En ce sens, nous sommes devenus — maintenant — des auteurs dramatiques, et notre attitude doit répondre à ce nom. Or, un auteur dramatique accepte dans son œuvre des éléments d’humanité qu’il réprouve; c’est même de ce conflit que son œuvre puise la vie. Notre œuvre dramatique à nous, c’est notre vie publique et quotidienne; et si nous en refusons les éléments subversifs, nous renonçons d’emblée à notre œuvre dramatique, à l’œuvre d’art vivant. Notre attitude est par là tout indiquée: tel un dramaturge — mais cette fois aux prises avec des éléments vivants dès l’origine, — nous devons dominer les conflits, les réactions, pour une fin supérieure. Définitivement orientés, nous portons un flambeau de vie qui doit éclairer tous les replis de notre vie publique, et, en particulier, de notre vie artistique. Ce n’est pas en le plaçant dans notre sanctuaire privé, et devant des images aimées de nous seuls, qu’il pourra guider notre semblable. J’ai dit que tout chrétien sincèrement conséquent est un artiste; il l’est parce qu’il se donne et ne se refuse pas au contact de ceux qu’il veut connaître, et peut-être secourir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 111
    "printed_page": "105"
  "translation_ja": "すでに見たように、生きた芸術は劇作家に新しい態度を求める。あらゆる偶然的な事情を離れ、想像力を生きている人間だけに集中させれば、その態度が生まれる。この意味で、私たちはいまや劇作家となった。態度もその名にふさわしくなければならない。ところで劇作家は、自分なら是認できない人間のあり方も作品に受け入れる。作品はまさに、その葛藤から生命をくみ取る。私たち自身の劇作品とは、人々のなかで送る日々の生活のことだ。その秩序を揺るがすものを拒むなら、私たちは初めから、自分たちの劇作品、生きた芸術作品を手放すことになる。取るべき態度はおのずと明らかである。劇作家のように、ただし今度は初めから生きているものを相手にして、より高い目的のために、対立や反発を制さなければならない。行く先をはっきり見定めた私たちは、生命のたいまつを手にしている。その光は、人々とともに生きる生活の隅々を、とりわけ芸術の営みを照らすはずだ。自分だけの聖所に置き、自分たちだけが愛する像の前にかざしても、それで他の人を導くことはできない。真摯に信仰を貫くキリスト教徒はみな芸術家だと、私は述べた。その人が芸術家であるのは、自分を捧げ、理解したい、またできれば助けたいと願う人々との触れ合いを拒まないからである。"
  "translation_status": "reviewed"
- "id": "appia-0213"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Soyons sincèrement conséquents comme lui. Comme lui, conservons jalousement la source qui alimente notre flambeau, mais portons cette flamme haut la main, comme un grand témoignage; et, où que nous nous trouvions, où que nous ayons voulu nous trouver, éclairons-en l’espace avec ceux qui s’y trouvent; elle éveillera des clartés inconnues, portera des ombres révélatrices..., et nous préparerons ainsi, et par une lutte, certes, fraternelle, l’espace nouveau que nos vœux appellent, l’Espace vivant pour nos êtres vivants."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 112
    "printed_page": "106"
  "translation_ja": "私たちもその人のように、真摯に自分の信じるところを貫こう。その人と同じように、たいまつに火を供給する源を大切に守ろう。ただし炎は高々と掲げ、はっきりとした証しにしよう。どこにいても、どんな場所を自分で選び取ったとしても、そこにいる人々と一緒に、その炎で空間を照らそう。炎は今まで知らなかった光を呼び覚まし、隠れていたものを示す影を落とす。そうして私たちは、争いではあっても仲間として力を尽くし、私たちが願い求める新しい空間を、生きている私たちのための生きた空間を、用意することになる。"
  "translation_status": "reviewed"
- "id": "appia-0214"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour conquérir la flamme de la vérité esthétique nous avons dû éteindre sur nos pas les flambeaux mensongers d’une culture artistique mensongère; maintenant, c’est notre feu à nous — à nous tous — qui veut rallumer ces flambeaux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 112
    "printed_page": "106"
  "translation_ja": "美の真理の炎を手に入れるため、私たちは行く先々で、偽りの芸術文化が掲げる偽りのたいまつを消してこなければならなかった。いま、そのたいまつにもう一度火をともそうとするのは、私たちみなの火である。"
  "translation_status": "reviewed"
- "id": "appia-0215"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ne les abandonnons pas à leur existence fumeuse, et pitoyable, après tout. Notre seul droit, désormais, est celui d’éclairer, et non d’abandonner. Si nous voulons être heureux ensemble, il nous faut, tout d’abord, souffrir en commun. Car tel est, nous l’avons vu, le principe essentiel de l’art, et à plus forte raison de l’art vivant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 112
    "printed_page": "106"
  "translation_ja": "くすぶるばかりの、結局は哀れなありさまに、あのたいまつを放っておくまい。これから私たちに認められるのは、照らすことだけであって、見捨てることではない。ともに幸せになりたいなら、まず苦しみをともにしなければならない。すでに見たように、それが芸術の根本原理であり、生きた芸術については、なおさらそうなのだから。"
  "translation_status": "reviewed"
- "id": "appia-0216"
  "section_id": "flame"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "De nos jours, l’art vivant est une attitude personnelle, qui doit aspirer à devenir commune à tous. C’est pour cela que nous devons conserver en nous cette attitude, partout où la vie nous rassemble; l’abandonner, reste la seule compromission qui nous soit interdite."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 112
    "printed_page": "106"
  "translation_ja": "今日、生きた芸術は個人の態度である。それは誰もが分かち持つ態度となることを目指さなければならない。だからこそ、人生が私たちを引き合わせるどの場所でも、この態度を自分のうちに保つ必要がある。それを手放すことこそ、私たちに許されないただ一つの妥協である。"
  "translation_status": "reviewed"
- "id": "appia-0217"
  "section_id": "drawings"
  "kind": "heading"
  "origin": "source"
  "source_text": "DESSINS"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"

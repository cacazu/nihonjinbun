  "translation_ja": "観客も聴衆もいなくても完全に存在できる作品は、生きた芸術作品だけだとすでに述べた。観衆なしに存在できるのは、観衆をすでに暗にその内に含むからである。そしてこの作品は一定の持続のうちに生きられ、作品を生きる人々、すなわち演じる者であり創る者でもある人たちの活動だけで、完全な存在を得る。自分から進んでそれを確かめ、見つめに来たとしても、私たちは何も付け加えない。それを自覚しなければならない。芸術家にとっては大切で、どんな芸術作品を前にしても自分自身の分として求める、一人ひとりがその人なりに関わるという働きは、ここではもう私たちには求められない。だがその一方で、生きた芸術は、私たちの劇場の観客のように、生命を失ったかのような受け身でいることも許さない。それでも生きた芸術の生命に加わるには、何をすればよいのだろう。それにどう向き合えばよいのだろう。まず、それに向き合う側に立っていると思わないことだ。生きた芸術は、誰かの前に示されるものではない。このことはもう知っている。残るのは、それを身に感じることだ。どうやってか。近づけないものと思って、そっぽを向くのか。そうはできない。それが存在する瞬間から、私たちはそれとともに、その中にいるからだ。そこに入ることを拒むのは、自分自身を否定することになる。あいにく私たちは、社会生活でいくらでもそうしているが。せめてこれほど奇跡的な花が開くのを、目の前で眺めるだけで終わりにすまい。大きな実験を試みよう。作品を創る人々に、自分たちも仲間に入れてもらうよう、頼もう。その人々はきっと、私たちの中まで神々しい火花を運ぶ、何らかの絆を探してくれる。作品の中で共同作業に加わる分がどんなに小さくても、私たちは作品とともに生き、自分たちが芸術家であることを発見するだろう。"

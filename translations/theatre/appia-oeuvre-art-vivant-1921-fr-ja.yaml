  "source_text": "Cela nous amène aux principes, inévitables, des sacrifices et des compensations. Nous connaissons déjà les avantages considérables que trouve le peintre dans l’immobilité de son œuvre ; mais nous n’avons pas encore observé de quelle nature seront les sacrifices imposés à l’art scénique (et dramatique) par la mobilité, et quelles en pourront être les compensations. Commençons par les sacrifices. Tout d’abord il n’est plus question de choisir un instant spécial, — un instant de choix, — comme le font le peintre et le sculpteur ; le mouvement est une succession ; nous pouvons bien choisir la succession, mais non pas l’arrêter à une minute précise. (Voir page 23 au sujet du tableau vivant.) Dans une minute précise, le peintre enferme le contexte du geste qu’il choisit; par contre si l’on interrompt la succession des mouvements, l’attitude qui reste immobilisée est bien le résultat du mouvement précédent et la préparation de celui qui va suivre, mais elle ne les contient qu’en puissance; elle ne les exprime pas effectivement comme le peintre en a le pouvoir. Cette interruption est arbitraire; son caractère est fortuit; par elle le mouvement sort un instant du domaine de l’art. Or, c’est pourtant le principe d’immobilité qui donne à la peinture son caractère achevé, sa perfection ; l’art vivant doit donc renoncer à cette perfection, et, pour la couleur, le sacrifice est très sensible. Si le mouvement devenait mécanique, l’on pourrait à la rigueur s’imaginer une fixation assez minutieuse des éléments de l’expression pour qu’elle pût prétendre à un semblant de perfection. Le sacrifice serait alors de renoncer à l’art, ce qu’aucune compensation ne nous rendrait. Et, pourtant, il est de grands artistes qui, par le même chemin que nous venons de parcourir, en sont arrivés aux marionnettes articulées, et les ont adoptées. Leur désir de se trouver seuls devant la scène, comme le peintre dans son atelier, a prévalu ! C’est excusable, peut-être. Pourtant, comment s’imaginer une humanité corporelle vivante qui puisse à la longue se contenter d’un art dramatique automatisé? Ne serait-ce pas nous imposer l’obligation d’être encore plus passifs que nous ne le sommes déjà au théâtre? Ou bien, ces artistes veulent-ils, par là, nous demander, à nous spectateurs, une continuelle animation des personnages, activité qui n’aurait pourtant rien de commun avec celle que toute œuvre d’art requiert de nous, puisque l’art dramatique est, avant toute chose, un art de la vie, et que c’est justement sur la représentation de cette vie, donnée comme point de départ, que nous avons à opérer une synthèse?"
  "source_languages":

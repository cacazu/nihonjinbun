  "origin": "source"
  "source_text": "Voulons-nous représenter sur la scène un paysage avec des personnages? Si oui, nous aurons bien un paysage, peut-être, mais sans rapport possible avec les personnages; ce sera un paysage d’une part, des personnages de l’autre. Voulons-nous des personnages dans un paysage précis, nouvelle impossibilité: ils seront devant de la peinture, mais ne sauraient être dedans ! Ou bien, sera-ce un style particulier de constructions, une rue historiquement précise? Cette rue sera nécessairement en grande partie peinte sur toiles verticales, et l’acteur se promènera devant cette peinture et non pas dans la rue. Si pourtant elle était construite et entièrement agencée à trois dimensions, (ce qui serait, dans tous les cas possibles, un luxe disproportionné au but proposé), l’architecture précise mais sans consistance et sans poids, sera mise en contact avec un corps vivant qui possède l’un et l’autre.*"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "print"
    "precision": "page"
    "pdf_page": 56
    "printed_page": "50"
  "translation_ja": "風景とその中の人物を、舞台上に表したいとしよう。風景そのものは出せるかもしれない。だが、人物とそれを結びつけることはできない。片方に風景、もう片方に人物があるだけだ。人物をある特定の風景の中に置きたいのか。それもできない。人物は絵の前には立てるが、中には入れないからだ。それとも特定の様式の建物、ある時代を正確に写した通りか。その通りもどうしても大半は立てた布に描かれることになり、俳優は通りの中ではなく、絵の前を歩く。もし通りを実際に立体として隅々まで組み上げても、どんな場合でもねらいに比べて贅沢にすぎるし、正確ではあっても実体も重みもない建築が、その両方を備えた生きた身体に触れることになる。*"
  "translation_status": "reviewed"

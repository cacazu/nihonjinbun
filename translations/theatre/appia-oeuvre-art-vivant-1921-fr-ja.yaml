    "printed_page": "59"
  "translation_ja": "ある性格を描き、展開するのに三百頁の本を一冊必要としたのに、それを舞台にのせる。私たちの劇場で見慣れた、とんでもないことの一つである。"
  "translation_status": "reviewed"
- "id": "appia-0131"

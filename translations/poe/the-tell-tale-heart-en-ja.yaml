    "translation_ja": |-
      私はほほえんだ。――私に何を恐れることがある？　三人に、ようこそおいでくださいました、と言った。悲鳴なら、夢を見て私があげたのです、と。老人は今、田舎に出かけて留守だとも話した。客人たちを家じゅう案内した。お調べください、どうぞよくお調べください、と勧めた。最後に老人の寝室へ連れていった。大切な品々も無事で、手を触れた跡もないのを見せた。自信に気をよくした私は、椅子を運び入れ、さぞお疲れでしょう、ここでお休みくださいと勧めた。何もかもまんまとやりおおせた。そう思うと途方もなく気が大きくなって、私は自分の椅子を、殺された人の亡骸が眠るまさにその真上に据えた。
    "translation_status": "reviewed"

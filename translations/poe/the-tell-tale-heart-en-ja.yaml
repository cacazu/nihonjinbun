    "translation_ja": |-
      それから寝室の床板を三枚はがし、根太と根太のあいだにすべてを納めた。そして板を元に戻した。それもじつに巧みに、じつに抜け目なく戻したので、人間の目には――あの人の目にさえ――どこがおかしいか見破れはしなかったろう。洗い落とすものなど何もなかった。しみひとつ――血の斑点ひとつ、どこにもなかった。そんなへまをする私か。全部たらいで受けておいたのだ――は！　は！

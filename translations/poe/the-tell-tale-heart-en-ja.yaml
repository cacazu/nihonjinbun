    "translation_ja": |-
      この仕事を終えたのは四時だった。まだ真夜中のように暗かった。時を告げる鐘が鳴ると、通りに面した戸をたたく音がした。私は軽い心で下りていって戸を開けた。――今さら私に何を恐れることがある？　三人の男が入ってきて、このうえなく丁重な口ぶりで、警察の者だと名乗った。夜中に悲鳴を聞いた近所の人がいた。何かよからぬことがあったのではという疑いが生じ、警察に届けがあり、この家を調べるよう三人に命が下ったという。
    "translation_status": "reviewed"

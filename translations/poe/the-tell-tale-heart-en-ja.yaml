    "translation_ja": |-
      警官たちは納得した。私の物腰を見て安心したのだ。私自身、不思議なくらいくつろいでいた。三人は腰を下ろし、世間話をした。私は明るく受け答えをした。だが、ほどなく顔から血の気が引いていくのを感じ、帰ってくれればいいのにと思った。頭が痛くなり、耳鳴りがする気がした。それでも三人は座ったまま、まだ話していた。耳鳴りがはっきりしてきた。――いつまでもやまず、いよいよはっきりしてきた。その感じを振り払おうと、私はますます気さくにしゃべった。それでも音はやまず、ますますくっきりしてきて――とうとうわかった。鳴っているのは私の耳の中ではなかった。

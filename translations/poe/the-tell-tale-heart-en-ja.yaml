    "translation_ja": |-
      言ったはずだ、あなたが狂気だと思い違いしているのは、感覚が鋭すぎるだけのことだと。――さてそのとき、耳に届いたのは、低く、鈍く、せわしない音だった。懐中時計を綿にくるんだときのような音だ。この音もよく知っていた。老人の心臓の鼓動だ。太鼓の連打が兵士を奮い立たせるように、その鼓動は私の怒りをかき立てた。
    "translation_status": "reviewed"
    "source_alignment":

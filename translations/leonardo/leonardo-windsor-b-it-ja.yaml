  "source_text": "Tutte le vene e arterie nascano dal core; e la ragione è che la maggiore grossezza, che si trovi in esse vene e arterie, è nella congiunzione, che esse hanno col core; e quanto più si removano dal core, più si assottigliano e si dividano in più minute ramificazioni."
  "source_languages":

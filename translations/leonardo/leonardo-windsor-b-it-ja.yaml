  "translation_ja": "肋骨部を図示するには、まず肋骨だけをむき出しにし、間の空間を開けて示さなければならない。次に、肋骨の側面に結びつき、肋骨どうしを鎖のようにつなぐ筋を示す。その次に、肋骨の上に織り重なり、肋骨を広げたり狭めたりする運動に役立つ筋を示す。さらに、先に述べた筋の上をさまざまな向きに横切り、いろいろな運動に役立つ、ほかの筋を示す。"

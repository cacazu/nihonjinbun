  "translation_ja": "別の筋肉を露わにするためにどの筋肉を取り除こうとも、いかなる肢体の輪郭も決して変えてはならないことを覚えておけ。また、取り外す筋肉の端が、その筋肉を剝がす肢体の一部分の境界になっている場合には、その筋肉を切り離したため失われた肢体の輪郭を、細かく打った点で示さなければならない。これは、描写する肢体が、部分を取り去ったために奇怪なものにならないようにするためである。さらに、こうすると全体についての理解が深まる。ある部分を除いたとき、その部分が除かれた場所の真の形を、全体のなかに見ることができるからである。"

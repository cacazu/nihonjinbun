  "translation_ja": "b a cは脾臓から肝門まで伸び、胃の後ろを通る静脈である。aからは、腸を覆う網の中で枝分かれする静脈と動脈が出る。すなわちaから二本の静脈が出て、胃底の下を通り、一方は後方で肋骨と胃の間を、他方は前方を通る。そして述べたように、後方の大網と前方の大網の中で分枝してゆく。図の示すとおり、前方のものは二重である。静脈が行うことは、動脈も行うと認められる。"

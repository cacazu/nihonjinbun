  "translation_ja": "さらに、肺と横隔膜の間で圧迫されたその空気は、心臓を包む袋に当たる。そしてその袋の底にある少量の液が上がり、心臓全体を濡らす。こうして絶えず濡らすことで、熱くなった心臓を潤し、激しく動くために乾いてしまわないようにする。"

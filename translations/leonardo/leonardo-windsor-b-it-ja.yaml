  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 521
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 522
  "translation_ja": |-
    唇を締める筋（すじ）について。
    唇が縮むときの運動は二つある。一つは、一方の唇を他方へ押しつけるようにして閉じ、締める運動である。第二は、口の長さを狭める、つまり短くする運動である。一方の唇を他方に押しつけて締めるものは、（置かれている、最後のものへ向かう）口の最も奥の臼歯の上から出る。これらの引く力は非常に大きいため、歯を少し開いておくと、唇を歯の内側へ引き込む。それは、両側から筋 r によって引かれた口 g h に示されているとおりである。
  "translation_status": "draft"

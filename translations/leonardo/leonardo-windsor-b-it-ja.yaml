  "translation_ja": |-
    次に、子供が生まれた後、ほかよりもよく成長するのはどの部分かを記述せよ。そして一歳の子供の寸法を示せ。
    次に成長した男と女、およびその寸法、体質の性状、色、顔貌を記述せよ。
    その後、人がいかに静脈、神経、筋肉、骨から構成されるかを記述せよ。これは本の最後に行うこと。
  "translation_status": "draft"

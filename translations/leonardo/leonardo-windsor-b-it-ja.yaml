  "source_text": "Tante sono le ramificazioni de' nervi, quanti sono li muscoli, nè possano essere più, nè meno, perchè tali muscoli sol si rattraggano o distendano per causa d'essi nervi, dalli quali li muscoli ricevano il sentimento loro. E tanto son le corde motrici de' membri, quanto son li muscoli."

  "translation_ja": |-
    口の筋肉とその側方の筋肉の運動について。
    唇を構成する筋肉が、それに結びついた側方の筋肉を動かすことは多く、側方の筋肉が唇を動かすことも同じように多い。［判読不明］できない。筋肉の働きは引くことであって、押すことではないからである。ただし、生殖器と舌は例外である。口が短くなるときにその側方の筋肉も等しく引き寄せられるならば、それらの側方の筋肉が口を引き戻さないかぎり、口は自分自身では初めの長さに伸び戻らない。また、［判読不明］側方の筋肉が、［笑いを生じさせる際に、と暫定的に読める］口の長さを伸ばすならば、これらの側方の筋肉は、口が短くなることによって、［笑いを解消する際に、と暫定的に読める］後ろへ引き戻されなければならない。
  "translation_status": "draft"

  "section_id": "B-014v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ma se tal polmone starà pieno tutto d'aria, e che tu non li dia esalazione (per bocca) di sopra, allora il diaframma sta tirato e duro, e resiste al montare in alto le intestine, premute dalli muscoli transversali; onde, per necessità, le intestine sgombrano, per lo intestin diretto, gran parte della superfluità, che in esse si rinchiude."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"

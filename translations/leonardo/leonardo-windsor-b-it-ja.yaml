  "translation_ja": |-
    歯の性質、その位置、およびその運動の支点からの距離について。
    運動の中心から遠い歯ほど、噛み締める力は弱い。たとえば歯の運動の中心を、顎の支点aとするなら、歯がその中心aから遠いほど、噛み締める力は弱いと言える。したがってd eは歯b cより噛み締める力が弱い。このことから、次の系が導かれる。すなわち、運動の中心、あるいは運動の支点に近い歯ほど力が強い。つまり歯b cの噛み締める力は、歯d eより強い。
  "translation_status": "draft"

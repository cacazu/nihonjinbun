  "translation_ja": "この下のものは、子宮に包まれた動物の第三と第四の被膜を含む。これらの被膜は（肉質の小薔薇状体によって）結合している、すなわち接し合っている。ここにある上のものは、互いに入り込み、ひっつき虫の実同士のように付着するこれらの肉質の小薔薇状体を介して、このものと結合する。出生時には、子はこれら二つの被膜を、この薔薇状体の厚さの半分とともに持って出てゆき、残り半分は母の子宮内に留まる。その後、子宮が縮むと、それらは再び結びつき、互いの側面を付着させるので、かつて分離していたようにはまったく見えなくなる。生まれる動物に接する被膜には、これらの肉質の薔薇状体は一つもない。"

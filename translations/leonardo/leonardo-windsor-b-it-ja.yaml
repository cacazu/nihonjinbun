  "source_text": |-
    Delli muscoli che movan li labri della bocca.
    Li muscoli, che movan li labri della bocca, son più numerosi nell'omo, che in alcuno altro animale; e questo ordine necessita in lui, per le molte operazioni nelle quali al continuo esse labra s'esercitano, come nelle 4 lettere dell'alfabeto b f m p, come nel fischiare, nel ridere, nel piagnere e simili; poi nelli storcimenti strani, li quali usano li buffoni ne 'l contraffare li volti.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"

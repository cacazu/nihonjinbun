  "translation_ja": |-
    霊について。
    この面の裏で、ここまで、霊の定義は（結びついていない名前）身体に結びついた力であると述べた。霊は自分だけでは存立できず、いかなる位置移動も行えないからである。もし霊は自ら存立すると君が言うなら、それは元素の中ではありえない。霊が物体をもたない量であるなら、そのような量は真空と呼ばれるが、自然には真空がないからである。仮にあったとしても、その真空の生じた元素が流れ込むことによって、ただちに満たされてしまう。

    Se lo spirito, avendo preso corpo d'aria, si po per sè movere, o no.
    Impossibile è che lo spirito, infuso 'n una quantità d'aria, possa movere essa aria; e questo si manifesta per la passata, dove dice: lo spirito levifica quella quantità dell'aria, nella quale esso s'infonde; adunque tale aria si leverà in alto sopra l'altra aria, e sarà moto fatto dall'aria, per la sua levità, e non per moto volontario dello spirito; e se tale aria si scontra nel vento, per la 3a di questo, essa aria sarà mossa dal vento, e non dallo spirito in lei infuso.
  "source_languages":

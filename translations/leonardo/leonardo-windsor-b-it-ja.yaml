  "translation_ja": "［欄外］健康に暮らしている老人も、栄養の不足によって死ぬ。これは、それらの血管の壁が厚くなるため、腸間膜の血管の通路が絶えず狭くなり、次々に毛細血管にまで及ぶからである。毛細血管は、最初に完全に閉じてしまう血管である。このため老人は若者よりも寒さを恐れ、非常な高齢者の皮膚は木、あるいは乾いた栗の色となる。その皮膚はほとんどまったく栄養を奪われているからである。"
  "translation_status": "draft"
- "id": "B-010v-006"
  "section_id": "B-010v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "E tale tonica di vene fa nell’omo come nelli pomeranci, alli quali tanto più ingrossa la scorza e diminuisce la midolla, quanto più si fanno vecchi. E se tu dirai che lo ingrossamento del sangue non corre per le vene, questo non è vero, perchè il sangue non ingrossa nelle vene, perchè al continuo more e rinasce."
  "source_languages":

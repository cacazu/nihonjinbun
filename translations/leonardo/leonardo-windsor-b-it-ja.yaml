  "translation_ja": "肺について。これは他のもの、すなわち第一の動者である心臓によって動かされる。心臓は収縮する際に血管を引き寄せ、それらを通じて温められた空気を肺へ返し、肺を開く。この肺は、意志によって、あるいは思索にふけりすぎたための忘却、すなわち忘れることによって、止めることができる。その間、心臓は、自らが肺へ与えた温かい空気を肺から引き戻す。しかし、この働きを何度も行うことはできない。新しい空気によって冷やされなければ、窒息してしまうからである。"
  "translation_status": "draft"

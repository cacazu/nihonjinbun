  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 497
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 498
  "translation_ja": "もし、膀胱が満たされるほど孔が固く閉じるのだと君がいうなら、こう答えよう。そのような壁を押し閉じる尿によってこれらの孔が閉じられるなら、下ってくる別の尿が入るのを妨げることになる。しかしそれは、先に述べた第四命題によって起こりえない。その命題は、細く高い尿柱のほうが、膀胱内にある低く幅広い尿よりも強い力をもつ、と述べている。"
  "translation_status": "draft"

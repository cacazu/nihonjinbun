  "source_text": |-
    Della forza de' muscoli.
    Se fia tirato in lungo qualunche muscolo si sia, piccola forza rompe la sua carnosità; e se sarà tirato in lungo li nervi del sentimento, piccola potenzia li sveglie delli muscoli, ove la lor ramificazion si contesse, spande e consuma; e 'l simile si vede fare alla vesta nervosa de le vene e arterie, che con essi muscoli si mistano.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 61
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 62
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 63
  "translation_ja": |-
    筋肉の力について。
    どの筋肉であれ長さの方向に引き伸ばすなら、わずかな力でその肉質は裂ける。また感覚神経を長さの方向に引けば、わずかな力で筋肉から引き抜かれる。その筋肉の中では、神経の枝が織り込まれ、広がり、尽きている。それらの筋肉と入り混じる静脈や動脈の、筋張った被膜にも同じことが起こるのが見られる。
  "translation_status": "draft"
- "id": "B-003v-002"
  "section_id": "B-003v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Che è adunque causa di tanta forza di braccia o di gambe, qual si vede nelle operazioni di qualunche animale? Altro non si po dire che la pelle, che li veste; la quale, poi ch'e nervi del sentimento ingrossano li muscoli, essi muscoli si raccortano, e tiransi dirieto le corde, in che li loro stremi si convertano; e in tale ingrossamento essi empiano la pelle, e la fanno tirata e dura; e non si po dilungare, se li muscoli non s'assottigliano; e, non s'assottigliando, essi son causa di resistenzia, e di fare forte la predetta pelle, nella quale li muscoli accresciuti fanno ufizio di conio."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 61
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 62
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 63
  "translation_ja": "それでは、あらゆる動物の働きに見られるような、腕や脚のあれほどの力の原因は何か。それらを覆う皮以外とは言えない。感覚神経が筋肉を太くすると、その筋肉は縮み、その末端が変じた索を後ろへ引く。このように太くなると筋肉は皮の内を満たし、皮を張らせて硬くする。筋肉が細くならないかぎり、皮は伸びることができない。筋肉は細くならないことによって抵抗の原因となり、前述の皮を強くする。その内側で、増大した筋肉は楔の役割を果たす。"
  "translation_status": "draft"

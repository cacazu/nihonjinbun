    [Fig. 185:] b n m.
    Il vacuo dell'osso della guancia ha similitudine, per profondità e per larghezza, col vacuo che riceve dentro a sè l'occhio, e per capacità è molto simile a esso, e riceve dentro a sè vene, per li busi m, i quali discendano dal cervello, passando per lo colatorio, che scarica la superfluità delli omori della testa in nel naso. Altri busi evidenti non si truova in lui del vacuo disopra, che circunda l'occhio. Il buso b è dove la virtù visiva passa al senso, il buso n è donde le lagrime salgano dal core all'occhio, passando per lo canal del naso.
  "source_languages":

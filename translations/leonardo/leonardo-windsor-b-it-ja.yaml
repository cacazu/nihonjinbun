  "section_id": "B-024r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "(La natura fa li denti men penetrabili nel cibo e di più grosse punte, li quali son di maggiore potenzia.) Adunque li denti b c aran le lor punte tanto più ottuse, quanto essi saran mossi da maggiore potenzia; e, per questo, b c, denti, saran più ottusi, a proporzione delli denti d e, quanto essi saran più vicini al polo a delle mascella a d e a e; e, per questo, la natura ha fatti li mascellari di grosse fronti, atte a macinare il cibo, e non penetrarlo, nè tagliarlo; e dinanti ha fatti li denti taglienti e penetrabili, e non atti a macinare esso cibo, e ha fatto le maestre infra li mascellari e li denti taglienti."

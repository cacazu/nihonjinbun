  "translation_ja": "そして、このような血管の被膜は、人間において、オレンジにおけるのと同じことをする。オレンジも古くなるほど皮が厚くなり、内部の果肉が減る。もし君が、濃くなった血液は血管を通って流れないと言うなら、それは真実ではない。血液は血管の中で濃くはならないからである。血液は絶えず死に、また生まれるからである。"
  "translation_status": "draft"

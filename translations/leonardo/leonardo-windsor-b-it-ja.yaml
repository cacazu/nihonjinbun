  "translation_ja": "なぜ老人の血管はたいへん長くなり、かつてはまっすぐだったものも曲がりくねるのか［図58］、また、なぜその壁は、閉じ合わさって血液の動きを妨げるほど厚くなるのか、という問いがある。このことから、老人には病気のない死が生じる。"

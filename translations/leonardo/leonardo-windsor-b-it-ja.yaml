  "translation_ja": "声とは、密な物体に擦りつけられる空気の運動、あるいは空気の中で擦られる密な物体の運動であり、この二つは同じことである。この密なものと疎なものとの摩擦は、疎なものを凝縮し、抵抗するものにする。また、速い疎なものが遅い疎なものの中を進むとき、両者は接触する所で凝縮し、音、あるいはきわめて大きな響きを発する。疎なものが疎なものの中をほどほどの速さで動くと音やざわめきが生じる。空気の中で音を発する大きな炎が、その例である。疎なもの同士が作るきわめて大きな響きは、速い疎なものが静止した疎なものを突き通るときに生じる。たとえば大砲から噴き出した火炎が空気に打ち当たる場合や、雲から出た火炎が稲妻を生じるときに空気を打つ場合である。"

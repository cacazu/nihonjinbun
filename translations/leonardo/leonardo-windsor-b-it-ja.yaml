    血管 m は上へ上がり、頬の骨の下へ入り、眼窩の孔を通って、眼球の下側と、それを支える骨との間を通る。この経路の途中で、その血管は骨を貫き、指幅の半分だけ下がる。そして、前述の眼窩 n の縁の下で骨の表面を貫くと、そこから上昇し始める。（通って）眼の縁に沿ってしばらく溝を刻んで進み、涙点を通る。最後には眉の内側で指二本分の距離を上がり、そこで枝分かれが始まり、頭全体に広がる。
    ［図193］

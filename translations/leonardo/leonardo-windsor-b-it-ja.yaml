  "translation_ja": "海戦が、風に命じ、どんな艦隊でも破壊し沈める暴風を起こす者の海戦に比べられるだろうか。確かに、そのような猛烈な力に命ずる者は諸民族の支配者となり、いかなる人間の知恵も、その有害な力には抵抗できないだろう。地中に隠された宝や宝石も、すべて彼には明らかになる。どんな錠前も難攻不落の要塞も、この降霊術師が望まなければ、誰一人救えない。彼は空中を東から西へ、そして宇宙のあらゆる対向する方角へ、運ばせることができるだろう。"

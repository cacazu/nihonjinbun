    [Fig. 159.]
    Del notrimento che fa la putredine.
    Dico che li stremi delle vene miseraice, le quali attraggano a sè la sustanzia del cibo incluso nelle intestine, essere allargati mediante il calor naturale dell'omo, perchè il caldo disgrega e allarga, e il freddo congrega e restrigne; ma questo non sarebbe abbastanzia, se a esso calor non s'aggiugnessi il fetore, che fa la corruzione del sangue, rimesso dalle arterie in esse intestine, il quale sangue fa in esse intestine non altre menti, che si facci nelle sepolture; il qual fetore allarga le viscere, e penetra in tutte le porosità, e ingrossa e gonfia li corpi in forma di botti; e se tu dicessi che esso fetore pigliassi caldezza ne' corpi, questo non fia confermo ne' corpi gonfiati, coperti di neve, e la potenzia del fetore è molto più agile e multiplicativa che 'l caldo.
  "source_languages":
  - "it"
  "source_locations":

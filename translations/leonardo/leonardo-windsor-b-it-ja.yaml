  "source_text": "Il concorso di tutti i sensi ha sotto sè, per linia perpendiculare, l'uvola, dove si gusta il cibo, a distanzia di 2 dita, e si dirizza sopra la canna del polmone, e sopra il buso del core, per ispazio d'uno piè; e ha sopra sè la giuntura dell'osso del craneo una mezza testa; e ha dinnanzi a sè, per linia (emisperica) orizzontale, il lagrimatoio delli occhi a una terza testa; e dirieto a sè ha la nuca, a 2/3 d'una testa; e ha dai lati i 2 polsi delle tempie, per equale distanzia e altezza."

  "source_text": "Il nervo, ch'è dirieto al ginocchio, b f, ha da destra: c h, la vena che si biforca, e gitta un ramo da sinistra in m e; e da sinistra ha l'arteria a d, che si biforca ancora lei, e gitta un ramo a destra in n h; e questa tal biforcazione fu necessaria, perchè altra via non ci era più brieve che questa, a volere che ogni lato della polpa di tal gamba avessi vena e arteria, cioè nutrimento e vita."

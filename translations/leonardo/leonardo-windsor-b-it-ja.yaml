  "source_text": "Questa disotto contiene la 3ª e la 4ª spoglia dell'animale incluso nella matrice; le quali spoglie sono unite (colle rosette carnose), cioè si toccano, e quella qui di sopra s'unisce con questa, mediante queste rosette carnose, che si frammettano e s'appiccano insieme, come farebbono le lappole infra loro; e, nel nascere, il figliolo ne porta con seco queste 2 spoglie, colla metà della grossezza di queste rose, e l'altra metà resta nella matrice della madre, la qual poi, nel ristrignersi, si ricongiungano insieme, e si appiccano colli loro lati l'un coll'altro, in modo che mai parve che fussin divise; e la spochia, che tocca lo animal che nasce, non ha in sè alcuna d'esse rose carnose."

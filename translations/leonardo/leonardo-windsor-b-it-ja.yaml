  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 324
  "translation_ja": "脊髄の実質は、神経の起始部の中へある距離入り込み、それから孔のある神経がその末端の枝まで続く。この孔を通って感覚が各筋肉へ運ばれる。筋肉は、それをほぐすと分かれる糸の数だけ、ごく小さい別の筋肉から成る。それぞれのごく小さい筋肉は、ほとんど知覚できない薄膜に包まれ、上述の神経の最末端の枝はこの薄膜へと変わる。それらは神経の空洞を通る感覚の要求のたびに従い、自ら引き縮むことで筋肉を短くし、太くする。"
  "translation_status": "draft"

    Dell'ordine del libro.
    Questa opera si debbe principiare alla concezione dell'omo, e descrivere il modo della matrice, e come il putto l'abita, e in che grado lui risegga in quella, e 'l modo dello vivificarsi e cibarsi, e 'l suo accrescimento, e che intervallo sia da un grado d'accrescimento a un altro, e che cosa lo spinga fori del corpo della madre, e per che cagione qualche volta lui venga fori del ventre di sua madre innanti al debito tempo.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 287
  - "source_id": "piumati_1901"

  "translation_ja": "人間の眼の明かり、すなわち瞳孔は、拡大し縮小する際、自らの大きさの半分だけ増減する。夜行性の動物では、その大きさの百分の一を超えて減り、また増える。このことは、夜の鳥であるフクロウの眼に、火のついた松明を近づければ見られるだろう。太陽を見させれば、さらに明らかになる。その時、以前は眼全体を占めていた瞳孔が、一粒のキビほどの大きさに縮むのが見えるからである。このように縮むと人間の瞳孔と同じになり、明るく輝くものは、その時人間に見えるのと同じ色に見える。そして、その動物の脳が人間の脳より小さいだけ、それはいっそう強くなる。したがって、その瞳孔は夜になると人間のものより百倍も大きくなり、人間の百倍の光を見るので、その視力は夜の闇にも打ち負かされない。人間の明かりは大きさを二倍にするだけなので、わずかな光しか見ない。それは、暗すぎる時には飛ばない蝙蝠とほとんど同じである。"
  "translation_status": "draft"

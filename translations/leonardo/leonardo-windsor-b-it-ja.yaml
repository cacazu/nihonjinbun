  "source_text": "Tutto il corpo ha origine dal core, in quanto alla prima creazione; el sangue adunque e le vene e nervi fanno il simile, ancora che essi nervi si vegghino manifesta mente tutti nascere dalla nuca, e remoti dal core, e la nuca essere della medesima sustanzia del cervello, onde essa diriva."

  "translation_ja": |-
    夜行性動物の瞳孔は、夜の暗さが大きいか、さらに大きいかに応じて、大きなものから、いっそう大きなものへと変化してゆく。
    また、これら夜行性動物の瞳孔は、昼の明るさが大きいか、さらに大きいかに応じて、小さなものから、いっそう小さなものへと変化する。
  "translation_status": "draft"
- "id": "B-025r-002"
  "section_id": "B-025r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Per quello ch'è detto, si conclude essi animali notturni essere sempre con equal potenzia di virtù visiva in tutte le varietà di chiarezza o di oscurità, che possa accadere ne' tempi de' giorni e delle notti."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 347
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 348
  "translation_ja": "以上述べたことから、これら夜行性動物は、昼と夜の時間に起こり得る明るさや暗さのあらゆる変化の中で、常に等しい強さの視覚能力を備えていると結論される。"
  "translation_status": "draft"
- "id": "B-025r-003"
  "section_id": "B-025r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    La virtù visiva è tutta per tutta la popilla, e tutta in ogni sua parte.
    Seguita che la metà della popilla vede integral mente l'obbietto, come se essa fussi intera.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 347
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 348
  "translation_ja": |-
    視覚能力は、その全体が瞳孔全体にあり、またその全体が瞳孔の各部分にもある。
    したがって瞳孔の半分でも、それが完全な瞳孔であるかのように、対象をまるごと見る。
  "translation_status": "draft"
- "id": "B-025r-004"
  "section_id": "B-025r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quanto la popilla è di maggiore quantità, di tanta maggior figura e chiarezza vederà il suo obbietto; e così de converso, quanto sarà minore, tanto minore e più oscuro vedrà esso obbietto."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 347
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 348
  "translation_ja": "瞳孔が大きければ大きいほど、その対象をより大きな形で、より明るく見る。また逆に、瞳孔が小さければ小さいほど、その対象をより小さく、より暗く見る。"
  "translation_status": "draft"
- "id": "B-025r-005"
  "section_id": "B-025r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Seguita che, chiudendo un occhio, elli è diminuita per metà la potenzia visiva; e questa prova si fa nè corpi luminosi, come sole, luna e stelle, e ancora 'n un lume o foco."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 347
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 348
  "translation_ja": "したがって片眼を閉じると、視覚の力は半分に減じられる。このことは太陽、月、星など光る物体で、また灯火や火でも確かめられる。"
  "translation_status": "draft"
- "id": "B-025r-006"
  "section_id": "B-025r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Questo diminuire di chiarezza si vedrà sanza serrare l'uno delli occhi; ma in loco di serrarlo, sia interposta la mano o 'l dito dinanzi all'una delle popille, infra l'aria e l'occhio, e vedrai una quantità d'aria colle 2 popille, la qual confinerà coll'aria veduta da una sola popilla, e sarà altrettanto più oscura quella, ch'è veduta da una popilla, che quella ch'è veduta da 2 popille. E la ragione è quella che mostra la figura.
    [Fig. 126.]
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 347
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 348
  "translation_ja": |-
    この明るさの減少は、片方の眼を閉じずとも見ることができる。閉じる代わりに、一方の瞳孔の前、空気と眼の間に、手または指を差し入れよ。すると二つの瞳孔である範囲の空気が見え、その範囲は一つの瞳孔だけで見える空気に接する。一つの瞳孔で見える方は、二つの瞳孔で見える方より、それに応じて暗くなる。その理由は図の示すとおりである。
    ［図126］

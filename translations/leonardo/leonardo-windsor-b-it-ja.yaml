  "translation_ja": "（神経）貫通する索は、働きを担う肢体に命令と感覚を伝える。これらの索は筋肉や筋束の間に入り、それらに運動を命じる。それらは従い、この服従は、しぼむことによって実行される。というのも、膨らむことがそれらの長さを縮め、その後ろに筋（すじ）を引くからである。これらは肢体の細部に織り込まれ、指先に入り込み、その接触の原因を感覚へ伝える。"

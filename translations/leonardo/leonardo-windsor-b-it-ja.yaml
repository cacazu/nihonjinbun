  "translation_ja": "しかし脊髄の話に戻ると、それは二枚の薄膜に包まれている。その一方は脊髄の髄性の実質だけを覆い、椎骨の空洞から出るときに神経へと変わる。他方は神経をその主要な枝とともに覆い、神経の各枝とともに分枝し、こうして脊髄の第二の衣となって、椎骨の骨と脊髄の第一の薄膜との間に介在する。"

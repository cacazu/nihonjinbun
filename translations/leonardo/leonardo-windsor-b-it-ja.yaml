  "translation_ja": "この臍静脈は、子宮内で生じる動物のすべての血管の起源であり、妊娠した雌のどの血管からも起こらない。これらの血管は一本一本、妊娠した女性の血管から完全に隔てられ、分かれているからである。静脈と動脈は対になっており、一方だけで他方を伴わないことはきわめて稀である。ほとんどいつも動脈は静脈の上に見られる。動脈の血は生命精気の通路であり、静脈の血は……を養うものだからである。"
  "translation_status": "draft"

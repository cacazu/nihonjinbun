  "source_text": "Ma, per tornare alla nuca, la quale è involta in 2 panniculi, che l'uno sol veste la sua sustanzia midoliosa della nuca, e, nell'uscire del vacuo delli spondili, si converte in nervo, l'altro veste il nervo, insieme colli sua principal rami, e ramifica insieme con ciascun ramo del nervo, e così si fa seconda vesta della nuca, interponendosi infra l'osso delli spondili e 'l primo pannicolo d'essa nuca."

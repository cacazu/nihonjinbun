  "translation_ja": "最初に形成されることに関していえば、身体全体は心臓から生じる。したがって血液も血管も神経も同じである。ただし、これらの神経はすべて明らかに脊髄から生じ、心臓から離れているように見え、脊髄は、それが由来する脳と同じ組織から成っているように見えるのだが。"

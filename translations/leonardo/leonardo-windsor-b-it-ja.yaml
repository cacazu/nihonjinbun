  "source_text": |-
    Delli moti de' muscoli della bocca e de' sua muscoli laterali.
    Molte son le volte che li muscoli che compongono i labri della bocca movano li muscoli laterali a sé congiunti; e altrettante son le volte che essi muscoli laterali movano li labri d'essa bocca. [Passo non decifrato] non può, perché l'ufizio del muscolo è di tirare e non di spingere, eccetto il membro genitale e la lingua. Ma se il raccortamento della bocca si tira dirieto equalmente li sua muscoli laterali, essa bocca non si ristenderà per sé alla prima lunghezza, se tali muscoli laterali non se la ritirino. E se [lettura incerta] muscoli laterali astendon la lunghezza della bocca alla [creatione?] del riso, egli è necessario che i detti muscoli laterali sieno tirati indrieto dal raccortamento della bocca nella [distruzione?] del riso.
  "source_languages":

    "precision": "page"
    "pdf_page": 140
  "translation_ja": "血管が老いるにつれ、その枝分かれの中でまっすぐな形が失われ、年を重ねて老齢になるほど、ますます曲がりくねり、すなわち蛇行し、その外皮も厚くなる。"
  "translation_status": "draft"

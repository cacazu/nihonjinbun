    "precision": "page"
    "pdf_page": 181
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 182
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 183
  "translation_ja": "精巣、交合の証人。これらは自らの中に勇気を宿す。すなわち、動物の気概と獰猛さを増すものである。そのことは去勢された動物において、経験上明らかに示される。雄牛、雄豚、雄羊、雄鶏はきわめて獰猛な動物だが、この精巣を取り去られると、非常に臆病になる。雄羊が去勢羊の一群を追い立て、雄鶏が多くの去勢鶏を逃げ散らせるのを見るとおりである。私は以前、雌鶏が同じことをするのも見た。また去勢牛も同様である。"
  "translation_status": "draft"
- "id": "B-013r-008"
  "section_id": "B-013r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Della verga. Questa conferisce collo intelletto umano, e alcuna volta ha intelletto per sè, e ancora che la volontà dell’omo lo voglia provocare, esso sta ostinato, e fa a suo modo, alcuna volta movendosi da sè, sanza licenza o pensieri dell’omo, così dormiente, come desto, fa quello desidera; e spesso l’omo dorme e lui veglia, e molte volte l’omo veglia e lui dorme; molte volte l’omo lo vole esercitare, e lui non vole; molte volte lui vole, e l’omo gliel vieta. Adunque e’ pare che questo animale abbia spesso anima e intelletto separato dall’omo, e pare che a torto l’omo si vergogni di nominarlo, non che di mostrarlo, anzi sempre lo copre e lo nasconde, il qual si doverebbe ornare e mostrare con solennità, come ministro."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 181
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 182
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 183
  "translation_ja": "陰茎について。これは人間の知性と通じ合うが、ときにはそれ自身の知性をもっている。人間の意志がこれを刺激しようとしても、頑として従わず、自分の流儀で振る舞う。ときには人間の許しも考えもなしに自ら動き、眠っていようと目覚めていようと、望むことを行う。しばしば人間が眠っているのにこれは目覚めており、またしばしば人間が目覚めているのにこれは眠っている。人間がこれを働かせようとしても、これは望まないことが多い。これが望むのに、人間が禁じることも多い。したがって、この動物はしばしば人間とは別の魂と知性をもっているように見える。また、人間がこれを示すどころか名を口にすることさえ恥じ、いつも覆い隠すのは、不当なことに思われる。本来これは、務めを果たす者として飾り、厳かに示されるべきなのである。"
  "translation_status": "draft"

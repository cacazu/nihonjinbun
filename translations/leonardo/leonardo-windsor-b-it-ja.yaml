  "source_text": |-
    Delli nervi che stringan le labbra.
    Due sono li moti che fan le labbra nel suo restrignersi, de' quali l'uno è quel che serra e strigne l'un labbro contro all'altro, il 2° moto è quello che ristrigne, over raccorta la lunghezza della bocca; ma quel che strigne l'un labbro contro all'altro, (è posto, va inverso li ultimi) n'esce sopra li ultimi mascellari della bocca, li quali, nel loro tirare, son di tanta potenzia, che, tenendo alquanto li denti aperti, essi tireranno li labbri della bocca dentro a' denti, come si dimonstra nella bocca g h, essendo tirata dalli muscoli r per li sua lati.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 519
  - "source_id": "piumati_1901"
    "precision": "page"

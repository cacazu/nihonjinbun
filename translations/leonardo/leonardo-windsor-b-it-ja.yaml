  "translation_ja": "共通感覚と呼ばれる。魂は、多くの人が信じたように身体の至る所にその全体があるのではなく、この部分にその全体がある。もし魂の全体が至る所に、また各部分のそれぞれにあるなら、感覚の器官をすべて一つの場所に集まるようにする必要はなかったからである。むしろ眼がその表面で感覚の働きを果たせば足り、見たものの像を視神経の道を通して感覚へ送る必要はなかった。前述の理由によれば、魂は眼のその表面でそれらを認識できたはずだからである。"

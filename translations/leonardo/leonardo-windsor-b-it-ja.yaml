  "source_text": "[In margine:] Li vecchi che vivano con sanità, moiano per carestia di nutrimento; e questo accade perchè elli è ristretto al continuo il transito alle vene miseraice, per lo ingrossamento della pelle d’esse vene, successiva mente, insino alle vene capillari, le quali son le prime, che intera mente si richiudano; e da questo nasce che li vecchi teman più il freddo che li giovani, e che quelli che son molto vecchi hanno la pelle di color di legno, o di castagna secca, perchè tal pelle è quasi al tutto privata di nutrimento."

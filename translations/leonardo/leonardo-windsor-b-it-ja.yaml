  "source_text": "Il colon e l’altre interiora ne’ vecchi molto si ristringano, e ho trovate loro pietre nelle vene, che passan sotto le forcole del petto, le quali eran grosse come castagne, di colore e forma di tartufi, over di loppa o marogna di ferro, le quali pietre eran durissime, come essa marogna, e avean fatti sacchi, appiccati alle dette vene, a modo di gozzi."

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Per la qual cosa natura provvide colli muscoli del diaframma, li quali (alzano e) abbassano esso diaframma nel suo concavo mezzo; e lo rialzare nasce dal premuto vento, incluso ne le intestine; il qual vento nasce dalla disseccazione delle fecce, che vaporano; e se le spalle alzate tengano le coste alte, mediante il muscolo b, allora il diaframma, semplicemente movendosi, mediante li sua muscoli, fa l'ufizio dello aprire (e serrare) il polmone; e le premute intestine, col condensato vento, che in lor si genera, rispingano il diaframma in alto; il qual diaframma prieme il polmone, e ne scaccia l'aria."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 233
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 234
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 235
  "translation_ja": "そのため自然は、横隔膜の筋によって備えをした。これらの筋は、そのくぼんだ中央で横隔膜を（上げ、そして）下げる。再び上がるのは、腸内に閉じこめられた気体が圧迫されることから生じる。その気体は、糞が乾燥して蒸気を発することから生じる。そして、上がった肩が筋 b を介して肋骨を高く保っている場合、横隔膜は自身の筋によって動くだけで、肺を開く（そして閉じる）役目を果たす。圧迫された腸は、その中で生じる圧縮された気体とともに横隔膜を上へ押し返し、横隔膜は肺を押して、その中の空気を追い出す。"
  "translation_status": "draft"

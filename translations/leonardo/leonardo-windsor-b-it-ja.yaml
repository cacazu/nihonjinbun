  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 397
  "translation_ja": |-
    口の唇を動かす筋肉について。
    口の唇を動かす筋肉は、人間において、ほかのどんな動物よりも数が多い。人間にこの仕組みが必要なのは、唇が絶えず多くの働きを行うからである。たとえばアルファベットの四文字 b f m p を発音し、口笛を吹き、笑い、泣き、その他同様のことをし、さらに道化が顔をまねるときに用いる奇妙な歪め方をする。
  "translation_status": "draft"
- "id": "B-029r-002"
  "section_id": "B-029r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Qual muscolo è quel che strigne la bocca in modo che li termini sua laterali si fan vicini.
    [Fig. 136:] a b.
    Li muscoli, che stringano la bocca, diminuendo la sua lunghezza, sono nelle medesime labra; anzi, esse labra sono li propri muscoli, che chiudano sè medesimi.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 393
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 397
  "translation_ja": |-
    口を締め、その左右の端を近づけるのは、どの筋肉か。
    ［図136］a b。
    口を締めてその長さを縮める筋肉は、唇そのものの中にある。むしろ唇そのものが、自分自身を閉じる筋肉なのである。
  "translation_status": "draft"

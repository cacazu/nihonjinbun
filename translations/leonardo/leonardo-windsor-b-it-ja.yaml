  "source_text": "La dimostrazione del costato richiede prima le semplici coste, innude, colli spazi traforati; di poi li muscoli, che si congiungano alli lor lati, colli quali insieme s'incatenano; poi li muscoli, che sopra lor si tessano, servendo alli moti dilatativi e restrettivi d'esse coste; oltre a di questo li altri muscoli, intraversati sopra li anti detti muscoli, per diversi aspetti, servendo a vari moti."

  "source_text": "Farai in queste sorte di dimonstrazioni li veri dintorni delli membri, con una sola linia; e in mezzo situa li sua ossi, colle vere distanzie dalla sua pelle, cioè pelle del braccio; e poi farai le vene, che sieno intere in campo transparente; e così si darà chiara notizia del sito dell’osso, vena e nervi."

  "translation_ja": |-
    本の構成について。
    この著作は人間の受胎から始めるべきである。子宮のありさま、子供がその中にどのように住まい、どのような状態でそこに位置するか、どのように生命を得て養われるか、その成長、および成長の一段階から次の段階までの間隔を記述せよ。また、何が子供を母体の外へ押し出すか、なぜ時として定められた時期より前に母の腹から出てくるのかを記述せよ。
  "translation_status": "draft"

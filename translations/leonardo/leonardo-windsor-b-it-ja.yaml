  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 148
  "translation_ja": "この老人は、死ぬ数時間前、自分は百歳を過ぎており、衰弱以外には身体のどこにも不調を感じないと私に言った。そしてそのまま、フィレンツェのサンタ・マリア・ノーヴァ病院の寝台に腰掛けていたところ、ほかには何の動きも、何らかの異変の兆しも示すことなく、この世を去った。"
  "translation_status": "draft"
- "id": "B-010v-004"
  "section_id": "B-010v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "E io ne feci notomia, per vedere la causa di sì dolce morte, la quale trovai venire meno per mancamento di sangue e arteria, che notria il core e li altri membri inferiori, li quali trovai molto aridi, stenuati e secchi; la qual notomia discrissi assai diligente mente e con gran facilità, per essere privato di grasso e di omore, che assai impedisce la cognizione delle parti. L’altra notomia fu d’un putto di 2 anni, nel quale trovai ogni cosa contraria a quella del vecchio."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"

  "source_text": "Questa vena umbelicale è origine di tutte le vene dell'animale, che si genera nella matrice, e lei non ha origine da nessuna vena della femina gravida, perchè ciascuna di queste vene è integralmente separata e divisa dalle vene della donna gravida, e son vene e arterie insieme appaiate; e rarissime volte si trova l'una sanza l'altra in compagnia, e quasi sempre è trovata l'arteria sopra la vena, perchè il sangue dell'arteria è il transito delli spiriti vitali, e 'l sangue delle vene è quello che nutrisce"

  "translation_ja": "肺は、呼気として吐き出すべき空気を外へ押し出したあとでも、常にいくらかの空気で満たされている。そして新しい空気によって冷やされるとき、肺は胸の肋骨に接し、それをいくらか広げて外側へ押す。呼吸している胸の上に手を置くと、胸が大きくなったり小さくなったりするのを見て感じることができるとおりであり、大きなため息をつくときには、なおさらそうである。"

  "translation_ja": |-
    ［図165］
    まず肺の枝分かれを描き、次いで心臓の枝分かれ、すなわちその静脈と動脈を描け。それから第三に、一方の枝分かれを他方と組み合わせたものを描け。この組み合わせを四方向から描き、前述の枝分かれについても同じようにせよ。これで十二図となる。それから、それぞれについて上から見た図と下から見た図を一つずつ描けば、全部で十八図となる。
  "translation_status": "draft"

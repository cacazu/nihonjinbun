  "translation_ja": "すなわち自然が絶えず生み出す事物である。自然は、自ら作ったものの通常の種類を変えることがない。これに対し、自然の最大の道具たる人間が作るものは、時とともに変わる。自然がなしうるのは単純なものを作り出すことだけだからである。しかし人間は、その単純なものから無数の複合物を作る。ただし、もう一人の自分、すなわち自分の子供を除いて、単純なものを一つとして創造する力はない。このことの証人には、昔からの錬金術師たちがなるだろう。彼らは偶然によっても、意図した実験によっても、自然が作りうる最小のものさえ、作り出すことに行き当たったためしがない。"

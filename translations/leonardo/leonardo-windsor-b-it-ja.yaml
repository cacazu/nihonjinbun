  "translation_ja": "人が段を上がるときに最初にすることは、上げようとする脚から、それに掛かっていた胴体の重さを取り除くことである。それに加え、もう一方の脚に、反対の脚を含む身体の残りすべての重さを掛ける。次いで脚を上げ、自分が上がろうとする段に足を置く。こうした後、高い方の足に胴体と脚の残りの重さをすべて移し、大腿に手を置き、頭を前へ突き出す。そして高い方の足の先へ向けて動き、低い方の足の踵をすばやく上げ、その勢いで上へ上がる。同時に、膝の上に支えていた腕を伸ばす。この腕を伸ばす動作が胴体と頭を上へ押し、こうして曲がっていた背を真っすぐにする。"

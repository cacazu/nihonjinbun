  "translation_ja": "心臓それ自体は生命の起源ではない。ほかの筋肉と同じく、動脈と静脈によって生命を与えられ、養われる、密な筋肉でできた容器である。ただし、その中で浄められる血と動脈は、ほかの筋肉の生命と栄養である。心臓は非常に密なので、火さえほとんど損なうことができない。これは焼けた人間で見られることで、骨が灰になった後でも、心臓は内部がまだ血に満ちている。自然がこれほどの耐熱性を与えたのは、心臓の左側に生じる大きな熱に耐えられるようにするためである。その熱は、この心室の中で精妙化される動脈の血によって生じる。"
  "translation_status": "draft"

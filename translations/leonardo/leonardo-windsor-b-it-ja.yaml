  "source_languages": []
  "source_locations": []
  "translation_ja": "4ª de’ condotti は「管について」の第四命題への参照として訳した。moto refresso と水柱の太さ・高さの説明は難解なため、原文の比較関係を保持した。"
  "translation_status": "draft"
- "id": "B-037r-007"
  "section_id": "B-037r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "E se tu dicessi che quanto più la vescica si riempie, più si serra, a questo si risponderà, che tali perforamenti, essendo riserrati dall'orina, che serrassi tali parieti, proibirebbe l'entrata all'altra orina, che discende, il che esser non può, per la 4ª predetta, che dice potere più l'orina sottile e alta, che la bassa e larga, che sta nella vescica."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 495
  - "source_id": "piumati_1901"
    "precision": "page"

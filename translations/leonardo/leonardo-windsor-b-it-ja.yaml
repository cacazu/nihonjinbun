  "origin": "source"
  "source_text": "Testiculi, testimoni del coito. Questi tengano in sè l’ardire, cioè son aumentatori dell’animosità e ferocità delli animali; e la sperienza se ne mostra chiara nelli animali castrati, de’ quali si vede il toro, il verro, il montone e ’l gallo, animali ferocissimi, i quali, poi che son privati d’essi testiculi, rimangano vilissimi, come si vede un montone cacciare una torma di castroni, e un gallo cacciare in fuga una quantità di capponi; e ’l medesimo vidi già fare a una gallina, e così li boi."
  "source_languages":
  - "it"
  "source_locations":

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Li muscoli transversali spriemano le intestine, ma non li longitudinali, perchè, se così fussi, l'omo, che sta chinato, e allenta tali muscoli, non arebbe forza di fare ofizio di priemere; ma li trasversali mai s'allentan nel chinare dell'omo, ma più tosto si tirano."

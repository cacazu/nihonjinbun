  "translation_ja": "獅子の類の眼は、その容器として頭部の大きな部分を占め、視神経は直ちに脳につながる。人間ではその反対であることが分かる。眼の容器は頭部の小さな部分を占めるにすぎず、視神経は細く長く弱いからである。そのため日中にもその働きは弱く、夜にはさらに悪いことが分かる。前述の動物は昼よりも夜によく見える。その証拠は、夜に獲物を捕らえ、昼に眠ることである。夜の鳥たちも同じことをする。"
  "translation_status": "draft"

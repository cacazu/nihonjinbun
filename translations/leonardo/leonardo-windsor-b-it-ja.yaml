  "translation_ja": "（根）肝門と脾門との間に延びる静脈は、五つの分枝からなる根をもち、それらは肝臓の五つの葉に分かれて入る。その幹の中ほどから一本の枝が出て、（大網を）大網の基部を養うために分かれ、そのあらゆる部分へ延びる。その少し先で一本の枝が上方へ立ち上がり、胃の左下部につながる。その後、さらに少し先の脾臓との接合部で二本の枝になって終わり、脾臓の全体にわたって枝分かれしていく。"

  "source_text": |-
    Entrata della orina nella vescica.
    La orina, partita dalle reni, penetra nelli pori oritidi, e di quelli passa nella vescica, vicino al mezzo della sua altezza, e in quella entra per piccole perforazioni, fatte traversal mente infra tonica e tonica; e questa tal perforazione obbliqua non fu fatta, perchè la natura dubitassi tale orina potere ritornare alle reni, perchè è impossibile, per la 4ª de' condotti, dove dice: l'acqua, che da alto discende per sottil vena, e penetra sotto il fondo del pelago, non le po essere contastato il moto refresso, se non da tanta grossezza d'acque del pelago, quanto è la grossezza della vena, che discende, nè da più altezza d'acqua, che si sia quella della profondità del pelago.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 495
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 496
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 497
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 498
  "translation_ja": |-
    膀胱への尿の流入。
    腎臓を出た尿は尿管に入り、そこから膀胱の高さのほぼ中央へ通じ、一つの膜ともう一つの膜との間を横切る小さな孔を通って膀胱内に入る。この孔が斜めに作られたのは、尿が腎臓へ戻りうると自然が案じたからではない。それは『管について』の第四命題によって不可能だからである。そこには次のように述べられている。高所から細い流路を下り、水域の底の下へ入り込む水の折り返す運動に対抗できるのは、下ってくる流路の太さに等しい太さをもつ水域の水だけであり、またその水域の深さを超える高さの水が対抗するわけではない。
  "translation_status": "draft"
- "id": "B-037r-006-tn-001-text"

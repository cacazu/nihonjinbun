  "translation_ja": "階段を上る人は、自分の重さを、高い方の足の前方と横へ、低い方の脚に釣り合うだけ移す。そのため低い方の脚の労力は、自分自身を動かすことだけに用いられる。"
  "translation_status": "draft"
- "id": "B-021v-009"
  "section_id": "B-021v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La prima cosa che fa l'omo, nel suo montare a gradi, esso scarica la gamba, che lui vole alzare, della gravità del busto, che sopra essa gamba si posava, e, oltre a di questo, carica l'opposita gamba di tutto il resto della quantità dell'omo, insieme co' l'altra gamba; di poi alza la gamba, e pone il piedi sopra di quel grado, ove esso si vole levare; fatto questo, esso rende al piedi alto tutto l'altro peso del busto e della gamba, e appoggia la mano sopra la coscia, e caccia la testa innanzi, e fa il movimento in verso la punta del piedi superiore, alzando con prestezza il calcagno del piedi inferiore, e con quello impeto si leva in alto, e nel medesimo tempo distende il braccio, ch'elli appoggiava sopra il ginocchio, il qual distendimento di braccio spigne il busto e la testa in alto, e così dirizza la schiena incurvata."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"

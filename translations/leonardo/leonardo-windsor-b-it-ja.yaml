  "source_text": "La diaframma, cioè il panniculo grosso, che sta sotto le punte del polmone, non è alterato, nè in alcuna parte sospinto dallo accrescimento del polmone, perchè tal polmone cresce per latitudine, e non per la sua lunghezza, se già esso diaframma non fussi sospinto dal vento, overo aria, che dà loco allo accrescimento del polmone, che allora sarebbe possibile che la diaframma, sospinta dall'aria, dessi loco al suo accrescimento, e lei spingessi il fegato, e 'l fegato lo stomaco, al quale lui fa coperchio, e così seguirebbe lo spignimento di tutte le intestine, e questo continuo moto verrebbe a causare, con tanta maggior celerità, lo sgomberamento delle intestine, quanto l'esercizio nell'omo fusse fatto con maggiore veemenzia."

    ［図185］b n m。
    頬の骨の空洞は、深さと幅において、眼を内部に収める空洞と似ており、その容積も非常によく似ている。また、孔 m を通して、その内部に血管を受け入れる。これらは脳から下り、頭の体液の余分を鼻へ排出する濾過器を通過する。この空洞には、眼を取り囲む上方の空洞にあるもの以外の明らかな孔は見当たらない。孔 b は視覚の力が感覚へ伝わるところであり、孔 n は、涙が鼻の管を通って心臓から眼へ上るところである。
  "translation_status": "draft"

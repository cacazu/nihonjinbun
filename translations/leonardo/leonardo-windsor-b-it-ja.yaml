    [Fig. 87:] n b.
    Del sommo alzamento e abbassamento delle spalle, che diserve al moto delle coste.
    Perchè il sommo alzare e abbassare delle spalle, mediante li muscoli del collo, stabiliti nelli spondili della sua spina, impedisce, alzandosi esse spalle, il moto delle coste nel lor discenso; e quando tali spalle s'abbassano, s'impedisce il moto dello alzare esse coste.
  "source_languages":

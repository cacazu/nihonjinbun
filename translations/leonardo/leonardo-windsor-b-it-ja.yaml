  "translation_ja": |-
    霊が空気の身体を得たとき、自ら動くことができるか否か。
    ある量の空気に入り込んだ霊が、その空気を動かすことは不可能である。これは前の命題から明らかである。そこでは、霊は自らが入り込む量の空気を軽くすると述べた。したがって、その空気はほかの空気より上へ昇り、それは空気がその軽さによって行う運動であって、霊の意志による運動ではない。その空気が風に出会えば、この第三命題により、その空気は風に動かされるのであって、中に入り込んだ霊によって動かされるのではない。
  "translation_status": "draft"

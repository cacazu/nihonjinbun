  "source_text": "Ricordati di non mutare mai li termini di nessun membro, per alcuno muscolo che tu levassi, per iscoprirne un altro; e se tu pure levi muscoli, de' quali l'un de' sua termini sia termine d'una parte del membro, donde tu lo spicchi, allora tu debbi segnare con ispessi punti il termine di quel membro, che fu levato per la separazione di qualunque muscolo; e questo farai, acciò la figura di quel membro, che tu discrivi, non resti cosa monstruosa, per averle tolto le sue parti. E, oltre a di questo, ne segue maggior cognizione del tutto, perchè, levatoli la parte, tu vedi nel tutto la vera figura della parte, donde essa fu levata."

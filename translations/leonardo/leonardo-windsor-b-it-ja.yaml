  "translation_ja": "霊が増大することが必要である。しかし量をもたなければ増大することはできない。また第四命題によれば、疎なものは、その運動の起点となる固定した場所をもたなければ動かない。とりわけ、元素が元素の中で動かねばならないときにはそうである。その元素は、発散するものの中心から一様に発散することによってしか、自らは動かない。これは水中で手に握り締めた海綿に起こるのと同じである。海綿から水は、握り締める手の指の隙間を通って、どちらの方向へも等しい運動で逃げ出す。"

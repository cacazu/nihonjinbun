  "translation_ja": "この頸の図示を、内側から、外側から、また横から、最大限の注意を払って行うこと。索と神経相互の比例関係を、それらが起こり終わる場所とともに示すこと。そうしなければ、自然あるいは必然がそれらに定めた働きや効用を論じることも、示すこともできないからである。"

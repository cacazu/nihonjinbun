    私は胃を覆う肝臓を、胃を覆っているその部分で、肝臓へ入り、またそこから出る血管の所まで切り開き、その血管が肝臓の中でどのように枝分かれしているかを見たい。しかしその前に、肝臓全体がどのように位置し、どのように胃を覆っているかを描いておこう。

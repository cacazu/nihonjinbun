  "section_id": "B-038v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Quali muscoli son quelli che stringano il traverso della bocca.
    Li muscoli, che stringano la bocca per il suo traverso, come si dimostra di sopra, sono li propi labbri, che ritirano i lati della bocca in verso il suo mezzo; e questo ci mostra la 4ª di questo, che dice: sempre la pelle, vestitrice de li muscoli che tirano, si dirizza, co' le sue grinze, al loco dove è la causa del moto; e per la 5ª: nessuno muscolo adopra la sua potenzia nello spignere, ma sempre nel tirare a sè le parte a loro congiunte; adunque il mezzo de' muscoli, detti labbri della bocca, tira a sè li stremi d'essa bocca con parte delle guancie, e per questo la bocca sempre in tale ufizio s'empie di grinze.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 519
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 520
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 521
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 522
  "translation_ja": |-
    口を横方向に狭めるのはどの筋か。
    上に示したように、口を横方向に狭める筋は唇そのものであり、口の両端をその中央へ引き戻す。このことは、この篇の第四命題が示す。そこには、引く筋を覆う皮膚は、常にその皺とともに、運動の原因がある場所へ向く、とある。また第五命題によれば、いかなる筋も押すことに力を用いず、常に、自分につながる部分を自分へ引き寄せることに力を用いる。したがって、口の唇と呼ばれる筋の中央は、頬の一部とともに口の両端を自分へ引き寄せる。それゆえ、この働きをするとき、口にはいつも皺が満ちる。
  "translation_status": "draft"

  "translation_ja": "次に同じ方向から、骨を切断した図をさらに三枚作り、その中に骨の厚さと空洞が見えるようにする。さらに、完全な骨と脊髄から起こる神経、およびそれらがどの肢体へ枝分かれするかを三枚の図にする。また骨と静脈、およびそれらがどこへ分枝するかを別の三枚にする。それから筋肉を付けた図を三枚、皮膚を付けて釣り合いの取れた形を示す図を三枚、そして子宮と乳房へ行く月経の静脈を示すため、女性の図を三枚作る。"

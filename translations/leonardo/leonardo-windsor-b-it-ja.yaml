  "translation_ja": "すべての静脈と動脈は心臓から生じる。その理由は、それらの静脈と動脈のうち最も太い箇所が、心臓との接合部にあり、心臓から遠ざかるほど細くなり、より細かな枝に分かれるからである。"
  "translation_status": "draft"
- "id": "B-011r-006"
  "section_id": "B-011r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "E se tu dicessi che le vene nascessino nella gibbosità del fegato, perchè esse hanno la loro ramificazione in essa gibbosità, sì come le radici delle piante hanno nella terra, a questa comparazione si risponde che le piante non hanno la (loro) origine nelle loro radici, ma le radici e l’altre ramificazioni hanno l’origine dalla parte inferiore d’esse piante, la quale sta infra l’aria e la terra; e tutte le parti della pianta inferiore e superiore son sempre minori d’essa parte, che confina colla terra; adunque è manifesto che tutta la pianta ha origine da tale grossezza, e, per conseguenza, le vene hanno origine dal core, dov’è la lor maggiore grossezza; nè mai si trova pianta, che abbia origine dalle + [Continua in margine, al segno +:] punte delle sue radici o altre ramificazioni; e la sperienza si vede nel nascimento del persico, che nasce dello suo nocciolo, come di sopra si dimostra, in a b e a c."

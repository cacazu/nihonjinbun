  "translation_ja": "その場合、人が横向きになれば、〔編者注：レオナルドの引いた線に従う〕一方の尿管は上に、もう一方は下になる。上の管は入口を開いて尿を膀胱へ流し込み、下の管は尿の重みで閉じる。したがって一本の管だけが膀胱へ尿を送り、それで足りる。ただし、一方の腎血管が、乳糜に由来する血液から、それに混じっている尿を取り除けばよい。なぜなら、これらの腎血管は互いに向かい合っており、すべてが「乳糜の血管」から出ているわけではないからである。"
  "translation_status": "draft"

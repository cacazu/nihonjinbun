  "source_text": "Disfarai la sustanzia del cervello insino alli confini della dura madre, che s'interpone in fra esso osso basilare e la sustanzia del cervello; di poi nota tutti [Seguendo la linea:] li lochi, dove essa dura madre penetra l'osso basilare, colli nervi da lei vestiti insieme colla pia madre; e questa tal notizia con certezza acquisterai, quando con diligenzia alzerai essa pia madre a poco a poco, cominciando dalli stremi, e notando di parte in parte la situazione de' predetti perforamenti, cominciando prima dal destro o sinistro lato, quello intera mente figurando, e poi seguirai l'opposita parte, la quale ti darà notizia se l'antecedente è ben situata o no, e ancora ti farà intendere se la destra parte è simile alla parte sinistra; e se tu la trovi variata, rivedi nelle altre natomie, se tal varietà è universale in tutti li omini e donne, ecc."

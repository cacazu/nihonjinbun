    [Fig. 53.]
    L’arteria e la vena, che ne’ vecchi s’astende infralla milza e ’l fegato, si fan di tanta grossezza di pelle, ch’ella serra il transito del sangue, che viene dalle vene miseraice, per le quali esso sangue trascorre al fegato e al core e alle due vene maggiori, e, per conseguenza, per tutto il corpo; e tali vene, oltre allo ingrossamento di pelle, crescano in lunghezza e si attorcigliano a uso di biscia, e il fegato perde l’omore del sangue, che da questa li era porto; onde esso fegato si disecca, e fassi a modo di crusca congelata, sì in colore, come in materia, in modo che con poca confregazione, che sopra esso si faccia, essa materia cade in minute particule, come segatura, e lascia le vene e arterie; e le vene del fiele e dell’ombelico, che, per la porta del fegato, in esso fegato entravano, rimangano tutte spogliate della materia d’esso fegato, a uso della (seme) meliga o saggina, quando n’è spiccati li sua grani.

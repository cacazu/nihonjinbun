  "translation_ja": "頭蓋底の骨と脳の実質との間に介在する硬膜の境まで、脳の実質を取り除くこと。それから、硬膜が、軟膜とともに自ら包んでいる神経を伴って頭蓋底の骨に入り込む場所を、すべて記録すること［線に沿って読む］。このことを確実に知るには、端から始めて軟膜を注意深く少しずつ持ち上げ、前述の孔の位置を一つずつ記録すればよい。まず右側か左側から始め、その側をすべて図示し、次いで反対側を調べること。それによって、先に描いた側の位置が正しいかどうかが分かり、また右側が左側と同じかどうかも理解できる。もし相違が見つかったら、ほかの解剖でも調べ、その相違があらゆる男女に共通するかどうかを確かめよ、等々。"
  "translation_status": "draft"

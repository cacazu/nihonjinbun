  "source_text": "Quando, co' muscoli transversali del corpo, si prieme fori le superfruità delle intestine, essi muscoli non farebbon bene, nè con potenzia, il loro ofizio, se il polmone non si empiessi d'aria; imperò che, non essendo esso polmone ripien d'aria, egli non empie di sè tutto il diaframma; onde tal diaframma resta lento, e le intestine, premute dalli detti muscoli transversali, (sariano) si piegano inverso quel sito, che li dà loco, il quale sarebbe lo diaframma."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 205
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 206
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 207
  "translation_ja": "身体の横走筋で腸の不要物を外へ押し出すとき、肺が空気で満たされなければ、それらの筋は十分に、力強くその役目を果たせない。肺が空気で満たされていなければ、肺自身で横隔膜の全体を満たさないからである。それで横隔膜は緩んだままになり、これらの横走筋に押された腸は、（そうなるだろう）空間を譲ってくれる所、すなわち横隔膜の方へ曲がる。"
  "translation_status": "draft"

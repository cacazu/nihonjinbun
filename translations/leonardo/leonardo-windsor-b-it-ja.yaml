  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 207
  "translation_ja": "しかし肺がすっかり空気で満たされ、上方へ（口から）息を吐き出させなければ、横隔膜は張って硬くなり、横走筋に押された腸が上へ上がるのに抵抗する。そのため腸は、そこに閉じこめられている不要物の大部分を、必然的に直腸を通して排出する。"
  "translation_status": "draft"

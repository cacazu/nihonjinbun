  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quasi universal mente tu troverai il transito delle vene e ’l transito de’ nervi essere a un medesimo cammino, e dirizzarsi a medesimi muscoli, e ramificare nel medesimo modo in ciascun d’essi muscoli, e ciascuna vena e nervo passare coll’arteria in fra l’uno e l’altro muscolo, e ramificare in essi con equal ramificazione."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 139
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 140
  "translation_ja": "ほとんどどこでも、静脈の通り道と神経の通り道とは同じ道筋を取り、同じ筋肉へ向かい、それぞれの筋肉の中で同じ仕方で枝分かれしていることが分かるだろう。また、一つ一つの静脈と神経が動脈とともに筋肉と筋肉の間を通り、それらの中で等しい分枝をつくることも分かるだろう。"
  "translation_status": "draft"
- "id": "B-010r-006"
  "section_id": "B-010r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le vene sono estensibili e dilatabili; e di questo donerà testimonianza, coll’avere io veduto uno ferirsi a caso la vena comune, e immediate riserratosela con istretta legatura, e in ispazio di pochi giorni crescere un’apostema (rossa) sanguinea, grossa come un ovo d’oca, piena di sangue, e così stare più anni; e ancora ho trovato, ’n un decrepito, le vene miseraice riserrato il transito al sangue, e raddoppiate in lunghezza."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 139
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 140
  "translation_ja": "血管は伸ばすことも広げることもできる。その証拠として、私は、ある人が偶然に共通の血管を傷つけ、すぐにきつく縛ってそれを閉じたところ、数日のうちに血液を満たした、ガチョウの卵ほどの大きさの（赤い）血性の腫れ物が生じ、そのまま数年間続いたのを見たことがある。また、衰えきった老人では、腸間膜の血管が血液の通路を閉ざし、長さが二倍になっているのを見いだした。"
  "translation_status": "draft"

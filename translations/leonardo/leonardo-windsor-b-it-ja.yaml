  "source_text": "Li muscoli n r S h son 4, e hanno 5 corde, e non furon fatti d'un pezzo solo, come li altri, a ciò fussi ciascun più corto; conciosiachè, dove li è vita con grossezza, li è fortezza, e dov'è tanta lunghezza di moto, quivi è necessario dividere il motore in più parti, e la sua maggiore estensione eccede l'estensione minore la terza parte d'un de' sua bracci, e tanto più, quanto esso fa maggiore concavità d'arco nella sua schiena, come far si vede a questi giocolatori, li quali si piegan tanto indirieto, che giungano insieme le lor mani co' li loro piedi; e questo superchio è nato dal raccortamento de' piedi colle lor mani, [Seguendo la linea:] e son fatti essi muscoli in due squadre, cioè destra e sinistra, per la necessità del chinarsi a destra e sinistra."

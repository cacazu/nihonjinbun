    "precision": "page"
    "pdf_page": 199
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 200
  "translation_ja": "著述家たちは、尿管は尿を膀胱へ運ぶためにまっすぐ入るのではなく、皮膜と皮膜の間へ、互いに向かい合わない経路を通って入ると述べる。そして膀胱が満たされるほど、その経路は強く閉じるという。彼らによれば、自然がこうしたのは、膀胱が満たされたとき、尿が来た道へ逆に流れ出してしまうのを防ぐためだけである。そこで、膜と膜の間の経路が、狭い道を通り、最初の膜の開口と向かい合わない位置から内側の膜へ入るようになっているので、膀胱は満たされるほど、一方の膜をもう一方へ強く押しつける。それゆえ尿が流れ出して逆戻りする理由はなくなる、というのである。"
  "translation_status": "draft"
- "id": "B-014r-005"
  "section_id": "B-014r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "la qual prova non è vera; con ciò sia che, se l'orina s'alzassi più nella vescica che la sua entrata, la quale è presso al mezzo della sua altezza, e' seguirebbe che subito tale entrata si serrerebbe, e non potrebbe entrare più orina nella vescica, e mai passerebbe la metà della capacità di tal vescica; adunque sarebbe superfruo il resto di tal vescica, e la natura non fa nulla superfluità."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 197
  - "source_id": "piumati_1901"
    "precision": "page"

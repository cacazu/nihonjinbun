  "source_text": "Adunque direno, per la 5ª del 6° delle acque, come l'orina entra per larga e tortuosa via nella vescica, e poi che la vescica è piena, i pori uritidi restano pieni d'orina, e non possan montare l'orine delle vesciche più alto che la sua superfizie, stando l'omo diritto; ma s'elli sta a giacere, potrebbe tornare indirieto per essi pori, e più, se stessi sotto sopra, il quale poco s'usa; ma 'l giacer s'usa assai,"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 197
  - "source_id": "piumati_1901"

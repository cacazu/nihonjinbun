  "source_text": "E questo vecchio, di poche ore inanzi la sua morte, mi disse lui passare cento anni, e che non si sentiva alcun mancamento ne la persona, altro che debolezza, e così, standosi a sedere sopra uno letto, nello spedale di Santa Maria Nova di Firenze, sanza altro movimento o segno d’alcuno accidente, passò di questa vita."
  "source_languages":

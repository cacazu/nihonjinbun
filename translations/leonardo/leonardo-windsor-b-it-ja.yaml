  "translation_ja": "横隔膜、すなわち肺の先端の下にある厚い膜は、肺が大きくなっても変形せず、どの部分も押されない。肺は幅の方向へ大きくなり、長さの方向には伸びないからである。ただし、肺の拡大に場所を譲る風、つまり空気によって横隔膜が押されるのでなければ、ということである。その場合には、空気に押された横隔膜が肺の拡大に場所を譲り、横隔膜が肝臓を押し、肝臓が、その蓋になっている胃を押すことはありうるだろう。こうしてすべての腸が次々に押されることになり、この絶え間ない運動によって、人の運動が激しければ激しいほど、腸内の排出はいっそう速くなるだろう。"
  "translation_status": "draft"

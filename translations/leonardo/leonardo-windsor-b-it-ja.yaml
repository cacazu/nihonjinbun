  "translation_ja": "老人では結腸とその他の内臓が大いに狭くなる。また私は、胸の叉骨の下を通る血管の中に石を見いだした。それらは栗ほどの大きさで、色と形はトリュフ、あるいは鉄の鉱滓や炉滓のようであった。この石はその炉滓と同様にきわめて硬く、前述の血管に取り付いた、こぶのような袋をつくっていた。"

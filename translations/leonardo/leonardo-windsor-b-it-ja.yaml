  "source_text": "questo modo: la voce è movimento d'aria confregata in corpo denso, o 'l corpo denso confregato nell'aria, che è il medesimo; la qual confregazion di denso con raro condensa il raro, e fassi resistente; e ancora il veloce raro nel tardo raro si condensano l'uno e l'altro ne' contatti, e fanno sono, o grandissimo strepito, e il sono, over mormorio fatto dal raro, che si move nel raro con mediocre movimento, come la gran fiamma generatrice di sono infra l'aria, e 'l grandissimo strepito, fatto di raro con raro, è quando il veloce raro penetra lo immobile raro, come la fiamma del foco uscita della bombarda, e percossa infra l'aria, e ancora la fiamma uscita del nugolo, e percote l'aria nella generazion delle saette."

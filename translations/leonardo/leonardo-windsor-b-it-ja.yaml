  "translation_ja": "〔欄外〕肺は空気で満たされると、長さの方向ではなく幅の方向に大きくなる。これは（動物の）豚の肺を膨らませれば見ることができる。（そして、そこに……する脂は）しぼんだ肺と、その周りの肋骨との間にあった空気は、肺が大きくなると、下方、つまり肺と横隔膜の間へ逃げる。そして横隔膜を下へ、胃に向かって膨らませる。そのため胃は圧迫され、自分の中にあるものを腸へ送り出す。"
  "translation_status": "draft"

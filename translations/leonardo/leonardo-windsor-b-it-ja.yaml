  "source_text": "Ha messo la natura le vene maestre della gamba nel mezzo della grossezza della giuntura del ginocchio, perchè, nel piegare essa giuntura, le vene son manco premute, che s'elle passassino nel dinanzi o nel dirieto del ginocchio."

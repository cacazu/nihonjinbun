  "translation_ja": "腸を圧迫するのは横走筋であって、縦走筋ではない。もし縦走筋によるのなら、人が前かがみになってそれらの筋を緩めたとき、押す働きを行う力を失うはずだからである。しかし横走筋は、人が身をかがめても決して緩まず、むしろ引き伸ばされる。"
  "translation_status": "draft"

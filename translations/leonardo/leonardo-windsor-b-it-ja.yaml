  "source_text": "In effetto l’omo non si varia dalli animali se non nell’accidentale, col quale esso si dimostra essere cosa divina, perchè, dove la natura finisce il produrre le sue spezie, l’omo quivi comincia colle cose naturali, a fare, coll’aiutorio d’essa natura, infinite spezie; [Seguendo la linea tracciata da Leonardo:] le quali non essendo necessarie a chi ben si corregge, come fan li animali, a essi animali non è disposizion cercarne."

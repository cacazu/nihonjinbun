  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 148
  "translation_ja": "私は、これほど穏やかな死の原因を知るため、その遺体を解剖した。そして、心臓と下方の他の諸器官を養う血液と動脈の不足によって衰えたことを見いだした。それらの器官はひどく乾燥し、痩せ衰え、干からびていた。この解剖について、私は非常に注意深く、しかもたいへん容易に記述することができた。諸部分を見分ける大きな妨げとなる脂肪と液分が失われていたからである。もう一つの解剖は二歳の男児について行ったが、そこではすべてが老人の場合とは反対であることを見いだした。"
  "translation_status": "draft"

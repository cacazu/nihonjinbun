  "translation_ja": "人間の論説のうち最も愚かなものと見なすべきなのは、降霊術を信じるに至る論説である。降霊術は、単純で自然なものを生む錬金術の姉妹である。しかし錬金術よりも、はるかに強い非難に値する。降霊術が生み出すのは、（文字と）自分に似たもの、（言葉）すなわち嘘だけだからである。錬金術ではそうではない。それは自然の生んだ単純なものを取り扱う。この働きは自然自身には行えない。自然には、人間が手を使って行うことを行える身体器官がないからである。（人間は位置を変える運動をもつ。）人間はこの働きによってガラスなどを作ってきた。"

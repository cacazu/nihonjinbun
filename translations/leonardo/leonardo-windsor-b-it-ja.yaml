  "translation_ja": |-
    ［図159］
    腐敗がもたらす養分について。
    腸内に含まれる食物の実質を引き寄せる腸間膜静脈の末端は、人間の自然の熱によって広げられている、と私はいう。なぜなら、熱は分散させて広げ、寒さは集めて狭めるからである。しかし、この熱に、動脈から腸へ送り込まれた血液の腐敗によって生じる悪臭が加わらなければ、それだけでは不十分であろう。その血液は、腸内でも墓の中と変わらぬ作用をする。この悪臭は内臓を広げ、あらゆる小孔へ浸透し、体を太らせて樽のように膨らませる。もし、この悪臭が体内で熱を帯びるのだと君がいうなら、雪に覆われながら膨らんだ死体では、それは裏づけられない。悪臭の力は、熱よりもはるかに速やかに働き、増大する。
  "translation_status": "draft"

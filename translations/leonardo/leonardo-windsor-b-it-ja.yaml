  "source_text": "La luce, over popilla dell’occhio umano, nel suo crescere e diminuire, cresce e manca la metà della sua grandezza; e nelli animali notturni manca e cresce più che la centesima parte della sua grandezza; e questo fia veduto nell’occhio del gufo, uccel notturno, collo appressarli all’occhio un torchio acceso, e più, se lo farai guardare nel sole, che allora li vedrai la popilla, che prima tenea tutto l’occhio, diminuire alla grandezza d’un grano di miglio, e in tal diminuizione si ragguaglia colla popilla dell’omo, e parli le cose chiare e lustre del medesimo colore, che in tal tempo paiono all’omo, e tanto più, quanto el cervello di tale animale è minore che ’l cervel dell’omo; onde accade che, crescendo tal popilla nel tempo notturno cento più che quella dell’omo, vede cento volte più lume che l’omo, in modo tale, che essa potenzia visiva non è poi superata dalle tenebre notturne; e la luce dell’omo, che sol raddoppia sua quantità, vede poco lume, e quasi come il pipistrello, il quale non vola ne’ tempi di troppa oscurità."
  "source_languages":
  - "it"
  "source_locations":

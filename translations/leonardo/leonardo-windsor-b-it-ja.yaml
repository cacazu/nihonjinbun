  "translation_ja": "もし君が、植物の根が土の中で枝分かれするのと同様に、血管は肝臓の凸面の中で枝分かれするのだから、そこで生じるのだと言うなら、その比較には次のように答えられる。植物はその根に（自らの）起源をもつのではなく、根と他の枝分かれは、空気と土の間にある植物の下部から生じるのである。そして植物の下方および上方のすべての部分は、土に接するその部分よりも常に小さい。したがって植物全体がこの太い部分から生じることは明らかであり、ゆえに血管も、それが最も太い心臓から生じる。根や他の枝の先端から生じる植物は決して見いだされない。＋［＋印の欄外へ続く］このことは、桃の木がその核から生まれる際に実際に見られる。上の a b および a c に示したとおりである。"
  "translation_status": "draft"

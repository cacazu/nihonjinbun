  "translation_ja": "筋 n r S h は四つで、五本の腱を持つ。各々を短くするため、ほかの筋のように一つの塊にはつくられなかった。厚みとともに生命の働きがある所には力があり、運動の幅がこれほど長い所では、動かすものをいくつもの部分に分ける必要があるからである。その最大に伸びた長さは、最小の長さより、その人の片腕の長さの三分の一だけ大きくなり、背中をより深い弧に反らせるほど、その差も大きくなる。曲芸師たちが、両手と両足を合わせるほど後ろへ反るのを見るとおりである。この余分な伸びは、足と手との距離を縮めることから生じる。〔編者注：線に従う〕また、これらの筋が右と左との二列につくられているのは、右にも左にも身をかがめる必要があるためである。"
  "translation_status": "draft"

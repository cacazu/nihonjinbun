  "source_text": "E se l'omo sta colla schiena al celo, tutt'e 2 [Continua in margine al Folio 13 verso:] li pori uritidi versano orina nella vescica, e entrano per la parte superiore della vescica, perchè tali pori son congiunti ne la parte posteriore della vescica, la qual parte, stando col corpo in giù, rimangano di sopra, e così possano l'entrate dell'orina stare aperte, e dare tanta urina alla vescica, che l'empia."

  "translation_ja": "さて、重さの定義は「重さとは、一つの元素がほかの元素へ引かれ、押し入れられることによって生じる、偶有的な力である」と言う。したがって、どの元素も同じ元素の中では重さをもたないが、自分より軽い上位の元素の中では重さをもつ。たとえば、一部分の水はほかの水の中では重さも軽さもない。しかしそれを空気中へ引き上げるなら、重さを得る。そしてもし君が引き入れるなら……"

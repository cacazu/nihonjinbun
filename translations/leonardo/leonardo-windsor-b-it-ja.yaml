  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Poi discriverai quali membra sieno quelle che crescano, poi che 'l putto è nato, più che l'altre; e dà la misura d'un putto d'un anno.
    Poi discrivi l'omo cresciuto, e la femmina, e sue misure, e nature di complessione, colore e filosomie.
    Di poi descrivi come li è composto di vene, nervi, muscoli e ossa. Questo farai nell'ultimo del libro.
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"

  "translation_ja": "神経の枝の数は筋肉の数と等しく、それより多くも少なくもありえない。これらの筋肉は、それらの神経によってのみ縮み、また伸び、筋肉はそれらから自らの感覚を受け取るからである。また肢体を動かす索の数は、筋肉の数と等しい。"

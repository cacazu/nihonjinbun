    Della qualità delli denti, e lor situazione e remozione dal polo de' lor moti.
    Quel dente ha minore potenzia nel suo strignere, che è più remoto al centro del suo moto. Come se 'l centro del moto de' denti fussi a, polo della mascella, dico che quanto tali denti son più distanti a tale centro, a, tanto son di minore potenzia nello strignere; adunque d e è meno potente nello strignere, che li denti b c; e per questo seguita il corollario, che dice: quel dente è più potente, ch'è più presso al centro del suo moto, over polo del suo moto; cioè, più potente è lo strignere delli denti b c, che delli denti d e.
  "source_languages":

  "translation_ja": "この種の人々は、人間の役に立つものを発見したその有用さのために、無限の称賛に値する。もし彼らが毒や、それに類する生命や精神を破滅させるものを発明しなかったなら、いっそう称賛に値しただろう。彼ら自身もその破滅を免れない。なぜなら、大いに研究し実践して、自然の最も卑しい産物ではなく最も優れた産物、すなわち金を作り出そうとするからである。金は、ほかのどの被造物よりも太陽に似ているため、太陽の真の子なのであり……"

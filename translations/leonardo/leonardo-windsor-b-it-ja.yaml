    Delli spiriti.
    Abbiamo insin qui, dirieto a questa faccia, detto come la difinizion dello spirito è (un nome non congiunto) una potenzia congiunta al corpo, perchè per sè medesimo reggere non si può, nè pigliare alcuna sorte di moto locale; e se tu dirai che per sè si regga, questo essere non po dentro alli elementi, perchè, se lo spirito è quantità incorporea, questa tal quantità è detta vacuo, e il vacuo non si dà in natura, e dato che si dessi, subito sarebbe riempiuto dalla ruina di quello elemento, nel qual tal vacuo si generassi.

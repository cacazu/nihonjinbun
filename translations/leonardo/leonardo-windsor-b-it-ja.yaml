  "source_text": "[In margine:] L'accrescimento del polmone, quando s'empie d'aria, è latitudinale, e non per la sua lunghezza, come veder si po nel gonfiare il polmon d'un (animale) porco; (e l'unto che si) e l'aria, che s'inframettea infra el polmone disgonfiato e le coste che 'l circundano, nel crescere del polmone, si fugge nella parte di sotto, in fra 'l polmone e 'l diaframma, e fa gonfiare esso diaframma allo 'n giù, contro allo stomaco, donde esso stomaco, essendo premuto, manda le cose da lui contenute dentro alle intestine."

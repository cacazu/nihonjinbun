  "source_text": "E certo, se tale negromanzia fussi in essere, come dalli bassi ingegni è creduto, nessuna cosa è sopra la terra, che al danno e servizio dell'omo fussi di tanta valitudine, perchè se fussi vero che in tale arte si avessi potenzia di far turbare la tranquilla serenità dell'aria, convertendo quella in notturno aspetto, e far le corruscazioni e venti, con ispaventevoli toni e folgori, scorrenti infralle tenebre, e con impetuosi venti minare li alti edifizi, e diradicare le selve, e con quelle percotere li eserciti, e quelli rompendo e atterrando, e, oltra di questo, le dannose tempeste privando li cultori del premio delle lor fatiche; o qual modo di guerra po essere, che con tanto danno possa offendere il suo nemico, aver potestà di privarlo delle sue ricolte? Qual"

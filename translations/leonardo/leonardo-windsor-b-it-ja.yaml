  "translation_ja": |-
    ［図53］
    老人では、脾臓と肝臓との間に延びる動脈と静脈の壁がたいそう厚くなり、腸間膜の血管から来る血液の通路を閉ざす。この血液はそれらを通って肝臓、心臓、二本の大きな血管へ、したがって全身へ流れていくのである。また、こうした血管は壁が厚くなるだけでなく、長くなり、蛇のようにねじれる。そして肝臓は、この血管によって運ばれていた血液の液分を失う。そのため肝臓は乾き、色も質も固まったふすまのようになる。わずかにこすると、その物質は鋸屑のような細かい粒になって落ち、静脈と動脈を残す。肝門を通って肝臓の中へ入っていた胆汁と臍の管は、肝臓の物質をすっかり剥ぎ取られ、実を取り去った（種）モロコシ、あるいはホウキモロコシのような姿になる。
  "translation_status": "draft"

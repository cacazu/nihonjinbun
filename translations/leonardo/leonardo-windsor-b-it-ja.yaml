  "source_text": "E oltre a di questo, discrivi le distanzie interposte infralli nervi, in fra loro, sì per profondità, come per latitudine, e così le proporzioni delle lor grossezze e lunghezze, e le differenzie delle altezze e bassezze de' nascimenti loro; e il simile farai de' muscoli, vene e arterie; e questo fia utilissima cosa alli curatori delle ferite."

  "translation_ja": "われわれに知られ、また、一つの言語の単純語と複合語が、この器官を通じてわれわれの耳に届くかを。自然のすべての働きに名があったなら、それらの語は、自然のうちに現実に存在する無数のもの、および可能性として存在する無数のものとともに、無限へと広がるだろう。しかも、それらは一つの言語だけで表されるのではなく、非常に多くの言語で表され、その言語自体も無限へ広がってゆく。戦争やその他の出来事のために絶えず混じり合う諸民族の混合を通じて、言語は世紀ごと、国ごとに絶えず変化するからである。それらの言語もまた忘却にさらされ、ほかの被造物と同じく死すべきものである。もしわれわれの世界が永遠だと認めるなら、無限の時間に含まれる無限の世紀のゆえに、言語の種類は過去においても、またこれからも無限であると言うことになる。等々。"
  "translation_status": "draft"

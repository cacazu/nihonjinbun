  "source_text": "Il core in sè non è principio di vita; ma è un vaso fatto di denso muscolo, vivificato e nutrito dall'arteria e vena, come sono li altri muscoli. Vero è che il sangue e l'arteria, che in lui si purga, son vita e nutrimento delli altri muscoli, ed è di tal densità, che appena il foco li po nuocere; e questo si vede nelli omini bruciati, li quali, poi che son cenerizzate le sua osse, il core è ancor dentro sanguinoso; e questa tanta resistenzia di caldo ha fatto la natura, acciocché e' possa resistere al gran calore, che si genera nel sinistro lato del core, mediante il sangue dell'arteria, che in tal ventriculo s'assottiglia."

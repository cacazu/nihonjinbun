  "translation_ja": "私は人体の構成について、動物のあらゆる構成の中で人間の感覚がより鈍く粗いのと同様に、その器官のつくりも巧みさに欠け、感覚の力を受け入れる場所の容量も小さいことを見いだした。獅子の類の嗅覚においては、脳の物質の一部が、嗅覚器に向かってかなり大きな容器の中へ下っているのを見た。この嗅覚器は、多数の軟骨性の小嚢の間へ入り、前述の脳が達してくる方へ向かう多くの通路を備えている。"
  "translation_status": "draft"

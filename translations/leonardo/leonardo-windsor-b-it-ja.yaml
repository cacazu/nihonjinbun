    肩から肘までの運動を起こす神経について。
    肘から手までの運動について。
    手首の関節から指の付け根まで。
    指の付け根からその中央まで。
    そして中央から最後の関節まで。
  "translation_status": "draft"
- "id": "B-042v-008"
  "section_id": "B-042v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Del nervo ch'è cagione del moto della coscia.
    E dal ginocchio al piè, e dalla giuntura del piè ai diti.
    E così ai lor mezzi.
    E del girare d'essa gamba.
  "source_languages":
  - "it"
  "source_locations":

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dican gli autori che li pori uritidi non entrano a dirittura a portare la orina alla vescica; ma entrano fra pelle e pelle, per vie che non si scontrano; e quanto più la vescica s'empie, tanto più si serrano; e questo dicano aver fatto la natura, sol perchè, quando la vescica s'empiessi, essa verserebbe l'orina in dirieto, dond'ella venne; onde, trovando le vie tra panniculo e panniculo entrare in quel di dentro, per vie strette, e non a riscontro di quella del primo panniculo, la vescica, quanto più s'empie, più serra l'un panniculo a dosso all'altro, onde non ha causa versarsi e tornare indirieto;"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 197
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 198

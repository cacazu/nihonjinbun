  "translation_ja": "（自然は、より大きな力を持つ歯を、食物に突き入りにくく、先端の太いものに作る。）したがって歯b cは、より大きな力で動かされるほど、その先端がいっそう鈍くなる。このため歯b cは、顎a dおよびa eの支点aに近いほど、歯d eに比べていっそう鈍くなる。それゆえ自然は臼歯を、食物を突き刺したり切ったりするのではなく、すり潰すのに適した幅広い面を持つものに作った。そして前方には、食物を切り、突き入る歯を作り、すり潰すには適さないものにした。また、臼歯と切る歯の間には犬歯を作った。"

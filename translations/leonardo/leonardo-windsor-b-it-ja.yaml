    "precision": "page"
    "pdf_page": 105
  "translation_ja": "膝の後ろにある神経 b f の右には c h、すなわち二つに分かれて左へ m e の枝を出す静脈がある。その左には動脈 a d があり、これも二つに分かれ、右へ n h の枝を出す。このような分岐は必要であった。この脚のふくらはぎの両側に静脈と動脈、すなわち栄養と生命を備えさせるには、これより短い道がほかになかったからである。"

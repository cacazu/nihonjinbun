  "translation_ja": |-
    その後、四つの場面に、人間に共通する四つの事態を描け。すなわち喜びを、さまざまな笑う動作とともに描き、笑いの原因も描け。泣くことを、さまざまな仕方で、その原因とともに描け。争いを、殺す、逃げる、恐れる、猛る、敢えて立ち向かう、殺人を行うなどのさまざまな動作、およびこのような事態に属するすべてのこととともに描け。
    その後、労働を、引く、押す、運ぶ、止める、支えるといったこととともに描け。

  "source_text": "Li occhi dalla spezie leonina hanno gran parte della lor testa per lor ricettaculo, e li nervi ottici immediate congiugnersi col celabro; il che alli omini si vede il contrario, perchè le casse delli occhi sono una piccola parte del capo, e li nervi ottici sono sottili e lunghi e deboli; e però debole operazione si vede di loro il dì, e peggio la notte; e li predetti animali veggan me’ la notte che ’l giorno; e ’l segno se ne vede, perchè predano di notte e dormano il giorno, come fanno ancora li uccelli notturni."

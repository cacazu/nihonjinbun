    斜めに位置し、背骨の上部から下って、柘榴のほうに向かって終わる小さな筋肉は、肋間筋と呼ばれる。これらは肋骨と肋骨の間に挟まれ、ただその間隔を狭めるためにある。この筋肉に感覚を与える神経は、背骨の中を通る脊髄から起こり、脊髄からの最も下方の起始は、背が腰に接する所にある。

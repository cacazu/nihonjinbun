  "source_text": "Core aperto nel ricettaculo delli spiriti, cioè nell’arteria; e in M piglia, o vero dà il sangue alla arteria, e della bocca, B, si rinfresca del vento del polmone, e di C riempie li orecchi del core, S. N, muscolo duro, si ritira, ed è prima causa del moto del core, e, nel ritirarsi, s’ingrossa, e, nello ingrossarsi, si raccorta, e si tira dirieto tutti li muscoli inferiori e superiori, e chiude la porta M, e raccorta lo spazio interposto infra la basa e la cuspide del core, onde lo viene a evacuare, e attrarre a sè la fresca aria."

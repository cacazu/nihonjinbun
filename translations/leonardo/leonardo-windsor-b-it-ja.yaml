  "source_text": "Farai con somma diligenza questa dimostrazione del collo di dentro e di fori e in profilo, e le proporzioni delle corde e nervi infra loro, e co' siti dove nascano e finiscano; perchè, altre menti facendo, non si potrebbe trattare nè dimostrare l'uffizio o giovamento, al qual natura over necessità l'ha ordinato."

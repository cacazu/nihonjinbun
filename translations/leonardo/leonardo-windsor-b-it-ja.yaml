  "source_text": "Ho trovato nella composizione del corpo umano che, come in tutte le composizioni delli animali, esso è di più ottusi e grossi sentimenti, così è composto di strumento manco ingegnoso, e di lochi manco capaci a ricevere la virtù de’ sensi. Ho veduto nella spezie leonina, nel senso dell’odorato, avere parte della sustanzia del celabro, discendere in assai capace ricettaculo contro al senso dello odorato, il quale entra infra gran numero di saculi cartilaginosi, con assai vie contro all’avvenimento del predetto celabro."
  "source_languages":

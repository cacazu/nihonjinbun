  "source_text": "Nullo strumento inferiore nel corpo umano non si po fermare volontaria mente, se non il polmone. Vedi ’l core fa per sè il suo ofizio, e così lo stomaco, e l’altre intestine a quello congiunte, e ’l simile: fegato, fele, milza, testiculi, e rognoni, e vescica."

  "source_text": "l'animale. E di queste tal ramificazioni figurate, quelle, che son levate in alto, son ordinate al nutrimento del 3 panniculo sottile della matrice, e le vene più basse, poste per obbliquo, son quelle che notriscano l'ultimo pannicolo, ch'è contingente all'animale, che di quel si veste, e l'uno e l'altro di questi spesso esce, insieme colla creatura, fori della matrice della madre; e questo accade quando l'animale non la po rompere, che allora esce vestito, ed è facile cosa, perchè essi 2 panniculi sottilissimi, com'è detto disopra, non sono in nessuna parte congiunti colla matrice detta, la quale, ancora lei, è composta di 2 panniculi, li quali sono assai grossi e carnosi e nervosi."

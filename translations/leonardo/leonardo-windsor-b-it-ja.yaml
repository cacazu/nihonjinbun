  "source_text": "Il polmone sta sempre ripieno d'una quantità d'aria, ancora che esso abbia sospinto fori quell'aria, che si richiede al suo esalare; e, quando si rinfresca di nuova aria, esso s'appoggia nelle coste del petto, e quelle alquanto dilata e sospigne in fuora, come si vede e sente, nel tenere la mano sopra del petto nel suo alitare, che 'l petto cresce e diminuisce, e tanto più, quando qualche gran sospiro è generato."

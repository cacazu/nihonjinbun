  "source_text": "dove, se l'omo sta per fianco, [Seguendo la linea tracciata da Leonardo:] l'uno de' pori uritidi resta di sopra, l'altro di sotto; e quel di sopra apre la sua entrata, e scarica l'orina nella vescica; e l'altro poro di sotto, pel peso della orina, si serra; onde un sol poro dà l'orina a la vescica, e basta, pur che una delle vene mulgenti netti il sangue del chilo della orina, che con lui è mista, perchè esse vene mulgenti sono a riscontro l'una dell'altra, e tutte non escan dalla vena chili."
  "source_languages":

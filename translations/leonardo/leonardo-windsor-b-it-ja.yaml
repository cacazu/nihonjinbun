  "translation_ja": |-
    〔図87〕n b。
    肋骨の運動を妨げる、肩を最大限に上げ下げすることについて。
    首の脊柱の椎骨に付いている首の筋によって肩を最大限に上げ下げすると、肩が上がったときには肋骨が下がる運動が妨げられ、肩が下がったときには肋骨が上がる運動が妨げられるからである。
  "translation_status": "draft"

  "translation_ja": "動物を養うのである。図示したこれらの分枝のうち、上に上がるものは子宮の第三の薄膜を養うためにあり、下方で斜めに走る血管は、動物に接し、それを包む最内の膜を養うものである。この二つの膜は、しばしば子供とともに母親の子宮の外へ出る。それは、動物が膜を破れず、包まれたまま出てくるときに起こる。これは容易に起こることである。前述のように、これら二枚のきわめて薄い膜は、子宮のどの部分にも結びついていないからである。その子宮自体も二枚の膜でできているが、こちらはかなり厚く、肉質で、筋張っている。"

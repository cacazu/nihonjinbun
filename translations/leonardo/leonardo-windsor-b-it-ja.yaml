  "source_text": "La sustanzia de la nuca entra, per alquanto spazio, dentro alle origini de' nervi, e poi seguita il nervo forato, insino alle sua ultime ramificazioni; per la qual perforazione si porta il sentimento in ciascun muscolo, il quale muscolo è composto di tanti minimi altri muscoli, quanto son le fila, ne le quali esso muscolo si po resolvere, e ciascun minimo d'essi muscoli è involto in panniculi quasi insensibili, nelli quali si converte le ultime ramificazioni de' predetti nervi, le quali obbediscano a raccortare il muscolo col loro ritirarsi, e ringrossarlo a ogni requisizione del sentimento, che passa per la vacuità del nervo."
  "source_languages":

    Anatomia.
    Delli nervi che dan sentimento alli mesopleuri, (che escan della nuca).
    [Fig. 139.]
    Li minuti muscoli, situati per obbliquo, discendenti dalla superior parte della spina, e terminanti in verso il pomo granato, questi son detti pleurei, e sono interposti infrall'una e l'altra costa, sol per istrignere li loro intervalli; e li nervi, che dan sentimento a essi muscoli, hanno origine dalla nuca, che passa per la spina della schiena, e 'l lor infimo nascimento della nuca è dove la schiena confina colle reni.

  "translation_ja": "身体に起こる筋はすべて膜へ変わり、その膜は腹部の上を通って、反対側の筋と連続する。横走筋や斜走筋がそうである。しかし縦走筋、すなわち直筋は、剣状突起の高さから恥骨まで肉質のまま走る。また、乳房の筋は胸郭の中央全体から起こり、肩の骨で終わるが、乳房よりいくらか下を通ると膜へ変わり、身体全体を覆う。"

  "translation_status": "draft"
- "id": "B-029r-003"
  "section_id": "B-029r"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Vero è che il muscolo che compone il labbro di sotto ha altri muscoli a lui congiunti, li quali in parte son quelli che lo distendano e [lettura incerta] ritirano al riso; e quel che l'accorta è il muscolo medesimo di che si compone il labbro di sotto, il qual si ristringe traendo li stremi verso il suo proprio mezzo. E il simile accade nel medesimo tempo al labbro di sopra. E altri son li muscoli che [verbo non decifrato] li labbri, e altri che li spianano, e altri son quelli che li ariversciano, e altri gli drizzano, e altri che li storciano in traverso, e altri che li ritornano al suo primo loco. E così sempre fia trovati tanti muscoli quanti sono li accidenti d'essi labbri e altrettanti più, li quali servano al disfare essi accidenti, de' quali qui [lettura incerta] descriverò e figurerò, e prima provando tali moti colli mia principi matematici, ecc."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 393
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 397
  "translation_ja": "下唇を構成する筋肉には、ほかの筋肉が結びついている。その一部は唇を伸ばし、［判読不明］笑うときに引くものである。一方、下唇を短くするのは、それを構成する筋肉そのものであり、この筋肉は両端を自分自身の中央へ引くことで収縮する。同時に上唇にも同じことが起こる。また唇を［動詞判読不明］する筋肉、平らにする筋肉、裏返す筋肉、まっすぐにする筋肉、横にねじる筋肉、初めの位置へ戻す筋肉がある。したがって、唇の変化の数だけ筋肉が見いだされ、さらに、それらの変化を元に戻すための筋肉が同じ数だけ見いだされるであろう。これらについて、ここに［判読不明］記述し図示するが、まず私の数学的原理によって、これらの運動を立証する、等々。"
  "translation_status": "draft"

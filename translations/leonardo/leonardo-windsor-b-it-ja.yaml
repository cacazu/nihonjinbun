  "source_text": "Li animali sanza gambe hanno uno budello diritto, e questo è perchè sempre sta giacente, perchè lo animale non si leva in piedi, perchè non li ha, e se pur si leva, immediate ritorna in piano; ma nell'omo non arebbe loco, pel suo stare assai diritto, perchè subito si voterebbe lo stomaco, se le tortuosità delle intestine non ritardassino il discenso del cibo; e se le budella fussin diritte, ciascuna parte del cibo non sarebbe tocco dalle budella, come gli è nelle budelle tortuose."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 205
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 206
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 207
  "translation_ja": "脚のない動物には、まっすぐな腸がある。それは常に横たわっているからであり、その動物には足がないので立ち上がらず、たとえ身を起こしても、すぐ平らな姿勢へ戻るからである。しかし、かなりの時間直立している人間には、この仕組みは適さない。腸の曲がりくねりが食物の下降を遅らせなければ、胃はすぐ空になってしまうからである。また、腸がまっすぐなら、曲がりくねった腸の場合のように、食物の一つ一つの部分が腸に触れることはないだろう。"
  "translation_status": "draft"
- "id": "B-014v-002"
  "section_id": "B-014v"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "E così rimarrebbe molta sustanzia nutritiva nelle superfruità d'esso cibo, la qual non potrebbe essere succiata dalla sustanzia d'esse budelle, e transportata ne le vene miseraice."
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 205
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 206
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 207
  "translation_ja": "そうすると、その食物の残滓の中に多くの栄養分が残ることになる。それは腸の組織によって吸い取られ、腸間膜の血管へ運ばれることができないからである。"
  "translation_status": "draft"

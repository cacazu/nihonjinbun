  "source_text": "Ma delli discorsi umani stoltissimo è da essere reputato quello, il qual s'astende alla credulità della negromanzia, sorella della archimia, partoritrice delle cose semplici e naturali; ma è tanto più degna di reprensione che l'archimia, quanto ella non partorisce alcuna cosa, se non (lettere e) simili a sè, (parole) cioè bugie, il che non ne interviene nella archimia, la quale è ministratrice de' semplici prodotti dalla natura; il quale ufizio fatto esser non può da essa natura, perchè in lei non è strumenti organici, colli quali essa possa operare quel che adopera l'omo (il quale ha moto locale) mediante le mani, che in tale ufizio ha fatti e vetri, ecc;"

  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 200
  "translation_ja": "したがって、水についての第6巻第5命題により、尿は広く曲がりくねった道を通って膀胱へ入り、膀胱が満ちたあとには尿管も尿で満たされたままになる、と述べよう。人が直立しているかぎり、膀胱の尿が自分自身の液面より高く上がることはできない。しかし横になっていれば、尿はその管を通って逆戻りできるだろう。上下逆さまになれば、なおさらである。逆さになることは少ないが、横になることは多い。"
  "translation_status": "draft"

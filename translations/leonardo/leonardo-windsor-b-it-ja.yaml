  "translation_ja": "人体の内部の器官は、肺を除けば、意志によって止めることができない。見よ、心臓は自らその務めを果たし、胃も、それにつながる他の腸も同様である。肝臓、胆嚢、脾臓、精巣、腎臓、膀胱も同じである。"

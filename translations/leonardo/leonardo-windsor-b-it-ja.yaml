  "translation_ja": "精気の容器、すなわち動脈のところで開いた心臓。M で血液を受け取る、あるいは動脈へ与え、口 B から肺の風によって冷やされ、C から心臓の耳 S を満たす。N は硬い筋肉で、収縮し、心臓の運動の第一の原因となる。収縮すると太くなり、太くなると短くなって、上方と下方のすべての筋肉を引き寄せる。そして門 M を閉じ、心臓の底と尖端の間にある空間を短くし、それによって心臓を空にし、新鮮な空気を自らへ引き込む。"

  "source_text": "(Le radice) La vena, che s’astende infra la porta del fegato e la porta della milza, ha le sue radici con 5 ramificazioni, ramificanti nelle 5 penule del fegato, e a mezzo il suo tronco nasce un ramo, il quale ramifica in nutrimento (del zirbo) della basa del zirbo, e s’astende in tutte le sue parti. E poco più oltre si leva un ramo in alto, e si congiugne alla parte sinistra, inferiore dello stomaco, e poi finisce alquanto più inanzi, con 2 rami, alla congiunzione della milza, e vassi ramificando per la sua quantità."

  "translation_ja": "人が背中を空へ向けて横たわれば、両方の〔編者注：13葉裏の欄外へ続く〕尿管が膀胱へ尿を流し込み、膀胱の上側から入る。これらの管は膀胱の後部につながっており、身体を下向きにしていると、その部分が上になるからである。こうして尿の入口は開いたままになり、膀胱を満たすだけの尿を送り込める。"

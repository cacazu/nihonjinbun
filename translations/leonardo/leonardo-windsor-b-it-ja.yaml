  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 199
  - "source_id": "piumati_1901"
    "precision": "page"
    "pdf_page": 200
  "translation_ja": "しかし、この説明は正しくない。尿が膀胱の中で、その高さのほぼ中央にある入口より高く上がると、すぐにその入口が閉じてしまい、それ以上の尿は膀胱へ入れなくなるはずだからである。そうすると尿は膀胱の容量の半分を決して超えず、残りの部分は無用になるだろう。自然は何一つ無用なものをつくらない。"
  "translation_status": "draft"

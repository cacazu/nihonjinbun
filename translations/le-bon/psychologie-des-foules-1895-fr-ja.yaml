- "id": "b2c2-030"
  "source_text": "Dans l’énumération des facteurs capables d’impressionner l’âme des foules, on pourrait se dispenser entièrement de mentionner la raison, s’il n’était nécessaire d’indiquer la valeur négative de son influence."
  "translation_ja": "群衆の魂に印象を刻むことのできる要因を数え上げるとき、理性の影響が役に立たないことを指摘しておく必要がなかったなら、理性という語はまったく挙げずに済ませてよいはずだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 300
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[307]"
  "section_id": "b2c2s4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-031"
  "source_text": "Nous avons déjà montré que les foules ne sont pas influençables par des raisonnements, et ne comprennent que de grossières associations d’idées. Aussi est-ce à leurs sentiments et jamais à leur raison que font appel les orateurs qui savent les impressionner. Les lois de la logique n’ont aucune action sur elles[15]. Pour convaincre les foules, il faut d’abord se rendre bien compte des sentiments dont elles sont animées, feindre de les partager, puis tenter de les modifier, en provoquant, au moyen d’associations rudimentaires, certaines images bien suggestives ; savoir revenir au besoin sur ses pas, deviner surtout à chaque instant les sentiments qu’on fait naître. Cette nécessité de varier sans cesse son langage suivant l’effet produit à l’instant où l’on parle frappe d’avance d’impuissance tout discours étudié et préparé : l’orateur y suit sa pensée et non celle de ses auditeurs, et, par ce seul fait, son influence devient parfaitement nulle."
  "translation_ja": "群衆は推論に動かされず、ごくおおまかな観念の連想しか理解しないことはすでに示した。それを動かすすべを知る弁士が訴えるのは、したがって群衆の感情であって、理性ではけっしてない。論理の法則は群衆に対して何の作用も持たない［15］。群衆を説得するには、まず、その人々を動かしている感情をつかみ、それに同じているように振る舞う必要がある。次に、ごく単純な連想によって暗示に富むいくつかの像を呼び起こし、その感情を変えてみる。必要とあれば歩みを戻せねばならず、なにより、その瞬間ごとに、自分の言葉がどんな感情を生んでいるかを察しなければならない。話しているその時に生じた効果に合わせ、絶えず言い方を変える必要があるため、練って準備した演説はすべて、あらかじめ無力となる。そうした演説では弁士がたどるのは自分の考えであって聴衆の考えではない。それだけで、その影響力はまったくなくなってしまう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b1c3-004"
  "source_text": "§ 1. — LES IDÉES DES FOULES"
  "translation_ja": "第一節　群衆の思想"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 173
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[37]"
  "section_id": "b1c3s1"

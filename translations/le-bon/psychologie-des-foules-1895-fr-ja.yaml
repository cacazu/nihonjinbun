- "id": "intro-018"
  "source_text": "Quoi qu’il en soit, il faut bien nous résigner à subir le règne des foules, puisque des mains imprévoyantes ont successivement renversé toutes les barrières qui pouvaient les contenir."
  "translation_ja": "いずれにせよ、群衆を押しとどめることのできた柵は、先のことを考えぬ手によって一つまた一つと倒された。私たちは群衆の治世を受け入れる覚悟をするしかない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

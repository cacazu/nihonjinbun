- "id": "b1c1-015"
  "source_text": "Le fait le plus frappant que présente une foule psychologique est le suivant : quels que soient les individus qui la composent, quelque semblables ou dissemblables que soient leur genre de vie, leurs occupations, leur caractère ou leur intelligence, par le fait seul qu’ils sont transformés en foule, ils possèdent une sorte d’âme collective qui les fait sentir, penser, et agir d’une façon tout à fait différente de celle dont sentirait, penserait et agirait chacun d’eux isolément. Il y a des idées, des sentiments qui ne surgissent ou ne se transforment en actes que chez les individus en foule. La foule psychologique est un être provisoire, formé d’éléments hétérogènes qui pour un instant se sont soudés, absolument comme les cellules qui constituent un corps vivant forment par leur réunion un être nouveau manifestant des caractères fort différents de ceux que chacune de ces cellules possède."
  "translation_ja": "心理的群衆についてもっとも目を引く事実はこうだ。どんな人々が構成しようと、その生活の仕方や仕事、性格や知性がどれほど似通い、あるいはかけ離れていようと、群衆に変わったというそれだけのことで、彼らには一種の集団の魂が宿る。それが彼らに、一人ひとりでいるときとはまるで違ったふうに感じ、考え、行動させる。群衆の一部である個人のもとでのみ、芽を出し、あるいは行動に変わる思想や感情がある。心理的群衆とは、ばらばらな要素がつかのま結び合った、仮の一個の存在である。生きた体を構成する細胞が集まると、細胞一つひとつの性質とははなはだ異なる性質を示す、新しい存在が生まれるのと少しも違わない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 89

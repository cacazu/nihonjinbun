- "id": "b2c4-024"
  "source_text": "Et dans les soixante-dix années qui suivent, quels changements encore dans les opinions des foules. La « Perfide Albion » du début de ce siècle devenant l’alliée de la France sous l’héritier de Napoléon ; la Russie, deux fois envahie par nous, et qui avait tant applaudi à nos derniers revers, considérée subitement comme une amie."
  "translation_ja": "それから七十年間にも、群衆の意見はまだなんと大きく変わったことか。今世紀初頭の「背信のアルビオン」ことイギリスが、ナポレオンの後継者のもとでフランスの同盟国となる。私たちが二度にわたって攻め込み、わが国が近ごろ敗北した際は大いに喝采したロシアが、突然、友と考えられるのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 388
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[396]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-025"
  "source_text": "En littérature, en art, en philosophie, les successions d’opinions sont plus rapides encore. Romantisme, naturalisme, mysticisme, etc., naissent et meurent tour à tour. L’artiste et l’écrivain acclamés hier sont profondément dédaignés demain."
  "translation_ja": "文学、芸術、哲学では、意見の交代はいっそう速い。浪漫主義、自然主義、神秘主義等々が相次いで生まれ、死ぬ。昨日は歓呼の的だった芸術家や作家が、明日には深い軽蔑を受ける。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 389
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[397]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-026"
  "source_text": "Mais, quand nous analysons tous ces changements, en apparence si profonds, que voyons-nous ? Tous ceux contraires aux croyances générales et aux sentiments de la race n’ont qu’une durée éphémère, et le fleuve détourné reprend bientôt son cours. Les opinions qui ne se rattachent à aucune croyance générale, à aucun sentiment de la race, et qui, par conséquent, ne sauraient avoir de fixité, sont à la merci de tous les hasards ou, si l’on préfère, des moindres changements de milieu. Formées par suggestion et contagion, elles sont toujours momentanées ; elles naissent et disparaissent parfois aussi rapidement que les dunes de sable formées par le vent au bord de la mer."
  "translation_ja": "だが、これほど深遠なものに見える変化を分析して、私たちは何を見るのか。一般的な信念や人種の感情に反するものは、みなきわめて短命で、向きを変えられた河はまもなく元の流れに戻る。いかなる一般的信念にも、いかなる人種の感情にも結びつかず、それゆえ定着しえない意見は、あらゆる偶然、あるいは言い換えれば、環境のごくわずかな変化のなすがままだ。暗示と伝染で形づくられるそれらはつねに一時的で、ときには浜辺で風がつくる砂丘のように、たちまち生まれ、たちまち消える。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 390
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[398]"

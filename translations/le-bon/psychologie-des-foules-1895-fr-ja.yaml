  "translation_status": "reviewed"
- "id": "b1c4-010"
  "source_text": "Tous les fondateurs de croyances religieuses ou politiques ne les ont fondées que parce qu’ils ont su imposer aux foules ces sentiments de fanatisme qui font que l’homme trouve son bonheur dans l’adoration et l’obéissance et est prêt à donner sa vie pour son idole. Il en a été ainsi à toutes les époques. Dans son beau livre sur la Gaule romaine, Fustel de Coulanges fait justement remarquer que ce ne fut nullement par la force que se maintint l’Empire romain, mais par l’admiration religieuse qu’il inspirait. « Il serait sans exemple dans l’histoire du monde, dit-il avec raison, qu’un régime détesté des populations ait duré cinq siècles… On ne s’expliquerait pas que trente légions de l’Empire eussent pu contraindre cent millions d’hommes à obéir. » S’ils obéissaient, c’est que l’empereur, qui personnifiait la grandeur romaine, était adoré comme une divinité, du consentement unanime. Dans la moindre bourgade de l’Empire, l’empereur avait ses autels. « On vit surgir en ce temps-là dans les âmes, d’un bout de l’Empire à l’autre, une religion nouvelle qui eut pour divinités les empereurs eux-mêmes. Quelques années avant l’ère chrétienne, la Gaule entière, représentée par soixante cités, éleva en commun un temple, près de la ville de Lyon, à Auguste… Ses prêtres, élus par la réunion des cités gauloises, étaient les premiers personnages de leur pays… Il est impossible d’attribuer tout cela à la crainte et à la servilité. Des peuples entiers ne sont pas serviles, et ne le sont pas pendant trois siècles. Ce n’étaient pas les courtisans qui adoraient le prince, c’était Rome. Ce n’était pas Rome seulement, c’était la Gaule, c’était l’Espagne, c’était la Grèce et l’Asie. »"
  "translation_ja": "宗教的、政治的な信仰の創始者がそれを築けたのは、群衆に狂信の感情を抱かせるすべを知っていたからにほかならない。その感情のために、人は崇拝と服従のなかに幸福を見いだし、自分の偶像に命を捧げる用意ができる。どんな時代でもそうだった。フュステル・ド・クーランジュはローマ時代のガリアについての見事な本で、ローマ帝国を存続させたのはけっして力ではなく、帝国が呼び起こした宗教的な敬慕だったと、まことに的確に指摘している。「住民に憎まれた政体が五世紀にわたって続いたとしたら、それは世界の歴史で前例のないことだろう。……帝国の三十軍団が一億の人間を無理に従わせることができたなど、説明のつけようがない」と彼はもっともなことを述べている。彼らが従ったのは、ローマの偉大さを身に体現する皇帝が、だれもが認める神として崇拝されたからである。帝国のどんな小さな町にも、皇帝の祭壇があった。「この時期、帝国の一方の端からもう一方の端まで、人間の魂のなかに、皇帝その人を神とする新しい宗教が現れた。紀元の数年前、六十の都市に代表される全ガリアは、力を合わせ、リヨンの町の近くにアウグストゥスの神殿を建てた。……ガリアの諸都市の会合で選ばれるその祭司は、国で第一等の人々だった。……これらすべてを恐れや卑屈さのせいにすることはできない。民族の全員が卑屈なわけではないし、それが三世紀も続くはずもない。君主を礼拝したのは廷臣ではない。ローマだった。それもローマだけではない。ガリアが、スペインが、ギリシアとアジアがそうしたのだ」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "b1c3-023"
  "source_text": "§ 3. — L’IMAGINATION DES FOULES"
  "translation_ja": "第三節　群衆の想像力"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 192
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[39]"
  "section_id": "b1c3s3"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-024"
  "source_text": "De même que pour les êtres chez qui le raisonnement n’intervient pas, l’imagination représentative des foules est très puissante, très active, et susceptible d’être vivement impressionnée. Les images évoquées dans leur esprit par un personnage, un événement, un accident, ont presque la vivacité des choses réelles. Les foules sont un peu dans le cas du dormeur dont la raison, momentanément suspendue, laisse surgir dans l’esprit des images d’une intensité extrême, mais qui se dissiperaient vite si elles pouvaient être soumises à la réflexion. Les foules, n’étant capables ni de réflexion ni de raisonnement, ne connaissent pas l’invraisemblable : or, ce sont les choses les plus invraisemblables qui sont généralement les plus frappantes."
  "translation_ja": "推論が介入しない者たちと同じく、群衆のうちで何かの像を描き出す想像力は非常に強く、活発で、生々しい印象を受けやすい。ある人物や出来事、事故がその心に呼び起こす像は、現実の物事とほとんど同じくらい鮮やかだ。群衆はいくらか眠っている人に似ている。その人の理性は一時はたらきをやめ、途方もなく強烈な像を心のなかに浮かばせるが、もしその像を省察にかけられれば、じきに消えてゆくはずなのだ。群衆には熟考も推論もできず、ありそうにないということが分からない。しかも概して、もっともありそうにない事柄ほど、もっとも強く人の心を打つのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 193
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[193]"
  "section_id": "b1c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-025"
  "source_text": "Et c’est pourquoi ce sont toujours les côtés merveilleux et légendaires des événements qui frappent le plus les foules. Quand on analyse une civilisation, on voit que c’est, en réalité, le merveilleux et le légendaire qui en sont les vrais supports. Dans l’histoire, l’apparence a toujours joué un rôle beaucoup plus important que la réalité. L’irréel y prédomine toujours sur le réel."
  "translation_ja": "だから、群衆の心をもっとも強く打つのは、いつも出来事の驚異に満ちた面、伝説めいた面である。一つの文明を分析してみれば、実のところ、それを真に支えるものは驚異と伝説だと分かる。歴史にあっては、つねに見かけのほうが現実よりはるかに重要な役割を演じてきた。そこでは実在しないもののほうが、いつも実在するものにまさる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 194
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[194]"
  "section_id": "b1c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-026"
  "source_text": "Les foules, ne pouvant penser que par images, ne se laissent impressionner que par des images. Seules les images les terrifient ou les séduisent, et deviennent des mobiles d’action."
  "translation_ja": "群衆は像によってしか考えられないから、像にしか心を動かされない。群衆をおびえさせ、あるいは引きつけ、行動の動機になるのは像だけである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 195
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[195]"
  "section_id": "b1c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-027"
  "source_text": "Aussi, les représentations théâtrales, qui donnent l’image sous sa forme la plus nettement visible, ont-elles toujours une énorme influence sur les foules. Du pain et des spectacles constituaient jadis pour la plèbe romaine l’idéal du bonheur, et elle ne demandait rien de plus. Pendant la succession des âges cet idéal a peu varié. Rien ne frappe davantage l’imagination des foules de toutes catégories que les représentations théâtrales. Toute la salle éprouve en même temps les mêmes émotions, et si ces émotions ne se transforment pas aussitôt en actes, c’est que le spectateur le plus inconscient ne peut ignorer qu’il est victime d’illusions, et qu’il a ri ou pleuré à d’imaginaires aventures. Parfois cependant les sentiments suggérés par les images sont si forts qu’ils tendent, comme les suggestions habituelles, à se transformer en actes. On a raconté bien des fois l’histoire de ce théâtre populaire qui, ne jouant que des drames sombres, était obligé de faire protéger à la sortie l’acteur qui représentait le traître, pour le soustraire aux violences des spectateurs indignés des crimes, imaginaires pourtant, que ce traître avait commis. C’est là, je crois, un des indices les plus remarquables de l’état mental des foules, et surtout de la facilité avec laquelle on les suggestionne. L’irréel a presque autant d’action sur elles que le réel. Elles ont une tendance évidente à ne pas les différencier."
  "translation_ja": "だから、像をもっともはっきり目に見える形で差し出す芝居は、いつも群衆にとてつもない影響を及ぼす。かつてローマの平民にとって幸福の理想とはパンと見世物であり、それ以上は何ひとつ望まなかった。時代がいくつも過ぎても、この理想はほとんど変わらない。どんな種類の群衆の想像力をも、演劇ほど強く打つものはない。客席全部が同時に同じ感動を味わう。それがたちまち行為に変わらないのは、どんなに我を忘れた見物人でも、自分が幻のとりこになり、ありもしない冒険を見て笑い、あるいは泣いたということは、知らずにはいられないからだ。それでもときには、像の暗示する感情が強すぎて、ふだんの暗示のように行為に変わりかける。よく語られてきた、ある民衆劇場の話がある。陰惨な芝居ばかりをかける劇場で、終演後、裏切り者を演じた俳優に護衛をつけてやらねばならなかった。裏切り者の犯した罪はもちろん架空のものなのに、憤慨した見物人たちの乱暴から守るためだった。これは私の考えでは、群衆の心の状態、とりわけその暗示のかかりやすさを示す、もっとも際立ったしるしの一つだ。非現実のものは、現実のものとほとんど同じほど群衆に作用する。その両者を区別しようとしない明らかな傾きが群衆にはある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 196
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[196]"
  "section_id": "b1c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-028"
  "source_text": "C’est sur l’imagination populaire qu’est fondée la puissance des conquérants et la force des États. C’est surtout en agissant sur elle qu’on entraîne les foules. Tous les grands faits historiques, la création du Bouddhisme, du Christianisme, de l’Islamisme, la Réforme, la Révolution, et, de nos jours, l’invasion menaçante du Socialisme, sont les conséquences directes ou lointaines d’impressions fortes produites sur l’imagination des foules."
  "translation_ja": "征服者の権力と国家の力がその上に築かれているのは、民衆の想像力である。群衆が引き動かされるのは、とりわけその想像力に働きかけられたときだ。歴史上のあらゆる大事件、仏教、キリスト教、イスラム教の成立、宗教改革、フランス革命、そして今日なら社会主義が脅威となるほど押し寄せていること、これらはみな群衆の想像力に強い印象が刻まれたことの、直接または遠い結果である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 197
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[197]"
  "section_id": "b1c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-029"
  "source_text": "Aussi, tous les grands hommes d’État de tous les âges et de tous les pays, y compris les plus absolus despotes, ont-ils considéré l’imagination populaire comme la base de leur puissance, et jamais ils n’ont essayé de gouverner contre elle. « C’est en me faisant catholique, disait Napoléon au Conseil d’État, que j’ai fini la guerre de Vendée ; en me faisant musulman que je me suis établi en Égypte, en me faisant ultramontain que j’ai gagné les prêtres en Italie. Si je gouvernais un peuple de Juifs, je rétablirais le temple de Salomon. » Jamais, peut-être, depuis Alexandre et César, aucun grand homme n’a mieux su comment l’imagination des foules doit être impressionnée. Sa préoccupation constante fut de la frapper. Il y songeait dans ses victoires, dans ses harangues, dans ses discours, dans tous ses actes. À son lit de mort il y songeait encore."
  "translation_ja": "だからもっとも絶対的な専制君主を含め、どの時代、どの国の大政治家も、民衆の想像力を自分の権力の土台とみなし、これに逆らって治めようとしたことは一度もない。ナポレオンは国務院でこう語った。「私がヴァンデの戦争を終わらせたのは、自分がカトリック教徒になったからだ。エジプトに地歩を築いたのはイスラム教徒になったからで、イタリアで聖職者を味方にできたのは教皇至上主義者になったからだ。もしユダヤの民を治めるのであれば、私はソロモンの神殿を再建するだろう」。アレクサンドロスとカエサル以来、群衆の想像力をどう動かすべきかを彼以上によく知った偉人は、おそらくただの一人もいなかった。その想像力に衝撃を与えることが、彼のつねに心を砕くところだった。勝利の際にも、軍への訓示でも、演説でも、あらゆる行いにおいてそれを考えていた。死の床でさえ、まだそれを考えていた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 198

- "id": "intro-003"
  "source_text": "Évolution de l’âge actuel. — Les grands changements de civilisation sont la conséquence de changements dans la pensée des peuples. — La croyance moderne à la puissance des foules. — Elle transforme la politique traditionnelle des États. — Comment se produit l’avènement des classes populaires et comment s’exerce leur puissance. — Conséquences nécessaires de la puissance des foules. — Elles ne peuvent exercer qu’un rôle destructeur. — C’est par elles que s’achève la dissolution des civilisations devenues trop vieilles. — Ignorance générale de la psychologie des foules. — Importance de l’étude des foules pour les législateurs et les hommes d’État."
  "translation_ja": "現代はどこへ向かうか。文明の大きな変化は、諸民族の考え方が変わった結果である。群衆の力に対する近代の信仰。それが諸国家の伝統的な政治を変える。民衆の諸階級はどのように台頭し、いかに力を振るうのか。群衆の力が必然的にもたらすもの。群衆に果たせるのは破壊の役割だけである。老いすぎた文明の解体にとどめを刺すのは群衆である。群衆の心理が一般に知られていないこと。立法者や政治家にとっての群衆研究の重要性。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 49
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[22]"

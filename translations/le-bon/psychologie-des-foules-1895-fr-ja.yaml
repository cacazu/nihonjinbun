  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-016"
  "source_text": "Nous avons dit, en définissant les foules, qu’un de leurs caractères généraux est une suggestibilité excessive, et nous avons montré combien, dans toute agglomération humaine, une suggestion est contagieuse ; ce qui explique l’orientation rapide des sentiments dans un sens déterminé."
  "translation_ja": "群衆の定義にあたって、その一般的な性質の一つは暗示をひどく受けやすいことだと述べた。また、人の集まりならどんなもののなかでも、暗示がどれほど伝染しやすいかを示した。感情がたちまち一定の方向にそろうのも、そのためだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

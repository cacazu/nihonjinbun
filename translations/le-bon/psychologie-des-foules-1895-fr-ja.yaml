- "id": "b1c4-007"
  "source_text": "On n’est pas religieux seulement quand on adore une divinité, mais quand on met toutes les ressources de l’esprit, toutes les soumissions de la volonté, toutes les ardeurs du fanatisme au service d’une cause ou d’un être qui devient le but et le guide des pensées et des actions."
  "translation_ja": "神を礼拝するときだけ、人は宗教的なのではない。一つの大義なり一つの存在なりが、考えと行いの目標となり、導き手となり、それに心のあらゆる力、意志のありったけの服従、狂信のもえる熱をすべて捧げるとき、人は宗教的である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 208
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[210]"
  "section_id": "b1c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c4-008"
  "source_text": "L’intolérance et le fanatisme constituent l’accompagnement nécessaire d’un sentiment religieux. Ils sont inévitables chez ceux qui croient posséder le secret du bonheur terrestre ou éternel. Ces deux traits se retrouvent chez tous les hommes en groupe lorsqu’une conviction quelconque les soulève. Les Jacobins de la Terreur étaient aussi foncièrement religieux que les catholiques de l’Inquisition, et leur cruelle ardeur dérivait de la même source."
  "translation_ja": "不寛容と狂信は、宗教感情に必然的に付きまとうものである。この世での幸福、あるいは永遠の幸福の秘訣をつかんだと信じる者には、避けようがない。なんらかの確信が集団を奮い立たせるとき、そこにいる者のだれにも、この二つの特徴が現れる。恐怖政治のジャコバン派は、異端審問のカトリック教徒と同じほど根っから宗教的であり、その残酷な熱意は同じ源から出ていた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 209
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[211]"
  "section_id": "b1c4"

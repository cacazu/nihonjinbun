- "id": "b2c2-019"
  "source_text": "Ils correspondent en réalité à des idées et des images tout à fait opposées dans les âmes latines et dans les âmes anglo-saxonnes. Chez les Latins le mot démocratie, signifie surtout effacement de la volonté et de l’initiative de l’individu devant celles de la communauté représentées par l’État. C’est l’État qui est chargé de plus en plus de diriger tout, de centraliser, de monopoliser et de fabriquer tout. C’est à lui que tous les partis sans exception, radicaux, socialistes ou monarchistes, font constamment appel. Chez l’Anglosaxon, celui d’Amérique notamment, le même mot démocratie signifie au contraire développement intense de la volonté et de l’individu, effacement aussi complet que possible de l’État, auquel en dehors de la police, de l’armée et des relations diplomatiques, on ne laisse rien diriger, pas même l’instruction. Donc le même mot qui signifie, chez un peuple, effacement de la volonté et de l’initiative individuelle et prépondérance de l’État, signifie chez un autre développement excessif de cette volonté, de cette initiative, et effacement complet de l’État[12]."
  "translation_ja": "実際、ラテン系の人々の魂とアングロサクソン系の人々の魂で、これらが表す観念や像はまったく反対である。ラテン系の人々にとって民主主義という語が何よりも意味するのは、国家が代表する共同体の意志と自発性の前に、個人の意志と自発性が姿を消すことだ。何もかもを指揮し、集権化し、独占し、製造する任をますます負わされるのが国家である。急進派も社会主義者も王党派も、例外なくすべての党派が絶えずそれに訴える。これに対しアングロサクソン人、とりわけアメリカの人々において、同じ民主主義という言葉が意味するのは、意志と個人の力強い発達と、できるかぎり徹底した国家の後退である。そこでは警察、軍隊、外交関係のほか、何一つ国家には指揮させず、教育でさえ委ねない。してみれば、ある民族においては個人の意志と自発性が消え、国家が卓越することを意味する同じ語が、別の民族においては、その意志と自発性が度を越すほど発達し、国家がすっかり退くことを意味するのである［12］。"
  "source_languages":
  - "fr"
  "source_locations":

  "translation_status": "reviewed"
- "id": "b2c2-015"
  "source_text": "Les mots n’ont donc que des significations mobiles et transitoires, changeantes d’âge en âge et de peuple à peuple ; et, quand nous voulons agir par eux, sur la foule, ce qu’il faut savoir, c’est le sens qu’ils ont pour elle à un moment donné, et non celui qu’ils eurent jadis ou qu’ils peuvent avoir pour des individus de constitution mentale différente."
  "translation_ja": "だから言葉が持つのは動きやすく一時的な意味だけで、時代ごと、民族ごとに変わる。その言葉で群衆に働きかけようとするとき、知らねばならないのは、ある時点でその群衆にとってどんな意味があるかであって、かつてどういう意味だったかでも、心のつくりの違う個人にとってどんな意味を持ちうるかでもない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b3c4-004"
  "source_text": "Les foules électorales, c’est-à-dire les collectivités appelées à élire les titulaires de certaines fonctions, constituent des foules hétérogènes ; mais, comme elles n’agissent que sur un point bien déterminé : choisir entre divers candidats, on ne peut observer chez elles que quelques-uns des caractères précédemment décrits. Les caractères des foules qu’elles manifestent surtout, sont la faible aptitude au raisonnement, l’absence d’esprit critique, l’irritabilité, la crédulité et le simplisme. On découvre aussi dans leurs décisions l’influence des meneurs et le rôle des facteurs que nous avons énumérés : l’affirmation, la répétition, le prestige et la contagion."
  "translation_ja": "ある公の職の担い手を選ぶために呼び集められる集団、すなわち選挙の群衆は、異質な群衆をなす。しかし行動するのはきわめて限定された一点、複数の候補者から選ぶことに限られるため、すでに述べた特徴のうち、観察できるのはいくつかだけである。とくにはっきり現れる群衆の性質は、推論の不得手、批判精神の欠如、怒りやすさ、信じやすさ、単純きわまるものの考え方である。その決定にも指導者の影響と、すでに挙げた要因、すなわち断言、反復、威信、伝染の役割を見て取ることができる。"
  "source_languages":
  - "fr"
  "source_locations":

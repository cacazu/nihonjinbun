  "translation_status": "reviewed"
- "id": "b3c5-039"
  "source_text": "Il parle, et, tout de suite il est surpris du mouvement de la salle, un peu agacé par le brouhaha qui s’en élève."
  "translation_ja": "話しだすと、たちまち彼は場内のざわめきに驚き、そこから立ちのぼる騒がしさに少々気を悪くする。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 537
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[547]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-040"
  "source_text": "Comment le silence ne se fait-il pas ? Pourquoi cette inattention générale ? À quoi pensent donc ceux-là qui causent entre eux ? Quel motif si urgent fait quitter sa place à cet autre ?"
  "translation_ja": "なぜ静かにならない？　なぜだれも耳を貸さない？　あそこでおしゃべりをしている連中は、いったい何を考えているのだ？　そっちの男は、どんな急用で席を立つのか？"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 538
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[548]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-041"
  "source_text": "Une inquiétude passe sur son front. Il fronce les sourcils, s’arrête. Encouragé par le président, il repart, haussant la voix. On ne l’en écoute que moins. Il force le ton, il s’agite : le bruit redouble autour de lui. Il ne s’entend plus lui-même, s’arrête encore ; puis, craignant que son silence ne provoque le fâcheux cri de : Clôture ! il reprend de plus belle. Le vacarme devient insupportable. »"
  "translation_ja": "額に不安の色がよぎる。眉をひそめ、言葉を切る。議長に励まされ、声を高めてやり直す。いよいよ耳を貸してもらえない。声を張り、身ぶりを大きくする。周囲の物音は倍になる。自分の声さえ聞こえなくなり、また黙る。だが黙っていて、嫌な『討論終結！』の声を誘いはしないかと恐れ、前にも増して勢いよく話しはじめる。騒音はもう耐えがたい。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

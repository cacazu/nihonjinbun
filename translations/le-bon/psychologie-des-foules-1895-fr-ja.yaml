- "id": "b3c4-022"
  "source_text": "On pourrait se demander comment, dans des conditions pareilles, peut se former l’opinion d’un électeur ? Mais poser une pareille question serait se faire une étrange illusion sur le degré de liberté dont peut jouir une collectivité. Les foules ont des opinions imposées, jamais des opinions raisonnées. Dans le cas qui nous occupe, les opinions et les votes des électeurs sont entre les mains de comités électoraux, dont les meneurs sont le plus souvent quelques marchands de vins, fort influents sur les ouvriers, auxquels ils font crédit. « Savez-vous ce qu’est un comité électoral, écrit un des plus vaillants défenseurs de la démocratie actuelle, M. Schérer ? Tout simplement la clef de nos institutions, la maîtresse pièce de la machine politique. La France est aujourd’hui gouvernée par les comités[24]."
  "translation_ja": "こういう条件で有権者の意見はどうしてできるのか、と人は問うかもしれない。だがそう問うのは、集団がどれほどの自由を享受できるかについて奇妙な幻想を抱くことになる。群衆の意見は押しつけられた意見であって、考えて得た意見では決してない。今の場合、有権者の意見と投票を手に握るのは選挙委員会であり、その指導者はたいてい幾人かの酒商で、つけで飲ませてやる労働者たちに大きな影響力を持っている。現行の民主主義をもっとも勇敢に擁護する一人、シェレール氏は書く。「選挙委員会とは何かご存じか。まさにわが制度のかなめ、政治機械のもっとも重要な部品だ。フランスは今日、委員会によって治められている［24］」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 488
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[498]"

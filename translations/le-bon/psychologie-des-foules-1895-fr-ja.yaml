- "id": "intro-026"
  "source_text": "Notre étude de l’âme des foules ne pourra être qu’une brève synthèse, un simple résumé de nos recherches. Il ne faut lui demander que quelques vues suggestives. D’autres creuseront davantage le sillon. Nous ne faisons aujourd’hui, que le tracer sur un terrain bien vierge encore."
  "translation_ja": "ここでおこなう群衆の魂の研究は、ごく短い総合、私たちの研究のあらましにとどまる。そこには、考えるきっかけになる見方のいくつか以上のものを求めないでいただきたい。畝をもっと深く掘るのは後の人だ。今は、まだほとんど手の入っていない土地に、最初の畝を引くばかりである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

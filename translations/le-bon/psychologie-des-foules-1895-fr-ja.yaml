- "id": "b1c3-018"
  "source_text": "§ 2. — LES RAISONNEMENTS DES FOULES"
  "translation_ja": "第二節　群衆の推論"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 187
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[38]"
  "section_id": "b1c3s2"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-019"
  "source_text": "On ne peut dire d’une façon tout à fait absolue que les foules ne raisonnent pas et ne sont pas influençables par des raisonnements. Mais les arguments quelles emploient et ceux qui peuvent agir sur elles sont, au point de vue logique, d’un ordre tellement inférieur que c’est seulement par voie d’analogie qu’on peut les qualifier de raisonnements."
  "translation_ja": "群衆は推論せず、推論に心を動かされることもないとは、一切の例外を認めずに言い切れるわけではない。しかし群衆が用いる論拠、また群衆に働きかけうる論拠は、論理という見地からするとあまりにも程度が低いので、似たものにたとえる意味でしか、推論とは呼べない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 188
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[188]"
  "section_id": "b1c3s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-020"
  "source_text": "Les raisonnements inférieurs des foules sont, comme les raisonnements élevés, basés sur des associations ; mais les idées associées par les foules n’ont entre elles que des liens apparents d’analogie ou de succession. Elles s’enchaînent comme celles de l’Esquimau qui, sachant par expérience que la glace, corps transparent, fond dans la bouche, en conclut que le verre, corps également transparent, doit fondre aussi dans la bouche ; ou celles du sauvage qui se figure qu’en mangeant le cœur d’un ennemi courageux, il acquiert sa bravoure ; ou encore de l’ouvrier qui, ayant été exploité par un patron, en conclut immédiatement que tous les patrons sont des exploiteurs."
  "translation_ja": "群衆の程度の低い推論も、高度な推論と同じく連想に基づいている。だが群衆が結びつける観念は、見かけのうえで似ているか、続いて起きたかというつながりしか持たない。その連なり方は、透明な物質である氷が口の中でとけると経験で知り、やはり透明な物質であるガラスもきっと口の中でとけると結論するエスキモーの観念の連なりに似ている。また、勇敢な敵の心臓を食べればその勇敢さを得られると思い込む、いわゆる野蛮人の連想にも、あるいは一人の雇い主に搾取されたので、たちまち、すべての雇い主は搾取者だと結論する労働者の連想にも似ている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 189
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[189]"
  "section_id": "b1c3s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-021"
  "source_text": "Association de choses dissemblables, n’ayant entre elles que des rapports apparents, et généralisation immédiate de cas particuliers, telles sont les caractéristiques des raisonnements des foules. Ce sont des raisonnements de cet ordre que leur présentent toujours ceux qui savent les manier ; ce sont les seuls qui peuvent les influencer. Une chaîne de raisonnements logiques est totalement incompréhensible aux foules, et c’est pourquoi il est permis de dire qu’elles ne raisonnent pas ou raisonnent faux, et ne sont pas influençables par un raisonnement. On s’étonne parfois, à la lecture, de la faiblesse de certains discours qui ont eu pourtant une influence énorme, sur les foules qui les écoutaient ; mais on oublie qu’ils furent faits pour entraîner des collectivités, et non pour être lus par des philosophes. L’orateur, en communication intime avec la foule, sait évoquer les images qui la séduisent. S’il réussit, son but a été atteint ; et vingt volumes de harangues — toujours fabriquées après coup — ne valent pas les quelques phrases arrivées jusqu’aux cerveaux qu’il fallait convaincre."
  "translation_ja": "見かけだけの関係しかなく、それ自体は似ていないものを結びつけ、個々の場合を即座に一般化すること。これが群衆の推論の特徴である。群衆の扱いを知る者がいつも提示するのもこの種の推論であり、群衆に影響を与えうるのはこれだけだ。一連の論理的な推論など、群衆には皆目理解できない。だから群衆は推論をしないか、しても間違えるのであり、理を説いたところで動かされないと言ってよい。聞いていた群衆に途方もない影響を与えた演説なのに、読んでみるとその弱々しさに驚くことがある。だがそれは、集団を動かすために作られたのであって、哲学者に読んでもらうためのものではなかったことを忘れている。群衆と心を通わせている弁士は、その心をとらえる像を呼び起こすすべを知っている。それに成功すれば目的は達した。演説集を二十巻、しかも例によってすべて事後にでっちあげたところで、説得すべき相手の頭に届いたほんの数句には及ばない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b1c2-024"
  "source_text": "Ne voulant pas cependant laisser le lecteur sous l’impression d’assertions sans preuves, je vais lui donner quelques exemples pris au hasard parmi les monceaux de ceux que l’on pourrait citer."
  "translation_ja": "とはいえ、根拠のない断言ばかりだったという印象を残したくはない。挙げうる山ほどの例から、手近なものをいくつかお目にかけよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

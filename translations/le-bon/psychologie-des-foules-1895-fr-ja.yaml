- "id": "b2c1-048"
  "source_text": "L’illustre pyschologue nous montre ensuite la différence de notre système avec celui des Anglo-Saxons. Ces derniers ne possèdent pas nos innombrables écoles spéciales ; chez eux l’enseignement n’est pas donné par le livre, mais par la chose elle-même. L’ingénieur, par exemple, se forme dans un atelier et jamais dans une école ; ce qui permet à chacun d’arriver exactement au degré que comporte son intelligence, ouvrier ou contremaître s’il ne peut aller plus loin, ingénieur si ses aptitudes l’y conduisent. C’est là un procédé autrement démocratique et autrement utile pour la société que de faire dépendre toute la carrière d’un individu d’un concours de quelques heures subi à dix-huit ou vingt ans."
  "translation_ja": "その著名な心理家は、続いてわが国の制度とアングロサクソン人の制度との違いを示す。後者には、わが国にある無数の専門学校はない。そこで教えるのは書物ではなく、ものそのものだ。たとえば技師は工場で育つのであって、学校で育つことはない。そのため、それ以上進めないなら労働者なり職長なり、適性がそこまで導くなら技師なりと、各人がちょうどその知性のおよぶ段階にまで達することができる。十八歳か二十歳で受ける数時間の競争試験に一個人の生涯の道をまるごとかけるのと比べれば、こちらはよほど民主的で、社会にとってよほど有益な方法である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

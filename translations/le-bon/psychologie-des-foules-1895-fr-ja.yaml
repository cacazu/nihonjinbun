  "translation_status": "reviewed"
- "id": "b1c1-031"
  "source_text": "Et ce n’est pas seulement par ses actes que l’individu en foule diffère essentiellement de lui-même. Avant même qu’il ait perdu toute indépendance, ses idées et ses sentiments se sont transformés, et la transformation est profonde au point de changer l’avare en prodigue, le sceptique en croyant, l’honnête homme en criminel, le poltron en héros. La renonciation à tous ses privilèges que, dans un moment d’enthousiasme, la noblesse vota pendant la fameuse nuit du 4 août 1789, n’eût certes jamais été acceptée par aucun de ses membres pris isolément."
  "translation_ja": "群衆のなかの個人が、もとの自分と根本から違ってくるのは、行為においてだけではない。まだ独立性を失いきらないうちに、その考えと感情はもう変わっている。その変わり方は深く、けちを浪費家に、懐疑家を信者に、正直者を犯罪者に、臆病者を英雄に変えるほどだ。名高い一七八九年八月四日の夜、貴族たちは一時の熱狂のうちに、一切の特権を放棄することを票決した。一人ひとりに別々に問うていたら、だれ一人として承知しなかったにちがいない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 105
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[107]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-032"
  "source_text": "Concluons de ce qui précède, que la foule est toujours intellectuellement inférieure à l’homme isolé, mais que, au point de vue des sentiments et des actes que ces sentiments provoquent, elle peut, suivant les circonstances, être meilleure ou pire. Tout dépend de la façon dont la foule est suggestionnée. C’est là ce qu’ont parfaitement méconnu les écrivains qui n’ont étudié les foules qu’au point de vue criminel. La foule est souvent criminelle, sans doute, mais souvent aussi elle est héroïque. Ce sont surtout les foules qu’on amène à se faire tuer pour le triomphe d’une croyance ou d’une idée, qu’on enthousiasme pour la gloire et l’honneur, qu’on entraîne presque sans pain et sans armes comme à l’âge des croisades, pour délivrer de l’infidèle le tombeau d’un Dieu, ou comme en 93, pour défendre le sol de la patrie. Héroïsmes un peu inconscients, sans doute, mais c’est avec ces héroïsmes-là que se fait l’histoire. S’il ne fallait mettre à l’actif des peuples que les grandes actions froidement raisonnées, les annales du monde en enregistreraient bien peu."
  "translation_ja": "以上からこう結論しよう。知性において群衆はつねに単独の個人より劣るが、感情と、その感情が起こす行いにおいては、事情に応じて個人よりよくも悪くもなりうる。すべてが、群衆にどのような暗示が働くかにかかっている。犯罪という面からしか群衆を調べなかった著述家たちが、まったく見落としてきたのはそこなのだ。群衆がしばしば犯罪に走るのはたしかだが、それと同じくしばしば英雄的でもある。一つの信仰や理念の勝利のために命を投げ出すよう駆り立てられ、栄光と名誉のために熱狂し、十字軍の時代のように神の墓を異教徒から解放するため、あるいは一七九三年のように祖国の土を守るため、ろくにパンも武器もないまま連れ立って進むのは、何よりも群衆である。いささか無自覚な英雄的行為だ、と言われるかもしれない。だが歴史をつくるのはまさしくそうした英雄的行為である。冷静な熟慮から出た偉業だけを諸民族の功績に数えねばならないとしたら、世界の年代記に載るものはじつにわずかであろう。"

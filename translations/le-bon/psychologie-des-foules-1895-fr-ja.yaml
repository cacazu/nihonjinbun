    "message_ja": "この段落の暴力の実行手段に当たる記載は原文・訳文とも非収録。原著の欠損ではない。"
- "id": "b3c2-016"
  "source_text": "Les massacreurs sont d’ailleurs fort scrupuleux, et manifestent la moralité dont nous avons déjà signalé l’existence au sein des foules. Ils refusent de s’emparer de l’argent et des bijoux des victimes, et les rapportent sur la table des comités."
  "translation_ja": "その一方で、虐殺者たちはじつに律義で、群衆のなかにあるとすでに指摘した道徳性を示す。犠牲者の金や宝石を奪い取ることを拒み、委員会の机に届けるのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 446
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[451]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-017"
  "source_text": "Dans tous leurs actes, on retrouve toujours ces formes rudimentaires de raisonnement, caractéristiques de l’âme des foules. C’est ainsi qu’après l’égorgement des 12 ou 1500 ennemis de la nation, quelqu’un fait observer, et immédiatement sa suggestion est acceptée, que les autres prisons, celles qui contiennent de vieux mendiants, des vagabonds, des jeunes détenus, renferment en réalité des bouches inutiles, et dont il serait bon, pour cette raison, de se débarrasser. D’ailleurs il doit y avoir certainement parmi eux des ennemis du peuple, tels, par exemple, qu’une certaine dame Delarue, veuve d’un empoisonneur : « Elle doit être furieuse d’être en prison ; si elle pouvait, elle mettrait le feu à Paris ; elle doit l’avoir dit, elle l’a dit. Encore un coup de balai. » La démonstration paraît évidente, et tout est massacré en bloc, y compris une cinquantaine d’enfants de douze à dix-sept ans, qui, d’ailleurs, eux-mêmes auraient pu devenir des ennemis de la nation, et dont par conséquent il y avait un intérêt évident à se débarrasser."
  "translation_ja": "彼らのあらゆる行いには、群衆の魂を特徴づける、あのごく初歩的な推論の形がいつも見いだされる。たとえば国民の敵とされた千二百人か千五百人を殺した後のことだ。だれかが、別の監獄にいる年老いた物乞い、浮浪者、若い囚人は結局むだ飯食いであり、だから片づけるのがよいと言い出し、ただちにその暗示が受け入れられる。それに、なかにはきっと民衆の敵がいるはずだという。たとえば、ある毒殺犯の未亡人ドラリュという女がそうだ、と。「牢に入れられてさぞ腹を立てていよう。できることならパリに火をつけるに違いない。きっとそう言ったに違いない。そう言ったのだ。もうひと掃きだ」。これで論証は明白に思え、一同はまとめて殺された。十二歳から十七歳までの子どもおよそ五十人も含まれていた。この子らもやがて国民の敵になったかもしれない、だから始末しておくことには明らかな利益がある、というわけだ。"
  "source_languages":

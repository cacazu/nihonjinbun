  "translation_status": "reviewed"
- "id": "b1c1-007"
  "source_text": "Il est visible que ce n’est pas par le fait seul que beaucoup d’individus se trouvent accidentellement côte à côte, qu’ils acquièrent les caractères d’une foule organisée. Mille individus accidentellement réunis sur une place publique sans aucun but déterminé, ne constituent nullement une foule au point de vue psychologique. Pour en acquérir les caractères spéciaux, il faut l’influence de certains excitants dont nous aurons à déterminer la nature."
  "translation_ja": "多くの人がたまたま隣り合ったというだけで、組織をなした群衆の性質を身につけるわけではないのは明らかだ。特定の目的もなく、たまたま広場に集まった千人は、心理学上の意味ではまるで群衆をなさない。群衆に特有の性質を帯びるには、ある種の刺激の働きが必要である。その刺激が何であるかはこれから明らかにしよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 81
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[83]"
  "section_id": "b1c1"

- "id": "b2c3-057"
  "source_text": "Entre les termes les plus éloignés de cette série, on placerait toutes les formes du prestige dans les divers éléments d’une civilisation : sciences, arts, littérature, etc., et l’on verrait qu’il constitue l’élément fondamental de la persuasion. Consciemment ou non, l’être, l’idée ou la chose possédant du prestige sont par voie de contagion imités immédiatement et imposent à toute une génération certaines façons de sentir et de traduire leur pensée. L’imitation est d’ailleurs le plus souvent inconsciente, et c’est précisément ce qui la rend parfaite. Les peintres modernes, qui reproduisent les couleurs effacées et les attitudes rigides de certains primitifs, ne se doutent guère d’où vient leur inspiration ; ils croient à leur propre sincérité, alors que si un maître éminent n’avait pas ressuscité cette forme d’art, on aurait continué à n’en voir que les côtés naïfs et inférieurs. Ceux qui, à l’instar d’un autre maître illustre, inondent leurs toiles d’ombres violettes, ne voient pas dans la nature plus de violet qu’on n’en voyait il y a cinquante ans, mais ils sont suggestionnés par l’impression personnelle et spéciale d’un peintre qui, malgré cette bizarrerie, sut acquérir un grand prestige. Dans tous les éléments de la civilisation, de tels exemples pourraient être aisément invoqués."
  "translation_ja": "この系列の遠く隔たった両端のあいだに、科学、芸術、文学など、文明をなす種々の要素のなかで威信が取るあらゆる形を置けば、それが説得の根本の要素をなすことが分かるだろう。意識していようといまいと、威信ある存在、思想、事物は、伝染を通じてたちまち模倣され、ある感じ方や、考えを表す仕方を、ひとつの世代まるごとに押しつける。模倣自体も多くは無意識で、まさにそれが模倣を完璧にする。初期の画家たちのある者が用いたくすんだ色や硬直した姿勢を写す近代の画家は、その霊感がどこから来るかなど気づきもしない。自分の誠実さを信じているが、もしある卓越した巨匠がその芸術の形を復活させていなかったら、今もその素朴で稚拙な側面しか見られていなかっただろう。別の有名な巨匠にならい、画布を紫の影で埋め尽くす画家たちの目にも、自然のなかに五十年前に人が見たより多くの紫が見えているわけではない。あの奇抜さにもかかわらず大きな威信を得た画家の、個人的、独特な印象に暗示を受けているのだ。同じような例は、文明のあらゆる要素でたやすく挙げられよう。"

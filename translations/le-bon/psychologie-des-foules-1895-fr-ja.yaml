- "id": "b3c4-019"
  "source_text": "N’imaginons pas un instant que ce genre de discussion soit spécial à une classe déterminée d’électeurs, et dépende de leur situation sociale. Dans toute assemblée anonyme, quelle qu’elle soit, fût-elle exclusivement composée de lettrés, la discussion revêt facilement les mêmes formes. J’ai montré que les hommes en foule tendent vers l’égalisation mentale, et à chaque instant nous en retrouvons la preuve. Voici, comme exemple, un extrait du compte rendu d’une réunion exclusivement composée d’étudiants, que j’emprunte au journal le Temps du 13 février 1895 :"
  "translation_ja": "このたぐいの討論が特定の有権者階級だけに見られ、その社会的地位で決まるなどと、一瞬たりとも思ってはならない。どんな無名の集会でも、たとえ一人残らず文人であっても、議論はたやすく同じ形を取る。群衆で人間の心は均される方向に向かうとはすでに示したが、その証拠には絶えず出会う。一例として、一八九五年二月十三日付の『ル・タン』紙から、学生だけの集会の報告の一部を借りよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

  "translation_status": "reviewed"
- "id": "b3c5-047"
  "source_text": "« Les divisions, les jalousies, les soupçons, et tour à tour la confiance aveugle et les espoirs illimités ont conduit le parti républicain à sa perte. Sa naïveté et sa candeur n’avaient d’égale que sa défiance universelle. Aucun sens de la légalité, nulle intelligence de la discipline : des terreurs et des illusions sans bornes : le paysan et l’enfant se rencontrent en ce point. Leur calme rivalise avec leur impatience. Leur sauvagerie est pareille à leur docilité. C’est le propre d’un tempérament qui n’est point fait et d’une éducation absente. Rien ne les étonne et tout les déconcerte. Tremblants, peureux, intrépides, héroïques, ils se jetteront à travers les flammes et ils reculeront devant une ombre."
  "translation_ja": "「分裂、嫉妬、疑惑、かわるがわる現れる盲目的な信頼と際限のない希望が、共和党を破滅させた。そのあどけなさとお人よしぶりに匹敵するものは、何にでも疑いをかけるその不信感しかなかった。合法性の感覚もなく、規律とは何かも分からない。恐れも、幻想も、とめどがない。農夫と子どもはこの点で似ている。その落ち着きぶりは、気の短さに負けず劣らずだ。従順なときと同じほど荒々しくもある。まだ固まっていない気質と、何の教育も受けていないことの特色だ。何事にも驚かず、何にでもまごつく。おののき、怖がり、大胆不敵に、英雄のようになり、猛火の中には身を投じるのに、影を前にするとたじろぐ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 545
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[555]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-048"
  "source_text": "« Ils ne connaissent point les effets et les rapports des choses. Aussi prompts aux découragements qu’aux exaltations, sujets à toutes les paniques, toujours trop haut ou trop bas, jamais au degré qu’il faut et dans la mesure qui convient. Plus fluides que l’eau, ils reflètent toutes les couleurs et prennent toutes les formes. Quelle base de gouvernement pouvait-on espérer d’asseoir en eux ? »"
  "translation_ja": "「物事のもたらす結果も、それらの相互の関係も分かっていない。すぐに意気消沈し、同じくらいすぐに意気が上がる。何にでも恐慌を来し、いつも高すぎるか低すぎるかで、適度に、頃合いよく、ということがけっしてない。水よりも流れやすく、あらゆる色を映し、どんな形にもなる。これを土台に、どんな政府を打ち立てる望みがもてただろう。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 546
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[556]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-049"
  "source_text": "Il s’en faut de beaucoup heureusement que tous les caractères que nous venons de décrire dans les assemblées parlementaires se manifestent constamment. Elles ne sont foules qu’à certains moments. Les individus qui les composent arrivent à garder leur individualité dans un grand nombre de cas ; et c’est pourquoi une assemblée peut élaborer des lois techniques excellentes. Ces lois ont, il est vrai, pour auteur un homme spécial qui les a préparées dans le silence du cabinet ; et la loi votée est en réalité l’œuvre d’un individu, et non plus celle d’une assemblée. Ce sont naturellement ces lois qui sont les meilleures. Elles ne deviennent désastreuses que lorsqu’une série d’amendements malheureux les rendent collectives. L’œuvre d’une foule est partout et toujours inférieure à celle d’un individu isolé. Ce sont les spécialistes qui sauvent les assemblées des mesures trop désordonnées et trop inexpérimentées. Le spécialiste est alors un meneur momentané. L’assemblée n’agit pas sur lui et il agit sur elle."
  "translation_ja": "幸い、いま列挙したような議会の性質がすべて、いつも現れるなどということはけっしてない。議会が群衆となるのはある時だけだ。それを構成する人々は多くの場合に個性を保ちうる。だからこそ議会には、専門的な事柄について優れた法律を作ることもできる。もっともその法律には、書斎の静けさのなかで準備を整えた一人の専門家という作者がいる。可決された法律は、実は一個人の作品であって、もはや議会の作品ではない。当然そうした法律がいちばんよい。不運な修正が次々に加えられて集団の作品になった時にはじめて、惨憺たるものになる。群衆の仕事は、いつ、どこであれ、たった一人で働く者の仕事に及ばない。議会をあまりに乱雑な、あるいは経験不足の措置から救うのは専門家たちだ。そのとき専門家は一時の指導者になる。議会が彼を動かすのではなく、彼が議会を動かす。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

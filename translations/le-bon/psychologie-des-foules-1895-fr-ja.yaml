- "id": "b2c3-053"
  "source_text": "Son prestige lui survécut et continua à grandir. C’est lui qui fit sacrer empereur un neveu obscur. En voyant renaître aujourd’hui sa légende, on voit combien cette grande ombre est puissante encore. Malmenez les hommes tant qu’il vous plaira, massacrez-les par millions, amenez invasions sur invasions, tout vous est permis si vous possédez un degré suffisant de prestige et le talent nécessaire pour le maintenir."
  "translation_ja": "彼の威信は彼より長く生き残り、増しつづけた。無名の甥を皇帝として戴冠させたのは、その威信である。今日また伝説がよみがえるのを見れば、この大きな影が今もどれほど強いのかが分かる。人を好きなだけ痛めつけ、数百万単位で殺し、国への侵攻を幾度呼び込もうとも、十分な威信とそれを保つだけの才能がありさえすれば、何もかも許されてしまうのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

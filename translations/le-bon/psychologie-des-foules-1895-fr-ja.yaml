  "translation_status": "reviewed"
- "id": "b2c3-013"
  "source_text": "Dans toutes les sphères sociales, des plus hautes aux plus basses, dès que l’homme n’est plus isolé, il tombe bientôt sous la loi d’un meneur. La plupart des hommes, dans les masses populaires surtout, ne possèdent, en dehors de leur spécialité, d’idée nette et raisonnée sur quoi que ce soit. Ils sont incapables de se conduire. Le meneur leur sert de guide. Il peut être remplacé à la rigueur, mais très insuffisamment par ces publications périodiques qui fabriquent des opinions pour leurs lecteurs et leur procurent ces phrases toutes faites qui dispensent de raisonner."
  "translation_ja": "最高から最低まで、どの社会階層でも、人間が一人でなくなると、ほどなく指導者の支配に入る。たいていの人間、とりわけ民衆の大部分は、自分の専門の外では、何についても明確で理屈の通った考えを持っていない。自分の進む道を自分で定めることができない。指導者がその案内役となる。読者のために意見を作り、考えずに済むよう出来合いの言い回しを提供する定期刊行物が、どうにか代わりになることもあるが、きわめて不十分な代用品である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

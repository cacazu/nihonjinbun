- "id": "b2c3-note-17"
  "section_id": "b2c3s3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Cette influence des titres, des rubans, des uniformes sur les foules se rencontre dans tous les pays, même dans ceux ou le sentiment de l’indépendance personnelle est le plus développé. Je reproduis à ce propos un passage curieux du livre récent d’un voyageur sur le prestige de certains personnages en Angleterre. « En diverses rencontres, je m’étais aperçu de l’ivresse particulière à laquelle le contact ou la vue d’un pair d’Angleterre exposent les Anglais les plus raisonnables. « Pourvu que son état soutienne son rang, ils l’aiment d’avance, et mis en présence supportent tout de lui avec enchantement. On les voit rougir de plaisir à son approche et, s’il leur parle, la joie qu’ils contiennent augmente cette rougeur et fait briller leurs yeux d’un éclat inaccoutumé. Ils ont le lord dans le sang, si l’on peut dire, comme l’Espagnol la danse, l’Allemand la musique et le Français la Révolution. Leur passion pour les chevaux et Shakespeare est moins violente, la satisfaction et l’orgueil qu’ils en tirent moins fondamentaux. Le Livre de la Pairie a un débit considérable, et si loin qu’on aille, on le trouve, comme la Bible, entre toutes les mains. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

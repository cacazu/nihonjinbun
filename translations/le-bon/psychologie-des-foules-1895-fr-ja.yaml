  "translation_status": "reviewed"
- "id": "b2c4-note-20"
  "section_id": "b2c4s1"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Barbares philosophiquement, j’entends. Pratiquement, elles ont créé une civilisation entièrement nouvelle et pendant quinze siècles laissé entrevoir à l’homme ces paradis enchantés du rêve et de l’espoir qu’il ne connaîtra plus."

  "translation_status": "reviewed"
- "id": "b2c4-023"
  "source_text": "Prenons, par exemple, une bien courte période de notre histoire, de 1790 à 1820 seulement, c’est-à-dire trente ans, la durée d’une génération. Nous y voyons les foules, d’abord monarchiques, devenir très révolutionnaires, puis très impérialistes, puis redevenir très monarchiques. En religion, elles vont pendant le même temps du catholicisme à l’athéisme, puis au déisme, puis retournent aux formes les plus exagérées du catholicisme. Et ce ne sont pas seulement les foules, mais également ceux qui les dirigent. Nous contemplons avec étonnement ces grands conventionnels, ennemis jurés des rois et ne voulant ni dieux ni maîtres, qui deviennent les humbles serviteurs de Napoléon, puis portent pieusement des cierges dans les processions sous Louis XVIII."
  "translation_ja": "たとえばわが国の歴史から、ほんの短い期間、一七九〇年から一八二〇年までのわずか三十年、つまり一世代の間を取ろう。私たちは、最初は君主制を支持した群衆が、熱烈な革命派となり、その次に熱烈な帝政派となり、その後ふたたび熱烈な王党派になるのを見る。宗教でも、同じ時間に、カトリックから無神論へ、次いで理神論へ移り、またカトリックのもっとも極端な形態に戻る。群衆だけではない。それを率いる者たちもそうだ。王の不倶戴天の敵で、神も主人も認めなかった、あの国民公会の大立者たちが、ナポレオンのおとなしいしもべとなり、さらにルイ十八世のもとでは、宗教行列でうやうやしくろうそくを運ぶのを、私たちは驚いて見る。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 387
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[395]"

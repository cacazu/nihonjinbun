- "id": "b2c3-031"
  "source_text": "« Semblable aux animaux, l’homme est naturellement imitatif. L’imitation est un besoin pour lui, à condition bien entendu, que cette imitation soit tout à fait facile. C’est ce besoin qui rend si puissante l’influence de ce que nous appelons la mode. Qu’il s’agisse d’opinions, d’idées, de manifestations littéraires, ou simplement de costumes, combien osent se soustraire à son empire ? Ce n’est pas avec des arguments, mais avec des modèles, qu’on guide les foules. À chaque époque il y a un petit nombre d’individualités qui impriment leur action et que la masse inconsciente imite. Il ne faudrait pas cependant que ces individualités s’écartassent par trop des idées reçues. Les imiter serait alors trop difficile et leur influence serait nulle. C’est précisément pour cette raison que les hommes trop supérieurs à leur époque n’ont généralement aucune influence sur elle. L’écart est trop grand. C’est pour la même raison que les Européens, avec tous les avantages de leur civilisation, ont une influence si insignifiante sur les peuples de l’Orient : ils en diffèrent trop."
  "translation_ja": "「動物と同じく、人間は生来まねをする生き物である。模倣は人にとってひとつの必要である。ただしむろん、きわめて容易にまねできることが条件だ。いわゆる流行の力があれほど強いのは、この必要のためである。意見、思想、文学の表現であれ、ただの服装であれ、流行の支配からあえて抜け出ようとする者が何人あろう。群衆を導くのは論拠でなく手本である。どの時代にも、少数ながら、その働きで時代に刻印を押し、無意識の大衆がまねる個性がある。もっともその人々は、世に通用している観念から極端に離れてはならない。そうなればまねるのがあまりに難しく、影響力はなくなる。時代をあまりにも超えた人がその時代にたいてい何の影響も及ぼさないのは、まさにこのためである。隔たりが大きすぎるのだ。ヨーロッパ人がその文明の利点をすべて備えながら、東洋の諸民族にごくわずかな影響しか及ぼさないのも同じ理由による。あまりに違いすぎるのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

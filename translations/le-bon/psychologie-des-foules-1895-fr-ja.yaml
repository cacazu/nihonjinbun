- "id": "b1c3-013"
  "source_text": "D’ailleurs, au point de vue social, la valeur hiérarchique d’une idée est sans importance. Ce qu’il faut considérer, ce sont les effets qu’elle produit. Les idées chrétiennes du moyen âge, les idées démocratiques du siècle dernier, les idées sociales d’aujourd’hui, ne sont pas certes très élevées. On ne peut philosophiquement les considérer que comme d’assez pauvres erreurs ; et cependant leur rôle a été et sera immense, et elles compteront longtemps parmi les plus essentiels facteurs de la conduite des États."
  "translation_ja": "そもそも、社会のうえからすれば、一つの思想が序列のどの位置を占めるかには意味がない。考慮すべきは、その思想がもたらす結果である。中世のキリスト教思想、前世紀の民主思想、今日の社会思想などは、なるほどそれほど高級な思想ではない。哲学的に見れば、さほど取り柄もない誤りとしか認められまい。だがその役割は途方もなく大きかったし、今後も大きいだろう。諸国家の行動を決めるもっとも本質的な要因のなかに、今後も長く数えられるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

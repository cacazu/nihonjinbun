- "id": "b2c3-037"
  "source_text": "§ 3. – LE PRESTIGE"
  "translation_ja": "第三節　威信"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

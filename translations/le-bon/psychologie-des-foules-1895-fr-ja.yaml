  "translation_status": "reviewed"
- "id": "b3c3-note-22"
  "section_id": "b3c3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Remarquons en passant que cette division, très bien faite d’instinct par les jurés, entre les crimes dangereux pour la société et les crimes non dangereux pour elle n’est pas du tout dénuée de justesse. Le but des lois criminelles doit être évidemment de protéger la société contre les criminels dangereux et non pas de la venger. Or nos codes, et surtout l’esprit de nos magistrats, sont tout imprégnés, encore de l’esprit de vengeance du vieux droit primitif, et le terme de vindicte (vindicta, vengeance) est encore d’un usage journalier. Nous avons la preuve de cette tendance des magistrats dans le refus de beaucoup d’entre eux d’appliquer l’excellente loi Bérenger, qui permet au condamné de ne subir sa peine que s’il récidive. Or, il n’est pas un magistrat qui puisse ignorer, car la statistique le prouve, que l’application d’une première peine crée infailliblement la récidive. Quand les juges relâchent un condamné, il leur semble toujours que la société n’a pas été vengée. Plutôt que de ne la pas venger, ils préfèrent créer un récidiviste dangereux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p155-22"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p155-22"
  "translation_ja": "ついでに注意しておこう。陪審員は本能によって、社会にとって危険な犯罪と危険でない犯罪とを実によく区別しており、この区別には十分な正しさがある。刑法の目的は明らかに、危険な犯罪者から社会を守ることにあるべきで、社会に代わって復讐することではない。ところがわが国の法典、とりわけ司法官たちの精神は、古い原始法の復讐の念で今もいっぱいであり、「応報」（ヴィンディクタ、すなわち復讐）という言葉が今日なお日常的に用いられている。その司法官たちの傾向の証拠に、多くの者が、受刑者が再犯した場合にだけ刑を受けさせることができる、優れたベランジェ法を適用したがらないことがある。最初の刑に服させることが必ず再犯を生むということは、統計が証明する以上、どの司法官も知らぬではいられない。それでも、受刑者を放すと、社会に代わって復讐が果たせなかったような気がするらしい。復讐せずにおくより、危険な累犯者を作り出すほうを彼らは好む。"
  "translation_status": "reviewed"
- "id": "b3c3-010"
  "source_text": "Les jurys, comme toutes les foules, sont fort éblouis par le prestige, et le président des Glajeux fait justement remarquer que, très démocratiques dans leur composition, ils sont très aristocratiques dans leurs affections : « Le nom, la naissance, la grande fortune, la renommée, l’assistance d’un avocat illustre, les choses qui distinguent et les choses qui reluisent forment un appoint très considérable dans la main des accusés. »"
  "translation_ja": "陪審も、あらゆる群衆と同じように威信にひどく目をくらまされる。デ・グラジュー院長はまさに的を射て、構成はずいぶん民主的なのに、好みははなはだ貴族的だと指摘する。「名門の名、家柄、大きな財産、名声、名高い弁護士の助力。人をひときわ目立たせるもの、何やらきらりと光るものは、被告人の手のなかで相当有力な切り札となる」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

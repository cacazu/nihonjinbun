- "id": "b2c4-035"
  "source_text": "Épier l’opinion est devenu aujourd’hui la préoccupation essentielle de la presse et des gouvernements. Quel est l’effet produit par un événement, un projet législatif, un discours, voilà ce qu’il leur faut savoir sans cesse ; et la chose n’est pas facile, car rien n’est plus mobile et plus changeant que la pensée des foules, et rien n’est plus fréquent que de les voir accueillir avec des anathèmes ce qu’elles avaient acclamé la veille."
  "translation_ja": "世論の顔色をうかがうことが、今日の新聞と政府にとってもっとも重要な関心になった。ある出来事、法案、演説がどんな効果を生んだか、それを絶えず知る必要がある。だが容易なことではない。群衆の考えほど動きやすく変わりやすいものはなく、昨日歓呼したものを今日呪いの声で迎えるほど、ありふれた光景もないからだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 399
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[407]"

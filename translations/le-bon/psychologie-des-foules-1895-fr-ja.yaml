  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-006"
  "source_text": "Au point de vue psychologique, l’expression foule prend une signification tout autre. Dans certaines circonstances données, et seulement dans ces circonstances, une agglomération d’hommes possède des caractères nouveaux fort différents de ceux des individus composant cette agglomération. La personnalité consciente s’évanouit, les sentiments et les idées de toutes les unités sont orientés dans une même direction. Il se forme une âme collective, transitoire sans doute, mais présentant des caractères très nets. La collectivité est alors devenue ce que, faute d’une expression meilleure, j’appellerai une foule organisée, ou, si l’on préfère, une foule psychologique. Elle forme un seul être et se trouve soumise à la loi de l’unité mentale des foules."
  "translation_ja": "心理学から見ると、群衆という言葉はまるで別の意味を帯びる。ある特定の事情のもとで、しかもその事情のもとでだけ、人の集まりは、それを構成する個々人の性質とは大いに異なる、新しい性質を帯びる。意識する人格は消え、集まりをなす一人ひとりの感情と考えは同じ方角を向く。こうして集団の魂が生じる。たしかに一時のものではあれ、その特徴はきわめてはっきりしている。このとき集団は、もっとよい言葉がないので私が「組織をなした群衆」と呼ぶもの、あるいはお好みなら「心理的群衆」と呼んでもよいものになったのである。それは一つの存在をなし、群衆の心が一つになる法則の支配に入る。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

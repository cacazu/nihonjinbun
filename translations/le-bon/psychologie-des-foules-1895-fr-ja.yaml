  "translation_status": "reviewed"
- "id": "b3c5-019"
  "source_text": "« Les assemblées politiques sont le lieu de la terre où l’éclat du génie se fait le moins sentir. On n’y tient compte que d’une éloquence appropriée au temps et au lieu, et des services rendus non à la patrie, mais aux partis. Pour qu’on rendît hommage à Lamartine en 1848 et à Thiers en 1871, il fallut le stimulant de l’intérêt urgent, inexorable. Le danger passé, on fut guéri à la fois de la reconnaissance et de la peur."
  "translation_ja": "「政治の議会ほど、天才の輝きが物を言わない場所は地上にない。そこでものを言うのは時と所にかなった弁舌と、祖国にではなく党派に尽くした功績だけだ。一八四八年にラマルティーヌ、一八七一年にティエールが敬意を払われるには、一刻も猶予ならぬ利害の刺激が必要だった。危険が過ぎ去ると、人々の感謝も恐怖も一緒に治ってしまった。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 517
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[527]"
  "section_id": "b3c5"

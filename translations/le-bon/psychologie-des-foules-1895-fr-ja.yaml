- "id": "b3c5-058"
  "source_text": "Cette création incessante de lois et de règlements restrictifs entourant des formalités les plus byzantines les moindres actes de la vie, a pour résultat fatal de rétrécir de plus en plus la sphère dans laquelle les citoyens peuvent se mouvoir librement. Victimes de cette illusion qu’en multipliant les lois l’égalité et la liberté se trouvent mieux assurées, les peuples acceptent chaque jour de plus pesantes entraves."
  "translation_ja": "制限する法律や規則が絶えず作られ、日々のもっともささやかな行為さえビザンツ風の極度に煩瑣な形式で取り囲まれる。その避けられない結果として、市民が自由に動ける範囲がいよいよ狭まる。法律を増やせば平等と自由はそれだけよく保障されるという錯覚の犠牲となり、諸民族は日ごとに重さを増す足かせを受け入れる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 556
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[567]"
  "section_id": "b3c5"

- "id": "b1c2-060"
  "source_text": "Si la foule est capable de meurtre, d’incendie et de toutes sortes de crimes, elle est également capable d’actes de dévouement, de sacrifice et de désintéressement très élevés, beaucoup plus élevés même que ceux dont est capable l’individu isolé. C’est surtout sur l’individu en foule qu’on agit, et souvent jusqu’à obtenir le sacrifice de la vie, en invoquant des sentiments de gloire, d’honneur, de religion et de patrie. L’histoire fourmille d’exemples analogues à ceux des croisades et des volontaires de 93. Seules les collectivités sont capables de grands désintéressements et de grands dévouements. Que de foules se sont fait héroïquement massacrer pour des croyances, des idées et des mots qu’elles comprenaient à peine. Les foules qui font des grèves les font bien plus pour obéir à un mot d’ordre que pour obtenir une augmentation du maigre salaire dont elles se contentent. L’intérêt personnel est bien rarement un mobile puissant chez les foules, alors qu’il est le mobile à peu près exclusif de l’individu isolé. Ce n’est certes pas l’intérêt qui a guidé les foules dans tant de guerres, incompréhensibles le plus souvent pour leur intelligence, et où elles se sont laissé aussi facilement massacrer que les alouettes hypnotisées par le miroir que manœuvre le chasseur."
  "translation_ja": "群衆には殺人、放火、その他あらゆる犯罪もできるが、それと同じように、きわめて気高い献身や犠牲、無私の行為もできる。それも単独の個人にできるよりはるかに気高いものが、である。栄光、名誉、信仰、祖国への思いに訴えると、何よりも群衆のなかの個人に働きかけることができ、しばしば命の犠牲にまで至る。歴史には十字軍や一七九三年の義勇兵に似た例がひしめいている。大いなる無私、大いなる献身は集団にだけできることだ。自分でもろくに理解していない信仰や思想や言葉のために、どれほど多くの群衆が英雄的にも命を奪われるに任せたことか。ストライキをする群衆も、わずかながら暮らしていける賃金を上げさせるためというより、はるかに多くは、号令に従うためにストをする。単独の個人を動かすのはほとんどもっぱら自分の利益だが、群衆にとってそれが強い動機になることはめったにない。あまたの戦争に群衆を導いたのは、断じて利害ではなかった。なぜ戦うのかほとんど理解もできず、猟師のあやつる鏡に目を奪われたヒバリと同じように、やすやすと命を奪われるままになった。"

- "id": "b2c4-022"
  "source_text": "Sans ce critérium philosophique on pourrait croire que les foules changent de croyances politiques ou religieuses fréquemment et à volonté. L’histoire tout entière, politique, religieuse, artistique, littéraire, semble le prouver en effet."
  "translation_ja": "この哲学上のものさしなしには、群衆が政治や宗教の信念を、しょっちゅう気の向くままに変えるかのように思われるかもしれない。実際、政治史、宗教史、美術史、文学史といった歴史の全体が、その証拠に見えるのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 386
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[394]"

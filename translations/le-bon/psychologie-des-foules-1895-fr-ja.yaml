- "id": "b2c3-042"
  "source_text": "Le prestige acquis, ou artificiel, est de beaucoup le plus répandu. Par le fait seul qu’un individu occupe une certaine position, possède une certaine fortune, est affublé de certains titres, il a du prestige, quelque nulle que puisse être sa valeur personnelle. Un militaire en uniforme, un magistrat en robe rouge ont toujours du prestige. Pascal avait très justement noté la nécessité pour les juges des robes et des perruques. Sans elles ils perdraient les trois quarts de leur autorité. Le socialiste le plus farouche est toujours un peu émotionné par la vue d’un prince ou d’un marquis ; et il suffit de prendre de tels titres pour escroquer à un commerçant tout ce qu’on veut[17]."
  "translation_ja": "後天的な、いわば人工の威信が、はるかに広く行き渡っている。ある地位を占め、これだけの財産を持ち、いくつかの肩書を飾り立てているというだけで、その人にどれほど値打ちがなくとも、威信はある。制服を着た軍人、赤い法服を着た司法官には、いつでも威信がある。パスカルが裁判官にとって法服とかつらが必要だと書きとめたのは実に正しい。それがなければ彼らは権威の四分の三を失うだろう。もっとも強硬な社会主義者でさえ、親王や侯爵を見ればいつでも少しは胸が騒ぐ。こうした称号を名乗るだけで、商人から欲しいものを何でもだまし取ることすらできる［17］。"

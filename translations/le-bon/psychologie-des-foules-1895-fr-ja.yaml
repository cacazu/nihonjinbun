- "id": "b3c4-015"
  "source_text": "« L’orateur exécute une charge à fond de train contre les socialistes, qui l’interrompent en criant : « Crétin ! bandit ! canaille ! » etc., épithètes auxquelles le compagnon X… répond par l’exposé d’une théorie selon laquelle les socialistes sont des « idiots » ou des « farceurs »."
  "translation_ja": "「弁士は猛烈な勢いで社会主義者を攻撃する。社会主義者たちが『ばか！　ならず者！　ごろつき！』等々と叫んで遮ると、同志Ｘ……はそうした形容に答えて、社会主義者たちは『まぬけ』か『ほら吹き』にほかならぬという一説を展開する。"

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-008"
  "source_text": "Le meneur a d’abord été le plus souvent un mené. Il a lui-même été hypnotisé par l’idée dont il est ensuite devenu l’apôtre. Elle l’a envahi au point que tout disparaît en dehors d’elle, et que toute opinion contraire lui paraît erreur et superstition. Tel, par exemple, Robespierre, hypnotisé par les idées philosophiques de Rousseau, et employant les procédés de l’Inquisition pour les propager."
  "translation_ja": "指導者も、たいてい最初は導かれる側だった。ある思想の使徒となる前に、彼自身がその思想に催眠をかけられていたのだ。その思想がすっかり彼を占め、そのほかの一切は消え、反対の意見はみな誤りや迷信に見える。ルソーの哲学思想に魅せられ、それを広めるため異端審問のやり方を使ったロベスピエールがその例である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 313
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[320]"
  "section_id": "b2c3s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-009"
  "source_text": "Les meneurs ne sont pas le plus souvent des hommes de pensée, mais des hommes d’action. Ils sont peu clairvoyants, et ne pourraient l’être, la clairvoyance conduisant généralement au doute et à l’inaction. Ils se recrutent surtout parmi ces névrosés, ces excités, ces demi-aliénés qui côtoient les bords de la folie. Quelque absurde que puisse être l’idée qu’ils défendent ou le but qu’ils poursuivent, tout raisonnement s’émousse contre leur conviction. Le mépris et les persécutions ne les touchent pas, ou ne font que les exciter davantage. Intérêt personnel, famille, tout est sacrifié. L’instinct de la conservation lui-même est annulé chez eux, au point que la seule récompense qu’ils sollicitent souvent est de devenir des martyrs. L’intensité de leur foi donne à leurs paroles une grande puissance suggestive. La multitude est toujours prête à écouter l’homme doué de volonté forte qui sait s’imposer à elle. Les hommes réunis en foule perdent toute volonté et se tournent d’instinct vers qui en possède une."
  "translation_ja": "指導者の多くは思想の人でなく、行動の人である。ものを見通す力は乏しいし、また豊かであるわけにはいかない。洞察はたいてい疑いと不作為に導くからだ。指導者は主として、狂気の縁を歩む神経症の人、興奮しやすい人、半ば正気を失った人のなかから出てくる。擁護する思想や追い求める目的がどれほど不合理でも、いかなる推論も、その確信に当たれば刃が鈍る。軽蔑も迫害も彼らには響かず、かえっていっそう興奮させるだけだ。自分の利害も家族も、みな犠牲にされる。自己保存の本能さえ消えてしまい、殉教者となることだけを褒美として願うこともしばしばある。信じる力が強いため、その言葉も暗示の大きな力を帯びる。群がる人々はつねに、強い意志を備え、自分たちに一目置かせることのできる者の言葉に耳を傾けようとしている。人間は群衆となって集まると、意志をまるごと失い、本能的に、意志を持つ者の方を向く。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 314

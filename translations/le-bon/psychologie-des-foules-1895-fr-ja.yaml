- "id": "b1c2-055"
  "source_text": "Il est difficile de comprendre l’histoire, celle des révolutions populaires surtout, quand on ne se rend pas bien compte des instincts profondément conservateurs des foules. Elles veulent bien changer les noms de leurs institutions, et elles accomplissent parfois même de violentes révolutions pour obtenir ces changements ; mais le fond de ces institutions est trop l’expression des besoins héréditaires de la race pour qu’elles n’y reviennent pas toujours. Leur mobilité incessante ne porte que sur les choses tout à fait superficielles. En fait, elles ont des instincts conservateurs aussi irréductibles que ceux de tous les primitifs. Leur respect fétichiste pour les traditions est absolu, leur horreur inconsciente de toutes les nouveautés capables de changer leurs conditions réelles d’existence, est tout à fait profonde. Si les démocraties eussent possédé le pouvoir qu’elles ont aujourd’hui à l’époque où furent inventés les métiers mécaniques, la vapeur et les chemins de fer, la réalisation de ces inventions eût été impossible, ou ne l’eût été qu’au prix de révolutions et de massacres répétés. Il est heureux, pour les progrès de la civilisation, que la puissance des foules n’ait commencé à naître que lorsque les grandes découvertes de la science et de l’industrie étaient déjà accomplies."
  "translation_ja": "群衆の根深い保守的本能がよく分かっていないと、歴史、とりわけ民衆革命の歴史を理解するのは難しい。群衆は制度の名を変えたいとは思うし、その変更を勝ち取るためなら、ときに暴力革命さえやってのける。だが制度の中身は、人種が代々受け継いできた欲求の表現である度合いが強すぎて、いずれはいつもそこへ戻ることになる。群衆のせわしない移り気は、まったく表面的な事柄にしか及ばない。事実、群衆には、いわゆる原始の人々すべてと同じほど根絶しがたい保守本能がある。伝統を呪物のようにあがめる気持ちは絶対で、実際の生活条件を変えうる新しいものをことごとく、無意識のうちに心底嫌悪している。もし機械織機や蒸気力や鉄道が発明された時代に、民主政が今日持っているような権力を握っていたなら、そうした発明の実用化は不可能だったか、繰り返される革命と虐殺の代償を払ってようやく可能だったにちがいない。群衆の力が芽生え始めたのが、科学と産業の大発見がすでに成し遂げられた後だったのは、文明の進歩にとっては幸せなことである。"

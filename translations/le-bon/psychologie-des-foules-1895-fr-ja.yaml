- "id": "b2c1-note-9"
  "section_id": "b2c1s4"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Si l’on rapproche les profondes dissensions religieuses et politiques qui séparent les diverses parties de la France, et sont surtout une question de races, des tendances séparatistes qui se sont manifestées à l’époque de la Révolution, et qui commençaient à se dessiner de nouveau vers la fin de la guerre franco-allemande, on voit que les races diverses qui subsistent sur notre sol sont bien loin d’être fusionnées encore. La centralisation énergique de la Révolution et la création de départements artificiels destinés à mêler les anciennes provinces fut certainement son œuvre la plus utile. Si la décentralisation, dont parlent tant aujourd’hui les esprits imprévoyants, pouvait être créée, elle aboutirait promptement aux plus sanglantes discordes. Il faut pour le méconnaître oublier entièrement notre histoire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-9"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-9"
  "translation_ja": "フランスの各地方を隔てている、まず何より人種の問題である深い宗教上・政治上の不和と、革命の時代に現れ、普仏戦争の末期にもまた輪郭を見せ始めた分離主義の傾向とを照合すれば、わが国の土に残るさまざまな人種がまだ融合からはるかに遠いことが分かる。革命による力強い中央集権と、かつての地方を混ぜ合わせるための人為的な県の創設は、間違いなくそのもっとも有益な仕事だった。先のことを考えない人々が今日盛んに口にする地方分権をもし作り出せたとすれば、たちまちきわめて血なまぐさい争いに行き着くだろう。それが分からないとすれば、わが国の歴史をすっかり忘れているにちがいない。"
  "translation_status": "reviewed"
- "id": "b2c1-034"
  "source_text": "Concluons de ce qui précède que ce n’est pas dans les institutions qu’il faut chercher le moyen d’agir profondément sur l’âme des foules ; et quand nous voyons certains pays, comme les États-Unis, arriver à un haut degré de prospérité avec des institutions démocratiques, alors que nous en voyons d’autres, tels que les républiques hispano-américaines, vivre dans la plus triste anarchie malgré des institutions absolument semblables, disons-nous bien que ces institutions sont aussi étrangères à la grandeur des uns qu’à la décadence des autres. Les peuples sont gouvernés par leur caractère, et toutes les institutions qui ne sont pas intimement moulées sur ce caractère ne représentent qu’un vêtement d’emprunt, un déguisement transitoire. Certes, des guerres sanglantes, des révolutions violentes ont été faites, et se feront encore, pour imposer des institutions auxquelles est attribué, comme aux reliques des saints, le pouvoir surnaturel de créer le bonheur. On pourrait donc dire en un sens que les institutions agissent sur l’âme des foules puisqu’elles engendrent de pareils soulèvements. Mais, en réalité, ce ne sont pas les institutions qui agissent alors, puisque nous savons que, triomphantes ou vaincues, elles ne possèdent par elles-mêmes aucune vertu. Ce qui a agi sur l’âme des foules, ce sont des illusions et des mots. Des mots surtout, ces mots chimériques et puissants dont nous montrerons bientôt l’étonnant empire."
  "translation_ja": "ここまでのことから、群衆の魂に深く作用する手段を制度のなかに求めてはならないと結論しよう。アメリカ合衆国のように民主的な制度のもとで高度な繁栄を遂げる国がある一方、スペイン系アメリカの諸共和国のように、まるで同じ制度がありながら、まことに嘆かわしい無秩序のうちに暮らす国もある。このとき、これらの制度は、一方の偉大さにも他方の衰退にも等しくかかわりがないことを、はっきり心にとめよう。民族を治めるのはおのれの性格である。そこにぴたりと合わせて形づくられていない制度は、いわば借り着、一時の仮装にすぎない。むろん、聖人の遺物よろしく、幸福を生み出す超自然の力があるとされる制度を押しつけるために、血なまぐさい戦争も暴力革命もなされてきたし、これからもなされるだろう。制度がそういう騒乱を引き起こす以上、ある意味では、群衆の魂に働くとも言えよう。しかし実際に働いているのは制度ではない。勝っても負けても、制度それ自体には何の効能もないことを、私たちは知っているからだ。群衆の魂に働いたのは、幻想と言葉である。とくに言葉だ。その驚くべき支配力を間もなく示すことになる、あのまぼろしのようで力強い言葉である。"

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-058"
  "source_text": "Les rares psychologues qui ont étudié les foules ne les ont envisagées qu’au point de vue de leurs actes criminels ; et, voyant à quel point ces actes sont fréquents, ils les ont considérées comme ayant un niveau moral très bas."
  "translation_ja": "群衆を研究したわずかな心理学者は、群衆の犯罪行為という面からしかこれを考察しなかった。そしてそのような行いがどれほど多いかを見て、群衆の道徳的水準をきわめて低いものとみなしてきた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 164
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[165]"
  "section_id": "b1c2s5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-059"
  "source_text": "Sans doute il en est souvent ainsi : mais pourquoi ? Simplement, parce que les instincts de férocité destructive sont des résidus des âges primitifs qui dorment au fond de chacun de nous. Dans la vie de l’individu isolé, il lui serait dangereux de les satisfaire, alors que son absorption dans une foule irresponsable, et où par conséquent l’impunité est assurée, lui donne toute liberté pour les suivre. Ne pouvant exercer habituellement ces instincts destructifs sur nos semblables, nous nous bornons à les exercer sur les animaux. C’est d’une même source que dérivent la passion si générale pour la chasse et les actes de férocité des foules. La foule qui écharpe lentement une victime sans défense fait preuve d’une férocité très lâche ; mais, pour le philosophe, cette férocité est bien proche parente de celle des chasseurs qui se réunissent par douzaines pour avoir le plaisir d’assister à la poursuite et à l’éventrement d’un malheureux cerf par leurs chiens."
  "translation_ja": "たしかにしばしばそうである。だが、それはなぜか。破壊に向かう獰猛な本能は、太古の時代の名残として、私たちの一人ひとりの心の奥底に眠っているからにすぎない。単独の人間の生活では、それを満たすのは当人にとって危険だが、責任を問えず、したがって処罰を受けないことが保証される群衆のうちに溶け込むと、その本能を追うのに一切の自由を得る。普段は同胞にこの破壊本能を向けられないから、私たちは動物に向けるだけで済ませている。狩猟を好む気持ちがこれほど広く見られるのも、群衆が残酷に振る舞うのも、出てくる源は同じだ。身を守る術のない犠牲者をじわじわとなぶり殺す群衆は、卑劣きわまる残虐さを示す。だが哲学者の目から見れば、その残虐さは、哀れな鹿一頭を猟犬に追わせ、その腹を引き裂くところを見て楽しもうと十数人ずつ連れ立つ狩人たちの残虐さと、ごく近い親類なのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

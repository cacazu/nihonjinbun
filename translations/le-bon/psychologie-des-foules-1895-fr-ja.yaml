- "id": "b3c3-014"
  "source_text": "L’orateur n’a pas besoin de convertir tous les membres d’un jury, mais seulement les meneurs qui détermineront l’opinion générale. Comme dans toutes les foules, il y a toujours un petit nombre d’individus qui conduisent les autres. « J’ai fait l’expérience, dit l’avocat que je citais plus haut, qu’au moment de rendre le verdict, il suffisait d’un ou deux hommes énergiques pour entraîner le reste du jury. » Ce sont ces deux ou trois-là qu’il faut convaincre par d’habiles suggestions. Il faut d’abord et avant tout leur plaire. L’homme en foule à qui on a plu est près d’être convaincu, et tout disposé à trouver excellentes les raisons quelconques qu’on lui présente. Je trouve, dans un travail intéressant sur Me Lachaud, l’anecdote suivante :"
  "translation_ja": "弁士は陪審全員を転向させる必要はない。全体の意見を決める指導的な者だけでよい。どんな群衆にもそうであるように、つねに少数の人間がほかの人々を導く。「評決を出す段になれば、気力のある一人か二人がいれば、残りの陪審を引き連れるのに十分だと、経験して知っている」と、先に引いた弁護士は言う。巧みな暗示で説得しなければならないのは、その二、三人だ。まず何よりも、彼らに気に入られねばならない。群衆のうちの個人は、一度ある者を気に入れば、ほとんど納得したも同然で、その者が示す論拠なら何であれ立派だと思う構えができている。ラショー弁護士についての興味深い論考に、次の逸話がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

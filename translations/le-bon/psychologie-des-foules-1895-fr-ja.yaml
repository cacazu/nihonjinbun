- "id": "preface-005"
  "source_text": "J’ai essayé d’aborder le difficile problème des foules avec des procédés exclusivement scientifiques, c’est-à-dire en tâchant d’avoir une méthode et en laissant de côté les opinions, les théories et les doctrines. C’est là, je crois, le seul moyen d’arriver à découvrir quelques parcelles de vérité, surtout quand il s’agit, comme ici, d’une question passionnant vivement les esprits. Le savant, qui cherche à constater un phénomène, n’a pas à s’occuper des intérêts que ses constatations peuvent heurter. Dans une publication récente, un éminent penseur, M. Goblet d’Alviela, faisait observer que, n’appartenant à aucune des écoles contemporaines, je me trouvais parfois en opposition avec certaines conclusions de toutes ces écoles. Ce nouveau travail méritera, je l’espère, la même observation. Appartenir à une école, c’est en épouser nécessairement les préjugés et les partis pris."
  "translation_ja": "私はもっぱら科学的な手立てで、この群衆という難問に近づこうとした。すなわち、方法を持とうと努め、意見も理論も教説も脇へよけた。ほんのひとかけらでも真理を見いだすには、これが唯一の道だと私は考える。ことに、ここで扱うような、人の心を激しく揺り動かす問題についてはなおさらである。ある現象を見きわめようとする学者が、自分の見きわめた事実がだれの利害に触れるかまで気にかける必要はない。すぐれた思想家ゴブレ・ダルヴィエラ氏は、最近の著作で、私が同時代のどの学派にも属さないために、どの学派とも、その結論のどれかで衝突することがある、と指摘された。この新しい仕事についても、同じ評をいただければ幸いである。一つの学派に属すれば、おのずとその偏見を引き受け、その決めつけにも与する。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 38
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[38]"
  "section_id": "preface"

  "translation_ja": "ギュスターヴ・ル・ボン『人間と社会』第二巻、一一六頁、一八八一年。"
  "translation_status": "reviewed"
- "id": "b2c3-033"
  "source_text": "La contagion est si puissante qu’elle impose aux individus non seulement certaines opinions mais encore certaines façons de sentir. C’est la contagion qui fait mépriser à une époque certaines œuvres, telles que le Tanhauser, par exemple, et qui, quelques années plus tard, les fait admirer par ceux-là mêmes qui les avaient dénigrées le plus."
  "translation_ja": "伝染はあまりにも強力で、個人にある意見を押しつけるばかりか、ある感じ方まで押しつける。ある時代にはたとえば『タンホイザー』のような作品を軽蔑させ、数年後には、もっとも激しくけなした当の人々にこれを賛美させるのも、伝染である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b2c3-024"
  "source_text": "Mais quand il s’agit de faire pénétrer des idées et des croyances dans l’esprit des foules – les théories sociales modernes, par exemple – les procédés des meneurs sont différents. Ils ont principalement recours à trois procédés très nets : l’affirmation, la répétition, la contagion. L’action en est assez lente, mais les effets de cette action une fois produits sont fort durables."
  "translation_ja": "これに対し、たとえば近代の社会理論のような思想や信念を群衆の心に浸透させようとするとき、指導者の手立ては違ってくる。主として頼るのは、きわめて明瞭な三つの方法、断言、反復、伝染である。この働きは比較的遅いが、いったん結果が出るとその効果は非常に長もちする。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 329
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[336]"
  "section_id": "b2c3s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-025"
  "source_text": "L’affirmation pure et simple, dégagée de tout raisonnement et de toute preuve, est un des plus sûrs moyens de faire pénétrer une idée dans l’esprit des foules. Plus l’affirmation est concise, plus elle est dépourvue de toute apparence de preuves et de démonstration, plus elle a d’autorité. Les livres religieux et les codes de tous les âges ont toujours procédé par simple affirmation. Les hommes d’État appelés à défendre une cause politique quelconque, les industriels propageant leurs produits par l’annonce, savent la valeur de l’affirmation."
  "translation_ja": "推論も証拠もいっさい添えない、純然たる断言は、群衆の心に思想を浸透させるもっとも確実なやり方の一つである。断言は簡潔であればあるほど、証拠や論証の形跡をいっさい欠くほど、権威を持つ。あらゆる時代の宗教書と法典はつねに単純な断言で進んできた。ある政治的大義を弁護することを求められる政治家も、広告で製品を広める実業家も、断言の値打ちを知っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 330
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[337]"
  "section_id": "b2c3s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-026"
  "source_text": "L’affirmation n’a cependant d’influence réelle qu’à la condition d’être constamment répétée, et, le plus possible, dans les mêmes termes. C’est Napoléon, je crois, qui a dit qu’il n’y a qu’une seule figure sérieuse de rhétorique, la répétition. La chose affirmée arrive, par la répétition, à s’établir dans les esprits au point qu’ils finissent par l’accepter comme une vérité démontrée."
  "translation_ja": "だが断言が本当に影響を持つのは、それが絶えず、それも極力同じ言い回しで繰り返される場合だけだ。弁論の修辞でまともなものは一つしかない、それは反復だ、と言ったのはナポレオンだったと思う。断言された事柄は繰り返されることで人々の心に根をおろし、ついには立証された真理として受け入れられるに至る。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 331
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[338]"
  "section_id": "b2c3s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-027"
  "source_text": "On comprend bien l’influence de la répétition sur les foules, en voyant à quel point elle est puissante sur les esprits les plus éclairés. Cette puissance vient de ce que la chose répétée finit par s’incruster dans ces régions profondes de l’inconscient où s’élaborent les motifs de nos actions. Au bout de quelque temps, nous ne savons plus quel est l’auteur de l’assertion répétée, et nous finissons par y croire. De là la force étonnante de l’annonce. Quand nous avons lu cent fois, mille fois que le meilleur chocolat est le chocolat X, nous nous imaginons l’avoir entendu dire de bien des côtés, et nous finissons par en avoir la certitude. Quand nous avons lu mille fois que la farine Y a guéri les plus grands personnages des maladies les plus tenaces, nous finissons par être tentés de l’essayer le jour où nous sommes par atteints d’une maladie du même genre. Si nous lisons toujours dans le même journal que A est un parfait gredin et B un très honnête homme, nous finissons par en être convaincus, à moins, bien entendu, que nous ne lisions souvent un autre journal d’opinion contraire, où les deux qualificatifs soient inversés. L’affirmation et la répétition sont seules assez puissantes pour pouvoir se combattre."
  "translation_ja": "もっとも啓発された人にさえ、繰り返しがどれほど強く作用するかを見れば、群衆に及ぼす効果もよく分かる。その力は、繰り返される事柄が、私たちの行いの動機が練り上げられる無意識の深みに入り込んで、やがてこびりついてしまうことから来る。いくらかたつと、繰り返された断言がもとはだれのものだったのか、私たちにはもう分からず、しまいには信じるようになる。広告の驚くべき力はそこにある。いちばんおいしいチョコレートはＸ社のチョコレートだと百回も千回も読めば、あちこちからそう聞いたような気がして、ついに確信する。Ｙ社の粉がもっとも偉い人々のもっともしつこい病を治したと千回読めば、自分が同じ種類の病にかかった日に試してみたい気になる。Ａはまったくの悪党で、Ｂはじつに正直な人だと同じ新聞でいつも読んでいれば、いずれは確信する。ただしむろん、正反対の意見を持ち、二人の形容が逆になった別の新聞を、しょっちゅう読んでいない場合に限る。断言と反復に対抗できるだけの力を持つのは、断言と反復だけである。"
  "source_languages":

- "id": "b2c3-054"
  "source_text": "J’ai invoqué ici un exemple de prestige tout à fait exceptionnel, sans doute, mais qu’il était utile de citer pour faire comprendre la genèse des grandes religions, des grandes doctrines et des grands empires. Sans la puissance exercée sur la foule par le prestige, cette genèse ne serait pas compréhensible."
  "translation_ja": "ここでは確かにきわめて例外的な威信の例を挙げた。だが、大宗教や大きな教説、大帝国がいかにして生まれるかを分かってもらうには、引くだけの値打ちがあった。群衆に威信が及ぼす力がなければ、それらの発生は理解できまい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

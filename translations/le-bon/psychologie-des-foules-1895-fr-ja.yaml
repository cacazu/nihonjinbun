- "id": "b2c2-022"
  "source_text": "« Si l’on détruisait, dans les musées et les bibliothèques, et que l’on fit écrouler, sur les dalles des parvis, toutes les œuvres et tous les monuments d’art qu’ont inspirés les religions, que resterait-il des grands rêves humains ? Donner aux hommes la part d’espoir et d’illusion sans laquelle ils ne peuvent exister, telle est la raison d’être des dieux, des héros et des poètes. Pendant cinquante ans, la science parut assumer cette tâche. Mais ce qui l’a compromise dans les cœurs affamés d’idéal, c’est qu’elle n’ose plus assez promettre et qu’elle ne sait pas assez mentir[13]. »"
  "translation_ja": "「美術館や図書館の中から、宗教に霊感を受けたあらゆる作品を取り出して破壊し、宗教が生んだ芸術上の記念建造物をすべてその前庭の敷石に崩れ落としたら、人類の大きな夢から何が残るであろう。人が生きてゆくのに欠かせないだけの希望と幻想を与えること、それが神々と英雄と詩人の存在理由である。五十年の間、科学がこの務めを引き受けたように見えた。だが理想に飢えた心のなかで科学の立場を危うくしたものは、もはや思い切った約束をあまりせず、うまく嘘をつけないことなのだ［13］」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "preface-002"
  "source_text": "Notre précédent ouvrage a été consacré à décrire l’âme des races. Nous allons étudier maintenant l’âme des foules."
  "translation_ja": "前著では人種の魂を描くことに専念した。今度は群衆の魂を調べてみよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 35
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[35]"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "preface-003"
  "source_text": "L’ensemble de caractères communs que l’hérédité impose à tous les individus d’une race constitue l’âme de cette race. Mais lorsqu’un certain nombre de ces individus se trouvent réunis en foule pour agir, l’observation démontre que, du fait même de leur rapprochement, résultent certains caractères psychologiques nouveaux qui se superposent aux caractères de race, et qui parfois en diffèrent profondément."
  "translation_ja": "ある人種に属するすべての個人に、遺伝が共通の性質を刻みつける。その性質の総体が、その人種の魂をなす。だが、そのうちの何人かが行動をともにしようと群衆をつくると、互いに寄り集まったというだけで新しい心理的性質がいくつか生じることが観察される。それらは人種の性質に重なり、ときにはそれと根本から異なる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 36
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[36]"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "preface-004"
  "source_text": "Les foules organisées ont toujours joué un rôle considérable dans la vie des peuples ; mais ce rôle n’a jamais été aussi important qu’aujourd’hui. L’action inconsciente des foules se substituant à l’activité consciente des individus est une des principales caractéristiques de l’âge actuel."
  "translation_ja": "組織をなした群衆は、どの時代にも諸民族の生活で大きな役割を演じてきた。だが、その役割がこれほど重要になったことはかつてない。個人の意識的な働きに代わって群衆の無意識な働きが前面に出てきたことは、現代を特徴づける主要な事柄の一つである。"
  "source_languages":
  - "fr"

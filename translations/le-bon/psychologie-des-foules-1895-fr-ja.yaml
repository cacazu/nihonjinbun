- "id": "b1c4-013"
  "source_text": "Aussi est-ce une bien inutile banalité de répéter qu’il faut une religion aux foules, puisque toutes les croyances politiques, divines et sociales ne s’établissent chez elles qu’à la condition de revêtir toujours la forme religieuse, qui les met à l’abri de la discussion. L’athéisme, s’il était possible de le faire accepter aux foules, aurait toute l’ardeur intolérante d’un sentiment religieux, et, dans ses formes extérieures, deviendrait bientôt un culte. L’évolution de la petite secte positiviste nous en fournit une preuve curieuse. Il lui est arrivé bien vite ce qui arriva à ce nihiliste, dont le profond Dostoïewsky nous rapporte l’histoire. Éclairé un jour par les lumières de la raison, il brisa les images des divinités et des saints qui ornaient l’autel d’une chapelle, éteignit les cierges, et, sans perdre un instant, remplaça les images détruites par les ouvrages de quelques philosophes athées, tels que Büchner et Moleschott, puis ralluma pieusement les cierges. L’objet de ses croyances religieuses s’était transformé, mais ses sentiments religieux, peut-on dire vraiment qu’ils avaient changé ?"
  "translation_ja": "群衆には宗教が必要だと繰り返すのは、それゆえ、まことに無用な決まり文句だ。政治の信念も神々についての信仰も社会的な信条も、群衆に根を張るには、異論の届かなくなる宗教的な形をいつも取らねばならないからだ。無神論でさえ、もし群衆に受け入れさせることができるなら、宗教感情の不寛容な熱をそっくり帯び、外形においてはほどなく礼拝そのものとなるだろう。その不思議な証拠を、小さな実証主義の一派の歩みが示している。その一派には、洞察の深いドストエフスキーが伝えたあの虚無主義者の身に起きたのと同じことが、ほどなく起きた。ある日、理性の光に照らされたその人は、礼拝堂の祭壇を飾っていた神々や聖人の像を打ち砕き、ろうそくを消した。そうして間髪を入れず、壊した像の代わりにビューヒナーやモレショットなど幾人かの無神論哲学者の著書を置き、うやうやしくろうそくに火をともし直したのである。宗教的信仰の対象は変わった。だがその宗教感情も変わったと、ほんとうに言えるだろうか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

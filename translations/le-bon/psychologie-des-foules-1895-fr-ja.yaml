- "id": "b1c2-056"
  "source_text": "§ 5. — MORALITÉ DES FOULES"
  "translation_ja": "第五節　群衆の道徳性"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 162
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[34]"
  "section_id": "b1c2s5"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-057"
  "source_text": "Si nous prenons le mot de moralité dans le sens de respect constant de certaines conventions sociales et de répression permanente des impulsions égoïstes, il est bien évident que les foules sont trop impulsives et trop mobiles pour être susceptibles de moralité. Mais si, dans le terme de moralité, nous faisons entrer l’apparition momentanée de certaines qualités telles que l’abnégation, le dévouement, le désintéressement, le sacrifice de soi-même, le besoin d’équité, nous pouvons dire que les foules sont au contraire parfois susceptibles d’une moralité très haute."
  "translation_ja": "道徳性という言葉を、ある種の社会的な取り決めを絶えず尊重し、利己的衝動をいつも抑えていることという意味に取るなら、群衆はあまりに衝動的で移り気だから、道徳性を持ちえないのは明らかだ。だが、自己を捨てる心、献身、私心のなさ、自己犠牲、公平を求める心といった資質が一時でも現れることを道徳性に含めるなら、逆に、群衆はときにきわめて高い道徳性を持ちうると言える。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 163
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[164]"
  "section_id": "b1c2s5"

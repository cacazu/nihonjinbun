  "translation_status": "reviewed"
- "id": "b1c3-005"
  "source_text": "Étudiant dans notre précédent ouvrage le rôle des idées dans l’évolution des peuples, nous avons montré que chaque civilisation dérive d’un petit nombre d’idées fondamentales fort rarement renouvelées. Nous avons exposé comment ces idées s’établissent dans l’âme des foules ; avec quelle difficulté elles y pénètrent, et la puissance qu’elles possèdent quand elles y ont pénétré. Nous avons vu enfin comment les grandes perturbations historiques dérivent le plus souvent des changements de ces idées fondamentales."
  "translation_ja": "前著で諸民族の進化における思想の役割を調べたとき、私たちは、一つひとつの文明が、めったに更新されることのない少数の根本思想から生じていることを示した。それらの思想がいかに群衆の魂に根づくか、そこに入り込むにはどれほど苦労し、ひとたび入り込むとどれほどの力を持つのかを説明した。最後に、歴史上の大きな動乱の多くは、そうした根本思想の変化から生じることを見た。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b2c3-035"
  "source_text": "On remarquera que, dans les exemples analogues à ceux que je viens de citer, la contagion, après s’être exercée dans les couches populaires, passe ensuite aux couches supérieures de la société. C’est ce que nous voyons de nos jours pour les doctrines socialistes, qui commencent à gagner ceux qui pourtant sont marqués pour en devenir les premières victimes. Le mécanisme de la contagion est si puissant que, devant son action, l’intérêt personnel lui-même s’évanouit."
  "translation_ja": "いま挙げたような場合には、伝染がまず民衆の諸層に作用した後、社会の上層へと上ってゆくことに注意してほしい。今、社会主義の教説についてまさにそれが見られる。その最初の犠牲者となるはずの人々にまで、その教説が浸透し始めている。伝染の仕組みはきわめて強力で、その作用を前にすれば、当人の利益でさえ消えてしまうのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 340
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[347]"
  "section_id": "b2c3s2"

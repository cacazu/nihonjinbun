- "id": "b1c3-008"
  "source_text": "Les idées fondamentales pourraient être figurées par la masse des eaux d’un fleuve déroulant lentement son cours ; les idées passagères par les petites vagues, toujours changeantes, qui agitent sa surface, et qui, bien que sans importance réelle, sont plus visibles que la marche du fleuve lui-même."
  "translation_ja": "根本の思想は、悠々と流れてゆく大河の水全体にたとえられよう。一時的な思想は、水面を揺らしてたえず変わる小波に当たる。それ自体には大した意味がなくても、河そのものの歩みより目につきやすい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 177
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[177]"

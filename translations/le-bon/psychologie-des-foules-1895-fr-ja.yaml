  "translation_status": "reviewed"
- "id": "b2c4-027"
  "source_text": "De nos jours, la somme des opinions mobiles des foules est plus grande qu’elle ne le fut jamais ; et cela, pour trois raisons différentes :"
  "translation_ja": "今日、群衆が抱く移ろいやすい意見の総量は、かつてないほど大きい。それには三つの異なる理由がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 391
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[399]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-028"
  "source_text": "La première est que les anciennes croyances perdant de plus en plus leur empire, n’agissent plus comme jadis sur les opinions passagères pour leur donner une certaine orientation. L’effacement des croyances générales laisse place à une foule d’opinions particulières sans passé ni avenir."
  "translation_ja": "第一は、古い信念がますます支配力を失い、かつてのように、束の間の意見に働きかけて一定の方向を与えることをしなくなったためである。一般的な信念が薄らぐと、過去も未来もない数々の個別の意見が入り込む余地が生じる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 392
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[400]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-029"
  "source_text": "La seconde raison est que la puissance des foules devenant de plus en plus grande et ayant de moins en moins de contrepoids, la mobilité extrême d’idées que nous avons constatée chez elles, peut se manifester librement."
  "translation_ja": "第二は、群衆の力がますます増し、それに釣り合う重しがますます少なくなったので、すでに群衆のうちに認めた思想の極端な移りやすさが、思うままに姿を現せることである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 393
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[401]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-030"
  "source_text": "La troisième raison enfin est la diffusion récente de la presse qui met sans cesse sous les yeux des foules les opinions les plus contraires. Les suggestions que chacune d’elles pourrait engendrer sont bientôt détruites par des suggestions opposées. Il en résulte que chaque opinion n’arrive pas à s’étendre et est vouée à une existence très éphémère. Elle est morte avant d’avoir pu se répandre assez pour devenir générale."
  "translation_ja": "そして第三は、相反する意見をたえまなく群衆の目にさらす新聞の、近年における普及である。それぞれの意見が生むかもしれない暗示は、正反対の暗示ですぐ打ち消される。その結果どの意見も広がりきれず、ごく短い生を運命づけられる。十分に広まって世間一般のものになりえないうちに、死んでいるのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 394
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[402]"
  "section_id": "b2c4s2"

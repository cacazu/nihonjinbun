- "id": "b1c1-020"
  "source_text": "Or ce sont précisément ces qualités générales du caractère, régies par l’inconscient et que la plupart des individus normaux d’une race possèdent à peu près au même degré, qui, dans les foules, sont mises en commun. Dans l’âme collective, les aptitudes intellectuelles des individus, et par conséquent leur individualité, s’effacent. L’hétérogène se noie dans l’homogène, et les qualités inconscientes dominent."
  "translation_ja": "さて、無意識に律せられ、一つの人種のたいていの普通の個人がほぼ同程度に備えている、性格上のこうした一般的な資質こそ、群衆のなかで共有されるものだ。集団の魂では、個々人の知的な才、したがってまたそれぞれの個性が薄れてゆく。異質なものは同質なもののなかに埋没し、無意識の資質が支配する。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 94

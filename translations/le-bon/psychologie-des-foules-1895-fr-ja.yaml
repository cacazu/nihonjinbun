  "translation_status": "reviewed"
- "id": "b3c5-034"
  "source_text": "Il est quelquefois effrayant de songer au pouvoir que donne à un homme possédant du prestige une conviction forte unie à une extrême étroitesse d’esprit. Il faut pourtant réaliser ces conditions pour ignorer les obstacles et savoir vouloir. D’instinct les foules reconnaissent dans ces convaincus énergiques le maître qu’il leur faut toujours."
  "translation_ja": "極端な視野の狭さと強い確信とが結びつくと、威信のある一人の人間にどれほどの力が宿るか。それを思うと時として恐ろしい。だが障害に目をくれず、わが意志を貫く術を心得るには、これらの条件がそろう必要がある。群衆は、力強い確信の持ち主のうちに、いつも必要としている主人を本能的に見分ける。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 532
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[542]"
  "section_id": "b3c5"

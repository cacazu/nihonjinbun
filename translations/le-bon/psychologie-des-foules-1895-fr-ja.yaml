- "id": "b2c2-033"
  "source_text": "Il n’est même pas besoin de descendre jusqu’aux êtres primitifs pour voir la complète impuissance des raisonnements quand ils ont à lutter contre des sentiments. Rappelons-nous simplement combien ont été tenaces pendant de longs siècles des superstitions religieuses, contraires à la plus simple logique. Pendant près de deux mille ans les plus lumineux génies ont été courbés sous leurs lois, et il a fallu arriver aux temps modernes pour que leur véracité ait pu seulement être contestée. Le moyen-âge et la Renaissance ont possédé bien des hommes éclairés ; ils n’en ont pas possédé un seul auquel le raisonnement ait montré les côtés enfantins de ses superstitions, et fait naître un faible doute sur les méfaits du diable ou sur la nécessité de brûler les sorciers."
  "translation_ja": "感情と争わねばならないとき、推論がいかにまったく無力かを見るのに、原始の人々にまで下りてゆく必要すらない。ごく単純な論理に反した宗教上の迷信が、長い幾世紀にもわたってどれほどしぶとく生きたかを思い起こすだけでよい。ほぼ二千年にわたり、もっとも明晰な天才たちさえその掟の下に屈した。それが真実かと問うことさえ可能になるには、近代を待たねばならなかった。中世にもルネサンスにも、多くの啓発された人々がいた。だが、推論の力によって自分の迷信の子どもじみた面を示され、悪魔のしわざや、魔術師を焼き殺す必要についてかすかな疑いを抱くに至った人は、ただの一人もいなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 303

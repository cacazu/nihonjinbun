- "id": "b1c4-015"
  "source_text": "Les bouleversements analogues à ceux que je viens de citer ne sont possibles que lorsque l’âme des foules les fait surgir. Les plus absolus despotes ne pourraient pas les déchaîner. Quand les historiens nous racontent que la Saint-Barthélemy fut l’œuvre d’un roi, ils montrent qu’ils ignorent la psychologie des foules tout autant que celle des rois. De semblables manifestations ne peuvent sortir que de l’âme des foules. Le pouvoir le plus absolu du monarque le plus despotique ne va guère plus loin que d’en hâter ou d’en retarder un peu, le moment. Ce ne sont pas les rois qui firent ni la Saint-Barthélemy, ni les guerres de religion, pas plus que ce ne fut Robespierre, Danton ou Saint-Just qui firent la Terreur. Derrière de tels événements on retrouve toujours l’âme des foules, et jamais la puissance des rois."
  "translation_ja": "いま挙げたような変乱は、群衆の魂がそれを生じさせるときにしか起こりえない。どれほど絶対的な専制君主にも、それを解き放つことはできない。サン・バルテルミの虐殺は一人の王のしわざだと歴史家が物語るとき、彼らが群衆の心理を知らず、それと同じほど王たちの心理をも知らないことが明らかになる。こうした発現は、群衆の魂からしか出てきえない。もっとも専制的な君主のもっとも絶対的な権力でも、その時を少し早めるか遅らせるか以上には、めったに及ばない。サン・バルテルミの虐殺や宗教戦争を起こしたのは王たちではない。ちょうど、恐怖政治を起こしたのがロベスピエールやダントン、サン＝ジュストではなかったのと同じことだ。そのような事件の背後にいつも見いだされるのは群衆の魂であって、王たちの権力ではけっしてない。"

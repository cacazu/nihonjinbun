- "id": "intro-022"
  "source_text": "Ce n’est qu’en approfondissant un peu la psychologie des foules qu’on comprend à quel point les lois et les institutions ont peu d’action sur elles ; combien elles sont incapables d’avoir des opinions quelconques en dehors de celles qui leur sont imposées ; que ce n’est pas avec des règles basées sur l’équité théorique pure qu’on les conduit, mais en recherchant ce qui peut les impressionner et les séduire. Si un législateur veut, par exemple, établir un nouvel impôt, devra-t-il choisir celui qui sera théoriquement le plus juste ? En aucune façon. Le plus injuste pourra être pratiquement le meilleur pour les foules. S’il est en même temps le moins visible, et le moins lourd en apparence, il sera le plus facilement admis. C’est ainsi qu’un impôt indirect, si exorbitant qu’il soit, sera toujours accepté par la foule, parce que, étant journellement payé sur des objets de consommation par fractions de centime, il ne gêne pas ses habitudes et ne l’impressionne pas. Remplacez-le par un impôt proportionnel sur les salaires ou autres revenus, à payer en une seule fois, fût-il, théoriquement dix fois moins lourd que l’autre, il soulèvera d’unanimes protestations. Aux centimes invisibles de chaque jour se substitue, en effet, une somme relativement élevée, qui paraîtra immense, et par conséquent très impressionnante, le jour où il faudra la payer. Elle ne paraîtrait faible que si elle avait été mise de côté sou à sou ; mais ce procédé économique représente une dose de prévoyance dont les foules sont incapables."
  "translation_ja": "群衆の心理を少し掘り下げてはじめて、法律や制度が群衆にいかにわずかしか作用しないか、外から押しつけられるほかにはいかなる意見をも持てないものであるか、群衆を動かすのは純粋に理論上の公平さに立つ規則ではなく、何がその心を打ち、何がそれを引きつけるかを探ることなのだと分かってくる。たとえば立法者が新税を設けようとするとき、理論上もっとも公正な税を選ぶべきであろうか。けっしてそうではない。もっとも不公正な税でも、実際には群衆にもっとも具合のよい税になりうる。それが同時にもっとも目立たず、一見もっとも軽い税ならば、いちばん容易に受け入れられるだろう。こうして間接税は、いかに法外であっても、群衆にはいつでも受け入れられる。毎日買う品物の代金に一サンチームにも満たない端数として分けて払うので、生活の習慣を妨げず、印象にも残らないからだ。これを、賃金その他の所得に比例して一度に納める税に置き換えてみよ。理論のうえでは先の税の十分の一しか重くないとしても、抗議の声がいっせいに上がる。というのは、日々目にもとまらぬ数サンチームに代わって、相対的にはまとまった額が現れ、支払いの日にはそれが途方もなく大きく見え、したがってきわめて強い印象を残すからだ。一スーずつ取りのけておいたのであれば、ようやく少額に見えるだろう。だがこうしたやりくりをするにはそれなりの先見が要るのであり、群衆にはそれがない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

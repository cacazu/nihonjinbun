- "id": "b2c3-055"
  "source_text": "Mais le prestige ne se fonde pas uniquement sur l’ascendant personnel, la gloire militaire et la terreur religieuse ; il peut avoir des origines plus modestes, et cependant être considérable encore. Notre siècle en peut fournir plusieurs exemples. Un des plus frappants, celui que la postérité rappellera d’âge en âge, sera donné par l’histoire de l’homme célèbre qui modifia la face du globe et les relations commerciales des peuples en séparant deux continents. Il réussit dans son entreprise par son immense volonté, mais aussi par la fascination qu’il exerçait sur tous ceux qui l’entouraient. Pour vaincre l’opposition unanime qu’il rencontrait, il n’avait qu’à se montrer. Il parlait un instant, et, devant le charme qu’il exerçait, les opposants devenaient des amis. Les Anglais surtout combattaient son projet avec acharnement ; il n’eut qu’à paraître en Angleterre pour rallier tous les suffrages. Quand, plus tard, il passa par Southampton, les cloches sonnèrent sur son passage, et aujourd’hui l’Angleterre s’occupe de lui élever une statue. « Ayant tout vaincu, les hommes et les choses, les marais, les rochers et les sables, » il ne croyait plus aux obstacles et voulut recommencer Suez à Panama. Il recommença avec les mêmes moyens ; mais l’âge était venu, et, d’ailleurs, la foi qui soulève les montagnes ne les soulève qu’à la condition qu’elles ne soient pas trop hautes. Les montagnes résistèrent, et la catastrophe qui s’en suivit détruisit l’éblouissante auréole de gloire qui enveloppait le héros. Sa vie enseigne comment peut grandir le prestige, et comment il peut disparaître. Après avoir égalé en grandeur les plus célèbres héros de l’histoire, il fut abaissé par les magistrats de son pays au rang des plus vils criminels. Quand il mourut, son cercueil passa isolé au milieu des foules indifférentes. Seuls, les souverains étrangers rendirent hommage à sa mémoire comme à celle de l’un des plus grands hommes qu’ait connus l’histoire[19]."
  "translation_ja": "もっとも、威信の基礎となるのは、その人自身の影響力や軍功や宗教的なおそれだけではない。もっと地味なところから生じながら、なお大きな力を持つこともある。今世紀はその例を幾つも与えてくれる。なかでもっとも目を引き、後の世の人々が時代ごとに語り継ぐであろうものの一つは、二つの大陸を切り離して地球の顔と諸民族の通商関係を変えた、あの有名な人物の生涯である。事業に成功したのは途方もない意志の力のためであるとともに、彼が周囲の全員に及ぼした魅惑のためでもあった。行く手をふさいだ全員一致の反対を打ち破るには、顔を見せるだけでよかった。しばらく話すと、彼の魅力に触れて、反対者が友になった。とりわけイギリス人が彼の計画に執拗に反対していたが、彼はイギリスに姿を現すだけで、みなの賛同を取りつけた。後にサウサンプトンを通った際には、行く先々で鐘が鳴った。今日、イギリスは彼の像を建てようとしている。「人間にも事物にも、沼地にも岩にも砂地にも、すべてに勝って」しまった彼は、もはや障害の存在を信じず、パナマでスエズをもう一度やり直そうと考えた。同じ手立てで再び取りかかった。だがすでに年齢を重ねていたし、それに、山をも動かす信仰が山を動かすのは、その山が高すぎない場合だけなのだ。山々は抗し、それに続く破局が、英雄を包んでいたまばゆい栄光の後光を消した。その一生は威信がどのように育ち、どのように消えうるかを教える。歴史上もっとも高名な英雄たちに匹敵する偉大さを得た後、自国の司法官たちによって、もっとも卑しい犯罪者の列にまで引き下ろされた。亡くなったときは、そ知らぬ顔の群衆のただなかを、その棺がさびしく通った。外国の君主たちだけが、史上のもっとも偉大な人間の一人にふさわしい敬意を、その思い出に捧げた［19］。"

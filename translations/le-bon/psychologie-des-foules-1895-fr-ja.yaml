- "id": "b3c3-008"
  "source_text": "Comme toutes les foules, les jurés sont très fortement impressionnés par des sentiments et très faiblement par des raisonnements. « Ils ne résistent pas, écrit un avocat, à la vue d’une femme donnant à téter, ou à un défilé d’orphelins. » « Il suffit qu’une femme soit agréable, dit M. des Glajeux, pour obtenir la bienveillance du jury. »"
  "translation_ja": "あらゆる群衆と同じく、陪審員も感情には非常に強く動かされるが、推論にはごくわずかしか動かされない。「彼らは、乳を飲ませる女性の姿や、次々と入ってくる孤児の列を見ると、とても平気ではいられない」とある弁護士は書く。「女性が感じのよい人と見えるだけで、陪審の好意が得られる」とデ・グラジュー氏も言っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 457
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[462]"
  "section_id": "b3c3"

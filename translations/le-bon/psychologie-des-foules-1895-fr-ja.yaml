- "id": "b1c1-019"
  "source_text": "C’est surtout par les éléments inconscients qui forment l’âme d’une race, que se ressemblent tous les individus de cette race, et c’est principalement par les éléments conscients, fruits de l’éducation mais surtout d’une hérédité exceptionnelle, qu’ils diffèrent. Les hommes les plus dissemblables par leur intelligence ont des instincts, des passions, des sentiments fort semblables. Dans tout ce qui est matière de sentiment : religion, politique, morale, affections et antipathies, etc., les hommes les plus éminents ne dépassent que bien rarement le niveau des individus les plus ordinaires. Entre un grand mathématicien et son bottier il peut exister un abîme au point de vue intellectuel, mais au point de vue du caractère la différence est le plus souvent nulle ou très faible."
  "translation_ja": "同じ人種に属する人々がみな互いに似るのは、おもにその人種の魂をなす無意識の要素によってであり、人々が互いに違うのは、おもに、教育の、だがとりわけ例外的な遺伝の産物である、意識される要素によってである。知性のうえでもっとも異なる人々にも、よく似た本能、情熱、感情がある。宗教、政治、道徳、愛憎その他、感情がものを言う領域では、もっとも傑出した者が、ごくありふれた人の水準を超えるのは、めったにない。一人の大数学者と、その靴を作る職人のあいだには、知性という点で深淵が開いているかもしれない。だが性格の点では、多くの場合、差はないか、あってもほんのわずかである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 93
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[95]"
  "section_id": "b1c1"

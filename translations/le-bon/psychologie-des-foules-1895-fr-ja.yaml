- "id": "b3c4-028"
  "source_text": "Il serait d’ailleurs d’autant plus inutile d’essayer d’ébranler ce dogme qu’il a des raisons apparentes pour lui : « Dans les temps d’égalité, dit justement Tocqueville, les hommes n’ont aucune foi les uns dans les autres, à cause de leur similitude ; mais cette même similitude leur donne une confiance presque illimitée dans le jugement du public ; car il ne leur paraît pas vraisemblable, qu’ayant tous des lumières pareilles, la vérité ne se rencontre pas du côté du plus grand nombre. »"
  "translation_ja": "そもそもこの教義には見かけのうえでそれを支持する理由もあるから、動かそうとする試みはなおさらむなしい。トクヴィルは正しくもこう言う。「平等の時代、人々は互いに似ているせいで、だれも互いを信じない。だがまさに同じ類似が、公衆の判断に対しては、ほとんど無制限の信頼を与える。というのも、すべての者が同じような知性を備えている以上、もっとも数の多い側に真理がないとは彼らに思えないからだ」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

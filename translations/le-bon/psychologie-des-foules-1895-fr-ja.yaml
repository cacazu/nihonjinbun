- "id": "b1c3-006"
  "source_text": "Ayant suffisamment traité ce sujet, je n’y reviendrai pas maintenant et me bornerai à dire quelques mots des idées qui sont accessibles aux foules et sous quelles formes celles-ci les conçoivent."
  "translation_ja": "この問題はすでに十分扱ったので、いま改めては取り上げない。群衆の手に届く思想がどのようなもので、いかなる形をとると群衆がそれを捉えるのかについて、一言二言述べるにとどめよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 175
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[175]"
  "section_id": "b1c3s1"

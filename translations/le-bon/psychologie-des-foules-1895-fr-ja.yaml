  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-008"
  "source_text": "L’évanouissement de la personnalité consciente et l’orientation des sentiments et des pensées dans un sens déterminé, qui sont les premiers traits de la foule en voie de s’organiser, n’impliquent pas toujours la présence simultanée de plusieurs individus sur un seul point. Des milliers d’individus séparés peuvent à certains moments, sous l’influence de certaines émotions violentes, un grand événement national par exemple, acquérir les caractères d’une foule psychologique. Il suffira alors qu’un hasard quelconque les réunisse pour que leurs actes revêtent aussitôt les caractères spéciaux aux actes des foules. À certains moments, une demi-douzaine d’hommes peuvent constituer une foule psychologique, tandis que des centaines d’hommes réunis par hasard peuvent ne pas la constituer. D’autre part, un peuple entier, sans qu’il y ait agglomération visible, peut devenir foule sous l’action de certaines influences."
  "translation_ja": "意識する人格が薄れ、感情や考えが一定の方向を向くことは、群衆が組織をなし始める最初の徴候だが、それにはいつも何人もの人が同時に一か所にいなければならないわけではない。互いに離れた数千人でも、あるとき、たとえば国を挙げての大事件のような、激しい感情を呼び起こすものの影響を受ければ、心理的群衆の性質を身につけうる。そうなれば、どんな偶然からであれ、人々が寄り合うだけで、その行動にはたちまち群衆の行動に特有の性質が現れる。ときには五、六人でも心理的群衆をなしうるし、偶然集まった何百人でも、それをなさないことがある。また一国の民全体が、目に見える人だかりもないまま、ある影響を受けて群衆になることもある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "toc-020"
  "source_text": "§ 1. Les images, les mots et les formules. – Puissance magique des mots et des formules. – La puissance des mots est liée aux images qu’ils évoquent et est indépendante de leur sens réel. – Ces images varient d’âge en âge, de race en race. – L’usure des mots. – Exemples des variations considérables du sens de quelques mots très usuels. – Utilité politique de baptiser de noms nouveaux les choses anciennes, lorsque les mots sous lesquels on les désignait produisent une fâcheuse impression sur les foules. – Variations du sens des mots suivant la race. – Sens différents du mot démocratie en Europe et en Amérique. – § 2. Les illusions. – Leur importance. – On les retrouve à la base de toutes les civilisations. – Nécessité sociale des illusions. – Les foules les préfèrent toujours aux vérités. – § 3. L’expérience. – L’expérience seule peut établir dans l’âme des foules des vérités devenues nécessaires et détruire des illusions devenues dangereuses. – L’expérience n’agit qu’à condition d’être fréquemment répétée. – Ce que coûtent les expériences nécessaires pour persuader les foules. – § 4. La raison. — Nullité de son influence sur les foules. – On n’agit sur elles qu’en agissant sur leurs sentiments inconscients. – Le rôle de la logique dans l’histoire. – Les causes secrètes des événements invraisemblables."
  "translation_ja": "一　像、言葉、決まり文句。言葉と決まり文句の魔力。言葉の力はそれが呼び起こす像に結びつき、その実際の意味とは無関係である。これらの像は時代ごと、人種ごとに変わる。言葉の摩耗。ごくありふれた語で意味が大きく変化した例。古い呼び名が群衆に悪い印象を与えるとき、古いものに新しい名をつけることの政治的な有用性。人種による語義の違い。「民主主義」という語のヨーロッパとアメリカでの意味の違い。二　幻想。その重要性。あらゆる文明の土台に幻想が見いだされる。社会にとっての幻想の必要性。群衆はいつも真理より幻想を好む。三　経験。必要になった真理を群衆の魂に根づかせ、危険になった幻想を壊すことのできるのは、経験だけである。経験は幾度も繰り返されて初めて作用する。群衆を納得させるのに必要な経験の代価。四　理性。群衆に対する影響力のなさ。群衆に働きかけるには、その無意識の感情に働きかけるほかない。歴史における論理の役割。ありそうもない出来事の隠れた原因。"

  "translation_status": "reviewed"
- "id": "b1c2-011"
  "source_text": "Rien donc ne saurait être prémédité chez les foules. Elles peuvent parcourir successivement la gamme des sentiments les plus contraires, mais elles seront toujours sous l’influence des excitations du moment. Elles sont semblables aux feuilles que l’ouragan soulève, disperse en tous sens, puis laisse retomber. En étudiant ailleurs certaines foules révolutionnaires, nous montrerons quelques exemples de la variabilité de leurs sentiments."
  "translation_ja": "こうして群衆には、前もってよくよく考えておいたことなどありようがない。互いに正反対の感情の音階を順々に駆けめぐることはあっても、いつもその瞬間の刺激の支配下にある。群衆は、暴風が吹き上げ、八方へ散らし、それから落ちるに任せる木の葉に似ている。ほかのところで革命期のある群衆を調べるときに、この感情の変わりやすさを示す例をいくつか挙げよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 117
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[119]"
  "section_id": "b1c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-012"
  "source_text": "Cette mobilité des foules les rend très difficiles à gouverner, surtout lorsqu’une partie des pouvoirs publics est tombée entre leurs mains. Si les nécessités de la vie de chaque jour ne constituaient une sorte de régulateur invisible des choses, les démocraties ne pourraient guère durer. Mais, si les foules veulent les choses avec frénésie, elles ne les veulent pas bien longtemps. Elles sont aussi incapables de volonté durable que de pensée."
  "translation_ja": "群衆はこうも移り気なので、とりわけ公権力の一部が群衆の手に渡っているとき、それを治めるのはたいへん難しい。日々の暮らしの必要が、いわば目に見えない調整器として物事に働いていなかったら、民主政はまず長続きしないだろう。だが、群衆が何かを欲しがるときの激しさは並々ならぬものでも、その欲求が長く続くことはない。意志を持ち続けることも、考えを持ち続けることも、同じようにできないのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 118

- "id": "b1c3-012"
  "source_text": "Les idées n’étant accessibles aux foules qu’après avoir revêtu une forme très simple, doivent, pour devenir populaires, subir souvent les plus complètes transformations. C’est surtout quand il s’agit d’idées philosophiques ou scientifiques un peu élevées, qu’on peut constater la profondeur des modifications qui leur sont nécessaires pour descendre de couche en couche jusqu’au niveau des foules. Ces modifications dépendent des catégories des foules ou de la race à laquelle ces foules appartiennent ; mais elles sont toujours amoindrissantes et simplifiantes. Et c’est pourquoi, au point de vue social, il n’y a guère, en réalité, de hiérarchie des idées, c’est-à-dire d’idées plus ou moins élevées. Par le fait seul qu’une idée arrive aux foules et peut agir, si grande ou si vraie qu’elle ait été à son origine, elle est dépouillée de presque tout ce qui faisait son élévation et sa grandeur."
  "translation_ja": "群衆が思想を捉えられるのは、それがごく単純な形を取ってからなので、一つの思想が広く行き渡るには、しばしばすっかり姿を変えねばならない。とりわけ多少とも高度な哲学的、科学的思想の場合に、それが一層また一層と降りて群衆の水準に至るまでに、どれほどの変化を必要とするかがよく分かる。変化のあり方は群衆の種類や、それが属する人種に左右される。しかしつねに中身を減らし、単純にする方向に働く。だから社会のうえから見るかぎり、実際には思想の序列、つまり思想に高低の別があるとは、まず言えない。いかに偉大で真理にかなった思想として出発しても、群衆に届き、これを動かせるようになったということだけで、その高さと偉大さをなしていたほとんどすべてが削ぎ落とされる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b1c2-061"
  "source_text": "Même pour les parfaits gredins, il arrive fort souvent que le fait seul d’être réunis en foule leur donne momentanément des principes de moralité très stricts. Taine fait remarquer que les massacreurs de septembre venaient déposer sur la table des comités les portefeuilles et les bijoux qu’ils trouvaient sur leurs victimes, et qu’ils eussent pu aisément dérober. La foule hurlante, grouillante et misérable qui envahit les Tuileries pendant la Révolution de 1848, ne s’empara d’aucun des objets qui l’éblouirent et dont un seul eût représenté du pain pour bien des jours."
  "translation_ja": "筋金入りの悪党でも、群衆として寄り合ったというだけで、一時の間、ひどく厳格な道徳律を持つことがごくよくある。テーヌが指摘するように、九月虐殺の実行者たちは、殺した相手から見つけ、手軽に盗めたはずの財布や宝石を、委員会の机の上に届けに来た。一八四八年の革命のとき、テュイルリー宮に侵入した、わめき、うごめく貧しい群衆は、目をくらませた品々を一つとして奪わなかった。その一つだけで何日もパンを買えたはずなのに。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 167
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[168]"
  "section_id": "b1c2s5"

- "id": "b2c1-011"
  "source_text": "§ 1. — LA RACE"
  "translation_ja": "第一節　人種"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 229
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h5"
  "section_id": "b2c1s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-012"
  "source_text": "Ce facteur, la race, doit être mis au premier rang, car à lui seul il dépasse de beaucoup en importance tous les autres. Nous l’avons suffisamment étudié dans un autre ouvrage pour qu’il soit inutile d’y revenir encore. Nous avons fait voir, dans un précédent volume, ce qu’est une race historique, et comment, lorsque ses caractères sont formés, elle possède de par les lois de l’hérédité une puissance telle, que ses croyances, ses institutions, ses arts — en un mot tous les éléments de sa civilisation — ne sont que l’expression extérieure de son âme. Nous avons montré que la puissance de la race est telle qu’aucun élément ne peut passer d’un peuple à un autre sans subir les transformations les plus profondes[6]. Le milieu, les circonstances, les événements représentent les suggestions sociales du moment. Ils peuvent avoir une influence considérable, mais cette influence est toujours momentanée si elle est contraire aux suggestions de la race, c’est-à-dire de toute la série des ancêtres."
  "translation_ja": "この要因、すなわち人種を、第一に置かねばならない。それ一つだけで、重要さにおいてほかのすべてをはるかにしのぐからだ。この点は別の著作で十分に調べたので、あらためて立ち戻る必要はない。前著で私たちは、歴史のなかで形づくられる人種とはどういうものかを示した。また、いったんその性質が形を取ると、遺伝の法則により、どれほどの力を持ち、その信念や制度や芸術、一言でいえば文明の全要素が、その魂の外に現れた表現にほかならなくなるかを示した。人種の力はこれほど強いので、どのような要素も一つの民族から別の民族に移るには、きわめて深い変容を経ずにはすまないことも示した［6］。環境、事情、出来事は、その時点の社会的な暗示を表している。大きな影響を持つことはありうるが、人種の暗示、すなわち連綿と続く祖先全部からの暗示に逆らうのであれば、その影響はつねに一時的である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 230
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[234]"
  "section_id": "b2c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-note-6"
  "section_id": "b2c1s1"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Cette proposition étant bien nouvelle encore, et l’histoire étant tout à fait inintelligible sans elle, j’ai consacré dans mon dernier ouvrage (Les Lois psychologiques de l’évolution des peuples) quatre chapitres à sa démonstration. Le lecteur y verra que, malgré de trompeuses apparences, ni la langue, ni la religion, ni les arts, ni, en un mot, aucun élément de civilisation, ne peut passer intact d’un peuple à un autre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p70-6"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p70-6"
  "translation_ja": "この命題はいまだきわめて新しいが、それなしには歴史がまったく理解できないので、私は前著『諸民族の進化を律する心理法則』の四章をその論証に当てた。そこを読めば、見かけには欺かれやすいが、言語も宗教も芸術も、ひとことで言えば文明のどの要素も、ある民族から別の民族へ、そのままでは移れないことが分かるであろう。"
  "translation_status": "reviewed"
- "id": "b2c1-013"
  "source_text": "Dans plusieurs chapitres de cet ouvrage, nous aurons encore occasion de revenir sur l’influence de la race, et de montrer que cette influence est si grande qu’elle domine les caractères spéciaux à l’âme des foules ; de là ce fait que les foules de divers pays présentent dans leurs croyances et leur conduite des différences très considérables, et ne peuvent être influencées de la même façon."
  "translation_ja": "本書のいくつかの章で、私たちは再び人種の影響に戻る機会を持ち、その影響は群衆の魂に特有の性質まで支配するほど大きいことを示すだろう。各国の群衆がその信念と行いに著しい違いを示し、同じやり方では動かされないという事実も、そこから来ている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 231

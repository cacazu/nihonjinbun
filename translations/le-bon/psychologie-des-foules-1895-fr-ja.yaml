  "source_text": "Un journal étranger, la Neu Freie Presse, de Vienne, s’est livré au sujet de la destinée de Lesseps à des réflexions d’une très judicieuse psychologie, et que, pour cette raison, je reproduis ici : « Après la condamnation de Ferdinand de Lesseps, on n’a plus le droit de s’étonner de la triste fin de Christophe Colomb. Si Ferdinand de Lesseps est un escroc, toute noble illusion est un crime. L’antiquité aurait couronné la mémoire de Lesseps d’une auréole de gloire, et lui aurait fait boire à la coupe du nectar au milieu de l’Olympe, car il a changé la face de la terre, et il a accompli des œuvres qui perfectionnent la création. En condamnant Ferdinand de Lesseps, le président de la Cour d’appel s’est fait immortel, car toujours les peuples demanderont le nom de l’homme qui ne craignit pas d’abaisser son siècle pour habiller de la casaque du forçat un vieillard dont la vie a été la gloire de ses contemporains. « Qu’on ne nous parle plus désormais de justice inflexible, là où règne la haine bureaucratique contre les grandes œuvres hardies. Les nations ont besoin de ces hommes audacieux qui croient en eux-mêmes et franchissent tous les obstacles, sans égard pour leur propre personne. Le génie ne peut pas être prudent ; avec la prudence il ne pourrait jamais élargir le cercle de l’activité humaine. « … Ferdinand de Lesseps a connu l’ivresse du triomphe et l’amertume des déceptions : Suez et Panama. Ici le cœur se révolte contre la morale du succès. Lorsque de Lesseps eut réussi à relier deux mers, princes et nations lui rendirent leurs hommages ; aujourd’hui qu’il échoue contre les rochers des Cordillères, il n’est plus qu’un vulgaire escroc… Il y a là une guerre des classes de la société, un mécontentement de bureaucrates et d’employés qui se vengent par le code criminel contre ceux qui voudraient s’élever au-dessus des autres… Les législateurs modernes se trouvent embarrassés devant ces grandes idées du génie humain ; le public y comprend moins encore, et il est facile à un avocat général de prouver que Stanley est un assassin et Lesseps un trompeur. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p124-19"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p124-19"
  "translation_ja": "外国紙であるウィーンの『ノイエ・フライエ・プレッセ』は、レセップスの運命について、心理の見方として実に当を得た感想を述べた。その理由からここに引く。\n\n「フェルディナン・ド・レセップスに有罪判決が下った後では、クリストファー・コロンブスの悲しい最期に驚く資格はもうない。フェルディナン・ド・レセップスが詐欺師なら、あらゆる気高い夢は罪である。古代であれば、レセップスの名に栄光の後光をいただかせ、オリュンポスの神々のただなかで神酒の杯を飲ませたことだろう。なぜなら彼は大地の姿を変え、創造の業をさらに完全にする仕事を成し遂げたからである。フェルディナン・ド・レセップスに有罪を宣告した控訴院長は、みずからの名を不滅にした。後の世の人々はつねに、同時代人の栄光であった生涯を送った老人に囚人服を着せるためなら、自分の世紀をおとしめることを恐れなかった男の名を尋ねるだろうからだ。\n\n「大胆な大事業への役人の憎悪が支配するところで、曲げられぬ正義のことなど今後われわれに語ってくれるな。諸国民に必要なのは、自分を信じ、わが身をかえりみずあらゆる障害を越える大胆な人間である。天才は慎重ではありえない。慎重であれば人類の活動の圏を広げることはけっしてできない。\n\n「……フェルディナン・ド・レセップスは勝利の陶酔と失望の苦さを知った。スエズとパナマである。ここでは心が、成功した者だけを善とする道徳に反抗する。ド・レセップスが二つの海を結ぶことに成功したとき、諸侯も国民も彼に敬意を捧げた。今日、山脈の岩に行く手を阻まれて失敗すると、もはやありふれた詐欺師にすぎなくなる。……ここには社会の諸階級の戦争がある。役人や勤め人が不満を募らせ、ほかの者たちより頭一つ抜け出ようとする者に、刑法典で仕返しをしている。……近代の立法者たちは人間の天才が生んだこれらの大思想を前に途方に暮れ、世間はなおさら何も理解せず、検事がスタンリーは殺人者、レセップスはぺてん師だと立証するのはたやすい」。"
  "translation_status": "reviewed"
- "id": "b2c3-056"
  "source_text": "Mais les divers exemples qui viennent d’être cités représentent des formes extrêmes. Pour établir dans ses détails la psychologie du prestige, il faudrait les placer à l’extrémité d’une série qui descendrait des fondateurs de religions et d’empires jusqu’au particulier essayant d’éblouir ses voisins par un habit neuf ou une décoration."
  "translation_ja": "とはいえ、いま挙げたいくつかの例はいずれも極端な形である。威信の心理を細部まで明らかにしようとすれば、それらは、宗教や帝国の創始者から、新調の服や勲章で近所の人の目をくらませようとする一市民にまで下りてくる系列の、一方の端に置かなければならない。"

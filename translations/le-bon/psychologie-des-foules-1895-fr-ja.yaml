- "id": "b2c1-050"
  "source_text": "Et le grand philosophe arrive à la conclusion suivante sur la disconvenance croissante de notre éducation latine et de la vie."
  "translation_ja": "そしてこの大哲学者は、ラテン式の教育が現実の生活にますます合わなくなっていることについて、次のように結論している。"

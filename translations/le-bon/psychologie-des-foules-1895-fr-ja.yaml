- "id": "b2c3-018"
  "source_text": "La seconde catégorie des meneurs, celle des hommes à volonté durable, a, malgré des formes moins brillantes, une influence beaucoup plus considérable. En elle on trouve les vrais fondateurs de religions ou de grandes œuvres : saint Paul, Mahomet, Christophe Colomb, Lesseps. Qu’ils soient intelligents ou bornés, il n’importe, le monde sera toujours à eux. La volonté persistante qu’ils possèdent est une faculté infiniment rare et infiniment puissante qui fait tout plier. On ne se rend pas toujours suffisamment compte de ce que peut une volonté forte et continue : rien ne lui résiste, ni la nature, ni les dieux, ni les hommes."
  "translation_ja": "指導者の第二の種類、持続する意志を持つ者は、見た目こそさほど華々しくないにせよ、ずっと大きな影響を及ぼす。そのなかに、宗教や大事業をほんとうに築いた者たち、聖パウロ、ムハンマド、クリストファー・コロンブス、レセップスがいる。彼らが聡明か狭量かはどうでもよく、世界はつねに彼らのものとなる。彼らの持つ粘り強い意志は、無限にまれで、何ものをも屈服させる、無限に強い能力である。強く持続する意志に何ができるかは、つねに十分理解されているわけではない。自然も神々も人間も、何ひとつこれに抗しえない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

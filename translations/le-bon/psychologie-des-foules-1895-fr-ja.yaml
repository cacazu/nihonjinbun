  "translation_status": "reviewed"
- "id": "b2c3-034"
  "source_text": "C’est surtout par le mécanisme de la contagion, jamais par celui du raisonnement, que se propagent les opinions et les croyances des foules. C’est au cabaret, par affirmation, répétition et contagion que s’établissent les conceptions actuelles des ouvriers ; et les croyances des foules de tous les âges ne se sont guère créées autrement. Renan compare avec justesse les premiers fondateurs du christianisme « aux ouvriers socialistes répandant leurs idées de cabaret en cabaret » ; et Voltaire avait déjà fait observer à propos de la religion chrétienne que « la plus vile canaille l’avait seule embrassée pendant plus de cent ans »."
  "translation_ja": "群衆の意見と信念が広まるのは、主として伝染の仕組みによってであり、推論の仕組みによってではけっしてない。今日の労働者たちの考えが形を成すのは酒場において、断言と反復と伝染を通じてである。どの時代の群衆の信念も、ほとんどそれ以外の仕方で生まれたことはない。ルナンは、キリスト教を最初に築いた者たちを「酒場から酒場へと自分たちの考えを広めて回る社会主義の労働者たち」にたとえている。的を射たたとえだ。ヴォルテールもすでにキリスト教について、「百年以上もの間、この宗教を受け入れたのはもっとも下賤なやからだけだった」と指摘していた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 339
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[346]"
  "section_id": "b2c3s2"

- "id": "b3c4-031"
  "source_text": "Restreint ou général, sévissant dans un pays républicain ou dans un pays monarchique, pratiqué en France, en Belgique, en Grèce, en Portugal ou en Espagne, le suffrage des foules est partout identique, et ce qu’il traduit en définitive, ce sont les aspirations et les besoins inconscients de la race. La moyenne des élus représente pour chaque pays l’âme moyenne de la race. D’une génération à l’autre on la retrouve à peu près identique."
  "translation_ja": "制限があろうと一般に開かれていようと、共和国に猛威を振るおうと君主国に振るおうと、フランス、ベルギー、ギリシア、ポルトガル、スペインのどこで行われようと、群衆の投票はどこでも同一であり、結局それが映し出すのは、人種の無意識の願望と必要である。どの国でも、当選者の平均像は人種の魂の平均を表す。一世代から次へ移っても、ほぼ同じ姿に再会する。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 497
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[507]"
  "section_id": "b3c4"

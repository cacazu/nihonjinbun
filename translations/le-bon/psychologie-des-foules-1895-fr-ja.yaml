- "id": "b1c4-006"
  "source_text": "Ce sentiment a des caractéristiques très simples : adoration d’un être supposé supérieur, crainte de la puissance magique qu’on lui suppose, soumission aveugle à ses commandements, impossibilité de discuter ses dogmes, désir de les répandre, tendance à considérer comme ennemis tous ceux qui ne les admettent pas. Qu’un tel sentiment s’applique à un Dieu invisible, à une idole de pierre ou de bois, à un héros ou à une idée politique, du moment qu’il présente les caractéristiques précédentes il reste toujours d’essence religieuse. Le surnaturel et le miraculeux s’y retrouvent au même degré. Inconsciemment les foules revêtent d’une puissance mystérieuse la formule politique ou le chef victorieux qui pour le moment les fanatise."
  "translation_ja": "この感情の特徴はごく単純だ。より高いとみなされる存在をあがめ、そこにあると想定される魔力を恐れ、その命令に盲従し、その教義を論議できず、それを広めたがり、認めない者はだれもかれも敵とみなす。そのような感情が、目に見えぬ神に向けられようと、石や木の偶像、英雄、はては政治思想に向けられようと、いま挙げた特徴を示すかぎり、その本質はいずれも宗教的である。超自然と奇跡は、どの場合にも同じ程度で見いだされる。群衆は無意識のうちに、そのとき自分を狂信させる政治上の決まり文句や勝利の指導者に、神秘的な力をまとわせる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 207
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[209]"
  "section_id": "b1c4"

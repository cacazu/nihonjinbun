- "id": "b2c1-047"
  "source_text": "« … Au moins neuf sur dix ont perdu leur temps et leur peine, plusieurs années de leur vie, et des années efficaces, importantes ou même décisives : comptez d’abord la moitié ou les deux tiers de ceux qui se présentent à l’examen, je veux dire les refusés ; ensuite, parmi les admis, gradués, brevetés et diplômés, encore la moitié ou les deux tiers, je veux dire les surmenés. On leur a demandé trop en exigeant que tel jour, sur une chaise ou devant un tableau, ils fussent, deux heures durant et pour un groupe de sciences, des répertoires vivants de toute la connaissance humaine ; en effet, ils ont été cela, ou à peu près, ce jour-là, pendant deux heures ; mais, un mois plus tard, ils ne le sont plus ; ils ne pourraient pas subir de nouveau l’examen ; leurs acquisitions, trop nombreuses et trop lourdes, glissent incessamment hors de leur esprit, et ils n’en font pas de nouvelles. Leur vigueur mentale a fléchi ; la sève féconde est tarie ; l’homme fait apparaît, et, souvent c’est l’homme fini. Celui-ci, rangé, marié, résigné à tourner en cercle et indéfiniment dans le même cercle, se cantonne dans son office restreint ; il le remplit correctement, rien au delà. Tel est le rendement moyen ; certainement la recette n’équilibre pas la dépense. En Angleterre et en Amérique, où, comme jadis avant 1789, en France, on emploie le procédé inverse, le rendement obtenu est égal ou supérieur. »"
  "translation_ja": "「……少なくとも十人中九人は時間と労力を失った。人生の何年か、しかも有効で大切な、あるいは決定的でさえある何年かを失った。まず受験者の半分か三分の二、つまり不合格者を数えてほしい。次に、受かった者、学位や証書や免状を得た者のうちでも、また半数か三分の二、つまり勉強で疲れ果てた者たちを加えてほしい。指定の日に、いすの上なり黒板の前なりで二時間、ひとまとまりの学問について、人類のあらゆる知識の生きた目録となれと求めたのは、過大な要求だった。実際、その日の二時間、彼らはそういうもの、あるいはそれに近いものだった。だがひと月後には、もはやそうではない。もう一度試験を受けることもできまい。詰め込んだものが多すぎ重すぎて、絶えず頭からこぼれ落ち、新しく何かを身につけることもない。心の力はくじけ、実りの樹液は枯れた。一人前の人間が出来上がる。しばしばそれは、もう終わってしまった人間だ。身をおさめ、結婚し、同じ輪の中を果てもなく回ることに甘んじて、狭い職分に閉じこもる。卒なくこなすが、それ以上は何もない。これが平均の収穫であり、得たものは明らかに費やしたものに釣り合わない。かつて一七八九年以前のフランスでそうだったように、逆の方法を取るイギリスとアメリカで得られる収穫は、同等かそれ以上である」。"

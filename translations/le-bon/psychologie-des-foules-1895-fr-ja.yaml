- "id": "b3c5-046"
  "source_text": "Le tableau peut paraître sombre. Il est exact pourtant. Les assemblées parlementaires suffisamment excitées et hypnotisées présentent les mêmes caractères. Elles deviennent un troupeau mobile obéissant à toutes les impulsions. La description suivante de l’assemblée de 1848, due à un parlementaire dont on ne suspectera pas la foi démocratique, M. Spuller, et que je reproduis d’après la Revue littéraire, est bien typique. On y retrouve tous les sentiments exagérés que j’ai décrits dans les foules, et cette mobilité excessive qui permet de passer d’un instant à l’autre par la gamme des sentiments les plus contraires."
  "translation_ja": "絵柄は暗く見えるかもしれない。だがこれは正確である。十分に興奮し催眠を受けた議会は、同じ性質を示す。あらゆる衝動に従って動き回る一群の家畜になる。民主主義を信奉していたことに疑いを差し挟まれはしない議会人、スピュレール氏が一八四八年の議会を描いた文章を、『ルヴュ・リテレール』から引こう。まさに典型と言える記述だ。私が群衆について述べてきた感情の誇張も、まるで正反対の感情の音階をたちまち上り下りさせる極度の移り気も、すべてここに見いだされる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 544
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[554]"
  "section_id": "b3c5"

- "id": "b3c2-015"
  "source_text": "« Ils ont la sympathie expansive et la sensibilité prompte de l’ouvrier parisien. À l’Abbaye, un fédéré, apprenant que depuis vingt-six heures on avait laissé les détenus sans eau, voulait absolument exterminer le guichetier négligent, et l’eût fait sans les supplications des détenus eux-mêmes. Lorsqu’un prisonnier est acquitté (par leur tribunal improvisé), gardes et tueurs, tout le monde l’embrasse avec transport, on applaudit à outrance, » puis on retourne tuer les autres en tas. Pendant le massacre, une aimable gaieté ne cesse de régner. Ils dansent et chantent autour des cadavres, disposent des bancs « pour les dames » heureuses de voir tuer des aristocrates. Ils continuent aussi à faire preuve d’une équité spéciale. […]"
  "translation_ja": "「彼らにはパリの労働者の、外へとあふれる同情心と感じやすさとがある。アベイ監獄で一人の連盟兵は、囚人たちが二十六時間も水を与えられていなかったと知ると、職務を怠った門番をどうしても殺そうとした。囚人たち自身の懇願がなければ、そうしたであろう。一人の囚人が（この即席の裁判所で）無罪とされると、番人も殺し手もこぞって夢中で抱擁し、割れるような喝采を浴びせる」。そうしてほかの者たちをまとめて殺す仕事に戻る。虐殺のあいだ、親しげな陽気さが絶えずその場を支配する。彼らは死体を囲んで踊り歌い、貴族が殺されるのを見て喜ぶ「ご婦人方のために」腰かけを並べる。また独特な公正さを示しつづける。〔以下、この段落の末尾を省略。〕"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 445
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[450]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "partial"
  "issues":

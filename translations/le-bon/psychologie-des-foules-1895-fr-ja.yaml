- "id": "b2c3-021"
  "source_text": "Le livre qui raconterait la vie de tous ces grands meneurs ne contiendrait pas beaucoup de noms ; mais ces noms ont été à la tête des événements les plus importants de la civilisation et de l’histoire."
  "translation_ja": "こうした大指導者たち全員の生涯を物語る本に、さほど多くの名は載るまい。だがそれらの名は、文明と歴史のもっとも重要な出来事の先頭に立ってきた。"
  "source_languages":

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-059"
  "source_text": "Ce n’est pas impunément qu’ils les acceptent. Habitués à supporter tous les jougs, ils finissent bientôt par les rechercher, et arrivent à perdre toute spontanéité et toute énergie. Ils ne sont plus alors que des ombres vaines, des automates passifs, sans volonté, sans résistance et sans force."
  "translation_ja": "それを受け入れても何の代価も払わずにすむわけではない。あらゆるくびきに耐え慣れると、じきに自分からそれを求めるようになり、あらゆる自発性と活力を失ってしまう。そのとき彼らはもはやむなしい影でしかなく、意志も、抵抗する力も、力そのものもない、受け身の自動人形でしかない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 557
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[568]"
  "section_id": "b3c5"

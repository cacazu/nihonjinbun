- "id": "b2c3-002"
  "source_text": "Les meneurs des foules et leurs moyens de persuasion."
  "translation_ja": "群衆の指導者と、その説得の手段"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 307
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[55]"
  "section_id": "b2c3"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-003"
  "source_text": "§ 1. Les meneurs des foules. – Besoin instinctif de tous les êtres en foule d’obéir à un meneur. – Psychologie des meneurs. –Eux seuls peuvent créer la foi et donner une organisation aux foules. – Despotisme forcé des meneurs. – Classification des meneurs. – Rôle de la volonté. – § 2. Les moyens d’action des meneurs. – L’affirmation, la répétition, la contagion. – Rôle respectif de ces divers facteurs. – Comment la contagion peut remonter des couches inférieures aux couches supérieures d’une société. – Une opinion populaire devient bientôt une opinion générale. – § 3. Le prestige. — Définition et classification du prestige. – Le prestige acquis et le prestige personnel. — Exemples divers. – Comment meurt le prestige."
  "translation_ja": "一　群衆の指導者。群れをなす生き物はすべて本能的に指導者に従うことを必要とする。指導者の心理。信仰を生み出し、群衆に組織を与えられるのは指導者だけである。指導者が専制的にならざるをえないこと。指導者の分類。意志の役割。二　指導者が働きかける手段。断言、反復、伝染。それぞれの要因の役割。伝染が社会の下層から上層にまで上ってゆく仕組み。民衆の意見はじきに世間一般の意見になる。三　威信。威信の定義と分類。後から得た威信とその人自身の威信。さまざまな例。威信はいかに死ぬか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 308
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[56]"
  "section_id": "b2c3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-004"
  "source_text": "La constitution mentale des foules nous est maintenant connue, et nous savons aussi quels sont les mobiles capables d’impressionner leur âme. Il nous reste à rechercher comment doivent être appliqués ces mobiles, et par qui ils peuvent être utilement mis en œuvre."
  "translation_ja": "群衆の心のつくりは、いまや分かった。群衆の魂に印象を刻みうる動機が何であるかも知っている。私たちに残るのは、これらの動機がどう用いられねばならず、まただれがそれを有効に働かせうるかを探ることだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 309

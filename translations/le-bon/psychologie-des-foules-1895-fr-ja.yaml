- "id": "preface-009"
  "source_text": "Il faut donc, en étudiant un phénomène social, le considérer successivement sous deux aspects très différents. On voit alors que les enseignements de la raison pure sont bien souvent contraires à ceux de la raison pratique. Il n’est guère de données, même physiques, auxquelles cette distinction ne soit applicable. Au point de vue de la vérité absolue, un cube, un cercle, sont des figures géométriques invariables, rigoureusement définies par certaines formules. Au point de vue de notre œil, ces figures géométriques peuvent revêtir des formes très variées. La perspective peut transformer en effet le cube en pyramide ou en carré, le cercle en ellipse ou en ligne droite ; et ces formes fictives sont beaucoup plus importantes à considérer que les formes réelles, puisque ce sont les seules que nous voyons et que la photographie ou la peinture puissent reproduire. L’irréel est dans certains cas plus vrai que le réel. Figurer les objets avec leurs formes géométriques exactes serait déformer la nature et la rendre méconnaissable. Si nous supposons un monde dont les habitants ne puissent que copier ou photographier les objets sans avoir la possibilité de les toucher, ils n’arriveraient que très difficilement à se faire une idée exacte de leur forme. La connaissance de cette forme, accessible seulement à un petit nombre de savants, ne présenterait d’ailleurs qu’un intérêt très faible."
  "translation_ja": "したがって、社会現象を調べるときには、まるで異なる二つの面から順に眺める必要がある。そうすると、純粋な理性の教えるところが、実際に働く理性の教えるところと、しばしば逆になるのが分かる。この区別が当てはまらない事柄は、物理的なものにさえほとんどない。絶対的な真理の立場からすれば、立方体や円は不変の幾何学図形で、一定の式で厳密に定義できる。だが私たちの目には、これらの図形は実にさまざまな姿を取りうる。遠近法に従えば、立方体は角錐や正方形に、円は楕円や一本の直線にすらなりうる。しかも本当の形より、こうした仮の形のほうを考慮することに、はるかに意味がある。私たちに見えるのも、写真や絵画に写し取れるのも、それだけだからだ。実在しないもののほうが、実在するものより真実だという場合がある。物を幾何学どおりの正確な形で描けば、かえって自然をゆがめ、何を描いたのか見分けもつかなくしてしまう。物を写生したり写真に撮ったりすることはできても、手で触れることはできない住人ばかりの世界を考えてみよう。物の形を正確に思い描けるようになるまでには、さぞかし苦労するにちがいない。それに、わずかな学者しか手にできないその知識にしても、実のところさほど興味を引くものではなかろう。"
  "source_languages":
  - "fr"
  "source_locations":

- "id": "b3c4-027"
  "source_text": "Mais ces objections théoriquement excellentes perdent pratiquement toute leur force, si l’on veut se souvenir de la puissance invincible des idées transformées en dogmes. Le dogme de la souveraineté des foules est, au point de vue philosophique, aussi peu défendable que les dogmes religieux du moyen âge, mais il en a aujourd’hui l’absolue puissance. Il est donc aussi inattaquable que le furent jadis nos idées religieuses. Supposez un libre-penseur moderne, transporté par un pouvoir magique en plein moyen âge. Croyez-vous qu’après avoir constaté la puissance souveraine des idées religieuses qui régnaient alors il eût tenté de les combattre ? Tombé dans les mains d’un juge voulant le faire brûler sous l’imputation d’avoir conclu un pacte avec le diable, ou d’avoir été au sabbat, eût-il songé à contester l’existence du diable et du sabbat ? On ne discute pas plus avec les croyances des foules qu’avec les cyclones. Le dogme du suffrage universel possède aujourd’hui le pouvoir qu’eurent jadis les dogmes chrétiens. Orateurs et écrivains en parlent avec un respect et des adulations que n’a pas connus Louis XIV. Il faut donc se conduire à son égard comme à l’égard de tous les dogmes religieux. Le temps seul agit sur eux."
  "translation_ja": "しかし、思想が教義に変わったときの抗いがたい力を思い出せば、理論のうえでいかにもっともなこれらの異議も、実際にはすべて力を失う。群衆の主権という教義は、哲学の立場からは中世の宗教の教義と同じほど弁護しにくいが、今日、それらと同じ絶対的な力を備えている。したがって、かつての宗教思想がそうであったように、攻めようがない。今日の自由思想家が魔力で中世のただなかに運ばれたと仮定しよう。その頃支配した宗教思想の絶対的な力を確かめたあとで、彼は敢えてそれと戦おうとしたと思うか。悪魔と契約した、あるいは魔宴に出たという嫌疑で火刑にしようとする裁判官の手に落ちて、悪魔や魔宴の存在を論じて否定しようと考えただろうか。暴風と議論できないのと同じく、群衆の信念と議論はできない。普通選挙の教義が今日備えているのは、かつてキリスト教の教義が持った力である。弁士も作家も、ルイ十四世さえ受けなかったほどの敬意とおもねりをもって語る。ゆえに、あらゆる宗教の教義に対するように、それにも振る舞わねばならない。それに対して何かをなしうるのは時間だけである。"

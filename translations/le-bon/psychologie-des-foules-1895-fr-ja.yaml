- "id": "b3c5-053"
  "source_text": "À côté de cette première cause d’exagération des dépenses il en est une autre, non moins impérative : l’obligation d’accorder toutes les dépenses d’intérêt purement local. Un député ne saurait s’y opposer, parce qu’elles représentent encore des exigences d’électeurs, et que chaque député ne peut obtenir ce dont il a besoin pour sa circonscription qu’à la condition de céder aux demandes analogues de ses collègues[26]."
  "translation_ja": "支出を膨らませるこの第一の原因のほかに、同じく逃れがたいもう一つの原因がある。純粋に地方だけの利益になる費用をすべて認めねばならないことである。議員はこれに反対できない。これも有権者の要求を表しているからであり、自分の選挙区に必要なものを得るには、同僚の同様な要求に譲歩するしかないからである。［26］"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b2c1-045"
  "source_text": "Comment l’instruction professionnelle peut-elle développer l’intelligence dans une mesure qui échappe tout à fait à l’instruction classique : c’est ce que M. Taine montre fort bien."
  "translation_ja": "職業教育なら、古典教育にはまったく手の届かないほど知性を伸ばせるのはどうしてか。テーヌ氏がこれをみごとに示している。"
  "source_languages":
  - "fr"

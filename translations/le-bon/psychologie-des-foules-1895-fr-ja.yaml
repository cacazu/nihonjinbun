  "translation_status": "reviewed"
- "id": "b3c3-009"
  "source_text": "Impitoyables aux crimes qui semblent pouvoir les atteindre — et qui sont précisément d’ailleurs les plus redoutables pour la société — les jurés sont au contraire très indulgents pour les crimes dits passionnels. Ils sont rarement sévères pour l’infanticide des filles-mères et moins encore pour la fille abandonnée qui vitriolise un peu son séducteur, sentant fort bien d’instinct que ces crimes-là sont peu dangereux pour la société[22], et que dans un pays où la loi ne protège pas les filles abandonnées, le crime de celle qui se venge est plus utile que nuisible, en intimidant d’avance les futurs séducteurs."
  "translation_ja": "自分たちにも降りかかりそうな犯罪に対しては、陪審員たちは容赦をしないし、それこそ社会にとってもっとも恐ろしい犯罪でもある。反対に、いわゆる激情による犯罪にはたいへん寛大である。未婚の母の子殺しに厳しいことはめったになく、捨てられた娘が自分をたぶらかした男に硫酸を浴びせたという場合には、なおさらである。こうした犯罪の社会への危険は小さいこと［22］、また捨てられた娘を法が守らない国なら、復讐した娘の犯行は将来人をたぶらかす男たちをあらかじめ怖じけづかせるので、害よりむしろ益になることを、本能的によく感じ取っているのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 458
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[463]"
  "section_id": "b3c3"
  "kind": "paragraph"

- "id": "b1c4-011"
  "source_text": "Aujourd’hui la plupart des grands conquérants d’âmes n’ont plus d’autels, mais ils ont des statues ou des images, et le culte qu’on leur rend n’est pas notablement différent de celui qu’on leur rendait jadis. On n’arrive à comprendre un peu la philosophie de l’histoire que quand on est bien pénétré de ce point fondamental de la psychologie des foules. Il faut être dieu pour elles ou ne rien être."
  "translation_ja": "今日、人々の魂を征服した大人物の大半には、もはや祭壇はない。だが像や肖像があり、捧げられる崇拝は、かつて捧げられていたものと目立っては違わない。群衆心理のこの根本のところが身にしみて初めて、歴史哲学をいくらかなりとも理解できる。群衆にとっては神であるか、それでなければ無にも等しいか、どちらかなのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 212
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[214]"
  "section_id": "b1c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c4-012"
  "source_text": "Et il ne faudrait pas croire que ce sont là des superstitions d’un autre âge que la raison a définitivement chassées. Dans sa lutte éternelle contre la raison, le sentiment n’a jamais été vaincu. Les foules ne veulent plus entendre les mots de divinité et de religion, au nom desquelles elles ont été pendant si longtemps asservies ; mais elles n’ont jamais autant possédé de fétiches que depuis cent ans, et jamais les vieilles divinités ne firent s’élever autant de statues et d’autels. Ceux qui ont étudié dans ces dernières années le mouvement populaire connu sous le nom de boulangisme ont pu voir avec quelle facilité les instincts religieux des foules sont prêts à renaître. Il n’était pas d’auberge de village, qui ne possédât l’image du héros. On lui attribuait la puissance de remédier à toutes les injustices, à tous les maux ; et des milliers d’hommes auraient donné leur vie pour lui. Quelle place n’eût-il pas pris dans l’histoire si son caractère eût été de force à soutenir tant soit peu sa légende !"
  "translation_ja": "これを、理性が決定的に追い払った、よその時代の迷信と思ってはならない。理性との果てしない争いにおいて、感情が征服されたことは一度もない。群衆は、あれほど長く自分たちを従属させてきた神だの宗教だのという言葉を、もう聞きたくはない。それでも、この百年ほど多くの崇拝の的を持ったことはなく、昔の神々でさえこれほど多くの像や祭壇を建てさせたことはなかった。近年、ブーランジスムと呼ばれる民衆運動を研究した人々は、群衆の宗教本能がいかにたやすくよみがえろうとするかを見たはずである。村の宿屋でその英雄の肖像を置かないところは一軒もなかった。あらゆる不正、あらゆる災いを取り除く力が彼にはあると信じられ、数千人が彼のためなら命を捧げたであろう。もし彼の人となりが、自らの伝説を多少なりとも支えうるほど強かったら、歴史にどれほどの地位を占めたことであろうか！"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 213

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-026"
  "source_text": "L’expérience constitue à peu près le seul procédé efficace pour établir solidement une vérité dans l’âme des foules, et détruire des illusions devenues trop dangereuses. Encore est-il nécessaire que l’expérience soit réalisée sur une très large échelle et fort souvent répétée. Les expériences faites par une génération sont généralement inutiles pour la suivante ; et c’est pourquoi les faits historiques invoqués comme éléments de démonstration ne sauraient servir. Leur seule utilité est de prouver à quel point les expériences doivent être répétées d’âge en âge pour exercer quelque influence, et réussir à ébranler seulement une erreur lorsqu’elle est solidement implantée dans l’âme des foules."
  "translation_ja": "一つの真理を群衆の魂にしっかり根づかせ、危険になりすぎた幻想を打ち壊すのに効く手立ては、ほとんど経験だけである。しかも、その経験はごく広い規模でなされ、たびたび繰り返されねばならない。一つの世代が身に受けた経験は、たいてい次の世代には役に立たない。だから論証の材料として持ち出される歴史的事実は役目を果たせない。唯一の用途は、経験がいくらかの影響を及ぼし、群衆の魂に深く根づいた誤りをただ一つ揺るがすだけでも、時代から時代へ、いかに経験が反復されねばならないかを示すことだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 296
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[303]"

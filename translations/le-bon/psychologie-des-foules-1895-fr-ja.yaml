  "translation_status": "reviewed"
- "id": "b1c1-012"
  "source_text": "Il n’est pas facile de décrire avec exactitude l’âme des foules, parce que son organisation varie non seulement suivant la race et la composition des collectivités, mais encore suivant la nature et le degré des excitants auxquels ces collectivités sont soumises. Mais la même difficulté se présente dans l’étude psychologique d’un individu quelconque. Ce n’est que dans les romans qu’on voit les individus traverser la vie avec un caractère constant. Seule l’uniformité des milieux crée l’uniformité apparente des caractères. J’ai montré ailleurs que toutes les constitutions mentales contiennent des possibilités de caractère qui peuvent se manifester dès que le milieu change brusquement. C’est ainsi que, parmi les Conventionnels les plus féroces se trouvaient d’inoffensifs bourgeois, qui, dans les circonstances ordinaires, eussent été de pacifiques notaires ou de vertueux magistrats. L’orage passé, ils reprirent leur caractère normal de bourgeois pacifiques. Napoléon trouva parmi eux ses plus dociles serviteurs."
  "translation_ja": "群衆の魂を正確に描くのは難しい。そのつくりは、集団を形づくる人種や構成要素によるばかりか、集団に加えられる刺激の性質や強さによっても変わるからだ。だが、同じ難しさは、どんな一個人の心理を調べるにもつきまとう。一生を同じ性格で通す個人に出会うのは、小説の中だけである。環境が変わらないからこそ、見かけのうえで性格も変わらないのだ。人の心のつくりには、環境が急変すればたちまち表に出てくる、さまざまな性格の可能性が含まれていることを、私は別のところで示した。たとえば国民公会のもっとも苛烈な議員たちのなかには、平素なら穏やかな公証人や品行方正な司法官になっていたであろう、人畜無害な市民もいた。嵐が過ぎ去ると、彼らは平和を好む市民のいつもの性格に戻った。ナポレオンがもっとも従順な手下を見いだしたのは、この人たちのなかからだった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 86
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[88]"

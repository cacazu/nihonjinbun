- "id": "b2c2-017"
  "source_text": "Une des fonctions les plus essentielles des hommes d’État consiste donc à baptiser de mots populaires, ou au moins neutres, les choses que les foules ne peuvent supporter avec leurs anciens noms. La puissance des mots est si grande qu’il suffit de désigner par des termes bien choisis les choses les plus odieuses pour les faire accepter des foules. Taine remarque justement que c’est en invoquant la liberté et la fraternité, mots très populaires alors, que les Jacobins ont pu « installer un despotisme digne du Dahomey, un tribunal pareil à celui de l’inquisition, des hécatombes humaines semblables à celles de l’ancien Mexique ». L’art des gouvernants, comme celui des avocats, consiste surtout à savoir manier les mots. Une des grandes difficultés de cet art est que, dans une même société, les mêmes mots ont le plus souvent des sens fort différents pour les diverses couches sociales. Elles emploient en apparence les mêmes mots ; mais elles ne parlent jamais la même langue."
  "translation_ja": "したがって政治家のもっとも本質的な役目の一つは、古い名のままでは群衆が我慢できないものを、人気のある語、少なくとも中立の語で名づけ直すことだ。言葉の力はそれほど大きく、もっとも嫌われる事柄でも、うまく選んだ語で表すだけで群衆に受け入れさせることができる。テーヌは正しくも、ジャコバン派が「ダホメーにふさわしい専制、異端審問のそれに似た法廷、古代メキシコのそれに似た大量の人身犠牲を打ち立て」えたのは、当時ことのほか歓迎された語である自由と友愛の名に訴えたからだ、と述べる。統治者の技は、弁護士のそれと同じく、何よりも言葉を操るすべを知ることにある。この技の大きな困難の一つは、同じ社会のなかで同じ語でも、異なる社会層にとって多くの場合はまるで違う意味を持つことだ。人々は表向きには同じ語を使うが、けっして同じ言語を話してはいない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

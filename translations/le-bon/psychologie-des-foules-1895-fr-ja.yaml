- "id": "b2c3-019"
  "source_text": "Le plus récent exemple de ce que peut une volonté forte et continue, nous est donné par l’homme illustre qui sépara deux mondes et réalisa la tâche inutilement tentée depuis trois mille ans par les plus grands souverains. Il échoua plus tard dans une entreprise identique ; mais la vieillesse était venue, et tout s’éteint devant elle, même la volonté."
  "translation_ja": "強く持続する意志に何ができるかのもっとも新しい例を示すのは、二つの世界を切り分け、三千年このかた大君主たちが試みては空しく終わった仕事を実現した、あの名高い人物である。後には同じような事業に失敗した。だがそのときには老いが訪れていた。老いの前ではすべてが消える。意志でさえも。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

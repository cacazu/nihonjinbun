  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-020"
  "source_text": "J’ai reproduit le passage qui précède pour les faits qu’il contient, mais non pour les explications, qu’il propose. Elles sont d’une psychologie médiocre. Une foule perdrait aussitôt son caractère de foule si elle tenait compte aux meneurs des services rendus, que ce soit à la patrie ou aux partis. La foule qui obéit au meneur subit son prestige, et n’y fait intervenir aucun sentiment d’intérêt ou de reconnaissance."
  "translation_ja": "この一節を引いたのは、そこに記された事実のためであって、そこに示された説明のためではない。心理の見方としては平凡なものだ。祖国に対してであれ党派に対してであれ、指導者の功績を考慮するなら、群衆はたちまち群衆としての性格を失うだろう。指導者に従う群衆はその威信に服しているのであって、利害の勘定も感謝の気持ちもそこには立ち入らない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 518
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[528]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-021"
  "source_text": "Aussi le meneur doué d’un prestige suffisant possède-t-il un pouvoir presque absolu. On sait l’influence immense qu’eut pendant de longues années, grâce à son prestige, un député célèbre, battu dans les dernières élections à la suite de certains événements financiers. Sur un simple signe de lui, les ministres étaient renversés. Un écrivain a marqué nettement dans les lignes suivantes la portée de son action :"
  "translation_ja": "したがって、十分な威信をもつ指導者はほとんど絶対の力を握る。ある金融上の事件のために先の選挙で落選した有名な議員が、長年その威信によって絶大な影響を振るったことはよく知られている。ただひとつ彼が合図をすれば内閣は倒れた。彼の働きがどこまで及んだか、ある筆者は次のように的確に述べた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 519
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[529]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-022"
  "source_text": "« C’est à M. X… principalement que nous devons d’avoir acheté le Tonkin trois fois plus cher qu’il n’aurait dû coûter, de n’avoir pris dans Madagascar qu’un pied incertain, de nous être laissé frustrer de tout un empire sur le bas Niger, d’avoir perdu la situation prépondérante que nous occupions en Égypte. — Les théories de M. X… nous ont coûté plus de territoires que les désastres de Napoléon Ier."
  "translation_ja": "「トンキンを本来の三倍の代価で手に入れ、マダガスカルではおぼつかない足場一つしか得られず、ニジェール川下流では一つの帝国をまるごと横取りされるに任せ、エジプトで占めていた優越した地位を失ったこと、それはひとえに、とは言わぬまでも主としてX氏のおかげである。X氏の理論のせいでわが国が失った領土は、ナポレオン一世の諸敗戦で失ったものより広い。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 520
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[530]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-023"
  "source_text": "Il ne faudrait pas trop en vouloir au meneur en question. Il nous a coûté fort cher évidemment ; mais une grande partie de son influence tenait à ce qu’il suivait l’opinion publique, qui, en matière coloniale, n’était pas du tout alors ce qu’elle est devenue aujourd’hui. Il est rare qu’un meneur précède l’opinion ; presque toujours il se borne à la suivre et à en épouser toutes les erreurs."
  "translation_ja": "しかし当の指導者をあまり責めてはならない。むろんわが国は彼のために高い代価を払った。だが彼の影響力の大半は、彼が世論についていったことに由来する。当時の植民地をめぐる世論は、今日とはまったく違っていたのである。指導者が世論に先んじることはめったにない。ほとんどいつも、その後をついていき、その誤りをことごとく自分のものにするにすぎない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 521
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[531]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-024"
  "source_text": "Les moyens de persuasion des meneurs, en dehors du prestige, sont les facteurs que nous avons déjà énumérés plusieurs fois. Pour les manier habilement, le meneur doit avoir pénétré, au moins d’une façon inconsciente, la psychologie des foules, et savoir comment leur parler. Il doit surtout connaître la fascinante influence des mots, des formules et des images. Il doit posséder une éloquence spéciale, composée : d’affirmations énergiques — dégagées de preuves — et d’images impressionnantes encadrées de raisonnements fort sommaires. C’est un genre d’éloquence qu’on rencontre dans toutes les assemblées, y compris le parlement anglais, le plus pondéré pourtant de tous."
  "translation_ja": "威信以外に指導者が用いる説得の手段は、すでに私たちが幾度も数え上げた要因である。それらを巧みに扱うには、少なくとも無意識のうちには群衆の心理の奥に通じ、どう語りかければよいかをわきまえていなければならない。何より、言葉と決まり文句と像が人を魅了する力を知らねばならない。また、力強い断言には証拠を添えず、強く印象に残る像にはごく大まかな理屈を添えるという、独特の弁舌が要る。この種の弁舌はどの議会にも見つかる。どこよりも落ち着き払っているはずのイギリス議会さえ例外ではない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 522
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[532]"
  "section_id": "b3c5"

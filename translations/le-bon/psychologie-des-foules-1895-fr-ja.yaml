  "translation_status": "reviewed"
- "id": "b1c1-030"
  "source_text": "Et c’est ainsi qu’on voit des jurys rendre des verdicts que désapprouverait chaque juré individuellement, des assemblées parlementaires adopter des lois et des mesures que réprouverait en particulier chacun des membres qui les composent. Pris séparément, les hommes de la Convention étaient des bourgeois éclairés, aux habitudes pacifiques. Réunis en foule, ils n’hésitaient pas à approuver les propositions les plus féroces, à envoyer à la guillotine les individus les plus manifestement innocents ; et, contrairement à tous leurs intérêts, à renoncer à leur inviolabilité et à se décimer eux-mêmes."
  "translation_ja": "だから陪審では、陪審員が一人ずつなら認めまいとする評決が下され、議会では、議員一人ひとりなら非とする法律や措置が採択されることになる。国民公会の議員たちも、別々に見れば、穏やかな暮らしに慣れた、ものの分かった市民だった。ところが群衆として集まると、このうえなく残酷な提案をためらわず承認し、だれの目にも明らかに無実な人々を断頭台に送った。そればかりか、自分たちの利益のいっさいに背いて、不逮捕特権を捨て、互いを死に追いやってその数を減らすことすらためらわなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 104
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[106]"
  "section_id": "b1c1"

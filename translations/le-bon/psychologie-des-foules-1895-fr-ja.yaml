  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c4-032"
  "source_text": "Et c’est ainsi qu’une fois encore nous retombons sur cette notion fondamentale de race, déjà rencontrée si souvent, et sur cette autre notion, qui découle de la première que les institutions et les gouvernements ne jouent qu’un rôle insignifiant dans la vie des peuples. Ces derniers sont surtout conduits par l’âme de leur race, c’est-à-dire par les résidus ancestraux dont cette âme est la somme. La race et l’engrenage des nécessités de chaque jour, tels sont les maîtres mystérieux qui régissent nos destinées."
  "translation_ja": "こうして私たちはまた、すでに幾度となく出会ってきた人種という根本の観念と、そこから派生する別の観念、すなわち、制度と政府が諸民族の生活で果たす役割は取るに足らないという観念に立ち戻る。民族を何よりも導くのは、自分たちの人種の魂、言い換えれば、その魂の総和をなす祖先の残したものだ。人種と、日々の必要がかみ合って動く歯車。私たちの運命をつかさどる神秘の主人はこの二つである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

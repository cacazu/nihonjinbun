- "id": "b2c1-044"
  "source_text": "On consentirait peut-être, à l’extrême rigueur, à accepter encore tous les inconvénients de notre éducation classique, alors même qu’elle ne ferait que des déclassés et des mécontents, si l’acquisition superficielle de tant de connaissances, la récitation parfaite de tant de manuels élevait le niveau de l’intelligence. Mais l’élève-t-elle réellement ? Non, hélas ! C’est le jugement, l’expérience, l’initiative, le caractère qui sont les conditions de succès dans la vie, et ce n’est pas là ce que donnent les livres. Les livres sont des dictionnaires utiles à consulter, mais dont il est parfaitement inutile d’avoir de longs fragments dans la tête."
  "translation_ja": "もしあんなに多くの知識をうわべだけでも身につけ、あんなに多くの教科書をよどみなく暗唱すれば知性の水準が上がるものなら、私たちの古典教育がたとえ社会に居場所のない人や不満な人ばかり生むにしても、ぎりぎりのところで、そのすべての不都合をなお受け入れようという気にもなるかもしれない。だがほんとうに知性は高まるのか。ああ、そうではない！　人生の成功を決めるのは判断力、経験、自発性、性格であって、そうしたものは本からは得られない。本は引くには便利な辞書だが、そこから長い一節を頭の中に収めておくのは、まったく無用である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

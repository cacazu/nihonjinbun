- "id": "b3c4-note-24"
  "section_id": "b3c4"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Les comités, quels que soient leurs noms : clubs, syndicats, etc., constituent peut-être le plus redoutable danger de la puissance des foules. Ils représentent, en effet, la forme la plus impersonnelle, et, par conséquent, la plus oppressive de la tyrannie. Les meneurs qui dirigent les comités étant censés parler et agir au nom d’une collectivité sont dégagés de toute responsabilité et peuvent tout se permettre. Le tyran le plus farouche n’eût jamais osé rêver les proscriptions ordonnées par les comités révolutionnaires. Ils avaient, dit Barras, décimé et mis en coupe réglée la Convention. Robespierre fut maître absolu tant qu’il put parler en leur nom. Le jour où l’effroyable dictateur se sépara d’eux pour des questions d’amour-propre, il fut perdu. Le règne des foules, c’est le règne des comités, c’est-à-dire des meneurs. On ne saurait rêver de despotisme plus dur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-24"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-24"
  "translation_ja": "クラブ、組合などいかなる名称であれ、委員会は、群衆の権力のうちもっとも恐るべき危険をなすかもしれない。実際、これほど人格の所在が分からず、したがって圧迫の大きい専制の形態はない。委員会を率いる指導者は、集団の名をもって語り行動するとされるので、いっさいの責任を免れ、何でもすることができる。革命諸委員会が命じた追放や排除を、どれほど獰猛な暴君でさえ夢みることをあえてしなかったろう。バラスによれば、委員会は国民公会の議員を間引き、公会を好きなように食い物にしていた。ロベスピエールは委員会の名で語れたかぎりにおいて絶対の主人だった。自尊心の問題からその恐るべき独裁者が委員会から離れたその日、彼は滅びた。群衆の支配とは委員会の支配、換言すれば指導者の支配である。これほどきびしい専制は想像しえない。"
  "translation_status": "reviewed"
- "id": "b3c4-023"
  "source_text": "Aussi n’est-il pas trop difficile d’agir sur eux, pour peu que le candidat soit acceptable et possède des ressources suffisantes. D’après les aveux des donateurs, 3 millions suffirent pour obtenir les élections multiples du général Boulanger."
  "translation_ja": "それゆえ、候補者にまずまず人が納得し、資金が十分あるなら、委員会に働きかけるのはそれほど難しくない。寄付者たちの打ち明け話によれば、ブーランジェ将軍を複数の選挙で当選させるには三百万で足りた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-028"
  "source_text": "La plus gigantesque de ces expériences fut la Révolution française. Pour découvrir qu’on ne refait pas une société de toutes pièces sur les indications de la raison pure, il a fallu massacrer plusieurs millions d’hommes et bouleverser l’Europe entière pendant vingt ans. Pour nous prouver expérimentalement que les Césars coûtent cher aux peuples qui les acclament, il a fallu deux ruineuses expériences en cinquante ans, et, malgré leur clarté, elles ne semblent pas avoir été suffisamment convaincantes. La première a coûté pourtant trois millions d’hommes et une invasion, la seconde un démembrement et la nécessité des armées permanentes. La troisième a failli être tentée il n’y a pas longtemps et le sera sûrement un jour. Pour faire admettre à tout un peuple que l’immense armée allemande n’était pas, comme on l’enseignait avant 1870, une sorte de garde nationale inoffensive[14], il a fallu l’effroyable guerre qui nous a coûté si cher. Pour reconnaître que le protectionnisme ruine les peuples qui l’acceptent, il faudra au moins vingt ans de désastreuses expériences. On pourrait multiplier indéfiniment ces exemples."
  "translation_ja": "なかでもっとも巨大な実験はフランス革命だった。純粋理性の指図に従って、社会を一から作り直すことなどできない。それを見いだすために、数百万の人を殺し、二十年間ヨーロッパ全土を騒乱に陥れることが必要だった。カエサルのたぐいを歓呼して迎える民族は、そのために高くつくことを経験のうえで私たちに証明するにも、五十年間に二度の破滅的な実験が要った。しかも、あれほど明白なのに、まだ十分には人を納得させていないらしい。第一の実験の代価は三百万の人命と一度の侵入、第二の代価は領土の分割と常備軍を持ちつづける必要だった。つい先ごろもう少しで第三の実験が試みられるところだったし、いつの日かきっと試みられるだろう。一八七〇年より前に教えられていたように、ドイツの巨大な陸軍が無害な国民衛兵のようなものではないと、国民全体に認めさせるには［14］、私たちにあれほど高くついた、あの恐ろしい戦争が必要だった。保護主義はそれを受け入れる民族を疲弊させると認めるには、少なくとも二十年の破滅的な実験が必要だろう。例なら果てしなく増やせる。"

    "anchor": "cite_note-20"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-20"
  "translation_ja": "私が言うのは、哲学から見て野蛮だということである。実際には、これらの伝説はまったく新しい文明を生み、十五世紀もの間、人間がもはや知ることのない、夢と希望の魅惑の楽園を、ちらりとのぞかせた。"
  "translation_status": "reviewed"
- "id": "b2c4-016"
  "source_text": "Dès qu’un dogme nouveau est implanté dans l’âme des foules, il devient l’inspirateur de ses institutions, de ses arts et de sa conduite. L’empire qu’il exerce alors sur les âmes est absolu. Les hommes d’action ne songent qu’à le réaliser, les législateurs ne font que l’appliquer, les philosophes, les artistes, les littérateurs ne sont préoccupés que de le traduire sous des formes diverses."
  "translation_ja": "新しい教義は群衆の魂に植えつけられるやいなや、その制度、芸術、行いに霊感を与えるものとなる。このときそれが人々の魂に及ぼす支配は絶対である。行動の人はそれを実現することしか考えず、立法者はそれを適用するだけであり、哲学者、芸術家、文学者も、それをさまざまな形に表すことだけに心を砕く。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 380
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[388]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-017"
  "source_text": "De la croyance fondamentale, des idées momentanées accessoires peuvent surgir, mais elles portent toujours l’empreinte de la croyance dont elles sont issues. La civilisation égyptienne, la civilisation européenne du moyen âge, la civilisation musulmane des Arabes dérivent d’un tout petit nombre de croyances religieuses qui ont imprimé leur marque sur les moindres éléments de ces civilisations, et permettent de les reconnaître aussitôt."
  "translation_ja": "根本的な信念から、一時的で付随的な思想が生じうる。しかしそこにはつねに、生みのもととなった信念の刻印がある。エジプト文明、ヨーロッパ中世の文明、アラブ人のイスラム文明は、ごく少数の宗教的信念から派生した。それらは文明のもっとも細かい要素にまで印を残し、そのおかげで私たちはひと目でどの文明かを見分けられる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 381
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[389]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-018"
  "source_text": "Et c’est ainsi que grâce aux croyances générales, les hommes de chaque âge sont entourés d’un réseau de traditions, d’opinions et de coutumes, au joug desquelles ils ne sauraient se soustraire et qui les rendent toujours très semblables les uns aux autres. Ce qui mène surtout les hommes, ce sont les croyances et les coutumes dérivées de ces croyances. Elles règlent les moindres actes de notre existence, et l’esprit le plus indépendant ne songe pas à s’y soustraire. Il n’y a de véritable tyrannie que celle qui s’exerce inconsciemment sur les âmes, parce que c’est la seule qui ne se puisse combattre. Tibère, Gengis-khan, Napoléon ont été des tyrans redoutables, sans doute, mais, du fond de leur tombeau, Moïse, Bouddha, Jésus, Mahomet, Luther ont exercé sur les âmes un despotisme bien autrement profond. Une conspiration peut abattre un tyran, mais que peut-elle sur une croyance bien établie ? Dans sa lutte violente contre le catholicisme, et malgré l’assentiment apparent des foules, malgré des procédés de destruction aussi impitoyables que ceux de l’Inquisition, c’est notre grande Révolution qui a été vaincue. Les seuls tyrans réels que l’humanité ait connus ont toujours été les ombres des morts ou les illusions qu’elle s’est créées."
  "translation_ja": "このように、一般的な信念のおかげで、それぞれの時代の人間には伝統、意見、習俗の網がめぐらされ、そのくびきからは逃れようもなく、それが人々をいつも互いによく似たものにする。人間を何よりも導くのは信念と、その信念から来る習俗である。それらは暮らしのごく細かい行いにまで決まりを与え、もっとも独立心に富む人もそこから逃れたいとは思わない。真の専制は、魂に対して意識されぬまま働くもののほかにはない。それにだけは抵抗できないからである。ティベリウス、チンギス・ハン、ナポレオンはたしかに恐るべき暴君だった。だがモーセ、仏陀、イエス、ムハンマド、ルターが墓の底から魂のうえに振るった専制は、はるかに深かった。陰謀で暴君を倒すことはできる。だが根を張った信念に対して何ができよう。カトリックとの激闘で、群衆がうわべは同意し、異端審問にも劣らぬほど容赦のない破壊の手段を用いてさえ、敗れたのはわが大革命の方だった。人類が知ってきた唯一の真の暴君は、いつも死者の影か、人類がみずから造り上げた幻想だったのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

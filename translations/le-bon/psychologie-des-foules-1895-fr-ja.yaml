- "id": "toc-013"
  "source_text": "CHAPITRE IV. — Formes religieuses que revêtent toutes les convictions des foules. 60"
  "translation_ja": "第四章　群衆のあらゆる確信が帯びる宗教的な形　60"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

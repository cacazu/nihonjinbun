- "id": "preface-010"
  "source_text": "Le philosophe qui étudie les phénomènes sociaux doit avoir présent à l’esprit, qu’à côté de leur valeur théorique ils ont une valeur pratique, et que, au point de vue de l’évolution des civilisations, cette dernière est la seule possédant quelque importance. Une telle constatation doit le rendre fort circonspect dans les conclusions que la logique semble d’abord lui imposer."
  "translation_ja": "社会現象を研究する哲学者は、その理論上の価値とは別に実際上の価値があり、文明の進化という観点ではいくらかなりとも意味を持つのは後者だけだと、つねに心にとめておかねばならない。このことだけでも、ひとまず論理に強いられるように思える結論を下すには、よほど慎重になるはずである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b1c2-037"
  "source_text": "Il n’est même pas besoin que les siècles aient passé sur les héros pour que leur légende soit transformée par l’imagination des foules. La transformation se fait parfois en quelques années. Nous avons vu de nos jours la légende de l’un des plus grands héros de l’histoire se modifier plusieurs fois en moins de cinquante ans. Sous les Bourbons, Napoléon devint une sorte de personnage idyllique philanthrope et libéral, ami des humbles, qui, au dire des poètes, devaient conserver son souvenir sous le chaume pendant bien longtemps. Trente ans après, le héros débonnaire était devenu un despote sanguinaire qui, après avoir usurpé le pouvoir et la liberté, fit périr trois millions d’hommes uniquement pour satisfaire son ambition. De nos jours, nous assistons à une nouvelle transformation de la légende. Quand quelques dizaines de siècles auront passé sur elle, les savants de l’avenir, en présence de ces récits contradictoires, douteront peut-être de l’existence du héros, comme ils doutent parfois de celle de Bouddha, et ne verront en lui que quelque mythe solaire ou un développement de la légende d’Hercule. Ils se consoleront aisément sans doute de cette incertitude, car, mieux initiés qu’aujourd’hui à la connaissance de la psychologie des foules, ils sauront que l’histoire ne peut guère éterniser que des mythes."
  "translation_ja": "英雄の伝説が群衆の想像力によって姿を変えるために、その上を何世紀もが通り過ぎる必要すらない。ときには数年で変わる。歴史に残る英雄のなかでも屈指の一人をめぐる伝説が、五十年に満たない間に何度も変わるのを、私たちは自分たちの時代に見た。ブルボン朝のもとでナポレオンは、一種の牧歌的な人物、博愛の心があり自由を愛する、つましい人々の友になった。詩人たちに言わせれば、貧しい人々は藁ぶき屋根の下で末長く彼の思い出を守るはずだった。三十年後には、あの慈悲深い英雄が、権力と自由を奪ったうえ、ひたすら己の野心を満たすために三百万人を死なせた血も涙もない専制君主に変わっていた。今日また私たちはその伝説の新たな変貌を見ている。何十世紀かがその上を過ぎれば、未来の学者たちは、互いに矛盾するこれらの話を前に、今ときに仏陀の実在を疑うのと同じように、英雄の実在を疑い、彼にはある種の太陽神話か、ヘラクレス伝説の発展形を見るだけになるかもしれない。おそらく、そうした不確かさに彼らはすぐに慰めを見いだすだろう。今日よりは群衆心理の知識に通じ、歴史が永遠のものとなしうるのは、まずもって神話にすぎないと知っているだろうから。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

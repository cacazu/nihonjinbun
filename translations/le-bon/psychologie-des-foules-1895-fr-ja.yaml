- "id": "b2c1-025"
  "source_text": "Mais nous n’avons à nous occuper ici que de l’influence du temps dans la genèse des opinions des foules. À ce point de vue son action est encore immense. Il tient sous sa dépendance les grandes forces, telles que la race, qui ne peuvent se former sans lui. Il fait naître, grandir, mourir toutes les croyances : c’est par lui qu’elles acquièrent leur puissance et par lui aussi qu’elles la perdent."
  "translation_ja": "だがここで取り上げるのは、群衆の意見が生まれるまでに時間が及ぼす影響に限られる。この面でもその作用はきわめて大きい。人種などの大きな力は、それなしには形成されず、時間の支配下にある。すべての信念を生まれさせ、育て、死なせるのが時間である。時間によって信念は力を獲得し、また時間によってそれを失う。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 243
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[247]"
  "section_id": "b2c1s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-026"
  "source_text": "C’est le temps surtout qui prépare les opinions et les croyances des foules, ou tout au moins le terrain sur lequel elles germeront. Et c’est pourquoi certaines idées sont réalisables à une époque et ne le sont plus à une autre. C’est le temps qui accumule cet immense détritus de croyances, de pensées, sur lequel naissent les idées d’une époque. Elles ne germent pas au hasard et à l’aventure ; les racines de chacune d’elles plongent dans un long passé. Quand elles fleurissent, le temps avait préparé leur éclosion ; et c’est toujours en arrière qu’il faut remonter pour en concevoir la genèse. Elles sont filles du passé et mères de l’avenir, esclaves du temps toujours."
  "translation_ja": "群衆の意見と信念、少なくともそれらが芽吹く土壌を準備するのは、何よりも時間である。ある時代には実現できた思想が、別の時代にはもはや実現できないのも、そのためだ。ある時代の思想がそこから生まれ出る、信念と思考のおびただしい堆積物を積み上げるのが時間である。思想の芽はでたらめに、行きあたりばったりに出るのではない。どの思想の根も、長い過去のなかに入り込んでいる。それが花開くときには、すでに時間が開花を用意してきたのであり、どのように生まれたかを知るにはいつも過去へとさかのぼらねばならない。思想は過去の娘であり未来の母であり、いつでも時間のしもべである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 244

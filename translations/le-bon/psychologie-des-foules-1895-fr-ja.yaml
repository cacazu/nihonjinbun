- "id": "b2c2-006"
  "source_text": "§ 1. — LES IMAGES, LES MOTS ET LES FORMULES"
  "translation_ja": "第一節　像、言葉、決まり文句"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 276
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[51]"
  "section_id": "b2c2s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-007"
  "source_text": "En étudiant l’imagination des foules, nous avons vu qu’elle est impressionnée surtout par des images. Ces images, on n’en dispose pas toujours, mais il est possible de les évoquer par l’emploi judicieux des mots et des formules. Maniés avec art, ils possèdent vraiment la puissance mystérieuse que leur attribuaient jadis les adeptes de la magie. Ils font naître dans l’âme des foules les plus formidables tempêtes, et savent aussi les calmer. On élèverait une pyramide beaucoup plus haute que celle du vieux Khéops avec les seuls ossements des hommes victimes de la puissance des mots et des formules."
  "translation_ja": "群衆の想像力を調べたとき、主としてそれを動かすのは像であることを見た。つねにそうした像が手もとにあるわけではない。だが言葉や決まり文句をうまく使えば、像を呼び起こすことができる。巧みに扱われるとき、これらはまさに、昔の魔術の信徒たちがそこに認めた神秘の力を備えている。群衆の魂に途方もない嵐を引き起こすし、それを静めることもできる。言葉と決まり文句の力の犠牲になった人々の骨だけでも、古のクフ王のものよりはるかに高いピラミッドを築けよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 277
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[284]"
  "section_id": "b2c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-008"
  "source_text": "La puissance des mots est liée aux images qu’ils évoquent et tout à fait indépendante de leur signification réelle. Ce sont parfois ceux dont le sens est le plus mal défini qui possèdent le plus d’action. Tels par exemple, les termes : démocratie, socialisme, égalité, liberté, etc., dont le sens est si vague que de gros volumes ne suffisent pas à le préciser. Et pourtant il est certain qu’une puissance vraiment magique s’attache leurs brèves syllabes, comme si elles contenaient la solution de tous les problèmes. Ils synthétisent les aspirations inconscientes les plus diverses et l’espoir de leur réalisation."
  "translation_ja": "言葉の力は、それが呼び起こす像に結びつき、その本来の語義からはまったく独立している。意味のいちばんはっきりしない語がいちばん効くことさえある。たとえば民主主義、社会主義、平等、自由などがそうだ。意味がじつに漠然としていて、分厚い本を何冊費やしても厳密に定めきれない。それでも、あらゆる問題の解答が含まれているかのように、そのわずかな音節にほんとうの魔力が宿るのはたしかだ。さまざまな無意識の願望と、それがかなうという希望とを、それらの語は一つに集める。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 278
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[285]"
  "section_id": "b2c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-009"
  "source_text": "La raison et les arguments ne sauraient lutter contre certains mots et certaines formules. On les prononce avec recueillement devant les foules ; et, dès qu’ils ont été prononcés, les visages deviennent respectueux et les fronts s’inclinent. Beaucoup les considèrent comme des forces de la nature, des puissances surnaturelles. Ils évoquent dans les âmes des images grandioses et vagues, mais le vague même qui les estompe augmente leur mystérieuse puissance. Ils sont les divinités redoutables cachées derrière le tabernacle et dont le dévot ne s’approche qu’en tremblant."
  "translation_ja": "ある種の言葉や決まり文句には、理性も論拠も太刀打ちできない。群衆の前で、うやうやしくそれを唱える。唱え終わるや否や、人々の顔には敬虔さが浮かび、頭が下がる。それを自然の力、超自然の威力と思う者も多い。そうした言葉は魂のうちに壮大でおぼろな像を呼び起こす。その輪郭をぼかすあいまいさ自体が、その神秘の力を強める。それは聖所の奥に隠れ、信者が震えながらでしか近づけない、畏るべき神々なのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 279
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[286]"
  "section_id": "b2c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-010"
  "source_text": "Les images évoquées par les mots étant indépendantes de leur sens, varient d’âge en âge, de peuple à peuple, sous l’identité des formules. À certains mots s’attachent transitoirement certaines images : le mot n’est que le bouton d’appel qui les fait apparaître."
  "translation_ja": "語が呼び起こす像はその語義とは独立しているので、同じ決まり文句のもとでも、時代ごと、民族ごとに変わる。ある言葉にある像が一時のあいだ結びつく。言葉はいわば、押すとその像が現れる呼び鈴のボタンにすぎない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 280
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[287]"
  "section_id": "b2c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-011"
  "source_text": "Tous les mots et toutes les formules ne possèdent pas la puissance d’évoquer des images ; et il en est qui, après en avoir évoqué, s’usent et ne réveillent plus rien dans l’esprit. Ils deviennent alors de vains sons, dont l’utilité principale est de dispenser celui qui les emploie de l’obligation de penser. Avec un petit stock de formules et de lieux communs appris dans la jeunesse, nous possédons tout ce qu’il faut pour traverser la vie sans la fatigante nécessité d’avoir à réfléchir sur quoi que ce soit."
  "translation_ja": "すべての言葉や決まり文句に、像を呼び起こす力があるわけではない。かつては像を呼び起こしながら、すり減って、もう心に何も目覚めさせなくなるものもある。そうなれば虚ろな音にすぎず、その主な効用は、それを使う人がものを考えずに済むことだ。若いころに覚えた決まり文句とありきたりな言い回しのささやかな蓄えがあれば、私たちは何かについてわざわざ考えるという骨折りなしに、一生を通してゆくのに必要なものをすべて持っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 281
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[288]"
  "section_id": "b2c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-012"
  "source_text": "Si l’on considère une langue déterminée, on voit que les mots dont elle se compose changent assez lentement dans le cours des âges ; mais ce qui change sans cesse, ce sont les images qu’ils évoquent ou le sens qu’on y attache ; et c’est pourquoi je suis arrivé, dans un autre ouvrage, à cette conclusion que la traduction complète d’une langue, surtout quand il s’agit de peuples morts, est chose totalement impossible. Que faisons-nous, en réalité, quand nous substituons un terme français à un terme latin, grec ou sanscrit, ou même quand nous cherchons à comprendre un livre écrit dans notre propre langue il y a deux ou trois siècles ? Nous substituons simplement les images et les idées que la vie moderne a mises dans notre intelligence, aux notions et aux images absolument différentes que la vie ancienne avait fait naître dans l’âme de races soumises à des conditions d’existence sans analogie avec les nôtres. Quand les hommes de la Révolution croyaient copier les Grecs et les Romains, que faisaient-ils, sinon donner à des mots anciens un sens que ceux-ci n’eurent jamais. Quelle ressemblance pouvait-il exister entre les institutions des Grecs et celles que désignent de nos jours les mots correspondants ? Qu’était alors une république, sinon une institution essentiellement aristocratique formée d’une réunion de petits despotes dominant une foule d’esclaves maintenus dans la plus absolue sujétion. Ces aristocraties communales, basées sur l’esclavage, n’auraient pu exister un instant sans lui."
  "translation_ja": "ある一つの言語を見ると、それをなす単語は時代の流れのなかで比較的ゆっくりと変わる。だがそれが呼び起こす像や、人が与える意味は絶えず変化する。そのため私は別の著作で、言語を完全に翻訳するのは、とくにすでに滅んだ民族が相手である場合には、まったく不可能なことだという結論に達した。ラテン語、ギリシア語、サンスクリット語の単語をフランス語の単語に置き換えるとき、あるいはわずか二、三世紀前に自分の国の言葉で書かれた本を理解しようとするときでさえ、実のところ私たちは何をしているのか。昔の暮らしが、私たちとは似ても似つかぬ条件の下に置かれた人種の魂に生じさせた、まるで異なる観念や像の代わりに、近代生活が私たちの知性に刻んだ像と考えを差し入れているだけである。革命の人々がギリシア人やローマ人に倣っていると思っていたとき、古い言葉に、それらがかつて持ったことのない意味を与えたのではなくて、何をしていたのか。ギリシア人の制度と、今日それに対応する語が表す制度との間に、どんな似たところがありえよう。当時の共和政とは、多数の奴隷をまったくの服従状態に置いて支配する小さな専制者たちが集まって作る、本質的に貴族的な制度にほかならなかった。都市ごとのこうした貴族政は、奴隷制の上に立ち、それなしには一瞬たりとも存在できなかっただろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

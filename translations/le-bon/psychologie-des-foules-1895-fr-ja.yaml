- "id": "b2c1-036"
  "source_text": "Au premier rang de ces idées dominantes d’une époque, dont nous avons marqué ailleurs le petit nombre et la force, bien qu’elles soient parfois des illusions pures, se trouve aujourd’hui celle-ci : que l’instruction est capable de changer considérablement les hommes, et a pour résultat certain de les améliorer, et même de les rendre égaux. Par le fait seul de la répétition, cette assertion a fini par devenir un des dogmes les plus inébranlables de la démocratie. Il serait aussi difficile d’y toucher maintenant qu’il l’eût été jadis de toucher à ceux de l’Église."
  "translation_ja": "一つの時代を支配する思想は数少ないが強い、ときにまったくの幻想であってもそうだと別のところで述べた。そうした思想のうち、今日第一に位置するのはこれである。知識を授けることは人間を大きく変えることができ、その確かな結果は人々をよりよくするばかりか、平等にすることでさえある、というものだ。繰り返される、それだけのことで、この断言はついに民主主義のもっとも揺るぎない教義の一つになった。今これに手を触れることは、昔、教会の教義に手を触れるのに劣らず困難だろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

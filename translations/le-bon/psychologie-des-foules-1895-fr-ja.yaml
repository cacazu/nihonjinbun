    "description_ja": "Wikisource電子翻刻。原刊紙面に照らして訂正：印面で抹消されているneを採らない。貴族名鑑の書名の誤字を訂正。"
- "id": "b2c3-043"
  "source_text": "Le prestige dont je viens de parler est celui qu’exercent les personnes ; on peut placer à côté le prestige qu’exercent les opinions, les œuvres littéraires ou artistiques, etc. Ce n’est le plus souvent que de la répétition accumulée. L’histoire, l’histoire littéraire et artistique surtout, n’étant que la répétition des mêmes jugements que personne n’essaie de contrôler, chacun finit par répéter ce qu’il a appris à l’école, et il y a des noms et des choses auxquels nul n’oserait toucher. Pour un lecteur moderne, l’œuvre d’Homère dégage un incontestable et immense ennui ; mais qui oserait le dire ? Le Parthénon, dans son état actuel, est une misérable ruine absolument dépourvue d’intérêt ; mais il possède un tel prestige qu’on ne le voit plus tel qu’il est, mais bien avec tout son cortège de souvenirs historiques. Le propre du prestige est d’empêcher de voir les choses telles qu’elles sont et de paralyser tous nos jugements. Les foules toujours, les individus le plus souvent, ont besoin, sur tous les sujets, d’opinions toutes faites. Le succès de ces opinions est indépendant de la part de vérité ou d’erreur qu’elles contiennent ; il dépend uniquement de leur prestige."
  "translation_ja": "いま述べた威信は人間の振るうものだが、その隣には、意見や文学や芸術の作品などが振るう威信を置ける。多くの場合、これは反復の積み重ねにほかならない。歴史、とくに文学史と芸術史は、だれも確かめようとしない同じ判断の反復にすぎず、みなついには学校で習ったことを繰り返すようになる。そのため、だれもあえて手を触れようとしない名や物がある。今日の読者にとってホメロスの作品が紛れもなくひどく退屈であっても、だれがあえて口にできよう。今の姿のパルテノン神殿は、まるで興味のない惨めな廃墟にすぎない。だがひじょうな威信があるので、あるがままの形でなく、あまたの歴史の記憶を従えた姿でしか見られない。物事をありのままに見るのを妨げ、私たちのあらゆる判断を麻痺させるのが、威信に特有の働きである。群衆はつねに、個人もたいていは、どんな主題についてでも出来合いの意見を必要とする。そうした意見が成功するかどうかは、どれほど真理を含むか、どれほど誤りを含むかとは無関係で、ひとえにその威信にかかっている。"

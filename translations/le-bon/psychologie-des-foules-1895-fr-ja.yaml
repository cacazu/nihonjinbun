- "id": "b2c3-029"
  "source_text": "La contagion n’exige pas la présence simultanée d’individus sur un seul point ; elle peut se faire à distance sous l’influence de certains événements qui orientent tous les esprits dans le même sens et leur donnent les caractères spéciaux aux foules, surtout quand les esprits sont préparés par les facteurs lointains que j’ai étudiés plus haut. C’est ainsi par exemple que l’explosion révolutionnaire de 1848, partie de Paris, s’étendit brusquement à une grande partie de l’Europe et ébranla plusieurs monarchies."
  "translation_ja": "伝染には、複数の個人が同時に同じ場所にいる必要はない。すべての人の心を同じ方向に向け、群衆に特有の性質を与える出来事の影響のもとでは、離れていても伝染は生じうる。ことに、先に調べた遠因によって人心が準備されている場合にそうだ。たとえば一八四八年にパリに起きた革命の爆発が、たちまちヨーロッパの大部分に広がり、いくつもの王政を揺さぶったのがそれである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

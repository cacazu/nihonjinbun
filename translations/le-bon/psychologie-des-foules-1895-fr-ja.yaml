- "id": "b1c2-030"
  "source_text": "Dans les cas semblables, le point de départ de la suggestion est toujours l’illusion produite chez un individu par des réminiscences plus ou moins vagues, puis la contagion par voie d’affirmation de cette illusion primitive. Si le premier observateur est très impressionnable, il suffira souvent que le cadavre qu’il croit reconnaître présente — en dehors de toute ressemblance réelle — quelque particularité, une cicatrice ou un détail de toilette, qui puisse évoquer l’idée d’une autre personne. L’idée évoquée peut alors devenir le noyau d’une sorte de cristallisation qui envahit le champ de l’entendement et paralyse toute faculté critique. Ce que l’observateur voit alors, ce n’est plus l’objet lui-même, mais l’image évoquée dans son esprit. Ainsi s’expliquent les reconnaissances erronées de cadavres d’enfants par leur propre mère, tel que le cas suivant, déjà ancien, mais qui a été rappelé récemment par les journaux, et où l’on voit se manifester précisément les deux ordres de suggestion dont je viens d’indiquer le mécanisme."
  "translation_ja": "この種の場合、暗示の出発点になるのはいつも、一人の人のなかに、多かれ少なかれあいまいな記憶をもとに生じた錯覚である。その最初の錯覚を言い切ることで、それが次に人々に伝染する。最初に見た人がきわめて感化されやすければ、見知った相手だと思った遺体に、実際の顔かたちは少しも似ていなくとも、何か一つ、傷痕とか身につけたものの細部とか、別人を思わせる特徴がありさえすれば足りる場合が多い。呼び起こされた考えは一種の結晶の核となり、理解の働く領域をいっぱいに満たし、あらゆる批判力を麻痺させてしまう。その人が見るのは、もはや対象そのものではなく、心に喚起された像である。実の母親が子どもの遺体の身元を取り違えてしまうのは、そう考えれば説明がつく。すでに古いが、最近また新聞に取り上げられた次の例では、いま仕組みを説明した二つの段階の暗示が、まさにそのとおりに現れている。"

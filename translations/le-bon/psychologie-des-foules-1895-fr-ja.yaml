- "id": "intro-025"
  "source_text": "À n’envisager que son côté pratique, l’étude de la psychologie des foules méritait donc d’être tentée. N’eût-elle qu’un intérêt de curiosité pure, elle le mériterait encore. Il est aussi intéressant de déchiffrer les mobiles des actions des hommes que de déchiffrer un minéral ou une plante."
  "translation_ja": "だから群衆心理の研究は、実用の面だけから考えても、試みるに値した。純粋な好奇心を満たす以外になんの役にも立たなかったとしても、やはりその値打ちはあったろう。人を行動に向かわせる動機を読み解くのは、鉱物や植物の謎を読み解くのに劣らず面白い。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 71
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[72]"

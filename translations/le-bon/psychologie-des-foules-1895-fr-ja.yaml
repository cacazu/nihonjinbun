- "id": "b1c1-016"
  "source_text": "Contrairement à une opinion qu’on s’étonne de trouver sous la plume d’un philosophe aussi pénétrant qu’Herbert Spencer, dans l’agrégat qui constitue une foule, il n’y a nullement somme et moyenne des éléments, il y a combinaison et création de nouveaux caractères, de même qu’en chimie certains éléments mis en présence, les bases et les acides par exemple, se combinent pour former un corps nouveau possédant des propriétés tout à fait différentes de celle des corps ayant servi à le constituer."
  "translation_ja": "ハーバート・スペンサーほど洞察に富む哲学者の筆になるとは驚くような、ある見方がある。だがそれに反して、群衆をなす集合体に生じるのは、構成要素の和でも平均でも断じてない。結合があり、新たな性質の創造がある。化学でいえば、塩基と酸のように、いくつかの物質を出会わせると、互いに結合して、もとの物質とはまるで性質の異なる新しい物体ができるのと同じである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 90

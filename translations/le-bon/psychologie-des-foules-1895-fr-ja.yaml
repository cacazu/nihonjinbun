- "id": "b2c2-018"
  "source_text": "Dans les exemples qui précèdent nous avons fait surtout intervenir le temps comme principal facteur du changement de sens des mots. Mais si nous faisions intervenir aussi la race, nous verrions alors qu’à une même époque, chez des peuples également civilisés mais de races diverses, les mêmes mots correspondent fort souvent à des idées extrêmement dissemblables. Il est impossible de comprendre ces différences sans de nombreux voyages, et c’est pourquoi je ne saurais insister sur elles. Je me bornerai à faire remarquer que ce sont précisément les mots les plus employés par les foules qui d’un peuple à l’autre possèdent les sens les plus différents. Tels sont par exemple les mots de démocratie et de socialisme, d’un usage si fréquent aujourd’hui."
  "translation_ja": "ここまでの例で、語義の変化をもたらす主要な要因として主に持ち出したのは時間だった。だが人種も考慮に入れれば、同時代にあって、同程度に文明化していても人種を異にする諸民族では、同じ語がひどく異なる観念に対応することがしばしばあると分かるだろう。そうした違いを理解するには多くの旅が必要で、だからここでそれを詳しく説くわけにはいかない。群衆にもっともよく使われる語こそが、ある民族から別の民族へ移るともっとも違った意味を持つことだけを指摘しよう。今日これほど多用される「民主主義」や「社会主義」といった語がその例である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

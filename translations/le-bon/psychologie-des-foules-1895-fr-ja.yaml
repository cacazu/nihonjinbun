- "id": "b2c1-041"
  "source_text": "L’État qui fabrique à coups de manuels tous ces diplômés, ne peut en utiliser qu’un petit nombre et laisse forcément sans emploi les autres. Il lui faut donc se résigner à nourrir les premiers et à avoir pour ennemis les seconds. Du haut en bas de la pyramide sociale, du simple commis au professeur et au préfet, la masse immense des diplômés assiège aujourd’hui les carrières. Alors qu’un négociant ne peut que très difficilement trouver un agent pour aller le représenter dans les colonies, c’est par des milliers de candidats que les plus modestes places officielles sont sollicitées. Le département de la Seine compte à lui seul 20.000 instituteurs et institutrices sans emploi, et qui, méprisant les champs et l’atelier, s’adressent à l’État pour vivre. Le nombre des élus étant restreint, celui des mécontents est forcément immense. Ces derniers sont prêts pour toutes les révolutions, quels qu’en soient les chefs et quelque but qu’elles poursuivent. L’acquisition de connaissances dont on ne peut trouver l’emploi est un moyen sûr de faire de l’homme un révolté[10]."
  "translation_ja": "教科書を使ってこれほど多くの学位取得者を作り出す国家は、そのうちごくわずかしか使えず、ほかの者を職のないままにしておくしかない。したがって、一方は養い、他方は敵に回すことを甘受せねばならない。社会のピラミッドの上から下まで、平の書記から教授や県知事に至るまで、今日、職を求める膨大な有資格者の群れが殺到している。商人が植民地に自分の代理として出向く人を探そうとしても難渋するのに、ごくささやかな公職にも何千という候補者が願い出る。セーヌ県だけで職のない男女の初等教員が二万人おり、畑と仕事場をさげすみ、暮らしを立てるため国を頼る。選ばれる数が限られるので、不満を抱える数は途方もなく多くならざるをえない。こうした人々は、指導者がだれだろうと、目的が何であろうと、どんな革命にも応じる用意がある。使い道の見つからない知識を身につけると、人は確実に反逆者になる［10］。"

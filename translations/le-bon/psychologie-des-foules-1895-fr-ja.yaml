- "id": "b1c2-007"
  "source_text": "§ 1. — IMPULSIVITÉ, MOBILITÉ ET IRRITABILITÉ DES FOULES"
  "translation_ja": "第一節　群衆の衝動性、移り気、怒りやすさ"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 113
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[29]"
  "section_id": "b1c2s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-008"
  "source_text": "La foule, avons-nous dit en étudiant ses caractères fondamentaux, est conduite presque exclusivement par l’inconscient. Ses actes sont beaucoup plus sous l’influence de la moelle épinière que sous celle du cerveau. Elle se rapproche en cela des êtres tout à fait primitifs. Les actes exécutés peuvent être parfaits quant à leur exécution, mais, le cerveau ne les dirigeant pas, l’individu agit suivant les hasards des excitations. Une foule est le jouet de toutes les excitations extérieures et en reflète les incessantes variations. Elle est donc esclave des impulsions qu’elle reçoit. L’individu isolé peut être soumis aux mêmes excitants que l’homme en foule ; mais comme son cerveau lui montre les inconvénients d’y céder, il n’y cède pas. C’est ce qu’on peut physiologiquement exprimer en disant que l’individu isolé possède l’aptitude à dominer ses réflexes, alors que la foule ne la possède pas."
  "translation_ja": "根本の性質を調べたときに述べたように、群衆を導くのはほとんどもっぱら無意識である。群衆の行いを左右するのは、大脳よりもはるかに脊髄の働きだ。この点で群衆は、ごく原始的な存在に近い。動作そのものの出来は申し分ないこともある。だが脳が指揮していないので、個人は行き当たりばったりに加わる刺激に応じて動く。群衆は外からのどんな刺激にも翻弄され、そのめまぐるしい移り変わりを映す。したがって、受けた衝動の奴隷である。一人でいる人間も群衆のなかの人間と同じ刺激にさらされうる。けれども、一人なら、それに屈するとどんな不都合があるかを脳が示してくれるので、屈しない。これを生理学の言葉で表せば、単独の個人には反射を抑える能力があるが、群衆にはない、ということになる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 114
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[116]"
  "section_id": "b1c2s1"

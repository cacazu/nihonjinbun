- "id": "b1c3-003"
  "source_text": "§ 1. Les idées des foules. — Les idées fondamentales et les idées accessoires. — Comment peuvent subsister simultanément des idées contradictoires. — Transformations que doivent subir les idées supérieures pour être accessibles aux foules. — Le rôle social des idées est indépendant de la part de vérité qu’elles peuvent contenir. — § 2. Les raisonnements des foules. — Les foules ne sont pas influençables par des raisonnements. — Les raisonnements des foules sont toujours d’ordre très inférieur. — Les idées qu’elles associent n’ont que des apparences d’analogie ou de succession. — § 3. L’imagination des foules. — Puissance de l’imagination des foules. — Elles pensent par images, et ces images se succèdent sans aucun lien. — Les foules sont frappées surtout par le côté merveilleux des choses. — Le merveilleux et le légendaire sont les vrais supports des civilisations. — L’imagination populaire a toujours été la base de la puissance des hommes d’État. — Comment se présentent les faits capables de frapper l’imagination des foules."
  "translation_ja": "一　群衆の思想。根本の思想と付随的な思想。矛盾する思想が同時に存続できるのはなぜか。高度な思想が群衆の手に届くには、どんな変容を経なければならないか。思想の社会的役割は、その中に含まれる真理の分量とは無関係である。二　群衆の推論。群衆に推論によって働きかけることはできない。群衆の推論はつねにきわめて低い水準にある。そこに結び合わされる観念は、似ている、あるいは続いて起きているように見えるだけである。三　群衆の想像力。群衆の想像力の強さ。群衆は像によって考え、その像は何のつながりもなく次々に現れる。群衆がとりわけ心を打たれるのは物事の驚異に満ちた一面である。文明の真の支えは驚異と伝説である。民衆の想像力はつねに政治家の権力の土台であった。群衆の想像力を打つ事実はどんな姿で現れるのか。"
  "source_languages":

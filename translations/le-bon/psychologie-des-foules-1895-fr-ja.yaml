- "id": "b1c2-020"
  "source_text": "Les déformations qu’une foule fait subir à un événement quelconque dont elle est témoin devraient, semble-t-il, être innombrables et de sens divers, puisque les individus qui la composent sont de tempéraments fort différents. Mais il n’en est rien. Par suite de la contagion, les déformations sont de même nature et de même sens pour tous les individus. La première déformation perçue par un des individus de la collectivité est le noyau de la suggestion contagieuse. Avant d’apparaître sur les murs de Jérusalem à tous les croisés, saint Georges ne fut certainement aperçu que par un des assistants. Par voie de suggestion et de contagion le miracle signalé par un seul fut immédiatement accepté par tous."
  "translation_ja": "群衆をなす個々人の気質は実にさまざまだから、目撃した出来事を群衆がゆがめる仕方も、数かぎりなく、方向もまちまちになりそうなものだ。が、そうではない。伝染の結果、ゆがみの性質も方向も、すべての個人にとって同じになる。集団の一人が最初に見たゆがんだ像が、伝染する暗示の核をなす。エルサレムの城壁に聖ゲオルギウスが十字軍の全員の前に現れる前に、初めに聖人を目にしたのは、たしかに居合わせた者のうちたった一人だったはずだ。その一人が告げた奇跡が、暗示と伝染によって、ただちに全員に受け入れられたのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 126

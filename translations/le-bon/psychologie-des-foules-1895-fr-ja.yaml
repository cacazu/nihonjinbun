- "id": "toc-007"
  "source_text": "CHAPITRE PREMIER. — Caractéristiques générales des foules – Loi psychologique de leur unité mentale. 11"
  "translation_ja": "第一章　群衆の一般的特徴　その精神的統一の心理法則　11"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 578
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[590]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-008"
  "source_text": "Ce qui constitue une foule au point de vue psychologique. — Une agglomération nombreuse d’individus ne suffit pas à former une foule. — Caractères spéciaux des foules psychologiques. — Orientation fixe des idées et sentiments chez les individus qui les composent et évanouissement de leur personnalité. — La foule est toujours dominée par l’inconscient. — Disparition de la vie cérébrale et prédominance de la vie médullaire. — Abaissement de l’intelligence et transformation complète des sentiments. — Les sentiments transformés peuvent être meilleurs ou pires que ceux des individus dont la foule est composée. — La foule est aussi aisément héroïque que criminelle."
  "translation_ja": "心理学から見て、何が群衆を群衆にするのか。多くの個人が寄り集まるだけでは、群衆をつくるに足りない。心理的群衆に特有の性質。群衆を構成する個々人の思想と感情が一定の方向を向き、その人格が消えてゆくこと。群衆をつねに支配する無意識。大脳の働きが消え、脊髄の働きがまさること。知性の低下と感情の全面的な変容。変容した感情は、群衆を構成する個々人の感情よりよいことも悪いこともある。群衆が英雄的になるのは、犯罪に走るのと同じほどたやすい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 579
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[120]"

- "id": "b1c3-014"
  "source_text": "Alors même que l’idée a subi les transformations qui la rendent accessible aux foules, elle n’agit que lorsque, par des procédés divers qui seront étudiés ailleurs, elle a pénétré dans l’inconscient et est devenue un sentiment, ce qui est toujours fort long."
  "translation_ja": "群衆の手に届くための変容をすでに経た思想であっても、すぐに作用するのではない。別のところで調べるさまざまな過程を通って無意識のうちに入り込み、一つの感情になったとき、はじめて作用する。それにはいつもずいぶん時間がかかる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 183
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[183]"

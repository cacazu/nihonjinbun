- "id": "b1c2-027"
  "source_text": "Dans cet exemple on voit se dérouler bien clairement le mécanisme de l’hallucination collective tel que nous l’avons expliqué. D’un côté, une foule en état d’attention expectante ; de l’autre, une suggestion faite par la vigie signalant un bâtiment désemparé en mer, suggestion qui, par voie de contagion, fut acceptée par tous les assistants, officiers ou matelots."
  "translation_ja": "この例には、私たちが説明した集団幻覚の仕組みが、順を追って実にはっきり見える。一方には何かを待ち受けるように注意を向けた群衆がいた。他方には、海上に難破船が見えると告げた見張りが与えた暗示があった。その暗示は伝染によって、士官といわず水兵といわず、その場の全員に受け入れられたのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

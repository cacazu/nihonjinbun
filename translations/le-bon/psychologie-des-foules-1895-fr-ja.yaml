- "id": "b1c2-004"
  "source_text": "Après avoir indiqué d’une façon très générale les principaux caractères des foules, il nous reste à pénétrer dans le détail de ces caractères."
  "translation_ja": "群衆の主な性質をごく大づかみに挙げたので、今度はその一つひとつに立ち入ってみよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

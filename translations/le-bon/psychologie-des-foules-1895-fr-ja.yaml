- "id": "b3c3-016"
  "source_text": "Plusieurs écrivains, et parmi eux de très distingués, ont fortement combattu dans ces derniers temps l’institution du jury, seule protection que nous ayons pourtant contre les erreurs vraiment bien fréquentes d’une caste sans contrôle[23]. Les uns voudraient un jury recruté seulement parmi les classes éclairées ; mais nous avons déjà prouvé que, même dans ce cas, les décisions seront identiques à celles qui sont maintenant rendues. D’autres, se basant sur les erreurs commises par les jurés, voudraient supprimer ces derniers et les remplacer par des juges. Mais comment peuvent-ils oublier que ces erreurs tant reprochées au jury, ce sont toujours des juges qui les ont d’abord commises, puisque, quand l’accusé arrive devant le jury, il a été considéré comme coupable par plusieurs magistrats : le juge d’instruction, le procureur de la République et la chambre des mises en accusation. Et ne voit-on pas alors que, si l’accusé était définitivement jugé par des magistrats au lieu de l’être par des jurés, il perdrait sa seule chance d’être reconnu innocent. Les erreurs des jurés ont toujours été d’abord des erreurs de magistrats. C’est donc uniquement à ces derniers qu’il faut s’en prendre quand on voit des erreurs judiciaires particulièrement monstrueuses, comme la condamnation de ce docteur L… qui, poursuivi par un juge d’instruction véritablement par trop borné, sur la dénonciation d’une fille demi-idiote qui accusait ce médecin de l’avoir fait avorter pour 30 francs, aurait été envoyé au bagne sans l’explosion d’indignation publique qui le fit gracier immédiatement par le chef de l’État. L’honorabilité du condamné proclamée par tous ses concitoyens rendait évidente la grossièreté de l’erreur. Les magistrats la reconnaissaient eux-mêmes ; et cependant, par esprit de caste, ils firent tout ce qu’ils purent pour empêcher la grâce d’être signée. Dans toutes les affaires analogues, entourées de détails techniques où il ne peut rien comprendre, le jury écoute naturellement le ministère public, se disant qu’après tout l’affaire a été instruite par des magistrats rompus à toutes les subtilités. Quels sont alors les auteurs véritables de l’erreur : les jurés ou les magistrats ? Gardons précieusement le jury. Il constitue peut-être la seule catégorie de foule qu’aucune individualité ne saurait remplacer. Lui seul peut tempérer les duretés de la loi qui, égale pour tous, doit être aveugle en principe, et ne pas connaître les cas particuliers. Inaccessible à la pitié, et ne connaissant que le texte de la loi, le juge, avec sa dureté professionnelle, frapperait de la même peine le cambrioleur assassin et la fille pauvre que l’abandon de son séducteur et la misère ont conduite à l’infanticide ; alors que le jury sent très bien d’instinct que la fille séduite est beaucoup moins coupable que le séducteur, qui, lui, cependant, échappe à la loi et qu’elle mérite toute son indulgence."
  "translation_ja": "ごく最近、著述家たちの何人か、それも非常にすぐれた人々を含む何人かが、陪審制度を激しく攻撃した。しかし、なんの監督も受けない身分集団がほんとうにしばしば犯す誤りから、私たちを守ってくれる唯一のものが、この制度なのである［23］。教育を受けた階級だけから陪審員を選べばよいという人がいる。だがその場合でも判断は現行のものと変わらないことは、すでに証明した。別の人々は、陪審員の犯す過誤を根拠にこれを廃して、裁判官に代えたいと望む。けれども、陪審に対してこれほど非難される誤りを、そもそも先に犯したのはいつだって司法官たちだったことを、どうして忘れられるのか。被告人が陪審の前に出るときには、予審判事、共和国検事、起訴部などの複数の司法官が、すでにその人を有罪とみなしているではないか。そうだとすれば、被告人が陪審でなく司法官たちに最終的に裁かれたなら、無罪を認めてもらえる唯一の機会を失うことが分からないだろうか。陪審員の誤りは、つねにまず司法官の誤りだったのだ。だからとりわけ途方もない誤判を目にしたら、責めるべきは後者のみである。たとえば医師Ｌ……氏に対する有罪判決がある。幾分知的な遅れのある娘が、三十フランを受け取って自分を堕胎させたとこの医師を告発し、あまりにも視野の狭い予審判事がこれを追及した。世間の怒りが爆発し、国家元首がただちに恩赦を与えることがなければ、医師は徒刑場に送られただろう。市民がこぞって受刑者の名誉ある人柄を認めていたことから、誤りの甚だしさは明瞭だった。司法官自身もそれを認めていた。それでも身内をかばう意識から、恩赦に署名されるのをあらゆる手を尽くして妨げた。同じような事件で、理解の及ばぬ専門的な細部に取り巻かれると、陪審は自然と検察官の意見に従う。なにしろその件は、あらゆる微妙な点を心得た司法官が調べたのだ、と考えるからだ。それなら過誤の真の当事者はだれか。陪審員か司法官か。陪審は大切に守ろう。それは何人たりとも個人では代わりになれない、おそらく唯一の種類の群衆である。すべての人に平等で、したがって原理的には目をつぶり個別の事情を顧みることのできない法の過酷さを、陪審だけが和らげうる。憐れみの入る余地がなく、法の条文しか知らない裁判官は、職業上の冷厳さによって、住居に押し入り殺人まで犯した賊と、誘惑した男に捨てられ、貧困のため子殺しに追い込まれた貧しい娘とに、同じ刑を科すであろう。これに対して陪審は、その娘の罪が、法の網を逃れている誘惑者よりはるかに軽く、ありったけの寛大さに値することを、本能的にじつによく感じている。"

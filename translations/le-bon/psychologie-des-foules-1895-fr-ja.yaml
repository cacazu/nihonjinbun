  "translation_status": "reviewed"
- "id": "b2c4-036"
  "source_text": "Cette absence totale de direction de l’opinion, et en même temps la dissolution des croyances générales, ont eu pour résultat final un émiettement complet de toutes les convictions, et l’indifférence croissante des foules pour ce qui ne touche pas nettement leurs intérêts immédiats. Les questions de doctrines, telles que le socialisme, ne recrutent de défenseurs réellement convaincus que dans les couches tout à fait illettrées : ouvriers des mines et des usines, par exemple. Le petit bourgeois, l’ouvrier ayant quelque teinte d’instruction sont devenus d’un scepticisme ou tout au moins d’une mobilité complète."
  "translation_ja": "世論の導き手がまったくいなくなり、それとともに一般的な信念が溶けた最終の結果は、あらゆる確信が細かく砕け、目先の利益に明確に触れない事柄に群衆がますます無関心になることだった。社会主義のような教説上の問題が、真に確信を抱いた擁護者を得るのは、文字の読み書きがまったくできない層、たとえば鉱山や工場の労働者などからに限られる。小市民や、多少なりと教育を受けた労働者は、完全に懐疑的か、少なくとも完全に移ろいやすくなった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

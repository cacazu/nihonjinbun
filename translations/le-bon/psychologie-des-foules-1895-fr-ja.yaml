  "translation_status": "reviewed"
- "id": "b1c2-062"
  "source_text": "Cette moralisation de l’individu par la foule n’est certes pas une règle constante, mais c’est une règle qui s’observe fréquemment. Elle s’observe même dans des circonstances beaucoup moins graves que celles que je viens de citer. J’ai déjà dit qu’au théâtre la foule veut chez le héros de la pièce des vertus exagérées, et il est d’une observation banale qu’une assistance, même composée d’éléments inférieurs, se montre généralement très prude. Le viveur professionnel, le souteneur, le voyou gouailleur murmurent souvent devant une scène un peu risquée ou un propos léger, fort anodins pourtant auprès de leurs conversations habituelles."
  "translation_ja": "群衆が個人を道徳的にするのは、むろんいつでも成り立つ規則ではない。だがしばしば認められる規則ではある。いま挙げた例ほど重大でない場面にさえ認められる。すでに述べたように、群衆は舞台の主人公に誇張された美徳を求めるし、客席は、いかに品位を欠く者から成っていても、概しておそろしくお行儀がよいのはだれでも知っている。遊びを商売のようにしている男も、女に稼がせるひもも、ひやかし屋のごろつきも、少しきわどい場面や浮わついた一言に、しばしば不満の声をもらす。いつもの自分たちの会話に比べれば、まるで何でもないものなのに。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 168
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[169]"
  "section_id": "b1c2s5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-063"
  "source_text": "Donc, si les foules se livrent souvent à de bas instincts, elles donnent aussi parfois l’exemple d’actes de moralité élevés. Si le désintéressement, la résignation, le dévouement absolu à un idéal chimérique ou réel sont des vertus morales, on peut dire que les foules possèdent souvent ces vertus-là à un degré que les plus sages des philosophes ont rarement atteint. Elles les pratiquent sans doute avec inconscience, mais qu’importe. Ne nous plaignons pas trop que les foules soient guidées surtout par l’inconscient, et ne raisonnent guère. Si elles avaient raisonné quelquefois et consulté leurs intérêts immédiats, aucune civilisation ne se fût développée peut-être à la surface de notre planète, et l’humanité n’aurait pas eu d’histoire."
  "translation_ja": "したがって、群衆はしばしば低い本能のなすがままになる一方で、ときには道徳的に気高い行いの手本も示す。無私、甘んじて耐えること、架空であれ現実であれ一つの理想に身を捧げきることを道徳的な徳というのなら、群衆はしばしば、もっとも賢明な哲学者さえめったに達しなかったほどの程度で、それらの徳を備えると言ってよい。むろん無意識にそれを実行している。だがそれが何だろう。群衆をおもに導くのは無意識であり、理屈で考えることはまずないからといって、あまり不平を言わないことだ。もし群衆がときにじっくり考え、目先の自分の利益に相談していたなら、おそらくこの地球の表面にはどんな文明も育たず、人類には歴史がなかったであろう。"
  "source_languages":
  - "fr"

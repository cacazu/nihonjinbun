- "id": "b3c4-020"
  "source_text": "« Le tumulte n’a fait que croître à mesure que la soirée s’avançait ; je ne crois pas qu’un seul orateur ait pu dire deux phrases sans être interrompu. À chaque instant les cris partaient d’un point ou de l’autre, ou de tous les points à la fois ; on applaudissait, on sifflait ; des discussions violentes s’engageaient entre divers auditeurs ; les cannes étaient brandies, menaçantes ; on frappait le plancher en cadence ; des clameurs poursuivaient les interrupteurs : « À la porte ! À la tribune ! »"
  "translation_ja": "「夜が更けるほど騒ぎは激しくなるばかりだった。弁士のなかで、さえぎられずに二つの文を言えた人は一人もいなかったと思う。ひっきりなしに、ここから、あそこから、あるいは四方いっせいに叫びが起こった。拍手が起き、やじの口笛が鳴り、あちこちで聴衆どうしの激しい口論が始まった。杖が脅すように振りかざされ、拍子を合わせて床がたたかれた。発言をさえぎった者たちを、『出て行け！』『演壇に上がれ！』というわめき声が追いかけた。"
  "source_languages":

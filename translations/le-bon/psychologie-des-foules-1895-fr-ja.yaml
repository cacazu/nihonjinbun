- "id": "b2c2-note-14"
  "section_id": "b2c2s3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "L’opinion des foules était formée, dans ce cas, par ces associations grossières de choses dissemblables dont j’ai précédemment exposé le mécanisme. Notre garde nationale d’alors, étant composée de pacifiques boutiquiers sans trace de discipline, et ne pouvant être prise au sérieux, tout ce qui portait un nom analogue éveillait les mêmes images, et était considéré par conséquent comme aussi inoffensif. L’erreur des foules était partagée alors, ainsi que cela arrive si souvent pour les opinions générales, par leurs meneurs. Dans un discours prononcé le 31 décembre 1867 à la Chambre des députés, et reproduit par M. E. Ollivier dans un livre récent, un homme d’État qui a bien souvent suivi l’opinion des foules, mais ne l’a jamais précédée, M. Thiers, répétait que la Prusse, en dehors d’une armée active à peu près égale en nombre à la nôtre, ne possédait qu’une garde nationale analogue à celle que nous possédions et par conséquent sans importance ; assertions aussi exactes que les prévisions du même homme d’État sur le peu d’avenir des chemins de fer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-14"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-14"
  "translation_ja": "この場合、群衆の意見を形づくったのは、先にその仕組みを述べた、似てもいないものどうしの粗雑な連想であった。当時わが国の国民衛兵は、規律のかけらもない平和な商店主で構成され、まともには見なせなかったので、似た名がついたものまで同じ像を呼び起こし、したがって同じように無害だと思われた。このときは、一般に行き渡った意見にしばしば起きるように、指導者たちも群衆の誤りを共有していた。Ｅ・オリヴィエ氏が最近の著作に収めた、一八六七年十二月三十一日の代議院の演説で、群衆の意見に従ったことはじつに多いが、群衆に先んじたことは一度もない政治家ティエール氏は、プロイセンにはわが軍とほぼ同数の現役軍を除けば、わが国同様の国民衛兵しかなく、したがって取るに足らないと繰り返していた。その断言は、鉄道に将来性は乏しいという同じ政治家の予想と同じほど正確だった。"
  "translation_status": "reviewed"

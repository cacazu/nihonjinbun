- "id": "b3c3-015"
  "source_text": "« On sait que pendant toute la durée des plaidoiries qu’il prononçait aux assises, Lachaud ne perdait pas de vue deux ou trois jurés qu’il savait, ou sentait, influents, mais revêches. Généralement, il parvenait à réduire ces récalcitrants. Pourtant, une fois, en province, il en trouva un qu’il dardait vainement de son argumentation la plus tenace depuis trois quarts d’heure : le premier du deuxième banc, le septième juré. C’était désespérant ! Tout à coup, au milieu d’une démonstration passionnante, Lachaud s’arrête, et s’adressant au président de la cour d’assises : « Monsieur le président, dit-il, ne pourriez-vous pas faire tirer le rideau, là, en face. Monsieur le septième juré est aveuglé par le soleil. » Le septième juré rougit, sourit, remercia. Il était acquis à la défense. »"
  "translation_ja": "「重罪院で弁論するあいだ、影響力がありそうだと知っているか感じ取ったが、気むずかしい陪審員二、三人を、ラショーが終始目から離さなかったことは知られている。たいていこうした頑固者を折れさせることに成功した。だが一度、地方で、粘り強い論証の矢を四十五分も浴びせかけてまったく効かない人に当たった。二列目の先頭の第七陪審員で、まったくお手上げだった。突然、熱のこもった論証のさなかにラショーは口をつぐみ、重罪院長に向かって、『裁判長』と言った。『あの、向かいのカーテンを引かせていただけませんか。第七陪審員の方は日差しがまぶしくていらっしゃいます』。第七陪審員は頬を染め、ほほえみ、礼を言った。彼は弁護側についた」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

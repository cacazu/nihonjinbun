- "id": "b3c4-011"
  "source_text": "« Les radicaux avaient découvert qu’une république unitaire est une monarchie déguisée, et, pour leur faire plaisir, les Cortès avaient proclamé d’une seule voix la république fédérale sans qu’aucun des votants eût pu dire ce qui venait d’être voté. Mais cette formule enchantait tout le monde, c’était une ivresse, un délire. On venait d’inaugurer sur la terre le règne de la vertu et du bonheur. Un républicain, à qui son ennemi refusait le titre de fédéral, s’en offensait comme d’une mortelle injure. On s’abordait dans les rues en se disant : Salud y republica federal ! Après quoi on entonnait des hymnes à la sainte indiscipline et à l’autonomie du soldat. Qu’était-ce que la « république fédérale ? » Les uns entendaient par là l’émancipation des provinces, des institutions pareilles à celles des États-Unis ou la décentralisation administrative ; d’autres visaient à l’anéantissement de toute autorité, à l’ouverture prochaine de la grande liquidation sociale. Les socialistes de Barcelone et de l’Andalousie prêchaient la souveraineté absolue des communes, ils entendaient donner à l’Espagne dix mille municipes indépendants, ne recevant de lois que d’eux-mêmes, en supprimant du même coup et l’armée et la gendarmerie. On vit bientôt dans les provinces du Midi l’insurrection se propager de ville en ville, de village en village. […] Il n’était pas de méchant bourg qui n’entendît faire sa cuisine à part. Le fédéralisme avait fait place à un cantonalisme brutal, incendiaire et massacreur, et partout se célébraient de sanglantes saturnales. »"
  "translation_ja": "「急進派は、単一共和国とは姿を変えた君主政だと発見した。そこで彼らを喜ばせるため、コルテス（議会）は満場一致で連邦共和国を宣言した。一票を投じた者のだれ一人、今採決したのが何だったのかを説明できなかった。しかしその言い回しにだれもが魅せられた。それは陶酔であり、熱狂であった。地上にいま、徳と幸福の支配が始まったのだ。敵から連邦派の資格はないと言われた共和派は、致命的な侮辱でも受けたように憤慨した。道で出会えば『万歳、連邦共和国！』と呼びかけ合い、そのあと、神聖な無規律と兵士の自律をたたえる歌をうたい始めた。『連邦共和国』とは何だったのか。ある者には地方の解放、合衆国のそれに似た制度、あるいは行政上の地方分権であり、またある者の狙いは、あらゆる権威の消滅、社会全体の総決算が間もなく始まることにあった。バルセロナとアンダルシアの社会主義者たちは自治体の絶対主権を説き、軍も憲兵もなくすと同時に、自分自身のほかにはだれからも法を受けない一万の独立した自治体をスペインにつくろうとした。南部諸州では早くも、蜂起が町から町、村から村へ広がるのが見られた。〔中略〕どんなみすぼらしい小さな町も、自分の台所は自分だけで賄うと言い張らぬところはなかった。連邦主義に取って代わったのは荒々しい、放火し人を殺す小地域割拠主義であり、そこかしこで血塗られた狂宴が繰り広げられた」。"
  "source_languages":

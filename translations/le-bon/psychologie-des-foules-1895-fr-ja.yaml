- "id": "b2c4-020"
  "source_text": "§ 2. — les opinions mobiles des foules"
  "translation_ja": "第二節　群衆の移りやすい意見"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 384
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[63]"
  "section_id": "b2c4s2"

- "id": "b3c4-024"
  "source_text": "Telle est la psychologie des foules électorales. Elle est identique à celle des autres foules. Ni meilleure ni pire."
  "translation_ja": "選挙の群衆の心理とはこういうものだ。ほかの群衆のそれと同じで、よりよくも、より悪くもない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 490
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[500]"
  "section_id": "b3c4"

- "id": "b3c5-057"
  "source_text": "Cette restriction progressive des libertés se manifeste pour tous les pays sous une forme spéciale, que Herbert Spencer n’a pas indiquée, et qui est celle-ci : La création de ces séries innombrables de mesures législatives, toutes généralement d’ordre restrictif, conduit nécessairement à augmenter le nombre, le pouvoir et l’influence des fonctionnaires chargés de les appliquer. Ils tendent ainsi progressivement à devenir les véritables maîtres des pays civilisés. Leur puissance est d’autant plus grande, que, dans les incessants changements de pouvoir, la caste administrative est la seule qui échappe à ces changements, la seule qui possède l’irresponsabilité, l’impersonnalité et la perpétuité. Or, de tous les despotismes, il n’en est pas de plus lourds que ceux qui se présentent sous cette triple forme."
  "translation_ja": "このように次第に自由が制限される事態は、どの国でも、ハーバート・スペンサーが指摘しなかった独特な形を取って現れる。それはこうだ。おおむね制限的な立法措置が無数に生み出されていけば、当然それを執行する役人の数と権力と影響が増す。こうして役人たちは次第に文明諸国の本当の主人になろうとする。彼らの権力がそれだけいっそう大きいのは、政権の絶え間ない交代のなかで、官僚という身分だけがその交代を免れ、責任を負わず、個人として姿を現さず、いつまでも存続するからだ。あらゆる専制のうち、この三つの姿を一身に備えるものほど重苦しいものはない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 555
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[566]"

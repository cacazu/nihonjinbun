- "id": "b3c5-050"
  "source_text": "Malgré toutes les difficultés de leur fonctionnement, les assemblées parlementaires représentent ce que les peuples ont encore trouvé de meilleur pour se gouverner et surtout pour se soustraire le plus possible au joug des tyrannies personnelles. Elles sont certainement l’idéal d’un gouvernement, au moins pour les philosophes, les penseurs, les écrivains, les artistes et les savants, en un mot pour tout ce qui constitue le sommet d’une civilisation."
  "translation_ja": "議会の運営にはこれだけ困難がある。それでも、自らを統治し、とりわけ一人の人間の専制というくびきからできるだけ逃れるために、諸民族が今日までに見いだした手段のうち、議会にまさるものはない。少なくとも哲学者、思想家、作家、芸術家、学者、一言でいえば文明の頂をなす人々にとって、議会はたしかに理想の統治の姿である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 548
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[558]"

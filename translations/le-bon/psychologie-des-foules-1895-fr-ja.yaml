- "id": "b2c1-002"
  "source_text": "Facteurs lointains des croyances et opinions des foules."
  "translation_ja": "群衆の信念と意見を準備する遠い要因"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 220
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[43]"
  "section_id": "b2c1"

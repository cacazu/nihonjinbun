- "id": "b3c5-044"
  "source_text": "Les mêmes phénomènes d’inconscience se manifestèrent pendant toutes les séances orageuses de la Convention."
  "translation_ja": "国民公会の荒れ模様の会議ではどの回にも、同じように自覚を欠く現象が現れた。"
  "source_languages":

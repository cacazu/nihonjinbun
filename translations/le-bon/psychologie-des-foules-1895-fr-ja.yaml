- "id": "intro-023"
  "source_text": "L’exemple qui précède est des plus simples ; la justesse en est aisément perçue. Elle n’avait pas échappé à un psychologue comme Napoléon ; mais les législateurs, qui ignorent l’âme des foules, ne sauraient l’apercevoir. L’expérience ne leur a pas encore suffisamment enseigné que les hommes ne se conduisent jamais avec les prescriptions de la raison pure."
  "translation_ja": "これはごく単純な例で、なるほどとすぐに分かる。ナポレオンのような心理家がこの点を見落とすはずはなかった。だが群衆の魂を知らない立法者たちには、それを見て取ることができない。純粋理性の命ずるところによって人を動かすことはけっしてできないと、経験からまだ十分に学んでいないのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 69
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[70]"

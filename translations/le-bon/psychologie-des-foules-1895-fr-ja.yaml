- "id": "b1c2-note-5"
  "section_id": "b1c2s3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "C’est ce qui permet de comprendre pourquoi il arrive parfois que des pièces refusées par tous les directeurs de théâtre obtiennent de prodigieux succès lorsque, par hasard, elles sont jouées. On sait le succès récent de la pièce de M. Coppée, Pour la couronne, refusée pendant dix ans par les directeurs des premiers théâtres, malgré le nom de son auteur. La marraine de Charley, refusée par tous les théâtres et finalement montée aux frais d’un agent de change, a eu deux cents représentations en France et plus de mille en Angleterre. Sans l’explication donnée plus haut sur l’impossibilité où se trouvent les directeurs de théâtre de pouvoir se substituer mentalement à la foule, de telles aberrations de jugement de la part d’individus compétents et très intéressés à ne pas commettre d’aussi lourdes erreurs seraient inexplicables. C’est un sujet que je ne puis développer ici et qui mériterait de tenter la plume d’un homme de théâtre doublé d’un psychologue subtil, tel par exemple que M. Sarcey."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-5"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-5"
  "translation_ja": "このことから、どこの劇場主にも断られた芝居が、何かのはずみで上演されると、途方もない成功を収めることがあるわけも分かる。コペ氏の戯曲『王冠のために』が最近収めた成功は周知のとおりだが、作者は名高いにもかかわらず、一流劇場の支配人は十年にわたってこれを断りつづけていた。『チャーリーの名付け親』はすべての劇場に断られ、しまいに一人の株式仲買人の出資で上演にこぎつけたが、フランスで二百回、イギリスでは千回以上も公演された。劇場主たちは心のなかで自分を客席の群衆に置き換えることができないという、先に述べた説明を抜きにすれば、これほど力があり、これほど大きな誤りを犯さぬようにすることに切実な利害を持つ人たちが、なぜこんなに判断を誤るのかは説明がつかない。ここでは詳しく述べられないが、たとえばサルセー氏のように、演劇人であると同時に鋭い心理家でもある人が筆を執るに値する題目であろう。"
  "translation_status": "reviewed"
- "id": "b1c2-047"
  "source_text": "Je n’ai pas besoin d’ajouter que l’exagération des foules ne porte que sur les sentiments, et en aucune façon sur l’intelligence. J’ai déjà fait voir que, par le fait seul que l’individu est en foule, son niveau intellectuel baisse immédiatement et considérablement. C’est ce qu’un magistrat érudit, M. Tarde, a également constaté dans ses recherches sur les crimes des foules. Ce n’est donc que dans l’ordre du sentiment que les foules peuvent monter très haut ou descendre au contraire très bas."
  "translation_ja": "群衆における誇張が及ぶのは感情に限られ、知性にはまったく及ばないとは、付け加えるまでもない。一人の人が群衆のなかにいるというだけで、その人の知的水準がただちに大きく下がることは、すでに示した。学識ある司法官タルド氏も、群衆の犯罪に関する研究で同じことを確認している。したがって、群衆が非常な高みにまで上ったり、逆にひどい低みに落ちたりするのは、ただ感情の領域においてである。"
  "source_languages":
  - "fr"

- "id": "b3c2-019"
  "source_text": "L’histoire de la Commune de 1871 nous offre plusieurs faits analogues à ceux qui précèdent. Avec l’influence grandissante des foules et les capitulations successives des pouvoirs devant elles, nous sommes appelés à en voir bien d’autres."
  "translation_ja": "一八七一年のコミューンの歴史にも、以上に類する事実がいくつもある。群衆の影響が増し、権力が次々にそれに屈服するようになれば、私たちはさらにいくつもそうしたものを目にすることになろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

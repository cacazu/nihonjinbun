- "id": "b1c1-013"
  "source_text": "Ne pouvant étudier ici tous les degrés d’organisation des foules, nous les envisagerons surtout ces dernières dans leur phase de complète organisation. Nous verrons ainsi ce qu’elles peuvent devenir mais non ce qu’elles sont toujours. C’est seulement à cette phase avancée d’organisation que, sur le fonds invariable et dominant de la race, se superposent certains caractères nouveaux et spéciaux, et que se produit l’orientation de tous les sentiments et pensées de la collectivité dans une direction identique. C’est alors seulement que se manifeste ce que j’ai nommé plus haut, la loi psychologique de l’unité mentale des foules."
  "translation_ja": "群衆が組織をなすまでのあらゆる段階をここで調べるわけにはいかないので、主として組織が整いきった段階を取り上げよう。こうして分かるのは、群衆がどのようなものになりうるかであって、いつでもそうだということではない。人種に由来する、変わらず支配的な地の上に、新しく独特な性質が重なり、集団のすべての感情と考えが同じ方向を向くのは、組織が進んだこの段階に限られる。先に私が「群衆の心が一つになる心理法則」と呼んだものが姿を現すのは、このときだけである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

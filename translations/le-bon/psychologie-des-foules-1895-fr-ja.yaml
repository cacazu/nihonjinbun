  "translation_status": "reviewed"
- "id": "b3c5-027"
  "source_text": "« Le jour où le même navire emportera vers les terres fiévreuses de la relégation le politicien véreux et l’anarchiste meurtrier, ils pourront lier conversation et ils s’apparaîtront l’un à l’autre comme les deux aspects complémentaires d’un même ordre social. »"
  "translation_ja": "「腐敗した政治屋と人殺しの無政府主義者とを同じ船が熱病のはびこる流刑地へ運んでいく日、その二人は語り合えるだろう。お互いの目に、同じ社会秩序の相い補う二つの顔として映ることだろう。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 525
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[535]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-028"
  "source_text": "L’image ainsi évoquée est bien visible, et tous les adversaires de l’orateur se sentent menacés par elle. Ils voient du même coup les pays fiévreux, le bâtiment qui pourra les emporter, car ne font-ils pas peut-être partie de la catégorie assez mal limitée des politiciens menacés ? Ils éprouvent alors la sourde crainte que devaient ressentir les conventionnels, que les vagues discours de Robespierre menaçaient plus ou moins du couperet de la guillotine, et qui, sous l’influence de cette crainte, lui cédaient toujours."
  "translation_ja": "このように呼び出された像は目にはっきり見える。そして弁士の敵はみな、自分が脅かされていると感じる。熱病の国々と、自分を運び去るかもしれない船とが、同時に目の前に現れる。この脅しを向けられた政治屋なるものの範囲は甚だあいまいだが、もしや自分もそこに入るのではないか。彼らがそのとき覚える、はっきり形をとらない恐れは、国民公会の議員が感じていたに違いない恐れである。ロベスピエールの漠然とした演説は、多かれ少なかれ彼らを断頭台の刃で脅かした。その恐れに押され、彼らはいつも彼に譲歩した。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 526
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[536]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-029"
  "source_text": "Les meneurs ont tout intérêt à verser dans les plus invraisemblables exagérations. L’orateur, dont je viens de citer une phrase, a pu affirmer, sans soulever de grandes protestations, que les banquiers et les prêtres soudoyaient les lanceurs de bombes, et que les administrateurs des grandes compagnies financières méritent les mêmes peines que les anarchistes. Sur les foules, de pareilles affirmations agissent toujours. L’affirmation n’est jamais trop furieuse, ni la déclamation trop menaçante. Rien n’intimide plus les auditeurs que cette éloquence. En protestant, ils craignent de passer pour traîtres ou complices."
  "translation_ja": "指導者にとっては、信じがたいほどの誇張に走って損はない。今しがたその一句を引いた弁士は、銀行家と司祭が爆弾を投げる者たちを買収している、大手金融会社の重役は無政府主義者と同じ刑罰に値する、と言ってのけたが、たいした抗議も起きなかった。こうした断言は群衆に必ず効く。断言が激しすぎたり、大仰な弁舌が脅迫的すぎたりすることはない。聴き手をこれほど威圧する話術はない。異議を唱えれば、裏切り者か共犯者だと思われそうで怖いのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 527
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[537]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-030"
  "source_text": "Cette éloquence spéciale a toujours régné, comme je le disais à l’instant, sur toutes les assemblées ; et, dans les périodes critiques, elle ne fait que s’accentuer. La lecture des discours des grands orateurs qui composaient les assemblées de la Révolution est très intéressante à ce point de vue. À chaque instant ils se croyaient obligés de s’interrompre pour flétrir le crime et exalter la vertu ; puis, ils éclataient en imprécations contre les tyrans, et juraient de vivre libres ou de mourir. L’assistance se levait, applaudissait avec fureur, puis calmée, se rasseyait."
  "translation_ja": "先ほど述べたように、この独特な弁舌はいつもあらゆる議会を支配してきたし、危機の時代にはそれがいっそう際立つ。この点から見て、革命期の議会を構成した大弁士の演説を読むのはまことに興味深い。彼らはしょっちゅう、話を中断して犯罪を糾弾し美徳をたたえずにはいられないと思い込み、それから暴君への呪詛を浴びせ、自由に生きるか、それとも死ぬかだと誓った。聴衆は立ち上がって熱狂的に拍手し、それで気が静まるとまた席に着いた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 528
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[538]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-031"
  "source_text": "Le meneur peut être quelquefois intelligent et instruit ; mais cela lui est généralement plus nuisible qu’utile. En montrant la complexité des choses, en permettant d’expliquer et de comprendre, l’intelligence rend toujours indulgent, et émousse fortement l’intensité et la violence des convictions nécessaires aux apôtres. Les grands meneurs de tous les âges, ceux de la Révolution surtout, ont été lamentablement bornés ; et ce sont justement les plus bornés qui ont exercé la plus grande influence."
  "translation_ja": "指導者が知性と学識を備えている場合もある。だが概してそれは益より害になる。知性は物事の複雑さを見せ、説明と理解を可能にするため、いつも人を寛容にし、使徒に必要な確信の強さと激しさをはなはだしく鈍らせる。どの時代の大指導者たちも、とりわけ革命時代の指導者たちは、嘆かわしいほど視野が狭かった。そしてもっとも視野の狭い者こそ、もっとも大きな影響を及ぼした。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 529
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[539]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-032"
  "source_text": "Les discours du plus célèbre d’entre eux, Robespierre, stupéfient souvent par leur incohérence ; en se bornant à les lire, on n’y trouverait aucune explication plausible du rôle immense du puissant dictateur :"
  "translation_ja": "もっとも名高いロベスピエールの演説には、あまりの脈絡のなさに唖然とさせられることがしばしばある。ただそれを読んだだけでは、この強力な独裁者があれほど大きな役割を果たしたことの、もっともらしい説明はひとつも見つかるまい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 530
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[540]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-033"
  "source_text": "« Lieux communs et redondances de l’éloquence pédagogique et de la culture latine au service d’une âme plutôt puérile que plate, et qui semble se borner, dans l’attaque ou la défense, au « Viens-y donc ! », des écoliers. Pas une idée, pas un tour, pas un trait, c’est l’ennui dans la tempête. Quand on sort de cette lecture morne, on a envie de pousser le ouf ! de l’aimable Camille Desmoulins. »"
  "translation_ja": "「教師めいた弁舌とラテン的教養の決まり文句とくどい繰り返しが、凡庸というよりは幼稚な魂に奉仕している。その魂の攻め口、守り口は、小学生の『じゃあ、かかってこいよ！』に尽きるらしい。思想が一つもない。言い回しの妙も、きらりと光る一言もない。嵐のただ中の退屈だ。この陰気な読書を終えると、あの愛すべきカミーユ・デムーランのように『やれやれ！』と一声あげたくなる。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 531

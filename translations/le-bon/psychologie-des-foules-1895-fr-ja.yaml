- "id": "intro-024"
  "source_text": "Bien d’autres applications pourraient être faites de la psychologie des foules. Sa connaissance jette la plus vive lueur sur un grand nombre de phénomènes historiques et économiques totalement inintelligibles sans elle. J’aurai occasion de montrer que si le plus remarquable des historiens modernes, M. Taine, a si imparfaitement compris parfois les événements de notre grande Révolution, c’est qu’il n’avait jamais songé à étudier l’âme des foules. Il a pris pour guide, dans l’étude de cette période compliquée, la méthode descriptive des naturalistes ; mais, parmi les phénomènes que les naturalistes ont à étudier, les forces morales ne figurent guère. Or ce sont précisément ces forces-là qui constituent les vrais ressorts de l’histoire."
  "translation_ja": "群衆心理の応用例はほかにも数多く挙げられよう。それを知ると、そうでなければ皆目理解できなかった歴史上・経済上のいくつもの現象に、鮮明な光が当たる。近代の歴史家のうちもっともめざましいテーヌ氏にして、ときにわが大革命の出来事をこれほど不十分にしか捉えられなかったのは、群衆の魂を研究しようと思い立つことがなかったからだ。このことはいずれ示す機会があろう。彼はこの複雑な時期を調べるにあたって、博物学者の記述の方法を導き手とした。だが博物学者が研究する現象に、精神的な力はまず入らない。ところが、まさにこの力こそが歴史を動かす本当のばねなのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 70
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[71]"

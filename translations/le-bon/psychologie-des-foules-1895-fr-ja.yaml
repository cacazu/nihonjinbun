  "translation_status": "reviewed"
- "id": "b2c2-034"
  "source_text": "Faut-il regretter que ce ne soit jamais la raison qui guide les foules ? Nous n’oserions le dire. La raison humaine n’eût pas réussi sans doute à entraîner l’humanité dans les voies de la civilisation avec l’ardeur et la hardiesse dont l’ont soulevée ses chimères. Filles de l’inconscient qui nous mène, ces chimères étaient sans doute nécessaires. Chaque race porte dans sa constitution mentale les lois de ses destinées, et c’est peut-être à ces lois qu’elle obéit par un inéluctable instinct, même dans ses impulsions en apparence les plus irraisonnées. Il semble parfois que les peuples soient soumis à des forces secrètes analogues à celles qui obligent le gland à se transformer en chêne ou la comète à suivre son orbite."
  "translation_ja": "群衆を導くのがけっして理性ではないのを、残念がるべきだろうか。そうとは言い切れない。幻想が人類を奮い立たせたほどの熱意と大胆さで、文明の道に人類を引き込むことは、人間の理性にはおそらくできなかっただろう。私たちを導く無意識の娘であるこれらの幻想は、きっと必要だったのだ。人種はそれぞれ、自らの運命の法則を心のつくりのうちに担っている。一見もっとも理屈に合わぬ衝動に従うときさえ、人種は避けがたい本能によってこの法則に従っているのかもしれない。諸民族が、ときに、ドングリを樫の木に変え、彗星をその軌道上に進ませる力に似た、ひそかな力に従っているように見える。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 304
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[311]"
  "section_id": "b2c2s4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c2-035"
  "source_text": "Le peu que nous pouvons pressentir de ces forces doit être cherché dans la marche générale de l’évolution d’un peuple et non dans les faits isolés d’où cette évolution semble parfois surgir. Si l’on ne considérait que ces faits isolés l’histoire semblerait régie par d’invraisemblables hasards. Il était invraisemblable qu’un ignorant charpentier de Galilée pût devenir pendant deux mille ans un Dieu tout-puissant, au nom duquel fussent fondées les plus importantes civilisations ; invraisemblable aussi que quelques bandes d’Arabes sortis de leurs déserts pussent conquérir la plus grande partie du vieux monde gréco-romain, et fonder un empire plus grand que celui d’Alexandre ; invraisemblable encore que, dans une Europe très vieille et très hiérarchisée, un obscur lieutenant d’artillerie pût réussir à régner sur une foule de peuples et de rois. Laissons donc la raison aux philosophes, mais ne lui demandons pas trop d’intervenir dans le gouvernement des hommes. Ce n’est pas avec la raison et c’est le plus souvent malgré elle, que se sont créés des sentiments tels que l’honneur, l’abnégation, la foi religieuse, l’amour de la gloire et de la patrie, qui ont été jusqu’ici les grands ressorts de toutes les civilisations."
  "translation_ja": "そうした力について私たちがかすかになりとも察知できるものは、一民族の進化の大きな歩みのなかに探さねばならず、その進化がそこから生じたかに見える個々ばらばらの出来事に探すべきではない。そうした孤立した事実だけを考慮すれば、歴史はありそうもない偶然に支配されて見えよう。学問のないガリラヤの一介の大工が、二千年にわたって全能の神となり、その名のもとにもっとも重要な文明が築かれるとは、ありそうもないことだった。砂漠から出てきたいくつかのアラブの一団が、古代ギリシア・ローマ世界の大部分を征服し、アレクサンドロス以上の帝国を築くことも、ありそうもなかった。はるかに古く、厳しい身分秩序に支配されたヨーロッパで、名もない一人の砲兵中尉が、多くの民族や王たちを支配するまでになるのも、やはりありそうもなかった。だから理性は哲学者に任せておき、人間の統治にあまり立ち入ってくれるよう求めるのはよそう。名誉、自己犠牲、信仰心、栄光と祖国への愛といった、これまですべての文明を動かしてきた感情は、理性によってではなく、多くの場合は理性に抗して、つくられたのである。"

- "id": "b2c4-004"
  "source_text": "§ 1. – LES CROYANCES FIXES"
  "translation_ja": "第一節　固定した信念"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 368
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[62]"
  "section_id": "b2c4s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-005"
  "source_text": "Il y a un parallélisme étroit entre les caractères anatomiques des êtres et leurs caractères psychologiques. Dans les caractères anatomiques nous trouvons certains éléments invariables, ou si peu variables, qu’il faut la durée des âges géologiques pour les changer, et, à côté de ces caractères fixes, irréductibles, se voient des caractères très mobiles que le milieu, l’art de l’éleveur et de l’horticulteur modifient aisément, et parfois au point de dissimuler, pour l’observateur peu attentif, les caractères fondamentaux."
  "translation_ja": "生物の解剖学的な特徴と心理的な特徴のあいだには、密接な並行関係がある。解剖学的な特徴を見ると、変わらぬ要素と、きわめて変わりにくく、それを変えるには地質時代ほどの時間が要る要素がある。この固定して取り去りがたい性質と並んで、たいへん変わりやすく、環境や育種家、園芸家のわざによってたやすく変えられる性質もある。その結果、ときには注意深くない観察者には、根本の性質まで見えなくなる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 369
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[377]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-006"
  "source_text": "Nous observons le même phénomène dans les caractères moraux. À côté des éléments psychologiques irréductibles d’une race se rencontrent des éléments mobiles et changeants. Et c’est pourquoi, en étudiant les croyances et les opinions d’un peuple, on constate toujours un fonds très fixe sur lequel se greffent des opinions aussi mobiles que le sable qui recouvre le rocher."
  "translation_ja": "心の性質においても同じ現象が観察される。人種に備わる取り去りがたい心理的要素のかたわらに、動きやすく変わりやすい要素がある。だから、ある民族の信念と意見を調べると、非常に固定した土台の上に、岩を覆う砂と同じほど移りやすい意見が接ぎ木されているのが、いつも見て取れる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 370
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[378]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-007"
  "source_text": "Les croyances et les opinions des foules forment donc deux classes bien distinctes. D’une part, les grandes croyances permanentes, qui durent plusieurs siècles, et sur lesquelles une civilisation entière repose, telles, par exemple, autrefois, la conception féodale, les idées chrétiennes, celles de la Réforme ; tels de nos jours, le principe des nationalités, les idées démocratiques et sociales. D’autre part, les opinions momentanées et changeantes, dérivées le plus souvent des conceptions générales, que chaque âge voit naître et mourir : telles sont les théories qui guident les arts et la littérature à certains moments, celles, par exemple, qui ont produit le romantisme, le naturalisme, le mysticisme, etc. Elles sont aussi superficielles, le plus souvent, que la mode, et changent comme elle. Ce sont les petites vagues qui naissent et s’évanouissent sans cesse à la surface d’un lac aux eaux profondes."
  "translation_ja": "群衆の信念と意見は、それゆえ、はっきりと二つの種類をなす。一方にあるのは、幾世紀も続き、文明の全体がその上に休む大きな恒久的信念である。昔の封建的なものの見方、キリスト教の思想、宗教改革の思想、今日なら諸民族がそれぞれ一国をなすという原則、民主的な思想、社会思想などがその例だ。もう一方には、たいていは一般的な観念から派生し、それぞれの時代がその誕生と死を見届ける、一時的で移ろいやすい意見がある。芸術や文学をある時期に導き、たとえば浪漫主義、自然主義、神秘主義などを生んだ理論がそれである。多くの場合、流行と同じように表面的で、同じように変わる。それらは深い湖の水面に絶えず生まれ、消えてゆくさざ波である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 371
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[379]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-008"
  "source_text": "Les grandes croyances générales sont en nombre fort restreint. Leur naissance et leur mort forment pour chaque race historique les points culminants de son histoire. Elles constituent la vraie charpente des civilisations."
  "translation_ja": "大きな一般的信念の数はごく少ない。その誕生と死が、歴史のなかで形成された各人種にとって、その歴史のもっとも高い峰となる。それらこそ文明の真の骨組みをなすものだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 372
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[380]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-009"
  "source_text": "Il est très facile d’établir une opinion passagère dans l’âme des foules, mais il est très difficile d’y établir une croyance durable. Il est également fort difficile de détruire cette dernière lorsqu’elle a été établie. Ce n’est, le plus souvent, qu’au prix de révolutions violentes qu’on peut la changer. Les révolutions n’ont même ce pouvoir que lorsque la croyance a perdu presque entièrement son empire sur les âmes. Les révolutions servent alors à balayer finalement ce qui était à peu près abandonné déjà, mais ce que le joug de la coutume empêchait d’abandonner entièrement. Les révolutions qui commencent sont en réalité des croyances qui finissent."
  "translation_ja": "群衆の魂に一時の意見を根づかせるのはごく簡単だが、長続きする信念を打ち立てるのはひどく難しい。いったん打ち立てられれば、これを壊すのも同じほど難しい。それを変えるのはたいてい、暴力革命の代価を払ってのことだ。革命にそういう力があるのさえ、その信念がすでに魂への支配のほとんどを失ってしまった場合に限られる。このとき革命が最後に掃きのけるのは、すでにほぼ見捨てられているが、慣習のくびきのせいで完全には捨てきれずにいたものだ。革命が始まるということは、実際には、一つの信念が終わりを迎えるということなのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 373
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[381]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-010"
  "source_text": "Le jour précis où une grande croyance est marquée pour mourir est facile à reconnaître ; c’est celui où sa valeur commence à être discutée. Toute croyance générale n’étant guère qu’une fiction ne saurait subsister qu’à la condition de n’être pas soumise à l’examen."
  "translation_ja": "大きな信念に死の定めが下る日は、正確に見分けやすい。それは、その価値が議論に付され始める日である。一般的な信念はどれもほとんど虚構にすぎないので、吟味にかけられないという条件でしか存続できない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 374
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[382]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-011"
  "source_text": "Mais alors même qu’une croyance est fortement ébranlée, les institutions qui en dérivent conservent leur puissance et ne s’effacent que lentement. Lorsqu’elle a enfin perdu complètement son pouvoir, tout ce qu’elle soutenait s’écroule bientôt. Il n’a pas encore été donné à un peuple de pouvoir changer ses croyances sans être aussitôt condamné à transformer tous les éléments de sa civilisation."
  "translation_ja": "だが、ある信念が激しく揺さぶられたときでさえ、そこから派生した制度はまだ力を保ち、ゆっくりとしか消えてゆかない。その信念がついに力をまったく失うと、それが支えていたものはみな、まもなく崩れ落ちる。信念を変えながら、文明の全要素をたちまち変革せざるをえなくなることを免れた民族はいまだにない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 375
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[383]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-012"
  "source_text": "Il les transforme jusqu’à ce qu’il ait trouvé une nouvelle croyance générale qui soit acceptée ; et jusque-là il vit forcément dans l’anarchie. Les croyances générales sont les supports nécessaires des civilisations ; elles impriment une orientation aux idées. Elles seules peuvent inspirer la foi et créer le devoir."
  "translation_ja": "新たに広く受け入れられる一般的な信念を見つけるまで、民族はそれらの要素を変えつづける。それまでは無秩序に暮らすほかない。一般的な信念は、文明に欠かせない支えであり、思想に方向を与える。信じる心を吹き込み、義務を生みうるのは、それだけだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 376
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[384]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-013"
  "source_text": "Les peuples ont toujours senti l’utilité d’acquérir des croyances générales, et compris d’instinct que la disparition de celles-ci devait marquer pour eux l’heure de la décadence. Le culte fanatique de Rome fut pour les Romains la croyance qui les rendit maîtres du monde, et quand cette croyance fut morte, Rome fut condamnée à mourir. Ce fut seulement lorsqu’ils eurent acquis quelques croyances communes que les barbares, qui détruisirent la civilisation romaine, atteignirent à une certaine cohésion et purent sortir de l’anarchie."
  "translation_ja": "諸民族はつねに、広く共有される信念を得ることの有用さを感じ、その消滅は自分たちにとって衰退の時を画するはずだと本能的に分かっていた。ローマ人にとってはローマを熱狂的に崇拝することが、彼らを世界の主にした信念であり、この信念が死んだとき、ローマも死を宣告された。ローマ文明を壊した蛮族がいくらかの結束を得、無秩序を抜け出せたのも、いくつかの共通の信念を得てからにすぎなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 377
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[385]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-014"
  "source_text": "Ce n’est donc pas sans cause que les peuples ont toujours défendu leurs convictions avec intolérance. Cette intolérance, si critiquable au point de vue philosophique, représente dans la vie des peuples la plus nécessaire des vertus. C’est pour fonder ou maintenir des croyances générales que le moyen âge a élevé tant de bûchers, que tant d’inventeurs et de novateurs sont morts dans le désespoir quand ils évitaient les supplices. C’est pour les défendre que le monde a été tant de fois bouleversé, que tant de millions d’hommes sont morts sur les champs de bataille, et y mourront encore."
  "translation_ja": "それゆえ、諸民族がつねに不寛容をもって自分たちの確信を守り抜いてきたのは、理由のないことではない。この不寛容は、哲学上の見地からはひじょうに非難すべきであるにせよ、民族の生活においては、なによりも必要な徳となる。中世があれほどの火刑台を築き、あまたの発明者や革新者が、責め苦を免れたとしても絶望のうちに死んでいったのは、一般の信念を打ち立て、あるいは維持するためだった。それを守るために世界は幾度となく揺り動かされ、何百万もの人々が戦場で死に、これからもまたそこで死ぬだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 378
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[386]"
  "section_id": "b2c4s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-015"
  "source_text": "Il y a de grandes difficultés à établir une croyance générale, mais, quand elle est définitivement établie, sa puissance est pour longtemps invincible ; et quelle que soit sa fausseté philosophique, elle s’impose aux plus lumineux esprits. Les peuples de l’Europe n’ont-ils pas, depuis plus de quinze siècles, considéré comme des vérités indiscutables des légendes religieuses aussi barbares[20], quand on les examine de près, que celles de Moloch. L’effrayante absurdité de la légende d’un Dieu se vengeant sur son fils par d’horribles supplices de la désobéissance d’une de ses créatures, n’a pas été aperçue pendant bien des siècles. Les plus puissants génies, un Galilée, un Newton, un Leibniz, n’ont pas même supposé un instant que la vérité de tels dogmes pût être discutée. Rien ne démontre mieux l’hypnotisation produite par les croyances générales, mais rien ne marque mieux aussi les humiliantes limites de notre esprit."
  "translation_ja": "一般的な信念を打ち立てるのは非常に難しい。しかしひとたび確立すると、その力には長いあいだ敵がなく、どれほど哲学的に誤っていても、このうえなく明晰な人々にさえ受け入れられる。ヨーロッパの諸民族は十五世紀を超える間、よく調べればモロク神のそれに劣らず野蛮な［20］宗教伝説を、議論の余地のない真理とみなしてこなかったか。自分の造った生き物の一つが命令に背いたのを、わが子に恐ろしい苦しみを与えて晴らす神の伝説のおぞましい不合理さは、いく世紀もの間、見て取られなかった。ガリレオ、ニュートン、ライプニッツという、もっとも力強い天才たちでさえ、そのような教義が真かどうか論じうるとは一瞬たりとも考えなかった。一般的な信念が生む催眠状態をこれ以上よく示すものはないが、私たちの精神にどれほど屈辱的な限界があるかを、これ以上よく示すものもない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 379
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[387]"
  "section_id": "b2c4s1"
  "kind": "paragraph"

- "id": "b3c4-026"
  "source_text": "Sans doute, les inconvénients du suffrage universel sont trop visibles pour être méconnus. On ne saurait contester que les civilisations ont été l’œuvre d’une petite minorité d’esprits supérieurs constituant la pointe d’une pyramide, dont les étages, s’élargissant à mesure que décroît la valeur mentale, représentent les couches profondes d’une nation. Ce n’est pas assurément du suffrage d’éléments inférieurs, représentant uniquement le nombre, que la grandeur d’une civilisation peut dépendre. Sans doute encore les suffrages des foules sont souvent bien dangereux. Ils nous ont déjà coûté plusieurs invasions ; et avec le triomphe du socialisme, les fantaisies de la souveraineté populaire nous coûteront sûrement beaucoup plus cher encore."
  "translation_ja": "たしかに普通選挙の欠点はあまりにはっきりしていて、見落としようがない。文明を築いたのは、知的価値の下がるにつれて幅を広げ、国民の深い諸層を表すピラミッドの、その頂点を形づくる少数のすぐれた精神であったことを、否定はできない。文明の偉大さは、数のほかには何も代表しない劣った要素の票決にかかっているわけがない。また群衆の票決がしばしば非常に危険であることもたしかだ。すでに私たちはそのため幾度か侵攻を被ったし、社会主義が勝利すれば、人民主権の気まぐれは、きっとさらに大きな代価を払わせるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 492
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[502]"
  "section_id": "b3c4"

- "id": "b3c4-030"
  "source_text": "Si donc des gens bourrés de science formaient à eux seuls le corps électoral, leurs votes ne seraient pas meilleurs que ceux d’aujourd’hui. Ils se guideraient surtout d’après leurs sentiments et l’esprit de leur parti. Nous n’aurions aucune des difficultés actuelles en moins, et en plus nous aurions sûrement la lourde tyrannie des castes."
  "translation_ja": "だから、たとえ学識を詰め込んだ人々だけで有権者全体を構成しても、その投票は今のものよりよくはならない。やはり主として自分の感情と党派の精神を頼りにするだろう。今日の難点は一つも減らず、おまけに、カーストの重苦しい専制が加わることは確かだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

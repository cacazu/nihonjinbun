  "translation_status": "reviewed"
- "id": "b2c4-021"
  "source_text": "Au-dessus des croyances fixes, dont nous venons de montrer la puissance se trouve une couche d’opinions, d’idées, de pensées qui naissent et meurent constamment. Quelques-unes ont la durée d’un jour, et les plus importantes ne dépassent guère la vie d’une génération. Nous avons marqué déjà que les changements qui surviennent dans ces opinions sont parfois beaucoup plus superficiels que réels, et que toujours ils portent l’empreinte des qualités de la race. Considérant par exemple les institutions politiques du pays où nous vivons, nous avons fait voir que les partis en apparence les plus contraires : monarchistes, radicaux, impérialistes, socialistes, etc., ont un idéal absolument identique, et que cet idéal tient uniquement à la structure mentale de notre race, puisque, sous des noms analogues, on retrouve dans d’autres races un idéal tout à fait contraire. Ce n’est pas le nom donné aux opinions, ni des adaptations trompeuses qui changent le fond des choses. Les bourgeois de la Révolution, tout imprégnés de littérature latine, et qui, les yeux fixés sur la république romaine, adoptèrent ses lois, ses faisceaux et ses toges, et tâchèrent d’imiter ses institutions et ses exemples, n’étaient pas devenus des Romains parce qu’ils étaient sous l’empire d’une puissante suggestion historique. Le rôle du philosophe est de rechercher ce qui subsiste des croyances anciennes sous les changements apparents, et de distinguer ce qui, dans le flot mouvant des opinions, est déterminé par les croyances générales et l’âme de la race."
  "translation_ja": "その力をいま示した固定した信念の上には、絶えず生まれ、死んでゆく、意見、観念、思考の層がある。たった一日のものもあり、もっとも重要なものでも、一世代の寿命を超えることはまずない。すでに指摘したように、こうした意見に生じる変化は、ときには実質的というよりはるかに表面的である。そしてつねに人種の資質の刻印を帯びている。たとえば私たちの住む国の政治制度を考察して、見かけはもっとも対立する政党、王党派、急進派、帝政派、社会主義者等々が、まったく同じ理想を持つことを示した。別の人種のもとでは似たような名称の下に正反対の理想が見いだされるから、この同一の理想はもっぱら私たちの人種の心の構造に由来する。意見につけられた名や、見かけ倒しの借用が、ものの中身を変えるのではない。革命の時代のブルジョワたちは、一身をラテン文学にひたし、ローマ共和政を見すえ、その法律、執政官の束桿、トガを採り入れ、その制度と先例をまねようとしたが、強い歴史的暗示にかかっていたからといって、ローマ人に変わったわけではない。哲学者の役割は、見かけの変化の下に古い信念の何が生き残り、意見の揺れ動く流れの何が、一般的信念と人種の魂によって決まっているかを見分けることだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

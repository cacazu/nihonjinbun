- "id": "b1c4-014"
  "source_text": "On ne comprend bien, je le répète encore, certains événements historiques — et ce sont précisément les plus importants — que lorsqu’on s’est rendu compte de cette forme religieuse que finissent toujours par prendre les convictions des foules. Il y a des phénomènes sociaux qu’il faut étudier en psychologue beaucoup plus qu’en naturaliste. Notre grand historien Taine n’a étudié la Révolution qu’en naturaliste, et c’est pourquoi la genèse réelle des événements lui a bien souvent échappé. Il a parfaitement observé les faits, mais, faute d’avoir étudié la psychologie des foules, il n’a pas toujours su remonter aux causes. Les faits l’ayant épouvanté par leur côté sanguinaire, anarchique et féroce, il n’a guère vu dans les héros de la grande épopée qu’une horde de sauvages épileptiques se livrant sans entraves à leurs instincts. Les violences de la Révolution, ses massacres, son besoin de propagande, ses déclarations de guerre à tous les rois, ne s’expliquent bien que si l’on réfléchit qu’elle fut simplement l’établissement d’une nouvelle croyance religieuse dans l’âme des foules. La Réforme, la Saint-Barthélemy, les guerres de Religion, l’Inquisition, la Terreur, sont des phénomènes d’ordre identique, accomplis par des foules animées de ces sentiments religieux qui conduisent nécessairement à extirper sans pitié, par le fer et le feu, tout ce qui s’oppose à l’établissement de la nouvelle croyance. Les méthodes de l’inquisition sont celles de tous les vrais convaincus. Ils ne seraient pas des convaincus s’ils en employaient d’autres."
  "translation_ja": "もう一度言おう。群衆の確信が結局いつも取るこの宗教的な形に気づいて初めて、ある種の歴史的事件、しかもまさにもっとも重要な事件が、よく分かる。社会現象には、博物学者としてよりもはるかに心理学者として調べる必要のあるものがある。わが国の大歴史家テーヌは革命をひたすら博物学者として研究した。そのため、出来事が生まれる真の過程をしばしば見逃した。事実そのものは見事に観察したが、群衆の心理を研究していなかったので、つねに原因までさかのぼれたわけではない。血なまぐさく、無秩序で、獰猛な事件の一面に恐れをなしたあまり、この大叙事詩の英雄たちのうちに、てんかん持ちの野蛮人の一群がなんの抑えもなく本能にふける姿しか、ほとんど見なかった。革命の暴力、虐殺、宣伝に駆り立てる衝動、あらゆる国王への宣戦がよく説明できるのは、それが群衆の魂のうちに新たな宗教的信仰を打ち立てることにほかならなかったと考える場合だけだ。宗教改革もサン・バルテルミの虐殺も、宗教戦争も異端審問も恐怖政治も、同じ種類の現象である。それを成し遂げた群衆を動かしたのは、新しい信仰の樹立を妨げるものを、剣と火で、いささかの容赦もなく根絶せずにはおかない、あの宗教感情だった。異端審問のやり方は、真に確信を持った者たちすべてのやり方である。別のやり方を用いるなら、確信の人とは言えまい。"
  "source_languages":
  - "fr"
  "source_locations":

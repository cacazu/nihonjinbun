- "id": "b3c3-003"
  "source_text": "Les jurés de cour d’assises. — Caractères généraux des jurys. — La statistique montre que leurs décisions sont indépendantes de leur composition. — Comment sont impressionnés les jurés. — Faible action du raisonnement. — Méthodes de persuasion des avocats célèbres. — Nature des crimes pour lesquels les jurés sont indulgents ou sévères. — Utilité de l’institution du jury et danger extrême que présenterait son remplacement par des magistrats."
  "translation_ja": "重罪院の陪審員。陪審の一般的な性質。統計の示すところでは、その決定はどんな人々で構成されるかに左右されない。陪審員の心を動かすもの。推論の効果の弱さ。名高い弁護士たちの説得法。陪審員が寛大な犯罪と、厳しく当たる犯罪の性質。陪審制度の効用と、それを職業裁判官に置き換えることの極度の危険。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 452
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[84]"
  "section_id": "b3c3"

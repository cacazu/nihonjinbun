  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-025"
  "source_text": "« Nous pouvons lire constamment, dit le philosophe anglais Maine, des débats à la Chambre des communes, où toute la discussion consiste à échanger des généralités assez faibles et des personnalités assez violentes. Sur l’imagination d’une démocratie pure, ce genre de formules générales exerce un effet prodigieux. Il sera toujours aisé de faire accepter à une foule des assertions générales présentées en termes saisissants, quoiqu’elles n’aient jamais été vérifiées et ne soient peut-être susceptibles d’aucune vérification. »"
  "translation_ja": "「下院の討議を読んでいると」とイギリスの思想家メインは言う。「いささか弱々しい一般論と、相当に激しい個人攻撃の応酬で議論の一切が尽きていることに、絶えず出会う。生粋の民主政の想像力には、この種の一般的な決まり文句が驚くべき効果を及ぼす。一般論を人の心をつかむ言葉で言い切れば、群衆にそれを受け入れさせることはいつだって容易だろう。これまで確かめられたためしがなく、おそらく何をもってしても確かめようのない主張であっても。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 523
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[533]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-026"
  "source_text": "L’importance des « termes saisissants », indiquée dans la citation qui précède, ne saurait être exagérée. Nous avons plusieurs fois déjà insisté sur la puissance spéciale des mots et des formules. Il faut les choisir de façon à ce qu’ils évoquent des images très vives. La phrase suivante, empruntée au discours d’un des meneurs de nos assemblées, en constitue un excellent spécimen :"
  "translation_ja": "今の引用で指摘された「人の心をつかむ言葉」の重要性は、いくら強調してもしすぎることはない。言葉と決まり文句の特別な力については、すでに何度か力説した。それらは、きわめて鮮明な像を呼び起こすように選ばなければならない。わが国の議会のある指導者の演説から借りた次の一句は、そのよい見本である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 524
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[534]"
  "section_id": "b3c5"
  "kind": "paragraph"

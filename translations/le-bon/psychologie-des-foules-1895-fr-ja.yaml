- "id": "b1c3-032"
  "source_text": "Ce ne sont donc pas les faits en eux-mêmes qui frappent l’imagination populaire, mais bien la façon dont ils sont répartis et présentés. Il faut que par leur condensation, si je puis m’exprimer ainsi, ils produisent une image saisissante qui remplisse et obsède l’esprit. Qui connaît l’art d’impressionner l’imagination des foules connaît aussi l’art de les gouverner."
  "translation_ja": "民衆の想像力を打つのは、したがって、事実そのものではない。それがどう分かれて起こり、どのような形で示されるかである。言ってみれば、いくつもの事実が凝縮して、人の心を満たし、いつまでも離れない、鮮烈な像を生まなければならない。群衆の想像力を打つすべを心得た者は、群衆を治めるすべをも心得ている。"
  "source_languages":
  - "fr"
  "source_locations":

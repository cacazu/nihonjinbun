- "id": "b2c1-note-8"
  "section_id": "b2c1s4"
  "kind": "note_body"
  "origin": "source"
  "source_text": "C’est ce que reconnaissent, même aux États-Unis, les républicains les plus avancés. Le journal américain Forum exprimait récemment cette opinion catégorique dans les termes que je reproduis ici, d’après la Review of Reviews de décembre 1894 : « On ne doit jamais oublier, même chez les plus fervents ennemis de l’aristocratie, que l’Angleterre est aujourd’hui le pays le plus démocratique de l’univers, celui où les droits de l’individu sont le plus respectés, et celui où les individus possèdent le plus de liberté. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-8"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-8"
  "translation_ja": "アメリカ合衆国にあってさえ、もっとも進歩的な共和政論者たちもこのことを認めている。アメリカの雑誌『フォーラム』は最近、この意見をきっぱりと次のように述べた。一八九四年十二月の『レヴュー・オヴ・レヴューズ』に従ってここに引く。「たとえ貴族制のもっとも熱心な敵であっても、今日、イギリスが世界でもっとも民主的な国であり、個人の権利がもっとも尊重され、各人がもっとも多くの自由を享受する国であることを、けっして忘れてはならない」。"
  "translation_status": "reviewed"
- "id": "b2c1-032"
  "source_text": "C’est donc une tâche très puérile, un inutile exercice de rhéteur ignorant que de perdre son temps à fabriquer de toutes pièces des constitutions. La nécessité et le temps se chargent de les élaborer, quand nous avons la sagesse de laisser agir ces deux facteurs. C’est ainsi que les Anglo-Saxons s’y sont pris, et c’est ce que nous dit leur grand historien Macaulay dans un passage que devraient apprendre par cœur les politiciens de tous les pays latins. Après avoir montré tout le bien qu’ont pu faire des lois qui semblent, au point de vue de la raison pure, un chaos d’absurdités et de contradictions, il compare les douzaines de constitutions, mortes dans les convulsions, des peuples latins de l’Europe et de l’Amérique avec celle de l’Angleterre, et fait voir que cette dernière n’a été changée que très lentement, par parties, sous l’influence de nécessités immédiates et jamais de raisonnements spéculatifs. « Ne point s’inquiéter de la symétrie, et s’inquiéter beaucoup de l’utilité ; n’ôter jamais une anomalie uniquement parce qu’elle est une anomalie ; ne jamais innover si ce n’est lorsque quelque malaise se fait sentir, et alors innover juste assez pour se débarrasser du malaise ; n’établir jamais une proposition plus large que le cas particulier auquel on remédie ; telles sont les règles qui, depuis l’âge de Jean jusqu’à l’âge de Victoria, ont généralement guidé les délibérations de nos 250 parlements. »"
  "translation_ja": "だから憲法を丸ごと机上でこしらえるのに時間を費やすのは、まことに幼稚な仕事、無知な雄弁家のむなしい腕試しなのである。必要と時間という二つの要因に働くままを任せる賢さがこちらにあれば、憲法を練り上げるのはその二つが引き受けてくれる。アングロサクソン人はそのようにした。それを伝えてくれるのが彼らの大歴史家マコーリーの一節で、ラテン諸国の政治家はみな暗記すべきものだ。純粋理性から見れば不合理と矛盾の混沌としか見えない法律がなしえた数々の善を示した後、彼はヨーロッパやアメリカのラテン諸民族のもとで動乱に葬られた幾十もの憲法と、イギリスの憲法とを比べる。そして後者が、ごく緩やかに、部分ごとに、かならず目の前の必要に動かされて変えられてきたこと、思弁的な推論で変えられたことは決してないことを明らかにする。「釣り合った形には心を煩わせず、役に立つかどうかにはおおいに心を砕く。変則だからというだけで変則を取り除かない。なにか不具合が感じられるまでは改めず、そうなっても、不具合を除くに足るだけしか改めない。対処する特定の場合より広い命題をけっして立てない。ジョン王の時代からヴィクトリアの時代まで、わが国の二百五十の議会の討議をおおむね導いてきたのは、このような規則である」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

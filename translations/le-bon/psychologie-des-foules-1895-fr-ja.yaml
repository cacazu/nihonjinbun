- "id": "b2c3-note-18"
  "section_id": "b2c3s3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Très conscient de son prestige, Napoléon savait qu’il l’accroissait encore en traitant un peu moins bien que des palefreniers les grands personnages qui l’entouraient, et parmi lesquels figuraient plusieurs de ces célèbres conventionnels qu’avait tant redoutés l’Europe. Les récits du temps sont pleins de faits significatifs sur ce point. Un jour, en plein conseil d’État, Napoléon rudoie grossièrement Beugnot qu’il traite comme un valet mal appris. L’effet produit, il s’approche et lui dit : « Eh bien, grand imbécile, avez-vous retrouvé votre tête ? » Là-dessus, Beugnot, haut comme un tambour-major se courbe très bas, et le petit homme, levant la main, prend le grand par l’oreille, « signe de faveur enivrante, écrit Beugnot, geste familier du maître qui s’humanise ». De tels exemples donnent une notion nette du degré de basse attitude que peut provoquer le prestige. Ils font comprendre l’immense mépris du grand despote pour les hommes qui l’entouraient et qu’il traitait simplement de « chair à canon »."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-18"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-18"
  "translation_ja": "自分の威信をよく自覚していたナポレオンは、それをさらに高めるには、自分を取り巻く大人物たちを馬丁より少しぞんざいに扱えばよいことを知っていた。その中には、ヨーロッパ中からあれほど恐れられた名高い元国民公会議員が何人もいた。当時の記録には、このことを物語る事実がいくらでもある。ある日、国務院の評議の真っ最中に、ナポレオンはブーニョを粗野に扱い、しつけの悪い下僕のように叱りつけた。効き目があったと見ると、近寄って言った。「どうだ、この大ばか者め、頭はしゃんとしたか」。すると鼓手長のように背の高いブーニョはうやうやしく深くかがみ、小男は手を上げて大男の耳をつかんだ。「うっとりさせる恩寵のしるしで、主人が人間らしい親しさを見せた仕草だった」とブーニョは書いている。こうした例を見れば、威信がどれほど卑屈な態度を呼びうるかがはっきり分かる。この大専制君主が取り巻きたちをただの『大砲の餌食』と呼び、どれほど見下していたかも理解できよう。"
  "translation_status": "reviewed"
- "id": "b2c3-050"
  "source_text": "Davoust disait, parlant du dévouement de Maret et du sien : « Si l’Empereur nous disait à tous deux : Il importe aux intérêts de ma politique de détruire Paris sans que personne en sorte et s’en échappe, Maret garderait le secret, j’en suis sûr, mais il ne pourrait s’empêcher de le compromettre cependant en faisant sortir sa famille. Eh bien, moi, de peur de le laisser deviner, j’y laisserais ma femme et mes enfants. »"
  "translation_ja": "マレの忠誠心と自分の忠誠心について、ダヴーは語った。「仮に皇帝が二人に言われたとしよう。『私の政策のためには、だれ一人外へ出たり逃げたりさせず、パリを滅ぼすことが肝要だ』と。マレが秘密を守ることは確信している。だが彼は家族を逃がすことで、どうしても秘密を危うくしてしまうだろう。私ならどうか。人に勘づかれるのを恐れ、妻も子どもたちも残しておく」。"

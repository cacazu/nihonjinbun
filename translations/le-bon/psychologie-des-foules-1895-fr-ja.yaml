- "id": "b1c2-033"
  "source_text": "Pour en revenir aux observations faites par les foules, nous conclurons que les observations collectives sont les plus erronées de toutes et que le plus souvent elles représentent simplement l’illusion d’un individu qui, par voie de contagion, a suggestionné les autres. On pourrait multiplier à l’infini les faits prouvant qu’il faut avoir la plus profonde défiance du témoignage des foules. Des milliers d’hommes ont assisté, il y a vingt-cinq ans, à la célèbre charge de cavalerie de la bataille de Sedan, et pourtant il est impossible, en présence des témoignages visuels les plus contradictoires, de savoir par qui elle fut commandée. Dans un livre récent, le général anglais Wolseley a prouvé que l’on avait commis jusqu’ici les plus graves erreurs sur les faits les plus considérables de la bataille de Waterloo, faits que des centaines de témoins avaient cependant attestés[4]."
  "translation_ja": "群衆がする観察の話に戻ると、集団的な観察はあらゆる観察のなかでもっとも誤りやすく、たいていは、伝染によってほかの人々に暗示をかけた一個人の錯覚を表しているにすぎないと結論してよい。群衆の証言には深い不信の念をもって臨むべきことを示す事実なら、いくらでも増やせる。二十五年前、スダンの戦いで有名な騎兵突撃を見た者は数千人いた。それなのに、目撃証言がはなはだしく食い違い、その指揮にあたったのがだれかすら分からない。イギリスのウルズリー将軍は最近の著書で、ワーテルローの戦いのもっとも重大な事柄について、これまで重大きわまる誤りが犯されてきたと証明した。しかもそれらは数百人の目撃者が証言していた事柄だった［4］。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

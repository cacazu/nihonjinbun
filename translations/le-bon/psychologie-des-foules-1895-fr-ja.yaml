- "id": "b2c3-005"
  "source_text": "§ 1. — LES MENEURS DES FOULES"
  "translation_ja": "第一節　群衆の指導者"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 310
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[57]"
  "section_id": "b2c3s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-006"
  "source_text": "Dès qu’un certain nombre d’êtres vivants sont réunis, qu’il s’agisse d’un troupeau d’animaux ou d’une foule d’hommes, ils se placent d’instinct sous l’autorité d’un chef."
  "translation_ja": "動物の群れであれ、人間の群衆であれ、ある数の生き物が集まりさえすれば、本能的に一人の長の権威に身をゆだねる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 311
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[318]"
  "section_id": "b2c3s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-007"
  "source_text": "Dans les foules humaines, le chef n’est souvent qu’un meneur, mais, comme tel, il joue un rôle considérable. Sa volonté est le noyau autour duquel se forment et s’identifient les opinions. Il constitue le premier élément d’organisation des foules hétérogènes et prépare leur organisation en sectes. En attendant, il les dirige. La foule est un troupeau servile qui ne saurait jamais se passer de maître."
  "translation_ja": "人間の群衆では、長はしばしば人々を率いてゆく扇動者にすぎない。だがそのような者として、大きな役割を果たしている。人々の意見がその周りに形をなし、ひとつにまとまる核が、彼の意志である。異質な群衆が組織をなす最初の要素となり、彼らが一つの党派として組織をなす準備をする。それまでにも彼は群衆を導く。群衆とは主人なしではけっしていられない、従順な群れである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 312
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[319]"
  "section_id": "b2c3s1"

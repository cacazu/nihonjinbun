- "id": "b1c2-048"
  "source_text": "§ 4. — INTOLÉRANCE, AUTORITARISME ET CONSERVATISME DES FOULES"
  "translation_ja": "第四節　群衆の不寛容、権威主義、保守性"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 154
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[33]"
  "section_id": "b1c2s4"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-049"
  "source_text": "Les foules ne connaissant que les sentiments simples et extrêmes ; les opinions, idées et croyances qui leur sont suggérées sont acceptées ou rejetées par elles en bloc, et considérées comme des vérités absolues ou des erreurs non moins absolues. Il en est toujours ainsi des croyances déterminées par voie de suggestion, au lieu d’avoir été engendrées par voie de raisonnement. Chacun sait combien les croyances religieuses sont intolérantes et quel empire despotique elles exercent sur les âmes."
  "translation_ja": "群衆は単純で極端な感情しか知らないから、暗示された意見、思想、信念を丸ごと受け入れるか、丸ごと退けるかし、それを絶対の真理か、それに劣らず絶対の誤りと受け取る。推論から生まれたのでなく、暗示によって決まった信念には、いつもこのことが言える。宗教上の信仰がどれほど不寛容であり、人の魂のうえにどれほど専制的な権力を振るうかは、だれもが知っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 155
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[156]"
  "section_id": "b1c2s4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-050"
  "source_text": "N’ayant aucun doute sur ce qui est vérité ou erreur et ayant d’autre part la notion claire de sa force, la foule est aussi autoritaire qu’intolérante. L’individu peut supporter la contradiction et la discussion, la foule ne les supportent jamais. Dans les réunions publiques, la plus légère contradiction de la part d’un orateur est immédiatement accueillie par des hurlements de fureur et de violentes invectives, bientôt suivis de voies de fait et d’expulsion pour peu que l’orateur insiste. Sans la présence inquiétante des agents de l’autorité, le contradicteur serait même fréquemment massacré."
  "translation_ja": "群衆は何が真理で何が誤りかについて何の疑いも抱かず、他方では自分の力をはっきり自覚しているので、不寛容であると同じだけ権威を振りかざす。個人なら、反論にも討論にも耐えうる。群衆はけっして耐えない。公開の集会で弁士が少しでも逆らうと、たちまち怒号と激しい罵声が浴びせられ、それでも言いつづけようものなら、ほどなく手が出て追い出される。官憲が目を光らせていなければ、反対意見を述べた者が殺されることさえたびたびあるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 156
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[157]"
  "section_id": "b1c2s4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-051"
  "source_text": "L’autoritarisme et l’intolérance sont généraux chez toutes les catégories de foules, mais ils s’y présentent à des degrés forts divers ; et ici encore reparaît la notion fondamentale de la race, dominatrice de tous les sentiments et de toutes les pensées des hommes. C’est surtout chez les foules latines que l’autoritarisme et l’intolérance sont développés à un haut degré. Ils le sont au point d’avoir détruit entièrement ce sentiment de l’indépendance individuelle si puissant chez l’Anglo-Saxon. Les foules latines ne sont sensibles qu’à l’indépendance collective de la secte à laquelle elles appartiennent, et la caractéristique de cette indépendance est le besoin d’asservir immédiatement et violemment à leurs croyances tous les dissidents. Chez les peuples latins, les Jacobins de tous les âges, depuis ceux de l’inquisition, n’ont jamais pu s’élever à une autre conception de la liberté."
  "translation_ja": "権威主義と不寛容は、あらゆる種類の群衆に共通しているが、現れ方の程度は実にさまざまである。ここにもまた、人間のすべての感情と考えを支配する、人種という根本の観念が姿を現す。権威主義と不寛容がとりわけ高度に発達しているのはラテン系の群衆だ。その強さは、アングロサクソン人にあれほど強く息づく個人の独立心を、すっかり壊してしまうほどである。ラテン系の群衆が重きを置くのは、自分たちが属する党派の集団としての独立だけで、その独立を特徴づけるのは、意見を異にする者を片端から、ただちに力ずくで自分たちの信念に服させずにはおけないことだ。ラテン諸民族のもとでは、異端審問の時代の者からこのかた、どの時代のジャコバン派も、自由についてこれとは別の考え方にまで高まることはついになかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 157
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[158]"
  "section_id": "b1c2s4"

- "id": "b3c2-018"
  "source_text": "Au bout d’une semaine de travail, toutes ces opérations étant terminées, les massacreurs purent songer au repos. Étant intimement persuadés qu’ils avaient bien mérité de la patrie, ils vinrent réclamer aux autorités une récompense ; les plus zélés allèrent même jusqu’à exiger une médaille."
  "translation_ja": "こうして一週間働き、仕事がすべて終わると、虐殺者たちにも休むことを考える余裕ができた。祖国におおいに尽くしたと心の底から信じていたので、当局に褒美を求めて出てきた。とくに熱心な者に至っては、勲章を要求するほどだった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

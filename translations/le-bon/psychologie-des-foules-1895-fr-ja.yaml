  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-036"
  "source_text": "Et c’est pourquoi toute opinion devenue populaire finit toujours par s’imposer avec une grande force aux couches sociales les plus élevées, quelque visible que puisse être l’absurdité de l’opinion triomphante. Il y a là une réaction des couches sociales inférieures sur les couches supérieures d’autant plus curieuse que les croyances de la foule dérivent toujours plus ou moins de quelque idée supérieure restée souvent sans influence dans le milieu où elle avait pris naissance. Cette idée supérieure, les meneurs subjugués par elle s’en emparent, la déforment et créent une secte qui la déforme de nouveau, puis la répand dans le sein des foules qui continuent à la déformer de plus en plus. Devenue vérité populaire, elle remonte en quelque façon à sa source et agit alors sur les couches supérieures d’une nation. C’est en définitive l’intelligence qui guide le monde, mais elle le guide vraiment de fort loin. Les philosophes qui créent les idées sont depuis bien longtemps retournés à la poussière, lorsque, par l’effet du mécanisme que je viens de décrire, leur pensée finit par triompher."
  "translation_ja": "だから民衆に広まった意見はいずれも、勝ちを占めたその意見の不合理がどれほど明らかでも、しまいにはもっとも高い社会階層に強大な力で押しつけられる。ここには下層から上層への反作用があり、しかも興味深いのは、群衆の信念がもともと、多少とも高次の思想、その生まれた環境ではしばしば何の影響力もなかった思想から、いつも由来することである。その思想に心を奪われた指導者がそれを手に取り、形を変え、一つの派をつくる。その派がまた形を変え、次いで群衆のうちに広める。群衆はさらに、ますます形を変えてゆく。民衆の真理となったその思想は、いわば水源にさかのぼり、今度は一国の上層に作用する。結局世界を導くのは知性だが、じつに遠いところから導くのだ。先に述べた仕組みの結果、一つの思想がついに勝ちを占める頃には、それを生んだ哲学者はとっくの昔に塵に帰している。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "b1c2-021"
  "source_text": "Tel est toujours le mécanisme de ces hallucinations collectives si fréquentes dans l’histoire, et qui semblent avoir tous les caractères classiques de l’authenticité, puisqu’il s’agit de phénomènes constatés par des milliers de personnes."
  "translation_ja": "歴史にかくもたびたび現れ、しかも数千人が確認した現象であるから本物と認めるための従来の条件をすべて満たすかに見える、あの集団幻覚の仕組みはつねにこうである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 127
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[129]"
  "section_id": "b1c2s2"

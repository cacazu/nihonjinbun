  "translation_status": "reviewed"
- "id": "b3c4-010"
  "source_text": "Nous reconnaissons ici tous les facteurs de persuasion que nous avons décrits. Nous allons les retrouver encore dans l’action des mots et des formules dont nous avons déjà montré le magique empire. L’orateur qui sait les manier conduit à volonté les foules où il veut. Des expressions telles que l’infâme capital, les vils exploiteurs, l’admirable ouvrier, la socialisation des richesses, etc., produisent toujours le même effet, bien qu’un peu usées déjà. Mais le candidat qui trouve une formule neuve, bien dépourvue de sens précis, et par conséquent pouvant répondre aux aspirations les plus diverses, obtient un succès infaillible. La sanglante révolution espagnole de 1873 a été faite avec un de ces mots magiques, au sens complexe, que chacun peut interpréter à sa façon. Un écrivain contemporain en a raconté la genèse en termes qui méritent d’être rapportés."
  "translation_ja": "ここに、私たちが述べた説得の要因すべてを認められる。その魔力をすでに示した言葉と決まり文句の働きにも、またこれらの要因を見いだすだろう。これを扱うすべを知る弁士は、思いのまま、望むところへ群衆を導く。「いまわしい資本」「卑劣な搾取者たち」「すばらしい労働者」「富の社会化」といった表現は、すでに多少はすり減っていても、つねに同じ効果を生む。しかし、はっきりした意味が見事なほどなく、したがってきわめて多様な願いに応えられる新しい決まり文句を見つけた候補は、まちがいなく成功する。一八七三年スペインの血なまぐさい革命は、意味が複雑で、各自が好きなように解釈できるこうした魔法の言葉の一つによってなされた。同時代のある作家が、その発端を、ここに伝えるだけの値打ちのある言葉で語っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

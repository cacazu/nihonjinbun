- "id": "b1c4-009"
  "source_text": "Les convictions des foules revêtent ces caractères de soumission aveugle, d’intolérance farouche, de besoin de propagande violente qui sont inhérents au sentiment religieux ; et c’est pourquoi on peut dire que toutes leurs croyances ont une forme religieuse. Le héros que la foule acclame est véritablement un dieu pour elle. Napoléon le fut pendant quinze ans, et jamais divinité n’eut de plus parfaits adorateurs. Aucune n’envoya plus facilement les hommes à la mort. Les dieux du paganisme et du christianisme n’exercèrent jamais un empire plus absolu sur les âmes qu’ils avaient conquises."
  "translation_ja": "群衆の確信は、宗教感情に内在する盲従、激しい不寛容、力ずくでも信念を広めたいという欲求を帯びる。だから群衆のあらゆる信念は宗教の形を取ると言えるのだ。群衆が歓呼する英雄は、その群衆にとって文字どおり神である。ナポレオンは十五年の間そうした神であった。どんな神格にも、これほど申し分のない崇拝者がいたためしはない。これほどたやすく人を死地に送った神もない。異教やキリスト教の神々も、勝ち得た人々の魂のうえにこれ以上絶対的な支配を及ぼしたことはなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 210
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[212]"
  "section_id": "b1c4"

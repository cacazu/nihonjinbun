- "id": "b1c2-035"
  "source_text": "Il découle clairement de ce qui précède qu’il faut considérer comme des ouvrages d’imagination pure les livres d’histoire. Ce sont des récits fantaisistes de faits mal observés, accompagnés d’explications faites après coup. Gâcher du plâtre est faire œuvre bien plus utile que de perdre son temps à écrire de tels livres. Si le passé ne nous avait pas légué ses œuvres littéraires, artistiques et monumentales, nous ne saurions absolument rien de réel sur ce passé. Connaissons-nous un seul mot de vrai concernant la vie des grands hommes qui ont joué les rôles prépondérants dans l’humanité, tels que Hercule, Bouddha, Jésus ou Mahomet ? Très probablement non. Au fond d’ailleurs, leur vie réelle nous importe fort peu. Ce que nous avons intérêt à connaître, ce sont les grands hommes tels que la légende populaire les a fabriqués. Ce sont les héros légendaires, et pas du tout les héros réels, qui ont impressionné l’âme des foules."
  "translation_ja": "ここまで述べてきたことから明らかなのは、歴史書は純粋な想像の産物とみなすべきだということだ。それは、おぼつかない観察をもとに事実を気ままに物語り、事後に作った説明を添えたものである。そんな本を書くのに時間をつぶすくらいなら、石膏を練っているほうがはるかに役に立つ仕事だ。過ぎ去った時代が文学や美術や建築の作品を私たちに遺してくれなかったなら、過去について確かなことはひとつも分からなかったろう。ヘラクレス、仏陀、イエス、ムハンマドなど、人類に決定的な役割を演じた偉人たちの生涯について、ほんとうのことを何か一言でも知っているだろうか。おそらく知ってはいない。それに、つまるところ彼らの実際の生涯は私たちにとってさほど重要でない。知るに値するのは、民衆の伝説が作り上げた姿での偉人たちだ。群衆の魂に印象を刻んだのは、伝説の英雄であって、現実の英雄ではまったくない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

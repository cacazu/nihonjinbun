- "id": "intro-020"
  "source_text": "À dire vrai pourtant, tous les maîtres du monde, tous les fondateurs de religions ou d’empires, les apôtres de toutes les croyances, les hommes d’État éminents, et, dans une sphère plus modeste, les simples chefs de petites collectivités humaines, ont toujours été des psychologues inconscients, ayant de l’âme des foules une connaissance instinctive, souvent très sûre ; et c’est parce qu’ils la connaissaient bien qu’ils sont si facilement devenus les maîtres. Napoléon pénétrait merveilleusement la psychologie des foules du pays où il a régné, mais il méconnut complètement parfois celle des foules appartenant à des races différentes[1] ; et c’est parce qu’il la méconnut qu’il entreprit, en Espagne et en Russie notamment, des guerres où sa puissance reçut des chocs qui devaient bientôt l’abattre."
  "translation_ja": "もっとも本当を言えば、世界を支配した者、宗教や帝国を築いた者、あらゆる信仰の使徒、傑出した政治家たち、またもっと小さな舞台では、人の小集団を率いるだけの指導者に至るまで、みな昔から自分でも知らぬ心理学者だった。群衆の魂を本能的に、そしてしばしば実に確かに知っていた。たやすく人の上に立てたのも、それをよく知っていたからである。ナポレオンは、自分が統治した国の群衆の心理を驚くほどよく見抜いていた。だが別の人種の群衆の心理となると、ときにはまるで見誤った［1］。その見誤りがあったからこそ、とりわけスペインとロシアで戦争に踏み切り、そこで彼の権力は、やがてそれを打ち倒すに至る打撃を受けたのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 66

    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p87-11"
  "translation_ja": "テーヌ『現代の体制』第二巻、一八九四年。これらのページは、ほぼテーヌが最後に書いたものに当たる。大哲学者の長い経験の成果をみごとに要約している。残念ながら外国で暮らしたことのないわが国の大学の教授たちには、およそ理解できないものだろう。一民族の魂にいくらかなりと働きかけるために私たちが持っている唯一の手段が教育である。現行の教育が急速な衰退をもたらす恐るべき要素で、若者を高めるどころか低めて堕落させることを理解できる者が、フランスにはほとんど一人もいないと思わねばならないのは、まことに悲しい。\n\nテーヌの文章を、ポール・ブールジェ氏が最近その見事な著作『海の彼方』に記したアメリカの教育についての観察と比べれば有益であろう。彼もまた、わが国の教育は、みずから始める力も意志もない偏狭な市民か、無政府主義者しか生み出さないと認めた。「無力な凡庸さに終わるにせよ、破壊的な狂気に終わるにせよ、育ちそこなった文明人の二つの型は、等しく災いをなす」と。そして彼は、退化の工場と化したわが国フランスのリセと、人を人生に備えさせることではじつに見事なアメリカの学校とを、いくら熟考してもしすぎることのない仕方で比べている。そこには、真に民主的な諸民族と、口先でだけ民主主義を唱え、考えのうちにはこれをまったく持たない諸民族とのあいだに開く深淵が、くっきり見える。"
  "translation_status": "reviewed"
- "id": "b2c1-052"
  "source_text": "Nous sommes-nous éloignés, dans ce qui précède, de la psychologie des foules ? Non certes. Si nous voulons comprendre les idées, les croyances qui y germent aujourd’hui, et qui écloront demain, il faut savoir comment le terrain a été préparé. L’enseignement donné à la jeunesse d’un pays permet de savoir ce que sera ce pays un jour. L’éducation donnée à la génération actuelle justifie les prévisions les plus sombres. C’est en partie avec l’instruction et l’éducation que s’améliore ou s’altère l’âme des foules. Il était donc nécessaire de montrer comment le système actuel l’a façonnée, et comment la masse des indifférents et des neutres est devenue progressivement une immense armée de mécontents, prête à obéir à toutes les suggestions des utopistes et des rhéteurs. C’est à l’école que se forment aujourd’hui les mécontents et les anarchistes et que se préparent pour les peuples latins les heures prochaines de décadence."
  "translation_ja": "ここまでの話は群衆の心理から外れてしまっただろうか。けっしてそうではない。今日そこで芽を出し、明日花を開く思想や信念を理解するには、その土壌がどのように準備されたかを知らねばならない。ある国の若者に与えられる教育を見れば、その国がいつの日かどうなるかが分かる。今の世代に与えられている教育は、もっとも暗い予想にも根拠を与える。群衆の魂がよくなり、または損なわれるのは、一つには知育と教育によってである。そこで、現行の制度がどのようにそれを形づくり、無関心でどちらにもつかずにいた人々の群れが、いかにして次第に、空想家と雄弁家のあらゆる暗示に応じる構えをもった、不満分子の巨大な軍勢となったかを示す必要があった。今日、不満を抱く者と無政府主義者が育つのは学校においてであり、ラテン諸民族に迫り来る衰退の時が用意されるのも、学校においてなのだ。"
  "source_languages":
  - "fr"
  "source_locations":

- "id": "intro-019"
  "source_text": "Ces foules, dont on commence à tant parler, nous les connaissons bien peu. Les psychologues professionnels, ayant vécu loin d’elles, les ont toujours ignorées, et quand ils s’en sont occupés, dans ces derniers temps, ce n’a été qu’au point de vue des crimes qu’elles peuvent commettre. Sans doute il existe des foules criminelles, mais il existe aussi des foules vertueuses, des foules héroïques, et encore bien d’autres. Les crimes des foules ne constituent qu’un cas particulier de leur psychologie, et on ne connaît pas plus la constitution mentale des foules en étudiant seulement leurs crimes, qu’on ne connaîtrait celle d’un individu en décrivant seulement ses vices."
  "translation_ja": "これほど口にのぼるようになった群衆を、私たちは実にわずかしか知らない。職業としての心理学者は、群衆から遠く離れて暮らしてきたため、いつもそれを顧みなかった。近ごろようやく取り上げたときにも、群衆が犯しうる犯罪という面からしか扱わなかった。むろん罪を犯す群衆はいる。だが、徳のある群衆も、英雄的な群衆も、ほかにまだいろいろな群衆もいる。群衆の犯罪はその心理の一つの特殊な場合でしかない。犯罪だけを調べて群衆の心のつくりを知ろうとするのは、ある個人の悪癖だけを描いてその心のつくりが分かると思うのと同じだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 65
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[66]"

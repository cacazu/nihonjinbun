  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c3-004"
  "source_text": "Ne pouvant étudier ici toutes les catégories de jurés, j’examinerai seulement la plus importante, celle des jurés de cours d’assises. Ces jurés constituent un excellent exemple de foule hétérogène non anonyme. Nous y retrouvons la suggestibilité, la prédominance des sentiments inconscients, la faible aptitude au raisonnement, l’influence des meneurs, etc. En les étudiant nous aurons l’occasion d’observer d’intéressants spécimens des erreurs que peuvent commettre les personnes non initiées à la psychologie des collectivités."
  "translation_ja": "ここであらゆる種類の陪審員を調べるわけにいかないので、もっとも重要な種類である、重罪院の陪審員だけを取り上げる。この陪審員たちは、無名でない異質な群衆のすぐれた例をなしている。暗示の受けやすさ、無意識の感情の優勢、推論能力の低さ、指導者の影響といったものが、ここにも見いだされる。それを調べると、集団の心理に通じていない人々が犯しうる誤りの、興味深い見本にも出会うことになる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 453
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[458]"
  "section_id": "b3c3"

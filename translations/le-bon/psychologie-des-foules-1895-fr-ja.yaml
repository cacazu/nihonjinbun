- "id": "b1c1-014"
  "source_text": "Parmi les caractères psychologiques des foules, il en est qu’elles peuvent présenter en commun avec des individus isolés ; d’autres, au contraire, leur sont absolument spéciaux et ne se rencontrent que chez les collectivités. Ce sont ces caractères spéciaux que nous allons étudier d’abord pour bien en montrer l’importance."
  "translation_ja": "群衆の心理的性質のなかには、単独の個人にも共通して見られるものがある。逆に、もっぱら群衆に特有で、集団にしか現れないものもある。後者の重要さをはっきりさせるため、まずそれから調べよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

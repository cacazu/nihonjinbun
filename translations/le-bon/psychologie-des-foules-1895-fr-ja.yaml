  "translation_status": "reviewed"
- "id": "b3c5-060"
  "source_text": "Mais alors les ressorts que l’homme ne trouve plus en lui-même, il est bien forcé de les chercher hors de lui-même. Avec l’indifférence et l’impuissance croissantes des citoyens, le rôle des gouvernements est obligé de grandir encore. Ce sont eux qui doivent avoir forcément l’esprit d’initiative, d’entreprise et de conduite que les particuliers n’ont plus. Il leur faut tout entreprendre, tout diriger, tout protéger. L’État devient un dieu tout-puissant. Mais l’expérience enseigne que le pouvoir de tels dieux ne fut jamais ni bien durable, ni bien fort."
  "translation_ja": "だがそうなると、人はもはや自分の内に見つからない動力を、自分の外に探すほかはない。市民の無関心と無力が強まるにつれ、政府の役割はさらに大きくならざるをえない。私人から失われた、事を起こし、企て、率いる気概を必然的に政府がもたねばならない。すべてに乗り出し、すべてを指図し、すべてを保護しなくてはならない。国家は全能の神となる。しかし経験が教えるのは、そのような神々の権力がたいして長続きしたことも、本当に強かったことも一度としてないということだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

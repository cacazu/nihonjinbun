- "id": "b1c1-029"
  "source_text": "Aussi, par le fait seul qu’il fait partie d’une foule organisée, l’homme descend de plusieurs degrés sur l’échelle de la civilisation. Isolé, c’était peut-être un individu cultivé, en foule c’est un barbare, c’est-à-dire un instinctif. Il a la spontanéité, la violence, la férocité, et aussi les enthousiasmes et les héroïsmes des êtres primitifs. Il tend à s’en rapprocher encore par la facilité avec laquelle il se laisse impressionner par des mots, des images — qui sur chacun des individus isolés composant la foule seraient tout à fait sans action — et conduire à des actes contraires à ses intérêts les plus évidents et à ses habitudes les plus connues. L’individu en foule est un grain de sable au milieu d’autres grains de sable que le vent soulève à son gré."
  "translation_ja": "人は、組織をなした群衆の一員になったというだけで、文明の階段をいく段か下りる。一人でいれば教養のある人であったかもしれない。群衆のなかでは野蛮人、つまり本能のままの人だ。原始の人々に見られる衝動、激しさ、獰猛さとともに、その熱狂や英雄的な振る舞いをも持つ。一人ずつのときならなんの力も持たないであろう言葉や心像にたやすく心を動かされ、当人にとってもっとも明白な利益や日ごろのよく知られた習慣に逆らう行為にまで引きずられることで、なおさら彼らに近づいてゆく。群衆のなかの個人は、ほかの砂粒にまじり、風の吹くままに舞い上がる一粒の砂である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 103
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[105]"
  "section_id": "b1c1"

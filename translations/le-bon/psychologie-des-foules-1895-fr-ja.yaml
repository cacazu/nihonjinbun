- "id": "b2c4-002"
  "source_text": "Limites de variabilité des croyances et opinions des foules."
  "translation_ja": "群衆の信念と意見はどこまで変わるか"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 366
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[60]"
  "section_id": "b2c4"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-003"
  "source_text": "§ 1. – Les croyances fixes. – Invariabilité de certaines croyances générales. – Elles sont les guides d’une civilisation. – Difficulté de les déraciner. – En quoi l’intolérance constitue pour les peuples une vertu. – L’absurdité philosophique d’une croyance générale ne peut nuire à sa propagation. – § 2. Les opinions mobiles des foules. – Extrême mobilité des opinions qui ne dérivent pas des croyances générales. – Variations apparentes des idées et des croyances en moins d’un siècle. – Limites réelles de ces variations. – Éléments sur lesquels la variation a porté. – La disparition actuelle des croyances générales et la diffusion extrême de la presse rendent de nos jours les opinions de plus en plus mobiles. – Comment les opinions des foules tendent sur la plupart des sujets vers l’indifférence. – Impuissance des gouvernements à diriger comme jadis l’opinion. – L’émiettement actuel des opinions empêche leur tyrannie."
  "translation_ja": "一　固定した信念。ある種の一般的な信念の変わりにくさ。それらは文明の導き手である。それを根こそぎにすることの難しさ。どういう意味で不寛容は諸民族にとって徳なのか。一般的な信念は、哲学的に見て不合理でも、そのために広まりが妨げられるわけではない。二　群衆の移りやすい意見。一般的な信念に由来しない意見の、ひどい変わりやすさ。一世紀に足りない間に起きた、思想や信念の見かけの変化。これらの変化の真の限界。実際に変わった要素。一般的な信念が消えてゆくことと、新聞がたいへん広く普及したこととが、今日の意見をますます変わりやすくしている。たいていの問題について、群衆の意見が無関心に傾いていくありさま。今日の政府にはかつてのように世論を導く力がない。現在、意見は細かく砕けているので、専制を振るうことができない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 367
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[61]"

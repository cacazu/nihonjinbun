  "translation_status": "reviewed"
- "id": "b3c3-005"
  "source_text": "Les jurés nous fournissent tout d’abord une preuve de la faible importance que présente au point de vue des décisions, le niveau mental des divers éléments composant une foule. Nous avons vu que lorsqu’une assemblée délibérante est appelée à donner son opinion sur une question n’ayant pas un caractère tout à fait technique, l’intelligence ne joue aucun rôle ; et qu’une réunion de savants ou d’artistes, par ce fait seul qu’ils sont réunis, n’a pas, sur des sujets généraux, des jugements sensiblement différents de ceux d’une assemblée de maçons ou d’épiciers. À diverses époques, avant 1848 notamment, l’administration faisait un choix soigneux parmi les personnes appelées à composer le jury, et on les recrutait parmi les classes éclairées : professeurs, fonctionnaires, lettrés, etc. Aujourd’hui le jury se recrute surtout parmi les petits marchands, les petits patrons, les employés. Or, au grand étonnement des écrivains spéciaux, quelle qu’ait été la composition des jurys, la statistique prouve que leurs décisions ont été identiques. Les magistrats eux-mêmes, si hostiles pourtant à l’institution du jury, ont dû reconnaître l’exactitude de cette assertion. Voici comment s’exprime à ce sujet un ancien président de cour d’assises, M. Bérard des Glajeux, dans ses Souvenirs."
  "translation_ja": "陪審員はまず、決定を下すという点で、群衆をなすさまざまな構成員の知的水準がほとんど重要でないことを裏づけてくれる。審議団体が、完全に専門技術的とはいえない問題について意見を求められたとき、知性は何の役も果たさないこと、学者や芸術家の会合も、ただ寄り集まったというだけで、一般的な問題については左官や食料品商の会合と目立って違う判断をしないことを、私たちは見た。時代により、とくに一八四八年より前には、行政が陪審に加わる人々を入念に選び、教授、官僚、文人など、教育を受けた階層から選任した。今日では陪審員はおもに小売商、小規模な雇い主、事務員から選ばれる。ところが専門に論じる著述家たちが大いに驚いたことに、統計は、陪審の構成がどうであってもその決定は変わらなかったと示している。陪審制度にこれほど敵意を抱く司法官たちでさえ、この言い分の正しさを認めねばならなかった。元重罪院長ベラール・デ・グラジュー氏は『回想録』で、この問題について次のように述べている。"
  "source_languages":
  - "fr"

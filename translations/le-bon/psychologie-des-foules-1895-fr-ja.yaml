- "id": "preface-008"
  "source_text": "L’étude des phénomènes sociaux ne peut être séparée de celle des peuples chez lesquels ils se sont produits. Philosophiquement, ces phénomènes peuvent avoir une valeur absolue ; pratiquement ils n’ont qu’une valeur relative."
  "translation_ja": "社会現象の研究を、その現象が起きた民族の研究から切り離すことはできない。哲学のうえでは、これらの現象には絶対的な価値がありうる。だが実際の生活では、相対的な価値しか持たない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 41
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[41]"
  "section_id": "preface"

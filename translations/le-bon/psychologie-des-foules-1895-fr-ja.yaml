- "id": "b1c2-025"
  "source_text": "Le fait suivant est un des plus typiques, parce qu’il est choisi parmi des hallucinations collectives sévissant sur une foule où se trouvaient des individus de toutes sortes, les plus ignorants comme les plus instruits. Il est rapporté incidemment par le lieutenant de vaisseau Julien Félix dans son livre sur les courants de la mer, et a été autrefois reproduit dans la Revue Scientifique."
  "translation_ja": "次の事実はとりわけ典型的である。ひどく無学な者から十分に教育を受けた者まで、さまざまな人を含む群衆を襲った集団幻覚の一例だからだ。海軍大尉ジュリアン・フェリックスが海流について書いた著作で、ほかの話のついでに伝えている。以前『科学評論』にも転載された。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

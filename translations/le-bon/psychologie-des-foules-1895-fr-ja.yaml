- "id": "b2c3-022"
  "source_text": "§ 2. — LES MOYENS D’ACTION DES MENEURS : L’AFFIRMATION, LA RÉPÉTITION, LA CONTAGION."
  "translation_ja": "第二節　指導者が働きかける手段、すなわち断言、反復、伝染"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 327
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[58]"

- "id": "b1c2-013"
  "source_text": "La foule n’est pas seulement impulsive et mobile. Comme le sauvage, elle n’admet pas que quelque chose puisse s’interposer entre son désir et la réalisation de ce désir. Elle le comprend d’autant moins que le nombre lui donne le sentiment d’une puissance irrésistible. Pour l’individu en foule, la notion d’impossibilité disparaît. L’individu isolé sent bien qu’il ne pourrait à lui seul incendier un palais, piller un magasin, et, s’il en est tenté, il résistera aisément à sa tentation. Faisant partie d’une foule, il a conscience du pouvoir que lui donne le nombre, et il suffit de lui suggérer des idées de meurtre et de pillage pour qu’il cède immédiatement à la tentation. L’obstacle inattendu sera brisé avec frénésie. Si l’organisme humain permettait la perpétuité de la fureur, on pourrait dire que l’état normal de la foule contrariée est la fureur."
  "translation_ja": "群衆は衝動的で移り気なだけではない。いわゆる野蛮人と同じく、自分の欲望とその実現とのあいだに何かが立ちはだかりうるとは認めない。数を頼りに、何ものも抗しえない力を感じているので、なおさらそれが理解できない。群衆のなかの個人にとって、不可能という観念は消える。一人でいれば、自分一人で宮殿に火をつけたり店を略奪したりなどできまいとよく分かっているし、そんな気を起こしても、たやすく誘惑に抗するだろう。群衆の一部となると、数が与えてくれる力を自覚し、殺人や略奪の考えをほのめかされるだけで、たちまち誘惑に負ける。思いがけない障害があれば、狂ったようにそれを打ち砕く。もし人体がいつまでも激怒しつづけられるようにできていたら、意に逆らわれた群衆の平常の状態は激怒なのだと言えよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 119
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[121]"
  "section_id": "b1c2s1"

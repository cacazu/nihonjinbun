- "id": "b1c2-note-2"
  "section_id": "b1c2s2"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Les personnes qui ont assisté au siège de Paris ont vu de nombreux exemples de cette crédulité des foules aux choses les plus invraisemblables. Une bougie allumée à un étage supérieur était considérée aussitôt comme un signal fait aux assiégeants, bien qu’il fût évident, après deux secondes de réflexion, qu’il leur était absolument impossible d’apercevoir de plusieurs lieues de distance la lueur de cette bougie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p28-2"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p28-2"
  "translation_ja": "パリ包囲戦に立ち会った者は、ひどくありそうもないことを信じてしまう群衆の性質について、数多くの実例を見た。建物の上の階にろうそくが一本ともると、包囲軍に送った合図だとたちまち思われた。二秒も考えてみれば、数リューも離れたところからそのろうそくの明かりを見るなど、包囲軍にはまったく不可能であることは明らかだったのに。"
  "translation_status": "reviewed"
- "id": "b1c2-019"
  "source_text": "La création des légendes qui circulent si aisément dans les foules n’est pas déterminée seulement par une crédulité complète. Elle l’est encore par les déformations prodigieuses que subissent les événements dans l’imagination de gens assemblés. L’événement le plus simple vu par la foule est bientôt un événement transformé. Elle pense par images, et l’image évoquée en évoque elle-même une série d’autres n’ayant aucun lien logique avec la première. Nous concevons aisément cet état en songeant aux bizarres successions d’idées où nous sommes parfois conduits par l’évocation d’un fait quelconque. La raison nous montre ce que dans ces images il y a d’incohérence, mais la foule ne le voit guère ; et ce que son imagination déformante ajoute à l’événement réel, elle le confondra avec lui. La foule ne sépare guère le subjectif de l’objectif. Elle admet comme réelles les images évoquées dans son esprit, et qui le plus souvent n’ont qu’une parenté lointaine avec le fait observé."
  "translation_ja": "群衆のなかでやすやすと流通する伝説が生まれるのは、何もかも頭から信じるせいだけではない。集まった人々の想像のなかで出来事が途方もなく形を変えるせいでもある。群衆が見れば、ごく単純な出来事もたちまち形を変えた出来事になる。群衆は像によって考え、呼び起こされた一つの像が、最初の像とは何の論理的つながりもない別のいくつもの像を呼び起こす。私たちも、何かの出来事を思い起こしたのをきっかけに、ときとして妙な連想を重ねてしまうことを考えれば、この状態をたやすく思い描ける。私たちの理性は、こうした心像がどれほどちぐはぐかを教えてくれる。だが群衆にはそれがまず見えない。物事をゆがめる想像力が現実の出来事につけ加えたものを、出来事そのものと混同する。群衆は主観と客観をほとんど分けない。心に浮かぶ像を、たいてい見た事実とは遠い縁しかなくても、実在するものと認める。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

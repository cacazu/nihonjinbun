- "id": "b1c2-032"
  "source_text": "On remarque que ces reconnaissances se font, le plus souvent, par des femmes et des enfants, c’est-à-dire précisément par les êtres les plus impressionnables. Elles nous montrent, du même coup, ce que peuvent valoir en justice de tels témoignages. En ce qui concerne les enfants, notamment, leurs affirmations ne devraient jamais être invoquées. Les magistrats répètent comme un lieu commun qu’à cet âge on ne ment pas. Avec une culture psychologique un peu moins sommaire ils sauraient qu’à cet âge, au contraire, on ment presque toujours. Le mensonge, sans doute, est innocent, mais n’en est pas moins un mensonge. Mieux vaudrait décider à pile ou face la condamnation d’un accusé que de la décider, comme on l’a fait tant de fois, d’après le témoignage d’un enfant."
  "translation_ja": "こうした身元確認をするのはたいてい女性と子ども、すなわちとりわけ影響を受けやすい者たちだということに気づく。それと同時に、そのような証言が裁判でどれほどの価値を持ちうるかも分かる。とりわけ子どもについては、彼らの断言をけっして根拠にすべきでない。司法官たちは、子どもはうそをつかないと、決まり文句のように繰り返す。心理学についてもう少しましな素養があれば、逆に、その年頃ではほとんどいつもうそをつくのだと分かるだろう。むろん悪気のないうそだが、やはりうそにはちがいない。被告人を有罪とするかどうかを、これまであまりにしばしば行われてきたように、子どもの証言で決めてしまうくらいなら、硬貨の表裏に任せるほうがまだよい。"
  "source_languages":
  - "fr"

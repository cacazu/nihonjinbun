- "id": "b1c4-002"
  "source_text": "Formes religieuses que revêtent toutes les convictions des foules."
  "translation_ja": "群衆のあらゆる確信が帯びる宗教的な形"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 203
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[40]"
  "section_id": "b1c4"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c4-003"
  "source_text": "Ce qui constitue le sentiment religieux. — Il est indépendant de l’adoration d’une divinité. — Ses caractéristiques. — Puissance des convictions revêtant la forme religieuse. — Exemples divers. — Les dieux populaires n’ont jamais disparu. — Formes nouvelles sous lesquelles ils renaissent. — Formes religieuses de l’athéisme. — Importance de ces notions au point de vue historique. — La Réforme, la Saint-Barthélemy, la Terreur et tous les événements analogues, sont la conséquence des sentiments religieux des foules, et non de la volonté d’individus isolés."
  "translation_ja": "宗教感情を成り立たせるもの。それは神格の崇拝とは独立している。その特徴。宗教の形を帯びた確信の力。さまざまな例。民衆の神々はけっして姿を消さなかった。神々がよみがえる新しい形。無神論が取る宗教的な形。歴史を考えるうえで、これらの見方が持つ重要性。宗教改革、サン・バルテルミの虐殺、恐怖政治その他同様の出来事は、個々の人間の意志ではなく、群衆の宗教感情の結果である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 204
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[41]"
  "section_id": "b1c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c4-004"
  "source_text": "Nous avons montré que les foules ne raisonnent pas, qu’elles admettent ou rejettent les idées en bloc ; ne supportent ni discussion, ni contradiction, et que les suggestions agissant sur elles envahissent entièrement le champ de leur entendement et tendent aussitôt à se transformer en actes. Nous avons montré que les foules convenablement suggestionnées sont prêtes à se sacrifier pour l’idéal qui leur a été suggéré. Nous avons vu aussi qu’elles ne connaissent que les sentiments violents et extrêmes, que, chez elles, la sympathie devient vite adoration, et qu’à peine née l’antipathie se transforme en haine. Ces indications générales permettent déjà de pressentir la nature de leurs convictions."
  "translation_ja": "群衆は推論をせず、思想を丸ごと受け入れるか退けるかし、討論にも反論にも耐えないことを、私たちは示した。また、群衆に働きかける暗示はその理解の場をすべて占領し、すぐさま行為に変わろうとすることを示した。適切に暗示を受けた群衆は、吹き込まれた理想のためにみずからを犠牲にする用意がある。群衆が知るのは激しく極端な感情だけで、そのもとでは共感がすぐに崇拝となり、反感が生まれるや否や憎悪に変わることも見た。こうした一般的な指摘だけからでも、群衆の確信の性質はすでに予想できる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 205
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[207]"
  "section_id": "b1c4"

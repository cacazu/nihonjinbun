  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-007"
  "source_text": "On peut les diviser en deux classes. Dans l’une nous placerons les idées accidentelles et passagères créées sous des influences du moment : l’engouement pour un individu ou une doctrine par exemple. Dans l’autre, les idées fondamentales auxquelles le milieu, l’hérédité, l’opinion donnent une stabilité très grande : telles les croyances religieuses jadis, les idées démocratiques et sociales aujourd’hui."
  "translation_ja": "それを二つに分けることができる。一つには、その場の影響によって生じる偶然的で一時的な思想、たとえば特定の人物や教説に対する熱狂を置こう。もう一つには、環境、遺伝、世論によって非常な安定を与えられる根本の思想を置く。それが昔なら宗教上の信仰であり、今日なら民主的な思想や社会に関する思想である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 176
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[176]"

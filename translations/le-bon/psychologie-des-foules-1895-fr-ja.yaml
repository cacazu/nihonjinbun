- "id": "b3c4-005"
  "source_text": "Recherchons comment on les séduit. Des procédés qui réussissent le mieux, leur psychologie se déduira clairement."
  "translation_ja": "彼らはどうやって引きつけられるのかを探ろう。いちばんよく成功するやり方から、彼らの心理もはっきり導き出せるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 471
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[480]"
  "section_id": "b3c4"

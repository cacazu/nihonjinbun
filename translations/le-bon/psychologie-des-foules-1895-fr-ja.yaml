- "id": "toc-018"
  "source_text": "Facteurs préparatoires des croyances des foules. — L’éclosion des croyances des foules est la conséquence d’une élaboration antérieure. — Étude des divers facteurs de ces croyances. — § 1. La race. — Influence prédominante qu’elle exerce. — Elle représente les suggestions des ancêtres. — § 2. Les Traditions. — Elles sont la synthèse de l’âme de la race. — Importance sociale des traditions. — En quoi, après avoir été nécessaires, elles deviennent nuisibles. — Les foules sont les conservateurs les plus tenaces des idées traditionnelles. — § 3. Le temps. — Il prépare successivement l’établissement des croyances, puis leur destruction. — C’est grâce à lui que l’ordre peut sortir du chaos. — § 4. Les institutions politiques et sociales. — Idée erronée de leur rôle. — Leur influence est extrêmement faible. — Elles sont des effets, et non des causes. — Les peuples ne sauraient choisir les institutions qui leur semblent les meilleures. — Les institutions sont des étiquettes qui, sous un même titre, abritent les choses les plus dissemblables. — Comment les constitutions peuvent se créer. — Nécessité pour certains peuples de certaines institutions théoriquement mauvaises, telles que la centralisation. — § 5. L’instruction et l’éducation. — Erreur des idées actuelles sur l’influence de l’instruction chez les foules. — Indications statistiques. — Rôle démoralisateur de l’éducation latine. — Rôle que l’instruction pourrait exercer. — Exemples fournis par divers peuples."
  "translation_ja": "群衆の信念を準備する要因。群衆の信念が芽を出すのは、それ以前の形成過程の結果である。これらの信念のさまざまな要因を調べる。一　人種。それが及ぼす圧倒的な影響。人種は祖先からの暗示を表す。二　伝統。伝統は人種の魂の集約である。伝統の社会的重要性。必要であったものが、やがてどのように有害になるか。伝統的な思想をもっとも頑固に守るのは群衆である。三　時間。時間は順を追ってまず信念の定着を、次いでその崩壊を準備する。混沌から秩序が生まれうるのは時間のおかげである。四　政治制度と社会制度。その役割についての誤解。影響はきわめて弱い。制度は結果であって原因ではない。諸民族は、自分たちにとって最善に見える制度を選ぶことはできない。制度とは同じ名の下にまるで異なるものを覆い隠す札である。憲法はいかにして生まれうるか。中央集権のように、理論上は悪い制度でも、一部の民族には必要なものがあること。五　知育と教育。知育が群衆に及ぼす影響をめぐる今日の考えの誤り。統計の示すところ。ラテン系の教育が人の気持ちを荒廃させる働き。知育が果たしうる役割。さまざまな国民が示す例。"
  "source_languages":
  - "fr"

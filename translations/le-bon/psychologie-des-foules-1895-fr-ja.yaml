- "id": "b2c3-030"
  "source_text": "L’imitation, à laquelle on a attribué tant d’influence dans les phénomènes sociaux, n’est en réalité qu’un simple effet de la contagion. Ayant montré ailleurs son influence je me bornerai à reproduire ce que j’en disais il y a plus de vingt ans et qui depuis a été développé par d’autres écrivains dans des publications récentes :"
  "translation_ja": "社会現象において模倣にはじつに大きな影響があるとされているが、実際には伝染のもたらす単なる結果にすぎない。その影響についてはすでに別のところで示したので、二十年以上前に私が述べ、その後ほかの著述家が近著で発展させた話を、ここに引くだけにしよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

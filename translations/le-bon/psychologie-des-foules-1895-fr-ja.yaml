- "id": "b1c2-026"
  "source_text": "La frégate la Belle-Poule croisait en mer pour retrouver la corvette le Berceau dont elle avait été séparée par un violent orage. On était en plein jour et en plein soleil. Tout à coup la vigie signale une embarcation désemparée. L’équipage dirige ses regards vers le point signalé, et tout le monde, officiers et matelots, aperçoit nettement un radeau chargé d’hommes remorqué par des embarcations sur lesquelles flottaient des signaux de détresse. Ce n’était pourtant qu’une hallucination collective. L’amiral Desfossés fit armer une embarcation pour voler au secours des naufragés. En approchant, les matelots et les officiers qui la montaient voyaient « des masses d’hommes s’agiter, tendre les mains, et entendaient le bruit sourd et confus d’un grand nombre de voix ». Quand l’embarcation fut arrivée, on se trouva simplement devant quelques branches d’arbres couvertes de feuilles arrachées à la côte voisine. Devant une évidence aussi palpable, l’hallucination s’évanouit."
  "translation_ja": "フリゲート艦ベル＝プール号は、激しい嵐ではぐれたコルベット艦ベルソー号を捜して海上を巡航していた。真っ昼間で、日もさんさんと照っていた。突然、見張りが、航行不能になった小舟がいると報じた。乗組員が指された方角に目を向けると、士官も水兵も、だれもがはっきりと、人のいっぱい乗ったいかだを、救難の信号旗をかかげた数隻の小舟が曳いているのを見た。ところがそれは、集団幻覚にすぎなかった。デフォセ提督は遭難者を救うため、急いで小艇を出させた。近づいてゆくと、艇上の水兵と士官には、「大勢の人間が身を動かし、手を差し伸べるのが見え、たくさんの声が入り混じった、くぐもった音が聞こえた」。艇がたどり着いたとき、目の前にあったのはただ、近くの岸からちぎれて流れ出した、葉をつけた木の枝が数本だけだった。手で触れて確かめられるほど明白な事実を前にして、幻覚は消えた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 132

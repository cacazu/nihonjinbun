  "translation_status": "reviewed"
- "id": "intro-012"
  "source_text": "Peu aptes au raisonnement, les foules sont au contraire très aptes à l’action. Par leur organisation actuelle, leur force est devenue immense. Les dogmes que nous voyons naître auront bientôt la puissance des vieux dogmes c’est-à-dire, la force tyrannique et souveraine qui met à l’abri de la discussion. Le droit divin des foules va remplacer le droit divin des rois."
  "translation_ja": "筋道立てて考えるのは苦手でも、群衆は反対に、行動することにはひどく長じている。今のように組織された結果、その力は途方もなく大きくなった。私たちの目の前で生まれつつある教義は、じきに旧来の教義のような力を備えるだろう。すなわち、いかなる議論をも寄せつけない専制的で絶対的な力である。王権神授説に取って代わろうとしているのは、群衆の権利こそ神授のものだという信仰だ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 58
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[59]"
  "section_id": "intro"

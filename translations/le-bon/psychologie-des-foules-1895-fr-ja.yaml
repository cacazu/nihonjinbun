- "id": "b1c2-note-4"
  "section_id": "b1c2s2"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Savons-nous, pour une seule bataille, comment elle s’est passée exactement ? J’en doute fort. Nous savons quels furent les vainqueurs et les vaincus, mais probablement rien de plus. Ce que M. d’Harcourt, acteur et témoin, rapporte de la bataille de Solférino peut s’appliquer à toutes les batailles : « Les généraux (renseignés naturellement par des centaines de témoignages) transmettent leurs rapports officiels ; les officiers chargés de porter les ordres modifient ces documents et rédigent le projet définitif ; le chef d’état-major le conteste et le refait sur nouveaux frais. On le porte au maréchal, il s’écrie : « Vous vous trompez absolument ! » et il substitue une nouvelle rédaction. Il ne reste presque rien du rapport primitif. » M. d’Harcourt relate ce fait comme une preuve de l’impossibilité où l’on est d’établir la vérité sur l’événement le plus saisissant, le mieux observé. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-4"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-4"
  "translation_ja": "ただ一つの戦闘についてでも、事が正確にどのように進んだかを私たちは知っているだろうか。私は大いに疑う。だれが勝ち、だれが負けたかは分かる。だがおそらく、それ以上は何も分からない。自ら戦い、かつ目撃したアルクール氏がソルフェリーノの戦闘について伝えたことは、あらゆる戦闘にあてはまろう。「将軍たちは（むろん何百という証言をもとに事情を知って）公式の報告を送る。命令を伝達する任にある士官たちがこの書類に手を入れ、最終案を作る。参謀長はそれに異を唱え、いちから作り直す。元帥のところへ持ってゆくと、『まるで違っているぞ！』と叫び、また別の文面に差し替える。最初の報告はほとんど何も残らない」。アルクール氏はこの事実を、いかに人目を引き、いかによく観察された出来事でも、それについて真実を確定することは不可能である証拠として挙げている。"
  "translation_status": "reviewed"
- "id": "b1c2-034"
  "source_text": "De tels faits nous montrent ce que valent les témoignages des foules. Les traités de logique font rentrer l’unanimité de nombreux témoins dans la catégorie des preuves les plus solides qu’on puisse invoquer pour prouver l’exactitude d’un fait. Mais ce que nous savons de la psychologie des foules montre que les traités de logique sont à refaire entièrement sur ce point. Les événements les plus douteux sont certainement ceux qui ont été observés par le plus grand nombre de personnes. Dire qu’un fait a été simultanément constaté par des milliers de témoins, c’est dire le plus souvent que le fait réel est fort différent du récit adopté."
  "translation_ja": "このような事実を見れば、群衆の証言の値打ちが分かる。論理学の教科書は、多くの証人の意見の一致を、ある事実が確かであることを証明するのに使えるもっとも堅固な証拠の部類に入れる。だが群衆の心理について分かってきたことは、この点について論理学の教科書を根本から書き換えねばならないことを示している。もっとも疑わしい出来事とは、まちがいなく、もっとも多くの人々が見た出来事なのだ。数千人の証人が同時にある事実を確かめたと言うことは、たいてい、本当の事実が、採用された物語とは大いに異なると言うに等しい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

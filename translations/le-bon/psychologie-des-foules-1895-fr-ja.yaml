- "id": "b3c3-011"
  "source_text": "Agir sur les sentiments des jurés, et, comme avec toutes les foules, raisonner fort peu, ou n’employer que des formes rudimentaires de raisonnement, doit être la préoccupation de tout bon avocat. Un avocat anglais célèbre par ses succès en cour d’assises a bien montré la façon d’agir."
  "translation_ja": "陪審員の感情に働きかけ、どの群衆に対してもそうであるように、理屈はごくわずかにするか、使うとしても単純きわまる形の推論にとどめること。どんなよい弁護士にも、これが心に掛けておくべきことである。重罪院での成功で有名なイギリスのある弁護士が、その振る舞い方をよく示している。"
  "source_languages":
  - "fr"

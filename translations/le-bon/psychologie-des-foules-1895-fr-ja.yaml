  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-031"
  "source_text": "De ces causes diverses est résulté un phénomène très nouveau dans l’histoire du monde, et tout à fait caractéristique de l’âge actuel, je veux parler de l’impuissance des gouvernements à diriger l’opinion."
  "translation_ja": "こうしたさまざまな原因から、世界の歴史上たいそう新しく、現代をよく特徴づける現象が起きた。私が言いたいのは、政府に世論を導く力がなくなったことである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 395
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[403]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-032"
  "source_text": "Jadis, et ce jadis n’est pas fort loin, l’action des gouvernements, l’influence de quelques écrivains et d’un tout petit nombre de journaux constituaient les vrais régulateurs de l’opinion. Aujourd’hui, les écrivains ont perdu toute influence, et les journaux ne font plus que refléter l’opinion. Quant aux hommes d’État, loin de la diriger, ils ne cherchent qu’à la suivre. Ils ont une crainte de l’opinion qui va parfois jusqu’à la terreur et ôte toute fixité à leur ligne de conduite."
  "translation_ja": "かつて、しかもそれはさして遠い昔ではないが、世論を実際に調整するものは、政府の働き、幾人かの作家の影響、そしてごく少数の新聞だった。今日では作家はあらゆる影響力を失い、新聞はただ世論を映すだけになった。政治家たちはといえば、世論を導くどころか、それについてゆくことだけを求めている。世論をおそれる心は時に恐怖にまで達し、彼らの行動方針からあらゆる一貫性を奪う。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 396
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[404]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-033"
  "source_text": "L’opinion des foules tend donc à devenir de plus en plus le révélateur suprême de la politique. Elle arrive aujourd’hui à imposer des alliances, comme nous l’avons vu récemment pour l’alliance russe, exclusivement sortie d’un mouvement populaire. C’est un symptôme bien curieux de voir de nos jours papes, rois et empereurs, se soumettre au mécanisme de l’interview, pour exposer leur pensée, sur un sujet donné, au jugement des foules. On a pu dire jadis que la politique n’était pas chose de sentiment. Pourrait-on le dire encore aujourd’hui où elle a de plus en plus pour guide les impulsions de foules mobiles qui ne connaissent pas la raison, et que le sentiment seul peut guider ?"
  "translation_ja": "だから群衆の意見は、政治のゆくえを何よりも決定的に明かすものに、ますます近づいている。今日では同盟を押しつけるまでになった。つい最近の対ロシア同盟は民衆の動きだけから生じたが、その例である。教皇も国王も皇帝も、インタビューという仕組みに身をゆだね、ある主題についての自分の考えを群衆の判断にさらすに至ったのは、今の世のまことに奇妙な兆候だ。かつては、政治は感情の問題ではないと言えた。ますます、理性を知らず、感情しかその導き手たりえない移り気な群衆の衝動に導かれるようになった今日でも、なおそう言えようか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 397
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[405]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-034"
  "source_text": "Quant à la presse, autrefois directrice de l’opinion, elle a dû, comme les gouvernements, s’effacer devant le pouvoir des foules. Elle possède certes une puissance considérable, mais seulement parce qu’elle est exclusivement le reflet des opinions des foules et de leurs incessantes variations. Devenue simple agence d’information, elle a renoncé à chercher à imposer aucune idée, aucune doctrine. Elle suit tous les changements de la pensée publique, et les nécessités de la concurrence l’obligent à bien les suivre sous peine de perdre ses lecteurs. Les vieux organes solennels et influents d’autrefois, comme le Constitutionnel, les Débats, le Siècle, dont la précédente génération écoutait pieusement les oracles, ont disparu ou sont devenus feuilles d’informations encadrées de chroniques amusantes, de cancans mondains et de réclames financières. Où serait aujourd’hui le journal assez riche pour permettre à ses rédacteurs des opinions personnelles, et de quel poids seraient ces opinions auprès de lecteurs qui ne demandent qu’à être renseignés ou amusés, et qui, derrière chaque recommandation, redoutent toujours le spéculateur. La critique n’a même plus le pouvoir de lancer un livre ou une pièce de théâtre. Elle peut leur nuire, mais non les servir. Les journaux ont tellement conscience de l’inutilité de tout ce qui est critique ou opinion personnelle, qu’ils ont progressivement supprimé les critiques littéraires, se bornant à donner le titre du livre avec deux ou trois lignes de réclame, et, dans vingt ans, il en sera probablement de même pour la critique théâtrale."
  "translation_ja": "かつて世論を率いた新聞も、政府同様、群衆の権力の前に身を引かねばならなかった。もちろんその力は大きいのだが、それはもっぱら群衆の意見とその絶え間のない変転とを映すからにすぎない。単なる通信機関となり、何かの思想や教説を押し通そうとするのをやめてしまった。世間の考え方のどんな変化にもついてゆき、競争の必要上、読者を失いたくなければ、しっかりついてゆくしかない。一世代前には神託のようにうやうやしく聞かれた『コンスティテュショネル』、『デバ』、『シエクル』といった、重みと影響力のあった旧紙は、消えたか、愉快なコラムや社交界の噂、金融広告で取り巻かれたニュース紙になった。今では編集者に自分の意見を許せるほど裕福な新聞がどこにあるだろう。また、知らせか娯楽しか求めず、何かを薦められればその背後に投機家をみることをつねに恐れている読者にとって、その意見にどんな重みがあろう。批評にはもはや、一冊の本や一つの芝居を世に押し出す力すらない。傷をつけることはできても、役立つことはできない。新聞は批評や個人の見解がいかにむなしいかをあまりによく心得て、文学評を少しずつ廃し、本の題名のあと二、三行の宣伝を載せるだけになった。二十年もたてば劇評もおそらく同じになるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

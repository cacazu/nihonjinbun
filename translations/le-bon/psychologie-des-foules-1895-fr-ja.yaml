- "id": "b1c3-011"
  "source_text": "Ce n’est pas là un phénomène spécial aux foules ; on l’observe chez beaucoup d’individus isolés, non seulement parmi les êtres primitifs, mais chez tous ceux qui par un côté quelconque de leur esprit, — les sectateurs d’une foi religieuse intense par exemple, — se rapprochent des primitifs. Je l’ai observé à un degré curieux chez des Hindous lettrés, élevés dans nos universités européennes, et ayant obtenu tous les diplômes. Sur leur fonds immuable d’idées religieuses ou sociales héréditaires s’était superposé, sans nullement les altérer, un fonds d’idées occidentales sans parenté avec les premières. Suivant les hasards du moment, les unes ou les autres apparaissaient avec leur cortège spécial d’actes ou de discours, et le même individu présentait ainsi les contradictions les plus flagrantes. Contradictions, d’ailleurs, plus apparentes que réelles, car les idées héréditaires seules sont assez puissantes chez l’individu isolé pour devenir des mobiles de conduite. C’est seulement lorsque, par des croisements, l’homme se trouve entre les impulsions d’hérédités différentes, que les actes peuvent être réellement d’un moment à l’autre tout à fait contradictoires. Il serait inutile d’insister ici sur ces phénomènes, bien que leur importance psychologique soit capitale. Je considère qu’il faut au moins dix ans de voyages et d’observations pour arriver à les comprendre."
  "translation_ja": "これは群衆だけの現象ではない。一人でいる個人にも多く見られる。原始の人々の間ばかりではなく、強い信仰の信徒など、心のどこかの面で原始の人々に似ている者すべてに見られる。私がこれを不思議なほどはっきり認めたのは、ヨーロッパの大学で教育を受け、学位もひととおり手にしたインドの知識人たちにおいてだった。彼らの内には、受け継がれてきた宗教的あるいは社会的な思想の変わることのない地があり、その上に、それと何の縁もない西洋思想の層が、下の地を少しも変えずに重なっていた。その時々の成り行きで一方が、あるいは他方が、それぞれに特有の行いや言葉を従えて現れ、こうして同じ一人の人間がもっとも目立つ矛盾を示した。もっともその矛盾は、実質的というより見かけのものだ。単独の個人にあって行いの動機となるほど強いのは、受け継がれた思想だけだからだ。異なる血統の交わりによって、人がいくつもの遺伝に由来する異なる衝動の間に置かれるときにだけ、この瞬間の行いが次の瞬間の行いと、本当にまったく矛盾することがありうる。心理学のうえでじつに重要なこれらの現象についても、ここで言いつのるのは無用だろう。理解に至るには少なくとも十年の旅と観察が必要だと私は考えている。"
  "source_languages":
  - "fr"

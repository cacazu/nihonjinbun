- "id": "b1c3-010"
  "source_text": "Quelles que soient les idées suggérées aux foules, elles ne peuvent devenir dominantes qu’à la condition de revêtir une forme très absolue et très simple. Elles se présentent alors sous l’aspect d’images, et ne sont accessibles aux masses que sous cette forme. Ces idées-images ne sont rattachées entre elles par aucun lien logique d’analogie ou de succession, et peuvent se substituer l’une à l’autre comme les verres de la lanterne magique que l’opérateur retire de la boîte où ils étaient superposés. Et c’est pourquoi on peut voir dans les foules se maintenir côte à côte les idées les plus contradictoires. Suivant les hasards du moment, la foule sera placée sous l’influence de l’une des idées diverses emmagasinées dans son entendement, et pourra par conséquent commettre les actes les plus dissemblables. Son absence complète d’esprit critique ne lui permet pas d’en percevoir les contradictions."
  "translation_ja": "どんな思想であれ、群衆に暗示されて、それが支配的になるには、極度に断定的で単純な形を取る必要がある。そのとき思想は像という姿で現れ、大衆がそれを捉えられるのはただその形においてである。この像としての思想どうしには、類似や順序の論理的なつながりなどない。だから、それらの思想は互いに取って代われる。ちょうど幻灯機を扱う者が、ガラス絵を重ねてしまった箱から一枚ずつ抜き出し、取り替えるように。群衆のなかで、もっとも矛盾し合う思想が隣り合って存続するのを見られるのは、このためだ。その場の成り行きで、群衆は心に蓄えているさまざまな思想の一つに影響されることになり、したがってまるで似ても似つかない行為をしうる。批判精神をまったく欠くため、そこにある矛盾にも気づけない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

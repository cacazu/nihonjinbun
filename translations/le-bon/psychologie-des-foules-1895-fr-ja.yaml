- "id": "b1c2-031"
  "source_text": "« L’enfant fut reconnu par un autre enfant — qui se trompait. La série des reconnaissances inexactes se déroula alors. Et l’on vit une chose très extraordinaire. Le lendemain du jour où un écolier l’avait reconnu, une femme s’écria : « Ah ! mon Dieu, c’est mon enfant. » On l’introduit près du cadavre, elle examine les effets, constate une cicatrice au front. « C’est bien, dit-elle, mon pauvre fils, perdu depuis juillet dernier. On me l’aura volé et on me l’a tué ! » La femme était concierge rue du Four et se nommait Chavandret. On fit venir son beau-frère qui, sans hésitation, dit : « Voilà le petit Philibert. » Plusieurs habitants de la rue reconnurent Philibert Chavandret dans l’enfant de la Villette, sans compter son propre maître d’école pour qui la médaille était un indice. Eh bien, les voisins, le beau-frère, le maître d’école et la mère se trompaient. Six semaines plus tard, l’identité de l’enfant fut établie. C’était un enfant de Bordeaux, tué à Bordeaux et, par les messageries, apporté à Paris[3]."
  "translation_ja": "「その子を見知っていると言い出したのは別の子どもだった。だが人違いだった。それから、まちがった身元確認が次々と続いた。そしてじつに異様なことが起きた。ある男子生徒がその子を知っていると言った翌日、一人の女が叫んだ。『まあ、神様、うちの子です』。遺体のそばに案内されると、女は持ち物を調べ、額の傷痕を見た。『やっぱり、去年の七月から行方が分からなかった、かわいそうなうちの子です。だれかがさらって殺したんだわ！』。女はフール街の門番で、シャヴァンドレという名だった。その義兄弟に来てもらうと、ためらいもせず『フィリベールじゃないか』と言った。通りの住人の何人もが、ラ・ヴィレットで見つかったその子をフィリベール・シャヴァンドレだと認めた。メダルを手がかりにした当の子の学校の先生までそう言った。ところが、近所の人々も、義兄弟も、学校の先生も、母親も間違っていた。六週間後、その子の身元は確定した。ボルドーの子どもで、ボルドーで殺され、運送便でパリに運ばれたのだった」［3］。"
  "source_languages":
  - "fr"
  "source_locations":

- "id": "b1c1-027"
  "source_text": "Tel est à peu près aussi l’état de l’individu faisant partie d’une foule psychologique. Il n’est plus conscient de ses actes. Chez lui, comme chez l’hypnotisé, en même temps que certaines facultés sont détruites, d’autres peuvent être amenées à un degré d’exaltation extrême. Sous l’influence d’une suggestion, il se lancera avec une irrésistible impétuosité vers l’accomplissement de certains actes. Impétuosité plus irrésistible encore dans les foules que chez le sujet hypnotisé, parce que la suggestion étant la même pour tous les individus s’exagère en devenant réciproque. Les individualités qui, dans la foule, posséderaient une personnalité assez forte pour résister à la suggestion, sont en nombre trop faible pour lutter contre le courant. Tout au plus elles pourront tenter une diversion par une suggestion différente. C’est ainsi, par exemple, qu’un mot heureux, une image évoquée à propos ont parfois détourné les foules des actes les plus sanguinaires."
  "translation_ja": "心理的群衆の一部となった個人の状態も、おおむねこれに似ている。もはや自分がしていることを意識しない。催眠を受けた者と同じく、ある能力が失われる一方、ほかの能力は極度の興奮にまで高まりうる。一つの暗示を受けると、抗いがたい勢いである行動の実現へと突き進む。その勢いは催眠を受けた一人の場合にさえまして抗いがたい。すべての人が同じ暗示を受け、それを互いに及ぼし合うことで、暗示はいよいよ強くなるからだ。群衆のなかで、暗示に逆らえるほどの強い個性を備えた者は、流れに抗するには数が少なすぎる。せいぜい別の暗示を与えて、流れをそらそうとするくらいである。たとえば、うまい一言や、時を得て呼び起こされた一つの心像によって、群衆がこのうえなく血なまぐさい行いを思いとどまったことがあるのは、このためだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 101
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[103]"
  "section_id": "b1c1"

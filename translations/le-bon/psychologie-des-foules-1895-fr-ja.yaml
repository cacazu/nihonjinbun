- "id": "b2c1-043"
  "source_text": "Cette instruction professionnelle que tous les esprits éclairés réclament maintenant fut celle qu’ont jadis reçue nos pères, et que les peuples qui dominent aujourd’hui le monde par leur volonté, leur initiative, leur esprit d’entreprise ont su conserver. Dans des pages remarquables, dont je reproduirai plus loin les parties les plus essentielles, un grand penseur, M. Taine, a montré nettement que notre éducation d’autrefois était à peu près ce qu’est l’éducation anglaise ou américaine d’aujourd’hui, et, dans un remarquable parallèle entre le système latin et le système anglo-saxon, il a fait voir clairement les conséquences des deux méthodes."
  "translation_ja": "ものの分かる人々がいま一様に求めているこの職業教育は、かつて私たちの父祖が受けていたものであり、また今日、その意志と自発性と企業心によって世界を支配している諸民族が、守りつづけてきたものだ。後でそのもっとも肝心なところを引くが、偉大な思想家テーヌ氏は実に優れた数ページで、私たちの国の昔の教育が、今日のイギリスやアメリカの教育とほぼ同じだったことを明らかに示した。ラテン式とアングロサクソン式をみごとに対比して、両方の方法がもたらす結果をはっきりと見せたのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

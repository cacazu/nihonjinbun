- "id": "b1c2-015"
  "source_text": "§ 2. — SUGGESTIBILITÉ ET CRÉDULITÉ DES FOULES"
  "translation_ja": "第二節　群衆の暗示の受けやすさと信じやすさ"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 121

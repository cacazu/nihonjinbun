- "id": "b2c4-019"
  "source_text": "L’absurdité philosophique que présentent souvent les croyances générales n’a jamais été un obstacle à leur triomphe. Ce triomphe ne semble même possible qu’à la condition qu’elles renferment quelque mystérieuse absurdité. Ce n’est donc pas l’évidente faiblesse des croyances socialistes actuelles qui les empêchera de triompher dans l’âme des foules. Leur véritable infériorité par rapport à toutes les croyances religieuses tient uniquement à ceci : l’idéal de bonheur que promettaient ces dernières ne devant être réalisé que dans une vie future, personne ne pouvait contester cette réalisation. L’idéal de bonheur socialiste devant être réalisé sur terre, dès les premières tentatives de réalisation, la vanité des promesses apparaîtra aussitôt, et la croyance nouvelle perdra du même coup tout prestige. Sa puissance ne grandira donc que jusqu’au jour où, ayant triomphé, la réalisation pratique commencera. Et c’est pourquoi, si la religion nouvelle exerce d’abord, comme toutes celles qui l’ont précédée, un rôle destructeur, elle ne saurait exercer ensuite, comme elles, un rôle créateur."
  "translation_ja": "一般的な信念がたびたび示す哲学的な不合理さは、その勝利の妨げになったためしがない。むしろ何らかの神秘的な不合理を含んでいることが、勝利を可能にする条件のようにさえ見える。だから今の社会主義の信念に弱いところが明白でも、それが群衆の魂に勝利する妨げにはならない。あらゆる宗教的信仰と比べたときの真の弱点は、ただ次のことにある。従来の宗教の約束した幸福の理想が実現するのは来世だけだから、その実現に異を唱えうる人はいなかった。ところが社会主義の幸福の理想は地上で実現することになっているから、実現に向けた最初の試みから、約束の空しさがすぐに明らかになり、新しい信念はそれと同時にあらゆる威信を失う。その力が増すのはしたがって、勝利して、実現の作業が始まる日までに限られる。このため、その新しい宗教は、先行するすべての宗教と同じく、最初は破壊の役割を演じるにしても、それらと同じように後で創造の役割を演じることはできないのである。"
  "source_languages":

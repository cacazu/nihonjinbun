- "id": "b2c1-049"
  "source_text": "« À l’hôpital, dans la mine, dans la manufacture, chez l’architecte, chez l’homme de loi, l’élève, admis très jeune, fait son apprentissage et son stage, à peu près comme chez nous un clerc dans son étude ou un rapin dans son atelier. Au préalable et avant d’entrer, il a pu suivre quelque cours général et sommaire, afin d’avoir un cadre tout prêt pour y loger les observations que tout à l’heure il va faire. Cependant, à sa portée, il y a, le plus souvent, quelques cours techniques qu’il pourra suivre à ses heures libres, afin de coordonner au fur et à mesure les expériences quotidiennes qu’il fait. Sous un pareil régime, la capacité pratique croit et se développe d’elle-même, juste au degré que comportent les facultés de l’élève, et dans la direction requise par sa besogne future par l’œuvre spéciale à laquelle dès à présent il veut s’adapter. De cette façon, en Angleterre et aux États-Unis, le jeune homme parvient vite à tirer de lui-même tout ce qu’il contient. Dès vingt-cinq ans, et bien plus tôt, si la substance et le fonds ne lui manquent pas, il est, non seulement un exécutant utile, mais encore un entrepreneur spontané, non seulement un rouage, mais de plus un moteur, – En France, où le procédé inverse a prévalu et, à chaque génération, devient plus chinois, le total des forces perdues est énorme. »"
  "translation_ja": "「病院でも、鉱山でも、製造所でも、建築家や法律家のもとでも、生徒はごく若くして受け入れられ、見習いをし、実地修業をする。わが国で書記見習いが事務所で、画学生がアトリエで働くのと、ほぼ同じである。入る前に、これから間もなくする観察を収める枠組みをあらかじめ得るために、なんらかの概括的で簡単な講義を受けておくこともできる。その一方、たいてい手の届くところに専門の講義もいくつかあり、暇な時間に出席して、日々積んでゆく経験をそのつど整理できる。このような制度の下では、実務の能力はおのずと育って伸び、生徒の素質にちょうど見合った程度まで、しかも将来の仕事、すでにこの時点で身を合わせようとしている個別の仕事が求める方向に伸びる。こうしてイギリスと合衆国では、若者はすぐに自分が内に持っているものすべてを自力で引き出すようになる。二十五歳には、資質と地力に恵まれていればもっと早く、有用な実行者にとどまらずみずから事を起こす者、歯車にとどまらず動力そのものになる。逆の方法が支配し、世代ごとにますます中国風になるフランスでは、失われる力の総量は途方もなく大きい」。"

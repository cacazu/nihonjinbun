  "translation_status": "reviewed"
- "id": "b2c2-024"
  "source_text": "Avec tous ses progrès la philosophie n’a pu encore offrir aux foules aucun idéal qui les puisse charmer ; mais, comme il leur faut des illusions à tout prix, elles se dirigent d’instinct, comme l’insecte allant à la lumière, vers les rhéteurs qui leur en présentent. Le grand facteur de l’évolution des peuples n’a jamais été la vérité, mais bien l’erreur. Et si le socialisme est si puissant aujourd’hui, c’est qu’il constitue la seule illusion qui soit vivante encore. Malgré toutes les démonstrations scientifiques, il continue à grandir. Sa principale force est d’être défendu par des esprits ignorant assez les réalités des choses pour oser promettre hardiment à l’homme le bonheur. L’illusion sociale règne aujourd’hui sur toutes les ruines amoncelées du passé, et l’avenir lui appartient. Les foules n’ont jamais eu soif de vérités. Devant les évidences qui leur déplaisent, elles se détournent, préférant déifier l’erreur, si l’erreur les séduit. Qui sait les illusionner est aisément leur maître ; qui tente de les désillusionner est toujours leur victime."
  "translation_ja": "いくら進歩しても、哲学はいまだに群衆を魅了できるような理想をひとつも差し出せずにいる。だが群衆はどうしても幻想を必要とするから、光へ飛ぶ虫のように、本能的にそれを差し出す雄弁家のほうに向かう。諸民族の進化の大きな要因だったのは、けっして真理ではなく誤りである。今日、社会主義がこれほど強いのは、なお生きている唯一の幻想だからだ。科学的な論証がいくらなされても、それは大きくなりつづける。その最大の力は、人間に大胆にも幸福を約束できるほど現実を知らない人々が、それを擁護していることにある。今日、過去の積み重なる廃墟の上に君臨するのは社会についての幻想であり、未来はその幻想のものだ。群衆が真理に渇いたことは一度もない。気に入らない明白な事実を前にすると顔を背け、誤りが魅惑的なら、むしろそれを神として祭り上げる。幻想を抱かせるすべを知る者はたやすく群衆の主人となる。それを覚まそうとする者は、いつもその犠牲者となる。"

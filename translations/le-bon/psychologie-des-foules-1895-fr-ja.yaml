- "id": "b2c3-020"
  "source_text": "Lorsqu’on voudra montrer ce que peut la seule volonté, il n’y aura qu’à présenter dans ses détails l’histoire des difficultés qu’il fallut surmonter pour creuser le canal de Suez. Un témoin oculaire, le docteur Cazalis, a résumé en quelques lignes saisissantes la synthèse de cette grande œuvre racontée par son immortel auteur. « Et il contait, de jour en jour, par épisodes, l’épopée du canal. Il contait tout ce qu’il avait dû vaincre, tout l’impossible qu’il avait fait possible, toutes les résistances, les coalitions contre lui, et les déboires, les revers, les défaites, mais qui n’avaient pu jamais le décourager, ni l’abattre ; il rappelait l’Angleterre le combattant, l’attaquant sans relâche, et l’Égypte et la France hésitantes, et le consul de France s’opposant plus que tout autre aux premiers travaux, et comme on lui résistait, prenant les ouvriers par la soif, leur faisant refuser l’eau douce ; et le ministère de la marine et les ingénieurs, tous les hommes sérieux, d’expérience et de science, tous naturellement hostiles, et tous scientifiquement assurés du désastre, le calculant et le promettant, comme pour tel jour ou telle heure on promet l’éclipse. »"
  "translation_ja": "意志一つでどこまでできるかを示そうとする人は、スエズ運河を掘るために乗り越えねばならなかった難題の歴史を、細部にわたって示せばよい。目撃者であるカザリス博士が、この大事業の全貌を、その不朽の作者の語ったままに、鮮やかな数行にまとめている。「そうして彼は日を重ね、挿話を重ね、運河の叙事詩を物語った。勝ち越えねばならなかったものすべて、不可能だったのを可能に変えたものすべて、あらゆる抵抗と反対の連合と、失望、逆境、敗北を語った。そのどれも、けっして彼を落胆させず、打ちのめしもしなかった。イギリスが敵対して休みなく攻撃したこと、エジプトとフランスがためらったこと、何にもましてフランス領事が初期の工事に反対し、労働者に飲み水を与えさせず、渇きで彼らを苦しめたことを思い起こした。それに海軍省と技師たち。まじめで、経験も科学の知識もあるあらゆる人々が、そろって当然のように反対し、科学のうえで破滅は確実と考え、その破滅を計算して予告した。まるで何月何日の何時に日食があると言い切るかのように」。"
  "source_languages":

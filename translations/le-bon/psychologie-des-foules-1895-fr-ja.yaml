- "id": "b2c1-046"
  "source_text": "« Les idées ne se forment que dans leur milieu naturel et normal ; ce qui fait végéter leur germe, ce sont les innombrables impressions sensibles que le jeune homme reçoit tous les jours à l’atelier, dans la mine, au tribunal, à l’étude, sur le chantier, à l’hôpital, au spectacle des outils, des matériaux et des opérations, en présence des clients, des ouvriers, du travail, de l’ouvrage bien ou mal fait, dispendieux ou lucratif : voilà les petites perceptions particulières des yeux, de l’oreille, des mains et même de l’odorat, qui, involontairement recueillies et sourdement élaborées, s’organisent en lui pour lui suggérer tôt ou tard telle combinaison nouvelle, simplification, économie, perfectionnement ou invention. De tous ces contacts précieux, de tous ces éléments assimilables et indispensables, le jeune Français est privé, et justement pendant l’âge fécond ; sept ou huit années durant, il est séquestré dans une école, loin de l’expérience directe et personnelle qui lui aurait donné la notion exacte et vive des choses, des hommes et des diverses façons de les manier."
  "translation_ja": "「観念というものは、それにとって自然で、ふつうの環境のなかでしか形を取らない。その芽を伸ばすのは、若い人が工場で、鉱山で、法廷で、事務所で、工事場で、病院で、道具と材料と作業の様子を見、顧客と職人と仕事に接し、上手にできたものも下手なものも、費用がかさんだものも利益を上げたものも目にしながら、日々受け取る数かぎりない感覚の印象である。目や耳や手、さらには鼻から入るこうした小さな個々の知覚が、知らぬ間に集められ、ひそかに練られ、その人のうちでひとつに組み上がる。そして遅かれ早かれ、何か新しい組み合わせ、簡略化、節約、改良、あるいは発明を思いつかせる。フランスの青年は、こうした貴重な接触すべて、取り込むことができ、しかも欠くことのできないこうした要素すべてから切り離されている。しかももっとも実り多い年頃にである。七年も八年もの間、学校に閉じ込められ、物についても、人間についても、そのさまざまな扱い方についても、正確で生き生きした理解を与えてくれたはずの、自分自身の直接の経験から遠く離れている。"

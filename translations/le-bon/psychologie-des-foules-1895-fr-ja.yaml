- "id": "b1c1-009"
  "source_text": "Lorsqu’une foule psychologique est constituée, elle acquiert des caractères généraux provisoires, mais déterminables. À ces caractères généraux s’ajoutent des caractères particuliers, variables, suivant les éléments dont la foule se compose et qui peuvent en modifier la constitution mentale."
  "translation_ja": "心理的群衆がいったん形を取ると、一時的であってもはっきり捉えられる、いくつかの一般的な性質を持つようになる。それに加わるのが、群衆を構成する要素に応じて変わり、その心のつくりを変えうる、個別の性質である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 83
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[85]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-010"
  "source_text": "Les foules psychologiques sont donc susceptibles d’une classification, et, lorsque nous arriverons à nous occuper de cette classification, nous verrons qu’une foule hétérogène, c’est-à-dire composée d’éléments dissemblables, présente avec les foules homogènes, c’est-à-dire composées d’éléments plus ou moins semblables (sectes, castes et classes), des caractères communs, et, à côté de ces caractères communs, des particularités qui permettent de l’en différencier."
  "translation_ja": "だから心理的群衆は分類できる。その分類に取りかかるところで見るように、異質な群衆、すなわち相似ていない要素から成る群衆は、同質な群衆、すなわち互いに多少とも似通った要素から成る群衆（宗派、カースト、階級）とのあいだに、共通する性質と、それとは別に区別の手がかりとなる独自の性質とをあわせ持つ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 84
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[86]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-011"
  "source_text": "Mais avant de nous occuper des diverses catégories de foules, nous devons examiner d’abord les caractères communs à toutes. Nous opérerons comme le naturaliste, qui commence par décrire les caractères généraux communs à tous les individus d’une famille avant de s’occuper des caractères particuliers qui permettent de différencier les genres et les espèces que renferme cette famille."
  "translation_ja": "だが群衆の各種について論ずる前に、まずすべての群衆に共通する性質を見ておく必要がある。博物学者が、一つの科に含まれる属や種を区別する個々の特徴にとりかかる前に、その科のすべての個体に共通する一般的な特徴から書き始めるのと同じように進めよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 85
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[87]"
  "section_id": "b1c1"

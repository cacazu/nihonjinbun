- "id": "b2c2-021"
  "source_text": "Depuis l’aurore des civilisations les foules ont toujours subi l’influence des illusions. C’est aux créateurs d’illusions qu’elles ont élevé le plus de temples, de statues et d’autels. Illusions religieuses jadis, illusions philosophiques et sociales aujourd’hui, on retrouve toujours ces formidables souveraines à la tête de toutes les civilisations qui ont successivement fleuri sur notre planète. C’est en leur nom que se sont édifiés les temples de la Chaldée et de l’Égypte, les édifices religieux du moyen âge, que l’Europe entière a été bouleversée il y a un siècle, et il n’est pas une seule de nos conceptions artistiques, politiques ou sociales qui ne porte leur puissante empreinte. L’homme les renverse parfois, au prix de bouleversements effroyables, mais il semble condamné à les relever toujours. Sans elles il n’aurait pu sortir de la barbarie primitive, et sans elles encore il y retomberait bientôt. Ce sont des ombres vaines, sans doute ; mais ces filles de nos rêves ont obligé les peuples à créer tout ce qui fait la splendeur des arts et la grandeur des civilisations."
  "translation_ja": "文明の夜明け以来、群衆はつねに幻想の力を受けてきた。群衆がもっとも多くの神殿や像や祭壇を建てて捧げたのは、幻想の創造者たちに対してである。昔は宗教的な幻想、今日では哲学や社会の幻想。地球上で次々に花開いたすべての文明の先頭には、いつもこの畏るべき支配者たちがいる。その名のもとにカルデアとエジプトの神殿や中世の宗教建築が築かれ、一世紀前にはヨーロッパ全土が揺り動かされた。芸術、政治、社会について私たちが抱く構想で、その力強い刻印を帯びていないものはひとつもない。人はときに恐ろしい動乱を代価にそれらを打ち倒す。だがいつもまたそれを立て直す運命のようである。幻想なしには太古の野蛮から抜け出すことはできなかったはずだし、幻想がなければまたすぐそこに逆戻りするだろう。たしかにそれは実体のない影だ。だが私たちの夢から生まれたこの娘たちこそが、芸術の輝きと文明の偉大さをなすすべてを、諸民族につくらずにはおかなかったのである。"

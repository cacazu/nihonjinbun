  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-018"
  "source_text": "Pour arriver à entrevoir au moins ces causes, il faut se rappeler d’abord cette constatation de la psychologie moderne : à savoir que ce n’est pas seulement dans la vie organique, mais encore dans le fonctionnement de l’intelligence que les phénomènes inconscients jouent un rôle tout à fait prépondérant. La vie consciente de l’esprit ne représente qu’une bien faible part auprès de sa vie inconsciente. L’analyste le plus subtil, l’observateur le plus pénétrant n’arrive guère à découvrir qu’un bien petit nombre des mobiles inconscients qui le mènent. Nos actes conscients dérivent d’un substratum inconscient créé surtout par des influences d’hérédité. Ce substratum renferme les innombrables résidus ancestraux qui constituent l’âme de la race. Derrière les causes avouées de nos actes, il y a sans doute les causes secrètes que nous n’avouons pas, mais derrière ces causes secrètes il y en a de beaucoup plus secrètes encore, puisque nous-mêmes les ignorons. La plupart de nos actions journalières ne sont que l’effet de mobiles cachés qui nous échappent."
  "translation_ja": "せめてその原因の輪郭だけでも見きわめるには、まず近代心理学の見いだした次の事実を思い起こす必要がある。無意識の現象が圧倒的に大きな役割を演じているのは、生体の営みにおいてばかりではない。知性の働きにおいてもそうなのだ。心の意識ある生活は、その無意識の生活と比べるなら、ほんのわずかな一部でしかない。どれほど精妙に分析する人でも、どれほど鋭く観察する人でも、自分を導いている無意識の動機のほんのわずかしか突き止められない。私たちの意識ある行為は、おもに遺伝の影響でつくられた無意識の基層から派生する。この基層には、人種の魂をなす、祖先の残した無数のものが含まれている。行為の理由として公言するものの背後には、もちろん口にしない隠れた理由がある。だがその裏には、自分でも知らないだけに、はるかに奥深く隠された理由がある。私たちの日頃の行いのほとんどは、つかむことのできない隠れた動機の結果にすぎない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 92

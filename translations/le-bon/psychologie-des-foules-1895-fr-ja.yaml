- "id": "b1c3-009"
  "source_text": "De nos jours, les grandes idées fondamentales dont ont vécu nos pères sont de plus en plus chancelantes. Elles ont perdu toute solidité, et, du même coup, les institutions qui reposaient sur elles se sont trouvées profondément ébranlées. Il se forme journellement beaucoup de ces petites idées transitoires dont je parlais à l’instant ; mais très peu d’entre elles paraissent visiblement grandir et devoir acquérir une influence prépondérante."
  "translation_ja": "今日、私たちの父祖がよりどころにして生きてきた大きな根本思想は、ますますぐらついている。すっかり確かさを失ったため、その上に立っていた制度も同時に深く揺さぶられた。いま触れたような小さなつかの間の思想は日ごとにたくさん生じるが、目に見えて成長し、他をしのぐ影響力を持つようになりそうなものは、ごくわずかしかない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 178
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[178]"

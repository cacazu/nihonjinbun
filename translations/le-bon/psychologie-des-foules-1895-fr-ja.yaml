  "translation_status": "reviewed"
- "id": "b3c5-045"
  "source_text": "« Ils approuvent et décrètent, dit Taine, ce dont ils ont horreur, non seulement les sottises et les folies, mais les crimes, le meurtre des innocents, le meurtre de leur amis. À l’unanimité et avec les plus vifs applaudissements, la gauche, réunie à la droite, envoie à l’échafaud Danton, son chef naturel, le grand promoteur et conducteur de la Révolution. À l’unanimité et avec les plus grands applaudissements, la droite, réunie à la gauche, vote les pires décrets du gouvernement révolutionnaire. À l’unanimité, et avec des cris d’admiration et d’enthousiasme, avec des témoignages de sympathie passionnée pour Collot d’Herbois, pour Couthon et pour Robespierre, la Convention, par des réélections spontanées et multiples, maintient en place le gouvernement homicide que la Plaine déteste parce qu’il est homicide, et que la Montagne déteste parce qu’il la décime. Plaine et Montagne, la majorité et la minorité finissent par consentir à aider à leur propre suicide. Le 22 prairial, la Convention tout entière a tendu la gorge ; le 8 thermidor, pendant le premier quart d’heure qui a suivi le discours de Robespierre, elle l’a tendue encore. »"
  "translation_ja": "「彼らは」とテーヌは言う。「自分が忌み嫌うものを承認し、法令にする。愚行や狂気の沙汰だけではない。犯罪を、罪のない者を殺すことを、友を殺すことを、である。左派は右派と一緒になり、満場一致のうち、大喝采とともに、おのずと自分たちの頭に立ってきた人物、革命の大いなる推進者にして指導者ダントンを処刑台に送る。右派は左派と一緒になり、満場一致のうち、割れんばかりの拍手とともに、革命政府の最悪の法令に賛成する。国民公会は満場一致で、感嘆と熱狂の叫びをあげ、コロー・デルボワ、クートン、ロベスピエールに熱烈な共感を示し、自ら進んで再選に再選を重ね、人殺しの政府をその座に据え置く。平原派はその政府が人殺しであるがゆえに憎み、山岳派は自分たちを次々粛清するがゆえに憎んでいるというのに。平原派も山岳派も、多数派も少数派も、しまいには自分たちの自殺に手を貸すことに同意する。牧月二十二日、国民公会は全員でその喉を差し出した。熱月八日、ロベスピエールの演説直後の十五分間に、再び差し出した。」"

  "translation_status": "reviewed"
- "id": "b1c2-014"
  "source_text": "Dans l’irritabilité des foules, dans leur impulsivité et leur mobilité, ainsi que dans tous les sentiments populaires que nous aurons à étudier, interviennent toujours les caractères fondamentaux de la race, qui constituent le sol invariable sur lequel germent tous nos sentiments. Toutes les foules sont toujours irritables et impulsives, sans doute, mais avec de grandes variations de degré. La différence entre une foule latine et une foule anglo-saxonne est, par exemple, frappante. Les faits les plus récents de notre histoire jettent une vive lueur sur ce point. Il a suffi, il y a vingt-cinq ans, de la publication d’un simple télégramme relatant une insulte supposée faite à un ambassadeur pour déterminer une explosion de fureur dont une guerre terrible est immédiatement sortie. Quelques années plus tard, l’annonce télégraphique d’un insignifiant échec à Langson provoqua une nouvelle explosion qui amena le renversement instantané du gouvernement. Au même moment, l’échec beaucoup plus grave d’une expédition anglaise devant Kartoum ne produisit en Angleterre qu’une émotion très faible, et aucun ministère ne fut renversé. Les foules sont partout féminines, mais les plus féminines de toutes sont les foules latines. Qui s’appuie sur elles peut monter très haut et très vite, mais en côtoyant sans cesse la roche Tarpéienne et avec la certitude d’en être précipité un jour."
  "translation_ja": "群衆の怒りやすさにも、その衝動性や移り気にも、またこれから調べる民衆の感情のすべてにも、私たちのあらゆる感情の芽を育む変わらぬ土壌となっている、人種の根本の性質がつねに働く。どんな群衆もつねに怒りやすく衝動的なのはたしかだが、程度には大きな差がある。たとえばラテン系の群衆とアングロサクソン系の群衆の違いは目を引く。この点はわが国のごく近年の出来事を見ればよく分かる。二十五年前、ある大使が侮辱を受けたという、そう思われただけの話を伝える一本の電報が公にされると、それだけで怒りが爆発し、たちまち恐ろしい戦争となった。数年後、ランソンでの取るに足らぬ敗北が電報で告げられると、また怒りが爆発して、即座に政府を倒した。同じころ、イギリスの遠征隊はハルツームの手前ではるかに重大な失敗を喫したのに、イギリス国内で動揺はごくわずかで、内閣は一つも倒れなかった。群衆はどこであれ女性的であり、なかでももっとも女性的なのはラテン系の群衆である。それを足場にする者は、見るまに非常な高みへ登れる。だが、つねにタルペイアの崖の縁に沿って歩むのであり、いつかそこから突き落とされるのは確実だ。"
  "source_languages":

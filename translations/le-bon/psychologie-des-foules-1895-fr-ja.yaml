- "id": "preface-011"
  "source_text": "D’autres motifs encore contribuent à lui dicter cette réserve. La complexité des faits sociaux est telle qu’il est impossible de les embrasser dans leur ensemble, et de prévoir les effets de leur influence réciproque. Il semble aussi que derrière les faits visibles se cachent parfois des milliers de causes invisibles. Les phénomènes sociaux visibles paraissent être la résultante d’un immense travail inconscient, inaccessible le plus souvent à notre analyse. On peut comparer les phénomènes perceptibles aux vagues qui viennent traduire à la surface de l’océan les bouleversements souterrains dont il est le siège, et que nous ne connaissons pas. Observées dans la plupart de leurs actes, les foules font preuve le plus souvent d’une mentalité singulièrement inférieure ; mais il est d’autres actes aussi où elles paraissent guidées par ces forces mystérieuses que les anciens appelaient destin, nature, providence, que nous appelons voix des morts, et dont nous ne saurions méconnaître la puissance, bien que nous ignorions leur essence. Il semblerait parfois que dans le sein des nations se trouvent des forces latentes qui les guident. Qu’y a-t-il, par exemple, de plus compliqué, de plus logique, de plus merveilleux qu’une langue ? Et d’où sort cependant cette chose si bien organisée et si subtile, sinon de l’âme inconsciente des foules ? Les académies les plus savantes, les grammairiens les plus estimés ne font qu’enregistrer péniblement les lois qui régissent ces langues, et seraient totalement incapables de les créer. Même pour les idées de génie des grands hommes, sommes-nous bien certains qu’elles soient exclusivement leur œuvre ? Sans doute elles sont toujours créées par des esprits solitaires ; mais les milliers de grains de poussière qui forment l’alluvion où ces idées ont germé, n’est-ce pas l’âme des foules qui les a formés ?"
  "translation_ja": "慎重さを求める理由はまだある。社会的事実はあまりに入り組んでいるため、全体を一目に収めることも、それらが互いに作用し合った結果を予見することもできない。目に映る事実の背後には、ときには何千もの目に見えぬ原因が潜んでいるらしい。目に見える社会現象は、多くの場合、私たちの分析の届かぬところで進む、無意識の膨大な働きが一つの結果となって現れたものと思われる。私たちに捉えられる現象は、海の底の、人知れず起きている地殻の動きを海面に伝える波にたとえられよう。群衆の行動の大半を観察すると、その精神の働きはたいてい格別に劣って見える。だがほかの行動に目を向けると、群衆は不思議な力に導かれているようにも見える。古人はそれを運命とも自然とも摂理とも呼び、私たちは死者たちの声と呼ぶ。その本性は知らずとも、その力を見誤るわけにはいかない。国民の内奥には、それを導く力が潜んでいるように思えることがある。たとえば、一つの言語よりも複雑で、筋道立ち、驚嘆に値するものがあるだろうか。これほど巧みに組み上がり、これほど精妙なものが、群衆の無意識の魂以外の、いったいどこから出てきたというのか。どれほど学識のある学士院も、どれほど名望のある文法家も、諸言語を律する法則を苦心して書きとめるにすぎず、それを作り出すことはまるでできないだろう。偉人の天才的な着想でさえ、それがひとえにその人だけの仕事だと本当に言い切れるだろうか。たしかに着想はいつも一人の精神から生まれる。だがその芽が出る堆積土をなす無数の細かな粒を生み出したのは、群衆の魂ではなかったか。"

- "id": "b2c1-014"
  "source_text": "§ 2. — LES TRADITIONS"
  "translation_ja": "第二節　伝統"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 232
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[45]"
  "section_id": "b2c1s2"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-015"
  "source_text": "Les traditions représentent les idées, les besoins, les sentiments du passé. Elles sont la synthèse de la race et pèsent de tout leur poids sur nous."
  "translation_ja": "伝統は、過去の思想、欲求、感情を表す。それは人種の集約であり、その全重量が私たちの上にかかっている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 233
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[237]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-016"
  "source_text": "Les sciences biologiques ont été transformées depuis que l’embryologie a montré l’influence immense du passé dans l’évolution des êtres ; et les sciences historiques ne le seront pas moins quand cette notion sera plus répandue. Elle ne l’est pas suffisamment encore, et bien des hommes d’État en sont restés aux idées des théoriciens du dernier siècle, qui croyaient qu’une société peut rompre avec son passé et être refaite de toutes pièces en ne prenant pour guide que les lumières de la raison."
  "translation_ja": "生物学の諸科学は、生き物の進化に過去が及ぼす甚大な影響を発生学が示して以来、その姿を変えた。この認識がもっと広まれば、歴史科学も負けずに姿を変えるであろう。それはまだ十分広く浸透したとはいえず、大勢の政治家が、前世紀の理論家たちの思想にとどまっている。彼らは、一つの社会が過去と決別し、ただ理性の光だけを道しるべに、何から何まですっかり作り直されうると信じたのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 234
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[238]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-017"
  "source_text": "Un peuple est un organisme créé par le passé, et qui, comme tout organisme, ne peut se modifier que par de lentes accumulations héréditaires."
  "translation_ja": "一つの民族とは過去が生み出した有機体であり、すべての有機体と同じく、代々受け継ぐものをゆっくり積み重ねる以外に、姿を変えることはできない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 235
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[239]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-018"
  "source_text": "Ce qui conduit les hommes, surtout lorsqu’ils sont en foule, ce sont les traditions ; et, comme je l’ai répété bien des fois, ils n’en changent facilement que les noms, les formes extérieures."
  "translation_ja": "人間が、とりわけ群衆になっているとき、その行いを導くのは伝統である。そして私が幾度も繰り返したように、人間が伝統についてたやすく変えられるのは、その名と外形だけだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 236
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[240]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-019"
  "source_text": "Il n’est pas à regretter qu’il en soit ainsi. Sans traditions, il n’y a ni âme nationale, ni civilisation possibles. Aussi les deux grandes occupations de l’homme depuis qu’il existe ont-elles été de se créer un réseau de traditions, puis de tâcher de les détruire lorsque leurs effets bienfaisants se sont usés. Sans les traditions, pas de civilisation ; sans la lente élimination de ces traditions, pas de progrès. La difficulté est de trouver un juste équilibre entre la stabilité et la variabilité ; et cette difficulté est immense. Quand un peuple a laissé des coutumes se fixer trop solidement chez lui pendant beaucoup de générations, il ne peut plus changer et devient, comme la Chine, incapable de perfectionnement. Les révolutions violentes n’y peuvent rien, car il arrive alors, ou que les fragments brisés de la chaîne se ressoudent, et que le passé reprend sans changements son empire, ou que les fragments restent dispersés, et alors à l’anarchie succède bientôt la décadence."
  "translation_ja": "これは悲しむべきことではない。伝統なしには、国民の魂も文明もありえない。だから人間が出現して以来の二つの大仕事は、みずからに伝統の網を編み、次いでその恵みがすり減ると、これを打ち破ろうと努めることだった。伝統がなければ文明はない。だがその伝統をゆっくり取り去ることなしに進歩もない。難しいのは、安定と変化のあいだに手ごろなつりあいを見いだすことだ。その難しさははかり知れない。習慣が幾世代にもわたってあまりに固く根づくのを許した民族は、もはや変われなくなり、中国のように向上する力を失う。激しい革命も役に立たない。鎖の砕けた断片がつながり直して、過去が変わらぬまま支配を取り戻すか、あるいは断片がばらばらのままに残って、無秩序の後にほどなく衰退が来るか、そのいずれかだからだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 237
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[241]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-020"
  "source_text": "Aussi, l’idéal pour un peuple est-il de garder les institutions du passé, en ne les transformant qu’insensiblement et peu à peu. Cet idéal est difficilement accessible. Les Romains, dans les temps anciens, les Anglais, dans les temps modernes, sont à peu près les seuls qui l’aient réalisé."
  "translation_ja": "したがって、一つの民族の理想は、過去の制度を保ちながら、気づかぬほどわずかずつ、それを徐々に変えてゆくことである。この理想はたやすく手に入らない。実現したのは、古代ならローマ人、近代ならイギリス人ぐらいのものだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 238
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[242]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-021"
  "source_text": "Les conservateurs les plus tenaces des idées traditionnelles, et qui s’opposent le plus obstinément à leur changement, sont précisément les foules, et notamment les catégories de foules qui constituent les castes. J’ai déjà insisté sur l’esprit conservateur des foules, et montré que les plus violentes révoltes n’aboutissent qu’à un changement de mots. À la fin du dernier siècle, devant les églises détruites, devant les prêtres expulsés ou guillotinés, devant la persécution universelle du culte catholique, on pouvait croire que les vieilles idées religieuses avaient perdu tout pouvoir ; et cependant quelques années s’étaient à peine écoulées que, devant les réclamations universelles, il fallut rétablir le culte aboli[7]. Effacées un instant, les vieilles traditions avaient repris leur empire."
  "translation_ja": "伝統的な思想をもっともがんこに守り、その変化にもっとも根強く逆らうのは、ほかでもない群衆であり、とりわけカーストをなすたぐいの群衆である。群衆の保守的な精神についてはすでに強調し、もっとも激しい反乱も言葉の変更にしか帰着しないことを示した。前世紀の終わり、破壊された教会を前に、追放され、あるいは断頭台に送られた司祭たちを前に、そしてあまねく迫害されたカトリックの礼拝を前に、古い宗教思想は力をことごとく失ったように見えた。ところがほんの数年しか経たないうちに、あまねく上がる要求に押され、廃止した礼拝を復活させねばならなかった［7］。一瞬消えていた古い伝統は、ふたたび支配を取り戻していた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 239
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[243]"
  "section_id": "b2c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-note-7"
  "section_id": "b2c1s2"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Le rapport de l’ancien conventionnel Fourcroy, cité par Taine, est à ce point de vue fort net : « Ce qu’on voit partout sur la célébration du dimanche et sur la fréquentation des églises prouve que la masse des Français veut revenir aux anciens usages, et il n’est plus temps de résister a cette pente nationale… La grande masse des hommes a besoin de religion, de culte et de prêtres. C’est une erreur de quelques philosophes modernes, à laquelle j’ai été moi-même entraîné, que de croire à la possibilité d’une instruction assez répandue pour détruire les préjugés religieux ; ils sont, pour le grand nombre des malheureux, une source de consolation… Il faut donc laisser à la masse du peuple, ses prêtres, ses autels et son culte. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-7"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-7"
  "translation_ja": "テーヌの引く元国民公会議員フルクロワの報告は、この点できわめて明瞭である。「日曜日の祝い方や教会に通う人々について、どこででも見られることは、フランス人の大多数が古くからの習慣に戻りたがっており、もうこの国民的な傾きに逆らえる時ではないことを証明している。……人間の大多数には宗教と礼拝と司祭が要る。宗教的な偏見を打ち壊せるほどに教育を普及させうると信じるのは、近代の幾人かの哲学者の誤りであり、私自身もそれに引き込まれた。不幸な人々の大部分にとって、そうした偏見は慰めの泉である。……したがって民衆の大部分には、その司祭も祭壇も礼拝も、そのまま残すべきだ」。"
  "translation_status": "reviewed"
- "id": "b2c1-022"
  "source_text": "Aucun exemple ne montre mieux la puissance des traditions sur l’âme des foules. Ce n’est pas dans les temples qu’habitent les idoles les plus redoutables, ni dans les palais les tyrans les plus despotiques ; ceux-ci peuvent être brisés en un instant ; mais les maîtres invisibles qui règnent dans nos âmes échappent à tout effort de révolte, et ne cèdent qu’à la lente usure des siècles."
  "translation_ja": "群衆の魂に対する伝統の力を、これほどよく示す例はない。もっとも恐るべき偶像が住むのは神殿ではないし、もっとも専制的な暴君がいるのは宮殿ではない。そういうものなら、またたく間に打ち砕かれうる。だが、私たちの魂のうちに君臨する目に見えない主人たちは、どんな反抗の努力をもすり抜ける。幾世紀もの時間にゆっくりすり減らされてしか、退くことはない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 240

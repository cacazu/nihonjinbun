- "id": "b2c3-044"
  "source_text": "J’arrive maintenant au prestige personnel. Il est d’une nature fort différente du prestige artificiel ou acquis dont je viens de m’occuper. C’est une faculté indépendante de tout titre, de toute autorité, que possèdent un petit nombre de personnes, et qui leur permet d’exercer une fascination véritablement magnétique sur ceux qui les entourent, alors même qu’ils sont socialement leurs égaux et ne possèdent aucun moyen ordinaire de domination. Ils imposent leurs idées, leurs sentiments à ceux qui les entourent, et on leur obéit comme la bête féroce obéit au dompteur qu’elle pourrait si facilement dévorer."
  "translation_ja": "次は、その人自身の威信である。いま検討した人工的あるいは後天的な威信とはずいぶん性質が違う。どんな肩書や権威からも独立した、少数の人間の持つ能力で、社会的には同等の者のあいだにいて、通常の支配手段は何も持たなくても、周囲の人々を文字どおり磁気のような力で魅する。自分の考えや感情を周囲の者にのませ、人々はそれに従う。あんなにたやすく食い殺せるはずの調教師に猛獣が従うのと同じだ。"
  "source_languages":
  - "fr"

- "id": "b1c1-017"
  "source_text": "Il est facile de constater combien l’individu en foule diffère de l’individu isolé ; mais il est moins facile de découvrir les causes de cette différence."
  "translation_ja": "群衆のなかの個人が単独の個人といかに違うかを認めるのは容易だが、その違いが生じるわけを見いだすのはそう容易ではない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 91
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[93]"
  "section_id": "b1c1"

- "id": "b1c2-017"
  "source_text": "Si neutre qu’on la suppose, la foule se trouve le plus souvent dans cet état d’attention expectante qui rend la suggestion facile. La première suggestion formulée qui surgit s’impose immédiatement par contagion à tous les cerveaux, et aussitôt l’orientation s’établit. Comme chez tous les êtres suggestionnés, l’idée qui a envahi le cerveau tend à se transformer en acte. Qu’il s’agisse d’un palais à incendier ou d’un acte de dévouement à accomplir, la foule s’y prête avec la même facilité. Tout dépendra de la nature de l’excitant, et non plus, comme chez l’être isolé, des rapports existant entre l’acte suggéré et la somme de raison qui peut être opposée à sa réalisation."
  "translation_ja": "どれほど何ものにも傾いていないと仮定しても、群衆はたいてい、何か起こるかと身構えて注意を向けている。これが暗示を受けやすい状態である。最初にはっきりと言葉にされた暗示が現れると、たちまち伝染してすべての人の頭を占め、その場で方向が定まる。暗示を受けた者はみなそうだが、頭に入り込んだ考えは行為に変わろうとする。宮殿に火を放つことでも、献身的な行為をすることでも、群衆は同じようにたやすくそれに応じる。何もかも刺激の性質によって決まる。一人でいる場合のように、暗示された行いと、その実行に対抗できるだけの理性とのつりあいで決まるのではなくなる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 123

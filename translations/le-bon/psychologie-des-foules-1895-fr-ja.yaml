- "id": "b2c3-049"
  "source_text": "Napoléon exerça la même fascination sur tous ceux qui l’approchèrent[18]."
  "translation_ja": "ナポレオンは近づく者すべてに同じ魅惑を及ぼした［18］。"
  "source_languages":

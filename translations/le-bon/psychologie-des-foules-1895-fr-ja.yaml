- "id": "b1c2-006"
  "source_text": "J’aborde maintenant l’un après l’autre les divers caractères que l’on peut observer dans la plupart des foules."
  "translation_ja": "ここからは、たいていの群衆で観察される性質を順に取り上げる。"

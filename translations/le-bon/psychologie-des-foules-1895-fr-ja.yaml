- "id": "b3c1-003"
  "source_text": "Divisions générales des foules. — Leur classification. § 1. Les foules hétérogènes. — Comment elles se différencient. — Influence de la race. — L’âme de la foule est d’autant plus faible que l’âme de la race est plus forte. — L’âme de la race représente l’état de civilisation et l’âme de la foule l’état de barbarie. — § 2. Les foules homogènes. — Division des foules homogènes. — Les sectes, les castes et les classes."
  "translation_ja": "群衆のおおまかな区分。その分類。一　異質な群衆。異質な群衆どうしは何によって区別されるか。人種の影響。人種の魂が強いほど群衆の魂は弱い。人種の魂は文明の状態を、群衆の魂は野蛮の状態を表す。二　同質な群衆。同質な群衆の区分。党派、カースト、階級。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 408
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[68]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-004"
  "source_text": "Nous avons indiqué dans cet ouvrage les caractères généraux communs aux foules psychologiques. Il nous reste à montrer les caractères particuliers qui s’ajoutent à ces caractères généraux suivant les diverses catégories de collectivités lorsque, sous l’influence d’excitants convenables, elles se transforment en foule."
  "translation_ja": "本書では、心理的群衆に共通する一般的な特徴を示してきた。適切な刺激を受けて集団が群衆に変わるとき、集団の種類に応じ、これらの一般的な特徴に加わる個別の特徴を示す仕事が残っている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 409
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[418]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-005"
  "source_text": "Exposons d’abord en quelques mots une classification des foules."
  "translation_ja": "まず群衆の分類を簡潔に述べよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 410
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[419]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-006"
  "source_text": "Notre point de départ sera la simple multitude. Sa forme la plus inférieure se présente, lorsqu’elle est composée d’individus appartenant à des races différentes. Elle n’a d’autre lien commun que la volonté, plus ou moins respectée d’un chef. On peut donner comme type de telles multitudes, les barbares d’origines fort diverses, qui pendant plusieurs siècles envahirent l’empire Romain."
  "translation_ja": "出発点とするのは、人がただ多数いる状態である。そのもっとも低い形は、さまざまな人種に属する人々で構成されるときに見られる。人々に共通する結びつきは、多かれ少なかれ尊重される首長の意志のほかには何もない。何世紀にもわたってローマ帝国に侵入した、出自のはなはだ多様な蛮族を、こうした群がりの典型に挙げられる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 411
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[420]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-007"
  "source_text": "Au-dessus de ces multitudes de races diverses, se trouvent celles qui, sous l’influence de certains facteurs, ont acquis des caractères communs et ont fini par former une race. Elles présenteront à l’occasion les caractéristiques spéciales des foules, mais ces caractéristiques seront plus ou moins dominées par celles de la race."
  "translation_ja": "このように人種のさまざまな群がりより上に位置するのが、いくつかの要因の作用のもと、共通する性質を得て、ついに一つの人種を形づくった群がりである。折に触れて群衆特有の性質を示すが、その性質は多少なりとも人種の性質に支配されるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 412
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[421]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-008"
  "source_text": "Ces deux catégories de multitudes peuvent, sous l’influence des facteurs étudiés dans cet ouvrage, se transformer en foules organisées ou psychologiques. Dans ces foules organisées, nous établirons les divisions suivantes :"
  "translation_ja": "この二種類の群がりは、本書で調べた要因の影響によって、組織をなした群衆または心理的群衆に変わりうる。こうした組織をなす群衆について、次の区分を立てよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 413
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[422]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-009"
  "source_text": "A. Foules hétérogènes 1o Anonymes. (Foules de rues, par exemple) 2o Non anonymes (Jurys, assemblées parlementaires, etc.)"
  "translation_ja": "Ａ　異質な群衆。一、無名のもの（たとえば街頭の群衆）。二、無名でないもの（陪審、議会など）。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 414
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/ul[1]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-010"
  "source_text": "B. Foules homogènes 1o Sectes. (Sectes politiques, Sectes religieuses, etc.) 2o Castes. (Caste militaire, caste sacerdotale, castes ouvrières, etc.) 3o Classes. (Classe bourgeoise, classe des paysans, etc.)"
  "translation_ja": "Ｂ　同質な群衆。一、党派（政治上の党派、宗派など）。二、カースト（軍人、聖職者、労働者などがなす身分集団）。三、階級（市民階級、農民階級など）。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 415
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/ul[2]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-011"
  "source_text": "Indiquons en quelques mots les caractères différentiels de ces diverses catégories de foules."
  "translation_ja": "群衆のさまざまな種類を区別する特徴を手短に示そう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 416
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[423]"
  "section_id": "b3c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-012"
  "source_text": "§ 1. — foules hétérogènes"
  "translation_ja": "第一節　異質な群衆"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 417
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[72]"
  "section_id": "b3c1s1"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-013"
  "source_text": "Ces collectivités sont celles dont nous avons étudié les caractères dans ce volume. Elles se composent d’individus quelconques, quelle que soit leur profession ou leur intelligence."
  "translation_ja": "ここでいう集団は、本巻でその性質を研究してきた集団である。それを成すのは、どんな職業の、どんな知性を持つ人でもよい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 418
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[424]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-014"
  "source_text": "Nous savons maintenant que, par le fait seul que des hommes forment une foule agissante, leur psychologie collective diffère essentiellement de leur psychologie individuelle, et que l’intelligence ne les soustrait pas à cette différenciation. Nous avons vu que, dans les collectivités, l’intelligence ne joue aucun rôle. Seuls des sentiments inconscients agissent."
  "translation_ja": "人々が行動する群衆をなすというだけで、その集団としての心理が各人の心理と根本から変わること、知性があっても、この違いが生ずるのを免れはしないことは今や分かっている。集団において知性は何の役割も果たさず、働くのは無意識の感情だけであることも見た。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 419
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[425]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-015"
  "source_text": "Un facteur fondamental, la race, permet de différencier assez profondément les diverses foules hétérogènes."
  "translation_ja": "さまざまな異質な群衆を互いにかなり深く区別できるのは、一つの根本的な要因、人種によってである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 420
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[426]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-016"
  "source_text": "Nous sommes plusieurs fois déjà revenus sur le rôle de la race, et nous avons montré qu’elle est le plus puissant des facteurs capables de déterminer les actions des hommes. Elle manifeste également son action dans les caractères des foules. Une foule composée d’individus quelconques, mais tous Anglais ou Chinois, différera profondément d’une autre foule composée d’individus également quelconques, mais de races différentes : Russes, Français, Espagnols, par exemple."
  "translation_ja": "人種の役割についてはすでに何度も立ち返り、それが人間の行いを決定しうる要因のうち、もっとも強力であることを示した。その働きはまた、群衆の特徴にも現れる。成員そのものはだれでもよいが全員がイギリス人、あるいは全員が中国人である群衆と、成員はやはりだれでもよいが、それとは異なる人種、たとえばロシア人、フランス人、スペイン人から成る別の群衆とは、根底から違うだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 421
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[427]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-017"
  "source_text": "Les profondes divergences que la constitution mentale héréditaire crée dans la façon de sentir et de penser des hommes, éclatent immédiatement dès que des circonstances, assez rares d’ailleurs, réunissent dans une même foule, en proportions à peu près égales, des individus de nationalités différentes, quelque identiques que soient en apparence les intérêts qui les rassemblent. Les tentatives faites par les socialistes pour réunir dans de grands congrès des représentants de la population ouvrière de chaque pays, ont toujours abouti aux plus furieuses discordes. Une foule latine, si révolutionnaire ou si conservatrice qu’on la suppose, fera invariablement appel, pour réaliser ses exigences, à l’intervention de l’État. Elle est toujours centralisatrice et plus ou moins césarienne. Une foule anglaise ou américaine, au contraire, ne connaît pas l’État et ne fait appel qu’à l’initiative privée. Une foule française tient avant tout à l’égalité, et une foule anglaise à la liberté. Ce sont précisément ces différences de races qui font qu’il y a presque autant de formes de socialisme et de démocratie que de nations."
  "translation_ja": "人間の感じ方や考え方に、遺伝した心のつくりが生み出す大きな違いは、異なる国籍の者がほぼ同じ割合で同じ群衆に集められるとき、たちまち露わになる。そういう場合は実際にはかなりまれだが、集まる目的となった利害が見かけのうえでどれほど同じでも変わらない。社会主義者が、各国の労働者の代表を大きな会議に集めようとしてなした試みは、いつも激しい不和に終わった。ラテン系の群衆はいかに革命的と見ようと保守的と見ようと、要求を実現しようとすると決まって国家の介入に訴える。いつでも集権的で、多かれ少なかれカエサル流の権力を好む。これに対し、イギリスまたはアメリカの群衆は、国家など眼中になく、民間の自発性にしか頼らない。フランスの群衆が何より大切にするのは平等で、イギリスの群衆が大切にするのは自由である。社会主義や民主主義にほとんど国の数だけ形があるのも、まさしくこうした人種の違いのためだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 422
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[428]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-018"
  "source_text": "L’âme de la race domine donc entièrement l’âme de la foule. Elle est le substratum puissant qui limite ses oscillations. Considérons comme une loi essentielle que les caractères inférieurs des foules sont d’autant moins accentués que l’âme de la race est plus forte. L’état de foule et la domination des foules, c’est la barbarie ou le retour à la barbarie. C’est en acquérant une âme solidement constituée que la race se soustrait de plus en plus à la puissance irréfléchie des foules et sort de la barbarie."
  "translation_ja": "したがって人種の魂は群衆の魂を完全に支配する。人種の魂は、群衆の魂の揺れを制限する強力な基層である。人種の魂が強ければ強いほど、群衆の低い性質は目立たなくなるのを、根本法則とみなそう。群衆状態と群衆による支配、それは野蛮、または野蛮への逆戻りである。しっかりしたつくりの魂を獲得することにより、人種はますます群衆の無思慮な力を脱し、野蛮を抜け出すのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 423
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[429]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-019"
  "source_text": "En dehors de la race, la seule classification importante à faire pour les foules hétérogènes est de les séparer en foules anonymes, comme celles des rues, et en foules non anonymes, — les assemblées délibérantes et les jurés par exemple. Le sentiment de la responsabilité, nul chez les premières et développé chez les secondes, donne à leurs actes des orientations souvent fort différentes."
  "translation_ja": "人種のほかに、異質な群衆について重要な分類は一つしかない。街頭に見られるような無名の群衆と、たとえば審議団体や陪審のような無名ではない群衆とに分けることである。前者にはまったくなく、後者には発達している責任感によって、その行いはしばしばきわめて異なる方向を取る。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 424
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[430]"
  "section_id": "b3c1s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-020"
  "source_text": "§ 2. — foules homogènes"
  "translation_ja": "第二節　同質な群衆"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 425
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[75]"
  "section_id": "b3c1s2"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-021"
  "source_text": "Les foules homogènes comprennent : 1o les sectes ; 2o les castes ; 3o les classes."
  "translation_ja": "同質な群衆には、一に党派、二にカースト、三に階級がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 426
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[431]"
  "section_id": "b3c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-022"
  "source_text": "La secte marque le premier degré dans l’organisation des foules homogènes. Elle comprend des individus d’éducation, de professions, de milieux parfois fort différents, n’ayant entre eux que le lien unique des croyances. Telles sont les sectes religieuses et politiques, par exemple."
  "translation_ja": "党派は同質な群衆が組織をなす第一段階に当たる。教育、職業、環境がときにひどく異なりながら、ただ信念だけを結びつきとする者たちを含む。宗教上や政治上の党派などがその例である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 427
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[432]"
  "section_id": "b3c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-023"
  "source_text": "La caste représente le plus haut degré d’organisation dont la foule soit susceptible. Alors que la secte comprend des individus de professions, d’éducation, de milieux fort différents et rattachés seulement par la communauté des croyances, la caste ne comprend que des individus de même profession et par conséquent d’éducation et de milieux à peu près semblables. Telles sont la caste militaire et la caste sacerdotale, par exemple."
  "translation_ja": "カーストは、群衆が可能なもっとも高度な組織を表す。党派には、職業や教育や環境がきわめて違い、信念が共通することだけで結ばれた者たちが含まれるが、カーストには、職業が同じであり、したがって教育と環境がおおよそ似た者だけが含まれる。たとえば軍人のカースト、聖職者のカーストがそれである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 428
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[433]"
  "section_id": "b3c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-024"
  "source_text": "La classe est formée par des individus d’origines diverses réunis, non par la communauté des croyances, comme le sont les membres d’une secte, ni par la communauté des occupations professionnelles, comme le sont les membres d’une caste, mais par certains intérêts, certaines habitudes de vie et d’éducation fort semblables. Telles sont, par exemple, la classe bourgeoise, la classe agricole, etc."
  "translation_ja": "階級をなすのはさまざまな出自の人々であり、党派の成員のように共通の信念によって結ばれるわけではなく、カーストの成員のように同じ仕事によって結ばれるわけでもなく、いくつかの利害、生活の習慣、受ける教育がたいへん似通っていることで結ばれる。たとえば市民階級や農業階級などである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 429
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[434]"
  "section_id": "b3c1s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c1-025"
  "source_text": "Ne m’occupant dans cet ouvrage que des foules hétérogènes, et réservant l’étude des foules homogènes (sectes, castes et classes) pour un autre volume, je n’insisterai pas ici sur les caractères de ces dernières. Je terminerai l’étude des foules hétérogènes par l’examen de quelques catégories de foules déterminées, choisies comme types."
  "translation_ja": "本書で私が取り上げるのは異質な群衆だけであり、同質な群衆、すなわち党派、カースト、階級の研究は別の巻に譲るので、後者の特徴にはこれ以上立ち入らないことにしよう。異質な群衆の研究は、典型として選んだいくつかの特定の種類を調べて結ぶことにする。"
  "source_languages":
  - "fr"

- "id": "b2c1-040"
  "source_text": "Si cette éducation n’était qu’inutile, on pourrait se borner à plaindre les malheureux enfants auxquels, au lieu de tant de choses nécessaires à apprendre à l’école primaire, on préfère enseigner la généalogie des fils de Clotaire, les luttes de la Neustrie et de l’Austrasie, ou des classifications zoologiques ; mais elle présente un danger beaucoup plus sérieux. Elle donne à celui qui l’a reçue un dégoût violent de la condition où il est né, et l’intense désir d’en sortir. L’ouvrier ne veut plus rester ouvrier, le paysan ne veut plus être paysan, et le dernier des bourgeois ne voit pour ses fils d’autre carrière possible que les fonctions salariées par l’État. Au lieu de préparer des hommes pour la vie, l’école ne les prépare qu’à des fonctions publiques où l’on peut réussir sans avoir à se diriger ni à manifester aucune lueur d’initiative. Au bas de l’échelle, elle crée ces armées de prolétaires mécontents de leur sort et toujours prêts à la révolte ; en haut, notre bourgeoisie frivole, à la fois sceptique et crédule, ayant une confiance superstitieuse dans l’État-providence, que cependant elle fronde sans cesse, s’en prenant toujours au gouvernement de ses propres fautes et incapable de rien entreprendre sans l’intervention de l’autorité."
  "translation_ja": "こんな教育でも、単に無益なだけなら、小学校で学ぶべき多くの必要な事柄の代わりに、クロタールの息子たちの系図や、ネウストリアとアウストラシアの争い、あるいは動物学の分類を教わる不運な子どもたちを気の毒に思うだけで済むだろう。だが実際にはもっと重大な危険がある。受けた者に、その生まれた境遇への激しい嫌悪と、そこから抜け出したいという切実な願いを植えつけるのだ。労働者はもう労働者のままでいたがらず、農民は農民でいたがらない。いちばんささやかな市民でさえ、息子の進路には国から俸給をもらう役職以外にありえないと思うようになる。学校は人間を人生に備えさせず、みずから進路を定めたり、自発的な気配を少しでも示したりしなくてもうまくやってゆける公職にだけ備えさせる。階段の下のほうでは、自分の運命に不満で、つねに反乱の用意のできた無産者の軍勢をつくる。上のほうでは、軽薄で、懐疑的であると同時に何でも信じ、いつも国家に楯突きながら、万事を取り計らう神のような国家に迷信めいた信頼を寄せ、自分の過ちをつねに政府のせいにし、お上の介入なしには何も始められない、わが国のブルジョワジーをつくる。"

- "id": "b3c3-006"
  "source_text": "« Aujourd’hui les choix du jury sont, en réalité, dans les mains des conseillers municipaux, qui admettent ou éliminent, à leur gré, suivant les préoccupations politiques et électorales inhérentes à leur situation… La majorité des élus se compose de commerçants moins importants qu’on ne les choisissait autrefois, et des employés de certaines administrations… Toutes les opinions se fondant avec toutes les professions dans le rôle de juge, beaucoup ayant l’ardeur des néophytes, et les hommes de meilleure volonté se rencontrant dans les situations les plus humbles, l’esprit du jury n’a pas changé : ses verdicts sont restés les mêmes. »"
  "translation_ja": "「今日、陪審員の選任は実際には市町村会議員の手中にあり、彼らはその地位に付きまとう政治的、選挙上の思惑に従って、意のままに取り入れたり除いたりする。……選ばれる者の多数は、以前選ばれた人々ほど大きな店は持たない商店主や、ある種の機関の事務員から成る。……あらゆる意見があらゆる職業とともに裁く者の役割のなかに溶け合い、多くの者が入信したばかりの信者の熱意を抱き、またもっともつましい地位にも、もっとも善意のある人々は見いだされるので、陪審の精神は変わらなかった。その評決も以前と同じままである」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 455
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[460]"
  "section_id": "b3c3"

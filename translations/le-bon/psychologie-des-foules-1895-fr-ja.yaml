- "id": "b3c5-042"
  "source_text": "Lorsque les assemblées parlementaires se trouvent montées à un certain degré d’excitation, elles deviennent identiques aux foules hétérogènes ordinaire, et leurs sentiments présentent par conséquent la particularité d’être toujours extrêmes. On les verra se porter aux plus grands actes d’héroïsme ou aux pires excès. L’individu n’est plus lui-même, et il l’est si peu qu’il votera les mesures les plus contraires à ses intérêts personnels."
  "translation_ja": "興奮がある段階に達すると、議会はふつうの異質な群衆とまったく同じものになる。したがってそこでの感情には、常に極端だという特徴が現れる。このうえなく英雄的な行為に打って出るのも、最悪の暴挙に走るのも見ることになろう。一人ひとりはもはや本来の自分ではない。どれほど自分でなくなるかといえば、個人としての利害に真っ向から反する措置にも賛成票を投じるほどなのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

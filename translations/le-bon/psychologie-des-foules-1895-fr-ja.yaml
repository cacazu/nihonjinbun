  "translation_status": "reviewed"
- "id": "b3c2-010"
  "source_text": "Les caractères généraux des foules dites criminelles sont exactement ceux que nous avons constatés chez toutes les foules : suggestibilité, crédulité, mobilité, exagération des sentiments bons ou mauvais, manifestation de certaines formes de moralité, etc."
  "translation_ja": "犯罪的と呼ばれる群衆の一般的な特徴は、あらゆる群衆について認めたものとまったく同じである。暗示を受けやすく、信じやすく、移ろいやすいこと。よい感情も悪い感情も誇張されること。ある種の道徳性を示すこと、その他である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 440
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[445]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-011"
  "source_text": "Nous allons retrouver tous ces caractères chez une des foules qui ont laissé un des plus sinistres souvenirs dans notre histoire : celle des septembriseurs. Elle présente d’ailleurs beaucoup d’analogie avec celles qui firent la Saint-Barthélemy. J’emprunte les détails du récit à M. Taine, qui les a puisés dans les mémoires du temps."
  "translation_ja": "これらの性質を、わが国の歴史でもっとも陰惨な記憶を残した群衆の一つ、九月虐殺の実行者たちに、ふたたび見いだすことになる。この群衆には、サン・バルテルミの虐殺を行った群衆との類似点も多い。私は物語の細部をテーヌ氏から借りる。氏は当時の人々の回想録からそれらをくみ取った。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 441
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[446]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-012"
  "source_text": "On ne sait pas exactement qui donna l’ordre ou suggéra de vider les prisons en massacrant les prisonniers. Que ce soit Danton, comme cela est probable, ou tout autre, il n’importe ; le seul fait intéressant pour nous est celui de la suggestion puissante que reçut la foule chargée du massacre."
  "translation_ja": "囚人を虐殺して牢獄を空にするよう命じたのか、あるいはそうほのめかしたのか、その人物がだれかは正確には知られていない。おそらくそうだとされるダントンであれ、ほかのだれであれ、それはどうでもよい。ここで注目に値する事実は、虐殺を担った群衆が強力な暗示を受けたことだけである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 442
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[447]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-013"
  "source_text": "La foule des massacreurs comprenait environ trois cents personnes, et constituait le type parfait d’une foule hétérogène. À part un très petit nombre de gredins professionnels, elle se composait surtout de boutiquiers et d’artisans de tous les corps d’états : cordonniers, serruriers, perruquiers, maçons, employés, commissionnaires, etc. Sous l’influence de la suggestion reçue, ils sont, comme le cuisinier cité plus haut, parfaitement convaincus qu’ils accomplissent un devoir patriotique. Ils remplissent une double fonction, juges et bourreaux, mais ne se considèrent en aucune façon comme des criminels."
  "translation_ja": "虐殺を行った群衆はおよそ三百人で、異質な群衆の申し分ない典型だった。ごく少数の生業としての悪党を除けば、主だったのは商店主とあらゆる職種の職人、靴屋、錠前師、かつら職人、左官、雇い人、用足し人などである。受けた暗示に動かされ、彼らは先ほどの料理人と同じように、愛国の義務を果たしていると心底確信している。裁判官と処刑人の二役を務めているが、自分たちが犯罪者だとは少しも考えない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 443
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[448]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-014"
  "source_text": "Pénétrés de l’importance de leur devoir, ils commencent par former une sorte de tribunal, et immédiatement apparaissent l’esprit simpliste, et l’équité non moins simpliste des foules. […] La conscience rudimentaire de la foule étant ainsi satisfaite, elle va pouvoir procéder légalement au massacre et donner libre cours à ces instincts de férocité dont j’ai montré ailleurs la genèse, et que les collectivités ont toujours le pouvoir de développer à un haut degré. Ils n’empêcheront pas d’ailleurs — ainsi que cela est la règle dans les foules — la manifestation concomitante d’autres sentiments contraires, tels qu’une sensibilité souvent aussi extrême que la férocité."
  "translation_ja": "自分たちの務めの重大さに感じ入った彼らは、まず一種の裁判所をつくる。するとただちに、群衆の単純きわまる精神と、それに劣らず単純な公正さが姿を現す。〔中略〕群衆の未発達な良心はこれで満たされ、今や合法的なこととして虐殺を始められる。その結果、私が別のところで生まれる仕組みを示した、集団がいつでも高度に発達させることのできる残虐な本能を、解き放つことができるのである。もっとも群衆における常のことながら、それらの本能が、しばしば残虐さと同じほど極端な感じやすさなど、相反する別の感情が同時に現れるのを妨げるわけではない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 444
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[449]"

  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c3-007"
  "source_text": "Retenons du passage que je viens de citer les conclusions qui sont très justes, et non les explications qui sont très faibles. Il ne faut pas trop s’étonner de cette faiblesse, car la psychologie des foules, et par conséquent des jurés, semble avoir été le plus souvent aussi inconnue des avocats que des magistrats. J’en trouve la preuve dans ce fait rapporté par l’auteur cité à l’instant, qu’un des plus illustres avocats de cour d’assises, Lachaud, usait systématiquement de son droit de récusation à l’égard de tous les individus intelligents faisant partie du jury. Or, l’expérience — l’expérience seule — a fini par apprendre l’entière inutilité de ces récusations. La preuve en est qu’aujourd’hui le ministère public et les avocats, à Paris du moins, y ont entièrement renoncé ; et, comme le fait remarquer M. des Glajeux, les verdicts n’ont pas changé, « ils ne sont ni meilleurs ni pires »."
  "translation_ja": "いま引いた文章から受け取るべきは、まさに正しい結論であって、はなはだ弱い説明ではない。この弱さをそれほど驚くには及ばない。群衆の心理、したがって陪審員の心理は、多くの場合、司法官ばかりか弁護士にも同じように知られていなかったらしいからだ。その証拠を、直前に引用した著者が伝える次の事実に私は見ている。重罪院でもっとも有名な弁護士の一人、ラショーは、陪審に加わった知的な人間を例外なく忌避する権利を、規則的に行使した。ところが経験が、ほかでもない経験だけが、ついには、それらの忌避がまったく役に立たないことを教えた。今日、少なくともパリでは検察側も弁護士もすっかりそれをやめたのに、デ・グラジュー氏が指摘するように、評決は変わらず、「よくも悪くもなっていない」ことがその証拠である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 456
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[461]"

- "id": "b2c2-023"
  "source_text": "Les philosophes du dernier siècle se sont consacrés avec ferveur à détruire les illusions religieuses, politiques et sociales dont, pendant de longs siècles, avaient vécu nos pères. En les détruisant ils ont tari les sources de l’espérance et de la résignation. Derrière les chimères immolées, ils ont trouvé les forces aveugles et sourdes de la nature. Inexorables pour la faiblesse, elles ne connaissent pas la pitié."
  "translation_ja": "前世紀の哲学者たちは、長い幾世紀もの間、父祖が生きるよりどころにしてきた宗教上、政治上、社会上の幻想を壊すことに熱意を捧げた。それらを壊すとともに、希望の泉と、甘んじて受け入れる心の泉とを枯らしてしまった。いけにえにされた幻の後ろに彼らが見いだしたのは、目も見えず、耳も聞こえぬ自然の力である。それは弱いものに対して容赦なく、憐れみを知らない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b1c3-030"
  "source_text": "Comment impressionne-t-on l’imagination des foules ? Nous le verrons bientôt. Bornons-nous, pour le moment, à dire que ce n’est jamais en essayant d’agir sur l’intelligence et la raison, c’est-à-dire par voie de démonstration. Ce ne fut pas au moyen d’une rhétorique savante qu’Antoine réussit à ameuter le peuple contre les meurtriers de César. Ce fut en lui lisant son testament et en lui montrant son cadavre."
  "translation_ja": "群衆の想像力を動かすのはどういうものか。それはまもなく見ることにしよう。いまはただ、知性や理性に働きかけようとすること、すなわち論証によってはけっしてそうならないとだけ言っておく。アントニウスがカエサルを殺した者たちに対して民衆を騒ぎ立たせたのは、凝った弁論のおかげではない。カエサルの遺言状を読み聞かせ、その亡骸を示したことによってであった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 199
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[199]"
  "section_id": "b1c3s3"

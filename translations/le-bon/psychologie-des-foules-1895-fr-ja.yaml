- "id": "b2c3-059"
  "source_text": "Le prestige enlevé par l’insuccès est perdu brusquement. Il peut s’user aussi par la discussion, mais d’une façon plus lente. Ce procédé est cependant d’un effet très sûr. Le prestige discuté n’est déjà plus du prestige. Les dieux et les hommes qui ont su garder longtemps leur prestige n’ont jamais toléré la discussion. Pour se faire admirer des foules, il faut toujours les tenir à distance."
  "translation_ja": "失敗に奪われる威信は突然に失われる。議論によって摩耗することもあるが、その場合はもっと緩やかである。だがこのやり方の効き目は確かだ。議論に付される威信は、もう威信ではない。威信を長く保つすべを知っていた神々や人間は、議論をけっして許さなかった。群衆にあがめられるには、いつも距離を置かなければならない。"
  "source_languages":
  - "fr"
  "source_locations":

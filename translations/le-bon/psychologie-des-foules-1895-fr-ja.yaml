- "id": "intro-014"
  "source_text": "La science n’a fait aucune banqueroute et n’est pour rien dans l’anarchie actuelle des esprits ni dans la puissance nouvelle qui grandit au milieu de cette anarchie. Elle nous a promis la vérité, ou au moins la connaissance des relations que notre intelligence peut saisir ; elle ne nous a jamais promis ni la paix ni le bonheur. Souverainement indifférente à nos sentiments, elle n’entend pas nos lamentations. C’est à nous de tâcher de vivre avec elle puisque rien ne pourrait ramener les illusions qu’elle a fait fuir."
  "translation_ja": "科学は破産などしていない。今日の精神の無秩序にも、その無秩序のまっただ中で育ちつつある新しい力にも、科学の責任はない。科学が私たちに約束したのは真理か、少なくとも私たちの知性で捉えられる関係を知ることであって、平和も幸福も、約束したことは一度もない。科学は私たちの感情にまったく無頓着で、嘆いても聞く耳を持たない。科学が追い払った幻想を連れ戻せるものがない以上、科学と生きてゆくすべを見いだすのは私たちのほうだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 60
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[61]"

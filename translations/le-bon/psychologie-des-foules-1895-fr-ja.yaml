- "id": "b1c1-021"
  "source_text": "C’est justement cette mise en commun de qualités ordinaires qui nous explique pourquoi les foules ne sauraient jamais accomplir d’actes exigeant une intelligence élevée. Les décisions d’intérêt général prises par une assemblée d’hommes distingués, mais de spécialités différentes, ne sont pas sensiblement supérieures aux décisions que prendrait une réunion d’imbéciles. Ils ne peuvent mettre en commun en effet que ces qualités médiocres que tout le monde possède. Dans les foules, c’est la bêtise et non l’esprit, qui s’accumule. Ce n’est pas tout le monde, comme on le répète si souvent, qui a plus d’esprit que Voltaire, c’est certainement Voltaire qui a plus d’esprit que tout le monde, si par « tout le monde » il faut entendre les foules."
  "translation_ja": "群衆が高い知性を要する行いをけっしてなしえない理由を説明するのは、まさしく、平凡な資質がこのように持ち寄られるということだ。それぞれは卓越しているが専門の違う人たちの会議が、一般の利害に関して下す決定は、愚か者たちの集まりが下すであろう決定に比べ、目立ってすぐれてはいない。彼らが持ち寄れるのは、しょせんだれにでもある平凡な資質だけだからだ。群衆のなかで積み重なるのは才知ではなく愚かさである。よく繰り返される言い方では、ヴォルテールより才知があるのは「みんな」だというが、そうではない。「みんな」というのが群衆のことなら、「みんな」より才知があるのは間違いなくヴォルテールだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 95
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[97]"
  "section_id": "b1c1"

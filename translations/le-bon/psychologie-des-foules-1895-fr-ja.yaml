  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-005"
  "source_text": "Au sens ordinaire le mot foule représente une réunion d’individus quelconques, quels que soient leur nationalité, leur profession ou leur sexe, et quels que soient aussi les hasards qui les rassemblent."
  "translation_ja": "日常の意味で群衆という語は、どんな人々であれ、その集まりを指す。国籍にも職業にも性別にもよらず、何のはずみで集まったのかにもよらない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 79
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[81]"
  "section_id": "b1c1"

  "translation_status": "reviewed"
- "id": "b3c5-036"
  "source_text": "Quant à l’orateur inconnu qui arrive avec un discours contenant de bonnes raisons, mais seulement des raisons, il n’a aucune chance d’être seulement écouté. Un député, doublé d’un psychologue perspicace, M. Descubes, a récemment tracé dans les lignes suivantes l’image du député sans prestige :"
  "translation_ja": "無名の弁士が、よい論拠の詰まった、しかし論拠しか入っていない演説を携えて来た場合は、耳を貸してもらえる見込みさえない。鋭敏な心理家を兼ねる代議士デスキューブ氏は、先ごろ、威信をもたない議員の姿を次のように描いた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 534
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[544]"
  "section_id": "b3c5"

- "id": "preface-013"
  "source_text": "Si donc nous voulons rester dans les limites étroites mais sûres des choses que la science peut connaître, et ne pas errer dans le domaine des conjectures vagues et des vaines hypothèses, il nous faut constater simplement les phénomènes qui nous sont accessibles, et nous borner à cette constatation. Toute conclusion tirée de nos observations est le plus souvent prématurée, car, derrière les phénomènes que nous voyons bien, il en est d’autres que nous voyons mal, et peut-être même, derrière ces derniers, d’autres encore que nous ne voyons pas."
  "translation_ja": "そこで、科学が知りうる物事の、狭くとも確かな領域にとどまり、あいまいな憶測や空疎な仮説のうちをさまよわずにいたければ、私たちは、捉えられる現象をありのままに確かめ、それ以上には出ないことだ。観察から結論を引き出してみても、たいていはまだ早い。はっきり見えている現象の陰に、よく見えない現象があり、そのまた陰には、ひょっとすると、まったく見えない現象まであるのだから。"
  "source_languages":
  - "fr"

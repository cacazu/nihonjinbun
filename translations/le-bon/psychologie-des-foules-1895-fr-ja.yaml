- "id": "b3c2-002"
  "source_text": "Les foules dites criminelles"
  "translation_ja": "犯罪的と呼ばれる群衆"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 432
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[78]"
  "section_id": "b3c2"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-003"
  "source_text": "Les foules dites criminelles. — Une foule peut être légalement mais non psychologiquement criminelle. — Complète inconscience des actes des foules. — Exemples divers. — Psychologie des septembriseurs. — Leurs raisonnements, leur sensibilité, leur férocité et leur moralité."
  "translation_ja": "犯罪的と呼ばれる群衆。群衆は法律上は犯罪者でありうるが、心理学のうえでは犯罪者とはいえない。群衆の行いのまったくの無自覚性。さまざまな例。九月虐殺の実行者たちの心理。その推論、感じやすさ、残虐さ、その道徳性。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 433
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[79]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-004"
  "source_text": "Les foules tombant, après une certaine période d’excitation, à l’état de simples automates inconscients menés par des suggestions, il semble difficile de les qualifier dans aucun cas de criminelles. Je ne conserve ce qualificatif erroné que parce qu’il a été consacré par des recherches psychologiques récentes. Certains actes des foules sont assurément criminels si on ne les considère qu’en eux-mêmes, mais alors au même titre que l’acte d’un tigre dévorant un Hindou, après l’avoir d’abord laissé un peu déchiqueter par ses petits pour les distraire."
  "translation_ja": "ある時間興奮したあとで、群衆は暗示に動かされて何も意識しない自動人形同然の状態に落ちるのだから、どの場合にも犯罪的と呼ぶことは難しく思える。この誤った形容をここに残すのは、近年の心理学研究によって定着したからにすぎない。もちろん、行いそれ自体だけを見れば、群衆のある行いは犯罪的だが、それなら、インド人をまず子どもの虎たちに少し引き裂かせて遊ばせ、そのあと自分で食べる虎の行為も同じ意味で犯罪的だ、ということになろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 434
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[439]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-005"
  "source_text": "Les crimes des foules ont généralement pour mobile une suggestion puissante, et les individus qui y ont pris part sont persuadés ensuite qu’ils ont obéi à un devoir, ce qui n’est pas du tout le cas du criminel ordinaire."
  "translation_ja": "群衆の犯罪はたいてい強力な暗示に駆り立てられたもので、加わった個々人は事後、自分たちは義務に従ったのだと確信している。通常の犯罪者はまったくこうはいかない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 435
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[440]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-006"
  "source_text": "L’histoire des crimes commis par les foules met en évidence ce qui précède."
  "translation_ja": "群衆が犯した犯罪の歴史を見れば、以上のことは明らかになる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 436
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[441]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-007"
  "source_text": "On peut citer comme exemple typique le meurtre du gouverneur de la Bastille, M. de Launay. Après la prise de cette forteresse, le gouverneur, entouré d’une foule très excitée, recevait des coups de tous côtés. On proposait de le pendre, de lui couper la tête, ou de l’attacher à la queue d’un cheval. En se débattant, il donna par mégarde un coup de pied à l’un des assistants. Quelqu’un proposa, et sa suggestion fut acclamée aussitôt par la foule, que l’individu atteint par le coup de pied coupât le cou au gouverneur."
  "translation_ja": "典型的な例として、バスティーユの司令官ド・ローネー氏が殺された事件を挙げられる。要塞が陥落すると、司令官はひどく興奮した群衆に囲まれ、四方から殴られた。絞首にしろ、首をはねろ、馬の尾につなげと、さまざまな声が上がった。もがいているうち、彼は居合わせた一人をうっかり蹴った。すると、蹴られた当人が司令官の首を切れとだれかが言い出し、その言葉はたちまち群衆の喝采を受けた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 437
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[442]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c2-008"
  "source_text": "« Celui-ci, cuisinier sans place, demi-badaud qui est allé à la Bastille pour voir ce qui s’y passait, juge que, puisque tel est l’avis général, l’action est patriotique, et croit même mériter une médaille en détruisant un monstre. » […]"
  "translation_ja": "「その男は職のない料理人で、半ば野次馬気分で、何が起きているか見にバスティーユへ来ていた。みんなの意見がそうなら、これは愛国の行いなのだと判断し、怪物を滅ぼせば勲章の値打ちさえあると思った。」〔以下、この段落の末尾を省略。〕"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 438
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[443]"
  "section_id": "b3c2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "partial"
  "issues":

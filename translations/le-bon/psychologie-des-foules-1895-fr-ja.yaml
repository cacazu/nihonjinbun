- "id": "toc-009"
  "source_text": "CHAPITRE II. — Sentiments et moralité des foules. 23"
  "translation_ja": "第二章　群衆の感情と道徳性　23"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

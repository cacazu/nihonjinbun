- "id": "b3c3-013"
  "source_text": "Ces quelques lignes résument très bien le but de l’art oratoire, et nous montrent aussi pourquoi le discours fait d’avance est d’un effet si nul, puisqu’il faut pouvoir à chaque instant modifier les termes employés suivant l’impression produite."
  "translation_ja": "この数行は雄弁術の目的をじつによく要約し、同時に、あらかじめ作った演説の効き目がどうしてあれほど乏しいかを示してくれる。与えた印象に合わせて、一瞬一瞬、用いる表現を変えられねばならないからである。"
  "source_languages":
  - "fr"
  "source_locations":

- "id": "preface-007"
  "source_text": "C’est que l’observation la plus attentive des faits de l’histoire m’a toujours montré que les organismes sociaux étant aussi compliqués que ceux de tous les êtres, il n’est pas du tout en notre pouvoir de leur faire subir brusquement des transformations profondes. La nature est radicale parfois, mais jamais comme nous l’entendons, et c’est pourquoi la manie des grandes réformes est ce qu’il y a de plus funeste pour un peuple, quelque excellentes que ces réformes puissent théoriquement paraître. Elles ne seraient utiles que s’il était possible de changer instantanément l’âme des nations. Or le temps seul possède un tel pouvoir. Ce qui gouverne les hommes, ce sont les idées, les sentiments et les mœurs, choses qui sont en nous-mêmes. Les institutions et les lois sont la manifestation de notre âme, l’expression de ses besoins. Procédant de cette âme, institutions et lois ne sauraient la changer."
  "translation_ja": "というのも、歴史上の事実をどれほど注意深く観察してみても、私の目に映るのはいつも、社会という有機体が生き物の体と同じほど複雑で、急にその根本を作り替えようとしても、とうてい私たちの力の及ぶところではない、ということだったからだ。自然もときには抜本的な変化をもたらすが、それはけっして私たちの思いどおりには起きない。だからこそ、大改革に取りつかれることほど一国の民にとって災いをなすものはない。理屈のうえでその改革がどれほどすばらしく見えようとも、である。国民の魂を一挙に変えられるものなら、そうした改革にも効き目はあろう。だがその力を持つのは時間だけだ。人間を支配するのは思想と感情と習俗、すなわち私たち自身のうちにあるものだ。制度と法律は私たちの魂が形を取ったものであり、その魂の求めるものの表現である。その魂から出てきた制度や法律が、逆に魂を変えることはできない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 40
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[40]"

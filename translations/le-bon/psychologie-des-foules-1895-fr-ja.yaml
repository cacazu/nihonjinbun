  "translation_status": "reviewed"
- "id": "toc-029"
  "source_text": "CHAPITRE II. — Les foules dites criminelles. 147"
  "translation_ja": "第二章　犯罪的と呼ばれる群衆　147"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 600
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[603]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-030"
  "source_text": "Les foules dites criminelles. — Une foule peut être légalement mais non psychologiquement criminelle. — Complète inconscience des actes des foules. — Exemples divers. — Psychologie des septembriseurs. — Leurs raisonnements, leur sensibilité, leur férocité et leur moralité."
  "translation_ja": "犯罪的と呼ばれる群衆。群衆は法律上は犯罪者でありうるが、心理学のうえでは犯罪者とはいえない。群衆の行いのまったくの無自覚性。さまざまな例。九月虐殺の実行者たちの心理。その推論、感じやすさ、残虐さ、その道徳性。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 601
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[133]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-031"
  "source_text": "CHAPITRE III. — Les jurés de cour d’assises. 153"
  "translation_ja": "第三章　重罪院の陪審員　153"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 602
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[604]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-032"
  "source_text": "Les jurés de cour d’assises. — Caractères généraux des jurys. — La statistique montre que leurs décisions sont indépendantes de leur composition. — Comment sont impressionnés les jurés. — Faible action du raisonnement. — Méthodes de persuasion des avocats célèbres. — Nature des crimes pour lesquels les jurés sont indulgents ou sévères. — Utilité de l’institution du jury et danger extrême que présenterait son remplacement par des magistrats."
  "translation_ja": "重罪院の陪審員。陪審の一般的な性質。統計の示すところでは、その決定はどんな人々で構成されるかに左右されない。陪審員の心を動かすもの。推論の効果の弱さ。名高い弁護士たちの説得法。陪審員が寛大な犯罪と、厳しく当たる犯罪の性質。陪審制度の効用と、それを職業裁判官に置き換えることの極度の危険。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 603
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[134]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-033"
  "source_text": "CHAPITRE IV. — Les foules électorales. 161"
  "translation_ja": "第四章　選挙における群衆　161"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 604
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[605]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-034"
  "source_text": "Caractères généraux des foules électorales. — Comment on les persuade. — Qualités que doit posséder le candidat. — Nécessité du prestige. — Pourquoi ouvriers et paysans choisissent si rarement les candidats dans leur sein. — Puissance des mots et des formules sur l’électeur. — Aspect général des discussions électorales. — Comment se forment les opinions de l’électeur. — Puissance des comités. — Ils représentent la forme la plus redoutable de la tyrannie. — Les comités de la Révolution. — Malgré si faible valeur psychologique, le suffrage universel ne peut être remplacé. — Pourquoi les votes seraient identiques, alors même qu’on restreindrait le droit de suffrage à une classe limitée de citoyens. — Ce que traduit le suffrage universel dans tous les pays."
  "translation_ja": "選挙における群衆の一般的な性質。人々はどのように説得されるか。候補者に必要な性質。威信の必要。労働者や農民が自分の仲間から候補者を選ぶことがめったにないわけ。言葉と決まり文句が有権者に及ぼす力。選挙討論のおおよその姿。有権者の意見ができる仕組み。委員会の力。それがもっとも畏るべき専制の形であること。革命期の委員会。心理学的な価値は低くとも、普通選挙には代わるものがない。たとえ選挙権を限られた市民階級に絞っても投票の結果は変わらない理由。どの国でも普通選挙が表しているもの。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 605
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[135]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-035"
  "source_text": "CHAPITRE V. — Les assemblées parlementaires. 171"
  "translation_ja": "第五章　議会　171"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 606
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[606]"
  "section_id": "toc"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "toc-036"
  "source_text": "Les foules parlementaires présentent la plupart des caractères communs aux foules hétérogènes non anonymes. — Simplisme des opinions. — Suggestibilité et limites de cette suggestibilité. — Opinions fixes irréductibles et opinions mobiles. — Pourquoi l’indécision prédomine. — Rôle des meneurs. — Raison de leur prestige. — Ils sont les vrais maîtres d’une assemblée dont les votes ne sont ainsi que ceux d’une petite minorité. — Puissance absolue qu’ils exercent. — Les éléments de leur art oratoire. — Les mots et les images. — Nécessité psychologique pour les meneurs d’être généralement convaincus et bornés. — Impossibilité pour l’orateur sans prestige de faire admettre ses raisons. — L’exagération des sentiments, bons ou mauvais, dans les assemblées. — Automatisme auquel elles arrivent à certains moments. — Les séances de la Convention. — Cas dans lesquels une assemblée perd les caractères des foules. — Influence des spécialistes dans les questions techniques. — Avantages et dangers du régime parlementaire dans tous les pays. — Il est adapté aux nécessités modernes ; mais il entraîne le gaspillage des finances et la restriction progressive de toutes les libertés. — Conclusion de l’ouvrage."
  "translation_ja": "議会という群衆は、匿名でない異質な群衆に共通する性質をほとんど備えている。意見の単純さ。暗示の受けやすさとその限界。動かしがたい定見と移ろいやすい意見。なぜ決めかねることが多いか。指導者の役割。その威信の理由。議会の真の主人は指導者であり、したがって議会の票決が表すのはわずかな少数者の票にすぎない。彼らの振るう絶対の権力。弁論の要素。言葉と像。概して指導者に確信の強さと視野の狭さが必要な心理上の理由。威信のない弁士には自分の言い分を認めさせるすべがない。議会では善い感情も悪い感情も強められる。あるときには議会が自動人形のようになること。国民公会の会議。議会が群衆の特徴を失う場合。専門的な問題における専門家の影響。各国における議会制の利点と危険。議会制は近代の必要にかなうが、公金の浪費と、あらゆる自由が次第に制限される事態をもたらす。本書の結び。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 607

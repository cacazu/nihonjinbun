- "id": "b1c2-023"
  "source_text": "La thèse peut sembler paradoxale. Pour la démontrer à fond, il faudrait reprendre un grand nombre de faits historiques, et plusieurs volumes n’y suffiraient pas."
  "translation_ja": "この主張は逆説的に聞こえるかもしれない。徹底的に立証するには、おびただしい歴史上の事実を改めて取り上げなければならず、数巻の書を費やしても足りまい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 129

- "id": "b2c3-010"
  "source_text": "De meneurs, les peuples n’ont jamais manqué : mais il s’en faut que tous soient animés des convictions fortes qui font les apôtres. Ce sont souvent des rhéteurs subtils, ne poursuivant que des intérêts personnels et cherchant à persuader en flattant de bas instincts. L’influence qu’ils exercent ainsi peut être très grande, mais elle reste toujours très éphémère. Les grands convaincus qui ont soulevé l’âme des foules, les Pierre l’Ermite, les Luther, les Savonarole, les hommes de la Révolution, n’ont exercé de fascination qu’après avoir été eux mêmes d’abord fascinés par une croyance. Ils purent alors créer dans les âmes cette puissance formidable nommée la foi, qui rend l’homme esclave absolu de son rêve."
  "translation_ja": "諸民族に指導者が欠けたことはない。しかし全員が、使徒を生むほど強い確信に動かされているわけでは到底ない。しばしば彼らは口のうまい弁論家にすぎず、自分の利益しか追わず、卑しい本能にこびることで説得しようとする。こうして振るう影響力はきわめて大きいこともあるが、つねにごく短命だ。隠者ピエール、ルター、サヴォナローラ、革命の人々といった、群衆の魂を揺り動かした偉大な確信の人々は、まず自分が信仰に魅せられて初めて、他人を魅了した。そのとき初めて彼らは、人を自らの夢の絶対的な奴隷にする、信仰という恐るべき力を人々の魂に生じさせることができたのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 315
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[322]"
  "section_id": "b2c3s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-011"
  "source_text": "Créer la foi, qu’il s’agisse de foi religieuse, de foi politique ou sociale, de foi en une œuvre, en un personnage, en une idée, tel est surtout le rôle des grands meneurs, et c’est pourquoi leur influence est toujours très grande. De toutes les forces dont l’humanité dispose, la foi a toujours été une des plus grandes, et c’est avec raison que l’Évangile lui attribue le pouvoir de transporter les montagnes. Donner à l’homme une foi, c’est décupler sa force. Les grands événements de l’histoire ont été réalisés par d’obscurs croyants n’ayant guère que leur foi pour eux. Ce n’est pas avec des lettrés et des philosophes, ni surtout avec des sceptiques, qu’ont été édifiées les grandes religions qui ont gouverné le monde, ni les vastes empires qui se sont étendus d’un hémisphère à l’autre."
  "translation_ja": "宗教的信仰であれ、政治や社会への信仰であれ、一つの事業や人物や思想への信仰であれ、その信仰を創り出すのが何よりも大指導者の役目である。だからその影響はつねにきわめて大きい。人類の持つあらゆる力のなかで、信仰はいつも最大のものの一つだった。福音書が、山をも動かす力があるとしたのは、もっともである。一人の人に信仰を与えることは、その力を十倍にすることだ。歴史上の大事件を成し遂げたのは、自らの信仰のほかには何も頼るもののない、無名の信者たちだった。世界を治めた偉大な宗教も、一方の半球から他方へ広がった広大な帝国も、文人や哲学者、ことに懐疑家を集めて築かれたのではない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 316
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[323]"
  "section_id": "b2c3s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-012"
  "source_text": "Mais, dans de tels exemples, il s’agit des grands meneurs, et ils sont assez rares pour que l’histoire en puisse aisément marquer le nombre. Ils forment le sommet d’une série continue descendant de ces puissants manieurs d’hommes à l’ouvrier qui, dans une auberge fumeuse, fascine lentement ses camarades en remâchant sans cesse quelques formules qu’il ne comprend guère, mais dont, selon lui, l’application doit amener sûrement la réalisation de tous les rêves et de toutes les espéances."
  "translation_ja": "だがこれらの例は大指導者のことで、数としては歴史家がたやすく数え上げられるほどまれである。このように強力に人を動かす者から始まって、煙のこもる酒場で、自分でもろくに分かっていないが、その言うとおりにすればあらゆる夢と希望がまちがいなく実現するのだと言って、いくつかの決まり文句を絶えず口の中でかみ返し、少しずつ仲間を魅する労働者に至るまで、指導者には連続した段階がある。大指導者はその頂点に立つ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 317

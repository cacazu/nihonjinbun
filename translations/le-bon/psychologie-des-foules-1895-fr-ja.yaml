  "translation_status": "reviewed"
- "id": "b2c1-008"
  "source_text": "Dans tous les grands événements de l’histoire, nous constatons l’action successive de ces deux ordres de facteurs. La Révolution française — pour ne prendre qu’un des plus frappants exemples — eut parmi ses facteurs lointains les écrits des philosophes, les exactions de la noblesse, les progrès de la pensée scientifique. L’âme des foules, ainsi préparée, fut soulevée ensuite aisément par des facteurs immédiats, tels que les discours des orateurs, et les résistances de la cour à propos de réformes insignifiantes."
  "translation_ja": "歴史上のあらゆる大事件に、この二種類の要因が順を追って働くのが認められる。とりわけ目を引く例を一つだけ取れば、フランス革命には遠因として哲学者たちの著作、貴族の苛斂誅求、科学的思考の進歩があった。こうして準備された群衆の魂を、次には弁士の演説や、ささいな改革に対する宮廷の抵抗といった直接の要因が、たやすく揺り動かした。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 226
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[230]"
  "section_id": "b2c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-009"
  "source_text": "Parmi les facteurs lointains, il y en a de généraux, qu’on retrouve au fond de toutes les croyances et opinions des foules ; ce sont : la race, les traditions, le temps, les institutions, l’éducation."
  "translation_ja": "遠因のうちには、群衆のあらゆる信念と意見の底に見いだされる一般的なものがある。人種、伝統、時間、制度、教育の五つである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 227
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[231]"
  "section_id": "b2c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-010"
  "source_text": "Nous allons étudier le rôle de ces différents facteurs."
  "translation_ja": "次にこれらの要因がそれぞれ果たす役割を調べよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 228
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[232]"

- "id": "b3c4-029"
  "source_text": "Faut-il supposer maintenant qu’avec un suffrage restreint — restreint aux capacités, si l’on veut — on améliorerait les votes des foules ? Je ne puis l’admettre un seul instant, et cela pour les raisons que j’ai déjà dites de l’infériorité mentale de toutes les collectivités, quelle que puisse être leur composition. En foule les hommes s’égalisent toujours, et, sur des questions générales, le suffrage de quarante académiciens n’est pas meilleur que celui de quarante porteurs d’eau. Je ne crois pas du tout qu’aucun des votes tant reprochés au suffrage universel, tel que le rétablissement de l’Empire, par exemple, eût été différent si les votants avaient été recrutés exclusivement parmi des savants et des lettrés. Ce n’est pas parce qu’un individu sait le grec ou les mathématiques, est architecte, vétérinaire, médecin ou avocat, qu’il acquiert sur les questions sociales des clartés particulières. Tous nos économistes sont des gens instruits, professeurs et académiciens pour la plupart. Est-il une seule question générale : protectionnisme, bimétallisme, etc., sur laquelle ils aient réussi à se mettre d’accord ? C’est que leur science n’est qu’une forme très atténuée de l’universelle ignorance. Devant des problèmes sociaux, où entrent de si multiples inconnues, toutes les ignorances s’égalisent."
  "translation_ja": "では、制限選挙を行い、たとえば有能な者に限れば、群衆の票決を改良できると考えるべきだろうか。私は一瞬たりとも認められない。どんな構成であれ、あらゆる集団は知的に劣るとすでに述べた、まさにその理由による。群衆になると人間はいつも同じ水準になり、一般的な問題について、学士院会員四十人の票決は水売り四十人の票決よりもよいわけではない。たとえば帝政の復活など、普通選挙に向けられる非難の元になったどの票決も、投票者を学者と文人だけから選んでいたなら違うものになったとは、私はまるで思わない。ギリシア語や数学を知っているとか、建築家、獣医、医師、弁護士だというだけで、一個人が社会問題に特別の見通しを得るわけではない。わが国の経済学者はだれもが学問を積んでおり、大半は教授や学士院会員だ。保護主義、複本位制等々、一般的な問題でただ一つでも、彼らが意見の一致を見たものがあるだろうか。彼らの学問は、あまねく広がる無知をほんの少し薄めたものにすぎないからだ。あれほど多くの未知数が入り込む社会問題を前にしては、どの無知も横並びになる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 495

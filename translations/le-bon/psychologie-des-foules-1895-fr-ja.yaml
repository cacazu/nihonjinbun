- "id": "b2c4-note-21"
  "section_id": "b2c4s2"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Certaines pages des livres de nos professeurs officiels sont, à ce point de vue, bien curieuses, et montrent à quel point l’esprit critique est peu développé par notre éducation universitaire. Je citerai comme exemple les lignes suivantes extraites de la Révolution française de M. Rambaud, professeur d’histoire à la Sorbonne : « La prise de la Bastille est un fait culminant dans l’histoire non seulement de la France, mais de l’Europe entière ; elle inaugurait une époque nouvelle de l’histoire du monde ! » Quant à Robespierre, nous y apprenions avec stupeur, que « sa dictature fut surtout d’opinion, de persuasion, d’autorité morale ; elle fut une sorte de pontificat entre les mains d’un homme vertueux » ! (P. 91 et 220.)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-21"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-21"
  "translation_ja": "公の教職にあるわが国の教授たちの著作に、この観点からすると非常に興味深いページがいくつかある。わが大学教育によって批判精神がいかにわずかしか育たないかを示している。例として、ソルボンヌ歴史学教授ランボー氏の『フランス革命』から、次の文章を引く。\n\n「バスティーユ占領は、フランスのみならずヨーロッパ全体の歴史における頂点をなす事実である。それは世界史の新時代の開幕であった！」\n\nロベスピエールについては仰天するようなことを教えられた。「彼の独裁は主として世論、説得、道徳的権威の独裁であり、それは有徳の人の手に置かれた一種の教皇職であった」というのだ！（九一、二二〇頁。）"
  "translation_status": "reviewed"
- "id": "b2c4-038"
  "source_text": "Aujourd’hui, devant la discussion et l’analyse, toutes les opinions perdent leur prestige ; leurs angles s’usent vite, et il en survit bien peu qui nous puissent passionner. L’homme moderne est de plus en plus envahi par l’indifférence."
  "translation_ja": "今日、討論と分析にさらされると、あらゆる意見は威信を失う。角はすぐすり減り、なお私たちを熱中させるほどのものはほとんど残らない。近代人は、ますます無関心に蝕まれている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 402
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[410]"
  "section_id": "b2c4s2"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c4-039"
  "source_text": "Ne déplorons pas trop cet effritement général des opinions. Que ce soit un symptôme de décadence dans la vie d’un peuple, on ne saurait le contester. Il est certain que les voyants, les apôtres, les meneurs, les convaincus en un mot, ont une bien autre force que les négateurs, les critiques et les indifférents ; mais n’oublions pas non plus qu’avec la puissance actuelle des foules, si une seule opinion pouvait acquérir assez de prestige pour s’imposer, elle serait bientôt revêtue d’un pouvoir tellement tyrannique que tout devrait aussitôt plier devant elle, et que l’âge de la libre discussion serait clos pour longtemps. Les foules représentent des maîtres pacifiques parfois, comme l’étaient à leurs heures Héliogabale et Tibère ; mais elles ont aussi de furieux caprices. Quand une civilisation est prête à tomber entre leurs mains, elle est à la merci de trop de hasards pour durer bien longtemps. Si quelque chose pouvait retarder un peu l’heure de l’effondrement, ce serait précisément l’extrême mobilité des opinions et l’indifférence croissante des foules pour toute croyance générale."
  "translation_ja": "この意見の全面的な崩れを、あまり嘆かないでおこう。それが一民族の生の衰退を示す徴候であることは否めない。幻視する者、使徒、指導者、つまりは確信の人々が、否定する者、批判する者、関心のない者に比べて、はるかに大きな力を持つことは確かだ。だが、今の群衆の力を思えば、もし一つの意見でも、みなを従わせるほどの威信を手に入れられたなら、それはほどなく、すべてがたちまちひれ伏さねばならぬほど専制的な権力を帯び、自由な討論の時代は長いこと幕を閉じるということも忘れまい。群衆はときに平穏な主人になる。ヘリオガバルスやティベリウスにも、そういう時があったように。だが群衆には荒れ狂う気まぐれもある。一つの文明が群衆の手に落ちかけるとき、それを左右する偶然はあまりに多く、長くは持たない。崩壊の時を少しでも遅らせるものがあるとすれば、それこそ、意見の極端な移りやすさ、そしてあらゆる一般的信念への群衆のますます深まる無関心であろう。"

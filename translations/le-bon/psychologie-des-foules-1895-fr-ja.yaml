- "id": "b2c3-017"
  "source_text": "Mais si l’énergie de ces meneurs est puissante, elle est momentanée et ne survit guère à l’excitant qui l’a fait naître. Rentrés dans le courant de la vie ordinaire, les héros qui en étaient animés font souvent preuve, comme ceux que je citais à l’instant, de la plus étonnante faiblesse. Ils semblent incapables de réfléchir et de se conduire dans les circonstances les plus simples, alors qu’ils avaient si bien su conduire les autres. Ce sont des meneurs qui ne peuvent exercer leur fonction qu’à la condition d’être menés eux-mêmes et excités sans cesse, d’avoir toujours au-dessus d’eux un homme ou une idée, de suivre une ligne de conduite bien tracée."
  "translation_ja": "しかし、こうした指導者の活力は強力だが一時のもので、それを生じさせた刺激が消えるとほとんど続かない。平凡な日々の流れに戻れば、それに動かされていた英雄たちは、いま挙げた人たちのように、しばしばまったく意外なほどの弱さを見せる。他人をあれほどよく率いつつ、ごく簡単な状況でさえ、考えることも身の振り方を決めることもできないかに見える。このたぐいの指導者がその機能を果たすには、自分もまた導かれ、不断に刺激され、自分より上につねにだれか人か、ひとつの思想を持ち、はっきり敷かれた行動の線に沿うのでなければならない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 322

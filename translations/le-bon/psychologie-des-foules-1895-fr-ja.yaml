- "id": "b2c3-016"
  "source_text": "On peut établir une division assez tranchée dans la classe des meneurs. Les uns sont des hommes énergiques, à volonté forte, mais momentanée ; les autres, beaucoup plus rares que les précédents, sont des hommes possédant une volonté à la fois forte et durable. Les premiers sont violents, braves, hardis. Ils sont utiles surtout pour diriger un coup de main, entraîner les masses malgré le danger, et transformer en héros les recrues de la veille. Tels, par exemple, Ney et Murat, sous le premier Empire. Tel encore, de nos jours, Garibaldi, aventurier sans talent, mais énergique, réussissant avec une poignée d’hommes à s’emparer de l’ancien royaume de Naples défendu pourtant par une armée disciplinée."
  "translation_ja": "指導者のあいだには、かなり明瞭な区別ができる。一方は活動力にあふれ、強いが一時の意志を持つ人々である。それよりずっとまれなもう一方は、強く、しかも長続きする意志を持つ人々だ。前者は激しく、勇敢で、大胆である。とくに一挙の行動を率い、危険を前にしても人々を引き連れ、昨日の新兵を英雄に変えることに向いている。第一帝政のネイやミュラがその例だ。今日でいえば、才能はないが活力に満ちた冒険家ガリバルディもそうである。規律ある軍隊に守られた旧ナポリ王国を、ひと握りの人間とともに手に入れるのに成功した。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 321
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[328]"
  "section_id": "b2c3s1"

- "id": "b2c1-037"
  "source_text": "Mais sur ce point, comme sur bien d’autres, les idées démocratiques se sont trouvées en profond désaccord avec les données de la psychologie et de expérience. Plusieurs philosophes éminents, Herbert Spencer entre autres, n’ont pas eu de peine à montrer que l’instruction ne rend l’homme ni plus moral ni plus heureux, qu’elle ne change pas ses instincts et ses passions héréditaires ; qu’elle est parfois – pour peu qu’elle soit mal dirigée – beaucoup plus pernicieuse qu’utile. Les statisticiens sont venus confirmer ces vues en nous disant que la criminalité augmente avec la généralisation de l’instruction, ou tout au moins d’une certaine instruction ; que les pires ennemis de la société, les anarchistes, se recrutent souvent parmi les lauréats des écoles ; et, dans un travail récent, un magistrat distingué, M. Adolphe Guillot, faisait remarquer qu’on compte maintenant 3.000 criminels lettrés contre 1.000 illettrés, et que, en cinquante ans, la criminalité est passée de 227 pour 400.000 habitants, à 552, soit une augmentation de 133 p. 100. Il a noté également avec tous ses collègues que la criminalité augmente surtout chez les jeunes gens pour lesquels l’école gratuite et obligatoire a, comme on sait, remplacé le patronat."
  "translation_ja": "だがほかの多くの点と同じく、この点でも民主主義の理念は心理学と経験の示すところと大きく食い違った。ハーバート・スペンサーをはじめ、何人もの卓越した哲学者が、知識を与えても人は道徳的にも幸福にもならず、代々伝わった本能と情熱も変わらないこと、少しでも方向を誤れば、益よりもはるかに害になりうることを、難なく示した。統計家たちもこうした見方を裏づける話をする。教育、少なくともある種の教育が普及するにつれ犯罪が増える。社会のもっとも悪い敵、無政府主義者のなかには、学校で賞を取った者がしばしばいる。すぐれた司法官アドルフ・ギヨ氏も最近の著作で、今では読み書きのできない犯罪者千人に対し、できる犯罪者は三千人を数え、五十年で犯罪件数は人口四十万人当たり二百二十七から五百五十二へ、すなわち百三十三パーセント増加したと指摘している。〔訳注：二百二十七から五百五十二への増加率は約百四十三パーセント。ここでは原文の数値をそのまま掲げた。〕また同僚の司法官たちとともに、犯罪がとくに増加しているのは、周知のように親方の下に入ることに代わって無償の義務教育を受けることになった若者たちであることにも注目している。"

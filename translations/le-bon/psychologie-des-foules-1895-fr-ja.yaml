  "translation_status": "reviewed"
- "id": "b3c4-006"
  "source_text": "La première des conditions à posséder pour le candidat est le prestige. Le prestige personnel ne peut être remplacé que par celui de la fortune. Le talent, le génie même ne sont pas des éléments bien sérieux de succès."
  "translation_ja": "候補者にとって第一の条件は威信である。個人としての威信に代わりうるのは財産の威信だけだ。才能、天才でさえも、成功の要素としてさほど重くない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 472
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[481]"
  "section_id": "b3c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c4-007"
  "source_text": "Cette nécessité pour le candidat de posséder du prestige, c’est-à-dire de pouvoir s’imposer sans discussion, est capitale. Si les électeurs, dont la majorité est composée d’ouvriers et de paysans, choisissent si rarement un des leurs pour les représenter, c’est que les personnalités sorties de leurs rangs n’ont pour eux aucun prestige. Quand, par hasard, ils nomment un de leurs égaux, c’est le plus souvent pour des raisons accessoires, par exemple pour contrecarrer un homme éminent, un patron puissant dans la dépendance duquel se trouve chaque jour l’électeur, et dont il a ainsi l’illusion de devenir pour un instant le maître."
  "translation_ja": "候補者に威信が必要である、つまり問答抜きに自分を認めさせる力が必要であるということは、決定的に重要だ。有権者は多数が労働者や農民なのに、代表として仲間の一人をめったに選ばない。それは、自分たちの列から出た人物には、彼らからすれば何の威信もないからだ。たまたま自分たちと同じ身分の者を選ぶ場合も、たいていは副次的な理由からである。たとえば、日々有権者がその力に頼っている有力者なり勢力のある雇い主なりに一矢報い、自分のほうがほんの一瞬その主人になれたような気になるためだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 473
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[482]"
  "section_id": "b3c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c4-008"
  "source_text": "Mais la possession du prestige ne suffit pas pour assurer au candidat le succès. L’électeur tient à ce qu’on flatte ses convoitises et ses vanités ; il faut l’accabler des plus extravagantes flagorneries, ne pas hésiter à lui faire les plus fantastiques promesses. S’il est ouvrier, on ne saurait trop injurier et flétrir ses patrons. Quant au candidat adverse, on doit tâcher de l’écraser en établissant par affirmation, répétition et contagion qu’il est le dernier des gredins, et que personne n’ignore qu’il a commis plusieurs crimes. Inutile, bien entendu, de chercher aucun semblant de preuve. Si l’adversaire connaît mal la psychologie des foules, il essaiera de se justifier par des arguments, au lieu de se borner à répondre aux affirmations par d’autres affirmations ; et il n’aura dès lors aucune chance de triompher."
  "translation_ja": "しかし威信があるだけでは、候補者の成功は保証されない。有権者は自分の欲や虚栄をくすぐってほしがる。度外れたお世辞を浴びせ、このうえなく途方もない約束をすることをためらってはならない。有権者が労働者なら、その雇い主をどれほどひどくののしり、汚名を着せてもやりすぎにはならない。相手方の候補については、その男が悪党中の悪党で、いくつも犯罪を犯したことは知らぬ者がいないのだと、断言と反復と伝染で定着させ、押しつぶそうとすることになる。むろん証拠らしきものを探す必要もない。対立候補が群衆の心理をよく知らなければ、断言には別の断言を返すだけにせず、論拠を挙げて身の潔白を証明しようとするだろう。となれば、もう勝つ見込みは一切ない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 474
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[483]"
  "section_id": "b3c4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c4-009"
  "source_text": "Le programme écrit du candidat ne doit pas être trop catégorique, parce que ses adversaires pourraient le lui opposer plus tard ; mais son programme verbal ne saurait être trop excessif. Les réformes les plus considérables peuvent être promises sans crainte. Sur le moment, ces exagérations produisent beaucoup d’effet, et pour l’avenir elles n’engagent en rien. Il est d’observation constante, en effet, que l’électeur ne s’est jamais préoccupé de savoir jusqu’à quel point l’élu a suivi la profession de foi acclamée, et sur laquelle l’élection est supposée avoir eu lieu."
  "translation_ja": "候補者が書いて示す綱領は、あまり断定的であってはならない。後になってそれを反対者に突きつけられるかもしれないからだ。しかし口で語る綱領は、どれほど度を越してもかまわない。きわめて重大な改革も安心して約束できる。その場でこの誇張はひどくよく効くし、将来については何も拘束しない。実際、歓呼に迎えられ、当選の根拠とされたはずの政見表明に、当選した者がどの程度従ったのかなど、有権者が気にかけたためしはないというのが、つねに観察されることである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 475
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[484]"
  "section_id": "b3c4"

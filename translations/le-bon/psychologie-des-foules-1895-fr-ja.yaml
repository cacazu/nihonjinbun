- "id": "b1c3-015"
  "source_text": "Il ne faut pas croire, en effet, que c’est simplement parce que la justesse d’une idée est démontrée qu’elle peut produire ses effets, même chez les esprits cultivés. On s’en rend vite compte en voyant combien la démonstration la plus claire a peu d’influence sur la majorité des hommes. L’évidence, si elle est éclatante, pourra être reconnue par un auditeur instruit ; mais ce nouveau converti sera vite ramené par son inconscient à ses conceptions primitives. Revoyez-le au bout de quelques jours, et il vous servira de nouveau ses anciens arguments, exactement dans les mêmes termes. Il est, en effet, sous l’influence d’idées antérieures devenues des sentiments ; et ce sont celles-là seules qui agissent sur les mobiles profonds de nos actes et de nos discours. Il ne saurait en être autrement pour les foules."
  "translation_ja": "実際、ある思想が正しいと証明されさえすれば効果を現すと思ってはいけない。相手が教養ある人たちであってもそうだ。どんなに明快な証明も、大多数の人間にほとんど影響を及ぼさないのを見れば、それはすぐ分かる。明々白々な証拠を、教養ある聞き手はひとまず認めるかもしれない。だが、そのにわか改宗者はすぐ、自分の無意識に引かれて元の考えに戻る。数日してもう一度会ってみると、以前の議論をまるで同じ言い回しで、またもやあなたに聞かせるだろう。実のところ、その人は感情となった古くからの思想に左右されており、私たちの行いや言葉の奥深くにある動機に働きかけるのは、そのような思想だけなのだ。群衆の場合だけ、別でありえようはずもない。"

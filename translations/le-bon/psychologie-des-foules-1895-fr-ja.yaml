- "id": "b3c3-002"
  "source_text": "Les Jurés de cour d’assises."
  "translation_ja": "重罪院の陪審員"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 451
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[83]"
  "section_id": "b3c3"

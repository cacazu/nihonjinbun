- "id": "intro-005"
  "source_text": "L’époque actuelle constitue un de ces moments critiques où la pensée des hommes est en voie de se transformer."
  "translation_ja": "今はちょうど、人間のものの考え方が姿を変えつつある、そうした転機の一つにあたる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 51
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[52]"
  "section_id": "intro"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-006"
  "source_text": "Deux facteurs fondamentaux sont à la base de cette transformation. Le premier est la destruction des croyances religieuses, politiques et sociales d’où dérivent tous les éléments de notre civilisation. Le second est la création de conditions d’existence et de pensée entièrement nouvelles, par suite des découvertes modernes des sciences et de l’industrie."
  "translation_ja": "この転換の根底には二つの要因がある。第一は、私たちの文明のあらゆる要素がそこから発した宗教上・政治上・社会上の信念の崩壊。第二は、近代の科学と産業の発見が、生き方にも考え方にも、まったく新しい条件を生み出したことである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 52
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[53]"
  "section_id": "intro"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-007"
  "source_text": "Les idées du passé, bien qu’à demi détruites, étant très puissantes encore, et les idées qui doivent les remplacer n’étant qu’en voie de formation, l’âge moderne représente une période de transition et d’anarchie."
  "translation_ja": "過去の思想は半ば崩れながらも、なお強い力を持ち、それに代わるはずの思想はまだ形をなしつつあるにすぎない。近代とはそれゆえ、過渡と無秩序の時代である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 53
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[54]"
  "section_id": "intro"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-008"
  "source_text": "De cette période, forcément un peu chaotique, il n’est pas aisé de dire maintenant ce qui pourra sortir un jour. Quelles seront les idées fondamentales sur lesquelles s’édifieront les sociétés qui succéderont à la nôtre ? Nous ne le savons pas encore. Mais ce que, dès maintenant, nous voyons bien, c’est que, pour leur organisation, elles auront à compter avec une puissance nouvelle, dernière souveraine de l’âge moderne : la puissance des foules. Sur les ruines de tant d’idées, tenues pour vraies jadis et qui sont mortes aujourd’hui, de tant de pouvoirs que les révolutions ont successivement brisés, cette puissance est la seule qui se soit élevée, et elle paraît devoir absorber bientôt les autres. Alors que toutes nos antiques croyances chancellent et disparaissent, que les vieilles colonnes des sociétés s’effondrent tour à tour, la puissance des foules est la seule force que rien ne menace et dont le prestige ne fasse que grandir. L’âge où nous entrons sera véritablement l’ère des foules."
  "translation_ja": "どうしてもいくらか混沌とせざるをえないこの時代から、いずれ何が生まれるかは、今は容易に言えない。私たちの社会に取って代わる社会は、何を根本の理念として築かれるのか。それはまだ分からない。ただ、その新しい社会が自らを組み立てようとすれば、一つの新しい力、近代最後の主権者たる群衆の力を無視できないことだけは、今からはっきり見えている。かつて真理とされ今は死んだ多くの思想、相次ぐ革命に打ち砕かれた多くの権力。その廃墟のうえに、ただ一つ立ち上がったのがこの力であり、やがてほかの力をことごとくのみ込むかに見える。古来の信念がことごとく揺らぎ消え、社会を支えた古い柱が次々に崩れてゆくなかで、群衆の力だけは何ものにも脅かされず、その威光は増す一方である。私たちがいま足を踏み入れる時代こそ、まさしく群衆の時代となるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 54
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[55]"
  "section_id": "intro"

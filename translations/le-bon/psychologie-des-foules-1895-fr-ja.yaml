- "id": "toc-010"
  "source_text": "§ 1. Impulsivité, mobilité et irritabilité des foules. — La foule est le jouet de toutes les excitations extérieures et en reflète les incessantes variations. — Les impulsions auxquelles elle obéit sont assez impérieuses pour que l’intérêt personnel s’efface. — Rien n’est prémédité chez les foules. — Action de la race. — § 2. Suggestibilité et crédulité des foules. — Leur obéissance aux suggestions. — Les images évoquées dans leur esprit sont prises par elles pour des réalités. — Pourquoi ces images sont semblables pour tous les individus qui composent une foule. — Égalisation du savant et de l’imbécile dans une foule. — Exemples divers des illusions auxquelles tous les individus d’une foule sont sujets. — Impossibilité d’accorder aucune créance au témoignage des foules. — L’unanimité de nombreux témoins est une des plus mauvaises preuves qu’on puisse invoquer pour établir un fait. — Faible valeur des livres d’histoire. — § 3. Exagération et simplisme des sentiments des foules. Les foules ne connaissent ni le doute ni l’incertitude et vont toujours aux extrêmes. — Leurs sentiments sont toujours excessifs. — § 4. Intolérance, autoritarisme et conservatisme des foules. — Raisons de ces sentiments. — Servilité des foules devant une autorité forte. — Les instincts révolutionnaires momentanés des foules ne les empêchent pas d’être extrêmement conservatrices. — Elles sont d’instinct hostiles aux changements et au progrès. — § 5. Moralité des foules. La moralité des foules peut, suivant les suggestions, être beaucoup plus basse ou beaucoup plus haute que celle des individus qui les composent. — Explication et exemples. — Les foules ont rarement pour guide l’intérêt qui est, le plus souvent, le mobile exclusif de l’individu isolé. — Rôle moralisateur des foules."
  "translation_ja": "一　群衆の衝動性、移り気、怒りやすさ。群衆はあらゆる外からの刺激に翻弄され、その絶え間ない変化を映す。群衆が従う衝動は、個人の利害が消え失せるほど強い。群衆は何一つあらかじめ計らない。人種の作用。二　群衆の暗示の受けやすさと信じやすさ。暗示への服従。心に呼び起こされた像を現実と受け取ること。群衆を構成するすべての個人にとって、その像が似通うのはなぜか。群衆のなかで学者も愚か者も同じになること。一つの群衆のだれもが陥りうる錯覚の諸例。群衆の証言には少しも信を置けないこと。多くの証人の一致は、ある事実を立証するために持ち出せる証拠のうち、もっとも頼りないものの一つである。歴史書の価値の乏しさ。三　群衆の感情の誇張と単純さ。群衆は疑いも不確かさも知らず、いつも極端へと向かう。その感情はつねに度を越す。四　群衆の不寛容、権威主義、保守性。そうした感情の理由。強い権威への群衆の卑屈な服従。群衆に一時の革命的本能があっても、その極端な保守性は妨げられない。群衆は本能的に変化と進歩に敵意を抱く。五　群衆の道徳性。群衆の道徳性は、受ける暗示によって、群衆を構成する個々人の道徳性よりはるかに低くも、はるかに高くもなりうる。その説明と例。単独の人間を動かす唯一のものとなることの多い利己心に、群衆が導かれることはめったにない。人を道徳的にする群衆の働き。"

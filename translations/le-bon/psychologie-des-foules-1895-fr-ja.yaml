- "id": "b1c2-005"
  "source_text": "On remarquera que, parmi les caractères spéciaux des foules, il en est plusieurs, tels que l’impulsivité, l’irritabilité, l’incapacité de raisonner, l’absence de jugement et d’esprit critique, l’exagération des sentiments, et d’autres encore, que l’on observe également chez les êtres appartenant à des formes inférieures d’évolution, tels que la femme, le sauvage et l’enfant ; mais c’est là une analogie que je n’indique qu’en passant. Sa démonstration sortirait du cadre de cet ouvrage. Elle serait inutile, d’ailleurs, pour les personnes au courant de la psychologie des primitifs, et resterait toujours peu convaincante pour celles qui ne la connaissent pas."
  "translation_ja": "群衆に特有の性質には、衝動性、怒りやすさ、推論ができないこと、判断力や批判精神の欠如、感情の誇張などがいくつもある。これと同じものが、女性、いわゆる野蛮人、子どもといった、進化のより低い段階に属する存在にも観察されることに気づくだろう。だがこの類似には一言触れておくだけにする。それを立証するのは本書の範囲を出る。それに、いわゆる原始の人々の心理に通じた者にはその立証は無用だし、通じていない者には、いくら立証してみてもさして説得力はあるまい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 111
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[113]"

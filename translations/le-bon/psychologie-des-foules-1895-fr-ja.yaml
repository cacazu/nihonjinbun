- "id": "b2c1-038"
  "source_text": "Ce n’est pas certes, et personne ne l’a jamais soutenu, que l’instruction bien dirigée ne puisse donner des résultats pratiques fort utiles, sinon pour élever la moralité, au moins pour développer les capacités professionnelles. Malheureusement les peuples latins, surtout depuis vingt-cinq ans, ont basé leurs systèmes d’instruction sur des principes très erronés, et, malgré les observations des esprits les plus éminents, tels que Bréal, Fustel de Coulanges, Taine et bien d’autres, ils persistent dans leurs lamentables erreurs. J’ai moi-même, dans un ouvrage déjà ancien, montré que notre éducation actuelle transforme en ennemis de la société la plupart de ceux qui l’ont reçue, et recrute de nombreux disciples pour les pires formes du socialisme."
  "translation_ja": "むろん、正しく方向づけられた教育なら、道徳性の向上まではいかなくても、少なくとも職業能力を伸ばす点で、実際にたいへん役立つ結果を出せないわけではない。そんな主張をした人はだれもいない。ところが残念ながら、ラテン諸民族はとくにこの二十五年来、はなはだ誤った原則の上に教育制度を築いてきた。ブレアル、フュステル・ド・クーランジュ、テーヌ、その他多くの卓越した人々の指摘にもかかわらず、その嘆かわしい誤りに固執している。私自身もすでにだいぶ前に書いた著作で、私たちの現行の教育が、それを受けた者の大半を社会の敵に変え、もっともたちの悪い種類の社会主義に数多くの信徒を集めてやっていることを示した。"
  "source_languages":
  - "fr"
  "source_locations":

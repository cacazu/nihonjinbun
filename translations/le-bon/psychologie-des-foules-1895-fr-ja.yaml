- "id": "b3c3-note-23"
  "section_id": "b3c3"
  "kind": "note_body"
  "origin": "source"
  "source_text": "La magistrature représente, en effet, la seule administration dont les actes ne soient soumis à aucun contrôle. Malgré toutes ses révolutions, la France démocratique ne possède pas ce droit d’habeas corpus dont l’Angleterre est si fière. Nous avons banni tous les tyrans ; mais dans chaque cité nous avons établi un magistrat qui dispose à son gré de l’honneur et de la liberté des citoyens. Un petit juge d’instruction, à peine sorti de l’école de droit, possède le pouvoir révoltant d’envoyer à son gré en prison, sur une simple supposition de culpabilité de sa part, et dont il ne doit la justification à personne, les citoyens les plus considérables. Il peut les y garder six mois ou même un an sous prétexte d’instruction, et les relâcher ensuite sans leur devoir ni indemnité, ni excuses. Le mandat d’amener est absolument l’équivalent de la lettre de cachet, avec cette différence que cette dernière, si justement reprochée à l’ancienne monarchie, n’était à la portée que de très grands personnages, alors qu’elle est aujourd’hui entre les mains de toute une classe de citoyens, qui est loin de passer pour la plus éclairée et la plus indépendante."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-23"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-23"
  "translation_ja": "実のところ司法は、その行為がなんの監督も受けない唯一の行政機関である。あれほど革命を繰り返しながら、民主的なフランスには、イギリスが誇りとする人身保護令状の権利がない。私たちはあらゆる暴君を追い払った。だが都市ごとに、市民の名誉と自由を意のままにできる司法官を置いた。法学校を出たばかりの一介の予審判事が、自分が有罪と推測しただけで、しかもその根拠をだれにも示さずに、重きをなす市民を好きなときに投獄できるという、腹立たしい権力を持っている。予審を口実に半年、あるいは一年も拘禁を続け、その後は補償も釈明もなしに釈放できる。勾引状はまったく王の封印状に等しい。ただし、旧王政のものとして当然の非難を受ける後者は、ごく一部の高位者にしか手にできなかったのに、今日それと同じものは、啓発され独立しているとの評判にはほど遠い一階層の市民すべての手にある。"
  "translation_status": "reviewed"
- "id": "b3c3-017"
  "source_text": "Sachant très bien ce qu’est la psychologie des castes, et ce qu’est aussi la psychologie des autres catégories de foules, je ne vois aucun cas où, accusé à tort d’un crime, je ne préférerais pas avoir affaire à des jurés plutôt qu’à des magistrats. J’aurais beaucoup de chances d’être reconnu innocent avec les premiers, et très peu avec les seconds. Redoutons la puissance des foules, mais redoutons beaucoup plus encore la puissance de certaines castes. Les premières peuvent se laisser convaincre, les secondes ne fléchissent jamais."
  "translation_ja": "カーストの心理がいかなるものか、またほかの種類の群衆の心理がいかなるものかをよく知っている私は、罪を着せられた場合、司法官よりも陪審員を相手にする方を選ばない場合など、ひとつも思い浮かばない。前者、すなわち陪審員を相手にすれば無罪と認められる見込みは大きく、司法官ならばごく小さい。群衆の力をおそれよう。だが、ある種のカーストの力は、それ以上におそれよう。前者は説得に耳を貸すことがあるが、後者はけっして折れない。"

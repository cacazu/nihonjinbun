  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c3-031"
  "source_text": "Tout ce qui frappe l’imagination des foules se présente sous forme d’une image saisissante et bien nette, dégagée de toute interprétation accessoire, ou n’ayant d’autre accompagnement que quelques faits merveilleux ou mystérieux : une grande victoire, un grand miracle, un grand crime, un grand espoir. Il faut présenter les choses en bloc, et ne jamais en indiquer la genèse. Cent petits crimes ou cent petits accidents ne frapperont pas du tout l’imagination des foules ; tandis qu’un seul grand crime, un seul grand accident les frapperont profondément, même avec des résultats infiniment moins meurtriers que les cent petits accidents réunis. L’épidémie d’influenza qui, il y a peu d’années, fit périr, à Paris seulement, 5.000 personnes en quelques semaines, frappa très peu l’imagination populaire. Cette véritable hécatombe ne se traduisait pas, en effet, par quelque image visible, mais seulement par les indications hebdomadaires de la statistique. Un accident qui, au lieu de ces 5.000 personnes, en eût seulement fait périr 500, mais le même jour, sur une place publique, par un accident bien visible, la chute de la tour Eiffel, par exemple, eût au contraire produit sur l’imagination une impression immense. La perte probable d’un transatlantique qu’on supposait, faute de nouvelles, coulé en pleine mer, frappa profondément pendant huit jours l’imagination des foules. Or les statistiques officielles montrent que dans la seule année de 1894, 850 navires à voiles et 203 à vapeur ont été perdus. Mais, de ces pertes successives, bien autrement importantes comme destruction de vies et de marchandises qu’eût pu l’être celle du transatlantique en question, les foules ne se sont pas préoccupées un seul instant."
  "translation_ja": "群衆の想像力を打つものは、いずれもくっきりと人目をひく像の形を取り、付随的な解釈を一切まとわず、あるいは、いくつかの驚異的、神秘的な事実を伴うだけで現れる。大勝利、大奇跡、大犯罪、大いなる希望というように。物事はひとまとめに示されねばならず、どのように生じたかを示してはならない。小さな犯罪が百件、小さな事故が百件起きても、群衆の想像力はまるで動かされない。だがたった一つの大犯罪や大事故なら、それら百件を合わせたよりもはるかに少ない犠牲で済んだとしても、群衆は深く心を打たれる。数年前にインフルエンザが流行し、パリだけで、数週間のうちに五千人が死んだが、民衆の想像力に残した印象はごくわずかだった。このまぎれもない大量死は、目に見える一つの像にならず、ただ週ごとの統計の数字になっただけだからだ。逆に、五千人ではなく五百人しか死ななかったとしても、同じ日に、一つの広場で、たとえばエッフェル塔が倒れるような、はっきり目に見える事故だったとすれば、想像力には途方もない印象を残したはずである。ある大西洋航路の客船が消息を絶ち、外洋に沈んだらしいという報せは、八日間も群衆の想像力を深く占めた。ところで公式統計によれば、一八九四年の一年だけで、帆船八百五十隻、汽船二百三隻が失われている。けれども、次々に起きたそれらの海難は、人命や積荷の損失において当の大西洋航路船一隻が失われた場合などとは比べものにならぬほど重大だったのに、群衆は一瞬たりとも気にかけなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

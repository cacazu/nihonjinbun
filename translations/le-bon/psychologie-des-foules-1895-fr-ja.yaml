  "source_text": "« Sur ces mots, orateurs et auditeurs s’invectivent et en viennent aux mains ; les chaises, les bancs, les tables entrent en scène, etc., etc. »"
  "translation_ja": "「その言葉をきっかけに弁士も聴衆も互いに悪態をつき、つかみ合いになる。いすも長いすもテーブルも登場、等々、等々」。"

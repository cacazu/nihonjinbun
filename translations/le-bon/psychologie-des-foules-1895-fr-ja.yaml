- "id": "b1c1-028"
  "source_text": "Donc, évanouissement de la personnalité consciente, prédominance de la personnalité inconsciente, orientation par voie de suggestion et de contagion des sentiments et des idées dans un même sens, tendance à transformer immédiatement en actes les idées suggérées, tels sont les principaux caractères de l’individu en foule. Il n’est plus lui-même, il est devenu un automate que sa volonté ne guide plus."
  "translation_ja": "してみると、意識する人格の消失、無意識の人格の優位、暗示と伝染を通じて感情や考えが一つの方向を取ること、暗示された考えを即座に行いに変えようとする傾き、これらが群衆のなかの個人の主要な性質である。もはやその人自身ではなく、みずからの意志に導かれない自動人形になっている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 102

- "id": "b2c2-025"
  "source_text": "§ 3. – L’EXPÉRIENCE"
  "translation_ja": "第三節　経験"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 295
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[53]"
  "section_id": "b2c2s3"

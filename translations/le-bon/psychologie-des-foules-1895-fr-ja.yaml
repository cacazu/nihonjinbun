- "id": "b2c3-051"
  "source_text": "Il faut se souvenir de cette étonnante puissance de fascination pour comprendre ce merveilleux retour de l’île d’Elbe ; cette conquête immédiate de la France par un homme isolé, ayant devant lui toutes les forces organisées d’un grand pays, qu’on pouvait croire lassé de sa tyrannie. Il n’eut qu’à regarder les généraux envoyés pour s’emparer de lui, et qui avaient juré de s’en emparer. Tous se soumirent sans discussion."
  "translation_ja": "エルバ島からのあの驚くべき帰還を理解するには、このかくも異様なほどの魅惑の力を思い出さねばならない。専制に飽き飽きしていたと思ってもよさそうな大国の、整然と組織された全力を前に、一人きりの人間が、たちまちフランスを征服したのだ。彼がしたことは、自分を捕らえるため遣わされ、捕らえると誓った将軍たちに目をやっただけだった。ことごとく、問答もなく服した。"

- "id": "b2c2-note-15"
  "section_id": "b2c2s4"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Mes premières observations sur l’art d’impressionner les foules et sur les faibles ressources qu’offrent sur ce point les règles de la logique remontent à l’époque du siège de Paris, le jour où je vis conduire au Louvre, où siégeait alors le gouvernement, le maréchal V…, qu’une foule furieuse prétendait avoir surpris levant le plan des fortifications pour le vendre aux Prussiens. Un membre du gouvernement, G. P…, orateur fort célèbre, sortit pour haranguer la foule qui réclamait l’exécution immédiate du prisonnier. Je m’attendais à ce que l’orateur démontrât l’absurdité de l’accusation, en disant que le maréchal accusé était précisément un des constructeurs de ces fortifications dont le plan se vendait d’ailleurs chez tous les libraires. À ma grande stupéfaction – j’étais fort jeune alors – le discours fut tout autre. « Justice sera faite, cria l’orateur en s’avançant vers le prisonnier, et une justice impitoyable. Laissez le gouvernement de la défense nationale terminer votre enquête. Nous allons, en attendant, enfermer l’accusé. » Calmée aussitôt par cette satisfaction apparente, la foule s’écoule, et au bout d’un quart d’heure le maréchal put regagner son domicile. Il eût été infailliblement écharpé si l’orateur eût tenu à la foule en fureur les raisonnements logiques que ma grande jeunesse me faisaient trouver très convaincants."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-15"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-15"
  "translation_ja": "群衆を動かす技と、この点で論理の規則がいかにわずかな手だてしか与えないかについて、私が最初に観察したのは、パリ包囲戦の時代のことだ。ある日、怒った群衆がＶ……元帥を、そのころ政府が置かれていたルーヴルに引いてゆくのを見た。要塞の図面をプロイセン人に売るために測量しているところをつかまえた、というのだ。政府の一員で、たいへん有名な弁士であったＧ・Ｐ……が外に出てきて、捕らえた者をすぐに処刑せよと要求する群衆に語りかけた。私は、訴えられた元帥はほかならぬこの要塞の設計者の一人であり、そもそもその図面はどの書店にも売っているではないかと言って、弁士が告発の馬鹿らしさを証明するものと思った。ところが、当時私は実に若かったのだが、たいそう驚いたことに、演説はまるで違った。「裁きは下される」と、弁士は捕らえられた者の方へ進みながら叫んだ。「しかも容赦のない裁きだ。諸君の捜査の仕上げは国防政府に任せたまえ。その間、被告人は監禁しておこう」。見かけの満足を与えられて群衆はたちまち静まり、散っていった。十五分後には元帥は自宅に帰れた。もし弁士が怒り狂う群衆に、年の若い私にはじつに説得力があると思えたあの理屈を聞かせていたなら、元帥はまず間違いなく殺されていたであろう。"
  "translation_status": "reviewed"
- "id": "b2c2-032"
  "source_text": "Les esprits logiques, habitués à être convaincus par des chaînes de raisonnements un peu serrées, ne peuvent s’empêcher d’avoir recours à ce mode de persuasion quand ils s’adressent aux foules, et le manque d’effet de leurs arguments les surprend toujours. « Les conséquences mathématiques usuelles fondées sur le syllogisme, c’est-à-dire sur des associations d’identités, écrit un logicien, sont nécessaires… La nécessité forcerait l’assentiment même d’une masse inorganique, si celle-ci était capable de suivre des associations d’identités. » Sans doute ; mais la foule n’est pas plus capable que la masse inorganique de les suivre, ni même de les entendre. Qu’on essaie de convaincre par un raisonnement des esprits primitifs, des sauvages ou des enfants, par exemple, et l’on se rendra compte de la faible valeur que possède ce mode d’argumentation."
  "translation_ja": "論理的な人々は、ある程度しっかりした一連の推論によって自分が納得するのに慣れているから、群衆に話しかけるときにも、この説得法に頼らずにはいられない。そして自分の論拠がさっぱり効かないのに、いつも驚く。ある論理学者は書いている。「三段論法、すなわち同一性の結びつきを基礎とする通常の数学的帰結は必然である。……同一性の結びつきをたどることさえできれば、無機物の塊でさえ、その必然性の前に同意を強いられるだろう」。なるほど。だが群衆には無機物の塊と同じく、それをたどることも、そもそもその意味を聞き取ることもできない。いわゆる原始人や子どもといった、原初の段階にある精神を推論によって納得させようとしてみれば、この論じ方にどれほどわずかな値打ちしかないかが分かるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

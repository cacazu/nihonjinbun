  "translation_status": "reviewed"
- "id": "b2c2-005"
  "source_text": "Dans la première partie de cet ouvrage nous avons étudié les sentiments, les idées, les raisonnements des collectivités ; et, de cette connaissance, on pourrait évidemment déduire d’une façon générale les moyens d’impressionner leur âme. Nous savons déjà ce qui frappe l’imagination des foules, la puissance et la contagion des suggestions, surtout de celles qui se présentent sous forme d’images. Mais les suggestions pouvant être d’origine fort diverses, les facteurs capables d’agir sur l’âme des foules peuvent être assez différents. Il est donc nécessaire de les examiner séparément. Ce n’est pas là une inutile étude. Les foules sont un peu comme le sphinx de la fable antique : il faut savoir résoudre les problèmes que leur psychologie nous pose, ou se résigner à être dévoré par elles."
  "translation_ja": "本書の第一編では、集団の感情と思想と推論を調べた。その知識から集団の魂に印象を刻む手立てを、おおまかながら導き出せるのは当然だ。何が群衆の想像力を打つか、暗示、とりわけ像の形で現れる暗示の力と伝染性がどのようなものかは、すでに分かっている。だが暗示の出どころは非常にさまざまだから、群衆の魂に働きかけうる要因もかなり異なりうる。したがって別々に調べる必要がある。これは無用な研究ではない。群衆はどこか古代の物語に出てくるスフィンクスに似ている。その心理が私たちに投げかける謎を解けるようにならなければ、食われる覚悟をせねばならないのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

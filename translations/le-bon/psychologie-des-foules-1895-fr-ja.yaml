- "id": "b2c1-051"
  "source_text": "« Aux trois étages de l’instruction, pour l’enfance, l’adolescence et la jeunesse, la préparation théorique et scolaire sur des bancs, par des livres, s’est prolongée et surchargée, en vue de l’examen, du grade, du diplôme et du brevet, en vue, de cela seulement, et par les pires moyens, par l’application d’un régime antinaturel et antisocial, par le retard excessif de l’apprentissage pratique, par l’internat, par l’entraînement artificiel et le remplissage mécanique, par le surmenage, sans considération du temps qui suivra, de l’âge adulte et des offices virils que l’homme fait exercera, abstraction faite du monde réel où tout à l’heure le jeune homme va tomber, de la société ambiante à laquelle il faut l’adapter ou le résigner d’avance, du conflit humain où pour se défendre et se tenir debout, il doit être, au préalable, équipé, armé, exercé, endurci. Cet équipement indispensable, cette acquisition plus importante que toutes les autres, cette solidité du bon sens, de la volonté et des nerfs, nos écoles ne la lui procurent pas ; tout au rebours ; bien loin de le qualifier, elles le disqualifient pour sa condition prochaine et définitive. Partant, son entrée dans le monde et ses premiers pas dans le champ de l’action pratique ne sont, le plus souvent, qu’une suite de chutes douloureuses ; il en reste meurtri, et, pour longtemps, froissé, parfois estropié à demeure. C’est une rude et dangereuse épreuve ; l’équilibre moral et mental s’y altère, et court risque de ne pas se rétablir ; la désillusion est venue, trop brusque et trop complète ; les déceptions ont été trop grandes et les déboires trop forts[11]. »"
  "translation_ja": "「幼年、少年、青年のための教育の三段階すべてで、学校の腰かけの上で本を使う理論上の準備が、長く引き延ばされ、詰め込み過ぎになっている。試験と学位と免状と証書のため、ただそれだけのために、しかももっとも悪い手段でそうなった。不自然で反社会的な制度を当てはめ、実地の修業をひどく遅らせ、寄宿舎に入れ、人工的な訓練と機械的な詰め込みをし、過労に追い込む。その後に来る時期、成人期と、一人前の男が果たすであろう役割は考えに入れない。若者がたちまち投げ出される現実世界も、あらかじめ慣らしておくか、さもなくば覚悟させておく必要のある周囲の社会も、身を守り立っていられるように、前もって装備を整え、武装し、訓練し、鍛えておくべき人間同士の争いも、考慮の外である。この不可欠な装備、ほかのどんな習得にもまして重要なもの、すなわち良識と意志と神経の確かさを、わが国の学校は与えない。まるで逆だ。ほどなく生涯のものとして定まる境遇に若者を適するようにするどころか、適さないようにする。したがって、社会に出て、実際に行動する領域に踏み出す最初の歩みは、たいてい、痛みを伴う転倒の連続にすぎない。それがあざとなって残り、長く心を傷つけ、ときには回復できないほどの痛手となる。これは厳しく危険な試練である。心情と知性の均衡は崩れ、二度と戻らないおそれがある。幻滅はあまりに突然で、あまりに徹底している。失望はあまりに大きく、苦い思いはあまりに激しい［11］」。"

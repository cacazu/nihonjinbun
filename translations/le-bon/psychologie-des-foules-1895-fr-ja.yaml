  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-004"
  "source_text": "Les grands bouleversements qui précèdent les changements de civilisations, tels que la chute de l’Empire romain et la fondation de l’Empire arabe par exemple semblent, au premier abord, déterminés surtout par des transformations politiques considérables : invasions de peuples ou renversements de dynasties. Mais une étude plus attentive de ces événements montre que, derrière leurs causes apparentes, se trouve le plus souvent, comme cause réelle, une modification profonde dans les idées des peuples. Les véritables bouleversements historiques ne sont pas ceux qui nous étonnent par leur grandeur et leur violence. Les seuls changements importants, ceux d’où le renouvellement des civilisations découle, s’opèrent dans les idées, les conceptions et les croyances. Les événements mémorables de l’histoire sont les effets visibles des invisibles changements de la pensée des hommes. Si ces grands événements se manifestent si rarement c’est qu’il n’est rien d’aussi stable dans une race que le fond héréditaire de ses pensées."
  "translation_ja": "ローマ帝国の滅亡やアラブ帝国の建設など、文明の交代に先立つ大動乱は、一見、もっぱら民族の侵入や王朝の転覆といった政治上の大変革によって起きたように見える。だがこれらの出来事をもっとよく調べると、表向きの原因の背後には、たいてい真の原因として、諸民族の思想の深い変化がある。歴史を真に揺り動かすのは、その規模と激しさで私たちを驚かす事件ではない。重要な変化、すなわち文明を一新させる変化は、ただ思想と観念と信念のうちで起きる。歴史に銘記される出来事は、人間の考え方に起きた目に見えない変化が、目に見える形で現れた結果だ。このような大事件がめったに起きないのは、ある人種において、その考え方の底にあって代々伝わるものほど変わりにくいものはないからだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

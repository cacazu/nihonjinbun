- "id": "b2c3-045"
  "source_text": "Les grands meneurs de foules, tels que Bouddha, Jésus, Mahomet, Jeanne d’Arc, Napoléon, ont possédé à un haut degré cette forme de prestige ; et c’est surtout par elle qu’ils se sont imposés. Les dieux, les héros et les dogmes s’imposent et ne se discutent pas ; ils s’évanouissent même dès qu’on les discute."
  "translation_ja": "仏陀、イエス、ムハンマド、ジャンヌ・ダルク、ナポレオンなど、群衆を率いる偉大な人々は、この形の威信を高い程度に備えており、とくにそれによって人々を従わせた。神々も英雄も教義も、問答抜きに受け入れられるのであって、議論の対象にはならない。議論されるや否や、消えてしまうことさえある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "b2c2-013"
  "source_text": "Et le mot liberté, que pouvait-il signifier de semblable à ce que nous comprenons aujourd’hui, à une époque où la possibilité de la liberté de penser n’était même pas soupçonnée, et où il n’y avait pas de forfait plus grand et plus rare que de discuter les dieux, les lois et les coutumes de la cité ? Un mot comme celui de patrie, que signifiait-il dans l’âme d’un Athénien ou d’un Spartiate, sinon le culte d’Athènes ou de Sparte, et nullement celui de la Grèce, composée de cités rivales et toujours en guerre. Le même mot de patrie, quel sens avait-il chez les anciens Gaulois divisés en tribus rivales, de races, de langues et de religions différentes, que César vainquit facilement parce qu’il eut toujours parmi elles des alliées. Rome seule donna à la Gaule une patrie en lui donnant l’unité politique et religieuse. Sans même remonter si loin, et en reculant de deux siècles à peine, croit-on que le même mot de patrie était conçu comme aujourd’hui par des princes français, tels que le grand Condé, s’alliant à l’étranger contre leur souverain ? Et le même mot encore n’avait-il pas un sens bien différent du sens moderne pour les émigrés, qui croyaient obéir aux lois de l’honneur en combattant la France, et qui à leur point de vue y obéissaient en effet, puisque la loi féodale liait le vassal au seigneur et non à la terre, et que là où était le souverain, là était la vraie patrie."
  "translation_ja": "それに「自由」という言葉が、はたして今日私たちが理解するのと似た何を意味しえたのか。ものを考える自由がありうるとは思いもよらず、都市の神々、法や慣習について論議する以上に大きく、またまれな重罪はなかった時代のことだ。「祖国」のような言葉が、アテナイ人やスパルタ人の心で意味したのは、アテナイやスパルタをあがめること以外の何だったろう。互いに競い、つねに争う都市から成るギリシアをあがめることなど、まったく意味しなかった。同じ「祖国」という言葉は、古代ガリア人の間でどんな意味を持ったのか。彼らは人種も言葉も宗教も違う対立する部族に分かれ、カエサルはそのうちにつねに味方を得たので、やすやすと勝利した。政治と宗教の統一を与えることによってガリアに一つの祖国を与えたのはローマだけだ。それほど遠くまでさかのぼらず、ほんの二世紀ほど昔に戻るだけでも、大コンデのように自国の主君に逆らって外国と同盟を結んだフランスの諸侯が、この「祖国」の語を今日と同じように捉えていたと思えるだろうか。また、フランスと戦うことが名誉の掟に従うことだと信じた亡命貴族にとっても、この語の意味は近代のそれとはずいぶん違わなかったろうか。封建の掟が家臣を結びつけたのは土地にではなく領主に対してであり、君主のいるところが真の祖国だったのだから、彼らの立場からすれば、たしかに名誉の掟に従ったのである。"
  "source_languages":

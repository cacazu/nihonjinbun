- "id": "b2c2-014"
  "source_text": "Nombreux sont les mots dont le sens a ainsi profondémont changé d’âge en âge, et que nous ne pouvons arriver à comprendre comme on les comprenait jadis qu’après un long effort. On a dit avec raison qu’il faut beaucoup de lecture pour arriver seulement à concevoir ce que signifiaient pour nos arrière-grands-pères des mots tels que le roi et la famille royale. Qu’est-ce alors pour des termes plus complexes encore ?"
  "translation_ja": "こうして時代ごとに意味が大きく変わり、昔の人のように理解しようとすれば長い努力を要する言葉は多い。ほんの私たちの曽祖父たちにとって、「王」「王家」などの言葉が何を意味したかを思い描けるようになるだけで、ずいぶん読み物を重ねねばならないとは、正当な指摘だ。もっと複雑な語ならば、いったいどうであろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 284
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[291]"
  "section_id": "b2c2s1"

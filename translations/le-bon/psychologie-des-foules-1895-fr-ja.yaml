- "id": "b3c4-016"
  "source_text": "« … Le parti allemaniste avait organisé, hier soir, à la salle du Commerce, rue du Faubourg-du-Temple, une grande réunion préparatoire à la fête des Travailleurs du premier mai. Le mot d’ordre était : « Calme et tranquillité »."
  "translation_ja": "「……昨晩、フォーブール＝デュ＝タンプル街の商業会館で、アルマーヌ派が五月一日の労働者の祭りに備える大集会を催した。合言葉は『落ち着いて、静かに』。"

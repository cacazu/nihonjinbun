- "id": "b2c3-028"
  "source_text": "Lorsqu’une affirmation a été suffisamment répétée, et qu’il y a unanimité dans la répétition, comme cela est arrivé pour certaines entreprises financières célèbres assez riches pour acheter tous les concours, il se forme ce qu’on appelle un courant d’opinion et le puissant mécanisme de la contagion intervient. Dans les foules, les idées, les sentiments, les émotions, les croyances possèdent un pouvoir contagieux aussi intense que celui des microbes. Ce phénomène est très naturel puisqu’on l’observe chez les animaux eux-mêmes dès qu’il sont en foule. Le tic d’un cheval dans une écurie est bientôt imité par les autres chevaux de la même écurie. Une panique, un mouvement désordonné de quelques moutons s’étend bientôt à tout le troupeau. Chez l’homme en foule toutes les émotions sont très rapidement contagieuses, et c’est ce qui explique la soudaineté des paniques. Les désordres cérébraux, comme la folie, sont eux-mêmes contagieux. On sait combien est fréquente l’aliénation chez les médecins aliénistes. On a même cité récemment des formes de folie, l’agoraphobie par exemple, communiquées de l’homme aux animaux."
  "translation_ja": "ある断言が十分に繰り返され、しかも、あらゆる協力者を金で買えるほど裕福な、ある有名な金融事業で起きたように、その反復が満場一致になると、いわゆる世論の流れが生じ、強力な伝染の仕組みが働き出す。群衆のなかで、思想、感情、心の動き、信念は、微生物のそれに劣らない強烈な伝染力を持つ。これはきわめて自然な現象である。動物にしても、群れになるや否や同じことが見られるからだ。ある馬が厩舎で癖を見せると、同じ厩舎のほかの馬がすぐまねる。数頭の羊が怯えて不規則に走ると、それがほどなく群れ全体に及ぶ。群衆のなかの人間では、あらゆる心の動きはたいへん速く伝染する。恐慌が突如起きるのもこれで説明できる。精神の病のような脳の障害さえ伝染する。精神科医に精神の病がどれほど多いかは知られている。近ごろは、たとえば広場恐怖のような、ある種の精神の病が人間から動物に伝わった例まで引かれている。"
  "source_languages":

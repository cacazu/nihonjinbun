- "id": "b2c3-014"
  "source_text": "L’autorité des meneurs est très despotique, et n’arrive même à s’imposer qu’à cause de ce despotisme. On a remarqué souvent combien facilement ils se faisaient obéir, bien que n’ayant aucun moyen d’appuyer leur autorité, dans les couches ouvrières les plus turbulentes. Ils fixent les heures de travail, le taux des salaires, décident les grèves, les font commencer et cesser à heure fixe."
  "translation_ja": "指導者の権威はひどく専制的で、むしろこの専制によってしか、その権威を認めさせられない。もっとも騒がしい労働者層のあいだで、権威を裏打ちする手段を何一つ持たないのに、指導者がどれほどたやすく命に従わせるかは、しばしば指摘されてきた。彼らは労働時間と賃金の額を定め、ストライキを決定し、決めた時刻に始めさせ、終わらせる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 319
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[326]"

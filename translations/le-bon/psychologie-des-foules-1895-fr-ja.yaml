- "id": "intro-015"
  "source_text": "D’universels symptômes, visibles chez toutes les nations, nous montrent l’accroissement rapide de la puissance des foules, et ne nous permettent pas de supposer que cette puissance doive cesser bientôt de grandir. Quoi qu’elle nous apporte, nous devrons le subir. Toute dissertation contre elle ne représente que vaines paroles. Certes il est possible que l’avènement des foules marque une des dernières étapes des civilisations de l’Occident, un retour complet vers ces périodes d’anarchie confuse qui semblent devoir toujours précéder l’éclosion de chaque société nouvelle. Mais comment l’empêcherions-nous ?"
  "translation_ja": "どの国民にも見える共通の兆候が、群衆の力が急速に増していることを物語る。それが近く頭打ちになるなどと考える余地はない。その力が何を運んでこようと、私たちはそれを引き受けるしかない。それに反対する論説は、どれもむなしい言葉でしかない。なるほど、群衆の登場は、西洋文明の終わりに近い一段階であって、新しい社会が生まれるたびにその前触れとして必ずやってくるかに見える、あの混沌と無秩序の時期への全面的な逆戻りを意味するのかもしれない。だが、私たちにどうやってそれを阻めようか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 61
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[62]"
  "section_id": "intro"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-016"
  "source_text": "Jusqu’ici ces grandes destructions de civilisations trop vieilles ont constitué le rôle le plus clair des foules. Ce n’est pas, en effet, d’aujourd’hui seulement que ce rôle apparaît dans le monde. L’histoire nous dit qu’au moment où les forces morales sur lesquelles reposait une civilisation ont perdu leur empire, la dissolution finale est effectuée par ces foules inconscientes et brutales assez justement qualifiées de barbares. Les civilisations n’ont été créées et guidées jusqu’ici que par une petite aristocratie intellectuelle, jamais par les foules. Les foules n’ont de puissance que pour détruire. Leur domination représente toujours une phase de barbarie. Une civilisation implique des règles fixes, une discipline, le passage de l’instinctif au rationnel, la prévoyance de l’avenir, un degré élevé de culture, conditions que les foules, abandonnées à elles-mêmes, se sont toujours montrées absolument incapables de réaliser. Par leur puissance uniquement destructive, elles agissent comme ces microbes qui activent la dissolution des corps débilités ou des cadavres. Quand l’édifice d’une civilisation est vermoulu, ce sont toujours les foules qui en amènent l’écroulement. C’est alors qu’apparaît leur principal rôle, et que, pour un instant, la philosophie du nombre semble la seule philosophie de l’histoire."
  "translation_ja": "これまで、老いすぎた文明のこうした大破壊こそ、群衆のもっとも明瞭な役割であった。その役割が世に姿を見せたのは、なにも今日に始まることではない。一つの文明を支えていた精神的な力が支配力を失うと、その最後の解体を成し遂げるのは、野蛮人という呼び名もあながち的外れでない、無意識で乱暴な群衆なのだと歴史は告げている。今日に至るまで、文明を作り、その進む道を決めたのは、ひと握りの知的貴族であって、群衆がそうした例はない。群衆に力があるのは破壊するときだけである。その支配はいつも野蛮の時期を意味する。文明が成り立つには、定まった規則、規律、本能から理性への移行、先々を見通すこと、高度な教養が要る。群衆をそのなすに任せておけば、これらの条件を整えることがまったくできないのは、いつも示されてきた。ひたすら破壊に働くその力は、衰弱した肉体や死体の分解を早める微生物のそれに似ている。文明の建物が虫食いですかすかになると、それを倒壊させるのはいつも群衆である。そのとき初めて群衆の主たる役割は姿を現し、一時の間、数こそすべてだとする哲学が、ただ一つの歴史哲学であるかに見える。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 62

  "translation_status": "reviewed"
- "id": "b3c5-037"
  "source_text": "« Quand il a pris place à la tribune, il tire de sa serviette un dossier qu’il étale méthodiquement devant lui et débute avec assurance."
  "translation_ja": "「演壇に立つと彼は鞄から一綴りの書類を出し、目の前にきちょうめんに広げ、確信をもって話しはじめる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 535
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[545]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-038"
  "source_text": "Il se flatte de faire passer dans l’âme des auditeurs la conviction qui l’anime. Il a pesé et repesé ses arguments ; il est tout bourré de chiffres et de preuves ; il est sûr d’avoir raison. Toute résistance, devant l’évidence qu’il apporte, sera vaine. Il commence, confiant dans son bon droit et aussi dans l’attention de ses collègues, qui certainement ne demandent qu’à s’incliner devant la vérité."
  "translation_ja": "自分を突き動かす確信はきっと聴き手の魂にも移るだろうと思っている。論拠は何度となく吟味した。数字も証拠も頭にいっぱいで、自分が正しいことを確信している。持参した動かぬ証拠の前には、いかなる抵抗もむなしいはずだ。自分の言い分の正しさを信じ、同僚の注意もこちらに向いていると信じて話しはじめる。同僚も、真理の前に頭を下げたいとしか思っていないにきまっているではないか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 536
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[546]"
  "section_id": "b3c5"

- "id": "b2c3-046"
  "source_text": "Les grands personnages que je viens de citer possédaient leur puissance fascinatrice bien avant de devenir illustres, et ils ne le fussent pas devenus sans elle. Il est évident, par exemple, que Napoléon, au zénith de la gloire, exerçait, par le seul fait de sa puissance, un prestige immense ; mais ce prestige, il en était doué déjà en partie alors qu’il n’avait aucun pouvoir et était complètement inconnu. Lorsque, général ignoré, il fut envoyé par protection commander l’armée d’Italie, il tomba au milieu de rudes généraux qui s’apprêtaient à faire un dur accueil au jeune intrus que le Directoire leur expédiait. Dès la première minute, dès la première entrevue, sans phrases, sans gestes, sans menaces, au premier regard du futur grand homme, ils étaient domptés. Taine donne, d’après les mémoires des contemporains, un curieux récit de cette entrevue."
  "translation_ja": "いま挙げた大人物たちは、有名になるずっと前から人を魅する力を持っていた。それがなければ有名になりもしなかったろう。たとえば、栄光の絶頂にあるナポレオンが、その権力だけで途方もない威信を振るったことは明らかだが、それをある程度まで備えていたのは、彼が何の力もなくまったく無名だったころからである。名も知られぬ将軍が、後ろ盾を得てイタリア方面軍の指揮に派遣されたとき、古強者の将軍たちは、総裁政府が送ってきた若い闖入者に手ひどい歓迎をお見舞いしようと待ちかまえていた。ところが最初の一瞬、初めの会見で、気のきいたせりふも、身ぶりも、脅しもなかったのに、のちの大人物に一目見られただけで彼らは手なずけられた。テーヌは同時代の人々の回想録に基づいて、この会見について興味深く伝えている。"

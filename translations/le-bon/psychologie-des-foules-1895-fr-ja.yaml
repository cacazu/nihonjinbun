- "id": "b2c1-004"
  "source_text": "Nous venons d’étudier la constitution mentale des foules. Nous connaissons leurs façons de sentir, de penser, de raisonner. Nous allons examiner maintenant comment naissent et s’établissent leurs opinions et leurs croyances."
  "translation_ja": "ここまで、群衆の心のつくりを調べてきた。群衆がどのように感じ、考え、推論するかは分かった。今度は、その意見と信念がどのように生まれ、根づくのかを見てみよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 222
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[226]"
  "section_id": "b2c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-005"
  "source_text": "Les facteurs qui déterminent ces opinions et ces croyances sont de deux ordres : les facteurs lointains et les facteurs immédiats."
  "translation_ja": "これらの意見と信念を決める要因には二種類ある。遠くから準備する要因と、すぐに働く要因である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 223
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[227]"
  "section_id": "b2c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-006"
  "source_text": "Les facteurs lointains sont ceux qui rendent les foules capables d’adopter certaines convictions et absolument inaptes à se laisser pénétrer par d’autres. Ces facteurs préparent le terrain où l’on voit germer tout à coup certaines idées nouvelles, dont la force et les résultats étonnent, mais qui n’ont de spontané que l’apparence. L’explosion et la mise en œuvre de certaines idées chez les foules présentent quelquefois une soudaineté foudroyante. Ce n’est là qu’un effet superficiel, derrière lequel on doit chercher tout un long travail antérieur."
  "translation_ja": "遠くからの要因は、ある種の確信を群衆が受け入れられるようにし、ほかの種類の確信はまるで入り込めないようにする。こうして土壌が整えられ、私たちはやがて、いくつかの新しい思想が突然芽を出し、その力と結果で人を驚かすのを見ることになる。だがひとりでに生まれたかに見えるのは表面だけである。群衆のなかである思想が噴き出し、実行に移される様子が、雷に打たれたように突発的なこともある。だがそれは表面の効果にすぎず、その背後には、先立つ長い働きの全体を探さねばならない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 224
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[228]"
  "section_id": "b2c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-007"
  "source_text": "Les facteurs immédiats sont ceux qui, se superposant à ce long travail, sans lequel ils n’auraient pas d’effet, provoquent la persuasion active chez les foules, c’est-à-dire font prendre forme à l’idée et la déchaînent avec toutes ses conséquences. Par ces facteurs immédiats surgissent les résolutions qui soulèvent brusquement les collectivités ; par eux éclate une émeute ou se décide une grève ; par eux des majorités énormes portent un homme au pouvoir ou renversent un gouvernement."
  "translation_ja": "直接の要因は、それだけでは効果を持たず、あの長い働きの上に重なって初めて、群衆のうちに行動を伴う確信を呼び起こす。つまり、思想に形を与え、そこに含まれる結果をもろともに解き放つ。この直接の要因で、集団を急に奮い立たせる決意が生じる。暴動が起き、あるいはストライキが決まる。圧倒的多数が一人の男を権力の座につけたり、政府を倒したりする。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 225
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[229]"
  "section_id": "b2c1"

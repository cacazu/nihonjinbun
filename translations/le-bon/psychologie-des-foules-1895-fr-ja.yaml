  "translation_status": "reviewed"
- "id": "b1c3-017"
  "source_text": "Il leur faut bien longtemps, aux idées, pour s’établir dans l’âme des foules, mais il ne leur faut pas moins de temps pour en sortir. Aussi les foules sont-elles toujours, au point de vue des idées, en retard de plusieurs générations sur les savants et les philosophes. Tous les hommes d’État savent bien aujourd’hui ce que contiennent d’erroné les idées fondamentales que je citais à l’instant, mais comme leur influence est très puissante encore, ils sont obligés de gouverner suivant des principes à la vérité desquels ils ne croient plus."
  "translation_ja": "思想が群衆の魂に根づくまでには実に長い時間がかかる。しかしそこから抜け去るまでには、それに劣らぬ時間がかかる。だから思想という点では、群衆はいつも学者や哲学者に数世代遅れている。いま私が挙げた根本思想が何を誤っているかは、今日の政治家ならだれもがよく知っている。だがその影響力はまだずいぶん強いので、自分でももはや真理と信じてはいない原理に沿って、統治せざるをえないのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

  "translation_status": "reviewed"
- "id": "b1c2-018"
  "source_text": "Aussi, errant toujours sur les limites de l’inconscience, subissant aisément toutes les suggestions, ayant toute la violence de sentiments propre aux êtres qui ne peuvent faire appel aux influences de la raison, dépourvue de tout esprit critique, la foule ne peut qu’être d’une crédulité excessive. L’invraisemblable n’existe pas pour elle, et il faut bien se le rappeler pour comprendre la facilité avec laquelle se créent et se propagent les légendes et les récits les plus invraisemblables[2]."
  "translation_ja": "このように群衆は、つねに無意識との境をさまよい、どんな暗示にもたやすく従い、理性の働きに訴えることのできない者特有の感情の激しさをあますところなく備え、しかも批判する心がまるでない。とすれば、何でも信じすぎるほど信じるのもやむをえない。群衆にとってありそうもないなどということはない。どれほど荒唐無稽な伝説や物語でもたやすく生まれ、広がるわけを理解するには、このことをよく覚えておかなければならない［2］。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b3c5-056"
  "source_text": "« Depuis cette époque la législation a suivi le cours que j’indiquais. Des mesures dictatoriales, se multipliant rapidement, ont continuellement tendu à restreindre les libertés individuelles, et cela de deux manières : des réglementations ont été établies, chaque année en plus grand nombre, qui imposent une contrainte au citoyen là où ses actes étaient auparavant complètement libres, et le forcent à accomplir des actes qu’il pouvait auparavant accomplir ou ne pas accomplir, à volonté. En même temps des charges publiques, de plus en plus lourdes, surtout locales, ont restreint davantage sa liberté en diminuant cette portion de ses profits qu’il peut dépenser à sa guise, et en augmentant la portion qui lui est enlevée pour être dépensée selon le bon plaisir des agents publics. »"
  "translation_ja": "「あの時以来、立法は私の示した道を進んできた。独裁的な措置は急速に増え、次の二つの仕方で絶え間なく個人の自由を制限する方向に働いてきた。まず規制が設けられ、その数は年を追って増えた。以前は市民がまったく自由に行動できたところに拘束を課し、以前は望みに応じてしてもしなくてもよかった行為を強いるのである。それと同時に、とりわけ地方でますます重くなる公の負担が、市民の利得のうち好きに使える部分を減らし、公務員の意のままに使われるため取り上げられる部分を増すことで、その自由をさらに狭めてきた。」"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 554
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[564]"

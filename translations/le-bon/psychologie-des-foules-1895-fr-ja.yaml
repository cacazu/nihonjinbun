- "id": "b3c5-043"
  "source_text": "L’histoire de la Révolution montre à quel point les assemblées peuvent devenir inconscientes et obéir aux suggestions les plus contraires à leurs intérêts. C’était un sacrifice énorme pour la noblesse de renoncer à ses privilèges, et pourtant, dans une nuit célèbre de la Constituante, elle le fit sans hésiter. C’était une menace permanente de mort pour les conventionnels de renoncer à leur inviolabilité, et pourtant ils le firent et ne craignirent pas de se décimer réciproquement, sachant bien cependant que l’échafaud où ils envoyaient aujourd’hui des collègues leur était réservé demain. Mais ils étaient arrivés à ce degré d’automatisme complet que j’ai décrit, et aucune considération ne pouvait les empêcher de céder aux suggestions qui les hypnotisaient. Le passage suivant des mémoires de l’un d’eux, Billaud-Varennes, est absolument typique sur ce point : « Les décisions que l’on nous reproche tant, dit-il, nous ne les voulions pas le plus souvent deux jours, un jour auparavant : la crise seule les suscitait. » Rien n’est plus juste."
  "translation_ja": "革命史を見れば、議会がどこまで無自覚になり、自分の利益にこれほど反する暗示に従いうるかが分かる。貴族にとって特権の放棄は莫大な犠牲だったが、憲法制定議会のかの有名な一夜、彼らはためらわずにそれを行った。国民公会議員にとって不逮捕特権の放棄は、死の脅威にさらされ続けることだった。だが彼らはそれも行い、互いに相手を次々と粛清するのを恐れなかった。今日同僚を送り込む処刑台が明日は自分を待っているとよく知っていながら、である。しかし彼らは、私が描いたとおり、すっかり自動人形のようになっていた。どんな思慮も、彼らを催眠状態に置く暗示に屈するのを防ぎえなかった。この点でまさに典型的なのが、その一人ビヨー＝ヴァレンヌの回想録の一節である。「あれほどわれわれを責める種にされている決定も、たいてい、その二日前、いや前日でさえ、われわれは望んでいなかった。危機だけがそれを生み出したのだ」。これ以上正しい言葉はない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b3c5-061"
  "source_text": "Cette restriction progressive de toutes les libertés chez certains peuples, malgré une licence extérieure qui leur donne l’illusion de les posséder, semble être une conséquence de leur vieillesse tout autant que celle d’un régime quelconque. Elle constitue un des symptômes précurseurs de cette phase de décadence à laquelle aucune civilisation n’a pu échapper jusqu’ici."
  "translation_ja": "いくつかの民族に見られるこの、あらゆる自由が次第に制限される事態は、外見上の放縦が自由をもつという幻想を与えてはいるものの、特定の政体のせいであるのと少なくとも同じだけ、それらの民族の老衰のせいだと思われる。それは、これまでどんな文明も逃れられなかったあの衰退期の到来を告げる徴候の一つである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 559
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[570]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-062"
  "source_text": "Si l’on en juge par les enseignements du passé et par des symptômes qui éclatent de toutes parts, plusieurs de nos civilisations modernes sont arrivées à cette phase d’extrême vieillesse qui précède la décadence. Il semble que des phases identiques soient fatales pour tous les peuples, puisque l’on voit si souvent l’histoire en répéter le cours."
  "translation_ja": "過去の教えと、至る所で目に付く徴候から判断すれば、近代の文明のいくつかはすでに、衰退に先立つこの極度の老衰期に達している。同じ段階をたどることは、すべての民族にとって避けられないように見える。歴史がその経過を繰り返すのを、かくもしばしば見るからである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 560
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[571]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-063"
  "source_text": "Ces phases d’évolution générale des civilisations, il est facile de les marquer sommairement, et c’est avec leur résumé que se terminera notre ouvrage."
  "translation_ja": "文明の発展に共通するこれらの段階は、あらましをたどるのが容易である。その概観をもって本書を結ぶことにしよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 561
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[572]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-064"
  "source_text": "Si nous envisageons dans leurs grandes lignes la genèse de la grandeur et de la décadence des civilisations qui ont précédé la nôtre, que voyons-nous ?"
  "translation_ja": "われわれに先立った諸文明について、その偉大さと衰退がどう生じたのかを大筋から眺めれば、何が目に入るだろうか。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 562
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[574]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-065"
  "source_text": "À l’aurore de ces civilisations une poussière d’hommes, d’origines variées, réunie par les hasards des migrations, des invasions et des conquêtes. De sangs divers, de langues et de croyances également diverses, ces hommes n’ont de lien commun que la loi à demi reconnue d’un chef. Dans ces agglomérations confuses se retrouvent au plus haut degré les caractères psychologiques des foules. Elles en ont la cohésion momentanée, les héroïsmes, les faiblesses, les impulsions et les violences. Rien n’est stable en elles. Ce sont des barbares."
  "translation_ja": "これらの文明の夜明けにあるのは、出自を異にする人々がちりのように散らばっていたところへ、移住、侵入、征服の偶然が寄せ集めた一団である。血筋が異なり、言葉も信仰も同じように異なる彼らには、ある首長の掟を半ば認めているというほか、共通の結び目はない。こうした雑然たる集まりには、群衆の心理的特徴がもっとも著しい形で現れる。そこにあるのは群衆のつかのまの結束、その数々の英雄的な振る舞い、弱さ、衝動、暴力である。安定しているものは何ひとつない。彼らは野蛮人である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 563
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[575]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-066"
  "source_text": "Puis le temps accomplit son œuvre. L’identité des milieux, la répétition des croisements, les nécessités d’une vie commune, agissent lentement. L’agglomération d’unités dissemblables commence à se fusionner et à former une race, c’est-à-dire un agrégat possédant des caractères et des sentiments communs, que l’hérédité va fixer de plus en plus. La foule est devenue un peuple, et ce peuple va pouvoir sortir de la barbarie."
  "translation_ja": "やがて時がその仕事を果たす。同じ環境の下にあること、血が幾度も交わること、生活を共にする必要があることが、ゆっくりと作用する。互いに似ていない個々の単位の集まりが、溶け合って一つの人種を形づくりはじめる。すなわち、共通の性格と感情をもち、遺伝によってそれらがますますしっかり定着していく集合体となる。群衆は一つの民族になったのであり、この民族は野蛮を脱することができるようになる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 564
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[576]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-067"
  "source_text": "Il n’en sortira tout à fait pourtant que quand, après de longs efforts, des luttes sans cesse répétées et d’innombrables recommencements, il aura acquis un idéal. Peu importe la nature de cet idéal, que ce soit le culte de Rome, la puissance d’Athènes ou le triomphe d’Allah, il suffira pour donner à tous les individus de la race en voie de formation une parfaite unité de sentiments et de pensées."
  "translation_ja": "だが完全にそこを脱するのは、長い努力と絶えず繰り返される闘争、無数のやり直しのあと、一つの理想を獲得した時だけである。それがどんな理想かはたいして重要ではない。ローマを崇拝することでも、アテナイの権勢でも、アッラーの勝利でも、形を取りつつある人種のすべての成員に、感情と思想の完全な統一を与えるには十分であろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 565
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[577]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-068"
  "source_text": "C’est alors que peut naître une civilisation nouvelle avec ses institutions, ses croyances et ses arts. Entraînée par son rêve, la race acquerra successivement tout ce qui donne l’éclat, la force et la grandeur. Elle sera foule encore sans doute à certaines heures, mais alors, derrière les caractères mobiles et changeants des foules, se trouvera ce substratum solide, l’âme de la race, qui limite étroitement l’étendue des oscillations d’un peuple et règle le hasard."
  "translation_ja": "そのときこそ、新しい文明が、その制度、信仰、芸術を伴って生まれうる。夢に引かれて人種は、輝き、力、偉大さを生み出す一切を次々と獲得するだろう。むろんある時にはまだ群衆にもなる。だがそのときは、群衆の移りやすく変わりやすい性質の背後に、人種の魂という堅固な基盤があって、民族の揺れ動く幅を狭い範囲にとどめ、偶然をも律するのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 566
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[578]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-069"
  "source_text": "Mais, après avoir exercé son action créatrice, le temps commence cette œuvre de destruction à laquelle n’échappent ni les dieux ni les hommes. Arrivée à un certain niveau de puissance et de complexité, la civilisation cesse de grandir, et, dès qu’elle ne grandit plus, elle est condamnée à décliner bientôt. L’heure de la vieillesse va sonner pour elle."
  "translation_ja": "しかし時間は、創造の働きを果たしたあと、神々も人間も逃れられない破壊の仕事に取りかかる。ある水準の力と複雑さに達すると、文明は成長をやめる。成長しなくなるや、近いうちに衰える運命にある。老いの時を告げる鐘が鳴ろうとしている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 567
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[579]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-070"
  "source_text": "Cette heure inévitable est toujours marquée par l’affaiblissement de l’idéal qui soutenait l’âme de la race. À mesure que cet idéal pâlit, tous les édifices religieux, politiques ou sociaux dont il était l’inspirateur commencent à s’ébranler."
  "translation_ja": "この避けられない時は、いつも、人種の魂を支えた理想の弱まりを印としている。理想の色が薄れるにつれ、その理想に霊感を得た宗教、政治、社会のあらゆる建物が揺らぎはじめる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 568
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[580]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-071"
  "source_text": "Avec l’évanouissement progressif de son idéal, la race perd de plus en plus ce qui faisait sa cohésion, son unité et sa force. L’individu peut croître en personnalité et en intelligence, mais en même temps aussi l’égoïsme collectif de la race est remplacé par un développement excessif de l’égoïsme individuel accompagné par l’affaissement du caractère et par l’amoindrissement de l’aptitude à l’action. Ce qui formait un peuple, une unité, un bloc, finit par devenir une agglomération d’individus sans cohésion et que maintiennent artificiellement pour quelque temps encore les traditions et les institutions. C’est alors que, divisé par leurs intérêts et leurs aspirations, ne sachant plus se gouverner, les hommes demandent à être dirigés dans leurs moindres actes, et que l’État exerce son influence absorbante."
  "translation_ja": "理想が次第に消え去るとともに、人種はその結束、統一、力のもとになったものをますます失う。個々人は個性と知性の点では成長するかもしれない。しかし同時に人種に共通した利己心は個人の利己心の過度の発達に取って代わられ、それとともに気力が衰え、行動する力が減ずる。一つの民族、一つの全体、一つの塊をなしていたものが、しまいには結束を欠く個人の寄せ集めとなり、しばらくの間だけなお、伝統と制度がこれを人為的につなぎとめる。そうなれば利害と願望によって分裂し、もはや自らを律するすべを知らぬ人々は、ごくささいな行為まで指図してもらおうとする。そして国家は何もかも吸収する影響力を振るう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 569
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[581]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-072"
  "source_text": "Avec la perte définitive de l’idéal ancien, la race finit par perdre entièrement son âme ; elle n’est plus qu’une poussière d’individus isolés et redevient ce qu’elle était à son point de départ : une foule. Elle en a tous les caractères transitoires sans consistance et sans lendemain. La civilisation n’a plus aucune fixité et est à la merci de tous les hasards. La plèbe est reine et les barbares avancent. La civilisation peut sembler brillante encore parce qu’elle possède la façade extérieure qu’un long passé a créée, mais c’est en réalité un édifice vermoulu que rien ne soutient plus et qui s’effondrera au premier orage."
  "translation_ja": "かつての理想を決定的に失うと、人種はついにその魂をすっかり失う。もはやばらばらの個人がちりのように散らばっているだけで、出発点にあった姿、すなわち群衆に戻る。群衆に見られる、つかのまで確かな形も明日もない性質をすべて備える。文明は安定をまったく失い、あらゆる偶然のなすがままである。民衆が君臨し、野蛮人たちが進んでくる。長い過去が作った表の構えは残っているから、文明はまだ輝いて見えるかもしれない。だが実際には虫に食われ、何にも支えられていない建物であって、最初の嵐で崩れ落ちるだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 570
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[582]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-073"
  "source_text": "Passer de la barbarie à la civilisation en poursuivant un rêve, puis décliner et mourir dès que ce rêve a perdu sa force, tel est le cycle de la vie d’un peuple."
  "translation_ja": "一つの夢を追いながら野蛮から文明へと歩み、その夢が力を失うや衰えて死ぬ。それが一つの民族の生の循環である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 571
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[583]"

- "id": "b2c1-033"
  "source_text": "Il faudrait prendre une à une les lois, les institutions de chaque peuple, pour montrer à quel point elles sont l’expression des besoins de leur race, et ne sauraient pour cette raison être violemment transformées. On peut disserter philosophiquement, par exemple, sur les avantages et les inconvénients de la centralisation ; mais quand nous voyons un peuple, composé de races très diverses, consacrer mille ans d’efforts pour arriver progressivement à cette centralisation ; quand nous constatons qu’une grande révolution ayant pour but de briser toutes les institutions du passé, a été forcée non seulement de respecter cette centralisation, et l’a exagérée encore, disons-nous bien qu’elle est fille de nécessités impérieuses, une condition même d’existence, et plaignons la faible portée mentale des hommes politiques qui parlent de la détruire. S’ils pouvaient par hasard y réussir, l’heure de la réussite serait aussitôt le signal d’une effroyable guerre civile[9] qui ramènerait immédiatement d’ailleurs une nouvelle centralisation beaucoup plus lourde que l’ancienne."
  "translation_ja": "各民族の法や制度を一つひとつ取り上げてみなければ、それらがどれほどその人種の必要の表れであり、そのため力ずくでは変えられないかを十分に示すことはできまい。たとえば、中央集権の長短について哲学的に論じることはできる。だが著しく異なる人種から成る一つの民族が、千年の努力を捧げ、少しずつこの中央集権に達したのを見、また過去の制度をすべて壊すことを目的とした大革命が、この集権制ばかりは尊重せざるをえず、のみならずいっそう強めたのを知るとき、それが押しとどめがたい必要の娘であり、生存の条件そのものであることを、よくよく心に言い聞かせよう。そしてその破壊を口にする政治家の視野の狭さをあわれもう。万一彼らが成功すれば、その成功の瞬間が恐るべき内戦の合図となる［9］。それがまたただちに、古いものよりはるかに重苦しい新たな中央集権を呼び戻すだろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b3c4-003"
  "source_text": "Caractères généraux des foules électorales. — Comment on les persuade. — Qualités que doit posséder le candidat. — Nécessité du prestige. — Pourquoi ouvriers et paysans choisissent si rarement les candidats dans leur sein. — Puissance des mots et des formules sur l’électeur. — Aspect général des discussions électorales. — Comment se forment les opinions de l’électeur. — Puissance des comités. — Ils représentent la forme la plus redoutable de la tyrannie. — Les comités de la Révolution. — Malgré sa faible valeur psychologique, le suffrage universel ne peut être remplacé. — Pourquoi les votes seraient identiques, alors même qu’on restreindrait le droit de suffrage à une classe limitée de citoyens. — Ce que traduit le suffrage universel dans tous les pays."
  "translation_ja": "選挙における群衆の一般的な性質。人々はどのように説得されるか。候補者に必要な性質。威信の必要。労働者や農民が自分の仲間から候補者を選ぶことがめったにないわけ。言葉と決まり文句が有権者に及ぼす力。選挙討論のおおよその姿。有権者の意見ができる仕組み。委員会の力。それがもっとも畏るべき専制の形であること。革命期の委員会。心理学的な価値は低くとも、普通選挙には代わるものがない。たとえ選挙権を限られた市民階級に絞っても投票の結果は変わらない理由。どの国でも普通選挙が表しているもの。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 469
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[93]"

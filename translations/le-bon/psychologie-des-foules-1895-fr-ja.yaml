- "id": "b3c5-051"
  "source_text": "En fait, d’ailleurs, elles ne présentent que deux dangers sérieux, l’un est un gaspillage forcé des finances, l’autre une restriction progressive des libertés individuelles."
  "translation_ja": "それに実際のところ、議会に伴う重大な危険は二つしかない。一つはどうしても財政が浪費に傾くこと、もう一つは個人の自由が次第に狭められることだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 549
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[559]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-052"
  "source_text": "Le premier de ces dangers est la conséquence forcée des exigences et de l’imprévoyance des foules électorales. Qu’un membre d’une assemblée propose une mesure donnant une satisfaction apparente à des idées démocratiques, telle qu’assurer, par exemple, des retraites à tous les ouvriers, augmenter le traitement des cantonniers, des instituteurs, etc., les autres députés, suggestionnés par la crainte des électeurs, n’oseront pas avoir l’air de dédaigner les intérêts de ces derniers en repoussant la mesure proposée, bien que sachant qu’elle grèvera lourdement le budget et nécessitera la création de nouveaux impôts. Hésiter dans le vote leur est impossible. Les conséquences de l’accroissement des dépenses sont lointaines et sans résultats bien fâcheux pour eux, alors que les conséquences d’un vote négatif pourraient apparaître clairement le jour prochain où il faudra se représenter devant l’électeur."
  "translation_ja": "第一の危険は、選挙における群衆の要求と先の見えなさから必然的に生じる。議員の一人が、一見民主的な考えにかなう措置を提案したとしよう。たとえばすべての労働者に年金を保障するとか、道路の保守作業員や小学校教員の給与を引き上げるとかいったことである。それが予算に重くのしかかり、新税の創設を余儀なくすると分かっていても、他の議員は有権者を恐れるあまり、その案を退けて有権者の利益を軽んじているかのように見られる勇気はない。採決でためらうことなど彼らにはできない。支出が膨れ上がった結果など遠い先のことで、自分たちにさほどの不都合はないのに対し、反対票の結果は、また有権者の前に立たねばならぬ遠からぬその日にはっきり現れるかもしれないからだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 550

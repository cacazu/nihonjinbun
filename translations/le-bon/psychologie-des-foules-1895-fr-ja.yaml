- "id": "b3c4-021"
  "source_text": "« M. C… prodigue à l’association les épithètes d’odieuse et lâche, monstrueuse, vile, vénale et vindicative, et déclare qu’il veut la détruire, etc., etc… »."
  "translation_ja": "「Ｃ……氏は、この協会を憎むべきもの、臆病、怪物じみたもの、卑しい、金で転ぶ、執念深い、と形容してやまず、これを壊すつもりだと言明する、等々、等々……」。"

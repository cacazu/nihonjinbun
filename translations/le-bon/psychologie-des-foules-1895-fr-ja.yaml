  "translation_status": "reviewed"
- "id": "intro-009"
  "source_text": "Il y a un siècle à peine, la politique traditionnelle des États et les rivalités des princes étaient les principaux facteurs des événements. L’opinion des foules ne comptait guère, et même, le plus souvent, ne comptait pas. Aujourd’hui ce sont les traditions politiques, les tendances individuelles des souverains, leurs rivalités qui ne comptent plus, et, au contraire, la voix des foules qui est devenue prépondérante. Elle dicte aux rois leur conduite, et c’est elle qu’ils tâchent d’entendre. Ce n’est plus dans les conseils des princes, mais dans l’âme des foules que se préparent les destinées des nations."
  "translation_ja": "ほんの一世紀前まで、何が起きるかを決める主な要因は、諸国家が守ってきた政策と君主同士の対抗心であった。群衆の意見はほとんど物を言わず、多くの場合、まるで問題にさえされなかった。今日では逆に、政治の伝統も君主個人の好みも君主間の競争も物を言わなくなり、群衆の声こそが何ものにもまさっている。その声が王たちに取るべき行動を命じ、王たちはそれを聞き取ろうとする。国民の運命が形をなしつつあるのは、もはや君主の評議の席ではない。群衆の魂のうちだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 55
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[56]"
  "section_id": "intro"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "intro-010"
  "source_text": "L’avènement des classes populaires à la vie politique, c’est-à-dire, en réalité, leur transformation progressive en classes dirigeantes, est une des caractéristiques les plus saillantes de notre époque de transition. Ce n’est pas, en réalité, par le suffrage universel, si peu influent pendant longtemps et d’une direction d’abord si facile, que cet avènement a été marqué. La naissance progressive de la puissance des foules s’est faite d’abord par la propagation de certaines idées qui se sont lentement implantées dans les esprits, puis par l’association graduelle des individus, pour amener la réalisation des conceptions théoriques. C’est par l’association que les foules ont fini par se former des idées, sinon très justes, au moins très arrêtées de leurs intérêts et par avoir conscience de leur force. Elles fondent des syndicats devant lesquels tous les pouvoirs capitulent tour à tour, des bourses du travail qui, en dépit de toutes les lois économiques tendent à régir les conditions du labeur et du salaire. Elles envoient dans les assemblées gouvernementales des représentants dépouillés de toute initiative, de toute indépendance, et réduits le plus souvent à n’être que les porte-parole des comités qui les ont choisis."
  "translation_ja": "民衆の諸階級が政治生活に登場したこと、言い換えれば、次第に支配する階級に変わってきたことは、この過渡期のもっともきわだった特徴の一つである。実のところ、その登場を画したのは普通選挙ではなかった。普通選挙の影響は長いことごく弱く、初めはたやすく誘導することもできた。群衆の力が次第に生まれてきたのは、まずいくつかの思想が広がって人の心にゆっくり根をおろし、次に、その理屈のうえでの構想を実現しようと、個々人が少しずつ結びついたからである。この結びつきを通じて群衆は、何が自分たちの利益なのかについて、たいそう正しくはないにしても、少なくともきわめてはっきりした考えを持ち、ついには自分たちの力を自覚するに至った。群衆は労働組合をつくり、あらゆる権力が次々とそれに屈する。また、経済のあらゆる法則をものともせず、労働と賃金の条件を取り仕切ろうとする労働取引所をつくる。統治にあたる議会には代表を送り込むが、その代表には自分から動く余地も独立性もなく、たいていは選出母体である委員会の代弁者でしかない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 56

- "id": "b1c2-038"
  "source_text": "§ 3. — EXAGÉRATION ET SIMPLISME DES SENTIMENTS DES FOULES"
  "translation_ja": "第三節　群衆の感情の誇張と単純さ"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 144
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[32]"
  "section_id": "b1c2s3"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-039"
  "source_text": "Quels que soient les sentiments, bons ou mauvais, manifestés par une foule, ils présentent ce double caractère d’être très simples et très exagérés. Sur ce point, comme sur tant d’autres, l’individu en foule se rapproche des êtres primitifs. Inaccessible aux nuances, il voit les choses en bloc et ne connaît pas les transitions. Dans la foule, l’exagération des sentiments est fortifiée par ce fait, qu’un sentiment manifesté se propageant très vite par voie de suggestion et de contagion, l’approbation évidente dont il est l’objet accroît considérablement sa force."
  "translation_ja": "群衆が表す感情は、よいものであれ悪いものであれ、きわめて単純で、きわめて誇張されているという二つの特徴を示す。この点でもまた、ほかの多くの点と同じく、群衆のなかの個人は原始の人々に近づく。微妙な色合いを受け入れず、物をひとまとめに見て、中間の移り変わりというものを知らない。群衆にあっては、感情が表に出ると、暗示と伝染によってごく速く伝わり、人々がそれに明らかな賛同を示すため、その力が著しく強まる。これがまた感情の誇張をいっそう進める。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 145
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[146]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-040"
  "source_text": "La simplicité et l’exagération des sentiments des foules font que ces dernières ne connaissent ni le doute ni l’incertitude. Comme les femmes, elles vont tout de suite aux extrêmes. Le soupçon énoncé se transforme aussitôt en évidence indiscutable. Un commencement d’antipathie ou de désapprobation, qui, chez l’individu isolé, ne s’accentuerait pas, devient aussitôt haine féroce chez l’individu en foule."
  "translation_ja": "群衆の感情は単純で誇張されているから、群衆は疑いも、定かでないということも知らない。女性と同じく、たちまち極端から極端へと向かう。疑いを口に出せば、それが即座に、争う余地のない明白な事実に変わる。単独の個人ならそれ以上は深まらない一抹の反感や不賛成が、群衆のなかの個人においては、たちまち激しい憎悪となる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 146
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[147]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-041"
  "source_text": "La violence des sentiments des foules est encore exagérée, dans les foules hétérogènes surtout, par l’absence de responsabilité. La certitude de l’impunité, certitude d’autant plus forte que la foule est plus nombreuse et la notion d’une puissance momentanée considérable due au nombre, rendent possibles à la collectivité des sentiments et des actes impossibles à l’individu isolé. Dans les foules, l’imbécile, l’ignorant et l’envieux sont libérés du sentiment de leur nullité et de leur impuissance, que remplace la notion d’une force brutale, passagère, mais immense."
  "translation_ja": "群衆の感情の激しさは、とりわけ異質な人々から成る群衆では、責任の所在がないためになおさら大きくなる。罰されないという確信は、群衆が多ければ多いほど強い。そこに、数が自分たちに、今だけとはいえ並々ならぬ力を与えているという意識が加わり、一人ではありえない感情や行為が、集団には可能になる。愚か者も、無学な者も、ねたみ深い者も、群衆のなかでは、自分が取るに足らず無力だという思いから解放される。それに取って代わるのは、荒々しく、はかなく、だが途方もなく大きな力の自覚だ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 147
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[148]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-042"
  "source_text": "L’exagération, chez les foules, porte malheureusement souvent sur de mauvais sentiments, reliquat atavique des instincts de l’homme primitif, que la crainte du châtiment oblige l’individu isolé et responsable à refréner. C’est ce qui fait que les foules sont si facilement conduites aux pires excès."
  "translation_ja": "残念ながら、群衆において誇張されるのはしばしば悪い感情である。それは、単独で責任を負う一個人なら処罰への恐れから抑え込まざるをえない、原始人の本能が、祖先の時代から残ったものだ。群衆がたやすく最悪の暴挙に走るのは、そのためである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 148
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[149]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-043"
  "source_text": "Ce n’est pas cependant que, suggestionnées habilement, les foules ne soient capables d’héroïsme, de dévouement et de vertus très hautes. Elles en sont même plus capables que l’individu isolé. Nous aurons bientôt occasion de revenir sur ce point en étudiant la moralité des foules."
  "translation_ja": "とはいえ、うまく暗示を受けた群衆が、英雄的な行為や献身、ごく高い徳を示せないというのではない。むしろ単独の個人以上にそうしたことができる。群衆の道徳性を調べるとき、間もなくこの点に戻る機会がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 149
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[150]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-044"
  "source_text": "Exagérée dans ses sentiments, la foule n’est impressionnée que par des sentiments excessifs. L’orateur qui veut la séduire doit abuser des affirmations violentes. Exagérer, affirmer, répéter, et ne jamais tenter de rien démontrer par un raisonnement, sont des procédés d’argumentation bien connus des orateurs des réunions populaires."
  "translation_ja": "群衆は自分の感情が大げさなだけに、度を越した感情でしか心を動かされない。群衆を引きつけようとする弁士は、激しい断言をうんざりするほど重ねなければならない。誇張し、言い切り、繰り返すこと、そして何事についても筋道を立てて証明しようとはけっしてしないこと。これは民衆集会の弁士がよく心得ている論じ方である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 150
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[151]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-045"
  "source_text": "La foule veut encore la même exagération dans les sentiments de ses héros. Leurs qualités et leurs vertus apparentes doivent toujours être amplifiées. On a très justement remarqué qu’au théâtre la foule exige du héros de la pièce des qualités de courage, de moralité, de vertu qui ne sont jamais pratiquées dans la vie."
  "translation_ja": "群衆はまた、自分たちの英雄の感情にも同じ誇張を求める。英雄が示す資質や徳は、つねに大きく描かれねばならない。舞台の主人公に対して観衆が、現実の暮らしではけっして実行されないような勇敢さ、道徳性、徳を要求するとは、まったく正しい指摘である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 151
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[152]"
  "section_id": "b1c2s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-046"
  "source_text": "On a parlé avec raison de l’optique spéciale du théâtre. Il en existe une, sans doute, mais ses règles n’ont le plus souvent rien à faire avec le bon sens et la logique. L’art de parler aux foules est d’ordre inférieur sans doute, mais exige des aptitudes toutes spéciales. Il est souvent impossible de s’expliquer à la lecture le succès de certaines pièces. Les directeurs des théâtres, quand ils les reçoivent, sont eux-mêmes le plus souvent très incertains de la réussite, parce que, pour juger, il faudrait qu’ils pussent se transformer en foule[5]. Ici encore, si nous pouvions entrer dans les développements, nous montrerions l’influence prépondérante de la race. La pièce de théâtre qui enthousiasme la foule dans un pays n’a parfois aucun succès dans un autre, ou n’a qu’un succès d’estime et de convention, parce qu’elle ne met pas en jeu les ressorts capables de soulever son nouveau public."
  "translation_ja": "演劇には演劇独特のものの見え方があると言われるのも、もっともだ。たしかにそれはあるが、その規則はたいてい、良識や論理とは何の関係もない。群衆に語りかける技は、たしかに高級なものではないが、まったく特別な才能を必要とする。読んだだけでは、なぜこれほど当たったのか説明のつかない戯曲がしばしばある。劇場の支配人自身、脚本を受け取ったとき、それが成功するかどうかたいていは見当がつかない。判断するには、自分を群衆に変えられなければならないからだ［5］。ここでもまた、詳しく論じられれば、人種の影響がものを言うことを示せよう。一国で群衆を沸かせた芝居が、ほかの国ではまるで当たらないか、あるいは、評判やお付き合いによる程度の成功にとどまることがある。それは、新しい観客を沸き立たせるばねに、その芝居が手を触れないからである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 152
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[153]"

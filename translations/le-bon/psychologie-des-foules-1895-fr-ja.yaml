- "id": "toc-003"
  "source_text": "INTRODUCTION. – L’ère des foules. 1"
  "translation_ja": "序論　群衆の時代　1"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 574
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[587]"

- "id": "b3c5-note-26"
  "section_id": "b3c5"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Dans son numéro du 6 avril 1895, l’Économiste faisait une revue curieuse de ce que peuvent coûter en une année ces dépenses d’intérêt purement électoral, notamment celles des chemins de fer. Pour relier Langayes (ville de 3.000 habitants), juchée sur une montagne, au Puy, vote d’un chemin de fer qui coûtera 15 millions. Pour relier Beaumont (3.500 habitants) à Castel-Sarrazin, 7 millions. Pour relier le village de Oust (523 habitants) à celui de Seix (1.200 habitants) 7 millions. Pour relier Prades à la bourgade d’Olette (717 habitants), 6 millions, etc. Rien que pour 1895, 90 millions de voies ferrées dépourvues de tout intérêt général ont été votés. D’autres dépenses de nécessités également électorales ne sont pas moins importantes. La loi sur les retraites ouvrières coûtera bientôt un minimum annuel de 165 millions d’après le ministre des finances, et de 800 millions suivant l’académicien Leroy-Beaulieu. Évidemment la progression continue de telles dépenses a forcément pour issue la faillite. Beaucoup de pays en Europe : le Portugal, la Grèce, l’Espagne, la Turquie, y sont arrivés ; d’autres vont y être acculés bientôt ; mais il ne faut pas trop s’en préoccuper, puisque le public a successivement accepté sans grandes protestations des réductions des quatre cinquièmes dans le paiement des coupons par divers pays. Ces ingénieuses faillites permettent alors de remettre instantanément les budgets avariés en équilibre. Les guerres, le socialisme, les luttes économiques nous préparent d’ailleurs de bien autres catastrophes, et à l’époque de désagrégation universelle où nous sommes entrés, il faut se résigner à vivre au jour le jour sans trop se soucier de lendemains qui nous échappent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-26"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-26"
  "translation_ja": "『エコノミスト』紙の一八九五年四月六日号に、もっぱら選挙のための支出、とりわけ鉄道へのそれが一年にどれほどになるか、興味深い一覧があった。山の上にしがみつくランガイユ（人口三千人）とル・ピュイを結ぶのに、一千五百万を費やす鉄道が可決された。ボーモン（三千五百人）とカステル＝サラザンを結ぶのに七百万。ウスト村（五百二十三人）とセ村（千二百人）を結ぶのに七百万。プラードとオレットの小村（七百十七人）を結ぶのに六百万、等々。一八九五年だけで、公益とは何の関わりもない鉄道路線に九千万が可決された。同じく選挙の必要から来るほかの支出も、劣らず大きい。労働者年金法は遠からず、大蔵大臣によれば年に最低一億六千五百万、学士院会員ルロワ＝ボーリューによれば八億を要することになる。このような支出が絶えずふくらめば、ついには破産するほかないのは明らかだ。ヨーロッパではポルトガル、ギリシア、スペイン、トルコなどがすでにそこに至り、じきにそこへ追い込まれる国もある。もっとも、いくつもの国で利札の支払いを五分の四も引き下げるのを、人々はたいした抗議もなく次々受け入れてきたのだから、あまり気をもむには及ばない。こうした巧妙な破産を行えば、傷んだ予算にもたちまち収支の均衡が戻る。いずれにせよ、戦争、社会主義、経済上の争いは、われわれにこれとは比べものにならない災厄を準備している。あらゆるものが解体する時代に踏み込んだわれわれは、手の届かない明日のことを気にしすぎず、その日その日を生きるよりほかない。"
  "translation_status": "reviewed"
- "id": "b3c5-054"
  "source_text": "Le second des dangers mentionnés plus haut, la restriction forcée des libertés par les assemblées parlementaires, moins visible en apparence est cependant fort réel. Il est la conséquence des innombrables lois — toujours restrictives — dont les parlements, avec leur esprit simpliste, voient mal les conséquences, et qu’ils se croient obligés de voter."
  "translation_ja": "先に挙げた第二の危険、つまり議会が必然的に自由を制限することは、一見目立たないが、まことに現実のものである。原因は無数の法律にある。それらは常に何かを制限するのだが、単純な物の見方をする議会はその結果をよく見通せず、しかもそれらに賛成票を投じる義務があると思っている。"
  "source_languages":
  - "fr"
  "source_locations":

  "translation_status": "reviewed"
- "id": "intro-013"
  "source_text": "Les écrivains en faveur auprès de notre bourgeoisie actuelle, ceux qui représentent le mieux ses idées un peu étroites, ses vues un peu courtes, son scepticisme un peu sommaire, son égoïsme parfois un peu excessif, s’affolent tout à fait devant le pouvoir nouveau qu’ils voient grandir, et, pour combattre le désordre des esprits, ils adressent des appels désespérés aux forces morales de l’Église, tant dédaignées par eux jadis. Ils nous parlent de la banqueroute de la science, et revenus tout pénitents de Rome, nous rappellent aux enseignements des vérités révélées. Mais ces nouveaux convertis, oublient qu’il est trop tard. Si vraiment la grâce les a touchés, elle ne saurait avoir le même pouvoir sur des âmes peu soucieuses des préoccupations qui assiègent ces récents dévots. Les foules ne veulent plus aujourd’hui des dieux dont eux-mêmes ne voulaient pas hier et qu’ils ont contribué à briser. Il n’est pas de puissance divine ou humaine qui puisse obliger les fleuves à remonter vers leur source."
  "translation_ja": "今日のブルジョワジーにもてはやされる文筆家たち、すなわちそのいささか狭い考え、いささか目先しか見ぬ見通し、いささか大ざっぱな懐疑主義、そしてときにいささか度の過ぎる利己心をもっともよく代弁する人々は、新しい力が伸びてゆくのを目の当たりにして、すっかりうろたえている。人心の乱れに抗するため、かつてはあれほど軽んじた教会の精神的な力に、必死で助けを求めているのだ。彼らは科学は破産したと説き、ローマからいかにも悔い改めて帰ってくると、啓示された真理の教えに立ち返れと私たちに呼びかける。だが、このにわか信者たちは、もう手遅れだということを忘れている。本当に恩寵が彼らに触れたとしても、この生まれたての敬虔家たちを責めさいなむ心配など気にもとめない人々の魂に、それが同じように働きかけるはずはない。昨日までは彼ら自身も顧みず、その神像を打ち砕くのに手を貸していた。今日、群衆はもうそういう神々を欲しがらない。河を源までさかのぼらせる力など、神にも人にもない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 59
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[60]"

- "id": "intro-017"
  "source_text": "En sera-t-il de même pour notre civilisation ? C’est ce que nous pouvons craindre, mais c’est ce que nous ne pouvons encore savoir."
  "translation_ja": "私たちの文明も同じ道をたどるのだろうか。その恐れはある。だが、本当にそうなるかどうかは、まだ分からない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

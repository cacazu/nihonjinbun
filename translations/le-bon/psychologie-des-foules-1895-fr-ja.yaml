  "translation_status": "reviewed"
- "id": "b2c4-037"
  "source_text": "L’évolution qui s’est ainsi opérée depuis trente ans est frappante. À l’époque précédente, peu éloignée pourtant, les opinions possédaient encore une orientation générale ; elles dérivaient de l’adoption de quelque croyance fondamentale. Par le fait seul qu’on était monarchiste, on avait fatalement, aussi bien en histoire que dans les sciences, certaines idées très arrêtées et, par le fait seul qu’on était républicain, on avait des idées tout à fait contraires. Un monarchiste savait pertinemment que l’homme ne descend pas du singe, et un républicain savait non moins pertinemment qu’il en descend. Le monarchiste devait parler de la Révolution avec horreur, et le républicain avec vénération. Il y avait des noms, tels que ceux de Robespierre et de Marat, qu’il fallait prononcer avec des mines de dévot, et d’autres noms, tels que ceux de César, d’Auguste et de Napoléon qu’on ne devait pas articuler sans les couvrir d’invectives. Jusque dans notre Sorbonne, cette naïve façon de concevoir l’histoire était générale[21]."
  "translation_ja": "この三十年でこうして起きた変化は目を引く。それ以前、そう遠くない昔には、意見にはまだ大まかな方向があった。何らかの根本の信念を採り入れることで意見が生じていたからだ。王党派だというだけで、歴史でも科学でも必然的にある決まった意見を持ち、共和派だというだけで、まるで正反対の意見を持った。人間が猿の子孫ではないことを王党派は確実に知っており、共和派はそれに劣らず確実に、猿の子孫だと知っていた。王党派は革命を忌まわしいものとして語り、共和派は崇敬をもって語らねばならなかった。ロベスピエールやマラーなどの名は信者めいた面持ちで発音し、カエサルやアウグストゥスやナポレオンといった名は、誹謗を浴びせずには口にしてはならなかった。わが国のソルボンヌでさえ、この素朴な歴史の捉え方が普通だった［21］。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

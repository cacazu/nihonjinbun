- "id": "b1c2-028"
  "source_text": "Il n’est pas besoin qu’une foule soit nombreuse pour que la faculté de voir correctement ce qui se passe devant elle soit détruite, et les faits réels remplacés par des hallucinations sans parenté avec eux. Dès que quelques individus sont réunis, ils constituent une foule, et, alors même qu’ils seraient des savants distingués, ils prennent tous les caractères des foules pour ce qui est en dehors de leur spécialité. La faculté d’observation et l’esprit critique possédés par chacun d’eux s’évanouissent aussitôt. Un psychologue ingénieux, M. Davey, nous en fournit un bien curieux exemple, récemment rapporté par les Annales des Sciences psychiques, et qui mérite d’être relaté ici. M. Davey ayant convoqué une réunion d’observateurs distingués, parmi lesquels un des premiers savants de l’Angleterre, M. Wallace, exécuta devant eux, et après leur avoir laissé examiner les objets et poser des cachets où ils voulaient, tous les phénomènes classiques des spirites : matérialisation des esprits, écriture sur des ardoises, etc. Ayant ensuite obtenu de ces observateurs distingués des rapports écrits affirmant que les phénomènes observés n’avaient pu être obtenus que par des moyens surnaturels, il leur révéla qu’ils étaient le résultat de supercheries très simples. « Le plus étonnant de l’investigation de M. Davey, écrit l’auteur de la relation, n’est pas la merveille des tours en eux-mêmes, mais l’extrême faiblesse des rapports qu’en ont faits les témoins non initiés. Donc dit-il, les témoins peuvent faire de nombreux et positifs récits qui sont complètement erronés, mais dont le résultat est que, si l’on accepte leurs descriptions comme exactes, les phénomènes qu’ils décrivent sont inexplicables par la supercherie. Les méthodes inventées par M. Davey étaient si simples qu’on est étonné qu’il ait eu la hardiesse de les employer ; mais il avait un tel pouvoir sur l’esprit de la foule qu’il pouvait lui persuader qu’elle voyait ce qu’elle ne voyait pas. » C’est toujours le pouvoir de l’hypnotiseur sur l’hypnotisé. Mais quand on voit ce pouvoir s’exercer sur des esprits supérieurs, préalablement mis en défiance pourtant, on conçoit à quel point il est facile d’illusionner les foules ordinaires."
  "translation_ja": "目の前の出来事を正確に見る能力が失われ、実際の事実に代わって、それとは縁もゆかりもない幻覚が入り込むのに、群衆の頭数が多い必要はない。数人が寄り合えば群衆をなし、たとえ名高い学者であっても、自分の専門から外れたことになると、群衆の性質をすべて帯びる。一人ひとりにはあった観察力と批判する精神が、たちまち消えるのである。才気ある心理家デイヴィー氏が示した奇妙な例が、最近『心霊科学年報』に報じられた。ここに述べておく値打ちがある。デイヴィー氏は、イギリス屈指の学者ウォレス氏をはじめ、観察力にすぐれた名士たちを集めた。用具を調べさせ、どこでも好きなところに封印をさせたうえで、彼らの前で、霊の物質化、石板に文字が現れることなど、降霊術でおなじみの現象をひととおり演じてみせた。この名だたる観察者たちから、自分たちが見た現象は超自然の手段以外では起こせなかったと断言する報告書を取りつけてから、ごく簡単な手品だったと明かした。「デイヴィー氏の実験でいちばん驚くべきなのは」と伝え手は書く。「手品そのものの見事さではなく、種を知らなかった目撃者たちの報告が、はなはだ心もとないことだ。つまり」と彼は言う。「目撃者の話はいくつもあり、しかも断定的でありながら、まったくの誤りということがありうる。しかもその説明を正確だと認めてしまうと、語られた現象は手品としては説明のつかないものになってしまう。デイヴィー氏の考えた手は、よくも臆せず使ったものだと思うほど単純だった。しかし彼は、見ていないものを見ているのだと群衆に信じさせるほど、その心を握っていた」。ここでもやはり、催眠術者が催眠をかけられた者に及ぼす力が働いている。あらかじめ疑ってかかるよう備えた、すぐれた頭脳にさえこの力が働くのを見ると、ふつうの群衆に錯覚を起こさせるのがどれほどたやすいか想像がつく。"

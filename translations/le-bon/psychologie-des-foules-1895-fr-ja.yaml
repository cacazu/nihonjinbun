  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-035"
  "source_text": "Dans une assemblée parlementaire, le succès d’un discours dépend presque uniquement du prestige que l’orateur possède, et pas du tout des raisons qu’il propose. Et, la meilleure preuve, c’est que lorsqu’une cause quelconque fait perdre à un orateur son prestige, il perd du même coup toute son influence, c’est-à-dire le pouvoir de diriger à son gré les votes."
  "translation_ja": "議会での演説の成否は、ほとんどもっぱら弁士の威信にかかっていて、彼がどのような論拠を出すかには少しもよらない。何よりの証拠に、弁士が何かの理由で威信を失うと、同時に影響力の一切を、つまり思いどおりに票の行方を決める力を失う。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 533
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[543]"
  "section_id": "b3c5"

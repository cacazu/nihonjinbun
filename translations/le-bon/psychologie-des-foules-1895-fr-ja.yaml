- "id": "b2c1-039"
  "source_text": "Ce qui constitue le premier danger de cette éducation — très justement qualifiée de latine — c’est qu’elle repose sur cette erreur psychologique fondamentale, que c’est en apprenant par cœur des manuels qu’on développe l’intelligence. Dès lors on a tâché d’en apprendre le plus possible ; et, de l’école primaire au doctorat ou à l’agrégation, le jeune homme ne fait qu’apprendre par cœur des livres, sans que son jugement et son initiative soient jamais exercés. L’instruction, pour lui, c’est réciter et obéir. « Apprendre des leçons, savoir par cœur une grammaire ou un abrégé, bien répéter, bien imiter, voilà, écrit un ancien ministre de l’instruction publique, M. Jules Simon, une plaisante éducation où tout effort est un acte de foi devant l’infaillibilité du maître, et n’aboutit qu’à nous diminuer et nous rendre impuissants. »"
  "translation_ja": "この教育をラテン式とは、じつに適切に呼んだものだ。その第一の危険は、教科書を丸暗記すれば知性が発達するという、心理学上の根本的な誤りに立脚していることにある。そこで、できるだけ多く暗記しようということになった。小学校から博士号や教授資格試験に至るまで、若者は本をそらで覚えるだけで、判断力も自発性もついぞ鍛えられない。その人にとって、学問とは暗唱し服従することだ。「課を覚え、文法書や綱要を暗記し、上手に復唱し、上手にまねる」と、もと文部大臣ジュール・シモン氏は書く。「なんとも妙な教育である。あらゆる努力は教師の無謬にひれ伏す信仰の行為にほかならず、私たちを小さくし、無力にすることにしか行き着かない」。"
  "source_languages":
  - "fr"

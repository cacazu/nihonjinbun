- "id": "b3c4-013"
  "source_text": "« Un organisateur ayant prié les assistants de nommer un président, l’orage se déchaîne. Les anarchistes bondissent sur la scène pour enlever le bureau d’assaut. Les socialistes le défendent avec énergie ; on se cogne, on se traite mutuellement de mouchards, vendus, etc… un citoyen se retire avec un œil poché."
  "translation_ja": "「主催者の一人が出席者に議長の選出を請うと、嵐が巻き起こる。無政府主義者たちが議長席を奪おうと演壇に飛び上がる。社会主義者たちは懸命にこれを守る。殴り合いになり、互いに密偵、買収されたやつ等々とののしり合う。……市民一名が目の周りに青あざをつくって退場。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

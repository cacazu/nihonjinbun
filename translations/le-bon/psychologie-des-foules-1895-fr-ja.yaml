- "id": "b3c5-055"
  "source_text": "Il faut que ce danger soit bien inévitable, puisque l’Angleterre elle-même, qui offre assurément le type le plus parfait du régime parlementaire, celui où le représentant est le plus indépendant de son électeur, n’a pas réussi à s’y soustraire. Herbert Spencer, dans un travail déjà ancien, avait montré que l’accroissement de la liberté apparente devait être suivi d’une diminution de la liberté réelle. Reprenant la même thèse dans son livre récent, l’Individu contre l’État, il s’exprime ainsi au sujet du parlement anglais :"
  "translation_ja": "これはよほど避けがたい危険に違いない。議会制のもっとも完全な型、議員が選挙人からもっとも独立している型をたしかに示すイギリスでさえ、これを逃れられなかったのだから。ハーバート・スペンサーは、もうずいぶん前の著作で、見かけの自由の増大には実際の自由の減少が続くはずだと指摘した。近著『個人対国家』で同じ論旨をふたたび取り上げ、イギリス議会について次のように述べている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

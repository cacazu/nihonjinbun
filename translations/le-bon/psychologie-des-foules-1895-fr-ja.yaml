- "id": "b3c3-012"
  "source_text": "« Il observait attentivement le jury tout en plaidant. C’est le moment favorable. Avec du flair et de l’habitude, l’avocat lit sur les physionomies l’effet de chaque phrase, de chaque mot, et il en tire ses conclusions. Il s’agit tout d’abord de distinguer les membres acquis d’avance à la cause. Le défenseur achève en un tour de main de se les assurer, après quoi il passe aux membres qui semblent au contraire mal disposés, et il s’efforce de deviner pourquoi ils sont contraires à l’accusé. C’est la partie délicate du travail, car il peut y avoir une infinité de raisons d’avoir envie de condamner un homme, en dehors du sentiment de la justice. »"
  "translation_ja": "「彼は弁論しながら陪審員を注意深く観察した。そこが好機なのだ。嗅覚と経験があれば、弁護士は一つの言い回し、一つの言葉がどう響いたかを表情から読み、そこから結論を引き出す。まず、すでにこちらの言い分に傾いている者を見分けねばならない。弁護人は手早く彼らの支持を確かなものにし、そのあと、反対に好意的でないらしい者に移って、なぜ被告人に不利なのかを察しようと努める。ここが仕事の微妙なところである。人を有罪にしたくなる理由は、正義感のほかにも無数にありうるからだ」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

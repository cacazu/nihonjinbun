- "id": "b1c2-022"
  "source_text": "Il ne faudrait pas, pour combattre ce qui précède, faire intervenir la qualité mentale des individus dont se compose la foule. Cette qualité est sans importance. Du moment qu’ils sont en foule, l’ignorant et le savant sont également incapables d’observation."
  "translation_ja": "この議論に反対するため、群衆を構成する個々人の知的な資質を持ち出してはならない。その資質は関係がない。ひとたび群衆に入れば、無学な者も学者もひとしく観察ができない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

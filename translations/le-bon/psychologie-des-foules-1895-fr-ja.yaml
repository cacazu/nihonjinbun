- "id": "b2c1-031"
  "source_text": "Aussi n’est-il pas du tout dans le pouvoir d’un peuple de changer réellement ses institutions. Il peut assurément, au prix de révolutions violentes, changer le nom de ces institutions, mais le fond ne se modifie pas. Les noms ne sont que de vaines étiquettes dont l’historien qui va un peu au fond des choses n’a pas à se préoccuper. C’est ainsi par exemple que le plus démocratique des pays du monde est l’Angleterre[8], qui vit cependant sous un régime monarchique, alors que les pays où sévit le plus lourd despotisme sont les républiques hispano-américaines, malgré les constitutions républicaines qui les régissent. Le caractère des peuples et non les gouvernements conduit leurs destinées. C’est un point de vue que j’ai essayé d’établir dans un précédent volume, en m’appuyant sur de catégoriques exemples."
  "translation_ja": "したがって、民族が自分の制度をほんとうに変えることは、とうていその力の及ぶところではない。もちろん暴力革命の代価を払えば、制度の名なら変えられる。だが中身は変わらない。名称とは空虚な札にすぎず、少しでも物事の底へおりてゆく歴史家には、さして気にする必要のないものだ。たとえば、世界でもっとも民主的な国はイギリスだが［8］、そこで営まれるのは君主制である。それに対し、もっとも重苦しい専制がはびこっている国々はスペイン系アメリカの諸共和国である。そこには共和制の憲法があるにもかかわらず、である。民族の運命を導くのはその性格であって、政府ではない。これは以前の著作で、はっきりした例に基づいて確立しようと努めた見方だ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "b2c3-032"
  "source_text": "« La double action du passé et de l’imitation réciproque finit par rendre tous les hommes d’un même pays et d’une même époque à ce point semblables que, même chez ceux qui sembleraient devoir le plus s’y soustraire, philosophes, savants et littérateurs, la pensée et le style ont un air de famille qui fait immédiatement reconnaître le temps auquel ils appartiennent. Il ne faut pas causer longtemps avec un individu pour connaître à fond ses lectures, ses occupations habituelles et le milieu où il vit[16]. »"
  "translation_ja": "「過去と相互の模倣という二つの働きは、同じ国、同じ時代の人々を、しまいには互いによく似通わせる。もっともその作用を逃れそうに見える哲学者、学者、文人でさえ、考え方と言葉遣いに一見して時代が分かるような家族似を帯びる。ある人の読書や日頃の仕事や暮らしている環境をすっかり見抜くのに、それほど長く話す必要はない［16］」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "b2c3-058"
  "source_text": "On voit, par ce qui précède, que bien des facteurs peuvent entrer dans la genèse du prestige : un des plus importants fut toujours le succès. Tout homme qui réussit, toute idée qui s’impose, cessent par ce fait même d’être contestée. La preuve que le succès est une des bases principales du prestige, c’est que ce dernier disparaît presque toujours avec lui. Le héros, que la foule acclamait la veille, est conspué par elle le lendemain si l’insuccès l’a frappé. La réaction sera même d’autant plus vive que le prestige aura été plus grand. La foule considère alors le héros tombé comme un égal, et se venge de s’être inclinée devant la supériorité qu’elle ne lui reconnaît plus. Lorsque Robespierre faisait couper le cou à ses collègues et à un grand nombre de ses contemporains, il possédait un immense prestige. Lorsqu’un déplacement de quelques voix lui ôta son pouvoir, il perdit immédiatement ce prestige, et la foule le suivit à la guillotine avec autant d’imprécations qu’elle suivait la veille ses victimes. C’est toujours avec fureur que les croyants brisent les statues de leurs anciens dieux."
  "translation_ja": "ここまで見てきて、威信の生まれるところには多くの要因が入りうると分かる。そのうちつねにもっとも重要だったものの一つは成功である。成功した人、世に通った思想には、それだけですでに異論が出なくなる。成功が威信の主な土台の一つである証拠は、たいていの場合、成功を失うと威信もともに消えることだ。昨日まで群衆が歓呼した英雄は、不成功に見舞われると、翌日には同じ群衆に罵声を浴びる。反動は、もとの威信が大きければ大きいほど激しい。群衆は倒れた英雄をもはや同等の者とみなし、今では認めない優越にかつて頭を下げたことへの仕返しをする。ロベスピエールが同僚や同時代の多くの者の首をはねさせていたときには、途方もない威信があった。数票が移って権力を奪われると、たちまち威信を失い、群衆は彼について断頭台まで行き、前日に彼の犠牲になった者たちに浴びせたのと同じだけの呪いを浴びせた。信者が昔の神々の像を打ち砕くときは、いつも烈火のような勢いなのだ。"
  "source_languages":

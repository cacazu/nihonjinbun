- "id": "b2c2-note-12"
  "section_id": "b2c2s1"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Dans Les Lois psychologiques de l’évolution des peuples, j’ai longuement insisté sur la différence qui sépare l’idéal démocratique latin de l’idéal démocratique angle-saxon. D’une façon indépendante et à la suite de ses voyages, M. Paul Bourget est arrivé, dans son livre tout récent, Outre-Mer, à des conclusions à peu près identiques aux miennes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-12"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-12"
  "translation_ja": "『諸民族の進化を律する心理法則』で私は、ラテン系の民主的理想をアングロサクソン系の民主的理想から隔てる違いを詳しく強調した。ポール・ブールジェ氏は私とは別個に、みずからの旅を経て、ごく最近の著作『海の彼方』において、私のものとほぼ同じ結論に至った。"
  "translation_status": "reviewed"
- "id": "b2c2-020"
  "source_text": "§ 2. – LES ILLUSIONS"
  "translation_ja": "第二節　幻想"
  "source_languages":

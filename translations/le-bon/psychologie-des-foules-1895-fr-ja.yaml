- "id": "b2c2-016"
  "source_text": "Aussi, quand les foules ont fini, à la suite de bouleversements politiques, de changements de croyances, par acquérir une antipathie profonde pour les images évoquées par certains mots, le premier devoir de l’homme d’État véritable est de changer les mots sans, bien entendu, toucher aux choses en elles-mêmes, ces dernières étant trop liées à une constitution héréditaire pour pouvoir être transformées. Le judicieux Tocqueville a fait remarquer, il y a déjà longtemps, que le travail du Consulat et de l’Empire a surtout consisté à habiller de mots nouveaux la plupart des institutions du passé, c’est-à-dire à remplacer des mots évoquant de fâcheuses images dans l’imagination des foules par d’autres mots dont la nouveauté empêchait de pareilles évocations. La taille est devenue contribution foncière ; la gabelle, l’impôt du sel ; les aides, contributions indirectes et droit réunis ; la taxe des maîtrises et jurandes s’est appelée patente, etc."
  "translation_ja": "だから、政変や信仰の変化のあとで、ある言葉が呼び起こす像に群衆が深い反感を抱くようになったなら、真の政治家の第一の務めは言葉を変えることである。いうまでもなく、ものそのものに手を触れるのではない。ものの方は受け継がれた心のつくりと深く結びつきすぎていて、作り変えられないからだ。洞察に富むトクヴィルはずいぶん前に、統領政府と帝政の仕事は、何よりも過去の制度の大部分に新しい言葉の服を着せることだったと指摘している。つまり、群衆の想像に不愉快な像を浮かばせる語を、その新しさゆえにそうした像をまだ浮かばせない語で置き換えるのである。タイユ税は土地税となり、ガベルは塩税に、エードは間接税や統合税になり、親方同業組合に課す税は営業免許税と呼ばれるようになった、などである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

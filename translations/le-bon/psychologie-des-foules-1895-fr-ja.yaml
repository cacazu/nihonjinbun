  "translation_status": "reviewed"
- "id": "b1c2-054"
  "source_text": "Ce serait d’ailleurs bien méconnaître la psychologie des foules que de croire à la prédominance de leurs instincts révolutionnaires. Leurs violences seules nous illusionnent sur ce point. Leurs explosions de révolte et de destruction sont toujours très éphémères. Les foules sont trop régies par l’inconscient, et trop soumises par conséquent à l’influence d’hérédités séculaires, pour n’être pas extrêmement conservatrices. Abandonnées à elles-mêmes, elles sont bientôt lasses de leurs désordres et se dirigent d’instinct vers la servitude. Ce furent les plus fiers et les plus intraitables des Jacobins qui acclamèrent le plus énergiquement Bonaparte, quand il supprima toutes les libertés et fit durement sentir sa main de fer."
  "translation_ja": "それにしても、群衆の革命的本能が他を圧すると思うのは、群衆の心理をひどく見誤ることだ。その暴力だけが私たちの目を欺く。反抗や破壊がどれほどはげしく噴き出しても、いつもじつに短命である。群衆は無意識にあまりにも強く支配され、したがって幾世紀にもわたる遺伝の作用にあまりにも強く従うため、極度に保守的にならずにはいられない。成り行きに任せておくと、群衆は自分で引き起こした混乱にすぐ飽き、本能のおもむくまま隷属の方へ向かう。ボナパルトがあらゆる自由を廃し、その鉄の手の厳しさを思い知らせたとき、もっとも力いっぱい歓呼したのは、ジャコバン派のうちでもっとも誇り高く、もっとも頑として屈しなかった人々だった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 160
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[161]"
  "section_id": "b1c2s4"

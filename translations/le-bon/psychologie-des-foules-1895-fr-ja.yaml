- "id": "b1c1-003"
  "source_text": "Loi psychologique de leur unité mentale."
  "translation_ja": "群衆の心が一つになる心理法則"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

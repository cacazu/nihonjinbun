- "id": "b1c1-022"
  "source_text": "Mais si les individus en foule se bornaient à mettre en commun les qualités ordinaires dont chacun d’eux a sa part, il y aurait simplement moyenne, et non, comme nous l’avons dit, création de caractères nouveaux. Comment s’établissent ces caractères nouveaux ? C’est ce que nous devons rechercher maintenant."
  "translation_ja": "しかし群衆のなかの個々人が、それぞれに多少はある平凡な資質を持ち寄るだけなら、そこに生じるのはただの平均であって、先に言ったような、新しい性質の創造ではないはずだ。その新しい性質はどうして生まれるのか。次に調べねばならないのはこのことである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 96
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[98]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-023"
  "source_text": "Diverses causes déterminent l’apparition de ces caractères spéciaux aux foules, et que les individus isolés ne possèdent pas. La première est que l’individu en foule acquiert, par le fait seul du nombre, un sentiment de puissance invincible qui lui permet de céder à des instincts que, seul, il eût forcément refrénés. Il sera d’autant moins porté à les refréner que, la foule étant anonyme, et par conséquent irresponsable, le sentiment de la responsabilité, qui retient toujours les individus, disparaît entièrement."
  "translation_ja": "個人が単独では持たず、群衆だけに現れる性質を生み出す原因はいくつかある。第一に、群衆のなかの個人は、頭数が多いというだけで、どんな相手にも打ち勝てるような力を感じるようになる。そのおかげで、一人ならば否応なく抑えていたであろう本能に身を任せることができる。群衆は無名であり、それゆえ責任を問われることがないから、つねに個人の歯止めとなっている責任感はすっかり消え失せる。その分だけ、本能を抑えようという気も起きにくい。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 97
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[99]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-024"
  "source_text": "Une seconde cause, la contagion, intervient également pour déterminer chez les foules la manifestation de caractères spéciaux et en même temps leur orientation. La contagion est un phénomène aisé à constater, mais non expliqué, et qu’il faut rattacher aux phénomènes d’ordre hypnotique que nous étudierons dans un instant. Dans une foule, tout sentiment, tout acte est contagieux, et contagieux à ce point que l’individu sacrifie très facilement son intérêt personnel à l’intérêt collectif. C’est là une aptitude fort contraire à sa nature, et dont l’homme n’est guère capable que lorsqu’il fait partie d’une foule."
  "translation_ja": "第二の原因である伝染もまた、群衆に特有の性質が現れることと、その向かう先との両方を決める。伝染はたやすく認められるが説明のついていない現象で、間もなく調べる催眠のたぐいの現象に結びつけて考えねばならない。群衆にあっては、どんな感情もどんな行為も伝染する。その程度は、個人がたやすく自分の利益を集団の利益の犠牲にしてしまうほどだ。これはその人の生来の性質にひどく反する働きであって、人は群衆の一員であるときのほかには、とてもそうしたことはできない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 98
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[100]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-025"
  "source_text": "Une troisième cause, et celle-là est de beaucoup la plus importante, détermine dans les individus en foule des caractères spéciaux parfois tout à fait contraires à ceux de l’individu isolé. Je veux parler de la suggestibilité, dont la contagion mentionnée plus haut n’est d’ailleurs qu’un effet."
  "translation_ja": "第三の原因があり、それはほかよりはるかに重要である。これが群衆のなかの個人に、単独の個人のそれとときには正反対ともなる独特の性質を生じさせる。私が言いたいのは暗示を受けやすいことであって、すでに触れた伝染も、実はその結果の一つにすぎない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 99
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[101]"
  "section_id": "b1c1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c1-026"
  "source_text": "Pour comprendre ce phénomène, il faut avoir présentes à l’esprit certaines découvertes récentes de la physiologie. Nous savons aujourd’hui que, par des procédés variés, un individu peut être placé dans un état tel, qu’ayant perdu toute sa personnalité consciente, il obéisse à toutes les suggestions de l’opérateur qui la lui a fait perdre, et commette les actes les plus contraires à son caractère et à ses habitudes. Or les observations les plus attentives paraissent prouver que l’individu plongé depuis quelque temps au sein d’une foule agissante, se trouve bientôt placé — par suite des effluves qui s’en dégagent, ou pour toute autre cause que nous ne connaissons pas — dans un état particulier, qui se rapproche beaucoup de l’état de fascination où se trouve l’hypnotisé dans les mains de son hypnotiseur. La vie du cerveau étant paralysée chez le sujet hypnotisé, celui-ci devient l’esclave de toutes les activités inconscientes de sa moelle épinière, que l’hypnotiseur dirige à son gré. La personnalité consciente est entièrement évanouie, la volonté et le discernement sont perdus. Tous les sentiments et les pensées sont orientés dans le sens déterminé par l’hypnotiseur."
  "translation_ja": "この現象を理解するには、生理学の最近の発見をいくつか心にとめておく必要がある。私たちが今知っているところでは、さまざまな方法によって、一人の人間を、意識する人格をまったく失い、自分をそういう状態に置いた施術者のあらゆる暗示に従って、当人の性格や習慣にこのうえなく反する行いまでするほどの状態に置くことができる。ところが、何かをしている群衆のただなかでしばらく過ごした個人について、もっとも注意深い観察が証し立てているかに見えるのは、群衆から発散する何らかの気のためか、あるいはまだ知られぬ別の原因のためか、その人がやがて一種特別な状態に陥るということだ。それは催眠をかける者の手中で、かけられた者が取り込まれている状態にごく近い。催眠を受けた者は脳の働きが麻痺し、脊髄のあらゆる無意識の活動の奴隷となる。それを催眠術者が意のままに操るのである。意識する人格はすっかり消え、意志も判断力も失われる。あらゆる感情と考えが催眠術者の定める方向を向く。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

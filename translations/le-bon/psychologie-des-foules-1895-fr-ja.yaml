- "id": "b2c3-048"
  "source_text": "Devenu grand homme, son prestige s’accrut de toute sa gloire et devint au moins égal à celui d’une divinité pour les dévots. Le général Vandamme, soudard révolutionnaire, plus brutal et plus énergique encore qu’Augereau, disait de lui au maréchal d’Ornano, en 1815, un jour qu’ils montaient ensemble l’escalier des Tuileries : « Mon cher, ce diable d’homme exerce sur moi une fascination dont je ne puis me rendre compte. C’est au point que moi, qui ne crains ni dieu ni diable, quand je l’approche, je suis prêt à trembler comme un enfant, et il me ferait passer par le trou d’une aiguille pour me jeter dans le feu. »"
  "translation_ja": "大人物になると、その威信は彼の浴びた栄光の分まで増し、少なくとも信者にとっての神格に等しくなった。革命軍の荒武者で、粗暴さと活力ではオージュローをさらに上回るヴァンダム将軍は、一八一五年のある日、ともにテュイルリー宮の階段を上りながら、ドルナノ元帥にこう語った。「なあ、あの悪魔みたいな人間が俺にかけるまじないは、自分でも見当がつかん。神も悪魔も怖くないこの俺が、あの人のそばへ行くと子どもみたいに震えだしそうだ。あの人なら針の穴をくぐらせてでも、俺を火の中に飛び込ませるよ」。"

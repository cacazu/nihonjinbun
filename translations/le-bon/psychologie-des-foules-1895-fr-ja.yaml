  "translation_status": "reviewed"
- "id": "b2c2-027"
  "source_text": "Notre siècle, et celui qui l’a précédé, seront cités sans doute par des historiens de l’avenir comme une ère de curieuses expériences. À aucun âge il n’en avait été autant tenté."
  "translation_ja": "私たちの世紀とその前の世紀を、後世の歴史家は、きっと奇妙な実験の時代として引き合いに出すだろう。いまだかつて、これほど多くの実験が試みられた時代はなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 297
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[304]"
  "section_id": "b2c2s3"

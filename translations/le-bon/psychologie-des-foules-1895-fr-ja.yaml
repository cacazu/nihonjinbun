- "id": "preface-012"
  "source_text": "Les foules, sans doute, sont toujours inconscientes ; mais cette inconscience même est peut-être un des secrets de leur force. Dans la nature, les êtres soumis exclusivement à l’instinct exécutent des actes dont la complexité merveilleuse nous étonne. La raison est chose trop neuve dans l’humanité, et trop imparfaite encore pour pouvoir nous révéler les lois de l’inconscient et surtout le remplacer. Dans tous nos actes la part de l’inconscient est immense et celle de la raison très petite. L’inconscient agit comme une force encore inconnue."
  "translation_ja": "たしかに群衆はつねに無意識である。だが、その無意識こそが、おそらく群衆の力の秘密の一つなのだ。自然界では、本能だけに従う生き物が、驚くほど込み入った見事な動作をやってのける。人類にとって理性はあまりに新しく、いまだあまりに不完全で、無意識を律する法則を明らかにすることも、とりわけ無意識に取って代わることもできない。私たちのあらゆる行いのうち、無意識の占める分は広大で、理性の占める分はごく小さい。無意識は、なお正体の分からない力として働いている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 45

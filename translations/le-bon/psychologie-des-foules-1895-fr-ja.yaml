  "translation_status": "reviewed"
- "id": "b1c4-005"
  "source_text": "Quand on examine de près les convictions des foules, aussi bien aux époques de foi que dans les grands soulèvements politiques, tels que ceux du dernier siècle, on constate que ces convictions revêtent toujours une forme spéciale, que je ne puis pas mieux déterminer qu’en lui donnant le nom de sentiment religieux."
  "translation_ja": "信仰の時代においても、前世紀にあったような政治上の大蜂起においても、群衆の確信をよくよく調べると、つねに一つの特有の形を帯びることが分かる。私には、それを宗教感情と名づける以上にうまく言い表すことができない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 206
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[208]"

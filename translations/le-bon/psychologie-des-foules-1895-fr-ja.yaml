  "included":
  - "source_id": "fr1895"
    "description_ja": "原刊の半標題紙・巻頭著作広告・標題紙・献辞・序文・序論・全三編十三章・原注二十六件・巻末細目付き目次と原刊の頁表示・印刷所名を収録。明記した除外部分を除く。標題紙の権利留保は当時の刷り文であり、本データの権利表示ではない。"
  "excluded":
  - "source_id": "fr1895"
    "description_ja": "サイトのナビゲーション、空白ページ、装飾罫線、所蔵印、後人の書き込み等は収録しない。"
  - "source_id": "fr1895"
    "description_ja": "第二編第三章第二節冒頭の一段落（b2c3-023）。特定の暴力行動に群衆を動員するための直接の手立てを記した箇所は、原文・訳文とも収録対象外。前後の段落は収録。"
  - "source_id": "fr1895"
    "segment_ids":
    - "b3c2-008"
    - "b3c2-014"
    - "b3c2-015"
    "description_ja": "第三編第二章の三段落の一部。殺害に用いた刃物の使い分け、虐殺対象者の選別手続、苦痛を長引かせる具体的方法は収録していない。本文の心理的・歴史的な叙述は翻訳した。"
  - "source_id": "fr1895"
    "segment_ids":
    - "b3c4-011"
    "description_ja": "第三編第四章、引用中の反乱の具体的な破壊手順に関する一文は、原文・訳文ともに非収録。"

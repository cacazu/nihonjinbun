- "id": "b1c2-053"
  "source_text": "Toujours prête à se soulever contre une autorité faible, la foule se courbe avec servilité devant une autorité forte. Si la force de l’autorité est intermittente, la foule, obéissant toujours à ses sentiments extrêmes, passe alternativement de l’anarchie à la servitude, et de la servitude à l’anarchie."
  "translation_ja": "弱い権威にはいつでも反抗する構えを見せながら、強い権威には卑屈に身を屈めるのが群衆である。権威の力が強まったり弱まったりすれば、例によって極端な感情に従う群衆は、無政府状態から隷属へ、隷属から無政府状態へと交互に移ってゆく。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 159
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[160]"
  "section_id": "b1c2s4"

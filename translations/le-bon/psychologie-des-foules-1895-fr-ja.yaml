- "id": "b2c3-052"
  "source_text": "« Napoléon, écrit le général anglais Wolseley, débarque en France presque seul, et comme un fugitif, de la petite île d’Elbe qui était son royaume, et réussit en quelques semaines à bouleverser, sans effusion de sang, toute l’organisation du pouvoir de la France sous son roi légitime : l’ascendant personnel d’un homme s’affirma-t-il jamais plus étonnamment ? Mais d’un bout à l’autre de cette campagne, qui fut sa dernière, combien est remarquable l’ascendant qu’il exerçait également sur les alliés, les obligeant à suivre son initiative, et combien peu s’en fallut qu’il ne les écrasât ? »"
  "translation_ja": "「ナポレオンは」とイギリスのウルズリー将軍は書く。「その王国だった小さなエルバ島から、逃亡者のように、ほとんど独りでフランスへ上陸した。そしてわずか数週間、血を流すこともなく、正統の王のもとにあるフランスの権力組織をことごとく覆すことに成功した。一個人の影響力がこれ以上驚くべき姿で力を示したことがあろうか。だがこれが最後となった戦役の初めから終わりまで、連合国側にも同じように及ぼしたその影響力は、なんと注目すべきものか。彼らを自分の動きの後に従わせ、あとわずかで打ち砕くところだったではないか」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

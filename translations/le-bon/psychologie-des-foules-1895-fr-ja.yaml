- "id": "b3c4-012"
  "source_text": "Quant à l’influence que pourraient avoir des raisonnements sur l’esprit des électeurs, il faudrait n’avoir jamais lu le compte rendu d’une réunion électorale pour n’être pas fixé à ce sujet. On y échange des affirmations, des invectives, parfois des horions, jamais des raisons. Si le silence s’établit pour un instant, c’est qu’un assistant au caractère difficile annonce qu’il va poser au candidat une de ces questions embarrassantes qui réjouissent toujours l’auditoire. Mais la satisfaction des opposants ne dure pas bien longtemps, car la voix du préopinant est bientôt couverte par les hurlements des adversaires. On peut considérer comme type des réunions publiques les comptes rendus suivants, pris entre des centaines d’autres semblables, et que j’emprunte aux journaux quotidiens :"
  "translation_ja": "推論が有権者の心にどれほど影響しうるかについては、選挙集会の報告を一度も読んだことがない人でなければ、判断に迷うはずはない。その場で交わされるのは断言、罵り、ときに殴り合いであり、根拠の応酬だったためしはない。一瞬沈黙が訪れるとすれば、それは気むずかしい出席者が、聞き手をいつも喜ばせるたぐいの、候補者の返事に困る質問を一つ投げると予告したからだ。だが反対者たちの満足は長く続かない。発言者の声はたちまち相手方のわめき声にかき消される。日刊紙から、似たような数百件のなかの幾つかを借りよう。公開集会の典型とみなしてよい次のような報道である。"
  "source_languages":
  - "fr"
  "source_locations":

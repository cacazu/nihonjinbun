- "id": "b2c1-023"
  "source_text": "§ 3. — LE TEMPS"
  "translation_ja": "第三節　時間"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 241
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[46]"
  "section_id": "b2c1s3"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-024"
  "source_text": "Dans les problèmes sociaux, comme dans les problèmes biologiques, un des plus énergiques facteurs est le temps. Il est le seul vrai créateur et le seul grand destructeur. C’est lui qui a fait les montagnes avec les grains de sable, et élevé jusqu’à la dignité humaine l’obscure cellule des temps géologiques, Il suffit pour transformer un phénomène quelconque de faire intervenir les siècles. On a dit avec raison qu’une fourmi qui aurait le temps devant elle pourrait niveler le mont Blanc. Un être qui aurait le pouvoir magique de faire varier le temps à son gré aurait la puissance que les croyants attribuent à Dieu."
  "translation_ja": "社会の問題においても生物の問題においても、もっとも力強い要因の一つは時間である。それは唯一の真の創造者であり、唯一の偉大な破壊者だ。砂粒を集めて山々をつくり、地質時代の名もなき細胞を人間の尊厳にまで高めたのは時間である。どんな現象を変えるにも、幾世紀もの時を働かせればよい。十分な時間さえあれば、アリ一匹でもモンブランを平らにできるだろうとは、もっともな言葉だ。思いのままに時間を変える魔力を持つ者は、信じる人々が神に与えている力を持つことになろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 242

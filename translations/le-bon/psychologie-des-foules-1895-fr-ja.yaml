  "translation_status": "reviewed"
- "id": "b1c2-009"
  "source_text": "Ces impulsions diverses auxquelles obéissent les foules pourront être, suivant les excitations, généreuses ou cruelles, héroïques ou pusillanimes, mais elles seront toujours tellement impérieuses que l’intérêt personnel, l’intérêt de la conservation lui-même, ne les dominera pas."
  "translation_ja": "群衆が従うさまざまな衝動は、刺激しだいで、寛大なものにも残酷なものにも、英雄的なものにも臆病なものにもなろう。だがそれはいつでもひどく強く、個人の利害どころか、自分の身を守るという利害でさえ、それに勝つことはない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 115
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[117]"
  "section_id": "b1c2s1"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b1c2-010"
  "source_text": "Les excitants qui peuvent agir sur les foules étant fort variés, et les foules y obéissant toujours, celles-ci sont par suite, extrêmement mobiles ; et c’est pourquoi nous les voyons passer en un instant de la férocité la plus sanguinaire à la générosité ou à l’héroïsme le plus absolu. La foule devient très aisément bourreau, mais non moins aisément elle devient martyre. C’est de son sein qu’ont coulé les torrents de sang exigés par le triomphe de chaque croyance. Il n’est pas besoin de remonter aux âges héroïques pour voir de quoi, à ce dernier point de vue, les foules sont capables. Elles ne marchandent jamais leur vie dans une émeute, et il y a bien peu d’années qu’un général, devenu subitement populaire, eût aisément trouvé cent mille hommes prêts à se faire tuer pour sa cause, s’il l’eût demandé."
  "translation_ja": "群衆に働きかける刺激の種類はたいへん多く、群衆はつねにそれに従うので、群衆の心はきわめて移りやすい。だから私たちは、群衆が血に飢えたこのうえない獰猛さから、惜しみない寛大さや徹底した英雄的気概へ、瞬く間に移るのを目にする。群衆はごくたやすく死刑執行人となるが、それに劣らずたやすく殉教者となる。どんな信仰であれ、その勝利のために流さねばならなかった血の奔流は、群衆のうちから流れ出たものだ。この最後の点で群衆に何ができるかを見るのに、英雄時代までさかのぼる必要はない。暴動が起きれば、群衆の人々はけっして命を惜しまない。ほんの数年前にも、にわかに人気を得たある将軍は、そう言いさえすれば、自分の大義のために命を捨てる覚悟の者を難なく十万人見つけられたであろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 116
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[118]"
  "section_id": "b1c2s1"

- "id": "b1c3-022"
  "source_text": "Il serait superflu d’ajouter que l’impuissance des foules à raisonner juste les empêche d’avoir aucune trace d’esprit critique, c’est-à-dire d’être aptes à discerner la vérité de l’erreur, à porter un jugement précis sur quoi que ce soit. Les jugements que les foules acceptent ne sont que des jugements imposés et jamais des jugements discutés. À ce point de vue, nombreux sont les hommes qui ne s’élèvent pas au-dessus de la foule. La facilité avec laquelle certaines opinions deviennent générales tient surtout à l’impossibilité où sont la plupart des hommes de se former une opinion particulière basée sur leurs propres raisonnements."
  "translation_ja": "正しく推論できないために、群衆には批判精神のひとかけらもない、つまり真理と誤りを区別したり、何事についても的確な判断を下したりすることができないとは、付け加えるまでもなかろう。群衆が受け入れる判断は、押しつけられた判断にすぎず、けっして議論を経た判断ではない。この点で、群衆の水準を超えない人間は多い。ある種の意見がたやすく世間一般の意見になるのは、おもに、たいていの人が自分の推論に基づいて自分なりの意見を形づくることができないからである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

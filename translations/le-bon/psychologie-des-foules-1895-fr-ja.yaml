- "id": "b3c5-002"
  "source_text": "Les assemblées parlementaires."
  "translation_ja": "議会"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 500
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[102]"
  "section_id": "b3c5"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-003"
  "source_text": "Les foules parlementaires présentent la plupart des caractères communs aux foules hétérogènes non anonymes. — Simplisme des opinions. — Suggestibilité et limites de cette suggestibilité. — Opinions fixes irréductibles et opinions mobiles. — Pourquoi l’indécision prédomine. — Rôle des meneurs. — Raison de leur prestige. — Ils sont les vrais maîtres d’une assemblée dont les votes ne sont ainsi que ceux d’une petite minorité. — Puissance absolue qu’ils exercent. — Les éléments de leur art oratoire. — Les mots et les images. — Nécessité psychologique pour les meneurs d’être généralement convaincus et bornés. — Impossibilité pour l’orateur sans prestige de faire admettre ses raisons. — L’exagération des sentiments, bons ou mauvais, dans les assemblées. — Automatisme auquel elles arrivent à certains moments. — Les séances de la Convention. — Cas dans lesquels une assemblée perd les caractères des foules. — Influence des spécialistes dans les questions techniques. — Avantages et dangers du régime parlementaire dans tous les pays. — Il est adapté aux nécessités modernes ; mais il entraîne le gaspillage des finances et la restriction progressive de toutes les libertés. — Conclusion de l’ouvrage."
  "translation_ja": "議会という群衆は、匿名でない異質な群衆に共通する性質をほとんど備えている。意見の単純さ。暗示の受けやすさとその限界。動かしがたい定見と移ろいやすい意見。なぜ決めかねることが多いか。指導者の役割。その威信の理由。議会の真の主人は指導者であり、したがって議会の票決が表すのはわずかな少数者の票にすぎない。彼らの振るう絶対の権力。弁論の要素。言葉と像。概して指導者に確信の強さと視野の狭さが必要な心理上の理由。威信のない弁士には自分の言い分を認めさせるすべがない。議会では善い感情も悪い感情も強められる。あるときには議会が自動人形のようになること。国民公会の会議。議会が群衆の特徴を失う場合。専門的な問題における専門家の影響。各国における議会制の利点と危険。議会制は近代の必要にかなうが、公金の浪費と、あらゆる自由が次第に制限される事態をもたらす。本書の結び。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 501
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[103]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-004"
  "source_text": "Les assemblées parlementaires représentent des foules hétérogènes non anonymes. Malgré leur recrutement, variable suivant les époques et les peuples, elles se ressemblent beaucoup par leurs caractères. L’influence de la race s’y fait sentir, pour atténuer ou exagérer, mais non pour empêcher la manifestation des caractères. Les assemblées parlementaires des contrées les plus différentes, celles de Grèce, d’Italie, de Portugal, d’Espagne, de France et d’Amérique, présentent dans leurs discussions et leurs votes de grandes analogies et laissent les gouvernements aux prises avec des difficultés identiques."
  "translation_ja": "議会は、匿名でない異質な群衆の例である。構成員の集め方は時代や民族によって変わるが、その性質はよく似ている。ここでも人種の影響は感じられる。それは性質の現れを弱めたり強めたりはしても、その性質が現れるのを妨げはしない。ギリシア、イタリア、ポルトガル、スペイン、フランス、アメリカといった、まことに異なる国々の議会も、討議や票決の点ではよく似通っており、政府を同じ難問と格闘させている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 502
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[512]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-005"
  "source_text": "Le régime parlementaire représente d’ailleurs l’idéal de tous les peuples civilisés modernes. Il traduit cette idée, psychologiquement erronée mais généralement admise, que beaucoup d’hommes réunis sont bien plus capables qu’un petit nombre de prendre une décision sage et indépendante sur un sujet donné."
  "translation_ja": "それに議会制は、近代のあらゆる文明国民の理想を表している。ある問題について賢明な、他から独立した決定を下すには、少人数よりも大勢の人間が集まったほうがはるかに優れている。心理学的には誤りだが広く認められているこの考えが、形を取ったものだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 503
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[513]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-006"
  "source_text": "Nous retrouverons dans les assemblées parlementaires les caractéristiques générales des foules : le simplisme des idées, l’irritabilité, la suggestibilité, l’exagération des sentiments, l’influence prépondérante des meneurs. Mais, en raison de leur composition spéciale, les foules parlementaires présentent quelques différences que nous indiquerons bientôt."
  "translation_ja": "議会にも群衆一般の特徴が見いだされる。思想の単純さ、怒りやすさ、暗示の受けやすさ、感情の誇張、指導者の圧倒的な影響である。しかし特殊な構成ゆえに議会の群衆にはいくつか相違点もある。これからそれを示そう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 504
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[514]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-007"
  "source_text": "Le simplisme des opinions est une des caractéristiques les plus importantes de ces assemblées. On y rencontre dans tous les partis, chez les peuples latins surtout, une tendance invariable à résoudre les problèmes sociaux les plus compliqués par les principes abstraits les plus simples, et par des lois générales applicables à tous les cas. Les principes varient naturellement avec chaque parti ; mais, par le fait seul que les individus sont en foule, ils tendent toujours à exagérer la valeur de ces principes et à les pousser jusqu’à leurs dernières conséquences. Aussi ce que les parlements représentent surtout, ce sont des opinions extrêmes."
  "translation_ja": "意見を単純化することは、こうした議会のとりわけ重要な特徴である。どの党にも、とりわけラテン系の民族の間には、きわめて複雑な社会問題をもっとも単純な抽象原理と、どの場合にも適用できる一般法則とで解こうとする、変わることのない傾向がある。原理自体はむろん党によって違う。だが個々人が群衆をなすというだけで、その原理の価値を過大に評価し、そこから出てくる結論を最後まで押し通そうとしがちなのはいつも同じだ。だから議会が何よりよく代表するのは極端な意見である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 505
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[515]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-008"
  "source_text": "Le type le plus parfait du simplisme des assemblées fut réalisé par les jacobins de notre grande Révolution. Tous dogmatiques et logiques, la cervelle pleine de généralités vagues, ils s’occupaient d’appliquer des principes fixes sans se soucier des événements ; et on a pu dire avec raison qu’ils avaient traversé la Révolution sans la voir. Avec les dogmes très simples qui leur servaient de guide, ils s’imaginaient refaire une société de toutes pièces, et ramener une civilisation raffinée à une phase très antérieure de l’évolution sociale. Les moyens qu’ils employèrent pour réaliser leur rêve étaient également empreints d’un absolu simplisme. Ils se bornaient en effet, à détruire violemment ce qui les gênait. Tous, d’ailleurs : girondins, montagnards, thermidoriens, etc., étaient animés du même esprit."
  "translation_ja": "議会が物事を単純に見る、そのもっとも完全な型を実現したのは、わが大革命のジャコバン派だった。みな教条家で論理家、頭は漠然とした一般論でいっぱいだった。現に何が起きているかを意に介さず、固定した原理の適用にかかりきりでいた。彼らは革命を見ずに革命をくぐり抜けた、と言った者がいるが、もっともである。道しるべにしたごく単純な教義で一から社会をつくり直し、洗練をきわめた一つの文明を社会進化のはるか昔の段階まで連れ戻せると思った。夢を実現する手段にも、同じく徹底した単純さが刻まれていた。邪魔になるものを手荒く壊すだけだったのだ。それにジロンド派も山岳派もテルミドール派も、みな同じ精神に動かされていた。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 506
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[516]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-009"
  "source_text": "Les foules parlementaires sont très suggestibles ; et, comme pour toutes les foules, la suggestion émane de meneurs possédant du prestige ; mais, dans les assemblées parlementaires, la suggestibilité a des limites très nettes qu’il importe de marquer."
  "translation_ja": "議会の群衆はきわめて暗示を受けやすい。他の群衆の場合と同様、暗示を発するのは威信を備えた指導者である。ただし、議会での暗示の受けやすさには、はっきり指摘しておくべき明確な限界がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 507
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[517]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-010"
  "source_text": "Sur toutes les questions d’intérêt local ou régional, chaque membre d’une assemblée a des opinions fixes, irréductibles, et qu’aucune argumentation ne pourrait ébranler. Le talent d’un Démosthène n’arriverait pas à changer le vote d’un député sur des questions telles que le protectionnisme ou le privilège des bouilleurs de cru, qui représentent des exigences d’électeurs influents. La suggestion antérieure de ces électeurs est assez prépondérante pour annuler toutes les autres suggestions, et maintenir une fixité absolue d’opinion[25]."
  "translation_ja": "地元ないし地方の利害が絡む問題ならどれについても、議員一人ひとりに堅固な、動かしがたい定見があって、どんな議論もこれを揺るがせない。保護貿易や、自家産の果実などから蒸留酒を造る者の特権は、有力な選挙人の要求を表している。こうした問題で議員の投票を変えさせることは、デモステネスほどの才をもってしてもかなわない。あらかじめ選挙人から受けた暗示の力が十分に大きいので、ほかの暗示はことごとく打ち消され、意見は微動だにしないのである。［25］"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 508
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[518]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-note-25"
  "section_id": "b3c5"
  "kind": "note_body"
  "origin": "source"
  "source_text": "C’est à ces opinions antérieurement fixées et rendues irréductibles par des nécessités électorales, que s’applique sans doute cette réflexion d’un vieux parlementaire anglais : « Depuis cinquante ans que je siège à Westminster, j’ai entendu des milliers de discours ; il en est peu qui aient changé mon opinion ; mais pas un seul n’a changé mon vote. »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p173-25"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p173-25"
  "translation_ja": "選挙上の必要からあらかじめ固まり、動かせなくなったこうした意見についての言葉だろう。イギリスのある古参議員は言った。「ウェストミンスターに席を占めて五十年、何千もの演説を聴いた。私の意見を変えた演説は少しはあった。しかし私の投票を変えたものは、ただの一つもなかった。」"
  "translation_status": "reviewed"
- "id": "b3c5-011"
  "source_text": "Sur des questions générales : renversement d’un ministère, établissement d’un impôt, etc., il n’y a plus du tout de fixité d’opinion, et les suggestions des meneurs peuvent agir, mais pas tout à fait comme dans une foule ordinaire. Chaque parti a ses meneurs, qui ont parfois une égale influence. Il en résulte que le député se trouve entre des suggestions contraires et devient fatalement très hésitant. C’est pourquoi on le voit souvent, à un quart d’heure de distance, voter de façon contraire, ajouter à une loi un article qui la détruit : ôter par exemple aux industriels le droit de choisir et de congédier leurs ouvriers, puis annuler à peu près cette mesure par un amendement."
  "translation_ja": "内閣を倒すとか税を設けるとかいった一般的な問題では、意見はもはや少しも固定していない。指導者の暗示も効くが、ふつうの群衆の場合とはやや違う。どの党にも指導者がいて、時には双方の影響力が同じくらいになる。すると議員は相反する暗示の間に立ち、必然的に大いに迷う。だから、ほんの十五分隔てて反対向きの票を投じたり、一つの法律にそれを台無しにする条項を付け加えたりする姿がよく見られる。例えば工場主から職工の採用・解雇を自由に決める権利を奪っておきながら、修正案でその措置をほとんど無にしてしまう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 509
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[519]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-012"
  "source_text": "Et c’est pourquoi, à chaque législature, une Chambre a des opinions très fixes et d’autres opinions très indécises. Au fond, les questions générales étant les plus nombreuses, c’est l’indécision qui domine, indécision entretenue par la crainte constante de l’électeur, dont la suggestion latente tend toujours à contre-balancer l’influence des meneurs."
  "translation_ja": "同じ理由から、どの立法期の議会も、ある事柄では非常に堅い定見を、別の事柄では甚だ定まらない意見をもつ。結局、一般的な問題のほうが多いので、決めかねることのほうが多い。その逡巡を絶やさないのは、選挙人への絶えずつきまとう恐れである。選挙人からの潜在的な暗示が、いつも指導者の影響と釣り合いを取ろうとするのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 510
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[520]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-013"
  "source_text": "Ce sont cependant les meneurs qui sont en définitive les vrais maîtres dans les discussions nombreuses où les membres d’une assemblée n’ont pas d’opinions antérieures bien arrêtées."
  "translation_ja": "ともあれ、議員があらかじめはっきりした意見を固めていない多くの討議では、結局のところ真の主人は指導者である。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 511
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[521]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-014"
  "source_text": "La nécessité de ces meneurs est évidente puisque, sous le nom de chefs de groupes, on les retrouve dans les assemblées de tous les pays. Ils sont les vrais souverains d’une assemblée. Les hommes en foule ne sauraient se passer d’un maître. Et c’est pourquoi les votes d’une assemblée ne représentent généralement que les opinions d’une petite minorité."
  "translation_ja": "そうした指導者が必要なことは明らかだ。会派の長といった名で、どの国の議会にもその姿があるからだ。議会で真の主権を握るのは彼らである。群衆をなす人間は主人なしでは済まない。だから、議会の票決は概してごく少数の人々の意見を表すだけなのだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 512
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[522]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-015"
  "source_text": "Les meneurs agissent très peu par leurs raisonnements, beaucoup par leur prestige. Et la meilleure preuve, c’est que si une circonstance quelconque les en dépouille, ils n’ont plus d’influence."
  "translation_ja": "指導者が人を動かすのに、理屈の力はごく小さく、威信の力が大きい。何かの事情でその威信をはぎ取られれば、影響力はなくなる。それが何よりの証拠だ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 513
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[523]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-016"
  "source_text": "Ce prestige des meneurs est individuel et ne tient ni au nom ni à la célébrité. M. Jules Simon parlant des grands hommes de l’assemblée de 1848, où il a siégé, nous en donne de bien curieux exemples."
  "translation_ja": "この威信は指導者個人に属するもので、家名にも世評の高さにもよらない。一八四八年の議会に席を占めたジュール・シモン氏が、その議会の大人物を語って、まことに興味深い例を挙げている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 514
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[524]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-017"
  "source_text": "« Deux mois avant d’être tout-puissant, Louis-Napoléon n’était rien."
  "translation_ja": "「絶対ともいえる権力を握る二か月前、ルイ＝ナポレオンは何者でもなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 515
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[525]"
  "section_id": "b3c5"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b3c5-018"
  "source_text": "« Victor Hugo monta à la tribune. Il n’y eut pas de succès. On l’écouta, comme on écoutait Félix Pyat ; on ne l’applaudit pas autant. « Je n’aime pas ses idées, me dit Vaulabelle en parlant de Félix Pyat ; mais c’est un des plus grands écrivains et le plus grand orateur de la France. » Edgar Quinet, ce rare et puissant esprit, n’était compté pour rien. Il avait eu son moment de popularité avant l’ouverture de l’Assemblée ; dans l’Assemblée, il n’en eut aucune."
  "translation_ja": "「ヴィクトル・ユゴーが演壇に上った。受けなかった。人々はフェリックス・ピアの話を聴くように耳を傾けたが、あれほどには拍手しなかった。『彼の思想は好きじゃない』とヴォーラベルはフェリックス・ピアのことを私に語った。『だが彼はフランス屈指の文筆家、フランス随一の雄弁家だ』。エドガール・キネというまれに見る力強い精神の持ち主も、まるで数のうちに入らなかった。議会の開会前には一時もてはやされた。議会の中ではまったく人気がなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 516
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[526]"
  "section_id": "b3c5"

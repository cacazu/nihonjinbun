- "id": "b2c1-028"
  "source_text": "§ 4. — LES INSTITUTIONS POLITIQUES ET SOCIALES"
  "translation_ja": "第四節　政治制度と社会制度"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 246
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[47]"
  "section_id": "b2c1s4"
  "kind": "heading"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-029"
  "source_text": "L’idée que les institutions peuvent remédier aux défauts des sociétés ; que le progrès des peuples est la conséquence du perfectionnement des constitutions et des gouvernements et que les changements sociaux peuvent se faire à coups de décrets ; cette idée, dis-je, est très généralement répandue encore. La Révolution française l’eut pour point de départ et les théories sociales actuelles y prennent leur point d’appui."
  "translation_ja": "制度が社会の欠点を矯正できる、諸民族の進歩は憲法や政府の改善から生じる、政令をひとつまたひとつ出すことで社会は変えられる、こういう考えは今もきわめて広く行き渡っている。これを出発点としたのがフランス革命であり、今日の社会理論もまた、ここに足場を置いている。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 247
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[251]"
  "section_id": "b2c1s4"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c1-030"
  "source_text": "Les expériences les plus continues n’ont pas réussi encore à ébranler sérieusement cette redoutable chimère. C’est en vain que philosophes et historiens ont essayé d’en prouver l’absurdité. Il ne leur a pas été difficile pourtant de montrer que les institutions sont filles des idées, des sentiments et des mœurs ; et qu’on ne refait pas les idées, les sentiments et les mœurs en refaisant les codes. Un peuple ne choisit pas ses institutions à son gré, pas plus qu’il ne choisit la couleur de ses yeux ou de ses cheveux. Les institutions et les gouvernements sont le produit de la race. Ils ne sont pas les créateurs d’une époque, mais en sont les créations. Les peuples ne sont pas gouvernés comme le voudraient leurs caprices d’un moment, mais comme l’exige leur caractère. Il faut des siècles pour former un régime politique, et des siècles pour le changer. Les institutions n’ont aucune vertu intrinsèque ; elles ne sont ni bonnes ni mauvaises en elles-mêmes. Celles qui sont bonnes à un moment donné pour un peuple donné, peuvent être détestables pour un autre."
  "translation_ja": "どれほど繰り返し経験を重ねても、この恐ろしい幻想を本気で揺さぶることにはまだ成功していない。哲学者も歴史家もその不合理を証明しようと努めたが、むなしかった。とはいえ、制度は思想と感情と習俗の娘であり、法典を作り直しても、思想や感情や習俗が作り直されるわけではないと示すことは、彼らにとって難しくなかった。民族が意のままに制度を選ぶことができないのは、自分の目や髪の色を選べないのと同じである。制度も政府も、人種の産物だ。ある時代を生んだものではなく、その時代が生んだものだ。民族の治められ方は、その場限りの気まぐれが望むようにではなく、その民族の性格が要求するように決まる。政体を形づくるには幾世紀もかかり、それを変えるのにも幾世紀もかかる。制度そのものには固有の効能などない。それ自体としてよくも悪くもない。ある時点で、ある民族にとってよいものが、別の民族にとっては忌まわしいものになりうる。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

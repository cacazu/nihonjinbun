- "id": "b2c3-047"
  "source_text": "« Les généraux de division, entre autres Augereau, sorte de soudard héroïque et grossier, fier de sa haute taille et de sa bravoure, arrivent au quartier général très mal disposés pour le petit parvenu qu’on leur expédie de Paris. Sur la description qu’on leur en a faite, Augereau est injurieux, insubordonné d’avance : un favori de Barras, un général de vendémiaire, un général de rue, regardé comme un ours, parce qu’il est toujours seul à penser, une petite mine, une réputation de mathématicien et de rêveur. On les introduit, et Bonaparte se fait attendre. Il paraît enfin, ceint de son épée, se couvre, explique ses dispositions, leur donne ses ordres et les congédie. Augereau est resté muet ; c’est dehors seulement qu’il se ressaisit et retrouve ses jurons ordinaires ; il convient, avec Masséna, que ce petit b… de général lui a fait peur ; il ne peut pas comprendre l’ascendant dont il s’est senti écrasé au premier coup d’œil. »"
  "translation_ja": "「師団長たちが司令部にやって来る。なかにはオージュローもいる。背の高さと武勇を鼻にかけた、英雄的ながら粗野な一介の荒武者のような男だ。パリから送ってよこされたちびの成り上がりを、だれもよくは思っていない。伝え聞いた評判だけでオージュローは悪態をつき、初めから従う気がない。バラスのお気に入り、ヴァンデミエールの将軍、街頭の将軍、いつもひとりで考え込んでいるから熊みたいだと言われ、みすぼらしい顔つきで、数学者だの夢想家だのという評判の男だ、と。一同は通されるが、ボナパルトは待たせる。ようやく現れる。剣を帯び、帽子をかぶり、自分の配置を説明し、命令を与え、下がらせる。オージュローは一言もなかった。外へ出てやっと我にかえり、いつもどおりの罵り言葉を取り戻す。マッセナと二人で、あのちびのくそ……将軍にびびらされたと白状する。一目でのしかかってきて押しつぶされるように感じたあの威力が何なのか、彼には分からない」。"

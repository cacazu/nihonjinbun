- "id": "toc-011"
  "source_text": "CHAPITRE III. — Idées, raisonnements et imagination des foules. 48"
  "translation_ja": "第三章　群衆の思想、推論、想像力　48"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

- "id": "preface-006"
  "source_text": "Je dois cependant expliquer au lecteur pourquoi il me verra tirer de mes études des conclusions différentes de celles qu’au premier abord on pourrait croire qu’elles comportent ; constater par exemple l’extrême infériorité mentale des foules, y compris les assemblées d’élite, et déclarer pourtant que, malgré cette infériorité, il serait dangereux de toucher à leur organisation."
  "translation_ja": "ただ、私の研究から一見当然とされそうな結論とは別の結論を私が引き出すのを、読者は目にするだろう。その理由は説明しなければならない。たとえば私は、選り抜きの人々の集会まで含めて、群衆の精神の働きがはなはだ劣ると認めながら、それにもかかわらず、群衆の組織のあり方に手をつけるのは危うい、と述べるのである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 39
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[39]"
  "section_id": "preface"

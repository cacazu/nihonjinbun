  "translation_ja": "肩書、綬、制服が群衆に及ぼすこうした影響は、あらゆる国に見られる。個人の独立心がもっとも発達している国でさえそうだ。この点について、最近のある旅行者の著書から、イギリスの特定の身分の人物が持つ威信に関する興味深い一節を引く。\n\n「さまざまな折に、イギリスの貴族に接するか、あるいは一目見かけるだけでも、もっとも分別あるイギリス人さえ一種独特の陶酔にさらされることに気づいた。\n\n「その暮らし向きが身分に釣り合ってさえいれば、イギリス人は会う前からその貴族が好きで、面と向かえば、彼が何をしても嬉々として受け入れる。近づいただけでうれしさに赤くなるのが見える。声をかけられると、こらえている歓びにいよいよ顔が赤くなり、目には常にない光が宿る。言ってみれば、スペイン人には舞踊、ドイツ人には音楽、フランス人には革命が血のなかにあるように、彼らの血には卿が流れている。馬やシェイクスピアに対する彼らの情熱もこれほど激しくはなく、それに由来する満足や誇りもこれほど根深くない。『貴族名鑑』の売れ行きは並々ならず、どれほど遠くへ行っても、聖書と同じようにだれの手にもある」。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "Cette influence des titres, des rubans, des uniformes sur les foules se rencontre dans tous les pays, même dans ceux ou le sentiment de l’indépendance personnelle est le plus développé. Je reproduis à ce propos un passage curieux du livre récent d’un voyageur sur le prestige de certains personnages en Angleterre. « En diverses rencontres, je ne m’étais aperçu de l’ivresse particulière à laquelle le contact ou la vue d’un pair d’Angleterre exposent les Anglais les plus raisonnables. « Pourvu que son état soutienne son rang, ils l’aiment d’avance, et mis en présence supportent tout de lui avec enchantement. On les voit rougir de plaisir à son approche et, s’il leur parle, la joie qu’ils contiennent augmente cette rougeur et fait briller leurs yeux d’un éclat inaccoutumé. Ils ont le lord dans le sang, si l’on peut dire, comme l’Espagnol la danse, l’Allemand la musique et le Français la Révolution. Leur passion pour les chevaux et Shakespeare est moins violente, la satisfaction et l’orgueil qu’ils en tirent moins fondamentaux. Le Livre de la Patrie a un débit considérable, et si loin qu’on aille, on le trouve, comme la Bible, entre toutes les mains. »"

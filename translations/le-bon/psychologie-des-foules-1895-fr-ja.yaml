- "id": "b1c3-016"
  "source_text": "Mais lorsque, par des procédés divers, une idée a fini par pénétrer dans l’âme des foules, elle possède une puissance irrésistible et déroule toute une série d’effets qu’il faut subir. Les idées philosophiques qui aboutirent à la Révolution française mirent près d’un siècle à s’implanter dans l’âme des foules. On sait leur irrésistible force quand elles y furent établies. L’élan d’un peuple entier vers la conquête de l’égalité sociale, vers la réalisation de droits abstraits et de libertés idéales, fit chanceler tous les trônes et bouleversa profondément le monde occidental. Pendant vingt ans les peuples se précipitèrent les uns sur les autres, et l’Europe connut des hécatombes qui eussent effrayé Gengiskhan et Tamerlan. Jamais le monde ne vit à un tel degré ce que peut produire le déchaînement d’une idée."
  "translation_ja": "だがさまざまな過程を経て、ある思想がついに群衆の魂に入り込むと、抗いがたい力を持ち、私たちの受け入れるほかない結果を次々と繰り広げる。フランス革命に結実した哲学上の思想が群衆の魂に植わるまでには、ほとんど一世紀かかった。ひとたび根づいた後のその力が、いかに抗いがたいものだったかはよく知られている。社会的平等を獲得し、抽象的な権利と理想の自由を実現しようとする一国民全体の躍動は、あらゆる王座を揺さぶり、西洋世界を土台から覆した。二十年にわたって諸民族は相争い、ヨーロッパには、チンギス・ハンやティムールでさえぞっとしたにちがいないほどの人命の犠牲が出た。一つの思想が荒れ狂うとき何を生みうるかがこれほどの規模で示されたのを、世界はかつて見たことがない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 185

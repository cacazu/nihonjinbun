- "id": "b1c2-029"
  "source_text": "Les exemples analogues sont innombrables. Au moment où j’écris ces lignes, les journaux sont remplis par l’histoire de deux petites filles noyées retirées de la Seine. Ces enfants furent d’abord reconnues de la façon la plus catégorique par une douzaine de témoins. Toutes les affirmations étaient si concordantes qu’il n’était resté aucun doute dans l’esprit du juge d’instruction. Il fit établir l’acte de décès. Mais au moment où on allait procéder à l’inhumation, le hasard fit découvrir que les victimes supposées étaient parfaitement vivantes et n’avaient d’ailleurs qu’une très lointaine ressemblance avec les petites noyées. Comme dans plusieurs des exemples précédemment cités l’affirmation du premier témoin, victime d’une illusion, avait suffi à suggestionner tous les autres."
  "translation_ja": "似た例は数えきれない。私がこれを書いているいま、新聞はセーヌ川から引き上げられた溺死した二人の少女の話で持ちきりだ。初めは十数人の証人が、この子らの身元をきっぱりと確認した。だれの言い分もあまりに一致しているので、予審判事の心には何の疑いも残らなかった。彼は死亡証書を作成させた。ところがいよいよ埋葬に取りかかろうというとき、死んだことになっていた少女たちがまったく元気で、そのうえ、溺死した少女たちとはさして似てもいないことが偶然に分かった。先に挙げたいくつかの例と同じく、錯覚に陥った最初の証人がそうだと言い切っただけで、ほかのすべての人にも暗示がかかったのである。"

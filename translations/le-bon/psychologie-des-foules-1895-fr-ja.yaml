- "id": "intro-note-001"
  "section_id": "intro"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Ses plus subtils conseillers ne la comprirent pas d’ailleurs davantage. Talleyrand lui écrivait que « l’Espagne accueillerait en libérateurs ses soldats ». Elle les accueillit comme des bêtes fauves. Un psychologue, au courant des instincts héréditaires de la race, aurait pu aisément prévoir cet accueil."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "page"
    "printed_page": "7"
    "printed_page_end": "8"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p7-1"
  "translation_ja": "もっとも、彼のもっとも鋭敏な顧問たちも、この点では彼以上に分かっていたわけではない。タレーランは「スペインは陛下の兵士を解放者として迎えるでしょう」と書き送った。スペインは彼らを猛獣でも来たかのように迎えた。その人種に受け継がれた本能に通じた心理家であれば、この迎え方をたやすく予見できたであろう。"
  "translation_status": "reviewed"
- "id": "intro-021"
  "source_text": "La connaissance de la psychologie des foules est aujourd’hui la dernière ressource de l’homme d’État qui veut, non pas les gouverner — la chose est devenue bien difficile, — mais tout au moins ne pas être trop gouverné par elles."
  "translation_ja": "今日、群衆を支配しようとはもはや考えず、それはあまりに難しくなったので、せめて群衆に支配されすぎずにいたいと望む政治家にとって、最後に頼れるのは群衆の心理を知ることだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

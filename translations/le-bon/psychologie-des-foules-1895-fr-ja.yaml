    "status": "resolved"
    "message_ja": "この段落の暴力の実行手段に当たる記載は原文・訳文とも非収録。原著の欠損ではない。"
- "id": "b3c2-009"
  "source_text": "On voit clairement ici le mécanisme indiqué précédemment. Obéissance à une suggestion d’autant plus puissante qu’elle est collective, conviction chez le meurtrier qu’il a commis un acte fort méritoire, et conviction d’autant plus naturelle qu’il a pour lui l’approbation unanime de ses concitoyens. Un acte semblable peut être légalement, mais non psychologiquement, qualifié de criminel."
  "translation_ja": "先に示した仕組みが、ここにはっきりと見える。集団から出たからこそいっそう強力になった暗示に従うこと。殺した者が、自分は大いに賞賛に値することをしたと確信していること。その確信が、市民たちの満場一致の賛同を受けているため、ますます自然であること。このような行いは法律のうえでは犯罪と呼べるが、心理のうえではそうは呼べない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 439
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[444]"
  "section_id": "b3c2"

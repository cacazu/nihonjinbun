  "origin": "source"
  "source_text": "Taine. Le Régime moderne, t. II, 1894. — Ces pages sont à peu près les dernières qu’écrivit Taine. Elles résument admirablement les résultats de la longue expérience du grand philosophe. Je les crois malheureusement totalement incompréhensibles pour les professeurs de notre université n’ayant pas séjourné à l’étranger. L’éducation est le seul moyen que nous possédions pour agir un peu sur l’âme d’un peuple et il est profondément triste d’avoir à songer qu’il n’est à peu près personne en France qui puisse arriver à comprendre que notre enseignement actuel est un redoutable élément de rapide décadence et qu’au lieu d’élever la jeunesse il rabaisse et la pervertit. On rapprochera utilement des pages de Taine les observations sur l’éducation en Amérique récemment consignées par M. Paul Bourget dans son beau livre Outre-Mer. Après avoir constaté lui aussi que notre éducation ne fait que des bourgeois bornés sans initiative et sans volonté ou des anarchistes, « ces deux types également funestes du civilisé qui avorte dans la platitude impuissante ou dans l’insanité destructrice » l’auteur fait une comparaison qu’on ne saurait trop méditer entre nos lycées français, ces usines a dégénérescence et les écoles américaines qui préparent si admirablement l’homme à la vie. On y voit clairement l’abîme existant entre les peuples vraiment démocratiques et ceux qui n’ont de démocratie que dans leur discours et pas du tout dans leurs pensées."

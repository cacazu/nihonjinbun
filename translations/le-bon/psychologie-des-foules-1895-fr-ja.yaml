  "translation_status": "reviewed"
- "id": "b1c2-052"
  "source_text": "L’autoritarisme et l’intolérance sont pour les foules des sentiments très clairs, qu’elles conçoivent aisément et qu’elles acceptent aussi facilement qu’elles les pratiquent, dès qu’on les leur impose. Les foules respectent docilement la force et sont médiocrement impressionnées par la bonté, qui n’est guère pour elles qu’une forme de la faiblesse. Leurs sympathies n’ont jamais été aux maîtres débonnaires, mais aux tyrans qui les ont vigoureusement écrasées. C’est toujours à ces derniers qu’elles dressent les plus hautes statues. Si elles foulent volontiers aux pieds le despote renversé, c’est parce qu’ayant perdu sa force, il rentre dans cette catégorie des faibles qu’on méprise parce qu’on ne les craint pas. Le type du héros cher aux foules aura toujours la structure d’un César. Son panache les séduit, son autorité leur impose et son sabre leur fait peur."
  "translation_ja": "権威主義と不寛容は群衆にとってきわめて明瞭な感情で、たやすく理解でき、自分でもたやすく実行するし、他人に押しつけられれば同じようにたやすく受け入れる。群衆は力をおとなしく敬い、親切に心を動かされることはあまりない。親切は群衆にとって弱さの一形態にすぎないからだ。群衆の共感を引いてきたのは、人のよい主人ではなく、強い手で群衆を押しつぶした暴君である。群衆がもっとも高い像を建てるのはいつもそうした暴君のためだ。支配者が倒れれば群衆は喜んで踏みつけるが、それはその者が力を失い、恐れるに足らぬゆえに軽蔑される弱者の仲間に戻ったからだ。群衆の好む英雄の型は、いつの時代にもカエサルの風格を備える。その華々しい武者ぶりが魅惑し、権威が圧倒し、剣が恐怖を与える。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

- "id": "b2c1-027"
  "source_text": "Le temps est donc notre véritable maître, et il suffit de le laisser agir pour voir toutes choses se transformer. Aujourd’hui, nous nous inquiétons fort des aspirations menaçantes des foules, des destructions et des bouleversements qu’elles présagent. Le temps se chargera à lui seul de rétablir l’équilibre. « Aucun régime, écrit très justement M. Lavisse, ne se fonda en un jour. Les organisations politiques et sociales sont des œuvres qui demandent des siècles ; la féodalité exista informe et chaotique pendant des siècles, avant de trouver ses règles ; la monarchie absolue vécut pendant des siècles aussi, avant de trouver des moyens réguliers de gouvernement, et il y eut de grands troubles dans ces périodes d’attente. »"
  "translation_ja": "だから時間こそが私たちの真の主人であり、その働きに任せておくだけで、あらゆるものの変貌を目にすることができる。今、私たちは群衆の願望の脅威と、それが予告する破壊や動乱をおおいに心配している。だが均衡を取り戻すのは、時間だけで引き受けてくれるだろう。ラヴィス氏は次のように的確に書いている。「一日にして成立した政体は一つもない。政治や社会の組織は、数世紀を要する仕事である。封建制は規則を見いだすまで、形も定まらず混沌としたまま何世紀も存在した。絶対王政も規則的な統治の手段を見いだすまで何世紀も続き、そうした待ち時間には大きな騒乱があった」。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

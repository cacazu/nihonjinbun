- "id": "b3c4-025"
  "source_text": "Aussi ne tirerai-je de ce qui précède aucune conclusion contre le suffrage universel. Si j’avais à décider de son sort, je le conserverais tel qu’il est, pour des motifs pratiques qui découlent précisément de notre étude de la psychologie des foules, et que pour cette raison je vais exposer."
  "translation_ja": "したがって、ここまでの話から私は普通選挙に反対する結論を何一つ引き出さない。もしその運命を決める立場にあれば、現状のまま存続させるだろう。それには、まさしく私たちの群衆心理の研究から出てくる実際的な理由があるので、以下に述べよう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 491
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[501]"

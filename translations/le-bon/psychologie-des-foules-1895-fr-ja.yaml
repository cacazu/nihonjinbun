- "id": "b2c1-note-10"
  "section_id": "b2c1s5"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Ce n’est pas là d’ailleurs un phénomène spécial aux peuples latins ; on l’observe aussi en Chine, pays conduit également par une solide hiérarchie de mandarins, et où le mandarinat est, comme chez nous, obtenu par des concours dont la seule épreuve est la récitation imperturbable d’épais manuels. L’armée des lettrés sans emploi est considérée aujourd’hui en Chine comme une véritable calamité nationale. Il en est de même dans l’Inde, où, depuis que les Anglais ont ouvert des écoles, non pour éduquer, comme cela se fait en Angleterre, mais simplement pour instruire les indigènes, il s’est formé une classe spéciale de lettrés, les Babous, qui, lorsqu’ils ne peuvent recevoir un emploi, deviennent d’irréconciliables ennemis de la puissance anglaise. Chez tous les Babous, munis ou non d’emplois, le premier effet de l’instruction a été d’abaisser immensément le niveau de leur moralité. C’est un fait sur lequel j’ai longuement insisté dans mon livre Les Civilisations de l’Inde, et qu’ont également constaté tous les auteurs qui ont visité la grande péninsule."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "anchor": "cite_note-p82-10"
    "url": "https://fr.wikisource.org/w/index.php?title=Psychologie_des_foules/Texte_entier&oldid=14176515#cite_note-p82-10"
  "translation_ja": "これはラテン諸民族に特有の現象ではない。中国でも見られる。やはり強固な官僚の階層組織に導かれる国であり、わが国と同じく、官僚の地位は、分厚い教科書をよどみなく暗唱することだけが課題の競争試験で得られる。職のない知識人の軍勢は、今日の中国で、まことの国家的災厄とみなされている。インドでも同様である。イギリス人が本国でしているように人を育てるためではなく、ただ現地人に知識を授けるために学校を開いて以来、バブーと呼ばれる独特の知識人階級が生まれた。職をもらえなければ、彼らはイギリスの支配と和解しえない敵となる。職の有無にかかわらず、すべてのバブーにおいて教育の第一の効果は、その道徳性の水準を著しく下げたことだった。これは私が著書『インドの諸文明』で詳しく強調した事実であり、この大半島を訪れたすべての著述家が同じように確かめている。"
  "translation_status": "reviewed"
- "id": "b2c1-042"
  "source_text": "Il est évidemment trop tard pour remonter un tel courant. Seule l’expérience, dernière éducatrice des peuples, se chargera de nous montrer notre erreur. Elle seule sera assez puissante pour prouver la nécessité de remplacer nos odieux manuels, nos pitoyables concours par une instruction professionnelle capable de ramener la jeunesse vers les champs, les ateliers, les entreprises coloniales, qu’aujourd’hui elle cherche à tout prix à fuir."
  "translation_ja": "このような流れをさかのぼるには、もはや遅すぎるのは明らかである。諸民族の最後の教育者である経験だけが、私たちに誤りを示す役を引き受けよう。いま若者がどんな代価を払っても逃げたいと思っている農地や工場や植民地事業へと、ふたたびその足を向けさせることのできる職業教育で、忌まわしい教科書や情けない競争試験に取って代わらねばならない。その必要を証明できるだけの力を持つのは経験だけだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"

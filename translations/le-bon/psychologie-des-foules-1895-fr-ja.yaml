- "id": "b2c3-015"
  "source_text": "Les meneurs tendent aujourd’hui à remplacer de plus en plus les pouvoirs publics à mesure que ces derniers se laissent discuter et affaiblir. La tyrannie de ces nouveaux maîtres fait que les foules leur obéissent beaucoup plus docilement qu’elles n’ont obéi à aucun gouvernement. Si, par suite d’un accident quelconque, le meneur disparaît et n’est pas immédiatement remplacé, la foule redevient une collectivité sans cohésion ni résistance. Pendant la dernière grève des employés des omnibus à Paris, il a suffi d’arrêter les deux meneurs qui la dirigeaient pour la faire aussitôt cesser. Ce n’est pas le besoin de la liberté, mais celui de la servitude qui domine toujours dans l’âme des foules. Elles ont une telle soif d’obéir qu’elles se soumettent d’instinct à qui se déclare leur maître."
  "translation_ja": "公権力が批判されるままに弱まってゆくにつれ、指導者は今日、ますますそれに代わる傾向にある。新しい主人たちの圧政のおかげで、群衆はかつてどの政府に従ったときよりも、はるかに素直に従う。何かのはずみで指導者が消え、即座に代わりが現れなければ、群衆はふたたび、まとまりも抵抗力もない集まりになる。この前パリで乗合馬車の従業員がストライキをしたとき、指揮していた二人の指導者が逮捕されると、それだけで、ただちにストは終わった。群衆の魂のなかでいつも優位に立つのは、自由への欲求でなく隷属への欲求である。従いたいとあまりに強く渇望しているため、自分のほうから主人だと名乗る者に本能的に屈服する。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 320

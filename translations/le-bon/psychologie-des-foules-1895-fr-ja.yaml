- "id": "b2c2-004"
  "source_text": "Nous venons de rechercher les facteurs lointains et préparatoires qui donnent à l’âme des foules une réceptivité spéciale, rendant possible chez elle l’éclosion de certains sentiments et de certaines idées. Il nous reste à étudier maintenant les facteurs capables d’agir d’une façon immédiate. Nous verrons dans un prochain chapitre comment doivent être maniés ces facteurs pour qu’ils puissent produire tous leurs effets."
  "translation_ja": "私たちはいま、群衆の魂に独特の受け入れやすさを与え、ある種の感情や思想の開花を可能にする、遠くからの準備の要因を探ってきた。次に残るのは、直接の作用を及ぼしうる要因の研究である。そうした要因に十分な効果を発揮させるにはどう扱うべきかは、この後の章で見ることになろう。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 274
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[281]"

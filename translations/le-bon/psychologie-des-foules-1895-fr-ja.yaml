  "translation_status": "reviewed"
- "id": "b2c3-038"
  "source_text": "Ce qui contribue surtout à donner aux idées propagées par l’affirmation, la répétition et la contagion, une puissance très grande, c’est qu’elles finissent par acquérir le pouvoir mystérieux nommé prestige."
  "translation_ja": "断言と反復と伝染によって広まった思想に、何よりも大きな力を授けるのは、それがついには「威信」という名の神秘的な力を獲得することである。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 343
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[350]"
  "section_id": "b2c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-039"
  "source_text": "Tout ce qui a dominé dans le monde, les idées ou les hommes, s’est imposé principalement par cette force irrésistible qu’exprime le mot prestige. C’est un terme dont nous saisissons tous le sens, mais qu’on applique de façons trop diverses pour qu’il soit facile de le définir. Le prestige peut comporter certains sentiments tels que l’admiration ou la crainte ; il lui arrive parfois même de les avoir pour base, mais il peut parfaitement exister sans eux. Ce sont des morts, et par conséquent des êtres que nous ne craignons pas, Alexandre, César, Mahomet, Bouddha, par exemple, qui possèdent le plus de prestige. D’un autre côté, il y a des êtres ou des fictions que nous n’admirons pas, les divinités monstrueuses des temples souterrains de l’Inde, par exemple, et qui nous paraissent pourtant revêtues d’un grand prestige."
  "translation_ja": "世界を支配してきたものは、思想であれ人間であれ、何よりもこの威信という言葉の表す抗いがたい力によって人々を従えた。私たちはだれもがその意味をつかんでいるが、あまりにさまざまな仕方で使われるため、定義するのが容易ではない言葉だ。威信には、賞賛や恐れなどのある感情が伴うことがあり、それらを土台とすることすらときにはある。だがそのどれもなしに、十分存在しうる。アレクサンドロス、カエサル、ムハンマド、仏陀など、最大の威信を持つのは死者、つまり私たちが恐れていない者たちだ。また一方には、インドの地下神殿の異形の神々のように、私たちが賛美はしないのに、なお大きな威信を帯びているように見える存在や虚構がある。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 344
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[351]"
  "section_id": "b2c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-040"
  "source_text": "Le prestige est en réalité une sorte de domination qu’exerce sur notre esprit un individu, une œuvre ou une idée. Cette domination paralyse toutes nos facultés critiques et remplit notre âme d’étonnement et de respect. Le sentiment provoqué est inexplicable, comme tous les sentiments, mais il doit être du même ordre que la fascination subie par un sujet magnétisé. Le prestige est le plus puissant ressort de toute domination. Les dieux, les rois et les femmes n’auraient jamais régné sans lui."
  "translation_ja": "実のところ威信とは、一個人、一つの作品、あるいは一つの思想が私たちの精神に及ぼす一種の支配である。この支配は私たちの批判能力をことごとく麻痺させ、魂を驚きと敬意で満たす。生じる感情は、あらゆる感情と同じく説明できないが、磁気催眠を受けた者が感じる魅惑と同じ種類のものだろう。威信はあらゆる支配を動かすもっとも強力なばねである。それなしには、神々も王たちも女性たちも、決して君臨できなかった。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 345
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[352]"
  "section_id": "b2c3s3"
  "kind": "paragraph"
  "origin": "source"
  "translation_status": "reviewed"
- "id": "b2c3-041"
  "source_text": "On peut ramener à deux formes principales les diverses variétés de prestige : le prestige acquis et le prestige personnel. Le prestige acquis est celui que, donnent le nom, la fortune, la réputation. Il peut être indépendant du prestige personnel. Le prestige personnel est au contraire quelque chose d’individuel qui peut coexister avec la réputation, la gloire, la fortune, ou être renforcé par elles, mais qui peut parfaitement exister sans elles."
  "translation_ja": "さまざまな威信は、後から得た威信とその人自身の威信の、大きく二つの形にまとめられる。後天的な威信とは、名前、財産、名声から与えられるものだ。それはその人自身の威信とは別個に成り立ちうる。一方、その人自身の威信は個人的な性質で、評判や栄光や資産と併存することも、それらで強まることもあるが、それらなしでも十分に存在しうる。"
  "source_languages":

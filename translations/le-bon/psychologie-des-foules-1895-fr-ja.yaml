- "id": "intro-011"
  "source_text": "Aujourd’hui les revendications des foules deviennent de plus en plus nettes, et ne vont pas à moins qu’à détruire de fond en comble la société actuelle, pour la ramener à ce communisme primitif qui fut l’état normal de tous les groupes humains avant l’aurore de la civilisation. Limitation des heures de travail, expropriation des mines, des chemins de fer, des usines et du sol ; partage égal de tous les produits, élimination de toutes les classes supérieures au profit des classes populaires, etc. Telles sont ces revendications."
  "translation_ja": "今日、群衆の要求はいよいよ明瞭になっている。その行き着くところは、今の社会を根底から壊し、文明の夜明け以前、あらゆる人間集団の常態であった原始共産制に引き戻すことにほかならない。労働時間の制限、鉱山や鉄道、工場や土地の収用、あらゆる生産物の均等分配、民衆の諸階級の利益のために上層階級をことごとくなくすこと、等々。要求とはこうしたものだ。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"
    "source_sequence": 57
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[58]"
  "section_id": "intro"

- "id": "b1c2-036"
  "source_text": "Malheureusement les légendes — alors même qu’elles sont fixées par les livres — n’ont elles-mêmes aucune consistance. L’imagination des foules les transforme sans cesse suivant les temps, et surtout suivant les races. Il y a loin du Jéhovah sanguinaire de la Bible au Dieu d’amour de sainte Thérèse, et le Bouddha adoré en Chine n’a plus aucuns traits communs avec celui qui est vénéré dans l’Inde."
  "translation_ja": "ところが困ったことに、伝説も、本に書きとめられた後でさえ、確かな形を少しもとどめていない。群衆の想像力が、時代に応じ、ことに人種に応じて、絶えずつくり変えてしまう。『聖書』の血に飢えたエホバから聖テレサの愛の神まではあまりに遠い。中国であがめられる仏陀には、インドで崇拝される仏陀と共通する特徴がもはやまるでない。"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "fr1895"
    "precision": "block"

  "translation_status": "reviewed"
- "id": "ill-13-001"
  "section_id": "ill-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô cette chaude matinée de février. Le Sud inopportun vint relever nos souvenirs d’indigents absurdes, notre jeune misère."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Ouvriers&oldid=13607660"
    "source_sequence": 111
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ああ、この二月の暖かな朝。場違いな南風がやってきて、馬鹿げた貧乏人だったぼくらの記憶を、ぼくらの若い貧しさを、掘り起こした。"
  "translation_status": "reviewed"
- "id": "ill-13-002"
  "section_id": "ill-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Henrika avait une jupe de coton à carreau blanc et brun, qui a dû être portée au siècle dernier, un bonnet à rubans, et un foulard de soie. C’était bien plus triste qu’un deuil. Nous faisions un tour dans la banlieue. Le temps était couvert et ce vent du Sud excitait toutes les vilaines odeurs des jardins ravagés et des prés desséchés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Ouvriers&oldid=13607660"
    "source_sequence": 112
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "ヘンリカは、白と茶の格子柄の木綿のスカートを穿いていた。前の世紀から着ていたような代物だ。リボンつきの帽子に、絹のスカーフ。それは喪服より、ずっと悲しかった。ぼくらは郊外を散歩していた。空は曇り、この南風が、荒れた庭や干からびた草原の嫌な匂いを残らず呼び起こしていた。"
  "translation_status": "reviewed"
- "id": "ill-13-003"
  "section_id": "ill-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cela ne devait pas fatiguer ma femme au même point que moi. Dans une flâche laissée par l’inondation du mois précédent à un sentier assez haut elle me fit remarquer de très petits poissons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Ouvriers&oldid=13607660"
    "source_sequence": 113
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "それでも妻は、ぼくほどには参っていないようだった。かなり高い所を通る小道に、先月の洪水が残した水たまりがあり、妻は、ごく小さな魚がいると教えてくれた。"
  "translation_status": "reviewed"
- "id": "ill-13-004"
  "section_id": "ill-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La ville, avec sa fumée et ses bruits de métiers, nous suivait très loin dans les chemins. Ô l’autre monde, l’habitation bénie par le ciel et les ombrages ! Le sud me rappelait les misérables incidents de mon enfance, mes désespoirs d’été, l’horrible quantité de force et de science que le sort a toujours éloignée de moi. Non ! nous ne passerons pas l’été dans cet avare pays où nous ne serons jamais que des orphelins fiancés. Je veux que ce bras durci ne traîne plus une chère image."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Ouvriers&oldid=13607660"
    "source_sequence": 114
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "街は、その煙と機織りの音とともに、道のずっと遠くまでぼくらを追ってきた。ああ、もう一つの世界、天と木陰に祝福された住まいよ！　南風は思い出させた。子どものころのみじめな出来事を、夏の絶望を、運命がいつもぼくから遠ざけてきた、恐ろしいほどの力と知を。いや！　こんなけちな国で夏を過ごしはしない。ここではぼくらはいつまでたっても、婚約した孤児でしかない。この硬くなった腕で、もう、いとしい面影を引きずりたくはない。"
  "translation_status": "reviewed"
- "id": "ill-14-000"
  "section_id": "ill-14"
  "kind": "heading"
  "origin": "source"
  "source_text": "Les ponts"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Les_ponts&oldid=13607673"
    "source_sequence": 115
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Les_ponts"
  "translation_ja": "橋"
  "translation_status": "reviewed"
- "id": "ill-14-001"
  "section_id": "ill-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des ciels gris de cristal. Un bizarre dessin de ponts, ceux-ci droits, ceux-là bombés, d’autres descendant ou obliquant en angles sur les premiers, et ces figures se renouvelant dans les autres circuits éclairés du canal, mais tous tellement longs et légers que les rives, chargées de dômes s’abaissent et s’amoindrissent. Quelques-uns de ces ponts sont encore chargés de masures. D’autres soutiennent des mâts, des signaux, de frêles parapets. Des accords mineurs se croisent, et filent, des cordes montent des berges. On distingue une veste rouge, peut-être d’autres costumes et des instruments de musique. Sont-ce des airs populaires, des bouts de concerts seigneuriaux, des restants d’hymnes publics ? L’eau est grise et bleue, large comme un bras de mer. — Un rayon blanc, tombant du haut du ciel, anéantit cette comédie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Les_ponts&oldid=13607673"
    "source_sequence": 116
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "水晶の灰色の空。奇妙な橋の線描。まっすぐな橋、ふくらんだ橋、最初の橋へ向かって下ったり、角をなして斜めにかかったりする橋。その形が、明るい運河のほかの曲がりにも繰り返される。だがどの橋もあまりに長く軽やかで、ドームを載せた両岸は、低く、小さくなってしまう。いくつかの橋には、まだあばら家が載っている。ほかの橋は、マスト、信号、華奢な欄干を支える。短調の和音が交わり、流れ去り、岸から弦の音がのぼる。赤い上着が見分けられる。ほかの衣装や楽器もあるのかもしれない。あれは民謡なのか、貴族の演奏会の断片なのか、公の賛歌の名残なのか？　水は灰色と青で、入江ほどの広さがある。――空の高みから落ちる白い光が、ひと筋、この喜劇を消し去る。"
  "translation_status": "reviewed"
- "id": "ill-15-000"
  "section_id": "ill-15"
  "kind": "heading"
  "origin": "source"
  "source_text": "Ville"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"

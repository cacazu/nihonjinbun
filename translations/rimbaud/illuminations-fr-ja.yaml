"scope":
  "included":
  - "source_id": "wikisource-hartmann-1958"
    "description_ja": "標題「Illuminations」、副題「Painted Plates」と全42篇の全文・見出し・小節・区切り。幼年時代I–V、いくつもの生I–III、眠らぬ夜I–III、青春I–IVを含む。"
  "excluded":
  - "source_id": "wikisource-hartmann-1958"
    "description_ja": "同書の別部（初期詩、地獄の季節、初期散文、書簡等）、編者の全巻解説・校注、目次の重複、Wikisourceの案内・編集用表示。詩集本文の省略はない。"
  "known_gaps":
  - "source_id": "wikisource-hartmann-1958"
    "segment_ids":
    - "ill-04-001"
    "description_ja": "未訳・本文欠落ではなく、訳語または構文の解釈上の留保。「ひとまわり大きくなれ」の原文はprendre du dos。直訳では「背をつける」となる、意味の定まらない表現である。本訳では成長を促すような言い方を採ったが、身体や振る舞いの何を指すかは断定しない。"
  - "source_id": "wikisource-hartmann-1958"
    "segment_ids":
    - "ill-33-006"
    "description_ja": "未訳・本文欠落ではなく、訳語または構文の解釈上の留保。この小節の後半は、原文にも省略を伴う破格な構文がある。「きみ」と「きみたち」を往還し、計算と焦りが踊りと声へ移る流れを保って訳したが、創案・成功・理性・人類を結ぶ細部の構文は確定しない。"
  - "source_id": "wikisource-hartmann-1958"
    "segment_ids":
    - "ill-40-007"
    "description_ja": "未訳・本文欠落ではなく、訳語または構文の解釈上の留保。「火口」は、火を移すための燃えやすい材料を指す「ほくち」。原文は英語のspunkで、本訳ではこの語義を採った。活力を表す語義もあり、この箇所の比喩の指示対象は確定しない。"

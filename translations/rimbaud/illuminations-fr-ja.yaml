    "source_sequence": 139
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "――つまり、こういうことだったのか？"
  "translation_status": "reviewed"
- "id": "ill-20-007"
  "section_id": "ill-20-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Et le rêve fraîchit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 140
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "――そして夢は涼しさを増す。"
  "translation_status": "reviewed"
- "id": "ill-20-008"
  "section_id": "ill-20-sub-008"
  "kind": "heading"
  "origin": "source"
  "source_text": "II"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 141
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[2]"
    "anchor": "II"
  "translation_ja": "II"
  "translation_status": "reviewed"
- "id": "ill-20-009"
  "section_id": "ill-20-sub-008"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’éclairage revient à l’arbre de bâtisse. Des deux extrémités de la salle, décors quelconques, des élévations harmoniques se joignent. La muraille en face du veilleur est une succession psychologique de coupes de frises, de bandes atmosphériques et d’accidences géologiques. — Rêve intense et rapide de groupes sentimentaux avec des êtres de tous les caractères parmi toutes les apparences."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 142
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "光は建物の大木に戻る。広間の両端から、どこにでもありそうな舞台装置から、調和する高まりが寄り合う。眠らずにいる者の正面の壁は、帯状装飾の断面、大気の帯、地質の変動が心理のうちに連続してゆくものだ。――ありとあらゆる姿のなか、あらゆる気質の存在と織りなす、感情に結ばれた集団の、激しく素早い夢。"
  "translation_status": "reviewed"
- "id": "ill-20-010"
  "section_id": "ill-20-sub-010"
  "kind": "heading"
  "origin": "source"
  "source_text": "III"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 143
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[3]"
    "anchor": "III"
  "translation_ja": "III"
  "translation_status": "reviewed"
- "id": "ill-20-011"
  "section_id": "ill-20-sub-010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les lampes et les tapis de la veillée font le bruit des vagues, la nuit, le long de la coque et autour du steerage."
  "source_languages":
  - "fr"
  - "en"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 144
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "眠らぬ夜のランプと絨毯が、夜、船腹に沿い、三等船室を取り巻く波の音を立てる。"
  "translation_status": "reviewed"
- "id": "ill-20-012"
  "section_id": "ill-20-sub-010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La mer de la veillée, telle que les seins d’Amélie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 145
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "眠らぬ夜の海は、アメリーの乳房のよう。"
  "translation_status": "reviewed"
- "id": "ill-20-013"
  "section_id": "ill-20-sub-010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les tapisseries, jusqu’à mi-hauteur, des taillis de dentelle, teinte d’émeraude, où se jettent les tourterelles de la veillée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 146
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "壁掛けは、半ばの高さまで、エメラルド色のレースの茂み。そこへ、眠らぬ夜の山鳩たちが飛び込んでゆく。"
  "translation_status": "reviewed"
- "id": "ill-20-sep-013"
  "section_id": "ill-20-sub-010"
  "kind": "separator"
  "origin": "source"
  "source_text": "..."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 147
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[10]"
  "translation_ja": "……"
  "translation_status": "reviewed"
- "id": "ill-20-014"
  "section_id": "ill-20-sub-010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La plaque du foyer noir, de réels soleils des grèves : ah ! puits des magies ; seule vue d’aurore, cette fois."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Veill%C3%A9es&oldid=13607679"
    "source_sequence": 148
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[14]"
  "translation_ja": "黒い暖炉の鉄板、浜辺の本物の太陽たち。ああ！　魔法の井戸。今度こそ、夜明けの光景はこれ一つ。"
  "translation_status": "reviewed"
- "id": "ill-21-000"
  "section_id": "ill-21"
  "kind": "heading"
  "origin": "source"
  "source_text": "Mystique"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mystique&oldid=13177425"
    "source_sequence": 149
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Mystique"
  "translation_ja": "神秘"
  "translation_status": "reviewed"
- "id": "ill-21-001"
  "section_id": "ill-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sur la pente du talus les anges tournent leurs robes de laine dans les herbages d’acier et d’émeraude."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mystique&oldid=13177425"
    "source_sequence": 150
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "土手の斜面で、天使たちが羊毛の衣を翻す。鋼とエメラルドの草むらのなかで。"
  "translation_status": "reviewed"
- "id": "ill-21-002"
  "section_id": "ill-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des prés de flammes bondissent jusqu’au sommet du mamelon. À gauche le terreau de l’arête est piétiné par tous les homicides et toutes les batailles, et tous les bruits désastreux filent leur courbe. Derrière l’arête de droite la ligne des orients, des progrès."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mystique&oldid=13177425"
    "source_sequence": 151
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "炎の牧草地が丘の頂まで跳ね上がる。左では、尾根の腐葉土が、あらゆる殺人、あらゆる戦いに踏み荒らされ、破滅の物音がことごとく弧を描いて飛び去る。右の尾根の向こうには、いくつもの東方、いくつもの進歩の線。"
  "translation_status": "reviewed"
- "id": "ill-21-003"
  "section_id": "ill-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et tandis que la bande en haut du tableau est formée de la rumeur tournante et bondissante des conques des mers et des nuits humaines,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mystique&oldid=13177425"
    "source_sequence": 152
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "そして絵の上端の帯は、海の巻貝と人間の夜の、めぐり跳ねるざわめきでできている、そのあいだに、"
  "translation_status": "reviewed"
- "id": "ill-21-004"
  "section_id": "ill-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La douceur fleurie des étoiles et du ciel et du reste descend en face du talus, comme un panier, — contre notre face, et fait l’abîme fleurant et bleu là-dessous."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mystique&oldid=13177425"
    "source_sequence": 153
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "星と空とそのほかのすべての、花咲く優しさが、籠のように土手の正面を降りてくる――ぼくらの顔に押し当てられ、その下に、青く香る深淵をつくる。"
  "translation_status": "reviewed"
- "id": "ill-22-000"
  "section_id": "ill-22"
  "kind": "heading"
  "origin": "source"
  "source_text": "Aube"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 154
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Aube"
  "translation_ja": "夜明け"
  "translation_status": "reviewed"
- "id": "ill-22-001"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J’ai embrassé l’aube d’été."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 155
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ぼくは夏の夜明けを抱いた。"
  "translation_status": "reviewed"
- "id": "ill-22-002"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rien ne bougeait encore au front des palais. L’eau était morte. Les camps d’ombres ne quittaient pas la route du bois. J’ai marché, réveillant les haleines vives et tièdes, et les pierreries regardèrent, et les ailes se levèrent sans bruit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 156
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "宮殿の正面では、まだ何も動いていなかった。水は死んでいた。影の陣営は森の道を離れなかった。ぼくは歩き、温かく生きた息吹を目覚めさせた。すると宝石がこちらを見て、翼が音もなく上がった。"
  "translation_status": "reviewed"
- "id": "ill-22-003"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La première entreprise fut, dans le sentier déjà empli de frais et blêmes éclats, une fleur qui me dit son nom."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 157
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "最初の働きかけは、もうひんやりした青白い輝きでいっぱいの小道で、一輪の花がぼくに自分の名を告げたことだった。"
  "translation_status": "reviewed"
- "id": "ill-22-004"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je ris au wasserfall blond qui s’échevela à travers les sapins : à la cime argentée je reconnus la déesse."
  "source_languages":
  - "fr"
  - "de"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 158
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "モミのあいだで髪を振り乱す金色の滝に、ぼくは笑いかけた。銀色の頂に、女神を見つけた。"
  "translation_status": "reviewed"
- "id": "ill-22-005"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Alors je levai un à un les voiles. Dans l’allée, en agitant les bras. Par la plaine, où je l’ai dénoncée au coq. À la grand’ville elle fuyait parmi les clochers et les dômes, et courant comme un mendiant sur les quais de marbre, je la chassais."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 159
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "そこでぼくは、一枚ずつヴェールを上げた。並木道で、腕を振りながら。平原を抜け、そこでは雄鶏に彼女の居場所を教えた。大きな街では、彼女は鐘楼やドームのあいだを逃げていた。ぼくは物乞いのように大理石の岸を走り、彼女を追った。"
  "translation_status": "reviewed"
- "id": "ill-22-006"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En haut de la route, près d’un bois de lauriers, je l’ai entourée avec ses voiles amassés, et j’ai senti un peu son immense corps. L’aube et l’enfant tombèrent au bas du bois."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 160
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "道をのぼりきった所、月桂樹の林のそばで、かき集めたヴェールごと彼女を抱きしめ、その巨大なからだを少しだけ感じた。夜明けと子どもは、林のふもとに倒れた。"
  "translation_status": "reviewed"
- "id": "ill-22-007"
  "section_id": "ill-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au réveil il était midi."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Aube&oldid=13607681"
    "source_sequence": 161
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "目が覚めると、正午だった。"
  "translation_status": "reviewed"
- "id": "ill-23-000"
  "section_id": "ill-23"
  "kind": "heading"
  "origin": "source"
  "source_text": "Fleurs"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fleurs&oldid=13607682"
    "source_sequence": 162
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Fleurs"
  "translation_ja": "花"
  "translation_status": "reviewed"
- "id": "ill-23-001"
  "section_id": "ill-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "D’un gradin d’or, — parmi les cordons de soie, les gazes grises, les velours verts et les disques de cristal qui noircissent comme du bronze au soleil, — je vois la digitale s’ouvrir sur un tapis de filigranes d’argent, d’yeux et de chevelures."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fleurs&oldid=13607682"
    "source_sequence": 163
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "金の段から――絹の飾り紐、灰色の薄絹、緑のビロード、日の下で青銅のように黒ずむ水晶の円盤に囲まれて――ぼくは見る。銀の透かし細工と、目と髪の絨毯の上で、ジギタリスが花を開くのを。"
  "translation_status": "reviewed"
- "id": "ill-23-002"
  "section_id": "ill-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des pièces d’or jaune semées sur l’agate, des piliers d’acajou supportant un dôme d’émeraudes, des bouquets de satin blanc et de fines verges de rubis entourent la rose d’eau."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fleurs&oldid=13607682"
    "source_sequence": 164
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "瑪瑙の上に撒かれた黄金の貨幣、エメラルドのドームを支えるマホガニーの柱、白い繻子の花束とルビーの細い枝が、水のバラを取り巻く。"
  "translation_status": "reviewed"
- "id": "ill-23-003"
  "section_id": "ill-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tels qu’un dieu aux énormes yeux bleus et aux formes de neige, la mer et le ciel attirent aux terrasses de marbre la foule des jeunes et fortes roses."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fleurs&oldid=13607682"
    "source_sequence": 165
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "大きな青い目と雪の姿をもつ神のように、海と空が、若くたくましいバラの群れを、大理石のテラスへ引き寄せる。"
  "translation_status": "reviewed"
- "id": "ill-24-000"
  "section_id": "ill-24"
  "kind": "heading"
  "origin": "source"
  "source_text": "Nocturne vulgaire"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 166
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Nocturne_vulgaire"
  "translation_ja": "ありふれた夜想曲"
  "translation_status": "reviewed"
- "id": "ill-24-001"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un souffle ouvre des brèches operadiques dans les cloisons, — brouille le pivotement des toits rongés, — disperse les limites des foyers, — éclipse les croisées. —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 167
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ひと吹きの息が、間仕切りにオペラめいた裂け目を開き――蝕まれた屋根の旋回を乱し――住まいの境を散らし――窓を覆い隠す。――"
  "translation_status": "reviewed"
- "id": "ill-24-002"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le long de la vigne, m’étant appuyé du pied à une gargouille, — je suis descendu dans ce carrosse dont l’époque est assez indiquée par les glaces convexes, les panneaux bombés et les sophas contournés. Corbillard de mon sommeil, isolé, maison de berger de ma niaiserie, le véhicule vire sur le gazon de la grande route effacée : et dans un défaut en haut de la glace de droite tournoient les blêmes figures lunaires, feuilles, seins ; — Un vert et un bleu très foncés envahissent l’image. Dételage aux environs d’une tache de gravier."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 168
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "ブドウの蔓を伝い、雨樋の怪物に足をかけて――ぼくはこの馬車に降りた。膨らんだ鏡、丸みを帯びた羽目板、曲がりくねった長椅子が、それのどんな時代かを十分示している。ぼくの眠りの霊柩車、孤立した、ぼくの愚かさの羊飼い小屋。その車は、消えた街道の草地をめぐる。右の鏡の上の傷には、青ざめた月の形、葉、乳房が渦巻く。――ひどく暗い緑と青が像を覆う。砂利のひと斑のあたりで馬具が外される。"
  "translation_status": "reviewed"
- "id": "ill-24-003"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Ici va-t-on siffler pour l’orage, et les Sodomes — et les Solymes, — et les bêtes féroces et les armées,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 169
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "――ここで口笛を吹いて呼ぶのだろうか、嵐を、ソドムたちを――ソリムたちを――猛獣と軍隊を、"
  "translation_status": "reviewed"
- "id": "ill-24-004"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— (Postillons et bêtes de songe reprendront-ils sous les plus suffocantes futaies, pour m’enfoncer jusqu’aux yeux dans la source de soie)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 170
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "――（夢の御者たちと獣たちは、もっとも息の詰まる高木林の下をまた走り、絹の泉へ、ぼくを目の高さまで沈めるのだろうか）"
  "translation_status": "reviewed"
- "id": "ill-24-005"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Et nous envoyer, fouettés à travers les eaux clapotantes et les boissons répandues, rouler sur l’aboi des dogues…"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 171
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "――そして、波立つ水やこぼれた飲み物を越えて鞭打たれるぼくらを、猛犬の吠え声の上に、転がし送り出すのか……"
  "translation_status": "reviewed"
- "id": "ill-24-006"
  "section_id": "ill-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Un souffle disperse les limites du foyer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Nocturne_vulgaire&oldid=13607406"
    "source_sequence": 172
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "――ひと吹きの息が、住まいの境を散らす。"
  "translation_status": "reviewed"
- "id": "ill-25-000"
  "section_id": "ill-25"
  "kind": "heading"
  "origin": "source"
  "source_text": "Marine"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Marine&oldid=13607659"
    "source_sequence": 173
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Marine"
  "translation_ja": "海景"
  "translation_status": "reviewed"
- "id": "ill-25-001"
  "section_id": "ill-25"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Les chars d’argent et de cuivre —
    Les proues d’acier et d’argent —
    Battent l’écume, —
    Soulèvent les souches des ronces.
    Les courants de la lande,
    Et les ornières immenses du reflux,
    Filent circulairement vers l’est,
    Vers les piliers de la forêt, —
    Vers les fûts de la jetée,
    Dont l’angle est heurté par des tourbillons de lumière.
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Marine&oldid=13607659"
    "source_sequence": 174
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div"
  "translation_ja": |-
    銀と銅の戦車が――
    鋼と銀の船首が――
    泡を打ち、――
    イバラの根株を持ち上げる。
    荒野の流れと、
    引き潮の巨大な轍は、
    輪を描き、東へ走る、
    森の柱へ、――
    防波堤の柱身へ、
    その角には、光の渦がぶつかっている。
  "translation_status": "reviewed"
- "id": "ill-26-000"
  "section_id": "ill-26"
  "kind": "heading"
  "origin": "source"
  "source_text": "Fête d’hiver"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/F%C3%AAte_d%E2%80%99hiver&oldid=13607661"
    "source_sequence": 175
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Fête_d’hiver"
  "translation_ja": "冬の祭り"
  "translation_status": "reviewed"
- "id": "ill-26-001"
  "section_id": "ill-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La cascade sonne derrière les huttes d’opéra-comique. Des girandoles prolongent, dans les vergers et les allées voisins du Méandre, — les verts et les rouges du couchant. Nymphes d’Horace coiffées au Premier Empire, — Rondes Sibériennes, Chinoises de Boucher."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/F%C3%AAte_d%E2%80%99hiver&oldid=13607661"
    "source_sequence": 176
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "オペラ・コミックの小屋の向こうで滝が鳴る。メアンドロス川のそばの果樹園や並木道へ、仕掛け花火が夕焼けの緑と赤を引き延ばす。第一帝政の髪型をしたホラティウスのニンフたち――シベリアの輪舞、ブーシェの中国娘たち。"
  "translation_status": "reviewed"
- "id": "ill-27-000"
  "section_id": "ill-27"
  "kind": "heading"
  "origin": "source"
  "source_text": "Angoisse"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 177
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Angoisse"
  "translation_ja": "不安"
  "translation_status": "reviewed"
- "id": "ill-27-001"
  "section_id": "ill-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Se peut-il qu’Elle me fasse pardonner les ambitions continuellement écrasées, — qu’une fin aisée répare les âges d’indigence, — qu’un jour de succès nous endorme sur la honte de notre inhabileté fatale ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 178
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ありうるだろうか、絶えず押し潰されてきた野心を、あの女がぼくのために許させてくれるなど――安らかな終わりが、幾時代もの貧苦を償うなど――成功の一日が、宿命的な不器用さへの恥を忘れさせ、ぼくらを眠らせるなど？"
  "translation_status": "reviewed"
- "id": "ill-27-002"
  "section_id": "ill-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "(Ô palmes ! diamant ! — Amour, force ! — plus haut que toutes joies et gloires ! — de toutes façons, partout, — démon, dieu, — Jeunesse de cet être-ci : moi !)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 179
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "（ああ、棕櫚の栄冠！　ダイヤモンド！――愛、力！――あらゆる喜びと栄光を超えて！――あらゆる形で、どこででも――悪魔、神――この存在、ぼくという存在の青春よ！）"
  "translation_status": "reviewed"
- "id": "ill-27-003"
  "section_id": "ill-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Que des accidents de féerie scientifique et des mouvements de fraternité sociale soient chéris comme restitution progressive de la franchise première ?…"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 180
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "科学の魔法が生む偶然や、社会の友愛の運動を、もとの自由を少しずつ取り戻すものとして、愛せるだろうか？……"
  "translation_status": "reviewed"
- "id": "ill-27-004"
  "section_id": "ill-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais la Vampire qui nous rend gentils commande que nous nous amusions avec ce qu’elle nous laisse, ou qu’autrement nous soyons plus drôles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 181
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "だが、ぼくらをおとなしくさせる女吸血鬼は命じる。残してやったもので楽しめ、さもなければ、もっとおかしく振る舞えと。"
  "translation_status": "reviewed"
- "id": "ill-27-005"
  "section_id": "ill-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rouler aux blessures, par l’air lassant et la mer ; aux supplices, par le silence des eaux et de l’air meurtriers ; aux tortures qui rient, dans leur silence atrocement houleux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Angoisse&oldid=13607414"
    "source_sequence": 182
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "くたびれさせる空気と海を渡り、傷へ転がってゆくこと。殺しにかかる水と空気の沈黙を渡り、責め苦へ。凄まじく波立つ沈黙のなかで笑う、拷問へ。"
  "translation_status": "reviewed"
- "id": "ill-28-000"
  "section_id": "ill-28"
  "kind": "heading"
  "origin": "source"
  "source_text": "Métropolitain"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 183
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Métropolitain"
  "translation_ja": "大都会"
  "translation_status": "reviewed"
- "id": "ill-28-001"
  "section_id": "ill-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Du détroit d’indigo aux mers d’Ossian, sur le sable rose et orange qu’a lavé le ciel vineux viennent de monter et de se croiser des boulevards de cristal habités incontinent par de jeunes familles pauvres qui s’alimentent chez les fruitiers. Rien de riche. — La ville !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 184
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "藍色の海峡からオシアンの海まで、葡萄酒色の空に洗われた、ばら色とオレンジ色の砂の上に、水晶の大通りが立ち上がり、交差したばかりだ。そこにはすぐ、果物屋で食べ物を手に入れる、若い貧しい家族が住みつく。豊かなものなど一つもない。――街！"
  "translation_status": "reviewed"
- "id": "ill-28-002"
  "section_id": "ill-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Du désert de bitume fuient droit en déroute avec les nappes de brumes échelonnées en bandes affreuses au ciel qui se recourbe, se recule et descend, formé de la plus sinistre fumée noire que puisse faire l’Océan en deuil, les casques, les roues, les barques, les croupes. — La bataille !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 185
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "アスファルトの砂漠から、兜も車輪も小舟も尻も、敗走してまっすぐ逃げてゆく。恐ろしい帯となって幾重にも並ぶ霧とともに。その空は反り、退き、降りてくる。喪に服する大洋がつくれるかぎりの、最も不吉な黒煙でできている。――戦い！"
  "translation_status": "reviewed"
- "id": "ill-28-003"
  "section_id": "ill-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lève la tête : ce pont de bois, arqué ; les derniers potagers de Samarie ; ces masques enluminés sous la lanterne fouettée par la nuit froide ; l’ondine niaise à la robe bruyante, au bas de la rivière ; ces crânes lumineux dans les plans de pois — et les autres fantasmagories — la campagne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 186
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "顔を上げろ。この弓なりの木の橋、サマリアの最後の菜園、冷たい夜に打たれる提灯の下の彩色の仮面、川の下手の、衣を鳴らす間抜けな水の精、エンドウの畑の光る頭蓋――そのほかの幻灯の数々――田園。"
  "translation_status": "reviewed"
- "id": "ill-28-004"
  "section_id": "ill-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des routes bordées de grilles et de murs, contenant à peine leurs bosquets, et les atroces fleurs qu’on appellerait cœurs et sœurs, Damas damnant de langueur, — possessions de féeriques aristocraties ultra-Rhénanes, Japonaises, Guaranies, propres encore à recevoir la musique des anciens — et il y a des auberges qui pour toujours n’ouvrent déjà plus — il y a des princesses, et si tu n’es pas trop accablé, l’étude des astres — le ciel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 187
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "柵や壁に縁取られた道々、その木立や、「心」や「姉妹」とでも呼ぶほかない凄まじい花を、やっと囲っている道々。けだるさで呪うダマスク織――ラインの彼方、日本、グアラニーの、魔法の貴族たちの領地。今なお昔の人の音楽を迎え入れられる場所――そして宿がある、もう永遠に戸を開けない宿が――王女たちがいる、そして、きみがあまりに打ちのめされていなければ、星の研究も――空。"
  "translation_status": "reviewed"
- "id": "ill-28-005"
  "section_id": "ill-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le matin où avec Elle, vous vous débattîtes parmi les éclats de neige, ces lèvres vertes, les glaces, les drapeaux noirs et les rayons bleus, et les parfums pourpres du soleil des pôles, — ta force."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/M%C3%A9tropolitain&oldid=13607683"
    "source_sequence": 188
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "あの女とともに、きみたちがもがいた朝。雪の輝き、あの緑の唇、氷、黒い旗、青い光、極地の太陽の紫の香りに囲まれて――きみの力。"
  "translation_status": "reviewed"
- "id": "ill-29-000"
  "section_id": "ill-29"
  "kind": "heading"
  "origin": "source"
  "source_text": "Barbare"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 189
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Barbare"
  "translation_ja": "野蛮"
  "translation_status": "reviewed"
- "id": "ill-29-001"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bien après les jours et les saisons, et les êtres et les pays,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 190
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "日々も季節も、生きものも国々も、はるかに過ぎたあと、"
  "translation_status": "reviewed"
- "id": "ill-29-002"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le pavillon en viande saignante sur la soie des mers et des fleurs arctiques ; (elles n’existent pas,)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 191
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "血の滴る肉の旗、海と北極の花の絹の上に。（そんな花はありはしない、）"
  "translation_status": "reviewed"
- "id": "ill-29-003"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Remis des vieilles fanfares d’héroïsme — qui nous attaquent encore le cœur et la tête — loin des anciens assassins —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 192
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "古い英雄主義のファンファーレから立ち直り――それはいまもぼくらの心と頭を攻める――昔の暗殺者たちから遠く離れて――"
  "translation_status": "reviewed"
- "id": "ill-29-004"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Oh ! Le pavillon en viande saignante sur la soie des mers et des fleurs arctiques ; (elles n’existent pas.)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 193
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "ああ！　血の滴る肉の旗、海と北極の花の絹の上に。（そんな花はありはしない。）"
  "translation_status": "reviewed"
- "id": "ill-29-005"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Douceurs !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 194
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "甘美さよ！"
  "translation_status": "reviewed"
- "id": "ill-29-006"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les brasiers, pleuvant aux rafales de givre, — Douceurs ! — les feux à la pluie du vent de diamants jetée par le cœur terrestre éternellement carbonisé pour nous. — Ô monde ! —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 195
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "霜の突風に降り注ぐ烈火――甘美さよ！――ぼくらのために永遠に炭と化した地球の心臓が投げつける、ダイヤモンドの風の雨を浴びる火。――ああ、世界！――"
  "translation_status": "reviewed"
- "id": "ill-29-007"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "(Loin des vieilles retraites et des vieilles flammes, qu’on entend, qu’on sent,)"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 196
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "（聞こえてくる、感じられる、古い退却と古い炎から遠く、）"
  "translation_status": "reviewed"
- "id": "ill-29-008"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les brasiers et les écumes. La musique, virement des gouffres et choc des glaçons aux astres."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 197
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "烈火と泡。音楽、深淵の転回、星々に衝突する氷塊。"
  "translation_status": "reviewed"
- "id": "ill-29-009"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô Douceurs, ô monde, ô musique ! Et là, les formes, les sueurs, les chevelures et les yeux, flottant. Et les larmes blanches, bouillantes, — ô douceurs ! — et la voix féminine arrivée au fond des volcans et des grottes arctiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 198
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "ああ、甘美さ、ああ、世界、ああ、音楽！　そしてそこには、かたち、汗、髪、目が、漂っている。そして白い、煮え立つ涙――ああ、甘美さ！――そして火山と北極の洞窟の奥へ届いた、女の声。"
  "translation_status": "reviewed"
- "id": "ill-29-010"
  "section_id": "ill-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le pavillon…"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Barbare&oldid=13607418"
    "source_sequence": 199
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[14]"
  "translation_ja": "あの旗が……"
  "translation_status": "reviewed"
- "id": "ill-30-000"
  "section_id": "ill-30"
  "kind": "heading"
  "origin": "source"
  "source_text": "Solde"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 200
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Solde"
  "translation_ja": "大売出し"
  "translation_status": "reviewed"
- "id": "ill-30-001"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre ce que les juifs n’ont pas vendu, ce que noblesse ni crime n’ont goûté, ce qu’ignorent l’amour maudit et la probité infernale des masses ; ce que le temps ni la science n’ont pas à reconnaître ;"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 201
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "売ります、ユダヤ人たちも売らなかったもの、貴族も犯罪も味わわなかったもの、呪われた愛も民衆の地獄めいた清廉さも知らないもの、時間も科学も認める必要のないものを。"
  "translation_status": "reviewed"
- "id": "ill-30-002"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les Voix reconstituées ; l’éveil fraternel de toutes les énergies chorales et orchestrales et leurs applications instantanées ; l’occasion, unique, de dégager nos sens !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 202
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "再び組み立てられた声々、合唱と管弦楽のすべての力の、兄弟のような目覚めと、その即座の応用。ぼくらの感覚を解き放つ、ただ一度の機会！"
  "translation_status": "reviewed"
- "id": "ill-30-003"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre les Corps sans prix, hors de toute race, de tout monde, de tout sexe, de toute descendance ! Les richesses jaillissant à chaque démarche ! Solde de diamants sans contrôle !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 203
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "売ります、どんな人種、どんな世界、どんな性、どんな血統の外にもある、値のつけられないからだを！　一歩ごとに噴き出す富！　検査なしのダイヤモンドを大売出し！"
  "translation_status": "reviewed"
- "id": "ill-30-004"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre l’anarchie pour les masses ; la satisfaction irrépressible pour les amateurs supérieurs ; la mort atroce pour les fidèles et les amants !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 204
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "売ります、民衆には無政府状態、上等な愛好家には抑えられない満足、信じる者と恋する者には凄まじい死を！"
  "translation_status": "reviewed"
- "id": "ill-30-005"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre les habitations et les migrations, sports, féeries et comforts parfaits, et le bruit, le mouvement et l’avenir qu’ils font !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 205
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "売ります、住まいと移住、スポーツ、魔法の見世物、完璧な快適さ、そしてそれらが生む騒音、運動、未来を！"
  "translation_status": "reviewed"
- "id": "ill-30-006"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre les applications de calcul et les sauts d’harmonie inouïs. Les trouvailles et les termes non soupçonnés, possession immédiate,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 206
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "売ります、計算の応用と、聞いたこともない和声の跳躍を。思いもよらなかった発見と表現を、その場であなたのものに、"
  "translation_status": "reviewed"
- "id": "ill-30-007"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Élan insensé et infini aux splendeurs invisibles, aux délices insensibles, — et ses secrets affolants pour chaque vice — et sa gaîté effrayante pour la foule —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 207
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "目に見えない輝きへ、感じ取れない歓びへ向かう、無分別で果てしない飛躍を――悪徳の一つ一つに取り憑く、その狂おしい秘密を――群衆を怖がらせる、その陽気さを――"
  "translation_status": "reviewed"
- "id": "ill-30-008"
  "section_id": "ill-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À vendre les Corps, les voix, l’immense opulence inquestionable, ce qu’on ne vendra jamais. Les vendeurs ne sont pas à bout de solde ! Les voyageurs n’ont pas à rendre leur commission de si tôt !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Solde&oldid=13607428"
    "source_sequence": 208
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "売ります、からだを、声を、疑いようのない途方もない富を、決して売れないものを。売り手の在庫はまだ尽きない！　旅の売り子たちも、こんなに早く頼まれ仕事を返すには及ばない！"
  "translation_status": "reviewed"
- "id": "ill-31-000"
  "section_id": "ill-31"
  "kind": "heading"
  "origin": "source"
  "source_text": "Fairy"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fairy&oldid=13607427"
    "source_sequence": 209
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Fairy"
  "translation_ja": "妖精"
  "translation_status": "reviewed"
- "id": "ill-31-001"
  "section_id": "ill-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour Hélène se conjurèrent les sèves ornamentales dans les ombres vierges et les clartés impassibles dans le silence astral. L’ardeur de l’été fut confiée à des oiseaux muets et l’indolence requise à une barque de deuils sans prix par des anses d’amours morts et de parfums affaissés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fairy&oldid=13607427"
    "source_sequence": 210
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "エレーヌのために、手つかずの影のなかで飾りの樹液が結託し、星の沈黙のなかで無感動な光が結託した。夏の熱は口をきかない鳥たちに託され、求められたけだるさは、計り知れない喪の小舟に託された。死んだ愛と衰えた香りの入江を通って。"
  "translation_status": "reviewed"
- "id": "ill-31-002"
  "section_id": "ill-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Après le moment de l’air des bûcheronnes à la rumeur du torrent sous la ruine des bois, de la sonnerie des bestiaux à l’écho des vals, et des cris des steppes. —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fairy&oldid=13607427"
    "source_sequence": 211
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "――女きこりたちの歌が、崩れた森の下の急流のとどろきに響いた時、家畜の鈴が谷々のこだまに響いた時、そして草原の叫びが響いた時の、あとで。――"
  "translation_status": "reviewed"
- "id": "ill-31-003"
  "section_id": "ill-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pour l’enfance d’Hélène frissonnèrent les fourrures et les ombres — et le sein des pauvres, et les légendes du ciel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fairy&oldid=13607427"
    "source_sequence": 212
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "エレーヌの幼年時代のために、毛皮と影が震えた――貧しい人々の胸も、空の伝説も。"
  "translation_status": "reviewed"
- "id": "ill-31-004"
  "section_id": "ill-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et ses yeux et sa danse supérieurs encore aux éclats précieux, aux influences froides, au plaisir du décor et de l’heure uniques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Fairy&oldid=13607427"
    "source_sequence": 213
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "そして彼女の目と踊りは、なおもまさる。貴石の輝きにも、冷たい感応にも、ただ一つの景色と時が与える歓びにも。"
  "translation_status": "reviewed"
- "id": "ill-32-000"
  "section_id": "ill-32"
  "kind": "heading"
  "origin": "source"
  "source_text": "Guerre"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Guerre&oldid=13607506"
    "source_sequence": 214
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Guerre"
  "translation_ja": "戦争"
  "translation_status": "reviewed"
- "id": "ill-32-001"
  "section_id": "ill-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Enfant, certains ciels ont affiné mon optique : tous les caractères nuancèrent ma physionomie. Les Phénomènes s’émurent. — À présent, l’inflexion éternelle des moments et l’infini des mathématiques me chassent par ce monde où je subis tous les succès civils, respecté de l’enfance étrange et des affections énormes. — Je songe à une Guerre, de droit ou de force, de logique bien imprévue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Guerre&oldid=13607506"
    "source_sequence": 215
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "子どものころ、ある空々がぼくの目を研ぎ澄ました。あらゆる気質がぼくの顔に色合いを与えた。現象たちが心を動かした。――今では、瞬間の永遠の屈折と、数学の無限が、この世界でぼくを追い立てる。ここでぼくは、市民社会のあらゆる成功を受け入れさせられ、不思議な幼年時代と途方もない愛情から敬意を寄せられている。――ぼくはある戦争を思う。正義によるにせよ、力によるにせよ、まったく思いがけない論理の戦争を。"
  "translation_status": "reviewed"
- "id": "ill-32-002"
  "section_id": "ill-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est aussi simple qu’une phrase musicale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Guerre&oldid=13607506"
    "source_sequence": 216
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "それは音楽のひと節と同じくらい単純だ。"
  "translation_status": "reviewed"

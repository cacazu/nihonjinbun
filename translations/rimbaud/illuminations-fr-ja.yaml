- "id": "ill-09-001"
  "section_id": "ill-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un beau matin, chez un peuple fort doux, un homme et une femme superbes criaient sur la place publique, « Mes amis, je veux qu’elle soit reine ! » « Je veux être reine ! » Elle riait et tremblait. Il parlait aux amis de révélation, d’épreuve terminée. Ils se pâmaient l’un contre l’autre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Royaut%C3%A9&oldid=13607669"
    "source_sequence": 78
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ある晴れた朝、とても穏やかな民の国で、見事な男と女が広場で叫んでいた。「友よ、この人を女王にしたい！」「わたしは女王になりたい！」女は笑い、震えていた。男は友人たちに、啓示について、試練が終わったことについて話していた。二人はもたれ合って、うっとりしていた。"
  "translation_status": "reviewed"
- "id": "ill-09-002"
  "section_id": "ill-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En effet ils furent rois toute une matinée où les tentures carminées se relevèrent sur les maisons, et toute l’après-midi, où ils s’avancèrent du côté des jardins de palmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Royaut%C3%A9&oldid=13607669"
    "source_sequence": 79
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "実際、二人は午前じゅう王と女王だった。家々には深紅の垂れ幕が巻き上げられた。そして午後じゅうも。二人は棕櫚の庭園の方へ進んでいった。"
  "translation_status": "reviewed"

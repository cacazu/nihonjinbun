- "id": "ill-07-004"
  "section_id": "ill-07-sub-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je suis un inventeur bien autrement méritant que tous ceux qui m’ont précédé ; un musicien même, qui ai trouvé quelque chose comme la clef de l’amour. À présent, gentilhomme d’une campagne aigre au ciel sobre, j’essaye de m’émouvoir au souvenir de l’enfance mendiante, de l’apprentissage ou de l’arrivée en sabots, des polémiques, des cinq ou six veuvages, et quelques noces où ma forte tête m’empêcha de monter au diapason des camarades. Je ne regrette pas ma vieille part de gaîté divine : l’air sobre de cette aigre campagne alimente fort activement mon atroce scepticisme. Mais comme ce scepticisme ne peut désormais être mis en œuvre, et que d’ailleurs je suis dévoué à un trouble nouveau, — j’attends de devenir un très méchant fou."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vies&oldid=13607688"
    "source_sequence": 69
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ぼくは、これまでの誰よりもはるかに功績のある発明家だ。それどころか音楽家で、愛の鍵のようなものさえ見つけた。今は、地味な空の下、やせた田舎の紳士として、思い出に胸を動かそうとしている。物乞いをしていた幼年時代、見習い暮らし、木靴を履いてやってきた日のこと、論争、五、六度の死別、何度かの結婚式。そこでは、この頑固な頭のせいで仲間たちと調子を合わせられなかった。かつて与えられていた神々しい陽気さを、惜しいとは思わない。このやせた田舎の地味な空気は、ぼくの凄まじい懐疑心をせっせと養う。しかし、今ではその懐疑心も働かせようがなく、そのうえ、ぼくは新しい動揺に身を捧げている――だから、ひどくたちの悪い狂人になるのを待っている。"
  "translation_status": "reviewed"

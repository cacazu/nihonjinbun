    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Bottom"
  "translation_ja": "ボトム"
  "translation_status": "reviewed"
- "id": "ill-37-001"
  "section_id": "ill-37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La réalité étant trop épineuse pour mon grand caractère, — je me trouvai néanmoins chez Madame, en gros oiseau gris bleu s’essorant vers les moulures du plafond et traînant l’aile dans les ombres de la soirée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Bottom&oldid=13607576"
    "source_sequence": 246
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "現実は、ぼくの偉大な性格には棘が多すぎた――それでもぼくは、奥方のもとにいた。大きな灰青色の鳥になり、天井の繰形へ舞い上がり、夕べの影のなかで翼を引きずって。"
  "translation_status": "reviewed"
- "id": "ill-37-002"
  "section_id": "ill-37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je fus, au pied du baldaquin supportant ses bijoux adorés et ses chefs d’œuvre physiques, un gros ours aux gencives violettes et au poil chenu de chagrin, les yeux aux cristaux et aux argents des consoles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Bottom&oldid=13607576"
    "source_sequence": 247
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "彼女の愛する宝石と、肉体の傑作を支える天蓋の寝床の足もとで、ぼくは大きな熊になった。歯茎は紫、毛は悲しみで白くなり、目は飾り台の水晶と銀器に注がれていた。"
  "translation_status": "reviewed"
- "id": "ill-37-003"
  "section_id": "ill-37"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tout se fit ombre et aquarium ardent. Au matin, — aube de juin batailleuse, — je courus aux champs, âne, claironnant et brandissant mon grief, jusqu’à ce que les Sabines de la banlieue vinrent se jeter à mon poitrail."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Bottom&oldid=13607576"
    "source_sequence": 248
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "すべてが影と、燃える水槽になった。朝に――六月の戦う夜明けに――ぼくはロバとなって野へ駆け出し、不満を吹き鳴らし、振りかざした。郊外のサビニの女たちが、ぼくの胸に身を投げてくるまで。"
  "translation_status": "reviewed"
- "id": "ill-38-000"
  "section_id": "ill-38"
  "kind": "heading"
  "origin": "source"
  "source_text": "H"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"

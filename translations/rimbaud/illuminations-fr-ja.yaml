    修正指摘:
    13.04 l’habitation bénie par le ciel et les ombrages の係り受けを「天と木陰に祝福された住まい」に修正。
    18.03 aussitôt endormi の主語を「ぼく」から「哀れな兄弟」に修正。
    34.01 qui permettent の主語を単数の「精神」から複数の「旅人や貴人」に修正。
    35.07 On s’agite の前の、原文にない「あるいは」を削除。
    留保: 04.01 prendre du dos、33.06 Sonnet後半の破格構文、40.07 spunk。

    "source_sequence": 249
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "H"
  "translation_ja": "H"
  "translation_status": "reviewed"
- "id": "ill-38-001"
  "section_id": "ill-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutes les monstruosités violent les gestes atroces d’Hortense. Sa solitude est la mécanique érotique, sa lassitude, la dynamique amoureuse. Sous la surveillance d’une enfance elle a été, à des époques nombreuses, l’ardente hygiène des races. Sa porte est ouverte à la misère. Là, la moralité des êtres actuels se décorpore en sa passion ou en son action — ô terrible frisson des amours novices sur le sol sanglant et par l’hydrogène clarteux ! trouvez Hortense."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/H&oldid=13607600"
    "source_sequence": 250
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "あらゆる怪異が、オルタンスの凄まじい身ぶりを犯す。彼女の孤独は性の機械仕掛け、その疲労は愛の力学。ある幼年時代の監視の下で、彼女は何度もの時代にわたり、諸民族の熱烈な衛生だった。彼女の扉は貧窮に開かれている。そこで、今を生きる者たちの道徳は、彼女の情熱、あるいはその行為のなかで、からだを失う――ああ、血の流れる地面の上、明るく輝く水素を通って走る、初めての愛の恐るべき震え！　オルタンスを見つけよ。"
  "translation_status": "reviewed"
- "id": "ill-39-000"
  "section_id": "ill-39"
  "kind": "heading"
  "origin": "source"
  "source_text": "Mouvement"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mouvement&oldid=13607601"
    "source_sequence": 251
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Mouvement"
  "translation_ja": "運動"
  "translation_status": "reviewed"
- "id": "ill-39-001"
  "section_id": "ill-39"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Le mouvement de lacet sur la berge des chutes du fleuve,
    Le gouffre à l’étambot,
    La célérité de la rampe,
    L’énorme passade du courant,
    Mènent par les lumières inouïes
    Et la nouveauté chimique
    Les voyageurs entourés des trombes du val
    Et du strom.

    Ce sont les conquérants du monde
    Cherchant la fortune chimique personnelle ;
    Le sport et le comfort voyagent avec eux ;
    Ils emmènent l’éducation
    Des races, des classes et des bêtes, sur ce Vaisseau.
    Repos et vertige
    À la lumière diluvienne,
    Aux terribles soirs d’étude.
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mouvement&oldid=13607601"
    "source_sequence": 252
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div[1]"
  "translation_ja": |-
    大河の滝の岸辺を縫う動き、
    船尾の深淵、
    斜面の速さ、
    流れの巨大なうねりが、
    聞いたこともない光と
    化学の新しさを通って、
    旅人たちを導いてゆく。谷の竜巻と
    大渦に取り巻かれた旅人たちを。

    彼らは世界の征服者、
    自分だけの化学の富を求める者。
    スポーツと快適さが、ともに旅する。
    彼らは、この船に積んでゆく、
    人種、階級、獣たちの教育を。
    休息とめまい、
    洪水の光のなか、
    恐るべき研究の夕べに。
  "translation_status": "reviewed"
- "id": "ill-39-002"
  "section_id": "ill-39"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Car de la causerie parmi les appareils, — le sang ; les fleurs, le feu, les bijoux —
    Des comptes agités à ce bord fuyard,
    — On voit, roulant comme une digue au delà de la route hydraulique motrice,
    Monstrueux, s’éclairant sans fin, — leur stock d’études ;
    Eux chassés dans l’extase harmonique
    Et l’héroïsme de la découverte.

    Aux accidents atmosphériques les plus surprenants
    Un couple de jeunesse s’isole sur l’arche,
    — Est-ce ancienne sauvagerie qu’on pardonne ?
    Et chante et se poste.
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Mouvement&oldid=13607601"
    "source_sequence": 253
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div[2]"
  "translation_ja": |-
    なぜなら装置のあいだの会話から――血、花、火、宝石――
    この逃げゆく船上で取り交わされる計算から、
    ――堤防のように転がり、動力となる水の道の向こうに、見えるのだ、
    怪物じみて、果てしなく明るくなる――彼らの研究の蓄積が。
    彼ら自身は追い立てられる、和声の恍惚と
    発見の英雄的な熱情のなかへ。

    最も驚くべき大気の異変に面して、
    若い二人連れが船上で離れて身を寄せる、
    ――許されるのは、昔の野蛮さなのか？――
    そして歌い、持ち場につく。
  "translation_status": "reviewed"

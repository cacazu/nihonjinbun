    "source_sequence": 81
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "きみの指が太鼓をひとつ叩くと、あらゆる音が解き放たれ、新しい調和が始まる。"
  "translation_status": "reviewed"
- "id": "ill-10-002"
  "section_id": "ill-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un pas de toi c’est la levée des nouveaux hommes et leur en marche."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/%C3%80_une_raison&oldid=13607668"
    "source_sequence": 82
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "きみの一歩は、新しい人間たちの蜂起であり、その行進だ。"
  "translation_status": "reviewed"
- "id": "ill-10-003"
  "section_id": "ill-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ta tête se détourne : le nouvel amour ! Ta tête se retourne, — le nouvel amour !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/%C3%80_une_raison&oldid=13607668"
    "source_sequence": 83
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "きみが顔をそむける――新しい愛！　きみが振り向く――新しい愛！"
  "translation_status": "reviewed"
- "id": "ill-10-004"
  "section_id": "ill-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Change nos lots, crible les fléaux, à commencer par le temps », te chantent ces enfants. « Élève n’importe où la substance de nos fortunes et de nos vœux » on t’en prie."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/%C3%80_une_raison&oldid=13607668"
    "source_sequence": 84
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "「ぼくらの運命を変えて、災厄をふるい落として、まず時間から」と、この子どもたちはきみに歌う。「どこにでも、ぼくらの幸運と願いの実体を高く掲げて」と、人はきみに願う。"
  "translation_status": "reviewed"
- "id": "ill-10-005"
  "section_id": "ill-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Arrivée de toujours, qui t’en iras partout."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/%C3%80_une_raison&oldid=13607668"
    "source_sequence": 85
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "いつの時からも来ていて、どこへでも去ってゆくきみ。"
  "translation_status": "reviewed"
- "id": "ill-11-000"
  "section_id": "ill-11"
  "kind": "heading"
  "origin": "source"
  "source_text": "Matinée d’ivresse"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Matin%C3%A9e_d%E2%80%99ivresse&oldid=13607667"
    "source_sequence": 86
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Matinée_d’ivresse"
  "translation_ja": "陶酔の朝"
  "translation_status": "reviewed"
- "id": "ill-11-001"
  "section_id": "ill-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô mon Bien ! Ô mon Beau ! Fanfare atroce où je ne trébuche point ! Chevalet féerique ! Hourra pour l’œuvre inouïe et pour le corps merveilleux, pour la première fois ! Cela commença sous les rires des enfants, cela finira par eux. Ce poison va rester dans toutes nos veines même quand, la fanfare tournant, nous serons rendus à l’ancienne inharmonie. Ô maintenant nous si digne de ces tortures ! rassemblons fervemment cette promesse surhumaine faite à notre corps et à notre âme créés : cette promesse, cette démence ! L’élégance, la science, la violence ! On nous a promis d’enterrer dans l’ombre l’arbre du bien et du mal, de déporter les honnêtetés tyranniques, afin que nous amenions notre très pur amour. Cela commença par quelques dégoûts et cela finit, — ne pouvant nous saisir sur-le-champ de cette éternité, — cela finit par une débandade de parfums."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Matin%C3%A9e_d%E2%80%99ivresse&oldid=13607667"
    "source_sequence": 87
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ああ、ぼくの善よ！　ぼくの美よ！　凄まじいファンファーレ、そのなかでぼくはつまずかない！　妖精の拷問台！　かつてない作品に万歳、驚異のからだに万歳、初めての万歳！　それは子どもたちの笑いのなかで始まった。その笑いで終わるだろう。この毒は、ぼくらの静脈の隅々に残るだろう。ファンファーレが向きを変え、ぼくらが昔の不調和に戻されてしまっても。ああ、今のぼくらは、なんとこの拷問にふさわしいことか！　創られたぼくらのからだと魂に与えられた、この人間を超える約束を、熱烈にかき集めよう。この約束、この狂気を！　優美、知、暴力を！　善悪の木を闇に埋め、圧政を敷く道徳を追放してやると、ぼくらは約束された。ぼくらのこのうえなく純粋な愛を、連れてこられるようにと。それはいくつかの嫌悪から始まり、そして終わる――この永遠をその場でつかめないまま――香りが四散して終わるのだ。"
  "translation_status": "reviewed"
- "id": "ill-11-002"
  "section_id": "ill-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rire des enfants, discrétion des esclaves, austérité des vierges, horreur des figures et des objets d’ici, sacrés soyez-vous par le souvenir de cette veille. Cela commençait par toute la rustrerie, voici que cela finit par des anges de flamme et de glace."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Matin%C3%A9e_d%E2%80%99ivresse&oldid=13607667"
    "source_sequence": 88
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "子どもたちの笑い、奴隷たちの慎み、処女たちの厳しさ、この地の顔や物の醜悪さよ、この眠らぬ夜の記憶によって聖なるものとなれ。それはあらゆる粗野から始まった。今や、炎と氷の天使で終わろうとしている。"
  "translation_status": "reviewed"
- "id": "ill-11-003"
  "section_id": "ill-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Petite veille d’ivresse, sainte ! quand ce ne serait que pour le masque dont tu nous as gratifié. Nous t’affirmons, méthode ! Nous n’oublions pas que tu as glorifié hier chacun de nos âges. Nous avons foi au poison. Nous savons donner notre vie tout entière tous les jours."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Matin%C3%A9e_d%E2%80%99ivresse&oldid=13607667"
    "source_sequence": 89
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "酔いのなかで目覚めている短い夜よ、聖なる夜よ！　ぼくらに授けてくれた仮面だけを取ってみても。方法よ、ぼくらはきみを肯定する！　昨日きみが、ぼくらの生きたどの時期をも栄光に包んでくれたことを忘れない。ぼくらは毒を信じる。毎日、自分の命をまるごと捧げるすべを知っている。"
  "translation_status": "reviewed"
- "id": "ill-11-004"
  "section_id": "ill-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Voici le temps des Assassins."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Matin%C3%A9e_d%E2%80%99ivresse&oldid=13607667"
    "source_sequence": 90
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "今こそ、暗殺者たちの時代だ。"
  "translation_status": "reviewed"
- "id": "ill-12-000"
  "section_id": "ill-12"
  "kind": "heading"
  "origin": "source"
  "source_text": "Phrases"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 91
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Phrases"
  "translation_ja": "断章"
  "translation_status": "reviewed"
- "id": "ill-12-001"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand le monde sera réduit en un seul bois noir pour nos quatre yeux étonnés, — en une plage pour deux enfants fidèles, — en une maison musicale pour notre claire sympathie, — je vous trouverai."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 92
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "世界が、驚くぼくらの四つの目のための、ただ一つの黒い森に――忠実な二人の子どものための、一つの浜辺に――ぼくらの澄んだ共感のための、音楽に満ちた一軒の家に、縮まる時――ぼくはあなたを見つけるだろう。"
  "translation_status": "reviewed"
- "id": "ill-12-002"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qu’il n’y ait ici-bas qu’un vieillard seul, calme et beau, entouré d’un « luxe inouï », — et je suis à vos genoux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 93
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "この世にただ一人、穏やかで美しく、「信じられない贅沢」に囲まれた老人しかいなくなるなら――ぼくはあなたの膝もとにいる。"
  "translation_status": "reviewed"
- "id": "ill-12-003"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Que j’aie réalisé tous vos souvenirs, — que je sois celle qui sait vous garrotter, — je vous étoufferai."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 94
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "あなたの思い出をすべて実現できたなら――あなたを縛るすべを知っている女がわたしなら――わたしはあなたの息を止める。"
  "translation_status": "reviewed"
- "id": "ill-12-sep-003"
  "section_id": "ill-12"
  "kind": "separator"
  "origin": "source"
  "source_text": "★ ★ ★"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 95
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]"
  "translation_ja": "＊　＊　＊"
  "translation_status": "reviewed"
- "id": "ill-12-004"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand nous sommes très forts, — qui recule ? très gais, — qui tombe de ridicule ? Quand nous sommes très méchants, — que ferait-on de nous ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 96
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "ぼくらがとても強い時――退くのは誰だ？　とても陽気な時――笑いものになって倒れるのは誰だ？　ぼくらがとても悪い時――人はぼくらをどうしようというのだ？"
  "translation_status": "reviewed"
- "id": "ill-12-005"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Parez-vous, dansez, riez. — Je ne pourrai jamais envoyer l’Amour par la fenêtre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 97
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "着飾って、踊って、笑ってくれ。――ぼくは愛を窓から投げ捨てるなんて、決してできない。"
  "translation_status": "reviewed"
- "id": "ill-12-sep-005"
  "section_id": "ill-12"
  "kind": "separator"
  "origin": "source"
  "source_text": "★ ★ ★"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 98
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[3]"
  "translation_ja": "＊　＊　＊"
  "translation_status": "reviewed"
- "id": "ill-12-006"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Ma camarade, mendiante, enfant monstre ! comme ça t’est égal, ces malheureuses et ces manœuvres, et mes embarras. Attache-toi à nous avec ta voix impossible, ta voix ! unique flatteur de ce vil désespoir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 99
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "――ぼくの女友だち、物乞い、怪物の子ども！　きみにはどうでもいいんだね、あの不幸な女たちも、あのたくらみも、ぼくの困りごとも。そのありえない声でぼくらに結びついてくれ、きみの声で！　この卑しい絶望を慰めてくれるのは、それだけなのだ。"
  "translation_status": "reviewed"
- "id": "ill-12-007"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une matinée couverte, en Juillet. Un goût de cendres vole dans l’air ; — une odeur de bois suant dans l’âtre, — les fleurs rouies — le saccage des promenades — la bruine des canaux par les champs — pourquoi pas déjà les joujoux et l’encens ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 100
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "七月の曇った朝。灰の味が空気を飛ぶ――炉で汗をかく木の匂い――水に漬けて腐らせた花々――荒らされた遊歩道――野を渡る運河の霧雨――もう玩具と香があってもいいのでは？"
  "translation_status": "reviewed"
- "id": "ill-12-sep-007"
  "section_id": "ill-12"
  "kind": "separator"
  "origin": "source"
  "source_text": "★ ★ ★"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 101
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[4]"
  "translation_ja": "＊　＊　＊"
  "translation_status": "reviewed"
- "id": "ill-12-008"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J’ai tendu des cordes de clocher à clocher ; des guirlandes de fenêtre à fenêtre ; des chaînes d’or d’étoile à étoile, et je danse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 102
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "鐘楼から鐘楼へ綱を張った。窓から窓へ花綱を、星から星へ金の鎖を張った。そしてぼくは踊る。"
  "translation_status": "reviewed"
- "id": "ill-12-sep-008"
  "section_id": "ill-12"
  "kind": "separator"
  "origin": "source"
  "source_text": "★ ★ ★"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 103
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[5]"
  "translation_ja": "＊　＊　＊"
  "translation_status": "reviewed"
- "id": "ill-12-009"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le haut étang fume continuellement. Quelle sorcière va se dresser sur le couchant blanc ? Quelles violettes frondaisons vont descendre ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 104
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "高みにある池は、絶えず湯気を立てている。白い夕暮れを背に、どんな魔女が立ち上がるのか？　どんな紫の葉群れが降りてくるのか？"
  "translation_status": "reviewed"

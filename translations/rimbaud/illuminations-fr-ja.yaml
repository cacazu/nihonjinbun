    "source_sequence": 117
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Ville"
  "translation_ja": "街"
  "translation_status": "reviewed"
- "id": "ill-15-001"
  "section_id": "ill-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je suis un éphémère et point trop mécontent citoyen d’une métropole crue moderne parce que tout goût connu a été éludé dans les ameublements et l’extérieur des maisons aussi bien que dans le plan de la ville. Ici vous ne signaleriez les traces d’aucun monument de superstition. La morale et la langue sont réduites à leur plus simple expression, enfin ! Ces millions de gens qui n’ont pas besoin de se connaître amènent si pareillement l’éducation, le métier et la vieillesse, que ce cours de vie doit être plusieurs fois moins long que ce qu’une statistique folle trouve pour les peuples du continent. Aussi comme, de ma fenêtre, je vois des spectres nouveaux roulant à travers l’épaisse et éternelle fumée de charbon, — notre ombre des bois, notre nuit d’été ! — des Érinnyes nouvelles, devant mon cottage qui est ma patrie et tout mon cœur puisque tout ici ressemble à ceci, — la Mort sans pleurs, notre active fille et servante, un Amour désespéré, et un joli Crime piaulant dans la boue de la rue."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Ville&oldid=13607674"
    "source_sequence": 118
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ぼくは、はかない命の、さほど不満もない市民だ。この大都市が近代的とされるのは、調度も家の外観も都市計画も、知られている趣味という趣味をすべて避けているからだ。ここでは、迷信を記念する建物の痕跡など見つけられまい。道徳と言語は、ついに、これ以上ないほど単純な形に切り詰められた！　互いに知り合う必要のない、この何百万もの人間は、教育、職業、老年を、まるで同じように運んでゆく。その人生の道のりは、馬鹿げた統計が大陸の国々について算出するものの、何分の一かの長さしかないにちがいない。それに、窓からなんとよく見えることか。濃く、いつ果てるともない石炭の煙――ぼくらの森の陰、ぼくらの夏の夜！――を転がってゆく、新しい亡霊たちが。新しい復讐の女神たちが、ぼくの小さな家の前を行く。ここでは何もかもこんなふうだから、この家こそぼくの祖国であり、こころのすべてなのだ。その前を、涙のない死、ぼくらの働き者の娘で下女である死が、絶望した愛が、そして道の泥のなかで甲高く鳴く、かわいい犯罪が行く。"
  "translation_status": "reviewed"
- "id": "ill-16-000"
  "section_id": "ill-16"
  "kind": "heading"
  "origin": "source"
  "source_text": "Ornières"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Orni%C3%A8res&oldid=13607675"
    "source_sequence": 119
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Ornières"
  "translation_ja": "轍"
  "translation_status": "reviewed"
- "id": "ill-16-001"
  "section_id": "ill-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À droite l’aube d’été éveille les feuilles et les vapeurs et les bruits de ce coin du parc, et les talus de gauche tiennent dans leur ombre violette les mille rapides ornières de la route humide. Défilé de féeries. En effet : des chars chargés d’animaux de bois doré, de mâts et de toiles bariolées, au grand galop de vingt chevaux de cirque tachetés, et les enfants et les hommes sur leurs bêtes les plus étonnantes ; — vingt véhicules, bossés, pavoisés et fleuris comme des carrosses anciens ou de contes, pleins d’enfants attifés pour une pastorale suburbaine. — Même des cercueils sous leur dais de nuit dressant les panaches d’ébène, filant au trot des grandes juments bleues et noires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Orni%C3%A8res&oldid=13607675"
    "source_sequence": 120
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "右では、夏の夜明けが、公園のこの一隅の葉と靄と物音を目覚めさせる。左の土手は、その紫の陰に、湿った道の千もの素早い轍を抱いている。幻の行列。そう、金箔を貼った木の動物、マスト、色とりどりの布を満載した山車を、まだらのサーカス馬二十頭が全速力で引いてゆく。子どもも男も、とびきり不思議な獣に乗っている。――二十台の車。昔の、あるいはおとぎ話の馬車のように、ふくらんだ飾りがあり、旗と花に彩られ、郊外の牧歌劇のために着飾った子どもたちでいっぱいだ。――棺まである。夜の天蓋の下に黒檀の羽飾りを立て、大きな青い牝馬と黒い牝馬の速歩に乗って、走り去ってゆく。"
  "translation_status": "reviewed"
- "id": "ill-17-000"
  "section_id": "ill-17"
  "kind": "heading"
  "origin": "source"
  "source_text": "Villes"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_Ce_sont_des_villes_!_%C2%BB&oldid=13607676"
    "source_sequence": 121
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Villes"
  "translation_ja": "都市"
  "translation_status": "reviewed"
- "id": "ill-17-001"
  "section_id": "ill-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce sont des villes ! C’est un peuple pour qui se sont montés ces Alleghanys et ces Libans de rêve ! Des chalets de cristal et de bois qui se meuvent sur des rails et des poulies invisibles. Les vieux cratères ceints de colosses et de palmiers de cuivre rugissent mélodieusement dans les feux. Des fêtes amoureuses sonnent sur les canaux pendus derrière les chalets. La chasse des carillons crie dans les gorges. Des corporations de chanteurs géants accourent dans des vêtements et des oriflammes éclatants comme la lumière des cimes. Sur les plates-formes au milieu des gouffres les Rolands sonnent leur bravoure. Sur les passerelles de l’abîme et les toits des auberges l’ardeur du ciel pavoise les mâts. L’écroulement des apothéoses rejoint les champs des hauteurs où les centauresses séraphiques évoluent parmi les avalanches. Au-dessus du niveau des plus hautes crêtes, une mer troublée par la naissance éternelle de Vénus, chargée de flottes orphéoniques et de la rumeur des perles et des conques précieuses, — la mer s’assombrit parfois avec des éclats mortels. Sur les versants des moissons de fleurs grandes comme nos armes et nos coupes, mugissent. Des cortèges de Mabs en robes rousses, opalines, montent des ravines. Là-haut, les pieds dans la cascade et les ronces, les cerfs tettent Diane. Les Bacchantes des banlieues sanglotent et la lune brûle et hurle. Vénus entre dans les cavernes des forgerons et des ermites. Des groupes de beffrois chantent les idées des peuples. Des châteaux bâtis en os sort la musique inconnue. Toutes les légendes évoluent et les élans se ruent dans les bourgs, Le paradis des orages s’effondre. Les sauvages dansent sans cesse la fête de la nuit. Et une heure je suis descendu dans le mouvement d’un boulevard de Bagdad où des compagnies ont chanté la joie du travail nouveau, sous une brise épaisse, circulant sans pouvoir éluder les fabuleux fantômes des monts où l’on a dû se retrouver."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_Ce_sont_des_villes_!_%C2%BB&oldid=13607676"
    "source_sequence": 122
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "都市なのだ！　この夢のアレゲーニー山脈、このレバノン山脈がそびえ立ったのは、ある民のためなのだ！　水晶と木の山荘が、見えないレールと滑車に乗って動く。巨像と銅の棕櫚に囲まれた古い噴火口は、炎のなかで調べ高く吠える。山荘の背後に吊られた運河で、愛の祭りが鳴り響く。組み鐘の狩りが峡谷に叫ぶ。山頂の光のように輝く衣装と旗をまとい、巨人の歌い手の組合が駆けつける。深淵のただなかの台地では、幾人ものローランが勇気を角笛に吹き鳴らす。奈落の歩道橋や宿の屋根では、空の情熱がマストを旗で飾る。神格化の光景が崩れ落ちて高地の野に届き、そこでは熾天使のような女ケンタウロスたちが雪崩のあいだを動きまわる。最も高い稜線よりさらに上、ヴィーナスの永遠の誕生にかき乱された海がある。合唱団の船隊と、真珠や貴い貝のざわめきを載せたその海は、時に死をもたらす閃光を放って暗くなる。斜面では、ぼくらの武器や杯ほどもある花の実りが、うなりを上げる。赤茶色や乳白色の衣のマブの女王たちが、列をなして谷底からのぼってくる。あの高みでは、滝とイバラに脚を浸して、鹿たちがディアナの乳を吸う。郊外のバッカスの巫女たちがすすり泣き、月は燃えて吠える。ヴィーナスは鍛冶屋と隠者の洞窟に入る。鐘楼の群れが、諸民族の思想を歌う。骨でできた城から、未知の音楽が流れ出す。あらゆる伝説が動きまわり、ヘラジカたちが町へなだれ込む。嵐の楽園が崩れる。野生の人々は、夜の祭りを絶え間なく踊る。そしてある時、ぼくはバグダッドの大通りの流れに降りていった。そこで集団が、新しい労働の喜びを歌っていた。濃い風のなかを歩きながら、きっと互いに出会ったはずの山々の、あの途方もない幻から逃れることもできずに。"
  "translation_status": "reviewed"
- "id": "ill-17-002"
  "section_id": "ill-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quels bons bras, quelle belle heure me rendront cette région d’où viennent mes sommeils et mes moindres mouvements ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_Ce_sont_des_villes_!_%C2%BB&oldid=13607676"
    "source_sequence": 123
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "どんな頼もしい腕が、どんな美しい時が、ぼくをあの国へ連れ戻してくれるのだろう。ぼくの眠りも、ごく小さな動きも、そこからやってくるあの国へ？"
  "translation_status": "reviewed"
- "id": "ill-18-000"

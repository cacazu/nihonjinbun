- "id": "ill-02-001"
  "section_id": "ill-02-sub-001"
  "kind": "heading"
  "origin": "source"
  "source_text": "I"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 16
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[1]"
    "anchor": "I"
  "translation_ja": "I"
  "translation_status": "reviewed"
- "id": "ill-02-002"
  "section_id": "ill-02-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cette idole, yeux noirs et crin jaune, sans parents ni cour, plus noble que la fable, mexicaine et flamande ; son domaine, azur et verdure insolents, court sur des plages nommées, par des vagues sans vaisseaux, de noms férocement grecs, slaves, celtiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 17
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "黒い目、黄色い獣毛の髪の、この偶像。親も宮廷もなく、神話よりも気高い、メキシコの、フランドルの偶像。その領土は、傲慢な青空と緑。岸辺を伝って広がってゆく。船一隻浮かばない波がその岸辺につけたのは、激しくギリシア風の、スラヴ風の、ケルト風の名。"
  "translation_status": "reviewed"
- "id": "ill-02-003"
  "section_id": "ill-02-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À la lisière de la forêt — les fleurs de rêve tintent, éclatent, éclairent, — la fille à lèvre d’orange, les genoux croisés dans le clair déluge qui sourd des prés, nudité qu’ombrent, traversent et habillent les arcs-en-ciel, la flore, la mer."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 18
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "森のへりに――夢の花々が鳴り、はじけ、光を放つ――オレンジ色の唇をした少女がいる。草原から湧き出す明るい洪水のなかで膝を交差させている。その裸身を虹が、草花が、海が、陰にし、横切り、着飾らせる。"
  "translation_status": "reviewed"
- "id": "ill-02-004"
  "section_id": "ill-02-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dames qui tournoient sur les terrasses voisines de la mer ; enfantes et géantes, superbes noires dans la mousse vert-de-gris, bijoux debout sur le sol gras des bosquets et des jardinets dégelés, — jeunes mères et grandes sœurs aux regards pleins de pèlerinages, sultanes, princesses de démarche et de costume tyranniques, petites étrangères et personnes doucement malheureuses."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 19
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "海に近いテラスをめぐる貴婦人たち。少女たちと女巨人たち、緑青色の苔のなかの見事な黒い女たち。雪の解けた木立や小庭の肥えた土に、すっくと立つ宝石たち――巡礼の旅に満ちた目の若い母親たちと年上の姉たち、女のスルタンたち、歩き方も衣装も専制君主めいた王女たち、小さな異国の娘たちと、もの静かに不幸な人々。"
  "translation_status": "reviewed"
- "id": "ill-02-005"
  "section_id": "ill-02-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quel ennui, l’heure du « cher corps » et « cher cœur »."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 20
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "「いとしいからだ」「いとしいこころ」の時間の、なんという退屈。"
  "translation_status": "reviewed"
- "id": "ill-02-006"
  "section_id": "ill-02-sub-006"
  "kind": "heading"
  "origin": "source"
  "source_text": "II"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 21
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[2]"
    "anchor": "II"
  "translation_ja": "II"
  "translation_status": "reviewed"
- "id": "ill-02-007"
  "section_id": "ill-02-sub-006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C’est elle, la petite morte, derrière les rosiers. — La jeune maman trépassée descend le perron. — La calèche du cousin crie sur le sable. — Le petit frère (il est aux Indes !) là, devant le couchant, sur le pré d’œillets. — Les vieux qu’on a enterrés tout droits dans le rempart aux giroflées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 22
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "あの子だ、死んだ小さな女の子が、バラの茂みの向こうにいる。――亡くなった若い母さんが玄関の階段を降りてくる。――いとこの幌馬車が砂の上できしむ。――弟は（インドにいるはずなのに！）あそこ、夕日を前に、ナデシコの草原にいる。――アラセイトウの咲く城壁に、立ったまま埋められた老人たち。"
  "translation_status": "reviewed"
- "id": "ill-02-008"
  "section_id": "ill-02-sub-006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’essaim des feuilles d’or entoure la maison du général. Ils sont dans le midi. — On suit la route rouge pour arriver à l’auberge vide. Le château est à vendre ; les persiennes sont détachées. — Le curé aura emporté la clef de l’église. — Autour du parc, les loges des gardes sont inhabitées. Les palissades sont si hautes qu’on ne voit que les cimes bruissantes. D’ailleurs il n’y a rien à voir là-dedans."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 23
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "金色の葉の群れが将軍の家を取り巻く。あの人たちは南にいる。――赤い道をたどってゆくと、空っぽの宿に着く。城は売りに出ている。よろい戸は外されている。――教区司祭が教会の鍵を持っていったのだろう。――庭園のまわりの番人小屋には誰もいない。板塀があまりに高く、ざわめく梢しか見えない。それに、中には見るほどのものもない。"
  "translation_status": "reviewed"
- "id": "ill-02-009"
  "section_id": "ill-02-sub-006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les prés remontent aux hameaux sans coqs, sans enclumes. L’écluse est levée. Ô les Calvaires et les moulins du désert, les îles et les meules !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 24
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "牧草地は、雄鶏も金床もない集落までのぼってゆく。水門は上がっている。ああ、人のいない土地の十字架と水車小屋、島々と干し草の山！"
  "translation_status": "reviewed"
- "id": "ill-02-010"
  "section_id": "ill-02-sub-006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des fleurs magiques bourdonnaient. Les talus le berçaient. Des bêtes d’une élégance fabuleuse circulaient. Les nuées s’amassaient sur la haute mer faite d’une éternité de chaudes larmes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 25
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "魔法の花々が羽音を立てていた。土手が彼を揺りかごのように揺すっていた。信じがたいほど優美な獣たちが歩きまわっていた。永遠に流れる温かな涙でできた沖の海に、雲が集まっていた。"
  "translation_status": "reviewed"
- "id": "ill-02-011"
  "section_id": "ill-02-sub-011"
  "kind": "heading"
  "origin": "source"
  "source_text": "III"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 26
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[3]"
    "anchor": "III"
  "translation_ja": "III"
  "translation_status": "reviewed"
- "id": "ill-02-012"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au bois il y a un oiseau, son chant vous arrête et vous fait rougir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 27
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "森には一羽の鳥がいる。その歌はきみを立ち止まらせ、赤くさせる。"
  "translation_status": "reviewed"
- "id": "ill-02-013"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a une horloge qui ne sonne pas."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 28
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[14]"
  "translation_ja": "時を打たない時計がある。"
  "translation_status": "reviewed"
- "id": "ill-02-014"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a une fondrière avec un nid de bêtes blanches."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 29
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[15]"
  "translation_ja": "白い獣たちの巣のある泥の穴がある。"
  "translation_status": "reviewed"
- "id": "ill-02-015"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a une cathédrale qui descend et un lac qui monte."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 30
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[16]"
  "translation_ja": "降りてゆく大聖堂と、のぼってゆく湖がある。"
  "translation_status": "reviewed"
- "id": "ill-02-016"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a une petite voiture abandonnée dans le taillis, ou qui descend le sentier en courant, enrubannée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 31
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[17]"
  "translation_ja": "茂みに置き去りにされた小さな車がある。それとも、リボンに飾られて、小道を駆け下りてゆく車が。"
  "translation_status": "reviewed"
- "id": "ill-02-017"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a une troupe de petits comédiens en costumes, aperçus sur la route à travers la lisière du bois."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 32
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[18]"
  "translation_ja": "衣装を着た小さな役者たちの一団がいる。森のへり越しに、道を行く姿が見える。"
  "translation_status": "reviewed"
- "id": "ill-02-018"
  "section_id": "ill-02-sub-011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il y a enfin, quand l’on a faim et soif, quelqu’un qui vous chasse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 33
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[19]"
  "translation_ja": "そして最後に、お腹がすいて喉が渇くと、きみを追い払う誰かがいる。"
  "translation_status": "reviewed"
- "id": "ill-02-019"
  "section_id": "ill-02-sub-019"
  "kind": "heading"
  "origin": "source"
  "source_text": "IV"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 34
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[4]"
    "anchor": "IV"
  "translation_ja": "IV"
  "translation_status": "reviewed"
- "id": "ill-02-020"
  "section_id": "ill-02-sub-019"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je suis le saint, en prière sur la terrasse, — comme les bêtes pacifiques paissent jusqu’à la mer de Palestine."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 35
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[20]"
  "translation_ja": "ぼくは、テラスで祈っている聖人だ――おとなしい獣たちが、パレスチナの海に至るまで草を食んでいる、そのさなかに。"
  "translation_status": "reviewed"
- "id": "ill-02-021"
  "section_id": "ill-02-sub-019"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je suis le savant au fauteuil sombre. Les branches et la pluie se jettent à la croisée de la bibliothèque."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 36
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[21]"
  "translation_ja": "ぼくは暗い肘掛け椅子の学者だ。木の枝と雨が、書斎の窓に打ちつける。"
  "translation_status": "reviewed"
- "id": "ill-02-022"
  "section_id": "ill-02-sub-019"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je suis le piéton de la grand’route par les bois nains ; la rumeur des écluses couvre mes pas. Je vois longtemps la mélancolique lessive d’or du couchant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 37
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[22]"
  "translation_ja": "ぼくは、背の低い森を抜けて街道を歩く旅人だ。水門のとどろきが足音をかき消す。夕暮れの、もの悲しい金色の洗濯物を、いつまでも見ている。"
  "translation_status": "reviewed"
- "id": "ill-02-023"
  "section_id": "ill-02-sub-019"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je serais bien l’enfant abandonné sur la jetée partie à la haute mer, le petit valet suivant l’allée dont le front touche le ciel."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 38
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[23]"
  "translation_ja": "沖へ伸びてゆく防波堤に捨てられた子どもでもいい。先端が空に触れる並木道をたどる、小さな下僕でもいい。"
  "translation_status": "reviewed"
- "id": "ill-02-024"
  "section_id": "ill-02-sub-019"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les sentiers sont âpres. Les monticules se couvrent de genêts. L’air est immobile. Que les oiseaux et les sources sont loin ! Ce ne peut être que la fin du monde, en avançant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 39
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[24]"
  "translation_ja": "小道は険しい。丘はエニシダに覆われる。空気は動かない。鳥も泉も、なんと遠いことだろう！　進んでゆけば、世界の終わりしかありえない。"
  "translation_status": "reviewed"
- "id": "ill-02-025"
  "section_id": "ill-02-sub-025"
  "kind": "heading"
  "origin": "source"
  "source_text": "V"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 40
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[5]"
    "anchor": "V"
  "translation_ja": "V"
  "translation_status": "reviewed"
- "id": "ill-02-026"
  "section_id": "ill-02-sub-025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qu’on me loue enfin ce tombeau, blanchi à la chaux avec les lignes du ciment en relief — très loin sous terre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 41
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[25]"
  "translation_ja": "もうそろそろ、この墓をぼくに貸してくれ。石灰で白く塗られ、セメントの目地が浮き出た墓を――地の底の、ずっと深くにある墓を。"
  "translation_status": "reviewed"
- "id": "ill-02-027"
  "section_id": "ill-02-sub-025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je m’accoude à la table, la lampe éclaire très vivement ces journaux que je suis idiot de relire, ces livres sans intérêt. —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 42
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[26]"
  "translation_ja": "テーブルに肘をつく。ランプがひどく明るく照らしている。読み返すぼくが馬鹿なのだ、こんな新聞を、こんなつまらない本を。――"
  "translation_status": "reviewed"
- "id": "ill-02-028"
  "section_id": "ill-02-sub-025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À une distance énorme au-dessus de mon salon souterrain, les maisons s’implantent, les brumes s’assemblent. La boue est rouge ou noire. Ville monstrueuse, nuit sans fin !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 43
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[27]"
  "translation_ja": "ぼくの地下の居間から、途方もなく遠い頭上に、家々が根を張り、霧が集まる。泥は赤い、あるいは黒い。怪物のような街、終わりのない夜！"
  "translation_status": "reviewed"
- "id": "ill-02-029"
  "section_id": "ill-02-sub-025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Moins haut, sont des égouts. Aux côtés, rien que l’épaisseur du globe. Peut-être les gouffres d’azur, des puits de feu. C’est peut-être sur ces plans que se rencontrent lunes et comètes, mers et fables."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 44
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[28]"
  "translation_ja": "それほど高くない所には下水道がある。両側は、ただ分厚い地球ばかり。もしかしたら、紺碧の深淵や、火の井戸もある。月と彗星、海と神話が出会うのは、そんな面の上なのかもしれない。"
  "translation_status": "reviewed"
- "id": "ill-02-030"
  "section_id": "ill-02-sub-025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aux heures d’amertume je m’imagine des boules de saphir, de métal. Je suis maître du silence. Pourquoi une apparence de soupirail blêmirait-elle au coin de la voûte ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Enfance&oldid=13607330"
    "source_sequence": 45
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[29]"
  "translation_ja": "苦い時間には、サファイアや金属の球を思い浮かべる。ぼくは沈黙の主だ。丸天井の隅に、なぜ換気窓らしきものが青白く浮かぶ必要がある？"
  "translation_status": "reviewed"
- "id": "ill-03-000"
  "section_id": "ill-03"
  "kind": "heading"
  "origin": "source"
  "source_text": "Conte"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 46
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Conte"
  "translation_ja": "物語"
  "translation_status": "reviewed"
- "id": "ill-03-001"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un Prince était vexé de ne s’être employé jamais qu’à la perfection des générosités vulgaires. Il prévoyait d’étonnantes révolutions de l’amour, et soupçonnait ses femmes de pouvoir mieux que cette complaisance agrémentée de ciel et de luxe. Il voulait voir la vérité, l’heure du désir et de la satisfaction essentiels. Que ce fût ou non une aberration de piété, il voulut. Il possédait au moins un assez large pouvoir humain."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 47
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "ある王子は、ありきたりの気前よさを極めることにしか自分を使ってこなかったのが不満だった。愛の驚くべき革命を予感し、女たちには、空と贅沢で飾られたこんな従順さより、もっとよいものがあるはずだと疑っていた。彼は真実を見たかった。欲望も充足も、その本質に達する時を。信心の迷走だったにせよ、そうでなかったにせよ、彼はそれを望んだ。少なくとも、人間としてかなり大きな権力は持っていた。"
  "translation_status": "reviewed"
- "id": "ill-03-002"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Toutes les femmes qui l’avaient connu furent assassinées. Quel saccage du jardin de la beauté ! Sous le sabre, elles le bénirent. Il n’en commanda point de nouvelles. — Les femmes réapparurent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 48
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "彼を知った女はみな殺された。美の庭は、なんという荒らされようだろう！　剣の下で女たちは彼を祝福した。彼は新しい女を取り寄せなかった。――女たちはまた現れた。"
  "translation_status": "reviewed"
- "id": "ill-03-003"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il tua tous ceux qui le suivaient, après la chasse ou les libations. — Tous le suivaient."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 49
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "狩りや酒宴のあと、彼は従う者をみな殺した。――みな、彼に従っていた。"
  "translation_status": "reviewed"
- "id": "ill-03-004"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il s’amusa à égorger les bêtes de luxe. Il fit flamber les palais. Il se ruait sur les gens et les taillait en pièces. — La foule, les toits d’or, les belles bêtes existaient encore."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 50
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "彼は道楽に飼う獣の喉をかき切って楽しんだ。宮殿を燃え上がらせた。人々に襲いかかり、ばらばらに斬った。――群衆も、金の屋根も、美しい獣たちも、まだ存在していた。"
  "translation_status": "reviewed"
- "id": "ill-03-005"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Peut-on s’extasier dans la destruction, se rajeunir par la cruauté ! Le peuple ne murmura pas. Personne n’offrit le concours de ses vues."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 51
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "破壊のなかで恍惚となり、残酷さによって若返ることなどできるのか！　民は不平を言わなかった。誰一人、自分の考えを差し出して力を貸そうとはしなかった。"
  "translation_status": "reviewed"
- "id": "ill-03-006"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un soir il galopait fièrement. Un Génie apparut, d’une beauté ineffable, inavouable même. De sa physionomie et de son maintien ressortait la promesse d’un amour multiple et complexe ! d’un bonheur indicible, insupportable même ! Le Prince et le Génie s’anéantirent probablement dans la santé essentielle. Comment n’auraient-ils pas pu en mourir ? Ensemble donc ils moururent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 52
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "ある夕べ、彼は誇らしげに馬を駆っていた。精霊が現れた。言葉にできない、口にすることさえはばかられる美しさだった。その顔と身のこなしは、多様で複雑な愛を約束していた！　語りえない、耐えることさえできない幸福を！　王子と精霊はおそらく、根源の健やかさのなかに消滅した。どうして、それで死なずにいられただろう？　だから二人は、ともに死んだのだ。"
  "translation_status": "reviewed"
- "id": "ill-03-007"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais ce Prince décéda, dans son palais, à un âge ordinaire. Le Prince était le Génie. Le Génie était le Prince."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 53
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "だがこの王子は、自分の宮殿で、ごく普通の年齢に達して世を去った。王子は精霊だった。精霊は王子だった。"
  "translation_status": "reviewed"
- "id": "ill-03-008"
  "section_id": "ill-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La musique savante manque à notre désir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Conte&oldid=13591933"
    "source_sequence": 54
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "ぼくらの欲望には、精妙な音楽が欠けている。"
  "translation_status": "reviewed"
- "id": "ill-04-000"
  "section_id": "ill-04"
  "kind": "heading"
  "origin": "source"
  "source_text": "Parade"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Parade&oldid=13607349"
    "source_sequence": 55
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Parade"
  "translation_ja": "見世物"
  "translation_status": "reviewed"
- "id": "ill-04-001"
  "section_id": "ill-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des drôles très solides. Plusieurs ont exploité vos mondes. Sans besoins, et peu pressés de mettre en œuvre leurs brillantes facultés et leur expérience de vos consciences. Quels hommes mûrs ! Des yeux hébétés à la façon de la nuit d’été, rouges et noirs, tricolores, d’acier piqué d’étoiles d’or ; des faciès déformés, plombés, blêmis, incendiés ; des enrouements folâtres ! La démarche cruelle des oripeaux ! — Il y a quelques jeunes, — comment regarderaient-ils Chérubin ? — pourvus de voix effrayantes et de quelques ressources dangereuses. On les envoie prendre du dos en ville, affublés d’un luxe dégoûtant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Parade&oldid=13607349"
    "source_sequence": 56
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "たいそうしたたかな連中だ。何人もが、きみたちの世界を食い物にしてきた。何一つ欲しがらず、自分たちの輝かしい能力も、きみたちの意識を扱う経験も、使おうと急ぎはしない。なんと老練な男たち！　夏の夜のように茫然とした目、赤や黒、三色の目、金の星をちりばめた鋼の目。歪み、鉛色になり、青ざめ、燃え上がる顔。ふざけたしわがれ声！　ぼろ飾りの残酷な足取り！――若いのもいくらかいる――あいつらならケルビーノをどんな目で見るだろう？――恐ろしい声と、いくつかの危険な手管を備えた若者たちだ。胸の悪くなる贅沢を着せられ、街でひとまわり大きくなれと送り出される。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「ひとまわり大きくなれ」の原文はprendre du dos。直訳では「背をつける」となる、意味の定まらない表現である。本訳では成長を促すような言い方を採ったが、身体や振る舞いの何を指すかは断定しない。"
- "id": "ill-04-002"
  "section_id": "ill-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô le plus violent Paradis de la grimace enragée ! Pas de comparaison avec vos Fakirs et les autres bouffonneries scéniques. Dans des costumes improvisés avec le goût du mauvais rêve ils jouent des complaintes, des tragédies de malandrins et de demi-dieux spirituels comme l’histoire ou les religions ne l’ont jamais été. Chinois, Hottentots, bohémiens, niais, hyènes, Molochs, vieilles démences, démons sinistres, ils mêlent les tours populaires, maternels, avec les poses et les tendresses bestiales. Ils interpréteraient des pièces nouvelles et des chansons « bonnes filles ». Maîtres jongleurs, ils transforment le lieu et les personnes et usent de la comédie magnétique. Les yeux flambent, le sang chante, les os s’élargissent, les larmes et des filets rouges ruissellent. Leur raillerie ou leur terreur dure une minute, ou des mois entiers."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Parade&oldid=13607349"
    "source_sequence": 57
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "ああ、狂いきったしかめ面の、最も激烈な楽園！　きみたちの行者や、そのほかの舞台の道化芝居とは比べようもない。悪夢の趣味でこしらえた間に合わせの衣装を着て、連中は哀歌を演じ、ならず者や半神たちの悲劇を演じる。その機知には、歴史も宗教も一度として及んだことがない。中国人、ホッテントット、ボヘミアン、間抜け、ハイエナ、モロク、年経た狂気、不吉な悪魔となり、庶民の、母親めいた芸に、獣の姿態や愛撫を混ぜ合わせる。新しい芝居も、気のいい女たちの歌も、演じてみせるだろう。手練れの曲芸師である連中は、場所と人を変貌させ、催眠の芝居を使う。目は燃え、血は歌い、骨は広がり、涙と細い赤い流れがほとばしる。その嘲りや恐怖は、一分間続くことも、何か月も続くこともある。"
  "translation_status": "reviewed"
- "id": "ill-04-003"
  "section_id": "ill-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J’ai seul la clef de cette parade sauvage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Parade&oldid=13607349"
    "source_sequence": 58
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "この野蛮な見世物の鍵は、ぼくだけが持っている。"
  "translation_status": "reviewed"
- "id": "ill-05-000"
  "section_id": "ill-05"
  "kind": "heading"
  "origin": "source"
  "source_text": "Antique"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Antique&oldid=13607352"
    "source_sequence": 59
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Antique"
  "translation_ja": "古代"
  "translation_status": "reviewed"
- "id": "ill-05-001"
  "section_id": "ill-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Gracieux fils de Pan ! Autour de ton front couronné de fleurettes et de baies tes yeux, des boules précieuses, remuent. Tachées de lie brune, tes joues se creusent. Tes crocs luisent. Ta poitrine ressemble à une cithare, des tintements circulent dans tes bras blonds. Ton cœur bat dans ce ventre où dort le double sexe. Promène-toi, la nuit, en mouvant doucement cette cuisse, cette seconde cuisse et cette jambe de gauche."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"

- "id": "ill-12-011"
  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Avivant un agréable goût d’encre de Chine une poudre noire pleut doucement sur ma veillée. — Je baisse les feux du lustre, je me jette sur le lit, et tourné du côté de l’ombre je vous vois, mes filles ! mes reines !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Phrases&oldid=13607672"
    "source_sequence": 108
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[15]"
  "translation_ja": "墨の心地よい味わいを鮮やかにしながら、黒い粉が、ぼくの眠らぬ夜にそっと降る。――シャンデリアの灯を落とし、寝床に身を投げ、闇へ顔を向けると、あなたたちが見える。ぼくの娘たち！　ぼくの女王たち！"
  "translation_status": "reviewed"

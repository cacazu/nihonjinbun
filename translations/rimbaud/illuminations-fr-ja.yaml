    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "優美なパンの息子よ！　小花と木の実を戴く額のまわりで、宝玉のようなきみの目が動いている。褐色の酒の澱に染まった頬がくぼむ。きみの牙が光る。胸は竪琴に似て、金色の腕には鈴の音がめぐる。二つの性が眠るその腹のなかで、心臓が打つ。夜を歩きまわれ。この腿を、もう一方の腿を、そして左の脚を、ゆっくり動かして。"
  "translation_status": "reviewed"

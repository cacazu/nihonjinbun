  "source_text": "Ô la face cendrée, l’écusson de crin, les bras de cristal ! Le canon sur lequel je dois m’abattre à travers la mêlée des arbres et de l’air léger !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Being_beauteous&oldid=13607665"

  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9part&oldid=13607671"
    "source_sequence": 73
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "もう十分見た。どんな空気のなかでも、幻は姿を見せた。"
  "translation_status": "reviewed"
- "id": "ill-08-002"
  "section_id": "ill-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Assez eu. Rumeurs des villes, le soir, et au soleil, et toujours."

- "id": "ill-07-002"
  "section_id": "ill-07-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô les énormes avenues du pays saint, les terrasses du temple ! Qu’a-t-on fait du brahmane qui m’expliqua les Proverbes ? D’alors, de là-bas, je vois encore même les vieilles ! Je me souviens des heures d’argent et de soleil vers les fleuves, la main de la campagne sur mon épaule, et de nos caresses debout dans les plaines poivrées. — Un envol de pigeons écarlates tonne autour de ma pensée. — Exilé ici, j’ai eu une scène où jouer les chefs-d’œuvre dramatiques de toutes les littératures. Je vous indiquerais les richesses inouïes. J’observe l’histoire des trésors que vous trouvâtes. Je vois la suite ! Ma sagesse est aussi dédaignée que le chaos. Qu’est mon néant, auprès de la stupeur qui vous attend ?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vies&oldid=13607688"
    "source_sequence": 67
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[4]"
  "translation_ja": "ああ、聖なる国の途方もない並木道、寺院のテラス！　ぼくに『箴言』を説いてくれたバラモンは、どうなったのか？　あの時、あの場所から、老婆たちの姿までも、まだ見える！　川へ向かう銀と陽光の時間を、肩に置かれた田園の手を、香辛料の匂う平原で立ったまま交わしたぼくらの愛撫を、思い出す。――緋色の鳩たちが飛び立ち、ぼくの思考のまわりで雷鳴を立てる。――ここに流されて、ぼくには、あらゆる文学の傑作劇を演じる舞台があった。とても信じられない富を、きみに教えてもいい。きみたちが見つけた宝の歴史を、ぼくは見守っている。その先が見える！　ぼくの知恵は混沌と同じくらい軽んじられている。きみたちを待つ驚愕に比べたら、ぼくの虚無がなんだろう？"
  "translation_status": "reviewed"

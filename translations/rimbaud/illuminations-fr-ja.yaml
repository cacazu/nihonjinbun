  "translation_status": "reviewed"
- "id": "ill-35-001"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’ancienne Comédie poursuit ses accords et divise ses Idylles :"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 231
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "古い喜劇が和音を追い、その牧歌を割り振ってゆく。"
  "translation_status": "reviewed"
- "id": "ill-35-002"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des boulevards de tréteaux,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 232
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "仮設舞台の大通り、"
  "translation_status": "reviewed"
- "id": "ill-35-003"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un long pier en bois d’un bout à l’autre d’un champ rocailleux où la foule barbare évolue sous les arbres dépouillés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 233
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "石だらけの野の端から端へ続く長い木の桟橋。葉を落とした木々の下で、野蛮な群衆が動きまわる。"
  "translation_status": "reviewed"
- "id": "ill-35-004"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans des corridors de gaze noire, suivant le pas des promeneurs aux lanternes et aux feuilles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 234
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "黒い薄絹の廊下で、提灯と木の葉を手にした散歩客の足取りを追って。"
  "translation_status": "reviewed"
- "id": "ill-35-005"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des oiseaux des mystères s’abattent sur un ponton de maçonnerie mû par l’archipel couvert des embarcations des spectateurs."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 235
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "聖史劇の鳥たちが、石造りの浮き橋へ舞い降りる。それを動かすのは、観客の舟に覆われた群島だ。"
  "translation_status": "reviewed"
- "id": "ill-35-006"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Des scènes lyriques accompagnées de flûte et de tambour s’inclinent dans des réduits ménagés sous les plafonds, autour des salons de clubs modernes ou des salles de l’Orient ancien."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 236
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "笛と太鼓を伴う叙情の場面が、現代のクラブの広間や古代東洋の大広間を取り巻く、天井の下につくられた小さな空間へ傾いてゆく。"
  "translation_status": "reviewed"
- "id": "ill-35-007"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La féerie manœuvre au sommet d’un amphithéâtre couronné par les taillis, — On s’agite et module pour les Béotiens, dans l’ombre des futaies mouvantes sur l’arête des cultures."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 237
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "木立を冠した円形劇場の頂で、妖精劇が展開する――人々が騒ぎ、抑揚をつけて歌う、鈍感な観客のために。耕地の縁、揺れ動く高木林の陰のなかで。"
  "translation_status": "reviewed"
- "id": "ill-35-008"
  "section_id": "ill-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’opéra-comique se divise sur notre scène à l’arête d’intersection de dix cloisons dressées de la galerie aux feux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Sc%C3%A8nes&oldid=13607566"
    "source_sequence": 238
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "ぼくらの舞台では、オペラ・コミックが枝分かれする。桟敷から脚光まで立てられた十枚の仕切り、その交わる稜線で。"
  "translation_status": "reviewed"
- "id": "ill-36-000"
  "section_id": "ill-36"
  "kind": "heading"
  "origin": "source"
  "source_text": "Soir historique"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 239
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Soir_historique"
  "translation_ja": "歴史の夕べ"
  "translation_status": "reviewed"
- "id": "ill-36-001"
  "section_id": "ill-36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En quelque soir, par exemple, que se trouve le touriste naïf, retiré de nos horreurs économiques, la main d’un maître anime le clavecin des prés ; on joue aux cartes au fond de l’étang, miroir évocateur des reines et des mignonnes, on a les saintes, les voiles, et les fils d’harmonie, et les chromatismes légendaires, sur le couchant."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 240
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "たとえば、無邪気な観光客が、ぼくらの経済の恐ろしさから身を引いて迎える、とある夕べ。名人の手が牧草地のチェンバロを生かす。王妃や愛妾の姿を呼び起こす鏡である、池の底では、人々がトランプをする。夕映えを背に、聖女たち、ヴェール、調和の糸、伝説の半音階がある。"
  "translation_status": "reviewed"
- "id": "ill-36-002"
  "section_id": "ill-36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il frissonne au passage des chasses et des hordes. La comédie goutte sur les tréteaux de gazon. Et l’embarras des pauvres et des faibles sur ces plans stupides !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 241
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "彼は、狩りの一団や群れの通過に震える。喜劇が芝の仮設舞台に滴る。そしてこんな馬鹿げた画面の上では、貧しい者、弱い者たちは、なんと居場所に困ることだろう！"
  "translation_status": "reviewed"
- "id": "ill-36-003"
  "section_id": "ill-36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À sa vision esclave, — l’Allemagne s’échafaude vers des lunes ; les déserts tartares s’éclairent — les révoltes anciennes grouillent dans le centre du Céleste empire, par les escaliers et les fauteuils de rois — un petit monde blême et plat, Afrique et Occidents, va s’édifier. Puis un ballet de mers et de nuits connues une chimie sans valeur, et des mélodies impossibles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 242
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "彼の隷属した眼前で――ドイツは月々に向かって積み上がり、タタールの砂漠は明るくなる――天朝の帝国の中心では、王の階段や肘掛け椅子を伝って、昔の反乱がうごめく――青白く平らな小世界、アフリカといくつもの西洋が、築かれようとしている。続いて、見知った海と夜のバレエ、値打ちのない化学、ありえない旋律。"
  "translation_status": "reviewed"
- "id": "ill-36-004"
  "section_id": "ill-36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La même magie bourgeoise à tous les points où la malle nous déposera ! Le plus élémentaire physicien sent qu’il n’est plus possible de se soumettre à cette atmosphère personnelle, brume de remords physiques, dont la constatation est déjà une affliction."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 243
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "郵便馬車がぼくらを降ろす所なら、どこでも同じブルジョワの魔法！　初歩だけを知る物理学者にさえわかる。こういう個人的な空気に身を委ねることは、もうできない。この肉体の悔恨の霧には。それを確かめるだけでも、もう苦痛なのだ。"
  "translation_status": "reviewed"
- "id": "ill-36-005"
  "section_id": "ill-36"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Non ! — Le moment de l’étuve, des mers enlevées, des embrasements souterrains, de la planète emportée, et des exterminations conséquentes, certitudes si peu malignement indiquées dans la bible et par les Nornes et qu’il sera donné à l’être sérieux de surveiller. — Cependant ce ne sera point un effet de légende !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Soir_historique&oldid=13607570"
    "source_sequence": 244
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "いや！――蒸し風呂の時、持ち上げられた海、地底の火災、吹き飛ばされる惑星、そしてそれに続く絶滅の時が来る。聖書にもノルンたちにも、さほど謎めかすことなく示されている確実な出来事であり、真剣に生きる者には、それを見守る機会が与えられるだろう。――だが、それは伝説の仕掛けなどではない！"
  "translation_status": "reviewed"
- "id": "ill-37-000"
  "section_id": "ill-37"
  "kind": "heading"
  "origin": "source"
  "source_text": "Bottom"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Bottom&oldid=13607576"

- "id": "ill-19-001"
  "section_id": "ill-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’acropole officielle outre les conceptions de la barbarie moderne les plus colossales. Impossible d’exprimer le jour mat produit par ce ciel immuablement gris, l’éclat impérial des bâtisses, et la neige éternelle du sol. On a reproduit dans un goût d’énormité singulier toutes les merveilles classiques de l’architecture. J’assiste à des expositions de peinture dans des locaux vingt fois plus vastes qu’Hampton-Court. Quelle peinture ! Un Nabuchodonosor norwégien a fait construire les escaliers des ministères ; les subalternes que j’ai pu voir sont déjà plus fiers que des ***, et j’ai tremblé à l’aspect des gardiens de colosses et officiers de constructions. Par le groupement des bâtiments en squares, cours et terrasses fermées, on a évincé les cochers. Les parcs représentent la nature primitive travaillée par un art superbe. Le haut quartier a des parties inexplicables : un bras de mer, sans bateaux, roule sa nappe de grésil bleu entre des quais chargés de candélabres géants. Un pont court conduit à une poterne immédiatement sous le dôme de la Sainte-Chapelle. Ce dôme est une armature d’acier artistique de quinze mille pieds de diamètre environ."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_L%E2%80%99acropole_officielle_%C2%BB&oldid=13607678"
    "source_sequence": 130
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "官のアクロポリスは、近代の野蛮が思い描いた、最も巨大な構想さえ上回る。変わることなく灰色の空が生む、艶のない昼の光も、建物の帝国の輝きも、地面の永遠の雪も、言い表すことができない。途方もない大きさを好む独特の趣味で、建築の古典的な驚異がことごとく再現されている。ぼくはハンプトン・コートの二十倍も広い会場で、絵の展覧会を見る。なんという絵だ！　ノルウェーのネブカドネザルが、各省庁の階段を造らせたのだ。ぼくが会えた下役たちですら、もう某々よりも尊大で、巨像の番人や建物の管理官の姿には震え上がった。建物を広場、中庭、囲われたテラスにまとめたことで、御者たちは締め出された。公園は、壮麗な技が手を加えた原始の自然を表している。高台の地区には説明できない所がある。船のない入江が、巨大な燭台の並ぶ岸壁のあいだに、青い霰の水面をうねらせる。短い橋が、サント・シャペルのドームの真下の通用門へ通じている。このドームは、直径およそ一万五千フィートの、芸術的な鋼の骨組みだ。"
  "translation_status": "reviewed"
- "id": "ill-19-002"
  "section_id": "ill-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sur quelques points des passerelles de cuivre, des plates-formes, des escaliers qui contournent les halles et les piliers, j’ai cru pouvoir juger la profondeur de la ville ! C’est le prodige dont je n’ai pu me rendre compte : quels sont les niveaux des autres quartiers sur ou sous l’acropole ? Pour l’étranger de notre temps la reconnaissance est impossible. Le quartier commerçant est un circus d’un seul style, avec galeries à arcades. On ne voit pas de boutiques, mais la neige de la chaussée est écrasée ; quelques nababs aussi rares que les promeneurs d’un matin de dimanche à Londres, se dirigent vers une diligence de diamants. Quelques divans de velours rouge : on sert des boissons polaires dont le prix varie de huit cents à huit mille roupies. À l’idée de chercher des théâtres sur ce circus, je me réponds que les boutiques doivent contenir des drames assez sombres. Je pense qu’il y a une police. Mais la loi doit être tellement étrange, que je renonce à me faire une idée des aventuriers d’ici."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_L%E2%80%99acropole_officielle_%C2%BB&oldid=13607678"
    "source_sequence": 131
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "銅の歩道橋や足場、市場の大屋根と柱をめぐる階段の、いくつかの地点から、ぼくは街の深さを測れる気がした！　だが、これこそわからなかった不思議だ。ほかの地区は、アクロポリスの上や下のどんな高さにあるのか？　ぼくらの時代のよそ者には、見きわめようがない。商業地区は一つの様式で統一された円形広場で、アーケードの回廊がめぐる。店は見えないが、車道の雪は踏み固められている。日曜の朝のロンドンの散歩客ほどにもまばらな大金持ちが数人、ダイヤモンドの駅馬車へ向かう。赤いビロードの長椅子がいくつか。八百から八千ルピーもする極地の飲み物が出る。この円形広場で劇場を探そうかと思ってみるが、店の中に十分暗いドラマがあるはずだと、自分に答える。警察はあると思う。だが法律はよほど奇妙にちがいなく、ここの冒険者たちがどんな連中か、想像するのもやめてしまう。"
  "translation_status": "reviewed"
- "id": "ill-19-003"
  "section_id": "ill-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le faubourg, aussi élégant qu’une belle rue de Paris, est favorisé d’un air de lumière. L’élément démocratique compte quelques cents âmes. Là encore les maisons ne se suivent pas ; le faubourg se perd bizarrement dans la campagne, le « Comté » qui remplit l’occident éternel des forêts et des plantations prodigieuses où les gentilshommes sauvages chassent leurs chroniques sous la lumière qu’on a créée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Villes_%C2%AB_L%E2%80%99acropole_officielle_%C2%BB&oldid=13607678"
    "source_sequence": 132
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "パリの美しい通りに劣らず優雅な郊外は、光に満ちた空気に恵まれている。庶民層は数百人ほど。そこでも家々は続いていない。郊外は奇妙に田園へ消えてゆく。「州」へ。永遠の西方を満たす、途方もない森と植林地へ。そこでは野蛮な紳士たちが、創られた光の下で、自分たちの年代記を狩っている。"
  "translation_status": "reviewed"

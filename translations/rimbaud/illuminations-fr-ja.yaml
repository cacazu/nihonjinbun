  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9part&oldid=13607671"
    "source_sequence": 74
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "もう十分手に入れた。街々のざわめき、夕暮れも、日の下も、いつも。"
  "translation_status": "reviewed"
- "id": "ill-08-003"
  "section_id": "ill-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Assez connu. Les arrêts de la vie. — Ô Rumeurs et Visions !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9part&oldid=13607671"
    "source_sequence": 75
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "もう十分知った。生の足止め。――ああ、ざわめきと幻！"
  "translation_status": "reviewed"
- "id": "ill-08-004"
  "section_id": "ill-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Départ dans l’affection et le bruit neufs !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9part&oldid=13607671"
    "source_sequence": 76
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "新しい愛情と物音のなかへ、出発！"
  "translation_status": "reviewed"

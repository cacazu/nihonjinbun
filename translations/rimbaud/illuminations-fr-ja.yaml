    "source_sequence": 124
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Vagabonds"
  "translation_ja": "放浪者たち"
  "translation_status": "reviewed"
- "id": "ill-18-001"
  "section_id": "ill-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pitoyable frère ! Que d’atroces veillées je lui dus ! « Je ne me saisissais pas fervemment de cette entreprise. Je m’étais joué de son infirmité. Par ma faute nous retournerions en exil, en esclavage. » Il me supposait un guignon et une innocence très bizarres, et il ajoutait des raisons inquiétantes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vagabonds&oldid=13177424"
    "source_sequence": 125
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "哀れな兄弟！　彼のせいで、どれほどひどい夜を眠らずに過ごしたことか！　「ぼくはこの仕事に熱心に取り組もうとしなかった。彼の弱さをもてあそんだ。ぼくのせいで、二人はまた追放され、奴隷に戻るだろう。」彼はぼくに、ひどく奇妙な不運と無邪気さを想定し、さらに不安になる理由を並べ立てた。"
  "translation_status": "reviewed"
- "id": "ill-18-002"
  "section_id": "ill-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Je répondais en ricanant à ce satanique docteur, et finissais par gagner la fenêtre. Je créais, par delà la campagne traversée par des bandes de musique rare, les fantômes du futur luxe nocturne."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vagabonds&oldid=13177424"
    "source_sequence": 126
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "ぼくはこの悪魔の博士に薄笑いで答え、しまいには窓辺へ逃れた。珍しい音楽の帯が横切る田野の彼方に、未来の夜の贅沢の、幻を創っていた。"
  "translation_status": "reviewed"
- "id": "ill-18-003"
  "section_id": "ill-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Après cette distraction vaguement hygiénique, je m’étendais sur une paillasse. Et, presque chaque nuit, aussitôt endormi, le pauvre frère se levait, la bouche pourrie, les yeux arrachés, — tel qu’il se rêvait ! — et me tirait dans la salle en hurlant son songe de chagrin idiot."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vagabonds&oldid=13177424"
    "source_sequence": 127
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "なんとなく健康によさそうな、この気晴らしのあと、ぼくは藁の寝床に横になった。そしてほとんど毎晩、哀れな兄弟は、眠りに落ちるやいなや起き上がった。口は腐り、目はえぐり取られ――夢のなかで自分に見ていた、そのままの姿で！――馬鹿げた悲しみの夢を叫び、ぼくを広間へ引っ張っていった。"
  "translation_status": "reviewed"
- "id": "ill-18-004"
  "section_id": "ill-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "J’avais en effet, en toute sincérité d’esprit, pris l’engagement de le rendre à son état primitif de fils du soleil, et nous errions, nourris du vin des cavernes et du biscuit de la route, moi pressé de trouver le lieu et la formule."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vagabonds&oldid=13177424"
    "source_sequence": 128
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "実際ぼくは、こころから誠実に、彼を本来の太陽の子の姿に戻すと約束していた。洞窟の酒と旅の乾パンを糧に、ぼくらはさまよった。ぼくは、場所とその定式を見つけようと急いでいた。"
  "translation_status": "reviewed"

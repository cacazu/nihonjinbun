  "translation_status": "reviewed"
- "id": "ill-41-001"
  "section_id": "ill-41"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Le drapeau va au paysage immonde, et notre patois étouffe le tambour."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9mocratie&oldid=13607607"
    "source_sequence": 264
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "「旗は汚らしい風景へ進み、われわれの訛りは太鼓をかき消す。"
  "translation_status": "reviewed"
- "id": "ill-41-002"
  "section_id": "ill-41"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Aux centres nous alimenterons la plus cynique prostitution. Nous massacrerons les révoltes logiques."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9mocratie&oldid=13607607"
    "source_sequence": 265
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "「中心地では、われわれは最も厚かましい売春を養うだろう。筋の通った反乱は皆殺しにする。"
  "translation_status": "reviewed"
- "id": "ill-41-003"
  "section_id": "ill-41"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Aux pays poivrés et détrempés ! — au service des plus monstrueuses exploitations industrielles ou militaires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9mocratie&oldid=13607607"
    "source_sequence": 266
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "「香辛料の匂う、ずぶ濡れの国々へ！――最も怪物じみた、産業や軍事の搾取に仕えるために。"
  "translation_status": "reviewed"
- "id": "ill-41-004"
  "section_id": "ill-41"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "« Au revoir ici, n’importe où. Conscrits du bon vouloir, nous aurons la philosophie féroce ; ignorants pour la science, roués pour le confort ; la crevaison pour le monde qui va. C’est la vraie marche. En avant, route ! »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9mocratie&oldid=13607607"
    "source_sequence": 267
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "「ここでお別れ、どこででも。自ら志願した新兵であるわれわれは、獰猛な哲学を身につけるだろう。学問には無知、快適さには抜け目なく。進みゆく世界など、くたばってしまえ。これこそ本当の行進だ。前へ、進め！」"
  "translation_status": "reviewed"
- "id": "ill-42-000"
  "section_id": "ill-42"
  "kind": "heading"
  "origin": "source"
  "source_text": "Génie"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 268
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Génie"
  "translation_ja": "精霊"
  "translation_status": "reviewed"
- "id": "ill-42-001"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est l’affection et le présent puisqu’il a fait la maison ouverte à l’hiver écumeux et à la rumeur de l’été, lui qui a purifié les boissons et les aliments, lui qui est le charme des lieux fuyants et le délice surhumain des stations. Il est l’affection et l’avenir, la force et l’amour que nous, debout dans les rages et les ennuis, nous voyons passer dans le ciel de tempête et les drapeaux d’extase."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 269
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "彼は愛情であり現在だ。泡立つ冬と、夏のざわめきに、家を開け放ったのだから。飲み物と食べ物を清めた彼。逃げ去る場所の魅惑であり、立ち止まる場所の、人間を超える歓びである彼。彼は愛情であり未来、力であり愛だ。怒りと退屈のただなかに立つぼくらが、嵐の空と恍惚の旗のなかを通り過ぎてゆくのを見る、あの力と愛。"
  "translation_status": "reviewed"
- "id": "ill-42-002"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est l’amour, mesure parfaite et réinventée, raison merveilleuse et imprévue, et l’éternité : machine aimée des qualités fatales. Nous avons tous eu l’épouvante de sa concession et de la nôtre : ô jouissance de notre santé, élan de nos facultés, affection égoïste et passion pour lui, lui qui nous aime pour sa vie infinie…"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 270
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "彼は愛、完璧で新たに創り直された尺度、驚くべき、思いがけない理性、そして永遠。宿命を帯びた資質が愛する機械だ。彼が譲り渡すものと、ぼくらが譲り渡すものに、ぼくらはみな怯えたことがある。ああ、ぼくらの健やかさの歓び、能力の躍動、彼への利己的な愛情と情熱。彼は、自分の無限の生のためにぼくらを愛している……"
  "translation_status": "reviewed"
- "id": "ill-42-003"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et nous nous le rappelons et il voyage… Et si l’Adoration s’en va, sonne, sa promesse sonne : « Arrière ces superstitions, ces anciens corps, ces ménages et ces âges. C’est cette époque-ci qui a sombré ! »"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 271
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "そしてぼくらは彼を思い出し、彼は旅をする……そして崇拝が去ってゆくなら、鳴り響け。その約束が鳴り響く。「退け、この迷信も、古いからだも、所帯も時代も。沈んだのは、この時代の方なのだ！」"
  "translation_status": "reviewed"
- "id": "ill-42-004"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il ne s’en ira pas, il ne redescendra pas d’un ciel, il n’accomplira pas la rédemption des colères de femmes et des gaîtés des hommes et de tout ce péché : car c’est fait, lui étant, et étant aimé."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 272
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "彼は去らない。どこかの天から降り直してもこない。女たちの怒り、男たちの陽気さ、このすべての罪の贖いを成し遂げることもない。それはもう済んでいる。彼が存在し、愛されていることによって。"
  "translation_status": "reviewed"
- "id": "ill-42-005"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô ses souffles, ses têtes, ses courses ; la terrible célérité de la perfection des formes et de l’action."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 273
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "ああ、彼の息吹、彼の頭、彼の駆ける姿。形と行為が完成する、その恐るべき速さ。"
  "translation_status": "reviewed"
- "id": "ill-42-006"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô fécondité de l’esprit et immensité de l’univers !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 274
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "ああ、精神の豊饒と、宇宙の広大さ！"
  "translation_status": "reviewed"
- "id": "ill-42-007"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Son corps ! Le dégagement rêvé, le brisement de la grâce croisée de violence nouvelle !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 275
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "彼のからだ！　夢に見た解放、新しい暴力と交わった優美さが砕け散ること！"
  "translation_status": "reviewed"
- "id": "ill-42-008"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sa vue, sa vue ! tous les agenouillages anciens et les peines relevés à sa suite."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 276
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "彼の姿、彼の姿！　古くからのあらゆる跪きと苦しみが、そのあとに立ち上がる。"
  "translation_status": "reviewed"
- "id": "ill-42-009"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Son jour ! l’abolition de toutes souffrances sonores et mouvantes dans la musique plus intense."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 277
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "彼の昼！　より激しい音楽のなかで、響き、動く、あらゆる苦しみが消え去ること。"
  "translation_status": "reviewed"
- "id": "ill-42-010"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Son pas ! les migrations plus énormes que les anciennes invasions."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 278
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[14]"
  "translation_ja": "彼の歩み！　昔の侵入よりも、さらに途方もない移動。"
  "translation_status": "reviewed"
- "id": "ill-42-011"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô Lui et nous ! l’orgueil plus bienveillant que les charités perdues."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 279
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[15]"
  "translation_ja": "ああ、彼とぼくら！　失われた慈善よりも、もっと心優しい誇り。"
  "translation_status": "reviewed"
- "id": "ill-42-012"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ô monde ! et le chant clair des malheurs nouveaux !"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 280
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[16]"
  "translation_ja": "ああ、世界！　そして新しい不幸の、澄み渡る歌！"
  "translation_status": "reviewed"
- "id": "ill-42-013"
  "section_id": "ill-42"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il nous a connus tous et nous a tous aimés. Sachons, cette nuit d’hiver, de cap en cap, du pôle tumultueux au château, de la foule à la plage, de regards en regards, forces et sentiments las, le héler et le voir, et le renvoyer, et sous les marées et au haut des déserts de neige, suivre ses vues, ses souffles, son corps, son jour."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/G%C3%A9nie&oldid=13607620"
    "source_sequence": 281
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[17]"
  "translation_ja": "彼はぼくらすべてを知り、ぼくらすべてを愛してくれた。この冬の夜、岬から岬へ、騒がしい極地から城へ、群衆から浜辺へ、まなざしからまなざしへ、力も感情も疲れ果てながらも、彼に呼びかけ、彼を見、彼を送り返すすべを知ろう。そして満ち引きする潮の下、雪の砂漠の高みで、彼のまなざし、彼の息吹、彼のからだ、彼の昼を、追ってゆこう。"
  "translation_status": "reviewed"
- "id": "ill-note-parade-body"
  "section_id": "ill-04"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「ひとまわり大きくなれ」の原文はprendre du dos。直訳では「背をつける」となる、意味の定まらない表現である。本訳では成長を促すような言い方を採ったが、身体や振る舞いの何を指すかは断定しない。"
  "translation_status": "reviewed"
- "id": "ill-note-sonnet-body"
  "section_id": "ill-33-sub-005"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この小節の後半は、原文にも省略を伴う破格な構文がある。「きみ」と「きみたち」を往還し、計算と焦りが踊りと声へ移る流れを保って訳したが、創案・成功・理性・人類を結ぶ細部の構文は確定しない。"
  "translation_status": "reviewed"
- "id": "ill-note-spunk-body"
  "section_id": "ill-40"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「火口」は、火を移すための燃えやすい材料を指す「ほくち」。原文は英語のspunkで、本訳ではこの語義を採った。活力を表す語義もあり、この箇所の比喩の指示対象は確定しない。"
  "translation_status": "reviewed"

- "id": "ill-01-000"
  "section_id": "ill-01"
  "kind": "heading"
  "origin": "source"
  "source_text": "Après le Déluge"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 1
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Après_le_Déluge"
  "translation_ja": "大洪水のあと"
  "translation_status": "reviewed"
- "id": "ill-01-001"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aussitôt que l’idée du Déluge se fut rassise,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 2
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "大洪水という思いがようやく鎮まると、"
  "translation_status": "reviewed"
- "id": "ill-01-002"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Un lièvre s’arrêta dans les sainfoins et les clochettes mouvantes et dit sa prière à l’arc-en-ciel à travers la toile de l’araignée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 3
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "一匹の野ウサギが、イガマメと揺れる釣鐘草のあいだに立ち止まり、クモの巣越しに虹へ祈りを捧げた。"
  "translation_status": "reviewed"
- "id": "ill-01-003"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Oh ! les pierres précieuses qui se cachaient — les fleurs qui regardaient déjà."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 4
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "ああ、身を隠していた宝石たち――もうこちらを見ていた花たち。"
  "translation_status": "reviewed"
- "id": "ill-01-004"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la grande rue sale les étals se dressèrent, et l’on tira les barques vers la mer étagée là-haut comme sur les gravures."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 5
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "汚れた大通りに露店が立ち、人々は小舟を引いていった。版画のように、はるか高みに段をなす海へ。"
  "translation_status": "reviewed"
- "id": "ill-01-005"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le sang coula, chez Barbe-Bleue, — aux abattoirs, — dans les cirques, où le sceau de Dieu blêmit les fenêtres. Le sang et le lait coulèrent."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 6
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "血が流れた、青ひげの館で――屠殺場で――神の印が窓を青ざめさせる円形劇場で。血と乳が流れた。"
  "translation_status": "reviewed"
- "id": "ill-01-006"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les castors bâtirent. Les « mazagrans » fumèrent dans les estaminets."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 7
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "ビーバーたちは家を建てた。居酒屋では「マザグラン」のコーヒーが湯気を立てた。"
  "translation_status": "reviewed"
- "id": "ill-01-007"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans la grande maison de vitres encore ruisselante les enfants en deuil regardèrent les merveilleuses images."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 8
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "まだガラスに水の滴る大きな家で、喪服の子どもたちが不思議な絵を見つめた。"
  "translation_status": "reviewed"
- "id": "ill-01-008"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Une porte claqua, — et sur la place du hameau, l’enfant tourna ses bras, compris des girouettes et des coqs des clochers de partout, sous l’éclatante giboulée."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 9
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "扉がばたんと閉まった――村の広場では、まぶしいにわか雨の下、子どもが両腕をぐるぐる回した。その身ぶりは、あちこちの風見や鐘楼の雄鶏には通じていた。"
  "translation_status": "reviewed"
- "id": "ill-01-009"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Madame *** établit un piano dans les Alpes. La messe et les premières communions se célébrèrent aux cent mille autels de la cathédrale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 10
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[13]"
  "translation_ja": "某夫人がアルプスにピアノを据えた。大聖堂の十万の祭壇で、ミサと初聖体拝領が執り行われた。"
  "translation_status": "reviewed"
- "id": "ill-01-010"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les caravanes partirent. Et le Splendide-Hôtel fut bâti dans le chaos de glaces et de nuit du pôle."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 11
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[14]"
  "translation_ja": "隊商が出発した。そして極地の氷と夜の混沌のなかに、スプランディッド・ホテルが建った。"
  "translation_status": "reviewed"
- "id": "ill-01-011"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Depuis lors, la Lune entendit les chacals piaulant par les déserts de thym, — et les églogues en sabots grognant dans le verger. Puis, dans la futaie violette, bourgeonnante, Eucharis me dit que c’était le printemps."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 12
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[15]"
  "translation_ja": "それ以来、月は聞いた。タイムの生える砂漠のあちこちでジャッカルが甲高く鳴くのを――果樹園で、木靴を履いた牧歌がうなるのを。やがて、芽吹く紫の高木林で、エウカリスがぼくに言った、春なのだと。"
  "translation_status": "reviewed"
- "id": "ill-01-012"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Sourds, étang, — Écume, roule sur le pont et par-dessus les bois ; — draps noirs et orgues, — éclairs et tonnerre, — montez et roulez ; — Eaux et tristesse, montez et relevez les Déluges."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 13
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[16]"
  "translation_ja": "――湧き上がれ、池よ――泡よ、橋の上を転がれ、森を越えよ――黒い布とオルガンよ――稲妻と雷鳴よ――立ち上がれ、とどろき渡れ――水と悲しみよ、立ち上がり、大洪水を呼び戻せ。"
  "translation_status": "reviewed"
- "id": "ill-01-013"
  "section_id": "ill-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Car depuis qu’ils se sont dissipés, — oh les pierres précieuses s’enfouissant, et les fleurs ouvertes ! — c’est un ennui ! et la Reine, la Sorcière qui allume sa braise dans le pot de terre, ne voudra jamais nous raconter ce qu’elle sait, et que nous ignorons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Apr%C3%A8s_le_D%C3%A9luge&oldid=13607295"
    "source_sequence": 14
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[17]"
  "translation_ja": "だって、それらが消え去ってからというもの――ああ、土に潜る宝石たち、開いた花たち！――なんという退屈だろう。そして女王は、土の鉢で炭火をおこす魔女は、自分が知っていてぼくらの知らないことを、決して話してくれようとはしないのだ。"
  "translation_status": "reviewed"

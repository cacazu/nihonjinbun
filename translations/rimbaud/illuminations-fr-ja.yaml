  "section_id": "ill-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pendant que les fonds publics s’écoulent en fêtes de fraternité, il sonne une cloche de feu rose dans les nuages."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"

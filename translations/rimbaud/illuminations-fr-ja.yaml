- "id": "ill-33-001"
  "section_id": "ill-33-sub-001"
  "kind": "heading"
  "origin": "source"
  "source_text": "I Dimanche"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 218
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[1]"
    "anchor": "IDimanche"
  "translation_ja": "I　日曜日"
  "translation_status": "reviewed"
- "id": "ill-33-002"
  "section_id": "ill-33-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les calculs de côté, l’inévitable descente du ciel, et la visite des souvenirs et la séance des rhythmes occupent la demeure, la tête et le monde de l’esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 219
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "計算はわきへ。避けようもない空の下降、思い出の訪れ、リズムの集いが、住まいと頭と精神の世界を占めている。"
  "translation_status": "reviewed"
- "id": "ill-33-003"
  "section_id": "ill-33-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "— Un cheval détale sur le turf suburbain, et le long des cultures et des boisements, percé par la peste carbonique. Une misérable femme de drame, quelque part dans le monde, soupire après des abandons improbables. Les desperadoes languissent après l’orage, l’ivresse et les blessures. De petits enfants étouffent des malédictions le long des rivières. —"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 220
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "――炭酸の疫病に貫かれた馬が、郊外の競馬場を、耕地や植林地に沿って、駆け去る。世界のどこかで、芝居のなかのみじめな女が、ありそうもない献身をため息まじりに待ち望む。命知らずの連中は、嵐と陶酔と傷を待ちわびる。小さな子どもたちは川沿いで、呪いを押し殺す。――"
  "translation_status": "reviewed"
- "id": "ill-33-004"
  "section_id": "ill-33-sub-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Reprenons l’étude au bruit de l’œuvre dévorante qui se rassemble et remonte dans les masses."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 221
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "研究を再開しよう。民衆のなかに集まり、再びのぼってくる、あらゆるものを食い尽くす仕事の響きを聞きながら。"
  "translation_status": "reviewed"
- "id": "ill-33-005"
  "section_id": "ill-33-sub-005"
  "kind": "heading"
  "origin": "source"
  "source_text": "II Sonnet"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 222
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[2]"
    "anchor": "IISonnet"
  "translation_ja": "II　ソネット"
  "translation_status": "reviewed"
- "id": "ill-33-006"
  "section_id": "ill-33-sub-005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Homme de constitution ordinaire, la chair n’était-elle pas un fruit pendu dans le verger, ô journées enfantes ! le corps un trésor à prodiguer ; ô aimer, le péril ou la force de Psyché ? La terre avait des versants fertiles en princes et en artistes, et la descendance et la race vous poussaient aux crimes et aux deuils : le monde votre fortune et votre péril. Mais à présent, ce labeur comblé, toi, tes calculs, toi, tes impatiences, ne sont plus que votre danse et votre voix, non fixées et point forcées, quoique d’un double événement d’invention et de succès une raison, en l’humanité fraternelle et discrète par l’univers sans images ; — la force et le droit réfléchissent la danse et la voix à présent seulement appréciées."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 223
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "ごく普通の体つきの人間よ、肉は果樹園に垂れた果実ではなかったか。ああ、幼い日々！　からだは惜しみなく使うべき宝ではなかったか。ああ、愛すること、それはプシュケの危うさだったか、それとも力だったか？　地上には王侯や芸術家を豊かに生む斜面があり、子孫と血筋がきみたちを犯罪と喪へ駆り立てた。世界はきみたちの幸運であり、危険だった。だが今、この労苦も満たされて、きみも、その計算も、きみも、その焦りも、もはやきみたちの踊りと声でしかない。定まらず、強いられもしない踊りと声。創案と成功という二つの出来事から生まれた一つの理性ではあっても、像のない宇宙を渡る、兄弟のように結ばれた慎ましい人類のなかで。――力と権利は、今ようやく認められた踊りと声を映している。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "この小節の後半は、原文にも省略を伴う破格な構文がある。「きみ」と「きみたち」を往還し、計算と焦りが踊りと声へ移る流れを保って訳したが、創案・成功・理性・人類を結ぶ細部の構文は確定しない。"
- "id": "ill-33-007"
  "section_id": "ill-33-sub-007"
  "kind": "heading"
  "origin": "source"
  "source_text": "III Vingt ans"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 224
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[3]"
    "anchor": "IIIVingt_ans"
  "translation_ja": "III　二十歳"
  "translation_status": "reviewed"
- "id": "ill-33-008"
  "section_id": "ill-33-sub-007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les voix instructives exilées… L’ingénuité physique amèrement rassise… Adagio. Ah ! l’égoïsme infini de l’adolescence, l’optimisme studieux : que le monde était plein de fleurs cet été ! Les airs et les formes mourant… Un chœur, pour calmer l’impuissance et l’absence ! Un chœur de verres, de mélodies nocturnes… En effet les nerfs vont vite chasser."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 225
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "教え諭す声は追放された……肉体の無邪気さは、苦々しくも鎮まった……ゆるやかに。ああ、思春期の果てしない利己心、勉強熱心な楽観。あの夏、世界はなんと花でいっぱいだったことか！　消えてゆく調べと形……無力と不在を鎮める合唱を！　グラスの、夜の旋律の合唱を……実際、神経はすぐに狩りに出るだろう。"
  "translation_status": "reviewed"
- "id": "ill-33-009"
  "section_id": "ill-33-sub-009"
  "kind": "heading"
  "origin": "source"
  "source_text": "IV"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 226
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h4[4]"
    "anchor": "IV"
  "translation_ja": "IV"
  "translation_status": "reviewed"
- "id": "ill-33-010"
  "section_id": "ill-33-sub-009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Tu en es encore à la tentation d’Antoine. L’ébat du zèle écourté, les tics d’orgueil puéril, l’affaissement et l’effroi. Mais tu te mettras à ce travail : toutes les possibilités harmoniques et architecturales s’émouvront autour de ton siège. Des êtres parfaits, imprévus, s’offriront à tes expériences. Dans tes environs affluera rêveusement la curiosité d’anciennes foules et de luxes oisifs. Ta mémoire et tes sens ne seront que la nourriture de ton impulsion créatrice. Quant au monde, quand tu sortiras, que sera-t-il devenu ? En tout cas, rien des apparences actuelles."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Jeunesse&oldid=13607521"
    "source_sequence": 227
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "きみはまだアントニウスの誘惑の段階にいる。長続きしない熱意のはしゃぎ、子どもじみた自尊心の癖、気落ちと恐れ。だがきみは、この仕事に取りかかるだろう。和声と建築のあらゆる可能性が、きみの席のまわりで動き出す。思いがけない完璧な存在が、きみの実験に身を差し出す。昔の群衆と、暇をもてあます贅沢への好奇心が、夢見るようにきみのまわりへ押し寄せる。記憶も感覚も、ただ創造の衝動の糧となる。さて、きみが外へ出た時、世界はどうなっているだろう？　いずれにせよ、今の姿は何一つ残っていない。"
  "translation_status": "reviewed"
- "id": "ill-34-000"
  "section_id": "ill-34"
  "kind": "heading"
  "origin": "source"
  "source_text": "Promontoire"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Promontoire&oldid=13607556"
    "source_sequence": 228
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/h3"
    "anchor": "Promontoire"
  "translation_ja": "岬"
  "translation_status": "reviewed"
- "id": "ill-34-001"
  "section_id": "ill-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L’aube d’or et la soirée frissonnante trouvent notre brick en large en face de cette villa et de ses dépendances, qui forment un promontoire aussi étendu que l’Épire et le Péloponnèse, ou que la grande île du Japon, ou que l’Arabie ! Des fanums qu’éclaire la rentrée des théories, d’immenses vues de la défense des côtes modernes, des dunes illustrées de chaudes fleurs et de bacchanales, de grands canaux de Carthage et des Embankments d’une Venise louche ; de molles éruptions d’Etnas et des crevasses de fleurs et d’eaux des glaciers ; des lavoirs entourés de peupliers d’Allemagne ; des talus de parcs singuliers penchant des têtes d’Arbre du Japon ; et les façades circulaires des « Royal » ou des « Grand » de Scarbro’ ou de Brooklyn, et leurs railways flanquent, creusent, surplombent les dispositions dans cet Hôtel, choisies dans l’histoire des plus élégantes et des plus colossales constructions de l’Italie, de l’Amérique et de l’Asie, dont les fenêtres et les terrasses à présent pleines d’éclairages, de boissons et de brises riches, sont ouvertes à l’esprit des voyageurs et des nobles — qui permettent, aux heures du jour, à toutes les tarentelles des côtes, — et même aux ritournelles des vallées illustres de l’art, de décorer merveilleusement les façades du Palais-Promontoire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Promontoire&oldid=13607556"
    "source_sequence": 229
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "黄金の夜明けも、身震いする夕べも、ぼくらの二本マストの船が沖にいるのを見つける。この別荘と付属の建物を前にして。それらはエペイロスとペロポネソスほども、日本の大きな島ほども、アラビアほども広い岬をなしている！　祭礼の行列の帰還に照らされる神殿、近代の海岸防衛の巨大な眺め、熱い花と酒神祭に彩られた砂丘、カルタゴの大運河と怪しげなヴェネツィアの堤、いくつものエトナの柔らかな噴火と、氷河に裂けた花と水の割れ目、ドイツのポプラに囲まれた洗い場、日本の木の頭を傾ける奇妙な公園の土手。そしてスカーバラやブルックリンの「ロイヤル」や「グランド」の、円くめぐる正面と鉄道。それらがこのホテルの構えの脇を固め、掘り下げ、上に張り出す。この構えは、イタリア、アメリカ、アジアの、最も優雅で巨大な建築の歴史から選び取られたものだ。その窓とテラスは今、灯と飲み物と豊かなそよ風で満ち、旅人と貴人の精神に開かれている――旅人や貴人たちは、昼の時間には、あらゆる海岸のタランテラを、さらには芸術で名高い谷々の繰り返しの旋律さえも、この岬の宮殿の正面を見事に飾るに任せるのだ。"
  "translation_status": "reviewed"
- "id": "ill-35-000"

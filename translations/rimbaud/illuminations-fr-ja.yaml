- "id": "ill-07-006"
  "section_id": "ill-07-sub-005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Dans un grenier où je fus enfermé à douze ans j’ai connu le monde, j’ai illustré la comédie humaine. Dans un cellier j’ai appris l’histoire. À quelque fête de nuit dans une cité du Nord, j’ai rencontré toutes les femmes des anciens peintres. Dans un vieux passage à Paris on m’a enseigné les sciences classiques. Dans une magnifique demeure cernée par l’Orient entier j’ai accompli mon immense œuvre et passé mon illustre retraite. J’ai brassé mon sang. Mon devoir m’est remis. Il ne faut même plus songer à cela. Je suis réellement d’outre-tombe, et pas de commissions."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Vies&oldid=13607688"
    "source_sequence": 71
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "十二歳で閉じ込められた屋根裏で、ぼくは世界を知り、人間喜劇を描き出した。地下の貯蔵室では歴史を学んだ。北の街のある夜祭で、昔の画家たちが描いた女に残らず出会った。パリの古い抜け道では、古典的な学問を教わった。東洋のすべてに取り囲まれた壮麗な屋敷で、ぼくは巨大な仕事を成し遂げ、輝かしい隠退生活を送った。自分の血をかき混ぜた。務めは免除された。もうそのことを考えることさえいらない。本当にぼくは、墓の向こう側にいるのだ。使い走りはお断り。"
  "translation_status": "reviewed"

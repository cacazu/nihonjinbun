- "id": "ill-40-001"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À ma sœur Louise Vanaen de Voringhem : — Sa cornette bleue tournée à la mer du Nord. — Pour les naufragés."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 255
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "わが姉妹、ルイーズ・ヴァナン・ド・ヴォランゲムに。――その青い修道帽は北海に向けられている。――難船した人々のために。"
  "translation_status": "reviewed"
- "id": "ill-40-002"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À ma sœur Léonie Aubois d’Ashby. Baou — l’herbe d’été bourdonnante et puante. — Pour la fièvre des mères et des enfants."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 256
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[6]"
  "translation_ja": "わが姉妹、レオニー・オーボワ・ダシュビーに。バウ――羽音を立て、悪臭を放つ夏草。――母たちと子どもたちの熱病のために。"
  "translation_status": "reviewed"
- "id": "ill-40-003"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À Lulu, — démon — qui a conservé un goût pour les oratoires du temps des Amies et de son éducation incomplète. Pour les hommes ! — À madame ***."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 257
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[7]"
  "translation_ja": "リュリュに――悪魔――「女友だち」の時代と、終わらなかった教育のころから、祈りの小堂への好みを持ち続けた者に。男たちのために！――某夫人に。"
  "translation_status": "reviewed"
- "id": "ill-40-004"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À l’adolescent que je fus. À ce saint vieillard, ermitage ou mission."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 258
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[8]"
  "translation_ja": "かつてぼくだった少年に。あの聖なる老人に、隠者の庵でも、伝道の地でも。"
  "translation_status": "reviewed"
- "id": "ill-40-005"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À l’esprit des pauvres. Et à un très haut clergé."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 259
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[9]"
  "translation_ja": "貧しい人々の精神に。そして、いとも高位の聖職者たちに。"
  "translation_status": "reviewed"
- "id": "ill-40-006"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aussi bien à tout culte en telle place de culte mémoriale et parmi tels événements qu’il faille se rendre, suivant les aspirations du moment ou bien notre propre vice sérieux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 260
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[10]"
  "translation_ja": "また、いかなる礼拝にも。その時々の願い、あるいはぼくら自身の真剣な悪徳に従い、由緒ある、どのような聖所へ、いかなる出来事のさなかへ、出向かなければならないとしても。"
  "translation_status": "reviewed"
- "id": "ill-40-007"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ce soir à Circeto des hautes glaces, grasse comme le poisson, et enluminée comme les dix mois de la nuit rouge, — (son cœur ambre et spunk), — pour ma seule prière muette comme ces régions de nuit et précédant des bravoures plus violentes que ce chaos polaire."
  "source_languages":
  - "fr"
  - "en"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 261
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[11]"
  "translation_ja": "今夜は、高い氷の国のチルチェートに。魚のように脂が乗り、赤い夜の十か月のように彩られた彼女に――（その心は琥珀と火口）――あの夜の領域のように無言の、ぼくのただ一つの祈りのために。そしてこの極地の混沌よりも激しい勇気に、先立つ祈りのために。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「火口」は、火を移すための燃えやすい材料を指す「ほくち」。原文は英語のspunkで、本訳ではこの語義を採った。活力を表す語義もあり、この箇所の比喩の指示対象は確定しない。"
- "id": "ill-40-008"
  "section_id": "ill-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À tout prix et avec tous les airs, même dans des voyages métaphysiques. — Mais plus alors."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/D%C3%A9votion&oldid=13607605"
    "source_sequence": 262
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[12]"
  "translation_ja": "何を払ってでも、どんな身ぶりでも、形而上の旅のなかでさえ。――だがその時には、もうしない。"
  "translation_status": "reviewed"
- "id": "ill-41-000"
  "section_id": "ill-41"
  "kind": "heading"
  "origin": "source"
  "source_text": "Démocratie"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"

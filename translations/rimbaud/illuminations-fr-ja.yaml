- "id": "ill-06-001"
  "section_id": "ill-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Devant une neige un Être de Beauté de haute taille. Des sifflements de mort et des cercles de musique sourde font monter, s’élargir et trembler comme un spectre ce corps adoré ; des blessures écarlates et noires éclatent dans les chairs superbes. Les couleurs propres de la vie se foncent, dansent, et se dégagent autour de la Vision, sur le chantier. Et les frissons s’élèvent et grondent, et la saveur forcenée de ces effets se chargeant avec les sifflements mortels et les rauques musiques que le monde, loin derrière nous, lance sur notre mère de beauté, — elle recule, elle se dresse. Oh ! nos os sont revêtus d’un nouveau corps amoureux,"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Illuminations/Being_beauteous&oldid=13607665"
    "source_sequence": 62
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/p[5]"
  "translation_ja": "雪を前にして、背の高い、美の存在がいる。死の口笛と、くぐもった音楽の輪が、愛されるそのからだを幽霊のように立ちのぼらせ、広げ、震わせる。見事な肉に、緋色と黒の傷がはじける。命そのものの色が濃くなり、踊り、この出現を取り巻いて、作業場に解き放たれる。そして戦慄は高まり、とどろく。その効果の荒々しい味わいには、ぼくらのはるか背後から世界がぼくらの美の母へ投げつける、死の口笛としわがれた音楽が積み重なってゆく――彼女は退き、すっくと立つ。ああ！　ぼくらの骨は、新しい、愛に満ちたからだで覆われる、"
  "translation_status": "reviewed"

- "id": "mb-stanza-1"
  "section_id": "ma-boheme"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Je m’en allais, les poings dans mes poches crevées ;
    Mon paletot aussi devenait idéal ;
    J’allais sous le ciel, Muse ! et j’étais ton féal ;
    Oh ! là là ! que d’amours splendides j’ai rêvées !
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "printed_page": "58"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Po%C3%A9sies/Ma_Boh%C3%A8me&oldid=13591931"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div"
  "translation_ja": |-
    破れたポケットに拳を突っ込み、ぼくは歩いていた。
    上着も、もう形を失いかけていた。
    空の下を歩いた。詩の女神よ、ぼくはきみに忠実なしもべだった。
    ああ、なんとすばらしい恋を、いくつ夢見たことだろう！
  "translation_status": "reviewed"
- "id": "mb-stanza-2"
  "section_id": "ma-boheme"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Mon unique culotte avait un large trou.
    — Petit-Poucet rêveur, j’égrenais dans ma course
    Des rimes. Mon auberge était à la Grande-Ourse.
    — Mes étoiles au ciel avaient un doux frou-frou
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "printed_page": "58"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Po%C3%A9sies/Ma_Boh%C3%A8me&oldid=13591931"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div"
  "translation_ja": |-
    たった一本のズボンには、大きな穴が開いていた。
    ――夢見る親指小僧のぼくは、道すがらこぼしていった、
    韻のつぶを。ぼくの宿は〈おおぐま座〉にあった。
    ――ぼくの星たちは空で、やさしい衣ずれの音を立てた。
  "translation_status": "reviewed"
- "id": "mb-stanza-3"
  "section_id": "ma-boheme"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Et je les écoutais, assis au bord des routes,
    Ces bons soirs de septembre où je sentais des gouttes
    De rosée à mon front, comme un vin de vigueur ;
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "printed_page": "58"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Po%C3%A9sies/Ma_Boh%C3%A8me&oldid=13591931"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div"
  "translation_ja": |-
    ぼくは道ばたに座って、星たちに耳を澄ませた、
    あの心地よい九月の夕べ、額に感じた
    露のしずくは、力の湧く葡萄酒のようだった。
  "translation_status": "reviewed"
- "id": "mb-stanza-4"
  "section_id": "ma-boheme"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Où, rimant au milieu des ombres fantastiques.
    Comme des lyres, je tirais les élastiques
    De mes souliers blessés, un pied près de mon cœur !
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "wikisource-hartmann-1958"
    "precision": "block"
    "printed_page": "58"
    "url": "https://fr.wikisource.org/w/index.php?title=%C5%92uvres_(Rimbaud)/Po%C3%A9sies/Ma_Boh%C3%A8me&oldid=13591931"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/div/div[2]/div"
  "translation_ja": |-
    そして、不思議な影のなかで韻をつくりながら、
    竪琴の弦のように、ぼくは引っぱっていた、
    傷だらけの靴のゴム紐を、片足を胸に寄せながら！
  "translation_status": "reviewed"
- "id": "mb-note-1-body"
  "section_id": "ma-boheme"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「形を失いかけていた」の原文はdevenait idéal。すり切れた上着が、実物というより観念に近づいてゆくという言葉遊びとして訳した。"
  "translation_status": "reviewed"
- "id": "mb-note-2-body"
  "section_id": "ma-boheme"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "親指小僧は、道に目印を残して歩く童話の少年。ここでは、その目印が韻に置き換えられている。"
  "translation_status": "reviewed"

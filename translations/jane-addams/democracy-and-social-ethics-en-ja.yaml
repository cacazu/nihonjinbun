    anchor: page_vii
  source_text: In putting them into the form of a book, no attempt has been made to change the somewhat informal style used in speaking. The "we" and "us" which originally referred to the speaker and her audience are merely extended to possible readers.
  translation_ja: 一冊の本にまとめるにあたり、講義のいくらかくだけた語り口には手を加えなかった。もともと話し手である私と聴衆を指していた「私たち」には、これから本書を手に取る読者にも加わってもらうことにした。
  translation_status: reviewed

    precision: page
    printed_page: '71'
    source_sequence: 85
    url: https://www.gutenberg.org/files/15487/15487-h/15487-h.htm#page_071
    anchor: page_071
  source_text: CHAPTER III. FILIAL RELATIONS
  translation_ja: 第三章　親子関係
  translation_status: reviewed
- id: da-03-001
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '71'
    source_sequence: 86
  source_text: There are many people in every community who have not felt the "social compunction," who do not share the effort toward a higher social morality, who are even unable to sympathetically interpret it. Some of these have been shielded from the inevitable and salutary failures which the trial of new powers involve, because they are content to attain standards of virtue demanded by an easy public opinion, and others of them have exhausted their moral energy in attaining to the current standard of individual and family righteousness.
  translation_ja: どんな共同体にも、「社会に対する良心の痛み」を感じたことのない人は多い。より高い社会の道徳を目指す努力には加わらず、その努力に共感して理解することすらできない。おおらかな世論が求める水準の徳を身につければ満足なので、新しい力を試すときにつきものであり、ためにもなる失敗から、守られてきた人がいる。また、個人として、家族の一員として、世間で通用する正しさの水準を満たすうちに、道徳のための力を使い果たした人もいる。
  translation_status: reviewed
- id: da-03-002
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '71'
    source_sequence: 87
    printed_page_end: '72'
  source_text: 'Such people, who form the bulk of contented society, demand that the radical, the reformer, shall be without stain or question in his personal and family relations, and judge most harshly any deviation from the established standards. There is a certain justice in this: it expresses the inherent conservatism of the mass of men, that none of the established virtues which have been so slowly and hardly acquired shall be sacrificed for the sake of making problematic advance; that the individual, in his attempt to develop and use the new and exalted virtue, shall not fall into the easy temptation of letting the ordinary ones slip through his fingers.'
  translation_ja: 今の暮らしに満足している社会の大半を占めるのは、こういう人たちである。急進派や改革者には、私生活でも家族関係でも、一点の汚れも疑わしいところもないことを求め、すでに確立した基準から少しでも外れると、ことのほか厳しく裁く。これにはいくらか道理もある。大多数の人がもとから持つ、今あるものを守ろうとする心の表れである。長い時間と苦労の末に身についた徳を、実現するかどうかも分からない前進のために犠牲にしてはいけない。新しく、より高い徳を培い、実践しようとするときも、ふつうの徳まで手から滑り落とすという、たやすい誘惑に負けてはいけない、というのである。
  translation_status: reviewed
- id: da-03-003
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '72'
    source_sequence: 88
  source_text: This instinct to conserve the old standards, combined with a distrust of the new standard, is a constant difficulty in the way of those experiments and advances depending upon the initiative of women, both because women are the more sensitive to the individual and family claims, and because their training has tended to make them content with the response to these claims alone.
  translation_ja: 昔からの基準を守ろうとする本能に、新しい基準への不信が加わると、女性がみずから乗り出すことで初めて可能になる試みや進歩は、絶えず妨げられる。女性のほうが個人として、家族の一員として求められることに敏感であり、また、その求めに応えるだけで満足するよう、育てられてきたからである。
  translation_status: reviewed
- id: da-03-004
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '72'
    source_sequence: 89
    printed_page_end: '73'
  source_text: There is no doubt that, in the effort to sustain the moral energy necessary to work out a more satisfactory social relation, the individual often sacrifices the energy which should legitimately go into the fulfilment of personal and family claims, to what he considers the higher claim.
  translation_ja: もっと満足できる社会との関係をつくるには、道徳のための力を保たなければならない。そう努めるなかで、ときに人は、個人として、家族の一員として当然果たすべき務めに注ぐはずの力を、その人がより高いと考える務めのために犠牲にする。これは疑いのないことである。
  translation_status: reviewed
- id: da-03-005
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '73'
    source_sequence: 90
    printed_page_end: '74'
  source_text: In considering the changes which our increasing democracy is constantly making upon various relationships, it is impossible to ignore the filial relation. This chapter deals with the relation between parents and their grown-up daughters, as affording an explicit illustration of the perplexity and mal-adjustment brought about by the various attempts of young women to secure a more active share in the community life. We constantly see parents very much disconcerted and perplexed in regard to their daughters when these daughters undertake work lying quite outside of traditional and family interests. These parents insist that the girl is carried away by a foolish enthusiasm, that she is in search of a career, that she is restless and does not know what she wants. They will give any reason, almost, rather than the recognition of a genuine and dignified claim. Possibly all this is due to the fact that for so many hundreds of years women have had no larger interests, no participation in the affairs lying quite outside personal and family claims. Any attempt that the individual woman formerly made to subordinate or renounce the family claim was inevitably construed to mean that she was setting up her own will against that of her family's for selfish ends. It was concluded that she could have no motive larger than a desire to serve her family, and her attempt to break away must therefore be wilful and self-indulgent.
  translation_ja: 民主主義が広がるにつれ、さまざまな人間関係が絶えず変わっている。そこで親子の関係を無視することはできない。この章では、親と成人した娘の関係を取り上げる。若い女性が共同体の暮らしにもっと積極的に加わろうとするさまざまな試みによって、どんな戸惑いや不和が生まれるかを、はっきり示す例だからである。娘が旧来の関心事や家族の利害とはまったく別の仕事を引き受けると、親がすっかりうろたえ、どうしたらよいか分からなくなるのを、私たちはいつも目にする。親は、くだらない熱に浮かされているのだ、職業を持ちたいだけだ、落ち着きがなく何がしたいのかも分かっていないのだと言い張る。まともな、尊重すべき務めに応えようとしていると認めるくらいなら、ほとんどどんな説明でも持ち出す。これも、何百年というあいだ、女性にはもっと広い関心を持ったり、個人的な務めや家族への務めの外にある事柄に加わったりする機会がなかったためかもしれない。以前、女性が家族への務めを後回しにしたり、放棄したりしようとすれば、必ず、自分の利己的な目的のために、自らの意志を家族の意志に対立させるのだと受け取られた。家族に尽くす以上の動機などありえないのだから、そこから離れようとするのは、自分勝手でわがままな振る舞いに違いないとされたのである。
  translation_status: reviewed
- id: da-03-006
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '74'
    source_sequence: 91
    printed_page_end: '75'
  source_text: The family logically consented to give her up at her marriage, when she was enlarging the family tie by founding another family. It was easy to understand that they permitted and even promoted her going to college, travelling in Europe, or any other means of self-improvement, because these merely meant the development and cultivation of one of its own members. When, however, she responded to her impulse to fulfil the social or democratic claim, she violated every tradition.
  translation_ja: そうした家族が、娘の結婚では、その考え方に沿って、彼女を手放すことを認めた。娘は別の家族をつくり、家族の絆を広げるからだ。大学へ進むこと、ヨーロッパを旅すること、ほかに自分を磨く手立てを取ることを、親が認めるばかりか奨励するのも、分かりやすい。その家族の一員の力を伸ばし、教養をつけるだけだからである。だが娘が、社会への、民主主義のなかでの務めを果たしたいという気持ちに応えようとすると、あらゆるしきたりを破ることになった。
  translation_status: reviewed
- id: da-03-007
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '75'
    source_sequence: 92
  source_text: The mind of each one of us reaches back to our first struggles as we emerged from self-willed childhood into a recognition of family obligations. We have all gradually learned to respond to them, and yet most of us have had at least fleeting glimpses of what it might be to disregard them and the elemental claim they make upon us. We have yielded at times to the temptation of ignoring them for selfish aims, of considering the individual and not the family convenience, and we remember with shame the self-pity which inevitably followed. But just as we have learned to adjust the personal and family claims, and to find an orderly development impossible without recognition of both, so perhaps we are called upon now to make a second adjustment between the family and the social claim, in which neither shall lose and both be ennobled.
  translation_ja: 誰もが、好き勝手だった幼いころを抜け出し、家族に対する務めを認めるまでに、はじめて苦労したときのことを思い返す。だんだんその務めに応えるようになったが、それでもたいていは、その務めを、家族が自分に対して持つ根本的な求めごと顧みずに暮らすとしたら、どうなるか、ほんの一瞬は想像したことがある。ときには自分の利益を求めて、務めをないがしろにし、家族ではなく自分一人の都合を考えたい誘惑に負けた。そのあと必ず自分がかわいそうになったことを思い出すと、恥ずかしい。だが、個人への求めと家族への求めを折り合わせることを学び、両方を認めなければ順調に育つことはできないと知ったように、いま私たちは、もう一度折り合いをつけるよう求められているのかもしれない。今度は家族への務めと社会への務めのあいだで、どちらをも損なわず、どちらをも気高いものにするのである。
  translation_status: reviewed
- id: da-03-008
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '75'
    source_sequence: 93
    printed_page_end: '77'
  source_text: The attempt to bring about a healing compromise in which the two shall be adjusted in proper relation is not an easy one. It is difficult to distinguish between the outward act of him who in following one legitimate claim has been led into the temporary violation of another, and the outward act of him who deliberately renounces a just claim and throws aside all obligation for the sake of his own selfish and individual development. The man, for instance, who deserts his family that he may cultivate an artistic sensibility, or acquire what he considers more fulness of life for himself, must always arouse our contempt. Breaking the marriage tie as Ibsen's "Nora" did, to obtain a larger self-development, or holding to it as George Eliot's "Romola" did, because of the larger claim of the state and society, must always remain two distinct paths. The collision of interests, each of which has a real moral basis and a right to its own place in life, is bound to be more or less tragic. It is the struggle between two claims, the destruction of either of which would bring ruin to the ethical life. Curiously enough, it is almost exactly this contradiction which is the tragedy set forth by the Greek dramatist, who asserted that the gods who watch over the sanctity of the family bond must yield to the higher claims of the gods of the state. The failure to recognize the social claim as legitimate causes the trouble; the suspicion constantly remains that woman's public efforts are merely selfish and captious, and are not directed to the general good. This suspicion will never be dissipated until parents, as well as daughters, feel the democratic impulse and recognize the social claim.
  translation_ja: 二つの務めをふさわしい関係に置いて、対立をいやす折り合いをつけるのは、簡単ではない。正当な務めを一つ果たそうとして一時的にもう一方を犯すことになった人と、個人として自分を伸ばすという利己的な目的のため、正当な務めをわざと放棄して責任をすべて投げ出した人とは、外から見た行いで見分けにくい。たとえば芸術の感性を磨くため、自分がより充実した人生と考えるものを手に入れるために家族を捨てる男は、いつも私たちの軽蔑を招くに違いない。イプセンの「ノラ」のように、自分をさらに成長させるために結婚の絆を断つことと、ジョージ・エリオットの「ロモラ」のように、国家と社会に対するもっと大きな務めのために、絆を保つことは、いつまでも二つの別々の道であろう。どちらも道徳上の確かな根拠を持ち、人生でその場所を占めるだけの権利がある。そうした利害が衝突するなら、どうしてもいくらか悲劇的になる。どちらをなくしても倫理にかなう生き方は崩れてしまう、二つの務めの争いなのだ。奇妙なことに、ギリシャの劇作家が描いた悲劇は、ほとんどまさにこの矛盾だった。家族の絆の神聖さを見守る神々は、国家の神々からのより高い求めに譲らなければならない、とその劇作家は言った。問題が起こるのは、社会への務めが正当だと認められないためである。女性が公に活動するのは、ただ利己的であら探しをしたいからで、皆の利益に向けられたものではない、という疑いがいつも残る。娘だけではなく親も、民主主義の促しを感じ、社会への務めを認めるまでは、この疑いは決して消えない。
  translation_status: reviewed
- id: da-03-009
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '77'
    source_sequence: 94
    printed_page_end: '78'
  source_text: Our democracy is making inroads upon the family, the oldest of human institutions, and a claim is being advanced which in a certain sense is larger than the family claim. The claim of the state in time of war has long been recognized, so that in its name the family has given up sons and husbands and even the fathers of little children. If we can once see the claims of society in any such light, if its misery and need can be made clear and urged as an explicit claim, as the state urges its claims in the time of danger, then for the first time the daughter who desires to minister to that need will be recognized as acting conscientiously. This recognition may easily come first through the emotions, and may be admitted as a response to pity and mercy long before it is formulated and perceived by the intellect.
  translation_ja: 民主主義の力は、人間の制度のうち最も古い家族にまで及び、ある意味で家族より大きな務めが提起されている。戦争のときに国家が求める務めは、長いこと認められてきた。だから家族は、国家の名のもと、息子や夫、まだ幼い子どもの父親まで手放してきた。もし私たちが一度でも、社会への務めを、これにいくらかでも似た光のもとで見ることができたら。社会の苦しみと、助けを必要とする事情がはっきり見え、危機の際に国家がするように、社会からの明確な要求として、その務めが示されたら。そのとき初めて、その必要に応えたいと願う娘は、良心に沿って行動していると認められるだろう。その承認は、まず心から自然に生まれるかもしれない。頭で考え、言葉で言い表せるよりもずっと前に、憐れみと慈しみに応えて認められるかもしれない。
  translation_status: reviewed
- id: da-03-010
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '78'
    source_sequence: 95
    printed_page_end: '80'
  source_text: The family as well as the state we are all called upon to maintain as the highest institutions which the race has evolved for its safeguard and protection. But merely to preserve these institutions is not enough. There come periods of reconstruction, during which the task is laid upon a passing generation, to enlarge the function and carry forward the ideal of a long-established institution. There is no doubt that many women, consciously and unconsciously, are struggling with this task. The family, like every other element of human life, is susceptible of progress, and from epoch to epoch its tendencies and aspirations are enlarged, although its duties can never be abrogated and its obligations can never be cancelled. It is impossible to bring about the higher development by any self-assertion or breaking away of the individual will. The new growth in the plant swelling against the sheath, which at the same time imprisons and protects it, must still be the truest type of progress. The family in its entirety must be carried out into the larger life. Its various members together must recognize and acknowledge the validity of the social obligation. When this does not occur we have a most flagrant example of the ill-adjustment and misery arising when an ethical code is applied too rigorously and too conscientiously to conditions which are no longer the same as when the code was instituted, and for which it was never designed. We have all seen parental control and the family claim assert their authority in fields of effort which belong to the adult judgment of the child and pertain to activity quite outside the family life. Probably the distinctively family tragedy of which we all catch glimpses now and then, is the assertion of this authority through all the entanglements of wounded affection and misunderstanding. We see parents and children acting from conscientious motives and with the tenderest affection, yet bringing about a misery which can scarcely be hidden.
  translation_ja: 家族も国家も、人類が自らを守るために育ててきた最も大切な制度として、私たちみなが維持するよう求められている。だが、その制度を守るだけでは足りない。立て直しの時代が来れば、長く続いてきた制度の役割を広げ、理想を先へ進める務めを、そのときに生きる世代が負う。自覚があるにせよないにせよ、多くの女性がこの務めに取り組んでいることは間違いない。ほかの人間の営みと同じように、家族も前へ進むことができる。その務めを廃したり、責任を取り消したりは決してできないが、目を向ける先や望むものは、時代を経るごとに広がる。自分の意志を押し通したり、一人だけ離れたりしても、より高い段階へ進めるわけではない。植物の新芽が、自分を閉じ込めると同時に守る葉鞘を、ふくらみながら内側から押す姿は、やはり前へ進むことを最もよく表している。家族は一つのまとまりのまま、もっと広い暮らしへ出ていかなければならない。家族の一人ひとりがそろって、社会に対する務めに正当な理由があると認めなければならない。そうならなければ、倫理の規範を厳しく、良心的に守りすぎるあまり、規範ができたころとは違い、もともとその規範で律するつもりもなかった事情に、それを当てはめて、不和と苦しみを生む。その際立った例を目にすることになる。大人になった子の判断に属し、家族の暮らしの外での活動に関わる分野にまで、親の支配や家族への務めが、権威を主張するのを、誰もが見たことがあるだろう。私たちが折々に垣間見る、家族ならではの悲劇とは、おそらく、傷ついた愛情と行き違いがもつれ合うなかで、この権威が主張されることである。親も子も、良心から、最も優しい愛情をもって行動しているのに、隠しきれないほどの苦しみを生んでしまう。
  translation_status: reviewed
- id: da-03-011
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '80'
    source_sequence: 96
    printed_page_end: '82'
  source_text: Such glimpses remind us of that tragedy enacted centuries ago in Assisi, when the eager young noble cast his very clothing at his father's feet, dramatically renouncing his filial allegiance, and formally subjecting the narrow family claim to the wider and more universal duty. All the conflict of tragedy ensued which might have been averted, had the father recognized the higher claim, and had he been willing to subordinate and adjust his own claim to it. The father considered his son disrespectful and hard-hearted, yet we know St. Francis to have been the most tender and loving of men, responsive to all possible ties, even to those of inanimate nature. We know that by his affections he freed the frozen life of his time. The elements of tragedy lay in the narrowness of the father's mind; in his lack of comprehension and his lack of sympathy with the power which was moving his son, and which was but part of the religious revival which swept Europe from end to end in the early part of the thirteenth century; the same power which built the cathedrals of the North, and produced the saints and sages of the South. But the father's situation was nevertheless genuine; he felt his heart sore and angry, and his dignity covered with disrespect. He could not, indeed, have felt otherwise, unless he had been touched by the fire of the same revival, and lifted out of and away from the contemplation of himself and his narrower claim. It is another proof that the notion of a larger obligation can only come through the response to an enlarged interest in life and in the social movements around us.
  translation_ja: そんな場面を見ると、何世紀も前にアッシジで演じられたあの悲劇を思い出す。情熱に駆られた若き貴人が、身につけた服まで父の足もとに投げ、子としての忠誠を劇的に放棄し、家族への狭い務めを、より広く、誰にでも及ぶ務めの下に、はっきりと置いたのである。そこから悲劇的な対立がすっかり表面に出たが、父が息子のより高い務めを認め、それに合わせて自分の求めを後に回す気があれば、避けられたかもしれない。父は息子を無礼で冷酷だと思った。だが聖フランチェスコが、誰より優しく、愛情深く、人とのあらゆる絆ばかりか、生命のない自然とのつながりにさえ応えた人であることを、私たちは知っている。愛情を通じて、自分の時代の凍りついた暮らしを解き放ったことも知っている。悲劇の原因は、父の心の狭さにあった。息子を動かす力を理解できず、共感もできなかった。その力とは、十三世紀初めにヨーロッパの端から端までを席巻した信仰の復興の一部であって、北方に大聖堂を築き、南方に聖人や賢者を生んだのと同じ力だった。だが父の置かれた状況も、決して偽りではない。心は痛み、腹が立ち、尊厳をないがしろにされたと思った。同じ復興の火に触れ、自分のことや、自分のより狭い要求ばかりを見ている状態から抜け出すのでなければ、ほかに感じようがなかったのである。もっと大きな務めがあるという考えは、人の暮らしや身の回りの社会の動きに、より広い関心をもって応えて初めて生まれる。これもその証の一つだ。
  translation_status: reviewed
- id: da-03-012
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '82'
    source_sequence: 97
  source_text: The grown-up son has so long been considered a citizen with well-defined duties and a need of "making his way in the world," that the family claim is urged much less strenuously in his case, and as a matter of authority, it ceases gradually to be made at all. In the case of the grown-up daughter, however, who is under no necessity of earning a living, and who has no strong artistic bent, taking her to Paris to study painting or to Germany to study music, the years immediately following her graduation from college are too often filled with a restlessness and unhappiness which might be avoided by a little clear thinking, and by an adaptation of our code of family ethics to modern conditions.
  translation_ja: 成人した息子は、はっきりした務めを持ち、「世に出なければならない」市民だと、長く考えられてきた。そのため家族からの求めは、息子にははるかに弱く、権威をかざして要求することは、次第にまったくなくなる。だが暮らしを稼ぐ必要がなく、パリへ絵を、あるいはドイツへ音楽を学びに行くような、強く心を引かれる芸術の分野もない成人した娘の場合は、大学卒業直後の何年かを、落ち着かず不幸な気持ちで過ごすことが多すぎる。何が起きているかいくらか明晰に考え、家族の倫理の規範を今の事情に合わせれば、避けられることである。
  translation_status: reviewed
- id: da-03-013
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '82'
    source_sequence: 98
    printed_page_end: '84'
  source_text: It is always difficult for the family to regard the daughter otherwise than as a family possession. From her babyhood she has been the charm and grace of the household, and it is hard to think of her as an integral part of the social order, hard to believe that she has duties outside of the family, to the state and to society in the larger sense. This assumption that the daughter is solely an inspiration and refinement to the family itself and its own immediate circle, that her delicacy and polish are but outward symbols of her father's protection and prosperity, worked very smoothly for the most part so long as her education was in line with it. When there was absolutely no recognition of the entity of woman's life beyond the family, when the outside claims upon her were still wholly unrecognized, the situation was simple, and the finishing school harmoniously and elegantly answered all requirements. She was fitted to grace the fireside and to add lustre to that social circle which her parents selected for her. But this family assumption has been notably broken into, and educational ideas no longer fit it. Modern education recognizes woman quite apart from family or society claims, and gives her the training which for many years has been deemed successful for highly developing a man's individuality and freeing his powers for independent action. Perplexities often occur when the daughter returns from college and finds that this recognition has been but partially accomplished. When she attempts to act upon the assumption of its accomplishment, she finds herself jarring upon ideals which are so entwined with filial piety, so rooted in the tenderest affections of which the human heart is capable, that both daughter and parents are shocked and startled when they discover what is happening, and they scarcely venture to analyze the situation. The ideal for the education of woman has changed under the pressure of a new claim. The family has responded to the extent of granting the education, but they are jealous of the new claim and assert the family claim as over against it.
  translation_ja: 家族にとって、娘を家族の持ち物と見るのをやめるのは、いつでも難しい。赤ん坊のころから、家に魅力と華やぎを添えてきたから、娘が社会という仕組みになくてはならない一部だとは考えにくい。家族の外に、国に対し、もっと広い意味で社会に対する務めを負うとも、信じにくい。この思い込みでは、娘が家族そのものと身近な付き合いの範囲にもたらすのは、刺激と洗練だけであり、娘の物腰のきめ細やかさや磨き上げられた作法も、父の庇護と豊かさを外に示すにすぎない。娘の教育がそれに沿っているかぎり、大方は何の支障もなく成り立った。家族を離れた女性の一人の人間としての暮らしなど少しも認められず、外から女性に求められる務めもまったく認められなかったころは、事情は単純で、良家の子女に作法と教養を仕上げさせる学校は、何の矛盾もなく、優雅に、求められることをすべて満たした。娘は家庭に華を添え、親が選ぶ社交の輪に輝きを加えるのにふさわしく育てられた。だが、こうした家族の思い込みは目に見えて崩れ、教育についての考えはすでにそれとは合わない。今日の教育は、家族や社会に求められる役割から完全に離れたところでも、女性を一人の人間として認める。そして長年、男子の個性を高度に発達させ、自ら行動する力を解き放つのに役立つと見なされてきた訓練を、女性にも与える。娘が大学から帰ると、世の中がそれを認めたのは、まだ一部にとどまっていると分かり、困ったことが起こりやすい。すでに認められたつもりで行動すると、親孝行と絡み合い、人の心が持てる最も優しい愛情に深く根ざした理想に、ぶつかってしまうのである。何が起きているかに気づくと、娘も親もひどく驚いて衝撃を受け、事情を立ち入って考えることもろくにできない。新しい要求に押されて、女性の教育の理想は変化した。家族も教育を受けさせるところまでは応じたが、新しい要求には警戒し、それに対抗して家族への務めを主張する。
  translation_status: reviewed

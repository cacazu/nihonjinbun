    source_sequence: 70
    printed_page_end: '57'
  source_text: In addition to books of adventure, or even reading of any sort, the scenes and ideals of the theatre largely form the manners and morals of the young people. "Going to the theatre" is indeed the most common and satisfactory form of recreation. Many boys who conscientiously give all their wages to their mothers have returned each week ten cents to pay for a seat in the gallery of a theatre on Sunday afternoon. It is their one satisfactory glimpse of life—the moment when they "issue forth from themselves" and are stirred and thoroughly interested. They quite simply adopt as their own, and imitate as best they can, all that they see there. In moments of genuine grief and excitement the words and the gestures they employ are those copied from the stage, and the tawdry expression often conflicts hideously with the fine and genuine emotion of which it is the inadequate and vulgar vehicle.
  translation_ja: 冒険の本やほかの読み物を読むことに加え、劇場で目にする場面やそこで描かれる理想が、若者の行儀や道徳を大きく形づくる。「芝居を見に行く」のは、実際、最もふつうで、最も満足のいく気晴らしである。良心的に賃金を残らず母親に渡す少年の多くは、毎週十セント返してもらい、日曜の午後に劇場の天井桟敷の席を買う。彼らにはそれが、生きた世界をのぞき見て心から満たされる唯一の機会、「自分自身の外に出て」、心を動かされ、すっかり夢中になれるひとときなのだ。そこで目にしたものを何も疑わず自分のものとし、できるかぎりまねる。本当に悲しかったり、興奮したりするときに使う言葉や仕草は、舞台から写し取ったものだ。その安っぽい表現では、気品のある本物の感情を伝えきれず、むしろひどくそぐわないことが多い。
  translation_status: reviewed
- id: da-02-045
  section_id: ch-02

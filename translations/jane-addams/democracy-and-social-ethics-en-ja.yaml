  source_text: CHAPTER I. INTRODUCTION
  translation_ja: 第一章　序論
  translation_status: reviewed
- id: da-01-001
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '1'
    source_sequence: 8
  source_text: It is well to remind ourselves, from time to time, that "Ethics" is but another word for "righteousness," that for which many men and women of every generation have hungered and thirsted, and without which life becomes meaningless.
  translation_ja: 「倫理」とは「正しく生きること」の別名にすぎない。このことを、ときおり思い出すとよい。どの世代にも、それを飢え渇くように求めてきた人々がいる。それなしには人生は意味を失う。
  translation_status: reviewed
- id: da-01-002
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '1'
    source_sequence: 9
    printed_page_end: '2'
  source_text: Certain forms of personal righteousness have become to a majority of the community almost automatic. It is as easy for most of us to keep from stealing our dinners as it is to digest them, and there is quite as much voluntary morality involved in one process as in the other. To steal would be for us to fall sadly below the standard of habit and expectation which makes virtue easy. In the same way we have been carefully reared to a sense of family obligation, to be kindly and considerate to the members of our own households, and to feel responsible for their well-being. As the rules of conduct have become established in regard to our self-development and our families, so they have been in regard to limited circles of friends. If the fulfilment of these claims were all that a righteous life required, the hunger and thirst would be stilled for many good men and women, and the clew of right living would lie easily in their hands.
  translation_ja: 個人として正しく振る舞うことのうち、いくつかは世の大多数の人にとって、ほとんど無意識にできるようになっている。夕食を盗まずに済ませるのは、それを消化するのと同じくらい、私たちの大半にはたやすい。意識して道徳を実践することがほとんどないという点でも、どちらも変わりはない。もし盗めば、日ごろの習慣と周囲の期待が支えてくれるおかげで難しくもない善行の水準を、情けないほど下回ることになる。同じように、私たちは家族への務めを意識し、身内には思いやりをもって親切に接し、その暮らしに責任を感じるようにと、同じく丁寧に育てられてきた。自分を成長させるときや家族に接するときの規範が定まってきたように、親しい友人の輪のなかにも、そうした規範ができてきた。正しく生きるために求められることが、これらの務めを果たすだけでよいのなら、多くの善良な人の飢えと渇きは鎮まり、どう生きればよいかの手がかりもすぐ手に入るだろう。
  translation_status: reviewed
- id: da-01-003
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '2'
    source_sequence: 10
  source_text: But we all know that each generation has its own test, the contemporaneous and current standard by which alone it can adequately judge of its own moral achievements, and that it may not legitimately use a previous and less vigorous test. The advanced test must indeed include that which has already been attained; but if it includes no more, we shall fail to go forward, thinking complacently that we have "arrived" when in reality we have not yet started.
  translation_ja: しかし、どの世代にも自分たちの試金石があることを、私たちはみな知っている。自分たちが道徳の面で何を成し遂げたのかを十分に判断するには、その時代に生きて働いている基準によるほかない。以前の、いまほど厳しくない物差しを使うのは筋が通らない。もちろん、より先へ進んだ基準は、すでに達成したことを含まなければならない。だが、それしか含まないなら、まだ歩き出してもいないのに「もう着いた」と自己満足して、前に進めなくなる。
  translation_status: reviewed
- id: da-01-004
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '2'
    source_sequence: 11
    printed_page_end: '3'
  source_text: To attain individual morality in an age demanding social morality, to pride one's self on the results of personal effort when the time demands social adjustment, is utterly to fail to apprehend the situation.
  translation_ja: 社会の道徳が求められる時代に個人としての道徳を身につけ、社会のあり方を改めることが求められる時に自分一人の努力の成果を誇るのは、どんな時代に生きているのかがまるで分かっていないということだ。
  translation_status: reviewed
- id: da-01-005
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '3'
    source_sequence: 12
  source_text: It is perhaps significant that a German critic has of late reminded us that the one test which the most authoritative and dramatic portrayal of the Day of Judgment offers, is the social test. The stern questions are not in regard to personal and family relations, but did ye visit the poor, the criminal, the sick, and did ye feed the hungry?
  translation_ja: あるドイツの批評家が最近思い出させてくれたことは、意味深いかもしれない。最後の審判を描いた最も権威ある劇的な場面で提示される唯一の試金石は、社会に対する行いなのだ。厳しく問われるのは、自分や家族にどう接したかではない。おまえたちは貧しい者、罪を犯した者、病める者を訪ねたか。飢えた者に食べさせたか、ということだ。
  translation_status: reviewed
- id: da-01-006
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '3'
    source_sequence: 13
    printed_page_end: '4'
  source_text: All about us are men and women who have become unhappy in regard to their attitude toward the social order itself; toward the dreary round of uninteresting work, the pleasures narrowed down to those of appetite, the declining consciousness of brain power, and the lack of mental food which characterizes the lot of the large proportion of their fellow-citizens. These men and women have caught a moral challenge raised by the exigencies of contemporaneous life; some are bewildered, others who are denied the relief which sturdy action brings are even seeking an escape, but all are increasingly anxious concerning their actual relations to the basic organization of society.
  translation_ja: 社会の仕組みそのものに自分がどう向き合っているかを思い、心を痛める人々が私たちの周りにいる。仲間である市民の多くは、面白みのない仕事をうんざりするほど繰り返し、楽しみは欲を満たすことに限られ、自分にも考える力があるという意識は薄れ、その力を養うものにも事欠いている。そういう暮らしを前に、今の時代が突きつける道徳上の問いを受け止めた人々がいる。どうしてよいか分からない人もいれば、思い切って行動することで得られる救いがないため、逃げ道を探す人さえいる。だが誰もが、社会の土台をなす仕組みと自分が実際にどう関わっているのか、ますます気にせずにはいられなくなっている。
  translation_status: reviewed
- id: da-01-007
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '4'
    source_sequence: 14
    printed_page_end: '5'
  source_text: 'The test which they would apply to their conduct is a social test. They fail to be content with the fulfilment of their family and personal obligations, and find themselves striving to respond to a new demand involving a social obligation; they have become conscious of another requirement, and the contribution they would make is toward a code of social ethics. The conception of life which they hold has not yet expressed itself in social changes or legal enactment, but rather in a mental attitude of maladjustment, and in a sense of divergence between their consciences and their conduct. They desire both a clearer definition of the code of morality adapted to present day demands and a part in its fulfilment, both a creed and a practice of social morality. In the perplexity of this intricate situation at least one thing is becoming clear: if the latter day moral ideal is in reality that of a social morality, it is inevitable that those who desire it must be brought in contact with the moral experiences of the many in order to procure an adequate social motive.'
  translation_ja: この人たちが自分の行いを測ろうとするのは、社会に対する行いを問う物差しである。家族や個人としての務めを果たしても満足できず、社会に対して責任を負うという、新たな要求に応えようと努める自分に気づく。もう一つの務めを意識するようになり、社会倫理の規範をつくることに力を貸したいと思っている。こうした生き方の考えが、社会の変化や法律の制定として現れるにはまだ至っていない。現れているのはむしろ、今のあり方に自分がなじめないという気持ちと、良心と行動が食い違っているという感覚だ。今日の求めに合う道徳の規範をもっとはっきりさせたいし、それを実現するのに自分も関わりたい。社会の道徳を、信じるだけでなく実践したいのである。この入り組んだ状況のなかで、少なくとも一つは明らかになってきた。現代の道徳の理想が本当に社会の道徳なのだとすれば、それを望む人は、多くの人が善悪をめぐってどんな経験をしてきたかに触れなければ、社会のために行動するだけの動機を得られないということだ。
  translation_status: reviewed
- id: da-01-008
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '5'
    source_sequence: 15
    printed_page_end: '6'
  source_text: 'These men and women have realized this and have disclosed the fact in their eagerness for a wider acquaintance with and participation in the life about them. They believe that experience gives the easy and trustworthy impulse toward right action in the broad as well as in the narrow relations. We may indeed imagine many of them saying: "Cast our experiences in a larger mould if our lives are to be animated by the larger social aims. We have met the obligations of our family life, not because we had made resolutions to that end, but spontaneously, because of a common fund of memories and affections, from which the obligation naturally develops, and we see no other way in which to prepare ourselves for the larger social duties." Such a demand is reasonable, for by our daily experience we have discovered that we cannot mechanically hold up a moral standard, then jump at it in rare moments of exhilaration when we have the strength for it, but that even as the ideal itself must be a rational development of life, so the strength to attain it must be secured from interest in life itself. We slowly learn that life consists of processes as well as results, and that failure may come quite as easily from ignoring the adequacy of one''s method as from selfish or ignoble aims. We are thus brought to a conception of Democracy not merely as a sentiment which desires the well-being of all men, nor yet as a creed which believes in the essential dignity and equality of all men, but as that which affords a rule of living as well as a test of faith.'
  translation_ja: これに気づいた人々は、周囲の暮らしをもっと広く知り、そのなかに入りたいという熱意で、その自覚を示している。狭い付き合いのなかでも、もっと広い人間関係でも、経験こそが、進んで正しいことをするための確かなきっかけを与えてくれると、彼らは信じる。そのうちの多くが、こう言うところを想像してみてもよい。「もっと広い社会の目標を支えに生きるというなら、私たちの経験にももっと広い世界を与えてほしい。家族としての務めを果たしてきたのは、決意を固めたからではない。思い出と愛情を分かち合っていたから、そこから自然に務めを感じ、みずから果たしてきた。もっと広い社会への務めに備えるにも、ほかの道は考えられない。」それはもっともな願いである。日々の経験から私たちが知ったのは、機械的に道徳の基準を掲げ、まれに意気盛んで力の出るときだけ、それに向かって跳び上がっても、届くものではないということだ。理想そのものが生活から筋道立って育ってこなければならないように、そこに至る力もまた、生活そのものへの関心から得なければならない。暮らしには結果だけでなくそこへ至る過程もあり、目的が私利私欲に走ったり卑しかったりするときと同じように、手段がふさわしいかを顧みないことからも、失敗はたやすく生じる。それが少しずつ分かってくる。こうして民主主義を、すべての人の幸福を願う気持ちとしてだけでも、誰にも本来の尊厳があり互いに平等だと信じる信条としてだけでもなく、信念を試すとともに日々の生き方を導くものとして考えるようになる。
  translation_status: reviewed
- id: da-01-009
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '6'
    source_sequence: 16
    printed_page_end: '7'
  source_text: We are learning that a standard of social ethics is not attained by travelling a sequestered byway, but by mixing on the thronged and common road where all must turn out for one another, and at least see the size of one another's burdens. To follow the path of social morality results perforce in the temper if not the practice of the democratic spirit, for it implies that diversified human experience and resultant sympathy which are the foundation and guarantee of Democracy.
  translation_ja: 社会倫理の基準に達するには、人目につかない脇道を行くのではなく、大勢が行き交う表通りに出て、皆と交わる必要がある。そこでは誰もが互いに道を譲り、少なくとも相手がどれほど大きな荷を背負うかを目にする。社会の道徳をたどっていけば、民主主義を実践するに至らないまでも、自然とその精神を身につける。民主主義の土台となり、それを支えるのは、多様な人間の経験と、そこから生まれる共感だからである。
  translation_status: reviewed
- id: da-01-010
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '7'
    source_sequence: 17
  source_text: There are many indications that this conception of Democracy is growing among us. We have come to have an enormous interest in human life as such, accompanied by confidence in its essential soundness. We do not believe that genuine experience can lead us astray any more than scientific data can.
  translation_ja: このような民主主義の考えが私たちのあいだで広がっていることを示すしるしは多い。人間の暮らしそのものに、私たちは非常に大きな関心を持ち、その根本が健全であると信じるようになった。科学のデータと同じように、実際に経験したことは私たちを迷わせるまい、と考えている。
  translation_status: reviewed
- id: da-01-011
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '7'
    source_sequence: 18
    printed_page_end: '8'
  source_text: We realize, too, that social perspective and sanity of judgment come only from contact with social experience; that such contact is the surest corrective of opinions concerning the social order, and concerning efforts, however humble, for its improvement. Indeed, it is a consciousness of the illuminating and dynamic value of this wider and more thorough human experience which explains in no small degree that new curiosity regarding human life which has more of a moral basis than an intellectual one.
  translation_ja: 社会を見渡す視野と健全な判断力も、社会で人々が実際に経験していることに触れてこそ得られると、私たちは知っている。社会の仕組みや、それを少しでもよくしようとする取り組みについて、自分の見方を正してくれるのも、そうした接触にまさるものはない。人間の経験をもっと広く、深く知ると、物事がよく見え、動き出す力を得られる。そう分かってきたことが、人の暮らしへの新しい好奇心を大きく支えている。それは知識を得たいというより、道徳に根ざした好奇心だ。
  translation_status: reviewed
- id: da-01-012
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '8'
    source_sequence: 19
  source_text: The newspapers, in a frank reflection of popular demand, exhibit an omniverous curiosity equally insistent upon the trivial and the important. They are perhaps the most obvious manifestations of that desire to know, that "What is this?" and "Why do you do that?" of the child. The first dawn of the social consciousness takes this form, as the dawning intelligence of the child takes the form of constant question and insatiate curiosity.
  translation_ja: 新聞は、世の人々の求めを隠すことなく映して、なんにでも興味を示す。取るに足らないことにも、大事なことにも、同じしつこさで食い下がる。子どもの「これは何？」「なぜそんなことをするの？」にも似た、知りたいという気持ちが、最もはっきり現れるのは新聞かもしれない。子どもの知性の芽生えが、絶え間ない質問と飽くことのない好奇心に現れるように、社会に対する意識も、芽生えのうちはこういう形を取る。
  translation_status: reviewed
- id: da-01-013
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '8'
    source_sequence: 20
  source_text: Literature, too, portrays an equally absorbing though better adjusted desire to know all kinds of life. The popular books are the novels, dealing with life under all possible conditions, and they are widely read not only because they are entertaining, but also because they in a measure satisfy an unformulated belief that to see farther, to know all sorts of men, in an indefinite way, is a preparation for better social adjustment—for the remedying of social ills.
  translation_ja: 文学にも、あらゆる暮らしを知りたいという、同じように熱心で、しかもより的を射た欲求が現れている。人気があるのは、考えられるかぎりさまざまな境遇の人の生を描く小説である。広く読まれるのは面白いからだけではない。もっと遠くまで見通し、さまざまな人をおぼろげにでも知れば、社会のあり方を改め、社会の弊害を取り除く備えになる。まだ言葉になっていないこの信念を、小説はある程度満たすからである。
  translation_status: reviewed
- id: da-01-014
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '9'
    source_sequence: 21
  source_text: Doubtless one under the conviction of sin in regard to social ills finds a vague consolation in reading about the lives of the poor, and derives a sense of complicity in doing good. He likes to feel that he knows about social wrongs even if he does not remedy them, and in a very genuine sense there is a foundation for this belief.
  translation_ja: 社会の弊害を前に自分にも罪があると感じる人には、貧しい人々の暮らしを読むだけで、ぼんやりとした慰めが得られ、自分も何か善いことに加わった気がするのだろう。世の中の不正を正しはしなくても、自分は何が間違っているか知っていると思いたい。その気持ちにも、まったく根拠がないわけではない。
  translation_status: reviewed
- id: da-01-015
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '9'
    source_sequence: 22
    printed_page_end: '10'
  source_text: Partly through this wide reading of human life, we find in ourselves a new affinity for all men, which probably never existed in the world before. Evil itself does not shock us as it once did, and we count only that man merciful in whom we recognize an understanding of the criminal. We have learned as common knowledge that much of the insensibility and hardness of the world is due to the lack of imagination which prevents a realization of the experiences of other people. Already there is a conviction that we are under a moral obligation in choosing our experiences, since the result of those experiences must ultimately determine our understanding of life. We know instinctively that if we grow contemptuous of our fellows, and consciously limit our intercourse to certain kinds of people whom we have previously decided to respect, we not only tremendously circumscribe our range of life, but limit the scope of our ethics.
  translation_ja: こうしてさまざまな人の生き様を読むことも手伝って、私たちは、これまで世界になかったと思われるほど、あらゆる人に新たな親しみを覚えるようになった。悪そのものを目にしても、昔ほど衝撃を受けない。罪を犯した人を理解していると認められる人だけを、慈悲深いと見なす。世間の無神経さや冷たさの多くは、他人が何を経験したかを自分にも分かることとして思い描けないところからくる。私たちはそれを当たり前のこととして知るようになった。どんな経験をするかを選ぶときには道徳上の責任があるとも、すでに信じている。経験の積み重ねが最後には、人生をどう理解するかを決めるからだ。周りの人を見下すようになり、あらかじめ尊重すると決めた種類の人々に付き合いをわざと限るなら、暮らしの幅をひどく狭めるだけでなく、倫理が及ぶ範囲も限られる。そういうことは直感で分かる。
  translation_status: reviewed
- id: da-01-016
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '10'
    source_sequence: 23
    printed_page_end: '11'
  source_text: We can recall among the selfish people of our acquaintance at least one common characteristic,—the conviction that they are different from other men and women, that they need peculiar consideration because they are more sensitive or more refined. Such people "refuse to be bound by any relation save the personally luxurious ones of love and admiration, or the identity of political opinion, or religious creed." We have learned to recognize them as selfish, although we blame them not for the will which chooses to be selfish, but for a narrowness of interest which deliberately selects its experience within a limited sphere, and we say that they illustrate the danger of concentrating the mind on narrow and unprogressive issues.
  translation_ja: 私たちが知る利己的な人々には、少なくとも一つ共通点が思い浮かぶ。自分はほかの人とは違い、人より敏感か洗練されているから、特別に気を配ってもらう必要があると信じていることだ。こういう人は「愛してくれる、感心してくれる、政治的な意見か信仰が同じだといった、自分にとって心地よい関係を除けば、どんな関係にも縛られることを拒む」。私たちもこの人たちを利己的だと見抜くようになった。ただ責めるのは、利己的であることを選ぶ意志そのものではない。関心が狭く、自分の経験をわざわざ限られた範囲から選ぶということだ。こういう人を見ると、狭くて先に進めない問題に心を集中させる危うさがよく分かる。
  translation_status: reviewed
- id: da-01-017
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '11'
    source_sequence: 24
  source_text: We know, at last, that we can only discover truth by a rational and democratic interest in life, and to give truth complete social expression is the endeavor upon which we are entering. Thus the identification with the common lot which is the essential idea of Democracy becomes the source and expression of social ethics. It is as though we thirsted to drink at the great wells of human experience, because we knew that a daintier or less potent draught would not carry us to the end of the journey, going forward as we must in the heat and jostle of the crowd.
  translation_ja: 理にかなった、民主的な関心をもって人の暮らしに向き合うことでしか、私たちは真理を見いだせない。ようやくそれが分かった。そして真理を社会のなかで余すところなく形にするため、私たちは取り組み始めている。こうして、誰もが分かち合う境遇に自らを重ねるという、民主主義の根本の考えが、社会倫理の源であり、その表れとなる。いわば、人間の経験という大きな井戸の水を、のどの渇きから求めるようなものだ。ひしめき合う人いきれのなかを前に進まなくてはならない私たちには、もっと上品な飲み物や、力のつかない飲み物では、旅の終わりまでたどり着けないと分かっているからだ。
  translation_status: reviewed
- id: da-01-018
  section_id: ch-01
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '11'
    source_sequence: 25
    printed_page_end: '12'
  source_text: The six following chapters are studies of various types and groups who are being impelled by the newer conception of Democracy to an acceptance of social obligations involving in each instance a new line of conduct. No attempt is made to reach a conclusion, nor to offer advice beyond the assumption that the cure for the ills of Democracy is more Democracy, but the quite unlooked-for result of the studies would seem to indicate that while the strain and perplexity of the situation is felt most keenly by the educated and self-conscious members of the community, the tentative and actual attempts at adjustment are largely coming through those who are simpler and less analytical.
  translation_ja: 以下の六章では、新しい民主主義の考えに促されて社会への務めを引き受け、それぞれに新しい行い方を求められている、さまざまな人や集団を考察する。結論を出そうとはせず、助言といっても、民主主義の病を治すのはより多くの民主主義だという前提を超えて述べるつもりはない。ただ、こうした考察からは、思いもよらない結果がうかがえる。この事態の重圧と戸惑いをいちばん強く感じているのは、教育を受け、自らの立場を意識している人々だが、試行錯誤しながら実際に折り合いをつけようとしているのは、むしろ素朴で分析に長けているわけではない人々らしいのである。
  translation_status: reviewed
- id: da-02-000
  section_id: ch-02
  kind: heading
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '13'
    source_sequence: 26
    url: https://www.gutenberg.org/files/15487/15487-h/15487-h.htm#page_013
    anchor: page_013
  source_text: CHAPTER II. CHARITABLE EFFORT
  translation_ja: 第二章　慈善活動
  translation_status: reviewed
- id: da-02-001
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '13'
    source_sequence: 27
  source_text: All those hints and glimpses of a larger and more satisfying democracy, which literature and our own hopes supply, have a tendency to slip away from us and to leave us sadly unguided and perplexed when we attempt to act upon them.
  translation_ja: 文学や私たち自身の希望は、もっと広く行き渡り、もっと納得のいく民主主義を、ちらりと見せてくれる。ところが、それを頼りにいざ行動しようとすると、こうした手がかりはすり抜けていき、私たちは道しるべもなく、途方に暮れがちだ。
  translation_status: reviewed
- id: da-02-002
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '13'
    source_sequence: 28
  source_text: Our conceptions of morality, as all our other ideas, pass through a course of development; the difficulty comes in adjusting our conduct, which has become hardened into customs and habits, to these changing moral conceptions. When this adjustment is not made, we suffer from the strain and indecision of believing one hypothesis and acting upon another.
  translation_ja: 道徳についての考えも、ほかの考えと同じく、だんだん変わっていく。難しいのは、習慣や慣行となって固まってしまった行いを、変わりつつある道徳観に合わせることだ。それができなければ、一つの考えを信じながら、もう一つの考えに従って行動することになり、気持ちは張りつめ、決断もできなくなる。
  translation_status: reviewed
- id: da-02-003
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '13'
    source_sequence: 29
    printed_page_end: '14'
  source_text: Probably there is no relation in life which our democracy is changing more rapidly than the charitable relation—that relation which obtains between benefactor and beneficiary; at the same time there is no point of contact in our modern experience which reveals so clearly the lack of that equality which democracy implies. We have reached the moment when democracy has made such inroads upon this relationship, that the complacency of the old-fashioned charitable man is gone forever; while, at the same time, the very need and existence of charity, denies us the consolation and freedom which democracy will at last give.
  translation_ja: 民主主義によってこれほど急速に変わりつつある人間関係は、おそらく慈善における関係、援助する側と援助を受ける側との関係のほかにはない。同時に、民主主義が当然の前提とする平等が欠けていることを、これほどはっきりと見せる人と人との接点も、今日の私たちにはない。民主主義がこの関係を変えるところまで来たので、昔風の慈善家が抱いた自己満足はもはや戻らない。その一方、慈善が現に存在し、しかも必要だということ自体が、民主主義がいつかもたらす安らぎと自由を、まだ私たちから遠ざけている。
  translation_status: reviewed
- id: da-02-004
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '14'
    source_sequence: 30
    printed_page_end: '16'
  source_text: It is quite obvious that the ethics of none of us are clearly defined, and we are continually obliged to act in circles of habit, based upon convictions which we no longer hold. Thus our estimate of the effect of environment and social conditions has doubtless shifted faster than our methods of administrating charity have changed. Formerly when it was believed that poverty was synonymous with vice and laziness, and that the prosperous man was the righteous man, charity was administered harshly with a good conscience; for the charitable agent really blamed the individual for his poverty, and the very fact of his own superior prosperity gave him a certain consciousness of superior morality. We have learned since that time to measure by other standards, and have ceased to accord to the money-earning capacity exclusive respect; while it is still rewarded out of all proportion to any other, its possession is by no means assumed to imply the possession of the highest moral qualities. We have learned to judge men by their social virtues as well as by their business capacity, by their devotion to intellectual and disinterested aims, and by their public spirit, and we naturally resent being obliged to judge poor people so solely upon the industrial side. Our democratic instinct instantly takes alarm. It is largely in this modern tendency to judge all men by one democratic standard, while the old charitable attitude commonly allowed the use of two standards, that much of the difficulty adheres. We know that unceasing bodily toil becomes wearing and brutalizing, and our position is totally untenable if we judge large numbers of our fellows solely upon their success in maintaining it.
  translation_ja: 私たちの誰も、自分の倫理をはっきりと定めてはおらず、もう信じていない考えが形づくった習慣の輪のなかで、行動せざるをえないことが絶えずあるのは明らかだ。たとえば、環境や社会の条件が及ぼす影響への見方は、慈善の制度や実務より、たしかに早く変わった。かつては貧困は悪徳や怠惰と同じで、裕福な者は正しく生きていると信じられた。そのころは良心のとがめもなく、厳しい慈善が行われた。慈善の担当者は、その人が貧しいのは本当にその人のせいだと考え、自分のほうが裕福だという事実だけで、道徳でも自分がいくらか優れていると思ったのである。それ以来、私たちは違う基準でも人を測ることを覚え、金を稼ぐ能力だけを尊重するのをやめた。それはいまもほかのどんな能力よりも不釣り合いに大きく報いられるが、その能力があるから最も高い徳も備えているとは、もう考えられていない。商売の腕だけでなく、社会に対する徳、知的な目的や自分の得にならない目的に尽くすこと、公共のために動く心でも人を判断するようになったから、貧しい人だけを、仕事や稼ぎの面だけで判断しなければならないことには、当然抵抗を覚える。民主主義の感覚が、ただちに何かおかしいと告げるのだ。昔の慈善では二重の物差しを使うのがふつうだったのに、今日では誰もを一つの民主的な物差しで測ろうとする。難しさの多くはそこにある。休む間もなく体を酷使すれば、人はすり減り、人間らしさを失っていくと知りながら、仲間の多くを、そうした労働をうまく続けられるかどうかだけで判断するなら、私たちの立場はまったく成り立たない。
  translation_status: reviewed
- id: da-02-005
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '16'
    source_sequence: 31
  source_text: The daintily clad charitable visitor who steps into the little house made untidy by the vigorous efforts of her hostess, the washerwoman, is no longer sure of her superiority to the latter; she recognizes that her hostess after all represents social value and industrial use, as over against her own parasitic cleanliness and a social standing attained only through status.
  translation_ja: きれいな服を着た慈善の訪問員が、家の主である洗濯女が懸命に働くうちに取り散らかった小さな家に足を踏み入れる。訪問員は、もう自分が相手より優れているという自信を持てない。人の仕事に頼って身ぎれいにし、生まれや身分のおかげで社会的な地位を得ているにすぎない自分とは反対に、この家の主婦は、実際に社会にとって価値ある仕事をし、人の暮らしに役立っていると認めるのだ。
  translation_status: reviewed
- id: da-02-006
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '16'
    source_sequence: 32
    printed_page_end: '18'
  source_text: The only families who apply for aid to the charitable agencies are those who have come to grief on the industrial side; it may be through sickness, through loss of work, or for other guiltless and inevitable reasons; but the fact remains that they are industrially ailing, and must be bolstered and helped into industrial health. The charity visitor, let us assume, is a young college woman, well-bred and open-minded; when she visits the family assigned to her, she is often embarrassed to find herself obliged to lay all the stress of her teaching and advice upon the industrial virtues, and to treat the members of the family almost exclusively as factors in the industrial system. She insists that they must work and be self-supporting, that the most dangerous of all situations is idleness, that seeking one's own pleasure, while ignoring claims and responsibilities, is the most ignoble of actions. The members of her assigned family may have other charms and virtues—they may possibly be kind and considerate of each other, generous to their friends, but it is her business to stick to the industrial side. As she daily holds up these standards, it often occurs to the mind of the sensitive visitor, whose conscience has been made tender by much talk of brotherhood and equality, that she has no right to say these things; that her untrained hands are no more fitted to cope with actual conditions than those of her broken-down family.
  translation_ja: 慈善団体に援助を求めるのは、働いて暮らしを立てるところでつまずいた家族だけである。病気や失業のためかもしれないし、本人の落ち度ではない、ほかの避けようのない理由があるかもしれない。それでも、仕事と暮らしの具合が悪くなっており、支えて、ふたたび働いて生活できるよう助ける必要があるのは事実だ。慈善の訪問員が、しつけのよい、偏見のない、大学を出た若い女性だとしよう。担当の家族を訪ねると、教えや助言のすべてを働くうえでの徳に集中させ、その家の人を、ほとんど働く仕組みの一要素としてだけ扱わざるをえないことに、しばしば当惑する。働いて自分の暮らしを立てなければならない、何もしないのが何より危険だ、自分が負う務めや責任をよそに楽しみばかり求めるのが最も卑しい行いだ、と彼女は説く。担当の家族には、ほかの魅力や徳もあるだろう。互いに親切で思いやりがあり、友人に気前がよいかもしれない。だが彼女の役目は、仕事と暮らしのことに徹することだ。日々この物差しを持ち出しているうちに、同胞としての連帯や平等について多くを聞き、良心を鋭くしてきたこの訪問員は、しばしば考える。自分にこんなことを言う資格はないのではないか。実情に向き合うには、何も身につけていない自分の手も、暮らしの立ち行かなくなったこの家族の手も、変わらず頼りないのではないか、と。
  translation_status: reviewed
- id: da-02-007
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '18'
    source_sequence: 33
  source_text: The grandmother of the charity visitor could have done the industrial preaching very well, because she did have the industrial virtues and housewifely training. In a generation our experiences have changed, and our views with them; but we still keep on in the old methods, which could be applied when our consciences were in line with them, but which are daily becoming more difficult as we divide up into people who work with their hands and those who do not. The charity visitor belonging to the latter class is perplexed by recognitions and suggestions which the situation forces upon her. Our democracy has taught us to apply our moral teaching all around, and the moralist is rapidly becoming so sensitive that when his life does not exemplify his ethical convictions, he finds it difficult to preach.
  translation_ja: 訪問員の祖母なら、働くことの大切さをうまく説けただろう。自分自身が働くうえでの徳を備え、家事の手ほどきも受けていたからだ。一世代のあいだに私たちの経験は変わり、それとともに見方も変わった。だがやり方だけは、昔のままである。私たちの良心とそのやり方が一致していたころならできたが、手を動かして働く人とそうでない人に分かれていくにつれ、日に日に難しくなる。後者に属する慈善の訪問員は、この状況からどうしても認めざるをえないこと、考えずにいられないことのために戸惑う。民主主義は、道徳を説くなら誰にでも同じように当てはめることを、私たちに教えた。道徳を説く人はいまや、自分の暮らしが自分の説く倫理の手本にならないときには、人に説くのが難しいと感じるほど、急速に敏感になっている。
  translation_status: reviewed
- id: da-02-008
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '18'
    source_sequence: 34
    printed_page_end: '19'
  source_text: Added to this is a consciousness, in the mind of the visitor, of a genuine misunderstanding of her motives by the recipients of her charity, and by their neighbors. Let us take a neighborhood of poor people, and test their ethical standards by those of the charity visitor, who comes with the best desire in the world to help them out of their distress. A most striking incongruity, at once apparent, is the difference between the emotional kindness with which relief is given by one poor neighbor to another poor neighbor, and the guarded care with which relief is given by a charity visitor to a charity recipient. The neighborhood mind is at once confronted not only by the difference of method, but by an absolute clashing of two ethical standards.
  translation_ja: それに加えて訪問員は、援助を受ける人やその隣人が、自分の動機を本当には理解していないことにも気づく。貧しい人々の住む一角を取り上げ、苦境から救いたいと心から願って訪れる慈善の訪問員の基準に照らし、その人々の倫理の基準を比べてみよう。すぐに目に留まるひどい食い違いは、貧しい隣人が貧しい隣人を助けるときの情にあふれた親切と、訪問員が援助を受ける人に手を差し伸べるときの用心深さの違いである。近所の人々がただちに直面するのは、方法の違いだけではない。二つの倫理の基準の、まっこうからの衝突である。
  translation_status: reviewed
- id: da-02-009
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '19'
    source_sequence: 35
    printed_page_end: '22'
  source_text: A very little familiarity with the poor districts of any city is sufficient to show how primitive and genuine are the neighborly relations. There is the greatest willingness to lend or borrow anything, and all the residents of the given tenement know the most intimate family affairs of all the others. The fact that the economic condition of all alike is on a most precarious level makes the ready outflow of sympathy and material assistance the most natural thing in the world. There are numberless instances of self-sacrifice quite unknown in the circles where greater economic advantages make that kind of intimate knowledge of one's neighbors impossible. An Irish family in which the man has lost his place, and the woman is struggling to eke out the scanty savings by day's work, will take in the widow and her five children who have been turned into the street, without a moment's reflection upon the physical discomforts involved. The most maligned landlady who lives in the house with her tenants is usually ready to lend a scuttle full of coal to one of them who may be out of work, or to share her supper. A woman for whom the writer had long tried in vain to find work failed to appear at the appointed time when employment was secured at last. Upon investigation it transpired that a neighbor further down the street was taken ill, that the children ran for the family friend, who went of course, saying simply when reasons for her non-appearance were demanded, "It broke me heart to leave the place, but what could I do?" A woman whose husband was sent up to the city prison for the maximum term, just three months, before the birth of her child found herself penniless at the end of that time, having gradually sold her supply of household furniture. She took refuge with a friend whom she supposed to be living in three rooms in another part of town. When she arrived, however, she discovered that her friend's husband had been out of work so long that they had been reduced to living in one room. The friend, however, took her in, and the friend's husband was obliged to sleep upon a bench in the park every night for a week, which he did uncomplainingly if not cheerfully. Fortunately it was summer, "and it only rained one night." The writer could not discover from the young mother that she had any special claim upon the "friend" beyond the fact that they had formerly
    worked together in the same factory. The husband she had never seen until the night of her arrival, when he at once went forth in search of a midwife who would consent to come upon his promise of future payment.
  translation_ja: どこの町でも、貧しい地区を少し知るだけで、隣近所の付き合いがどれほど素朴で、掛け値のないものか分かる。何であれ気軽に貸し借りし、同じ長屋に住む者は、ほかの家のごく内輪のことまでみな心得ている。誰もが同じように、明日の暮らしも分からない経済状態にあるから、思いやりがすぐに湧いて、持ち物を分け合うのは、ごく自然なことだ。金銭にもう少し恵まれ、そのため、隣人をこれほど親しく知りようのない人々のあいだでは、まるで知られていない自己犠牲の例が、数え切れないほどある。夫が職を失い、妻が日雇い仕事でわずかな貯えを補おうと苦労するアイルランド人一家が、住まいから通りに追い出された寡婦とその五人の子を、どれほど窮屈になるかなど一瞬も考えずに引き取る。借り手と同じ建物に住む、評判のいちばん悪い家主の女でさえ、失業した借り手がいれば、石炭をバケツ一杯貸したり、夕食を分けたりするのはふつうだ。私が長いあいだ仕事を探しても見つけてやれなかった女性がいる。ようやく仕事が得られたのに、約束の時刻に現れなかった。尋ねてみると、通りの少し先に住む隣人が病に倒れ、その子どもたちが、家族ぐるみで付き合っている彼女を呼びに走ったのだという。もちろん彼女は行った。なぜ約束の場所に来なかったのかと詰められると、こう答えるだけだった。「せっかくの口を逃すのは、胸が張り裂けそうだったよ。でも、ほかにどうできたっていうんだい。」ある女性の夫は、子どもが生まれる三か月前に、市の監獄へ送られた。刑期は最長の三か月だった。刑期の終わるころには、家具を少しずつ売り、女は一文なしになっていた。町の別の一角に三部屋ある住まいで暮らしていると思っていた友人のところへ、身を寄せようとした。だが着いてみると、友人の夫は長いこと失業しており、二人は一部屋に暮らすところまで切り詰めていた。それでも友人は彼女を家に入れ、夫は一週間、毎晩公園のベンチで寝なければならなかった。喜んでとまではいかないにせよ、一言も不平を言わなかった。幸い夏で、「雨が降ったのは一晩だけだった」。若い母親の話からは、昔同じ工場で働いたことのほかに、その「友人」が特別世話をしなければならない理由は、見つからなかった。友人の夫とは、その晩着くまで会ったこともなかった。その人はすぐに出かけ、いずれ支払うという約束で引き受けてくれる産婆を探してくれた。
  translation_status: reviewed
- id: da-02-010
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '22'
    source_sequence: 36
    printed_page_end: '23'
  source_text: The evolutionists tell us that the instinct to pity, the impulse to aid his fellows, served man at a very early period, as a rude rule of right and wrong. There is no doubt that this rude rule still holds among many people with whom charitable agencies are brought into contact, and that their ideas of right and wrong are quite honestly outraged by the methods of these agencies. When they see the delay and caution with which relief is given, it does not appear to them a conscientious scruple, but as the cold and calculating action of a selfish man. It is not the aid that they are accustomed to receive from their neighbors, and they do not understand why the impulse which drives people to "be good to the poor" should be so severely supervised. They feel, remotely, that the charity visitor is moved by motives that are alien and unreal. They may be superior motives, but they are different, and they are "agin nature." They cannot comprehend why a person whose intellectual perceptions are stronger than his natural impulses, should go into charity work at all. The only man they are accustomed to see whose intellectual perceptions are stronger than his tenderness of heart, is the selfish and avaricious man who is frankly "on the make." If the charity visitor is such a person, why does she pretend to like the poor? Why does she not go into business at once?
  translation_ja: 進化論者によると、憐れみの本能や、仲間を助けようとする衝動は、ごく初めのころの人間にとって、素朴な善悪の物差しだった。慈善団体が接する人々の多くには、今もこの素朴な物差しが通用している。そしてその人たちの善悪の感覚は、慈善団体のやり方を見て、偽りなく憤る。援助が用心深く、なかなか渡されないのを見ても、良心に照らして慎重にしているようには見えない。身勝手な人が冷たく計算しているように見える。隣人から受け慣れた援助とは違うため、「貧しい人に親切にしたい」と駆り立てる衝動が、どうしてこうも厳しく監督されなければならないか分からない。訪問員を動かすのは、彼らにとってなじみも実感もない動機なのだと、ぼんやり感じとる。それは、もっと立派な動機かもしれない。でも違っているし、「人情に合わねえ」。頭で考えることが自然な衝動より先に立つ人間が、そもそも、どうして慈善などするのか分からない。胸の内の優しさよりも頭で考えることが先に立つ人といえば、彼らがいつも見ているのは、隠しもせず「ひともうけ」を狙う、身勝手で欲深い者だけだ。慈善の訪問員もそういう人なら、どうして貧しい者が好きなふりをするのだろう。はじめから商売をやればいいではないか。
  translation_status: reviewed
- id: da-02-011
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '23'
    source_sequence: 37
    printed_page_end: '25'
  source_text: 'We may say, of course, that it is a primitive view of life, which thus confuses intellectuality and business ability; but it is a view quite honestly held by many poor people who are obliged to receive charity from time to time. In moments of indignation the poor have been known to say: "What do you want, anyway? If you have nothing to give us, why not let us alone and stop your questionings and investigations?" "They investigated me for three weeks, and in the end gave me nothing but a black character," a little woman has been heard to assert. This indignation, which is for the most part taciturn, and a certain kindly contempt for her abilities, often puzzles the charity visitor. The latter may be explained by the standard of worldly success which the visited families hold. Success does not ordinarily go, in the minds of the poor, with charity and kind-heartedness, but rather with the opposite qualities. The rich landlord is he who collects with sternness, who accepts no excuse, and will have his own. There are moments of irritation and of real bitterness against him, but there is still admiration, because he is rich and successful. The good-natured landlord, he who pities and spares his poverty-pressed tenants, is seldom rich. He often lives in the back of his house, which he has owned for a long time, perhaps has inherited; but he has been able to accumulate little. He commands the genuine love and devotion of many a poor soul, but he is treated with a certain lack of respect. In one sense he is a failure. The charity visitor, just because she is a person who concerns herself with the poor, receives a certain amount of this good-natured and kindly contempt, sometimes real affection, but little genuine respect. The poor are accustomed to help each other and to respond according to their kindliness; but when it comes to worldly judgment, they use industrial success as the sole standard. In the case of the charity visitor who has neither natural kindness nor dazzling riches, they are deprived of both standards, and they find it of course utterly impossible to judge of the motive of organized charity.'
  translation_ja: 知性と商売の腕を取り違えるこんな考えは、もちろん、素朴な人生観だと言ってもよい。しかし、折々になんらかの慈善に頼らざるをえない貧しい人々の多くが、本気でそう考えている。腹を立てたとき、貧しい人はこう言ったことがある。「いったい何が欲しくて来るの。くれるものが何もないなら、放っておいてくれないか。質問したり調べたりするのはもうたくさんだよ。」「三週間も私のことを調べて、結局くださったのは悪い評判だけですよ」と言った小柄な女性もいる。たいていは口に出されないこの憤りや、訪問員の能力に対する、悪気のないいくらかの軽蔑を見て、訪問員はしばしば首をかしげる。後者は、訪問を受ける家族が世の中での成功をどう測るかを見れば、分かるかもしれない。貧しい人にとって、成功はふつう、慈善や心の優しさではなく、むしろその反対の性質と結びつく。金持ちの家主は、厳しく家賃を取り立て、言い訳を聞かず、自分の取り分を取りはぐれない。苛立ち、心底苦々しく思うときがあっても、金持ちで成功した人だから、やはり感心する。貧しさに苦しむ借り手を憐れみ、払えないときは大目に見る人のよい家主は、めったに金持ちにならない。長年持っている、あるいは相続したかもしれない家の奥に住んでいることが多いが、蓄えはわずかである。貧しい多くの人が心から慕い、尽くすが、どこか一目は置かれない。ある意味では、うまくやっていない人なのだ。慈善の訪問員は、貧しい人を気にかけるというまさにその理由で、この悪気も敵意もない軽蔑をいくらか受ける。本当に好かれるときもあるが、心から尊敬されることはまずない。貧しい人々は助け合い、それぞれの優しさに応じて力を貸し合うのに慣れている。だが世の中でうまくやっているかを判断するときの物差しは、仕事での成功だけである。自然な優しさも、目がくらむような富も見せない慈善の訪問員を前にすると、どちらの物差しも使えない。組織だった慈善が何のために行われているのか、彼らに見当がつかないのも当然である。
  translation_status: reviewed
- id: da-02-012
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '25'
    source_sequence: 38
    printed_page_end: '26'
  source_text: Even those of us who feel most sorely the need of more order in altruistic effort and see the end to be desired, find something distasteful in the juxtaposition of the words "organized" and "charity." We say in defence that we are striving to turn this emotion into a motive, that pity is capricious, and not to be depended on; that we mean to give it the dignity of conscious duty. But at bottom we distrust a little a scheme which substitutes a theory of social conduct for the natural promptings of the heart, even although we appreciate the complexity of the situation. The poor man who has fallen into distress, when he first asks aid, instinctively expects tenderness, consideration, and forgiveness. If it is the first time, it has taken him long to make up his mind to take the step. He comes somewhat bruised and battered, and instead of being met with warmth of heart and sympathy, he is at once chilled by an investigation and an intimation that he ought to work. He does not recognize the disciplinary aspect of the situation.
  translation_ja: 他人を助ける仕事にはもっと秩序が要ると痛感し、目指すところも分かっている私たちでさえ、「組織」と「慈善」という言葉が並ぶと、どこか気持ちが引っかかる。弁護して言うには、この感情を行動の動機に変えようとしているのだ、憐れみは気まぐれで当てにならない、だから自覚して負う務めとしての重みを持たせたいのだ、と。だが、事情が込み入っているとよく分かっていても、心から自然にわき起こる気持ちを、社会でどう行動すべきかという理屈に置き換える仕組みには、心の底でいくらか不信がある。困窮した貧しい人は、初めて助けを求めるとき、優しく扱われ、事情を汲まれ、許されることを本能的に期待する。初めてなら、踏み切るまでに長いこと迷ったはずだ。あちこち傷ついた思いで訪れるのに、温かさや共感に迎えられるどころか、すぐに身辺を調べられ、働くべきだとほのめかされて、気持ちが冷えてしまう。相手がそこに本人を律し鍛える機会を見ているとは、気づかない。
  translation_status: reviewed
- id: da-02-013
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '26'
    source_sequence: 39
  source_text: The only really popular charity is that of the visiting nurses, who by virtue of their professional training render services which may easily be interpreted into sympathy and kindness, ministering as they do to obvious needs which do not require investigation.
  translation_ja: 本当に歓迎される慈善は、訪問看護師の活動だけである。専門の訓練を受けた看護師は、調べるまでもなく明らかな必要に応じるため、看護師のすることは、共感や親切の表れとして無理なく理解される。
  translation_status: reviewed
- id: da-02-014
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '27'
    source_sequence: 40
  source_text: The state of mind which an investigation arouses on both sides is most unfortunate; but the perplexity and clashing of different standards, with the consequent misunderstandings, are not so bad as the moral deterioration which is almost sure to follow.
  translation_ja: 身辺を調べることは、調べる側にも調べられる側にも、好ましくない心の状態を引き起こす。だが、違う基準がぶつかり合って戸惑い、互いを誤解することより悪いのは、ほぼ間違いなくそのあとに起こる、道徳上の悪化である。
  translation_status: reviewed
- id: da-02-015
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '27'
    source_sequence: 41
    printed_page_end: '28'
  source_text: 'When the agent or visitor appears among the poor, and they discover that under certain conditions food and rent and medical aid are dispensed from some unknown source, every man, woman, and child is quick to learn what the conditions may be, and to follow them. Though in their eyes a glass of beer is quite right and proper when taken as any self-respecting man should take it; though they know that cleanliness is an expensive virtue which can be required of few; though they realize that saving is well-nigh impossible when but a few cents can be laid by at a time; though their feeling for the church may be something quite elusive of definition and quite apart from daily living: to the visitor they gravely laud temperance and cleanliness and thrift and religious observance. The deception in the first instances arises from a wondering inability to understand the ethical ideals which can require such impossible virtues, and from an innocent desire to please. It is easy to trace the development of the mental suggestions thus received. When A discovers that B, who is very little worse off than he, receives good things from an inexhaustible supply intended for the poor at large, he feels that he too has a claim for his share, and step by step there is developed the competitive spirit which so horrifies charity visitors when it shows itself in a tendency to "work" the relief-giving agencies.'
  translation_ja: 慈善団体の職員や訪問員が貧しい人たちのあいだに現れ、ある条件を満たせば、どこからともなく食料、家賃、医療が助けとして出てくると分かる。すると、男も女も子どもも、すぐに条件を探って、それに合わせる。節度のある人らしい飲み方をするなら、ビール一杯は何も悪くない、と彼らは思っている。身ぎれいにするのには金がかかり、そんな徳を求められる人は少ないと知っている。一度に数セントしか取っておけないのに貯金はほとんど無理だと分かっている。教会への気持ちは、言葉にしにくく、日々の暮らしとはまったく別のものかもしれない。それでも訪問員には、節酒も清潔も倹約も信仰上の務めを守ることも、真顔で称賛してみせる。初めにそうやって取り繕うのは、こんな無理な徳を求める倫理の理想がさっぱり分からず、ただ無邪気に相手の気に入られたいからである。こうして芽を植えつけられた考えがどう育つかをたどるのは、たやすい。たとえばAは、自分と困り具合がほとんど変わらないBが、貧しい人全体のための尽きそうにない蓄えから、役立つものをもらったと知る。自分にも取り分があると感じ、こうして一歩ずつ張り合う気持ちが強くなる。助けを出す団体を「うまく使ってやろう」とする形でそれが現れると、訪問員たちはひどく眉をひそめる。
  translation_status: reviewed
- id: da-02-016
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '28'
    source_sequence: 42
    printed_page_end: '29'
  source_text: The most serious effect upon the poor comes when dependence upon the charitable society is substituted for the natural outgoing of human love and sympathy, which, happily, we all possess in some degree. The spontaneous impulse to sit up all night with the neighbor's sick child is turned into righteous indignation against the district nurse, because she goes home at six o'clock, and doesn't do it herself. Or the kindness which would have prompted the quick purchase of much needed medicine is transformed into a voluble scoring of the dispensary, because it gives prescriptions and not drugs; and "who can get well on a piece of paper?"
  translation_ja: 貧しい人たちへの影響が最も深刻になるのは、幸い誰のなかにもある人への愛や共感が自然にあふれ出す代わりに、慈善団体に頼るようになるときだ。隣家の病気の子に一晩中ついていようという、とっさの気持ちは、地区の看護師が自分でそうせず、六時には帰宅することへの、正義感からの憤りに変わる。また、すぐにも要る薬を買ってあげようという親切は、診療所が処方箋だけ出して薬を渡さないことへの、まくし立てる非難に変わる。「紙っぺら一枚で、誰の病気が治るっていうの？」
  translation_status: reviewed
- id: da-02-017
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '29'
    source_sequence: 43
    printed_page_end: '30'
  source_text: If a poor woman knows that her neighbor next door has no shoes, she is quite willing to lend her own, that her neighbor may go decently to mass, or to work; for she knows the smallest item about the scanty wardrobe, and cheerfully helps out. When the charity visitor comes in, all the neighbors are baffled as to what her circumstances may be. They know she does not need a new pair of shoes, and rather suspect that she has a dozen pairs at home; which, indeed, she sometimes has. They imagine untold stores which they may call upon, and her most generous gift is considered niggardly, compared with what she might do. She ought to get new shoes for the family all round, "she sees well enough that they need them." It is no more than the neighbor herself would do, has practically done, when she lent her own shoes. The charity visitor has broken through the natural rule of giving, which, in a primitive society, is bounded only by the need of the recipient and the resources of the giver; and she gets herself into untold trouble when she is judged by the ethics of that primitive society.
  translation_ja: 貧しい女性が、隣の女性には靴がないと知っていれば、ミサなり仕事なりにきちんと出られるよう、喜んで自分の靴を貸す。わずかな着替えの一枚一枚まで知っているから、進んで助けるのである。慈善の訪問員が来ると、周りの人々には、彼女がどんな暮らしをしているのか、さっぱり分からない。新しい靴など要らないことは分かるし、家には十二足もあるのではないかと思う。実際、それほど持っている場合もある。頼めば使わせてもらえる品が山のようにあると思い描くので、彼女がこのうえなく気前よく何かを贈っても、その力を思えば、けちだと考える。「靴が必要なのは、見れば十分分かるはずだ」と、一家全員に新しい靴をあてがうべきだと考える。隣の女性ならそうするだろうし、実際手持ちの靴を貸したときに、それと同じことをしている。素朴な社会では、贈ることに限度を設けるのは、受け取る人の必要と、与える人が持っているものだけである。慈善の訪問員はこの自然な決まりから外れてしまったため、その社会の倫理で測られると、数え切れないほどの面倒に巻き込まれる。
  translation_status: reviewed
- id: da-02-018
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '30'
    source_sequence: 44
  source_text: The neighborhood understands the selfish rich people who stay in their own part of town, where all their associates have shoes and other things. Such people don't bother themselves about the poor; they are like the rich landlords of the neighborhood experience. But this lady visitor, who pretends to be good to the poor, and certainly does talk as though she were kind-hearted, what does she come for, if she does not intend to give them things which are so plainly needed?
  translation_ja: 近所の人には、自分たちの住む町の一角にとどまり、まわりにも靴やほかの品を持っている人しかいない、利己的な金持ちのことならよく分かる。こういう人は貧しい人を気にかけもしない。彼らがよく知る金持ちの家主と同じだ。だがこの訪問員のご婦人は、貧しい人に親切にするふりをし、口ぶりはたしかに思いやりがありそうだ。こんなにはっきり要ると分かるものをくれるつもりがないのなら、何をしに来るのだろう。
  translation_status: reviewed
- id: da-02-019
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '30'
    source_sequence: 45
    printed_page_end: '31'
  source_text: The visitor says, sometimes, that in holding her poor family so hard to a standard of thrift she is really breaking down a rule of higher living which they formerly possessed; that saving, which seems quite commendable in a comfortable part of town, appears almost criminal in a poorer quarter where the next-door neighbor needs food, even if the children of the family do not.
  translation_ja: 貧しい担当の家族に倹約の基準をあまりにも厳しく守らせることで、かえって、その人たちが前から守っていた、より気高く生きるための決まりを壊しているのだ、と訪問員は時に言う。暮らしにゆとりのある地区なら貯金は褒められて当然と思えるが、もっと貧しい一角では、わが子は食べ物に困っていなくても、すぐ隣の家に食べ物が要るときに貯め込むのは、ほとんど罪に見えるのである。
  translation_status: reviewed
- id: da-02-020
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '31'
    source_sequence: 46
    printed_page_end: '32'
  source_text: She feels the sordidness of constantly being obliged to urge the industrial view of life. The benevolent individual of fifty years ago honestly believed that industry and self-denial in youth would result in comfortable possessions for old age. It was, indeed, the method he had practised in his own youth, and by which he had probably obtained whatever fortune he possessed. He therefore reproved the poor family for indulging their children, urged them to work long hours, and was utterly untouched by many scruples which afflict the contemporary charity visitor. She says sometimes, "Why must I talk always of getting work and saving money, the things I know nothing about? If it were anything else I had to urge, I could do it; anything like Latin prose, which I had worried through myself, it would not be so hard." But she finds it difficult to connect the experiences of her youth with the experiences of the visited family.
  translation_ja: 働いて稼ぐという見方から始終人生を説かなくてはならないことを、彼女はさもしいと感じる。五十年前の慈善家は、若いうちに勤勉に働き、欲しいものを我慢すれば、老後に不自由のない財産が得られると本気で信じた。実際にそれは若いころの自分自身が用いた方法で、おそらく、あるだけの財産を築けたのも、そのおかげだった。それゆえ、貧しい家が子どもを甘やかすのをたしなめ、長い時間働くよう勧め、今日の慈善訪問員が悩む数々のためらいなど、これっぽっちも感じなかった。今日の訪問員は、時にこう言う。「どうして、仕事を見つけなさい、お金を貯めなさいと、何も知らないことばかり話さなくちゃいけないの。別のことを勧めるなら、私にもできる。たとえば自分で苦労して身につけたラテン語の散文だったら、それほど難しくないのに。」だが自分の若いころの経験は、訪問する家族の経験とはつながりにくいのである。
  translation_status: reviewed
- id: da-02-021
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '32'
    source_sequence: 47
  source_text: Because of this diversity in experience, the visitor is continually surprised to find that the safest platitude may be challenged. She refers quite naturally to the "horrors of the saloon," and discovers that the head of her visited family does not connect them with "horrors" at all. He remembers all the kindnesses he has received there, the free lunch and treating which goes on, even when a man is out of work and not able to pay up; the loan of five dollars he got there when the charity visitor was miles away and he was threatened with eviction. He may listen politely to her reference to "horrors," but considers it only "temperance talk."
  translation_ja: 経験がこれほど違うものだから、訪問員は誰もが認めるはずの決まり文句にさえ、異議を唱えられては驚く。たとえば当たり前のように「酒場の恐ろしさ」を口にすると、訪ねた家の主人は、酒場と「恐ろしさ」をまるで結びつけていないと分かる。そこで受けた親切を、あれこれ思い出すのだ。仕事がなく、勘定を払えない者にも、昼食はただで出て、酒もおごってもらえる。家を追い出されそうになったとき、慈善の訪問員は何マイルも離れたところにいたが、酒場では五ドル貸してもらった。「恐ろしさ」と言われて、失礼のないように耳を傾けても、「禁酒運動の決まり文句」としか思わない。
  translation_status: reviewed
- id: da-02-022
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '32'
    source_sequence: 48
    printed_page_end: '34'
  source_text: The charity visitor may blame the women for lack of gentleness toward their children, for being hasty and rude to them, until she learns that the standard of breeding is not that of gentleness toward the children so much as the observance of certain conventions, such as the punctilious wearing of mourning garments after the death of a child. The standard of gentleness each mother has to work out largely by herself, assisted only by the occasional shame-faced remark of a neighbor, "That they do better when you are not too hard on them"; but the wearing of mourning garments is sustained by the definitely expressed sentiment of every woman in the street. The mother would have to bear social blame, a certain social ostracism, if she failed to comply with that requirement. It is not comfortable to outrage the conventions of those among whom we live, and, if our social life be a narrow one, it is still more difficult. The visitor may choke a little when she sees the lessened supply of food and the scanty clothing provided for the remaining children in order that one may be conventionally mourned, but she doesn't talk so strongly against it as she would have done during her first month of experience with the family since bereaved.
  translation_ja: 慈善の訪問員は、母親たちが子どもに優しくなく、せっかちで乱暴に接すると責めるかもしれない。だが、行儀がよいとされる基準は、子どもに優しくすることより、子どもが亡くなったらきちんと喪服を着るといった、決まったしきたりを守ることだと、やがて分かる。どのくらい優しくするかは、母親がほとんど自分で見きわめるしかない。時おり隣の女性が「きつく当たらないほうが、あの子たちもよくやるんだよ」と照れくさそうに言うのが、せいぜいの助けである。ところが喪服を着ることは、通りの女性全員から、はっきりと求められる。母親がその求めに応えなければ、周りから責められ、仲間からもいくらか締め出される。共に暮らす人々のしきたりに反するのは心地よいものではなく、付き合いの範囲が狭ければ、なおさら難しい。亡くなった一人のためにしきたりどおり喪に服した結果、ほかの子の食べ物が減り、着るものもわずかになったのを見れば、訪問員は何か言いたくて喉まで出かかる。それでも、今は子を亡くしたこの一家を訪問し始めた最初のひと月ほどには、強く反対を言わない。
  translation_status: reviewed
- id: da-02-023
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '34'
    source_sequence: 49
    printed_page_end: '36'
  source_text: 'The subject of clothes indeed perplexes the visitor constantly, and the result of her reflections may be summed up somewhat in this wise: The girl who has a definite social standing, who has been to a fashionable school or to a college, whose family live in a house seen and known by all her friends and associates, may afford to be very simple, or even shabby as to her clothes, if she likes. But the working girl, whose family lives in a tenement, or moves from one small apartment to another, who has little social standing and has to make her own place, knows full well how much habit and style of dress has to do with her position. Her income goes into her clothing, out of all proportion to the amount which she spends upon other things. But, if social advancement is her aim, it is the most sensible thing she can do. She is judged largely by her clothes. Her house furnishing, with its pitiful little decorations, her scanty supply of books, are never seen by the people whose social opinions she most values. Her clothes are her background, and from them she is largely judged. It is due to this fact that girls'' clubs succeed best in the business part of town, where "working girls" and "young ladies" meet upon an equal footing, and where the clothes superficially look very much alike. Bright and ambitious girls will come to these down-town clubs to eat lunch and rest at noon, to study all sorts of subjects and listen to lectures, when they might hesitate a long time before joining a club identified with their own neighborhood, where they would be judged not solely on their own merits and the unconscious social standing afforded by good clothes, but by other surroundings which are not nearly up to these. For the same reason, girls'' clubs are infinitely more difficult to organize in little towns and villages, where every one knows every one else, just how the front parlor is furnished, and the amount of mortgage there is upon the house. These facts get in the way of a clear and unbiassed judgment; they impede the democratic relationship and add to the self-consciousness of all concerned. Every one who has had to do with down-town girls'' clubs has had the experience of going into the home of some bright, well-dressed girl, to discover it uncomfortable and perhaps wretched, and to find the girl afterward carefully avoiding her, although the working girl
    may not have been at home when the call was made, and the visitor may have carried herself with the utmost courtesy throughout. In some very successful down-town clubs the home address is not given at all, and only the "business address" is required. Have we worked out our democracy further in regard to clothes than anything else?'
  translation_ja: そもそも衣服のことは、いつも訪問員を悩ませる。彼女の考えをおおまかにまとめれば、こうなるだろう。社会に確かな地位があり、世間でもてはやされる学校や大学に通い、友人や知り合いの誰もが家を見知っている女性なら、その気になれば、きわめて質素な服を着ても、古びた服でさえ着ていられる。だが、家族が長屋に住み、あるいは小さな借家から別の借家へ移り住み、人に認められる地位がほとんどなく、自分で自分の居場所をつくるしかない働く女性は、いつもどう装うか、どんな服を選ぶかが、その地位にどれほど響くかを承知している。ほかのことに使う金とは釣り合わないほど、収入を服につぎ込む。だが社会で一歩でも上へ行くのが目的なら、これほど賢いやり方はない。彼女は着ている服で、大方の判断をされる。わびしい飾りしかない家の家具も、わずかばかりの本も、彼女がその評判をいちばん気にする人たちの目には入らない。どういうところから来たかを示すのは、彼女の衣服であり、そこから大方の判断をされるのだ。だから若い女性のクラブは、町の商業地区で最もうまくいく。そこでは「働く娘」も「良家の令嬢」も対等に会え、少なくとも見た目には、服もとてもよく似ている。頭がよく向上心のある女性たちは、昼休みに食事をしてひと息ついたり、いろいろなことを学んで講演を聞いたりしに、中心街のこのクラブに来る。地元の地区のクラブに入るには、長いことためらうかもしれない。そこでは本人の力や、よい衣服がそれと気づかれずに与える社会的地位だけではなく、自分の力や服ほど見栄えのしない、周りの境遇でも判断される。同じわけで、誰もが互いを知っている小さな町や村では、女性のクラブをつくるのははるかに難しい。玄関側の応接間にどんな家具があるか、家にどれだけ抵当がついているかまで、知られているからだ。そうしたことが、偏りのない明確な判断の邪魔をし、民主的な関係を妨げ、関係する人を余計に人目を気にさせる。中心街の女性クラブに関わったことがある人なら、明るく身なりのよい女性の家に出向いて、居心地が悪く、ときにはみじめな暮らしであると知り、そのあと彼女にそっと避けられた経験がある。訪問時には本人が家にいなかったこともあろうし、訪問した側も終始このうえなく丁寧に振る舞っていたのかもしれない。それでもだ。中心街のよく栄えているクラブのなかには、自宅の住所は全然聞かず、「勤務先の住所」だけを求めるところもある。私たちはほかの何より、衣服に関してこそ、民主主義を先まで実現しているのだろうか。
  translation_status: reviewed
- id: da-02-024
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '36'
    source_sequence: 50
    printed_page_end: '38'
  source_text: The charity visitor has been rightly brought up to consider it vulgar to spend much money upon clothes, to care so much for "appearances." She realizes dimly that the care for personal decoration over that for one's home or habitat is in some way primitive and undeveloped; but she is silenced by its obvious need. She also catches a glimpse of the fact that the disproportionate expenditure of the poor in the matter of clothes is largely due to the exclusiveness of the rich who hide from them the interior of their houses, and their more subtle pleasures, while of necessity exhibiting their street clothes and their street manners. Every one who goes shopping at the same time may see the clothes of the richest women in town, but only those invited to her receptions see the Corot on her walls or the bindings in her library. The poor naturally try to bridge the difference by reproducing the street clothes which they have seen. They are striving to conform to a common standard which their democratic training presupposes belongs to all of us. The charity visitor may regret that the Italian peasant woman has laid aside her picturesque kerchief and substituted a cheap street hat. But it is easy to recognize the first attempt toward democratic expression.
  translation_ja: 慈善の訪問員は、服に大金をかけ、「見かけ」をそんなにも気にするのは下品だと教わった。それ自体はもっともである。住まい、暮らす場所を飾ることより、自分の身を飾ることを大事にするのは、どこか素朴でまだ洗練されていないと、ぼんやり分かってはいる。しかし服の必要が明らかで、何も言えない。また貧しい人が衣服に不釣り合いな金を使うのは、富裕な人が人を締め出すせいでもあることが、ちらりと見える。金持ちは家の内側や、もっと目立たない楽しみを貧しい人たちに見せないが、外出着や表通りでの振る舞いは、どうしても目に触れる。たまたま同じ時間に買い物に出れば、町いちばんの金持ちの女性の服が誰にでも見える。だがその家の壁のコローの絵や書斎の本の装丁は、招かれた人しか目にしない。貧しい人が目にした外出着をまねて、その差を埋めようとするのは自然である。民主主義の教えを受ければ、私たちすべてに共通するはずの基準に、自ら合わせようとしているのだ。訪問員は、イタリアの農村出身の女性が、絵になる頭巾をしまって、安い外出用の帽子に替えたのを惜しむかもしれない。だがそこには、民主主義を自分たちの姿に表そうとする最初の試みが、容易に見て取れる。
  translation_status: reviewed
- id: da-02-025
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '38'
    source_sequence: 51
    printed_page_end: '39'
  source_text: The charity visitor finds herself still more perplexed when she comes to consider such problems as those of early marriage and child labor; for she cannot deal with them according to economic theories, or according to the conventions which have regulated her own life. She finds both of these fairly upset by her intimate knowledge of the situation, and her sympathy for those into whose lives she has gained a curious insight. She discovers how incorrigibly bourgeois her standards have been, and it takes but a little time to reach the conclusion that she cannot insist so strenuously upon the conventions of her own class, which fail to fit the bigger, more emotional, and freer lives of working people. The charity visitor holds well-grounded views upon the imprudence of early marriages, quite naturally because she comes from a family and circle of professional and business people. A professional man is scarcely equipped and started in his profession before he is thirty. A business man, if he is on the road to success, is much nearer prosperity at thirty-five than twenty-five, and it is therefore wise for these men not to marry in the twenties; but this does not apply to the workingman. In many trades he is laid upon the shelf at thirty-five, and in nearly all trades he receives the largest wages in his life between twenty and thirty. If the young workingman has all his wages to himself, he will probably establish habits of personal comfort, which he cannot keep up when he has to divide with a family—habits which he can, perhaps, never overcome.
  translation_ja: 若いうちの結婚や児童労働のような問題を考えると、慈善の訪問員は、いっそう戸惑う。経済の理論にも、自分の暮らしを律してきたしきたりにも従って考えるわけにはいかないからだ。事情を内側から知るようになり、思いがけず人々の暮らしを垣間見て共感を覚えたため、理論もしきたりも、すっかりくつがえってしまう。自らの基準がいかに抜きがたくブルジョワ的であるかに気づくと、自分の階級のしきたりにはあれほど強く固執できないという結論にすぐ達する。それは、働く人々の、もっとおおらかで、感情豊かで、自由な暮らしには合わないのだ。早婚は思慮を欠くという訪問員の考えには、確かな理由もある。当然なのは、自分の家族も周囲も、専門職や商売をする人たちだからだ。専門職の男は三十になるまでは、準備を整え、その職に踏み出すこともほとんどできない。商売をする男も、成功する見込みがあるのなら、二十五より三十五のほうがずっと豊かさに近い。この人たちが二十代で結婚しないのは、だから賢明なことだ。だが、働く男にそれは当てはまらない。多くの仕事では三十五になれば第一線から外され、ほとんどどんな仕事でも、生涯で最も多い賃金が得られるのは二十から三十までである。若い労働者が賃金を全部ひとりで使えば、おそらく自分にとって快適な生活が習慣になる。家族と分けあうようになれば維持できず、それでいて、もうその習慣を捨てることもできないかもしれない。
  translation_status: reviewed
- id: da-02-026
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '39'
    source_sequence: 52
    printed_page_end: '40'
  source_text: The sense of prudence, the necessity for saving, can never come to a primitive, emotional man with the force of a conviction; but the necessity of providing for his children is a powerful incentive. He naturally regards his children as his savings-bank; he expects them to care for him when he gets old, and in some trades old age comes very early. A Jewish tailor was quite lately sent to the Cook County poorhouse, paralyzed beyond recovery at the age of thirty-five. Had his little boy of nine been but a few years older, he might have been spared this sorrow of public charity. He was, in fact, better able to well support a family when he was twenty than when he was thirty-five, for his wages had steadily grown less as the years went on. Another tailor whom I know, who is also a Socialist, always speaks of saving as a bourgeois virtue, one quite impossible to the genuine workingman. He supports a family consisting of himself, a wife and three children, and his two parents on eight dollars a week. He insists it would be criminal not to expend every penny of this amount upon food and shelter, and he expects his children later to care for him.
  translation_ja: 暮らしを慎ましくするという心がけや、蓄えが必要だということは、素朴で情の強い男には、確信にまでなることはない。だが子どもを養わなければならないことは、力強い動機となる。その男は、自然に子どもを自分の貯蓄銀行と考える。自分が年を取ったら面倒を見てくれるつもりでいる。仕事によっては老いがずいぶん早く来る。このあいだも、あるユダヤ人の仕立屋が、三十五歳で治る見込みのない麻痺となり、クック郡の救貧院に送られた。九つの息子があと何歳か上だったなら、公の慈善に頼るこの悲しみを味わわずに済んだかもしれない。実のところ、年を経るごとに賃金が着実に減ったので、三十五のときより、二十のときのほうが一家を十分に養う力があった。私の知る別の仕立屋は社会主義者でもあり、貯金はブルジョワの徳で、本当の労働者にはまったく無理だと、いつも言う。本人と妻、三人の子、自分の両親を合わせた家族を、週八ドルで養う。その金を食費と住居費に一セント残らず使わなければ罪だと言い張り、いずれ子どもが面倒を見てくれると考えている。
  translation_status: reviewed
- id: da-02-027
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '40'
    source_sequence: 53
    printed_page_end: '41'
  source_text: This economic pressure also accounts for the tendency to put children to work overyoung and thus cripple their chances for individual development and usefulness, and with the avaricious parent also leads to exploitation. "I have fed her for fourteen years, now she can help me pay my mortgage" is not an unusual reply when a hardworking father is expostulated with because he would take his bright daughter out of school and put her into a factory.
  translation_ja: 同じ経済的な重圧のために、子どもをあまりに幼いうちから働きに出してしまい、一人の人間として育ち、力を役立てる機会を奪う傾向も生まれる。親が欲深ければ、そこから搾取にもなる。働き者の父親が、勉強のできる娘を学校から引き取って工場へ送り込もうとするので、考え直すよう説く。すると「十四年も食わせてきたんだ。もう、家の借金の返済を手伝えるだろう」と答えるのは珍しいことではない。
  translation_status: reviewed
- id: da-02-028
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '41'
    source_sequence: 54
  source_text: It has long been a common error for the charity visitor, who is strongly urging her "family" toward self-support, to suggest, or at least connive, that the children be put to work early, although she has not the excuse that the parents have. It is so easy, after one has been taking the industrial view for a long time, to forget the larger and more social claim; to urge that the boy go to work and support his parents, who are receiving charitable aid. She does not realize what a cruel advantage the person who distributes charity has, when she gives advice.
  translation_ja: 慈善の訪問員は、「受け持ち」の家族に自活するよう強く勧めるあまり、子どもを早く働かせることを自分から提案するか、少なくとも黙って見過ごす。親には親なりの言い分があるが、訪問員にはそれさえない。これは昔からよくある過ちだ。長いこと働いて稼ぐ側面ばかりを見ていると、もっと広い、社会の側からの要求を忘れ、少年に働きに出て、慈善の援助を受けている親を養いなさいと勧めがちになる。援助を配る立場にある人が助言するとき、相手に対し、残酷なほど強い立場にいることを、彼女は分かっていない。
  translation_status: reviewed
- id: da-02-029
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '41'
    source_sequence: 55
    printed_page_end: '42'
  source_text: The manager in a huge mercantile establishment employing many children was able to show during a child-labor investigation, that the only children under fourteen years of age in his employ were protégés who had been urged upon him by philanthropic ladies, not only acquaintances of his, but valued patrons of the establishment. It is not that the charity visitor is less wise than other people, but she has fixed her mind so long upon the industrial lameness of her family that she is eager to seize any crutch, however weak, which may enable them to get on.
  translation_ja: 多くの子どもを雇う大規模な商店の支配人は、児童労働について調査を受けたとき、十四歳未満で雇っていたのは、慈善に熱心な婦人たちからぜひ雇うよう頼まれた子どもだけだったと示すことができた。この婦人たちは彼の知り合いであるばかりか、その店の大切な客でもあった。慈善の訪問員の判断がほかの人より悪いというのではない。担当の家族が働いて暮らしを立てる力を失っていることばかり長く見てきたので、家族が先へ進めるなら、どれほど頼りない松葉杖にでもすがろうとするのだ。
  translation_status: reviewed
- id: da-02-030
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '42'
    source_sequence: 56
  source_text: She has failed to see that the boy who attempts to prematurely support his widowed mother may lower wages, add an illiterate member to the community, and arrest the development of a capable workingman. As she has failed to see that the rules which obtain in regard to the age of marriage in her own family may not apply to the workingman, so also she fails to understand that the present conditions of employment surrounding a factory child are totally unlike those which obtained during the energetic youth of her father.
  translation_ja: その訪問員は、夫を失った母親を早いうちから養おうとする少年が、ほかの労働者の賃金を下げ、読み書きのできない市民を一人増やし、有能な働き手として自分が成長するのを止めてしまいうることを、見落としている。自分の家庭で通用する結婚年齢の決まりが、労働者には当てはまらないかもしれないことが見えていないのと同じように、いま工場で働く子どもを取り巻く雇用の条件は、自分の父が元気に働いていた若いころとはまったく違うことも、分かっていない。
  translation_status: reviewed
- id: da-02-031
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '43'
    source_sequence: 57
    printed_page_end: '44'
  source_text: The child who is prematurely put to work is constantly oppressed by this never ending question of the means of subsistence, and even little children are sometimes almost crushed with the cares of life through their affectionate sympathy. The writer knows a little Italian lad of six to whom the problems of food, clothing, and shelter have become so immediate and pressing that, although an imaginative child, he is unable to see life from any other standpoint. The goblin or bugaboo, feared by the more fortunate child, in his mind, has come to be the need of coal which caused his father hysterical and demonstrative grief when it carried off his mother's inherited linen, the mosaic of St. Joseph, and, worst of all, his own rubber boots. He once came to a party at Hull-House, and was interested in nothing save a gas stove which he saw in the kitchen. He became excited over the discovery that fire could be produced without fuel. "I will tell my father of this stove. You buy no coal, you need only a match. Anybody will give you a match." He was taken to visit at a country-house and at once inquired how much rent was paid for it. On being told carelessly by his hostess that they paid no rent for that house, he came back quite wild with interest that the problem was solved. "Me and my father will go to the country. You get a big house, all warm, without rent." Nothing else in the country interested him but the subject of rent, and he talked of that with an exclusiveness worthy of a single taxer.
  translation_ja: 早すぎるうちに働きに出された子どもは、どう食べていくかという終わりのない問題に、絶えず押しつぶされそうになる。まだ小さい子でさえ、家族を思う気持ちから、暮らしの心配に耐えられなくなることがある。私の知る六歳のイタリア人の男の子にとっては、食べ物、服、雨露をしのぐ場所があまりに差し迫った問題で、想像力のある子なのに、ほかの面から人生を見ることができない。もっと恵まれた子ならお化けや化け物を怖がるが、彼の頭のなかでお化けにあたるものは、石炭を手に入れなければならないことだった。石炭を買うために母親が受け継いだリネン類や聖ヨセフのモザイクが持っていかれ、何よりひどいことに、自分のゴム長靴までなくなったとき、父は人目もはばからず取り乱して嘆いた。あるとき男の子がハル・ハウスの催しに来たが、台所で見かけたガスこんろ以外には、関心を示さなかった。燃料なしで火を起こせると思い、興奮したのだ。「このこんろ、父ちゃんに教えてやる。石炭買わなくていいんだ。マッチだけあればいい。マッチなら誰だってくれるよ。」田舎の屋敷に連れていってもらったときは、すぐに家賃はいくらかと尋ねた。女主人が、家賃なんて払わないと何気なく答えると、男の子は帰ってから、問題が解けたとすっかり有頂天になった。「父ちゃんと田舎に行くよ。大きなあったかい家が、ただで借りられるんだ。」田舎でほかに興味を引くものはなく、家賃のことばかり、土地だけに税をかけるべきだと説く論者にも負けないほど、一途に話した。
  translation_status: reviewed
- id: da-02-032
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '44'
    source_sequence: 58
    printed_page_end: '45'
  source_text: The struggle for existence, which is so much harsher among people near the edge of pauperism, sometimes leaves ugly marks on character, and the charity visitor finds these indirect results most mystifying. Parents who work hard and anticipate an old age when they can no longer earn, take care that their children shall expect to divide their wages with them from the very first. Such a parent, when successful, impresses the immature nervous system of the child thus tyrannically establishing habits of obedience, so that the nerves and will may not depart from this control when the child is older. The charity visitor, whose family relation is lifted quite out of this, does not in the least understand the industrial foundation for this family tyranny.
  translation_ja: 貧困の淵にいる人々にとって、暮らしを立てるための闘いはひときわ厳しく、ときには人柄に醜い跡を残す。慈善の訪問員にとって、こうした間接的な影響はとりわけ分かりにくい。懸命に働きながら、いずれ稼げなくなる年老いた自分を思う親は、子どもが初めから親と賃金を分けるつもりでいるよう仕向ける。うまくいけば、まだ育ちきっていない子どもの神経に深く刻みつけ、服従の習慣を専制的に固めてしまう。大きくなってからも、その子の体に染み込んだ反応や意志が、親の支配を離れないためである。これとはまったく無縁の家族関係のなかで育った慈善の訪問員には、こうした家庭の専制が、家計を支える必要に根ざすことが、少しも分からない。
  translation_status: reviewed
- id: da-02-033
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '45'
    source_sequence: 59
    printed_page_end: '46'
  source_text: The head of a kindergarten training-class once addressed a club of working women, and spoke of the despotism which is often established over little children. She said that the so-called determination to break a child's will many times arose from a lust of dominion, and she urged the ideal relationship founded upon love and confidence. But many of the women were puzzled. One of them remarked to the writer as she came out of the club room, "If you did not keep control over them from the time they were little, you would never get their wages when they are grown up." Another one said, "Ah, of course she (meaning the speaker) doesn't have to depend upon her children's wages. She can afford to be lax with them, because even if they don't give money to her, she can get along without it."
  translation_ja: あるとき、幼稚園の教員を養成する講座の責任者が、働く女性のクラブで、小さな子どもに対してしばしば行われる専制について話した。子どもの意志をくじかねばならないという、いわゆる決意は、多くの場合、支配したい欲から生まれると指摘し、愛情と信頼を土台にした理想の関係を勧めた。だが女性たちの多くは当惑した。一人は部屋を出てくるとき、私に言った。「小さいうちから言うことを聞かせておかなきゃ、大きくなったって、稼ぎなんてもらえないじゃないですか。」もう一人はこう言った。「そりゃ、あの人は子どもの稼ぎを当てにする必要がないんですよ。お金を渡してくれなくても暮らしていけるんだから、子どもに厳しくしないでいられるんです。」
  translation_status: reviewed
- id: da-02-034
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '46'
    source_sequence: 60
  source_text: There are an impressive number of children who uncomplainingly and constantly hand over their weekly wages to their parents, sometimes receiving back ten cents or a quarter for spending-money, but quite as often nothing at all; and the writer knows one girl of twenty-five who for six years has received two cents a week from the constantly falling wages which she earns in a large factory. Is it habit or virtue which holds her steady in this course? If love and tenderness had been substituted for parental despotism, would the mother have had enough affection, enough power of expression to hold her daughter's sense of money obligation through all these years? This girl who spends her paltry two cents on chewing-gum and goes plainly clad in clothes of her mother's choosing, while many of her friends spend their entire wages on those clothes which factory girls love so well, must be held by some powerful force.
  translation_ja: 不平も言わず、毎週の賃金をいつも親に渡している子どもは、驚くほど多い。小遣いに十セントか二十五セント返してもらうこともあるが、同じくらいよくあるのは、一銭も戻らないことだ。私が知る二十五歳の女性は、大きな工場で働き、その賃金が下がり続けるなかで、もう六年間、週に二セントだけもらってきた。彼女にこれだけのことを続けさせるのは、習慣なのか、徳なのか。親が支配する代わりに愛や優しさで接していたら、母親には、娘が何年ものあいだ金を渡す義務を感じ続けるほどの愛情があっただろうか。それだけの愛情を伝えられただろうか。この女性は、友人の多くが工場で働く娘たちの大好きな服に賃金を全部つぎ込むのを横目に、わずかな二セントをチューインガムに使い、母に選ばれた地味な服で過ごす。何か強い力が、彼女をそうさせているに違いない。
  translation_status: reviewed
- id: da-02-035
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '47'
    source_sequence: 61
    printed_page_end: '50'
  source_text: 'The charity visitor finds these subtle and elusive problems most harrowing. The head of a family she is visiting is a man who has become black-listed in a strike. He is not a very good workman, and this, added to his agitator''s reputation, keeps him out of work for a long time. The fatal result of being long out of work follows: he becomes less and less eager for it, and gets a "job" less and less frequently. In order to keep up his self-respect, and still more to keep his wife''s respect for him, he yields to the little self-deception that this prolonged idleness follows because he was once blacklisted, and he gradually becomes a martyr. Deep down in his heart perhaps—but who knows what may be deep down in his heart? Whatever may be in his wife''s, she does not show for an instant that she thinks he has grown lazy, and accustomed to see her earn, by sewing and cleaning, most of the scanty income for the family. The charity visitor, however, does see this, and she also sees that the other men who were in the strike have gone back to work. She further knows by inquiry and a little experience that the man is not skilful. She cannot, however, call him lazy and good-for-nothing, and denounce him as worthless as her grandmother might have done, because of certain intellectual conceptions at which she has arrived. She sees other workmen come to him for shrewd advice; she knows that he spends many more hours in the public library reading good books than the average workman has time to do. He has formed no bad habits and has yielded only to those subtle temptations toward a life of leisure which come to the intellectual man. He lacks the qualifications which would induce his union to engage him as a secretary or organizer, but he is a constant speaker at workingmen''s meetings, and takes a high moral attitude on the questions discussed there. He contributes a certain intellectuality to his friends, and he has undoubted social value. The neighboring women confide to the charity visitor their sympathy with his wife, because she has to work so hard, and because her husband does not "provide." Their remarks are sharpened by a certain resentment toward the superiority of the husband''s education and gentle manners. The charity visitor is ashamed to take this point of view, for she knows that it is not altogether fair. She is reminded of a college friend of
    hers, who told her that she was not going to allow her literary husband to write unworthy potboilers for the sake of earning a living. "I insist that we shall live within my own income; that he shall not publish until he is ready, and can give his genuine message." The charity visitor recalls what she has heard of another acquaintance, who urged her husband to decline a lucrative position as a railroad attorney, because she wished him to be free to take municipal positions, and handle public questions without the inevitable suspicion which unaccountably attaches itself in a corrupt city to a corporation attorney. The action of these two women seemed noble to her, but in their cases they merely lived on a lesser income. In the case of the workingman''s wife, she faced living on no income at all, or on the precarious one which she might be able to get together.'
  translation_ja: このような微妙でつかみどころのない問題は、慈善の訪問員にとってひどく心をすり減らす。彼女が訪ねている家の主人は、ストライキで雇用主から締め出し名簿に載せられた男である。仕事の腕はそれほどよくない。扇動家という評判も重なって、長いこと職に就けない。長く職がないと起こる致命的なことが起きる。働こうという気持ちは次第に薄れ、「仕事」にありつけることもますます少なくなる。自尊心を保ち、それ以上に妻の尊敬を失わないため、以前に締め出されたせいでこれほど長く仕事がないのだと、少しばかり自分を欺くことを許し、次第に殉教者になっていく。心の底ではおそらく。だが彼の心の底に何があるか、誰に分かるだろう。妻の心に何があるにせよ、夫が怠けるようになり、裁縫と掃除でわずかな家計の大半を自分が稼ぐのを見ていることに慣れてしまったのだと、彼女が考えている様子は一瞬も見せない。だが訪問員にはそのことが見えている。ストライキに加わったほかの男たちは仕事に戻っているのも知っている。調べ、自分のわずかな経験に照らして、この男の腕がよくないことも知っている。それでも、祖母ならそうしたかもしれないように、この男を怠け者で役立たずだと決めつけ、何の値うちもないと責めることはできない。考えを深めて、そう簡単にはいかない見方にたどり着いたのだ。ほかの労働者が、的確な助言を求めて彼を訪ねてくるのを見ている。ふつうの労働者にはとても取れない長い時間を、公立図書館でよい本を読んで過ごすのも知っている。悪い習慣は身につけず、知的な人が仕事に追われない生活にひそかに引かれる、そのかすかな誘惑に負けただけだ。組合が書記やまとめ役として雇おうと思うような力はないが、労働者の集まりではいつも発言し、議論になる問題について高い道徳的な立場を取る。友人たちのあいだに、物事を考える気風をいくらか持ち込み、社会にとって価値があることは疑いない。近所の女性は訪問員に、その妻に同情すると打ち明ける。あれほど働かなくてはならないのに、夫のほうは「家族を養わない」からだという。夫のほうが教育があり、物腰も柔らかいことへの反感がいくらかあって、そのため口調はきつくなる。慈善の訪問員は、これがすっかり公正な見方ではないと知っているので、そこに同調するのを恥ずかしく思う。大学時代の友人は、物書きの夫が生活のために出来の悪い売文をするのは許さないつもりだと話していた。「私の収入で暮らせるようにする。その人にしか書けないことを、本当に書けるときが来るまで、発表はしないでほしいの。」もう一人の知り合いについて聞いた話も思い出す。彼女は夫に、鉄道会社の弁護士という実入りのよい仕事を断るよう勧めた。市の職に就き、公共の問題を扱う自由を持っていてほしかったからだ。腐敗した市では、企業の弁護士には、どういうわけか必ず疑いの目が向く。この二人の女性の行いは、彼女には気高く見えた。だが二人の場合は、少ない収入で生活しただけだった。労働者の妻は、収入がまったくないか、自分でどうにか得られる不確かな稼ぎだけで暮らすことに、立ち向かったのである。
  translation_status: reviewed
- id: da-02-036
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '50'
    source_sequence: 62
    printed_page_end: '51'
  source_text: She sees that this third woman has made the greatest sacrifice, and she is utterly unwilling to condemn her while praising the friends of her own social position. She realizes, of course, that the situation is changed by the fact that the third family needs charity, while the other two do not; but, after all, they have not asked for it, and their plight was only discovered through an accident to one of the children. The charity visitor has been taught that her mission is to preserve the finest traits to be found in her visited family, and she shrinks from the thought of convincing the wife that her husband is worthless and she suspects that she might turn all this beautiful devotion into complaining drudgery. To be sure, she could give up visiting the family altogether, but she has become much interested in the progress of the crippled child who eagerly anticipates her visits, and she also suspects that she will never know many finer women than the mother. She is unwilling, therefore, to give up the friendship, and goes on bearing her perplexities as best she may.
  translation_ja: いちばん大きな犠牲を払ったのはこの三人目の女性だと、訪問員には分かる。自分と同じ社会的地位の友人をほめながら、この女性を責める気にはとてもなれない。もちろん、ほかの二つの家には援助がいらず、三つ目の家には要るという違いで、事情が変わることは認める。だがこの家族も助けを求めたわけではなく、子どもの一人が事故に遭ったため、暮らしが苦しいとたまたま分かっただけである。訪問員は、訪ねた家族に見つかるいちばんすぐれた特質を守るのが、自分の使命だと教わってきた。夫は価値のない人間だと妻に納得させることなど、考えるだけで気が引ける。それでは、この美しい献身を、不平に満ちたつらい労働に変えてしまいかねない。むろん一家をもう訪ねないこともできる。けれども彼女は、訪問を心待ちにする、体の不自由な子どもがよくなっていくことに深い関心を持つようになった。この母親よりすぐれた人は、そう何人も知ることはないだろうとも思っている。だからこの付き合いを捨てる気になれず、さまざまな戸惑いを、できるかぎり自分の内で抱えながら、訪ね続ける。
  translation_status: reviewed
- id: da-02-037
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '51'
    source_sequence: 63
  source_text: The first impulse of our charity visitor is to be somewhat severe with her shiftless family for spending money on pleasures and indulging their children out of all proportion to their means. The poor family which receives beans and coal from the county, and pays for a bicycle on the instalment plan, is not unknown to any of us. But as the growth of juvenile crime becomes gradually understood, and as the danger of giving no legitimate and organized pleasure to the child becomes clearer, we remember that primitive man had games long before he cared for a house or regular meals.
  translation_ja: 私たちの訪問員は、暮らしを立てる力の乏しい担当の家族が、身の丈にまるで合わないほど娯楽に金を使い、子どもを甘やかすのに対し、はじめは少し厳しくしたいと思う。郡から豆と石炭をもらいながら、自転車を月賦で買う貧しい家族には、誰も心当たりがあるだろう。だが、子どもの犯罪が増える事情が次第に分かり、子どもにまともな、きちんとした遊びの機会をいっさい与えない危険が見えてくるにつれ、人類が住まいや決まった食事を大切にするずっと前から、すでに遊びを持っていたことを、私たちは思い出す。
  translation_status: reviewed
- id: da-02-038
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '52'
    source_sequence: 64
  source_text: There are certain boys in many city neighborhoods who form themselves into little gangs with a leader who is somewhat more intrepid than the rest. Their favorite performance is to break into an untenanted house, to knock off the faucets, and cut the lead pipe, which they sell to the nearest junk dealer. With the money thus procured they buy beer and drink it in little free-booter's groups sitting in the alley. From beginning to end they have the excitement of knowing that they may be seen and caught by the "coppers," and are at times quite breathless with suspense. It is not the least unlike, in motive and execution, the practice of country boys who go forth in squads to set traps for rabbits or to round up a coon.
  translation_ja: 都会の多くの地区には、仲間のうち少し大胆な少年を頭にして、小さな徒党を組む子たちがいる。お気に入りのいたずらは、空き家に入り込み、取り外した蛇口や切り取った鉛管を近くのくず屋に売ることだ。手に入った金でビールを買い、裏通りに座り込んで、小さな海賊仲間のように飲む。初めから終わりまで「お巡り」に見つかり、捕まるかもしれないと、気持ちが高ぶっている。はらはらするあまり、ほとんど息もできなくなるときがある。田舎の少年たちが徒党を組んで、ウサギに罠をかけに行ったり、アライグマを取り囲みに出かけたりするのと、動機もやり方も、それほど違わない。
  translation_status: reviewed
- id: da-02-039
  section_id: ch-02
  kind: paragraph

    precision: page
    printed_page: '54'
    source_sequence: 69
    printed_page_end: '56'
  source_text: This very imaginative impulse and attempt to live in a pictured world of their own, which seems the simplest prerogative of childhood, often leads the boys into difficulty. Three boys aged seven, nine, and ten were once brought into a neighboring police station under the charge of pilfering and destroying property. They had dug a cave under a railroad viaduct in which they had spent many days and nights of the summer vacation. They had "swiped" potatoes and other vegetables from hucksters' carts, which they had cooked and eaten in true brigand fashion; they had decorated the interior of the excavation with stolen junk, representing swords and firearms, to their romantic imaginations. The father of the ringleader was a janitor living in a building five miles away in a prosperous portion of the city. The landlord did not want an active boy in the building, and his mother was dead; the janitor paid for the boy's board and lodging to a needy woman living near the viaduct. She conscientiously gave him his breakfast and supper, and left something in the house for his dinner every morning when she went to work in a neighboring factory; but was too tired by night to challenge his statement that he "would rather sleep outdoors in the summer," or to investigate what he did during the day. In the meantime the three boys lived in a world of their own, made up from the reading of adventurous stories and their vivid imaginations, steadily pilfering more and more as the days went by, and actually imperilling the safety of the traffic passing over the street on the top of the viaduct. In spite of vigorous exertions on their behalf, one of the boys was sent to the Reform School, comforting himself with the conclusive remark, "Well, we had fun anyway, and maybe they will let us dig a cave at the School; it is in the country, where we can't hurt anything."
  translation_ja: 想像して、自分たちが思い描いた世界に生きてみる、この衝動こそ、子どもならごく当たり前に持っているものに見える。それが少年たちを、しばしば困ったことに巻き込む。七歳、九歳、十歳の三人の少年が、小さな盗みや器物損壊の疑いで、あるとき近くの警察署に連れてこられた。三人は鉄道の高架橋の下に穴を掘って洞穴をつくり、夏休みの何日も、昼も夜もそこで過ごしていた。行商人の荷車からジャガイモなどの野菜を「ちょろまかし」、本物の山賊さながらに料理して食べた。盗んできたくずを、中の飾りにした。冒険好きな彼らの想像では、それが剣や鉄砲なのだった。首領格の少年の父は、五マイル離れた町の裕福な地区で、建物の管理人をしながらそこに住んでいた。家主は元気のあり余った少年が建物にいるのを嫌がり、少年の母は亡くなっていた。父は高架橋の近くに住む貧しい女性に、少年の食費と下宿代を払っていた。女性は良心的に少年に朝食と夕食を与え、近くの工場へ毎朝出勤するときは、昼に食べるものを家に置いていった。だが夜には疲れ切って、「夏は外で寝るほうがいい」という言葉を問いただしたり、昼間何をしているかを調べたりはしなかった。そのあいだ三人の少年は、読んだ冒険物語と生き生きした想像力からつくった自分たちだけの世界に暮らし、日がたつごとに盗みを重ね、しまいには通りの上の高架を通る交通の安全まで危うくした。三人のために熱心に手を尽くしたのにもかかわらず、そのうち一人は感化院に送られた。少年は最後にこう言って、気を取り直した。「まあ、楽しかったからいいや。感化院でも穴を掘らせてくれるかもしれない。あそこは田舎だし、何にも壊さずに済むよ。」
  translation_status: reviewed

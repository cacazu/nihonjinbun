    source_sequence: 65
    printed_page_end: '53'
  source_text: It is characterized by a pure spirit for adventure, and the vicious training really begins when they are arrested, or when an older boy undertakes to guide them into further excitements. From the very beginning the most enticing and exciting experiences which they have seen have been connected with crime. The policeman embodies all the majesty of successful law and established government in his brass buttons and dazzlingly equipped patrol wagon.
  translation_ja: 根底にあるのはただ冒険を求める気持ちである。悪いことを身につけ始めるのは、捕まったときか、年上の少年から、もっと刺激を味わえるところへ連れていってやると言われたときだ。そもそも、彼らが見たうちでいちばん心を誘われ、胸が躍った出来事は、どれも犯罪に結びついていた。真鍮のボタンをつけ、きらびやかな装備のついたパトロール馬車に乗る警官は、力を発揮する法と、確立された政府の威厳を、すべて一身に備えている。
  translation_status: reviewed
- id: da-02-040
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '53'
    source_sequence: 66
  source_text: The boy who has been arrested comes back more or less a hero with a tale to tell of the interior recesses of the mysterious police station. The earliest public excitement the child remembers is divided between the rattling fire engines, "the time there was a fire in the next block," and all the tense interest of the patrol wagon "the time the drunkest lady in our street was arrested."
  translation_ja: 逮捕された少年は、謎めいた警察署の奥がどうなっていたかという話を持ち帰り、ちょっとした英雄になる。子どもが思い出せるいちばん古い、近所で騒ぎになった出来事といえば、「隣の区画で火事があったとき」の、がらがらと走る消防車か、「この通りでいちばん酔っ払っていたおばさんが捕まったとき」の、パトロール馬車が連れてきた張りつめた興奮か、どちらかである。
  translation_status: reviewed
- id: da-02-041
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '53'
    source_sequence: 67
    printed_page_end: '54'
  source_text: 'In the first year of their settlement the Hull-House residents took fifty kindergarten children to Lincoln Park, only to be grieved by their apathetic interest in trees and flowers. As they came back with an omnibus full of tired and sleepy children, they were surprised to find them galvanized into sudden life because a patrol wagon rattled by. Their eager little heads popped out of the windows full of questioning: "Was it a man or a woman?" "How many policemen inside?" and eager little tongues began to tell experiences of arrests which baby eyes had witnessed.'
  translation_ja: ハル・ハウスの住民は、活動を始めて一年目に、幼稚園の子ども五十人をリンカーン公園に連れていった。木や花にろくに興味がないのを見て、がっかりしただけだった。疲れて眠そうな子どもを乗合馬車にいっぱい載せて帰る途中、パトロール馬車ががらがらと通り過ぎると、子どもたちが急に生き返ったようになり、驚かされた。小さな頭が窓の外に次々と飛び出し、知りたがって質問する。「男の人だった？　女の人だった？」「中にお巡りさん、何人いた？」そして小さな口が、幼い目で見た逮捕の場面を熱心に語りだした。
  translation_status: reviewed
- id: da-02-042
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:

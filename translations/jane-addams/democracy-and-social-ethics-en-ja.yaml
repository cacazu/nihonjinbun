    precision: page
    printed_page: '174'
    source_sequence: 207
    printed_page_end: '175'
  source_text: At times of social disturbance the law-abiding citizen is naturally so anxious for peace and order, his sympathies are so justly and inevitably on the side making for the restoration of law, that it is difficult for him to see the situation fairly. He becomes insensible to the unselfish impulse which may prompt a sympathetic strike in behalf of the workers in a non-union shop, because he allows his mind to dwell exclusively on the disorder which has become associated with the strike. He is completely side-tracked by the ugly phases of a great moral movement. It is always a temptation to assume that the side which has respectability, authority, and superior intelligence, has therefore righteousness as well, especially when the same side presents concrete results of individual effort as over against the less tangible results of associated effort.
  translation_ja: 社会が騒がしいとき、法を守る市民が平和と秩序を強く求めるのは自然であり、法を取り戻そうとする側に気持ちが傾くことは、もっともで避けがたい。だから事態を公平に見ることは難しい。組合のない職場で働く人々を助けようという連帯のストライキを動かすかもしれない、私心のない衝動が分からなくなる。気持ちを向けるのは、ストライキと結びついた騒乱だけだからである。大きな道徳の運動のうち、醜いところばかりに、すっかり気を取られる。立派だと認められ、権威があり、知性にもまさる側に、だから正義もあると思い込みたくなるのは、いつものことだ。その同じ側が、共同の取り組みから生まれる目に見えにくい成果に対して、個人の努力の具体的な結果を示すなら、なおさらである。
  translation_status: reviewed
- id: da-05-047
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '175'
    source_sequence: 208
    printed_page_end: '177'
  source_text: It is as yet most difficult for us to free ourselves from the individualistic point of view sufficiently to group events in their social relations and to judge fairly those who are endeavoring to produce a social result through all the difficulties of associated action. The philanthropist still finds his path much easier than do those who are attempting a social morality. In the first place, the public, anxious to praise what it recognizes as an undoubted moral effort often attended with real personal sacrifice, joyfully seizes upon this manifestation and overpraises it, recognizing the philanthropist as an old friend in the paths of righteousness, whereas the others are strangers and possibly to be distrusted as aliens. It is easy to confuse the response to an abnormal number of individual claims with the response to the social claim. An exaggerated personal morality is often mistaken for a social morality, and until it attempts to minister to a social situation its total inadequacy is not discovered. To attempt to attain a social morality without a basis of democratic experience results in the loss of the only possible corrective and guide, and ends in an exaggerated individual morality but not in social morality at all. We see this from time to time in the care-worn and overworked philanthropist, who has taxed his individual will beyond the normal limits and has lost his clew to the situation among a bewildering number of cases. A man who takes the betterment of humanity for his aim and end must also take the daily experiences of humanity for the constant correction of his process. He must not only test and guide his achievement by human experience, but he must succeed or fail in proportion as he has incorporated that experience with his own. Otherwise his own achievements become his stumbling-block, and he comes to believe in his own goodness as something outside of himself. He makes an exception of himself, and thinks that he is different from the rank and file of his fellows. He forgets that it is necessary to know of the lives of our contemporaries, not only in order to believe in their integrity, which is after all but the first beginnings of social morality, but in order to attain to any mental or moral integrity for ourselves or any such hope for society.
  translation_ja: 私たちはまだ、個人主義の見方から十分に自由になって、出来事を社会のつながりのなかでとらえ、人々が協力するさまざまな困難を越えながら社会的な成果を生もうとする人を、公平に判断するのが、ことのほか難しい。慈善家はなお、社会の道徳を実践しようとする人々より、はるかに楽に進める。第一に、世間は、確かに道徳的で、しばしば本人が本当に犠牲を払う努力を褒めたくて、その現れに喜んで飛びつき、褒めすぎるほど褒める。慈善家は正しさを求める道でずっと前からの友人だが、ほかの人たちは見知らぬ者で、よそ者として疑うべきかもしれないと考える。並外れて多くの個人の必要に応えることと、社会全体の務めに応えることは、取り違えやすい。個人としての道徳が極度に発達したものも、しばしば社会の道徳と間違われ、社会全体の問題に応えようとして初めて、まるで足りないことが分かる。民主主義の経験を土台にしないまま社会の道徳を身につけようとすれば、誤りを直し導いてくれる唯一のものを失い、個人の道徳を大きくするだけで、社会の道徳にはまったくならない。気苦労が絶えず、働きすぎた慈善家に、ときおりそうしたことが見られる。一人で意志の力をふつうの限度以上に使い果たし、目も回るほど多い案件のなかで、どう事態を見ればよいかという手がかりを、なくしてしまったのだ。人々の暮らしをよくすることを目当てとし、最後に果たすべきことと考える人なら、やり方を絶えず改めるために、人々の日々の経験も拠りどころにしなければならない。その経験を頼りに自分の仕事を試し、導くだけでは足りない。その経験をどこまで自分のものにできたかに応じて、成功も失敗も引き受けなければならない。そうでなければ、自分の成果そのものがつまずきの石となり、自分の善良さは自分の外に何かとしてあるのだと、信じるようになる。自分を例外とし、ほかの仲間とは違うと考える。同じ時代に生きる人々の暮らしを知る必要があることを、忘れてしまう。人々の誠実さを信じるためだけに必要なのではない。それは結局、社会の道徳のほんの始まりにすぎない。私たち自身が考えや道徳において少しでも誠実であり、社会にもそのような希望を少しでも持てるために、必要なのだ。
  translation_status: reviewed

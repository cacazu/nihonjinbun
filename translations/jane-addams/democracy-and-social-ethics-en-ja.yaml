    precision: page
    printed_page: '57'
    source_sequence: 72
  source_text: If we agree with a recent definition of Art, as that which causes the spectator to lose his sense of isolation, there is no doubt that the popular theatre, with all its faults, more nearly fulfils the function of art for the multitude of working people than all the "free galleries" and picture exhibits combined.
  translation_ja: 芸術とは、見る者に孤独を忘れさせるものだという最近の定義に従えば、欠点はいくらあっても、大衆向けの芝居は、大勢の働く人にとって、「無料の画廊」や絵画展を全部合わせたものより、はるかによく芸術の役割を果たしている。
  translation_status: reviewed
- id: da-02-047
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '58'
    source_sequence: 73
    printed_page_end: '59'
  source_text: The greatest difficulty is experienced when the two standards come sharply together, and when both sides make an attempt at understanding and explanation. The difficulty of making clear one's own ethical standpoint is at times insurmountable. A woman who had bought and sold school books stolen from the school fund,—books which are all plainly marked with a red stamp,—came to Hull House one morning in great distress because she had been arrested, and begged a resident "to speak to the judge." She gave as a reason the fact that the House had known her for six years, and had once been very good to her when her little girl was buried. The resident more than suspected that her visitor knew the school books were stolen when buying them, and any attempt to talk upon that subject was evidently considered very rude. The visitor wished to get out of her trial, and evidently saw no reason why the House should not help her. The alderman was out of town, so she could not go to him. After a long conversation the visitor entirely failed to get another point of view and went away grieved and disappointed at a refusal, thinking the resident simply disobliging; wondering, no doubt, why such a mean woman had once been good to her; leaving the resident, on the other hand, utterly baffled and in the state of mind she would have been in, had she brutally insisted that a little child should lift weights too heavy for its undeveloped muscles.
  translation_ja: 二つの基準が正面からぶつかり、双方が理解し、説明しようとするとき、難しさは最も大きい。自分の倫理的な立場を伝えるのが、どうにもできないときがある。学校の基金で用意され、どれも赤い印がはっきり押してある教科書が盗まれ、それを売り買いした女性がいた。逮捕されたので、ある朝ひどく困り果ててハル・ハウスに来て、住民の一人に「裁判官に口をきいてほしい」と頼みこんだ。ハル・ハウスとはもう六年の付き合いがあり、幼い娘を葬ったときにはとてもよくしてもらった、というのが理由だ。その住民は、盗品と分かって教科書を買ったのではないかと強く疑ったが、そのことを話そうとするだけで、相手はひどく失礼だと受け取るようだった。女性は裁判にかけられずに済みたかった。ハル・ハウスが助けてくれない理由は、どう見ても分からないらしい。市会議員が町にいなかったので、その人のところへは行けなかった。長く話をしても、女性には別の見方がまるで分からなかった。断られて悲しみ、失望し、住民がただ不親切なのだと思って帰っていった。こんな意地の悪い人が、なぜ昔は親切にしてくれたのだろう、と不思議に思ったのは、まず間違いない。一方、その住民もすっかり途方に暮れた。まだ筋肉の育っていない幼児に、とうてい持ち上げられない重りを持ち上げろと、むごく言い張ったとしたら、同じ気持ちになっただろう。
  translation_status: reviewed
- id: da-02-048
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:

    precision: page
    printed_page: '57'
    source_sequence: 71
  source_text: As in the matter of dress, more refined and simpler manners and mode of expressions are unseen by them, and they must perforce copy what they know.
  translation_ja: 服と同じで、もっと洗練されて、もっと簡素な作法や気持ちの表し方は、彼らの目に触れない。だから知っているものをまねるほかない。
  translation_status: reviewed
- id: da-02-046
  section_id: ch-02

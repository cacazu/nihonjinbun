  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '54'
    source_sequence: 68
  source_text: The excitement of a chase, the chances of competition, and the love of a fight are all centred in the outward display of crime. The parent who receives charitable aid and yet provides pleasure for his child, and is willing to indulge him in his play, is blindly doing one of the wisest things possible; and no one is more eager for playgrounds and vacation schools than the conscientious charity visitor.
  translation_ja: 追いかける興奮、競い合う機会、ひと勝負したい気持ちがみな、犯罪が外から見せる光景に集まっている。慈善の援助を受けても子どもに楽しみを用意し、好きな遊びをさせてやる親は、それと知らずに、できるかぎり賢明なことの一つをしている。良心的な慈善の訪問員ほど、遊び場や休暇中の学校を設けたいと願う人もいない。
  translation_status: reviewed
- id: da-02-043
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

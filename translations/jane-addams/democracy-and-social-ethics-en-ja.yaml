    precision: page
    printed_page: '59'
    source_sequence: 74
  source_text: Such a situation brings out the impossibility of substituting a higher ethical standard for a lower one without similarity of experience, but it is not as painful as that illustrated by the following example, in which the highest ethical standard yet attained by the charity recipient is broken down, and the substituted one not in the least understood:—
  translation_ja: 似た経験を持たないまま、低い倫理の基準を高い基準に置き換えることはできない。それがこのようなときにはっきりする。だが、以下の例ほど胸が痛むわけではない。この例では、慈善の受け手がこれまでに身につけた最も高い倫理の基準が壊され、代わりに持ち込まれた基準も、まるで理解されないのである。
  translation_status: reviewed
- id: da-02-049
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '59'
    source_sequence: 75
    printed_page_end: '62'
  source_text: A certain charity visitor is peculiarly appealed to by the weakness and pathos of forlorn old age. She is responsible for the well-being of perhaps a dozen old women to whom she sustains a sincerely affectionate and almost filial relation. Some of them learn to take her benefactions quite as if they came from their own relatives, grumbling at all she does, and scolding her with a family freedom. One of these poor old women was injured in a fire years ago. She has but the fragment of a hand left, and is grievously crippled in her feet. Through years of pain she had become addicted to opium, and when she first came under the visitor's care, was only held from the poorhouse by the awful thought that she would there perish without her drug. Five years of tender care have done wonders for her. She lives in two neat little rooms, where with her thumb and two fingers she makes innumerable quilts, which she sells and gives away with the greatest delight. Her opium is regulated to a set amount taken each day, and she has been drawn away from much drinking. She is a voracious reader, and has her head full of strange tales made up from books and her own imagination. At one time it seemed impossible to do anything for her in Chicago, and she was kept for two years in a suburb, where the family of the charity visitor lived, and where she was nursed through several hazardous illnesses. She now lives a better life than she did, but she is still far from being a model old woman. The neighbors are constantly shocked by the fact that she is supported and comforted by a "charity lady," while at the same time she occasionally "rushes the growler," scolding at the boys lest they jar her in her tottering walk. The care of her has broken through even that second standard, which the neighborhood had learned to recognize as the standard of charitable societies, that only the "worthy poor" are to be helped; that temperance and thrift are the virtues which receive the plums of benevolence. The old lady herself is conscious of this criticism. Indeed, irate neighbors tell her to her face that she doesn't in the least deserve what she gets. In order to disarm them, and at the same time to explain what would otherwise seem loving-kindness so colossal as to be abnormal, she tells them that during her sojourn in the suburb she discovered an awful family secret,—a horrible scandal
    connected with the long-suffering charity visitor; that it is in order to prevent the divulgence of this that she constantly receives her ministrations. Some of her perplexed neighbors accept this explanation as simple and offering a solution of this vexed problem. Doubtless many of them have a glimpse of the real state of affairs, of the love and patience which ministers to need irrespective of worth. But the standard is too high for most of them, and it sometimes seems unfortunate to break down the second standard, which holds that people who "rush the growler" are not worthy of charity, and that there is a certain justice attained when they go to the poorhouse. It is certainly dangerous to break down the lower, unless the higher is made clear.
  translation_ja: 寄る辺のない老いの弱さと悲しみに、とりわけ心を動かされる慈善の訪問員がいる。十数人の老女の暮らしに責任を持ち、心からの愛情を注いで、まるで実の娘のように接している。なかには、実の身内からの助けとまったく同じに受けとめるようになり、何をしてもぶつぶつ言い、身内にしか見せない気安さで訪問員を叱る人もいる。この貧しい老女の一人は、何年も前に火事でけがをした。片手はほんの一部しか残らず、足にも重い障害を負った。長年の痛みのためアヘンに頼るようになり、訪問員が世話をし始めたころ、救貧院へ行かなかったのは、そこに入ればアヘンなしで死んでしまうという恐ろしい考えに取りつかれていたからにすぎない。五年にわたる優しい世話は、見事な変化をもたらした。こぢんまりとしたきれいな二部屋に住み、親指と二本の指でキルトをいくつも作り、売ったり人にやったりするのを、心から喜んでいる。アヘンは一日に決められた量を取るようになり、酒の飲みすぎからも遠ざけられた。本をむさぼるように読み、読んだ本と自分の想像をつないでこしらえた不思議な話が、頭にいっぱい詰まっている。一時期はシカゴでできることは何もないと思われ、訪問員の家族が暮らす郊外で二年間暮らし、命にもかかわる病気を何度か看病してもらった。今は以前よりよい生活をしているが、模範的な老女にはほど遠い。「慈善のお嬢さん」に暮らしを支えてもらい、元気づけてもらっているのに、今もときどき「酒を量り売りで買いに走る」。よろよろ歩く自分にぶつからないよう少年たちを叱りつけるのだから、隣人はそのたびに眉をひそめる。この人を世話することは、地域の人々が慈善団体の基準として認めていた、二番目の基準さえ突き破った。「助けるに値する貧しい人」だけを助けるのがよく、節酒と倹約こそ、慈善のおいしい実を受け取れる徳だという基準である。老女自身もこうした非難を知っている。腹を立てた近所の人に、受け取っているものには少しも値しないと、面と向かって言われることさえある。そこで相手を黙らせ、そのままでは尋常でないほど大きな慈しみと見えることに説明をつけるため、老女はこう言う。郊外で暮らしたあいだに、めげずに世話を焼くあの訪問員に関わる、とんでもない家の秘密、ひどい恥さらしを知った。私がそれをばらさないよう、あの人は今もせっせと世話をしてくれるのだ、と。困惑していた近所の人のなかには、厄介な謎を解く簡単な説明だと、その話を受け入れる者もいる。値するかを問わず、必要とする人を世話する愛と辛抱が、本当はあることに、うすうす気づく人も多いに違いない。だがほとんどの人には、この基準は高すぎる。「酒を量り売りで買いに走る」ような人は慈善を受けるに値せず、救貧院に行くのもいくぶん当然だとする二番目の基準を壊すのは、残念なことのように思えるときもある。高い基準がはっきり分からないうちに、低いほうを壊すのは、たしかに危うい。
  translation_status: reviewed
- id: da-02-050
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '63'
    source_sequence: 76
  source_text: Just when our affection becomes large enough to care for the unworthy among the poor as we would care for the unworthy among our own kin, is certainly a perplexing question. To say that it should never be so, is a comment upon our democratic relations to them which few of us would be willing to make.
  translation_ja: 身内なら助けるに値するかを問わず面倒を見るように、貧しい人のなかでも助けに値しないとされる人の面倒を見られるほど、私たちの愛情はいつ広がるのか。実に答えにくい問いだ。そんな日は来ないと言うなら、貧しい人たちと私たちとの民主的な関係について、ほとんどの人が口にしたくないことを言ったことになる。
  translation_status: reviewed
- id: da-02-051
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '63'
    source_sequence: 77
  source_text: Of what use is all this striving and perplexity? Has the experience any value? It is certainly genuine, for it induces an occasional charity visitor to live in a tenement house as simply as the other tenants do. It drives others to give up visiting the poor altogether, because, they claim, it is quite impossible unless the individual becomes a member of a sisterhood, which requires, as some of the Roman Catholic sisterhoods do, that the member first take the vows of obedience and poverty, so that she can have nothing to give save as it is first given to her, and thus she is not harassed by a constant attempt at adjustment.
  translation_ja: こうした苦心や戸惑いは、何の役に立つのだろう。この経験に価値はあるのか。少なくとも偽りのない経験ではある。まれには慈善の訪問員を、ほかの住民と同じように質素に、集合住宅に住まわせるほどの力がある。逆に、貧しい人を訪ねることをすっかりやめてしまう者もいる。ローマ・カトリックの一部の女子修道会のように、まず服従と清貧を誓うよう求める団体に入らなければ、とても続けられないと彼女たちは言う。自分に与えられたもののほかは、与えるものを何も持たないようにすれば、いつも折り合いをつけようとして悩まされることもないのだ。
  translation_status: reviewed
- id: da-02-052
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '64'
    source_sequence: 78
  source_text: Both the tenement-house resident and the sister assume to have put themselves upon the industrial level of their neighbors, although they have left out the most awful element of poverty, that of imminent fear of starvation and a neglected old age.
  translation_ja: 集合住宅に住んだ訪問員も、修道女も、隣人と同じ経済状態に身を置いたつもりでいる。だが、貧困で最も恐ろしいこと、すなわち今にも飢え、老いれば顧みられないかもしれないという恐怖は、取り除いたままである。
  translation_status: reviewed
- id: da-02-053
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '64'
    source_sequence: 79
  source_text: The young charity visitor who goes from a family living upon a most precarious industrial level to her own home in a prosperous part of the city, if she is sensitive at all, is never free from perplexities which our growing democracy forces upon her.
  translation_ja: 暮らしがきわめて不安定な一家のところから、町の裕福な一角にある自宅へ戻る若い慈善の訪問員は、少しでも人の心に敏感なら、成長しつつある民主主義が突きつける戸惑いから、決して自由にはならない。
  translation_status: reviewed
- id: da-02-054
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '64'
    source_sequence: 80
    printed_page_end: '65'
  source_text: We sometimes say that our charity is too scientific, but we would doubtless be much more correct in our estimate if we said that it is not scientific enough. We dislike the entire arrangement of cards alphabetically classified according to streets and names of families, with the unrelated and meaningless details attached to them. Our feeling of revolt is probably not unlike that which afflicted the students of botany and geology in the middle of the last century, when flowers were tabulated in alphabetical order, when geology was taught by colored charts and thin books. No doubt the students, wearied to death, many times said that it was all too scientific, and were much perplexed and worried when they found traces of structure and physiology which their so-called scientific principles were totally unable to account for. But all this happened before science had become evolutionary and scientific at all, before it had a principle of life from within. The very indications and discoveries which formerly perplexed, later illumined and made the study absorbing and vital.
  translation_ja: 私たちの慈善は科学的すぎる、と時に言う人がいる。だが、まだ十分に科学的ではないと言うほうが、疑いもなく正確だろう。通りと家族の名前のアルファベット順にカードを整理し、互いに何の関係もない、意味の分からない細々したことを書き添える。こうした仕組みそのものが気に入らない。私たちがそれに反発する気持ちは、おそらく前世紀半ばの植物学や地質学の学生を悩ませたものに似ている。花が名前のアルファベット順に並べられ、地質学は色のついた図表と薄っぺらな本で教えられたころだ。うんざりした学生は、何度も、あまりに科学的すぎるとこぼしたに違いない。なのに何か構造や生理の手がかりを見つけたとき、いわゆる科学の原理では何一つ説明できず、ひどく困惑したのだろう。だがこれらはすべて、科学がものの変化や成長をとらえるようになり、実際に科学となる以前、その内側に生命を理解する原理を持つ前のことである。以前には学生を惑わせたまさにその兆候や発見が、あとには物事を照らし出し、研究を面白くて生気のあるものにした。
  translation_status: reviewed
- id: da-02-055
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '65'
    source_sequence: 81
    printed_page_end: '66'
  source_text: We are singularly slow to apply this evolutionary principle to human affairs in general, although it is fast being applied to the education of children. We are at last learning to follow the development of the child; to expect certain traits under certain conditions; to adapt methods and matter to his growing mind. No "advanced educator" can allow himself to be so absorbed in the question of what a child ought to be as to exclude the discovery of what he is. But in our charitable efforts we think much more of what a man ought to be than of what he is or of what he may become; and we ruthlessly force our conventions and standards upon him, with a sternness which we would consider stupid indeed did an educator use it in forcing his mature intellectual convictions upon an undeveloped mind.
  translation_ja: この発達の原理は、子どもの教育には急速に応用されつつあるが、人間の営み全般に当てはめることには、ことのほか時間がかかっている。ようやく私たちは、子どもの発達をたどり、ある条件ではある特質が現れることを予期し、育ちつつある心に教え方や内容を合わせることを学んでいる。「進んだ教育者」なら、子どもはどうあるべきかという問いに気を取られ、今どんな子なのかを知ろうともしないわけにはいかない。しかし慈善では、人はどうあるべきかを、その人が今どういう人なのか、どんな人になりうるのかより、ずっと多く考える。自分たちのしきたりや基準を容赦なく、厳しく押しつける。発達の途上にある子どもの心に、大人の出来上がった考えを押しつける教育者がそんな態度を取れば、本当に愚かだと思うほどの厳しさである。
  translation_status: reviewed
- id: da-02-056
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '66'
    source_sequence: 82
    printed_page_end: '68'
  source_text: Let us take the example of a timid child, who cries when he is put to bed because he is afraid of the dark. The "soft-hearted" parent stays with him, simply because he is sorry for him and wants to comfort him. The scientifically trained parent stays with him, because he realizes that the child is in a stage of development in which his imagination has the best of him, and in which it is impossible to reason him out of a belief in ghosts. These two parents, wide apart in point of view, after all act much alike, and both very differently from the pseudo-scientific parent, who acts from dogmatic conviction and is sure he is right. He talks of developing his child's self-respect and good sense, and leaves him to cry himself to sleep, demanding powers of self-control and development which the child does not possess. There is no doubt that our development of charity methods has reached this pseudo-scientific and stilted stage. We have learned to condemn unthinking, ill-regulated kind-heartedness, and we take great pride in mere repression much as the stern parent tells the visitor below how admirably he is rearing the child, who is hysterically crying upstairs and laying the foundation for future nervous disorders. The pseudo-scientific spirit, or rather, the undeveloped stage of our philanthropy, is perhaps most clearly revealed in our tendency to lay constant stress on negative action. "Don't give;" "don't break down self-respect," we are constantly told. We distrust the human impulse as well as the teachings of our own experience, and in their stead substitute dogmatic rules for conduct. We forget that the accumulation of knowledge and the holding of convictions must finally result in the application of that knowledge and those convictions to life itself; that the necessity for activity and a pull upon the sympathies is so severe, that all the knowledge in the possession of the visitor is constantly applied, and she has a reasonable chance for an ultimate intellectual comprehension. Indeed, part of the perplexity in the administration of charity comes from the fact that the type of person drawn to it is the one who insists that her convictions shall not be unrelated to action. Her moral concepts constantly tend to float away from her, unless they have a basis in the concrete relation of life. She is confronted with the task of reducing her scruples
    to action, and of converging many wills, so as to unite the strength of all of them into one accomplishment, the value of which no one can foresee.
  translation_ja: 暗いのが怖いので寝かせると泣く、おくびょうな子を例に取ろう。「情にもろい」親は、ただかわいそうで安心させてやりたいから、そばにいる。科学に基づいて子どもの発達を学んだ親も、そばにいる。それは、今は想像力に圧倒されがちな時期で、幽霊などいないと理屈で納得させることができないと分かっているからだ。考え方ではかけ離れていても、この二人の親は結局、よく似た行動をとる。そしてどちらも、独断で行動し、自分は正しいと信じる、科学を装う親とは、まったく違う。この親は、子どもの自尊心と分別を育てるのだと言い、泣き疲れて眠るまで放っておく。その子にはまだ備わっていない自制心と発達の度合いを求めるのだ。私たちの慈善のやり方は、まちがいなくこの、科学のふりをした、こわばった段階に達している。考えなしで歯止めのない親切心を非難することを覚え、ただ抑えるだけなのにひどく自慢する。厳しい親が階下で客に向かって、どれほど立派に子を育てているかと話すあいだ、子は二階で取り乱して泣き、将来の神経の不調の種をまかれているのとよく似ている。科学らしく装うこの精神、もっと正確に言えば、私たちの慈善がまだ発達していないことは、おそらく何もしないようにと言い続けるところに、いちばんはっきり現れる。「物を与えてはいけない」「自尊心をくじいてはいけない」と、絶えず言われる。自然に起こる人情も、自分たちの経験が教えることも信用せず、独断で決めた振る舞いの規則に置き換える。知識を蓄え、確信を持つことは、最後には知識も確信も暮らしそのものに生かすことにつながらなければならない。そのことを忘れている。行動しなければならず、共感せずにはいられないという力がたいへん強い仕事だからこそ、訪問員は持っている知識を日々の現場で使う。いずれは頭でも実情を理解できるようになる見込みが十分にある。実際、慈善に取り組むうえで困惑する理由の一部は、この仕事に引かれるのが、自分の確信と行動を切り離したくないと強く思う人だからだ。その人の道徳観は、暮らしの具体的な人間関係に土台を持たなければ、絶えず手もとから浮かび去っていきそうになる。良心のためらいを行動に変え、さまざまな人の意志を一つに寄せ、みんなの力を一つの成果に結びつけるという仕事が目の前にある。その仕事にどれほどの価値があるかは、誰にも前もって分からない。
  translation_status: reviewed
- id: da-02-057
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '68'
    source_sequence: 83
    printed_page_end: '69'
  source_text: On the other hand, the young woman who has succeeded in expressing her social compunction through charitable effort finds that the wider social activity, and the contact with the larger experience, not only increases her sense of social obligation but at the same time recasts her social ideals. She is chagrined to discover that in the actual task of reducing her social scruples to action, her humble beneficiaries are far in advance of her, not in charity or singleness of purpose, but in self-sacrificing action. She reaches the old-time virtue of humility by a social process, not in the old way, as the man who sits by the side of the road and puts dust upon his head, calling himself a contrite sinner, but she gets the dust upon her head because she has stumbled and fallen in the road through her efforts to push forward the mass, to march with her fellows. She has socialized her virtues not only through a social aim but by a social process.
  translation_ja: その一方、社会に対して心にやましさを感じ、それを慈善の活動として形にできた若い女性は、活動の場が広がり、より広い経験に触れると、社会への責任をいっそう感じるだけでなく、社会について自分が抱いていた理想も形を変えると分かる。良心からのためらいを実際の行動に変えようとするなかで、助けているつつましい人々は、自分よりはるかに先まで来ていると思い知り、恥ずかしくなる。慈善の心やひたむきさではなく、自分を犠牲にして実際に人を助けることにおいて、である。彼女は謙遜という昔からの徳に、社会の人々と関わる過程を通してたどり着く。道のかたわらに座って自分を悔い改める罪人と呼び、自分で頭に土をかぶるという、昔のような仕方ではない。人々を前へ押し進め、仲間と足並みをそろえようと努力するうちに、道でつまずいて転び、頭に土がかかるのである。社会に向けた目標を持っただけでなく、社会のなかで人と関わる過程により、彼女は自分の徳を社会のものにしたのだ。
  translation_status: reviewed
- id: da-02-058
  section_id: ch-02
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '69'
    source_sequence: 84
    printed_page_end: '70'
  source_text: The Hebrew prophet made three requirements from those who would join the great forward-moving procession led by Jehovah. "To love mercy" and at the same time "to do justly" is the difficult task; to fulfil the first requirement alone is to fall into the error of indiscriminate giving with all its disastrous results; to fulfil the second solely is to obtain the stern policy of withholding, and it results in such a dreary lack of sympathy and understanding that the establishment of justice is impossible. It may be that the combination of the two can never be attained save as we fulfil still the third requirement—"to walk humbly with God," which may mean to walk for many dreary miles beside the lowliest of His creatures, not even in that peace of mind which the company of the humble is popularly supposed to afford, but rather with the pangs and throes to which the poor human understanding is subjected whenever it attempts to comprehend the meaning of life.
  translation_ja: ヘブライの預言者は、ヤハウェが率いる大きな行列に加わって前へ進みたい者に、三つのことを求めた。「慈しみを愛する」と同時に「正義を行う」のは、難しい務めである。第一の求めだけに応えれば、見境なしに与える過ちに陥り、さまざまなひどい結果を招く。第二だけを果たそうとすれば、与えないという厳しい方針に至り、共感も理解もあまりに乏しくなるため、正義を打ち立てることはできない。両方を成し遂げるには、第三の求め、「神とともにへりくだって歩む」にも応えるほかないのかもしれない。それは、神が造った人のうち、最も低いところに置かれた人たちのかたわらを、気の重い道のりを何マイルも歩くということかもしれない。つつましい人々と共にいれば心が安らぐなどと世間では思われているが、その安らぎはなく、むしろ人間の乏しい理解力で人生の意味をつかもうとすれば必ず味わう、痛みと苦しみを抱えて歩くのである。
  translation_status: reviewed
- id: da-03-000
  section_id: ch-03
  kind: heading
  origin: source
  source_languages:

  source_text: CHAPTER VI. EDUCATIONAL METHODS
  translation_ja: 第六章　教育の方法
  translation_status: reviewed
- id: da-06-001
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '178'
    source_sequence: 210
    printed_page_end: '179'
  source_text: As democracy modifies our conception of life, it constantly raises the value and function of each member of the community, however humble he may be. We have come to believe that the most "brutish man" has a value in our common life, a function to perform which can be fulfilled by no one else. We are gradually requiring of the educator that he shall free the powers of each man and connect him with the rest of life. We ask this not merely because it is the man's right to be thus connected, but because we have become convinced that the social order cannot afford to get along without his special contribution. Just as we have come to resent all hindrances which keep us from untrammelled comradeship with our fellows, and as we throw down unnatural divisions, not in the spirit of the eighteenth-century reformers, but in the spirit of those to whom social equality has become a necessity for further social development, so we are impatient to use the dynamic power residing in the mass of men, and demand that the educator free that power. We believe that man's moral idealism is the constructive force of progress, as it has always been; but because every human being is a creative agent and a possible generator of fine enthusiasm, we are sceptical of the moral idealism of the few and demand the education of the many, that there may be greater freedom, strength, and subtilty of intercourse and hence an increase of dynamic power. We are not content to include all men in our hopes, but have become conscious that all men are hoping and are part of the same movement of which we are a part.
  translation_ja: 民主主義が人生についての私たちの考えを変えるにつれ、共同体の一人ひとりが持つ価値と役割は、どれほど目立たない者でも、ますます大きくなる。最も「粗野な人間」にも、共に暮らす私たちにとって価値があり、ほかの誰にも果たせない役割を果たすのだと、私たちは信じるようになった。教育を行う者には、一人ひとりの力を解き放ち、その人を自分以外の人々の暮らしと結びつけることを、次第に求めるようになっている。それが本人の権利だからだけではない。その人ならではの貢献なしで済ませるほど、社会の仕組みには余裕がないと、確信するようになったからだ。仲間と自由に交わるのを妨げるものにはことごとく反発し、不自然な隔たりを取り除く。そのときの気持ちは、十八世紀の改革者のものとは違って、社会の平等は、社会がさらに発達するのに必要になったと考える者の気持ちである。同じように、大勢の人々に宿る活力を使いたくてたまらず、教育を行う者に、その力を解き放つよう求める。人の道徳的な理想こそ、これまでもそうであったように、進歩を築く力だと私たちは信じる。しかし人は誰でも何かを創り、すぐれた熱意を生み出しうるから、少数の人々の道徳的な理想に頼ることには疑いを持ち、多くの人を教育するよう求める。人と人との交わりがより自由に、力強く、細やかになり、その結果、動かす力が増すためだ。皆を自分たちの希望に含めて満足するのではない。皆がそれぞれ希望を抱き、私たちと同じ動きに加わっていることに、気づくようになったのである。
  translation_status: reviewed
- id: da-06-002
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '179'
    source_sequence: 211
    printed_page_end: '180'
  source_text: Many people impelled by these ideas have become impatient with the slow recognition on the part of the educators of their manifest obligation to prepare and nourish the child and the citizen for social relations. The educators should certainly conserve the learning and training necessary for the successful individual and family life, but should add to that a preparation for the enlarged social efforts which our increasing democracy requires. The democratic ideal demands of the school that it shall give the child's own experience a social value; that it shall teach him to direct his own activities and adjust them to those of other people. We are not willing that thousands of industrial workers shall put all of their activity and toil into services from which the community as a whole reaps the benefit, while their mental conceptions and code of morals are narrow and untouched by any uplift which the consciousness of social value might give them.
  translation_ja: こうした考えに促される多くの人は、子どもや市民が社会の人間関係を築けるように備え、育てるのは、教育を行う者の明らかな務めなのに、教育者自身がそこに気づくのが遅いことに、いらだつようになった。個人として、家族の一員としてうまく生きるのに要る知識や訓練は、確かに守らなければならない。そのうえで、民主主義の広がりが求める、もっと広い社会のための取り組みをできるようにすることも加えるべきだ。民主主義の理想は学校に対し、子ども自身の経験に社会的な価値を与えること、自分が何をするかを決め、ほかの人の行動と調整することを教えるよう、求めている。何千人もの労働者が、共同体全体が恩恵を受ける仕事に、活力と労苦を注ぎ込みながら、その人たちの考え方や道徳の規範は狭いままであり、自分が社会で役立つと知ることで得られる励ましも、いっさい受けない。私たちはそれをよしとはしない。
  translation_status: reviewed
- id: da-06-003
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '180'
    source_sequence: 212
    printed_page_end: '181'
  source_text: We are impatient with the schools which lay all stress on reading and writing, suspecting them to rest upon the assumption that the ordinary experience of life is worth little, and that all knowledge and interest must be brought to the children through the medium of books. Such an assumption fails to give the child any clew to the life about him, or any power to usefully or intelligently connect himself with it. This may be illustrated by observations made in a large Italian colony situated in Chicago, the children from which are, for the most part, sent to the public schools.
  translation_ja: 読み書きだけに力を注ぐ学校には、いらだちを感じる。ふつうの暮らしの経験にはほとんど値うちがなく、あらゆる知識も興味も、子どもには本を通して与えなければならないと考えているのではないかと、疑うからだ。その考えでは、身の回りの暮らしを理解する手がかりも、そこに役立つよう、また道理をわきまえて、自ら関われる力も、子どもに与えられない。このことは、シカゴにある大きなイタリア人居住区での観察から分かる。そこの子どもの大半は、公立学校に通わされている。
  translation_status: reviewed
- id: da-06-004
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '181'
    source_sequence: 213
    printed_page_end: '182'
  source_text: The members of the Italian colony are largely from South Italy,—Calabrian and Sicilian peasants, or Neapolitans from the workingmen's quarters of that city. They have come to America with the distinct aim of earning money, and finding more room for the energies of themselves and their children. In almost all cases they mean to go back again, simply because their imaginations cannot picture a continuous life away from the old surroundings. Their experiences in Italy have been those of simple outdoor activity, and their ideas have come directly to them from their struggle with Nature,—such a hand-to-hand struggle as takes place when each man gets his living largely through his own cultivation of the soil, or with tools simply fashioned by his own hands. The women, as in all primitive life, have had more diversified activities than the men. They have cooked, spun, and knitted, in addition to their almost equal work in the fields. Very few of the peasant men or women can either read or write. They are devoted to their children, strong in their family feeling, even to remote relationships, and clannish in their community life.
  translation_ja: イタリア人居住区にいるのは、大方、南イタリアの出身である。カラブリアやシチリアの農民、あるいはナポリの労働者街から来た人々だ。金を稼ぎ、自分と子どもが力を発揮できる余地をもっと得たいという、はっきりした目的を持ってアメリカに来た。ほとんどの場合、いずれ帰る気でいる。昔の環境を離れたままの人生は、どうしても思い描けないからだ。イタリアでは素朴な屋外の仕事をしており、自然と格闘するなかから、一つひとつの考えをじかに得た。一人ひとりが自分で土を耕すか、自分の手でこしらえた簡単な道具で、暮らしの大部分を立てるときの、自然を相手にした、素手で組み合うような闘いである。昔ながらの暮らしがどこでもそうであるように、女性のすることは、男性より多様だった。ほとんど同じように畑で働くほか、料理をし、糸を紡ぎ、編み物もした。農民の男も女も、読み書きができる者はまずいない。子どもに尽くし、遠い親戚にまで家族の情は深く、地域のなかでも仲間同士で固まる。
  translation_status: reviewed
- id: da-06-005
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '182'
    source_sequence: 214
    printed_page_end: '184'
  source_text: The entire family has been upheaved, and is striving to adjust itself to its new surroundings. The men, for the most part, work on railroad extensions through the summer, under the direction of a padrone, who finds the work for them, regulates the amount of their wages, and supplies them with food. The first effect of immigration upon the women is that of idleness. They no longer work in the fields, nor milk the goats, nor pick up faggots. The mother of the family buys all the clothing, not only already spun and woven but made up into garments, of a cut and fashion beyond her powers. It is, indeed, the most economical thing for her to do. Her house-cleaning and cooking are of the simplest; the bread is usually baked outside of the house, and the macaroni bought prepared for boiling. All of those outdoor and domestic activities, which she would naturally have handed on to her daughters, have slipped away from her. The domestic arts are gone, with their absorbing interests for the children, their educational value, and incentive to activity. A household in a tenement receives almost no raw material. For the hundreds of children who have never seen wheat grow, there are dozens who have never seen bread baked. The occasional washings and scrubbings are associated only with discomfort. The child of such a family receives constant stimulus of most exciting sort from his city street life, but he has little or no opportunity to use his energies in domestic manufacture, or, indeed, constructively in any direction. No activity is supplied to take the place of that which, in Italy, he would naturally have found in his own surroundings, and no new union with wholesome life is made for him.
  translation_ja: 家族まるごと根こぎにされ、新しい環境に合わせようと懸命である。男は大方、夏のあいだは鉄道を延ばす工事で働く。仕事を見つけ、賃金の額を決め、食料を支給するパドローネ、つまり労働者の世話役のもとで働く。移住が女性にもたらした最初の変化は、することがなくなることだ。もう畑に出ず、ヤギの乳を搾らず、たきぎも拾わない。一家の母は、着るものをすべて買う。糸を紡いで織ってあるだけでなく、自分ではとてもできない裁ち方や流行の、仕立て上がった服だ。実際、そうするのがいちばん経済的である。掃除も料理もごく簡単で、パンはたいてい家の外で焼かれ、マカロニもゆでるだけにしたものを買う。外での仕事や家の仕事など、自然に娘に受け継がせたであろうことは、みな手を離れてしまった。家で物を作る技は、子どもを夢中にさせ、学ばせ、自分でも動きたくさせる力とともに、なくなった。集合住宅の一家には、素材のまま届くものはほとんどない。麦が育つのを見たことのない子が何百人もいれば、パンを焼くのを見たことのない子も何十人といる。たまの洗濯や床磨きから思い浮かぶのは、不快なことばかりだ。このような家の子どもは、都会の路上の暮らしから、ひどく強い刺激を絶えず受ける。だが家で物を作ることにも、そもそも何かを作ったり育てたりすることにも、力を使う機会はほとんど、あるいはまったくない。イタリアなら身近なところで自然に見つけた活動に代わるものは用意されず、健全な暮らしとの新しい結びつきもつくられない。
  translation_status: reviewed
- id: da-06-006
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '184'
    source_sequence: 215
    printed_page_end: '185'
  source_text: Italian parents count upon the fact that their children learn the English language and American customs before they do themselves, and the children act not only as interpreters of the language, but as buffers between them and Chicago, resulting in a certain almost pathetic dependence of the family upon the child. When a child of the family, therefore, first goes to school, the event is fraught with much significance to all the others. The family has no social life in any structural form and can supply none to the child. He ought to get it in the school and give it to his family, the school thus becoming the connector with the organized society about them. It is the children aged six, eight, and ten, who go to school, entering, of course, the primary grades. If a boy is twelve or thirteen on his arrival in America, his parents see in him a wage-earning factor, and the girl of the same age is already looking toward her marriage.
  translation_ja: イタリア人の親は、子どものほうが先に英語とアメリカの習慣を身につけると当てにしている。子どもは言葉を通訳するだけでなく、親とシカゴのあいだに入って、ぶつかり合いを和らげる。そのため家族が子どもに頼るさまは、いじらしいほどになる。このため、家族の子が初めて学校へ行くのは、ほかの家族みんなにとって大きな意味を持つ。家族には形のある社会生活がなく、子どもにも与えられない。子どもは学校でそれを得て、家族にも伝えるべきだ。そうすれば学校は、周りの組織だった社会と家族をつなぐものになる。学校へ行くのは六歳、八歳、十歳の子で、当然、初等学年に入る。十二歳か十三歳でアメリカに来た男の子なら、親は賃金を稼げる者と見る。同じ年ごろの女の子なら、もう結婚を考え始めている。
  translation_status: reviewed
- id: da-06-007
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '185'
    source_sequence: 216
    printed_page_end: '186'
  source_text: Let us take one of these boys, who has learned in his six or eight years to speak his native language, and to feel himself strongly identified with the fortunes of his family. Whatever interest has come to the minds of his ancestors has come through the use of their hands in the open air; and open air and activity of body have been the inevitable accompaniments of all their experiences. Yet the first thing that the boy must do when he reaches school is to sit still, at least part of the time, and he must learn to listen to what is said to him, with all the perplexity of listening to a foreign tongue. He does not find this very stimulating, and is slow to respond to the more subtle incentives of the schoolroom. The peasant child is perfectly indifferent to showing off and making a good recitation. He leaves all that to his schoolfellows, who are more sophisticated and equipped with better English. His parents are not deeply interested in keeping him in school, and will not hold him there against his inclination. Their experience does not point to the good American tradition that it is the educated man who finally succeeds. The richest man in the Italian colony can neither read nor write—even Italian. His cunning and acquisitiveness, combined with the credulity and ignorance of his countrymen, have slowly brought about his large fortune. The child himself may feel the stirring of a vague ambition to go on until he is as the other children are; but he is not popular with his schoolfellows, and he sadly feels the lack of dramatic interest. Even the pictures and objects presented to him, as well as the language, are strange.
  translation_ja: こうした少年を一人取り上げよう。六年か八年生きるうちに母語を話すことを覚え、自分の運命は家族の運命と強く結びついていると感じるようになっている。彼の祖先が何かに興味を持つことがあれば、戸外で手を使うことから生じた。風に当たり体を動かすことは、彼らの経験のどれにも必ず伴った。それなのに、学校へ着いた少年が最初にしなければならないのは、少なくとも一部の時間、じっと座ることだ。外国語を聞いて戸惑いながら、言われたことに耳を傾けることも覚えなくてはならない。これではあまり心をそそられず、教室で感じられる、もっと微妙な刺激にも、なかなか応じない。農村から来た子には、人前で実力を見せ、うまく暗唱することには、何の関心もない。世間に慣れ、英語の上手な同級生に、そういうことは任せる。親は学校にとどめることに強い関心はなく、本人が嫌がるのを無理に続けさせはしない。教育を受けた人が最後には成功する、というアメリカの立派な言い伝えを、親の経験は裏づけないからだ。イタリア人居住区でいちばん金持ちの男は、イタリア語でさえ、読み書きができない。人をだます知恵と金をためる欲に、同郷の人々の信じやすさと無知とが重なって、次第に大きな富ができた。少年自身には、ほかの子と同じになるまで続けたいという、ぼんやりした向上心が芽生えるかもしれない。しかし同級生のあいだでは人気がなく、胸が躍るようなことがないのを、つらく感じる。言葉だけでなく、見せてもらう絵や物まで、なじみがないのである。
  translation_status: reviewed
- id: da-06-008
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '186'
    source_sequence: 217
    printed_page_end: '187'
  source_text: If we admit that in education it is necessary to begin with the experiences which the child already has and to use his spontaneous and social activity, then the city streets begin this education for him in a more natural way than does the school. The South Italian peasant comes from a life of picking olives and oranges, and he easily sends his children out to pick up coal from railroad tracks, or wood from buildings which have been burned down. Unfortunately, this process leads by easy transition to petty thieving. It is easy to go from the coal on the railroad track to the coal and wood which stand before a dealer's shop; from the potatoes which have rolled from a rumbling wagon to the vegetables displayed by the grocer. This is apt to be the record of the boy who responds constantly to the stimulus and temptations of the street, although in the beginning his search for bits of food and fuel was prompted by the best of motives.
  translation_ja: 教育は、子どもがすでに持つ経験から始め、自然に出てくる、人との関わりのなかでの活動を生かす必要があると認めるなら、都会の通りは、学校より自然な形で、この子の教育を始めてくれる。南イタリアの農民はオリーブやオレンジを摘む暮らしから来たので、子どもに線路の石炭や、焼け落ちた建物の木を拾いに行かせるのに、抵抗がない。残念ながら、この延長に、小さな盗みが容易についてくる。線路の石炭から、燃料屋の前に置いた石炭や薪へ。揺れる荷車から落ちて転がったジャガイモから、食料品店が並べた野菜へ。通りの刺激と誘惑にいつも反応する少年は、こんな道をたどりやすい。初めに燃料や食べ物の残りを探したのは、まったく善い気持ちからだったとしても、である。
  translation_status: reviewed
- id: da-06-009
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '187'
    source_sequence: 218
    printed_page_end: '188'
  source_text: The school has to compete with a great deal from the outside in addition to the distractions of the neighborhood. Nothing is more fascinating than that mysterious "down town," whither the boy longs to go to sell papers and black boots, to attend theatres, and, if possible, to stay all night on the pretence of waiting for the early edition of the great dailies. If a boy is once thoroughly caught in these excitements, nothing can save him from over-stimulation and consequent debility and worthlessness; he arrives at maturity with no habits of regular work and with a distaste for its dulness.
  translation_ja: 学校が競わなくてはならないのは、近所の気晴らしだけでなく、外から来るたくさんの誘惑である。あの謎めいた「中心街」ほど心を引くものはない。少年はそこで新聞を売り、靴を磨き、芝居を見たい。できるなら、大新聞の早版を待つという口実で、夜通しいたい。一度すっかりこうした刺激にとらわれると、刺激が強すぎるために心身が弱り、何もまともにできなくなるのを、誰も止められない。そのまま大人になれば、規則正しく働く習慣は何一つ身につかず、地味な仕事を嫌う。
  translation_status: reviewed
- id: da-06-010
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '188'
    source_sequence: 219
    printed_page_end: '191'
  source_text: On the other hand, there are hundreds of boys of various nationalities who conscientiously remain in school and fulfil all the requirements of the early grades, and at the age of fourteen are found in factories, painstakingly performing their work year after year. These later are the men who form the mass of the population in every industrial neighborhood of every large city; but they carry on the industrial processes year after year without in the least knowing what it is all about. The one fixed habit which the boy carries away with him from the school to the factory is the feeling that his work is merely provisional. In school the next grade was continually held before him as an object of attainment, and it resulted in the conviction that the sole object of present effort is to get ready for something else. This tentative attitude takes the last bit of social stimulus out of his factory work; he pursues it merely as a necessity, and his very mental attitude destroys his chance for a realization of its social value. As the boy in school contracted the habit of doing his work in certain hours and taking his pleasure in certain other hours, so in the factory he earns his money by ten hours of dull work and spends it in three hours of lurid and unprofitable pleasure in the evening. Both in the school and in the factory, in proportion as his work grows dull and monotonous, his recreation must become more exciting and stimulating. The hopelessness of adding evening classes and social entertainments as a mere frill to a day filled with monotonous and deadening drudgery constantly becomes more apparent to those who are endeavoring to bring a fuller life to the industrial members of the community, and who are looking forward to a time when work shall cease to be senseless drudgery with no self-expression on the part of the worker. It sometimes seems that the public schools should contribute much more than they do to the consummation of this time. If the army of school children who enter the factories every year possessed thoroughly vitalized faculties, they might do much to lighten this incubus of dull factory work which presses so heavily upon so large a number of our fellow-citizens. Has our commercialism been so strong that our schools have become insensibly commercialized, whereas we supposed that our industrial life was receiving the broadening and
    illuminating effects of the schools? The training of these children, so far as it has been vocational at all, has been in the direction of clerical work. It is possible that the business men, whom we in America so tremendously admire, have really been dictating the curriculum of our public schools, in spite of the conventions of educators and the suggestions of university professors. The business man, of course, has not said, "I will have the public schools train office boys and clerks so that I may have them easily and cheaply," but he has sometimes said, "Teach the children to write legibly and to figure accurately and quickly; to acquire habits of punctuality and order; to be prompt to obey; and you will fit them to make their way in the world as I have made mine." Has the workingman been silent as to what he desires for his children, and allowed the business man to decide for him there, as he has allowed the politician to manage his municipal affairs, or has the workingman so far shared our universal optimism that he has really believed that his children would never need to go into industrial life at all, but that all of his sons would become bankers and merchants?
  translation_ja: 一方、さまざまな国の出身の少年が何百人も、まじめに学校に通い続け、初等の学年で求められることをすべて果たし、十四歳になると工場に入り、何年も念入りに働いている。のちに大都市のどの工業地区でも住民の大半をなすのは、こういう人たちだ。だが、何年も何年も工場の作業を続けながら、それが全体として何をしているのか、少しも分かっていない。少年が学校から工場へ持っていく、たった一つの根づいた習慣は、目の前の仕事は次までの仮のものにすぎない、という気持ちだ。学校では次の学年が、たどり着くべき目標として絶えず目の前に示された。そのため、今の努力の目的はただ次の何かに備えることだ、と思い込むようになった。この仮の仕事だという態度のため、工場の仕事で社会とつながっている実感は、最後の一かけらまで失われる。必要に迫られて働くにすぎず、その心のあり方自体が、仕事には社会的な価値があると実感する機会を失わせる。学校である時間には勉強し、別の時間には楽しむ習慣を身につけたように、工場では十時間の退屈な仕事で金を稼ぎ、夜の三時間で、派手なだけで身にならない娯楽に使う。学校でも工場でも、仕事が退屈で単調になるほど、気晴らしはもっと興奮させ、刺激するものでなければならない。工業で働く人々に、もっと充実した生活をもたらそうとし、働く者が何一つ自分を表せない、無意味な苦役ではなくなる日を待つ人たちがいる。単調で生気を奪う苦役でいっぱいの一日に、夜の授業や社交の娯楽を、ただの飾りのようにつけ足しても、望みがないことは、その人たちにますますはっきりしている。その日を実現するために、公立学校は今よりずっと多くのことをできるはずだと、思えるときがある。毎年工場に入る大勢の生徒の力が、十分に生き生きと働いていれば、仲間であるこれほど多くの市民を重く圧する、工場での退屈な仕事という悪夢を和らげるために、多くのことができるかもしれない。学校のおかげで産業での暮らしの視野が広まり、物事がよく見えるようになると思っていたのに、実は商売の力があまりにも強く、私たちの学校がいつのまにか商売のためのものになったのだろうか。この子どもたちの訓練が職業に向けられたとしても、向け先は事務の仕事だった。教育者が大会を開き、大学教授が提案をしても、実際に公立学校の教える内容を指図してきたのは、アメリカで私たちがあれほど敬う商売人だったのかもしれない。もちろん、商売人は「小使いや事務員をたやすく安く雇いたいから、公立学校に育てさせる」とは言っていない。一方で、「読みやすい字を書き、正確に素早く計算し、時間を守り、きちんとする習慣をつけ、言われたらすぐ従うことを教えてください。そうすれば私がしたように、その子たちも世で身を立てられるでしょう」と言うことはある。労働者は、自分の子どもに何を望むかについて沈黙し、市の仕事を政治家に任せるのと同じように、商売人に自分の代わりに決めさせてきたのだろうか。それとも、世間一般の楽観をあまりに深く共有して、自分の子どもたちは工場などで働く必要はなく、息子は全員、銀行家や商人になると本当に信じたのだろうか。
  translation_status: reviewed
- id: da-06-011
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '192'
    source_sequence: 220
  source_text: Certain it is that no sufficient study has been made of the child who enters into industrial life early and stays there permanently, to give him some offset to its monotony and dulness, some historic significance of the part he is taking in the life of the community.
  translation_ja: 確かなのは、早く産業の現場に入り、そこでずっと働く子どもについて、十分な研究が行われてこなかったことだ。単調さと退屈さを少しでも埋め合わせ、自分が共同体の暮らしで果たしている役割が、これまで社会が歩いてきた道にどんな意味を持つかを、その子に伝えるための研究である。
  translation_status: reviewed
- id: da-06-012
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '192'
    source_sequence: 221
  source_text: It is at last on behalf of the average workingmen that our increasing democracy impels us to make a new demand upon the educator. As the political expression of democracy has claimed for the workingman the free right of citizenship, so a code of social ethics is now insisting that he shall be a conscious member of society, having some notion of his social and industrial value.
  translation_ja: 民主主義が広がるにつれ、ようやく、ふつうの労働者のために、教育を行う者に新しいことを求めるよう促されている。民主主義が政治の形で表れたときには、労働者が自由な市民としての権利を享受できるよう求めた。同じように、いま社会倫理は、労働者が、自分が社会の一員であることを自覚し、社会でも働く場でも自分がどんな価値を持つか、いくらか理解できるようにと求めている。
  translation_status: reviewed
- id: da-06-013
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '192'
    source_sequence: 222
    printed_page_end: '193'
  source_text: The early ideal of a city that it was a market-place in which to exchange produce, and a mere trading-post for merchants, apparently still survives in our minds and is constantly reflected in our schools. We have either failed to realize that cities have become great centres of production and manufacture in which a huge population is engaged, or we have lacked sufficient presence of mind to adjust ourselves to the change. We admire much more the men who accumulate riches, and who gather to themselves the results of industry, than the men who actually carry forward industrial processes; and, as has been pointed out, our schools still prepare children almost exclusively for commercial and professional life.
  translation_ja: 都市は産物を交換する市場であり、商人の交易の拠点にすぎないという初期の考えが、どうやら私たちの頭にはまだ残り、学校にも絶えず映し出されている。都会が、非常に多くの人が携わる、生産・製造の大きな中心になったことに気づかなかったのか、その変化に自分たちを合わせるだけの、機転が足りなかったのか、どちらかである。私たちは、生産の仕事を実際に先へ進める人より、その成果を手もとに集め、富を蓄える人に、ずっと感心する。すでに述べたとおり、学校も、ほとんどもっぱら商売か専門職で暮らすように、子どもを育てている。
  translation_status: reviewed
- id: da-06-014
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '193'
    source_sequence: 223
    printed_page_end: '194'
  source_text: Quite as the country boy dreams of leaving the farm for life in town and begins early to imitate the travelling salesman in dress and manner, so the school boy within the town hopes to be an office boy, and later a clerk or salesman, and looks upon work in the factory as the occupation of ignorant and unsuccessful men. The schools do so little really to interest the child in the life of production, or to excite his ambition in the line of industrial occupation, that the ideal of life, almost from the very beginning, becomes not an absorbing interest in one's work and a consciousness of its value and social relation, but a desire for money with which unmeaning purchases may be made and an unmeaning social standing obtained.
  translation_ja: 田舎の少年が、農場を出て町で暮らすことを夢見て、早くから旅回りのセールスマンの装いや物腰をまねる。それと同じように町の生徒も小使いになり、のちに事務員や販売員になりたいと思う。工場は学がなく、出世しなかった者の仕事だと見る。学校は、生産する人々の暮らしに子どもが本当に関心を持つようにも、工場などでの仕事に意欲を持つようにも、ほとんど何もしない。だから人生で何を目指すかは、ほとんど初めから、仕事に夢中になり、その価値と社会との関わりを知ることではなくなっている。意味のない物を買い、意味のない社会的地位を手に入れるために、金を欲しがることが人生の理想となる。
  translation_status: reviewed
- id: da-06-015
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '194'
    source_sequence: 224
    printed_page_end: '195'
  source_text: The son of a workingman who is successful in commercial life, impresses his family and neighbors quite as does the prominent city man when he comes back to dazzle his native town. The children of the working people learn many useful things in the public schools, but the commercial arithmetic, and many other studies, are founded on the tacit assumption that a boy rises in life by getting away from manual labor,—that every promising boy goes into business or a profession. The children destined for factory life are furnished with what would be most useful under other conditions, quite as the prosperous farmer's wife buys a folding-bed for her huge four-cornered "spare room," because her sister, who has married a city man, is obliged to have a folding-bed in the cramped limits of her flat Partly because so little is done for him educationally, and partly because he must live narrowly and dress meanly, the life of the average laborer tends to become flat and monotonous, with nothing in his work to feed his mind or hold his interest. Theoretically, we would all admit that the man at the bottom, who performs the meanest and humblest work, so long as the work is necessary, performs a useful function; but we do not live up to our theories, and in addition to his hard and uninteresting work he is covered with a sort of contempt, and unless he falls into illness or trouble, he receives little sympathy or attention. Certainly no serious effort is made to give him a participation in the social and industrial life with which he comes in contact, nor any insight and inspiration regarding it.
  translation_ja: 労働者の息子が商売で成功すると、都会で名を上げた男が、生まれた町に戻って人々の目を見張らせるのと同じように、家族や隣人に深い印象を与える。働く人の子どもは公立学校で役に立つことをたくさん学ぶが、商業のための算術や多くの科目には、暗黙の前提がある。少年が世に出るのは手仕事から離れることであり、見込みのある少年は誰でも、商売か専門職に入るという前提だ。将来工場で働く子どもには、別の条件のもとでいちばん役に立つものが与えられる。都会の人と結婚した妹が狭いアパートに折り畳みベッドを置かざるをえないからといって、裕福な農家の妻が広々した四角い「客間」に、折り畳みベッドを買うようなものだ。教育の面でほとんど何もしてもらえないことも、つつましく暮らし、粗末な服を着るほかないこともあり、ふつうの労働者の暮らしは平板で単調になりがちだ。その仕事には、頭を養い、興味を持ち続けさせるものが何もない。いちばん下で最も地味な、つまらない仕事をする人も、それが必要な仕事であるかぎり、役に立つことをしている。理屈のうえでは誰もが認めるだろう。だが現実にはその理屈どおりに暮らさず、その人はきつくて面白くない仕事に加えて、軽蔑のようなものまで浴びる。病気や何かの困りごとに陥らなければ、同情されることも、気にかけられることもほとんどない。実際に触れる社会や産業の暮らしに、本人が主体的に加われるようにしたり、その仕組みを知り、そこから励まされる機会を与えたりするためには、真剣な努力がなされていない。
  translation_status: reviewed
- id: da-06-016
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '195'
    source_sequence: 225
    printed_page_end: '196'
  source_text: Apparently we have not yet recovered manual labor from the deep distrust which centuries of slavery and the feudal system have cast upon it. To get away from menial work, to do obviously little with one's hands, is still the desirable status. This may readily be seen all along the line. A workingman's family will make every effort and sacrifice that the brightest daughter be sent to the high school and through the normal school, quite as much because a teacher in the family raises the general social standing and sense of family consequence, as that the returns are superior to factory or even office work. "Teacher" in the vocabulary of many children is a synonym for women-folk gentry, and the name is indiscriminately applied to women of certain dress and manner. The same desire for social advancement is expressed by the purchasing of a piano, or the fact that the son is an office boy, and not a factory hand. The overcrowding of the professions by poorly equipped men arises from much the same source, and from the conviction that "an education" is wasted if a boy goes into a factory or shop.
  translation_ja: 何世紀もの奴隷制と封建制度が、手を動かす労働にかぶせた根深い不信を、私たちはまだ取り除けていないようだ。下働きから離れ、目に見えて自分の手ではほとんど何もしないのが、今も望ましい地位である。どこを見ても、すぐそう分かる。労働者の家族は、いちばん利発な娘を高校へ行かせ、教員養成学校を卒業させるため、あらゆる苦労と犠牲を引き受ける。工場や事務の仕事より実入りがよいからというだけではない。一家に教師が出れば、家全体の社会的地位が上がり、自分たちを大切な人間だと感じられるからでもある。子どもの多くにとって「先生」とは上品な婦人の別名であり、服装や物腰がそれらしければ、見境なくそう呼ぶ。ピアノを買うことや、息子が工場労働者でなく事務所の使い走りをしていることにも、同じ、社会で上に行きたい気持ちが現れている。力量の乏しい人が専門職にひしめくのも、大方は同じ原因、そして少年が工場や作業場に入れば「教育」は無駄になるという確信から生じる。
  translation_status: reviewed
- id: da-06-017
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '196'
    source_sequence: 226
    printed_page_end: '197'
  source_text: A Chicago manufacturer tells a story of twin boys, whom he befriended and meant to give a start in life. He sent them both to the Athenæum for several winters as a preparatory business training, and then took them into his office, where they speedily became known as the bright one and the stupid one. The stupid one was finally dismissed after repeated trials, when to the surprise of the entire establishment, he quickly betook himself into the shops, where he became a wide-awake and valuable workman. His chagrined benefactor, in telling the story, admits that he himself had fallen a victim to his own business training and his early notion of rising in life. In reality he had merely followed the lead of most benevolent people who help poor boys. They test the success of their efforts by the number whom they have taken out of factory work into some other and "higher occupation."
  translation_ja: シカゴのある製造業者が、自分が世話をし、世に出るきっかけを与えようとした双子の少年の話をする。二人とも、商売の予備教育のため、何年か冬のあいだアセニアムに通わせ、それから自分の事務所に雇った。二人はすぐに、利発なほうと、鈍いほうと呼ばれるようになった。鈍いほうは何度も試されたあと、とうとう解雇された。ところが会社じゅうが驚いたことに、さっさと作業場へ行き、目配りが利く、頼りがいのある職人になった。この話をする恩人は、恥ずかしそうに、商売の訓練と、若いころからの出世観に、自分自身がとらわれていたと認める。実のところ、貧しい少年を助ける慈善家の大半のまねをしただけだった。どれだけの少年を工場から引き出し、何かほかの「より上の職業」につかせたかで、努力が実ったかを測る人々である。
  translation_status: reviewed
- id: da-06-018
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '197'
    source_sequence: 227
    printed_page_end: '198'
  source_text: Quite in line with this commercial ideal are the night schools and institutions of learning most accessible to working people. First among them is the business college which teaches largely the mechanism of type-writing and book-keeping, and lays all stress upon commerce and methods of distribution. Commodities are treated as exports and imports, or solely in regard to their commercial value, and not, of course, in relation to their historic development or the manufacturing processes to which they have been subjected. These schools do not in the least minister to the needs of the actual factory employee, who is in the shop and not in the office. We assume that all men are searching for "puddings and power," to use Carlyle's phrase, and furnish only the schools which help them to those ends.
  translation_ja: 労働者がいちばん利用しやすい夜間学校や教育機関も、すっかりこの商業の理想に沿っている。その第一が商業学校で、主にタイプライターと簿記の手順を教え、商取引と流通の方法に力を入れる。商品を輸出品や輸入品として、あるいは単に商業上の価値で扱い、歴史のなかでどのように発達し、どんな工程を経て作られたかは、もちろん考えない。こうした学校は、事務所でなく作業場にいる、実際の工場労働者が必要とするものには、まったく応えない。カーライルの言い方を借りれば、誰もが「腹を満たすものと権力」を探すものだと決めて、その目的に役立つ学校だけを用意している。
  translation_status: reviewed
- id: da-06-019
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '198'
    source_sequence: 228
    printed_page_end: '199'
  source_text: The business college man, or even the man who goes through an academic course in order to prepare for a profession, comes to look on learning too much as an investment from which he will later reap the benefits in earning money. He does not connect learning with industrial pursuits, nor does he in the least lighten or illuminate those pursuits for those of his friends who have not risen in life. "It is as though nets were laid at the entrance to education, in which those who by some means or other escape from the masses bowed down by labor, are inevitably caught and held from substantial service to their fellows." The academic teaching which is accessible to workingmen through University Extension lectures and classes at settlements, is usually bookish and remote, and concerning subjects completely divorced from their actual experiences. The men come to think of learning as something to be added to the end of a hard day's work, and to be gained at the cost of toilsome mental exertion. There are, of course, exceptions, but many men who persist in attending classes and lectures year after year find themselves possessed of a mass of inert knowledge which nothing in their experience fuses into availability or realization.
  translation_ja: 商業学校に通う者や、専門職に備えて学問の課程を修める者まで、学ぶことは、のちに金を稼いで利益を得るための投資だと、考えすぎるようになる。知識を働く人々の仕事と結びつけず、世に出なかった友人たちが仕事を楽にしたり、意味をよく分かるようにしたりすることにも、少しも役立てない。「まるで教育の入口に網を張って、労働に打ちひしがれた大勢のなかから、どうにか脱した者を必ず捕まえ、仲間に本当に役立つことができないようにしておくようだ」。大学の公開講座やセツルメントの教室で労働者にも手が届く学問の教えは、ふつう書物に偏り、暮らしから遠く、本人の実際の経験とはまったく切り離されたことを扱う。そうなると、学ぶことは、骨の折れる一日の仕事の最後につけ足すもので、つらい思いをして頭を使った対価として得るものだと考えるようになる。もちろん例外はあるが、何年も授業や講演に通い続ける人の多くは、生かされない知識を山ほど抱えることになる。自分の経験には、その知識を溶かして使えるようにしたり、身にしみて分かるようにしたりするものが、何もないからだ。
  translation_status: reviewed
- id: da-06-020
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '199'
    source_sequence: 229
    printed_page_end: '201'
  source_text: Among the many disappointments which the settlement experiment has brought to its promoters, perhaps none is keener than the fact that they have as yet failed to work out methods of education, specialized and adapted to the needs of adult working people in contra-distinction to those employed in schools and colleges, or those used in teaching children. There are many excellent reasons and explanations for this failure. In the first place, the residents themselves are for the most part imbued with academic methods and ideals, which it is most difficult to modify. To quote from a late settlement report, "The most vaunted educational work in settlements amounts often to the stimulation mentally of a select few who are, in a sense, of the academic type of mind, and who easily and quickly respond to the academic methods employed." These classes may be valuable, but they leave quite untouched the great mass of the factory population, the ordinary workingman of the ordinary workingman's street, whose attitude is best described as that of "acquiescence," who lives through the aimless passage of the years without incentive "to imagine, to design, or to aspire." These men are totally untouched by all the educational and philanthropic machinery which is designed for the young and the helpless who live on the same streets with them. They do not often drink to excess, they regularly give all their wages to their wives, they have a vague pride in their superior children; but they grow prematurely old and stiff in all their muscles, and become more and more taciturn, their entire energies consumed in "holding a job."
  translation_ja: 地域に住み込んで活動するセツルメントという試みは、始めた人々に多くの失望をもたらした。おそらく最もつらいのは、学校や大学で使う方法とも、子どもに教える方法とも違う、大人の労働者に必要なものに特化した教育方法を、まだつくれないことだ。この失敗には、もっともな理由と説明がいくつもある。まず、そこに住み込む活動家そのものが、大方、学校で覚えた方法と理想に染まっていて、それを変えるのはことのほか難しい。最近のあるセツルメントの報告には「最も得意に語られるセツルメントの教育も、しばしば限られた人々を知的に刺激するだけに終わる。ある意味、学問に向いた頭を持ち、学校式の方法にすぐ、たやすく応じられる人たちである」とある。こうした講座には価値があるかもしれない。だが、工場で働く大勢の人、ごくふつうの労働者街のごくふつうの労働者には、まるで届かない。彼らの態度は、「仕方がないと思って従う」と言うのがいちばん近い。「思い描き、計画し、何かを目指す」きっかけもなく、はっきりした目的のない年月を過ごす。若い人や頼るもののない人が同じ通りに住んでおり、その人々のためにつくられた教育や慈善のしくみも、彼らには少しも届いていない。酒を飲みすぎることもあまりなく、きちんと賃金をすべて妻に渡し、自分より優れた子どもをぼんやり誇りに思う。しかし人よりも早く老けて全身の筋肉がこわばり、次第に無口になる。力はすべて、「仕事にしがみつく」ことに使い果たされる。
  translation_status: reviewed
- id: da-06-021
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '201'
    source_sequence: 230
    printed_page_end: '202'
  source_text: Various attempts have been made to break through the inadequate educational facilities supplied by commercialism and scholarship, both of which have followed their own ideals and have failed to look at the situation as it actually presents itself. The most noteworthy attempt has been the movement toward industrial education, the agitation for which has been ably seconded by manufacturers of a practical type, who have from time to time founded and endowed technical schools, designed for workingmen's sons. The early schools of this type inevitably reflected the ideal of the self-made man. They succeeded in transferring a few skilled workers into the upper class of trained engineers, and a few less skilled workers into the class of trained mechanics, but did not aim to educate the many who are doomed to the unskilled work which the permanent specialization of the division of labor demands.
  translation_ja: 商業と学問が用意した不十分な教育の機会から抜け出そうと、さまざまな試みがなされてきた。どちらも自分たちの理想を追うばかりで、ありのままの実情を見なかったからだ。最も注目すべき試みは、産業教育を求める動きである。実務に通じた製造業者が、この運動をよく後押しして、折に触れ、労働者の息子のための技術学校を設立し、資金を出してきた。初期のこうした学校は、どうしても、自力で身を立てるという理想を映した。少数の熟練労働者を、専門教育を受けた技師という上の階層に移し、熟練の程度がもう少し低い何人かを、訓練を受けた機械工にすることには成功した。しかし分業が固定するなかで必要とされる、熟練の要らない仕事をせざるをえない大勢の人々を、教育しようとはしなかった。
  translation_status: reviewed
- id: da-06-022
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '202'
    source_sequence: 231
  source_text: The Peter Coopers and other good men honestly believed that if intelligence could be added to industry, each workingman who faithfully attended these schools could walk into increased skill and wages, and in time even become an employer himself. Such schools are useful beyond doubt; but so far as educating workingmen is concerned or in any measure satisfying the democratic ideal, they plainly beg the question.
  translation_ja: ピーター・クーパーや、それと同様に善意のある人たちは、仕事に知識を加えられさえすれば、きちんと学校に通う労働者は一人ひとり、技術を高め、賃金を上げ、やがては自分が雇い主にもなれると、本気で信じていた。こうした学校が役立つことは、疑いない。ただし、働く人々を教育することや、少しでも民主主義の理想を満たすことを考えるなら、肝心の問題は明らかに棚上げにされている。
  translation_status: reviewed
- id: da-06-023
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '202'
    source_sequence: 232
    printed_page_end: '204'
  source_text: Almost every large city has two or three polytechnic institutions founded by rich men, anxious to help "poor boys." These have been captured by conventional educators for the purpose of fitting young men for the colleges and universities. They have compromised by merely adding to the usual academic course manual work, applied mathematics, mechanical drawing and engineering. Two schools in Chicago, plainly founded for the sons of workingmen, afford an illustration of this tendency and result. On the other hand, so far as schools of this type have been captured by commercialism, they turn out trained engineers, professional chemists, and electricians. They are polytechnics of a high order, but do not even pretend to admit the workingman with his meagre intellectual equipment. They graduate machine builders, but not educated machine tenders. Even the textile schools are largely seized by young men who expect to be superintendents of factories, designers, or manufacturers themselves, and the textile worker who actually "holds the thread" is seldom seen in them; indeed, in one of the largest schools women are not allowed, in spite of the fact that spinning and weaving have traditionally been woman's work, and that thousands of women are at present employed in the textile mills.
  translation_ja: ほとんどどの大都市にも、「貧しい少年」の役に立ちたいと願う富裕な人が建てた工科教育の機関が二つか三つある。そこを従来型の教育者が手中に収め、青年を大学に入れるために使っている。ふつうの学問の課程に手作業、応用数学、機械製図と工学を足すだけで折り合いをつけたのだ。もともと明らかに労働者の息子のために建てられたシカゴの二校が、この傾向と結果を示している。反対に、こうした学校が商業に取り込まれると、訓練された技師、専門の化学者、電気技術者を送り出す。水準の高い工科学校ではあるが、学校で学んだ知識がわずかしかない労働者を入れるつもりだと、建前でさえ言わない。卒業させるのは機械を作る人であり、知識のある機械の使い手ではない。繊維専門の学校でさえ、大方は工場の監督者、設計者、あるいは自ら製造業者になるつもりの青年に占められ、実際に「糸を手に取る」繊維労働者は、めったに見られない。実際、最大級の学校の一つは女性の入学を認めない。糸を紡ぎ布を織るのは昔から女性の仕事であり、今も何千人もの女性が繊維工場で働くのに、である。
  translation_status: reviewed
- id: da-06-024
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '204'
    source_sequence: 233
    printed_page_end: '205'
  source_text: It is much easier to go over the old paths of education with "manual training" thrown in, as it were; it is much simpler to appeal to the old ambitions of "getting on in life," or of "preparing for a profession," or "for a commercial career," than to work out new methods on democratic lines. These schools gradually drop back into the conventional courses, modified in some slight degree, while the adaptation to workingmen's needs is never made, nor, indeed, vigorously attempted. In the meantime, the manufacturers continually protest that engineers, especially trained for devising machines, are not satisfactory. Three generations of workers have invented, but we are told that invention no longer goes on in the workshop, even when it is artificially stimulated by the offer of prizes, and that the inventions of the last quarter of the nineteenth century have by no means fulfilled the promise of the earlier three-quarters.
  translation_ja: 昔ながらの教育の道を歩み、そこに「手を使う訓練」をおまけにつけるほうが、はるかに簡単だ。「世の中で出世する」「専門職の準備をする」「商売の道に進む」といった昔からの野心に訴えるほうが、民主的な考えに沿って新しい方法を見いだすより、ずっと単純である。こうした学校の課程は、多少変わるにせよ、次第に従来のものに戻る。働く人が必要とすることに合わせることはなく、本腰を入れて試みるのですらない。その一方で、工場主は、機械を開発するため特に教育された技師は役に立たないと、絶えず不満を言う。三世代の労働者はずっと発明をしてきたが、褒賞で人為的に促しても、もう作業場で発明は行われず、十九世紀の最後の四半世紀の発明は、それ以前の四分の三の期間に見えた見込みに、とうてい応えなかった、と私たちは聞く。
  translation_status: reviewed
- id: da-06-025
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '205'
    source_sequence: 234
  source_text: 'Every foreman in a large factory has had experience with two classes of men: first with those who become rigid and tolerate no change in their work, partly because they make more money "working by the piece," when they stick to that work which they have learned to do rapidly, and partly because the entire muscular and nervous system has become by daily use adapted to particular motions and resents change. Secondly, there are the men who float in and out of the factory, in a constantly changing stream. They "quit work" for the slightest reason or none at all, and never become skilled at anything. Some of them are men of low intelligence, but many of them are merely too nervous and restless, too impatient, too easily "driven to drink," to be of any use in a modern factory. They are the men for whom the demanded adaptation is impossible.'
  translation_ja: 大きな工場の職長なら、二種類の労働者を扱った経験がある。第一は、やり方が固まってしまい、仕事に変化があることを少しも許さない人たちだ。一つには、早くできるようになった仕事だけにとどまって「出来高払い」で働けば、金が多く手に入る。もう一つには、筋肉も神経も、毎日使ううちに決まった動きにすっかりなじんで、変化を嫌うからだ。第二には、工場を出たり入ったり、絶えず顔ぶれを変える流れのような人たちがいる。ささいな理由で、あるいは何の理由もなく「仕事をやめ」、何の腕前も身につけない。知性が乏しい人もなかにはいるが、多くはただ神経が張り詰め、落ち着きも辛抱もなく、すぐ「酒に追いやられる」ため、現代の工場にとって役に立てないだけだ。求められた条件に自分を合わせることができない人たちなのである。
  translation_status: reviewed
- id: da-06-026
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '205'
    source_sequence: 235
    printed_page_end: '206'
  source_text: The individual from whom the industrial order demands ever larger drafts of time and energy, should be nourished and enriched from social sources, in proportion as he is drained. He, more than other men, needs the conception of historic continuity in order to reveal to him the purpose and utility of his work, and he can only be stimulated and dignified as he obtains a conception of his proper relation to society. Scholarship is evidently unable to do this for him; for, unfortunately, the same tendency to division of labor has also produced over-specialization in scholarship, with the sad result that when the scholar attempts to minister to a worker, he gives him the result of more specialization rather than an offset from it. He cannot bring healing and solace because he himself is suffering from the same disease. There is indeed a deplorable lack of perception and adaptation on the part of educators all along the line.
  translation_ja: 産業の仕組みから、ますます多くの時間と力を出すよう求められる人は、消耗するのに応じて、社会から得られるもので養われ、豊かにならなければならない。自分の仕事の目的と有用さを知るには、ほかの人以上に、歴史はつながっているという考えを必要とする。社会との関係で自分が占める場所を思い描けるようになって初めて、励まされ、尊厳を得られる。学問には明らかに、その人のためにそうする力がない。残念ながら、分業を進めるのと同じ傾向が学問も細かく分かれすぎるものにした。その悲しい結果として、学者が労働者に役立とうとしても、さらに専門化した成果を与えるだけで、行き過ぎを補うものは与えない。自分も同じ病を患っているため、癒やしも慰めももたらせない。実際、教育を行う人々はどの段階でも、事情を見抜いてそれに対応する力を、嘆かわしいほど欠いている。
  translation_status: reviewed
- id: da-06-027
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '206'
    source_sequence: 236
    printed_page_end: '207'
  source_text: It will certainly be embarrassing to have our age written down triumphant in the matter of inventions, in that our factories were filled with intricate machines, the result of advancing mathematical and mechanical knowledge in relation to manufacturing processes, but defeated in that it lost its head over the achievement and forgot the men. The accusation would stand, that the age failed to perform a like service in the extension of history and art to the factory employees who ran the machines; that the machine tenders, heavy and almost dehumanized by monotonous toil, walked about in the same streets with us, and sat in the same cars; but that we were absolutely indifferent and made no genuine effort to supply to them the artist's perception or student's insight, which alone could fuse them into social consciousness. It would further stand that the scholars among us continued with yet more research, that the educators were concerned only with the young and the promising, and the philanthropists with the criminals and helpless.
  translation_ja: 私たちの時代について、後の人がこう書いたら、確かに恥ずかしい。製造の工程に応用される数学と機械の知識が進んだ結果、工場は入り組んだ機械でいっぱいになった。それゆえ発明では勝利したが、成果に浮かれ、働く人を忘れたため、そこでは敗北した、と。こう責められるだろう。時代は機械を動かす人々に歴史や芸術を広げ、発明と同じように役立てることができなかった。単調な仕事で鈍り、ほとんど人間らしさを失った機械の使い手が、私たちと同じ通りを歩き、同じ電車に座っていたのに、私たちはまったく無関心だった。芸術家が物を見る力や、学ぶ者の見通す力を伝えるために、本気で取り組まなかった。その力だけが、人々を社会に対する自覚のなかで結び合わせられたというのに。さらにこう書かれるだろう。学者はもっと研究を続け、教育者は若く見込みのある人だけを、慈善家は犯罪者と頼るすべのない人だけを、気にかけた、と。
  translation_status: reviewed
- id: da-06-028
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '207'
    source_sequence: 237
    printed_page_end: '208'
  source_text: There is a pitiful failure to recognize the situation in which the majority of working people are placed, a tendency to ignore their real experiences and needs, and, most stupid of all, we leave quite untouched affections and memories which would afford a tremendous dynamic if they were utilized.
  translation_ja: 働く人々の多数がどんな状況にいるかを、情けないほど理解していない。実際の経験や必要から目をそらしがちであり、いちばん愚かなことには、活用すれば大きな原動力となるはずの愛情や記憶に、ほとんど手も触れずにいる。
  translation_status: reviewed
- id: da-06-029
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '208'
    source_sequence: 238
    printed_page_end: '209'
  source_text: We constantly hear it said in educational circles, that a child learns only by "doing," and that education must proceed "through the eyes and hands to the brain"; and yet for the vast number of people all around us who do not need to have activities artificially provided, and who use their hands and eyes all the time, we do not seem able to reverse the process. We quote the dictum, "What is learned in the schoolroom must be applied in the workshop," and yet the skill and handicraft constantly used in the workshop have no relevance or meaning given to them by the school; and when we do try to help the workingman in an educational way, we completely ignore his everyday occupation. Yet the task is merely one of adaptation. It is to take actual conditions and to make them the basis for a large and generous method of education, to perform a difficult idealization doubtless, but not an impossible one.
  translation_ja: 子どもは「やってみる」ことでしか学ばず、教育は「目や手を通して頭へ」進まなければならないと、教育界では絶えず耳にする。ところが私たちの周囲には、わざわざ活動を用意する必要もなく、手と目をいつも使っている者が大勢いるのに、反対の向きに同じ原理を用いることは、できそうもない。「教室で学んだことは作業場で使わなければならない」という格言を引きながら、作業場で絶えず使う技量や手仕事には、学校が何のつながりも意味も与えない。労働者に教育で何か役立とうとするときも、その人の日々の仕事はまったく無視する。だが、すべきなのはただ、実情に合わせることだ。現実の条件を、広い視野を持ち、十分に人を育てる教育の土台にする。そこから理想の形を描くのは、疑いなく難しいが、不可能ではない。
  translation_status: reviewed
- id: da-06-030
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '209'
    source_sequence: 239
    printed_page_end: '211'
  source_text: We apparently believe that the workingman has no chance to realize life through his vocation. We easily recognize the historic association in regard to ancient buildings. We say that "generation after generation have stamped their mark upon them, have recorded their thoughts in them, until they have become the property of all." And yet this is even more true of the instruments of labor, which have constantly been held in human hands. A machine really represents the "seasoned life of man" preserved and treasured up within itself, quite as much as an ancient building does. At present, workmen are brought in contact with the machinery with which they work as abruptly as if the present set of industrial implements had been newly created. They handle the machinery day by day, without any notion of its gradual evolution and growth. Few of the men who perform the mechanical work in the great factories have any comprehension of the fact that the inventions upon which the factory depends, the instruments which they use, have been slowly worked out, each generation using the gifts of the last and transmitting the inheritance until it has become a social possession. This can only be understood by a man who has obtained some idea of social progress. We are still childishly pleased when we see the further subdivision of labor going on, because the quantity of the output is increased thereby, and we apparently are unable to take our attention away from the product long enough to really focus it upon the producer. Theoretically, "the division of labor" makes men more interdependent and human by drawing them together into a unity of purpose. "If a number of people decide to build a road, and one digs, and one brings stones, and another breaks them, they are quite inevitably united by their interest in the road. But this naturally presupposes that they know where the road is going to, that they have some curiosity and interest about it, and perhaps a chance to travel upon it." If the division of labor robs them of interest in any part of it, the mere mechanical fact of interdependence amounts to nothing.
  translation_ja: 労働者が、自分の職業を通して人生の意味を知る機会はないと、私たちは信じているようだ。古い建物に宿る歴史のつながりなら、すぐ分かる。「世代また世代が、そこに自分たちのしるしを刻み、自分たちの考えを書き残したので、ついには、すべての人の財産となった」と言う。ところが、人々の手に絶えず握られてきた労働の道具には、これはさらによく当てはまる。機械にも、古い建物に劣らず、人が生きてきた「歳月を経た暮らし」が、その内に保存され、大切に蓄えられている。ところがいま労働者は、使う機械に、目の前にある一式の道具がたった今作られたように、いきなり出会う。それがどんなふうに少しずつ進化し発達したかを、知らないまま毎日扱う。大工場で機械を使って働く人のうち、工場を支える発明、自分で使う道具は、前の世代から受け継ぎ、次の世代に渡すことを繰り返しながら、ゆっくりとつくられて社会全体の財産となったのだと分かっている人は、ほとんどいない。社会の進歩をいくらか理解している人にしか、これは分からない。分業がさらに細かくなれば生産量が増えるため、私たちはいまだに子どものように喜ぶ。作る人に本当に目を向けるために必要な、ほんの少しのあいだでさえ、製品から目を離せないらしい。理論では「分業」は、人々を一つの目的のもとに集め、互いに頼ることを増やし、より人間らしくする。「何人かが道をつくろうと決め、一人が地面を掘り、一人が石を運び、もう一人が石を割れば、道にかける関心によって、自然と一つに結ばれる。だがそれには当然、その道がどこへ通じるかを知り、関心と好奇心を持ち、もしかするとその道を歩く機会があるという前提がいる。」分業によって仕事のどの部分にも関心を持てなくなるなら、仕組みのうえで互いに頼っているという事実だけでは、何にもならない。
  translation_status: reviewed
- id: da-06-031
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '211'
    source_sequence: 240
    printed_page_end: '212'
  source_text: 'The man in the factory, as well as the man with the hoe, has a grievance beyond being overworked and disinherited, in that he does not know what it is all about. We may well regret the passing of the time when the variety of work performed in the unspecialized workshop naturally stimulated the intelligence of the workingmen and brought them into contact both with the raw material and the finished product. But the problem of education, as any advanced educator will tell us, is to supply the essentials of experience by a short cut, as it were. If the shop constantly tends to make the workman a specialist, then the problem of the educator in regard to him is quite clear: it is to give him what may be an offset from the over-specialization of his daily work, to supply him with general information and to insist that he shall be a cultivated member of society with a consciousness of his industrial and social value.'
  translation_ja: 鍬をふるう人と同じく、工場で働く人にも、働かされすぎて分け前を奪われること以外に、不平を言う理由がある。全体として何をしているのか、分からないのだ。仕事を細かく分けていない作業場で、さまざまな作業が自然に労働者の知性を刺激し、原材料にも完成品にも触れさせた時代が去ったことは、惜しんでよい。だが進んだ教育者なら誰でも言うように、教育に求められるのは、経験の肝心なところを、いわば近道で与えることである。作業場が働く人を絶えず、一つの作業だけを知る専門家にしがちなら、その人について教育を行う者が当たるべき問題ははっきりしている。日々の仕事で専門が狭くなりすぎるのを補うものを与え、一般的な知識を伝え、働く場と社会で自分が持つ価値を自覚した、教養ある社会の一員になれるよう求めることである。
  translation_status: reviewed
- id: da-06-032
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '212'
    source_sequence: 241
  source_text: As sad a sight as an old hand-loom worker in a factory attempting to make his clumsy machine compete with the flying shuttles about him, is a workingman equipped with knowledge so meagre that he can get no meaning into his life nor sequence between his acts and the far-off results.
  translation_ja: 工場で年老いた手織り職人が、扱いにくい織機を、周囲の飛ぶように動く杼に負けまいと動かす。それと同じくらい悲しい光景は、知識が乏しく、暮らしに意味を見いだせず、自分の行いと遠いところで生じる結果とのつながりも分からない労働者の姿である。
  translation_status: reviewed
- id: da-06-033
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '212'
    source_sequence: 242
    printed_page_end: '214'
  source_text: Manufacturers, as a whole, however, when they attempt educational institutions in connection with their factories, are prone to follow conventional lines, and to exhibit the weakness of imitation. We find, indeed, that the middle-class educator constantly makes the mistakes of the middle-class moralist when he attempts to aid working people. The latter has constantly and traditionally urged upon the workingman the specialized virtues of thrift, industry, and sobriety—all virtues pertaining to the individual. When each man had his own shop, it was perhaps wise to lay almost exclusive stress upon the industrial virtues of diligence and thrift; but as industry has become more highly organized, life becomes incredibly complex and interdependent. If a workingman is to have a conception of his value at all, he must see industry in its unity and entirety; he must have a conception that will include not only himself and his immediate family and community, but the industrial organization as a whole. It is doubtless true that dexterity of hand becomes less and less imperative as the invention of machinery and subdivision of labor proceeds; but it becomes all the more necessary, if the workman is to save his life at all, that he should get a sense of his individual relation to the system. Feeding a machine with a material of which he has no knowledge, producing a product, totally unrelated to the rest of his life, without in the least knowing what becomes of it, or its connection with the community, is, of course, unquestionably deadening to his intellectual and moral life. To make the moral connection it would be necessary to give him a social consciousness of the value of his work, and at least a sense of participation and a certain joy in its ultimate use; to make the intellectual connection it would be essential to create in him some historic conception of the development of industry and the relation of his individual work to it.
  translation_ja: ところが工場主たちは概して、工場に関わる教育機関をつくろうとすると、昔ながらの道を踏み、手本をまねるばかりで力がないところを見せる。実際、中産階級の教育者は、労働者に力を貸そうとして、中産階級の道徳家と同じ間違いを、絶えず繰り返す。道徳家は昔から、倹約、勤勉、節酒という特定の徳を、とりわけ労働者に説いてきた。どれも個人に関わる徳である。誰もが自分の作業場を持ったころは、勤勉と倹約という働くうえでの徳に、ほとんどすべての力を入れるのが賢明だったかもしれない。しかし産業が緊密に組織されるにつれ、暮らしは信じられないほど複雑になり、互いに頼ることが多くなった。労働者が自分の価値を少しでも理解するなら、産業を一つに結ばれた全体として見なくてはならない。自分と身近な家族、地域ばかりか、産業の仕組み全体まで含んだ見方が必要だ。機械が発明され、分業が進むにつれ、手先の器用さは以前ほど必須でなくなる。それは疑いない。だが労働者が自分の人生を守るのなら、仕組み全体と自分がどう結びついているかを知ることは、ますます必要になる。何も知らない材料を機械に供給し、自分のほかの暮らしとはまったく関係のない物をつくる。それがどうなり、共同体とどう関係するかが少しも分からない。それでは、心の働きも道徳の感覚も、確かに鈍らずにはいない。道徳のうえでつなげるには、自分の仕事には社会で役に立つ価値があると分かり、少なくとも自分がそこに加わっていると感じ、最後に使われることにも、いくらか喜びを持てるようにする必要がある。知性のうえでつなげるには、産業がどう発達し、自分の作業がそれにどうつながっているか、歴史に照らしてある程度思い描けるようにしなければならない。
  translation_status: reviewed
- id: da-06-034
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '214'
    source_sequence: 243
    printed_page_end: '216'
  source_text: Workingmen themselves have made attempts in both directions, which it would be well for moralists and educators to study. It is a striking fact that when workingmen formulate their own moral code, and try to inspire and encourage each other, it is always a large and general doctrine which they preach. They were the first class of men to organize an international association, and the constant talk at a modern labor meeting is of solidarity and of the identity of the interests of workingmen the world over. It is difficult to secure a successful organization of men into the simplest trades organization without an appeal to the most abstract principles of justice and brotherhood. As they have formulated their own morals by laying the greatest stress upon the largest morality, so if they could found their own schools, it is doubtful whether they would be of the mechanic institute type. Courses of study arranged by a group of workingmen are most naïve in their breadth and generality. They will select the history of the world in preference to that of any period or nation. The "wonders of science" or "the story of evolution" will attract workingmen to a lecture when zoölogy or chemistry will drive them away. The "outlines of literature" or "the best in literature" will draw an audience when a lecturer in English poetry will be solitary. This results partly from a wholesome desire to have general knowledge before special knowledge, and is partly a rebound from the specialization of labor to which the workingman is subjected. When he is free from work and can direct his own mind, he tends to roam, to dwell upon large themes. Much the same tendency is found in programmes of study arranged by Woman's Clubs in country places. The untrained mind, wearied with meaningless detail, when it gets an opportunity to make its demand heard, asks for general philosophy and background.
  translation_ja: 労働者自身が、両方の方向に向かって試みてきたことがある。道徳家や教育者はそれを調べるとよい。働く人が自分たちの道徳の規範を言葉にし、互いに奮い立たせ、励まそうとするとき、いつも広く、すべての人に当てはまる教えを説くのは、注目すべきことだ。国際的な組織をつくったのも、彼らが最初の階層だった。今の労働者の集会で絶えず話し合うのは、連帯と、世界じゅうの働く人々に共通する利益である。最も簡素な職種別の組織であっても、正義や同胞としての連帯という、最も抽象的な原則に訴えず、うまく人をまとめるのは難しい。もっとも広い道徳にいちばん重きを置いて、自分たちの道徳を言葉にしたのと同じように、自分たちの学校をつくることができたなら、機械工の学校のようなものには、なるかどうか疑わしい。労働者の集まりが組む学習課程は、その範囲が実に無邪気なほど広く、全体を見渡すものだ。一時代や一国の歴史より、世界の歴史を選ぶ。動物学や化学なら足が遠のくが、「科学の驚異」や「進化の物語」なら、講演を聞きにくる。イギリスの詩について話す人には聴衆がいなくても、「文学のあらまし」や「文学の名作」なら、人は集まる。これは一つには、個別の知識を得る前に全体の知識を得たいという、健全な願いから生まれる。また一つには、働く者が仕事を細かく分けられていることへの反動である。仕事を離れ、自分の頭を好きなように使えるときは、あちこち考えを巡らせ、大きな主題のことを考えたがる。地方の女性クラブが決める学習計画にも、よく似た傾向が見られる。まだ学び慣れず、意味のない細部にうんざりした心は、求めを聞いてもらえる機会を得ると、広いものの見方と、細部がどこに位置づけられるかを示す背景を求めるのである。
  translation_status: reviewed
- id: da-06-035
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '216'
    source_sequence: 244
  source_text: In a certain sense commercialism itself, at least in its larger aspect, tends to educate the workingman better than organized education does. Its interests are certainly world-wide and democratic, while it is absolutely undiscriminating as to country and creed, coming into contact with all climes and races. If this aspect of commercialism were utilized, it would in a measure counterbalance the tendency which results from the subdivision of labor.
  translation_ja: ある意味では、商業そのものも、少なくとも広い面を見るときは、組織立った教育より、働く人をよく教える傾向がある。その関心は確かに世界にわたり、民主的である。あらゆる土地や人種に触れ、国や信条をまるで区別しない。この商業の一面を活用すれば、仕事が細かく分けられることで生じる傾向を、ある程度相殺できるだろう。
  translation_status: reviewed
- id: da-06-036
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '216'
    source_sequence: 245
    printed_page_end: '217'
  source_text: The most noteworthy attempt to utilize this democracy of commerce in relation to manufacturing is found at Dayton, Ohio, in the yearly gatherings held in a large factory there. Once a year the entire force is gathered together to hear the returns of the business, not so much in respect to the profits, as in regard to its extension. At these meetings, the travelling salesmen from various parts of the world—from Constantinople, from Berlin, from Rome, from Hong Kong—report upon the sales they have made, and the methods of advertisement and promotion adapted to the various countries.
  translation_ja: 製造の仕事に、この商業の民主的な性質を生かそうとする最も注目すべき試みは、オハイオ州デイトンの大きな工場で、毎年催される集会に見られる。一年に一度、社員全員が集まって営業の成果を聞く。利益というより、事業がどれほど広がったかについてである。集会では世界各地の販売員が、コンスタンティノープルから、ベルリンから、ローマから、香港からやってきて、それぞれの売上や、国ごとにどう広告や販売促進の方法を変えたかを報告する。
  translation_status: reviewed
- id: da-06-037
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '217'
    source_sequence: 246
    printed_page_end: '218'
  source_text: Stereopticon lectures are given upon each new country as soon as it has been successfully invaded by the product of the factory. The foremen in the various departments of the factory give accounts of the increased efficiency and the larger output over former years. Any man who has made an invention in connection with the machinery of the factory, at this time publicly receives a prize, and suggestions are approved that tend to increase the comfort and social facilities of the employees. At least for the moment there is a complete esprit de corps, and the youngest and least skilled employee sees himself in connection with the interests of the firm, and the spread of an invention. It is a crude example of what might be done in the way of giving a large framework of meaning to factory labor, and of putting it into a sentient background, at least on the commercial side.
  translation_ja: 工場の製品が新しい国に売り込まれると、そのたびに、幻灯機で映像を見せながら、その国について講演する。工場の各部門の職長は、以前より能率が上がり、生産量が増えたことを説明する。工場の機械に関して何かを発明した者は、この機会に人前で賞を受け取る。従業員の居心地や交流のための設備をよくする提案は、採用される。せめてその場だけでも皆が一体となり、最も若く、技量が低い従業員も、自分と会社の利害、発明が世に広がることが、つながっていると分かる。少なくとも商業の面から、工場の仕事に大きな意味の枠組みを与え、生きたものとして実感できる背景のなかに置くために、何ができるかを、まだ粗削りながら示す例である。
  translation_status: reviewed
- id: da-06-038
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '218'
    source_sequence: 247
  source_text: It is easy to indict the educator, to say that he has gotten entangled in his own material, and has fallen a victim to his own methods; but granting this, what has the artist done about it—he who is supposed to have a more intimate insight into the needs of his contemporaries, and to minister to them as none other can?
  translation_ja: 教育者が自分で扱う材料に絡め取られ、自分の方法の犠牲になった、と告発するのは簡単だ。だがそう認めても、では、芸術家は何をしたのだろう。同じ時代の人が必要とするものをもっとよく見通し、ほかの誰にもできないような力の貸し方をするはずの、あの芸術家はどうなのだろう。
  translation_status: reviewed
- id: da-06-039
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '218'
    source_sequence: 248
    printed_page_end: '219'
  source_text: It is quite true that a few writers are insisting that the growing desire for labor, on the part of many people of leisure, has its counterpart in the increasing desire for general knowledge on the part of many laborers. They point to the fact that the same duality of conscience which seems to stifle the noblest effort in the individual because his intellectual conception and his achievement are so difficult to bring together, is found on a large scale in society itself, when we have the separation of the people who think from those who work. And yet, since Ruskin ceased, no one has really formulated this in a convincing form. And even Ruskin's famous dictum, that labor without art brutalizes, has always been interpreted as if art could only be a sense of beauty or joy in one's own work, and not a sense of companionship with all other workers. The situation demands the consciousness of participation and well-being which comes to the individual when he is able to see himself "in connection and cooperation with the whole"; it needs the solace of collective art inherent in collective labor.
  translation_ja: 時間にゆとりがある多くの人のあいだで、何かの仕事をしたいという願いが強くなり、それに呼応して、多くの労働者は、広い知識をますます求めていると強調する著述家が、いくらかいる。個人の知的な考えと実際に成し遂げることを一つにしにくいために、最も気高い努力さえ押し殺してしまうように見える、良心のこの二重性が、考える人と働く人が切り離されるとき、社会そのもののなかにも大きく現れると、彼らは指摘する。それでもラスキンが語らなくなってから、これを本当に説得力のある形で言葉にした人はいない。しかも芸術のない労働は人を野蛮にするというラスキンの有名な言葉は、いつも、芸術とは、自分の仕事に美しさや喜びを覚えることでしかなく、ほかのすべての働く仲間とのつながりを感じることではないかのように、解釈されてきた。必要なのは、「全体とつながり、協力している」自分が見えるとき、一人ひとりが感じる、参加しているという自覚と充実感である。皆で働くことに宿る、皆の芸術からの慰めを、この状況は必要としているのだ。
  translation_status: reviewed
- id: da-06-040
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '219'
    source_sequence: 249
    printed_page_end: '220'
  source_text: As the poet bathes the outer world for us in the hues of human feeling, so the workman needs some one to bathe his surroundings with a human significance—some one who shall teach him to find that which will give a potency to his life. His education, however simple, should tend to make him widely at home in the world, and to give him a sense of simplicity and peace in the midst of the triviality and noise to which he is constantly subjected. He, like other men, can learn to be content to see but a part, although it must be a part of something.
  translation_ja: 詩人が私たちのために、外の世界を人間の感情の色に染める。同じように、労働者の周りのものを人間にとって意味あるものとして見せてくれる人が、本人には必要だ。暮らしに力を与えるものを、どう見つければよいか教えてくれる人である。どれほど簡素でも、教育は、広い世界を自分の居場所だと思わせ、絶えずさらされる、瑣末なことや騒音のなかで、物事の単純さと安らぎを感じさせるものでなくてはならない。ほかの人と同じように、労働者も自分の目には一部分しか見えなくても、満足することを学べる。ただしその一部分が、確かに何かの全体の一部でなければならない。
  translation_status: reviewed
- id: da-06-041
  section_id: ch-06
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '220'
    source_sequence: 250
  source_text: It is because of a lack of democracy that we do not really incorporate him in the hopes and advantages of society, and give him the place which is his by simple right. We have learned to say that the good must be extended to all of society before it can be held secure by any one person or any one class; but we have not yet learned to add to that statement, that unless all men and all classes contribute to a good, we cannot even be sure that it is worth having. In spite of many attempts we do not really act upon either statement.
  translation_ja: 労働者を社会の希望と恩恵のうちに本当に迎え入れ、当然の権利として本人に属する場所を与えないのは、民主主義が足りないためである。ある善いことが、特定の一人や階級にとって確かなものになるには、まず社会全体に広がらなくてはならない。私たちは、そう言うことを学んだ。しかし、すべての人や階級が何か善いものをつくることに力を貸さなければ、それは持つ価値があるものかどうかさえ分からない、と付け加えることは、まだ学んでいない。いくら試みても、実際にはどちらも実際の行動には移せていないのである。
  translation_status: reviewed
- id: da-07-000
  section_id: ch-07
  kind: heading
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '221'
    source_sequence: 251
    url: https://www.gutenberg.org/files/15487/15487-h/15487-h.htm#page_221
    anchor: page_221
  source_text: CHAPTER VII. POLITICAL REFORM
  translation_ja: 第七章　政治改革
  translation_status: reviewed
- id: da-07-001
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '221'
    source_sequence: 252
  source_text: Throughout this volume we have assumed that much of our ethical maladjustment in social affairs arises from the fact that we are acting upon a code of ethics adapted to individual relationships, but not to the larger social relationships to which it is bunglingly applied. In addition, however, to the consequent strain and difficulty, there is often an honest lack of perception as to what the situation demands.
  translation_ja: この本を通じて、私たちは次のことを前提にしてきた。社会の問題で、私たちの倫理が実情に合わないのは、大部分、個人同士の関係に合う規範に従って動き、それがふさわしくない、より広い社会の関係にも、不器用に当てはめているためだ。だがそこから生まれる緊張や困難に加えて、いまの状況はそもそも何を求めているのか、本当に分かっていないことも多い。
  translation_status: reviewed
- id: da-07-002
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '221'
    source_sequence: 253
    printed_page_end: '222'
  source_text: Nowhere is this more obvious than in our political life as it manifests itself in certain quarters of every great city. It is most difficult to hold to our political democracy and to make it in any sense a social expression and not a mere governmental contrivance, unless we take pains to keep on common ground in our human experiences. Otherwise there is in various parts of the community an inevitable difference of ethical standards which becomes responsible for much misunderstanding.
  translation_ja: これは、どの大都市にもある一部の地区に現れる、私たちの政治生活ほど明らかなところはない。人間としての経験で共通するところにとどまるよう心を配らなければ、政治の民主主義を保ち、それをただの統治の仕掛けではなく、少しでも社会の実情を表すものにするのは、たいへん難しい。そうしなければ、共同体のさまざまな部分で、倫理の基準はどうしても違ってきて、多くの誤解のもととなる。
  translation_status: reviewed
- id: da-07-003
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '222'
    source_sequence: 254
    printed_page_end: '223'
  source_text: It is difficult both to interpret sympathetically the motives and ideals of those who have acquired rules of conduct in experience widely different from our own, and also to take enough care in guarding the gains already made, and in valuing highly enough the imperfect good so painfully acquired and, at the best, so mixed with evil. This wide difference in daily experience exhibits itself in two distinct attitudes toward politics. The well-to-do men of the community think of politics as something off by itself; they may conscientiously recognize political duty as part of good citizenship, but political effort is not the expression of their moral or social life. As a result of this detachment, "reform movements," started by business men and the better element, are almost wholly occupied in the correction of political machinery and with a concern for the better method of administration, rather than with the ultimate purpose of securing the welfare of the people. They fix their attention so exclusively on methods that they fail to consider the final aims of city government. This accounts for the growing tendency to put more and more responsibility upon executive officers and appointed commissions at the expense of curtailing the power of the direct representatives of the voters. Reform movements tend to become negative and to lose their educational value for the mass of the people. The reformers take the rôle of the opposition. They give themselves largely to criticisms of the present state of affairs, to writing and talking of what the future must be and of certain results which should be obtained. In trying to better matters, however, they have in mind only political achievements which they detach in a curious way from the rest of life, and they speak and write of the purification of politics as of a thing set apart from daily life.
  translation_ja: 自分とは大きく違う経験から行いの決まりを身につけた人の、動機や理想を共感しながら受けとめるのは難しい。すでに手に入ったものを十分注意して守り、苦労して手に入れた不完全な善を、それがどんなによくても悪と混じっているのに、十分に高く評価するのも難しい。日々の経験の大きな違いは、政治への二つのはっきり異なる態度に現れる。共同体で暮らしにゆとりのある人は、政治を、それだけで別にあるものだと思う。良い市民であるための一部として、政治にも責任があると誠実に認めるかもしれないが、政治に関わることは、自分の道徳や社会の関係を表すことではない。この切り離しの結果、実業家や世間で立派だとされる人が始める「改革運動」は、ほとんどもっぱら政治の仕組みを正し、もっとよい行政の方法を考えることに没頭する。住民の暮らしをよくするという最終の目的は、二の次になる。方法ばかりに目を向け、市の政治が最終的に何を目指すかを考えない。だから、有権者がじかに選んだ代表者の権限を削ってでも、行政の責任者や任命を受けた委員会に、ますます責任を負わせる傾向が強まる。改革運動は反対するばかりになりがちで、大勢の人々にとっての教育としての価値を失う。改革者は反対派の役割を引き受ける。現状を批判し、今後どうならなくてはならないか、どんな結果を得るべきかを、書いて語ることに大方の力を使う。だが物事をよくしようとするときに思い描くのは、奇妙にもほかのあらゆる暮らしと切り離された、政治だけの成果だ。政治を浄化することを、日常の暮らしとは別のこととして、語り、書くのである。
  translation_status: reviewed
- id: da-07-004
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '224'
    source_sequence: 255
  source_text: On the other hand, the real leaders of the people are part of the entire life of the community which they control, and so far as they are representative at all, are giving a social expression to democracy. They are often politically corrupt, but in spite of this they are proceeding upon a sounder theory. Although they would be totally unable to give it abstract expression, they are really acting upon a formulation made by a shrewd English observer; namely, that, "after the enfranchisement of the masses, social ideals enter into political programmes, and they enter not as something which at best can be indirectly promoted by government, but as something which it is the chief business of government to advance directly."
  translation_ja: 他方、人々を実際に率いている者は、取り仕切っている共同体の暮らし全体の一部であり、少しでもその人々を代表するかぎり、民主主義を社会の暮らしのなかで表している。往々にして政治のうえでは腐敗しているが、それでも、より筋の通った考えで動いている。抽象的に説明することなど、まったくできないだろうが、実際に従うのは、ある鋭いイングランドの観察者が言葉にした考えである。「大勢の人々が参政権を得ると、社会の理想が政治の綱領に入ってくる。政府がせいぜい間接に後押しするものとして入るのではない。政府がじかに先へ進めることを何よりの仕事とすべきものとして、入ってくるのだ。」
  translation_status: reviewed
- id: da-07-005
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '224'
    source_sequence: 256
    printed_page_end: '225'
  source_text: Men living near to the masses of voters, and knowing them intimately, recognize this and act upon it; they minister directly to life and to social needs. They realize that the people as a whole are clamoring for social results, and they hold their power because they respond to that demand. They are corrupt and often do their work badly; but they at least avoid the mistake of a certain type of business men who are frightened by democracy, and have lost their faith in the people. The two standards are similar to those seen at a popular exhibition of pictures where the cultivated people care most for the technique of a given painting, the moving mass for a subject that shall be domestic and human.
  translation_ja: 大勢の有権者の近くに住み、親しく知っている者は、このことを認めて行動する。暮らしそのものと、社会で必要とされることに、じかに応える。住民がこぞって暮らしを実際に良くする成果を求めていると分かっており、その要求に応えるからこそ権力を保つ。彼らは腐敗しており、仕事のし方も多くの場合、まずい。それでも少なくとも、民主主義におびえ、人々への信頼をなくした、ある種の実業家と同じ間違いはしない。二つの基準の違いは、人が大勢集まる絵画展で見るものに似ている。教養のある者が何より気にするのは、それぞれの絵の技法であり、次々と通り過ぎる大勢の人が気にするのは、暮らしに親しく、人間らしい主題である。
  translation_status: reviewed
- id: da-07-006
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '225'
    source_sequence: 257
    printed_page_end: '226'
  source_text: This difference may be illustrated by the writer's experience in a certain ward of Chicago, during three campaigns, when efforts were made to dislodge an alderman who had represented the ward for many years. In this ward there are gathered together fifty thousand people, representing a score of nationalities; the newly emigrated Latin, Teuton, Celt, Greek, and Slav who live there have little in common save the basic experiences which come to men in all countries and under all conditions. In order to make fifty thousand people, so heterogeneous in nationality, religion, and customs, agree upon any demand, it must be founded upon universal experiences which are perforce individual and not social.
  translation_ja: この違いは、シカゴのある選挙区で、何年も区を代表してきた市会議員を落選させようとした三度の選挙運動に、私が接した経験で説明できる。この区には二十ほどの国や民族を代表する、五万人が暮らす。新しく移住したラテン系、ゲルマン系、ケルト系の人々や、ギリシャ人、スラヴ系の人々に共通するのは、どんな国、どんな境遇にいても人がする、基本的な経験くらいである。出身、信仰、習慣がこれほど違う五万人に、どんな要求であれ一致してもらうには、土台は誰にでも共通する経験でなくてはならず、そうした経験は、どうしても社会としてではなく、一人ひとりのものになる。
  translation_status: reviewed
- id: da-07-007
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '226'
    source_sequence: 258
  source_text: An instinctive recognition of this on the part of the alderman makes it possible to understand the individualistic basis of his political success, but it remains extremely difficult to ascertain the reasons for the extreme leniency of judgment concerning the political corruption of which he is constantly guilty.
  translation_ja: 市会議員は、本能でこのことが分かっている。だから、その政治での成功が、個人同士の関係に支えられることは理解できる。だが、絶えず犯している政治の腐敗に対し、人々の判断が、どんな理由であれほど寛大なのかを突き止めることは、ひどく難しい。
  translation_status: reviewed
- id: da-07-008
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '226'
    source_sequence: 259
  source_text: This leniency is only to be explained on the ground that his constituents greatly admire individual virtues, and that they are at the same time unable to perceive social outrages which the alderman may be committing. They thus free the alderman from blame because his corruption is social, and they honestly admire him as a great man and hero, because his individual acts are on the whole kindly and generous.
  translation_ja: その寛大さは、有権者が個人としての徳を大いに尊敬する一方で、市会議員が社会に対して働いているかもしれない不正には気づかない、ということからしか説明できない。腐敗は社会の次元のことなので議員を責めず、個人としてすることは大方が親切で気前もよいので、心から、偉人であり英雄だと尊敬するのである。
  translation_status: reviewed
- id: da-07-009
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '226'
    source_sequence: 260
    printed_page_end: '227'
  source_text: In certain stages of moral evolution, a man is incapable of action unless the results will benefit himself or some one of his acquaintances, and it is a long step in moral progress to set the good of the many before the interest of the few, and to be concerned for the welfare of a community without hope of an individual return. How far the selfish politician befools his constituents into believing that their interests are identical with his own; how far he presumes upon their inability to distinguish between the individual and social virtues, an inability which he himself shares with them; and how far he dazzles them by the sense of his greatness, and a conviction that they participate therein, it is difficult to determine.
  translation_ja: 道徳が発達するある段階では、自分か自分の知っている誰かが得をするのでなければ、人は行動できない。少数の人の利益より多くの人の利益を優先し、自分への見返りを望まず、共同体の暮らしをよくすることを考えるには、道徳が大きく進まなければならない。利己的な政治家は、有権者の利益は自分のものと同じだと、どこまで人々をだまして信じさせるのか。個人の徳と社会の徳を区別できないことでは、自分も彼らと同じなのに、彼らがその区別をできないのを、どこまで当てにするのか。自分は偉大だという印象と、その偉大さには有権者もあずかっているという確信で、どこまで目をくらませるのか。どれも見定めるのは難しい。
  translation_status: reviewed
- id: da-07-010
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '227'
    source_sequence: 261
  source_text: Morality certainly develops far earlier in the form of moral fact than in the form of moral ideas, and it is obvious that ideas only operate upon the popular mind through will and character, and must be dramatized before they reach the mass of men, even as the biography of the saints have been after all "the main guide to the stumbling feet of thousands of Christians to whom the Credo has been but mysterious words."
  translation_ja: 道徳についての考えが発達するよりもずっと早く、道徳は実際の行いに現れる。考えが世間の人の心に働くには、誰かの意志と人柄を通さなければならないことは、明らかだ。多くの人に届くには、その考えが人の目に見える物語にならなくてはならない。聖人たちの伝記が結局、「信仰告白など謎めいた言葉でしかなかった何千人ものキリスト教徒の、おぼつかない足を導く、主な手がかり」だったのと同じである。
  translation_status: reviewed
- id: da-07-011
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '228'
    source_sequence: 262
  source_text: Ethics as well as political opinions may be discussed and disseminated among the sophisticated by lectures and printed pages, but to the common people they can only come through example—through a personality which seizes the popular imagination. The advantage of an unsophisticated neighborhood is, that the inhabitants do not keep their ideas as treasures—they are untouched by the notion of accumulating them, as they might knowledge or money, and they frankly act upon those they have. The personal example promptly rouses to emulation. In a neighborhood where political standards are plastic and undeveloped, and where there has been little previous experience in self-government, the office-holder himself sets the standard, and the ideas that cluster around him exercise a specific and permanent influence upon the political morality of his constituents.
  translation_ja: 政治上の意見と同じように倫理も、学び慣れた人々のあいだでは、講演や印刷物で議論し広められる。だがふつうの人々にとっては、人々の想像をつかむ、一人の人間の振る舞いを通してしか伝わらない。世慣れていない地域のよさは、住民が自分の考えを宝物のようにしまわないことだ。知識や金のように考えをためようなどという発想がなく、持っている考えには、隠しだてもなく従って行動する。身近な人の振る舞いを見れば、すぐ自分もまねたくなる。政治の基準がまだ固まらず、よくできてもおらず、自治の経験がほとんどなかった地区では、公職につく人自身が基準をつくる。その人の周りに集まる考えは、有権者の政治の道徳に、はっきりと、いつまでも影響を与える。
  translation_status: reviewed
- id: da-07-012
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '228'
    source_sequence: 263
    printed_page_end: '229'
  source_text: Nothing is more certain than that the quality which a heterogeneous population, living in one of the less sophisticated wards, most admires is the quality of simple goodness; that the man who attracts them is the one whom they believe to be a good man. We all know that children long "to be good" with an intensity which they give to no other ambition. We can all remember that the earliest strivings of our childhood were in this direction, and that we venerated grown people because they had attained perfection.
  translation_ja: 世慣れていない区の一つに暮らす、さまざまな背景の人々が何より尊敬するのは、飾り気のない善良さであり、善人だと信じる者に引きつけられる。これ以上に確かなことはない。子どもたちが、ほかのどんな望みより強い気持ちで「いい子でいたい」と願うことは、誰もが知っている。幼いころの初めての努力がこの方向へ向かっていたことも、大人は立派にできていると思って尊敬したことも、誰もが思い出せる。
  translation_status: reviewed
- id: da-07-013
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '229'
    source_sequence: 264
  source_text: Primitive people, such as the South Italian peasants, are still in this stage. They want to be good, and deep down in their hearts they admire nothing so much as the good man. Abstract virtues are too difficult for their untrained minds to apprehend, and many of them are still simple enough to believe that power and wealth come only to good people.
  translation_ja: 南イタリアの農民のように、素朴な暮らしを送る人々は、いまもこの段階にいる。自分も善くありたいし、心の奥では善い人ほど尊敬するものはない。抽象的な徳は、学び慣れていない頭で理解するには難しすぎる。まだ素朴に、権力と富は善い人だけに手に入ると信じる者も多い。
  translation_status: reviewed
- id: da-07-014
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '229'
    source_sequence: 265
    printed_page_end: '230'
  source_text: The successful candidate, then, must be a good man according to the morality of his constituents. He must not attempt to hold up too high a standard, nor must he attempt to reform or change their standards. His safety lies in doing on a large scale the good deeds which his constituents are able to do only on a small scale. If he believes what they believe and does what they are all cherishing a secret ambition to do, he will dazzle them by his success and win their confidence. There is a certain wisdom in this course. There is a common sense in the mass of men which cannot be neglected with impunity, just as there is sure to be an eccentricity in the differing and reforming individual which it is perhaps well to challenge.
  translation_ja: そこで選挙に勝つ候補者は、有権者の道徳で言う善人である必要がある。あまり高い基準を示そうとしてはならず、人々の基準を改め、変えようとしてもならない。有権者が小さな規模でしかできない善い行いを、大きな規模で行えば、安心していられる。人々が信じることを自分も信じ、皆がひそかにやりたいと思うことを自分が実行すれば、成功で人々を驚嘆させ、信用を勝ち取るだろう。このやり方にも、ある種の知恵はある。世間一般には、無視すれば必ず報いを受ける分別がある。ほかの人と異なる考えを持ち、改革しようとする人には、必ずどこか風変わりなところがあり、そこには異議を唱えてみてもよいのと、同じである。
  translation_status: reviewed
- id: da-07-015
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '230'
    source_sequence: 266
    printed_page_end: '231'
  source_text: The constant kindness of the poor to each other was pointed out in a previous chapter, and that they unfailingly respond to the need and distresses of their poorer neighbors even when in danger of bankruptcy themselves. The kindness which a poor man shows his distressed neighbor is doubtless heightened by the consciousness that he himself may be in distress next week; he therefore stands by his friend when he gets too drunk to take care of himself, when he loses his wife or child, when he is evicted for non-payment of rent, when he is arrested for a petty crime. It seems to such a man entirely fitting that his alderman should do the same thing on a larger scale—that he should help a constituent out of trouble, merely because he is in trouble, irrespective of the justice involved.
  translation_ja: 先に慈善活動の章で、貧しい人がたえず助け合い、自分が暮らしを立てられなくなりそうなときさえ、もっと貧しい隣人の必要や苦しみに必ず応えることを指摘した。困った隣人に親切にする気持ちが強いのは、来週には自分が困るかもしれないと分かっているためでもあろう。だから友人が、自分で何もできないほど酔ったり、妻や子を亡くしたり、家賃が払えず追い出されたり、ささいな罪で捕まったりすれば、見捨てずに支える。この男には、自分の区の市会議員にも、同じことを大きな規模でするのが当然に見える。何が正しいかはともかく、困っているというだけの理由で、その有権者を助けるべきだと思うのである。
  translation_status: reviewed
- id: da-07-016
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '231'
    source_sequence: 267
    printed_page_end: '233'
  source_text: The alderman therefore bails out his constituents when they are arrested, or says a good word to the police justice when they appear before him for trial, uses his pull with the magistrate when they are likely to be fined for a civil misdemeanor, or sees what he can do to "fix up matters" with the state's attorney when the charge is really a serious one, and in doing this he follows the ethics held and practised by his constituents. All this conveys the impression to the simple-minded that law is not enforced, if the lawbreaker have a powerful friend. One may instance the alderman's action in standing by an Italian padrone of the ward when he was indicted for violating the civil service regulations. The commissioners had sent out notices to certain Italian day-laborers who were upon the eligible list that they were to report for work at a given day and hour. One of the padrones intercepted these notifications and sold them to the men for five dollars apiece, making also the usual bargain for a share of their wages. The padrone's entire arrangement followed the custom which had prevailed for years before the establishment of civil service laws. Ten of the laborers swore out warrants against the padrone, who was convicted and fined seventy-five dollars. This sum was promptly paid by the alderman, and the padrone, assured that he would be protected from any further trouble, returned uninjured to the colony. The simple Italians were much bewildered by this show of a power stronger than that of the civil service, which they had trusted as they did the one in Italy. The first violation of its authority was made, and various sinister acts have followed, until no Italian who is digging a sewer or sweeping a street for the city feels quite secure in holding his job unless he is backed by the friendship of the alderman. According to the civil service law, a laborer has no right to a trial; many are discharged by the foreman, and find that they can be reinstated only upon the aldermanic recommendation. He thus practically holds his old power over the laborers working for the city. The popular mind is convinced that an honest administration of civil service is impossible, and that it is but one more instrument in the hands of the powerful.
  translation_ja: そこで市会議員は、自分の有権者が逮捕されれば保釈金を出してやり、裁きを受けるために警察裁判所の判事の前に出れば、ひと言口添えをする。軽い違反で罰金を科されそうなら、判事とのつながりを使い、本当に重大な罪で訴えられたら、州の検事と話をして「どうにかつじつまを合わせる」方法がないか考える。それは、有権者が信じ、実践している倫理に従った行いだ。こうしたことはすべて、有力な友人がいれば、法を破った者も、法の適用を受けないという印象を、素朴な人々に与える。たとえば区のイタリア人パドローネが、公務員の採用規則に違反したかどで起訴されたとき、市会議員は彼を助けた。採用委員会は、採用の資格を持つ者の名簿にいたイタリア人の日雇い労働者の一部に、指定の日、指定の時刻に出勤するよう通知を出していた。パドローネの一人が通知を横取りし、労働者に一枚五ドルで売って、そのうえ、いつものとおり、賃金の一部を受け取る約束まで取りつけた。この手はすべて、公務員制度の法律ができる何年も前から、通用していた習わしどおりだった。労働者の十人が宣誓のうえ逮捕状を取り、パドローネは有罪となり、七十五ドルの罰金を科された。市会議員はただちにその金を払い、もう面倒に巻き込まれないよう守ってもらえると約束されたパドローネは、傷一つ負わず居住区へ戻った。イタリアでの制度と同じように公務員制度を信じていた素朴なイタリア人は、それより強い力を見せられて、ひどく面食らった。制度の権威が初めて踏みにじられ、そのあと不穏なことが次々と起こった。いまでは市の下水道を掘り、通りを掃くイタリア人で、市会議員から親しく後ろ盾になってもらわずに、自分の仕事は安泰だと思える者は一人もいない。公務員制度の法律では、労働者には、解雇に異議を申し立てる審理を受ける権利がない。職長から解雇され、復職するには市会議員の推薦しかないと知る者が大勢いる。こうして議員は、市で働く労働者に対する以前の力を、実質のうえで保っている。まともに公務員制度を運営するのは不可能で、それも有力者の手のなかにある道具が、もう一つ増えただけだと、世間は確信している。
  translation_status: reviewed
- id: da-07-017
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '233'
    source_sequence: 268
  source_text: It will be difficult to establish genuine civil service among these men, who learn only by experience, since their experiences have been of such a nature that their unanimous vote would certainly be that "civil service" is "no good."
  translation_ja: こういう人たちのあいだで本当の公務員制度を確立するのは、難しいだろう。経験によってしか学ばない人たちなのに、これまでの経験からすれば、投票してもらえば、満場一致で「公務員制度なんて役に立たない」と答えるに違いないからである。
  translation_status: reviewed
- id: da-07-018
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '233'
    source_sequence: 269
    printed_page_end: '234'
  source_text: As many of his constituents in this case are impressed with the fact that the aldermanic power is superior to that of government, so instances of actual lawbreaking might easily be cited. A young man may enter a saloon long after midnight, the legal closing hour, and seat himself at a gambling table, perfectly secure from interruption or arrest, because the place belongs to an alderman; but in order to secure this immunity the policeman on the beat must pretend not to see into the windows each time that he passes, and he knows, and the young man knows that he knows, that nothing would embarrass "Headquarters" more than to have an arrest made on those premises. A certain contempt for the whole machinery of law and order is thus easily fostered.
  translation_ja: この件で市会議員の力は政府より強いと印象づけられた有権者が多かったが、実際に法律を破っている例も簡単に挙げられる。ある青年は、法律上の閉店時刻である夜十二時をとうに過ぎて酒場に入り、賭け事の卓につくことができる。店が市会議員のものなので、邪魔もされず逮捕もされないと、すっかり安心している。だが捕まらずに済むには、見回りの警官が、通り過ぎるたびに窓の中が見えないふりをする必要がある。そこで逮捕でもすれば、「本部」にとってこれほど困ったことはないと警官は知っており、若者は、警官がそれを知っていると承知している。こうすれば、法と秩序の仕組み全体を軽く見る気持ちが、たやすく育ってしまう。
  translation_status: reviewed
- id: da-07-019
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '234'
    source_sequence: 270
    printed_page_end: '235'
  source_text: Because of simple friendliness the alderman is expected to pay rent for the hard-pressed tenant when no rent is forthcoming, to find "jobs" when work is hard to get, to procure and divide among his constituents all the places which he can seize from the city hall. The alderman of the ward we are considering at one time could make the proud boast that he had twenty-six hundred people in his ward upon the public pay-roll. This, of course, included day laborers, but each one felt under distinct obligations to him for getting a position. When we reflect that this is one-third of the entire vote of the ward, we realize that it is very important to vote for the right man, since there is, at the least, one chance out of three for securing work.
  translation_ja: ただ親切心から、困り切った借り手が家賃を工面できなければ、市会議員が代わりに払ってくれる。仕事を得にくければ「口」を探してくれる。市役所からもぎ取れるかぎりの職を手に入れ、有権者のあいだに配ってくれる。人々はそう期待する。ここで考えている区の市会議員は、あるとき、自分の区で二千六百人を公の給与名簿に載せたと、誇らしげに自慢できた。もちろん日雇い労働者も含まれるが、一人ひとりが、職につけたことで議員に確かな恩を感じていた。これが区の票全体の三分の一に当たると考えると、正しい人に投票することが、とても大事なのが分かる。少なくとも三分の一の確率で、職に就けるのである。
  translation_status: reviewed
- id: da-07-020
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '235'
    source_sequence: 271
  source_text: If we recollect further that the franchise-seeking companies pay respectful heed to the applicants backed by the alderman, the question of voting for the successful man becomes as much an industrial one as a political one. An Italian laborer wants a "job" more than anything else, and quite simply votes for the man who promises him one. It is not so different from his relation to the padrone, and, indeed, the two strengthen each other.
  translation_ja: さらに、事業の許認可を求める会社が、議員に後押しされた求職者を重く見ることまで思い出すなら、当選する人に投票するかどうかは、政治と同じほど、仕事と生計の問題になる。イタリア人の労働者は何よりも「仕事」が欲しいので、ひねったことは考えず、職を約束する人に投票する。パドローネとの関係とそれほど違うものではない。実際、二つは互いを強めている。
  translation_status: reviewed
- id: da-07-021
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '235'
    source_sequence: 272
    printed_page_end: '236'
  source_text: The alderman may himself be quite sincere in his acts of kindness, for an office seeker may begin with the simple desire to alleviate suffering, and this may gradually change into the desire to put his constituents under obligations to him; but the action of such an individual becomes a demoralizing element in the community when kindly impulse is made a cloak for the satisfaction of personal ambition, and when the plastic morals of his constituents gradually conform to his own undeveloped standards.
  translation_ja: 市会議員自身は、親切をするとき、まったく誠実なのかもしれない。公職を求める人は、苦しみを和らげたいという単純な願いから始め、それがだんだん、自分に恩を感じさせたいという願いに変わっていくことがある。だが親切にしたい気持ちが個人的な野心を満たすための隠れみのとなり、まだ形の定まらない有権者の道徳が、議員自身の成熟していない基準にだんだん合っていくなら、そんな人の行いは共同体の道徳を崩す要因となる。
  translation_status: reviewed
- id: da-07-022
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '236'
    source_sequence: 273
    printed_page_end: '237'
  source_text: The alderman gives presents at weddings and christenings. He seizes these days of family festivities for making friends. It is easiest to reach them in the holiday mood of expansive good-will, but on their side it seems natural and kindly that he should do it. The alderman procures passes from the railroads when his constituents wish to visit friends or attend the funerals of distant relatives; he buys tickets galore for benefit entertainments given for a widow or a consumptive in peculiar distress; he contributes to prizes which are awarded to the handsomest lady or the most popular man. At a church bazaar, for instance, the alderman finds the stage all set for his dramatic performance. When others are spending pennies, he is spending dollars. When anxious relatives are canvassing to secure votes for the two most beautiful children who are being voted upon, he recklessly buys votes from both sides, and laughingly declines to say which one he likes best, buying off the young lady who is persistently determined to find out, with five dollars for the flower bazaar, the posies, of course, to be sent to the sick of the parish. The moral atmosphere of a bazaar suits him exactly. He murmurs many times, "Never mind, the money all goes to the poor; it is all straight enough if the church gets it, the poor won't ask too many questions." The oftener he can put such sentiments into the minds of his constituents, the better he is pleased. Nothing so rapidly prepares them to take his view of money getting and money spending. We see again the process disregarded, because the end itself is considered so praiseworthy.
  translation_ja: 市会議員は結婚式や洗礼式で贈り物をする。家族の祝いの日をとらえ、親しくなるのである。晴れの日はゆったりした好意が広がっており、近づくのがいちばんたやすい。相手にとっても、来てくれるのは自然で親切に思える。親しい人を訪ねたい、遠方の親族の葬式に出たいという有権者には、鉄道会社から乗車券を手に入れてやる。とくに困った寡婦や結核患者のための慈善興行があれば、切符を何枚も買い込む。いちばん美しいご婦人や人気の紳士に贈られる賞にも金を出す。たとえば教会のバザーへ行けば、大げさに立ち回る舞台はすっかり整っている。ほかの人が数セントを出すとき、彼は何ドルも出す。最も美しい子どもを投票で決める二人の候補がいて、気が気でない親戚がその票を集めて回っているとき、彼は見境なく両方の票を買う。どちらが好きかは笑って言わない。どうしても聞き出すと決めたお嬢さんには、花のバザーのために五ドル渡して口をつぐませる。花束は、もちろん教区の病人に届けられる。バザーに漂う道徳の空気は、彼にぴったりだ。何度も小声で言う。「いいんですよ。お金はみんな貧しい人に行くんですから。教会が受け取るなら、筋は通ってますよ。貧しい人たちもあれこれ尋ねたりしないでしょう。」有権者の心にこのような気持ちを植えつけられる機会が多いほど、彼は満足する。金をどう手に入れ、どう使うかについて、これほど早く彼と同じ見方をするように仕向けるものはない。目的そのものが褒められると考えられるため、そこに至る手段が無視される。ここでもその例を見るのである。
  translation_status: reviewed
- id: da-07-023
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '237'
    source_sequence: 274
    printed_page_end: '238'
  source_text: There is something archaic in a community of simple people in their attitude toward death and burial. There is nothing so easy to collect money for as a funeral, and one involuntarily remembers that the early religious tithes were paid to ward off death and ghosts. At times one encounters almost the Greek feeling in regard to burial. If the alderman seizes upon times of festivities for expressions of his good-will, much more does he seize upon periods of sorrow. At a funeral he has the double advantage of ministering to a genuine craving for comfort and solace, and at the same time of assisting a bereaved constituent to express that curious feeling of remorse, which is ever an accompaniment of quick sorrow, that desire to "make up" for past delinquencies, to show the world how much he loved the person who has just died, which is as natural as it is universal.
  translation_ja: 素朴な人々の共同体には、死や埋葬に対する態度に、どこか昔ながらのところがある。葬式ほど金を集めやすいものはない。信仰のために昔納めた十分の一税が、死や亡霊を遠ざけるために払われたことを、おのずから思い出す。埋葬をめぐって、古代ギリシャの人に近い感情に出会うことさえある。市会議員が祝いの機会をとらえて好意を示すなら、悲しみのときには、なおさらそうする。葬式なら、慰めといたわりを本当に求める気持ちに応えながら、遺族となった有権者が、あの不思議な悔いの気持ちを表すのを助けることもできる。突然の悲しみには必ず、過去の至らなさを「埋め合わせ」、亡くなったばかりの人をどれほど愛したか世の中に示したい、という気持ちが伴う。それは自然で、誰にでも起こることなのだ。
  translation_status: reviewed
- id: da-07-024
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '238'
    source_sequence: 275
    printed_page_end: '240'
  source_text: In addition to this, there is, among the poor, who have few social occasions, a great desire for a well-arranged funeral, the grade of which almost determines their social standing in the neighborhood. The alderman saves the very poorest of his constituents from that awful horror of burial by the county; he provides carriages for the poor, who otherwise could not have them. It may be too much to say that all the relatives and friends who ride in the carriages provided by the alderman's bounty vote for him, but they are certainly influenced by his kindness, and talk of his virtues during the long hours of the ride back and forth from the suburban cemetery. A man who would ask at such a time where all the money thus spent comes from would be considered sinister. The tendency to speak lightly of the faults of the dead and to judge them gently is transferred to the living, and many a man at such a time has formulated a lenient judgment of political corruption, and has heard kindly speeches which he has remembered on election day. "Ah, well, he has a big Irish heart. He is good to the widow and the fatherless." "He knows the poor better than the big guns who are always talking about civil service and reform."
  translation_ja: そのうえ、社交の機会が少ない貧しい人たちは、葬式をきちんと整えたいという強い願いを持つ。その葬式の格で、近所での立場がほとんど決まるほどである。議員は、いちばん貧しい有権者を、郡に埋葬してもらうという恐ろしいことから救う。そうでなければ馬車を持てない貧しい人に、葬列の馬車を出す。議員の気前のよさで用意された馬車に乗る親類や友人が、みな投票で彼を選ぶと言うなら、言いすぎかもしれない。だが彼の親切に動かされ、郊外の墓地を往復する長い道のりで、彼の徳を語り合うのは確かである。そんなとき、使う金はそもそもどこから出たのかと尋ねる男がいれば、悪意があると思われるだろう。死者の欠点をことさらあげつらわず、優しく評価する気持ちが、生きている人にも向けられる。多くの人がそんなとき、政治の腐敗について寛大な判断を言葉にし、選挙の日にも覚えているような、思いやりのこもった話を聞く。「まあね、あの人にはアイルランド人のおおらかな心がある。寡婦や父親のいない子には親切だよ。」「公務員制度とか改革とか、そればかり言ってるお偉方よりずっと、貧乏人のことを知ってるさ。」
  translation_status: reviewed
- id: da-07-025
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '240'
    source_sequence: 276
    printed_page_end: '242'
  source_text: Indeed, what headway can the notion of civic purity, of honesty of administration make against this big manifestation of human friendliness, this stalking survival of village kindness? The notions of the civic reformer are negative and impotent before it. Such an alderman will keep a standing account with an undertaker, and telephone every week, and sometimes more than once, the kind of funeral he wishes provided for a bereaved constituent, until the sum may roll up into "hundreds a year." He understands what the people want, and ministers just as truly to a great human need as the musician or the artist. An attempt to substitute what we might call a later standard was made at one time when a delicate little child was deserted in the Hull-House nursery. An investigation showed that it had been born ten days previously in the Cook County hospital, but no trace could be found of the unfortunate mother. The little child lived for several weeks, and then, in spite of every care, died. It was decided to have it buried by the county authorities, and the wagon was to arrive at eleven o'clock; about nine o'clock in the morning the rumor of this awful deed reached the neighbors. A half dozen of them came, in a very excited state of mind, to protest. They took up a collection out of their poverty with which to defray a funeral. The residents of Hull-House were then comparatively new in the neighborhood and did not realize that they were really shocking a genuine moral sentiment of the community. In their crudeness they instanced the care and tenderness which had been expended upon the little creature while it was alive; that it had had every attention from a skilled physician and a trained nurse, and even intimated that the excited members of the group had not taken part in this, and that it now lay with the nursery to decide that it should be buried as it had been born, at the county's expense. It is doubtful if Hull-House has ever done anything which injured it so deeply in the minds of some of its neighbors. It was only forgiven by the most indulgent on the ground that the residents were spinsters, and could not know a mother's heart. No one born and reared in the community could possibly have made a mistake like that. No one who had studied the ethical standards with any care could have bungled so completely.
  translation_ja: 市の政治を清潔にし、行政を正直にするという考えは、これほど大きな人間の親しみの表れ、昔の村での親切が今日まで堂々と生き残った姿に対して、実際、どこまで人を動かせるのだろう。市政を改めたい人の考えは、その前では否定するだけで、力もない。こういう市会議員は葬儀屋と恒常的な取引をし、遺族となった有権者にどんな葬式を取り計らうべきか、毎週電話で指示する。ときには一週間に一度では済まず、金額は「年に何百ドル」にも膨らむ。住民が何を望むかを知り、音楽家や芸術家に劣らず、確かに人間の大きな必要を満たしている。もっと新しいとでも呼ぶべき基準に置き換える試みが、あるときなされた。ハル・ハウスの保育所に、体の弱い赤ん坊が置き去りにされたときである。調べると、クック郡病院で十日前に生まれたと分かったが、気の毒な母親の行方には、手がかりもなかった。小さな子は何週間か生きたが、あらゆる世話をしても、亡くなった。郡の当局に埋葬してもらうことになり、馬車は十一時に来るはずだった。朝九時ごろ、この恐ろしいことが行われるといううわさが近所に広まった。五、六人がひどく興奮して、抗議に来た。貧しいなかで金を出し合い、葬式の費用を集めてきたのだった。ハル・ハウスの住民は、そのころまだ地域に来て日が浅く、自分たちが共同体の純粋な道徳感情に、本当に衝撃を与えていることを知らなかった。不慣れな彼らは、子どもが生きていたあいだ、どれほどねんごろに世話したか、どれほど腕のよい医師と訓練された看護師にみてもらったかを、例に持ち出した。押しかけてきた人たちは、そうした世話に何も関わっていないと、ほのめかしさえした。そして郡の費用でこの子が生まれたように、同じ費用で葬ることは、いまや保育所の判断に委ねられている、とした。近所の一部の人々の心のなかで、ハル・ハウスにこれほど深い傷を負わせた行いが、ほかにあったかは疑わしい。いちばん寛大な人たちだけが許してくれた。それも、住民は独身の女たちだから、母親の心が分からないのだ、という理由からだった。その地域で生まれ育った人なら、あんな間違いは決してしなかった。そこでの倫理の基準を少しでも注意して調べていた人なら、あれほどひどい失敗はしなかったであろう。
  translation_status: reviewed
- id: da-07-026
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '242'
    source_sequence: 277
    printed_page_end: '243'
  source_text: We are constantly underestimating the amount of sentiment among simple people. The songs which are most popular among them are those of a reminiscent old age, in which the ripened soul calmly recounts and regrets the sins of his youth, songs in which the wayward daughter is forgiven by her loving parents, in which the lovers are magnanimous and faithful through all vicissitudes. The tendency is to condone and forgive, and not hold too rigidly to a standard. In the theatres it is the magnanimous man, the kindly reckless villain who is always applauded. So shrewd an observer as Samuel Johnson once remarked that it was surprising to find how much more kindness than justice society contained.
  translation_ja: 素朴な人の心に情がどれほどあるかを、私たちはいつも見くびっている。いちばん好まれる歌は、年老いて来し方を振り返り、熟した心で若いころの罪を静かに語り、悔いる歌である。道を踏み外した娘を愛情深い親が許す歌や、何が起きても、愛し合う二人が度量を失わず誠実であり続ける歌も好まれる。何かの基準にあまり厳格にこだわらず、大目に見て許すほうへ傾くのだ。劇場でいつも拍手を浴びるのは、度量の大きな人物や、向こう見ずだが心優しい悪党である。サミュエル・ジョンソンほど目の鋭い人さえ、世の中には正義よりも親切のほうがずっと多いことに驚いた、と言ったことがある。
  translation_status: reviewed
- id: da-07-027
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '243'
    source_sequence: 278
  source_text: On the same basis the alderman manages several saloons, one down town within easy access of the city hall, where he can catch the more important of his friends. Here again he has seized upon an old tradition and primitive custom, the good fellowship which has long been best expressed when men drink together. The saloons offer a common meeting ground, with stimulus enough to free the wits and tongues of the men who meet there.
  translation_ja: 同じ考えで、市会議員は酒場を何軒か経営する。一軒は、より大切な友人たちと顔を合わせられるように、市役所へ出やすい中心街にある。ここでも彼は昔からの伝統と、素朴な習慣をつかんでいる。一緒に酒を飲むときに最もよく表れると、昔から考えられたような仲間の親しさである。酒場は誰もが集まれる場所を与え、集まった者の頭をほぐし、舌をほどくのに十分な刺激も与える。
  translation_status: reviewed
- id: da-07-028
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '243'
    source_sequence: 279
    printed_page_end: '245'
  source_text: He distributes each Christmas many tons of turkeys not only to voters, but to families who are represented by no vote. By a judicious management some families get three or four turkeys apiece; but what of that, the alderman has none of the nagging rules of the charitable societies, nor does he declare that because a man wants two turkeys for Christmas, he is a scoundrel who shall never be allowed to eat turkey again. As he does not distribute his Christmas favors from any hardly acquired philanthropic motive, there is no disposition to apply the carefully evolved rules of the charitable societies to his beneficiaries. Of course, there are those who suspect that the benevolence rests upon self-seeking motives, and feel themselves quite freed from any sense of gratitude; others go further and glory in the fact that they can thus "soak the alderman." An example of this is the young man who fills his pockets with a handful of cigars, giving a sly wink at the others. But this freedom from any sense of obligation is often the first step downward to the position where he is willing to sell his vote to both parties, and then scratch his ticket as he pleases. The writer recalls a conversation with a man in which he complained quite openly, and with no sense of shame, that his vote had "sold for only two dollars this year," and that he was "awfully disappointed." The writer happened to know that his income during the nine months previous had been but twenty-eight dollars, and that he was in debt thirty-two dollars, and she could well imagine the eagerness with which he had counted upon this source of revenue. After some years the selling of votes becomes a commonplace, and but little attempt is made upon the part of the buyer or seller to conceal the fact, if the transaction runs smoothly.
  translation_ja: 議員はクリスマスのたびに、何トンもの七面鳥を、有権者だけでなく、誰一人投票できない家庭にも配る。うまく立ち回れば、ある家々には一軒で三羽も四羽も手に入る。だからといって何だというのだ。議員は慈善団体のうるさい規則を一つも持たず、クリスマスに七面鳥を二羽欲しがるからといって、その男は悪党で、二度と七面鳥を食べさせてはいけない、などとは言わない。苦労して身につけた慈善の動機から贈り物を配るのではないので、慈善団体が注意深くつくった規則を受け手に当てはめる気もない。もちろん、その親切は自分の利益のためではないかと疑い、恩に感じる必要はまったくないと思う者もいる。さらに進んで、こうして「議員から絞り取れる」と得意になる者もいる。葉巻をひとつかみポケットに入れ、周りにこっそり目くばせする青年などは、その一例である。しかし、何の義理も感じないことが、両方の党に票を売り、投票用紙に自分の好きなように印をつけても構わない、というところへ落ちていく第一歩となることは多い。私の記憶にある会話では、ある男が何の恥じらいもなく、「今年は票が二ドルにしかならなくて、がっかりした」と、隠しもせず不満を言った。その前の九か月間に彼が二十八ドルしか稼がず、三十二ドルの借金を抱えていたとたまたま知っていたので、この収入源にどれほど熱心に期待したかは、容易に想像できた。何年かたてば票の売買は当たり前になり、取引が滞りなく行われれば、買う側も売る側も、事実を隠そうとろくにしなくなる。
  translation_status: reviewed
- id: da-07-029
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '245'
    source_sequence: 280
    printed_page_end: '246'
  source_text: A certain lodging-house keeper at one time sold the votes of his entire house to a political party and was "well paid for it too"; but being of a grasping turn, he also sold the house for the same election to the rival party. Such an outrage could not be borne. The man was treated to a modern version of tar and feathers, and as a result of being held under a street hydrant in November, contracted pneumonia which resulted in his death. No official investigation took place, since the doctor's certificate of pneumonia was sufficient for legal burial, and public sentiment sustained the action. In various conversations which the writer had concerning the entire transaction, she discovered great indignation concerning his duplicity and treachery, but none whatever for his original offence of selling out the votes of his house.
  translation_ja: ある下宿屋の主人は、一度、下宿人全員の票をある政党に売り、「それでちゃんといい金をもらった」。しかし欲張りな性分から、同じ選挙で、対立する政党にも下宿人の票を売った。これだけのひどい振る舞いは許せないとされた。男は、タールと羽毛を浴びせる昔の私刑を今ふうにした暴行を受け、寒い十一月に街頭の消火栓の水を浴びせられたため肺炎にかかり、そのまま亡くなった。公の捜査は行われなかった。担当医の肺炎だという死亡診断で、法律上は埋葬できたことに加え、世間の感情もその行いを認めていたからだ。この一件についてあちこちで話し合ううちに、私には、二枚舌を使って裏切ったことに対する怒りは大きいのに、はじめに下宿人の票を売り払ったときの不正には、まったく怒っていないと分かった。
  translation_status: reviewed
- id: da-07-030
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '246'
    source_sequence: 281
    printed_page_end: '247'
  source_text: A club will be started for the express purpose of gaining a reputation for political power which may later be sold out. The president and executive committee of such a club, who will naturally receive the funds, promise to divide with "the boys" who swell the size of the membership. A reform movement is at first filled with recruits who are active and loud in their assertions of the number of votes they can "deliver." The reformers are delighted with this display of zeal, and only gradually find out that many of the recruits are there for the express purpose of being bought by the other side; that they are most active in order to seem valuable, and thus raise the price of their allegiance when they are ready to sell. Reformers seeing them drop away one by one, talk of desertion from the ranks of reform, and of the power of money over well-meaning men, who are too weak to withstand temptation; but in reality the men are not deserters because they have never actually been enrolled in the ranks. The money they take is neither a bribe nor the price of their loyalty, it is simply the consummation of a long-cherished plan and a well-earned reward. They came into the new movement for the purpose of being bought out of it, and have successfully accomplished that purpose.
  translation_ja: やがて売り渡せるような政治力があるという評判を得る、まさにそのために、クラブがつくられることがある。金を受け取ることになるクラブの会長と執行委員会は、会員の数を膨らませる「仲間たち」に、金を分けると約束する。改革運動は、最初、何票も「取りまとめられる」と声高に主張する、活動的な新入りで埋まる。改革者はこの熱意に喜ぶが、新入りの多くは、ほかならぬ相手側に買われるためにそこにいると、だんだん気づく。大いに活動するのは、自分の値うちが高く見え、立場を売る準備ができたとき、その代価がつり上がるためだ。改革者は一人ずつ手を引くのを見て、改革の隊列から逃げたのだとか、善意はあっても誘惑に抗えない弱い人に、金が力をふるうのだとか言う。だが実際には、はじめからその隊列にいなかったので、逃げたわけではない。受け取る金は、賄賂でも忠誠の代価でもなく、長く抱いた計画が実を結んで、しかるべく得た報いにすぎない。金を受け取って新しい運動を離れるために加わり、その目的を見事に果たしたのだ。
  translation_status: reviewed
- id: da-07-031
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '247'
    source_sequence: 282
    printed_page_end: '248'
  source_text: Hull-House assisted in carrying on two unsuccessful campaigns against the same alderman. In the two years following the end of the first one, nearly every man who had been prominent in it had received an office from the reëlected alderman. A printer had been appointed to a clerkship in the city hall; a driver received a large salary for services in the police barns; the candidate himself, a bricklayer, held a position in the city construction department. At the beginning of the next campaign, the greatest difficulty was experienced in finding a candidate, and each one proposed, demanded time to consider the proposition. During this period he invariably became the recipient of the alderman's bounty. The first one, who was foreman of a large factory, was reported to have been bought off by the promise that the city institutions would use the product of his firm. The second one, a keeper of a grocery and family saloon, with large popularity, was promised the aldermanic nomination on the regular ticket at the expiration of the term of office held by the alderman's colleague, and it may be well to state in passing that he was thus nominated and successfully elected. The third proposed candidate received a place for his son in the office of the city attorney.
  translation_ja: ハル・ハウスは、同じ市会議員を落選させようとした二度の運動を手伝ったが、どちらも実らなかった。初めの運動が終わってから二年のあいだに、そこで目立った働きをしたほぼ全員が、再選された議員から役職をもらった。印刷工は市役所の事務員に任命され、馬車の御者は警察の厩舎で働いて大きな給料をもらい、れんが職人だった候補者本人は、市の建設部門で職を得た。次の選挙戦を始めるときには、候補者が見つからず大変困った。名前が上がった人は、誰もが提案を考える時間を求め、そのあいだに決まって、議員から何らかの恩恵を受けた。第一の候補は大工場の職長で、市の施設がその会社の製品を使う、という約束で引かせられたと報じられた。次の候補は、食料品店と家族向けの酒場を営む人気のある男で、議員の同僚の任期が切れたら、党の公認の市会議員候補にする、と約束された。付け加えるなら、実際に公認され、無事当選した。三番目の候補の息子は、市の法律顧問の事務所に職をもらった。
  translation_status: reviewed
- id: da-07-032
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '248'
    source_sequence: 283
    printed_page_end: '249'
  source_text: Not only are offices in his gift, but all smaller favors as well. Any requests to the council, or special licenses, must be presented by the alderman of the ward in which the person desiring the favor resides. There is thus constant opportunity for the alderman to put his constituents under obligations to him, to make it difficult for a constituent to withstand him, or for one with large interests to enter into political action at all. From the Italian pedler who wants a license to peddle fruit in the street, to the large manufacturing company who desires to tunnel an alley for the sake of conveying pipes from one building to another, everybody is under obligations to his alderman, and is constantly made to feel it. In short, these very regulations for presenting requests to the council have been made, by the aldermen themselves, for the express purpose of increasing the dependence of their constituents, and thereby augmenting aldermanic power and prestige.
  translation_ja: 議員が与えられるのは、役職だけではない。もっと小さな便宜もすべて、取り計らえる。市議会への要望や特別の許可の申請はどんなものも、要望する人が住む区の市会議員が出さなくてはならない。だから議員は有権者に恩を着せ、逆らいにくくしたり、大きな利害がある人には、とにかく政治活動に加わること自体を難しくしたりする機会が、いつもある。通りで果物を売る許可がほしいイタリア人の行商人から、一棟から別の棟へ管を通すため路地の地下を掘りたい大きな製造会社まで、誰もが自分の区の議員に借りがあり、いつもそれを感じさせられる。要するに、要望を議会へ届けるこの決まりそのものが、有権者の依存を強め、議員の力と威信を増すという、はっきりした目的のために、議員たち自身がつくったものなのである。
  translation_status: reviewed
- id: da-07-033
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '249'
    source_sequence: 284
    printed_page_end: '250'
  source_text: The alderman has also a very singular hold upon the property owners of his ward. The paving, both of the streets and sidewalks throughout his district, is disgraceful; and in the election speeches the reform side holds him responsible for this condition, and promises better paving under another régime. But the paving could not be made better without a special assessment upon the property owners of the vicinity, and paying more taxes is exactly what his constituents do not want to do. In reality, "getting them off," or at the worst postponing the time of the improvement, is one of the genuine favors which he performs. A movement to have the paving done from a general fund would doubtless be opposed by the property owners in other parts of the city who have already paid for the asphalt bordering their own possessions, but they have no conception of the struggle and possible bankruptcy which repaving may mean to the small property owner, nor how his chief concern may be to elect an alderman who cares more for the feelings and pocket-books of his constituents than he does for the repute and cleanliness of his city.
  translation_ja: 市会議員はまた、区の不動産所有者に対して、たいへん妙な力を持っている。地区じゅう、道路も歩道も恥ずかしいほど舗装が悪い。選挙演説では改革側が、その責任は議員にあると言い、別の体制になればよい舗装を約束する。しかし舗装をよくするには、近くの不動産所有者から特別に負担金を取らなくてはならず、税をさらに払うのは、有権者がまさにしたくないことだ。実際にそうした負担を「免れさせる」か、悪くとも工事の時期を先へ延ばすことは、議員が本当にしてくれる便宜の一つである。一般財源で舗装をしようという動きが出ても、自分の土地に沿ったアスファルト舗装の代をすでに払った、ほかの地区の不動産所有者が、きっと反対するだろう。しかし小さな土地の所有者には、舗装のやり直しがどれほどの苦労になり、破産にもつながりうるか、彼らには分からない。町の評判や清潔さより、有権者の気持ちと懐を考えてくれる議員を選ぶことが、そういう人の最大の関心になりうるのも、分からない。
  translation_status: reviewed
- id: da-07-034
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '250'
    source_sequence: 285
    printed_page_end: '252'
  source_text: The alderman exhibited great wisdom in procuring from certain of his down-town friends the sum of three thousand dollars with which to uniform and equip a boys' temperance brigade which had been formed in one of the ward churches a few months before his campaign. Is it strange that the good leader, whose heart was filled with innocent pride as he looked upon these promising young scions of virtue, should decline to enter into a reform campaign? Of what use to suggest that uniforms and bayonets for the purpose of promoting temperance, bought with money contributed by a man who was proprietor of a saloon and a gambling house, might perhaps confuse the ethics of the young soldiers? Why take the pains to urge that it was vain to lecture and march abstract virtues into them, so long as the "champion boodler" of the town was the man whom the boys recognized as a loyal and kindhearted friend, the public-spirited citizen, whom their fathers enthusiastically voted for, and their mothers called "the friend of the poor." As long as the actual and tangible success is thus embodied, marching whether in kindergartens or brigades, talking whether in clubs or classes, does little to change the code of ethics.
  translation_ja: 市会議員がたいへん気を利かせたことがある。選挙運動に入る数か月前、区のある教会で少年の禁酒隊が組織されたが、その制服と装備をそろえるため、中心街の友人の何人かから三千ドルを手に入れたのである。立派な指導者が、将来のある、徳の若い芽を見て、無邪気な誇りに胸をいっぱいにし、改革運動に加わることを断ったのも、不思議だろうか。禁酒を広めるための制服と銃剣を、酒場と賭場の主人だった男が出した金で買えば、少年隊員の善悪の物差しが混乱するかもしれない、と指摘しても、何になるだろう。町で「一番の汚職屋」こそ、少年たちには忠実で気のいい友達で、父親は熱心に票を入れ、母親は「貧しい者の友」と呼ぶ、公共心の篤い市民なのだ。そのあいだは、いくら説教し、行進させて、抽象的な徳を吹き込んでも無駄だと、わざわざ説いて、何になるだろう。このように、目に見える現実の成功が一人の姿に表れているかぎり、幼稚園であれ少年隊であれ行進させても、クラブであれ教室であれ言い聞かせても、倫理の規範を変える役にはほとんど立たない。
  translation_status: reviewed
- id: da-07-035
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '252'
    source_sequence: 286
    printed_page_end: '254'
  source_text: The question of where does the money come from which is spent so successfully, does of course occur to many minds. The more primitive people accept the truthful statement of its sources without any shock to their moral sense. To their simple minds he gets it "from the rich" and, so long as he again gives it out to the poor as a true Robin Hood, with open hand, they have no objections to offer. Their ethics are quite honestly those of the merry-making foresters. The next less primitive people of the vicinage are quite willing to admit that he leads the "gang" in the city council, and sells out the city franchises; that he makes deals with the franchise-seeking companies; that he guarantees to steer dubious measures through the council, for which he demands liberal pay; that he is, in short, a successful "boodler." When, however, there is intellect enough to get this point of view, there is also enough to make the contention that this is universally done, that all the aldermen do it more or less successfully, but that the alderman of this particular ward is unique in being so generous; that such a state of affairs is to be deplored, of course; but that that is the way business is run, and we are fortunate when a kind-hearted man who is close to the people gets a large share of the spoils; that he serves franchised companies who employ men in the building and construction of their enterprises, and that they are bound in return to give work to his constituents. It is again the justification of stealing from the rich to give to the poor. Even when they are intelligent enough to complete the circle, and to see that the money comes, not from the pockets of the companies' agents, but from the street-car fares of people like themselves, it almost seems as if they would rather pay two cents more each time they ride than to give up the consciousness that they have a big, warm-hearted friend at court who will stand by them in an emergency. The sense of just dealing comes apparently much later than the desire for protection and indulgence. On the whole, the gifts and favors are taken quite simply as an evidence of genuine loving-kindness. The alderman is really elected because he is a good friend and neighbor. He is corrupt, of course, but he is not elected because he is corrupt, but rather in spite of it. His standard suits his constituents. He exemplifies
    and exaggerates the popular type of a good man. He has attained what his constituents secretly long for.
  translation_ja: あれほど効果的に使われる金はどこから来たのか、という疑問は、もちろん多くの人の頭に浮かぶ。もっと素朴な人々は、本当の出所を聞いても、道徳の感覚に衝撃を受けずに受け入れる。素朴な考えでは、金は「金持ちから」取ってきたのであり、本物のロビン・フッドのように、気前よく貧しい者へ配り直すかぎり、何も異議はない。心から、あの陽気な森の仲間と同じ倫理なのである。近所でもそれほど素朴でない人たちは、彼が市議会の「一味」を率い、市の事業権を売り払っていること、事業権を求める会社と裏取引をし、いかがわしい案件を議会で通すことを保証して、たっぷり報酬を要求すること、要するに、うまくやっている「汚職屋」であることを、進んで認める。しかしそこまで分かるだけの知性がある人には、こう言う知性もある。誰でもそうしている。議員は皆、多かれ少なかれうまくやるが、これだけ気前がいいのは、この区の議員だけだ。もちろん、このような状況は嘆かわしいにしても、商売とはそう動くものだし、住民に近い心優しい人が、分け前の大きな部分を受け取るなら、運がよい。事業権を得た会社は建設や工事に人を雇うが、議員はそうした企業に便宜を図るので、会社はお返しとして選挙区の住民に仕事を与える義理がある、と。ここでも、金持ちから盗んで、貧しい者に与えることが正当化される。知性があって、その一周を最後までたどり、金は会社の代理人の懐からではなく、自分たちのような人が払う路面電車の運賃から出ると分かっても、いざというとき助けてくれる、気前よく心の温かい有力な味方がいると思えなくなるくらいなら、乗車のたびに二セント余計に払うほうがよい、とさえ考えるようだ。守ってもらい、大目に見てもらいたい願いよりも、公平に扱うという感覚は、どうやらずっと遅く身につく。概して贈り物や便宜は、本当の思いやりの証と、そのまま受け取られる。議員が実際に選ばれるのは、よい友人、よい隣人だからである。むろん腐敗しているが、腐敗しているから選ばれるのではなく、腐敗しているにもかかわらず選ばれるのである。彼の基準は有権者に合っている。人々の考える善人を体現し、さらに極端なところまで大きく見せている。有権者がひそかに切望するものを、すでに手に入れた人なのだ。
  translation_status: reviewed
- id: da-07-036
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '254'
    source_sequence: 287
    printed_page_end: '256'
  source_text: At one end of the ward there is a street of good houses, familiarly called "Con Row." The term is perhaps quite unjustly used, but it is nevertheless universally applied, because many of these houses are occupied by professional office holders. This row is supposed to form a happy hunting-ground of the successful politician, where he can live in prosperity, and still maintain his vote and influence in the ward. It would be difficult to justly estimate the influence which this group of successful, prominent men, including the alderman who lives there, have had upon the ideals of the youth in the vicinity. The path which leads to riches and success, to civic prominence and honor, is the path of political corruption. We might compare this to the path laid out by Benjamin Franklin, who also secured all of these things, but told young men that they could be obtained only by strenuous effort and frugal living, by the cultivation of the mind, and the holding fast to righteousness; or, again, we might compare it to the ideals which were held up to the American youth fifty years ago, lower, to be sure, than the revolutionary ideal, but still fine and aspiring toward honorable dealing and careful living. They were told that the career of the self-made man was open to every American boy, if he worked hard and saved his money, improved his mind, and followed a steady ambition. The writer remembers that when she was ten years old, the village schoolmaster told his little flock, without any mitigating clauses, that Jay Gould had laid the foundation of his colossal fortune by always saving bits of string, and that, as a result, every child in the village assiduously collected party-colored balls of twine. A bright Chicago boy might well draw the inference that the path of the corrupt politician not only leads to civic honors, but to the glories of benevolence and philanthropy. This lowering of standards, this setting of an ideal, is perhaps the worst of the situation, for, as we said in the first chapter, we determine ideals by our daily actions and decisions not only for ourselves, but largely for each other.
  translation_ja: 区の一方の端に、立派な家が並ぶ通りがあり、「ペテン師横丁」の名で親しまれている。呼び方はおそらく不当だが、公職を渡り歩く人が多く住むので、誰もがそう呼ぶ。成功した政治家が、裕福に暮らしながら、区内で自分への票と影響力を保てる、願ってもない場所と目されている。そこに住む議員も含め、こうした成功し名の知れた人々が、近所の若者の理想に及ぼした影響を、正当に測るのは難しい。豊かさと成功、市での目立った立場と名誉に通じる道は、政治の腐敗へ通じる道なのである。それを、ベンジャミン・フランクリンが示した道と比べてもよい。彼も同じものをすべて手にしたが、全力で努力し、無駄のない生活をして、自分の考える力を養い、正しさを堅く守ることによってしか得られないと、青年に教えた。または、五十年前にアメリカの青年が示された理想と比べてもよい。確かに独立革命の時代の理想より低かったが、まだ立派で、誠実に行動し、慎重に暮らすことへと人を向かわせた。懸命に働き、金を貯め、頭を鍛え、一つの目標を着実に追えば、自力で身を立てる道は、どのアメリカの少年にも開かれていると教えられた。十歳のとき、村の先生が生徒たちに、何の留保もつけず、ジェイ・グールドが巨万の富の土台を築けたのは、いつもひもの切れ端を取っておいたからだと教えたのを、私は覚えている。そのおかげで村の子どもはみな、いろとりどりのひもの玉を、せっせとこしらえた。シカゴの利発な少年なら、腐敗した政治家の道は、公の名誉に通じるばかりか、慈善と博愛の栄光にもつながるという結論を、十分に引き出せるだろう。基準を下げ、このような理想を掲げることこそ、この事態の最も悪い面かもしれない。第一章で述べたように、日々どう行い、どう決めるかによって、自分だけでなく、互いの理想をも大きく左右するからである。
  translation_status: reviewed
- id: da-07-037
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '256'
    source_sequence: 288
  source_text: We are all involved in this political corruption, and as members of the community stand indicted. This is the penalty of a democracy,—that we are bound to move forward or retrograde together. None of us can stand aside; our feet are mired in the same soil, and our lungs breathe the same air.
  translation_ja: 私たちはみな、この政治の腐敗の当事者であり、共同体の一員として責任を問われる。これが民主主義の代償だ。前へ進むにも後戻りするにも、みな一緒でなければならない。誰も脇に立ってはいられない。私たちの足は同じぬかるみに取られ、同じ空気を吸っている。
  translation_status: reviewed
- id: da-07-038
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '257'
    source_sequence: 289
    printed_page_end: '260'
  source_text: 'That the alderman has much to do with setting the standard of life and desirable prosperity may be illustrated by the following incident: During one of the campaigns a clever cartoonist drew a poster representing the successful alderman in portraiture drinking champagne at a table loaded with pretentious dishes and surrounded by other revellers. In contradistinction was his opponent, a bricklayer, who sat upon a half-finished wall, eating a meagre dinner from a workingman''s dinner-pail, and the passer-by was asked which type of representative he preferred, the presumption being that at least in a workingman''s district the bricklayer would come out ahead. To the chagrin of the reformers, however, it was gradually discovered that, in the popular mind, a man who laid bricks and wore overalls was not nearly so desirable for an alderman as the man who drank champagne and wore a diamond in his shirt front. The district wished its representative "to stand up with the best of them," and certainly some of the constituents would have been ashamed to have been represented by a bricklayer. It is part of that general desire to appear well, the optimistic and thoroughly American belief, that even if a man is working with his hands to-day, he and his children will quite likely be in a better position in the swift coming to-morrow, and there is no need of being too closely associated with common working people. There is an honest absence of class consciousness, and a naïve belief that the kind of occupation quite largely determines social position. This is doubtless exaggerated in a neighborhood of foreign people by the fact that as each nationality becomes more adapted to American conditions, the scale of its occupation rises. Fifty years ago in America "a Dutchman" was used as a term of reproach, meaning a man whose language was not understood, and who performed menial tasks, digging sewers and building railroad embankments. Later the Irish did the same work in the community, but as quickly as possible handed it on to the Italians, to whom the name "dago" is said to cling as a result of the digging which the Irishman resigned to him. The Italian himself is at last waking up to this fact. In a political speech recently made by an Italian padrone, he bitterly reproached the alderman for giving the-four-dollars-a-day "jobs" of sitting in an office to Irishmen
    and the-dollar-and-a-half-a-day "jobs" of sweeping the streets to the Italians. This general struggle to rise in life, to be at least politically represented by one of the best, as to occupation and social status, has also its negative side. We must remember that the imitative impulse plays an important part in life, and that the loss of social estimation, keenly felt by all of us, is perhaps most dreaded by the humblest, among whom freedom of individual conduct, the power to give only just weight to the opinion of neighbors, is but feebly developed. A form of constraint, gentle, but powerful, is afforded by the simple desire to do what others do, in order to share with them the approval of the community. Of course, the larger the number of people among whom an habitual mode of conduct obtains, the greater the constraint it puts upon the individual will. Thus it is that the political corruption of the city presses most heavily where it can be least resisted, and is most likely to be imitated.'
  translation_ja: どんな暮らしや豊かさが望ましいとされるかに、その議員が大きく関わることは、次の一件で分かる。選挙運動の一つで、腕のよい風刺画家がポスターを描いた。勝ち続けてきた議員が、見栄を張って並べた皿でいっぱいの食卓に座り、宴会の仲間に囲まれ、シャンパンを飲む姿だった。対照的に、対立候補のれんが職人は、積みかけの壁に腰かけ、労働者の弁当箱から、つましい食事を口にする。通りがかった人に、どちらのような人を代表に選びたいですか、と尋ねる。少なくとも労働者の地区なら、れんが職人のほうが勝るという見込みだった。ところが改革側ががっかりしたことに、世間では、作業着を着てれんがを積む男は、シャンパンを飲み、シャツの胸にダイヤを飾る男ほど、市会議員にふさわしくないと考えられていることが、次第に分かった。地区の人は、自分たちの代表が「いちばん立派な連中の隣でも見劣りしない」ことを望んだ。れんが職人に代表されたら恥ずかしいと思う有権者も、確かにいたはずだ。少しでもよく見られたいという、ごくふつうの願いの一部である。いかにもアメリカらしい楽天的な考えでは、今日自分の手で働いていても、刻々と近づく明日には、本人にも子どもにも、よりよい立場に就ける見込みが十分ある。だから並の労働者と、あまりに近いつながりを持つ必要はない。自分がどの階級に属するかという意識が、本当に乏しく、職の種類で大方、社会的地位が決まると無邪気に信じている。移民の地区では、出身の異なる人々がアメリカでの暮らしになじむにつれて、就ける職も次第に上がるので、それがいっそう強調されるのはまちがいない。五十年前のアメリカで「ダッチマン」は、言葉が分からず、下水道を掘り、鉄道の土手を築くような下働きをする者をののしる言葉だった。その後は同じ地域でアイルランド人がその仕事をし、できるだけ早くイタリア人に引き渡した。イタリア人には「デイゴ」という蔑称がこびりついたと言われる。アイルランド人が手放して押しつけた穴掘りのためだという。当のイタリア人も、ようやくそのことに気づきつつある。イタリア人のあるパドローネは、最近の政治演説で、職場の机に座って日当四ドルの「仕事」をアイルランド人に与え、通りを掃いて日当一ドル五十セントの「仕事」をイタリア人に与えると、市会議員を激しく責めた。世に出たい、少なくとも政治では職や社会的地位の点で上の人に代表してもらいたいという、この誰にもある努力には、悪い面もある。人のまねをしたいという気持ちが人生で大きく働き、周囲の評価を失うことを私たちはみなつらく感じるが、最も立場の弱い人ほど、それを恐れるかもしれないことを思い出さなくてはならない。自分の行いは自由に決め、近所の人の意見にはふさわしい重みだけを与えるという力が、まだ十分に育っていないからである。人と同じことをして、地域の人に同じように認められたいというだけで、柔らかくはあっても力強いしばりがかかる。当然、ある振る舞いが習慣になっている人の数が多いほど、一人ひとりの意志へのしばりは大きい。こうして都市の腐敗した政治は、最も抗いにくいところでいちばん重くのしかかり、そこでいちばんまねをされやすい。
  translation_status: reviewed
- id: da-07-039
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '260'
    source_sequence: 290
    printed_page_end: '262'
  source_text: According to the same law, the positive evils of corrupt government are bound to fall heaviest upon the poorest and least capable. When the water of Chicago is foul, the prosperous buy water bottled at distant springs; the poor have no alternative but the typhoid fever which comes from using the city's supply. When the garbage contracts are not enforced, the well-to-do pay for private service; the poor suffer the discomfort and illness which are inevitable from a foul atmosphere. The prosperous business man has a certain choice as to whether he will treat with the "boss" politician or preserve his independence on a smaller income; but to an Italian day laborer it is a choice between obeying the commands of a political "boss" or practical starvation. Again, a more intelligent man may philosophize a little upon the present state of corruption, and reflect that it is but a phase of our commercialism, from which we are bound to emerge; at any rate, he may give himself the solace of literature and ideals in other directions, but the more ignorant man who lives only in the narrow present has no such resource; slowly the conviction enters his mind that politics is a matter of favors and positions, that self-government means pleasing the "boss" and standing in with the "gang." This slowly acquired knowledge he hands on to his family. During the month of February his boy may come home from school with rather incoherent tales about Washington and Lincoln, and the father may for the moment be fired to tell of Garibaldi, but such talk is only periodic, and the long year round the fortunes of the entire family, down to the opportunity to earn food and shelter, depend upon the "boss."
  translation_ja: 同じ道理で、腐敗した政府の実際の害は、最も貧しく、力も乏しい人々に、最も重くのしかからざるをえない。シカゴの水が汚いと、裕福な人は遠い水源で瓶に詰めた水を買う。貧しい人には市の水を使うほかなく、腸チフスにかかる。ごみ回収の契約が履行されなければ、ゆとりのある人は民間のサービスに金を払う。貧しい人は、汚れた空気が必ずもたらす不快と病気に苦しむ。成功した実業家は、政治の「ボス」と取引するか、収入を減らしても自分の独立を保つか、いくらか選べる。イタリア人の日雇い労働者には、ボスの命令に従うか、事実上飢えるかの選択しかない。また、学のある人は現在の腐敗について少し考え、これは商売を重んじる私たちの社会の一段階にすぎず、いずれ抜け出すと考えるかもしれない。少なくとも本を読んだり、別の理想に心を向けたりして、気持ちを慰められる。だが目の前の狭い世界だけで暮らす、あまり知識のない人には、そういう手立てはない。政治とは便宜と職のことで、自治とは「ボス」に気に入ってもらい、「一味」の仲間に入ることだという確信が、じわじわ心に入り込む。そうして身につけた知識を、家族へ伝える。二月には、息子が学校から帰って、ワシントンやリンカーンの話をたどたどしくしてくれるかもしれない。それを聞き、父親もしばらくガリバルディの話をしたくなるかもしれない。だがそんな話はときどきしか出ず、一年を通じて一家全体の運命は、食べ物と寝る場所を得るために働けるかどうかに至るまで、「ボス」のおかげで決まる。
  translation_status: reviewed
- id: da-07-040
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '262'
    source_sequence: 291
  source_text: In a certain measure also, the opportunities for pleasure and recreation depend upon him. To use a former illustration, if a man happens to have a taste for gambling, if the slot machine affords him diversion, he goes to those houses which are protected by political influence. If he and his friends like to drop into a saloon after midnight, or even want to hear a little music while they drink together early in the evening, he is breaking the law when he indulges in either of them, and can only be exempt from arrest or fine because the great political machine is friendly to him and expects his allegiance in return.
  translation_ja: 楽しみや気晴らしの機会も、ある程度、彼にかかっている。前に引いた例で言えば、もし賭けが好きで、スロット機で気晴らしをしたいなら、政治の影響力に守られた店に行く。仲間と夜中すぎに酒場へ寄るのが好きだったり、あるいは宵のうちに、一緒に飲みながら少し音楽を聴きたかったりしても、どちらを楽しんでも法律違反である。逮捕や罰金を免れられるのは、大きな政治組織が味方してくれて、代わりに忠誠を求めるからにほかならない。
  translation_status: reviewed
- id: da-07-041
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '262'
    source_sequence: 292
    printed_page_end: '263'
  source_text: During the campaign, when it was found hard to secure enough local speakers of the moral tone which was desired, orators were imported from other parts of the town, from the so-called "better element." Suddenly it was rumored on all sides that, while the money and speakers for the reform candidate were coming from the swells, the money which was backing the corrupt alderman also came from a swell source; that the president of a street-car combination, for whom he performed constant offices in the city council, was ready to back him to the extent of fifty thousand dollars; that this president, too, was a good man, and sat in high places; that he had recently given a large sum of money to an educational institution and was therefore as philanthropic, not to say good and upright, as any man in town; that the corrupt alderman had the sanction of the highest authorities, and that the lecturers who were talking against corruption, and the selling and buying of franchises, were only the cranks, and not the solid business men who had developed and built up Chicago.
  translation_ja: 選挙運動中、望みどおりの道徳的な口調で話す地元の演説者を十分そろえることが難しく、町のほかの場所から、いわゆる「立派な階層」の演説者を呼んできた。すると突然、あちこちでうわさになった。改革派の候補の金と演説者は上流の人々から来ているが、腐敗した市会議員を支える金にも、同じように上流の金主がいる。路面電車を束ねる会社の社長で、議員が市議会で何度も便宜を図った人が、五万ドルまでは後押しできるという。この社長も善人で、高い地位にいる。最近、教育機関に大金を寄付したので、町のどの者にも劣らず慈善に熱心で、それどころか、善良で高潔だと言ってもよい。腐敗した議員のほうには最高の権威からもお墨付きがあり、腐敗や営業権の売買に反対して講演する人たちは、シカゴを発展させ築き上げた堅実な実業家などではなく、ただの変わり者だ、という話だった。
  translation_status: reviewed
- id: da-07-042
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '263'
    source_sequence: 293
    printed_page_end: '264'
  source_text: All parts of the community are bound together in ethical development. If the so-called more enlightened members accept corporate gifts from the man who buys up the council, and the so-called less enlightened members accept individual gifts from the man who sells out the council, we surely must take our punishment together. There is the difference, of course, that in the first case we act collectively, and in the second case individually; but is the punishment which follows the first any lighter or less far-reaching in its consequences than the more obvious one which follows the second?
  translation_ja: 共同体のどの部分も、倫理の発達において、互いに結び合っている。いわゆる啓蒙の進んだ人々が、市議会を買い取る男から団体として寄付を受け、啓蒙の進んでいないと言われる人々が、市議会を売り渡す男から個人として贈り物を受けるのなら、私たちは一緒にその報いを受けなくてはならない。前者は集団として、後者は個人として動く、という違いはもちろんある。だが前者に続く報いは、後者に続く、もっと目に見えやすい報いより軽く、あるいは遠くへ影響を及ぼさないと言えるだろうか。
  translation_status: reviewed
- id: da-07-043
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '264'
    source_sequence: 294
  source_text: Have our morals been so captured by commercialism, to use Mr. Chapman's generalization, that we do not see a moral dereliction when business or educational interests are served thereby, although we are still shocked when the saloon interest is thus served?
  translation_ja: チャップマン氏の言葉を借りて大きく言えば、私たちの道徳は、商業主義のとりこになりすぎているのだろうか。商売や教育の利益になるなら、道徳上の務めを怠っているとは思わず、同じことが酒場の利益になれば、いまも衝撃を受けるほどに、である。
  translation_status: reviewed
- id: da-07-044
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '264'
    source_sequence: 295
    printed_page_end: '267'
  source_text: The street-car company which declares that it is impossible to do business without managing the city council, is on exactly the same moral level with the man who cannot retain political power unless he has a saloon, a large acquaintance with the semi-criminal class, and questionable money with which to debauch his constituents. Both sets of men assume that the only appeal possible is along the line of self-interest. They frankly acknowledge money getting as their own motive power, and they believe in the cupidity of all the men whom they encounter. No attempt in either case is made to put forward the claims of the public, or to find a moral basis for action. As the corrupt politician assumes that public morality is impossible, so many business men become convinced that to pay tribute to the corrupt aldermen is on the whole cheaper than to have taxes too high; that it is better to pay exorbitant rates for franchises, than to be made unwilling partners in transportation experiments. Such men come to regard political reformers as a sort of monomaniac, who are not reasonable enough to see the necessity of the present arrangement which has slowly been evolved and developed, and upon which business is safely conducted. A reformer who really knew the people and their great human needs, who believed that it was the business of government to serve them, and who further recognized the educative power of a sense of responsibility, would possess a clew by which he might analyze the situation. He would find out what needs, which the alderman supplies, are legitimate ones which the city itself could undertake, in counter-distinction to those which pander to the lower instincts of the constituency. A mother who eats her Christmas turkey in a reverent spirit of thankfulness to the alderman who gave it to her, might be gradually brought to a genuine sense of appreciation and gratitude to the city which supplies her little children with a Kindergarten, or, to the Board of Health which properly placarded a case of scarlet-fever next door and spared her sleepless nights and wearing anxiety, as well as the money paid with such difficulty to the doctor and the druggist. The man who in his emotional gratitude almost kneels before his political friend who gets his boy out of jail, might be made to see the kindness and good sense of the city authorities who provided the
    boy with a playground and reading room, where he might spend his hours of idleness and restlessness, and through which his temptations to petty crime might be averted. A man who is grateful to the alderman who sees that his gambling and racing are not interfered with, might learn to feel loyal and responsible to the city which supplied him with a gymnasium and swimming tank where manly and well-conducted sports are possible. The voter who is eager to serve the alderman at all times, because the tenure of his job is dependent upon aldermanic favor, might find great relief and pleasure in working for the city in which his place was secured by a well-administered civil service law.
  translation_ja: 市議会を操らないことには営業ができないと言う路面電車会社も、酒場を持ち、犯罪に近いところにいる大勢の人と知り合い、いかがわしい金で有権者の気持ちを腐らせなければ政治の力を保てない男も、道徳の水準はまったく同じである。どちらも、相手を動かせるのは自己利益に訴えるときだけと決めている。自分を動かす力は金もうけだと隠さずに認め、出会うどの人間も金に欲が深いと信じる。どちらも、公衆が何を求めるかを表に出そうとせず、行動の道徳的な根拠を見つけようともしない。腐敗した政治家は、公の道徳は実現できないと考える。同じように多くの実業家は、税が高くなりすぎるより、腐敗した議員に貢ぎ物を出すほうが、全体として安く上がる、自分の望まぬ交通の実験に付き合わされるより、営業権に法外な額を払うほうがよい、と信じるようになる。そんな人には、政治改革者は一つのことに取りつかれた狂人のように見えてくる。現在のやり方は、少しずつ形をとって発展し、おかげで商売が安全にできるのに、これが必要だと分かるだけの分別がないというのだ。もし改革者が住民と、住民が人間として深く必要とするものを本当に知り、それに応えるのが政府の仕事だと信じ、そのうえ責任を感じることには人を教育する力があると認めれば、事態を分析する手がかりがある。市会議員が応えている要求のうち、市自身が引き受けてもよい正当なものと、有権者の卑しい本能に迎合するだけのものとを、見分けられるだろう。議員がくれた七面鳥を、ありがたさで胸をいっぱいにしてクリスマスに食べる母親がいる。その人も、幼い子に幼稚園を与える市や、隣で猩紅熱の患者が出たとききちんと掲示し、眠れない夜や気の休まらない心配、苦労して医者や薬屋に払う金まで免れさせてくれた保健委員会に、心から価値を認め、感謝を覚えるように、少しずつ導かれうる。息子を監獄から出した政治家の友人の前に、感激のあまり、ひざまずきそうな男がいる。その人にも、市当局が少年に遊び場と閲覧室を用意し、もてあます時間を過ごす場所を与えて、小さな犯罪への誘惑から遠ざけてくれることの親切さと、分別のよさが、分かるかもしれない。賭け事や競馬を邪魔されないようにしてくれる議員に感謝する男も、体と気持ちを鍛える節度ある運動のできる体育館とプールを用意した市に、誠実でありたい、責任を持ちたいと感じるようになるかもしれない。仕事を続けられるかが議員の好意しだいなので、いつでもその人に尽くしたいと願う有権者も、きちんと運営される公務員制度の法律が職を守る市で働けたなら、大きな安堵と喜びを感じるかもしれない。
  translation_status: reviewed
- id: da-07-045
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '267'
    source_sequence: 296
    printed_page_end: '269'
  source_text: After all, what the corrupt alderman demands from his followers and largely depends upon is a sense of loyalty, a standing-by the man who is good to you, who understands you, and who gets you out of trouble. All the social life of the voter from the time he was a little boy and played "craps" with his "own push," and not with some other "push," has been founded on this sense of loyalty and of standing in with his friends. Now that he is a man, he likes the sense of being inside a political organization, of being trusted with political gossip, of belonging to a set of fellows who understand things, and whose interests are being cared for by a strong friend in the city council itself. All this is perfectly legitimate, and all in the line of the development of a strong civic loyalty, if it were merely socialized and enlarged. Such a voter has already proceeded in the forward direction in so far as he has lost the sense of isolation, and has abandoned the conviction that city government does not touch his individual affairs. Even Mill claims that the social feelings of man, his desire to be at unity with his fellow-creatures, are the natural basis for morality, and he defines a man of high moral culture as one who thinks of himself, not as an isolated individual, but as a part in a social organism.
  translation_ja: 結局、腐敗した市会議員が支持者に求め、大きく頼るのは、忠誠の気持ちである。自分に親切で、自分を分かってくれ、困ったところから救い出してくれる人を、見捨てずに支えることだ。有権者の社会生活は、小さいころ、ほかの「連中」とではなく「自分たちの仲間」とさいころ賭博をしたときから、すべてこの忠誠と、友に味方する気持ちを土台にしてきた。大人になった今は、政治の組織の内側にいる、内輪の政治の話をしてもらえる、事情に通じ、しかも市議会そのものにいる有力な友人が利益を守ってくれる仲間の一員である、という気持ちを好む。これはどれもすっかり筋が通っており、ただ社会に開き広げていければ、市に対する強い忠誠心を育てる方向にある。そういう有権者は、自分は孤立しているという感覚をなくし、市政は自分の暮らしに触れもしないという考えを捨てた点で、すでに先へ進んでいる。ミルでさえ、人が社会に対して抱く感情、仲間と一つでありたいと願うことは、道徳の自然な基礎だと主張する。道徳のよく育った人とは、自分を孤立した個人ではなく、社会という一つの有機体の一部と考える人だと定義している。
  translation_status: reviewed
- id: da-07-046
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '269'
    source_sequence: 297
  source_text: Upon this foundation it ought not to be difficult to build a structure of civic virtue. It is only necessary to make it clear to the voter that his individual needs are common needs, that is, public needs, and that they can only be legitimately supplied for him when they are supplied for all. If we believe that the individual struggle for life may widen into a struggle for the lives of all, surely the demand of an individual for decency and comfort, for a chance to work and obtain the fulness of life may be widened until it gradually embraces all the members of the community, and rises into a sense of the common weal.
  translation_ja: この土台に、市民としての徳を築くことは、難しくないはずだ。その有権者が個人として必要とするものは、皆が必要とするもの、つまり公共の必要であり、誰にでも満たされるときにしか、本人にも正当に満たされないと、はっきり分かるようにすればよい。一人が自分の命を守るための闘いは、皆の命を守る闘いへ広がりうると信じるなら、一人の人間がまともに、気持ちよく暮らしたい、働く機会を得て、生活を十分なものにしたいという願いも、きっと広げられる。やがて共同体の成員すべてを包み、皆にとって何がよいのかという意識にまで、高められるはずである。
  translation_status: reviewed
- id: da-07-047
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '269'
    source_sequence: 298
    printed_page_end: '270'
  source_text: In order, however, to give him a sense of conviction that his individual needs must be merged into the needs of the many, and are only important as they are thus merged, the appeal cannot be made along the line of self-interest. The demand should be universalized; in this process it would also become clarified, and the basis of our political organization become perforce social and ethical.
  translation_ja: とはいえ、自分一人の必要は大勢の必要のなかに一つにならなくてはならず、そうして初めて重要になる、という確信を持ってもらうには、本人の自己利益に訴えることはできない。その要求は、誰にも当てはまるものにするべきだ。その過程では、何を求めているかもはっきりし、私たちの政治の組織の土台は、どうしても社会と倫理に根ざすものになる。
  translation_status: reviewed
- id: da-07-048
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '270'
    source_sequence: 299
  source_text: Would it be dangerous to conclude that the corrupt politician himself, because he is democratic in method, is on a more ethical line of social development than the reformer, who believes that the people must be made over by "good citizens" and governed by "experts"? The former at least are engaged in that great moral effort of getting the mass to express itself, and of adding this mass energy and wisdom to the community as a whole.
  translation_ja: 腐敗した政治家自身は、やり方が民主的であるため、住民は「善良な市民」がつくり直し、「専門家」が治めるべきだと信じる改革者より、倫理にかなった社会の発達の道にある、と結論するのは危険だろうか。腐敗した政治家たちも少なくとも、大勢の人々が自分の思いを表し、その活力と知恵を社会全体に加えられるようにするという、大きな道徳の仕事に、取り組んではいる。
  translation_status: reviewed
- id: da-07-049
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '270'
    source_sequence: 300
    printed_page_end: '271'
  source_text: The wide divergence of experience makes it difficult for the good citizen to understand this point of view, and many things conspire to make it hard for him to act upon it. He is more or less a victim to that curious feeling so often possessed by the good man, that the righteous do not need to be agreeable, that their goodness alone is sufficient, and that they can leave the arts and wiles of securing popular favor to the self-seeking. This results in a certain repellent manner, commonly regarded as the apparel of righteousness, and is further responsible for the fatal mistake of making the surroundings of "good influences" singularly unattractive; a mistake which really deserves a reprimand quite as severe as the equally reprehensible deed of making the surroundings of "evil influences" so beguiling. Both are akin to that state of mind which narrows the entrance into a wider morality to the eye of a needle, and accounts for the fact that new moral movements have ever and again been inaugurated by those who have found themselves in revolt against the conventionalized good.
  translation_ja: 経験があまりに違うため、善良な市民がこの見方を理解するのは難しい。様々な事情が重なり、その見方に従って行動するのは、さらに難しい。立派な人がよく持つ、あの奇妙な気持ちの犠牲になって、正しい者は感じよくある必要などなく、善良なだけで十分であり、人々の好意を取りつけるための技や計略は、私利私欲に走る者に任せればよいと、多かれ少なかれ思っているからだ。その結果、どこか人を寄せつけない物腰が生まれ、正しい者ならまとう衣のように、ふつう思われる。さらに、「善い影響」のある場所を、ことのほか魅力のないものにするという、致命的な過ちを招く。この過ちは、「悪い影響」のある場所をたいへん魅惑的にするという、同じくらい責められるべき行いに劣らず、厳しくたしなめられてよい。どちらも、より広い道徳への入口を針の穴ほどに狭くする心のあり方とつながっている。新しい道徳の動きが、決まりきった善に反発するようになった人々によって、何度となく始められたのはそのためだ。
  translation_status: reviewed
- id: da-07-050
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '271'
    source_sequence: 301
    printed_page_end: '273'
  source_text: The success of the reforming politician who insists upon mere purity of administration and upon the control and suppression of the unruly elements in the community, may be the easy result of a narrowing and selfish process. For the painful condition of endeavoring to minister to genuine social needs, through the political machinery, and at the same time to remodel that machinery so that it shall be adequate to its new task, is to encounter the inevitable discomfort of a transition into a new type of democratic relation. The perplexing experiences of the actual administration, however, have a genuine value of their own. The economist who treats the individual cases as mere data, and the social reformer who labors to make such cases impossible, solely because of the appeal to his reason, may have to share these perplexities before they feel themselves within the grasp of a principle of growth, working outward from within; before they can gain the exhilaration and uplift which comes when the individual sympathy and intelligence is caught into the forward intuitive movement of the mass. This general movement is not without its intellectual aspects, but it has to be transferred from the region of perception to that of emotion before it is really apprehended. The mass of men seldom move together without an emotional incentive. The man who chooses to stand aside, avoids much of the perplexity, but at the same time he loses contact with a great source of vitality.
  translation_ja: 行政が清廉でありさえすればよいと言い、共同体で手に負えない人々を抑え、統制しようとする改革派の政治家が成功したとしても、それは狭く利己的なやり方で、たやすく得た結果かもしれない。政治の仕組みを通じて社会の本当の必要を満たそうとしながら、同時に、その新しい務めに間に合うように仕組みをつくり変えようとする、つらい立場に置かれて初めて、新しい民主的な関係へ移るとき、どうしても伴う居心地の悪さと出会う。しかし実際に行政を行ううちに戸惑う経験には、それ自体に本物の価値がある。個々の事例をただのデータとして扱う経済学者も、頭で考えたことに動かされて、そのような事例が起こらないように努める社会改革者も、この戸惑いを分かち合う必要があるかもしれない。内から外へ向かって働く成長の原理に、自分自身がとらえられていると感じるために。また、一人の共感と知性が、人々の直感に導かれる前進に巻き込まれるときに覚える、元気と高揚を得るために、である。この全体の動きには、知性に関わる一面ももちろんある。だがそれは、頭で分かる領域から感情の領域に移らなければ、本当に理解されない。気持ちを駆り立てるものもないのに、大勢の人が一緒に動くことは、ほとんどない。脇に立つと決めた人は、戸惑いの多くを避けられるが、同時に活力の大きな源から離れてしまう。
  translation_status: reviewed
- id: da-07-051
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '273'
    source_sequence: 302
    printed_page_end: '274'
  source_text: Perhaps the last and greatest difficulty in the paths of those who are attempting to define and attain a social morality, is that which arises from the fact that they cannot adequately test the value of their efforts, cannot indeed be sure of their motives until their efforts are reduced to action and are presented in some workable form of social conduct or control. For action is indeed the sole medium of expression for ethics. We continually forget that the sphere of morals is the sphere of action, that speculation in regard to morality is but observation and must remain in the sphere of intellectual comment, that a situation does not really become moral until we are confronted with the question of what shall be done in a concrete case, and are obliged to act upon our theory. A stirring appeal has lately been made by a recognized ethical lecturer who has declared that "It is insanity to expect to receive the data of wisdom by looking on. We arrive at moral knowledge only by tentative and observant practice. We learn how to apply the new insight by having attempted to apply the old and having found it to fail."
  translation_ja: 社会の道徳を言葉にし、身につけようと歩む人々にとって、最後の、そしておそらく最大の難しさがある。努力を実際の行動に移し、社会で行うことや社会を律することの、実行可能な形で示すまでは、努力の価値を十分に試せず、自分の動機にさえ確信が持てないことだ。倫理が姿を表す手段は、実は行動しかない。道徳が働く領域は行動の領域だということ、道徳について思索するのは、ただ眺めているにすぎず、頭で論評する領域を出ないということを、私たちはいつも忘れる。具体的な場合に何をすべきかという問いを突きつけられ、理論に従って動くことが求められて初めて、その状況は本当に道徳の問題となる。ある認められた倫理の講師が、最近こう力強く訴えた。「脇で見ていれば、知恵を得るための材料が手に入ると期待するのは正気ではない。試しにやってみて、結果をよく見る実践によってしか、道徳上の知識にはたどり着けない。前に得た洞察を当てはめようとして失敗したからこそ、新しい洞察をどう生かすかを学ぶのである。」
  translation_status: reviewed
- id: da-07-052
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '274'
    source_sequence: 303
  source_text: This necessity of reducing the experiment to action throws out of the undertaking all timid and irresolute persons, more than that, all those who shrink before the need of striving forward shoulder to shoulder with the cruder men, whose sole virtue may be social effort, and even that not untainted by self-seeking, who are indeed pushing forward social morality, but who are doing it irrationally and emotionally, and often at the expense of the well-settled standards of morality.
  translation_ja: 試みを行動に移す必要があるために、気の弱い人や決断のつかない人はみな、この取り組みから外れる。そればかりでなく、もっと粗野な人々と肩を並べて前へ進む必要に尻込みする人も、すべて外れる。この人々に徳と呼べるところは社会のための努力だけかもしれず、それにしても私利私欲と無縁ではない。たしかに社会の道徳を先へ進めてはいるが、理屈より感情で行動し、すでに確立した道徳の規範を犠牲にすることも多いのである。
  translation_status: reviewed
- id: da-07-053
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '274'
    source_sequence: 304
    printed_page_end: '275'
  source_text: The power to distinguish between the genuine effort and the adventitious mistakes is perhaps the most difficult test which comes to our fallible intelligence. In the range of individual morals, we have learned to distrust him who would reach spirituality by simply renouncing the world, or by merely speculating upon its evils. The result, as well as the process of virtues attained by repression, has become distasteful to us. When the entire moral energy of an individual goes into the cultivation of personal integrity, we all know how unlovely the result may become; the character is upright, of course, but too coated over with the result of its own endeavor to be attractive. In this effort toward a higher morality in our social relations, we must demand that the individual shall be willing to lose the sense of personal achievement, and shall be content to realize his activity only in connection with the activity of the many.
  translation_ja: 本物の努力と、そこにたまたま伴う間違いを見分ける力こそ、誤りがちな私たちの知性が受ける最も難しい試練かもしれない。個人の道徳で言えば、ただ世を捨てたり、世の悪について考えを巡らせたりするだけで、精神の高みに達しようとする人を、私たちは信用しないことを覚えた。自分を抑えつけて手に入れる徳には、その過程と同じく、その結果にも、気が進まなくなった。ある人の道徳の力がすべて、個人としての高潔さを養うことに向けられると、どれほど好ましくない結果になるか、誰もが知っている。人柄は確かに立派だが、自分で努力して得たものをまとうばかりで、人を引きつけない。社会の人間関係において、より高い道徳を求めるこの努力では、一人ひとりが自分で成し遂げたという気持ちを進んで手放し、自分の活動は多くの人の活動とつながって初めて形になると考えて、それで満足することを、求めなければならない。
  translation_status: reviewed
- id: da-07-054
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '275'
    source_sequence: 305
    printed_page_end: '276'
  source_text: The cry of "Back to the people" is always heard at the same time, when we have the prophet's demand for repentance or the religious cry of "Back to Christ," as though we would seek refuge with our fellows and believe in our common experiences as a preparation for a new moral struggle.
  translation_ja: 預言者の悔い改めよという求めや、信仰から出た「キリストに帰れ」という叫びが聞こえるときには、いつも同時に「民衆に帰れ」という声がする。まるで、新しい道徳の闘いに備えるため、仲間のもとに身を寄せ、自分たちの共通の経験を信じようとするかのように。
  translation_status: reviewed
- id: da-07-055
  section_id: ch-07
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '276'
    source_sequence: 306
    printed_page_end: '277'
  source_text: As the acceptance of democracy brings a certain life-giving power, so it has its own sanctions and comforts. Perhaps the most obvious one is the curious sense which comes to us from time to time, that we belong to the whole, that a certain basic well being can never be taken away from us whatever the turn of fortune. Tolstoy has portrayed the experience in "Master and Man." The former saves his servant from freezing, by protecting him with the heat of his body, and his dying hours are filled with an ineffable sense of healing and well-being. Such experiences, of which we have all had glimpses, anticipate in our relation to the living that peace of mind which envelopes us when we meditate upon the great multitude of the dead. It is akin to the assurance that the dead understand, because they have entered into the Great Experience, and therefore must comprehend all lesser ones; that all the misunderstandings we have in life are due to partial experience, and all life's fretting comes of our limited intelligence; when the last and Great Experience comes, it is, perforce, attended by mercy and forgiveness. Consciously to accept Democracy and its manifold experiences is to anticipate that peace and freedom.
  translation_ja: 民主主義を受け入れれば、ある種の生きる力を得られる。そして民主主義には、それを裏づけるものと、慰めを与えるものがある。おそらく最も分かりやすいのは、ときおり私たちに訪れる奇妙な感覚だ。自分は全体の一部であり、運命がどう変わろうと、土台にある何か安らかなものは決して奪われない、という感覚である。トルストイは『主人と下男』に、その経験を描いた。主人は自分の体温で下男を守り、凍死から救う。その主人が死を迎える時間は、言葉に尽くせない癒やしと安らぎで満たされている。誰もがちらりと触れたことのある、こうした経験は、数えきれない死者に思いをはせるときに包まれる心の安らぎを、生きている人との関係のなかで、先に味わわせてくれる。それは次のような確信に似ている。死者は〈大いなる経験〉に入ったため、どんな小さな経験も、きっと理解する。生きているときの行き違いはすべて、経験の一部しか知らないために生じ、暮らしで心をすり減らすこともすべて、知性に限りがあるために起きる。最後の、あの大いなる経験が訪れるなら、慈悲と許しも必ず伴う。民主主義と、そこにあるさまざまな経験を自覚して受け入れることは、その安らぎと自由を先に味わうことなのである。
  translation_status: reviewed

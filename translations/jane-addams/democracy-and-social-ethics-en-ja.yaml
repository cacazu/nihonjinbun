  source_text: The following pages present the substance of a course of twelve lectures on "Democracy and Social Ethics" which have been delivered at various colleges and university extension centres.
  translation_ja: 本書は、各地の大学や大学の公開講座で行った「民主主義と社会倫理」と題する全十二回の講義の内容をまとめたものである。
  translation_status: reviewed
- id: da-preface-002
  section_id: preface
  kind: paragraph

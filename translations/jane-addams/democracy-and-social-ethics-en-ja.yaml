    source_sequence: 99
    printed_page_end: '86'
  source_text: The modern woman finds herself educated to recognize a stress of social obligation which her family did not in the least anticipate when they sent her to college. She finds herself, in addition, under an impulse to act her part as a citizen of the world. She accepts her family inheritance with loyalty and affection, but she has entered into a wider inheritance as well, which, for lack of a better phrase, we call the social claim. This claim has been recognized for four years in her training, but after her return from college the family claim is again exclusively and strenuously asserted. The situation has all the discomfort of transition and compromise. The daughter finds a constant and totally unnecessary conflict between the social and the family claims. In most cases the former is repressed and gives way to the family claim, because the latter is concrete and definitely asserted, while the social demand is vague and unformulated. In such instances the girl quietly submits, but she feels wronged whenever she allows her mind to dwell upon the situation. She either hides her hurt, and splendid reserves of enthusiasm and capacity go to waste, or her zeal and emotions are turned inward, and the result is an unhappy woman, whose heart is consumed by vain regrets and desires.
  translation_ja: 今日の女性は、社会に対する務めの重さを自覚するように教育されていたと分かる。家族は大学に送り出したときには、そのことを少しも予想しなかった。女性はそのうえ、世界の市民として役割を果たしたいという衝動も感じる。家族から受け継いだものは、誠実さと愛情をもって引き受ける。だが、もっと広い範囲で受け継いだものもある。ほかによい言い方がないので、私たちはこれを社会への務めと呼ぶ。この務めは四年間の教育のあいだ認められていたが、大学から帰ると、またしても家族への務めだけを厳しく求められる。移り変わりの途中で妥協するときにある、あらゆる居心地の悪さがそこにはある。娘にとって、社会への務めと家族への務めは、少しもそうなる必要がないのに、いつも衝突する。たいてい前者は押さえ込まれて、後者に道を譲る。家族の求めは具体的で、はっきり示されるのに、社会からの求めは漠然とし、まだ言葉にもなっていないからだ。そんなとき、娘は黙って従うが、ふと事情を考えるたび、不当に扱われたと感じる。心の痛みを隠すうちに、秘めていた見事な熱意と力は、何にも使われないまま過ぎる。あるいは熱意と感情が内にこもり、どうにもならない後悔と、かなわない願いで心がすり減る、不幸な女性になる。
  translation_status: reviewed
- id: da-03-015
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '86'
    source_sequence: 100
    printed_page_end: '87'
  source_text: If the college woman is not thus quietly reabsorbed, she is even reproached for her discontent. She is told to be devoted to her family, inspiring and responsive to her social circle, and to give the rest of her time to further self-improvement and enjoyment. She expects to do this, and responds to these claims to the best of her ability, even heroically sometimes. But where is the larger life of which she has dreamed so long? That life which surrounds and completes the individual and family life? She has been taught that it is her duty to share this life, and her highest privilege to extend it. This divergence between her self-centred existence and her best convictions becomes constantly more apparent. But the situation is not even so simple as a conflict between her affections and her intellectual convictions, although even that is tumultuous enough, also the emotional nature is divided against itself. The social claim is a demand upon the emotions as well as upon the intellect, and in ignoring it she represses not only her convictions but lowers her springs of vitality. Her life is full of contradictions. She looks out into the world, longing that some demand be made upon her powers, for they are too untrained to furnish an initiative. When her health gives way under this strain, as it often does, her physician invariably advises a rest. But to be put to bed and fed on milk is not what she requires. What she needs is simple, health-giving activity, which, involving the use of all her faculties, shall be a response to all the claims which she so keenly feels.
  translation_ja: 大学を出た女性がこうしておとなしく家族の暮らしに戻らないと、不満を抱くこと自体までも責められる。家族に尽くし、身近な付き合いでは人を励まし、その求めに応え、残りの時間を、自分をさらに磨くことや楽しみのために使えと言われる。彼女もそうするつもりで、力のかぎり、ときには英雄的といえるほど、そういう求めに応える。だが長く夢見てきた、もっと広い暮らしは、どこにあるのだろう。個人や家族の暮らしを包み込み、それを完全なものにする暮らしは、どこにあるのだろう。その暮らしに加わるのが務めであり、さらに広げるのが最も大きな特権だと、教えられた。自分を中心に回る今の毎日と、最も大切な信念との食い違いは、ますます明らかになる。しかし、たとえそれだけでも心が大きく乱れるとしても、愛情と頭で確信したことが争うだけというほど、単純ではない。感情そのものの内で、心が二つに割れているのである。社会への務めが訴えるのは頭だけでなく感情でもある。それを無視すれば、自分の信念を押さえるだけでなく、生きる力の源まで弱めてしまう。毎日は矛盾だらけだ。世の中に目を向け、誰かが自分の力を必要としてくれることを願う。何かを自分から始められるほどには、その力が鍛えられていないからだ。この重荷のため、しばしばあるように身体の具合が悪くなると、医者は決まって休養を勧める。けれど彼女に必要なのは、寝床に入れられて牛乳を飲まされることではない。本当に必要なのは、気負わずできて元気を取り戻せる仕事、自分のすべての力を使いながら、あれほど強く感じている務めのどれにも応える活動なのだ。
  translation_status: reviewed
- id: da-03-016
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '87'
    source_sequence: 101
    printed_page_end: '89'
  source_text: It is quite true that the family often resents her first attempts to be part of a life quite outside their own, because the college woman frequently makes these first attempts most awkwardly; her faculties have not been trained in the line of action. She lacks the ability to apply her knowledge and theories to life itself and to its complicated situations. This is largely the fault of her training and of the one-sidedness of educational methods. The colleges have long been full of the best ethical teaching, insisting that the good of the whole must ultimately be the measure of effort, and that the individual can only secure his own rights as he labors to secure those of others. But while the teaching has included an ever-broadening range of obligation and has insisted upon the recognition of the claims of human brotherhood, the training has been singularly individualistic; it has fostered ambitions for personal distinction, and has trained the faculties almost exclusively in the direction of intellectual accumulation. Doubtless, woman's education is at fault, in that it has failed to recognize certain needs, and has failed to cultivate and guide the larger desires of which all generous young hearts are full.
  translation_ja: 家族が、自分たちの外にある暮らしに加わろうとする娘の最初の試みを、不快に思うのは確かだ。大学を出た娘は往々にして、ごく不器用にその試みを始める。実際に行動するようには力を養われていないからだ。自分の知識や理論を暮らしそのものや、そこで出会う入り組んだ事情に当てはめることができない。これは大部分、受けてきた訓練と、教育の方法が一方に偏っていることのせいだ。大学には長いこと、最もすぐれた倫理の教えが満ちていた。努力を測る最終的な基準は全体の利益であり、他人の権利を守ろうと力を尽くすことで初めて、自分の権利も確保できると説いてきた。だが、教える内容がますます広い範囲にわたる務めを含み、人類が互いに同胞として負う務めを認めるよう求めた一方で、訓練のほうは、目立って個人に偏っていた。個人として名を上げるという野心を育て、もっぱら知識を蓄える方向に力を養ったのである。女性の教育に落ち度があるのは間違いない。ある種の求めに気づかず、人を思いやる若い心にあふれる、より広い世界へ向かう願いを培い、導くことができなかった。
  translation_status: reviewed
- id: da-03-017
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '89'
    source_sequence: 102
    printed_page_end: '90'
  source_text: During the most formative years of life, it gives the young girl no contact with the feebleness of childhood, the pathos of suffering, or the needs of old age. It gathers together crude youth in contact only with each other and with mature men and women who are there for the purpose of their mental direction. The tenderest promptings are bidden to bide their time. This could only be justifiable if a definite outlet were provided when they leave college. Doubtless the need does not differ widely in men and women, but women not absorbed in professional or business life, in the years immediately following college, are baldly brought face to face with the deficiencies of their training. Apparently every obstacle is removed, and the college woman is at last free to begin the active life, for which, during so many years, she has been preparing. But during this so-called preparation, her faculties have been trained solely for accumulation, and she has learned to utterly distrust the finer impulses of her nature, which would naturally have connected her with human interests outside of her family and her own immediate social circle. All through school and college the young soul dreamed of self-sacrifice, of succor to the helpless and of tenderness to the unfortunate. We persistently distrust these desires, and, unless they follow well-defined lines, we repress them with every device of convention and caution.
  translation_ja: 人の形づくられる最も大切な時期に、教育を受ける若い女性には、幼い子の弱さ、苦しむ人の痛ましさ、年老いた人が必要とするものに触れる機会がない。まだ何も知らない若者ばかりを集めて、互いに、または知的な指導のためにそこにいる大人としか、接しないようにする。心のいちばん優しい衝動には、時機を待てと言い聞かせる。これが正当化できるとしたら、大学を出たとき、確かにそれを向けられる先が用意されている場合だけだ。この必要は男女で大きく違わないにせよ、卒業してすぐ専門職や仕事に没頭するのでない女性には、受けてきた訓練の足りないところが、むき出しになって現れる。一見すれば邪魔するものはなく、大学を出た女性には、積極的に活動する生活をようやく始める自由がある。そのために何年も準備をしてきたのだ。ところが、このいわゆる準備のあいだ、彼女の力は知識をためるためだけに養われてきた。その本性からくる、より優れた衝動は、家族やごく身近な付き合いの外にいる人たちが関わる事柄へ、自然に彼女をつなぐはずであったのに、その衝動を徹底して信用しないことを覚えた。若い心は学校と大学を通じ、自分をささげ、頼るもののない人を助け、不幸な人に親切にすることを夢見た。私たちは、そうした願いを頑として信用しない。認められた道筋に沿わないなら、慣習や用心の名のもとに、ありとあらゆる手立てで抑えるのである。
  translation_status: reviewed
- id: da-03-018
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '90'
    source_sequence: 103
    printed_page_end: '91'
  source_text: One summer the writer went from a two weeks' residence in East London, where she had become sick and bewildered by the sights and sounds encountered there, directly to Switzerland. She found the beaten routes of travel filled with young English men and women who could walk many miles a day, and who could climb peaks so inaccessible that the feats received honorable mention in Alpine journals,—a result which filled their families with joy and pride. These young people knew to a nicety the proper diet and clothing which would best contribute toward endurance. Everything was very fine about them save their motive power. The writer does not refer to the hard-worked men and women who were taking a vacation, but to the leisured young people, to whom this period was the most serious of the year, and filled with the most strenuous exertion. They did not, of course, thoroughly enjoy it, for we are too complicated to be content with mere exercise. Civilization has bound us too closely with our brethren for any one of us to be long happy in the cultivation of mere individual force or in the accumulation of mere muscular energy.
  translation_ja: ある夏、私はロンドン東部に二週間住み、そこで見聞きするもので気分が悪くなり、途方に暮れた。その足でスイスへ行った。おなじみの観光の道は、日に何マイルも歩き、きわめて登りにくい山頂にも立てる若いイングランド人の男女でいっぱいだった。その偉業がアルプス登山の雑誌で称えられ、家族は喜びと誇りに満たされる。若者たちは、長く動ける体をつくるうえで、どんな食事や衣服がいちばん適切か、細かいところまで承知していた。彼らを動かしていた動機を除けば、何から何まで見事だった。私が言っているのは、懸命に働いて休暇を取った人たちではない。ふだん時間にゆとりがあり、この時期を一年のうちで最も真剣に、最も力を使って過ごす若い人のことだ。もちろん、心から楽しんだわけではない。私たちは体を動かすというだけで満足するほど、単純ではないのだ。文明のなかで人は互いにあまりに深く結ばれていて、自分だけの力を鍛えたり、ただ筋力を蓄えたりするだけで、いつまでも幸せでいられる者はいない。
  translation_status: reviewed
- id: da-03-019
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '91'
    source_sequence: 104
    printed_page_end: '92'
  source_text: With Whitechapel constantly in mind, it was difficult not to advise these young people to use some of this muscular energy of which they were so proud, in cleaning neglected alleys and paving soggy streets. Their stores of enthusiasm might stir to energy the listless men and women of East London and utilize latent social forces. The exercise would be quite as good, the need of endurance as great, the care for proper dress and food as important; but the motives for action would be turned from selfish ones into social ones. Such an appeal would doubtless be met with a certain response from the young people, but would never be countenanced by their families for an instant.
  translation_ja: ホワイトチャペルのことが絶えず頭にあった私は、この若者に、そんなに誇りに思う筋力を少しでも、放っておかれた路地を掃除し、ぬかるむ通りを舗装するために使うよう勧めたい気持ちを、やり過ごすのが難しかった。そのあり余る熱意なら、ロンドン東部の気力のない人々を奮い立たせ、社会にまだ潜んでいる力を生かせるかもしれない。運動としても同じくらいよく、同じだけ持久力が要り、ふさわしい服装と食事も変わらず重要だ。だが、何のためにするかという動機は、自分のためから社会のためへ変わる。そう呼びかければ、若者からはきっといくらか反応があるだろうが、その家族は、一瞬たりとも認めないだろう。
  translation_status: reviewed
- id: da-03-020
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '92'
    source_sequence: 105
    printed_page_end: '93'
  source_text: Fortunately a beginning has been made in another direction, and a few parents have already begun to consider even their little children in relation to society as well as to the family. The young mothers who attend "Child Study" classes have a larger notion of parenthood and expect given characteristics from their children, at certain ages and under certain conditions. They quite calmly watch the various attempts of a child to assert his individuality, which so often takes the form of opposition to the wishes of the family and to the rule of the household. They recognize as acting under the same law of development the little child of three who persistently runs away and pretends not to hear his mother's voice, the boy of ten who violently, although temporarily, resents control of any sort, and the grown-up son who, by an individualized and trained personality, is drawn into pursuits and interests quite alien to those of his family.
  translation_ja: 幸い、別の方向では新しい試みが始まり、自分のまだ小さな子どもでさえ、家族との関わりだけでなく社会との関わりから考える親が、いくらか現れている。「児童研究」の講座に出る若い母親は、親であることをもっと広く考え、ある年齢、ある条件のもとでは、子どもにある特徴が現れると見込んでいる。子どもが自分らしさを出そうとしていろいろなことをするのを、落ち着いて見守れる。そうした試みは、家族の望みや家庭の決まりへの反抗という形を取ることが大変多い。三歳の幼児は何度も逃げ出して母親の声が聞こえないふりをし、十歳の少年は一時的ながら、どんな指図にも強く抵抗する。成長して大人になった息子は、独自に育てた個性に導かれて、家族とはまったく違う仕事や関心に引き寄せられる。これらすべてに同じ発達の法則が働いていると、母親たちは認めるのである。
  translation_status: reviewed
- id: da-03-021
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '93'
    source_sequence: 106
    printed_page_end: '94'
  source_text: This attempt to take the parental relation somewhat away from mere personal experience, as well as the increasing tendency of parents to share their children's pursuits and interests, will doubtless finally result in a better understanding of the social obligation. The understanding, which results from identity of interests, would seem to confirm the conviction that in the complicated life of to-day there is no education so admirable as that education which comes from participation in the constant trend of events. There is no doubt that most of the misunderstandings of life are due to partial intelligence, because our experiences have been so unlike that we cannot comprehend each other. The old difficulties incident to the clash of two codes of morals must drop away, as the experiences of various members of the family become larger and more identical.
  translation_ja: 親子関係を自分の個人的な経験だけから考えるのをいくらかやめる、こうした試みと、子どもの取り組みや関心を親も共有するようになる傾向からは、やがて疑いもなく、社会への務めについての理解が深まるだろう。同じ関心を持つことで生まれる理解は、次の確信を裏づけるように思われる。込み入った今日の生活では、絶えず起こる物事の流れに自ら加わることから得る教育ほど、見事な教育はない。人生の行き違いの大半は、片方の事情しか分からないために起こることは、疑いない。あまりに違う経験をしてきたため、互いを理解できないのだ。家族一人ひとりの経験の幅が広がり、互いに共通するものが増えるにつれ、二つの道徳の規範がぶつかり合うことにつきものだった昔からの難しさは、消えずにはいない。
  translation_status: reviewed
- id: da-03-022
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '94'
    source_sequence: 107
    printed_page_end: '95'
  source_text: At the present moment, however, many of those difficulties still exist and may be seen all about us. In order to illustrate the situation baldly, and at the same time to put it dramatically, it may be well to take an instance concerning which we have no personal feeling. The tragedy of King Lear has been selected, although we have been accustomed so long to give him our sympathy as the victim of the ingratitude of his two older daughters, and of the apparent coldness of Cordelia, that we have not sufficiently considered the weakness of his fatherhood, revealed by the fact that he should get himself into so entangled and unhappy a relation to all of his children. In our pity for Lear, we fail to analyze his character. The King on his throne exhibits utter lack of self-control. The King in the storm gives way to the same emotion, in repining over the wickedness of his children, which he formerly exhibited in his indulgent treatment of them.
  translation_ja: だが今のところ、難しさの多くはまだ残っており、周囲のどこでも見られる。何が起こっているかを露わにし、同時に生々しく伝えるためには、自分自身の感情を挟まずに済む例を取るのがよいかもしれない。ここでは『リア王』の悲劇を選んだ。私たちはあまりに長いこと、上の二人の娘の恩知らずと、コーディリアの見かけの冷淡さに苦しむ犠牲者として、王に同情するのに慣れてきた。そのため、どの子ともあれほど込み入った不幸な関係に自ら陥ったという事実から見える、父親としての弱さを、十分考えなかったのだ。リアをかわいそうに思うあまり、人柄を分析しない。王座に座る王にはまるで自制心がない。嵐のなかの王が娘たちの非道を嘆いて身を任せるのは、かつて娘たちを甘やかしていたときに見せたのと、同じ感情だ。
  translation_status: reviewed
- id: da-03-023
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '95'
    source_sequence: 108
    printed_page_end: '97'
  source_text: It might be illuminating to discover wherein he had failed, and why his old age found him roofless in spite of the fact that he strenuously urged the family claim with his whole conscience. At the opening of the drama he sat upon his throne, ready for the enjoyment which an indulgent parent expects when he has given gifts to his children. From the two elder, the responses for the division of his lands were graceful and fitting, but he longed to hear what Cordelia, his youngest and best beloved child, would say. He looked toward her expectantly, but instead of delight and gratitude there was the first dawn of character. Cordelia made the awkward attempt of an untrained soul to be honest and scrupulously to express her inmost feeling. The king was baffled and distressed by this attempt at self-expression. It was new to him that his daughter should be moved by a principle obtained outside himself, which even his imagination could not follow; that she had caught the notion of an existence in which her relation as a daughter played but a part. She was transformed by a dignity which recast her speech and made it self-contained. She found herself in the sweep of a feeling so large that the immediate loss of a kingdom seemed of little consequence to her. Even an act which might be construed as disrespect to her father was justified in her eyes, because she was vainly striving to fill out this larger conception of duty. The test which comes sooner or later to many parents had come to Lear, to maintain the tenderness of the relation between father and child, after that relation had become one between adults, to be content with the responses made by the adult child to the family claim, while at the same time she responded to the claims of the rest of life. The mind of Lear was not big enough for this test; he failed to see anything but the personal slight involved, and the ingratitude alone reached him. It was impossible for him to calmly watch his child developing beyond the stretch of his own mind and sympathy.
  translation_ja: 父親としてどこでつまずき、良心のかぎりを尽くして家族への務めを説いたのに、なぜ老いて家もない身になったのかを知れば、物事がよく見えてくるかもしれない。劇の幕が開くと、王は王座に座り、子どもに贈り物をしたとき、子どもを甘やかす親が期待する喜びを、いまにも味わうつもりでいる。土地を分けてもらうことに対し、上の二人は品よく、場にふさわしい答え方をする。だが王が聞きたくてたまらないのは、末っ子で誰よりかわいがってきたコーディリアが何と言うかである。期待して娘を見やるが、うれしさと感謝の代わりに現れたのは、自分の人格が芽生えかけるところだった。コーディリアはまだ何と言ってよいかも分からないまま、誠実であろうとし、心の奥にある感情を偽りなく表そうとした。王は、自分の気持ちを表したいというこの試みに、当惑して心を乱す。娘が父である自分の外で得た原則に動かされ、王の想像力でさえその原則についていけない。自分が娘であるという関係が、人生のほんの一部にすぎないという考えを、娘がつかんでいる。どちらも王には初めてのことだった。気品ある心が彼女を変え、その言葉を、何も言い足す必要のないものにした。あまりに大きな感情に包まれ、その場で王国を失っても、彼女には大したこととは思えなかった。父への不敬と見られかねない行いでさえ、もっと広い務めを果たそうと懸命に、しかし思うようにはいかずもがいていた彼女の目には、正当だった。遅かれ早かれ多くの親が向き合う試練が、リアに訪れたのである。父と子の間柄が、大人同士の間柄になっても、その優しさを保つこと。大人になった子が家族としての務めに、そして同時に、人生のほかの求めにも応えるとき、家族に対してしてくれることで満足することだ。リアの心はその試練を引き受けられるほど広くなかった。自分が侮辱されたということしか見えず、恩知らずだという思いしか届かなかった。自分の理解と共感が及ぶところを越えて子どもが育っていくのを、落ち着いて見守ることはできなかったのである。
  translation_status: reviewed
- id: da-03-024
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '97'
    source_sequence: 109
    printed_page_end: '98'
  source_text: That a man should be so absorbed in his own indignation as to fail to apprehend his child's thought, that he should lose his affection in his anger, simply reveals the fact that his own emotions are dearer to him than his sense of paternal obligation. Lear apparently also ignored the common ancestry of Cordelia and himself, and forgot her royal inheritance of magnanimity. He had thought of himself so long as a noble and indulgent father that he had lost the faculty by which he might perceive himself in the wrong. Even in the midst of the storm he declared himself more sinned against than sinning. He could believe any amount of kindness and goodness of himself, but could imagine no fidelity on the part of Cordelia unless she gave him the sign he demanded.
  translation_ja: 怒りにとらわれ、自分の子が何を考えているかも分からなくなり、腹を立てて愛情をなくす。ただそれだけで、父親としての務めをどう感じるかより、自分の感情のほうが大切だということが、分かってしまう。リアはまた、コーディリアと自分が同じ血筋に連なることを顧みず、王家の血とともに、娘が度量の大きさを受け継いでいることを忘れていたようだ。気高く、子どもにいつも寛大な父親だと自分で思い続けてきたので、自分に非があると見抜く力を失っていた。嵐の真っただ中にあっても、自分が人にした罪より、人が自分にした罪のほうが重いと言った。自分自身のことなら、いくらでも親切で善良だと信じられたが、コーディリアについては、自分の求めたしるしを見せてもらわないかぎり、娘に誠実さがあるとは思い描けなかった。
  translation_status: reviewed
- id: da-03-025
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '98'
    source_sequence: 110
  source_text: At length he suffered many hardships; his spirit was buffeted and broken; he lost his reason as well as his kingdom; but for the first time his experience was identical with the experience of the men around him, and he came to a larger conception of life. He put himself in the place of "the poor naked wretches," and unexpectedly found healing and comfort. He took poor Tim in his arms from a sheer desire for human contact and animal warmth, a primitive and genuine need, through which he suddenly had a view of the world which he had never had from his throne, and from this moment his heart began to turn toward Cordelia.
  translation_ja: やがて、王は多くの苦しみを受けた。何度も打ちのめされて気持ちが折れ、王国とともに正気も失った。だが初めて、周囲の人々と同じ経験をし、それまでより広く人生を考えるようになった。「身を覆うものさえない、哀れな者たち」の身になって考え、思いがけず癒やしと慰めを得た。哀れなティムを腕に抱いたのは、ただ人の肌に触れたくて、生きた体のぬくもりを求めたからだ。素朴で偽りのない求めだった。それを通じて、王座からは一度も見えなかった世界が、突然見えるようになる。そこから王の心は、コーディリアに向かい始めた。
  translation_status: reviewed
- id: da-03-026
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '98'
    source_sequence: 111
    printed_page_end: '100'
  source_text: In reading the tragedy of King Lear, Cordelia receives a full share of our censure. Her first words are cold, and we are shocked by her lack of tenderness. Why should she ignore her father's need for indulgence, and be unwilling to give him what he so obviously craved? We see in the old king "the over-mastering desire of being beloved, selfish, and yet characteristic of the selfishness of a loving and kindly nature alone." His eagerness produces in us a strange pity for him, and we are impatient that his youngest and best-beloved child cannot feel this, even in the midst of her search for truth and her newly acquired sense of a higher duty. It seems to us a narrow conception that would break thus abruptly with the past and would assume that her father had no part in the new life. We want to remind her "that pity, memory, and faithfulness are natural ties," and surely as much to be prized as is the development of her own soul. We do not admire the Cordelia who through her self-absorption deserts her father, as we later admire the same woman who comes back from France that she may include her father in her happiness and freer life. The first had selfishly taken her salvation for herself alone, and it was not until her conscience had developed in her new life that she was driven back to her father, where she perished, drawn into the cruelty and wrath which had now become objective and tragic.
  translation_ja: 『リア王』の悲劇を読むとき、コーディリアにもまた、私たちは十分な非難を向ける。最初の言葉は冷たく、優しさのないことに驚く。少し甘やかしてほしいという父親の気持ちを、なぜ無視するのか。父がこれほどはっきり求めているものを、なぜ与えようとしないのか。老王には「愛されたいという抑えがたい願いがある。身勝手ではあるが、愛情があり気立てのよい性質の持ち主だけに見られる種類の身勝手さだ」。その切望は、私たちに不思議な憐れみを抱かせる。末っ子でいちばんかわいがった娘が、真実を探し、新たに知った高い務めに気を取られているとしても、この気持ちを感じとれないのに、私たちはじれったくなる。過去とこれほど突然に縁を切り、新しい暮らしに父親は関係ないと思い込むのは、狭い考え方に見える。「憐れみ、思い出、誠実さは自然に生まれる絆だ」と、彼女に思い出させたい。それらもまた、自分の心を成長させるのと同じだけ、確かに大切ではないか。自分のことにかかりきりで父を捨てるコーディリアを、あとになって、父にも自分の幸福と、より自由な暮らしを分かち合ってもらうためフランスから戻る、同じ女性に感心するほどには、尊敬できない。最初の彼女は、自分が救われることを、身勝手にも自分ひとりのためによしとした。新しい暮らしのなかで良心が成長して初めて、父のもとに戻らずにはいられなくなった。そこで、もう心の内のものではなく、現実の悲劇となった残酷さと怒りに巻き込まれ、命を落とした。
  translation_status: reviewed
- id: da-03-027
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '100'
    source_sequence: 112
  source_text: Historically considered, the relation of Lear to his children was archaic and barbaric, indicating merely the beginning of a family life since developed. His paternal expression was one of domination and indulgence, without the perception of the needs of his children, without any anticipation of their entrance into a wider life, or any belief that they could have a worthy life apart from him. If that rudimentary conception of family life ended in such violent disaster, the fact that we have learned to be more decorous in our conduct does not demonstrate that by following the same line of theory we may not reach a like misery.
  translation_ja: 歴史の目で見ると、リアと子どもの関係は古めかしく野蛮であり、その後発達した家族生活の始まりを示すだけだ。父として表したのは、支配と甘やかしだった。子どもが何を必要とするかは見えず、やがて彼女たちがもっと広い人生に踏み出すとも考えず、自分を離れても価値ある人生を送れるとは信じなかった。家族生活についてのそんな初歩的な考えがあれほど激しい災いに終わった以上、私たちがもっと行儀よく振る舞うことを覚えたからといって、同じ考えに従って同じ苦しみに至らないとは、証明できない。
  translation_status: reviewed
- id: da-03-028
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '100'
    source_sequence: 113
    printed_page_end: '101'
  source_text: Wounded affection there is sure to be, but this could be reduced to a modicum if we could preserve a sense of the relation of the individual to the family, and of the latter to society, and if we had been given a code of ethics dealing with these larger relationships, instead of a code designed to apply so exclusively to relationships obtaining only between individuals.
  translation_ja: 愛情が傷つくことは、きっとある。だが、個人と家族の関係、家族と社会の関係への感覚を保つことができれば、傷をほんのわずかに抑えられるだろう。また、個人と個人のあいだにだけ成り立つ関係に、これほどひたすら当てはめようとして作った規範の代わりに、もっと広い関係を扱う倫理の規範が与えられていたなら、そうできただろう。
  translation_status: reviewed
- id: da-03-029
  section_id: ch-03
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '101'
    source_sequence: 114
  source_text: Doubtless the clashes and jars which we all feel most keenly are those which occur when two standards of morals, both honestly held and believed in, are brought sharply together. The awkwardness and constraint we experience when two standards of conventions and manners clash but feebly prefigure this deeper difference.
  translation_ja: 私たちみんながいちばん強く感じる衝突や摩擦は、疑いもなく、双方が誠実に抱き信じる二つの道徳の基準が、正面からぶつかるときに起きる。しきたりや作法の二つの基準が衝突して覚える気まずさや窮屈さは、もっと深いこの違いを、ほんのかすかに予告するだけである。
  translation_status: reviewed
- id: da-04-000
  section_id: ch-04
  kind: heading
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '102'
    source_sequence: 115
    url: https://www.gutenberg.org/files/15487/15487-h/15487-h.htm#page_102
    anchor: page_102
  source_text: CHAPTER IV. HOUSEHOLD ADJUSTMENT
  translation_ja: 第四章　家庭内の関係調整
  translation_status: reviewed
- id: da-04-001
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '102'
    source_sequence: 116
  source_text: If we could only be judged or judge other people by purity of motive, life would be much simplified, but that would be to abandon the contention made in the first chapter, that the processes of life are as important as its aims. We can all recall acquaintances of whose integrity of purpose we can have no doubt, but who cause much confusion as they proceed to the accomplishment of that purpose, who indeed are often insensible to their own mistakes and harsh in their judgments of other people because they are so confident of their own inner integrity.
  translation_ja: 自分が人からどう見られるかも、他人をどう見るかも、動機の純粋さだけで決めてよいなら、人生はずっと単純になるだろう。だがそうすれば、生きる過程は目的と同じくらい大切だという、第一章の主張を捨てることになる。目的の誠実さは疑いようもないのに、目的を実現するために動き出すと、ひどく混乱を引き起こす知り合いを、誰もが思い出せる。心の内には一点の曇りもないと信じるあまり、自分の間違いには気づかず、他人を厳しく裁くことが多い人たちだ。
  translation_status: reviewed
- id: da-04-002
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '102'
    source_sequence: 117
    printed_page_end: '103'
  source_text: This tendency to be so sure of integrity of purpose as to be unsympathetic and hardened to the means by which it is accomplished, is perhaps nowhere so obvious as in the household itself. It nowhere operates as so constant a force as in the minds of the women who in all the perplexity of industrial transition are striving to administer domestic affairs. The ethics held by them are for the most part the individual and family codes, untouched by the larger social conceptions.
  translation_ja: 目的は誠実だという自信が強すぎるために、それを果たす手段については、他人の立場を思いやれず、頑なになる。おそらく家庭ほど、この傾向がはっきり現れるところはない。産業の変化に戸惑いながら、家のことをどうにか切り盛りしている女性の心においてほど、この傾向が絶えず働くところはないのである。女性たちが守るのは大方、個人や家族の道徳であり、より広い社会のことを考える道徳の影響は受けていない。
  translation_status: reviewed
- id: da-04-003
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '103'
    source_sequence: 118
  source_text: These women, rightly confident of their household and family integrity and holding to their own code of morals, fail to see the household in its social aspect. Possibly no relation has been so slow to respond to the social ethics which we are now considering, as that between the household employer and the household employee, or, as it is still sometimes called, that between mistress and servant.
  translation_ja: この女性たちが自分の家庭と家族の誠実さに自信を持ち、自分なりの道徳を守るのはもっともである。だが家庭を社会との関係でとらえることはできていない。私たちがいま考えている社会倫理の影響が、これほど遅くまで及ばなかった関係は、おそらくない。家庭で人を雇う者と雇われる者、いまもときに「奥さまと召使い」と呼ばれる間柄である。
  translation_status: reviewed
- id: da-04-004
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '103'
    source_sequence: 119
    printed_page_end: '104'
  source_text: This persistence of the individual code in relation to the household may be partly accounted for by the fact that orderly life and, in a sense, civilization itself, grew from the concentration of interest in one place, and that moral feeling first became centred in a limited number of persons. From the familiar proposition that the home began because the mother was obliged to stay in one spot in order to cherish the child, we can see a foundation for the belief that if women are much away from home, the home itself will be destroyed and all ethical progress endangered.
  translation_ja: 家庭に対して個人の規範がいつまでも通用するのは、一つの場所に人の関心が集まって、秩序立った生活が、ある意味では文明そのものが育ったためでもあろう。そして道徳的な感情も、初めは限られた人々に向けられたのである。母が子を慈しむため一か所にとどまらざるをえず、そこから家庭が始まった、というおなじみの考えがある。女性が家を空けることが多ければ家庭が壊れ、道徳上のあらゆる前進が危うくなる、という信念は、ここに根を持つと考えられる。
  translation_status: reviewed
- id: da-04-005
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '104'
    source_sequence: 120
    printed_page_end: '105'
  source_text: We have further been told that the earliest dances and social gatherings were most questionable in their purposes, and that it was, therefore, the good and virtuous women who first stayed at home, until gradually the two—the woman who stayed at home and the woman who guarded her virtue—became synonymous. A code of ethics was thus developed in regard to woman's conduct, and her duties were logically and carefully limited to her own family circle. When it became impossible to adequately minister to the needs of this circle without the help of many people who did not strictly belong to the family, although they were part of the household, they were added as aids merely for supplying these needs. When women were the brewers and bakers, the fullers, dyers, spinners, and weavers, the soap and candle makers, they administered large industries, but solely from the family point of view. Only a few hundred years ago, woman had complete control of the manufacturing of many commodities which now figure so largely in commerce, and it is evident that she let the manufacturing of these commodities go into the hands of men, as soon as organization and a larger conception of their production were required. She felt no responsibility for their management when they were taken from the home to the factory, for deeper than her instinct to manufacture food and clothing for her family was her instinct to stay with them, and by isolation and care to guard them from evil.
  translation_ja: さらに、最初のころの踊りや人の集まりは、その目的が大いに疑わしかったので、最初に家にとどまったのは善良で貞淑な女性だった、と聞かされてきた。ついには、家にいる女と貞淑さを守る女は、同じ意味になった。こうして女性の振る舞いについての倫理ができ、女性の務めは、筋道を立てて慎重に、自分の家族の輪のなかだけに限られた。その家族が必要とするものを十分に用意するには、同じ家に住むが厳密には家族ではない人々を多く頼らざるをえなくなる。すると、そういう人々は、ただ家族が必要とするものを供給する手として加えられた。女性が酒を醸し、パンを焼き、布を縮絨し、染め、糸を紡ぎ、布を織り、石けんやろうそくを作っていたころには、大きな産業の数々を切り盛りしていたが、それも家族の立場から見たことだった。今日では商取引の大きな部分を占めるさまざまな品物も、わずか何百年か前までは、製造を女性がすべて取り仕切っていた。そして、組織立てて、より大きな見通しを持って生産する必要が出てくるや、そうした品物の製造を男性の手に渡したことは明らかだ。生産が家から工場に移ると、そこでの管理に責任は感じなかった。家族の食べ物や着るものを作ろうとする本能よりも、家族のそばにいて、外から隔て、世話をして悪いものから守ろうとする本能のほうが深かったからだ。
  translation_status: reviewed
- id: da-04-006
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '105'
    source_sequence: 121
    printed_page_end: '106'
  source_text: She had become convinced that a woman's duty extended only to her own family, and that the world outside had no claim upon her. The British matron ordered her maidens aright, when they were spinning under her own roof, but she felt no compunction of conscience when the morals and health of young girls were endangered in the overcrowded and insanitary factories. The code of family ethics was established in her mind so firmly that it excluded any notion of social effort.
  translation_ja: 女の務めは自分の家族にしか及ばず、外の世間が自分に求めてよいものはないと、女性は確信するようになっていた。イギリスの主婦は、自分の家で働く娘たちが糸を紡いでいるあいだは、その生活をきちんと律した。だが過密で不衛生な工場で若い娘たちの道徳や健康が危うくなっても、良心が痛むことはなかった。家族の倫理があまりに強く心に根づいていたため、社会のために何かするという考えは、入る余地がなかったのだ。
  translation_status: reviewed
- id: da-04-007
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '106'
    source_sequence: 122
    printed_page_end: '107'
  source_text: It is quite possible to accept this explanation of the origin of morals, and to believe that the preservation of the home is at the foundation of all that is best in civilization, without at the same time insisting that the separate preparation and serving of food is an inherent part of the structure and sanctity of the home, or that those who minister to one household shall minister to that exclusively. But to make this distinction seems difficult, and almost invariably the sense of obligation to the family becomes confused with a certain sort of domestic management. The moral issue involved in one has become inextricably combined with the industrial difficulty involved in the other, and it is at this point that so many perplexed housekeepers, through the confusion of the two problems, take a difficult and untenable position.
  translation_ja: 道徳がこうして始まったという説明を受け入れ、家庭を守ることは文明の最もよいものすべての土台だと信じても、食事は家ごとに用意して出すことが、家庭を成り立たせ、その神聖さを保つのに欠かせないとまで主張する必要はない。ひとつの家の世話をする者は、その家だけの世話をしなくてはならない、とする必要もない。だがこの区別をつけるのは難しいようで、家族への務めを感じることは、ほとんど必ず、特定の家事の切り盛りと混同される。片方の道徳上の問題と、もう片方の仕事を組み立てるうえでの難しさとは、切り離せないほど絡まり合ってしまった。二つの問題を混同して、多くの戸惑った主婦が難しく、筋の通らない立場を取るのは、まさにこの点である。
  translation_status: reviewed
- id: da-04-008
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '107'
    source_sequence: 123
    printed_page_end: '108'
  source_text: There are economic as well as ethical reasons for this survival of a simpler code. The wife of a workingman still has a distinct economic value to her husband. She cooks, cleans, washes, and mends—services for which, before his marriage, he paid ready money. The wife of the successful business or professional man does not do this. He continues to pay for his cooking, house service, and washing. The mending, however, is still largely performed by his wife; indeed, the stockings are pathetically retained and their darning given an exaggerated importance, as if women instinctively felt that these mended stockings were the last remnant of the entire household industry, of which they were formerly mistresses. But one industry, the cooking and serving of foods to her own family, woman has never relinquished. It has, therefore, never been organized, either by men or women, and is in an undeveloped state. Each employer of household labor views it solely from the family standpoint. The ethics prevailing in regard to it are distinctly personal and unsocial, and result in the unique isolation of the household employee.
  translation_ja: より素朴な規範が生き残ったことには、倫理だけでなく経済の理由もある。労働者の妻は、夫にとって今もはっきりした経済的価値を持つ。食事を作り、掃除し、洗濯し、つくろい物をする。どれも結婚するまでは夫が現金で代金を払って頼んでいた仕事だ。成功した商人や専門職の妻は、こうしたことをしない。夫は以前と変わらず、料理、家の世話、洗濯に金を払う。とはいえ、つくろいは、いまも大方が妻のする仕事である。ことに靴下は、いじらしいほど手放されず、穴をかがることが不相応なほど大切にされる。まるで、つくろった靴下が、昔、自分たちが取り仕切っていた家内の産業全体の、最後の名残だと、女性が本能で感じているかのようだ。だが女性が一度も手放さなかった仕事がある。自分の家族の食事を作って出すことである。そのため、男にも女にも組織化されたことがなく、発達しないままだ。家事労働をする人を雇う者は、一人ひとり、自分の家族の側からしかそれを見ない。そこを支配する倫理は明らかに個人的で、社会を考えに入れておらず、雇われて家事をする者が、ほかにはないほど孤立することになる。
  translation_status: reviewed
- id: da-04-009
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '108'
    source_sequence: 124
  source_text: As industrial conditions have changed, the household has simplified, from the mediæval affair of journeymen, apprentices, and maidens who spun and brewed to the family proper; to those who love each other and live together in ties of affection and consanguinity. Were this process complete, we should have no problem of household employment. But, even in households comparatively humble, there is still one alien, one who is neither loved nor loving.
  translation_ja: 働き方の条件が変わるにつれ、家に属する人の範囲は狭くなった。職人や徒弟、糸を紡ぎ酒を醸す娘たちまで含んだ中世の家から、互いに愛し、情愛や血のつながりのもとで暮らす、家族そのものへと絞られた。この変化が完了していれば、家庭で人を雇う問題はないはずだ。しかし比較的つつましい家庭でさえ、まだ一人よそ者がいる。愛されもせず、愛するわけでもない者である。
  translation_status: reviewed
- id: da-04-010
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '108'
    source_sequence: 125
    printed_page_end: '109'
  source_text: The modern family has dropped the man who made its shoes, the woman who spun its clothes, and, to a large extent, the woman who washes them, but it stoutly refuses to drop the woman who cooks its food and ministers directly to its individual comfort; it strangely insists that to do that would be to destroy the family life itself. The cook is uncomfortable, the family is uncomfortable; but it will not drop her as all her fellow-workers have been dropped, although the cook herself insists upon it. So far has this insistence gone that every possible concession is made to retain her. The writer knows an employer in one of the suburbs who built a bay at the back of her house so that her cook might have a pleasant room in which to sleep, and another in which to receive her friends. This employer naturally felt aggrieved when the cook refused to stay in her bay. Viewed in an historic light, this employer might quite as well have added a bay to her house for her shoemaker, and then deemed him ungrateful because he declined to live in it.
  translation_ja: 現代の家族は、自分たちの靴を作った男も、着るものの糸を紡いだ女も、それを洗濯する女も大方手放した。だが、食事を作り、家族一人ひとりが快適に暮らせるようじかに世話する女を手放すことは、あくまで拒む。そんなことをすれば家族生活そのものが壊れると、奇妙にも言い張る。料理人は居心地が悪く、家族も居心地が悪い。料理人自身が手放してくれと言い張るのに、同じく家で働いたほかの人々を手放したようには、手放そうとしない。これほどかたくななので、引き留めるために、できるかぎり譲歩する。私の知る郊外のある雇い主は、料理人に気持ちよく眠れる部屋と、友人を迎える部屋を一つずつ与えようとして、家の裏に張り出しを建て増した。料理人がその張り出しに住もうとしないと、雇い主が不当だと感じたのも無理はない。だが歴史に照らせば、この雇い主は靴屋のために家を建て増しして、そこに住むのを断られて恩知らずだと思っても、同じことなのだ。
  translation_status: reviewed
- id: da-04-011
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '109'
    source_sequence: 126
    printed_page_end: '110'
  source_text: A listener, attentive to a conversation between two employers of household labor,—and we certainly all have opportunity to hear such conversations,—would often discover a tone implying that the employer was abused and put upon; that she was struggling with the problem solely because she was thus serving her family and performing her social duties; that otherwise it would be a great relief to her to abandon the entire situation, and "never have a servant in her house again." Did she follow this impulse, she would simply yield to the trend of her times and accept the present system of production. She would be in line with the industrial organization of her age. Were she in line ethically, she would have to believe that the sacredness and beauty of family life do not consist in the processes of the separate preparation of food, but in sharing the corporate life of the community, and in making the family the unit of that life.
  translation_ja: 家庭で人を雇う二人の話を注意深く聞く機会は、確かに誰にでもあるが、多くの場合、その口調には、雇い主がひどい仕打ちを受け、負担を押しつけられているという含みがある。問題と取り組むのは、ひとえに家族に尽くし、社会の務めを果たすためだ、そうでなければ、面倒なことはすべて投げ出し、「二度と家に召使いなど置かない」ほうが、ずっと気が楽になる、というのである。その思いに従えば、時代の流れに身を任せ、今日の生産の仕組みを受け入れるだけだ。自分の時代の仕事の組み立て方に即したことになる。倫理のうえでも時代に即するなら、家族生活の神聖さや美しさは、家ごとに別々に食事を用意することにあるのではないと考えなくてはならない。共同体の暮らしを分かち合い、家族をその暮らしの一単位にすることにあるのだ。
  translation_status: reviewed
- id: da-04-012
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '110'
    source_sequence: 127
  source_text: The selfishness of a modern mistress, who, in her narrow social ethics, insists that those who minister to the comforts of her family shall minister to it alone, that they shall not only be celibate, but shall be cut off, more or less, from their natural social ties, excludes the best working-people from her service.
  translation_ja: 今日の女主人は、社会についての倫理が狭いため、自分の家族が快適に暮らせるよう世話をする人には、その家族だけに仕えるよう言い張る。独身であるばかりか、その人が自然に持つ人付き合いからも、いくらか切り離されなければならないという。この身勝手さのため、いちばんよい働き手は、彼女のもとに来ない。
  translation_status: reviewed
- id: da-04-013
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '111'
    source_sequence: 128
  source_text: A man of dignity and ability is quite willing to come into a house to tune a piano. Another man of mechanical skill will come to put up window shades. Another of less skill, but of perfect independence, will come to clean and relay a carpet. These men would all resent the situation and consider it quite impossible if it implied the giving up of their family and social ties, and living under the roof of the household requiring their services.
  translation_ja: 品位も能力もある人は、ピアノを調律するためなら、進んでよその家に入る。手先の器用な別の人は日よけを取り付けに来る。技術はそれほどでもなく、自分の暮らしは自分で立てるまた別の人は、じゅうたんを掃除し、敷き直しに来る。しかし、そうするために家族や人付き合いを手放し、仕事を求めた家の屋根の下で暮らさなくてはならないとしたら、誰もが腹を立て、とうていできないと思うだろう。
  translation_status: reviewed
- id: da-04-014
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '111'
    source_sequence: 129
  source_text: The isolation of the household employee is perhaps inevitable so long as the employer holds her belated ethics; but the situation is made even more difficult by the character and capacity of the girls who enter this industry. In any great industrial change the workmen who are permanently displaced are those who are too dull to seize upon changed conditions. The workmen who have knowledge and insight, who are in touch with their time, quickly reorganize.
  translation_ja: 雇い主が時代遅れの倫理を守っているかぎり、雇われて家事をする者が孤立するのは、どうにもならないかもしれない。しかも、この仕事に入る女性たちの性質と能力が、事情をさらに難しくする。働き方が大きく変わるときに、いつまでも仕事から締め出されるのは、変わった条件をとらえられないほど鈍い労働者である。知識と見識を持ち、時代に通じた労働者なら、すぐに働き方を組み直す。
  translation_status: reviewed
- id: da-04-015
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '111'
    source_sequence: 130
    printed_page_end: '112'
  source_text: The general statement may be made that the enterprising girls of the community go into factories, and the less enterprising go into households, although there are many exceptions. It is not a question of skill, of energy, of conscientious work, which will make a girl rise industrially while she is in the household; she is not in the rising movement. She is belated in a class composed of the unprogressive elements of the community, which is recruited constantly by those from the ranks of the incompetent, by girls who are learning the language, girls who are timid and slow, or girls who look at life solely from the savings-bank point of view. The distracted housekeeper struggles with these unprogressive girls, holding to them not even the well-defined and independent relation of employer and employed, but the hazy and constantly changing one of mistress to servant.
  translation_ja: 例外は多いが、一般には、進取の気性に富む女性は工場へ行き、そうでない女性は家庭に入ると言える。技術があり、活力があり、良心的に勤めても、家庭で働くかぎり、職業上上がっていけるわけではない。伸びていく分野にいないからだ。時代から取り残されたその階層は、共同体のうち前へ進もうとしない人からなり、仕事に不向きな人や、その土地の言葉を習っている途中の女性、臆病で動きの遅い女性、貯蓄銀行の残高だけで人生を見る女性が、絶えず加わってくる。当惑した主婦たちは、こうした前に進まない女性たちと格闘する。それも、雇う者と雇われる者という、はっきりして互いに独立した関係ではなく、曖昧で絶えず変わる、女主人と召使いという間柄のまま、である。
  translation_status: reviewed
- id: da-04-016
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '112'
    source_sequence: 131
    printed_page_end: '113'
  source_text: The latter relation is changing under pressure from various directions. In our increasing democracy the notion of personal service is constantly becoming more distasteful, conflicting, as it does, with the more modern notion of personal dignity. Personal ministration to the needs of childhood, illness, and old age seem to us reasonable, and the democratic adjustment in regard to them is being made. The first two are constantly raised nearer to the level of a profession, and there is little doubt that the third will soon follow. But personal ministrations to a normal, healthy adult, consuming the time and energy of another adult, we find more difficult to reconcile to our theories of democracy.
  translation_ja: その後者の関係は、各方面からの圧力を受けて変わりつつある。民主主義が広がる私たちの社会では、ある人に身の回りの世話をさせるという考えは、個人の尊厳をめぐるより新しい考えと対立し、ますます受け入れにくくなっている。幼年期、病気、老年期に、人が直接世話をするのは当然に思われ、その世話を民主的なあり方へと変える取り組みも進んでいる。初めの二つは次第に専門職の水準に近づき、三つ目もほどなく続くことは、ほぼ間違いない。だが、健康で日常生活に不自由のない大人の身の回りの世話に、もう一人の大人の時間と力を使うことは、民主主義の考えと、なかなか折り合わせにくい。
  translation_status: reviewed
- id: da-04-017
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '113'
    source_sequence: 132
  source_text: A factory employer parts with his men at the factory gates at the end of a day's work; they go to their homes as he goes to his, in the assumption that they both do what they want and spend their money as they please; but this solace of equality outside of working hours is denied the bewildered employer of household labor.
  translation_ja: 工場主は、一日の仕事が終わると工場の門で労働者と別れる。どちらも自分の家に帰り、したいことをし、好きなように金を使うのが当たり前となっている。だが働く時間の外では対等だという、この安らぎを、家庭で人を雇って途方に暮れる者は、得られない。
  translation_status: reviewed
- id: da-04-018
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '113'
    source_sequence: 133
  source_text: She is obliged to live constantly in the same house with her employee, and because of certain equalities in food and shelter she is brought more sharply face to face with the mental and social inequalities.
  translation_ja: 雇い主は雇った人といつも同じ家に住まざるをえない。食べ物や住まいではある程度同じ条件にいるために、心のあり方や社会での立場が対等でないことを、いっそうまざまざと突きつけられる。
  translation_status: reviewed
- id: da-04-019
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '114'
    source_sequence: 134
  source_text: The difficulty becomes more apparent as the character of the work performed by the so-called servant is less absolutely useful and may be merely time consuming. A kind-hearted woman who will complacently take an afternoon drive, leaving her cook to prepare the five courses of a "little dinner for only ten guests," will not be nearly so comfortable the next evening when she speeds her daughter to a dance, conscious that her waitress must spend the evening in dull solitude on the chance that a caller or two may ring the door-bell.
  translation_ja: いわゆる召使いがすることの実際にはあまり役に立たず、ただ時間を取るだけかもしれない場合には、この難しさは一段とよく見える。心優しい女主人は、「たった十人のささやかな夕食」の五皿を料理人に任せて、安心して午後の馬車の散歩に出られる。だが次の日の夜、娘を踊りに送り出しながら、訪ねてくる人が一人か二人、呼び鈴を鳴らすかもしれないというだけで、給仕の女性は夜を退屈な一人きりの時間として過ごさなければならないと考えると、同じほどには気が楽でない。
  translation_status: reviewed
- id: da-04-020
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '114'
    source_sequence: 135
  source_text: 'A conscientious employer once remarked to the writer: "In England it must be much easier; the maid does not look and dress so like your daughter, and you can at least pretend that she doesn''t like the same things. But really, my new waitress is quite as pretty and stylish as my daughter is, and her wistful look sometimes when Mary goes off to a frolic quite breaks my heart."'
  translation_ja: 良心的な雇い主が、あるとき私にこう言った。「イングランドなら、ずっと楽でしょうね。お手伝いは、自分の娘とそれほど似た格好や見かけじゃないから、同じものが好きじゃないと、少なくとも思い込むことはできるでしょう。でもね、新しい給仕の子は、うちの娘に少しも負けないほどきれいで、おしゃれなんです。メアリーが楽しみに出かけるのを見て、あの子がうらやましそうな目をすると、胸が張り裂けそうになります。」
  translation_status: reviewed
- id: da-04-021
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '114'
    source_sequence: 136
    printed_page_end: '116'
  source_text: Too many employers of domestic service have always been exempt from manual labor, and therefore constantly impose exacting duties upon employees, the nature of which they do not understand by experience; there is thus no curb of rationality imposed upon the employer's requirements and demands. She is totally unlike the foreman in a shop, who has only risen to his position by way of having actually performed with his own hands all the work of the men he directs. There is also another class of employers of domestic labor, who grow capricious and over-exacting through sheer lack of larger interests to occupy their minds; it is equally bad for them and the employee that the duties of the latter are not clearly defined. Tolstoy contends that an exaggerated notion of cleanliness has developed among such employers, which could never have been evolved among usefully employed people. He points to the fact that a serving man, in order that his hands may be immaculately clean, is kept from performing the heavier work of the household, and then is supplied with a tray, upon which to place a card, in order that even his clean hands may not touch it; later, even his clean hands are covered with a pair of clean white gloves, which hold the tray upon which the card is placed.
  translation_ja: 家庭で人を雇う人のなかには、いつも自分の手を動かして働かずに済んできた人が、あまりに多い。だから、自ら経験したことがなく、どんな仕事かも分からないのに、雇った人に、きつい仕事を次々と押しつける。雇い主の求めや命令を、理にかなう範囲にとどめる歯止めがない。工場の職長は、指図する部下の仕事をすべて自分の手でやったことで、その地位に上がった。その職長とは正反対である。また家庭で人を雇う別の種類の人たちは、心を向けるもっと広い関心がないばかりに、気まぐれで、無理を言いすぎるようになる。雇われた人の務めがはっきり決められていないことは、どちらにとっても同じように悪い。トルストイによると、このような雇い主のあいだでは、清潔さへのこだわりが、役に立つ仕事をする人々には考えつきもしないほど、度を越していった。従僕が両手を汚れ一つないように保てるよう、家の重い仕事をさせず、次に、きれいな手でさえ来客の名刺に触れないよう、名刺を載せる盆を与える。さらにそのきれいな手を白く清潔な手袋で覆って、名刺を載せた盆を持たせる、とトルストイは指摘する。
  translation_status: reviewed
- id: da-04-022
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '116'
    source_sequence: 137
  source_text: If it were not for the undemocratic ethics used by the employers of domestics, much work now performed in the household would be done outside, as is true of many products formerly manufactured in the feudal household. The worker in all other trades has complete control of his own time after the performance of definitely limited services, his wages are paid altogether in money which he may spend in the maintenance of a separate home life, and he has full opportunity to organize with the other workers in his trade.
  translation_ja: 家事をする人を雇う側が、民主的でない倫理を当てはめなければ、今は家のなかでする仕事の多くは、外でするようになるだろう。かつて封建時代の家で作られた多くの品物が、実際そうなったように。他の仕事ならすべて、どこまでするかはっきり決まった労働を果たしたあとは、働く者が自分の時間を自由に使える。賃金はすべて金でもらい、別の自分の家庭を支えるために使える。同じ仕事の人々と組織をつくる機会も、十分にある。
  translation_status: reviewed
- id: da-04-023
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '116'
    source_sequence: 138
  source_text: The domestic employee is retained in the household largely because her "mistress" fatuously believes that she is thus maintaining the sanctity of family life.
  translation_ja: 雇われて家事をする者が家庭のなかにつなぎとめられるのは、大部分、「奥さま」が、そうすることで家族生活の神聖さを守っていると、愚かにも信じているためである。
  translation_status: reviewed
- id: da-04-024
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '116'
    source_sequence: 139
    printed_page_end: '117'
  source_text: The household employee has no regular opportunity for meeting other workers of her trade, and of attaining with them the dignity of a corporate body. The industrial isolation of the household employee results, as isolation in a trade must always result, in a lack of progress in the methods and products of that trade, and a lack of aspiration and education in the workman. Whether we recognize this isolation as a cause or not, we are all ready to acknowledge that household labor has been in some way belated; that the improvements there have not kept up with the improvement in other occupations. It is said that the last revolution in the processes of cooking was brought about by Count Rumford, who died a hundred years ago. This is largely due to the lack of esprit de corps among the employees, which keeps them collectively from fresh achievements, as the absence of education in the individual keeps her from improving her implements.
  translation_ja: 家庭で雇われる人には、同じ仕事をする人々と定期的に会い、皆でまとまって一つの団体としての尊厳を得る機会がない。仕事のうえで孤立すればどんな職業でも、やり方も成果も進歩せず、働く者の意欲や技術を学ぶ機会も失われる。家事労働の孤立がその原因だと認めるかは別としても、家事がどこか取り残され、その改善が他の仕事に追いついていないことには、誰もがうなずくだろう。料理の仕方に最後の大変革を起こしたのは、百年前に亡くなったラムフォード伯爵だと言われる。これは大方、雇われる者に仲間としての一体感がなく、まとまって新しいことを成し遂げられないためだ。一人ひとりも、学ぶ機会がなくて道具を改良できない。
  translation_status: reviewed
- id: da-04-025
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '117'
    source_sequence: 140
    printed_page_end: '118'
  source_text: Under this isolation, not only must one set of utensils serve divers purposes, and, as a consequence, tend to a lessened volume and lower quality of work, but, inasmuch as the appliances are not made to perform the fullest work, there is an amount of capital invested disproportionate to the product when measured by the achievement in other branches of industry. More important than this is the result of the isolation upon the worker herself. There is nothing more devastating to the inventive faculty, nor fatal to a flow of mind and spirit, than the constant feeling of loneliness and the absence of that fellowship which makes our public opinion. If an angry foreman reprimands a girl for breaking a machine, twenty other girls hear him, and the culprit knows perfectly well their opinion as to the justice or injustice of her situation. In either case she bears it better for knowing that, and not thinking it over in solitude. If a household employee breaks a utensil or a piece of porcelain and is reprimanded by her employer, too often the invisible jury is the family of the latter, who naturally uphold her censorious position and intensify the feeling of loneliness in the employee.
  translation_ja: こうして孤立すると、一そろいの道具にいろいろな使い道を担わせ、それだけこなせる仕事の量も質も落ちやすくなる。しかも、どの道具もできるかぎり働かせるようになっていないため、他の産業でできることと比べてみれば、得られる成果のわりに不釣り合いな資本を注ぎ込んでいる。もっと重要なのは、孤立が働く人本人に及ぼす結果である。いつも一人だと感じ、物事をどう見るかを互いに形づくる仲間がいないほど、工夫する力が荒らされ、考えも気持ちものびのび働かなくなることはない。怒った職長が、機械を壊した女性をしかれば、ほかの二十人の女性がそれを聞く。壊した本人には、自分の扱いが公正かどうかについて、仲間がどんな意見を持つかがよく分かる。どんな意見であれ、一人で思いめぐらすのでなく、それを知っていれば、しかられても耐えやすい。家庭で雇われる人が道具や陶器を壊して雇い主にしかられると、目に見えない陪審の役をするのは、あまりに多くの場合、雇い主の家族である。当然しかられた側ではなく、非難する雇い主を支持し、雇われている人はさらに孤独を感じる。
  translation_status: reviewed
- id: da-04-026
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '119'
    source_sequence: 141
    printed_page_end: '120'
  source_text: The household employee, in addition to her industrial isolation, is also isolated socially. It is well to remember that the household employees for the better quarters of the city and suburbs are largely drawn from the poorer quarters, which are nothing if not gregarious. The girl is born and reared in a tenement house full of children. She goes to school with them, and there she learns to march, to read, and write in companionship with forty others. When she is old enough to go to parties, those she attends are usually held in a public hall and are crowded with dancers. If she works in a factory, she walks home with many other girls, in much the same spirit as she formerly walked to school with them. She mingles with the young men she knows, in frank, economic, and social equality. Until she marries she remains at home with no special break or change in her family and social life. If she is employed in a household, this is not true. Suddenly all the conditions of her life are altered. This change may be wholesome for her, but it is not easy, and thought of the savings-bank does not cheer one much, when one is twenty. She is isolated from the people with whom she has been reared, with whom she has gone to school, and among whom she expects to live when she marries. She is naturally lonely and constrained away from them, and the "new maid" often seems "queer" to her employer's family. She does not care to mingle socially with the people in whose house she is employed, as the girl from the country often does, but she surfers horribly from loneliness.
  translation_ja: 家事労働者は仕事のうえで孤立するだけでなく、社会的にも孤立している。市内や郊外の裕福な地区で雇われる人の多くは、貧しい地区の出身である。そこでは人が集まって暮らすのが何よりの特徴だということを、思い出しておきたい。少女は子どもでいっぱいの集合住宅に生まれ育つ。仲間と学校に通い、四十人もの子と一緒に、列を作って歩くことも、読み書きも習う。集まりに出られる年ごろになると、たいていは共同の広間で催される、人がひしめく踊りの会に行く。工場で働くなら、大勢の女性と一緒に家まで歩く。以前、仲間と登校したときとよく似た気分である。知り合いの青年とも、金銭の点でも社会的にも対等なので、気兼ねなく付き合う。結婚までは家にいるため、家族や社会との付き合いはとくに途切れず、変わりもしない。だが家庭で雇われれば、そうはいかない。暮らしの条件が、突然すべて変わる。本人にとってよい変化かもしれないが、楽ではない。二十歳で貯蓄銀行のことを考えても、たいして気は晴れない。一緒に育ち、学校に通い、結婚したらまたそのなかで暮らすと思っている人々から、引き離される。当然、離れていれば寂しく、気詰まりで、雇い主の家族には「新しいお手伝い」が「変わっている」と映ることが多い。田舎から来た女性ならよくあるように、雇われた家の人と親しく付き合いたいわけではない。だが寂しさにはひどく苦しむ。
  translation_status: reviewed
- id: da-04-027
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '120'
    source_sequence: 142
    printed_page_end: '121'
  source_text: This wholesome, instinctive dread of social isolation is so strong that, as every city intelligence-office can testify, the filling of situations is easier, or more difficult, in proportion as the place offers more or less companionship. Thus, the easy situation to fill is always the city house, with five or six employees, shading off into the more difficult suburban home, with two, and the utterly impossible lonely country house.
  translation_ja: 社会から離れて一人になることをおそれるのは、健全な本能であり、たいへん強い。どこの都会の職業紹介所でも言えることだが、どれだけ仲間のいる職場かによって、人が見つかりやすいか、見つかりにくいかが決まる。雇われている者が五、六人いる市内の家はいつも希望者が見つかりやすく、二人しかいない郊外の家ではもっと見つかりにくく、ぽつんと建つ田舎の家では、まず無理となる。
  translation_status: reviewed
- id: da-04-028
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '121'
    source_sequence: 143
  source_text: There are suburban employers of household labor who make heroic efforts to supply domestic and social life to their employees; who take the domestic employee to drive, arrange to have her invited out occasionally; who supply her with books and papers and companionship. Nothing could be more praiseworthy in motive, but it is seldom successful in actual operation, resulting as it does in a simulacrum of companionship. The employee may have a genuine friendship for her employer, and a pleasure in her companionship, or she may not have, and the unnaturalness of the situation comes from the insistence that she has, merely because of the propinquity.
  translation_ja: 郊外で家事労働者を雇う人には、雇った人に家庭と社会での付き合いを得させようと、並外れた努力をする人もいる。馬車に乗って出かけるのに連れ出し、ときおり人から招いてもらえるように手を回し、本や新聞を渡し、話し相手にもなる。動機としてこれほど褒めるべきものはないが、実際にうまくいくことは少ない。形ばかりの付き合いになるからだ。雇われた人が雇い主に本当の友情を感じ、一緒にいるのを楽しく思うことも、まったくそうでないこともある。ただ近くにいるというだけで、友情を持ち、楽しく思うものだと言い張るところに、この関係の不自然さがある。
  translation_status: reviewed
- id: da-04-029
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '121'
    source_sequence: 144
    printed_page_end: '122'
  source_text: The unnaturalness of the situation is intensified by the fact that the employee is practically debarred by distance and lack of leisure from her natural associates, and that her employer sympathetically insists upon filling the vacancy in interests and affections by her own tastes and friendship. She may or may not succeed, but the employee should not be thus dependent upon the good will of her employer. That in itself is undemocratic.
  translation_ja: 離れた土地にいて余暇もないので、自分が無理なく付き合える人々と会うことは事実上できない。雇い主は同情して、その人の関心や愛情にできた空白を、自分の好みや友情で埋めようと、きかない。これで事情はいっそう不自然になる。雇い主はうまくやるかもしれないし、やれないかもしれない。だが雇われた人が、このように雇い主の好意に頼ることがあってはならない。そのこと自体が、民主的でない。
  translation_status: reviewed
- id: da-04-030
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '122'
    source_sequence: 145
    printed_page_end: '123'
  source_text: The difficulty is increasing by a sense of social discrimination which the household employee keenly feels is against her and in favor of the factory girls, in the minds of the young men of her acquaintance. Women seeking employment, understand perfectly well this feeling among mechanics, doubtless quite unjustifiable, but it acts as a strong inducement toward factory labor. The writer has long ceased to apologize for the views and opinions of working people, being quite sure that on the whole they are quite as wise and quite as foolish as the views and opinions of other people, but that this particularly foolish opinion of young mechanics is widely shared by the employing class can be easily demonstrated. The contrast is further accentuated by the better social position of the factory girl, and the advantages provided for her in the way of lunch clubs, social clubs, and vacation homes, from which girls performing household labor are practically excluded by their hours of work, their geographical situation, and a curious feeling that they are not as interesting as factory girls.
  translation_ja: 知り合いの若い男性が、家庭で働く女性を下に見て、工場で働く女性を上に見る。この差別を身にしみて感じるため、事態はいっそう難しくなっている。職を求める女性たちは、男性職人のあいだにそんな気持ちがあることをよく知っている。まったく根拠はないようだが、工場で働こうとする強い動機になる。私は、働く人の見方や意見をとりつくろうのは、ずっと前にやめた。全体としてみれば、ほかの人と同じくらい賢く、同じくらい愚かだと確信しているからだ。とはいえ、若い職人のこのとりわけ愚かな見方を、雇う側の階級も広く共有していることは、たやすく示せる。工場で働く女性のほうが社会的な立場がよいうえ、昼食をともにするクラブ、社交のクラブ、休暇を過ごす家も利用できるので、この対照はいっそう強くなる。家庭で働く女性は、仕事の時間や働く場所のせいで、事実上そこから締め出される。さらに、工場で働く女性ほど興味を引かない、という奇妙な見方も、締め出しに一役買っている。
  translation_status: reviewed
- id: da-04-031
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '123'
    source_sequence: 146
    printed_page_end: '124'
  source_text: This separation from her natural social ties affects, of course, her opportunity for family life. It is well to remember that women, as a rule, are devoted to their families; that they want to live with their parents, their brothers and sisters, and kinsfolk, and will sacrifice much to accomplish this. This devotion is so universal that it is impossible to ignore it when we consider women as employees. Young unmarried women are not detached from family claims and requirements as young men are, and are more ready and steady in their response to the needs of aged parents and the helpless members of the family. But women performing labor in households have peculiar difficulties in responding to their family claims, and are practically dependent upon their employers for opportunities of even seeing their relatives and friends.
  translation_ja: 自然な人のつながりから離されれば、当然、家族と暮らす機会にも影響する。女性は、一般に家族を大切にし、親や兄弟姉妹、親族と暮らすことを望み、そのためなら多くのものを犠牲にするということを、思い出しておきたい。女性を雇われる側として考えるとき、これほど広く見られる献身を無視することはできない。若い未婚の女性は男のように、家族の求めや必要から離れておらず、年老いた親や自分で何もできない家族を助けるのにも、より進んで、根気よく応える。だが、家庭で雇われて働く女性には、自分の家族が求めることに応えるうえで、特有の難しさがある。身内や友だちに会う機会さえ、事実上、雇い主に頼っているからだ。
  translation_status: reviewed
- id: da-04-032
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '124'
    source_sequence: 147
  source_text: Curiously enough the same devotion to family life and quick response to its claims, on the part of the employer, operates against the girl employed in household labor, and still further contributes to her isolation.
  translation_ja: 奇妙なことに、雇い主も自分の家族生活に同じように尽くし、その求めにすぐ応えることが、家庭で働く女性に不利に働き、いっそう孤立させる。
  translation_status: reviewed
- id: da-04-033
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '124'
    source_sequence: 148
  source_text: The employer of household labor, in her zeal to preserve her own family life intact and free from intrusion, acts inconsistently and grants to her cook, for instance, but once or twice a week, such opportunity for untrammelled association with her relatives as the employer's family claims constantly. This in itself is undemocratic, in that it makes a distinction between the value of family life for one set of people as over against another; or, rather, claims that one set of people are of so much less importance than another, that a valuable side of life pertaining to them should be sacrificed for the other.
  translation_ja: 家事労働者を雇う側は、自分の家族の暮らしを損なわず、邪魔が入らないようにと熱心になるあまり、筋の通らないことをする。たとえば料理人が身内と自由に付き合える機会は、週に一、二度しか認めない。それと同じ機会を、自分の家族は好きなときに求めるというのに。これだけでも民主的ではない。ある人々にとって家族生活が持つ価値を、別の人々と区別しているからだ。むしろ、片方の人々はもう一方よりずっと重要でないので、片方の暮らしの大切な一面を、もう一方のために犠牲にすべきだ、と言っているのである。
  translation_status: reviewed
- id: da-04-034
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '124'
    source_sequence: 149
    printed_page_end: '126'
  source_text: This cannot be defended theoretically, and no doubt much of the talk among the employers of household labor, that their employees are carefully shielded and cared for, and that it is so much better for a girl's health and morals to work in a household than to work in a factory, comes from a certain uneasiness of conscience, and from a desire to make up by individual scruple what would be done much more freely and naturally by public opinion if it had an untrammelled chance to assert itself. One person, or a number of isolated persons, however conscientious, cannot perform this office of public opinion. Certain hospitals in London have contributed statistics showing that seventy-eight per cent of illegitimate children born there are the children of girls working in households. These girls are certainly not less virtuous than factory girls, for they come from the same families and have had the same training, but the girls who remain at home and work in factories meet their lovers naturally and easily, their fathers and brothers know the men, and unconsciously exercise a certain supervision and a certain direction in their choice of companionship. The household employees living in another part of the city, away from their natural family and social ties, depend upon chance for the lovers whom they meet. The lover may be the young man who delivers for the butcher or grocer, or the solitary friend, who follows the girl from her own part of town and pursues unfairly the advantage which her social loneliness and isolation afford him. There is no available public opinion nor any standard of convention which the girl can apply to her own situation.
  translation_ja: こうした区別は、理論で弁護できない。家庭で働く人は注意深く守られ、世話を受けており、工場より家庭で働くほうが、娘の健康と道徳にはずっとよい、と雇い主のあいだでよく言われる。その多くは、良心がいくらか落ち着かず、世論が何にも妨げられず力を発揮すれば、もっと自由に、自然にできることを、個人の慎重さで埋め合わせたいからだろう。一人の人間はもちろん、孤立した人々が何人いても、どれほど良心的であれ、世論の役割を果たすことはできない。ロンドンのいくつかの病院は、そこで婚姻関係にない親から生まれた子の七十八パーセントが、家庭で働く女性の子であることを示す統計を出した。これらの女性が、工場で働く女性より品行が悪いわけでは、決してない。同じような家庭の出で、同じように育てられたからである。ただ家にいて工場へ通う女性は、自然に、たやすく恋人と会える。父や兄弟たちは相手を知っており、気づかないながらも、付き合いをある程度見守り、相手を選ぶときにもいくらか方向を示す。だが家庭で雇われて市内の別の地区に住み、もともとの家族や社会のつながりから離れてしまった女性がどんな恋人に会うかは、偶然しだいだ。肉屋や食料品店の配達をする青年かもしれない。自分の住んだ地区からついてきたたった一人の友人が、この女性の人付き合いの乏しさと孤立から、ずるくもつけ込もうとしているのかもしれない。周囲の世論も、暮らしのしきたりも、女性が自分の置かれた状況を判断するのに頼れるものはない。
  translation_status: reviewed
- id: da-04-035
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '126'
    source_sequence: 150
  source_text: It would be easy to point out many inconveniences arising from the fact that the old economic forms are retained when moral conditions which befitted them have entirely disappeared, but until employers of domestic labor become conscious of their narrow code of ethics, and make a distinct effort to break through the status of mistress and servant, because it shocks their moral sense, there is no chance of even beginning a reform.
  translation_ja: かつて古い経済の仕組みに合っていた道徳上の条件は、すっかり消えたのに、その仕組みが残っているために生じる不都合は、いくらでも挙げられる。しかし家庭で働く人を雇う側が、自分たちの道徳が狭いと気づき、女主人と召使いという身分関係に自らの道徳感覚が衝撃を受けて、そこから抜け出そうとはっきり努力するまでは、改革を始めることさえできない。
  translation_status: reviewed
- id: da-04-036
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '127'
    source_sequence: 151
    printed_page_end: '128'
  source_text: A fuller social and domestic life among household employees would be steps toward securing their entrance into the larger industrial organizations by which the needs of a community are most successfully administered. Many a girl who complains of loneliness, and who relinquishes her situation with that as her sole excuse, feebly tries to formulate her sense of restraint and social mal-adjustment. She sometimes says that she "feels so unnatural all the time." The writer has known the voice of a girl to change so much during three weeks of "service" that she could not recognize it when the girl returned to her home. It alternated between the high falsetto in which a shy child "speaks a piece" and the husky gulp with which the globus hystericus is swallowed. The alertness and bonhomie of the voice of the tenement-house child had totally disappeared. When such a girl leaves her employer, her reasons are often incoherent and totally incomprehensible to that good lady, who naturally concludes that she wishes to get away from the work and back to her dances and giddy life, content, if she has these, to stand many hours in an insanitary factory. The charge of the employer is only half a truth. These dances may be the only organized form of social life which the disheartened employee is able to mention, but the girl herself, in her discontent and her moving from place to place, is blindly striving to respond to a larger social life. Her employer thinks that she should be able to consider only the interests and conveniences of her employer's family, because the employer herself is holding to a family outlook, and refuses to allow her mind to take in the larger aspects of the situation.
  translation_ja: 家庭で働く人たちの社会生活と家庭生活がもっと豊かになれば、共同体が必要とするものを最もうまく供給できる、より大きな仕事の組織に加わるための一歩になるだろう。寂しいとこぼし、それ一つを理由に職を辞める女性は多い。息が詰まり、周囲になじめない気持ちを、何とか言葉にしてみようとするが、うまくできない。「いつも自分が変になっちゃったみたい」と言うこともある。わずか三週間の「お勤め」で、声があまりに変わり、家に帰ってきたとき、私は本人だと分からなかった娘を知っている。はずかしがりの子が人前で「習った一節を暗唱する」ときの高い裏声と、喉にものがつかえて、それをのみ込むような、かすれた声が交互に出た。集合住宅で育ったその娘の声には、はきはきした明るさと人なつこさがあったが、それはまるでなくなっていた。こういう娘が辞めるとき、理由はしばしばまとまらず、善良な女主人にはさっぱり理解できない。当然、せいぜい仕事を抜け出し、踊りや浮かれた暮らしに戻りたいだけで、そうした楽しみがあれば、不衛生な工場に何時間も立ちっぱなしで構わないのだろう、と結論する。雇い主の非難は、半分しか当たっていない。心の折れた女性にとって、踊りは名前を挙げられる唯一のまとまった社交の場かもしれない。だが彼女自身は、不満を抱いて職場を移っていくうちに、はっきり分からなくても、もっと広い社会の暮らしに応えようともがいている。雇い主は、雇った女性が雇い主の家の利益と都合だけを考えていられるはずだと思う。雇い主自身が自分の家族の側から見ることにこだわり、もっと広いところから事情を考えたくないからだ。
  translation_status: reviewed
- id: da-04-037
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '128'
    source_sequence: 152
    printed_page_end: '129'
  source_text: Although this household industry survives in the midst of the factory system, it must, of course, constantly compete with it. Women with little children, or those with invalids depending upon them, cannot enter either occupation, and they are practically confined to the sewing trades; but to all other untrained women seeking employment a choice is open between these two forms of labor.
  translation_ja: 家庭内のこの仕事は工場制度の真ん中で生き残っているが、もちろん、絶えず工場と競り合わなくてはならない。小さな子を持つ女性や、病弱な人の面倒を見ている女性は、どちらの仕事にも就けず、事実上、裁縫の仕事に限られる。だが、それ以外の特別な訓練のない女性が職を求めれば、二つのうちどちらかを選べる。
  translation_status: reviewed
- id: da-04-038
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '129'
    source_sequence: 153
    printed_page_end: '130'
  source_text: There are few women so dull that they cannot paste labels on a box, or do some form of factory work; few so dull that some perplexed housekeeper will not receive them, at least for a trial, in her household. Household labor, then, has to compete with factory labor, and women seeking employment, more or less consciously compare these two forms of labor in point of hours, in point of permanency of employment, in point of wages, and in point of the advantage they afford for family and social life. Three points are easily disposed of. First, in regard to hours, there is no doubt that the factory has the advantage. The average factory hours are from seven in the morning to six in the evening, with the chance of working overtime in busy seasons. This leaves most of the evenings and Sundays entirely free. The average hours of household labor are from six in the morning until eight at night, with little difference in seasons. There is one afternoon a week, with an occasional evening, but Sunday is seldom wholly free. Even these evenings and afternoons take the form of a concession from the employer. They are called "evenings out," as if the time really belonged to her, but that she was graciously permitting her employee to use it. This attitude, of course, is in marked contrast to that maintained by the factory operative, who, when she works evenings is paid for "over-time."
  translation_ja: 箱にラベルを貼るか、工場で何かの仕事をすることもできないほど不器用な女性はめったにいない。困り果てた主婦が、一度試しにでも自分の家で雇う気にならないほど不器用な女性も、めったにいない。そこで、家事労働は工場労働と競り合うことになり、仕事を探す女性は、多少の差はあっても、労働時間、仕事の続きやすさ、賃金、家族や社会との暮らしをどれほど支えられるかで、二つを比べる。うち三点はすぐに答えられる。第一に、時間の点では工場が有利だと疑いない。工場では平均して朝七時から夕方六時までで、忙しい時期は残業することもある。大抵の夜と日曜は、まるごと自由になる。家庭の仕事は平均して朝六時から夜八時までで、季節の違いはほとんどない。週に一度の午後と、時に夜が一度空くが、日曜が一日まるごと空くことはめったにない。その夜や午後でさえ、雇い主の譲歩という形で認められる。「外出を許された夜」と呼ぶのは、まるでその時間が本来、雇い主のもので、雇った女性にお情けで使わせるかのようだ。この態度はもちろん、夜に働けば「残業」の賃金が出る工場労働者の立場と、著しい対照をなす。
  translation_status: reviewed
- id: da-04-039
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '130'
    source_sequence: 154
  source_text: Second, in regard to permanency of position, the advantage is found clearly on the side of the household employee, if she proves in any measure satisfactory to her employer, for she encounters much less competition.
  translation_ja: 第二に、職が続くかという点では、雇い主をいくらかなりとも満足させる働きができれば、家庭で雇われる人が明らかに有利である。競争相手がずっと少ないからだ。
  translation_status: reviewed
- id: da-04-040
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '130'
    source_sequence: 155
    printed_page_end: '131'
  source_text: Third, in point of wages, the household is again fairly ahead, if we consider not the money received, but the opportunity offered for saving money. This is greater among household employees, because they do not pay board, the clothing required is simpler, and the temptation to spend money in recreation is less frequent. The minimum wages paid an adult in household labor may be fairly put at two dollars and a half a week; the maximum at six dollars, this excluding the comparatively rare opportunities for women to cook at forty dollars a month, and the housekeeper's position at fifty dollars a month.
  translation_ja: 第三に、賃金も、受け取る金でなく貯められる金を考えるなら、家庭のほうがかなり有利である。家庭で働く人のほうが貯められるのは、食費や宿代を払わず、必要な服も質素で済み、気晴らしに金を使いたくなる機会も少ないからだ。大人が家庭で働いて受け取る賃金の下限は、週に二ドル五十セント、上限は六ドルと見てよい。月四十ドルで料理人になれる比較的まれな機会と、月五十ドルの家政責任者の職は、数に入れていない。
  translation_status: reviewed
- id: da-04-041
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '131'
    source_sequence: 156
    printed_page_end: '132'
  source_text: The factory wages, viewed from the savings-bank point of view, may be smaller in the average, but this is doubtless counterbalanced in the minds of the employees by the greater chance which the factory offers for increased wages. A girl over sixteen seldom works in a factory for less than four dollars a week, and always cherishes the hope of at last being a forewoman with a permanent salary of from fifteen to twenty-five dollars a week. Whether she attains this or not, she runs a fair chance of earning ten dollars a week as a skilled worker. A girl finds it easier to be content with three dollars a week, when she pays for board, in a scale of wages rising toward ten dollars, than to be content with four dollars a week and pay no board, in a scale of wages rising toward six dollars; and the girl well knows that there are scores of forewomen at sixty dollars a month for one forty-dollar cook or fifty-dollar housekeeper. In many cases this position is well taken economically, for, although the opportunity for saving may be better for the employees in the household than in the factory, her family saves more when she works in a factory and lives with them. The rent is no more when she is at home. The two dollars and a half a week which she pays into the family fund more than covers the cost of her actual food, and at night she can often contribute toward the family labor by helping her mother wash and sew.
  translation_ja: 貯金できる金で見れば、工場の賃金は平均して低いかもしれない。だが、工場のほうが賃金の上がる可能性が大きいため、働く側には、その見込みで不利は埋め合わされると思える。十六歳を超えた女性が、工場で週四ドルに満たない賃金で働くことはめったにない。いずれは女性の職長となり、週十五ドルから二十五ドルの安定した給料を得たいという望みは、いつも持っている。そこまで行くかどうかは別として、熟練工として週十ドルを稼げる見込みは十分にある。週四ドルをもらい食費や宿代は要らないが、賃金は上がっても週六ドルほどまでという勤めより、週三ドルをもらって食費や宿代を負担しても、賃金は週十ドルへ上がっていく勤めのほうが、本人は受け入れやすい。月四十ドルの料理人や月五十ドルの家政責任者が一人いるのに対し、月六十ドルの女性職長は何十人もいることも、よく知っている。多くの場合、この選択は経済的にも根拠がある。本人には工場よりも家庭で働くほうが貯金しやすいかもしれないが、工場で働き家族と暮らすほうが、家族には貯められるお金が多いからだ。娘が家にいても家賃は変わらない。毎週家計に入れる二ドル五十セントは、実際に食べた分の費用より多い。夜には母を手伝って洗濯や裁縫をし、家族の労働にも力を貸せることが多い。
  translation_status: reviewed
- id: da-04-042
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '132'
    source_sequence: 157
    printed_page_end: '133'
  source_text: The fourth point has already been considered, and if the premise in regard to the isolation of the household employee is well taken, and if the position can be sustained that this isolation proves the determining factor in the situation, then certainly an effort should be made to remedy this, at least in its domestic and social aspects. To allow household employees to live with their own families and among their own friends, as factory employees now do, would be to relegate more production to industrial centres administered on the factory system, and to secure shorter hours for that which remains to be done in the household.
  translation_ja: 四番目の点については、すでに考えた。家庭で働く人は孤立しているという前提が妥当であり、その孤立が事態を決める要因だと言えるなら、少なくとも家族や社会との付き合いの面では、これを改める努力を、当然するべきだろう。工場の労働者がいまそうしているように、家庭で働く人たちも自分の家族と暮らし、自分の友人たちのなかにいられるようにすれば、生産のうち、より多くの部分を工場方式で運営する事業所に移し、家庭に残る仕事は、より短い時間で終えられるようにできるだろう。
  translation_status: reviewed
- id: da-04-043
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '133'
    source_sequence: 158
    printed_page_end: '134'
  source_text: In those cases in which the household employees have no family ties, doubtless a remedy against social isolation would be the formation of residence clubs, at least in the suburbs, where the isolation is most keenly felt. Indeed, the beginnings of these clubs are already seen in the servants' quarters at the summer hotels. In these residence clubs, the household employee could have the independent life which only one's own abiding place can afford. This, of course, presupposes a higher grade of ability than household employees at present possess; on the other hand, it is only by offering such possibilities that the higher grades of intelligence can be secured for household employment. As the plan of separate clubs for household employees will probably come first in the suburbs, where the difficulty of securing and holding "servants" under the present system is most keenly felt, so the plan of buying cooked food from an outside kitchen, and of having more and more of the household product relegated to the factory, will probably come from the comparatively poor people in the city, who feel most keenly the pressure of the present system. They already consume a much larger proportion of canned goods and bakers' wares and "prepared meats" than the more prosperous people do, because they cannot command the skill nor the time for the more tedious preparation of the raw material. The writer has seen a tenement-house mother pass by a basket of green peas at the door of a local grocery store, to purchase a tin of canned peas, because they could be easily prepared for supper and "the children liked the tinny taste."
  translation_ja: 家庭で働く人に頼れる身内がいない場合には、共同の住まいをつくることが、疑いなく社会的孤立への手立てになる。少なくとも、孤立をいちばん強く感じる郊外ではそうだ。実際、夏の保養地のホテルの従業員宿舎に、こうした住まいの始まりがすでに見える。そこなら家事労働者は、自分の帰る場所を持って初めて可能になる、独立した暮らしができる。もちろん、それには、現在家庭で働く人が持つより高い能力が要ることを前提にしている。反対に、こうした可能性を差し出すことでしか、もっと知性のある働き手にこの仕事を選んでもらえない。家庭で働く人専用の共同住宅はおそらく、今の仕組みでは「召使い」を見つけて引き留める難しさを最も感じる郊外で、まず始まるだろう。それと同じように、外の厨房から調理済みの料理を買い、家庭で使う品の生産をますます工場に移すことは、おそらく今の仕組みの重圧をいちばん強く受ける、市内の比較的貧しい人たちから始まる。その人たちはすでに、裕福な人よりよほど多く、缶詰やパン屋の品、「調理済みの肉」を使っている。手をかけて素材を下ごしらえするだけの技量も時間もないからである。集合住宅に住む母親が、近所の食料品店の戸口に置かれた籠の生のエンドウ豆を通り過ぎ、缶詰のエンドウ豆を買うのを、私は見た。晩ごはんにすぐ出せて、「子どもたちが缶詰の味を好き」だからだ。
  translation_status: reviewed
- id: da-04-044
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '134'
    source_sequence: 159
    printed_page_end: '135'
  source_text: It is comparatively easy for an employer to manage her household industry with a cook, a laundress, a waitress. The difficulties really begin when the family income is so small that but one person can be employed in the household for all these varied functions, and the difficulties increase and grow almost insurmountable as they fall altogether upon the mother of the family, who is living in a flat, or, worse still, in a tenement house, where one stove and one set of utensils must be put to all sorts of uses, fit or unfit, making the living room of the family a horror in summer, and perfectly insupportable on rainy washing-days in winter. Such a woman, rather than the prosperous housekeeper, uses factory products, and thus no high standard of quality is established.
  translation_ja: 料理人、洗濯係、給仕がいれば、雇い主にとって家の仕事を取り仕切るのは比較的簡単だ。家の収入が少なく、こうしたさまざまな役割のために一人しか雇えなくなると、本当の難しさが始まる。その家の母親一人にすべてかかると、難しさは増し、ほとんど手に負えなくなる。アパートや、もっと悪ければ貧しい地区の集合住宅では、一台のこんろと一そろいの道具を、向いているかどうかに関係なく、何にでも使わなくてはならない。すると夏の一家の居間はひどいありさまで、冬、雨の日に洗濯をするときにはとうてい耐えられない。工場で作られた品物を使うのは、裕福な主婦よりも、そういう女性なので、品質の高い基準ができていかない。
  translation_status: reviewed
- id: da-04-045
  section_id: ch-04
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '135'
    source_sequence: 160
    printed_page_end: '136'
  source_text: The problem of domestic service, which has long been discussed in the United States and England, is now coming to prominence in France. As a well-known economist has recently pointed out, the large defection in the ranks of domestics is there regarded as a sign of revolt against an "unconscious slavery," while English and American writers appeal to the statistics which point to the absorption of an enormous number of the class from which servants were formerly recruited into factory employments, and urge, as the natural solution, that more of the products used in households be manufactured in factories, and that personal service, at least for healthy adults, be eliminated altogether. Both of these lines of discussion certainly indicate that domestic service is yielding to the influence of a democratic movement, and is emerging from the narrower code of family ethics into the larger code governing social relations. It still remains to express the ethical advance through changed economic conditions by which the actual needs of the family may be supplied not only more effectively but more in line with associated effort. To fail to apprehend the tendency of one's age, and to fail to adapt the conditions of an industry to it, is to leave that industry ill-adjusted and belated on the economic side, and out of line ethically.
  translation_ja: 合衆国とイングランドで長く議論された家庭での雇用の問題は、いまフランスでも大きく取り上げられつつある。有名なある経済学者が最近指摘したように、フランスでは、召使いを辞める人が大勢出たことは、「気づかぬうちに強いられた奴隷状態」への反抗のしるしと見なされる。一方、イングランドとアメリカの論者は、かつて召使いを雇い入れる相手だった階層の非常に多くの人が、工場の仕事に吸収されたことを示す統計を引く。そして、家庭で使う品をもっと工場で作るようにし、少なくとも健康な大人の身の回りを人に世話させることは、まったくなくすのが自然な解決だと勧める。この二つの議論から確かに分かるのは、家庭での雇用が民主主義の動きに道を譲り、家族の倫理という狭い規範を離れて、社会を成り立たせる人間関係を律する、より広い規範のうちへ入っていくことだ。あとに残るのは、倫理のうえで前に進んだことを、経済の条件を変えることで形にすることだ。そうなれば、家庭の本当の必要が、より効果的に、しかも人々が協力して働くことに、より合った形で満たされる。自分の時代が向かうところをつかめず、仕事の条件を合わせられなければ、その仕事は経済の面でなじまず取り残され、倫理の面でも時代から外れてしまう。
  translation_status: reviewed
- id: da-05-000
  section_id: ch-05
  kind: heading
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '137'
    source_sequence: 161
    url: https://www.gutenberg.org/files/15487/15487-h/15487-h.htm#page_137
    anchor: page_137
  source_text: CHAPTER V. INDUSTRIAL AMELIORATION
  translation_ja: 第五章　労働と産業の改善
  translation_status: reviewed
- id: da-05-001
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '137'
    source_sequence: 162
  source_text: There is no doubt that the great difficulty we experience in reducing to action our imperfect code of social ethics arises from the fact that we have not yet learned to act together, and find it far from easy even to fuse our principles and aims into a satisfactory statement. We have all been at times entertained by the futile efforts of half a dozen highly individualized people gathered together as a committee. Their aimless attempts to find a common method of action have recalled the wavering motion of a baby's arm before he has learned to coördinate his muscles.
  translation_ja: まだ不完全な私たちの社会倫理を、行動に移すのはたいへん難しい。それは間違いなく、まだ一緒に行動するすべを身につけておらず、原則と目的を一つにまとめ、誰もが納得する言葉にすることさえ、容易ではないからだ。きわめて個性の強い人が五、六人集まって委員会をつくり、いくら努力しても何も決まらないのを、私たちは誰しも面白がって見たことがある。皆で動くやり方を見つけようとする、行き当たりばったりの試みは、まだ筋肉をうまく連動させられない赤ん坊の腕が、ふらふら揺れるのを思い出させる。
  translation_status: reviewed
- id: da-05-002
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '137'
    source_sequence: 163
    printed_page_end: '138'
  source_text: If, as is many times stated, we are passing from an age of individualism to one of association, there is no doubt that for decisive and effective action the individual still has the best of it. He will secure efficient results while committees are still deliberating upon the best method of making a beginning. And yet, if the need of the times demand associated effort, it may easily be true that the action which appears ineffective, and yet is carried out upon the more highly developed line of associated effort, may represent a finer social quality and have a greater social value than the more effective individual action. It is possible that an individual may be successful, largely because he conserves all his powers for individual achievement and does not put any of his energy into the training which will give him the ability to act with others. The individual acts promptly, and we are dazzled by his success while only dimly conscious of the inadequacy of his code. Nowhere is this illustrated more clearly than in industrial relations, as existing between the owner of a large factory and his employees.
  translation_ja: よく言われるように、私たちが個人主義の時代から協力の時代へ移る途中にあるとしても、素早く決断し、効果的に動くのは、今も個人が得意だということに疑いはない。委員会がどう始めるのが一番よいかを協議しているあいだに、一人で動く人は、手際よく結果を出すだろう。だが、時代が協力して取り組むことを求めるのなら、効果がないように見えても、より進んだ共同の努力に沿ってなされた行動は、個人がいっそう効果的に行ったことより、社会にとって質が高く、価値も大きいことがある。一人でうまくいく人がいるのは、大方、力をすべて自分一人で成し遂げることに温存し、他人と協力できるようになる訓練に少しも力を割かないためかもしれない。その人はてきぱき動く。私たちは成功に目を奪われ、その人の行動の規範が十分ではないことは、ぼんやりとしか気づかない。このことが、大きな工場の所有者と従業員のあいだの労働関係ほどはっきりしているところはない。
  translation_status: reviewed
- id: da-05-003
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '139'
    source_sequence: 164
  source_text: A growing conflict may be detected between the democratic ideal, which urges the workmen to demand representation in the administration of industry, and the accepted position, that the man who owns the capital and takes the risks has the exclusive right of management. It is in reality a clash between individual or aristocratic management, and corporate or democratic management. A large and highly developed factory presents a sharp contrast between its socialized form and individualistic ends.
  translation_ja: 労働者は産業の運営に自分たちの代表を求めるべきだという民主主義の理想と、資本を持ち危険を引き受ける人に経営の独占権があるという通念との、対立が深まりつつある。実のところ、個人による、あるいは少数の特権者による経営と、共同の、民主的な経営の衝突である。大規模でよく発達した工場では、仕事をする仕組みが社会的なものである一方、経営の目的は個人主義的である。その対照は著しい。
  translation_status: reviewed
- id: da-05-004
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '139'
    source_sequence: 165
  source_text: It is possible to illustrate this difference by a series of events which occurred in Chicago during the summer of 1894. These events epitomized and exaggerated, but at the same time challenged, the code of ethics which regulates much of our daily conduct, and clearly showed that so-called social relations are often resting upon the will of an individual, and are in reality regulated by a code of individual ethics.
  translation_ja: 一八九四年の夏、シカゴで起きた一連の出来事を見れば、この違いが分かる。出来事は、私たちの日ごろの振る舞いの多くを律する倫理の規範を、凝縮し、極端な形で示したばかりでなく、その規範に異議も突きつけた。いわゆる社会的な関係が、実際にはしばしば一人の意志を土台にし、個人の倫理の規範によって律せられていることが、はっきりした。
  translation_status: reviewed
- id: da-05-005
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '140'
    source_sequence: 166
  source_text: As this situation illustrates a point of great difficulty to which we have arrived in our development of social ethics, it may be justifiable to discuss it at some length. Let us recall the facts, not as they have been investigated and printed, but as they remain in our memories.
  translation_ja: この事態は、私たちが社会倫理を発達させてきたなかで、突き当たったたいへん難しい地点をよく示している。それゆえ、いくらか時間をかけて論じてもよいだろう。調査され印刷されたとおりにではなく、私たちの記憶に残っているとおりに、事実を思い起こしてみよう。
  translation_status: reviewed
- id: da-05-006
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '140'
    source_sequence: 167
    printed_page_end: '143'
  source_text: A large manufacturing company had provided commodious workshops, and, at the instigation of its president, had built a model town for the use of its employees. After a series of years it was deemed necessary, during a financial depression, to reduce the wages of these employees by giving each workman less than full-time work "in order to keep the shops open." This reduction was not accepted by the men, who had become discontented with the factory management and the town regulations, and a strike ensued, followed by a complete shut-down of the works. Although these shops were non-union shops, the strikers were hastily organized and appealed for help to the American Railway Union, which at that moment was holding its biennial meeting in Chicago. After some days' discussion and some futile attempts at arbitration, a sympathetic strike was declared, which gradually involved railway men in all parts of the country, and orderly transportation was brought to a complete standstill. In the excitement which followed, cars were burned and tracks torn up. The police of Chicago did not cope with the disorder, and the railway companies, apparently distrusting the Governor of the State, and in order to protect the United States mails, called upon the President of the United States for the federal troops, the federal courts further enjoined all persons against any form of interference with the property or operation of the railroads, and the situation gradually assumed the proportions of internecine warfare. During all of these events the president of the manufacturing company first involved, steadfastly refused to have the situation submitted to arbitration, and this attitude naturally provoked much discussion. The discussion was broadly divided between those who held that the long kindness of the president of the company had been most ungratefully received, and those who maintained that the situation was the inevitable outcome of the social consciousness developing among working people. The first defended the president of the company in his persistent refusal to arbitrate, maintaining that arbitration was impossible after the matter had been taken up by other than his own employees, and they declared that a man must be allowed to run his own business. They considered the firm stand of the president a service to the manufacturing interests of the entire country.
    The others claimed that a large manufacturing concern has ceased to be a private matter; that not only a number of workmen and stockholders are concerned in its management, but that the interests of the public are so involved that the officers of the company are in a real sense administering a public trust.
  translation_ja: ある大きな製造会社は、ゆとりのある作業場を用意し、社長が言い出して、従業員のために模範都市を建てていた。何年かのち、不況のさなかに「工場を開けておくため」、一人ずつ勤務時間を減らし、それによって賃金を引き下げる必要があると判断された。工場の運営や町の規則に不満を募らせていた労働者は、引き下げを受け入れなかった。ストライキが起き、ついで工場は全面閉鎖となった。これらの工場は組合のない職場だったが、スト参加者は急いで組織をつくり、折しもシカゴで二年ごとの大会を開いていたアメリカ鉄道労働組合に、支援を求めた。数日の協議と、実を結ばなかったいくつかの調停の試みのあと、連帯のストライキが宣言された。それは次第に全国の鉄道労働者を巻き込み、平常の輸送はまったく止まった。そのあとの騒ぎで車両が焼かれ、線路が壊された。シカゴの警察には混乱を収められなかった。鉄道会社は州知事を信用しなかったらしく、合衆国の郵便を守るためとして、大統領に連邦軍の派遣を求めた。連邦裁判所もまた、鉄道の財産と運行をいかなる形でも妨げてはならないと、すべての人に差し止めを命じた。事態はしだいに、内戦さながらの様相を帯びた。一連の出来事のあいだ、発端となった製造会社の社長は、一貫して問題を調停に付すのを拒み続けた。それが大きな議論を招いたのも、当然だろう。世論は大きく二つに分かれた。一方は、社長が長年かけて示した親切に対して、あまりに恩知らずな仕打ちだと考え、他方は、働く人々の社会への意識が育ちつつある以上、避けられない結果だと主張した。前者は調停を頑なに拒んだ社長を弁護した。自分の従業員以外の人間が問題に乗り出した時点で、調停は不可能であり、自分の事業を自分で営むことは認められなければならないと言った。社長の断固とした立場は、国全体の製造業の利益に役立つものと考えた。他方では、大きな製造会社はもう社長一人のことではない、経営には大勢の労働者と株主が関わるだけでなく、世間の利益が深く関係するので、経営陣は実質上、社会から託された仕事を取り仕切っているのだと主張した。
  translation_status: reviewed
- id: da-05-007
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '143'
    source_sequence: 168
  source_text: This prolonged strike clearly puts in a concrete form the ethics of an individual, in this case a benevolent employer, and the ethics of a mass of men, his employees, claiming what they believed to be their moral rights.
  translation_ja: この長く続いたストライキは、一人の人間、この場合は慈善心のある雇い主の倫理と、自分たちに道徳上の権利があると信じて要求する、大勢の従業員の倫理とを、はっきりと具体的な形で示している。
  translation_status: reviewed
- id: da-05-008
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '143'
    source_sequence: 169
    printed_page_end: '144'
  source_text: These events illustrate the difficulty of managing an industry which has become organized into a vast social operation, not with the coöperation of the workman thus socialized, but solely by the dictation of the individual owning the capital. There is a sharp divergence between the social form and the individual aim, which becomes greater as the employees are more highly socialized and dependent. The president of the company under discussion went further than the usual employer does. He socialized not only the factory, but the form in which his workmen were living. He built, and in a great measure regulated, an entire town, without calling upon the workmen either for self-expression or self-government. He honestly believed that he knew better than they what was for their good, as he certainly knew better than they how to conduct his business. As his factory developed and increased, making money each year under his direction, he naturally expected the town to prosper in the same way.
  translation_ja: これらの出来事は、途方もなく大きな社会的事業になった産業を、そこに組み込まれて働く人々の協力を得ずに、資本を持つ一人だけの指図で運営することの難しさを示す。社会的に組織された形と個人の目的とのあいだには、鋭い食い違いがある。従業員がもっと緊密に組織され、互いに頼るようになるほど、その違いは大きくなる。話題の会社の社長は、ふつうの雇い主より、さらに先へ進んでいた。工場だけでなく、労働者の暮らし方までも、一つの社会的な仕組みにまとめたのである。町を一つ建て、大方の規則を定めたが、労働者が自分たちの考えを述べたり、自治を行ったりするようには、働きかけなかった。会社をどう経営すればよいかを、労働者より自分がよく知っていたのは確かであり、同じように労働者のために何がよいかも、自分のほうがよく知っていると、本気で思っていた。指揮する工場は発展して規模を増し、年々利益を上げたので、町も同じように栄えると当然のように期待した。
  translation_status: reviewed
- id: da-05-009
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '144'
    source_sequence: 170
  source_text: He did not realize that the men submitted to the undemocratic conditions of the factory organization because the economic pressure in our industrial affairs is so great that they could not do otherwise. Under this pressure they could be successfully discouraged from organization, and systematically treated on the individual basis.
  translation_ja: 労働者が工場の非民主的なしくみに従ったのは、産業で経済的な圧力があまりに強く、ほかに選びようがなかったからだ。社長はそのことを分かっていなかった。この圧力のもとでは、労働者が組織をつくる気をそぎ、計画的に一人ひとりを相手にすることができた。
  translation_status: reviewed
- id: da-05-010
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '144'
    source_sequence: 171
    printed_page_end: '146'
  source_text: Social life, however, in spite of class distinctions, is much freer than industrial life, and the men resented the extension of industrial control to domestic and social arrangements. They felt the lack of democracy in the assumption that they should be taken care of in these matters, in which even the humblest workman has won his independence. The basic difficulty lay in the fact that an individual was directing the social affairs of many men without any consistent effort to find out their desires, and without any organization through which to give them social expression. The president of the company was, moreover, so confident of the righteousness of his aim that he had come to test the righteousness of the process by his own feelings and not by those of the men. He doubtless built the town from a sincere desire to give his employees the best surroundings. As it developed, he gradually took toward it the artist attitude toward his own creation, which has no thought for the creation itself but is absorbed in the idea it stands for, and he ceased to measure the usefulness of the town by the standard of the men's needs. This process slowly darkened his glints of memory, which might have connected his experience with that of his men. It is possible to cultivate the impulses of the benefactor until the power of attaining a simple human relationship with the beneficiaries, that of frank equality with them, is gone, and there is left no mutual interest in a common cause. To perform too many good deeds may be to lose the power of recognizing good in others; to be too absorbed in carrying out a personal plan of improvement may be to fail to catch the great moral lesson which our times offer.
  translation_ja: しかし家庭や地域での暮らしは、階級の違いがあっても、働く場よりずっと自由である。労働者は、仕事の場での支配が、家庭や社会の暮らしにまで広がるのに反発した。どんなにつつましい働き手でも自分で決められるようになったことを、世話してやるのが当たり前とされれば、そこに民主主義が欠けていると感じる。根本の難しさは、一人の人間が大勢の人の社会生活を取り仕切りながら、何を望んでいるのかを根気よく知ろうとせず、皆の望みを表に出せる組織もなかったことにある。しかも社長は目的が正しいと確信するあまり、その目的に至る過程が正しいかどうかを、労働者がどう感じるかではなく、自分がどう感じるかで測るようになっていた。従業員のために最もよい環境を用意しようと、誠実な願いから町を建てたのは間違いない。町が発展するうちに、だんだん芸術家が自作に向き合う態度を取るようになった。作品そのもののことはもう頭になく、表現した理念に没頭する。社長もまた、労働者が何を必要とするかを基準に、町の役立ち方を測ることをやめた。そのため、自らの経験と従業員の経験を結びつけたかもしれない、かすかな記憶の光までも、だんだん暗くなった。恩を施す者としての衝動を育てすぎると、助ける相手と人間として当たり前の、気兼ねない対等な関係を結ぶ力が失われ、同じ目的に互いに関心を寄せることもなくなりうる。善いことをあまりに多く行えば、他人の善を見抜く力がなくなるかもしれない。自分自身の改善計画の実行に熱中しすぎれば、この時代が与えてくれる大きな道徳上の教えを、つかみそこねるかもしれない。
  translation_status: reviewed
- id: da-05-011
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '146'
    source_sequence: 172
    printed_page_end: '147'
  source_text: The president of this company fostered his employees for many years; he gave them sanitary houses and beautiful parks; but in their extreme need, when they were struggling with the most difficult situation which the times could present to them, he lost his touch and had nothing wherewith to help them. The employer's conception of goodness for his men had been cleanliness, decency of living, and, above all, thrift and temperance. Means had been provided for all this, and opportunities had also been given for recreation and improvement. But this employer suddenly found his town in the sweep of a world-wide moral impulse. A movement had been going on about him and among his working men, of which he had been unconscious, or concerning which he had heard only by rumor.
  translation_ja: この会社の社長は、何年ものあいだ従業員を育て、衛生的な家と美しい公園を与えた。だが労働者が、この時代にありうる最も難しい事態と格闘して、切羽詰まったとき、社長には彼らの心が分からなくなり、助ける手立ても何一つなかった。清潔で、きちんと暮らし、とりわけ倹約と節酒を守ることが、雇い主の考える善い労働者の姿だった。そのための手段をそろえ、気晴らしや自分を向上させる機会も与えた。だがある日突然、自分の町が世界に広がる道徳的な動きに巻き込まれていることに、雇い主は気づいた。その周囲や従業員のなかでは、本人が気づかずにいたか、せいぜいうわさで聞いただけの運動が、すでに続いていた。
  translation_status: reviewed
- id: da-05-012
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '147'
    source_sequence: 173
  source_text: Outside the ken of philanthropists the proletariat had learned to say in many languages, that "the injury of one is the concern of all." Their watchwords were brotherhood, sacrifice, the subordination of individual and trade interests, to the good of the working classes, and they were moved by a determination to free that class from the untoward conditions under which they were laboring.
  translation_ja: 慈善家の目の届かないところで、労働者階級は、さまざまな言葉で「一人が傷つけば、皆に関わる」と言うことを学んでいた。合言葉は、仲間としての連帯、犠牲を引き受けること、個人や職種の利益より労働者階級全体の利益を優先することだった。働く人々を、劣悪な労働条件から解き放つという決意が、彼らを動かしていた。
  translation_status: reviewed
- id: da-05-013
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '147'
    source_sequence: 174
    printed_page_end: '148'
  source_text: Compared to these watchwords, the old ones which this philanthropic employer had given his town were negative and inadequate. He had believed strongly in temperance and steadiness of individual effort, but had failed to apprehend the greater movement of combined abstinence and concerted action. With all his fostering, the president had not attained to a conception of social morality for his men and had imagined that virtue for them largely meant absence of vice.
  translation_ja: これらの合言葉にくらべて、慈善に熱心なこの雇い主が町に与えた昔の合言葉は、何かを控えることばかりで、十分ではなかった。節酒と個人が着実に努力することを固く信じていたが、皆で自分を抑え、足並みをそろえて行動する、もっと大きな動きを理解できなかった。あれだけ手をかけて育てながら、働く人たちの社会の道徳を思い描くところまで、社長は至らなかった。労働者にとって、徳は大方、悪いことをしないという意味だと考えていたのである。
  translation_status: reviewed
- id: da-05-014
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '148'
    source_sequence: 175
  source_text: When the labor movement finally stirred his town, or, to speak more fairly, when, in their distress and perplexity, his own employees appealed to an organized manifestation of this movement, they were quite sure that simply because they were workmen in distress they would not be deserted by it. This loyalty on the part of a widely ramified and well-organized union toward the workmen in a "non-union shop," who had contributed nothing to its cause, was certainly a manifestation of moral power.
  translation_ja: とうとう労働運動が町を揺り動かしたとき、もっと公平に言えば、困窮と戸惑いのなかで社長自身の従業員が、組織となって現れたこの運動に助けを求めたとき、自分たちが困っている労働者だというだけで見捨てられはしない、と彼らは固く信じた。広く枝を伸ばし、よく組織された組合が、その活動に何も力を貸したことのない、「組合のない職場」の人々に見せた忠実さは、確かに道徳の力の表れであった。
  translation_status: reviewed
- id: da-05-015
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '148'
    source_sequence: 176
    printed_page_end: '149'
  source_text: In none of his utterances or correspondence did the president for an instant recognize this touch of nobility, although one would imagine that he would gladly point out this bit of virtue, in what he must have considered the moral ruin about him. He stood throughout for the individual virtues, those which had distinguished the model workmen of his youth; those which had enabled him and so many of his contemporaries to rise in life, when "rising in life" was urged upon every promising boy as the goal of his efforts.
  translation_ja: 社長は発言でも手紙でも、この気高さを一瞬たりとも認めなかった。社長の周囲で道徳が崩れ去ったと本人には見えたはずなのに、そこにこれだけの徳があったと、喜んで指摘しそうなものだが、そうはしなかった。終始守ろうとしたのは個人の徳だった。自分が若い時代の模範的な労働者を際立たせ、「世に出ること」が将来を嘱望される少年一人ひとりに努力の目標として勧められたころ、社長自身や同時代の多くの人を世に出した徳である。
  translation_status: reviewed
- id: da-05-016
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '149'
    source_sequence: 177
  source_text: Of the code of social ethics he had caught absolutely nothing. The morals he had advocated in selecting and training his men did not fail them in the hour of confusion. They were self-controlled, and they themselves destroyed no property. They were sober and exhibited no drunkenness, even although obliged to hold their meetings in the saloon hall of a neighboring town. They repaid their employer in kind, but he had given them no rule for the life of association into which they were plunged.
  translation_ja: 社会倫理の規範は、まるで分かっていなかった。とはいえ、人を選び育てるとき説いた道徳は、混乱の最中にも、彼らの役に立った。自制を保ち、自分たちでは何一つ物を壊さなかった。近くの町の酒場にある広間で集会をせざるをえなかったにもかかわらず、酒は控え、酔った様子も見せなかった。雇い主が教えたとおりに報いたわけだ。しかし今や放り込まれた、人と協力して暮らすうえでの規範は、何も教わっていなかった。
  translation_status: reviewed
- id: da-05-017
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '149'
    source_sequence: 178
  source_text: The president of the company desired that his employees should possess the individual and family virtues, but did nothing to cherish in them the social virtues which express themselves in associated effort.
  translation_ja: 社長は従業員に、個人や家族の徳を身につけてほしかった。だが協力して取り組むときに現れる社会の徳を、彼らの内に育てるためには、何もしなかった。
  translation_status: reviewed
- id: da-05-018
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '149'
    source_sequence: 179
    printed_page_end: '150'
  source_text: Day after day, during that horrible time of suspense, when the wires constantly reported the same message, "the President of the Company holds that there is nothing to arbitrate," one was forced to feel that the ideal of one-man rule was being sustained in its baldest form. A demand from many parts of the country and from many people was being made for social adjustment, against which the commercial training and the individualistic point of view held its own successfully.
  translation_ja: いつどうなるか分からない、あの恐ろしい時期には、電信が毎日毎日、同じ知らせを伝え続けた。「会社の社長は、調停すべきことは何もないと考えている。」一人で支配するという理想が、このうえなく剥き出しの形で保たれていると、感じずにはいられなかった。国じゅうの多くの場所から、大勢の人々が、社会の関係を調整するよう求めていた。それに向かって、商売で身につけたやり方と個人主義の見方が、譲らず持ちこたえたのである。
  translation_status: reviewed
- id: da-05-019
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '150'
    source_sequence: 180
  source_text: The majority of the stockholders, not only of this company but of similar companies, and many other citizens, who had had the same commercial experience, shared and sustained this position. It was quite impossible for them to catch the other point of view. They not only felt themselves right from the commercial standpoint, but had gradually accustomed themselves also to the philanthropic standpoint, until they had come to consider their motives beyond reproach. Habit held them persistent in this view of the case through all changing conditions.
  translation_ja: この会社の株主の大半だけでなく、同様の会社の株主の大半も、また同じような商売の経験を持つ多くの市民も、この立場を共有し、支えた。反対の側からどう見えるかを理解することは、彼らにはまったく無理だった。商売の点から正しいと思うだけでなく、だんだん慈善家としての考え方にもなじみ、自分たちの動機には責められるところがないと考えるまでになった。習慣に縛られて、事情がいくら変わっても、こういう見方に固執した。
  translation_status: reviewed
- id: da-05-020
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '150'
    source_sequence: 181
    printed_page_end: '151'
  source_text: A wise man has said that "the consent of men and your own conscience are two wings given you whereby you may rise to God." It is so easy for the good and powerful to think that they can rise by following the dictates of conscience, by pursuing their own ideals, that they are prone to leave those ideals unconnected with the consent of their fellow-men. The president of the company thought out within his own mind a beautiful town. He had power with which to build this town, but he did not appeal to nor obtain the consent of the men who were living in it. The most unambitious reform, recognizing the necessity for this consent, makes for slow but sane and strenuous progress, while the most ambitious of social plans and experiments, ignoring this, is prone to failure.
  translation_ja: ある賢人は「人々の同意と自分の良心は、神のもとへのぼるために授かった二つの翼だ」と言った。善良で力のある人は、良心が命じたことに従い、自分の理想を追えば、高みにのぼれるとたやすく考える。そのため、人々の同意と切り離したまま、理想を実行に移しがちだ。会社の社長は自分ひとりの頭で、美しい町を思い描いた。その町を建てる力はあったが、住むことになる人々に同意を求めもしなければ、得もしなかった。ごく控えめな改革であっても、同意が必要だと認めれば、歩みは遅くとも、筋が通り、力強い前進ができる。どれほど大がかりな社会の計画や試みも、そのことを無視すれば、失敗しやすい。
  translation_status: reviewed
- id: da-05-021
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '151'
    source_sequence: 182
    printed_page_end: '153'
  source_text: The man who insists upon consent, who moves with the people, is bound to consult the "feasible right" as well as the absolute right. He is often obliged to attain only Mr. Lincoln's "best possible," and then has the sickening sense of compromise with his best convictions. He has to move along with those whom he leads toward a goal that neither he nor they see very clearly till they come to it. He has to discover what people really want, and then "provide the channels in which the growing moral force of their lives shall flow." What he does attain, however, is not the result of his individual striving, as a solitary mountain-climber beyond that of the valley multitude but it is sustained and upheld by the sentiments and aspirations of many others. Progress has been slower perpendicularly, but incomparably greater because lateral. He has not taught his contemporaries to climb mountains, but he has persuaded the villagers to move up a few feet higher; added to this, he has made secure his progress. A few months after the death of the promoter of this model town, a court decision made it obligatory upon the company to divest itself of the management of the town as involving a function beyond its corporate powers. The parks, flowers, and fountains of this far-famed industrial centre were dismantled, with scarcely a protest from the inhabitants themselves.
  translation_ja: 人々の同意にこだわり、人々と共に動く人は、絶対に正しいこととともに、「実行できる正しさ」も考慮しなければならない。リンカーンのいう「できるかぎりの最善」にとどまらざるをえず、そのときには、最も大切な信念を曲げたという、胸の悪くなる思いがある。導く人々と歩調を合わせ、着いてみるまでは自分も相手もよく見えていない目標へ進まなければならない。皆が本当は何を望むのかを見つけ、そのうえで「人々の暮らしのなかで育つ道徳の力に、流れる水路を用意する」のである。だがそうして達するところは、一人で登山し、谷にいる大勢を後に残すような、個人の力の結果ではない。ほかの多くの人の気持ちと希望が支えている。垂直に進む速さは遅くとも、横に広がる前進であるため、比べものにならないほど大きい。仲間に山の登り方を教えたのではない。村の人々に、一緒に数フィートだけ高いところへ移ろうと、説得したのである。しかも、前へ進んだ分は確かなものになった。この模範都市を推進した社長が亡くなって数か月後、裁判所は、町の管理は会社の権限を越えた役割だという判決を出し、会社は手放さざるをえなくなった。名をはせた工業の町の公園も花壇も噴水も取り払われたが、住民自身から抗議の声はほとんど上がらなかった。
  translation_status: reviewed
- id: da-05-022
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '153'
    source_sequence: 183
  source_text: The man who disassociates his ambition, however disinterested, from the coöperation of his fellows, always takes this risk of ultimate failure. He does not take advantage of the great conserver and guarantee of his own permanent success which associated efforts afford. Genuine experiments toward higher social conditions must have a more democratic faith and practice than those which underlie private venture. Public parks and improvements, intended for the common use, are after all only safe in the hands of the public itself; and associated effort toward social progress, although much more awkward and stumbling than that same effort managed by a capable individual, does yet enlist deeper forces and evoke higher social capacities.
  translation_ja: どれほど私心のない望みであっても、その望みを仲間の協力から切り離す人は、いつでも、結局失敗するこの危険を冒す。皆が共に取り組めば、本人の成功を長く保ち、保証する力となるのに、それを活用しないからだ。社会をよりよい状態にする本物の試みには、個人の事業の土台にあるものよりも、民主的な信念と実践がなくてはならない。皆のためにつくられた公園や公共の改良は、結局、皆自身の手にあって初めて安心できる。社会を前へ進めようと人々が協力すると、有能な一人が同じ取り組みを取り仕切るより、ずっと不器用でつまずきも多い。だが、それでもより深い力を呼び込み、より高い社会的な能力を引き出せるのである。
  translation_status: reviewed
- id: da-05-023
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '153'
    source_sequence: 184
    printed_page_end: '154'
  source_text: The successful business man who is also the philanthropist is in more than the usual danger of getting widely separated from his employees. The men already have the American veneration for wealth and successful business capacity, and, added to this, they are dazzled by his good works. The workmen have the same kindly impulses as he, but while they organize their charity into mutual benefit associations and distribute their money in small amounts in relief for the widows and insurance for the injured, the employer may build model towns, erect college buildings, which are tangible and enduring, and thereby display his goodness in concentrated form.
  translation_ja: 商売に成功し、しかも慈善家である人は、ふつうの雇い主以上に、従業員とのあいだが大きく隔たる危険がある。働く人々はもともと、アメリカ人らしく富と商才に敬意を抱く。そればかりか、その人の善行に目を奪われる。労働者にも同じ優しい気持ちはあるのだが、その慈善は、互助会を組織し、少しずつ金を分け、寡婦の救済や負傷者のための保険にあてる形を取る。一方、雇い主は模範都市を建て、大学の建物をつくることができる。形があり、長く残るので、自分の善意を一か所に集めた形で、見せることができるのだ。
  translation_status: reviewed
- id: da-05-024
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '154'
    source_sequence: 185
    printed_page_end: '155'
  source_text: By the very exigencies of business demands, the employer is too often cut off from the social ethics developing in regard to our larger social relationships, and from the great moral life springing from our common experiences. This is sure to happen when he is good "to" people rather than "with" them, when he allows himself to decide what is best for them instead of consulting them. He thus misses the rectifying influence of that fellowship which is so big that it leaves no room for sensitiveness or gratitude. Without this fellowship we may never know how great the divergence between ourselves and others may become, nor how cruel the misunderstandings.
  translation_ja: 商売に差し迫った必要があるため、雇い主は、より広い社会の人間関係をめぐって育ちつつある社会倫理から、また、私たちの共通の経験から湧く、大きな道徳の営みから、しばしば切り離されてしまう。人々と「一緒に」善いことをする代わりに、人々「に」善くしてやるとき、何が最善かを相手に尋ねず、自分で決めてよいと思うとき、必ずそうなる。そうなれば、気を遣うことや恩に着ることなど、入る余地もないほど大きな仲間意識が、自分を正してくれる機会を失う。そうした仲間意識がなければ、自分と人々のずれがどれほど広がりうるかも、誤解がどれほどむごいものになりうるかも、私たちは決して分からないかもしれない。
  translation_status: reviewed
- id: da-05-025
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '155'
    source_sequence: 186
    printed_page_end: '156'
  source_text: During a recent strike of the employees of a large factory in Ohio, the president of the company expressed himself as bitterly disappointed by the results of his many kindnesses, and evidently considered the employees utterly unappreciative. His state of mind was the result of the fallacy of ministering to social needs from an individual impulse and expecting a socialized return of gratitude and loyalty. If the lunch-room was necessary, it was a necessity in order that the employees might have better food, and, when they had received the better food, the legitimate aim of the lunch-room was met. If baths were desirable, and the fifteen minutes of calisthenic exercise given the women in the middle of each half day brought a needed rest and change to their muscles, then the increased cleanliness and the increased bodily comfort of so many people should of themselves have justified the experiment.
  translation_ja: オハイオ州のある大工場で最近ストライキが起きたとき、会社の社長は、自分が何度も親切にしてきたのに、この結果となってほとほと失望したと表明した。従業員は感謝をまったく知らないと、明らかに考えていた。そういう心境になったのは、個人の衝動から社会の求めを満たし、社会全体から感謝と忠誠が返ってくると期待する、考え違いのせいだった。昼食の部屋が必要だったのは、従業員がよい食事を取れるようにするためで、よい食事が得られれば、その部屋の正当な目的は果たされた。入浴設備が望ましいもので、一日の前半と後半のそれぞれ途中に設けた十五分の体操が、女性たちの筋肉を休ませ、ふだんと違う動きをさせる機会をもたらしたなら、それだけ多くの人がより清潔で、身体の具合もよくなったということだけで、試みに十分意味があったはずだ。
  translation_status: reviewed
- id: da-05-026
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '156'
    source_sequence: 187
  source_text: To demand, as a further result, that there should be no strikes in the factory, no revolt against the will of the employer because the employees were filled with loyalty as the result of the kindness, was of course to take the experiment from an individual basis to a social one.
  translation_ja: それに加えて、あれだけ親切にして従業員は忠誠心でいっぱいになったのだから、工場でストライキも、雇い主の意志に逆らうこともあってはならない、と求める。それはもちろん、個人として始めた試みに、社会の関係にまで及ぶ結果を求めることだった。
  translation_status: reviewed
- id: da-05-027
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '156'
    source_sequence: 188
    printed_page_end: '157'
  source_text: Large mining companies and manufacturing concerns are constantly appealing to their stockholders for funds, or for permission to take a percentage of the profits, in order that the money may be used for educational and social schemes designed for the benefit of the employees. The promoters of these schemes use as an argument and as an appeal, that better relations will be thus established, that strikes will be prevented, and that in the end the money returned to the stockholders will be increased. However praiseworthy this appeal may be in motive, it involves a distinct confusion of issues, and in theory deserves the failure it so often meets with in practice. In the clash which follows a strike, the employees are accused of an ingratitude, when there was no legitimate reason to expect gratitude; and useless bitterness, which has really a factitious basis, may be developed on both sides.
  translation_ja: 大きな鉱山会社や製造会社は、従業員に利益をもたらす教育や社会の計画に使うため、資金を出してほしい、あるいは利益の何パーセントかを回してよいことにしてほしいと、株主に絶えず呼びかけている。計画を進める側は、そうすれば関係がよくなり、ストライキを防ぎ、最後には株主の受け取る金が増えると、主張して訴える。その動機はどれほど立派であっても、はっきりと問題を取り違えている。実際しばしば失敗するが、理屈から言っても失敗して当然だ。ストライキのあとに衝突が起こると、感謝を期待する正当な理由は初めからなかったのに、従業員は恩知らずだと責められる。もとをただせば人為的な行き違いなのに、無益な恨みが、両方に育つことがある。
  translation_status: reviewed
- id: da-05-028
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '157'
    source_sequence: 189
  source_text: Indeed, unless the relation becomes a democratic one, the chances of misunderstanding are increased, when to the relation of employer and employees is added the relation of benefactor to beneficiaries, in so far as there is still another opportunity for acting upon the individual code of ethics.
  translation_ja: 実際、両者の関係が民主的にならないかぎり、雇い主と従業員の関係に、恩恵を与える者と受ける者との関係が加われば、誤解のおそれはますます強くなる。個人の倫理の規範で行動する機会が、もう一つ増えるからだ。
  translation_status: reviewed
- id: da-05-029
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '157'
    source_sequence: 190
    printed_page_end: '158'
  source_text: There is no doubt that these efforts are to be commended, not only from the standpoint of their social value but because they have a marked industrial significance. Failing, as they do, however, to touch the question of wages and hours, which are almost invariably the points of trades-union effort, the employers confuse the mind of the public when they urge the amelioration of conditions and the kindly relation existing between them and their men as a reason for the discontinuance of strikes and other trades-union tactics. The men have individually accepted the kindness of the employers as it was individually offered, but quite as the latter urges his inability to increase wages unless he has the coöperation of his competitors, so the men state that they are bound to the trades-union struggle for an increase in wages because it can only be undertaken by combinations of labor.
  translation_ja: こうした取り組みが、社会にとって価値があるという点でも、働く場に明らかな意味を持つ点でも、認められてよいことは疑いない。だが労働組合が取り組むのはほとんどいつでも賃金と労働時間であり、雇い主の取り組みはそれに手をつけない。それでも雇い主は、労働環境が改善され、自分たちと労働者が好意で結ばれていることを、ストライキやほかの組合の戦術をやめる理由として挙げて、世間を混乱させる。労働者は、一人ひとりに向けられた雇い主の親切を、一人ひとりで受け取ってきた。だが雇い主が、競争相手の協力がなければ賃金を上げられないと主張するのと同じように、労働者も、賃上げを求める組合の闘いに加わらなくてはならないと主張する。それは労働者の団結によってしか取り組めないからである。
  translation_status: reviewed
- id: da-05-030
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '158'
    source_sequence: 191
  source_text: Even the much more democratic effort to divide a proportion of the profits at the end of the year among the employees, upon the basis of their wages and efficiency, is also exposed to a weakness, from the fact that the employing side has the power of determining to whom the benefit shall accrue.
  translation_ja: 年末に利益の一部を、賃金と仕事ぶりに応じて従業員に分ける、はるかに民主的な取り組みでさえ、一つの弱点がある。誰がその恩恵にあずかるかを、雇う側が決められるのである。
  translation_status: reviewed
- id: da-05-031
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '158'
    source_sequence: 192
    printed_page_end: '160'
  source_text: Both individual acts of self-defence on the part of the wage earner and individual acts of benevolence on the part of the employer are most useful as they establish standards to which the average worker and employer may in time be legally compelled to conform. Progress must always come through the individual who varies from the type and has sufficient energy to express this variation. He first holds a higher conception than that held by the mass of his fellows of what is righteous under given conditions, and expresses this conviction in conduct, in many instances formulating a certain scruple which the others share, but have not yet defined even to themselves. Progress, however, is not secure until the mass has conformed to this new righteousness. This is equally true in regard to any advance made in the standard of living on the part of the trades-unionists or in the improved conditions of industry on the part of reforming employers. The mistake lies, not in overpraising the advance thus inaugurated by individual initiative, but in regarding the achievement as complete in a social sense when it is still in the realm of individual action. No sane manufacturer regards his factory as the centre of the industrial system. He knows very well that the cost of material, wages, and selling prices are determined by industrial conditions completely beyond his control. Yet the same man may quite calmly regard himself and his own private principles as merely self-regarding, and expect results from casual philanthropy which can only be accomplished through those common rules of life and labor established by the community for the common good.
  translation_ja: 賃金で暮らす者が個人として自らを守る行いも、雇い主が個人として善意からする行いも、大いに役立つ。ふつうの労働者と雇い主が、いずれは法律で守らされるかもしれない基準をつくるからだ。進歩はいつも、典型から外れ、その違いを表せるほど活力のある個人を通じて起こらなくてはならない。まずその人は、ある条件のもとで何が正しいかについて、大多数の仲間より高い考えを持ち、確信を行いで表す。仲間もいくらか良心に引っかかるものを感じながら、自分自身にさえはっきりさせていないとき、それを言葉にすることも多い。しかし大勢がその新しい正しさに従うまでは、進歩はまだ確実でない。組合にいる労働者の生活水準が上がるときも、改革を目指す雇い主が労働条件をよくするときも、同じである。間違いは、個人の働きかけが始めた進歩を褒めすぎることではない。まだ個人が行動した段階にあるのに、社会にとっても進歩は成し遂げられたと考えることにある。分別のある製造業者なら、自分の工場が産業全体の中心だとは考えない。原材料の費用も賃金も売値も、自分がまったく左右できない産業の条件で決まると、よく知っている。ところがこの同じ人が、平然と、自分自身や自分が個人的に守る原則は自分のことだけに関わると考え、共同体が皆の利益のために定める、生活と労働に共通の規則によってしか達成できないことを、折々の慈善に期待したりする。
  translation_status: reviewed
- id: da-05-032
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '160'
    source_sequence: 193
    printed_page_end: '161'
  source_text: Outside of and surrounding these smaller and most significant efforts are the larger and irresistible movements operating toward combination. This movement must tend to decide upon social matters from the social standpoint. Until then it is difficult to keep our minds free from a confusion of issues. Such a confusion occurs when the gift of a large sum to the community for a public and philanthropic purpose, throws a certain glamour over all the earlier acts of a man, and makes it difficult for the community to see possible wrongs committed against it, in the accumulation of wealth so beneficently used. It is possible also that the resolve to be thus generous unconsciously influences the man himself in his methods of accumulation. He keeps to a certain individual rectitude, meaning to make an individual restitution by the old paths of generosity and kindness, whereas if he had in view social restitution on the newer lines of justice and opportunity, he would throughout his course doubtless be watchful of his industrial relationships and his social virtues.
  translation_ja: こうした小さいがひどく大切な取り組みの外側には、人々を結びつける、より大きく押しとどめようのない動きが広がっている。この動きは、社会の事柄を社会の立場から決める方向に向かわざるをえない。それまでは、違う問題を混同せずにいるのは難しい。たとえば公共の慈善事業のため、ある人が大金を共同体に寄付する。その光が、以前のその人の行いすべてを美しく照らし、これほど善いことに使われる富をためるなかで、共同体が不当な扱いを受けたかもしれないことが、共同体自身にも見えなくなる。問題の混同は、こういうふうに起こる。このように気前よく与えようと決めたことが、知らぬ間に、本人の富のため方に影響することもありうる。見返りに、気前のよさや親切という昔ながらの道で、自分一人の力で償おうと考えながら、一定の個人としての正しさを守る。だが正義や機会を重んじる新しい道を取り、社会そのものに対して償うことを考えていたなら、最初から最後まで、間違いなく、仕事の人間関係と社会に対する徳を、よく心にかけただろう。
  translation_status: reviewed
- id: da-05-033
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '161'
    source_sequence: 194
    printed_page_end: '162'
  source_text: 'The danger of professionally attaining to the power of the righteous man, of yielding to the ambition "for doing good" on a large scale, compared to which the ambition for politics, learning, or wealth, are vulgar and commonplace, ramifies through our modern life; and those most easily beset by this temptation are precisely the men best situated to experiment on the larger social lines, because they so easily dramatize their acts and lead public opinion. Very often, too, they have in their hands the preservation and advancement of large vested interests, and often see clearly and truly that they are better able to administer the affairs of the community than the community itself: sometimes they see that if they do not administer them sharply and quickly, as only an individual can, certain interests of theirs dependent upon the community will go to ruin.'
  translation_ja: 正しい人間に備わる力を、いわば職業のように手に入れようとし、大規模に「善をなす」という野心に負ける。政治、学問、富を求める野心も、それに比べれば俗っぽく平凡に見える。この危険は、現代の生活のあちこちに枝を伸ばしている。そして最もたやすく誘惑されるのは、その行いが人目を引きやすく、世論を動かせるため、もっと広い社会の規模で試みるのに、誰よりふさわしい立場にある人々なのだ。また多くの場合、大きな既得権益を守り伸ばすことも彼らの手にあり、共同体の仕事を、共同体自身より自分のほうがうまく取り仕切れると、正しくはっきり見抜いている。ときには、一人でなければできないほど鋭く素早く取り仕切らなければ、共同体に頼って成り立つ自分の利益の一部が失われると、分かることもある。
  translation_status: reviewed
- id: da-05-034
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '162'
    source_sequence: 195
    printed_page_end: '163'
  source_text: The model employer first considered, provided a large sum in his will with which to build and equip a polytechnic school, which will doubtless be of great public value. This again shows the advantage of individual management, in the spending as well as in the accumulating of wealth, but this school will attain its highest good, in so far as it incites the ambition to provide other schools from public funds. The town of Zurich possesses a magnificent polytechnic institute, secured by the vote of the entire people and supported from public taxes. Every man who voted for it is interested that his child should enjoy its benefits, and, of course, the voluntary attendance must be larger than in a school accepted as a gift to the community.
  translation_ja: 初めに取り上げた模範的な雇い主は、工科学校を建て、設備を整えるため、遺言に大金を残した。それは疑いなく、公共に大いに役立つ。このことからも、財産を貯めるときだけでなく、使うときにも、個人で取り仕切ることには利点があると分かる。だが、この学校が最も大きな価値を持つのは、公の資金でほかの学校もつくろうという意欲をかき立てるかぎりにおいてである。チューリヒには、住民全体の投票で設けられ、公の税金で支えられる、見事な工科大学がある。賛成票を投じた一人ひとりは、自分の子にもその恩恵が及んでほしいと思っている。共同体への贈り物として受け取った学校より、自分から通う者が多いのは、当然である。
  translation_status: reviewed
- id: da-05-035
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '163'
    source_sequence: 196
  source_text: In the educational efforts of model employers, as in other attempts toward social amelioration, one man with the best of intentions is trying to do what the entire body of employees should have undertaken to do for themselves. The result of his efforts will only attain its highest value as it serves as an incentive to procure other results by the community as well as for the community.
  translation_ja: 模範的な雇い主が教育に力を入れるときも、ほかの社会改善の試みと同じように、一人の人間が、申し分のない善意をもって、従業員全体が自ら取り組むべきだったことをしようとしている。その努力の成果が最も大きな価値を持つのは、共同体のためだけでなく、共同体自身の力でほかの成果も得ようという励みになるときだけである。
  translation_status: reviewed
- id: da-05-036
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '163'
    source_sequence: 197
    printed_page_end: '164'
  source_text: There are doubtless many things which the public would never demand unless they were first supplied by individual initiative, both because the public lacks the imagination, and also the power of formulating their wants. Thus philanthropic effort supplies kindergartens, until they become so established in the popular affections that they are incorporated in the public school system. Churches and missions establish reading rooms, until at last the public library system dots the city with branch reading rooms and libraries. For this willingness to take risks for the sake of an ideal, for those experiments which must be undertaken with vigor and boldness in order to secure didactic value in failure as well as in success, society must depend upon the individual possessed with money, and also distinguished by earnest and unselfish purpose. Such experiments enable the nation to use the Referendum method in its public affairs. Each social experiment is thus tested by a few people, given wide publicity, that it may be observed and discussed by the bulk of the citizens before the public prudently makes up its mind whether or not it is wise to incorporate it into the functions of government. If the decision is in its favor and it is so incorporated, it can then be carried on with confidence and enthusiasm.
  translation_ja: まず個人がみずから進んで用意しなければ、世間が決して要求しなかったことは、疑いなく多い。世間には、それがない状態から思い描くだけの想像力も、何が欲しいかを言葉にする力も足りないからだ。こうして慈善の取り組みは、人々の愛情に深く根づき、公立学校の仕組みに組み入れられるまで、幼稚園を用意する。教会や伝道団体は閲覧室を開き、やがて公共図書館が、市内のあちこちに分館の閲覧室や図書館を置く。理想のために危険を引き受ける人、失敗しても成功しても教訓が得られるように、精力と大胆さをもって試みを行う人を、社会は必要とする。これを頼めるのは、資金を持ち、そのうえ真摯で私心のない目的で際立つ個人である。こうした試みによって、国は公共の事柄について、国民投票に似た方法を用いることができる。社会をよくする試みは、まず少人数で実行され、広く世間に知らされる。政府の役割に加えるのが賢明かどうか、世間が慎重に決める前に、市民の大半が見て、議論できるようにするのだ。賛成の決定が出て役割に組み込まれれば、確信と熱意をもってそれを運営できる。
  translation_status: reviewed
- id: da-05-037
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '164'
    source_sequence: 198
    printed_page_end: '165'
  source_text: But experience has shown that we can only depend upon successful men for a certain type of experiment in the line of industrial amelioration and social advancement. The list of those who found churches, educational institutions, libraries, and art galleries, is very long, as is again the list of those contributing to model dwellings, recreation halls, and athletic fields. At the present moment factory employers are doing much to promote "industrial betterment" in the way of sanitary surroundings, opportunities for bathing, lunch rooms provided with cheap and wholesome food, club rooms, and guild halls. But there is a line of social experiment involving social righteousness in its most advanced form, in which the number of employers and the "favored class" are so few that it is plain society cannot count upon them for continuous and valuable help. This lack is in the line of factory legislation and that sort of social advance implied in shorter hours and the regulation of wages; in short, all that organization and activity that is involved in such a maintenance and increase of wages as would prevent the lowering of the standard of life.
  translation_ja: しかし経験から分かったのは、産業の改善と社会の前進に向けた試みのうち、ある種類しか、成功した人々には頼めないことだ。教会や教育機関、図書館や美術館を設けた人の一覧はたいへん長く、模範住宅、娯楽施設、運動場のために力を貸した人の一覧もまたそうである。今も、工場の雇い主は、「職場環境の改善」のために多くのことをしている。周囲を衛生的にし、入浴の場所を設け、安くて身体によい食事を出す食堂や、クラブの部屋、組合会館などを用意する。しかし、最も進んだ形で社会の正義を問う分野になると、試みに加わる雇い主や「恵まれた階級」はあまりに少なく、社会がそこから続けて有益な助けを得ようと当てにできないことは、明らかだ。助けが足りないのは、工場の仕事を律する法律、また労働時間を短くし、賃金を規制するような社会の前進である。つまり、生活の水準が下がらないよう、賃金を維持し引き上げるために必要な組織と活動、そのすべてである。
  translation_status: reviewed
- id: da-05-038
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '165'
    source_sequence: 199
    printed_page_end: '166'
  source_text: A large body of people feel keenly that the present industrial system is in a state of profound disorder, and that there is no guarantee that the pursuit of individual ethics will ever right it. They claim that relief can only come through deliberate corporate effort inspired by social ideas and guided by the study of economic laws, and that the present industrial system thwarts our ethical demands, not only for social righteousness but for social order. Because they believe that each advance in ethics must be made fast by a corresponding advance in politics and legal enactment, they insist upon the right of state regulation and control. While many people representing all classes in a community would assent to this as to a general proposition, and would even admit it as a certain moral obligation, legislative enactments designed to control industrial conditions have largely been secured through the efforts of a few citizens, mostly those who constantly see the harsh conditions of labor and who are incited to activity by their sympathies as well as their convictions.
  translation_ja: 今日の産業の仕組みは深い混乱に陥っており、個人の倫理を守り続ければ立て直せるという保証はないと、痛感している人々が大勢いる。救いがあるとすれば、社会全体を考え、経済の法則を調べたうえで、人々がよく考えて共同で努力することだけだと説く。そして私たちが道徳上求めるもののうち、社会の正義だけでなく、社会の秩序も、現在の産業の仕組みによって妨げられると言う。この人たちは、倫理が一歩進むたび、政治と立法もそれに応じて進み、その成果を確かなものにしなくてはならないと信じるので、国家に規制し、監督する権限があると主張する。共同体のあらゆる階級の多くの人が、原則にはうなずき、ある程度の道徳的な義務だと認めさえするだろう。だが、働く条件を規制する法律の多くは、少数の市民の努力でようやく生まれた。厳しい条件をいつも目にし、確信だけでなく共感にも促されて行動する市民が、その大部分を占める。
  translation_status: reviewed
- id: da-05-039
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '167'
    source_sequence: 200
    printed_page_end: '168'
  source_text: This may be illustrated by the series of legal enactments regulating the occupations in which children may be allowed to work, also the laws in regard to the hours of labor permitted in those occupations, and the minimum age below which children may not be employed. The first child labor laws were enacted in England through the efforts of those members of parliament whose hearts were wrung by the condition of the little parish apprentices bound out to the early textile manufacturers of the north; and through the long years required to build up the code of child labor legislation which England now possesses, knowledge of the conditions has always preceded effective legislation. The efforts of that small number in every community who believe in legislative control have always been reënforced by the efforts of trades-unionists rather than by the efforts of employers. Partly because the employment of workingmen in the factories brings them in contact with the children who tend to lower wages and demoralize their trades, and partly because workingmen have no money nor time to spend in alleviating philanthropy, and must perforce seize upon agitation and legal enactment as the only channel of redress which is open to them.
  translation_ja: たとえば子どもが就いてよい仕事を定め、それらの仕事で許される労働時間や、それより年少の子は雇ってはならないという最低年齢を定めた、一連の法律がある。児童労働に関する最初の法律がイングランドで制定されたのは、北部の初期の繊維業者のもとに送り出された教区の幼い徒弟たちの境遇に胸を痛めた、議会の議員たちの努力によるものだった。今日イングランドが持つ児童労働を律する法体系を築くまでの長い年月、実効性がある立法に先立っては、いつも実情が知られていた。どの共同体にも、法律による規制を信じる少数の人がいる。その取り組みをいつも後押ししてきたのは、どちらかと言えば雇い主でなく、労働組合に属する人たちだった。一つには、工場で働けば、賃金を引き下げ、職場の規律を崩すことになりがちな子どもたちと接するからだ。もう一つには、苦境を和らげる慈善に使う金も時間もなく、運動を起こし法を制定することが、改善を求められる唯一の道だからである。
  translation_status: reviewed
- id: da-05-040
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '168'
    source_sequence: 201
    printed_page_end: '169'
  source_text: We may illustrate by imagining a row of people seated in a moving street-car, into which darts a boy of eight, calling out the details of the last murder, in the hope of selling an evening newspaper. A comfortable looking man buys a paper from him with no sense of moral shock; he may even be a trifle complacent that he has helped along the little fellow, who is making his way in the world. The philanthropic lady sitting next to him may perhaps reflect that it is a pity that such a bright boy is not in school. She may make up her mind in a moment of compunction to redouble her efforts for various newsboys' schools and homes, that this poor child may have better teaching, and perhaps a chance at manual training. She probably is convinced that he alone, by his unaided efforts, is supporting a widowed mother, and her heart is moved to do all she can for him. Next to her sits a workingman trained in trades-union methods. He knows that the boy's natural development is arrested, and that the abnormal activity of his body and mind uses up the force which should go into growth; moreover, that this premature use of his powers has but a momentary and specious value. He is forced to these conclusions because he has seen many a man, entering the factory at eighteen and twenty, so worn out by premature work that he was "laid on the shelf" within ten or fifteen years. He knows very well that he can do nothing in the way of ameliorating the lot of this particular boy; that his only possible chance is to agitate for proper child-labor laws; to regulate, and if possible prohibit, street-vending by children, in order that the child of the poorest may have his school time secured to him, and may have at least his short chance for growth.
  translation_ja: 動いている路面電車に一列に座った人たちを、思い浮かべよう。そこに八歳の少年が飛び込んできて、夕刊を売ろうと、最近起きた殺人事件の細部を大声で告げる。暮らしにゆとりのありそうな男が、それを少しも道徳に反すると思わず、一部買う。「世に出る」ためがんばっている小さな少年に力を貸したことに、いくらか満足さえするかもしれない。隣に座る慈善好きの女性は、こんな利発な子が学校にいないなんて惜しい、と思うかもしれない。ふと良心が痛み、この気の毒な子がもっとよい教育を受け、手作業を学ぶ機会も得られるようにと、新聞売りの少年のための学校や寮を支える努力を倍にしようと決めるかもしれない。きっとこの子は、夫を亡くした母を、誰の力も借りず一人で養っているに違いないと考え、何でもできることをしたいと、心を動かされる。その隣には労働組合のやり方に通じた労働者が座る。この男は、少年の自然な成長が止められ、心身を度を越して働かせることで、育つための力が使い尽くされるのを知っている。しかも、これほど早くから力を使うことにあるのは、その場限りの、見かけの価値だけだと分かっている。そう考えざるをえないのは、十八や二十で工場に入った多くの人が、早くから働いて疲れ果て、十年か十五年で「用済み」にされるのを見てきたからだ。この少年一人の暮らしをよくするために、自分には何もできないことも承知している。できるのは、適切な児童労働の法律を求めて運動することだけだ。子どもが通りで物を売るのを規制し、できれば禁止する。そうすれば、どれほど貧しい家の子どもにも学校に通う時間が確保され、せめて短いあいだでも、育つ機会が得られる。
  translation_status: reviewed
- id: da-05-041
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '170'
    source_sequence: 202
  source_text: These three people, sitting in the street car, are all honest and upright, and recognize a certain duty toward the forlorn children of the community. The self-made man is encouraging one boy's own efforts; the philanthropic lady is helping on a few boys; the workingman alone is obliged to include all the boys of his class. Workingmen, because of their feebleness in all but numbers, have been forced to appeal to the state, in order to secure protection for themselves and for their children. They cannot all rise out of their class, as the occasionally successful man has done; some of them must be left to do the work in the factories and mines, and they have no money to spend in philanthropy.
  translation_ja: 路面電車に座るこの三人は、誰もが誠実で正直であり、共同体の寄る辺のない子どもたちへの、いくらかの務めを認めている。自力で身を立てた男は、一人の少年の努力を励ます。慈善に熱心な女性は、何人かの少年を助けようとする。労働者だけが、自分と同じ階層の少年をすべてそのなかに入れなくてはならない。働く人々は、数を除いては力がないため、自分たちと子どもの保護を確保するには、国家に訴えるほかなかった。ときおり成功する者のように、全員が今の階層から抜け出せるわけではない。工場と鉱山で仕事をする者は、どうしても残る。そして慈善に出せる金は、何もないのである。
  translation_status: reviewed
- id: da-05-042
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '170'
    source_sequence: 203
    printed_page_end: '171'
  source_text: Both public agitation and a social appeal to the conscience of the community is necessary in order to secure help from the state, and, curiously enough, child-labor laws once enacted and enforced are a matter of great pride, and even come to be regarded as a register of the community's humanity and enlightenment. If the method of public agitation could find quiet and orderly expression in legislative enactment, and if labor measures could be submitted to the examination and judgment of the whole without a sense of division or of warfare, we should have the ideal development of the democratic state.
  translation_ja: 国家の助けを得るには、公に運動を起こすことと、社会全体で共同体の良心に訴えることが、どちらも必要である。興味深いことに、児童労働の法律はいったんつくられ、施行されると、大きな誇りとなり、共同体の人道と啓蒙がどれほど進んだかを示す記録とさえ、見なされるようになる。公に運動を起こすという方法が、静かに秩序立って立法に結びつき、労働に関する政策を、分裂や戦争のような気分を抱かずに、皆で考え、判断できれば、民主国家は理想的な発達を遂げるだろう。
  translation_status: reviewed
- id: da-05-043
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '171'
    source_sequence: 204
  source_text: But we judge labor organizations as we do other living institutions, not by their declaration of principles, which we seldom read, but by their blundering efforts to apply their principles to actual conditions, and by the oft-time failure of their representatives, when the individual finds himself too weak to become the organ of corporate action.
  translation_ja: だが私たちが労働組合を評価するのは、ほかの生きた制度と同じように、めったに読みもしない原則宣言によってではない。現実の条件に自分たちの原則をあてはめようとする、不器用な試みを見て判断する。一人では集団の行動を担えるほど強くないと知った代表者が、しばしば失敗するのを見て判断する。
  translation_status: reviewed
- id: da-05-044
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '171'
    source_sequence: 205
    printed_page_end: '172'
  source_text: The very blunders and lack of organization too often characterizing a union, in marked contrast to the orderly management of a factory, often confuse us as to the real issues involved, and we find it hard to trust uncouth and unruly manifestations of social effort. The situation is made even more complicated by the fact that those who are formulating a code of associated action so often break through the established code of law and order. As society has a right to demand of the reforming individual that he be sternly held to his personal and domestic claims, so it has a right to insist that labor organizations shall keep to the hardly won standards of public law and order; and the community performs but its plain duty when it registers its protest every time law and order are subverted, even in the interest of the so-called social effort. Yet in moments of industrial stress and strain the community is confronted by a moral perplexity which may arise from the mere fact that the good of yesterday is opposed to the good of today, and that which may appear as a choice between virtue and vice is really but a choice between virtue and virtue. In the disorder and confusion sometimes incident to growth and progress, the community may be unable to see anything but the unlovely struggle itself.
  translation_ja: 組合にはありがちな失敗や組織力のなさが、工場の整然とした経営とあまりにも対照的なので、本当は何が問題なのかが、しばしば私たちには見えなくなる。無骨でまとまりがない形で現れる社会的な取り組みは、信用しづらい。共同で行動するための規範をつくろうとしている人々が、法と秩序の確立した規範をしばしば破ることも、事態を複雑にする。改革に取り組む個人でも、個人の務めや家族への務めを厳しく守らなくてはならないと、社会には求める権利がある。それと同じように、労働組合にも、苦労して手に入れた公共の法と秩序を守るよう、言う権利がある。たとえいわゆる社会のための取り組みであっても、法と秩序が覆されるたび、共同体が異議を申し立てるのは、当たり前の務めにすぎない。だが労働の場で圧力が高まり、緊張しているとき、共同体は道徳上の難しい問題に直面する。その理由はただ、昨日の善が今日の善と対立しており、徳と悪徳のどちらかを選ぶように見えて、実際は、二つの徳のどちらかを選ぶからかもしれない。成長や前進につきものの混乱と無秩序のなかでは、共同体は、目も当てられない争いそのものしか見られないことがある。
  translation_status: reviewed
- id: da-05-045
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:
  - source_id: pg15487
    precision: page
    printed_page: '173'
    source_sequence: 206
    printed_page_end: '174'
  source_text: 'The writer recalls a conversation between two workingmen who were leaving a lecture on "Organic Evolution." The first was much puzzled, and anxiously inquired of the second "if evolution could mean that one animal turned into another." The challenged workman stopped in the rear of the hall, put his foot upon a chair, and expounded what he thought evolution did mean; and this, so nearly as the conversation can be recalled, is what he said: "You see a lot of fishes are living in a stream, which overflows in the spring and strands some of them upon the bank. The weak ones die up there, but others make a big effort to get back into the water. They dig their fins into the sand, breathe as much air as they can with their gills, and have a terrible time. But after a while their fins turn into legs and their gills into lungs, and they have become frogs. Of course they are further along than the sleek, comfortable fishes who sail up and down the stream waving their tails and despising the poor damaged things thrashing around on the bank. He—the lecturer—did not say anything about men, but it is easy enough to think of us poor devils on the dry bank, struggling without enough to live on, while the comfortable fellows sail along in the water with all they want and despise us because we thrash about." His listener did not reply, and was evidently dissatisfied both with the explanation and the application. Doubtless the illustration was bungling in more than its setting forth, but the story is suggestive.'
  translation_ja: 「生物の進化」についての講演を聞いて帰ろうとする、二人の労働者の会話を私は思い出す。一人目はすっかり分からなくなり、「進化って、一つの動物が別の動物に変わるということなのか」と、もう一人に心配そうに聞いた。そう聞かれた男は、広間の後ろで立ち止まり、椅子に片足をかけて、進化とはこういうことだと思う、と説明した。思い出せるかぎりでは、こういう話だった。「ほら、川にたくさん魚が住んでいるだろう。春に水があふれると、何匹かは岸に取り残される。弱いやつはそこで死ぬが、何匹かは、水に戻ろうと懸命にがんばる。ひれを砂に食い込ませて、えらで吸えるだけ空気を吸って、ひどい目に遭う。だけど、しばらくすると、ひれが脚に、えらが肺に変わって、カエルになっている。川を行ったり来たり、尾を振って気楽に泳いで、岸でもがく傷だらけのやつらを見下している、つやつやした魚たちより、もちろん一歩先へ進んだわけだ。あの先生は人間の話はしなかった。けど、水のない岸辺で食うものも足りずもがいている、かわいそうなやつらをおれたちだと思えば、すぐ分かる。楽なやつらは、水のなかを欲しいものは何でも持って泳ぎ、おれたちがもがくからといって見下しているんだ。」聞いた男は返事をせず、説明にも、労働者に当てはめたことにも、納得した様子はなかった。このたとえは語り方ばかりか、話の中身にもずいぶん無理があるにせよ、考えさせるものはある。
  translation_status: reviewed
- id: da-05-046
  section_id: ch-05
  kind: paragraph
  origin: source
  source_languages:
  - en
  source_locations:

    {
      "id": "bentham-ch01-p002",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n146/mode/1up",
          "source_sequence": 160,
          "printed_page": "131",
          "printed_page_end": "133"
        }
      ],
      "source_text": "II. “The only true and natural foundations of society” (says our Author) “are the wants and the fears of individuals. Not that we can believe, with some theoretical writers, that there ever was a time when there was no such thing as society; and that, from the impulse of reason, and through a sense of their wants and weaknesses, individuals met together in a large plain, entered into an original contract, and chose the tallest man present to be their governor. This notion of an actually existing unconnected state of nature, is too wild to be seriously admitted; and besides, it is plainly contradictory to the revealed accounts of the primitive origin of mankind, and their preservation two thousand years afterwards; both which were effected by the means of single families. These formed the first society, among themselves; which every day extended its limits, and when it grew too large to subsist with convenience in that pastoral state, wherein the patriarchs appear to have lived, it necessarily subdivided itself by various migrations into more. Afterwards, as agriculture increased, which employs and can maintain a much greater number of hands, migrations became less frequent; and various tribes which had formerly separated, re-united again; sometimes by compulsion and conquest, sometimes by accident, and sometimes perhaps by compact. But though society had not its formal beginning from any convention of individuals, actuated by their wants and their fears; yet it is the sense of their weakness and imperfection that keeps mankind together; that demonstrates the necessity of this union; and that therefore is the solid and natural foundation, as well as the cement of society: And this is what we mean by the original contract of society; which, though perhaps in no instance it has ever been formally expressed at the first institution of a state, yet in nature and reason must always be understood and implied, in the very act of associating together: namely, that the whole should protect all its parts, and that every part should pay obedience to the will of the whole; or, in other words, that the community should guard the rights of each individual member, and that (in return for this protection) each individual should submit to the laws of the community; without which submission of all it was impossible that protection could be certainly extended to any.”",
      "translation_ja": "第二節　「社会の真実で自然な基礎となるものは、ほかにはない」と著者は言う。「一人ひとりの必要と恐れである。だからといって、ある種の理論家に同調し、社会というものが一切なかった時代があり、理性に促され、必要と弱さを自覚した人々が広い野原に集まり、原初契約を結び、居合わせたうちで最も背の高い者を統治者に選んだ、などとは信じられない。人々が互いに結びつかない自然状態が現実にあったという考えは、突飛すぎて真面目には取り合えない。それに、啓示が伝える人類の最初の起源と、二千年後に人類が生き延びた次第とに明らかに反する。そのいずれも、一家族ずつを通じて成し遂げられた。この家族たちが、それぞれの内部で最初の社会を形づくった。社会は日に日に広がり、族長たちが営んだと見られる牧畜生活では立ちゆかないほど大きくなると、さまざまな移住を通じて、必然的に、さらに多くの社会に分かれた。その後、はるかに多くの働き手を用い、養うこともできる農業が広がるにつれ、移住はまれになった。以前は別々になった諸部族が、強制や征服によって、偶然によって、また時にはおそらく取り決めによって、再びひとつになった。しかし、必要と恐れに駆られた個人同士の合意が社会の正式な出発点ではなかったにせよ、人類を結びつけ、その結びつきの必要を明らかにし、したがって社会の堅固で自然な基礎となると同時に、その結び目ともなっているのは、自らの弱さと不完全さの自覚である。社会の原初契約というのは、こういう意味である。国を設けたときに、この契約が正式に口にされた例は一つもないかもしれない。それでも、物事の性質からも理性からも、人が結び合うという行為そのものに、いつでも次のことが了解され、含まれていなければならない。全体はそのどの部分をも保護し、どの部分も全体の意志に従う、ということである。言い換えれば、共同体は各構成員の権利を守り、その保護と引き換えに、一人ひとりは共同体の法に従う。全員が従わなければ、誰一人確実に保護することはできなかった」。",
      "translation_status": "reviewed"
    },
    {

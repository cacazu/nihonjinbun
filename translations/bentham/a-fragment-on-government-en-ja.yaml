          "printed_page": "214"
        }
      ],
      "source_text": "Ch. I.",
      "translation_ja": "第一章参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note112",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

    },
    {
      "id": "bentham-ch05-p006",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n247/mode/1up",
          "source_sequence": 566,
          "printed_page": "232",
          "printed_page_end": "233"
        }
      ],
      "source_text": "VI. Mean time to speak of the duties of a supreme power; — of a legislature, meaning a supreme legislature; — of a set of men acknowledged to be absolute; — is what, I must own, I am not very fond of. Not that I would wish the subordinate part of the community to be a whit less watchful over their governors, or more disposed to unlimited submission in point of conduct, than if I were to talk with ever so much peremptoriness of the “duties” of these latter, and of the rights which the former have against them: what I am afraid of is, running into solecism and confusion in discourse.",
      "translation_ja": "第六節　ところで、最高権力の義務、立法機関、すなわち最高の立法機関の義務、絶対的だと認められる人々の義務、などと語ることは、正直なところ、私の好みではない。共同体の従う側の人たちに、統治者への警戒をいささかでも緩めてもらいたいからではない。また、統治者の「義務」と、従う側が統治者に対して持つ権利を、いくら断定的に語ったとしても、それ以上に、実際に無制限の服従をしようと思ってもらいたいからでもない。私が恐れるのは、議論の中で言葉を誤用し、混乱に陥ることである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-note120",
      "section_id": "bentham-ch05",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n248/mode/1up",
          "source_sequence": 567,
          "printed_page": "233",
          "printed_page_end": "234"
        }
      ],
      "source_text": "With this note let no man trouble himself who is not used, or does not intend to use himself, to what are called metaphysical speculations: in whose estimation the benefit of understanding clearly what he is speaking of, is not worth the labour.\n1. Duty (political). That may be said to be my duty to do (understand political duty) which you (or some other person or persons) have a right to have me made to do. I then have a duty towards you: you have a right as against me.\n2. Right (political). What you have a right to have me made to do (understand a political right) is that which I am liable, according to law, upon a requisition made on your behalf, to be punished for not doing.\n3. Punishment a fundamental idea. I say punished: for without the notion of punishment (that is of pain annexed to an act, and accruing on a certain account, and from a certain source) no notion can we have of either right or duty.\n4. To define or expound. Now the idea belonging to the word pain is a simple one. To define or rather (to speak more generally) to expound a word, is to resolve, or to make a progress towards resolving, the idea belonging to it into simple ones.\n5. Words not to be expounded but by paraphrasis. For expounding the words duty, right, power, title, and those other terms of the same stamp that abound so much in ethics and jurisprudence, either I am much deceived, or the only method by which any instruction can be conveyed, is that which is here exemplified. An exposition framed after this method I would term paraphrasis.\n6. Paraphrasis what. A word may be said to be expounded by paraphrasis, when not that word alone is translated into other words, but some whole sentence of which it forms a part is translated into another sentence; the words of which latter are expressive of such ideas as are simple, or are more immediately resolvable into simple ones than those of the former. Such are those expressive of substances and simple modes, in respect of such abstract terms as are expressive of what Locke has called mixed modes. This, in short, is the only method in which any abstract terms can, at the long run, be expounded to any instructive purpose: that is in terms calculated to raise images either of substances perceived, or of emotions; sources, one or other of which every idea must be drawn from, to be a clear one.\n7. Definition per genus et differentiam, not universally applicable. The common method of defining — the method per genus et differentiam, as logicians call it, will, in many cases, not at all answer the purpose. Among abstract terms we soon come to such as have no superior genus. A definition, per genus et differentiam, when applied to these, it is manifest, can make no advance; it must either stop short, or turn back, as it were, upon itself, in a circulate or a repetend.\n8. Further examples; — disposition, — estate, — interest, — power. “Fortitude is a virtue:” — Very well: — but what is a virtue? “A virtue is a disposition:” — Good again: — but what is a disposition? “A disposition is a …;” and there we stop. The fact is, a disposition has no superior genus; a disposition is not a …, any thing: — this is not the way to give us any notion of what is meant by it. “A power,” again “is a right:” and what is a right? It is a power. — An estate is an interest, says our Author somewhere; where he begins defining an estate: — as well might he have said an interest was an estate. As well, in short, were it to define in this manner, a conjunction or a preposition. As well were it to say of the preposition through, or the conjunction because; a through is a …, or a because is a …, and so go on defining them.\n9. An imperfection frequent in our Author’s method. Of this stamp, by the bye, are some of his most fundamental definitions: of consequence they must leave the reader where they found him. But of this, perhaps, more fully and methodically on some future occasion. In the mean time I have thrown out these loose hints for the consideration of the curious.",
      "translation_ja": "いわゆる形而上学的な考察に慣れず、慣れる気もない人、つまり、自分が何を語っているかはっきり理解する利益など、その手間に見合わないと思う人は、この注に煩わされることはない。\n1．政治上の義務。あなたやほかの一人または複数の人が、私にある行為をさせるよう求める権利を持つなら、その行為をすることが私の義務、ここでは政治上の義務だと言ってよい。このとき私はあなたに対して義務を負い、あなたは私に対して権利を持つ。\n2．政治上の権利。あなたが、私にある行為をさせるよう求める権利、ここでは政治上の権利を持つとは、私がその行為をしないとき、あなたのための申し立てを受けて、法に基づき私が罰を受けうるということである。\n3．罰は根本の観念である。罰を受ける、と私は言う。罰という観念、すなわち行為に結びつけられ、ある理由で、ある源から生じる苦痛という観念なしには、権利も義務も、どんな観念も持ちようがないからである。\n4．定義する、あるいは解き明かすこと。さて、苦痛という語に属する観念は単純な観念である。語を定義すること、より一般的に言って、語を解き明かすこととは、その語に属する観念を単純な観念に分解すること、または分解に向けて一歩進むことである。\n5．文全体を言い換えなければ解き明かせない言葉。義務、権利、権力、権原といった、倫理学や法学にいくらでも現れる同類の用語を解き明かすためには、私が大きく間違っていないかぎり、ここで例示した方法だけが、何かを教えうる。私はこの方法で組み立てた説明を、「文による言い換え」と呼びたい。\n6．文による言い換えとは何か。その語だけをほかの言葉に置き換えるのではなく、その語を一部として含む文全体を、別の文に移すとき、この方法で語を解き明かしたと言ってよい。ただし後の文をなす言葉は、単純な観念か、前の文の観念より容易に単純な観念へ分解できる観念を表すものである。ロックが混合様態と呼んだものを表す抽象語に対して、実体や単純様態を表す語がそれにあたる。要するに、どんな抽象語でも、結局、何かを教えられるように解き明かすには、この方法しかない。知覚された実体か、心の動きか、どちらかの像を思い浮かべられる語で解き明かすのだ。はっきりした観念はどれも、そのどちらかを源とするに違いない。\n7．上位の類と種差で定義する方法には当てはまらないものがある。ふつうの定義の方法、論理学者が上位の類と種差によると呼ぶ方法は、多くの場合、まるで役に立たない。抽象語については、すぐに、それより上位の類がない語に行き当たる。この方法を当てはめて、それ以上前へ進めないのは明らかだ。そこで行き止まりになるか、いわば循環小数のように、同じところに戻って繰り返すしかない。\n8．さらなる例。性向、財産権、利害関係、権力。「剛毅は一つの徳である」。よろしい。だが徳とは何か。「徳は一つの性向である」。これもよろしい。では性向とは何か。「性向は……である」。そこで止まってしまう。事実、性向には上位の類がない。性向を何か「……である」とは言えない。何を意味するのかは、このやり方では少しも伝わらない。また「権力は権利である」。では権利とは何か。権力である。著者はどこかで、財産権を定義し始め、「財産権とは利害関係である」と言う。それなら、利害関係とは財産権だと言っても同じである。要するに、こういう方法なら接続詞や前置詞を定義しようとするのと同じだ。たとえば「～を通じて」という前置詞や、「なぜなら」という接続詞について、前者は何々、後者は何々、と言って、同じ調子で定義を続けるのと変わらない。\n9．著者の方法によくある欠点。ついでに言えば、著者のいくつかの最も根本的な定義が、この種のものである。その結果、読者の理解は、それを読む前と何ひとつ変わらない。このことについては、どこか別の機会に、もっと詳しく、筋道を立てて扱うかもしれない。さしあたり、関心のある人に考えてもらうため、こんなまとまらない手がかりを示した。",
      "translation_status": "reviewed"
    },

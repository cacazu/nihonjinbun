        }
      ],
      "source_text": "IX. Let us find out, if we can, whence this notion of the want of wisdom in the members of a Democracy, and of the abundance of it in those of an Aristocracy, could have had its rise. We shall then see with what degree of propriety such a notion can be transferred to our Houses of Lords and Commons.",
      "translation_ja": "第九節　民主政の構成員には知恵が足りず、貴族政の構成員には知恵があり余るという考えが、一体どこから来たのか、できれば突き止めよう。そうすれば、その考えをわが国の貴族院と庶民院に移すのが、どこまで妥当かが分かる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p009-b",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n204/mode/1up",
          "source_sequence": 398,
          "printed_page": "189",
          "printed_page_end": "190"
        }
      ],
      "source_text": "In the members of a Democracy in particular, there is likely to be a want of wisdom — Why? The greater part being poor, are, when they begin to take upon them the management of affairs, uneducated: being uneducated, they are illiterate: being illiterate, they are ignorant. Ignorant, therefore, and unwise, if that be what is meant by ignorant, they begin. Depending for their daily bread on the profits of some petty traffic, or the labour of some manual occupation, they are nailed to the work-board, or the counter. In the business of Government, it is only by fits and starts that they have leisure so much as to act: they have no leisure to reflect. Ignorant therefore they continue. — But in what degree is this the case with the members of our House of Commons?",
      "translation_ja": "とくに民主政の構成員は、知恵に欠けがちである。なぜか。その大部分が貧しく、政務を引き受け始めたときには教育を受けていない。教育を受けていないから、読み書きができない。読み書きができないから、ものを知らない。だから、ものを知らず、それがものを知らないという言葉の意味なら、知恵もないまま始める。日々の糧は、小さな商いの利益か肉体労働に頼るので、仕事台や店のカウンターに釘づけである。統治の仕事では、時たま行動する暇があるだけで、考える暇はない。だからものを知らないままでいる。しかし、わが庶民院の議員には、どの程度これが当てはまるのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin10",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n205/mode/1up",
          "source_sequence": 399,
          "printed_page": "190"
        }
      ],
      "source_text": "— and present in those of an Aristocracy.",
      "translation_ja": "一方、なぜ貴族政の構成員には備わりがちなのか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p010",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n205/mode/1up",
          "source_sequence": 400,
          "printed_page": "190"
        }
      ],
      "source_text": "X. On the other hand, the members of an Aristocracy, being few, are rich: either they are members of the Aristocracy, because they are rich; or they are rich, because they are members of the Aristocracy. Being rich, they are educated: being educated, they are learned: being learned, they are knowing. They are at leisure to reflect, as well as act. They may therefore naturally be expected to become, more knowing, that is more wise, as they persevere. In what degree is this the case with the members of the House of Lords more than with those of the House of Commons? The fact is, as every body sees, that either the members of the House of Commons are as much at leisure as those of the House of Lords; or, if occupied, occupied in such a way as tends to give them a more than ordinary insight into some particular department of Government. In whom shall we expect to find so much knowledge of Law as in a professed Lawyer? of Trade, as in a Merchant?",
      "translation_ja": "第十節　一方、貴族政の構成員は少数で、しかも裕福である。裕福だから貴族政の構成員なのか、貴族政の構成員だから裕福なのか、どちらかである。裕福だから教育を受け、教育を受けているから学があり、学があるからものを知っている。行動する暇だけでなく、考える暇もある。したがって、仕事を続けるうちに、いっそうものを知り、つまり賢くなると期待するのは自然である。だが、これが庶民院議員よりも貴族院議員によく当てはまるのは、どの程度だろう。誰の目にも明らかな事実はこうだ。庶民院議員には貴族院議員と同じだけ暇があるか、働いているとしても、政府のある特定分野について、人並み以上の見識を得やすいような仕事をしている。職業として法を扱う法律家ほど法に詳しく、商人ほど商いに詳しい人を、ほかのどこに求めようか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin11",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n206/mode/1up",
          "source_sequence": 401,
          "printed_page": "191"
        }
      ],
      "source_text": "Why, according to our Author.",
      "translation_ja": "著者の挙げる理由",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p011",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n206/mode/1up",
          "source_sequence": 402,
          "printed_page": "191"
        }
      ],
      "source_text": "XI. But hold — Our Author, when he attributes to the members of an Aristocracy more wisdom than to those of a Democracy, has a reason of his own. Let us endeavour to understand it, and then apply it, as we have applied the others. In Aristocratical bodies, we are to understand there is more experience; at least it is intended by some body or other there should be: which, it seems, answers the same purpose as if there was. “In Aristocracies,” says our Author, “there is more wisdom to be found, than in the other frames of Government; being composed,” continues he, “or intended to be composed, of the most experienced citizens.” On this ground then it is, that we are to take for granted, that the members of the House of Lords have more wisdom among them, than those of the House of Commons. It is this article of experience that, being a qualification possessed by the members of an Aristocratical body, as such, in a superior degree to that in which it can be possessed by a democratical body, is to afford us a particular ground for attributing a greater share of wisdom to the members of the upper house, than to those of the lower.",
      "translation_ja": "第十一節　いや、待てよ。著者には、民主政の構成員より貴族政の構成員にいっそう知恵があるとする、独自の理由がある。それを理解してから、ほかの理由と同じように当てはめてみよう。貴族政の議会にはいっそう多くの経験がある、と私たちは理解することになっている。少なくとも誰かが、いっそう多くあるようにと意図している。そしてそれで、実際にある場合と同じ目的が果たせるらしい。「貴族政には」と著者は言う。「ほかの政体よりも多くの知恵が見いだされる。最も経験のある市民で評議会が構成されているか、そう構成することを目指しているからである」と続ける。そこでこの理由から、貴族院の議員には庶民院の議員より多くの知恵があると、当然のことと見なすのである。何と言っても経験が、貴族政の議会の構成員に、その立場にあるだけで、民主政の議会の構成員に望める以上に備わっている。だからこそ、下院よりも上院の議員が知恵を多く持つと考えるのに、特別な理由が得られるというのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note94",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",

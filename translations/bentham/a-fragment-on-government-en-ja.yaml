      "source_text": "Applied to particular instances.",
      "translation_ja": "個々の事例に当てはめる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p015-b",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n186/mode/1up",
          "source_sequence": 324,
          "printed_page": "171",
          "printed_page_end": "172"
        }
      ],
      "source_text": "When the Spaniards, for example, became masters of the empire of Mexico, a vulgar politician might suppose it was because such of the Mexicans as remained unexterminated, could not help it. No such thing — It was because the Spaniards were of “opinion” or the Mexicans themselves were of “opinion” (which of the two is not altogether clear) that in Charles Vth, and his successors, more goodness (of which they had such abundant proofs) as well as wisdom, was likely to be found, than in all the Mexicans put together. The same persuasion obtained between Charlemagne and the German Saxons with respect to the goodness and wisdom of Charlemagne: — between William the Norman and the English Saxons: — between Mahomet II and the subjects of John Paleologus: — between Odoacer and those of Augustulus: — between the Tartar Gingiskan and the Chinese of his time: — between the Tartars Chang-ti and Cam-ghi, and the Chinese of their times: — between the Protector Cromwell and the Scotch: — between William III and the Irish Papists: — between Cæsar and the Gauls: — in short, between the Thirty Tyrants, so called, and the Athenians, whom our Author seems to have had in view: — to mention these examples only, out of as many hundred as might be required. All this, if we may trust our Author, he has the “goodness” to believe: and by such lessons is the penetration of students to be sharpened for piercing into the depths of politics.",
      "translation_ja": "たとえばスペイン人がメキシコ帝国の主になったとき、ありふれた政治家なら、殺されずに残ったメキシコの人々にはどうしようもなかったからだと思いかねない。とんでもない。スペイン人の「意見」か、それともメキシコの人々自身の「意見」か、どちらなのかははっきりしないが、カール五世とその後継者の方が、メキシコの人々を全員合わせたよりも、知恵はもちろん、善意も備えていそうだと考えたからなのである。善意の証拠はいくらでもあった。カール大帝とドイツのサクソン人も、大帝の善意と知恵について同じ思いを抱いていた。ノルマン人ウィリアムとイングランドのサクソン人も、メフメト二世とヨハネス・パレオロゴスの臣民も、オドアケルとアウグストゥルスの臣民も、タタール人チンギス・ハンとその時代の中国人も、タタール人のチャングティとカムギ〔順治帝と康熙帝〕とそれぞれの時代の中国人も、護国卿クロムウェルとスコットランド人も、ウィリアム三世とアイルランドのカトリック教徒も、カエサルとガリア人も、要するに、いわゆる三十人僭主と、著者が念頭に置いていたらしいアテネ人も、同じである。望むなら何百でも出せる例のうち、ここではこれだけにしておこう。著者を信じるなら、こうしたことをすべて信じる「善意」が当人にはある。学生はこういう授業で、政治の奥底を見抜く力を磨くのだそうだ。",
      "translation_status": "reviewed"
    },

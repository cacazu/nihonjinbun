      "source_text": "Terms of the supposed contract stated.",
      "translation_ja": "想定された契約の条項",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p039",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n172/mode/1up",
          "source_sequence": 262,
          "printed_page": "157"
        }
      ],
      "source_text": "XXXIX. A compact, then, it was said, was made by the King and people: the terms of it were to this effect, The people, on their part, promised to the King a general obedience. The King, on his part, promised to govern the people in such a particular manner always, as should be subservient to their happiness. I insist not on the words: I undertake only for the sense; as far as an imaginary engagement, so loosely and so variously worded by those who have imagined it, is capable of any decided signification. Assuming then, as a general rule, that promises, when made, ought to be observed; and, as a point of fact, that promise to this effect in particular had been made by the party in question, men were more ready to deem themselves qualified to judge when it was such a promise was broken, than to decide directly and avowedly on the delicate question, when it was that a King acted so far in opposition to the happiness of his people, that it were better no longer to obey him.",
      "translation_ja": "第三十九節　さて、王と人民が契約を結んだと言われる。条項はおよそ次のとおりである。人民は、自分たちの側として、全般にわたって王に従うと約束した。王は、自分の側として、常に人民の幸福に役立つようなやり方で人民を統治すると約束した。文言にこだわるつもりはない。私が引き受けるのはその意味を伝えることだけである。もっとも、その約束は作り話で、作った人たち自身の言い方があいまいなうえ互いに違うので、確かな意味があるとしての話である。こうして、約束したなら守らなければならないという一般原則を認め、この内容の約束を当の相手がしたことを事実と認めれば、人々は、何をもってその約束が破られたとするかなら、自分たちで判断できると思いやすかった。いつ王が人民の幸福に反する行いをし、もう従わない方がよいところまで達したのかという微妙な問いに、正面から公然と判断を下すよりは、そう思いやすかったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin40",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n172/mode/1up",
          "source_sequence": 263,
          "printed_page": "157"
        }
      ],
      "source_text": "Stated thus generally, it could not dispense men from entering into the question of utility, as was intended.",
      "translation_ja": "一般的な形で述べても、当初の狙いに反して、功利の問題は避けられない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p040",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n172/mode/1up",
          "source_sequence": 264,
          "printed_page": "157",
          "printed_page_end": "158"
        }
      ],
      "source_text": "XL. It is manifest, on a very little consideration, that nothing was gained by this manoeuvre after all: no difficulty removed by it. It was still necessary, and that as much as ever, that the question men studied to avoid should be determined, in order to determine the question they thought to substitute in its room. It was still necessary to determine, whether the King in question had, or had not acted so far in opposition to the happiness of his people, that it were better no longer to obey him; in order to determine, whether the promise he was supposed to have made, had, or had not been broken. For what was the supposed purport of this promise? It was no other than what has just been mentioned.",
      "translation_ja": "第四十節　少しでも考えれば、この手立てからは結局何も得られず、問題は一つも片づかなかったことが分かる。人々が避けようと苦心した問いを、別の問いと取り替えたつもりでも、その別の問いに答えるには、元の問いにこれまでどおり答える必要があった。王がしたことになっている約束を破ったかどうかを決めるには、当の王の行いが人民の幸福に反し、もう従わない方がよいほどだったかどうかを、やはり決める必要があった。そもそもこの約束の趣旨とされるものは何か。今述べたことにほかならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin41",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

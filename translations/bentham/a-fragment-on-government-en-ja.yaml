    {
      "id": "bentham-ch01-margin37",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n170/mode/1up",
          "source_sequence": 255,
          "printed_page": "155"
        }
      ],
      "source_text": "Fictions in general mischievous in the present state of things.",
      "translation_ja": "今の世では、擬制は一般に害がある",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p037",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n170/mode/1up",
          "source_sequence": 256,
          "printed_page": "155"
        }
      ],
      "source_text": "XXXVII. With respect to this, and other fictions, there was once a time, perhaps, when they had their use. With instruments of this temper, I will not deny but that some political work may have been done, and that useful work, which, under the then circumstances of things, could hardly have been done with any other. But the season of Fiction is now over: insomuch, that what formerly might have been tolerated and countenanced under that name, would, if now attempted to be set on foot, be censured and stigmatized under the harsher appellations of incroachment or imposture. To attempt to introduce any new one, would be now a crime: for which reason there is much danger, without any use, in vaunting and propagating such as have been introduced already. In point of political discernment, the universal spread of learning has raised mankind in a manner to a level with each other, in comparison of what they have been in any former time: nor is any man now so far elevated above his fellows, as that he should be indulged in the dangerous licence of cheating them for their good.",
      "translation_ja": "第三十七節　この擬制もほかの擬制も、役に立った時代があったのかもしれない。こういう道具で、当時の事情ではほかの道具でとてもできなかった政治上の仕事が、しかも役に立つ仕事ができたかもしれない。それは否定しない。しかし擬制の季節はもう過ぎた。昔なら擬制という名で黙認され、後押しさえされたことも、今始めようとすれば、越権や欺瞞というもっと厳しい名で批判され、非難されるだろう。今や新しい擬制を持ち込もうとするのは罪である。それゆえ、すでに持ち込まれたものを自慢し、広めても、役に立たず、危険だけが大きい。政治を見る目については、学問が広く行き渡り、以前のどんな時代に比べても、人々を互いに同じ水準に引き上げたと言ってよい。仲間のためだと言って仲間をだます、そんな危険な勝手を許されてよいほど、今や誰も仲間の上に抜きん出てはいない。",
      "translation_status": "reviewed"
    },

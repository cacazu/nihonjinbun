          "url": "https://archive.org/details/cu31924030442077/page/n168/mode/1up",
          "source_sequence": 250,
          "printed_page": "153"
        }
      ],
      "source_text": "XXXV. Were it then possible, there would be no use in its being solved: but being, as I take it, really unsolvable, it were of use it should be seen to be so. Peace may by this means be restored to the breast of many a desponding student, who, now prepossessed with the hopes of a rich harvest of instruction, makes a crime to himself of his inability to reap what, in truth, his Author has not sown.",
      "translation_ja": "第三十五節　たとえ解くことができたとしても、解いたところで役に立たない。しかし、私の思うとおり、本当に解けないなら、そのことを知ってもらうのには意味がある。豊かな学びの収穫を期待していたために、実は著者がまきもしなかったものを刈り取れず、自分を責めて落ち込んでいる大勢の学生が、これで心の平穏を取り戻せるかもしれない。",
      "translation_status": "reviewed"

      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n229/mode/1up",
          "source_sequence": 501,
          "printed_page": "214"
        }
      ],
      "source_text": "XX. It is the principle of utility, accurately apprehended and steadily applied, that affords the only clue to guide a man through these straits. It is for that, if any, and for that alone to furnish a decision which neither party shall dare in theory to disavow. It is something to reconcile men even in theory. They are at least, something nearer to an effectual union, than when at variance as well in respect of theory as of practice.",
      "translation_ja": "第二十節　功利の原理を正確に理解し、一貫して当てはめることだけが、この難局を切り抜ける手がかりになる。どちらの側も、少なくとも理論上は否定しようとしない判断を出せるものがあるとすれば、この原理をおいてほかにはない。理論の上だけでも、人々の仲をつけることには意味がある。理論でも実際でも相争っているときに比べれば、少なくとも、実のある結びつきにいくらか近づいたからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin21",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n229/mode/1up",
          "source_sequence": 502,
          "printed_page": "214"
        }
      ],
      "source_text": "Juncture for resistance.",
      "translation_ja": "抵抗に移るべき時点",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p021",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n229/mode/1up",
          "source_sequence": 503,
          "printed_page": "214",
          "printed_page_end": "215"
        }
      ],
      "source_text": "XXI. In speaking of the supposed contract between King and people I have already had occasion to give the description, and, as it appears to me, the only general description that can be given, of that juncture at which, and not before, resistance to government becomes commendable; or, in other words, reconcileable to just notions, whether of legal or not, at least of moral, and, if there be any difference, religious duty. What was there said was spoken, at the time, with reference to that particular branch of government which was then in question; the branch that in this country is administered by the King. But if it was just, as applied to that branch of government, and in this country, it could only be for the same reason that it is so when applied to the whole of government, and that in any country whatsoever. It is then, we may say, and not till then, allowable to, if not incumbent on, every man, as well on the score of duty as of interest, to enter into measures of resistance; when, according to the best calculation he is able to make, the probable mischiefs of resistance (speaking with respect to the community in general) appear less to him than the probable mischiefs of submission. This then is to him, that is to each man in particular, the juncture for resistance.",
      "translation_ja": "第二十一節　王と人民の間にあったとされる契約について述べるとき、政府への抵抗が認められるのは、どの時点に至って初めてなのかを説明する機会がすでにあった。それは、私には、一般的にできる唯一の説明と思われる。言い換えれば、どの時点でなら、政府への抵抗が法的義務の正しい理解にかなうかどうかはさておき、少なくとも道徳上の義務と、それと違うものなら宗教上の義務の、正しい理解にかなうかである。そのときの話は、当時問題にしていた政府の一部門、すなわちこの国では王が担当する部門についてだった。だが、この国でその部門に当てはめて正しいとすれば、その理由は、どの国であれ、政府全体に当てはめて正しい理由と同じでしかありえない。そこで、ある人ができる限りよく見積もって、共同体全体について言えば、抵抗によって予想される害が、服従によって予想される害よりもその人には小さく見えるとき、初めて、義務の面でも利益の面でも、誰にとっても、抵抗に移ることが義務であるかはさておき、少なくとも許されると言ってよい。それが、その人にとって、すなわち一人ひとりにとって、抵抗に移るべき時点である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note111",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [

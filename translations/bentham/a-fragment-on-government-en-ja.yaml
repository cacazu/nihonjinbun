    },
    {
      "id": "bentham-preface-note10",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n118/mode/1up",
          "source_sequence": 40,
          "printed_page": "103"
        }
      ],
      "source_text": "There is only one way in which censure, cast upon the Laws, has a greater tendency to do harm than good; and that is when it sets itself to contest their validity: I mean, when abandoning the question of expediency, it sets itself to contest the right. But this is an attack to which old-established Laws are not so liable. As this is the last though but too common resource of passion and ill-humour; and what men scarce think of betaking themselves to, unless irritated by personal competitions, it is that to which recent Laws are most exposed. I speak of what are called written Laws: for as to unwritten institutions, as there is no such thing as any certain symbol by which their authority is attested, their validity, how deeply rooted soever, is what we see challenged without remorse. A radical weakness, interwoven into the very constitution of all unwritten Law.",
      "translation_ja": "法への批評の害が益を上回りやすいのは、ただ一つ、法の効力そのものを争おうとするときである。すなわち、その法が適切かどうかという問いを捨て、そもそもそれを法とする権利があるのかを争う場合だ。しかし古くから確立した法は、このような攻撃を受けにくい。これは感情や腹立ちに駆られた者の最後の手段であり、残念ながらありふれてはいるものの、人が個人的な争いでいらだたないかぎり、あえて使おうとはめったに思わない。そこで、最近の法が、この攻撃に最もさらされる。いわゆる成文法についての話である。不文の制度については、その権威を証明する確かな印がないので、どれほど深く根を下ろしていようとも、その効力は何のためらいもなく争われる。これはあらゆる不文法の成り立ちそのものに織り込まれた、根本的な弱点である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p022",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n119/mode/1up",
          "source_sequence": 41,
          "printed_page": "104"
        }
      ],
      "source_text": "Thus destitute of foundation are the terrors, or pretended terrors, of those who shudder at the idea of a free censure of established institutions. So little does the peace of society require the aid of those lessons which teach men to accept of any thing as reason, and to yield the same abject and indiscriminating homage to the Laws here, which is paid to the despot elsewhere. The fruits of such tuition are visible enough in the character of that race of men who have always occupied too large a space in the circle of the profession: a passive and enervate race, ready to swallow any thing, and to acquiesce in any thing: with intellects incapable of distinguishing right from wrong, and with affections alike indifferent to either: insensible, short-sighted, obstinate: lethargic, yet liable to be driven into convulsions by false terrors: deaf to the voice of reason and public utility: obsequious only to the whisper of interest, and to the beck of power.",
      "translation_ja": "確立した制度が自由に批評されると思って身震いする人々の恐れ、あるいは恐れているというふりには、このように根拠がない。何でも道理として受け入れよ、よその国で専制君主に見せるあの卑屈で見境のない崇敬を、この国では法にささげよ、と教える必要など、社会の平和のためにはまったくないのである。こうした教育の実りは、法律家の世界でいつも多すぎるほどの場所を占めてきた、ある人種の性格を見ればよく分かる。受け身で気力がなく、何でもうのみにし、何でも受け入れる。正しいことと誤ったことを区別できない頭脳を持ち、そのどちらにも心は動かない。無感覚で、先が見えず、頑固。ふだんは眠ったようなのに、見せかけの危険には取り乱しかねない。理性や公益の呼びかけには耳が聞こえず、利害がささやき、権力が手招きするときだけ、へつらうのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p023",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n119/mode/1up",
          "source_sequence": 42,
          "printed_page": "104"
        }
      ],
      "source_text": "This head of mischief, perhaps, is no more than what may seem included under the former. For why is it an evil to a country that the minds of those who have the Law under their management should be thus enfeebled? It is because it finds them impotent to every enterprise of improvement.",
      "translation_ja": "この害は、おそらく、先に述べた害の中に含まれるように見えるものにすぎない。というのも、法を扱う人々の知性がこうも弱まるのは、なぜ国にとって悪いことなのか。改善に向けて何を企てても、その人々には何もできないからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p024",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n119/mode/1up",
          "source_sequence": 43,
          "printed_page": "104"
        }
      ],
      "source_text": "Not that a race of lawyers and politicians of this enervate breed is much less dangerous to the duration of that share of felicity which the State possesses at any given period, than it is mortal to its chance of attaining to a greater. If the designs of a Minister are inimical to his country, what is the man of all others for him to make an instrument of or a dupe? Of all men, surely none so fit as that sort of man who is ever on his knees before the footstool of Authority, and who, when those above him, or before him, have pronounced, thinks it a crime to have an opinion of his own.",
      "translation_ja": "ただし、こうして気力を失った法律家や政治家は、より大きな幸福を手に入れる望みをつぶすだけではない。国家がその時々にすでに得ている幸福を保つうえでも、それに劣らず危険である。大臣が国を害する企てを抱くとき、誰よりも都合のよい道具にできる、あるいはだませる相手は、どんな人間か。権威の足もとでいつもひざまずき、上の者や先人が判断を示したときに、自分の意見を持つのは罪だと思うような人間ほど、ふさわしい相手はあるまい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p025",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n119/mode/1up",
          "source_sequence": 44,
          "printed_page": "104",
          "printed_page_end": "106"
        }
      ],
      "source_text": "Those who duly consider upon what slight and trivial circumstances, even in the happiest times, the adoption or rejection of a Law so often turns; circumstances with which the utility of it has no imaginable connection—those who consider the desolate and abject state of the human intellect, during the periods in which so great a part of the still subsisting mass of institutions had their birth—those who consider the backwardness there is in most men, unless when spurred by personal interests or resentments, to run a-tilt against the Colossus of authority—those, I say, who give these considerations their due weight, will not be quite so zealous, perhaps, as our Author has been to terrify men from setting up what is now ‘private judgment,’ against what once was ‘public’: nor to thunder down the harsh epithet of ‘arrogance’ on those, who, with whatever success, are occupied in bringing rude establishments to the test of polished reason. They will rather do what they can to cherish a disposition at once so useful and so rare: which is so little connected with the causes that make popular discontentments dangerous, and which finds so little aliment in those propensities that govern the multitude of men. They will not be for giving such a turn to their discourses as to bespeak the whole of a man’s favour for the defenders of what is established: nor all his resentment for the assailants. They will acknowledge that if there be some institutions which it is ‘arrogance’ to attack, there may be others which it is effrontery to defend. Tourreil has defended torture: torture established by the ‘public judgment’ of so many enlightened nations. Beccaria (‘indecent’ and ‘arrogant’ Beccaria!) has condemned it. Of these two whose lot among men would one choose rather, the Apologist’s or the Censor’s?",
      "translation_ja": "最も幸福な時代でさえ、法律を採用するか退けるかは、しばしば、どれほど些細な事情で決まるだろうか。その事情は法の有用性と、考えられるかぎり何の関係もない。また、今も続く数多くの制度のうち、かなりの部分が生まれた時代に、人の知性はどれほど荒れ果て、卑屈であったか。大抵の人は、自分の利害や恨みに駆られでもしないかぎり、権威という巨像を相手に槍を構えようとはしない。こうした事情を一つずつしかるべく重く見る人は、かつて「公の判断」だったものに、今の「私的判断」を対抗させてはならないと脅すことに、著者ほど熱心ではいられまい。どれほど成功するにせよ、粗野な制度を洗練された理性の試しにかけようとする人々に、「傲慢」というきつい呼び名を雷のように浴びせることにも、熱心ではあるまい。むしろ、これほど有用で、しかも稀な気風を、できるかぎり育てようとするだろう。この気風は、民衆の不満を危険にする原因とはほとんど縁がなく、大勢の人を動かす性向からも、ほとんど力を得ないからである。こうした人は、既存のものの擁護者に好意をすべて注ぎ、攻撃する側には憤りをすべて向けよと、そそのかすような話の運びはしまい。攻撃するのが「傲慢」と言える制度があるなら、弁護するのが厚かましい制度もあると認めるだろう。トゥレイユは拷問を弁護した。数多くの啓明な国々の「公の判断」によって確立した拷問である。ベッカリーアは拷問を非難した。あの「無作法」で「傲慢」なベッカリーアが、である！　二人のいずれの立場を自分で選びたいと思うだろうか。擁護者か、それとも批評者か。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note11",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

      "source_text": "It is not then, I say, this part, it is not even any part of that Introduction, to which alone I have any thoughts of extending my examination, that is the principal seat of that poison, against which it was the purpose of this attempt to give an antidote. The subject handled in this part of the work is such, as admits not of much to be said in the person of the Censor. Employed, as we have seen, in settling matters of a preliminary nature—in drawing outlines, it is not in this part that there was occasion to enter into the details of any particular institution. If I chose the Introduction then in preference to any other part, it was on account of its affording the fairest specimen of the whole, and not on account of its affording the greatest scope for censure.",
      "translation_ja": "ゆえに、この試みは毒に対する解毒剤を与えるつもりで始めたとはいえ、その毒が主にひそむのは、この一部分ではない。検討を広げるとしても序論だけだが、その序論のどの部分にも、主にはひそんでいないのである。著作のこの部分の主題については、批評者の役を引き受けても、それほど多くを語る余地はない。見てきたとおり、著者はここで予備的な事柄を整理し、輪郭を描くのに携わっており、特定の制度の細かい点に立ち入る機会はここにはなかった。私がほかのどの部分より先に序論を選んだのは、それが全体を最も公平に判断できる見本だったからであって、一番批評の余地が広いからではない。",

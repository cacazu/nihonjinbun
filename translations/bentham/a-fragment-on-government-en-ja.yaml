      ],
      "source_text": "Necessity and use of these verbal criticisms.",
      "translation_ja": "言葉を批評することの必要と効用",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p013",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n255/mode/1up",
          "source_sequence": 585,
          "printed_page": "240"
        }
      ],
      "source_text": "XIII. I now put an end to the tedious and intricate war of words that has subsisted, in a more particular manner during the course of these two last chapters: a logomachy, wearisome enough, perhaps, and insipid to the reader, but beyond description laborious and irksome to the writer. What remedy? Had there been sense, I should have attached myself to the sense: finding nothing but words; to the words I was to attach myself, or to nothing. Had the doctrine been but false, the task of exposing it would have been comparatively an easy one: but it was what is worse, unmeaning; and thence it came to require all these pains which I have been here bestowing on it: to what profit let the reader judge.",
      "translation_ja": "第十三節　これで、とくに最後の二章を通じて続いた、長く入り組んだ言葉の戦いを終わりにする。読者にはおそらく十分うんざりする、味気ない言葉争いだったろう。書く方には、言いようもないほど骨が折れ、気の重い仕事だった。だが、どうしようがあっただろう。意味があったなら、その意味を取り上げた。言葉以外に何も見つからなかったので、言葉を取り上げるか、何も取り上げないかしかなかった。学説がただ誤っているだけなら、誤りを暴くのは割合たやすかったろう。だが、それより悪いことに、意味をなしていなかった。そのため、ここまで費やした苦労が、ことごとく必要になった。何の実りがあったかは、読者に判断してもらおう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p013-b",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n255/mode/1up",
          "source_sequence": 586,
          "printed_page": "240"
        }
      ],
      "source_text": "“Well then,” — (cries an objector) — “the task you have set yourself is at an end; and the subject of it after all, according to your own representation, teaches nothing; — according to your own shewing it is not worth attending to. — Why then bestow on it so much attention?”",
      "translation_ja": "「それなら」と反論する人は声を上げる。「みずから課した仕事は終わりましたが、あなた自身の説明では、取り組んだものは結局、何一つ教えないのですね。あなた自身が示したとおりなら、耳を傾けるに値しません。それなのに、なぜこれほど注意を払ったのですか」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p013-c",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n255/mode/1up",
          "source_sequence": 587,
          "printed_page": "240",
          "printed_page_end": "241"
        }
      ],
      "source_text": "In this view — To do something to instruct, but more to undeceive, the timid and admiring student: — to excite him to place more confidence in his own strength, and less in the infallibility of great names: — to help him to emancipate his judgment from the shackles of authority: — to let him see that the not understanding a discourse may as well be the writer’s fault as the reader’s: — to teach him to distinguish between showy language and sound sense: — to warn him not to pay himself with words: — to shew him that what may tickle the ear, or dazzle the imagination, will not always inform the judgment: — to shew him what it is our Author can do, and has done: and what it is he has not done, and cannot do: — to dispose him rather to fast on ignorance than feed himself with error: to let him see that with regard to an expositor of the law, our Author is not he that should come, but that we may be still looking for another.",
      "translation_ja": "こういう目的からである。おそるおそる偉い人を見上げる学び手に、いくらか教えを与え、それ以上に、思い込みを解いてやりたかった。自分の力をもっと信じ、名のある人は間違わないという思いはもっと控えるよう励ましたかった。権威のかせから判断を解き放つ助けをしたかった。文章が理解できないのは、読む側と同様に、書く側のせいであることもある、と分かってもらいたかった。目を引く言葉と、確かな意味を見分けることを教えたかった。言葉だけで何かを得た気になるなと忠告したかった。耳をくすぐり、想像をくらませるものが、いつも判断の助けになるわけではないと示したかった。著者にできること、著者が実際にしたこと、しなかったこと、できないことを示したかった。誤りを食べて満腹になるよりは、知らぬまま腹をすかせている方を選ぶようにしたかった。法を解説する者として、著者は私たちが待ち望んでいたその人ではなく、ほかの人をまだ待ってよいと、気づいてほしかったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p013-d",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n256/mode/1up",
          "source_sequence": 588,
          "printed_page": "241"
        }
      ],
      "source_text": "— “Who then,” says my objector, “shall be that other? Yourself?” — No verily. — My mission is at an end, when I have prepared the way before him.",
      "translation_ja": "「では」と反論する人は言う。「そのほかの人は誰ですか。あなた自身ですか」。いや、決してそうではない。その人に先立って道を整えたところで、私の使命は終わるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-end",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

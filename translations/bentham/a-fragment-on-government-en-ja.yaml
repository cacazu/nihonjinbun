      ],
      "source_text": "A salvo for reformation.",
      "translation_ja": "改革への道は残る",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p037",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n239/mode/1up",
          "source_sequence": 542,
          "printed_page": "224",
          "printed_page_end": "225"
        }
      ],
      "source_text": "XXXVII. God forbid, that from any thing here said it should be concluded that in any society any convention is or can be made, which shall have the effect of setting up an insuperable bar to that which the parties affected shall deem a reformation: — God forbid that any disease in the constitution of a state should be without its remedy. Such might by some be thought to be the case, where that supreme body which in such a convention, was one of the contracting parties, having incorporated itself with that which was the other, no longer subsists to give any new modification to the engagement. Many ways might however be found to make the requisite alteration, without any departure from the spirit of the engagement. Although that body itself which contracted the engagement be no more, a larger body, from whence the first is understood to have derived its title, may still subsist. Let this larger body be consulted. Various are the ways that might be conceived of doing this, and that without any disparagement to the dignity of the subsisting legislature: of doing it, I mean to such effect, as that, should the sense of such larger body be favourable to the alteration, it may be made by a law, which, in this case, neither ought to be, nor probably would be, regarded by the body of the people as a breach of the convention.",
      "translation_ja": "第三十七節　ここで述べたことから、影響を受ける当事者が改革だと考えるものに、越えられない障害を設けるような合意が、どこかの社会ですでに結ばれているとか、結びうるとか、くれぐれも結論してはならない。国の国制に、手の施しようのない病があってはならない。ある合意を結んだ当事者の一方である最高機関が、もう一方の機関と合併し、約束に新しい形を与えることができるような形ではもはや存在しない場合、治療のしようがないと考える人もいよう。しかし、約束の精神を少しも離れずに、必要な変更を加えるやり方は、いくつも見つかるかもしれない。約束をした機関そのものはもうなくても、もとの機関が権限を得たとされる、もっと広い団体は残っているかもしれない。そこで、その広い団体の意見を聞くのである。今ある立法機関の威厳を損なわずに意見を聞くやり方は、いろいろ考えられる。私が意見を聞くと言うのは、その団体の意向が変更に賛成なら、法律で変更できるようにするということである。その場合、その法律を、人民全体が合意違反と見なすべきではないし、おそらくそう見なすこともない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note118",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n240/mode/1up",
          "source_sequence": 543,
          "printed_page": "225"
        }
      ],
      "source_text": "In Great Britain, for instance, suppose it were deemed necessary to make an alteration in the Act of Union. If in an article stipulated in favour of England, there need be no difficulty; so that there were a majority for the alteration among the English members, without reckoning the Scotch. The only difficulty would be with respect to an article stipulated in favour of Scotland; on account, to wit, of the small number of the Scotch members, in comparison with the English. In such a case, it would be highly expedient, to say no more, for the sake of preserving the public faith, and to avoid irritating the body of the nation, to take some method for making the establishment of the new law, depend upon their sentiments. One such method might be as follows. Let the new law in question be enacted in the common form. But let its commencement be deferred to a distant period, suppose a year or two: let it then, at the end of that period, be in force, unless petitioned against, by persons of such a description, and in such a number as might be supposed fairly to represent the sentiments of the people in general: persons, for instance, of the description of those who at the time of the Union, constituted the body of electors. To put the validity of the law out of dispute, it would be necessary the fact upon which it was made ultimately to depend, should be in its nature too notorious to be controverted. To determine therefore, whether the conditions upon which the invalidation of it was made to depend, had been complied with, is what must be left to the simple declaration of some person or persons; for instance the King. I offer this only as a general idea: and as one amongst many that perhaps might be offered in the same view. It will not be expected that I should here answer objections, or enter into details.",
      "translation_ja": "たとえばグレートブリテンで、合同法を変更する必要があると見なされたとしよう。イングランドに有利なように決められた条項なら、スコットランドの議員を数えずとも、イングランドの議員の過半数が変更に賛成するかぎり、難しいことはない。難しいのは、スコットランドに有利なように決めた条項の場合だけだ。スコットランドの議員がイングランドの議員より少数だからである。この場合、公の約束への信頼を保ち、国民全体を刺激するのを避けるため、新法が効力を持つかどうかを、国民の意向に委ねる手立てを取るのが、控えめに言ってもたいへん望ましい。たとえば次のような手立てである。当の新法は普通の形式で制定する。ただし施行は、たとえば一年か二年先まで延ばす。その期間が終わってから、人民一般の気持ちを公正に代表するとみなせる資格と人数を備えた人々が、反対の請願を出さなければ、これを施行する。たとえば合同当時に選挙人の団体を構成した人々と、同じ資格の者である。法の効力をめぐる争いの余地をなくすには、最終的に法の効力を決める事実が、争いようがないほど、その性質上よく知られていなければならない。だから、この法が無効となるための条件が満たされたかの判定は、誰か一人か複数の人、たとえば王の、簡明な宣言に任せなければならない。これは、あくまで大まかな考えの一例として、同じ目的から考えられるかもしれない多くの案の一つとして述べた。ここで異論に答えたり細部に立ち入ったりすることまでは、求められまい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin38",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"

          "source_sequence": 45,
          "printed_page": "105"
        }
      ],
      "source_text": "See note, p. 102.",
      "translation_ja": "102頁の注を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note12",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n120/mode/1up",
          "source_sequence": 46,
          "printed_page": "105"
        }
      ],
      "source_text": "One may well say rare. It is a matter of fact about which there can be no dispute. The truth of it may be seen in the multitude of Expositors which the Jurisprudence of every nation furnished, ere it afforded a single Censor. When Beccaria came, he was received by the intelligent as an Angel from heaven would be by the faithful. He may be styled the father of Censorial Jurisprudence. Montesquieu’s was a work of the mixed kind. Before Montesquieu all was unmixed barbarism. Grotius and Puffendorf were to Censorial Jurisprudence what the Schoolmen were to Natural Philosophy.",
      "translation_ja": "「稀」と言ってよい。これは議論の余地のない事実である。どの国の法学も、一人の批評者を生むまでに、なんと多くの解説者を出したかを見れば、そのとおりだと分かる。ベッカリーアが現れると、ものの分かる人々は、信仰のある人が天からの御使いを迎えるように、彼を迎えた。彼は批評的な法学の父と呼んでよい。モンテスキューの仕事は、解説と批評が混じったものであった。モンテスキューより前は、混じりけのない野蛮さがすべてであった。批評的な法学にとってのグロティウスとプーフェンドルフは、自然哲学にとってのスコラ学者である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note13",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n120/mode/1up",
          "source_sequence": 47,
          "printed_page": "105"
        }
      ],
      "source_text": "A French Jurist of the last age, whose works had like celebrity, and in many respects much the same sort of merits as our Author’s. He was known to most advantage by a translation of Demosthenes. He is now forgotten.",
      "translation_ja": "前の時代のフランスの法学者。その著作は、私たちの著者のそれと同じように名高く、多くの点で、ほぼ同じ種類の長所を備えていた。デモステネスの翻訳で最もよい名を得た。今では忘れられている。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin06",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n121/mode/1up",
          "source_sequence": 48,
          "printed_page": "106"
        }
      ],
      "source_text": "Our Author why attacked in the character of an Expositor.",
      "translation_ja": "著者を解説者としても批判する理由",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p026",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n121/mode/1up",
          "source_sequence": 49,
          "printed_page": "106"
        }
      ],
      "source_text": "Of a piece with the discernment which enables a man to perceive, and with the courage which enables him to avow, the defects of a system of institutions, is that accuracy of conception which enables him to give a clear account of it. No wonder then, in a treatise partly of the expository class, and partly of the censorial, that if the latter department is filled with imbecility, symptoms of kindred weakness should characterize the former.",
      "translation_ja": "制度の仕組みの欠点を見抜く目と、それを公に言い表す勇気。そうした資質と一続きなのが、その仕組みを明瞭に説明できる、物の捉え方の正確さである。だから、ある部分は解説で、ある部分は批評である論考で、後者が無力さでいっぱいなら、前者にも同じような弱さの徴候が現れるのは、不思議ではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p027",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n121/mode/1up",
          "source_sequence": 50,
          "printed_page": "106"
        }
      ],
      "source_text": "The former department, however, of our Author’s work, is what, on its own account merely, I should scarce have found myself disposed to intermeddle with. The business of simple exposition is a harvest in which there seemed no likelihood of there being any want of labourers: and into which therefore I had little ambition to thrust my sickle.",
      "translation_ja": "もっとも、著者の仕事のうち解説の方だけを取り上げるのであれば、まず、手を出そうとは思わなかっただろう。解説だけの仕事は、働き手が足りなくなりそうにない収穫であり、私には、その畑に自分の鎌を持ち込もうという気はほとんどなかったからだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p028",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n121/mode/1up",
          "source_sequence": 51,
          "printed_page": "106",
          "printed_page_end": "107"
        }
      ],
      "source_text": "At any rate, had I sat down to make a report of it in this character alone, it would have been with feelings very different from those of which I now am conscious, and in a tone very different from that which I perceive myself to have assumed. In determining what conduct to observe respecting it, I should have considered whether the taint of error seemed to confine itself to parts, or to diffuse itself through the whole. In the latter case, the least invidious, and considering the bulk of the work, the most beneficial course would have been to have taken no notice of it at all, but to have sat down and tried to give a better. If not the whole in general, but scattered positions only had appeared exceptionable, I should have sat down to rectify those positions with the same apathy with which they were advanced. To fall in an adverse way upon a work simply expository, if that were all there were of it, would have been alike ungenerous and unnecessary. In the involuntary errors of the understanding there can be little to excite, or at least to justify, resentment. That which alone, in a manner, calls for rigid censure, is the sinister bias of the affections. If then I may still continue to mention as separate, parts which in the work itself are so intimately, and, indeed, undistinguishably blended, it is the censorial part alone that has drawn from me that sort of animadversion I have been led to bestow indiscriminately on the whole. To lay open, and if possible supply, the imperfections of the other, is an operation that might indeed of itself do service; but that which I thought would do still more service, was the weakening the authority of this.",
      "translation_ja": "いずれにせよ、解説としての面だけを評しようとしたなら、今自分に分かっている気持ちとはずいぶん違う気持ちで、また知らず知らず取っていた調子とはずいぶん違う調子で、書いたはずである。どう扱うかを決めるには、誤りの染みが一部だけにとどまるように見えるのか、それとも全体に広がっているのかを考えただろう。全体にわたっていたなら、人の不興を買わず、また著作の分量を考えれば最も役に立つのは、それをまったく取り上げず、腰を据えて、もっとよいものを書いてみることだった。不都合なのが全体ではなく、散らばった幾つかの見解だけなら、その見解が述べられたときと同じ、熱を帯びない気持ちで、訂正にかかっただろう。頭から敵対するように、ただの解説書を攻撃するのは、もしそれだけの著作なら、度量に欠けるうえに、必要もなかった。知性の思わぬ誤りには、腹を立てさせるものは、少なくとも腹を立てて当然だと言えるものは、ほとんどない。厳しい批判が必要なのは、いわば、感情がよこしまに偏るときだけである。そこで、著作の中では密接に、実のところ見分けのつかないほど混じり合う部分を、なお分けて言ってよいなら、私が全体に向けることになった、このような批判を引き出したのは、批評の部分だけなのである。解説の不備を明るみに出し、できれば補うことも、それ自体で役に立ったかもしれない。だが、いっそう役に立つと思ったのは、批評の方の権威を弱めることであった。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p029",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n122/mode/1up",
          "source_sequence": 52,
          "printed_page": "107"
        }
      ],
      "source_text": "Under the sanction of a great name every string of words however unmeaning, every opinion however erroneous, will have a certain currency. Reputation adds weight to sentiments from whence no part of it arose, and which had they stood alone might have drawn nothing, perhaps, but contempt. Popular fame enters not into nice distinctions. Merit in one department of letters affords a natural, and in a manner irrecusable presumption of merit in another, especially if the two departments be such between which there is apparently a close alliance.",
      "translation_ja": "大きな名声が裏づけになれば、どれほど意味のない言葉の羅列でも、どれほど誤った意見でも、世にいくらか通用する。評判は、その評判を築くのに何の役にも立たなかった意見、単独でいれば、おそらく軽蔑しか受けなかった意見にまで、重みを与える。世間の名声は、細かい区別などしない。ある著述の分野で功績があれば、いわば当然に、拒みようもないほど、別の分野にも功績があるものと見込ませる。二つが明らかに近い分野なら、なおさらである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p030",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n122/mode/1up",
          "source_sequence": 53,
          "printed_page": "107"
        }
      ],
      "source_text": "Wonderful, in particular, is that influence which is gained over young minds, by the man who on account of whatever class of merit is esteemed in the character of a preceptor. Those who have derived, or fancy themselves to have derived knowledge from what he knows, or appears to know, will naturally be for judging as he judges: for reasoning as he reasons; for approving as he approves; for condemning as he condemns. On these accounts it is, that when the general complexion of a work is unsound, it may be of use to point an attack against the whole of it without distinction, although such parts of it as are noxious as well as unsound be only scattered here and there.",
      "translation_ja": "とりわけ、どんな種類の長所であれ、師として敬われる人が、若い人の心に及ぼす影響の大きさには驚く。師が知っていること、あるいは知っているらしいことから、知識を得た人、または得たと思っている人は、おのずと、師が判断するように判断し、師が推論するように推論し、師の認めるものを認め、師の非難するものを非難したがる。このような事情があるから、著作の全体の性格が健全でない場合には、健全でないばかりか害もある箇所が、あちらこちらに散らばっているだけでも、区別せず、著作全体に批判を向ける方が役に立つことがあるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p031",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n122/mode/1up",
          "source_sequence": 54,
          "printed_page": "107",
          "printed_page_end": "108"
        }
      ],
      "source_text": "On these considerations then it may be of use to shew, that the work before us, in spite of the merits which recommend it so powerfully to the imagination and to the ear, has no better title on one account than on another, to that influence which, were it to pass unnoticed, it might continue to exercise over the judgment.",
      "translation_ja": "以上を考えれば、私たちの眼前の著作について、次のことを示すのは有益だろう。想像力と耳にこれほど力強く訴える長所があるにしても、もし放っておけば人の判断に及ぼし続けかねない影響力を、この著作が正当に持ってよいとは、どの観点から見ても言えない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p032",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 55,
          "printed_page": "108"
        }
      ],
      "source_text": "The Introduction is the part to which, for reasons that have been already stated, it was always my intention to confine myself. It is but a part even of this Introduction that is the subject of the present Essay. What determined me to begin with this small part of it is, the facility I found in separating it from every thing that precedes or follows it. This is what will be more particularly spoken to in another place.",
      "translation_ja": "すでに述べた理由で、私の取り上げる範囲は最初から序論に絞るつもりだった。この論考の主題は、その序論の中のごく一部分でしかない。この小さな部分から始めることに決めたのは、その前後のすべてから、たやすく切り離せると分かったからである。この点は、別の箇所でもう少し詳しく述べる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note14",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 56,
          "printed_page": "108"
        }
      ],
      "source_text": "See the ensuing Introduction.",
      "translation_ja": "この後の序論を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p033",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 57,
          "printed_page": "108"
        }
      ],
      "source_text": "It is not that this part is among those which seemed most open to animadversion. It is not that stronger traces are exhibited in this part than in another of that spirit in our Author which seems so hostile to Reformation, and to that Liberty which is Reformation’s harbinger.",
      "translation_ja": "ここが最も非難を受けやすい箇所の一つに見えたからではない。著者が改革を嫌い、改革の先触れとなる自由にも敵対するように見える、その姿勢が、ほかの箇所よりここに強く現れているからでもない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p034",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 58,
          "printed_page": "108"
        }
      ],
      "source_text": "It is not here that he tramples on the right of private judgment, that basis of every thing that an Englishman holds dear. It is not here, in particular, that he insults our understandings with nugatory reasons; stands forth the professed champion of religious intolerance; or openly sets his face against civil reformation.",
      "translation_ja": "イングランド人が大切にするあらゆるものの土台である、自分で判断する権利を、著者が踏みにじるのはここではない。ことに、何の役にも立たない理由を並べて私たちの知性を侮ったり、宗教上の不寛容を公然と擁護したり、社会の改革にあからさまに反対したりするのは、ここではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note15",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 59,
          "printed_page": "108"
        }
      ],
      "source_text": "See note.",
      "translation_ja": "前掲の注を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin07",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 60,
          "printed_page": "108"
        }
      ],
      "source_text": "Reprehensible passages from the work at large.",
      "translation_ja": "『釈義』全体から見た非難すべき箇所",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p035",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 61,
          "printed_page": "108"
        }
      ],
      "source_text": "It is not here, for example, he would persuade us, that a trader who occupies a booth at a fair is a fool for his pains; and on that account no fit object of the Law’s protection.",
      "translation_ja": "たとえば、市で店を出す商人を、苦労してそんなことをするのは愚かだと言い、だから法の保護に値しないと、著者が私たちに信じさせようとするのは、ここではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note16",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 62,
          "printed_page": "108"
        }
      ],
      "source_text": "‘Burglary,’ says our Author, ‘cannot be committed in a tent or a booth erected in a market fair; though the owner may lodge therein: for the Law regards thus highly nothing but permanent edifices; a house, or church; the wall, or gate of a town; and it is the folly of the owner to lodge in so fragile a tenement.’ To save himself from this charge of folly, it is not altogether clear which of two things the trader ought to do: quit his business and not go to the fair at all: or leave his goods without any body to take care of them.",
      "translation_ja": "「市に張ったテントや仮小屋では、たとえ持ち主がそこで寝泊まりしていても、住居侵入窃盗の罪は成立しない」と著者は言う。「法がこれほどまでに重んじるのは、家や教会、町の壁や門など、恒久的な建造物だけだからである。そんな壊れやすい仮住まいに泊まるのは、持ち主が愚かなのだ」。愚かだと言われずに済むために、商人はいったいどちらを選ぶべきなのか、よく分からない。商売をやめて市に行かないのか、それとも、商品を誰にも見張らせずに置いていくのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note17",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n123/mode/1up",
          "source_sequence": 63,
          "printed_page": "108"
        }
      ],
      "source_text": "4 Comm. Ch. XVI. p. 226.",
      "translation_ja": "『イングランド法釈義』第4巻第16章226頁。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p036",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n124/mode/1up",
          "source_sequence": 64,
          "printed_page": "109"
        }
      ],
      "source_text": "It is not here that he gives the presence of one man at the making of a Law, as a reason why ten thousand others that are to obey it, need know nothing of the matter.",
      "translation_ja": "法律を作る場に一人が立ち会ったのだから、その法に従わなくてはならないほかの一万人は、何も知らなくてよいと、著者が理由をつけるのは、ここではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note18",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n124/mode/1up",
          "source_sequence": 65,
          "printed_page": "109"
        }
      ],
      "source_text": "Speaking of an Act of Parliament, ‘There needs,’ he says, ‘no formal promulgation to give it the force of a Law, as was necessary by the Civil Law with regard to the Emperor’s Edicts: because every man in England is, in judgment of Law, party to the making of an Act of Parliament, being present thereat by his representatives.’ This, for aught I know, may be good judgment of Law; because any thing may be called judgment of Law, that comes from a Lawyer, who has got a name: it seems, however, not much like any thing that can be called judgment of common sense. This notable piece of astutia was originally, I believe, judgment of Lord Coke: it from thence became judgment of our Author: and may have been judgment of more Lawyers than I know of before and since. What grieves me is, to find many men of the best affections to a cause which needs no sophistry, bewildered and bewildering others with the like jargon.",
      "translation_ja": "議会制定法について、著者はこう言う。「ローマ法では皇帝の勅令について必要だったが、議会制定法に法律の効力を与えるために、正式の公布は要らない。イングランドの誰もが、法の判断では、代表を通してその場に列しているため、議会制定法を作る当事者だからである」。ひょっとすると、これは法の上では良い判断なのかもしれない。名の知れた法律家の口から出れば、どんな判断も「法の判断」と呼んでもらえるのだから。もっとも、「常識の判断」と呼べるようなものには、あまり似ていない。この見事な小細工は、もともとコーク卿の判断だったと私は思う。そこから私たちの著者の判断になり、前にも後にも、私が知る以上に多くの法律家が、同じ判断を下したかもしれない。私が残念に思うのは、詭弁の助けなど要らない大義に、心から味方する多くの人が、こうした分からず屋の言葉に惑わされ、ほかの人まで惑わせていることだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note19",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n124/mode/1up",
          "source_sequence": 66,
          "printed_page": "109"
        }
      ],
      "source_text": "1 Comm. Ch. II. p. 178.",
      "translation_ja": "『イングランド法釈義』第1巻第2章178頁。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p037",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n124/mode/1up",
          "source_sequence": 67,
          "printed_page": "109"
        }
      ],
      "source_text": "It is not here, that after telling us, in express terms, there must be an ‘actual breaking’ to make burglary, he tells us, in the same breath, and in terms equally express, where burglary may be without actual breaking; and this because ‘the Law will not suffer itself to be trifled with.’",
      "translation_ja": "住居侵入窃盗が成立するには「実際に破って入ること」が必要だとはっきり語った、その舌の根も乾かぬうちに、実際に破って入らなくても成立する場合を、同じようにはっきり挙げるのは、ここではない。いわく、「法は自らを愚弄させない」からだという。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note20",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n124/mode/1up",
          "source_sequence": 68,
          "printed_page": "109"
        }
      ],
      "source_text": "His words are, ‘There must be an actual breaking, not a mere legal clausum fregit (by leaping over invisible ideal boundaries, which may constitute a civil trespass) but a substantial and forcible irruption.’ In the next sentence but two he goes on, and says,—[Specific examples of unlawful entry and violence omitted.] The cases are held to constitute burglary without an actual breaking, on the rationale that ‘the Law will not suffer itself to be trifled with by such evasions.’ Can it be more egregiously trifled with than by such reasons? I must own I have been ready to grow out of conceit with these useful little particles, for, because, since, and others of that fraternity, from seeing the drudgery they are continually put to in these Commentaries. The appearance of any of them is a sort of warning to me to prepare for some tautology, or some absurdity: for the same thing dished up over again in the shape of a reason for itself: or for a reason which, if a distinct one, is of the same stamp as those we have just seen. Other instances of the like hard treatment given to these poor particles will come under observation in the body of this Essay. As to reasons of the first-mentioned class, of them one might pick out enough to fill a volume.",
      "translation_ja": "著者の言葉はこうである。「実際に破って入るのでなくてはならない。法律上ただ囲いを侵したというだけでは足りない。目に見えない観念上の境界を越えるだけなら、民事上の不法侵入にはなりうるが、ここでいうのは実質を伴う、力ずくの侵入である」。それから二つの文を挟んで、著者はこう続ける。［不法侵入と暴力の具体例は省略。］こうした場合、実際に破って入っていなくても住居侵入窃盗が成立する。その理由は「法はこのような言い逃れで自らを愚弄させない」からだという。こんな理由をつける以上に、法をひどく愚弄することがありうるだろうか。私は、「というのも」「なぜなら」「なので」といった役に立つ小さな言葉や、その仲間に、愛想を尽かしかけたことを認めねばならない。この『釈義』で、これらの言葉が絶えず苦役を課されているのを見たからである。そのどれかが現れると、同語反復か、何かばかげたことに備えよと警告されたように思う。同じ事柄が、自分自身を説明するための理由として盛り直されて出てくるか、さもなくば、別の理由でも、さっき見たものと同じ類のものが出てくるからである。この気の毒な小語が同じように酷使される例は、論考の本文でも見るだろう。最初に挙げた種類の理由なら、一巻を満たすほど拾い出せるほどである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note21",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

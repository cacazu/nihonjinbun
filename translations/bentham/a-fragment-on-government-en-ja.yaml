          "printed_page": "130"
        }
      ],
      "source_text": "To make sure of doing our Author no injustice, and to shew what it is that he thought would ‘naturally lead us into’ this ‘enquiry,’ it may be proper to give the paragraph containing the explanation above mentioned. It is as follows:—‘But farther: municipal law is a rule of civil conduct, prescribed by the supreme power in a state.’ ‘For legislature, as was before observed, is the greatest act of superiority that can be exercised by one being over another. Wherefore it is requisite, to the very essence of a law, that it be made’ (he might have added, or at least supported) ‘by the supreme power. Sovereignty and legislature are indeed convertible terms; one cannot subsist without the other.’ 1 Comm. p. 46.",
      "translation_ja": "著者を不当に扱うことがないようにし、また何が私たちをこの「考察へ自然と導く」と考えたのかを示すために、先ほどの説明を含む段落を引いておくとよいだろう。「さらに、国内法とは、国家の最高権力が定める、市民の行動の規則である」。「というのも、先に述べたように、立法とは、ある者がほかの者に対して行いうる、最も大きな優越の行使である。だから、最高権力によって制定されることは」〔少なくとも裏づけられることは、と加えてもよかった〕「法の本質そのものに欠かせない。実際、主権と立法権は、互いに置き換えうる言葉である。一方なしに他方は存在しえない」。『イングランド法釈義』第1巻46頁。",
      "translation_status": "reviewed"
    },

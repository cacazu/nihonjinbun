      "source_text": "XVI. In the same manner, also, it may be conceived, without entering into details, how any single person, born, as all persons are, into a state of perfect subjection to his parents, that is into a state of perfect political society with respect to his parents, may from thence pass into a perfect state of nature; and from thence successively into any number of different states of political society more or less perfect, by passing into different societies.",
      "translation_ja": "第十六節　同じように、細かい話に立ち入らずとも、誰もがそうであるように親に完全に従属する状態で、つまり親との関係では完全な政治社会の状態に生まれた一人の人が、そこから完全な自然状態へ移り、さらに別々の社会に入ることで、完全さの程度が違う政治社会の状態を、いくつでも順に経ていくと考えられる。",

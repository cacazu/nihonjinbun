      ],
      "source_text": "Which is done without any sort of ceremony, the quantities marked in the step with the negative sign, being as so many fluents, which are at a maximum, or a minimum, just as happens to be most convenient.",
      "translation_ja": "ここは何の断りもなく捨てる。その段で負の符号をつけた量は、どれも流量、すなわち変化する量のようなもので、都合がよければ最大になり、また都合がよければ最小になるのだから。",

          "source_sequence": 556,
          "printed_page": "230"
        }
      ],
      "source_text": "The paragraph recited.",
      "translation_ja": "該当の段落を引用する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p002",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n245/mode/1up",
          "source_sequence": 557,
          "printed_page": "230",
          "printed_page_end": "231"
        }
      ],
      "source_text": "II. “Thus far,” says he, “as to the right of the supreme power to make laws; but farther, it is its duty likewise. For since the respective members are bound to conform themselves to the will of the state, it is expedient that they receive directions from the state declaratory of that its will. But since it is impossible, in so great a multitude, to give injunctions to every particular man, relative to each particular action, therefore the state establishes general rules for the perpetual information and direction of all persons, in all points, whether of positive or negative duty. And this, in order that every man may know what to look upon as his own, what as another’s; what absolute and what relative duties are required at his hands; what is to be esteemed honest, dishonest, or indifferent; what degree every man retains of his natural liberty; what he has given up as the price of the benefits of society; and after what manner each person is to moderate the use and exercise of those rights which the state assigns him, in order to promote and secure the public tranquillity.”",
      "translation_ja": "第二節　「最高権力が法を作る権利については、ここまでである」と著者は言う。「だがそれだけでなく、法を作るのは最高権力の義務でもある。それぞれの構成員は国の意志に従う義務があるので、国から、その意志を明らかにする指示を受けることが望ましいからである。しかし、人の数がこれほど多くては、一人ひとりに、個々の行為について命令を下すのは不可能である。そこで国は一般的な規則を設け、するべきことにせよ、してはならないことにせよ、あらゆることについて、すべての人に常に知らせ、指図する。これは、何を自分のものと見なし、何を他人のものと見なすべきか、無条件の義務と他人との関係から生じる義務として何が求められるのか、どんな行いが正しく、どんな行いが不正で、どんな行いがそのどちらでもないと見なされるのかを、誰でも知ることができるようにするためである。また、生まれながらの自由を誰もがどこまで保ち、社会の恩恵を得る代価として何を手放したか、公共の平穏を促し、確保するために、国が与える権利の使用や行使をどのように控えるべきかを、誰もが知るためである」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-margin03",

    {
      "id": "bentham-ch04-p041",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n243/mode/1up",
          "source_sequence": 551,
          "printed_page": "228",
          "printed_page_end": "229"
        }
      ],
      "source_text": "XLI. On the other hand, had the debate been originally and avowedly instituted on the footing of utility, the parties might at length have come to an agreement; or at least to a visible and explicit issue. — “I say, that the mischiefs of the measure in question are to such an amount. — I say, not so, but to a less. — I say, the benefits of it are only to such an amount. — I say, not so, but to a greater.” — This, we see, is a ground of controversy very different from the former. The question is now manifestly a question of conjecture concerning so many future contingent matters of fact: to solve it, both parties then are naturally directed to support their respective persuasions by the only evidence the nature of the case admits of; — the evidence of such past matters of fact as appear to be analogous to those contingent future ones. Now these past facts are almost always numerous: so numerous, that till brought into view for the purpose of the debate, a great proportion of them are what may very fairly have escaped the observation of one of the parties: and it is owing, perhaps, to this and nothing else, that that party is of the persuasion which sets it at variance with the other. Here, then, we have a plain and open road, perhaps, to present reconcilement: at the worst to an intelligible and explicit issue, — that is, to such a ground of difference as may, when thoroughly trodden and explored, be found to lead on to reconcilement at the last. Men, let them but once clearly understand one another, will not be long ere they agree. It is the perplexity of ambiguous and sophistical discourse that, while it distracts and eludes the apprehension, stimulates and inflames the passions.",
      "translation_ja": "第四十一節　一方、初めから功利を土台にすると明言して議論を始めていたら、当事者たちはついに合意に達したか、少なくとも何が争点かを目に見える形で、はっきりと定められたかもしれない。「当の措置の害はこの程度だと私は言う」「いや、それより小さいと私は言う」「その利益はこの程度しかないと私は言う」「いや、それより大きいと私は言う」。これは先ほどのとはまるで違う論争の土台である。今や、今後起こりうるいくつかの事実について、どう見積もるかが問題なのは明らかだ。だからこれを解くには、双方が、問題の性質上認められる唯一の証拠によって、それぞれの確信を支えようとするのが自然である。すなわち、これから起こりうることに似ていると思われる、過去の事実を証拠とする。さて、過去の事実は、たいてい数多い。あまりに多いので、議論のために示されるまでは、そのかなりの部分が、片方の目には入っていなかったとしても無理はない。おそらくそのことだけが、相手とぶつかる確信をその人々が抱いた理由である。ならば、ここには明瞭に開かれた道がある。うまくいけば今すぐ和解へ至り、悪くても理解できる、明確な争点へ至る道である。つまり、分かれ目をしっかり歩いて調べれば、最後には和解へと続くかもしれないような、意見の分かれ目が明らかになる。互いの話が一度はっきり分かれば、人々が合意するまで時間はそうかからない。あいまいでこじつけめいた議論は、その分かりにくさゆえに、頭を惑わせ、意味を捉えにくくする一方で、感情を刺激し、燃え上がらせるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p041-b",

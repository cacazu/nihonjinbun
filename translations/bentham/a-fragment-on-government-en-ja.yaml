          "source_sequence": 427,
          "printed_page": "197"
        }
      ],
      "source_text": "1. By definition, | The British Government = Monarchy + Aristocracy + Democracy.",
      "translation_ja": "1．定義より：イギリスの政府＝君主政＋貴族政＋民主政。",

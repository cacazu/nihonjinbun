      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n217/mode/1up",
          "source_sequence": 462,
          "printed_page": "202",
          "printed_page_end": "203"
        }
      ],
      "source_text": "V. The obscurity in which the first sentence of this paragraph is enveloped, is such, that I know not how to go about bringing it to light, without borrowing a word or two of logicians. Laying aside the preamble, the body of it, viz. “as the power of making laws constitutes the supreme authority, so wherever the supreme authority in any state resides, it is the right of that authority to make laws,” may be considered as constituting that sort of syllogism which logicians call an enthymeme. An enthymeme consists of two propositions; a consequent and an antecedent. “The power of making laws,” says our Author, “constitutes the supreme authority.” This is his antecedent. From hence it is he concludes, that “wherever the supreme authority in any state resides, it is the right of that authority to make laws.” This then is his consequent. Now so it is, that this antecedent, and this consequent, for any difference at least that I can possibly perceive in them, would turn out, were they but correctly worded, to mean precisely the same thing: for, after saying that “the power of making laws constitutes the supreme authority,” to tell us that, for that reason, “the supreme authority” is (or has) the power (or the right) of making laws, is giving us, I take it, much the same sort of information, as it would be to us to be told that a thing is so, because it is so: a sort of a truth which there seems to be no very great occasion to send us upon “discovering, in the end and institution of civil states.” That by the “sovereign power,” he meant “the power of making laws;” this, or something like it, is no more indeed than what he had told us over and over, and over again, with singular energy and anxiety, in his 46th page, in his 49th, and in, I know not how many, pages besides: always taking care, for precision’s sake, to give a little variety to the expression: the words “power” and “authority,” sometimes, seemingly put for the same idea; sometimes seemingly opposed to each other: both of them sometimes denoting the fictitious being, the abstract quality; sometimes the real being or beings, the person or persons supposed to possess that quality. — Let us disentangle the sense from these ambiguities; let us learn to speak distinctly of the persons, and of the quality we attribute to them; and then let us make another effort to find a meaning for this perplexing passage.",
      "translation_ja": "第五節　この段落の最初の文は深い霧に包まれていて、論理学者から言葉を一つ二つ借りなければ、どう明るみに出せるか分からない。前置きはさておき、文の本体、すなわち「法を作る権力が最高の権威をなすからには、どの国でも、最高の権威がどこにあるにせよ、その権威には法を作る権利がある」は、論理学者が省略三段論法と呼ぶ類いの推論と考えてよい。省略三段論法は、結論と前提という二つの命題からなる。著者は「法を作る権力が最高の権威をなす」と言う。これが前提である。そこから、「どの国でも、最高の権威がどこにあるにせよ、その権威には法を作る権利がある」と結論する。これが結論である。ところで、この前提と結論には、少なくとも私に分かるかぎり、まるで違いがない。正確に言い表せば、ぴたりと同じ意味になるからである。「法を作る権力が最高の権威をなす」と言った後、その理由で「最高の権威」が法を作る権力、あるいは権利であるとか、それを持つとか言っても、あることがそうなのは、それがそうだからだと教えるのと変わりはあるまい。そんな真理を、「市民国家が設けられた趣旨と、その成り立ちのうちに見いだす」よう、わざわざ仕向ける必要はなさそうである。「主権」で「法を作る権力」を指す、というか、そういう趣旨のことなら、実際、46頁、49頁、ほかにも数えきれない頁で、著者は並み外れた熱心さと気の配りようで、くり返し、くり返し語ってきたにすぎない。ただし正確を期すためか、表現はいつも少し変えている。「権力」と「権威」は、同じ考えを表すように見えることも、互いに対立するように見えることもある。どちらも、あるときには擬制上の存在、つまり抽象的な性質を表し、別のときには実在する存在、つまり、その性質を持つとされる一人または複数の人を表す。さあ、意味をこうしたあいまいさからほどこう。人々自身と、その人々に帰する性質を、はっきり区別して語ろう。そのうえで、この厄介な一節に意味を見いだせるよう、もう一度努めてみよう。",
      "translation_status": "reviewed"
    },

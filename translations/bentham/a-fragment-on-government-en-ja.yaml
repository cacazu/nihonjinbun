    {
      "id": "bentham-ch05-note123",
      "section_id": "bentham-ch05",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n251/mode/1up",
          "source_sequence": 572,
          "printed_page": "236"
        }
      ],
      "source_text": "Governors in what way subject to political duties notwithstanding their being supreme. I mean for what they do, or omit to do, when acting in a body: in that body in which, when acting, they are supreme. Because for any thing any of them do separately, or acting in bodies that are subordinate, they may any of them be punished without any disparagement to their supremacy. Not only any may be, but many are: it is what we see examples of every day.",
      "translation_ja": "最高の統治者であっても、どんな仕方で政治上の義務を負うか。ここで問題にしているのは、最高権力を持つ機関の一員として行動するときに、彼らが何をしたか、あるいは何をしなかったかである。というのも、彼らが個別に、あるいは下位の団体の一員としてすることであれば、誰が罰せられても、最高の地位を傷つけないからだ。誰もが罰を受けうるばかりでなく、実際、多くの者が罰せられる。その例は毎日のように目にする。",
      "translation_status": "reviewed"
    },

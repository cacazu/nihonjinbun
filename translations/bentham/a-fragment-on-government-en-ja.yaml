    {
      "id": "bentham-ch04-p016",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n225/mode/1up",
          "source_sequence": 488,
          "printed_page": "210",
          "printed_page_end": "212"
        }
      ],
      "source_text": "XVI. To return to the paragraph which it was the more immediate business of this chapter to examine: — Were the path of obscurity less familiar to our Author, one should be tempted to imagine he had struck into it on the particular occasion before us, in the view of extricating himself from this dilemma. A discourse thus prudently indeterminate might express enough to keep fair with the rulers of the earth, without setting itself in direct array against the prejudices of the people. Viewed by different persons, it might present different aspects: to men in power it might recommend itself, and that from the first, under the character of a practical lesson of obedience for the use of the people; while among the people themselves it might pass muster, for a time at least, in quality of a string of abstract scientific propositions of jurisprudence. It is not till some occasion for making application of it should occur, that its true use and efficacy would be brought to light. The people, no matter on what occasion, begin to murmur, and concert measures of resistance. Now then is the time for the latent virtues of this passage to be called forth. The book is to be opened to them, and in this passage they are to be shewn, what of themselves, perhaps, they would never have observed, a set of arguments curiously strung together and wrapped up, in proof of the universal expedience, or rather necessity, of submission: a necessity which is to arise, not out of the reflection that the probable mischiefs of resistance are greater than the probable mischiefs of obedience; not out of any such debateable consideration; but out of a something that is to be much more cogent and effectual: to wit, a certain metaphysico-legal impotence, which is to beget in them the sentiment, and answer all the purposes of a natural one. Armed, and full of indignation, our malcontents are making their way to the royal palace. In vain. A certain estoppel being made to bolt out upon them, in the manner we have seen, by the force of our Author’s legal engineering, their arms are to fall, as it were by enchantment, from their hands. To disagree, to clamour, to oppose, to take back, in short, their wills again, is now, they are told, too late: it is what cannot be done: their wills have been put in hotchpot along with the rest: they have “united,” — they have “consented,” — they have “submitted.” — Our Author having thus put his hook into their nose, they are to go back as they came, and all is peace. An ingenious contrivance this enough: but popular passion is not to be fooled, I doubt, so easily. Now and then, it is true, one error may be driven out, for a time, by an opposite error: one piece of nonsense by another piece of nonsense: but for barring the door effectually and for ever against all error and all nonsense, there is nothing like the simple truth.",
      "translation_ja": "第十六節　本章が直接に検討すべき段落に戻ろう。あいまいさへの脇道が著者にそれほどなじみ深くなかったなら、この板挟みを切り抜けるため、今回に限ってわざわざ入り込んだのではないかと思うところだ。こうして用心深くどちらとも取れるようにした論考なら、人民の先入観に正面から逆らうことなく、世の統治者の機嫌を損ねないだけのことは言える。誰が見るかで、違う顔を見せるかもしれない。権力者には、人民に実際に服従を教える教訓として、初めから気に入られる。他方、当の人民の間では、少なくとも一時は、法学の抽象的な命題が連なったものとして通用するかもしれない。実際に当てはめる機会が来て初めて、本当の使い道と効き目が明るみに出る。人民が、何がきっかけであれ、不平を言い始め、抵抗について協議する。そこで、この一節に潜む効き目を引き出す時が来る。彼らの前で本を開き、自分たちだけならおそらく気づきもしなかったものを、この一節の中に見せてやる。服従はどんな場合にも得策である、いや、必要であることを証明するため、巧みに連ねられ、包み隠された一連の論証である。その必要は、抵抗で予想される害が服従で予想される害より大きい、などと考えることからは生まれない。そんな議論の余地のある考慮からではなく、それよりずっと人を動かし、よく効くはずの何かから生まれる。すなわち、形而上学と法律を掛け合わせたある種の無力さであって、彼らに本当に力がないかのような気持ちを起こさせ、実際に力がない場合とまったく同じ効果を出すのである。武器を手にし、憤りに満ちた不満分子が王宮へ向かう。だが無駄である。前に見たように、著者の法律のからくりで、一度言ったことを覆せないという禁反言が彼らの前に飛び出すと、まるで魔法にかかったように武器が手から落ちる。意見を異にすること、騒ぎ立てること、反対すること、要するに自分たちの意志を取り戻すことは、もう手遅れで、できないと言われる。彼らの意志は、ほかの意志と一つに混ぜられた。彼らは「結び合い」、「同意し」、「服従した」のである。こうして著者に鼻をつながれると、来たとおりに帰っていって、すべては平穏に収まる。なかなか巧妙な仕組みではある。だが人民の激情は、そうたやすくだませまい。確かに、ときには一つの誤りを、逆の誤りで一時追い出せる。たわごと一つを、別のたわごとで追い出せる。しかしあらゆる誤りとたわごとに対して、きっぱりと永遠に戸を閉ざすなら、飾り気のない真実に勝るものはない。",
      "translation_status": "reviewed"
    },

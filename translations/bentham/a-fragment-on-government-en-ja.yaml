      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n227/mode/1up",
          "source_sequence": 490,
          "printed_page": "212"
        }
      ],
      "source_text": "XVII. After all these pains taken to inculcate unreserved Submission, would any one have expected to see our Author himself among the most eager to excite men to disobedience? and that, perhaps, upon the most frivolous pretences? in short, upon any pretence whatsoever? Such, however, upon looking back a little, we shall find him. I say, among the most eager; for other men, at least the most enlightened advocates for liberty, are content with leaving it to subjects to resist, for their own sakes, on the footing of permission: this will not content our Author, but he must be forcing it upon them as a point of duty.",
      "translation_ja": "第十七節　無条件の服従を教え込もうとこれほど苦労した当の著者が、誰にも劣らず熱心に人々を不服従に駆り立てるなどと、誰か予想しただろうか。しかもひょっとすると、ひどく取るに足りない口実で、いや、何であれ口実さえあれば駆り立てるとは。だが少しさかのぼれば、そういう著者が見つかる。誰にも劣らず熱心に、と言った。ほかの人、少なくとも自由を擁護する人のうち、最もよく考えた人は、自分たちのために抵抗することは許されるとして、臣民に任せておくだけで満足する。著者はそれでは満足せず、抵抗を義務として臣民に押しつけずにはいられないのである。",
      "translation_status": "reviewed"
    },

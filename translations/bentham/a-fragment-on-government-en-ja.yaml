          "source_sequence": 143,
          "printed_page": "128"
        }
      ],
      "source_text": "III. After treating of ‘Law in general,’ of the ‘Law of Nature,’ ‘Law of Revelation,’ and ‘Law of Nations,’ branches of that imaginary whole, our Author comes at length to what he calls ‘Law municipal:’ that sort of Law, to which men in their ordinary discourse would give the name of Law without addition; the only sort perhaps of them all (unless it be that of Revelation) to which the name can, with strict propriety, be applied: in a word, that sort which we see made in each nation, to express the will of that body in it which governs. On this subject of Law Municipal he sets out, as a man ought, with a definition of the phrase itself; an important and fundamental phrase, which stood highly in need of a definition, and never so much as since our Author has defined it.",
      "translation_ja": "第三節　著者はまず「法一般」を、それからその想像上の全体から枝分かれした「自然法」「啓示による法」「国際法」を扱い、ついに「国内法」と呼ぶものにたどり着く。日常の話では、誰もが何もつけずにただ「法」と呼ぶ種類の法である。啓示による法を別とすれば、厳密に言ってその名が当てはまるのは、ひょっとすると、これだけかもしれない。ひと言でいえば、それぞれの国において、その国を治める主体の意志を表すために作られるのを、私たちが見ている法のことである。この国内法を扱うとき、著者はしかるべく、その語そのものの定義から始める。大切な根本の語であり、定義する必要は大いにあった。もっとも、その必要がこれほど大きくなったのは、著者が定義して以来のことである。",
      "translation_status": "reviewed"
    },

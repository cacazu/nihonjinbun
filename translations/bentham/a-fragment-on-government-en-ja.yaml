      ],
      "source_text": "18. Therefore, by [16] and [17] | The British Government is all-perfect, Q. E. D.",
      "translation_ja": "18．ゆえに［16］および［17］より：イギリスの政府はすべての点で完全である。証明終わり。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p020-scholium",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n213/mode/1up",
          "source_sequence": 446,
          "printed_page": "198"
        }
      ],
      "source_text": "Scholium. After the same manner it may be proved to be all-weak, all-foolish, and all-knavish.",
      "translation_ja": "補注。同じやり方で、イギリスの政府がまったく無力で、まったく愚かで、まったく不誠実だと証明することもできる。",

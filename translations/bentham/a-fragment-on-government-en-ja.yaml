          "url": "https://archive.org/details/cu31924030442077/page/n252/mode/1up",
          "source_sequence": 577,
          "printed_page": "237"
        }
      ],
      "source_text": "Obscured again by the next sentence — the Censor’s part confounded with that of the Historian.",
      "translation_ja": "次の文でまた不明瞭になる。批評者と歴史家の役割を混同する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p010",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n252/mode/1up",
          "source_sequence": 578,
          "printed_page": "237",
          "printed_page_end": "238"
        }
      ],
      "source_text": "X. What particular institutions our Author wished to see established in this view — what particular duties he would have found for the legislature under this general head of duty, is not very apparent: though it is what should have appeared more precisely than it does, ere his meaning could be apprehended to any purpose. What increases still the difficulty of apprehending it, is a practice which we have already had more than once occasion to detect him in, — a kind of versatility, than which nothing can be more vexatious to a reader who makes a point of entering into the sentiments of his Author. He sets out with the word duty in his mouth; and, in the character of a Censor, with all due gravity begins talking to us of what ought to be. ’Tis in the midst of this lecture that our Proteus slips aside; puts on the historian; gives an insensible turn to the discourse; and, without any warning of the change, finishes with telling us what is. Between these two points, indeed, the is, and the ought to be, so opposite as they frequently are in the eyes of other men, that spirit of obsequious quietism that seems constitutional in our Author, will scarce ever let him recognise a difference. ’Tis in the second sentence of the paragraph that he observes that “it is expedient that they” (the people) “receive directions from the state” (meaning the governing body) “declaratory of that its will.” ’Tis in the very next sentence that we learn from him, that what it is thus “expedient” that the state should do, it does do. “But since it is impossible in so great a multitude, to give particular injunctions to every particular man relative to each particular action, therefore,” says he “the State establishes” (does actually establish) “general rules” (the state generally, any state, that is to say, that one can mention, all states, in short, whatever do establish) “general rules for the perpetual information and direction of all persons in all points, whether of positive or of negative duty.” Thus far our Author; so that, for aught appears, whatever he could wish to see done in this view is done. Neither this state of our own, nor any other, does he wish to see do any thing more in the matter than he sees done already; nay, nor than what is sure to be done at all events: so that happily the duty he is here so forward to lay on his superiors will not sit on them very heavy. Thus far is he from having any determinate instructive meaning in that part of the paragraph in which, to appearance, and by accident, he comes nearest to it.",
      "translation_ja": "第十節　著者がこの観点からどんな個々の制度を設けてほしかったのか、あるいは義務というこの大きなくくりのもとで、立法機関にどんな個々の義務を見いだしたのかは、あまり明らかでない。著者が何を言いたかったかを実のある形で理解するには、もっと正確に示してほしいところである。それをさらに理解しにくくしているのは、すでに何度も姿をとらえた、ある癖である。筆者の考えを理解しようとする読者に、これほど不愉快なことはあるまいと思える、一種の変わり身である。著者はまず義務を口にし、もっともらしく厳粛な態度で、批評者の立場から、どうあるべきかを語り始める。ところが、その講義の途中で、変幻自在のプロテウスよろしく、すっと横へ外れる。歴史家になりすまし、気づかれないように話の向きを変え、変わったとは一言も言わず、実際にどうであるかを私たちに告げて終わる。現にそうであることと、そうあるべきこと。この二つは、ほかの人の目には、しばしば互いにまるで違っている。だが、著者には、何にも逆らわず今のままでよしとする生来の気質があるらしく、その違いを認めることはめったにない。段落の第二文で、「人民は、国から」〔ここでは統治機関を指す〕「その意志を明らかにする指示を受けることが望ましい」と指摘する。ところが、すぐ次の文で、国がそうするのが「望ましい」ということを、国は現にしている、と私たちは教えられる。「人がこれほど多くては、一人ひとりに個々の行為について別々に命令を下すことは不可能である。そこで」と著者は言う。「国は一般的な規則を設ける」。つまり、現に設けるのである。国一般が、挙げうるどの国も、要するに、どんな国であれ、どの国も規則を設けて、「するべきことにせよ、してはならないことにせよ、あらゆることについて、すべての人に常に知らせ、指図する」。以上が著者の言葉である。これを見るかぎり、著者がそうした観点からやってほしいと思うことは、もう何もかも行われている。わが国にもほかの国にも、すでに行われている以上のことをしてほしいとは思っていない。どうせ必ず行われること以上は望まない。だから幸い、ここで著者があれほど熱心に上の人々へ課す義務は、その人々にとって大して重くはならない。見た目には、しかも偶然に、最も意味がありそうなところでさえ、はっきりと何かを教える意味を持つには、これほど遠いのである。",
      "translation_status": "reviewed"
    },

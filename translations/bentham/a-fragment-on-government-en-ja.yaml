          "printed_page": "208",
          "printed_page_end": "209"
        }
      ],
      "source_text": "XII. Let us now return and pick up those other passages which we supposed to have a respect to the same design that seems to be in view in this. First comes the short introductory paragraph that ushers in the whole digression: a paragraph which, however short, and however imperfect with respect to the purpose of giving a general view of the contents of those which follow it, was, in despite of method, to expatiate upon this subject. Upon this subject, indeed, he does expatiate with a force of argument and energy of expression which nothing can withstand. “This,” it begins, “will necessarily lead us into a short enquiry concerning the nature of society and civil government.” — This is all the intimation it gives of the contents of those paragraphs we have examined. Upon this before us it touches in energetic terms; but more energetic than precise. — “And the natural” (it continues) “and inherent right that belongs to the sovereignty of a state,” (natural right, observe, that belongs to the sovereignty of a political society) “wherever that sovereignty be lodged, of making and enforcing laws.”",
      "translation_ja": "第十二節　さて、ここにあると見られるのと同じ狙いに関わると考えた、ほかの箇所へ戻って拾い上げよう。まず、脱線全体の出だしに置かれた短い導入の段落である。短くて後に続く諸段落のあらましを示すという目的はろくに果たさないのに、順序もおかまいなしに、この主題だけは詳しく論じるのである。確かにこの主題については、抗しがたいほど力強い論証と力のこもった表現で、話を広げる。「このことは必然的に」と、その段落は始まる。「社会と市民政府の本性についての短い考察へと私たちを導く」。私たちが検討してきた段落の内容について、これが示唆のすべてである。これから検討する段落については、力を込めて触れるが、正確さより力が勝っている。「また、国家の主権がもともと自然に備える」と続ける。政治社会の主権に属する自然の権利である点に注意してほしい。「その主権がどこに置かれようと、法を作り、実施する権利についての考察へと導く」。",
      "translation_status": "reviewed"
    },

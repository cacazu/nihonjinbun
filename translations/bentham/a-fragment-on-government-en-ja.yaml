          "url": "https://archive.org/details/cu31924030442077/page/n251/mode/1up",
          "source_sequence": 574,
          "printed_page": "236"
        }
      ],
      "source_text": "VIII. The word duty, then, if applied to persons spoken of as Supreme governors, is evidently applied to them in a sense which is figurative and improper: nor therefore are the same conclusions to be drawn from any propositions in which it is used in this sense, as might be drawn from them if it were used in the other sense, which is its proper one.",
      "translation_ja": "第八節　したがって最高の統治者として語られる人々に義務という語を当てはめるなら、明らかに比喩的な、本来の用法でない意味で使うことになる。だから、その意味で使った命題から、もう一方の、本来の意味で使ったなら引き出せたはずの結論と、同じものを引き出すことはできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-margin09",

          "source_sequence": 444,
          "printed_page": "198"
        }
      ],
      "source_text": "17. But by definition | All-powerful + all-wise + all-honest = all-perfect.",
      "translation_ja": "17．ところで定義により：全能＋全知＋まったく誠実＝すべての点で完全。",

    {
      "id": "bentham-ch01-margin06",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

          "source_sequence": 158,
          "printed_page": "131"
        }
      ],
      "source_text": "I. The first object which our Author seems to have proposed to himself in the dissertation we are about to examine, is to give us an idea of the manner in which Governments were formed. This occupies the first paragraph, together with part of the second: for the typographical division does not seem to quadrate very exactly with the intellectual. As the examination of this passage will unavoidably turn in great measure upon the words, it will be proper the reader should have it under his eye.",
      "translation_ja": "第一節　これから検討する論考で、著者が第一の目的としたらしいのは、政府がどう成立したかを示すことである。この話題は最初の段落と、第二段落の一部を占める。印刷上の区切りは、話の上での区切りとはぴたりとは合わないようである。検討にあたっては、どうしても、問題の大半は言葉そのものにかかってくる。そこでまず、読者の目の前に当の文章を置いておこう。",

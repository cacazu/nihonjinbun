    {
      "id": "bentham-ch01-p038-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n171/mode/1up",
          "source_sequence": 259,
          "printed_page": "156",
          "printed_page_end": "157"
        }
      ],
      "source_text": "That compacts, by whomsoever entered into, ought to be kept; — that men are bound by compacts, are propositions which men, without knowing or enquiring why, were disposed universally to accede to. The observance of promises they had been accustomed to see pretty constantly enforced. They had been accustomed to see Kings, as well as others, behave themselves as if bound by them. This proposition, then, “that men are bound by compacts;” and this other, “that, if one party performs not his part, the other is released from his,” being propositions which no man disputed, were propositions which no man had any call to prove. In theory they were assumed for axioms: and in practice they were observed as rules. If, on any occasion, it was thought proper to make a shew of proving them, it was rather for form’s sake than for any thing else: and that, rather in the way of memento or instruction to acquiescing auditors, than in the way of proof against opponents. On such an occasion the common place retinue of phrases was at hand; Justice, Right Reason required it, the Law of Nature commanded it, and so forth; all which are but so many ways of intimating that a man is firmly persuaded of the truth of this or that moral proposition, though he either thinks he need not, or finds he can’t, tell why. Men were too obviously and too generally interested in the observance of these rules to entertain doubts concerning the force of any arguments they saw employed in their support. — It is an old observation how Interest smooths the road to Faith.",
      "translation_ja": "誰が結んだのであれ契約は守られるべきで、人は契約に拘束される。こうした考えには、誰もが理由を知らず、尋ねもせず、同意する気でいた。約束がほぼいつも守らせられているのを見慣れていた。ほかの人と同じように、国王たちも約束に拘束されるかのように振る舞うのを見慣れていた。それゆえ、「人は契約に拘束される」、また「一方が自分の約束を果たさないなら、他方も自分の約束を果たさなくてよい」という命題には誰も異議を唱えず、誰にも証明が求められなかった。理論では公理とされ、実際には規則として守られた。時に証明するそぶりを見せるのが適切だと思われたとしても、もっぱら形式のためだった。反対者に証明するためというより、同意している聞き手に思い出させたり教えたりするためだった。そんな時には、お決まりの言い回しがそろっていた。正義が求め、正しい理性が求め、自然法が命じる、などなど。どれも、何かの道徳的命題を固く真と信じながら、理由は言うまでもないと思うか、言えないと分かっているということを示す、さまざまな言い方にすぎない。この規則が守られれば、誰にとってもあまりに明白な利益があったから、人々は、規則を支える理屈をどんなものでも疑おうとしなかった。利害が信じることへの道をならすとは、昔からの観察である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note72",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"

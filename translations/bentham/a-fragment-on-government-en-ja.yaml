      "source_text": "In the Seventh Chapter of the First Book. The King has ‘attributes;’ he possesses ‘ubiquity;’ he is ‘all-perfect and immortal.’ These childish paradoxes, begotten upon servility by false wit, are not more adverse to manly sentiment, than to accurate apprehension. Far from contributing to place the institutions they are applied to in any clear point of view, they serve but to dazzle and confound, by giving to Reality the air of Fable. It is true, they are not altogether of our Author’s invention: it is he, however, that has revived them, and that with improvements and additions. One might be apt to suppose they were no more than so many transient flashes of ornament: it is quite otherwise. He dwells upon them in sober sadness. The attribute of ‘ubiquity’ in particular, he lays hold of, and makes it the basis of a chain of reasoning. He spins it out into consequences: he makes one thing ‘follow’ from it, and another thing be so and so ‘for the same reason:’ and he uses emphatic terms, as if for fear he should not be thought to be in earnest. ‘From the ubiquity,’ says our Author [1 Comm. p. 260] ‘it follows, that the King can never be nonsuit; for a nonsuit is the desertion of the suit or action by the non-appearance of the plaintiff in Court.’—‘For the same reason also the King is not said to appear by his Attorney, as other men do; for he always appears in contemplation of Law in his own proper person.’ This is the case so soon as you come to this last sentence of the paragraph. For so long as you are at the last but two, ‘it is the regal office, and not the royal person, that is always present.’ All this is so drily and so strictly true, that it serves as the groundwork of a metaphor that is brought in to embellish and enliven it. The King, we see, is, that is to say is not, present in Court. The King’s Judges are present too. So far is plain downright truth. These Judges, then, speaking metaphorically, are so many looking-glasses, which have this singular property, that when a man looks at them, instead of seeing his own face in them, he sees the King’s. ‘His Judges,’ says our Author, ‘are the mirror by which the King’s image is reflected.’",
      "translation_ja": "『釈義』第1巻第7章では、王は「属性」を備え、「どこにでもいる」ことができ、「完全無欠で不死」だという。この子どもじみた逆説は、まやかしの機知が卑屈さにはらませたもので、毅然とした心に反するばかりか、正確な理解にも反する。それを当てはめた制度を分かりやすく見せるどころか、現実に作り話の装いをかぶせ、人の目をくらませ、混乱させるだけである。どれも著者の発明というわけではなくとも、これを復活させ、手を入れ、あれこれ足したのは著者である。ほんの一瞬きらめく飾りが幾つかあるだけだと思う人がいるかもしれない。とんでもない。著者は大まじめにそれを長々と論じる。とりわけ「どこにでもいる」という属性を取り上げ、ひと続きの推論の土台とする。そこから幾つも結論を引き出し、あることはそこから「帰結し」、別のことは「同じ理由で」しかじかとなる、と書く。冗談と思われては困るとでもいうように、強い言葉を選んでいる。「どこにでもいることから」と著者は言う（『釈義』第1巻260頁）。「王について訴えが不出頭を理由に却下されることは決してないと分かる。原告が法廷に姿を現さず、訴訟や請求を放棄したときに、却下されるからである。また同じ理由で、王はほかの者のように代理人を通じて出廷すると言われない。法の考えでは、王はいつも本人が自ら出廷するのである」。この段落の最後の文まで来れば、そういうことになる。その二文前を読んでいる間は、「いつもそこにいるのは王の地位であって、王本人ではない」。この叙述はあまりに無味乾燥であまりに厳密な真理なので、彩りと生気を添えようとして持ち込む比喩の土台となる。ご覧のとおり、法廷に王はいる。つまり、いない。王の裁判官たちも、そこにいる。ここまでは混じりけのない、まったくの真実である。そこで、比喩で言えば、この裁判官たちはそれぞれ鏡ということになる。その鏡には変わった性質があり、誰かがのぞいても、自分の顔ではなく王の顔が見える。著者に言わせれば、「王の姿を映す鏡が、王の裁判官たちである」。",

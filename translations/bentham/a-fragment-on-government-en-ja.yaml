      "source_text": "P. 50.",
      "translation_ja": "『イングランド法釈義』50頁。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin12",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n206/mode/1up",
          "source_sequence": 404,
          "printed_page": "191"
        }
      ],
      "source_text": "Superiority of “experience” how far a proof of superiority of wisdom.",
      "translation_ja": "「経験」が多いことは、知恵に勝ることの証拠にどこまでなるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p012",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n206/mode/1up",
          "source_sequence": 405,
          "printed_page": "191",
          "printed_page_end": "192"
        }
      ],
      "source_text": "XII. How it is that a member of an aristocracy, as such, is, of all things, to have attained more experience than the member of a democracy, our Author has not told us; nor what it is this experience is to consist of. Is it experience of things preparatory to, but different from, the business of governing? This should rather go by the name of knowledge. Is it experience of the business itself of governing? Let us see. For the member of the one body, as of the other, there must be a time when he first enters upon this business. They both enter upon it, suppose on the same day. Now then is it on that same day that one is more experienced in it than the other? or is it on that day ten years?",
      "translation_ja": "第十二節　どうしてまた、貴族政の構成員が、その立場にあるだけで、民主政の構成員より多くの経験を積むことになるのか、著者は教えてくれなかった。その経験が何からなるのかも教えてくれなかった。統治そのものとは違うがその準備になる事柄の経験なのか。それなら、むしろ知識と呼ぶべきである。統治という仕事そのものの経験なのか。では見てみよう。どちらの議会の構成員にも、この仕事に初めて就く時がある。二人が同じ日に仕事に就くとしよう。さて、一人が他方より経験豊かだというのは、その当日なのか。それとも十年後のその日なのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin13",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n207/mode/1up",
          "source_sequence": 406,
          "printed_page": "192"
        }
      ],
      "source_text": "How far attributable to aristocracies in general.",
      "translation_ja": "一般に貴族政にはどこまで経験が多いと言えるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p013",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n207/mode/1up",
          "source_sequence": 407,
          "printed_page": "192"
        }
      ],
      "source_text": "XIII. Those indeed who recollect what we observed but now, may answer without hesitation, — on that day ten years. The reason was there given. It is neither more nor less, than that want of leisure which the bulk of the numerous members of a Democracy must necessarily labour under, more than those of an Aristocracy. But of this, what intimation is there to be collected, from any thing that has been suggested by our Author?",
      "translation_ja": "第十三節　確かに、先ほどの所見を覚えている人なら、ためらいなく十年後のその日だと答えるだろう。理由はすでに挙げた。民主政の大勢の構成員の大半が、貴族政の構成員よりも、どうしても暇に乏しいことにほかならない。しかし、これについて著者が何か示唆したところから、どんな手がかりが得られるだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note95",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n207/mode/1up",
          "source_sequence": 408,
          "printed_page": "192"
        }
      ],
      "source_text": "V. supra, par. 9.",
      "translation_ja": "前掲第九節を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin14",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n207/mode/1up",
          "source_sequence": 409,
          "printed_page": "192"
        }
      ],
      "source_text": "How far to our House of Lords in particular.",
      "translation_ja": "とりわけわが国の貴族院にどこまで経験が多いと言えるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p014",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n207/mode/1up",
          "source_sequence": 410,
          "printed_page": "192",
          "printed_page_end": "193"
        }
      ],
      "source_text": "XIV. So much with respect to Aristocracies in general. It happens also by accident, that that particular branch of our own government to which he has given the name of the Aristocratical, — the House of Lords, — has actually greater opportunities of acquiring the qualification of experience, than that other branch, the House of Commons, to which he has given the name of the democratical. But to what is this owing? not to any thing in the characteristic natures of those two bodies, not to the one’s being Aristocratical, and the other Democratical; but to a circumstance, entirely foreign and accidental, which we shall see presently. But let us observe his reasoning. The House of Lords, he says, is an assembly that behoves to have more wisdom in it, than the House of Commons. This is the proposition. Now for the proof. The first is an Aristocratical assembly; the second a Democratical. An Aristocratical assembly has more experience than a Democratical; and on that account more wisdom. Therefore the House of Lords, as was to be proved, has more wisdom than the House of Commons. Now, what the whole of the argument rests upon, we may observe, is this fact, that an Aristocratical assembly, as such, has more experience than a Democratical one; but this, with Aristocratical assemblies in general, we see, is not, for any reason that our Author has given us, the case. At the same time with respect to our House of Lords in particular, in comparison with the House of Commons, it does happen to be the case, owing to this simple circumstance: the members of the House of Lords, when once they begin to sit, sit on for life: those of the House of Commons only from seven years to seven years, or it may happen, less.",
      "translation_ja": "第十四節　貴族政一般についてはここまでである。たまたま、著者が貴族政の部門と名づけたわが国の政府の一部門、すなわち貴族院にも、経験という資質を身につける機会が、民主政の部門と名づけたもう一つの部門、庶民院より、実際に多い。しかしそれは何によるのか。二つの議会をそれぞれ特徴づける本性によるのではない。一方が貴族政的で、他方が民主政的だからではない。間もなく見るように、これとはまったく無関係な、偶然の事情による。では著者の推論を見てみよう。貴族院は、庶民院より多くの知恵があってしかるべき議会だ、と言う。これが命題である。では証明に入ろう。前者は貴族政の議会で、後者は民主政の議会である。貴族政の議会は、民主政の議会より経験が多く、したがって知恵も多い。よって貴族院は庶民院より知恵が多い。これが証明すべきことだった。さて、議論全体は、貴族政の議会が、それだけで民主政の議会より経験豊かだという事実にかかっている。だが貴族政の議会一般については、著者が私たちに与えたどの理由からも、そうはならない。一方、わが国の貴族院については、とりわけ庶民院と比べると、確かにそうなっている。それはこういう単純な事情による。貴族院議員は一度議席に就けば終身そのままだが、庶民院議員は七年ごと、場合によってはそれより短い期間で任期が切れるからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin15",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n208/mode/1up",
          "source_sequence": 411,
          "printed_page": "193"
        }
      ],
      "source_text": "What is to be understood by the word “experience”.",
      "translation_ja": "「経験」という言葉で何を指すのか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p015",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n208/mode/1up",
          "source_sequence": 412,
          "printed_page": "193"
        }
      ],
      "source_text": "XV. In speaking, however, in this place, of experience, I would rather be understood to mean opportunity of acquiring experience, than experience itself. For actual experience depends upon other concurrent causes.",
      "translation_ja": "第十五節　ただし、ここで私が経験と言ったのは、経験そのものよりも、経験を積む機会のことだと受け取ってもらいたい。実際の経験には、ほかの原因もあわせて働くからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin16",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n208/mode/1up",
          "source_sequence": 413,
          "printed_page": "193"
        }
      ],
      "source_text": "Opportunity of experience not the sole cause of wisdom.",
      "translation_ja": "経験を積む機会だけが知恵をもたらすのではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p016",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n208/mode/1up",
          "source_sequence": 414,
          "printed_page": "193",
          "printed_page_end": "194"
        }
      ],
      "source_text": "XVI. It is, however, from superiority of experience alone, that our Author derives superiority of wisdom. He has, indeed, the proverb in his favour: “Experience,” it has been said of old, “is the Mother of Wisdom:” be it so; — but then Interest is the Father. There is even an Interest that is the Father of Experience. Among the members of the House of Commons, though none so poor as to be illiterate, are many whose fortunes, according to the common phrase, are yet to make. The fortunes of those of the House of Lords (I speak in general) are made already. The members of the House of Commons may hope to be members of the House of Lords. The members of the House of Lords have no higher House of Lords to rise to. Is it natural for those to be most active who have the least, or those who have the most interest to be so? Are the experienced those who are the least, or those who are the most active? Does experience come to men when asleep, or when awake? Is it the members of the House of Lords that are the most active, or of the House of Commons? To speak plain, is it in the House of Lords that there is most business done, or in the House of Commons? Was it after the fish was caught that the successor of St. Peter used the net, or was it before? In a word is there most wisdom ordinarily where there is least, or where there is most to gain by being wise?",
      "translation_ja": "第十六節　しかし著者は、経験に勝ることだけから、知恵にも勝ると導く。確かに著者には、ことわざが味方する。昔から「経験は知恵の母」と言う。それはいい。だが利害は、その父である。それどころか、利害のなかには経験の父にあたるものさえある。庶民院の議員には、読み書きもできないほど貧しい者こそいないが、よく言うように、これから身を立てる人が多い。一般に、貴族院の議員はもう身を立てている。庶民院議員は、貴族院議員になることを望める。貴族院議員には、さらにその上に昇るための貴族院はない。あまり得るもののない人と、最も多く得るもののある人では、どちらが熱心に働くのが自然か。経験を積んでいるのは、最も働かない人か、最もよく働く人か。経験が人のもとに来るのは、眠っているときか、起きているときか。より熱心に働くのは貴族院議員か、庶民院議員か。はっきり言えば、仕事をより多くこなすのは貴族院か、庶民院か。聖ペテロの後継者が網を使ったのは、魚が捕れた後か、その前か。ひと言でいえば、普通、賢くあることで得るものが最も少ないところに、知恵が最も多くあるのか。それとも、最も多く得るところにあるのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note96",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n209/mode/1up",
          "source_sequence": 415,
          "printed_page": "194"
        }
      ],
      "source_text": "Every body has heard the story of him who, from a fisherman, was made Archbishop, and then Pope. While Archbishop, it was his custom every day, after dinner, to have a fishing net spread upon his table, by way of a memento, as he used to say, of the meanness of his original. This farcical ostentation of humility was what, in those days, contributed not a little to the increase of his reputation. Soon after his exaltation to St. Peter’s chair, one of his intimates was taking notice to him, one day, when dinner was over, of the table’s not being decked as usual. “Peace,” answered the Holy Father, “when the fish is caught, there is no occasion for the net.”",
      "translation_ja": "漁師から大主教に、そして教皇になった人の話は、誰でも聞いたことがある。大主教だったころ、毎日食事の後で、食卓に漁網を広げさせるのが習慣だった。本人がいつも言ったところでは、卑しい生まれを忘れないためである。このおどけた謙遜の見せびらかしは、当時、その評判を高めるのに少なからず役立った。聖ペテロの座に就いて間もないある日、食事が終わると、親しい者の一人が、いつものように食卓が飾られていないと指摘した。「静かに」と教皇は答えた。「魚が捕れたら、網はもういらない」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note97",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n209/mode/1up",
          "source_sequence": 416,
          "printed_page": "194"
        }
      ],
      "source_text": "In the House of Commons itself, is it by the opulent and independent Country gentlemen that the chief business of the House is transacted, or by aspiring, and perhaps needy Courtiers? The man who would persevere in the toil of Government, without any other reward than the favour of the people, is certainly the man for the people to make choice of. But such men are at best but rare. Were it not for those children of Corruption we have been speaking of, the business of the state, I doubt, would stagnate.",
      "translation_ja": "庶民院そのものでも、院の主な仕事をするのは、裕福で自立した地方の地主紳士か、それとも出世を望み、おそらく暮らしにも余裕のない宮廷人か。人民の好意以外には何の報いがなくとも、統治の骨の折れる仕事を続けようとする人は、確かに人民が選ぶべき人である。だが、そんな人はせいぜいごく少ない。これまで述べてきた腐敗の申し子たちがいなければ、国の仕事は滞るのではないかと思う。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin17",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n210/mode/1up",
          "source_sequence": 417,
          "printed_page": "195"
        }
      ],
      "source_text": "Mediatory caution not the peculiar province of the Lords.",
      "translation_ja": "仲裁に必要な慎重さは貴族院だけの役目ではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p017",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n210/mode/1up",
          "source_sequence": 418,
          "printed_page": "195"
        }
      ],
      "source_text": "XVII. A word or two more with respect to the characteristic qualifications, as our Author states them, of the higher assembly of our legislature. Experience is, in virtue of their being an aristocratical assembly, to afford them wisdom: thus far we were arrived before. But he now pushes the deduction a step farther. — Wisdom is to afford them “circumspection and mediatory caution;” qualifications which it seems as if we should see nothing of, were it not for them. Let us now put a case. The business, indeed, that originates in the House of Lords is, as things stand, so little, that our Author seems to forget that there is any. However, some there is. A bill then originates with the Lords, and is sent down to the Commons. — As to “circumspection” I say nothing; that, let us hope, is not wanting to either House. But whose province is “mediatory caution,” now?",
      "translation_ja": "第十七節　著者が述べる、わが立法府の上院に特有の資質について、もう少し述べよう。貴族政の議会だから経験があり、その経験が知恵をもたらす。先ほどはここまで来た。ところが今度は、著者は推論をもう一歩進める。知恵が「熟慮と仲裁に必要な慎重さ」をもたらすというのだ。どうやら、上院がなければ、こんな資質はまるでお目にかかれないらしい。では、一つの場合を考えよう。たしかに今のところ、貴族院から始まる仕事はあまりに少なく、著者はそういう仕事があることさえ忘れているようだ。だがいくらかはある。貴族院で法案が出て、庶民院へ送られたとしよう。「熟慮」について私は何も言うまい。どちらの院にも欠けないと期待しよう。しかし、このとき「仲裁に必要な慎重さ」はどちらの役目なのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin18",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n210/mode/1up",
          "source_sequence": 419,
          "printed_page": "195"
        }
      ],
      "source_text": "The Democratical branch of our Legislature upon our Author’s principles, not distinguishable from the Aristocratical.",
      "translation_ja": "著者の原則では立法府の民主政部門と貴族政部門を区別できない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p018",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n210/mode/1up",
          "source_sequence": 420,
          "printed_page": "195",
          "printed_page_end": "196"
        }
      ],
      "source_text": "XVIII. Thus much concerning these two branches of our legislature, so long as they continue what, according to our Author’s principles, they are at present: the House of Lords the Aristocratical branch: the House of Commons the Democratical. A little while and we shall see them so; but again a little while, perhaps, and we shall not see them so. By what characteristic does our Author distinguish an Aristocratical legislative body from a Democratical one? By that of number: by the number of the persons that compose them: by that, and that alone: for no other has he given. Now, therefore, to judge by that, the House of Lords, at present, indeed, is the Aristocratical branch: the House of Commons in comparison at least with the other, the Democratical. Thus far is well. But should the list of nobility swell at the rate we have sometimes seen it, there is an assignable period, and that, perhaps, at no very enormous distance, at which the assembly of the Lords will be more numerous than that of the Commons. Which will then be the Aristocratical branch of our Legislature? Upon our Author’s principles, the House of Commons. Which the Democratical? The House of Lords.",
      "translation_ja": "第十八節　わが立法府のこの二部門については、著者の原則から見て現在の姿を保つかぎり、これで十分である。貴族院が貴族政の部門で、庶民院が民主政の部門だ。この先しばらくはそう見えるだろうが、それからもうしばらくすると、そうは見えなくなっているかもしれない。著者はどんな特徴で、民主政の立法機関から貴族政の立法機関を区別するのか。数、すなわち構成員の人数によってである。ほかに何も示していないから、人数だけで決まる。したがって、人数で判断するなら、確かに現在、貴族院は貴族政の部門である。庶民院は、少なくとも貴族院に比べれば、民主政の部門である。ここまではよい。しかし、これまで時に見てきた速さで貴族の名簿が膨らめば、ある時点で、おそらくそれほど遠くない時点で、貴族院の議員の数は庶民院を上回る。それでは、わが立法府の貴族政の部門はどちらになるのか。著者の原則なら庶民院になる。民主政の部門はどちらか。貴族院になる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin19",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n211/mode/1up",
          "source_sequence": 421,
          "printed_page": "196"
        }
      ],
      "source_text": "All-perfection of the British Constitution mathematically demonstrated.",
      "translation_ja": "イギリスの国制がすべてに完全であることを数学的に証明する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p019",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n211/mode/1up",
          "source_sequence": 422,
          "printed_page": "196",
          "printed_page_end": "197"
        }
      ],
      "source_text": "XIX. The final cause we are to observe, and finishing exploit, the portus et sabbatum, as Lord Bacon might perhaps have called it, of this sublime and edifying dissertation, is this demonstration, he has been giving us, of the perfection of the British Form of Government. This demonstration (for by no less a title ought it to be called) is founded, we may have observed, altogether upon the properties of numbers: properties, newly discovered indeed, and of an extraordinary complexion, moral properties; but properties, however, so it seems, of numbers. ’Tis in the nature then of numbers we shall find these characteristic properties of the three Forms of Government, if anywhere. Now the properties of numbers are universally allowed to be the proper subject of that mode of demonstration which is called mathematical. The proof our Author has given has therefore already in it the essence of such a demonstration. To be complete at all points, it wants nothing but the form. This deficiency is no other than what an under-rate workman might easily supply. A mere technical operation does the business. That humble task it shall be my endeavour to perform. The substantial honour I ascribe wholly to our Author, to whom only it is most due.",
      "translation_ja": "第十九節　この崇高でためになる論考の最終目的にしてしめくくりの大仕事、ベーコン卿なら「港に着いて安息するところ」とでも呼んだかもしれないものが、イギリスの政体の完全さを著者がここまで証明してきた箇所である。これを「証明」より低い名で呼ぶべきではない。そして、気づいたかもしれないが、その証明は、すっかり数の性質に基づいている。たしかに、新たに発見された風変わりな性質、すなわち道徳的な性質だが、それでも数の性質であるらしい。それなら、三つの政体を特徴づける性質がどこかにあるとして、それは数の本性の中にある。さて数の性質こそ、数学的と呼ばれる証明方法の正当な対象だと、誰もが認めている。だから著者の証明には、すでに数学的な証明の本質がある。申し分なく完成させるのに足りないのは、形式だけである。この欠けたところなら、たいした腕もない職人でも容易に補える。技術的な操作だけで用は足りる。このささやかな仕事は、私が果たしてみよう。肝心の栄誉はすべて著者のものであり、著者ただ一人にふさわしい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note98",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

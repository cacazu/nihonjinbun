          "url": "https://archive.org/details/cu31924030442077/page/n221/mode/1up",
          "source_sequence": 472,
          "printed_page": "206",
          "printed_page_end": "207"
        }
      ],
      "source_text": "X. Let us now try what we can make of the remainder of the paragraph. Being ushered in by the word “for,” it seems to lay claim to the appellation of an argument. This argument, setting out, as we have seen, without an object, seems however to have found something like one at last, as if it had picked it up by the way. This object, if I mistake not, is to persuade men, that the supreme power, (that is the person or persons in use to exercise the supreme power in a state) ought, in all points without exception, to be obeyed. What men intend, he says, to do when they are in a state, is to act, as if they were but “one man.” But one man has but one will belonging to him. What they intend therefore, or what they ought to intend, (a slight difference which our Author seems not to be well aware of) is, to act as if they had but one will. To act as if they had but one will, the way is, for them to “join” all their wills “together.” To do this, the most obvious way would be to join them “naturally:” but, as wills will not splice and dovetail like deal boards, the only feasible way is to join them “politically.” Now the only way for men to join their wills together politically, is for them all to consent to submit their wills to the will of one. This one will, to which all others are to be submitted, is the will of those persons who are in use to exercise the supreme power; whose wills again, when there happens to be many of them, have, by a process of which our Author has said nothing, been reduced (as we must suppose) into one already. So far our Author’s argument. The above is the substance of it fairly given; not altogether with so much ornament, indeed, as he has given it, but, I trust, with somewhat more precision. The whole concludes, we may observe, with our Author’s favourite identical proposition, or something like it, now for the twentieth time repeated.",
      "translation_ja": "第十節　さて、残りの部分から何が読み取れるか試してみよう。「というのも」で始まるのだから、論証と呼んでもらいたいらしい。この論証は、見てきたように、何を論証するのかもなく出発したものの、最後にはそれらしいものを見つけたようだ。いわば途中で拾ってきたのである。間違いでなければ、それは、最高権力、つまりその国で最高権力を日ごろ行使する一人または複数の人に、例外なく、あらゆる点で従うべきだと、人々に納得させるという狙いである。著者によれば、国家の中にいる人々は、まるで「一人の人」のように行動するつもりでいる。ところが一人の人には、意志は一つしかない。そこで、人々がするつもりのこと、あるいはするつもりであるべきことは、意志が一つしかないかのように行動することである。著者はこの小さな違いに、あまり気づいていないようだ。意志が一つしかないかのように行動するには、みなの意志を「一つに結び合わせる」ことだ。これをする最も分かりやすいやり方は、「自然に」結び合わせることだろう。だが意志は、松板のように継いだり組んだりはできない。実行しうるのは「政治的に」結び合わせることだけである。さて、人々が意志を政治的に結び合わせるには、全員が、一つの意志に自分たちの意志を従わせることに同意するしかない。ほかのすべての意志が従うこの一つの意志は、最高権力を日ごろ行使する人々の意志である。その人々が何人もいるなら、それらの意志もまた、著者が何一つ語らなかった過程を経て、すでに一つにまとまっていたと考えるほかない。ここまでが著者の議論である。以上にその大筋を公平に示した。確かに著者ほど飾り立てはしなかったが、いくらか正確ではあると思う。全体の結びには、著者のお気に入りの同義反復か、それに似たものが、これで二十回目だが、また出てくる。",
      "translation_status": "reviewed"
    },

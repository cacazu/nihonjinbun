    {
      "id": "bentham-ch04-note107",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n228/mode/1up",
          "source_sequence": 494,
          "printed_page": "213"
        }
      ],
      "source_text": "It is that of murder. In the word here chosen there lurks a fallacy which makes the proposition the more dangerous as it is the more plausible. It is too important to be altogether past over: at the same time that a slight hint of it, in this place, is all that can be given. Murder is killing under certain circumstances. — Is the human law then to be allowed to define, in dernier ressort, what shall be those circumstances, or is it not? If yes, the case of a “human law allowing or enjoining us to commit it,” is a case that is not so much as supposable: if no, adieu to all human laws: to the fire with our Statutes at large, our Reports, our Institutes, and all that we have hitherto been used to call our law books; our law books, the only law books we can be safe in trusting to, are Puffendorf and the Bible.",
      "translation_ja": "その例は殺人罪である。ここで選ばれた言葉には、命題がもっともらしく聞こえるだけに、いっそう危険にするごまかしが潜む。まったく取り上げずに通り過ぎるには重要すぎるが、ここでは軽く触れるのがせいぜいである。殺人罪とは、ある事情のもとで人を殺す行為を指す。では、その事情が何であるかを最終的に定めるのを、人定法に許すのか、許さないのか。許すなら、「人定法が殺人罪に当たる行為を許したり、私たちに命じたりする」という場合は、仮定することさえできない。許さないなら、すべての人定法とお別れである。わが国の法令集、判例集、法学提要、これまで法律書と呼び慣わしてきたものを、みな火に投げ込んでしまえ。私たちが安心して頼れる唯一の法律書は、プーフェンドルフの著作と聖書だということになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin19",

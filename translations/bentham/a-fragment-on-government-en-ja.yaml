          "source_sequence": 576,
          "printed_page": "236"
        }
      ],
      "source_text": "IX. This explanation, then, being premised; — understanding myself to be using the word duty in its improper sense, the proposition that it is the duty of the legislature to spread abroad, as much as possible, the knowledge of their will among the people, is a proposition I am disposed most unreservedly to accede to. If this be our Author’s meaning, I join myself to him heart and voice.",
      "translation_ja": "第九節　そこでこの説明を前提とし、義務という語を私も本来の用法でない意味で使うことにすれば、立法機関には、その意志をできるかぎり広く人民に知らせる義務があるという主張に、私は何の留保もなく賛成する。これが著者の言いたいことなら、心から同意し、私も声を合わせよう。",
      "translation_status": "reviewed"

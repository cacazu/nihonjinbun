        }
      ],
      "source_text": "VI. A general statement of the topics touched upon in the digression we are about to examine has been given above. It will be found, I trust, a faithful one. It will not be thought, however, much of a piece, perhaps, with the following, which our Author himself has given us. ‘This,’ (says he, meaning an explanation he had been giving of a part of the definition above spoken of) ‘will naturally lead us into a short enquiry into the nature of society and civil government; and the natural inherent right that belongs to the sovereignty of a state, wherever that sovereignty be lodged, of making and enforcing Laws.’",
      "translation_ja": "第六節　これから検討する脱線で取り上げられる主題の概略は、すでに述べた。忠実な説明と認めてもらえるだろう。もっとも、著者が自ら示した次の説明とは、あまり似ていないと思われるかもしれない。「このことは」と著者は言う。先に触れた定義の一部について、直前までしていた説明を指す。「自然と私たちを、次の短い考察へと導く。社会と市民政府とはどういう性質のものか。そして、主権がどこに置かれるにせよ、国の主権には、法律を定め実施する、もともと備わった自然の権利があるが、それはどういうものか」。",
      "translation_status": "reviewed"
    },

      "source_text": "1 Comm. 140. I would not be altogether positive, how far it was he meant this persuasion should extend itself in point of time: whether to those institutions only that happened to be in force at the individual instant of his writing: or whether to such opposite institutions also as, within any given distance of time from that instant, either had been in force, or were about to be. His words are as follow: ‘All these rights and liberties it is our birthright to enjoy entire; unless where the Laws of our country have laid them under necessary restraints. Restraints in themselves so gentle and moderate, as will appear upon further enquiry, that no man of sense or probity would wish to see them slackened. For all of us have it in our choice to do every thing that a good man would desire to do; and are restrained from nothing, but what would be pernicious either to ourselves or our fellow citizens.’ If the Reader would know what these rights and liberties are, I answer him out of the same page, they are those, ‘in opposition to one or other of which every species of compulsive tyranny and oppression must act, having no other object upon which it can possibly be employed.’ The liberty, for example, of worshipping God without being obliged to declare a belief in the XXXIX Articles, is a liberty that no ‘good man,’—‘no man of sense or probity,’ ‘would wish’ for.",
      "translation_ja": "『イングランド法釈義』第1巻140頁。この確信を、時間の上で著者がどこまで及ぼすつもりだったのかは、断言しないでおこう。執筆したまさにその瞬間にたまたま効力があった制度だけか。それとも、その瞬間からどれほどか前に効力があった、または、どれほどか後に効力を持つ、正反対の制度まで含めるのか。著者の言葉は次のとおりである。「こうした権利と自由を余すところなく享受するのは、われわれが生まれながらに持つ権利である。ただし、わが国の法が必要な制約を設けている場合を除く。さらに調べれば分かるように、制約そのものも穏やかで節度があり、分別や誠実さのある人なら、緩めてほしいと思わないほどである。善良な人ならしたいと思うことは、誰もが自分の意志でみな行うことができる。私たち自身や同胞の市民に害を与えること以外には、何も禁じられていないのだから」。こうした権利と自由とはそもそも何かと読者が問いかけるなら、私は同じ頁から答えよう。「強制を伴うどんな圧政や抑圧も、そのどれかに逆らって行われる。それ以外に圧政や抑圧が向かいうる対象はない」。ところで、たとえば英国国教会の三十九箇条を信じると宣言するよう強いられずに、神を礼拝する自由は、「善良な人」も「分別や誠実さのある人」も誰一人、「望まない」自由なのである。",
      "translation_status": "reviewed"
    },

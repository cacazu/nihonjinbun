    },
    {
      "id": "bentham-ch05-p012",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n254/mode/1up",
          "source_sequence": 583,
          "printed_page": "239",
          "printed_page_end": "240"
        }
      ],
      "source_text": "XII. All these leading points, I say, of legislative œconomy, with as many points of detail subservient to each as a meditation not unassiduous has suggested, I might enforce, were it necessary, by our Author’s oracular authority. For nothing less than what has been mentioned, I trust, is necessary, in order that every man may be made to know, in the degree in which he might and ought to be made to know, what (in our Author’s words) “to look upon as his own, what as another’s; what absolute and what relative duties are required at his hands; what is to be esteemed honest, dishonest, or indifferent; what degree every man retains of his natural liberty; what he has given up as the price of the benefits of society; and after what manner each person is to moderate the use and exercise of those rights which the state assigns him, in order to promote and secure the public tranquillity.” In taking my leave of our Author, I finish gladly with this pleasing peroration: a scrutinizing judgment, perhaps, would not be altogether satisfied with it; but the ear is soothed by it, and the heart is warmed.",
      "translation_ja": "第十二節　繰り返すが、この立法の仕組みの要点すべてを、一つひとつについて、相応に丹念に考えて思いついた細かな工夫をできるかぎり添えたうえで、必要なら著者のお告げの権威によって、実行を強く求めることができる。実際、一人ひとりに、知らせることができ、知らせるべき程度まで、次のことを知らせるには、今述べたことのすべてが必要だと思うからである。著者の言い方を借りれば、「何を自分のものと見なし、何を他人のものと見なすべきか。無条件の義務と他人との関係から生じる義務として何が求められるのか。どんな行いが正しく、どんな行いが不正で、どんな行いがそのどちらでもないと見なされるのか。生まれながらの自由を誰もがどこまで保ち、社会の恩恵を得る代価として何を手放したか。そして、公共の平穏を促し、確保するために、国が与える権利の使用や行使を、一人ひとりがどう控えるべきか」。著者に別れを告げるとき、この耳に心地よい結びで終われるのはうれしい。厳しく吟味すれば完全に納得はできないかもしれないが、耳には穏やかに響き、心は温まる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-margin13",

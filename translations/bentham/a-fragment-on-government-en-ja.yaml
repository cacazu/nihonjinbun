      ],
      "source_text": "The first sentence examined. The most obvious sense of it nugatory.",
      "translation_ja": "最初の文を検討する。いちばん素直な意味では何も言っていない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p003",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n246/mode/1up",
          "source_sequence": 559,
          "printed_page": "231"
        }
      ],
      "source_text": "III. Still as obscure, still as ambiguous as ever. The “supreme power” we may remember, according to the definition so lately given of it by our Author, and so often spoken of, is neither more nor less than the power to make laws. Of this power we are now told that it is its “duty” to make laws. Hence we learn — what? — that it is its “duty” to do what it does; to be, in short, what it is. This then is what the paragraph now before us, with its apparatus of “fors,” and “buts,” and “sinces” is designed to prove to us. Of this stamp is that meaning, at least, of the initial sentence, which is apparent upon the face of it.",
      "translation_ja": "第三節　相変わらず不明瞭で、相変わらずあいまいである。思い出せば、「最高権力」とは、著者がつい先ごろ示し、何度も口にしてきた定義によれば、法を作る権力にほかならない。今度はこの権力には、法を作る「義務」があると聞かされる。ここから何を学ぶのか。いつもしていることをするのがその「義務」であり、要するに、そのものであることがその「義務」だと学ぶ。つまり、目の前の段落は、「というのも」や「しかし」や「なぜなら」を取りそろえて、このことを私たちに証明しようとしているのである。少なくとも最初の文を見たままに読めば、こういう意味になる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-margin04",
      "section_id": "bentham-ch05",

    {
      "id": "bentham-ch01-p036",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n168/mode/1up",
          "source_sequence": 252,
          "printed_page": "153",
          "printed_page_end": "154"
        }
      ],
      "source_text": "XXXVI. As to the Original Contract, by turns embraced and ridiculed by our Author, a few pages, perhaps, may not be ill bestowed in endeavouring to come to a precise notion about its reality and use. The stress laid on it formerly, and still, perhaps, by some, is such as renders it an object not undeserving of attention. I was in hopes, however, till I observed the notice taken of it by our Author, that this chimera had been effectually demolished by Mr. Hume. I think we hear not so much of it now as formerly. The indestructible prerogatives of mankind have no need to be supported upon the sandy foundation of a fiction.",
      "translation_ja": "第三十六節　著者が取り入れたりあざけったりする原初契約について、それが本当にあったのか、何の役に立つのかをはっきり理解するために、何頁か費やしても無駄ではあるまい。昔はずいぶん重く見られ、今もそう考える人がいるかもしれないのだから、注意を向けるに値する。しかし著者が取り上げるのを見るまでは、この空想はヒューム氏がすっかり打ち砕いたものと期待していた。今は昔ほど耳にしないと思う。誰にも奪えない人類の権利を、擬制という砂地の上に支える必要はない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note70",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n168/mode/1up",
          "source_sequence": 253,
          "printed_page": "153",
          "printed_page_end": "155"
        }
      ],
      "source_text": "1. Notion of the Original Contract overthrown by Mr. Hume. In the third Volume of his Treatise on Human Nature.\nOur Author, one would think, had never so much as opened that celebrated book: of which the criminality in the eyes of some, and the merits in the eyes of others, have since been almost effaced by the splendour of more recent productions of the same pen. The magnanimity of our Author scorned, perhaps, or his circumspection feared, to derive instruction from an enemy: or, what is still more probable, he knew not that the subject had been so much as touched upon by that penetrating and acute metaphysician, whose works lie so much out of the beaten track of Academic reading. But here, as it happens, there is no matter for such fears. Those men, who are most alarmed at the dangers of a free enquiry; those who are most intimately convinced that the surest way to truth is by hearing nothing but on one side, will, I dare answer almost, find nothing of that which they deem poison in this third volume. I would not wish to send the Reader to any other than this, which, if I recollect aright, stands clear of the objections that have of late been urged, with so much vehemence, against the work in general. As to the two first, the Author himself, I am inclined to think, is not ill disposed, at present, to join with those who are of opinion, that they might, without any great loss to the science of Human Nature, be dispensed with. The like might be said, perhaps, of a considerable part, even of this. But, after all retrenchments, there will still remain enough to have laid mankind under indelible obligations. That the foundations of all virtue are laid in utility, is there demonstrated, after a few exceptions made, with the strongest force of evidence: but I see not, any more than Helvetius saw, what need there was for the exceptions.\n2. History of a mind perplexed by Fiction. For my own part, I well remember, no sooner had I read that part of the work which touches on this subject, than I felt as if scales had fallen from my eyes. I then, for the first time, learnt to call the cause of the people the cause of Virtue.\nPerhaps a short sketch of the wanderings of a raw but well-intentioned mind, in its researches after moral truth, may, on this occasion, be not unuseful: for the history of one mind is the history of many. The writings of the honest, but prejudiced, Earl of Clarendon, to whose integrity nothing was wanting, and to whose wisdom little, but the fortune of living something later; and the contagion of a monkish atmosphere; these, and other concurrent causes, had lifted my infant affections on the side of despotism. The Genius of the place I dwelt in, the authority of the state, the voice of the Church in her solemn offices; all these taught me to call Charles a Martyr, and his opponents rebels. I saw innovation, where indeed innovation, but a glorious innovation, was, in their efforts to withstand him. I saw falsehood, where indeed falsehood was, in their disavowals of innovation. I saw selfishness, and an obedience to the call of passion, in the efforts of the oppressed to rescue themselves from oppression. I saw strong countenance lent in the sacred writings to monarchic government: and none to any other. I saw passive obedience deep stamped with the seal of the Christian Virtues of humility and self-denial.\nConversing with Lawyers, I found them full of the virtues of their Original Contract, as a recipe of sovereign efficacy for reconciling the accidental necessity of resistance with the general duty of submission. This drug of theirs they administered to me to calm my scruples. But my unpractised stomach revolted against their opiate. I bid them open to me that page of history in which the solemnization of this important contract was recorded. They shrunk from this challenge; nor could they, when thus pressed, do otherwise than our Author has done, confess the whole to be a fiction. This, methought, looked ill. It seemed to me the acknowledgment of a bad cause, the bringing a fiction to support it. “To prove fiction, indeed,” said I, “there is need of fiction; but it is the characteristic of truth to need no proof but truth. Have you then really any such privilege as that of coining facts? You are spending argument to no purpose. Indulge yourselves in the licence of supposing that to be true which is not, and as well may you suppose that proposition itself to be true, which you wish to prove, as that other whereby you hope to prove it.” Thus continued I unsatisfying, and unsatisfied, till I learnt to see that utility was the test and measure of all virtue; of loyalty as much as any; and that the obligation to minister to general happiness, was an obligation paramount to and inclusive of every other. Having thus got the instruction I stood in need of, I sat down to make my profit of it. I bid adieu to the original contract: and I left it to those to amuse themselves with this rattle, who could think they needed it.",
      "translation_ja": "1．ヒューム氏による原初契約説の論駁。『人間本性論』第三巻にある。\nどうやら著者は、かの有名な本を開いたことさえないらしい。ある人々にはいかがわしく、別の人々には優れた本だと映ったが、いずれの印象も、同じ筆者のもっと新しく華々しい著作のために、ほとんどかき消されている。著者は気位が高くて敵に教えを乞うのを潔しとしなかったのか、用心深くてそれを恐れたのだろうか。それよりは、この洞察に富む鋭い形而上学者がこの問題に触れたことさえ知らなかった、と考えるほうがもっとありそうである。その著作は大学で普通読むものとはかけ離れているからだ。ところがこの場合、たまたまそんな恐れはいらない。自由な探究は危険だと誰よりも心配する人々も、片方の意見しか聞かないのが真理への近道だと心底信じる人々も、この第三巻には毒だと思うようなものは何も見つけないだろう。ほとんど請け合ってもよい。読者にこれ以外の巻を勧める気はない。記憶が正しければ、近頃この著作全体に向けられた激しい異議は、この巻には当てはまらない。最初の二巻なら、それを省いても人間本性の研究に大きな損はないと言う人々に、今ではヒューム本人も同調する気があるのではないかと思う。この巻のかなりの部分も、同じように言えるかもしれない。しかし削れるところを全部削っても、人類がいつまでも恩に着るには十分なものが残る。あらゆる徳が有用性に基づくことが、いくつかの例外を認めたうえで、これ以上ないほど説得力のある証拠で明らかにされているからだ。ただ、エルヴェシウスにも私にも、例外がなぜ必要なのかは分からない。\n2．擬制に惑わされた一人の心の来歴。私自身について言えば、この話題に触れた箇所を読むなり、目から鱗が落ちたような気がしたのをよく覚えている。そのとき初めて、民衆のための大義を、徳のための大義と呼べるようになった。\n道徳の真理を求めて、未熟だが悪気のない一人の人間がどう迷ったかを、ここで短く描いても無駄ではあるまい。一人の心の来歴は、多くの人の心の来歴だからだ。正直だが偏見のあるクラレンドン伯の著作。彼の誠実さには欠けるところがなく、その知恵に足りなかったものも、もう少し後の時代に生きる幸運ぐらいであった。それに修道院めいた空気の影響。こうしたものや、ほかの事情が重なり、幼かった私の心を専制の側につかせた。私の住んだ土地の気風、国家の権威、荘厳な典礼で響く教会の声。そのすべてが、チャールズを殉教者、その敵対者たちを反逆者と呼ぶよう私に教えた。彼らが王に立ち向かう努力に、私は新しい制度を持ち込む企てを見た。実際そうだったが、輝かしい革新であった。それを否定する彼らの言葉に、私は偽りを見た。実際、そこには偽りがあった。抑圧された人々がみずからを抑圧から救おうとする努力に、私は利己心と激情につき従う姿を見た。聖書は君主政を強く支持し、ほかの政体はどれも支持しないと見た。受動的服従には、謙遜と克己というキリスト教の徳の印が深く押されていると見た。\n法律家と話すと、彼らは原初契約の効能を盛んに説いた。時に抵抗が必要であることと、一般に服従の義務があることを両立させる特効薬だと言う。私の疑いを鎮めようと、その薬を飲ませてきた。しかし慣れない私の胃は、その眠り薬を受けつけなかった。これほど大切な契約が正式に結ばれたと記録する歴史の頁を開いて見せてくれ、と私は言った。彼らはこの求めから退き、そこまで迫られると、著者がしたのと同じように、すべて擬制だと認めるほかなかった。これはまずい、と私は思った。擬制を支えに持ち出すのは、自分の大義が正しくないと認めるのも同然に見えた。「なるほど、作り話を証明するには作り話がいる。しかし真理の特徴は、真理以外の証拠を必要としないことだ。では皆さんには、事実をでっちあげる特権が本当にあるのか。どれだけ議論をしても無駄である。真でないものを真と仮定してよいなら、証明に使おうとする別の命題をそう仮定しても、証明したい当の命題自体を真と仮定しても、同じではないか」。こうして人を納得させられず、自分も納得できずにいた。そしてようやく、有用性があらゆる徳を判定する基準であり尺度であって、それは忠誠の徳でも変わらないと分かった。人々全体の幸福に仕える義務が、ほかのすべての義務に優先し、それらを含むとも分かった。必要としていた教えが得られたので、私は腰を据えてそれを自分に役立てることにした。原初契約には別れを告げ、このガラガラで遊ぶのは、まだ必要と思う人々に任せた。",
      "translation_status": "reviewed"
    },
    {

      ],
      "source_text": "Let us reverse the tablet. While with this freedom I expose our Author’s ill deserts, let me not be backward in acknowledging and paying homage to his various merits: a justice due, not to him alone, but to that Public, which now for so many years has been dealing out to him (it cannot be supposed altogether without title) so large a measure of its applause.",
      "translation_ja": "札を裏返してみよう。著者の非難されるところをこれだけ自由に明るみに出す以上、さまざまな長所を認め、敬意を払うことにも、けちではありたくない。それが公正であるのは、著者に対してだけではなく、これほど長い年月にわたって、これほどの喝采を惜しまず送ってきた世間に対しても、同じである。著者にまるで喝采を受ける資格がなかったとは思えないのだから。",

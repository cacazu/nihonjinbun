        }
      ],
      "source_text": "V. What then is this same executive power? I doubt our Author would not find it a very easy matter to inform us. “Why not?” says an objector — “is it not that power which in this country the King has in addition to his share in the legislative?” Be it so: the difficulty for a moment is staved off. But that it is far enough from being solved, a few questions will soon shew us. This power, is it that only which the King really has, or is it all that he is said to have? Is it that only which he really has, and which he exercises, or is it that also, which although he be said to have it, he neither does exercise, nor may exercise? Does it include judiciary power or not? If it does, does it include the power of making as well particular decisions and orders, as general, permanent, spontaneous regulations of procedure, such as are some of those we see made by judges? Doth it include supreme military power, and that as well in ordinary as in a time of martial law? Doth it include the supreme fiscal power; and, in general, that power which, extending as well over the public money as over every other article of public property, may be styled the dispensatorial? Doth it include the power of granting patents for inventions, and charters of incorporation? Doth it include the right of making bye-laws in corporations? And is the right of making bye-laws in corporations the superior right to that of conferring the power to make them, or is it that there is an executive power that is superior to a legislative? This executive again, doth it include the right of substituting the laws of war to the laws of peace; and vice versa, the laws of peace to the laws of war? Doth it include the right of restraining the trade of subjects by treaties with foreign powers? Doth it include the right of delivering over, by virtue of the like treaties, large bodies of subjects to foreign laws? — He that would understand what power is executive and not legislative, and what legislative and not executive, he that would mark out and delineate the different species of constitutional powers, he that would describe either what is, or what ought to be the constitution of a country, and particularly of this country, let him think of these things.",
      "translation_ja": "第五節　では、この執行権とは何か。著者が私たちに教えるのは、それほどたやすくあるまい。「どうしてですか。わが国で、王が立法の分担分に加えて持つ権力のことではありませんか」と異を唱える人がいる。それでもよい。これで一時、難問は先に延びる。だが解決にはほど遠い。二、三質問すればすぐ分かる。王が実際に持つ権力だけなのか、それとも持つとされる権力がすべて入るのか。王が実際に持ち、行使する権力だけなのか。それとも、持つとはされるが、行使もせず、行使することも許されない権力まで含むのか。司法権は入るのか。入るなら、個別の裁定や命令を出す権力と、裁判官が作る規則の一部に見られるような、一般的で恒久的な手続規則を、自発的に作る権力との両方が入るのか。最高軍事権は、平常時も戒厳時も含めて入るのか。最高の財政権と、公金だけでなく他のあらゆる公有財産にも及ぶ、広く処分権と呼べるものが入るのか。発明について特許を与え、法人設立について特許状を授ける権力は入るのか。法人の内部規則を定める権利は入るのか。その規則を定める権利は、この権力を授ける権利よりも上にあるのか。それとも立法権より上にある執行権があるということか。さらに執行権には、平時の法を戦時の法に、逆に戦時の法を平時の法に切り替える権利が入るのか。外国との条約によって臣民の貿易を制限する権利は入るのか。同様の条約によって、大勢の臣民を外国の法に服させる権利は入るのか。何が立法権でなく執行権なのか、また何が執行権でなく立法権なのかを知りたい人、国制のもとでの権力を種類ごとに分けて描き出したい人、また、ある国、とりわけこの国の国制の現状やあるべき姿を説明したい人には、これらを考えてもらいたい。",
      "translation_status": "reviewed"
    },
    {

          "source_sequence": 155,
          "printed_page": "130"
        }
      ],
      "source_text": "VIII. Be this as it may, the contents of the dissertation before us, taken as I have stated them, will furnish us with the matter of five chapters:—one, which I shall entitle ‘Formation of Government’—a second, ‘Forms of Government’—a third, ‘British Constitution’—a fourth, ‘Right of the Supreme Power to make Laws’—a fifth, ‘Duty of the Supreme Power to make Laws.’",
      "translation_ja": "第八節　いずれにせよ、目の前の論考の内容を私が説明したとおりに分ければ、五つの章にまとめられる。第一は「政府の成立」、第二は「政体」、第三は「イギリスの国制」、第四は「最高権力が法を作る権利」、第五は「最高権力が法を作る義務」と題することにする。",
      "translation_status": "reviewed"
    },

          "url": "https://archive.org/details/cu31924030442077/page/n115/mode/1up",
          "source_sequence": 27,
          "printed_page": "100"
        }
      ],
      "source_text": "Laws ought to be scrutinized with freedom.",
      "translation_ja": "法律は自由な検討に付されるべきである",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p016",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n115/mode/1up",
          "source_sequence": 28,
          "printed_page": "100",
          "printed_page_end": "101"
        }
      ],
      "source_text": "If, on the one hand, a hasty and undiscriminating condemner of what is established, may expose himself to contempt; on the other hand, a bigoted or corrupt defender of the works of power, becomes guilty, in a manner, of the abuses which he supports: the more so if, by oblique glances and sophistical glosses, he studies to guard from reproach, or recommend to favour, what he knows not how, and dares not attempt, to justify. To a man who contents himself with simply stating an institution as he thinks it is, no share, it is plain, can justly be attributed (nor would any one think of attributing to him any share) of whatever reproach, any more than of whatever applause the institution may be thought to merit. But if not content with this humbler function, he takes upon him to give reasons in behalf of it, reasons whether made or found by him, it is far otherwise. Every false and sophistical reason that he contributes to circulate, he himself is chargeable with: nor ought he to be holden guiltless even of such as, in a work where fact not reason is the question, he delivers as from other writers without censure. By officiously adopting them he makes them his own, though delivered under the names of the respective Authors: not much less than if delivered under his own. For the very idea of a reason betokens approbation: so that to deliver a remark under that character, and that without censure, is to adopt it. A man will scarcely, therefore, without some note of disapprobation, be the instrument of introducing, in the guise of a reason, an argument which he does not really wish to see approved. Some method or other he will take to wash his hands of it: some method or other he will take to let men see that what he means to be understood to do, is merely to report the judgment of another, not to pass one of his own. Upon that other then he will lay the blame: at least he will take care to repel it from himself. If he omits to do this, the most favourable cause that can be assigned to the omission is indifference: indifference to the public welfare—that indifference which is itself a crime.",
      "translation_ja": "現にあるものを、よく考えもせず何でも非難する人は、軽蔑されるかもしれない。他方、権力が作ったものを偏見や私心から擁護する人は、その人が支持する弊害に、いわば自らも加担したことになる。正当化の仕方が分からず、試みる勇気もないものを、ほのめかしや詭弁めいた説明によって、非難から守り、あるいは人の好意を引きつけようと努める場合は、なおさらだ。ある制度がどうなっていると思うかを、ありのまま述べるだけの人に、その制度が受けるべき非難の一端を負わせられないのは、明らかである。誰もそうは考えないだろう。その制度への賞賛を分け与えたりしないのと同じである。だが、この控えめな仕事に満足せず、自分で考え出したのであれ、どこかで見つけたのであれ、制度を擁護する理由を挙げようとするなら、事情はまったく違う。広める手助けをした誤った理由や詭弁は、一つ残らず本人の責任である。理由でなく事実を取り扱う著作でさえ、他の著者の言葉として何の批判もなく持ち出したものについては、責任を免れるべきではない。出しゃばって借りてくれば、実際にはそれぞれの著者の名で伝えても、本人のものになる。自分の名で述べたのと、ほとんど変わらない。「理由」として挙げること自体が、もっともだと認めるしるしだからである。それとして批判もなく紹介すれば、引き受けたことになる。だから人は普通、本心では認めてもらいたくない議論を、理由らしく紹介するとき、何かしら反対のしるしを添えるだろう。何か手を打って自分の責任ではないと知らせ、述べたのは他人の判断の報告にすぎず、自分が判断を下したのではないと、分かるようにするだろう。責めはその相手に帰し、少なくとも自分にかからないようにするはずだ。それを怠るなら、最も好意的に見ても、原因は無関心、すなわち公共の福利への無関心である。これはそれ自体が罪である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p017",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n116/mode/1up",
          "source_sequence": 29,
          "printed_page": "101"
        }
      ],
      "source_text": "It is wonderful how forward some have been to look upon it as a kind of presumption and ingratitude, and rebellion, and cruelty, and I know not what besides, not to allege only, nor to own, but to suffer any one so much as to imagine, that an old-established law could in any respect be a fit object of condemnation. Whether it has been a kind of personification that has been the cause of this, as if the Law were a living creature, or whether it has been the mechanical veneration for antiquity, or what other delusion of the fancy, I shall not here enquire. For my part, I know not for what good reason it is that the merit of justifying a law when right should have been thought greater, than that of censuring it when wrong. Under a government of Laws, what is the motto of a good citizen? To obey punctually; to censure freely.",
      "translation_ja": "古くからある法にも、非難されてしかるべき点があるかもしれない。そう唱えたり認めたりするどころか、誰かがそんなことを想像するのを許しただけで、一種のうぬぼれ、恩知らず、反逆、残酷、その他何とまで呼ぶつもりか知らないが、そう早合点する人がいるのには驚く。法が生き物ででもあるかのように擬人化したせいか、古ければ何でも無条件で拝むせいか、それとも何か別の思い込みのせいか、ここでは問わない。私には、正しい法を擁護することの方が、誤った法を批評することよりも、手柄が大きいと考えられるだけの理由は分からない。法の下で治められる社会で、よい市民の標語とは何か。よく守り、自由に批評することである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p018",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n116/mode/1up",
          "source_sequence": 30,
          "printed_page": "101"
        }
      ],
      "source_text": "Thus much is certain; that a system that is never to be censured, will never be improved: that if nothing is ever to be found fault with, nothing will ever be mended: and that a resolution to justify every thing at any rate, and to disapprove of nothing, is a resolution which, pursued in future, must stand as an effectual bar to all the additional happiness we can ever hope for; pursued hitherto would have robbed us of that share of happiness which we enjoy already.",
      "translation_ja": "少なくとも、次のことは確かだ。決して批評されない制度は、決して改善されない。何一つ欠点を指摘されなければ、何一つ改まらない。何が何でもすべてを正当化し、何ひとつ非を認めないという決意を貫けば、これから望みうるいっそうの幸福には、まるごと道を閉ざすことになる。これまでそうしていたなら、すでに私たちが享受している幸福までも、私たちから奪っていただろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p019",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n116/mode/1up",
          "source_sequence": 31,
          "printed_page": "101"
        }
      ],
      "source_text": "Nor is a disposition to find ‘every thing as it should be,’ less at variance with itself, than with reason and utility. The common-place arguments in which it vents itself justify not what is established, in effect, any more than they condemn it: since whatever now is established, once was innovation.",
      "translation_ja": "「何もかもあるべきようになっている」と思いたがる態度は、理性や功利に反するのと同じくらい、それ自体の内で矛盾している。その態度が表に出るときに持ち出されるありふれた議論は、実のところ、既存のものを非難しないのと同じく、既存のものを正当化もしない。いま確立しているものは、何であれ、かつては新たな試みだったからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p020",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n116/mode/1up",
          "source_sequence": 32,
          "printed_page": "101",
          "printed_page_end": "102"
        }
      ],
      "source_text": "Precipitate censure, cast on a political institution, does but recoil on the head of him who casts it. From such an attack it is not the institution itself, if well grounded, that can suffer. What a man says against it either makes impression or makes none. If none, it is just as if nothing had been said about the matter: if it does make an impression, it naturally calls up some one or other in defence. For if the institution is in truth a beneficial one to the community in general, it cannot but have given an interest in its preservation to a number of individuals. By their industry, then, the reasons on which it is grounded are brought to light: from the observation of which those who acquiesced in it before upon trust, now embrace it upon conviction. Censure, therefore, though ill-founded, has no other effect upon an institution than to bring it to that test, by which the value of those, indeed, on which prejudice alone has stamped a currency, is cried down, but by which the credit of those of sterling utility is confirmed.",
      "translation_ja": "政治上の制度に早まって批判を浴びせても、浴びせた本人にはね返るだけである。確かな根拠を持つ制度なら、そのような攻撃で制度そのものが傷つくことはない。批判が人の心に残るか、何も残さないかの、どちらかである。残さなければ、何も言われなかったのと同じだ。心に残るなら、自然と誰かが弁護に立つ。というのも、その制度が本当に共同体全体の利益になるなら、制度が保たれることによって利益を受ける個人は何人もいるはずだ。その人々が骨を折れば、制度の根拠が明るみに出る。それを見た人々は、それまで信頼だけで受け入れていた制度を、今度は納得して受け入れるようになる。したがって、根拠の乏しい批判であっても、制度を試しにかける以上の影響を及ぼさない。その試しによって、偏見だけで値打ちを認められてきたものは、安値をつけられる。だが、本物の有用性を持つものは、むしろその信用が確かめられるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p021",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n117/mode/1up",
          "source_sequence": 33,
          "printed_page": "102",
          "printed_page_end": "103"
        }
      ],
      "source_text": "Nor is it by any means from passion and ill-humour, that censure, passed upon legal institutions, is apt to take its birth. When it is from passion and ill-humour that men speak, it is with men that they are in ill-humour, not with laws: it is men, not laws, that are the butt of ‘arrogance.’ Spleen and turbulence may indeed prompt men to quarrel with living individuals: but when they make complaint of the dead letter of the Law, the work of departed lawgivers, against whom no personal antipathy can have subsisted, it is always from the observation, or from the belief at least, of some real grievance. The Law is no man’s enemy: the Law is no man’s rival. Ask the clamorous and unruly multitude—it is never the Law itself that is in the wrong: it is always some wicked interpreter of the Law that has corrupted and abused it.",
      "translation_ja": "法の制度への批評は、決して、感情や腹立ちから生まれがちなのではない。人が感情や腹立ちに任せて物を言うとき、腹を立てている相手は、法ではなく人だ。「傲慢」な物言いの矛先は、法ではなく人に向く。腹立ちや騒ぎを起こしたい気持ちから、生きている誰かに喧嘩を売ることなら、確かにあるだろう。だが、人が恨みなど持ちようのない、とうに亡くなった立法者の作った法の文言に不平を言うときは、何か本当の不当な扱いを見たか、少なくともそれがあったと信じているものだ。法は誰の敵でもなく、誰とも張り合わない。騒ぎ立て、手に負えない群衆に聞いてみるがよい。悪いのは法そのものではない。いつも、よこしまな法の解釈者が法をねじ曲げ、濫用したというのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note04",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n117/mode/1up",
          "source_sequence": 34,
          "printed_page": "102",
          "printed_page_end": "103"
        }
      ],
      "source_text": "‘Arrogance,’ our Author calls it ‘the utmost arrogance,’ ‘to censure what has, at least, a better chance to be right, than the singular notions of any particular man:’ meaning thereby certain ecclesiastical institutions. Vibrating, as it should seem, between passion and discretion, he has thought it necessary, indeed, to insert in the sentence that, which being inserted, turns it into nothing: After the word ‘censure,’ ‘with contempt’ he adds, ‘and rudeness:’ as if there needed a professor to inform us, that to treat any thing with contempt and rudeness is arrogance. ‘Indecency,’ he had already called it, ‘to set up private judgment in opposition to public:’ and this without restriction, qualification, or reserve. This was in the first transport of a holy zeal, before discretion had come in to his assistance. This passage the Doctors Priestley and Furneaux, who, in quality of Dissenting Ministers, and champions of dissenting opinions, saw themselves particularly attacked in it, have not suffered to pass unnoticed; any more than has the celebrated Author of the ‘Remarks on the Acts of the 13th Parliament,’ who found it adverse to his enterprize, for the same reason that it is hostile to every other liberal plan of political discussion. My edition of the Commentaries happens to be the first: since the above paragraph was written I have been directed to a later. In this later edition the passage about ‘indecency’ is, like the other about ‘arrogance,’ explained away into nothing. What we are now told is, that ‘to set up private judgment in [virulent and factious] opposition to public authority’ (he might have added—or to private either) is ‘indecency.’ [See the 5th edit. 8vo. p. 50, as in the 1st.] This we owe, I think, to Dr. Furneaux. The Doctors Furneaux and Priestley, under whose well-applied correction our Author has smarted so severely, have a good deal to answer for: They have been the means of his adding a good deal of this kind of rhetorical lumber to the plentiful stock there was of it before. One passage, indeed, a passage deep-tinctured with religious gall, they have been the means of clearing away entirely: and in this at least, they have done good service. They have made him sophisticate: they have made him even expunge: but all the Doctors in the world, I doubt, would not bring him to confession. See his answer to Dr. Priestley.",
      "translation_ja": "「傲慢」といえば、著者は「どの個人の独特な見方よりも、少なくとも正しい見込みが大きいものを批評する」のは「この上なく傲慢」だと言う。いくつかの教会制度を指している。感情と分別との間で揺れたためらしいが、著者はこの文に、入れれば何も言っていないのも同然になる語を、わざわざ加えた。「批評する」を「侮蔑と無礼をもって」行う場合だと言い添えたのである。物を侮蔑と無礼をもって扱うのは傲慢だということを、大学の先生から教わらなければならないかのようだ。著者はすでに、「公の判断に対抗して私的な判断を立てること」を「無作法」と呼んでいた。何の制限も条件も留保もつけずにである。分別が助けに来る前、聖なる熱情に初めて駆られたときの言葉だった。プリーストリー博士とファーノー博士は、ともに国教会に属さない牧師で、国教会に異を唱える立場を擁護していた。この箇所で自分たちがことさらに攻撃されたと受け取り、これを見過ごさなかった。名高い『第13議会の諸法についての所見』の著者も同じだった。これが自分の企てに反すると思ったのは、これが政治を自由に論じようとするどんな試みにも敵対するのと、同じ理由からである。たまたま私の手もとの『釈義』は初版だが、上の段落を書いた後、後の版を教えてもらった。この後の版では、「無作法」をめぐる箇所も「傲慢」の箇所と同じで、注釈されて何も意味しなくなった。いまや「公の権威に［悪意に満ちた党派心から］対抗して、私的判断を立てること」は「無作法」だと教えられる。私的な権威に対しても、と著者は加えればよかったのだ。（八折判第5版50頁。初版と同じ頁を参照。）こうなったのは、ファーノー博士のおかげだと思う。ファーノー博士とプリーストリー博士の的を射た批判は、著者をいたく傷つけたが、両博士にもずいぶん責任がある。すでに山ほどあった、この手の役に立たない弁論の飾りを、さらに多く付け加えさせたからだ。もっとも、宗教上の悪意に深く染まった一節だけは、両博士が、著者に完全に取り除かせた。少なくともこの点では、立派な仕事をした。著者に取り繕わせただけでなく、文章を削除させるところまでいったのだ。しかし世の博士が全員かかっても、著者に非を認めさせることまではできまい。プリーストリー博士への回答を参照されたい。",
      "translation_status": "reviewed"
    },

          "url": "https://archive.org/details/cu31924030442077/page/n167/mode/1up",
          "source_sequence": 247,
          "printed_page": "152"
        }
      ],
      "source_text": "XXXIV. Throughout the whole of it, what distresses me is, not the meeting with any positions, such as, thinking them false, I find a difficulty in proving so: but the not meeting with any positions, true, or false, (unless it be here and there a self-evident one,) that I can find a meaning for. If I can find nothing positive to accede to, no more can I to contradict. Of this latter kind of work, indeed, there is the less to do for any one else, our Author himself having executed it, as we have seen, so amply.",
      "translation_ja": "第三十四節　全体を通じて困るのは、誤りだと思う主張があって、それが誤りだと証明しにくいことではない。正しかろうと誤っていようと、ところどころの自明なものを別にすれば、意味の分かる主張に出会わないことである。賛成できるほどはっきりしたものが見つからないなら、反論できるものも同じように見つからない。もっとも、反論については、見たとおり、著者自身があれほど十分にやってくれたので、ほかの人がすることはその分少ない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p034-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n167/mode/1up",
          "source_sequence": 248,
          "printed_page": "152",
          "printed_page_end": "153"
        }
      ],
      "source_text": "The whole of it is, I must confess, to me a riddle: more acute, by far, than I am, must be the Oedipus that can solve it. Happily it is not necessary, on account of any thing that follows, that it should be solved. Nothing is concluded from it. For aught I can find, it has in itself no use, and none is made of it. There it is, and as well might it be any where else, or no where.",
      "translation_ja": "正直、この一節は全体が謎である。解けるオイディプスがいるとすれば、私よりもはるかに頭の切れる人だろう。幸い、後に続く話を読むために、この謎を解く必要はない。ここからは何の結論も引き出されない。私が見るかぎり、それ自体に何の役にも立つところはなく、何かに役立てられてもいない。ここにあるだけで、どこか別の所にあっても、どこにもなくても同じだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin35",

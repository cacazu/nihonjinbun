          "printed_page": "230"
        }
      ],
      "source_text": "I. We now come to the last topic touched upon in this digression: a certain “duty” which, according to our Author’s account, the supreme power lies under: — the duty of making laws.",
      "translation_ja": "第一節　では、この脱線で取り上げられる最後の話題に入ろう。著者によると、最高権力が負っているある「義務」、すなわち法を作る義務である。",

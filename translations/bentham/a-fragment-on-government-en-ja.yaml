        }
      ],
      "source_text": "3 Comm. 268, at the end of Ch. XVII. which concludes with three pages against Reformation. Our Author had better, perhaps, on this occasion, have kept clear of allegories: he should have considered whether they might not be retorted on him with severe retaliation. He should have considered, that it is not easier to him to turn the Law into a Castle, than it is to the imaginations of impoverished suitors to people it with Harpies. He should have thought of the den of Cacus, to whose enfeebled optics, to whose habits of dark and secret rapine, nothing was so hateful, nothing so dangerous, as the light of day.",
      "translation_ja": "『イングランド法釈義』第3巻268頁、第17章の末尾。同章は改革に反対する三頁で結ばれる。この場合、著者は寓意に頼らない方がよかったかもしれない。寓意をそのまま返され、手痛いしっぺ返しを受けることはないか、考えるべきだったのだ。著者が法を城に見立てるくらいのことは、訴訟で身代を失った人たちが、そこに怪鳥ハルピュイアが巣くっていると想像するのと、同じくらいたやすいと思うべきだった。怪物カークスのねぐらを思い出すべきだった。弱った目を持ち、暗がりで人目を忍んで物を奪うのを常としたカークスにとって、日の光ほど憎く、危険なものはなかったのである。",

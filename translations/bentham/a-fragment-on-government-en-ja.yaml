          "source_sequence": 203,
          "printed_page": "142"
        }
      ],
      "source_text": "XV. In the same manner we may understand, how the same man, who is governor with respect to one man or set of men, may be subject with respect to another: how among governors some may be in a perfect state of nature, with respect to each other: as the Kings of France and Spain: others, again, in a state of perfect subjection, as the Hospodars of Walachia and Moldavia with respect to the Grand Signior: others, again, in a state of manifest but imperfect subjection, as the German States with respect to the Emperor: others, again, in such a state in which it may be difficult to determine whether they are in a state of imperfect subjection or in a perfect state of nature: as the King of Naples with respect to the Pope.",
      "translation_ja": "第十五節　同じように、ある人や集団にとって統治者である人が、別の人に対しては臣民でありうることも分かる。また統治者同士でも、フランス国王とスペイン国王のように、互いに完全な自然状態にある場合がある。ワラキアやモルダヴィアの公とオスマン帝国のスルタンのように、完全な従属がある場合もある。ドイツ諸邦と皇帝のように、明らかに従属はしているが不完全な場合もある。さらに、ナポリ国王と教皇のように、不完全な従属があるのか、完全な自然状態にあるのかを決めがたい場合もある。",
      "translation_status": "reviewed"
    },

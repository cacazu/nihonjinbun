        }
      ],
      "source_text": "XXXII. Something positive, however, in one place, we seem to have. These “single families,” by which the preservation of mankind was effected; these single families, he gives us to understand, “formed the first society.” This is something to proceed upon. A society then of the one kind or the other; a natural society, or else a political society, was formed. I would here then put a case, and then propose a question. In this society we will say no contract had as yet been entered into; no habit of obedience as yet formed. Was this then a natural society merely, or was it a political one? For my part, according to my notion of the two kinds of society as above explained, I can have no difficulty. It was a merely natural one. But, according to our Author’s notion, which was it? If it was already a political one, what notion would he give us of such an one as shall have been a natural one; and by what change should such precedent natural one have turned into this political one? If this was not a political one, then what sort of a society are we to understand any one to be which is political? By what mark are we to distinguish it from a natural one? To this, it is plain, our Author has not given any answer. At the same time, that to give an answer to it, was, if any thing, the professed purpose of the long paragraph before us.",
      "translation_ja": "第三十二節　しかし、一箇所には何かはっきりしたことがありそうである。人類がそのおかげで生き延びた「個々の家族」が、「最初の社会を形づくった」と、著者は私たちに受け取らせる。これなら出発点にできる。つまり、自然社会か政治社会の、どちらかができたのである。ここで一つの場合を仮定し、次いで問いを立てよう。この社会では、まだ何の契約も結ばれず、服従の習慣も成立していなかったとする。ではこれは単なる自然社会だったか、政治社会だったか。上で説明した二種類の社会についての私の考えに従えば、難しいところはない。単なる自然社会である。だが著者の考えではどちらか。すでに政治社会なら、自然社会にあたるものを著者はどう説明するのか。先にあったはずの自然社会が、どう変わってこの政治社会になったのか。これが政治社会ではないなら、どんな社会を政治社会と理解すればいいのか。何を目印に自然社会と区別するのか。著者がこの問いに何一つ答えていないのは明らかである。しかも、この長い段落に表向きの目的があったとすれば、ほかならぬこの問いに答えることだった。",
      "translation_status": "reviewed"
    },

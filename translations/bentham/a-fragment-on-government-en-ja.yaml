          "url": "https://archive.org/details/cu31924030442077/page/n201/mode/1up",
          "source_sequence": 386,
          "printed_page": "186"
        }
      ],
      "source_text": "By dispensatorial power I mean as well that which is exercised by the Board of Treasury, as those others which are executed in the several offices styled with us the War Office, Admiralty Board, Navy Board, Board of Ordnance, and Board of Works: excepting from the business of all these offices, the power of appointing persons to fill other subordinate offices: a power which seems to be of a distinct nature from that of making disposition of any article of public property.\nPower, political power, is either over persons or over things. The powers, then, that have been mentioned above, in as far as they concern things, are powers over such things as are the property of the public: powers which differ in this from those which constitute private ownership, in that the former are, in the main, not beneficial (that is, to the possessors themselves) and indiscriminate; but fiduciary, and limited in their exercise to such acts as are conducive to the special purposes of public benefit and security.",
      "translation_ja": "処分権とは、大蔵委員会の行使する権力のほか、私たちが陸軍省、海軍本部、海軍委員会、兵站委員会、公共営繕局と呼ぶ諸官庁の行使する権力を指す。ただし、これらの官庁の仕事のうち、下位の役職に人を任命する権力は除く。任命する権力は、公有財産の何かを処分する権力とは性質が違うように見えるからだ。\n政治権力とは、人を対象とするか、物を対象とするか、どちらかである。したがって、以上に挙げた権力が物にかかわるかぎり、それは公の財産である物についての権力である。私的所有権をなす権限と違って、公有物についての権力はおおむね、その権力を持つ者の利益のためにあるわけではなく、何にでも行使できるものでもない。信託された権力であり、その行使は、公共の利益と安全という特定の目的にかなう行為に限られる。",
      "translation_status": "reviewed"
    },

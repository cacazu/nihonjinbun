          "source_sequence": 544,
          "printed_page": "226"
        }
      ],
      "source_text": "Notion of a natural limit to the supreme power difficult to eradicate.",
      "translation_ja": "最高権力にはおのずから限界があるという考えは根強い",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p038",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n241/mode/1up",
          "source_sequence": 545,
          "printed_page": "226"
        }
      ],
      "source_text": "XXXVIII. To return for a moment to the language used by those who speak of the supreme power as being limited in its own nature. One thing I would wish to have remembered. What is here said of the impropriety, and evil influence of that kind of discourse, is not intended to convey the smallest censure on those who use it, as if intentionally accessory to the ill effects it has a tendency to produce. It is rather a misfortune in the language, than a fault of any person in particular. The original of it is lost in the darkness of antiquity. We inherited it from our fathers, and, maugre all its inconveniencies, are likely, I doubt, to transmit it to our children.",
      "translation_ja": "第三十八節　最高権力はその本性から制限されていると言う人が、使う言葉のことへ少し戻ろう。覚えておいてもらいたいことが一つある。そういう語り方の不適切さと悪い影響について、ここで述べたのは、使う人が、その語り方の生みがちな害に意図して手を貸したと、少しでも非難するためではない。特定の誰かの落ち度というより、言葉の不幸である。そもそもの源は遠い昔の闇に消えてしまった。私たちは父祖からそれを受け継いだ。いろいろ不都合はあっても、私たちの子どもにそれを残すことになるのではないかと思う。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin39",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n241/mode/1up",
          "source_sequence": 546,
          "printed_page": "226"
        }
      ],
      "source_text": "This not a mere affair of words.",
      "translation_ja": "これは単なる言葉の問題ではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p039",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n241/mode/1up",
          "source_sequence": 547,
          "printed_page": "226",
          "printed_page_end": "227"
        }
      ],
      "source_text": "XXXIX. I cannot look upon this as a mere dispute of words. I cannot help persuading myself, that the disputes between contending parties — between the defenders of a law and the opposers of it, would stand a much better chance of being adjusted than at present, were they but explicitly and constantly referred at once to the principle of utility. The footing on which this principle rests every dispute, is that of matter of fact; that is, future fact — the probability of certain future contingencies. Were the debate then conducted under the auspices of this principle, one of two things would happen: either men would come to an agreement concerning that probability, or they would see at length, after due discussion of the real grounds of the dispute, that no agreement was to be hoped for. They would at any rate see clearly and explicitly, the point on which the disagreement turned. The discontented party would then take their resolution to resist or to submit, upon just grounds, according as it should appear to them worth their while — according to what should appear to them, the importance of the matter in dispute — according to what should appear to them the probability or improbability of success — according, in short, as the mischiefs of submission should appear to bear a less, or a greater ratio to the mischiefs of resistance. But the door to reconcilement would be much more open, when they saw that it might be not a mere affair of passion, but a difference of judgment, and that, for any thing they could know to the contrary, a sincere one, that was the ground of quarrel.",
      "translation_ja": "第三十九節　私はこれを単なる言葉の争いとは考えられない。相争う当事者、つまりある法律を擁護する側と、それに反対する側との争いを、初めから、明白に、一貫して功利の原理に照らしたなら、今よりはるかによく解決の見込みが立つと思わずにいられない。その原理はどんな争いでも事実に基礎を置く。つまり、将来の事実、今後あることが起こりうる見込みに基礎を置く。この原理に導かれて議論が進めば、二つのうち一つが起きる。人々はその見込みについて合意するか、争いの本当の根拠を十分に議論したうえで、ついに合意の望みがないと分かるか、どちらかである。どちらにせよ、意見の食い違いがどこにあるかは、はっきりと分かる。不満のある側も、正当な根拠の上で、抵抗するか服従するかを決められる。それだけの価値があると思うかどうか、争点がどれほど重要に見えるか、成功の見込みがあると見えるかどうかによって、そう決める。要するに、服従の害が抵抗の害に比べて小さく見えるか、大きく見えるかによって決める。しかし、争いの根には単なる激情でなく判断の相違があり、判断が誠実でないと示すものは何もないと分かれば、和解への扉はずっと広く開くだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin40",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n242/mode/1up",
          "source_sequence": 548,
          "printed_page": "227"
        }
      ],
      "source_text": "The above notion perpetuates wrangling.",
      "translation_ja": "先の考えでは言い争いがいつまでも続く",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p040",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n242/mode/1up",
          "source_sequence": 549,
          "printed_page": "227",
          "printed_page_end": "228"
        }
      ],
      "source_text": "XL. All else is but womanish scolding and childish altercation, which is sure to irritate, and which never can persuade. — “I say, the legislature cannot do this. — I say, that it can. I say, that to do this, exceeds the bounds of its authority — I say, it does not.” — It is evident, that a pair of disputants setting out in this manner, may go on irritating and perplexing one another for everlasting, without the smallest chance of ever coming to an agreement. It is no more than announcing, and that in an obscure and at the same time, a peremptory and captious manner, their opposite persuasions, or rather affections, on a question of which neither of them sets himself to discuss the grounds. The question of utility, all this while, most probably, is never so much as at all brought upon the carpet: if it be, the language in which it is discussed is sure to be warped and clouded to make it match with the obscure and entangled pattern we have seen.",
      "translation_ja": "第四十節　あとは女じみた叱責と子どもじみた口論にすぎず、必ず相手をいらだたせるが、決して納得させられない。「立法機関にはそんなことはできない、と私は言っているんだ」「できる、と私は言っている」「そんなことをすれば権威の境界を越える、と私は言っている」「越えない、と私は言っている」。二人がこんな調子で始めたら、合意する望みなどこれっぽっちもないまま、いつまでも互いをいらだたせ、惑わせていられるのは明らかである。どちらも根拠を論じようとしない問いについて、互いに反対の確信、というより反対の感情を、あいまいなうえに断定的であら探しをする調子で、言い立てているにすぎない。その間、功利の問題は、おそらく一度も話題にすらのぼらない。のぼったとしても、すでに見たあいまいでこんがらがった型に合わせて、論じる言葉の方が確実にゆがめられ、曇らされる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin41",

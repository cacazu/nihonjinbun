    },
    {
      "id": "bentham-ch04-p019",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n228/mode/1up",
          "source_sequence": 496,
          "printed_page": "213",
          "printed_page_end": "214"
        }
      ],
      "source_text": "XIX. The propriety of this dangerous maxim, so far as the Divine Law is concerned, is what I must refer to a future occasion for more particular consideration. As to the Law of Nature, if (as I trust it will appear) it be nothing but a phrase; if there be no other medium for proving any act to be an offence against it, than the mischievous tendency of such act; if there be no other medium for proving a law of the state to be contrary to it, than the inexpediency of such law, unless the bare unfounded disapprobation of any one who thinks of it be called a proof; if a test for distinguishing such laws as would be contrary to the Law of Nature from such as, without being contrary to it, are simply inexpedient, be that which neither our Author, nor any man else, so much as pretended ever to give; if, in a word, there be scarce any law whatever but what those who have not liked it have found, on some account or another, to be repugnant to some text of scripture; I see no remedy but that the natural tendency of such doctrine is to impel a man, by the force of conscience, to rise up in arms against any law whatever that he happens not to like. What sort of government it is that can consist with such a disposition, I must leave to our Author to inform us.",
      "translation_ja": "第十九節　この危険な原則が、神の法の関わるかぎりで妥当かは、別の機会に、いっそう詳しく考えることにしよう。自然法について言えば、明らかになると思うのだが、もしそれがただの言葉にすぎないなら、ある行為が自然法に反することを立証するには、その行為がもたらす害を示すしかない。国の法が自然法に反することを立証するには、誰かがそれを考えて、根拠もなく気に入らないと思うことまで証明と呼ばないかぎり、その法が役に立たないことを示すしかない。自然法に反する法か、自然法には反しないが単に役に立たない法かを見分ける基準を、著者もほかの誰も示そうとさえしなかったとすれば、どうなるか。ひと言でいえば、何であれ法があれば、その法を嫌う人が、何かの理由で、聖書のどこかの一節に反するものと見なしてきたのだとしたら、どうなるか。そういう教えは良心の力に訴えて、たまたま気に入らない法という法に、武器を取って立ち上がるよう人を駆り立てる。どうしようもなく、それが自然な成り行きだと私は見る。そうした気性と両立するのは、どんな政府なのか。私たちに教えるのは、著者に任せよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note108",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n228/mode/1up",
          "source_sequence": 497,
          "printed_page": "213"
        }
      ],
      "source_text": "According to our Author, indeed, it should be to no purpose to make any separate mention of the two laws; since the Divine Law, he tells us, is but “a part of that of Nature.” Of consequence, with respect to that part, at least, which is common to both, to be contrary to the one, is, of course, to be contrary to the other.",
      "translation_ja": "もっとも著者に従えば、二つの法を別々に挙げても意味がないはずである。というのも神の法は自然法の「一部」にすぎないと、著者は言うからである。したがって少なくとも両方に共通する部分については、一方に反することは、当然、他方にも反する。",
      "translation_status": "reviewed"
    },

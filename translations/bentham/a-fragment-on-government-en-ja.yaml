          "source_sequence": 441,
          "printed_page": "198"
        }
      ],
      "source_text": "14. But by the definitions [1], [2], [3] [4], and the suppositions [5], [6], | The British Government = 1 + 1,000 + 1,000,000.",
      "translation_ja": "14．ところで定義［1］［2］［3］［4］と仮定［5］［6］より：イギリスの政府＝1＋1,000＋1,000,000人。",
      "translation_status": "reviewed"
    },
    {

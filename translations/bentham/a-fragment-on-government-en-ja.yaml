    {
      "id": "bentham-ch02-note87",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n195/mode/1up",
          "source_sequence": 369,
          "printed_page": "180"
        }
      ],
      "source_text": "What is curious is, that the same persons who tell you (having read as much) that Democracy is a form of Government under which the supreme power is vested in all the members of a state, will also tell you (having also read as much) that the Athenian Commonwealth was a Democracy. Now the truth is, that in the Athenian Commonwealth, upon the most moderate computation, it is not one tenth part of the inhabitants of the Athenian state that ever at a time partook of the supreme power: women, children, and slaves, being taken into the account. Civil Lawyers, indeed, will tell you, with a grave face, that a slave is nobody; as Common Lawyers will, that a bastard is the son of nobody. But, to an unprejudiced eye, the condition of a state is the condition of all the individuals, without distinction, that compose it.",
      "translation_ja": "面白いことに、民主政とは国の全構成員が最高権力を持つ政体だと、本で読んだとおりに語る同じ人々が、これも本で読んだとおりに、アテネの共和国は民主政であったと語る。ところが実際には、ごく控えめに見積もっても、アテネの共和国で、どの時点をとっても、最高権力にあずかったのは住民の十分の一に満たない。女性、子ども、奴隷も数に入れての話である。確かに、ローマ法の法律家は厳粛な顔で、奴隷は人として数えないと言う。コモン・ローの法律家が、婚外子を誰の子でもないと言うのと同じである。しかし偏りのない目で見れば、国の状態とは、分け隔てなく、国を構成するすべての人の状態である。",
      "translation_status": "reviewed"
    },
    {

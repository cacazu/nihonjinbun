    {
      "id": "bentham-ch03-margin01",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n197/mode/1up",
          "source_sequence": 374,
          "printed_page": "182"
        }
      ],
      "source_text": "Our Author’s panegyric on the British Constitution.",
      "translation_ja": "著者によるイギリスの国制礼賛",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p001",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n197/mode/1up",
          "source_sequence": 375,
          "printed_page": "182"
        }
      ],
      "source_text": "I. With a set of data, such as we have seen in the last chapter, we may judge whether our Author can meet with any difficulty in proving the British Constitution to be the best of all possible governments, or indeed any thing else that he has a mind. In his paragraph on this subject there are several things that lay claim to our attention. But it is necessary we should have it under our eye.",
      "translation_ja": "第一節　前章で見たような材料をそろえれば、イギリスの国制があらゆる可能な政体のうち最善だと証明するのに、いや何であれ、著者が証明したいことを証明するのに、難しいことがあるかどうかは察しがつく。この主題を扱う段落には、注意を向けるべきことがいくつかある。だが、まずこの段落を目の前に置く必要がある。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin02",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n197/mode/1up",
          "source_sequence": 376,
          "printed_page": "182"
        }
      ],
      "source_text": "The paragraph recited.",
      "translation_ja": "該当の段落を引用する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p002",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n197/mode/1up",
          "source_sequence": 377,
          "printed_page": "182",
          "printed_page_end": "183"
        }
      ],
      "source_text": "II. “But happily for us in this island the British Constitution has long remained, and I trust will long continue, a standing exception to the truth of this observation. For, as with us the executive power of the laws is lodged in a single person, they have all the advantages of strength and dispatch that are to be found in the most absolute monarchy: and, as the legislature of the kingdom is entrusted to three distinct powers entirely independent of each other; first, the King; secondly, the Lords Spiritual and Temporal, which is an aristocratical assembly of persons selected for their piety, their birth, their wisdom, their valour, or their property; and thirdly, the House of Commons, freely chosen by the people from among themselves, which makes it a kind of democracy; as this aggregate body, actuated by different springs, and attentive to different interests, composes the British Parliament, and has the supreme disposal of every thing; there can no inconvenience be attempted by either of the three branches, but will be withstood by one of the other two; each branch being armed with a negative power sufficient to repel any innovation which it shall think inexpedient or dangerous.”",
      "translation_ja": "第二節　「しかしこの島に住む私たちには幸いなことに、イギリスの国制は長くこの所見の例外であり続けてきたし、これからも長くそうであろう。わが国では、法を執行する権力が一人に置かれているので、法は、最も絶対的な君主政にも見られる力と速さの長所をすべて享受する。そして王国の立法は、完全に互いから独立した三つの別個の権力に託される。第一が王、第二が聖俗の貴族議員である。信仰心、家柄、知恵、武勇、または財産によって選ばれた人々からなる貴族政的な議会である。第三は庶民院で、人民が自分たちの中から自由に選ぶので、一種の民主政をなす。それぞれ違う動機で動き、違う利益に目を向けるこの複合体がイギリス議会をなし、あらゆることの処分について最高権限を持つからこそ、三部門のどれが不都合なことをしようとしても、残り二つのどちらかに阻まれずに済むことはない。どの部門も、不都合だとか危険だとか判断した変革をはね返すのに十分な拒否権を備えているのである」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin03",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n198/mode/1up",
          "source_sequence": 378,
          "printed_page": "183"
        }
      ],
      "source_text": "And that which follows it.",
      "translation_ja": "そのすぐ後の段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p003",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n198/mode/1up",
          "source_sequence": 379,
          "printed_page": "183",
          "printed_page_end": "184"
        }
      ],
      "source_text": "III. “Here then is lodged the sovereignty of the British Constitution; and lodged as beneficially as is possible for society. For in no other shape could we be so certain of finding the three great qualities of Government so well and so happily united. If the supreme power were lodged in any one of the three branches separately, we must be exposed to the inconveniencies of either absolute monarchy, aristocracy, or democracy; and so want two of the principal ingredients of good polity, either virtue, wisdom, or power. If it were lodged in any two of the branches; for instance, in the King and House of Lords, our laws might be providently made and well executed, but they might not always have the good of the people in view: if lodged in the King and Commons, we should want that circumspection and mediatory caution, which the wisdom of the Peers is to afford: if the supreme rights of legislature were lodged in the two Houses only, and the King had no negative upon their proceedings, they might be tempted to encroach upon the royal prerogative, or perhaps to abolish the kingly office, and thereby weaken (if not totally destroy) the strength of the executive power. But the constitutional government of this island is so admirably tempered and compounded, that nothing can endanger or hurt it, but destroying the equilibrium of power between one branch of the legislature and the rest. For if ever it should happen that the independence of any one of the three should be lost, or that it should become subservient to the views of either of the other two, there would soon be an end of our constitution. The legislature would be changed from that which was originally set up by the general consent and fundamental act of the society; and such a change, however effected, is, according to Mr. Locke (who perhaps carries his theory too far) at once an entire dissolution of the bands of Government, and the people would be reduced to a state of anarchy, with liberty to constitute to themselves a new legislative power.”",
      "translation_ja": "第三節　「こうしてイギリスの国制の主権はここに置かれる。しかも、社会にとってこれ以上ないほど有益な置き方である。ほかのどんな形でも、統治の三つの大きな資質が、これほど適切に、しかも幸いに結び合わされると確信はできなかったろう。最高権力が三部門のうち一つだけに置かれれば、私たちは絶対君主政、貴族政、民主政のどれかの不都合にさらされ、よい政体の主要な要素である徳、知恵、力のうち、二つを欠くことになる。どれか二部門に置かれ、たとえば王と貴族院に置かれれば、わが国の法は先を見通して作られ、よく執行されるかもしれないが、人民の利益が常に念頭に置かれるとは限らない。王と庶民院なら、貴族議員の知恵がもたらすはずの、熟慮と仲裁に必要な慎重さが欠ける。立法の最高権限が両院だけに置かれ、王に両院の議決を拒む力がなければ、両院は王の大権を侵し、ひょっとすると王の職務そのものを廃して、執行権の力を完全に壊さないまでも、弱めたくなるかもしれない。だがこの島の立憲政府は、まことに見事に釣り合いよく組み合わされている。だから立法府の一部門と残りの部門との勢力均衡が崩れないかぎり、これを危険にさらしたり傷つけたりするものはない。というのも、三部門のどれかが独立を失ったり、残り二つのどちらかの意向に従うようになったりすれば、私たちの国制はほどなく終わるからである。立法機関は、社会全体の同意と根本的な行為によって当初設けられたものとは、別のものに変わってしまうだろう。ロック氏によれば、もっともその理論は行きすぎかもしれないが、どのようにして起きたとしても、そのような変化は、統治の絆をたちどころにすっかり解いてしまう。人民は無政府の状態に戻り、自分たちのために新しい立法権を設ける自由を持つ」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin04",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n199/mode/1up",
          "source_sequence": 380,
          "printed_page": "184"
        }
      ],
      "source_text": "Executive power — the mention of it incongruously introduced.",
      "translation_ja": "執行権の話が脈絡なく持ち込まれる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p004",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n199/mode/1up",
          "source_sequence": 381,
          "printed_page": "184"
        }
      ],
      "source_text": "IV. In considering the first of these two paragraphs, in the first place, the phenomenon we should little expect to see from any thing that goes before, is a certain executive power, that now, for the first time, bolts out upon us without warning or introduction.",
      "translation_ja": "第四節　この二段落の最初の方を検討すると、まず、これまでのどんな話からも予期できないものが現れる。執行権なるものが、何の予告も前置きもなく、初めて私たちの前に飛び出してくるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p004-b",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n199/mode/1up",
          "source_sequence": 382,
          "printed_page": "184",
          "printed_page_end": "185"
        }
      ],
      "source_text": "The power, the only power our Author has been speaking of all along till now, is the legislative. ’Tis to this, and this alone, that he has given the name of “sovereign power.” ’Tis this power, the different distributions of which he makes the characteristics of his three different forms of government. ’Tis with these different distributions, distributions made of the legislative power, that, according to his account, are connected the several qualifications laid down by him, “as requisites for supremacy:” qualifications in the possession of which consist all the advantages which can belong to any form of Government. Coming now then to the British Constitution, it is in the superior degree in which these qualifications of the legislative body are possessed by it, that its peculiar excellence is to consist. It is by possessing the qualification of strength, that it possesses the advantage of a monarchy. But how is it then that, by his account, it possesses the qualification of strength? By any disposition made of the legislative power? By the legislative power’s being lodged in the hands of a single person, as in the case of a monarchy? No; but to a disposition made of a new power, which comes in, as it were, in a parenthesis, a new power which we now hear of for the first time, a power which has not, by any description given of it, been distinguished from the legislative, an executive.",
      "translation_ja": "著者が今までずっと語ってきた唯一の権力は、立法権である。著者が「主権」と名づけたのは、これだけである。著者が三つの異なる政体を見分ける目印にしたのは、この権力の配分の違いである。著者の説明では、著者が「最高の地位に必要な条件」として定めたさまざまな資質も、その配分の仕方、すなわち立法権の配分の仕方と結びついている。どんな政体であれ、その長所は、こうした資質を備えることに尽きる。さて、イギリスの国制となると、立法機関のこれらの資質を、ほかより高い程度に備えることが、その独自の優秀さになるはずである。力という資質を備えるから、君主政の長所を持つのである。では、その説明では、どうして力という資質を備えるのか。立法権を何らかの仕方で配分したからだろうか。君主政の場合のように、立法権が一人の手に置かれたからだろうか。そうではない。ある新しい権力を配分したおかげだというのである。これは、いわば括弧の中に滑り込んできた、今初めて耳にする新しい権力だ。説明は何もなく、立法権とどう違うのかも示されていない。執行権である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin05",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [

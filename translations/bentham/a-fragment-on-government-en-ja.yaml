          "url": "https://archive.org/details/cu31924030442077/page/n174/mode/1up",
          "source_sequence": 268,
          "printed_page": "159"
        }
      ],
      "source_text": "Nor is it an original independent principle.",
      "translation_ja": "約束を守る義務も根本の独立した原理ではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p042",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n174/mode/1up",
          "source_sequence": 269,
          "printed_page": "159",
          "printed_page_end": "160"
        }
      ],
      "source_text": "XLII. But, after all, for what reason is it, that men ought to keep their promises? The moment any intelligible reason is given, it is this: that it is for the advantage of society they should keep them; and if they do not, that, as far as punishment will go, they should be made to keep them. It is for the advantage of the whole number that the promises of each individual should be kept: and, rather than they should not be kept, that such individuals as fail to keep them should be punished. If it be asked, how this appears? the answer is at hand: — Such is the benefit to gain, and mischief to avoid, by keeping them, as much more than compensates the mischief of so much punishment as is requisite to oblige men to it. Whether the dependence of benefit and mischief (that is, of pleasure and pain) upon men’s conduct in this behalf, be as here stated, is a question of fact, to be decided, in the same manner that all other questions of fact are to be decided, by testimony, observation, and experience.",
      "translation_ja": "第四十二節　しかし結局のところ、人が約束を守るべきなのはなぜか。意味の通る理由を一つでも出せば、これに尽きる。人が約束を守ることは社会の利益になり、守らなければ、罰によってできるかぎり守らせることが社会の利益になるからである。一人ひとりの約束が守られることは全員の利益であり、守られないままにしておくよりは、守らない者を罰する方が全員の利益になる。どうしてそう言えるのかと尋ねられれば、答えはすぐ出る。約束を守って得る利益と避けられる害とをあわせれば、人に守らせるのに必要なだけ罰を科して生じる害を、はるかに埋め合わせるからである。この点での人の行いと、利益と害、つまり快楽と苦痛との関係が、ここで述べたとおりかどうかは、事実の問題である。ほかのすべての事実の問題と同じように、証言、観察、経験によって判断すべきである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note73",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n175/mode/1up",
          "source_sequence": 270,
          "printed_page": "160"
        }
      ],
      "source_text": "The importance which the observance of promises is of to the happiness of society, is placed in a very striking and satisfactory point of view, in a little apologue of Montesquieu, entitled, The History of the Troglodytes. The Troglodytes are a people who pay no regard to promises. By the natural consequences of this disposition, they fall from one scene of misery into another; and are at last exterminated. The same Philosopher, in his Spirit of Laws, copying and refining upon the current jargon, feigns a Law for this and other purposes, after defining a Law to be a relation. How much more instructive on this head is the fable of the Troglodytes than the pseudo-metaphysical sophistry of the Esprit des Loix!",
      "translation_ja": "約束を守ることが社会の幸福にとってどれほど大切かは、モンテスキューの『トログロディット人の物語』という短い寓話に、実に鮮やかに、納得のいく形で示されている。トログロディット人は、約束をまるで意に介さない民である。その性向の自然な結果として、彼らは不幸から不幸へと転落し、ついに滅ぼされる。同じ思想家が『法の精神』では、ありふれた難解な言い回しをまねて一層こね回し、法とは関係であると定義してから、ここでの目的やほかの目的のために、法なるものを作り出す。この点を学ぶには、『法の精神』のいかにも形而上学めいたこじつけより、トログロディット人の寓話の方が、どれほどためになることか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note74",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n175/mode/1up",
          "source_sequence": 271,
          "printed_page": "160"
        }
      ],
      "source_text": "See the Collection of his Works.",
      "translation_ja": "モンテスキューの著作集を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin43",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n175/mode/1up",
          "source_sequence": 272,
          "printed_page": "160"
        }
      ],
      "source_text": "Nor can it serve to prove anything, but what may be better proved without it.",
      "translation_ja": "約束に頼って証明できることは、頼らない方がよく証明できる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p043",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n175/mode/1up",
          "source_sequence": 273,
          "printed_page": "160",
          "printed_page_end": "161"
        }
      ],
      "source_text": "XLIII. This then, and no other, being the reason why men should be made to keep their promises, viz. that it is for the advantage of society that they should, is a reason that may as well be given at once, why Kings, on the one hand, in governing, should in general keep within established Laws, and (to speak universally) abstain from all such measures as tend to the unhappiness of their subjects: and, on the other hand, why subjects should obey Kings as long as they so conduct themselves, and no longer; why they should obey in short so long as the probable mischiefs of obedience are less than the probable mischiefs of resistance: why, in a word, taking the whole body together, it is their duty to obey, just so long as it is their interest, and no longer. This being the case, what need of saying of the one, that he promised so to govern; of the other, that they promised so to obey, when the fact is otherwise?",
      "translation_ja": "第四十三節　人に約束を守らせる理由は、社会の利益になるという、ただそれだけのことである。ならば、同じ理由を初めから挙げればよい。一方で、王が統治にあたって原則として既存の法の範囲にとどまり、より一般的に言えば、臣民を不幸にするような措置をことごとく避けるべき理由も、これである。他方で、王がそのように振る舞うかぎり、またその間だけ、臣民が王に従うべき理由も、これである。つまり、服従によって予想される害が抵抗によって予想される害より小さいかぎり、従うべきだという理由であり、ひと言でいえば、臣民全体を見て、従うことが利益になる間だけ、しかもその間だけ、従う義務があるという理由である。そうなら、一方では王がそう統治すると約束したとか、他方では人民がそう従うと約束したとか、事実でもないことを、わざわざ言う必要がどこにあるのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin44",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n176/mode/1up",
          "source_sequence": 274,
          "printed_page": "161"
        }
      ],
      "source_text": "The Coronation-oath does not come up to the notion of it.",
      "translation_ja": "戴冠の誓いも契約と呼べるものではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p044",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n176/mode/1up",
          "source_sequence": 275,
          "printed_page": "161"
        }
      ],
      "source_text": "XLIV. True it is, that, in this country, according to ancient forms, some sort of vague promise of good government is made by Kings at the ceremony of their coronation: and let the acclamations, perhaps given, perhaps not given, by chance persons out of the surrounding multitude, be construed into a promise of obedience on the part of the whole multitude: that whole multitude itself, a small drop collected together by chance out of the ocean of the state: and let the two promises thus made be deemed to have formed a perfect compact: — not that either of them is declared to be the consideration of the other.",
      "translation_ja": "第四十四節　確かにこの国では、昔からのしきたりに従い、国王は戴冠式で、よい統治をするという漠然とした約束をする。周りに集まる群衆のうちに、たまたま居合わせた者が上げたかもしれず、上げなかったかもしれない歓声を、群衆全体が従うという約束に読み替えてみよう。その群衆全体も、国という大海から、たまたま集まった一滴にすぎないのだが。そうして交わされた二つの約束で、完全な契約が成立したと見なしてみよう。もっとも、どちらかが他方の対価になるとは、どちらにも明言されていない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note75",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n176/mode/1up",
          "source_sequence": 276,
          "printed_page": "161"
        }
      ],
      "source_text": "V. supra, par. 38, note, p. 156.",
      "translation_ja": "前掲第三十八節の注、156頁を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin45",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n176/mode/1up",
          "source_sequence": 277,
          "printed_page": "161"
        }
      ],
      "source_text": "The obligation of a promise will not stand against that of utility: while that of utility will against that of a promise.",
      "translation_ja": "約束の義務は功利に反しては成り立たないが、功利の義務は約束に反しても成り立つ",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p045",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n176/mode/1up",
          "source_sequence": 278,
          "printed_page": "161",
          "printed_page_end": "162"
        }
      ],
      "source_text": "XLV. Make the most of this concession: one experiment there is, by which every reflecting man may satisfy himself, I think, beyond a doubt, that it is the consideration of utility, and no other, that, secretly but unavoidably, has governed his judgment upon all these matters. The experiment is easy and decisive. It is but to reverse, in supposition, in the first place the import of the particular promise thus feigned; in the next place, the effect in point of utility of the observance of promises in general. — Suppose the King to promise that he would govern his subjects not according to Law; not in the view to promote their happiness: — would this be binding upon him? Suppose the people to promise they would obey him at all events, let him govern as he will; let him govern to their destruction. Would this be binding upon them? Suppose the constant and universal effect of an observance of promises were to produce mischief, would it then be men’s duty to observe them? Would it then be right to make Laws, and apply punishment to oblige men to observe them?",
      "translation_ja": "第四十五節　この譲歩を最大限認めても、一つの試し方がある。よく考える人なら、それだけで疑いなく納得するだろう。これらすべてについて、自分の判断を、気づかぬうちに、しかし避けがたく決めてきたのは、功利を考慮することだけだった、と。この試し方は簡単で、しかも決定的である。第一に、作り上げられたこの個別の約束の意味を、仮に逆にする。第二に、約束を守ること一般がもたらす効用を、仮に逆にする。王が、法には従わず、臣民の幸福を増すことも考えずに統治すると約束したとしよう。その約束は王を拘束するだろうか。国民が、王が望むままに統治し、自分たちを滅ぼすように統治したとしても、何があろうと従うと約束したとしよう。その約束は国民を拘束するだろうか。約束を守るということが、いつでも、どこでも害を生むとしよう。それでも約束を守るのは人の義務だろうか。それでも法律を作り、罰を科して守らせるのは正しいだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin46",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n177/mode/1up",
          "source_sequence": 279,
          "printed_page": "162"
        }
      ],
      "source_text": "A fallacy obviated.",
      "translation_ja": "誤った反論を退ける",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p046",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n177/mode/1up",
          "source_sequence": 280,
          "printed_page": "162"
        }
      ],
      "source_text": "XLVI. “No;” (it may perhaps be replied) “but for this reason; among promises, some there are that, as every one allows, are void: now these you have been supposing, are unquestionably of the number. A promise that is in itself void, cannot, it is true, create any obligation. But allow the promise to be valid, and it is the promise itself that creates the obligation, and nothing else.” The fallacy of this argument it is easy to perceive. For what is it then that the promise depends on for its validity? what is it that being present makes it valid? what is it that being wanting makes it void? To acknowledge that any one promise may be void, is to acknowledge that if any other is binding, it is not merely because it is a promise. That circumstance then, whatever it be, on which the validity of a promise depends, that circumstance, I say, and not the promise itself must, it is plain, be the cause of the obligation which a promise is apt in general to carry with it.",
      "translation_ja": "第四十六節　「いいえ」と反論する人がいるかもしれない。「しかし理由はこうです。誰もが認めるように、約束の中には無効なものもあります。あなたが仮定した約束は、間違いなくその一部です。それ自体無効な約束が義務を生まないという点は確かです。ですが、約束が有効だと認めるなら、義務を生むのは約束そのものであって、ほかの何ものでもありません」。この議論の誤りはすぐ分かる。では、約束が有効なのは何によるのか。何があれば有効になり、何がなければ無効になるのか。一つでも無効でありうると認めることは、別の約束に拘束力がある場合、単に約束だから拘束力があるのではないと認めることである。だから、約束が有効かどうかを決める事情が何であれ、普通、約束に伴う義務の原因は、その事情にこそあり、約束そのものにないことは明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin47",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n177/mode/1up",
          "source_sequence": 281,
          "printed_page": "162"
        }
      ],
      "source_text": "The obligation of a promise, were it even independent, would not be extensive enough for the purpose.",
      "translation_ja": "たとえ約束の義務が何にも依存しなくても、必要な範囲には及ばない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p047",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n177/mode/1up",
          "source_sequence": 282,
          "printed_page": "162",
          "printed_page_end": "163"
        }
      ],
      "source_text": "XLVII. But farther. Allow, for argument sake, what we have disproved: allow that the obligation of a promise is independent of every other: allow that a promise is binding propria vi — Binding then on whom? On him certainly who makes it. Admit this: For what reason is the same individual promise to be binding on those who never made it? The King, fifty years ago, promised my Great-Grandfather to govern him according to Law: my Great-Grandfather, fifty years ago, promised the King to obey him according to Law. The King, just now, promised my neighbour to govern him according to Law: my neighbour, just now, promised the King to obey him according to Law. — Be it so — What are these promises, all or any of them, to me? To make answer to this question, some other principle, it is manifest, must be resorted to, than that of the intrinsic obligation of promises upon those who make them.",
      "translation_ja": "第四十七節　さらに言おう。議論のために、すでに論駁したことを認めてみよう。約束の義務がほかの義務から独立しており、約束はそれ自体の力で拘束するとしよう。それでは誰を拘束するのか。約束をした本人に決まっている。これを認めたうえで、まったく同じその約束が、一度も約束していない者を拘束するのは、どんな理由からか。王が五十年前に、法に従って治めると私の曽祖父に約束した。曽祖父は五十年前に、法に従って王に服すると約束した。王がつい今しがた、法に従って治めると私の隣人に約束した。隣人はつい今しがた、法に従って王に服すると約束した。それはよい。その約束のどれかが、あるいはすべてが、私に何の関係があるのか。この問いに答えるには、約束そのものが、約束をした者に義務を負わせるという原理とは、別の原理に頼るほかないことが明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin48",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n178/mode/1up",
          "source_sequence": 283,
          "printed_page": "163"
        }
      ],
      "source_text": "But the principle of UTILITY is all-sufficient.",
      "translation_ja": "しかし功利の原理だけで十分である",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p048",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n178/mode/1up",
          "source_sequence": 284,
          "printed_page": "163"
        }
      ],
      "source_text": "XLVIII. Now this other principle that still recurs upon us, what other can it be than the principle of utility? The principle which furnishes us with that reason, which alone depends not upon any higher reason, but which is itself the sole and all-sufficient reason for every point of practice whatsoever.",
      "translation_ja": "第四十八節　さて、こうしてまた私たちの前に現れるこの別の原理は、功利の原理をおいて何があろう。これが与える理由だけは、それより上の理由に頼らない。それ自体が、行いについてのどんな問題にも、ただ一つの、しかもそれだけで十分な理由となる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-title",
      "section_id": "bentham-ch02",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {

      "source_text": "1 Comm. 70. If no reason can be found for an institution, we are to suppose one: and it is upon the strength of this supposed one we are to cry it up as reasonable; It is thus that the Law is justified of her children. The words are—‘Not that the particular reason of every rule in the Law can, at this distance of time, be always precisely assigned; but it is sufficient that there be nothing in the rule flatly contradictory to reason, and then the Law will presume it to be well founded. And it hath been an ancient observation in the Laws of England,’ (he might with as good ground have added—and in all other Laws) ‘That whenever a standing rule of Law, of which the reason, perhaps, could not be remembered or discerned, hath been [wantonly] broke in upon by statutes or new resolutions, the wisdom of the rule hath in the end appeared from the inconveniences that have followed the innovation.’ When a sentiment is expressed, and whether from caution, or from confusion of ideas, a clause is put in by way of qualifying it that turns it into nothing, in this case if we would form a fair estimate of the tendency and probable effect of the whole passage, the way is, I take it, to consider it as if no such clause were there. Nor let this seem strange. Taking the qualification into the account, the sentiment would make no impression on the mind at all: if it makes any, the qualification is dropped, and the mind is affected in the same manner nearly as it would be were the sentiment to stand unqualified. This, I think, we may conclude to be the case with the passage above mentioned. The word ‘wantonly’ is, in pursuance of our Author’s standing policy, put in by way of salvo. With it the sentiment is as much as comes to nothing. Without it, it would be extravagant. Yet in this extravagant form it is, probably, if in any, that it passes upon the Reader. The pleasant part of the contrivance is, the mentioning of ‘Statutes’ and ‘Resolutions’ (Resolutions to wit, that is Decisions, of Courts of Justice) in the same breath; as if whether it were by the one of them or the other that a rule of Law was broke in upon, made no difference. By a Resolution indeed, a new Resolution, to break in upon a standing rule, is a practice that in good truth is big with mischief. But this mischief on what does it depend? Upon the rule’s being a reasonable one? By no means: but upon its being a standing, an established one. Reasonable or not reasonable, is what makes comparatively but a trifling difference. A new resolution made in the teeth of an old established rule is mischievous—on what account? In that it puts men’s expectations universally to a fault, and shakes whatever confidence they may have in the stability of any rules of Law, reasonable or not reasonable: that stability on which every thing that is valuable to a man depends. Beneficial be it in ever so high a degree to the party in whose favour it is made, the benefit it is of to him can never be so great as to outweigh the mischief it is of to the community at large. Make the best of it, it is general evil for the sake of partial good. It is what Lord Bacon calls setting the whole house on fire, in order to roast one man’s eggs. Here then the salvo is not wanted: a ‘new resolution can never be acknowledged to be contrary to a standing rule,’ but it must on that very account be acknowledged to be ‘wanton.’ Let such a resolution be made, and ‘inconveniences’ in abundance will sure enough ensue: and then will appear—what? not by any means ‘the wisdom of the rule,’ but, what is a very different thing, the folly of breaking in upon it. It were almost superfluous to remark, that nothing of all this applies in general to a statute: though particular Statutes may be conceived that would thwart the course of expectation, and by that means produce mischief in the same way in which it is produced by irregular resolutions. A new statute, it is manifest, cannot, unless it be simply a declaratory one, be made in any case, but it must break in upon some standing rule of Law. With regard to a Statute then to tell us that a ‘wanton’ one has produced ‘inconveniences,’ what is it but to tell us that a thing that has been mischievous has produced mischief? Of this temper are the arguments of all those doting politicians, who, when out of humour with a particular innovation without being able to tell why, set themselves to declaim against all innovation, because it is innovation. It is the nature of owls to hate the light: and it is the nature of those politicians who are wise by rote, to detest every thing that forces them either to find (what, perhaps, is impossible) reasons for a favourite persuasion, or (what is not endurable) to discard it.",
      "translation_ja": "『イングランド法釈義』第1巻70頁。ある制度の理由が見つからなければ、理由があると仮定することになっている。その仮定だけを頼りに、制度は理にかなっていると褒めそやすのである。こうして、法は自らの子らによって正しいとされる。文章はこうである。「遠く時を隔てたいま、法の規則一つひとつの理由を、いつも正確に示せるわけではない。だが、規則に理性と真っ向から矛盾するものがなければ、十分である。そのとき法は、規則には十分な根拠があると推定する。そしてイングランド法では、古くから次のことが見て取られてきた」〔同じ根拠で「あらゆるほかの法でも」と加えられたであろう〕。「理由が思い出せず、見いだせないような、確立した法の規則が、制定法や新しい裁定によって［みだりに］破られるたびに、その改変に伴う不都合から、結局はもとの規則の賢明さが明らかとなってきた」。ある意見を述べるとき、用心からであれ、考えの混乱からであれ、意見に条件をつける句を挿み、それで意見が何も意味しなくなる場合がある。その一節全体が何に向かい、どんな影響を及ぼしそうかを公平に見極めたいなら、私としては、そういう句など初めからないものとして、考えるのがよいと思う。不思議がらないでほしい。その条件を考慮すれば、意見は心に何の印象も残さないはずだ。何かの印象があるなら、条件は落ちて、条件のない意見を示されたのとほとんど同じように、心が動かされるのである。先に挙げた一節もそうだと考えてよい。「みだりに」は著者のいつもの方針で、逃げ口上として挿まれている。それがあれば意見は何も言わないに等しい。それがなければ、途方もない意見になる。だがこの意見が読者に受け取られるとすれば、おそらく、途方もない方のかたちで受け取られる。この細工で面白いのは、「制定法」と「裁定」、すなわち裁判所の判断とを、ひと息に口にするところだ。法の規則を破るのが一方であるか他方であるかは、何の違いもないかのように。確かに、裁定、つまり新しい裁定によって確立した規則を破ることは、実際に害をはらんでいる。しかしその害は何から生じるのか。規則が合理的なものだからか。決して違う。確立した、これまで効力を持ってきた規則だからである。合理的かどうかは、比較すればほんのわずかな違いしか生まない。確立して久しい規則に逆らう新しい裁定が有害なのはなぜか。人々の期待をあまねく裏切り、合理的であろうとなかろうと、法のいかなる規則についても、その安定性に置いていた信頼を揺るがすからである。この安定性にこそ、人にとって価値あるものがすべてかかっている。裁定で有利になった当事者にどれほど益があっても、共同体全体に及ぼす害を上回るほどの益にはなりえない。いちばんよく言っても、一部に益を与えるため全体に害をなすことである。ベーコン卿のたとえに言う、一人の卵を焼くために家全体を燃やすようなものだ。だから、ここでは逃げ口上は要らない。「新しい裁定が確立した規則に反する」と認めるなら、まさにそのために、それが「みだりに」下されたと認めなければならないからだ。そんな裁定を出せば、確かに「不都合」が山ほど生じる。そのとき明らかになるのは、何だろうか。「規則の賢明さ」ではまったくない。それとは別の、規則を破った愚かさである。この議論は、一般には制定法に少しも当てはまらないというまでもない。もっとも、人々の予想を裏切って、筋を外れた裁定と同様に害を生む制定法が、個別には考えられる。ただ法の内容を明らかにするだけの制定法でなければ、どんな新しい制定法も、確立した規則の何かを破らずには制定しようがないのは明らかだ。それなのに「みだりに」制定された法律が「不都合」を生んだと言われても、有害なものから害が生じたと言っているだけではないか。ある変更が気に入らず、その理由は言えないまま、新しいというだけであらゆる変更を非難する、もうろくした政治家たちの議論は、みな同じ気質から出ている。フクロウは光を嫌うものだ。そして物知りぶることだけを覚えた政治家は、気に入った確信の理由を見つけるという、ひょっとすると不可能なことか、その確信を捨てるという、とても耐えられないことか、そのどちらかを強いるものを、決まって憎む。",
      "translation_status": "reviewed"
    },

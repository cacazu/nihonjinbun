      "source_text": "It is not here, that he commands us to believe, and that on pain of forfeiting all pretensions to either ‘sense or probity,’ that the system of our jurisprudence is, in the whole and every part of it, the very quintessence of perfection.",
      "translation_ja": "わが国の法の体系は、全体でも、一つひとつの部分を見ても、完全さを精製し尽くしたようなものだと、著者が私たちに信じるよう命じるのは、ここではない。「分別も誠実さも」ないと思われたくなければ、そう信じろというのである。",

        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n204/mode/1up",
          "source_sequence": 395,
          "printed_page": "189"
        }
      ],
      "source_text": "VIII. The more we consider the application he makes of the common-place notions concerning the three forms of Government to our own, the more we shall see the wide difference there is between reading and reflecting. Our own he finds to be a combination of these three. It has a Monarchical branch, an Aristocratical, and a Democratical. The Aristocratical is the House of Lords; the Democratical is the House of Commons. Much had our Author read, at school, doubtless, and at college, of the wisdom and gravity of the Spartan senate: something, probably, in Montesquieu, and elsewhere, about the Venetian. He had read of the turbulence and extravagance of the Athenian mob. Full of these ideas, the House of Lords were to be our Spartans or Venetians; the House of Commons, our Athenians. With respect then to the point of wisdom, (for that of honesty we will pass by) the consequence is obvious. The House of Commons, however excellent in point of honesty, is an assembly of less wisdom than that of the House of Lords. This is what our Author makes no scruple of assuring us. A Duke’s son gets a seat in the House of Commons. There needs no more to make him the very model of an Athenian cobbler.",
      "translation_ja": "第八節　三つの政体についてのありふれた考えを、著者がどうわが国の政体に当てはめるか、考えれば考えるほど、読むことと自分で考えることの大きな違いが分かる。著者の見るところ、わが国の政体では、三つの政体が組み合わさっている。君主政の部門、貴族政の部門、民主政の部門がある。貴族政の部門は貴族院で、民主政の部門は庶民院である。著者はきっと、学校や大学で、スパルタの長老会の知恵と重みについてたくさん読み、ヴェネツィアの評議会についても、モンテスキューやほかの本で多少読んでいたのだろう。アテネの群衆の騒々しさと無軌道さについても読んでいた。こうした考えで頭がいっぱいなので、貴族院はわが国のスパルタ人かヴェネツィア人、庶民院はわが国のアテネ人でなくてはならなかった。それなら、誠実さはここでは置くとして、知恵については結論は明らかである。庶民院は、誠実さではどれほど優れていても、貴族院より知恵に劣る議会だと、著者はためらいなく請け合う。公爵の息子が庶民院に議席を得る。それだけで、たちまち、絵に描いたようなアテネの靴直しになるのである。",
      "translation_status": "reviewed"
    },

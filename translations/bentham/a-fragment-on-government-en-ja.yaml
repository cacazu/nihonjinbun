          "printed_page_end": "208"
        }
      ],
      "source_text": "XI. Taking it altogether, it is, without question, a very ingenious argument: nor can any thing in the world answer the purpose better, except just in the case where it happens to be wanted. Not but that a veteran antagonist, trained up in the regular and accustomed discipline of legal fencing, such an one, indeed, might contrive perhaps, with due management, to give our Author the honour of the field. But should some undisciplined blunderer, like the Commissary’s landlady, [Omitted: specific fencing moves in this comparison], I doubt much whether he might not get within our Knight’s guard. — I “intend?” — I “consent?” — I “submit” myself? — “Who are you, I wonder, that should know what I do better than I do myself? As to ‘submitting my will’ to the wills of the people who made this law you are speaking of, — what I know is, that I never ‘intended’ any such thing: I abominate them, I tell you, and all they ever did, and have always said so: and as to my ‘consent,’ so far have I been from giving it to their law, that from the first to the last, I have protested against it with all my might.” So much for our refractory disputant. — What I should say to him I know: but what our Author could find to answer to him, is more than I can imagine.",
      "translation_ja": "第十一節　全体として、まことに巧妙な論証であることは疑いない。肝心の、実際に必要な場合を除けば、これ以上に目的にかなうものは世の中にない。もっとも、法の剣術の正式な型を習い慣れた手練れが相手なら、うまく取り計らって、著者に勝利の栄誉を譲れるかもしれない。しかし、あの兵站官の下宿の女主人のような、型も知らないうっかり者が、その型から外れたら〔この比喩中の具体的な剣技を省略〕、わが騎士の守りを破ってしまうのではないか。「私が『するつもり』だと。私が『同意する』だと。私が『従う』だと。あなたはいったい誰で、私のすることを私よりよく知っているというのか。あなたの言う法律を作った連中の意志に『自分の意志を従わせる』ことなら、私はそんな『つもり』になったことは一度もない。連中も、連中のしてきたことも、すべて大嫌いで、いつもそう言ってきた。私の『同意』だって、彼らの法に同意するどころか、初めから終わりまで、全力で抗議してきた」。この反抗的な論敵についてはここまでとしよう。私なら何と言うかは分かっているが、著者が何と答えられるかは、想像もつかない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note102",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"

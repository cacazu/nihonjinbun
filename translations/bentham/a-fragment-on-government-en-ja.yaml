          "url": "https://archive.org/details/cu31924030442077/page/n238/mode/1up",
          "source_sequence": 538,
          "printed_page": "223"
        }
      ],
      "source_text": "Which furnishes what may be taken for a common signal of resistance.",
      "translation_ja": "合意は、抵抗に移る共通の目印となるものを与える",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p036",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n238/mode/1up",
          "source_sequence": 539,
          "printed_page": "223",
          "printed_page_end": "224"
        }
      ],
      "source_text": "XXXVI. By means of a convention then we are furnished with that common signal which, in other cases, we despaired of finding. A certain act is in the instrument of convention specified, with respect to which the government is therein precluded from issuing a law to a certain effect: whether to the effect of commanding the act, of permitting it, or of forbidding it. A law is issued to that effect notwithstanding. The issuing then of such a law (the sense of it, and likewise the sense of that part of the convention which provides against it being supposed clear) is a fact notorious and visible to all: in the issuing then of such a law we have a fact which is capable of being taken for that common signal we have been speaking of. These bounds the supreme body in question has marked out to its authority: of such a demarcation then what is the effect? either none at all, or this: that the disposition to obedience confines itself within these bounds. Beyond them the disposition is stopped from extending: beyond them the subject is no more prepared to obey the governing body of his own state, than that of any other. What difficulty, I say, there should be in conceiving a state of things to subsist in which the supreme authority is thus limited, — what greater difficulty in conceiving it with this limitation, than without any, I cannot see. The two states are, I must confess, to me alike conceivable: whether alike expedient, — alike conducive to the happiness of the people, is another question.",
      "translation_ja": "第三十六節　こうして合意によって、ほかの場合には見つかる見込みがないと思われた共通の目印が得られる。合意の文書に、ある行為が明示され、その行為を命じる、許す、禁じるなど、一定の趣旨の法を政府が出してはならないと、そこで定められる。それでも、その趣旨の法が出されたとしよう。その法を出したことは、その法の意味と、それを禁じる合意の箇所の意味が、どちらも明らかだとすれば、誰にも知られ、誰の目にも見える事実である。こうして法が出たという事実を、先ほどから述べる共通の目印にできる。問題の最高機関は、自らの権威にこの境界を引いた。その境界を引くと、どんな効果があるのか。まったく効果がないか、さもなくば、服従する気持ちがその境界の内だけにとどまるかである。その気持ちは、境界の外にまで広がるのを止められる。その外では、臣民は自分の国の統治機関に対して、別の国の統治機関に従う以上に従う気はない。このように最高の権威に制限がある状態が成り立つと考えるのに、いったいどんな難しさがあるのか。制限がない状態を考えるより、なぜ難しいのか。私には分からない。正直、どちらの状態も同じように思い描ける。どちらも同じように好ましく、人民の幸福に同じように役立つかは、別の問題である。",
      "translation_status": "reviewed"
    },
    {

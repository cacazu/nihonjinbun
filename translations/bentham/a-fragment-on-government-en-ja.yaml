    {
      "id": "bentham-ch01-p008",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n151/mode/1up",
          "source_sequence": 183,
          "printed_page": "136"
        }
      ],
      "source_text": "VIII. 5thly, Notwithstanding all this, we must suppose, it seems, that it had in every state: “yet in nature and reason,” says our Author, “it must always be understood and implied.” Growing bolder in the compass of four or five pages, where he is speaking of our own Government, he asserts roundly, that such a Contract was actually made at the first formation of it. “The legislature would be changed,” he says, “from that which was originally set up by the general consent and fundamental act of the society.”",
      "translation_ja": "第八節　第五に、これにもかかわらず、どの国にもあったと考えなければならないらしい。「それでも、物事の性質からも理性からも」と著者は言う。「それはいつでも了解され、含まれていなければならない」。四、五頁のうちに気が大きくなったと見えて、私たち自身の政府を語るくだりでは、その成立にあたってこのような契約は現実に結ばれたのだと、きっぱり断言する。「立法機関が」と著者は言う。「社会全体の同意と根本的な行為によって当初設けられたものとは、別のものに変わってしまうだろう」。",
      "translation_status": "reviewed"
    },

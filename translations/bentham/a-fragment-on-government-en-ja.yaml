          "source_sequence": 147,
          "printed_page": "129"
        }
      ],
      "source_text": "V. The digression we are about to examine, is, as it happens, not at all involved with the body of the work from which it starts. No mutual references or allusions: no supports or illustrations communicated or received. It may be considered as one small work inserted into a large one; the containing and the contained, having scarce any other connection than what the operations of the press have given them. It is this disconnection that will enable us the better to bestow on the latter a separate examination, without breaking in upon any thread of reasoning, or any principle of Order.",
      "translation_ja": "第五節　これから調べる脱線は、たまたま、そこから出発した著作の本体と、少しも絡み合っていない。互いに参照したり、ほのめかしたりするところはない。互いに根拠や例を提供したり受け取ったりするところもない。大きな著作の中に、小さな著作が一つ挿し込まれたと考えてよい。入れた側と入れられた側には、印刷の工程で結びつけられたというほかに、これといったつながりはないのである。つながりがないからこそ、推論の糸や、配列の原則をどこも壊さずに、小さい方だけを取り出して調べることが、いっそう容易になる。",
      "translation_status": "reviewed"
    },

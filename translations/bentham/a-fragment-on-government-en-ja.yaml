          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n187/mode/1up",
          "source_sequence": 328,
          "printed_page": "172"
        }
      ],
      "source_text": "XVII. In the first he tells us how many different forms of government there are according to the division of the ancients: which division he adopts. These are three: Monarchy, Aristocracy, and Democracy.",
      "translation_ja": "第十七節　最初の段落では、著者が採用する古代人の分類によれば、政体がいくつあるかを教えてくれる。三つである。君主政、貴族政、民主政である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin18",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n187/mode/1up",
          "source_sequence": 329,
          "printed_page": "172"
        }
      ],
      "source_text": "Second.",
      "translation_ja": "第二段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p018",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n187/mode/1up",
          "source_sequence": 330,
          "printed_page": "172"
        }
      ],
      "source_text": "XVIII. The next is to tell us, that by the sovereign power he means that of “making laws.”",
      "translation_ja": "第十八節　次の段落では、著者のいう主権とは「法を作る」権力だと教えてくれる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin19",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 331,
          "printed_page": "173"
        }
      ],
      "source_text": "Third.",
      "translation_ja": "第三段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p019",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 332,
          "printed_page": "173"
        }
      ],
      "source_text": "XIX. In a third he gives us the advantages and disadvantages of these three different forms of government.",
      "translation_ja": "第十九節　第三の段落では、この三種類の政体の長所と短所を挙げる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin20",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 333,
          "printed_page": "173"
        }
      ],
      "source_text": "Fourth.",
      "translation_ja": "第四段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p020",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 334,
          "printed_page": "173"
        }
      ],
      "source_text": "XX. In a fourth he tells us that these are all the ancients would allow of.",
      "translation_ja": "第二十節　第四の段落では、古代の人々が認めたのはこれだけだと教えてくれる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin21",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 335,
          "printed_page": "173"
        }
      ],
      "source_text": "Fifth.",
      "translation_ja": "第五段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p021",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 336,
          "printed_page": "173"
        }
      ],
      "source_text": "XXI. A fifth is to tell us that the British form of government is different from each of them; being a combination of all, and possessing the advantages of all.",
      "translation_ja": "第二十一節　第五の段落では、イギリスの政体がそのいずれとも異なり、すべてを組み合わせ、すべての長所を備えると教えてくれる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin22",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 337,
          "printed_page": "173"
        }
      ],
      "source_text": "Sixth.",
      "translation_ja": "第六段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p022",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 338,
          "printed_page": "173"
        }
      ],
      "source_text": "XXII. In the sixth, and last, he shews us that it could not possess these advantages, if, instead of being what it is, it were either of those others: and tells us what it is that may destroy it. These two last it will be sufficient here to mention: to examine them, will be the task of our next chapter.",
      "translation_ja": "第二十二節　第六の最後の段落では、イギリスの政体が今のようでなく、ほかの政体のどれかだったなら、このような長所は備わりえないと説明する。また、何がこの政体を滅ぼしうるかを教えてくれる。ここでは最後の二段落に触れるだけで足りる。検討は次章の仕事としよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin23",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 339,
          "printed_page": "173"
        }
      ],
      "source_text": "Definitions of the three sorts of governments according to our Author.",
      "translation_ja": "著者による三つの政体の定義",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p023",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n188/mode/1up",
          "source_sequence": 340,
          "printed_page": "173"
        }
      ],
      "source_text": "XXIII. Monarchy is that form of Government in which the power of making Laws is lodged in the hands of a single member of the state in question. Aristocracy is that form of Government in which the power of making laws is lodged in the hands of several members. Democracy is that form of government in which the power of making laws is lodged in the hands of “all” of them put together. These, according to our Author, are the definitions of the ancients; and these, therefore, without difficulty, are the definitions of our Author.",
      "translation_ja": "第二十三節　君主政とは、法を作る権力がその国の構成員のうち一人の手にある政体である。貴族政とは、その権力が数人の構成員の手にある政体である。民主政とは、その権力が構成員「全員」を合わせたところにある政体である。著者によれば、以上が古代の人々の定義である。したがって、難なくそのまま著者の定義にもなる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin24",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 341,
          "printed_page": "174"
        }
      ],
      "source_text": "The paragraph recited.",
      "translation_ja": "該当の段落を引用する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p024",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 342,
          "printed_page": "174"
        }
      ],
      "source_text": "XXIV. “The political writers of antiquity,” says he, “will not allow more than three regular forms of government; the first, when the sovereign power is lodged in an aggregate assembly, consisting of all the members of a community, which is called a Democracy; the second, when it is lodged in a council composed of select members, and then it is styled an Aristocracy; the last, when it is entrusted in the hands of a single person, and then it takes the name of a Monarchy. All other species of government they say are either corruptions of, or reducible to these three.”",
      "translation_ja": "第二十四節　「古代の政治についての著述家は」と著者は言う。「正規の政体を三つより多くは認めない。第一は、主権が共同体の全構成員からなる総会に置かれる場合で、民主政と呼ばれる。第二は、選ばれた構成員でつくる評議会に置かれる場合で、貴族政と呼ばれる。最後は、一人の手に託される場合で、君主政と呼ばれる。ほかの政体はすべて、この三つのいずれかの堕落した形か、いずれかに帰着する形だと、古代の著述家は言う」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin25",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 343,
          "printed_page": "174"
        }
      ],
      "source_text": "And the next.",
      "translation_ja": "さらに次の段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p025",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 344,
          "printed_page": "174"
        }
      ],
      "source_text": "XXV. “By the sovereign power, as was before observed, is meant the making of laws; for wherever that power resides, all others must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and to put the execution of the laws into whatever hands it pleases; and all the other powers of the state must obey the legislative power in the execution of their several functions, or else the constitution is at an end.”",
      "translation_ja": "第二十五節　「前に述べたように、主権とは法を作ることを指す。この権力がどこにあるにせよ、また政府の形や運営が外からどう見えるにせよ、ほかの権力はみな立法権に従い、導かれなければならない。立法機関は、新しい布告や規則によって、いつでも自由に政府の形や運営を変え、法を実施する仕事を、望む者の手に委ねることができるからである。国のほかの権力はすべて、それぞれの職務を果たすにあたり、立法権に従わなければならない。さもなくば国制は終わりである」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin26",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 345,
          "printed_page": "174"
        }
      ],
      "source_text": "How he assigns them their respective qualifications.",
      "translation_ja": "著者がそれぞれの政体に資質をどう割り振るか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p026",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n189/mode/1up",
          "source_sequence": 346,
          "printed_page": "174",
          "printed_page_end": "175"
        }
      ],
      "source_text": "XXVI. Having thus got three regular simple forms of Government (this anomalous complex one of our own out of the question) and just as many qualifications to divide among them; of each of which, by what he told us a while ago, each form of Government must have some share, it is easy to see how their allotments will be made out. Each form of Government will possess one of these qualities in perfection, taking its chance, if one may say so, for its share in the two others.",
      "translation_ja": "第二十六節　こうして、三つの正規の単純な政体があり、私たちのこの変則的な複合政体はひとまず置いておく。そしてちょうど同じ数の資質があり、先ほど著者が教えたとおり、どの政体にもそれぞれの資質がいくらかは備わっていなければならない。ならば、割り当てがどうなるかは見やすい。それぞれの政体はこのうち一つを完全に備え、残り二つはどれだけ割り当たるか、いわば運任せになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin27",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n190/mode/1up",
          "source_sequence": 347,
          "printed_page": "175"
        }
      ],
      "source_text": "All appearing equally eligible in his view of them.",
      "translation_ja": "著者の説明では、三つとも選ぶ価値は同じに見える",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p027",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n190/mode/1up",
          "source_sequence": 348,
          "printed_page": "175"
        }
      ],
      "source_text": "XXVII. Among these three different forms of Government then, it should seem according to our Author’s account of them, there is not much to choose. Each of them has a qualification, an endowment, to itself. Each of them is completely characterized by this qualification. No intimation is given of any pre-eminence among these qualifications, one above another. Should there be any dispute concerning the preference to be given to any of these forms of government, as proper a method as any of settling it, to judge from this view of them, is that of cross and pile. Hence we may infer, that all the governments that ever were, or will be (except a very particular one that we shall come to presently, that is to say our own) are upon a par: that of Athens with that of Persia; that of Geneva with that of Morocco: since they are all of them, he tells us, “corruptions of, or reducible to,” one of these. This is happy. A legislator cannot do amiss. He may save himself the expense of thinking. The choice of a king was once determined, we are told, by the neighing of a horse. The choice of a form of Government might be determined so as well.",
      "translation_ja": "第二十七節　したがって、著者の説明では、この三つの異なる政体には、選ぶほどの違いはないらしい。どれにも固有の持ち味、固有の資質があり、それでその政体の性格がすっかり定まる。ある資質がほかより優れているとの示唆は何もない。どの政体を選ぶべきかで争いになったら、この説明から判断するかぎり、硬貨の裏表で決めても、どんな方法にも劣らない。すると、これまであった政府も、今後できる政府も、間もなく触れる実に特殊な一つ、つまりわが国の政府を除けば、みな同じ水準だということになる。アテネの政府もペルシアの政府も、ジュネーヴの政府もモロッコの政府も、みな三つのどれかの「堕落した形か、それに帰着する形」だと著者が教えてくれるからである。これは都合がよい。立法者は間違えようがない。考える手間が省ける。昔あるとき、馬がいなないたことで王が決まったそうだが、政体もそれで決めてよいわけである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin28",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n190/mode/1up",
          "source_sequence": 349,
          "printed_page": "175"
        }
      ],
      "source_text": "How to the British Constitution.",
      "translation_ja": "イギリスの国制にどう割り当てられるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p028",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n190/mode/1up",
          "source_sequence": 350,
          "printed_page": "175",
          "printed_page_end": "176"
        }
      ],
      "source_text": "XXVIII. As to our own form of government, however, this, it is plain, being that which it seemed good to take for the theme of his panegyric, and being made out of the other three, will possess the advantages of all of them put together; and that without any of the disadvantages; the disadvantages vanishing at the word of command, or even without it, as not being suitable to the purpose.",
      "translation_ja": "第二十八節　もっとも、わが国の政体となると、著者にはこれを賛辞の題にするのがよいと見えたうえ、ほかの三つからできているのだから、三つの長所を合わせて持ち、短所は一つも持たないに決まっている。短所は目的にかなわないので、一声かければ消え去る。いや、声をかけなくても消え去るのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin29",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n191/mode/1up",
          "source_sequence": 351,
          "printed_page": "176"
        }
      ],
      "source_text": "Contradiction he falls into, in supposing other sorts of Government than these three, described as they are by him.",
      "translation_ja": "この三つをそう定義しておきながら、ほかの種類を想定する矛盾",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p029",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n191/mode/1up",
          "source_sequence": 352,
          "printed_page": "176"
        }
      ],
      "source_text": "XXIX. At the end of the paragraph which gives us the above definitions, one observation there is that is a little puzzling. “Other species of government,” we are given to understand, there are besides these; but then those Others, if not “reducible to,” are but “Corruptions of these.” Now, what there is in any of these to be Corrupted, is not so easy to understand. The essence of these several forms of government, we must always remember, is placed by him, solely and entirely, in the article of number: in the ratio of the number of the Governors, (for so for shortness we will style those in whose hands is lodged this “power of making laws”) to that of the governed. If the number of the former be, to that of the latter, as one to all, then is the form of Government a Monarchy: if as all to all, then is it a Democracy: if as some number between one and all to all, then is it an Aristocracy. Now then, if we can conceive a fourth number, which not being more than all, is neither one nor all, nor any thing between one and all, we can conceive a form of Government, which, upon due proof, may appear to be a corruption of some one or other of these three. If not, we must look for the corruption somewhere else: Suppose it were in our Author’s reason.",
      "translation_ja": "第二十九節　以上の定義を述べる段落の終わりに、少し首をかしげる所見が一つある。これらのほかにも「別の種類の政体」があるものの、三つに「帰着する」のでなければ、「これらの堕落した形」にすぎないとされる。だが、三つのどれに堕落しうる何があるのかは、そう簡単には分からない。忘れてはならないのは、著者がさまざまな政体の本質を、もっぱら数の問題、すなわち統治者の数と統治される者の数の比に置くことである。ここでは手短に、「法を作る権力」を握る人々を統治者と呼ぶ。その数が、統治される者の数に対して一対全員なら、君主政である。全員対全員なら、民主政である。一人と全員の間のある数と全員との比なら、貴族政である。さて、全員より多くはなく、一人でも全員でもなく、一人と全員の間のどの数でもない、第四の数が考えられるとしよう。そうすれば、きちんと証明すれば三つのうちのどれかの堕落した形だと判明するかもしれない政体を、考えることができる。考えられないなら、堕落したところは、ほかに探さなければならない。著者の理性が堕落しているというのはどうだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note81",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n191/mode/1up",
          "source_sequence": 353,
          "printed_page": "176"
        }
      ],
      "source_text": "By the laws of Germany, such and such states are to furnish so many men to the general army of the empire: some of them so many men and one half; others, so many and one third; others again, if I mistake not, so many and one fourth. One of these half, third-part, or quarter-men, suppose, possesses himself of the Government: here then we have a kind of corruption of a Monarchy. Is this what our Author had in view?",
      "translation_ja": "ドイツの法では、どの邦が何人を帝国の総軍に出すかが決まっている。何人と二分の一を出す邦も、何人と三分の一を出す邦も、記憶に間違いがなければ、何人と四分の一を出す邦もある。その二分の一人、三分の一人、四分の一人の誰かが統治権を手にしたと仮定しよう。それなら、君主政が堕落した一種の形が見つかったわけである。著者が念頭に置いたのはこれだろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note82",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n191/mode/1up",
          "source_sequence": 354,
          "printed_page": "176",
          "printed_page_end": "177"
        }
      ],
      "source_text": "A more suitable place to look for corruption in, if we may take his own word for it, there cannot be. “Every man’s reason,” he assures us, “is corrupt;” and not only that, but “his understanding full of ignorance and error.” With regard to others, it were as well not to be too positive: but with regard to a man’s self, what he tells us from experience, it would be ill manners to dispute with him.",
      "translation_ja": "当人の言葉を信じるなら、堕落を探すのにこれほどふさわしい場所はない。「誰の理性も」と著者は請け合う。「堕落している」。それだけでなく、「その悟性は無知と誤りでいっぱいである」。他人については、あまり断定しない方がよいだろう。だが本人について、経験からこう言われたなら、異議を唱えるのは失礼である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note83",

          "printed_page": "238"
        }
      ],
      "source_text": "— Fixed and particularised — Promulgation recommended.",
      "translation_ja": "意味をはっきりさせ、具体的にする。法の周知を勧める",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p011",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n253/mode/1up",
          "source_sequence": 581,
          "printed_page": "238",
          "printed_page_end": "239"
        }
      ],
      "source_text": "XI. Not that the passage however is absolutely so remote from meaning, but that the inventive complaisance of a commentator of the admiring breed might find it pregnant with a good deal of useful matter. The design of disseminating the knowledge of the laws is glanced at by it at least, with a show of approbation. Were our Author’s writings then as sacred as they are mysterious; and were they in the number of those which stamp the seal of authority on whatever doctrines can be fastened on them; what we have read might serve as a text, from which the obligation of adopting as many measures as a man should deem subservient to that design, might, without any unexampled violence, be deduced. In this oracular passage I might find inculcated, if not totidem syllabis, at least totidem literis, as many points of legislative duty as should seem subservient to the purposes of digestion and promulgation. Thus fortified, I might press upon the legislature, and that on the score of “duty” to carry into execution, and that without delay, many a busy project as yet either unthought of or unheeded. I might call them with a tone of authority to their work: I might bid them go make provision forthwith for the bringing to light such scattered materials as can be found of the judicial decisions of time past, — sole and neglected materials of common law; — for the registering and publishing of all future ones as they arise; — for transforming, by a digest, the body of the common law thus completed, into statute-law; — for breaking down the whole together into codes or parcels, as many as there are classes of persons distinguishably concerned in it; — for introducing to the notice and possession of every person his respective code: — works which public necessity cries aloud for, at which professional interest shudders, and at which legislative indolence stands aghast.",
      "translation_ja": "第十一節　とはいえ、この一節にも、著者を崇拝するような注釈者が想像力を働かせて好意的に読めば、役に立つ話をいくらも見いだせる余地はある。法の知識を広める計画には、少なくとも賛成らしい調子で、ちらりと触れている。それなら、著者の文が、分かりにくいのと同じだけ神聖で、そこに結びつけられる学説なら何にでも権威の印を押すような文の仲間だとしよう。私たちが読んだ一節は、一つの経文になるかもしれない。ある人が、その計画に役立つと思う措置をいくつでも取らねばならないと、前例もないほどに無理にこじつけずとも、そこから導きうる経文である。このお告げのような一節には、音節まで一つ残らず同じとは言えなくとも、少なくとも文字は一つ残らず同じ形で、法を整理し、公布する目的に役立つと見える立法上の義務が、いくらでも説かれていると、私は見いだすかもしれない。こうして後ろ盾を得れば、まだ思いつかれもせず、あるいは注意を払われてもいない、手のかかる多くの計画を、立法機関に「義務」の名で、しかも遅滞なく実行するよう迫れる。権威ある口調で、取りかかれと呼びかけ、すぐに次の手はずを整えよと命じられるだろう。過去の判決について、見つけられるかぎりの散在した資料を、日の目を見せること。これが、コモン・ローの唯一の、しかも見捨てられてきた資料である。今後の判決は一つ残らず、出るつど記録し、刊行すること。こうして完備したコモン・ローの全体を、整理し編纂して制定法に変えること。その全体を、法に関わる人々を区別できる種類の数だけ、法典あるいは別々のまとまりに分けること。そして一人ひとりが自分に関わる法典を知り、手に入れられるようにすること。公共の必要は、これらの仕事を大声で求め、法律家の職業上の利害はこれに震えおののき、怠惰な立法機関はこれに愕然とする。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-margin12",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",

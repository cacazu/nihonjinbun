      "source_text": "XVI. So much for the introductory paragraph. — The main part of the subject is treated of in six others: the general contents of which are as follow.",
      "translation_ja": "第十六節　導入の段落はここまでにしておこう。主題の中心部分は別の六段落で扱われ、その概略は次のとおりである。",

    {
      "id": "bentham-ch04-p008",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n219/mode/1up",
          "source_sequence": 468,
          "printed_page": "204",
          "printed_page_end": "205"
        }
      ],
      "source_text": "VIII. The only term now remaining undisposed of, is the word “right.” And what to think of this, indeed I know not: whether our Author had a meaning in it, or whether he had none. It is inserted, we may observe, in the latter part only of the sentence: it appears not in the former. Concerning this omission, two conjectures here present themselves: it may have happened by accident; or it may have been made by design. If by accident, then the case is, that the idea annexed to the word “right” is no other than what was meant to be included in the former part of the sentence, in which it is not expressed, as well as in the latter, in which it is. In this case it may, without any change in the signification, be expressed in both. Let it then be expressed, and the sentence, take it altogether, will stand thus: In whatever persons the right of exercising supreme power in any state resides, it is the right of those persons to make Laws. If this conjecture be the true one, and I am apt to think it is, we see once more, and, I trust, beyond all doubt, that the consequent in this enthymeme is but a repetition of the antecedent. We may judge then, whether it is from any such consideration as that of “the end and institution of civil states,” or any other consideration that we are likely to gain any further conviction of the truth of this conclusion, than it presents us of itself. We may also form some judgment beforehand, what use or meaning there is likely to be in the assemblage of words that is to follow.",
      "translation_ja": "第八節　残っている言葉は「権利」だけである。これには、実のところ、どう考えたらよいか分からない。著者に何か意味があったのか、そもそも意味はなかったのか。見てのとおり、文の後半だけに挿し込まれ、前半には現れない。この省略については、二つの推測が思い浮かぶ。たまたま落ちたのか、わざと落としたのかである。たまたま落ちたとすれば、「権利」が担う考えを、言葉が現れる後半だけでなく、現れない前半にも含めるつもりだったことになる。その場合は文意を変えずに、両方に出すことができる。そう書いてみれば、文全体はこうなる。どの国でも、最高権力を行使する権利が、どの人々の手にあるにせよ、その人々には法を作る権利がある。この推測が正しいなら、そして私はそう思うが、この省略三段論法の結論は前提を繰り返すだけだと、改めて疑いなく分かるだろう。ならば、「市民国家が設けられた趣旨と、その成り立ち」などをいくら考えても、ほかのことをいくら考えても、この結論自体が与える以上にそれが真だと確信できそうか、判断できるだろう。この先に続く言葉の寄せ集めに、どれほどの効用や意味がありそうかも、前もっていくらか判断できる。",
      "translation_status": "reviewed"
    },

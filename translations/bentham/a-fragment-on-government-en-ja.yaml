    },
    {
      "id": "bentham-ch02-p030",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n192/mode/1up",
          "source_sequence": 357,
          "printed_page": "177"
        }
      ],
      "source_text": "XXX. Not but that we may meet, indeed, with several other hard-worded names for forms of Government: but these names were only so many names for one or other of those three. We hear often of a Tyranny: but this is neither more nor less than the name a man gives to our Author’s Monarchy, when out of humour with it. It is still the government of number one. We hear now and then, too, of a sort of Government called an Oligarchy: but this is neither more nor less than the name a man gives to our Author’s Aristocracy, in the same case. It is still the Government of some number or other, between one and all. In fine, we hear now and then of a sort of government fit to break one’s teeth, called an Ochlocracy: but this is neither more nor less than the name a man gives to a Democracy in the same case. It is still that sort of government, which, according to our Author, is the Government of all.",
      "translation_ja": "第三十節　むろん、政体を表すほかの難しい名前にも、いくつか出会うだろう。しかしどれも、三つの政体のいずれかの別名にすぎない。僭主政とはよく耳にするが、著者の言う君主政が気に入らないときにつける名前でしかない。やはり一人の統治である。寡頭政という政体のことも時折耳にするが、これも著者の言う貴族政が同じように気に入らないときにつける名前でしかない。やはり一人と全員の間の、ある人数による統治である。最後に、舌をかみそうなオクロクラシー、つまり衆愚政という政体も、ときに耳にする。しかしこれも、民主政が同じように気に入らないときにつける名前でしかない。やはり著者の言う全員による統治である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin31",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n192/mode/1up",
          "source_sequence": 358,
          "printed_page": "177"
        }
      ],
      "source_text": "Qualifications of the three forms, how allotted — the subject resumed.",
      "translation_ja": "三つの政体に資質はどう割り当てられるか。先ほどの話に戻る",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p031",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n192/mode/1up",
          "source_sequence": 359,
          "printed_page": "177",
          "printed_page_end": "178"
        }
      ],
      "source_text": "XXXI. Let us now see how he has disposed of his three qualifications among his three sorts or forms of Government. Upon Monarchy, we shall find, he has bestowed the perfection of power; on Aristocracy, of wisdom; on Democracy, of goodness; each of these forms having just enough, we may suppose, of the two remaining qualifications besides its own peculiar one to make up the necessary complement of “qualities requisite for supremacy.” Kings are, (nay were before they were Kings, since it was this qualification determined their subjects to make them Kings,) as strong as so many Hercules’s; but then, as to their wisdom, or their goodness, there is not much to say. The members of an Aristocracy are so many Solomons: but then they are not such sturdy folks as your Kings; nor, if the truth is to be spoken, have they much more honesty than their neighbours. As to the members of a Democracy, they are the best sort of people in the world; but then they are but a puny sort of gentry, as to strength, put them all together; and are apt to be a little defective in point of understanding.",
      "translation_ja": "第三十一節　さて、三つの種類の政体に、著者が三つの資質をどう割り振ったか見てみよう。君主政には完全な力を、貴族政には完全な知恵を、民主政には完全な善意を授けたと分かる。どの政体にも、固有の資質のほか、残り二つの資質が、「最高の地位に必要な資質」を満たすのにちょうど足りるだけ備わっていると考えてよかろう。王は一人残らずヘラクレス並みに強い。いや、王になる前からそうだった。この資質こそ、臣民がその人を王にしようと決めた理由だからである。しかしその知恵となると、あるいは善意となると、語るほどのことはない。貴族政の評議員は一人残らずソロモンだ。だが王たちほど頑健ではなく、本当のことを言えば、誠実さではその辺の人よりさして上でもない。民主政の構成員はというと、世界一善良な人々だ。だが力の点では全員寄せ集めても貧弱なもので、物分かりの点でもいささか欠けるところがありがちである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note84",

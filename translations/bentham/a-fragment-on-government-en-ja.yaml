          "url": "https://archive.org/details/cu31924030442077/page/n154/mode/1up",
          "source_sequence": 198,
          "printed_page": "139",
          "printed_page_end": "140"
        }
      ],
      "source_text": "XIII. On these considerations, the supposition of a perfect state of nature, or, as it may be termed, a state of society perfectly natural, may, perhaps, be justly pronounced, what our Author for the moment seemed to think it, an extravagant supposition: but then that of a government in this sense perfect; or, as it may be termed, a state of society perfectly political, a state of perfect political union, a state of perfect submission in the subject of perfect authority in the governor, is no less so.",
      "translation_ja": "第十三節　以上を考えれば、完全な自然状態、あるいは完全に自然な社会状態を仮定することは、著者がしばらくそう考えていたらしいように、途方もない仮定だと言ってよいかもしれない。しかし、この意味で完全な政府を仮定すること、すなわち、完全に政治的な社会状態、完全な政治的結合、臣民が完全に服従し統治者が完全な権威を持つ状態を仮定することも、同じくらい途方もない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note64",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n155/mode/1up",
          "source_sequence": 199,
          "printed_page": "140",
          "printed_page_end": "141"
        }
      ],
      "source_text": "It is not family union, however perfect, that can constitute a political society; why.\nIt is true that every person must, for some time, at least, after his birth, necessarily be in a state of subjection with respect to his parents, or those who stand in the place of parents to him; and that a perfect one, or at least as near to being a perfect one, as any that we see. But for all this, the sort of society that is constituted by a state of subjection thus circumstanced, does not come up to the idea that, I believe, is generally entertained by those who speak of a political society. To constitute what is meant in general by that phrase, a greater number of members is required, or, at least, a duration capable of a longer continuance. Indeed, for this purpose nothing less, I take it, than an indefinite duration is required. A society, to come within the notion of what is originally meant by a political one, must be such as, in its nature, is not incapable of continuing for ever in virtue of the principles which gave it birth. This, it is plain, is not the case with such a family society, of which a parent, or a pair of parents are at the head. In such a society, the only principle of union which is certain and uniform in its operation, is the natural weakness of those of its members that are in a state of subjection; that is, the children; a principle which has but a short and limited continuance. I question whether it be the case even with a family society, subsisting in virtue of collateral consanguinity; and that for the like reason. Not but that even in this case a habit of obedience, as perfect as any we see examples of, may subsist for a time; to wit, in virtue of the same moral principles which may protract a habit of filial obedience beyond the continuance of the physical ones which gave birth to it: I mean affection, gratitude, awe, the force of habit, and the like. But it is not long, even in this case, before the bond of connection must either become imperceptible, or lose its influence by being too extended.\nThese considerations, therefore, it will be proper to bear in mind in applying the definition of political society above given [in par. 10] and in order to reconcile it with what is said further on [in par. 17].",
      "translation_ja": "どれほど完全でも家族の結合が政治社会をなさない理由。\n誰であれ、生まれてから少なくとも一時期は、親や、親の代わりをする者に従属する状態に必ず置かれる。しかも完全な従属か、少なくとも私たちが目にするどんな例にも劣らず完全に近い従属である。とはいえ、このような事情のもとで従属が作る社会は、政治社会を語る人たちが普通思い描くものには達しないと思う。普通この言葉が指すものが成立するには、もっと多くの構成員か、少なくとももっと長く続きうる期間が必要である。実際、ここに求められるのは、期限が定まらないことにほかならないと思う。本来の意味で政治社会と呼ぶには、その社会自身の性質から見て、それを生んだ原理のおかげで、いつまでも続くことが不可能ではないものでなくてはならない。親一人か両親を頂点とする家族社会がそうでないのは明らかである。その社会で、確実に、一定して働く結合の原理は、従属する構成員、すなわち子どもたちの生まれながらの弱さだけで、しかもそれは短く限られた間しか続かない。傍系の血縁で続く家族社会でさえ、この条件を満たすかは、同じ理由で疑わしい。といっても、この場合でも、私たちが目にするどの例にも劣らず完全な服従の習慣が、一時期続くことはありうる。親への服従が、それを生んだ身体的な要因がなくなってからも続くのと、同じ心の働きによる。愛情、感謝、畏れ、習慣の力などのことである。しかしこの場合ですら、ほどなく結びつきの絆は見えなくなるか、広がりすぎて力を失うことになる。\nしたがって、上で示した政治社会の定義〔第十節〕を当てはめるとき、また、後に述べること〔第十七節〕とその定義を矛盾なく理解するために、以上を覚えておくとよい。",
      "translation_status": "reviewed"
    },
    {

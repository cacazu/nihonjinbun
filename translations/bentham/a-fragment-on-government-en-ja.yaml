      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p035",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n238/mode/1up",
          "source_sequence": 536,
          "printed_page": "223"
        }
      ],
      "source_text": "XXXV. In this mode of limitation I see not what there is that need surprise us. By what is it that any degree of power (meaning political power) is established? It is neither more nor less, as we have already had occasion to observe, than a habit of, and disposition to obedience: habit, speaking with respect to past acts; disposition, with respect to future. This disposition it is as easy, or I am much mistaken, to conceive as being absent with regard to one sort of acts; as present with regard to other. For a body then, which is in other respects supreme, to be conceived as being with respect to a certain sort of acts, limited, all that is necessary is, that this sort of acts be in its description distinguishable from every other.",
      "translation_ja": "第三十五節　この制限の仕方で、何に驚く必要があるのか、私には分からない。どんな程度の権力であれ、政治権力を成り立たせるのは何か。すでに指摘する機会があったように、服従の習慣と、服従しようとする傾向にほかならない。過去の行為について言うと習慣であり、将来の行為について言うと傾向である。私がよほど間違っていないかぎり、この傾向がある種類の行為についてはないと考えることは、別の行為についてはあると考えるのと同じくらいたやすい。したがって、ほかの点では最高位にある機関にも、ある種類の行為については制限があると考えるには、その種類の行為が、記述の上で、ほかのどの行為からも区別できればよい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note116",

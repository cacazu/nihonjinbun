          "url": "https://archive.org/details/cu31924030442077/page/n150/mode/1up",
          "source_sequence": 174,
          "printed_page": "135"
        }
      ],
      "source_text": "A state of nature spoken of, as never having existed.",
      "translation_ja": "自然状態は存在したことがないとされる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p006",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n150/mode/1up",
          "source_sequence": 175,
          "printed_page": "135"
        }
      ],
      "source_text": "VI. 3dly. All this while too, this same “state of nature” to which we have seen Society (a state spoken of as existing) put synonymous, and in which were it not for government, men, he informs us, in the next page, would “remain,” is a state in which they never were. So he expressly tells us. This “notion,” says he, “of an actually existing unconnected state of nature;” (that is, as he explains himself afterwards, “a state in which men have no judge to define their rights, and redress their wrongs,”) “is too wild to be seriously admitted.” When he admits it then himself, as he does in his next page, we are to understand, it seems, that he is bantering us: and that the next paragraph is (what one should not otherwise have taken it for) a piece of pleasantry.",
      "translation_ja": "第六節　第三に、そうしている間にも、まさにその「自然状態」、つまり社会という実在したとされる状態と同義にされ、政府がなければ人々がそこに「とどまる」と次の頁で教えられる状態は、人々がかつて一度もいたことのない状態なのである。著者はそう明言する。「人々が互いに結びつかない自然状態が現実にあったという考え」は、と著者は言う。後の説明では、それは「権利を定め、受けた不法を正す裁き手がいない状態」である。その考えは「突飛すぎて真面目には取り合えない」。であれば、次の頁で当人がそれを認めるとき、私たちはからかわれているのであり、次の段落はちょっとした冗談なのだと受け取るべきらしい。そうでもなければ、とうてい冗談には見えないだろうが。",
      "translation_status": "reviewed"
    },

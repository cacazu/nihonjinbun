          "printed_page": "204"
        }
      ],
      "source_text": "VII. Now let us consider the consequent; which, when detached from the context, may be spoken of as making a sentence of itself. “Wherever,” says he, “the supreme authority in any state resides, it is the right of that authority to make Laws.” — By “wherever” I take it for granted, he means, “in whatever persons:” by “authority,” in the former part of the sentence, — power; by the same word, “authority,” in the latter part of the sentence, — persons. Corrected therefore, the sentence will stand thus: In whatever persons in any state the supreme power resides, it is the right of those persons to make Laws.",
      "translation_ja": "第七節　次に結論を考えよう。これは前後から外して、それだけで一つの文と言ってよい。「どの国でも、最高の権威がどこにあるにせよ、その権威には法を作る権利がある」と著者は言う。「どこに」とは「どの人々の手に」という意味だろう。文の前半の「権威」は権力を、後半の同じ「権威」は、権力を持つ人々を指すと考えてよいだろう。そこで言葉を正せば、次のようになる。どの国でも、最高権力がどの人々の手にあるにせよ、その人々には法を作る権利がある。",
      "translation_status": "reviewed"

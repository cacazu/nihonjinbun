          "url": "https://archive.org/details/cu31924030442077/page/n213/mode/1up",
          "source_sequence": 447,
          "printed_page": "198"
        }
      ],
      "source_text": "Conclusion of the Chapter.",
      "translation_ja": "本章の結び",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p021",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n213/mode/1up",
          "source_sequence": 448,
          "printed_page": "198",
          "printed_page_end": "199"
        }
      ],
      "source_text": "XXI. Thus much for the British Constitution; and for the grounds of that pre-eminence which it boasts, I trust, indeed, not without reason, above all others that are known: Such is the idea our Author gives us of those grounds. — “You are not satisfied with it then,” says some one. — Not perfectly. — “What is then your own?” — In truth this is more than I have yet quite settled. I may have settled it with myself, and not think it worth the giving: but if ever I do think it worth the giving, it will hardly be in the form of a comment on a digression stuffed into the belly of a definition. At any rate it is not likely to be much wished for, by those, who have read what has been given us on this subject by an ingenious foreigner: since it is to a foreigner we were destined to owe the best idea that has yet been given of a subject so much our own. Our Author has copied: but Mr. DE LOLME has thought.",
      "translation_ja": "第二十一節　イギリスの国制について、また、知られているほかのどの国制にも勝ると、願わくは確かに理由あって誇る、その優位の根拠については、ここまでとする。その根拠について著者が示す考えは以上のとおりである。「では、納得していないのですね」と誰かが言う。完全には、していない。「それでは、あなた自身の考えは」。実のところ、まだすっかりは決めていない。自分の中では決めていても、わざわざ述べるまでもないと思うかもしれない。だが、いつか述べるに値すると思うとしても、その形は、定義の腹に詰め込まれた脱線に注釈をつける形ではまずあるまい。いずれにせよ、才気ある外国人がこの主題について示した所論を読んだ人は、私の考えをたいして求めまい。私たち自身にこれほど深くかかわる主題について、これまで示された最も優れた考えを、私たちは外国人から受け取る巡り合わせだった。著者は書き写した。ド・ロルム氏は自分で考えたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-p021-b",
      "section_id": "bentham-ch03",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n214/mode/1up",
          "source_sequence": 449,
          "printed_page": "199"
        }
      ],
      "source_text": "The topic which our Author has thus brought upon the carpet (let any one judge with what necessity) is in respect to some parts of it that we have seen, rather of an invidious nature. Since, however, it has been brought upon the carpet, I have treated it with that plainness with which an Englishman of all others is bound to treat it, because an Englishman may thus treat it and be safe. I have said what the subject seemed to demand, without any fear indeed, but without any wish, to give offence: resolving not to permit myself to consider how this or that man might chance to take it. I have spoken without sycophantical respects indeed, yet I hope not without decency: certainly without any party spleen. I chose rather to leave it to our Author to compliment men in the lump: and to stand aghast with admiration at the virtues of men unknown. Our Author will do as shall seem meet to him. For my part, if ever I stand forth and sing the song of eulogy to great men, it shall be not because they occupy their station, but because they deserve it.",
      "translation_ja": "著者がこうして持ち出した話題は、持ち出す必要がどれほどあったかは各自に判断してもらうとして、見てきた中のいくつかの点では、かなり人の不興を買いやすい。だが話題にされた以上、私は率直に扱った。誰よりもイングランド人が率直に扱わなければならない。イングランド人なら、そうしても身の危険なく済むからである。主題が求めると思うことを、人の気に障るのを恐れもせず、しかし望みもせずに述べた。誰それがどう受け取るかなど、自分に考えさせまいと決めた。言葉にこびへつらいはないが、礼節まで欠いていないことを願う。党派的な悪意がないことは確かである。人々をひとまとめに褒めちぎり、顔も知らない人々の徳の前で、あっけに取られて感嘆するのは、著者に任せておいた方がよいと思った。著者はふさわしいと思うことをするだろう。私自身がもし進み出て偉い人々に賛歌を歌うことがあるなら、それは彼らが地位を占めているからではなく、その地位に値するからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note101",
      "section_id": "bentham-ch03",

          "url": "https://archive.org/details/cu31924030442077/page/n224/mode/1up",
          "source_sequence": 483,
          "printed_page": "209",
          "printed_page_end": "210"
        }
      ],
      "source_text": "XIV. The vehemence, the δεινότης, of this passage is remarkable. He ransacks the language: he piles up, one upon another, four of the most tremendous epithets he can find; he heaps Ossa upon Pelion: and, as if the English tongue did not furnish expressions strong or imposing enough, he tops the whole with a piece of formidable Latinity. From all this agitation, it is plain, I think, there is a something which he has very much at heart; which he wishes, but fears, perhaps, to bring out undisguised; which in several places, notwithstanding, bursts out involuntarily, as it were, before he is well ready for it; and which, a certain discretion, getting at last the upper hand of propensity, forces, as we have seen, to dribble away in a string of obscure sophisms. Thus oddly enough it happens, that that passage of them all, which, if I mistake not, is the only one that was meant to be dedicated expressly to the subject, is the least explicit on it.",
      "translation_ja": "第十四節　この一節の激しさ、ギリシャ語でいう迫力には目を引くものがある。言葉を片端から探し回り、見つかるうちで最もすさまじい形容を四つも積み上げ、まるでペリオン山の上にオッサ山を重ねる。そして英語には十分に強く、仰々しい表現がないとばかりに、恐ろしげなラテン語を頂上に載せる。この動揺ぶりから見て、当人が心底こだわる何かがあるのは明らかだと思う。包み隠さず持ち出したいが、ひょっとすると怖くもある。それでも所々で、まだ用意もできていないうちに、思わず噴き出す。しかも最後には、欲求に分別が勝ち、見てきたとおり、あいまいなこじつけがいくつも連なるうちに、ちょろちょろ流れ出るしかなくなる。こうして不思議にも、間違いでなければ、この主題を正面から扱うはずだったただ一つの箇所が、この主題を最もはっきりとは語らないことになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note105",
      "section_id": "bentham-ch04",
      "kind": "note_body",

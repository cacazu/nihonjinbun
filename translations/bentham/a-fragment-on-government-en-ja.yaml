    {
      "id": "bentham-ch04-p018",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n227/mode/1up",
          "source_sequence": 492,
          "printed_page": "212",
          "printed_page_end": "213"
        }
      ],
      "source_text": "XVIII. ’Tis in a passage antecedent to the digression we are examining, but in the same section, that, speaking of the pretended law of Nature, and of the law of revelation, “no human laws,” he says, “should be suffered to contradict these.” The expression is remarkable. It is not that no human laws should contradict them: but that no human laws should be SUFFERED to contradict them. He then proceeds to give us an example. This example, one might think, would be such as should have the effect of softening the dangerous tendency of the rule: — on the contrary, it is such as cannot but enhance it; and, in the application of it to the rule, the substance of the latter is again repeated in still more explicit and energetic terms. “Nay,” says he, speaking of the act he instances, “if any human law should allow or enjoin us to commit it, we are bound to transgress that human law, or else we must offend both the natural and the divine.”",
      "translation_ja": "第十八節　今検討している脱線より前だが、同じ節にある一節で、著者はいわゆる自然法と啓示による法について、「いかなる人定法も、それらに反することを許されてはならない」と言う。この表現は注目に値する。人定法はそれらに反してはならない、と言うのではなく、人定法が反するのを誰も許してはならない、と言うのだ。さらに著者は例を挙げる。例なら、規則の危険な傾向を和らげるものではないかと思うだろう。逆に、それをいっそう強めざるをえない例である。そして、この例を規則に当てはめるとき、規則の大筋が、ますます明白に、力を込めて繰り返される。「いや」と、例に挙げた行為について著者は言う。「もし何かの人定法がその行為を許したり、行うよう私たちに命じたりするなら、私たちにはその人定法を破る義務がある。さもなければ、自然法にも神の法にも違反せざるをえない」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note106",

      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n223/mode/1up",
          "source_sequence": 475,
          "printed_page": "208"
        }
      ],
      "source_text": "One thing in the paragraph we are considering is observable; it is the concluding sentence, in which he brings together the ideas of law and will. Here then, in the tail of a digression, he comes nearer in fact, though without being aware of it, to the giving a just and precise idea of a law, than in any part of the definition itself from whence he is digressing. If, instead of saying that a law is a will, he had called it the expression of a will, and that sort of expression of a will which goes by the name of a command, his definition would, so far as this goes, have been clear as well as right. As it is, it is neither the one nor the other. But of this more, if at all, in another place. The definition of law is a matter of too much nicety and importance to be dispatched in a note.",
      "translation_ja": "今考えている段落には、注目すべきことが一つある。結びの文で、著者が法と意志という二つの考えを結びつけたことである。こうして、当人は気づいていないが、脱線の末尾では、脱線して離れた定義自体のどこよりも、実のところ、法を適切かつ正確に理解させることに近づいている。法は意志であると言う代わりに、意志の表明であり、しかも命令と呼ばれる種類の意志の表明であると言ったなら、そのかぎりで定義は明確であると同時に正しかったろう。現状では、明確でも正しくもない。だがこのことをさらに述べるなら、別の機会にしよう。法の定義は、注一つで片づけるには繊細すぎるし、重要すぎる。",
      "translation_status": "reviewed"
    },

          "url": "https://archive.org/details/cu31924030442077/page/n151/mode/1up",
          "source_sequence": 186,
          "printed_page": "136"
        }
      ],
      "source_text": "Attempt to reconcile these contradictions — Society distinguished into natural and political.",
      "translation_ja": "矛盾を解くため、自然社会と政治社会を区別する",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p009",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n151/mode/1up",
          "source_sequence": 187,
          "printed_page": "136"
        }
      ],
      "source_text": "IX. Let us try whether it be not possible for something to be done towards drawing the import of these terms out of the mist in which our Author has involved them. The word “Society,” I think it appears, is used by him, and that without notice, in two senses that are opposite. In the one, society, or a STATE OF SOCIETY, is put synonymous to a state of nature; and stands opposed to government, or a STATE OF GOVERNMENT: in this sense it may be styled, as it commonly is, natural society. In the other, it is put synonymous to government, or a state of government; and stands opposed to a state of nature. In this sense it may be styled, as it commonly is, political SOCIETY. Of the difference between these two states, a tolerably distinct idea, I take it, may be given in a word or two.",
      "translation_ja": "第九節　著者のかけた霧の中から、これらの用語の意味を少しでも引き出してみよう。著者が「社会」を、断りなく、相反する二つの意味に使っているのは、どうやら明らかである。一方では、社会、あるいは社会状態は、自然状態と同義にされ、政府、あるいは政府のある状態と対立する。この意味なら、普通そう呼ばれるように、自然社会と呼べる。もう一方では、政府、あるいは政府のある状態と同義にされ、自然状態と対立する。この意味では、普通そう呼ばれるように、政治社会と呼べる。この二つの状態の違いについては、ごく短い言葉でも、かなりはっきりした考えを示せると思う。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin10",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 188,
          "printed_page": "137"
        }
      ],
      "source_text": "Idea of political society.",
      "translation_ja": "政治社会の意味",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p010",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 189,
          "printed_page": "137"
        }
      ],
      "source_text": "X. The idea of a natural society is a negative one. The idea of a political society is a positive one. ’Tis with the latter, therefore, we should begin.",
      "translation_ja": "第十節　自然社会は、何かがないことで決まる概念である。政治社会は、何かがあることで決まる概念である。だから後の方から始めよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p010-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 190,
          "printed_page": "137"
        }
      ],
      "source_text": "When a number of persons (whom we may style subjects) are supposed to be in the habit of paying obedience to a person, or an assemblage of persons, of a known and certain description (whom we may call governor or governors) such persons altogether (subjects and governors) are said to be in a state of political SOCIETY.",
      "translation_ja": "複数の人々が、誰かがはっきりしていて特定できる一人の人物や集団に従う習慣を持つとしよう。従う側を臣民、従われる側を統治者と呼んでよい。臣民も統治者も含めたこれらの人々は、全体として政治社会の状態にあると言われる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note62",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],

      ],
      "source_text": "V. supra, par. 26.",
      "translation_ja": "前掲第二十六節参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin35",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],

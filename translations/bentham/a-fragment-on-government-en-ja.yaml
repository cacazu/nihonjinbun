          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n203/mode/1up",
          "source_sequence": 391,
          "printed_page": "188"
        }
      ],
      "source_text": "“The Lords spiritual and temporal, [p. 50] which,” says our Author, “is an aristocratical assembly of persons selected for their piety, their birth, their wisdom, their valour, or their property.”\nI have distributed, I think, these endowments, as our Author could not but intend they should be distributed. Birth, to such of the members of that assembly as have their seat in it by descent: and, as to those who may chance from time to time to sit there by creation, wisdom, valour, and property in common among the temporal peers; and piety, singly but entirely, among my Lords the Bishops. As to the other three endowments, if there were any of them to which these right reverend persons could lay any decent claim, it would be wisdom: but since worldly wisdom is what it would be an ill compliment to attribute to them, and the wisdom which is from above is fairly included under piety, I conclude that, when secured in the exclusive possession of this grand virtue, they have all that was intended them. There is a remarkable period in our history, at which, measuring by our Author’s scale, these three virtues seem to have been at the boiling point. It was in Queen Anne’s reign, not long after the time of the hard frost. I mean in the year 1711. In that auspicious year, these three virtues issued forth, it seems, with such exuberance, as to furnish merit enough to stock no fewer than a dozen respectable persons, who, upon the strength of it, were all made Barons in a day. Unhappily indeed, so little read was a right reverend and contemporary historian, in our Author’s method of “discerning of spirits,” as to fancy, it was neither more nor less than the necessity of making a majority that introduced so large a body of new members thus suddenly into the house. But I leave it to those who are read in the history of that time, to judge of the ground there can be for so romantic an imagination. As to piety, the peculiar endowment of the mitre, the stock there is of that virtue, should, to judge by the like standard, be, at all times, pretty much upon a level: at all times, without question, at a maximum. This is what we can make the less doubt of, since, with regard to ecclesiastical matters, in general, our Author, as in another place he assures us, has had the happiness to find, that “every thing is as it should be.”",
      "translation_ja": "「聖俗の貴族議員〔50頁〕は」と著者は言う。「信仰心、家柄、知恵、武勇、または財産によって選ばれた人々からなる貴族政的な議会である」。\n私も、著者がそう割り当てるつもりだったとしか考えられない仕方で、これらの長所を割り当てたと思う。家柄は、世襲でその議会の議席を得る人々に。時にたまたま新たに叙爵されて議席に座る人では、知恵、武勇、財産を俗界の貴族にまとめて。信仰心はただ一つ、しかし丸ごと、主教の閣下方に。残り三つの資質のうち、もしこれらの高位聖職者がそれなりにもっともらしく求めうるものがあるなら、知恵だろう。しかし世俗の知恵を認めることは彼らへのお世辞にならず、天からの知恵なら信仰心に含めて差し支えない。したがって、この偉大な徳を独占できれば、彼らにあてがわれた分はもうすべて手に入ると結論する。著者の物差しで測るなら、わが国の歴史には、三つの徳が沸点に達したらしい、注目すべき時期がある。アン女王の時代、大寒波から間もないころ、すなわち1711年である。このめでたい年、三つの徳があまりにあふれ出たため、紳士十二人もの長所を満たし、全員がそれだけで同じ一日のうちに男爵になったそうだ。あいにく、当時のある高位聖職者で歴史家でもあった人は、著者の「霊を見分ける」術をまだほとんど読んでいなかった。そのため、多数派を作る必要があったからこそ、これほど多くの新議員がこうも突然議会に入れられたのだと、思い込んでしまったのである。このような空想にどんな根拠があるのかは、当時の歴史をよく読んだ人の判断に委ねよう。主教冠に特有の資質である信仰心については、同じ尺度で判断すれば、その蓄えはいつもおよそ同じであり、しかも疑いなく、いつも最高に達しているはずである。いっそう疑う余地はない。教会の事柄一般について、著者は「すべてあるべきとおりである」と知る幸いに恵まれたと、別の箇所で請け合っているからである。",
      "translation_status": "reviewed"
    },

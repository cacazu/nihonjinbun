    },
    {
      "id": "bentham-preface-p038",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n125/mode/1up",
          "source_sequence": 70,
          "printed_page": "110"
        }
      ],
      "source_text": "It is not here, that after relating the Laws by which peaceable Christians are made punishable for worshipping God according to their consciences, he pronounces with equal peremptoriness and complacency, that every thing, yes, ‘every thing is as it should be.’",
      "translation_ja": "穏やかに暮らすキリスト教徒が、良心に従って神を礼拝したために処罰される法律を紹介したあと、「何もかも」、そう、「何もかもあるべきようになっている」と、きっぱり、そして満足げに言い切るのは、ここではない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note22",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n125/mode/1up",
          "source_sequence": 71,
          "printed_page": "110"
        }
      ],
      "source_text": "‘In what I have now said,’ says he, ‘I would not be understood to derogate from the rights of the national Church, or to favour a loose latitude of propagating any crude undigested sentiments in religious matters. Of propagating, I say; for the bare entertaining them, without an endeavour to diffuse them, seems hardly cognizable by any human authority. I only mean to illustrate the excellence of our present establishment, by looking back to former times. Every thing is now as it should be; unless, perhaps, that heresy ought to be more strictly defined, and no prosecution permitted, even in the Ecclesiastical Courts, till the tenets in question are by proper authority previously declared to be heretical. Under these restrictions it seems necessary for the support of the national religion,’ (the national religion being such, we are to understand, as would not be able to support itself were any one at liberty to make objections to it) ‘that the officers of the Church should have power to censure heretics, but not to exterminate or destroy them.’ Upon looking into a later edition (the fifth) I find this passage has undergone a modification. After ‘Every thing is now as it should be’ is added, ‘with respect to the spiritual cognizance, and spiritual punishment of heresy.’ After ‘the officers of the Church should have power to censure heretics’ is added, ‘but not to harass them with temporal penalties, much less to exterminate or destroy them.’ How far the mischievousness of the original text has been cured by this amendment, may be seen from Dr. Furneaux, Lett. II. p. 30, 2d edit.",
      "translation_ja": "「いま述べたことは」と著者は言う。「国教会の権利を損なってよいという意味でも、宗教上の生煮えで整理されていない考えを何でも広めてよいという意味でもない。広めること、と断ったのは、広めようと努力せず、ただそう考えているだけなら、人間のどんな権威も、まず審理の対象にはできないと思うからだ。昔を振り返り、いまの制度の優れているところを示したいだけである。いまでは何もかもあるべきようになっている。ただ、異端はもっと厳密に定義すべきかもしれない。また、問題の教説が正当な権威によってあらかじめ異端だと宣告されるまでは、教会裁判所でさえ、訴追を許してはならないだろう。このような制限の下で、国教を支えるには」〔どうやら、自由に異論を唱えられては自立できないような国教だ、と理解すべきなのだろう〕「教会の役職者に異端者を戒告する権力が必要である。ただし、異端者を根絶したり、滅ぼしたりする権力は与えてはならない」。後の版（第5版）を見ると、この箇所は修正されている。「いまでは何もかもあるべきようになっている」の後に、「異端を教会が審理し、教会の刑を科すことに関しては」と加わった。「教会の役職者に異端者を戒告する権力が必要である」の後には、「だが世俗の刑罰で彼らを悩ませる権力、まして根絶し、滅ぼす権力を与えてはならない」と加わった。この修正で元の文章の害がどの程度取り除かれたかは、ファーノー博士の第2書簡、第2版30頁を見れば分かる。",
      "translation_status": "reviewed"
    },

          "printed_page": "231"
        }
      ],
      "source_text": "The next most obvious extravagant.",
      "translation_ja": "次に素直な意味では、とんでもない話になる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-p004",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n246/mode/1up",
          "source_sequence": 561,
          "printed_page": "231",
          "printed_page_end": "232"
        }
      ],
      "source_text": "IV. Complete the sense of the phrase, “to make laws;” add to it, in this place, what it wants in order to be an adequate expression of the import which the preceding paragraph seemed to annex to it; you have now, for what is mentioned as the object of the “duty,” another sense indeed, but a sense still more untenable than the foregoing. “Thus far,” says our Author (recapitulating what he had been saying before) “as to the right of the supreme power to make laws.” — By this “right” we saw, in the preceding chapter, was meant, a right to make laws in all cases whatsoever. “But further,” he now adds, “it is its duty likewise.” Its duty then to do — what? to do the same thing that it was before asserted to be its right to do — to make laws in all cases whatsoever: or (to use another word, and that our Author’s own, and that applied to the same purpose) that it is its duty to be “absolute.” A sort of duty this which will probably be thought rather a singular one.",
      "translation_ja": "第四節　「法を作る」という句の意味を補ってみよう。前の段落がその句に込めたらしい意味を、ここで十分に表せるよう、足りないところを加えるのである。すると、「義務」が求めるとされる行為について、確かに別の意味が得られるが、先ほどの意味より、なお成り立ちがたい。著者は、これまでの話をまとめて、「最高権力が法を作る権利については、ここまでである」と言う。この「権利」とは、前章で見たとおり、あらゆる場合に法を作る権利を指した。「だがそれだけでなく」と今度は言い足す。「それは最高権力の義務でもある」。では何をする義務か。する権利があると先ほど断言した、その同じことをする義務である。つまり、あらゆる場合に法を作る義務である。別の言葉、しかも著者自身が同じ趣旨で使った言葉を使うなら、権力が「絶対的」である義務である。ずいぶん変わった義務だと思う人が多いだろう。",
      "translation_status": "reviewed"
    },
    {

          "url": "https://archive.org/details/cu31924030442077/page/n173/mode/1up",
          "source_sequence": 265,
          "printed_page": "158"
        }
      ],
      "source_text": "Nor, if stated more particularly, could it answer what was designed by it.",
      "translation_ja": "もっと具体的に述べたとしても、狙いは果たせない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p041",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n173/mode/1up",
          "source_sequence": 266,
          "printed_page": "158"
        }
      ],
      "source_text": "XLI. Let it be said, that part at least of this promise was to govern in subservience to Law: that hereby a more precise rule was laid down for his conduct, by means of this supposal of a promise, than that other loose and general rule to govern in subservience to the happiness of his people: and that, by this means, it is the letter of the Law that forms the tenor of the rule.",
      "translation_ja": "第四十一節　では、この約束の少なくとも一部は、法に従って統治するということだったとしよう。その約束があったと仮定すれば、人民の幸福に役立つよう統治せよという、おおまかで一般的な規則よりも正確に、王の行動を規律できる。こうして法の文言が、王の従うべき規則の内容を定める、としよう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p041-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n173/mode/1up",
          "source_sequence": 267,
          "printed_page": "158",
          "printed_page_end": "159"
        }
      ],
      "source_text": "Now true it is, that the governing in opposition to Law, is one way of governing in opposition to the happiness of the people: the natural effect of such a contempt of the Law being, if not actually to destroy, at least to threaten with destruction, all those rights and privileges that are founded on it: rights and privileges on the enjoyment of which that happiness depends. But still it is not this that can be safely taken for the entire purport of the promise here in question: and that for several reasons. First, Because the most mischievous, and under certain constitutions the most feasible, method of governing in opposition to the happiness of the people, is, by setting the Law itself in opposition to their happiness. Secondly, Because it is a case very conceivable, that a King may, to a great degree, impair the happiness of his people without violating the letter of any single Law. Thirdly, Because extraordinary occasions may now and then occur, in which the happiness of the people may be better promoted by acting, for the moment, in opposition to the Law, than in subservience to it. Fourthly, Because it is not any single violation of the Law, as such, that can properly be taken for a breach of his part of the contract, so as to be understood to have released the people from the obligation of performing theirs. For, to quit the fiction, and resume the language of plain truth, it is scarce ever any single violation of the Law that, by being submitted to, can produce so much mischief as shall surpass the probable mischief of resisting it. If every single instance whatever of such a violation were to be deemed an entire dissolution of the contract, a man who reflects at all would scarce find anywhere, I believe, under the sun, that Government which he could allow to subsist for twenty years together. It is plain, therefore, that to pass any sound decision upon the question which the inventors of this fiction substituted instead of the true one, the latter was still necessary to be decided. All they gained by their contrivance was, the convenience of deciding it obliquely, as it were, and by a side wind — that is, in a crude and hasty way, without any direct and steady examination.",
      "translation_ja": "確かに、法に反して統治するのは、人民の幸福に反して統治する一つのやり方である。法をないがしろにすれば、法を土台とする権利や特権、すなわち人民が幸福であるために享受する必要のある権利や特権をすべて、実際に壊さないまでも、壊されかねない状態に置くのは、自然な成りゆきである。しかし、法に従って統治することが、当の約束の趣旨のすべてだと安心して受け取ることはできない。理由はいくつかある。第一に、人民の幸福に反して統治するいちばん有害なやり方、しかも国制によってはいちばん行いやすいやり方は、法そのものを人民の幸福に反するようにすることだからである。第二に、法の文言には一つも背かないで、王が人民の幸福を大いに損なうことも、十分に考えられるからである。第三に、稀には、一時的に法に反して行動する方が、法に従うよりも人民の幸福にかなう、例外的な機会が生じうるからである。第四に、一度の違法行為だけで、王が契約における自分の義務を破り、人民が自分たちの義務を果たさずに済むようになったと見なすのは適切でないからである。擬制を離れ、ありのままの言い方に戻れば、一度の違法行為を甘受して、それに抵抗することで予想される害を上回る害が生まれることは、まずない。このような違法行為があるたびに契約が完全に解けると見なすなら、少しでもよく考える人は、二十年続けて存続を認めてよいような政府を、世界のどこにもほとんど見つけられまい。したがって、擬制を考案した人々が本来の問いの代わりに立てた問いに、まともな判断を下すには、依然として本来の問いに答える必要があったのは明らかである。この工夫で得られたのは、いわば横から回り道をして問いに答えられる手軽さだけだった。つまり、正面から腰を据えて考えず、粗雑に、性急に答えを出せたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin42",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

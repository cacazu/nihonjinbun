          "source_sequence": 505,
          "printed_page": "215"
        }
      ],
      "source_text": "See Ch. V. par. 7, note 1.",
      "translation_ja": "第五章第七節第一注参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin22",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n230/mode/1up",
          "source_sequence": 506,
          "printed_page": "215"
        }
      ],
      "source_text": "Not characterizable by any common sign.",
      "translation_ja": "誰にも共通の目印では見分けられない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p022",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n230/mode/1up",
          "source_sequence": 507,
          "printed_page": "215",
          "printed_page_end": "216"
        }
      ],
      "source_text": "XXII. A natural question here is — by what sign shall this juncture be known? By what common signal alike conspicuous and perceptible to all? A question which is readily enough started, but to which, I hope, it will be almost as readily perceived that it is impossible to find an answer. Common sign for such a purpose, I, for my part, know of none: he must be more than a prophet, I think, that can shew us one. For that which shall serve a particular person, I have already given one — his own internal persuasion of a balance of utility on the side of resistance.",
      "translation_ja": "第二十二節　ここで自然に浮かぶのは、この時点はどんな印で分かるのか、という問いである。誰の目にも同じように明らかで、誰にも知りうる共通の目印は何か。問いを立てるのはたやすい。しかし答えが見つからないことも、ほとんど同じくらいたやすく分かると思う。そんな用途に役立つ共通の印を、私は知らない。示してくれる人がいるなら、預言者以上でなければなるまい。個々人に役立つものなら、一つすでに示した。功利を比較すれば抵抗する方がよいという、本人自身の内なる確信である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin23",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n231/mode/1up",
          "source_sequence": 508,
          "printed_page": "216"
        }
      ],
      "source_text": "Freedom in a government depends not upon any limitation to the Supreme Power.",
      "translation_ja": "自由な統治は最高権力への制限にかかっているのではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p023",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n231/mode/1up",
          "source_sequence": 509,
          "printed_page": "216"
        }
      ],
      "source_text": "XXIII. Unless such a sign then, which I think impossible, can be shewn, the field, if one may say so, of the supreme governor’s authority, though not infinite, must unavoidably, I think, unless where limited by express convention, be allowed to be indefinite. Nor can I see any narrower, or other bounds to it, under this constitution, or under any other yet freer constitution, if there be one, than under the most despotic. Before the juncture I have been describing were arrived, resistance, even in a country like this, would come too soon: were the juncture arrived already, the time for resistance would be come already, under such a government even as any one should call despotic.",
      "translation_ja": "第二十三節　そのような印は示しえないと思うが、示せないかぎり、最高の統治者の権威が及ぶ範囲は、無限ではないにせよ、明文の合意で制限される場合を除いて、不定であると認めざるをえないと思う。わが国の国制のもとでも、それより自由な国制があるならそのもとでも、最も専制的な国制のもとより狭い、あるいは違った境界があるとは私には見えない。先ほど述べた時点が来る前であれば、わが国のような国でも、抵抗にはまだ早い。すでにその時点が来ていれば、専制的と呼ばれるような政府のもとでさえ、抵抗する時はすでに来ていることになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note113",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n231/mode/1up",
          "source_sequence": 510,
          "printed_page": "216"
        }
      ],
      "source_text": "This respects the case where one state has, upon terms, submitted itself to the government of another: or where the governing bodies of a number of states agree to take directions in certain specified cases, from some body or other that is distinct from all of them: consisting of members, for instance, appointed out of each.",
      "translation_ja": "これは、ある国が条件つきで別の国の統治に服した場合、または、いくつかの国の統治機関が、明示したいくつかの場合に、どの機関とも別の団体から指示を受けることに同意した場合を指す。たとえば、その国々から任命された代表でできた団体である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin24",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n231/mode/1up",
          "source_sequence": 511,
          "printed_page": "216"
        }
      ],
      "source_text": "Principal circumstances on which it does depend.",
      "translation_ja": "自由な統治を支える主な事情",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p024",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n231/mode/1up",
          "source_sequence": 512,
          "printed_page": "216",
          "printed_page_end": "217"
        }
      ],
      "source_text": "XXIV. In regard to a government that is free, and one that is despotic, wherein is it then that the difference consists? Is it that those persons in whose hands that power is lodged which is acknowledged to be supreme, have less power in the one than in the other, when it is from custom that they derive it? By no means. Is it not that the power of one any more than of the other has any certain bounds to it? The distinction turns upon circumstances of a very different complexion: — on the manner in which that whole mass of power, which, taken together, is supreme, is, in a free state, distributed among the several ranks of persons that are sharers in it: — on the source from whence their titles to it are successively derived: — on the frequent and easy changes of condition between governors and governed; whereby the interests of the one class are more or less indistinguishably blended with those of the other: — on the responsibility of the governors; or the right which a subject has of having the reasons publicly assigned and canvassed of every act of power that is exerted over him: — on the liberty of the press; or the security with which every man, be he of the one class or the other, may make known his complaints and remonstrances to the whole community; — on the liberty of public association; or the security with which malcontents may communicate their sentiments, concert their plans, and practise every mode of opposition short of actual revolt, before the executive power can be legally justified in disturbing them.",
      "translation_ja": "第二十四節　では、自由な政府と専制的な政府の違いはどこにあるのか。最高であると認められる権力を握る人々が、それを慣習から得ている場合、一方では他方より持つ権力が小さいことなのか。決してそうではない。一方の権力には、他方と違って、何か決まった境界があるということでもない。違いはまるで性質の異なる事情にかかる。すなわち、全部を合わせれば最高となる権力全体が、自由な国では、権力を分け持つさまざまな地位の人々の間でどう配分されるか。次々に権力を担う人々が、その資格をどこから得るか。統治する側と統治される側の立場が、頻繁に、簡単に入れ替わり、そのおかげで一方の利益と他方の利益とが、いくらかでも見分けがつかないほどに混ざっているか。統治者に説明責任があるか、言い換えれば、臣民の一人ひとりに対して権力が行使されるたびに、その理由を公に示し、検討してもらえる権利を臣民が持つか。出版の自由、すなわち、どちらの立場の人であっても、自分の不満や異議を、安心して共同体全体に知らせられるか。そして公の結社の自由、すなわち不満を持つ人々が、実際の反乱に至らないかぎり、安心して意見を伝え合い、方針を話し合い、いかなる形でも反対の行動を取ることができ、執行権がその妨げをする法的な正当性を持たないか。これらの事情が違いを決める。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin25",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n232/mode/1up",
          "source_sequence": 513,
          "printed_page": "217"
        }
      ],
      "source_text": "Freedom in a government how far favourable to resistance.",
      "translation_ja": "自由な政府はどこまで抵抗を容易にするか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p025",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n232/mode/1up",
          "source_sequence": 514,
          "printed_page": "217"
        }
      ],
      "source_text": "XXV. True then, it may be, that, owing to this last circumstance in particular, in a state thus circumstanced, the road to a revolution, if a revolution be necessary, is to appearance shorter; certainly more smooth and easy. More likelihood, certainly there is of its being such a revolution as shall be the work of a number; and in which, therefore, the interests of a number are likely to be consulted. Grant then, that by reason of these facilitating circumstances, the juncture itself may arrive sooner, and upon less provocation, under what is called a free government, than under what is called an absolute one: grant this; — yet till it be arrived, resistance is as much too soon under one of them as under the other.",
      "translation_ja": "第二十五節　たしかに、特に最後の事情のおかげで、このような国では、革命が必要だとして、そこへの道はいかにも短いように見え、確かに平坦で通りやすいのかもしれない。大勢が力を合わせた革命になり、そのため大勢の利益が顧みられる見込みも、確かに大きい。こうした事情が抵抗を容易にするため、いわゆる自由な政府のもとでは、いわゆる絶対的な政府のもとより、抵抗の時点が早く、政府の横暴もそれほどひどくならないうちに来ることがありうる、と認めてみよう。そう認めても、その時点が来るまでは、どちらの政府のもとでも、同じように抵抗するには早すぎる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin26",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 515,
          "printed_page": "218"
        }
      ],
      "source_text": "The supreme power not limited in itself.",
      "translation_ja": "最高権力はそれ自体では制限されない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p026",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 516,
          "printed_page": "218"
        }
      ],
      "source_text": "XXVI. Let us avow then, in short, steadily but calmly, what our Author hazards with anxiety and agitation, that the authority of the supreme body cannot, unless where limited by express convention, be said to have any assignable, any certain bounds. — That to say there is any act they cannot do, — to speak of any thing of their’s as being illegal, — as being void; — to speak of their exceeding their authority (whatever be the phrase) — their power, their right, — is, however common, an abuse of language.",
      "translation_ja": "第二十六節　要するに、著者が不安と動揺を抱えながらおそるおそる言い出したことを、私たちは動じず、しかし冷静に認めよう。最高機関の権威には、明文の合意で制限される場合を除けば、示しうる一定の境界があるとは言えない。最高機関にできない行為があると言うこと、そのしたことの何かを違法だ、無効だと言うこと、あるいは、その権威、権力、権利を越えたと、どんな言い方であれ言うことは、いかに広く行われていても、言葉の誤用である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin27",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 517,
          "printed_page": "218"
        }
      ],
      "source_text": "Arguments that suppose it to be so, unsatisfactory —",
      "translation_ja": "制限されると仮定する議論は納得しがたい",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p027",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 518,
          "printed_page": "218"
        }
      ],
      "source_text": "XXVII. The legislature cannot do it? The legislature cannot make a law to this effect? Why cannot? What is there that should hinder them? Why not this, as well as so many other laws murmured at, perhaps, as inexpedient, yet submitted to without any question of the rights. With men of the same party, with men whose affections are already lifted against the law in question, any thing will go down: any rubbish is good that will add fuel to the flame. But with regard to an impartial bystander, it is plain that it is not denying the right of the legislature, their authority, their power, or whatever be the word — it is not denying that they can do what is in question — it is not that, I say, or any discourse verging that way that can tend to give him the smallest satisfaction.",
      "translation_ja": "第二十七節　立法機関にそれはできないと言うのか。その趣旨の法は作れないと。なぜ作れないのか。いったい何が妨げるのか。ほかにも、得策ではないと不平を言われることがあっても、作る権利は疑われることもなく、人々が従っている法律がいくらもある。なのに、なぜこれだけがだめなのか。同じ党派の人や、もう気持ちが当の法に反対へ傾いている人には、何でも通る。火にくべる燃料になるなら、どんなごみでもよい。しかし、公平な傍観者なら、立法機関の権利、権威、権力を、何と呼ぶにせよ否定しても、当のことができるのを否定しても、少しも納得しないだろう。そういう否定も、同じ方向に行く議論も、役には立たないことは明らかである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin28",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 519,
          "printed_page": "218"
        }
      ],
      "source_text": "— and inapplicable to particulars.",
      "translation_ja": "しかも個々の場合に当てはまらない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p028",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n233/mode/1up",
          "source_sequence": 520,
          "printed_page": "218",
          "printed_page_end": "219"
        }
      ],
      "source_text": "XXVIII. Grant even the proposition in general: — What are we the nearer? Grant that there are certain bounds to the authority of the legislature: — Of what use is it to say so, when these bounds are what no body has ever attempted to mark out to any useful purpose; that is, in any such manner whereby it might be known beforehand what description a law must be of to fall within, and what to fall beyond them? Grant that there are things which the legislature cannot do; — grant that there are laws which exceed the power of the legislature to establish. What rule does this sort of discourse furnish us for determining whether any one that is in question is, or is not of the number? As far as I can discover, none. Either the discourse goes on in the confusion it began; either all rests in vague assertions, and no intelligible argument at all is offered; or if any, such arguments as are drawn from the principle of utility: arguments which, in whatever variety of words expressed, come at last to neither more nor less than this; that the tendency of the law is, to a greater or a less degree, pernicious. If this then be the result of the argument, why not come home to it at once? Why turn aside into a wilderness of sophistry, when the path of plain reason is straight before us?",
      "translation_ja": "第二十八節　一般論として、その主張を認めたところで、私たちは何に近づくのか。立法機関の権威に一定の境界があるとしよう。だが、どんな性質の法律ならその内に収まり、どんな性質なら外に出るかを前もって知りうるような、役に立つ仕方でその境界を引こうとした人が一人もいないのに、そう言って何になるのか。立法機関にはできないことがあるとしよう。立法機関に制定する権力のない法律があるとしよう。では、いま問題になっている法律がその一つかどうかを見分けるために、この種の話はどんな規則を与えるのか。私の見るかぎり、一つもない。議論が初めの混乱のうちにとどまり、何もかもあいまいな断言にかかっていて、意味の通る論証が一つも示されないか、論証があるとしても、功利の原理から引き出したものか、どちらかである。後の論証は、どれほどいろいろな言い方をしても、つまるところ、この法律には程度の差こそあれ有害な傾向があるということに尽きる。それが議論の行き着く先なら、なぜ最初からそこへ行かないのか。平明な理性の道がまっすぐ目の前にあるのに、なぜ脇に折れて、こじつけの荒れ野に踏み込むのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin29",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n234/mode/1up",
          "source_sequence": 521,
          "printed_page": "219"
        }
      ],
      "source_text": "What they lead to is either an appeal to the body of the people —",
      "translation_ja": "この議論が導くものの一つは、人民全体への訴えである",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p029",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n234/mode/1up",
          "source_sequence": 522,
          "printed_page": "219",
          "printed_page_end": "220"
        }
      ],
      "source_text": "XXIX. What practical inferences those who maintain this language mean should be deduced from it, is not altogether clear; nor, perhaps, does every one mean the same. Some who speak of a law as being void (for to this expression, not to travel through the whole list, I shall confine myself) would persuade us to look upon the authors of it as having thereby forfeited, as the phrase is, their whole power: as well that of giving force to the particular law in question, as to any other. These are they who, had they arrived at the same practical conclusion through the principle of utility, would have spoken of the law as being to such a degree pernicious, as that, were the bulk of the community to see it in its true light, the probable mischief of resisting it would be less than the probable mischief of submitting to it. These point, in the first instance, at hostile opposition.",
      "translation_ja": "第二十九節　こういう言い方を守る人たちが、そこからどんな実際の結論を導くつもりなのかは、すっかり明らかではない。おそらく、全員が同じことを考えているのでもない。ある法律は無効だと言う人のうち、一部は、それを作った者が、それによっていわゆる権力の全面的な失権を招いたと、私たちに考えさせようとする。すべての言い回しを取り上げる代わりに、ここでは「無効だ」に限ろう。失ったという権力は、当の法律ばかりでなく、ほかのどんな法律にも効力を与える権力である。この人たちが功利の原理を通じて同じ実際の結論に達したなら、その法律は、共同体の大半が正しく見れば、抵抗で予想される害が服従で予想される害より小さくなるほど有害である、と語っただろう。この人たちは、まず力による対抗を考えている。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin30",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n235/mode/1up",
          "source_sequence": 523,
          "printed_page": "220"
        }
      ],
      "source_text": "— or to the judicial power.",
      "translation_ja": "もう一つは司法権への訴えである",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p030",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n235/mode/1up",
          "source_sequence": 524,
          "printed_page": "220"
        }
      ],
      "source_text": "XXX. Those who say nothing about forfeiture are commonly less violent in their views. These are they who, were they to ground themselves on the principle of utility, and, to use our language, would have spoken of the law as being mischievous indeed, but without speaking of it as being mischievous to the degree that has been just mentioned. The mode of opposition which they point to is one which passes under the appellation of a legal one.",
      "translation_ja": "第三十節　失権について何も言わない人々は、普通、考えがそれほど急進的ではない。こうした人たちが功利の原理に立つなら、私たちの言い方で、この法律は確かに有害だが、今述べたほど有害だとは言わなかっただろう。彼らが考える対抗の仕方は、法にかなった対抗と呼ばれて通っているものである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin31",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n235/mode/1up",
          "source_sequence": 525,
          "printed_page": "220"
        }
      ],
      "source_text": "Which tends to give it a control over the legislative.",
      "translation_ja": "司法権に立法権を抑える力を与えることになる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p031",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n235/mode/1up",
          "source_sequence": 526,
          "printed_page": "220",
          "printed_page_end": "221"
        }
      ],
      "source_text": "XXXI. Admit then the law to be void in their sense, and mark the consequences. The idea annexed to the epithet void is obtained from those instances in which we see it applied to a private instrument. The consequence of a private instrument’s being void is, that all persons concerned are to act as if no such instrument had existed. The consequence, accordingly, of a law’s being void must be, that people shall act as if there were no such law about the matter: and therefore that if any person in virtue of the mandate of the law should do anything in coercion of another person, which without such law he would be punishable for doing, he would still be punishable; to wit, by appointment of the judicial power. Let the law for instance, be a law imposing a tax: a man who should go about to levy the tax by force would be punishable as a trespasser: should he chance to be killed in the attempt, the person killing him would not be punishable as for murder: should he kill, he himself would, perhaps, be punishable as for murder. To whose office does it appertain to do those acts in virtue of which such punishment would be inflicted? To that of the Judges. Applied to practice then, the effect of this language is, by an appeal made to the Judges, to confer on those magistrates a controlling power over the acts of the legislature.",
      "translation_ja": "第三十一節　そこで、その人たちの意味で、当の法は無効だと認め、その結果を見よう。「無効」という形容に結びつく考えは、この語が私人間の証書に使われる例から得られる。私人間の証書が無効なら、関係者はみな、そんな証書はなかったかのように振る舞うことになる。したがって法の無効から生じるのは、その件についてそんな法律はないかのように、人々が振る舞うということでなければならない。それゆえ、法の命令に基づいて他人を強制し、その法がなければ罰を受けるようなことをした人は、やはり罰を受けうる。すなわち司法機関の決定に基づいて、処罰されうるのである。たとえば課税の法律だとしよう。税を強制的に徴収しようとした者は、不法に他人の権利を侵した者として処罰されうる。その試みの中でたまたま殺されたなら、その人を殺した者は殺人罪の罰を受けず、反対に徴収する者の方が人を殺したなら、その者自身が殺人罪で罰せられるかもしれない。このような罰を科すために必要な行為は、誰の職務か。裁判官の職務である。そこで、この言い方を実際に当てはめると、裁判官に訴えることにより、立法機関の行為を抑える権力を、裁判官に授けることになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin32",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n236/mode/1up",
          "source_sequence": 527,
          "printed_page": "221"
        }
      ],
      "source_text": "Remedy worse than the disease.",
      "translation_ja": "治すはずの手段が病より悪い",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p032",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n236/mode/1up",
          "source_sequence": 528,
          "printed_page": "221"
        }
      ],
      "source_text": "XXXII. By this management a particular purpose might perhaps, by chance be answered: and let this be supposed a good one. Still what benefit would, from the general tendency of such a doctrine, and such a practice in conformity to it, accrue to the body of the people is more than I can conceive. A Parliament, let it be supposed, is too much under the influence of the Crown: pays too little regard to the sentiments and the interests of the people. Be it so. The people at any rate, if not so great a share as they might and ought to have, have had, at least, some share in choosing it. Give to the Judges a power of annulling its acts; and you transfer a portion of the supreme power from an assembly which the people have had some share, at least, in choosing, to a set of men in the choice of whom they have not the least imaginable share: to a set of men appointed solely by the Crown: appointed solely, and avowedly and constantly, by that very magistrate whose partial and occasional influence is the very grievance you seek to remedy.",
      "translation_ja": "第三十二節　こうすれば、たまたま、ある目的を果たせるかもしれない。しかもその目的はよいものとしよう。それでも、このような学説と、それに沿った実践とが一般に広がって、人民全体にどんな利益があるかは、私には想像もつかない。議会が王権にあまりに影響され、人民の気持ちや利益をあまりに顧みないとしよう。よろしい。それでも人民は、できるはずの、またあるべきだけの役割は果たさなかったにせよ、議会の議員を選ぶのに少なくともいくらかは関わった。ところが裁判官に、議会の行為を無効にする権力を与えるなら、最高権力の一部は、選出に人民が少しは関わった議会から、選出に人民がこれっぽっちも関われない一団の人々へ移る。その人々を任命するのは王権だけである。こちらが取り除きたいと考える害そのものが、ほかならぬ王が時折、部分的に影響を及ぼすことなのに、裁判官を任命するのは、いつでも公然とその王ただ一人なのだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin33",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n236/mode/1up",
          "source_sequence": 529,
          "printed_page": "221"
        }
      ],
      "source_text": "But not so bad as some might represent it.",
      "translation_ja": "ただし、人によって言うほど悪くはない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p033",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n236/mode/1up",
          "source_sequence": 530,
          "printed_page": "221",
          "printed_page_end": "222"
        }
      ],
      "source_text": "XXXIII. In the heat of debate, some, perhaps, would be for saying of this management that it was transferring at once the supreme authority from the legislative power to the judicial. But this would be going too far on the other side. There is a wide difference between a positive and a negative part in legislation. There is a wide difference again between a negative upon reasons given, and a negative without any. The power of repealing a law even for reasons given is a great power: too great indeed for Judges: but still very distinguishable from, and much inferior to that of making one.",
      "translation_ja": "第三十三節　議論が熱くなれば、この手立ては、最高の権威を立法権から司法権に一挙に移すものだと言いたがる人もいよう。しかし、それは逆の方向に行きすぎている。立法において何かを積極的に定める役割と、それを拒否する役割には、大きな違いがある。理由を示した拒否と、理由なしの拒否との間にも、大きな違いがある。理由を示すにせよ、法を廃止する権力は大きい。確かに、裁判官には大きすぎる。それでも、法を作る権力とは明らかに区別でき、しかもそれよりずっと小さい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note114",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n237/mode/1up",
          "source_sequence": 531,
          "printed_page": "222"
        }
      ],
      "source_text": "Notwithstanding what has been said, it would be in vain to dissemble, but that, upon occasion, an appeal of this sort may very well answer, and has, indeed, in general, a tendency to answer, in some sort, the purposes of those who espouse, or profess to espouse, the interests of the people. A public and authorised debate on the propriety of the law is by this means brought on. The artillery of the tongue is played off against the law, under cover of the law itself. An opportunity is gained of impressing sentiments unfavourable to it, upon a numerous and attentive audience. As to any other effects from such an appeal, let us believe that in the instances in which we have seen it made, it is the certainty of miscarriage that has been the encouragement to the attempt.",
      "translation_ja": "以上は述べたものの、この種の訴えが、時には人民の利益を擁護する人々、あるいは擁護すると公言する人々の目的をかなりよく果たせること、そして一般にも、ある程度その目的を果たす傾向があることは、隠しても無駄だろう。そうすれば、その法律が適切かどうかについて、公に認められた議論が始まる。法律そのものを盾に、言葉の砲火が法律に浴びせられる。大勢が耳を傾けるところで、その法に反対する見解を印象づける機会が手に入る。その訴えのそのほかの効果についていえば、これまで私たちが見た例では、失敗が確実だったからこそ、かえって試みる気になったのだ、と考えておこう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin34",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n237/mode/1up",
          "source_sequence": 532,
          "printed_page": "222"
        }
      ],
      "source_text": "The supreme power limitable by convention.",
      "translation_ja": "最高権力も合意で制限できる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p034",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n237/mode/1up",
          "source_sequence": 533,
          "printed_page": "222",
          "printed_page_end": "223"
        }
      ],
      "source_text": "XXXIV. Let us now go back a little. In denying the existence of any assignable bounds to the supreme power, I added, “unless where limited by express convention:” for this exception I could not but subjoin. Our Author indeed, in that passage in which, short as it is, he is the most explicit, leaves, we may observe, no room for it. “However they began,” says he (speaking of the several forms of government) “however they began, and by what right soever they subsist, there is and must be in all of them an authority that is absolute.” — To say this, however, of all governments without exception; — to say that no assemblage of men can subsist in a state of government, without being subject to some one body whose authority stands unlimited so much as by convention; to say, in short, that not even by convention can any limitation be made to the power of that body in a state which in other respects is supreme, would be saying, I take it, rather too much: it would be saying that there is no such thing as government in the German Empire; nor in the Dutch Provinces; nor in the Swiss Cantons; nor was of old in the Achaean league.",
      "translation_ja": "第三十四節　少し戻ろう。最高権力には示しうる境界はないと述べるとき、「明文の合意で制限される場合を除いて」と付け加えた。この例外は付け加えずにはいられないからである。ところが著者は、短いながらも最もはっきり述べた一節では、例外の入る余地を残さない。「どのように始まったにせよ」と、さまざまな政体について語って言う。「どのように始まったにせよ、どのような権原によって存続するにせよ、どの政体にも絶対的な権威が存在し、存在しなければならない」。しかしそれを例外なくあらゆる政府について言うなら、どんな人々の集まりも、合意でさえ制限されない権威を持つどこか一つの団体に従属しなければ、政府のある状態を保てないことになる。要するに、ほかの点では国で最高位にある機関の権力に、合意によってさえ何一つ制限を設けられないと言うなら、言いすぎだろう。ドイツ帝国にも、ネーデルラント諸州にも、スイス諸州にも、政府は存在せず、昔のアカイア同盟にもなかったと言うに等しい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-note115",
      "section_id": "bentham-ch04",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],

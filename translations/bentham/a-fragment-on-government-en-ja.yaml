    {
      "id": "bentham-ch02-p035",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n195/mode/1up",
          "source_sequence": 372,
          "printed_page": "180",
          "printed_page_end": "181"
        }
      ],
      "source_text": "XXXV. The qualification of goodness, I think it was, that belonged to the Government of all, while there was such a Government. This having taken its flight, as we have seen, to the region of nonentities, the qualification that was designed for it remains upon his hands: he is at liberty, therefore, to make a compliment of it to Aristocracy or to Monarchy, which best suits him. Perhaps it were as well to give it to Monarchy; the title of that form of Government to its own peculiar qualification, power, being, as we have seen, rather an equivocal one: or else, which, perhaps, is as good a way of settling matters as any, he may set them to cast lots.",
      "translation_ja": "第三十五節　全員による統治というものがあった間は、それに属していたのは、確か善意という資質だった。見たように、今やその政体は実在しないものの領域に飛び去り、与えるつもりだった資質は著者の手もとに残された。だから、都合のよい方を選んで、貴族政にでも君主政にでも、自由に贈り物にすればよい。君主政にやるのもよいかもしれない。君主政が本当に、力を固有の資質だと主張できるのかは、見たとおり、いささかあやしいからである。それがいやなら、どの方法にも劣らぬ決め方だろうが、二つにくじ引きをさせてもよい。",
      "translation_status": "reviewed"
    },
    {

          "source_sequence": 245,
          "printed_page": "152"
        }
      ],
      "source_text": "XXXIII. It is time this passage of our Author were dismissed. As among the expressions of it are some of the most striking of those which the vocabulary of the subject furnishes, and these ranged in the most harmonious order, on a distant glance nothing can look fairer: a prettier piece of tinsel-work one shall seldom see exhibited from the shew-glass of political erudition. Step close to it, and the delusion vanishes. It is then seen to consist partly of self-evident observations, and partly of contradictions; partly of what every one knows already, and partly of what no one can understand at all.",
      "translation_ja": "第三十三節　そろそろ、この一節を読むのは切り上げよう。この主題をめぐるひときわ目を引く言い回しがいくつも、見事な調和をなして並んでいるので、遠目にはこれほど美しく見えるものもない。政治学の博識を飾るショーケースに、これ以上きれいな金ぴかの細工はめったに並ばないだろう。ところが近寄ると、幻が消える。自明の話と矛盾とが、つまり、もう誰もが知っていることと、誰にもまるで分からないこととが、寄せ集められているのが見える。",

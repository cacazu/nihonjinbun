      ],
      "source_text": "3 Comm. 333. It is from the decisions of Courts of Justice that those rules of Law are framed, on the knowledge of which depend the life, the fortune, the liberty of every man in the nation. Of these decisions the Records are, according to our Author [1 Comm. 71] the most authentic histories. These Records were, till within these five-and-forty years, in Law-Latin: a language which, upon a high computation, about one man in a thousand used to fancy himself to understand. In this Law-Latin it is that our Author is satisfied they should have been continued, because the pyramids of Egypt have stood longer than the temples of Palmyra. He observes to us, that the Latin language could not express itself on the subject without borrowing a multitude of words from our own: which is to help to convince us that of the two the former is the fittest to be employed. He gives us to understand that, taking it altogether, there could be no room to complain of it, seeing it was not more unintelligible than the jargon of the schoolmen, some passages of which he instances; and then he goes on, ‘This technical Latin continued in use from the time of its first introduction till the subversion of our ancient constitution under Cromwell; when, among many other innovations on the body of the Law, some for the better and some for the worse, the language of our Records was altered and turned into English. But at the Restoration of King Charles, this novelty was no longer countenanced; the practisers finding it very difficult to express themselves so concisely or significantly in any other language but the Latin. And thus it continued without any sensible inconvenience till about the year 1730, when it was again thought proper that the Proceedings at Law should be done into English, and it was accordingly so ordered by statute 4 Geo. II. c. 26. This was done (continues our Author) in order that the common people might have knowledge and understanding of what was alleged or done for and against them in the process and pleadings, the judgment and entries in a cause. Which purpose I know not how well it has answered; but am apt to suspect that the people are now, after many years’ experience, altogether as ignorant in matters of law as before.’ In this scornful passage the words novelty—done into English—apt to suspect—altogether as ignorant—sufficiently speak the affection of the mind that dictated it. It is thus that our Author chuckles over the supposed defeat of the Legislature with a fond exultation which all his discretion could not persuade him to suppress. The case is this. A large portion of the body of the Law was, by the bigotry or the artifice of Lawyers, locked up in an illegible character, and in a foreign tongue. The statute he mentions obliged them to give up their hieroglyphics, and to restore the native language to its rights. This was doing much; but it was not doing every thing. Fiction, tautology, technicality, circuity, irregularity, inconsistency remain. But above all the pestilential breath of Fiction poisons the sense of every instrument it comes near. The consequence is, that the Law, and especially that part of it which comes under the topic of Procedure, still wants much of being generally intelligible. The fault then of the Legislature is their not having done enough. His quarrel with them is for having done any thing at all. In doing what they did, they set up a light, which, obscured by many remaining clouds, is still but too apt to prove an ignis fatuus: our Author, instead of calling for those clouds to be removed, deprecates all light, and pleads for total darkness. Not content with representing the alteration as useless, he would persuade us to look upon it as mischievous. He speaks of ‘inconveniences.’ What these inconveniences are it is pleasant to observe. In the first place, many young practisers, spoilt by the indulgence of being permitted to carry on their business in their mother-tongue, know not how to read a Record upon the old plan. ‘Many Clerks and Attornies,’ says our Author, ‘are hardly able to read, much less to understand a Record of so modern a date as the reign of George the First.’ What the mighty evil is here, that is to outweigh the mischief of almost universal ignorance, is not altogether clear: Whether it is, that certain Lawyers, in a case that happens very rarely, may be obliged to get assistance: or that the business in such a case may pass from those who do not understand it to those who do. In the next place, he observes to us, ‘it has much enhanced the expense of all legal proceedings: for since the practisers are confined (for the sake of the stamp-duties, which are thereby considerably increased) to write only a stated number of words in a sheet; and as the English language, through the multitude of its particles, is much more verbose than the Latin; it follows, that the number of sheets must be very much augmented by the change.’ I would fain persuade myself, were it possible, that this unhappy sophism could have passed upon the inventor. The sum actually levied on the public on that score is, upon the whole, either a proper sum or it is not. If it is, why mention it as an evil? If it is not, what more obvious remedy than to set the duties lower? After all, what seems to be the real evil, notwithstanding our Author’s unwillingness to believe it, is, that by means of this alteration, men at large are in a somewhat better way of knowing what their Lawyers are about: and that a disinterested and enterprising Legislator, should happily such an one arise, would now with somewhat less difficulty be able to see before him.",
      "translation_ja": "『イングランド法釈義』第3巻333頁。国の一人ひとりの生命、財産、自由は、ある法の規則を知っているかどうかにかかっている。その規則を形づくるのは、裁判所の判断である。著者によれば（『釈義』第1巻71頁）、その判断について最も確かな記録を伝えるのは、裁判の記録簿である。この記録は、四十五年ほど前まで、法律ラテン語で書かれていた。多めに見積もっても、千人に一人くらいしか、自分に分かると思う者のいなかった言葉である。著者に言わせれば、記録はそのまま法律ラテン語で書き続ければよかった。なぜかといえば、エジプトのピラミッドはパルミラの神殿より長く建ち続けているからだ。ラテン語でこの主題を述べるには、私たちの言葉から数多くの語を借りてこなければならなかった、と著者は指摘する。二つの言葉のうちラテン語こそふさわしいと、私たちに納得させる助けになるのだろう。著者はスコラ学者たちの難解な語法を何箇所か例に引き、全体としてはそれより分かりにくくもなかったのだから、法律ラテン語への不平の余地はないと、私たちに分からせる。そしてこう続ける。「この専門的なラテン語は、初めて取り入れられてから、クロムウェルのもとで古い国制が覆されるまで使われた。そのとき法の本体に、良い方にも悪い方にも、ほかに多くの変更があったのに伴い、記録簿の言葉も変えられ、英語にされた。だがチャールズ王の復位にあたって、この新奇なことはもはや認められなくなった。実務家にしてみれば、ラテン語以外の言葉で、同じほど簡潔に、また同じほど正確に表現するのは、たいへん難しかったからだ。こうして何の目立つ不便もなく、一七三〇年ころまで続いた。そのとき、裁判手続を英語に直すのがよいと再び考えられ、ジョージ二世治世第四年の制定法第26章が、これを命じた。そうしたのは」〔著者は続ける〕「訴訟の手続や弁論、判決や記録への記載で、庶民のために、あるいは庶民に対して何が述べられ、何が行われたかを、当人たちが知り、理解できるようにするためだ。この目的をどれほど果たしたかは分からない。長年の経験を経たいまも、民衆は、法について以前とまるで変わらず無知なのではないかと、私は疑っている」。この侮蔑に満ちた一節の「新奇なこと」「英語に直す」「疑っている」「まるで変わらず無知」といった言葉は、書かせた心の傾きをよく語っている。立法者は負けたのだと思い込み、著者はひそかに笑う。その得意ぶりは、どんなに分別を働かせても、隠す気にはなれないほどなのだ。実際はこうである。法律家の偏見か策略によって、法の大きな部分が、読みにくい文字と異国の言葉に閉じ込められていた。著者の挙げる制定法は、彼らに姿の読めない文字を捨てさせ、この国の言葉に本来の権利を取り戻させた。大きなことを成し遂げたが、それですべてを成し遂げたのではない。擬制、同語反復、専門語、回りくどさ、不規則さ、食い違いは残った。中でも法的擬制の毒気に触れた文書は、どれも意味を損なわれる。その結果、法、とりわけ手続と呼ばれる部分は、誰にでも分かるものになるまで、まだまだ遠い。したがって、立法者の落ち度は十分にしなかったことにある。著者の立法者への不平は、何かをしたことそのものにある。立法者が灯した明かりには、なお多くの雲がかかり、つい鬼火のように人を惑わせる。著者は、雲を払うよう求める代わりに、明かりは一切要らないと言い、完全な暗闇を訴える。変更は役に立たなかったと述べるだけでは満足せず、有害だったと見なせと、私たちを納得させたいのだ。著者は「不都合」を語る。この不都合が何なのか、見てみると面白い。第一に、多くの若い実務家は、母語で仕事をすることを許され、甘やかされたため、旧式の記録をどう読めばよいか分からない。「書記や事務弁護士の多くは」と著者は言う。「ジョージ一世の治世という、ごく最近の記録でさえ、読むのもやっとで、理解するなどとてもできない」。ほとんど全員が無知なままでいる害をしのぐ大きな害が、ここにどうしてあるのか、よく分からない。めったにない事件で、一部の法律家が人に手伝ってもらわねばならないことなのか。それとも、そのような事件が、分からない者の手から分かる者の手に移ることなのか。次いで著者はこう指摘する。「変更はあらゆる裁判手続の費用を大きく増した。実務家は、用紙一枚に一定の数の語しか書けないことになっている。これで税収が大いに増える印紙税のためである。しかも英語には小さな語が多く、ラテン語よりずっと言葉数が多いから、変更で用紙の枚数がかなり増えるのは当然だ」。できることなら、この不出来な詭弁に考え出した人本人がだまされたものと、思いたいところだ。このために現に人々から徴収する額は、全体として妥当か、妥当でないかのどちらかである。妥当なら、どうして害だと言うのか。妥当でないなら、税を下げるより明らかな対策があるだろうか。結局、著者が認めたがらない本当の「害」とはこういうものらしい。変更のおかげで、人々は、法律家が何をしているかを以前より知りやすくなった。そして、私心がなく進んでことを成そうという立法者が幸いにも現れれば、今では行く手をいくらか見通しやすくなったことである。",
      "translation_status": "reviewed"
    },

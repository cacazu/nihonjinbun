      "source_text": "V. supra, par. 13, note.",
      "translation_ja": "前掲第十三節の注を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin17",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n158/mode/1up",
          "source_sequence": 208,
          "printed_page": "143"
        }
      ],
      "source_text": "In the same political society the same persons alternately governors and subjects, with respect to the same persons.",
      "translation_ja": "同じ政治社会の同じ相手に対しても、統治者と臣民の立場が入れ替わる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p017",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n158/mode/1up",
          "source_sequence": 209,
          "printed_page": "143"
        }
      ],
      "source_text": "XVII. In the same manner also it may be conceived how, in any political society, the same man may, with respect to the same individuals, be, at different periods, and on different occasions, alternately, in the state of governor and subject: to-day concurring, perhaps active, in the business of issuing a general command for the observance of the whole society, amongst the rest of another man in quality of Judge: to-morrow, punished, perhaps, by a particular command of that same Judge for not obeying the general command which he himself (I mean the person acting in character of governor) had issued. I need scarce remind the reader how happily this alternate state of authority and submission is exemplified among ourselves.",
      "translation_ja": "第十七節　同じように、どんな政治社会でも、同一人物が同じ相手に対して、時と場合に応じて、代わる代わる統治者と臣民の立場に立ちうる。今日は、社会全体、したがって裁判官である別の人にも守らせる一般的な命令を出すことに賛同し、おそらく積極的に関わる。明日は、その同じ裁判官の個別の命令により、ほかならぬ自分が、つまり統治者としての自分が出した一般的な命令に従わなかったために、罰せられるかもしれない。権威を持つ側と服従する側がこうして入れ替わる様子が、私たちの国にどれほどよく表れているかは、わざわざ読者に思い出してもらうまでもない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin18",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n158/mode/1up",
          "source_sequence": 210,
          "printed_page": "143"
        }
      ],
      "source_text": "Hints of several topics that must be passed by.",
      "translation_ja": "ここでは立ち入れないいくつかの論点",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p018",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n158/mode/1up",
          "source_sequence": 211,
          "printed_page": "143",
          "printed_page_end": "144"
        }
      ],
      "source_text": "XVIII. Here might be a place to state the different shares which different persons may have in the issuing of the same command: to explain the nature of corporate action: to enumerate and distinguish half a dozen or more different modes in which subordination between the same parties may subsist: to distinguish and explain the different senses of the words, “consent,” “representation” and others of connected import: consent and representation, those interesting but perplexing words, sources of so much debate: and sources or pretexts of so much animosity. But the limits of the present design will by no means admit of such protracted and intricate discussions.",
      "translation_ja": "第十八節　ここでなら、一つの命令を出すのに、人によって分担がどう違いうるかを述べられるかもしれない。団体としての行為の性質を説明し、同じ当事者間でも上下関係が成り立つ六つかそれ以上の形を数え、区別できるかもしれない。「同意」「代表」その他の関連する言葉の意味を区別し、説明することもできるかもしれない。同意と代表。この興味深いが厄介な言葉は、どれほど多くの論争のもととなり、どれほど多くの反目のもと、あるいは口実となってきたことか。とはいえ、今の企ての範囲では、これほど長く込み入った議論はとうていできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin19",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 212,
          "printed_page": "144"
        }
      ],
      "source_text": "The same society alternately in a state of nature and a state of government.",
      "translation_ja": "同じ社会でも、自然状態と政府のある状態とが入れ替わる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p019",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 213,
          "printed_page": "144"
        }
      ],
      "source_text": "XIX. In the same manner, also, it may be conceived, how the same set of men considered among themselves, may at one time be in a state of nature, at another time in a state of government. For the habit of obedience, in whatever degree of perfection it be necessary it should subsist in order to constitute a government, may be conceived, it is plain, to suffer interruptions. At different junctures it may take place and cease.",
      "translation_ja": "第十九節　同じように、ある集団の内部の関係だけを考えて、その集団がある時には自然状態にあり、別の時には政府のある状態にあることも考えられる。政府が成立するのに服従の習慣がどこまで完全でなければならないにせよ、その習慣自体が途切れることは明らかにありうるからだ。時に応じて、習慣が生まれることも、やむこともある。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin20",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 214,
          "printed_page": "144"
        }
      ],
      "source_text": "Instance the Aborigines of America.",
      "translation_ja": "アメリカ先住民の例",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p020",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 215,
          "printed_page": "144"
        }
      ],
      "source_text": "XX. Instances of this state of things appear not to be unfrequent. The sort of society that has been observed to subsist among the American Indians may afford us one. According to the accounts we have of those people, in most of their tribes, if not in all, the habit we are speaking of appears to be taken up only in time of war. It ceases again in time of peace. The necessity of acting in concert against a common enemy, subjects a whole tribe to the orders of a common Chief. On the return of peace each warrior resumes his pristine independence.",
      "translation_ja": "第二十節　こうした例は、珍しくはないようである。アメリカ先住民に見られると報告されてきた社会が、その一例かもしれない。彼らについて私たちが得ている報告によると、すべてとは言わずとも大半の部族で、ここで述べている習慣は戦時にだけ始まるようである。平時になるとまた消える。共通の敵に対して協力して行動する必要から、部族全体が一人の長の命令に従う。平和が戻ると、戦士は一人ひとり、もとの独立した立場に戻る。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin21",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 216,
          "printed_page": "144"
        }
      ],
      "source_text": "Characteristic of political union.",
      "translation_ja": "政治的結合の目印",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p021",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n159/mode/1up",
          "source_sequence": 217,
          "printed_page": "144",
          "printed_page_end": "145"
        }
      ],
      "source_text": "XXI. One difficulty there is that still sticks by us. It has been started indeed, but not solved. — This is to find a note of distinction, — a characteristic mark, whereby to distinguish a society in which there is a habit of obedience, and that at the degree of perfection which is necessary to constitute a state of government, from a society in which there is not: a mark, I mean, which shall have a visible determinate commencement; insomuch that the instant of its first appearance shall be distinguishable from the last at which it had not as yet appeared. ’Tis only by the help of such a mark that we can be in a condition to determine, at any given time, whether any given society is in a state of government, or in a state of nature. I can find no such mark, I must confess, any where, unless it be this; the establishment of names of office: the appearance of a certain man, or set of men, with a certain name, serving to mark them out as objects of obedience: such as King, Sachem, Cacique, Senator, Burgomaster, and the like. This, I think, may serve tolerably well to distinguish a set of men in a state of political union among themselves from the same set of men not yet in such a state.",
      "translation_ja": "第二十一節　なお一つ厄介な問題が残る。すでに提起はされたが、解かれてはいない。服従の習慣が、政府のある状態を成り立たせるのに必要な程度まで完全に備わった社会と、そうでない社会とを区別する目印を見つけることである。その目印は、目に見える明確な始まりを持ち、現れた最初の瞬間を、まだ現れていなかった最後の瞬間と区別できなければならない。このような目印の助けがあって初めて、ある時点で、ある社会に政府があるのか、自然状態にあるのかを判断できる。正直なところ、一つを除いてそんな目印はどこにも見つからない。それは役職名が定まることである。ある人や集団が一定の名で現れ、その名で、従うべき相手であることが分かる。王、サチェム、カシケ、元老院議員、都市の市長などである。この目印なら、ある集団の内部に政治的な結合ができた状態を、同じ集団にまだ結合がなかった状態と、かなりうまく区別できるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin22",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n160/mode/1up",
          "source_sequence": 218,
          "printed_page": "145"
        }
      ],
      "source_text": "Among persons already in a state of political union at what instant a new society can be said to be formed, by defection from a former.",
      "translation_ja": "すでに政治的に結合している人々が離脱すると、いつ新しい社会が成立したと言えるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p022",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n160/mode/1up",
          "source_sequence": 219,
          "printed_page": "145",
          "printed_page_end": "146"
        }
      ],
      "source_text": "XXII. But suppose an incontestable political society, and that a large one, formed; and from that a smaller body to break off: by this breach the smaller body ceases to be in a state of political union with respect to the larger: and has thereby placed itself, with respect to that larger body, in a state of nature — What means shall we find of ascertaining the precise juncture at which this change took place? What shall be taken for the characteristic mark in this case? The appointment, it may be said, of new governors with new names. But no such appointment, suppose, takes place. The subordinate governors, from whom alone the people at large were in use to receive their commands under the old government, are the same from whom they receive them under the new one. The habit of obedience which these subordinate governors were in with respect to that single person, we will say, who was the supreme governor of the whole, is broken off insensibly and by degrees. The old names by which these subordinate governors were characterized, while they were subordinate, are continued now they are supreme. In this case it seems rather difficult to answer.",
      "translation_ja": "第二十二節　しかし、まぎれもない政治社会、それも大きなものができ、その中からより小さな団体が離れたとしよう。その分裂によって、小さな団体は元の大きな団体との政治的な結合を解き、それとの間では自然状態に身を置くことになる。この変化が起きた時点をどう正確に突き止めようか。この場合は何が目印になるのか。新しい名を持つ新しい統治者の任命だ、と言う人もいよう。しかし、そのような任命がない場合を考えてみよう。旧政府のもとで一般の人々が命令を受け取る相手は、下位の統治者だけだった。新政府のもとでも命令を受け取る相手は、同じ統治者である。その下位の統治者たちが、かりに全体を治める最高の統治者を一人としたとき、その人に対して保っていた服従の習慣は、気づかないうちに徐々に失われる。下位にいたときに彼らを示した古い役職名は、彼らが最高位に立った今も続く。こうなると、答えるのはかなり難しいようだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin23",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n161/mode/1up",
          "source_sequence": 220,
          "printed_page": "146"
        }
      ],
      "source_text": "1st, in case of defection by whole bodies, instance the Dutch provinces.",
      "translation_ja": "第一に、団体ごと離脱したネーデルラント諸州の例",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p023",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n161/mode/1up",
          "source_sequence": 221,
          "printed_page": "146"
        }
      ],
      "source_text": "XXIII. If an example be required, we may take that of the DUTCH provinces with respect to SPAIN. These provinces were once branches of the Spanish monarchy. They have now, for a long time, been universally spoken of as independent states: independent as well of that of Spain as of every other. They are now in a state of nature with respect to Spain. They were once in a state of political union with respect to Spain: namely, in a state of subjection to a single governor, a King, who was King of Spain. At what precise juncture did the dissolution of this political union take place? At what precise time did these provinces cease to be subject to the King of Spain? This, I doubt, will be rather difficult to agree upon.",
      "translation_ja": "第二十三節　例が要るなら、ネーデルラント諸州とスペインとの関係を挙げよう。これらの州はかつてスペイン王国の一部だった。しかし、もう長い間、誰もがこれらの州を独立した国々と呼ぶ。スペインからも、ほかのどの国からも独立している。今や諸州は、スペインに対して自然状態にある。だがかつてはスペインと政治的に結合していた。すなわち、一人の統治者、スペイン国王に従属していた。ではこの政治的な結合は、正確にはいつ解けたのか。これらの州がスペイン国王に従属しなくなったのは、正確にはいつのことか。これについて意見が一致するのは、どうも難しそうだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note67",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n161/mode/1up",
          "source_sequence": 222,
          "printed_page": "146"
        }
      ],
      "source_text": "Upon recollection, I have some doubt whether this example would be found historically exact. If not, that of the defection of the Nabobs of Hindostan may answer the purpose. My first choice fell upon the former; supposing it to be rather better known.",
      "translation_ja": "思い返してみると、この例が歴史的に正確と認められるか、少し疑わしい。正確でないなら、ヒンドスタンのナワーブたちの離脱が例になるだろう。前者を先に選んだのは、いくらかよく知られていると思ったからである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin24",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n161/mode/1up",
          "source_sequence": 223,
          "printed_page": "146"
        }
      ],
      "source_text": "2dly, in case of defection by individuals — instances. Rome — Venice.",
      "translation_ja": "第二に、個人ごとの離脱。ローマとヴェネツィアの例",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p024",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n161/mode/1up",
          "source_sequence": 224,
          "printed_page": "146",
          "printed_page_end": "147"
        }
      ],
      "source_text": "XXIV. Suppose the defection to have begun, not by entire provinces, as in the instance just mentioned, but by a handful of fugitives, this augmented by the accession of other fugitives, and so, by degrees, to a body of men too strong to be reduced, the difficulty will be increased still farther. At what precise juncture was it that ancient Rome, or that modern Venice, became an independent state?",
      "translation_ja": "第二十四節　先の例のように州ぐるみでなく、一握りの逃亡者から離脱が始まったとしよう。ほかの逃亡者が加わって数を増し、しだいに屈服させられないほど強い集団にまでなったなら、問題はいっそう難しくなる。古代のローマや近世のヴェネツィアが独立した国になったのは、正確にはいつだったのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin25",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n162/mode/1up",
          "source_sequence": 225,
          "printed_page": "147"
        }
      ],
      "source_text": "A revolt, at what juncture it can be said to have taken place.",
      "translation_ja": "いつ反乱が起きたと言えるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p025",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n162/mode/1up",
          "source_sequence": 226,
          "printed_page": "147"
        }
      ],
      "source_text": "XXV. In general then, at what precise juncture is it, that persons subject to a government, become, by disobedience, with respect to that government, in a state of nature? When is it, in short, that a revolt shall be deemed to have taken place; and when, again, is it, that that revolt shall be deemed to such a degree successful, as to have settled into independence?",
      "translation_ja": "第二十五節　そこで一般に、ある政府に従属している人々が、従わないことでその政府との間で自然状態に入るのは、正確にはいつなのか。要するに、いつ反乱が起きたと見なすのか。そして、いつ反乱が独立をもたらすほどの成功を収めたと見なすのか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin26",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n162/mode/1up",
          "source_sequence": 227,
          "printed_page": "147"
        }
      ],
      "source_text": "Disobediences what do not amount to a revolt.",
      "translation_ja": "どんな不服従は反乱に当たらないか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p026",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n162/mode/1up",
          "source_sequence": 228,
          "printed_page": "147"
        }
      ],
      "source_text": "XXVI. As it is the obedience of individuals that constitutes a state of submission, so is it their disobedience that must constitute a state of revolt. Is it then every act of disobedience that will do as much? The affirmative, certainly, is what can never be maintained: for then would there be no such thing as government to be found any where. Here then a distinction or two obviously presents itself. Disobedience may be distinguished into conscious or unconscious: and that, with respect as well to the law as to the fact.",
      "translation_ja": "第二十六節　一人ひとりの服従が服従状態をなすのだから、一人ひとりの不服従が反乱状態をなすはずである。ではどんな不服従の行為でも、それだけのことが起きるのか。そうだとはとうてい言えない。それなら、政府というものはどこにも見つからないからだ。そこで当然、一つ二つと区別が浮かぶ。不服従には、自覚しているものと自覚していないものとがある。この区別は、法についても事実についても当てはまる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note68",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n162/mode/1up",
          "source_sequence": 229,
          "printed_page": "147"
        }
      ],
      "source_text": "1. Disobedience unconscious with respect to the fact. Disobedience may be said to be unconscious with respect to the fact, when the party is ignorant either of his having done the act itself, which is forbidden by the law, or else of his having done it in those circumstances, in which alone it is forbidden.\n2. Disobedience unconscious with respect to the Law. Disobedience may be said to be unconscious, with respect to the law; when although he may know of his having done the act that is in reality forbidden, and that, under the circumstances in which it is forbidden, he knows not of its being forbidden in these circumstances.\n3. Illustration. So long as the business of spreading abroad the knowledge of the law continues to lie in the neglect in which it has lain hitherto, instances of disobedience unconscious with respect to the law, can never be otherwise than abundant.",
      "translation_ja": "1．事実を自覚しない不服従。当事者が、法で禁じられた行為をしたこと自体を知らないか、あるいは、その行為が禁じられる特定の事情のもとで行ったことを知らないとき、事実を自覚していない不服従と言ってよい。\n2．法を自覚しない不服従。実際には禁じられている行為を、まさに禁止が当てはまる事情のもとでしたと知っていても、その事情のもとでは行為が禁じられていると知らないとき、法を自覚していない不服従と言ってよい。\n3．例。法律の知識を広める仕事がこれまでと同じようにおろそかにされるかぎり、法を自覚しない不服従の例はいくらでもあり続ける。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p026-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n163/mode/1up",
          "source_sequence": 230,
          "printed_page": "148"
        }
      ],
      "source_text": "Disobedience that is unconscious with respect to either, will readily, I suppose, be acknowledged not to be a revolt. Disobedience again that is conscious with respect to both, may be distinguished into secret and open; or, in other words, into fraudulent and forcible. Disobedience that is only fraudulent, will likewise, I suppose, be readily acknowledged not to amount to a revolt.",
      "translation_ja": "どちらか一方について自覚のない不服従は反乱ではないと、容易に認められるだろう。では両方について自覚のある不服従は、ひそかに行われるものと公然と行われるもの、言い換えれば人を欺くものと力に訴えるものとに分けられる。人を欺くにとどまる不服従も、同じように、反乱には当たらないと容易に認められるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note69",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n163/mode/1up",
          "source_sequence": 231,
          "printed_page": "148"
        }
      ],
      "source_text": "Disobediences fraudulent and forcible — the difference, illustrated. If examples be thought necessary, Theft may serve for an example of fraudulent disobedience; Robbery of forcible. In Theft, the person of the disobedient party, and the act of disobedience, are both endeavoured to be kept secret. In Robbery, the act of disobedience, at least, if not the person of him who disobeys, is manifest and avowed.",
      "translation_ja": "人を欺く不服従と力に訴える不服従の違いの例。例が必要なら、人を欺く不服従には窃盗が、力に訴える不服従には強盗がある。窃盗では、従わない当人も不服従の行為も、どちらも隠そうとする。強盗では、従わない当人の身元はともかく、不服従の行為ははっきりと、公然となされる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin27",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n163/mode/1up",
          "source_sequence": 232,
          "printed_page": "148"
        }
      ],
      "source_text": "Disobediences what do amount to a revolt.",
      "translation_ja": "どんな不服従が反乱に当たるか",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p027",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n163/mode/1up",
          "source_sequence": 233,
          "printed_page": "148"
        }
      ],
      "source_text": "XXVII. The difficulty that will remain will concern such disobedience only as is both conscious, (and that as well with respect to law as fact) and forcible. This disobedience, it should seem, is to be determined neither by numbers altogether (that is of the persons supposed to be disobedient) nor by acts, nor by intentions: all three may be fit to be taken into consideration. But having brought the difficulty to this point, at this point I must be content to leave it. To proceed any farther in the endeavour to solve it, would be to enter into a discussion of particular local jurisprudence. It would be entering upon the definition of Treason, as distinguished from Murder, Robbery, Riot, and other such crimes, as, in comparison with Treason, are spoken of as being of a more private nature. Suppose the definition of Treason settled, and the commission of an act of Treason is, as far as regards the person committing it, the characteristic mark we are in search of.",
      "translation_ja": "第二十七節　こうして難問として残るのは、法と事実の両方を自覚したうえで、力に訴える不服従だけである。この不服従を判定するには、数、つまり従っていないとされる人々の人数だけでも、行為だけでも、意図だけでも足りないようである。三つとも考慮するのがふさわしいだろう。しかし、問題はここまで絞ったところで置いておかねばならない。解決しようとこれ以上進むなら、特定の土地の法を論じることになる。反逆罪を、殺人、強盗、騒擾など、反逆罪と比べてより私的な性質のものとされる犯罪から区別して定義することになる。反逆罪の定義が決まったとすれば、それを行うことが、少なくとも当人については、探していた目印となる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin28",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 234,
          "printed_page": "149"
        }
      ],
      "source_text": "Unfinished state of the above hints.",
      "translation_ja": "ここまでの示唆はまだ十分ではない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p028",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 235,
          "printed_page": "149"
        }
      ],
      "source_text": "XXVIII. These remarks it were easy to extend to a much greater length. Indeed, it is what would be necessary, in order to give them a proper fulness, and method, and precision. But that could not be done without exceeding the limits of the present design. As they are, they may serve as hints to such as shall be disposed to give the subject a more exact and regular examination.",
      "translation_ja": "第二十八節　以上の所見は、もっと長く展開することも容易である。十分に、しかも順序立てて正確に述べるには、本当はそうする必要がある。しかしそうすると、今の企ての範囲を越える。このままでも、主題をもっと厳密に、体系的に検討しようという人には、手がかりになるかもしれない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin29",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 236,
          "printed_page": "149"
        }
      ],
      "source_text": "Our Author’s proposition, “That government results of course,” not true.",
      "translation_ja": "政府はおのずと生じるという著者の主張は正しくない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p029",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 237,
          "printed_page": "149"
        }
      ],
      "source_text": "XXIX. From what has been said, however, we may judge what truth there is in our Author’s observation, that “when society” (understand natural society) “is once formed, government” (that is political society) (whatever quantity or degree of Obedience is necessary to constitute political society) “results of course; as necessary to preserve and to keep that society in order.” By the words, “of course” is meant, I suppose, constantly and immediately, at least constantly. According to this, political society, in any sense of it, ought long ago to have been established all the world over. Whether this be the case, let any one judge from the instances of the Hottentots, of the Patagonians, and of so many other barbarous tribes, of which we hear from travellers and navigators.",
      "translation_ja": "第二十九節　しかし、以上から、著者の所見がどれだけ正しいかは判断できる。「いったん社会が」、つまり自然社会が、「できれば、政府は」、つまり政治社会を成り立たせるのに必要な服従の量や程度がどれほどであれ、その政治社会は、「社会を保ち、その秩序を守るために必要なものとして、おのずと生じる」。この「おのずと」とは、必ず、しかもすぐに、少なくとも必ず、という意味だろう。それなら、どんな意味の政治社会にせよ、世界中いたるところでとっくに成立しているはずだ。そうなのかどうか、旅人や航海者から聞く、ホッテントット〔コイコイ人〕、パタゴニアの人々、ほかにも数多くの、「野蛮な」とされる部族の例から、各自が判断してほしい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin30",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 238,
          "printed_page": "149"
        }
      ],
      "source_text": "Ambiguity of the sentence.",
      "translation_ja": "文のあいまいさ",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p030",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n164/mode/1up",
          "source_sequence": 239,
          "printed_page": "149",
          "printed_page_end": "150"
        }
      ],
      "source_text": "XXX. It may be, after all, we have misunderstood his meaning. We have been supposing him to have been meaning to assert a matter of fact, and to have written, or at least begun, this sentence in the character of an historical observer: whereas, all he meant by it, perhaps, was to speak in the character of a Censor, and on a case supposed, to express a sentiment of approbation. In short, what he meant, perhaps, to persuade us of, was not that “government” does actually “result” from natural “society;” but that it were better that it should, to wit, as being necessary to “preserve and keep” men “in that state of order,” in which it is of advantage to them that they should be. Which of the above-mentioned characters he meant to speak in, is a problem I must leave to be determined. The distinction, perhaps, is what never so much as occurred to him; and indeed the shifting insensibly, and without warning, from one of those characters to the other, is a failing that seems inveterate in our Author; and of which we shall probably have more instances than one to notice.",
      "translation_ja": "第三十節　もっとも、結局はこちらが意味を取り違えたのかもしれない。著者は事実を述べるつもりで、歴史を観察する者としてこの文を書き、少なくとも書き始めた、と私たちは考えてきた。しかし、当人はただ批評者の立場で、ある場合を仮定して、それが望ましいとの見解を述べるつもりだったのかもしれない。要するに、自然「社会」から現に「政府」が「生じる」と納得させたかったのではなく、そうなった方がよい、つまり、人々にとって有益な「秩序のある状態」に、人々を「保っておく」のに必要だからだと言いたかったのかもしれない。前に挙げたどちらの立場から語るつもりだったのかは、判断をほかに委ねるしかない。そもそもこの区別など思いつきもしなかったのかもしれない。現に何の断りもなく、気づかないうちに一方の立場から他方に移るのは、この著者にこびりついた癖のようで、おそらく今後も何度か目にすることになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin31",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n165/mode/1up",
          "source_sequence": 240,
          "printed_page": "150"
        }
      ],
      "source_text": "Darkness of the whole paragraph further shewn.",
      "translation_ja": "段落全体の不明瞭さをさらに示す",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p031",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n165/mode/1up",
          "source_sequence": 241,
          "printed_page": "150",
          "printed_page_end": "151"
        }
      ],
      "source_text": "XXXI. To consider the whole paragraph (with its appendage) together, something, it may be seen, our Author struggles to overthrow, and something to establish. But how it is he would overthrow, or what it is he would establish, are questions I must confess myself unable to resolve. “The preservation of mankind,” he observes, “was effected by single families.” This is what upon the authority of the Holy Scriptures, he assumes; and from this it is that he would have us conclude the notion of an original contract (the same notion which he afterwards adopts) to be ridiculous. The force of this conclusion, I must own, I do not see. Mankind was preserved by single families — Be it so. What is there in this to hinder “individuals” of those families, or of families descended from those families, from meeting together “afterwards, in a large plain,” or any where else, “entering into an original contract,” or any other contract, “and choosing the tallest man,” or any other man, “present,” or absent, to be their Governor? The “flat contradiction” our Author finds between this supposed transaction and the “preservation of mankind by single families,” is what I must own myself unable to discover. As to the “actually existing unconnected state of nature” he speaks of, “the notion of which,” he says, “is too wild to be seriously admitted,” whether this be the case with it, is what, as he has given us no notion of it at all, I cannot judge of.",
      "translation_ja": "第三十一節　この段落を、付け足しの部分とあわせて眺めると、著者が何かを覆そうとし、また何かを打ち立てようと苦心しているのは見て取れる。しかしどう覆そうとしているのか、また何を打ち立てようとしているのか、これには私も答えられないと認めざるをえない。「人類は」と著者は言う。「一家族ずつを通じて生き延びた」。聖書の権威に従ってこれを前提とし、そこから、原初契約という考え、しかも後では当人が受け入れる考えが、ばかげていると私たちに結論させようとする。正直なところ、この結論にどんな力があるのか、私には分からない。人類は一家族ずつを通じて生き延びた。それはいい。その家族や、その子孫の家族の「個人たち」が、「後になって、広い野原に」、あるいはどこか別の場所に集まり、「原初契約」を、あるいは何か別の契約を結び、「居合わせたうちで最も背の高い者」や、その場にいるなりいないなりする別の誰かを、統治者に選ぶことを、何が妨げるのか。この架空の出来事と「一家族ずつを通じて人類が生き延びた」ことの間に、著者が見いだす「明白な矛盾」は、どうしても見つけられない。また、「人々が互いに結びつかない自然状態が現実にあったという考え」は「突飛すぎて真面目には取り合えない」と著者は言うが、そんな状態がどういうものか少しも教えてくれないので、本当にそうか、私には判断できない。",
      "translation_status": "reviewed"
    },
    {

    {
      "id": "bentham-preface-p047",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n131/mode/1up",
          "source_sequence": 91,
          "printed_page": "116"
        }
      ],
      "source_text": "He it is, in short, who, first of all institutional writers, has taught Jurisprudence to speak the language of the Scholar and the Gentleman: put a polish upon that rugged science: cleansed her from the dust and cobwebs of the office: and if he has not enriched her with that precision that is drawn only from the sterling treasury of the sciences, has decked her out, however, to advantage, from the toilette of classic erudition: enlivened her with metaphors and allusions; and sent her abroad in some measure to instruct, and in still greater measure to entertain, the most miscellaneous and even the most fastidious societies.",
      "translation_ja": "ひと言で言えば、制度を論じる著者の誰よりも先に、法学に学者と紳士の言葉で話すことを教えたのは、彼である。ごつごつしたこの学問に磨きをかけ、役所の埃と蜘蛛の巣を払い落とした。諸学問の本物の蔵からしか得られない正確さで、法学を豊かにはできなかったにしても、古典の教養という化粧台の道具を借りて、見栄えよく装わせた。比喩や引喩で生気を添え、世のさまざまな集まりへ送り出し、いくらか教え、ましてや人を楽しませるようにした。少しのことでは満足しない人々の間でさえ、そうだった。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p048",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n131/mode/1up",
          "source_sequence": 92,
          "printed_page": "116"
        }
      ],
      "source_text": "The merit to which, as much perhaps as to any, the work stands indebted for its reputation, is the enchanting harmony of its numbers: a kind of merit that of itself is sufficient to give a certain degree of celebrity to a work devoid of every other. So much is man governed by the ear.",
      "translation_ja": "この著作が評判を得るうえで、おそらくほかのどの長所にも劣らず力を貸したのは、うっとりするほど調和のとれた文章の調べである。ほかに何一つ取り柄がない著作でも、この長所だけで、ある程度は名の知れたものになる。人はそれほどまでに、耳に支配されるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p049",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n131/mode/1up",
          "source_sequence": 93,
          "printed_page": "116"
        }
      ],
      "source_text": "The function of the Expositor may be conceived to divide itself into two branches: that of history, and that of simple demonstration. The business of history is to represent the Law in the state it has been in, in past periods of its existence: the business of simple demonstration in the sense in which I will take leave to use the word, is to represent the Law in the state it is in for the time being.",
      "translation_ja": "解説者の役割は、歴史と単なる提示という、二つの部門に分けて考えられるだろう。歴史は、法がこれまでの各時期に、どのような状態にあったかを描く仕事である。単なる提示は、私がこの言葉を使う意味では、当の時点で法がどのような状態にあるかを描く仕事である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note33",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n131/mode/1up",
          "source_sequence": 94,
          "printed_page": "116",
          "printed_page_end": "117"
        }
      ],
      "source_text": "The word demonstration may here seem, at first sight, to be out of place. It will be easily perceived that the sense here put upon it is not the same with that in which it is employed by Logicians and Mathematicians. In our own language, indeed, it is not very familiar in any other sense than theirs: but on the Continent it is currently employed in many other sciences. The French, for example, have their demonstrateurs de botanique, d’anatomie, de physique expérimentale, &c. I use it out of necessity; not knowing of any other that will suit the purpose.",
      "translation_ja": "demonstration という言葉は、一見するとここにはふさわしくないかもしれない。私がここで使う意味は、論理学者や数学者が「証明」という意味で使う場合と、同じではないとすぐ分かるはずだ。私たちの言葉では、確かに彼らとは別の意味で使うことはあまりない。だが大陸では、ほかのさまざまな学問でも広く使われている。たとえばフランスには、植物学、解剖学、実験物理学などに demonstrateur、つまり実物を示して教える人がいる。私はほかに目的に合う言葉を知らず、やむをえずこの語を使う。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p050",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n132/mode/1up",
          "source_sequence": 95,
          "printed_page": "117"
        }
      ],
      "source_text": "Again, to the head of demonstration belong the several businesses of arrangement, narration and conjecture. Matter of narration it may be called, where the Law is supposed to be explicit, clear, and settled: matter of conjecture or interpretation, where it is obscure, silent, or unsteady. It is matter of arrangement to distribute the several real or supposed institutions into different masses, for the purpose of a general survey; to determine the order in which those masses shall be brought to view; and to find for each of them a name.",
      "translation_ja": "また、提示の中には、分類、叙述、推定という、それぞれの仕事がある。法に明示されていて、明瞭かつ確定していると考えられるものは、叙述の対象と呼んでよい。法が曖昧で、何も述べず、あるいは定まっていないものは、推定または解釈の対象である。そして分類の仕事は、全体を見渡せるよう、実在する制度や実在するとされる制度をいくつかのまとまりに分け、それらをどんな順で見せるかを決め、各々のまとまりにふさわしい名を考えることにある。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p051",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n132/mode/1up",
          "source_sequence": 96,
          "printed_page": "117"
        }
      ],
      "source_text": "The business of narration and interpretation are conversant chiefly about particular institutions. Into the details of particular institutions it has not been my purpose to descend. On these topics, then, I may say, in the language of procedure; non sum informatus. Viewing the work in this light, I have nothing to add to or to except against the public voice.",
      "translation_ja": "叙述と解釈の仕事は、主として個々の制度にかかわる。その細部にまで立ち入るつもりは、私にはなかった。ゆえにこの問題については、訴訟手続の言葉で、ノン・スム・インフォルマートゥス、よく承知していない、と言ってよい。この面から著作を見た場合、世間の評判につけ加えることもなければ、それに異を唱えることもない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p052",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n132/mode/1up",
          "source_sequence": 97,
          "printed_page": "117"
        }
      ],
      "source_text": "History is a branch of instruction which our Author, though not rigidly necessary to his design, called in, not without judgment, to cast light and ornament on the dull work of simple demonstration: this part he has executed with an elegance which strikes every one: with what fidelity, having not very particularly examined, I will not take upon me to pronounce.",
      "translation_ja": "歴史は、著者の企てに欠かせなかったわけではない。だが、単なる提示という退屈な仕事に光と彩りを添えるため、著者はそれを一つの教え方として、分別をもって取り入れた。そして、誰にでも印象を残す優雅さで、この部分を成し遂げている。史実にどれほど忠実かは、細かく調べていないので、ここでわざわざ言い渡すつもりはない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p053",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n132/mode/1up",
          "source_sequence": 98,
          "printed_page": "117",
          "printed_page_end": "118"
        }
      ],
      "source_text": "Among the most difficult and the most important of the functions of the demonstrator is the business of arrangement. In this our Author has been thought, and not, I conceive, without justice, to excel; at least in comparison of any thing in that way that has hitherto appeared. ’Tis to him we owe such an arrangement of the elements of Jurisprudence, as wants little, perhaps, of being the best that a technical nomenclature will admit of. A technical nomenclature, so long as it is admitted to mark out and denominate the principal heads, stands an invincible obstacle to every other than a technical arrangement. For to denominate in general terms, what is it but to arrange? and to arrange under heads, what is it but to denominate upon a large scale? A technical arrangement, governed then in this manner, by a technical nomenclature, can never be otherwise than confused and unsatisfactory. The reason will be sufficiently apparent, when we understand what sort of an arrangement that must be which can be properly termed a natural one.",
      "translation_ja": "法を提示する人の仕事のうち、最も難しく、また最も重要なものの一つは、分類である。著者がこの仕事に秀でていたと考えられてきたのは、少なくともこれまでにこの種の仕事として世に出たものと比べるなら、もっともなことだと思う。専門用語の体系に従うかぎり、これ以上ほとんど望めないほどよく、法学の諸要素を分類してくれたのは、著者のおかげである。だが主な項目の範囲と名称を定めるのが専門用語の体系であるかぎり、専門的な分類以外の道を、それがどうしてもふさぐことになる。物事に一般的な言葉で名をつけるのは、物事を分類することにほかならず、項目に分けて分類するのは、大きな規模で名をつけることにほかならないからだ。このように専門用語の体系に支配された分類は、混乱し、納得のいかないものにしかならない。何が真に自然な分類と呼べるのかを理解すれば、その理由も十分明らかになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin09",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n133/mode/1up",
          "source_sequence": 99,
          "printed_page": "118"
        }
      ],
      "source_text": "Idea of a natural arrangement.",
      "translation_ja": "自然な分類とは何か",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p054",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n133/mode/1up",
          "source_sequence": 100,
          "printed_page": "118"
        }
      ],
      "source_text": "That arrangement of the materials of any science may, I take it, be termed a natural one, which takes such properties to characterize them by, as men in general are, by the common constitution of man’s nature, disposed to attend to: such, in other words, as naturally, that is readily, engage, and firmly fix the attention of any one to whom they are pointed out. The materials or elements here in question, are such actions as are the objects of what we call Laws or Institutions.",
      "translation_ja": "どの学問の材料を分類する場合でも、人がもともと共有している本性のために、一般に注意を向けやすい性質を選び、その性質によって各々の材料を特徴づけるなら、それは自然な分類と呼んでよいと思う。言い換えれば、誰でも、指摘されれば自然に、つまりたやすく注意を引かれ、しっかりと注意を向け続ける性質である。いま問題となる材料、すなわち要素とは、私たちが法律や制度と呼ぶものの対象となる行為である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p055",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n133/mode/1up",
          "source_sequence": 101,
          "printed_page": "118",
          "printed_page_end": "119"
        }
      ],
      "source_text": "Now then, with respect to actions in general, there is no property in them that is calculated so readily to engage, and so firmly to fix the attention of an observer, as the tendency they may have to, or divergency (if one may so say) from, that which may be styled the common end of all of them. The end I mean is Happiness: and this tendency in any act is what we style its utility: as this divergency is that to which we give the name of mischievousness. With respect then to such actions in particular as are among the objects of the Law, to point out to a man the utility of them or the mischievousness, is the only way to make him see clearly that property of them which every man is in search of; the only way, in short, to give him satisfaction.",
      "translation_ja": "行為一般について言えば、どの行為にも共通すると言ってよい目的に向かう傾向、あるいはその目的からのずれとでも言うべきものほど、観察する人の注意をたやすく引きつけ、しっかりとつなぎとめる性質はない。私の言う目的とは、幸福である。この目的へ向かう、ある行為の傾向を、私たちはその行為の有用性と呼び、この目的からずれる傾向を、有害性と呼ぶ。それなら、特に法の対象となる行為について、誰もが知りたがっている性質を、その人に明瞭に見せる唯一の方法は、行為の有用性または有害性を示すことである。要するに、そうするほかに、納得してもらう道はないのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note34",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "grc"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n133/mode/1up",
          "source_sequence": 102,
          "printed_page": "118"
        }
      ],
      "source_text": "Let this be taken for a truth upon the authority of Aristotle: I mean by those, who like the authority of Aristotle better than that of their own experience. Πᾶσα τέχνη, says that philosopher, καὶ πᾶσα μέθοδος· ὁμοίως δὲ πρᾶξίς τε καὶ προαίρεσις, ἀγαθοῦ τινος ἐφίεσθαι δοκεῖ· διὸ καλῶς ἀπεφήναντο τἀγαθὸν, οὗ πάντα ἐφίεται. Διαφορὰ δέ τις φαίνεται τῶν (understand τοιούτων) ΤΕΛΩΝ.—Arist. Eth. ad Nic. L. I. c. 1.",
      "translation_ja": "このことを真理と思うには、アリストテレスを引き合いに出せばよかろう。自分の経験よりアリストテレスの権威を好む人については、という意味である。この哲学者は言う。「あらゆる技術と探究は、同じくあらゆる行為と選択も、何かしらの善を求めているように見える。だから、すべてのものが求めるものを善としたのは、正しい。もっとも、〔そうした〕目的のあいだには、いくらか違いがあるように見える」。アリストテレス『ニコマコス倫理学』第1巻第1章。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p056",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 103,
          "printed_page": "119"
        }
      ],
      "source_text": "From utility then we may denominate a principle, that may serve to preside over and govern, as it were, such arrangement as shall be made of the several institutions or combinations of institutions that compose the matter of this science: and it is this principle, that by putting its stamp upon the several names given to those combinations, can alone render satisfactory and clear any arrangement that can be made of them.",
      "translation_ja": "そこで、有用性から名を取って一つの原理を立てることができる。この学問の材料をなすいくつもの制度や制度の組み合わせをどう分類する場合にも、いわば、その分類を取り仕切り、導く原理である。こうした組み合わせ一つひとつに与える名前にも、この原理の印が押されてこそ、仕上がった分類は明瞭で納得のいくものになる。ほかの原理にこれをすることはできない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p057",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 104,
          "printed_page": "119"
        }
      ],
      "source_text": "Governed in this manner by a principle that is recognized by all men, the same arrangement that would serve for the jurisprudence of any one country, would serve with little variation for that of any other.",
      "translation_ja": "誰もが認める原理でこのように導かれるなら、ある国の法学に役立つ同じ分類は、ほかのどんな国の法学にも、ほとんど変えることなく役に立つだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p058",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 105,
          "printed_page": "119"
        }
      ],
      "source_text": "Yet more. The mischievousness of a bad Law would be detected, at least the utility of it would be rendered suspicious, by the difficulty of finding a place for it in such an arrangement: while, on the other hand, a technical arrangement is a sink that with equal facility will swallow any garbage that is thrown into it.",
      "translation_ja": "それだけではない。悪い法律には、そのような分類の中に置き場を見つけるのが難しいことから、その害が見破られ、少なくとも役に立つかどうかは疑われるだろう。他方、専門用語による分類は、何を放り込もうと、どんなごみも同じようにたやすくのみ込む、流しのようなものである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p059",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 106,
          "printed_page": "119"
        }
      ],
      "source_text": "That this advantage may be possessed by a natural arrangement, is not difficult to conceive. Institutions would be characterized by it in the only universal way in which they can be characterized; by the nature of the several modes of conduct which, by prohibiting, they constitute offences.",
      "translation_ja": "自然な分類にこの利点があることは、容易に理解できる。そこでは制度が、どの制度にも通用する唯一のやり方で特徴づけられる。すなわち制度が禁止し、それによって違反とする、さまざまな行いのあり方の性質によってである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note35",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 107,
          "printed_page": "119"
        }
      ],
      "source_text": "Offences, the Reader will remember, may as well be offences of omission as of commission. I would avoid the embarrassment of making separate mention of such Laws as exert themselves in commanding. ’Tis on this account I use the phrase ‘mode of conduct’ which includes omissions or forbearances, as well as acts.",
      "translation_ja": "読者が覚えているとおり、違反は、何かをしたことによってと同じく、何かをしなかったことによっても起こる。何かをせよと命じることで働く法を、いちいち別に述べる煩雑さを避けたい。それで「行いのあり方」という言葉を使う。これは行為のほか、しないことや控えることも含む。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p060",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n134/mode/1up",
          "source_sequence": 108,
          "printed_page": "119",
          "printed_page_end": "120"
        }
      ],
      "source_text": "These offences would be collected into classes denominated by the various modes of their divergency from the common end; that is, as we have said, by their various forms and degrees of mischievousness: in a word, by those properties which are reasons for their being made offences: and whether any such mode of conduct possesses any such property is a question of experience. Now, a bad Law is that which prohibits a mode of conduct that is not mischievous. Thus would it be found impracticable to place the mode of conduct prohibited by a bad law under any denomination of offence, without asserting such a matter of fact as is contradicted by experience. Thus cultivated, in short, the soil of Jurisprudence would be found to repel in a manner every evil institution; like that country which refuses, we are told, to harbour any thing venomous in its bosom.",
      "translation_ja": "こうした違反は、共通の目的からどのような形でずれるかによって、名前をつけた種類にまとめられる。すでに言ったように、その害がどんな形をとり、どれほどのものかによってである。ひと言で言えば、違反とされた理由にあたる性質によってである。ある行いのあり方にそうした性質があるかは、経験に照らして決める問題だ。ところで、悪い法律とは、害のない行いのあり方を禁じるものだ。だから、悪い法で禁じられた行いのあり方を、何かの違反の名の下に置こうとすれば、経験によって否定されることを、事実だと主張せずにはできないことが分かる。要するに、このように耕された法学の土壌は、いわば、悪い制度をどれも寄せつけないのである。毒のある生き物を懐に宿すことを拒むと伝えられる、かの国のようなものだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note36",

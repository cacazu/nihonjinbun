        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n106/mode/1up",
          "source_sequence": 2
        }
      ],
      "source_text": "Being an Examination of what is delivered, On the Subject of Government in General, In the Introduction to Sir William Blackstone’s Commentaries: With a Preface, in which is given A Critique on the Work at large.",
      "translation_ja": "サー・ウィリアム・ブラックストンの『イングランド法釈義』の序論にある、統治一般についての議論を検討する。著作全体を批評する序文を付す。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-epigraph",
      "section_id": "bentham-work",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n106/mode/1up",
          "source_sequence": 3
        }
      ],
      "source_text": "Rien ne recule plus le progrès des connoissances, qu’un mauvais ouvrage d’un Auteur célèbre : parce qu’avant d’instruire, il faut commencer par détromper. Montesquieu, Esprit des Loix, L. XXX. Ch. XV.",
      "translation_ja": "名のある著者の悪い本ほど、知識の進歩を後戻りさせるものはない。教える前に、まず誤解を解かなければならないからだ。モンテスキュー『法の精神』第30編第15章。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-title",
      "section_id": "bentham-preface",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n108/mode/1up",
          "source_sequence": 4,
          "printed_page": "93"
        }
      ],
      "source_text": "PREFACE.",
      "translation_ja": "序文",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin01",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n108/mode/1up",
          "source_sequence": 5,
          "printed_page": "93"
        }
      ],
      "source_text": "Motives of the present undertaking.",
      "translation_ja": "本書を著す理由",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p001",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n108/mode/1up",
          "source_sequence": 6,
          "printed_page": "93"
        }
      ],
      "source_text": "The age we live in is a busy age; in which knowledge is rapidly advancing towards perfection. In the natural world, in particular, every thing teems with discovery and with improvement. The most distant and recondite regions of the earth traversed and explored—the all-vivifying and subtle element of the air so recently analyzed and made known to us,—are striking evidences, were all others wanting, of this pleasing truth.",
      "translation_ja": "私たちは活気のある時代に生きている。知識は完全なものへと急速に近づいている。とりわけ自然界については、いたるところに発見と進歩がある。地上で最も遠く、これまでほとんど知られていなかった地域に人が足を踏み入れ、探査した。また、あらゆるものに命を吹き込む精妙な空気の成分が、ごく最近分析され、私たちに知られるようになった。ほかに何の証拠がなくても、これらだけで、この喜ばしい事実をはっきり示している。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p002",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n108/mode/1up",
          "source_sequence": 7,
          "printed_page": "93"
        }
      ],
      "source_text": "Correspondent to discovery and improvement in the natural world, is reformation in the moral; if that which seems a common notion be, indeed, a true one, that in the moral world there no longer remains any matter for discovery. Perhaps, however, this may not be the case: perhaps among such observations as would be best calculated to serve as grounds for reformation, are some which, being observations of matters of fact hitherto either incompletely noticed, or not at all would, when produced, appear capable of bearing the name of discoveries: with so little method and precision have the consequences of this fundamental axiom, it is the greatest happiness of the greatest number that is the measure of right and wrong, been as yet developed.",
      "translation_ja": "自然界の発見と進歩に相当するのが、人間の行いや制度の世界での改革である。もっとも、その世界にはもはや何も発見すべきものがないという、世間一般の考えが本当に正しければ、の話だ。実際にはそうでないかもしれない。改革の最も確かな根拠となりそうな観察の中には、これまで十分には顧みられず、あるいはまったく気づかれなかった事実についてのものもあるだろう。それを示せば、発見と呼ぶにふさわしいかもしれない。「最大多数の最大幸福こそ、正しいことと誤ったことを分ける尺度である」。この根本の公理から何が導かれるかは、これまでほとんど体系的にも精密にも明らかにされてこなかったのだから。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p003",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n108/mode/1up",
          "source_sequence": 8,
          "printed_page": "93",
          "printed_page_end": "94"
        }
      ],
      "source_text": "Be this as it may, if there be room for making, and if there be use in publishing, discoveries in the natural world, surely there is not much less room for making, nor much less use in proposing, reformation in the moral. If it be a matter of importance and of use to us to be made acquainted with distant countries, surely it is not a matter of much less importance, nor of much less use to us, to be made better and better acquainted with the chief means of living happily in our own. If it be of importance and of use to us to know the principles of the element we breathe, surely it is not of much less importance nor of much less use to comprehend the principles, and endeavour at the improvement of those laws, by which alone we breathe it in security. If to this endeavour we should fancy any Author, especially any Author of great name, to be, and as far as could in such case be expected, to avow himself a determined and persevering enemy, what should we say of him? We should say that the interests of reformation, and through them the welfare of mankind, were inseparably connected with the downfall of his works: of a great part, at least, of the esteem and influence, which these works might under whatever title have acquired.",
      "translation_ja": "いずれにせよ、自然界に発見の余地があり、発見を公にする価値があるのなら、人間の世界にも改革の余地は決してそれほど少なくはなく、改革を提案する価値もそう劣りはしないはずだ。遠い国々を知ることが私たちにとって重要で役に立つなら、自分たちの国で幸せに暮らすための主な手立てを、もっと深く知ることも、同じくらい重要で役に立つはずだ。私たちが吸う空気の成り立ちを知ることが重要で役に立つなら、安心してその空気を吸っていられるのも法律のおかげなのだから、その法律の原理を理解し、改善に努めることも、決してそれほど重要でないわけでも、役に立たないわけでもあるまい。この努力に対して、ある著者、とりわけ名高い著者が、断固として執拗に敵対し、そう公言することまで、このような場合に考えられるかぎりではためらわないと思われたなら、私たちはその人について何と言うだろうか。改革の進展も、ひいては人類の幸福も、その人の著作の失墜と切り離せないと言うだろう。少なくとも、どんな理由であれ、その著作が得ていた名声と影響力の大半が失われることと、切り離せないということだ。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p004",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n109/mode/1up",
          "source_sequence": 9,
          "printed_page": "94"
        }
      ],
      "source_text": "Such an enemy it has been my misfortune (and not mine only) to see, or fancy at least I saw, in the Author of the celebrated Commentaries on the Laws of England; an Author whose works have had beyond comparison a more extensive circulation, have obtained a greater share of esteem, of applause, and consequently of influence (and that by a title on many grounds so indisputable) than any other writer who on that subject has ever yet appeared.",
      "translation_ja": "不幸にも私は（私だけではないが）、名高い『イングランド法釈義』の著者に、まさにそのような敵を見いだした。少なくとも、そう見えた。その著作は、この主題でこれまでに現れたどの著者のものよりも比べようがないほど広く読まれ、敬意と賞賛を集め、それゆえ大きな影響を及ぼしてきた。その評価が多くの点で正当に得られたものだということにも、疑いはない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin02",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n109/mode/1up",
          "source_sequence": 10,
          "printed_page": "94"
        }
      ],
      "source_text": "History of it.",
      "translation_ja": "本書ができるまで",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p005",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n109/mode/1up",
          "source_sequence": 11,
          "printed_page": "94",
          "printed_page_end": "95"
        }
      ],
      "source_text": "It is on this account that I conceived, some time since, the design of pointing out some of what appeared to me the capital blemishes of that work, particularly this grand and fundamental one, the antipathy to reformation; or rather, indeed, of laying open and exposing the universal inaccuracy and confusion which seemed to my apprehension to pervade the whole. For, indeed, such an ungenerous antipathy seemed of itself enough to promise a general vein of obscure and crooked reasoning, from whence no clear and sterling knowledge could be derived; so intimate is the connexion between some of the gifts of the understanding, and some of the affections of the heart.",
      "translation_ja": "このため私は、少し前に、この著作の重大な欠点と見えたものをいくつか、特にこの大きな根本の欠点、つまり改革への反感を指摘しようと思い立った。いやむしろ、私の目には全体に行き渡っているように見えた不正確さと混乱を、すっかりさらけ出そうと思ったのである。狭量な反感がそれだけで、至るところに不明瞭でひねくれた論法があり、そこから明快で確かな知識は得られないだろうと、予想するに足りた。理解力のある種の資質と、心のある種の性向とは、それほど深く結びついているのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p006",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n110/mode/1up",
          "source_sequence": 12,
          "printed_page": "95"
        }
      ],
      "source_text": "It is in this view then that I took in hand that part of the first volume to which the Author has given the name of Introduction. It is in this part of the work that is contained whatever comes under the denomination of general principles. It is in this part of the work that are contained such preliminary views as it seemed proper to him to give of certain objects real or imaginary, which he found connected with his subject Law by identity of name: two or three sorts of Laws of Nature, the revealed Law, and a certain Law of Nations. It is in this part of the work that he has touched upon several topics which relate to all laws or institutions in general, or at least to whole classes of institutions without relating to any one more than to another.",
      "translation_ja": "そこで、この考えのもとに、著者が「序論」と名づけた第一巻の部分を取り上げた。この部分には、一般原理と呼ばれるものがすべて含まれている。また、著者が実在するものにせよ想像上のものにせよ、自分の主題である「法」と同じ名を持つだけでそこにつながると考え、あらかじめ論じておくのがよいと判断したものが取り上げられる。二、三種類の自然法、啓示による法、それにある種の国際法である。この部分で著者はまた、法律や制度全般にかかわる話題、あるいは少なくとも、どれか一つの制度に特にかかわるのではなく、ある種類の制度全体にかかわる話題に触れている。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note01",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n110/mode/1up",
          "source_sequence": 13,
          "printed_page": "95"
        }
      ],
      "source_text": "I add here the word institutions, for the sake of including rules of Common Law, as well as portions of Statute Law.",
      "translation_ja": "ここに「制度」と付け加えるのは、制定法の諸規定ばかりでなく、コモン・ローの規則をも含めるためである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p007",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n110/mode/1up",
          "source_sequence": 14,
          "printed_page": "95"
        }
      ],
      "source_text": "To speak more particularly, it is in this part of his work that he has given a definition, such as it is, of that whole branch of law which he had taken for his subject; that branch, which some, considering it as a main stock, would term LAW without addition; and which he, to distinguish it from those others its condivident branches, terms law municipal:—an account, such as it is, of the nature and origin of Natural Society the mother, and of Political Society the daughter, of Law municipal, duly begotten in the bed of Metaphor:—a division, such as it is, of a law, individually considered, into what he fancies to be its parts:—an account, such as it is, of the method to be taken for interpreting any law that may occur.",
      "translation_ja": "もう少し具体的に言えば、著者が自分の主題に選んだ法の一部門全体に、曲がりなりにも定義を与えたのが、この部分である。それを法の大本と考えて、ただ「法」と呼ぶ人もいよう。著者はこれを、同じ区分に並ぶほかの部門と区別するため、「国内法」と呼ぶ。ここではさらに、自然社会と政治社会の性質と起源が、いちおう説明される。国内法の母にあたるのが自然社会、その娘にあたるのが政治社会という。比喩という寝床でめでたくもうけられた、という趣向である。また、個々の法律を、著者がその構成要素だと考えるものに分けてみせる。どんな法律に出会っても、それをどう解釈すればよいかという説明も、いちおうつけられる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note02",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

          "source_sequence": 145,
          "printed_page": "128",
          "printed_page_end": "129"
        }
      ],
      "source_text": "IV. This definition is ushered in with no small display of accuracy. First, it is given entire: it is then taken to pieces, clause by clause; and every clause by itself, justified and explained. In the very midst of these explanations, in the very midst of the definition, he makes a sudden stand. And now it bethinks him that it is a good time to give a dissertation, or rather a bundle of dissertations, upon various subjects—On the manner in which Governments were established—On the different forms they assume when they are established—On the peculiar excellence of that form which is established in this country—On the right, which he thinks it necessary to tell us, the Government in every country has of making Laws—On the duty of making Laws; which, he says, is also incumbent on the Government.—In stating these two last heads, I give, as near as possible, his own words; thinking it premature to engage in discussions, and not daring to decide without discussion on the sense.",
      "translation_ja": "第四節　この定義は、正確さを大いに見せつけながら登場する。まず全体を示す。次に、句ごとに分解し、一つひとつの句に理由と説明をつける。ところが説明のただ中、定義のまさに途中で、著者は突然立ち止まる。そしてちょうどよい機会だと思いついて、さまざまな主題について、一つの論考、いや、むしろ幾つもの論考を束ねて差し出すのである。政府がどう設けられたか。設けられた政府がどんな形をとるか。この国に置かれた政体だけが持つ長所は何か。どの国の政府にも法律を作る権利があると、どうしてわざわざ私たちに教えなければならないのかはともあれ、その権利について。そして、法律を作る義務について。それも政府が負うと言うのである。最後の二項については、できるだけ著者自身の言葉を使った。ここで議論を始めるのは早すぎるし、議論をせずに言葉の意味を決めてしまう勇気は、私にはないからだ。",
      "translation_status": "reviewed"
    },

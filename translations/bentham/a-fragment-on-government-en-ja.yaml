          "source_sequence": 260,
          "printed_page": "156"
        }
      ],
      "source_text": "A compact, or contract. A compact or contract (for the two words on this occasion, at least, are used in the same sense) may, I think, be defined, a pair of promises, by two persons reciprocally given, the one promise in consideration of the other.",
      "translation_ja": "約定、または契約。約定または契約は、少なくともここでは二つの言葉を同じ意味で用いるが、二人の人が、互いの約束を対価として取り交わす、一対の約束と定義できると思う。",
      "translation_status": "reviewed"
    },

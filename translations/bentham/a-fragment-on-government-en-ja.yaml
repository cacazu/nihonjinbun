          "source_sequence": 315,
          "printed_page": "169"
        }
      ],
      "source_text": "The paragraph recited.",
      "translation_ja": "その段落の引用",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p012",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n184/mode/1up",
          "source_sequence": 316,
          "printed_page": "169",
          "printed_page_end": "170"
        }
      ],
      "source_text": "XII. “How the several forms of government we now see in the world at first actually began,” says our Author, “is matter of great uncertainty, and has occasioned infinite disputes. It is not my business or intention to enter into any of them. However they began, or by what right soever they subsist, there is and must be in all of them a supreme, irresistible, absolute, uncontrolled authority, in which the jura summi imperii, or the rights of sovereignty, reside. And this authority is placed in those hands, wherein (according to the opinion of the founders of such respective states, either expressly given or collected from their tacit approbation) the qualities requisite for supremacy, wisdom, goodness, and power, are the most likely to be found.”",
      "translation_ja": "第十二節　「今世界に見られるさまざまな政体が、実際はどう始まったのかは」と著者は言う。「ひどく不確かで、果てのない論争を招いてきた。どの論争に立ち入るのも、私の仕事ではなく、そのつもりもない。どのように始まったにせよ、どのような権原によって存続するにせよ、どの政体にも最高の、抗しがたい、絶対的な、誰にも制約されない権威が存在し、存在しなければならない。そこに、最高統治権、つまり主権の諸権利がある。そしてこの権威は、それぞれの国の創設者の意見によれば、明言されていようと黙認から読み取られようと、最高の地位に必要な資質である知恵、善意、力を、最も備えていそうな者の手に置かれている」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin13",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n185/mode/1up",
          "source_sequence": 317,
          "printed_page": "170"
        }
      ],
      "source_text": "Paradoxical assertion in the latter part of it, as if all governments were the result of a free preference.",
      "translation_ja": "段落後半の奇妙な主張。まるでどの政府も自由な選択の結果であるかのようだ",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p013",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n185/mode/1up",
          "source_sequence": 318,
          "printed_page": "170"
        }
      ],
      "source_text": "XIII. Who those persons are whom our Author means here by the word founders; whether those who became the Governors of the states in question, or those who became the governed, or both together, is what I would not take upon me to determine. For aught I know he may have meant neither the one nor the other, but some third person. And, indeed, what I am vehemently inclined to suspect is, that, in our Author’s large conception, the mighty and extensive domains of Athens and Sparta, of which we read so much at school and at college, consisting each of several score of miles square, represented, at the time this paragraph was writing, the whole universe: and the respective æras of Solon and Lycurgus, the whole period of the history of those states.",
      "translation_ja": "第十三節　著者が「創設者」で指すのは誰か。当の国々の統治者になった人々か、統治されるようになった人々か、それとも両方か。私が決めてかかるつもりはない。ひょっとすると、どちらでもなく、何か第三者を指したのかもしれない。実のところ、私は大いに疑っている。著者がこの段落を書いたとき、その広大な構想のうちでは、私たちが学校や大学でさんざん読むアテネとスパルタの、どちらも数十マイル四方の、強大で広大な領土が全世界を表し、ソロンの時代とリュクルゴスの時代が、それぞれの国の歴史の全期間を表していたのではなかろうか。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin14",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n185/mode/1up",
          "source_sequence": 319,
          "printed_page": "170"
        }
      ],
      "source_text": "Reasons for supposing this to have been the meaning of it.",
      "translation_ja": "このような意味だと考える理由",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p014",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n185/mode/1up",
          "source_sequence": 320,
          "printed_page": "170",
          "printed_page_end": "171"
        }
      ],
      "source_text": "XIV. The words “founders,” — “opinion,” — “approbation,” — in short the whole complexion of the sentence is such as brings to one’s view a system of government utterly different from the generality of those we have before our eyes; a system in which one would think neither caprice, nor violence, nor accident, nor prejudice, nor passion, had any share: a system uniform, comprehensive, and simultaneous; planned with phlegmatic deliberation; established by full and general assent: such, in short, as, according to common imagination, were the systems laid down by the two sages above-mentioned. If this be the case, the object he had in mind when he said Founders, might be neither Governors nor governed, but some neutral person: such as those sages, chosen as they were in a manner as umpires, might be considered with regard to the persons who, under the prior constitution, whatever it was, had stood respectively in those two relations.",
      "translation_ja": "第十四節　「創設者」「意見」「是認」という言葉、要するに文全体の調子を見れば、目の前にある普通の政府とはまるで違う仕組みが浮かぶ。気まぐれも暴力も偶然も、偏見も激情も、何一つかかわらなかったかのような制度である。統一がとれ、全体を網羅し、一度に導入された制度であり、冷静な熟考で計画され、全面的な同意によって設けられた制度である。要するに、普通の人が想像する、先に挙げた二人の賢人の作った制度のようなものである。それなら、「創設者」と言ったとき念頭にあったのは、統治者でも統治される人々でもなく、何らかの中立者だったのかもしれない。あの二人は、いわば仲裁役に選ばれたのだから、それまでの国制がどんなものだったにせよ、そこで統治する立場と統治される立場にそれぞれあった人々との関係では、中立者と見てよいかもしれない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin15",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [

    {
      "id": "bentham-ch04-title",
      "section_id": "bentham-ch04",
      "kind": "heading",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 451,
          "printed_page": "200"
        }
      ],
      "source_text": "CHAPTER IV. RIGHT OF THE SUPREME POWER TO MAKE LAWS.",
      "translation_ja": "第四章　最高権力が法を作る権利",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin01",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 452,
          "printed_page": "200"
        }
      ],
      "source_text": "Subject of the paragraph in question as stated by our Author.",
      "translation_ja": "著者が挙げる、検討する段落の主題",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p001",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 453,
          "printed_page": "200"
        }
      ],
      "source_text": "I. We now come to the third topic touched upon in the digression; namely, the right, as our Author phrases it, which the Supreme Power has of making laws. And this topic occupies one pretty long paragraph. The title here given to it is the same which in the next succeeding paragraph he has found for it himself. This is fortunate: for, to have been obliged to find a title for it myself, is what would have been to the last degree distressing. To entitle a discourse, is to represent the drift of it. But, to represent the drift of this, is a task which, so long at least as I confine my consideration to the paragraph itself, bids defiance to my utmost efforts.",
      "translation_ja": "第一節　さて、この脱線で触れられる第三の主題に移ろう。著者の言い方では、最高権力には法を作る権利があるという話である。この主題は、かなり長い一つの段落を占める。ここでつけた題は、すぐ次の段落で、著者自身がつけた題と同じである。これはありがたい。自分で題を考えなければならなかったら、これ以上ないほど困り果てたろう。論考に題をつけるとは、その趣旨を示すことである。しかし、この論考の趣旨を示すことは、少なくとも当の段落だけを考えているかぎり、どれほど力を尽くしても歯が立たない仕事である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin02",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 454,
          "printed_page": "200"
        }
      ],
      "source_text": "Drift of it as conjectured.",
      "translation_ja": "推測できる段落の趣旨",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p002",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 455,
          "printed_page": "200"
        }
      ],
      "source_text": "II. ’Tis to another passage or two, a passage or two that we have already seen starting up in distant parts of this digression, that I am indebted for such conjectures as I have been able to make up.",
      "translation_ja": "第二節　それでも何とか推測できたのは、別の一、二箇所のおかげである。この脱線の離れた所に顔を出すのをすでに見た、あの一、二箇所のことである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p002-b",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n215/mode/1up",
          "source_sequence": 456,
          "printed_page": "200",
          "printed_page_end": "201"
        }
      ],
      "source_text": "These conjectures, however, I could not have ventured so far to rely on, as on the strength of them to have furnished the paragraph with a title of my own framing. The danger of misrepresentation was too great; a kind of danger which a man cannot but lie imminently exposed to, who ventures to put a precise meaning upon a discourse which in itself has none. That I may just mention, however, in this place, the result of them; what he is really aiming at, I take it, is, to inculcate a persuasion that in every state there must subsist, in some hands or other, a power that is absolute. I mention it thus prematurely, that the reader may have some clue to guide him in his progress through the paragraph; which it is now time I should recite.",
      "translation_ja": "もっとも、推測をそこまで当てにして、独自の題をつける勇気はなかった。趣旨をゆがめて伝える危険があまりに大きかった。もともとはっきりした意味のない論考に、あえてはっきりした意味を読み込めば、誰でもたちまちこの危険にさらされる。とはいえ推測の結果だけ、ここで述べておこう。著者が本当に狙っているのは、どの国にも、どこかの手に絶対的な権力が存在しなければならないという確信を、人々に植えつけることだと思う。時期尚早ながらこのことを言うのは、読者が段落をたどる手がかりを得られるようにするためである。そろそろその段落を引用しよう。",
      "translation_status": "reviewed"
    },

    {
      "id": "bentham-ch05-p005",
      "section_id": "bentham-ch05",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",

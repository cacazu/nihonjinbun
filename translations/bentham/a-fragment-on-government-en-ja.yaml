    {
      "id": "bentham-ch04-p009",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n220/mode/1up",
          "source_sequence": 470,
          "printed_page": "205",
          "printed_page_end": "206"
        }
      ],
      "source_text": "IX. What is possible, notwithstanding, however improbable, is, that the omission we have been speaking of was designed. In this case, what we are to understand is, that the word “right” was meant to introduce a new idea into this latter part of the sentence, over and above any that was meant to be suggested by the former. “Right” then, according to this construction, in the one place, is to be considered as put in contradistinction to fact in the other. The sense is then, that whatever persons do actually exercise supreme power, (or what, according to the antecedent of the enthymeme, is the same thing, the power of making laws) those persons have the right to exercise it. But, in this case, neither does what is given as a consequence in any respect follow from the antecedent, nor can any thing be made of it, but what is altogether foreign to the rest of the discourse. So much indeed, that it seems more consonant to probability, as well as more favourable to our Author, to conclude that he had no meaning at all, than that he had this.",
      "translation_ja": "第九節　もっとも、ありそうにはないが、先ほどの省略が意図的だった可能性もある。その場合、「権利」という語は、前半で示そうとしたことにはなかった新しい観念を、文の後半に持ち込むためだったことになる。そう解釈すれば、後半の「権利」は、前半の事実と対照をなすと考えられる。すると、実際に最高権力、つまり省略三段論法の前提によれば同じことである法を作る権力を行使する人々は、誰であれ、その権力を行使する権利を持つ、という意味になる。しかしこれでは、結論として示されたことは、どの点でも前提から出てこないし、論考の残りとまったく無関係なことしか読み取れない。それもあまりに無関係なので、著者がそんなことを言うつもりだったと考えるより、何も言うつもりはなかったと結論する方が、ありそうな話でもあり、著者にも好意的である。",
      "translation_status": "reviewed"
    },

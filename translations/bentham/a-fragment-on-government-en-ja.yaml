          "printed_page": "137"
        }
      ],
      "source_text": "v. infra, par. 12, note 1.",
      "translation_ja": "後掲第十二節、第一注参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin11",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 192,
          "printed_page": "137"
        }
      ],
      "source_text": "Idea of natural society.",
      "translation_ja": "自然社会の意味",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p011",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 193,
          "printed_page": "137"
        }
      ],
      "source_text": "XI. The idea of a state of natural society is, as we have said, a negative one. When a number of persons are supposed to be in the habit of conversing with each other, at the same time that they are not in any such habit as mentioned above, they are said to be in a state of natural society.",
      "translation_ja": "第十一節　述べたとおり、自然社会の状態は、何かがないことで決まる概念である。複数の人々が互いに交わる習慣を持つが、同時に、先に述べたような習慣は持たないとき、自然社会の状態にあると言われる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin12",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 194,
          "printed_page": "137"
        }
      ],
      "source_text": "Difficulty of drawing the line between the two states.",
      "translation_ja": "二つの状態に境界線を引く難しさ",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p012",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n152/mode/1up",
          "source_sequence": 195,
          "printed_page": "137",
          "printed_page_end": "138"
        }
      ],
      "source_text": "XII. If we reflect a little, we shall perceive, that, between these two states, there is not that explicit separation which these names, and these definitions might teach one, at first sight, to expect. It is with them as with light and darkness: however distinct the ideas may be, that are, at first mention, suggested by those names, the things themselves have no determinate bound to separate them. [The circumstance that has been spoken of as constituting the difference between these two states, is the presence or absence of an habit of obedience.] This habit, accordingly, has been spoken of simply as present (that is as being perfectly present) or, in other words, we have spoken as if there were a perfect habit of obedience, in the one case: it has been spoken of simply as absent (that is, as being perfectly absent) or, in other words, we have spoken as if there were no habit of obedience at all, in the other. But neither of these manners of speaking, perhaps, is strictly just. Few, in fact, if any, are the instances of this habit being perfectly absent; certainly none at all, of its being perfectly present. Governments accordingly, in proportion as the habit of obedience is more perfect, recede from, in proportion as it is less perfect, approach to, a state of nature: and instances may present themselves in which it shall be difficult to say whether a habit, perfect, in the degree in which, to constitute a government, it is deemed necessary it should be perfect, does subsist or not.",
      "translation_ja": "第十二節　少し考えれば、この二つの状態の間に、名前や定義から一見して予想するほどはっきりした区切りはないと分かる。光と闇と同じである。名前を聞いてまず思い浮かべる考えがどれほど違っていようと、もの自体を分ける明確な境界はない。〔二つの状態の違いをなすと先ほど述べたのは、服従の習慣があるかないかである。〕そこで一方では、その習慣は単にある、つまり完全にあると述べた。言い換えれば、完全な服従の習慣があるかのように話した。他方では、その習慣は単にない、つまりまったくないと述べた。言い換えれば、服従の習慣など少しもないかのように話した。しかし、厳密に言えば、どちらの言い方も正しくないだろう。実際、この習慣がまったくない例は、あるとしてもごく少ない。それが完全にある例は、確かに一つもない。したがって政府は、服従の習慣が完全に近いほど自然状態から遠ざかり、不完全なほど自然状態に近づく。だから、政府が成立したと言えるのに必要なだけの完全さを備えた習慣が存在するかどうか、言いがたい例が出てくることもあろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-note63",
      "section_id": "bentham-ch01",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n153/mode/1up",
          "source_sequence": 196,
          "printed_page": "138",
          "printed_page_end": "140"
        }
      ],
      "source_text": "1. A habit. A habit is but an assemblage of acts: under which name I would also include, for the present, voluntary forbearances.\n2. A habit of obedience. A habit of obedience then is an assemblage of acts of obedience.\n3. An act of obedience. An act of obedience is any act done in pursuance of an expression of will on the part of some superior.\n4. An act of political obedience. An act of political obedience (which is what is here meant) is any act done in pursuance of an expression of will on the part of a person governing.\n5. An expression of will. An expression of will is either parole or tacit.\n6. A parole expression of will. A parole expression of will is that which is conveyed by the signs called words.\n7. A tacit expression of will. A tacit expression of will is that which is conveyed by any other signs whatsoever: among which none are so efficacious as acts of punishment annexed in time past, to the non-performance of acts of the same sort with those that are the objects of the will that is in question.\n8. A command. A parole expression of the will of a superior is a command.\n9. A fictitious command. When a tacit expression of the will of a superior is supposed to have been uttered, it may be styled a fictitious command.\n10. Commands and quasi-commands. Were we at liberty to coin words after the manner of the Roman lawyers, we might say a quasi-command.\n11. Illustration — Statute Law, and Common Law. The Statute Law is composed of commands. The Common Law, of quasi-commands.\n12. Duty — point of duty. An act which is the object of a command actual or fictitious; such an act, considered before it is performed, is styled a duty, or a point of duty.\n13. Use of the above chain of definitions. These definitions premised, we are now in a condition to give such an idea, of what is meant by the perfection or imperfection of a habit of obedience in a society as may prove tolerably precise.\n14. Habit of obedience — measure of its perfections. A period in the duration of the society; the number of persons it is composed of during that period; and the number of points of duty incumbent on each person being given; — the habit of obedience will be more or less perfect, in the ratio of the number of acts of obedience to those of disobedience.\n15. Illustration. The habit of obedience in this country appears to have been more perfect in the time of the Saxons than in that of the Britons: unquestionably it is more so now than in the time of the Saxons. It is not yet so perfect, as well contrived and well digested laws in time, it is to be hoped, may render it. But absolutely perfect, till man ceases to be man, it never can be.\nA very ingenious and instructive view of the progress of nations, from the least perfect states of political union to that highly perfect state of it in which we live, may be found in Lord Kaims’s Historical Law Tracts.\n16. Political union or connection. For the convenience and accuracy of discourse it may be of use, in this place, to settle the signification of a few other expressions relative to the same subject. Persons who, with respect to each other, are in a state of political society, may be said also to be in a state of political union or connection.\n17. Submission — subjection. Such of them as are subjects may, accordingly, be said to be in a state of submission, or of subjection, with respect to governors: such as are governors in a state of authority with respect to subjects.\n18. Submission — subjection. When the subordination is considered as resulting originally from the will, or (it may be more proper to say) the pleasure of the party governed, we rather use the word “submission:” when from that of the party governing, the word “subjection.” On this account it is, that the term can scarcely be used without apology, unless with a note of disapprobation: especially in this country, where the habit of considering the consent of the persons governed as being in some sense or other involved in the notion of all lawful, that is, all commendable government, has gained so firm a ground. It is on this account, then, that the term “subjection,” excluding as it does, or, at least, not including such consent, is used commonly in what is called a bad sense: that is, in such a sense as, together with the idea of the object in question, conveys the accessary idea of disapprobation. This accessary idea, however, annexed as it is to the abstract term “subjection,” does not extend itself to the concrete term “subjects” — a kind of inconsistency of which there are many instances in language.",
      "translation_ja": "1．習慣。習慣とは行為が積み重なったものにすぎない。ここではひとまず、みずから進んで何かをしないことも、行為という名に含めておく。\n2．服従の習慣。したがって服従の習慣は、服従の行為が積み重なったものである。\n3．服従の行為。服従の行為とは、ある上位者の意志表示に従って行われた行為をいう。\n4．政治的な服従の行為。ここでいう政治的な服従の行為とは、統治する者の意志表示に従って行われた行為をいう。\n5．意志表示。意志表示は言葉によるか、暗黙になされるか、どちらかである。\n6．言葉による意志表示。言葉による意志表示は、言葉と呼ばれる記号によって伝えられる。\n7．暗黙の意志表示。暗黙の意志表示は、それ以外のあらゆる記号によって伝えられる。問題になっている意志が求める行為と同種の行為をしなかったときに、過去に科された処罰ほど、効果的な記号はない。\n8．命令。上位者の意志を言葉で表示したものは命令である。\n9．擬制上の命令。上位者の暗黙の意志表示を言葉で発したものと見なす場合、擬制上の命令と呼んでよい。\n10．命令と準命令。ローマの法学者にならって言葉を作ってよければ、これを準命令と呼べるだろう。\n11．例――制定法とコモン・ロー。制定法は命令で、コモン・ローは準命令で成り立つ。\n12．義務と個々の義務事項。現実の命令であれ擬制上の命令であれ、その対象である行為を、その実行前の段階で考えるとき、義務、あるいは一つの義務事項と呼ぶ。\n13．一連の定義の用途。これらの定義を前もって置くことで、社会における服従の習慣の完全さ、不完全さとは何かを、かなり正確に示せる。\n14．服従の習慣の完全さの尺度。社会が続くうちの一定期間、その期間の構成員の数、各人が負う義務事項の数を定めれば、服従の習慣がどれほど完全であるかは、服従の行為の数と不服従の行為の数との比で決まる。\n15．例。この国の服従の習慣は、ブリトン人の時代よりサクソン人の時代にいっそう完全だったようであり、サクソン人の時代より今の方がいっそう完全なのは疑いない。よく考え、よく整理された法律が時をかけて実現してくれると期待できるほどには、まだ完全でない。しかし、人間が人間でなくならないかぎり、絶対に完全にはなりえない。\n政治的結合がごく不完全な状態から、私たちが今生きているような高度に完全な状態へ、諸国がどのように進んできたか。ケイムズ卿の『法制史論集』に、実に独創的で教えられることの多い考察がある。\n16．政治的結合または関係。議論をしやすくし、正確に述べられるよう、この話題にかかわる別の言葉をいくつか、ここで定めておくと役に立つだろう。相互に政治社会の状態にある人々については、政治的結合または政治的関係にあるとも言える。\n17．服従と従属。したがって、そのうち臣民である者は統治者に服従または従属する状態にあり、統治者である者は臣民に対して権威を持つ状態にあると言える。\n18．服従と従属。この上下関係が、もともと統治される側の意志、あるいはその意向と言った方がよければその意向から生じたと考えるときは、むしろ「服従」と言う。統治する側から生じたと考えるときには「従属」と言う。そういうわけで、後者を使うと、断りを入れないかぎり、ほとんど必ず非難の響きを伴う。とくにこの国では、合法的な、つまり称賛に値する政府というものを考えるのに、何らかの意味で統治される人々の同意が含まれると考える習慣が強く根づいている。だからこそ、そのような同意を除外するか、少なくとも含まない「従属」という語は、普通、悪い意味で、つまり対象そのものの観念と一緒に、不賛成という付随的な観念まで伝えるように使われる。とはいえ、抽象的な語「従属」にこれほどつきまとうこの観念も、具体的な語「臣民」には及ばない。言葉にはこの手の不ぞろいがよくあるものだ。",
      "translation_status": "reviewed"
    },

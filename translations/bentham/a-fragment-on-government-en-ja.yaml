          "url": "https://archive.org/details/cu31924030442077/page/n247/mode/1up",
          "source_sequence": 564,
          "printed_page": "232"
        }
      ],
      "source_text": "V. Mean time the observation which, if I conjecture right, he really had in view to make, is one which seems very just indeed, and of no mean importance, but which is very obscurely expressed, and not very obviously connected with the purport of what goes before. The duty he here means is a duty, which respects, I take it, not so much the actual making of laws, as the taking of proper measures to spread abroad the knowledge of whatever laws happen to have been made: a duty which (to adopt some of our Author’s own words) is conversant, not so much about issuing “directions,” as about providing that such as are issued shall be “received.”",
      "translation_ja": "第五節　もっとも、推測が正しいなら、著者が本当に述べようとした所見は、実にもっともで、重要さも小さくない。ただ、その表現がひどく不明瞭で、これまでの趣旨とどうつながるかも、なかなか見えてこない。ここで著者の言う義務は、私の考えでは、法を実際に作ることより、どんな法律ができたにせよ、その知識を広く行き渡らせるよう、適切な措置を取ることに関わる。著者自身の言葉を借りれば、「指示」を出すことより、出した指示が「受け取られる」ようにすることに関わる義務である。",
      "translation_status": "reviewed"
    },
    {

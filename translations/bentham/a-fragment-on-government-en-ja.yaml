    {
      "id": "bentham-ch02-p011",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n184/mode/1up",
          "source_sequence": 314,
          "printed_page": "169"
        }
      ],
      "source_text": "XI. The next paragraph, short as it is, contains variety of matter. The first two sentences of it are to let us know, that with regard to the manner in which each of the particular governments that we know of have been formed, he thinks proper to pass it by. A third is to intimate, for the second time, that all governments must be absolute in some hands or other. In the fourth and last, he favours us with a very comfortable piece of intelligence; the truth of which, but for his averment, few of us perhaps would have suspected. This is, that the qualifications mentioned by the last paragraph as requisite to be possessed by all Governors of states are, or at least once upon a time were, actually possessed by them: i. e. according to the opinion of somebody; but of what somebody is not altogether clear: whether in the opinion of these Governors themselves, or of the persons governed by them.",
      "translation_ja": "第十一節　次の段落は短いながらいろいろな話を含む。最初の二文では、私たちの知る個々の政府がどのようにできたかは、取り上げないのがよいと考えている、と知らせてくれる。第三の文では、どの政府にも、その権力を絶対的な形で握る者がどこかに必ずいると、これで二度目だが、ほのめかす。第四の最後の文では、実に心強い話を聞かせてくれる。当人の断言がなければ本当だと思った人はほとんどいなかったろう。前の段落で、どの国の統治者にも欠かせないとされた資質を、彼らは実際に備えているか、少なくとも昔は備えていたというのである。つまり、誰かの意見ではそういうことになる。ただし、その誰かが統治者自身なのか、統治される人々なのかは、いま一つはっきりしない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin12",

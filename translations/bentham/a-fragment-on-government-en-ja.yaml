          "printed_page_end": "202"
        }
      ],
      "source_text": "III. “Having,” says our Author, “thus cursorily considered the three usual species of government, and our own singular constitution, selected and compounded from them all, I proceed to observe, that, as the power of making laws constitutes the supreme authority, so wherever the supreme authority in any state resides, it is the right of that authority to make laws; that is, in the words of our definition, to prescribe the rule of civil action. And this may be discovered from the very end and institution of civil states. For a state is a collective body, composed of a multitude of individuals united for their safety and convenience, and intending to act together as one man. If it therefore is to act as one man, it ought to act by one uniform will. But in as much as political communities are made up of many natural persons, each of whom has his particular will and inclination, these several wills cannot by any natural union be joined together, or tempered and disposed into a lasting harmony, so as to constitute and produce that one uniform will of the whole. It can therefore be no otherwise produced than by a political union; by the consent of all persons to submit their own private wills to the will of one man, or of one, or more assemblies of men, to whom the supreme authority is entrusted: and this will of that one man, or assemblage of men is, in different states, according to their different constitutions, understood to be law.”",
      "translation_ja": "第三節　著者は言う。「普通に見られる三種類の政体と、そのどれからも要素を選んで組み合わせたわが国独特の国制を、このように手短に考察したので、次にこう指摘しておこう。法を作る権力が最高の権威をなすからには、どの国でも、最高の権威がどこにあるにせよ、その権威には法を作る権利、すなわち先の定義の言葉で言えば、市民の行為の規則を定める権利がある。これは、市民国家が設けられた趣旨そのものと、その成り立ちとから分かる。というのも、国家は、安全と便宜のために結び合い、一人の人のようにともに行動しようとする大勢の個人からなる団体だからである。したがって一人の人のように行動するなら、一つの一貫した意志に従って行動すべきである。しかし政治的共同体は、多くの自然人からなり、一人ひとりが独自の意志や好みを持つ。だから、これらのばらばらの意志が、自然な結びつきによって一つに結ばれたり、持続する調和へと整えられたりして、全体の一つの、一貫した意志を作り出すことはありえない。よってそれを作り出せるのは、政治的な結合だけである。最上位の権威を託された一人の人物、あるいは一つか複数の議会の意志に、各人が自分の私的な意志を従わせることに、全員が同意するのである。こうして、その一人または集団の意志が、それぞれの国の異なる国制に従って、その国の法と見なされる」。",
      "translation_status": "reviewed"
    },

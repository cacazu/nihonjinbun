          "printed_page": "164"
        }
      ],
      "source_text": "CHAPTER II. FORMS OF GOVERNMENT.",
      "translation_ja": "第二章　政体",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin01",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n179/mode/1up",
          "source_sequence": 286,
          "printed_page": "164"
        }
      ],
      "source_text": "Subject of the present chapter.",
      "translation_ja": "本章の主題",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p001",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n179/mode/1up",
          "source_sequence": 287,
          "printed_page": "164"
        }
      ],
      "source_text": "I. The contents of the whole digression we are examining, were distributed, we may remember, at the outset of this Essay, into five divisions. The first, relative to the manner in which Government in general was formed, has already been examined in the preceding chapter. The next, relative to the different species or forms it may assume, comes now to be considered.",
      "translation_ja": "第一節　覚えているだろうが、本論の初めに、検討している脱線の全体を五つに分けた。最初の部分では、政府一般がどのように成立したかが取り上げられており、これは前章ですでに検討した。次の部分では、政府がとりうる種類や形が取り上げられている。これから検討するのはこちらである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin02",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n179/mode/1up",
          "source_sequence": 288,
          "printed_page": "164"
        }
      ],
      "source_text": "Theological flourish of our Author.",
      "translation_ja": "著者の神学的な飾り立て",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p002",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n179/mode/1up",
          "source_sequence": 289,
          "printed_page": "164"
        }
      ],
      "source_text": "II. The first object that strikes us in this division of our subject is the theological flourish we see set out with. In this may be said, though in a peculiar sense, to be our Author’s strength. In theology he has found a not unfrequent source, of ornament to divert us, of authority to overawe us, from sounding into the shallowness of his doctrine.",
      "translation_ja": "第二節　ここでまず目を引くのは、出だしを飾る神学である。変わった意味でだが、それこそ著者の得意とするところだと言ってよい。神学はしばしば、読者の気をそらす飾りにも、読者を威圧する権威にもなり、そのおかげで学説の浅さに私たちの目が届かなくなる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note76",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n179/mode/1up",
          "source_sequence": 290,
          "printed_page": "164"
        }
      ],
      "source_text": "This is what there would be occasion to shew at large, were what he says of Law in general, and of the Laws of nature, and revelation in particular, to be examined.",
      "translation_ja": "法一般について、とりわけ自然法と啓示による法について著者の言うところを検討するなら、このことを詳しく示す機会があるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin03",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 291,
          "printed_page": "165"
        }
      ],
      "source_text": "Governors: celestial endowments found for them.",
      "translation_ja": "天から取り寄せた統治者の資質",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p003",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 292,
          "printed_page": "165"
        }
      ],
      "source_text": "III. That governors, of some sort or other, we must have, is what he has been shewing in the manner we have seen in the last chapter. Now for endowments to qualify them for the exercise of their function. These endowments then, as if it were to make them shew the brighter, and to keep them, as much as possible, from being soiled by the rough hands of impertinent speculators, he has chosen should be of æthereal texture, and has fetched them from the clouds.",
      "translation_ja": "第三節　何らかの統治者がどうしても必要であることは、前章で見たようなやり方で、著者が示してきた。今度は、その職務を果たすのにふさわしい資質を扱う。その資質がより輝いて見え、さしでがましい理論家の粗野な手に汚されずに済むようにということだろうか。著者はそれを天上の素材でできたものと決め、雲の上から取ってきた。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p003-b",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 293,
          "printed_page": "165"
        }
      ],
      "source_text": "“All mankind” he says, “will agree that government should be reposed in such persons in whom those qualities are most likely to be found, the perfection of which are among the attributes of Him who is emphatically styled the Supreme Being: the three great requisites, I mean, of wisdom, of goodness, and of power.”",
      "translation_ja": "「誰もが」と著者は言う。「至高の存在という特別な名で呼ばれるお方が完全な形で備えている属性、それにあたる性質が最もありそうな人々に、統治を任せるべきだと認めるだろう。つまり、知恵、善意、力という三つの大きな条件である」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note77",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 294,
          "printed_page": "165"
        }
      ],
      "source_text": "1 Comm. p. 48.",
      "translation_ja": "『イングランド法釈義』第1巻48頁。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p003-c",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 295,
          "printed_page": "165"
        }
      ],
      "source_text": "But let us see the whole passage as it stands —",
      "translation_ja": "しかし、当の一節をありのままに見よう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin04",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 296,
          "printed_page": "165"
        }
      ],
      "source_text": "The passage recited.",
      "translation_ja": "該当箇所の引用",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p004",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n180/mode/1up",
          "source_sequence": 297,
          "printed_page": "165",
          "printed_page_end": "166"
        }
      ],
      "source_text": "IV. “But as all the members of Society,” (meaning natural Society) “are naturally equal,” (i. e. I suppose, with respect to political power, of which none of them as yet have any) “it may be asked,” (continues he) “in whose hands are the reins of government to be intrusted? To this the general answer is easy; but the application of it to particular cases, has occasioned one half of those mischiefs which are apt to proceed from misguided political zeal. In general, all mankind will agree that government should be reposed in such persons in whom those qualities are most likely to be found, the perfection of which are among the attributes of Him who is emphatically styled the Supreme Being; the three grand requisites, I mean, of wisdom, goodness, and of power: wisdom, to discern the real interest of the community; goodness, to endeavour always to pursue that real interest; and strength or power, to carry this knowledge and intention into action. These are the natural foundations of sovereignty, and these are the requisites that ought to be found in every well-constituted frame of government.”",
      "translation_ja": "第四節　「しかし、社会の構成員はみな」〔自然社会のことである〕「生まれながらに平等なのだから」〔たぶん政治権力についての話であり、それはまだ誰も少しも持っていない〕「こう問うことができる」と著者は続ける。「統治の手綱は誰に預けるべきか。一般論として答えるのはたやすい。しかしその答えを個々の場合に当てはめることが、方向を誤った政治への熱意が引き起こしがちな害の、半分を生んできた。一般に、至高の存在という特別な名で呼ばれるお方が完全な形で備えている属性、それにあたる性質が最もありそうな人々に統治を任せるべきだと、誰もが認めるだろう。つまり知恵、善意、力という三つの大きな条件である。知恵は、共同体の真の利益を見分けるため。善意は、その真の利益をいつも追い求めようとするため。強さ、あるいは力は、この知識と意図を行動に移すためである。これらが主権の自然な土台であり、よく組み立てられた政体にはどれにも備わるべき条件である」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin05",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n181/mode/1up",
          "source_sequence": 298,
          "printed_page": "166"
        }
      ],
      "source_text": "Theology on such an occasion as this impertinent.",
      "translation_ja": "ここに神学を持ち出すのは場違いである",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p005",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n181/mode/1up",
          "source_sequence": 299,
          "printed_page": "166"
        }
      ],
      "source_text": "V. Every thing in its place. Theology in a sermon, or a catechism. But in this place, the flourish we have seen, might, for every purpose of instruction, have much better, it should seem, been spared. What purpose the idea of that tremendous and incomprehensible Being thus unnecessarily introduced can answer, I cannot see, unless it were to bewilder and entrance the reader; as it seems to have bewildered and entranced the writer. Beginning thus, is beginning at the wrong end: it is explaining ignotum per ignotius. It is not from the attributes of the Deity, that an idea is to be had of any qualities in men: on the contrary, it is from what we see of the qualities of men, that we obtain the feeble idea we can frame to ourselves, of the attributes of the Deity.",
      "translation_ja": "第五節　何事にもふさわしい場所がある。神学なら説教や教理問答に置くのがよい。しかしここでは、何かを教えるという点からすれば、今見たような飾りは省いた方がずっとよかっただろう。畏るべき、理解の及ばぬあの存在を、何の必要もなく持ち出して何になるのか。著者自身がそうなっているように、読者を惑わせ、うっとりさせるのでなければ、私には分からない。こういう始め方は順序が逆である。分からないものを、それ以上に分からないもので説明している。神の属性から、人間の性質がどんなものか分かるのではない。反対に、私たちが人間に見いだす性質から、ごくかすかではあれ、神の属性を思い描くことができるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin06",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n181/mode/1up",
          "source_sequence": 300,
          "printed_page": "166"
        }
      ],
      "source_text": "Difficulty it leads him into.",
      "translation_ja": "そこから著者が陥る難問",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p006",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n181/mode/1up",
          "source_sequence": 301,
          "printed_page": "166",
          "printed_page_end": "167"
        }
      ],
      "source_text": "VI. We shall soon see whether it be light or darkness our Author has brought back from this excursion to the clouds. The qualifications he has pitched upon for those in whose hands Government is to be reposed we see are three: wisdom, goodness, and power. Now of these three, one there is which, I doubt, will give him some trouble to know what to do with. I mean that of Power: which, looking upon it as a jewel, it should seem, that would give a lustre to the royal diadem, he was for importing from the celestial regions. In heaven, indeed, we shall not dispute its being to be found; and that at all junctures alike. But the parallel, I doubt, already fails. In the earthly governors in question, or, to speak more properly, candidates for government, by the very supposition there can not, at the juncture he supposes, be any such thing. Power is that very quality which, in consideration of these other qualities, which, it is supposed, are possessed by them already, they are now waiting to receive.",
      "translation_ja": "第六節　雲の上まで出かけた著者が持ち帰ったのは光か闇か。すぐに分かる。統治を任せる相手の資質に選んだのは、見たとおり、知恵、善意、力の三つである。そのうち一つは、どう扱えばよいのか、著者もいささか困るのではないか。力のことだ。王冠を輝かせる宝石と見たらしく、著者はそれを天上から取り寄せようとした。確かに天上に力が見いだされ、しかもいつも同じようにあることには異論を唱えまい。しかし、このたとえは早くも成り立たないのではないか。当の地上の統治者、というより、まだ統治者の候補にすぎない人々は、著者が想定する時点では、まさにその想定に従うかぎり、力など持っているはずがない。ほかの資質をすでに備えていると見なされ、それを理由にいま授けられるのを待っているものこそ、力なのだから。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin07",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n182/mode/1up",
          "source_sequence": 302,
          "printed_page": "167"
        }
      ],
      "source_text": "Power, either natural or political.",
      "translation_ja": "自然の力と政治権力",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p007",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n182/mode/1up",
          "source_sequence": 303,
          "printed_page": "167"
        }
      ],
      "source_text": "VII. By Power in this place, I, for my part, mean political power: the only sort of power our Author could mean: the only sort of power that is here in question. A little farther on we shall find him speaking of this endowment as being possessed, and that in the highest degree, by a King, a single person. Natural power therefore, mere organical power, the faculty of giving the hardest blows, can never, it is plain, be that which he meant to number among the attributes of this godlike personage.",
      "translation_ja": "第七節　私がここで力と言うときは、政治権力を指す。著者が指しえたものも、ここで問題になっているものも、それしかない。少し先では、王というただ一人の人物がこの資質を、しかも最高度に備えている、と語られる。だから自然の力、つまり身体だけの力で、誰よりも強く一撃を加えられることを、この神のような人物の属性に数えようとしたはずがない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin08",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n182/mode/1up",
          "source_sequence": 304,
          "printed_page": "167"
        }
      ],
      "source_text": "In neither sense can it be attributed as he attributes it.",
      "translation_ja": "どちらの意味の力も、著者の言うようには備わりえない",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p008",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n182/mode/1up",
          "source_sequence": 305,
          "printed_page": "167",
          "printed_page_end": "168"
        }
      ],
      "source_text": "VIII. We see then the dilemma our Author’s theology has brought him into, by putting him upon reckoning power among the qualifications of his candidates. Power is either natural or political. Political power is what they cannot have by the supposition: for that is the very thing that is to be created, and which, by the establishment of Government, men are going to confer on them. If any, then, it must be natural power; the natural strength that a man possesses of himself without the help of Government. But of this, then, if this be it, there is more, if we may believe our Author, in a single member of a society, than in that member and all the rest of the society put together.",
      "translation_ja": "第八節　こうして、神学に促されて候補者の資質に力を数えた著者が、どんな板挟みになったかが分かる。力は自然の力か政治権力か、どちらかである。政治権力は、前提からして候補者にはありえない。人々が政府を設け、これから作り出して彼らに授けようというのが、まさにその権力だからである。力があるとすれば、政府の助けを借りずに各人が自分だけで持つ、自然の力でなくてはならない。だがそれだとすると、著者を信じるなら、社会のある一人は、その本人と社会の残り全員を合わせたよりも、大きな力を持つことになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note78",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n183/mode/1up",
          "source_sequence": 306,
          "printed_page": "168"
        }
      ],
      "source_text": "V. infra, par. 32, p. 178. Monarchy, which is the government of one, “is the most powerful form of government,” he says, “of any:” more so than Democracy, which he describes as being the Government of all.",
      "translation_ja": "後掲第三十二節、178頁参照。一人による統治である君主政は、「どれよりも力のある政体」だと著者は言う。全員による統治と著者が説明する民主政よりも強いということである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin09",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n183/mode/1up",
          "source_sequence": 307,
          "printed_page": "168"
        }
      ],
      "source_text": "What it is that may.",
      "translation_ja": "備わりうるのはどんな力か",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p009",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n183/mode/1up",
          "source_sequence": 308,
          "printed_page": "168"
        }
      ],
      "source_text": "IX. This difficulty, if possible, one should be glad to see cleared up. The truth is, I take it, that in what our Author has said of power, he has been speaking, as it were, by anticipation: and that what he means by it, is not any power of either kind actually possessed by any man, or body of men, at the juncture he supposes, but only a capacity, if one may call it so, of retaining and putting into action political power, whensoever it shall have been conferred. Now, of actual power, the quantity that is possessed is, in every case, one and the same: for it is neither more nor less than the supreme power. But as to the capacity above spoken of, there do seem, indeed, to be good grounds for supposing it to subsist in a higher degree in a single man than in a body.",
      "translation_ja": "第九節　できることならこの難問は解いておきたい。実際のところ、著者は力について、いわば先取りして語ったのだと思う。著者が意味するのは、想定した時点で個人や集団が実際に持つ、どちらかの種類の力ではない。むしろ、いつ授けられようと、政治権力を保ち、行使することのできる能力、とそう呼んでよければ、それだけである。ここで、実際に持つ権力の大きさなら、どの場合にも同じである。最高権力より大きくも小さくもない、まさに最高権力だからだ。だが今述べた能力については、集団よりも一人の人に高い程度で備わると考えるだけの理由が、確かにあるらしい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin10",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n183/mode/1up",

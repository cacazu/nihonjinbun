      ],
      "source_text": "XXXVIII. As to the fiction now before us, in the character of an argumentum ad hominem, coming when it did, and managed as it was, it succeeded to admiration.",
      "translation_ja": "第三十八節　さて原初契約という擬制は、相手自身の認める前提に訴える議論として、登場した時期と使い方を考えれば、驚くほどの成功を収めた。",
      "translation_status": "reviewed"

          "source_sequence": 310,
          "printed_page": "168",
          "printed_page_end": "169"
        }
      ],
      "source_text": "X. These grounds it will not be expected that I should display at large: a slight sketch will be sufficient. — The efficacy of power is, in part at least, in proportion to the promptitude of obedience: the promptitude of obedience is, in part, in proportion to the promptitude of command: — command is an expression of will: a will is sooner formed by one than many. And this, or something like it, I take to be the plain English of our Author’s metaphor, where he tells us, as we shall see a little farther on, that “a monarchy is the most powerful” [form of government] “of any, all the sinews of government being knit together, and united in the hands of the prince.”",
      "translation_ja": "第十節　その理由を詳しく述べることまでは求められまい。手短な説明で十分である。権力がどれだけ有効に働くかは、少なくとも一部、服従がどれだけ速いかに比例する。服従の速さは、一部、命令の速さに比例する。命令は意志の表明であり、大勢より一人の方が早く意志を固める。著者は少し先で、「君主政は、どの〔政体〕よりも力がある。統治の筋がすべて結い合わされ、君主の手の中に束ねられているからだ」と言う。その比喩を平易な言葉に直せば、今述べたことか、それに近いものになると思う。",
      "translation_status": "reviewed"
    },

          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n202/mode/1up",
          "source_sequence": 390,
          "printed_page": "187",
          "printed_page_end": "188"
        }
      ],
      "source_text": "VII. One parenthesis more: for this sentence teems with parenthesis within parenthesis. To this we are indebted for a very interesting piece of intelligence: nothing less than a full and true account of the personal merits of the members of the House of Lords for the time being. This he is enabled to do by means of a contrivance of his own, no less simple than it is ingenious: to wit, that of looking at their titles. It is by looking at men’s titles that he perceives, not merely that they ought to possess certain merits, not that there is reason to wish they may possess them, but that they do actually possess them, and that it is by possessing those merits that they came to possess these titles. Seeing that some are bishops, he knows that they are pious: seeing that some are peers, he knows that they are wise, rich, valiant.",
      "translation_ja": "第七節　もう一つ括弧がある。この文は、括弧の中にまた括弧が入っているからである。このおかげで、実に面白い知らせが手に入る。ほかでもない、当時の貴族院議員一人ひとりが、どんな長所をもつかという、完全で真実の報告だ。著者は、巧妙さに劣らぬほど単純な、自分で考案した手立てでこれをやってのける。すなわち、肩書を見るのである。人の肩書を見るだけで、その人がある長所を備えるべきだとか、備えていてほしいと思う理由があるとかいうだけでなく、実際に備えていて、それを備えていたからこそ肩書を得たのだと分かるのである。ある者が主教なのを見れば信仰心が厚いと分かり、ある者が貴族なのを見れば、賢く、富み、勇ましいと分かる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-note91",
      "section_id": "bentham-ch03",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [

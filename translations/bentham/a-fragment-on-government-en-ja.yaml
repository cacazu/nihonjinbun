      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p032",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n193/mode/1up",
          "source_sequence": 362,
          "printed_page": "178"
        }
      ],
      "source_text": "XXXII. “In a democracy,” says he, “where the right of making laws resides in the people at large, public virtue or goodness of intention, is more likely to be found, than either of the other qualities of government. Popular assemblies are frequently foolish in their contrivance, and weak in their execution; but generally mean to do the thing that is right and just, and have always a degree of patriotism or public spirit. In aristocracies there is more wisdom to be found than in the other frames of Government; being composed, or intended to be composed, of the most experienced citizens; but there is less honesty than in a republic, and less strength than in a monarchy. A monarchy is indeed the most powerful of any, all the sinews of government being knit together and united in the hand of the prince; but then there is imminent danger of his employing that strength to improvident or oppressive purposes.”",
      "translation_ja": "第三十二節　「法を作る権利が人民全体にある民主政では」と著者は言う。「ほかの二つの統治の資質よりも、公共の徳、すなわち善意が見いだされやすい。民会の案は愚かで、その実行は弱々しいことがよくあるが、普通は正しく公正なことをしようとするし、愛国心や公共心はいつもある程度ある。貴族政には、ほかの政体よりも多くの知恵が見いだされる。最も経験のある市民で評議会が構成されているか、そう構成することを目指しているからである。だが誠実さは共和政より少なく、力は君主政より弱い。確かに君主政は、どの政体よりも力がある。統治の筋がすべて結い合わされ、君主の手の中に束ねられているからだ。しかし君主がその力を、先の見通しのない目的や、人々を抑圧する目的に使う差し迫った危険がある」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin33",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n194/mode/1up",
          "source_sequence": 363,
          "printed_page": "179"
        }
      ],
      "source_text": "And the next.",
      "translation_ja": "さらに次の段落",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p033",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n194/mode/1up",
          "source_sequence": 364,
          "printed_page": "179"
        }
      ],
      "source_text": "XXXIII. “Thus these three species of government have all of them their several perfections and imperfections. Democracies are usually the best calculated to direct the end of a law; aristocracies to invent the means by which that end shall be obtained; and monarchies to carry those means into execution. And the ancients, as was observed, had in general no idea of any other permanent form of government but these three; for though Cicero declares himself of opinion, esse optimé constitutam rempublicam, quae ex tribus generibus illis, regali, optimo, et populari sit modicé confusa; yet Tacitus treats this notion of a mixed government, formed out of them all, and partaking of the advantages of each, as a visionary whim; and one, that if effected, could never be lasting or secure.”",
      "translation_ja": "第三十三節　「こうして三つの政体には、どれにもそれぞれ長所と短所がある。普通、民主政は法の目的を定めるのに最も適し、貴族政は目的を達成する手段を考案するのに、君主政はその手段を実行するのに最も適している。また先に述べたように、古代の人々は普通、この三つ以外に、永く続く政体を考えなかった。というのもキケロは、王政、最良の人々による政体、民衆による政体というあの三種をほどよく混ぜ合わせた国家が、最もよく構成された国家だと、自らの考えを述べる。だがタキトゥスは、三つ全部を合わせて、それぞれの長所を取り込む混合政体の考えを、空想的な思いつきとして扱う。実現したとしても、長続きすることも安定することも決してないというのである」。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin34",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n194/mode/1up",
          "source_sequence": 365,
          "printed_page": "179"
        }
      ],
      "source_text": "Democracy, as described by him, no Government at all.",
      "translation_ja": "著者の言う民主政は、統治がないのも同じである",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-p034",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "grc"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n194/mode/1up",
          "source_sequence": 366,
          "printed_page": "179",
          "printed_page_end": "180"
        }
      ],
      "source_text": "XXXIV. In the midst of this fine-spun ratiocination, an accident has happened, of which our Author seems not to be aware. One of his accidents, as a logician would say, has lost its subject: one of the qualifications he has been telling us of, is, somehow or other, become vacant: the form of Government he designed it for, having unluckily slipped through his fingers in the handling. I mean Democracy; which he, and, according to him, the Ancients, make out to be the Government of all. Now “all” is a great many; so many that, I much doubt, it will be rather a difficult matter to find these high and mighty personages power enough, so much as to make a decent figure with. The members of this redoubtable Commonwealth will be still worse off, I doubt, in point of subjects, than Trinculo in the play, or than the potentates, whom some late navigators found lording it, with might and main, “κρατέρηφι βίηφι,” over a Spanish settlement: there were three members of the Government; and they had one subject among them all. Let him examine it a little, and it will turn out, I take it, to be precisely that sort of Government, and no other, which one can conceive to obtain, where there is no Government at all. Our Author, we may remember, had shrewd doubts about the existence of a state of nature: grant him his Democracy, and it exists in his Democracy.",
      "translation_ja": "第三十四節　この手の込んだ推論の途中で一つの事故が起きたが、著者は気づいていないらしい。論理学者の言葉でいえば、著者の挙げた付帯属性の一つが、それを備える主体を失ったのである。教えてくれた資質の一つが、どういうわけか宙に浮いてしまった。与えるつもりだった政体が、扱っているうちに、運悪く指の間からすり抜けたからだ。民主政のことである。著者も、著者によれば古代の人々も、これを全員による統治とする。だが「全員」とはずいぶん大勢である。あまりに大勢なので、そのお偉方たちが体裁を保つだけの権力すら見つけるのは、なかなか難しいのではないか。この恐るべき共和国の統治者は、臣民の数と言えば、芝居のトリンキュローよりも、また近頃の航海者があるスペイン人の入植地で、力いっぱい、つまり「強い力で」君臨しているのを見つけた権力者たちよりも、ひどく不自由だろう。その政府は三人でできていて、三人合わせて臣民は一人だった。著者が少し調べれば、この政体はまさしく、統治がまったくないところにだけあると考えられる種類の統治にほかならない、と分かると思う。覚えているだろうが、著者は自然状態の実在を大いに疑っていた。ところが著者の民主政を認めれば、その民主政の中に自然状態が実在するのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note85",
      "section_id": "bentham-ch02",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n195/mode/1up",
          "source_sequence": 367,
          "printed_page": "180"
        }
      ],
      "source_text": "See Hawkesworth’s Voyages.\nThe condition of these imaginary sovereigns puts one in mind of the story of, I forget what King’s Fool. The Fool had stuck himself up one day, with great gravity, in the King’s throne, with a stick, by way of a sceptre, in one hand, and a ball in the other; being asked what he was doing, he answered, “reigning.” Much the same sort of reign, I take it, would be that of the members of our Author’s Democracy.",
      "translation_ja": "ホークスワースの『航海記』を参照。\nこの架空の主権者たちのありさまから、どの王についていたかは忘れたが、ある道化の話を思い出す。ある日、道化はすました顔で王の玉座に座り込み、片手に王笏の代わりの棒、もう片手に球を持った。何をしているのかと聞かれ、「統治している」と答えた。著者の民主政の構成員たちも、まあ同じような統治をすることになるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-note86",

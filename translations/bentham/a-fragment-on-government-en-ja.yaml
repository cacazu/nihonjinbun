    },
    {
      "id": "bentham-preface-p008",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n110/mode/1up",
          "source_sequence": 16,
          "printed_page": "95",
          "printed_page_end": "96"
        }
      ],
      "source_text": "In regard to the Law of England in particular, it is here that he gives an account of the division of it into its two branches (branches, however, that are no ways distinct in the purport of them, when once established, but only in respect of the Source from whence their establishment took its rise) the Statute or Written law, as it is called, and the Common or Unwritten:—an account of what are called General Customs, or institutions in force throughout the whole empire, or at least the whole nation;—of what are called Particular Customs, institutions of local extent established in particular districts; and of such adopted institutions of a general extent, as are parcel of what are called the Civil and the Canon laws; all three in the character of so many branches of what is called the Common Law:—in fine, a general account of Equity, that capricious and incomprehensible mistress of our fortunes, whose features neither our Author, nor perhaps any one is well able to delineate;—of Equity, who having in the beginning been a rib of Law, but since in some dark age plucked from her side, when sleeping, by the hands not so much of God as of enterprizing Judges, now lords it over her parent sister:—",
      "translation_ja": "特にイングランドの法について、著者はここで、その二つの部門、いわゆる制定法または成文法と、コモン・ローまたは不文法とを説明している。もっともこの二つは、成立してしまえば内容に何の違いもなく、成立のよりどころだけが違う。次に著者は、帝国全体か、少なくとも国全体で効力を持つ制度、いわゆる一般慣習を説明する。それから特定の地方だけに設けられた制度、いわゆる個別慣習、さらに、広い範囲で効力を持つものとして取り入れられた、いわゆるローマ法や教会法の一部を説明する。この三つはいずれも、いわゆるコモン・ローの部門として扱われる。最後に概説されるのは衡平法である。私たちの運命を左右する気まぐれで不可解な女主人であって、著者にも、おそらく誰にも、その顔立ちを正しく描けはしない。衡平法は、はじめは「法」の肋骨であった。だが、いつのこととも知れぬ暗い時代に、法が眠っているあいだにその脇腹から引き抜かれた。それも神の手というより、進取の気性に富む裁判官の手によってである。今では、自らを生んだ姉に君臨している。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p009",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n111/mode/1up",
          "source_sequence": 17,
          "printed_page": "96"
        }
      ],
      "source_text": "All this, I say, together with an account of the different districts of the empire over which different portions of the Law prevail, or over which the Law has different degrees of force, composes that part of our Author’s work which he has styled the Introduction. His eloquent ‘Discourse on the study of the Law,’ with which, as being a discourse of the rhetorical kind rather than of the didactic, I proposed not to intermeddle, prefaces the whole.",
      "translation_ja": "以上に、帝国のどの地域で法のどの部分が通用するのか、また法の効力の強さは地域ごとにどう違うのかという説明を加えたものが、著者が「序論」と呼ぶ部分を成している。その冒頭には、雄弁な「法の学び方についての講話」が置かれている。これは教えを説くというより、弁論として書かれたものなので、私は立ち入らないことにした。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p010",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n111/mode/1up",
          "source_sequence": 18,
          "printed_page": "96",
          "printed_page_end": "97"
        }
      ],
      "source_text": "It would have been in vain to have thought of travelling over the whole of so vast a work. My design, therefore, was to take such a portion of it, as might afford a fair and adequate specimen of the character and complexion of the whole. For this purpose the part here marked out would, I thought, abundantly suffice. This, however narrow in extent, was the most conspicuous, the most characteristic part of our Author’s work, and that which was most his own. The rest was little more than compilation. Pursuing my examination thus far, I should pursue it, I thought, as far as was necessary for my purpose: and I had little stomach to pursue a task at once so laborious and so invidious any farther. If Hercules, according to the old proverb, is to be known ex pede: much more thought I, is he to be known ex capite.",
      "translation_ja": "これほど大きな著作のすべてをくまなくたどろうとしても、無理であった。そこで私は、全体の性格や色合いを、公平かつ十分に判断できるような一部分を取り出そうと考えた。この目的には、いま選び出した箇所であり余るほどだと思った。範囲は狭くとも、著者の仕事の中でいちばん目を引き、最も特徴があり、何よりその人自身の仕事と言える部分だからだ。あとはほとんど既存の資料を集めたものにすぎない。ここまで調べれば、私の目的に必要なところまでは調べたことになる。大変な骨折りで、しかも人の不興を買うような仕事を、それ以上進めたい気にはまずならなかった。古いことわざどおり、ヘラクレスは足を見れば分かるというなら、頭を見ればなおさら分かるだろう、と私は考えたのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p011",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n112/mode/1up",
          "source_sequence": 19,
          "printed_page": "97"
        }
      ],
      "source_text": "In these views it was that I proceeded as far as the middle of the definition of the Law municipal. It was there I found, not without surprise, the digression which makes the subject of the present Essay. This threw me at first into no small perplexity. To give no account of it at all;—to pass wholly sub silentio, so large, and in itself so material a part of the work I was examining, would seem strange: at the same time I saw no possibility of entering into an examination of a passage so anomalous, without cutting in pieces the thread of the discourse. Under this doubt I determined at any rate, for the present, to pass it by; the rather as I could not perceive any connection that it had with any thing that came before or after. I did so; and continuing my examination of the definition from which it digressed, I travelled on to the end of the Introduction. It then became necessary to come to some definitive resolution concerning this excentric part of it: and the result was, that being loth to leave the enterprise I had begun in this respect, imperfect, I sat down to give what I intended should be a very slight and general survey of it.",
      "translation_ja": "こう考えながら、国内法の定義の途中まで進んだ。そこで、意外にも、この論考の主題となった脱線に出会った。初めはずいぶん当惑した。調べている著作のうち、これほど長く、それ自体としてこれほど重要な箇所を、まったく取り上げず、黙って通り過ぎれば、おかしく見えるだろう。しかし、一方で、このように筋を外れた箇所を調べ始めれば、議論の糸が切れ切れにならずにはすまない。どうしたものかと思ったが、とにかくさしあたっては、そこを飛ばすことに決めた。前後のどこにも、つながりが見えなかったから、なおさらであった。そこで、この脱線の出発点となった定義の検討に戻り、序論の終わりまで進んだ。だが、そうなれば、やはりこの脇道をどう扱うか、はっきり決めなければならない。この点を残したまま、始めた仕事を不完全にしておきたくなかった。結局、ごく簡単に、大筋だけを見るつもりで、これを取り上げることにした。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p012",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n112/mode/1up",
          "source_sequence": 20,
          "printed_page": "97",
          "printed_page_end": "98"
        }
      ],
      "source_text": "The farther, however, I proceeded in examining it, the more confused and unsatisfactory it appeared to me: and the greater difficulty I found in knowing what to make of it, the more words it cost me, I found, to say so. In this way, and by these means it was that the present Essay grew to the bulk in which the Reader sees it. When it was nearly completed, it occurred to me, that as the digression itself which I was examining was perfectly distinct from, and unconnected with, the text from which it starts, so was, or so at least might be, the critique on that digression, from the critique on the text. The former was by much too large to be engrafted into the latter: and since if it accompanied it at all, it could only be in the shape of an Appendix, there seemed no reason why the same publication should include them both. To the former, therefore, as being the least, I determined to give that finish which I was able, and which I thought was necessary: and to publish it in this detached manner, as the first, if not the only part of a work, the principal and remaining part of which may possibly see the light some time or other, under some such title as that of ‘A Comment on the Commentaries.’",
      "translation_ja": "ところが、検討を進めるほど、その箇所は混乱していて、納得のいかないものに見えてきた。どう受け取ればよいのかが分からないほど、それを言い表すのに、ますます多くの言葉を費やすことになった。こうしたわけで、この論考は読者がいま目にする長さにまでふくらんだ。ほぼ書き終えたとき、私はふと思った。取り上げた脱線が、もとの本文とはまったく別で、つながりがなかったのと同じく、その脱線への批評も、本文そのものへの批評とは別であり、少なくとも切り離せる。前者は長くなりすぎて、後者に挿し込むことはできない。仮につけるにしても、付録としてしかつけられないなら、一冊に両方を収める理由もなさそうだ。そこで、短い方の批評だけ、必要と思い、また自分の力の及ぶところまで仕上げ、こうして別に刊行することにした。ある著作の第一部、場合によっては世に出る唯一の部分としてである。その中心となる後続部分は、いつか『釈義への注解』とでもいう名で日の目を見ることがあるかもしれない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p013",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n113/mode/1up",
          "source_sequence": 21,
          "printed_page": "98"
        }
      ],
      "source_text": "In the mean time that I may stand more fully justified, or excused at least, in an enterprise to most perhaps so extraordinary, and to many doubtless so unacceptable, it may be of use to endeavour to state with some degree of precision, the grounds of that war which, for the interests of true science, and of liberal improvement, I think myself bound to wage against this work. I shall therefore proceed to mark out and distinguish those points of view in which it seems principally reprehensible, not forgetting those in which it seems still entitled to our approbation and applause.",
      "translation_ja": "それまでのあいだ、この企てはたいていの人にはおそらく奇異に見え、多くの人には間違いなく気に入られないだろうから、私としては、ここでいくらかはっきりと、その理由を述べておくのが有益かもしれない。どうして真の学問と寛容な進歩のために、この著作に論戦を挑まねばならないと思うのかを明らかにすれば、企ての正しさをよりよく示せるか、少なくとも弁明にはなるだろう。そこで以下では、この著作の主な非難すべき点を示し、それぞれを区別して述べる。もっとも、なお私たちの是認と賞賛に値する点を、忘れるつもりはない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin03",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n113/mode/1up",
          "source_sequence": 22,
          "printed_page": "98"
        }
      ],
      "source_text": "The business of the Censor distinguished from that of the Expositor.",
      "translation_ja": "批評者の仕事と解説者の仕事の区別",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p014",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n113/mode/1up",
          "source_sequence": 23,
          "printed_page": "98",
          "printed_page_end": "99"
        }
      ],
      "source_text": "There are two characters, one or other of which every man who finds any thing to say on the subject of Law, may be said to take upon him;—that of the Expositor, and that of the Censor. To the province of the Expositor it belongs to explain to us what, as he supposes, the Law is: to that of the Censor, to observe to us what he thinks it ought to be. The former, therefore, is principally occupied in stating, or in enquiring after facts: the latter, in discussing reasons. The Expositor, keeping within his sphere, has no concern with any other faculties of the mind than the apprehension, the memory, and the judgment: the latter, in virtue of those sentiments of pleasure or displeasure which he finds occasion to annex to the objects under his review, holds some intercourse with the affections. That which is Law, is, in different countries, widely different: while that which ought to be, is in all countries to a great degree the same. The Expositor, therefore, is always the citizen of this or that particular country: the Censor is, or ought to be the citizen of the world. To the Expositor it belongs to shew what the Legislator and his underworkman the Judge have done already: to the Censor it belongs to suggest what the Legislator ought to do in future. To the Censor, in short, it belongs to teach that science, which when by change of hands converted into an art, the Legislator practises.",
      "translation_ja": "法について何か言うことのある人は誰でも、解説者と批評者のどちらかの役を引き受けると言ってよい。解説者の仕事は、自分が法はこうなっていると考えるところを、私たちに説明することだ。批評者の仕事は、法はどうあるべきだと思うのかを述べることである。したがって、前者が主にするのは事実を示し、あるいは調べること、後者が主にするのは、理由を論じることだ。解説者は、自分の役割にとどまるかぎり、理解、記憶、判断以外の知的な働きには関わらない。これに対し批評者は、検討する事柄を好ましく思ったり、好ましくないと思ったりすることがあるので、感情ともいくらか関わる。何が法であるかは国によって大いに違うが、何が法であるべきかは、国が違ってもかなりのところまで同じである。だから、解説者はいつも特定の国の市民であるのに対し、批評者は世界の市民であるか、そうあるべきだ。立法者と、そのもとで働く裁判官がすでに何をしたかを示すのは解説者の仕事である。立法者が今後何をすべきかを提案するのは、批評者の仕事だ。要するに、批評者が教える学問は、手が替わって技術となったとき、立法者が実践することになるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note03",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n113/mode/1up",
          "source_sequence": 24,
          "printed_page": "98"
        }
      ],
      "source_text": "In practice, the question of Law has commonly been spoken of as opposed to that of fact: but this distinction is an accidental one. That a Law commanding or prohibiting such a sort of action, has been established, is as much a fact, as that an individual action of that sort has been committed. The establishment of a Law may be spoken of as a fact, at least for the purpose of distinguishing it from any consideration that may be offered as a reason for such Law.",
      "translation_ja": "実際の扱いでは、法の問題は事実の問題と対立するものとして語られるのが普通である。だがこの区別は、たまたまそうなっているにすぎない。ある種類の行為を命じ、あるいは禁止する法律が制定されたことも、その種類に属する個別の行為がなされたことと同じく、事実である。少なくとも、その法を設ける理由として挙げられうる事情と区別するためには、法が制定されたことを一つの事実として語ってよい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin04",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n114/mode/1up",
          "source_sequence": 25,
          "printed_page": "99"
        }
      ],
      "source_text": "The latter alone our Author’s.",
      "translation_ja": "後者だけが著者の役目",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p015",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n114/mode/1up",
          "source_sequence": 26,
          "printed_page": "99",
          "printed_page_end": "100"
        }
      ],
      "source_text": "Let us now return to our Author. Of these two perfectly distinguishable functions, the latter alone is that which it fell necessarily within his province to discharge. His professed object was to explain to us what the Laws of England were. ‘Ita lex scripta est,’ was the only motto which he stood engaged to keep in view. The work of censure (for to this word, in default of any other, I find it necessary to give a neutral sense) the work of censure, as it may be styled, or, in a certain sense, of criticism, was to him but a parergon—a work of supererogation: a work, indeed, which, if aptly executed, could not but be of great ornament to the principal one, and of great instruction as well as entertainment to the Reader, but from which our Author, as well as those that had gone before him on the same line, might, without being chargeable with any deficiency, have stood excused: a work which, when superadded to the principal, would lay the Author under additional obligations, and impose on him new duties: which, notwithstanding, whatever else it might differ in from the principal one, agrees with it in this, that it ought to be executed with impartiality, or not at all.",
      "translation_ja": "さて、著者に戻ろう。明確に区別できるこの二つの役目のうち、必ず果たすべきものとして、著者の分担に入っていたのは後者だけだ〔ただし以下では解説者の役目をいう〕。著者が公に掲げた目的は、イングランドの法が実際にどうなっているかを私たちに説明することだった。「法にはそう書かれている」。念頭に置くと約束した標語は、これ一つである。それに対して批評の仕事は、ほかに言葉がないので、ここでは「批評」という語を、非難にも賞賛にも偏らない意味で使うが、著者にすれば本筋から外れる仕事、義務を超えてする仕事にすぎなかった。うまく運べば本来の仕事を大いに引き立て、読者にも教えと楽しみをもたらすのは確かだが、同じ道をたどった先人たちと同様、著者もこれをしなかったからといって、何かを怠ったとは責められなかったはずだ。本来の仕事にこれを加えれば、著者はさらに責任を引き受け、新たな義務を負う。ほかにどれほど違いがあっても、この一点では本来の仕事と同じだ。公平にやるのでなければ、初めから何もしない方がよい。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin05",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"

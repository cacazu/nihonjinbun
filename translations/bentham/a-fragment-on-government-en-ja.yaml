    {
      "id": "bentham-ch01-p002-b",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n148/mode/1up",
          "source_sequence": 162,
          "printed_page": "133"
        }
      ],
      "source_text": "“For when society is once formed, government results of course, as necessary to preserve and to keep that society in order. Unless some superior were constituted, whose commands and decisions all the members are bound to obey, they would still remain as in a state of nature, without any judge upon earth to define their several rights, and redress their several wrongs.” — Thus far our Author.",
      "translation_ja": "「というのも、いったん社会ができれば、社会を保ち、その秩序を守るために必要なものとして、政府はおのずと生じるからである。全構成員が命令と裁定に従う義務を負うような上位者が設けられなければ、人々は自然状態にいるも同然で、それぞれの権利を定め、それぞれが受けた不法を正す裁き手は、この世のどこにもいないことになる」。以上が著者の言葉である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin03",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n148/mode/1up",
          "source_sequence": 163,
          "printed_page": "133"
        }
      ],
      "source_text": "Confusion among the leading terms of it.",
      "translation_ja": "主要な用語の混乱",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p003",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n148/mode/1up",
          "source_sequence": 164,
          "printed_page": "133"
        }
      ],
      "source_text": "III. When leading terms are made to chop and change their several significations; sometimes meaning one thing, sometimes another, at the upshot perhaps nothing; and this in the compass of a paragraph; one may judge what will be the complexion of the whole context. This, we shall see, is the case with the chief of those we have been reading: for instance, with the words “Society,” — “State of nature,” — “original contract,” — not to tire the reader with any more. “Society” in one place means the same thing as “a state of nature” does: in another place it means the same as “Government.” Here, we are required to believe there never was such a state as a state of nature: there we are given to understand there has been. In like manner with respect to an original contract we are given to understand that such a thing never existed; that the notion of it is ridiculous: at the same time that there is no speaking nor stirring without supposing there was one.",
      "translation_ja": "第三節　主要な用語がくるくると意味を変え、あるときはこれ、あるときはあれを意味し、あげくには何も意味しないかもしれない。それがわずか一段落のうちで起きるなら、文章全体がどんなものかは察しがつく。今読んだ文章でも、肝心の用語がそうなっている。たとえば「社会」「自然状態」「原初契約」。読者をうんざりさせぬよう、これ以上は挙げまい。「社会」は一方では「自然状態」と同じものを指し、他方では「政府」と同じものを指す。こちらでは自然状態などは一度もなかったと信じさせられ、あちらではあったと受け取るように仕向けられる。原初契約についても同じで、そんなものは一度もなく、その考えはばかげていると受け取らされる。その一方で、あったことにしなければ、何一つ語れず、一歩も先に進めないのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin04",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n149/mode/1up",
          "source_sequence": 165,
          "printed_page": "134"
        }
      ],
      "source_text": "“Society” put synonymous to a state of nature, — opposed to “Government,” — and spoken of as having existed.",
      "translation_ja": "「社会」は自然状態と同義で、「政府」と対立し、実在したものとされる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p004",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n149/mode/1up",
          "source_sequence": 166,
          "printed_page": "134"
        }
      ],
      "source_text": "IV. 1st, Society means a state of nature. For if by “state of nature” a man means any thing, it is the state, I take it, men are in or supposed to be in, before they are under government: the state men quit when they enter into a state of government; and in which were it not for government they would remain. But by the word society it is plain at one time that he means that state. First, according to him, comes society; then afterwards comes government. “For when society,” says our Author, “is once formed, government results of course; as necessary to preserve and keep that society in order.” — And again, immediately afterwards, — “A state in which a superior has been constituted, whose commands and decisions all the members are bound to obey,” he puts as an explanation (nor is it an inapt one) of a state of “government”: and “unless” men were in a state of that description, they would still “remain,” he says, “as in a state of nature.” By society, therefore, he means, once more, the same as by a “state of nature”: he opposes it to government. And he speaks of it as a state which, in this sense, has actually existed.",
      "translation_ja": "第四節　第一に、社会は自然状態を意味する。「自然状態」が何かを意味するなら、それは統治のもとに入る前に人々がいる、あるいはいると見なされる状態であろう。政府のある状態に入ると人々はそこから出るが、政府がなければそのままそこにとどまる。ところが著者が「社会」でまさにその状態を指すことが、一度あるのは明らかだ。著者によれば、まず社会ができ、その後に政府ができる。「というのも、いったん社会が」と著者は言う。「できれば、社会を保ち、その秩序を守るために必要なものとして、政府はおのずと生じるからである」。そしてすぐ後で、「全構成員が命令と裁定に従う義務を負うような上位者が設けられた状態」を、「政府」のある状態の説明として挙げる。これは的外れな説明ではない。そして人々がそのような状態になければ、「自然状態にいるも同然」のまま「とどまる」と言う。だから、繰り返すが、社会は著者にとって「自然状態」と同じものであり、政府と対置されている。そしてその意味で、それは現実に存在した状態として語られている。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-margin05",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n149/mode/1up",
          "source_sequence": 167,
          "printed_page": "134"
        }
      ],
      "source_text": "“Society,” put synonymous to “government.”",
      "translation_ja": "「社会」が「政府」と同義になる",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p005",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n149/mode/1up",
          "source_sequence": 168,
          "printed_page": "134",
          "printed_page_end": "135"
        }
      ],
      "source_text": "V. 2dly, This is what he tells us in the beginning of the second of the two paragraphs: but all the time the first paragraph lasted, society meant the same as government. In shifting then from one paragraph to another, it has changed its nature. ’Tis “the foundations of society,” that he first began to speak of, and immediately he goes on to explain to us, after his manner of explaining, the foundations of government. ’Tis of a “formal beginning” of “Society” that he speaks soon after; and by this formal beginning, he tells us immediately, that he means, “the original contract of society,” which contract entered into, “a state,” he gives us to understand, is thereby “instituted,” and men have undertaken to “submit to Laws.” So long then as this first paragraph lasts, “society” I think, it is plain cannot but have been meaning the same as “government.”",
      "translation_ja": "第五節　第二に、以上は二つの段落のうち、後の段落の冒頭で著者が語ることである。ところが最初の段落の間はずっと、社会は政府と同じものを意味していた。段落を移るや、社会は性質を変えたわけである。初めに語りだしたのは「社会の基礎」であり、ところがすぐに、持ち前の説明の仕方で、政府の基礎を説明しだす。少し後で語るのは「社会」の「正式な出発点」である。その出発点とは「社会の原初契約」のことだとすぐに教えられ、その契約が結ばれるや「国」が「設けられ」、人々が「法に従う」と約した、と受け取るように仕向けられる。したがって、最初の段落が続く間、「社会」は「政府」と同じものを意味していたとしか考えられない。",
      "translation_status": "reviewed"
    },

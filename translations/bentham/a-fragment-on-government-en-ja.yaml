      ],
      "source_text": "XIII. This is not all. The most emphatical passage is yet behind. It is a passage in that short paragraph which we found to contain such a variety of matter. He is there speaking of the several forms of government now in being. “However they began,” says he, “or by what right soever they subsist, there is and must be in all of them a supreme, irresistible, absolute, uncontrolled authority, in which the jura summi imperii, or the rights of sovereignty, reside.”",
      "translation_ja": "第十三節　それだけではない。最も力のこもった箇所がまだ残っている。あれほどさまざまな事柄を含むと分かった、あの短い段落の一節である。そこでは、現に存在するさまざまな政体が論じられる。「どのように始まったにせよ、どのような権原によって存続するにせよ」と著者は言う。「どの政体にも、最高の、抗しがたい、絶対的な、誰にも制約されない権威が存在し、存在しなければならない。そこに最高統治権、つまり主権の諸権利がある」。",
      "translation_status": "reviewed"
    },

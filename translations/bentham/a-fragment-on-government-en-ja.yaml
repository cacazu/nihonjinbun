    },
    {
      "id": "bentham-ch02-p015",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n186/mode/1up",
          "source_sequence": 322,
          "printed_page": "171"
        }
      ],
      "source_text": "XV. All this, however, is but conjecture: In the proposition itself neither this, nor any other restriction is expressed. It is delivered explicitly and emphatically in the character of an universal one. “In all of THEM,” he assures us, “this authority,” (the supreme authority) “is placed in those hands, wherein, according to the opinion of the founders of such respective states, these ‘qualities of wisdom, goodness, and power,’ are the most likely to be found.” In this character it cannot but throw a singular light on history. I can see no end, indeed, to the discoveries it leads to, all of them equally new and edifying.",
      "translation_ja": "第十五節　もっとも、以上はただの推測である。命題そのものにはこんな限定も、ほかのどんな限定も書かれていない。著者はそれが普遍的な命題だと、明白に、しかも強調して述べている。「どの政体にも」と念を押す。「この権威」、すなわち最高の権威は、「それぞれの国の創設者の意見によって、『知恵、善意、力という資質』を最も備えていそうな者の手に置かれている」。普遍的な命題としてなら、これは歴史に奇妙な光を当てずにはいない。そこから導かれる発見は尽きそうもなく、どれも新しく、等しくためになる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch02-margin15-b",
      "section_id": "bentham-ch02",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

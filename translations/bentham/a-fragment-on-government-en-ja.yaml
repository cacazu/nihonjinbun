    {
      "id": "bentham-preface-note47",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n138/mode/1up",
          "source_sequence": 129,
          "printed_page": "123",
          "printed_page_end": "124"
        }
      ],
      "source_text": "The difference between a generous and determined affection, and an occasional, and as it were forced contribution, to the cause of reformation, may be seen, I think, in these Commentaries, compared with another celebrated work on the subject of our Jurisprudence. Mr. Barrington, whose agreeable Miscellany has done so much towards opening men’s eyes upon this subject; Mr. Barrington, like an active General in the service of the Public, storms the strongholds of chicane, wheresoever they present themselves, and particularly fictions, without reserve. Our Author, like an artful partizan in the service of the profession, sacrifices a few, as if it were to save the rest. Deplorable, indeed, would have been the student’s chance for salutary instruction, did not Mr. Barrington’s work in so many instances, furnish the antidote to our Author’s poisons.",
      "translation_ja": "改革を心から、ひるまず支持することと、ときどき、仕方なしといったふうに力を貸すだけなのとの違いは、『釈義』を、わが国の法学を扱った別の名著と比べてみれば、分かると思う。この主題について人々の目を開くのに、楽しい論集が大きな役割を果たした、バリントン氏のことである。氏は公に仕える行動的な将軍のように、法律の小細工が砦を構えるところならどこでも攻め立て、とりわけ法的擬制は容赦しない。私たちの著者は、法律家の職分に仕える抜け目のない一党の徒のように、残りを救うつもりででもいるかのように、わずかなものだけを犠牲にする。バリントン氏の著作が、これほど多くの場合に、著者の毒に効く解毒剤を与えてくれなかったら、法を学ぶ者が有益な教えを受ける機会は、まことに嘆かわしいものであっただろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin11",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n138/mode/1up",
          "source_sequence": 130,
          "printed_page": "123"
        }
      ],
      "source_text": "Manner in which the present Essay has been conducted.",
      "translation_ja": "この論考の進め方",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p069",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n139/mode/1up",
          "source_sequence": 131,
          "printed_page": "124"
        }
      ],
      "source_text": "With regard to this Essay itself, I have not much to say. The principal and professed purpose of it is, to expose the errors and insufficiencies of our Author. The business of it is therefore rather to overthrow than to set up; which latter task can seldom be performed to any great advantage where the former is the principal one.",
      "translation_ja": "この論考それ自体については、あまり言うことはない。私が掲げる主な目的は、著者の誤りや不十分な点を明るみに出すことである。したがって、論考の仕事は立てることよりも、むしろ打ち倒すことにある。打ち倒すことが主な仕事であるところで、立てる方の仕事まで大きな成果を上げられることはめったにない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p070",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n139/mode/1up",
          "source_sequence": 132,
          "printed_page": "124"
        }
      ],
      "source_text": "To guard against the danger of misrepresentation, and to make sure of doing our Author no injustice, his own words are given all along: and, as scarce any sentence is left unnoticed, the whole comment wears the form of what is called a perpetual one. With regard to a discourse that is simply institutional, and in which the writer builds upon a plan of his own, a great part of the satisfaction it can be made to afford depends upon the order and connection that are established between the several parts of it. In a comment upon the work of another, no such connection, or at least no such order, can be established commodiously, if at all. The order of the comment is prescribed by the order, perhaps the disorder, of the text.",
      "translation_ja": "著者の言い分を取り違えず、不当な扱いもしないため、初めから終わりまで、著者自身の言葉を引いた。ほとんどどの文も見過ごさないので、注解全体が、いわゆる逐条の形をとっている。ただ制度を説明する論考で、書き手が自分の計画で組み立てるのであれば、読者にどれほど納得してもらえるかは、各部分の間にどんな順序とつながりを持たせるかに、大いによる。だが、他人の著作の注解では、そのようなつながりは、少なくとも、そのような順序は、たやすくは作れない。そもそも作れるともかぎらない。注解の順序を決めるのは、もとの文章の順序、あるいは無秩序なのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p071",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n139/mode/1up",
          "source_sequence": 133,
          "printed_page": "124"
        }
      ],
      "source_text": "The chief employment of this Essay, as we have said, has necessarily been to overthrow. In the little, therefore, which has been done by it in the way of setting up, my view has been not so much to think for the Reader, as to put him upon thinking for himself. This I flatter myself with having done on several interesting topics; and this is all that at present I propose.",
      "translation_ja": "すでに述べたとおり、この論考の主な仕事は、どうしても打ち倒すことになった。そこで、ほんのわずかながら、自ら新たに立てたものについても、読者の代わりに考えてやるというより、読者に自分で考え始めてもらうことが私の狙いだった。興味深い主題いくつかについては、それができたと自負している。私がいま目指すのは、それだけである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p072",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n139/mode/1up",
          "source_sequence": 134,
          "printed_page": "124",
          "printed_page_end": "125"
        }
      ],
      "source_text": "Among the few positions of my own which I have found occasion to advance, some I observe which promise to be far from popular. These it is likely may give rise to very warm objections: objections which in themselves I do not wonder at, and which in their motive I cannot but approve. The people are a set of masters whom it is not in a man’s power in every instance fully to please, and at the same time faithfully to serve. He that is resolved to persevere without deviation in the line of truth and utility, must have learnt to prefer the still whisper of enduring approbation, to the short-lived bustle of tumultuous applause.",
      "translation_ja": "ここで私自身の見解を述べる機会はわずかだったが、その中でもいくつかは、とても人気が出そうにないと思う。激しい異論を呼ぶかもしれない。そのような異論が出ても、驚きはしないし、その動機は、むしろもっともだと思わずにいられない。人民という主人たちに、どんな場合もすっかり気に入られながら、同時に忠実に仕えることなど、人の力には及ばない。真実と有用性の道をそれることなく進む決心をした人は、やかましい拍手がひとときにわき起こるよりも、ひそやかな、だが長く続く是認のささやきを選ぶことを、学んでいなければならない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p073",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n140/mode/1up",
          "source_sequence": 135,
          "printed_page": "125"
        }
      ],
      "source_text": "Other passages too there may be, of which some farther explanation may perhaps not unreasonably be demanded. But to give these explanations, and to obviate those objections, is a task which, if executed at all, must be referred to some other opportunity. Consistency forbad our expatiating so far as to lose sight of our Author: since it was the line of his course that marked the boundaries of ours.",
      "translation_ja": "ほかにも、もう少し説明がほしいと要求されても、もっともな箇所があるかもしれない。しかし説明を加え、こうした異論にあらかじめ答える仕事は、そもそも行うとしても、別の機会に譲らねばならない。この論考の筋を通そうとすれば、著者を見失うほど離れたところまで話を広げることはできなかった。著者の進んだ道筋が、こちらの進む範囲を定めたのだから。",
      "translation_status": "reviewed"
    },

          "source_sequence": 138,
          "printed_page": "127"
        }
      ],
      "source_text": "Division of our Author’s Introduction.",
      "translation_ja": "著者の序論の構成",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-intro-p001",
      "section_id": "bentham-intro",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n142/mode/1up",
          "source_sequence": 139,
          "printed_page": "127"
        }
      ],
      "source_text": "I. The subject of this examination, is a passage contained in that part of Sir W. Blackstone’s Commentaries on the Laws of England, which the Author has styled the Introduction. This Introduction of his stands divided into four Sections. The first contains his discourse ‘On the Study of the Law.’ The second, entitled ‘Of the Nature of Laws in general,’ contains his speculations concerning the various objects, real or imaginary, that are in use to be mentioned under the common name of Law. The third, entitled ‘Of the Laws of England,’ contains such general observations, relative to these last mentioned Laws, as seemed proper to be premised before he entered into the details of any parts of them in particular. In the fourth, entitled, ‘Of the Countries subject to the Laws of England,’ is given a statement of the different territorial extents of different branches of those Laws.",
      "translation_ja": "第一節　本論が検討するのは、サー・W・ブラックストンの『イングランド法釈義』で、著者が「序論」と名づけた部分の一節である。その序論は四つの節に分かれている。第一節には「法の学び方について」の講話を収める。第二節は「法律一般の性質について」と題し、現実のものであれ想像上のものであれ、普通一括して「法」と呼ばれるさまざまなものについて、著者の考えを収めている。第三節は「イングランドの法について」と題し、その法のどれか一部分の細部に立ち入る前に述べておくのがよいと著者が考えた、この法についての一般的な所見を収める。第四節は「イングランドの法が及ぶ諸国について」と題し、それぞれの法部門が効力を持つ領域がどう異なるのかを示している。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-intro-margin02",
      "section_id": "bentham-intro",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n143/mode/1up",
          "source_sequence": 140,
          "printed_page": "128"
        }
      ],
      "source_text": "What part of it is here to be examined.",
      "translation_ja": "ここで検討する箇所",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-intro-p002",
      "section_id": "bentham-intro",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n143/mode/1up",
          "source_sequence": 141,
          "printed_page": "128"
        }
      ],
      "source_text": "II. ’Tis in the second of these sections, that we shall find the passage proposed for examination. It occupies in the edition I happen to have before me, which is the first (and all the editions, I believe, are paged alike) the space of seven pages; from the 47th, to the 53d, inclusive.",
      "translation_ja": "第二節　検討する一節は、このうち第二節にある。たまたま私の手もとにあるのは初版だが、どの版でも頁は同じだと思う。そこでは、47頁から53頁まで、両端を含めて七頁を占める。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-intro-margin03",
      "section_id": "bentham-intro",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n143/mode/1up",

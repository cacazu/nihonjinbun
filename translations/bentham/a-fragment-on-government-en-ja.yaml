      "source_text": "It is not here that he assures us in point of fact, that there never has been an alteration made in the Law that men have not afterwards found reason to regret.",
      "translation_ja": "法が改められるたびに、人は必ず、後になって改めなければよかったと思う理由を見いだしてきたと、事実について請け合うのは、ここではない。",

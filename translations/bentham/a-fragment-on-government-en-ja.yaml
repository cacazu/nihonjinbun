        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n218/mode/1up",
          "source_sequence": 464,
          "printed_page": "203",
          "printed_page_end": "204"
        }
      ],
      "source_text": "VI. By the “supreme authority” then, (we may suppose our Author to say) “I mean the same thing as when I say the power of making laws.” This is the proposition we took notice of above, under the name of the antecedent. This antecedent then, we may observe, is a definition: a definition, to wit, of the phrase “supreme authority.” Now to define a phrase is, to translate it into another phrase, supposed to be better understood, and expressive of the same ideas. The supposition here then is, that the reader was already, of himself, tolerably well acquainted with the import of the phrase “power of making laws:” that he was not at all, or was however less acquainted with the import of the phrase “supreme authority.” Upon this supposition then, it is, that in order to his being made clearly to understand the latter, he is informed of its being synonymous to the former. Let us now introduce the mention of the person: let us add the word “person” to the definition; it will be the same definition still in substance, only a little more fully and precisely worded. For a person to possess the supreme authority, is for a person to possess the power of making laws. This then is what in substance has been already laid down in the antecedent.",
      "translation_ja": "第六節　さて著者は、こう言うものとしよう。「最高の権威」とは「法を作る権力と言うときと同じものを指す」。これが先ほど、前提という名で取り上げた命題である。したがってこの前提は一つの定義、すなわち「最高の権威」という語句の定義である。さて、ある語句を定義するとは、同じ考えを表し、よりよく理解されていると見なす別の語句に言い換えることである。ここでの前提は、読者が「法を作る権力」の意味はすでに自分でかなりよく知っていたが、「最高の権威」の意味はまるで知らないか、少なくともあまり知らなかった、ということである。そう考えて、後の言葉をはっきり理解してもらうために、先の言葉と同義だと教える。ここで、それを持つ人にも触れよう。「人」という語を定義に加える。多少詳しく正確に言い表すだけで、実質は同じ定義である。ある人が最高の権威を持つとは、その人が法を作る権力を持つことである。前提には、実質的に、すでにそう述べられていたのである。",
      "translation_status": "reviewed"
    },

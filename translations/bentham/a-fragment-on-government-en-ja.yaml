      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n150/mode/1up",
          "source_sequence": 179,
          "printed_page": "135"
        }
      ],
      "source_text": "Original contract, its reality denied —",
      "translation_ja": "原初契約の実在は否定される",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch01-p007",
      "section_id": "bentham-ch01",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n150/mode/1up",
          "source_sequence": 180,
          "printed_page": "135",
          "printed_page_end": "136"
        }
      ],
      "source_text": "VII. 4thly, The original contract is a thing, we are to understand, that never had existence; perhaps not in any state: certainly therefore not in all. “Perhaps, in no instance,” says our Author, “has it ever been formally expressed at the first institution of a state.”",
      "translation_ja": "第七節　第四に、原初契約は一度も存在したことがないのだ、と受け取るように仕向けられる。おそらくどの国でも存在しなかった。とすれば、すべての国で存在したものでないことは確かである。「国を初めて設けたとき」と著者は言う。「この契約が正式に口にされた例は、一つもないかもしれない」。",
      "translation_status": "reviewed"
    },
    {

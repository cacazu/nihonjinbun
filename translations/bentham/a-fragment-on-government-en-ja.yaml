          "url": "https://archive.org/details/cu31924030442077/page/n202/mode/1up",
          "source_sequence": 388,
          "printed_page": "187"
        }
      ],
      "source_text": "VI. In the next place we are told in a parenthesis (it being a matter so plain as to be taken for granted) that “each of these branches of the Legislature is independent,” — yes, “entirely independent,” of the two others. — Is this then really the case? Those who consider the influence which the King and so many of the Lords have in the election of members of the House of Commons; the power which the King has, at a minute’s warning, of putting an end to the existence of any House of Commons; those who consider the influence which the King has over both Houses, by offices of dignity and profit given and taken away again at pleasure; those who consider that the King, on the other hand, depends for his daily bread on both Houses, but more particularly on the House of Commons; not to mention a variety of other circumstances that might be noticed in the same view, will judge what degree of precision there was in our Author’s meaning, when he so roundly asserted the affirmative.",
      "translation_ja": "第六節　次に、あまりに明らかで当然のことだとばかりに、括弧の中でこう教えられる。立法府の「これらの部門は、それぞれ」ほかの二つから「独立」している。そう、「完全に独立」しているという。では本当にそうか。王と多くの貴族が庶民院議員の選挙に持つ影響力を考えてみよう。王がいつの庶民院であれ、一分の予告で解散させられる権力も考えてみよう。名誉や収入をもたらす官職を思いのままに与えたり取り上げたりして、王は両院に影響を及ぼす。一方で、王は日々の糧を両院、とりわけ庶民院に依存している。同じ見方から指摘できるほかのさまざまな事情はさておき、これを考えれば、著者があれほどきっぱり独立を肯定したとき、どれほど正確な意味で言ったのか、判断できるだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch03-margin07",

          "url": "https://archive.org/details/cu31924030442077/page/n156/mode/1up",
          "source_sequence": 201,
          "printed_page": "141",
          "printed_page_end": "142"
        }
      ],
      "source_text": "XIV. A remark there is, which, for the more thoroughly clearing up of our notions on this subject, it may be proper here to make. To some ears, the phrases, “state of nature,” “state of political society,” may carry the appearance of being absolute in their signification: as if the condition of a man, or a company of men, in one of these states, or in the other, were a matter that depended altogether upon themselves. But this is not the case. To the expression “state of nature,” no more than to the expression “state of political society,” can any precise meaning be annexed, without reference to a party different from that one who is spoken of as being in the state in question. This will readily be perceived. The difference between the two states lies, as we have observed, in the habit of obedience. With respect then to a habit of obedience, it can neither be understood as subsisting in any person, nor as not subsisting in any person, but with reference to some other person. For one party to obey, there must be another party that is obeyed. But this party who is obeyed, may at different times be different. Hence may one and the same party be conceived to obey and not to obey at the same time, so as it be with respect to different persons, or as we may say, to different objects of obedience. Hence it is, then, that one and the same party may be said to be in a state of nature, and not to be in a state of nature, and that at one and the same time, according as it is this or that party that is taken for the other object of comparison. The case is, that in common speech, when no particular object of comparison is specified, all persons in general are intended: so that when a number of persons are said simply to be in a state of nature, what is understood is, that they are so as well with reference to one another, as to all the world.",
      "translation_ja": "第十四節　この問題をさらによく理解するため、一つ指摘しておこう。「自然状態」「政治社会の状態」という言葉は、人によっては、意味がそれだけで決まるように聞こえるかもしれない。ある人や集団がどちらの状態にあるかは、その人や集団だけで決まるかのように。しかしそうではない。「自然状態」にも「政治社会の状態」にも、その状態にあると言われる当事者とは別の当事者を考えなければ、正確な意味を与えられない。これはすぐ分かる。述べたとおり、二つの状態を分けるのは服従の習慣である。ある人に服従の習慣があるともないとも、別の人との関係なしには考えられない。一方が従うには、従われる他方がいなければならないからだ。ところが従われる側は、時によって違いうる。そこで、服従の相手が違えば、同じ当事者が同じ時に服従しており、また服従していない、と考えられる。だから、比較の相手をどちらに取るかによって、同じ当事者が同じ時に自然状態にあり、また自然状態にはないと言うことができる。日常の言葉では、比較相手が特に示されないときには、一般にあらゆる人が念頭にある。したがって何人かが単に自然状態にあると言えば、互いの間でも、世の中のほかのすべての人に対しても、自然状態にあると受け取られる。",
      "translation_status": "reviewed"
    },

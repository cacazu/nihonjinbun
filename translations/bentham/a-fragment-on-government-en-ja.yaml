          "url": "https://archive.org/details/cu31924030442077/page/n225/mode/1up",
          "source_sequence": 485,
          "printed_page": "210"
        }
      ],
      "source_text": "Cause of it.",
      "translation_ja": "動揺の理由",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-p015",
      "section_id": "bentham-ch04",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n225/mode/1up",
          "source_sequence": 486,
          "printed_page": "210"
        }
      ],
      "source_text": "XV. A courage much stauncher than our Author’s might have wavered here. A task of no less intricacy was here to be travelled through, than that of adjusting the claims of those two jealous antagonists, Liberty and Government. A more invidious ground is scarcely to be found any where within the field of politics. Enemies encompass the traveller on every side. He can scarce stir but he must expect to be assaulted with the war-whoop of political heresy from one quarter or another. Difficult enough is the situation of him, who, in these defiles, feels himself impelled one way by fear, and another by affection.",
      "translation_ja": "第十五節　著者よりはるかに気の強い者でも、ここではひるんだかもしれない。ここで通り抜けねばならない道は、自由と政府という、互いに譲らぬ二人の敵がそれぞれ掲げる要求を調整するという、このうえなく入り組んだ仕事である。政治という広野のどこを探しても、これ以上に人の不興を買う場所はまずない。旅人は敵に四方を囲まれている。動くか動かないかのうちに、どこかから政治上の異端だという雄たけびを浴びせられるものと思わなくてはならない。この隘路で、一方には恐れに、他方には愛着に押される人は、確かに難しい境遇にある。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch04-margin16",
      "section_id": "bentham-ch04",

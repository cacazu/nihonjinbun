          "source_sequence": 153,
          "printed_page": "130"
        }
      ],
      "source_text": "VII. No very explicit mention here, we may observe, of the manner in which governments have been established, or of the different forms they assume when established: no very explicit intimation that these were among the topics to be discussed. None at all of the duty of government to make laws; none at all of the British constitution; though, of the four other topics we have mentioned, there is no one on which he has been near so copious as on this last. The right of Government to make laws, that delicate and invidious topic, as we shall find it when explained, is that which for the moment, seems to have swallowed up almost the whole of his attention.",
      "translation_ja": "第七節　ここでは、政府がどのように設けられたか、また設けられたときにどのような形をとるかは、さほど明らかに言及されていない。これらが論じる主題の中にあるとも、はっきりほのめかされてはいない。政府が法を作る義務にもまったく言及がない。イギリスの国制についても、まったくない。しかも、実際には、先に挙げたほかの四つの主題のいずれと比べても、この最後の主題について、著者ははるかに多くを述べている。どうやら、このとき著者の注意をほとんど丸ごとのみ込んでいたのは、政府が法を作る権利らしい。説明を読めば分かるように、扱いが難しく、人の不興を招きかねない主題である。",
      "translation_status": "reviewed"
    },

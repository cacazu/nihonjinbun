      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n249/mode/1up",
          "source_sequence": 569,
          "printed_page": "234",
          "printed_page_end": "236"
        }
      ],
      "source_text": "VII. I understand, I think, pretty well, what is meant by the word duty (political duty) when applied to myself; and I could not persuade myself, I think, to apply it in the same sense in a regular didactic discourse to those whom I am speaking of as my supreme governors. That is my duty to do, which I am liable to be punished, according to law, if I do not do: this is the original, ordinary, and proper sense of the word duty. Have these supreme governors any such duty? No: for if they are at all liable to punishment according to law, whether it be for not doing any thing, or for doing, then are they not, what they are supposed to be, supreme governors: those are the supreme governors, by whose appointment the former are liable to be punished.",
      "translation_ja": "第七節　義務、すなわち政治上の義務という語を自分に当てはめるときに、その語が何を意味するかは、かなりよく分かっていると思う。一方、筋道を立てて教える文章で、自分を治める最高の統治者と呼んでいる人々に、同じ意味でその語を当てはめる気には、どうしてもなれまい。しなければ法に従って罰を受けうることをする。それが私の義務である。これが義務という語のもともとの、ふつうの、厳密な意味である。では、最高の統治者たちにはそのような義務があるか。ない。彼らが何かをしなかったためであれ、したためであれ、法に従って少しでも罰を受けうるなら、そもそもその人たちは、そうだと見なされている最高の統治者ではないからである。彼らを罰しうると定める側の人々こそ、最高の統治者である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-ch05-note121",
      "section_id": "bentham-ch05",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n249/mode/1up",
          "source_sequence": 570,
          "printed_page": "234",
          "printed_page_end": "236"
        }
      ],
      "source_text": "1. Duties, three sorts. One may conceive three sorts of duties; political, moral, and religious; correspondent to the three sorts of sanctions by which they are enforced: or the same point of conduct may be a man’s duty on these three several accounts. After speaking of the one of these to put the change upon the reader, and without warning begin speaking of another, or not to let it be seen from the first which of them one is speaking of, cannot but be productive of confusion.\n2. Political duty. Political duty is created by punishment: or at least by the will of persons who have punishment in their hands; persons stated and certain, — political superiors.\n3. Religious duty. Religious duty is also created by punishment: by punishment expected at the hands of a person certain, — the Supreme Being.\n4. Moral duty — the proper sense of it. Moral duty is created by a kind of motive, which from the uncertainty of the persons to apply it, and of the species and degree in which it will be applied, has hardly yet got the name of punishment: by various mortifications resulting from the ill-will of persons uncertain and variable, — the community in general: that is, such individuals of that community as he, whose duty is in question, shall happen to be connected with.\n5. Difference between these senses and a fourth which is figurative and improper. When in any of these three senses a man asserts a point of conduct to be a duty, what he asserts is the existence, actual or probable, of an external event: viz. of a punishment issuing from one or other of these sources in consequence of a contravention of the duty; an event extrinsic to, and distinct from, as well the conduct of the party spoken of, as the sentiment of him who speaks. If he persists in asserting it to be a duty, but without meaning it should be understood that it is on any one of these three accounts that he looks upon it as such; all he then asserts is his own internal sentiment: all he means then is, that he feels himself pleased or displeased at the thoughts of the point of conduct in question, but without being able to tell why. In this case he should e’en say so: and not seek to give an undue influence to his own single suffrage, by delivering it in terms that purport to declare the voice either of God, or of the law, or of the people.\n6. Duty not applicable here in any proper sense. Now which of all these senses of the word our Author had in mind; in which of them all he meant to assert that it was the duty of supreme governors to make laws, I know not. Political duty is what they cannot be subject to: and to say that a duty even of the moral or religious kind to this effect is incumbent on them, seems rather a precipitate assertion.\nIn truth what he meant was neither more nor less, I suppose, than that he should be glad to see them do what he is speaking of; to wit, “make laws:” that is, as he explains himself, spread abroad the knowledge of them. Would he so? So indeed should I; and if asked why, what answer our Author would give I know not; but I, for my part, have no difficulty. I answer, — because I am persuaded that it is for the benefit of the community that they (its governors) should do so. This would be enough to warrant me in my own opinion for saying that they ought to do it. For all this, I should not at any rate say that it was their duty in a political sense. No more should I venture to say it was in a moral or religious sense, till I were satisfied whether they themselves thought the measures useful and feasible, and whether they were generally supposed to think so.\nWere I satisfied that they themselves thought so, God then, I might say, knows they do. God, we are to suppose, will punish them if they neglect pursuing it. It is then their religious duty. Were I satisfied that the people supposed they thought so; the people, I might say, in case of such neglect, — the people, by various manifestations of its ill-will, will also punish them. It is then their moral duty.\nIn any of these senses it must be observed, there can be no more propriety in averring it to be the duty of the supreme power to pursue the measure in question, than in averring it to be their duty to pursue any other supposable measure equally beneficial to the community. To usher in the proposal of a measure in this peremptory and assuming guise, may be pardonable in a loose rhetorical harangue, but can never be justifiable in an exact didactic composition. Modes of private moral conduct there are indeed many, the tendency whereof is so well known and so generally acknowledged, that the observance of them may well be styled a duty. But to apply the same term to the particular details of legislative conduct, especially newly proposed ones, is going, I think, too far, and tends only to confusion.",
      "translation_ja": "1．三種類の義務。義務を守らせる制裁が三種類あるのに応じて、政治上、道徳上、宗教上という三種類の義務を考えられる。また、同じ一つの行いが、この三つの別々の理由で、ある人の義務でありうる。その一つについて語った後、気づかれぬよう話をすり替え、前置きもなく別の義務について語り始めれば、混乱が生じざるをえない。最初から、どの義務の話か分からないようにしておけば、やはり同じである。\n2．政治上の義務。政治上の義務を作るのは罰である。少なくとも、罰を科す力を握る人々、つまり誰か明らかで特定できる政治上の上位者の意志である。\n3．宗教上の義務。宗教上の義務も罰が作る。ある特定の方、すなわち至高の存在から受けると予想される罰である。\n4．道徳上の義務、その厳密な意味。道徳上の義務を作るのは、ある種の動機である。その動機を与える者も、どんな種類で、どれほど強く与えられるかも定まらないので、まだほとんど罰とさえ呼ばれていない。誰か決まっておらず、そのつど変わる人々、つまり共同体一般の悪意から生じる、さまざまなつらい思いである。ここで共同体と言うのは、義務を問われている人がたまたま関わりを持つ、その共同体の個々人である。\n5．この三つの意味と、比喩的で本来の用法でない第四の意味の違い。三つのどの意味にせよ、人がある行いを義務と断言するとき、断言しているのは、ある外的な出来事が実際に起きるか、起きる見込みがあることだ。すなわち、義務に反したために、これらの源のどれかから罰が生じるということである。これは、語られている人が何をしたかとも、語っている人がどう感じるかとも別の、外部の出来事である。それでも義務だと断言しながら、そう考える根拠がこの三つのうちのどれかにある、という意味ではないなら、断言しているのは内心の感情だけである。当の行いを考えて、快く思うか不快に思うかだが、どうしてかは語れない。それならいっそ、そう言えばよい。神の声、法の声、人民の声を宣言するかのような言葉で、自分一人の賛否に、不当な影響力を持たせようとするべきではない。\n6．ここで「義務」は、どの本来の意味でも当てはまらない。さて著者は、これらのどの意味を念頭に置き、どの意味で、法を作るのは最高の統治者の義務だと断言したつもりなのか。私には分からない。政治上の義務を最高の統治者が負うことはありえない。道徳上あるいは宗教上の義務だとしてさえ、その義務が彼らに課せられると言うのは、いささか早まった断言に見える。\n実際には、著者が話していることを、彼らがしてくれればうれしいというだけだろう。つまりは「法を作る」こと、著者自身の説明では、法の知識を広く行き渡らせることだ。著者はそう思うのか。それなら私もそう思う。なぜかと聞かれたら、著者の答えは分からないが、私の方は何も難しくない。統治者がそうするのは共同体の利益になると確信しているからだ、と答える。それで、彼らはそうするべきだと言うには、私自身の考えでは十分である。それでも私は、どんな場合にも、政治上の意味でそれが彼らの義務だとは言わない。道徳上、あるいは宗教上の意味でも、彼ら自身がその措置を有益で実行できると考えているか、一般にも彼らがそう考えると思われているかを、確かめるまではあえて言わない。\n彼ら自身がそう考えていると確かめられたなら、神は彼らがそう考えていることをご存じだと言えるだろう。それを実行せずに怠れば、神は彼らを罰すると考えられる。そこで、宗教上の義務である。人民が、統治者はそう考えていると思っていると確かめたなら、彼らが怠ったとき、人民もさまざまな形で悪意を表して罰するだろう、と言える。そこで、道徳上の義務である。\nこれらのどの意味であっても、当の措置を実行するのが最高権力の義務だと言い切ることには、共同体に同じだけ利益をもたらすほかのどんな措置を実行するのも彼らの義務だと言い切ること以上に、妥当性がないことに注意すべきである。ある措置の提案を、このように断定的で思い上がった姿で持ち出すのは、論理のゆるい演説では許されても、正確に物事を教える文章では決して正当化できない。個人の道徳的な行動には、どういう結果につながるかがよく知られ、広く認められているので、それを守るのを義務と呼んでよいものも、確かに多い。しかし立法の仕事の個々の細部、とくに新たに提案されたものにまで同じ用語を使うのは、行きすぎであり、混乱を招くだけだと思う。",
      "translation_status": "reviewed"
    },

      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p061",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n135/mode/1up",
          "source_sequence": 111,
          "printed_page": "120"
        }
      ],
      "source_text": "The synopsis of such an arrangement would at once be a compendium of expository and of censorial Jurisprudence: nor would it serve more effectually to instruct the subject, than it would to justify or reprove the Legislator.",
      "translation_ja": "このような分類の見取り図は、解説としての法学と、批評としての法学を、ひとまとめにした要覧になる。臣民を教えるのにも役立つし、それに劣らず、立法者を正当と認め、または戒めるのにも役立つだろう。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p062",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n135/mode/1up",
          "source_sequence": 112,
          "printed_page": "120",
          "printed_page_end": "121"
        }
      ],
      "source_text": "Such a synopsis, in short, would be at once a map, and that an universal one, of Jurisprudence as it is, and a slight but comprehensive sketch of what it ought to be. For, the reasons of the several institutions comprised under it would stand expressed, we see, and that uniformly (as in our Author’s synopsis they do in scattered instances) by the names given to the several classes under which those institutions are comprised. And what reasons? Not technical reasons, such as none but a Lawyer gives, nor any but a Lawyer would put up with; but reasons, such as were they in themselves what they might and ought to be, and expressed too in the manner they might and ought to be, any man might see the force of as well as he.",
      "translation_ja": "要するに、こうした見取り図は、今ある法学を表す地図、それもどこまでも通用する地図であると同時に、法学のあるべき姿を大まかに、しかし余すところなく描いた素描にもなる。そこに収められる一つひとつの制度の理由は、見てのとおり、その制度を収めた種類につけた名前によって示されるからである。著者の見取り図でも、とびとびにはそうなっているが、ここではすべて同じ方法で示される。では、どんな理由か。法律家だけが挙げ、法律家しか我慢して聞けない専門上の理由ではない。理由そのものが、なりうる、またあるべきものになり、しかるべく言い表されれば、誰でも、法律家と同じように、その説得力が分かるような理由である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note38",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "grc"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n135/mode/1up",
          "source_sequence": 113,
          "printed_page": "120",
          "printed_page_end": "121"
        }
      ],
      "source_text": "Technical reasons; so called from the Greek τέχνη, which signifies an art, science, or profession. Utility is that standard to which men in general (except in here and there an instance where they are deterred by prejudices of the religious class, or hurried away by the force of what is called sentiment or feeling). Utility, as we have said, is the standard to which they refer a Law or institution in judging of its title to approbation, or disapprobation. Men of Law, corrupted by interests, or seduced by illusions, which it is not here our business to display, have deviated from it much more frequently, and with much less reserve. Hence it is that such reasons as pass with Lawyers, and with no one else, have got the name of technical reasons; reasons peculiar to the art, peculiar to the profession.",
      "translation_ja": "「専門上の」（technical）という名はギリシア語のテクネーに由来し、技術、学問、職業を意味する。有用性は、一般に人々の拠り所となる規準である。ただ、宗教上の偏見に妨げられたり、情緒や感情と呼ばれるものの力に流されたりする、まれな場合を除く。すでに述べたように、法律や制度が、是認に値するか、非難に値するかを判断するとき、人々は有用性をその尺度とする。法律家は、利害に腐らされ、あるいは思い込みに惑わされて、この尺度からはるかに頻繁に、しかもはるかにためらいなく外れてきた。ただし、その思い込みをここで明らかにすることは、私たちの仕事ではない。このため、法律家には通用してほかの人には通用しない理由は、「専門上の理由」と名づけられた。技術に固有な理由、その職業に固有な理由ということである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p063",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n136/mode/1up",
          "source_sequence": 114,
          "printed_page": "121"
        }
      ],
      "source_text": "Nor in this is there any thing that need surprise us. The consequences of any Law, or of any act which is made the object of a Law, the only consequences that men are at all interested in, what are they but pain and pleasure? By some such words then as pain and pleasure, they may be expressed: and pain and pleasure at least, are words which a man has no need, we may hope, to go to a Lawyer to know the meaning of. In the synopsis then of that sort of arrangement which alone deserves the name of a natural one, terms such as these, terms which if they can be said to belong to any science, belong rather to Ethics than to Jurisprudence, even than to universal Jurisprudence, will engross the most commanding stations.",
      "translation_ja": "これに何も驚くことはない。ある法律の結果、あるいは法律の対象とされた行為の結果のうち、人が関心を持つのは何だろうか。苦痛と快楽のほかにない。ならば「苦痛」や「快楽」のような言葉で言い表せるはずである。少なくとも「苦痛」と「快楽」が何を意味するかを知るのに、法律家のところへ聞きにいく必要はないと、考えてよいだろう。したがって、自然な分類と呼ぶに値する唯一の仕方で作られた見取り図では、このような言葉が、最も重要な位置を占める。もし何かの学問に属すると言えるなら、法学はもとより、普遍的な法学よりも、むしろ倫理学に属する言葉である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note39",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n136/mode/1up",
          "source_sequence": 115,
          "printed_page": "121"
        }
      ],
      "source_text": "The reason of a Law, in short, is no other than the good produced by the mode of conduct which it enjoins, or (which comes to the same thing) the mischief produced by the mode of conduct which it prohibits. This mischief or this good, if they be real, cannot but shew themselves somewhere or other in the shape of pain or pleasure.",
      "translation_ja": "要するに、法の理由は、それが命じる行いが生む益か、それと同じことだが、それが禁じる行いが生む害にほかならない。その害や益が現実にあるなら、どこかで必ず、苦痛または快楽のかたちをとって現れる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p064",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n136/mode/1up",
          "source_sequence": 116,
          "printed_page": "121",
          "printed_page_end": "122"
        }
      ],
      "source_text": "What then is to be done with those names of classes that are purely technical?—With offences, for example, against prerogative, with misprisions, contempts, felonies, praemunires? What relation is it that these mark out between the Laws that concern the sorts of acts they are respectively put to signify, and that common end we have been speaking of? Not any. In a natural arrangement what then would become of them? They would either be banished at once to the region of quiddities and substantial forms; or if, and in deference to attachments too inveterate to be all at once dissolved, they were still to be indulged a place, they would be stationed in the corners and bye-places of the Synopsis: stationed, not as now to give light, but to receive it. But more of this, perhaps, at some future time.",
      "translation_ja": "では、まったく専門用語にすぎない分類名はどうすればいいか。たとえば、大権への違反、重大犯罪の不告発、侮辱、重罪、プレムナイアなどである。これらの名で呼ばれるいろいろな行為に関する法律と、先ほどから述べてきた共通の目的との間に、こうした名前はどんな関係を明らかにするだろう。何一つ明らかにしない。では、自然な分類のもとでこれらの名前はどうなるのか。ただちに、物の本質だとか実体形相だとかいう空疎な概念の国に追放される。根が深く、いっぺんには断てない愛着に配慮して、なお置き場を許すとしても、置かれるのは見取り図のすみや目立たぬ片隅だ。いまのように他を照らすためではなく、自らが照らされるために、そこに置かれるのである。この話は、いずれまた詳しく述べることがあるかもしれない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note40",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n136/mode/1up",
          "source_sequence": 117,
          "printed_page": "121"
        }
      ],
      "source_text": "See in the Synoptical Table prefixed to our Author’s Analysis, the last page comprehending Book IV.",
      "translation_ja": "著者の『分析』の巻頭にある一覧表のうち、第4巻についての最後の頁を参照。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-margin10",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 118,
          "printed_page": "122"
        }
      ],
      "source_text": "Merits of the work resumed.",
      "translation_ja": "再び著作の長所について",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p065",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 119,
          "printed_page": "122"
        }
      ],
      "source_text": "To return to our Author, Embarrassed, as a man must needs be, by this blind and intractable nomenclature, he will be found, I conceive, to have done as much as could reasonably be expected of a writer so circumstanced; and more and better than was ever done before by any one.",
      "translation_ja": "著者に戻ろう。これほど分かりにくく扱いにくい専門用語の体系に縛られては、誰であっても困らざるをえない。同じ境遇の書き手に望んで不当でないことは、著者は十分に果たしたと思う。それどころか、誰もそれまで成し遂げたことがないほど多くを、そして誰よりもうまくやったのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p066",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 120,
          "printed_page": "122"
        }
      ],
      "source_text": "In one part, particularly, of his Synopsis, several fragments of a sort of method which is, or at least comes near to, what may be termed a natural one, are actually to be found. We there read of ‘corporal injuries;’ of ‘offences against peace;’ against ‘health;’ against ‘personal security’; ‘liberty:’—‘property:’—light is let in, though irregularly, at various places.",
      "translation_ja": "実際、特にその見取り図のある部分には、自然な方法と呼べるもの、少なくともそれに近い型の方法が、断片ながら幾つか見つかる。そこには「身体への加害」、「平穏に対する違反」、「健康」、「身の安全」、「自由」、「財産」に対する違反が挙げられている。光の入り方はまちまちでも、あちこちに光が差し込んでいる。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note41",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 121,
          "printed_page": "122"
        }
      ],
      "source_text": "It is that which comprises his IVth Book, entitled Public Wrongs.",
      "translation_ja": "「公に対する不正」と題された、著者の第4巻を含むところである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note42",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 122,
          "printed_page": "122"
        }
      ],
      "source_text": "Fragmenta methodi naturalis.—Linnæi Phil. Bot. Tit. Systemata, par. 77.",
      "translation_ja": "自然な方法の断片。リンネ『植物哲学』「分類体系」の項、第77節。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note43",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en",
        "la"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 123,
          "printed_page": "122"
        }
      ],
      "source_text": "This title affords a pertinent instance to exemplify the use that a natural arrangement may be of in repelling an incompetent institution. What I mean is the sort of filthiness that is termed unnatural. This our Author has ranked in his class of Offences against ‘personal security’ and, in a subdivision of it, intitled ‘Corporal injuries.’ In so doing, then, he has asserted a fact: he has asserted that the offence in question is an offence against personal security; is a corporal injury; is, in short, productive of unhappiness in that way. Now this is what, in the case where the act is committed by consent, is manifestly not true. Volenti non fit injuria. If then the Law against the offence in question had no other title to a place in the system than what was founded on this fact, it is plain it would have none. It would be a bad Law altogether. The mischief the offence is of to the community in this case is in truth of quite another nature, and would come under quite another class. When against consent, there indeed it does belong really to this class: but then it would come under another name. It would come under that of Rape.",
      "translation_ja": "この分類名は、自然な分類がふさわしくない制度を退けるのに、どう役に立ちうるかを示す、格好の例である。私が言うのは、「自然に反する」と称される種類のみだらな行為である。著者はこれを「身の安全」への違反とし、その下位にある「身体への加害」に置いた。そうすることで著者は、ある事実を主張したのである。この違反は身の安全に対する違反であって、身体への加害であり、要するに、それによって不幸を生むと主張したわけだ。しかし、当人の同意に基づいて行われる場合、それは明らかに事実ではない。同意する者に不法は成り立たない。そこで、この違反を禁じる法律に、その事実を根拠とする以外、体系の中に置かれるべき理由がないなら、そのような理由は何もないことになる。まったく悪い法律なのである。この場合、行為が共同体にもたらす害は、実はまるで性質の違うもので、まるで別の類に入るだろう。同意に反した場合には、たしかに、この類に実際に属する。ただし、そのときには、別の名前の下に入る。強姦という名である。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p067",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n137/mode/1up",
          "source_sequence": 124,
          "printed_page": "122",
          "printed_page_end": "123"
        }
      ],
      "source_text": "In an unequal imitation of this Synopsis that has lately been performed upon what is called the Civil Law, all is technical. All, in short, is darkness. Scarce a syllable by which a man would be led to suspect, that the affair in hand were an affair that happiness or unhappiness was at all concerned in.",
      "translation_ja": "最近、いわゆるローマ法について、この見取り図にならった、しかし出来の悪いものが作られた。何もかも専門用語である。ひと言で言えば、何もかも真っ暗である。そこで扱っていることに、人の幸福か不幸かが少しでも関わっていると、人に思わせる言葉は、一言半句もほとんどない。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-note44",
      "section_id": "bentham-preface",
      "kind": "note_body",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n138/mode/1up",
          "source_sequence": 125,
          "printed_page": "123"
        }
      ],
      "source_text": "I think it is Selden, somewhere in his Table-talk, that speaks of a whimsical notion he had hit upon when a school-boy, that with regard to Cæsar and Justin, and those other personages of antiquity that gave him so much trouble, there was not a syllable of truth in any thing they said, nor in fact were there ever really any such persons; but that the whole affair was a contrivance of parents to find employment for their children. Much the same sort of notion is that which these technical arrangements are calculated to give us of Jurisprudence: which in them stands represented rather as a game at Crambo for Lawyers to whet their wits at, than as that Science which holds in her hand the happiness of nations. Let us, however, do no man wrong. Where the success has been worse, the difficulty was greater. That detestable chaos of institutions which the Analyst last-mentioned had to do with is still more embarrassed with a technical nomenclature than our own.",
      "translation_ja": "確かセルデンだったと思うが、『談話録』のどこかで、少年のころ思いついた妙な考えを語っている。カエサルやユスティヌスをはじめ、これほど頭を悩ませた古代の人物たちの言葉には、一言も真実がない。そもそもそんな人物は実在せず、親が子に何かさせておこうと考え出した、まるごとの作り話なのだ、という考えである。この種の専門的な分類が法学について抱かせるのも、よく似た考えである。そこに描かれているのは、諸国民の幸福をその手に握る学問というより、法律家が頭を研ぎ澄ますためにやる、韻を当てる言葉遊びでしかない。もっとも、誰にも不当なことはしたくない。成功が少なかったところでは、その分だけ困難が大きかった。先ほどの分析者が扱わなければならなかった、あのいまわしい制度の混沌は、わが国のものよりもっと、専門用語の体系に足を取られるのである。",
      "translation_status": "reviewed"
    },
    {
      "id": "bentham-preface-p068",
      "section_id": "bentham-preface",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "bentham-montague-1891",
          "precision": "page",
          "url": "https://archive.org/details/cu31924030442077/page/n138/mode/1up",
          "source_sequence": 126,
          "printed_page": "123"
        }
      ],
      "source_text": "To return, once more, to our Author’s Commentaries. Not even in a censorial view would I be understood to deem them altogether without merit. For the institutions commented on, where they are capable of good reasons, good reasons are every now and then given: in which way, so far as it goes, one-half of the Censor’s task is well accomplished. Nor is the dark side of the picture left absolutely untouched. Under the head of ‘Trial by Jury,’ are some very just and interesting remarks on the yet-remaining imperfections of that mode of trial: and under that of ‘Assurances by matter of Record,’ on the lying and extortious jargon of Recoveries. So little, however, are these particular remarks of a piece with the general disposition, that shews itself so strongly throughout the work, indeed so plainly adverse to the general maxims that we have seen, that I can scarce bring myself to attribute them to our Author. Not only disorder is announced by them, but remedies, well-imagined remedies, are pointed out. One would think some Angel had been sowing wheat among our Author’s tares.",
      "translation_ja": "もう一度、著者の『釈義』へ戻ろう。批評という面から見ても、この著作には長所がまったくないと思っているわけではない。解説の対象となる制度に、もっともな理由があるときには、時おりその理由をきちんと挙げている。そのかぎりで、批評者の仕事の半分を立派に果たしている。また、絵の暗い方の面にも、いっさい触れずにいたわけではない。「陪審による裁判」の項には、その裁判方法になお残る不備について、たいへん適切で興味深い所見がいくつかある。「公的記録を用いる権原の確保」の項にも、土地回復訴訟の、嘘とゆすりの専門語についての所見がある。だが、個々のこうした所見は、著作全体に強く現れている普段の姿勢と、あまりに食い違っている。見てきた一般原則に、はっきり逆らってさえいる。だから、これが本当に同じ著者の所見なのかとまで思う。それらは不都合を指摘するだけでなく、対策を、それもよく考えられた対策を示しているのだ。何かの天使が、著者の毒麦の間に小麦をまいていったのではないかと思うほどである。",
      "translation_status": "reviewed"
    },
    {

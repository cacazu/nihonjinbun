    "translation_ja": |-
      太上老君は、ふと考えた。
      太上老君は心中でつぶやいた。「あの猿は油断がならぬ。行けと言われて、すんなり行くとは。こっそり舞い戻って盗む気ではないか。」
      そこで仙童に呼び戻させ、悟空に言った。
      太上老君「お前は手癖の悪い猿だからな。この還魂丹（かんこんたん）を一粒やろう。」
      悟空「老君さま、俺のやり口を知っているなら、早く金丹（きんたん）を出して、四対六に分けようじゃないか。それでも、あんたには幸運というものだ。そうでなければ、皮のざるを見舞うぞ。ひとすくいで残らずさらってやる。」
      太上老君は瓢箪を取り、底を上へ向け、一粒の金丹を振り出して、悟空に渡した。
      太上老君「これしかない。持っていけ、持っていけ。この一粒をやるから、あの皇帝を生き返らせよ。手柄はお前だけのものにしてよい。」
      悟空は受け取った。
      悟空「まあ待ってくれ。ちょっと味を確かめよう。偽物をつかまされちゃ困るからな。」
      ひょいと口の中へ放り込むと、太上老君は慌てて進み寄り、悟空を引き留め、頭のてっぺんをむんずとつかんだ。拳を握り、罵った。
      太上老君「このろくでなしの猿め。飲み込んだら、打ち殺すぞ！」
      悟空は笑った。
      悟空「何だい、その顔は。けちくさいねえ。誰があんたの丹を食うものか。いくらの値打ちがあるっていうんだ。大げさに言うほど大したものでもあるまい。ほら、ここにあるじゃないか。」
      実は悟空には顎の下に袋があり、金丹をそこへ含んでいた。太上老君は悟空をつかんだまま言った。
      太上老君「行け、行け。もうここへ来て、まとわりつくでない。」
      悟空はようやく太上老君に礼を述べ、兜率宮を出た。

  - "id": "xy-ch39-002"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說那孫大聖頭痛難禁，哀告道：「師父莫念，莫念，等我醫罷。」長老問：「怎麼醫？」行者道：「只除過陰司，查勘那個閻王家有他魂靈，請將來救他。」八戒道：「師父莫信他。他原說不用過陰司，陽世間就能醫活，方見手段哩。」那長老信邪風，又念緊箍兒咒。慌得行者滿口招承道：「陽世間醫罷，陽世間醫罷。」八戒道：「莫要住，只管念，只管念。」行者罵道：「你這獃孽畜，攛道師父咒我哩。」八戒笑得打跌道：「哥耶，哥耶，你只曉得捉弄我，不曉得我也捉弄你捉弄。」行者道：「師父莫念，莫念，待老孫陽世間醫罷。」三藏道：「陽世間怎麼醫？」行者道：「我如今一觔斗雲，撞入南天門裡，不進斗牛宮，不入靈霄殿，徑到那三十三天之上，離恨天宮兜率院內，見太上老君，把他九轉還魂丹求得一粒來，管取救活他也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 117
        "line_end": 117
    "translation_ja": |-
      さて、悟空（ごくう）は頭の痛みに耐えかね、哀願した。
      悟空「お師匠さま、唱えないで、もう唱えないでください。私が治してみますから。」
      三蔵（さんぞう）「どうやって治すのだ。」
      悟空「冥界へ行き、どの閻王（えんおう）のところに魂がいるか調べ、その魂を迎えてきて助けるしかありません。」
      八戒（はっかい）「お師匠さま、信じちゃいけませんよ。さっきは冥界へ行かず、この世で生き返らせてこそ腕の見せどころだと言ったんですから。」
      三蔵はよからぬ入れ知恵を信じ、また緊箍児呪（きんこじじゅ）を唱えた。慌てた悟空は、口をついて承知の言葉を繰り返した。
      悟空「この世で治します。この世で治しますから！」
      八戒「やめないでください。どんどん唱えて、どんどん唱えて！」
      悟空は罵った。
      悟空「この間抜けの畜生め。お師匠さまをけしかけて俺を苦しめる気だな！」
      八戒は笑い転げた。
      八戒「兄貴、兄貴。俺をからかうことばかり考えて、俺だって兄貴をからかえるとは思わなかったろう。」
      悟空「お師匠さま、唱えないで、もう唱えないでください。この世で治してみますから。」
      三蔵「この世で、どう治すのだ。」
      悟空「今から筋斗雲（きんとうん）でひと飛びし、南天門（なんてんもん）へ飛び込みます。斗牛宮（とぎゅうきゅう）にも霊霄殿（れいしょうでん）にも寄らず、まっすぐ三十三天（さんじゅうさんてん）の上、離恨天（りこんてん）の兜率院（とそついん）へ行き、太上老君（たいじょうろうくん）にお会いして、九転還魂丹（きゅうてんかんこんたん）を一粒いただいてきます。それで必ず生き返らせてみせます。」
    "translation_status": "draft"
  - "id": "xy-ch39-003"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，大喜道：「就去，快來。」行者道：「如今有三更時候罷了，投到回來，好天明了。只是這個人睡在這裡，冷淡冷淡，不像個模樣。須得舉哀人看著他哭，便才好哩。」八戒道：「不消講，這猴子一定是要我哭哩。」行者道：「怕你不哭？你若不哭，我也醫不成。」八戒道：「哥哥，你自去，我自哭罷了。」行者道：「哭有幾樣：若乾著口喊，謂之嚎；扭搜出些眼淚兒來，謂之啕；又要哭得有眼淚，又要哭得有心腸，才算著嚎啕痛哭哩。」八戒道：「我且哭個樣子你看看。」他不知那裡扯個紙條，撚作一個紙撚兒，往鼻孔裡通了兩通，打了幾個涕噴，你看他眼淚汪汪，黏涎答答的，哭將起來。口裡不住的絮絮叨叨，數黃道黑，真個像死了人的一般。哭到那傷情之處，唐長老也淚滴心酸。行者笑道：「正是那樣哀痛，再不許住聲。你這獃子哄得我去了，你就不哭。我還聽哩，若是這等哭便罷，若略住住聲兒，定打二十個孤拐。」八戒笑道：「你去，你去。我這一哭動頭，有兩日哭哩。」沙僧見他數落，便去尋幾枝香來燒獻。行者笑道：「好好好，一家兒都有些敬意，老孫才好用功。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      それを聞いた三蔵は、大いに喜んだ。
      三蔵「すぐに行って、早く戻っておいで。」
      悟空「今はもう三更（さんこう）ごろでしょう。帰るころには、ちょうど夜が明けます。ただ、この方をここに寝かせたまま、ひっそりさせておくのは格好がつきません。誰かがそばについて、声を上げて泣いてやらなければ。」
      八戒「言わなくても分かる。この猿め、きっと俺に泣かせるつもりだ。」
      悟空「泣かずに済むと思うか。お前が泣かないなら、俺にも治せないぞ。」
      八戒「兄貴は行ってくれ。俺はここで泣くからさ。」
      悟空「泣くにもいろいろある。ただ口を開けて叫ぶだけなら『嚎（ごう）』、無理に涙を絞り出すのが『啕（とう）』。涙が流れ、心もこもっていてこそ、『嚎啕痛哭（ごうとうつうこく）』というんだ。」
      八戒「じゃあ、ひとつ泣いてみるから見てくれよ。」
      八戒はどこからか紙切れを引っぱり出し、こよりにして鼻の穴へ二度ほど差し込み、何度かくしゃみをした。すると、目には涙があふれ、鼻水をだらだら流しながら泣き始めた。口ではあれこれと途切れなく繰り言を並べ、まるで本当に身内を亡くしたようだった。悲しみのこもるところにさしかかると、三蔵まで胸を痛め、涙を落とした。
      悟空は笑った。
      悟空「そうだ、その調子で悲しむんだ。もう声を止めるなよ。この間抜けめ、俺をうまく行かせたら、泣くのをやめる気だろう。俺はまだ聞いているからな。その調子で泣くならよし、少しでも声を止めたら、必ず足首を二十回打ってやる。」
      八戒も笑った。
      八戒「行けよ、行けよ。いったん泣き出したら、俺は二日だって泣き続けるさ。」
      沙悟浄（さごじょう）は八戒が嘆き立てるのを見て、線香を何本か探してきて、火をつけて供えた。
      悟空は笑った。
      悟空「よし、よし、よし。こうして皆がいくらか心を尽くしてくれれば、俺も力を入れて働ける。」
    "translation_status": "draft"

    "source_text": "三藏甚不過意，攙起那皇帝來，同入禪堂。又與八戒、行者、沙僧拜見了，方才按座。只見那本寺的僧人整頓了早齋，卻欲來奉獻，忽見那個水衣皇帝，個個驚張，人人疑說。孫行者跳出來道：「那和尚不要這等驚疑。這本是烏雞國王，乃汝之真主也。三年前被怪害了性命，是老孫今夜救活。如今進他城去，要辨明邪正。若有了齋，擺將來，等我們吃了走路。」眾僧即奉獻湯水，與他洗了面，換了衣服。把那皇帝赭黃袍脫了，本寺僧官將兩領布直裰與他穿了；解下藍田帶，將一條黃絲絛子與他繫了；褪下無憂履，與他一雙舊僧鞋撒了。卻才都吃了早齋，扣背馬匹。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      三蔵はひどく恐縮し、国王を助け起こして、ともに禅堂へ入った。国王は八戒、悟空、沙悟浄にも挨拶を済ませ、ようやく席に着いた。寺の僧たちは朝の食事を整え、差し上げようとやって来たが、水に浸かっていた衣を着た国王を突然見て、皆が驚き、口々に不審がった。悟空は飛び出して言った。
      悟空「和尚たち、そんなに驚いたり、疑ったりするな。この方はもともと烏鶏国王（うけいこくおう）で、お前たちの本当の主君だ。三年前に妖怪に命を奪われたのを、俺が今夜、生き返らせた。これから都へ入って、正邪を明らかにする。食事ができているなら並べてくれ。食べたら出発するぞ。」
      僧たちはすぐ湯を差し出し、国王の顔を洗い、着替えさせた。国王の赭黄色（しゃこうしょく）の袍（ほう）を脱がせると、寺の僧官（そうかん）が二枚の布の直裰（ちょくたつ）を着せた。藍田（らんでん）の玉を飾った帯を解き、黄色の絹の組紐を締めさせた。無憂履（むゆうり）を脱がせ、古い僧の靴を一足履かせた。それから皆で朝の食事を取り、馬に鞍をつけた。
    "translation_status": "draft"
  - "id": "xy-ch39-009"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者問：「八戒，你行李有多重？」八戒道：「哥哥，這行李日逐挑著，倒也不知有多重。」行者道：「你把那一擔兒分為兩擔：將一擔兒你挑著，將一擔兒與這皇帝挑。我們趕早進城幹事。」八戒歡喜道：「造化，造化。當時馱他來，不知費了多少力；如今醫活了，原來是個替身。」那獃子就弄玄虛，將行李分開，就問寺中取條匾擔，輕些的自己挑了，重些的教那皇帝挑著。行者笑道：「陛下，著你那般打扮，挑著擔子，跟我們走走，可虧你麼？」那國王慌忙跪下道：「師父，你是我重生父母一般，莫說挑擔，情願執鞭墜鐙，伏侍老爺，同行上西天去也。」行者道：「不要你去西天，我內中有個緣故。你只挑得四十里進城，待捉了妖精，你還做你的皇帝，我們還取我們的經也。」八戒聽言道：「這等說，他只挑四十里路，我老豬還是長工。」行者道：「兄弟，不要胡說，趁早外邊引路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      悟空「八戒、荷物はどのくらい重いんだ。」
      八戒「兄貴、毎日担いでいるけど、重さまでは知らないよ。」
      悟空「一荷を二荷に分けろ。片方をお前が担ぎ、もう片方はこの皇帝に担いでもらう。早く都へ入って、仕事を片づけよう。」
      八戒は喜んだ。
      八戒「ありがたい、ありがたい。あの人を背負ってきたときは、どれほど骨が折れたか分からない。生き返らせたら、俺の代わりになる人だったとはね。」
      そこで八戒はこっそり細工をして荷物を分け、寺から天秤棒を借り、軽い方を自分が担いで、重い方を国王に担がせた。
      悟空は笑った。
      悟空「陛下、そんな格好で荷を担ぎ、私たちと歩いていただくのは、お気に障りますか。」
      国王は慌ててひざまずいた。
      国王「お師匠さまは、私をもう一度この世に生んでくださった父母も同然です。荷を担ぐどころか、鞭を持ち、鐙を支えてお仕えし、ともに西天まで参るのも、喜んでいたします。」
      悟空「西天まで来ていただくには及びません。こうするには、訳があるのです。四十里だけ荷を担ぎ、都へ入ってください。妖怪を捕らえたら、あなたはまた皇帝に戻り、私たちはまた経を取りに行きます。」
      それを聞いて八戒が言った。
      八戒「それじゃ、あの人が担ぐのは四十里だけで、俺はやっぱり年季奉公か。」
      悟空「兄弟、つべこべ言うな。早く外へ出て、道案内をしろ。」
    "translation_status": "draft"
  - "id": "xy-ch39-010"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "真個八戒領那皇帝前行，沙僧伏侍師父上馬，行者隨後。只見那本寺五百僧人齊齊整整，吹打著細樂，都送出山門之外。行者笑道：「和尚們不必遠送，但恐官家有人知覺，泄漏我的事機，反為不美。快回去，快回去。但把那皇帝的衣服冠帶，整頓乾淨，或是今晚明早，送進城來，我討些封贈賞賜謝你。」眾僧依命各回訖。行者放開大步，趕上師父，一直前來。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      こうして八戒が国王を先導し、沙悟浄が師を馬に乗せ、悟空が後に続いた。寺の五百人の僧は整然と並び、笛や打楽器で雅やかな音楽を奏でながら、山門の外まで一行を見送った。
      悟空は笑った。
      悟空「和尚たち、遠くまで送らなくていい。役所の誰かに気づかれて、こちらの計画が漏れでもしたら、かえって具合が悪い。早く戻れ、早く戻れ。ただ、皇帝の衣服、冠、帯をきれいに整え、今夜か明朝に都へ届けてくれ。褒賞や下賜の品をいただいて、お前たちへの礼にしよう。」
      僧たちは言いつけに従い、それぞれ寺へ戻った。悟空は大股で歩いて師に追いつき、そのまま先へ進んだ。まさに、こういうことである。
    "translation_status": "draft"
  - "id": "xy-ch39-011"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      西方有訣好尋真，金木和同卻煉神。
      丹母空懷懞懂夢，嬰兒長恨杌樗身。
      必須井底求明主，還要天堂拜老君。
      悟得色空還本性，誠為佛度有緣人。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 127
        "line_end": 130
    "translation_ja": |-
      西方には真理を求める秘訣があり、金木（きんぼく）が和合して精神を練る。
      丹母（たんぼ）は、わけも分からぬ夢をむなしく抱き、嬰児（えいじ）は、役に立たぬ木のような身をいつまでも恨む。
      井戸の底に賢明な主君を求め、さらに天上へ行って老君を拝まねばならぬ。
      色も空であると悟り、本来の性に帰れば、まことに仏は縁のある人を救うのだ。
    "translation_status": "draft"
  - "id": "xy-ch39-012"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們在路上，那消半日，早望見城池相近。三藏道：「悟空，前面想是烏雞國了。」行者道：「正是，我們快趕進城幹事。」那師徒進得城來，只見街市上人物齊整，風光鬧熱。早又見鳳閣龍樓，十分壯麗。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      師弟が道を進むうち、半日もたたぬ間に、もう都が近くに見えてきた。
      三蔵「悟空、あれが烏鶏国の都だろうね。」
      悟空「そのとおりです。早く都へ入り、仕事を片づけましょう。」
      都へ入ると、通りには人も品物も整い、にぎやかな景色が広がっていた。やがて鳳閣（ほうかく）、竜楼（りゅうろう）と呼ぶにふさわしい宮殿の楼閣が見え、その壮麗さはこの上ない。これを詠んだ詩がある。
    "translation_status": "draft"
  - "id": "xy-ch39-013"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      海外宮樓如上邦，人間歌舞若前唐。
      花迎寶扇紅雲繞，日照鮮袍翠霧光。
      孔雀屏開香靄出，珍珠簾捲彩旗張。
      太平景像真堪賀，靜列多官沒奏章。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 134
        "line_end": 137
    "translation_ja": |-
      海の彼方の宮殿は大国にも劣らず、世の歌舞は、昔の唐（とう）さながら。
      花は宝の扇を迎え、紅の雲が巡り、日は鮮やかな袍を照らし、翠の霧が輝く。
      孔雀の屏風が開けば香の霞が流れ、真珠の簾が巻き上がれば彩りの旗が広がる。
      天下泰平の景色は、まことに祝うべきもの。並ぶ役人たちも静かで、訴え出る上奏はない。
    "translation_status": "draft"
  - "id": "xy-ch39-014"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏下馬道：「徒弟啊，我們就此進朝倒換關文，省得又攏那個衙門費事。」行者道：「說得有理。我兄弟們都進去，人多才好說話。」唐僧道：「都進去，莫要撒村，先行了君臣禮，然後再講。」行者道：「行君臣禮，就要下拜哩。」三藏道：「正是，要行五拜三叩頭的大禮。」行者笑道：「師父不濟。若是對他行禮，誠為不智。你且讓我先走到裡邊，自有處置。等他若有言語，讓我對答。我若拜，你們也拜；我若蹲，你們也蹲。」你看那惹禍的猴王，引至朝門，與閣門大使言道：「我等是東土大唐駕下差來，上西天拜佛求經者。今到此倒換關文，煩大人轉達，是謂不誤善果。」那黃門官即入端門，跪下丹墀，啟奏道：「朝門外有五眾僧人，言是東土唐國欽差上西天拜佛求經，今至此倒換關文，不敢擅入，現在門外聽宣。」那魔王即令傳宣。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      三蔵は馬から下りた。
      三蔵「弟子たちよ、このまま朝廷へ行って通行文書の手続きを済ませよう。別に役所へ立ち寄る手間が省ける。」
      悟空「ごもっともです。私たち兄弟弟子も、皆で入りましょう。人数が多い方が話も通ります。」
      三蔵「皆で入るにしても、乱暴を働いてはならない。まず君臣の礼を尽くし、それから話をするのだ。」
      悟空「君臣の礼を尽くすとなると、ひざまずいて拝むことになりますよ。」
      三蔵「そのとおり。五拝三叩頭（ごはいさんこうとう）の大礼を行うのだ。」
      悟空は笑った。
      悟空「お師匠さまは困ったものですね。あの者に礼をするなど、まったく賢明ではありません。まず私を先に中へ行かせてください。考えがあります。相手が何か言ったら、私に答えさせてください。私が拝めば皆さんも拝み、私がしゃがめば皆さんもしゃがめばいいのです。」
      こうして、騒ぎの種となる悟空は皆を宮門まで案内し、閣門大使（かくもんたいし）に告げた。
      悟空「私どもは東土（とうど）の大唐（だいとう）皇帝に遣わされ、西天へ仏を拝み、経を求めに行く者です。ここで通行文書の手続きをいたしたく存じます。どうかお取り次ぎいただき、善い功徳を成就する道を妨げられませんように。」
      その門を守る役人はすぐ端門（たんもん）へ入り、朱塗りの階段の前にひざまずいて奏上した。
      門を守る役人「宮門の外に、五人の出家者が参っております。東土の唐国（とうこく）から勅命を受け、西天へ仏を拝み、経を求めに行く者と申します。今ここで通行文書の手続きを願っておりますが、勝手に入ることはせず、門外でお召しを待っております。」
      偽王はただちに、呼び入れるよう命じた。
    "translation_status": "draft"
  - "id": "xy-ch39-015"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧卻同入朝門裡面，那回生的國主隨行。正行，忍不住腮邊墮淚，心中暗道：「可憐！我的銅斗兒江山，鐵圍的社稷，誰知被他陰占了。」行者道：「陛下切莫傷感，恐走漏消息。這棍子在我耳朵裡跳哩，如今決要見功，管取打殺妖魔，掃蕩邪物。這江山不久就還歸你也。」那君王不敢違言，只得扯衣揩淚，捨死相從，徑來到金鑾殿下。又見那兩班文武，四百朝官，一個個威嚴端肅，相貌軒昂。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      三蔵たちは宮門へ入り、生き返った国王も一緒についていった。歩くうち、国王はこらえきれず、頬に涙を落とし、心の中で嘆いた。
      国王は心中でつぶやいた。「何ということだ。銅の升のように堅固なわが国土、鉄で囲ったように揺るぎないわが王朝を、あの者にひそかに奪われようとは。」
      悟空「陛下、どうかお嘆きにならないでください。こちらの事情が漏れてはいけません。私の棒が耳の中で跳ねています。今こそ必ず役に立つ時です。妖魔を打ち殺し、邪悪なものを払いのけてみせます。この国は、間もなくあなたの手へ戻りますよ。」
      国王はその言葉に背くことができず、衣を引いて涙を拭い、命を捨てる覚悟で従って、まっすぐ金鑾殿の下へ来た。見ると文官と武官が二列に並び、四百人の朝廷の役人が、一人一人、威厳に満ちた厳粛な顔つきで、堂々と控えていた。
    "translation_status": "draft"
  - "id": "xy-ch39-016"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者引唐僧站立在白玉階前，挺身不動。那階下眾官無不悚懼道：「這和尚十分愚濁，怎麼見我王便不下拜？亦不開言呼祝？喏也不唱一個？好大膽無禮。」說不了，只聽得那魔王開口問道：「那和尚是那方來的？」行者昂然答道：「我是南贍部洲東土大唐國奉欽差前往西域天竺國大雷音寺拜活佛求真經者。今到此方，不敢空度，特來倒換通關文牒。」那魔王聞說，心中作怒道：「你東土便怎麼？我不在你朝進貢，不與你國相通，你怎麼見吾抗禮，不行參拜？」行者笑道：「我東土古立天朝，久稱上國，汝等乃下土邊邦。自古道：『上邦皇帝，為父為君；下邦皇帝，為臣為子。』你倒未曾接我，且敢爭我不拜？」那魔王大怒，教文武官：「拿下這野和尚去！」說聲叫「拿」，你看那多官一齊踴躍。這行者喝了一聲，用手一指，教：「莫來！」那一指，就使個定身法，眾官俱莫能行動。真個是校尉階前如木偶，將軍殿上似泥人。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      悟空は三蔵を連れて白玉の階段の前に立ち、身をまっすぐにして動かなかった。階下の役人たちは、皆おそれ驚いて言った。
      役人たち「この和尚は、まったく物の分からぬ愚か者だ。わが王の前へ来て、なぜひざまずかない。お祝いの言葉も述べず、挨拶の声さえ上げないとは。何と大胆で無礼な！」
      言い終わらぬうちに、偽王が口を開いた。
      偽王「そこの和尚は、どの国から来たのだ。」
      悟空は堂々と答えた。
      悟空「私は南贍部洲（なんせんぶしゅう）、東土の大唐国（だいとうこく）から勅命を受け、西域（さいいき）の天竺国（てんじくこく）、大雷音寺（だいらいおんじ）へ行き、生きた仏を拝み、真の経を求める者です。この国へ来たからには、無断で通り過ぎるわけにはいかず、通行文書の手続きに参りました。」
      偽王はそれを聞き、腹を立てた。
      偽王「東土から来たからどうだというのだ。私はお前たちの朝廷に貢ぎ物を送ってもおらず、お前たちの国と交わりもない。それなのに、なぜ私と対等に構え、ひざまずいて拝礼しない。」
      悟空は笑った。
      悟空「わが東土は、古くから天朝を立て、長く上国と呼ばれてきた。お前たちは辺境の小国だ。昔から『上国の皇帝は父であり君主、下国の皇帝は臣下であり子』と言うだろう。そちらこそ俺を迎える礼もしていないくせに、俺が拝まないと責めるのか。」
      偽王は激怒し、文武の役人たちへ命じた。
      偽王「この無法な和尚を捕らえよ！」
      「捕らえよ」の一声で、役人たちはいっせいに飛び出した。悟空は一喝し、指を突きつけた。
      悟空「来るな！」
      その一指で定身法（ていしんほう）を使い、役人たちは誰も動けなくなった。まさしく、階段前の校尉（こうい）は木偶人形、殿上の将軍は泥人形のようだった。
    "translation_status": "draft"
  - "id": "xy-ch39-017"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那魔王見他定住了文武多官，急縱身，跳下龍床，就要來拿。猴王暗喜道：「好，正合老孫之意。這一來，就是個生鐵鑄的頭，湯著棍子，也打個窟窿。」正動身，不期傍邊轉出一個救命星來。你道是誰，原來是烏雞國王的太子，急上前扯住那魔王的朝服，跪在面前道：「父王息怒。」妖精問：「孩兒怎麼說？」太子道：「啟父王得知：三年前聞得人說，有個東土唐朝駕下欽差聖僧往西天拜佛求經，不期今日才來到我邦。父王尊性威烈，若將這和尚拿去斬首，只恐大唐有日得此消息，必生嗔怒。你想那李世民自稱王位，一統江山，心尚未足，又過海征伐；若知我王害了他御弟聖僧，一定興兵發馬，來與我王爭敵。奈何兵少將微，那時悔之晚矣。父王依兒所奏，且把那四個和尚，問他個來歷分明，先定他一段不參王駕，然後方可問罪。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      偽王は文武の役人たちが動きを止められたのを見ると、さっと身を躍らせて玉座から飛び下り、自ら捕らえようとした。悟空はひそかに喜んだ。
      悟空は心中でつぶやいた。「よし、俺の思うつぼだ。こうして来るなら、鋳鉄でできた頭だって、棒に触れれば穴を開けてやる。」
      今まさに動こうとしたところへ、思いがけず脇から偽王の命を救う者が出てきた。それは誰か。ほかでもない、烏鶏国王の太子（たいし）だった。太子は急いで進み、偽王の朝服をつかみ、その前にひざまずいた。
      太子「父上、お怒りをお鎮めください。」
      偽王「子よ、何を申す。」
      太子「父上に申し上げます。三年前、東土の唐の皇帝が遣わした聖僧が、西天へ仏を拝み、経を求めに行くと聞きました。思いがけず今日、わが国まで来たのでございます。父上のご気性は勇猛で厳しくあられますが、この和尚を捕らえて首を斬れば、いつか大唐に知らせが届いたとき、必ず怒りを招きましょう。あの李世民（りせいみん）は王位について国を統一したあとも、心が満ち足りず、さらに海を渡って征伐しております。皇弟である聖僧をわが王が殺したと知れば、きっと兵を起こし、軍馬を繰り出して、戦いを挑んできます。こちらは兵も少なく、将も手薄です。そのとき悔やんでも、遅うございます。どうか私の申し上げることをお聞きになり、あの四人の和尚に来歴を詳しく問い、まず王に拝謁の礼をしなかった事実を確かめてから、罪を問われませ。」
    "translation_status": "draft"
  - "id": "xy-ch39-018"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這一篇，原來是太子小心，恐怕來傷了唐僧，故意留住妖魔，更不知行者安排著要打。那魔王果信其言，立在龍床前面，大喝一聲道：「那和尚是幾時離了東土？唐王因甚事著你求經？」行者昂然而答道：「我師父乃唐王御弟，號曰三藏。因唐王駕下有一丞相，姓魏名徵，奉天條夢斬涇河老龍。大唐王夢遊陰司地府，復得回生之後，大開水陸道場，普度冤魂孽鬼。因我師父敷演經文，廣運慈悲，忽得南海觀世音菩薩指教來西。我師父大發弘願，情忻意美，報國盡忠，蒙唐王賜與文牒。那時正是大唐貞觀十三年九月望前三日，離了東土。前至兩界山，收了我做大徒弟，姓孫，名悟空行者；又到烏斯國界高家莊，收了二徒弟，姓豬，名悟能八戒；流沙河界，又收了三徒弟，姓沙，名悟淨和尚；前日在敕建寶林寺，又新收個挑擔的行童道人。」魔王聞說，又沒法搜檢那唐僧，弄巧語盤詰行者，怒目問道：「那和尚，你起初時，一個人離東土，又收了四眾，那三僧可讓，這一道難容。那行童斷然是拐來的。他叫做甚麼名字？有度牒是無度牒？拿他上來取供。」諕得那皇帝戰戰兢兢道：「師父啊！我卻怎的供？」孫行者捻他一把道：「你休怕，等我替你供。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      この一席は、太子が用心し、三蔵が傷つけられるのを恐れて、わざと妖魔を引き止めたものだった。悟空が打ちかかる段取りをしていたとは、まるで知らなかったのである。偽王は果たしてその言葉を信じ、玉座の前に立って、大声で問いただした。
      偽王「その和尚は、いつ東土を発ったのだ。唐王（とうおう）は何のために、お前を経を求めに遣わした。」
      悟空は堂々と答えた。
      悟空「私の師は唐王の皇弟で、号を三蔵と申します。唐王に仕える宰相に、姓は魏（ぎ）、名は徴（ちょう）という者がおり、天の掟に従い、夢の中で涇河（けいが）の老竜を斬りました。大唐の王は夢で冥界を巡り、生き返ったあと、水陸の法会を大々的に催して、恨みを抱く亡魂や罪に苦しむ鬼たちを、広く救済しました。その折、師が経文を説き、あまねく慈悲を施していたところ、南海（なんかい）の観世音菩薩（かんぜおんぼさつ）から、西へ向かうよう教えを授かったのです。師は大きな誓願を立て、心から喜び、国に報いて忠義を尽くそうと、唐王から通行文書を賜りました。東土を発ったのは、大唐の貞観（じょうがん）十三年九月、十五日の三日前です。やがて両界山（りょうかいざん）で私を一番弟子に迎えました。姓は孫（そん）、名は悟空、行者（ぎょうじゃ）と申します。次に烏斯国（うしこく）の領内、高家荘（こうかそう）で二番弟子を迎えました。姓は猪（ちょ）、名は悟能（ごのう）、八戒と申します。流沙河（りゅうさが）の境では、三番弟子を迎えました。姓は沙（さ）、名は悟浄（ごじょう）、和尚です。先日、勅建宝林寺（ちょくけんほうりんじ）で、さらに荷を担ぐ行童（ぎょうどう）の道人（どうじん）を一人、新たに弟子にいたしました。」
      偽王は聞いても、三蔵を詮議する手がかりをつかめず、巧みに言葉をめぐらして悟空を問い詰め、目を怒らせて言った。
      偽王「和尚よ、お前は初め一人で東土を発ち、あとから四人を迎えたのだな。その三人の僧は見逃せても、この一人の道士は許せぬ。その行童は、きっとかどわかしてきた者だ。名を何という。度牒（どちょう）はあるのか、ないのか。ここへ連れてきて、申し立てをさせよ。」
      国王は恐ろしさに、ぶるぶる震えた。
      国王「お師匠さま、私は何と申し立てればよいのでしょう。」
      悟空は国王をひとつつねった。
      悟空「怖がらなくていい。私が代わりに申し立てます。」
    "translation_status": "draft"
  - "id": "xy-ch39-019"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，趨步上前，對怪物厲聲高叫道：「陛下，這老道是一個瘖啞之人，卻又有些耳聾。只因他年幼間曾走過西天，認得道路。他的一節兒起落根本，我盡知之，望陛下寬恕，待我替他供罷。」魔王道：「趁早實實的替他供來，免得取罪。」行者道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      さすがは悟空。足早に進み出ると、妖怪に向かい、声を厳しく張り上げた。
      悟空「陛下、この年寄りの道士は口がきけず、少し耳も遠いのです。ただ、若いころに西天へ行ったことがあり、道を覚えております。この者の身の上と来歴は、私がすべて存じています。どうかお許しをいただき、この者に代わり、私に申し立てをさせてください。」
      偽王「罪を受けたくなければ、さっさと、本当のことを代わりに申し立てよ。」
      悟空は語った。
    "translation_status": "draft"
  - "id": "xy-ch39-020"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「供罪行童年且邁，痴聾瘖啞家私壞。
      祖居原是此間人，五載之前遭破敗。
      天無雨，民乾壞，君王黎庶都齋戒。
      焚香沐浴告天公，萬里全無雲靉靆。
      百姓饑荒若倒懸，鍾南忽降全真怪。
      呼風喚雨顯神通，然後暗將他命害。
      推下花園天井中，陰侵龍位人難解。
      幸吾來，功果大，起死回生無罣礙。
      情願皈依作行童，與僧同去朝西界。
      假變君王是道人，道人轉是真王代。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 146
        "line_end": 155
    "translation_ja": |-
      悟空「罪の申し立てをするこの行童は、すでに年老い、愚かで耳も聞こえず口もきけず、家財を失った者。
      もとは代々、この国に住んでいたが、五年前に災難に遭った。
      天から雨は降らず、民は日照りに苦しみ、王も庶民も斎戒（さいかい）した。
      香をたき、身を清めて天に祈っても、万里の空に雲は一つも湧かぬ。
      飢饉に遭った民は逆さづりのように苦しみ、そこへ鍾南山（しょうなんざん）から、突然、全真（ぜんしん）の道士姿の妖怪が降りてきた。
      風を呼び雨を降らせ、神通力を現してから、ひそかにこの者の命を奪った。
      庭の井戸へ突き落とし、ひそかに王位を横取りしたが、人々には分からなかった。
      幸い私が来たので、大きな功徳を立て、滞りなく死者を生き返らせた。
      この者は喜んで帰依し、行童となって、僧とともに西方へお参りに行くという。
      国王に化けているのは道士、道士となっているのは、本当の王なのだ。」
    "translation_status": "draft"
  - "id": "xy-ch39-021"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那魔王在金鑾殿上聞得這一篇言語，諕得他心頭撞小鹿，面上起紅雲。急抽身就要走路，奈何手內無一兵器。轉回頭，只見一個鎮殿將軍，腰挎一口寶刀，被行者使了定身法，如痴如啞，立在那裡。他近前，奪了這寶刀，就駕雲頭望空而去。氣得沙和尚爆躁如雷，豬八戒高聲喊叫，埋怨行者是一個急猴子：「你就慢說些兒，卻不穩住他了？如今他駕雲逃走，卻往何處追尋？」行者笑道：「兄弟們且莫亂嚷。我等叫那太子下來拜父，嬪后出來拜夫，」卻又念個咒語，解了定身法，「教那多官甦醒回來拜君，方知是真實皇帝。教訴前情，才見分曉，我再去尋他。」好大聖，吩咐八戒、沙僧：「好生保護他君臣、父子、嬪后，與我師父。」只聽說聲去，就不見形影。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      偽王は金鑾殿でこの言葉を聞くと、胸の中で小鹿が跳ねるように動悸がして、顔に赤い雲が差した。さっと身を引き、逃げ出そうとしたが、手には何一つ武器がない。振り向くと、殿を守る将軍が一人、宝刀を腰に下げたまま、悟空の定身法にかかり、何も分からず口もきけないように立っていた。偽王は近寄ってその刀を奪い、雲に乗って空へ去った。沙悟浄は雷のように激しく怒り、八戒は声を張り上げて、悟空のせっかちさを責めた。
      八戒「もう少しゆっくり話せば、あいつを留めておけただろう。雲に乗って逃げちまったじゃないか。どこへ追いかけて探しに行くんだ。」
      悟空は笑った。
      悟空「弟たち、騒ぐな。まず太子を下りてこさせて父親を拝ませ、皇后や妃たちを呼んで夫を拝ませよう。」
      そこでまた呪文を唱え、定身法を解いた。
      悟空「役人たちにも正気に戻って主君を拝んでもらえば、本当の皇帝だと分かる。これまでの事情を話してもらい、はっきりさせてから、俺があいつを探しに行く。」
      さすがは悟空。八戒と沙悟浄に言いつけた。
      悟空「こちらの君臣、父子、皇后や妃たち、それにお師匠さまを、しっかりお守りしろ。」
      行くぞ、という声が聞こえるや、もう姿は見えなくなった。
    "translation_status": "draft"
  - "id": "xy-ch39-022"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他原來跳在九霄雲裡，睜眼四望，看那魔王哩。只見那畜果逃了性命，徑往東北上走哩。行者趕得將近，喝道：「那怪物，那裡去？老孫來了也。」那魔王急回頭，掣出寶刀，高叫道：「孫行者，你好憊懶。我來占別人的帝位，與你無干，你怎麼來抱不平，泄漏我的機密？」行者呵呵笑道：「我把你這個大膽的潑怪！皇帝又許你做？你既知我是老孫，就該遠遁，怎麼還刁難我師父，要取甚麼供狀？適才那供狀是也不是？你不要走，是好漢吃我老孫這一棒。」那魔側身躲過，掣寶刀劈面相還。他兩個搭上手，這一場好殺，真是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      悟空は高空の雲へ飛び上がり、目を開いて四方を見渡し、偽王を探していた。あの畜生は命を拾い、まっすぐ北東へ逃げている。悟空は近くまで追いつき、怒鳴った。
      悟空「妖怪め、どこへ行く。俺が来たぞ！」
      偽王は急いで振り返り、宝刀を抜いて、大声で言った。
      偽王「孫行者（そんぎょうじゃ）、何と厄介なやつだ。他人の帝位を奪ったからといって、お前には関係あるまい。なぜ他人のために腹を立て、私の秘密を暴くのだ。」
      悟空はからからと笑った。
      悟空「この大胆不敵な悪党め。皇帝になるのを、誰が許した。俺だと知ったら、遠くへ逃げておけばよかったんだ。それなのに、お師匠さまに難癖をつけ、供述だの何だのを求めやがって。さっきの申し立ては、当たっていたか、いなかったか。逃げるな。男なら、この俺の一棒を受けてみろ！」
      偽王は身をひねってかわし、宝刀で面を狙って斬り返した。二人が打ち合いを始めると、見事な戦いとなった。まさしく、こうである。
    "translation_status": "draft"
  - "id": "xy-ch39-023"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      猴王猛，魔王強，刀迎棒架敢相當。
      一天雲霧迷三界，只為當朝立帝王。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 159
        "line_end": 160
    "translation_ja": |-
      悟空は猛々しく、偽王も強い。刀が迎え、棒が受け、恐れず渡り合う。
      空一面の雲と霧が三界（さんがい）を覆うのも、ただ、この国で誰を帝王に立てるか、そのためだ。
    "translation_status": "draft"
  - "id": "xy-ch39-024"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個戰經數合，那妖魔抵不住猴王，急回頭復從舊路跳入城裡，闖在白玉階前兩班文武叢中，搖身一變，即變得與唐三藏一般模樣，並攙手，立在階前。這大聖趕上，就欲舉棒來打。那怪道：「徒弟莫打，是我。」急掣棒要打那個唐僧，卻又道：「徒弟莫打，是我。」一樣兩個唐僧，實難辨認：「倘若一棒打殺妖怪變的唐僧，這個也成了功果；假若一棒打殺我的真實師父，卻怎麼好？」只得停手，叫八戒、沙僧問道：「果然那一個是怪，那一個是我的師父？你指與我，我好打他。」八戒道：「你在半空中相打相嚷，我瞥瞥眼就見兩個師父，也不知誰真誰假。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      何合か戦ううち、妖魔は悟空にかなわなくなった。急に向きを変え、来た道を引き返して都へ飛び込み、白玉の階段前に並ぶ文武の役人たちの中へ突っ込んだ。そして身を震わせると、三蔵そっくりの姿に変わり、本物と手を取り合って階段の前に立った。追いついた悟空は、すぐに棒を振り上げて打とうとした。
      偽王「弟子よ、打つでない。私だ。」
      そこで急いで棒を引き、もう一人の三蔵を打とうとすると、こちらも言った。
      もう一人の三蔵「弟子よ、打つでない。私だ。」
      まったく同じ三蔵が二人いて、どうにも見分けがつかない。
      悟空は心中で考えた。「妖怪の化けた三蔵を一棒で打ち殺せば、それで功徳も成就する。だが、もし本当のお師匠さまを打ち殺したら、どうすればいいんだ。」
      手を止めるほかなく、八戒と沙悟浄を呼んで尋ねた。
      悟空「いったいどちらが妖怪で、どちらが俺のお師匠さまなんだ。指してくれれば、俺が打つ。」
      八戒「兄貴が空で打ち合って怒鳴っているうちに、ちょっと目をやったら、もうお師匠さまが二人いたんだ。どちらが本物で、どちらが偽物か、俺にも分からないよ。」
    "translation_status": "draft"
  - "id": "xy-ch39-025"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，捻訣念聲咒語，叫那護法諸天、六丁六甲、五方揭諦、四值功曹、一十八位護駕伽藍、當坊土地、本境山神道：「老孫至此降妖，妖魔變作我師父，氣體相同，實難辨認。汝等暗中知會者，請師父上殿，讓我擒魔。」原來那妖怪善騰雲霧，聽得行者言語，急撒手跳上金鑾寶殿。這行者舉起棒望唐僧就打。可憐！若不是喚那幾位神來，這一下，就是二十個唐僧，也打為肉醬！多虧眾神架住鐵棒道：「大聖，那怪會騰雲，先上殿去了。」行者趕上殿，他又跳將下來扯住唐僧，在人叢裡又混了一混，依然難認。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      これを聞いた悟空は、指で印を結び、呪文を唱え、護法諸天（ごほうしょてん）、六丁六甲（ろくていろっこう）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、護衛する十八の伽藍神（がらんじん）、その土地の土地神（とちがみ）、そこを治める山神（さんじん）を呼び出して言った。
      悟空「俺はここへ妖怪を降しに来たが、妖魔がお師匠さまに化け、気配も体も同じなので、どうにも見分けられない。お前たちは、そっと本当のお師匠さまに知らせ、殿上へお連れしてくれ。そうすれば俺が妖魔を捕らえる。」
      ところが、その妖怪は雲や霧に乗るのが得意だった。悟空の言葉を聞くと、急いで手を放し、金鑾宝殿（きんらんほうでん）へ飛び上がった。悟空は棒を振り上げ、残った三蔵めがけて打ち下ろした。ああ、何ということか。あの神々を呼んでいなければ、この一撃で、三蔵が二十人いても肉のすり身にされていただろう。幸い神々が鉄棒を受け止めた。
      神々「大聖（たいせい）さま、あの妖怪は雲に乗れるので、先に殿上へ行ってしまいました。」
      悟空が殿上へ追うと、偽王はまた下へ飛び降り、三蔵をつかんで群衆の中で紛れ合ったので、やはり見分けがつかなかった。
    "translation_status": "draft"
  - "id": "xy-ch39-026"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者心中不快，又見那八戒在傍冷笑，行者大怒道：「你這夯貨怎的？如今有兩個師父，你有得叫，有得應，有得伏侍哩，你這般歡喜得緊！」八戒笑道：「哥啊，說我獃，你比我又獃哩。師父既不認得，何勞費力？你且忍些頭疼，叫我師父念念那話兒，我與沙僧各攙一個聽著。若不會念的，必是妖怪，有何難也？」行者道：「兄弟，虧你也。正是，那話兒只有三人記得。原是我佛如來心苗上所發，傳與觀世音菩薩，菩薩又傳與我師父，便再沒人知道。也罷，師父，念念。」真個那唐僧就念起來。那魔王怎麼知得，口裡胡哼亂哼。八戒道：「這哼的卻是妖怪了。」他放了手，舉鈀就築。那魔王縱身跳起，踏著雲頭便走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      悟空は苛立っていたが、八戒がそばで冷笑しているのを見て、かっと怒った。
      悟空「この間抜け、どういうつもりだ。今はお師匠さまが二人いるから、呼びがいも、返事のしがいも、お仕えしがいもあって、そんなにうれしいっていうのか！」
      八戒は笑った。
      八戒「兄貴、俺を間抜けと言うけど、兄貴は俺以上だよ。お師匠さまを見分けられないからって、何をそう苦労するんだ。少し頭痛を我慢して、お師匠さまに、あの言葉を唱えてもらえばいい。俺と沙悟浄が一人ずつつかまえて聞く。唱えられない方が、必ず妖怪だ。何も難しくないじゃないか。」
      悟空「兄弟、ありがたい。そうだ、あの言葉を知っているのは三人だけだ。もとは仏である如来（にょらい）の心から生まれ、観世音菩薩へ伝わり、菩薩からお師匠さまに授けられた。それ以外には誰も知らない。よし、お師匠さま、唱えてください。」
      本当の三蔵は、実際に唱え始めた。偽王が知っているはずもなく、口ででたらめに唸った。
      八戒「こっちで唸っているのが妖怪だ！」
      八戒は手を放し、熊手を振り上げて打ち込んだ。偽王は身を躍らせ、雲に乗って逃げた。
    "translation_status": "draft"
  - "id": "xy-ch39-027"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好八戒，喝一聲，也駕雲頭趕上。慌得那沙和尚丟了唐僧，也掣出寶杖來打。唐僧才停了咒語。孫大聖忍著頭疼，揝著鐵棒，趕在空中。呀！這一場，三個狠和尚，圍住一個潑妖魔。那魔王被八戒、沙僧使釘鈀、寶杖左右攻住了。行者笑道：「我要再去，當面打他，他卻有些怕我，只恐他又走了。等我老孫跳高些，與他個搗蒜打，結果了他罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      八戒もたいしたものだ。一喝し、自分も雲に乗って追いかけた。沙悟浄も慌てて三蔵の手を放し、宝杖を抜いて打ちかかった。そこで三蔵はようやく呪文を止めた。悟空は頭の痛みをこらえ、鉄棒を握り締めて、空へ追っていった。ああ、今度は三人の猛々しい和尚が、一人の荒くれ妖魔を取り囲む戦いだ。偽王は八戒の熊手と沙悟浄の宝杖に、左右から攻め立てられた。
      悟空は笑った。
      悟空「俺まで行って正面から打てば、あいつは俺を怖がっているから、また逃げるかもしれない。もっと高く飛び上がり、ニンニクをつくように上から打ち下ろして、片をつけてやろう。」
    "translation_status": "draft"
  - "id": "xy-ch39-028"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖縱祥光，起在九霄，正欲下個切手，只見那東北上，一朵彩雲裡面，厲聲叫道：「孫悟空，且休下手。」行者回頭看處，原來是文殊菩薩。急收棒，上前施禮道：「菩薩，那裡去？」文殊道：「我來替你收這個妖怪的。」行者謝道：「累煩了。」那菩薩袖中取出照妖鏡，照住了那怪的原身。行者才招呼八戒、沙僧齊來見了菩薩。卻將鏡子裡看處，那魔王生得好不兇惡："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      悟空は瑞光を放って高空へ昇り、とどめの一撃を下そうとした。そのとき、北東の彩雲の中から、厳しい声が響いた。
      雲の中の声「孫悟空（そんごくう）、ひとまず手を止めよ。」
      悟空が振り返ると、文殊菩薩（もんじゅぼさつ）だった。急いで棒を収め、前へ出て礼をした。
      悟空「菩薩さま、どちらへおいでですか。」
      文殊菩薩「お前に代わって、この妖怪を収めに来たのだ。」
      悟空は礼を述べた。
      悟空「お手数をおかけします。」
      文殊菩薩は袖から照妖鏡（しょうようきょう）を取り出し、妖怪の本来の姿を照らした。悟空は八戒と沙悟浄を呼び、そろって菩薩に挨拶をした。それから鏡の中を見ると、偽王の姿は、何とも凶悪なものだった。
    "translation_status": "draft"
  - "id": "xy-ch39-029"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": "眼似琉璃盞，頭若煉炒缸。渾身三伏靛，四爪九秋霜。搭拉兩個耳，一尾掃帚長。青毛生銳氣，紅眼放金光。匾牙排玉板，圓鬚挺硬槍。鏡裡觀真像，原是文殊一個獅猁王。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      目は瑠璃の杯に似て、頭は焼き上げた大甕のよう。
      全身は真夏の藍の色、四つの爪は晩秋の霜の白さ。
      二つの耳が垂れ下がり、一本の尾は箒ほども長い。
      青い毛には鋭い気が立ち、赤い目から金色の光が放たれる。
      平たい歯は玉の板を並べたようで、丸いひげは硬い槍のように突き出す。
      鏡に映る真の姿は、文殊菩薩の獅猁王（しりおう）だった。
    "translation_status": "draft"
  - "id": "xy-ch39-030"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「菩薩，這是你坐下的一個青毛獅子，卻怎麼走將來成精，你就不收服他？」菩薩道：「悟空，他不曾走，他是佛旨差來的。」行者道：「這畜類成精，侵奪帝位，還奉佛旨差來。似老孫保唐僧受苦，就該領幾道敕書。」菩薩道：「你不知道。當初這烏雞國王好善齋僧，佛差我來度他歸西，早證金身羅漢。因是不可原身相見，變做一種凡僧，問他化些齋供。被吾幾句言語相難，他不識我是個好人，把我一條繩綑了，送在那御水河中，浸了我三日三夜。多虧六甲金身救我歸西，奏與如來。如來將此怪令到此處推他下井，浸他三年，以報吾三日水災之恨。『一飲一啄，莫非前定。』今得汝等來此，成了功績。」行者道：「你雖報了甚麼『一飲一啄』的私仇，但那怪物不知害了多少人也。」菩薩道：「也不曾害人。自他到後，這三年間，風調雨順，國泰民安，何害人之有？」行者道：「固然如此，但只三宮娘娘與他同眠同起，點污了他的身體，壞了多少綱常倫理，還叫做不曾害人？」菩薩道：「點污他不得，他是個騸了的獅子。」八戒聞言，走近前，就摸了一把。笑道：「這妖精真個是糟鼻子不吃酒──枉擔其名了。」行者道：「既如此，收了去罷。若不是菩薩親來，決不饒他性命。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空「菩薩さま、これはあなたがお乗りになる青毛の獅子ではありませんか。どうしてここまで逃げ出し、妖怪となったのに、お収めにならなかったのです。」
      文殊菩薩「悟空、この獅子は逃げたのではない。仏の命令で遣わされたのだ。」
      悟空「この畜生は妖怪となって帝位を奪い、それでも仏の命令で遣わされたというのですか。私などは唐僧を守って苦労しているのですから、いくつも勅書をいただいてよいはずですね。」
      文殊菩薩「お前は事情を知らぬのだ。もともと烏鶏国王は善行を好み、僧に食事を施していた。仏は私を遣わし、王を西方へ導き、早く金身（こんじん）の羅漢（らかん）にならせようとなさった。本来の姿で会うわけにはいかないので、普通の僧に身を変え、施しの食事を求めた。私が二言三言、難しい問いを向けたところ、王は私が善意の者だと見抜けず、一本の縄で縛り、御水河（ぎょすいが）へ投げ込んで、三日三晩、水に浸けたのだ。幸い六甲（ろっこう）の金身に救われて西方へ帰り、如来に申し上げた。すると如来はこの獅子に命じ、ここへ来て王を井戸へ突き落とし、三年、水に浸けさせた。私が三日間、水に苦しんだ恨みに報いるためだ。『一飲一啄（いちいんいったく）、前もって定まっていないものはない。』今、お前たちがここへ来たことで、功績も成就した。」
      悟空「そうして『一飲一啄』とやらの個人的な恨みを晴らしたとしても、その妖怪が、どれほどの人を害したか分からないではありませんか。」
      文殊菩薩「人を害してもいない。この獅子が来てから三年間、風も雨も時にかない、国は穏やかで、民も安らかに暮らしていた。人を害したことがどこにある。」
      悟空「それはそうでしょう。けれども、三宮（さんぐう）の后妃たちとは寝起きをともにしたのです。その身を汚し、人の守るべき道をどれほど損なったことか。それでも人を害していないと言うのですか。」
      文殊菩薩「后妃たちを汚すことはできぬ。これは去勢した獅子なのだ。」
      それを聞いた八戒は近づき、股ぐらをひとなでした。そして笑った。
      八戒「こいつは本当に、赤鼻なのに酒を飲まないやつだ。濡れ衣の評判だけを背負ったんだな。」
      悟空「それなら、連れてお帰りください。菩薩さまがじきじきに来られなければ、決して命は助けませんでした。」
    "translation_status": "draft"
  - "id": "xy-ch39-031"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那菩薩卻念個咒，喝道：「畜生，還不皈正，更待何時！」那魔王才現了原身。菩薩放蓮花罩定妖魔，坐在背上，踏祥光辭了行者。咦！"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      文殊菩薩は呪文を唱え、一喝した。
      文殊菩薩「畜生め、まだ正道に戻らず、何を待っている！」
      そこで偽王はようやく本来の姿を現した。菩薩は蓮の花を放って妖魔を包み込み、その背に乗ると、瑞光を踏み、悟空に別れを告げた。ああ！
    "translation_status": "draft"
  - "id": "xy-ch39-032"
    "section_id": "chapter-39"
    "kind": "verse"
    "origin": "source"
    "source_text": "徑轉五臺山上去，寶蓮座下聽談經。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 173
        "line_end": 173
    "translation_ja": "まっすぐ五台山（ごだいさん）へ帰り、宝の蓮台の下で、経を説く声を聞く。"
    "translation_status": "draft"
  - "id": "xy-ch39-033"
    "section_id": "chapter-39"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知那唐僧師徒怎的出城，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 175
        "line_end": 175
    "translation_ja": "さて、三蔵師弟は、いったいどのように都を出たのだろうか。それは次回の物語でお聞きいただこう。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-001"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「丹砂」は、丹を作る材料である辰砂の名を用いて、この場面では生き返らせる丹薬を指す。鉱物をそのまま飲ませたという現代的な薬物説明には置き換えない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-002"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「四六分分」は四対六に分けるという持ちかけ。原文は、どちらが四でどちらが六かを明示しない。「皮笊籬」は目のない皮のざるにたとえ、残さずすくい取るという悟空の脅し。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-003"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「回到東觀」。南天門から下界の寺へ戻る途中の語だが、具体的な建物・地域の同定は確定できないため、原字を保つ。「東土」等へ校訂していない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-004"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「泥垣宮」を、そのままの字で保った。内丹の身体観で頭内の精神の居所をいう「泥丸宮」との異表記として扱う。重楼・明堂・丹田・湧泉を巡る気の道筋は物語と修行の身体観であり、現代解剖学の器官・医療処置と同一視しない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-005"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "内丹修行で金・木という二つの働きをいう象徴語。ここでは悟空と八戒の協力にも重なる。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-006"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「水衣」は青苔をいう語義もあるが、井戸から引き上げ、これから衣を替える場面により、水に浸かっていた衣を着た国王と解した。青苔が付着していたとは断定していない。語義参照：教育部《重編國語辭典修訂本》「水衣」 https://dict.revised.moe.edu.tw/dictView.jsp?ID=134532&la=0&powerMode=0"
    "translation_status": "draft"
  - "id": "xy-ch39-note-007"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "丹母・嬰児は内丹修行の象徴語。母と子の物語にも重なるが、特定人物との一対一の対応は断定しない。「杌樗」は役に立たぬ木をたとえとする。「空懷」を修行の完成と取り違えない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-008"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「前唐」は以前の唐をいう比較の詩語として訳した。物語が唐代を舞台とすることに合わせ、原字を別の王朝名へ改めてはいない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-009"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「烏斯國界高家莊」。前の回の烏斯蔵国・高老荘に対応する呼び方として扱い、ここでの略称と異表記を残した。貞観十三年九月「望前三日」は十五日の三日前として訳し、現代暦へ換算していない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-010"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "国王の殺害は三年前、ここでの五年前は日照りに始まる破綻を述べる。数字を三年へ統一しない。「鍾南」は底本の字を保ち、一般に知られる「終南」へ無断訂正しない。口や耳が不自由だという設定は悟空のその場の説明であり、国王の実際の障害を語り手が保証した記述ではない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-011"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "沙悟浄が怒る動作のあと、八戒が大声で叫び悟空を責める構文に従って、続く直接発話を八戒へ割り当てた。沙悟浄の直接発話を新たに創作していない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-012"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "初めの制止は原文が「那怪」と明示する妖怪、二度目は「那個唐僧」。訳では二人の姿が同じで、悟空が見分けられない順序を保った。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-013"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "呪文を知る三人は、如来・観世音菩薩・三蔵という伝授の列挙に従う。悟空を加えて四人に直したり、妖怪も知る設定を補ったりしない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-014"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「煉炒缸」は火で焼いた大きな甕と解したが、器具の厳密な形には留保がある。「三伏靛」「九秋霜」は盛夏の藍と晩秋の霜による色のたとえ。獅猁王の「猁」を、悟空の義兄弟の「獅狔王」へ改めたり同一人物とみなしたりしない。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-015"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "一口飲むことも一口食べることも、運命に定められているという言い方。ここでは文殊菩薩の説明として保持し、悟空が私怨だと反駁するやり取りも残す。国王への処罰、国政が平穏だったこと、人を害さなかったという主張は、菩薩の発話と語り手の地の文を区別する。"
    "translation_status": "draft"
  - "id": "xy-ch39-note-016"
    "section_id": "chapter-39-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「糟鼻子不吃酒──枉擔其名」は、酒飲みめいた赤鼻なのに酒を飲まず、名だけを負うという洒落。ここでは后妃たちを汚したという疑いを、去勢された獅子が実行できないという話に結びつける。原文の去勢と八戒の触って確かめる動作を省略していない。"
    "translation_status": "draft"

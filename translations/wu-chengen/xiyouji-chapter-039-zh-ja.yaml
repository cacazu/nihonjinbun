    "source_text": "老君忽的尋思道：「這猴子憊懶哩，說去就去，只怕溜進來就偷。」即命仙童叫回來道：「你這猴子，手腳不穩，我把這還魂丹送你一丸罷。」行者道：「老官兒，既然曉得老孫的手段，快把金丹拿出來，與我四六分分，還是你的造化哩；不然，就送你個皮笊籬──一撈個罄盡。」那老祖取過葫蘆來，倒吊過底子，傾出一粒金丹，遞與行者道：「止有此了，拿去，拿去。送你這一粒，醫活那皇帝，只算你的功果罷。」行者接了道：「且休忙，等我嘗嘗看，只怕是假的，莫被他哄了。」撲的往口裡一丟。慌得那老祖上前扯住，一把揪著頂瓜皮，揝著拳頭，罵道：「這潑猴若要咽下去，就直打殺了。」行者笑道：「嘴臉，小家子樣。那個吃你的哩？能值幾個錢？虛多實少的。在這裡不是？」原來那猴子頦下有嗉袋兒，他把那金丹噙在嗉袋裡，被老祖捻著道：「去罷，去罷，再休來此纏繞。」這大聖才謝了老祖，出離了兜率天宮。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"

  "excluded": []
  "known_gaps":
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-001"
      "description_ja": "回題の「丹砂」は、丹を作る材料である辰砂の名を用いて、この場面では生き返らせる丹薬を指す。鉱物をそのまま飲ませたという現代的な薬物説明には置き換えない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-006"
      "description_ja": "「四六分分」は四対六に分けるという持ちかけ。原文は、どちらが四でどちらが六かを明示しない。「皮笊籬」は目のない皮のざるにたとえ、残さずすくい取るという悟空の脅し。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-007"
      "description_ja": "底本は「回到東觀」。南天門から下界の寺へ戻る途中の語だが、具体的な建物・地域の同定は確定できないため、原字を保つ。「東土」等へ校訂していない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-007"
      "description_ja": "底本の「泥垣宮」を、そのままの字で保った。内丹の身体観で頭内の精神の居所をいう「泥丸宮」との異表記として扱う。重楼・明堂・丹田・湧泉を巡る気の道筋は物語と修行の身体観であり、現代解剖学の器官・医療処置と同一視しない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-011"
      "description_ja": "内丹修行で金・木という二つの働きをいう象徴語。ここでは悟空と八戒の協力にも重なる。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-008"
      "description_ja": "「水衣」は青苔をいう語義もあるが、井戸から引き上げ、これから衣を替える場面により、水に浸かっていた衣を着た国王と解した。青苔が付着していたとは断定していない。語義参照：教育部《重編國語辭典修訂本》「水衣」 https://dict.revised.moe.edu.tw/dictView.jsp?ID=134532&la=0&powerMode=0 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-011"
      "description_ja": "丹母・嬰児は内丹修行の象徴語。母と子の物語にも重なるが、特定人物との一対一の対応は断定しない。「杌樗」は役に立たぬ木をたとえとする。「空懷」を修行の完成と取り違えない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-013"
      "description_ja": "底本の「前唐」は以前の唐をいう比較の詩語として訳した。物語が唐代を舞台とすることに合わせ、原字を別の王朝名へ改めてはいない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-018"
      "description_ja": "底本は「烏斯國界高家莊」。前の回の烏斯蔵国・高老荘に対応する呼び方として扱い、ここでの略称と異表記を残した。貞観十三年九月「望前三日」は十五日の三日前として訳し、現代暦へ換算していない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-020"
      "description_ja": "国王の殺害は三年前、ここでの五年前は日照りに始まる破綻を述べる。数字を三年へ統一しない。「鍾南」は底本の字を保ち、一般に知られる「終南」へ無断訂正しない。口や耳が不自由だという設定は悟空のその場の説明であり、国王の実際の障害を語り手が保証した記述ではない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-021"
      "description_ja": "沙悟浄が怒る動作のあと、八戒が大声で叫び悟空を責める構文に従って、続く直接発話を八戒へ割り当てた。沙悟浄の直接発話を新たに創作していない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-024"
      "description_ja": "初めの制止は原文が「那怪」と明示する妖怪、二度目は「那個唐僧」。訳では二人の姿が同じで、悟空が見分けられない順序を保った。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-026"
      "description_ja": "呪文を知る三人は、如来・観世音菩薩・三蔵という伝授の列挙に従う。悟空を加えて四人に直したり、妖怪も知る設定を補ったりしない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-029"
      "description_ja": "底本の「煉炒缸」は火で焼いた大きな甕と解したが、器具の厳密な形には留保がある。「三伏靛」「九秋霜」は盛夏の藍と晩秋の霜による色のたとえ。獅猁王の「猁」を、悟空の義兄弟の「獅狔王」へ改めたり同一人物とみなしたりしない。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-030"
      "description_ja": "一口飲むことも一口食べることも、運命に定められているという言い方。ここでは文殊菩薩の説明として保持し、悟空が私怨だと反駁するやり取りも残す。国王への処罰、国政が平穏だったこと、人を害さなかったという主張は、菩薩の発話と語り手の地の文を区別する。 本文欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch39-1500596"
      "segment_ids":
        - "xy-ch39-030"
      "description_ja": "原文の「糟鼻子不吃酒──枉擔其名」は、酒飲みめいた赤鼻なのに酒を飲まず、名だけを負うという洒落。ここでは后妃たちを汚したという疑いを、去勢された獅子が実行できないという話に結びつける。原文の去勢と八戒の触って確かめる動作を省略していない。 本文欠落ではなく、解釈・校訂上の留保。"

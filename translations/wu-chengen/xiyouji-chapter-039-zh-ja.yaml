    "source_text": "老君道：「你不走路，潛入吾宮怎的？」行者道：「自別後，西遇一方，名烏雞國。那國王被一妖精假裝道士，呼風喚雨，陰害了國王，那妖假變國王相貌，現坐金鑾殿上。是我師父夜坐寶林寺看經，那國王鬼魂參拜我師，敦請老孫與他降妖，辨明邪正。正是老孫思無指實，與弟八戒夜入園中，打破花園，尋著埋藏之所，乃是一眼八角琉璃井內。撈上他的屍首，容顏不改。到寺中見了我師，他發慈悲，著老孫醫救，不許去赴陰司裡求索靈魂，只教在陽世間救治。我想著無處回生，特來參謁。萬望道祖垂憐，把九轉還魂丹借得一千丸兒，與我老孫，搭救他也。」老君道：「這猴子胡說，甚麼一千丸二千丸，當飯吃哩？是那裡土塊捘的，這等容易？咄！快去！沒有！」行者笑道：「百十丸兒也罷。」老君道：「也沒有。」行者道：「十來丸也罷。」老君怒道：「這潑猴卻也纏帳，沒有沒有，出去出去。」行者笑道：「真個沒有，我問別處去求罷。」老君喝道：「去去去！」這大聖拽轉步，往前就走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"

    "source_text": "好大聖，此時有半夜時分，別了他師徒三眾，縱觔斗雲，只入南天門裡。果然也不謁靈霄寶殿，不上那斗牛天宮，一路雲光，徑來到三十三天離恨天兜率宮中。才入門，只見那太上老君正坐在那丹房中，與眾仙童執芭蕉扇，搧火煉丹哩。他見行者來時，即吩咐看丹的童兒：「各要仔細，偷丹的賊又來也。」行者作禮笑道：「老官兒，這等沒搭撒，防備我怎的？我如今不幹那樣事了。」老君道：「你那猴子，五百年前大鬧天宮，把我靈丹偷吃無數，著小聖二郎捉拿上界，送在我丹爐煉了四十九日，炭也不知費了多少。你如今幸得脫身，皈依佛果，保唐僧往西天取經。前者在平頂山上降魔，弄刁難，不與我寶貝，今日又來做甚？」行者道：「前日事，老孫更沒稽遲，將你那五件寶貝當時交還，你反疑心怪我？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

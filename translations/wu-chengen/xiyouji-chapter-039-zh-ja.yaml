    "translation_ja": |-
      さすがは悟空。真夜中に、師と二人の弟弟子に別れを告げ、筋斗雲を飛ばして南天門へ入った。言ったとおり霊霄宝殿（れいしょうほうでん）へ挨拶にも行かず、斗牛宮にも上がらず、雲の光を一路進めて、まっすぐ三十三天の離恨天、兜率宮（とそつきゅう）へ来た。門を入ると、太上老君は丹を練る部屋に座り、仙童たちと芭蕉扇（ばしょうせん）を手に、火をあおいで丹を練っていた。悟空が来たのを見ると、すぐに丹の番をする童子たちへ言いつけた。
      太上老君「それぞれ、よく気をつけよ。丹を盗む賊がまた来たぞ。」
      悟空は礼をして笑った。
      悟空「老君（ろうくん）さま、つれないじゃないか。どうして俺を警戒するんだ。今はもう、あんなことはしないよ。」
      太上老君「この猿め。五百年前には天宮で大暴れし、私の霊丹（れいたん）を数えきれぬほど盗み食いした。二郎小聖（じろうしょうせい）に捕らえられて天上へ送られ、私の丹炉で四十九日も焼かれたではないか。炭をどれほど使ったか分からぬほどだ。今は幸いにして抜け出し、仏門に帰依して、唐僧（とうそう）を守り、西天（さいてん）へ経を取りに行く身となった。先には平頂山（へいちょうざん）で妖魔を降しながら、難癖をつけて私の宝を返さなかった。今日はまた、何をしに来たのだ。」
      悟空「この前のことなら、俺は少しもぐずぐずせず、あんたの五つの宝をその場で返したじゃないか。それなのに、まだ疑って俺を責めるのかい。」

    "translation_ja": |-
      太上老君「旅もせず、なぜ私の宮へ潜り込んで来たのだ。」
      悟空「別れてから西へ進むと、烏鶏国（うけいこく）という国がありました。そこの国王は、道士に化けた妖怪に、風を呼び雨を降らせる術を見せられたあげく、ひそかに殺されたのです。妖怪は国王の姿に化け、今は金鑾殿（きんらんでん）に座っています。お師匠さまが宝林寺（ほうりんじ）で夜に経を読んでいたところへ、国王の幽霊が参り、俺に妖怪を降して、正邪を明らかにしてくれと、たって頼みました。俺は確かな証拠がなくて困り、弟弟子の八戒と夜の庭園へ入り、庭を荒らして、隠された場所を探し当てました。それが、八角の瑠璃井（るりせい）だったのです。死体を引き上げてみると、顔つきは少しも変わっていません。寺へ運んでお師匠さまに見せると、慈悲の心を起こして、俺に生き返らせろと言われました。冥界へ魂を求めに行くことは許さず、この世で治せと言うのです。ほかには生き返らせる手だてがないと思い、わざわざ伺いました。どうか道祖（どうそ）さま、お慈悲をおかけになり、九転還魂丹を千粒ほど俺にお貸しください。あの人を助けたいのです。」
      太上老君「この猿め、でたらめを申すな。千粒だの二千粒だの、飯の代わりに食べるつもりか。そこらの土くれをこねればできるような、たやすいものだと思うのか。ええい、さっさと帰れ。ないぞ！」
      悟空は笑った。
      悟空「百粒ほどでもいいよ。」
      太上老君「それもない。」
      悟空「十粒ほどでもいい。」
      太上老君は怒った。
      太上老君「このろくでなしの猿め、しつこいぞ。ない、ない。出ていけ、出ていけ！」
      悟空は笑った。
      悟空「本当にないのなら、よそへ頼みに行くとするか。」
      太上老君は怒鳴った。
      太上老君「行け、行け、行け！」
      悟空はくるりと向きを変え、そのまま歩き出した。

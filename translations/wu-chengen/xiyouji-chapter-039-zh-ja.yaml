    "source_text": "你看他千條瑞靄離瑤闕，萬道祥雲降世塵。須臾間，下了南天門，回到東觀，早見那太陽星上。按雲頭，徑至寶林寺山門外，只聽得八戒還哭哩。忽近前叫聲：「師父。」三藏喜道：「悟空來了，可有丹藥？」行者道：「有。」八戒道：「怎麼得沒有？他偷也去偷人家些來。」行者笑道：「兄弟，你過去罷，用不著你了。你揩揩眼淚，別處哭去。」教沙和尚：「取些水來我用。」沙僧急忙往後面井上，有個方便吊桶，即將半缽盂水遞與行者。行者接了水，口中吐出丹來，安在那皇帝唇裡。兩手扳開牙齒，用一口清水，把金丹沖灌下肚。有半個時辰，只聽他肚裡呼呼的亂響，只是身體不能轉移。行者道：「師父，弄我金丹也不能救活，可是掯殺老孫麼？」三藏道：「豈有不活之理？似這般久死之屍，如何吞得水下？此乃金丹之仙力也。自金丹入腹，卻就腸鳴了，腸鳴乃血脈和動，但氣絕不能迴伸。莫說人在井裡浸了三年，就是生鐵也上鏽了。只是元氣盡絕，得個人度他一口氣便好。」那八戒上前就要度氣，三藏一把扯住道：「使不得，還教悟空來。」那師父甚有主張：原來豬八戒自幼兒傷生作孽吃人，是一口濁氣。惟行者從小修持，咬松嚼柏，吃桃果為生，是一口清氣。這大聖上前，把個雷公嘴，噙著那皇帝口唇，呼的一口氣吹入咽喉，度下重樓，轉明堂，徑至丹田，從湧泉倒返泥垣宮。呼的一聲響喨，那君王氣聚神歸，便翻身，掄拳曲足，叫了一聲：「師父。」雙膝跪在塵埃道：「記得昨夜鬼魂拜謁，怎知道今朝天曉返陽神。」三藏慌忙攙起道：「陛下，不干我事，你且謝我徒弟。」行者笑道：「師父說那裡話，常言道：『家無二主。』你受他一拜兒不虧。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch39-1500596"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第039回&oldid=1500596"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      千筋のめでたい霞をまとって玉の宮殿を離れ、万筋の瑞雲とともに、塵の世へ下っていく。たちまち南天門を降り、東観（とうかん）へ戻るころには、もう太陽が昇っていた。雲を降ろし、まっすぐ宝林寺の山門の外へ来ると、八戒はまだ泣いていた。悟空はすっと近づき、声をかけた。
      悟空「お師匠さま。」
      三蔵は喜んだ。
      三蔵「悟空、戻ったか。丹薬はあったか。」
      悟空「ありました。」
      八戒「ないわけがありませんよ。盗んででも、よそのものを持ってくるんですから。」
      悟空は笑った。
      悟空「兄弟、もう向こうへ行っていい。お前の用は済んだ。涙を拭いて、よそで泣いてくれ。」
      それから沙悟浄に言った。
      悟空「使う水を少し持ってきてくれ。」
      沙悟浄は急いで裏の井戸へ行った。都合よくつるべがあったので、鉢に半分ほど水をくみ、悟空に渡した。悟空は水を受け取ると、口から丹を吐き出して国王の唇に置き、両手で歯を開かせ、一口の清水で金丹を腹へ流し込んだ。半時辰（じしん）ほどたつと、腹の中がぐうぐうと鳴り出したが、体はいっこうに動かせない。
      悟空「お師匠さま、せっかく手に入れた金丹でも生き返らないなんて。私をとことん困らせるおつもりですか。」
      三蔵「生き返らないはずがない。これほど長く死んでいた体が、どうして水を飲み下せたのだ。それこそ金丹の仙力だ。金丹が腹へ入ると、すぐ腸が鳴った。腸が鳴るのは、血の巡りが整って動き始めたからだ。ただ、息が絶えているので、まだ体を動かせないのだろう。人が三年も井戸に浸かっていたのだからな。鉄の塊でさえ、錆びてしまう。もとの気がすっかり尽きているだけだ。誰かが一息、気を吹き込んでやればよい。」
      八戒が進み出て息を吹き込もうとすると、三蔵はむんずと引き止めた。
      三蔵「いけない。やはり悟空にやらせなさい。」
      師には、はっきりとした考えがあった。八戒は幼いころから生き物を殺し、人を食って罪を重ねたため、息が濁っている。それにひきかえ悟空は、幼いころから修行し、松や柏をかみ、桃などの果物を食べて暮らしてきたので、その息は清らかだったのだ。悟空は前へ出ると、雷神のように突き出た口で国王の唇をくわえ、ふっと喉へ息を吹き込んだ。その気は重楼（じゅうろう）を下り、明堂（めいどう）を巡り、まっすぐ丹田（たんでん）へ至り、湧泉（ゆうせん）から逆に泥垣宮（でいえんきゅう）へと返った。ふうっという響きが上がり、国王は気が集まり、精神が戻って、身を起こし、拳を振って足を曲げた。
      国王「お師匠さま！」
      国王は土の上へ両膝をついて言った。
      国王「昨夜は幽霊の身でお目にかかったと覚えておりますのに、今朝、夜が明けて生身に戻ろうとは、思いもよりませんでした。」
      三蔵は慌てて助け起こした。
      三蔵「陛下、私のしたことではありません。弟子に礼を言ってください。」
      悟空は笑った。
      悟空「お師匠さま、何をおっしゃるんです。よく『一家に主人は二人いない』と言うではありませんか。お師匠さまが拝礼を受けても、何も差し支えはありませんよ。」

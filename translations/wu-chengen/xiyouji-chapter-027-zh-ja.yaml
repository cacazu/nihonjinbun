- "id": "xy-ch27-008"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說常言有云：「山高必有怪，嶺峻卻生精。」果然這山上有一個妖精，孫大聖去時，驚動那怪。他在雲端裡踏著陰風，看見長老坐在地下，就不勝歡喜道：「造化，造化。幾年家人都講東土的唐和尚取大乘，他本是金蟬子化身，十世修行的原體，有人吃他一塊肉，長壽長生。真個今日到了。」那妖精上前就要拿他，只見長老左右手下有兩員大將護持，不敢攏身。他說兩員大將是誰？說是八戒、沙僧。八戒、沙僧雖沒甚麼大本事，然八戒是天蓬元帥，沙僧是捲簾大將，他的威氣尚不曾泄，故不敢攏身。妖精說：「等我且戲他戲，看怎麼說。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    さて、諺に「山が高ければ必ず怪あり、嶺が険しければ精が生じる」という。果たして、この山にも一匹の妖怪がいた。悟空が飛び去ったので、その妖怪が気づいた。陰気な風に乗って雲の上から見下ろすと、三蔵が地面に座っている。喜びに堪えられず、妖怪は言った。
    妖怪「ついている、ついている！　この何年も皆が噂していた。東土（とうど）の唐（とう）の和尚が大乗の経を取りに来ると。あれはもと金蝉子（きんせんし）の生まれ変わり、十たびの生を修行してきた身で、その肉を一切れ食べれば、不老長生が得られるという。まさに今日、ここへ来たのだ。」
    妖怪は進み寄って捕まえようとしたが、三蔵の左右に二人の大将が護衛しているのを見て、そばへ寄れなかった。その二人の大将とは誰か。八戒（はっかい）と沙悟浄（さごじょう）である。二人にはそれほど大きな腕前がないとはいえ、八戒はかつて天蓬元帥（てんぽうげんすい）、沙悟浄は捲簾大将（けんれんたいしょう）だった。その威勢はまだ失われていなかったので、妖怪は近づけなかったのだ。
    妖怪「では、ひとつあの僧をだましてみよう。どう出るか見てやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch27-009"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好妖精，停下陰風，在那山凹裡搖身一變，變做個月貌花容的女兒，說不盡那眉清目秀，齒白唇紅。左手提著一個青砂罐兒，右手提著一個綠磁瓶兒，從西向東，徑奔唐僧："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 133
    "line_end": 133
  "translation_ja": "その妖怪は陰風を止め、山あいで身をひと振りして、月のような顔、花のような容貌の娘に化けた。すっきりした眉と美しい目、白い歯に赤い唇、その美しさは言い尽くせない。左手に青い素焼きの壺、右手に緑の磁器の瓶を提げ、西から東へ、まっすぐ三蔵の所へ向かった。"
  "translation_status": "reviewed"
- "id": "xy-ch27-010"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    聖僧歇馬在山巖，忽見裙釵女近前。
    翠袖輕搖籠玉筍，湘裙斜拽顯金蓮。
    汗流粉面花含露，塵拂蛾眉柳帶煙。
    仔細定睛觀看處，看看行至到身邊。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 135
    "line_end": 138
  "translation_ja": |-
    聖僧が山の岩場で馬を休ませていると、ふと一人の娘が近づいてくる。
    翠の袖は軽やかに揺れて玉のような指を包み、絹の裳裾を斜めに引けば小さな足が見える。
    汗の浮く白粉の顔は露を含んだ花、埃のかかる細眉は霞を帯びた柳のよう。
    じっと目を凝らして眺めるうちに、娘はもうすぐそばまで歩いてきた。
  "translation_status": "reviewed"
- "id": "xy-ch27-011"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏見了，叫：「八戒、沙僧，悟空才說這裡曠野無人，你看那裡不走出一個人來了？」八戒道：「師父，你與沙僧坐著，等老豬去看看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    三蔵はそれを見て呼びかけた。
    三蔵「八戒、沙悟浄。悟空はさっき、この荒野に人はいないと言ったが、見なさい、あそこから一人出てきたではないか。」
    八戒「お師匠さまは沙悟浄と座っていてください。俺が見てきます。」
  "translation_status": "reviewed"
- "id": "xy-ch27-012"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子放下釘鈀，整整直裰，擺擺搖搖，充作個斯文氣象，一直的靦面相迎。真個是遠看未實，近看分明，那女子生得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 141
    "line_end": 141
  "translation_ja": "八戒は熊手を下ろし、僧衣を整えると、体を揺すりながら、上品な人のような顔つきをして、厚かましくもまっすぐ娘を迎えに行った。遠くからではよく分からなかったが、近くへ寄ればはっきり見える。その娘の姿は。"
  "translation_status": "reviewed"
- "id": "xy-ch27-013"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": "冰肌藏玉骨，衫領露酥胸。柳眉積翠黛，杏眼閃銀星。月樣容儀俏，天然性格清。體似燕藏柳，聲如鶯囀林。半放海棠籠曉日，才開芍藥弄春晴。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 143
    "line_end": 143
  "translation_ja": "氷のように澄んだ肌に玉のような骨格を秘め、衣の襟からは滑らかな胸がのぞく。柳の眉には濃い翠の黛、杏の目には銀の星がきらめく。月のような顔立ちは愛らしく、生まれつき清らかな風情。姿は柳に隠れる燕、声は林でさえずる鶯。朝日に包まれて半ば開いた海棠のよう、春の晴天に戯れる咲き初めの芍薬のようだった。"
  "translation_status": "reviewed"
- "id": "xy-ch27-014"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒見他生得俊俏，獃子就動了凡心，忍不住胡言亂語，叫道：「女菩薩，往那裡去？手裡提著是甚麼東西？」分明是個妖怪，他卻不能認得。那女子連聲答應道：「長老，我這青罐裡是香米飯，綠瓶裡是炒麵筋。特來此處無他故，因還誓願要齋僧。」八戒聞言，滿心歡喜，急抽身，就跑了個豬顛風，報與三藏道：「師父，『吉人自有天報』，師父餓了，教師兄去化齋，那猴子不知那裡摘桃兒耍子去了。桃子吃多了，也有些嘈人，又有些下墜。你看那不是個齋僧的來了？」唐僧不信道：「你這個夯貨胡纏。我們走了這向，好人也不曾遇著一個，齋僧的從何而來！」八戒道：「師父，這不到了？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    娘の美しさを見ると、八戒には俗な欲が起こり、我慢できず口が滑りだした。
    八戒「女施主、どこへ行くんだい。手に提げているのは何だい。」
    明らかに妖怪なのに、八戒には見抜けない。娘姿の妖怪は、さっそく愛想よく答えた。
    娘姿の妖怪「長老さま、この青い壺には香りのよい米のご飯、緑の瓶には炒めた麩が入っています。わざわざここへ来たのは、ほかでもありません。願掛けのお礼に、お坊さまへ食事を差し上げるためです。」
    八戒は大喜びし、すぐに身を翻すと、豚が旋風を起こすような勢いで駆け戻り、三蔵に報告した。
    八戒「お師匠さま、『善人には天が報いてくださる』とはこのことです。腹が減ったから兄貴を托鉢にやったのに、あの猿はどこかで桃を取って遊んでいる。桃なんか食いすぎると胃がむかむかするし、腹が重くなって便意を催す。ご覧なさい。僧に食事を施す人が来ましたよ。」
    三蔵は信じなかった。
    三蔵「この愚か者、いい加減なことを言うな。これだけ歩いても善良な人一人に会わなかったのに、食事を施す人がどこから来るのだ。」
    八戒「お師匠さま、ほら、もう来ました。」
  "translation_status": "reviewed"
- "id": "xy-ch27-015"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏一見，連忙跳起身來，合掌當胸道：「女菩薩，你府上在何處住？是甚人家？有甚願心，來此齋僧？」分明是個妖精，那長老也不認得。那妖精見唐僧問他來歷，他立地就起個虛情，花言巧語，來賺哄道：「師父，此山叫做蛇回獸怕的白虎嶺，正西下面是我家。我父母在堂，看經好善，廣齋方上遠近僧人。只因無子，求神作福，生了奴奴。欲扳門第，配嫁他人，又恐老來無倚，只得將奴招了一個女婿，養老送終。」三藏聞言道：「女菩薩，你語言差了。聖經云：『父母在，不遠遊，遊必有方。』你既有父母在堂，又與你招了女婿，有願心，教你男子還，便也罷，怎麼自家在山行走？又沒個侍兒隨從。這個是不遵婦道了。」那女子笑吟吟，忙陪俏語道：「師父，我丈夫在山北凹裡，帶幾個客子鋤田。這是奴奴煮的午飯，送與那些人吃的。只為五黃六月，無人使喚，父母又年老，所以親身來送。忽遇三位遠來，卻思父母好善，故將此飯齋僧，如不棄嫌，願表芹獻。」三藏道：「善哉！善哉！我有徒弟摘果子去了，就來。我不敢吃，假如我和尚吃了你飯，你丈夫曉得，罵你，卻不罪坐貧僧也？」那女子見唐僧不肯吃，卻又滿面春生道：「師父啊，我父母齋僧，還是小可；我丈夫更是個善人，一生好的是修橋補路，愛老憐貧。但聽見說這飯送與師父吃了，他與我夫妻情上，比尋常更是不同。」三藏也只是不吃。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    三蔵は娘を見ると急いで立ち上がり、胸の前で合掌した。
    三蔵「女施主、お住まいはどちらですか。どのようなお家で、どんな願を立てて、ここへ僧に食事を施しに来られたのでしょう。」
    明らかに妖怪なのだが、三蔵にも見抜けない。妖怪は素性を尋ねられると、その場で嘘を作り、美辞麗句を並べてだましにかかった。
    娘姿の妖怪「長老さま、この山は、蛇さえ引き返し獣さえ恐れる白虎嶺（びゃっこれい）と申します。私の家は真西の麓にございます。両親は健在で、経を読んで善行を好み、諸方から来る遠近のお坊さまに広く食事を施しています。ただ子供に恵まれず、神に祈って福を求め、ようやく私が生まれました。よい家柄と縁を結び、私を嫁に出そうとも思いましたが、老後に頼る者がなくなるのを恐れ、やむなく婿を迎えて、老後の世話と葬いを任せることにしたのです。」
    三蔵「女施主、お話には筋の合わないところがあります。聖人の教えには、『父母が健在なら遠くへ旅をしない。旅をするなら、必ず行く先を定めておく』とあります。ご両親が健在で、婿まで迎えてくださったのなら、願のお礼はご主人にしてもらえばよいでしょう。なぜご自分で山を歩き、付き添いの侍女も連れないのですか。それでは女性の守る道に背きます。」
    娘姿の妖怪はにこにこ笑い、すかさず愛嬌よく答えた。
    娘姿の妖怪「長老さま、夫は山の北の谷で、何人かの雇い人を連れて畑を耕しています。これは私が炊いた昼ご飯で、皆に届けるところなのです。ちょうど五月、六月の暑い盛りで、人手がなく、両親も年を取っているので、自分で届けに来ました。そこへ遠くから来られたお三方に思いがけずお会いし、善行を好む両親を思い出して、この食事を差し上げようと思ったのです。お嫌でなければ、ささやかな心ばかりのものをお納めください。」
    三蔵「ありがたいことです、ありがたいことです。私の弟子が果物を取りに行っており、じき戻ります。ですから頂くわけにはまいりません。もし私たち僧があなたの食事を食べ、ご主人がそれを知ってあなたを叱ったら、私の罪になりはしませんか。」
    娘姿の妖怪は、三蔵が食べようとしないので、ますます愛想のよい顔をした。
    娘姿の妖怪「長老さま、両親が僧に食事を施すのなど、夫に比べればわずかなことです。夫はさらに善良で、一生、橋を架け直し道を補修することを好み、お年寄りを大切にして貧しい人を憐れんでいます。この食事を長老さまに差し上げたと聞けば、夫婦の仲もいつもより格別に睦まじくなることでしょう。」
    それでも三蔵は食べなかった。
  "translation_status": "reviewed"
- "id": "xy-ch27-016"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "旁邊卻惱壞了八戒，那獃子努著嘴，口裡埋怨道：「天下和尚也無數，不曾像我這個老和尚罷軟。現成的飯，三分兒倒不吃，只等那猴子來，做四分才吃。」他不容分說，一嘴把個罐子拱倒，就要動口。只見那行者自南山頂上摘了幾個桃子，托著缽盂，一觔斗，點將回來，睜火眼金睛觀看，認得那女子是個妖精，放下缽盂，掣鐵棒，當頭就打。諕得個長老用手扯住道：「悟空，你走將來打誰？」行者道：「師父，你面前這個女子，莫當做個好人，他是個妖精，要來騙你哩。」三藏道：「你這個猴頭，當時倒也有些眼力，今日如何亂道？這女菩薩有此善心，將這飯要齋我等，你怎麼說他是個妖精？」行者笑道：「師父，你那裡認得。老孫在水簾洞裡做妖魔時，若想人肉吃，便是這等：或變金銀，或變莊臺，或變醉人，或變女色。有那等痴心的愛上我，我就迷他到洞裡，盡意隨心，或蒸或煮受用；吃不了，還要曬乾了防天陰哩。師父，我若來遲，你定入他套子，遭他毒手。」那唐僧那裡肯信，只說是個好人。行者道：「師父，我知道你了，你見他那等容貌，必然動了凡心。若果有此意，叫八戒伐幾棵樹來，沙僧尋些草來，我做木匠，就在這裡搭個窩鋪，你與他圓房成事，我們大家散了，卻不是件事業？何必又跋涉，取甚經去？」那長老原是個軟善的人，那裡吃得他這句言語，羞得光頭徹耳通紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    そばにいた八戒はすっかり腹を立て、口を突き出してぶつぶつ言った。
    八戒「世の中に和尚はいくらでもいるが、うちの年寄り和尚ほど煮えきらないのはいないぞ。出来上がった飯を三人で分けるのは嫌で、あの猿を待って四人分にしてから食うというんだ。」
    言い終えるや鼻先で壺を突き倒し、さあ食べようとした。そこへ、南の山の頂で桃をいくつか取った悟空が、鉢を手に宙返り一つで戻ってきた。火眼金睛（かがんきんせい）を見開いて眺め、娘が妖怪だと見抜くと、鉢を置き、鉄棒を取り出して頭めがけて打ちかかった。三蔵は驚いて、その腕をつかんだ。
    三蔵「悟空、戻るなり誰を打とうというのだ。」
    悟空「お師匠さま、目の前のこの娘を善人と思ってはいけません。あなたをだましに来た妖怪です。」
    三蔵「この猿め、以前は多少物を見る目もあったのに、今日はなぜでたらめを言う。この女施主は、こんな善意で私たちに飯を施そうとしている。それをなぜ妖怪だと言うのだ。」
    悟空は笑った。
    悟空「お師匠さまに見抜けるものですか。俺も水簾洞（すいれんどう）で妖魔をしていたころ、人の肉が食いたくなると、こうしたものです。金銀に化けたり、屋敷に化けたり、酔っぱらいに化けたり、美女に化けたり。愚かな欲で俺に惹かれる者がいると、洞へ誘い込んで、蒸すなり煮るなり、思うままに食いました。食いきれなければ干し肉にして、雨の日に備えたものです。お師匠さま、私が遅れていれば、きっとこいつの罠にはまり、毒手にかかっていましたよ。」
    三蔵はどうしても信じず、善良な人だと言い張った。
    悟空「お師匠さま、分かりましたよ。あの顔かたちを見て、きっと色気を起こされたのでしょう。本当にそのお気があるのなら、八戒に木を何本か切らせ、沙悟浄に草を集めさせて、私が大工になり、ここへ小屋を建てましょう。お師匠さまはあの娘と床をともにして夫婦になり、私たちは皆で解散する。それで立派に片がつくではありませんか。なぜまた苦労して旅をし、経など取りに行くのです。」
    もともと気の優しい三蔵に、こんな言葉を受け止める力はない。恥ずかしさに、丸い頭から耳まで真っ赤になった。
  "translation_status": "reviewed"
- "id": "xy-ch27-017"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏正在此羞慚，行者又發起性來，掣鐵棒，望妖精劈臉一下。那怪物有些手段，使個「解屍法」，見行者棍子來時，他卻抖擻精神，預先走了，把一個假屍首打死在地下。諕得個長老戰戰兢兢，口中作念道：「這猴著然無禮，屢勸不從，無故傷人性命。」行者道：「師父莫怪，你且來看看這罐子裡是甚東西？」沙僧攙著長老，近前看時，那裡是甚香米飯，卻是一罐子拖尾巴的長蛆；也不是麵觔，卻是幾個青蛙、癩蝦蟆，滿地亂跳。長老才有三分兒信了。怎禁豬八戒氣不忿，在傍漏八分兒唆嘴道：「師父，說起這個女子，他是此間農婦，因為送飯下田，路遇我等，卻怎麼栽他是個妖怪？哥哥的棍重，走將來試手打他一下，不期就打殺了。怕你念甚麼緊箍兒咒，故意的使個障眼法兒，變做這等樣東西，演幌你眼，使不念咒哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    三蔵が恥じ入っている間に、悟空はまた気をたけらせ、鉄棒を振り上げて妖怪の顔を一撃した。ところがこの魔物には術があり、解屍法（かいしほう）を使った。棒が来るのを見て精神を奮い立たせ、先に抜け出して逃げたので、地面に打ち殺されたのは偽の死体だった。三蔵は震え上がり、口でつぶやいた。
    三蔵「この猿は本当に無礼だ。何度諭しても従わず、わけもなく人の命を奪った。」
    悟空「お師匠さま、怒る前に、この壺の中が何か見てください。」
    沙悟浄が三蔵を支え、近寄って見た。香りのよい米飯どころか、壺いっぱいに尾を引いた長い蛆がいる。麩でもなく、何匹かの蛙とひきがえるが地面じゅうを跳ね回っていた。三蔵もこれで三分ほどは信じた。ところが八戒は腹の虫が治まらず、その三分を八分の勢いで打ち消すように、横から口を挟んでそそのかした。
    八戒「お師匠さま、この娘はこの辺りの農家の女ですよ。畑へ飯を届けに来て、途中で俺たちと出会っただけなのに、どうして妖怪だと罪を着せるんです。兄貴の棒は重いから、戻ってきて腕試しに一発打ったら、思いがけず殺してしまった。それで緊箍児呪（きんこじじゅ）を唱えられるのが怖くて、わざと目くらましの術を使い、こんなものに変えたんです。お師匠さまの目をごまかして、呪文を唱えさせまいとしているんですよ。」
  "translation_status": "reviewed"
- "id": "xy-ch27-018"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏自此一言，就是晦氣到了。果然信那獃子攛唆，手中捻訣，口裡念咒。行者就叫：「頭疼，頭疼。莫念，莫念，有話便說。」唐僧道：「有甚話說？出家人時時常要方便，念念不離善心，掃地恐傷螻蟻命，愛惜飛蛾紗罩燈。你怎麼步步行兇，打死這個無故平人，取將經來何用？你回去罷。」行者道：「師父，你教我回那裡去？」唐僧道：「我不要你做徒弟。」行者道：「你不要我做徒弟，只怕你西天路去不成。」唐僧道：「我命在天，該那個妖精蒸了吃，就是煮了，也算不過。終不然，你救得我的大限？你快回去。」行者道：「師父，我回去便也罷了，只是不曾報得你的恩哩。」唐僧道：「我與你有甚恩？」那大聖聞言，連忙跪下叩頭道：「老孫因大鬧天宮，致下了傷身之難，被我佛壓在兩界山。幸觀音菩薩與我受了戒行，幸師父救脫吾身。若不與你同上西天，顯得我知恩不報非君子，萬古千秋作罵名。」原來這唐僧是個慈憫的聖僧，他見行者哀告，卻也回心轉意道：「既如此說，且饒你這一次，再休無禮。如若仍前作惡，這咒語顛倒就念二十遍。」行者道：「三十遍也由你，只是我不打人了。」卻才伏侍唐僧上馬，又將摘來桃子奉上。唐僧在馬上也吃了幾個，權且充饑。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    この一言から、三蔵の不運が始まった。案の定、八戒のそそのかしを信じ、指で印を結び、口で呪文を唱えだした。
    悟空「頭が痛い、頭が痛い！　唱えないでください、唱えないでください。言いたいことがあれば、おっしゃってください。」
    三蔵「何を言うことがある。出家した者はいつでも人のためを図り、一念ごとに善い心を失わぬものだ。地を掃くにも蟻の命を傷つけまいと気をつけ、蛾を憐れんで灯火に薄絹の覆いを掛ける。それなのにお前は行く先々で凶暴に振る舞い、罪もない民を殺した。経を持ち帰って何になる。帰ってしまえ。」
    悟空「お師匠さま、どこへ帰れとおっしゃるのです。」
    三蔵「もうお前を弟子にはしない。」
    悟空「私を弟子になさらなければ、西天（さいてん）までは行けないのではありませんか。」
    三蔵「私の命は天にある。どの妖怪に蒸して食われる定めだとしても、煮られる定めだとしても、それを避けることはできぬ。お前に私の寿命が救えるというのか。早く帰れ。」
    悟空「帰るのはかまいません。ただ、まだお師匠さまのご恩に報いていません。」
    三蔵「私がお前にどんな恩を与えた。」
    悟空はそれを聞くと、急いでひざまずいて頭を地につけた。
    悟空「この私は天宮で大暴れをしたために身を滅ぼす災いを招き、仏に両界山へ押し込められました。幸い観音菩薩（かんのんぼさつ）が戒を授けてくださり、さらにお師匠さまが私を救い出してくださいました。一緒に西天へ参らなければ、恩を知りながら報いぬ卑しい者として、いつまでも悪名を残すことになります。」
    三蔵はもとより慈悲深い聖僧である。悟空の哀願を見ると、気を取り直して言った。
    三蔵「そう言うなら、今度だけは許してやろう。もう無礼なことはするな。また前のように悪事を働いたら、この呪文を二十遍、繰り返して唱えるぞ。」
    悟空「三十遍でも、お好きになさってください。もう人は打ちません。」
    そこで三蔵が馬に乗るのを助け、取ってきた桃も差し出した。三蔵は馬上でいくつか食べ、ひとまず空腹をしのいだ。
  "translation_status": "reviewed"
- "id": "xy-ch27-019"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那妖精脫命昇空，原來行者那一棒不曾打殺妖精，妖精出神去了。他在那雲端裡咬牙切齒，暗恨行者道：「幾年只聞得講他手段，今日果然話不虛傳。那唐僧已是不認得我，將要吃飯。若低頭聞一聞兒，我就一把撈住，卻不是我的人了？不期被他走來，弄破我這勾當，又幾乎被他打了一棒。若饒了這個和尚，誠然是勞而無功也，我還下去戲他一戲。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    一方、妖怪は命を取り留めて空へ上がった。悟空の一撃では妖怪は死んでおらず、妖怪自身が魂を体から抜け出させて逃げていたのである。雲の上で歯ぎしりをし、悟空をひそかに恨んで言った。
    妖怪「何年もあいつの腕前の噂ばかり聞いていたが、今日になって本当だと分かった。唐の僧は私の正体に気づかず、飯を食おうとしていたのに。頭を下げて匂いを嗅ぎさえすれば、一つかみにして、私のものにできたのだ。思いがけずあいつが戻り、仕事をぶち壊したうえ、危うく棒で打たれるところだった。ここであの僧を逃がしては、骨折り損ではないか。もう一度降りて、だましてやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch27-020"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好妖精，按落陰雲，在那前山坡下搖身一變，變作個老婦人，年滿八旬，手拄著一根彎頭竹杖，一步一聲的哭著走來。八戒見了，大驚道：「師父，不好了，那媽媽兒來尋人了。」唐僧道：「尋甚人？」八戒道：「師兄打殺的定是他女兒，這個定是他娘尋將來了。」行者道：「兄弟莫要胡說，那女子十八歲，這老婦有八十歲，怎麼六十多歲還生產？斷乎是個假的，等老孫去看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    妖怪は陰気な雲を下ろし、前方の山坂で身をひと振りした。今度は八十歳の老女に化け、曲がった柄の竹杖をつきながら、一歩ごとに泣き声を上げて歩いてきた。八戒は見つけて大いに驚いた。
    八戒「お師匠さま、大変だ。あの婆さんが人を捜しに来ました。」
    三蔵「誰を捜しているのだ。」
    八戒「兄貴が殺したのは、きっとあの婆さんの娘ですよ。母親が捜しに来たに違いありません。」
    悟空「兄弟、でたらめを言うな。あの娘は十八、この婆さんは八十だ。六十を過ぎて子供を産むものか。偽物に決まっている。俺が見てこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch27-021"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，拽開步，走近前觀看，那怪物："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 154
    "line_end": 154
  "translation_ja": "悟空は大股で歩み寄り、目を凝らした。その魔物の様子は。"
  "translation_status": "reviewed"
- "id": "xy-ch27-022"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": "假變一婆婆，兩鬢如冰雪。走路慢騰騰，行步虛怯怯。弱體瘦伶仃，臉如枯菜葉。顴骨望上翹，嘴唇往下別。老年不比少年時，滿臉都是荷葉摺。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 156
    "line_end": 156
  "translation_ja": "老婆の姿に化け、左右の鬢は氷雪の白さ。のろのろと歩き、足取りは頼りなくおぼつかない。弱った体は痩せ細り、顔は枯れた菜の葉のよう。頬骨は上へ突き出し、唇は下へ垂れ下がる。老いは若いころとは違い、顔じゅうに蓮の葉のような皺が寄っていた。"
  "translation_status": "reviewed"
- "id": "xy-ch27-023"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者認得他是妖精，更不理論，舉棒照頭便打。那怪見棍子起時，依然抖擻，又出化了元神，脫真兒去了，把個假屍首又打死在山路傍之下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 158
    "line_end": 158
  "translation_ja": "悟空は妖怪だと見抜き、今度は何も言わずに棒を上げ、頭めがけて打ちかかった。妖怪は棒が上がると、またも精神を奮い立たせて元神（げんしん）を抜き出し、本体を逃がした。偽の死体だけが、また山道の脇で打ち殺された。"
  "translation_status": "reviewed"
- "id": "xy-ch27-024"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧一見，驚下馬來，睡在路傍，更無二話，只是把緊箍兒咒顛倒足足念了二十遍。可憐把個行者頭勒得似個亞腰兒葫蘆，十分疼痛難忍，滾將來哀告道：「師父莫念了，有甚話說了罷。」唐僧道：「有甚話說？出家人耳聽善言，不墮地獄。我這般勸化你，你怎麼只是行兇？把平人打死一個，又打死一個，此是何說？」行者道：「他是妖精。」唐僧道：「這個猴子胡說，就有這許多妖怪？你是個無心向善之輩，有意作惡之人，你去罷。」行者道：「師父又教我去？回去便也回去了，只是一件不相應。」唐僧道：「你有甚麼不相應處？」八戒道：「師父，他要和你分行李哩。跟著你做了這幾年和尚，不成空著手回去？你把那包袱內的甚麼舊褊衫，破帽子、分兩件與他罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    三蔵は見るなり驚いて馬を下り、道端に身を横たえた。一言の話もなく、ただ緊箍児呪を繰り返し、きっちり二十遍唱えた。哀れにも悟空の頭は、くびれた瓢箪のように締めつけられ、耐えがたい痛みに襲われた。転がるように近寄り、哀願する。
    悟空「お師匠さま、もう唱えないでください。言いたいことは、お言葉でおっしゃってください。」
    三蔵「何を言うことがある。出家した者は善い言葉に耳を傾け、地獄へ落ちぬようにするものだ。これほど教え諭しているのに、なぜ凶暴なことばかりする。罪のない人を一人殺し、また一人殺した。これをどう言い訳する。」
    悟空「あれは妖怪です。」
    三蔵「この猿はでたらめを言う。そんなに大勢の妖怪がいるものか。お前は善に向かう心がなく、わざと悪をなす者だ。行ってしまえ。」
    悟空「また私を追い払うのですか。帰るなら帰ります。ただ一つ、具合の悪いことがあります。」
    三蔵「何が具合悪いのだ。」
    八戒「お師匠さま、荷物を分けてもらいたいんですよ。何年もついて歩いて僧をしていたのに、手ぶらじゃ帰れないというんでしょう。包みの中の古い僧衣だの破れ帽子だの、二つ分けてやりなさいよ。」
  "translation_status": "reviewed"
- "id": "xy-ch27-025"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，氣得暴跳道：「我把你這個尖嘴的夯貨！老孫一向秉教沙門，更無一毫嫉妒之意，貪戀之心，怎麼要分甚麼行李？」唐僧道：「你既不嫉妒貪戀，如何不去？」行者道：「實不瞞師父說，老孫五百年前，居花果山水簾洞大展英雄之際，收降七十二洞邪魔，手下有四萬七千小怪，頭戴的是紫金冠，身穿的是赭黃袍，腰繫的是藍田帶，足踏的是步雲履，手執的是如意金箍棒，著實也曾為人。自從涅槃罪度，削髮秉正沙門，跟你做了徒弟，把這個金箍兒勒在我頭上，若回去，卻也難見故鄉人。師父果若不要我，把那個鬆箍兒咒念一念，退下這個箍子，交付與你，套在別人頭上，我就快活相應了，也是跟你一場。莫不成這些人意兒也沒有了？」唐僧大驚道：「悟空，我當時只是菩薩暗受一卷緊箍兒咒，卻沒有甚麼鬆箍兒咒。」行者道：「若無松箍兒咒，你還帶我去走走罷。」長老又沒奈何道：「你且起來，我再饒你這一次，卻不可再行兇了。」行者道：「再不敢了。再不敢了。」又伏侍師父上馬，剖路前進。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    悟空はそれを聞き、怒って跳びはねた。
    悟空「この尖った口の間抜けめ！　俺は仏の教えを守ってきて、嫉妬する気も欲しがる気も、これっぽっちもない。どうして荷物を分けろなどと言うものか。」
    三蔵「嫉妬も欲もないのなら、なぜ立ち去らない。」
    悟空「正直に申し上げます。五百年前、私は花果山（かかざん）の水簾洞に住み、大いに英雄ぶりを発揮していました。七十二洞の魔物を降し、四万七千の小妖を従え、頭には紫金冠（しきんかん）、身には赤黄の袍、腰には藍田（らんでん）の帯、足には歩雲履（ほうんり）、手には如意金箍棒（にょいきんこぼう）を持ち、それは一角の者として通っていたのです。それが仏道に入って昔の罪業を清め、髪を剃って正しい僧の道を守り、お師匠さまの弟子になったとたん、この金の輪を頭にはめられました。この姿で戻っては故郷の者に顔向けできません。本当に私が要らないのでしたら、輪を緩める鬆箍児呪（しょうこじじゅ）を唱え、この輪を外してください。お返ししますから、ほかの者の頭にはめればいい。そうすれば私も気楽になり、居心地よく帰れます。ともかく一度はお供をした仲ではありませんか。それほどの情も掛けてくださらないのですか。」
    三蔵はひどく驚いた。
    三蔵「悟空、あのとき菩薩からひそかに授かったのは、緊箍児呪の一巻だけだ。鬆箍児呪などはない。」
    悟空「緩める呪文がないのなら、まだ私をお供に連れていってください。」
    三蔵はまたも困り果てた。
    三蔵「ひとまず立ちなさい。もう一度だけ許してやる。ただし、二度と凶暴な真似をしてはいけない。」
    悟空「もういたしません。もういたしません。」
    再び師を馬に乗せ、道を切り開いて進んだ。
  "translation_status": "reviewed"
- "id": "xy-ch27-026"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那妖精原來行者第二棍也不曾打殺他。那怪物在半空中誇獎不盡道：「好個猴王，著然有眼，我那般變了去，他也還認得我。這些和尚他去得快，若過此山，西下四十里，就不伏我所管了。若是被別處妖魔撈了去，好道就笑破他人口，使碎自家心。我還下去戲他一戲。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    さて、悟空の二度目の棒も妖怪を殺してはいなかった。妖怪は空中で、しきりに感心して言った。
    妖怪「大した猿の王だ。本当に見る目がある。あそこまで姿を変えても、まだ私を見破るとは。あの僧たちは足が速い。この山を越え、西へ四十里行けば、もう私の縄張りではない。よその妖魔にさらわれたら、そいつには腹の皮がよじれるほど笑われ、私は胸が張り裂けるほど悔しがることになる。もう一度降りてだましてやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch27-027"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好妖精，按聳陰風，在山坡下搖身一變，變做一個老公公，真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"

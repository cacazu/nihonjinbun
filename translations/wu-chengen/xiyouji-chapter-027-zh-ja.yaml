    第二十七回
    屍の魔物、三たび唐三蔵を欺き、聖僧は恨んで美猴王を追い払う
  "translation_status": "reviewed"
- "id": "xy-ch27-002"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏師徒次日天明收拾前進，那鎮元子與行者結為兄弟，兩人情投意合，決不肯放，又安排管待，一連住了五六日。那長老自服了草還丹，真似脫胎換骨，神爽體健。他取經心重，那裡肯淹留，無已，遂行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて三蔵（さんぞう）一行は翌朝、夜が明けると出発の支度をした。ところが鎮元子（ちんげんし）は悟空（ごくう）と義兄弟になり、互いにすっかり気が合っていたので、どうしても行かせようとしない。またご馳走を用意してもてなし、一行は続けて五、六日滞在した。三蔵は草還丹（そうかんたん）を口にしてから、まさに生まれ変わったように心身が爽やかで健やかになった。しかし経を求める思いが強く、いつまでもとどまってはいられない。とうとう暇を告げて旅立った。"
  "translation_status": "reviewed"
- "id": "xy-ch27-003"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒別了上路，早見一座高山。三藏道：「徒弟，前面有山險峻，恐馬不能前，大家須仔細仔細。」行者道：「師父放心，我等自然理會。」好猴王，他在馬前橫擔著棒，剖開山路，上了高崖，看不盡："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    師弟は別れを告げて道に出ると、ほどなく高い山が見えてきた。
    三蔵「弟子たち、前の山は険しい。馬では進めないかもしれないから、皆、よくよく気をつけなさい。」
    悟空「お師匠さま、ご安心ください。私たちで十分気をつけます。」
    さすがの悟空、馬の前に立ち、鉄棒を横に担いで山道を切り開き、高い崖へ登っていった。見渡せば、尽きぬ山の景色。
  "translation_status": "reviewed"
- "id": "xy-ch27-004"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": "峰巖重疊，澗壑彎環。虎狼成陣走，麂鹿作群行。無數獐\U00024731鑽簇簇，滿山狐兔聚叢叢。千尺大蟒，萬丈長蛇。大蟒噴愁霧，長蛇吐怪風。道旁荊棘牽漫，嶺上松柟秀麗。薜蘿滿目，芳草連天。影落滄溟北，雲開斗柄南。萬古常含元氣老，千峰巍列日光寒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 125
    "line_end": 125
  "translation_ja": "峰と岩とは幾重にも重なり、谷と沢とは曲がり巡る。虎と狼は群れをなして走り、麂（き）や鹿も群れをなして行く。数知れぬ獐（しょう）や雌の猪がひしめき、山いっぱいに狐や兎が集まる。千尺の大うわばみ、万丈の長い蛇。うわばみは憂いを誘う霧を吹き、長蛇は怪しい風を吐く。道端には茨が絡み広がり、尾根には松や楠が美しい。つる草は目の届く限り茂り、香る草は空の果てまで続く。影は青い海の北に落ち、雲は北斗（ほくと）の柄の南に開く。万古の昔から天地の元気を宿し、千の峰はそびえ並んで、日の光さえ冷たい。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「獐\U00024731」の\U00024731は康熙字典の豝への参照と説文解字の牝豕の語義に照らし「雌の猪」と訳した。原文欄の字を保持した。「影落滄溟北、雲開斗柄南」は地理を特定せず、原文の方位と天象の比喩を保った。"
- "id": "xy-ch27-005"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老馬上心驚。孫大聖佈施手段，舞著鐵棒，哮吼一聲，諕得那狼蟲顛竄，虎豹奔逃。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 127
    "line_end": 127
  "translation_ja": "三蔵は馬上でおびえた。悟空は腕前を見せ、鉄棒を振り回して一声吠えた。狼などの獣は慌てて逃げ散り、虎も豹も走り去った。"
  "translation_status": "reviewed"
- "id": "xy-ch27-006"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們入此山，正行到嵯峨之處，三藏道：「悟空，我這一日，肚中饑了，你去那裡化些齋吃。」行者陪笑道：「師父好不聰明。這等半山之中，前不巴村，後不著店，有錢也沒買處，教往那裡尋齋？」三藏心中不快，口裡罵道：「你這猴子！想你在兩界山，被如來壓在石匣之內，口能言，足不能行，也虧我救你性命，摩頂受戒，做了我的徒弟。怎麼不肯努力，常懷懶惰之心？」行者道：「弟子亦頗慇懃，何嘗懶惰？」三藏道：「你既慇懃，何不化齋我吃？我肚饑怎行？況此地山嵐瘴氣，怎麼得上雷音？」行者道：「師父休怪，少要言語。我知你尊性高傲，十分違慢了你，便要念那話兒咒。你下馬穩坐，等我尋那裡有人家處化齋去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    一行がこの山に入り、険しい場所に差しかかったとき、三蔵が言った。
    三蔵「悟空、今日は腹が減った。どこかへ行って、食べるものを托鉢しておいで。」
    悟空は愛想笑いを浮かべた。
    悟空「お師匠さま、それはあまりに無理なお話です。こんな山の中腹で、前には村もなく、後ろには宿もない。金があっても買う所がないのに、どこで食べ物を探せというのですか。」
    三蔵は不機嫌になって叱った。
    三蔵「この猿め！　お前が両界山（りょうかいざん）で如来（にょらい）によって石の箱に押し込められ、口はきけても足で歩けなかったとき、命を救ってやったのは私ではないか。頭を撫でて戒を授け、弟子にしてやったのに、どうして力を尽くそうとせず、いつも怠け心を抱くのだ。」
    悟空「弟子の私は、ずいぶんよくお仕えしております。いつ怠けましたか。」
    三蔵「よく仕えているのなら、なぜ食事をもらってこない。腹が減っていては歩けないだろう。ましてここは山の気や瘴気が立ちこめる場所だ。これでどうして雷音寺（らいおんじ）まで行けよう。」
    悟空「お師匠さま、どうかお怒りにならず、そのくらいにしてください。気位がお高く、ひどく逆らって無礼を働けば、あの呪文をお唱えになることは承知しています。馬を下りて落ち着いてお座りください。人家のある所を探し、食べ物をもらってきますから。」
  "translation_status": "reviewed"
- "id": "xy-ch27-007"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者將身一縱，跳上雲端裡，手搭涼篷，睜眼觀看。可憐西方路甚是寂寞，更無莊堡人家，正是多逢樹木，少見人煙去處。看多時，只見正南上有一座高山，那山向陽處，有一片鮮紅的點子。行者按下雲頭道：「師父，有吃的了。」那長老問甚東西。行者道：「這裡沒人家化飯，那南山有一片紅的，想必是熟透了的山桃，我去摘幾個來你充饑。」三藏喜道：「出家人若有桃子吃，就為上分了。」行者取了缽盂，縱起祥光，你看他觔斗幌幌，冷氣颼颼，須臾間，奔南山摘桃不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    悟空はひと跳びして雲の上へ上がり、手をかざして目を凝らした。あいにく西へ通じる道はひどく寂しく、村も集落も人家もない。見えるのは木ばかりで、人の暮らす気配はほとんどなかった。しばらく見渡すうち、真南に高い山があり、その日当たりのよい所に、鮮やかな赤い斑点が一面に見えた。悟空は雲を下ろして言った。
    悟空「お師匠さま、食べ物がありました。」
    三蔵は何があるのかと尋ねた。
    悟空「この辺りには、飯をもらえる人家はありません。南の山に赤く見える所があります。きっと熟しきった山桃でしょう。いくつか取ってきますから、それで空腹をしのいでください。」
    三蔵は喜んだ。
    三蔵「出家の身には、桃が食べられれば上々だ。」
    悟空は鉢を取り、めでたい光を放って飛び立った。宙返りを重ねるたびにひやりと風が吹き、たちまち南の山へ桃を取りに向かった。ひとまずその話は置こう。
  "translation_status": "reviewed"

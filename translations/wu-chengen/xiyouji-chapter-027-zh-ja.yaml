- "id": "xy-ch27-028"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    白髮如彭祖，蒼髯賽壽星。
    耳中鳴玉磬，眼裡幌金星。
    手拄龍頭拐，身穿鶴氅輕。
    數珠掐在手，口誦南無經。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 165
    "line_end": 168
  "translation_ja": |-
    白髪は彭祖（ほうそ）のよう、白い髭は寿星（じゅせい）に勝る。
    耳には玉の磬（けい）の響きが鳴り、目には金の星がちらつく。
    手には竜頭の杖をつき、身には軽やかな鶴氅（かくしょう）をまとう。
    指で数珠を繰りながら、口には南無の経を唱えている。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"

    "message_ja": "「耳中鳴玉磬、眼裡幌金星」は老衰による耳鳴り・目のちらつきと読めるが、本文では磬・金星の原像を残した。南無経は独立した経典名と断定せず「南無の経」と訳した。"
- "id": "xy-ch27-029"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧在馬上見了，心中大喜道：「阿彌陀佛！西方真是福地，那公公路也走不上來，逼法的還念經哩。」八戒道：「師父，你且莫要誇獎，那個是禍的根哩。」唐僧道：「怎麼是禍根？」八戒道：「師兄打殺他的女兒，又打殺他的婆子，這個正是他的老兒尋將來了。我們若撞在他的懷裡啊，師父，你便償命，該個死罪；把老豬為從，問個充軍；沙僧喝令，問個擺站。那師兄使個遁法走了，卻不苦了我們三個頂缸？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    三蔵は馬上からその姿を見て、心から喜んだ。
    三蔵「阿弥陀仏（あみだぶつ）。西方はまことに福のある土地だ。あのお爺さんは歩くのもやっとなのに、なおも懸命に経を唱えている。」
    八戒「お師匠さま、まだ褒めてはいけません。あれこそ災いのもとですよ。」
    三蔵「どうして災いのもとなのだ。」
    八戒「兄貴はあの人の娘を殺し、その妻も殺した。あれはその爺さんが捜しに来たんです。鉢合わせしたら、お師匠さまは命で償って死罪、俺は従犯として辺境へ流され軍役、沙悟浄は大声で指図したとして駅站（えきたん）の労役。ところが兄貴は逃げる術で姿を消す。俺たち三人だけが身代わりに苦しむことになりますよ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「沙僧喝令、問個擺站」の喝令は大声で命じることとして、受身でなく「大声で指図した」と訳した。誰に何を命じたという想定かは省略されており、殺害の指図と断定しない。沙悟浄の実際の行為を語り手が認定するものではなく、八戒の仮定の話である。"
- "id": "xy-ch27-030"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽見道：「這個獃根，這等胡說，可不諕了師父？等老孫再去看看。」他把棍藏在身邊，走上前，迎著怪物，叫聲：「老官兒，往那裡去？怎麼又走路，又念經？」那妖精錯認了定盤星，把孫大聖也當做個等閑的，遂答道：「長老啊，我老漢祖居此地，一生好善齋僧，看經念佛。命裡無兒，止生得一個小女，招了個女婿。今早送飯下田，想是遭逢虎口。老妻先來找尋，也不見回去。全然不知下落，老漢特來尋看。果然是傷殘他命，也沒奈何，將他骸骨收拾回去，安葬塋中。」行者笑道：「我是個做\U0002192B虎的祖宗，你怎麼袖子裡籠了個鬼兒來哄我？你瞞了諸人，瞞不過我，我認得你是個妖精。」那妖精諕得頓口無言。行者掣出棒來，自忖道：「若要不打他，顯得他倒弄個風兒；若要打他，又怕師父念那話兒咒語。」又思量道：「不打殺他，他一時間抄空兒把師父撈了去，卻不又費心勞力去救他？還打的是。就一棍子打殺，師父念起那咒，常言道：『虎毒不吃兒。』憑著我巧言花語，嘴伶舌便，哄他一哄，好道也罷了。」好大聖，念動咒語，叫當坊土地、本處山神道：「這妖精三番來戲弄我師父，這一番卻要打殺他。你與我在半空中作證，不許走了。」眾神聽令，誰敢不從，都在雲端裡照應。那大聖棍起處，打倒妖魔，才斷絕了靈光。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    悟空はそれを聞いた。
    悟空「この大馬鹿、そんなでたらめを言えば、お師匠さまが怖がるではないか。俺がもう一度見てくる。」
    棒を身の陰に隠し、進み出て妖怪を迎え、声をかけた。
    悟空「爺さん、どこへ行くんだ。どうして歩きながら経を唱えている。」
    妖怪は肝心の目盛りを読み違え、悟空まで並の者だと思って答えた。
    老人姿の妖怪「長老さま、私は先祖代々ここに住み、一生、善行を好んで僧に食事を施し、経を読んで念仏してまいりました。息子には恵まれず、一人娘だけを授かり、婿を迎えました。今朝、娘が畑へ飯を届けに行きましたが、どうやら虎に襲われたようなのです。妻が先に捜しに来ましたが、やはり戻りません。まったく行方が分からず、私が捜しに来たのでございます。本当に命を奪われたのなら、それは仕方がありません。せめて遺骨を持ち帰り、墓へ葬ってやりたいと思いまして。」
    悟空は笑った。
    悟空「俺は化け姿で人を脅かすことなら元祖だぞ。袖の中へ小鬼を隠すような手で、俺を欺こうというのか。ほかの者は欺けても、俺は欺けない。お前が妖怪だということは分かっている。」
    妖怪は驚き、言葉を失った。悟空は棒を取り出し、心の中で考えた。
    悟空（心中）「打たなければ、こいつにしてやられる。打てば、お師匠さまがあの呪文を唱えるのが怖い。」
    さらに思い直した。
    悟空（心中）「ここで殺さず、隙を見てお師匠さまをさらわれれば、また苦労して助けに行かなければならない。やはり打つのがよい。一撃で殺して、お師匠さまが呪文を唱えだしても、『虎でさえ自分の子は食わぬ』と言うではないか。このよく回る舌でうまく言いくるめれば、どうにか収まるだろう。」
    そこで悟空は呪文を唱え、この辺りの土地神（とちがみ）と山神（さんじん）を呼び出した。
    悟空「この妖怪は三度も俺のお師匠さまをだましに来た。今度こそ打ち殺す。お前たちは空中で証人になれ。逃がすなよ。」
    神々は命令を受けた。誰が逆らえよう。皆が雲の上で見張るうち、悟空の棒が振り下ろされて妖魔を倒し、今度こそその霊の光も絶えた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「做\U0002192B虎」は類似表記「做吓虎」の語釈と異体字辞典の姿態の語義を参照し「化け姿で人を脅かす」と訳した。底本の珍字自体の本文批判は未完であり、\U0002192Bの字を別版の表記へ補訂せず保持した。"
- "id": "xy-ch27-031"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那唐僧在馬上又諕得戰戰兢兢，口不能言。八戒在傍邊又笑道：「好行者，風發了，只行了半日路，倒打死三個人。」唐僧正要念咒，行者急到馬前叫道：「師父莫念，莫念，你且來看看他的模樣。」卻是一堆粉骷髏在那裡。唐僧大驚道：「悟空，這個人才死了，怎麼就化作一堆骷髏？」行者道：「他是個潛靈作怪的僵尸，在此迷人敗本，被我打殺，他就現了本相。他那脊梁上有一行字，叫做『白骨夫人』。」唐僧聞說，倒也信了。怎禁那八戒傍邊唆嘴道：「師父，他的手重棍兇，把人打死，只怕你念那話兒，故意變化這個模樣，掩你的眼目哩。」唐僧果然耳軟，又信了他，隨復念起。行者禁不得疼痛，跪於路傍，只叫：「莫念，莫念，有話快說了罷。」唐僧道：「猴頭，還有甚說話？出家人行善，如春園之草，不見其長，日有所增；行惡之人，如磨刀之石，不見其損，日有所虧。你在這荒郊野外，一連打死三人，還是無人檢舉，沒有對頭；倘到城市之中，人煙湊集之所，你拿了那哭喪棒，一時不知好歹，亂打起人來，撞出大禍，教我怎的脫身？你回去罷。」行者道：「師父錯怪了我也。這廝分明是個妖魔，他實有心害你。我倒打死他，替你除了害，你卻不認得，反信了那獃子讒言冷語，屢次逐我。常言道：『事不過三。』我若不去，真是個下流無恥之徒。我去，我去。去便去了，只是你手下無人。」唐僧發怒道：「這潑猴越發無禮。看起來，只你是人，那悟能、悟淨就不是人？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    三蔵は馬上でまた震え上がり、口もきけなかった。そばで八戒がまた笑った。
    八戒「たいした悟空だ、気でも違ったのか。半日歩いただけで、三人も殺してしまったぞ。」
    三蔵が呪文を唱えようとすると、悟空は急いで馬の前へ出て呼びかけた。
    悟空「お師匠さま、唱えないで、唱えないでください。まず、こいつの姿を見てください。」
    そこには白い骸骨が一つ残っていた。三蔵はひどく驚いた。
    三蔵「悟空、この人は今死んだばかりなのに、なぜもう骸骨になったのだ。」
    悟空「魂を潜ませて化け物になった死体なのです。ここで人を惑わせ、その命のもとを損なっていました。私に殺されて、本来の姿を現したのです。ほら、背骨に一行の字があり、『白骨夫人（はっこつふじん）』と書いてあります。」
    三蔵はそれを聞いて、いったんは信じた。ところがまた八戒が、そばで口を挟んだ。
    八戒「お師匠さま、兄貴は力も棒も強すぎて、人を殺してしまったんです。あの呪文を唱えられるのが怖くて、わざとこんな姿に変え、目をごまかしているんですよ。」
    三蔵はやはり人の言葉に動かされやすく、また信じて呪文を唱え始めた。悟空は痛みに耐えられず、道端にひざまずいて叫ぶばかりだった。
    悟空「唱えないで、唱えないでください。言いたいことがあるなら、早くおっしゃってください。」
    三蔵「猿め、まだ何を言うことがある。出家の者が善をなすのは春の庭の草のようなもの。伸びるところは目に見えなくとも、日々増していく。悪をなす者は包丁を研ぐ石のようなもの。減るところは目に見えなくとも、日々すり減っていく。お前はこの荒野で立て続けに三人を殺した。今は告発する者も敵討ちを求める者もいないが、もし町や人の集まる場所へ行き、その縁起でもない棒を持って、分別もなくやたら人を打ち、大変な災いを起こしたら、私はどうして逃れられる。帰ってしまえ。」
    悟空「お師匠さまは私を誤解しておられます。あいつは紛れもなく妖魔で、本気であなたを害そうとしていました。私が打ち殺して害を除いたのに、そのことは分かってくださらず、あの間抜けの中傷や冷たい言葉を信じ、何度も私を追い払おうとなさる。『何事も三度まで』と言います。ここで去らなければ、私こそ下劣な恥知らずです。行きます、行きます。行くのはよいのですが、お手元に頼れる者がいなくなりますよ。」
    三蔵は怒り出した。
    三蔵「この無礼な猿は、ますます増長する。お前だけが一人前で、悟能（ごのう）も悟浄（ごじょう）も一人前ではないとでもいうのか。」
  "translation_status": "reviewed"
- "id": "xy-ch27-032"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖一聞得說他兩個是人，止不住傷情悽慘，對唐僧道聲：「苦啊！你那時節出了長安，有劉伯欽送你上路。到兩界山，救我出來，投拜你為師。我曾穿古洞，入深林，擒魔捉怪，收八戒，得沙僧，吃盡千辛萬苦。今日昧著惺惺使糊塗，只教我回去。這才是：『鳥盡弓藏，兔死狗烹！』罷，罷，罷，但只是多了那緊箍兒咒。」唐僧道：「我再不念了。」行者道：「這個難說。若到那毒魔苦難處不得脫身，八戒、沙僧救不得你，那時節想起我來，忍不住又念誦起來。就是十萬里路，我的頭也是疼的，假如再來見你，不如不作此意。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    悟空は、二人も一人前だと言われると、悲しみがこみ上げ、三蔵へ訴えた。
    悟空「ああ、つらいことです。あのとき長安（ちょうあん）を出られたお師匠さまを、劉伯欽（りゅうはくきん）が道案内しました。両界山に着くと、お師匠さまは私を救い出してくださいました。そこで私はあなたを師と仰いだのです。古い洞をくぐり、深い林に入り、魔物を捕らえ妖怪を倒し、八戒を降して仲間に迎え、沙悟浄も仲間に加え、あらゆる辛苦をなめました。ところが今日は、分かっていながら知らぬふりをして、ただ私を帰らせようとなさる。これこそ『鳥が尽きれば弓をしまい、兎が死ねば猟犬を煮る』です。もうよい、もうよい、もうよい。ただ、あの緊箍児呪だけが余計なのです。」
    三蔵「もう二度と唱えない。」
    悟空「それは分かりませんよ。凶悪な妖魔に苦しめられて逃れられず、八戒にも沙悟浄にも救えないとき、私を思い出し、ついまた唱え始めるでしょう。十万里離れていても、私の頭は痛むのです。それでまた会いに来るくらいなら、初めから帰るなどと考えないほうがましです。」
  "translation_status": "reviewed"
- "id": "xy-ch27-033"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧見他言言語語，越添惱怒，滾鞍下馬來，叫沙僧包袱內取出紙筆，即於澗下取水，石上磨墨，寫了一紙貶書，遞於行者道：「猴頭，執此為照，再不要你做徒弟了；如再與你相見，我就墮了阿鼻地獄。」行者連忙接了貶書道：「師父，不消發誓，老孫去罷。」他將書摺了，留在袖內，卻又軟款唐僧道：「師父，我也是跟你一場，又蒙菩薩指教，今日半塗而廢，不曾成得功果，你請坐，受我一拜，我也去得放心。」唐僧轉回身不睬，口裡唧唧噥噥的道：「我是個好和尚，不受你歹人的禮。」大聖見他不睬，又使個身外法，把腦後毫毛拔了三根，吹口仙氣，叫：「變！」即變了三個行者，連本身四個，四面圍住師父下拜。那長老左右躲不脫，好道也受了一拜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    三蔵は悟空の言葉を聞くほどに怒りを募らせ、さっと馬から下りた。沙悟浄に包みから紙と筆を出させ、沢で水を汲み、石の上で墨を磨り、一通の破門状を書いた。それを悟空へ差し出す。
    三蔵「猿め、これを証しに持っていけ。もうお前を弟子にはしない。再びお前と会うようなことがあれば、私は阿鼻地獄（あびじごく）へ落ちよう。」
    悟空は急いで破門状を受け取った。
    悟空「お師匠さま、誓いなどお立てになるには及びません。私は去ります。」
    その書状を折って袖の中へしまうと、また穏やかに三蔵へ願った。
    悟空「お師匠さま、ともかく一度はお供をし、菩薩からもお導きを頂きました。それが今日、道半ばで終わり、功徳を成し遂げられませんでした。どうぞお座りになり、一度お礼の拝をさせてください。そうすれば、私も心安く去れます。」
    三蔵は背を向けて相手にせず、ぶつぶつ言った。
    三蔵「私は善い僧だ。お前のような悪人の礼は受けない。」
    悟空は相手にされないと見ると、また身外の術を使った。後頭部の毛を三本抜き、仙気を吹きかけて命じた。
    悟空「変われ！」
    たちまち三人の悟空が現れ、本体を合わせた四人で四方から師を囲み、頭を下げた。三蔵は右へ左へ避けても逃れられず、とうとう一度の拝礼を受けた。
  "translation_status": "reviewed"
- "id": "xy-ch27-034"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖跳起來，把身一抖，收上毫毛，卻又吩咐沙僧道：「賢弟，你是個好人，卻只要留心防著八戒詀言詀語，途中更要仔細。倘一時有妖精拿住師父，你就說老孫是他大徒弟，西方毛怪聞我的手段，不敢傷我師父。」唐僧道：「我是個好和尚，不題你這歹人的名字，你回去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    悟空は跳び上がり、身を振るって毛を収めると、沙悟浄へ言い聞かせた。
    悟空「弟よ、お前は善い奴だ。ただ、八戒の口先の言葉には気をつけろ。旅の途中ではなおさら用心してくれ。もし妖怪にお師匠さまを捕らえられたら、この俺が一番弟子だと言うんだ。西方の毛むくじゃらの妖怪どもは、俺の腕前を聞けば、怖くてお師匠さまには手を出せない。」
    三蔵「私は善い僧だ。お前のような悪人の名は出さない。帰ってしまえ。」
  "translation_status": "reviewed"
- "id": "xy-ch27-035"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖見長老三番兩復，不肯轉意回心，沒奈何才去。你看他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 178
    "line_end": 178
  "translation_ja": "悟空は、三蔵が何度言っても決して考えを変えず、心を戻してくれないのを見て、どうしようもなく、ようやく立ち去った。その姿は。"
  "translation_status": "reviewed"
- "id": "xy-ch27-036"
  "section_id": "chapter-27"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    噙淚叩頭辭長老，含悲留意囑沙僧。
    一頭拭迸坡前草，兩腳蹬翻地上藤。
    上天下地如輪轉，跨海飛山第一能。
    頃刻之間不見影，霎時疾返舊途程。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 179
    "line_end": 182
  "translation_ja": |-
    涙をため、頭を地につけて師に別れを告げ、悲しみをこらえ、沙悟浄へ心を込めて頼み置く。
    頭は坂の草をかき分け、両足は地の藤蔓を蹴り返す。
    天へ地へと輪のように飛び巡り、海を越え山を飛ぶ力は天下一。
    たちまち影も見えなくなり、あっという間に昔の道へ引き返した。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「一頭拭迸坡前草」は難句。頭が坂の草を払い分ける動作と解し、次句の両足の動きに対して訳した。拭迸の語義・底本の字形は独立校訂を要する。"
- "id": "xy-ch27-037"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他忍氣別了師父，縱觔斗雲，徑回花果山水簾洞去了。獨自個悽悽慘慘，忽聞得水聲聒耳。大聖在那半空裡看時，原來是東洋大海潮發的聲響。一見了，又想起唐僧，止不住腮邊淚墜，停雲住步，良久方去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 184
    "line_end": 184
  "translation_ja": "悟空は怒りをこらえて師と別れ、觔斗雲（きんとうん）に乗り、まっすぐ花果山の水簾洞へ帰っていった。独り悲しみに沈んでいると、突然、耳を騒がす水音が聞こえた。空中から見ると、東の大海で潮が湧き起こす音だった。それを目にすると、また三蔵を思い出し、頬へ落ちる涙を止められなかった。雲を止めて足をとどめ、長い間そこにいてから、ようやく立ち去った。"
  "translation_status": "reviewed"
- "id": "xy-ch27-038"
  "section_id": "chapter-27"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去反復何如，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch27-1455576"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第027回&oldid=1455576"
    "line_start": 186
    "line_end": 186
  "translation_ja": "さて、この別れののち、どのような曲折が待ち受けるのか。それは次回のお話で。"
  "translation_status": "reviewed"

      第八十七回
      鳳仙郡、天を冒して旱魃を招き〔別題では「雨を止められ」〕　孫大聖、善を勧めて恵みの雨を施す
    "translation_status": "reviewed"
  - "id": "xy-ch87-002"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": "大道幽深，如何消息，說破鬼神驚駭。挾藏宇宙，剖判玄光，真樂世間無賽。靈鷲峰前，寶珠拈出，明映五般光彩。照乾坤上下群生，知者壽同山海。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      大道（だいどう）は奥深く、いかにその機微を伝えよう。
      明かしてしまえば、鬼神さえ驚きおののく。
      宇宙を内に包み、玄妙な光を解き明かせば、
      その真の楽しみに並ぶものは、この世にない。
      霊鷲峰（りょうじゅほう）の前で、宝珠をつまんで差し出せば、
      五色の輝きが、明らかに映える。
      天地の上下、あらゆる生き物を照らし、
      これを知る者の寿命は、山や海と等しく長い。
    "translation_status": "reviewed"
  - "id": "xy-ch87-003"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏師徒四眾別樵子，下了隱霧山，奔上大路。行經數日，忽見一座城池相近。三藏道：「悟空，你看那前面城池，可是天竺國麼？」行者搖手道：「不是，不是。如來處雖稱極樂，卻沒有城池，乃是一座大山，山中有樓臺殿閣，喚做靈山大雷音寺。就到了天竺國，也不是如來住處，天竺國還不知離靈山有多少路哩。那城想是天竺之外郡，到邊前方知明白。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      さて、三蔵（さんぞう）たち師弟四人は木こりと別れ、隠霧山（いんむざん）を下って街道へ出た。数日旅を続けるうち、ふと近くに城郭が見えてきた。
      三蔵「悟空（ごくう）、あの前方の城を見ておくれ。天竺国（てんじくこく）だろうか。」
      悟空は手を振った。
      悟空「違います、違います。如来（にょらい）のおられる所は極楽（ごくらく）といいますが、城郭はありません。大きな山が一つあって、その山中に楼台や御殿が建っています。そこを霊山大雷音寺（れいざんだいらいおんじ）というのです。たとえ天竺国に着いても、そこが如来のお住まいではありません。天竺国から霊山（れいざん）まで、まだどれほど道のりがあるか分からないのですから。あの城は、おそらく天竺（てんじく）の外郡でしょう。近くまで行けば、はっきりします。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-004"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不一時至城外，三藏下馬，入到三層門裡，見那民事荒涼，街衢冷落。又到市口之間，見許多穿青衣者左右擺列，有幾個冠帶者立於房簷之下。他四眾順街行走，那些人更不遜避。豬八戒村愚，把長嘴掬一掬，叫道：「讓路，讓路。」那些人猛擡頭，看見模樣，一個個骨軟筋麻，跌跌蹡蹡，都道：「妖精來了，妖精來了！」諕得那簷下冠帶者戰兢兢躬身問道：「那方來者？」三藏恐他們闖禍，一力當先，對眾道：「貧僧乃東土大唐駕下拜天竺國大雷音寺佛祖求經者。路過寶方，一則不知地名，二則未落人家，才進城甚失迴避，望列公恕罪。」那官人卻才施禮道：「此處乃天竺外郡，地名鳳仙郡。連年乾旱，郡侯差我等在此出榜，招求法師祈雨救民也。」行者聞言道：「你的榜文何在？」眾官道：「榜文在此，適間才打掃廊簷，還未張掛。」行者道：「拿來我看看。」眾官即將榜文展開，掛在簷下。行者四眾上前同看。榜上寫著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      ほどなく城外に着いた。三蔵は馬を下り、三重の門をくぐったが、民の暮らしは荒れ果て、街路はひっそりしていた。さらに市場の入口へ行くと、青い衣の者が大勢左右に並び、冠をかぶり帯を締めた者も何人か軒下に立っていた。四人が通りを進んでも、彼らは道を譲ろうとしない。八戒（はっかい）は野暮で分別がなく、長い口を突き出して叫んだ。
      八戒「どいた、どいた！」
      人々ははっと顔を上げ、その姿を見ると、そろって腰が抜け、手足がしびれ、よろよろとよろめいて口々に叫んだ。
      人々「妖怪が来た、妖怪が来た！」
      軒下で冠と帯を着けていた者も、恐ろしさに震えながら身をかがめて尋ねた。
      冠と帯を着けた者「どちらからお越しの方々でしょうか。」
      三蔵は弟子たちが騒ぎを起こすのを恐れ、一人で先頭に出て、皆に告げた。
      三蔵「私は東土（とうど）の大唐（だいとう）皇帝のもとから、天竺国の大雷音寺（だいらいおんじ）へ仏祖（ぶっそ）を拝み、経典を求めに参った僧でございます。この土地を通りかかりましたが、地名も存じませんし、まだ宿も決まっておりません。城へ入ったばかりで、皆さまをお避けすることもせず、大変失礼いたしました。どうかお許しください。」
      役人はそこでようやく礼をした。
      役人「ここは天竺の外郡で、鳳仙郡（ほうせんぐん）と申します。年々旱魃が続いておりますので、郡侯（ぐんこう）さまが私どもをここへ遣わし、掲示を出して、雨を祈り民を救う法師を求めておられるのです。」
      悟空はそれを聞いて尋ねた。
      悟空「その掲示はどこだ。」
      役人たち「ここにございます。今しがた軒下を掃除したばかりで、まだ張ってはおりません。」
      悟空「持ってきて、見せてくれ。」
      役人たちは掲示を広げ、軒下へ掛けた。悟空たち四人が前に出て、一緒に見ると、次のように書いてあった。
    "translation_status": "reviewed"
  - "id": "xy-ch87-005"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大天竺國鳳仙郡郡侯上官，為榜聘明師，招求大法事：茲因郡土寬弘，軍民殷實，連年亢旱，累歲乾荒，民田菑而軍地薄，河道淺而溝澮空。井中無水，泉底無津。富室聊以全生，窮民難以活命。斗粟百金之價，束薪五兩之資。十歲女易米三升，五歲男隨人帶去。城中懼法，典衣當物以存身；鄉下欺公，打劫吃人而顧命。為此出給榜文，仰　望十方賢哲，禱雨救民。恩當重報，願以千金奉謝，決不虛言。須至榜者。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      大天竺国（だいてんじくこく）鳳仙郡郡侯・上官（じょうかん）より、優れた法師を招き、大いなる法力を求めるための告示。
      当郡は土地が広く、軍も民も豊かに暮らしていた。しかるに年々ひどい旱魃に遭い、何年も日照りによる飢饉が続いている。民の田は荒れ、軍の耕地はやせ、川は浅くなり、用水路は空となった。井戸には水がなく、泉の底も乾いている。富める家はどうにか命をつないでいるが、貧しい民は生きてゆくのも難しい。粟一斗（と）の値は百金、薪一束の代は五両（りょう）となった。十歳の娘を米三升（しょう）と引き換えにし、五歳の男の子は、人に連れていかれるに任せている。城内では法を恐れ、衣や品物を質に入れて身を保ち、郷村ではお上を侮って、強盗や人食いで命をつないでいる。
      このため、ここに掲示を出し、あらゆる方角の賢者に、雨を祈って民を救ってくださるよう、仰いでお願いする。その恩には厚く報い、千金を差し上げて謝意を表す。決して偽りはない。よって告示する。
    "translation_status": "reviewed"
  - "id": "xy-ch87-006"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者看罷，對眾官道：「郡侯上官何也？」眾官道：「上官乃是姓，此我郡侯之姓也。」行者笑道：「此姓卻少。」八戒道：「哥哥不曾讀書。《百家姓》後有一句『上官歐陽』。」三藏道：「徒弟們，且休閑講。那個會求雨，與他求一場甘雨，以濟民瘼，此乃萬善之事；如不會，就行，莫誤了走路。」行者道：「祈雨有甚難事？我老孫翻江攪海、換斗移星，踢天弄井、吐霧噴雲，擔山趕月、喚雨呼風：那一件兒不是幼年耍子的勾當？何為稀罕？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      読み終えた悟空は、役人たちに尋ねた。
      悟空「『郡侯・上官』ってのは、どういうことだ。」
      役人たち「上官とは姓でございます。私どもの郡侯さまのお姓です。」
      悟空は笑った。
      悟空「珍しい姓だな。」
      八戒「兄貴は本を読まないからな。『百家姓（ひゃっかせい）』の後ろのほうに、『上官、欧陽（おうよう）』という一節があるんだ。」
      三蔵「弟子たち、無駄話はよしなさい。誰か雨を祈れるなら、恵みの雨を降らせて、民の苦しみを救っておくれ。この上もない善行だ。できないのなら、出発しよう。旅を遅らせてはならない。」
      悟空「雨を祈るくらい、何が難しいものですか。この俺にとっちゃ、川をひっくり返し海をかき回すのも、星の並びを変え星を移すのも、天を蹴り井戸を弄ぶのも、霧を吐き雲を噴くのも、山を担いで月を追うのも、雨を呼び風を招くのも、どれだって子供のころの遊びです。珍しくもありませんよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-007"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾官聽說，著兩個急去郡中報道：「老爺，萬千之喜至也。」那郡侯正焚香默祝，聽得報聲喜至，即問：「何喜？」那官道：「今日領榜，方至市口張掛，即有四個和尚，稱是東土大唐差往天竺國大雷音拜佛求經者，見榜即道能祈甘雨，特來報知。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      これを聞いた役人たちは、二人を急いで郡の役所へ報告に走らせた。
      二人の役人「お殿さま、この上もない喜びごとでございます！」
      郡侯はちょうど香をたき、黙って祈っていた。喜びごとの知らせを聞くと、すぐに尋ねた。
      郡侯「何が喜ばしいのだ。」
      役人「今日、掲示を受け取り、市場の入口へ張りに行きますと、ちょうど四人の僧が現れました。東土の大唐から、天竺国の大雷音（だいらいおん）へ仏を拝み、経典を求めるために遣わされたと申しております。掲示を見るなり、恵みの雨を祈れると申しましたので、お知らせに参ったのでございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-008"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那郡侯即整衣步行，不用轎馬多人，徑至市口，以禮敦請。忽有人報道：「郡侯老爺來了。」眾人閃過。那郡侯一見唐僧，不怕他徒弟醜惡，當街心倒身下拜道：「下官乃鳳仙郡郡侯上官氏，熏沐拜請老師祈雨救民。望師大捨慈悲，運神功，拔濟拔濟。」三藏答禮道：「此間不是講話處，待貧僧到那寺觀，卻好行事。」郡侯道：「老師同到小衙，自有潔淨之處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      郡侯はすぐに衣服を整え、輿も馬も大勢の供も使わず、歩いてまっすぐ市場の入口へ向かい、礼を尽くして招こうとした。そのとき、誰かが告げた。
      告げる者「郡侯さまがお見えだ！」
      人々はさっと道を開けた。郡侯は三蔵を見るや、弟子たちの醜い姿も恐れず、通りの真ん中で身を伏せて拝した。
      郡侯「私は鳳仙郡の郡侯、上官でございます。身を清め、香をたいて、お師匠さまに雨を祈り、民を救っていただきたいとお願い申し上げます。どうか大いなる慈悲を施し、神通の力をお働かせになって、お救いください。お救いください。」
      三蔵は答礼した。
      三蔵「ここはお話をする場所ではありません。私がどこかの寺や道観へ落ち着いてからなら、事を進めやすいでしょう。」
      郡侯「お師匠さま、私の役所へご一緒においでください。清浄な場所をご用意できます。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-009"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們遂牽馬挑擔，徑至府中，一一相見。郡侯即命看茶擺齋，少頃齋至。那八戒放量吞餐，如同餓虎。諕得那些捧盤的心驚膽戰，一往一來，添湯添飯，就如走馬燈兒一般，剛剛供上，直吃得飽滿方休。齋畢，唐僧謝了齋，卻問：「郡侯大人，貴處乾旱幾時了？」郡侯道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      そこで師弟は馬を引き、荷を担いで役所へ向かい、一人ずつ挨拶を交わした。郡侯は茶を出し、精進の食事を用意するよう命じた。ほどなく食事が運ばれると、八戒は飢えた虎さながら、好きなだけのみ込んだ。膳を運ぶ者たちは肝を冷やし、震え上がる。汁を足し、飯を足して行ったり来たり、まるで走馬灯のように駆け回り、かろうじて間に合わせた。八戒は腹いっぱいになるまで食べ、ようやく手を止めた。食事が終わると、三蔵は礼を述べ、尋ねた。
      三蔵「郡侯どの、この土地の旱魃は、どれほど続いているのですか。」
      郡侯は答えた。
    "translation_status": "reviewed"
  - "id": "xy-ch87-010"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「敝地大邦天竺國，風仙外郡吾司牧。
      一連三載遇乾荒，草子不生絕五穀。
      大小人家買賣難，十門九戶俱啼哭。
      三停餓死二停人，一停還似風中燭。
      下官出榜遍求賢，幸遇真僧來我國。
      若施寸雨濟黎民，願奉千金酬厚德！」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 135
        "line_end": 140
    "translation_ja": |-
      郡侯「この土地は、大国たる天竺国に属し、
      私はその外郡、風仙（ふうせん）を治めております。
      三年続けて日照りの飢饉に遭い、
      草の種も芽を出さず、五穀は絶えました。
      大きな家も小さな家も、売り買いに苦しみ、
      十軒あれば九軒までが泣いております。
      人々の三分の二は餓死し、
      残る三分の一も、風の中の灯火です。
      私は掲示を出し、あまねく賢者を求めましたが、
      幸いにも真の高僧が、わが国へ来てくださいました。
      もしわずかの雨でも施し、民を救ってくださるなら、
      千金を奉り、厚いご恩に報いたく存じます！」
    "translation_status": "reviewed"
  - "id": "xy-ch87-011"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽說，滿面喜生，呵呵的笑道：「莫說，莫說。若說千金為謝，半點甘雨全無；但論積功累德，老孫送你一場大雨。」那郡侯原來十分清正賢良，愛民心重，即請行者上坐，低頭下拜道：「老師果捨慈悲，下官必不敢悖德。」行者道：「且莫講話，請起。但煩你好生看著我師父，等老孫行事。」沙僧道：「哥哥，怎麼行事？」行者道：「你和八戒過來，就在他這堂下隨著我做個羽翼，等老孫喚龍來行雨。」八戒、沙僧謹依使令，三個人都在堂下。郡侯焚香禮拜。三藏坐著念經。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      悟空はそれを聞くと、顔いっぱいに喜びを浮かべ、はははと笑った。
      悟空「それは言わないでくれ、言わないでくれ。礼に千金くれるという話なら、恵みの雨は半滴もないぞ。ただ功徳を積むということなら、この俺が大雨を一降り贈ってやる。」
      もともと郡侯はきわめて清廉で賢明な人物であり、民を思う心も深かった。すぐ悟空を上座へ招き、頭を下げて拝した。
      郡侯「お師匠さまが本当に慈悲をお施しくださるなら、私は決してそのご恩に背きません。」
      悟空「話はもういい。さあ、立ってくれ。ただ、お師匠さまのお世話をしっかり頼む。俺が術を使うからな。」
      沙悟浄（さごじょう）「兄さん、どのようにするのですか。」
      悟空「お前と八戒はこっちへ来い。この広間の下で俺について、両脇を助けてくれ。俺が竜を呼び、雨を降らせる。」
      八戒と沙悟浄は謹んで言いつけに従い、三人とも広間の下に立った。郡侯は香をたいて礼拝し、三蔵は座ったまま経を読んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch87-012"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者念動真言，誦動咒語，即時見正東上一朵烏雲，漸漸落至堂前，乃是東海老龍王敖廣。那敖廣收了雲腳，化作人形，走向前，對行者躬身施禮道：「大聖喚小龍來，那方使用？」行者道：「請起。累你遠來，別無甚事。此間乃鳳仙郡，連年乾旱，問你如何不來下雨？」老龍道：「啟上大聖得知：我雖能行雨，乃上天遣用之輩。上天不差，豈敢擅自來此行雨？」行者道：「我因路過此方，見久旱民苦，特著你來此施雨求濟，如何推託？」龍王道：「豈敢推託？但大聖念真言呼喚，不敢不來。一則未奉上天御旨，二則未曾帶得行雨神將，怎麼動得雨部？大聖既有拔濟之心，容小龍回海點兵，煩大聖到天宮奏准，請一道降雨的聖旨，請水官放出龍來，我卻好照旨意數目下雨。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空が真言を念じ、呪文を唱えると、たちまち真東に黒雲が一つ現れ、次第に広間の前へ下りてきた。東海（とうかい）の老竜王、敖広（ごうこう）であった。敖広は雲を収め、人の姿となって前へ進み、悟空に身をかがめて礼をした。
      敖広「大聖（たいせい）、私をお呼びになったのは、どちらへお使いになるためでしょうか。」
      悟空「顔を上げてくれ。遠くから来てもらったが、ほかでもない。ここは鳳仙郡で、何年も旱魃が続いている。どうして雨を降らせに来ないんだ。」
      敖広「大聖に申し上げます。私は雨を降らせることはできますが、天から命じられて働く身でございます。天の命もないのに、どうして勝手にここへ来て、雨を降らせられましょう。」
      悟空「俺はここを通りかかって、長い日照りで民が苦しんでいるのを見た。そこでわざわざお前を呼び、雨を施して救ってもらおうとしたんだ。どうして言い逃れをする。」
      敖広「どうして言い逃れなどいたしましょう。ただ、大聖が真言を唱えてお呼びになったので、参らないわけにはいかなかったのです。第一に天の勅命を頂いておらず、第二に雨を降らす神将も連れておりません。どうして雨部（うぶ）を動かせましょう。大聖にお救いになるお心があるのなら、私を海へ戻らせ、兵を集めさせてください。大聖にはお手数ですが天宮へ上奏し、雨を降らせる勅命を一通お受けいただき、水官（すいかん）に竜を出すようお命じいただきたいのです。そうすれば私は、勅命に定められた量の雨を降らせられます。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-013"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見他說出理來，只得發放老龍回海。他即跳出罡斗，對唐僧備言龍王之事。唐僧道：「既然如此，你去為之，切莫打誑語。」行者即吩咐八戒、沙僧：「保著師父，我上天宮去也。」好大聖，說聲去，寂然不見。那郡侯膽戰心驚道：「孫老爺那裡去了？」八戒笑道：「駕雲上天去了。」郡侯十分恭敬，傳出飛報，教滿城大街小巷，不拘公卿士庶、軍民人等，家家供養龍王牌位，門設清水缸，缸插楊柳枝，侍奉香火，拜天不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      悟空はその説明が筋の通ったものと知り、やむなく敖広を海へ帰らせた。そして罡斗（こうと）の歩法から跳び出し、三蔵に竜王の話を詳しく伝えた。
      三蔵「そういうことなら、お前が行って進めておくれ。決して嘘になってはならないよ。」
      悟空は八戒と沙悟浄に言いつけた。
      悟空「お師匠さまをお守りしろ。俺は天宮へ行ってくる。」
      さすが悟空、「行く」と言ったとたん、ひっそり姿を消した。郡侯は肝をつぶし、震えながら尋ねた。
      郡侯「孫（そん）さまは、どこへ行かれたのですか。」
      八戒は笑った。
      八戒「雲に乗って、天へ行ったんだ。」
      郡侯は深く敬服し、急ぎ触れを出した。城じゅうの大通りから路地まで、公卿も士人も庶民も、兵士も住民も区別なく、各家で竜王の位牌を供養し、門前に清水を入れた甕を置き、その甕に柳の枝を挿し、香をたいて仕え、天を拝むよう命じた。この話はいったんおく。
    "translation_status": "reviewed"
  - "id": "xy-ch87-014"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者一駕觔斗雲，徑到西天門外，早見護國天王引天丁、力士上前迎接道：「大聖，取經之事完乎？」行者道：「也差不遠矣。今行至天竺國界，有一外郡，名鳳仙郡。彼處三年不雨，民甚艱苦，老孫欲祈雨拯救。呼得龍王到彼，他言無旨，不敢私自為之，特來朝見玉帝請旨。」天王道：「那壁廂敢是不該下雨哩。我向時聞得說：那郡侯撒潑，冒犯天地，上帝見罪，立有米山、麵山、黃金大鎖，直等此三事倒斷，才該下雨。」行者不知此意是何，要見玉帝。天王不敢攔阻，讓他進去。徑至通明殿外，又見四大天師迎道：「大聖到此何幹？」行者道：「因保唐僧，路至天竺國界，鳳仙郡無雨，郡侯召師祈雨。老孫呼得龍王，意命降雨，他說未奉玉帝旨意，不敢擅行，特來求旨，以甦民困。」四大天師道：「那方不該下雨。」行者笑道：「該與不該，煩為引奏引奏，看老孫的人情何如。」葛仙翁道：「俗語云：『蒼蠅包網兒──好大面皮。』」許旌陽道：「不要亂談，且只帶他進去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      さて、悟空は觔斗雲（きんとうん）に乗り、まっすぐ西天門（さいてんもん）の外へ着いた。早くも護国天王（ごこくてんのう）が、天兵や力士を率いて迎えに出てきた。
      護国天王「大聖、経を求める旅は終わったのか。」
      悟空「もう、そう遠くはありません。今は天竺国の境へ来ていまして、鳳仙郡という外郡があります。そこでは三年も雨が降らず、民がひどく苦しんでいるのです。俺は雨を祈って救おうと思い、竜王を呼んだのですが、勅命がないから勝手にはできないと言います。そこで玉帝（ぎょくてい）にお目にかかり、ご命令を頂きに来たのです。」
      護国天王「そこは、雨を降らせてはならぬ所なのだろう。以前、聞いた話では、そこの郡侯が乱暴を働いて天地を冒瀆し、上帝（じょうてい）のおとがめを受けたそうだ。米の山、粉の山、それに大きな黄金の錠が置かれ、この三つが崩れたり切れたりして初めて、雨を降らせてよいというのだ。」
      悟空はその話がどういう意味か分からず、玉帝への面会を求めた。天王もあえて妨げず、中へ通した。まっすぐ通明殿（つうめいでん）の外へ行くと、今度は四大天師（しだいてんし）が迎えて尋ねた。
      四大天師「大聖、何の用でここへ来たのですか。」
      悟空「唐僧（とうそう）を守って旅をし、天竺国の境まで来たところ、鳳仙郡に雨がなく、郡侯が法師を招いて雨を祈らせようとしていました。俺は竜王を呼び、雨を降らせようとしたのですが、玉帝のご命令を受けていないから、勝手にはできないと言います。そこで、民の苦しみを救うため、ご命令を頂きに来たのです。」
      四大天師「あの土地には、雨を降らせてはなりません。」
      悟空は笑った。
      悟空「いいか悪いか、とにかく取り次いでくださいよ。この俺の顔が、どれだけ利くか見てみましょう。」
      葛仙翁（かっせんおう）「諺にもいうでしょう。『蠅が頭巾をかぶるとは、ずいぶん大きな面の皮だ』と。」
      許旌陽（きょせいよう）「余計な話はよしなさい。まずは中へ連れていきましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-015"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "丘洪濟、張道陵與葛、許四真人引至靈霄殿下，啟奏道：「萬歲，有孫悟空路至天竺國鳳仙郡，欲與求雨，特來請旨。」玉帝道：「那廝三年前十二月二十五日，朕出行監觀萬天，浮遊三界。駕至他方，見那上官正不仁，將齋天素供推倒喂狗，口出穢言，造有冒犯之罪，朕即立以三事，在於披香殿內。汝等引孫悟空去看：若三事倒斷，即降旨與他；如不倒斷，且休管閑事。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      丘弘済（きゅうこうさい）、張道陵（ちょうどうりょう）、それに葛仙翁、許旌陽の四真人は悟空を霊霄殿（れいしょうでん）の下へ案内し、上奏した。
      四大天師「陛下、孫悟空（そんごくう）が天竺国の鳳仙郡へ行き、そこのために雨を祈ろうとして、勅命を頂きに参っております。」
      玉帝「あの者は、三年前の十二月二十五日、罪を犯した。その日、私はあらゆる天を見回り、三界（さんがい）を巡っていた。かの地へ赴くと、上官という者がまさに不仁を働き、天に供える精進の供物をひっくり返して犬に食わせ、口汚い言葉を吐き、冒瀆の罪を犯していた。そこで私は、披香殿（ひこうでん）の中に三つのものを置いた。汝らは孫悟空を連れていって見せよ。その三つが崩れ切れていれば、あの者のために勅命を下そう。崩れ切れていなければ、余計なことにはかかわるな。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-016"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四天師即引行者至披香殿裡看時，見有一座米山，約有十丈高下；一座麵山，約有二十丈高下。米山邊有一隻拳大之雞，在那裡緊一嘴，慢一嘴，嗛那米吃。麵山邊有一隻金毛哈巴狗兒，在那裡長一舌，短一舌，餂那麵吃。左邊懸一座鐵架子，架上掛一把金鎖，約有一尺三四寸長短，鎖梃有指頭粗細，下面有一盞明燈，燈焰兒燎著那鎖梃。行者不知其意，回頭問天師曰：「此何意也？」天師道：「那廝觸犯了上天，玉帝立此三事，直等雞嗛了米盡，狗餂得麵盡，燈焰燎斷鎖梃，那方才該下雨哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      四天師（してんし）はすぐ悟空を披香殿の中へ案内した。見ると、高さ十丈（じょう）ほどの米の山と、高さ二十丈ほどの粉の山があった。米の山のそばには拳ほどの大きさの鶏が一羽いて、せわしくついばんだり、ゆっくりついばんだりして、米を食べている。粉の山のそばには金毛の小さな愛玩犬が一匹いて、舌を長く伸ばしたり、短く出したりしながら、粉をなめていた。左には鉄の枠が下がり、その上に金の錠が一つ掛かっている。長さは一尺（しゃく）三、四寸（すん）ほどで、錠を閉じる棒は指ほどの太さがある。その下に明るい灯火が一つあり、炎がその棒をあぶっていた。悟空は意味が分からず、天師を振り返って尋ねた。
      悟空「これは、どういうことですか。」
      天師「あの者が天に背いたので、玉帝はこの三つを設けられたのです。鶏が米をすべてついばみ、犬が粉をすべてなめ、灯の炎が錠の棒を焼き切って初めて、あの土地へ雨を降らせてよいのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-017"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，大驚失色，再不敢啟奏，走出殿，滿面含羞。四天師笑道：「大聖不必煩惱，這事只宜作善可解。若有一念善慈，驚動上天，那米、麵山即時就倒，鎖梃即時就斷。你去勸他歸善，福自來矣。」行者依言，不上靈霄辭玉帝，徑來下界復凡夫。須臾，到西天門，又見護國天王。天王道：「請旨如何？」行者將米山、麵山、金鎖之事說了一遍，道：「果依你言，不肯傳旨。適間天師送我，教勸那廝歸善，即福原也。」遂相別，降雲下界。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      悟空はそれを聞くと、顔色を変えて驚き、もう一度上奏する勇気もなく、恥ずかしさを顔いっぱいに浮かべて殿を出た。四天師は笑って言った。
      四大天師「大聖、悩むことはありません。この事は、ただ善を行えば解けます。慈悲の善念が一つでも生じて天に届けば、米と粉の山はたちまち崩れ、錠の棒もたちまち切れます。あの者に善へ立ち返るよう勧めなさい。福はおのずと訪れます。」
      悟空はその言葉に従い、玉帝へ別れを告げるために霊霄殿へ戻ることもせず、下界へ下りて人間に知らせようとした。ほどなく西天門に来ると、また護国天王に会った。
      護国天王「勅命を願い出た結果は、どうだった。」
      悟空は米の山、粉の山、金の錠のことを一通り話した。
      悟空「おっしゃったとおり、命を下してくださいませんでした。さっき天師たちが見送ってくれた時、あの男に善へ立ち返るよう勧めれば、それが福のもとになると教えてくれました。」
      こうして別れを告げ、雲を下げて地上へ戻った。
    "translation_status": "reviewed"
  - "id": "xy-ch87-018"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那郡侯同三藏、八戒、沙僧、大小官員人等接著，都簇簇攢攢來問。行者將郡侯喝了一聲道：「只因你這廝三年前十二月二十五日冒犯了天地，致令黎民有難，如今不肯降雨。」慌得郡侯跪伏在地道：「老師如何得知三年前事？」行者道：「你把那齋天的素供，怎麼推倒喂狗？可實實說來。」那郡侯不敢隱瞞，道：「三年前十二月二十五日，獻供齋天，在於本衙之內，因妻不賢，惡言相鬥，一時怒發無知，推倒供桌，潑了素饌，果是喚狗來吃了。這兩年憶念在心，神思恍惚，無處可以解釋。不知上天見罪，遺害黎民。今遇老師降臨，萬望明示，上界怎麼樣計較？」行者道：「那一日正是玉皇下界之日，見你將齋供喂狗，又口出穢言，玉帝即立三事記汝。」八戒問道：「是甚三事？」行者道：「披香殿立一座米山，約有十丈高下；一座麵山，約有二十丈高下。米山邊有拳大的一隻小雞，在那裡緊一嘴、慢一嘴的，嗛那米吃；麵山邊有一個金毛哈巴狗兒，在那裡長一舌、短一舌的，餂那麵吃。左邊又一座鐵架子，架上掛一把黃金大鎖，鎖梃兒有指頭粗細。下面有一盞明燈，燈焰兒燎著那鎖梃。直等那雞嗛米盡，狗餂麵盡，燈燎斷鎖梃，他這裡方才該下雨哩。」八戒笑道：「不打緊，不打緊。哥哥肯帶我去，變出法身來，一頓把他的米麵都吃了，鎖梃弄斷了，管取下雨。」行者道：「獃子莫胡說。此乃上天所設之計，你怎麼得見？」三藏道：「似這等說，怎生是好？」行者道：「不難，不難。我臨行時，四天師曾對我言，但只作善可解。」那郡侯拜伏在地，哀告道：「但憑老師指教，下官一一皈依也。」行者道：「你若回心向善，趁早念佛看經，我還替你作為；汝若仍前不改，我亦不能解釋，不久天即誅之，性命不能保矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      郡侯と三蔵、八戒、沙悟浄、それに大小の役人たちが悟空を迎え、皆でひしめき寄って結果を尋ねた。悟空は郡侯を一喝した。
      悟空「三年前の十二月二十五日、お前が天地を冒瀆したせいで、民が難儀しているのだ。今も雨を降らせてくださらないぞ！」
      郡侯は慌てて地面にひざまずき、身を伏せた。
      郡侯「お師匠さま、どうして三年前のことをご存じなのですか。」
      悟空「天に供える精進の供物を、どうしてひっくり返し、犬に食わせたんだ。ありのままに話せ。」
      郡侯は隠すこともできず、打ち明けた。
      郡侯「三年前の十二月二十五日、この役所で供物を捧げ、天を祭っておりました。ところが妻が賢明でなく、口汚く言い争いになり、私は一時の怒りに分別を失って、供物の机をひっくり返し、精進の料理をぶちまけてしまいました。そして確かに犬を呼んで、食べさせました。この二年は、思い出すたびに心にかかり、気もそぞろで、心を晴らす道もございませんでした。まさか天のおとがめを受け、民に災いを残すことになろうとは存じませんでした。今、お師匠さまがおいでくださいましたので、どうかお教えください。天上では、どのようになさっているのでしょうか。」
      悟空「その日は、ちょうど玉皇（ぎょくこう）が下界へ下りた日だった。お前が供物を犬に食わせ、口汚い言葉を吐くのをご覧になり、玉帝はお前の罪のしるしに、三つのものを設けられた。」
      八戒「どんな三つだ。」
      悟空「披香殿に、高さ十丈ほどの米の山と、高さ二十丈ほどの粉の山が置かれている。米の山のそばには拳ほどの小さな鶏が一羽いて、せわしくついばんだり、ゆっくりついばんだりして、米を食べている。粉の山のそばには金毛の小さな愛玩犬が一匹いて、舌を長く伸ばしたり、短く出したりして、粉をなめている。左には鉄の枠があって、その上に大きな黄金の錠が一つ掛かり、錠を閉じる棒は指ほどの太さだ。その下の灯火の炎が、その棒をあぶっている。鶏が米を食い尽くし、犬が粉をなめ尽くし、炎が錠の棒を焼き切るまで待って、やっとここへ雨を降らせてよいのだ。」
      八戒は笑った。
      八戒「心配いらねえ、心配いらねえ。兄貴が俺を連れていってくれさえすりゃ、法身（ほっしん）を現して、そこの米も粉も一食で平らげ、錠の棒もへし折ってやる。きっと雨が降るぞ。」
      悟空「馬鹿、でたらめを言うな。天が設けられた仕組みだぞ。お前などが、どうして見ることを許されるものか。」
      三蔵「そういうことなら、どうすればよいのだろう。」
      悟空「難しくありません、難しくありません。出発する時、四天師が、ただ善を行えば解けると教えてくれました。」
      郡侯は地面に伏して拝み、哀願した。
      郡侯「どうぞお教えください。お師匠さまのおっしゃることには、何事も従い、帰依いたします。」
      悟空「心を入れ替えて善に向かうなら、早く念仏を唱え、経を読むことだ。そうすれば、俺もお前のために、もう一度働いてやる。だが、これまでどおり改めないなら、俺にも解くことはできない。間もなく天に誅せられ、命も保てなくなるぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-019"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那郡侯磕頭禮拜，誓願皈依。當時召請本處僧道，啟建道場，各各寫發文書，申奏三天。郡侯領眾拈香瞻拜，答天謝地，引罪自責。三藏也與他念經。一壁廂又出飛報，教城裡城外大家小戶，不論男女人等，都要燒香念佛。自此時，一片善聲盈耳。行者卻才歡喜，對八戒、沙僧道：「你兩個好生護持師父，等老孫再與他去去來。」八戒道：「哥哥又往那裡去？」行者道：「這郡侯聽信老孫之言，果然受教，恭敬善慈，誠心念佛。我這去再奏玉帝，求些雨來。」沙僧道：「哥哥既要去，不必遲疑，且耽擱我們行路。必求雨一壇，庶成我們之正果也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      郡侯は額を地につけて礼拝し、帰依を誓った。すぐに地元の僧と道士を招き、祈りの道場を設け、それぞれ文書を書いて送り、三天（さんてん）に上奏した。郡侯は人々を率いて香を捧げ、仰ぎ拝み、天地に感謝し、罪を認めて自らを責めた。三蔵も一緒に経を読んだ。一方では急ぎ触れを出し、城の内外の大きな家も小さな家も、男女を問わず、皆が香をたいて念仏を唱えるよう命じた。この時から、善き祈りの声が辺りいっぱいに満ちた。悟空はようやく喜び、八戒と沙悟浄に告げた。
      悟空「お前たちは、お師匠さまをしっかりお守りしろ。俺はもう一度、あの男のために行ってくる。」
      八戒「兄貴、またどこへ行くんだ。」
      悟空「郡侯は俺の言葉を信じ、本当に教えを受け入れ、敬虔で慈悲深くなって、心から念仏を唱えている。もう一度玉帝に上奏して、少し雨を降らせてもらってくるのだ。」
      沙悟浄「兄さん、行くのなら、ためらってはいけません。私たちの旅も遅れています。必ず一壇の雨乞いを成し遂げてください。そうすれば、私たちも正果（しょうか）に至る務めを果たせましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-020"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，又縱雲頭，直至天門外，還遇著護國天王。天王道：「你今又來做甚？」行者道：「那郡侯已歸善矣。」天王亦喜。正說處，早見直符使者捧定了道家文書、僧家關牒，到天門外傳遞。那符使見了行者，施禮道：「此意乃大聖勸善之功。」行者道：「你將此文牒送去何處？」符使道：「直送至通明殿上，與天師傳遞到玉皇大天尊前。」行者道：「如此，你先行，我當隨後而去。」那符使入天門去了。護國天王道：「大聖，不消見玉帝了。你只往九天應元府下借點雷神，徑自聲雷掣電，還他就有雨下也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      さすが悟空、再び雲を躍らせ、まっすぐ天門の外へ行くと、また護国天王に出会った。
      護国天王「今度は何をしに来たのだ。」
      悟空「あの郡侯が、善へ立ち返ったのです。」
      天王も喜んだ。話しているところへ、直符使者（ちょくふししゃ）が道士たちの文書と僧たちの公文書を捧げ持ち、天門の外へ届けに来た。使者は悟空を見ると、礼をした。
      直符使者「このようになったのは、大聖が善をお勧めくださったおかげでございます。」
      悟空「その文書は、どこへ届けるんだ。」
      直符使者「まっすぐ通明殿へ届け、天師に玉皇大天尊（ぎょくこうだいてんそん）の御前へ取り次いでいただきます。」
      悟空「それなら、先に行ってくれ。俺も後から行こう。」
      使者は天門の中へ入っていった。
      護国天王「大聖、玉帝にお目にかかるには及ばない。九天応元府（きゅうてんおうげんふ）へ行って雷神を何人か借り、そのまま雷を鳴らし稲妻を走らせてやれば、あそこには雨が降る。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-021"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "真個行者依言，入天門裡，不上靈霄殿求請旨意，轉雲步，徑往九天應元府，見那雷門使者、糾錄典者、廉訪典者都來迎著，施禮道：「大聖何來？」行者道：「有事要見天尊。」三使者即為傳奏。天尊隨下九鳳丹霞之扆，整衣出迎。相見禮畢，行者道：「有一事特來奉求。」天尊道：「何事？」行者道：「我因保唐僧至鳳仙郡，見那乾旱之甚，已許他求雨，特來告借貴部官將到彼聲雷。」天尊道：「我知那郡侯冒犯上天，立有三事，不知可該下雨哩？」行者笑道：「我昨日已見玉帝請旨。玉帝著天師引我去披香殿看那三事，乃是米山、麵山、金鎖，只要三事倒斷，方該下雨。我愁難得倒斷，天師教我勸化郡侯等眾作善，以為人有善念，天必從之。庶幾可以回天心，解災難也。今已善念頓生，善聲盈耳。適間直符使者已將改行從善的文牒奏上玉帝去了，老孫因特造尊府，告借雷部官將相助相助。」天尊道：「既如此，差鄧、辛、張、陶，帥領閃電娘子，即隨大聖下降鳳仙郡聲雷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      悟空はその言葉どおり、天門に入ると、霊霄殿へ勅命を願いに行かず、雲上の足を向け直して、まっすぐ九天応元府へ赴いた。雷門使者（らいもんししゃ）、糾録典者（きゅうろくてんしゃ）、廉訪典者（れんぽうてんしゃ）が皆で迎えに来て、礼をした。
      三使者「大聖、どのようなご用でおいでですか。」
      悟空「お頼みしたいことがあって、天尊（てんそん）にお目にかかりに来ました。」
      三使者はすぐ取り次いだ。天尊は九羽の鳳凰と丹色の霞を飾った屏風のある座から下り、衣服を整えて迎えに出た。互いの挨拶が済むと、悟空が言った。
      悟空「一つ、お願いがあって参りました。」
      天尊「どのようなことか。」
      悟空「唐僧を守って鳳仙郡へ行き、ひどい旱魃を見て、雨を祈ると引き受けました。そこで、こちらの部の官将をお借りして、あの土地で雷を鳴らしていただきたく、参ったのです。」
      天尊「あの郡侯が天を冒瀆し、三つのものが設けられたことは知っている。もう雨を降らせてよいのだろうか。」
      悟空は笑った。
      悟空「昨日、玉帝にお目にかかって勅命を願いました。玉帝は天師に命じて、俺を披香殿へ案内し、その三つを見せてくださったのです。米の山、粉の山、金の錠で、三つが崩れ切れれば、雨を降らせてよいとのことでした。とても崩れ切れそうにないので困っていると、天師が、郡侯らに善を行うよう教え諭せと教えてくれました。人に善念があれば、天は必ずそれに応じる、そうすれば天の御心も変わり、災いが解けるかもしれないというのです。今はもう善念が芽生え、善き祈りの声が満ちています。さっき直符使者が、行いを改め善に従ったという文書を、玉帝に上奏しに行きました。そこで俺は、こちらのお屋敷へ伺い、雷部（らいぶ）の官将をお借りして、お助けいただこうと思ったのです。」
      天尊「それなら、鄧（とう）、辛（しん）、張（ちょう）、陶（とう）を遣わし、閃電娘子（せんでんじょうし）を率いさせ、ただちに大聖に従って鳳仙郡へ下り、雷を鳴らさせよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch87-022"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那四將同大聖不多時，至於鳳仙境界，即於半空中作起法來。只聽得唿\U000210E4\U000210E4的雷聲，又見那淅瀝瀝的閃電。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 156
        "line_end": 156
    "translation_ja": "四将は悟空とともに、ほどなく鳳仙（ほうせん）の地へ着き、空中で術を使い始めた。ごろごろと雷鳴がとどろき、次々に走る稲妻が見える。まさに、"
    "translation_status": "reviewed"
  - "id": "xy-ch87-023"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      電掣紫金蛇，雷轟群蟄鬨。
      熒煌飛火光，霹靂崩山洞。
      列缺滿天明，震驚連地縱。
      紅銷一閃發萌芽，萬里江山都撼動。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 157
        "line_end": 160
    "translation_ja": |-
      稲妻は紫金の蛇を走らせ、
      雷鳴は潜んでいた虫たちを騒がせる。
      まばゆく輝く火の光が飛び、
      激しい雷は山の洞さえ崩す。
      稲妻が空いっぱいを照らし、
      驚くばかりの震動が、地にも続けざまに走る。
      紅いきらめきが一閃すれば、若芽が伸び、
      万里（り）の山河が、ことごとく揺れ動く。
    "translation_status": "reviewed"
  - "id": "xy-ch87-024"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那鳳仙郡城裡城外，大小官員，軍民人等，整三年不曾聽見雷電；今日見有雷聲霍閃，一齊跪下，頭頂著香爐，有的手拈著柳枝，都念：「南無阿彌陀佛！南無阿彌陀佛！」這一聲善念，果然驚動上天。正是那古詩云："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      鳳仙郡の城の内外、大小の役人や軍民たちは、丸三年もの間、雷鳴を聞かず、稲妻も見ていなかった。今日、雷がとどろき稲妻が走るのを見ると、一斉にひざまずいた。頭の上に香炉を頂く者も、手に柳の枝を持つ者もあり、皆で唱えた。
      官民一同「南無阿弥陀仏（なむあみだぶつ）！　南無阿弥陀仏！」
      この善念のこもった声は、まことに天を動かした。まさに古い詩にいうとおりである。
    "translation_status": "reviewed"
  - "id": "xy-ch87-025"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      人心生一念，天地悉皆知。
      善惡若無報，乾坤必有私。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 164
        "line_end": 165
    "translation_ja": |-
      人の心に一念が生じれば、
      天地はそのすべてを知っている。
      善にも悪にも報いがないのなら、
      天地にはきっと、えこひいきがあるのだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch87-026"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且不說孫大聖指揮雷將，掣電轟雷於鳳仙郡，人人歸善。卻說那上界直符使者將僧、道兩家的文牒送至通明殿，四天師傳奏靈霄殿。玉帝見了道：「那廝們既有善念，看三事如何？」正說處，忽有披香殿看管的將官報道：「所立米、麵山俱倒了，霎時間米、麵皆無，鎖梃亦斷。」奏未畢，又有當駕天官引鳳仙郡土地、城隍、社令等神齊來拜奏道：「本郡郡主並滿城大小黎庶之家，無一家一人不皈依善果，禮佛敬天。今啟垂慈，普降甘雨，求濟黎民。」玉帝聞言大喜，即傳旨：「著風部、雲部、雨部各遵號令，去下方，按鳳仙郡界，即於今日今時，聲雷佈雲，降雨三尺零四十二點。」時有四大天師奉旨，傳與各部隨時下界，各逞神威，一齊振作。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      悟空が雷将を指揮して鳳仙郡で稲妻を走らせ、雷をとどろかせ、人々が皆、善へ立ち返った話は、いったんおく。さて、天上の直符使者は、僧と道士の両方の文書を通明殿へ届け、四天師が霊霄殿へ取り次いで上奏した。玉帝はそれを見ると言った。
      玉帝「あの者たちに善念が生じたなら、三つのものがどうなったか見よ。」
      言い終わらぬうちに、披香殿を守る将官が報告に来た。
      守将「置かれていた米と粉の山は、どちらも崩れました。一瞬のうちに米も粉もすべて消え、錠の棒も切れました。」
      その奏上も終わらぬうちに、御前に仕える天官が、鳳仙郡の土地（とち）、城隍（じょうこう）、社令（しゃれい）らの神々を連れてきた。神々はそろって拝し、上奏した。
      郡の神々「当郡の郡主から、城じゅうの大小の民家まで、善き実りへ帰依せぬ家も人も、一つ、一人としてございません。皆、仏を礼拝し、天を敬っております。どうか慈悲を垂れ、あまねく恵みの雨を降らせて、民をお救いください。」
      玉帝はそれを聞いて大いに喜び、ただちに勅命を下した。
      玉帝「風部（ふうぶ）、雲部（うんぶ）、雨部は、それぞれ号令に従って下界へ赴け。鳳仙郡の領内に、今日ただ今、雷を鳴らし、雲を広げ、三尺と四十二点（てん）の雨を降らせよ。」
      四大天師は命を受け、各部へ伝えた。神々はただちに下界へ下り、それぞれ神威を現し、一斉に働き始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch87-027"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-002"
      "description_ja": "原文の「消息」は深奥の道の機微・手がかり、「玄光」は玄妙な光と解した。「五般光彩」は五種の光であり、特定の五色や修行段階を本文外から一つずつ割り当ててはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-013"
      "description_ja": "「跳出罡斗」は、星の位置になぞらえた儀礼の歩み・配置から離れると解した。具体的な足運びや、地面に図が描かれていたかは本文にない。既存の罡・歩罡に関する語義と照合している。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-014"
      "description_ja": "この場面は西天門で、底本の呼称は「護國天王」。他の場面の北天門・南天門の同じ呼称や、四天王の持国天へ、名だけを根拠に同一人物と断定しない。門の方角も訂正しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-014"
      "description_ja": "「蒼蠅包網兒」は、小さな蠅が人間の髪を包む網巾をかぶるというたとえと解した。「大面皮」は、顔の大きさと厚かましさ・顔が利くという自負を重ねる。本文の頭巾は、この髪を包む網状のかぶり物を指す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-015"
      "description_ja": "「那上官正不仁」は「上官という者がまさに不仁を働く」と解した。正を個人名の末字と読む余地はあるが、この底本で明示される姓は上官であり、ここから本名を「上官正」と断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-016"
      "description_ja": "「嗛」は米をついばむ、「餂」は粉をなめると解した。金毛の「哈巴狗兒」は小型の愛玩犬をいう語として訳し、現代の特定の犬種までは限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-019"
      "description_ja": "原文は「必求雨一壇」。壇は雨量の単位ではなく、祭壇を設けた雨乞いの一場・一式を数えると解した。具体的な儀式の回数や式次第は補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-021"
      "description_ja": "「九鳳丹霞之扆」の扆は、座の背後などに立てる屏風をいう。九鳳と丹霞は装飾に関わる表現と解したが、絵画・彫刻などの製法までは限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-022"
      "description_ja": "底本の雷の擬音は「唿\U000210E4\U000210E4」、稲妻には「淅瀝瀝」とある。珍字を原文に保ち、音や光が連続する表現として日本語にした。淅瀝瀝を理由に、この時点ですでに雨が降ったという内容を加えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-023"
      "description_ja": "底本は「紅銷一閃」。紅銷は通常の語として確定しにくく、前後の電光を詠む文脈から紅いきらめきと解した。銷を別字へ校訂せず、字義の細部は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-031"
      "description_ja": "底本は「燥眉環眼」。燥眉は乾いた、あるいは荒い眉の形容と解したが、別字への補訂はしない。「曾似」の構文も細部は留保し、本文では神の容貌を示す対句として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-036"
      "description_ja": "底本は「金貼」。ここでは僧を招くための文書と解し、貼を帖へ無断で直さず、原字を残した。金色の装飾や材質、金銭を添える意味まで確定できる資料は得られず、細部は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch87-1500526"
      "segment_ids":
        - "xy-ch87-038"
      "description_ja": "「留普濟」は、広く救う働きを残す意味と、先に名づけられた甘霖普済寺の名とが重なると解した。寺という語はその関係が読み取れるようにした補い。 原文の欠落ではなく、解釈・校訂上の留保。"

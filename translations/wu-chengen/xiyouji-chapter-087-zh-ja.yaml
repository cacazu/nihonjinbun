        "line_start": 168
        "line_end": 168
    "translation_ja": "悟空が鄧、辛、張、陶とともに、閃電娘子に命じて空中で雷電を操っていると、神々がすべて到着し、大空の一か所に集まった。すると風と雲が合わさり、恵みの雨が滝のように降り注いだ。何と見事な雨であろう。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-028"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": "漠漠濃雲，濛濛黑霧。雷車轟轟，閃電灼灼。滾滾狂風，淙淙驟雨。所謂一念回天，萬民滿望。全虧大聖施元運，萬里江山處處陰。好雨傾河倒海，蔽野迷空。簷前垂瀑布，窗外響玲瓏。萬戶千門人念佛，六街三市水流洪。東西河道條條滿，南北溪灣處處通。槁苗得潤，枯木回生。田疇麻麥盛，村堡荳糧升。客旅喜通販賣，農夫愛爾耘耕。從今黍稷多條暢，自然稼穡得豐登。風調雨順民安樂，海晏河清享太平。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      濃い雲は果てしなく広がり、黒い霧はもうもうと立ちこめる。
      雷の車はごうごうと鳴り、稲妻はきらきらと光る。
      激しい風は巻き起こり、にわか雨はざあざあと降る。
      一念が天の心を変え、万人の願いが満たされたとは、このことだ。
      ひとえに大聖が根源の力を働かせたおかげで、
      万里の山河は、どこもかしこも雲に覆われた。
      恵みの雨は、川を傾け海をひっくり返すかのよう。
      野を覆い、空をかすませる。
      軒先には滝が垂れ、窓の外には澄んだ音が響く。
      幾千幾万の家々で人々は念仏を唱え、
      あらゆる街路、市場には大水が流れる。
      東西の川筋は一つ残らず満ち、
      南北の小川や入り江は、どこも流れが通じる。
      しおれた苗は潤いを得、枯れ木も生気を取り戻す。
      田畑では麻や麦が茂り、村々では豆や穀物が育つ。
      旅商人は往来して商えるのを喜び、
      農夫は草取りや耕作に励めるのを喜ぶ。
      これから黍（きび）や稷（しょく）は、いよいよすくすくと伸び、
      おのずと作物は、豊かな実りを迎えるだろう。
      風は穏やかに、雨は時よく降り、民は安らかに楽しみ、
      海は静まり、黄河（こうが）も澄みわたり、太平の世を味わう。
    "translation_status": "reviewed"
  - "id": "xy-ch87-029"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一日雨下足了三尺零四十二點，眾神祗漸漸收回。孫大聖厲聲高叫道：「那四部眾神，且暫停雲從，待老孫去叫郡侯拜謝列位。列位可撥開雲霧，各現真身，與這凡夫親眼看看，他才信心供奉也。」眾神聽說，只得都停在空中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      一日で雨がきっかり三尺と四十二点降ると、神々は次第に引き揚げ始めた。悟空は声を張り上げ、鋭く呼びかけた。
      悟空「四部の神々、しばらく雲の進みを止めてくれ。俺が郡侯を呼びに行って、皆さんに拝んでお礼を言わせる。皆さんは雲や霧を払い、それぞれ本当のお姿を現して、あの人間に自分の目で見せてやってくれ。そうすれば、心から信じてお仕えするだろう。」
      神々はそれを聞き、やむなく皆、空中にとどまった。
    "translation_status": "reviewed"
  - "id": "xy-ch87-030"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者按落雲頭，徑至郡裡，早見三藏、八戒、沙僧都來迎接；那郡侯一步一拜來謝。行者道：「且慢謝我。我已留住四部神祗，你可傳召多人同此拜謝，教他向後好來降雨。」郡侯隨傳飛報，召眾同酬，都一個個拈香朝拜。只見那四部神祗開明雲霧，各現真身。四部者，乃雨部、雷部、雲部、風部。只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      悟空は雲を下ろし、まっすぐ郡の役所へ向かった。早くも三蔵、八戒、沙悟浄がそろって迎えに来た。郡侯は一歩ごとに拝みながら、お礼に進み出た。
      悟空「俺への礼は、まだいい。四部の神々にとどまってもらってある。大勢を呼び集め、一緒に拝んで感謝しなさい。これからも雨を降らせに来ていただけるようにな。」
      郡侯はすぐに急ぎの触れを出して人々を招き、皆で恩に報いた。誰もが香を捧げ、仰ぎ拝んだ。すると四部の神々が雲や霧を晴らし、それぞれ本当の姿を現した。四部とは、雨部、雷部、雲部、風部である。見れば、
    "translation_status": "reviewed"
  - "id": "xy-ch87-031"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": "龍王顯像，雷將舒身；雲童出現，風伯垂真。龍王顯像，銀鬚蒼貌世無雙；雷將舒身，鉤嘴威顏誠莫比。雲童出現，誰如玉面金冠；風伯垂真，曾似燥眉環眼。齊齊顯露青霄上，各各挨排現聖儀。鳳仙郡界人才信，頂禮拈香惡性回。今日仰朝天上將，洗心向善盡皈依。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      竜王はその姿を示し、雷将は身を伸ばす。
      雲童（うんどう）は姿を現し、風伯（ふうはく）も真の姿を示す。
      竜王の姿は、銀のひげに青黒い顔、世に並ぶものはない。
      雷将の身は、鉤のような口と威厳ある顔、まことに比べようもない。
      雲童が現れれば、その玉のような顔と金の冠に、誰が及ぼう。
      風伯が姿を見せれば、荒い眉に、丸く見開いた目。
      一斉に青空の上へ姿を出し、
      それぞれ並んで、神聖な威容を示す。
      鳳仙郡の人々は、そこで初めて信を抱き、
      額を地につけ、香を捧げて、悪い心を改める。
      今日、天上の神将を仰ぎ拝み、
      心を洗い、善に向かって、ことごとく帰依する。
    "translation_status": "reviewed"
  - "id": "xy-ch87-032"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾神祗寧待了一個時辰，人民拜之不已。孫行者又起在雲端，對眾作禮道：「有勞，有勞。請列位各歸本部。老孫還教郡界中人家供養高真，遇時節醮謝。列位從此後，五日一風，十日一雨，還來拯救拯救。」眾神依言，各各轉部不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 177
        "line_end": 177
    "translation_ja": |-
      神々は一時辰（いちじしん）のあいだ、じっと待っていたが、人々の礼拝は止まらなかった。悟空は再び雲の上へ昇り、神々に礼をした。
      悟空「ご苦労をかけました、ご苦労をかけました。皆さん、どうぞそれぞれの部へお戻りください。俺から郡じゅうの家々に、尊い神々をお祭りし、季節の折々には醮（しょう）を設けてお礼をするよう言っておきます。皆さんも今後は、五日に一度の風、十日に一度の雨をもたらし、また救ってやってください。」
      神々はその言葉に従い、それぞれの部へ帰っていった。この話はいったんおく。
    "translation_status": "reviewed"
  - "id": "xy-ch87-033"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說大聖墜落雲頭，與三藏道：「事畢民安，可收拾走路矣。」那郡侯聞言，急忙行禮道：「孫老爺說那裡話。今此一場，乃無量無邊之恩德。下官這裡差人辦備小宴，奉答厚恩。仍買治民間田地，與老爺起建寺院，立老爺生祠，勒碑刻名，四時享祀。雖刻骨鏤心，難報萬一，怎麼就說走路的話？」三藏道：「大人之言雖當，但我等乃西方掛搭行腳之僧，不敢久住，一二日間，定走無疑。」那郡侯那裡肯放，連夜差多人治辦酒席，起蓋祠宇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      さて、悟空は雲から下りると、三蔵に言った。
      悟空「事は済み、民も安らかになりました。支度をして、出発できます。」
      郡侯はそれを聞き、急いで礼をした。
      郡侯「孫さま、何をおっしゃいます。今回のことは、計り知れぬ限りないご恩でございます。こちらでは人を遣わして、ささやかな宴を用意し、厚いご恩にお報いしようとしております。さらに民間の田畑を買い整え、皆さまのために寺院を建て、生祠（せいし）を設け、石碑にお名を刻み、四季を通じてお祭りするつもりです。骨に刻み、心に彫りつけても、万分の一も報いられませんのに、どうしてもう出発などとおっしゃるのですか。」
      三蔵「お心遣いはもっともですが、私どもは西へ向かい、寺々に掛搭（かた）しながら旅をする僧です。長くとどまるわけにはまいりません。一日、二日のうちには、必ず出発いたします。」
      郡侯はどうしても行かせようとせず、夜を徹して大勢を使い、宴席を整え、祠の建築を始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch87-034"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，大開佳宴，請唐僧高坐，孫大聖與八戒、沙僧列坐。郡侯同本郡大小官員部臣把杯獻饌，細吹細打，款待了一日。這場果是欣然。有詩為證："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 181
        "line_end": 181
    "translation_ja": "翌日、盛大な宴が開かれた。三蔵を上座へ招き、悟空と八戒、沙悟浄が並んで座った。郡侯と郡の大小の役人や配下の者たちは、杯を差し出し、料理を勧め、笛や打ち物をしとやかに奏でて、一日じゅうもてなした。まことに喜びに満ちた宴であった。それを証する詩がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-035"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      田疇久旱逢甘雨，河道經商處處通。
      深感神僧來郡界，多蒙大聖上天宮。
      解除三事從前惡，一念皈依善果弘。
      此後願如堯舜世，五風十雨萬年豐。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 182
        "line_end": 185
    "translation_ja": |-
      長く干上がった田畑は、恵みの雨に出会い、
      川筋はどこも通じて、商いが行き交う。
      神僧がこの郡へ来てくださったことに深く感謝し、
      大聖が天宮へ上ってくださった恩を厚く受ける。
      三つのものに表れた、かつての罪は取り除かれ、
      帰依の一念により、善き実りは広がった。
      これからは堯（ぎょう）と舜（しゅん）の世のように、
      五日に風、十日に雨があり、万年の豊作が続くように。
    "translation_status": "reviewed"
  - "id": "xy-ch87-036"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一日筵，二日宴；今日酬，明日謝。扳留將有半月，只等寺院生祠完備。一日，郡侯請四眾往觀。唐僧驚訝道：「功程浩大，何成之如此速耶？」郡侯道：「下官催趲人工，晝夜不息，急急命完，特請列位老爺看看。」行者笑道：「果是賢才能幹的好賢侯也。」即時都到新寺，見那殿閣巍峨，山門壯麗，俱稱贊不已。行者請師父留一寺名。三藏道：「有，留名當喚做『甘霖普濟寺』。」郡侯稱道：「甚好，甚好。」用金貼廣招僧眾，侍奉香火。殿左邊立起四眾生祠，每年四時祭祀；又起蓋雷神、龍神等廟，以答神功。看畢，即命趲行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 187
        "line_end": 187
    "translation_ja": |-
      一日目にも宴、二日目にも宴。今日も恩を祝い、明日も礼を尽くす。寺院と生祠がすっかり出来上がるまでと、半月近く引き留めた。ある日、郡侯は四人を見物に招いた。三蔵は驚いた。
      三蔵「大がかりな工事ですのに、どうしてこれほど早く出来上がったのですか。」
      郡侯「私が人夫たちを督促し、昼夜休むことなく、急いで完成させるよう命じたのでございます。ぜひ皆さまにご覧いただきたく存じます。」
      悟空は笑った。
      悟空「まったく、賢くて仕事のできる、立派な郡侯だ。」
      一同はすぐ新しい寺へ赴いた。御殿や楼閣は高くそびえ、山門は壮麗で、皆がしきりに褒めたたえた。悟空は師に、寺の名を一つ残すよう頼んだ。
      三蔵「よい名がある。『甘霖普済寺（かんりんふさいじ）』と名づけよう。」
      郡侯「たいへん結構です、たいへん結構です。」
      郡侯は金貼（きんちょう）を出して広く僧を招き、香火を守らせた。殿の左側には四人の生祠を建て、毎年、四季に祭祀を行うことにした。また雷神や竜神などの廟も建て、神々の功に報いた。見物が終わると、三蔵はすぐ、旅を急ぐよう命じた。
    "translation_status": "reviewed"
  - "id": "xy-ch87-037"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那一郡人民，知久留不住，各備贐儀，分文不受。因此，合郡官員人等，盛張鼓樂，大展旌幢，送有三十里遠近，猶不忍別，遂掩淚目送，直至望不見方回。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 189
        "line_end": 189
    "translation_ja": "郡の人々は、もはや長く引き留められないと知り、それぞれ旅立ちの贈り物を用意したが、師弟は一文も受け取らなかった。そこで郡じゅうの役人や人々は、盛大に太鼓や音楽を鳴らし、旗を大きく広げ、三十里ほども見送った。それでも別れを忍びがたく、涙を拭いながら目で追い、姿が見えなくなってから、ようやく帰っていった。まさに、"
    "translation_status": "reviewed"
  - "id": "xy-ch87-038"
    "section_id": "chapter-87"
    "kind": "verse"
    "origin": "source"
    "source_text": "碩德神僧留普濟，齊天大聖廣施恩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 191
        "line_end": 191
    "translation_ja": |-
      徳高き神僧は、あまねく救う寺を残し、
      斉天大聖（せいてんたいせい）は、広く恩を施した。
    "translation_status": "reviewed"
  - "id": "xy-ch87-039"
    "section_id": "chapter-87"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知此去還有幾日方見如來，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch87-1500526"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第087回&oldid=1500526"
        "line_start": 193
        "line_end": 193
    "translation_ja": "さて、ここを発って、あと何日で如来に会えるのであろうか。それは次回のお話をお聞きいただきたい。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-01-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "固定版の回題には「致旱」に続けて「一作『止雨』」とある。この異題注も回題の一部として保存し、本文の欠落とは扱わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-02-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「消息」は深奥の道の機微・手がかり、「玄光」は玄妙な光と解した。「五般光彩」は五種の光であり、特定の五色や修行段階を本文外から一つずつ割り当ててはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-03-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は粟一斗が「百金」、薪一束が「五兩」。金は貨幣価額をいう古い表現として残し、純金の重量や現代の通貨額へ換算しない。斗・升の容量、両の重量にも時代差がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-04-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "上官は二字で一つの姓。掲示の「郡侯上官」を悟空が問い返し、役人が姓だと説明している。掲示の段階で訳者による姓の説明を先取りせず、問答を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-05-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「踢天弄井」は並外れた神通・力量をいう慣用句。教育部『重編國語辭典修訂本』は天にも地にも自在に出入りする力量のたとえと説明し、『西遊記』の用例も挙げる。字面の天と井戸を残すが、井を井宿の神と同定したり、実際の井戸破壊を叙述したものとは扱わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-06-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本のこの詩だけは「風仙」と書き、他の箇所の「鳳仙」と字が異なる。同じ郡を指す異表記として原文・訳文に残し、別の郡とは扱わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-07-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「跳出罡斗」は、星の位置になぞらえた儀礼の歩み・配置から離れると解した。具体的な足運びや、地面に図が描かれていたかは本文にない。既存の罡・歩罡に関する語義と照合している。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-08-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この場面は西天門で、底本の呼称は「護國天王」。他の場面の北天門・南天門の同じ呼称や、四天王の持国天へ、名だけを根拠に同一人物と断定しない。門の方角も訂正しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-09-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「蒼蠅包網兒」は、小さな蠅が人間の髪を包む網巾をかぶるというたとえと解した。「大面皮」は、顔の大きさと厚かましさ・顔が利くという自負を重ねる。本文の頭巾は、この髪を包む網状のかぶり物を指す。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-10-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文表記は「丘洪濟」。玉帝に仕える四天師の一人として、これまでの丘弘済と同じ人物を指すと判断し、通常名を継続した。原文の洪を弘へ書き換えたものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-11-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「那上官正不仁」は「上官という者がまさに不仁を働く」と解した。正を個人名の末字と読む余地はあるが、この底本で明示される姓は上官であり、ここから本名を「上官正」と断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-12-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「嗛」は米をついばむ、「餂」は粉をなめると解した。金毛の「哈巴狗兒」は小型の愛玩犬をいう語として訳し、現代の特定の犬種までは限定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-13-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "事件は三年前、郡侯が心にかけていた期間は「這兩年」と語られる。両方の数字をそのまま残した。また妻が賢明でなかったという説明は郡侯自身の弁明であり、語り手が妻の非を確定した叙述ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-14-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "郡侯は先に語り手から清廉・賢明で民を愛する者と評されるが、自身は供物を倒して犬に食わせたと告白する。この二つを一方に合わせて消してはいない。供物の侮辱が災害を生むという因果は物語内の宗教的設定であり、現実の旱魃の原因を説明するものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-15-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「必求雨一壇」。壇は雨量の単位ではなく、祭壇を設けた雨乞いの一場・一式を数えると解した。具体的な儀式の回数や式次第は補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-16-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「九鳳丹霞之扆」の扆は、座の背後などに立てる屏風をいう。九鳳と丹霞は装飾に関わる表現と解したが、絵画・彫刻などの製法までは限定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-17-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "先の行動を連続して語る叙述の中で、悟空は最初の上奏を「昨日」と呼ぶ。別の時刻説明を補って整合させず、この語を保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-18-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "四将は雷部の官将として派遣される。既出の雷霆の官将である同じ四姓と役割を照合したが、南天門・東天門の同姓の門将や、鄧化・張蕃らの名を持つ雷公と、姓だけで結び付けない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-19-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の雷の擬音は「唿\U000210E4\U000210E4」、稲妻には「淅瀝瀝」とある。珍字を原文に保ち、音や光が連続する表現として日本語にした。淅瀝瀝を理由に、この時点ですでに雨が降ったという内容を加えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-20-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「紅銷一閃」。紅銷は通常の語として確定しにくく、前後の電光を詠む文脈から紅いきらめきと解した。銷を別字へ校訂せず、字義の細部は留保する。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-21-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三尺零四十二點」は三尺と四十二点。零は端数をつなぐ字と解した。点の正確な長さ・換算率を確定せず、現代の降水量に直さない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-22-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "稷は古い穀物名で、粟・ウルチキビ・高粱に結び付ける諸説がある。岩崎常正『本草図譜』の公開翻刻では「しょく」と読まれ、キビ・ウルキビと説明される。本文では原字の名を保ち、一種類へ固定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-23-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「燥眉環眼」。燥眉は乾いた、あるいは荒い眉の形容と解したが、別字への補訂はしない。「曾似」の構文も細部は留保し、本文では神の容貌を示す対句として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-24-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「金貼」。ここでは僧を招くための文書と解し、貼を帖へ無断で直さず、原字を残した。金色の装飾や材質、金銭を添える意味まで確定できる資料は得られず、細部は留保する。"
    "translation_status": "reviewed"
  - "id": "xy-ch87-note-25-body"
    "section_id": "chapter-87"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「留普濟」は、広く救う働きを残す意味と、先に名づけられた甘霖普済寺の名とが重なると解した。寺という語はその関係が読み取れるようにした補い。"
    "translation_status": "reviewed"

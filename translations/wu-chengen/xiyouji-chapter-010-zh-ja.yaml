- "id": "spoken-poem-011"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-011"
    "source_span":
      "start": 33
      "end": 105
      "exact": |-
        蒼徑秋高拽斧去，晚涼擡擔回來。野花插鬢更奇哉，撥雲尋路出，待月叫門開。
        稚子山妻欣笑接，草床木枕攲捱。蒸梨炊黍旋鋪排，甕中新釀熟，真個壯幽懷。」
    "translation_span":
      "start": 47
      "end": 296
      "exact": |-
        青い小道、秋空高く、斧を引いて行き、
        夕涼みには、荷を担いで帰ってくる。
        野の花を鬢（びん・推定。顔の左右、耳の前に生える髪）に挿すのも、また格別。
        雲を払い、道を捜して抜け、
        月を待ち、門を開けよと呼ぶ。
        幼い子と田舎の妻が、笑って迎え、
        草の床と木の枕に、身を寄せて横たわる。
        梨を蒸し、黍（きび・推定。小さな粒を食用にするイネ科の穀物）を炊いて、すぐ食卓を整える。
        甕（かめ・推定。酒や水などを入れる口の狭い大きな器）の新酒も飲みごろとなり、
        この静かな心持ちを、まことに豊かにしてくれる。」
  "separator": |2+

  "description_ja": "人物が詠む詩詞または聯句。話者ラベルと全句を保持。"
- "id": "spoken-poem-012"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-012"
    "source_span":
      "start": 41
      "end": 109
      "exact": |-
        閑看蒼天白鶴飛，停舟溪畔掩蒼扉。
        倚篷教子搓鉤線，罷棹同妻晒網圍。
        性定果然如浪靜，身安自是覺風微。
        綠簑青笠隨時著，勝掛朝中紫綬衣。」
    "translation_span":
      "start": 64
      "end": 248
      "exact": |-
        暇には青空を白鶴が飛ぶのを眺め、
        渓流のほとりに舟を止め、青い扉を閉める。
        篷に寄って、子に釣り糸をよるのを教え、
        棹を収めれば、妻とともに網を干す。
        心が静まれば、まさしく波の静けさのよう、
        身が安らかなら、おのずと風もかすかに感じる。
        緑の蓑と青い笠を、折々に着ける方が、
        朝廷で紫綬（しじゅ。高位の官人が印を帯びるために使う紫の組みひも）の衣をまとうよりよい。」
  "separator": |2+


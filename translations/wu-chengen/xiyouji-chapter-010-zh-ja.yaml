- "id": "spoken-poem-003"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-003"
    "source_span":
      "start": 33
      "end": 102
      "exact": |-
        雲林一段松花滿，默聽鶯啼，巧舌如調管。紅瘦綠肥春正暖，倏然夏至光陰轉。
        又值秋來容易換，黃花香，堪供玩。迅速嚴冬如指撚，逍遙四季無人管。」
    "translation_span":
      "start": 50
      "end": 204
      "exact": |-
        雲の林の一画に、松の花が満ち、
        黙って聞けば、鶯の巧みな舌は笛を奏でるよう。
        紅い花は減り、緑の葉は茂り、春は暖かく、
        ふと夏が来て、月日は移る。
        また秋が来れば、移り変わるのもたやすく、
        黄色い花は香り、眺めて楽しむに足る。
        厳しい冬も指をひねる間に巡り来るが、
        四季をのびのび暮らし、誰にも指図されぬ。」
  "separator": |2+


- "id": "xy-ch10-005"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    樵夫道：「你水秀不如我山青，受用些好物。亦有一《鷓鴣天》為證：
    崔巍峻嶺接天涯，草舍茅庵是我家。醃臘雞鵝強蟹鱉，獐豝兔鹿勝魚蝦。
    香椿葉，黃楝芽，竹筍山茶更可誇。紫李紅桃梅杏熟，甜梨酸棗木樨花。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 135
    "line_end": 138
  "translation_ja": |-
    李定「お前の水の美しさは、私の山の青さにかなわない。こちらにもうまいものがある。やはり『鷓鴣天』を証しにしよう。
    険しい峰々は空の果てへ続き、
    草葺きの家、茅の庵こそ我が家。
    塩漬けの鶏や鵞鳥（がちょう・推定。ガンを飼い慣らした家禽）は、カニやスッポンよりうまく、
    キバノロ（雄に長い牙がある小型のシカ）、雌の猪、兎や鹿は、魚やエビにまさる。
    チャンチン（若芽や若葉を食用にするセンダン科の木）の葉、黄楝（こうれん・推定。原文に芽を食べる植物として挙がる名。種の同定は未確定）の芽、
    タケノコ、山茶（さんちゃ・推定。山に生える茶やツバキ類を指す語。ここでの種は未確定）も自慢の品。
    紫のスモモ、紅い桃、梅や杏は熟れ、
    甘い梨、酸っぱいナツメ、モクセイの花もある。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "黄楝・山茶の植物種や食用部位は厳密には未確定。"
- "id": "xy-ch10-006"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漁翁道：「你山青真個不如我的水秀。又有《天仙子》一首：
    一葉小舟隨所寓，萬疊煙波無恐懼。垂鉤撒網捉鮮鱗，沒醬膩，偏有味，老妻稚子團圓會。
    魚多又貨長安市，換得香醪吃個醉。簑衣當被臥秋江，鼾鼾睡，無憂慮，不戀人間榮與貴。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 140
    "line_end": 143
  "translation_ja": |-
    張稍「お前の青い山は、まったく私の美しい水にかなわない。さらに『天仙子（てんせんし・推定。詞の曲調と字数・韻の型を示す名）』を一首。
    一葉の小舟は、行く先がそのまま住まい、
    幾重もの煙る波にも、恐れはない。
    釣り針を垂れ、網を撒き、生きのよい魚を捕る。
    こってりした醬（ひしお・推定。穀物や肉・魚などを発酵させて作る濃い調味料）はなくても、格別の味、
    老いた妻と幼い子が、そろって集まる。
    魚が多ければ長安の市で売り、
    香りよい濁り酒に換え、酔いしれる。
    蓑（みの・推定。草やわらを編んで作る雨具）を布団に、秋の川に寝そべり、
    いびきをかいて、憂いなく眠り、
    この世の栄華も富貴も恋しくない。」
  "translation_status": "reviewed"
- "id": "xy-ch10-007"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    樵子道：「你水秀還不如我的山青。也有《天仙子》一首：
    茆舍數椽山下蓋，松竹梅蘭真可愛。穿林越嶺覓乾柴，沒人怪，從我賣，或少或多憑世界。
    將錢沽酒隨心快，瓦缽磁甌殊自在。酕醄醉了臥松陰，無掛礙，無利害，不管人間興與敗。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 145
    "line_end": 148
  "translation_ja": |-
    李定「お前の美しい水は、やはり私の青い山にかなわない。私も『天仙子』を一首。
    山の麓に幾間かの茅屋（ぼうおく・推定。茅や草で屋根をふいた質素な家）を建て、
    松、竹、梅、蘭を、心から愛でる。
    林を抜け、峰を越え、乾いた薪を捜す。
    とがめる人もなく、売るのも自由、
    多いか少ないかは世間次第。
    その銭で酒を買い、心のままに楽しみ、
    土の鉢、磁器の碗で、まことに気楽。
    酔いしれて松陰に横たわり、
    しがらみも、利害もなく、
    人の世の栄えや衰えなど構わない。」
  "translation_status": "reviewed"
- "id": "xy-ch10-008"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漁翁道：「李兄，你山中不如我水上生意快活。有一《西江月》為證：
    紅蓼花繁映月，黃蘆葉亂搖風。碧天清遠楚江空，牽攪一潭星動。
    入網大魚作隊，吞鉤小鱖成叢。得來烹煮味偏濃，笑傲江湖打鬨。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 150
    "line_end": 152
  "translation_ja": |-
    張稍「李兄、山での仕事は、私の水上の商いほど楽しくはない。その証しに『西江月（せいこうげつ・推定。詞の曲調と字数・韻の型を示す名）』を詠もう。
    紅い蓼の花は繁り、月を映し、
    黄ばんだ葦の葉は、乱れて風に揺れる。
    青空は澄んで遠く、楚（そ・推定。古代中国の国名で、長江中流域の地域名でもある）の川は広々と空き、
    舟を引いて水をかき回せば、一淵の星が動く。
    網に入る大魚は群れをなし、
    針を飲む小さなケツギョ（中国の淡水にすむ、肉食性の食用魚）は集まる。
    捕って煮れば、その味はいっそう濃く、
    川や湖で大笑いし、気ままに騒ぐ。」
  "translation_status": "reviewed"
- "id": "xy-ch10-009"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    樵夫道：「張兄，你水上還不如我山中的生意快活。亦有《西江月》為證：
    敗葉枯藤滿路，破梢老竹盈山。女蘿乾葛亂牽攀，折取收繩殺擔。
    蟲蛀空心榆柳，風吹斷頭松柟。採來堆積備冬寒，換酒換錢從俺。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 154
    "line_end": 157
  "translation_ja": |-
    李定「張兄、水上の商いは、やはり山での仕事ほど楽しくない。私も『西江月』を証しにしよう。
    朽ち葉と枯れ藤は道に満ち、
    折れた枝や老いた竹は山にいっぱい。
    サルオガセ（木の枝から糸状に垂れ下がる地衣類）や乾いた葛が乱れ絡まり、
    折り取って縄でまとめ、荷に締める。
    虫に食われ、芯の空いたニレや柳、
    風に梢を折られた松や柟（なん・推定。クスノキ科の楠木類を指す字。日本のクスと同一とは限らない）の木。
    集めて積んで、冬の寒さに備え、
    酒に換えるも銭に換えるも、私の自由。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "柟はクスノキ科の楠木類の古称だが、日本のクスノキと同一視しない。原字を保持し厳密な種同定は留保。"
- "id": "xy-ch10-010"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漁翁道：「你山中雖可比過，還不如我水秀的幽雅。有一《臨江仙》為證：
    潮落旋移孤艇去，夜深罷棹歌來。簑衣殘月甚幽哉，宿鷗驚不起，天際彩雲開。
    困臥蘆洲無個事，三竿日上還捱。隨心儘意自安排，朝臣寒待漏，怎似我寬懷。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 159
    "line_end": 162
  "translation_ja": |-
    張稍「お前の山にも比べられるところはあるが、私の美しい水の静かな趣には及ばない。その証しに『臨江仙（りんこうせん・推定。詞の曲調と字数・韻の型を示す名）』がある。
    潮が引けば、すぐ一艘の舟を移し、
    夜更け、棹を収めて歌い帰る。
    蓑にかかる残月の、なんと静かなこと。
    眠るカモメも驚かず、
    空の果てに彩雲が開く。
    疲れれば葦の洲に寝て、何の用もなく、
    日が三竿（さんかん・推定。太陽が竿三本ほどの高さに昇るころという、朝の遅さの表現）も上がってなお、ぐずぐずしている。
    心のまま、思いのまま、自分で暮らしを決める。
    朝臣（ちょうしん・推定。朝廷に仕える臣下）は寒い中、朝参（ちょうさん・推定。臣下が朝廷へ出仕すること）の時を待つが、
    私のこの気楽さに、どうして及ぼう。」
  "translation_status": "reviewed"
- "id": "xy-ch10-011"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    樵夫道：「你水秀的幽雅，還不如我山青更幽雅。亦有《臨江仙》可證：
    蒼徑秋高拽斧去，晚涼擡擔回來。野花插鬢更奇哉，撥雲尋路出，待月叫門開。
    稚子山妻欣笑接，草床木枕攲捱。蒸梨炊黍旋鋪排，甕中新釀熟，真個壯幽懷。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 164
    "line_end": 167
  "translation_ja": |-
    李定「お前の美しい水の静かな趣も、私の青い山には及ばない。こちらも『臨江仙』を証しにしよう。
    青い小道、秋空高く、斧を引いて行き、
    夕涼みには、荷を担いで帰ってくる。
    野の花を鬢（びん・推定。顔の左右、耳の前に生える髪）に挿すのも、また格別。
    雲を払い、道を捜して抜け、
    月を待ち、門を開けよと呼ぶ。
    幼い子と田舎の妻が、笑って迎え、
    草の床と木の枕に、身を寄せて横たわる。
    梨を蒸し、黍（きび・推定。小さな粒を食用にするイネ科の穀物）を炊いて、すぐ食卓を整える。
    甕（かめ・推定。酒や水などを入れる口の狭い大きな器）の新酒も飲みごろとなり、
    この静かな心持ちを、まことに豊かにしてくれる。」
  "translation_status": "reviewed"
- "id": "xy-ch10-012"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漁翁道：「這都是我兩個生意，贍身的勾當，你卻沒有我閑時節的好處。有詩為證。詩曰：
    閑看蒼天白鶴飛，停舟溪畔掩蒼扉。
    倚篷教子搓鉤線，罷棹同妻晒網圍。
    性定果然如浪靜，身安自是覺風微。
    綠簑青笠隨時著，勝掛朝中紫綬衣。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 169
    "line_end": 173
  "translation_ja": |-
    張稍「ここまでは私たち二人の商い、身を養う仕事のことだ。だが、暇なときの楽しさでは、私にはかなうまい。証しの詩がある。こうだ。
    暇には青空を白鶴が飛ぶのを眺め、
    渓流のほとりに舟を止め、青い扉を閉める。
    篷に寄って、子に釣り糸をよるのを教え、
    棹を収めれば、妻とともに網を干す。
    心が静まれば、まさしく波の静けさのよう、
    身が安らかなら、おのずと風もかすかに感じる。
    緑の蓑と青い笠を、折々に着ける方が、
    朝廷で紫綬（しじゅ。高位の官人が印を帯びるために使う紫の組みひも）の衣をまとうよりよい。」
  "translation_status": "reviewed"
- "id": "xy-ch10-013"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    樵夫道：「你那閑時又不如我的閑時好也。亦有詩為證。詩曰：
    閑觀縹緲白雲飛，獨坐茅庵掩竹扉。
    無事訓兒開卷讀，有時對客把棋圍。
    喜來策杖歌芳徑，興到攜琴上翠微。
    草履麻絛粗布被，心寬強似著羅衣。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 175
    "line_end": 180
  "translation_ja": |-
    李定「その暇なときとて、私の暇の楽しさにはかなうまい。私にも証しの詩がある。こうだ。
    暇には、はるかに白雲が飛ぶのを眺め、
    一人、茅の庵に座り、竹の扉を閉める。
    用がなければ子に書を開いて読むよう教え、
    ときには客を相手に碁盤を囲む。
    うれしければ杖をついて香る小道を歌い、
    興が湧けば琴を携え、緑の山腹へ登る。
    草履、麻の帯、粗布の着物でも、
    心の広さは、薄絹をまとう身にまさる。」
  "translation_status": "reviewed"
- "id": "xy-ch10-014"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    張稍道：「李定，我兩個真是微吟可相狎，不須檀板共金樽。但散道詞章，不為稀罕。且各聯幾句，看我們漁樵攀話何如？」李定道：「張兄言之最妙。請兄先吟。」
    「舟停綠水煙波內，家住深山曠野中。
    偏愛溪橋春水漲，最憐岩岫曉雲蒙。
    龍門鮮鯉時烹煮，蟲蛀乾柴日燎烘。
    釣網多般堪贍老，擔繩二事可容終。
    小舟仰臥觀飛雁，草徑斜欹聽唳鴻。
    口舌場中無我分，是非海內少吾蹤。
    溪邊掛晒繒如錦，石上重磨斧似鋒。
    秋月暉暉常獨釣，春山寂寂沒人逢。
    魚多換酒同妻飲，柴剩沽壺共子叢。
    自唱自斟隨放蕩，長歌長嘆任顛風。
    呼兄喚弟邀船夥，挈友攜朋聚野翁。
    行令猜拳頻遞盞，拆牌道字漫傳鐘。
    烹蝦煮蟹朝朝樂，炒鴨爊雞日日豐。
    愚婦煎茶情散淡，山妻造飯意從容。
    曉來舉杖淘輕浪，日出擔柴過大沖。
    雨後披簑擒活鯉，風前弄斧伐枯松。
    潛蹤避世妝痴蠢，隱姓埋名作啞聾。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 182
    "line_end": 199
  "translation_ja": |-
    張稍「李定、私たちはまさに、小声で詩を吟じれば親しみ合えて、檀（だん・推定。堅い材を持ち、拍子木などに用いる木の呼び名）の拍子木や金の酒器も要らぬ仲だな。ただ、別々に詞を詠むだけでは珍しくない。各々何句かずつつなぎ、漁師と木こりの語らいが、どんなものになるか試そうじゃないか。」
    李定「張兄、実に妙案だ。どうか先に詠んでくれ。」
    張稍から詠み始め、二人は句をつないだ。
    張稍と李定「舟は緑の水、煙る波の中に止め、家は深山、広い野の中に置く。
    ひときわ愛すのは渓橋に春の水が増すさま、何より好むのは岩峰に朝の雲がかかるさま。
    竜門（りゅうもん・推定。黄河の急流にある峡谷。鯉が登ると竜になるという伝説の地）の新鮮な鯉を折々煮て、虫食いの乾いた薪を日々燃やす。
    釣りと網のさまざまな道具で老いを養い、担い棒と縄の二つで一生を終えられる。
    小舟にあおむいて飛ぶ雁を眺め、草の道に身を傾け、雁の鳴く声を聞く。
    口論の場に私の出番はなく、是非の海に私の足跡は少ない。
    川辺に掛け干す網は錦のよう、石に重ねて研ぐ斧は鋭い刃のよう。
    秋の月が明るければいつも独りで釣り、春の山が静かなら人に会うこともない。
    魚が多ければ酒に換えて妻と飲み、薪が余れば一壺買って子と集まる。
    自ら歌い、自ら注ぎ、気ままに楽しみ、長く歌い、長く嘆き、狂おしいまま振る舞う。
    兄よ弟よと舟仲間を誘い、友を連れて野の翁たちと集まる。
    酒令（しゅれい・推定。酒席で詩や勝負などの決まりに従い杯を回す遊び）や拳遊びでしきりに杯を回し、牌（はい・推定。文字や模様を記した札で、遊戯に用いる）を読み、文字を分ける遊びでゆるりと酒器を巡らす。
    エビを煮、カニをゆで、朝ごとに楽しみ、鴨を炒め、鶏をじっくり煮て、日々豊か。
    愚妻が茶を煎じれば心は淡く静まり、山の妻が飯を作れば気持ちはゆったり。
    朝には竿を挙げて軽い波をかき、日が出れば薪を担いで大きな窪地を越える。
    雨の後は蓑を着て生きた鯉を捕り、風の前では斧を振るって枯れ松を伐る。
    姿を隠し世を避けて愚か者を装い、姓も名も伏せ、口も耳も利かぬふりをする。」

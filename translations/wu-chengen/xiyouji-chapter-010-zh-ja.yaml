  "translation_ja": |-
    第十回
    老竜王、拙い計略で天の掟を犯し　魏丞相、書を託して冥界の役人に頼む
  "translation_status": "reviewed"
- "id": "xy-ch10-002"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    且不題光蕊盡職，玄奘修行。卻說長安城外涇河岸邊，有兩個賢人：一個是漁翁，名喚張稍；一個是樵子，名喚李定。他兩個是不登科的進士，能識字的山人。一日，在長安城裡賣了肩上柴，貨了籃中鯉，同入酒館之中，吃了半酣，各攜一瓶，順涇河岸邊，徐步而回。張稍道：「李兄，我想那爭名的，因名喪體；奪利的，為利亡身；受爵的，抱虎而眠；承恩的，袖蛇而走。算起來，還不如我們水秀山青，逍遙自在，甘淡薄，隨緣而過。」李定道：「張兄說得有理。但只是你那水秀，不如我的山青。」張稍道：「你山青不如我的水秀。有一《蝶戀花》詞為證。詞曰：
    煙波萬里扁舟小，靜依孤篷，西施聲音遶。滌慮洗心名利少，閑攀蓼穗蒹葭草。
    數點沙鷗堪樂道，柳岸蘆灣，妻子同歡笑。一覺安眠風浪消，無榮無辱無煩惱。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 121
    "line_end": 124
  "translation_ja": |-
    陳光蕊（ちんこうずい・推定。玄奘の父で、官人となった人物）が職務を尽くし、玄奘（げんじょう。のちに経典を求めて西へ旅する僧）が修行する話は、ひとまず置こう。さて、長安（ちょうあん・推定。唐の都。現在の西安に当たる）の城外、涇河（けいが・推定。長安近くを流れ、渭河へ注ぐ川）の岸辺に二人の賢人がいた。一人は漁師で、名を張稍（ちょうしょう・推定。涇河で漁をし、李定と詩を交わす漁師）といい、もう一人は木こりで、名を李定（りてい・推定。張稍の友人で、詩を好む木こり）といった。二人とも、科挙（かきょ。中国で官人を選ぶために行われた試験制度）に及第してはいない進士（しんし・推定。科挙の試験に合格した者の称。ここでは学識ある人にたとえる）、読み書きのできる山人（さんじん・推定。山里に暮らし、世俗を離れた人）というべき者だった。ある日、長安の町で肩の薪と籠の鯉を売り、そろって酒屋へ入り、ほろ酔いになった。各々酒を一瓶持つと、涇河の岸に沿って、ゆっくり歩いて帰った。
    張稍「李兄（りけい・推定。李定を親しみと敬意を込めて呼ぶ名）、私が思うに、名を争う者は名のため身を失い、利を奪い合う者は利のため命を落とす。爵位（しゃくい・推定。功績や身分に応じて授けられる貴族の位）を受けるのは虎を抱いて眠るようなもの、恩寵（おんちょう・推定。君主などから特別に受ける慈しみ）を受けるのは袖に蛇を入れて歩くようなものだ。考えてみれば、私たちの美しい水、青い山で、のびのび自由に、質素を楽しみ、縁に任せて暮らす方がよい。」
    李定「張兄（ちょうけい・推定。張稍を親しみと敬意を込めて呼ぶ名）の言うことはもっともだ。ただ、お前の水の美しさは、私の山の青さにかなわない。」
    張稍「お前の山の青さこそ、私の水の美しさにかなわない。その証しに、『蝶恋花（ちょうれんか・推定。詞の曲調と字数・韻の型を示す名）』の詞（し・推定。曲調に合わせ、句の長さと韻を定めた中国の詩歌形式）が一つある。こうだ。
    煙る波は万里、小舟は小さく、
    一つの篷（とま。舟を覆う、竹や草などで編んだ屋根）に静かに寄れば、西施（せいし。古代中国の美女。ここでの声の比喩の細義は未確定）の声が巡る。
    思いをすすぎ、心を洗い、名利への思いは少なく、
    のんびり蓼（たで・推定。水辺などに生えるタデ科の草）の穂や葦の草を手折る。
    点々といる砂洲のカモメこそ、語る楽しみ。
    柳の岸、葦の入り江で、妻や子と笑い合う。
    一眠り安らかにすれば、風も波も静まり、
    栄誉も恥辱もなく、悩みもない。」

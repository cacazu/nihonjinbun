  "translation_status": "reviewed"
- "id": "xy-ch10-037"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    棋盤為地子為天，色按陰陽造化全。
    下到玄微通變處，笑誇當日爛柯仙。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 253
    "line_end": 254
  "translation_ja": |-
    碁盤を地とし、碁石を天とし、色は陰陽（いんよう。天地や物事の変化を生むとされた陰と陽の二つの働き）に応じて造化（ぞうか・推定。天地が万物を生み育てる働き）を尽くす。
    玄妙（げんみょう・推定。奥深く、容易には知り尽くせないこと）な変化に通じるところまで打ち進めば、かの爛柯（らんか。仙人の碁を見ている間に斧の柄が腐ったという故事。囲碁の異称）の仙人にも笑って誇れよう。
  "translation_status": "reviewed"
- "id": "xy-ch10-038"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "君臣兩個對弈，此棋正下到午時三刻，一盤殘局未終，魏徵忽然俯伏在案邊，鼾鼾盹睡。太宗笑曰：「賢卿真是匡扶社稷之心勞，創立江山之力倦，所以不覺盹睡。」太宗任他睡著，更不呼喚。不多時，魏徵醒來，俯伏在地道：「臣該萬死，臣該萬死！卻才倦困，不知所為，望陛下赦臣慢君之罪。」太宗道：「卿有何慢罪？且起來，拂退殘棋，與卿從新更著。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 256
    "line_end": 256
  "translation_ja": |-
    君臣二人が碁を打ち、ちょうど午の刻三刻になっても、一局はまだ終わっていなかった。魏徴は突然、机の脇にうつぶせになり、いびきをかいて居眠りを始めた。太宗は笑った。
    太宗「卿はまことに、社稷（しゃしょく。土地と穀物の神。転じて国家をいう）を支える心を疲らせ、天下を築く力を使い果たしている。それゆえ、知らぬ間に居眠りをしてしまったのだな。」
    太宗は眠るに任せ、呼び起こさなかった。ほどなく魏徴が目覚め、地に伏した。
    魏徴「臣は万死に値します、万死に値します！　先ほどは疲れ眠くなり、何をしているか分からなくなりました。陛下、君を侮った罪をお赦しください。」
    太宗「卿に何の侮りの罪があろう。さあ立つがよい。途中の石を片づけ、もう一局打ち直そう。」
  "translation_status": "reviewed"
- "id": "xy-ch10-039"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "魏徵謝了恩，卻才撚子在手，忽聽得朝門外大呼小叫。原來是秦叔寶、徐茂公等，將著一個血淋的龍頭，擲在帝前，啟奏道：「陛下，海淺河枯曾有見，這般異事卻無聞。」太宗與魏徵起身道：「此物何來？」叔寶、茂公道：「千步廊南，十字街上，雲端裡落下這顆龍頭，微臣不敢不奏。」唐王驚問魏徵：「此是何說？」魏徵轉身叩頭道：「是臣才一夢斬的。」唐王聞言，大驚道：「賢卿盹睡之時，又不曾見動身動手，又無刀劍，如何卻斬此龍？」魏徵奏道：「主公，臣的身在君前，夢離陛下。身在君前對殘局，合眼朦朧；夢離陛下乘瑞雲，出神抖擻。那條龍在剮龍臺上，被天兵將綁縛其中。是臣道：『你犯天條，合當死罪。我奉天命，斬汝殘生。』龍聞哀苦，臣抖精神。龍聞哀苦，伏爪收鱗甘受死；臣抖精神，撩衣進步舉霜鋒。扢扠一聲刀過處，龍頭因此落虛空。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 257
    "line_end": 257
  "translation_ja": |-
    魏徴は恩を謝し、手に石をつまんだところで、朝門（ちょうもん・推定。宮廷の門）の外から騒ぎ声が聞こえた。秦叔宝と徐世勣らが、血まみれの竜の頭を持ってきて、皇帝の前に投げ置き、奏上した。
    秦叔宝と徐世勣「陛下、海が浅くなり、川が枯れることは見聞きしたこともありますが、これほどの異変は聞いたことがございません。」
    太宗と魏徴は立ち上がった。
    太宗と魏徴「これはどこから来たのだ。」
    秦叔宝と徐世勣「千歩廊（せんぽろう・推定。宮廷の前にある長い回廊の名）の南、十字路の上で、雲の中からこの竜の頭が落ちてきました。臣ども、ご報告せずにはおれませんでした。」
    太宗は驚いて魏徴に尋ねた。
    太宗「これはどういうことだ。」
    魏徴は身を返し、額づいた。
    魏徴「臣が先ほど、夢の中で斬ったものでございます。」
    太宗は聞いて、たいそう驚いた。
    太宗「卿が眠っているとき、体も手も動かさず、刀も剣もなかった。それなのに、どうしてこの竜を斬れたのだ。」
    魏徴「陛下、臣の身は御前にあり、夢は陛下のもとを離れておりました。身は御前で打ちかけの碁に向かい、目を閉じてうとうとし、夢は陛下を離れて瑞雲（ずいうん・推定。めでたい兆しとされる美しい雲）に乗り、元神を出して奮い立ちました。あの竜は剮竜台で、天兵天将（てんぺいてんしょう・推定。天界の兵士と将軍たち）に縛られておりました。臣は『お前は天の掟を犯し、死罪に当たる。私は天命を受け、お前の残りの命を斬る』と告げました。竜は聞いて悲しみ苦しみ、臣は気力を奮いました。竜は悲しみ、爪を伏せ、鱗を収め、甘んじて死を受け、臣は奮い立ち、裾を上げ、歩み寄り、霜の刃を振り上げました。ざくりと一声、刀が通れば、竜の頭はこうして空から落ちたのでございます。」
  "translation_status": "reviewed"
- "id": "xy-ch10-040"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗聞言，心中悲喜不一。喜者，誇獎魏徵好臣，朝中有此豪傑，愁甚江山不穩？悲者，謂夢中曾許救龍，不期竟致遭誅。只得強打精神，傳旨著叔寶將龍頭懸掛市曹，曉諭長安黎庶。一壁廂賞了魏徵，眾官散訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 259
    "line_end": 259
  "translation_ja": "太宗は聞くと、心に悲しみと喜びが入り交じった。喜びは、魏徴をよき臣と褒め、朝廷にこれほどの豪傑がいれば、天下の不安など何を憂えよう、と思うことであった。悲しみは、夢の中で竜を救うと約束したのに、思いがけず処刑されてしまったことである。やむなく気を取り直し、秦叔宝に命じて竜の頭を市中の刑場に掛け、長安の民に知らせた。一方で魏徴に褒美を与え、官人たちはみな退出した。"
  "translation_status": "reviewed"
- "id": "xy-ch10-041"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當晚回宮，心中只是憂悶。想那夢中之龍，哭啼啼哀告求生，豈知無常，難免此患。思念多時，漸覺神魂倦怠，身體不安。當夜二更時分，只聽得宮門外有號泣之聲，太宗愈加驚恐。正朦朧睡間，又見那涇河龍王手提著一顆血淋淋的首級，高叫：「唐太宗，還我命來！還我命來！你昨夜滿口許諾救我，怎麼天明時反宣人曹官來斬我？你出來，你出來，我與你到閻君處折辨折辨。」他扯住太宗，再三嚷鬧不放。太宗箝口難言，只掙得汗流遍體。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 260
    "line_end": 260
  "translation_ja": |-
    その夜、宮中に戻っても、太宗の心は憂いに沈むばかりだった。夢の中の竜は、泣きながら命乞いをしていた。それが世の無常、この災いを免れなかったとは。長く思い続けるうち、次第に魂が疲れ、体の具合も悪くなった。その夜、二更（にこう・推定。一夜を五つに分けた二番目の時刻。宵を過ぎたころ）ごろ、宮門の外に泣き叫ぶ声が聞こえ、太宗はいっそう恐れた。うとうと眠りかけると、涇河の竜王が血まみれの頭を手に提げ、叫ぶのが見えた。
    涇河の竜王「唐の太宗、命を返せ！　命を返せ！　昨夜は、救うと口を極めて約束したではないか。それなのに、なぜ夜が明けると、かえって人曹官を呼んで私を斬らせたのだ。出てこい、出てこい。閻君（えんくん・推定。冥界で死者の罪を裁く王の呼び名）のもとへ行って、どちらが正しいか言い争おう。」
    太宗をつかみ、何度も騒ぎ立てて放さなかった。太宗は口がふさがったように言葉も出ず、もがいて全身に汗を流すばかりだった。
  "translation_status": "reviewed"
- "id": "xy-ch10-042"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正在那難分難解之時，只見正南上香雲繚繞，彩霧飄飄，有一個女真人上前，將楊柳枝用手一擺，那沒頭的龍悲悲啼啼，徑往西北而去。原來這是觀音菩薩領佛旨，上東土尋取經人，住此長安城都土地廟裡，夜聞鬼泣神號，特來喝退業龍，救脫皇帝。那龍徑到陰司地獄具告不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 262
    "line_end": 262
  "translation_ja": "振りほどくことも引き離すこともできない、そのさなか、真南に香る雲がたなびき、彩りの霧が漂った。一人の女真人（にょしんじん・推定。道を極めた女性の仙人。ここでは観音の姿を指す）が進み出て、手にした柳の枝をひと振りすると、首のない竜は悲しげに泣きながら、まっすぐ西北へ去った。実はこれは観音菩薩（かんのんぼさつ。人々の苦しみを救う菩薩で、取経の人を捜す）であった。仏の命を受け、東土（とうど・推定。仏教の伝来先として東方にある中国の地）で取経（しゅきょう・推定。仏教の経典を求めて手に入れること）の人を捜すため、長安の都の土地廟（とちびょう・推定。その土地を守る神をまつる祠）に泊まっていたところ、夜、鬼神の泣き叫ぶ声を聞き、わざわざ来て罪業の竜を叱り退け、皇帝を救い出したのである。竜はそのまま冥府（めいふ・推定。死者の魂が送られる世界）の地獄へ訴え出たが、その話は置こう。"
  "translation_status": "reviewed"
- "id": "xy-ch10-043"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說太宗甦醒回來，只叫：「有鬼！有鬼！」慌得那三宮皇后、六院嬪妃，與近侍太監，戰兢兢，一夜無眠。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 264
    "line_end": 264
  "translation_ja": |-
    さて、太宗は正気に戻ると、ただ叫び続けた。
    太宗「幽霊だ！　幽霊だ！」
    三宮（さんぐう・推定。皇后などの住まう宮殿、またはそこにいる后妃を表す語）の皇后、六院（りくいん・推定。後宮の複数の御殿、またはそこに住む妃たちを表す語）の妃たち、側仕えの宦官（かんがん・推定。去勢され、宮中で皇帝や后妃に仕えた男性の役人）は慌てふためき、震えながら一夜を眠らず過ごした。
  "translation_status": "reviewed"
- "id": "xy-ch10-044"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不覺五更三點，那滿朝文武多官，都在朝門外候朝。等到天明，猶不見臨朝，諕得一個個驚懼躊躇。及日上三竿，方有旨意出來道：「朕心不快，眾官免朝。」不覺倏五七日，眾官憂惶，都正要撞門見駕問安，只見太后有旨，召醫官入宮用藥。眾人在朝門外等候討信。少時，醫官出來，眾問何疾。醫官道：「皇上脈氣不正，虛而又數，狂言見鬼。又診得十動一代，五臟無氣，恐不諱只在七日之內矣。」眾官聞言，大驚失色。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 265
    "line_end": 265
  "translation_ja": |-
    いつしか五更（ごこう。一夜を五つに分けた最後の時刻。明け方ごろ）の三点となり、満朝の文武の官人たちは、朝門の外で朝議を待っていた。夜が明けても皇帝は現れず、みな恐れ、途方に暮れた。日が三竿も上がって、ようやく勅命が出た。
    太宗の勅命「朕は心地がよくない。今日は朝議を免ずる。」
    瞬く間に五、七日が過ぎ、官人たちは不安に駆られ、門を押して入ってでも、お加減を伺おうとした。そのとき太后（たいこう・推定。先帝の后などに対する尊称。本文ではこの表記を保つ）の命があり、医官を宮中へ呼んで薬を用いさせた。一同は朝門の外で知らせを待った。しばらくして医官が出てくると、何の病かと尋ねた。
    医官「陛下の脈は乱れ、弱いうえに速く、鬼が見えると譫言（うわごと。意識のはっきりしないときに口走る、筋の通らない言葉）を申されます。また、十の拍動に一度、脈が途切れ、五臓（ごぞう・推定。伝統医学でいう肝・心・脾・肺・腎）に気がございません。恐れながら、七日以内に御不幸があるかと存じます。」
    官人たちは聞いて驚き、顔色を失った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "太后は底本の呼称を保持。医官の診断は歴史的物語の描写であり、現代医学上の説明ではない。"
- "id": "xy-ch10-045"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正愴惶間，又聽得太后有旨宣徐茂公、護國公、尉遲恭見駕。三公奉旨，急入到分宮樓下。拜畢，太宗正色強言道：「賢卿，寡人十九歲領兵，南征北伐，東擋西除，苦歷數載，更不曾見半點邪祟，今日卻反見鬼。」尉遲恭道：「創立江山，殺人無數，何怕鬼乎？」太宗道：「卿是不信。朕這寢宮門外，入夜就拋磚弄瓦，鬼魅呼號，著然難處。白日猶可，昏夜難禁。」叔寶道：「陛下寬心，今晚臣與敬德把守宮門，看有甚麼鬼祟。」太宗准奏。茂公謝恩而出。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 267
    "line_end": 267
  "translation_ja": |-
    うろたえているところへ、また太后の命があり、徐世勣、秦叔宝、尉遅恭を召し出した。三公（さんこう・推定。ここでは徐世勣・秦叔宝・尉遅恭の三人への敬称）は命を受け、急いで分宮楼（ぶんきゅうろう・推定。唐の宮中にある楼門の名）の下へ入った。拝礼が済むと、太宗は顔を正し、力を振り絞って言った。
    太宗「卿らよ、朕は十九で兵を率い、南征北伐、東を防ぎ西を討ち、幾年も苦労を重ねたが、邪悪なものなど少しも見たことはなかった。それが今日、かえって幽霊を見るとは。」
    尉遅恭「天下を築くため、数知れぬ人を殺してこられたのに、どうして幽霊をお恐れになります。」
    太宗「卿は信じぬのだな。この寝宮の門外では、夜になると煉瓦を投げ、瓦を鳴らし、鬼どもが叫ぶ。まことに手に負えぬ。昼間はまだよいが、夜の暗さには耐えられぬ。」
    秦叔宝「陛下、ご安心ください。今夜は臣と敬徳（けいとく・推定。尉遅恭の字）が宮門を守り、どんな鬼がいるのか、見届けましょう。」
    太宗は進言を認めた。徐世勣は恩を謝して退出した。
  "translation_status": "reviewed"
- "id": "xy-ch10-046"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日天晚，各取披掛，他兩個介冑整齊，執金瓜、鉞斧，在宮門外把守。好將軍！你看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 269
    "line_end": 269
  "translation_ja": "その日、暮れると、二人はそれぞれ武具を取り、鎧兜をきちんと着け、金瓜（きんか・推定。瓜形の頭を備えた、儀仗にも用いる打撃武器）と鉞斧（えっぷ。大きな刃を持つ斧状の武器）を持ち、宮門の外を守った。見事な将軍たちだ。その装いをご覧あれ。"
  "translation_status": "reviewed"
- "id": "xy-ch10-047"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭戴金盔光爍爍，身披鎧甲龍鱗。護心寶鏡幌祥雲，獅蠻收緊扣，繡帶彩霞新。這一個鳳眼朝天星斗怕，那一個環睛映電月光浮。他本是英雄豪傑舊勳臣，只落得千年稱戶尉，萬古作門神。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 270
    "line_end": 270
  "translation_ja": |-
    頭の金兜は光り輝き、身を覆う鎧は竜の鱗。
    胸を守る宝鏡には瑞雲が揺れ、獅子の飾りの留め金は固く締まり、刺繡の帯は彩雲のように鮮やか。
    こちらが鳳の目を天へ向ければ星も恐れ、あちらの丸い眼には稲妻が映り、月光が浮かぶ。
    もとは英雄豪傑、古参の功臣、ついには千年、戸を守る武官と呼ばれ、万世の門神（もんしん・推定。門を守って悪いものを防ぐ神）となった。
  "translation_status": "reviewed"
- "id": "xy-ch10-048"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二將軍侍立門傍，一夜天曉，更不曾見一點邪祟。是夜，太宗在宮，安寢無事。曉來宣二將軍，重重賞勞道：「朕自得疾，數日不能得睡，今夜仗二將軍威勢甚安。卿且請出安息安息，待晚間再一護衛。」二將謝恩而出。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 272
    "line_end": 272
  "translation_ja": |-
    二将軍（にしょうぐん・推定。太宗の宮門を守る二人の将軍、秦叔宝と尉遅恭）は門の脇に立ち、一夜が明けるまで、邪悪なものを少しも見なかった。その夜、太宗は宮中で無事、安らかに眠った。朝になると二人を召し、手厚くねぎらい、賞した。
    太宗「病になってから幾日も眠れなかったが、今夜は二将軍の威勢に頼って、たいそう安らかだった。ひとまず退出して休むがよい。夜になったら、また守ってくれ。」
    二将軍は恩を謝して退出した。
  "translation_status": "reviewed"
- "id": "xy-ch10-049"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "遂此二三夜把守俱安。只是御膳減損，病轉覺重。太宗又不忍二將辛苦，又宣叔寶、敬德與杜、房諸公入宮，吩咐道：「這兩日朕雖得安，卻只難為秦、胡二將軍徹夜辛苦。朕欲召巧手丹青，傳二將軍真容，貼於門上，免得勞他。如何？」眾臣即依旨，選兩個會寫真的，著胡、秦二公依前披掛，照樣畫了，貼在門上。夜間也即無事。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 274
    "line_end": 274
  "translation_ja": |-
    こうして二、三夜の警護はいずれも無事だった。ただ、食事の量は減り、病はますます重く感じられた。太宗は二将軍の苦労にも忍びず、また秦叔宝、尉遅恭、杜如晦、房玄齢らを宮中へ呼び、命じた。
    太宗「この二日は安らかに過ごせたが、秦（しん・推定。ここでは秦叔宝を姓で呼ぶ名）・胡（こ・推定。本文で尉遅恭を指す略称として使われる表記）の二将軍に徹夜の苦労をかけた。腕のよい絵師を呼んで、二人の真の姿を描き、門に貼って、その労を省きたい。どうであろう。」
    臣たちは命に従い、肖像のうまい者を二人選んだ。尉遅恭と秦叔宝に先と同じ武装をさせ、そのまま描いて門に貼った。夜もやはり何事もなかった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "胡・敬德・尉遲恭を同一人物として本文の呼称を統一するが、太宗の発話内の秦・胡は保持。"
- "id": "xy-ch10-050"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如此二三日，又聽得後宰門乒乓乒乓，磚瓦亂響。曉來即宣眾臣曰：「連日前門幸喜無事，今夜後門又響，卻不又驚殺寡人也。」茂公進前奏道：「前門不安，是敬德、叔寶護衛；後門不安，該著魏徵護衛。」太宗准奏，又宣魏徵今夜把守後門。徵領旨，當夜結束整齊，提著那誅龍的寶劍，侍立在後宰門前，真個的好英雄也。他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 276
    "line_end": 276
  "translation_ja": |-
    そうして二、三日すると、また後宰門（こうさいもん・推定。宮殿の後方にある門の名）で、がたがたと煉瓦や瓦の乱れ鳴る音がした。朝、太宗はすぐ臣たちを召した。
    太宗「この数日、前門は幸い無事だったが、今夜は後門がまた鳴った。これでは、また朕を驚かせて殺すようなものではないか。」
    徐世勣は進み出て奏上した。
    徐世勣「前門が安らかでなかったときは、敬徳と叔宝（しゅくほう・推定。秦叔宝を字で呼ぶ名）が守りました。後門が安らかでなければ、魏徴に守らせるべきでございます。」
    太宗は進言を認め、魏徴を呼んで、その夜の後門を守らせた。魏徴は命を受け、その晩、装いを整え、竜を斬った宝剣を提げて、後宰門の前に立った。まことに見事な英雄である。その装いは、
  "translation_status": "reviewed"
- "id": "xy-ch10-051"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "熟絹青巾抹額，錦袍玉帶垂腰。兜風氅袖采霜飄，壓賽壘荼神貌。腳踏烏靴坐折，手持利刃兇驍。圓睜兩眼四邊瞧，那個邪神敢到？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 277
    "line_end": 277
  "translation_ja": |-
    練絹（ねりぎぬ・推定。生糸のにかわ質を除いて柔らかくした絹）の青い頭巾を額に巻き、錦の袍（ほう・推定。体をゆったり包む丈の長い衣）には玉の帯が腰に垂れる。
    風をはらむ広い袖には霜の光が翻り、壘荼（るいと・推定。本文にこの表記で現れる門の守護神。神荼・鬱壘との関連が考えられる）の神の姿にもまさる。
    足には折り目のついた黒い靴、手には鋭い刃、凄まじい勇姿。
    両眼を丸く見開き、四方を見回せば、どの邪神が近寄れよう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "壘荼を原字で保持。神荼・鬱壘等への無断訂正はしない。坐折の細義は留保し、靴の折り目と解する。"
- "id": "xy-ch10-052"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一夜通明，也無鬼魅。雖是前後門無事，只是身體漸重。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 279
    "line_end": 279
  "translation_ja": "夜が明けるまで、やはり鬼は出なかった。前門も後門も無事になったが、体の具合だけは、次第に重くなっていった。"
  "translation_status": "reviewed"
- "id": "xy-ch10-053"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，太后又傳旨，召眾臣商議殯殮後事。太宗又宣徐茂公，吩咐國家大事，叮囑倣劉蜀主託孤之意。言畢，沐浴更衣，待時而已。傍閃魏徵，手扯龍衣，奏道：「陛下寬心，臣有一事，管保陛下長生。」太宗道：「病勢已入膏肓，命將危矣，如何保得？」徵云：「臣有書一封，進與陛下，捎去到陰司，付酆都判官崔珏。」太宗道：「崔珏是誰？」徵云：「崔珏乃是太上先皇帝駕前之臣，先受茲洲令，後陞禮部侍郎。在日與臣八拜為交，相知甚厚。他如今已死，現在陰司做掌生死文簿的酆都判官，夢中常與臣相會。此去若將此書付與他，他念微臣薄分，必然放陛下回來。管教魂魄還陽世，定取龍顏轉帝都。」太宗聞言，接在手中，籠入袖裡，遂瞑目而亡。那三宮六院、皇后嬪妃、侍長儲君及兩班文武，俱舉哀戴孝。又在白虎殿上，停著梓宮不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 281
    "line_end": 281
  "translation_ja": |-
    ある日、太后はまた命を下し、臣たちを呼んで、納棺や葬儀など後のことを相談した。太宗も徐世勣を呼び、国家の大事を託し、蜀（しょく・推定。劉備が建てた三国時代の国）の君主、劉備（りゅうび・推定。三国時代に蜀を建てた君主）が孤児を託したときにならって、ねんごろに言い聞かせた。言い終えると、湯浴みして衣を替え、あとはその時を待つばかりだった。脇から魏徴が進み出て、竜の衣を引き、奏上した。
    魏徴「陛下、ご安心ください。臣に一つ手立てがございます。必ず陛下の長命を保証いたします。」
    太宗「病はすでに膏肓（こうこう。昔、治療が及ばないと考えた体の奥。「病が膏肓に入る」は重病になること）に入り、命も危うい。どうして保証できるのだ。」
    魏徴「臣の手紙を一通、陛下に差し上げます。冥府へお持ちになり、酆都（ほうと。死者の世界があるとされた場所。ここでは冥府の所在地）の判官（はんがん。冥府で死者の帳簿や裁判に携わる役人）、崔珏（さいかく・推定。魏徴と親交があり、死後は冥府の判官となった人物）へお渡しください。」
    太宗「崔珏とは誰だ。」
    魏徴「崔珏は先代の太上皇帝（たいじょうこうてい・推定。皇帝の父や退位した皇帝に対する尊称）に仕えた臣で、初め茲洲（じしゅう・推定。本文に崔珏の赴任地として現れる地名。字を補訂せず保持する）の県令（けんれい・推定。一つの県を治める地方長官）に任じられ、後に礼部侍郎（れいぶじろう・推定。儀礼や科挙などを担う礼部の次官）へ昇りました。生前、臣とは八拝の交わり（はっぱいのまじわり・推定。互いに礼拝し、兄弟同然の深い親交を結ぶこと）を結び、たいそう深い親交がございました。今は亡くなり、冥府で生死の帳簿を司る酆都の判官となっておりますが、夢の中でよく臣と会います。此度おいでになる際、この手紙をお渡しになれば、臣とのわずかな縁を思って、必ず陛下を帰してくれましょう。魂は必ず陽の世に戻り、竜顔（りゅうがん・推定。天子の顔を敬っていう語）はきっと帝都へお帰りになります。」
    太宗は聞くと、手に受け取り、袖へしまい、そのまま目を閉じて亡くなった。三宮六院（さんぐうりくいん・推定。皇后や妃たちの住む後宮全体を表す言い方）の皇后、妃たち、側仕えの長、皇太子（こうたいし。皇位を継ぐことになっている皇子）、文武二班の臣たちは、みな声を上げて泣き、喪服を着けた。白虎殿（びゃっこでん・推定。太宗の棺を安置した宮殿の名）には天子の棺を安置したが、この話はひとまず置こう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "茲洲の地名を原字で保持。先受茲洲令の官職上の不整合や侍長の詳細は留保。太后も底本のまま。"
- "id": "xy-ch10-054"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知太宗如何還魂，且聽下回分解。"
  "source_languages":

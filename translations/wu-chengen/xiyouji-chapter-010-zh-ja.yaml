      "exact": |-
        敗葉枯藤滿路，破梢老竹盈山。女蘿乾葛亂牽攀，折取收繩殺擔。
        蟲蛀空心榆柳，風吹斷頭松柟。採來堆積備冬寒，換酒換錢從俺。」
    "translation_span":
      "start": 45
      "end": 234
      "exact": |-
        朽ち葉と枯れ藤は道に満ち、
        折れた枝や老いた竹は山にいっぱい。
        サルオガセ（木の枝から糸状に垂れ下がる地衣類）や乾いた葛が乱れ絡まり、
        折り取って縄でまとめ、荷に締める。
        虫に食われ、芯の空いたニレや柳、
        風に梢を折られた松や柟（なん・推定。クスノキ科の楠木類を指す字。日本のクスと同一とは限らない）の木。
        集めて積んで、冬の寒さに備え、
        酒に換えるも銭に換えるも、私の自由。」

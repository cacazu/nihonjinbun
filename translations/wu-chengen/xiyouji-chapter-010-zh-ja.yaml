  - "底本は中文維基文庫固定版oldid=2194739（2022年11月15日15:30 UTC）、同サイトの第001〜009回に連続する系列。原典は公有、電子翻刻の帰属と継承条件を保持。AI新訳であり、専門家の独立校訂は未実施。"
  - "地の文と話者は張稍、李定、涇河の竜王、袁守誠、太宗、魏徴、徐世勣、秦叔宝、尉遅恭等に統一。白衣の学者への変身も同一人物と分かるよう訳した。聯句二篇は原文に各句の話者指定がないため、張稍と李定の合同ラベルを付け、先に詠む人物は前文に示す。"
  - "原文の胡敬德・敬德・尉遲恭は同一人物の呼称として整理し、会話の秦・胡は保持。劉洪紀・太后・茲洲・臺政・壘荼などの底本表記は別版で訂正しない。鳥英・黄楝等の植物の同定は留保する。"
  - "尺・寸・点の雨量や時刻は物語内の数値を保持し、現代の雨量や時刻に確定換算しない。占術、医官の診断、門神の由来は物語の記述。西施・三象・余丁などの細義には留保がある。"

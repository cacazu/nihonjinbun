      "exact": |-
        崔巍峻嶺接天涯，草舍茅庵是我家。醃臘雞鵝強蟹鱉，獐豝兔鹿勝魚蝦。
        香椿葉，黃楝芽，竹筍山茶更可誇。紫李紅桃梅杏熟，甜梨酸棗木樨花。」
    "translation_span":
      "start": 57
      "end": 332
      "exact": |-
        険しい峰々は空の果てへ続き、
        草葺きの家、茅の庵こそ我が家。
        塩漬けの鶏や鵞鳥（がちょう・推定。ガンを飼い慣らした家禽）は、カニやスッポンよりうまく、
        キバノロ（雄に長い牙がある小型のシカ）、雌の猪、兎や鹿は、魚やエビにまさる。
        チャンチン（若芽や若葉を食用にするセンダン科の木）の葉、黄楝（こうれん・推定。原文に芽を食べる植物として挙がる名。種の同定は未確定）の芽、
        タケノコ、山茶（さんちゃ・推定。山に生える茶やツバキ類を指す語。ここでの種は未確定）も自慢の品。
        紫のスモモ、紅い桃、梅や杏は熟れ、
        甘い梨、酸っぱいナツメ、モクセイの花もある。」

- "id": "spoken-poem-002"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-002"
    "source_span":
      "start": 252
      "end": 324
      "exact": |-
        煙波萬里扁舟小，靜依孤篷，西施聲音遶。滌慮洗心名利少，閑攀蓼穗蒹葭草。
        數點沙鷗堪樂道，柳岸蘆灣，妻子同歡笑。一覺安眠風浪消，無榮無辱無煩惱。」
    "translation_span":
      "start": 831
      "end": 1057
      "exact": |-
        煙る波は万里、小舟は小さく、
        一つの篷（とま。舟を覆う、竹や草などで編んだ屋根）に静かに寄れば、西施（せいし。古代中国の美女。ここでの声の比喩の細義は未確定）の声が巡る。
        思いをすすぎ、心を洗い、名利への思いは少なく、
        のんびり蓼（たで・推定。水辺などに生えるタデ科の草）の穂や葦の草を手折る。
        点々といる砂洲のカモメこそ、語る楽しみ。
        柳の岸、葦の入り江で、妻や子と笑い合う。
        一眠り安らかにすれば、風も波も静まり、
        栄誉も恥辱もなく、悩みもない。」

- "id": "spoken-poem-010"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-010"
    "source_span":
      "start": 34
      "end": 106
      "exact": |-
        潮落旋移孤艇去，夜深罷棹歌來。簑衣殘月甚幽哉，宿鷗驚不起，天際彩雲開。
        困臥蘆洲無個事，三竿日上還捱。隨心儘意自安排，朝臣寒待漏，怎似我寬懷。」
    "translation_span":
      "start": 82
      "end": 334
      "exact": |-
        潮が引けば、すぐ一艘の舟を移し、
        夜更け、棹を収めて歌い帰る。
        蓑にかかる残月の、なんと静かなこと。
        眠るカモメも驚かず、
        空の果てに彩雲が開く。
        疲れれば葦の洲に寝て、何の用もなく、
        日が三竿（さんかん・推定。太陽が竿三本ほどの高さに昇るころという、朝の遅さの表現）も上がってなお、ぐずぐずしている。
        心のまま、思いのまま、自分で暮らしを決める。
        朝臣（ちょうしん・推定。朝廷に仕える臣下）は寒い中、朝参（ちょうさん・推定。臣下が朝廷へ出仕すること）の時を待つが、
        私のこの気楽さに、どうして及ぼう。」
  "separator": |2+


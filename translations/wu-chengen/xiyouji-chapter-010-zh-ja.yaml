- "id": "spoken-poem-007"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-007"
    "source_span":
      "start": 27
      "end": 109
      "exact": |-
        茆舍數椽山下蓋，松竹梅蘭真可愛。穿林越嶺覓乾柴，沒人怪，從我賣，或少或多憑世界。
        將錢沽酒隨心快，瓦缽磁甌殊自在。酕醄醉了臥松陰，無掛礙，無利害，不管人間興與敗。」
    "translation_span":
      "start": 39
      "end": 226
      "exact": |-
        山の麓に幾間かの茅屋（ぼうおく・推定。茅や草で屋根をふいた質素な家）を建て、
        松、竹、梅、蘭を、心から愛でる。
        林を抜け、峰を越え、乾いた薪を捜す。
        とがめる人もなく、売るのも自由、
        多いか少ないかは世間次第。
        その銭で酒を買い、心のままに楽しみ、
        土の鉢、磁器の碗で、まことに気楽。
        酔いしれて松陰に横たわり、
        しがらみも、利害もなく、
        人の世の栄えや衰えなど構わない。」
  "separator": |2+


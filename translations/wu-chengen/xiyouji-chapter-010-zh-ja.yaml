    "status": "open"
    "message_ja": "聯句の先行者は李定。各句の話者は推測せず合同ラベルとした。余丁の身分上の細義は留保。"
- "id": "xy-ch10-016"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他二人既各道詞章，又相聯詩句。行到那分路去處，躬身作別。張稍道：「李兄啊，途中保重，上山仔細看虎。假若有些凶險，正是『明日街頭少故人』。」李定聞言，大怒道：「你這廝憊懶！好朋友也替得生死，你怎麼咒我？我若遇虎遭害，你必遇浪翻江。」張稍道：「我永世也不得翻江。」李定道：「『天有不測風雲，人有暫時禍福。』你怎麼就保得無事？」張稍道：「李兄，你雖這等說，你還沒捉摸；不若我的生意有捉摸，定不遭此等事。」李定道：「你那水面上營生，極凶極險，隱隱暗暗，有甚麼捉摸？」張稍道：「你是不曉得。這長安城裡，西門街上，有一個賣卦的先生。我每日送他一尾金色鯉，他就與我袖傳一課，依方位，百下百著。今日我又去買卦，他教我在涇河灣頭東邊下網，西岸拋鉤，定獲滿載魚蝦而歸。明日上城來，賣錢沽酒，再與老兄相敘。」二人從此敘別。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 220
    "line_end": 220
  "translation_ja": |-
    二人はこのように、それぞれ詞を詠み、さらに詩句をつなぎ合った。道の分かれる所まで来ると、身をかがめて別れを告げた。
    張稍「李兄、道中、気をつけろよ。山へ入ったら、虎に用心することだ。万一危ないことでもあれば、まさに『明日は町角に、古い友が一人減る』というものだ。」
    李定は聞くと、ひどく怒った。
    李定「このろくでなし！　よい友なら、生死さえ身代わりになるものなのに、なぜ私を呪うのだ。私が虎に遭って死ぬなら、お前も波に遭って川で転覆するぞ。」
    張稍「私は未来永劫（みらいえいごう・推定。これから先、限りなく続く長い時間）、川で転覆などしない。」
    李定「『天には測れぬ風雲があり、人には時ならぬ禍福（かふく・推定。災いと幸せ）がある』という。どうして無事だと保証できる。」
    張稍「李兄、そう言っても、お前には確かな当てがない。私の商いには当てがあるから、そんなことには決して遭わないのだ。」
    李定「水の上で生計を立てるのは、この上なく危険で、先も見えない。どんな確かな当てがあるというのだ。」
    張稍「お前は知らないのだ。長安の西門街（せいもんがい・推定。長安の西門付近の通り）に、占いを売る先生がいる。私は毎日、金色の鯉を一匹届ける。すると先生が袖の中で一卦（いっか・推定。易で得られる一つの卦、または一回の占い）を出してくれ、その方角に従えば、百回投げて百回当たる。今日も占いを買いに行くと、涇河の曲がりの東側で網を下ろし、西岸で釣り針を投げれば、魚やエビを満載して帰れると教えてくれた。明日また町へ来て、売った銭で酒を買い、お前と語り合おう。」
    二人はこうして別れた。
  "translation_status": "reviewed"
- "id": "xy-ch10-017"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這正是：「路上說話，草裡有人。」原來這涇河水府有一個巡水的夜叉，聽見了百下百著之言，急轉水晶宮，慌忙報與龍王道：「禍事了！禍事了！」龍王問：「有甚禍事？」夜叉道：「臣巡水去到河邊，只聽得兩個漁、樵攀話，相別時，言語甚是利害。那漁翁說：長安城裡，西門街上，有個賣卦先生，算得最準。他每日送他鯉魚一尾，他就袖傳一課，教他百下百著。若依此等算準，卻不將水族盡情打了？何以壯觀水府，何以躍浪翻波，輔助大王威力？」龍王甚怒，急提了劍，就要上長安城，誅滅這賣卦的。旁邊閃過龍子、龍孫、蝦臣、蟹士、鰣軍師、鱖少卿、鯉太宰，一齊啟奏道：「大王且息怒。常言道：『過耳之言，不可聽信。』大王此去，必有雲從，必有雨助，恐驚了長安黎庶，上天見責。大王隱顯莫測，變化無方，但只變一秀士，到長安城內訪問一番。果有此輩，容加誅滅不遲；若無此輩，可不是妄害他人也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 221
    "line_end": 221
  "translation_ja": |-
    まさに「道で話せば、草の中に人がいる」というところ。実は涇河の水府（すいふ。水中にある竜王の居所や役所）に仕える巡水夜叉（じゅんすいやしゃ・推定。涇河の水域を巡回し、竜王に仕える夜叉）が、百回投げて百回当たるという話を聞いていた。急いで水晶宮（すいしょうきゅう・推定。涇河の竜王が住む水中の宮殿）へ戻り、慌てて涇河の竜王（けいがのりゅうおう・推定。涇河を治め、降雨をつかさどる竜王）に報告した。
    巡水夜叉「大変です、大変です！」
    涇河の竜王「何が大変なのだ。」
    巡水夜叉「臣（しん。臣下が君主に対して用いる自称）が水を巡って川辺へ行くと、漁師と木こりが話しておりました。別れ際の言葉が、ひどく恐ろしいのです。漁師は、長安の西門街にいる占い師はたいそうよく当たる、と申しました。毎日、鯉を一匹届けると、袖の中で一卦を出してくれ、百回投げて百回当たるようにしてくれるとか。これほど正確に占われては、水族（すいぞく・推定。魚やエビなど水中に暮らす生き物。ここでは竜王の臣下）を残らず捕り尽くされるではありませんか。何をもって水府を立派に飾り、何をもって波を躍らせ、うねりを起こし、大王の威力をお助けすればよいのでしょう。」
    涇河の竜王は激怒し、すぐ剣をつかんで長安へ行き、その占い師を殺そうとした。脇から、竜の子や孫、エビの臣、カニの士、鰣軍師（じぐんし・推定。鰣の姿の臣下で、竜王へ計略を進言する軍師）、鱖少卿（けつしょうけい・推定。鱖の姿をし、少卿の官名を持つ竜王の臣下）、鯉太宰（りたいさい・推定。鯉の姿をし、太宰の官名を持つ竜王の臣下）が進み出て、一斉に奏上（そうじょう・推定。帝王に申し上げること）した。
    竜の子孫と水族の臣下たち「大王、まずはお怒りをお鎮めください。『耳をかすめた言葉を、すぐ信じてはならぬ』といいます。大王がおいでになれば、必ず雲が従い、雨も助けるでしょう。長安の民を驚かせ、天上のおとがめを受ける恐れがあります。大王の隠顕（いんけん・推定。姿を隠すことと現すこと）は測り知れず、変化（へんげ。術によって姿や形を変えること）も自在です。学者一人の姿に化けて、長安で調べてみられてはいかがでしょう。本当にそんな者がいれば、殺すのはその後でも遅くありません。いなければ、むやみに人を害することになるではありませんか。」
  "translation_status": "reviewed"
- "id": "xy-ch10-018"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "龍王依奏，遂棄寶劍，也不興雲雨，出岸上，搖身一變，變作一個白衣秀士，真個："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 223
    "line_end": 223
  "translation_ja": "涇河の竜王は進言に従い、宝剣を手放し、雲も雨も起こさず、岸へ上がった。体を揺すって変身すると、白衣の学者となった。その姿は、まことに、"
  "translation_status": "reviewed"
- "id": "xy-ch10-019"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "丰姿英偉，聳壑昂霄。步履端祥，循規蹈矩。語言遵孔孟，禮貌體周文。身穿玉色羅襴服，頭戴逍遙一字巾。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 225
    "line_end": 225
  "translation_ja": |-
    風采は雄々しく秀で、深い谷から高い空へそびえる気概。
    歩みは穏やかで端正、規矩（きく。物事の手本となる規則や作法）に従い、作法を守る。
    言葉は孔子（こうし・推定。儒教のもとを築いた中国の思想家）・孟子（もうし。孔子の教えを受け継いだ中国の思想家）に従い、礼儀は周（しゅう・推定。礼楽の制度で知られる古代中国の王朝）の文物にかなう。
    身には玉色の薄絹の襴服（らんぷく・推定。裾に横布を付けた、中国の学者などが着る長衣）、頭には逍遥一字巾（しょうよういちじきん・推定。学者風の人物がかぶる頭巾の名）。
  "translation_status": "reviewed"
- "id": "xy-ch10-020"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "上路來，拽開雲步，徑到長安城西門大街上。只見一簇人，擠擠雜雜，鬧鬧哄哄。內有高談闊論的道：「屬龍的本命，屬虎的相沖。寅辰巳亥，雖稱合局，但怕的是日犯歲君。」龍王聞言，情知是賣卜之處。走上前，分開眾人，望裡觀看。只見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 226
    "line_end": 226
  "translation_ja": |-
    道へ出ると、雲のようにゆったりと歩を進め、長安の西門大街（せいもんたいがい・推定。長安の西門に通じる大通り）へまっすぐ向かった。人だかりがあり、ごった返して騒いでいる。その中で、高らかに論じる声がした。
    話者不明「辰年（たつどし。十二支の辰に当たる年）生まれの本命（ほんみょう。生まれ年に配当され、運命を支配するとされる星や干支）には、寅（とら・推定。年や時刻、占いに用いる十二支の一つ）が冲（ちゅう・推定。占術で、干支どうしが対立して不調和になる組合せ）となる。寅・辰（たつ・推定。年や時刻、占いに用いる十二支の一つ）・巳（み・推定。年や時刻、占いに用いる十二支の一つ）・亥（い・推定。年や時刻、占いに用いる十二支の一つ）は組合せが整うといっても、日が太歳（たいさい・推定。年ごとの運勢をつかさどるとされる星や神）に触れるのが恐ろしい。」
    涇河の竜王は聞いて、占いを売る場所だと悟った。前へ出て人をかき分け、中をのぞくと、こんなありさまだった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "原文は群衆中の占術の声の話者を明記しない。袁守誠と断定せず話者不明とする。占術の組合せを別資料で訂正しない。"
- "id": "xy-ch10-021"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "四壁珠璣，滿堂綺繡。寶鴨香無斷，磁瓶水恁清。兩邊羅列王維畫，座上高懸鬼谷形。端溪硯，金煙墨，相襯著霜毫大筆；火珠林，郭璞數，謹對了臺政新經。六爻熟諳，八卦精通。能知天地理，善曉鬼神情。一槃子午安排定，滿腹星辰佈列清。真個那未來事，過去事，觀如月鏡；幾家興，幾家敗，鑑若神明。知凶定吉，斷死言生。開談風雨迅，下筆鬼神驚。招牌有字書名姓，神課先生袁守誠。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 228
    "line_end": 228
  "translation_ja": |-
    四方の壁には珠玉が並び、広間には綾や刺繡が満ちる。
    鴨形の香炉に香は絶えず、磁器の瓶の水は何と清らか。
    両脇には王維（おうい。詩と山水画で知られる唐代の文人）の絵が並び、座の上には鬼谷子（きこくし。戦国時代の兵法・遊説の祖とされる伝説的な人物）の像が高く掛かる。
    端渓（たんけい。良質の硯石を産する中国広東の地）の硯、金煙墨（きんえんぼく・推定。良質のすすから作られた上等な墨）には、白い毛の大筆がよく似合い、
    『火珠林（かじゅりん・推定。易占いを説明する中国の占術書）』と郭璞（かくはく。晋代の学者・詩人で、占術にも通じたとされる人物）の術数（じゅっすう・推定。暦や陰陽などを用いて吉凶を占う方法）は、『台政新経（たいせいしんけい・推定。占術書として本文に挙がる書名。書誌の同定は未確定）』と慎重に照らし合わせてある。
    六爻（りくこう。易の一つの卦を構成する六本の線）に習熟し、八卦（はっけ・推定。易で陰陽の三本の線を組み合わせた八つの基本形）に精通し、
    天地の理を知り、鬼神（きしん・推定。人知を超える霊や神々）の情に明るい。
    盤には子午（しご・推定。十二支の子と午。占盤では北と南の位置を示す）が定まり、胸の内には星辰（せいしん・推定。星々や星座）が明瞭に並ぶ。
    未来のことも過去のことも、明月の鏡に見るよう、
    幾家の栄えも衰えも、神のように見抜く。
    凶を知り、吉を定め、死を判断し、生を語る。
    口を開けば風雨のように速やか、筆を下ろせば鬼神も驚く。
    看板には名と姓が記されていた、神卦（しんか・推定。神わざのようによく当たる占い）の先生、袁守誠（えんしゅせい・推定。長安で占いを行い、竜王の運命を見抜く占者）と。
  "translation_status": "reviewed"

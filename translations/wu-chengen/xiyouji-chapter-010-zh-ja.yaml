      "end": 97
      "exact": |-
        閑觀縹緲白雲飛，獨坐茅庵掩竹扉。
        無事訓兒開卷讀，有時對客把棋圍。
        喜來策杖歌芳徑，興到攜琴上翠微。
        草履麻絛粗布被，心寬強似著羅衣。」
    "translation_span":
      "start": 43
      "end": 192
      "exact": |-
        暇には、はるかに白雲が飛ぶのを眺め、
        一人、茅の庵に座り、竹の扉を閉める。
        用がなければ子に書を開いて読むよう教え、
        ときには客を相手に碁盤を囲む。
        うれしければ杖をついて香る小道を歌い、
        興が湧けば琴を携え、緑の山腹へ登る。
        草履、麻の帯、粗布の着物でも、
        心の広さは、薄絹をまとう身にまさる。」

- "id": "spoken-poem-006"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch10-006"
    "source_span":
      "start": 28
      "end": 110
      "exact": |-
        一葉小舟隨所寓，萬疊煙波無恐懼。垂鉤撒網捉鮮鱗，沒醬膩，偏有味，老妻稚子團圓會。
        魚多又貨長安市，換得香醪吃個醉。簑衣當被臥秋江，鼾鼾睡，無憂慮，不戀人間榮與貴。」
    "translation_span":
      "start": 67
      "end": 297
      "exact": |-
        一葉の小舟は、行く先がそのまま住まい、
        幾重もの煙る波にも、恐れはない。
        釣り針を垂れ、網を撒き、生きのよい魚を捕る。
        こってりした醬（ひしお・推定。穀物や肉・魚などを発酵させて作る濃い調味料）はなくても、格別の味、
        老いた妻と幼い子が、そろって集まる。
        魚が多ければ長安の市で売り、
        香りよい濁り酒に換え、酔いしれる。
        蓑（みの・推定。草やわらを編んで作る雨具）を布団に、秋の川に寝そべり、
        いびきをかいて、憂いなく眠り、
        この世の栄華も富貴も恋しくない。」
  "separator": |2+


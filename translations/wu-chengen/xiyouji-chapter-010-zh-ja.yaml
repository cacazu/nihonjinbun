- "id": "xy-ch10-022"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此人是誰？原來是當朝欽天監臺正先生袁天罡的叔父，袁守誠是也。那先生果然相貌稀奇，儀容秀麗；名揚大國，術冠長安。龍王入門來，與先生相見。禮畢，請龍上坐，童子獻茶。先生問曰：「公來問何事？」龍王曰：「請卜天上陰晴事如何。」先生即袖傳一課，斷曰：「雲迷山頂，霧罩林梢。若占雨澤，準在明朝。」龍王曰：「明日甚時下雨？雨有多少尺寸？」先生道：「明日辰時布雲，巳時發雷，午時下雨，未時雨足，共得水三尺三寸零四十八點。」龍王笑曰：「此言不可作戲。如是明日有雨，依你斷的時辰、數目，我送課金五十兩奉謝；若無雨，或不按時辰、數目，我與你實說：定要打壞你的門面，扯碎你的招牌，即時趕出長安，不許在此惑眾。」先生忻然而答：「這個一定任你。請了，請了。明朝雨後來會。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 229
    "line_end": 229
  "translation_ja": |-
    この人は誰か。実は、当代の欽天監（きんてんかん。天文観測や暦の作成をつかさどる役所）の台正（たいせい・推定。ここでは欽天監の長官を表す官名）、袁天罡（えんてんこう・推定。唐代の占術家。物語では袁守誠の甥）の叔父、袁守誠である。その顔つきはまことに並外れ、姿は端麗で、名は大国に響き、術は長安一を誇っていた。涇河の竜王は門を入り、袁守誠と対面した。礼が済むと、上座に勧められ、童子（どうじ・推定。少年。ここでは占者のもとで茶を運ぶ者）が茶を差し出した。
    袁守誠「何をお尋ねになりたいのですか。」
    涇河の竜王「空の曇り晴れを占っていただきたい。」
    袁守誠は袖の中で一卦を出し、判断を告げた。
    袁守誠「雲は山頂を隠し、霧は林の梢を覆う。恵みの雨を占うなら、必ず明朝に降りましょう。」
    涇河の竜王「明日の何刻に降り、雨量は何尺何寸になるのですか。」
    袁守誠「明日は辰の刻（たつのこく・推定。十二支で表す時刻の一つ。おおむね午前八時前後）に雲が広がり、巳の刻（みのこく・推定。十二支で表す時刻の一つ。おおむね午前十時前後）に雷が鳴り、午の刻（うまのこく・推定。十二支で表す時刻の一つ。おおむね正午前後）に雨が降り、未の刻（ひつじのこく・推定。十二支で表す時刻の一つ。おおむね午後二時前後）に雨が十分に行き渡ります。合わせて三尺三寸四十八点（さんしゃくさんずんしじゅうはってん・推定。物語で指定された雨量。点を含む古い単位で表す）の水となるでしょう。」
    涇河の竜王は笑った。
    涇河の竜王「冗談では済まされませんぞ。明日、本当に雨が降り、お前の言う時刻と量のとおりなら、礼として占い料五十両（ごじゅうりょう・推定。銀などを重さで数えた金額の表示）を贈ろう。雨が降らぬか、時刻や量が違えば、はっきり言っておく、お前の店構えを壊し、看板を引き裂き、ただちに長安から追い出して、ここで人を惑わせることを許さぬ。」
    袁守誠は喜んで答えた。
    袁守誠「それは、必ずお任せしましょう。では、お引き取りください。明日、雨の後にお会いしましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch10-023"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "龍王辭別，出長安，回水府。大小水神接著，問曰：「大王訪那賣卦的如何？」龍王道：「有，有，有。但是一個掉嘴口討春的先生。我問他幾時下雨，他就說明日下雨。問他甚麼時辰，甚麼雨數，他就說辰時布雲，巳時發雷，午時下雨，未時雨足，得水三尺三寸零四十八點。我與他打了個賭賽：若果如他言，送他謝金五十兩；如略差些，就打破他門面，趕他起身，不許在長安惑眾。」眾水族笑曰：「大王是八河都總管，司雨大龍神，有雨無雨，惟大王知之。他怎敢這等胡言？那賣卦的定是輸了，定是輸了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 230
    "line_end": 230
  "translation_ja": |-
    涇河の竜王は別れを告げ、長安を出て水府へ帰った。大小の水神が迎えて尋ねた。
    水神たち「大王、占い師をお調べになって、いかがでしたか。」
    涇河の竜王「いた、いた。ただ口先でうまいことを言い、稼ぐ先生にすぎぬ。いつ雨が降るかと聞けば、明日降ると言う。時刻と量を聞けば、辰の刻に雲、巳の刻に雷、午の刻に雨、未の刻に十分に降って、三尺三寸四十八点の水になると言うのだ。それで賭けをした。本当に言ったとおりなら、礼金五十両をやる。少しでも違えば、店構えを壊して追い払い、長安で人を惑わせることを許さぬとな。」
    水族たちは笑った。
    水族たち「大王は八つの川の総管（そうかん・推定。ある区域や部門をまとめて統括する官職）、雨を司る大竜神です。雨が降るか降らぬか、ご存じなのは大王だけ。よくもそんなでたらめを言えたものです。占い師は負けに決まっています、負けに決まっています。」
  "translation_status": "reviewed"
- "id": "xy-ch10-024"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時龍子、龍孫與那魚卿、蟹士正歡笑談此事未畢，只聽得半空中叫：「涇河龍王接旨。」眾擡頭上看，是一個金衣力士，手擎玉帝敕旨，徑投水府而來。慌得龍王整衣端肅，焚香接了旨。金衣力士回空而去。龍王謝恩，拆封看時，上寫著："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 232
    "line_end": 232
  "translation_ja": |-
    竜の子や孫、魚の卿、カニの士が、このことを笑って語り合っていると、空中から叫ぶ声がした。
    金衣力士（きんいりきし・推定。金の衣をまとい、玉帝の命令を運ぶ神の使者）「涇河の竜王、勅命（ちょくめい。帝王が下す命令）を受けよ。」
    一同が見上げると、金の衣の力士（りきし・推定。ここでは金の衣を着て玉帝の勅旨を運ぶ使者）が玉帝（ぎょくてい・推定。天上の神々を治める帝王）の勅旨（ちょくし・推定。帝王の意向や、それを伝える命令）を手に、水府へまっすぐ降りてきた。涇河の竜王は慌てて衣を整え、姿勢を正し、香を焚いて勅旨を受け取った。金衣力士は空へ帰った。涇河の竜王は恩命（おんめい・推定。帝王から賜ったありがたい命令）を謝し、封を開いて見ると、こう記されていた。
  "translation_status": "reviewed"
- "id": "xy-ch10-025"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    敕命八河總，驅雷掣電行：
    明朝施雨澤，普濟長安城。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 234
    "line_end": 235
  "translation_ja": |-
    八河（はっか・推定。長安の周辺を流れる八つの川）の総管に勅命す、雷を駆り、稲妻を走らせよ。
    明朝、恵みの雨を施し、広く長安の都を潤せ。
  "translation_status": "reviewed"
- "id": "xy-ch10-026"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "旨意上時辰、數目，與那先生判斷者毫髮不差。諕得那龍王魂飛魄散。少頃甦醒，對眾水族曰：「塵世上有此靈人，真個是能通天地理，卻不輸與他啊！」鰣軍師奏云：「大王放心。要贏他有何難處？臣有小計，管教滅那廝的口嘴。」龍王問計，軍師道：「行雨差了時辰，少些點數，就是那廝斷卦不準，怕不贏他？那時捽碎招牌，趕他跑路，果何難也？」龍王依他所奏，果不擔憂。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 236
    "line_end": 236
  "translation_ja": |-
    勅旨にある時刻と量は、袁守誠の判断と寸分違わなかった。涇河の竜王は魂も散るほど驚き、しばらくして我に返ると、水族たちに言った。
    涇河の竜王「人の世に、こんな霊妙な者がいたのか。まさに天地の理に通じている。これでは、あの男に負けるではないか。」
    鰣軍師「大王、ご安心ください。あの者に勝つなど、何の難しいことがありましょう。臣に小さな策がございます。必ずあの口を黙らせてみせます。」
    涇河の竜王が策を尋ねると、鰣軍師は答えた。
    鰣軍師「雨を降らせる時刻をずらし、量をいくらか減らすのです。そうすれば、あの者の占いが外れたことになります。どうして勝てぬことがありましょう。そのとき看板を叩き壊し、追い出すのなど、まったく造作もありません。」
    涇河の竜王はその進言に従い、もう心配しなくなった。
  "translation_status": "reviewed"
- "id": "xy-ch10-027"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "至次日，點札風伯、雷公、雲童、電母，直至長安城九霄空上。他挨到那巳時方布雲，午時發雷，未時落雨，申時雨止，卻只得三尺零四十點。改了他一個時辰，剋了他三寸八點。雨後發放眾將班師。他又按落雲頭，還變作白衣秀士，到那西門裡大街上，撞入袁守誠卦舖，不容分說，就把他招牌、筆、硯等一齊捽碎。那先生坐在椅上，公然不動。這龍王又掄起門板便打，罵道：「這妄言禍福的妖人，擅惑眾心的潑漢！你卦又不靈，言又狂謬。說今日下雨的時辰、點數俱不相對。你還危然高坐，趁早去，饒你死罪！」守誠猶公然不懼分毫，仰面朝天冷笑道：「我不怕，我不怕。我無死罪，只怕你倒有個死罪哩。別人好瞞，只是難瞞我也。我認得你，你不是秀士，乃是涇河龍王。你違了玉帝敕旨，改了時辰，剋了點數，犯了天條。你在那剮龍臺上，恐難免一刀，你還在此罵我？」龍王見說，心驚膽戰，毛骨悚然。急丟了門板，整衣伏禮，向先生跪下道：「先生休怪。前言戲之耳，豈知弄假成真，果然違犯天條，奈何？望先生救我一救；不然，我死也不放你。」守誠曰：「我救你不得，只是指條生路與你投生便了。」龍曰：「願求指教。」先生曰：「你明日午時三刻，該赴人曹官魏徵處聽斬。你果要性命，須當急急去告當今唐太宗皇帝方好。那魏徵是唐王駕下的丞相，若是討他個人情，方保無事。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 237
    "line_end": 237
  "translation_ja": |-
    翌日、風伯（ふうはく・推定。風をつかさどる神）・雷公（らいこう・推定。雷をつかさどる神）・雲童（うんどう・推定。雲をつかさどる童子の神）・電母（でんぼ・推定。稲妻をつかさどる女神）を点呼して遣わし、長安の九重の空へ直行した。涇河の竜王は巳の刻まで待って初めて雲を広げ、午の刻に雷を鳴らし、未の刻に雨を降らせ、申の刻（さるのこく・推定。十二支で表す時刻の一つ。おおむね午後四時前後）にやませた。水はわずか三尺四十点だった。一刻（いっこく。ここでは十二支で分ける時刻の一区分。三刻の刻とは数え方が異なる）をずらし、三寸八点を減らしたのである。雨の後、配下の将たちを帰らせた。自分も雲を降り、再び白衣の学者に化け、西門内の大街へ向かうと、袁守誠の占いの店に押し入り、弁解もさせず、看板、筆、硯などを残らず叩き壊した。袁守誠は椅子に座ったまま、平然として動かなかった。涇河の竜王はさらに戸板を振り上げて打ちかかり、罵った。
    涇河の竜王「禍福をでたらめに語る妖人、人心を勝手に惑わすろくでなしめ！　占いは当たらず、言うことは狂ったたわ言だ。今日の雨の時刻も量も、どちらも違ったではないか。それでも、まだ堂々と座っているのか。早く出ていけ、そうすれば命だけは助けてやる！」
    袁守誠は相変わらず少しも恐れず、天を仰いで冷笑した。
    袁守誠「怖くはない、怖くはない。私に死罪はないが、むしろお前に死罪があるだろうよ。ほかの者はだませても、私をだますのは難しい。お前の正体は分かっている。学者ではなく、涇河の竜王だ。玉帝の勅旨に背き、時刻を変え、量を減らし、天の掟を犯した。剮竜台（かりゅうだい・推定。罪を犯した竜を処刑する場所）で刃の一撃を免れまいに、まだここで私を罵るのか。」
    涇河の竜王は聞くと、肝をつぶし、身の毛がよだった。急いで戸板を捨て、衣を整えて伏し拝み、袁守誠の前にひざまずいた。
    涇河の竜王「先生、どうかお許しください。先ほどの言葉は、ほんの冗談でした。戯れが本当になり、まことに天の掟を犯してしまうとは。どうすればよいのでしょう。先生、どうかお救いください。そうでなければ、死んでもあなたを放しません。」
    袁守誠「私には救えない。ただ、生きる道を一つ教え、そちらへ向かわせることはできる。」
    涇河の竜王「どうかお教えください。」
    袁守誠「お前は明日、午の刻三刻（さんこく・推定。時刻を細分した区分。ここでは午の時刻の三刻目）に、人曹官（じんそうかん・推定。人間界にいながら天界の裁断を執行する役目）の魏徴（ぎちょう。唐の太宗に仕える臣で、夢の中で竜王を斬る）のもとで斬首を受ける定めだ。本当に命が欲しいなら、急いで今の唐（とう・推定。長安を都とする中国の王朝）の太宗皇帝（たいそうこうてい・推定。唐の第二代皇帝、李世民）に願い出るのがよい。魏徴は唐の皇帝に仕える丞相（じょうしょう。君主を補佐して国政を担う高官）だ。皇帝に情けをかけてもらえれば、無事を保てるだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch10-028"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "龍王聞言，拜辭含淚而去。不覺紅日西沉，太陰星上。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 238
    "line_end": 238
  "translation_ja": "涇河の竜王は聞くと、礼をして別れ、涙を浮かべて立ち去った。いつしか紅い日は西へ沈み、月が昇った。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch10-029"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "煙凝山紫歸鴉倦，遠路行人投旅店。渡頭新雁宿汀沙，銀河現，催更籌，孤村燈火光無焰。風裊爐煙清道院，蝴蝶夢中人不見。月移花影上欄杆，星光亂，漏聲換，不覺深沉夜已半。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 240
    "line_end": 240
  "translation_ja": |-
    靄は固まり、山は紫、帰る烏も疲れ、
    遠路の旅人は宿屋へ入る。
    渡し場の新来の雁は砂洲に宿り、
    天の川（あまのがわ。夜空を帯状に渡る星の集まり）が現れ、夜番の時を促す。
    ひとり離れた村の灯は、炎も見えぬほどほのか。
    風は清らかな道観（どうかん・推定。道教の寺院）の香炉の煙を揺らし、
    人影はなく、皆、蝶の夢の中。
    月が花の影を欄干へ移し、
    星の光は入り乱れ、水時計の音も変わる。
    気づけば夜は深まり、半ばを過ぎていた。
  "translation_status": "reviewed"
- "id": "xy-ch10-030"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這涇河龍王也不回水府，只在空中。等到子時前後，收了雲頭，斂了霧角，徑來皇宮門首。此時唐王正夢出宮門之外，步月花陰。忽然龍王變作人相，上前跪拜，口叫：「陛下，救我，救我。」太宗云：「你是何人？朕當救你。」龍王云：「陛下是真龍，臣是業龍。臣因犯了天條，該陛下賢臣人曹官魏徵處斬，故來拜求，望陛下救我一救。」太宗曰：「既是魏徵處斬，朕可以救你，你放心前去。」龍王歡喜，叩謝而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 242
    "line_end": 242
  "translation_ja": |-
    涇河の竜王は水府へは帰らず、空中にとどまった。子の刻（ねのこく・推定。十二支で表す時刻の一つ。おおむね真夜中）の前後を待ち、雲を収め、霧を引き締め、まっすぐ皇宮の門前へ来た。そのとき太宗（たいそう。唐の第二代皇帝、李世民）は、宮門を出て花陰で月を眺めて歩く夢を見ていた。突然、涇河の竜王が人の姿に化け、進み出てひざまずき、叫んだ。
    涇河の竜王「陛下、お助けください、お助けください。」
    太宗「そなたは何者か。朕が救ってやろう。」
    涇河の竜王「陛下は真の竜、臣は罪業（ざいごう・推定。悪い行いと、その結果として負う罪）を負う竜です。臣は天の掟を犯し、陛下の賢臣、人曹官の魏徴に斬られる定めです。それゆえ、お願いに参りました。どうかお救いください。」
    太宗「魏徴が斬るのであれば、朕が救える。安心して戻るがよい。」
    涇河の竜王は喜び、額を地につけて礼を言い、去っていった。
  "translation_status": "reviewed"
- "id": "xy-ch10-031"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那太宗夢醒後，念念在心。早已至五鼓三點，太宗設朝，聚集兩班文武官員。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 244
    "line_end": 244
  "translation_ja": "さて、太宗は夢から覚めると、そのことが頭を離れなかった。早くも五鼓（ごこ・推定。一夜を五つに分けた最後の時刻。明け方ごろ）の三点（さんてん・推定。一つの更をさらに分けた三番目の区切り）となり、太宗は朝議（ちょうぎ・推定。君主のもとで臣下たちが行う会議）を開き、文武二班の官人たちを集めた。そのありさまは、"
  "translation_status": "reviewed"
- "id": "xy-ch10-032"
  "section_id": "chapter-10"
  "kind": "verse"
  "origin": "source"
  "source_text": "煙籠鳳闕，香藹龍樓。光搖丹扆動，雲拂翠華流。君臣相契同堯舜，禮樂威嚴近漢周。侍臣燈，宮女扇，雙雙映彩；孔雀屏，麒麟殿，處處光浮。山呼萬歲，華祝千秋。靜鞭三下響，衣冠拜冕旒。宮花燦爛天香襲，堤柳輕柔御樂謳。珍珠簾，翡翠簾，金鉤高控；龍鳳扇，山河扇，寶輦停留。文官英秀，武將抖擻。御道分高下，丹墀列品流。金章紫綬乘三象，地久天長萬萬秋。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 245
    "line_end": 245
  "translation_ja": |-
    靄は鳳闕（ほうけつ。鳳凰の飾りを持つ宮門。転じて皇居をいう）を包み、香りは竜楼（りゅうろう・推定。竜の飾りのある楼閣。天子の宮殿のたとえ）に満ちる。
    光は朱の御屏風に揺れ、雲は翠の旗を払って流れる。
    君臣の心の通いは堯舜（ぎょうしゅん・推定。理想の政治を行ったとされる古代中国の二人の聖王）のよう、礼楽（れいがく。社会の秩序を整える礼儀と、人の心を和らげる音楽）の威厳は漢（かん・推定。古代中国の王朝名）や周に近い。
    侍臣の灯、宮女の扇は、対になって彩りを映し、
    孔雀の屏風、麒麟（きりん。平和な世に現れるとされる中国の伝説の獣）の殿には、至る所に光が浮かぶ。
    山を震わす万歳の声、華封（かほう・推定。堯に長寿・富・子孫繁栄を祝った華の地の番人を指す故事）の人のように千秋を祝う言葉。
    静粛を促す鞭が三度鳴り、衣冠（いかん・推定。衣服と冠。ここでは官人の装束）の官人が冕旒（べんりゅう。天子の冠から垂らす玉飾り。ここでは天子自身を指す）を拝む。
    宮中の花はきらめいて天の香を放ち、堤の柳は柔らかく、御楽（ぎょがく・推定。宮廷で奏でる音楽）が歌われる。
    真珠の簾、翡翠（ひすい。ここでは緑色の宝玉）の簾は、金の鉤に高く掛かり、
    竜鳳の扇、山河の扇のもとに、宝の輦（れん。人が引く、天子などの乗り物）が止まる。
    文官は秀でて麗しく、武将は奮い立ち、
    御道（ぎょどう・推定。君主の宮殿に通じる道や宮中の通路）に上下が分かれ、朱の階前に位順で並ぶ。
    金印と紫綬は三象（さんしょう・推定。日・月・星などの天象をいう語。ここでの指示対象は未確定）の運に乗り、天地とともに幾万秋も続く。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三象の指示対象は未確定。原語を保持する。"
- "id": "xy-ch10-033"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾官朝賀已畢，各各分班。唐王閃鳳目龍睛，一一從頭觀看，只見那文官內是房玄齡、杜如晦、徐世勣、許敬宗、王珪等，武官內是馬三寶、段志玄、殷開山、程咬金、劉洪紀、胡敬德、秦叔寶等，一個個威儀端肅，卻不見魏徵丞相。唐王召徐世勣上殿道：「朕夜間得一怪夢：夢見一人，迎面拜謁，口稱是涇河龍王，犯了天條，該人曹官魏徵處斬，拜告寡人救他，朕已許諾。今日班前獨不見魏徵，何也？」世勣對曰：「此夢告準。須喚魏徵來朝，陛下不要放他出門，過此一日，可救夢中之龍。」唐王大喜，即傳旨，著當駕官宣魏徵入朝。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 247
    "line_end": 247
  "translation_ja": |-
    官人たちは朝賀（ちょうが。朝廷に出て君主を祝い、拝礼すること）を終え、それぞれの列に分かれた。太宗は鳳の目、竜の眼を光らせ、一人ずつ見渡した。文官には房玄齢（ぼうげんれい。唐の太宗を補佐した政治家）、杜如晦（とじょかい。房玄齢とともに太宗を補佐した唐の政治家）、徐世勣（じょせいせき。唐の太宗に仕える臣で、竜王救済の策を進言する）、許敬宗（きょけいそう。唐の太宗らに仕えた政治家・文人）、王珪（おうけい・推定。唐の太宗に仕えた官人）ら、武官には馬三宝（ばさんぽう・推定。唐の朝廷に列する武将）、段志玄（だんしげん・推定。唐の太宗に仕えた武将）、殷開山（いんかいざん・推定。唐の臣で、玄奘の外祖父に当たる人物）、程咬金（ていこうきん。唐の朝廷に列する勇将）、劉洪紀（りゅうこうき・推定。本文にこの名で列挙される唐の武将。劉弘基へ無断訂正しない）、尉遅恭（うっちきょう。唐の武将で、秦叔宝と宮門を守る。字は敬徳）、秦叔宝（しんしゅくほう。唐の武将で、尉遅恭と宮門を守る）らが、いずれも威儀正しく控えていたが、丞相の魏徴だけが見えなかった。太宗は徐世勣を殿へ呼んで言った。
    太宗「朕は昨夜、不思議な夢を見た。一人の者が前に来て拝礼し、涇河の竜王だと名乗った。天の掟を犯し、人曹官の魏徴に斬られるので救ってほしいと願い、朕は承知したのだ。今日、列の中に魏徴だけが見えぬのは、なぜだ。」
    徐世勣「その夢は、確かな知らせでございます。魏徴を朝廷へ呼び、陛下が外へ出さぬようにしてください。この一日が過ぎれば、夢の中の竜を救えましょう。」
    太宗は大いに喜び、ただちに勅命を伝え、側仕えの官に魏徴を召し出させた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の胡敬德は文脈上の尉遅恭と同一として地の文を統一。劉洪紀の表記は劉弘基等へ無断訂正しない。"
- "id": "xy-ch10-034"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說魏徵丞相在府，夜觀乾象，正爇寶香，只聞得九霄鶴唳，卻是天差仙使，捧玉帝金旨一道，著他午時三刻，夢斬涇河老龍。這丞相謝了天恩，齋戒沐浴，在府中試慧劍，運元神，故此不曾入朝。一見當駕官齎賫來宣，惶懼無任；又不敢違遲君命，只得急急整衣束帶，同旨入朝，在御前叩頭請罪。唐王道：「赦卿無罪。」那時諸臣尚未退朝，至此，卻命捲簾散朝。獨留魏徵，宣上金鑾，召入便殿，先議論安邦之策，定國之謀。將近巳末午初時候，卻命宮人：「取過大棋來，朕與賢卿對弈一局。」眾嬪妃隨取棋枰，鋪設御案。魏徵謝了恩，即與唐王對弈，一遞一著，擺開陣勢。正合《爛柯經》云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 248
    "line_end": 248
  "translation_ja": |-
    一方、丞相の魏徴は自邸で夜の天象を見て、香を焚いていた。九重の空で鶴が鳴く声がしたと思うと、天から遣わされた仙使（せんし・推定。天界から命令を伝える使者）が玉帝の金の勅旨を携え、午の刻三刻に夢の中で涇河の老竜を斬れ、と命じたのである。魏徴は天の恩を謝し、斎戒沐浴（さいかいもくよく。飲食や行動を慎み、体を洗い清めること）をして、自邸で智慧（ちえ・推定。物事の道理を正しく見抜く力）の剣を試し、元神（げんしん・推定。道教でいう根源的な精神。ここでは体を離れて働く霊魂）を働かせていたため、参朝（さんちょう・推定。朝廷へ出仕すること）していなかった。側仕えの官が勅命を持って呼びに来ると、恐れおののいたが、君命に背いて遅れるわけにもいかず、急いで衣を整え帯を締め、使者とともに参朝し、御前に額づいて罪を詫びた。
    太宗「卿の罪は赦す。」
    そのとき、まだ臣たちは退朝していなかったが、ここで簾を巻き上げ、朝議を終えるよう命じた。ただ魏徴だけを残し、金鑾殿（きんらんでん・推定。天子が政務や儀式を行う宮殿の名）に上がらせ、さらに便殿（べんでん・推定。天子が日常の執務や休息に用いる御殿）へ招き、まず国を安んじ、天下を定める策を論じ合った。巳の終わり、午の初めが近づくと、太宗は宮人に命じた。
    太宗「大きな碁盤を持ってまいれ。朕は卿と一局打とう。」
    妃たちはすぐ碁盤を取り、御机に据えた。魏徴は恩を謝し、太宗と対局して、交互に一手ずつ打ち、陣を敷いた。まさに『爛柯経（らんかきょう・推定。囲碁の打ち方を説く書として引用される書名）』のいうところである。
  "translation_status": "reviewed"
- "id": "xy-ch10-035"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "博弈之道，貴乎嚴謹。高者在腹，下者在邊，中者在角，此棋家之常法。法曰：「寧輸一子，不失一先。」擊左則視右，攻後則瞻前。有先而後，有後而先。兩生勿斷，皆活勿連。闊不可太疏，密不可太促。與其戀子以求生，不若棄之而取勝；與其無事而獨行，不若固之而自補。彼眾我寡，先謀其生；我眾彼寡，務張其勢。善勝者不爭，善陣者不戰；善戰者不敗，善敗者不亂。夫棋始以正合，終以奇勝。凡敵無事而自補者，有侵絕之意；棄小而不救者，有圖大之心；隨手而下者，無謀之人；不思而應者，取敗之道。《詩》云：「惴惴小心，如臨于谷。」此之謂也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 249
    "line_end": 249
  "translation_ja": "碁を打つ道は、厳密で慎重であることを尊ぶ。上策は中央、下策は辺、中策は隅にある。これが碁家の常法である。法にいう、「一子を失っても、先手を一つ失うな」と。左を撃てば右を見、後ろを攻めれば前を見よ。先が後になり、後が先になることもある。二つがともに生きていれば切らず、すべて生きていればつながぬ。広くてもまばらすぎてはならず、密でも詰まりすぎてはならぬ。石を惜しんで生きようとするより、捨てて勝ちを取る方がよい。何事もないのに単独で進むより、固めて自分を補う方がよい。敵が多く、こちらが少なければ、まず生きることを図る。こちらが多く、敵が少なければ、勢力を広げるよう努める。よく勝つ者は争わず、よく陣を敷く者は戦わず、よく戦う者は敗れず、よく敗れる者は乱れない。碁は初め正攻で向かい合い、最後には奇策で勝つ。敵が何事もないのに自分を補うなら、侵入して断ち切る意図がある。小さいものを捨てて救わぬなら、大きなものを図る心がある。手なりに打つ者は策のない人、考えず応じるのは敗北を招く道である。『詩経（しきょう・推定。古代中国の詩歌を集めた儒教の経典）』にいう、「恐れ慎み心を細やかに、深い谷に臨むように」とは、このことだ。"
  "translation_status": "reviewed"
- "id": "xy-ch10-036"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"

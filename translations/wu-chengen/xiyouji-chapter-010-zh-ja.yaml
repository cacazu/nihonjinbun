- "id": "xy-ch10-015"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    張稍道：「李兄，我才僭先起句，今到我兄，也先起一聯，小弟亦當續之。」
    「風月佯狂山野漢，江湖寄傲老餘丁。
    清閑有分隨瀟灑，口舌無聞喜太平。
    月夜身眠茅屋穩，天昏體蓋箬簑輕。
    忘情結識松梅友，樂意相交鷗鷺盟。
    名利心頭無算計，干戈耳畔不聞聲。
    隨時一酌香醪酒，度日三餐野菜羹。
    兩束柴薪為活計，一竿鉤線是營生。
    閑呼稚子磨鋼斧，靜喚憨兒補舊繒。
    春到愛觀楊柳綠，時融喜看荻蘆青。
    夏天避暑修新竹，六月乘涼摘嫩菱。
    霜降雞肥常日宰，重陽蟹壯及時烹。
    冬來日上還沉睡，數九天高自不寒。
    八節山中隨放性，四時湖裡任陶情。
    採薪自有仙家興，垂釣全無世俗形。
    門外野花香豔豔，船頭綠水浪平平。
    身安不說三公位，性定強如十里城。
    十里城高防閫令，三公位顯聽宣聲。
    樂山樂水真是罕，謝天謝地謝神明。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 201
    "line_end": 219
  "translation_ja": |-
    張稍「李兄、先ほどは出過ぎながら私から詠み始めた。今度はお前の番だ。先にひと組の句を出してくれ、私もそれを継ごう。」
    今度は李定から詠み始めた。
    張稍と李定「風月の中で狂人を装う山野の男、川や湖に誇りを託す老いた余丁（よてい・推定。正規の役務に割り当てられない男子。この詩での細かな意味は未確定）。
    清閑に恵まれ、気ままに暮らし、口争いも聞かず、太平を喜ぶ。
    月の夜には茅屋で安らかに眠り、空が暗くなれば、軽い笹の蓑を身に掛ける。
    世情を忘れ、松と梅を友とし、喜んでカモメやサギと盟を結ぶ。
    名利の算段は心になく、戦の音も耳に入らぬ。
    折々、香る濁り酒を一杯くみ、日々の三食は野菜の汁。
    二束の薪を生計とし、一本の釣り竿と糸をなりわいとする。
    のんびり幼子を呼んで鋼の斧を研がせ、静かに素朴な子を呼んで古網を繕わせる。
    春になれば柳の緑を喜び眺め、暖かくなれば荻や葦の青さを楽しむ。
    夏には暑さを避けて新竹を整え、六月には涼みながら若いヒシを摘む。
    霜が降りれば鶏は肥え、日ごとにさばき、重陽（ちょうよう。陰暦九月九日の節句）にはカニが太り、時を逃さず煮る。
    冬になれば日が高くてもまだ深く眠り、真冬の空が高くても、身に寒さはない。
    八つの節目も山で心のまま、四季を湖で思いを楽しませる。
    薪取りにはおのずと仙人（せんにん・推定。修行によって不老長寿や不思議な力を得たとされる人）の趣があり、釣りには少しも俗世の姿がない。
    門の外の野花は、香りも色も鮮やか、船首の緑の水は波も穏やか。
    身が安らかなら三公（さんこう・推定。中国で最高位にある三つの官職、またはその官人）の位も口にせず、心が定まれば十里の城にもまさる。
    十里の高城には城門を守る命令があり、三公の高位には召し出しの声を聞かねばならぬ。
    山を楽しみ、水を楽しむのは、まことに得難いこと、天に感謝し、地に感謝し、神明（しんめい・推定。天地の神々）に感謝しよう。」
  "translation_status": "reviewed"
  "issues":

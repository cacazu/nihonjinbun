- "id": "xy-ch10-003"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    李定道：「你的水秀，不如我的山青。也有個《蝶戀花》詞為證。詞曰：
    雲林一段松花滿，默聽鶯啼，巧舌如調管。紅瘦綠肥春正暖，倏然夏至光陰轉。
    又值秋來容易換，黃花香，堪供玩。迅速嚴冬如指撚，逍遙四季無人管。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 126
    "line_end": 129
  "translation_ja": |-
    李定「お前の水の美しさは、私の山の青さにかなわない。私にも、その証しに『蝶恋花』がある。こう詠む。
    雲の林の一画に、松の花が満ち、
    黙って聞けば、鶯の巧みな舌は笛を奏でるよう。
    紅い花は減り、緑の葉は茂り、春は暖かく、
    ふと夏が来て、月日は移る。
    また秋が来れば、移り変わるのもたやすく、
    黄色い花は香り、眺めて楽しむに足る。
    厳しい冬も指をひねる間に巡り来るが、
    四季をのびのび暮らし、誰にも指図されぬ。」
  "translation_status": "reviewed"
- "id": "xy-ch10-004"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漁翁道：「你山青不如我水秀，受用些好物。有一《鷓鴣天》為證：
    仙鄉雲水足生涯，擺櫓橫舟便是家。活剖鮮鱗烹綠鱉，旋蒸紫蟹煮紅蝦。
    青蘆筍，水荇芽，菱角雞頭更可誇。嬌藕老蓮芹葉嫩，慈菇茭白鳥英花。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch10-2194739"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第010回&oldid=2194739"
    "line_start": 131
    "line_end": 133
  "translation_ja": |-
    張稍「お前の山の青さは、私の水の美しさにかなわない。うまいものも楽しめる。その証しに『鷓鴣天（しゃこてん。詞の曲調と字数・韻の型を示す名）』がある。
    仙郷（せんきょう・推定。仙人の住む境地。ここでは美しい水辺のたとえ）の雲と水で、生計は十分、
    櫓（ろ・推定。舟の後方で動かし、水をかいて進める道具）を動かし、舟を横たえれば、そこが我が家。
    生きのよい魚をさばき、緑のスッポンを煮て、
    すぐに紫のカニを蒸し、赤いエビを煮る。
    青い葦の芽、アサザ（水面に葉を浮かべ、黄色い花を咲かせる水草）の芽、
    ヒシの実、オニバス（とげのある大きな浮葉を持ち、実を食用にする水草）の実も自慢の品。
    柔らかな蓮根、熟れた蓮の実、若いセリの葉、
    クワイ（水田などで育て、地下の塊茎を食べる水草）、マコモ（水辺に生えるイネ科の草。肥大した茎を食べる）の茎、鳥英（ちょうえい・推定。原文に挙がる食用の花の名。植物の同定は未確定）の花。」
  "translation_status": "reviewed"

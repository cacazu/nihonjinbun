        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      悟空は身を躍らせ、洞の中へ跳び込んだ。足の下には一万筋もの彩雲が生まれ、身のまわりを千重ものめでたい気が守る。ほどなく奥深いところへ着くと、中は明るく、外と同じように日の光も風の音もあり、花や草や果樹もあった。
      悟空は喜んだ。
      悟空「いい所だなあ。思えば、俺がこの世へ出たとき、天は水簾洞（すいれんどう）を授けてくれたが、ここもまた洞天福地（どうてんふくち）というわけだ。」
      見ていると、さらに二重の軒のある楼門があった。まわりはぐるりと松と竹で囲まれ、中にはたくさんの建物がある。
      悟空は考えた。「きっとここが妖怪の住まいだ。中へ入って様子を探ろう。いや、待て。このまま行ったら俺だと分かってしまう。姿を変えていくか。」
      身を振って印を結ぶと、小さな蠅に変わり、そっと楼門へ飛んでいって耳を澄ました。女の妖怪は、草ぶきのあずまやの上座にいた。松林で助けたときや、寺で捕らえようとしたときとは様子が違い、いっそう美しく着飾っていた。
    "translation_status": "draft"
  - "id": "xy-ch82-009"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      髮盤雲髻似堆鴉，身著綠絨花比甲。
      一對金蓮剛半折，十指如同春筍發。
      團團粉面若銀盆，朱唇一似櫻桃滑。
      端端正正美人姿，月裡嫦娥還喜恰。
      今朝拿住取經僧，便要歡娛同枕榻。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 131
        "line_end": 135
    "translation_ja": |-
      雲のように高く巻いた髷は　烏を重ねたように黒く、
      身には花模様の緑の絨の比甲（ひこう）を着る。
      一対の金蓮（きんれん）は　わずかに半ば折れ曲がり、
      十本の指は　春の筍が伸びたよう。
      丸く白粉を塗った顔は銀の盆に似て、
      赤い唇は　さくらんぼのようにつややか。
      端正に整った美人の姿は、
      月の嫦娥（じょうが）にもまさる　なごやかな愛らしさ。
      今朝、経を取りに行く僧を捕らえたからには、
      同じ枕、同じ寝床で　喜びを交わそうという。
    "translation_status": "draft"
  - "id": "xy-ch82-010"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者且不言語，聽他說甚話。少時，綻破櫻桃，喜孜孜的叫道：「小的們，快排素筵席來，我與唐僧哥哥吃了成親。」行者暗笑道：「真個有這話！我只道八戒作耍子亂說哩。等我且飛進去尋尋，看師父在那裡。不知他的心性如何？假若被他摩弄動了啊，留他在這裡也罷。」即展翅，飛到裡邊看處，那東廊下上明下暗的紅紙格子裡面，坐著唐僧哩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      悟空は黙って、女の妖怪が何を言うか聞いていた。しばらくすると、さくらんぼのような口を開き、嬉しそうに呼ばわった。
      女の妖怪「お前たち、早く精進の宴を用意しておくれ。愛しい唐僧さまと食事をして、結婚するのよ。」
      悟空はひそかに笑った。「本当にそんな話だったか。八戒がふざけて出まかせを言っているだけかと思った。中へ飛んでいって、師匠がどこにいるか捜そう。今はどういう気持ちでいるのかな。もしあの女にいじり回されて心が動いたのなら、ここへ置いていってもいい。」
      翅を広げ、中へ飛んでいって見ると、東の廊下に、上が明るく下が暗い、赤い紙を張った格子の囲いがあり、その中に三蔵（さんぞう）が座っていた。
    "translation_status": "draft"
  - "id": "xy-ch82-011"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者一頭撞破格子眼，飛在唐僧光頭上丁著，叫聲：「師父。」三藏認得聲音，叫道：「徒弟，救我命啊！」行者道：「師父不濟呀，那妖精安排筵宴，與你吃了成親哩。或生下一男半女，也是你和尚之後代，你愁怎的？」長老聞言，咬牙切齒道：「徒弟，我自出了長安，到兩界山中收你，一向西來，那個時辰動葷？那一日子有甚歪意？今被這妖精拿住，要求配偶，我若把真陽喪了，我就身墮輪迴，打在那陰山背後，永世不得翻身。」行者笑道：「莫發誓。既有真心往西天取經，老孫帶你去罷。」三藏道：「進來的路兒，我通忘了。」行者道：「莫說你忘了。他這洞，不比走進來走出去的，是打上頭往下鑽。如今救了你，要打底下往上鑽。若是造化高，鑽著洞口兒，就出去了；若是造化低，鑽不著，還有個悶殺的日子了。」三藏滿眼垂淚道：「似此艱難，怎生是好？」行者道：「沒事，沒事。那妖精整治酒與你吃，沒奈何，也吃他一鍾。只要斟得急些兒，斟起一個喜花兒來，等我變作個蟭蟟蟲兒，飛在酒泡之下。他把我一口吞下肚去，我就捻破他的心肝，扯斷他的腸肚，弄死那妖精，你才得脫身出去。」三藏道：「徒弟，這等說，只是不當人子。」行者道：「只管行起善來，你命休矣。妖精乃害人之根，你惜他怎的？」三藏道：「也罷，也罷。你只是要跟著我。」正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空は頭から格子の紙を突き破って飛び込み、三蔵の剃った頭に止まって呼んだ。
      悟空「お師匠さま。」
      三蔵はその声と分かり、叫んだ。
      三蔵「悟空、私の命を助けておくれ！」
      悟空「お師匠さまも頼りないですね。あの妖怪は宴を用意して、一緒に食べてから結婚するつもりですよ。男の子でも女の子でも一人授かれば、お坊さまにも跡継ぎができるじゃありませんか。何を心配なさるんです。」
      三蔵は歯を食いしばった。
      三蔵「悟空、私は長安（ちょうあん）を出て、両界山（りょうかいざん）でお前を弟子にしてから、ずっと西へ来た。その間、一度でも葷（くん）に手を出したか。一日でもよこしまな心を抱いたか。今、この妖怪に捕まり、夫になれと迫られている。もし真陽（しんよう）を失えば、私は輪廻へ落ち、陰山（いんざん）の裏へ突き落とされて、未来永劫、浮かぶ瀬がなくなるのだ。」
      悟空は笑った。
      悟空「そんな誓いは要りません。西天（さいてん）へ経を取りに行く本心があるなら、私が連れ出しましょう。」
      三蔵「入ってきた道を、すっかり忘れてしまった。」
      悟空「忘れたというだけの話じゃありません。ここの洞は、歩いて入ったり出たりする所じゃなく、上から下へ潜ってくるんです。これからお師匠さまを助けるには、底から上へ潜り抜けるしかない。運がよくて穴の口へたどり着けば、出られます。運が悪くて見つからなければ、窒息して死ぬ日を待つことになりますよ。」
      三蔵は両目から涙をこぼした。
      三蔵「そんなに難しいのなら、どうしたらよいのだ。」
      悟空「大丈夫、大丈夫。妖怪が酒を用意して勧めてきたら、仕方がないから一杯飲んでください。そして勢いよく酒を注ぎ、喜花（きか）という泡を一つ立てるんです。私が蟭蟟虫（しょうりょうちゅう）に変わって、酒の泡の下へ飛び込みます。あいつが一口で私を呑み込んだら、心臓と肝をねじりつぶし、腸と腹を引きちぎって殺す。それでようやく、お師匠さまはここを抜け出せます。」
      三蔵「悟空、そんなやり方は、どうにも人の道に外れる。」
      悟空「善人ぶってばかりいたら、お命はありませんよ。妖怪は人を害する根源です。何だって惜しむことがあるんです。」
      三蔵「分かった、分かった。とにかく私についていておくれ。」
      まさに、こういうことだ。
    "translation_status": "draft"
  - "id": "xy-ch82-012"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": "那孫大聖護定唐三藏，取經僧全靠著美猴王。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      あの孫大聖（そんたいせい）が唐三蔵（とうさんぞう）をしっかり守り、
      経を求める僧は　ひとえに美猴王（びこうおう）を頼みとする。
    "translation_status": "draft"
  - "id": "xy-ch82-013"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他師徒兩個商量未了，早是那妖精安排停當，走近東廊外，開了門鎖，叫聲：「長老。」唐僧不敢答應。又叫一聲，又不敢答應。他不敢答應者何意？想著：「口開神氣散，舌動是非生。」卻又一條心兒想著：「若死住法兒不開口，只怕他心狠，頃刻間就害了性命。」正是那進退兩難心問口，三思忍耐口問心。正自狐疑，那怪又叫一聲：「長老。」唐僧沒奈何，應他一聲道：「娘子，有。」那長老應出這一句言來，真是肉落千斤。人都說唐僧是個真心的和尚，往西天拜佛求經，怎麼與這女妖精答話？不知此時正是危急存亡之際，萬分出於無奈，雖是外有所答，其實內無所慾。妖精見長老應了一聲，他推開門，把唐僧攙起來，和他攜手挨背，交頭接耳。你看他做出那千般嬌態，萬種風情。豈知三藏一腔子煩惱。行者暗中笑道：「我師父被他這般哄誘，只怕一時動心。」正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      師弟二人がまだ相談を終えないうちに、女の妖怪はもう支度を整え、東の廊下へやってきて、錠を外した。
      女の妖怪「長老さま。」
      三蔵は怖くて答えられなかった。もう一度呼ばれても、やはり答えられない。どうして答えるのを恐れるのか。
      三蔵は思った。「口を開けば神気（しんき）が散り、舌を動かせば、いさかいが生まれる。」
      だが、その一方で、こうも考えた。「頑固にやり方を守って口をきかずにいれば、相手が非情になり、たちまち命を奪われるかもしれない。」
      まさに、進むも退くもかなわず心は口に問いかけ、三度考えて耐え忍び、口は心に問い返す。迷いに迷っていると、女の妖怪がまた呼んだ。
      女の妖怪「長老さま。」
      三蔵は仕方なく返事をした。
      三蔵「奥さま、はい。」
      この一言を返しただけで、三蔵は本当に千斤（きん）もの肉が落ちたような思いをした。唐僧は真心から西天へ仏を拝み、経を求めに行く僧だと、誰もが言う。それなのに、どうして女の妖怪と口をきくのか。読者は、このときが生死を分ける危急の場面で、万やむをえないことだったと知るべきである。外では答えていても、内には欲望などなかった。女の妖怪は返事を聞くと、戸を押し開け、三蔵を支えて立たせた。手をつなぎ、背中を寄せ、顔を寄せ合い、耳もとで語りかける。その千通りもの艶めかしいしぐさ、万通りもの色っぽい風情といったらない。だが、三蔵の胸の内は悩みばかりだった。
      悟空はひそかに笑った。「師匠も、こんなに言いくるめられ、誘惑されては、ふと心が動くかもしれんな。」
      まさに、こういうことだ。
    "translation_status": "draft"
  - "id": "xy-ch82-014"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      真僧魔苦遇嬌娃，妖怪娉婷實可誇。
      淡淡翠眉分柳葉，盈盈丹臉襯桃花。
      繡鞋微露雙鉤鳳，雲髻高盤兩鬢鴉。
      含笑與師攜手處，香飄蘭麝滿袈裟。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 143
        "line_end": 146
    "translation_ja": |-
      真の僧は美しい女に出会い　魔の苦しみを受ける。
      妖怪のたおやかな姿は　まことに見事。
      淡く引いた青い眉は　分かれた柳の葉、
      ふっくら赤い頬には　桃の花も引き立て役。
      刺繍の靴には　曲がった二羽の鳳凰がほのかに見え、
      高く巻いた雲の髷　左右の鬢は烏の黒さ。
      笑みを浮かべて師と手をつなぐあたり、
      蘭と麝香の香りが漂い　袈裟いっぱいにしみわたる。
    "translation_status": "draft"
  - "id": "xy-ch82-015"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖精挽著三藏，行近草亭道：「長老，我辦了一杯酒，和你酌酌。」唐僧道：「娘子，貧僧自不用葷。」妖精道：「我知你不吃葷，因洞中水不潔淨，特命山頭上取陰陽交媾的淨水，做些素果素菜筵席，和你耍子。」唐僧跟他進去觀看，果然見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      女の妖怪は三蔵の腕を取り、草ぶきのあずまやへ近づいた。
      女の妖怪「長老さま、お酒を用意したの。一緒に少し飲みましょう。」
      三蔵「奥さま、私はもともと葷を口にいたしません。」
      女の妖怪「精進なさることは知っているわ。洞の水がきれいではないので、わざわざ山の上へ、陰陽の交わった清い水を汲みに行かせたの。精進の果物と野菜で宴を整えて、あなたと楽しもうと思って。」
      三蔵は女の妖怪について中へ入り、様子を見た。なるほど、そこにはこんな光景があった。
    "translation_status": "draft"
  - "id": "xy-ch82-016"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": "盈門下，繡纏綵結；滿庭中，香噴金猊。擺列著黑油壘鈿桌，烏漆篾絲盤。壘鈿桌上，有異樣珍饈；篾絲盤中，盛稀奇素物。林檎、橄欖、蓮肉、葡萄、榧、柰、榛、松、荔枝、龍眼、山栗、風菱、棗兒、柿子、胡桃、銀杏、金橘、香橙，果子隨山有；蔬菜更時新：豆腐、麵觔、木耳、鮮筍、蘑菇、香蕈、山藥、黃精。石花菜、黃花菜，青油煎炒；扁豆角、江豆角，熟醬調成。王瓜、瓠子，白果、蔓菁。鏇皮茄子鵪鶉做，剔種冬瓜方旦名。爛煨芋頭糖拌著，白煮蘿蔔醋澆烹。椒薑辛辣般般美，鹹淡調和色色平。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      門いっぱいに刺繍の布を巻き　色絹の飾りを結び、
      庭いっぱいに　金の獅子の香炉から香りがあふれる。
      黒い漆に螺鈿（らでん）を重ねた卓を並べ、
      漆黒の漆を塗った竹ひごの盆を置く。
      螺鈿の卓の上には　変わったごちそう、
      竹ひごの盆の中には　珍しい精進の品々。
      リンゴ、橄欖（かんらん）、蓮の実、ぶどう、カヤの実、柰（ない）、ハシバミの実、松の実、
      ライチ、竜眼（りゅうがん）、山栗、風菱（ふうりょう）、
      なつめ、柿、くるみ、ぎんなん、キンカン、香り高い橙。
      果物は山々で採れるままに取り揃え、
      野菜はなおさら　旬の新鮮な品ばかり。
      豆腐、麵觔（めんきん）、きくらげ、採りたての筍、
      食用のきのこ、椎茸、山芋、黄精（おうせい）。
      石花菜（せきかさい）と黄花菜（こうかさい）は　澄んだ油で焼いたり炒めたり、
      ふじまめの莢と江豆（こうとう）の莢は　煮た味噌で味をつける。
      王瓜（おうか）、ひょうたん、白果（はっか）、かぶ。
      皮をむいた茄子は　鶉に見立てて作り、
      種を除いた冬瓜は　方旦（ほうたん）という名の一品にする。
      芋はとろとろに煮込んで砂糖をまぶし、
      大根は白ゆでにして酢をかけて仕上げる。
      山椒と生姜の辛味は　どれも見事、
      塩加減もほどよく整い　どの品も調和している。
    "translation_status": "draft"
  - "id": "xy-ch82-017"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精露尖尖之玉指，捧晃晃之金杯，滿斟美酒，遞與唐僧，口裡叫道：「長老哥哥，妙人，請一杯交歡酒兒。」三藏羞答答的接了酒，望空澆奠，心中暗祝道：「護法諸天、五方揭諦、四值功曹：弟子陳玄奘，自離東土，蒙觀世音菩薩差遣列位眾神暗中保護，拜雷音，見佛求經，今在途中，被妖精拿住，強逼成親，將這一杯酒遞與我吃。此酒果是素酒，弟子勉強吃了，還得見佛成功；若是葷酒，破了弟子之戒，永墮輪迴苦。」孫大聖，他卻變得輕巧，在耳根後，若像一個耳報；但他說話，惟三藏聽見，別人不聞。他知師父平日好吃葡萄做的素酒，教吃他一鍾。那師父沒奈何吃了，急將酒滿斟一鍾，回與妖怪。果然斟起有一個喜花兒。行者變作個蟭蟟蟲兒，輕輕的飛入喜花之下。那妖精接在手，且不吃，把杯兒放住，與唐僧拜了兩拜，口裡嬌嬌怯怯，敘了幾句情話。卻才舉杯，那花兒已散，就露出蟲來。妖精也認不得是行者變的，只以為蟲兒，用小指挑起，往下一彈。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      女の妖怪は、玉のような先の細い指を見せ、きらきら光る金杯を捧げて、美酒をなみなみと注ぎ、三蔵に差し出した。
      女の妖怪「愛しい長老さま、素敵なお方。さあ、喜びを交わすお酒を一杯どうぞ。」
      三蔵は恥ずかしげに酒を受け取ると、空へ向かって注ぎ供え、心の中でひそかに祈った。
      三蔵「護法諸天（ごほうしょてん）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）の皆さま。弟子の陳玄奘（ちんげんじょう）は東土（とうど）を離れてから、観世音菩薩（かんぜおんぼさつ）のお遣わしになった神々に、陰ながら守っていただき、雷音（らいおん）を拝して仏にまみえ、経を求めようとして参りました。ところが今、旅の途中で妖怪に捕らえられ、結婚を無理強いされて、この一杯の酒を飲むよう渡されております。これが本当に素酒（そしゅ）なら、やむをえずいただいても、なお仏にお会いし、願いを果たせましょう。もし葷酒（くんしゅ）なら、私は戒を破り、永く輪廻の苦に落ちることになります。」
      悟空は身軽な姿に変わって耳の付け根の後ろにおり、まるで耳報（じほう）のようだった。何を話しても、聞こえるのは三蔵だけで、ほかの者には聞こえない。師がふだん、ぶどうで造る素酒を好むのを知っていたので、一杯飲むよう勧めた。三蔵は仕方なく飲み、急いで杯いっぱいに酒を注いで、妖怪へ返した。果たして、喜花の泡が一つ立った。悟空は蟭蟟虫に変わり、そっと泡の下へ飛び込んだ。女の妖怪は杯を受け取ったものの、すぐには飲まず、ひとまず置いた。三蔵と二度、互いに礼を交わし、甘えながら恥じらうように、幾言か愛の言葉を述べた。それからようやく杯を取り上げたが、泡はもう消え、虫が露わになっていた。妖怪は悟空の変身だとは分からず、ただの虫だと思い、小指で掬い上げ、下へ弾き落とした。
    "translation_status": "draft"

    "source_text": "這妖精開了格子，攙出唐僧。你看他許多小妖，都是油頭粉面，嬝娜娉婷，簇簇擁擁，與唐僧徑上花園而去。好和尚，他在這綺羅隊裡無他故，錦繡叢中作啞聾。若不是這鐵打的心腸朝佛去，第二個酒色凡夫也取不得經。一行都到了花園之外，那妖精俏語低聲，叫道：「妙人哥哥，這裡耍耍，真可散心釋悶。」唐僧與他攜手相攙，同入園內，擡頭觀看，其實好個去處。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"

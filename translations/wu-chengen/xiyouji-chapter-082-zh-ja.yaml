  - "id": "xy-ch82-026"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老攜著那怪，步賞花園，看不盡的奇葩異卉。行過了許多亭閣，真個是漸入佳境。忽擡頭，到了桃樹林邊。行者把師父頭上一掐，那長老就知。行者飛在桃樹枝兒上，搖身一變，變作個紅桃兒，其實紅得可愛。長老對妖精道：「娘子，你這苑內花香，枝頭果熟。苑內花香蜂競採，枝頭果熟鳥爭啣。怎麼這桃樹上果子青紅不一，何也？」妖精笑道：「天無陰陽，日月不明；地無陰陽，草木不生；人無陰陽，不分男女。這桃樹上果子，向陽處，有日色相烘者先熟，故紅；背陰處無日者還生，故青：此陰陽之道理也。」三藏道：「謝娘子指教，其實貧僧不知。」即向前伸手摘了個紅桃。妖精也去摘了一個青桃。三藏躬身將紅桃捧與妖怪道：「娘子，你愛色，請吃這個紅桃，拿青的來我吃。」妖精真個換了，且暗喜道：「好和尚啊，果是個真人，一日夫妻未做，卻就有這般恩愛也。」那妖精喜喜歡歡的把唐僧親敬。這唐僧把青桃拿過來就吃。那妖精喜相陪，把紅桃兒張口便咬。啟朱唇，露銀牙，未曾下口，原來孫行者十分性急，轂轆一個跟頭，翻入他咽喉之下，徑到肚腹之中。妖精害怕，對三藏道：「長老啊，這個果子利害：怎麼不容咬破，就滾下去了？」三藏道：「娘子，新開園的果子愛吃，所以去得快了。」妖精道：「未曾吐出核子，他就攛下去了。」三藏道：「娘子意美情佳，喜吃之甚，所以不及吐核，就下去了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      三蔵は女の妖怪と手をつなぎ、歩きながら花園を眺めた。珍しい花や草は、見ても見ても尽きない。たくさんの亭や閣を過ぎ、まさに進むほどに佳境へ入っていった。ふと顔を上げると、桃の林のそばまで来ていた。悟空が師の頭をちょいとつねると、三蔵はすぐに合図と分かった。悟空は桃の枝へ飛び移り、身を振って、赤い桃に変わった。実に愛らしい赤さである。
      三蔵は妖怪に言った。
      三蔵「奥さま、この庭では花が香り、枝では実が熟していますね。庭に花が香れば蜂が争って蜜を集め、枝に実が熟せば鳥が争ってくわえていく。それなのに、この桃の実は青いものと赤いものがまちまちです。どういうわけでしょう。」
      女の妖怪は笑った。
      女の妖怪「天に陰陽がなければ、日も月も明るく輝かない。地に陰陽がなければ、草木は生えない。人に陰陽がなければ、男と女の区別もない。この桃の木の実も、日当たりのよい所で日光に温められたものは、先に熟すから赤いの。日陰で日を受けないものは、まだ未熟だから青い。これが陰陽の道理なのよ。」
      三蔵「教えてくださって、ありがとうございます。本当に、私は存じませんでした。」
      すぐ前へ出て手を伸ばし、赤い桃を一つもいだ。妖怪も青い桃を一つ取った。三蔵は身をかがめ、赤い桃を捧げて妖怪へ差し出した。
      三蔵「奥さま、あなたは色のお好きな方です。この赤い桃を召し上がって、青いほうを私にください。」
      妖怪は本当に取り替え、ひそかに喜んだ。「いいお坊さま。やっぱり誠実なお方ね。まだ一日も夫婦として暮らしていないのに、もうこんなに愛情をかけてくださる。」
      女の妖怪は嬉しくてたまらず、三蔵を親しくいたわった。三蔵は青い桃を受け取ると、すぐに食べた。妖怪も喜んで付き合い、赤い桃にかぶりつこうと口を開いた。朱の唇が開き、銀のような歯が現れる。まだ歯が触れぬうちに、もともとひどくせっかちな悟空は、くるりと宙返りし、喉の奥へ転がり込んで、そのまま腹の中へ入った。妖怪は怖くなり、三蔵に言った。
      女の妖怪「長老さま、この果物はたいしたものね。どうして噛み割る間もなく、転がり落ちてしまったの。」
      三蔵「奥さま、開けたばかりの園の果物を食べたくてたまらないので、早く下りていったのでしょう。」
      女の妖怪「種も吐き出していないのに、飛び込んでしまったわ。」
      三蔵「奥さまのお気持ちもご機嫌もよく、とても嬉しく召し上がったから、種を吐き出す暇もなく下りたのでしょう。」
    "translation_status": "draft"
  - "id": "xy-ch82-027"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者在他肚裡，復了本相，叫聲：「師父，不要與他答嘴，老孫已得了手也。」三藏道：「徒弟方便著些。」妖精聽見道：「你和那個說話哩？」三藏道：「和我徒弟孫悟空說話哩。」妖精道：「孫悟空在那裡？」三藏道：「在你肚裡哩，卻才吃的那個紅桃子不是？」妖精慌了道：「罷了，罷了。這猴頭鑽在我肚裡，我是死也。孫行者，你千方百計的鑽在我肚裡怎的？」行者在裡邊恨道：「也不怎的，只是吃了你的六葉連肝肺，三毛七孔心，五臟都淘淨，弄做個梆子精。」妖精聽說，諕得魂飛魄散，戰戰兢兢的把唐僧抱住道：「長老啊，我只道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      悟空は女の妖怪の腹の中で本来の姿に戻り、呼ばわった。
      悟空「お師匠さま、もう相手をしなくて結構です。俺はうまくやりましたよ。」
      三蔵「悟空、少し手心を加えておくれ。」
      妖怪はそれを聞いて尋ねた。
      女の妖怪「誰と話しているの。」
      三蔵「弟子の孫悟空（そんごくう）と話しています。」
      女の妖怪「孫悟空はどこにいるの。」
      三蔵「あなたのお腹の中です。さっき食べた、あの赤い桃ではありませんか。」
      女の妖怪はうろたえた。
      女の妖怪「おしまいだ、おしまいだ。あの猿が腹に潜り込んだら、私は死んでしまう。孫行者（そんぎょうじゃ）、あの手この手を尽くして、私の腹の中へ入ってどうするつもりなの。」
      悟空は中から、憎らしげに答えた。
      悟空「大したことはしないさ。肝につながる六葉の肺、三毛七孔の心臓を食って、五臓をすっかりかき出し、お前を空っぽの拍子木の妖怪にしてやるだけだ。」
      女の妖怪はそれを聞くと、魂が飛び散るほど怖くなった。ぶるぶる震えながら三蔵を抱きしめて言った。
      女の妖怪「長老さま、私はこう思っていたのに。」

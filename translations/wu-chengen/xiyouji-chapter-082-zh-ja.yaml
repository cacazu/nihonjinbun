  "known_gaps":
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-002"
      "description_ja": "底本は篾絲䯼髻。竹ひごで形作って頭につける髷形の髪飾りと解した。教育部の異体字字典の解説全文は著者の初回取得表示には現れなかったが、独立確認では古代女性のかつら・髷とする説明と銀糸製の用例を確認した。難字を別字へ置き換えず、一尺二三寸という高さも原文のまま。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-003"
      "description_ja": "底本は侮著頭。頭を打たれた文脈から、頭を押さえると解した。侮という字そのものは変更せず、捂などへの無断補訂は行わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-003"
      "description_ja": "一身都是手は、全身が手であるほど腕が立っても、という誇張と解した。文字どおり別の身体へ変身しているとの説明ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-003"
      "description_ja": "柞撒は古い搾油器に打ち込む大きな木の楔をいうと解した。公開辞書の二次的な説明には木槓ともあり、器具の細かな形は未確定。楊の木は柔らかいポプラ類、檀は硬い木として対照されるが、近代植物学の単一の種へ限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-004"
      "description_ja": "奶奶は年上の女性への敬称にもなる。祖母という血縁ができたのではなく、八戒の親戚づきあいという勘違いと区別した。唱喏と稽首を、ここでは大きな挨拶と深い礼として訳し、明記されない平伏は加えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-004"
      "description_ja": "底本は今夜裡。昼間の捜索や前の出来事と整合しにくいが、昨夜などに変更しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-005"
      "description_ja": "你的兒子胡說は、でたらめを言う者ならお前の息子だ、という応酬。悟空に実の息子がいるという情報ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-007"
      "description_ja": "底本は周圍足有三百餘里。深さを見る場面でも周囲と書かれているため、深さ三百里へ訂正しない。十余里の岩、甕口ほどの穴という直前の寸法とも勝手に整合させない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-008"
      "description_ja": "二滴水は、屋根の雨垂れが二段になる二重の軒と解した。二滴の水が落ちているという意味にはしない。具体的な建築構造の実測資料との校合は未実施。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-009"
      "description_ja": "喜恰は和らいだ愛らしい様子。教育部の喜洽の項も喜恰を同義の別表記とする。月の嫦娥との比較を美しさの誇張として訳したが、還の比較の取り方には余地がある。一対の金蓮は女性の小さな足の美称で、蓮の花ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-011"
      "description_ja": "真陽は性によって失われると考えられた根源的な陽の精気。輪廻や陰山での罰は三蔵自身の信仰上の恐れであり、語り手による医学的・客観的保証ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-011"
      "description_ja": "喜花は注いだ酒の表面に浮く泡。教育部の重編国語辞典は西遊記の同じ話を例にこの語義を載せる。婚礼用の切り紙という別義もあるが、ここでは採らない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-013"
      "description_ja": "肉落千斤という誇張を保った。返事をしたことで強く消耗した、身が削られるような思いと解し、実際に肉が落ちた出来事とはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-016"
      "description_ja": "鶉に見立てた茄子と方旦という冬瓜料理は、精進材料を別の食物に似せる料理と解した。方旦は他資料で卵に似せた冬瓜料理として説明されるが、底本の二字の正確な由来と読みは未確定。仿蛋などへ本文を変更せず、作り方を原文以上に補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-016"
      "description_ja": "風菱は食用の菱の実に関わる語。古い本草の検索表示に、乾かした菱を風菱とする記述があるが、その資料の版面全文との校合は未実施。底本の表記を保持し、現代の一品種名と断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-016"
      "description_ja": "白果は一般にぎんなんをいう。底本の前半にも銀杏があり、同じ食材が重ねて挙げられている可能性を残した。王瓜は瓜類の名として保持し、現代のキュウリなど一種への同定を避ける。蘑菇も食用きのこの広い呼称として扱い、近代的な一種へ限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-017"
      "description_ja": "素酒と葷酒は三蔵の精進の戒に関わる区別で、薄い酒と濃い酒など複数の解釈があり、一律に非アルコールと酒類へ置き換えられない。三蔵の祈願としてこの対照を残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-017"
      "description_ja": "耳報は耳もとへひそかに知らせるものという比喩。教育部の耳報神の項は内緒で情報を伝える者を説明する。悟空が独立した新しい神に変わったと断定せず、声が師だけに聞こえる叙述を保つ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-019"
      "description_ja": "老拳は鷹の鋭い爪を拳にたとえた表現と解した。鷹に人間の拳が別に生えたと補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-022"
      "description_ja": "燒紙は神々へ紙の銭などを焼いて供える行為と解した。葷素を問わない供物の支度と天地を仲人に頼む企図を保ち、原文にない供物の具体的な品は補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-025"
      "description_ja": "底本は\U00023F79鬚。簾を巻いて鉤へ留める文脈と、別の公開引用にある蝦鬚から簾に関わる表現と解した。教育部の蝦鬚には簾の語義があるが、\U00023F79と蝦の同字関係は確認できない。\U00023F79の字形は氵と\U00021A4Bで、濘と結ばれる用例がある。原字を残し、語全体の読みと細かな意味は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-025"
      "description_ja": "底本の建物名は異箱軒。別の公開引用の検索表示には異なる文字列も見えるが、画像の校合を行っていないため訂正しない。亭・閣・池・軒の名は庭園内の名称として全て残し、同形の現実の建築と同定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-025"
      "description_ja": "底本は鸚落石。太湖石などと並ぶ景石の名と解したが、特定の石種や産地は未確認。紫英石・錦川石も現代の鉱物名へ断定せず、字面を保つ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-025"
      "description_ja": "玉瓊花は美玉のような瓊花と解した。瓊花の植物学的同定は文献によって揺れ、ここで一種に確定しない。三春は春の三か月、鬥草は草花を比べて競う遊び。庭の花を列挙する賦の結びとして保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-026"
      "description_ja": "愛色は色彩を好むことと色欲の両方に通じる言い回し。赤と青の桃の話の中にも、女の性愛の欲求をからかう含みがあると解した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-027"
      "description_ja": "六葉連肝肺、三毛七孔心は古い身体観に基づく定型的な内臓描写。六葉と肝肺の語の結びは肝とつながる六葉の肺と解したが、現代解剖学の構造へ補訂しない。三毛・七孔の数もそのまま保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-028"
      "description_ja": "藍橋は恋人の結縁の故事に関わる橋の名。教育部の辞典は裴航と雲英の故事を載せる。増水の句には橋の下で恋人を待つ伝承との連想も考えられるが、ここで特定の一話へ断定しない。仏寺の煙が沈むという句も、望んだ逢瀬が果たせぬ嘆きとして訳す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-029"
      "description_ja": "理四平は武術の構え・型を整えると解した。既出の大四平と関連する呼び方として扱うが、現代の特定流派の技へ厳密に同定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-029"
      "description_ja": "肚裡已有了人は、腹中に悟空がいるという意味でありながら、妊娠を思わせる言い回しでもある。実際の妊娠を断定せず、原文の含みを残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-029"
      "description_ja": "五湖の明月と釣り針を用いた諺。機会や生きる余地さえ残っていれば別の道がある、という意味の強い反語として訳した。ここで五つの湖の具体的な地名を補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch82-1455631"
      "segment_ids":
        - "xy-ch82-031"
      "description_ja": "心猿は悟空。土と木は五行の比喩で、門を守っていた沙悟浄と八戒にそれぞれ重ねられる。通常の地の文や話者名を土・木へ変えず、この結びの詩に限って寓意を残した。 原文の欠落ではなく、解釈・校訂上の留保。"

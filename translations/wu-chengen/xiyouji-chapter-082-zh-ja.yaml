  - "id": "xy-ch82-025"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": "縈迴曲逕，紛紛盡點蒼苔；窈窕綺窗，處處暗籠繡箔。微風初動，輕飄飄展開蜀錦吳綾；細雨才收，嬌滴滴露出冰肌玉質。日灼鮮杏，紅如仙子曬霓裳；月映芭蕉，青似太真搖羽扇。粉牆四面，萬株楊柳囀黃鸝；閑館周圍，滿院海棠飛粉蝶。更看那凝香閣、青蛾閣、解酲閣、相思閣，層層捲映，朱簾上鉤控\U00023F79鬚，又見那養酸亭、披素亭、畫眉亭、四雨亭，個個崢嶸，華扁上字書鳥篆。看那浴鶴池、洗觴池、怡月池、濯纓池，青萍綠藻耀金鱗；又有墨花軒、異箱軒、適趣軒、慕雲軒，玉斗瓊卮浮綠蟻。池亭上下，有太湖石、紫英石、鸚落石、錦川石，青青栽著虎鬚蒲；軒閣東西，有木假山、翠屏山、嘯風山、玉芝山，處處叢生鳳尾竹。荼䕷架、薔薇架，近著鞦韆架，渾如錦帳羅幃；松柏亭、辛夷亭，對著木香亭，卻似碧城繡幙。芍藥欄，牡丹叢，朱朱紫紫鬥穠華；夜合臺，茉藜檻，歲歲年年生嫵媚。涓涓滴露紫含笑，堪畫堪描；豔豔燒空紅佛桑，宜題宜賦。論景致，休誇閬苑蓬萊；較芳菲，不數姚黃魏紫。若到三春閑鬥草，園中只少玉瓊花。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      曲がりくねって巡る小道には　青い苔が点々と広がり、
      奥まった美しい窓には　刺繍の簾があちこちでほの暗く垂れる。
      微風が吹き始めれば　蜀錦（しょっきん）、呉綾（ごりょう）のような花々がふわりと開き、
      細雨がやめば　氷や玉のように清らかな花肌がしっとり現れる。
      日を浴びた鮮やかな杏は　仙女が虹の裳を干すように赤く、
      月に映える芭蕉は　太真（たいしん）が羽扇を揺らすように青い。
      四方の白壁のあたりでは　万株もの柳に鶯がさえずり、
      静かな館の周囲では　庭いっぱいの海棠に白い蝶が舞う。
      さらに見れば、凝香閣（ぎょうこうかく）、青蛾閣（せいがかく）、解酲閣（かいていかく）、相思閣（そうしかく）があり、
      幾重にも巻き上げた簾が映え合い、朱の簾の上には　鉤で𣽹鬚（ねいしゅ）を掛け留める。
      また、養酸亭（ようさんてい）、披素亭（ひそてい）、画眉亭（がびてい）、四雨亭（しうてい）は、
      どれも高くそびえ　美しい額に鳥篆（ちょうてん）の文字が記される。
      浴鶴池（よくかくち）、洗觴池（せんしょうち）、怡月池（いげつち）、濯纓池（たくえいち）を見れば、
      青い浮草、緑の藻の間に　金色の魚の鱗がきらめく。
      墨花軒（ぼっかけん）、異箱軒（いしょうけん）、適趣軒（てきしゅけん）、慕雲軒（ぼうんけん）もあり、
      玉の酒枡や美玉の杯には　緑蟻（りょくぎ）が浮かぶ。
      池とあずまやの上や下には　太湖石（たいこせき）、紫英石（しえいせき）、鸚落石（おうらくせき）、錦川石（きんせんせき）が置かれ、
      虎鬚蒲（こしゅほ）が青々と植えられる。
      軒や閣の東や西には　木仮山（もくかざん）、翠屏山（すいへいざん）、嘯風山（しょうふうざん）、玉芝山（ぎょくしざん）があり、
      あちこちに鳳尾竹（ほうびちく）が群れ生える。
      荼䕷（とび）の棚、薔薇の棚は　ぶらんこの架台に近く、
      まるで錦の帳、薄絹のとばりのよう。
      松柏亭（しょうはくてい）、辛夷亭（しんいてい）は　木香亭（もっこうてい）と向き合い、
      碧玉の城、刺繍の幕にも似ている。
      芍薬の囲いと牡丹の茂みは　赤も紫も豊かな美しさを競い、
      夜合台（やごうだい）、茉藜（まつり）の囲いには　年ごとに艶やかさが生まれる。
      雫をぽたりぽたりと落とす紫の含笑（がんしょう）は　絵に描きたくなり、
      空を焼くように鮮やかな赤い仏桑（ぶっそう）は　詩を題し賦を作るにふさわしい。
      景色を論ずるなら　閬苑（ろうえん）や蓬萊（ほうらい）を自慢するには及ばず、
      花の美しさと香りを比べるなら　姚黄（ようこう）や魏紫（ぎし）も物の数ではない。
      春の三か月、のどかに草合わせをするならば、
      この庭に足りないものは　玉瓊花（ぎょくけいか）だけ。

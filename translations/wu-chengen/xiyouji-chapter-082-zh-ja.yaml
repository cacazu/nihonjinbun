  - "id": "xy-ch82-019"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": "玉爪金睛鐵翮，雄姿猛氣摶雲。妖狐狡兔見他忙，千里山河時遁。饑處迎風逐雀，飽來高貼天門。老拳鋼硬最傷人，得志凌霄嫌近。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      玉の爪、金の眼、鉄の翼、
      勇ましい姿　猛々しい気で雲を打つ。
      妖しい狐もずるい兎も　見れば慌て、
      たちまち千里の山河へ逃げ隠れる。
      飢えれば風に向かって小鳥を追い、
      満ち足りれば高く　天門（てんもん）すれすれへ舞い上がる。
      鋼のように硬い拳は　とりわけ人を傷つけ、
      思うままなら空へ昇っても　まだ低すぎると思う。
    "translation_status": "draft"
  - "id": "xy-ch82-020"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "飛起來，掄開玉爪，響一聲，掀翻桌席，把些素果素菜，盤碟壺爵，盡皆捽碎，撇卻唐僧，飛將出去。諕得妖精心膽皆裂，唐僧亦骨肉通酥。妖精戰戰兢兢，摟住唐僧道：「長老哥哥，此物是那裡來的？」三藏道：「貧僧不知。」妖怪道：「我費了許多心，安排這個素宴與你耍耍，卻不知這個扁毛畜生從那裡飛來，把我的家火打碎。」眾小妖道：「夫人，打碎家火猶可，將些素品都潑散在地，穢了怎用？」三藏分明曉得是行者弄法，他那裡敢說。那妖精道：「小的們，我知道了：想必是我把唐僧困住，天地不容，故降此物。你們將碎家火拾出去，另安排些酒餚，不拘葷素，我指天為媒，指地作訂，然後再與唐僧成親。」依然把長老送在東廊裡坐下不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      悟空は飛び上がって玉の爪を広げ、一声響かせると、宴の卓をひっくり返した。精進の果物や料理も、皿や小皿、壺や杯も、ことごとく叩き砕き、三蔵を置き去りにして飛び出した。女の妖怪は肝が裂けるほど驚き、三蔵も全身の力が抜けた。妖怪はぶるぶる震え、三蔵を抱きしめて言った。
      女の妖怪「長老さま、この生き物は、いったいどこから来たの。」
      三蔵「私には分かりません。」
      女の妖怪「あなたと楽しもうと、あれほど心を砕いて精進の宴を用意したのに、あの羽のある畜生はどこから飛んできて、うちの道具を壊したのかしら。」
      小妖たち「奥さま、道具が壊れただけならまだよいのですが、精進のお料理まで地面にまき散らされました。汚れたものをどうして使えましょう。」
      三蔵には悟空の術だとはっきり分かっていたが、言い出せるはずもない。
      女の妖怪「お前たち、分かったわ。私が唐僧を閉じ込めたのを、天も地もお許しにならず、あの生き物を下されたに違いない。壊れた道具を拾って外へ出しなさい。別に酒と料理を用意して。葷でも精進でも構わない。天を仲人に、地を婚約の証人にして、そのうえで唐僧と結婚するわ。」
      そうして三蔵を、前と同じように東の廊下へ連れていって座らせた。この話はひとまず置く。
    "translation_status": "draft"
  - "id": "xy-ch82-021"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者飛出去，現了本相，到於洞口，叫聲：「開門！」八戒笑道：「沙僧，哥哥來了。」他二人撒開兵器。行者跳出，八戒上前扯住道：「可有妖精？可有師父？」行者道：「有有有。」八戒道：「師父在裡邊受罪哩，綁著是綑著？要蒸是要煮？」行者道：「這個事倒沒有，只是安排素宴，要與他幹那個事哩。」八戒道：「你造化，你造化，你吃了陪親酒來了？」行者道：「獃子啊，師父的性命也難保，吃甚麼陪親酒？」八戒道：「你怎的就來了？」行者把見唐僧施變化的上項事說了一遍。道：「兄弟們，再休胡思亂想。師父已在此間，老孫這一去，一定救他出來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      さて、悟空は飛び出して本来の姿に戻ると、洞の口まで来て叫んだ。
      悟空「開けろ！」
      八戒は笑った。
      八戒「沙悟浄、兄貴が来たぞ。」
      二人は武器をどけた。悟空が跳び出すと、八戒は前へ寄ってつかまえた。
      八戒「妖怪はいたか。お師匠さまはいたか。」
      悟空「いた、いた、いた。」
      八戒「師匠は中でひどい目に遭っているんだろう。縛られていたか、くくられていたか。蒸されるのか、煮られるのか。」
      悟空「そういうことはない。ただ精進の宴を用意して、あのことをしようとしているんだ。」
      八戒「ついてるね、ついてるね。身内として婚礼の酒を飲んできたのかい。」
      悟空「ばか。師匠の命も危ないのに、何が婚礼の酒だ。」
      八戒「じゃあ、どうして戻ってきたんだ。」
      悟空は、三蔵に会い、変身の術を使った、先ほどのいきさつを一通り話した。
      悟空「二人とも、もう余計なことを考えるな。師匠がここにいると分かった以上、今度こそ必ず救い出してくる。」
    "translation_status": "draft"
  - "id": "xy-ch82-022"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "復翻身入裡面，還變做個蒼蠅兒，丁在門樓上聽之。只聞得這妖怪氣呼呼的，在亭子上吩咐：「小的們，不論葷素，拿來燒紙。借煩天地為媒訂，務要與他成親。」行者聽見，暗笑道：「這妖精全沒一些兒廉恥，青天白日的，把個和尚關在家裡擺佈。且不要忙，等老孫再進去看看。」嚶的一聲，飛在東廊之下，只見那師父坐在裡邊，清滴滴腮邊淚淌。行者鑽將進去，丁在他頭上，又叫聲：「師父。」長老認得聲音，跳起來，咬牙恨道：「猢猻啊，別人膽大，還是身包膽；你的膽大，就是膽包身。你弄變化神通，打破家火，能值幾何？鬥得那妖精淫興發了，那裡不分葷素安排，定要與我交媾，此事怎了？」行者暗中陪笑道：「師父莫怪，有救你處。」唐僧道：「那裡救得我？」行者道：「我才一翅飛起去時，見他後邊有個花園。你哄他往園裡去耍子，我救了你罷。」唐僧道：「園裡怎麼樣救？」行者道：「你與他到園裡，走到桃樹邊，就莫走了。等我飛上桃枝，變作個紅桃子。你要吃果子，先揀紅的兒摘下來。紅的是我。他必然也要摘一個，你把紅的定要讓他。他若一口吃了，我卻在他肚裡，等我搗破他的皮袋，扯斷他的肝腸，弄死他，你就脫身了。」三藏道：「你若有手段，就與他賭鬥便了，只要鑽在他肚裡怎麼？」行者道：「師父，你不知趣。他這個洞，若好出入，便可與他賭鬥；只為出入不便，曲道難行，若就動手，他這一窩子，老老小小，連我都扯住，卻怎麼了？須是這般捽手幹，大家才得乾淨。」三藏點頭聽信，只叫：「你跟定我。」行者道：「曉得，曉得，我在你頭上。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      悟空はまた身を翻して中へ入り、再び蠅になって、楼門に止まって耳を澄ました。女の妖怪が怒りに息を荒らげ、あずまやで言いつけている声が聞こえる。
      女の妖怪「お前たち、葷でも精進でも構わないから持っておいで。紙銭（しせん）を焼くのよ。天と地に仲人と婚約の証人をお願いして、どうしてもあの方と結婚するの。」
      悟空は聞いて、ひそかに笑った。「この妖怪には、少しの恥もないのか。真っ昼間から坊主を家へ閉じ込めて、好きにしようとしている。まあ、慌てるな。もう一度、中へ行って見てこよう。」
      ぶん、と東の廊下へ飛んでいくと、三蔵は中に座り、澄んだ涙をぽろぽろ頬へ流していた。悟空は中へ潜り込み、その頭に止まった。
      悟空「お師匠さま。」
      三蔵は声に気づくと跳び上がり、歯を食いしばって怒った。
      三蔵「猿め！　ほかの者が大胆といっても、まだ体の中に肝がある。お前は肝の中に体があるような大胆さだ。変化の神通力を使って道具を壊したところで、いくらの値打ちになる。おかげで妖怪の淫欲をかき立ててしまい、あちらでは葷も精進もお構いなしに支度をして、どうしても私と交わるという。どうしてくれるのだ。」
      悟空は姿を隠したまま、愛想よく笑ってみせた。
      悟空「お師匠さま、お怒りにならないで。まだ助ける手があります。」
      三蔵「どこで助けられるというのだ。」
      悟空「さっき翅を広げて飛び出したとき、奥に花園があるのが見えました。あの女をうまく誘って、一緒に庭へ遊びに行ってください。そこで助けます。」
      三蔵「庭でどう助けるのだ。」
      悟空「二人で庭へ行き、桃の木のところまで来たら、そこで足を止めてください。私は桃の枝へ飛び移り、赤い桃に変わります。果物を食べたいと言って、まず赤いのを選んでもいでください。それが私です。あいつも必ず一つ取るでしょうから、赤いほうをどうしてもあいつに譲るんです。一口食えば、私は腹の中へ入れる。皮袋を突き破り、肝と腸を引きちぎって殺せば、お師匠さまは抜け出せます。」
      三蔵「それだけ腕があるなら、正面から戦えばよいではないか。どうして腹の中へ入ることばかり考えるのだ。」
      悟空「お師匠さま、事情がお分かりではありません。この洞が楽に出入りできる所なら、戦ってもいいんです。ところが出入りは難しく、道は曲がりくねって通りにくい。そこで手を出したら、この巣窟の年寄りから子供まで総がかりで、私まで引き留めたらどうなります。こうして思い切って片をつけてこそ、みんなすっきりできるんです。」
      三蔵はうなずき、言うことを聞くことにした。ただ、こう念を押した。
      三蔵「私から離れずについていておくれ。」
      悟空「分かっています、分かっています。お師匠さまの頭にいますよ。」
    "translation_status": "draft"

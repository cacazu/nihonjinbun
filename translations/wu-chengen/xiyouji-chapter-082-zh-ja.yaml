  - "id": "xy-ch82-028"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      夙世前緣繫赤繩，魚水相和兩意濃。
      不料鴛鴦今拆散，何期鸞鳳又西東。
      藍橋水漲難成事，佛廟煙沉嘉會空。
      著意一場今又別，何年與你再相逢！」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 165
        "line_end": 168
    "translation_ja": |-
      女の妖怪「前世からの縁を　赤い縄が結び、
      魚と水のように睦み合い　二人の思いは深かった。
      それなのに今　鴛鴦（おしどり）が引き離されるとは、
      鸞（らん）と鳳凰がまた東西へ分かれるとは　思いもしなかった。
      藍橋（らんきょう）の水が増せば　願いは遂げられず、
      仏の寺の煙が沈めば　めでたい逢瀬もむなしい。
      心を尽くしたひとときも　今また別れとなる。
      いったい何年たったら　あなたにまた会えるのかしら！」

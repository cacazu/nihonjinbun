      第八十二回
      姹女は陽を求め　元神は道を守る
    "translation_status": "draft"
  - "id": "xy-ch82-002"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說八戒跳下山，尋著一條小路。依路前行，有五六里遠近，忽見二個女怪，在那井上打水。他怎麼認得是兩個女怪，見他頭上戴一頂一尺二三寸高的篾絲䯼髻，甚不時興。獃子走近前，叫聲：「妖怪。」那怪聞言大怒，兩人互相說道：「這和尚憊懶，我們又不與他相識，平時又沒有調得嘴慣，他怎麼叫我們做妖怪？」那怪惱了，掄起擡水的杠子，劈頭就打。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、八戒（はっかい）は山を跳び下り、小道を見つけた。その道を五、六里（り）ほど進むと、ふいに二人の女の妖怪が井戸で水を汲んでいるのが見えた。どうして女の妖怪だと分かったのか。頭に、高さ一尺（しゃく）二、三寸（すん）もある、竹ひごで組んだ䯼髻（てきけい）をかぶっており、ひどく時代遅れだったからである。八戒は近づいて呼びかけた。
      八戒「おい、妖怪。」
      それを聞くと、二人はかんかんに怒り、顔を見合わせて言った。
      水汲みの女妖怪たち「この坊主、なんてふざけた奴だろう。顔見知りでもないし、いつも冗談を言い合っている仲でもないのに、どうして私たちを妖怪なんて呼ぶの。」
      怒った二人は、水桶を担ぐ棒を振り上げ、頭めがけて殴りつけた。

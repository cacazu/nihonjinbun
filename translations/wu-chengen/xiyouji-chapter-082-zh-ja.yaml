    "source_text": "好獃子，把釘鈀撒在腰裡，下山凹，搖身一變，變做個黑胖和尚。搖搖擺擺，走近怪前，深深唱個大喏道：「奶奶，貧僧稽首了。」那兩個喜道：「這個和尚卻好，會唱個喏兒，又會稱道一聲兒。」問道：「長老，那裡來的？」八戒道：「那裡來的。」又問：「那裡去的？」又道：「那裡去的。」又問：「你叫做甚麼名字？」又答道：「我叫做甚麼名字。」那怪笑道：「這和尚好便好，只是沒來歷，會說順口話兒。」八戒道：「奶奶，你們打水怎的？」那怪道：「和尚，你不知道，我家老夫人今夜裡攝了一個唐僧在洞內，要管待他，我洞中水不乾淨，差我兩個來此打這陰陽交媾的好水，安排素果素菜的筵席，與唐僧吃了，晚間要成親哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      そこで八戒は釘鈀（ていは）を腰へ差し、山あいへ下りると、身を振って、色黒の太った僧に変身した。体を揺すりながら妖怪たちの前へ近づき、大きな声で挨拶して深々と礼をした。
      八戒「おばあさま、僧の私から謹んでご挨拶いたします。」
      二人は喜んだ。
      水汲みの女妖怪たち「今度のお坊さまはいいねえ。ちゃんと挨拶もできるし、呼び方も心得ている。」
      水汲みの女妖怪たち「長老、どこからいらしたの。」
      八戒「どこからいらしたの。」
      水汲みの女妖怪たち「どこへ行くの。」
      八戒「どこへ行くの。」
      水汲みの女妖怪たち「あなたは何という名前なの。」
      八戒「俺は何という名前なの。」
      水汲みの女妖怪は笑った。
      水汲みの女妖怪「いいお坊さまではあるけれど、素性がさっぱり分からない。口まねなら上手なんだね。」
      八戒「おばあさま、何のために水を汲んでいるんだい。」
      水汲みの女妖怪「お坊さま、知らないのね。うちの奥さまが今夜、唐僧（とうそう）を一人、洞へさらってこられたので、おもてなしをするのよ。洞の中の水はきれいではないから、私たち二人は、ここへ陰陽（いんよう）の交わったよい水を汲みに出されたの。精進の果物や野菜のごちそうを用意して、唐僧に食べてもらい、晩には結婚するんだって。」
    "translation_status": "draft"
  - "id": "xy-ch82-005"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子聞此言，急抽身跑上山，叫：「沙和尚，快拿將行李來，我們分了罷。」沙僧道：「二哥，又分怎的？」八戒道：「分了，便你還去流沙河吃人，我去高老莊探親，哥哥去花果山稱聖，白龍馬歸大海成龍。師父已在這妖精洞內成親哩，我們都各安生理去也。」行者道：「這獃子又胡說了。」八戒道：「你的兒子胡說。才那兩個擡水的妖精說，安排素筵席與唐僧吃了成親哩。」行者道：「那妖精把師父困在洞裡，師父眼巴巴的望我們去救，你卻在此說這樣話。」八戒道：「怎麼救？」行者道：「你兩個牽著馬，挑著擔，我們跟著那兩個女怪，做個引子，引到那門前，一齊下手。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      これを聞くと、八戒はさっと身を引き、山へ駆け上がって叫んだ。
      八戒「沙和尚（さおしょう）、早く荷物を持ってきな。みんなで分けよう。」
      沙悟浄（さごじょう）「八戒兄さん、またどうして分けるのです。」
      八戒「分けちまえば、お前は流沙河（りゅうさが）へ戻って人を食い、俺は高老荘（こうろうそう）へ親戚を訪ね、兄貴は花果山（かかざん）へ行って大聖（たいせい）を名乗り、白竜馬（はくりゅうば）は大海へ帰って竜になる。お師匠さまはもう妖怪の洞で結婚しているんだ。それぞれ自分の暮らしを立てようぜ。」
      悟空「このばか、またでたらめを言っている。」
      八戒「でたらめを言う奴はお前の息子だ。さっき水を担いでいた二人の妖怪が言ったんだよ。精進の宴を用意して、唐僧に食わせてから結婚するって。」
      悟空「妖怪に洞の中へ閉じ込められて、師匠は俺たちが助けに来るのを首を長くして待っているんだぞ。それを、お前はここでそんなことを言うのか。」
      八戒「どうやって助けるんだ。」
      悟空「二人で馬を引き、荷を担げ。あの女の妖怪二人についていこう。あいつらを道案内にして入り口まで行き、一斉に手を下すんだ。」
    "translation_status": "draft"
  - "id": "xy-ch82-006"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "真個獃子只得隨行。行者遠遠的標著那兩怪，漸入深山，有一二十里遠近，忽然不見。八戒驚道：「師父是日裡鬼拿去了。」行者道：「你好眼力，怎麼就看出他本相來？」八戒道：「那兩個怪正擡著水走，忽然不見，卻不是個日裡鬼？」行者道：「想是鑽進洞去了。等我去看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      八戒も仕方なく、ついていくことにした。悟空は遠くから二人の妖怪を見失わぬように追い、次第に深い山の中へ入った。十里か二十里ほど来たところで、二人がふっと姿を消した。
      八戒は驚いた。
      八戒「お師匠さまをさらったのは、昼間の幽霊だったんだ。」
      悟空「たいした目を持っているな。どうしてもう本性が見抜けたんだ。」
      八戒「二人とも水を担いで歩いていたのに、急にいなくなったじゃねえか。昼間の幽霊でなくて何なんだ。」
      悟空「洞へ入ったんだろう。俺が見てくる。」

  - "id": "xy-ch82-003"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這獃子手無兵器，遮架不得，被他撈了幾下，侮著頭跑上山來道：「哥啊，回去罷，妖怪兇。」行者道：「怎麼兇？」八戒道：「山凹內兩個女妖精在井上打水，我只叫了他一聲，就被他打了我三四杠子。」行者道：「你叫他做甚麼的？」八戒道：「我叫他做妖怪。」行者笑道：「打得還少。」八戒道：「謝你照顧。頭都打腫了，還說少哩。」行者道：「溫柔天下去得，剛強寸步難移。他們是此地之怪，我們是遠來之僧，你一身都是手，也要略溫存。你就去叫他做妖怪，他不打你，打我？人將禮樂為先。」八戒道：「一發不曉得。」行者道：「你自幼在山中吃人，你曉得有兩樣木麼？」八戒道：「不知。是甚麼木？」行者道：「一樣是楊木，一樣是檀木。楊木性格甚軟，巧匠取來，或雕聖像，或刻如來，裝金立粉，嵌玉裝花，萬人燒香禮拜，受了多少無量之福。那檀木性格剛硬，油房裡取了去，做柞撒，使鐵箍箍了頭，又使鐵鎚往下打，只因剛強，所以受此苦楚。」八戒道：「哥啊，你這好話兒，早與我說說也好，卻不受他打了。」行者道：「你還去問他個端的。」八戒道：「這去他認得我了。」行者道：「你變化了去。」八戒道：「哥啊，且如我變了，卻怎麼問麼？」行者道：「你變了去，到他跟前，行個禮兒，看他多大年紀。若與我們差不多，叫他聲『姑娘』；若比我們老些兒，叫他聲『奶奶』。」八戒笑道：「可是蹭蹬，這般許遠的田地，認得是甚麼親？」行者道：「不是認親，要套他的話哩。若是他拿了師父，就好下手；若不是他，卻不誤了我們別處幹事？」八戒道：「說得有理，等我再去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

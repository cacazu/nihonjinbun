    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者在他肚裡聽見說時，只怕長老慈心，又被他哄了，便就掄拳跳腳，支架子，理四平，幾乎把個皮袋兒搗破了。那妖精忍不得疼痛，倒在塵埃，半晌家不敢言語。行者見不言語，想是死了，卻把手略鬆一鬆。他又回過氣來，叫：「小的們在那裡？」原來那些小妖自進園門來，各人知趣，都不在一處，各自去採花鬥草，任意隨心耍子，讓那妖精與唐僧兩個自在敘情兒。忽聽得叫，卻才都跑將來。又見妖精倒在地上，面容改色，口裡哼哼的爬不動，連忙攙起，圍在一處道：「夫人，怎的不好？想是急心疼了？」妖精道：「不是，不是。你莫要問，我肚裡已有了人也。快把這和尚送出去，留我性命。」那些小妖真個都來扛擡。行者在肚裡叫道：「那個敢擡？要便是你自家獻我師父出去，出到外邊，我饒你命。」那怪精沒及奈何，只是惜命之心。急掙起來，把唐僧背在身上，拽開步，往外就走。小妖跟隨道：「老夫人，往那裡去？」妖精道：「留得五湖明月在，何愁沒處下金鉤？把這廝送出去，等我別尋一個頭兒罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      悟空は腹の中でその言葉を聞くと、師が慈悲の心を起こして、また言いくるめられるのを恐れた。そこで拳を振り、足を跳ね上げ、構えを取り、四平（しへい）の型を整えて、皮袋を突き破りそうなほど暴れた。妖怪は痛みに耐えられず、地面の塵の上へ倒れ、しばらく口もきけなかった。悟空は声がしなくなったので、死んだのかと思い、少し手を緩めた。すると妖怪は息を吹き返し、叫んだ。
      女の妖怪「お前たち、どこにいるの！」
      小妖たちは、園へ入ってからそれぞれ気を利かせ、同じ所にはいなかった。各自、花を摘み、草合わせをして、思い思いに遊び、女の妖怪と三蔵の二人が気兼ねなく愛を語れるようにしていたのである。呼ぶ声を聞いて、ようやくみな駆けてきた。女の妖怪が地面に倒れ、顔色も変わり、口でうめくばかりで這うこともできないのを見ると、急いで助け起こし、まわりへ集まって言った。
      小妖たち「奥さま、どうなさったのです。急に胸が痛みだしたのでしょうか。」
      女の妖怪「違う、違う。聞かないでおくれ。私のお腹には、もう人がいるんだよ。早くこのお坊さまを外へ送り出して、私の命を助けておくれ。」
      小妖たちは本当に、みなで三蔵を担ぎ上げにかかった。悟空が腹の中から叫んだ。
      悟空「誰が担いでいいと言った。連れ出すなら、お前自身が師匠を捧げ持って送り出せ。外まで出たら、命は助けてやる。」
      女の妖怪はどうしようもなく、ただ命が惜しい一心だった。急いで体を起こし、三蔵を背負うと、大股で外へ向かって歩きだした。
      小妖たちはついてきて尋ねた。
      小妖たち「奥さま、どちらへ行かれるのですか。」
      女の妖怪「五つの湖に明月さえ残っていれば、金の釣り針を垂れる場所に困るものか。この男を送り出して、また別の相手を見つけるわ。」
    "translation_status": "draft"
  - "id": "xy-ch82-030"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好妖精，一縱雲光，直到洞口。又聞得叮叮噹噹，兵刃亂響。三藏道：「徒弟，外面兵器響哩。」行者道：「是八戒揉鈀哩。你叫他一聲。」三藏便叫：「八戒。」八戒聽見道：「沙和尚，師父出來也。」二人掣開鈀、杖，妖精把唐僧馱出。咦！正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      女の妖怪は雲の光をひと跳びし、そのまま洞の口へ来た。するとまた、ちんちん、かんかんと、武器が入り乱れて鳴る音が聞こえた。
      三蔵「悟空、外で武器の音がする。」
      悟空「八戒が釘鈀を振っているんです。呼んでください。」
      三蔵「八戒。」
      八戒は声を聞くと言った。
      八戒「沙和尚、師匠が出てきたぞ。」
      二人は釘鈀と杖を引き、妖怪は三蔵を背負って外へ出た。いや、まさにこういうことだ。
    "translation_status": "draft"
  - "id": "xy-ch82-031"
    "section_id": "chapter-82"
    "kind": "verse"
    "origin": "source"
    "source_text": "心猿裡應降邪怪，土木司門接聖僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      心猿（しんえん）は内から呼応して　邪なる妖怪を降し、
      土と木は門を守り　聖なる僧を迎え入れる。
    "translation_status": "draft"
  - "id": "xy-ch82-032"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知那妖精性命如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 174
        "line_end": 174
    "translation_ja": "さて、あの妖怪の命がどうなるのかは、次の回でお聞きいただこう。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-01-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の姹女は美しい女と錬丹の術語を重ねる呼称、元神は根源的な精神の意。女が陽を求め、精神が道を守るという対句を保った。内丹の語の細かな配当は一義に確定せず、後の固有名や結末を説明へ持ち込まない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-02-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は篾絲䯼髻。竹ひごで形作って頭につける髷形の髪飾りと解した。教育部の異体字字典の解説全文は著者の初回取得表示には現れなかったが、独立確認では古代女性のかつら・髷とする説明と銀糸製の用例を確認した。難字を別字へ置き換えず、一尺二三寸という高さも原文のまま。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-03-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は侮著頭。頭を打たれた文脈から、頭を押さえると解した。侮という字そのものは変更せず、捂などへの無断補訂は行わない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-04-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "一身都是手は、全身が手であるほど腕が立っても、という誇張と解した。文字どおり別の身体へ変身しているとの説明ではない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-05-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "柞撒は古い搾油器に打ち込む大きな木の楔をいうと解した。公開辞書の二次的な説明には木槓ともあり、器具の細かな形は未確定。楊の木は柔らかいポプラ類、檀は硬い木として対照されるが、近代植物学の単一の種へ限定しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-06-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "奶奶は年上の女性への敬称にもなる。祖母という血縁ができたのではなく、八戒の親戚づきあいという勘違いと区別した。唱喏と稽首を、ここでは大きな挨拶と深い礼として訳し、明記されない平伏は加えない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-07-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は今夜裡。昼間の捜索や前の出来事と整合しにくいが、昨夜などに変更しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-08-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "你的兒子胡說は、でたらめを言う者ならお前の息子だ、という応酬。悟空に実の息子がいるという情報ではない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-09-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は周圍足有三百餘里。深さを見る場面でも周囲と書かれているため、深さ三百里へ訂正しない。十余里の岩、甕口ほどの穴という直前の寸法とも勝手に整合させない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-10-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "二滴水は、屋根の雨垂れが二段になる二重の軒と解した。二滴の水が落ちているという意味にはしない。具体的な建築構造の実測資料との校合は未実施。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-11-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "喜恰は和らいだ愛らしい様子。教育部の喜洽の項も喜恰を同義の別表記とする。月の嫦娥との比較を美しさの誇張として訳したが、還の比較の取り方には余地がある。一対の金蓮は女性の小さな足の美称で、蓮の花ではない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-12-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "真陽は性によって失われると考えられた根源的な陽の精気。輪廻や陰山での罰は三蔵自身の信仰上の恐れであり、語り手による医学的・客観的保証ではない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-13-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "喜花は注いだ酒の表面に浮く泡。教育部の重編国語辞典は西遊記の同じ話を例にこの語義を載せる。婚礼用の切り紙という別義もあるが、ここでは採らない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-14-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "肉落千斤という誇張を保った。返事をしたことで強く消耗した、身が削られるような思いと解し、実際に肉が落ちた出来事とはしない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-15-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鶉に見立てた茄子と方旦という冬瓜料理は、精進材料を別の食物に似せる料理と解した。方旦は他資料で卵に似せた冬瓜料理として説明されるが、底本の二字の正確な由来と読みは未確定。仿蛋などへ本文を変更せず、作り方を原文以上に補わない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-16-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "風菱は食用の菱の実に関わる語。古い本草の検索表示に、乾かした菱を風菱とする記述があるが、その資料の版面全文との校合は未実施。底本の表記を保持し、現代の一品種名と断定しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-17-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "白果は一般にぎんなんをいう。底本の前半にも銀杏があり、同じ食材が重ねて挙げられている可能性を残した。王瓜は瓜類の名として保持し、現代のキュウリなど一種への同定を避ける。蘑菇も食用きのこの広い呼称として扱い、近代的な一種へ限定しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-18-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "素酒と葷酒は三蔵の精進の戒に関わる区別で、薄い酒と濃い酒など複数の解釈があり、一律に非アルコールと酒類へ置き換えられない。三蔵の祈願としてこの対照を残す。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-19-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "耳報は耳もとへひそかに知らせるものという比喩。教育部の耳報神の項は内緒で情報を伝える者を説明する。悟空が独立した新しい神に変わったと断定せず、声が師だけに聞こえる叙述を保つ。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-20-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "老拳は鷹の鋭い爪を拳にたとえた表現と解した。鷹に人間の拳が別に生えたと補わない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-21-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "燒紙は神々へ紙の銭などを焼いて供える行為と解した。葷素を問わない供物の支度と天地を仲人に頼む企図を保ち、原文にない供物の具体的な品は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-22-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は\U00023F79鬚。簾を巻いて鉤へ留める文脈と、別の公開引用にある蝦鬚から簾に関わる表現と解した。教育部の蝦鬚には簾の語義があるが、\U00023F79と蝦の同字関係は確認できない。\U00023F79の字形は氵と\U00021A4Bで、濘と結ばれる用例がある。原字を残し、語全体の読みと細かな意味は留保する。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-23-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の建物名は異箱軒。別の公開引用の検索表示には異なる文字列も見えるが、画像の校合を行っていないため訂正しない。亭・閣・池・軒の名は庭園内の名称として全て残し、同形の現実の建築と同定しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-24-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は鸚落石。太湖石などと並ぶ景石の名と解したが、特定の石種や産地は未確認。紫英石・錦川石も現代の鉱物名へ断定せず、字面を保つ。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-25-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "玉瓊花は美玉のような瓊花と解した。瓊花の植物学的同定は文献によって揺れ、ここで一種に確定しない。三春は春の三か月、鬥草は草花を比べて競う遊び。庭の花を列挙する賦の結びとして保持する。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-26-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "愛色は色彩を好むことと色欲の両方に通じる言い回し。赤と青の桃の話の中にも、女の性愛の欲求をからかう含みがあると解した。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-27-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "六葉連肝肺、三毛七孔心は古い身体観に基づく定型的な内臓描写。六葉と肝肺の語の結びは肝とつながる六葉の肺と解したが、現代解剖学の構造へ補訂しない。三毛・七孔の数もそのまま保持する。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-28-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "藍橋は恋人の結縁の故事に関わる橋の名。教育部の辞典は裴航と雲英の故事を載せる。増水の句には橋の下で恋人を待つ伝承との連想も考えられるが、ここで特定の一話へ断定しない。仏寺の煙が沈むという句も、望んだ逢瀬が果たせぬ嘆きとして訳す。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-29-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "理四平は武術の構え・型を整えると解した。既出の大四平と関連する呼び方として扱うが、現代の特定流派の技へ厳密に同定しない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-30-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "肚裡已有了人は、腹中に悟空がいるという意味でありながら、妊娠を思わせる言い回しでもある。実際の妊娠を断定せず、原文の含みを残す。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-31-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "五湖の明月と釣り針を用いた諺。機会や生きる余地さえ残っていれば別の道がある、という意味の強い反語として訳した。ここで五つの湖の具体的な地名を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch82-note-32-body"
    "section_id": "chapter-82"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "心猿は悟空。土と木は五行の比喩で、門を守っていた沙悟浄と八戒にそれぞれ重ねられる。通常の地の文や話者名を土・木へ変えず、この結びの詩に限って寓意を残した。"
    "translation_status": "draft"

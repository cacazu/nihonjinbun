    "source_text": "行者卻將身一縱，跳入洞中，足下彩雲生萬道，身邊瑞氣護千層。不多時，到於深遠之間，那裡邊明明朗朗，一般的有日色，有風聲，又有花草果木。行者喜道：「好去處啊！想老孫出世，天賜與水簾洞，這裡也是個洞天福地。」正看時，又有一座二滴水的門樓，團團都是松竹，內有許多房舍。又想道：「此必是妖精的住處了。我且到裡邊去打聽打聽。且住。若是這般去啊，他認得我了。且變化了去。」搖身捻訣，就變做個蒼蠅兒，輕輕的飛在門樓上聽聽。只見那怪高坐在草亭內，他那模樣，比在松林裡救他，寺裡拿他，便是不同，越發打扮得俊了："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"

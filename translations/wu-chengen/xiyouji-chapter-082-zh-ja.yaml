    "translation_ja": |-
      八戒は手に武器がなく、防ぐこともできずに何度か殴られ、頭を押さえながら山へ駆け戻った。
      八戒「兄貴、帰ろうぜ。妖怪は凶暴だ。」
      悟空（ごくう）「どんなふうに凶暴なんだ。」
      八戒「山あいで二人の女の妖怪が井戸の水を汲んでいたんだ。俺は一声かけただけなのに、棒で三、四発殴られちまった。」
      悟空「何と呼びかけた。」
      八戒「妖怪って呼んだ。」
      悟空は笑った。
      悟空「それなら、殴られ足りないくらいだ。」
      八戒「ご親切にどうも。頭が腫れちまったのに、まだ足りないってのか。」
      悟空「物腰が柔らかければ天下のどこへでも行けるが、強情を張れば一歩も進めない。あいつらはこの土地の妖怪で、俺たちは遠くから来た僧だ。お前の体じゅうが手で、どれほど腕が立つとしても、少しは穏やかに振る舞わなくちゃならん。いきなり妖怪と呼ばれたら、お前を殴らず、俺を殴るとでもいうのか。人間はまず礼儀を大切にするものだ。」
      八戒「ますます分からねえや。」
      悟空「お前は小さいころから山で人を食っていたからな。二種類の木を知っているか。」
      八戒「知らねえ。何て木だ。」
      悟空「一つはポプラの木、もう一つは檀（だん）の木だ。ポプラの木は性質がとても柔らかいから、腕のよい職人に持っていかれ、聖人の像や如来（にょらい）の像に彫られる。金を塗り、白粉で彩り、玉をはめ、花で飾られて、万人が香をたき、礼拝する。どれほど限りない福を受けることか。それにひきかえ、檀の木は性質が硬いから、油搾りの店へ持っていかれて、柞撒（さくさつ）という楔にされる。頭に鉄のたがをはめられ、その上から鉄槌で打ち込まれる。強情だからこそ、そんな苦しみを受けるんだ。」
      八戒「兄貴、そんなありがたい話なら、先に聞かせてくれればよかったのに。そうすりゃ殴られずに済んだ。」
      悟空「もう一度行って、確かなことを聞いてこい。」
      八戒「今度行っても、顔を覚えられているぜ。」
      悟空「姿を変えて行け。」
      八戒「兄貴、姿を変えたとして、どう聞けばいいんだい。」
      悟空「変身してあいつらの前へ行ったら、礼をしろ。それから年ごろを見て、俺たちと同じくらいなら『お嬢さん』と呼び、俺たちより年上なら『おばあさま』と呼ぶんだ。」
      八戒は笑った。
      八戒「とんだ災難だ。こんな遠くの土地へ来て、何だって親戚づきあいをしなくちゃならねえ。」
      悟空「親戚になるんじゃない。話を引き出すためだ。あいつらが師匠をさらったのなら、手を打てる。違うのなら、よそを捜す仕事に差し支えずに済むだろう。」
      八戒「そりゃもっともだ。もう一度行ってくる。」

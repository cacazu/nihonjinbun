    "translation_ja": |-
      女の妖怪は格子戸を開け、三蔵を支えて外へ出した。見れば、大勢の小妖たちはみな、髪に油をつけ、顔に白粉を塗り、しなやかでたおやかな姿で、群がり寄り添い、三蔵とまっすぐ花園へ向かった。さすがはこの僧。美しい絹を着た女たちの列にいても、よそな心はなく、錦と刺繍に囲まれながら、口もきかず、耳も貸さぬふりをしている。仏へ向かう鉄のように固い心がなければ、酒と女に溺れるそこらの凡夫に、経を取ってくることなどできなかったろう。一行が花園の外へ着くと、女の妖怪は気を引くような言葉を、低い声でささやいた。
      女の妖怪「愛しいお方、ここで遊べば、本当に気が晴れて、憂さも消えるわ。」
      三蔵は女の妖怪と手をつなぎ、互いに支え合って庭へ入った。顔を上げて見ると、実に見事な所であった。

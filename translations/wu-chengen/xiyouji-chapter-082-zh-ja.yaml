  - "id": "xy-ch82-007"
    "section_id": "chapter-82"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，急睜火眼金睛，漫山看處，果然不見動靜。只見那陡崖前，有一座玲瓏剔透細妝花、堆五采、三簷四簇的牌樓。他與八戒、沙僧近前觀看，上有六個大字，乃「陷空山無底洞」。行者道：「兄弟呀，這妖精把個架子支在這裡，還不知門向那裡開哩。」沙僧說：「不遠，不遠，好生尋。」都轉身看時，牌樓下，山腳下有一塊大石，約有十餘里方圓，正中間有缸口大的一個洞兒，爬得光溜溜的。八戒道：「哥啊，這就是妖精出入洞也。」行者看了道：「怪哉！我老孫自保唐僧，瞞不得你兩個，妖精也拿了些，卻不見這樣洞府。八戒，你先下去試試，看有多少淺深，我好進去救師父。」八戒搖頭道：「這個難，這個難。我老豬身子夯夯的，若塌了腳吊下去，不知二三年可得到底哩。」行者道：「就有多深麼？」八戒道：「你看。」大聖伏在洞邊上，仔細往下看處，咦！深啊，周圍足有三百餘里。回頭道：「兄弟，果然深得緊。」八戒道：「你便回去罷，師父救不得耶。」行者道：「你說那裡話？莫生懶惰意，休起怠荒心。且將行李歇下，把馬拴在牌樓柱上。你使釘鈀，沙僧使杖，攔住洞門，讓我進去打聽打聽。若師父果在裡面，我將鐵棒把妖精從裡打出，跑至門口，你兩個卻在外面擋住：這是裡應外合。打死精靈，才救得師父。」二人遵命。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      悟空はすぐに火眼金睛（かがんきんせい）を見開き、山じゅうを見渡したが、なるほど、動く気配はどこにもない。ただ険しい崖の前に、透かし細工の精緻な花飾りを施し、五彩を盛り上げ、三重の軒に四つの飾りを群がらせた牌楼（はいろう）が一つあった。八戒、沙悟浄と一緒に近づいて見ると、「陷空山（かんくうざん）無底洞（むていどう）」という六文字が大書してある。
      悟空「おい、二人とも。妖怪はこんな門構えを立てているが、肝心の入り口がどこへ開いているのか、まだ分からんな。」
      沙悟浄「遠くはありません、遠くはありません。よく探しましょう。」
      みんなで振り向いて見ると、牌楼の下、山のふもとに、広がりが十余里ほどもある大きな岩があった。その真ん中に、大甕の口ほどの穴が一つ開き、出入りにこすられて、つるつるになっていた。
      八戒「兄貴、これが妖怪の出入りする穴だよ。」
      悟空は見て言った。
      悟空「妙だな。唐僧を守るようになってから、二人とも知ってのとおり、俺はかなり妖怪を捕まえてきたが、こんな住まいは見たことがない。八戒、まずお前が下りて、どのくらい深いか試してこい。そうすれば俺も入って師匠を助けられる。」
      八戒は首を振った。
      八戒「そいつは困る、そいつは困る。俺はずっしり重いから、足を踏み外して落っこちたら、二、三年たっても底へ着くか分からねえ。」
      悟空「それほど深いのか。」
      八戒「見てみろよ。」
      悟空は穴のへりに伏せ、よくよく下をのぞいた。いやはや、深いこと。周囲もたっぷり三百余里はある。振り返って言った。
      悟空「なるほど、本当に深いな。」
      八戒「もう帰ろうぜ。師匠は助けられねえよ。」
      悟空「何を言う。怠け心を起こすな。投げ出そうなどと考えるな。まず荷を下ろし、馬を牌楼の柱につなげ。お前は釘鈀、沙悟浄は杖を持って穴をふさぎ、俺が中へ入って様子を探る。師匠が本当に中にいたら、俺は鉄棒で妖怪を追い立てて外へ出す。入り口へ逃げてきたら、二人で外から押さえろ。内と外から呼応するんだ。妖怪を打ち殺して、初めて師匠を助けられる。」
      二人は命じられたとおりにした。

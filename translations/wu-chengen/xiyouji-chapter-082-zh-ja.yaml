    "source_text": "行者見事不諧，料難入他腹，即變做個餓老鷹。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 152
        "line_end": 152
    "translation_ja": "悟空はうまくいかなかったのを見て、もう腹の中へ入るのは難しいと判断し、すぐに腹をすかせた鷹へ変わった。その姿は、まさしくこうである。"

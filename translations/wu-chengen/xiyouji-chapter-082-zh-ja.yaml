    "source_text": "師徒們商量定了，三藏才欠起身來，雙手扶著那格子，叫道：「娘子，娘子。」那妖精聽見，笑唏唏的跑近跟前道：「妙人哥哥，有甚話說？」三藏道：「娘子，我出了長安，一路西來，無日不山，無日不水。昨在鎮海寺投宿，偶得傷風重疾，今日出了汗，略才好些。又蒙娘子盛情，攜入仙府。只是坐了這一日，又覺心神不爽。你帶我往那裡略散散心，耍耍兒去麼。」那妖精十分歡喜道：「妙人哥哥倒有些興趣，我和你去花園裡耍耍。」叫：「小的們，拿鑰匙來開了園門，打掃路逕。」眾妖都跑去開門收拾。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch82-1455631"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第082回&oldid=1455631"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      師弟の相談が決まると、三蔵は腰を浮かせ、両手を格子に掛けて呼んだ。
      三蔵「奥さま、奥さま。」
      女の妖怪はそれを聞き、にこにこしながら駆け寄ってきた。
      女の妖怪「愛しいお方、何のお話なの。」
      三蔵「奥さま、私は長安を出て西へ来るまで、山を通らぬ日も、水を渡らぬ日もございませんでした。昨日、鎮海寺（ちんかいじ）に宿を取り、ふとひどい風邪を引きましたが、今日、汗が出て、少しだけよくなったところです。そのうえ、奥さまのお厚いお心遣いで、こちらの仙人の館へお連れいただきました。ただ、こうして一日座っていると、また気分が晴れなくなりました。どこかへ連れていって、少し気晴らしに遊ばせていただけませんか。」
      女の妖怪はたいそう喜んだ。
      女の妖怪「愛しいお方も、少しは楽しむ気になったのね。一緒に花園へ遊びに行きましょう。」
      女の妖怪「お前たち、鍵を持ってきて園の門を開け、道を掃除しなさい。」
      小妖たちはみな走っていき、門を開け、片づけた。

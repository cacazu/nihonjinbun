- "id": "xy-ch13-004"
  "section_id": "chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏自貞觀十三年九月望前三日，蒙唐王與多官送出長安關外。一二日馬不停蹄，早至法門寺。本寺住持上房長老，帶領眾僧有五百餘人，兩邊羅列，接至裡面，相見獻茶。茶罷進齋，齋後不覺天晚。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第013回&oldid=1500625"
    "line_start": 128
    "line_end": 128
  "translation_ja": "さて三蔵（さんぞう）は、貞観（じょうがん）十三年九月の十五日の三日前、太宗（たいそう）と大勢の官人に見送られ、長安（ちょうあん）の関外へ出た。一日、二日と馬を休めず、早くも法門寺（ほうもんじ）に着いた。この寺の住持（じゅうじ）で、上房（じょうぼう）に住まう長老が五百余人の僧を率い、左右に並んで迎え、寺の中へ案内した。挨拶を交わして茶を出し、茶が済むと精進の食事を供した。食事を終えるころには、いつしか日も暮れていた。まさしく、"
  "translation_status": "reviewed"
- "id": "xy-ch13-005"
  "section_id": "chapter-13"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    影動星河近，月明無點塵。
    雁聲鳴遠漢，砧韻響西鄰。
    歸鳥棲枯樹，禪僧講梵音。
    蒲團一榻上，坐到夜將分。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第013回&oldid=1500625"
    "line_start": 130
    "line_end": 133
  "translation_ja": |-
    星の影は揺れ、天の川は近く、明るい月に塵ひとつない。
    雁の声は遠い大空に響き、西隣からは砧（きぬた）の音が聞こえる。
    帰る鳥は枯れ木にとまり、禅僧は仏の教えを説く。
    寝台ひとつ、蒲の座布団の上に、夜半近くまで座っている。
  "translation_status": "reviewed"
- "id": "xy-ch13-006"
  "section_id": "chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾僧們燈下議論佛門定旨，上西天取經的原由：有的說水遠山高，有的說路多虎豹；有的說峻嶺陡崖難度，有的說毒魔惡怪難降。三藏箝口不言，但以手指自心，點頭幾度。眾僧們莫解其意，合掌請問道：「法師指心點頭者，何也？」三藏答曰：「心生，種種魔生；心滅，種種魔滅。我弟子曾在化生寺對佛說下洪誓大願，不由我不盡此心。這一去，定要到西天，見佛求經，使我們法輪回轉，願聖主皇圖永固。」眾僧聞得此言，人人稱羨，個個宣揚，都叫一聲：「忠心赤膽大闡法師！」誇讚不盡，請師入榻安寐。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第013回&oldid=1500625"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    僧たちは灯の下で、仏門の教えの要と、西天（さいてん）へ経を取りに行くわけを論じ合った。ある者は川が遠く山が高いと言い、ある者は道に虎や豹が多いと言う。険しい山や切り立った崖は越えがたいと言う者も、悪魔や恐ろしい妖怪は降しがたいと言う者もあった。三蔵は口を閉ざしたまま、ただ自分の胸を指し、何度かうなずいた。僧たちはその意味が分からず、合掌して尋ねた。
    法門寺の僧たち「法師が胸を指してうなずかれるのは、どういうわけでしょうか。」
    三蔵「心が生じれば、さまざまな魔が生じ、心が滅すれば、さまざまな魔も滅します。弟子の私は、かつて化生寺（けしょうじ）で仏の御前に大きな誓願を立てました。この心を尽くさずにはおれません。このたびは必ず西天に至り、仏にお会いして経を求め、私たちの法輪（ほうりん）を回らせ、聖なる主君の国が永く揺るがぬよう願うのです。」
    これを聞いた僧たちは、誰もが感服し、口々に称賛した。
    法門寺の僧たち「忠義のまことを尽くし、教えを大きく広める法師であられる！」
    いくら褒めても褒め足りぬまま、三蔵を寝所へ案内して休ませた。
  "translation_status": "reviewed"

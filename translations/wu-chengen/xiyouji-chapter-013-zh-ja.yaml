  "known_gaps":
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-003"
    "description_ja": "底本の『秉教迦持』は第八回にも見える字句で、迦を加へ補訂せず保持した。訳では『教えを奉じ、加持を受け』と解したが、語構成には留保がある。 『尋龍穴』は比喩的な求道表現と考えられるが、竜のすみかを尋ねるという字面を残し、特定の内丹説・風水説を本文に補わなかった。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-006"
    "description_ja": "底本の寺名は『化生寺』。別表記へ修正しない。法輪を回すとは仏の教えを広めることとして訳す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-009"
    "description_ja": "『河州衛』『總兵』『僧綱』などの制度名は、唐代という物語設定と時代差があっても底本どおり残した。河州衛をここで国境といいながら後段も唐領とされる地理は、独自に整合させない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-010"
    "description_ja": "洞内から『拿將來』と命じる個人は原文に明記されない。魔王へ断定せず『話者不明』とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-011"
    "description_ja": "『東海黃公』は虎を制する幻術師が結局虎に殺されるという故事を踏まえる。南山の白額の王は虎の詩的呼称であり、固有の別妖怪を登場させない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-013"
    "description_ja": "『向來符吉夢』は熊の夢を男子誕生の吉兆とする伝統に関係するが、本文の吉夢以上の説明は訳詩に加えなかった。 『准靈惟顯處』の語構成は未詳。准靈を霊妙な力が確かに現れる意と解して全句を訳したが、独立校訂は未了。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-015"
    "description_ja": "『性服青衣穩』は文法・字面に疑問を残す。底本を改めず、青い衣に身を落ち着ける姿として訳した。牯・牸はそれぞれ雄牛・雌牛の古語として保持する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-019"
    "description_ja": "老人が述べる『本性元明』と食べられなかった理由は人物の説明として訳した。語り手の別の因果説明を付け加えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-021"
    "description_ja": "四句の頌は書付であって、その場で音読する会話ではない。太白星の名乗りを保持し、会話用の話者ラベルは加えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-023"
    "description_ja": "獐・麂は古典の獣名として区別し、現生種を厳密に同定したとは扱わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-026"
    "description_ja": "『叵羅衣』はこの箇所で羊毛の錦織りと説明される服名。裁断・形状は確定せず、名称と原文の材質を残した。 『弔客』『河奎』は恐ろしい容貌を表す神名の比喩。河奎は通常の河魁へ無断訂正しない。河奎という字面全体の日本語慣用読みは未確認。 『山蟲』はこの文脈では虎の俗称で、昆虫ではない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-028"
    "description_ja": "劉伯欽がいう『山猫』はここでは虎の呼び名。大きな猫の別種が登場したと読み替えない。030の同じ呼び方も保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-031"
    "description_ja": "稀字を含む『迤\U000284E6』を原文に保持し、曲がりくねりながら進む様子として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-035"
    "description_ja": "底本の『山地榆』は茶に煎じる葉の植物名として残した。地榆の薬草名か、山の榆をいうか、具体的な植物種の同定は留保する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-038"
    "description_ja": "『度亡經』は亡者を救う経として訳し、特定の現存経典の正式名へ置き換えていない。 『苾蒭』は比丘と同義。日本語側では通常の別表記『苾芻』を採用した。どの洗業の故事かは原文に詳細がなく、特定の物語を補わない。 『紙馬』は祭祀で焼く神像などの紙を指すので、馬の姿だけを焼いたことにはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-039"
    "description_ja": "『夫妻們俱…我與媳婦』は語り手の主語が夫婦複数なのに発言内は夫の言い方になる。合同ラベル『劉伯欽夫妻』を保持し、台詞も『私も妻も』として原文のずれを残した。 一家で礼を述べる『都至前拜謝道』も、発言内では『我亡父』となる。『劉伯欽の一家』の合同発言とし、原文の『亡き父』を消さなかった。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "segment_ids":
    - "xy-ch13-041"
    "description_ja": "末尾の叫びの正体はこの回の結語で次回へ保留される。発言者は『山の下の声』とし、後の回の人物名を先取りしない。 本文の欠落ではなく解釈・校訂上の留保。"

    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第013回&oldid=1500625"
    "line_start": 201
    "line_end": 201
  "translation_ja": "いったい何者が叫んだのか。それは次の回でお話ししよう。"

- "id": "xy-ch13-003"
  "section_id": "chapter-13"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大有唐王降敕封，欽差玄奘問禪宗。
    堅心磨琢尋龍穴，著意修持上鷲峰。
    邊界遠遊多少國，雲山前度萬千重。
    自今別駕投西去，秉教迦持悟大空。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch13-1500625"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第013回&oldid=1500625"
    "line_start": 123
    "line_end": 126
  "translation_ja": |-
    大いなる唐王（とうおう）は勅命を下して称号を授け、玄奘（げんじょう）を遣わして仏の教えを尋ねさせる。
    堅い心を磨き上げて竜のすみかを尋ね、修行に思いを凝らして霊鷲山（りょうじゅせん）へ登る。
    国境を越えて幾つの国を遠く旅し、雲のかかる山々を幾千幾万と越えるのか。
    今こそ天子の御車（みくるま）に別れを告げて西へ向かい、教えを奉じ、加持（かじ）を受け、大空（だいくう）を悟る。
  "translation_status": "reviewed"

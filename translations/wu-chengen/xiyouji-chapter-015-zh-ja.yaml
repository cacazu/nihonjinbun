  "known_gaps":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-003"
    "description_ja": "末句の底本は「鷗鷺相忘沒釣逢」。釣逢の語構成は未詳で、釣り人に出会わない意として暫定的に訳した。釣篷などの別字へ原文を修正せず、この解釈の留保を残す。 千仞・万頃は高さ・広がりの誇張を伴う古い単位表現。現代のメートルや面積へ換算していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-006"
    "description_ja": "護法の神々の合同発言と五方掲諦の発言を区別した。六丁六甲・五方掲諦・四値功曹・十八柱の護教伽藍、および当番の指示をすべて保持した。「金箍鐵棒」は作品の既定呼称に従い、訳文では如意金箍棒とする。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-008"
    "description_ja": "「迷爺娘的業子」は父母を惑わせる罪深い子と解した。後続の天将を欺く妖怪との対句を残し、ここに父母への具体的行為を追加していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-010"
    "description_ja": "「吃不得人急他」は単に急がされることではなく、相手に煽られると黙っていられない性質を述べる。独立レビューの指摘を受けて訳語を修正した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-012"
    "description_ja": "「孤拐」はこの用例ではくるぶし。教育部《重編國語辭典修訂本》の同語が第十五回の当該箇所を挙げて「腳踝」とする。https://dict.revised.moe.edu.tw/dictView.jsp?ID=70836&la=0&powerMode=0 鷹愁陡澗で鳥が自分の影を仲間と誤認して水に飛び込む説明は、山神と土地神の語る物語内の説明であり、現代の鳥類学的事実を保証しない。 「侮手」はこの文脈で手合わせする意と解した。原文の侮の字を別字へ無断補訂していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-015"
    "description_ja": "「蜜多」は波羅蜜多の末尾と解するが、底本は蜜多だけを記す。訳文ではその字面を残し、特定の経典名に置き換えない。 「滿長城」は字面どおり長城に満たすと訳した。長城を万里の長城に特定するか、広い地域をいう表現と取るかは留保する。 ここでの「三蔵」は人名ではなく仏教聖典の分類である。金蝉と玄奘は同じ人物の前世と今世を指すが、殻を脱ぐという詩の像を消していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-016"
    "description_ja": "「魔頭」はこの問答では行者を拘束し修行へ導く苦難として「難儀」と訳した。独立した魔王が現れる意味には取らない。菩薩への非難と菩薩の猿への罵り、緊箍児の痛みの反復は弱めていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-017"
    "description_ja": "竜の発言は「昨日腹中饑餒」。前段から日が改まった叙述がないが、原文の「昨日」を保持し、「さっき」などへ整合させていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-018"
    "description_ja": "「横骨」は原語を保持した。動物が話せない原因となる骨という小説上の観念と読む解説がある一方、教育部《重編國語辭典修訂本》は当該用例を挙げ、馬の口に含ませる銜と説明する。直後に鞍轡がないと述べられるため、一方の解釈だけで確定せず、本文は「口に横骨を含んだまま、心の中で…」とした。https://dict.revised.moe.edu.tw/dictView.jsp?ID=82410&la=1&powerMode=0 ／ https://www.sohu.com/a/128045379_488605 馬になった竜の承諾は心中の反応であり、声の返事を加えない。観音の「我回海上去也」は直前の主語から観音の直接発言と判断した。 三枚の楊柳の葉が後頭部で三本の救命の毛になる順序、天と地が応じる約束、観音自ら救いに来る約束を省略せず残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-019"
    "description_ja": "「不耐煩矣」は行者の言葉として、菩薩が待ちかねて帰ったという含みで訳した。菩薩の内心を語り手が確認した事実にはしていない。「撮土焚香」は土を取って香を焚くという字面を残す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-020"
    "description_ja": "漁師の正体を水神だとするのは行者の説明であり、三蔵が半信半疑であることを残した。裸馬は鞍のない馬。「廣大真如登彼岸」は渡河と悟りの二重性を保つ。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-023"
    "description_ja": "飛魚・穏獣はこの文脈では屋根の棟の飾り。水中の魚や実在の動物が棟にいる意味にしない。具体的な建築部位と形状の細部は留保する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-024"
    "description_ja": "「哈咇國」は底本の固有名を「哈咇国」として保持し、別字・実在の国へ無断置換しない。老人の里・社の字義説明、四季の農作業、三牲・五穀・六畜を残す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-025"
    "description_ja": "三蔵の「昨日東來」と「今此過澗，未經一日」は底本どおり「昨日」「まだ一日もたたぬ」とする。初めの飯と後の晩斎も別に出るため、重複として削除しない。三蔵が老人への謝罪の途中で行者に向き直って叱る構造を保つ。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-027"
    "description_ja": "初句の「柬銀星」は未詳。柬の「選ぶ」という字義を踏まえ、銀の星を選び散らしたかのような輝きとして暫定的に訳した。嵌・揀などへの原文補訂はしていない。 「雲扇」は馬具の装飾として名称を保持し、構造を確定しない。「兩垂蘸水結毛纓」は左右に垂れる毛の房が水に浸るという字面で訳す。特定の部材名「水垂れ」等を創作しない。 雕鞍・宝鐙・襯屜・三股の紫絹の手綱・轡頭・雲扇・環嚼・毛纓を順に訳し、一覧を「馬具一式」で済ませない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-028"
    "description_ja": "「拱手」は胸前で両手を組み合わせる礼で、合掌とは区別する。鞭の香籐の柄、革片の巻き留め、虎の筋の糸で結んだ先端を残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-029"
    "description_ja": "空中の名乗りは「我是落伽山山神、土地」と単数の自称に二つの神名が続く。ラベルを「落伽山の山神・土地神の声」とし、「私は」という底本の自称を保持する。老人が山神、童子が土地神などの対応は原文に明記されないため補わない。 語り手の「孫大聖／美猴王」は同じ人物についての対句として保持する。「孜孜的喜壞」は強い喜びであって、踊る動作を創作しない。 末尾の「快起來」は三蔵が行者へ言う発言に含まれる一方、その後で立ち上がるのは三蔵と書かれる。発話者を無断変更せず、訳でも「さあ立って」として食い違いを残す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "segment_ids":
    - "xy-ch15-030"
    "description_ja": "「羅羅」「回回」は原文の歴史的呼称を保持した。現代の自称や正確な民族分類だと保証しない。直後の狼・虎・豹との列挙は人々と獣の区別を明記し、二か月の平穏な旅路と早春への推移を省略しない。 本文の欠落ではなく解釈・校訂上の留保。"

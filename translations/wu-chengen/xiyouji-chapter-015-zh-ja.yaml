- "id": "xy-ch15-013"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見說，喚山神、土地，同來見了三藏，具言前事。三藏道：「若要去請菩薩，幾時才得回來？我貧僧饑寒怎忍？」說不了，只聽得暗空中有金頭揭諦叫道：「大聖，你不須動身，小神去請菩薩來也。」行者大喜，道聲：「有累，有累。快行，快行。」那揭諦急縱雲頭，徑上南海。行者吩咐山神、土地守護師父，日值功曹去尋齋供，他又去澗邊巡遶不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    行者はこれを聞くと、山神と土地神を呼び連れて三蔵に会い、いまの話を詳しく伝えた。
    三蔵「菩薩さまをお迎えに行くとなると、いつ戻れるだろう。僧の私は、飢えと寒さにどう耐えればよいのだ。」
    言い終わらぬうちに、姿の見えぬ空から金頭掲諦が呼びかけた。
    金頭掲諦「大聖、お出かけには及びません。私が菩薩さまをお迎えに参ります。」
    行者は大喜びした。
    行者「ご苦労をかける、ご苦労をかける。急いで、急いでください。」
    金頭掲諦はさっそく雲に乗り、まっすぐ南海（なんかい）へ向かった。行者は山神と土地神に師の護衛を命じ、日直の功曹には精進の供物を探しにやり、自分はまた谷川のほとりを見回りに行った。その話はひとまず措く。
  "translation_status": "reviewed"
- "id": "xy-ch15-014"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說金頭揭諦一駕雲，早到了南海。按祥光，直至落伽山紫竹林中，託那金甲諸天與木叉惠岸轉達，得見菩薩。菩薩道：「汝來何幹？」揭諦道：「唐僧在蛇盤山鷹愁陡澗失了馬，急得孫大聖進退兩難。及問本處土神，說是菩薩送在澗裡的孽龍吞了。那大聖著小神來告請菩薩降這孽龍，還他馬匹。」菩薩聞言道：「這廝本是西海敖閏之子，他為縱火燒了殿上明珠，他父告他忤逆，天庭上犯了死罪。是我親見玉帝，討他下來，教他與唐僧做個腳力。他怎麼反吃了唐僧的馬？這等說，等我去來。」那菩薩降蓮臺，徑離仙洞，與揭諦駕著祥光，過了南海而來。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    さて、金頭掲諦はひとたび雲に乗ると、早くも南海へ着いた。瑞光を降ろして落伽山（らっかさん）の紫竹林（しちくりん）へまっすぐ入り、金甲諸天（きんこうしょてん）と木叉（もくさ）こと恵岸行者（えがんぎょうじゃ）に取り次いでもらって、観音菩薩にお目にかかった。
    観音菩薩「何の用で来たのです。」
    金頭掲諦「唐僧（とうそう）が蛇盤山の鷹愁陡澗で馬を失い、孫大聖は進むにも退くにも困っております。そこの土地神に聞きますと、菩薩さまが谷川へお送りになった悪竜が呑み込んだとのこと。そこで大聖は、菩薩さまにあの竜を降し、馬を返させていただこうと、私をお迎えに寄こしたのでございます。」
    観音菩薩は聞くと言った。
    観音菩薩「あの者は、もと西海（さいかい）の敖閏（ごうじゅん）の子です。火を放って御殿の明珠を焼き、父に親への反逆を訴えられ、天庭で死罪となったのでした。私がじかに玉帝（ぎょくてい）にお会いして引き取ってきたのは、唐僧の乗り物にするためです。それなのに、どうして唐僧の馬を食べたのでしょう。そのようなことなら、私が参りましょう。」
    観音菩薩は蓮台から下り、仙洞を出ると、金頭掲諦とともに瑞光に乗って、南海を越えてやってきた。その証として、詩がある。
    詩にいう。
  "translation_status": "reviewed"
- "id": "xy-ch15-015"
  "section_id": "chapter-15"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    佛說蜜多三藏經，菩薩揚善滿長城。
    摩訶妙語通天地，般若真言救鬼靈。
    致使金蟬重脫殼，故令玄奘再修行。
    只因路阻鷹愁澗，龍子歸真化馬形。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 143
    "line_end": 146
  "translation_ja": |-
    仏は蜜多（みった）の三蔵（さんぞう）の経を説き、菩薩は善を広めて長城（ちょうじょう）に満たす。
    摩訶（まか）の妙なる言葉は天地に通じ、般若（はんにゃ）の真言は亡霊を救う。
    それゆえ金蝉（きんせん）はふたたび殻を脱ぎ、玄奘（げんじょう）もまた修行を重ねる。
    ただ鷹愁澗に道を阻まれたがため、竜の子は真の道へ帰り、馬の姿となる。

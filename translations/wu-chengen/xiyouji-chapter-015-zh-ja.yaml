    "message_ja": "ここでの「三蔵」は人名ではなく仏教聖典の分類である。金蝉と玄奘は同じ人物の前世と今世を指すが、殻を脱ぐという詩の像を消していない。"
- "id": "xy-ch15-016"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩與揭諦不多時到了蛇盤山，卻在那半空裡留住祥雲，低頭觀看，只見孫行者正在澗邊叫罵。菩薩著揭諦喚他來。那揭諦按落雲頭，不經由三藏，直至澗邊，對行者道：「菩薩來也。」行者聞得，急縱雲跳到空中，對他大叫道：「你這個七佛之師，慈悲的教主，你怎麼生方法兒害我？」菩薩道：「我把你這個大膽的馬流，村愚的赤尻。我倒再三盡意，度得個取經人來，叮嚀教他救你性命，你怎麼不來謝我活命之恩，反來與我嚷鬧？」行者道：「你弄得我好哩。你既放我出來，讓我逍遙自在耍子便了。你前日在海上迎著我，傷了我幾句，教我來盡心竭力，伏侍唐僧便罷了，你怎麼送他一頂花帽，哄我戴在頭上受苦？把這個箍子長在老孫頭上，又教他念一卷甚麼『緊箍兒咒』，著那老和尚念了又念，教我這頭上疼了又疼，這不是你害我也？」菩薩笑道：「你這猴子，你不遵教令，不受正果，若不如此拘係你，你又誑上欺天，知甚好歹？再似從前撞出禍來，有誰收管？須是得這個魔頭，你才肯入我瑜伽之門路哩。」行者道：「這樁事，作做是我的魔頭罷。你怎麼又把那有罪的孽龍，送在此處成精，教他吃了我師父的馬匹？此又是縱放歹人為惡，太不善也。」菩薩道：「那條龍，是我親奏玉帝，討他在此，專為求經人做個腳力。你想那東土來的凡馬，怎歷得這萬水千山？怎到得那靈山佛地？須是得這個龍馬，方才去得。」行者道：「像他這般懼怕老孫，潛躲不出，如之奈何？」菩薩叫揭諦道：「你去澗邊叫一聲『敖閏龍王玉龍三太子，你出來，有南海菩薩在此。』他就出來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"

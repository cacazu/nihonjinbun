  "translation_ja": |-
    ちょうど合掌して挨拶をしている間に、老人の姿はもう消えていた。振り返ると、あの里社祠も、ただの空き地になっていた。空中から声だけが聞こえた。
    落伽山の山神・土地神の声「聖僧、おもてなしが行き届きませんでした。私は落伽山の山神・土地神で、菩薩さまのお言いつけにより、あなた方へ鞍と轡をお届けしたのです。努めて西へお進みなさい。一時も怠ってはなりません。」
    三蔵は驚いて、鞍から転がり落ちるように馬を下り、空に向かって礼拝した。
    三蔵「弟子の私は凡人の目と身しか持たず、尊い神のお姿を見抜けませんでした。どうかお許しください。菩薩さまには、深いお恵みとお守りを賜り、ありがたく存じますと、お取り次ぎください。」
    三蔵はただ空へ向かって、数も知れぬほど額を地につけ続けた。道端では孫大聖が笑い転げ、美猴王（びこうおう）はうれしくてたまらない様子だった。行者は前へ出て、三蔵の体を引いた。
    行者「お師匠さま、お立ちください。もう遠くへ行ってしまいました。お祈りも聞こえず、お辞儀も見えないのに、何をそんなに拝んでいるのです。」
    三蔵「弟子よ、私がこうして額を地につけているのに、お前は一度も拝まず、脇に立って笑ってばかりいる。どういう道理だ。」
    行者「お師匠さまにはお分かりでない。ああして正体を隠して尻尾を見せるような者は、本来ひとつ打ってやるべきなのです。菩薩さまに免じて、打たずにおく。それで十分なのに、どうしてこの俺の礼拝まで受けられましょう。俺は小さいころから豪傑で、人を拝むことなど知りません。玉皇大帝（ぎょくこうたいてい）や太上老君（たいじょうろうくん）に会っても、声をかけて一礼するだけです。」
    三蔵「不心得者め、そんな空威張りはやめなさい。さあ立って、道行きを遅らせるな。」
    そうして三蔵は、ようやく立ち上がって支度を整え、西へ向かった。
  "translation_status": "reviewed"
  "issues":

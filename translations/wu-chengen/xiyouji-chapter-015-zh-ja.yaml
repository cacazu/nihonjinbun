  "translation_ja": |-
    行者は棒を持って追いかけ、草をかき分けて蛇を捜したが、影も形も見つからない。苛立ちのあまり、三尸神（さんししん）は騒ぎ立ち、七竅（しちきょう）から煙が噴くほどだった。「唵（おん）」の一字の呪を唱えると、その土地の土地神と山神を呼び出した。二柱はそろってひざまずき、申し上げた。
    山神と土地神「山神と土地神、参上いたしました。」
    行者「くるぶしをこちらへ突き出せ。対面の挨拶代わりに五発ずつ食らわせて、この俺の気晴らしにしてやる。」
    二柱は額を地につけて哀願した。
    山神と土地神「大聖（たいせい）、どうかお情けをかけ、お話をさせてください。」
    行者「何を言うつもりだ。」
    山神と土地神「大聖は長らく囚われの身でいらっしゃいました。いつお出になったか存じませず、お迎えに上がれませんでした。どうか、お許しください。」
    行者「そういうことなら、ひとまず打たずにおこう。聞くが、鷹愁澗にいるのはどこから来た怪竜だ。なぜ、お師匠さまの白馬を奪って食ったのだ。」
    山神と土地神「大聖には、これまでお師匠さまなどいらっしゃいませんでした。もともと天にも地にも従わぬ混元上真（こんげんじょうしん）でいらっしゃったのに、どうして、お師匠さまの馬などというものがあるのでしょう。」
    行者「お前たちは知らんのだな。俺は天の上を欺いた一件のため、まるまる五百年の苦しみを受けた。今、観音菩薩が善へ導いてくださり、唐（とう）の帝のもとにいるまことの僧に俺を救い出させ、弟子として付き従って、西天（さいてん）へ仏を拝み、経を求めに行くよう命じられたのだ。ここを通る途中で、お師匠さまの白馬がいなくなった。」
    山神と土地神「そういうことでしたか。この谷川には、もとより邪悪なものはおりませんでした。ただ、深く険しく幅が広く、水は底まですっかり澄み切っておりますので、烏や鵲も恐れて飛び越えません。水が澄んで自分の姿が映ると、仲間の鳥だと思い、しばしば身を水の中へ投げてしまうのです。それで『鷹愁陡澗』と申します。ただ、以前、観音菩薩が取経の方を捜しに行かれた折、一匹の玉竜（ぎょくりゅう）をお救いになり、ここへ送って、悪事をせずに取経の方を待てとお命じになりました。竜は腹が減ったときだけ岸へ上がり、鳥や鵲を捕らえて食べるか、獐（しょう）や鹿を捕って食べております。なぜ今日、そのようにわきまえもなく大聖に楯突いたのか、私どもには分かりません。」
    行者「初めはこの俺と手を交えて、何合か戦った。次には俺がいくら罵っても、もう出てこなかった。それで川を翻し海をかき混ぜる術を使い、谷川の水を濁らせたら、飛び出してきて、まだ争おうとしたのだ。俺の棒の重さを知らぬから、受け止められなくなって、水蛇に変わり草の中へ逃げ込んだ。追ってきて捜したが、姿がない。」
    土地神「大聖はご存じないのです。この谷川は、数え切れぬ穴が互いに通じております。それで水も深く、遠くまで続いているのです。おそらく、この辺りにも一つ穴があり、そこから下へ潜ったのでしょう。お怒りになって、ここをお捜しになるには及びません。あの者を捕らえるには、観世音（かんぜおん）をお招きさえすれば、おのずと服従いたします。」

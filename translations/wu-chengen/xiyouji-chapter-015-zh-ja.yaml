    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    観音菩薩と金頭掲諦はほどなく蛇盤山へ着き、中空で瑞雲を留めて下を見た。行者は、まだ谷川のほとりで罵っていた。観音菩薩は金頭掲諦に呼んでくるよう命じた。金頭掲諦は雲を降り、三蔵のもとには寄らず、まっすぐ谷川へ行って告げた。
    金頭掲諦「菩薩さまがお見えです。」
    行者は聞くなり雲を跳ばして空中へ上がり、観音菩薩に大声を浴びせた。
    行者「七仏（しちぶつ）の師、慈悲の教主たるあんたが、どうして知恵を絞って俺を苦しめるんだ！」
    観音菩薩「なんという大胆な猿、無骨で愚かな赤尻猿でしょう。私は何度も心を尽くして取経の者を導き、お前の命を救うよう、くれぐれも言い聞かせたのです。命を救われた恩を感謝しに来るどころか、なぜ私にわめき立てるのですか。」
    行者「まんまと、ひどい目に遭わせてくれたものだ！　俺を外へ出したのなら、気ままに遊ばせておけばよかったんだ。先日、海の上で俺を迎え、さんざん小言を言い、力を尽くして唐僧に仕えろと命じた。それだけならまだいい。どうして花模様の帽子を渡しておき、俺をだましてかぶらせ、苦しめるんだ。この輪は頭に生えついてしまった。そのうえ、あの人に『緊箍児の呪（きんこじのじゅ）』とかいう一巻を教え、あの老和尚が何度も何度も唱えるたび、俺の頭は痛んでばかりだ。これは、あんたが俺を苦しめているんじゃないか！」
    観音菩薩は笑って言った。
    観音菩薩「この猿は、教えや命令に従わず、正しい悟りを得ようともしない。このように縛っておかなければ、また目上を欺き、天を侮るでしょう。善し悪しが分かるのですか。以前のように災いを引き起こしたら、誰が取り締まるのです。こうした難儀があってこそ、お前も私の瑜伽（ゆが）の道へ入る気になるのです。」
    行者「その一件は、俺に与えられた難儀としておこう。それなら、どうして罪のある悪竜をここへ送って妖怪にし、お師匠さまの馬を食わせたんだ。これはまた悪人を野放しにして悪事をさせるということで、まるで善いことじゃない！」
    観音菩薩「あの竜は、私がじかに玉帝へ奏上して引き取り、取経の者の乗り物にするためだけに、ここへ置いたのです。考えてみなさい。東土（とうど）から来たただの馬に、どうしてこの万水千山を越えられますか。どうして霊山（れいざん）の仏の地までたどり着けますか。この竜馬（りゅうめ）があってこそ、行けるのです。」
    行者「あいつはこの俺を怖がって、潜ったまま出てきません。どうすればよいのです。」
    観音菩薩は金頭掲諦に命じた。
    観音菩薩「谷川のほとりへ行って、『敖閏竜王（ごうじゅんりゅうおう）の玉竜三太子（ぎょくりゅうさんたいし）、出てきなさい。南海の菩薩がおいでです』と呼びなさい。そうすれば出てきます。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「魔頭」はこの問答では行者を拘束し修行へ導く苦難として「難儀」と訳した。独立した魔王が現れる意味には取らない。菩薩への非難と菩薩の猿への罵り、緊箍児の痛みの反復は弱めていない。"
- "id": "xy-ch15-017"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那揭諦果去澗邊叫了兩遍。那小龍翻波跳浪，跳出水來，變作一個人像，踏了雲頭，到空中對菩薩禮拜道：「向蒙菩薩解脫活命之恩，在此久等，更不聞取經人的音信。」菩薩指著行者道：「這不是取經人的大徒弟？」小龍見了道：「菩薩，這是我的對頭。我昨日腹中饑餒，果然吃了他的馬匹。他倚著有些力量，將我鬥得力怯而回，又罵得我閉門不敢出來。他更不曾提著一個『取經』的字樣。」行者道：「你又不曾問我姓甚名誰，我怎麼就說？」小龍道：「我不曾問你是那裡來的潑魔？你嚷道：『管甚麼那裡不那裡，只還我馬來。』何曾說出半個『唐』字？」菩薩道：「那猴頭專倚自強，那肯稱讚別人？今番前去，還有歸順的哩。若問時，先提起『取經』的字來，卻也不用勞心，自然拱伏。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    金頭掲諦はさっそく谷川のほとりへ行き、二度呼びかけた。竜は波を返し、うねりを越えて水から飛び出し、人の姿に変わった。雲を踏んで空へ上がると、観音菩薩に礼拝して言った。
    竜「以前、菩薩さまのおかげで苦しみを脱し、命を救っていただきました。ここで長く待っておりましたが、取経の方のお便りは、まったくございませんでした。」
    観音菩薩は行者を指さした。
    観音菩薩「これが取経の者の一番弟子ではありませんか。」
    竜は行者を見ると言った。
    竜「菩薩さま、これは私の敵です。昨日、腹が減って、確かにこの者の馬を食べました。少し力があるのを頼みに、私が力尽きて逃げ帰るまで戦い、また私が戸を閉めて出られなくなるほど罵ったのです。『取経』などという言葉は、一言も口にしませんでした。」
    行者「お前が俺の姓も名も聞かなかったから、言わなかったのだ。」
    竜「俺は、どこから来た無法な魔物だと聞いたではないか。お前は『どこから来たかなんぞどうでもいい、馬を返せ』と怒鳴った。『唐』の字ひとつでも言ったことがあるか。」
    観音菩薩「あの猿は自分の強さを頼みにするばかりで、ほかの者を称えようとはしません。これから先にも、帰順する者はまだいます。尋ねられたら、まず『取経』という言葉を出すのです。そうすれば、気をもむまでもなく、おのずと手を合わせて服従します。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "竜の発言は「昨日腹中饑餒」。前段から日が改まった叙述がないが、原文の「昨日」を保持し、「さっき」などへ整合させていない。"
- "id": "xy-ch15-018"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者歡喜領教。菩薩上前，把那小龍的項下明珠摘了，將楊柳枝蘸出甘露，往他身上拂了一拂，吹口仙氣，喝聲叫：「變！」那龍即變做他原來的馬匹毛片。又將言語吩咐道：「你須用心還了業障，功成後超越凡龍，還你個金身正果。」那小龍口啣著橫骨，心心領諾。菩薩教悟空領他去見三藏。「我回海上去也。」行者扯住菩薩不放道：「我不去了，我不去了。西方路這等崎嶇，保這個凡僧，幾時得到？似這等多磨多折，老孫的性命也難全，如何成得甚麼功果？我不去了，我不去了。」菩薩道：「你當年未成人道，且肯盡心修悟；你今日脫了天災，怎麼倒生懶惰？我門中以寂滅成真，須是要信心正果。假若到了那傷身苦磨之處，我許你叫天天應，叫地地靈；十分再到那難脫之際，我也親來救你。你過來，我再贈你一般本事。」菩薩將楊柳葉兒摘下三個，放在行者的腦後，喝聲：「變！」即變做三根救命的毫毛。教他：「若到那無濟無主的時節，可以隨機應變，救得你急苦之災。」行者聞了這許多好言，才謝了大慈大悲的菩薩。那菩薩香風繞繞，彩霧飄飄，徑轉普陀而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    行者は喜んで教えを受け入れた。観音菩薩は進み寄り、竜の首の下にある明珠を取り外した。楊柳の枝に甘露（かんろ）を浸し、その身をひと払いすると、仙気をひと息吹きかけ、喝を入れた。
    観音菩薩「変われ！」
    竜はたちまち、もとの馬と同じ姿、同じ毛並みへと変わった。観音菩薩はさらに言い聞かせた。
    観音菩薩「心を尽くして業障（ごうしょう）を償いなさい。功を成した後には、普通の竜を超え、金身（こんじん）を得て正しい悟りを成就させてあげましょう。」
    竜馬は口に横骨（おうこつ）を含んだまま、心の中でうなずいて承った。観音菩薩は行者に、竜馬を連れて三蔵に会うよう命じ、言った。
    観音菩薩「私は海へ帰ります。」
    行者は観音菩薩をつかまえ、放さずに言った。
    行者「俺は行かない、もう行かない。西方への道がこれほど険しくて、こんな凡人の僧を守っていたら、いつ着けるものか。これほどの苦しみや挫折が続くなら、この俺の命だって無事では済まない。どうして功を成し、悟りなど得られるんだ。行かない、俺は行かない！」
    観音菩薩「かつて、まだ人としての道も身につけていなかったお前は、それでも心を尽くして修行し、悟ろうとしていました。今日、天の災いから脱したというのに、どうして逆に怠け心を起こすのです。私たちの門では、寂滅（じゃくめつ）によって真実の境地を成就します。信じる心を持って、正しい悟りを目指さなければなりません。もし身を傷つけられ、苦しめられるところへ至ったなら、天を呼べば天が応じ、地を呼べば地が霊験を現すよう、私が約束しましょう。それでもどうしても逃れられぬときは、私自身も救いに参ります。こちらへ来なさい。もうひとつ、力を授けましょう。」
    観音菩薩は楊柳の葉を三枚摘み、行者の後頭部へ置いて喝を入れた。
    観音菩薩「変われ！」
    すると、三本の命を救う毛へと変わった。観音菩薩は教えた。
    観音菩薩「助けもなく、頼る者もないときには、これをその場に応じて変化させ、差し迫った苦難から身を救うのです。」
    これほどの温かい言葉を聞いて、行者はようやく大慈大悲の観音菩薩に礼を述べた。観音菩薩は香る風を巡らせ、彩りの霧をたなびかせて、まっすぐ普陀（ふだ）へ帰っていった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「横骨」は原語を保持した。動物が話せない原因となる骨という小説上の観念と読む解説がある一方、教育部《重編國語辭典修訂本》は当該用例を挙げ、馬の口に含ませる銜と説明する。直後に鞍轡がないと述べられるため、一方の解釈だけで確定せず、本文は「口に横骨を含んだまま、心の中で…」とした。https://dict.revised.moe.edu.tw/dictView.jsp?ID=82410&la=1&powerMode=0 ／ https://www.sohu.com/a/128045379_488605"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "馬になった竜の承諾は心中の反応であり、声の返事を加えない。観音の「我回海上去也」は直前の主語から観音の直接発言と判断した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三枚の楊柳の葉が後頭部で三本の救命の毛になる順序、天と地が応じる約束、観音自ら救いに来る約束を省略せず残した。"
- "id": "xy-ch15-019"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者才按落雲頭，揪著那龍馬的頂鬃，來見三藏道：「師父，馬有了也。」三藏一見，大喜道：「徒弟，這馬怎麼比前反肥盛了些？在何處尋著的？」行者道：「師父，你還做夢哩。卻才是金頭揭諦請了菩薩來，把那澗裡龍化作我們的白馬，其毛片相同，只是少了鞍轡。著老孫揪將來也。」三藏大驚道：「菩薩何在？待我去拜謝他。」行者道：「菩薩此時已到南海，不耐煩矣。」三藏就撮土焚香，望南禮拜。拜罷，起身即與行者收拾前進。行者喝退了山神、土地，吩咐了揭諦、功曹，卻請師父上馬。三藏道：「那無鞍轡的馬，怎生騎得？且待尋船渡過澗去，再作區處。」行者道：「這個師父好不知時務！這個曠野山中，船從何來？這匹馬，他在此久住，必知水勢，就騎著他做個船兒過去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    行者はようやく雲を降ろすと、竜馬の頭のたてがみをつかみ、三蔵のもとへ連れてきた。
    行者「お師匠さま、馬が手に入りました。」
    三蔵は見るなり、大喜びした。
    三蔵「弟子よ、この馬は、どうして前よりかえって肥えて立派になったのだろう。どこで見つけたのだ。」
    行者「お師匠さまは、まだ夢の中ですね。たった今、金頭掲諦が菩薩さまをお連れになり、谷川の竜を、私たちの白馬に変えてくださったのです。毛並みは同じですが、鞍と轡がないだけです。俺が引いてくるよう、言いつけられました。」
    三蔵は大いに驚いた。
    三蔵「菩薩さまはどちらに。私もお礼を申し上げに行こう。」
    行者「もう南海へお帰りです。いつまでも待ってはいられなかったのでしょう。」
    三蔵は土をひとつまみ取り、香を焚いて、南へ向かって礼拝した。拝み終えると立ち上がり、行者とともに旅支度を整えた。行者は山神と土地神に下がれと命じ、掲諦たちと功曹に言いつけをしてから、師に馬へ乗るよう促した。
    三蔵「鞍も轡もない馬に、どうして乗れよう。まずは船を捜して谷川を渡り、その後で考えよう。」
    行者「なんと物分かりの悪いお師匠さまだ！　こんな人里離れた山中に、どこから船が来るのです。この馬は長くここにいたのだから、きっと水の具合を知っています。乗って、船の代わりに渡ればよいのです。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「不耐煩矣」は行者の言葉として、菩薩が待ちかねて帰ったという含みで訳した。菩薩の内心を語り手が確認した事実にはしていない。「撮土焚香」は土を取って香を焚くという字面を残す。"
- "id": "xy-ch15-020"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏無奈，只得依言，跨了刬馬。行者挑著行囊。到了澗邊。只見那上流頭，有一個漁翁，撐著一個枯木的栰子，順流而下。行者見了，用手招呼道：「那老漁，你來，你來。我是東土取經去的，我師父到此難過，你來渡他一渡。」漁翁聞言，即忙撐攏。行者請師父下了馬，扶持左右。三藏上了栰子，揪上馬匹，安了行李。那老漁撐開栰子，如風似箭，不覺的過了鷹愁陡澗，上了西岸。三藏教行者解開包袱，取出大唐的幾文錢鈔，送與老漁。老漁把栰子一篙撐開道：「不要錢，不要錢。」向中流渺渺茫茫而去。三藏甚不過意，只管合掌稱謝。行者道：「師父休致意了，你不認得他？他是此澗裡的水神。不曾來接得我老孫，老孫還要打他哩。只如今免打就夠了他的，怎敢要錢！」那師父也似信不信，只得又跨著刬馬，隨著行者，徑投大路，奔西而去。這正是：廣大真如登彼岸，誠心了性上靈山。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    三蔵は仕方なく、その言葉に従って裸馬にまたがり、行者は旅の荷を担いだ。谷川のほとりへ来ると、上流に一人の漁師の老人が現れ、枯れ木の筏を竿で操りながら流れ下ってきた。行者は手を振って呼びかけた。
    行者「そこの漁師の爺さん、来てくれ、来てくれ。俺たちは東土から経を取りに行く者だ。お師匠さまがここを渡れないから、渡してやってくれ。」
    漁師の老人は聞くなり、急いで筏を寄せた。行者は師を馬から下ろし、左右から手を添えた。三蔵が筏に乗ると、馬を引き上げ、荷物も積んだ。漁師の老人が筏を押し出すと、風のように、矢のように進み、たちまち鷹愁陡澗を渡り、西岸へ着いた。
    三蔵は行者に包みを解かせ、大唐（だいとう）の銭を幾文か取り出して、漁師の老人へ渡そうとした。老人はひと竿で筏を岸から離し、言った。
    漁師の老人「お金はいりません、お金はいりません。」
    そうして流れの中ほどへと、かすかに遠ざかっていった。三蔵はたいそう恐縮し、しきりに合掌して礼を述べた。
    行者「お師匠さま、そんなに気を遣わなくて結構です。あいつが誰か、ご存じありませんか。ここの谷川の水神です。この俺を迎えに来なかったので、俺は打ってやろうと思っていたところです。打たれずに済むだけで十分なのに、どうして銭など受け取れるものですか。」
    三蔵は半ば信じ、半ば疑いながらも、また裸馬にまたがり、行者について街道へ出て、西を目指した。まさに、こういうことである。
    広大な真如（しんにょ）によって彼岸（ひがん）へ登り、誠の心で本性を悟って霊山へ上る。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "漁師の正体を水神だとするのは行者の説明であり、三蔵が半信半疑であることを残した。裸馬は鞍のない馬。「廣大真如登彼岸」は渡河と悟りの二重性を保つ。"
- "id": "xy-ch15-021"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "同師前進，不覺的紅日沉西，天光漸晚。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 153
    "line_end": 153
  "translation_ja": "師とともに進んでいくうちに、いつしか赤い太陽は西に沈み、空は次第に暮れてきた。見れば、こんな景色であった。"
  "translation_status": "reviewed"
- "id": "xy-ch15-022"
  "section_id": "chapter-15"
  "kind": "verse"
  "origin": "source"
  "source_text": "淡雲撩亂，山月昏蒙。滿天霜色生寒，四面風聲透體。孤鳥去時蒼渚闊，落霞明處遠山低。疏林千樹吼，空嶺獨猿啼。長途不見行人跡，萬里歸舟入夜時。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    薄雲は入り乱れ、山にかかる月はおぼろ。
    空いっぱいの霜の色が寒さを生み、四方の風音が身に染みる。
    一羽の鳥が去ると青い洲は広く、夕焼けの明るいところに遠山が低い。
    まばらな林の千の木がうなり、人気のない峰で一匹の猿が鳴く。
    長い道には旅人の影も見えず、万里を帰る舟に夜が訪れる。
  "translation_status": "reviewed"
- "id": "xy-ch15-023"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏在馬上遙觀，忽見路傍一座莊院。三藏道：「悟空，前面人家，可以借宿，明早再行。」行者擡頭看見道：「師父，不是人家莊院。」三藏道：「如何不是？」行者道：「人家莊院，卻沒飛魚穩獸之脊，這斷是個廟宇庵院。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    三蔵が馬上から遠くを見渡すと、ふと道端に一軒の屋敷が見えた。
    三蔵「悟空、あちらの家で宿を借りよう。続きは明日の朝にしよう。」
    行者は顔を上げて見た。
    行者「お師匠さま、あれは人家の屋敷ではありません。」
    三蔵「どうして人家ではないのだ。」
    行者「人家の棟には飛魚（ひぎょ）や穏獣（おんじゅう）の飾りはつきません。あれはきっと、廟か庵の類いです。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "飛魚・穏獣はこの文脈では屋根の棟の飾り。水中の魚や実在の動物が棟にいる意味にしない。具体的な建築部位と形状の細部は留保する。"
- "id": "xy-ch15-024"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們說著話，早已到了門首。三藏下了馬，只見那門上有三個大字，乃「里社祠」，遂入門裡。那裡邊有一個老者，項掛著數珠兒，合掌來迎，叫聲：「師父請坐。」三藏慌忙答禮，上殿去參拜了聖像。那老者即呼童子獻茶。茶罷，三藏問老者道：「此廟何為『里社』？」老者道：「敝處乃西番哈咇國界。這廟後有一莊人家，共發虔心，立此廟宇。里者，乃一鄉里地；社者，乃一社土神。每遇春耕、夏耘、秋收、冬藏之日，各辦三牲花果，來此祭社，以保四時清吉、五穀豐登、六畜茂盛故也。」三藏聞言，點頭誇讚：「正是『離家三里遠，別是一鄉風』。我那裡人家，更無此善。」老者卻問：「師父仙鄉是何處？」三藏道：「貧僧是東土大唐國，奉旨意，上西天拜佛求經的。路過寶坊，天色將晚，特投聖祠，告宿一宵，天光即行。」那老者十分歡喜，道了幾聲「失迎」，又叫童子辦飯。三藏吃畢，謝了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    師弟は話すうちに、もう門前へ着いていた。三蔵が馬を下りると、門には大きく「里社祠（りしゃし）」の三字が掲げられていたので、中へ入った。そこには首に数珠を掛けた老人がいて、合掌しながら迎え、声をかけた。
    老人「お坊さま、どうぞお座りください。」
    三蔵は慌てて礼を返し、殿へ上がって神像を拝んだ。老人は童子を呼んで茶を出させた。茶を飲み終えると、三蔵は尋ねた。
    三蔵「この廟を、なぜ『里社（りしゃ）』と申すのですか。」
    老人「ここは西番（せいばん）の哈咇国（はひつこく）の領内です。この廟の裏に村がひとつあり、村人がそろって敬虔な心を起こし、この廟を建てたのです。里とは、ひとつの郷里の土地をいい、社とは、ひとつの地域の土地神をいいます。春の耕作、夏の草取り、秋の収穫、冬の貯蔵の折には、それぞれ三牲（さんせい）や花や果物を用意して、ここへ社を祭りに来ます。四季を通じて清らかで吉祥であり、五穀は豊かに実り、六畜（りくちく）はよく育つよう願うのです。」
    三蔵は聞いてうなずき、褒めた。
    三蔵「まさしく『家から三里も離れれば、別の土地の風習になる』ですね。私の郷里の人々には、このような善い習いはございません。」
    今度は老人が尋ねた。
    老人「お坊さまは、どちらのご出身ですか。」
    三蔵「僧の私は、東土の大唐国（だいとうこく）から参りました。勅命を奉じ、西天へ仏を拝み、経を求めに行く者です。こちらを通りかかったところ、日が暮れそうでしたので、この尊い祠を訪ね、一晩の宿をお願いに上がりました。夜が明けましたら、すぐ出立いたします。」
    老人はたいそう喜び、何度も挨拶を述べた。
    老人「お出迎えもいたしませんで。」
    そして童子を呼んで食事を用意させた。三蔵は食べ終えると、礼を述べた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「哈咇國」は底本の固有名を「哈咇国」として保持し、別字・実在の国へ無断置換しない。老人の里・社の字義説明、四季の農作業、三牲・五穀・六畜を残す。"
- "id": "xy-ch15-025"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者的眼乖，見他房簷下有一條搭衣的繩子，走將去，一把扯斷，將馬腳繫住。那老者笑道：「這馬是那裡偷來的？」行者怒道：「你那老頭子，說話不知高低。我們是拜佛的聖僧，又會偷馬？」老兒笑道：「不是偷的，如何沒有鞍轡韁繩，卻來扯斷我晒衣的索子？」三藏陪禮道：「這個頑皮，只是性燥。 ──你要拴馬，好生問老人家討條繩子，如何就扯斷他的衣索？──老先生，休怪，休怪。我這馬，實不瞞你說，不是偷的。昨日東來，至鷹愁陡澗，原有騎的一匹白馬，鞍轡俱全。不期那澗裡有條孽龍，在彼成精，他把我的馬連鞍轡一口吞之。幸虧我徒弟有些本事，又感得觀音菩薩來澗邊擒住那龍，教他就變做我原騎的白馬，毛片俱同，馱我上西天拜佛。今此過澗，未經一日，卻到了老先的聖祠，還不曾置得鞍轡哩。」那老者道：「師父休怪，我老漢作笑耍子，誰知你高徒認真。我小時也有幾個村錢，也好騎匹駿馬。只因累歲迍邅，遭喪失火，到此沒了下梢，故充為廟祝，侍奉香火。幸虧這後莊施主家募化度日。我那裡倒還有一副鞍轡，是我平日心愛之物，就是這等貧窮，也不曾捨得賣了。才聽老師父之言，菩薩尚且救護神龍，教他化馬馱你，我老漢卻不能少有周濟。明日將那鞍轡取來，願送老師父，扣背前去，乞為笑納。」三藏聞言，稱謝不盡。早又見童子拿出晚齋。齋罷，掌上燈，安了鋪，各各寢歇。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    行者は目ざとく、軒下に一本の物干し縄があるのを見つけた。歩み寄るなり、ひとつかみで引きちぎって、馬の脚をつないだ。老人は笑って尋ねた。
    老人「その馬は、どこで盗んできたのですか。」
    行者は怒った。
    行者「この爺さんは、物の言い方も分からんのか。俺たちは仏を拝みに行く聖なる僧だ。馬を盗んだりするものか。」
    老人は笑った。
    老人「盗んだのではないなら、どうして鞍も轡も手綱もなく、私の物干し縄をちぎるのですか。」
    三蔵は詫びて言った。
    三蔵「このやんちゃ者は、ただ気が短いのでございます。お前も、馬をつなぎたければ、きちんとご老人に縄を一本お願いすればよいのに、どうして物干し縄をちぎったりするのだ。ご老人、どうかお怒りにならないでください。包み隠さず申し上げますが、この馬は盗んだのではございません。昨日、東から参りまして、鷹愁陡澗に着きましたとき、もとは鞍も轡もそろった白馬に乗っておりました。ところが、その谷川には妖怪となった悪竜がおり、馬を鞍も轡もろとも、ひと口で呑み込んでしまったのです。幸い、弟子にいくらか力があり、また観音菩薩のお慈悲をいただいて、谷川へおいでいただき、竜を捕らえて、私のもとの白馬と同じ毛並みの馬に変え、私を乗せて西天へ仏を拝みに行かせることになりました。こうして谷川を渡ってから、まだ一日もたたぬうちに、こちらの尊い祠へ着きましたので、鞍と轡をそろえていないのでございます。」
    老人「お坊さま、お気を悪くなさらないでください。私は冗談を言っただけなのに、お弟子さんが本気になさるとは思いませんでした。私も若いころは多少の小銭があり、よい馬に乗るのが好きでした。ところが年々不運が続き、身内の不幸や火事に遭って、とうとう暮らしも立たなくなったので、廟祝（びょうしゅく）となって香火を守っております。幸い、裏の村の施主の方々に施しを求めて、日々を過ごしております。それでも私のところには、鞍と轡がひとそろい残っています。日ごろから大切にしていた品で、これほど貧しくなっても、惜しくて売れませんでした。いまのお坊さまのお話では、菩薩さまさえ神竜を救い、馬に変えてあなたを乗せてくださるのですから、私も少しばかりのお力添えをしないわけには参りません。明日、その鞍と轡を持って参り、お坊さまに差し上げましょう。馬につけてお進みください。どうか、笑ってお納めください。」
    三蔵は聞くと、礼をいくら述べても足りなかった。やがて童子が夕べの精進料理を運んできた。食事が済むと灯をともして寝床を整え、それぞれ休んだ。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三蔵の「昨日東來」と「今此過澗，未經一日」は底本どおり「昨日」「まだ一日もたたぬ」とする。初めの飯と後の晩斎も別に出るため、重複として削除しない。三蔵が老人への謝罪の途中で行者に向き直って叱る構造を保つ。"
- "id": "xy-ch15-026"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "至次早，行者起來道：「師父，那廟祝老兒昨晚許我們鞍轡，問他要，不要饒他。」說未了，只見那老兒果擎著一副鞍轡、襯屜、韁籠之類，凡馬上一切用的，無不全備，放在廊下道：「師父，鞍轡奉上。」三藏見了，歡喜領受。教行者拿了，背上馬看，可相稱否。行者走上前，一件件的取起看了，果然是些好物。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    翌朝、起きた行者が言った。
    行者「お師匠さま、あの廟祝の爺さんは、昨夜、鞍と轡をくれると約束しました。催促して、逃がさないようにしましょう。」
    言い終わらぬうちに、老人は本当に、鞍、轡、鞍下の敷物、手綱や頭絡の類いをひとそろい抱えてきた。馬に使うものは、何ひとつ欠けていなかった。それらを廊下に置いて、老人は言った。
    老人「お坊さま、鞍と轡をお納めください。」
    三蔵は喜んで受け取り、行者に、馬につけて合うかどうか見てみるよう言いつけた。行者が前へ進み、一つずつ手に取って見ると、どれも確かによい品だった。その証として、詩がある。
    詩にいう。
  "translation_status": "reviewed"
- "id": "xy-ch15-027"
  "section_id": "chapter-15"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    雕鞍彩晃柬銀星，寶鐙光飛金線明。
    襯屜幾層絨苫疊，牽韁三股紫絲繩。
    轡頭皮劄團花粲，雲扇描金舞獸形。
    環嚼叩成磨煉鐵，兩垂蘸水結毛纓。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 162
    "line_end": 165
  "translation_ja": |-
    彫り飾る鞍は色鮮やかに輝き、銀の星を選び散らしたかのよう。宝の鐙は光を放ち、金の筋も明らか。
    鞍下の敷物には毛織りの覆いを幾重にも重ね、引く手綱は三つ撚りの紫の絹縄。
    轡の革紐には丸い花の模様がきらめき、雲扇（うんせん）には金泥で獣の舞う姿を描く。
    輪と銜は鍛え磨いた鉄を打って作り、毛の房を結び、左右に垂れて水に浸る。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "初句の「柬銀星」は未詳。柬の「選ぶ」という字義を踏まえ、銀の星を選び散らしたかのような輝きとして暫定的に訳した。嵌・揀などへの原文補訂はしていない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「雲扇」は馬具の装飾として名称を保持し、構造を確定しない。「兩垂蘸水結毛纓」は左右に垂れる毛の房が水に浸るという字面で訳す。特定の部材名「水垂れ」等を創作しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "雕鞍・宝鐙・襯屜・三股の紫絹の手綱・轡頭・雲扇・環嚼・毛纓を順に訳し、一覧を「馬具一式」で済ませない。"
- "id": "xy-ch15-028"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者心中暗喜，將鞍轡背在馬上，就似量著做的一般。三藏拜謝那老，那老慌忙攙起道：「惶恐，惶恐。何勞致謝？」那老者也不再留，請三藏上馬。那長老出得門來，攀鞍上馬。行者擔著行李。那老兒復袖中取出一條鞭兒來，卻是皮丁兒寸劄的香籐柄子，虎筋絲穿結的梢兒，在路傍拱手奉上道：「聖僧，我還有一條挽手兒，一發送了你罷。」那三藏在馬上接了道：「多承布施，多承布施。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    行者は心の中で喜び、鞍と轡を馬につけた。まるで寸法を測って作ったかのように、ぴたりと合った。三蔵が老人を拝んで礼を述べると、老人は慌てて助け起こした。
    老人「恐れ入ります、恐れ入ります。どうしてそのように、お礼をなさるのですか。」
    老人はもう引き留めず、三蔵に馬へ乗るよう促した。三蔵は門を出て、鞍につかまって馬に乗り、行者は荷物を担いだ。すると老人は、また袖の中から一本の鞭を取り出した。香りのよい籐の柄には、一寸ごとに小さな革片を巻き留め、先には虎の筋を糸にして通し結んであった。老人は道端で拱手（きょうしゅ）の礼をして差し出した。
    老人「聖僧、手にお持ちになる鞭も一本ございます。これも一緒に差し上げましょう。」
    三蔵は馬上から受け取って言った。
    三蔵「重ね重ねのお施し、まことにありがとうございます。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「拱手」は胸前で両手を組み合わせる礼で、合掌とは区別する。鞭の香籐の柄、革片の巻き留め、虎の筋の糸で結んだ先端を残した。"
- "id": "xy-ch15-029"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正打問訊，卻早不見了那老兒。及回看那里社祠，是一片光地。只聽得半空中有人言語道：「聖僧，多簡慢你。我是落伽山山神、土地，蒙菩薩差送鞍轡與汝等的。汝等可努力西行，卻莫一時怠慢。」慌得個三藏滾鞍下馬，望空禮拜道：「弟子肉眼凡胎，不識尊神尊面，望乞恕罪。煩轉達菩薩，深蒙恩佑。」你看他只管朝天磕頭，也不計其數。路傍邊活活的笑倒個孫大聖，孜孜的喜壞個美猴王，上前來扯住唐僧道：「師父，你起來罷，他已去得遠了，聽不見你禱祝，看不見你磕頭，只管拜怎的？」長老道：「徒弟呀，我這等磕頭，你也就不拜他一拜，且立在傍邊，只管哂笑，是何道理？」行者道：「你那裡知道，像他這個藏頭露尾的，本該打他一頓；只為看菩薩面上，饒他打，儘夠了，他還敢受我老孫之拜？老孫自小兒做好漢，不曉得拜人，就是見了玉皇大帝、太上老君，我也只是唱個喏便罷了。」三藏道：「不當人子，莫說這空頭話。快起來，莫誤了走路。」那師父才起來收拾，投西而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"

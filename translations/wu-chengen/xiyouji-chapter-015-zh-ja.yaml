    "message_ja": "空中の名乗りは「我是落伽山山神、土地」と単数の自称に二つの神名が続く。ラベルを「落伽山の山神・土地神の声」とし、「私は」という底本の自称を保持する。老人が山神、童子が土地神などの対応は原文に明記されないため補わない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "語り手の「孫大聖／美猴王」は同じ人物についての対句として保持する。「孜孜的喜壞」は強い喜びであって、踊る動作を創作しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "末尾の「快起來」は三蔵が行者へ言う発言に含まれる一方、その後で立ち上がるのは三蔵と書かれる。発話者を無断変更せず、訳でも「さあ立って」として食い違いを残す。"
- "id": "xy-ch15-030"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此去行有兩個月太平之路，相遇的都是些羅羅、回回、狼蟲虎豹。光陰迅速，又值早春時候。但見山林錦翠色，草木發青芽；梅英落盡，柳眼初開。師徒們行玩春光，又見太陽西墜。三藏勒馬遙觀，山凹裡有樓臺影影，殿閣沉沉。三藏道：「悟空，你看那裡是甚麼去處？」行者擡頭看了道：「不是殿宇，定是寺院。我們趕起些，那裡借宿去。」三藏欣然從之，放開龍馬，徑奔前來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    それから二か月、道中は平穏で、出会うのは羅羅（らら）や回回（かいかい）の人々、また狼や虎や豹といった獣ばかりだった。月日は速く過ぎ、また早春となった。見れば山の林は翠の錦をまとい、草木は青い芽を吹き、梅の花はすっかり散って、柳の芽がようやく開いている。
    師弟が春の景色を楽しみながら進んでいると、また太陽が西へ傾いた。三蔵が馬を止めて遠くを見ると、山あいに楼台がかすみ、殿閣が奥深く重なっていた。
    三蔵「悟空、あそこはどんな所だろう。」
    行者は顔を上げて見た。
    行者「御殿でなければ、きっと寺でしょう。少し急いで、あそこで宿を借りましょう。」
    三蔵は喜んで従い、竜馬の手綱を緩め、まっすぐそこへ駆けていった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「羅羅」「回回」は原文の歴史的呼称を保持した。現代の自称や正確な民族分類だと保証しない。直後の狼・虎・豹との列挙は人々と獣の区別を明記し、二か月の平穏な旅路と早春への推移を省略しない。"
- "id": "xy-ch15-031"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去是甚麼去處，且聽下回分解。"
  "source_languages":

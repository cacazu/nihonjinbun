- "id": "xy-ch15-004"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒兩個正然看處，只見那澗當中響一聲，鑽出一條龍來，推波掀浪，攛出崖山，就搶長老。慌得個行者丟了行李，把師父抱下馬來，回頭便走。那條龍就趕不上，把他的白馬連鞍轡一口吞下肚去，依然伏水潛蹤。行者把師父送在那高阜上坐了，卻來牽馬挑擔，止存得一擔行李，不見了馬匹。他將行李擔送到師父面前道：「師父，那孽龍也不見蹤影，只是驚走我的馬了。」三藏道：「徒弟啊，卻怎生尋得馬著麼？」行者道：「放心，放心，等我去看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    師弟が眺めていると、谷川の中でひと声響き、一匹の竜が飛び出した。波を押し立て、うねりを巻き上げ、崖へ躍り出るなり三蔵に襲いかかった。行者は慌てて荷物を放り出し、師を馬から抱き下ろすと、振り向いて走り去った。竜は追いつけず、白馬を鞍も轡もろともひと口で腹へ呑み込み、また水中に伏せて姿を隠した。
    行者は師を高い丘へ運んで座らせ、馬を引き、荷物を担ごうと戻った。ところが、あるのは一荷の荷物だけで、馬は見当たらない。荷物を担いで師の前へ運んだ行者は言った。
    行者「お師匠さま、あの悪竜の姿もありません。ただ、あいつに驚いて馬が逃げてしまいました。」
    三蔵「弟子よ、どうすれば馬を見つけられるだろう。」
    行者「ご安心を、ご安心を。私が見てきます。」
  "translation_status": "reviewed"
- "id": "xy-ch15-005"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他打個唿哨，跳在空中，火眼金睛，用手搭涼篷，四下裡觀看，更不見馬的蹤跡。按落雲頭，報道：「師父，我們的馬斷乎是那龍吃了，四下裡再看不見。」三藏道：「徒弟呀，那廝能有多大口，卻將那匹大馬連鞍轡都吃了？想是驚張溜韁，走在那山凹之中。你再仔細看看。」行者道：「你也不知我的本事。我這雙眼，白日裡常看一千里路的吉凶。像那千里之內，蜻蜓兒展翅，我也看見，何期那匹大馬，我就不見？」三藏道：「既是他吃了，我如何前進？可憐啊，這千山萬水，怎生走得？」說著話，淚如雨落。行者見他哭將起來，他那裡忍得住暴燥，發聲喊道：「師父莫要這等膿包形麼，你坐著，坐著，等老孫去尋著那廝，教他還我馬匹便了。」三藏卻才扯住道：「徒弟啊，你那裡去尋他？只怕他暗地裡攛將出來，卻不又連我都害了？那時節人馬兩亡，怎生是好？」行者聞得這話，越加嗔怒，就叫喊如雷道：「你忒不濟，不濟！又要馬騎，又不放我去，似這般看著行李，坐到老罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    行者は口笛を吹いて空へ跳び上がり、火眼金睛（かがんきんせい）を見開き、手をひさしにして四方を見渡したが、馬の影はどこにもなかった。雲を降ろして戻ると、行者は報告した。
    行者「お師匠さま、馬はきっとあの竜に食われたのです。どちらを見ても、まったく見えません。」
    三蔵「弟子よ、あいつにそれほど大きな口があって、あの大きな馬を鞍も轡も一緒に食べられるものかね。驚いて手綱を振りほどき、山あいへ走り込んだのではないか。もう一度よく見ておくれ。」
    行者「お師匠さまは、まだ私の力をご存じありません。この両眼なら、昼間はいつでも千里の先にある吉凶を見通せます。千里以内なら、トンボが羽を広げるのまで見えるのです。あんな大きな馬を、どうして見落としましょう。」
    三蔵「本当に食べられたのなら、私はどうして先へ進めばよいのだ。ああ、困った。この千山万水を、どうやって越えられよう。」
    そう言いながら、涙を雨のように落とした。泣き始めた師を見て、行者は短気を抑えられず、声を張り上げた。
    行者「お師匠さま、そんな意気地なしの真似はよしてください。座って、座っていてください。この俺があいつを捜し出して、馬を返させれば済むことです。」
    三蔵は行者をつかまえて言った。
    三蔵「弟子よ、どこへ捜しに行くのだ。あいつが陰から飛び出して、今度は私まで襲ったらどうする。人も馬も失われてしまったら、どうしようもないではないか。」
    これを聞くと、行者はますます怒り、雷のような声で怒鳴った。
    行者「なんて頼りない、まったく頼りない！　馬には乗りたい、そのくせ俺を行かせもしない。そんなことなら、荷物の番をしながら、年を取るまで座っていればいい！」
  "translation_status": "reviewed"
- "id": "xy-ch15-006"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哏哏的吆喝，正難息怒，只聽得空中有人言語，叫道：「孫大聖莫惱，唐御弟休哭。我等是觀音菩薩差來的一路神祗，特來暗中保取經者。」那長老聞言，慌忙禮拜。行者道：「你等是那幾個，可報名來，我好點卯。」眾神道：「我等是六丁六甲、五方揭諦、四值功曹、一十八位護教伽藍，各各輪流值日聽候。」行者道：「今日先從誰起？」眾揭諦道：「丁甲、功曹、伽藍輪次。我五方揭諦，惟金頭揭諦晝夜不離左右。」行者道：「既如此，不當值者且退，留下六丁神將與日值功曹和眾揭諦保守著我師父。等老孫尋那澗中的孽龍，教他還我馬來。」眾神遵令。三藏才放下心，坐在石崖之上，吩咐行者仔細。行者道：「只管寬心。」好猴王，束一束綿布直裰，撩起虎皮裙子，揝著金箍鐵棒，抖擻精神，徑臨澗壑，半雲半霧的，在那水面上高叫道：「潑泥鰍，還我馬來！還我馬來！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    行者は鼻を鳴らして怒鳴り、まだ怒りを鎮められずにいた。そのとき、空中から声がした。
    護法の神々「孫大聖（そんたいせい）、お怒りをお鎮めください。唐御弟（とうぎょてい）、お泣きなさいますな。私どもは観音菩薩（かんのんぼさつ）から遣わされた道中の神々で、取経の方をひそかにお守りするために参りました。」
    三蔵はその言葉を聞き、慌てて礼拝した。
    行者「お前たちはどの神だ。名を告げろ。点呼を取ってやろう。」
    護法の神々「私どもは六丁六甲（ろくていろっこう）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、十八柱の護教伽藍（ごきょうがらん）でございます。それぞれ交替で日直を務め、ご用を待っております。」
    行者「今日の最初の当番は誰だ。」
    五方掲諦「丁甲（ていこう）、功曹（こうそう）、伽藍（がらん）は交替いたします。私ども五方掲諦のうち、金頭掲諦（きんとうぎゃてい）だけは、昼夜を通じておそばを離れません。」
    行者「そういうことなら、当番でない者は下がれ。六丁神将（ろくていしんしょう）と日直の功曹、それに掲諦（ぎゃてい）たちは残って、お師匠さまを守っていろ。この俺が谷川の悪竜を捜して、馬を返させてくる。」
    神々は命令に従った。三蔵はようやく安心して崖の石の上に座り、行者に気をつけるよう言いつけた。
    行者「どうぞ、ご安心を。」
    見よ、この猿の王は木綿の直裰（ちょくたつ）を締め直し、虎皮の腰巻きをたくし上げ、如意金箍棒（にょいきんこぼう）を握った。気を奮い立たせて谷へまっすぐ向かい、雲とも霧ともつかぬものに半ば身を包み、水面の上で大声を上げた。
    行者「ろくでなしのドジョウめ、馬を返せ！　馬を返せ！」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "護法の神々の合同発言と五方掲諦の発言を区別した。六丁六甲・五方掲諦・四値功曹・十八柱の護教伽藍、および当番の指示をすべて保持した。「金箍鐵棒」は作品の既定呼称に従い、訳文では如意金箍棒とする。"
- "id": "xy-ch15-007"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那龍吃了三藏的白馬，伏在那澗底中間，潛靈養性，只聽得有人叫罵索馬。他按不住心中火發，急縱身躍浪翻波，跳將上來道：「是那個敢在這裡海口傷吾？」行者見了他，大咤一聲「休走，還我馬來！」掄著棍，劈頭就打。那條龍張牙舞爪來抓。他兩個在澗邊前這一場賭鬥，果是驍雄。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    さて、三蔵の白馬を食った竜は、谷川の底に伏せ、精神をひそめて本性を養っていたが、誰かが罵りながら馬を返せと叫ぶのが聞こえた。胸に燃え立つ怒りを抑えられず、たちまち身を躍らせて波を返し、うねりを越えて飛び出した。
    竜「ここで大口をたたき、俺を侮辱するのは誰だ！」
    行者は竜を見ると、ひと声怒鳴った。
    行者「逃げるな、馬を返せ！」
    棒を振り回し、頭をめがけて打ち下ろした。竜も牙をむき、爪を振り立ててつかみかかる。谷川のほとりで両者が繰り広げた一戦は、まことに勇猛な者同士の戦いであった。その有様はこうである。
  "translation_status": "reviewed"
- "id": "xy-ch15-008"
  "section_id": "chapter-15"
  "kind": "verse"
  "origin": "source"
  "source_text": "龍舒利爪，猴舉金箍。那個鬚垂白玉線，這個眼幌赤金燈。那個鬚下明珠噴彩霧，這個手中鐵棒舞狂風。那個是迷爺娘的業子，這個是欺天將的妖精。他兩個都因有難遭磨折，今要成功各顯能。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    竜は鋭い爪を伸ばし、猿は金の輪の棒を振り上げる。
    かたや白玉の糸のようなひげを垂らし、こなたは赤金の灯のように目を輝かせる。
    かたやひげの下の明珠が彩りの霧を噴き、こなたは手中の鉄棒が荒れ狂う風を舞わせる。
    かたや父母を惑わせた罪深い子、こなたは天将を欺いた妖怪。
    どちらも災難に遭って苦難を受け、今こそ功を成そうと、それぞれ力を現す。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「迷爺娘的業子」は父母を惑わせる罪深い子と解した。後続の天将を欺く妖怪との対句を残し、ここに父母への具体的行為を追加していない。"
- "id": "xy-ch15-009"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "來來往往，戰夠多時，盤旋良久，那條龍力軟筋麻，不能抵敵，打一個轉身，又攛於水內，深潛澗底，再不出頭。被猴王罵詈不絕，他也只推耳聾。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 134
    "line_end": 134
  "translation_ja": "行きつ戻りつ、長いこと戦い、幾度も渡り合ううち、竜は力が衰え、筋がしびれて、もはや敵わなくなった。くるりと身を翻すと、再び水へ飛び込み、谷川の底深く潜って、二度と顔を出さなかった。行者が絶えず罵っても、耳が聞こえぬふりをするばかりだった。"
  "translation_status": "reviewed"
- "id": "xy-ch15-010"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者沒及奈何，只得回見三藏道：「師父，這個怪被老孫罵將出來，他與我賭鬥多時，怯戰而走，只躲在水中間，再不出來了。」三藏道：「不知端的可是他吃了我馬？」行者道：「你看你說的話，不是他吃了，他還肯出來招聲，與老孫犯對？」三藏道：「你前日打虎時，曾說有降龍伏虎的手段，今日如何便不能降他？」原來那猴子吃不得人急他。見三藏搶白了他這一句，他就發起神威道：「不要說，不要說，等我與他再見個上下。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    行者はどうしようもなく、三蔵のもとへ戻って告げた。
    行者「お師匠さま、あの化け物を俺が罵って引っ張り出し、しばらく戦ったのですが、怖じ気づいて逃げてしまいました。水の中に隠れたきり、もう出てきません。」
    三蔵「それで、本当にあいつが私の馬を食べたのだろうか。」
    行者「何をおっしゃるのです。食べていなければ、わざわざ出てきて応じ、この俺と敵対するものですか。」
    三蔵「先日、虎を退治したときには、竜を降し虎を伏せる腕があると言っていたね。それなら、今日はどうしてあの竜を降せないのだ。」
    もともと行者は、人に煽られると黙っていられない。三蔵のこの一言にやり込められると、神威を奮い起こして言った。
    行者「もう言わないでください、もう言わないで。あいつと、もう一度決着をつけてきます。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「吃不得人急他」は単に急がされることではなく、相手に煽られると黙っていられない性質を述べる。独立レビューの指摘を受けて訳語を修正した。"
- "id": "xy-ch15-011"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這猴王拽開步，跳到澗邊，使出那翻江攪海的神通，把一條鷹愁陡澗徹底澄清的水，攪得似那九曲黃河泛漲的波。那孽龍在於深澗中坐臥不寧，心中思想道：「這才是福無雙降，禍不單行。我才脫了天條死難，不上一年，在此隨緣度日，又撞著這般個潑魔，他來害我。」你看他越思越惱，受不得屈氣，咬著牙，跳將出去，罵道：「你是那裡來的潑魔，這等欺我？」行者道：「你莫管我那裡不那裡，你只還了馬，我就饒你性命。」那龍道：「你的馬是我吞下肚去，如何吐得出來？不還你，便待怎的？」行者道「不還馬時看棍，只打殺你，償了我馬的性命便罷。」他兩個又在那山崖下苦鬥。鬥不數合，小龍委實難搪，將身一幌，變作一條水蛇兒，鑽入草科中去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    行者は大股に進み、谷川のほとりへ跳び下りた。そして川を翻し海をかき混ぜる神通力を使い、底まですっかり澄んでいた鷹愁陡澗（ようしゅうとうかん）の水を、九曲する黄河（こうが）があふれたときの波のようにかき濁した。深い谷川の中で、竜は座っても寝ても落ち着かず、心の中で考えた。
    竜の心の声「まさに、福は重なって来ず、禍はひとりでは来ないというものだ。天の掟による死罪をようやく免れ、ここで成り行きに任せて暮らし始めて、まだ一年にもならない。それなのに、こんな無法な魔物に出会って、苦しめられるとは。」
    考えるほど腹が立ち、悔しさをこらえきれなくなった竜は、歯を食いしばって飛び出し、罵った。
    竜「どこから来た無法な魔物だ。よくも、これほど俺をいじめてくれたな！」
    行者「俺がどこから来たかなんぞ、どうでもいい。馬さえ返せば、命は助けてやる。」
    竜「お前の馬は腹の中へ呑み込んだ。どうして吐き出せるものか。返さなかったら、どうするつもりだ。」
    行者「返さぬなら、この棒を食らえ。お前を打ち殺して、馬の命を償わせるまでだ。」
    両者はまた崖の下で激しく戦った。だが数合も交えぬうちに、若い竜はどうにも受け止めきれなくなった。身を一揺すりすると、小さな水蛇に変わって、草むらへ潜り込んだ。
  "translation_status": "reviewed"
- "id": "xy-ch15-012"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "猴王拿著棍，趕上前來，撥草尋蛇，那裡得些影響。急得他三尸神咋，七竅煙生，念了一聲「唵」字咒語，即喚出當坊土地、本處山神，一齊來跪下道：「山神、土地來見。」行者道：「伸過孤拐來，各打五棍見面，與老孫散散心。」二神叩頭哀告道：「望大聖方便，容小神訴告。」行者道：「你說甚麼？」二神道：「大聖一向久困，小神不知幾時出來，所以不曾接得，萬望恕罪。」行者道：「既如此，我且不打你。我問你：鷹愁澗裡，是那方來的怪龍？他怎麼搶了我師父的白馬吃了？」二神道：「大聖自來不曾有師父，原來是個不伏天不伏地混元上真，如何得有甚麼師父的馬來？」行者道：「你等是也不知。我只為那誑上的勾當，整受了這五百年的苦難。今蒙觀音菩薩勸善，著唐朝駕下真僧救出我來，教我跟他做徒弟，往西天去拜佛求經。因路過此處，失了我師父的白馬。」二神道：「原來是如此。這澗中自來無邪，只是深陡寬闊，水光徹底澄清，鴉鵲不敢飛過；因水清照見自己的形影，便認做同群之鳥，往往身擲於水內：故名『鷹愁陡澗』。只是向年間，觀音菩薩因為尋訪取經人去，救了一條玉龍，送他在此，教他等候那取經人，不許為非作歹。他只是饑了時，上岸來撲些鳥鵲吃，或是捉些獐鹿食用。不知他怎麼無知，今日衝撞了大聖。」行者道：「先一次，他還與老孫侮手，盤旋了幾合；後一次，是老孫叫罵，他再不出。因此使了一個翻江攪海的法兒，攪混了他澗水，他就攛將上來，還要爭持。不知老孫的棍重，他遮架不住，就變做一條水蛇，鑽在草裡。我趕來尋他，卻無蹤跡。」土地道：「大聖不知。這條澗千萬個孔竅相通，故此這波瀾深遠。想是此間也有一孔，他鑽將下去。也不須大聖發怒，在此找尋；要擒此物，只消請將觀世音來，自然伏了。」"

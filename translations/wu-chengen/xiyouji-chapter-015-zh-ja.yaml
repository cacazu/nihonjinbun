    蛇盤山では諸神がひそかに守り、鷹愁澗では意馬が手綱に服す
  "translation_status": "reviewed"
- "id": "xy-ch15-002"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者伏侍唐僧西進，行經數日，正是那臘月寒天，朔風凜凜，滑凍凌凌。走的是些懸崖峭壁崎嶇路，疊嶺層巒險峻山。三藏在馬上，遙聞唿喇喇水聲聒耳，回頭叫：「悟空，是那裡水響？」行者道：「我記得此處叫做蛇盤山鷹愁澗，想必是澗裡水響。」說不了，馬到澗邊，三藏勒韁觀看。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、行者（ぎょうじゃ）は三蔵（さんぞう）に仕えて西へ進み、数日が過ぎた。折しも陰暦十二月の寒さで、北風は身を刺し、凍った道はつるつる滑る。歩くのは切り立った崖の険しい道、幾重にも峰の重なる急峻な山ばかりだった。三蔵は馬上で、遠くからごうごうと耳を打つ水音を聞き、振り返って呼びかけた。
    三蔵「悟空（ごくう）、あれはどこの水音だろう。」
    行者「確か、ここは蛇盤山（じゃばんざん）の鷹愁澗（ようしゅうかん）という所です。きっと谷川の水音でしょう。」
    言い終わらぬうちに馬は谷川のほとりへ着き、三蔵は手綱を引いて眺めた。見ると、こんな景色である。
  "translation_status": "reviewed"
- "id": "xy-ch15-003"
  "section_id": "chapter-15"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    涓涓寒脈穿雲過，湛湛清波映日紅。
    聲搖夜雨聞幽谷，彩發朝霞眩太空。
    千仞浪飛噴碎玉，一泓水響吼清風。
    流歸萬頃煙波去，鷗鷺相忘沒釣逢。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch15-1455564"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第015回&oldid=1455564"
    "line_start": 123
    "line_end": 126
  "translation_ja": |-
    細く流れる冷たい水脈は雲をくぐり、深く澄んだ波は日の紅を映す。
    音は夜雨を揺らすように幽谷へ響き、彩りは朝焼けとなって大空をまばゆくする。
    千仞（せんじん）の高みから波が飛び、砕けた玉のようなしぶきを噴き、一たまりの水音は清らかな風に吼える。
    流れは万頃（ばんけい）の霞む波へ帰り、鴎と鷺は互いを忘れ、釣り人にも出会わない。
  "translation_status": "reviewed"

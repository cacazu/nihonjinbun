- "id": "xy-ch17-003"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫大聖到空中，把腰兒扭了一扭，早來到黑風山上。住了雲頭，仔細看，果然是座好山，況正值春光時節，但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 123
    "line_end": 123
  "translation_ja": "一方、悟空は空中で腰をひねると、早くも黒風山（こくふうざん）の上に着いた。雲を止めてよく見れば、まことに美しい山で、折しも春の盛りである。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch17-004"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "萬壑爭流，千崖競秀。鳥啼人不見，花落樹猶香。雨過天連青壁潤，風來松捲翠屏張。山草發，野花開，懸崖峭嶂；薜蘿生，佳木麗，峻嶺平崗。不遇幽人，那尋樵子？澗邊雙鶴飲，石上野猿狂。矗矗堆螺排黛色，巍巍擁翠弄嵐光。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    万の谷は流れを競い、千の崖は美を競う。
    鳥は鳴いても人影はなく、花が散っても木には香りが残る。
    雨が過ぎれば、天に連なる青い岩壁が潤い、
    風が来れば、松が波打って翠の屏風を広げる。
    山草が芽吹き、野の花が咲く、切り立つ崖と峰。
    薜蘿（へいら）が茂り、美しい木々が映える、険しい山並みと平らな岡。
    隠者に出会うこともなく、木こりをどこに探そうか。
    谷川のほとりでは二羽の鶴が水を飲み、石の上では野猿が跳ね回る。
    そびえ重なる巻き貝のような峰々は黛の色を並べ、
    高々と翠を抱く山々には、山気の光が戯れる。
  "translation_status": "reviewed"

- "id": "xy-ch17-020"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，呵呵大笑道：「那個老剝皮，死得他一毫兒也不虧，他原來與妖精結黨。怪道他也活了二百七十歲，想是那個妖精傳他些甚麼服氣的小法兒，故有此壽。老孫還記得他的模樣，等我就變做那和尚，往他洞裡走走，看我那袈裟放在何處。假若得手，即便拿回，卻也省力。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 183
    "line_end": 183
  "translation_ja": "悟空は読み終えると、はははと大笑いした。「あの欲深い老いぼれ、死んでも少しも気の毒には当たらないな。妖怪と結託していたとは。二百七十歳まで生きたのも道理だ。きっとあの妖怪が、服気（ふくき）か何かの小さな術を教えたので、それほど長生きしたのだろう。この俺はまだあいつの顔つきを覚えている。あの和尚に化けて洞へ入り、俺の袈裟をどこに置いたか見てやろう。もし手に入れば、そのまま持ち帰れて、手間も省ける。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「死得他一毫兒也不虧」は、死んでも不当でも気の毒でもないという罵倒として訳し、本人に損がないという文字どおりの損得にしなかった。"
- "id": "xy-ch17-021"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，念動咒語，迎著風一變，果然就像那老和尚一般。藏了鐵棒，拽開步，徑來洞口，叫聲：「開門！」那小妖開了門，見是這般模樣，急轉身報道：「大王，金池長老來了。」那怪大驚道：「剛才差了小的去下簡帖請他，這時候還未到那裡哩，如何他就來得這等迅速？想是小的不曾撞著他，斷是孫行者呼他來討袈裟的。管事的，可把佛衣藏了，莫教他看見。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    さすがは悟空。呪文を唱え、風に向かって姿を変えると、まさしくあの老和尚そっくりになった。鉄棒を隠して大股に歩き、まっすぐ洞の口へ来ると、悟空は「門を開けなさい」と呼んだ。門を開けた小妖怪は、その姿を見るや、急いで振り返って報告した。「大王、金池長老（きんちちょうろう）がおいでです。」
    黒い男はひどく驚いた。「たった今、招待状を届けに使いを出したばかりで、まだ向こうにも着いていないはずだ。それなのに、どうしてこう早く来たのか。使いは途中で出会わなかったのだろう。きっと悟空が、袈裟を取り返すために呼んで寄越したのだ。世話役、仏衣を隠しておけ。見つからぬようにな。」
  "translation_status": "reviewed"
- "id": "xy-ch17-022"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者進了前門，但見那天井中松篁交翠，桃李爭妍，叢叢花發，簇簇蘭香，卻也是個洞天之處。又見那二門上有一聯對子，寫著：「靜隱深山無俗慮；幽居仙洞樂天真。」行者暗道：「這廝也是個脫垢離塵，知命的怪物。」入門裡，往前又進，到於三層門裡，都是些畫棟雕梁，明窗彩戶。只見那黑漢子穿的是黑綠紵絲袢襖，罩一領鴉青花綾披風，戴一頂烏角軟巾，穿一雙麂皮皂靴。見行者進來，整頓衣巾，降階迎接道：「金池老友，連日欠親。請坐，請坐。」行者以禮相見。見畢而坐，坐定而茶。茶罷，妖精欠身道：「適有小簡奉啟，後日一敘，何老友今日就下顧也？」行者道：「正來進拜，不期路遇華翰，見有佛衣雅會，故此急急奔來，願求見見。」那怪笑道：「老友差矣。這袈裟本是唐僧的，他在你處住錫，你豈不曾看見，反來就我看看？」行者道：「貧僧借來，因夜晚還不曾展看，不期被大王取來。又被火燒了荒山，失落了家私。那唐僧的徒弟又有些驍勇，亂忙中，四下裡都尋覓不見。原來是大王的洪福收來，故特來一見。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    悟空が表門を入ると、中庭では松と竹が緑を交え、桃と李が美しさを競い、あちこちで花が咲き、群れる蘭が香っていた。まさに仙人の住む洞天（どうてん）の趣である。二の門には一対の聯（れん）があり、こう書いてあった。
    「静かに深山に隠れ、俗世の憂いはなく、
    ひっそり仙洞に住まい、天真（てんしん）を楽しむ。」
    悟空は心の中で思った。「こいつも汚れを離れ、俗塵を脱して、天命をわきまえた妖怪なのだな。」
    門を入ってさらに進み、三つ目の門の内に至ると、彩色した棟木と彫り物の梁、明るい窓と彩られた戸が並んでいた。黒い男は黒緑の絹の袢襖（はんおう）を着て、その上に烏青（うせい）色の花綾（はなあや）の外套をまとい、黒い角形の軟巾（なんきん）をかぶり、麂（き）の革で作った黒い靴を履いていた。悟空が入ってくるのを見ると、衣と頭巾を正して階段を下り、迎えた。
    黒い男「金池（きんち）老友、このところお目にかかれず失礼しました。さあお座りください、どうぞ。」
    悟空は礼にかなって挨拶し、挨拶が済むと座り、座ると茶が出た。茶を飲み終え、黒い男は身を少し起こした。
    黒い男「先ほどささやかな書状を差し上げ、明後日お会いしようとお願いしたばかりですのに、老友はどうして今日お越しになったのですか。」
    悟空「ちょうどお訪ねしようとしていたところ、思いがけず道でご書状に行き会いました。仏衣の雅会をなさると拝見したので、ぜひとも見せていただきたく、急いで参ったのです。」
    黒い男は笑った。「老友、それはおかしい。この袈裟はもともと唐僧（とうそう）の物です。あの方はあなたの寺に逗留していたのに、まだご覧にならなかったのですか。それでかえって私の所へ見においでとは。」
    悟空「僧の私がお借りしたのですが、夜でまだ広げてもおりませんうち、思いがけず大王がお持ちになりました。そのうえ私の山寺は火に焼かれ、家財も失いました。あの唐僧の弟子がまたいささか勇猛で、どさくさの中、四方を捜しても見つかりません。それが大王の大いなる福のおかげでこちらに収まっていたので、特に拝見に参ったのです。」
  "translation_status": "reviewed"
- "id": "xy-ch17-023"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正講處，只見有一個巡山的小妖來報道：「大王，禍事了，下請書的小校被孫行者打死在大路傍邊，他綽著經兒，變化做金池長老，來騙佛衣也。」那怪聞言，暗道：「我說那長老怎麼今日就來，又來得迅速，果然是他。」急縱身，拿過槍來，就刺行者。行者耳朵裡急掣出棍子，現了本相，架住槍尖，就在他那中廳裡跳出，自天井中鬥到前門外。諕得那洞裡群魔都喪膽，家間老幼盡無魂。這場在山頭好賭鬥，比前番更是不同。好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    話していると、山を巡る小妖怪が一人やって来て報告した。「大王、大変です。招待状を届けに出た手下は、大道の脇で悟空に打ち殺されました。奴は手がかりをつかんで金池長老に化け、仏衣をだまし取りに来たのです。」
    黒い男は聞いて、心の中で言った。「どうして長老が今日、しかもあんなに早く来たのかと思ったら、やはり奴だったか。」
    すぐに跳び上がって槍を取り、悟空を突いた。悟空も耳の中から素早く棒を抜き、本来の姿を現して槍先を受け止めると、中広間から跳び出し、中庭から表門の外まで戦いながら進んだ。洞の妖魔たちは肝をつぶし、家の老若は魂も消えるほど恐れた。山上のこの戦いは、前の一戦とはなおさら違う。すさまじいやり合い、まさしく、
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「下請書的小校」は招待状を届けに出た手下。道中で殺されているため、配達を完了したとは訳さない。「綽著經兒」は手がかりをつかんだと解した。"
- "id": "xy-ch17-024"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "那猴王膽大充和尚，這黑漢心靈隱佛衣。語去言來機會巧，隨機應變不差池。袈裟欲見無由見，寶貝玄微真妙微。小怪巡山言禍事，老妖發怒顯神威。翻身打出黑風洞，槍棒爭持辨是非。棒架長槍聲響喨，槍迎鐵棒放光輝。悟空變化人間少，妖怪神通世上稀。這個要把佛衣來慶壽，那個不得袈裟肯善歸？這番苦戰難分手，就是活佛臨凡也解不得圍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 189
    "line_end": 189
  "translation_ja": |-
    あの猴王（こうおう）は大胆にも和尚を装い、この黒い男は気を利かせて仏衣を隠す。
    言葉を交わして機を巧みにうかがい、変に応じて動くことに抜かりはない。
    袈裟を見ようにも見られず、宝の奥深い秘密はまことに微妙。
    山を巡る小妖怪が凶事を告げ、老いた妖怪は怒って神威を現す。
    身を翻して黒風洞から打って出て、槍と棒を争わせ、是非を決めようとする。
    棒が長槍を受ける音は高く響き、槍が鉄棒を迎えれば光がきらめく。
    悟空の変化は人の世にもまれで、妖怪の神通も天下に少ない。
    こちらは仏衣で誕生祝いをしようとし、あちらは袈裟を得ずにおとなしく帰ろうか。
    この苦戦は引き分けようもなく、たとえ生き仏が世に降りても、もつれを解けまい。
  "translation_status": "reviewed"
- "id": "xy-ch17-025"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個從洞口打上山頭，自山頭殺在雲外，吐霧噴風，飛砂走石，只鬥到紅日沉西，不分勝敗。那怪道：「姓孫的，你且住了手，今日天晚，不好相持。你去，你去，待明早來，與你定個死活。」行者叫道：「兒子莫走，要戰便像個戰的，不可以天晚相推。」看他沒頭沒臉的，只情使棍子打來。這黑漢又化陣清風，轉回本洞，緊閉石門不出。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    二人は洞の口から山の頂へと打ち合い、山の頂から雲の外へ戦い上がった。霧を吐き風を吹き出し、砂を飛ばし石を転がして、赤い日が西へ沈むまで戦っても、勝敗はつかなかった。
    黒い男「孫とやら、ひとまず手を止めろ。今日はもう遅い、これ以上は戦いにくい。帰れ、帰れ。明朝また来たら、生きるか死ぬかを決めてやる。」
    悟空は叫んだ。「息子よ、逃げるな。戦うなら戦うらしくしろ。日が暮れたのを言い訳にするな。」
    頭だろうが顔だろうが構わず、ひたすら棒を打ちかけた。黒い男はまた一陣の清風となり、自分の洞へ戻ると、石門を固く閉ざして出てこなかった。
  "translation_status": "reviewed"
- "id": "xy-ch17-026"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻無計策奈何，只得也回觀音院裡，按落雲頭，道聲：「師父。」那三藏眼兒巴巴的正望他哩，忽見到了面前，甚喜；又見他手裡沒有袈裟，又懼。問道：「怎麼這番還不曾有袈裟來？」行者袖中取出個簡帖兒來，遞與三藏道：「師父，那怪物與這死的老剝皮原是朋友。他著一個小妖送此帖來，還請他去赴佛衣會。是老孫就把那小妖打死，變做那老和尚，進他洞去，騙了一鍾茶吃。欲問他討袈裟看看，他不肯拿出。正坐間，忽被一個甚麼巡山的走了風信，他就與我打將起來。只鬥到這早晚，不分上下。他見天晚，閃回洞去，緊閉石門。老孫無奈，也暫回來。」三藏道：「你手段比他何如？」行者道：「我也硬不多兒，只戰個手平。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 192
    "line_end": 192
  "translation_ja": |-
    悟空にはどうする手立てもなく、やむなく観音院へ戻った。雲を降ろし、悟空は「お師匠さま」と呼んだ。三蔵は目を凝らして帰りを待っていたので、突然目の前に現れたのを見て大いに喜んだが、手に袈裟がないのを見ると、また不安になった。
    三蔵「どうして今度も袈裟を持って帰らなかったのだ。」
    悟空は袖から招待状を取り出し、三蔵へ差し出した。「お師匠さま、あの妖怪と、死んだ欲深い老いぼれは、もともと友人だったのです。妖怪は小妖怪にこの書状を持たせ、仏衣会へ招いていたんですよ。この俺が小妖怪を打ち殺し、老和尚に化けて洞へ入り、お茶を一杯だまし飲みしました。袈裟を見せろと求めても、奴は取り出そうとしません。座っているうち、何とかいう山回りの奴が事情を漏らし、奴と私で戦いになりました。この時刻まで戦っても、勝負は互角。奴は日が暮れたと見ると洞へ逃げ込み、石門を固く閉じてしまいました。この俺もどうにもならず、ひとまず戻ってきたのです。」
    三蔵「お前の腕は、あれと比べてどうなのだ。」
    悟空「私もそう上というわけではありません。戦えばようやく互角です。」
  "translation_status": "reviewed"
- "id": "xy-ch17-027"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏才看了簡帖，又遞與那院主道：「你師父敢莫也是妖精麼？」那院主慌忙跪下道：「老爺，我師父是人。只因那黑大王修成人道，常來寺裡與我師父講經，他傳了我師父些養神服氣之術，故以朋友相稱。」行者道：「這夥和尚沒甚妖氣，他一個個頭圓頂天，足方履地，但比老孫肥胖長大些兒，非妖精也。你看那帖兒上寫著『侍生熊羆』，此物必定是個黑熊成精。」三藏道：「我聞得古人云：『熊與猩猩相類。』都是獸類。他卻怎麼成精？」行者笑道：「老孫是獸類，見做了齊天大聖，與他何異？大抵世間之物，凡有九竅者，皆可以修行成仙。」三藏又道：「你才說他本事與你手平，你卻怎生得勝，取我袈裟回來？」行者道：「莫管，莫管，我有處治。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    三蔵は招待状を読み、それを院主に渡して言った。「お前の師も、もしや妖怪だったのか。」
    院主は慌ててひざまずいた。「お坊さま、師は人間です。ただ、あの黒大王が修行を積んで人の道を成し、しばしば寺へ来て師と経を論じておりました。師に精神を養い、気を取り入れる術を少し教えたので、友と呼び合っていたのです。」
    悟空「この和尚たちには、妖気はありません。みな丸い頭で天をいただき、四角い足で地を踏みしめ、ただこの俺より太って背が高いだけで、妖怪ではありませんよ。あの書状に『侍生熊羆』と書いてあるのをご覧なさい。奴はきっと、黒熊が精になったものです。」
    三蔵「昔の人は『熊と猩猩（しょうじょう）は似たものだ』と言ったと聞く。どちらも獣ではないか。どうして精になったのだろう。」
    悟空は笑った。「この俺も獣ですが、現に斉天大聖（せいてんたいせい）になったでしょう。あれと何が違うのです。およそ世の中のもので九竅（きゅうきょう）があるものは、みな修行して仙人になることができるのです。」
    三蔵「先ほど、あれの腕はお前と互角だと言ったな。それではどうやって勝って、私の袈裟を取り戻すのだ。」
    悟空「ご心配なく、ご心配なく。私に手立てがあります。」
  "translation_status": "reviewed"

- "id": "xy-ch17-013"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪聞言笑道：「你原來是那鬧天宮的弼馬溫麼？」行者最惱的是人叫他弼馬溫，聽見這一聲，心中大怒，罵道：「你這賊怪！偷了袈裟不還，倒傷老爺。不要走，看棍。」那黑漢側身躲過，綽長槍，劈手來迎。兩家這場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    黒い男は聞くと笑った。「お前は、あの天宮を騒がせた弼馬温（ひつばおん）だったのか。」
    悟空がいちばん腹を立てるのは、人から弼馬温と呼ばれることだった。悟空はその一言を聞いて激怒し、罵った。「この盗人妖怪め！　袈裟を盗んで返さぬうえ、この俺さまを侮辱するのか。逃げるな、棒を受けてみろ！」
    黒い男は身をそらしてかわし、長槍をつかむと、さっと突き出して迎え撃った。二人のこの戦いは、まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch17-014"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "如意棒，黑纓槍，二人洞口逞剛強。分心劈臉刺，著臂照頭傷。這個橫丟陰棍手，那個直撚急三槍。白虎爬山來探爪，黃龍臥道轉身忙。噴彩霧，吐毫光，兩個妖仙不可量。一個是修正齊天聖，一個是成精黑大王。這場山裡相爭處，只為袈裟各不良。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    如意棒（にょいぼう）と黒房の槍、二人は洞の口で強さを競う。
    胸を狙い顔めがけて突き、腕を打ち頭を狙って傷つける。
    こちらは隠した棒の手を横へ繰り出し、あちらは槍をまっすぐ三度続けて突く。
    白虎が山を登って爪を探り出すように、黄竜が道に伏して素早く身を返すように。
    彩る霧を噴き、光を放つ、二人の妖仙の力は量り知れぬ。
    一方は正道を修めた斉天聖（せいてんせい）、一方は精となった黒大王（こくだいおう）。
    この山中での争いは、ただ袈裟のため、双方とも穏やかならぬ振る舞い。
  "translation_status": "reviewed"
- "id": "xy-ch17-015"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪與行者鬥了十數回合，不分勝負，漸漸紅日當午。那黑漢舉槍架住鐵棒道：「孫行者，咱兩個且收兵，等我進了膳來，再與你賭鬥。」行者道：「你這個孽畜，教做漢子？好漢子，半日兒就要吃飯？似老孫在山根下，整壓了五百餘年，也未曾嘗些湯水，那裡便餓哩？莫推故，休走，還我袈裟來，方讓你去吃飯。」那怪虛幌一槍，撤身入洞，關了石門，收回小怪，且安排筵宴，書寫請帖，邀請各山魔王慶會不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    黒い男と悟空は十数合戦ったが、勝負はつかなかった。やがて赤い太陽が真昼の空に昇る。黒い男は槍を持ち上げて鉄棒を受け止めた。
    黒い男「悟空、しばらく手を休めよう。私が食事を済ませてから、またお前と勝負しよう。」
    悟空「この畜生、それでも男か。立派な男が、半日で飯を食いたくなるのか。この俺など山の麓に五百余年も押さえつけられ、その間、湯も水も口にしたことがない。どこが腹など減るものか。口実を作るな、逃げるな。袈裟を返せば、それから飯を食いに行かせてやる。」
    黒い男は槍で突くふりをして身を引き、洞へ入ると石門を閉じ、小妖怪たちを引き戻した。そしてひとまず宴の支度をし、招待状を書き、各山の魔王を祝いの会へ招いたが、この話はさておく。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "行者の「湯水も口にしなかった」という自称は、先行回の鉄丸・銅汁の記述と独自に整合させず、本人の発言として保持した。"
- "id": "xy-ch17-016"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者攻門不開，也只得回觀音院。那本寺僧人已葬埋了那老和尚，都在方丈裡伏侍唐僧。早齋已畢，又擺上午齋。正那裡添湯換水，只見行者從空降下，眾僧禮拜，接入方丈，見了三藏。三藏道：「悟空，你來了？袈裟如何？」行者道：「已有了根由。早是不曾冤了這些和尚，原來是那黑風山妖怪偷了。老孫去暗暗的尋他，只見他與一個白衣秀士、一個老道人，坐在那芳草坡前講話。也是個不打自招的怪物，他忽然說出道：後日是他母難之日，邀請諸邪來做生日；夜來得了一件錦襴佛衣，要以此為壽，作一大宴，喚做慶賞佛衣會。是老孫搶到面前，打了一棍，那黑漢化風而走，道人也不見了，只把個白衣秀士打死，乃是一條白花蛇成精。我又急急趕到他洞口，叫他出來與他賭鬥。他已承認了，是他拿回。戰夠這半日，不分勝負。那怪回洞，卻要吃飯，關了石門，懼戰不出。老孫卻來回看師父，先報此信。已是有了袈裟的下落，不怕他不還我。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    さて、悟空は門を攻めても開かなかったので、やむなく観音院へ戻った。寺の僧たちはすでにあの老和尚を葬り、みな方丈で三蔵に仕えていた。朝の斎食が済んで、また昼の斎食を並べ、湯を足し水を取り替えているところへ、悟空が空から降りてきた。僧たちは拝礼して方丈へ迎え入れ、悟空は三蔵に会った。
    三蔵「悟空、戻ったか。袈裟はどうなった。」
    悟空「手がかりはつかめました。危うくこの和尚たちに濡れ衣を着せるところでしたが、盗んだのは黒風山の妖怪だったのです。この俺がひそかに捜しに行くと、奴は白衣秀士と老いた道人と一緒に、芳草の坂で座って話していました。責められもせず自白する妖怪でしてね。ふと、明後日は母が産みの苦しみをした自分の誕生日だから、妖怪たちを招いて祝うのだと言い出したのです。昨夜、錦襴仏衣を一着手に入れたので、それを誕生祝いの品にして大宴会を開き、慶賞仏衣会（けいしょうぶつえかい）と呼ぶというのです。この俺が目の前に飛び出して棒を振るうと、黒い男は風になって逃げ、道人もいなくなり、白衣秀士だけを打ち殺しました。あれは白い斑紋のある蛇が精になったものでした。私はすぐに洞の口まで追いかけ、奴を呼び出して勝負しました。持って帰ったのは自分だと、奴はもう認めています。半日たっぷり戦っても勝負がつかず、奴は飯を食うと言って洞へ戻り、石門を閉じて、戦いを恐れて出てきません。この俺はお師匠さまのお顔を見に戻り、まずこれをお知らせしに来たのです。袈裟のありかさえ分かれば、返さずに済ませられるものではありません。」
  "translation_status": "reviewed"
- "id": "xy-ch17-017"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾僧聞言，合掌的合掌，磕頭的磕頭，都念聲：「南無阿彌陀佛！今日尋著下落，我等方有了性命矣。」行者道：「你且休喜歡暢快，我還未曾到手，師父還未曾出門哩。只等有了袈裟，打發得我師父好好的出門，才是你們的安樂處；若稍有些須不虞，老孫可是好惹的主子！可曾有好茶飯與我師父吃？可曾有好草料喂馬？」眾僧俱滿口答應道：「有，有，有，更不曾一毫待怠慢了老爺。」三藏道：「自你去了這半日，我已吃過了三次茶湯，兩餐齋供了，他俱不曾敢慢我。但只是你還盡心竭力去尋取袈裟回來。」行者道：「莫忙，既有下落，管情拿住這廝，還你原物。放心，放心。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    僧たちはそれを聞いて、合掌する者は合掌し、額を地につける者はつけ、口々に唱えた。「南無阿弥陀仏！　今日、ありかが分かって、ようやく私たちの命も助かりました。」
    悟空「まだ浮かれて喜ぶな。俺はまだ手に入れていないし、お師匠さまもまだ出発していない。袈裟を取り戻し、お師匠さまを無事に送り出してこそ、お前たちも安心できるんだ。少しでも不測のことが起きれば、この俺は甘く見てよい相手じゃないぞ。お師匠さまにはうまい茶と食事を出したか。馬にはよい飼葉をやったか。」
    僧たちはみな、口をそろえて答えた。「はい、はい、もちろんです。お坊さまを少しも粗末にはしておりません。」
    三蔵「お前が出かけていたこの半日で、私はもう三度お茶をいただき、二度斎食をごちそうになった。皆、少しも粗末にはしなかったよ。ただ、お前は力を尽くし、袈裟を捜し出して持って帰ってくれ。」
    悟空「焦ることはありません。ありかが分かったからには、必ず奴を捕まえて、もとの品をお返しします。ご安心ください、ご安心ください。」
  "translation_status": "reviewed"
- "id": "xy-ch17-018"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說處，那上房院主又整治素供，請孫老爺吃齋。行者卻吃了些須，復駕祥雲，又去找尋。正行間，只見一個小妖，左脅下夾著一個花梨木匣兒，從大路而來。行者度他匣內必有甚麼柬札，舉起棒，劈頭一下，可憐不禁打，就打得似個肉餅一般。卻拖在路傍，揭開匣兒觀看，果然是一封請帖。帖上寫著："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 180
    "line_end": 180
  "translation_ja": "そう話していると、上院の院主がまた精進の供えを整え、悟空に斎食を勧めた。悟空は少し食べると、再び瑞雲に乗って捜しに出かけた。途中、左脇に花梨（かりん）の木箱を抱えた小妖怪が、大道をやって来るのが見えた。悟空は箱の中にはきっと何か書状があるだろうと踏み、棒を振り上げて頭を一打した。哀れ、小妖怪はひとたまりもなく、肉餅のようにぺしゃんこになった。悟空はそれを道端へ引きずり、箱を開けて見ると、果たして一通の招待状であった。そこにはこう書いてある。"
  "translation_status": "reviewed"
- "id": "xy-ch17-019"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "侍生熊羆頓首拜，啟上大闡金池老上人丹房：屢承佳惠，感激淵深。夜觀回祿之難，有失救護，諒仙機必無他害。生偶得佛衣一件，欲作雅會，謹具花酌，奉扳清賞。至期，千乞仙駕過臨一敘。是荷。先二日具。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    侍生（じせい）、熊羆（ゆうひ）、謹んで頭を下げ拝礼いたします。
    大闡金池老上人（だいせんきんちろうしょうにん）、ご庵中へ申し上げます。
    たびたびお恵みを賜り、淵のように深く感謝しております。昨夜、火災の難を拝見しながら、お救いすることができませんでしたが、仙妙なるお働きによって、ほかにお害はなかったものと存じます。私、たまたま仏衣を一着手に入れましたので、雅やかな会を催したく、心ばかりの酒肴を整え、謹んでお招きして、ご鑑賞いただこうと存じます。当日には、何とぞお越しくださり、ひとときをお過ごしくださいますよう、伏してお願い申し上げます。おいでいただければ幸いです。
    二日前にしたためる。
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者正觀山景，忽聽得芳草坡前，有人言語。他卻輕步潛蹤，閃在那石崖之下，偷睛觀看。原來是三個妖魔，席地而坐：上首的是一條黑漢，左首下是一個道人，右首下是一個白衣秀士。都在那裡高談闊論，講的是立鼎安爐，摶砂煉汞，白雪黃芽，傍門外道。正說中間，那黑漢笑道：「後日是我母難之日，二公可光顧光顧。」白衣秀士道：「年年與大王上壽，今年豈有不來之理？」黑漢道：「我夜來得了一件寶貝，名喚錦襴佛衣，誠然是件玩好之物。我明日就以他為壽，大開筵宴，邀請各山道官，慶賀佛衣，就稱為佛衣會如何？」道人笑道：「妙，妙，妙。我明日先來拜壽，後日再來赴宴。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    悟空が山の景色を眺めていると、ふと芳しい草の茂る坂の前から、人の話し声が聞こえた。足音を忍ばせて身を隠し、岩崖の下へさっと入り、そっと目を向ける。見ると、三人の妖魔が地べたに座っていた。上座には黒い男、その左下には道人が一人、右下には白衣秀士（はくいしゅうし）が一人。いずれも大いに論じ合い、鼎（かなえ）や炉を据えること、丹砂（たんしゃ）を練り水銀を錬ること、白雪（はくせつ）や黄芽（こうが）といった、正道から外れた修行の話をしていた。話の途中、黒い男が笑った。
    黒い男「明後日は、母が産みの苦しみをした、私の誕生日です。お二方とも、どうぞおいでください。」
    白衣秀士「毎年、大王のお誕生日を祝いに参っております。今年だけ来ないなどということがありましょうか。」
    黒い男「昨夜、一つ宝物を手に入れました。錦襴仏衣（きんらんぶつえ）というもので、まことに愛でて楽しむにふさわしい品です。明日はこれを誕生祝いの品として盛大な宴を開き、各山の道士方を招いて、この仏衣を祝おうと思います。仏衣会（ぶつえかい）と名づけてはどうでしょう。」
    道人は笑って言った。「よい、よい、実によい。私は明日、まずお祝いに参り、明後日また宴に伺いましょう。」

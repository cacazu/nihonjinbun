- "id": "xy-ch17-002"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說孫行者一觔斗跳將起去，諕得那觀音院大小和尚並頭陀、幸童、道人等一個個朝天禮拜道：「爺爺呀！原來是騰雲駕霧的神聖下界，怪道火不能傷。恨我那個不識人的老剝皮使心用心，今日反害了自己。」三藏道：「列位請起，不須恨了。這去尋著袈裟，萬事皆休；但恐找尋不著，我那徒弟性子有些不好，汝等性命不知如何，恐一人不能脫也。」眾僧聞得此言，一個個提心弔膽，告天許願，只要尋得袈裟，各全性命不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、悟空（ごくう）が一つ宙返りを打って飛び上がると、観音院（かんのんいん）の大小の和尚をはじめ、頭陀（ずだ）、幸童（こうどう）、寺の下働きたちは驚き、一人ひとり天を仰いで拝んだ。
    寺の人々「神さま！　雲に乗り霧を駆る神聖なお方が、下界へ降りておいでになったのだ。火で傷つかなかったのも道理だ。あの人を見る目のない、欲深い老いぼれが憎い。あれこれ悪知恵を働かせ、今日はかえって自分を害してしまった。」
    三蔵（さんぞう）「皆さん、どうぞお立ちください。もう恨むには及びません。今度出かけて袈裟を見つけてくれば、すべてそれで済みます。ただ、見つからなかったらと案じているのです。私の弟子は少々気性が荒いので、皆さんの命がどうなるか分かりません。一人も逃れられないかもしれません。」
    僧たちはこれを聞いて、誰もが肝を冷やし、天に祈って願をかけた。ただ袈裟が見つかり、皆が命をまっとうできるようにと願っていたが、その話はさておく。
  "translation_status": "reviewed"

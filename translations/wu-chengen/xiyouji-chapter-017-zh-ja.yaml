  "known_gaps":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-002"
    "description_ja": "「幸童」は寺に仕える小姓と解した。底本の字形は保持し、その語に含まれ得る他の歴史的含意をこの場面へ補っていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-005"
    "description_ja": "誕生日を「母難之日」といい、母が出産で苦しんだ日として表す。単なる記念日へ省略していない。 冒頭では誕生日が明後日、仏衣の祝宴が明日とされ、道人は明日祝寿し明後日宴に来ると言う。後の再話にも明日・明後日のずれがあるが、原文どおりに残した。 白雪・黄芽は煉丹術の象徴的な語として残し、特定の鉱物や内丹理論への対応を本文で断定していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-007"
    "description_ja": "「黃鸝」は漢詩でいう黄鶯の類であり、訳では慣用的に鶯とした。日本のウグイスという特定の鳥種と同一だと保証する訳ではない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-008"
    "description_ja": "「雷公嘴」は雷神の図像のような突出した口のたとえとして訳した。門を叩く行為を、門の破壊へ拡大していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-009"
    "description_ja": "「烏金」は鎧の黒く光る材の表現として残し、現代の特定の合金に断定していない。「火漆」は教育部の辞書の封蝋という語義を参照し、火漆の艶と訳した。黒色とは断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-011"
    "description_ja": "行者の「老外公」は敵を孫扱いする誇示的な自称。「お前の爺さま」とし、普通の一人称へ消していない。長い自伝詩は続く対訳単位まで一続きの発言である。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-012"
    "description_ja": "行者自身による自伝・誇示の詩であり、語り手が独立して確認した説明とは区別する。仙人の年齢十万八千、寿命三百余、盗桃・大暴れの回数などは先行する物語と独自に整合させていない。 「靈霄殿」は底本の霊の字を保持し、「凌霄殿」などに改めていない。 「坎離」は水・火を表す卦を身中の修行へ重ねた表現。「無漏」も仙体を成す文脈にあり、仏教の教学用語だけで説明を限定しない。 「顯聖真君」「二郎」は同じ神を指す。「玉毫」は仏の眉間の白毫から仏の姿を指すと解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-015"
    "description_ja": "行者の「湯水も口にしなかった」という自称は、先行回の鉄丸・銅汁の記述と独自に整合させず、本人の発言として保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-019"
    "description_ja": "宛名「大闡金池老上人」、自称「侍生」、結び「先二日具」を省略せず保持した。「回祿」は火災の意に訳した。 「奉扳」は底本の表記を維持し、文脈から謹んで招く意味と取った。「丹房」は僧への書状の宛所として「ご庵中」とした。語形の詳細には留保がある。 署名「熊羆」はこの妖怪の名乗りとして扱い、熊・羆という一般的な動物分類の辞書項目とは区別する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-020"
    "description_ja": "「死得他一毫兒也不虧」は、死んでも不当でも気の毒でもないという罵倒として訳し、本人に損がないという文字どおりの損得にしなかった。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-023"
    "description_ja": "「下請書的小校」は招待状を届けに出た手下。道中で殺されているため、配達を完了したとは訳さない。「綽著經兒」は手がかりをつかんだと解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-027"
    "description_ja": "「熊と猩猩は似る」「九竅のあるものは修行して仙になれる」は登場人物による古典的な説明であり、現代の動物学上の事実として保証しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-032"
    "description_ja": "底本は「五色」といいながら紅・黄・紫・黒・緑・藍の六つを列挙する。五色を六色へ改めず、列挙も省略しなかった。 羅紋石・瑪瑙灘は聖域の景物として表記を保持した。物質的な組成や実在地点への同定は断定していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-034"
    "description_ja": "ここで行者は「後日」が誕生日と言いながら「今日」祝寿し「明日」仏衣会と述べる。前日の会話との日付のずれを訂正していない。 「蒼狼」は蒼い狼と訳し、特定の動物種や現代的な毛色分類に断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-035"
    "description_ja": "「勾頭」は妖怪に取り入る手づるの意味と解した。皿に刻まれた「凌虛子製」という四文字から道人の名を推測するのは、行者の推論として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-037"
    "description_ja": "「蒼顏」は青い顔色ではなく老成した容貌の意として訳した。 「去去還無住，如如自有殊」「只是隔邪軀」は、変化と不変の真理を重ねる難句。行く・とどまらない・如如・相違・邪なる体の対比を残し、特定の教学体系による解釈へ固定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-039"
    "description_ja": "「三三勾漏合、六六少翁商」は煉丹の数と故事を含む難句。三三・六六の数をそのまま残し、「勾漏」を葛洪の呼称とする解釈と、「少翁」を漢武帝の方士とする解釈には留保を付した。 「瓦鑠」は底本の字を保持した。別本文に見える「瓦鉢」へ置き換えず、語義未確定の難句として残す。「牟尼」は光り輝く珠の表現と解したが、摩尼宝珠との関係は推定。 この詩の鉛・水銀や火の描写は文学上・修行上の比喩であり、実際に薬を調製・服用する指示ではない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-043"
    "description_ja": "「現了本相、理起四平」は、飲み込まれた行者が元の姿に戻り、体を張って構える動作と解した。腹の中での具体的な打撃動作は本文にないため追加しなかった。 真言を唱える主語は、呪を知り輪を与えた観音菩薩と文脈上判断した。底本にはこの箇所の主語が明記されていない。 頭痛に「依舊」とあるが、それ以前の頭痛を補わず、「やはり頭が痛み」と訳した。輪の固有名は原文にないので、他の回に出る特定の箍へ独自同定していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "segment_ids":
    - "xy-ch17-044"
    "description_ja": "「公道難禁疼痛」の「公道」は字面を別字へ直さず、文脈上どうしても痛みをこらえきれない趣旨と解した。語法の詳細には留保がある。 本文の欠落ではなく解釈・校訂上の留保。"

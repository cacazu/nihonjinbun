    "message_ja": "白雪・黄芽は煉丹術の象徴的な語として残し、特定の鉱物や内丹理論への対応を本文で断定していない。"
- "id": "xy-ch17-006"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞得佛衣之言，定以為是他寶貝。他就忍不住怒氣，跳出石崖，雙手舉起金箍棒，高叫道：「我把你這夥賊怪！你偷了我的袈裟，要做甚麼佛衣會？趁早兒將來還我。」喝一聲「休走！」掄起棒，照頭一下。慌得那黑漢化風而逃，道人駕雲而走，只把個白衣秀士一棒打死。拖將過來看處，卻是一條白花蛇怪。索性提起來，捽做五七斷。徑入深山，找尋那個黑漢。轉過尖峰，抹過峻嶺，又見那壁陡崖前，聳出一座洞府。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    悟空は仏衣と聞いて、きっと自分たちの宝物だと思った。怒りを抑えきれず、岩崖から飛び出すと、両手で金箍棒（きんこぼう）を振り上げて大声で叫んだ。
    悟空「この盗人妖怪どもめ！　俺の袈裟を盗んで、何が仏衣会だ。さっさと持ってきて返せ！」
    さらに悟空は「逃げるな！」と一喝し、棒を振り回して頭めがけて一撃した。黒い男は慌てて風と化して逃げ、道人は雲に乗って去ったが、白衣秀士だけは一棒で打ち殺された。引き寄せて見ると、白い斑紋のある蛇の妖怪だった。悟空はついでにそれを持ち上げ、叩きつけて五つ七つにちぎると、まっすぐ山奥へ入り、あの黒い男を捜した。尖った峰を回り、険しい山をかすめて行くと、切り立つ崖の前に一つの洞府（どうふ）がそびえている。見れば、
  "translation_status": "reviewed"
- "id": "xy-ch17-007"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "煙霞渺渺，松柏森森。煙霞渺渺采盈門，松柏森森青遶戶。橋踏枯槎木，峰巔繞薜蘿。鳥啣紅蕊來雲壑，鹿踐芳叢上石臺。那門前時催花發，風送花香。臨堤綠柳轉黃鸝，傍岸夭桃翻粉蝶。雖然曠野不堪誇，卻賽蓬萊山下景。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    霞は遠くたなびき、松と柏は深々と茂る。
    はるかな霞の彩りは門に満ち、深々と茂る松柏の青さが戸口を囲む。
    橋には枯れた枝木が渡され、峰の頂には薜蘿が絡む。
    鳥は紅の花をくわえ、雲のかかる谷へ来たり、鹿は芳しい草むらを踏んで石の台へ登る。
    門前では季節が花を促して咲かせ、風が花の香りを運ぶ。
    堤に臨む緑の柳では鶯がさえずり、岸辺の若い桃には白い蝶が舞う。
    人里離れた野で、誇るほどではないとはいえ、蓬萊山（ほうらいさん）の麓の景色にも勝っている。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「黃鸝」は漢詩でいう黄鶯の類であり、訳では慣用的に鶯とした。日本のウグイスという特定の鳥種と同一だと保証する訳ではない。"
- "id": "xy-ch17-008"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者到於門首，又見那兩扇石門關得甚緊。門上有一橫石板，明書六個大字，乃「黑風山黑風洞」。即便掄棒，叫聲：「開門！」那裡面有把門的小妖，開了門出來，問道：「你是何人，敢來擊吾仙洞？」行者罵道：「你個作死的孽畜！甚麼個去處，敢稱仙洞？『仙』字是你稱的？快進去報與你那黑漢，教他快送老爺的袈裟出來，饒你一窩性命。」小妖急急跑到裡面，報道：「大王，佛衣會做不成了，門外有一個毛臉雷公嘴的和尚來討袈裟哩。」那黑漢被行者在芳草坡前趕將來，卻才關了門，坐還未穩，又聽得那話，心中暗想道：「這廝不知是那裡來的，這般無禮，他敢嚷上我的門來。」教取披掛，隨結束了，綽一桿黑纓槍，走出門來。這行者閃在門外，執著鐵棒，睜睛觀看，只見那怪果生得兇險："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    悟空が門の前に着くと、二枚の石扉は固く閉ざされていた。門の上の横長の石板には、「黒風山黒風洞（こくふうどう）」と六つの大きな字がはっきり刻まれている。すぐに棒を振るい、悟空は「門を開けろ！」と叫んだ。中から門番の小妖怪が扉を開けて出てきた。
    門番の小妖怪「何者だ。我らの仙洞を叩くとは。」
    悟空は罵った。「死にたいのか、この畜生め！　どんな所か知らんが、よくも仙洞などと名乗れたな。『仙』の字をお前たちが使えると思うのか。さっさと中へ入って、あの黒い男に伝えろ。この俺さまの袈裟を急いで持ってこい。そうすれば巣の連中の命は助けてやる。」
    小妖怪は急いで中へ駆け込み、報告した。「大王、仏衣会は開けません。外に毛むくじゃらの顔で雷公（らいこう）のように口の突き出た和尚が来て、袈裟を返せと言っています。」
    黒い男は芳草の坂で悟空に追われて戻り、ようやく門を閉じ、座る間もないうちにその知らせを聞いた。黒い男は心中つぶやいた。「どこから来た奴か知らぬが、何という無礼だ。私の門まで押しかけて騒ぐとは。」
    武具を持ってこさせ、すぐに身支度を整えると、黒い房のついた槍を取り、門を出た。悟空は門の外で身をかわして鉄棒を握り、目を見開いて眺めた。見れば、その妖怪はまことに険悪な姿をしていた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「雷公嘴」は雷神の図像のような突出した口のたとえとして訳した。門を叩く行為を、門の破壊へ拡大していない。"
- "id": "xy-ch17-009"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    碗子鐵盔火漆光，烏金鎧甲亮輝煌。
    皂羅袍罩風兜袖，黑綠絲絛軃穗長。
    手執黑纓槍一桿，足踏烏皮靴一雙。
    眼晃金睛如掣電，正是山中黑風王。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 133
    "line_end": 136
  "translation_ja": |-
    椀形の鉄兜は火漆（かしつ）の艶を放ち、烏金（うきん）の鎧はきらきら輝く。
    黒絹の袍（ほう）を上からまとい、袖は風をはらみ、黒緑の絹紐には長い房が垂れる。
    手には黒い房の槍を一本、足には黒革の靴を一足。
    金色の眼が稲妻のようにきらめく、これぞ山中の黒風王（こくふうおう）。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「烏金」は鎧の黒く光る材の表現として残し、現代の特定の合金に断定していない。「火漆」は教育部の辞書の封蝋という語義を参照し、火漆の艶と訳した。黒色とは断定しない。"
- "id": "xy-ch17-010"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者暗笑道：「這廝真個如燒窰的一般，築煤的無二，想必是在此處刷炭為生，怎麼這等一身烏黑？」那怪厲聲高叫道：「你是個甚麼和尚，敢在我這裡大膽？」行者執鐵棒，撞至面前，大咤一聲道：「不要閑講，快還你老外公的袈裟來。」那怪道：「你是那寺裡和尚？你的袈裟在那裡失落了，敢來我這裡索取？」行者道：「我的袈裟在直北觀音院後方丈裡放著，只因那院裡失了火，你這廝趁鬨擄掠，盜了來，要做佛衣會慶壽，怎敢抵賴？快快還我，饒你性命；若牙迸半個『不』字，我推倒了黑風山，屣平了黑風洞，把你這一洞妖邪都碾為齏粉。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空はひそかに笑って言った。「こいつは窯焼きそっくり、石炭を突き固める奴とまるで同じだ。きっとここで炭を扱って暮らしているんだろう。どうしてこう全身真っ黒なんだ。」
    黒い男は声を荒らげて叫んだ。「お前は何者の和尚だ。私の所で大それた振る舞いをするとは。」
    悟空は鉄棒を構えて目の前まで突き進み、大声で一喝した。「無駄口をたたくな。お前の爺さまの袈裟をさっさと返せ。」
    黒い男「どの寺の和尚だ。袈裟をどこでなくしたからといって、ここへ取り立てに来るのだ。」
    悟空「俺の袈裟は、真北にある観音院の奥の方丈（ほうじょう）に置いてあった。あの寺が火事になったのを幸い、お前が騒ぎに乗じて略奪し、盗んできて、誕生祝いの仏衣会を開こうとしているんだ。よくも言い逃れをするな。さっさと返せば命は助ける。歯の間から『嫌だ』の半言でも漏らしてみろ。黒風山を押し倒し、黒風洞を踏みならし、この洞の妖怪どもをみな粉々にすりつぶしてやる。」
  "translation_status": "reviewed"
- "id": "xy-ch17-011"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪聞言，呵呵冷笑道：「你這個潑物，原來昨夜那火就是你放的。你在那方丈屋上行兇招風，是我把一件袈裟拿來了，你待怎麼？你是那裡來的？姓甚名誰？有多大手段，敢那等海口浪言。」行者道：「是你也認不得你老外公哩。你老外公乃大唐上國駕前御弟三藏法師之徒弟，姓孫，名悟空行者。若問老孫的手段，說出來，教你魂飛魄散，死在眼前。」那怪道：「我不曾會，你有甚麼手段，說來我聽。」行者笑道：「我兒子，你站穩著，仔細聽之。我："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    黒い男はそれを聞いて、ははっと冷ややかに笑った。「このならず者め。昨夜の火をつけたのは、やはりお前か。方丈の屋根で乱暴を働き、風を呼び起こしていたな。袈裟を一着持ってきたのは私だ。それをどうするつもりだ。お前はどこから来た。姓は何、名は何という。どれほどの腕があって、そんな大口をたたくのだ。」
    悟空「お前の爺さまも知らないのか。お前の爺さまは、大唐（だいとう）上国の帝のおん弟、三蔵法師（さんぞうほうし）の弟子だ。姓は孫（そん）、名は悟空、行者（ぎょうじゃ）とも呼ばれている。この俺の腕を聞きたいというなら、話しただけで魂が散り、お前はその場で死んじまうぞ。」
    黒い男「まだ手合わせをしたことがない。どんな腕があるのか、話して聞かせろ。」
    悟空は笑って言った。「息子よ、しっかり立って、よく聞いていろ。俺はな、
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "行者の「老外公」は敵を孫扱いする誇示的な自称。「お前の爺さま」とし、普通の一人称へ消していない。長い自伝詩は続く対訳単位まで一続きの発言である。"
- "id": "xy-ch17-012"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    自小神通手段高，隨風變化逞英豪。
    養性修真熬日月，跳出輪迴把命逃。
    一點誠心曾訪道，靈臺山上採藥苗。
    那山有個老仙長，壽年十萬八千高。
    老孫拜他為師父，指我長生路一條。
    他說身內有丹藥，外邊採取枉徒勞。
    得傳大品天仙訣，若無根本實難熬。
    回光內照寧心坐，身中日月坎離交。
    萬事不思全寡慾，六根清淨體堅牢。
    返老還童容易得，超凡入聖路非遙。
    三年無漏成仙體，不同俗輩受煎熬。
    十洲三島還遊戲，海角天涯轉一遭。
    活該三百多餘歲，不得飛昇上九霄。
    下海降龍真寶貝，才有金箍棒一條。
    花果山前為帥首，水簾洞裡聚群妖。
    玉皇大帝傳宣詔，封我齊天極品高。
    幾番大鬧靈霄殿，數次曾偷王母桃。
    天兵十萬來降我，層層密密布槍刀。
    戰退天王歸上界，哪吒負痛領兵逃。
    顯聖真君能變化，老孫硬賭跌平交。
    道祖觀音同玉帝，南天門上看降妖。
    卻被老君助一陣，二郎擒我到天曹。
    將身綁在降妖柱，即命神兵把首梟。
    刀砍鎚敲不得壞，又教雷打火來燒。
    老孫其實有手段，全然不怕半分毫。
    送在老君爐裡煉，六丁神火慢煎熬。
    日滿開爐我跳出，手持鐵棒遶天跑。
    縱橫到處無遮擋，三十三天鬧一遭。
    我佛如來施法力，五行山壓老孫腰。
    整整壓該五百載，幸逢三藏出唐朝。
    吾今皈正西方去，轉上雷音見玉毫。
    你去乾坤四海問一問，我是歷代馳名第一妖。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 140
    "line_end": 171
  "translation_ja": |-
    幼いころから神通の腕は高く、風に従い姿を変え、英雄の力を示した。
    性を養い真を修めて年月を重ね、輪廻を飛び出して命を逃れさせた。
    ひたすら真心をもって道を訪ね、霊台山（れいだいざん）で薬の苗を採ろうとした。
    その山には老いた仙人がおり、年は十万八千歳もの高齢だった。
    この俺はその人を師と仰ぎ、長生きへの一本道を示された。
    師は言った、丹薬は身の内にあり、外に採りに行くのは骨折り損だと。
    大品天仙訣（だいほんてんせんけつ）を授かったが、根本がなければ、まことに修めがたい。
    光を返して内を照らし、心を鎮めて座り、身の内の日月、坎（かん）と離（り）を交わらせる。
    何事も思わず欲をことごとく少なくし、六根（ろっこん）が清浄となって体も堅固になる。
    老いを返して童に戻るのはたやすく、凡を超えて聖に入る道も遠くない。
    三年にして無漏（むろ）の仙体を成し、俗人のように苦しみを受けずに済んだ。
    十洲三島（じっしゅうさんとう）にも遊び、海の果て天の果てをひと巡りした。
    もとは三百余歳の命で、九霄（きゅうしょう）へ飛び昇ることもかなわなかった。
    海へ下って竜を降し、真の宝、一本の金箍棒を手に入れた。
    花果山（かかざん）では頭領となり、水簾洞（すいれんどう）には群れなす妖怪を集めた。
    玉皇大帝（ぎょくこうたいてい）から詔が届き、斉天（せいてん）という極上の高い位に封ぜられた。
    何度も霊霄殿（れいしょうでん）で大暴れし、幾度となく王母（おうぼ）の桃を盗んだ。
    十万の天兵が俺を降そうと押し寄せ、槍と刀を幾重にも隙間なく並べた。
    天王（てんのう）を打ち破って天界へ追い返し、哪吒（なた）は傷を負って兵を率い逃げた。
    顕聖真君（けんせいしんくん）は変化に長け、この俺も全力で争って互角に渡り合った。
    道祖（どうそ）、観音（かんのん）、玉帝（ぎょくてい）は、南天門（なんてんもん）の上から妖怪退治を見物していた。
    ところが老君（ろうくん）が加勢したため、二郎（じろう）に捕らえられ、天の役所へ引き立てられた。
    降妖柱（こうようちゅう）に身を縛りつけられ、神兵に首を斬れと即座に命が下った。
    刀で斬っても鎚で叩いても壊れず、さらに雷で打ち、火で焼かせた。
    この俺には本物の腕があり、ほんのわずかも恐れはしなかった。
    老君の炉へ送り込まれて煉られ、六丁（りくてい）の神火でじわじわと焼かれた。
    日数が満ちて炉が開くと飛び出し、鉄棒を手に天を駆け回った。
    縦横に行く手を阻む者はなく、三十三天（さんじゅうさんてん）をひと暴れした。
    我らが仏、如来（にょらい）が法力を施し、五行山（ごぎょうざん）でこの俺の腰を押さえた。
    押さえつけられて丸五百年、幸い三蔵が唐（とう）の国から出てきた。
    今は正道に帰して西へ行き、雷音（らいおん）へ登って玉毫（ぎょくごう）を仰ぐのだ。
    天地四海に行って聞いてみろ。俺こそ代々名高い、第一の妖怪だ。」

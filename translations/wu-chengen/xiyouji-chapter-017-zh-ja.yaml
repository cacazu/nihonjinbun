  "source_text": "商議間，眾僧擺上晚齋，請他師徒們吃了。三藏教掌燈，仍去前面禪堂安歇。眾僧都挨牆倚壁，苫搭窩棚，各各睡下，只把後方丈讓與那上下院主安身。此時夜靜，但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 195
    "line_end": 195
  "translation_ja": "相談しているうちに、僧たちが夕べの斎食を並べ、師弟に食べてもらった。三蔵は灯をともさせ、また前の禅堂へ休みに行った。僧たちは壁際に寄り添い、むしろをかけて仮小屋を作り、それぞれ寝た。奥の方丈だけは、上下の院主たちに譲って休ませた。この時、夜は静まり、見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch17-029"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "銀河現影，玉宇無塵。滿天星燦爛，一水浪收痕。萬籟聲寧，千山鳥絕。溪邊漁火息，塔上佛燈昏。昨夜闍黎鐘鼓響，今宵一遍哭聲聞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    銀河は姿を現し、玉のような空に塵はない。
    満天の星はきらめき、一筋の川は波の跡を収める。
    あらゆる響きは静まり、幾千の山に鳥声も絶える。
    渓辺の漁火は消え、塔上の仏灯はほの暗い。
    昨夜は闍黎（じゃり）の鐘と太鼓が響いたのに、今宵は一面、泣き声ばかり聞こえる。
  "translation_status": "reviewed"
- "id": "xy-ch17-030"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "是夜在禪堂歇宿。那三藏想著袈裟，那裡得穩睡？忽翻身見窗外透白，急起叫道：「悟空，天明了，快尋袈裟去。」行者一骨魯跳將起來，一見眾僧侍立，供奉湯水，行者道：「你等用心伏侍我師父，老孫去也。」三藏下床，扯住道：「你往那裡去？」行者道：「我想這樁事都是觀音菩薩沒理，他有這個禪院在此，受了這裡人家香火，又容那妖精鄰住。我去南海尋他，與他講一講，教他親來問妖精討袈裟還我。」三藏道：「你這去，幾時回來？」行者道：「時少只在飯罷，時多只在晌午，就成功了。那些和尚可好伏侍，老孫去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 198
    "line_end": 198
  "translation_ja": |-
    その夜は禅堂で眠ったが、三蔵は袈裟が気にかかり、どうして安らかに寝られよう。ふと寝返りを打ち、窓の外が白むのを見ると、急いで起きて呼んだ。
    三蔵「悟空、夜が明けた。早く袈裟を捜しに行ってくれ。」
    悟空はがばと跳び起きると、僧たちが傍らに立ち、湯水を供えているのを見た。
    悟空「お前たち、心を込めてお師匠さまに仕えろ。この俺は出かけるぞ。」
    三蔵は床を下りて悟空をつかまえた。「どこへ行くのだ。」
    悟空「考えてみれば、この一件はすべて観音菩薩（かんのんぼさつ）さまに道理がないのです。ここに禅院を置き、この辺りの人々から香を供えてもらいながら、あの妖怪を隣に住まわせておいでですからね。南海（なんかい）へ行ってお会いし、話をして、ご自身で来て妖怪から袈裟を取り返し、私に渡していただきます。」
    三蔵「行ったら、いつ戻るのだ。」
    悟空「早ければ朝食が済むころ、遅くても正午には、首尾よく片がつきます。そこの和尚ども、よくお世話をしろ。この俺は行くぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch17-031"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說聲去，早已無蹤。須臾間到了南海，停雲觀看。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 200
    "line_end": 200
  "translation_ja": "行くと言ったときには、もう姿はなかった。たちまち南海に着き、雲を止めて眺める。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch17-032"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "汪洋海遠，水勢連天。祥光籠宇宙，瑞氣照山川。千層雪浪吼青霄，萬疊煙波滔白晝。水飛四野，浪滾週遭。水飛四野振轟雷，浪滾週遭鳴霹靂。休言水勢，且看中間。五色朦朧寶疊山，紅黃紫皂綠和藍。才見觀音真勝境，試看南海落伽山。好去處，山峰高聳，頂透虛空。中間有千樣奇花，百般瑞草。風搖寶樹，日映金蓮。觀音殿，瓦蓋琉璃；潮音洞，門鋪玳瑁。綠楊影裡語鸚哥，紫竹林中啼孔雀。羅紋石上，護法威嚴；瑪瑙灘前，木叉雄壯。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 202
    "line_end": 202
  "translation_ja": |-
    広々とした海は遠く延び、水の勢いは天へと続く。
    めでたい光が宇宙を包み、瑞気が山川を照らす。
    千重の雪のような波が青空に吠え、万重もの煙る波が真昼にうねる。
    水は四方へ飛び、波は周りに渦巻く。
    四方へ飛ぶ水は轟く雷を震わせ、周りに渦巻く波は霹靂を鳴らす。
    水の勢いはさておいて、その真ん中を見てみよう。
    五色がおぼろに重なる宝の山、紅、黄、紫、黒、緑に藍。
    ここに初めて観音の真の勝境を見る、南海の落伽山（らっかさん）をご覧あれ。
    よい所だ、峰は高くそびえ、頂は虚空を貫く。
    中には千種の珍しい花、百様のめでたい草。
    風は宝の木を揺らし、日は金蓮（こんれん）を照らす。
    観音殿（かんのんでん）は琉璃（るり）の瓦で葺き、潮音洞（ちょうおんどう）は玳瑁（たいまい）で門を飾る。
    緑の柳の陰では鸚哥（いんこ）がしゃべり、紫竹林（しちくりん）では孔雀が鳴く。
    羅紋石（らもんせき）の上では護法の神々が厳めしく、瑪瑙灘（めのうたん）の前では木叉（もくさ）が雄々しい。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は「五色」といいながら紅・黄・紫・黒・緑・藍の六つを列挙する。五色を六色へ改めず、列挙も省略しなかった。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "羅紋石・瑪瑙灘は聖域の景物として表記を保持した。物質的な組成や実在地点への同定は断定していない。"
- "id": "xy-ch17-033"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者觀不盡那異景非常，徑直按雲頭，到竹林之下。早有諸天迎接道：「菩薩前者對眾言大聖歸善，甚是宣揚。今保唐僧，如何得暇到此？」行者道：「因保唐僧，路逢一事，特見菩薩，煩為通報。」諸天遂來洞口報知，菩薩喚入。行者遵法而行，至寶蓮臺下拜了。菩薩問曰：「你來何幹？」行者道：「我師父路遇你的禪院，你受了人間香火，容一個黑熊精在那裡鄰住，著他偷了我師父袈裟，屢次取討不與，今特來問你要的。」菩薩道：「這猴子說話，這等無狀。既是熊精偷了你的袈裟，你怎來問我取討？都是你這個孽猴大膽，將寶貝賣弄，拿與小人看見，你卻又行兇，喚風發火，燒了我的留雲下院，反來我處放刁。」行者見菩薩說出這話，知他曉得過去未來之事，慌忙禮拜道：「菩薩，乞恕弟子之罪，果是這般這等。但恨那怪物不肯與我袈裟，師父又要念那話兒咒語，老孫忍不得頭疼，故此來拜煩菩薩。望菩薩慈悲之心，助我去拿那妖精，取衣西進也。」菩薩道：「那怪物有許多神通，卻也不亞於你。也罷，我看唐僧面上，和你去走一遭。」行者聞言，謝恩再拜。即請菩薩出門，遂同駕祥雲，早到黑風山，墜落雲頭，依路找洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 203
    "line_end": 203
  "translation_ja": |-
    悟空は、この並々ならぬ珍しい景色を見尽くす間もなく、まっすぐ雲を下ろし、竹林の下へ着いた。早くも諸天（しょてん）が迎えた。
    諸天「菩薩さまは先ごろ、大聖（たいせい）が善に帰したと皆におっしゃって、大いにお褒めになりました。今は唐僧をお守りしておいでなのに、どうしてこちらへ来る暇がおありなのですか。」
    悟空「唐僧を守る道中で一つ事件が起こり、菩薩さまにお会いしに参りました。どうかお取り次ぎを。」
    諸天は洞の口へ行って知らせ、観音菩薩は中へ入るよう命じた。悟空は礼法に従って進み、宝蓮台（ほうれんだい）の下に至って礼拝した。
    観音菩薩「何をしに来たのです。」
    悟空「お師匠さまが旅の途中、あなたの禅院に行き着きました。あなたは人々から香を供えてもらいながら、黒熊の精を近くに住まわせ、私のお師匠さまの袈裟を盗ませたのです。何度返せと言っても返しませんので、今日は特に、あなたから取り返そうと来たのです。」
    観音菩薩「この猿は、何という無礼な口のきき方をするのでしょう。熊の精が袈裟を盗んだというのに、なぜ私へ取り立てに来るのですか。すべてはお前という不届きな猿が大胆にも宝物を見せびらかし、つまらぬ者たちの目に触れさせたせいでしょう。そのうえ乱暴を働き、風を呼び火を起こして、私の留雲下院（りゅううんげいん）を焼いておきながら、逆に私の所へ言いがかりをつけに来るとは。」
    悟空はこの言葉を聞き、観音菩薩が過去も未来も知っていると悟ったので、慌てて礼拝した。
    悟空「菩薩さま、どうか弟子の罪をお許しください。まことに、おっしゃるとおりです。ただ、あの妖怪がどうしても袈裟を返さず、お師匠さまはまたあの呪文を唱えようとなさいます。この俺は頭の痛みに耐えられないので、こうして菩薩さまにお願いに参ったのです。どうか慈悲のお心で、あの妖怪を捕まえるのをお助けください。袈裟を取り戻して西へ進めるように。」
    観音菩薩「あの妖怪は多くの神通を持ち、お前にも劣りません。よいでしょう。唐僧に免じて、お前と一緒に出かけてあげましょう。」
    悟空は恩に感謝して再び拝んだ。すぐ観音菩薩に外へお出ましいただき、ともに瑞雲に乗ると、たちまち黒風山へ着いた。雲を下り、道に沿って洞を捜した。
  "translation_status": "reviewed"
- "id": "xy-ch17-034"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正行處，只見那山坡前走出一個道人，手拿著一個玻璃盤兒，盤內安著兩粒仙丹，往前正走。被行者撞個滿懷，掣出棒，就照頭一下，打得腦裡漿流出，腔中血迸攛。菩薩大驚道：「你這個猴子，還是這等放潑。他又不曾偷你袈裟，又不與你相識，又無甚冤仇，你怎麼就將他打死？」行者道：「菩薩，你認他不得，他是那黑熊精的朋友。他昨日和一個白衣秀士，都在芳草坡前坐講。後日是黑精的生日，請他們來慶佛衣會。今日他先來拜壽，明日來慶佛衣會。所以我認得，定是今日替那妖去上壽。」菩薩說：「既是這等說來，也罷。」行者才去把那道人提起來看，卻是一隻蒼狼。傍邊那個盤兒底下卻有字，刻道「凌虛子製」。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 204
    "line_end": 204
  "translation_ja": |-
    歩いていると、山の坂の前から一人の道人が出てきた。手には玻璃（はり）の皿を持ち、皿には仙丹（せんたん）が二粒載っている。前へ歩いてくるところへ悟空が正面からぶつかり、棒を抜いて頭を一撃した。頭から脳漿が流れ、体から血が噴き出した。観音菩薩はひどく驚いた。
    観音菩薩「お前という猿は、まだそんな無法を働くのですか。この者は袈裟を盗んでもいないし、お前と知り合いでもなく、何の恨みもないのに、どうしていきなり殺したのです。」
    悟空「菩薩さまはご存じないでしょうが、こいつはあの黒熊の精の友人です。昨日、白衣秀士とともに、芳草の坂に座って話していたのです。明後日が黒い精の誕生日なので、仏衣会を祝いに来るよう招かれていました。今日はまず誕生祝いに来て、明日は仏衣会を祝うというのです。ですから私はこいつを知っています。きっと今日、あの妖怪の誕生祝いに行くところだったのでしょう。」
    観音菩薩「そういう事情だというなら、まあよいでしょう。」
    悟空が道人を持ち上げてみると、一匹の蒼い狼だった。傍らの皿の底には字があり、「凌虚子（りょうきょし）製」と刻まれていた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "ここで行者は「後日」が誕生日と言いながら「今日」祝寿し「明日」仏衣会と述べる。前日の会話との日付のずれを訂正していない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「蒼狼」は蒼い狼と訳し、特定の動物種や現代的な毛色分類に断定しない。"
- "id": "xy-ch17-035"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，笑道：「造化，造化，老孫也是便益，菩薩也是省力。這怪叫做不打自招，那怪教他今日了劣。」菩薩說道：「悟空，這教怎麼說？」行者道：「菩薩，我悟空有一句話兒，叫做將計就計，不知菩薩可肯依我？」菩薩道：「你說。」行者說道：「菩薩，你看這盤兒中是兩粒仙丹，便是我們與那妖魔的贄見；這盤兒後面刻的四個字，說『凌虛子製』，便是我們與那妖魔的勾頭。菩薩若要依得我時，我好替你作個計較，也就不須動得干戈，也不須勞得征戰，妖魔眼下遭瘟，佛衣眼下出現；菩薩要不依我時，菩薩往西，我悟空往東，佛衣只當相送，唐三藏只當落空。」菩薩笑道：「這猴熟嘴。」行者道：「不敢，倒是一個計較。」菩薩說：「你這計較怎說？」行者道：「這盤上刻那『凌虛子製』，想這道人就叫做凌虛子。菩薩，你要依我時，可就變做這個道人，我把這丹吃了一粒，變上一粒，略大些兒。菩薩，你就捧了這個盤兒、兩粒仙丹，去與那妖上壽，把這丸大些的讓與那妖。待那妖一口吞之，老孫便於中取事：他若不肯獻出佛衣，老孫將他肚腸就也織將一件出來。」菩薩沒法，只得也點點頭兒依他。行者笑道：「如何？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 205
    "line_end": 205
  "translation_ja": |-
    悟空はそれを見ると笑った。「運がいい、運がいい。この俺も得をするし、菩薩さまも手間が省けます。こいつは責められもせず自白したようなもの。あいつも今日でおしまいにしてやれます。」
    観音菩薩「悟空、それはどういうことです。」
    悟空「菩薩さま、私、悟空には一つ案があります。相手の計略を逆に使うというものですが、私の言うとおりになさってくださいますか。」
    観音菩薩「言ってごらんなさい。」
    悟空「菩薩さま、ご覧なさい。皿の中の二粒の仙丹は、あの妖魔へのお目通りの贈り物になります。この皿の裏の『凌虚子製』という四文字は、妖魔に取り入る手づるになります。菩薩さまが私に従ってくださるなら、よい策を立てましょう。武器を動かす必要もなく、戦いでご苦労をかけることもなく、妖魔はたちまち災いに遭い、仏衣はたちまち出てきます。従ってくださらないなら、菩薩さまは西へ、私、悟空は東へ行きます。仏衣はくれてやったと思い、唐三蔵（とうさんぞう）は当てが外れたと思えばよいのです。」
    観音菩薩は笑った。「この猿は、口が達者ですね。」
    悟空「とんでもない、ただの策です。」
    観音菩薩「その策というのは、どういうものですか。」
    悟空「皿に『凌虚子製』と刻んであるのですから、この道人は凌虚子というのでしょう。菩薩さま、私の言うとおりになさるなら、この道人に化けてください。私が丹を一粒食べ、その代わりに、少し大きめの一粒に化けます。菩薩さまはこの皿と二粒の仙丹を持ち、妖怪の誕生祝いに行って、大きめの一粒を奴へ勧めてください。奴がひと口に飲み込めば、この俺が腹の中で働きます。仏衣を差し出そうとしなければ、奴の腸で一着織ってやりますよ。」
    観音菩薩も仕方がなく、うなずいて従った。悟空は笑って言った。「どうです。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「勾頭」は妖怪に取り入る手づるの意味と解した。皿に刻まれた「凌虛子製」という四文字から道人の名を推測するのは、行者の推論として訳した。"
- "id": "xy-ch17-036"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "爾時菩薩迺以廣大慈悲，無邊法力，億萬化身，以心會意，以意會身，恍惚之間，變作凌虛仙子："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 207
    "line_end": 207
  "translation_ja": "その時、観音菩薩は広大な慈悲、果てしない法力、億万の化身の力をもって、心を意に合わせ、意を身に合わせた。たちまち、あの道人、凌虚子の姿へと変わった。"
  "translation_status": "reviewed"
- "id": "xy-ch17-037"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    鶴氅仙風颯，飄颻欲步虛。
    蒼顏松柏老，秀色古今無。
    去去還無住，如如自有殊。
    總來歸一法，只是隔邪軀。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 208
    "line_end": 211
  "translation_ja": |-
    鶴氅（かくしょう）に仙風がさっと吹き、ひらひらと虚空を歩もうとする。
    その顔は松柏のように老成し、優れた姿は古今に比べるものがない。
    行きに行きても、とどまることはなく、如如（にょにょ）にありながら、おのずから違いを現す。
    すべてを合わせれば一つの法に帰し、ただ邪なる体を隔てているばかり。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「蒼顏」は青い顔色ではなく老成した容貌の意として訳した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「去去還無住，如如自有殊」「只是隔邪軀」は、変化と不変の真理を重ねる難句。行く・とどまらない・如如・相違・邪なる体の対比を残し、特定の教学体系による解釈へ固定しない。"
- "id": "xy-ch17-038"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看道：「妙啊，妙啊！還是妖精菩薩，還是菩薩妖精？」菩薩笑道：「悟空，菩薩、妖精，總是一念；若論本來，皆屬無有。」行者心下頓悟，轉身卻就變做一粒仙丹："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 213
    "line_end": 213
  "translation_ja": |-
    悟空は見て言った。「見事、見事！　これは妖怪の菩薩なのか、それとも菩薩の妖怪なのか。」
    観音菩薩は笑った。「悟空、菩薩も妖怪も、すべては一念です。本来のありさまを論ずれば、どちらも有るものではありません。」
    悟空は胸中でたちどころに悟り、身を返すと、一粒の仙丹に化けた。
  "translation_status": "reviewed"
- "id": "xy-ch17-039"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    走盤無不定，圓明未有方。
    三三勾漏合，六六少翁商。
    瓦鑠黃金焰，牟尼白晝光。
    外邊鉛與汞，未許易論量。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 215
    "line_end": 218
  "translation_ja": |-
    皿を転がっても定まらぬことはなく、丸く明るく、四角いところはない。
    三三は勾漏（こうろう）が合わせ、六六は少翁（しょうおう）が量る。
    瓦鑠（がしゃく）には黄金の炎、牟尼（むに）には真昼の光。
    外側の鉛と水銀を、軽々しく論じ量ることはできぬ。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「三三勾漏合、六六少翁商」は煉丹の数と故事を含む難句。三三・六六の数をそのまま残し、「勾漏」を葛洪の呼称とする解釈と、「少翁」を漢武帝の方士とする解釈には留保を付した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「瓦鑠」は底本の字を保持した。別本文に見える「瓦鉢」へ置き換えず、語義未確定の難句として残す。「牟尼」は光り輝く珠の表現と解したが、摩尼宝珠との関係は推定。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "この詩の鉛・水銀や火の描写は文学上・修行上の比喩であり、実際に薬を調製・服用する指示ではない。"
- "id": "xy-ch17-040"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者變了那顆丹，終是略大些兒。菩薩認定，拿了那個玻璃盤兒，徑到妖洞門口看時，果然是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 220
    "line_end": 220
  "translation_ja": "悟空の化けた丹は、やはり少し大きかった。観音菩薩はそれをよく見定め、玻璃の皿を手にして、まっすぐ妖怪の洞の口へ行った。見ると、果たして、"
  "translation_status": "reviewed"
- "id": "xy-ch17-041"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": "崖深岫險，雲生嶺上；柏蒼松翠，風颯林間。崖深岫險，果是妖邪出沒人煙少；柏蒼松翠，也可仙真修隱道情多。山有澗，澗有泉，潺潺流水咽鳴琴，便堪洗耳；崖有鹿，林有鶴，幽幽仙籟動間岑，亦可賞心。這是妖仙有分降菩提，弘誓無邊垂惻隱。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 222
    "line_end": 222
  "translation_ja": |-
    崖は深く、山穴は険しく、嶺の上には雲が湧く。
    柏は蒼く、松は翠に、林の間には風がさっと吹く。
    崖が深く山穴が険しければ、妖邪が出入りし、人の住まいも少ない。
    柏が蒼く松が翠なら、仙人が隠れ修行するにもよく、道の趣も豊かだ。
    山には谷川、谷川には泉、さらさら流れる水は琴をむせぶように鳴らし、耳を洗うのにふさわしい。
    崖には鹿、林には鶴、かすかな仙界の響きが静かな峰を動かし、心を楽しませるにもよい。
    これこそ妖仙にも縁があって菩提に服し、果てしない弘誓（ぐぜい）が憐れみを垂れるところ。
  "translation_status": "reviewed"
- "id": "xy-ch17-042"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩看了，心中暗喜道：「這孽畜占了這座山洞，卻是也有些道分。」因此心中已是有個慈悲。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 224
    "line_end": 224
  "translation_ja": |-
    観音菩薩は眺めると、心の内で喜んだ。「この不届きな獣も、こんな山の洞を住まいにしているのなら、いくらか道に縁があるのですね。」
    そこで、すでに心には慈悲の思いが生じていた。
  "translation_status": "reviewed"
- "id": "xy-ch17-043"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "走到洞口，只見守洞小妖都有些認得道：「凌虛仙長來了。」一邊傳報，一邊接引。那妖早已迎出門道：「凌虛，有勞仙駕珍顧，蓬蓽有輝。」菩薩道：「小道敬獻一粒仙丹，敢稱千壽。」他二人拜畢，方才坐定，又敘起他昨日之事。菩薩不答，連忙拿丹盤道：「大王，且見小道鄙意。」覷定一粒大的，推與那妖道：「願大王千壽。」那妖亦推一粒，遞與菩薩道：「願與凌虛子同之。」讓畢，那妖才待要咽，那藥順口兒一直滾下。現了本相，理起四平。那妖滾倒在地。菩薩現相，問妖取了佛衣。行者早已從鼻孔中出去。菩薩又怕那妖無禮，卻把一個箍兒丟在那妖頭上。那妖起來，提槍要刺，行者、菩薩早已起在空中，將真言念起。那怪依舊頭疼，丟了槍，滿地亂滾。半空裡笑倒個美猴王，平地下滾壞個黑熊怪。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 225
    "line_end": 225
  "translation_ja": |-
    洞の口へ歩いていくと、守っていた小妖怪たちはそれぞれ見覚えがあったので、言った。「凌虚仙長（りょうきょせんちょう）がおいでです。」
    知らせを伝えながら案内すると、黒熊の妖怪は早くも門へ迎えに出た。
    黒熊の妖怪「凌虚（りょうきょ）、わざわざお越しくださり、かたじけない。この粗末な家も輝きを得ました。」
    観音菩薩「道士の私から、謹んで仙丹を一粒献じ、千年の長寿をお祝い申し上げます。」
    二人は挨拶を終え、座ったばかりで、妖怪がまた昨日の出来事を話し始めた。観音菩薩は答えず、急いで丹の皿を持ち出した。
    観音菩薩「大王、まずは道士の私の心ばかりの品をご覧ください。」
    観音菩薩は大きい一粒を見定め、妖怪に勧めて言った。「大王の千年の長寿をお祈りします。」
    黒熊の妖怪も一粒を取り、観音菩薩へ渡した。「凌虚子とともに、そうありたいものです。」
    譲り合いが済み、妖怪が飲み込もうとしたその時、薬は口からまっすぐ転がり落ちた。悟空は本来の姿を現し、四肢を張って構えた。妖怪は地面へ転げ倒れた。観音菩薩も本来の姿を現し、妖怪に求めて仏衣を取り返した。悟空は早くも鼻の穴から出ていた。観音菩薩は妖怪が無礼を働くのを恐れ、輪を一つ、その頭へ投げかけた。妖怪が起き上がり、槍を取って突こうとした時には、悟空と観音菩薩はすでに空へ上がり、観音菩薩が真言を唱え始めた。妖怪はやはり頭が痛み、槍を放り出して、地面を転げ回った。空中では悟空が笑い転げ、地上では黒熊の妖怪が転げ苦しんだ。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「現了本相、理起四平」は、飲み込まれた行者が元の姿に戻り、体を張って構える動作と解した。腹の中での具体的な打撃動作は本文にないため追加しなかった。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "真言を唱える主語は、呪を知り輪を与えた観音菩薩と文脈上判断した。底本にはこの箇所の主語が明記されていない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "頭痛に「依舊」とあるが、それ以前の頭痛を補わず、「やはり頭が痛み」と訳した。輪の固有名は原文にないので、他の回に出る特定の箍へ独自同定していない。"
- "id": "xy-ch17-044"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩道：「孽畜，你如今可皈依麼？」那怪滿口道：「心願皈依，只望饒命。」行者恐耽擱了工夫，意欲就打。菩薩急止住道：「休傷他命，我有用他處哩。」行者道：「這樣怪物，不打死他，反留他在何處用哩？」菩薩道：「我那落伽山後無人看管，我要帶他去做個守山大神。」行者笑道：「誠然是個救苦慈尊，一靈不損。若是老孫有這樣咒語，就念上他娘千遍。這回兒就有許多黑熊，都教他了帳。」卻說那怪甦醒多時，公道難禁疼痛，只得跪在地下哀告道：「但饒性命，願皈正果。」菩薩方墜落祥光，又與他摩頂受戒，教他執了長槍，跟隨左右。那黑熊才一片野心今日定，無窮頑性此時收。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 226
    "line_end": 226
  "translation_ja": |-
    観音菩薩「不届きな獣よ、今なら帰依しますか。」
    黒熊の妖怪はすぐに答えた。「心から帰依いたします。どうか命ばかりはお助けください。」
    悟空は時間を取られるのを恐れ、打ちかかろうとしたが、観音菩薩は急いで止めた。「命を傷つけてはなりません。私にはこの者を使う所があるのです。」
    悟空「こんな妖怪を殺さずに、どこに置いて使うのですか。」
    観音菩薩「私の落伽山の裏には、見張る者がいません。連れて帰り、山を守る大神にしようと思います。」
    悟空は笑った。「さすがは苦しみを救う慈悲のお方、一つの魂も損なおうとなさらない。この俺にそんな呪文があったら、ちくしょう、千遍も唱えてやります。そうすれば黒熊がどれほどいても、みな片をつけてやるところです。」
    さて、妖怪は気を取り戻してしばらくたっても、どうしても痛みに耐えられず、やむなく地面にひざまずいて哀願した。「命さえお助けくだされば、正しい悟りに帰依いたします。」
    そこで観音菩薩は瑞光を下ろして降り、妖怪の頭をなでて戒を授け、長槍を持ち、身近に付き従うよう命じた。黒熊の野放図な心は今日ようやく鎮まり、果てしない頑なさも、この時収まった。
  "translation_status": "reviewed"

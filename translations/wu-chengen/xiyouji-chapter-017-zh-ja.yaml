- "id": "xy-ch17-045"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩吩咐道：「悟空，你回去罷，好生伏侍唐僧，以後再休懈惰生事。」行者道：「深感菩薩遠來，弟子還當回送回送。」菩薩道：「免送。」行者才捧著袈裟，叩頭而別。菩薩亦帶了熊羆，徑回大海。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 228
    "line_end": 228
  "translation_ja": |-
    観音菩薩は言いつけた。「悟空、お前は戻りなさい。よく唐僧に仕え、今後は怠けて騒ぎを起こしてはなりません。」
    悟空「菩薩さまが遠くまでおいでくださり、深く感謝いたします。弟子の私からも、お送り申し上げるべきでしょう。」
    観音菩薩「見送りは要りません。」
    悟空は袈裟を両手で捧げ持ち、頭を地につけて別れた。観音菩薩も黒熊の妖怪を連れ、まっすぐ大海へ帰った。これを証する詩がある。詩にいう。
  "translation_status": "reviewed"
- "id": "xy-ch17-046"
  "section_id": "chapter-17"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    祥光靄靄凝金像，萬道繽紛實可誇。
    普濟世人垂憫恤，遍觀法界現金蓮。
    今來多為傳經意，此去原無落點瑕。
    降怪成真歸大海，空門復得錦袈裟。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 230
    "line_end": 233
  "translation_ja": |-
    めでたい光はたなびいて金の姿に凝り、万筋に彩り広がるさまは、まことに見事。
    広く世の人を救って憐れみを垂れ、法界（ほっかい）をくまなく観じて金蓮を現す。
    今ここへ来たのは主として経を伝えるため、ここを去るにも一点の瑕疵を残さない。
    妖怪を降して真の道へ成就させ、大海へ帰り、仏門は再び錦の袈裟を手に入れた。
  "translation_status": "reviewed"
- "id": "xy-ch17-047"
  "section_id": "chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後事情如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch17-2597258"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第017回&oldid=2597258"
    "line_start": 235
    "line_end": 235
  "translation_ja": "さて、この先のことがどうなるのかは、次回の話をお聞きいただきたい。"
  "translation_status": "reviewed"

    "message_ja": "冒頭では誕生日が明後日、仏衣の祝宴が明日とされ、道人は明日祝寿し明後日宴に来ると言う。後の再話にも明日・明後日のずれがあるが、原文どおりに残した。"
  - "kind": "uncertain_translation"

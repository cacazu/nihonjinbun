    "translation_ja": |-
      第七十八回
      比丘は子らを憐れんで陰の神々を遣わし、金殿で魔を見破って道徳を論ず
    "translation_status": "draft"
  - "id": "xy-ch78-002"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一念才生動百魔，修持最苦奈他何。
      但憑洗滌無塵垢，也用收拴有琢磨。
      掃退萬緣歸寂滅，蕩除千怪莫蹉跎。
      管教跳出樊籠套，行滿飛昇上大羅。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 122
        "line_end": 125
    "translation_ja": |-
      ひとたび思いが芽生えれば、百もの魔が動きだす。
      修行に励む苦しさを、どうしてしのげばよいのだろう。
      心を洗って塵も垢もなくすだけでなく、
      しっかり引き締め、磨き上げねばならぬ。
      あらゆる縁への執着を払い、静かな悟りへ帰り、
      千もの魔を掃き払って、時をむなしく過ごすな。
      そうすれば必ず、身を縛る籠と縄を抜け出し、
      修行を成し遂げて飛び立ち、大羅（だいら）へ昇れるだろう。
    "translation_status": "draft"
  - "id": "xy-ch78-003"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說孫大聖用盡心機，請如來收了眾怪，解脫三藏師徒之難，離獅駝城西行。又經數月，早值冬天。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 127
        "line_end": 127
    "translation_ja": "さて悟空（ごくう）はあらゆる手を尽くし、如来（にょらい）に妖怪たちを取り押さえてもらって、三蔵（さんぞう）一行の危難を解いた。そして獅駝城（しだじょう）を離れ、西へ進んだ。それからまた数か月が過ぎ、もう冬になっていた。見れば、"
    "translation_status": "draft"
  - "id": "xy-ch78-004"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      嶺梅將破玉，池水漸成冰。
      紅葉俱飄落，青松色更新。
      淡雲飛欲雪，枯草伏山平。
      滿目寒光迥，陰陰透骨冷。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 129
        "line_end": 132
    "translation_ja": |-
      峰の梅は、玉のようなつぼみを開こうとし、
      池の水は、少しずつ氷に変わる。
      赤い葉はすっかり散り落ち、
      青い松はいよいよ色鮮やか。
      淡い雲が流れ、今にも雪になりそうだ。
      枯れ草は伏して、山肌を平らにならす。
      見渡すかぎり、寒々とした光が遠くまで広がり、
      ひしひしとした冷たさが、骨までしみる。
    "translation_status": "draft"
  - "id": "xy-ch78-005"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們沖寒冒冷，宿雨餐風。正行間，又見一座城池。三藏問道：「悟空，那廂又是甚麼所在？」行者道：「到跟前自知。若是西邸王位，須要倒換關文；若是府州縣，徑過。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      師弟は寒さをものともせず、雨の中で眠り、風に吹かれて食事をしながら旅を続けた。進んでいくと、また一つの城郭が見えてきた。
      三蔵「悟空、あそこは何という所だろう。」
      悟空「近くまで行けば分かります。西の国の王都なら通行証に認証をもらわねばなりませんが、府や州や県の町なら、そのまま通り抜けましょう。」
    "translation_status": "draft"
  - "id": "xy-ch78-006"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒言語未畢，早至城門之外。三藏下馬，一行四眾，進了月城。見一個老軍在向陽牆下，偎風而睡。行者近前，搖他一下，叫聲：「長官。」那老軍猛然驚覺，麻麻糊糊的睜開眼，看見行者，連忙跪下磕頭，叫：「爺爺。」行者道：「你休胡驚作怪。我又不是甚麼惡神，你叫爺爺怎的？」老軍磕頭道：「你是雷公爺爺。」行者道：「胡說。吾乃東土去西天取經的僧人。適才到此，不知地名，問你一聲的。」那老軍聞言，卻才正了心，打個啊欠，爬起來，伸伸腰道：「長老，長老，恕小人之罪。此處地方，原喚比丘國，今改作小子城。」行者道：「國中有帝王否？」老軍道：「有有有。」行者卻轉身對唐僧道：「師父，此處原是比丘國，今改小子城，但不知改名之意何故也。」唐僧疑惑道：「既云比丘，又何云小子？」八戒道：「想是比丘王崩了，新立王位的是個小子，故名小子城。」唐僧道：「無此理，無此理。我們且進去，到街坊上再問。」沙僧道：「正是。那老軍一則不知，二則被大哥諕得胡說。且入城去詢問。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      話し終わらないうちに、もう城門の外へ着いた。三蔵は馬を下り、四人で月城（げつじょう）へ入った。日当たりのよい城壁の下に、老兵が一人、風を避けて眠っていた。悟空はそばへ寄って、その体を一つ揺すった。
      悟空「お役人さん。」
      老兵ははっと目を覚まし、寝ぼけまなこを開けた。悟空の顔を見るなり、慌ててひざまずき、頭を地面に打ちつけた。
      老兵「おじいさま！」
      悟空「むやみに驚いて、変な真似をするな。俺は恐ろしい神でもないのに、どうしておじいさまなんて呼ぶんだ。」
      老兵は頭を下げたまま言った。
      老兵「雷公（らいこう）のおじいさまではありませんか。」
      悟空「ばかなことを言うな。俺は東土（とうど）から西天（さいてん）へ経を取りに行く僧だ。今ここへ着いたばかりで、土地の名を知らないから、ちょっと尋ねたんだ。」
      これを聞き、老兵はようやく気を落ち着けた。あくびを一つして起き上がり、腰を伸ばした。
      老兵「お坊さま、お坊さま、私めの無礼をお許しください。ここは、もとは比丘国（びくこく）と申しましたが、今は小子城（しょうしじょう）と呼ぶようになりました。」
      悟空「この国に王はいるのか。」
      老兵「はい、います、います。」
      悟空は三蔵の方を向いた。
      悟空「お師匠さま、ここはもと比丘国といい、今は小子城と呼ぶそうです。ただ、なぜ名を変えたのかは分かりません。」
      三蔵は不思議がった。
      三蔵「僧という意味の名だったのに、なぜ今度は子供なのだろう。」
      八戒（はっかい）「比丘国の王が死んで、新しく王になったのが小僧だから、小子城というんじゃないですか。」
      三蔵「そんなはずはない、そんなはずはない。とにかく中へ入って、町でもう一度聞いてみよう。」
      沙悟浄（さごじょう）「そうしましょう。あの老兵は事情を知らないうえに、兄さんに驚かされて、でたらめを言ったのかもしれません。城内へ入って尋ねましょう。」
    "translation_status": "draft"
  - "id": "xy-ch78-007"

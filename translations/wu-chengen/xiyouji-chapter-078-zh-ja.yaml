    "source_text": "又入三層門裡，到通衢大市觀看，倒也衣冠濟楚，人物清秀。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 137
        "line_end": 137
    "translation_ja": "さらに三重の門をくぐり、大通りの市へ出て眺めると、人々の身なりはきちんとして、顔立ちもすっきりしていた。その様子は、"
    "translation_status": "draft"
  - "id": "xy-ch78-008"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      酒樓歌館語聲喧，彩鋪茶房高掛帘。
      萬戶千門生意好，六街三市廣財源。
      買金販錦人如蟻，奪利爭名只為錢。
      禮貌莊嚴風景盛，河清海晏太平年。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 138
        "line_end": 141
    "translation_ja": |-
      酒楼や歌の館には、にぎやかな話し声、
      彩りの布を売る店や茶屋には、すだれが高く掛かる。
      万の家、千の門で、商いはよく繁盛し、
      六つの街路、三つの市場へ、広く富が流れ込む。
      金を買い、錦を売る人は、蟻の群れのよう。
      利を奪い、名を争うのも、すべて金のため。
      礼儀も身のこなしも立派で、町の景色は栄え、
      河は清く、海も穏やかな、太平の世であった。
    "translation_status": "draft"
  - "id": "xy-ch78-009"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒四眾牽著馬，挑著擔，在街市上行夠多時，看不盡繁華氣概，但只見家家門口一個鵝籠。三藏道：「徒弟啊，此處人家都將鵝籠放在門首，何也？」八戒聽說，左右觀之，果是鵝籠，排列五色綵緞遮幔。獃子笑道：「師父，今日想是黃道良辰，宜結婚姻會友，都行禮哩。」行者道：「胡談，那裡就家家都行禮？其間必有緣故，等我上前看看。」三藏扯住道：「你莫去，你嘴臉醜陋，怕人怪你。」行者道：「我變化個兒去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      四人は馬を引き、荷を担いで、長いこと通りを歩いた。繁華な眺めは見尽くせなかったが、どの家の門口にも、一つずつ鵞鳥用の籠が置いてあるのが目に留まった。
      三蔵「お前たち、ここではどの家も門口に鵞鳥の籠を出しているが、どういうわけだろう。」
      八戒が左右を見回すと、なるほど、色とりどりの絹の覆いを掛けた鵞鳥の籠が並んでいた。八戒は笑った。
      八戒「お師匠さま、今日はきっと、結婚や友達との集まりに向いた吉日なんでしょう。みんなお祝いをしているんですよ。」
      悟空「でたらめを言うな。どの家も一斉に祝い事をするものか。何かわけがあるに違いない。俺が近くへ行って見てこよう。」
      三蔵は悟空を引き止めた。
      三蔵「行ってはならない。お前は顔が恐ろしいから、怪しまれるかもしれない。」
      悟空「姿を変えて見てきます。」
    "translation_status": "draft"
  - "id": "xy-ch78-010"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，捻著訣，念聲咒語，搖身一變，變作一個蜜蜂兒，展開翅，飛近邊前，鑽進幔裡觀看，原來裡面坐的是個小孩兒。再去第二家籠裡看，也是個小孩兒。連看八九家，都是個小孩兒。卻是男身，更無女子。有的坐在籠中頑耍，有的坐在裡邊啼哭；有的吃果子，有的或睡坐。行者看罷，現原身，回報唐僧道：「那籠裡是些小孩子，大者不滿七歲，小者只有五歲，不知何故。」三藏見說，疑思不定。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      さすがは悟空、指で印を結び、呪文を唱えて身を振ると、一匹の蜜蜂に変わった。羽を広げて籠へ飛び、覆いの中へ潜り込んで見ると、中に座っているのは小さな子供だった。二軒目の籠へ行っても、やはり小さな子供がいる。続けて八、九軒を見たが、どこも子供ばかりだった。しかも男の子ばかりで、女の子は一人もいない。籠の中で遊んでいる子もいれば、泣いている子もいる。果物を食べる子、眠る子、ただ座っている子もいた。悟空は調べ終えると元の姿に戻り、三蔵に報告した。
      悟空「籠にいるのは子供たちです。大きい子でも七歳にならず、小さい子はまだ五歳です。なぜ入れているのかは分かりません。」
      三蔵はそれを聞いて、どうしたことかと思い悩んだ。
    "translation_status": "draft"
  - "id": "xy-ch78-011"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "忽轉街見一衙門，乃金亭館驛。長老喜道：「徒弟，我們且進這驛裡去：一則問他地方，二則撒和馬匹，三則天晚投宿。」沙僧道：「正是，正是，快進去耶。」四眾欣然而入。只見那在官人果報與驛丞，接入門，各各相見。敘坐定，驛丞問：「長老自何方來？」三藏言：「貧僧東土大唐差往西天取經者，今到貴處，有關文理當照驗，權借高衙一歇。」驛丞即命看茶。茶畢，即辦支應，命當直的安排管待。三藏稱謝，又問：「今日可得入朝見駕，照驗關文？」驛丞道：「今晚不能，須待明日早朝。今晚且於敝衙門寬住一宵。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      道を曲がると、ふいに役所が見えた。金亭館駅（きんていかんえき）という宿駅だった。三蔵は喜んだ。
      三蔵「お前たち、この宿駅へ入ろう。一つにはこの土地のことを尋ねられる。二つには馬に飼葉をやれる。三つには、もう日が暮れるから、宿を借りられる。」
      沙悟浄「そうです、そうです。早く入りましょう。」
      四人が喜んで中へ入ると、役人が駅丞（えきじょう）へ取り次ぎ、一行は迎え入れられて、それぞれ挨拶を交わした。話をして席につくと、駅丞が尋ねた。
      駅丞「長老、どちらからおいでになりました。」
      三蔵「私は東土の大唐（だいとう）から、西天へ経を取りに遣わされた僧です。この土地へ参りましたので、通行証を確かめていただかねばなりません。しばらくこちらの役所で、休ませていただきたいのです。」
      駅丞はすぐに茶を持ってこさせた。茶が済むと、必要なものを用意し、当番の者に接待の支度を命じた。三蔵は礼を言い、さらに尋ねた。
      三蔵「本日、宮殿へ上がり、陛下にお目にかかって、通行証を認めていただけますか。」
      駅丞「今夜はできません。明朝の朝議をお待ちください。今夜はこの粗末な役所で、ゆっくりお休みください。」
    "translation_status": "draft"
  - "id": "xy-ch78-012"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃，安排停當，驛丞即請四眾同吃了齋供。又教手下人打掃客房安歇。三藏感謝不盡。既坐下，長老道：「貧僧有一件不明之事請教，煩為指示。貴處養孩兒，不知怎生看待。」驛丞道：「天無二日，人無二理。養育孩童，父精母血，懷胎十月，待時而生。生下乳哺三年，漸成體相。豈有不知之理。」三藏道：「據尊言與敝邦無異。但貧僧進城時，見街坊人家各設一鵝籠，都藏小兒在內。此事不明，故敢動問。」驛丞附耳低言道：「長老莫管他，莫問他，也莫理他，說他。請安置，明早走路。」長老聞言，一把扯住驛丞，定要問個明白。驛丞搖頭搖指，只叫：「謹言。」三藏一發不放，執死定要問個詳細。驛丞無奈，只得屏去一應在官人等。獨在燈光之下，悄悄而言道：「適所問鵝籠之事，乃是當今國主無道之事。你只管問他怎的？」三藏道：「何為無道？必見教明白，我方得放心。」驛丞道：「此國原是比丘國，近有民謠，改作小子城。三年前，有一老人，打扮做道人模樣，攜一小女子，年方一十六歲。其女形容嬌俊，貌若觀音，進貢與當今，陛下愛其色美，寵幸在宮，號為美后。近來把三宮娘娘、六院妃子，全無正眼相覷。不分晝夜，貪歡不已。如今弄得精神瘦倦，身體尪羸，飲食少進，命在須臾。太醫院檢盡良方，不能療治。那進女子的道人，受我主誥封，稱為國丈。國丈有海外秘方，甚能延壽。前者去十洲、三島採將藥來，俱已完備。但只是藥引子利害：單用著一千一百一十一個小兒的心肝，煎湯服藥。服後有千年不老之功。這些鵝籠裡的小兒，俱是選就的，養在裡面。人家父母懼怕王法，俱不敢啼哭，遂傳播謠言，叫做小兒城。長老明早到朝：只去倒換關文，不得言及此事。」言畢，抽身而退。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      やがて支度が整い、駅丞は四人を招いて、ともに精進の食事をした。それから部下に客室を掃除させ、一行を休ませた。三蔵は幾度も礼を言った。落ち着いて座ると、尋ねた。
      三蔵「分からないことが一つございます。どうかお教えください。この土地では、子供をどのように育て、面倒を見ているのでしょう。」
      駅丞「空に太陽が二つないように、人の道理も二つはありません。父の精と母の血を受け、母の腹に十月宿り、時が来れば生まれる。生まれてから三年は乳を飲ませ、次第に体が育ってゆくのです。お分かりにならないはずはないでしょう。」
      三蔵「お話では、私の国と違いがありません。ただ、城内へ入るとき、通りの家々が鵞鳥の籠を置き、どれも子供を中に入れているのを見ました。このわけが分からないので、お尋ねしたのです。」
      駅丞は耳元へ口を寄せ、声を落とした。
      駅丞「長老、そのことには関わらず、尋ねず、気にも留めず、口にもなさらないでください。お休みになって、明日の朝、旅立ってください。」
      三蔵は駅丞をつかまえ、どうしても事情を聞こうとした。駅丞は首と指を振り、ただ言った。
      駅丞「お言葉を慎んでください。」
      それでも三蔵は手を放さず、必死になって詳しく聞こうとした。駅丞は仕方なく、役人たちを一人残らず退かせた。灯火の下で二人だけになると、ひそひそと話した。
      駅丞「先ほどお尋ねの籠の件は、今の国王の道に背いた仕業なのです。なぜそんなにお聞きになるのです。」
      三蔵「どのような、道に背いた仕業なのですか。どうかはっきり教えてください。そうしなければ心が落ち着きません。」
      駅丞「この国は、もとは比丘国といいました。近ごろ、民の間の口伝えで、小子城と呼ばれるようになったのです。三年前、道士の姿をした老人が一人、十六歳になったばかりの娘を連れてきました。娘はしなやかで美しく、顔立ちは観音（かんのん）のようでした。老人が今の陛下へ献上すると、陛下はその美貌に惚れ込み、宮中で寵愛して、美后（びこう）という名を与えました。近ごろでは、三宮（さんぐう）の后がたも六院（りくいん）の妃たちも、まともに見向きもなさいません。昼夜の区別もなく、快楽にふけり続けておられます。そのため今では気力が衰え、体は痩せ細り、食も進まず、お命はもうわずかです。太医院（たいいいん）があらゆるよい処方を調べましたが、治せません。あの娘を献上した道士は、陛下から正式に国丈（こくじょう）の称号を受けました。国丈は海外の秘伝の処方を持っていて、寿命をよく延ばせるというのです。この前、十洲（じっしゅう）と三島（さんとう）へ薬を採りに行き、必要なものはすべてそろえました。ただ、その薬引（やくいん）が恐ろしい。ほかでもない、一千一百一十一人の幼い子の心臓と肝を煮て、その汁で薬を飲むのです。飲めば千年老いない効き目がある、と。鵞鳥の籠にいる子供たちは、そのために選ばれ、中で養われているのです。親たちは国の法を恐れ、泣き声を立てることもできません。そこで民の間にうわさが広まり、小児城（しょうにじょう）と呼ぶようになりました。長老、明日、宮殿では通行証の認証だけを受け、この件には決して触れないでください。」
      そう言い終えると、駅丞は身を引いて出ていった。
    "translation_status": "draft"
  - "id": "xy-ch78-013"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "諕得個長老骨軟筋麻，止不住腮邊淚墮。忽失聲叫道：「昏君，昏君！為你貪歡愛美，弄出病來，怎麼屈傷這許多小兒性命？苦哉，苦哉，痛殺我也！」有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      三蔵は衝撃に骨も筋も力を失い、頬を伝う涙が止まらなかった。思わず声を上げた。
      三蔵「愚かな王よ、愚かな王よ！　美しい女との快楽にふけって病気になったからといって、どうしてこれほど多くの子供たちの命を、理不尽に奪うのか。ああ、つらい、つらい。胸が張り裂けそうだ！」
      これをうたった詩がある。
    "translation_status": "draft"
  - "id": "xy-ch78-014"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      邪主無知失正真，貪歡不省暗傷身。
      因求永壽戕童命，為解天災殺小民。
      僧發慈悲難割捨，官言利害不堪聞。
      燈前灑淚長吁嘆，痛倒參禪向佛人。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 150
        "line_end": 153
    "translation_ja": |-
      よこしまな君主は無知ゆえ、まことの道を失い、
      快楽にふけって省みず、知らぬ間に身を損なう。
      永遠の命を求めて、子供の命を断ち、
      天からの災いを解こうと、弱い民を殺す。
      僧は慈悲を起こして、見捨てることができず、
      役人が語る恐ろしい事情は、聞くにも堪えない。
      灯火の前で涙を流し、長いため息をつき、
      禅を修め、仏を仰ぐ人は、悲しみに打ちのめされた。
    "translation_status": "draft"
  - "id": "xy-ch78-015"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒近前道：「師父，你是怎的起哩？專把別人棺材擡在自家家裡哭。不要煩惱。常言道：『君教臣死，臣不死不忠；父教子亡，子不亡不孝。』他傷的是他的子民，與你何干？且來寬衣服睡覺，莫替古人耽憂。」三藏滴淚道：「徒弟啊，你是一個不慈憫的。我出家人積功累行，第一要行方便。怎麼這昏君一味胡行？從來也不見吃人心肝，可以延壽。似這等之事，教我怎不傷悲？」沙僧道：「師父且莫傷悲。等明早倒換關文，覿面與國王講過。如若不從，看他是怎麼模樣的一個國丈。或恐那國丈是個妖精，欲吃人的心肝，故設此法，未可知也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      八戒がそばへ来た。
      八戒「お師匠さま、どうしてそうなるんです。よその棺を自分の家へ運び込んで、泣いてばかりじゃありませんか。そんなに悩まないでください。『君主が臣下に死ねと言ったら、死なないのは不忠。父が子に死ねと言ったら、死なないのは不孝』ともいうでしょう。あの王が傷つけるのは、あの王の民です。お師匠さまに何の関係があるんです。さあ、服を緩めて寝ましょう。他人のことまで心配しなさんな。」
      三蔵は涙を流しながら言った。
      三蔵「お前には、人を憐れむ心がないのか。出家した私たちが功徳と善行を積むには、何より人の助けになることをしなくてはならない。あの愚かな王は、どうして好き勝手ばかりするのだ。人の心臓や肝を食べて長生きした者など、これまで見たこともない。こんなことを聞いて、悲しまずにいられるものか。」
      沙悟浄「お師匠さま、ひとまずお嘆きにならないでください。明日の朝、通行証を認めてもらう折に、王へ直接申し上げましょう。聞き入れなければ、国丈というのが何者か、確かめてみればよいのです。ひょっとすると国丈は妖怪で、人の心臓や肝を食べたくて、こんな方法を考えたのかもしれません。まだ分かりませんが。」
    "translation_status": "draft"
  - "id": "xy-ch78-016"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「悟淨說得有理。師父，你且睡覺，明日等老孫同你進朝，看國丈的好歹。如若是人，只恐他走了傍門，不知正道，徒以採藥為真，待老孫將先天之要旨，化他皈正；若是妖邪，我把他拿住，與這國王看看，教他寬慾養身，斷不教他傷了那些孩童性命。」三藏聞言，急躬身，反對行者施禮道：「徒弟啊，此論極妙，極妙。但只是見了昏君，不可便問此事，恐那昏君不分遠近，並作謠言見罪，卻怎生區處？」行者笑道：「老孫自有法力。如今先將鵝籠小兒攝離此城，教他明日無物取心，地方官自然奏表。那昏君必有旨意，或與國丈商量，或者另行選報。那時節，借此舉奏，決不致罪坐於我也。」三藏甚喜。又道：「如今怎得小兒離城？若果能脫得，真賢徒天大之德。可速為之，略遲緩些，恐無及也。」行者抖擻神威，即起身，吩咐八戒、沙僧：「同師父坐著，等我施為，你看但有陰風刮動，就是小兒出城了。」他三人一齊俱念：「南無救生藥師佛！南無救生藥師佛！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      悟空「悟浄（ごじょう）の言うとおりだ。お師匠さま、まずはお休みください。明日は私も一緒に宮殿へ行き、国丈がどういう者か見てみましょう。人間なら、正しい道を知らずに脇道へ入り込み、ただ薬を採ることだけを本当の修行だと思っているのでしょう。私が先天（せんてん）の肝心な道理を教えて、正しい道へ戻してやります。妖怪なら捕まえて王に見せ、欲を抑えて体を養うよう諭しましょう。あの子たちの命は、決して奪わせません。」
      三蔵はそれを聞くと、急いで身をかがめ、師の方から弟子へ礼をした。
      三蔵「よい弟子だ。実にいい考えだ、実にいい。ただ、あの愚かな王に会っても、いきなりその件を尋ねてはいけない。王が内外の区別もつけず、私たちまでうわさを広めた罪に問うたら、どうすればよいのだろう。」
      悟空は笑った。
      悟空「私には法力があります。今のうちに、籠の子供をこの町から移してしまいましょう。明日になって、心臓を取る相手がいなければ、地元の役人が自然と報告するはずです。王は必ず何か命じるでしょう。国丈と相談するかもしれませんし、別の子供を選んで差し出せと言うかもしれません。そのとき、その話に乗じて申し上げれば、決してこちらが罪をかぶることにはなりません。」
      三蔵は大いに喜び、さらに言った。
      三蔵「だが、今からどうやって子供たちを城外へ出すのだ。本当に助け出せたら、お前は天ほども大きな徳を積むことになる。急いでやっておくれ。少しでも遅れれば、間に合わなくなるかもしれない。」
      悟空は神威を奮い起こして立ち上がり、八戒と沙悟浄に言いつけた。
      悟空「お師匠さまと一緒に座って、俺が術を使うのを待っていろ。陰の風が吹き始めたら、それが子供たちの城外へ出るしるしだ。」
      三蔵・八戒・沙悟浄「南無救生薬師仏（なむきゅうしょうやくしぶつ）！　南無救生薬師仏！」
      三人は声をそろえて唱えた。
    "translation_status": "draft"
  - "id": "xy-ch78-017"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖出得門外，打個唿哨，起在半空，捻了訣，念動真言，叫一聲「唵淨法界」，拘得那城隍、土地、社令、真官，並五方揭諦、四值功曹、六丁六甲與護教伽藍等眾，都到空中，對他施禮道：「大聖，夜喚吾等，有何急事？」行者道：「今因路過比丘國，那國王無道，聽信妖邪，要取小兒心肝做藥引子，指望長生。我師父十分不忍，欲要救生滅怪。故老孫特請列位，各使神通，與我把這城中各街坊人家鵝籠裡的小兒，連籠都攝出城外山凹中，或樹林深處，收藏一二日，與他些果子食用，不得餓損；再暗的護持，不得使他驚恐啼哭。待我除了邪，治了國，勸正君王，臨行時，送來還我。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      悟空は門の外へ出ると、口笛を吹いて宙へ上がった。指で印を結び、真言を唱えた。
      悟空「唵浄法界（おんじょうほっかい）！」
      すると城隍（じょうこう）、土地神（とちがみ）、社令（しゃれい）、真官（しんかん）、さらに五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、六丁六甲（ろくていろっこう）、護教伽藍（ごきょうがらん）らの神々が呼び集められ、みな空中に現れて、悟空へ礼をした。
      神々「大聖（たいせい）、この夜更けに私どもをお呼びになったのは、どんな急用でしょう。」
      悟空「今、比丘国を通りかかったのだが、この国の王は道に背き、妖邪の言葉を信じて、子供の心臓と肝を薬引にし、長生きしようとしている。お師匠さまは到底見過ごせず、命を救って妖怪を除きたいとお考えだ。そこで、皆さんにわざわざ来てもらった。それぞれ神通力を使い、この町の通りの家々で、鵞鳥の籠に入れられている子供たちを、籠ごと町の外へ運び出してほしい。山のくぼ地か、森の奥へ、一日二日隠しておいてくれ。果物を食べさせ、飢えで弱らせるな。姿を見せずに守り、怖がって泣かないようにもしてやってくれ。俺が邪悪を除き、国を治め直し、王を正道へ導いたら、旅立つときに連れ戻してくれ。」
    "translation_status": "draft"
  - "id": "xy-ch78-018"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾神聽令，即便各使神通，按下雲頭。滿城中陰風滾滾，慘霧漫漫："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 159
        "line_end": 159
    "translation_ja": "神々は命を聞くと、それぞれ神通力を使って雲から降りた。町じゅうに陰の風が渦を巻き、不気味な霧が一面に広がった。"
    "translation_status": "draft"
  - "id": "xy-ch78-019"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": "陰風刮暗一天星，慘霧遮昏千里月。起初時還蕩蕩悠悠，次後來就轟轟烈烈。悠悠蕩蕩，各尋門戶救孩童；烈烈轟轟，都看鵝籠援骨血。冷氣侵人怎出頭，寒威透體衣如鐵。父母徒張皇，兄嫂皆悲切。滿地捲陰風，籠兒被神攝。此夜縱孤恓，天明盡歡悅。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      陰の風は吹きつけて、空いっぱいの星を暗くし、
      不気味な霧は、千里を照らす月を覆う。
      初めはまだ、ゆらゆら、ゆるやかだったが、
      やがては、ごうごう、激しくなった。
      ゆらゆらと、それぞれの門を尋ねて子供を救い、
      ごうごうと、籠を見つけて家の血を継ぐ子らを助ける。
      冷気が人を襲い、どうして顔など出せよう。
      凍える寒さが身を貫き、着物も鉄のよう。
      父母はただうろたえ、兄や兄嫁も悲しみに沈む。
      地を覆って陰の風が渦巻き、籠は神々に運ばれる。
      今宵はたとえ心細くとも、明ければ皆、喜びに満ちる。
    "translation_status": "draft"
  - "id": "xy-ch78-020"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "有詩為證，詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"

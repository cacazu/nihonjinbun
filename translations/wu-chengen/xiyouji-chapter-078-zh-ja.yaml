    "translation_ja": "原文は最初に「小子城」、説明の終わりでは「小兒城」とする。どちらも子供に関わる民間の呼称として語られるが、表記はそろえずに残した。老兵の改名という説明と、駅丞の民間の口伝えという説明も区別した。"

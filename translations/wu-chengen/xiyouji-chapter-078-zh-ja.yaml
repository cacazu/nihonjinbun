  "known_gaps":
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-005"
      "description_ja": "原文の「西邸王位」は字面が明瞭でない。王のいる国と、府・州・県の行政都市とを対比しているため、西方の国の王都と解した。「西邸」を別の字に直したわけではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-006"
      "description_ja": "国名が変わった理由について、八戒の説明は本人の思いつきであり、沙悟浄の言葉も老兵の説明を疑う推測である。ここではどちらも確定した由来として扱わない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-012"
      "description_ja": "父の精・母の血と十月の妊娠、三年の授乳は、駅丞が述べる当時の養育観として原文どおり残した。現代の医学的な基準や、実践すべき期間を示す説明ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-012"
      "description_ja": "原文は最初に「小子城」、説明の終わりでは「小兒城」とする。どちらも子供に関わる民間の呼称として語られるが、表記はそろえずに残した。老兵の改名という説明と、駅丞の民間の口伝えという説明も区別した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-015"
      "description_ja": "八戒が持ち出す君臣・父子の格言は、他人の事情に関わるなという彼自身の言い分であり、作品全体や訳者の是認ではない。「莫替古人耽憂」は、字面の古代人に限らず、よその人のことで気をもむな、という意味に取った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-016"
      "description_ja": "悟空のいう「先天」は、天地や万物の成立以前の根源的なあり方を指す修行上の語。採薬だけを修行の本道とする考えとの対比として訳した。ここでの国丈の人間・妖怪という区別は、まだ条件を置いた話である。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-021"
      "description_ja": "原文の「比丘一國非君亂，小子千名是命訛」は、そのまま取れば、国の乱れを王自身のせいではないとし、子供たちの災難を運命の狂いとする句になる。王の責任を非難する周囲の叙述と緊張があるが、字を改めて整合させず、否定と運命の語を残した。細かな含意には留保がある。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-021"
      "description_ja": "「陰騭」は人に知られぬところでの善行・徳として解した。仏教語を用いて救命の功徳をたたえる詩であり、宗教の教義を体系的に定義する箇所ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-029"
      "description_ja": "衣装の「九錫雲錦」「箸頂梅」「紉藍」には細部の不明点がある。九錫を飾りの具体的な九品に分解せず、箸頂梅は梅の模様に関わる呼称として残した。「紉藍」は藍色の糸を合わせた帯と取ったが、語の切り方と織り方は確定しない。「綿絲」は絹綿の糸と解し、綿花製だとは断定しなかった。鶴氅は鶴の羽の衣だけでなく道士の外衣もいうため、ここで実物の鶴羽を補わない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-032"
      "description_ja": "三蔵は、女の陰気で男の陽気を補う「採陰補陽」と、薬を飲んで寿命を延ばす方法を退けている。この二つの批判は説法をする三蔵自身の言葉であり、現代医学の説明に置き換えたものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-034"
      "description_ja": "「二八陰消」「三九陽長」「九轉」は内丹の修練を表す語。二・八、三・九は単純な掛け算とせず、陰陽の数として残した。『修真傳道論』には心・肝などの陰と陽をこれらの数へ対応させる説明があるが、本詩でその細部すべてを確定できるわけではない。水火・丹・胎も修行の象徴を含み、医療行為の手順を示さない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-034"
      "description_ja": "ここで国丈がいう「陰神」は、修行による精神・魂のあり方を表す内丹の語として取る。回題で呼び出される陰の神々と、同じ具体的な神々を指すものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-035"
      "description_ja": "国丈の「三教之中無上品，古來惟道獨稱尊」は、三教のうち道の教えにまさるものはない、という彼自身の優越の主張として訳した。官たちの喝采と三蔵の恥じる反応を、宗教間の優劣についての語り手の判定に置き換えてはいない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-036"
      "description_ja": "国丈は子供の心臓なら「千年」、新たな薬引きなら「萬萬年」と言い、その説明の終わりでは「萬年」と言う。桁の違いをそろえずに残した。「十世修行」「元陽未泄」も国丈が僧について述べた鑑定・主張であり、語り手の新たな保証ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch78-1455627"
      "segment_ids":
        - "xy-ch78-037"
      "description_ja": "原文は恐怖に倒れる三蔵を「三尸神散，七竅煙生」と描く。体内の三尸神が散り、七つの穴から煙が出るという強い形容を保ち、単に怒っているという表現へ置き換えなかった。現実の身体症状の診断ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

    "translation_ja": "八戒が持ち出す君臣・父子の格言は、他人の事情に関わるなという彼自身の言い分であり、作品全体や訳者の是認ではない。「莫替古人耽憂」は、字面の古代人に限らず、よその人のことで気をもむな、という意味に取った。"

    "source_languages": []
    "source_locations": []
    "translation_ja": "衣装の「九錫雲錦」「箸頂梅」「紉藍」には細部の不明点がある。九錫を飾りの具体的な九品に分解せず、箸頂梅は梅の模様に関わる呼称として残した。「紉藍」は藍色の糸を合わせた帯と取ったが、語の切り方と織り方は確定しない。「綿絲」は絹綿の糸と解し、綿花製だとは断定しなかった。鶴氅は鶴の羽の衣だけでなく道士の外衣もいうため、ここで実物の鶴羽を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-10-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵は、女の陰気で男の陽気を補う「採陰補陽」と、薬を飲んで寿命を延ばす方法を退けている。この二つの批判は説法をする三蔵自身の言葉であり、現代医学の説明に置き換えたものではない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-11-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「二八陰消」「三九陽長」「九轉」は内丹の修練を表す語。二・八、三・九は単純な掛け算とせず、陰陽の数として残した。『修真傳道論』には心・肝などの陰と陽をこれらの数へ対応させる説明があるが、本詩でその細部すべてを確定できるわけではない。水火・丹・胎も修行の象徴を含み、医療行為の手順を示さない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-12-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで国丈がいう「陰神」は、修行による精神・魂のあり方を表す内丹の語として取る。回題で呼び出される陰の神々と、同じ具体的な神々を指すものではない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-13-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "国丈の「三教之中無上品，古來惟道獨稱尊」は、三教のうち道の教えにまさるものはない、という彼自身の優越の主張として訳した。官たちの喝采と三蔵の恥じる反応を、宗教間の優劣についての語り手の判定に置き換えてはいない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-14-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "国丈は子供の心臓なら「千年」、新たな薬引きなら「萬萬年」と言い、その説明の終わりでは「萬年」と言う。桁の違いをそろえずに残した。「十世修行」「元陽未泄」も国丈が僧について述べた鑑定・主張であり、語り手の新たな保証ではない。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-15-body"
    "section_id": "chapter-78"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は恐怖に倒れる三蔵を「三尸神散，七竅煙生」と描く。体内の三尸神が散り、七つの穴から煙が出るという強い形容を保ち、単に怒っているという表現へ置き換えなかった。現実の身体症状の診断ではない。"
    "translation_status": "draft"

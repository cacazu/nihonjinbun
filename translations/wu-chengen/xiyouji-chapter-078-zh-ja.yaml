        "line_end": 163
    "translation_ja": "これをうたった詩がある。"
    "translation_status": "draft"
  - "id": "xy-ch78-021"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      釋門慈憫古來多，正善成功說摩訶。
      萬聖千真皆積德，三皈五戒要從和。
      比丘一國非君亂，小子千名是命訛。
      行者因師同救護，這場陰騭勝波羅。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 165
        "line_end": 168
    "translation_ja": |-
      仏門には、昔から慈悲深い者が多く、
      正しく善い功を遂げれば、摩訶（まか）、偉大なりとたたえる。
      万の聖も千の仙も、みな徳を積み、
      三帰五戒（さんきごかい）も、和らぐ心に従うことが肝心だ。
      比丘の国の乱れは、王のせいではなく、
      千もの子らの災難は、運命の狂い。
      悟空は師の心を受け、ともに命を守り救い、
      この人知れぬ善行は、波羅（はら）にもまさるのだ。
    "translation_status": "draft"
  - "id": "xy-ch78-022"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當夜有三更時分，眾神祗把鵝籠攝去各處安藏。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 169
        "line_end": 169
    "translation_ja": "その夜、三更（さんこう）のころには、神々は籠をそれぞれの場所へ運び、無事に隠し終えた。"
    "translation_status": "draft"
  - "id": "xy-ch78-023"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者按下祥光，徑至驛庭上，只聽得他三人還念「南無救生藥師佛」哩。他也心中暗喜，近前叫：「師父，我來也。陰風之起何如？」八戒道：「好陰風。」三藏道：「救兒之事，卻怎麼說？」行者道：「已一一救他出去，待我們起身時送還。」長老謝了又謝，方才就寢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      悟空は瑞光を降り、宿駅の庭へまっすぐ戻った。三人はまだ唱えていた。
      三蔵・八戒・沙悟浄「南無救生薬師仏。」
      悟空もひそかにうれしくなり、そばへ寄って声を掛けた。
      悟空「お師匠さま、戻りました。あの陰の風はいかがでした。」
      八戒「立派な陰の風だったよ。」
      三蔵「子供を救う件は、どうなったのだ。」
      悟空「一人残らず外へ助け出しました。私たちが旅立つときに、送り返します。」
      三蔵は繰り返し礼を言い、ようやく床についた。
    "translation_status": "draft"
  - "id": "xy-ch78-024"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "至天曉，三藏醒來，遂結束齊備道：「悟空，我趁早朝，倒換關文去也。」行者道：「師父，你自家去，恐不濟事，待老孫和你同去，看那國丈邪正如何。」三藏道：「你去卻不肯行禮，恐國王見怪。」行者道：「我不現身，暗中跟隨你，就當保護。」三藏甚喜，吩咐八戒、沙僧看守行李、馬匹，卻才舉步。這驛丞又來相見，看這長老打扮起來，比昨日又甚不同。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      夜が明け、三蔵は目を覚ますと、身支度をすっかり整えた。
      三蔵「悟空、朝の参内に間に合うように、通行証の認証を受けに行ってくる。」
      悟空「お師匠さま、お一人ではうまくいかないでしょう。私も一緒に行き、あの国丈が邪か正かを見届けましょう。」
      三蔵「お前は行っても礼をしようとしない。王がとがめはしないか。」
      悟空「姿を見せず、ひそかについていきます。お守りすることにもなりますから。」
      三蔵は大いに喜び、八戒と沙悟浄に荷と馬を見張るよう言いつけて、ようやく歩きだした。駅丞もまた挨拶に来たが、身支度した三蔵は、昨日とはまるで違って見えた。その姿は、
    "translation_status": "draft"
  - "id": "xy-ch78-025"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": "身上穿一領錦襴異寶佛袈裟，頭戴金頂毘盧帽。九環錫杖手中拿，胸藏一點神光妙。通關文牒緊隨身，包裹袋中纏錦套。行似阿羅降世間，誠如活佛真容貌。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      身には、世にも珍しい宝の錦襴袈裟（きんらんげさ）、
      頭には、頂に金をあしらった毘盧帽（びるぼう）。
      九環錫杖（きゅうかんしゃくじょう）を手に取り、
      胸には、一点の不思議な霊光を蔵す。
      通関文牒（つうかんもんちょう）は、肌身離さず携え、
      錦の覆いで包んで、袋に収めてある。
      歩けば阿羅（あら）がこの世へ降りたかのよう、
      まさしく、生き仏そのものの姿だった。
    "translation_status": "draft"
  - "id": "xy-ch78-026"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那驛丞相見禮畢，附耳低言，只教莫管閑事。三藏點頭應聲。大聖閃在門傍，念個咒語，搖身一變，變做個蟭蟟蟲兒，嚶的一聲，飛在三藏帽兒上。出了館驛，徑奔朝中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 177
        "line_end": 177
    "translation_ja": "駅丞は挨拶を済ませると、三蔵の耳元で、余計なことには関わらないようにと繰り返した。三蔵はうなずいて答えた。悟空は門の脇へさっと身を寄せ、呪文を唱えて身を振り、蟭蟟虫（しょうりょうちゅう）に変わった。ぶんと飛び立ち、三蔵の帽子の上へ留まった。二人は宿駅を出て、まっすぐ宮殿へ向かった。"
    "translation_status": "draft"
  - "id": "xy-ch78-027"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "及到朝門外，見有黃門官，即施禮道：「貧僧乃東土大唐差往西天取經者。今到貴地，理當倒換關文，意欲見駕，伏乞轉奏轉奏。」那黃門官果為傳奏。國王喜道：「遠來之僧，必有道行。」教請進來。黃門官復奉旨，將長老請入。長老階下朝見畢，復請上殿賜坐。長老又謝恩坐了。只見那國王相貌尪羸，精神倦怠：舉手處，揖讓差池；開言時，聲音斷續。長老將文牒獻上，那國王眼目昏朦，看了又看，方才取寶印，用了花押，遞與長老。長老收訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      宮門の外へ着くと、黄門官（こうもんかん）がいたので、三蔵は礼をした。
      三蔵「私は東土の大唐から、西天へ経を取りに遣わされた僧です。この土地へ参りましたので、通行証の認証を受けねばなりません。陛下にお目にかかりたく、どうかお取り次ぎください。お願いいたします。」
      黄門官はそのとおり奏上した。国王は喜んだ。
      国王「遠くから来た僧なら、きっと修行を積んでいよう。」
      王は中へ招くよう命じた。黄門官は命を受け、三蔵を案内した。三蔵が階段の下で拝謁の礼を終えると、殿上へ招かれ、席を与えられた。三蔵はまた礼を言って座った。王を見ると、痩せ衰え、気力も尽きた様子だった。手を上げて礼を返す動作もぎこちなく、口を開いても、声が途切れ途切れになった。三蔵が文牒を差し上げると、王はかすむ目で何度も見返した。ようやく宝印を取り、印を押して花押（かおう）を添え、三蔵へ渡した。三蔵はそれを受け取った。
    "translation_status": "draft"
  - "id": "xy-ch78-028"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王正要問取經原因，只聽得當駕官奏道：「國丈爺爺來矣。」那國王即扶著近侍小宦，掙下龍床，躬身迎接。慌得那長老急起身，側立於傍。回頭觀看，原來是一個老道者，自玉階前，搖搖擺擺而進。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 180
        "line_end": 180
    "translation_ja": |-
      王が経を取りに行く理由を尋ねようとしたとき、御前の官が奏上した。
      御前の官「国丈さまがお見えです。」
      王はすぐに近侍の若い宦官につかまり、苦労して玉座を下りると、身をかがめて迎えた。三蔵も慌てて立ち上がり、脇へ寄った。振り返って見ると、一人の年老いた道士が、玉の階段の前から、悠々と身を揺らして入ってくるところだった。その姿は、
    "translation_status": "draft"
  - "id": "xy-ch78-029"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": "頭上戴一頂淡鵝黃九錫雲錦紗巾，身上穿一領箸頂梅沉香綿絲鶴氅。腰間繫一條紉藍三股攢絨帶，足下踏一對麻經葛緯雲頭履。手中拄一根九節枯藤盤龍拐杖，胸前掛一個描龍刺鳳團花錦囊。玉面多光潤，蒼髯頷下飄。金睛飛火焰，長目過眉梢。行動雲隨步，逍遙香霧饒。階下眾官都拱接，齊呼國丈進王朝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 182
        "line_end": 182
    "translation_ja": |-
      頭には、淡いひよこ色の九錫雲錦（きゅうしゃくうんきん）の薄絹の頭巾。
      身には、箸頂梅（ちょちょうばい）の模様をあしらった、沈香色の絹綿の糸の鶴氅（かくしょう）。
      腰には、藍色の糸を三つに撚り合わせた、房飾りの帯を結び、
      足には、縦糸を麻、横糸を葛で織った、雲形のつま先の靴を履く。
      手には、九つの節を持つ枯れ藤の、竜の巻きつく形の杖。
      胸には、竜と鳳凰を刺繍し、丸い花模様を散らした錦の袋。
      玉のような顔は、つややかに光り、
      灰色のひげは、顎の下でなびく。
      金色の瞳は火花を放ち、
      細長い目は、眉尻よりも長く伸びる。
      歩けば雲が足に付き添い、
      香る霧がゆったりと身を包む。
      階段の下の官たちは、みな手を組んで迎え、
      国丈の参内を、声をそろえて告げた。
    "translation_status": "draft"
  - "id": "xy-ch78-030"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國丈到寶殿前，更不行禮，昂昂烈烈，徑到殿上。國王欠身道：「國丈仙蹤，今喜早降。」就請左手繡墩上坐。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      国丈は宝殿の前へ来ても、まったく礼をしなかった。威勢を張り、大いばりで、そのまま殿上へ進んだ。王は身をかがめた。
      国王「国丈、本日は早々に仙人のお運びをいただき、うれしく存じます。」
      そして、左手の刺繍を施した腰掛けへ招いた。
    "translation_status": "draft"
  - "id": "xy-ch78-031"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏起一步，躬身施禮道：「國丈大人，貧僧問訊了。」那國丈端然高坐，亦不回禮，轉面向國王道：「僧家何來？」國王道：「東土唐朝差上西天取經者，今來倒驗關文。」國丈笑道：「西方之路，黑漫漫有甚好處？」三藏道：「自古西方乃極樂之勝境，如何不好？」那國王問道：「朕聞上古有云：『僧是佛家弟子。』端的不知為僧可能不死，向佛可能長生？」三藏聞言，急合掌應道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 185
        "line_end": 185
    "translation_ja": |-
      三蔵は一歩進み、身をかがめて礼をした。
      三蔵「国丈さま、ご挨拶申し上げます。」
      国丈はどっしり高く座ったまま、礼も返さず、王の方へ顔を向けた。
      国丈「その僧は、どこから来たのです。」
      国王「東土の唐（とう）から、西天へ経を取りに遣わされた者です。今、通行証の認証を受けに参ったのです。」
      国丈は笑った。
      国丈「西方への道など、真っ暗ではないか。何のよいことがある。」
      三蔵「昔から、西方こそ極楽のすばらしい境地です。よくないはずがありましょうか。」
      王が尋ねた。
      国王「古くから『僧は仏の弟子である』というと聞いている。だが、朕には分からぬ。僧になれば死なずにいられるのか。仏に向かえば長生きできるのか。」
      三蔵はそれを聞くと、すぐに合掌して答えた。
    "translation_status": "draft"
  - "id": "xy-ch78-032"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": "「為僧者，萬緣都罷；了性者，諸法皆空。大智閑閑，澹泊在不生之內；真機默默，逍遙於寂滅之中。三界空而百端治，六根淨而千種窮。若乃堅誠知覺，須當識心：心淨則孤明獨照，心存則萬境皆清。真容無欠亦無餘，生前可見；幻相有形終有壞，分外何求？行功打坐，乃為入定之原；佈惠施恩，誠是修行之本。大巧若拙，還知事事無為；善計非籌，必須頭頭放下。但使一心不動，萬行自全；若云採陰補陽，誠為謬語。服餌長壽，實乃虛詞。只要塵塵緣總棄，物物色皆空。素素純純寡愛慾，自然享壽永無窮。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 187
        "line_end": 187
    "translation_ja": |-
      三蔵「僧となる者は、あらゆる縁への執着をやめ、
      本性を悟る者は、すべてのものに固定した実体はないと知ります。
      大いなる智慧はゆったりと、そもそも生ずることのない境地に澄み、
      まことの働きは静かに、煩悩の消えた境地で自由に遊びます。
      三界（さんがい）が空と分かれば、百のもつれも収まり、
      六根（ろっこん）が清まれば、千もの迷いも尽きるのです。
      固く誠実な心で真に目覚めようとするなら、まず心を知らねばなりません。
      心が清ければ、ただ一つの明るい光がおのずと照らし、
      心を保てば、向き合うあらゆる境界も清らかになります。
      真の姿には、欠けるものも余るものもなく、生きている間にも見えます。
      仮の形は、形ある以上いつかは壊れます。それ以上、何を求めましょう。
      功を修めて座禅を組むのは、心を定める瞑想へ入るもと、
      恵みを広げ、恩を施すことこそ、修行の根本です。
      本当にすぐれた技は、不器用なものに見える。
      何事にも、作為を加えぬあり方があると知らねばなりません。
      本当によい計らいは、計算棒を並べることではない。
      一つ一つ、すべてを手放さねばなりません。
      ひとたび心が動じなくなれば、万の行いもおのずと整います。
      女の陰気を採って男の陽気を補うなどというのは、まことに誤った話。
      薬を飲めば長生きするというのも、実にむなしい言葉です。
      ただ、塵のように細かな縁まで捨て去り、
      あらゆる物の姿を、実体のないものと見なしてください。
      飾りなく、濁りなく、愛欲を少なくしていれば、
      自然と、尽きることのない命を享けられるのです。」
    "translation_status": "draft"
  - "id": "xy-ch78-033"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國丈聞言，付之一笑。用手指定唐僧道：「呵呵呵，你這和尚滿口胡柴。寂滅門中，須云認性。你不知那性從何而滅，枯坐參禪，盡是些盲修瞎煉。俗語云：『坐坐坐，你的屁股破。火熬煎，反成禍。』更不知我這："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 189
        "line_end": 189
    "translation_ja": |-
      国丈は聞くと、一笑に付した。三蔵を指さして言った。
      国丈「ははは、お前という坊主は、でたらめばかりだ。寂滅（じゃくめつ）を説く仏門でも、本性を見定めよというはずだ。その本性がどこから滅するのかも知らず、ただ座って禅を修めるのは、道も見えないままの、めくらめっぽうな修行ではないか。世間でもこういうぞ。『座れ、座れ、座れ。尻の皮が破れるぞ。火に焼かれ、煎られて、かえって災いになるぞ。』ましてお前は、わしらのこのあり方を知らぬ。」
    "translation_status": "draft"
  - "id": "xy-ch78-034"
    "section_id": "chapter-78"
    "kind": "verse"
    "origin": "source"
    "source_text": "修仙者，骨之堅秀；達道者，神之最靈。攜簞瓢而入山訪友，採百藥而臨世濟人。摘仙花以砌笠，折香蕙以鋪裀。歌之鼓掌，舞罷眠雲。闡道法，揚太上之正教；施符水，除人世之妖氛。奪天地之秀氣，採日月之華精。運陰陽而丹結，按水火而胎凝。二八陰消兮，若恍若惚；三九陽長兮，如杳如冥。應四時而採取藥物，養九轉而修煉丹成。跨青鸞，升紫府；騎白鶴，上瑤京。參滿天之華采，表妙道之慇懃。比你那靜禪釋教，寂滅陰神，涅槃遺臭殼，又不脫凡塵。三教之中無上品，古來惟道獨稱尊。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 190
        "line_end": 190
    "translation_ja": |-
      国丈「仙を修める者は、骨までも強くすぐれ、
      道に通じた者は、その精神もひときわ霊妙。
      飯籠とひょうたんを携え、山へ入って友を訪ね、
      百の薬を採り、世へ下って人を救う。
      仙の花を摘んで笠を飾り、
      香る蘭を折り取って、敷物に敷く。
      手を打って歌い、
      舞い終えれば雲に眠る。
      道の法を明らかにして、太上（たいじょう）の正しい教えを広め、
      符水（ふすい）を施して、人の世の妖気を除く。
      天地のすぐれた気を取り入れ、
      日月の輝く精を採り集める。
      陰陽を巡らせて丹を結び、
      水と火を調えて仙の胎を凝らす。
      二と八の陰が消えるときは、ほのかで、とらえがたく、
      三と九の陽が育つときは、遠く奥深い。
      四季に応じて薬となるものを採り、
      九転（きゅうてん）を養い、練り上げて丹を成す。
      青い鸞（らん）にまたがって、紫府（しふ）へ昇り、
      白い鶴に乗って、瑤京（ようけい）へ上がる。
      天いっぱいの光彩に交わり、
      妙なる道へ、ひたすら尽くす心を示すのだ。
      お前たちの静かな禅という仏の教えは、
      陰神（いんしん）を寂滅させるばかり。
      涅槃（ねはん）といっても、臭い体の抜け殻を残し、
      結局は俗世の塵を抜け出せぬ。
      三つの教えの中に、これを超えるものはなく、
      昔から、ただ道のみが尊いとされてきたのだ。」
    "translation_status": "draft"
  - "id": "xy-ch78-035"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王聽說，十分歡喜。滿朝官都喝采道：「好個『惟道獨稱尊』，『惟道獨稱尊』。」長老見人都讚他，不勝羞愧。國王又叫光祿寺安排素齋，待那遠來之僧出城西去。三藏謝恩而退。才下殿，往外正走，行者飛下帽頂兒，來在耳邊叫道：「師父，這國丈是個妖邪，國王受了妖氣。你先去驛中等齋，待老孫在這裡聽他消息。」三藏知會了，獨出朝門不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 192
        "line_end": 192
    "translation_ja": |-
      王はこれを聞いて、大いに喜んだ。朝廷の官たちも、みな喝采した。
      官たち「すばらしい、『ただ道のみが尊い』とは。『ただ道のみが尊い』！」
      三蔵は、皆が国丈を褒めるのを見て、いたたまれないほど恥ずかしくなった。王はさらに光禄寺（こうろくじ）へ、遠来の僧を精進料理でもてなし、城を出て西へ向かわせるよう命じた。三蔵は恩に感謝して退出した。殿を下り、外へ歩いていくと、悟空が帽子の頂から飛び降りて、耳元で告げた。
      悟空「お師匠さま、この国丈は妖怪です。王も妖気に冒されています。まず宿駅へ帰って、食事を待っていてください。私はここに残り、様子を聞きます。」
      三蔵は承知し、一人で宮門を出た。その方はいったんおく。
    "translation_status": "draft"
  - "id": "xy-ch78-036"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "看那行者，一翅飛在金鑾殿翡翠屏中釘下，只見那班部中閃出五城兵馬官奏道：「我主，今夜一陣冷風，將各坊各家鵝籠裡小兒，連籠都刮去了，更無蹤跡。」國王聞奏，又驚又惱，對國丈道：「此事乃天滅朕也。連月病重，御醫無效，幸國丈賜仙方，專待今日午時開刀，取此小兒心肝作引，何期被冷風刮去，非天欲滅朕而何？」國丈笑道：「陛下且休煩惱。此兒刮去，正是天送長生與陛下也。」國王道：「見把籠中之兒刮去，何以返說天送長生？」國丈道：「我才入朝來，見了一個絕妙的藥引，強似那一千一百一十一個小兒之心。那小兒之心，只延得陛下千年之壽；此引子，吃了我的仙藥，就可延萬萬年也。」國王漠然不知是何藥引，請問再三，國丈才說：「那東土差去取經的和尚，我看他器宇清淨，容顏齊整，乃是個十世修行的真體，自幼為僧，元陽未泄，比那小兒更強萬倍。若得他的心肝煎湯，服我的仙藥，足保萬年之壽。」那昏君聞言，十分聽信，對國丈道：「何不早說？若果如此有效，適才留住，不放他去了。」國丈道：「此何難哉？適才吩咐光祿寺辦齋待他，他必吃了齋，方才出城。如今急傳旨，將各門緊閉，點兵圍了金亭館驛，將那和尚拿來，必以禮求其心。如果相從，即時剖而取出，遂御葬其屍，還與他立廟享祭；如若不從，就與他個武不善作，即時綑住，剖開取之。有何難事？」那昏君如其言，即傳旨，把各門閉了。又差羽林衛大小官軍，圍住館驛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 193
        "line_end": 193
    "translation_ja": |-
      さて悟空は、ひと羽ばたきして金鑾殿（きんらんでん）の翡翠の屏風へ飛び、ぴたりと留まった。官たちの列から、五城兵馬官（ごじょうへいばかん）が進み出て奏上するのが見えた。
      五城兵馬官「陛下、今夜、冷たい風が一陣吹き、各町各家の鵞鳥の籠にいた子供たちを、籠ごとさらっていきました。跡形も残っておりません。」
      王はその報告に驚き、腹を立て、国丈へ言った。
      国王「これは、天が朕を滅ぼすのだ。何か月も病が重く、御医にも治せず、幸い国丈から仙人の処方を授かった。今日は正午に刃を入れて、あの子らの心臓と肝を取り、薬引にするのを待つばかりだったのだ。それが冷たい風にさらわれるとは。天が朕を滅ぼそうとしているのでなくて、何であろう。」
      国丈は笑った。
      国丈「陛下、お悩みになることはございません。子供たちが飛ばされたのは、まさに天が陛下へ長寿を授けるということです。」
      国王「籠の中の子供が飛ばされたというのに、なぜ逆に、天が長寿を授けるなどと言うのだ。」
      国丈「先ほど参内した折、すばらしい薬引を一つ見つけました。一千一百一十一人の子供の心臓にもまさるものです。子供の心臓なら、陛下の寿命を千年延ばせるだけですが、こちらを薬引にして、わしの仙薬を飲めば、万万年もの命を得られます。」
      王は何を薬引にするのか、さっぱり分からず、繰り返し尋ねた。ようやく国丈は答えた。
      国丈「東土から経を取りに遣わされた、あの僧です。わしが見るところ、立ち居振る舞いは清らかで、顔立ちも整っています。十度の生にわたり修行を重ねた、まことの身です。幼いころから僧で、元陽（げんよう）をまだ漏らしておらず、あの子供たちより万倍もすぐれています。その心臓と肝を煮た汁で、わしの仙薬を飲めば、万年の寿命は間違いありません。」
      愚かな王はすっかり信じ込んだ。
      国王「なぜ早く言わなかった。本当にそれほど効くなら、さっき引き止めて、帰さなかったものを。」
      国丈「何も難しいことではありません。先ほど、光禄寺に食事でもてなすよう命じられましたから、あの僧は必ず食べ終えてから城を出るでしょう。今すぐ命を下し、すべての門を固く閉ざして、兵を集め、金亭館駅を囲ませなさい。僧を連れてこさせ、まずは礼を尽くして、心臓を差し出すよう頼むのです。承知すれば、その場で腹を裂いて取り出し、遺体は陛下の命で手厚く葬る。そのうえ廟も建てて、供物を受けられるようにしてやればよい。承知しなければ、力ずくで、遠慮などせず、その場で縛り上げ、腹を裂いて取り出すのです。何の難しいことがありましょう。」
      愚かな王はその言葉どおり、ただちに命じて、すべての城門を閉ざした。さらに羽林衛（うりんえい）の大小の官兵を遣わし、宿駅を取り囲ませた。
    "translation_status": "draft"
  - "id": "xy-ch78-037"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽得這個消息，一翅飛奔館驛，現了本相，對唐僧道：「師父，禍事了，禍事了。」那三藏才與八戒、沙僧領御齋，忽聞此言，諕得三尸神散，七竅煙生，倒在塵埃，渾身是汗，眼不定睛，口不能言。慌得沙僧上前攙住，只叫：「師父甦醒，師父甦醒。」八戒道：「有甚禍事？有甚禍事？你慢些兒說便也罷，卻諕得師父如此。」行者道：「自師父出朝，老孫回視，那國丈是個妖精。少頃，有五城兵馬來奏冷風刮去小兒之事。國王方惱，他卻轉教喜歡，道：『這是天送長生與你。』要取師父的心肝做藥引，可延萬年之壽。那昏君聽信誣言，所以點精兵，來圍館驛，差錦衣官來請師父求心也。」八戒笑道：「行的好慈憫，救的好小兒，刮的好陰風，今番卻撞出禍來了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 194
        "line_end": 194
    "translation_ja": |-
      この話を聞くと、悟空はひと羽ばたきで宿駅へ飛び戻り、元の姿に戻って三蔵へ言った。
      悟空「お師匠さま、大変です、大変です。」
      三蔵はちょうど八戒、沙悟浄とともに、王の下賜した精進料理を受け取ったところだった。この言葉を突然聞き、三尸神（さんししん）が散り、七竅（しちきょう）から煙が出るほど仰天して、地面へ倒れた。全身に汗が噴き出し、目は定まらず、口もきけない。沙悟浄は慌ててそばへ寄り、抱き起こしながら呼びかけた。
      沙悟浄「お師匠さま、気を確かに。お師匠さま、気を確かに。」
      八戒「何が大変なんだ、何が大変なんだ。落ち着いて話せばいいものを。お師匠さまを、こんなに驚かせちまって。」
      悟空「お師匠さまが宮殿を出てから、俺は戻って見ていたが、あの国丈は妖怪だ。しばらくして、五城兵馬官が、冷たい風に子供たちをさらわれたと報告した。王は腹を立てたが、国丈は反対に喜ばせようとして、『これは天があなたへ長寿を授けるのです』と言った。お師匠さまの心臓と肝を薬引にすれば、万年の命を得られるというんだ。愚かな王はそのでたらめを信じ、精鋭の兵を集めて宿駅を囲ませ、錦衣官（きんいかん）を遣わして、お師匠さまを呼び、心臓をもらおうとしている。」
      八戒は笑った。
      八戒「結構な慈悲を施したもんだ。子供をよく助けたもんだ。立派な陰の風を吹かせたもんだ。そのおかげで今度は、こっちが災難にぶつかっちまったぞ。」
    "translation_status": "draft"
  - "id": "xy-ch78-038"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏戰兢兢的爬起來，扯著行者，哀告道：「賢徒啊，此事如何是好？」行者道：「若要好，大做小。」沙僧道：「怎麼叫做『大做小』？」行者道：「若要全命，師作徒，徒作師，方可保全。」三藏道：「你若救得我命，情願與你做徒子、徒孫也。」行者道：「既如此，不必遲疑。」教：「八戒，快和些泥來。」那獃子即使釘鈀築了些土。又不敢外面去取水，後就擄起衣服撒溺，和了一團臊泥，遞與行者。行者沒奈何，將泥撲作一片，往自家臉上一安，做下個猴像的臉子。叫唐僧站起休動，再莫言語。貼在唐僧臉上，念動真言，吹口仙氣，叫：「變！」那長老即變做個行者模樣。脫了他的衣服，以行者的衣服穿上。行者卻將師父的衣服穿了，捻著訣，念個咒語，搖身變作唐僧的嘴臉。八戒、沙僧也難識認。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 195
        "line_end": 195
    "translation_ja": |-
      三蔵はぶるぶる震えながら起き上がり、悟空にすがって哀願した。
      三蔵「頼みの弟子よ、これはどうすればよいのだ。」
      悟空「よくしたければ、大きい者が小さい者になるのです。」
      沙悟浄「『大きい者が小さい者になる』とは、どういうことです。」
      悟空「命を守りたければ、師が弟子になり、弟子が師になる。それでこそ無事でいられます。」
      三蔵「命を救ってくれるなら、お前の弟子でも、孫弟子でも、喜んでなろう。」
      悟空「それなら、ためらっている暇はありません。」
      そして命じた。
      悟空「八戒、早く泥をこねてこい。」
      八戒はすぐに釘鈀（ていは）で土を掘った。しかし外へ水を取りに行く勇気はなく、着物をからげて小便をし、臭い泥をひと塊こねて、悟空へ渡した。悟空は仕方なく泥を薄くのばし、自分の顔へ押し当てて、猿の顔の型を作った。それから三蔵を立たせ、動かず、もう口もきかないよう言いつけた。その顔へ泥の型を貼りつけ、真言を唱えて仙の息を吹きかけ、叫んだ。
      悟空「変われ！」
      三蔵はたちまち悟空の姿になった。悟空は三蔵の服を脱がせ、自分の服を着せた。そして自分は師の服を着ると、指で印を結び、呪文を唱え、身を振って三蔵の顔へ変わった。八戒と沙悟浄にも、見分けがつかなかった。
    "translation_status": "draft"
  - "id": "xy-ch78-039"
    "section_id": "chapter-78"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正當合心裝扮停當，只聽得鑼鼓齊鳴，又見那槍刀簇擁。原來是羽林衛官，領三千兵把館驛圍了。又見一個錦衣官走進驛庭問道：「東土唐朝長老在那裡？」慌得那驛丞戰兢兢的跪下，指道：「在下面客房裡。」錦衣官即至客房裡道：「唐長老，我王有請。」八戒、沙僧左右護持假行者。只見假唐僧出門施禮道：「錦衣大人，陛下召貧僧，有何話說？」錦衣官上前一把扯住道：「我與你進朝去，想必有取用也。」咦！這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch78-1455627"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第078回&oldid=1455627"
        "line_start": 197
        "line_end": 197
    "translation_ja": |-
      皆で力を合わせ、ちょうど変装を整えたところへ、銅鑼と太鼓がいっせいに鳴り、槍や刀が群がってくるのが見えた。羽林衛の官が三千の兵を率い、宿駅を囲んだのだった。さらに錦衣官が一人、宿駅の庭へ入ってきて尋ねた。
      錦衣官「東土の唐から来た長老は、どこにいる。」
      駅丞は慌てふためき、震えながらひざまずいて、指さした。
      駅丞「下の客室においでです。」
      錦衣官はすぐに客室へ来た。
      錦衣官「唐長老（とうちょうろう）、王がお呼びだ。」
      八戒と沙悟浄は、悟空の姿をした三蔵を左右から守っていた。三蔵の姿の悟空が部屋を出て、礼をした。
      悟空「錦衣官さま、陛下が私をお呼びなのは、どのようなお話でしょう。」
      錦衣官は歩み寄り、いきなり悟空をつかんだ。
      錦衣官「私と宮殿へ来るのだ。きっと何か、お使いになりたいことがあるのだろう。」
      ああ、まさに、

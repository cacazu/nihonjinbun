    "translation_ja": "原文の「比丘一國非君亂，小子千名是命訛」は、そのまま取れば、国の乱れを王自身のせいではないとし、子供たちの災難を運命の狂いとする句になる。王の責任を非難する周囲の叙述と緊張があるが、字を改めて整合させず、否定と運命の語を残した。細かな含意には留保がある。"

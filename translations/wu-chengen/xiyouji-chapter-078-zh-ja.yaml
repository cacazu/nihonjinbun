    "translation_ja": "悟空のいう「先天」は、天地や万物の成立以前の根源的なあり方を指す修行上の語。採薬だけを修行の本道とする考えとの対比として訳した。ここでの国丈の人間・妖怪という区別は、まだ条件を置いた話である。"
    "translation_status": "draft"
  - "id": "xy-ch78-note-07-body"

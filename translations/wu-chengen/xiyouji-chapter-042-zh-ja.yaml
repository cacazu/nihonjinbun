    "source_text": "妖王道：「父王把我八個字時常不離口論說，說我有同天不老之壽，怎麼今日一旦忘了？豈有此理，必是假的。」哏的一聲，群妖槍刀簇擁，望行者沒頭沒臉的劄來。這大聖使金箍棒架住了，現出本像，對妖精道：「賢郎，你卻沒理那裡兒子好打爺的？」那妖王滿面羞慚，不敢回視。行者化金光，走出他的洞府。小妖道：「大王，孫行者走了。」妖王道：「罷罷罷，讓他走了罷，我吃他這一場虧也。且關了門，莫與他打話，只來刷洗唐僧，蒸吃便罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      紅孩児「父上は私の生まれを表す八字（はちじ）を、いつも口にしておいででした。天とともに老いぬ寿命があると、おっしゃっていたのです。それを今日、急に忘れたとは。そんな馬鹿なことがあるものか。やはり偽物だ！」
      紅孩児が一喝すると、妖怪たちが槍と刀を構えて押し寄せ、悟空めがけて所かまわず突きかかった。悟空は金箍棒で受け止め、本来の姿を現して言った。
      悟空「息子よ、お前は道理を知らんな。父親を殴ってよい息子がどこにいる」
      紅孩児は恥ずかしさに顔を真っ赤にし、まともに見返すことができない。悟空は金色の光となって、洞穴の外へ出た。
      小妖怪「大王、孫行者が逃げました」
      紅孩児「もうよい、もうよい、もうよい。行かせておけ。今度ばかりは、まんまとやられた。門を閉めろ。あいつの相手などするな。唐僧を洗って、蒸して食うことにしよう」
    "translation_status": "reviewed"
  - "id": "xy-ch42-013"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那行者搴著鐵棒，呵呵大笑，自澗那邊而來。沙僧聽見，急出林迎著道：「哥啊，這半日方回，如何這等哂笑，想救出師父來也？」行者道：「兄弟，雖不曾救得師父，老孫卻得個上風來了。」沙僧道：「甚麼上風？」行者道：「原來豬八戒被那怪假變觀音哄將回來，吊於皮袋之內。我欲設法救援，不期他著甚麼六健將去請老大王來吃師父肉。是老孫想著他老大王必是牛魔王，就變了他的模樣，充將進去，坐在中間。他叫父王，我就應他；他便叩頭，我就直受。著實快活，果然得了上風。」沙僧道：「哥啊，你便圖這般小便宜，恐師父性命難保。」行者道：「不須慮，等我去請菩薩來。」沙僧道：「你還腰疼哩。」行者道：「我不疼了。古人云：『人逢喜事精神爽。』你看著行李、馬匹，等我去。」沙僧道：「你置下仇了，恐他害我師父，你須快去快來。」行者道：「我來得快，只消頓飯時，就回來矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      さて、悟空は鉄棒を手にし、声高らかに笑いながら谷の向こうから戻ってきた。声を聞いた沙悟浄（さごじょう）が急いで林を出て迎えた。
      沙悟浄「兄さん、半日もたって、ようやくお戻りですか。そんなに笑っているということは、お師匠さまを救い出せたのですか」
      悟空「弟よ、お師匠さまはまだ救い出せなかったが、俺は一つ、向こうをへこませてやったぞ」
      沙悟浄「どういうことですか」
      悟空「あの妖怪が観音に化けて八戒（はっかい）をだまして連れ帰り、革袋の中につるしていたんだ。俺が何とか助けようと考えていると、奴は六健将とやらに、老大王を呼んでお師匠さまの肉を食わせようと命じた。老大王ならきっと牛魔王だと思い、俺がその姿に化けて入り込み、真ん中の席に座ってやった。奴が父上と呼べば返事をし、頭を下げれば、そのまま受けてやったのさ。実に愉快だった。確かに一つ勝ってやったぞ」
      沙悟浄「兄さん、そんな小さな得をすることばかり考えていては、お師匠さまのお命が危ういですよ」
      悟空「心配するな。菩薩さまを呼びに行ってくる」
      沙悟浄「でも、まだ腰が痛むのでしょう」
      悟空「もう痛くない。昔から『うれしいことに出会えば、心も体も元気になる』というじゃないか。荷物と馬を見ていてくれ。行ってくる」
      沙悟浄「恨みを買ってしまったのですから、お師匠さまに危害を加えるかもしれません。急いで行って、急いで帰ってきてください」
      悟空「すぐ戻るさ。飯を一膳食べるほどの間で帰ってくる」
    "translation_status": "reviewed"
  - "id": "xy-ch42-014"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，說話間躲離了沙僧，縱觔斗雲，徑投南海。在那半空裡，那消半個時辰，望見普陀山景。須臾，按下雲頭，直至落伽崖上。端肅正行，只見二十四路諸天迎著道：「大聖，那裡去？」行者作禮畢，道：「要見菩薩。」諸天道：「少停，容通報。」時有鬼子母諸天來潮音洞外報道：「菩薩得知：孫悟空特來參見。」菩薩聞報，即命進去。大聖斂衣皈命，捉定步，徑入裡邊，見菩薩倒身下拜。菩薩道：「悟空，你不領金蟬子西方求經去，卻來此何幹？」行者道：「上告菩薩：弟子保護唐僧前行，至一方，乃號山枯松澗火雲洞。有一個紅孩兒妖精，喚作聖嬰大王，把我師父攝去。是弟子與豬悟能等尋至門前，與他交戰。他放出三昧火來，我等不能取勝，救不出師父。急上東洋大海，請到四海龍王，施雨水，又不能勝火，把弟子都燻壞了，幾乎喪了殘生。」菩薩道：「既他是三昧火，神通廣大，怎麼去請龍王，不來請我？」行者道：「本欲來的，只是弟子被煙燻了，不能駕雲，卻教豬八戒來請菩薩。」菩薩道：「悟能不曾來呀。」行者道：「正是。未曾到得寶山，被那妖精假變做菩薩模樣，把豬八戒又賺入洞中，現吊在一個皮袋裡，也要蒸吃哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      そう言う間にも悟空は沙悟浄から離れ、觔斗雲（きんとうん）に飛び乗って、まっすぐ南海へ向かった。空を行くこと半時辰（じしん）もかからず、普陀山（ふださん）の景色が見えてくる。ほどなく雲を降ろし、落伽崖（らっかがい）へ着いた。身を正し、厳粛な面持ちで進むと、二十四路諸天（にじゅうしろしょてん）が迎えた。
      諸天（しょてん）「大聖（たいせい）、どちらへいらっしゃいますか」
      悟空は礼をして答えた。
      悟空「菩薩さまにお目にかかりたいのです」
      諸天「少々お待ちください。お取り次ぎいたします」
      そのとき鬼子母諸天（きしもしょてん）が潮音洞（ちょうおんどう）の外へ行き、報告した。
      鬼子母諸天「菩薩さまに申し上げます。孫悟空（そんごくう）がお目通りを願って参りました」
      観音菩薩は報告を聞くと、入るよう命じた。悟空は衣を整え、敬虔な心で足取りを正し、奥へ進んだ。観音菩薩に会うと、身を投げ出して拝礼した。
      観音菩薩「悟空、金蝉子（きんせんし）を連れて西方（さいほう）へ経典を求めに行かず、何をしにここへ来たのです」
      悟空「菩薩さまに申し上げます。弟子の私は唐僧をお守りして旅を続け、号山（ごうざん）の枯松澗（こしょうかん）、火雲洞という所へ参りました。そこに紅孩児という妖怪がおり、聖嬰大王と名乗って、お師匠さまをさらったのです。私と猪悟能（ちょごのう）たちは門前まで捜しに行き、戦いましたが、奴は三昧の火を放ちました。私どもは勝てず、お師匠さまを救い出せません。急いで東の大海へ行き、四海の竜王に雨を降らせてもらっても、火にはかないませんでした。私まで煙にいぶされ、危うく命を落とすところでした」
      観音菩薩「あの者が三昧の火を使い、それほど神通力に優れているなら、なぜ竜王を呼びに行き、私を呼びに来なかったのです」
      悟空「本当は参るつもりでした。しかし煙にいぶされて、雲に乗れなくなったので、八戒を菩薩さまのお迎えに出したのです」
      観音菩薩「悟能（ごのう）は来ていませんよ」
      悟空「そのとおりです。このお山へ着く前に、妖怪が菩薩さまの姿に化け、八戒まで洞穴へだまして連れ込んでしまいました。今は革袋につるして、あいつも蒸して食おうとしております」
    "translation_status": "reviewed"
  - "id": "xy-ch42-015"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "菩薩聽說，心中大怒道：「那潑妖敢變我的模樣？」恨了一聲，將手中寶珠、淨瓶往海心裡撲的一摜。諕得那行者毛骨竦然，即起身侍立下面，道：「這菩薩火性不退，好是怪老孫說的話不好，壞了他的德行，就把淨瓶摜了，可惜，可惜。早知送了我老孫，卻不是一件大人事？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      観音菩薩はそれを聞くと、心の底から怒った。
      観音菩薩「不届きな妖怪め。よくも私の姿に化けましたね！」
      憤りの声を上げると、手にしていた宝珠と浄瓶（じょうへい）を、海の真ん中へ勢いよく投げ込んだ。悟空はぞっとして身の毛がよだち、すぐ立ち上がって下座に控えながら言った。
      悟空「この菩薩さま、まだ短気が収まっていないな。きっと俺の話が悪く、ご自分の徳を傷つけられたとお怒りになって、浄瓶を投げてしまわれたのだろう。惜しい、惜しい。ああするくらいなら、先に俺へ下さればよかったのに。大した贈り物になったろうに」
    "translation_status": "reviewed"
  - "id": "xy-ch42-016"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，只見那海當中翻波跳浪，鑽出個瓶來。原來是一個怪物馱著出來。行者仔細看那馱瓶的怪物，怎生模樣："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 136
        "line_end": 136
    "translation_ja": "まだ言い終わらないうちに、海の真ん中で波が躍り、うねり、その中から瓶が浮かび上がった。何か怪物が背に載せて出てきたのだ。悟空が瓶を背負った怪物をよく見ると、それはこんな姿だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-017"
    "section_id": "chapter-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      根源出處號幫泥，水底增光獨顯威。
      世隱能知天地性，安藏偏曉鬼神機。
      藏身一縮無頭尾，展足能行快似飛。
      文王畫卦曾元卜，常納庭臺伴伏羲。
      雲龍透出千般俏，號水推波把浪吹。
      條條金線穿成甲，點點裝成彩玳瑁。
      九宮八卦袍披定，散碎鋪遮綠燦衣。
      生前好勇龍王幸，死後還馱佛祖碑。
      要知此物名和姓，興風作浪惡烏龜。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 138
        "line_end": 146
    "translation_ja": |-
      その出自をたどれば幫泥（ほうでい）と呼ばれ、水底を照らしてひとり威を示す。
      世から隠れて天地の性を知り、ひそかに身を潜めて鬼神の機微を悟る。
      身を縮めれば頭も尾も見えず、足を伸ばせば飛ぶように進む。
      文王（ぶんおう）が卦を描くときには占いに用いられ、いつも庭や高台に迎えられて伏羲（ふっき）に付き添った。
      雲や竜の模様は千変万化の美しさを見せ、水を呼び、波を押してうねりを立てる。
      幾筋もの金の線が甲を縫い、点々とした彩りは美しい鼈甲をなす。
      九宮八卦（きゅうきゅうはっけ）の袍（ほう）をまとい、細かな模様が緑に輝く衣を覆う。
      生きては勇猛を好んで竜王に愛され、死んでもなお仏祖（ぶっそ）の碑を背負う。
      このものの名を知りたいか。風を起こし、波を立てる荒々しい亀である。
    "translation_status": "reviewed"
  - "id": "xy-ch42-018"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那龜馱著淨瓶，爬上崖邊，對菩薩點頭二十四點，權為二十四拜。行者見了，暗笑道：「原來是看瓶的。想是不見瓶，就問他要。」菩薩道：「悟空，你在下面說甚麼？」行者道：「沒說甚麼。」菩薩教：「拿上瓶來。」這行者即去拿瓶。唉！莫想拿得他動。好便似蜻蜓撼石柱，怎生搖得半分毫？行者上前跪下道：「菩薩，弟子拿不動。」菩薩道：「你這猴頭，只會說嘴。瓶兒你也拿不動，怎麼去降妖縛怪？」行者道：「不瞞菩薩說。平日拿得動，今日拿不動。想是吃了妖精虧，觔力弱了。」菩薩道：「常時是個空瓶；如今是淨瓶拋下海去，這一時間，轉過了三江五湖、八海四瀆、溪源潭洞之間，共借了一海水在裡面。你那裡有架海的斤量？此所以拿不動也。」行者合掌道：「是，弟子不知。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      亀は浄瓶を背負って崖のほとりへはい上がり、観音菩薩に二十四度頭を下げて、二十四度の拝礼に代えた。悟空はそれを見て、ひそかに笑った。
      悟空「なるほど、瓶の番をする奴か。瓶が見当たらなくなったら、こいつに出せと言うわけだな」
      観音菩薩「悟空、そこで何を言っているのです」
      悟空「何も言っておりません」
      観音菩薩「瓶を持ってきなさい」
      悟空は瓶を取りに行った。だが、ああ、動かすことなど思いもよらない。蜻蛉が石柱を揺すろうとするようなもので、ほんのわずかも動かせなかった。悟空は進み出てひざまずいた。
      悟空「菩薩さま、私には持ち上げられません」
      観音菩薩「この猿め、口ばかり達者ですね。瓶一つ持ち上げられなくて、どうやって妖怪を退治し、縛り上げるのです」
      悟空「隠し立てはいたしません。普段なら持てるのですが、今日は持てません。妖怪にひどい目に遭わされて、力が弱っているのでしょう」
      観音菩薩「いつもは空の瓶です。今は海へ投げ込んだ浄瓶が、そのわずかな間に三江五湖（さんこうごこ）、八つの海と四瀆（しとく）、谷川の源や淵、洞穴を巡り、一つの海ほどの水を借りて、中へ集めたのです。お前に海を支えるほどの力がありますか。だから持ち上がらないのです」
      悟空は合掌した。
      悟空「はい、存じませんでした」
    "translation_status": "reviewed"
  - "id": "xy-ch42-019"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那菩薩走上前，將右手輕輕的提起淨瓶，托在左手掌上。只見那龜點點頭，鑽下水去了。行者道：「原來是個養家看瓶的夯貨。」菩薩坐定道：「悟空，我這瓶中甘露水漿，比那龍王的私雨不同，能滅那妖精的三昧火。待要與你拿了去，你卻拿不動；待要著善財龍女與你同去，你卻又不是好心，專一只會騙人。你見我這龍女貌美，淨瓶又是個寶物，你假若騙了去，卻那有工夫又來尋你？你須是留些甚麼東西作當。」行者道：「可憐！菩薩這等多心。我弟子自秉沙門，一向不幹那樣事了。你教我留些當頭，卻將何物？我身上這件綿布直裰，還是你老人家賜的。這條虎皮裙子，能值幾個銅錢？這根鐵棒，早晚卻要護身。但只是頭上這個箍兒，是個金的，卻又被你弄了個方法兒長在我頭上，取不下來。你今要當頭，情願將此為當。你念個鬆箍兒咒，將此除去罷；不然，將何物為當？」菩薩道：「你好自在啊！我也不要你的衣服、鐵棒、金箍，只將你那腦後救命的毫毛拔一根與我作當罷。」行者道：「這毫毛也是你老人家與我的。但恐拔下一根，就拆破群了，又不能救我性命。」菩薩罵道：「你這猴子！你便一毛也不拔，教我這善財也難捨。」行者笑道：「菩薩，你卻也多疑。正是『不看僧面看佛面』。千萬救我師父一難罷。」那菩薩："

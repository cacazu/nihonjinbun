        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      観音菩薩は前へ進み、右手で軽々と浄瓶を持ち上げ、左の掌に載せた。亀はうなずくように頭を下げ、水の中へ潜っていった。
      悟空「なるほど、家を支えて瓶の番をする、のろまな奴だったか」
      観音菩薩は座り直した。
      観音菩薩「悟空、この瓶の甘露水（かんろすい）は、竜王が勝手に降らせる雨とは違い、あの妖怪の三昧の火を消せます。お前に持たせようにも、お前には持てない。善財竜女（ぜんざいりゅうにょ）を一緒に行かせようにも、お前は善良ではなく、人をだますことばかりしています。この竜女（りゅうにょ）が美しく、浄瓶が宝物なのを見て、もしだまして連れ去ったら、またお前を捜す暇などどこにあります。何か担保を置いていきなさい」
      悟空「ひどいお疑いです、菩薩さま。私は仏門に入ってから、そんなことはしておりません。担保を置けとおっしゃっても、何を置けばよいのでしょう。この木綿の直裰（ちょくたつ）も、あなたさまから頂いたものです。この虎の皮の腰衣など、銅銭何枚の値打ちがありますか。この鉄棒は、いつも身を守るために必要です。ただ、頭の輪なら金でできていますが、あなたさまが術をかけ、頭にくっついて外せません。担保をお求めなら、喜んでこれを差し上げます。輪を緩める呪文を唱えて、外してください。それでなければ、何を担保にすればよいのです」
      観音菩薩「ずいぶん都合のよいことを言いますね。衣も鉄棒も頭の金の輪も要りません。後頭部の命を救う毛を一本抜いて、担保にしなさい」
      悟空「この毛も、あなたさまに頂いたものです。ただ、一本抜けば一そろいでなくなり、命を救えなくなるのではないかと心配でして」
      観音菩薩は叱った。
      観音菩薩「この猿め。お前が毛の一本も出さないのでは、私もこの善財（ぜんざい）を手放しにくいではありませんか」
      悟空は笑った。
      悟空「菩薩さま、それでもお疑いが深すぎます。『僧の顔は立てずとも、仏の顔を立てよ』と申します。どうか何としても、お師匠さまをこの災難からお救いください」
      そこで観音菩薩は、
    "translation_status": "reviewed"
  - "id": "xy-ch42-020"
    "section_id": "chapter-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      逍遙欣喜下蓮臺，雲步香飄上石崖。
      只為聖僧遭障害，要降妖怪救回來。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 149
        "line_end": 150
    "translation_ja": |-
      喜びを帯び、ゆったりと蓮台を降り、香りを漂わせる雲の歩みで岩の崖へ上る。
      ただ聖なる僧が災いに遭ったため、妖怪を降伏させ、救い戻そうというのである。
    "translation_status": "reviewed"
  - "id": "xy-ch42-021"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖十分歡喜，請觀音出了潮音仙洞。諸天大神都列在普陀巖上。菩薩道：「悟空，過海。」行者躬身道：「請菩薩先行。」菩薩道：「你先過去。」行者磕頭道：「弟子不敢在菩薩面前施展。若駕觔斗雲啊，掀露身體，恐菩薩怪我不敬。」菩薩聞言，即著善財龍女去蓮花池裡劈一瓣蓮花，放在石巖下邊水上。教行者：「你上那蓮花瓣兒，我渡你過海。」行者見了道：「菩薩，這花瓣兒又輕又薄，如何載得我起？這一屣翻跌下水去，卻不濕了虎皮裙？走了硝，天冷怎穿？」菩薩喝道：「你且上去看。」行者不敢推辭，捨命往上跳。果然先見輕小，到上面比海船還大三分。行者歡喜道：「菩薩，載得我了。」菩薩道：「既載得，如何不過去？」行者道：「又沒了篙、槳、篷、桅，怎生得過？」菩薩道：「不用。」只把他一口氣吹開吸攏，又著實一口氣吹過南洋苦海，得登彼岸。行者卻腳屣實地，笑道：「這菩薩賣弄神通，把老孫這等呼來喝去，全不費力也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      悟空は大いに喜び、観音菩薩を潮音洞の外へお連れした。諸天の大神たちは普陀（ふだ）の岩場に並んでいた。
      観音菩薩「悟空、海を渡りなさい」
      悟空は身をかがめた。
      悟空「菩薩さま、どうぞお先に」
      観音菩薩「お前が先に行くのです」
      悟空は頭を地につけた。
      悟空「菩薩さまの御前で、私の術をお見せするわけにはまいりません。觔斗雲に乗れば体があらわになって、不敬だとお叱りを受けはしないかと」
      観音菩薩はそれを聞くと、善財竜女に蓮の池から花びらを一枚ちぎらせ、岩場の下の水面へ置かせた。
      観音菩薩「その花びらに乗りなさい。私が海を渡してやります」
      悟空はそれを見た。
      悟空「菩薩さま、こんなに軽くて薄い花びらで、どうして私を載せられるのでしょう。踏み外して水へ落ちたら、虎の皮の腰衣が濡れてしまいます。なめしに使った硝が抜けたら、寒いときにどうして着られましょう」
      観音菩薩は叱った。
      観音菩薩「まずは乗ってみなさい！」
      悟空は断る勇気もなく、命を投げ出すつもりで飛び乗った。すると、最初は小さく軽そうに見えたものが、上に乗ると、海を行く船より三割も大きかった。悟空は喜んだ。
      悟空「菩薩さま、私を載せられました！」
      観音菩薩「載せられたなら、なぜ渡らないのです」
      悟空「棹も櫂も、帆も帆柱もありません。どうやって渡るのです」
      観音菩薩「要りません」
      息を一吹きすれば遠ざかり、吸えば近づいてきた。そして、ひときわ強く息を吹き、南の苦海を渡らせ、向こう岸へ着かせた。悟空はしっかりした地面を踏み、笑った。
      悟空「この菩薩さま、神通力をご披露して、俺を息一つで行ったり来たりさせる。何の苦労もないんだな」
    "translation_status": "reviewed"
  - "id": "xy-ch42-022"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那菩薩吩咐概眾諸天各守仙境，著善財龍女閉了洞門。他卻縱祥雲，躲離普陀巖，到那邊叫：「惠岸何在？」惠岸（乃托塔李天王第二個太子，俗名木叉是也。）乃菩薩親傳授的徒弟，不離左右，稱為護法惠岸行者。惠岸即對菩薩合掌伺候。菩薩道：「你快上界去，見你父王，問他借天罡刀來一用。」惠岸道：「師父用著幾何？」菩薩道：「全副都要。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      観音菩薩は諸天の一同に、それぞれ仙境を守るよう命じ、善財竜女には洞穴の門を閉めさせた。自分は瑞雲に乗り、普陀の岩場を離れて、向こう側へ来ると呼んだ。
      観音菩薩「恵岸（えがん）、どこにいます」
      恵岸は托塔李天王（たくとうりてんのう）の第二太子で、俗名を木叉（もくさ）という。観音菩薩から直接教えを受けた弟子で、常にその左右に付き従い、護法恵岸行者（ごほうえがんぎょうじゃ）と呼ばれていた。恵岸行者（えがんぎょうじゃ）はすぐ観音菩薩に向かって合掌し、命を待った。
      観音菩薩「急いで天上へ行き、父上に会って、天罡刀（てんこうとう）を借りてきなさい」
      恵岸行者「お師匠さま、何本必要でしょうか」
      観音菩薩「一そろい、全部です」
    "translation_status": "reviewed"
  - "id": "xy-ch42-023"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "惠岸領命，即駕雲頭，徑入南天門裡，到雲樓宮殿，見父王下拜。天王見了，問：「兒從何來？」木叉道：「師父是孫悟空請來降妖，著兒拜上父王，將天罡刀借了一用。」天王即喚哪吒將刀取三十六把，遞與木叉。木叉對哪吒說：「兄弟，你回去多拜上母親：我事緊急，等送刀來再磕頭罷。」忙忙相別，按落祥光，徑至南海，將刀捧與菩薩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      恵岸行者は命を受け、すぐ雲に乗って南天門（なんてんもん）へ入った。雲楼宮（うんろうきゅう）へ着き、父に拝礼すると、李天王（りてんのう）が尋ねた。
      李天王「どこから来たのだ」
      恵岸行者「お師匠さまが孫悟空に頼まれ、妖怪を退治に出られます。父上にご挨拶し、天罡刀をお借りするよう、私にお命じになりました」
      李天王はすぐ哪吒（なた）を呼び、刀を三十六本取り出させ、恵岸行者に渡した。恵岸行者は哪吒に言った。
      恵岸行者「弟よ、戻ったら母上に、くれぐれもよろしく伝えてくれ。急ぎの用なので、刀を返しに来たときに、改めてご挨拶しよう」
      慌ただしく別れを告げ、瑞光を降ろして南海へ直行し、刀を観音菩薩に捧げた。
    "translation_status": "reviewed"
  - "id": "xy-ch42-024"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "菩薩接在手中，拋將去，念個咒語，只見那刀化作一座千葉蓮臺。菩薩縱身上去，端坐在中間。行者在傍暗笑道：「這菩薩省使儉用。那蓮花池裡有五色寶蓮臺，捨不得坐將來，卻又問別人去借。」菩薩道：「悟空，休言語，跟我來也。」卻才都駕著雲頭，離了海上。白鸚哥展翅前飛，孫大聖與惠岸隨後。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      観音菩薩は刀を受け取ると、空へ投げ、呪文を唱えた。すると刀は、千の花びらを重ねた蓮台に変わった。観音菩薩は飛び乗り、その真ん中に端座した。悟空は傍らでひそかに笑った。
      悟空「この菩薩さまは倹約家だ。蓮の池には五色の宝の蓮台があるのに、惜しんで乗ってこず、わざわざ人に借りるとはな」
      観音菩薩「悟空、口を慎んで、ついてきなさい」
      ようやく一同は雲に乗り、海上を離れた。白い鸚哥が翼を広げて先を飛び、悟空と恵岸行者が後に続いた。
    "translation_status": "reviewed"
  - "id": "xy-ch42-025"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "頃刻間，早見一座山頭。行者道：「這山就是號山了。從此處到那妖精門首，約摸有四百餘里。」菩薩聞言，即命住下祥雲，在那山頭上念一聲「唵」字咒語。只見那山左山右，走出許多神鬼，卻乃是本山土地眾神，都到菩薩寶蓮座下磕頭。菩薩道：「汝等俱莫驚張。我今來擒此魔王，你與我把這團圍打掃乾淨，要三百里遠近地方，不許一個生靈在地。將那窩中小獸，窟內雛蟲，都送在巔峰之上安生。」眾神遵依而退。須臾間，又來回覆。菩薩道：「既然乾淨，俱各回祠。」遂把淨瓶扳倒，唿喇喇傾出水來，就如雷響。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      たちまち、前方に一つの山頂が見えた。
      悟空「あれが号山です。ここから妖怪の門前までは、およそ四百余里あります」
      観音菩薩はそれを聞くと、瑞雲を止めさせ、山頂で「唵（おん）」と一声、呪を唱えた。山の左右から大勢の神々や霊が現れた。この山の土地神たちで、みな観音菩薩の宝の蓮座の下へ来て拝礼した。
      観音菩薩「みな、慌てることはありません。私は今、この魔王を捕らえに来ました。周囲三百里ほどの土地を、きれいに空けてください。生き物を一匹も地上に残してはなりません。巣の小さな獣も、穴の中の虫の子も、みな山の高い峰へ移し、無事に暮らせるようにするのです」
      神々は命に従って退き、ほどなく戻って報告した。
      観音菩薩「すっかり空けたのなら、それぞれの祠へ戻りなさい」
      そして浄瓶を傾けると、水がごうごうと雷のような音を立てて流れ出した。まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch42-026"
    "section_id": "chapter-42"
    "kind": "verse"
    "origin": "source"
    "source_text": "漫過山頭，沖開石壁。漫過山頭如海勢，沖開石壁似汪洋。黑霧漲天全水氣，滄波影日晃寒光。遍崖沖玉浪，滿海長金連。菩薩大展降魔法，袖中取出定身禪。化做落伽仙景界，真如南海一般般。秀蒲挺出曇花嫩，香草舒開貝葉鮮。紫竹幾竿鸚鵡歇，青松數簇鷓鴣喧。萬疊波濤蓮四野，只聞風吼水漫天。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      山頂を越えてあふれ、岩壁を押し開く。
      山を越える水の勢いは大海のよう、岩を押し開く広がりは果てしない海原のよう。
      黒い霧が空へ満ち、それはすべて水の気。青々とした波が日を映し、冷たい光を揺らす。
      崖という崖に玉のような波が打ち寄せ、海一面に金色の蓮が育つ。
      観音菩薩は大いに降魔の法を示し、袖から定身禅（ていしんぜん）の術を取り出した。
      辺りは落伽（らっか）の仙境に変わり、南海とまったく同じ姿になる。
      美しい蒲はすっくと伸び、曇花（どんげ）は柔らかく、香草は葉を広げ、貝葉（ばいよう）はみずみずしい。
      紫竹の数本には鸚鵡が休み、青松の幾つもの茂みでは鷓鴣が鳴く。
      幾万重もの波が重なり、蓮は四方に広がる。ただ風がほえ、水が空まで満ちるばかり。
    "translation_status": "reviewed"
  - "id": "xy-ch42-027"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖見了，暗中讚嘆道：「果然是一個大慈大悲的菩薩！若老孫有此法力，將瓶兒望山一倒，管甚麼禽獸蛇蟲哩。」菩薩叫：「悟空，伸手過來。」行者即忙斂袖，將左手伸出。菩薩拔楊柳枝，蘸甘露，把手心裡寫一個「迷」字。教他：「捏著拳頭，快去與那妖精索戰，許敗不許勝。敗將來我這跟前，我自有法力收他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      悟空はそれを見て、心の中で感嘆した。
      悟空「さすが大慈大悲の菩薩さまだ。俺にこんな法力があったら、瓶を山へぶちまけるだけで、鳥や獣、蛇や虫のことなど構うものか」
      観音菩薩「悟空、手を出しなさい」
      悟空は急いで袖をまくり、左手を差し出した。観音菩薩は楊柳（ようりゅう）の枝を抜き、甘露（かんろ）に浸して、掌に「迷」の一字を書いた。
      観音菩薩「拳を握って、急いで妖怪に戦いを挑みなさい。負けるのはよいが、勝ってはなりません。負けて私の前へ逃げてくるのです。私の法力で捕らえましょう」
    "translation_status": "reviewed"
  - "id": "xy-ch42-028"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者領命，返雲光，徑來至洞口。一隻手使拳，一隻手使棒，高叫道：「妖怪開門！」那些小妖又進去報道：「孫行者又來了。」妖王道：「緊關了門，莫睬他。」行者叫道：「好兒子！把老子趕在門外，還不開門？」小妖又報道：「孫行者罵出那話兒來了。」妖王只教：「莫睬他。」行者叫兩次，見不開門，心中大怒，舉鐵棒，將門一下，打了一個窟窿。慌得那小妖跌將進去道：「孫行者打破門了。」妖王見報幾次，又聽說打破前門，急縱身，跳將出去，挺長槍，對行者罵道：「這猴子，老大不識起倒。我讓你得些便宜，你還不知盡足，又來欺我。打破我門，你該個甚麼罪名？」行者道：「我兒，你趕老子出門，你該個甚麼罪名？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"

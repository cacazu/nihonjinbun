    "translation_ja": |-
      悟空は命を受け、雲の光を返して、まっすぐ洞穴の口へ向かった。片手は拳を握り、片手に棒を持って、大声で叫んだ。
      悟空「妖怪、門を開けろ！」
      小妖怪たちがまた中へ報告に行った。
      小妖怪たち「孫行者がまた来ました」
      紅孩児「門をしっかり閉めておけ。相手にするな」
      悟空「孝行息子よ！　親父を門の外へ追い出して、まだ開けないつもりか！」
      小妖怪たちはまた報告した。
      小妖怪たち「孫行者が、あんなことを言ってののしっております」
      紅孩児「相手にするな」
      悟空は二度呼んでも門が開かないので、かっとなり、鉄棒を振り上げて一撃を加え、門に穴をあけた。小妖怪は慌てふためき、転がり込むように中へ入った。
      小妖怪「孫行者が門を壊しました！」
      何度も報告を受け、そのうえ表門を壊されたと聞いた紅孩児は、急いで飛び出した。長槍を構え、悟空をののしる。
      紅孩児「この猿め、いい年をして、物事のけじめも知らんのか。少し得をさせてやったのに、それで満足せず、また俺を侮りに来るとは。門まで壊して、どんな罪になると思っている！」
      悟空「息子よ、親父を門の外へ追い出したお前は、どんな罪になると思っている！」
    "translation_status": "reviewed"

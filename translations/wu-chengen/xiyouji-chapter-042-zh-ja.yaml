    "source_text": "那妖王羞怒，綽長槍，劈胸便刺；這行者，舉鐵棒，架隔相還。一番搭上手，鬥經四五個回合，行者捏著拳頭，拖著棒，敗將下來。那妖王立在山前道：「我要刷洗唐僧去哩。」行者道：「好兒子，天看著你哩。你來。」那妖精聞言，愈加嗔怒，喝一聲，趕到面前，挺槍又刺；這行者掄棒，又戰幾合，敗陣又走。那妖王罵道：「猴子，你在前有二三十合的本事，你怎麼如今正鬥時就要走了，何也？」行者笑道：「賢郎，老子怕你放火。」妖精道：「我不放火了，你上來。」行者道：「既不放火，走開些，好漢子莫在家門前打人。」那妖精不知是詐，真個舉槍又趕。行者拖了棒，放了拳頭。那妖王著了迷亂，只情追趕。前走的如流星過度，後走的如弩箭離弦。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      紅孩児は恥ずかしさと怒りに駆られ、長槍を引っつかんで悟空の胸を突いた。悟空は鉄棒を挙げて受け止め、打ち返した。ぶつかり合って四、五合戦うと、悟空は拳を握ったまま棒を引きずり、負けて逃げ出した。紅孩児は山の前に立ち止まった。
      紅孩児「俺は唐僧を洗いに行くぞ」
      悟空「孝行息子め、天がお前を見ているぞ。こっちへ来い！」
      それを聞いた紅孩児はますます怒り、一喝して追いつくと、槍を構えてまた突いた。悟空は棒を振るい、さらに数合戦って、また負けて逃げる。紅孩児はののしった。
      紅孩児「猿め、前には二、三十合は戦えたのに、今は戦い始めたらすぐ逃げる。どういうわけだ！」
      悟空は笑った。
      悟空「息子よ、親父はお前が火を吐くのが怖いのさ」
      紅孩児「もう火は吐かん。かかってこい」
      悟空「火を吐かないなら、少し離れた所へ行こう。立派な男なら、自分の家の門前で人を殴るものではないぞ」
      紅孩児は罠とは知らず、本当に槍を挙げて追ってきた。悟空は棒を引きずりながら、握っていた拳を開いた。紅孩児は迷いの術にかかり、ただひたすら追いすがる。前を行く者は空を横切る流星のよう、後を追う者は弩から放たれた矢のようだった。
    "translation_status": "reviewed"
  - "id": "xy-ch42-030"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不一時，望見那菩薩了。行者道：「妖精，我怕你了，你饒我罷。你如今趕至南海觀音菩薩處，怎麼還不回去？」那妖王不信，咬著牙，只管趕來。行者將身一幌，藏在那菩薩的神光影裡。這妖精見沒了行者。走近前，睜圓眼，對菩薩道：「你是孫行者請來的救兵麼？」菩薩不答應。妖王撚轉長槍，喝道：「咄！你是孫行者請來的救兵麼？」菩薩也不答應。妖精望菩薩劈心刺一槍來。那菩薩化道金光，徑走上九霄空內。行者跟定道：「菩薩，你好欺伏我罷了，那妖精再三問你，你怎麼推聾裝啞，不敢做聲，被他一槍搠走了，卻把那個蓮臺都丟下耶？」菩薩只教：「莫言語，看他再要怎的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      まもなく観音菩薩の姿が見えた。
      悟空「妖怪、お前が怖い。勘弁してくれ。南海の観音菩薩さまの所まで追ってきて、どうしてまだ戻らないんだ」
      紅孩児は信じず、歯を食いしばって追い続けた。悟空は身をひらりとかわし、観音菩薩の神々しい光の中へ隠れた。悟空を見失った紅孩児は前へ進み、目を丸く見開いて尋ねた。
      紅孩児「お前は孫行者が呼んだ援軍か」
      観音菩薩は答えない。紅孩児は長槍を回し、怒鳴った。
      紅孩児「おい！　お前は孫行者が呼んだ援軍か！」
      それでも観音菩薩は答えなかった。紅孩児は観音菩薩の胸の真ん中へ、槍を一突きに突き出した。観音菩薩は金色の光となって、まっすぐ九重の空の高みへ上った。悟空はぴったりついていった。
      悟空「菩薩さま、私をいじめるのだけはお得意ですな。妖怪に何度も尋ねられても、聞こえず話せないふりをして、一言も答えようとなさらない。それで槍の一突きに追い払われ、蓮台まで置き去りになさったのですか」
      観音菩薩「口を慎みなさい。あの者が次に何をするか、見ているのです」
    "translation_status": "reviewed"
  - "id": "xy-ch42-031"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時行者與木叉俱在空中，並肩同看。只見那妖呵呵冷笑道：「潑猴頭，錯認了我也。他不知把我聖嬰當作個甚人，幾番家戰我不過，又去請個甚麼膿包菩薩來卻被我一槍，搠得無形無影去了，又把個寶蓮臺兒丟了。且等我上去坐坐。」好妖精，他也學菩薩，盤手盤腳的坐在當中。行者看見道：「好好好，蓮花臺兒好送人了。」菩薩道：「悟空，你又說甚麼？」行者道：「說甚？說甚？蓮臺送了人了。那妖精坐放臀下，終不得你還要哩？」菩薩道：「正要他坐哩。」行者道：「他的身軀小巧，比你還坐得穩當。」菩薩叫：「莫言語，且看法力。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      このとき悟空と恵岸行者は、空中で肩を並べて見下ろしていた。紅孩児は冷ややかに笑った。
      紅孩児「あの不届きな猿め、俺を見誤ったな。この聖嬰（せいえい）を何者だと思っている。何度戦ってもかなわないから、今度は間抜けな菩薩を呼んできた。それも俺の槍の一突きで、姿も影もなく消え失せ、宝の蓮台まで置いていったぞ。どれ、俺が上に座ってやろう」
      紅孩児は観音菩薩のまねをして、手足を組み、真ん中に座った。悟空はそれを見た。
      悟空「結構、結構。蓮台を人にくれてやってしまいましたね」
      観音菩薩「悟空、また何を言っているのです」
      悟空「何を言ったか、ですって？　何をって、蓮台をくれてやったと言っているのです。妖怪が尻の下に敷いて座っているものを、まさか返してもらうおつもりではないでしょうね」
      観音菩薩「あの者に座らせたかったのです」
      悟空「小柄な体ですから、あなたさまよりも安定して座れていますよ」
      観音菩薩「口を慎んで、法力を見ていなさい」
    "translation_status": "reviewed"
  - "id": "xy-ch42-032"
    "section_id": "chapter-42"
    "kind": "paragraph"

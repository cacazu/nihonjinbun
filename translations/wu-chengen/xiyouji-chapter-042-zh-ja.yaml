    "source_text": "菩薩叫：「惠岸，你將刀送上天宮，還你父王，莫來接我，先到普陀巖會眾諸天等候。」那木叉領命，送刀上界，回海不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      観音菩薩「恵岸、この刀を天宮へ持っていき、父上に返しなさい。私を迎えに来るには及びません。先に普陀の岩場へ戻り、諸天と一緒に待っていなさい」
      恵岸行者は命を受け、刀を天上へ届け、それから海へ帰った。この話はここまでとしよう。
    "translation_status": "reviewed"
  - "id": "xy-ch42-035"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那童子野性不定，見那腿疼處不疼，臀破處不破，頭挽了三個揪兒，他走去綽起長槍，望菩薩道：「那裡有甚真法力降我？原來是個掩樣術法兒。不受甚戒，看槍！」望菩薩劈臉刺來。恨得個行者掄鐵棒要打。菩薩只叫：「莫打，我自有懲治。」卻又袖中取出一個金箍兒來道：「這寶貝原是我佛如來賜我往東土尋取經人的金、緊、禁三個箍兒。緊箍兒先與你戴了；禁箍兒收了守山大神；這個金箍兒未曾捨得與人，今觀此怪無禮，與他罷。」好菩薩，將箍兒迎風一幌，叫聲：「變！」即變作五個箍兒，望童子身上拋了去，喝聲：「著！」一個套在他頭頂上，兩個套在他左右手上，兩個套在他左右腳上。菩薩道：「悟空，走開些，等我念念金箍兒咒。」行者慌了道：「菩薩呀，請你來此降妖，如何卻要咒我？」菩薩道：「這篇咒不是緊箍兒咒咒你的，是金箍兒咒咒那童子的。」行者卻才放心，緊隨左右，聽他念咒。菩薩捻著訣，默默的念了幾遍，那妖精搓耳揉腮，攢蹄打滾。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      さて、童子になったとはいえ、紅孩児の荒々しい気性はまだ収まっていなかった。痛かった脚も痛まず、裂けていた尻も裂けていない。頭には三つの髷が結ってある。そこで歩み寄って長槍をつかみ、観音菩薩へ言った。
      紅孩児「俺を降伏させる本当の法力など、どこにある。目くらましの術だったのだな。戒めなど受けるものか。槍を受けろ！」
      観音菩薩の顔めがけて突きかかる。悟空は腹を立て、鉄棒を振り上げて殴ろうとした。
      観音菩薩「殴ってはなりません。私が懲らしめます」
      観音菩薩はまた袖から金の輪を一つ取り出した。
      観音菩薩「この宝は、私が東土へ経典を取りに行く人を探しに出たとき、如来仏（にょらいぶつ）から授けられた、金（きん）・緊（きん）・禁（きん）の三つの輪です。緊箍（きんこ）は先にお前にはめ、禁箍（きんこ）では守山大神（しゅざんだいしん）を従えました。この金箍（きんこ）だけは惜しんで、まだ誰にも与えずにいたのですが、今、この妖怪の無礼を見たからには、与えることにしましょう」
      観音菩薩は輪を風に向かって揺らし、観音菩薩「変われ！」と叫んだ。たちまち輪は五つになった。それを紅孩児の体へ投げ、観音菩薩「はまれ！」と一喝する。一つは頭に、二つは左右の手に、残る二つは左右の足にはまった。
      観音菩薩「悟空、少し離れなさい。金箍の呪文を唱えます」
      悟空は慌てた。
      悟空「菩薩さま！　妖怪を退治していただこうとお連れしたのに、どうして私に呪文をかけるのです！」
      観音菩薩「この呪文は、お前にかける緊箍の呪文ではありません。あの童子にかける金箍の呪文です」
      悟空はようやく安心し、すぐそばに付き従って、呪文を聞いていた。観音菩薩は指で印を結び、静かに何度か唱えた。紅孩児は耳をこすり、頬をもみ、足を縮めて転げ回った。まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch42-036"
    "section_id": "chapter-42"
    "kind": "verse"
    "origin": "source"
    "source_text": "一句能通遍沙界，廣大無邊法力深。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 174
        "line_end": 174
    "translation_ja": "一句は砂の数ほどの世界の隅々に通じ、その法力は広大無辺、底知れず深い。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-037"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知那童子怎的皈依，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 176
        "line_end": 176
    "translation_ja": "さて、この童子がどのように帰依することになるのか。それは次の回のお話。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-01-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三辛逢初六」は、直前に毎月四日と説明されることから、十干の辛に当たる三日と月の六日として訳した。実際の暦に照らした日数の計算や、宗派ごとの斎戒制度までは断定していない。「酉不會客」も、悟空が口実に持ち出す禁忌として保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-02-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の人名は「張道齡」。一般に見かける別字へ無断で置き換えず、原字を保持した。「祖庭」は道教の祖師としての位置づけと解した。また「三停」は顔を三つに分けた釣り合いをいう語として訳した。占いの話は、紅孩児が偽の父を試すために語る内容である。 教育部『重編國語辭典修訂本』の「三停」は身体全体と顔面の両方の三区分を挙げる。ここでは直前の「五官周正」に続くため顔面と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-03-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「幫泥」は底本の字をそのまま残した。『拾遺記』巻二「夏禹」には、禹の治水の際に玄亀が青泥を背負って助ける伝承があり、この呼称との関連が考えられる。ただし同書の当該箇所に「幫泥」の語そのものはなく、直接の語源と断定はしない。「文王畫卦曾元卜」以下は易の卦と占いの伝承を重ねる描写として訳し、歴史上の事実を保証するものとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-04-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この底本は、観音菩薩に仕える竜女を「善財龍女」、続いて「我這龍女」「我這善財」と呼ぶ。訳では同じ竜女への呼び名として保ち、別の侍者を補って二人に分けない。悟空の「一毛も抜かない」と、観音が「善財を捨てがたい」と応じる箇所は、けちを表す言い回しと名を掛けた軽口でもある。 冒頭の「養家」は、家の生計を支える意味に取り、瓶番を家を支える仕事に見立てた軽口と訳した。家で飼われるという受け身にはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-05-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「走了硝」は、皮を処理するための硝が水で抜けることとして訳した。皮が濡れると寒い時に着られなくなる、という悟空の懸念であり、現代の皮革加工法を説明する文ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-06-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「滿海長金連」は「金連」の字を保持し、周囲の蓮の描写から「海一面に金色の蓮が育つ」と解した。「連」を「蓮」へ原文欄で補訂してはいない。「定身禪」は原語を残した。通常の定身法と同じ作用かどうかは断定せず、海と仙境を現す降魔の法の一部として訳している。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-07-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は同じ恵岸行者の武器を、命令では「降妖杵」、続く動作では「降魔杵」と記す。訳でも両表記を保ち、同じ武器の別表記として扱った。「千百餘下」は非常に多数の打撃をいう表現と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-08-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「太山壓頂」「三個頂搭」「三個窩角揪兒」は、頭を剃り分け、毛を三か所に残して小さな髷に結う描写として訳した。髪形の細部や名称の由来までは確定できず、太山を泰山へ無断訂正していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-note-09-body"
    "section_id": "chapter-42"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この底本では観音菩薩が「緊箍兒先與你戴了；禁箍兒收了守山大神；這個金箍兒未曾捨得與人」と説明する。前の回の輪の呼称との整合のために入れ替えず、この回の金・緊・禁の区別をそのまま保った。"
    "translation_status": "reviewed"

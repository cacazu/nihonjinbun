  "known_gaps":
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-009"
      "description_ja": "「三辛逢初六」は、直前に毎月四日と説明されることから、十干の辛に当たる三日と月の六日として訳した。実際の暦に照らした日数の計算や、宗派ごとの斎戒制度までは断定していない。「酉不會客」も、悟空が口実に持ち出す禁忌として保った。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-011"
      "description_ja": "底本の人名は「張道齡」。一般に見かける別字へ無断で置き換えず、原字を保持した。「祖庭」は道教の祖師としての位置づけと解した。また「三停」は顔を三つに分けた釣り合いをいう語として訳した。占いの話は、紅孩児が偽の父を試すために語る内容である。 教育部『重編國語辭典修訂本』の「三停」は身体全体と顔面の両方の三区分を挙げる。ここでは直前の「五官周正」に続くため顔面と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-017"
      "description_ja": "「幫泥」は底本の字をそのまま残した。『拾遺記』巻二「夏禹」には、禹の治水の際に玄亀が青泥を背負って助ける伝承があり、この呼称との関連が考えられる。ただし同書の当該箇所に「幫泥」の語そのものはなく、直接の語源と断定はしない。「文王畫卦曾元卜」以下は易の卦と占いの伝承を重ねる描写として訳し、歴史上の事実を保証するものとはしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-019"
      "description_ja": "この底本は、観音菩薩に仕える竜女を「善財龍女」、続いて「我這龍女」「我這善財」と呼ぶ。訳では同じ竜女への呼び名として保ち、別の侍者を補って二人に分けない。悟空の「一毛も抜かない」と、観音が「善財を捨てがたい」と応じる箇所は、けちを表す言い回しと名を掛けた軽口でもある。 冒頭の「養家」は、家の生計を支える意味に取り、瓶番を家を支える仕事に見立てた軽口と訳した。家で飼われるという受け身にはしていない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-021"
      "description_ja": "「走了硝」は、皮を処理するための硝が水で抜けることとして訳した。皮が濡れると寒い時に着られなくなる、という悟空の懸念であり、現代の皮革加工法を説明する文ではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-026"
      "description_ja": "底本の「滿海長金連」は「金連」の字を保持し、周囲の蓮の描写から「海一面に金色の蓮が育つ」と解した。「連」を「蓮」へ原文欄で補訂してはいない。「定身禪」は原語を残した。通常の定身法と同じ作用かどうかは断定せず、海と仙境を現す降魔の法の一部として訳している。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-032"
      "description_ja": "底本は同じ恵岸行者の武器を、命令では「降妖杵」、続く動作では「降魔杵」と記す。訳でも両表記を保ち、同じ武器の別表記として扱った。「千百餘下」は非常に多数の打撃をいう表現と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-033"
      "description_ja": "底本の「太山壓頂」「三個頂搭」「三個窩角揪兒」は、頭を剃り分け、毛を三か所に残して小さな髷に結う描写として訳した。髪形の細部や名称の由来までは確定できず、太山を泰山へ無断訂正していない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch42-1808580"
      "segment_ids":
        - "xy-ch42-035"
      "description_ja": "この底本では観音菩薩が「緊箍兒先與你戴了；禁箍兒收了守山大神；這個金箍兒未曾捨得與人」と説明する。前の回の輪の呼称との整合のために入れ替えず、この回の金・緊・禁の区別をそのまま保った。 本文の欠落ではなく解釈・校訂上の留保。"

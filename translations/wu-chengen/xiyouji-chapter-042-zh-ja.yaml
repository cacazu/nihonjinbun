    "source_text": "他將楊柳枝往下指定，叫一聲：「退！」只見那蓮臺花彩俱無，祥光盡散，原來那妖王坐在刀尖之上。即命木叉：「使降妖杵，把刀柄兒打打去來。」那木叉按下雲頭，將降魔杵如築牆一般，築了有千百餘下。那妖精穿通兩腿刀尖出，血注成汪皮肉開。好怪物，你看他咬著牙，忍著痛，且丟了長槍，用手將刀亂拔。行者卻道：「菩薩啊，那怪物不怕痛，還拔刀哩。」菩薩見了，喚上木叉：「且莫傷他生命。」卻又把楊柳枝垂下，念聲「唵」字咒語，那天罡刀都變做倒鬚鉤兒，狼牙一般，莫能褪得。那妖精卻才慌了，扳著刀尖，痛聲苦告道：「菩薩，我弟子有眼無珠，不識你廣大法力。千乞垂慈，饒我性命，再不敢恃惡，願入法門戒行也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      観音菩薩は楊柳の枝を下へ向け、観音菩薩「解け！」と一声叫んだ。すると蓮台の花の彩りは消え、瑞光もすっかり散った。紅孩児が座っていたのは、刀の切っ先の上だったのだ。
      観音菩薩「恵岸行者、降妖杵（ごうようしょ）で、刀の柄をたたいてきなさい」
      恵岸行者は雲を降ろし、降魔杵（ごうましょ）で壁を突き固めるように、刀の柄を何百、何千回と打ちつけた。刀の先は紅孩児の両脚を貫いて突き出し、肉と皮が裂け、流れる血がたまった。
      それでも、ただの怪物ではない。歯を食いしばって痛みに耐え、長槍を捨てると、手で刀を手当たり次第に引き抜こうとした。
      悟空「菩薩さま、あの怪物は痛みを恐れず、まだ刀を抜こうとしていますよ」
      観音菩薩はそれを見て、恵岸行者を呼び戻した。
      観音菩薩「ひとまず命は傷つけないように」
      そして、また楊柳の枝を垂らし、「唵」と一声、呪を唱えた。天罡刀はすべて狼の牙のような返しのある鉤に変わり、抜くことができなくなった。紅孩児はようやく慌て、刀の先につかまり、痛みに叫びながら必死に訴えた。
      紅孩児「菩薩さま、私は目がありながら見えておらず、あなたさまの偉大な法力を存じませんでした。どうか慈悲をお垂れになり、命をお助けください。二度と悪事を頼みにはいたしません。仏門に入り、戒めを守ります！」
    "translation_status": "reviewed"
  - "id": "xy-ch42-033"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "菩薩聞言，卻與二行者、白鸚哥低下金光，到了妖精面前，問道：「你可受吾戒行麼？」妖王點頭滴淚道：「若饒性命，願受戒行。」菩薩道：「你可入我門麼？」妖王道：「果饒性命，願入法門。」菩薩道：「既如此，我與你摩頂受戒。」就袖中取出一把金剃頭刀兒，近前去，把那怪分頂剃了幾刀，剃作一個太山壓頂，與他留下三個頂搭，挽起三個窩角揪兒。行者在傍笑道：「這妖精大晦氣，弄得不男不女，不知像個甚麼東西。」菩薩道：「你今既受我戒，我卻也不慢你，稱你做善財童子，如何？」那妖點頭受持，只望饒命。菩薩卻用手一指，叫聲：「退！」撞的一聲，天罡刀都脫落塵埃，那童子身軀不損。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      観音菩薩はその言葉を聞くと、悟空、恵岸行者、白い鸚哥とともに金色の光を降ろし、紅孩児の前へ来て尋ねた。
      観音菩薩「私の戒めを受けるのですか」
      紅孩児はうなずき、涙をこぼした。
      紅孩児「命をお助けくださるなら、戒めを受けます」
      観音菩薩「私の門に入るのですか」
      紅孩児「本当に命をお助けくださるなら、仏門に入ります」
      観音菩薩「それなら、頭に手を当てて戒めを授けましょう」
      袖から金の剃刀を一本取り出して近寄り、紅孩児の頭の上を分けるように何筋か剃った。太山圧頂（たいざんあっちょう）という髪形にし、頭に三か所の毛を残して、三つの小さな髷に結い上げた。悟空は傍らで笑った。
      悟空「この妖怪、ひどい目に遭ったな。男とも女ともつかなくなって、いったい何に似ているやら」
      観音菩薩「今、私の戒めを受けたのですから、お前を軽く扱いはしません。善財童子（ぜんざいどうじ）と呼ぶことにしましょう。どうです」
      紅孩児はうなずいて受け入れ、ただ命が助かることを願った。観音菩薩は手で指し、観音菩薩「外れよ！」と叫んだ。がちゃんと音を立て、天罡刀はすべて地面へ抜け落ちた。童子となった紅孩児の体には、傷一つなかった。
    "translation_status": "reviewed"

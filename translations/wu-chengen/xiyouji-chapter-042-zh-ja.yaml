    "translation_status": "reviewed"
  - "id": "xy-ch42-002"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說那六健將出洞門，徑往西南上，依路而走。行者心中暗想道：「他要請老大王吃我師父，老大王斷是牛魔王。自老孫當年與他相會，真個意合情投，交遊甚厚。至如今我歸正道，他還是邪魔。雖則久別，還記得他模樣。且等老孫變作牛魔王，哄他一哄，看是何如。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 119
        "line_end": 119
    "translation_ja": |-
      さて、六健将（ろっけんしょう）は洞穴の門を出ると、まっすぐ南西へ、道なりに進んでいった。悟空（ごくう）は心の中で考えた。
      悟空「お師匠さまを食わせるために老大王を招くというのなら、その老大王は牛魔王（ぎゅうまおう）に違いない。昔、俺があいつと出会ったころは、本当に気が合って、深く付き合ったものだ。今では俺は正しい道に戻ったが、あいつはまだ邪悪な魔物のまま。長いこと会っていなくても、顔かたちは覚えている。よし、俺が牛魔王に化けて、一つだましてみよう。どうなることやら」
    "translation_status": "reviewed"
  - "id": "xy-ch42-003"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，躲離了六個小妖，展開翅，飛向前邊，離小妖有十數里遠近，搖身一變，變作個牛魔王；拔下幾根毫毛，叫：「變！」即變作幾個小妖。在那山凹裡，駕鷹牽犬，搭弩張弓，充作打圍的樣子，等候那六健將。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 120
        "line_end": 120
    "translation_ja": "悟空は六匹の小妖怪に気づかれないよう離れると、翼を広げて先へ飛んだ。十数里（り）ほど先で身を揺すり、牛魔王の姿になる。さらに体の毛を何本か抜き、悟空「変われ！」と叫ぶと、毛は何匹かの小妖怪になった。山あいで鷹を腕に据え、犬を引かせ、弩に矢をつがえ、弓を張って、狩りをしているように装い、六健将を待ち受けた。"
    "translation_status": "reviewed"
  - "id": "xy-ch42-004"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那一夥廝拖廝扯正行時，忽然看見牛魔王坐在中間，慌得興烘掀、掀烘興撲的跪下道：「老大王爺爺在這裡也。」那雲裡霧、霧裡雲、急如火、快如風都是肉眼凡胎，那裡認得真假，也就一同跪倒，磕頭道：「爺爺，小的們是火雲洞聖嬰大王處差來，請老大王爺爺去吃唐僧肉，壽延千紀哩。」行者借口答道：「孩兒們起來，同我回家去，換了衣服來也。」小妖叩頭道：「望爺爺方便，不消回府罷。路程遙遠，恐我大王見責，小的們就此請行。」行者笑道：「好乖兒女。也罷，也罷，向前開路，我和你去來。」六怪抖擻精神，向前喝路。大聖隨後而來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      六匹が互いに引っ張り合いながら歩いていると、ふいに牛魔王が真ん中に座っているのを見つけた。興烘掀（こうこうけん）と掀烘興（けんこうこう）は驚き、その場にひざまずいた。
      興烘掀と掀烘興「大殿さま、こちらにおいででしたか！」
      雲裡霧（うんりむ）、霧裡雲（むりうん）、急如火（きゅうじょか）、快如風（かいじょふう）も、ただの肉眼しか持たない身で、偽物を見分けられるはずもない。そろってひざまずき、頭を地につけた。
      雲裡霧ら四匹「大殿さま、私どもは火雲洞（かうんどう）の聖嬰大王（せいえいだいおう）のお使いで参りました。唐僧（とうそう）の肉を召し上がり、千紀（き）もの寿命をお延ばしいただきたく、お招きに上がったのでございます」
      悟空は相手に調子を合わせて答えた。
      悟空「お前たち、立ちなさい。わしと家へ戻って、着替えてから出かけよう」
      小妖怪たちは頭を下げた。
      小妖怪たち「大殿さま、どうかお取り計らいを。お屋敷へお戻りになるのはおやめください。道が遠く、大王にお叱りを受けはしないかと心配でございます。このままお越しいただけませんか」
      悟空は笑った。
      悟空「よく気のつく子らだ。よかろう、よかろう。先に立って道を開け。わしも一緒に行こう」
      六匹は張り切って先へ立ち、大声で道を開けさせた。悟空はその後についていった。
    "translation_status": "reviewed"
  - "id": "xy-ch42-005"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時，早到了本處。快如風、急如火撞進洞裡：「報大王：老大王爺爺來了。」妖王歡喜道：「你們卻中用，這等來的快。」即便叫各路頭目擺隊伍，開旗鼓，迎接老大王爺爺。滿洞群妖遵依旨令，齊齊整整，擺將出去。這行者昂昂烈烈，挺著胸脯，把身子抖了一抖，卻將那架鷹犬的毫毛都收回身上。拽開大步，徑走入門裡，坐在南面當中。紅孩兒當面跪下，朝上叩頭道：「父王，孩兒拜揖。」行者道：「孩兒免禮。」那妖王四大拜，拜畢，立於下手。行者道：「我兒，請我來有何事？」妖王躬身道：「孩兒不才，昨日獲得一人，乃東土大唐和尚。常聽得人講，他是一個十世修行之人，有人吃他一塊肉，壽似蓬瀛不老仙。愚男不敢自食，特請父王同享唐僧之肉，壽延千紀。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      ほどなく、一行は洞穴に着いた。快如風と急如火が中へ駆け込んだ。
      快如風と急如火「大王に申し上げます。大殿さまがお着きになりました！」
      紅孩児（こうがいじ）は喜んだ。
      紅孩児「お前たちは役に立つな。こんなに早くお連れするとは」
      すぐに各組の頭目へ、隊列を整え、旗と太鼓を出して大殿さまを迎えるよう命じた。洞穴中の妖怪が命令に従い、きちんと列をそろえて外へ並ぶ。悟空は胸を張って威風堂々と身を揺すり、鷹や犬を扱わせていた化身の毛を、すべて体へ戻した。大股で門を入り、中央の南向きの席に座った。
      紅孩児はその前にひざまずき、上座へ頭を下げた。
      紅孩児「父上、息子がご挨拶申し上げます」
      悟空「息子よ、礼はよい」
      紅孩児は四度深々と拝礼し、終えると下座に立った。
      悟空「息子よ、わしを呼んだのは何の用だ」
      紅孩児は身をかがめた。
      紅孩児「不肖の息子ながら、昨日、東土（とうど）の大唐（だいとう）から来た和尚を一人捕らえました。あの者は十度の生にわたって修行を積んだ者で、その肉を一切れ食べれば、蓬瀛（ほうえい）の不老の仙人のように長生きできると、かねて聞いております。私一人で食べるわけにはまいりません。ぜひ父上にも唐僧の肉を味わっていただき、千紀もの寿命をお延ばしいただこうと、お招きしたのでございます」
    "translation_status": "reviewed"
  - "id": "xy-ch42-006"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，打了個失驚道：「我兒，是那個唐僧？」妖王道：「是往西天取經的人也。」行者道：「我兒，可是孫行者師父麼？」妖王道：「正是。」行者擺手搖頭道：「莫惹他，莫惹他。別的還好惹，孫行者是那樣人哩。我賢郎你不曾會他，那猴子神通廣大，變化多端。他曾大鬧天宮，玉皇上帝差十萬天兵，佈下天羅地網，也不曾捉得他。你怎麼敢吃他師父？快早送出去還他，不要惹那猴子。他若打聽著你吃了他師父，他也不來和你打，他只把那金箍棒往山腰裡搠個窟窿，連山都掬了去。我兒，弄得你何處安身？教我倚靠何人養老？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      悟空はそれを聞くと、驚いたふりをした。
      悟空「息子よ、それはどの唐僧だ」
      紅孩児「西天（さいてん）へ経典を取りに行く者です」
      悟空「孫行者（そんぎょうじゃ）の師匠ではないのか」
      紅孩児「そのとおりです」
      悟空は手を振り、首を横に振った。
      悟空「手を出すな、手を出すな。ほかの者ならまだしも、孫行者がどんな奴か知らぬのか。息子よ、お前はあいつと出会ったことがないのだな。あの猿は神通力が強大で、変化の術も自由自在。かつて天宮（てんきゅう）で大暴れし、玉皇上帝（ぎょくこうじょうてい）が十万の天兵に命じて、天にも地にも逃げ場のない網を張らせても、捕まらなかったのだぞ。よくも師匠を食おうなどと思ったものだ。早く外へ送り出し、あいつに返してやれ。あの猿を怒らせるな。お前が師匠を食ったと知れば、戦いに来るまでもなく、金箍棒（きんこぼう）で山の中腹に穴をあけ、山ごと持ち去ってしまう。息子よ、そうなったらお前はどこに住む。わしは誰を頼って老後を送ればよいのだ」
    "translation_status": "reviewed"
  - "id": "xy-ch42-007"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖王道：「父王說那裡話，長他人志氣，滅孩兒的威風。那孫行者共有兄弟三人，領唐僧在我半山之中，被我使個變化，將他師父攝來。他與那豬八戒當時尋到我的門前，講甚麼攀親託熟之言，被我怒發沖天，與他交戰幾合，也只如此，不見甚麼高作。那豬八戒刺邪裡就來助戰，是孩兒吐出三昧真火，把他燒敗了一陣。慌得他去請四海龍王助雨，又不能滅得我三昧真火，被我燒了一個小發昏，連忙著豬八戒去請南海觀音菩薩。是我假變觀音，把豬八戒賺來，見吊在如意袋中，也要蒸他與眾小的們吃哩。那行者今早又來我的門首吆喝，我傳令教拿他，慌得他把包袱都丟下走了。卻才去請父王來看看唐僧活像，方可蒸與你吃，延壽長生不老也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 125
        "line_end": 125
    "translation_ja": "紅孩児「父上、何をおっしゃいます。他人の威勢をあおって、息子の面目をつぶすのですか。孫行者は合わせて三人の兄弟弟子で唐僧を連れ、私の山の中腹までやって来ました。そこで私が変化の術を使い、師匠をさらったのです。奴は猪八戒（ちょはっかい）と一緒にすぐ門前へ来て、親戚だの昔なじみだのと持ち出しました。私はかっとなって、何合か戦ってやりましたが、せいぜいあの程度で、大した腕など見せませんでした。猪八戒が横合いから加勢に入って来たので、私が三昧真火（さんまいしんか）を吐くと、二人とも焼かれて逃げました。慌てた奴は四海の竜王を呼び、雨を降らせて加勢させましたが、それでも私の三昧真火は消せません。火にやられて少しばかり気を失い、大急ぎで猪八戒を南海（なんかい）の観音菩薩（かんのんぼさつ）のもとへ遣わしました。そこで私が観音（かんのん）に化け、猪八戒をだまして連れ帰ったのです。今は如意袋（にょいたい）の中につるしてあります。あいつも蒸して、子分たちに食わせてやるつもりです。孫行者は今朝も門前でわめいていましたが、私が捕まえろと命じると、慌てて包みまで捨てて逃げました。そこで父上をお招きし、まず唐僧の生きた姿をご覧いただいてから、蒸して召し上がっていただこうと思ったのです。それで寿命を延ばし、不老長生していただけます」"
    "translation_status": "reviewed"
  - "id": "xy-ch42-008"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者笑道：「我賢郎啊，你只知有三昧火贏得他，不知他有七十二般變化哩。」妖王道：「憑他怎麼變化，我也認得，諒他決不敢進我門來。」行者道：「我兒，你雖然認得他，他卻不變大的，如狼犺大象，恐進不得你門；他若變作小的，你卻難認。」妖王道：「憑他變甚小的，我這裡每一層門上有四五個小妖把守，他怎生得入？」行者道：「你是不知。他會變蒼蠅、蚊子、虼蚤，或是蜜蜂、蝴蝶並蟭蟟蟲等項，又會變我模樣，你卻那裡認得？」妖王道：「勿慮，他就是鐵膽銅心，也不敢近我門來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      悟空は笑った。
      悟空「息子よ、三昧の火（さんまいのひ）であいつに勝てるとばかり思って、七十二通りの変化をすることを知らぬのだな」
      紅孩児「どんな姿に変わろうと、私には見抜けます。決してこの門を入っては来られません」
      悟空「息子よ、お前が見抜けるといっても、あいつは巨大な象のような大きなものには化けまい。門を入れぬからな。小さなものに化けられたら、見つけるのは難しいぞ」
      紅孩児「どんなに小さなものに化けようと、こちらは門ごとに小妖怪を四、五匹ずつ置いて守らせています。どうして入れましょう」
      悟空「お前は知らぬのだ。あいつは蠅、蚊、蚤にも、蜂、蝶、蟭蟟虫（しょうりょうちゅう）などにも化けられる。それに、わしの姿にだって化けられるのだ。どうやって見分ける」
      紅孩児「ご心配には及びません。鉄の胆力、銅の心臓を持っていようと、この門には近づけませんよ」
    "translation_status": "reviewed"
  - "id": "xy-ch42-009"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「既如此說，賢郎甚有手段，實是敵得他過，方來請我吃唐僧的肉，奈何我今日還不吃哩。」妖王道：「如何不吃？」行者道：「我近來年老，你母親常勸我作些善事。我想無甚作善，且持些齋戒。」妖王道：「不知父王是長齋，是月齋？」行者道：「也不是長齋，也不是月齋，喚做雷齋，每月只該四日。」妖王問：「是那四日？」行者道：「三辛逢初六。今朝是辛酉日，一則當齋，二來酉不會客。且等明日，我去親自刷洗蒸他，與兒等同享罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      悟空「それほどのことを言うなら、息子よ、なかなか腕が立つと見える。本当にあいつに勝てるからこそ、わしを唐僧の肉を食うよう招いたのだな。だが、あいにく今日は食わぬことにしておる」
      紅孩児「どうして召し上がらないのです」
      悟空「近ごろ年を取って、お前の母親がしきりに善行を積めと勧めるのだ。これといってできる善行もないので、まず斎戒を守ることにした」
      紅孩児「父上がなさるのは、ずっと精進を続ける長斎（ちょうさい）ですか。それとも月斎（げっさい）ですか」
      悟空「長斎でも月斎でもない。雷斎（らいさい）というもので、ひと月に四日だけ守ればよい」
      紅孩児「その四日とは、いつですか」
      悟空「辛のつく三日と、六日だ。今日は辛酉（しんゆう）の日。一つには斎の日だし、もう一つには酉の日には客と会わぬという。明日まで待ちなさい。わしが自分で洗い清めて蒸し、お前たちと一緒に食べよう」
    "translation_status": "reviewed"
  - "id": "xy-ch42-010"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖王聞言，心中暗想道：「我父王平日吃人為生，今活夠有一千餘歲，怎麼如今又吃起齋來了？想當初作惡多端，這三四日齋戒，那裡就積得過來？此言有假，可疑，可疑。」即抽身走出二門之下，叫六健將來問：「你們老大王是那裡請來的？」小妖道：「是半路請來的。」妖王道：「我說你們來的快。不曾到家麼？」小妖道：「是，不曾到家。」妖王道：「不好了，著了他假也，這不是老大王。」小妖一齊跪下道：「大王，自家父親也認不得？」妖王道：「觀其形容動靜都像，只是言語不像。只怕著了他假，吃了人虧。你們都要仔細：會使刀的刀要出鞘，會使槍的槍要磨明；會使棍的使棍，會使繩的使繩。待我再去問他，看他言語如何。若果是老大王，莫說今日不吃，明日不吃，便遲個月何妨？假若言語不對，只聽我哏的一聲，就一齊下手。」群魔各各領命訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      紅孩児はそれを聞き、心の中で考えた。
      紅孩児「父上はいつも人を食って生きてきた。もう千余年も生きているのに、どうして今さら精進など始めたのだ。これまで散々悪事を働いたのに、たった三、四日斎戒をしたぐらいで、どうして埋め合わせられる。この話は嘘だ。怪しい、怪しいぞ」
      身を引いて二の門まで出ると、六健将を呼んで尋ねた。
      紅孩児「お前たち、老大王をどこから連れてきた」
      小妖怪たち「道の途中でお招きいたしました」
      紅孩児「やけに早かったわけだ。家には行かなかったのか」
      小妖怪たち「はい、お屋敷へは参りませんでした」
      紅孩児「いかん。偽物に引っかかった。あれは老大王ではない」
      小妖怪たちは一斉にひざまずいた。
      六健将「大王は、ご自分のお父上も見分けられないのですか」
      紅孩児「顔かたちも立ち居振る舞いもそっくりだが、話すことだけが違う。偽物にだまされて、損をさせられているのかもしれん。みんな用心しろ。刀を使う者は鞘から抜き、槍を使う者は磨き上げろ。棍棒の者は棍棒を、縄の者は縄を用意するのだ。俺がもう一度話を聞き、何と答えるか見てくる。本物の老大王なら、今日食わず、明日食わなくてもかまわん。ひと月遅れたところで何の支障がある。だが、言うことがおかしかったら、俺の一喝を合図に、一斉にかかれ」
      妖怪たちは、それぞれ命令を承った。
    "translation_status": "reviewed"
  - "id": "xy-ch42-011"
    "section_id": "chapter-42"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這妖王復轉身到於裡面，對行者當面又拜。行者道：「孩兒，家無常禮，不須拜。但有甚話，只管說來。」妖王伏於地下道：「愚男一則請來奉獻唐僧之肉，二來有句話兒上請：我前日閑行，駕祥光，直至九霄空內，忽逢著祖庭道齡張先生。」行者道：「可是做天師的張道齡麼？」妖王道：「正是。」行者問曰：「有甚話說？」妖王道：「他見孩兒生得五官周正，三停平等，他問我是幾年那月那日那時出世。兒因年幼，記得不真。先生子平精熟，要與我推看五星。今請父王，正欲問此。倘或下次再得會他，好煩他推算。」行者聞言，坐在上面暗笑道：「好妖怪呀！老孫自歸佛果，保唐師父，一路上也捉了幾個妖精，不似這廝剋剝。他問我甚麼家長禮短、少米無柴的話說，我也好信口捏膿答他。他如今問我生年月日，我卻怎麼知道？」好猴王，也十分乖巧：巍巍端坐中間，也無一些兒懼色，面上反喜盈盈的笑道：「賢郎請起。我因年老，連日有事不遂心懷，把你生時果偶然忘了，且等到明日回家，問你母親便知。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch42-1808580"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第042回&oldid=1808580"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      紅孩児は中へ戻り、悟空の前でまた拝礼した。
      悟空「息子よ、家の中でいちいち礼儀を立てることはない。拝まなくてよい。話があるなら、何でも言いなさい」
      紅孩児は地に伏した。
      紅孩児「父上をお呼びしたのは、一つには唐僧の肉をお差し上げるため、もう一つには、お尋ねしたいことがあったからです。先日、私は気晴らしに瑞光に乗り、九重の空の高みまで行きました。すると、道教の祖師である張道齡（ちょうどうれい）先生に、偶然お会いしたのです」
      悟空「天師（てんし）を務める張道齡のことか」
      紅孩児「そのとおりです」
      悟空「何を話したのだ」
      紅孩児「先生は、私の顔立ちが整い、顔の三つの部分も釣り合っているのをご覧になり、何年何月何日何時に生まれたのかとお尋ねでした。私は幼かったので、はっきり覚えておりません。先生は子平（しへい）の術に精通しておられ、五星（ごせい）によって私の運命を占ってくださるというのです。今日、父上をお招きしたのは、それを伺いたかったからでもあります。今度またお会いできたら、占っていただきたいと思いまして」
      悟空は上座に座ったまま、心の中で苦笑した。
      悟空「大した妖怪だ！　俺は仏の道に帰依して唐のお師匠さまを守るようになってから、旅の途中で何匹か妖怪を捕まえてきたが、こんなに手ごわい奴はいなかった。よその家がどうだとか、米や薪が足りないとかいう世間話なら、口から出任せで答えられる。それが生まれた年月日を聞いてくるとは、俺に分かるものか」
      それでも、さすがは抜け目のない悟空だ。堂々と中央に座り、少しも恐れた様子を見せず、かえって顔いっぱいに笑みを浮かべた。
      悟空「息子よ、立ちなさい。わしも年を取り、ここ数日、思いどおりにならぬことが重なってな。お前が生まれた時のことを、たまたま忘れてしまった。明日、家へ帰って母親に尋ねれば分かる」
    "translation_status": "reviewed"
  - "id": "xy-ch42-012"
    "section_id": "chapter-42"
    "kind": "paragraph"

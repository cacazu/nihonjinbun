    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    二人が進んでいくと、三蔵が馬上から尋ねた。
    三蔵「悟空（ごくう）、さっき虎を打った鉄棒が、どうして見えなくなったのだ。」
    行者は笑った。
    行者「お師匠さまはご存じないのです。この棒は、もともと東の大海の竜宮（りゅうぐう）で手に入れたもので、天河鎮底神珍鉄（てんがちんていしんちんてつ）といい、また如意金箍棒（にょいきんこぼう）ともいいます。あの年、天宮に大いに反逆したときは、これにずいぶん助けられました。私の思いどおりに変化し、大きくしたければ大きく、小さくしたければ小さくなります。たった今、刺繍針の形に変え、耳の中へしまいました。使うときだけ取り出すのです。」
    三蔵は聞いてひそかに喜び、また尋ねた。
    三蔵「さっきの虎は、お前を見るとどうして動けなくなり、打たれるままにしていたのだろう。」
    行者「お師匠さまに隠しはいたしません。虎どころか、竜でも私を見れば無礼はできません。この私には、竜を降し虎を伏せる手腕があり、川をひっくり返し海をかき回す神通（じんずう）があります。姿や顔色を見分け、声を聞いて事情を察し、大きくなれば宇宙に等しく、小さくなれば一本の毛に収まる。変化は尽きず、隠れたり現れたり、誰にも見抜けません。虎の皮を剥ぐくらい、何の珍しいことがありましょう。いよいよ困難に出会ったときに、本領をお目にかけますよ。」
    三蔵はこれを聞いて、ますます心が晴れ、不安もなくなり、馬に鞭を当てて進んだ。
  "translation_status": "reviewed"
- "id": "xy-ch14-013"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒兩個走著路，說著話，不覺得太陽西墜。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 147
    "line_end": 147
  "translation_ja": "師弟は歩きながら話をしているうち、いつしか太陽が西へ傾いた。見れば、こんなありさまである。"
  "translation_status": "reviewed"
- "id": "xy-ch14-014"
  "section_id": "chapter-14"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    燄燄斜暉返照，天涯海角歸雲。千山鳥雀噪聲頻，覓宿投林成陣。
    野獸雙雙對對，回窩族族群群。一鉤新月破黃昏。萬點明星光暈。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 149
    "line_end": 150
  "translation_ja": |-
    燃え立つような夕日が照り返し、天の果て、海の果てへ雲は帰る。
    幾重もの山では鳥がしきりに鳴き、ねぐらを求めて群れをなして林へ入る。
    野の獣は二頭ずつ、対をなし、また群れごとに巣へ戻る。
    釣り針のような新月が黄昏を破り、幾万もの明るい星が光をにじませる。
  "translation_status": "reviewed"
- "id": "xy-ch14-015"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「師父走動些，天色晚了。那壁廂樹木森森，想必是人家莊院，我們趕早投宿去來。」三藏果策馬而行，徑奔人家，到了莊院前下馬。行者撇了行李，走上前，叫聲：「開門！開門！」那裡面有一老者扶筇而出，唿喇的開了門。看見行者這般惡相，腰繫著一塊虎皮，好似個雷公模樣，諕得腳軟身麻，口出譫語道：「鬼來了！鬼來了！」三藏近前攙住，叫道：「老施主休怕。他是我貧僧的徒弟，不是鬼怪。」老者擡頭，見了三藏的面貌清奇，方才立定，問道：「你是那寺裡來的和尚，帶這惡人上我門來？」三藏道：「我貧僧是唐朝來的，往西天拜佛求經。適路過此間，天晚，特造檀府借宿一宵，明早不犯天光就行。萬望方便一二。」老者道：「你雖是個唐人，那個惡的卻非唐人。」悟空厲聲高呼道：「你這個老兒全沒眼色！唐人是我師父，我是他徒弟。我也不是甚糖人，蜜人，我是齊天大聖！你們這裡人家，也有認得我的。我也曾見你來。」那老者道：「你在那裡見我？」悟空道：「你小時不曾在我面前扒柴？不曾在我臉上挑菜？」老者道：「這廝胡說！你在那裡住？我在那裡住？我來你面前扒柴、挑菜？」悟空道：「我兒子便胡說。你是認不得我了，我本是這兩界山石匣中的大聖，你再認認看。」老者方才省悟道：「你倒有些像他。但你是怎麼得出來的？」悟空將菩薩勸善，令他等待唐僧揭帖脫身之事，對那老者細說了一遍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    行者「お師匠さま、少し急ぎましょう。日が暮れます。あちらの木々が茂ったところは、きっと人家の屋敷です。早いうちに、泊めてもらいに行きましょう。」
    三蔵はそのとおり馬を進め、まっすぐ人家へ向かって、屋敷の前で馬を下りた。行者は荷物を放り出し、前へ進んで叫んだ。
    行者「開けてくれ、開けてくれ！」
    中から竹の杖をついた老人が出て、がらりと戸を開けた。行者の恐ろしい顔つき、腰に巻いた虎皮、まるで雷公（らいこう）のような姿を見ると、脚がなえ、体がしびれ、うわごとのように叫んだ。
    老人「化け物だ、化け物が来た！」
    三蔵は近寄って老人を支え、呼びかけた。
    三蔵「ご老人、怖がらないでください。これは私の弟子で、化け物ではありません。」
    老人は顔を上げ、三蔵の清らかで秀でた顔立ちを見て、ようやくしっかり立つと尋ねた。
    老人「あなたはどこの寺の僧で、こんな恐ろしい者をうちへ連れて来たのです。」
    三蔵「私は唐（とう）から参り、西天へ仏を拝み、経を求めに行く者です。ここを通りかかったところ、日が暮れましたので、わざわざお宅へ一夜の宿をお願いに来ました。明朝は夜も明けぬうちに出立いたします。どうか、少しばかりご便宜をお図りください。」
    老人「あなたは唐の人でも、あの恐ろしいのは唐の人ではありますまい。」
    行者は声を荒らげた。
    行者「この爺さんは、まるで見る目がない！　唐の人なのはお師匠さまで、俺はその弟子だ。俺は『唐人（とうじん）』だか『糖人（とうじん）』だか、砂糖や蜜の人形じゃない。斉天大聖だ！　このあたりには俺を知っている家だってあるし、あんたの顔も見たことがあるぞ。」
    老人「どこで私を見たというのだ。」
    行者「あんたは子どものころ、俺の前で柴をかき集めたり、俺の顔で菜を摘んだりしていなかったか。」
    老人「この男、でたらめを言うな！　お前はどこに住んでいた。私はどこに住んでいた。お前の前へ柴を拾い、菜を摘みに行っただと？」
    行者「でたらめを言う奴は、俺の息子だ。あんたは俺が分からなくなったんだな。俺はこの両界山の石の囲いの中にいた大聖だ。もう一度、よく見てみろ。」
    老人は、ようやく思い当たった。
    老人「なるほど、あの猿に少し似ている。だが、どうやって出られたのだ。」
    行者は、菩薩に善を勧められ、唐僧（とうそう）を待ち、札を剥がしてもらって脱出するよう命じられたいきさつを、老人に詳しく話した。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「唐人」と「糖人」は中国語で同音。訳は砂糖や蜜の人形という意味を明示し、語の掛け合いを保持した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「我兒子便胡說」は相手を自分の子扱いする罵りの含意を持つと解し、「でたらめを言う奴は、俺の息子だ」とした。主語の転換を伴う慣用的な言い回しであり、逐語的解釈には留保がある。"
- "id": "xy-ch14-016"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老者卻才下拜，將唐僧請到裡面，即喚老妻與兒女都來相見，具言前事，個個忻喜。又命看茶。茶罷，問悟空道：「大聖啊，你也有年紀了？」悟空道：「你今年幾歲了？」老者道：「我痴長一百三十歲了。」行者道：「還是我重子重孫哩。我那生身的年紀，我不記得是幾時；但只在這山腳下，已五百餘年了。」老者道：「是有，是有。我曾記得祖公公說，此山乃從天降下，就壓了一個神猴。只到如今，你才脫體。我那小時見你時，你頭上有草，臉上有泥，還不怕你；如今臉上無了泥，頭上無了草，卻像瘦了些，腰間又苫了一塊大虎皮，與鬼怪能差多少？」一家兒聽得這般話說，都呵呵大笑。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    老人はようやく頭を下げて拝み、三蔵を家の中へ招き入れた。老妻と子どもたちも呼んで対面させ、これまでのいきさつをすっかり話すと、一人残らず喜んだ。さらに茶を出させ、茶が済むと、行者に尋ねた。
    老人「大聖、あなたも、ずいぶんお年なのですか。」
    行者「あんたは今年、何歳だ。」
    老人「いたずらに年を重ねて、百三十歳になります。」
    行者「それでも俺の、何代も下の子や孫に当たるな。生まれてから何年かは、もういつだったか覚えていないが、この山のふもとにいただけでも五百余年だ。」
    老人「そうでしょう、そうでしょう。祖父が、この山は天から降ってきて、一匹の神猿を下に押し込めたのだと話していたのを覚えています。今になって、ようやく自由になったのですね。私が幼いころに見たときは、あなたの頭には草が生え、顔には泥がついていて、それでも怖くなかった。ところが今は顔の泥も頭の草もなくなり、少し痩せたようで、腰には大きな虎皮までまとっている。これでは化け物と、どれほど違いがありましょう。」
    一家はこの話を聞いて、みんな声を上げて笑った。
  "translation_status": "reviewed"
- "id": "xy-ch14-017"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這老兒頗賢，即令安排齋飯。飯後，悟空道：「你家姓甚？」老者道：「舍下姓陳。」三藏聞言，即下來起手道：「老施主與貧僧是華宗。」行者道：「師父，你是唐姓，怎的和他是華宗？」三藏道：「我俗家也姓陳，乃是唐朝海州弘農郡聚賢莊人氏。我的法名叫做陳玄奘。只因我大唐太宗皇帝賜我做御弟三藏，指唐為姓，故名唐僧也。」那老者見說同姓，又十分歡喜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    この老人はなかなか親切な人で、すぐに精進料理を用意させた。食事のあと、行者が尋ねた。
    行者「あんたの家の姓は、何というんだ。」
    老人「私どもは陳（ちん）と申します。」
    三蔵は聞くと、すぐに席を下り、手を合わせて礼をした。
    三蔵「ご老人と私は、同じ姓の者でございます。」
    行者「お師匠さまは唐という姓なのに、どうしてこの人と同じなのです。」
    三蔵「私も俗家の姓は陳で、唐の海州（かいしゅう）、弘農郡（こうのうぐん）の聚賢荘（しゅけんそう）に生まれたのだ。法名は陳玄奘という。ただ、わが大唐の太宗皇帝（たいそうこうてい）が私を御弟三蔵（ぎょていさんぞう）とし、唐を姓としてお与えくださったので、唐僧と呼ばれるのだよ。」
    陳老人（ちんろうじん）は同姓と聞いて、いっそう喜んだ。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は三蔵の出自を「海州弘農郡聚賢莊」とする。第九回の地名と異なるが、地理的な矛盾を独自に整合させず保持した。"
- "id": "xy-ch14-018"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「老陳，左右打攪你家，我有五百多年不洗澡了，你可去燒些湯來，與我師徒們洗浴洗浴，一發臨行謝你。」那老兒即令燒湯拿盆，掌上燈火。師徒浴罷，坐在燈前。行者道：「老陳，還有一事累你：有針線借我用用。」那老兒道：「有，有，有。」即教媽媽取針線來，遞與行者。行者又有眼色，見師父洗浴，脫下一件白布短小直裰未穿，他即扯過來披在身上。卻將那虎皮脫下，聯接一處。打一個馬面樣的摺子，圍在腰間，勒了籐條，走到師父面前道：「老孫今日這等打扮，比昨日如何？」三藏道：「好，好，好。這等樣，才像個行者。」三藏道：「徒弟，你不嫌殘舊，那件直裰兒，你就穿了罷。」悟空唱個喏道：「承賜，承賜。」他又去尋些草料喂了馬。此時各各事畢，師徒與那老兒亦各歸寢。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    行者「陳の爺さん、どうせお邪魔しているついでだ。俺は五百年以上、風呂に入っていない。湯を沸かして、師弟ともども入らせてもらえないか。出立のときに、まとめて礼を言うよ。」
    陳老人はさっそく湯を沸かし、たらいを持ってこさせ、明かりをともした。師弟は入浴を済ませ、灯火の前へ座った。
    行者「陳の爺さん、もう一つ頼みがある。針と糸があれば貸してくれ。」
    陳老人「あるとも、あるとも。」
    すぐに妻に針と糸を持ってこさせ、行者へ渡した。行者はまた目ざとく、師が入浴で脱いだ白布の丈の短い直裰（ちょくたつ）を、まだ着ていないのに気づいた。さっと引き寄せて羽織り、腰の虎皮を外してつなぎ合わせ、馬の顔の形をしたひだを折り、腰に巻いてつるで締めた。そして師の前へ来た。
    行者「私の今日の身なりは、昨日と比べていかがですか。」
    三蔵「よい、よい。それでこそ行者らしく見える。」
    三蔵「弟子よ、古びた物で嫌でなければ、その直裰はお前が着ていてよい。」
    行者は声を上げて礼をした。
    行者「ありがたく頂戴します。」
    それから飼葉を探して馬に食べさせた。こうしてそれぞれの用事を済ませると、師弟も陳老人も、それぞれ床に就いた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "虎皮の「馬面樣的摺子」は馬面のようなひだとして形の説明を残した。特定の現代的な服飾形式へ同定していない。"
- "id": "xy-ch14-019"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次早，悟空起來，請師父走路。三藏著衣，教行者收拾鋪蓋行李。正欲告辭，只見那老兒早具臉湯，又具齋飯。齋罷，方才起身。三藏上馬，行者引路。不覺饑餐渴飲，夜宿曉行。又值初冬時候，但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 157
    "line_end": 157
  "translation_ja": "翌朝、行者は起きると、師に出立を促した。三蔵は衣を着け、行者に寝具や荷物をまとめさせた。いよいよ暇を告げようとすると、陳老人はもう顔を洗う湯を用意し、精進の朝食まで整えていた。食事を済ませて、ようやく出発した。三蔵は馬に乗り、行者が道案内をする。腹が減れば食べ、喉が渇けば飲み、夜は宿り、明け方には歩くうち、いつしか初冬となった。見れば、こうである。"
  "translation_status": "reviewed"
- "id": "xy-ch14-020"
  "section_id": "chapter-14"
  "kind": "verse"
  "origin": "source"
  "source_text": "霜凋紅葉千林瘦，嶺上幾株松柏秀。未開梅蕊散香幽，暖短晝，小春候，菊殘荷盡山茶茂，寒橋古樹爭枝鬥。曲澗涓涓泉水溜，淡雲欲雪滿天浮。朔風驟，牽衣袖，向晚寒威人怎受？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    霜に紅葉はしおれ、あまたの林は痩せ細る。峰では数本の松柏が秀でている。
    まだ開かぬ梅のつぼみは、かすかな香りを漂わせる。
    暖かな短い昼、小春のころ。
    菊は残り少なく、蓮も尽きて、山茶（さんちゃ）が茂る。寒々しい橋の古木は枝を張り、競い合う。
    曲がりくねる谷川に泉の水がさらさらと流れ、雪を降らせそうな薄雲が空いっぱいに浮かぶ。
    北風がにわかに吹き、衣の袖を引く。
    夕暮れに迫る寒さに、人はどうして耐えられよう。

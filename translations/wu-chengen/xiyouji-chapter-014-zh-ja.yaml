  "source_text": "伯欽只得呼喚家僮，牽了馬匹。他卻扶著三藏，復上高山。攀籐附葛，只行到那極巔之處，果然見金光萬道，瑞氣千條，有塊四方大石，石上貼著一封皮，卻是「唵嘛呢叭\U00020E97吽」六個金字。三藏近前跪下，朝石頭看著金字，拜了幾拜，望西禱祝道：「弟子陳玄奘，特奉旨意求經。果有徒弟之分，揭得金字，救出神猴，同證靈山；若無徒弟之分，此輩是個兇頑怪物，哄賺弟子，不成吉慶，便揭不得起。」祝罷又拜。拜畢，上前將六個金字輕輕揭下。只聞得一陣香風，劈手把壓帖兒刮在空中，叫道：「吾乃監押大聖者。今日他的難滿，吾等回見如來，繳此封皮去也。」嚇得個三藏與伯欽一行人望空禮拜。徑下高山，又至石匣邊，對那猴道：「揭了壓帖矣，你出來罷。」那猴歡喜，叫道：「師父，你請走開些，我好出來，莫驚了你。」"
  "source_languages":

- "id": "xy-ch14-002"
  "section_id": "chapter-14"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    詩曰：
    佛即心兮心即佛，心佛從來皆要物。
    若知無物又無心，便是真心法身佛。
    法身佛，沒模樣，一顆圓光涵萬象。
    無體之體即真體，無相之相即實相。
    非色非空非不空，不來不向不回向。
    無異無同無有無，難捨難取難聽望。
    內外靈光到處同，一佛國在一沙中。
    一粒沙含大千界，一個身心萬法同。
    知之須會無心訣，不染不滯為淨業。
    善惡千端無所為，便是南無釋迦葉。
  "source_languages":
  - "zh-Hant"
  "source_locations":

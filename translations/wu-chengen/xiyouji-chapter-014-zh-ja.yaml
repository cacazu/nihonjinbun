    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    行者は口ではそう答えたものの、心にはまだ悪意を抱いていた。針をさっと振って茶碗ほどの太さにすると、三蔵めがけて打ちかかろうとした。慌てた三蔵が呪文を二、三度唱えると、行者は地面に倒れ、鉄棒を取り落とし、手も上げられず、ひたすら叫んだ。
    行者「お師匠さま、分かりました。もう唱えないで、唱えないでください。」
    三蔵「どうして心を偽り、私を打とうとするのだ。」
    行者「打つつもりなどありませんでした。お師匠さま、その術は誰から教わったのです。」
    三蔵「さきほど、一人の老女が授けてくださった。」
    行者は激しく怒った。
    行者「もう聞くまでもない。その老女は、間違いなく観世音（かんぜおん）だ。どうしてあんなに俺を苦しめるんだ。南海へ行って、打ちのめしてやる。」
    三蔵「この術を私に授けたのがあの方なら、当然、私より先にご存じだろう。お前が会いに行って、唱えられたら、お前は死んでしまうのではないか。」
    行者はもっともだと思い、本当に出かける勇気がなくなった。心を改めるほかなく、ひざまずいて哀願した。
    行者「お師匠さま、これは私を言いなりにさせ、あなたについて西へ行かせるための術なのですね。あの方に手を出すのはやめますから、お師匠さまもふだんの言葉のように、むやみにお唱えにならないでください。私は進んでお守りいたします。もう退いたり、悔やんだりする気はありません。」
    三蔵「そういうことなら、私が馬に乗るのを手伝っておくれ。」
    行者はようやくすっかり観念し、気を取り直すと、綿布の直裰の帯を締め、馬の鞍を整え、荷物をまとめて、西へ向かって進んだ。
  "translation_status": "reviewed"

    "description_ja": "底本は三蔵の出自を「海州弘農郡聚賢莊」とする。第九回の地名と異なるが、地理的な矛盾を独自に整合させず保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "segment_ids":

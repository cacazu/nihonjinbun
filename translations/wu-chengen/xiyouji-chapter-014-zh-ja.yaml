  "source_text": "卻說那孫行者請三藏上馬，他在前邊背著行李，赤條條，拐步而行。不多時，過了兩界山，忽然見一隻猛虎，咆哮剪尾而來。三藏在馬上驚心。行者在路傍歡喜道：「師父莫怕他，他是送衣服與我的。」放下行李，耳朵裡拔出一個針兒，迎著風，幌一幌，原來是個碗來粗細一條鐵棒。他拿在手中，笑道：「這寶貝，五百餘年不曾用著他，今日拿出來掙件衣服兒穿穿。」你看他拽開步，迎著猛虎，道聲：「業畜！那裡去！」那隻虎蹲著身，伏在塵埃，動也不敢動動。卻被他照頭一棒，就打的腦漿迸萬點桃紅，牙齒噴幾珠玉塊。諕得那陳玄奘滾鞍落馬，咬指道聲：「天那！天那！劉太保前日打的斑斕虎，還與他鬥了半日；今日孫悟空不用爭持，把這虎一棒打得稀爛。正是強中更有強中手！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    さて、行者は三蔵を馬に乗せ、自分は荷物を背負って前へ出ると、裸でひょこひょこと歩き出した。ほどなく両界山を越えたところで、突然、一頭の猛虎が吠え、尾を振り立てて現れた。三蔵は馬上で肝を冷やしたが、行者は道端で喜んだ。
    行者「お師匠さま、怖がることはありません。あれは私に着物を届けに来たのです。」
    荷物を下ろすと、耳から一本の針を抜き出し、風に向けてさっと振った。見る間に、茶碗ほどの太さの鉄棒になった。それを手にして笑った。
    行者「この宝は、五百余年も使わずにいた。今日は取り出して、着物を一着手に入れるとしよう。」
    見よ、大股に足を踏み出し、猛虎に向かって叫ぶ。
    行者「この畜生、どこへ行く！」
    虎は身をすくめ、地面に伏して、身動き一つできなかった。そこへ頭を狙って一撃を浴びせると、脳漿は幾万の桃の花びらのように飛び散り、歯は玉のかけらのようにはじけ飛んだ。三蔵は驚きのあまり鞍から転げ落ち、指をかんで叫んだ。
    三蔵「ああ、何ということだ！　劉太保（りゅうたいほ）が先日あの斑模様の虎を倒したときは、半日も格闘していたのに、今日の孫悟空は争うまでもなく、一撃でこの虎をめちゃめちゃにしてしまった。まったく、強い者にはさらに上の強者がいるものだ！」
  "translation_status": "reviewed"
- "id": "xy-ch14-011"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者拖將虎來道：「師父略坐一坐，等我脫下他的衣服來，穿了走路。」三藏道：「他那裡有甚衣服？」行者道：「師父莫管我，我自有處置。」好猴王，把毫毛拔下一根，吹口仙氣，叫：「變！」變作一把牛耳尖刀，從那虎腹上挑開皮，往下一剝，剝下個囫圇皮來。剁去了爪甲，割下頭來，割個四四方方一塊虎皮。提起來，量了一量道：「闊了些兒，一幅可作兩幅。」拿過刀來，又裁為兩幅。收起一幅，把一幅圍在腰間。路傍揪了一條葛籐，緊緊束定，遮了下體道：「師父，且去，且去。到了人家，借些針線，再縫不遲。」他把條鐵棒捻一捻，依舊像個針兒，收在耳裡。背著行李，請師父上馬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    行者は虎を引きずってきて言った。
    行者「お師匠さま、少しお掛けになってお待ちください。こいつの着物を剥ぎ取り、それを着て出かけます。」
    三蔵「虎のどこに着物などあるのだ。」
    行者「お師匠さまはお気になさらず。私に考えがあります。」
    さすがは猿の王、体の毛を一本抜き、仙気（せんき）を吹きかけた。
    行者「変われ！」
    毛は牛の耳の形をした尖った小刀になった。それで虎の腹の皮を切り開き、下へ剥ぐと、一枚の皮を丸ごと剥ぎ取った。爪先を切り落とし、頭を切り離し、四角い虎皮を一枚切り出すと、持ち上げて寸法を見た。
    行者「少し幅がありすぎる。一枚から二枚取れそうだ。」
    小刀でさらに二枚に裁ち、一枚をしまい、もう一枚を腰に巻いた。道端の葛のつるを一本引きちぎり、しっかり締めて下半身を隠した。
    行者「お師匠さま、ひとまず行きましょう。人家に着いたら針と糸を借りて、縫うのはそれからでも間に合います。」
    鉄棒を指先でひねると、元の針のようになったので耳にしまい、荷物を背負い、師を馬に乗せた。
  "translation_status": "reviewed"
- "id": "xy-ch14-012"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兩個前進，長老在馬上問道：「悟空，你才打虎的鐵棒，如何不見？」行者笑道：「師父，你不曉得。我這棍，本是東洋大海龍宮裡得來的，喚做天河鎮底神珍鐵，又喚做如意金箍棒。當年大反天宮，甚是虧他。隨身變化，要大就大，要小就小。剛才變做一個繡花針兒模樣，收在耳內矣。但用時，方可取出。」三藏聞言暗喜。又問道：「方才那虎見了你，怎麼就不動動？讓你自在打他，何說？」悟空道：「不瞞師父說，莫道是隻虎，就是一條龍，見了我也不敢無禮。我老孫頗有降龍伏虎的手段，翻江攪海的神通；見貌辨色，聆音察理；大之則量於宇宙，小之則攝於毫毛；變化無端，隱顯莫測。剝這個虎皮，何為稀罕？若到那疑難處，看展本事麼。」三藏聞得此言，愈加放懷無慮，策馬前行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"

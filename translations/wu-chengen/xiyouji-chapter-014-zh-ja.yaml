  "translation_ja": |-
    師弟がずいぶん歩いたところで、突然、道端に口笛が一声響き、六人の男が飛び出してきた。それぞれ長い槍、短い剣、鋭い刃、強い弓を持ち、大声で怒鳴った。
    六人の賊「そこの坊主、どこへ行く！　さっさと馬を置き、荷物を下ろせ。そうすれば命だけは助けて、通してやる。」
    三蔵は魂も飛ぶほど驚き、馬から落ちて、口もきけなくなった。行者は手を貸して起こした。
    行者「お師匠さま、ご安心ください。何でもありません。こいつらはみな、私たちに着物と路銀を届けに来たのです。」
    三蔵「悟空、お前は少し耳が遠いのではないか。向こうは馬と荷物を置いていけと言っているのに、お前のほうから何の着物や路銀をねだるのだ。」
    行者「お師匠さまは着物と荷物、馬を見ていてください。私がひと勝負して、どうなるか試してまいります。」
    三蔵「腕がよくても二つの拳にはかなわず、二つの拳も四本の手にはかなわないという。向こうは大男が六人もいる。お前のような小さな体の者一人で、どうして争おうというのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch14-022"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者的膽量原大，那容分說，走上前來，叉手當胸，對那六個人施禮道：「列位有甚麼緣故，阻我貧僧的去路？」那人道：「我等是剪徑的大王，行好心的山主。大名久播，你量不知。早早的留下東西，放你過去；若道半個『不』字，教你碎屍粉骨。」行者道：「我也是祖傳的大王，積年的山主，卻不曾聞得列位有甚大名。」那人道：「你是不知，我說與你聽：一個喚做眼看喜，一個喚做耳聽怒，一個喚做鼻嗅愛，一個喚作舌嘗思，一個喚作意見慾，一個喚作身本憂。」悟空笑道：「原來是六個毛賊。你卻不認得我這出家人是你的主人公，你倒來擋路。把那打劫的珍寶拿出來，我與你作七分兒均分，饒了你罷。」那賊聞言，喜的喜，怒的怒，愛的愛，思的思，慾的慾，憂的憂，一齊上前亂嚷道：「這和尚無禮。你的東西全然沒有，轉來和我等要分東西。」他掄槍舞劍，一擁前來，照行者劈頭亂砍，乒乒乓乓，砍有七八十下。悟空停立中間，只當不知。那賊道：「好和尚，真個的頭硬。」行者笑道：「將就看得過罷了。你們也打得手困了，卻該老孫取出個針兒來耍耍。」那賊道：「這和尚是一個行針灸的郎中變的。我們又無病症，說甚麼動針的話？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    行者はもともと大胆な男で、言い分を聞いてなどいなかった。前へ進み、胸の前で手を組んで、六人に礼をした。
    行者「皆さん、どのようなわけで、僧の私の行く手をお塞ぎになるのです。」
    賊の一人「俺たちは街道を押さえる大王、情けを施す山の主だ。名はとっくに知れ渡っているが、お前は知らぬらしいな。さっさと品物を置けば通してやる。少しでも『嫌だ』と言えば、体を切り刻み、骨を粉にしてやるぞ。」
    行者「俺も家伝の大王、年季の入った山の主だが、皆さんのお名前など聞いたことがないな。」
    賊の一人「知らないなら、聞かせてやろう。一人は眼看喜（がんかんき）、一人は耳聴怒（じちょうど）、一人は鼻嗅愛（びきゅうあい）、一人は舌嘗思（ぜつしょうし）、一人は意見慾（いけんよく）、一人は身本憂（しんほんゆう）という。」
    行者は笑った。
    行者「何だ、六人のこそ泥か。お前たちは、この出家の俺こそ自分たちの主人だと知らず、逆に道をふさぐとはな。盗んだ宝を出せ。七等分して一人ずつ分ければ、許してやろう。」
    賊たちはそれを聞き、喜ぶ者は喜び、怒る者は怒り、愛する者は愛し、思う者は思い、欲する者は欲し、憂える者は憂え、一斉に進み出てわめいた。
    六人の賊「無礼な坊主め！　お前の物は何一つよこさず、逆に俺たちの物を分けろというのか。」
    槍を振り、剣を舞わせ、一団となって押し寄せると、行者の頭めがけてめった切りにした。がんがん、がちがちと、七、八十回も打ちつけた。行者は真ん中に立ったまま、何も気づかぬ顔をしていた。
    賊の一人「たいした坊主だ。まったく硬い頭だな。」
    行者は笑った。
    行者「まあ、どうにか見られる程度さ。お前たちも打ちくたびれただろう。今度は俺が、針を一本取り出して遊ぶ番だ。」
    賊の一人「この坊主は鍼医者の化けたものか。俺たちは病気でもないのに、何を針を打つなどと言っている。」

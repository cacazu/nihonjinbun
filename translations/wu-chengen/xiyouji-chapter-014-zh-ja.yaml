- "id": "xy-ch14-028"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見他催促請行，急縱身，出離海藏，駕著雲，別了龍王。正走，卻遇著南海菩薩。菩薩道：「孫悟空，你怎麼不受教誨，不保唐僧，來此處何幹？」慌得個行者在雲端裡施禮道：「向蒙菩薩善言，果有唐朝僧到，揭了壓帖，救了我命，跟他做了徒弟。他卻怪我兇頑，我才閃他一閃，如今就去保他也。」菩薩道：「趕早去，莫錯過了念頭。」言畢各回。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    行者は出発を促されると、急いで身を躍らせ、海中の宮を出た。雲に乗って敖広と別れ、進んでいると、ちょうど南海の観音菩薩に出会った。
    観音菩薩「孫悟空、なぜ教えを受けず、唐僧を守りもしないで、ここへ何をしに来たのです。」
    行者は慌てて、雲の上で礼をした。
    行者「先ごろ菩薩さまのお言葉をいただいたとおり、果たして唐から僧がおいでになり、封印の札を剥がして私を救ってくださいました。私はお伴をして弟子になったのですが、あの方が私の凶暴さや頑迷さを責められたので、ちょっと離れてみただけです。今すぐ戻って、お守りいたします。」
    観音菩薩「早く行きなさい。その心を取り逃がしてはなりません。」
    そう言い終えると、それぞれ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch14-029"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者須臾間看見唐僧在路傍悶坐。他上前道：「師父，怎麼不走路？還在此做甚？」三藏擡頭道：「你往那裡去來？教我行又不敢行，動又不敢動，只管在此等你。」行者道：「我往東洋大海老龍王家討茶吃吃。」三藏道：「徒弟啊，出家人不要說謊。你離了我沒多一個時辰，就說到龍王家吃茶？」行者笑道：「不瞞師父說，我會駕觔斗雲，一個觔斗有十萬八千里路，故此得即去即來。」三藏道：「我略略的言語重了些兒，你就怪我，使個性子丟了我去。像你這有本事的，討得茶吃；像我這去不得的，只管在此忍餓。你也過意不去呀。」行者道：「師父，你若餓了，我便去與你化些齋吃。」三藏道：「不用化齋，我那包袱裡還有些乾糧，是劉太保母親送的。你去拿缽盂尋些水來，等我吃些兒走路罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    行者はたちまち、道端でふさぎ込んで座る三蔵を見つけ、そばへ進み出た。
    行者「お師匠さま、どうして歩かず、まだここにおいでなのです。」
    三蔵は顔を上げた。
    三蔵「どこへ行ってきたのだ。お前のおかげで、私は怖くて先へ進めず、動くこともできず、ずっとここで待っていたのだよ。」
    行者「東の大海の老竜王（ろうりゅうおう）の家へ、茶をもらいに行っていました。」
    三蔵「弟子よ、出家した者は嘘をついてはいけない。私から離れて、一時辰（いちじしん）ほどにもならぬのに、竜王（りゅうおう）の家へ茶を飲みに行ったというのか。」
    行者は笑った。
    行者「お師匠さまに隠しはいたしません。私は筋斗雲に乗ることができ、ひと跳びで十万八千里を進みます。ですから、行ってすぐに戻れるのです。」
    三蔵「私の言い方がほんの少しきつかったからといって、恨んでわがままを起こし、私を捨てて行ってしまうとは。お前のように力のある者は茶も飲ませてもらえようが、私のように行けない者は、ずっとここで空腹に耐えるばかりだった。それでは、お前もすまないと思うだろう。」
    行者「お腹がすいたのでしたら、すぐに食事を托鉢してまいります。」
    三蔵「托鉢には及ばない。包みにはまだ、劉太保のお母上がくださった携帯食が残っている。鉢を持ち、水を探してきておくれ。少し食べてから、先へ進もう。」
  "translation_status": "reviewed"
- "id": "xy-ch14-030"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者去解開包袱，在那包裹中間見有幾個粗麵燒餅，拿出來遞與師父。又見那光豔豔的一領綿布直裰、一頂嵌金花帽。行者道：「這衣帽是東土帶來的？」三藏就順口兒答應道：「是我小時穿戴的。這帽子若戴了，不用教經，就會念經；這衣服若穿了，不用演禮，就會行禮。」行者道：「好師父，把與我穿戴了罷。」三藏道：「只怕長短不一，你若穿得，就穿了罷。」行者遂脫下舊白布直裰，將綿布直裰穿上，也就是比量著身體裁的一般。把帽兒戴上。三藏見他戴上帽子，就不吃乾糧，卻默默的念那緊箍咒一遍。行者叫道：「頭痛，頭痛。」那師父不住的又念了幾遍，把個行者痛得打滾，抓破了嵌金的花帽。三藏又恐怕扯斷金箍，住了口不念。不念時，他就不痛了。伸手去頭上摸摸，似一條金線兒模樣，緊緊的勒在上面，取不下，揪不斷，已此生了根了。他就耳裡取出針兒來，插入箍裡，往外亂捎。三藏又恐怕他捎斷了，口中又念起來。他依舊生痛，痛得豎蜻蜓，翻觔斗，耳紅面赤，眼脹身麻。那師父見他這等，又不忍不捨，復住了口。他的頭又不痛了。行者道：「我這頭，原來是師父咒我的？」三藏道：「我念得是緊箍經，何曾咒你？」行者道：「你再念念看。」三藏真個又念。行者真個又痛，只教：「莫念，莫念。念動我就痛了。這是怎麼說？」三藏道：「你今番可聽我教誨了？」行者道：「聽教了。」「你再可無禮了？」行者道：「不敢了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    行者は包みを解き、中に粗びき粉の焼餅（しょうへい）がいくつかあるのを見つけて、師に差し出した。すると、光り輝く綿布の直裰と、金をはめ込んだ飾り帽子も目に入った。
    行者「この衣と帽子は、東土から持ってこられたのですか。」
    三蔵は、その場の思いつきで答えた。
    三蔵「私が幼いころ着けていた物だ。この帽子をかぶれば、経を教わらなくても読経ができる。この衣を着れば、礼法を習わなくても礼ができるのだよ。」
    行者「お師匠さま、どうか私に着けさせてください。」
    三蔵「丈が合わないかもしれぬが、着られるなら着てよい。」
    行者は古い白布の直裰を脱いで綿布の直裰を着た。まるで自分の体を測って仕立てたように、ぴったりだった。さらに帽子をかぶった。三蔵はそれを見ると携帯食を食べるのをやめ、ひそかに緊箍呪（きんこじゅ）を一度唱えた。
    行者「頭が痛い、頭が痛い！」
    師はやめずにさらに何度か唱えたので、行者は痛さに転げ回り、金をはめ込んだ帽子をかき破った。三蔵は金の輪まで引きちぎられるのを恐れ、口を閉じて唱えるのをやめた。やめると痛みも消えた。行者が頭を手で探ると、金の線のようなものが固く締めつけていた。外せず、引きちぎれず、すでに根が生えたようだった。耳から針を抜き出し、輪の下に差し込んで、外へ向けてむやみにこじった。三蔵はまた輪を壊されるのを恐れ、呪文を唱え始めた。行者は再び痛み出し、逆立ちをし、とんぼ返りを打ち、耳も顔も真っ赤になり、眼は張り、体はしびれた。師はその姿を見ると、今度は見るに忍びなくなって、また口を閉じた。頭の痛みは再び消えた。
    行者「この頭の痛みは、お師匠さまが私を呪っておられたのですか。」
    三蔵「私は緊箍経（きんこきょう）を唱えているのだ。いつ、お前を呪ったというのだ。」
    行者「もう一度、唱えてみてください。」
    三蔵が本当にまた唱えると、行者も本当にまた痛くなり、ひたすら叫んだ。
    行者「唱えないでください、唱えないでください！　唱えると痛むのです。いったい、どういうことですか。」
    三蔵「これからは、私の教えを聞くか。」
    行者「お教えに従います。」
    三蔵「もう無礼なことはしないか。」
    行者「もういたしません。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「你再可無禮了？」には発話動詞がないが、前後の三蔵の質問と行者の返答の連続により、三蔵の発言と判断した。緊箍児呪・定心真言・緊箍呪・緊箍経は同じ呪文を指す呼称として辞書で関連づけ、本文の語形は保持する。"

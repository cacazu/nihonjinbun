    "description_ja": "老女による死んだ息子の説明は人物の発言として訳し、語り手が保証する事実として地の文へ移さない。「不敢」は身体的な不能でなく、恐れて乱暴や逃走をためらう意味を保持した。 本文の欠落ではなく解釈・校訂上の留保。"

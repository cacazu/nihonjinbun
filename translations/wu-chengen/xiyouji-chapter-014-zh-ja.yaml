  "source_text": "三藏見他意思，實有好心，真個像沙門中的人物，便叫：「徒弟啊，你姓甚麼？」猴王道：「我姓孫。」三藏道：「我與你起個法名，卻好呼喚。」猴王道：「不勞師父盛意，我原有個法名，叫做孫悟空。」三藏歡喜道：「也正合我們的宗派。你這個模樣，就像那小頭陀一般，我與你起個混名，稱為行者，好麼？」悟空道：「好，好，好。」自此時又稱為孫行者。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    三蔵はその様子に、まことに善意があり、いかにも仏門の者らしいと思い、呼びかけた。
    三蔵「弟子よ、お前の姓は何というのだ。」
    孫悟空「孫（そん）と申します。」
    三蔵「呼びやすいよう、私が法名をつけてやろう。」
    孫悟空「お師匠さまのお心遣いには及びません。私にはもとから孫悟空という法名があります。」
    三蔵は喜んだ。
    三蔵「それなら、ちょうど私たちの宗派にも合っている。お前の姿は、あの小さな頭陀（ずだ）に似ているから、あだ名をつけて行者（ぎょうじゃ）と呼ぼう。よいかね。」
    孫悟空「結構です、結構です、結構です。」
    このときから、孫行者（そんぎょうじゃ）とも呼ばれるようになった。

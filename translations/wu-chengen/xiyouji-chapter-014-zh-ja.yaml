  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他口裡雖然答應，心上還懷不善，把那針兒幌一幌，碗來粗細，望唐僧就欲下手。慌得長老口中又念了兩三遍。這猴子跌倒在地，丟了鐵棒，不能舉手，只教：「師父，我曉得了。再莫念，再莫念。」三藏道：「你怎麼欺心，就敢打我？」行者道：「我不曾敢打。我問師父，你這法兒是誰教你的？」三藏道：「是適間一個老母傳授我的。」行者大怒道：「不消講了，這個老母，坐定是那個觀世音。他怎麼那等害我？等我上南海打他去。」三藏道：「此法既是他授與我，他必然先曉得了。你若尋他，他念起來，你卻不是死了？」行者見說得有理，真個不敢動身，只得回心，跪下哀告道：「師父，這是他奈何我的法兒，教我隨你西去。我也不去惹他，你也莫當常言，只管念誦。我願保你，再無退悔之意了。」三藏道：「既如此，伏侍我上馬去也。」那行者才死心塌地，抖擻精神，束一束綿布直裰，扣背馬匹，收拾行李，奔西而進。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

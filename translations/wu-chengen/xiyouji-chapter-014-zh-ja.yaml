  "kind": "verse"
  "origin": "source"
  "source_text": "尖嘴縮腮，金睛火眼。頭上堆苔蘚，耳中生薜蘿。鬢邊少髮多青草，頷下無鬚有綠莎。眉間土，鼻凹泥，十分狼狽；指頭粗，手掌厚，塵垢餘多。還喜得眼睛轉動，喉舌聲和。語言雖利便，身體莫能那。正是五百年前孫大聖，今朝難滿脫天羅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    口は尖り、頬はこけ、金色の瞳に火のような眼。
    頭には苔が積もり、耳にはつる草が生えている。
    鬢には毛が少なく、青草ばかり。顎にはひげもなく、緑のはますげが生える。
    眉間には土、鼻のくぼみには泥、まことに見る影もない。
    指は太く、手のひらは厚く、塵や垢がうずたかい。
    それでも幸い、眼はくるくると動き、喉や舌の声は穏やかだ。
    言葉は自由に話せても、体を動かすことはできぬ。
    まさしく五百年前の孫大聖（そんたいせい）、今日こそ苦難を終えて天の網を脱するのだ。
  "translation_status": "reviewed"
- "id": "xy-ch14-005"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "劉太保誠然膽大，走上前來，與他拔去了鬢邊草，頷下莎，問道：「你有甚麼說話？」那猴道：「我沒話說，教那個師父上來，我問他一問。」三藏道：「你問我甚麼？」那猴道：「你可是東土大王差往西天取經去的麼？」三藏道：「我正是，你問怎麼？」那猴道：「我是五百年前大鬧天宮的齊天大聖，只因犯了誑上之罪，被佛祖壓於此處。前者有個觀音菩薩，領佛旨意，上東土尋取經人。我教他救我一救，他勸我再莫行兇，歸依佛法，盡慇懃保護取經人，往西方拜佛，功成後自有好處。故此晝夜提心，晨昏弔膽，只等師父來救我脫身。我願保你取經，與你做個徒弟。」三藏聞言，滿心歡喜道：「你雖有此善心，又蒙菩薩教誨，願入沙門，只是我又沒斧鑿，如何救得你出？」那猴道：「不用斧鑿，你但肯救我，我自出來也。」三藏道：「我自救你，你怎得出來？」那猴道：「這山頂上有我佛如來的金字壓帖，你只上山去將帖兒揭起，我就出來了。」三藏依言，回頭央浼劉伯欽道：「太保啊，我與你上山走一遭。」伯欽道：「不知真假何如？」那猴高叫道：「是真，決不敢虛謬。」"

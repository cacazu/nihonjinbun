    "message_ja": "六賊の名は眼・耳・鼻・舌・意・身に対応する寓意を持つ。底本の順序を保ち、通常の六根の配列へ並べ替えない。「那人道」等は「賊の一人」、「一齊」等は「六人の賊」とし、六名のどれかへ発言を割り振らない。"
- "id": "xy-ch14-023"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者伸手去耳朵裡拔出一根繡花針兒，迎風一幌，卻是一條鐵棒，足有碗來粗細。拿在手中道：「不要走，也讓老孫打一棍兒試試手。」諕得這六個賊四散逃走。被他拽開步，團團趕上，一個個盡皆打死。剝了他的衣服，奪了他的盤纏，笑吟吟走將來道：「師父請行，那賊已被老孫剿了。」三藏道：「你十分撞禍。他雖是剪徑的強徒，就是拿到官司，也不該死罪；你縱有手段，只可退他去便了，怎麼就都打死？這卻是無故傷人的性命，如何做得和尚？出家人掃地恐傷螻蟻命，愛惜飛蛾紗罩燈。你怎麼不分皂白，一頓打死？全無一點慈悲好善之心。早還是山野中無人查考；若到城市，倘有人一時衝撞了你，你也行兇，執著棍子亂打傷人，我可做得白客，怎能脫身？」悟空道：「師父，我若不打死他，他卻要打死你哩。」三藏道：「我這出家人寧死，決不敢行兇。我就死，也只是一身，你卻殺了他六人，如何理說？此事若告到官，就是你老子做官，也說不過去。」行者道：「不瞞師父說，我老孫五百年前，據花果山稱王為怪的時節，也不知打死多少人。假似你說這般到官，倒也得些狀告，我就做不到『齊天大聖』了。」三藏道：「只因你沒收沒管，暴橫人間，欺天誑上，才受這五百年前之難。今既入了沙門，若是還像當時行兇，一味傷生，去不得西天，做不得和尚。忒惡！忒惡！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    行者は手を伸ばし、耳の中から刺繍針を一本抜き出した。風に向けてさっと振ると、優に茶碗ほどの太さの鉄棒になった。それを手にして言った。
    行者「逃げるなよ。俺にも一つ、棒で腕試しをさせろ。」
    六人の賊は驚いて四方へ逃げ散ったが、行者は大股で駆け、あちらへこちらへと追いすがって、一人残らず打ち殺した。着物を剥ぎ、路銀を奪うと、にこにこと戻ってきた。
    行者「お師匠さま、お進みください。賊は私が片づけました。」
    三蔵「お前は、とんでもないことをした。あの者たちは街道の強盗ではあっても、役所へ引き渡したところで死罪にはなるまい。いかに腕が立つといっても、追い払えばよかったのだ。なぜ皆殺しにした。これでは、むやみに人の命を奪ったことになる。どうして僧侶でいられよう。出家した者は、掃除をするときも螻蛄や蟻の命を損なうのを恐れ、飛ぶ蛾を惜しんで灯火に薄絹をかけるものだ。お前はどうして是非もわきまえず、打ち殺してしまったのだ。慈悲の心、善を好む心が少しもない。まだこの山野だから、調べる者もいないが、もし町へ出て、誰かがたまたまお前にぶつかりでもして、お前がまた暴れ、棒でめった打ちにして人を傷つけたら、私は何も知らない巻き添えになってしまう。どうして逃れられるのだ。」
    行者「お師匠さま、私が殺さなければ、あいつらがお師匠さまを殺したでしょう。」
    三蔵「私は出家の身だ。死んでも、決して乱暴はしない。私が死んだとしても命は一つだが、お前は六人を殺した。それをどう理屈づけるのだ。役所へ訴えられたなら、お前の父親が役人でも弁解はできまい。」
    行者「お師匠さまに隠しはいたしません。この私は五百年前、花果山（かかざん）に拠って王を称し、妖怪として暮らしていたころ、どれほど多くの人を打ち殺したか分かりません。おっしゃるようにいちいち役所へ訴えられたなら、訴状は山ほどになり、『斉天大聖』になどなれなかったでしょう。」
    三蔵「誰に抑えられることも、戒められることもなく、人の世で暴れ回り、天を欺き、上に背いたからこそ、あの五百年前からの苦難を受けたのだ。今は仏門に入ったのに、なお昔のように暴れ、ひたすら命を奪うなら、西天へは行けず、僧侶にもなれぬ。あまりにひどい、ひどすぎる！」
  "translation_status": "reviewed"
- "id": "xy-ch14-024"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來這猴子一生受不得人氣。他見三藏只管緒緒叨叨，按不住心頭火發道：「你既是這等，說我做不得和尚，上不得西天，不必恁般絮聒惡我，我回去便了。」那三藏卻不曾答應。他就使一個性子，將身一縱，說一聲：「老孫去也！」三藏急擡頭，早已不見。只聞得呼的一聲，回東而去。撇得那長老孤孤零零，點頭自歎，悲怨不已道：「這廝這等不受教誨，我但說他幾句，他怎麼就無形無影的徑回去了？罷罷罷，也是我命裡不該招徒弟，進人口。如今欲尋他無處尋，欲叫他叫不應，去來，去來。」正是：捨身拚命歸西去，莫倚傍人自主張。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    そもそも、この猿は一生、人からつらく当たられるのが我慢できない性分だった。三蔵がいつまでもくどくどと言うので、胸の怒りを抑えきれず、かっとなった。
    行者「そこまで言って、僧侶にはなれず、西天へも行けぬというなら、そんなにくどくど俺を責めなくてもいい。帰るまでだ。」
    三蔵は返事をしなかった。すると行者はわがままを起こし、身を躍らせて一声叫んだ。
    行者「俺は帰るぞ！」
    三蔵が慌てて顔を上げたときには、もう姿はなかった。ひゅうという音だけを残して、東へ帰ってしまった。三蔵はたった一人取り残され、うなずきながら自分を嘆き、悲しみも恨みも尽きなかった。
    三蔵「あいつは、あれほど教えを受けつけないのか。ほんの少し言い聞かせただけなのに、どうして跡形もなく帰ってしまったのだろう。仕方ない、仕方ない。もともと私には、弟子を迎え、連れを増やす縁がないのだ。今となっては、捜そうにも捜す場所がなく、呼ぼうにも返事はない。行こう、行こう。」
    まさしく、こうである。
    身を捨て、命を懸けて西へ向かえ。
    他人に頼らず、自分で道を決めるのだ。
  "translation_status": "reviewed"
- "id": "xy-ch14-025"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老只得收拾行李，捎在馬上，也不騎馬，一隻手拄著錫杖，一隻手揪著韁繩，淒淒涼涼，往西前進。行不多時，只見山路前面有一個年高的老母，捧一件綿衣，綿衣上有一頂花帽。三藏見他來得至近，慌忙牽馬，立於右側讓行。那老母問道：「你是那裡來的長老，孤孤恓恓獨行於此？」三藏道：「弟子乃東土大唐奉差往西天拜活佛求真經者。」老母道：「西方佛乃大雷音寺天竺國界，此去有十萬八千里路。你這等單人獨馬，又無個伴侶，又無個徒弟，你如何去得？」三藏道：「弟子日前收得一個徒弟，他性潑兇頑，是我說了他幾句，他不受教，遂渺然而去也。」老母道：「我有這一領綿布直裰、一頂嵌金花帽，原是我兒子用的，他只做了三日和尚，不幸命短身亡。我才去他寺裡哭了一場，辭了他師父，將這兩件衣、帽拿來，做個憶念。長老啊，你既有徒弟，我把這衣帽送了你罷。」三藏道：「承老母盛賜，但只是我徒弟已走了，不敢領受。」老母道：「他那廂去了？」三藏道：「我聽得呼的一聲，他回東去了。」老母道：「東邊不遠，就是我家，想必往我家去了。我那裡還有一篇咒兒，喚做『定心真言』，又名做『緊箍兒咒』。你可暗暗的念熟，牢記心頭，再莫洩漏一人知道。我去趕上他，叫他還來跟你，你卻將此衣帽與他穿戴。他若不服你使喚，你就默念此咒，他再不敢行兇，也再不敢去了。」三藏聞言，低頭拜謝。那老母化一道金光，回東而去。三藏情知是觀音菩薩授此真言，急忙撮土焚香，望東懇懇禮拜。拜罷，收了衣帽，藏在包袱中間。卻坐於路傍，誦習那定心真言，來回念了幾遍，念得爛熟，牢記心胸不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"

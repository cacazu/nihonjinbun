- "id": "xy-ch14-026"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那悟空別了師父，一觔斗雲，徑轉東洋大海。按住雲頭，分開水道，徑至水晶宮前。早驚動龍王出來迎接，接至宮裡坐下。禮畢，龍王道：「近聞得大聖難滿，失賀！想必是重整仙山，復歸古洞矣？」悟空道：「我也有此心性，只是又做了和尚了。」龍王道：「做甚和尚？」行者道：「我虧了南海菩薩勸善，教我正果，隨東土唐僧上西方拜佛，皈依沙門，又喚為行者了。」龍王道：「這等真是可賀，可賀。這才叫做改邪歸正，懲創善心。既如此，怎麼不西去，復東回何也？」行者笑道：「那是唐僧不識人性。有幾個毛賊剪徑，是我將他打死，唐僧就緒緒叨叨，說了我若干的不是。你想老孫可是受得悶氣的？是我撇了他，欲回本山，故此先來望你一望，求鍾茶吃。」龍王道：「承降，承降。」當時龍子、龍孫即捧香茶來獻。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    さて、行者は師と別れると、筋斗雲（きんとうん）ひと跳びで、まっすぐ東の大海へ帰った。雲を止め、水を分けて進み、そのまま水晶宮（すいしょうきゅう）の前まで行くと、早くも気づいた敖広（ごうこう）が出迎え、宮中に招いて座らせた。挨拶が済むと、敖広が言った。
    敖広「近ごろ、大聖の苦難が終わったと伺いながら、お祝いも申し上げず失礼いたしました。きっと仙山を整え直し、昔の洞窟へお戻りになったのでしょうね。」
    行者「そうしたい気もあるのだが、また坊主になったんだ。」
    敖広「どのような僧になられたのです。」
    行者「南海（なんかい）の菩薩が善を勧め、正果（しょうか）を得られるようにしてくださったおかげで、東土の唐僧について西方へ仏を拝みに行くことになり、仏門に帰依して、行者とも呼ばれるようになったのさ。」
    敖広「それは本当に、おめでたいことです。それでこそ邪を改め正道に帰し、過ちを懲らして善心を起こすというもの。そういうことでしたら、なぜ西へ行かず、東へ戻ってこられたのですか。」
    行者は笑った。
    行者「あの唐僧は、人の気性が分からないのさ。こそ泥が何人か道をふさいだので、俺が打ち殺してやると、唐僧はくどくどと、あれこれ俺の悪口を言い立てた。考えてもみろ、俺がむしゃくしゃしたまま我慢できると思うか。置き去りにして、故郷の山へ戻ろうとしたんだが、その前に顔を見て、茶を一杯もらいに寄ったのさ。」
    敖広「よくおいでくださいました。」
    すると竜の子や孫たちが、香りよい茶を捧げてきた。
  "translation_status": "reviewed"
- "id": "xy-ch14-027"
  "section_id": "chapter-14"

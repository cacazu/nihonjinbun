  "translation_ja": |-
    詩にいう。
    仏はすなわち心、心はすなわち仏。心も仏も、もとよりいずれも要となるもの。
    物もなく心もないと知るなら、それこそ真心（しんしん）、法身（ほっしん）の仏。
    法身の仏には姿がなく、一つの円い光に万象を包む。
    体なき体こそ真の体、相（そう）なき相こそ実相（じっそう）。
    色（しき）でもなく、空（くう）でもなく、空でないのでもない。来ることも、向かうことも、回向（えこう）することもない。
    異もなく同もなく、有も無もない。捨てがたく取りがたく、聞くにも望むにもとらえがたい。
    内と外との霊妙な光は、どこへ行っても同じ。一つの仏国（ぶっこく）は一粒の砂の中にある。
    一粒の砂に大千世界（だいせんせかい）が含まれ、一つの身と心に万法（ばんぽう）が一つになる。
    これを知るには無心の秘訣を悟るべし。染まらず滞らないのが浄業（じょうごう）である。
    善悪の千々の思いに作為することがなければ、それこそ南無釈迦葉（なむしゃかしょう）。

- "id": "xy-ch14-021"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們正走多時，忽見路傍唿哨一聲，闖出六個人來，各執長槍短劍，利刃強弓，大咤一聲道：「那和尚那裡走！趕早留下馬匹，放下行李，饒你性命過去。」諕得那三藏魂飛魄散，跌下馬來，不能言語。行者用手扶起道：「師父放心，沒些兒事，這都是送衣服送盤纏與我們的。」三藏道：「悟空，你想有些耳閉。他說教我們留馬匹、行李，你倒問他要甚麼衣服、盤纏。」行者道：「你管守著衣服、行李、馬匹，待老孫與他爭持一場，看是何如。」三藏道：「好手不敵雙拳，雙拳不如四手。他那裡六條大漢，你這般小小的一個人兒，怎麼敢與他爭持？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 160

  "source_text": "伯欽聽說，領著三藏，一行人回東即走。走了五七里遠近，又聽得那猴高叫道：「再走，再走。」三藏又行了許遠，下了山，只聞得一聲響喨，真個是地裂山崩。眾人盡皆悚懼。只見那猴早到了三藏的馬前，赤淋淋跪下，道聲：「師父，我出來也。」對三藏拜了四拜，急起身，與伯欽唱個大喏道：「有勞大哥送我師父，又承大哥替我臉上薅草。」謝畢，就去收拾行李，扣背馬匹。那馬見了他，腰軟蹄矬，戰兢兢的立站不住。蓋因那猴原是弼馬溫，在天上看養龍馬的，有些法則，故此凡馬見他害怕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    劉伯欽はそう聞くと三蔵を連れ、一行そろって東へ引き返した。五、七里ほど行くと、また孫悟空の大声がした。
    孫悟空「もっと離れて、もっと離れて！」
    三蔵はさらに遠くまで進んで山を下りた。すると大音響が一つとどろき、まさしく大地が裂け、山が崩れた。一同はすっかりおびえたが、孫悟空はもう三蔵の馬の前に来ており、裸のままひざまずいていた。
    孫悟空「お師匠さま、出てまいりました。」
    三蔵に四度礼拝すると、さっと立ち上がり、劉伯欽に声を上げて丁重に礼をした。
    孫悟空「兄さん、わざわざお師匠さまを送ってくれて、ありがとう。俺の顔の草まで抜いてもらった。」
    礼を言い終えると、すぐに荷物を整え、馬の鞍を締めた。馬は孫悟空を見るや腰が抜け、脚が折れそうになり、ぶるぶる震えて立ってもいられなかった。この猿はもと弼馬温（ひつばおん）で、天界で竜馬を飼い慣らす術を持っていたため、地上の馬は姿を見ると恐れるのであった。

    "description_ja": "底本の「心佛從來皆要物」は「要」を重要・肝要の意と取り、「いずれも要となるもの」とした。文脈上の語義には留保があり、別字へ補訂していない。 末句は底本どおり「南無釋迦葉」。一般的な仏名に無断修正せず「南無釈迦葉」と保持した。釈迦葉の指示対象と慣用の日本語読みは確定できず、読みは仮の推定。 「不來不向不回向」「難捨難取難聽望」は否定を重ねる詩句として訳した。特定の仏教教学体系の術語対応を、原文以上に確定していない。 本文の欠落ではなく解釈・校訂上の留保。"

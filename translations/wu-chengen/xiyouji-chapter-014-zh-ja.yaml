    "line_end": 136
  "translation_ja": |-
    劉伯欽はさすがに肝が据わっていた。前へ進み、鬢の草や顎のはますげを抜いてやって尋ねた。
    劉伯欽「何か話があるのか。」
    孫悟空「あんたに話すことはない。そちらのお師匠さまに来ていただきたい。ちょっとお尋ねしたいんだ。」
    三蔵「私に何を尋ねたいのだね。」
    孫悟空「東土（とうど）の王に遣わされ、西天へ経を取りに行かれる方ではありませんか。」
    三蔵「まさしくそうだが、なぜ尋ねるのだね。」
    孫悟空「私は五百年前に天宮（てんきゅう）で大暴れした斉天大聖（せいてんたいせい）です。上の方を欺いた罪で、仏祖（ぶっそ）によってここに押し込められました。先ごろ、観音菩薩（かんのんぼさつ）が仏のご命令を受け、取経の人を探しに東土へ向かわれました。私が救ってくださるようお願いすると、もう乱暴をせず、仏法に帰依して、心を尽くして取経の人を守り、西方（さいほう）へ仏を拝みに行き、功を成し遂げればおのずとよいことがある、とお諭しになったのです。ですから昼も夜も気をもみ、朝も晩も不安を抱えながら、ただお師匠さまが来て、ここから救い出してくださるのを待っておりました。あなたをお守りして経を取りに行き、お弟子にしていただきたいのです。」
    三蔵はそれを聞き、心から喜んだ。
    三蔵「お前にはそのような善い心があり、菩薩（ぼさつ）の教えも受けて仏門に入りたいという。ただ、私には斧も鑿もない。どうすれば救い出せるのだろう。」
    孫悟空「斧も鑿もいりません。ただ救ってくださるおつもりがあれば、自分で出られます。」
    三蔵「私は救いたいと思うが、どうやって出るのだね。」
    孫悟空「この山の頂には、わが仏如来（にょらい）が金文字で記した封印の札があります。山に登って、その札を剥がしてくだされば、私は出られます。」
    三蔵はその言葉に従い、振り向いて劉伯欽に頼んだ。
    三蔵「太保（たいほ）、私と一緒に山へ登ってくださいませんか。」
    劉伯欽「本当なのか、嘘なのか、分かりませんが。」
    孫悟空は声を張り上げた。
    孫悟空「本当です。決して、でたらめは申しません！」

  "translation_ja": |-
    劉伯欽は仕方なく家僕を呼んで馬を引かせ、自分は三蔵を支えながら、再び高い山を登った。藤や葛をつかんで最も高い頂まで登ると、果たして幾万筋もの金の光、幾千筋ものめでたい気が見えた。四角い大石があり、その石に一枚の封印が貼ってあった。そこには「唵嘛呢叭𠺗吽（おんまにはべいうん）」という六つの金文字が記されていた。三蔵は前へ進んでひざまずき、石の金文字を仰いで何度か拝み、西を向いて祈った。
    三蔵「弟子、陳玄奘（ちんげんじょう）は、勅命を奉じて経を求めております。まことに師弟となる縁があるなら、この金文字を剥がし、神猿を救い出して、ともに霊山（れいざん）で悟りを得させてください。師弟となる縁がなく、あれが凶暴で頑迷な魔物であり、弟子の私を欺き、めでたい結末とならないのなら、剥がすことができませんように。」
    祈り終えると、また拝んだ。拝み終えて前へ進むと、六つの金文字の札は軽々と剥がれた。すると香り高い風が一陣吹き、手から札をさらって空へ運んだ。声がした。
    大聖（たいせい）を見張る神「私は大聖の監視を命じられた者だ。今日でその苦難が終わったので、我々は如来にお目にかかり、この封印をお返ししに行く。」
    三蔵も劉伯欽も、一行はみな驚いて、空に向かって礼拝した。そのまま高い山を下り、再び石の囲いのそばへ来ると、三蔵は孫悟空に告げた。
    三蔵「封印の札は剥がした。出ておいで。」
    孫悟空は喜んで叫んだ。
    孫悟空「お師匠さま、少し離れていてください。驚かせずに、出ていきたいのです。」

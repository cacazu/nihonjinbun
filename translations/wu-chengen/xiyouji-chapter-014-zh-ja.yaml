    "description_ja": "六賊の名は眼・耳・鼻・舌・意・身に対応する寓意を持つ。底本の順序を保ち、通常の六根の配列へ並べ替えない。「那人道」等は「賊の一人」、「一齊」等は「六人の賊」とし、六名のどれかへ発言を割り振らない。 本文の欠落ではなく解釈・校訂上の留保。"

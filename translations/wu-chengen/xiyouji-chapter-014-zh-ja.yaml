- "id": "xy-ch14-009"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那伯欽見孫行者一心收拾要行，卻轉身對三藏唱個喏道：「長老，你幸此間收得個好徒，甚喜，甚喜。此人果然去得。我卻告回。」三藏躬身作禮相謝道：「多有拖步，感激不勝。回府多多致意令堂老夫人、令荊夫人，貧僧在府多擾，容回時踵謝。」伯欽回禮，遂此兩下分別。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    劉伯欽は行者が一心に旅支度をしているのを見ると、三蔵に向き直り、声を上げて礼をした。
    劉伯欽「長老、幸いここでよいお弟子を得られ、まことにうれしいことです。この者なら、確かにお伴ができましょう。私はこれで失礼いたします。」
    三蔵は身をかがめ、礼をして感謝した。
    三蔵「長々とお付き合いいただき、感謝の念に堪えません。お帰りになりましたら、お母上にも奥さまにも、くれぐれもよろしくお伝えください。お宅では大変お世話になりました。帰途にはお訪ねして、お礼を申し上げます。」
    劉伯欽も礼を返し、こうして双方は別れた。

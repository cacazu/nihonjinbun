    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    三蔵は仕方なく荷物をまとめ、馬にくくりつけた。自分は馬に乗らず、片手に錫杖（しゃくじょう）をつき、もう片方の手で手綱を引き、寂しく心細いまま西へ歩いた。ほどなく、山道の前方から年老いた女がやって来た。綿入れを一着捧げ持ち、その上には飾り帽子が一つ載っていた。三蔵は近づく姿を見ると、急いで馬を引いて道の右へ寄り、道を譲った。老女が尋ねた。
    老女「どちらから来た長老さまですか。こんなところを、お一人で寂しく歩いておられるとは。」
    三蔵「私は東土大唐のご命令を受け、西天へ生ける仏を拝み、真の経を求めに行く者です。」
    老女「西方の仏は、天竺国（てんじくこく）の領内にある大雷音寺（だいらいおんじ）においでです。ここから十万八千里もあります。あなた一人、馬一頭で、仲間も弟子もいないのに、どうして行けましょう。」
    三蔵「先日、弟子を一人得たのですが、気性が激しく凶暴で頑迷なものでした。私が少し言い聞かせたところ、教えを受けつけず、姿を消してしまったのです。」
    老女「ここに綿布の直裰が一着と、金をはめ込んだ飾り帽子が一つあります。もとは息子が使っていた物ですが、あの子は僧になって三日で、不幸にも短い生涯を終えました。私は今、息子のいた寺へ行って泣いてきたところです。お師匠さまに別れを告げ、この衣と帽子を思い出の品にと、持ち帰ってきました。長老さま、お弟子があるのでしたら、あなたに差し上げましょう。」
    三蔵「ありがたいお心遣いですが、弟子はもう行ってしまいました。頂戴するわけにはまいりません。」
    老女「どちらへ行ったのです。」
    三蔵「ひゅうという音が聞こえ、東へ帰っていきました。」
    老女「東へ少し行ったところが私の家ですから、きっとそこへ行ったのでしょう。私にはまた一つ、定心真言（じょうしんしんごん）、別の名を緊箍児呪（きんこじじゅ）という呪文があります。ひそかに繰り返してよく覚え、心にしっかりとどめて、誰一人にも知らせてはいけません。私が追いついて、戻ってあなたについて行くよう言いましょう。戻ってきたら、この衣と帽子を着けさせなさい。あなたの言いつけに従わないときは、心の中でこの呪文を唱えるのです。そうすれば、もう乱暴を働く勇気も、逃げ去る勇気もなくなります。」
    三蔵は聞いて、頭を下げて礼をした。老女は一筋の金の光と化し、東へ帰っていった。三蔵はこの真言を授けてくださったのが観音菩薩だと悟り、急いで土をひとつまみ盛って香をたき、東に向かって心を込めて礼拝した。礼を終えると衣と帽子をしまい、包みの中へ隠した。それから道端に座り、定心真言を何度も繰り返して、すっかりそらで言えるまで心に刻んだ。こちらの話は、ひとまずここまでとしよう。

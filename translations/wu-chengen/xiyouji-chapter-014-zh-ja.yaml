    "description_ja": "六字真言の「\U00020E97」は底本の字形を保持した。第七回などの異なる字形に黙って統一しない。 監視者の声は「吾乃」と「吾等」を併用する。話者を「大聖を見張る神」とし、特定の土地神や五方の神々と断定せず、一人称単数と複数の差を残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "segment_ids":
    - "xy-ch14-015"
    "description_ja": "「唐人」と「糖人」は中国語で同音。訳は砂糖や蜜の人形という意味を明示し、語の掛け合いを保持した。 「我兒子便胡說」は相手を自分の子扱いする罵りの含意を持つと解し、「でたらめを言う奴は、俺の息子だ」とした。主語の転換を伴う慣用的な言い回しであり、逐語的解釈には留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "segment_ids":

    "description_ja": "「你再可無禮了？」には発話動詞がないが、前後の三蔵の質問と行者の返答の連続により、三蔵の発言と判断した。緊箍児呪・定心真言・緊箍呪・緊箍経は同じ呪文を指す呼称として辞書で関連づけ、本文の語形は保持する。 本文の欠落ではなく解釈・校訂上の留保。"

  "source_text": "茶畢，行者回頭一看，見後壁上掛著一幅「圯橋進履」的畫兒。行者道：「這是甚麼景致？」龍王道：「大聖在先，此事在後，故你不認得。這叫做『圯橋三進履』。」行者道：「怎的是『三進履』？」龍王道：「此仙乃是黃石公，此子乃是漢世張良，石公坐在圯橋上，忽然失履於橋下，遂喚張良取來。此子即忙取來，跪獻於前。如此三度，張良略無一毫倨傲怠慢之心，石公遂愛他勤謹，夜授天書，著他扶漢。後果然運籌帷幄之中，決勝千里之外。太平後，棄職歸山，從赤松子遊，悟成仙道。大聖，你若不保唐僧，不盡勤勞，不受教誨，到底是個妖仙，休想得成正果。」悟空聞言，沉吟半晌不語。龍王道：「大聖自當裁處，不可圖自在，誤了前程。」悟空道：「莫多話，老孫還去保他便了。」龍王忻喜道：「既如此，不敢久留，請大聖早發慈悲，莫要疏久了你師父。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    茶を飲み終え、行者が振り向いて見ると、奥の壁に「圯橋進履（いきょうしんり）」の絵が一幅掛かっていた。
    行者「これは、どんな場面だ。」
    敖広「大聖のご活躍より後の出来事ですから、ご存じないのも道理です。これは『圯橋三進履（いきょうさんしんり）』と申します。」
    行者「『三進履（さんしんり）』とは、どういうことだ。」
    敖広「こちらの仙人は黄石公（こうせきこう）、こちらの若者は漢の張良（ちょうりょう）です。黄石公は圯橋（いきょう）に座っていて、ふと履を橋の下に落とし、張良を呼んで取らせました。若者は急いで拾い、ひざまずいて差し出しました。これが三度に及んでも、張良には少しもおごりや怠りがありませんでした。黄石公はその勤勉で慎み深い心を愛し、夜、天書（てんしょ）を授けて漢を助けさせたのです。のちに張良は、まさしく陣幕の中で策を巡らし、千里のかなたの勝敗を決する人物となりました。天下が平定されると、官職を捨てて山へ帰り、赤松子（せきしょうし）について遊び、仙道を悟りました。大聖、唐僧を守らず、力を尽くして働かず、教えを受けないのであれば、結局は妖仙（ようせん）のままで、正果を得ようなどと思ってはなりません。」
    行者はそれを聞き、しばらく考え込んだまま黙っていた。
    敖広「大聖ご自身でお決めになることですが、気ままさだけを求めて、先々を誤ってはなりません。」
    行者「もう言うな。戻って、あの人を守ればいいんだろう。」
    敖広は喜んだ。
    敖広「そういうことでしたら、長くお引き止めはいたしません。どうか早く慈悲をお起こしになり、お師匠さまをいつまでも放っておかれませぬよう。」

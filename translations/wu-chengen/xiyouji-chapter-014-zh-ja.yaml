- "id": "xy-ch14-003"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那劉伯欽與唐三藏驚驚慌慌，又聞得叫聲「師父來也」。眾家僮道：「這叫的必是那山腳下石匣中老猿。」太保道：「是他，是他。」三藏問：「是甚麼老猿？」太保道：「這山舊名五行山，因我大唐王征西定國，改名兩界山。先年間曾聞得老人家說：王莽篡漢之時，天降此山，下壓著一個神猴，不怕寒暑，不吃飲食，自有土神監押，教他饑餐鐵丸，渴飲銅汁。自昔到今，凍餓不死。這叫必定是他。長老莫怕，我們下山去看來。」三藏只得依從，牽馬下山。行不數里，只見那石匣之間果有一猴，露著頭，伸著手，亂招手道：「師父，你怎麼此時才來？來得好，來得好。救我出來，我保你上西天去也。」這長老近前細看，你道他是怎生模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch14-1455563"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第014回&oldid=1455563"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    さて、劉伯欽（りゅうはくきん）と三蔵（さんぞう）が驚き慌てていると、また声が聞こえた。
    孫悟空（そんごくう）「お師匠さまが来た！」
    家僕たち「あれはきっと、山のふもとの石の囲いにいる老猿の声です。」
    劉伯欽「そうだ、あいつだ。」
    三蔵「どのような老猿なのですか。」
    劉伯欽「この山は、昔は五行山（ごぎょうざん）といいました。わが大唐（だいとう）の王が西へ攻めて国を平定されたので、両界山（りょうかいざん）と名を改めたのです。以前、年寄りたちに聞いた話では、王莽（おうもう）が漢（かん）を簒奪したころ、この山が天から降り、その下に一匹の神猿を押し込めたそうです。寒暑も恐れず、飲み食いもせず、土地神（とちがみ）が見張っていて、腹が減れば鉄の玉を食わせ、喉が渇けば溶けた銅を飲ませる。それから今まで、凍え死にも飢え死にもしません。呼んでいるのは間違いなくあいつです。長老、怖がらず、山を下りて見に行きましょう。」
    三蔵は従うほかなく、馬を引いて山を下った。数里（り）も行かないうちに、石の囲いの間に果たして一匹の猿がいた。頭を突き出し、手を伸ばして、しきりに手招きしている。
    孫悟空「お師匠さま、どうして今ごろまでおいでにならなかったのです。よくいらっしゃいました、よくいらっしゃいました！　私をここから救い出してください。お守りして西天（さいてん）までお連れします。」
    三蔵はそばへ寄り、よく見た。さて、どんな姿であったか。
  "translation_status": "reviewed"

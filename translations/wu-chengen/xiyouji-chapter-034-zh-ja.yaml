  "known_gaps":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-001"
    "description_ja": "回題の「騰挪」には、底本が「一作『那』」、すなわち「挪」を「那」とする本もあると注記する。原文欄は異文注ごと保持し、回題の日本語では変化して立ち回る術という意味を訳した。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-003"
    "description_ja": "ひょうたんが消えた直後の「天呀！怎麼不見了？」には個人の発話者名がないため、二匹の間から上がった声として訳し、どちらか一匹に断定していない。「我推一句兒在你身上」は精細鬼が伶俐虫に責任を寄せて話す意に採った。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-005"
    "description_ja": "「小妖」の報告は個人名を明記しないため、小妖たちの報告として訳した。伶俐虫が浄瓶を添えたという言い方から精細鬼が中心に話している可能性はあるが、本文で名を断定しない。「仙家之物，近不得凡人之手」は小妖たちの言い訳であり、語り手が認める宝の性質ではない。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-007"
    "description_ja": "幌金繩と幌金索は同じ宝の縄を指すため、通常の日本語名は幌金縄に統一した。原文欄の異なる表記は保存する。外班は外勤の組と解したが、具体的な官庁・官職へは同定しない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-011"
    "description_ja": "九つの油釜、七、八日、礼拝した三人、師への四拝は、この回の語りと悟空の主張のまま保存した。別の回の経歴と独自に整合させない。「六葉連肝肺、三毛七孔心」は古い身体観を用い、心身を使い尽くす労苦を言う誇張として訳した。現代医学の説明ではない。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-012"
    "description_ja": "「減粧」は化粧道具を収める箱の意に採った。字体を「減妝」などへ訂正していない。「大四聲喝起」は底本の四という数を保持し、先払いの声を四声高く上げると訳したが、慣用的な発声法を指す可能性もあり、特定の儀礼へは同定しない。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-013"
    "description_ja": "休憩を勧める「壓得肩頭疼啊」は、担ぎ手の肩への負担を言うものと解した。悟空が自分で輿を担いでいたという動作は補わない。担ぎ手の一人は打ち砕かれ、かすった一人はまだうめいており、二人とも即死したとは訳していない。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-015"
    "description_ja": "悟空の勘定は、先の一拝、これからの四拝、「二つのお辞儀を得する」という底本の数をそのまま保持した。算術上の整合のために数を改めない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-016"
    "description_ja": "八戒の「舊話」は直後に弼馬温と明かされるため、過去を持ち出して悟空をからかう「昔なじみ」と訳した。話という物が実際に来たとは扱わない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-017"
    "description_ja": "この返答の主語「魔頭」は、二人のどちらかを明記しない。母への応対を一方の大王の発言として訳し、金角大王・銀角大王の一方へ固定していない。次の斬撃も、剣の所持だけで話者・動作者を確定しない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-019"
    "description_ja": "銀角大王の「三合」は武器を交える回数として三合と訳し、「三戰」は三度戦うと訳した。教育部《重編國語辭典修訂本》「合」は交手の回数を数える単位と説明する。後に三十合ほど戦うという地の文と数が違うが、予告の三と実戦の三十を独自に整合させない。勝敗に応じて捕虜を返すという条件の順序も保持した。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=3968&word=%3D%E5%90%88\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-021"
    "description_ja": "「蟒龍觔」は大蛇のような竜の筋を帯にする形容として、「粉皮靴靿」は白い革の靴の筒として訳した。「灌口活真君」は灌江口の二郎真君に似るとの比喩で、実際に真君がこの場へ現れたという意味にはしない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-023"
    "description_ja": "「一蹍」の蹍は足で踏む意の字で、教育部《異體字字典》もその義を示す。ここでは急所まであと一踏みという間隔の比喩として訳したが、一定の長さの単位とは断定しない。三分は長さとして保持する。参照：https://dict.variants.moe.edu.tw/dictView.jsp?ID=72360\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-026"
    "description_ja": "首の縄は底本が「金圈子」と説明するため金の輪として訳した。鑢で二つに切った後、縄として回収される展開を独自に修理・再生の説明で補っていない。七、八回の宝剣の打撃で頭皮も赤くならない描写を保持した。\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-027"
    "description_ja": "「二十多嘴棍」は「二十」と、余計な口をきいた者への「多嘴棍」とに分け、二十打ちの罰と訳した。「二十数回」へ機械的に切らない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-031"
    "description_ja": "「一時三刻」は短い間をいう慣用表現として読み、時間と刻の字数をそのまま現代の時・分へ換算しない。五百年前、四十九日の炉での修行と身体の性質は、悟空自身の回想として保持する。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-032"
    "description_ja": "「孤拐」は足のくるぶしの意に採った。教育部《重編國語辭典修訂本》は頬骨と足首の両義を挙げ、『西遊記』の用例も示す。この場面は腰まで溶ける演技に続くため、下肢の意味に解した。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=70836&la=0&powerMode=0\
      \ 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "segment_ids":
    - "xy-ch34-033"
    "description_ja": "「蟭蟟蟲」は底本の字を保持し、虫の大小と飛翔の文脈を優先した。蝉類を指す語でもあるが、現代の特定の昆虫種に決めず、ごく小さな虫として訳した。 本文欠落ではなく、解釈・校訂上の留保。"

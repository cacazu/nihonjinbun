  "source_text": "行者在半空中見他回去，又搖身一變，變作蒼蠅兒，飛下去，跟著小妖。你道他既變了蒼蠅，那寶貝卻放在何處？如丟在路上，藏在草裡，被人看見拿去，卻不是勞而無功？他還帶在身上。帶在身上啊，蒼蠅不過豆粒大小，如何容得？原來他那寶貝，與他金箍棒相同，叫做如意佛寶，隨身變化，可以大，可以小，故身上亦可容得。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 124
    "line_end": 124
  "translation_ja": "悟空は空中から二匹が戻っていくのを見て、また体を揺すり、蠅に変わって飛び下り、小妖たちのあとをつけた。蠅に変わったのなら、あの宝はどこへ置いたのかと思われよう。道に捨てたり草に隠したりして、誰かに見つけて持っていかれたら、せっかくの苦労が水の泡ではないか。宝はやはり身につけていたのである。身につけていたといっても、蠅は豆粒ほどしかない。どうして持てたのか。そもそもあの宝は、悟空の金箍棒（きんこぼう）と同じく、如意仏宝（にょいぶっぽう）と呼ばれるもので、身につける者の変化に従って、大きくも小さくもなる。それゆえ蠅の体にも収まったのだった。"
  "translation_status": "draft"
- "id": "xy-ch34-005"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他嚶的一聲飛下去，跟定那怪。不一時，到了洞裡。只見那兩個魔頭坐在那裡飲酒，小妖朝上跪下。行者就釘在那門櫃上，側耳聽著。小妖道：「大王。」二老魔即停杯道：「你們來了？」小妖道：「來了。」又問：「拿著孫行者否？」小妖叩頭，不敢聲言。老魔又問，又不敢應，只是叩頭。問之再三，小妖俯伏在地：「赦小的萬千死罪，赦小的萬千死罪。我等執著寶貝，走到半山之中，忽遇著蓬萊山一個神仙。他問我們那裡去，我們答道：『拿孫行者去。』那神仙聽見說孫行者，他也惱他，要與我們幫工。是我們不曾叫他幫工，卻將拿寶貝裝人的情由，與他說了。那神仙也有個葫蘆，善能裝天。我們也是妄想之心，養家之意：他的裝天，我的裝人，與他換了罷。原說葫蘆換葫蘆，伶俐蟲又貼他個淨瓶。誰想他仙家之物，近不得凡人之手。正試演處，就連人都不見了。萬望饒小的們死罪。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    悟空はぶんと羽音を立てて飛び下り、二匹についていった。ほどなく洞に着くと、金角大王（きんかくだいおう）と銀角大王（ぎんかくだいおう）がそこに座って酒を飲んでいた。小妖たちは二人に向かってひざまずき、悟空は門の枠にぴたりと止まって、耳を澄ました。
    小妖たち「大王さま。」
    二人の大王は杯を止めた。二人の大王「戻ったか。」
    小妖たち「戻りました。」
    大王たちはまた尋ねた。「孫行者は捕らえたか。」
    小妖たちは頭を地につけるばかりで、声も出せない。金角大王がまた尋ねても、返事もできず、ただ額ずく。幾度も問われ、小妖たちは地に伏して申し立てた。
    小妖たち「幾重もの死罪を、どうかお許しください。どうか命をお助けください。私どもが宝を持って山の中腹まで行きますと、ふいに蓬萊山（ほうらいさん）の仙人に出会いました。どこへ行くのかと聞かれたので、『孫行者を捕らえに行きます』と答えました。仙人は孫行者の名を聞くと、自分もあいつが憎いから、力を貸そうと言いました。手伝ってもらいはしませんでしたが、宝で人を吸い込む仕組みを話してしまいました。仙人もひょうたんを持っていて、それは天を丸ごと入れられるのでした。私どもにも欲が出ましたが、こちらの家の足しにしたいという気持ちもあったのです。あちらは天を入れ、こちらは人を入れるのだから、取り換えようと思いました。初めはひょうたん同士を取り換える話でしたが、伶俐虫が浄瓶（じょうへい）まで添えてしまいました。まさか仙人の品が、俗人の手には触れられないものだとは思いもよりませんでした。試しているうちに、品も本人もいなくなったのです。どうか、私どもの死罪をお許しください。」
  "translation_status": "draft"
- "id": "xy-ch34-006"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老魔聽說，暴躁如雷道：「罷了，罷了，這就是孫行者假妝神仙騙哄去了。那猴頭神通廣大，處處人熟，不知那個毛神放他出來，騙去寶貝。」二魔道：「兄長息怒。叵耐那猴頭著然無禮，既有手段，便走了也罷，怎麼又騙寶貝？我若沒本事拿他，永不在西方路上為怪。」老魔道：「怎生拿他？」二魔道：「我們有五件寶貝，去了兩件，還有三件，務要拿住他。」老魔道：「還有那三件？」二魔道：「還有七星劍與芭蕉扇在我身邊，那一條幌金繩，在壓龍山壓龍洞老母親那裡收著哩。如今差兩個小妖去請母親來吃唐僧肉，就教他帶幌金繩來拿孫行者。」老魔道：「差那個去？」二魔道：「不差這樣廢物去。」將精細鬼、伶俐蟲一聲喝起。二人道：「造化，造化，打也不曾打，罵也不曾罵，卻就饒了。」二魔道：「叫那常隨的伴當巴山虎、倚海龍來。」二人跪下，二魔吩咐道：「你卻要小心。」俱應道：「小心。」「卻要仔細。」俱應道：「仔細。」又問道：「你認得老奶奶家麼？」又俱應道：「認得。」「你既認得，你快早走動，到老奶奶處，多多拜上，說請吃唐僧肉哩；就著帶幌金繩來，要拿孫行者。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    金角大王は聞くや、雷のように怒りだした。金角大王「しまった、しまった。それは孫行者が仙人に化けて、だまし取ったのだ。あの猿は神通力が強く、どこへ行っても知り合いがいる。どこのつまらぬ神があいつを逃がし、宝をだまし取らせたのやら。」
    銀角大王「兄上、お怒りをお鎮めください。あの猿め、まったく無礼なやつです。術が使えるなら、そのまま逃げていけばよいものを、どうして宝までだまし取るのか。あいつを捕らえられなければ、俺は二度と西天（さいてん）への道で妖怪などやりません。」
    金角大王「どうやって捕らえる。」
    銀角大王「俺たちには宝が五つあります。二つ取られたが、まだ三つある。必ず捕らえてみせましょう。」
    金角大王「あと三つとは何だ。」
    銀角大王「七星剣（しちせいけん）と芭蕉扇（ばしょうせん）は俺の手元にあります。あの幌金縄（こうきんじょう）は、圧竜山（あつりゅうざん）の圧竜洞（あつりゅうどう）におられる母上がしまっておいでです。今、小妖を二匹遣わし、唐僧（とうそう）の肉を召し上がりに母上をお招きしましょう。そのとき幌金縄を持ってきていただき、孫行者を捕らえるのです。」
    金角大王「誰を遣わす。」
    銀角大王「こんな役立たずには行かせません。」
    銀角大王は一喝して、精細鬼と伶俐虫を立たせた。
    二匹の小妖「ありがたい、ありがたい。打たれもせず、罵られもせず、許していただけた。」
    銀角大王「いつもそばに仕えている巴山虎（はざんこ）と倚海竜（いかいりゅう）を呼べ。」
    二匹がひざまずくと、銀角大王は言いつけた。銀角大王「よく用心するのだぞ。」
    二匹の使い「用心いたします。」
    銀角大王「よく気をつけるのだぞ。」
    二匹の使い「気をつけます。」
    銀角大王「おばあさまの家は分かるな。」
    二匹の使い「分かります。」
    銀角大王「分かるなら、早く出かけろ。おばあさまのところへ着いたら、くれぐれもよろしくと申し上げ、唐僧の肉を召し上がりにお招きすると伝えるのだ。それから、孫行者を捕らえるので、幌金縄をお持ちくださるよう頼め。」
  "translation_status": "draft"
- "id": "xy-ch34-007"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二怪領命疾走。怎知那行者在傍，一一聽得明白。他展開翅，飛將去，趕上巴山虎，釘在他身上。行經二三里，就要打殺他兩個。又思道：「打死他，有何難事？但他奶奶身邊有那幌金索，又不知住在何處，等我且問他一問再打。」好行者，嚶的一聲，躲離小妖，讓他先行有百十步。卻又搖身一變，也變做個小妖兒，戴一頂狐皮帽子，將虎皮裙子倒插上來勒住，趕上道：「走路的，等我一等。」那倚海龍回頭問道：「是那裡來的？」行者道：「好哥啊，連自家人也認不得？」小妖道：「我家沒有你。」行者道：「怎麼沒我？你再認認我。」小妖道：「面生，面生，不曾相會。」行者道：「正是。你們不曾會著我，我是外班的。」小妖道：「外班長官，是不曾會。你往那裡去？」行者道：「大王說差你二位請老奶奶來吃唐僧肉，教他就帶幌金繩來，拿孫行者。恐你二位走得緩，有些貪頑，誤了正事，又差我來催你們快去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    二匹の使いは命令を受け、急いで出かけた。悟空がそばにいて、一部始終を聞いていたとは知るよしもない。悟空は羽を広げて飛び、巴山虎に追いつくと、その体にぴたりと止まった。二、三里行ったところで、二匹を打ち殺そうとしたが、考え直した。
    悟空は心の中で言った。「こいつらを殺すぐらい、何でもない。だが、あのおばあさまが幌金縄を持っているし、住んでいる場所も分からん。先に尋ねてから殺そう。」
    悟空はぶんと飛び立ち、小妖たちから離れて、百歩あまり先へ行かせた。それから体を揺すり、自分も小妖に変わった。狐皮の帽子をかぶり、虎皮の腰巻きを裏返して締めつけ、追いかけて声をかけた。悟空「そこの二人、ちょっと待ってくれ。」
    倚海竜が振り返って尋ねた。倚海竜「どこから来た。」
    悟空「おい兄弟、身内の者の顔も忘れたのか。」
    倚海竜「うちにお前のようなやつはいない。」
    悟空「いないとは何だ。もう一度、よく俺を見てくれ。」
    倚海竜「見覚えがない。会ったことはないぞ。」
    悟空「そのとおり。お前たちとはまだ会っていない。俺は外勤の組の者だ。」
    倚海竜「外勤のお役人なら、会ったことはないな。どこへ行くんだ。」
    悟空「大王がおっしゃるには、お前たち二人を、おばあさまに唐僧の肉をご馳走するための迎えに出し、孫行者を捕らえる幌金縄も持ってきていただくよう命じたそうだ。だが、お前たちがのろのろ歩いたり、遊びに気を取られたりして、大事な用をしくじっては困る。そこで俺を遣わし、早く行くようせき立てさせたのさ。」
  "translation_status": "draft"
- "id": "xy-ch34-008"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小妖見說著海底眼，更不疑惑，把行者果認做一家人。急急忙忙，往前飛跑，一氣又跑有八九里。行者道：「忒走快了些。我們離家有多少路了？」小怪道：「有十五六里了。」行者道：「還有多遠？」倚海龍用手指道：「烏林子裡就是。」行者擡頭見一帶黑林不遠，料得那老怪只在林子裡外。卻立定步，讓那小怪前走。即取出鐵棒，走上前，著腳後一刮。可憐忒不禁打，就把兩個小妖刮做一團肉餅。卻拖著腳，藏在路傍深草科裡。即便拔下一根毫毛，吹口仙氣，叫：「變！」變做個巴山虎，自身卻變做個倚海龍。假妝做兩個小妖，徑往那壓龍洞請老奶奶。這叫做七十二變神通大，指物騰那手段高。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    小妖たちは、内輪の大事なところまで言い当てるのを聞き、もう疑いもせず、本当に悟空を仲間だと思い込んだ。慌ただしく前へ駆けだし、一息にまた八、九里走った。
    悟空「少し速すぎるな。家からどれほど来たんだ。」
    小妖たち「十五、六里だ。」
    悟空「あとどれほどだ。」
    倚海竜は手で指した。倚海竜「あの暗い林の中だ。」
    悟空は顔を上げ、黒々とした林がもう遠くないのを見て、老母の妖怪は林の中かそのすぐ近くにいると見当をつけた。そこで足を止めて二匹を先へ行かせると、鉄棒を取り出し、前へ出て、後ろから足もとを一払いした。哀れにも、ひどく打たれ弱い二匹で、その一撃でひと塊の肉餅になってしまった。悟空は二匹の足をつかんで引きずり、道端の深い草むらに死体を隠した。すぐに毛を一本抜き、仙気を吹きかけ、悟空「変われ！」と叫んで巴山虎に変え、自分は倚海竜の姿になった。こうして二匹の小妖に見せかけ、まっすぐ圧竜洞へ、おばあさまを迎えに向かった。まさしく、七十二変（しちじゅうにへん）の神通力は大きく、物を指して姿を変える手並みは見事なものだった。
  "translation_status": "draft"
- "id": "xy-ch34-009"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三五步，跳到林子裡。正找尋處，只見有兩扇石門，半開半掩，不敢擅入。只得洋叫一聲：「開門！開門！」早驚動那把門的一個女怪，將那半扇兒開了，道：「你是那裡來的？」行者道：「我是平頂山蓮花洞裡差來請老奶奶的。」女怪道：「進去。」到了二層門下，閃著頭，往裡觀看，又見那正當中坐著一個老媽媽兒。你道他怎生模樣？但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    三歩、五歩と跳んで林へ入った。辺りを捜すと、二枚の石の扉が半ば開き、半ば閉じている。勝手に入るわけにはいかず、大声で呼んだ。悟空「開けてくれ、開けてくれ。」
    門番の女妖が気づき、片方の扉を開けた。門番の女妖「どこから来たの。」
    悟空「平頂山（へいちょうざん）の蓮花洞（れんげどう）から、おばあさまをお迎えに遣わされた者です。」
    門番の女妖「お入り。」
    二の門まで来て、頭をのぞかせて奥を見ると、真正面に一人の老婆が座っていた。どんな姿かというと、こうである。
  "translation_status": "draft"
- "id": "xy-ch34-010"
  "section_id": "chapter-34"
  "kind": "verse"
  "origin": "source"
  "source_text": "雪鬢蓬鬆，星光晃亮。臉皮紅潤皺文多，牙齒稀疏神氣壯。貌似花殘霜裡色，形如松老雨餘顏。頭纏白練攢絲帕，耳墜黃金嵌寶環。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    雪のような鬢髪はふさふさと乱れ、星のような目はきらきら光る。
    顔色は赤くつややかだが皺は多く、歯はまばらでも気力は盛ん。
    顔立ちは霜の中でしおれた花に似て、姿は雨上がりの老松のよう。
    頭には糸飾りのついた白絹の頭巾を巻き、耳には宝石をはめた黄金の輪を下げていた。
  "translation_status": "draft"
- "id": "xy-ch34-011"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖見了，不敢進去，只在二門外仵著臉，脫脫的哭起來，你道他哭怎的，莫成是怕他？就怕也便不哭，況先哄了他的寶貝，又打死他的小妖，卻為何而哭？他當時曾下九鼎油鍋，就煠了七八日，也不曾有一點淚兒。只為想起唐僧取經的苦惱，他就淚出痛腸，放眼便哭。心卻想道：「老孫既顯手段，變做小妖，來請這老怪，沒有個直直的站了說話之理，一定見他磕頭才是。我為人做了一場好漢，止拜了三個人：西天拜佛祖；南海拜觀音；兩界山師父救了我，我拜了他四拜。為他使碎六葉連肝肺，用盡三毛七孔心。一卷經能值幾何？今日卻教我去拜此怪。若不跪拜，必定走了風汛。苦啊！算來只為師父受困，故使我受辱於人。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    悟空はその姿を見ると、すぐには入れず、二の門の外で顔をしかめ、はらはらと涙をこぼした。なぜ泣いたのか、怖くなったのかと思われよう。怖くなったとしても、泣くような男ではない。まして、すでに相手の宝をだまし取り、使いの小妖も打ち殺している。それなのに、なぜ泣くのか。かつて九つの大釜の煮え油へ入れられ、七、八日揚げられたときにも、涙一つこぼさなかったのだ。ただ、三蔵（さんぞう）の取経のために受ける苦労を思い返すと、腹の底から痛みがこみ上げ、目いっぱいに涙があふれたのである。
    悟空は心の中で言った。「俺は術を使い、小妖に化けて、あの年寄りの妖怪を迎えに来た。まっすぐ立ったまま話すわけにはいかず、会えば必ず額ずかねばなるまい。俺も男らしく生きてきたが、拝んだ相手は三人だけだ。西天で仏祖（ぶっそ）を拝み、南海（なんかい）で観音菩薩（かんのんぼさつ）を拝み、両界山（りょうかいざん）でお師匠さまに助けられたとき、四度礼拝した。お師匠さまのためには、六つに分かれた肺も肝も砕き、三本の毛と七つの穴を持つ心臓も使い尽くすほどに働いてきた。経巻一巻に、いったいどれほどの値打ちがあるというんだ。今日は、この妖怪にまで頭を下げさせられる。だが、ひざまずかなければ、化けたことがばれる。つらいものだ。結局、お師匠さまが捕らわれたばかりに、俺までこんな辱めを受けるのか。」
  "translation_status": "draft"
- "id": "xy-ch34-012"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "到此際也沒及奈何，撞將進去，朝上跪下道：「奶奶磕頭。」那怪道：「我兒，起來。」行者暗道：「好好好，叫得結實！」老怪問道：「你是那裡來的？」行者道：「平頂山蓮花洞，蒙二位大王有令，差來請奶奶去吃唐僧肉，教帶幌金繩，要拿孫行者哩。」老怪大喜道：「好孝順的兒子。」就去叫擡出轎來。行者道：「我的兒啊，妖精也擡轎？」後壁廂即有兩個女怪擡出一頂香藤轎，放在門外，掛上青絹緯幔。老怪起身出洞，坐在轎裡。後有幾個小女妖捧著減粧，端著鏡架，提著手巾，托著香盒，跟隨左右。那老怪道：「你們來怎的？我往自家兒子去處，愁那裡沒人伏侍，要你們去獻勤塌嘴？都回去，關了門看家。」那幾個小妖果俱回去，止有兩個擡轎的。老怪問道：「那差來的叫做甚麼名字？」行者連忙答應道：「他叫做巴山虎，我叫做倚海龍。」老怪道：「你兩個前走，與我開路。」行者暗想道：「可是晦氣，經倒不曾取得，且來替他做皂隸。」卻又不敢抵強，只得向前引路，大四聲喝起。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    ここまで来ては仕方がない。悟空は中へ入り、老婆に向かってひざまずいた。悟空「おばあさま、お辞儀を申し上げます。」
    老母の妖怪「お前、立ちなさい。」
    悟空はひそかに思った。「よしよし、まんまと子供扱いしてくれるな。」
    老母の妖怪「どこから来たのだい。」
    悟空「平頂山の蓮花洞から、二人の大王のお言いつけで参りました。唐僧の肉を召し上がりにお招きし、孫行者を捕らえるために幌金縄をお持ちいただくようにとのことです。」
    老母の妖怪は大いに喜んだ。老母の妖怪「なんと親孝行な子たちだろう。」
    すぐに輿（こし）を出すよう命じた。悟空はつぶやいた。「まったく、妖怪まで輿に乗るとはな。」
    奥から二人の女妖が香りのよい藤で編んだ輿を担ぎ出し、門の外へ置いて、青い絹の帳を掛けた。老母の妖怪は立ち上がって洞を出、輿へ乗り込んだ。あとには幾人かの小さな女妖が、化粧道具の箱を抱え、鏡台を持ち、手拭いを提げ、香の箱をささげて、左右に付き従った。
    老母の妖怪「お前たちまで何しに来る。私は自分の息子の家へ行くんだよ。世話をする者がいないとでもいうのかい。お前たちに、余計なお愛想を言ってつきまとってもらう必要はない。みんな帰って、門を閉めて留守番をしなさい。」
    小さな女妖たちは言われたとおり戻り、輿を担ぐ二人だけが残った。
    老母の妖怪「迎えに来た二人は、何という名だい。」
    悟空はすぐに答えた。悟空「あちらが巴山虎、私は倚海竜です。」
    老母の妖怪「お前たち二人は先へ行き、私の道をあけなさい。」
    悟空は心で思った。「ついていない。経はまだ手にも入らんのに、こいつの先払いの下役を務めるのか。」
    だが逆らうわけにもいかず、前へ出て案内し、四声高く先払いの声を張り上げた。
  "translation_status": "draft"
- "id": "xy-ch34-013"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行了五六里遠近，他就坐在石崖上，等候那擡轎的到了，行者道：「略歇歇如何？壓得肩頭疼啊。」小怪那知甚麼訣竅，就把轎子歇下。行者在轎後，胸脯上拔下一根毫毛，變做一個大燒餅，抱著啃。轎夫道：「長官，你吃的是甚麼？」行者道：「不好說。這遠的路，來請奶奶，沒些兒賞賜，肚裡饑了，原帶來的乾糧，等我吃些兒再走。」轎夫道：「把些兒我們吃吃。」行者笑道：「來麼，都是一家人，怎麼計較？」那小妖不知好歹，圍住行者，分其乾糧。被行者掣出棒，著頭一磨：一個搪著的，打得稀爛；一個擦著的，不死還哼。那老怪聽得人哼，轎子裡伸出頭來看時，被行者跳到轎前，劈頭一棍，打了個窟窿，腦漿迸流，鮮血直冒。拖出轎來看處，原是個九尾狐狸。行者笑道：「造孽畜，叫甚麼老奶奶。你叫老奶奶，就該稱老孫做上太祖公公是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    五、六里ほど行くと、悟空は岩場に腰を下ろし、輿担ぎが追いつくのを待った。悟空「少し休まないか。肩に食い込んで痛むだろう。」
    小妖たちは仕掛けがあるとも知らず、輿を下ろした。悟空は輿の後ろで、胸の毛を一本抜いて大きな焼餅（しょうへい）に変え、抱えてかじった。
    輿担ぎ「役人さん、何を食べているんだい。」
    悟空「言いにくいがね。こんな遠くまでおばあさまを迎えに来たのに、褒美も何もない。腹が減ったんで、持ってきた弁当を食べているのさ。少し食べてから行こう。」
    輿担ぎ「私たちにも少しおくれ。」
    悟空は笑った。悟空「来なよ。同じ家の仲間じゃないか。けちなことを言うものか。」
    小妖たちは善し悪しも分からず、悟空を囲んで弁当を分けてもらおうとした。すると悟空は棒を抜き、頭をめがけて一振りした。まともに受けた一人はぐしゃぐしゃに打ち砕かれ、かすった一人はまだ死なずにうめいた。老母の妖怪はその声を聞き、輿から首を出して見ようとした。悟空は輿の前へ跳び、一棒を頭から打ち下ろした。頭には穴があき、脳漿がほとばしり、鮮血が噴き出した。輿から引きずり出してみると、その正体は九尾の狐だった。
    悟空は笑った。悟空「悪さばかりする畜生め、何がおばあさまだ。お前がおばあさまなら、俺はその上のご先祖の大爺さまだろうが。」
  "translation_status": "draft"
- "id": "xy-ch34-014"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好猴王，把他那幌金繩搜出來，籠在袖裡，歡喜道：「那潑魔縱有手段，已此三件兒寶貝姓孫了。」卻又拔兩根毫毛變做個巴山虎、倚海龍；又拔兩根變做兩個擡轎的；他卻變做老奶奶模樣，坐在轎裡。將轎子擡起，徑回本路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空はその幌金縄を捜し出し、袖へ収めて喜んだ。悟空「あの妖怪どもにどれほど腕があろうと、これで宝は三つとも孫家の物だ。」
    また毛を二本抜き、巴山虎と倚海竜に変え、もう二本抜いて、二人の輿担ぎに変えた。自分は老母の妖怪そっくりの姿になって輿へ乗った。輿を担がせ、そのまま来た道を戻っていった。
  "translation_status": "draft"
- "id": "xy-ch34-015"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，到了蓮花洞口，那毫毛變的小妖俱在前道：「開門！開門！」內有把門的小妖開了門道：「巴山虎、倚海龍來了？」毫毛道：「來了。」「你們請的奶奶呢？」毫毛用手指道：「那轎內的不是？」小怪道：「你且住，等我進去先報。」報道：「大王，奶奶來耶。」兩個魔頭聞說，即命排香案來接。行者聽得，暗喜道：「造化，也輪到我為人了。我先變小妖，去請老怪，磕了他一個頭；這番來，我變老怪，是他母親，定行四拜之禮，雖不怎的，好道也賺他兩個頭兒。」好大聖，下了轎子，抖抖衣服，把那四根毫毛收在身上。那把門的小妖把空轎擡入門裡。他卻隨後徐行，那般嬌嬌啻啻，扭扭捏捏，就像那老怪的行動，徑自進去。又只見大小群妖，都來跪接。鼓樂簫韶，一派響喨；博山爐裡，靄靄香煙。他到正廳中，南面坐下。兩個魔頭，雙膝跪倒，朝上叩頭，叫道：「母親，孩兒拜揖。」行者道：「我兒起來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    ほどなく蓮花洞の入口へ着くと、毛から作った小妖たちが前に立って呼んだ。毛から作った小妖たち「開けろ、開けろ。」
    中の門番の小妖が門を開けた。門番の小妖「巴山虎、倚海竜、戻ったか。」
    毛から作った小妖たち「戻ったぞ。」
    門番の小妖「迎えに行ったおばあさまは。」
    毛から作った小妖たちは手で指した。「あの輿の中にいらっしゃるじゃないか。」
    門番の小妖「ちょっと待て。先に報告してくる。」
    小妖は中へ知らせた。門番の小妖「大王さま、おばあさまがいらっしゃいました。」
    金角大王と銀角大王はそれを聞き、すぐに香を供える台を並べて出迎えるよう命じた。悟空は聞いて、ひそかに喜んだ。
    悟空は心の中で言った。「ありがたい。今度は俺が上に立つ番だ。さっきは小妖に化けて年寄りを迎えに行き、一度頭を下げた。今度は俺が年寄り、つまりこいつらの母親に化けている。あいつらは必ず四度の礼をする。たいしたことではないにせよ、二つほどお辞儀を得する勘定だ。」
    悟空は輿から下り、服をはたいて、四本の毛を体へ戻した。門番の小妖が空の輿を門の中へ運び入れると、悟空はそのあとをゆっくりと歩いた。しなを作って、もじもじと体を揺らし、老母の妖怪の動作そっくりに奥へ入る。大小の妖怪たちがみなひざまずいて迎えた。太鼓や笛の晴れやかな音楽が、辺りいっぱいに鳴り響き、博山炉（はくさんろ）からは香煙がもうもうと立ち上った。悟空は正面の広間へ進み、南を向いて座った。二人の大王は両膝をつき、母の姿へ向かって額ずいた。
    二人の大王「母上、子らがお辞儀を申し上げます。」
    悟空「お前たち、立ちなさい。」
  "translation_status": "draft"
- "id": "xy-ch34-016"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說豬八戒吊在梁上，哈哈的笑了一聲。沙僧道：「二哥，好啊，吊出笑來也。」八戒道：「兄弟，我笑中有故。」沙僧道：「甚故？」八戒道：「我們只怕是奶奶來了，就要蒸吃。原來不是奶奶，是舊話來了。」沙僧道：「甚麼舊話？」八戒笑道：「弼馬溫來了。」沙僧道：「你怎麼認得是他？」八戒道：「彎倒腰，叫『我兒起來』，那後面就掬起猴尾巴子。我比你吊得高，所以看得明也。」沙僧道：「且不要言語，聽他說甚麼話。」八戒道：「正是，正是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    さて、梁に吊られていた八戒（はっかい）が、はははと笑った。
    沙悟浄（さごじょう）「二番目の兄貴、これはたいしたものだ。吊られているのに笑えるのですか。」
    八戒「弟よ、俺が笑うのには訳がある。」
    沙悟浄「どんな訳です。」
    八戒「俺たちは、おばあさまが来れば、すぐ蒸されて食われると思っていた。ところが、来たのはおばあさまじゃない。昔なじみさ。」
    沙悟浄「昔なじみとは。」
    八戒は笑って言った。八戒「弼馬温（ひつばおん）が来たんだ。」
    沙悟浄「どうしてあの人だと分かったのです。」
    八戒「腰をかがめて『お前たち、立ちなさい』と言ったとき、後ろで猿の尻尾がぴょいと上がった。俺はお前より高く吊られているから、はっきり見えたのさ。」
    沙悟浄「今はしゃべらず、何を言うか聞きましょう。」
    八戒「そうだ、そうだ。」
  "translation_status": "draft"
- "id": "xy-ch34-017"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那孫大聖坐在中間，問道：「我兒，請我來有何事幹？」魔頭道：「母親啊，連日兒等少禮，不曾孝順得。今早愚兄弟拿得東土唐僧，不敢擅吃，請母親來獻獻生，好蒸與母親吃了延壽。」行者道：「我兒，唐僧的肉，我倒不吃。聽見有個豬八戒的耳朵甚好，可割將下來，整治整治，我下酒。」那八戒聽見慌了道：「遭瘟的，你來為割我耳朵的，我喊出來不好聽啊。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    真ん中に座った悟空が尋ねた。悟空「お前たち、何の用で私を呼んだのだい。」
    一方の大王「母上、ここ幾日も礼を欠き、孝行もできませんでした。今朝、私ども兄弟が東土（とうど）の唐僧を捕らえましたが、勝手に食べるわけにはまいりません。そこで母上をお招きして、生きたままお目にかけたのち、蒸して召し上がっていただき、寿命を延ばしていただこうと思ったのです。」
    悟空「お前たち、私は唐僧の肉は別に食べたくないよ。猪八戒（ちょはっかい）という者の耳が、とてもうまいと聞いた。それを切り落として料理し、私の酒の肴にしておくれ。」
    八戒は聞いて慌てた。八戒「この疫病神め、俺の耳を切りに来たのか。俺が大声でばらしたら、具合が悪いだろう。」
  "translation_status": "draft"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "噫！只為獃子一句通情話，走了猴王變化的風。那裡有幾個巡山的小怪，把門的眾妖，都撞將進來，報道：「大王，禍事了！孫行者打殺奶奶，他妝來耶。」魔頭聞此言，那容分說，掣七星寶劍，望行者劈面砍來。好大聖，將身一幌，只見滿洞紅光，預先走了。似這般手段，著實好耍子。正是那聚則成形，散則成氣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    ああ、八戒が事情を知っていると示す一言で、悟空が化けている秘密は漏れてしまった。ちょうどそこへ、山を巡回していた小妖や門番の妖怪たちが駆け込んできた。
    小妖たち「大王、一大事です。孫行者がおばあさまを打ち殺し、化けて来たのです。」
    それを聞いた一方の大王は、言い訳も聞かず、七星宝剣（しちせいほうけん）を抜き、悟空の顔をめがけて斬りかかった。悟空は体を一揺すりする。洞いっぱいに赤い光が広がったかと思うと、もう先に逃げていた。こんな術なら、まったく愉快に遊べるものだ。まさしく、集まれば形をなし、散れば気となるのである。
  "translation_status": "draft"
- "id": "xy-ch34-019"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "諕得個老魔頭魂飛魄散，眾群精噬指搖頭。老魔道：「兄弟，把唐僧與沙僧、八戒、白馬、行李都送還那孫行者，閉了是非之門罷。」二魔道：「哥哥，你說那裡話？我不知費了多少辛勤，施這計策，將那和尚都攝將來。如今似你這等怕懼孫行者的詭譎，就俱送去還他，真所謂畏刀避劍之人，豈大丈夫之所為也？你且請坐勿懼。我聞你說孫行者神通廣大，我雖與他相會一場，卻不曾與他比試。取披掛來，等我尋他交戰三合。假若他三戰勝我不過，唐僧還是我們之食；如三戰我不能勝他，那時再送唐僧與他未遲。」老魔道：「賢弟說得是。」教取披掛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    金角大王は魂も消し飛ぶほど驚き、群れの妖怪たちは指を噛み、頭を振った。
    金角大王「弟よ、三蔵と沙悟浄、八戒、白馬、荷物をみな孫行者に返し、厄介事の入り口を閉めてしまおう。」
    銀角大王「兄上、何をおっしゃるのです。俺がどれほど苦労して策をめぐらし、あの和尚どもをここへ連れてきたと思うのですか。今になって、兄上のように孫行者の悪知恵を恐れ、何もかも返してしまうとは。それでは刀を恐れ剣を避ける腰抜けそのもの、立派な男のすることでしょうか。どうぞ座って、怖がらずにいてください。孫行者は神通力が強いと兄上から聞いております。俺は一度あいつに会いましたが、まだ腕比べはしていません。鎧兜を持ってこさせてください。俺が出ていって、三合、打ち合ってみましょう。三度戦ってもあいつが俺に勝てなければ、唐僧はやはり俺たちの食い物です。三度戦って俺が勝てなければ、そのとき唐僧を返しても遅くありません。」
    金角大王「弟よ、そのとおりだ。」
    金角大王は鎧兜を持ってくるよう命じた。
  "translation_status": "draft"
- "id": "xy-ch34-020"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾妖擡出披掛，二魔結束齊整，執寶劍，出門外，叫聲：「孫行者，你往那裡走了？」此時大聖已在雲端裡，聞得叫他名字，急回頭觀看，原來是那二魔。你看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    妖怪たちは鎧兜を運んできた。銀角大王はきちんと身を固め、宝剣を持って門の外へ出ると、声を張り上げた。銀角大王「孫行者、どこへ行った。」
    このとき悟空は、すでに雲の上にいた。名を呼ばれて急いで振り返ると、銀角大王だった。そのいでたちをご覧いただこう。
  "translation_status": "draft"
- "id": "xy-ch34-021"
  "section_id": "chapter-34"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭戴鳳盔欺臘雪，身披戰甲幌鑌鐵。
    腰間帶是蟒龍觔，粉皮靴靿梅花摺。
    顏如灌口活真君，貌比巨靈無二別。
    七星寶劍手中擎，怒氣沖霄威烈烈。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 147
    "line_end": 150
  "translation_ja": |-
    頭に戴く鳳凰の兜は師走の雪にも勝る白さ、身にまとう戦の鎧は鍛えた鉄をきらきらと輝かせる。
    腰の帯は大蛇のような竜の筋、白革の長靴の筒には梅の花のひだ。
    顔は灌口（かんこう）の真君（しんくん）が生きて現れたようで、姿も巨霊神（きょれいしん）と少しも変わらぬ。
    七星宝剣を手に掲げ、怒気は空を突き、威風は烈々と満ちていた。
  "translation_status": "draft"
- "id": "xy-ch34-022"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二魔高叫道：「孫行者，快還我寶貝與我母親來，我饒你唐僧取經去。」大聖忍不住罵道：「這潑怪物，錯認了你孫外公。趕早兒送還我師父、師弟、白馬、行囊，仍打發我些盤纏，往西走路；若牙縫裡道半個『不』字，就自家搓根繩兒去罷，也免得你外公動手。」二魔聞言，急縱雲，跳在空中，掄寶劍來刺；行者掣鐵棒劈面相迎。他兩個在半空中，這場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    銀角大王は大声で叫んだ。銀角大王「孫行者、早く俺の宝と母上を返せ。そうすれば唐僧を許して、経を取りに行かせてやる。」
    悟空はこらえきれず罵った。悟空「このろくでなしめ、お前の孫爺さまを見誤ったな。早く俺の師と弟弟子、白馬、旅の荷物を返し、そのうえ西へ行く路銀も少しよこせ。歯の隙間からでも、いやだと半言も漏らしてみろ。自分で縄をなって首でもくくれ。そうすれば、この爺さまが手を下さずに済む。」
    銀角大王はそれを聞くと、ただちに雲に乗って空へ跳び上がり、宝剣を振るって突きかかった。悟空も鉄棒を抜き、顔をめがけて迎え撃つ。二人は空中で戦った。まったく見事な争いである。
  "translation_status": "draft"
- "id": "xy-ch34-023"
  "section_id": "chapter-34"
  "kind": "verse"
  "origin": "source"
  "source_text": "棋逢對手，將遇良才。棋逢對手難藏興，將遇良才可用功。那兩員神將相交，好便似南山虎鬥，北海龍爭。龍爭處，鱗甲生輝；虎鬥時，爪牙亂落。爪牙亂落撒銀鉤，鱗甲生輝支鐵葉。這一個翻翻復復，有千般解數；那一個來來往往，無半點放閑。金箍棒，離頂門只隔三分；七星劍，向心窩惟爭一蹍。那個威風逼得斗牛寒，這個怒氣勝如雷電險。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    碁には好敵手、将には腕の立つ相手。
    碁打ちは好敵手に出会えば興を隠せず、将は強い敵に当たれば腕を振るえる。
    二人の神将がぶつかるさまは、南の山の虎の闘い、北の海の竜の争いさながら。
    竜の争うところ鱗は輝き、虎の闘うとき爪と牙は乱れ飛ぶ。
    乱れ飛ぶ爪牙は銀の鉤をまき散らし、輝く鱗は鉄の葉を突き出すよう。
    一方は縦横に身を翻し、千通りもの技を繰り出す。
    一方は行きつ戻りつ、片時も手を休めない。
    金箍棒は頭のてっぺんから、わずか三分（ぶ）のところをかすめ、
    七星剣は胸の急所まで、あとほんの一踏みのところへ迫る。
    あちらの威風は斗牛（とぎゅう）の星々まで震え上がらせ、こちらの怒気は雷電にも勝るすさまじさ。
  "translation_status": "draft"
- "id": "xy-ch34-024"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個戰了有三十回合，不分勝負。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 156
    "line_end": 156
  "translation_ja": "二人は三十合ほど戦ったが、勝負はつかなかった。"
  "translation_status": "draft"
- "id": "xy-ch34-025"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者暗喜道：「這潑怪倒也架得住老孫的鐵棒。我已得了他三件寶貝，卻這般苦苦的與他廝殺，可不誤了我的工夫？不若拿葫蘆或淨瓶裝他去，多少是好？」又想道：「不好，不好。常言道：『物隨主便。』倘若我叫他不答應，卻又不誤了事業？且使幌金繩扣頭罷。」好大聖，一隻手使棒，架住他的寶貝；一隻手把那繩執起，刷喇的扣了魔頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    悟空はひそかに喜んだ。悟空は心の中で言った。「この妖怪、俺の鉄棒を受け止めるだけの腕はあるな。だが、俺はもう宝を三つも手に入れた。それなのに、こんな苦しい斬り合いを続けていては、時間の無駄ではないか。ひょうたんか浄瓶に吸い込んでしまうほうが、どれほどいいか。」
    だが、また考えた。悟空は心の中で言った。「いや、いかん。よく『物は持ち主の思うまま』と言う。俺が名を呼んでも、あいつが返事をしなかったら、かえってしくじることになる。ひとまず幌金縄を頭へかけてやろう。」
    悟空は片手で棒を使って相手の宝剣を受け止め、もう片方の手に縄をつかむと、しゃっと大王へかけた。
  "translation_status": "draft"
- "id": "xy-ch34-026"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那魔頭有個緊繩咒，有個鬆繩咒。若扣住別人，就念緊繩咒，莫能得脫；若扣住自家人，就念鬆繩咒，不得傷身。他認得是自家的寶貝，即念鬆繩咒，把繩鬆動，便脫出來，反望行者拋將去，卻早扣住了大聖。大聖正要使「瘦身法」，想要脫身，卻被那魔念動緊繩咒，緊緊扣住，怎能得脫？褪至頸項之下，原是一個金圈子套住。那怪將繩一扯，扯將下來，照光頭上砍了七八寶劍。行者頭皮兒也不曾紅了一紅。那魔道：「這猴子，你這等頭硬，我不砍你；且帶你回去，再打你。將我那兩件寶貝趁早還我。」行者道：「我拿你甚麼寶貝，你問我要？」那魔頭將身上細細搜檢，卻將那葫蘆、淨瓶都搜出來。又把繩子牽著，帶至洞裡道：「兄長，拿將來了。」老魔道：「拿了誰來？」二魔道：「孫行者。你來看，你來看。」老魔一見，認得是行者，滿面喜笑道：「是他，是他。把他長長的繩兒拴在柱科上耍子。」真個把行者拴住，兩個魔頭卻進後面堂裡飲酒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    実は銀角大王は、緊縄呪（きんじょうじゅ）と鬆縄呪（しょうじょうじゅ）という二つの呪文を知っていた。他人を捕らえたときは、縄を締める緊縄呪を唱えれば誰も逃げられず、身内が捕らわれたときは、縄を緩める鬆縄呪を唱えれば、体を傷つけずに済む。銀角大王は自分の宝だと分かると、すぐに鬆縄呪を唱えた。縄が緩むと抜け出し、逆に悟空へ投げ返して、たちまち捕らえてしまった。
    悟空は痩身法（そうしんほう）を使い、身を細めて抜け出そうとしたが、銀角大王が緊縄呪を唱えて固く締めつけるので、どうして逃げられよう。縄は首の下までずり落ち、そこを金の輪となって囲んだ。銀角大王は縄を一引きして悟空を地上へ引き下ろすと、むき出しの頭へ宝剣を七、八度打ちつけた。ところが、悟空の頭皮は少し赤くなることさえなかった。
    銀角大王「この猿、なんと固い頭だ。もう斬ってはやらん。ひとまず連れ帰り、それから打ってやる。俺の宝二つを、早く返せ。」
    悟空「何の宝を俺が取ったというんだ。何を返せという。」
    銀角大王は体を隅々まで調べ、ひょうたんと浄瓶を両方とも取り出した。それから縄を引き、洞へ連れ戻した。銀角大王「兄上、捕らえてきました。」
    金角大王「誰を捕らえた。」
    銀角大王「孫行者です。ご覧ください、ご覧ください。」
    金角大王は一目見て悟空だと分かり、満面に笑みを浮かべた。金角大王「こいつだ、こいつだ。長い縄で柱に結びつけて、おもちゃにしてやれ。」
    本当に悟空を縛りつけると、二人の大王は奥の広間へ入って、酒を飲んだ。
  "translation_status": "draft"
- "id": "xy-ch34-027"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖在柱根下爬蹉，忽驚動八戒。那獃子吊在梁上，哈哈的笑道：「哥哥啊，耳朵吃不成了。」行者道：「獃子，可吊得自在麼？我如今就出去，管情救了你們。」八戒道：「不羞，不羞。本身難脫，還想救人。罷罷罷，師徒們都在一處死了，好到陰司裡問路。」行者道：「不要胡說，你看我出去。」八戒道：「我看你怎麼出去？」那大聖口裡與八戒說話，眼裡卻抹著那兩個妖怪。見他在裡邊吃酒，有幾個小妖拿盤拿盞，執壺釃酒，不住的兩頭亂跑，關防的略鬆了些兒。他見面前無人，就弄神通：順出棒來，吹口仙氣，叫：「變！」即變做一個純鋼的銼兒；扳過那頸項的圈子，三五銼，銼做兩段。拔開銼口，脫將出來。拔了一根毫毛，叫變做一個假身，拴在那裡。真身卻幌一幌，變做個小妖，立在旁邊。八戒又在梁上喊道：「不好了，不好了，拴的是假貨，吊的是正身。」老魔停杯便問：「那豬八戒吆喝的是甚麼？」行者已變做小妖，上前道：「豬八戒攛道孫行者教變化走了罷，他不肯走，在那裡吆喝哩。」二魔道：「還說豬八戒老實，原來這等不老實，該打二十多嘴棍。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    悟空が柱の根もとで身をよじっていると、八戒が気づいた。梁に吊られた八戒は、はははと笑った。
    八戒「兄貴、耳は食べ損ねたな。」
    悟空「この間抜けめ、吊られ心地はいいか。俺は今すぐ出ていく。必ずお前たちも助けてやる。」
    八戒「よく恥ずかしくもなく言えるもんだ。自分も逃げられないのに、人を助ける気か。もういい、もういい。師匠も弟子も一緒に死のう。そうすりゃ冥府で道を尋ねるのにも都合がいい。」
    悟空「馬鹿を言うな。俺が出ていくところを見ていろ。」
    八戒「どうやって出ていくのか、見てやろうじゃないか。」
    悟空は口では八戒と話しながら、目では二人の大王の様子をうかがっていた。二人は奥で酒を飲み、小妖が幾匹か、皿や杯を持ち、酒壺を手に酌をしながら、ひっきりなしに行き来している。そのため見張りは少し手薄になっていた。
    目の前に誰もいないのを見ると、悟空は神通力を使った。棒を抜き出して仙気を吹きかけ、悟空「変われ！」と叫ぶと、棒は鋼だけでできた鑢になった。首の輪を引き寄せ、三度五度と削って、二つに切った。切り口を押し開いて抜け出し、毛を一本抜くと、偽物の自分の姿に変えて、そこへ縛りつけておいた。本物の悟空は体を揺すって小妖に変わり、そばへ立った。
    八戒はまた梁の上から叫んだ。八戒「大変だ、大変だ。縛ってあるのは偽物、吊ってあるのは本物だ。」
    金角大王は杯を止めて尋ねた。金角大王「あの猪八戒は何をわめいている。」
    小妖に変わっていた悟空は、前へ進んだ。悟空「猪八戒が孫行者に、術で化けて逃げろとけしかけております。それでも逃げようとしないので、あそこでわめいているのです。」
    銀角大王「猪八戒は実直だというが、こんなにたちが悪いとは。余計な口をきいた罰に、棒で二十打ち食らわせてやれ。」
  "translation_status": "draft"
- "id": "xy-ch34-028"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者就去拿條棍來打。八戒道：「你打輕些兒；若重了些兒，我又喊起，我認得你。」行者道：「老孫變化，也只為你們，你怎麼倒走了風息？這一洞裡妖精，都認不得，怎的偏你認得？」八戒道：「你雖變了頭臉，還不曾變得屁股，那屁股上兩塊紅不是？我因此認得是你。」行者隨往後面，演到廚中，鍋底上摸了一把，將兩臀擦黑，行至前邊。八戒看見，又笑道：「那個猴子去那裡混了這一會，弄做個黑屁股來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    悟空はすぐに棒を持ってきて、八戒を打とうとした。
    八戒「軽く打ってくれ。強く打ったら、また叫んでやる。お前の正体は分かっているんだぞ。」
    悟空「俺が姿を変えたのも、お前たちのためだ。それなのに、どうして秘密を漏らす。洞の妖怪は誰も気づかないのに、どうしてお前だけが俺だと分かるんだ。」
    八戒「頭も顔も変えたが、尻はまだ変えていないじゃないか。尻の左右に赤いところが二つあるだろう。それでお前だと分かったのさ。」
    悟空はすぐに奥へ行き、台所へ紛れ込んだ。鍋の底をひと撫でし、煤で左右の尻を黒く塗ってから、また前へ出てきた。八戒はそれを見て、また笑った。
    八戒「あの猿、今しがたどこへ紛れ込んでいたんだ。黒い尻になって戻ってきたぞ。」
  "translation_status": "draft"
- "id": "xy-ch34-029"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者仍站在跟前，要偷他寶貝。真個甚有見識：走上廳，對那怪扯個腿子道：「大王，你看那孫行者拴在柱上，左右爬蹉，磨壞那根金繩，得一根粗壯些的繩子換將下來才好。」老魔道：「說得是。」即將腰間的獅蠻帶解下，遞與行者。行者接了帶，把假妝的行者拴住。換下那條繩子，一窩兒窩兒籠在袖內。又拔一根毫毛，吹口仙氣，變作一根假幌金繩，雙手送與那怪。那怪只因貪酒，那曾細看，就便收下。這個是大聖騰那弄本事，毫毛又換幌金繩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    悟空はまた大王たちのそばへ立ち、宝を盗もうとした。さすがに知恵が回る。広間へ上がると、片足を引いて礼をした。
    悟空「大王さま、ご覧ください。孫行者が柱に縛られたまま、左右へもぞもぞ動いて、あの金の縄を擦り切らしてしまいます。もっと太く丈夫な縄を持ってきて、取り換えるのがよろしゅうございます。」
    金角大王「そのとおりだ。」
    すぐに腰の獅蛮帯（しばんたい）をほどき、悟空へ渡した。悟空は帯を受け取り、偽物の悟空を縛り直した。取り外した縄は、くるくると巻いて袖へ収めた。また毛を一本抜き、仙気を吹きかけ、偽物の幌金縄に変えて、両手で大王へ差し出した。金角大王は酒に夢中で、よく見るはずもなく、そのまま受け取った。これこそ、悟空が変化の術を振るい、毛でまたも幌金縄を取り換えたというものだ。
  "translation_status": "draft"
- "id": "xy-ch34-030"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "得了這件寶貝，急轉身跳出門外，現了原身，高叫：「妖怪！」那把門的小妖問道：「你是甚人，在此呼喝？」行者道：「你快早進去報與你那潑魔，說者行孫來了。」那小妖如言報告，老魔大驚道：「拿住孫行者，又怎麼有個者行孫？」二魔道：「哥哥，怕他怎的？寶貝都在我手裡，等我拿那葫蘆出去，把他裝將來。」老魔道：「兄弟仔細。」二魔拿了葫蘆，走出山門，忽看見與孫行者模樣一般，只是略矮些兒。問道：「你是那裡來的？」行者道：「我是孫行者的兄弟，聞說你拿了我家兄，卻來與你尋事的。」二魔道：「是我拿了，鎖在洞中。你今既來，必要索戰。我也不與你交兵，我且叫你一聲，你敢應我麼？」行者道：「可怕你叫上千聲，我就答應你萬聲！」那魔執了寶貝，跳在空中，把底兒朝天，口兒朝地，叫聲：「者行孫。」行者卻不敢答應，心中暗想道：「若是應了，就裝進去哩。」那魔道：「你怎麼不應我？」行者道：「我有些耳閉，不曾聽見。你高叫。」那怪物又叫聲：「者行孫。」行者在底下掐著指頭算了一算，道：「我真名字叫做孫行者，起的鬼名字叫做者行孫。真名字可以裝得，鬼名字好道裝不得。」卻就忍不住應了他一聲。颼的被他吸進葫蘆去，貼上帖兒。原來那寶貝，那管甚麼名字真假，但綽個應的氣兒，就裝了去也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    この宝を手に入れると、悟空はさっと身を返し、門の外へ跳び出して、本来の姿を現した。悟空「妖怪ども！」
    門番の小妖が尋ねた。門番の小妖「何者だ、ここで何を怒鳴っている。」
    悟空「早く中へ行って、あのろくでなしどもに伝えろ。者行孫（しゃぎょうそん）が来たとな。」
    小妖はそのとおり知らせた。金角大王は大いに驚いた。金角大王「孫行者を捕らえたというのに、どうしてまた者行孫というやつが来たのだ。」
    銀角大王「兄上、何を恐れることがありましょう。宝は全部、俺の手の中です。ひょうたんを持って出て、そいつも吸い込んできます。」
    金角大王「弟よ、用心しろ。」
    銀角大王はひょうたんを持って山門を出た。見ると、孫行者とそっくりで、少し背が低いだけの者がいる。
    銀角大王「どこから来た。」
    悟空「俺は孫行者の弟だ。兄を捕らえたと聞き、喧嘩を売りに来た。」
    銀角大王「なるほど、俺が捕らえ、洞に閉じ込めてある。来たからには、戦いを挑むつもりだろう。だが、俺は武器を交えぬ。ひと声お前を呼んでみるが、返事をする度胸はあるか。」
    悟空「怖いものか。千度呼ぶなら、万度返事をしてやる。」
    銀角大王は宝を持って空へ跳び上がり、底を天へ、口を地へ向けて呼んだ。銀角大王「者行孫。」
    悟空は返事をしかね、心で思った。「返事をしたら、吸い込まれてしまう。」
    銀角大王「どうして返事をしない。」
    悟空「少し耳が詰まっていて、聞こえなかった。もっと大きな声で呼べ。」
    銀角大王はもう一度呼んだ。銀角大王「者行孫。」
    悟空は下で指を折って考えた。悟空はつぶやいた。「俺の本当の名は孫行者で、今でっち上げた名は者行孫だ。本名なら吸い込めても、偽名では吸い込めまい。」
    とうとう我慢できずに、一声返事をしてしまった。すると、ひゅうっとひょうたんに吸い込まれ、札で封じられた。そもそもその宝に、名前の真偽など関係はない。返事をする息をつかみさえすれば、吸い込んでしまうのだった。
  "translation_status": "draft"
- "id": "xy-ch34-031"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖到他葫蘆裡，渾然烏黑。把頭往上一頂，那裡頂得動，且是塞得甚緊，卻才心中焦躁道：「當時我在山上遇著那兩個小妖，他曾告訴我說：不拘葫蘆、淨瓶，把人裝在裡面，只消一時三刻，就化為膿了，敢莫化了我麼？」一條心又想著道：「沒事，化不得我。我老孫五百年前大鬧天宮，被太上老君放在八卦爐中煉了四十九日，煉成個金子心肝，銀子肺腑，銅頭鐵背，火眼金睛，那裡一時三刻就化得我？且跟他進去，看他怎的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    悟空がひょうたんの中へ入ると、辺りは真っ暗だった。頭で上を押してみても、少しも動かせず、栓はひどく固く詰められていた。そこで初めて、心が焦りだした。
    悟空は心の中で言った。「あのとき山で会った二匹の小妖は、こう教えてくれた。ひょうたんでも浄瓶でも、中へ人を入れれば、一時三刻（いちじさんこく）ほどで膿に溶けると。まさか俺も溶けてしまうのか。」
    だが、もう一方ではこう考えた。悟空は心の中で言った。「大丈夫、俺は溶かせない。五百年前に天宮で大暴れしたとき、太上老君（たいじょうろうくん）の八卦炉（はっけろ）へ放り込まれ、四十九日も練られたのだ。それで金の心肝、銀の肺腑、銅の頭、鉄の背、火眼金睛（かがんきんせい）の目になった。どうして一時三刻で俺が溶けるものか。ひとまずこいつについて中へ入り、どうするか見てやろう。」
  "translation_status": "draft"
- "id": "xy-ch34-032"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二魔拿入裡面道：「哥哥，拿來了。」老魔道：「拿了誰？」二魔道：「者行孫是我裝在葫蘆裡也。」老魔歡喜道：「賢弟，請坐。不要動，只等搖得響再揭帖兒。」行者聽得道：「我這般一個身子，怎麼便搖得響？只除化成稀汁，才搖得響是。等我撒泡溺罷，他若搖得響時，一定揭帖起蓋，我乘空走他娘罷。」又思道，「不好，不好。溺雖可響，只是污了這直裰。等他搖時，我但聚些唾津漱口，稀漓呼喇的，哄他揭開，老孫再走罷。」大聖作了準備，那怪貪酒不搖。大聖作個法，意思只是哄他來搖，忽然叫道：「天呀！孤拐都化了。」那魔也不搖。大聖又叫道：「娘啊！連腰截骨都化了。」老魔道：「化至腰時，都化盡矣，揭起帖兒看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    銀角大王はひょうたんを中へ持ち込んだ。銀角大王「兄上、捕らえてきました。」
    金角大王「誰を捕らえた。」
    銀角大王「者行孫をひょうたんに入れました。」
    金角大王は喜んだ。金角大王「弟よ、座れ。動かすことはない。振って音がするようになってから、札を剥がそう。」
    悟空は聞いて考えた。悟空は心の中で言った。「俺はこんなに形のある体なのに、振ってどうして音がする。さらさらの汁に溶けたなら、音がするだろうが。よし、小便をしてやろう。振って音がすれば、きっと札を剥がして蓋を開ける。その隙に、さっさと逃げてやれ。」
    だが、また考えた。悟空は心の中で言った。「いや、いかん。小便なら音はするが、この僧衣まで汚してしまう。こいつが振ったときに唾をため、口をぶくぶくすすげばいい。ちゃぷちゃぷ音を立てて開けさせ、俺は逃げよう。」
    悟空は用意をしたが、銀角大王は酒に気を取られて、ひょうたんを振らない。そこで一計を案じ、振るように仕向けるつもりで、突然叫んだ。悟空「ああ、大変だ。くるぶしがもう溶けてしまった。」
    それでも振らない。悟空はまた叫んだ。悟空「助けてくれ。腰の骨まで溶けたぞ。」
    金角大王「腰まで溶けたなら、もうすっかり溶けただろう。札を剥がして見てみよう。」
  "translation_status": "draft"
- "id": "xy-ch34-033"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖聞言，就拔了一根毫毛，叫：「變！」變作個半截的身子，在葫蘆底上。真身卻變做個蟭蟟蟲兒，釘在那葫蘆口邊。只見那二魔揭起帖子看時，大聖早已飛出。打個滾，又變做個倚海龍。倚海龍卻是原去請老奶奶的那個小妖，他變了，站在旁邊。那老魔扳著葫蘆口張了一張，見是個半截身子動耽，他也不認真假，慌忙叫：「兄弟，蓋上，蓋上，還不曾化得了哩。」二魔依舊貼上。大聖在傍暗笑道：「不知老孫已在此矣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    悟空は聞くと、毛を一本抜いて、悟空「変われ！」と叫んだ。毛は半分だけ残った体になり、ひょうたんの底へ置かれた。本物の悟空は蟭蟟虫（しょうりょうちゅう）というごく小さな虫に化け、ひょうたんの口の縁へぴたりとついた。銀角大王が札を剥がしてのぞこうとしたときには、悟空はもう飛び出していた。一転すると、また倚海竜の姿に変わった。倚海竜というのは、もともと老母を迎えに行った、あの小妖である。悟空はその姿でそばに立った。
    金角大王はひょうたんの口を引き寄せ、中をちょっとのぞいた。半分残った体が動いているのを見ると、本物か偽物かも確かめず、慌てて叫んだ。金角大王「弟よ、蓋をしろ、蓋をしろ。まだ溶けきっておらん。」
    銀角大王はまた元どおりに札を貼った。悟空はそばで、ひそかに笑った。
    悟空は心の中で言った。「俺がもうここにいるとも知らずにな。」
  "translation_status": "draft"
- "id": "xy-ch34-034"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老魔拿了壺，滿滿的斟了一杯酒，近前雙手遞與二魔道：「賢弟，我與你遞個鍾兒。」二魔道：「兄長，我們已吃了這半會酒，又遞甚鍾？」老魔道：「你拿住唐僧、八戒、沙僧猶可，又索了孫行者，裝了者行孫，如此功勞，該與你多遞幾鍾。」二魔見哥哥恭敬，怎敢不接，但一隻手托著葫蘆，一隻手不敢去接，卻把葫蘆遞與倚海龍，雙手去接杯。不知那倚海龍是孫行者變的。你看他端葫蘆，慇懃奉侍。二魔接酒吃了，也要回奉一杯。老魔道：「不消回酒，我這裡陪你一杯罷。」兩人只管謙遜。行者頂著葫蘆，眼不轉睛，看他兩個左右傳杯，全無計較，他就把個葫蘆揌入衣袖。拔根毫毛，變個假葫蘆，一樣無二，捧在手中。那魔遞了一會酒，也不看真假，一把接過寶貝。各上席，安然坐下，依然飲酒。孫大聖撤身走過，得了寶貝，心中暗喜道：「饒這魔頭有手段，畢竟葫蘆還姓孫。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    金角大王は酒壺を取り、杯いっぱいに注ぐと、前へ出て両手で銀角大王へ差し出した。金角大王「弟よ、お前に一杯ささげよう。」
    銀角大王「兄上、もうずいぶん酒を飲んでいるのに、今さらなぜ改まって杯を。」
    金角大王「唐僧、八戒、沙悟浄を捕らえただけならまだしも、孫行者を縛り上げ、そのうえ者行孫まで吸い込んだ。これほどの手柄なら、何杯でも酒をささげてやらねばなるまい。」
    銀角大王は兄が丁重に勧めるので、断れるはずもない。だが片手でひょうたんを持っていて、もう片手だけで杯を受けるのは失礼だ。そこでひょうたんを倚海竜の姿の悟空へ渡し、両手で杯を受け取った。倚海竜が悟空の化けた姿だとは知らなかったのである。悟空はひょうたんを捧げ持ち、いかにもまめまめしく仕えていた。
    銀角大王は酒を受けて飲むと、返杯をしようとした。金角大王「返杯はいらん。俺もここで一杯付き合おう。」
    二人はしきりに譲り合った。悟空はひょうたんを頭に載せたまま、まばたきもせずに見張った。二人が左右で杯をやり取りし、こちらをまるで気にしていないのを見ると、ひょうたんを袖の中へ押し込んだ。毛を一本抜いて、本物と少しも違わぬ偽物のひょうたんに変え、手に持った。銀角大王はしばらく杯をやり取りしてから、本物かどうかも見ずに、ひとつかみに宝を受け取った。二人はそれぞれ席へ戻り、安心しきって腰を下ろし、また酒を飲み続けた。
    悟空は身を引いて立ち去った。宝を手に入れ、心の中で喜んだ。悟空は心の中で言った。「あの妖怪にどれほど腕があろうと、結局ひょうたんは、やはり孫家の物だ。」
  "translation_status": "draft"
- "id": "xy-ch34-035"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後怎麼施為，方得救師滅怪，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 170
    "line_end": 170
  "translation_ja": "はたして、このあとどんな手立てを用いれば、師を救い、妖怪を滅ぼせるのか。それは次の回でお聞きいただこう。"
  "translation_status": "draft"
- "id": "xy-ch34-note-01-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の「騰挪」には、底本が「一作『那』」、すなわち「挪」を「那」とする本もあると注記する。原文欄は異文注ごと保持し、回題の日本語では変化して立ち回る術という意味を訳した。"
  "translation_status": "draft"
- "id": "xy-ch34-note-02-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ひょうたんが消えた直後の「天呀！怎麼不見了？」には個人の発話者名がないため、二匹の間から上がった声として訳し、どちらか一匹に断定していない。「我推一句兒在你身上」は精細鬼が伶俐虫に責任を寄せて話す意に採った。"
  "translation_status": "draft"
- "id": "xy-ch34-note-03-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「小妖」の報告は個人名を明記しないため、小妖たちの報告として訳した。伶俐虫が浄瓶を添えたという言い方から精細鬼が中心に話している可能性はあるが、本文で名を断定しない。「仙家之物，近不得凡人之手」は小妖たちの言い訳であり、語り手が認める宝の性質ではない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-04-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "幌金繩と幌金索は同じ宝の縄を指すため、通常の日本語名は幌金縄に統一した。原文欄の異なる表記は保存する。外班は外勤の組と解したが、具体的な官庁・官職へは同定しない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-05-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "九つの油釜、七、八日、礼拝した三人、師への四拝は、この回の語りと悟空の主張のまま保存した。別の回の経歴と独自に整合させない。「六葉連肝肺、三毛七孔心」は古い身体観を用い、心身を使い尽くす労苦を言う誇張として訳した。現代医学の説明ではない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-06-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「減粧」は化粧道具を収める箱の意に採った。字体を「減妝」などへ訂正していない。「大四聲喝起」は底本の四という数を保持し、先払いの声を四声高く上げると訳したが、慣用的な発声法を指す可能性もあり、特定の儀礼へは同定しない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-07-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "休憩を勧める「壓得肩頭疼啊」は、担ぎ手の肩への負担を言うものと解した。悟空が自分で輿を担いでいたという動作は補わない。担ぎ手の一人は打ち砕かれ、かすった一人はまだうめいており、二人とも即死したとは訳していない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-08-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空の勘定は、先の一拝、これからの四拝、「二つのお辞儀を得する」という底本の数をそのまま保持した。算術上の整合のために数を改めない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-09-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八戒の「舊話」は直後に弼馬温と明かされるため、過去を持ち出して悟空をからかう「昔なじみ」と訳した。話という物が実際に来たとは扱わない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-10-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この返答の主語「魔頭」は、二人のどちらかを明記しない。母への応対を一方の大王の発言として訳し、金角大王・銀角大王の一方へ固定していない。次の斬撃も、剣の所持だけで話者・動作者を確定しない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-11-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "銀角大王の「三合」は武器を交える回数として三合と訳し、「三戰」は三度戦うと訳した。教育部《重編國語辭典修訂本》「合」は交手の回数を数える単位と説明する。後に三十合ほど戦うという地の文と数が違うが、予告の三と実戦の三十を独自に整合させない。勝敗に応じて捕虜を返すという条件の順序も保持した。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=3968&word=%3D%E5%90%88"
  "translation_status": "draft"
- "id": "xy-ch34-note-12-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「蟒龍觔」は大蛇のような竜の筋を帯にする形容として、「粉皮靴靿」は白い革の靴の筒として訳した。「灌口活真君」は灌江口の二郎真君に似るとの比喩で、実際に真君がこの場へ現れたという意味にはしない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-13-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「一蹍」の蹍は足で踏む意の字で、教育部《異體字字典》もその義を示す。ここでは急所まであと一踏みという間隔の比喩として訳したが、一定の長さの単位とは断定しない。三分は長さとして保持する。参照：https://dict.variants.moe.edu.tw/dictView.jsp?ID=72360"
  "translation_status": "draft"
- "id": "xy-ch34-note-14-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "首の縄は底本が「金圈子」と説明するため金の輪として訳した。鑢で二つに切った後、縄として回収される展開を独自に修理・再生の説明で補っていない。七、八回の宝剣の打撃で頭皮も赤くならない描写を保持した。"
  "translation_status": "draft"
- "id": "xy-ch34-note-15-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「二十多嘴棍」は「二十」と、余計な口をきいた者への「多嘴棍」とに分け、二十打ちの罰と訳した。「二十数回」へ機械的に切らない。"
  "translation_status": "draft"
- "id": "xy-ch34-note-16-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「一時三刻」は短い間をいう慣用表現として読み、時間と刻の字数をそのまま現代の時・分へ換算しない。五百年前、四十九日の炉での修行と身体の性質は、悟空自身の回想として保持する。"
  "translation_status": "draft"
- "id": "xy-ch34-note-17-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「孤拐」は足のくるぶしの意に採った。教育部《重編國語辭典修訂本》は頬骨と足首の両義を挙げ、『西遊記』の用例も示す。この場面は腰まで溶ける演技に続くため、下肢の意味に解した。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=70836&la=0&powerMode=0"
  "translation_status": "draft"
- "id": "xy-ch34-note-18-body"
  "section_id": "chapter-34"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「蟭蟟蟲」は底本の字を保持し、虫の大小と飛翔の文脈を優先した。蝉類を指す語でもあるが、現代の特定の昆虫種に決めず、ごく小さな虫として訳した。"
  "translation_status": "draft"

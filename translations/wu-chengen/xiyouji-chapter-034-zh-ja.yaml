  "source_text": "卻說那兩個小妖將假葫蘆拿在手中，爭看一會，忽擡頭不見了行者。伶俐蟲道：「哥啊，神仙也會打誑語。他說換了寶貝，度我等成仙，怎麼不辭就去了？」精細鬼道：「我們相應便宜的多哩，他敢去得成？拿過葫蘆來，等我裝裝天，也試演試演看。」真個把葫蘆往上一拋，撲的就落將下來。慌得個伶俐蟲道：「怎麼不裝？不裝？莫是孫行者假變神仙，將假葫蘆換了我們的真的去耶？」精細鬼道：「不要胡說，孫行者是那三座山壓住了，怎生得出？拿過來，等我念他那幾句咒兒裝了看。」這怪也把葫蘆兒望空丟起，口中念道：「若有半聲不肯，就上靈霄殿上，動起刀兵。」念不了，撲的又落將下來。兩妖道：「不裝，不裝，一定是個假的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、二匹の小妖は偽物のひょうたんを手に取り、しばらく奪い合うように眺めていたが、ふと顔を上げると悟空（ごくう）の姿がなかった。
    伶俐虫（れいりちゅう）「兄貴、仙人も嘘をつくのかい。宝を取り換えたら俺たちを仙人にしてやると言ったのに、どうして挨拶もせずに行っちまったんだろう。」
    精細鬼（せいさいき）「俺たちのほうが、うんと得をしたんだ。あいつにうまく持ち逃げなんぞできるものか。ひょうたんを貸せ。天を入れて、俺もひとつ試してみよう。」
    本当にひょうたんを上へ放り投げてみたが、ぽとりと落ちてきた。伶俐虫は慌てた。
    伶俐虫「どうして入らない。入らないぞ。もしや孫行者（そんぎょうじゃ）が仙人に化けて、偽物のひょうたんと俺たちの本物を取り換えたんじゃないか。」
    精細鬼「馬鹿を言うな。孫行者はあの三つの山の下敷きになっている。どうやって抜け出せるものか。貸してみろ。あいつの唱えた呪文を言って、天を入れてみよう。」
    この小妖もひょうたんを空へ放り投げ、口の中で唱えた。精細鬼「少しでも嫌だと言うなら、霊霄殿（れいしょうでん）へ乗り込んで、戦を起こしてやるぞ。」
    唱え終わらないうちに、ひょうたんはまたぽとりと落ちてきた。
    二匹の小妖「入らない、入らない。これはきっと偽物だ。」
  "translation_status": "draft"
- "id": "xy-ch34-003"
  "section_id": "chapter-34"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正嚷處，孫大聖在半空裡聽得明白，看得真實，恐怕他弄得時辰多了，緊要處走了風汛，將身一抖，把那變葫蘆的毫毛收上身來，弄得那兩個妖四手皆空。精細鬼道：「兄弟，拿葫蘆來。」伶俐蟲道：「你拿著的。」「天呀！怎麼不見了？」都去地下亂摸，草裡胡尋，吞袖子，揣腰間，那裡得有？二妖嚇得呆呆掙掙道：「怎的好？怎的好？當時大王將寶貝付與我們，教拿孫行者。今行者既不曾拿得，連寶貝都不見了，我們怎敢去回話？這一頓直直的打死了也。怎的好！怎的好！」伶俐蟲道：「我們走了罷。」精細鬼道：「往那裡走麼？」伶俐蟲道：「不管那裡走罷。若回去說沒寶貝，斷然是送命了。」精細鬼道：「不要走，還回去。二大王平日看你甚好，我推一句兒在你身上。他若肯將就，留得性命；說不過，就打死，還在此間。莫弄得兩頭不著。去來，去來。」那怪商議了，轉步回山。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch34-1500614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第034回&oldid=1500614"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    二匹が騒いでいる間、悟空は宙からその声をはっきり聞き、様子もつぶさに見ていた。いつまでもいじられていては、肝心なところで秘密が漏れかねないと思い、体を一振りして、ひょうたんに変えた毛を自分の体へ呼び戻した。二匹の四本の手には、何も残らなかった。
    精細鬼「兄弟、ひょうたんをよこせ。」
    伶俐虫「そっちが持っているじゃないか。」
    二匹の小妖の間から声が上がった。「何てことだ。どうして消えちまったんだ。」
    二匹とも地面を手探りし、草むらをむやみに捜し、袖を探り、腰のあたりをまさぐったが、どこにあるはずもない。すっかりおびえ、呆然として言った。
    二匹の小妖「どうしよう、どうしよう。大王は宝を預けて、孫行者を捕らえてこいと命じられた。それが、孫行者は捕らえられず、宝までなくしてしまった。どうして戻って報告できよう。今度ばかりは、本当に打ち殺されるぞ。どうしよう、どうしよう。」
    伶俐虫「逃げよう。」
    精細鬼「どこへ逃げるんだ。」
    伶俐虫「どこだっていいから逃げよう。戻って宝をなくしたと言えば、間違いなく命はない。」
    精細鬼「逃げるのはよそう。やはり戻ろう。二の大王さまはいつもお前をかわいがってくださる。俺から一言、お前に責任をかぶせるように話しておく。大目に見てくだされば命は助かる。言い訳が通らず打ち殺されても、ここにいられる。どちらにも行き場がなくなるようなまねはよそう。さあ行こう、行こう。」
    二匹はそう相談をまとめ、向きを変えて山へ戻った。
  "translation_status": "draft"

    "source_text": "刮得那三藏馬上難存，八戒不敢仰視，沙僧低頭掩面。孫大聖情知是怪物弄風，急縱步來趕時，那怪已騁風頭，將唐僧攝去了，無蹤無影，不知攝向何方，無處跟尋。"

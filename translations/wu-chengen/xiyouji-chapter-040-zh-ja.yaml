        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 167
        "line_end": 167
    "translation_ja": "吹きつける風に、三蔵は馬上にとどまれず、八戒も顔を上げられず、沙悟浄はうつむいて顔を覆った。悟空は妖怪が風を起こしていると分かり、急いで跳び走って追いつこうとしたが、妖怪はすでに風に乗って三蔵をさらっていた。影も形も消え、どちらへ連れ去られたのかも分からず、捜しようがなかった。"
    "translation_status": "draft"
  - "id": "xy-ch40-031"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一時間，風聲暫息，日色光明。行者上前觀看，只見白龍馬戰兢兢發喊聲嘶，行李擔丟在路下，八戒伏於崖下呻吟，沙僧蹲在坡前叫喚。行者喊：「八戒。」那獃子聽見是行者的聲音，卻擡頭看時，狂風已靜，爬起來，扯住行者道：「哥哥，好大風啊！」沙僧卻也上前道：「哥哥，這是一陣旋風。」又問：「師父在那裡？」八戒道：「風來得緊，我們都藏頭遮眼，各自躲風，師父也伏在馬上的。」行者道：「如今卻往那裡去了？」沙僧道：「是個燈草做的，想被一風捲去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      やがて風の音がひとまず収まり、日の光が明るく戻った。悟空が前へ出て見ると、白竜馬（はくりゅうば）は震えながら悲鳴のようないななきを上げ、荷担ぎの荷物は道の脇へ投げ出されていた。八戒は崖の下に伏せてうめき、沙悟浄は斜面の前にしゃがんで声を上げていた。
      悟空「八戒！」
      八戒は悟空の声だと聞きつけ、顔を上げてみると、激しい風はもうやんでいた。起き上がって悟空をつかみ、言った。
      八戒「兄貴、すごい風だったなあ！」
      沙悟浄もやって来て言った。
      沙悟浄「兄さん、あれは旋風でした。」
      そしてまた尋ねた。
      沙悟浄「お師匠さまはどちらです。」
      八戒「風が急に襲ってきたんで、俺たちは頭を隠して目を覆い、めいめい風を避けていた。お師匠さまも馬の上に伏せておられたよ。」
      悟空「それなら今は、どこへ行かれたんだ。」
      沙悟浄「灯心草（とうしんそう）でできてでもおられたのでしょうか。ひと吹きで巻き上げられてしまったようです。」
    "translation_status": "draft"
  - "id": "xy-ch40-032"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「兄弟們，我等自此就該散了。」八戒道：「正是，趁早散了，各尋頭路，多少是好。那西天路無窮無盡，幾時能到得？」沙僧聞言，打了一個失驚，渾身麻木道：「師兄，你都說的是那裡話？我等因為前生有罪，感蒙觀世音菩薩勸化，與我們摩頂受戒，改換法名，皈依佛果，情願保護唐僧上西方拜佛求經，將功折罪。今日到此，一旦俱休，說出這等各尋頭路的話來，可不違了菩薩的善果，壞了自己的德行，惹人恥笑，說我們有始無終也？」行者道：「兄弟，你說的也是，奈何師父不聽人說。我老孫火眼金睛，認得好歹。才然這風，是那樹上吊的孩兒弄的。我認得他是個妖精，你們不識，那師父也不識，認作是好人家兒女，教我馱著他走。是老孫算計要擺佈他，他就弄個重身法壓我。是我將他摜得粉碎。他想是又使解屍之法，弄陣旋風，把我師父攝去也。因此上怪他每每不聽我說，故我意懶心灰，說各人散了。既是賢弟有此誠意，教老孫進退兩難。──八戒，你端的要怎的處？」八戒道：「我才自失口亂說了幾句，其實也不該散。哥哥，沒及奈何，還信沙弟之言，去尋那妖怪救師父去。」行者卻回嗔作喜道：「兄弟們，還要來結同心，收拾了行李、馬匹，上山找尋怪物，搭救師父去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空「兄弟、俺たちもここで別れることになりそうだな。」
      八戒「そうだな。早いところ別れて、それぞれ身の振り方を探すほうが、いくらかましだ。西天への道は果てしもない。いつになったら着けるんだ。」
      沙悟浄はそれを聞いてぎくりとし、全身がしびれるほど驚いて言った。
      沙悟浄「兄さんたち、いったい何をおっしゃるのです。私たちは前の世で罪を犯しましたが、観世音菩薩（かんぜおんぼさつ）にありがたくも教え導かれ、頭をなでて戒めを授けていただき、法名を改め、仏の悟りに帰依しました。そして唐僧を守って西方（さいほう）へ行き、仏を拝んで経を求め、功を積んで罪を償おうと、自分から願ったのです。今日ここまで来て、いっぺんにすべてをやめ、それぞれ別の道を探そうなどと言ってよいのでしょうか。菩薩の善いお導きに背き、自分の徳を損ない、始めるばかりで最後までやり遂げないと、人に笑われるではありませんか。」
      悟空「弟よ、お前の言うことももっともだ。だが、お師匠さまは人の言うことを聞いてくださらない。俺には火眼金睛（かがんきんせい）があって、善し悪しを見分けられる。さっきの風は、あの木に吊られていた子供が起こしたんだ。俺は妖怪だと分かっていたが、お前たちも師匠も見抜けず、まともな家の子だと思い込み、俺に背負っていけと言った。俺が始末してやろうと考えると、あいつは体を重くする術で押し潰そうとしてきた。それで俺がたたきつけて粉々にしたんだ。どうやらあいつはまた体を抜け殻にする術を使い、旋風を起こして師匠をさらっていったらしい。そうやって何度も俺の言うことを聞いてくださらないのが腹立たしくて、気がくじけ、心が冷めて、皆で別れようと言ったのさ。だが弟よ、お前がそんなに真心を持っているとあっては、俺も進むにも退くにも困る。……八戒、お前は本当のところ、どうしたいんだ。」
      八戒「さっきは口が滑って、いい加減なことを言った。やっぱり別れちゃいけないよ。兄貴、仕方がないじゃないか。弟の沙悟浄の言うことを聞いて、妖怪を捜し、師匠を助けに行こう。」
      悟空は怒りを喜びに変えて言った。
      悟空「兄弟、もう一度心を一つにしよう。荷物と馬をまとめ、山へ入って妖怪を捜し、師匠を助けに行くぞ。」
    "translation_status": "draft"
  - "id": "xy-ch40-033"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三個人附葛扳藤，尋坡轉澗，行經有五七十里，卻也沒個音信。那山上飛禽走獸全無，老柏喬松常見。孫大聖著實心焦，將身一縱，跳上那巔嶮峰頭，喝一聲叫：「變！」變作三頭六臂，似那大鬧天宮的本像。將金箍棒幌一幌，變作三根金箍棒，劈哩撲辣的，往東打一路，往西打一路，兩邊不住的亂打。八戒見了道：「沙和尚，不好了，師兄是尋不著師父，惱出氣心風來了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      三人は葛や藤にすがり、斜面をたどり、谷を巡って、五十里から七十里ほども進んだが、何の手がかりもなかった。山では鳥や獣もまったく見えず、古い柏と高い松ばかりが目についた。悟空はひどく焦り、ひと跳びで険しい峰の頂へ上がり、叫んだ。
      悟空「変われ！」
      三つの頭と六本の腕に変じ、天宮（てんきゅう）で大暴れしたときの姿になった。金箍棒をひと振りして三本に変え、ばりばり、どかどかと、東へ一筋、西へ一筋、両側を休みなく打ちまくった。八戒はそれを見て言った。
      八戒「沙悟浄、まずいぞ。兄貴は師匠が見つからないんで、腹を立てすぎて気がふれちまった。」
    "translation_status": "draft"
  - "id": "xy-ch40-034"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那行者打了一會，打出一夥窮神來，都披一片、掛一片，褌無襠、褲無口的跪在山前，叫：「大聖，山神、土地來見。」行者道：「怎麼就有許多山神、土地？」眾神叩頭道：「上告大聖：此山喚做六百里鑽頭號山。我等是十里一山神，十里一土地，共該三十名山神、三十名土地。昨日已此聞大聖來了，只因一時會不齊，故此接遲，致令大聖發怒，萬望恕罪。」行者道：「我且饒你罪名。我問你：這山上有多少妖精？」眾神道：「爺爺呀！只有得一個妖精，把我們頭也摩光了，弄得我們少香沒紙，血食全無，一個個衣不充身，食不充口，還吃得有多少妖精哩。」行者道：「這妖精在山前住，是山後住？」眾神道：「他也不在山前山後。這山中有一條澗，叫做枯松澗。澗邊有一座洞，叫做火雲洞。那洞裡有一個魔王，神通廣大，常常的把我們山神、土地拿了去，燒火頂門，黑夜與他提鈴喝號。小妖兒又討甚麼常例錢。」行者道：「汝等乃是陰鬼之仙，有何錢鈔？」眾神道：「正是沒錢與他，只得捉幾個山獐、野鹿，早晚間打點群精；若是沒物相送，就要來拆廟宇，剝衣裳，攪得我等不得安生。萬望大聖與我等剿除此怪，拯救山上生靈。」行者道：「你等既受他節制，常在他洞下，可知他是那裡妖精，叫做甚麼名字？」眾神道：「說起他來，或者大聖也知道。他是牛魔王的兒子，羅剎女養的。他曾在火燄山修行了三百年，煉成三昧真火，卻也神通廣大，牛魔王使他來鎮守號山。乳名叫做紅孩兒，號叫做聖嬰大王。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      悟空がしばらく打ち続けると、貧窮した神々が一群、追い立てられて出てきた。皆、ぼろ布を一枚まとい、また一枚ぶら下げ、下ばきには股もなく、ずぼんも縁の形がなくなるほどぼろぼろで、山の前にひざまずいた。
      神々「大聖（たいせい）さま、山神と土地神が参りました。」
      悟空「どうしてそんなにたくさん山神や土地神がいるんだ。」
      神々は頭を地面につけて答えた。
      山神と土地神たち「大聖さまに申し上げます。この山は六百里に及ぶ鑽頭号山（さんとうごうざん）と申します。十里ごとに山神が一人、十里ごとに土地神が一人おりまして、合わせて山神三十人、土地神三十人でございます。昨日すでに大聖さまがおいでになると聞いておりましたが、すぐには全員が集まれず、お迎えが遅くなって、お怒りを招いてしまいました。どうかお許しくださいませ。」
      悟空「ひとまずその罪は許してやろう。尋ねるが、この山にはどれほど妖怪がいる。」
      山神と土地神たち「ああ、大聖さま、たった一匹だけでも、私どもは頭がすり減るほどに苦しめられております。香も供えられず、紙銭（しせん）もなく、肉の供物もすっかり途絶え、皆、身を覆う着物も、口を満たす食べ物も足りません。このうえ幾匹もの妖怪に耐えられましょうか。」
      悟空「その妖怪は山の前に住んでいるのか、後ろに住んでいるのか。」
      山神と土地神たち「前でも後ろでもございません。山中に枯松澗という谷があり、そのほとりに火雲洞（かうんどう）という洞穴がございます。その洞穴に、たいへんな神通力を持つ魔王がいるのです。しょっちゅう私ども山神や土地神を捕まえていっては、火を焚かせ、門の番をさせ、夜には鈴を持って時刻を触れ回らせます。手下の妖怪まで、決まりの上納金をよこせと申すのです。」
      悟空「お前たちは霊魂の世界の仙人だろう。どんな金銭を持っているというんだ。」
      山神と土地神たち「おっしゃるとおり、渡せる金などございませんので、仕方なく山のノロジカや野鹿を何匹か捕まえ、朝な夕な、妖怪どもに贈って機嫌を取っております。何も渡す物がなければ、廟を壊し、着物をはぎ取りに来るので、私どもは安らかに暮らせません。大聖さま、どうかあの妖怪を退治し、この山で生きるものたちをお救いください。」
      悟空「お前たちはあいつに支配され、しょっちゅう洞穴へ行っているのなら、どこから来た妖怪で、何という名なのかも知っているか。」
      山神と土地神たち「あの者のことをお話しすれば、大聖さまもご存じかもしれません。牛魔王（ぎゅうまおう）の息子で、羅刹女（らせつにょ）が産んだ子でございます。かつて火焔山（かえんざん）で三百年修行し、三昧真火（さんまいしんか）を修めた、たいへんな神通力の持ち主です。牛魔王に、この号山（ごうざん）を守るよう遣わされました。幼名は紅孩児（こうがいじ）、号は聖嬰大王（せいえいだいおう）と申します。」
    "translation_status": "draft"
  - "id": "xy-ch40-035"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，滿心歡喜。喝退了土地、山神，卻現了本像，跳下峰頭，對八戒、沙僧道：「兄弟們放心，再不須思念，師父決不傷生，妖精與老孫有親。」八戒笑道：「哥哥莫要說謊。你在東勝神洲，他這裡是西牛賀洲，路程遙遠，隔著萬水千山，海洋也有兩道，怎的與你有親？」行者道：「剛才這夥人都是本境土地、山神，我問他妖怪的原因，他道是牛魔王的兒子，羅剎女養的，名字喚做紅孩兒，號聖嬰大王。想我老孫五百年前大鬧天宮時，遍遊天下名山，尋訪大地豪傑，那牛魔王曾與老孫結七弟兄。一般五六個魔王，止有老孫生得小巧，故此把牛魔王稱為大哥。這妖精是牛魔王的兒子，我與他父親相識，若論將起來，還是他老叔哩，他怎敢害我師父？我們趁早去來。」沙和尚笑道：「哥啊，常言道：『三年不上門，當親也不親』哩。你與他相別五六百年，又不曾往還杯酒，又沒有個節禮相邀，他那裡與你認甚麼親耶？」行者道：「你怎麼這等量人？常言道：『一葉浮萍歸大海，為人何處不相逢。』縱然他不認親，好道也不傷我師父。不望他相留酒席，必定也還我個囫圇唐僧。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      悟空はそれを聞くと、心いっぱいに喜びが湧いた。土地神と山神を声をかけて退かせ、もとの姿に戻り、峰から跳び下りて、八戒と沙悟浄に言った。
      悟空「兄弟、安心しろ。もう気に病むことはない。師匠は絶対に殺されないぞ。妖怪は俺の親戚なんだ。」
      八戒は笑った。
      八戒「兄貴、嘘を言うなよ。兄貴は東勝神洲（とうしょうしんしゅう）にいて、こいつがいるのは西牛賀洲（さいごかしゅう）だ。道のりは遠く、幾千もの山、幾万もの川を隔て、海だって二つもある。どうして親戚なんだ。」
      悟空「さっきの連中は皆、この土地の土地神と山神でな。妖怪の素性を聞くと、牛魔王の息子で羅刹女が産み、紅孩児という名で、聖嬰大王を号していると言ったんだ。思えば俺が五百年前に天宮で大暴れしたころ、天下の名山を巡り、各地の豪傑を訪ねて、あの牛魔王とは七人兄弟の契りを結んだ。ほかの五、六人はどれも魔王で、俺だけが小柄だったから、牛魔王をいちばん上の兄貴と呼んだのさ。この妖怪は牛魔王の息子で、俺はあいつの父親と知り合いだ。関係からいえば、俺はあいつのおじさんになる。どうして俺の師匠を害するものか。早く行こう。」
      沙悟浄は笑った。
      沙悟浄「兄さん、よく『三年訪ねなければ、親類でも親類ではなくなる』と言います。別れて五百年、六百年もたち、酒を酌み交わしにも行かず、節目の贈り物で付き合いもしなかったのですから、どうして向こうが親戚として認めてくれるでしょう。」
      悟空「なぜそう人を見くびるんだ。昔から『一葉の浮き草も大海へ帰る、人として生きれば、どこで再会しないことがあろう』と言うだろう。たとえ親戚と認めなくても、少なくとも師匠に危害は加えない。宴に招いてくれるとは期待しないが、きっと無傷の唐僧を返してくれるさ。」
    "translation_status": "draft"
  - "id": "xy-ch40-036"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三兄弟各辦虔心，牽著白馬，馬上馱著行李，找大路一直前進。無分晝夜，行了百十里遠近，忽見一松林，林中有一條曲澗，澗下有碧澄澄的活水飛流，那澗梢頭有一座石板橋，通著那廂洞府。行者道：「兄弟，你看那壁廂有石崖磷磷，想必是妖精住處了。我等從眾商議：那個管看守行李、馬匹？那個肯跟我過去降妖？」八戒道：「哥哥，老豬沒甚坐性，我隨你去罷。」行者道：「好，好。」教：「沙僧將馬匹、行李俱潛在樹林深處，小心守護，待我兩個上門去尋師父耶。」那沙僧依命。八戒相隨，與行者各持兵器前來。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      三兄弟はそれぞれ心を固め、白馬に荷物を載せ、その手綱を引き、大道を見つけてひたすら進んだ。昼夜を分かたず、百十里ほども行くと、ふと松林が見えた。林の中には曲がりくねった谷があり、その底を青く澄んだ水が勢いよく流れている。谷の端には石板の橋がかかり、向こうの洞穴へ通じていた。
      悟空「兄弟、あちらにはごつごつした岩壁が見えるな。あれが妖怪の住みかだろう。皆で相談しよう。誰が荷物と馬の番をする。誰が俺と渡って、妖怪退治に行く。」
      八戒「兄貴、俺はじっと座っていられる性分じゃない。一緒に行くよ。」
      悟空「よし、よし。」
      そして命じた。
      悟空「沙悟浄は馬と荷物を林の奥へ隠して、気をつけて守っていてくれ。俺たち二人は戸口へ行って、師匠を捜してくる。」
      沙悟浄は命令に従った。八戒は悟空について、それぞれ武器を手に進んでいった。まさに、
    "translation_status": "draft"
  - "id": "xy-ch40-037"
    "section_id": "chapter-40"
    "kind": "verse"
    "origin": "source"
    "source_text": "未煉嬰兒邪火勝，心猿木母共扶持。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      まだ錬り鎮めぬ嬰児（えいじ）の、邪悪な火が勝り
      心猿（しんえん）と木母は、ともに力を添えて支える。
    "translation_status": "draft"
  - "id": "xy-ch40-038"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知這一去吉兇何如，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 178
        "line_end": 178
    "translation_ja": "さて、この先に待つのは吉か凶か。それは次の回でお話ししよう。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-01-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「刀圭」には、底本が「一作『歸』」、すなわち「圭」を「歸」とする本もあると注記する。原文欄はこの異文注を含めて保存した。猿馬・刀圭・木母は内丹の寓意を含む並列と解し、訳ではその働きが空しくなるとした。古い注釈『西遊真詮』『西遊原旨』の検索表示でも、禅心の乱れによって諸要素が働きを失うと読む。注釈本文の直接取得には成功しておらず、検索表示で確認した範囲を越えて校訂しない。回題の嬰児を、まだ明かされていない固有名に置き換えていない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-02-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「道人」は前回蘇生した国王を指す。別の道士が登場したと読めないよう、出家姿の国王とした。「天下萬國九州」は天下の諸国を広くいう誇張で、九州を日本の地名とは解さない。「五鼓」は夜の最後の時刻を示すので五更と訳した。白玉珪の原字は珪であり、同義の圭に無断で置き換えていない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-03-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "山景の「挾魂靈臺」「藏魔洞」「滴水泉」は、正式な固有地名と断定せず、魂をさらうような高台、魔を隠す洞窟、滴る泉として訳した。「堂倒洞堂堂倒洞，洞當當倒洞當仙」は意味を一意に確定しにくい音の連なりで、ここでは前後の擬音に続く響きとして片仮名で写した。原字を保持し、建物や洞穴が倒れるという別の事件を創作していない。「登得洞門」は主体と動作のつながりに曖昧さがあり、洞の口へ上がったときの物音と解した。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-04-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "前段では三蔵が馬から下ろされているのに、この段では妖怪から見て「馬上」で守られていると記す。原文の緊張は残し、途中で再び馬に乗った動作を補っていない。三蔵の肉の効能は妖怪が人から聞いた話として訳し、語り手が保証する事実に変えない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-05-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空は「叫」と「轎」が中国語で同音であることを利用し、助けを求める声の話を、輿の話へわざとはぐらかす。日本語では同音にならないため、台詞に両方の字を残してやり取りを示した。人が担ぐ輿、騾馬を使う輿、開いた輿、寝て乗る輿の四種類を省略していない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-06-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「無有回聲」はこだまが返らないことと読み、続く「叫一聲，又叫一聲」は声の返りとして訳した。単に何度も呼ぶことと読む余地もある。幽霊や妖怪の声についての断定は三蔵の判断で、訳者による民俗学上の保証ではない。悟空の大蛇の説明も本人の警告として保持する。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-07-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "卯酉星法は、悟空自身が二者を会わせなくする術として持ち出し、直後に山を移し大地を縮めると描写される。その本文内の機能を訳し、具体的な占星術の術式や成立史は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-08-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "紅百万・紅十万という家族の名、財産、盗賊の襲撃と三日三晩の拘束は、子供に化けた妖怪の作り話である。「典身賣命」は身を質に入れ、身を売ってでも恩に報いるという誓いとして訳した。死んだ後も恩を忘れないという結びまで保持し、語り手が家族の実在を確認した書き方にしない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-09-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "続柄は外公が母方の祖父、姑娘が父の姉妹、姨夫が母の姉妹の夫、族伯が父と同族の年長男性、堂叔が父の父系従弟、堂兄が父系の年長のいとこと解した。族伯の親等は限定しすぎない。「父母空亡」は両親をともに死者と確定せず、今ここにいないという意味に採り、直前の母が連れ去られた話と無断で矛盾を増やさない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-10-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「凍熟」は凍え切って肌が傷んだ状態と解した。「腦後鬃硬」は八戒の後頭部の硬い毛、「晦氣臉」は沙悟浄の暗く黒ずんだ顔を嫌がる言葉と読んだ。妖怪が背負い手を選ぶ口実であり、身体への不当な評価を語り手の断定として追加しない。十畝の田の代価という数量を保持する。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-11-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "体重は三斤十来両、年齢七歳、年に一斤なら七斤、四斤未満という原文の数をすべて保持した。一斤を十六両として数える体系に合うが、現代のキログラムへは換算しない。「失乳」は幼いころ乳を飲めなくなったこととし、母が死亡したという原因を補わない。「尿尿把把」は小便と大便の意に採った。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-12-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「木母痴屣頑外趫」は語順と字面に難がある。原文を訂正せず、古い注釈『西遊原旨』の検索表示に見える「木母癡頑踩外蹺」とその正道を外れるという解説、『西遊真詮』の「木母癡頑躧外蹻」を参考に、愚かで頑なに道の外へ踏み出すという意味に訳した。二書とも検索表示による比較で、直接取得した底本ではない。心君・木母・意馬・黄婆は寓意語のまま残し、通常の人物ラベルと混同しない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-13-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「解尸」は体を抜け殻として魂を外へ逃す術として訳した。四方から四口の息を吸うこと、重さ千斤、体をたたき潰して四肢を引きちぎる動作を省略していない。「賴石頭」は道端の不整形でごつごつした岩と解したが、字の用法には留保がある。殺そうとする悟空の内心と、実際には魂が抜けていることを区別する。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-14-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「又問」の主語は直前に発話した沙悟浄と読んだ。「燈草做的」は灯心草の軽さを用いて三蔵が風に飛ばされたのではないかという言葉で、三蔵の体が実際に草でできているという記述ではない。白竜馬は既知の竜の変身であり、この回の呼称を既存の玉竜の辞書項目に別表記として結び付ける。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-15-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「褌無襠、褲無口」は衣類が破れて満足に身を覆えない様子と解したが、「口」が具体的にどの開口部を指すかは確定しない。「頭也摩光」は苦役で頭まで擦り減るほどという誇張として訳し、実際の剃髪儀礼を補わない。「燒火頂門」は火の番と門の役務、「提鈴喝號」は鈴を持って夜の時刻を触れる役務と解した。六百里、十里ごとの神、山神三十人・土地神三十人、修行三百年をそのまま保持する。妖怪の親子関係・地名・名と号は、神々が話すこの段で初めて明かす。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-16-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空の回想の五百年前、七人兄弟、五、六人の魔王、沙悟浄の五、六百年、八戒の海二つを省略せず、独自の算術や他回との整合で修正しない。牛魔王を長兄とした理由として、悟空が自分の小柄さを挙げる原文も保持した。親戚なのだから三蔵が無事だというのは悟空の期待で、以後の結果を先取りして保証する訳にしない。"
    "translation_status": "draft"
  - "id": "xy-ch40-note-17-body"
    "section_id": "chapter-40"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "結びの「未煉嬰兒」は幼子の妖怪と、内丹で錬り上げる嬰児の両方を重ねた表現として訳した。「共扶持」の具体的な目的語は原文にないため、三蔵を救出し終えたといった結果を補わず、ともに力を添えるとした。"
    "translation_status": "draft"

        "line_start": 163
        "line_end": 166
    "translation_ja": |-
      荒々しく巻き上げる水と雲は生臭く
      黒い気がむくむくと立ちこめ、日の光を閉ざす。
      峰の木々は根こそぎ引き抜かれ
      野の梅も幹ごとすべてなぎ倒される。
      黄色い砂が目をふさぎ、人は歩けず
      奇怪な岩が人を傷つけ、道のどこに平らな所があろう。
      うず巻く塊が平地を暗く覆い
      山じゅうの鳥や獣が、叫び声を上げる。

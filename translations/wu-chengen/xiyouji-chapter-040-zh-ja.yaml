    "source_text": |-
      淘淘怒捲水雲腥，黑氣騰騰閉日明。
      嶺樹連根通拔盡，野梅帶幹悉皆平。
      黃沙迷目人難走，怪石傷殘路怎平。
      滾滾團團平地暗，遍山禽獸發哮聲。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"

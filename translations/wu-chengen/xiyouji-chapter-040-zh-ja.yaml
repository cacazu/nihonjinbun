    "origin": "source"
    "source_text": "卻說那孫大聖兄弟三人按下雲頭。徑至朝內，只見那君臣儲后，幾班兒拜接謝恩。行者將菩薩降魔收怪的那一節，陳訴與他君臣聽了，一個個頂禮不盡。正都在賀喜之間，又聽得黃門官來奏：「主公，外面又有四個和尚來也。」八戒慌了道：「哥哥，莫是妖精弄法，假捏文殊菩薩，哄了我等，卻又變作和尚，來與我們鬥智哩？」行者道：「豈有此理？」即命宣進來看。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて、悟空（ごくう）たち三兄弟は雲を降り、そのまま宮中へ向かった。国王、臣下、太子、皇后らが幾列にも並んで拝礼し、恩を謝して出迎えた。悟空が、菩薩が妖魔を降して連れ帰った次第を君臣に語ると、皆は幾度となく頭を下げた。ちょうど一同が喜び合っているところへ、黄門官（こうもんかん）がまた報告に来た。
      黄門官「陛下、外へまた四人の和尚が参りました。」
      八戒（はっかい）は慌てて言った。
      八戒「兄貴、妖怪が術を使って文殊菩薩（もんじゅぼさつ）をでっち上げ、俺たちをだましたんじゃないか。それで今度は和尚に化けて、また知恵比べをしに来たんじゃないのか。」
      悟空「そんなはずがあるものか。」
      すぐに中へ通して、確かめることにした。
    "translation_status": "draft"
  - "id": "xy-ch40-003"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾文武傳令，著他進來。行者看時，原來是那寶林寺僧人，捧著那沖天冠、碧玉帶、赭黃袍、無憂履進得來也。行者大喜道：「來得好，來得好。」且教道人過來，摘下包巾，戴上沖天冠；脫了布衣，穿上赭黃袍；解了絛子，繫上碧玉帶；褪了僧鞋，登上無憂履；教太子拿出白玉珪來，與他執在手裡：早請上殿稱孤。正是自古道：「朝廷不可一日無君。」那皇帝那裡肯坐，哭啼啼，跪在階心道：「我已死三年，今蒙師父救我回生，怎麼又敢妄自稱尊；請那一位師父為君，我情願領妻子城外為民足矣。」那三藏那裡肯受，一心只是要拜佛求經。又請行者，行者笑道：「不瞞列位說，老孫若肯做皇帝，天下萬國九州皇帝都做遍了。只是我們做慣了和尚，是這般懶散。若做了皇帝，就要留頭長髮，黃昏不睡，五鼓不眠；聽有邊報，心神不安；見有災荒，憂愁無奈。我們怎麼弄得慣？你還做你的皇帝，我還做我的和尚，修功行去也。」那國王苦讓不過，只得上了寶殿，南面稱孤，大赦天下，封贈了寶林寺僧人回去。卻才開東閣，筵宴唐僧。一壁廂傳旨宣召丹青，寫下唐師徒四位喜容，供養在金鑾殿上。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 119
        "line_end": 119
    "translation_ja": |-
      文武の役人たちが命令を伝え、その僧たちを入らせた。悟空が見ると、宝林寺（ほうりんじ）の僧たちが、沖天冠（ちゅうてんかん）、碧玉帯（へきぎょくたい）、赭黄袍（しゃこうほう）、無憂履（むゆうり）を捧げて来たのだった。悟空は大いに喜んだ。
      悟空「いいところへ来た。実にいいところへ来たぞ。」
      そこで出家姿の国王を呼び寄せ、頭の包み布を取って沖天冠をかぶらせ、布の服を脱いで赭黄袍に着替えさせ、組みひもを解いて碧玉帯を締めさせ、僧の靴を脱いで無憂履を履かせた。太子には白玉珪（はくぎょくけい）を持ってこさせ、それを国王の手に持たせると、早く殿上へ上がって王位に就くよう勧めた。まさに昔からいう「朝廷は一日たりとも君主を欠くことはできない」である。
      だが国王はどうしても座ろうとせず、泣きながら階段の中央にひざまずいて言った。
      国王「私は死んでから三年もたっておりました。今、お師匠さまのお力で生き返らせていただいたのに、どうしてまた身のほどもわきまえず王を名乗れましょう。お師匠さま方のどなたかが王になってください。私は妻子を連れ、城外で一人の民として暮らせれば、それで十分でございます。」
      三蔵（さんぞう）はとても引き受けず、ただ仏を拝んで経を求めることだけを願った。次に悟空が頼まれると、笑って答えた。
      悟空「皆さんに隠さず言おう。俺が皇帝になりたいと思うなら、天下の万国、九州（きゅうしゅう）の皇帝は片っ端からやっているよ。だが俺たちは和尚暮らしに慣れて、こうして気楽にしている。皇帝になれば髪を伸ばさなけりゃならんし、日が暮れても眠れず、五更（ごこう）になっても寝てはいられない。国境の戦の知らせを聞けば心が落ち着かず、飢饉や災害が起これば、心配でどうにもならなくなる。そんな暮らしに俺たちが慣れるものか。あんたは今までどおり皇帝をやり、俺は今までどおり和尚をやって、修行の功を積んでいくよ。」
      国王は懸命に譲ろうとしたもののかなわず、やむなく宝殿へ上がり、南を向いて王位に戻った。天下に大赦を行い、宝林寺の僧たちには位と褒賞を授けて帰らせた。それから東閣（とうかく）を開いて三蔵のために宴を催す一方、絵師を呼び出すよう命じ、師弟四人のめでたい姿を描かせ、金鑾殿（きんらんでん）に掲げて敬い祀った。
    "translation_status": "draft"
  - "id": "xy-ch40-004"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那師徒們安了邦國，不肯久停，欲辭王駕投西。那皇帝與三宮妃后、太子、諸臣，將鎮國的寶貝、金銀緞帛，獻與師父酬恩。那三藏分毫不受，只是倒換關文，催悟空等背馬早行。那國王甚不過意，擺整朝鑾駕請唐僧上坐，著兩班文武引導，他與三宮妃后並太子一家兒，捧轂推輪，送出城廓，卻才下龍輦，與眾相別。國王道：「師父啊，到西天經回之日，是必還到寡人界內一顧。」三藏道：「弟子領命。」那皇帝閣淚汪汪，遂與眾臣回去了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      国を安らかに治め直した師弟は、長居しようとはせず、国王にいとまを告げて西へ向かおうとした。国王は三宮（さんぐう）の妃や皇后、太子、臣下たちとともに、国を守る宝や金銀、絹織物を差し出し、恩に報いようとした。三蔵は一つも受け取らず、通行の公文書を改めてもらっただけで、悟空たちに馬を用意して早く出立するよう促した。
      国王はそれでは申し訳ないと、朝廷の車駕を整えて三蔵に乗ってもらい、文官と武官の二列に先導させた。国王と三宮の妃や皇后、太子の一家は、車の軸を支え、車輪を押して城の外まで見送った。そこでようやく三蔵は天子の車を降り、皆に別れを告げた。
      国王「お師匠さま、西天（さいてん）で経をお受け取りになってお帰りの日には、必ずもう一度、私の国へお立ち寄りください。」
      三蔵「かしこまりました。」
      国王は涙を目いっぱいにためたまま、臣下たちとともに帰っていった。
    "translation_status": "draft"
  - "id": "xy-ch40-005"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那唐僧一行四僧，上了羊腸大路，一心裡專拜靈山。正值秋盡冬初時節，但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 122
        "line_end": 122
    "translation_ja": "三蔵一行の四人の僧は、羊の腸のように曲がりくねった道へ入り、ひたすら霊山（れいざん）を目指した。ちょうど秋が尽き、冬が始まるころのことで、目に映るのはこんな景色だった。"
    "translation_status": "draft"
  - "id": "xy-ch40-006"
    "section_id": "chapter-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      霜凋紅葉林林瘦，雨熟黃粱處處盈。
      日暖嶺梅開曉色，風搖山竹動寒聲。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 124
        "line_end": 125
    "translation_ja": |-
      霜に紅葉は散り落ち、林という林が痩せて見え
      雨に育った黄色い粟は、あちこちで豊かに実る。
      暖かな日を受け、峰の梅は暁の光の中で開き
      風に揺れる山の竹は、寒々とした音を立てる。
    "translation_status": "draft"
  - "id": "xy-ch40-007"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們離了烏雞國，夜住曉行，將半月有餘，忽又見一座高山，真個是摩天礙日。三藏馬上心驚，急兜韁忙呼行者。行者道：「師父有何吩咐？」三藏道：「你看前面又有大山峻嶺，須要仔細隄防，恐一時又有邪物來侵我也。」行者笑道：「只管走路，莫再多心，老孫自有防護。」那長老只得寬懷，加鞭策馬，奔至山巖，果然也十分險峻。但見得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      師弟は烏鶏国（うけいこく）を離れ、夜は宿を取り、明ければ歩き、半月余り旅を続けた。するとまた高い山が現れた。まことに天をこすり、太陽をさえぎるほどである。三蔵は馬上で胸騒ぎを覚え、急いで手綱を引き、悟空を呼んだ。
      悟空「お師匠さま、何かご用ですか。」
      三蔵「見なさい。前にはまた大きな山、険しい峰がある。よくよく用心しておくれ。また突然、邪悪なものが私を襲いに来ないとも限らない。」
      悟空は笑った。
      悟空「そのままお進みください。余計なご心配はなさらずに。私がちゃんとお守りします。」
      三蔵も気持ちを落ち着けるほかなく、鞭を入れて馬を進め、山の岩場へ差しかかった。そこは果たして、まことに険しかった。そのありさまはこうである。
    "translation_status": "draft"
  - "id": "xy-ch40-008"
    "section_id": "chapter-40"
    "kind": "verse"
    "origin": "source"
    "source_text": "高不高，頂上接青霄；深不深，澗中如地府。山前常見骨都都白雲，扢騰騰黑霧。紅梅翠竹，綠柏青松。山後有千萬丈挾魂靈臺，臺後有古古怪怪藏魔洞，洞中有叮叮噹噹滴水泉，泉下有彎彎曲曲流水澗。又見那跳天搠地獻果猿，丫丫叉叉帶角鹿，呢呢痴痴看人獐。至晚巴山尋穴虎，待曉翻波出水龍。登得洞門唿喇的響，驚得飛禽撲魯的起。看那林中走獸鞠律律的行，見此一夥禽和獸，嚇得人心扢磴磴驚。堂倒洞堂堂倒洞，洞當當倒洞當仙。青石染成千塊玉，碧紗籠罩萬堆煙。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      高いか高くないか、その頂は青空に接し
      深いか深くないか、その谷底は冥府にも似る。
      山の手前には、もくもくと白雲が浮かび、むくむくと黒霧が湧く。
      紅い梅、翠の竹、緑の柏、青い松。
      山の裏には千丈（じょう）、万丈にも及ぶ、魂をさらうような不思議な高台があり
      その後ろには奇怪この上ない、魔を隠す洞窟がある。
      洞窟にはちんちん、たんたんと滴の落ちる泉
      泉の下には曲がりくねって水の流れる谷。
      跳び上がり飛び下りて果物を差し出す猿
      枝またに分かれた角を生やす鹿
      ぼんやりと人を見つめるノロジカもいる。
      夕べには虎が山をよじ、穴を探し
      夜明けには竜が波を返して水から出る。
      洞の口へ上がれば、どっと音が起こり
      驚いた鳥たちが、ばさばさと飛び立つ。
      林の獣は、どどどっと走り行き
      この鳥や獣の群れを見れば、人の心もどきどきと震える。
      タンタオトン、タンタンタオトン、トンタンタンタオ、トンタンシエン。
      青い岩は染められた千の玉のよう
      青緑の薄絹をかぶせたように、幾万もの霞がたなびく。
    "translation_status": "draft"
  - "id": "xy-ch40-009"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們正當悚懼，又只見那山凹裡有一朵紅雲，直冒到九霄空內，結聚了一團火氣。行者大驚，走近前，把唐僧搊著腳，推下馬來，叫：「兄弟們，不要走了，妖怪來矣。」慌得個八戒急掣釘鈀，沙僧忙掄寶杖，把唐僧圍護在當中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      師弟が恐ろしさにおびえていると、山のくぼみから一片の紅い雲が、天の高みへまっすぐ立ち上り、火の気の塊となって集まった。悟空ははっと驚いて駆け寄り、三蔵の足をつかみ、馬から押し落として叫んだ。
      悟空「兄弟、進むな。妖怪が来たぞ！」
      八戒は慌てて熊手を抜き、沙悟浄（さごじょう）も急いで宝杖を振りかざし、三蔵を真ん中に囲んで守った。
    "translation_status": "draft"
  - "id": "xy-ch40-010"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話分兩頭。卻說紅光裡，真是個妖精。他數年前聞得人講：東土唐僧往西天取經，乃是金蟬長老轉生，十世修行的好人，有人吃他一塊肉，延生長壽，與天地同休。他朝朝在山間等候，不期今日到了。他在那半空裡正然觀看，只見三個徒弟把唐僧圍護在馬上，各各準備。這精靈誇讚不盡道：「好和尚！我才看著一個白面胖和尚騎了馬，真是那唐朝聖僧，卻怎麼被三個醜和尚護持住了？一個個伸拳斂袖，各執兵器，似乎要與人打的一般。噫！不知是那個有眼力的，想應認得我了。似此模樣，莫想得那唐僧的肉吃。」沉吟半晌，以心問心的自家商量道：「若要倚勢而擒，莫能得近；或者以善迷他，卻到得手。但哄得他心迷惑，待我在善內生機，斷然拿了。且下去戲他一戲。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      話をもう一方へ移そう。その紅い光の中にいたのは、本当に妖怪だった。数年前、人からこんな話を聞いていた。東土（とうど）から西天へ経を取りに行く唐僧（とうそう）は、金蝉長老（きんせんちょうろう）の生まれ変わりで、十度の生涯にわたって修行を積んだ善人である。その肉を一切れでも食べれば寿命が延び、天地とともに永く生きられるというのだ。
      妖怪は来る日も来る日も山中で待ち構えていたが、思いがけず今日、その人がやって来た。空中から見ていると、三人の弟子が馬上の三蔵を囲んで守り、それぞれに備えを固めている。妖怪は感心しきって言った。
      妖怪「たいした和尚たちだ。つい今しがた、色白でふっくらした和尚が馬に乗っているのが見えた。あれこそ唐の国の聖僧なのに、どうしてもう三人の醜い和尚に守られているんだ。一人一人が拳を突き出し、袖をたくし上げて武器を持ち、まるで誰かと戦おうとしているようだ。おや、誰か見抜く目を持っていて、俺の正体に気づいたのかもしれない。あのありさまでは、唐僧の肉を食べられるとは思うなよ。」
      しばらく考え込んでから、自分の心に問い、ひとりで策を練った。
      妖怪「力ずくで捕らえようにも、近づけない。善人を装って惑わせれば、うまく手に入るかもしれない。あの和尚の心をだまして迷わせ、その善意につけ込む隙さえ作れれば、きっと捕まえられる。ひとまず下へ降りて、からかってやろう。」
    "translation_status": "draft"
  - "id": "xy-ch40-011"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好妖怪，即散紅光，按雲頭落下。去那山坡裡，搖身一變，變作七歲頑童，赤條條的身上無衣，將麻繩綑了手足，高吊在那松樹梢頭，口口聲聲只叫：「救人，救人！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      さて妖怪は紅い光を消し、雲を低くして地に降りた。山の斜面で身をひと振りすると、七歳の子供に姿を変えた。何も着ない裸の体で、麻縄で手足を縛り、松の梢に高く吊り下がり、ひっきりなしに叫ぶ。
      妖怪「助けて、助けて！」
    "translation_status": "draft"
  - "id": "xy-ch40-012"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那孫大聖忽擡頭再看處，只見那紅雲散盡，火氣全無。便叫：「師父，請上馬走路。」唐僧道：「你說妖怪來了，怎麼又敢走路？」行者道：「我才然間見一朵紅雲從地而起，到空中結做一團火氣，斷然是妖精。這一會紅雲散了，想是個過路的妖精，不敢傷人。我們去耶。」八戒笑道：「師兄說話最巧，妖精又有個甚麼過路的？」行者道：「你那裡知道。若是那山那洞的魔王設宴，邀請那諸山各洞之精赴會，卻就有東西南北四路的精靈都來赴會。故此他只有心赴會，無意傷人。此乃過路之妖精也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      一方、悟空がふと顔を上げて見直すと、紅い雲はすっかり散り、火の気配も消えていた。そこで呼びかけた。
      悟空「お師匠さま、馬に乗ってお進みください。」
      三蔵「妖怪が来たと言ったのに、どうしてまた進んでよいのだ。」
      悟空「さっき、紅い雲が地面から立ち上り、空中で火の塊になるのが見えました。間違いなく妖怪です。今は紅い雲が消えましたから、通りがかりの妖怪で、人に手を出す気はないのでしょう。さあ、参りましょう。」
      八戒は笑った。
      八戒「兄貴は本当にうまいことを言うな。妖怪にも通りがかりなんてのがあるのか。」
      悟空「お前には分からんだろう。どこかの山の洞穴の魔王が宴を開いて、あちこちの山や洞穴の妖怪を招けば、東西南北の四方から妖怪が集まって来る。そのときは宴に行くことしか考えず、人を傷つけるつもりはない。そういうのが、通りがかりの妖怪だ。」
    "translation_status": "draft"
  - "id": "xy-ch40-013"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，也似信不信的，只得攀鞍在馬，順路奔山前進。正行時，只聽得叫聲：「救人！」長老大驚道：「徒弟呀，這半山中，是那裡甚麼人叫？」行者上前道：「師父只管走路，莫纏甚麼人轎、騾轎、明轎、睡轎。這所在，就有轎，也沒個人擡你。」唐僧道：「不是扛擡之轎，乃是叫喚之叫。」行者笑道：「我曉得，莫管閑事，且走路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      三蔵はそれを聞いても半信半疑だったが、鞍につかまって馬に乗り、道に沿って山へ進むよりほかなかった。歩いていると、叫ぶ声が聞こえた。
      妖怪の声「助けて！」
      三蔵は驚いた。
      三蔵「弟子たち、この山の中腹で、どこかの誰かが叫んでいるのではないか。」
      悟空は前へ出た。
      悟空「お師匠さま、進んでください。人に担がせる輿だの、騾馬の輿だの、屋根のない輿だの、寝輿だのにかまってはいられません。こんな所では、輿があったところで、担いでくれる人もいませんよ。」
      三蔵「担ぐ輿の『轎』ではない。叫び声の『叫』だ。」
      悟空は笑った。
      悟空「分かっていますよ。余計なことにはかまわず、お進みください。」
    "translation_status": "draft"
  - "id": "xy-ch40-014"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏依言，策馬又進。行不上一里之遙，又聽得叫聲：「救人！」長老道：「徒弟，這個叫聲不是鬼魅妖邪。若是鬼魅妖邪，但有出聲，無有回聲。你聽他叫一聲，又叫一聲，想必是個有難之人。我們可去救他一救。」行者道：「師父，今日且把這慈悲心略收起收起，待過了此山，再發慈悲罷。這去處兇多吉少。你知道那倚草附木之說，是物可以成精。諸般還可，只有一般蟒蛇，但修得年遠日深，成了精魅，善能知人小名兒。他若在草科裡，或山凹中，叫人一聲，人不答應還可；若答應一聲，他就把人元神綽去，當夜跟來，斷然傷人性命。且走，且走。古人云：『脫得去，謝神明。』切不可聽他。」長老只得依他，又加鞭催馬而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      三蔵は言われるままに、また馬を進めた。一里（り）も行かないうち、再び叫び声がした。
      妖怪の声「助けて！」
      三蔵「弟子たち、あの声は幽霊や妖怪ではない。幽霊や妖怪なら、声はしても、こだまは返らないものだ。聞きなさい、一声叫ぶと、また一声返ってくる。きっと困っている人なのだろう。助けに行ってあげよう。」
      悟空「お師匠さま、今日はひとまずその慈悲心を少し引っ込めて、この山を越してからお出しください。ここは凶事ばかりで、吉事の少ない所です。草や木に取りついて、どんな物でも妖怪になれるという話はご存じでしょう。ほかのものならまだしも、大蛇だけは、長い長い年月修行して妖怪になると、人の幼名をうまく言い当てます。草むらや山のくぼみから人を呼び、呼ばれた者が答えなければまだよいのですが、一声でも答えると、その人の魂をさらい、その晩ついて来て、必ず命を奪うのです。さあ、お進みください。昔の人も『逃れられたら神々に感謝せよ』と言っています。決して耳を貸してはいけません。」
      三蔵は従うほかなく、また鞭を入れて馬を急がせた。
    "translation_status": "draft"
  - "id": "xy-ch40-015"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者心中暗想：「這潑怪不知在那裡，只管叫阿叫的。等我老孫送他一個『卯酉星法』，教他兩不見面。」好大聖，叫沙和尚前來：「攏著馬，慢慢走著，讓老孫解解手。」你看他讓唐僧先行幾步，卻念個咒語，使個移山縮地之法，把金箍棒往後一指，他師徒過此峰頭，往前走了，卻把那怪物撇下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      悟空は心の中で考えた。
      悟空の心の声「あのろくでなしの妖怪は、どこにいるのか知らんが、しつこく叫び続けている。ひとつ俺が卯酉星法（ぼうゆうせいほう）をお見舞いして、互いに顔を合わせられなくしてやろう。」
      悟空は沙悟浄を呼び寄せた。
      悟空「馬を引いて、ゆっくり進んでいてくれ。俺はちょっと用を足す。」
      三蔵を数歩先へ行かせると、呪文を唱え、山を移し、大地を縮める術を使った。そして金箍棒（きんこぼう）を後ろへ向けて指した。師弟はこの峰を越えて先へ進み、妖怪だけを後ろに取り残したのである。
    "translation_status": "draft"
  - "id": "xy-ch40-016"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他再拽開步，趕上唐僧，一路奔山。只見那三藏又聽得那山背後叫聲：「救人！」長老道：「徒弟呀，那有難的人大沒緣法，不曾得遇著我們，我們走過他了。你聽他在山後叫哩。」八戒道：「在便還在山前，只是如今風轉了也。」行者道：「管他甚麼轉風不轉風，且走路。」因此，遂都無言語，恨不得一步踏過此山，不題話下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      悟空はまた大股で進み、三蔵に追いついて、山道を急いだ。すると三蔵は、山の背後からまた声がするのを聞いた。
      妖怪の声「助けて！」
      三蔵「弟子たち、あの困っている人は、よほど縁がないのだね。私たちに出会えず、私たちは通り過ぎてしまった。ほら、山の後ろで叫んでいる。」
      八戒「今もまだ、山の前にいるんでしょう。ただ、風向きが変わったんですよ。」
      悟空「風向きが変わろうが変わるまいが、かまうものか。先へ進もう。」
      それからは皆、口をつぐんだ。一歩でこの山を踏み越えたいほどだったが、ひとまずこちらの話は置く。
    "translation_status": "draft"
  - "id": "xy-ch40-017"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖精在山坡裡連叫了三四聲，更無人到。他心中思量道：「我等唐僧在此，望見他離不上三里，卻怎麼這半晌還不到？想是抄下路去了。」他抖一抖身軀，脫了繩索，又縱紅光，上空再看。不覺孫大聖仰面回觀，識得是妖怪，又把唐僧撮著腳推下馬來道：「兄弟們，仔細，仔細，那妖精又來也。」慌得那八戒、沙僧各持鈀、棍，將唐僧又圍護在中間。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      さて、妖怪は山の斜面で三、四声続けて叫んだが、誰も来ない。心の中で考えた。
      妖怪の心の声「ここで唐僧を待っていて、三里も離れていないのが見えていたのに、どうしてこれだけ待っても来ないのだろう。下の道を近道して行ったのかもしれない。」
      体をぶるっと震わせ、縄を抜け出すと、また紅い光を放って空へ上がり、見渡した。そのとき悟空が顔を上げ、後ろを振り返った。妖怪だと見抜き、また三蔵の足をつかんで馬から押し落とし、叫んだ。
      悟空「兄弟、気をつけろ、気をつけろ。あの妖怪がまた来たぞ！」
      八戒と沙悟浄は慌てて、それぞれ熊手と棒を構え、三蔵を再び真ん中に囲んで守った。
    "translation_status": "draft"
  - "id": "xy-ch40-018"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那精靈見了，在半空中稱羨不已道：「好和尚！我才見那白面和尚坐在馬上，卻怎麼又被他三人藏了？這一去見面方知。先把那有眼力的弄倒了，方才捉得唐僧；不然啊，徒費心機難獲物，枉勞情興總成空。」卻又按下雲頭，恰似前番變化，高吊在松樹梢頭等候。這番卻不上半里之地。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      妖怪はそれを見て、空中でしきりに感心した。
      妖怪「たいした和尚たちだ。たった今、あの色白の和尚が馬に乗っているのを見たのに、どうしてまた三人に隠されてしまったんだ。今度こそ顔を合わせれば分かるだろう。まず見抜く目を持っているやつを倒してこそ、唐僧を捕まえられる。そうしなければ、知恵を絞っても獲物は得られず、心を尽くしてもすべて無駄になる。」
      また雲を降ろし、先ほどと同じように姿を変えて、松の梢に高く吊り下がり、待ち構えた。今度は一行から半里もない場所である。
    "translation_status": "draft"
  - "id": "xy-ch40-019"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那孫大聖擡頭再看，只見那紅雲又散，復請師父上馬前行。三藏道：「你說妖精又來，如何又請走路？」行者道：「這還是個過路的妖精，不敢惹我們。」長老又懷怒道：「這個潑猴，十分弄我。正當有妖魔處，卻說無事；似這般清平之所，卻又恐嚇我，不時的嚷道有甚麼妖精。虛多實少，不管輕重，將我搊著腳，捽下馬來，如今卻解說甚麼過路的妖精。假若跌傷了我，卻也過意不去，這等這等……」行者道：「師父莫怪，若是跌傷了你的手足，卻還好醫治；若是被妖精撈了去，卻何處跟尋？」三藏大怒，哏哏的，要念緊箍兒咒。卻是沙僧苦勸，只得上馬又行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      悟空が顔を上げて見直すと、紅い雲がまた散っていたので、再び師に馬に乗って先へ進むよう勧めた。
      三蔵「妖怪がまた来たと言っておきながら、なぜまた進めと言うのだ。」
      悟空「これもやはり通りがかりの妖怪で、私たちに手出しはしません。」
      三蔵はまた腹を立てた。
      三蔵「このいたずら猿め、ずいぶん私をからかってくれる。本当に妖怪のいる所では何もないと言い、こんな穏やかな所では私を脅し、何かにつけて妖怪だ妖怪だと騒ぐ。嘘ばかりで本当のことは少なく、加減もせず私の足をつかんで馬からたたき落とし、今になって通りがかりの妖怪などと言い訳をする。もし私が落ちて怪我をしたら、それこそ申し訳が立たぬだろう。まったく、まったく……。」
      悟空「お師匠さま、お怒りにならないでください。落ちて手足に怪我をなさっても、まだ治せます。妖怪にさらわれたら、どこを捜せばよいのですか。」
      三蔵はひどく怒り、喉の奥でうなって、頭の輪を締める呪文を唱えようとした。だが沙悟浄が懸命になだめたので、ようやく馬に乗り、また歩き始めた。
    "translation_status": "draft"
  - "id": "xy-ch40-020"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "還未曾坐得穩，只聽又叫：「師父救人啊！」長老擡頭看時，原來是個小孩童，赤條條的吊在樹上。兜住韁，便罵行者道：「這潑猴多大憊懶，全無有一些兒善良之意，心心只是要撒潑行兇哩！我那般說叫喚的是個人聲，他就千言萬語，只嚷是妖怪。你看那樹上吊的不是個人麼？」大聖見師父怪下來了，卻又覿面看見模樣，一則做不得手腳，二來又怕念緊箍兒咒，低著頭，再也不敢回言，讓唐僧到了樹下。那長老將鞭梢指著問道：「你是那家孩兒？因有甚事，吊在此間？說與我，好救你。」噫！分明他是個精靈，變化得這等，那師父卻是個肉眼凡胎，不能相識。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      三蔵がまだ鞍に落ち着いて座る間もなく、また声がした。
      妖怪の声「お師匠さま、助けてください！」
      三蔵が顔を上げて見ると、小さな子供が裸で木に吊られていた。手綱を引き、悟空を叱りつけた。
      三蔵「この猿め、どれほどふざければ気が済むのだ。善良な心が少しもなく、乱暴を働くことしか考えていない。叫んでいるのは人の声だとあれほど言ったのに、ああだこうだと言い立てて、妖怪だと騒ぐばかりだ。見なさい、木に吊られているのは人ではないか。」
      悟空は師に責められ、その子供の姿まで目の前に見られてしまった。もはや細工もできず、頭の輪を締める呪文も怖かったので、うつむいて二度と言い返そうとせず、三蔵を木の下へ行かせた。三蔵は鞭の先で指して尋ねた。
      三蔵「お前はどこの家の子だね。何があって、こんな所に吊られているのだ。話してごらん、助けてあげるから。」
      ああ、明らかに妖怪がこのように化けているというのに、師はただの人間の目と肉体しか持たず、その正体を見分けられないのである。
    "translation_status": "draft"
  - "id": "xy-ch40-021"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖魔見他下問，越弄虛頭，眼中噙淚，叫道：「師父呀，山西去有一條枯松澗，澗那邊有一莊村，我是那裡人家。我祖公公姓紅，只因廣積金銀，家私巨萬，混名喚做紅百萬。年老歸世已久，家產遺與我父。近來人事奢侈，家私漸廢，改名喚做紅十萬。專一結交四路豪傑，將金銀借放，希圖利息。怎知那無籍之人，設騙了去啊，本利無歸。我父發了洪誓，分文不借。那借金銀人，身貧無計，結成兇黨，明火執杖，白日殺上我門，將我財帛盡情劫擄；把我父親殺了；見我母親有些顏色，拐將去做甚麼壓寨夫人。那時節，我母親捨不得我，把我抱在懷裡，哭哀哀，戰兢兢，跟隨賊寇。不期到此山中，又要殺我。多虧母親哀告，免教我刀下身亡，卻將繩子吊我在樹上，只教凍餓而死。那些賊將我母親不知掠往那裡去了。我在此已吊三日三夜，更沒一個人來行走。不知那世裡修積，今生得遇老師父。若肯捨大慈悲，救我一命回家，就典身賣命，也酬謝師恩。即使黃沙蓋面，更不敢忘也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      妖怪は尋ねられると、なおさら偽りの芝居をし、目に涙を浮かべて訴えた。
      妖怪「お師匠さま、この山を西へ行くと枯松澗（こしょうかん）という谷があり、その向こうに村があります。僕はその村の家の子です。おじいさんは紅（こう）という姓で、金銀をたくさん蓄え、たいへんな財産持ちだったので、紅百万（こうひゃくまん）というあだ名で呼ばれていました。年を取って亡くなり、もうずいぶんたちますが、財産は父に残してくれました。ところが近ごろは付き合いが派手になって、財産がだんだん減り、紅十万（こうじゅうまん）と呼ばれるようになりました。父はもっぱら各地の豪傑たちと付き合い、金銀を貸して、利息を得ようとしていたのです。ところが素性の知れない者たちにだまし取られ、元手も利息も戻りませんでした。それで父は、もう一文も貸さないと固く誓ったのです。
      すると、金銀を借りていた人たちは、貧しくなってどうにもならず、悪党の仲間を組み、松明と武器を持ち、白昼、僕の家へ襲いかかってきました。金や品物を残らず奪い、父を殺し、母が少しきれいなのを見ると、何とかいう山賊の頭の奥方にするんだと言って、さらっていきました。そのとき母は僕を置いていけず、胸に抱き、泣き、震えながら、賊たちについていったのです。
      ところがこの山まで来ると、また僕を殺そうとしました。母が頼み込んでくれたおかげで、刃物で殺されることは免れましたが、縄で木に吊られ、凍えて飢え死にしろと置いていかれたのです。賊たちが母をどこへ連れ去ったのかも分かりません。ここで三日三晩吊られたまま、通る人は一人もいませんでした。いつの世で善い行いを積んだおかげか、今の世でお師匠さまに出会えました。大きなお情けをかけて命を救い、家へ帰してくださるなら、この身を質に入れ、身売りしてでも、ご恩に報います。たとえ死んで黄色い砂に顔を覆われても、決して忘れません。」
    "translation_status": "draft"
  - "id": "xy-ch40-022"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，認了真實，就教八戒解放繩索，救他下來。那獃子也不識人，便要上前動手。行者在傍，忍不住喝了一聲道：「那潑物！有認得你的在這裡哩，莫要只管架空搗鬼，說謊哄人。你既家私被劫，父被賊傷，母被人擄，救你去交與誰人？你將何物與我作謝？這謊脫節了耶。」那怪聞言，心中害怕，就知大聖是個能人，暗將他放在心上。卻又戰戰兢兢，滴淚而言曰：「師父，雖然我父母空亡，家財盡絕，還有些田產未動，親戚皆存。」行者道：「你有甚麼親戚？」妖怪道：「我外公家在山南，姑娘住居嶺北，澗頭李四是我姨夫，林內紅三是我族伯，還有堂叔、堂兄都住在本莊左右。老師父若肯救我，到了莊上，見了諸親，將老師父拯救之恩，一一對眾言說，典賣些田產，重重酬謝也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      三蔵はそれを聞いて本当だと受け取り、八戒に縄をほどいて助け下ろすよう命じた。八戒も相手の正体が分からず、近寄って手を出そうとした。傍らの悟空は我慢できず、一声どなった。
      悟空「このろくでなしめ。ここにはお前を見抜いている者がいるぞ。根も葉もない作り話をして、嘘で人をだまし続けるんじゃない。家の財産を奪われ、父親を賊に殺され、母親をさらわれたというなら、お前を助けて、誰に引き渡せばよいんだ。何を俺たちに礼として渡す気だ。その嘘は、つじつまが合わなくなったぞ。」
      妖怪はそれを聞いて怖くなり、悟空がただ者ではないと知って、内心、用心する相手と定めた。それでも震えながら涙をこぼして答えた。
      妖怪「お師匠さま、父も母もいなくなり、家のお金や品物は全部なくなりましたが、田畑はまだ残っていますし、親戚も皆います。」
      悟空「どんな親戚がいるんだ。」
      妖怪「母方のおじいさんの家は山の南に、父の姉妹であるおばさんは峰の北に住んでいます。谷のほとりの李四（りし）は母の姉妹の夫で、林の中の紅三（こうさん）は父と同じ一族の年上のおじさんです。父の従弟にあたるおじさんや、父方の年上のいとこたちも、皆、僕の村の近くに住んでいます。お師匠さまが助けてくださるなら、村へ着いて親戚に会い、お師匠さまに救っていただいたご恩を、皆の前で一つ一つ話します。そして田畑を質に入れるなり売るなりして、たっぷりお礼をいたします。」
    "translation_status": "draft"
  - "id": "xy-ch40-023"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒聽說，扛住行者道：「哥哥，這等一個小孩子家，你只管盤詰他怎的？他說得是強盜，只打劫他些浮財，莫成連房屋田產也劫得去？若與他親戚們說了，我們縱有廣大食腸，也吃不了他十畝田價。救他下來罷。」獃子只是想著吃食，那裡管甚麼好歹，使戒刀挑斷繩索，放下怪來。那怪對唐僧馬下淚汪汪，只情磕頭。長老心慈，便叫：「孩兒，你上馬來，我帶你去。」那怪道：「師父啊，我手腳都吊麻了，腰胯疼痛；一則是鄉下人家，不慣騎馬。」唐僧叫八戒馱著。那妖怪抹了一眼道：「師父，我的皮膚都凍熟了，不敢要這位師父馱。他的嘴長耳大，腦後鬃硬，搠得我慌。」唐僧道：「教沙和尚馱著。」那怪也抹了一眼道：「師父，那些賊來打劫我家時，一個個都搽了花臉，帶假鬍子，拿刀弄杖的。我被他諕怕了，見這位晦氣臉的師父，一發沒了魂了，也不敢要他馱。」唐僧教孫行者馱著。行者呵呵笑道：「我馱，我馱。」那怪物暗自歡喜，順順當當的要行者馱他。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      八戒はそれを聞くと、悟空を押しとどめた。
      八戒「兄貴、こんな小さな子を、どうしてそう問い詰めるんだ。こいつが言っているのは強盗だろう。奪えるのは持っていける財産だけで、まさか家や田畑まで持ち去れるわけじゃない。親戚に話してくれれば、俺たちがいくら大食いでも、十畝（ほ）の田の代金ほどは食えやしない。助け下ろしてやろうよ。」
      八戒は食べ物のことばかり考えて、善し悪しなど気にもしない。戒刀（かいとう）で縄を切り、妖怪を下ろした。妖怪は三蔵の馬の前で、涙をいっぱいにため、ひたすら頭を地面につけて拝んだ。三蔵は心優しく呼びかけた。
      三蔵「坊や、馬に乗っておいで。私が連れていこう。」
      妖怪「お師匠さま、手足は吊られてしびれ、腰も脚の付け根も痛いのです。それに、田舎の家の子なので、馬に乗り慣れていません。」
      三蔵は八戒に背負わせようとした。妖怪はちらっと八戒を見て言った。
      妖怪「お師匠さま、肌がすっかり凍えて傷んでいるので、このお師匠さまには背負っていただけません。お口が長く、お耳が大きくて、後頭部の毛も硬いので、ちくちくして怖いのです。」
      三蔵「では沙悟浄に背負ってもらいなさい。」
      妖怪はそちらもちらっと見た。
      妖怪「お師匠さま、僕の家へ押し入った賊たちは、皆、顔に派手な色を塗り、付けひげをつけ、刀や棒を振り回していました。怖い思いをさせられたので、このお師匠さまの黒ずんだお顔を見ると、なおさら魂が抜けそうになります。この方にも背負っていただけません。」
      三蔵が悟空に背負うよう命じると、悟空はからからと笑った。
      悟空「俺が背負おう。俺が背負ってやるよ。」
      妖怪はひそかに喜び、何の逆らいもせず、悟空に背負われようとした。
    "translation_status": "draft"
  - "id": "xy-ch40-024"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者把他扯在路傍邊，試了一試，只好有三斤十來兩重。行者笑道：「你這個潑怪物，今日該死了，怎麼在老孫面前搗鬼？我認得你是個那話兒。」妖怪道：「我是好人家兒女，不幸遭此大難，怎麼是個甚麼『那話兒』？」行者道：「你既是好人家兒女，怎麼這等骨頭輕？」妖怪道：「我骨格兒小。」行者道：「你今年幾歲了？」那妖怪道：「我七歲了。」行者笑道：「一歲長一斤，也該七斤，你怎麼不滿四斤重麼？」那怪道：「我小時失乳。」行者說：「也罷，我馱著你，若要尿尿把把，須和我說。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      悟空は妖怪を道端へ引っ張り、持ち上げて重さを試したが、三斤（きん）と十両（りょう）ほどしかなかった。悟空は笑った。
      悟空「このろくでなしの妖怪め、今日はお前の命日だ。よくも俺の目の前で小細工をするな。お前が、あのたぐいのやつだと、俺には分かっているぞ。」
      妖怪「僕はまともな家の子供で、運悪くこんな大変な目に遭っただけです。どうして、その『あのたぐい』なんかになるんですか。」
      悟空「まともな家の子供なら、どうしてそんなに体が軽いんだ。」
      妖怪「僕は骨格が小さいんです。」
      悟空「今年で幾つだ。」
      妖怪「七つです。」
      悟空は笑った。
      悟空「一年に一斤ずつ増えたって七斤にはなるだろう。どうして四斤にも足りないんだ。」
      妖怪「小さいときに、お乳を飲めなくなったんです。」
      悟空「まあいい、背負ってやる。小便や大便がしたくなったら、必ず俺に言えよ。」
    "translation_status": "draft"
  - "id": "xy-ch40-025"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏才與八戒、沙僧前走，行者背著孩兒隨後，一行徑投西去。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 153
        "line_end": 153
    "translation_ja": "三蔵が八戒、沙悟浄とともに先へ進み、悟空は子供を背負って後に続いた。一行はまっすぐ西へ向かう。この場面を示す詩がある。"
    "translation_status": "draft"
  - "id": "xy-ch40-026"
    "section_id": "chapter-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      道德高隆魔障高，禪機本靜靜生妖。
      心君正直行中道，木母痴屣頑外趫。
      意馬不言懷愛慾，黃婆無語自憂焦。
      客邪得志空歡喜，畢竟還從正處消。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 155
        "line_end": 158
    "translation_ja": |-
      道と徳が高まれば、妨げる魔も高まり
      禅のはたらきは本来静かだが、静けさから妖が生まれる。
      心君（しんくん）は正直に、中の道を歩むのに
      木母（もくぼ）は愚かで頑なに、道の外へと足を踏み出す。
      意馬（いば）はものを言わず、胸に愛欲を抱き
      黄婆（こうば）も語らず、ひとり気を揉み、焦る。
      外から来た邪気は思いを遂げても、喜びはむなしく
      結局は、正しいところから消されるのである。
    "translation_status": "draft"
  - "id": "xy-ch40-027"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖馱著妖魔，心中埋怨唐僧不知艱苦：「行此險峻山場，空身也難走，卻教老孫馱人。這廝莫說他是妖怪，就是好人，他沒了父母，不知將他馱與何人，倒不如摜殺他罷。」那怪物卻早知覺了，便就使個神通，往四下裡吸了四口氣，吹在行者背上，便覺重有千斤。行者笑道：「我兒啊，你弄重身法壓我老爺哩。」那怪聞言，恐怕大聖傷他，卻就解尸，出了元神，跳將起去，佇立在九霄空裡。這行者背上越重了。猴王發怒，抓過他來，往那路傍邊賴石頭上滑辣的一摜，將屍骸摜得像個肉餅一般。還恐他又無禮，索性將四肢扯下，丟在路兩邊，俱粉碎了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空は妖怪を背負いながら、三蔵は苦労というものが分からないと、心の中で不平をこぼした。
      悟空の心の声「こんな険しい山道は、身一つでも歩きにくいのに、俺に人を背負わせるとはな。こいつは妖怪だが、たとえまともな人間だとしても、両親はいないんだ。背負っていったところで、誰に渡せばいいのか分からん。それなら、いっそたたき殺してしまうほうがましだ。」
      妖怪は早くもそれに気づき、神通力を使った。四方から四口の息を吸い、悟空の背へ吹きつけると、たちまち重さは千斤にも感じられた。悟空は笑った。
      悟空「坊や、体を重くする術で、この俺様を押し潰す気か。」
      妖怪はそれを聞くと、悟空に傷つけられるのを恐れ、体を抜け殻として残して魂を抜き、跳び上がって天高くにとどまった。悟空の背はますます重くなった。悟空は怒り、背のものをつかんで引き下ろすと、道端のごつごつした岩に、ばしゃりとたたきつけた。体は肉の薄餅のように潰れた。それでもまた悪さをされるのを恐れ、いっそ手足も引きちぎり、道の両側へ放り投げ、すっかり粉々にしてしまった。
    "translation_status": "draft"
  - "id": "xy-ch40-028"
    "section_id": "chapter-40"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那物在空中明明看著，忍不住心頭火起道：「這猴和尚十分憊懶，就作我是個妖魔，要害你師父，卻還不曾見怎麼下手哩，你怎麼就把我這等傷損？早是我有算計，出神走了；不然，是無故傷生也。若不趁此時拿了唐僧，再讓一番，越教他停留長智。」好怪物，就在半空裡弄了一陣旋風，呼的一聲響喨，走石揚沙，誠然兇狠。好風："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch40-1808481"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第040回&oldid=1808481"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      妖怪は空中からそれをはっきり見て、こらえきれず怒りを燃やした。
      妖怪「この猿和尚は、なんという乱暴者だ。たとえ俺が妖怪で、お前の師匠を害そうとしているにせよ、まだ手を出すのを見たわけでもないのに、なぜこんなに俺の体を壊すんだ。先回りして魂を抜いておいたからよかったものの、そうでなければ、理由もなく命を奪うところだったぞ。今のうちに唐僧を捕まえなければ、またひと息つかせて、あいつにますます知恵を働かせることになる。」
      妖怪は空中で一陣の旋風を起こした。ごうっと大きな音が響き、石を走らせ、砂を巻き上げる。まことに凶暴な風だった。その風はというと、
    "translation_status": "draft"
  - "id": "xy-ch40-029"

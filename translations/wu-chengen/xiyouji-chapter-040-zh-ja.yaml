  "known_gaps":
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-001"
      "description_ja": "回題の「刀圭」には、底本が「一作『歸』」、すなわち「圭」を「歸」とする本もあると注記する。原文欄はこの異文注を含めて保存した。猿馬・刀圭・木母は内丹の寓意を含む並列と解し、訳ではその働きが空しくなるとした。古い注釈『西遊真詮』『西遊原旨』の検索表示でも、禅心の乱れによって諸要素が働きを失うと読む。注釈本文の直接取得には成功しておらず、検索表示で確認した範囲を越えて校訂しない。回題の嬰児を、まだ明かされていない固有名に置き換えていない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-003"
      "description_ja": "「道人」は前回蘇生した国王を指す。別の道士が登場したと読めないよう、出家姿の国王とした。「天下萬國九州」は天下の諸国を広くいう誇張で、九州を日本の地名とは解さない。「五鼓」は夜の最後の時刻を示すので五更と訳した。白玉珪の原字は珪であり、同義の圭に無断で置き換えていない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-008"
      "description_ja": "山景の「挾魂靈臺」「藏魔洞」「滴水泉」は、正式な固有地名と断定せず、魂をさらうような高台、魔を隠す洞窟、滴る泉として訳した。「堂倒洞堂堂倒洞，洞當當倒洞當仙」は意味を一意に確定しにくい音の連なりで、ここでは前後の擬音に続く響きとして片仮名で写した。原字を保持し、建物や洞穴が倒れるという別の事件を創作していない。「登得洞門」は主体と動作のつながりに曖昧さがあり、洞の口へ上がったときの物音と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-010"
      "description_ja": "前段では三蔵が馬から下ろされているのに、この段では妖怪から見て「馬上」で守られていると記す。原文の緊張は残し、途中で再び馬に乗った動作を補っていない。三蔵の肉の効能は妖怪が人から聞いた話として訳し、語り手が保証する事実に変えない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-013"
      "description_ja": "悟空は「叫」と「轎」が中国語で同音であることを利用し、助けを求める声の話を、輿の話へわざとはぐらかす。日本語では同音にならないため、台詞に両方の字を残してやり取りを示した。人が担ぐ輿、騾馬を使う輿、開いた輿、寝て乗る輿の四種類を省略していない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-014"
      "description_ja": "「無有回聲」はこだまが返らないことと読み、続く「叫一聲，又叫一聲」は声の返りとして訳した。単に何度も呼ぶことと読む余地もある。幽霊や妖怪の声についての断定は三蔵の判断で、訳者による民俗学上の保証ではない。悟空の大蛇の説明も本人の警告として保持する。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-015"
      "description_ja": "卯酉星法は、悟空自身が二者を会わせなくする術として持ち出し、直後に山を移し大地を縮めると描写される。その本文内の機能を訳し、具体的な占星術の術式や成立史は補わない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-021"
      "description_ja": "紅百万・紅十万という家族の名、財産、盗賊の襲撃と三日三晩の拘束は、子供に化けた妖怪の作り話である。「典身賣命」は身を質に入れ、身を売ってでも恩に報いるという誓いとして訳した。死んだ後も恩を忘れないという結びまで保持し、語り手が家族の実在を確認した書き方にしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-022"
      "description_ja": "続柄は外公が母方の祖父、姑娘が父の姉妹、姨夫が母の姉妹の夫、族伯が父と同族の年長男性、堂叔が父の父系従弟、堂兄が父系の年長のいとこと解した。族伯の親等は限定しすぎない。「父母空亡」は両親をともに死者と確定せず、今ここにいないという意味に採り、直前の母が連れ去られた話と無断で矛盾を増やさない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-023"
      "description_ja": "「凍熟」は凍え切って肌が傷んだ状態と解した。「腦後鬃硬」は八戒の後頭部の硬い毛、「晦氣臉」は沙悟浄の暗く黒ずんだ顔を嫌がる言葉と読んだ。妖怪が背負い手を選ぶ口実であり、身体への不当な評価を語り手の断定として追加しない。十畝の田の代価という数量を保持する。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-024"
      "description_ja": "体重は三斤十来両、年齢七歳、年に一斤なら七斤、四斤未満という原文の数をすべて保持した。一斤を十六両として数える体系に合うが、現代のキログラムへは換算しない。「失乳」は幼いころ乳を飲めなくなったこととし、母が死亡したという原因を補わない。「尿尿把把」は小便と大便の意に採った。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-026"
      "description_ja": "底本の「木母痴屣頑外趫」は語順と字面に難がある。原文を訂正せず、古い注釈『西遊原旨』の検索表示に見える「木母癡頑踩外蹺」とその正道を外れるという解説、『西遊真詮』の「木母癡頑躧外蹻」を参考に、愚かで頑なに道の外へ踏み出すという意味に訳した。二書とも検索表示による比較で、直接取得した底本ではない。心君・木母・意馬・黄婆は寓意語のまま残し、通常の人物ラベルと混同しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-027"
      "description_ja": "「解尸」は体を抜け殻として魂を外へ逃す術として訳した。四方から四口の息を吸うこと、重さ千斤、体をたたき潰して四肢を引きちぎる動作を省略していない。「賴石頭」は道端の不整形でごつごつした岩と解したが、字の用法には留保がある。殺そうとする悟空の内心と、実際には魂が抜けていることを区別する。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-031"
      "description_ja": "「又問」の主語は直前に発話した沙悟浄と読んだ。「燈草做的」は灯心草の軽さを用いて三蔵が風に飛ばされたのではないかという言葉で、三蔵の体が実際に草でできているという記述ではない。白竜馬は既知の竜の変身であり、この回の呼称を既存の玉竜の辞書項目に別表記として結び付ける。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-034"
      "description_ja": "「褌無襠、褲無口」は衣類が破れて満足に身を覆えない様子と解したが、「口」が具体的にどの開口部を指すかは確定しない。「頭也摩光」は苦役で頭まで擦り減るほどという誇張として訳し、実際の剃髪儀礼を補わない。「燒火頂門」は火の番と門の役務、「提鈴喝號」は鈴を持って夜の時刻を触れる役務と解した。六百里、十里ごとの神、山神三十人・土地神三十人、修行三百年をそのまま保持する。妖怪の親子関係・地名・名と号は、神々が話すこの段で初めて明かす。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-035"
      "description_ja": "悟空の回想の五百年前、七人兄弟、五、六人の魔王、沙悟浄の五、六百年、八戒の海二つを省略せず、独自の算術や他回との整合で修正しない。牛魔王を長兄とした理由として、悟空が自分の小柄さを挙げる原文も保持した。親戚なのだから三蔵が無事だというのは悟空の期待で、以後の結果を先取りして保証する訳にしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch40-1808481"
      "segment_ids":
        - "xy-ch40-037"
      "description_ja": "結びの「未煉嬰兒」は幼子の妖怪と、内丹で錬り上げる嬰児の両方を重ねた表現として訳した。「共扶持」の具体的な目的語は原文にないため、三蔵を救出し終えたといった結果を補わず、ともに力を添えるとした。 本文の欠落ではなく解釈・校訂上の留保。"

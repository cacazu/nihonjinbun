  "origin": "source"
  "source_text": "這行者縱觔斗雲，起在空中，見那怪回兵閉門，才按下祥光，立於西山坡上，悵望悲啼道：「師父啊，我"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 178
    "line_end": 178
  "translation_ja": "悟空は觔斗雲を飛ばして空へ上がった。黄眉大王が兵を引き、門を閉じるのを見て、ようやくめでたい光を降ろし、西の山の斜面に立った。悲しげに見やり、泣きながら悟空は言った。「お師匠さま、私は、"
  "translation_status": "reviewed"
- "id": "xy-ch66-025"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    自從秉教入禪林，感荷菩薩脫難深。
    保你西來求大道，相同輔助上雷音。
    只言平坦羊腸路，豈料崔巍怪物侵。
    百計千方難救你，東求西告枉勞心。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 179
    "line_end": 182
  "translation_ja": |-
    教えを奉じて仏門に入り、深い難儀を解いてくださった菩薩の恩を受け、
    あなたを守って西へ大道を求め、ともに助け合って雷音（らいおん）へ上ろうとしました。
    細い道でも平らだろうと思っていたのに、険しい山で妖怪に襲われるとは。
    百の計、千の手を尽くしても救えず、東へ頼み西へ告げても、むなしく心を砕くばかりです。」
  "translation_status": "reviewed"
- "id": "xy-ch66-026"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖正當悽慘之時，忽見那西南上一朵彩雲墜地，滿山頭大雨繽紛，有人叫道：「悟空，認得我麼？」行者急走前看處，那個人："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    悟空がこうして悲しみに沈んでいると、突然、西南から彩雲が一つ地へ降り、山じゅうに大雨がしきりに降った。声の主が呼んだ。「悟空、私が誰だか分かるか。」
    悟空は急いで前へ行って見ると、その人は、
  "translation_status": "reviewed"
- "id": "xy-ch66-027"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大耳橫頤方面相，肩查腹滿身軀胖。
    一腔春意喜盈盈，兩眼秋波光蕩蕩。
    敞袖飄然福氣多，芒鞋灑落精神壯。
    極樂場中第一尊，南無彌勒笑和尚。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 186
    "line_end": 189
  "translation_ja": |-
    大きな耳、張り出した顎、四角い顔、肩が張り腹は満ち、体は太い。
    胸いっぱいの春の心に喜びはあふれ、両眼には秋の澄んだ波のような光が広がる。
    広い袖はひらひらとして福々しく、草鞋姿はさっぱりとして気力に満ちる。
    極楽（ごくらく）の場で第一の尊者、南無（なむ）弥勒（みろく）、笑う和尚。
  "translation_status": "reviewed"
- "id": "xy-ch66-028"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，連忙下拜道：「東來佛祖，那裡去？弟子失迴避了，萬罪，萬罪。」佛祖道：「我此來，專為這小雷音妖怪也。」行者道：「多蒙老爺盛德大恩。敢問那妖是那方怪物，何處精魔？不知他那搭包兒是件甚麼寶貝？煩老爺指示指示。」佛祖道：「他是我面前司磬的一個黃眉童兒。三月三日，我因赴元始會去，留他在宮看守，他把我這幾件寶貝拐出，假佛成精。那搭包兒是我的後天袋子，俗名喚做『人種袋』。那條狼牙棒是個敲磬的槌兒。」行者聽說，高叫一聲道：「好個笑和尚，你走了這童兒，教他誑稱佛祖，陷害老孫，未免有個家法不謹之過。」彌勒道：「一則是我不謹，走失人口；二則是你師徒們魔障未完，故此百靈下界，應該受難。我今來與你收他去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    悟空は見ると、慌ててひれ伏して言った。「東来仏祖（とうらいぶっそ）、どちらへおいでになるのですか。弟子の私が道を避けず、まことに、まことに申し訳ございません。」
    弥勒「私が来たのは、ほかでもない、この小雷音（しょうらいおん）の妖怪のためだ。」
    悟空「大いなる徳とご恩、ありがとうございます。お尋ねしますが、あの妖怪はどこの何者なのですか。あの肩掛け袋が、どんな宝なのかも分かりません。どうかお教えください、お教えください。」
    弥勒「あれは私の前で磬を扱う、黄色い眉の童子だ。三月三日、私が元始会（げんしかい）に赴いたので、宮を守らせておいた。ところが私の宝をいくつか持ち逃げし、仏を装う妖怪になったのだ。あの肩掛け袋は、私の後天袋（こうてんたい）で、俗には『人種袋（じんしゅたい）』という。狼牙棒は、磬を叩く槌なのだ。」
    悟空は聞くや、大声を上げた。「とんだ笑い和尚だ。この童子を逃がし、仏祖と偽らせて俺をひどい目に遭わせるとは。身内の取り締まりがなっていない、という落ち度があるんじゃないですか。」
    弥勒「一つには、私が気をつけず、身内を逃がしたせいだ。二つには、お前たち師弟の魔障（ましょう）がまだ尽きていなかったので、さまざまな神霊が下界に降り、難儀を受けることになっていたのだ。今、私が来たからには、そいつを収めて連れ帰ってやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch66-029"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「這妖精神通廣大，你又無些兵器，何以收之？」彌勒笑道：「我在這山坡下設一草庵，種一田瓜果在此。你去與他索戰，交戰之時許敗不許勝，引他到我這瓜田裡。我別的瓜都是生的，你卻變做一個大熟瓜。他來定要瓜吃，我卻將你與他吃。吃下肚中，任你怎麼在內擺佈他。那時等我取了他的搭包兒，裝他回去。」行者道：「此計雖妙，你卻怎麼認得變的熟瓜？他怎麼就肯跟我來此？」彌勒笑道：「我為治世之尊，慧眼高明，豈不認得你？憑你變作甚物，我皆知之。但恐那怪不肯跟來耳，我卻教你一個法術。」行者道：「他斷然是以搭包兒裝我，怎肯跟來？有何法術可來也？」彌勒笑道：「你伸手來。」行者即舒左手，遞將過去。彌勒將右手食指蘸著口中神水，在行者掌上寫了一個「禁」字，教他捏著拳頭，見妖精當面放手，他就跟來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    悟空「この妖怪は神通力が広大です。あなたは何の武器もお持ちでないのに、どうやって収めるのですか。」
    弥勒は笑って言った。「この山の斜面の下に草庵を設け、ひと畑の瓜を植えておこう。お前はあやつに勝負を挑み、戦うときは負けるだけで、勝ってはならぬ。私の瓜畑へ誘い込むのだ。ほかの瓜はみな未熟だが、お前は大きな熟れた瓜に変わりなさい。あやつが来れば必ず瓜を食べたがるから、お前を与えて食わせよう。腹へ入れば、好きなように中であやつをいたぶればよい。その間に私が袋を取り上げ、あやつを詰めて帰る。」
    悟空「妙案ですが、私が化けた熟れた瓜を、どうして見分けられるのです。それに、あやつが素直にここまでついてくるでしょうか。」
    弥勒は笑った。「私は世を治める尊者で、慧眼（えげん）は明らかだ。お前が分からぬはずがあろうか。何に変わろうと、みな分かる。ただ、あの妖怪がついて来ないかもしれない。そこで術を一つ授けよう。」
    悟空「必ずあの袋で私を取り込もうとするでしょう。どうしてついて来たりしますか。どんな術で来させるのです。」
    弥勒は笑って言った。「手を出しなさい。」
    悟空はすぐ左手を広げて差し出した。弥勒は右手の人差し指を口中の霊妙な水で濡らし、悟空の掌に「禁」の字を書いた。そして拳を握っておき、妖怪と向かい合ったときに開けば、ついてくると教えた。
  "translation_status": "reviewed"
- "id": "xy-ch66-030"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者揝拳，欣然領教。一隻手掄著鐵棒，直至山門外，高叫道：「妖魔，你孫爺爺又來了，可快出來，與你見個上下。」小妖又忙忙奔告。妖王問道：「他又領多少兵來叫戰？」小妖道：「別無甚兵，止他一個。」妖王笑道：「那猴兒計窮力竭，無處求人，斷然是送命來也。」隨又結束整齊，帶了寶貝，舉著那輕軟狼牙棒，走出門來，叫道：「孫悟空，今番掙挫不得了。」行者罵道：「潑怪物，我怎麼掙挫不得？」妖王道：「我見你計窮力竭，無處求人，獨自個強來支持，如今拿住，再沒個甚麼神兵救拔，此所以說你掙挫不得也。」行者道：「這怪不知死活。莫說嘴，吃我一棒。」那妖王見他一隻手掄棒，忍不住笑道：「這猴兒，你看他弄巧，怎麼一隻手使棒支吾？」行者道：「兒子，你禁不得我兩隻手打；若是不使搭包子，再著三五個，也打不過老孫這一隻手。」妖王聞言，道：「也罷，也罷，我如今不使寶貝，只與你實打，比個雌雄。」即舉狼牙棒，上前來鬥。孫行者迎著面，把拳頭一放，雙手掄棒。那妖精著了禁，不思退步，果然不弄搭包，只顧使棒來趕。行者虛幌一下，敗陣就走。那妖精直趕到西山坡下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 192
    "line_end": 192
  "translation_ja": |-
    悟空は拳を握り、喜んで教えを受けた。片手で鉄棒を振るい、まっすぐ山門の外へ行って、大声で言った。「妖魔め、お前の孫爺さまがまた来たぞ。さっさと出てこい。どちらが上か決めようじゃないか。」
    小妖がまた慌ただしく駆け込んで知らせた。黄眉大王は尋ねた。「またどれだけ兵を率いて、戦いを挑みに来たのだ。」
    小妖「兵はほかにおらず、あいつ一人だけです。」
    黄眉大王は笑った。「あの猿は策も力も尽き、頼る所もなくなったのだ。間違いなく、死にに来たのだな。」
    また身支度を整え、宝を携え、軽くしなやかな狼牙棒を掲げて門を出ると、黄眉大王は呼んだ。「孫悟空、今度こそあがいても逃れられぬぞ。」
    悟空は罵った。「不届きな化け物め。どうして俺が逃れられぬんだ。」
    黄眉大王「お前は策も力も尽き、頼る所もなく、一人で無理に持ちこたえに来たのだ。今捕らえれば、もう救い出す神兵はおらぬ。だから逃れられぬと言うのだ。」
    悟空「この化け物め、命知らずだな。口をたたくな。俺の棒を食らえ。」
    黄眉大王は、悟空が片手で棒を振るうのを見ると、こらえきれず笑った。「猿め、妙な真似をしおって。どうして片手で棒を使ってしのぐのだ。」
    悟空「小僧、俺が両手で打ったら、お前は耐えられまい。袋さえ使わなければ、お前のような奴があと三人五人増えても、この俺の片手にはかなわぬ。」
    黄眉大王は聞いて言った。「よかろう、よかろう。今は宝を使わず、まともに打ち合って、雌雄を決しよう。」
    狼牙棒を上げ、前へ出て戦いを始めた。悟空は正面で拳を開き、両手で棒を振るった。黄眉大王は禁の術にかかり、退くことも考えず、果たして袋を使わずに、ひたすら棒で追いかけてきた。悟空はさっと空振りをし、負けたふりで走り出した。黄眉大王はそのまま、西の山の斜面の下まで追っていった。
  "translation_status": "reviewed"
- "id": "xy-ch66-031"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見有瓜田，打個滾，鑽入裡面，即變做一個大熟瓜，又熟又甜。那妖精停身四望，不知行者那方去了。他卻趕至庵邊叫道：「瓜是誰人種的？」彌勒變作一個種瓜叟，出草庵答道：「大王，瓜是小人種的。」妖王道：「可有熟瓜麼？」彌勒道：「有熟的。」妖王叫：「摘個熟的來，我解渴。」彌勒即把行者變的那瓜，雙手遞與妖王。妖王更不察情，到此接過手，張口便啃。那行者乘此機會，一轂轆鑽入咽喉之下，等不得好歹，就弄手腳：抓腸蒯腹，翻根頭，豎蜻蜓，任他在裡面擺佈。那妖精疼得傞牙徠嘴，眼淚汪汪，把一塊種瓜之地，滾得似個打麥之場。口中只叫：「罷了，罷了，誰人救我一救？」彌勒卻現了本像，嘻嘻笑笑，叫道：「孽畜，認得我麼？」那妖擡頭看見，慌忙跪倒在地，雙手揉著肚子，磕頭撞腦，只叫：「主人公，饒我命罷，饒我命罷，再不敢了。」彌勒上前，一把揪住，解了他的後天袋兒，奪了他的敲磬槌兒。叫：「孫悟空，看我面上，饒他命罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    悟空は瓜畑を見つけると、一転がりして中へ潜り、大きく熟れた瓜に変わった。よく熟れて甘い瓜だった。黄眉大王は立ち止まって四方を見回したが、悟空がどこへ行ったのか分からなかった。そこで庵のそばまで追ってきて、黄眉大王は呼んだ。「この瓜は誰が植えた。」
    弥勒は瓜作りの老人に姿を変え、草庵を出て答えた。「大王さま、この瓜はわたくしが植えました。」
    黄眉大王「熟れた瓜はあるか。」
    弥勒「熟れたものがございます。」
    黄眉大王「一つ採ってこい。喉を潤したい。」
    弥勒はすぐ、悟空の変わった瓜を両手で黄眉大王へ差し出した。黄眉大王は何も疑わずに受け取り、口を開けてかじった。悟空はその隙に、ころりと喉の下へ潜り込むと、あれこれ待たずに手足を動かし始めた。腸をつかんで腹を掻き、宙返りをし、逆立ちをし、腹の中で好き放題に暴れた。黄眉大王は痛みに歯をむき口をゆがめ、涙をいっぱいにため、瓜畑を麦打ち場のようにしてしまうほど転げ回った。黄眉大王は、口ではただこう叫んだ。「もう駄目だ、もう駄目だ。誰か助けてくれ！」
    弥勒は本来の姿を現し、にこにこと笑って呼んだ。「不届き者、私が誰だか分かるか。」
    黄眉大王は顔を上げて見ると、慌てて地にひざまずき、両手で腹を揉みながら頭を打ちつけ、ただただ叫んだ。「ご主人さま、命をお助けください。命をお助けください。もう二度といたしません。」
    弥勒は進み寄ってひとつかみにし、後天袋を解き取り、磬を叩く槌を奪った。弥勒は呼んだ。「孫悟空、私に免じて、命は助けてやりなさい。」
  "translation_status": "reviewed"
- "id": "xy-ch66-032"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者十分恨苦，卻又左一拳，右一腳，在裡面亂掏亂搗。那怪萬分疼痛難忍，倒在地下。彌勒又道：「悟空，他也夠了，你饒他罷。」行者才叫：「你張大口，等老孫出來。」那怪雖是肚腹絞痛，還未傷心。俗語云：「人未傷心不得死，花殘葉落是根枯。」他聽見叫張口，即便忍著疼，把口大張。行者方才跳出，現了本像，急掣棒還要打時，早被佛祖把妖精裝在袋裡，斜跨在腰間。手執著磬槌，罵道：「孽畜！金鐃偷了，那裡去了？」那怪卻只要憐生，在後天袋內哼哼嗔嗔的道：「金鐃是孫悟空打破了。」佛祖道：「鐃破，還我金來。」那怪道：「碎金堆在殿蓮臺上哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 194
    "line_end": 194
  "translation_ja": |-
    悟空は恨みが深く、なおも左で一発殴り、右で一発蹴り、腹の中をむちゃくちゃに突き回し、叩き回した。黄眉大王はあまりの痛みに耐えきれず、地面に倒れた。弥勒はまた言った。「悟空、もう十分に苦しんだ。許してやりなさい。」
    ようやく悟空が叫んだ。「口を大きく開けろ。俺が出ていく。」
    黄眉大王は腹がねじれるように痛んだものの、まだ心臓は傷ついていなかった。諺にもいう。「人は心臓を傷つけられねば死なず、花がしぼみ葉が落ちるのは根が枯れるから。」口を開けろとの声を聞くと、痛みをこらえ、口を大きく開いた。悟空はそこで飛び出して本来の姿を現し、急いで棒を抜き、なおも打とうとした。しかし早くも弥勒は黄眉大王を袋へ入れ、斜めに腰へ掛けていた。磬の槌を持った弥勒は罵った。「不届き者。盗んだ金鐃は、どこへやった。」
    黄眉大王は、ただ命だけを助けてほしくて、後天袋の中からうめき、ぐずりながら言った。「金鐃は孫悟空に割られました。」
    弥勒「鐃が割れたなら、金を返しなさい。」
    黄眉大王「砕けた金は、殿の蓮台の上に積んであります。」
  "translation_status": "reviewed"
- "id": "xy-ch66-033"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那佛祖提著袋子，執著磬槌，嘻嘻笑笑，叫道：「悟空，我和你去尋金還我。」行者見此法力，怎敢違誤，只得引佛上山，回至寺內，收取碎金。只見那山門緊閉，佛祖使槌一指門開。入裡看時，那些小妖已得知老妖被擒，各自收拾囊底，都要逃生四散。被行者見一個打一個，見兩個打兩個，把五七百個小妖盡皆打死。各現原身，都是些山精樹怪，獸孽禽魔。佛祖將金收攢一處，吹口仙氣，念聲咒語，即時返本還原，復得金鐃一副。別了行者，駕祥雲，徑轉極樂世界。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 196
    "line_end": 196
  "translation_ja": |-
    弥勒は袋を提げ、磬の槌を持ち、にこにこと笑って言った。「悟空、一緒に金を捜しに行こう。私に返しておくれ。」
    悟空はその法力を見て、逆らうわけにも、しくじるわけにもいかなかった。弥勒を案内して山へ登り、寺へ戻って砕けた金を取り集めるよりほかなかった。山門は固く閉まっていたが、弥勒が槌で指すと門は開いた。中へ入って見ると、小妖たちは親玉が捕らえられたことを知り、それぞれ袋の中身をまとめ、逃げ延びようと四散しかけていた。悟空は一匹見れば一匹を打ち、二匹見れば二匹を打ち、五百七百もの小妖を一匹残らず打ち殺した。皆が本来の姿を現したが、山の精や樹の怪、獣や鳥の妖魔ばかりだった。弥勒は金を一か所に集め、仙気を吹きかけて呪文を唱えると、たちまち元の姿に戻り、再び一対の金鐃となった。悟空に別れを告げ、めでたい雲に乗って、まっすぐ極楽世界（ごくらくせかい）へ戻っていった。
  "translation_status": "reviewed"
- "id": "xy-ch66-034"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖卻才解下唐僧、八戒、沙僧。那獃子吊了幾日，餓得慌了，且不謝大聖，卻就蝦著腰，跑到廚房尋飯吃。原來那怪正安排了午飯，因行者索戰，還未得吃。這獃子看見，即吃了半鍋。卻拿出兩缽頭叫師父、師弟們各吃了兩碗。然後才謝了行者。問及妖怪原由，行者把先請祖師、龜、蛇，後請大聖借太子，並彌勒收降之事，細陳了一遍。三藏聞言，謝之不盡，頂禮了諸天，道：「徒弟，這些神聖，困於何所？」行者道：「昨日日值功曹對老孫說，都在地窖之內。」叫：「八戒，我與你去解脫他等。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    ここでようやく悟空は、三蔵、八戒、沙悟浄を解き下ろした。八戒は何日も吊られ、ひどく腹を空かせていたので、悟空に礼も言わず、海老のように腰をかがめて厨房へ走り、食べ物を捜した。もともと妖怪たちは昼飯を用意していたが、悟空が勝負を挑みに来たので、まだ食べていなかった。八戒は見つけると、たちまち鍋半分を平らげた。それから二つの鉢に盛って運び出し、師と弟弟子たちにもそれぞれ二碗ずつ食べさせた。その後、ようやく悟空に礼を述べた。妖怪のいきさつを尋ねられると、悟空は、初めに祖師を訪ねて亀・蛇を招いたこと、次に大聖を訪ねて太子を借りたこと、そして弥勒が降伏させたことを、一通り詳しく話した。三蔵は聞くと、礼を述べてやまず、天の神々を拝して言った。「弟子よ、その神聖なお方々は、どこに閉じ込められているのです。」
    悟空「昨日、日値功曹が俺に話しました。みな地下蔵の中にいるそうです。」
    続いて悟空は呼んだ。「八戒、一緒に皆を解き放ちに行こう。」
  "translation_status": "reviewed"
- "id": "xy-ch66-035"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子得食力壯，抖擻精神，尋著他的釘鈀，即同大聖到後面，打開地窖，將眾等解了繩，請出珍樓之下。三藏披了袈裟，朝上一一拜謝。這大聖才送五龍、二將回武當，送小張太子與四將回蠙城，後送二十八宿歸天府，發放揭諦、伽藍各回境。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 199
    "line_end": 199
  "translation_ja": "八戒は食事をして力を取り戻し、元気を奮い起こして自分の釘鈀（ていは）を捜し出した。そして悟空と奥へ行き、地下蔵を開け、皆の縄を解いて、宝の楼の下へお連れした。三蔵は袈裟（けさ）をまとい、上座に向かって一人一人に拝礼し、感謝した。悟空はそれから五龍と二将を武当へ送り、小張太子と四将を蠙城へ送り、その後二十八宿を天府（てんぷ）へ送り、掲諦と伽藍をそれぞれの境へ帰らせた。"
  "translation_status": "reviewed"
- "id": "xy-ch66-036"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們卻寬住了半日。餵飽了白馬，收拾行囊，至次早登程。臨行時，放上一把火，將那些珍樓、寶座、高閣、講堂，俱盡燒為灰燼。這裡才："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 201
    "line_end": 201
  "translation_ja": "師弟たちは、さらに半日ゆっくりと滞在した。白馬に腹いっぱい食べさせ、旅の荷をまとめ、翌朝出発した。立ち去る際に火を放ち、宝の楼、宝座、高閣、講堂を、すべて焼いて灰にした。こうしてようやく、"
  "translation_status": "reviewed"
- "id": "xy-ch66-037"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": "無罣無牽逃難去，消災消障脫身行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 203
    "line_end": 203
  "translation_ja": |-
    しがらみも引かれるものもなく、難儀を逃れて去り、
    災いと障りを消し、身を脱して進む。
  "translation_status": "reviewed"
- "id": "xy-ch66-038"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知幾時才到大雷音，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 205
    "line_end": 205
  "translation_ja": "さて、いつになれば大雷音（だいらいおん）にたどり着くのか。それは次の回のお話。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-01-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この仙境の賛は、東南の神岳、芙蓉峰・紫蓋嶺、翼・軫などを並べる。ここを武当山の現代地理に合うよう書き換えない。「幽含」は取得した固定版どおりの文字で、文意は不明瞭である。鳥を意味する字へ無断で直さず、ひそかな響きの表現として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-02-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の誕生日は「開皇元年甲辰之歲三月初一日午時」。これは真武の神話上の誕生譚として扱い、歴史上の隋の開皇元年へ換算しない。別伝の三月三日にも直さない。日の光を呑む夢と懐妊の主体は皇后と解した。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-03-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「玄虛上應，龜蛇合形」は、天上への対応と亀・蛇の合わさる姿を並べた句。「皆稱萬靈」「無顯不成」には解釈の幅があるため、それぞれ霊威への称賛、顕れた事を成し遂げる趣旨として訳した。特定の神像の構造を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-04-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空の回想には、最初の袋で自分も星神たちと一緒に取り込まれ、後に脱出したという説明がある。前の叙述との整合を取るために、この発言の「我」を削ったり別人に直したりしない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-05-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "狼牙棒の形容は原文では「強能短軟」。句の切り方と「強」の意味が明瞭でないため、強さと短く柔らかい性質を並べて訳した。本文にない「長くなる」へ補訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-06-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「孤拐」はここでは足首。教育部重編國語辭典は脚踝の意味を挙げ、『西遊記』の用例も示す。「人間之喜仙」は定まった神名とは確認できず、人の世の喜びの仙人という功曹の呼びかけとして残した。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-07-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「封浮」は取得した固定版にある表記で、実在のどの地を指すかは未確定。「江津」は川の渡し場と解し、現代の同名の都市には結び付けない。名所の列挙は、字の似た別の名に置き換えず、その順序とともに残した。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-08-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「冰虯」は字面では氷の虯竜。宝塔の描写の中にあるが、彫刻や棟飾りだとは本文に明記されないため、その材質や設置場所は補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-09-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "水母娘娘と水猿大聖は、双方とも国師王菩薩が降した存在として語られる。ただし、両者を同一とする説明はここまでの原文にはないため、名前や属性を統合しない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-10-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「面上無肉」は字面を残した罵り。相手を見分けられないことを責める文脈だが、具体的な身体状態や固定した故事は確認できない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-11-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「因師遠慕長生訣」は主語と係り方に曖昧さがあるため、師を慕い長生の秘訣を求める趣旨として訳した。半粒の丹砂で病が去るというのは、太子が語る仙術上の来歴である。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-12-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "結びの「多時三乘無上法，致令百藝苦相將」は凝縮した表現。三乗の法をめぐる長い争いで、さまざまな術が苦しくせめぎ合う意と解した。特定の三人の戦士を「三乗」に当てはめない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-13-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「滿山頭大雨繽紛」であり、大雨が山に降る描写として訳した。花の雨へ無断で読み替えない。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-14-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「抓腸蒯腹」「傞牙徠嘴」などは、取得した固定版の難字をそのまま保存した。訳文では前後の動作に即し、腸をつかんで腹を掻くこと、痛みで歯と口をゆがめる姿と解した。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-15-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ここでの「傷心」は、悲しむことではなく、生命を支える心臓を損なうこととして訳した。直前の腹痛と心臓の対比に続く諺も、この身体的な意味を受けている。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-16-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「五七百」は五百や七百という幅を持つ数え方として残した。妖怪たちは打たれただけでなく、「盡皆打死」とあるとおり全員が打ち殺されている。"
  "translation_status": "reviewed"
- "id": "xy-ch66-note-17-body"
  "section_id": "chapter-66"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「兩缽頭」と「各吃了兩碗」を区別し、「師父、師弟們」と複数で記す。運ぶ器は二つの鉢、食べる量はそれぞれ二碗とし、人物の複数表現も一人に直さない。"
  "translation_status": "reviewed"

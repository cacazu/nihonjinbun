  "translation_status": "reviewed"
- "id": "xy-ch66-002"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表孫大聖無計可施，縱一朵祥雲，駕觔斗，徑轉南贍部洲去拜武當山，參請蕩魔天尊，解釋三藏、八戒、沙僧、天兵等眾之災。他在半空裡無停止，不一日，早望見祖師仙境，輕輕按落雲頭，定睛觀看，好去處："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 122
    "line_end": 122
  "translation_ja": "さて、悟空（ごくう）はもう打つ手がなく、めでたい雲を起こして觔斗雲（きんとうん）に乗り、まっすぐ南贍部洲（なんせんぶしゅう）へ戻って武当山（ぶとうざん）を訪ねた。蕩魔天尊（とうまてんそん）にお出ましを願い、三蔵（さんぞう）、八戒（はっかい）、沙悟浄（さごじょう）、天兵たちの災難を解いてもらうためである。空中を休まず飛び続け、一日もたたぬうちに祖師の仙境が見えた。そっと雲を降ろし、目を凝らして眺める。なんとよい所だろう。"
  "translation_status": "reviewed"
- "id": "xy-ch66-003"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": "巨鎮東南，中天神岳。芙蓉峰竦傑，紫蓋嶺巍峨。九江水盡荊揚遠，百越山連翼軫多。上有太虛之寶洞，朱陸之靈臺。三十六宮金磬響，百千萬客進香來。舜巡禹禱，玉簡金書。樓閣飛青鳥，幢幡擺赤裾。地設名山雄宇宙，天開仙境透空虛。幾樹榔梅花正放，滿山瑤草色皆舒。龍潛澗底，虎伏崖中。幽含如訴語，馴鹿近人行。白鶴伴雲棲老檜，青鸞丹鳳向陽鳴。玉虛師相真仙地，金闕仁慈治世門。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    東南を鎮める大山、天の中ほどにそびえる神岳。
    芙蓉峰（ふようほう）はひときわ高く、紫蓋嶺（しがいれい）は雄々しくそびえる。
    九江（きゅうこう）の水の果てに荊（けい）・揚（よう）は遥か、百越（ひゃくえつ）の山々は翼（よく）・軫（しん）の下に連なる。
    上には太虚（たいきょ）の宝洞、朱陸（しゅりく）の霊台がある。
    三十六の宮に金の磬（けい）が響き、百千万の客が香を供えに訪れる。
    舜（しゅん）が巡り、禹（う）が祈った所、玉の札と金の書が伝わる。
    楼閣には青い鳥が飛び、旗の間には赤い裾が揺れる。
    地は宇宙に威を示す名山を据え、天は虚空へ通じる仙境を開く。
    幾本もの榔梅（ろうばい）はちょうど花盛り、山じゅうの瑶草（ようそう）は色を広げる。
    竜は谷底に潜み、虎は崖の中に伏す。
    ひそかな響きは語りかけるようで、馴れた鹿は人のそばを歩く。
    白鶴は雲とともに古い檜（かい）に宿り、青鸞（せいらん）と丹鳳（たんぽう）は日に向かって鳴く。
    玉虚師相（ぎょくきょししょう）のまことの仙境、金闕仁慈（きんけつじんじ）の尊者が世を治める門。
  "translation_status": "reviewed"
- "id": "xy-ch66-004"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "上帝祖師乃淨樂國王與善勝皇后夢吞日光，覺而有孕，懷胎一十四個月，於開皇元年甲辰之歲三月初一日午時降誕於王宮。那爺爺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 126
    "line_end": 126
  "translation_ja": "この上帝たる祖師は、浄楽国王（じょうらくこくおう）と善勝皇后（ぜんしょうこうごう）の子である。皇后は日の光を呑む夢を見て、目を覚ますと身ごもっていた。十四か月の懐妊を経て、開皇（かいこう）元年、甲辰（きのえたつ）の年の三月一日、午（うま）の刻に王宮でお生まれになった。この尊きお方は、"
  "translation_status": "reviewed"
- "id": "xy-ch66-005"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    幼而勇猛，長而神靈。
    不統王位，惟務修行。
    父母難禁，棄舍皇宮。
    參玄入定，在此山中。
    功完行滿，白日飛昇。
    玉皇敕號，真武之名。
    玄虛上應，龜蛇合形。
    周天六合，皆稱萬靈。
    無幽不察，無顯不成。
    劫終劫始，剪伐魔精。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 127
    "line_end": 136
  "translation_ja": |-
    幼くして勇猛、成長して霊妙な力を備え、
    王位には就かず、ただ修行に励んだ。
    父母にも引き留められず、皇宮を捨て去り、
    この山の中で玄妙な道を究め、禅定に入った。
    功を積み行いを成し遂げ、白昼に昇天し、
    玉皇（ぎょくこう）から真武（しんぶ）の名を勅授された。
    上なる玄虚（げんきょ）に応じ、亀と蛇を一つの姿に合わせ、
    あまねき天と六合（りくごう）で、万般の霊威を称えられる。
    隠れたものも見逃さず、現れたものはことごとく成し遂げ、
    劫（こう）の終わりにも始まりにも、魔物を討ち滅ぼす。
  "translation_status": "reviewed"
- "id": "xy-ch66-006"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖玩著仙境景致，早來到一天門、二天門、三天門。卻至太和宮外，忽見那祥光瑞氣之間，簇擁著五百靈官。那靈官上前迎著道：「那來的是誰？」大聖道：「我乃齊天大聖孫悟空，要見師相。」眾靈官聽說，隨報。祖師即下殿，迎到太和宮。行者作禮道：「我有一事奉勞。」問：「何事？」行者道：「保唐僧西天取經，路遭險難。至西牛賀洲，有座山喚小西天，小雷音寺有一妖魔。我師父進得山門，見有阿羅、揭諦、比丘、聖僧排列，以為真佛，倒身才拜，忽被他拿住綁了。我又失於防閑，被他拋一副金鐃，將我罩在裡面，無纖毫之縫，口合如鉗。甚虧金頭揭諦請奏玉帝，欽差二十八宿，當夜下界，掀揭不起。幸得亢金龍將角透入鐃內，將我度出，被我打碎金鐃，驚醒怪物。趕戰之間，又被撒一個白布搭包兒，將我與二十八宿並五方揭諦，盡皆裝去，復用繩綑了。是我當夜脫逃，救了星辰等眾與我唐僧等。後為找尋衣缽，又驚醒那怪，與天兵趕戰。那怪又拿出搭包兒，理弄之時，我卻知道前音，遂走了。眾等被他依然裝去。我無計可施，特來拜求師相一助力也。」祖師道：「我當年威鎮北方，統攝真武之位，剪伐天下妖邪，乃奉玉帝敕旨。後又披髮跣足，踏騰蛇神龜，領五雷神將、巨虯獅子、猛獸毒龍，收降東北方黑氣妖氛，乃奉元始天尊符召。今日靜享武當山，安逸太和殿，一向海岳平寧，乾坤清泰。奈何我南贍部洲並北俱蘆洲之地，妖魔剪伐，邪鬼潛蹤，今蒙大聖下降，不得不行。只是上界無有旨意，不敢擅動干戈。假若法遣眾神，又恐玉帝見罪；十分卻了大聖，又是我逆了人情。我諒著那西路上縱有妖邪，也不為大害。我今著龜、蛇二將並五大神龍與你助力，管教擒妖精，救你師之難。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空は仙境の景色を眺めながら、早くも一天門（いってんもん）、二天門（にてんもん）、三天門（さんてんもん）へと進んだ。太和宮（たいわきゅう）の外に来ると、めでたい光と気の間に五百の霊官（れいかん）が群がっていた。迎えに出た霊官たちが言った。「こちらへ来られるのは、どなたですか。」
    悟空「私は斉天大聖（せいてんたいせい）、孫悟空（そんごくう）です。師相（ししょう）にお目にかかりたい。」
    霊官たちは聞くとすぐに取り次いだ。真武は御殿を下り、太和宮へ迎え入れた。悟空は礼をして言った。「一つ、お力をお借りしたいことがあります。」
    真武「どのようなことだ。」
    悟空「唐僧（とうそう）をお守りして西天（さいてん）へ経を取りに行く途中、難儀に遭いました。西牛賀洲（さいごかしゅう）に小西天（しょうさいてん）という山があり、その小雷音寺（しょうらいおんじ）に一人の妖魔がいるのです。師は山門を入り、阿羅（あら）、掲諦（ぎゃてい）、比丘（びく）、聖僧が並んでいるのを見て本物の仏だと思い、身を伏せて拝んだとたん、捕らえられ縛られました。私も油断して、一対の金鐃（きんにょう）を投げられ、その中へ閉じ込められました。わずかな隙間もなく、口は挟み道具で締めたように合わさっていました。金頭掲諦（きんとうぎゃてい）が玉帝（ぎょくてい）に奏上してくださり、勅命を受けた二十八宿（にじゅうはっしゅく）がその夜に下界へ降りてきましたが、どうしても開けられません。幸い亢金竜（こうきんりゅう）が角を鐃の中へ通し、私を外へ渡してくれました。そこで金鐃を打ち砕いたため、妖怪を起こしてしまいました。追いつ追われつ戦ううち、白布の肩掛け袋を投げられ、私も二十八宿も五方掲諦（ごほうぎゃてい）も、すっかり袋へ入れられ、また縄で縛られました。その夜、私は脱出し、星神たちと唐僧たちを救いました。ところが、後で衣や鉢を捜したため、また妖怪を起こしてしまい、天兵とともに追いかけられて戦ったのです。妖怪がまた袋を取り出して扱い始めたとき、私は前のことを知っていたので逃げました。皆は前と同じく袋に入れられました。もう打つ手がなく、こうして師相のお力添えをお願いに参ったのです。」
    真武「かつて私が北方に威を振るい、真武の位を統べて天下の妖邪を討ち滅ぼしたのは、玉帝の勅命を奉じてのことだった。その後、髪をほどき裸足となり、騰蛇（とうだ）と神亀（しんき）を踏み、五雷神将（ごらいしんしょう）、巨大な虯竜（きゅうりゅう）と獅子、猛獣と毒竜を率い、東北方の黒い気と妖気を降したのは、元始天尊（げんしてんそん）の符命によるものだった。今は武当山に静かに暮らし、太和殿（たいわでん）で安らいでいる。ずっと海も山も穏やかで、天地は清らかに治まってきた。私の南贍部洲と北倶蘆洲（ほっくるしゅう）では、妖魔は討ち滅ぼされ、邪鬼は姿を隠しているのだが、今、大聖（たいせい）にわざわざ来ていただいた以上、動かぬわけにもいかぬ。ただ、上界からの命がないので、勝手に戦を起こすわけにはいかない。術をもって神々を遣わせば、玉帝にとがめられる恐れがある。さりとて、大聖をきっぱり断るのも人情に背く。西への道に妖邪がいたとしても、それほど大害にはなるまい。そこで、亀・蛇の二将と五大神竜（ごだいしんりゅう）をお前の助けに遣わそう。必ず妖怪を捕らえ、師の難儀を救ってくれるはずだ。」
  "translation_status": "reviewed"
- "id": "xy-ch66-007"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者拜謝了祖師，即同龜、蛇、龍神各帶精銳之兵，復轉西洲之界。不一日，到了小雷音寺，按下雲頭，徑至山門外叫戰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 138
    "line_end": 138
  "translation_ja": "悟空は真武に礼を述べた。そして亀・蛇の二将と竜神たちがそれぞれ精鋭の兵を伴うと、ともに西の洲の境へ戻った。一日もたたぬうちに小雷音寺に着き、雲を降ろして、まっすぐ山門の外から戦いを挑んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch66-008"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那黃眉大王聚眾怪在寶閣下說：「孫行者這兩日不來，又不知往何方去借兵也。」說不了，只見前門上小妖報道：「行者引幾個龍、蛇、龜相，在門外叫戰。」妖魔道：「這猴兒怎麼得個龍、蛇、龜相？此等之類，卻是何方來者？」隨即披掛，走出山門高叫：「汝等是那路龍神，敢來造吾仙境？」五龍、二將相貌崢嶸，精神抖擻，喝道：「那潑怪！我乃武當山太和宮混元教主蕩魔天尊之前五位龍神、龜蛇二將。今蒙齊天大聖相邀，我天尊符召，到此捕你。你這妖精，快送唐僧與天星等出來，免你一死；不然，將這一山之怪碎劈其屍，幾間之房燒為灰燼。」那怪聞言，心中大怒道：「這畜生，有何法力，敢出大言？不要走，吃吾一棒。」這五條龍翻雲使雨，那兩員將播土揚沙，各執槍刀劍戟，一擁而攻；孫大聖又使鐵棒隨後。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    一方、黄眉大王（こうびだいおう）は宝閣の下に妖怪たちを集めて話していた。「孫行者（そんぎょうじゃ）はこの二日ほど来ぬ。またどこへ兵を借りに行ったのやら。」
    言い終わらぬうちに、前の門から小妖が報告に来た。「行者が何人かの竜・蛇・亀の姿の者を連れ、門の外で戦いを挑んでおります。」
    黄眉大王「あの猿め、どうして竜や蛇や亀の姿の者を手に入れたのだ。そいつらは、どこから来た連中だろう。」
    すぐに武具を着けて山門を出ると、黄眉大王は大声で言った。「お前たちはどこの竜神だ。よくもわしの仙境へ来たものだな。」
    五龍（ごりゅう）と二将は、険しい顔をして気を奮い立たせ、喝した。「不届きな妖怪め。我らは武当山太和宮の混元教主（こんげんきょうしゅ）、蕩魔天尊に仕える五人の竜神と亀蛇の二将（きだのにしょう）だ。斉天大聖のお招きにより、天尊の符命を奉じ、お前を捕らえに来た。妖怪め、早く唐僧と天の星神たちを送り出せ。そうすれば命は助けてやる。さもなくば、この山じゅうの妖怪の死骸を細かく切り刻み、その幾棟かの建物も焼いて灰にしてくれる。」
    それを聞いた黄眉大王は、激怒して言った。「畜生どもめ。どんな法力があって、そんな大口をたたく。逃げるな、わしの棒を食らえ。」
    五匹の竜は雲を翻して雨を降らせ、二人の将は土砂を巻き上げた。それぞれ槍、刀、剣、戟を取り、一斉に攻めかかる。悟空も鉄棒を使って後に続いた。まことに激しい戦いだった。
  "translation_status": "reviewed"
- "id": "xy-ch66-009"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": "兇魔施武，行者求兵。兇魔施武，擅據珍樓施佛像；行者求兵，遠參寶境借龍神。龜蛇生水火，妖怪動刀兵。五龍奉旨來西路，行者因師在後收。劍戟光明搖彩電，槍刀晃亮閃霓虹。這個狼牙棒，強能短軟；那個金箍棒，隨意如心。只聽得扢撲響聲如爆竹，叮噹音韻似敲金。水火齊來徵怪物，刀兵共簇繞精靈。喊殺驚狼虎，諠譁振鬼神。渾戰正當無勝處，妖魔又取寶和珍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    凶魔は武を振るい、悟空は兵を求める。
    凶魔は武を振るい、宝の楼を勝手に占めて仏の姿を装う。
    悟空は兵を求め、遥かな仙境を訪れて竜神を借りる。
    亀蛇は水火を生じ、妖怪は武器を振るう。
    五龍は命を奉じて西の道へ、悟空は師のため後ろを固める。
    剣戟の光は色鮮やかな稲妻を揺らし、槍刀の輝きは虹のようにきらめく。
    こちらの狼牙棒（ろうがぼう）は、強くも短く柔らかくもなり、
    あちらの金箍棒（きんこぼう）は、意のままに変わる。
    どすんばたんと爆竹のような響き、ちんちょうと金を打つような音。
    水火が一度に妖怪を攻め、武器が群がって魔物を囲む。
    殺せという叫びに狼と虎は驚き、とどろく声に鬼神も震える。
    入り乱れて勝負がつかぬうち、妖魔はまた宝を取り出した。
  "translation_status": "reviewed"
- "id": "xy-ch66-010"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者帥五龍、二將，與妖魔戰經半個時辰，那妖精即解下搭包在手。行者見了心驚，叫道：「列位仔細。」那龍神、蛇、龜不知甚麼仔細，一個個都停住兵，近前抵擋。那妖精幌的一聲，把搭包兒撇將起去。孫大聖顧不得五龍、二將，駕觔斗，跳在九霄逃脫。他把個龍神、龜、蛇一搭包子又裝將去了。妖精得勝回寺，也將繩綑了，擡在地窖子裡蓋住不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    悟空は五龍と二将を率い、黄眉大王と半時辰（はんじしん）ほど戦った。すると黄眉大王は、肩掛け袋を解いて手に取った。悟空はぎょっとして叫んだ。「皆、気をつけろ！」
    竜神も蛇も亀も、何に気をつけるのか分からず、みな武器の手を止め、近づいて防ごうとした。黄眉大王は、ばっと袋を投げ上げた。悟空は五龍と二将に構っていられず、觔斗雲で天高く飛び上がって逃れた。竜神も亀も蛇も、また袋一つですっかり取り込まれてしまった。黄眉大王は勝って寺へ戻り、これらも縄で縛らせ、地下蔵へ運んで蓋をさせた。このことはひとまずおく。
  "translation_status": "reviewed"
- "id": "xy-ch66-011"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那大聖落下雲頭，斜欹在山巔之上，沒精沒采，懊恨道：「這怪物十分利害。」不覺的合著眼，似睡一般。猛聽得有人叫道：「大聖，休推睡，快早上緊求救，你師父性命只在須臾間矣。」行者急睜睛跳起來看，原來是日值功曹。行者喝道：「你這毛神，一向在那方貪圖血食，不來點卯，今日卻來驚我。伸過孤拐來，讓老孫打兩棒解悶。」功曹慌忙施禮道：「大聖，你是人間之喜仙，何悶之有？我等早奉菩薩旨令，教我等暗中護佑唐僧，乃同土地等神，不敢暫離左右，是以不得常來參見，怎麼反見責也？」行者道：「你既是保護，如今那眾星、揭諦、伽藍並我師等，被妖精困在何方？受甚罪苦？」功曹道：「你師父、師弟都吊在寶殿廊下，星辰等眾都收在地窖之間受罪。這兩日不聞大聖消息，卻才見妖精又拿了神龍、龜、蛇，又送在地窖裡去了，方知是大聖請來的兵，小神特來尋大聖。大聖莫辭勞倦，千萬再急急去求救援。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    見れば悟空は雲を降り、山頂に斜めに身をもたせ、気力もなく、悔しげに言った。「あの化け物は、とんでもなく手ごわい。」
    いつしか目を閉じ、眠ったようになった。すると突然、声の主が呼んだ。「大聖、眠ったふりはおやめください。すぐ急いで助けを求めに行ってください。お師匠さまの命は、もうわずかな間しか持ちません。」
    悟空はぱっと目を開き、跳ね起きて見ると、日値功曹（にっちこうそう）だった。悟空は怒鳴った。「この下っ端の神め。今までどこで肉の供え物をむさぼり、点呼にも来ず、今日は俺を驚かしに来たのか。足首を出せ。この俺が棒で二つばかり殴って、憂さを晴らしてやる。」
    日値功曹は慌てて礼をした。「大聖、あなたは人の世の喜びの仙人ではありませんか。何を憂えておられるのです。私どもは以前から菩薩の仰せを受け、唐僧をひそかにお守りしております。土地神（とちがみ）たちと一緒に、片時もおそばを離れられません。それでいつもご挨拶には来られないのに、どうしてかえっておとがめになるのですか。」
    悟空「守っているというなら、今、星神や掲諦、伽藍（がらん）、それに俺のお師匠さまたちは、妖怪にどこへ閉じ込められ、どんな苦しみを受けている。」
    日値功曹「お師匠さまと弟弟子の方々は宝殿の廊下に吊るされ、星神たちは地下蔵へ押し込められて苦しんでおります。この二日ほど大聖の消息を聞きませんでしたが、先ほど妖怪が神竜、亀、蛇を捕らえ、また地下蔵へ送り込むのを見て、ようやく大聖のお呼びになった兵だと分かりました。それで、私がわざわざ大聖を捜しに来たのです。どうか疲れをいとわず、ぜひとももう一度、大急ぎで救援をお求めください。」
  "translation_status": "reviewed"
- "id": "xy-ch66-012"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言及此，不覺對功曹滴淚道：「我如今愧上天宮，羞臨海藏；怕問菩薩之原由，愁見如來之玉像。才拿去者，乃真武師相之龜、蛇、五龍聖眾。教我再無方求救，奈何？」功曹笑道：「大聖寬懷，小神想起一處精兵，請來斷然可降。適才大聖至武當，是南贍部洲之地。這枝兵也在南贍部洲盱眙山蠙城，即今泗洲是也。那裡有個大聖國師王菩薩，神通廣大；他手下有一個徒弟，喚名小張太子，還有四大神將：昔年曾降伏水母娘娘。你今親去請他，他來施恩相助，準可捉怪救師也。」行者心喜道：「你且去保護我師父，勿令傷他，待老孫去請也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    悟空はそこまで聞くと、思わず日値功曹の前で涙をこぼした。「今の俺は、天宮（てんきゅう）へ上がるのも恥ずかしく、海の竜宮を訪ねるのも面目ない。菩薩にいきさつを問われるのが恐ろしく、如来（にょらい）のお姿を仰ぐのもつらい。さっき捕らえられたのは、真武師相（しんぶししょう）の亀・蛇と五龍の聖なる方々だ。もう助けを求めるあてがない。どうすればいい。」
    日値功曹は笑って言った。「大聖、お気を楽になさってください。精兵のいる所を一つ思い出しました。お呼びすれば、きっと降せます。先ほど行かれた武当（ぶとう）は南贍部洲にありますが、その兵も南贍部洲の盱眙山（くいざん）、蠙城（ひんじょう）におります。今の泗洲（ししゅう）です。そこには大聖国師王菩薩（たいせいこくしおうぼさつ）という、神通力の広大なお方がおられます。配下に小張太子（しょうちょうたいし）という弟子が一人、それに四大神将（しだいしんしょう）がおり、昔、水母娘娘（すいぼにゃんにゃん）を降伏させたことがあります。今、ご自身でお招きに行かれれば、慈悲を施して助けてくださり、必ず妖怪を捕らえて師を救えましょう。」
    悟空は喜んで言った。「お前は戻ってお師匠さまを守り、傷つけさせないでくれ。俺が招きに行ってこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch66-013"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者縱起觔斗雲，躲離怪處，直奔盱眙山，不一日早到。細觀，真好去處："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 147
    "line_end": 147
  "translation_ja": "悟空は觔斗雲を起こし、妖怪のいる所を避けて、まっすぐ盱眙山へ飛んだ。一日もたたぬうちに到着した。よくよく眺めれば、実によい所だった。"
  "translation_status": "reviewed"
- "id": "xy-ch66-014"

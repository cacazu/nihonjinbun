  "kind": "verse"
  "origin": "source"
  "source_text": "南近江津，北臨淮水，東通海嶠，西接封浮。山頂上有樓觀崢嶸，山凹裡有澗泉浩湧。嵯峨怪石，槃秀喬松。百般果品應時新，千樣花枝迎日放。人如蟻陣往來多，船似雁行歸去廣。上邊有瑞巖觀、東岳宮、五顯祠、龜山寺，鍾韻香煙沖碧漢；又有玻璃泉、五塔峪、八仙臺、杏花園，山光樹色映蠙城。白雲橫不度，幽鳥倦還鳴。說甚泰嵩衡華秀，此間仙景若蓬瀛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    南は川の渡し場に近く、北は淮水（わいすい）に臨み、東は海辺の山へ通じ、西は封浮（ほうふ）に接する。
    頂には楼観が高くそびえ、山のくぼみには谷の泉が盛んに湧く。
    怪石は険しく、丈高い松は枝を広げて美しい。
    百種の果実は季節ごとに新しく、千種の花枝は日に向かって開く。
    人は蟻の列のように多く行き交い、船は雁の群れのように続々と帰る。
    山上には瑞巌観（ずいがんかん）、東岳宮（とうがくきゅう）、五顕祠（ごけんし）、亀山寺（きざんじ）があり、鐘の響きと香の煙が青空へ上る。
    また玻璃泉（はりせん）、五塔峪（ごとうよく）、八仙台（はっせんだい）、杏花園（きょうかえん）があり、山の光と木々の色が蠙城を映す。
    白雲は横たわって動かず、奥山の鳥は疲れてなお鳴く。
    泰山（たいざん）・嵩山（すうざん）・衡山（こうざん）・華山（かざん）の美しさを何ほどのことと言おう。この仙境は蓬莱（ほうらい）・瀛洲（えいしゅう）にも等しい。
  "translation_status": "reviewed"
- "id": "xy-ch66-015"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖觀玩不盡，徑過了淮河，入蠙城之內，到大聖禪寺山門外。又見那殿宇軒昂，長廊彩麗，有一座寶塔崢嶸。真是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 151
    "line_end": 151
  "translation_ja": "悟空は見ても見飽きぬまま、まっすぐ淮河（わいが）を渡って蠙城へ入り、大聖禅寺（たいせいぜんじ）の山門の外に着いた。ここにも高々とした殿堂、彩り美しい長廊があり、一基の宝塔がそびえていた。まさに、"
  "translation_status": "reviewed"
- "id": "xy-ch66-016"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    插雲倚漢高千丈，仰視金瓶透碧空。
    上下有光凝宇宙，東西無影映簾櫳。
    風吹寶鐸聞天樂，日映冰虯對梵宮。
    飛宿靈禽時訴語，遙瞻淮水渺無窮。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 152
    "line_end": 155
  "translation_ja": |-
    雲を貫き天の川にもたれ、高さは千丈、仰げば頂の金瓶は青空を突く。
    上下に光を集めて宇宙を満たし、東西には影もなく、簾や窓を照らす。
    風が宝鐸（ほうたく）を吹き鳴らして天の楽を聞かせ、日は氷の虯竜を照らし、仏殿に向き合わせる。
    霊鳥は飛び来て宿り、時に語るように鳴き、遥かに望む淮水は果てしない。
  "translation_status": "reviewed"
- "id": "xy-ch66-017"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者且觀且走，直至二層門下。那國師王菩薩早已知之，即與小張太子出門迎迓。相見敘禮畢，行者道：「我保唐僧西天取經，路上有個小雷音寺，那裡有個黃眉怪，假充佛祖。我師父不辨真偽，就下拜，被他拿了。又將金鐃把我罩住，幸虧天降星辰救出。是我打碎金鐃，與他賭鬥，又將一個布搭包兒，把天神、揭諦、伽藍與我師父、師弟盡皆裝了進去。我前去武當山請玄天上帝救援，他差五龍、龜、蛇拿怪，又被他一搭包子裝去。弟子無依無倚，故來拜請菩薩，大展威力，將那收水母之神通，拯生民之妙用，同弟子去救師父一難。取得經回，永傳中國，揚我佛之智慧，興般若之波羅也。」國師王道：「你今日之事，誠我佛教之興隆，理當親去。奈時值初夏，正淮水泛漲之時。新收了水猿大聖，那廝遇水即興，恐我去後，他乘空生頑，無神可治。今著小徒領四將和你去助力，煉魔收伏罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    悟空は眺めながら歩き、まっすぐ二重目の門まで来た。国師王菩薩（こくしおうぼさつ）は早くも来訪を知っており、小張太子と一緒に門を出て迎えた。対面して挨拶を済ませると、悟空が言った。「唐僧をお守りして西天へ経を取りに行く途中、小雷音寺という所に出ました。そこには黄眉（こうび）の妖怪がいて、仏祖になりすましていたのです。師は真偽を見分けられず、ひれ伏して拝み、捕らえられました。私も金鐃で覆われましたが、幸い天から星神たちが降りてきて救い出してくれました。私は金鐃を打ち砕き、妖怪と勝負しました。すると今度は布の肩掛け袋一つで、天の神々、掲諦、伽藍、師と弟弟子たちを、みな取り込んでしまったのです。武当山へ行って玄天上帝（げんてんじょうてい）に救援をお願いしたところ、五龍と亀・蛇を妖怪退治に遣わしてくださいましたが、また袋一つで取り込まれました。弟子の私は頼る人もなく、それで菩薩をお招きに参りました。どうか大いなる威力をお振るいになり、あの水母（すいぼ）を収めた神通力と、人々を救う霊妙なお力で、私と一緒に師の難儀をお救いください。経を得て帰れば、末永く中国へ伝え、仏の智慧を広め、般若波羅蜜（はんにゃはらみつ）の教えを興しましょう。」
    国師王菩薩「お前の今の仕事は、まさに仏教を栄えさせるものだ。道理からいえば私自身が行くべきなのだが、折しも初夏、淮水が増水する時期だ。最近降した水猿大聖（すいえんたいせい）は、水に会うとすぐ勢いづく。私が去れば隙に乗じて暴れ出し、抑える神がいなくなる恐れがある。そこで弟子に四将を率いさせ、お前と一緒に助力へ向かわせよう。魔を練り伏せ、降伏させるがよい。」
  "translation_status": "reviewed"
- "id": "xy-ch66-018"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者稱謝，即同四將並小張太子，又駕雲回小西天，直至小雷音寺。小張太子使一條楮白槍，四大將掄四把錕鋘劍，和孫大聖上前罵戰。小妖又去報知，那妖王復帥群妖鼓譟而出道：「猢猻，你今又請得何人來也？」說不了，小張太子指揮四將，上前喝道：「潑妖精！你面上無肉，不認得我等在此？」妖王道：「是那方小將，敢來與他助力？」太子道：「吾乃泗州大聖國師王菩薩弟子，帥領四大神將，奉令擒你。」妖王笑道：「你這孩兒有甚武藝，擅敢到此輕薄？」太子道：「你要知我武藝，等我道來："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    悟空は礼を述べ、四将と小張太子を連れて、また雲に乗り、小西天へ戻ってまっすぐ小雷音寺に至った。小張太子は一本の楮白槍（ちょはくそう）を使い、四大将は四振りの錕鋘剣（こんごけん）を振るい、悟空とともに前へ出て、罵りながら戦いを挑んだ。小妖がまた知らせに行くと、黄眉大王は再び妖怪の群れを率い、わめきながら出てきて言った。「猿め、今度は誰を招いてきたのだ。」
    言い終わらぬうちに、小張太子は四将を指揮し、前へ出て喝した。「不届きな妖怪め。その顔には肉もないのか。我らがここにいるのを見ても分からぬのか。」
    黄眉大王「どこの若造だ。よくもあやつの助けに来たものだな。」
    小張太子「私は泗州（ししゅう）の大聖国師王菩薩の弟子だ。四大神将を率い、命を奉じてお前を捕らえに来た。」
    黄眉大王は笑った。「お前のような小僧にどんな武芸があって、ここへ来て無礼を働くのだ。」
    小張太子「私の武芸を知りたければ、話して聞かせよう。
  "translation_status": "reviewed"
- "id": "xy-ch66-019"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    祖居西土流沙國，我父原為沙國王。
    自幼一身多疾苦，命干華蓋惡星妨。
    因師遠慕長生訣，有分相逢捨藥方。
    半粒丹砂祛病退，願從修行不為王。
    學成不老同天壽，容顏永似少年郎。
    也曾趕赴龍華會，也曾騰雲到佛堂。
    捉霧拿風收水怪，擒龍伏虎鎮山場。
    撫民高立浮屠塔，靜海深明舍利光。
    楮白槍尖能縛怪，淡緇衣袖把妖降。
    如今靜樂蠙城內，大地揚名說小張！」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 160
    "line_end": 169
  "translation_ja": |-
    先祖の住まいは西土の流沙国（りゅうさこく）、父はその砂の国の王だった。
    幼いころから身は病に苦しみ、命には華蓋（かがい）の凶星が差し障った。
    師を慕い、遥かに長生の秘訣を求め、縁あって出会い、薬方を授けられた。
    半粒の丹砂（たんしゃ）で病は去り、王とはならず修行に従うことを願った。
    学び遂げて老いず、寿命は天と等しく、顔はいつまでも少年のまま。
    竜華会（りゅうげえ）へ駆けつけたこともあり、雲に乗って仏堂へ行ったこともある。
    霧を捕らえ風をつかんで水の怪を収め、竜を捕らえ虎を伏せて山々を鎮めた。
    民を安んじ、高く浮屠塔（ふととう）を建て、海を静め、舎利（しゃり）の光を深く輝かせた。
    楮白槍の穂先は怪を縛り、薄墨色の衣の袖は妖を降す。
    今は蠙城の中に静かに暮らし、天下に轟くその名は小張（しょうちょう）！」
  "translation_status": "reviewed"
- "id": "xy-ch66-020"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "妖王聽說，微微冷笑道：「那太子，你捨了國家，從那國師王菩薩，修的是甚麼長生不老之術？只好收捕淮河水怪，卻怎麼聽信孫行者誑謬之言，千山萬水，來此納命？看你可長生可不老也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 170
    "line_end": 170
  "translation_ja": "聞いた黄眉大王は、かすかに冷笑した。「そこの太子よ。お前は国を捨て、あの国師王菩薩について、一体どんな不老長生の術を修めたのだ。淮河の水怪を捕らえるぐらいしかできぬくせに、どうして孫行者のでたらめを信じ、千山万水を越えて命を捨てに来た。長生きできるか、老いずにいられるか、見ていてやろう。」"
  "translation_status": "reviewed"
- "id": "xy-ch66-021"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小張聞言，心中大怒，纏槍當面便刺；四大將一擁齊攻；孫大聖使鐵棒上前又打。好妖精，公然不懼，掄著他那短軟狼牙棒，左遮右架，直挺橫衝。這場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 172
    "line_end": 172
  "translation_ja": "小張太子はそれを聞いて激怒し、槍を取り回して正面から突いた。四大将も一斉に攻めかかり、悟空も鉄棒を使って前へ出て打ちかかった。さすが黄眉大王、まるで恐れず、短くしなやかな狼牙棒を振るい、左を遮り右を受け、まっすぐ突進し横へも走った。まことに激しい戦いだった。"
  "translation_status": "reviewed"
- "id": "xy-ch66-022"
  "section_id": "chapter-66"
  "kind": "verse"
  "origin": "source"
  "source_text": "小太子，楮白槍，四柄錕鋘劍更強。悟空又使金箍棒，齊心圍繞殺妖王。妖王其實神通大，不懼分毫左右搪。狼牙棒是佛中寶，劍砍槍掄莫可傷。只聽狂風聲吼吼，又觀惡氣混茫茫。那個有意思凡弄本事，這個專心拜佛取經章。幾番馳騁，數次張狂。噴雲霧，閉三光，奮怒懷嗔各不良。多時三乘無上法，致令百藝苦相將。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    若き太子に楮白槍、四振りの錕鋘剣はなお強い。
    悟空も金箍棒を使い、一心に妖王を囲んで討ちかかる。
    妖王は実に神通力が大きく、少しも恐れず左右へ払う。
    狼牙棒は仏の宝、剣で斬ろうと槍を振ろうと傷つかない。
    荒れ狂う風の轟きを聞き、茫々と混じる悪気を見る。
    あちらは俗世を恋うて腕を弄び、こちらはひたすら仏を拝み経を求める。
    幾たびも駆け、何度も猛る。
    雲霧を噴いて三光（さんこう）を閉ざし、ともに怒りを抱いて荒々しい。
    長く三乗（さんじょう）の無上の法を争えば、百の技も苦しいせめぎ合いとなる。
  "translation_status": "reviewed"
- "id": "xy-ch66-023"
  "section_id": "chapter-66"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "概眾爭戰多時，不分勝負。那妖精又解搭包兒。行者又叫：「列位仔細。」太子並眾等不知「仔細」之意。那怪滑的一聲，把四大將與太子，一搭包又裝將進去。只是行者預先知覺走了。那妖王得勝回寺，又教取繩綑了，送在地窖，牢封固鎖不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch66-1455615"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455615&title=西遊記/第066回&variant=zh-hant"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    皆が長く争ったが、勝敗はつかなかった。黄眉大王はまた肩掛け袋を解いた。悟空はまた叫んだ。「皆、気をつけろ！」
    小張太子たちは、その「気をつけろ」の意味が分からなかった。黄眉大王はするりと袋を出し、四大将と太子を、また袋一つへすっかり取り込んだ。ただ悟空だけは、先に気づいて逃げていた。黄眉大王は勝って寺へ戻り、また縄を持ってこさせて縛り、地下蔵へ入れ、しっかり封じて鍵をかけた。このことはひとまずおく。
  "translation_status": "reviewed"

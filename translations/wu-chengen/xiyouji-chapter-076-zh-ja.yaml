  "translation_ja": |-
    黄牙老象はすぐに小妖を三千集め、大道のそばへ出て陣を敷いた。青い旗を持つ伝令一人に、行ったり来たりしながら触れ回らせた。
    青旗の伝令「孫行者、早く出てきて、わしらの第二の大王さまと勝負しろ！」
    八戒はそれを聞き、笑って言った。
    八戒「兄貴、『嘘をついても土地の者はだませない』っていうじゃないか。またでたらめを並べて、いんちきをしているな。妖怪を降したから、輿を担いで師匠を送りに来ると言ったのに、また戦いを挑んでくるのはどういうわけだ？」
    悟空「兄の妖怪はもう俺に降されて、顔も出せん。『孫（そん）』の一字を聞くだけで頭が痛くなるくらいだ。きっと二番目の妖怪が、俺たちを送るのを不服に思って、戦いを挑んでいるんだろう。なあ弟よ、あの妖怪どもは三兄弟で、あれほど義理堅い。俺たちも三兄弟なのに、少しは仲間の義理というものがないのか？　俺はもう一番目を降した。二番目が出てきたなら、お前が戦ってみてもよかろう。」
    八戒「何が怖いもんか。行ってひと勝負してくるぞ。」
    悟空「行くなら、さっさと行け。」
    八戒は笑った。
    八戒「兄貴、行くには行くが、あの縄を貸してくれよ。」
    悟空「どうするつもりだ？　お前には腹へ潜り込む腕も、心臓に結びつける腕もない。何に使うんだ？」
    八戒「腰に結んで命綱にするんだ。兄貴と沙悟浄で後ろの端を持って、俺を送り出し、戦わせてくれ。勝てそうなら緩めてくれりゃ、俺が捕らえる。負けそうになったら引き戻して、向こうへ連れていかれないようにしてくれ。」
    悟空はひそかに笑って言った。
    悟空「またひとつ、ばかをからかってやれるぞ。」
    本当に八戒の腰へ縄を結ぶと、けしかけて戦いに出した。

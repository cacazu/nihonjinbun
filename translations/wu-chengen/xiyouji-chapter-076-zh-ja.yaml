  "source_text": "這坡下三藏看見，又惱行者道：「悟空，怪不得悟能咒你死哩，原來你兄弟全無相親相愛之意，專懷相嫉相妒之心。他那般說，教你扯扯救命索，你怎麼不扯，還將索子丟去？如今教他被害，卻如之何？」行者笑道：「師父也忒護短，忒偏心。罷了，像老孫拿去時，你略不掛念，左右是捨命之材；這獃子才自遭擒，你就怪我。也教他受些苦惱，方見取經之難。」三藏道：「徒弟啊，你去，我豈不掛念？想著你會變化，斷然不至傷身。那獃子生得狼犺，又不會騰那，這一去，少吉多凶。你還去救他一救。」行者道：「師父不得報怨，等我去救他一救。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    斜面の下からこれを見ていた三蔵は、また悟空を叱った。
    三蔵「悟空、悟能がお前を死んだと言い立てるのも無理はない。お前たち兄弟には、親しみ合い、愛し合う心がまるでなく、妬み合う心ばかりなのだね。あれほど命綱を引いてくれと言ったのに、どうして引かず、縄まで放り出したのだ？　今やあれをひどい目に遭わせてしまって、どうするつもりだ？」
    悟空は笑った。
    悟空「お師匠さまは欠点をかばいすぎ、えこひいきしすぎです。まったく、私が連れていかれたときには、少しもお気にかけず、どうせ命を捨てるためのやつだとお思いなのですね。あのばかが捕らえられた途端、私をお責めになる。あいつにも少し苦労させれば、取経の難しさが分かります。」
    三蔵「弟子よ、お前が行けば、私が心配しないわけがないだろう。ただ、お前は変化ができるから、身を傷つけられることは決してないと思っていたのだ。あれは大柄で不器用なうえ、素早く身をかわすこともできない。連れていかれたからには、助かる見込みは少なく、危険ばかりだ。やはり行って救ってやっておくれ。」
    悟空「お師匠さま、もうお責めにならないでください。助けに行ってきます。」
  "translation_status": "reviewed"
- "id": "xy-ch76-013"

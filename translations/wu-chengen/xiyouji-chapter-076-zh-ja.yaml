  "source_text": "大聖卻飛起來看處，那獃子四肢朝上，掘著嘴，半浮半沉，嘴裡呼呼的，著然好笑：倒像八九月經霜落了子兒的一個大黑蓮蓬。大聖見他那嘴臉，又恨他，又憐他，說道：「怎的好麼？他也是龍華會上的一個人。但只恨他動不動分行李散火，又要攛掇師父念緊箍咒咒我。我前日曾聞得沙僧說，他攢了些私房，不知可有否？等我且嚇他一嚇看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 136

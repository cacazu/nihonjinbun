  "source_text": "行者聞言，即伸手在耳朵竅中摸出，真個是塊馬鞍兒銀子，足有四錢五六分重。拿在手裡，忍不住哈哈的一聲大笑。那獃子認是行者聲音，在水裡亂罵道：「天殺的弼馬溫，到這們苦處，還來打詐財物哩。」行者又笑道：「我把你這饢糟的，老孫保師父，不知受了多少苦難，你倒攢下私房。」八戒道：「嘴臉，這是甚麼私房？都是牙齒上刮下來的，我不捨得買來嘴吃，留了買匹布兒做件衣服，你卻嚇了我的。還分些兒與我。」行者道：「半分也沒得與你。」八戒罵道：「買命錢讓與你罷，好道也救我出去是。」行者道：「莫發急，等我救你。」將銀子藏了，即現原身，掣鐵棒，把獃子划攏，用手提著腳，扯上來，解了繩。八戒跳起來，脫下衣裳，整乾了水，抖一抖，潮漉漉的披在身上，道：「哥哥，開後門走了罷。」行者道：「後門裡走，可是個長進的？還打前門上去。」八戒道：「我的腳綑麻了，跑不動。」行者道：「快跟我來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"

  "known_gaps":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-001"
    "description_ja": "回題の心神は悟空、木母は五行の寓意で八戒を指すと解した。居舍・歸性・體真は心と身体、魔と本性を重ねる表現であり、物語の具体的な動作だけに置き換えない。細かな寓意の対応には解釈の余地がある。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-002"
    "description_ja": "外公は母方の祖父。悟空が孫姓と合わせて要求する呼び名で、実際の血縁ではなく、相手を自分より下へ置く言い方。直前の『せがれ』との親族関係のずれを直してはいない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-004"
    "description_ja": "好看千里客は、遠来の客をよくもてなす意。『老乞大』諸版にも同趣旨の諺があり、単に遠くの客を眺める意味ではない。ここでは名声を気にさせる挑発の中に引かれている。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-004"
    "description_ja": "原文は『心中暗想道』で始まる一つの鉤括弧の中に、内心の自省と、相手に口を開けよと告げる言葉を続ける。訳文では応答の関係が分かるよう両者を分けた。原文の引用符は変更していない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-005"
    "description_ja": "先には前歯が砕けたとあり、ここでは上下の鋼の歯が刃のように並ぶと描かれる。前歯以外だけだと補って整合させず、底本の双方の描写を残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-007"
    "description_ja": "㮇㮇はこの場面で喉に縄が残る不快感を表すと解した。㮇には火をかき立てる棒・かき動かす意が見えるが、この重語の語義は辞書で直接確定できていない。原字は残し、別字への補訂はしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-007"
    "description_ja": "掩樣の法は、見かけで本当の姿を隠す術をいうと解した。縄が毛の変化であるという説明であり、妖怪の痛みまで幻だったことに変更してはいない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-008"
    "description_ja": "底本は『侮著臉』。直前に頬を打たれた文脈から、顔を押さえる動作と解した。侮の字面だけでは通常この動作を表さず、原字を保持して留保する。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-015"
    "description_ja": "原文は五閻王。十王のうち第五の王である閻羅王への呼称と解し、五人の王という複数にはしていない。原文の他という単数の指示とも整合する。ここで語っているのは使者を装った悟空であり、実際の冥界からの命令ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-015"
    "description_ja": "この発言の前の原文は『獃子道：」』と開きと逆向きの引用符になっている。原文は保存し、八戒の応答として日本語の引用範囲を整えた。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-016"
    "description_ja": "八戒は四銭六分の銀塊だと説明し、取り出した語りは四銭五六分とする。数値を統一せず残した。銭・分はここでは銀の重さで、現代の硬貨の額面や日本の制度へ換算しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-018"
    "description_ja": "原詩には大魔が仲を取り持ったとある。大妖魔という表現を残し、ここから特定の一人を割り当てたり、別の回の説明に合わせて字を補訂したりはしていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-021"
    "description_ja": "善勝はここではたいへん善良である意。漢典もこの発言を用例に示す。勝負に強い意や、同じ名の古代の刀とは区別する。悟空の自己説明として訳し、語り手の評価へ置き換えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-023"
    "description_ja": "原文も『……如此如此』として計画の具体的な部分を伏せている。訳文の省略ではなく原文の表現であり、内容を推測して補っていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-025"
    "description_ja": "底本は經云として『泰極否還生』を引く。泰・否には通じることと塞がることの対があるが、この句の厳密な典拠は未確定。特定の経典の直接引用だと断定しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-027"
    "description_ja": "彪は虎の子を表す語義により訳した。老虎との対比、雄という性別、白面という容貌を保ち、豹へ取り替えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-027"
    "description_ja": "原文は『伶俐狐狸當道行』。都市の役割を並べる文脈から、道行を道を導く役と暫定的に解した。公開辞書でこの用法そのものを確定できず、通常の『道行』の修行の力という語義を機械的に当てはめなかった。文引は往来・伝達に使う文書と解したが、特定の官制・文書形式までは断定しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "segment_ids":
    - "xy-ch76-029"
    "description_ja": "城門が開いた後の『吩咐』『說』は、命令した個人を原文が明記していない。名のある妖王の一人へ推測で帰属させず、話者不明とした。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

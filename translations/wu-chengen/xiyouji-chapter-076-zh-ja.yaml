    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    雲程万里鵬は兄に責められると、今度は相手を怒らせて誘い出そうと、厳しい声で叫んだ。
    雲程万里鵬「孫行者（そんぎょうじゃ）、お前の名声は耳を貫く雷のように聞こえてきたぞ。南天門（なんてんもん）の外で威を振るい、霊霄殿（れいしょうでん）の下で力を誇り、今は西天（さいてん）への道で妖怪を降し、縛り上げているという。ところが実際は、卑怯な猿だったのか。」
    悟空「なぜ俺が卑怯者なんだ？」
    雲程万里鵬「『千里（り）を来た客を厚くもてなせば、万里の先まで名を伝えてくれる』というだろう。外へ出て俺と勝負してこそ、一人前の豪傑だ。人の腹の中で悪さをするとは何事だ。卑怯者でなくて何だ？」
    悟空は聞くと、心の中で考えた。
    悟空「そうだ、そうだ。今ここで腸を引きちぎり、肝を突き破って、この妖怪を殺すのは造作もない。だが、それでは確かに俺の名がすたる。よし、よし。」
    そして告げた。
    悟空「口を開けろ。出ていってお前と勝負してやる。ただ、この洞の入口は狭苦しくて武器を使えん。広い所へ行くぞ。」
    雲程万里鵬はそれを聞くと、大小の妖怪を集めた。前にも後ろにも三万余りの妖怪が、それぞれ鋭く強い武器を持って洞を出て、三才陣（さんさいじん）を敷き、悟空が口から出れば一斉に戦おうと待ち構えた。黄牙老象（こうがろうぞう）は青毛獅子怪を支えて門外へ出ると、呼びかけた。
    黄牙老象「孫行者、豪傑なら出てこい。ここには戦いの場がある。存分に戦えるぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch76-005"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖在他肚裡，聞得外面鴉鳴鵲噪，鶴唳風聲，知道是寬闊之處。卻想著：「我不出去，是失信與他；若出去，這妖精人面獸心：先時說送我師父，哄我出來咬我，今又調兵在此。也罷，也罷，與他個兩全其美：出去便出去，還與他肚裡生下一個根兒。」即轉手，將尾上毫毛拔了一根，吹口仙氣，叫：「變！」即變一條繩兒，只有頭髮粗細，倒有四十丈長短。那繩兒理出去，見風就長粗了。把一頭拴在妖怪的心肝上，打做個活扣兒。那扣兒不扯不緊，扯緊就痛。卻拿著一頭，笑道：「這一出去，他送我師父便罷；如若不送，亂動刀兵，我也沒工夫與他打，只消扯此繩兒，就如我在肚裡一般。」又將身子變得小小的，往外爬。爬到咽喉之下，見妖精大張著方口，上下鋼牙排如利刃，忽思量道：「不好，不好。若從口裡出去扯這繩兒，他怕疼，往下一嚼，卻不咬斷了？我打他沒牙齒的所在出去。」好大聖，理著繩兒，從他那上齶子往前爬，爬到他鼻孔裡。那老魔鼻子發癢，阿啛的一聲，打了個噴嚏，直迸出行者。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"

  "source_text": "那獃子舉釘鈀跑上山崖，叫道：「妖精出來，與你豬祖宗打來。」那藍旗手急報道：「大王，有一個長嘴大耳朵的和尚來了。」二怪即出營，見了八戒，更不打話，挺槍劈面刺來；這獃子舉鈀上前迎住。他兩個在山坡前搭上手，鬥不上七八回合，獃子手軟，架不得妖魔，急回頭叫：「師兄，不好了，扯扯救命索，扯扯救命索。」這壁廂大聖聞言，轉把繩子放鬆了，拋將去。那獃子敗了陣，住後就跑。原來那繩子拖著走，還不覺；轉回來，因鬆了，倒有些絆腳，自家絆倒了一跌，爬起來又一跌。始初還跌個躘踵，後面就跌了個嘴搶地。被妖精趕上，捽開鼻子，就如蛟龍一般，把八戒一鼻子捲住，得勝回洞。眾妖凱歌齊唱，一擁而歸。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"

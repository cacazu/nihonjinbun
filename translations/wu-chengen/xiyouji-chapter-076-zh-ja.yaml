  "translation_ja": |-
    悟空は八戒の耳元へ飛び寄り、わざと声を変えて呼んだ。
    悟空「猪悟能（ちょごのう）、猪悟能。」
    八戒は慌てた。
    八戒「ついてないぞ。悟能という名は観世音菩薩（かんぜおんぼさつ）につけてもらったもので、唐僧についてからは八戒とも呼ばれている。こんな所に、俺が悟能だと知っているやつがいるとは、どういうことだ？」
    こらえ切れず、尋ねた。
    八戒「俺の法名を呼ぶのは誰だ？」
    悟空「私だ。」
    八戒「あんたは誰だ？」
    悟空「魂を取り立てる役人だ。」
    八戒は慌てて言った。
    八戒「長官さま、どこからおいでですか？」
    悟空「第五殿の閻王（えんおう）に命じられ、お前を連れに来たのだ。」
    八戒「長官さま、ひとまずお帰りになって、第五殿の閻王さまへお伝えください。あの方は兄弟子の孫悟空（そんごくう）とたいへん仲がよいのです。一日だけ猶予をくださって、明日連れに来てくださいと。」
    悟空「たわけたことを。『閻王が三更（さんこう）に死ねと定めた者を、誰が四更（しこう）まで留められよう』というだろう。さっさとついてこい。縄を掛けて引きずられたくなければな。」
    八戒「長官さま、どんな所でも少しは融通を利かせられるでしょう。こんな姿になっても、俺はまだ生きたいのです。死ぬのはもう決まっていますが、たった一日待てば、この妖怪がお師匠さまたちもみな捕らえてきます。一度顔を合わせたら、それですべておしまいにしますから。」
    悟空はひそかに笑って言った。
    悟空「よかろう。この命令書には三十人載っており、みなこのあたりにいる。捕まえてここへ連れてくるまでに、一日くらいはかかるだろう。旅費は持っているか？　少しよこせ。」
    八戒「お情けを。出家の身に、どうして旅費などありましょう？」
    悟空「旅費がないなら、縄を掛けて連れていく。私についてこい。」
    八戒は慌てた。
    八戒「長官さま、縄は掛けないでください。その縄は追命縄（ついめいじょう）といって、掛けられれば息が止まると知っています。あります、あります。あるには少しありますが、多くはありません。」
    悟空「どこにある？　早く出せ。」
    八戒「お情けを、お情けを。坊主になってから今まで、信心深い家で僧に食事を施してくれると、俺が大食らいなのを見て、施しの金もほかの者より少し多くくれました。それをここに貯めて、細かいのを合わせて銀五銭（せん）になったのです。しまっておくのに不便なので、この前町へ行ったとき、銀細工師に頼んで一つに溶かしてもらいました。ところがあいつは不心得者で、何分（ぶ）か盗み取り、四銭六分の塊が一つになってしまいました。お持ちください。」
    悟空はひそかに笑った。
    悟空「このばかは、はく股引もないというのに、どこへ隠しているんだ？」
    そして声をかけた。
    悟空「おい、銀はどこだ？」
    八戒「左の耳の穴に押し込んであります。縛られて取り出せません。ご自分でお取りください。」

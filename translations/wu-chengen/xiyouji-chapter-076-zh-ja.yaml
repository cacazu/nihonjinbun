  "translation_ja": |-
    八戒は釘鈀（ていは）を振り上げて崖へ駆け上がり、叫んだ。
    八戒「妖怪、出てこい。お前らのご先祖、この猪さまと勝負しろ！」
    青旗の伝令は急いで報告した。
    青旗の伝令「大王、口が長く、耳の大きな僧がやって来ました。」
    黄牙老象はすぐに陣を出ると、八戒を見ても何も言わず、槍を構えて顔めがけて突いた。八戒も熊手を振り上げて受け止める。二人は斜面の前で手合わせしたが、七、八合も戦わぬうちに八戒の腕はなえ、妖怪を支え切れなくなった。慌てて振り返り、叫んだ。
    八戒「兄貴、だめだ。命綱を引っ張れ、命綱を引っ張れ！」
    こちらでそれを聞いた悟空は、かえって縄を緩め、放り出してしまった。八戒は負けて、後ろへ逃げた。もともと縄を引きずって前へ行くときは気づかなかったが、引き返すと、緩んだ縄が足に絡む。自分で足を引っかけて転び、起き上がってはまた転んだ。初めはよろけて倒れる程度だったのに、しまいには口から地面へ突っ込んだ。黄牙老象は追いつき、蛟竜（こうりゅう）のように鼻を振り伸ばし、一巻きで八戒を巻き取ると、勝ち誇って洞へ帰った。妖怪たちはみな凱歌を歌い、一団となって帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch76-012"

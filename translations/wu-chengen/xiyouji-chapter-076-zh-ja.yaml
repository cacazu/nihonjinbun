- "id": "xy-ch76-002"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表孫大聖在老魔肚裡支吾一會，那魔頭倒在塵埃，無聲無氣，若不言語，想是死了，卻又把手放放。魔頭回過氣來，叫一聲：「大慈大悲齊天大聖菩薩。」行者聽見道：「兒子，莫廢工夫，省幾個字兒，只叫孫外公罷。」那妖魔惜命，真個叫：「外公，外公，是我的不是了。一差二誤吞了你，你如今卻反害我。萬望大聖慈悲，可憐螻蟻貪生之意，饒了我命，願送你師父過山也。」大聖雖英雄，甚為唐僧進步。他見妖魔哀告，好奉承的人，也就回了善念，叫道：「妖怪，我饒你，你怎麼送我師父？」老魔道：「我這裡也沒甚麼金銀、珠翠、瑪瑙、珊瑚、琉璃、琥珀、玳瑁珍奇之寶相送。我兄弟三個擡一乘香藤轎兒，把你師父送過此山。」行者笑道：「既是擡轎相送，強如要寶。你張開口，我出來。」那魔頭真個就張開口。那三魔走近前，悄悄的對老魔道：「大哥，等他出來時，把口往下一咬，將猴兒嚼碎，嚥下肚，卻不得磨害你了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    さて悟空（ごくう）は、青毛獅子怪（せいもうししかい）の腹の中でしばらく暴れた。青毛獅子怪は地面に倒れ、声も息もなかった。何も言わないので、死んだのかと思い、悟空は少し手を緩めた。青毛獅子怪は息を吹き返し、声を上げた。
    青毛獅子怪「大慈大悲の斉天大聖（せいてんたいせい）菩薩さま！」
    悟空はそれを聞いて言った。
    悟空「せがれ、無駄な手間をかけるな。何文字か省いて、孫外公（そんがいこう）さまとだけ呼べ。」
    命の惜しい青毛獅子怪は、本当にそう呼んだ。
    青毛獅子怪「外祖父さま、外祖父さま、私が悪うございました。ふとした間違いであなたを呑み込み、今では逆に苦しめられております。大聖（たいせい）さま、どうかお慈悲を。虫けらでも生きたいと願う、その心をお哀れみになって、命をお助けください。お師匠さまを山の向こうまでお送りいたします。」
    悟空は豪傑ではあったが、何より三蔵（さんぞう）を先へ進ませたかった。妖怪が哀願するのを見て、お世辞に弱いこともあり、慈悲の心を取り戻して呼びかけた。
    悟空「妖怪、助けてやろう。だが、どうやって俺の師匠を送るんだ？」
    青毛獅子怪「ここには、金銀、真珠や翡翠、メノウ、サンゴ、瑠璃、琥珀、べっ甲といった珍しい宝物もなく、贈り物はできません。私ら三兄弟が香藤（こうとう）の輿を一挺担ぎ、お師匠さまをこの山の向こうまでお送りします。」
    悟空は笑った。
    悟空「輿を担いで送ってくれるなら、宝をもらうよりよい。口を開けろ。出ていくぞ。」
    青毛獅子怪は本当に口を開けた。雲程万里鵬（うんていばんりほう）がそばへ寄り、ひそひそと告げた。
    雲程万里鵬「兄者、あいつが出てきたら、がぶりと噛みつけ。猿を噛み砕いて呑み下せば、もう兄者を苦しめることはできまい。」
  "translation_status": "reviewed"
- "id": "xy-ch76-003"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來行者在裡面聽得，便不先出去，卻把金箍棒伸出，試他一試。那怪果往下一口，扢喳的一聲，把個門牙都迸碎了。行者抽回棒道：「好妖怪，我倒饒你性命出來，你反咬我，要害我命。我不出來，活活的只弄殺你。不出來，不出來。」老魔報怨三魔道：「兄弟，你是自家人弄自家人了。且是請他出來好了，你卻教我咬他。他倒不曾咬著，卻迸得我牙齦疼痛。這是怎麼起的？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    ところが悟空には、腹の中でもそれが聞こえていた。すぐには出ず、金箍棒（きんこぼう）を突き出して試してみた。すると青毛獅子怪は案の定がぶりと噛み、がきっと音がして、前歯がすっかり砕け散った。悟空は棒を引っ込めて言った。
    悟空「とんだ妖怪だ。俺はお前の命を助けようと出てやるのに、お前は逆に噛みついて、俺を殺すつもりか。出ないぞ。生きたままとことん苦しめて殺してやる。出ないぞ、出ないぞ。」
    青毛獅子怪は雲程万里鵬を恨んだ。
    青毛獅子怪「弟よ、身内で身内をひどい目に遭わせるとは。まず出てきてもらえばよかったのに、お前は噛めなどと言う。あいつには噛みつけず、わしの歯が砕けて歯茎が痛くなっただけだ。いったいどうしてくれる？」
  "translation_status": "reviewed"
- "id": "xy-ch76-004"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三魔見老魔怪他，他又作個激將法，厲聲高叫道：「孫行者，聞你名如轟雷貫耳，說你在南天門外施威，靈霄殿下逞勢，如今在西天路上降妖縛怪，原來是個小輩的猴頭。」行者道：「我何為小輩？」三怪道：「『好看千里客，萬里去傳名。』你出來，我與你賭鬥，才是好漢。怎麼在人肚裡做勾當？非小輩而何？」行者聞言，心中暗想道：「是是是。我若如今扯斷他腸，揌破他肝，弄殺這怪，有何難哉？但真是壞了我的名頭。也罷，也罷，你張口，我出來與你比併。但只是你這洞口窄逼，不好使家火，須往寬處去。」三魔聞說，即點大小怪，前前後後，有三萬多精，都執著精銳器械，出洞擺開一個三才陣勢，專等行者出口，一齊上陣。那二怪攙著老魔，徑至門外，叫道：「孫行者，好漢出來，此間有戰場，好鬥。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

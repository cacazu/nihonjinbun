  "translation_ja": |-
    さて三人の妖王は、妖怪たちを率いて洞へ帰った。黄牙老象が言った。
    黄牙老象「兄者、俺は孫行者とは九つの頭に八本の尾を持つようなやつかと思っていたが、あんなちっぽけな猿だったのか。呑み込むべきじゃなかった。ただ戦っていれば、どうしてあいつが兄者や俺に勝てる？　洞の何万もの妖怪で唾を吐きかけるだけでも、溺れ死にさせられる。ところが腹に呑み込んだものだから、あいつは術を使い出し、兄者を苦しめた。あれでは張り合えるはずがない。さっき唐僧を送ると言ったのは、みな出まかせだ。実際には兄者の命が大事だから、だまして出てこさせたまでで、決して送ったりはしない。」
    青毛獅子怪「弟よ、送らぬというのはなぜだ？」
    黄牙老象「小妖を三千、俺につけてくれ。陣を敷けば、あの猿めを捕らえる自信がある。」
    青毛獅子怪「三千どころか、本隊ごと引き連れていってよい。あいつさえ捕らえれば、みんなの手柄になるのだ。」
  "translation_status": "reviewed"

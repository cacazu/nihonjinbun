  "source_text": "那二魔即點三千小妖，徑到大路傍擺開，著一個藍旗手往來傳報道：「孫行者趕早出來，與我二大王爺爺交戰。」八戒聽見，笑道：「哥啊，常言道：『說謊不瞞當鄉人。』就來弄虛頭，搗鬼：怎麼說降了妖精，就擡轎來送師父，卻又來叫戰，何也？」行者道：「老怪已被我降了，不敢出頭，聞著個『孫』字兒，也害頭疼。這定是二妖魔不伏氣送我們，故此叫戰。我道兄弟，這妖精有弟兄三個，這般義氣；我弟兄也是三個，就沒些義氣？我已降了大魔，二魔出來，你就與他戰戰，未為不可。」八戒道：「怕他怎的？等我去打他一仗來。」行者道：「要去便去罷。」八戒笑道：「哥啊，去便去，你把那繩兒借與我使使。」行者道：「你要怎的？你又沒本事鑽在肚裡，你又沒本事拴在他心上，要他何用？」八戒道：「我要扣在這腰間，做個救命索。你與沙僧扯住後手，放我出去，與他交戰。估著贏了他，你便放鬆，我把他拿住；若是輸與他，你把我扯回來，莫教他拉了去。」真個行者暗笑道：「也是捉弄獃子一番。」就把繩兒扣在他腰裡，撮弄他出戰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

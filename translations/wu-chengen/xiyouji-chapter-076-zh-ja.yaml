  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖收繩子，徑轉山東，遠遠的看見唐僧睡在地下打滾痛哭，豬八戒與沙僧解了包袱，將行李搭分兒，在那裡分哩。行者暗暗嗟嘆道：「不消講了，這定是八戒對師父說我被妖精吃了，師父捨不得我，痛哭；那獃子卻分東西散火哩。咦！不知可是此意？且等我叫他一聲看。」落下雲頭叫道：「師父。」沙僧聽見，報怨八戒道：「你是個棺材座子──專一害人。師兄不曾死，你卻說他死了，在這裡幹這個勾當，那裡不叫將來了？」八戒道：「我分明看見他被妖精一口吞了。想是日辰不好，那猴子來顯魂哩。」行者到跟前，一把撾住八戒臉，一個巴掌打了個踉蹌道：「夯貨！我顯甚麼魂？」獃子侮著臉道：「哥哥，你實是那怪吃了，你、你怎麼又活了？」行者道：「像你這個不濟事的膿包？他吃了我，我就抓他腸，捏他肺，又把這條繩兒穿住他的心，扯得疼痛難禁，一個個叩頭哀告，我才饒了他性命。如今擡轎來送我師父過山也。」那三藏聞言，一骨魯爬起來，對行者躬身道：「徒弟啊，累殺你了。若信悟能之言，我已絕矣。」行者掄拳打著八戒罵道：「這個饢糠的獃子，十分懈怠，甚不成人。師父，你切莫惱，那怪就來送你也。」沙僧也甚生慚愧，連忙遮掩，收拾行李，扣背馬匹，都在途中等候不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    悟空は縄を収め、まっすぐ山の東側へ戻った。遠くから見ると、三蔵は地面に横たわって転げ回り、激しく泣いている。八戒（はっかい）と沙悟浄（さごじょう）は包みをほどき、荷物をいくつかに分けて、分配の真っ最中だった。悟空はひそかにため息をついた。
    悟空「言うまでもない。八戒が師匠に、俺は妖怪に食われたと言ったに違いない。師匠は俺を失うのがつらくて大泣きし、あのばかは持ち物を分けて解散するつもりか。いや、本当にそういうことかな？　ひと声かけてみよう。」
    雲を降りて呼んだ。
    悟空「お師匠さま！」
    沙悟浄はそれを聞くと、八戒を責めた。
    沙悟浄「お前は棺桶の台だ。人をひどい目に遭わせることばかりする。兄さんは死んでもいないのに、死んだなどと言って、こんなことをしている。ほら、あそこで呼んでいるじゃないか。」
    八戒「俺はあいつが妖怪にひと呑みにされるのを、はっきり見たんだ。日が悪いせいで、あの猿の魂が出てきたんだろう。」
    悟空は目の前へ来ると、八戒の顔をひっつかみ、平手で一発、よろめくほどに打った。
    悟空「この間抜け！　何が俺の魂だ？」
    八戒は顔を押さえて言った。
    八戒「兄貴、確かにあの妖怪に食われたじゃないか。ど、どうしてまた生きているんだ？」
    悟空「お前のような役立たずの腰抜けと一緒にするな。呑まれたから、腸をひっかき、肺をつかみ、さらにこの縄を心臓に通して引っ張り、痛くてたまらぬ目に遭わせてやった。やつらが一人ずつ頭を下げて哀願したので、ようやく命を助けてやったんだ。今、輿を担いで師匠を山の向こうへ送りに来るところだ。」
    三蔵はこれを聞くと、ころりと身を起こし、悟空に腰をかがめて言った。
    三蔵「弟子よ、本当に苦労をかけたね。悟能（ごのう）の言うことを信じたままなら、私はもう命が尽きるところだった。」
    悟空は拳を振るって八戒を殴り、罵った。
    悟空「この糠つぶしのばかめ。怠け者にもほどがある、まったくろくでなしだ。お師匠さま、もうお嘆きにならないでください。妖怪どもがすぐにお送りしに来ます。」
    沙悟浄もひどく恥じ入り、急いで取り繕い、荷物をまとめて馬に鞍を置いた。一同は道で待つことになった。こちらはしばらく措く。
  "translation_status": "reviewed"
- "id": "xy-ch76-009"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三個魔頭帥群精回洞，二怪道：「哥哥，我只道是個九頭八尾的孫行者，原來是恁的個小小猴兒。你不該吞他，只與他鬥時，他那裡鬥得過你我？洞裡這幾萬妖精，吐唾沫也可渰殺他。你卻將他吞在肚裡，他便弄起法來，教你受苦，怎麼敢與他比較？才自說送唐僧，都是假意，實為兄長性命要緊，所以哄他出來，決不送他。」老魔道：「賢弟不送之故，何也？」二怪道：「你與我三千小妖，擺開陣勢，我有本事拿住這個猴頭。」老魔道：「莫說三千，憑你起老營去，只是拿住他，便大家有功。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"

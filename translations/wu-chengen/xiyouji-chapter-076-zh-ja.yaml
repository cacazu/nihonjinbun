    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    悟空は腹の中で、外の烏や鵲の鳴き声、鶴の声、風の音を聞き、広々した場所だと分かった。そして考えた。
    悟空「出なければ、俺のほうが約束を破ることになる。だが出ていけば、この妖怪どもは人の顔をしていても心は獣だ。さっきは師匠を送ると言って俺をおびき出し、噛みつこうとした。今度はここへ兵を集めている。よし、よし、両方とも都合よくいくようにしよう。出るには出るが、腹の中には根を一本残しておくぞ。」
    すぐに後ろへ手を回し、尾の毛を一本抜いた。仙気を吹きかけ、悟空が「変われ！」と唱えると、一本の縄になった。髪の毛ほどの細さで、長さは四十丈（じょう）ほどもある。縄を繰り出すと、風に触れたところが太くなった。一方の端を妖怪の心臓と肝臓に結び、引けば締まる結び目を作った。引かなければ締まらず、締めれば痛む仕掛けである。悟空はもう一方の端を持ち、笑って言った。
    悟空「こうして出たら、師匠を送ってくれるならそれでよし。送らずにむやみに武器を振るうようなら、俺も相手をする暇はない。この縄を引くだけで、腹の中にいるのと同じことだ。」
    さらに体をごく小さくして、外へ這い出そうとした。喉の下まで来ると、妖怪が四角い口を大きく開き、上下の鋼の歯が鋭い刃のように並んでいた。そこで、ふと思いついた。
    悟空「まずい、まずい。口から出てこの縄を引いたら、あいつは痛がって噛みしめ、縄を噛み切ってしまうじゃないか。歯のない所から出ることにしよう。」
    さすがの悟空、縄を繰りながら上顎に沿って前へ這い、鼻の穴まで来た。青毛獅子怪は鼻がむずがゆくなり、はっくしょんとくしゃみを一つして、悟空を勢いよく吹き出した。
  "translation_status": "reviewed"
- "id": "xy-ch76-006"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了風，把腰躬一躬，就長了有三丈長短，一隻手扯著繩兒，一隻手拿著鐵棒。那魔頭不知好歹，見他出來了，就舉鋼刀，劈臉來砍。這大聖一隻手使鐵棒相迎。又見那二怪使槍，三怪使戟，沒頭沒臉的亂上。大聖放鬆了繩，收了鐵棒，急縱身駕雲走了。原來怕那夥小妖圍繞，不好幹事。他卻跳出營外，去那空闊山頭上，落下雲，雙手把繩盡力一扯，老魔心裡才疼。他害疼，往上一掙，大聖復往下一扯。眾小妖遠遠看見，齊聲高叫道：「大王，莫惹他，讓他去罷。這猴兒不按時景：清明還未到，他卻那裡放風箏也。」大聖聞言，著力氣蹬了一蹬。那老魔從空中拍剌剌，似紡車兒一般跌落塵埃。就把那山坡下死硬的黃土跌做個二尺淺深之坑。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    悟空は外気に触れると、腰をかがめて身を伸ばし、三丈ほどの大きさになった。片手には縄を持ち、もう片手には鉄棒を持っていた。青毛獅子怪は物事の分からぬやつで、悟空が出たのを見るなり鋼の刀を振り上げ、顔めがけて斬りつけた。悟空は片手で鉄棒を使い、受け止めた。見ると黄牙老象は槍を、雲程万里鵬は戟を使い、やみくもに襲いかかってくる。悟空は縄を緩め、鉄棒を収めると、身を躍らせて雲に乗り、逃げ去った。小妖どもに取り囲まれては、うまく事を運べないと案じたのである。
    陣の外へ跳び出すと、広々した山の頂で雲を降り、両手で縄を力いっぱい引いた。そこで初めて青毛獅子怪の胸が痛み出した。痛さに身をもがいて上へ跳ぶと、悟空はまた下へ引いた。小妖たちは遠くからこれを見て、一斉に叫んだ。
    小妖たち「大王、もうちょっかいを出さず、行かせてしまってください。あの猿は季節もわきまえません。清明（せいめい）にもならぬうちから、あそこで凧を揚げています！」
    悟空はそれを聞くと、足を踏ん張ってぐいと引いた。青毛獅子怪は空中から、糸車のようにぐるぐる回りながら、ばたばたと地面へ落ちた。斜面の下の、かちかちに固まった黄土には、深さ二尺（しゃく）ほどの穴ができた。
  "translation_status": "reviewed"
- "id": "xy-ch76-007"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "慌得那二怪、三怪一齊按下雲頭，上前扯住繩兒，跪在坡下，哀告道：「大聖啊，只說你是個寬洪海量之仙，誰知是個鼠腹蝸腸之輩。實實的哄你出來，與你見陣，不期你在我家兄心上拴了一根繩子。」行者笑道：「你這夥潑魔，十分無禮。前番哄我出來就咬我，這番哄我出來卻又擺陣敵我。似這幾萬妖兵戰我一個，理上也不通。扯了去，扯了去見我師父。」那怪一齊叩頭道：「大聖慈悲，饒我性命，願送老師父過山。」行者笑道：「你要性命，只消拿刀把繩子割斷罷了。」老魔道：「爺爺呀！割斷外邊的，這裡邊的拴在心上，喉嚨裡又㮇㮇的惡心，怎生是好？」行者道：「既如此，張開口，等我再進去解出繩來。」老魔慌了道：「這一進去，又不肯出來，卻難也，卻難也。」行者道：「我有本事外邊就可以解得裡面繩頭也。解了可實實的送我師父麼？」老魔道：「但解就送，決不敢打誑語。」大聖審得是實，即便將身一抖，收了毫毛。那怪的心就不疼了。這是孫大聖掩樣的法兒，使毫毛拴著他的心，收了毫毛，所以就不害疼也。三個妖縱身而起，謝道：「大聖請回，上覆唐僧，收拾下行李，我們就擡轎來送。」眾怪偃干戈，盡皆歸洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    黄牙老象と雲程万里鵬は慌てて同時に雲を降り、そばへ来て縄をつかみ、斜面の下にひざまずいて哀願した。
    黄牙老象と雲程万里鵬「大聖さま、あなたは広い度量をお持ちの仙人と思っておりました。これほど心の狭いお方とは存じませんでした。確かに、あなたを誘い出して戦おうとはしましたが、私らの兄の心臓に縄を結びつけておられようとは。」
    悟空は笑った。
    悟空「この無法な妖怪どもめ、実に無礼だ。さっきは俺をおびき出して噛みつき、今度はおびき出して陣を敷き、俺に刃向かう。何万という妖兵で俺一人を相手にするなど、道理に合わん。引いていくぞ、引いていって師匠に会わせるぞ。」
    妖怪たちは一斉に頭を地につけた。
    妖怪たち「大聖さま、お慈悲を。どうか命をお助けください。お師匠さまを山の向こうまでお送りいたします。」
    悟空は笑って言った。
    悟空「命が惜しけりゃ、刀で縄を切るだけでよいじゃないか。」
    青毛獅子怪「おじいさま！　外の部分を切っても、内側は心臓に結びついております。喉にも何かが引っかかっているようで、むかむかして気持ちが悪いのです。どうすればよいのでしょう？」
    悟空「それなら口を開けろ。もう一度入って、縄をほどいてやる。」
    青毛獅子怪は慌てた。
    青毛獅子怪「またお入りになって、出てくださらなければ困ります。困ります。」
    悟空「俺なら外からでも、中の縄の端をほどける。ほどいたら、本当に俺の師匠を送るか？」
    青毛獅子怪「ほどいてくだされば、お送りします。決して偽りは申しません。」
    悟空は本気と見定め、体をぶるりと震わせて毛を収めた。すると青毛獅子怪の胸の痛みは消えた。これは悟空の、人目を欺く術だった。毛を妖怪の心臓に結びつけていたので、それを収めれば痛まなくなるのである。三人の妖王は跳ね起き、礼を述べた。
    三人の妖王「大聖さま、どうぞお戻りになり、唐僧（とうそう）さまに旅支度をなさるようお伝えください。すぐ輿を担いでお迎えに参ります。」
    妖怪たちは武器を収め、みな洞へ帰った。

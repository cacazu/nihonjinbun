  "translation_ja": |-
    悟空が飛び上がって見ると、八戒は四肢を上に向け、口を突き出して、半ば浮き、半ば沈み、口からふうふう息を漏らしていた。まったくおかしな姿で、八、九月に霜を受け、実の抜け落ちた大きな黒い蓮の実の房そっくりだった。悟空はその顔を見ると、憎らしくも、かわいそうでもあり、言った。
    悟空「どうしたものかな。こいつも竜華会（りゅうげえ）に連なる一人ではある。ただ、事あるごとに荷物を分けて解散しようと言い、師匠をけしかけて緊箍呪（きんこじゅ）を唱えさせ、俺を苦しめようとするのが憎いんだ。この間、沙悟浄から、こいつはへそくりを貯めていると聞いた。本当にあるのかな。ひとつ脅してみよう。」
  "translation_status": "reviewed"
- "id": "xy-ch76-015"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，飛近他耳邊，假捏聲音，叫聲：「豬悟能，豬悟能。」八戒慌了道：「晦氣呀，我這悟能是觀世音菩薩起的，自跟了唐僧，又呼做八戒，此間怎麼有人知道我叫做悟能？」獃子忍不住問道：「是那個叫我的法名？」行者道：「是我。」獃子道：「你是那個？」行者道：「我是勾司人。」那獃子慌了道：「長官，你是那裡來的？」行者道：「我是五閻王差來勾你的。」獃子道：「長官，你且回去，上覆五閻王，他與我師兄孫悟空交得甚好，教他讓我一日兒，明日來勾罷。」行者道：「胡說。『閻王註定三更死，誰敢留人到四更。』趁早跟我去，免得套上繩子扯拉。」獃子道：」長官，那裡不是方便？看我這般嘴臉，還想活哩。死是一定死，只等一日，這妖精連我師父們都拿來，會一會，就都了帳也。」行者暗笑道：「也罷，我這批上有三十個人，都在這中前後，等我拘將來就你，便有一日耽閣。你可有盤纏？把些兒我去。」八戒道：「可憐啊，出家人那裡有甚麼盤纏？」行者道：「若無盤纏，索了去，跟著我走。」獃子慌了道：「長官不要索。我曉得你這繩兒叫做追命繩，索上就要斷氣。有有有，有便有些兒，只是不多。」行者道：「在那裡？快拿出來。」八戒道：「可憐，可憐，我自做了和尚，到如今，有些善信的人家齋僧，見我食腸大，襯錢比他們略多些兒，我拿了攢在這裡，零零碎碎有五錢銀子。因不好收拾，前者到城中，央了個銀匠煎在一處，他又沒天理，偷了我幾分，只得四錢六分一塊兒。你拿去罷。」行者暗笑道：「這獃子褲子也沒得穿，卻藏在何處？咄！你銀子在那裡？」八戒道：「在我左耳朵眼兒裡揌著哩。我綑了拿不得，你自家拿了去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

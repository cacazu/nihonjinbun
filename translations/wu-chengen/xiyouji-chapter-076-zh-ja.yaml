  "translation_ja": |-
    悟空は聞くと、耳の穴へ手を入れて探り出した。本当に鞍の形をした銀の塊で、四銭五、六分はたっぷりあった。手に取ると、こらえ切れず、はははっと笑い声を上げた。八戒は悟空の声だと気づき、水の中からさんざん罵った。
    八戒「くたばれ、弼馬温（ひつばおん）め！　こんなひどい目に遭っているところへ、まだ金をゆすりに来るのか！」
    悟空はまた笑った。
    悟空「この酒粕食らいめ。俺が師匠を守るため、どれほど苦労や災難を受けてきたか分からんのに、お前はへそくりを貯め込んでいたのか。」
    八戒「よく言うよ。何がへそくりだ。みな歯の間から削り取ったように、食い扶持を切り詰めた金だぞ。食い物を買いたいのを我慢して、布を一匹（ひき）買い、着物を作ろうと取っておいたのに、お前はそれを脅し取ったんだ。いくらか俺にも分けて返せ。」
    悟空「銀一分の半分だってやらん。」
    八戒は罵った。
    八戒「命を買う金として、お前にくれてやるよ。だが、せめてここから助け出してくれたっていいだろう。」
    悟空「慌てるな。今助けてやる。」
    銀をしまい、本来の姿に戻ると、鉄棒を抜いて八戒を岸へ引き寄せた。手で足をつかんで引き上げ、縄をほどいた。八戒は跳ね起き、衣を脱いで水を絞り、ひと振りしてから、まだぐっしょり濡れたまま身にまとった。
    八戒「兄貴、裏門を開けて逃げよう。」
    悟空「裏門から逃げて、腕が上がったと言えるか？　やはり表門から戦って出るぞ。」
    八戒「足を縛られて痺れているから、走れないよ。」
    悟空「さっさとついてこい。」

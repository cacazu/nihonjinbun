  "source_text": "急縱身，趕上山，暗中恨道：「這獃子咒我死，且莫與他個快活。且跟去看那妖精怎麼擺佈他，等他受些罪，再去救他。」即捻訣念起真言，搖身一變，即變做個蟭蟟蟲，飛將去，釘在八戒耳朵根上，同那妖精到了洞裡。二魔帥三千小怪，大吹大打的至洞口屯下。自將八戒拿入裡邊道：「哥哥，我拿了一個來也。」老怪道：「拿來我看。」他把鼻子放鬆，捽下八戒道：「這不是？」老怪道：「這廝沒用。」八戒聞言道：「大王，沒用的放出去，尋那有用的捉來罷。」三怪道：「雖是沒用，也是唐僧的徒弟豬八戒。且綑了，送在後邊池塘裡浸著。待浸退了毛，破開肚子，使鹽醃了晒乾，等天陰下酒。」八戒大驚道：「罷了，罷了，撞見那販醃的妖怪也。」眾怪一齊下手，把獃子四馬攢蹄綑住，扛扛擡擡，送至池塘邊，往中間一推，盡皆轉去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    悟空はすぐに跳び上がり、山を駆け上がりながら、心の中で恨んだ。
    悟空「あのばかは俺を死んだと言い立てやがった。すぐに楽をさせてやるものか。まずついていって、妖怪どもがどう扱うか見てやろう。少し苦しんでから助けてやる。」
    印を結んで真言を唱え、身を揺すると、蟭蟟虫（しょうりょうちゅう）に変わった。飛んでいって八戒の耳の付け根にぴたりと止まり、妖怪とともに洞へ入った。黄牙老象は三千の小妖を率い、笛や太鼓を盛大に鳴らして洞の入口まで来て、そこに兵を留めた。自分は八戒を中へ持ち込み、言った。
    黄牙老象「兄者、一匹捕らえてきたぞ。」
    青毛獅子怪「持ってこい、見せてみろ。」
    黄牙老象は鼻を緩め、八戒をどさりと投げ下ろした。
    黄牙老象「ほら、こいつだ。」
    青毛獅子怪「こいつは役に立たん。」
    八戒は聞くと、言った。
    八戒「大王さま、役に立たないのは放して、役に立つのを探して捕まえてくればよいじゃありませんか。」
    雲程万里鵬「役には立たなくても、唐僧の弟子、猪八戒（ちょはっかい）だ。ひとまず縛って、裏の池へ漬けておけ。毛が抜けるまで漬けたら、腹を裂き、塩漬けにして干しておき、曇りの日の酒の肴にしよう。」
    八戒は仰天した。
    八戒「おしまいだ、おしまいだ。塩漬け肉を商う妖怪にぶつかったぞ！」
    妖怪たちは一斉に手を出し、八戒の両手両足を一つに寄せて縛り上げた。担いだり持ち上げたりして池の縁へ運ぶと、真ん中へ突き落とし、みな帰っていった。

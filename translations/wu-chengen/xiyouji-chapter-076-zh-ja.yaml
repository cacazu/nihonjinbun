  "origin": "source"
  "source_text": "好大聖，把鐵棒一路丟開解數，打將出去。那獃子忍著麻，只得跟定他。只看見二門下靠著的是他的釘鈀，走上前，推開小妖，撈過來往前亂築，與行者打出三四層門，不知打殺了多少小妖。那老魔聽見，對二魔道：「拿得好人，拿得好人。你看孫行者劫了豬八戒，門上打傷小妖也。」那二魔急縱身，綽槍在手，趕出門來，高聲罵道：「潑猢猻，這般無禮，怎敢渺視我等？」大聖聽得，即應聲站下。那怪物不容講，使槍便刺；行者正是會家不忙，掣鐵棒，劈面相迎。他兩個在洞門外，這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    さすがの悟空、鉄棒の技を繰り出しながら、道々戦って外へ向かった。八戒も痺れをこらえ、あとについていくほかなかった。見ると、二つ目の門の下に自分の釘鈀が立てかけてある。そばへ行って小妖を押しのけ、ひっつかむと、前へむやみに打ち込み、悟空とともに三、四重の門を戦い抜いて出た。その間、どれほどの小妖を殴り殺したか分からない。青毛獅子怪は騒ぎを聞き、黄牙老象へ言った。
    青毛獅子怪「いい者を捕らえてきたな、実にいい者を。見ろ、孫行者が猪八戒を奪い返し、門で小妖を傷つけているぞ。」
    黄牙老象は急いで跳び起き、槍を手に取って門外へ追い出ると、大声で罵った。
    黄牙老象「無法な猿め、何という無礼だ。よくも俺たちを侮ったな！」
    悟空は聞くなり、その声に応じて足を止めた。黄牙老象は口を開く隙も与えず、槍で突いた。悟空は腕の立つ者らしく慌てず、鉄棒を抜き、真っ向から受け止める。洞の門外で二人が繰り広げた、激しい戦いとは。
  "translation_status": "reviewed"
- "id": "xy-ch76-018"
  "section_id": "chapter-76"
  "kind": "verse"
  "origin": "source"
  "source_text": "黃牙老象變人形，義結獅王為弟兄。因為大魔來說合，同心計算吃唐僧。齊天大聖神通廣，輔正除邪要滅精。八戒無能遭毒手，悟空拯救出門行。妖王趕上施英猛，槍棒交加各顯能。那一個槍來好似穿林蟒，這一個棒起猶如出海龍。龍出海門雲靄靄，蟒穿林樹霧騰騰。算來都為唐和尚，恨苦相持太沒情。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    黄牙老象は人の姿に変わり、獅子の王と義兄弟の契りを結ぶ。
    大妖魔が間に立って話をまとめたため、心を合わせ、唐僧を食おうと企んだ。
    斉天大聖の神通力は広大で、正しきを助け邪を除き、妖怪を滅ぼそうとする。
    力の及ばぬ八戒は毒手に落ち、悟空が救い出して門を出る。
    妖王は追いつき勇猛さを振るい、槍と棒が打ち合わされ、ともに腕を示す。
    あちらの槍は林を抜ける大蛇のよう、こちらの棒は海から出る竜のよう。
    海門を出る竜には雲が深く立ちこめ、林の木々を抜ける大蛇には霧が湧き上がる。
    もとをたどれば、すべては唐の和尚のため。恨みつらみをもって渡り合い、情けはまるでない。
  "translation_status": "reviewed"
- "id": "xy-ch76-019"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒見大聖與妖精交戰，他在山嘴上豎著釘鈀，不來幫打，只管呆呆的看著。那妖精見行者棒重，滿身解數，全無破綻，就把槍架住，捽開鼻子，要來捲他。行者知道他的勾當，雙手把金箍棒橫起來，往上一舉。被妖精一鼻子捲住腰胯，不曾捲手。你看他兩隻手在妖精鼻頭上丟花棒兒耍子。八戒見了，搥胸道：「咦！那妖怪晦氣呀。捲我這夯的，連手都捲住了，不能得動；捲那們滑的，倒不捲手。他那兩隻手拿著棒，只消往鼻裡一搠，那孔子裡害疼流涕，怎能捲得他住？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    八戒は悟空と黄牙老象が戦うのを見ても、山の突き出したところで釘鈀を立て、加勢にも来ず、ただぼんやり眺めていた。黄牙老象は、悟空の棒が重く、全身の技にもまるで隙がないのを見ると、槍で相手を押さえ、鼻を振り伸ばして巻き取ろうとした。悟空はその手口を知っていたので、両手で金箍棒を横にして、上へ持ち上げた。黄牙老象は鼻で腰から股にかけて巻き取ったが、手は巻けなかった。見るがよい、悟空は両手で棒をくるくると回し、妖怪の鼻の上で技を見せて遊んでいる。八戒はそれを見て、胸をたたいた。
    八戒「やれやれ、あの妖怪もついてないな。俺みたいな間抜けを巻いたときには、手までまとめて巻いて、動けなくしてしまったのに、あんなすばしこいやつを巻くときは、手を残しておくとは。あいつは両手で棒を持っているんだぞ。鼻へひと突きすれば、穴の中が痛くて鼻水が出る。どうして巻きつけたままでいられるもんか。」
  "translation_status": "reviewed"
- "id": "xy-ch76-020"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者原無此意，倒是八戒教了他。他就把棒幌一幌，小如雞子，長有丈餘，真個往他鼻孔裡一搠。那妖精害怕，沙的一聲，把鼻子捽放。被行者轉手過來，一把撾住，用氣力往前一拉。那妖精護疼，隨著手，舉步跟來。八戒方才敢近，拿釘鈀望妖精胯子上亂築。行者道：「不好，不好。那鈀齒兒尖，恐築破皮，淌出血來，師父看見，又說我們傷生。只調柄子來打罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    悟空はもともとそのつもりではなかったのに、かえって八戒に教えられた。棒をひと振りすると、太さは鶏の卵ほど、長さは一丈余りになった。それを本当に鼻の穴へ突っ込んだ。黄牙老象は恐れ、さっと鼻を振って放したが、悟空は手を返してひっつかみ、力を込めて前へ引いた。黄牙老象は痛みをかばって、その手に従い、足を運んでついてきた。八戒はそこでようやく近寄る勇気が出て、釘鈀で妖怪の股をめがけ、むやみに打ちかかった。
    悟空「だめだ、だめだ。その熊手の歯は尖っている。皮を破って血でも出せば、師匠に見つかって、また生き物を傷つけたと言われるぞ。柄のほうへ持ち替えて殴れ。」
  "translation_status": "reviewed"
- "id": "xy-ch76-021"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真個獃子舉鈀柄，走一步，打一下；行者牽著鼻子：就似兩個象奴，牽至坡下。只見三藏凝睛盼望，見他兩個嚷嚷鬧鬧而來，即喚：「悟淨，你看悟空牽的是甚麼？」沙僧見了，笑道：「師父，大師兄把妖精揪著鼻子拉來，真愛殺人也。」三藏道：「善哉！善哉！那般大個妖精，那般長個鼻子。你且問他：他若喜喜歡歡送我等過山，可饒了他，莫傷他性命。」沙僧急縱前迎著，高聲叫道：「師父說：那怪果送師父過山，教不要傷他命哩。」那怪聞說，連忙跪下，口裡嗚嗚的答應。原來被行者揪著鼻子，捏儾了，就如重傷風一般。叫道：「唐老爺，若肯饒命，即便擡轎相送。」行者道：「我師徒俱是善勝之人，依你言，且饒你命。快擡轎來，如再變卦，拿住決不再饒。」那怪得脫手，磕頭而去。行者同八戒見唐僧，備言前事。八戒慚愧不勝，在坡前晾晒衣服，等候不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    八戒は本当に熊手の柄を振り上げ、一歩進むごとに一発ずつ殴った。悟空は鼻を引っ張る。二人はまるで象使いのように、妖怪を斜面の下へ連れていった。三蔵は目を凝らして待っていたが、二人がわいわい騒ぎながら来るのを見て、呼んだ。
    三蔵「悟浄（ごじょう）、見なさい。悟空が引いてくるのは何だろう？」
    沙悟浄は見ると、笑った。
    沙悟浄「お師匠さま、兄さんが妖怪の鼻をつかんで、引っ張ってくるのです。まったく、見ていて愉快になりますね。」
    三蔵「善哉（ぜんざい）、善哉。あんなに大きな妖怪に、あんなに長い鼻がある。聞いてやりなさい。喜んで私たちを山の向こうへ送ってくれるなら、許してやればよい。命を傷つけてはならない。」
    沙悟浄は急いで前へ跳んで迎え、大声で呼びかけた。
    沙悟浄「お師匠さまが、あの妖怪が本当に山の向こうまで送るなら、命は奪うなとおっしゃっているぞ。」
    黄牙老象は聞くと、急いでひざまずき、口の中でうううと応じた。悟空に鼻をつかまれて息が通らず、ひどい鼻風邪をひいたような声になっていたのである。そうして呼ばわった。
    黄牙老象「唐の和尚さま、命を助けてくだされば、すぐに輿を担いでお送りします。」
    悟空「俺たち師弟はみな心の善良な者だ。お前の言葉を信じ、ひとまず命を助けてやる。早く輿を持ってこい。また気を変えるようなら、捕まえたときは決して二度と許さんぞ。」
    黄牙老象は手を放してもらうと、頭を下げて立ち去った。悟空は八戒とともに三蔵のもとへ来て、それまでの一部始終を語った。八戒は恥ずかしくてたまらず、斜面の前で衣を干しながら待った。こちらはしばらく措く。
  "translation_status": "reviewed"
- "id": "xy-ch76-022"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那二魔戰戰兢兢回洞。未到時，已有小妖報知老魔、三魔，說二魔被行者揪著鼻子拉去。老魔悚懼，與三魔帥眾方出，見二魔獨回，又皆接入，問及放回之故。二魔把三藏慈憫善勝之言，對眾說了一遍。一個個面面相覷，更不敢言。二魔道：「哥哥可送唐僧麼？」老魔道：「兄弟，你說那裡話？孫行者是個廣施仁義的猴頭：他先在我肚裡，若肯害我性命，一千個也被他弄殺了；卻才揪住你鼻子，若是扯了去不放回，只捏破你的鼻子頭兒，卻也惶恐。快早安排送他去罷。」三魔笑道：「送送送。」老魔道：「賢弟這話，卻又像尚氣的了。你不送，我兩個送去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    黄牙老象は震えながら洞へ帰った。その到着より先に、小妖が青毛獅子怪と雲程万里鵬へ、黄牙老象は悟空に鼻をつかまれて連れていかれたと知らせていた。青毛獅子怪は恐れ、雲程万里鵬とともに一同を率いて出ようとしたところ、黄牙老象が一人で帰ってくるのを見た。みなで迎えて中へ入れ、放してもらえたわけを尋ねた。黄牙老象は、三蔵の憐れみ深く善良な言葉を、一同へ一通り話した。みな顔を見合わせ、何も言えなかった。
    黄牙老象「兄者、唐僧を送るか？」
    青毛獅子怪「弟よ、何を言う。孫行者は広く仁義を施す猿だ。さっきわしの腹の中にいたとき、本当に命を取る気なら、わしが千人いても殺されていただろう。今もお前の鼻をつかんで引きずり、放して戻さず、鼻先を握りつぶしてしまえば、それこそ恐ろしいことになっていた。早く支度して送ってやろう。」
    雲程万里鵬は笑った。
    雲程万里鵬「送ろう、送ろう、送ろう。」
    青毛獅子怪「弟よ、その言い方はまだ意地を張っているようだな。お前が送らぬというなら、わしら二人で送るぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch76-023"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三魔又笑道：「二位兄長在上：那和尚倘不要我們送，只這等瞞過去，還是他的造化；若要送，不知正中了我的調虎離山之計哩。」老怪道：「何為『調虎離山』？」三怪道：「如今把滿洞群妖點將起來，萬中選千，千中選百，百中選十六個，又選三十個。」老怪道：「怎麼既要十六，又要三十？」三怪道：「要三十個會烹煮的，與他些精米、細麵、竹筍、茶芽、香蕈、蘑菇、豆腐、麵筋，著他二十里或三十里，搭下窩鋪，安排茶飯，管待唐僧。」老怪道：「又要十六個何用？」三怪道：「著八個擡，八個喝路。我弟兄相隨左右，送他一程。此去向西四百餘里，就是我的城池，我那裡自有接應的人馬。若至城邊，……如此如此，著他師徒首尾不能相顧。要捉唐僧，全在此十六個身上成功。」老怪聞言，歡欣不已；真是如醉方醒，似夢方覺。道：「好好好！」即點眾妖，先選三十，與他物件；又選十六，擡一頂香藤轎子：同出門來。又吩咐眾妖：「俱不許上山閑走：孫行者是個多心的猴子，若見汝等往來，他必生疑，識破此計。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    雲程万里鵬はまた笑った。
    雲程万里鵬「お二人の兄上、あの和尚が俺たちの見送りを断り、そのままうまく通り抜けていけば、それもやつの幸運だ。だが、送らせるつもりなら、知らぬうちに俺の『虎を山からおびき出す計』へ、まんまとはまるのさ。」
    青毛獅子怪「『虎を山からおびき出す』とは、どういうことだ？」
    雲程万里鵬「今、洞じゅうの妖怪を集め、一万から千を選び、千から百を選び、百から十六匹を選ぶ。それとは別に三十匹も選ぶんだ。」
    青毛獅子怪「なぜ十六匹が要ると言ったのに、また三十匹なのだ？」
    雲程万里鵬「三十匹は料理のできる者だ。よく精げた米、上等の小麦粉、竹の子、茶の新芽、椎茸、きのこ、豆腐、麩を与え、二十里か三十里ごとに小屋を掛けさせる。茶や食事を用意して、唐僧をもてなすのだ。」
    青毛獅子怪「では十六匹は、何に使う？」
    雲程万里鵬「八匹に輿を担がせ、八匹に道を空けよと声を上げさせる。俺たち兄弟は左右について、しばらく送っていこう。ここから西へ四百余里行けば、俺の城だ。あそこには迎えの兵がいる。城のそばまで来たら……かくかくしかじか、こうして師弟の前後が互いに助け合えぬようにする。唐僧を捕らえる手柄は、すべてこの十六匹にかかっている。」
    青毛獅子怪は聞くと、喜びに堪えなかった。まさに酔いから覚め、夢から目覚めたかのようだった。
    青毛獅子怪「よい、よい、よい！」
    すぐ妖怪を集め、まず三十匹を選んで必要な物を与え、さらに十六匹を選んだ。香藤の輿を一挺担がせ、そろって門を出た。さらに妖怪たちへ命じた。
    青毛獅子怪「誰も山をぶらぶら歩き回ってはならん。孫行者は疑い深い猿だ。お前たちが行き来するのを見たら、必ず怪しんで、この計略を見破るだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch76-024"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老怪遂帥眾至大路傍高叫道：「唐老爺，今日不犯紅沙，請老爺早早過山。」三藏聞之道：「悟空，是甚人叫我？」行者指定道：「那廂是老孫降伏的妖精擡轎來送你哩。」三藏合掌朝天道：「善哉！善哉！若不是賢徒如此之能，我怎生得去？」徑直向前，對眾妖作禮道：「多承列位之愛，我弟子取經東回向長安，當傳揚善果也。」眾妖叩首道：「請老爺上轎。」那三藏肉眼凡胎，不知是計。孫大聖又是太乙金仙，忠正之性，只以為擒縱之功，降了妖怪，亦豈期他都有異謀？卻也不曾詳察，盡著師父之意。即命八戒將行李捎在馬上，與沙僧緊隨。他使鐵棒向前開路，顧盼吉凶。八個擡起轎子，八個一遞一聲喝道，三個妖扶著轎扛。師父喜喜歡歡的端坐轎上。上了高山，依大路而行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    青毛獅子怪は一同を率いて大道のそばまで来ると、大声で呼んだ。
    青毛獅子怪「唐の和尚さま、今日は紅沙（こうさ）の凶日に当たりません。どうぞお早く山をお越しください。」
    三蔵は聞いて言った。
    三蔵「悟空、私を呼んでいるのは誰だ？」
    悟空は指さした。
    悟空「あちらにいるのは、私が降した妖怪どもです。輿を担いで、お送りしに来たのです。」
    三蔵は天へ向かって合掌した。
    三蔵「善哉、善哉。よき弟子にこれほどの力がなければ、私はどうして先へ進めただろう。」
    まっすぐ前へ行き、妖怪たちに礼をした。
    三蔵「皆さまのお情け、まことにありがたく存じます。弟子の私が経を得て東へ戻り、長安（ちょうあん）へ帰りましたら、皆さまの善行を広く伝えましょう。」
    妖怪たちは頭を下げた。
    妖怪たち「どうぞ、お輿へお乗りください。」
    三蔵は肉眼しか持たぬ凡人で、計略だとは気づかなかった。悟空は太乙金仙（たいいつきんせん）ではあっても、忠実でまっすぐな性分なので、捕らえては放してやった功によって妖怪を降せたとばかり思っていた。相手がみな、別の企みを抱いていようとは思いもしなかったのである。詳しく調べることもせず、師匠の望むままに任せた。
    八戒に荷物を馬へ載せさせ、沙悟浄とともにぴったりあとについてくるよう命じた。自分は鉄棒を使って先へ立ち、道を開きながら周囲の吉凶に目を配った。八匹が輿を担ぎ、八匹が交互に声を上げて道を空けさせ、三人の妖王は輿の担ぎ棒に手を添えた。師匠は喜びいっぱいに輿へ端座し、高い山へ登ると、大道に沿って進んでいった。
  "translation_status": "reviewed"
- "id": "xy-ch76-025"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此一去，豈知歡喜之間愁又至。經云：「泰極否還生。」時運相逢真太歲，又值喪門吊客星。那夥妖魔同心合意的侍衛左右，早晚慇懃。行經三十里獻齋，五十里又齋，未晚請歇，沿路齊齊整整。一日三餐，遂心滿意；良宵一宿，好處安身。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    こうして出発したが、喜んでいる間にもまた憂いが訪れようとは、誰が知っただろう。経には「安泰が極まれば、再び不運が生ずる」とある。運めぐりはまさしく太歳（たいさい）にぶつかり、また喪門（そうもん）・弔客（ちょうきゃく）の星にも出くわしたのであった。
    妖怪どもは心を一つにし、左右で付き添い、朝も晩もかいがいしく世話をした。三十里行けば食事を差し出し、五十里でまた食事、日が暮れる前には泊まるよう勧め、道中の手配はすべて整然としていた。一日三度の食事は望みどおりで不満もなく、よい夜には一晩、快適な場所で身を休めた。
  "translation_status": "reviewed"
- "id": "xy-ch76-026"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "西進有四百里餘程，忽見城池相近。大聖舉鐵棒，離轎僅有一里之遙，見城池，把他嚇了一跌，掙挫不起。你道他只這般大膽，如何見此著諕？原來望見那城中有許多惡氣。乃是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 152
    "line_end": 152
  "translation_ja": "西へ四百里余り進むと、ふいに城が近づいてきた。悟空は鉄棒を持ち、輿からわずか一里ほど離れたところにいたが、城を見るなり、驚きのあまり転び、もがいても立ち上がれなかった。あれほど大胆な男が、なぜこの光景に怖気づいたのか、とお思いだろう。城の中に、おびただしい邪気が見えたからである。それは。"
  "translation_status": "reviewed"
- "id": "xy-ch76-027"
  "section_id": "chapter-76"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    攢攢簇簇妖魔怪，四門都是狼精靈。
    斑斕老虎為都管，白面雄彪作總兵。
    丫叉角鹿傳文引，伶俐狐狸當道行。
    千尺大蟒圍城走，萬丈長蛇占路程。
    樓下蒼狼呼令使，臺前花豹作人聲。
    搖旗擂鼓皆妖怪，巡更坐鋪盡山精。
    狡兔開門弄買賣，野豬挑擔幹營生。
    先年原是天朝國，如今翻作虎狼城。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 153
    "line_end": 160
  "translation_ja": |-
    群れ集い、ひしめき合う妖魔ども、四つの門はどこも狼の精ばかり。
    まだらの老虎が総取締役、白面の雄の子虎が総大将。
    枝分かれした角の鹿は公文書を取り次ぎ、利口な狐は道案内に立つ。
    千尺の大蛇が城を巡り、万丈の長蛇が道を占める。
    楼閣の下では蒼い狼が伝令を呼び、台の前では斑の豹が人の声を出す。
    旗を振り太鼓を打つのはみな妖怪、夜を見回り詰所を守るのはみな山の精。
    すばしこい兎は店を開いて商売し、猪は荷を担いで生計を立てる。
    昔はもともと天子の治める国だったものが、今や虎狼の城へ変わり果てた。
  "translation_status": "reviewed"
- "id": "xy-ch76-028"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖正當悚懼，只聽得耳後風響。急回頭觀看，原來是三魔雙手舉一柄畫桿方天戟，往大聖頭上打來；大聖急翻身爬起，使金箍棒劈面相迎。他兩個各懷惱怒，氣呼呼，更不打話；咬著牙，各要相爭。又見那老魔頭傳號令，舉鋼刀便砍八戒；八戒慌得丟了馬，掄著鈀，向前亂築。那二魔纏長槍，望沙僧刺來；沙僧使降妖杖，支開架子敵住。三個魔頭與三個和尚，一個敵一個，在那山頭捨死忘生苦戰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    悟空がおびえているちょうどそのとき、耳の後ろで風が鳴った。急いで振り返ると、雲程万里鵬が両手で絵飾りの柄の方天戟（ほうてんげき）を振り上げ、悟空の頭めがけて打ち下ろしてきた。悟空は急いで身を翻して起き上がり、金箍棒で真っ向から受け止めた。二人とも怒りを胸に抱き、ふうふうと息を荒らげ、もう言葉も交わさず、歯を食いしばって勝ちを争った。
    一方、青毛獅子怪は号令を伝え、鋼の刀を振り上げて八戒へ斬りかかった。八戒は慌てて馬を放し、熊手を振り回して、前へやみくもに打ち込んだ。黄牙老象は長槍を繰って沙悟浄へ突きかかり、沙悟浄は降妖杖（ごうようじょう）を使い、構えを取って受け止めた。三人の妖王と三人の僧は一対一となり、山の上で死をも顧みず、命がけの激戦を繰り広げた。
  "translation_status": "reviewed"
- "id": "xy-ch76-029"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那十六個小妖卻遵號令，各各效能：搶了白馬、行囊，把三藏一擁，擡著轎子，徑至城邊，高叫道：「大王爺爺定計，已拿得唐僧來了。」那城上大小妖精，一個個跑下，將城門大開。吩咐各營捲旗息鼓，不許吶喊篩鑼。說：「大王原有令在前，不許嚇了唐僧。唐僧禁不得恐嚇，一嚇就肉酸，不中吃了。」眾妖都歡天喜地邀三藏，控背躬身接主僧。把唐僧一轎子擡上金鑾殿，請他坐在當中，一壁廂獻茶獻飯，左右旋繞。那長老昏昏沉沉，舉眼無親。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    その間、十六匹の小妖は号令に従い、それぞれ力を尽くした。白馬と荷物を奪い、三蔵をわっと取り囲んで輿を担ぎ、まっすぐ城のそばへ行って、大声で叫んだ。
    十六匹の小妖「大王さまのお立てになった計略で、唐僧を捕らえてきたぞ！」
    城の上の大小の妖怪は、次々と駆け下り、城門を大きく開いた。そして各陣営へ、旗を巻き、太鼓を止め、叫んだり銅鑼を打ったりするなとの命令が出された。
    話者不明「大王さまから、前もって唐僧を怖がらせるなと命令が出ている。唐僧は脅しに弱い。ひとたび怖がらせると肉が酸っぱくなり、食えなくなるぞ。」
    妖怪たちはみな大喜びで三蔵を迎え、身をかがめ、腰を折って、主賓の僧を出迎えた。輿ごと三蔵を金鑾殿（きんらんでん）へ担ぎ上げ、中央に座るよう勧めた。片や茶を、片や食事を差し出し、左右を取り巻く。三蔵はぼんやりとして、見回しても頼れる者は一人もいなかった。
  "translation_status": "reviewed"
- "id": "xy-ch76-030"
  "section_id": "chapter-76"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知性命何如，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch76-1557754"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第076回&oldid=1557754"
    "line_start": 165
    "line_end": 165
  "translation_ja": "はたしてその命はどうなるのか。それは次回の説き明かしをお聞きあれ。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-01-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の心神は悟空、木母は五行の寓意で八戒を指すと解した。居舍・歸性・體真は心と身体、魔と本性を重ねる表現であり、物語の具体的な動作だけに置き換えない。細かな寓意の対応には解釈の余地がある。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-02-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "外公は母方の祖父。悟空が孫姓と合わせて要求する呼び名で、実際の血縁ではなく、相手を自分より下へ置く言い方。直前の『せがれ』との親族関係のずれを直してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-03-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "好看千里客は、遠来の客をよくもてなす意。『老乞大』諸版にも同趣旨の諺があり、単に遠くの客を眺める意味ではない。ここでは名声を気にさせる挑発の中に引かれている。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-04-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は『心中暗想道』で始まる一つの鉤括弧の中に、内心の自省と、相手に口を開けよと告げる言葉を続ける。訳文では応答の関係が分かるよう両者を分けた。原文の引用符は変更していない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-05-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "先には前歯が砕けたとあり、ここでは上下の鋼の歯が刃のように並ぶと描かれる。前歯以外だけだと補って整合させず、底本の双方の描写を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-06-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "㮇㮇はこの場面で喉に縄が残る不快感を表すと解した。㮇には火をかき立てる棒・かき動かす意が見えるが、この重語の語義は辞書で直接確定できていない。原字は残し、別字への補訂はしない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-07-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "掩樣の法は、見かけで本当の姿を隠す術をいうと解した。縄が毛の変化であるという説明であり、妖怪の痛みまで幻だったことに変更してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-08-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は『侮著臉』。直前に頬を打たれた文脈から、顔を押さえる動作と解した。侮の字面だけでは通常この動作を表さず、原字を保持して留保する。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-09-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は五閻王。十王のうち第五の王である閻羅王への呼称と解し、五人の王という複数にはしていない。原文の他という単数の指示とも整合する。ここで語っているのは使者を装った悟空であり、実際の冥界からの命令ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-10-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この発言の前の原文は『獃子道：」』と開きと逆向きの引用符になっている。原文は保存し、八戒の応答として日本語の引用範囲を整えた。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-11-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八戒は四銭六分の銀塊だと説明し、取り出した語りは四銭五六分とする。数値を統一せず残した。銭・分はここでは銀の重さで、現代の硬貨の額面や日本の制度へ換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-12-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原詩には大魔が仲を取り持ったとある。大妖魔という表現を残し、ここから特定の一人を割り当てたり、別の回の説明に合わせて字を補訂したりはしていない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-13-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "善勝はここではたいへん善良である意。漢典もこの発言を用例に示す。勝負に強い意や、同じ名の古代の刀とは区別する。悟空の自己説明として訳し、語り手の評価へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-14-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文も『……如此如此』として計画の具体的な部分を伏せている。訳文の省略ではなく原文の表現であり、内容を推測して補っていない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-15-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は經云として『泰極否還生』を引く。泰・否には通じることと塞がることの対があるが、この句の厳密な典拠は未確定。特定の経典の直接引用だと断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-16-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "彪は虎の子を表す語義により訳した。老虎との対比、雄という性別、白面という容貌を保ち、豹へ取り替えない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-17-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は『伶俐狐狸當道行』。都市の役割を並べる文脈から、道行を道を導く役と暫定的に解した。公開辞書でこの用法そのものを確定できず、通常の『道行』の修行の力という語義を機械的に当てはめなかった。文引は往来・伝達に使う文書と解したが、特定の官制・文書形式までは断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch76-note-18-body"
  "section_id": "chapter-76"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "城門が開いた後の『吩咐』『說』は、命令した個人を原文が明記していない。名のある妖王の一人へ推測で帰属させず、話者不明とした。"
  "translation_status": "reviewed"

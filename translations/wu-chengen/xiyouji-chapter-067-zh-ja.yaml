  "translation_ja": |-
    老人はこれを聞くと、怒りを喜びに変え、腰をかがめて招いた。
    老人「どうぞ、どうぞ、むさ苦しい家ですが、中でお休みください。」
    そこで四人は馬を引き、荷を担いで、そろって中へ入った。両側には棘のある枝や茨が敷き詰めてある。二つ目の門の囲いは煉瓦と石を積んだ壁で、そこにも茨が覆いかぶせてあった。その奥に入って、ようやく三間の瓦葺きの家がある。老人は椅子を引いて座らせ、茶を勧め、食事の支度も命じた。やがて卓を運び、麩、豆腐、里芋の若芽、大根、辛いカラシナ、カブ、香りのよい稲の飯、酢を入れて煮た葵（あおい）の汁を、たくさん並べた。師弟はたっぷり食べ、満腹になった。
  "translation_status": "reviewed"
- "id": "xy-ch67-007"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "吃畢，八戒扯過行者，背云：「師兄，這老兒始初不肯留宿，今返設此盛齋，何也？」行者道：「這個能值多少錢？到明日，還要他十果十菜的送我們哩。」八戒道：「不羞，憑你那幾句大話，哄他一頓飯吃了，明日卻要跑路，他又管待送你怎的？」行者道：「不要忙，我自有個處治。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    食事が済むと、八戒は悟空を脇へ引き寄せ、小声で言った。
    八戒「兄貴、あのじいさんは、最初は泊めるのも嫌がっていたのに、今度はこんな立派な精進料理だ。どういうわけだい。」
    悟空「こんなの、いくらの値打ちがある。明日には、果物十品、料理十品で送ってもらうぞ。」
    八戒「よく恥ずかしくないな。大ぼらを二、三言並べて、一食だまし取っただけだろ。明日はもう出発するのに、どうしてまたもてなして、送り出してくれるんだ。」
    悟空「慌てるな。俺に考えがある。」
  "translation_status": "reviewed"
- "id": "xy-ch67-008"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，漸漸黃昏，老者又叫掌燈。行者躬身問道：「公公高姓？」老者道：「姓李。」行者道：「貴地想就是李家莊了？」老者道：「不是，這裡喚做駝羅莊，共有五百多人家居住。別姓俱多，惟我姓李。」行者道：「李施主，府上有何善意，賜我等盛齋？」那老者起身道：「才聞得你說會拿妖怪，我這裡卻有個妖怪，累你替我們拿拿，自有重謝。」行者就朝上唱個喏道：「承照顧了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    ほどなく、辺りが次第に夕闇に包まれると、老人は灯をともさせた。悟空は身をかがめて尋ねた。
    悟空「ご老人、お姓は何とおっしゃいます。」
    老人「李（り）と申します。」
    悟空「では、ここは李家荘（りかそう）というのでしょうね。」
    李老人（りろうじん）「いや、ここは駝羅荘（だらそう）といって、五百軒余りの家がある。ほかの姓はいろいろあるが、李姓はわし一人だ。」
    悟空「李のお施主さま、どのようなお気持ちから、私どもに立派な精進料理を下さったのですか。」
    李老人は立ち上がった。
    李老人「先ほど、妖怪を捕まえられると聞きました。ここにも妖怪がおりましてな。お手数だが、私どものために捕まえていただきたい。十分なお礼はいたします。」
    悟空はすぐ上座へ向かって、声をかけながら礼をした。
    悟空「ごひいき、ありがとうございます。」
  "translation_status": "reviewed"
- "id": "xy-ch67-009"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒道：「你看他惹禍，聽見說拿妖怪，就是他外公也不這般親熱，預先就唱個喏。」行者道：「賢弟，你不知，我唱個喏就是下了個定錢，他再不去請別人了。」三藏聞言道：「這猴兒，凡事便要自專。倘或那妖精神通廣大，你拿他不住，可不是我出家人打誑語麼？」行者笑道：「師父莫怪，等我再問了看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    八戒「ほら、厄介事を引き受けた。妖怪退治と聞いたら、自分の母方のじいさんにだってあそこまで親しくしないだろうに、早々とお辞儀だ。」
    悟空「弟よ、分からないか。俺がお辞儀をしたのは、手付けを打ったのと同じさ。これで、もうほかの者には頼まない。」
    聞いていた三蔵が言った。
    三蔵「この猿は、何でも独り決めしたがる。もしその妖怪の神通力が大きくて、お前に捕まえられなかったら、出家した私たちが嘘をつくことになるではないか。」
    悟空は笑った。
    悟空「お師匠さま、お怒りにならず。もう少し尋ねてみますから。」
  "translation_status": "reviewed"
- "id": "xy-ch67-010"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老者道：「還問甚？」行者道：「你這貴處，地勢清平，又許多人家居住，更不是偏僻之方，有甚麼妖精敢上你這高門大戶？」老者道：「實不瞞你說，我這裡久矣康寧。只這三年六月間，忽然一陣風起。那時人家甚忙，打麥的在場上，插秧的在田裡，俱著了忙，只說是天變了。誰知風過處，有個妖精，將人家牧放的牛馬吃了，豬羊吃了，見雞鵝囫圇咽，遇男女夾活吞。自從那次，這二年常來傷害。長老啊，你若有手段，拿了妖怪，掃淨此土，我等決然重謝，不敢輕慢。」行者道：「這個卻是難拿。」八戒道：「真是難拿，難拿。我們乃行腳僧，借宿一宵，明日走路，拿甚麼妖精？」老者道：「你原來是騙飯吃的和尚。初見時誇口弄舌，說會換斗移星，降妖縛怪，及說起此事，就推卻難拿。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    李老人「まだ何を尋ねるのです。」
    悟空「この辺りは土地も平らで、たくさんの家があり、辺鄙な所でもありません。どんな妖怪が、お宅のような立派な屋敷に押しかけるのですか。」
    李老人「隠さず申し上げますが、ここは長い間、平穏でした。ところが、三年前の六月、突然風が吹き起こったのです。そのときは皆忙しく、麦を打つ者は脱穀場に、田植えをする者は田におりました。皆あわてて、天候が変わったのだとばかり思った。ところが風の通った所に妖怪がいて、放牧していた牛馬も、豚や羊も食ってしまった。鶏やガチョウを見れば丸呑みし、男でも女でも生きたまま呑み込むのです。あれ以来、この二年、しょっちゅう害を加えに来る。お坊さま、腕がおありなら妖怪を捕らえ、この土地を清めてください。必ず厚くお礼をし、決して粗末にはいたしません。」
    悟空「そいつは、ちょっと捕まえにくいな。」
    八戒「本当に難しい、難しい。俺たちは旅の僧だ。一晩泊まって、明日は出発する。何だって妖怪なんか捕まえるんだ。」
    李老人「さては、ただ飯をだまし取る和尚だったか。初めは大口をたたいて、北斗や星を動かすの、妖怪や魔物を捕まえるのと言っておったのに、この話になったら、難しいと言って逃げるのか。」
  "translation_status": "reviewed"
- "id": "xy-ch67-011"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「老兒，妖精好拿，只是你這方人家不齊心，所以難拿。」老者道：「怎見得人心不齊？」行者道：「妖精攪擾了三年，也不知傷害了多少生靈。我想著每家只出銀一兩，五百家可湊五百兩銀子，不拘到那裡，也尋一個法官把妖拿了，卻怎麼就甘受他三年磨折？」老者道：「若論說使錢，好道也羞殺人，我們那家不花費三五兩銀子？前年曾訪著山南裡有個和尚，請他到此拿妖，未曾得勝。」行者道：「那和尚怎的拿來？」老者道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    悟空「じいさん、妖怪を捕らえるのは簡単だ。ただ、この土地の人たちの心が一つになっていない。だから難しいんだ。」
    李老人「どうして、人の心がそろっていないと分かる。」
    悟空「妖怪が三年も荒らして、どれほど多くの命を損なったか分からない。各家から銀一両ずつ出せば、五百軒で五百両になるだろう。それだけあれば、どこへ行ったって法術の使い手を一人見つけて、退治してもらえるはずだ。それなのに、どうして三年も苦しめられるままにしていたんだ。」
    李老人「金を使うという話なら、恥ずかしくなるほどです。どの家だって、銀の三両や五両は出しましたとも。一昨年、山の南にいる和尚を探し当て、ここへ妖怪退治に招きましたが、勝てませんでした。」
    悟空「その和尚は、どうやって退治したんだ。」
    李老人は語った。
  "translation_status": "reviewed"
- "id": "xy-ch67-012"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": "那個僧伽，披領袈裟。先談、《孔雀》，後念《法華》。香焚爐內，手把鈴拿。正然念處，驚動妖邪。風生雲起，徑至莊家。僧和怪鬥，其實堪誇：一遞一拳搗，一遞一把抓。和尚還相應，相應沒頭髮。須臾妖怪勝，徑直返煙霞。原來曬乾疤。我等近前看，光頭打的似個爛西瓜。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    李老人「あの僧は、袈裟（けさ）をまとい、
    まず『孔雀（くじゃく）』を説き、その後『法華（ほっけ）』を唱えた。
    炉には香を焚き、手には鈴を持つ。
    唱えているうち、邪悪な妖怪を呼び起こした。
    風が生じ、雲が湧き、妖怪はまっすぐ村へ来た。
    和尚と妖怪の戦いは、まことに大したものだった。
    代わる代わる拳を打ち込み、代わる代わるつかみかかる。
    和尚にはまだ都合がよかった。髪がないのが、都合よかった。
    やがて妖怪が勝ち、そのまま霞の彼方へ帰っていった。
    残ったのは、日干しの傷跡というありさま。
    わしらが近寄って見ると、坊主頭は殴りつぶされ、腐った西瓜のようになっていた。」
  "translation_status": "reviewed"
- "id": "xy-ch67-013"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者笑道：「這等說，吃了虧也。」老者道：「他只拚得一命，還是我們吃虧：與他買棺木殯葬，又把些銀子與他徒弟。那徒弟心還不歇，至今還要告狀，不得乾淨。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    悟空は笑った。
    悟空「それじゃ、ひどい目に遭ったんだな。」
    李老人「和尚は命一つを投げ出しただけで、損をしたのはわしらのほうです。棺を買って葬り、弟子にもいくらか銀を渡した。その弟子はまだ気が済まず、今でも訴えると言っておる。いつまでも片づきません。」
  "translation_status": "reviewed"

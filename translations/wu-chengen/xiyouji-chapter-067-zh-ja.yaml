  "source_text": "正講處，只聽得呼呼風響。慌得那八九個老者戰戰兢兢道：「這和尚鹽醬口，說妖精，妖精就來了。」那老李開了腰門，把幾個親戚連唐僧，都叫：「進來，進來，妖怪來了。」諕得那八戒也要進去，沙僧也要進去。行者兩隻手扯住兩個道：「你們忒不循理，出家人怎麼不分內外？站住，不要走，跟我去天井裡，看看是個甚麼妖精？」八戒道：「哥啊，他們都是經過帳的，風響便是妖來。他都去躲，我們又不與他有親，又不相識，又不是交契故人，看他做甚？」原來行者力量大，不容說，一把拉在天井裡站下。那陣風越發大了，好風："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    そう話しているところへ、ひゅうひゅうと風の音が聞こえた。八、九人の老人は慌てふためき、震えながら言った。
    老人たち「この和尚の口は、塩や味噌のようにききすぎる。妖怪の話をしたら、妖怪が来てしまった。」
    李老人は奥へ通じる門を開け、親戚たちも三蔵も呼び入れた。
    李老人「中へ、中へ。妖怪が来たぞ。」
    八戒も驚いて入ろうとし、沙悟浄も入ろうとした。悟空は両手で二人をつかんだ。
    悟空「お前たちは、本当に道理をわきまえない。出家した者が、どうして外と奥の区別もつかないんだ。待て、行くな。俺と中庭へ出て、どんな妖怪か見てみよう。」
    八戒「兄貴、あの人たちは経験済みなんだ。風が鳴れば妖怪が来る。だから皆隠れるのさ。俺たちは妖怪と親戚でも知り合いでも、親しく付き合った古い友達でもない。見てどうする。」
    何しろ悟空は力が強い。ものも言わせず、一つかみにして中庭へ引き出し、立たせた。風はいよいよ強くなる。まことに、すさまじい風だ。
  "translation_status": "reviewed"
- "id": "xy-ch67-020"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    倒樹摧林狼虎憂，播江攪海鬼神愁。
    掀翻華岳三峰石，提起乾坤四部洲。
    村舍人家皆閉戶，滿莊兒女盡藏頭。
    黑雲漠漠遮星漢，燈火無光遍地幽。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 154
    "line_end": 157
  "translation_ja": |-
    木を倒し林を砕いて、狼も虎もおびえ、川を揺さぶり海をかき回して、鬼神も愁える。
    華岳（かがく）の三峰の岩をひっくり返し、天地の四部洲（しぶしゅう）を持ち上げる。
    村の家々は戸を閉ざし、村じゅうの子らは皆、頭を隠す。
    黒雲が一面に天の川を覆い、灯火は光を失って、地上はことごとく闇となる。
  "translation_status": "reviewed"

  "source_text": "行者道：「不打緊，不打緊，等我替你拿他來。」老者道：「你若果有手段拿得他，我請幾個本莊長者與你寫個文書：若得勝，憑你要多少銀子相謝，半分不少；如若有虧，切莫和我等放賴，各聽天命。」行者笑道：「這老兒被人賴怕了。我等不是那樣人，快請長者去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    悟空「大丈夫、大丈夫。俺が代わりに捕まえてやろう。」
    李老人「本当に捕まえられるだけの腕がおありなら、村の年長者を何人か呼び、証文を書きましょう。勝てば、お望みの銀をいくらでもお礼に差し上げ、一分の半分さえ欠かさずお支払いします。だが、万一ひどい目に遭っても、わしらに言いがかりをつけぬこと。互いに天命に任せるのです。」
    悟空は笑った。
    悟空「じいさんは、ずいぶん言いがかりをつけられて懲りたんだな。俺たちはそんな者じゃない。早く年長者を呼んでこい。」
  "translation_status": "reviewed"
- "id": "xy-ch67-018"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老者滿心歡喜，即命家僮請幾個左鄰、右舍、表弟、姨兄、親家、朋友，共有八九位老者，都來相見，會了唐僧，言及拿妖一事，無不欣然。眾老問：「是那一位高徒去拿？」行者叉手道：「是我小和尚。」眾老悚然道：「不濟，不濟。那妖精神通廣大，身體狼犺。你這個長老瘦瘦小小，還不夠他填牙齒縫哩。」行者笑道：「老官兒，你估不出人來。我小自小，結實，都是『吃了磨刀水的秀氣在內』哩。」眾老見說，只得依從道：「長老，拿住妖精，你要多少謝禮？」行者道：「何必說要甚麼謝禮？俗語云：『說金子晃眼，說銀子傻白，說銅錢腥氣。』我等乃積德的和尚，決不要錢。」眾老道：「既如此說，都是受戒的高僧。既不要錢，豈有空勞之理？我等各家俱以魚田為活，若果降了妖孽，淨了地方，我等每家送你兩畝良田，共湊一千畝，坐落一處，你師徒們在上起蓋寺院，打坐參禪，強似方上雲遊。」行者又笑道：「越不停當。但說要了田，就要養馬當差，納糧辦草，黃昏不得睡，五鼓不得眠，好倒弄殺人也。」眾老道：「諸般不要，卻將何謝？」行者道：「我出家人，但只是一茶一飯，便是謝了。」眾老喜道：「這個容易。但不知你怎麼拿他？」行者道：「他但來，我就拿住他。」眾老道：「那妖大著哩：上拄天，下拄地；來時風，去時霧。你卻怎生近得他？」行者笑道：「若論呼風駕霧的妖精，我把他當孫子罷了；若說身體長大，有那手段打他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"

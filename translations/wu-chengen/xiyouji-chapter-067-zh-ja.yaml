  "source_text": "話說三藏四眾躲離了小西天，欣然上路。行經個月程途，正是春深花放之時，見了幾處園林皆綠暗，一番風雨又黃昏。三藏勒馬道：「徒弟啊，天色晚矣，往那條路上求宿去？」行者笑道：「師父放心。若是沒有借宿處，我三人都有些本事，叫八戒砍草，沙和尚扳松，老孫會做木匠，就在那路上搭個蓬庵，好道也住得年把，你忙怎的？」八戒道：「哥呀，這個所在豈是住場？滿山多虎豹狼蟲，遍地有魑魅魍魎，白日裡尚且難行，黑夜裡怎生敢宿？」行者道：「獃子，越發不長進了。不是老孫海口，只這條棒子揝在手裡，就是塌下天來，也撐得住。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"

  "origin": "source"
  "source_text": "行者忍不住，高叫道：「你這老兒甚不通便，我等遠來投宿，你就說出這許多話來諕人。十分你家窄逼沒處睡，我等在此樹下蹲一蹲，也就過了此宵，何故這般絮聒？」那老者見了他相貌醜陋，便也擰住口，驚嘬嘬的硬著膽，喝了一聲，用藜杖指定道：「你這廝骨撾臉，磕額頭，塌鼻子，凹頡腮，毛眼毛睛，癆病鬼，不知高低，尖著個嘴，敢來衝撞我老人家？」行者陪笑道：「老官兒，你原來有眼無珠，不識我這癆病鬼哩。相法云：『形容古怪，石中有美玉之藏。』你若以言貌取人，乾淨差了。我雖醜便醜，卻倒有些手段。」老者道：「你是那方人氏？姓甚名誰？有何手段？」行者笑道：「我"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"

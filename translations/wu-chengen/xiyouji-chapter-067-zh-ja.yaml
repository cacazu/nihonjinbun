  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，縱身打個唿哨，跳到空中，執鐵棒，厲聲高叫道：「慢來，慢來，有吾在此。」那怪見了，挺住身軀，將一根長槍亂舞。行者執了棍勢，問道：「你是那方妖怪？何處精靈？」那怪更不答應，只是舞槍。行者又問，又不答，只是舞槍。行者暗笑道：「好是耳聾口啞。不要走，看棍。」那怪更不怕，亂舞槍遮攔。在那半空中，一來一往，一上一下，鬥到三更時分，未見勝敗。八戒、沙僧在李家天井裡看得明白。原來那怪只是舞槍遮架，更無半分兒攻殺。行者一條棒不離那怪的頭上。八戒笑道：「沙僧，你在這裡護持，讓老豬去幫打幫打，莫教那猴子獨幹這功，領頭一鍾酒。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    見事な悟空は、身を躍らせ、ひと声口笛を吹いて空へ跳び上がった。鉄棒を手に、厳しい声で叫んだ。
    悟空「待て、待て。ここには俺がいるぞ。」
    妖怪は悟空を見ると体をぐっと構え、長い槍を一本、むやみに振り回した。悟空は棒を構えて尋ねた。
    悟空「どこの妖怪だ。どこに住む精霊だ。」
    妖怪は何も答えず、槍を振り回すだけだった。悟空がもう一度尋ねても、やはり答えず、ただ槍を振り回す。悟空はひそかに笑った。
    悟空「なるほど、耳が聞こえず口もきけないのか。逃げるな、棒を受けろ。」
    妖怪は少しも恐れず、槍を振るって受け止めた。空中で進み退き、上へ下へと、三更（さんこう）まで戦ったが、勝負はつかなかった。八戒と沙悟浄は李老人の家の中庭から、はっきり見ていた。妖怪はただ槍で受け、防ぐばかりで、少しも攻めてはこない。悟空の棒は、いつも妖怪の頭を狙っている。八戒は笑った。
    八戒「沙悟浄、ここでお師匠さまを守っていてくれ。俺も助太刀に行こう。あの猿一人に手柄を立てさせ、祝い酒の最初の一杯を飲ませるわけにはいかないからな。」
  "translation_status": "reviewed"
- "id": "xy-ch67-024"

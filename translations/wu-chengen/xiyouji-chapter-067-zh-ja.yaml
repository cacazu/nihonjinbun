  "translation_ja": |-
    さて、三蔵（さんぞう）たち四人は小西天（しょうさいてん）を逃れ、喜び勇んで旅を続けた。ひと月ほど進むうちに、季節は春もたけなわ、花の咲くころとなった。行く先々の園林は緑が深く、一しきり風雨が過ぎれば、また夕暮れである。三蔵は馬を止めて言った。
    三蔵「お前たち、日が暮れた。どちらへ行って宿を求めようか。」
    悟空（ごくう）は笑った。
    悟空「お師匠さま、ご安心ください。泊めてもらう所がなければ、私たち三人にも少しは腕があります。八戒（はっかい）に草を刈らせ、沙悟浄（さごじょう）に松の枝を折らせましょう。私は大工仕事ができますから、道端に草庵を建ててしまえば、一年ぐらいは住めますよ。何をそうお急ぎになるのです。」
    八戒「兄貴、ここが住める所かよ。山じゅう虎や豹、狼や獣だらけ、そこらじゅう魑魅魍魎（ちみもうりょう）がうようよしている。昼間でさえ歩くのが難しいのに、夜中に泊まれるものか。」
    悟空「ばか、ますます進歩がないな。俺の大ぼらじゃない。この棒一本さえ手に握っていれば、天が落ちてきたって支えられるぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch67-003"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們正然講論，忽見一座山莊不遠。行者道：「好了，有宿處了。」長老問：「在何處？」行者指道：「那樹叢裡不是個人家？我們去借宿一宵，明早走路。」長老欣然促馬，至莊門外下馬，只見那柴扉緊閉。長老敲門道：「開門，開門。」裡面有一老者，手拖藜杖，足踏蒲鞋，頭頂烏巾，身穿素服，開了門，便問：「是甚人在此大呼小叫？」三藏合掌當胸，躬身施禮道：「老施主，貧僧乃東土差往西天取經者。適到貴地，天晚，特造尊府借宿一宵，萬望方便方便。」老者道：「和尚，你要西行，卻是去不得啊。此處乃小西天，若到大西天，路途甚遠。且休道前去艱難，只這個地方已此難過。」三藏問：「怎麼難過？」老者用手指道：「我這莊村西去三十餘里，有一條稀柿衕，山名七絕。」三藏道：「何為『七絕』？」老者道：「這山徑過有八百里，滿山盡是柿果。古云：『柿樹有七絕：一，益壽；二，多陰；三，無鳥巢；四，無蟲；五，霜葉可玩；六，嘉實；七，枝葉肥大。』故名七絕山。我這敝處地闊人稀，那深山亙古無人走到。每年家熟爛柿子落在路上，將一條夾石衚衕盡皆填滿，又被雨露雪霜經黴過夏，作成一路污穢，這方人家俗呼為『稀屎衕』。但刮西風，有一股穢氣，就是淘東圊也不似這般惡臭。如今正值春深，東南風大作，所以還不聞見也。」三藏心中煩悶不言。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"

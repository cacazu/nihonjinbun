  "translation_ja": |-
    さらに長く戦ううち、いつしか東の空が白み始めた。妖怪は戦いにとどまるのを恐れ、向きを変えて逃げた。悟空と八戒は一緒に追いかけたが、突然、汚物の臭いが鼻を突いた。七絶山の稀柿衕に来たのである。
    八戒「どこの家が便所を汲み取っているんだ。うえっ、ひどい臭いだ。」
    悟空は鼻を覆い、ただ叫んだ。
    悟空「早く妖怪を追え。早く追え。」
    怪物は山の向こうへ飛び込むと、本来の姿を現した。赤い鱗をまとった大蟒（だいぼう）だった。その姿を見れば、

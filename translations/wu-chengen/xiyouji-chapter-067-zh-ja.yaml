    "line_end": 123
  "translation_ja": |-
    師弟がそう話していると、遠からぬ所に山村が見えた。
    悟空「よし、泊まる所があったぞ。」
    三蔵「どこだね。」
    悟空は指さした。
    悟空「あの木立の中に人家があるでしょう。一晩泊めてもらって、明朝出発しましょう。」
    三蔵は喜んで馬を進め、屋敷の門前で下りた。柴の扉は固く閉ざされていたので、たたいて呼んだ。
    三蔵「開けてください、開けてください。」
    中から一人の老人が出てきた。アカザの杖を引き、蒲の草履を履き、黒い頭巾をかぶって、白い衣を着ている。老人は門を開けると言った。
    老人「ここで大声を上げているのは、何者だ。」
    三蔵は胸の前で合掌し、身をかがめて礼をした。
    三蔵「ご老人、私は東土（とうど）から、西天（さいてん）へ経を取りに遣わされた僧でございます。こちらへ着いたところで日が暮れましたので、お宅を訪ね、一晩の宿をお願いに参りました。どうかお計らいください。お願いいたします。」
    老人「お坊さま、西へ行くというが、行けはせんぞ。ここは小西天、大西天（だいさいてん）まではずいぶん遠い。先々の難儀はさておき、この辺りを通るだけでも難しいのだ。」
    三蔵「どう難しいのでしょう。」
    老人は手で指さした。
    老人「この村から西へ三十里余り行くと、稀柿衕（きしどう）という道がある。山の名は七絶（しちぜつ）だ。」
    三蔵「七絶とは、どういう意味ですか。」
    老人「山を通り抜ける道は八百里あり、山じゅう柿だらけだ。昔から『柿の木には七つのすぐれた点がある。一に寿命を延ばす。二に木陰が多い。三に鳥が巣をかけない。四に虫がつかない。五に霜に染まる葉を楽しめる。六に実がよい。七に枝葉が大きく茂る』という。それで七絶山（しちぜつざん）というのだ。この辺りは土地が広いわりに人が少なく、あの山奥は大昔から人が踏み込んだこともない。毎年、熟しきった柿が道に落ち、両側を岩に挟まれた細道をすっかり埋めてしまう。それが雨露や雪霜にさらされ、黴の生える時季から夏を越して腐り、道じゅう汚物だらけになった。この辺の者は俗に『稀屎衕（きしどう）』、つまり下痢糞の道と呼んでおる。西風が吹くと、ひどい臭いが来るのだ。便所を汲み取ったって、これほどの悪臭はせん。今は春も深まり、東南の風が盛んに吹いているから、まだ臭わんだけだ。」
    三蔵は心がふさぎ、黙り込んだ。
  "translation_status": "reviewed"

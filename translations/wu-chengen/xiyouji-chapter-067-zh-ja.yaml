  "kind": "verse"
  "origin": "source"
  "source_text": "眼射曉星，鼻噴朝霧。密密牙排鋼劍，彎彎爪曲金鉤。頭戴一條肉角，好便似千千塊瑪瑙攢成；身披一派紅鱗，卻就如萬萬片胭脂砌就。盤地只疑為錦被，飛空錯認作虹霓。歇臥處有腥氣沖天，行動時有赤雲罩體。大不大，兩邊人不見東西；長不長，一座山跨占南北。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    目は明けの星のような光を放ち、鼻は朝霧を噴き出す。
    びっしり並ぶ牙は鋼の剣、曲がった爪は金の鉤。
    頭には肉の角が一本、幾千もの瑪瑙を寄せ集めたよう。
    身には赤い鱗が一面に、幾万もの紅のかけらを敷き詰めたよう。
    地上にとぐろを巻けば錦の掛け布団かと疑い、空を飛べば虹かと見まがう。
    横たわる所では生臭い気が天に突き上がり、動けば赤い雲が体を包む。
    どれほど大きいか。両側の人は、東と西に互いを見ることができない。
    どれほど長いか。一つの山をまたぎ、南から北まで占めてしまう。
  "translation_status": "reviewed"
- "id": "xy-ch67-027"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒道：「原來是這般一個長蛇。若要吃人啊，一頓也得五百個，還不飽足。」行者道：「那軟柄槍乃是兩條信㮇。我們趕他軟了，從後打出去。」這八戒縱身趕上，將鈀便築。那怪物一頭鑽進窟裡，還有七八尺長尾巴丟在外邊。八戒放下鈀，一把撾住道：「著手，著手。」盡力氣往外亂扯，莫想扯得動一毫。行者笑道：「獃子，放他進去，自有處置，不要這等倒扯蛇。」八戒真個撒了手，那怪縮進去了。八戒怨道：「才不放手時，半截子已是我們的了；是這般縮了，卻怎麼得他出來？這不是叫做沒蛇弄了？」行者道：「這廝身體狼犺，窟穴窄小，斷然轉身不得，一定是個照直攛的，定有個後門出頭。你快去後門外攔住，等我在前門外打。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    八戒「なるほど、こんな長い蛇だったのか。人を食うなら、一食に五百人はいる。それでも腹はふくれまい。」
    悟空「あの軟柄槍は、二筋の舌だったのさ。追いかけてへばらせ、後ろから打って追い立ててやろう。」
    八戒は跳びかかり、熊手を打ち込んだ。大蟒は頭から穴へ潜り込み、七、八尺の尾だけが外に残った。八戒は熊手を置き、尾をひとつかみにした。
    八戒「つかまえた、つかまえた。」
    力いっぱい引っぱったが、髪の毛一本ほども動かせなかった。悟空は笑った。
    悟空「ばか、穴へ入れてやれ。ちゃんと方法がある。そんなふうに、蛇を後ろ向きに引っぱるな。」
    八戒が本当に手を放すと、大蟒はするりと中へ入ってしまった。八戒は不平を言った。
    八戒「今さっき手を放さなければ、半分はもう俺たちのものだったのに。こんなに引っ込んでしまったら、どうやって出すんだ。これこそ、いじる蛇もなくなったってやつじゃないか。」
    悟空「こいつは体が大きく、穴は狭い。絶対に中で向きを変えられない。まっすぐ抜けるしかないから、必ず頭の出る裏口がある。早く裏口へ行ってふさげ。俺が表から打つ。」
  "translation_status": "reviewed"
- "id": "xy-ch67-028"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子真個一溜煙跑過山去，果見有個孔窟，他就扎定腳。還不曾站穩，不期行者在前門外使棍子往裡一搗，那怪物護疼，徑往後門攛出。八戒未曾防備，被他一尾巴打了一跌，莫能掙挫得起，睡在地下忍疼。行者見窟中無物，搴著棒，跑過來叫趕妖怪。那八戒聽得吆喝，自己害羞，忍著疼，爬起來，使鈀亂撲。行者見了，笑道：「妖怪走了，你還撲甚的了？」八戒道：「老豬在此打草驚蛇哩。」行者道：「活獃子，快趕上。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    八戒は言われたとおり、一目散に山の向こうへ走った。果たして穴があったので、足を踏ん張った。だが、まだしっかり立たぬうちに、悟空が表の口から棒を突っ込んだ。痛みを避けようとした大蟒は、まっすぐ裏口へ飛び出した。八戒は備えがなく、尾でひと打ちされて転んだ。どうもがいても起き上がれず、地面に寝たまま痛みをこらえた。悟空は穴の中が空になったのを見ると、棒を持って駆けてきて、妖怪を追えと叫んだ。八戒はその声を聞くと恥ずかしくなり、痛みをこらえて這い起き、熊手でむやみに辺りを打った。悟空は笑った。
    悟空「妖怪はもう行ってしまったぞ。何を打っているんだ。」
    八戒「俺はここで、草を打って蛇を驚かしているんだよ。」
    悟空「まったく、筋金入りのばかだ。早く追いつけ。」
  "translation_status": "reviewed"
- "id": "xy-ch67-029"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人趕過澗去，見那怪盤做一團，豎起頭來，張開巨口，要吞八戒。八戒慌得往後便退。這行者反迎上前，被他一口吞之。八戒搥胸跌腳，大叫道：「哥耶，傾了你也。」行者在妖精肚裡支著鐵棒道：「八戒莫愁，我叫他搭個橋兒你看。」那怪物躬起腰來，就似一道路東虹。八戒道：「雖是像橋，只是沒人敢走。」行者道：「我再叫他變做個船兒你看。」在肚裡將鐵棒撐著肚皮。那怪物肚皮貼地，翹起頭來，就似一隻贛保船，八戒道：「雖是像船，只是沒有桅篷，不好使風。」行者道：「你讓開路，等我叫他使個風你看。」又在裡面盡著力把鐵棒從脊背上搠將出去，約有五七丈長，就似一根桅杆。那廝忍疼掙命，往前一攛，比使風更快，攛回舊路，下了山，有二十餘里，卻才倒在塵埃，動蕩不得，嗚呼喪矣。八戒隨後趕上來，又舉鈀亂築。行者把那物穿了一個大洞，鑽將出來道：「獃子，他死也死了，你還築他怎的？」八戒道：「哥啊，你不知我老豬一生好打死蛇？」遂此收了兵器，抓著尾巴，倒拉將來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    二人が谷川を越えて追うと、大蟒はとぐろを巻き、頭をもたげ、大口を開いて八戒を呑み込もうとした。八戒は慌てて後ずさりしたが、悟空は逆に前へ進み、一口に呑み込まれた。八戒は胸をたたき、地団駄を踏んで大声で叫んだ。
    八戒「ああ、兄貴、やられちまった。」
    悟空は大蟒の腹の中で鉄棒をつっかい棒にした。
    悟空「八戒、心配するな。こいつに橋を架けさせて、見せてやる。」
    大蟒は胴を弓なりに曲げ、道の東にかかる虹のようになった。
    八戒「橋には似ているが、渡る者はいないだろうな。」
    悟空「今度は船にして見せてやる。」
    悟空は腹の中で鉄棒を腹の皮へ突っ張った。大蟒は腹を地につけ、頭を高く上げて、贛保船（かんぽせん）のようになった。
    八戒「船には似ているが、帆柱も帆もない。風で走れないじゃないか。」
    悟空「道を空けろ。こいつを風に乗せて見せてやる。」
    悟空は腹の中で力をこめ、鉄棒を背中から突き出した。五、七丈ほども突き出た棒は、一本の帆柱のようだった。大蟒は痛みをこらえ、必死に前へ飛び出した。風に乗るよりも速く、元来た道を突っ走り、山を下り、二十里余り進んで、ようやく地面に倒れた。もはや動けず、ああ、命を落とした。八戒は後から追いつくと、また熊手を振り上げ、むやみに打ち込んだ。悟空は大蟒の体に大穴を穿ち、そこから出てきた。
    悟空「ばか、もう死んでいるのに、まだ何を打っているんだ。」
    八戒「兄貴、知らないのか。俺は昔から、死んだ蛇をたたくのが大好きなんだよ。」
    そこで武器を収め、尾をつかんで、後ろ向きに引きずって戻ってきた。
  "translation_status": "reviewed"
- "id": "xy-ch67-030"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那駝羅莊上李老兒與眾等對唐僧道：「你那兩個徒弟一夜不回，斷然傾了命也。」三藏道：「決不妨事。我們出去看看。」須臾間，只見行者與八戒拖著一條大蟒，吆吆喝喝前來。眾人卻才歡喜。滿莊上老幼男女，都來跪拜道：「爺爺，正是這個妖精在此傷人。今幸老爺施法，斬怪除邪，我輩庶各得安生也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    一方、駝羅荘では、李老人と一同が三蔵に言った。
    李老人と一同「あのお弟子さま二人は、一晩たっても戻りません。きっと命を落としたのでしょう。」
    三蔵「決して心配はいりません。外へ出て見てみましょう。」
    ほどなく、悟空と八戒が大蟒を引きずり、かけ声を上げながらやってくるのが見えた。一同はようやく喜んだ。村じゅうの老若男女が来て、ひざまずき礼拝した。
    村人たち「ありがたいお方、まさしくこの妖怪が、ここで人を傷つけていたのです。幸いにも、お力で怪物を討ち、邪悪を除いてくださった。これで私どもも、皆安らかに暮らせましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch67-031"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾家都是感激，東請西邀，各各酬謝。師徒們被留住五七日，苦辭無奈，方肯放行。又各家見他不要錢物，都辦些乾糧果品，騎騾壓馬，花紅彩旗，盡來餞行。此處五百人家，到有七八百人相送。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 173
    "line_end": 173
  "translation_ja": "家々は皆感激し、あちらからもこちらからも招いて、それぞれお礼をした。師弟は五、七日も引き留められたが、懸命に辞退し、皆も引き留めようがなくなって、ようやく出発を許した。各家とも、金も品物も受け取ってもらえないのを見て、旅の食料や果物を用意し、騾馬や馬に乗り、赤い飾りや色とりどりの旗を持って、残らず見送りに出た。五百軒の村から、七、八百人も送ってきたのである。"
  "translation_status": "reviewed"
- "id": "xy-ch67-032"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一路上喜喜歡歡，不時到了七絕山稀柿衕口。三藏聞得那般惡穢，又見路道填塞，道：「悟空，似此怎生過得？」行者侮著鼻子道：「這個卻難也。」三藏見行者說難，便就眼中垂淚。李老兒與眾上前道：「老爺勿得心焦。我等送到此處，都已約定意思了：令高徒與我們降了妖精，除了一莊禍害，我們各辦虔心，另開一條好路，送老爺過去。」行者笑道：「你這老兒，俱言之欠當。你初然說這山徑過有八百里，你等又不是大禹的神兵，那裡會開山鑿路？若要我師父過去，還得我們著力，你們都成不得。」三藏下馬，道：「悟空，怎生著力麼？」行者笑道：「眼下就要過山，卻也是難；若說再開條路，卻又難也。須是還從舊衚衕過去，只恐無人管飯。」李老兒道：「長老說那裡話，憑你四位擔擱多少時，我等俱養得起，怎麼說無人管飯。」行者道：「既如此，你們去辦得兩石米的乾飯，再做些蒸餅、饝饝來。等我那長嘴和尚吃飽了，變了大豬，拱開舊路，我師父騎在馬上，我等扶持著，管情過去了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    道中は皆喜びにあふれ、ほどなく七絶山の稀柿衕の入口に着いた。三蔵はそのひどい悪臭を嗅ぎ、道も埋まっているのを見て言った。
    三蔵「悟空、これでは、どうして通れるだろう。」
    悟空は鼻を覆った。
    悟空「これは、ちょっと難しいですね。」
    悟空が難しいと言うので、三蔵は涙を流した。李老人と一同が前へ進んだ。
    李老人と一同「お坊さま、お心を痛めないでください。ここまでお送りするにあたり、私どもは皆で相談しておきました。お弟子さまが妖怪を降し、村の災いを除いてくださったのです。私どもも真心を尽くし、新しくよい道を開いて、お通し申し上げます。」
    悟空は笑った。
    悟空「ご老人方、どれも筋の通らない話だ。初めに、この山を抜ける道は八百里あると言っただろう。あんたたちは大禹（たいう）の神兵でもないのに、どうやって山を開き、道を掘るんだ。お師匠さまを通すには、やはり俺たちが力を出さねばならない。あんたたちでは、どうにもならないよ。」
    三蔵は馬から下りた。
    三蔵「悟空、どう力を出すのだね。」
    悟空は笑った。
    悟空「今すぐ山を越えようとしても難しいし、新しく道を開くというのも難しい。やはり、元の細道を通るしかありません。ただ、食事を世話してくれる者がいないのではないかと。」
    李老人「お坊さま、何ということをおっしゃる。皆さま四人がどれほど長く滞在しようと、私どもで養えます。食事を世話する者がいないなどとは。」
    悟空「それなら、米二石を飯に炊き、蒸餅（じょうへい）や饝饝（もも）も作ってきてください。あの口の長い和尚に腹いっぱい食わせ、大きな豚に変身させて、鼻先で元の道を掘り開けさせるのです。お師匠さまは馬に乗り、我々が脇で支えれば、きっと通れます。」
  "translation_status": "reviewed"
- "id": "xy-ch67-033"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒聞言道：「哥哥，你們都要圖個乾淨，怎麼獨教老豬出臭？」三藏道：「悟能，你果有本事拱開衚衕，領我過山，註你這場頭功。」八戒笑道：「師父在上，列位施主們都在此，休笑話。我老豬本來有三十六般變化，若說變輕巧華麗飛騰之物，委實不能；若說變山，變樹，變石塊，變土墩，變賴象、科豬、水牛、駱駝，真個全會。只是身體變得大，肚腸越發大。須是吃得飽了，才好幹事。」眾人道：「有東西，有東西，我們都帶得有乾糧、果品、燒餅、饝饝在此，原要開山相送的，且都拿出來，憑你受用。待變化了，行動之時，我們再著人回去做飯送來。」八戒滿心歡喜，脫了皂直裰，丟了九齒鈀，對眾道：「休笑話，看老豬幹這場臭功。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    これを聞いて、八戒が言った。
    八戒「兄貴、自分たちはきれいでいようとして、どうして俺だけ臭い思いをするんだ。」
    三蔵「悟能（ごのう）、本当にその道を掘り開き、私を山の向こうへ導けるなら、この働きを第一の手柄として記そう。」
    八戒は笑った。
    八戒「お師匠さま、皆さんもここにいらっしゃるが、笑わないでくれよ。俺はもともと三十六通りの変化ができる。身軽で華やかな、空を飛び回るものになれと言われると、本当にできない。だが、山になり、木になり、石になり、土の盛り上がりになり、頼象（らいぞう）、科猪（かちょ）、水牛、駱駝になるなら、どれも本当にできるんだ。ただ、体が大きくなると腹もますます大きくなる。腹いっぱい食ってからでないと、働けないぞ。」
    人々「食べ物はあります。ありますとも。皆、旅の食料や果物、焼餅、饝饝を持ってきています。もともと山を開き、お送りするつもりでしたから。まずは全部出しますので、お好きなだけ召し上がってください。姿を変えて進み始めたら、また人を帰らせ、飯を作って届けさせます。」
    八戒は大喜びで、黒い直裰（ちょくたつ）を脱ぎ、九歯の熊手を投げ出し、皆に言った。
    八戒「笑うなよ。俺がこの、臭い手柄を立てるところを見ていろ。」
  "translation_status": "reviewed"
- "id": "xy-ch67-034"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好獃子，捻著訣，搖身一變，果然變做一個大豬。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 177
    "line_end": 177
  "translation_ja": "八戒は指で印を結び、身を揺すると、本当に一匹の大きな豚に変わった。まことに、その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch67-035"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    嘴長毛短半脂臕，自幼山中食藥苗。
    黑面環睛如日月，圓頭大耳似芭蕉。
    修成堅骨同天壽，煉就粗皮比鐵牢。
    齆齆鼻音呱詀叫，喳喳喉響噴喁哮。
    白蹄四隻高千尺，劍鬣長身百丈饒。
    從見人間肥豕彘，未觀今日老豬魈。
    唐僧等眾齊稱讚，羨美天蓬法力高。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 179
    "line_end": 185
  "translation_ja": |-
    口は長く毛は短く、身の半ばは脂肪、幼いころから山で薬草の芽を食らってきた。
    黒い顔、丸い目は日と月のよう。丸い頭、大きな耳は芭蕉の葉のよう。
    修め上げた堅い骨は天と同じ寿命を持ち、鍛えた厚い皮は鉄にも勝って丈夫だ。
    ふごふごと鼻を鳴らし、ぐわぐわと叫び、がらがらと喉を響かせ、ふんふんと息を噴いて吠える。
    白い四本の蹄は千尺の高さ、剣のようなたてがみ、長い身は百丈余り。
    人の世の肥えた豚は見たことがあっても、今日のこの豚の妖怪は見たことがない。
    三蔵をはじめ一同は口々に褒め、天蓬（てんぽう）の高い法力に感嘆した。
  "translation_status": "reviewed"
- "id": "xy-ch67-036"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫行者見八戒變得如此，即命那些相送人等快將乾糧等物推攢一處，叫八戒受用。那獃子不分生熟，一澇食之，卻上前拱路。行者叫沙僧脫了腳，好生挑擔；請師父穩坐雕鞍。他也脫了䩺鞋，吩咐眾人回去：「若有情，快早送些飯來與我師弟接力。」那些人有七八百相送隨行，多一半有騾馬的，飛星回莊做飯；還有三百人步行的，立於山下遙望他行。原來此莊至山有三十餘里，待回取飯來又三十餘里，往回擔擱約有百里之遙，他師徒們已此去得遠了。眾人不捨，催趲騾馬，進衚衕，連夜趕至，次日方才趕上。叫道：「取經的老爺，慢行，慢行，我等送飯來也。」長老聞言，謝之不盡道：「真是善信之人。」叫八戒住了，再吃些飯食壯神。那獃子拱了兩日，正在饑餓之際，那許多人何止有七八石飯食，他也不論米飯、麵飯，收積來一澇用之，飽餐一頓，卻又上前拱路。三藏與行者、沙僧謝了眾人，分手兩別。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    悟空は八戒がこのように変わったのを見ると、見送りの人々に、急いで旅の食料などを一か所へ積ませ、八戒に食べさせた。八戒は生も煮たものも区別せず、ひと息に全部食べ、前へ進んで道を掘り始めた。悟空は沙悟浄に、履物を脱いで、しっかり荷を担ぐよう言い、師には飾り鞍に落ち着いて座ってもらった。自分も䩺鞋（おうあい）を脱ぎ、人々に帰るよう言いつけた。
    悟空「情けをかけてくれるなら、早く食事を届けて、弟に力をつけさせてくれ。」
    見送ってついてきた七、八百人のうち、半数以上は騾馬や馬を持っており、飛ぶ星のように村へ戻って飯を作った。歩いてきた三百人は山の麓に立ち、遠ざかる一行を眺めていた。もともと村から山までは三十里余り、飯を取りに帰って来るにも、また三十里余りかかる。往復に手間取る道のりは百里ほどもあり、その間に師弟はすでに遠くへ進んでいた。人々はあきらめず、騾馬や馬を急がせて細道へ入り、一晩じゅう追って、翌日ようやく追いついた。食事を届ける人々が叫んだ。
    人々「経を取りに行かれるお坊さま、お待ちください、お待ちください。お食事を届けに参りました。」
    三蔵はその声を聞き、感謝してもしきれずに言った。
    三蔵「本当に、信仰の篤い方々です。」
    三蔵は八戒を止め、また飯を食べて力をつけるように言った。八戒は二日間も道を掘り、ちょうど空腹になっていたところだ。これほど多くの人が運んだ食事は、七、八石どころではない。八戒は米の飯でも粉の食べ物でもかまわず、一つに集めて一息に食べ尽くした。たっぷり一食を済ませると、また前へ進み、道を掘り始めた。三蔵と悟空、沙悟浄は人々に礼を言い、ここで互いに別れた。まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch67-037"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    駝羅莊客回家去，八戒開山過衕來。
    三藏心誠神力擁，悟空法顯怪魔衰。
    千年稀柿今朝淨，七絕衚衕此日開。
    六慾塵情皆剪絕，平安無阻拜蓮臺。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 188
    "line_end": 191
  "translation_ja": |-
    駝羅荘の人々は家へ帰り、八戒は山を開き、細道を越える。
    三蔵の真心には神の力が付き添い、悟空の法力が現れ、魔物は衰える。
    千年積もった腐れ柿も今朝清まり、七絶山の細道は今日開けた。
    六欲（ろくよく）も俗世の情も、すべて断ち切り、妨げなく安らかに蓮台（れんだい）を拝みにゆく。
  "translation_status": "reviewed"
- "id": "xy-ch67-038"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這去不知還有多少路程，還遇甚麼妖怪，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 193
    "line_end": 193
  "translation_ja": "さて、この先どれほどの道のりがあり、さらにどんな妖怪と出会うのか。それは次回のお話で。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-01-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "七つの長所と山名の由来は、老人が古い言い伝えとして語るもの。植物学上の性質や効能を述べる訳者の説明ではない。原文末尾は「枝葉肥大」であり、別の典籍にある「落葉」に直していない。「柿」と「屎」の近い音を利用して、腐れ柿の道を下痢糞の道と呼んでいる。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-02-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "海をかき回す、竜母を降す、山を担いで太陽を追うという一連の言葉は、悟空が自分の腕を誇る詩句。「竜母」を既出の特定の竜族女性と結び付けず、すべてがそれまでの旅で実行された出来事とも決めていない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-03-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は発端を「這三年六月間」といい、続けて被害を「這二年」とする。訳文でも三年と二年を統一せず、語られた時間のずれを残した。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-04-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "髪のない和尚はつかまれにくいという皮肉と、最後に頭を殴りつぶされた姿とを続けている。「曬乾疤」は字面に即して日干しの傷跡とした。勝負の途中に別の事件や、原文にない死体の処置を補ってはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-05-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「半分」は、ここでは銀を量る単位の分の半分。約束した礼金を少しも欠かさず支払うという意味で、総額の半額をいうのではない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-06-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「磨刀水」は刃物を研いだ水。「秀氣在內」は優れたところが内にあるという言い回しで、刃を研ぐ鋭さと内に秘めた力をかけている。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-07-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「鹽醬口」は塩や味噌のようにきく口という俗な言い方で、縁起の悪い言葉がそのまま当たってしまう口をいう。老人たちは、妖怪の話をしている最中に風が起きたことを怖がっている。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-08-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "山後槍・纏糸槍・馬家槍という名を並べ、八戒は最後に「軟柄槍」と呼んでいる。流派名の厳密な分類としては扱わず、目に見える槍さばきへの八戒の評として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-09-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この大蟒の詩には、蛇の姿に加えて曲がった爪や肉の角も明記される。現実の蛇の生態に合わせて、それらを削ってはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-10-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「兩條信㮇」。「信㮇」は蛇が出し入れする舌として訳し、二筋という数も残した。二本の槍が何だったかは、ここで悟空が初めて説明している。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-11-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「打草驚蛇」は草を打って蛇を驚かすことから、うかつな働きかけで相手を警戒させることをいう。八戒は自分が転ばされた後、悟空の声を聞いて恥ずかしくなり、草をたたく行為の言い訳に、この言葉を使っている。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-12-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の船名は「贛保船」。本文がたとえの根拠として示すのは、腹を低く地につけ、頭を高く上げた姿である。固有の産地や船の構造は付け足さず、この名を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-13-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八戒は山・木・石・土塊・象・豚・水牛・駱駝という八つの種類を並べる。「賴象」は象を指す呼び方、「科豬」は地方語でいう繁殖用の雌豚と解して、訳文にはそれぞれの語形も残した。三十六の変化すべてを列挙したものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-14-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "白い四蹄の高さを千尺、体の長さを百丈余りとするのは、変化した豚の巨大さを強調する詩句。数値を現実的な体格へ直したり、どちらかを省いたりしていない。"
  "translation_status": "reviewed"
- "id": "xy-ch67-note-15-body"
  "section_id": "chapter-67"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は村と山の間を三十里余り、食事を取りに戻る道も三十里余りとした後、往復の道のりを約百里とする。また「翌日」追いついた場面で、八戒は「二日」道を掘っていたという。距離や日数を計算し直してそろえず、そのまま残した。"
  "translation_status": "reviewed"

  "translation_ja": |-
    悟空は我慢できず、大声を上げた。
    悟空「じいさん、ずいぶん融通が利かないな。こっちは遠くから宿を求めて来たのに、そんな話をあれこれして脅かすのか。たとえ家が狭くて寝る所がなくたって、この木の下でうずくまっていれば一夜は過ごせる。何だって、そんなにくどくど言うんだ。」
    老人は悟空の醜い姿を見ると、口を引き結び、恐ろしさに震えながらも気を張った。アカザの杖で指し、大声で叱りつけた。
    老人「おのれ、骨の浮いた顔、突き出た額、つぶれた鼻、こけた頬、目の周りも毛むくじゃらの、労咳（ろうがい）病みの化け物め。身のほども知らず、とがった口をして、この年寄りに楯突く気か。」
    悟空は愛想笑いをした。
    悟空「ご老人、目があっても見る目がない。この労咳病みの正体をご存じないんだな。人相見の言葉に『姿が奇怪でも、石の中には美しい玉が隠れる』という。言葉や見た目で人を選べば、まったく見当違いになる。醜いことは醜いが、それでも少しは腕があるんだ。」
    老人「どこの生まれだ。姓と名は何という。どんな腕があるのだ。」
    悟空は笑って、自分のことを語った。
  "translation_status": "reviewed"
- "id": "xy-ch67-005"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    祖居東勝大神洲，花果山前自幼修。
    身拜靈臺方寸祖，學成武藝甚全周：
    也能攪海降龍母，善會擔山趕日頭；
    縛怪擒魔稱第一，移星換斗鬼神愁。
    偷天轉地英名大，我是變化無窮美石猴。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 126
    "line_end": 130
  "translation_ja": |-
    悟空「故郷は東勝大神洲（とうしょうだいしんしゅう）、花果山（かかざん）の前で幼いころから修行した。
    霊台方寸（れいだいほうすん）の祖師に弟子入りし、武芸を余さず身につけた。
    海をかき回し、竜母（りゅうぼ）を降すこともでき、山を担いで太陽を追うのもお手のもの。
    怪物を縛り魔物を捕らえては天下一、星や北斗（ほくと）を移せば鬼神さえ愁える。
    天を盗み大地を転じる勇名は高く、変化に限りのない美石猴（びせきこう）とは、この俺さ。」
  "translation_status": "reviewed"

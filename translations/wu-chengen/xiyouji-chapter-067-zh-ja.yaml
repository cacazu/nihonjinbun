  "source_text": "老者聞言，回嗔作喜，躬著身，便教：「請，請入寒舍安置。」遂此四眾牽馬挑擔，一齊進去。只見那荊針棘刺，鋪設兩邊。二層門是磚石壘的牆壁，又是荊棘苫蓋。入裡才是三間瓦房。老者便扯椅安坐待茶，又叫辦飯。少頃，移過桌子，擺著許多麵觔、豆腐、芋苗、蘿白、辣芥、蔓菁、香稻米飯、醋燒葵湯，師徒們盡飽一餐。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"

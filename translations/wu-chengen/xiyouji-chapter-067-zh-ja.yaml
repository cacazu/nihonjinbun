- "id": "xy-ch67-015"
  "section_id": "chapter-67"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭戴金冠，身穿法衣。令牌敲響，符水施為。驅神使將，拘到妖魑。狂風滾滾，黑霧迷迷。即與道士，兩個相持。鬥到天晚，怪返雲霓。乾坤清朗朗，我等眾人齊。出來尋道士，渰死在山溪。撈得上來大家看，卻如一個落湯雞！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    李老人「頭には金の冠、身には法衣。
    令牌（れいはい）を打ち鳴らし、符水（ふすい）の術を施した。
    神々や神将を駆り立て、妖怪を呼び寄せる。
    激しい風が渦巻き、黒い霧が立ちこめた。
    たちまち道士と、二人で相対して争った。
    日暮れまで戦うと、妖怪は雲の中へ帰っていった。
    天地はすっかり晴れ、わしらは皆そろって、
    外へ出て道士を探したが、山の谷川で溺れ死んでいた。
    引き上げて皆で見れば、まるで湯を浴びた鶏、びしょ濡れだった。」
  "translation_status": "reviewed"

  "source_text": "又鬥多時，不覺東方發白。那怪不敢戀戰，回頭就走。行者與八戒一齊趕來，忽聞得污穢之氣逼人，乃是七絕山稀柿衕也。八戒道：「是那家淘毛廁哩？哏！臭氣難聞。」行者侮著鼻子，只叫：「快趕妖精，快趕妖精。」那怪物攛過山去，現了本像，乃是一條紅鱗大蟒。你看他："
  "source_languages":

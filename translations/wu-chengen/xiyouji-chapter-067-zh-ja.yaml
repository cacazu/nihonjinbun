  "source_text": "慌得那八戒戰戰兢兢，伏之於地，把嘴拱開土，埋在地下，卻如釘了釘一般。沙僧蒙著頭臉，眼也難睜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 159
    "line_end": 159
  "translation_ja": "八戒は恐ろしくてがたがた震え、地面に伏すと、鼻先で土を掘り返し、口を地中に埋め込んだ。まるで釘を打ち込んだようだった。沙悟浄は頭と顔を覆い、目も開けられなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch67-022"
  "section_id": "chapter-67"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞風認怪，一霎時，風頭過處，只見那半空中隱隱的兩盞燈來，即低頭叫道：「兄弟們，風過了，起來看。」那獃子扯出嘴來，抖抖灰土，仰著臉，朝天一望，見有兩盞燈光，忽失聲笑道：「好耍子，好耍子，原來是個有行止的妖精，該和他做朋友。」沙僧道：「這般黑夜，又不曾覿面相逢，怎麼就知好歹？」八戒道：「古人云：『夜行以燭，無燭則止。』你看他打一對燈籠引路，必定是個好的。」沙僧道：「你錯看了，那不是一對燈籠，是妖精的兩隻眼亮。」這獃子就諕矮了三寸，道：「爺爺呀！眼有這般大啊，不知口有多少大哩。」行者道：「賢弟莫怕。你兩個護持著師父，待老孫上去討他個口氣，看他是甚妖精。」八戒道：「哥哥，不要供出我們來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    悟空は風の様子から妖怪の気配を読み取った。ほどなく風の先が通り過ぎると、空中にぼんやり二つの灯が近づいてくる。悟空は下を向いて呼びかけた。
    悟空「弟たち、風は通り過ぎた。起きて見ろ。」
    八戒は口を土から引き抜き、ほこりを払い、顔を上げて空を見た。二つの灯が光っているのを見つけると、思わず笑い出した。
    八戒「面白い、面白い。なかなか行儀のよい妖怪じゃないか。こいつとは友達になるべきだな。」
    沙悟浄「こんな暗い夜に、まだ顔を合わせてもいないのに、どうしてよいか悪いか分かるんだ。」
    八戒「昔の人が『夜歩くには明かりを用い、明かりがなければやめよ』と言っているだろう。見ろ、灯籠を二つ掲げて道を照らしている。きっと、よいやつに違いない。」
    沙悟浄「見間違いだよ。あれは灯籠ではない。妖怪の両目が光っているんだ。」
    八戒は恐ろしさに、背丈が三寸も縮んだ。
    八戒「ひゃあ、とんでもないお方だ。目があんなに大きいなら、口はどれほど大きいんだろう。」
    悟空「弟よ、怖がるな。お前たち二人は、お師匠さまをお守りしろ。俺が上へ行って話を聞き、どんな妖怪か探ってくる。」
    八戒「兄貴、俺たちのことは白状しないでくれよ。」
  "translation_status": "reviewed"
- "id": "xy-ch67-023"

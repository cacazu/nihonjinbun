    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    李老人は大喜びし、すぐ家の召使いに、左右の隣人、年下のいとこ、母方のおばの年上の息子、子の婚家の親、友人を呼びに行かせた。老人が八、九人集まって三蔵に会い、妖怪退治の話を聞くと、皆喜んだ。
    老人たち「どのお弟子さまが、退治に行かれるのですか。」
    悟空は両手を胸の前で組んだ。
    悟空「この若輩の僧が参ります。」
    老人たちはぎょっとした。
    老人たち「無理です、無理です。あの妖怪は神通力が大きく、体も巨大です。お坊さまは痩せて小さい。歯の隙間を埋めるにも足りませんぞ。」
    悟空は笑った。
    悟空「ご老人方、人を見抜けていませんね。小さくても、身はしっかりしています。『砥石の水を飲んだから、鋭さは腹の中にある』というやつです。」
    老人たちはそう言われ、仕方なく承知した。
    老人たち「お坊さま、妖怪を捕らえたら、どれほどのお礼をお望みですか。」
    悟空「礼のことなど、何を言う必要があるでしょう。ことわざにも『金といえば目にまぶしく、銀といえば白けるばかり、銭といえば生臭い』という。我々は徳を積む僧です。金は決していただきません。」
    老人たち「そういうことでしたら、皆さま戒を受けた高僧でいらっしゃる。お金はいらぬとしても、ただでご苦労をかけるわけにはいきません。私どもは各家とも、漁と田畑で生計を立てております。本当に妖怪を降し、この土地を清めてくださったら、各家から良田二畝ずつ、合わせて千畝を一か所にまとめて差し上げましょう。師弟の皆さまでそこに寺を建て、座禅をして悟りを求められる。あちこち遍歴するより、ずっとよいでしょう。」
    悟空はまた笑った。
    悟空「ますます具合が悪い。田をもらったとなれば、馬を養って賦役に出し、穀物を納め、飼葉も用意せねばならない。夕暮れにも寝られず、五つ目の夜番を告げる太鼓が鳴る明け方にも眠れない。かえって、忙しくて死んでしまう。」
    老人たち「どれもお望みでなければ、何をもってお礼をすればよいのでしょう。」
    悟空「出家した者には、お茶と一食、それだけで十分なお礼です。」
    老人たちは喜んだ。
    老人たち「それなら簡単です。ただ、どうやって捕まえるのでしょう。」
    悟空「来さえすれば、捕まえますよ。」
    老人たち「あの妖怪は大きいのですぞ。上は天を突き、下は地に届く。来るときは風、去るときは霧。どうやって近づけますか。」
    悟空は笑った。
    悟空「風を呼び霧に乗る程度の妖怪なら、孫のように扱ってやるまでです。体が大きいというなら、それを打ち倒す腕もあります。」
  "translation_status": "reviewed"
- "id": "xy-ch67-019"

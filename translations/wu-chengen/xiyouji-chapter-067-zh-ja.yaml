  "source_text": "好獃子，就跳起雲頭，趕上就築。那怪物又使一條槍抵住。兩條槍就如飛蛇掣電。八戒誇獎道：「這妖精好槍法！不是山後槍，乃是纏絲槍；也不是馬家槍，卻叫做個軟柄槍。」行者道：「獃子莫胡說。那裡有個甚麼軟柄槍？」八戒道：「你看他使出槍尖來架住我們，不見槍柄，不知收在何處。」行者道：「或者是個軟柄槍；但這怪物還不會說話，想是還未歸人道，陰氣還重。只怕天明時陽氣勝，他必要走。但走時，一定趕上，不可放他。」八戒道：「正是，正是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch67-1455616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455616&title=西遊記/第067回&variant=zh-hant"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    八戒も雲の上へ跳び、追いつくなり熊手を打ち込んだ。妖怪はもう一本の槍を使って、これを受け止めた。二本の槍は飛ぶ蛇、走る稲妻のようだ。八戒は感心した。
    八戒「この妖怪、見事な槍使いだ。山後槍（さんこうそう）ではなく、纏糸槍（てんしそう）だな。馬家槍（ばかそう）でもない。軟柄槍（なんぺいそう）というやつだ。」
    悟空「ばか、でたらめを言うな。軟柄槍なんてものがあるか。」
    八戒「見ろよ。槍先を出して俺たちを受け止めているのに、柄が見えない。どこへしまってあるのか分からないじゃないか。」
    悟空「もしかすると、軟柄槍なのかもしれんな。ただ、この妖怪はまだ口がきけない。人の道へ入りきっておらず、陰の気が濃いのだろう。夜が明けて陽の気が盛んになれば、きっと逃げるぞ。逃げたら必ず追いつけ。放してはならん。」
    八戒「そうだ、そうだ。」

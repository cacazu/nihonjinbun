  - "id": "xy-ch43-002"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那菩薩念了幾遍，卻才住口，那妖精就不疼了。又正性起身看處，頸項裡與手足上都是金箍，勒得疼痛，便就除那箍兒時，莫想褪得動分毫。這寶貝已此是見肉生根，越抹越痛。行者笑道：「我那乖乖，菩薩恐你養不大，與你戴個頸圈鐲頭哩。」那童子聞此言，又生煩惱，就此綽起槍來，望行者亂刺。行者急閃身，立在菩薩後面，叫：「念咒，念咒。」那菩薩將楊柳枝兒蘸了一點甘露，灑將去，叫聲：「合！」只見他丟了槍，一雙手合掌當胸，再也不能開放。至今留了一個觀音扭，即此意也。那童子開不得手，拿不得槍，方知是法力深微，沒奈何，才納頭下拜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて、観音菩薩（かんのんぼさつ）が呪文を何度か唱えてから口を閉じると、紅孩児（こうがいじ）の痛みはようやく治まった。気を取り直して立ち上がり、体を見ると、首にも手足にも金の輪がはまり、締めつけられて痛い。外そうとしても、少しも動かせなかった。この宝はすでに肉に根を下ろしていて、こすればこするほど痛むのだ。
      悟空（ごくう）は笑って言った。「おやおや、かわいい坊やだ。菩薩（ぼさつ）さまは、お前が無事に育たないといけないと思って、首輪や腕輪をつけてくださったんだな。」
      童子となった紅孩児はそれを聞くと、また腹を立て、槍をひっつかんで悟空へめったやたらと突きかかった。悟空は急いで身をかわし、観音菩薩の後ろに立った。
      悟空「呪文を！　呪文を唱えてください！」
      観音菩薩は柳の枝に甘露（かんろ）を少しつけ、紅孩児へ振りかけて叫んだ。「合わせよ！」
      すると紅孩児は槍を放し、両手を胸の前で合わせたまま、二度と開けなくなった。今も「観音扭（かんのんじゅう）」というものが伝わっているのは、このことに由来する。紅孩児は手を開けず、槍も持てなくなって、ようやくその法力の奥深さを知った。どうすることもできず、そこで初めて頭を地につけて拝んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch43-003"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "菩薩念動真言，把淨瓶攲倒，將那一海水依然收去，更無半點存留。對行者道：「悟空，這妖精已是降了，卻只是野心不定。等我教他一步一拜，只拜到落伽山，方才收法。你如今快早去洞中，救你師父去來。」行者轉身叩頭道：「有勞菩薩遠涉，弟子當送一程。」菩薩道：「你不消送，恐怕誤了你師父性命。」行者聞言，歡喜叩別。那妖精早歸了正果，五十三參，參拜觀音。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      観音菩薩は真言を唱え、浄瓶（じょうへい）を傾けた。海一つ分の水はすべて元どおりに吸い込まれ、一滴も残らなかった。
      観音菩薩「悟空、この妖怪はもう降参しましたが、まだ荒々しい心が定まっていません。一歩歩くごとに一度拝ませ、落伽山（らっかさん）まで拝みながら来させてから術を解きましょう。お前は今すぐ洞穴へ行って、師を助けてきなさい。」
      悟空は向き直って頭を下げ、言った。「菩薩さまには、遠いところをお越しいただきました。弟子の私も、少しお見送りいたします。」
      観音菩薩「見送りは要りません。遅れれば、師の命にかかわります。」
      悟空は喜び、頭を下げて別れた。妖怪だった紅孩児も、こうして正しい修行の道へ入り、五十三参（ごじゅうさんさん）として観音（かんのん）を拝んで進んだのである。
    "translation_status": "reviewed"
  - "id": "xy-ch43-004"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且不題善菩薩收了童子。卻說那沙僧久坐林間，盼望行者不到，將行李捎在馬上，一隻手執著降妖寶杖，一隻手牽著韁繩，出松林向南觀看，只見行者欣喜而來。沙僧迎著道：「哥哥，你怎麼去請菩薩，此時才來？焦殺我也。」行者道：「你還做夢哩，老孫已請了菩薩，降了妖怪。」行者卻將菩薩的法力，備陳了一遍。沙僧十分歡喜道：「救師父去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      慈悲深い観音菩薩が童子を引き取った話は、ひとまずここまで。
      さて、沙悟浄（さごじょう）は長いこと林に座り、悟空が帰るのを待っていたが、姿が見えない。荷物を馬の背に載せ、片手に降妖宝杖（ごうようほうじょう）、もう一方の手に手綱を持って松林を出て、南の方を眺めた。すると悟空が、うれしそうにやってくる。
      沙悟浄は迎えに出て言った。「兄さん、菩薩さまをお呼びに行って、どうして今までかかったのです。心配でたまりませんでした。」
      悟空「まだ寝ぼけているのか。俺はもう菩薩さまをお連れして、妖怪を降参させたんだぞ。」
      悟空は観音菩薩の法力を、初めから終わりまで詳しく話した。沙悟浄は大いに喜んだ。
      沙悟浄「それでは、お師匠さまを助けに行きましょう！」
    "translation_status": "reviewed"
  - "id": "xy-ch43-005"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個才跳過澗去，撞到門前，拴下馬匹。舉兵器齊打入洞裡，剿淨了群妖，解下皮袋，放出八戒來。那獃子謝了行者道：「哥哥，那妖精在那裡？等我去築他幾鈀，出出氣來。」行者道：「且尋師父去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      二人は谷川を飛び越えて門前へ駆けつけ、馬をつないだ。武器を振り上げ、ともに洞穴へ攻め込み、群がる妖怪を残らず討ち取った。それから皮袋を下ろし、八戒（はっかい）を外へ出してやった。
      八戒は悟空に礼を述べて言った。「兄貴、あの妖怪はどこだ。俺が熊手を何発か食らわせて、腹の虫を治めてやる。」
      悟空「まずお師匠さまを捜そう。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-006"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人徑至後邊，只見師父赤條條，綑在院中哭哩。沙僧連忙解繩，行者即取衣服穿上。三人跪在面前道：「師父吃苦了。」三藏謝道：「賢徒啊，多累你等。怎生降得妖魔也？」行者又將請菩薩，收童子之言，備陳一遍。三藏聽得，即忙跪下，朝南禮拜。行者道：「不消謝他，轉是我們與他作福，收了一個童子。」如今說童子拜觀音，五十三參，參參見佛，即此是也。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      三人がまっすぐ奥へ進むと、三蔵（さんぞう）は裸のまま中庭に縛られ、泣いていた。沙悟浄が急いで縄を解き、悟空は衣服を取ってきて着せた。三人は三蔵の前にひざまずいた。
      弟子たち三人「お師匠さま、おつらい目に遭われました。」
      三蔵は礼を述べた。「よくやってくれた。お前たちには、ずいぶん苦労をかけたな。どうやって妖魔を降参させたのだ？」
      悟空は、観音菩薩を招き、童子として引き取ってもらったいきさつを、また詳しく話した。三蔵はそれを聞くと、急いでひざまずき、南へ向かって礼拝した。
      悟空「お礼は要りませんよ。むしろ私たちがあの方に善いことをして、童子を一人お世話したのですから。」
      今日いう、童子が観音を拝む「五十三参」、参じるたびに仏を見るというのは、まさにこのことである。
    "translation_status": "reviewed"
  - "id": "xy-ch43-007"

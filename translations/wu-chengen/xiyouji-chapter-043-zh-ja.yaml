        "line_start": 127
        "line_end": 127
    "translation_ja": "沙悟浄に洞穴の宝物を集めさせ、まず米や食糧を探して精進の食事を調え、三蔵に振る舞った。三蔵が命を取り留めたのは、ひとえに悟空のおかげ。真の経典を手に入れるにも、頼みはこの美しい猿の精なのであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-008"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們出洞來，攀鞍上馬，找大路，篤志投西。行經一個多月，忽聽得水聲振耳。三藏大驚道：「徒弟呀，又是那裡水聲？」行者笑道：「你這老師父忒也多疑，做不得和尚。我們一同四眾，偏你聽見甚麼水聲。你把那《多心經》又忘了也？」唐僧道：「《多心經》乃浮屠山烏巢禪師口授，共五十四句，二百七十個字。我當時耳傳，至今常念，你知我忘了那句兒？」行者道：「老師父，你忘了『無眼耳鼻舌身意』。我等出家之人，眼不視色，耳不聽聲，鼻不嗅香，舌不嘗味，身不知寒暑，意不存妄想：如此謂之祛褪六賊。你如今為求經，念念在意；怕妖魔，不肯捨身；要齋吃，動舌；喜香甜，觸鼻；聞聲音，驚耳；睹事物，凝眸；招來這六賊紛紛，怎生得西天見佛？」三藏聞言，默然沉慮道：「徒弟啊，我"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      師弟は洞穴を出た。三蔵は鞍に手をかけて馬に乗り、一行は大道へ出て、一心に西を目指した。ひと月余り進んだところで、突然、耳を震わせる水音が聞こえた。
      三蔵は驚いて言った。「弟子たちよ、今度はどこから水音がするのだ？」
      悟空は笑って言った。「お師匠さまは、どうも疑い深すぎます。それでは和尚は務まりませんよ。私たち四人が一緒にいるのに、お師匠さまだけが、何の水音を聞きつけたのです。多心経（たしんきょう）を、またお忘れになりましたね？」
      三蔵「多心経は、浮屠山（ふとざん）の烏巣禅師（うそうぜんじ）から直接授かったものだ。全部で五十四句、二百七十文字。あのとき耳で覚えてから、今もいつも唱えている。どの句を忘れたというのだ？」
      悟空「お師匠さまは、『無眼耳鼻舌身意（むげんにびぜっしんに）』をお忘れです。私たち出家した者は、目で色や形にとらわれず、耳で音にとらわれず、鼻で香りを求めず、舌で味を求めず、身に寒暑を意識せず、心に妄想を抱かない。そうして六賊（ろくぞく）を追い払うのです。ところがお師匠さまは、経を求めることをいつも心にかけ、妖魔を恐れて身を捨てようとせず、食事を欲しがって舌を動かし、甘い香りに喜んで鼻を働かせ、物音を聞いて耳を驚かせ、物を見るたび目を凝らす。こうして六賊をぞろぞろ招き寄せて、どうして西天（さいてん）へ行き、仏にお会いできましょう？」
      三蔵は黙って深く考え、それから言った。「弟子よ、私はな、
    "translation_status": "reviewed"
  - "id": "xy-ch43-009"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一自當年別聖君，奔波晝夜甚慇懃。
      芒鞋踏破山頭霧，竹笠沖開嶺上雲。
      夜靜猿啼殊可嘆，月明鳥噪不堪聞。
      何時滿足三三行，得取如來妙法文？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 130
        "line_end": 133
    "translation_ja": |-
      あの年、尊い君のおそばを離れてから、昼も夜もひたすら旅を続けてきた。
      わらじで山の霧を踏み破り、竹の笠で峰の雲をかき分ける。
      夜が静まれば猿の声に嘆き、月が明るければ鳥の声が聞くに堪えない。
      いつになれば三三の行（さんさんのぎょう）を満たし、如来（にょらい）のすばらしい教えの経を得られるのだろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-010"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽畢，忍不住鼓掌大笑道：「這師父原來只是思鄉難息。若要那三三行滿，有何難哉？常言道：『功到自然成』哩。」八戒回頭道：「哥啊，若照依這般魔障凶高，就走上一千年也不得成功。」沙僧道：「二哥，你和我一般，拙口鈍腮，不要惹大哥熱擦。且只捱肩磨擔，終須有日成功也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      悟空は聞き終えると、こらえきれず手をたたいて大笑いした。
      悟空「お師匠さまは、結局、故郷を思う気持ちを抑えられないのですね。三三の行を満たしたいなら、何が難しいものですか。昔から『功を積めば、おのずと成る』と申しますよ。」
      八戒が振り返って言った。「兄貴、こんなに恐ろしい魔物の邪魔が続くんじゃ、千年歩いたって成し遂げられないよ。」
      沙悟浄「二番目の兄さん、あなたも私と同じで、口はうまくありません。上の兄さんを怒らせるのはやめましょう。ただ肩をすり減らしてでも荷を担ぎ続ければ、いつかは必ず成し遂げられます。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-011"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們正話間，腳走不停，馬蹄正疾，見前面有一道黑水滔天，馬不能進。四眾停立岸邊，仔細觀看，但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 136
        "line_end": 136
    "translation_ja": "師弟は話している間も足を止めず、馬もせかせかと歩いていたが、前方に黒い水が天まで届くほど荒れ狂い、馬はもう進めなかった。四人が岸辺に立ち止まり、よくよく眺めると、こんな有様であった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-012"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": "層層濃浪，疊疊渾波，層層濃浪翻烏潦，疊疊渾波捲黑油。近觀不照人身影，遠望難尋樹木形。滾滾一地墨，滔滔千里灰。水沫浮來如積炭，浪花飄起似翻煤。牛羊不飲，鴉鵲難飛。牛羊不飲嫌深黑，鴉鵲難飛怕渺瀰。只是岸上蘆蘋知節令，灘頭花草鬥青奇。湖泊江河天下有，溪源澤洞世間多。人生皆有相逢處，誰見西方黑水河？"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      幾重もの濃い波、折り重なる濁ったうねり。
      濃い波は黒い水たまりをひっくり返すよう、濁ったうねりは黒い油を巻き上げるよう。
      近くをのぞいても人影は映らず、遠くを見ても木々の姿は見つからない。
      一面に墨がごうごうと流れ、千里にわたって灰が滔々と押し寄せる。
      水面に浮く泡は積み上げた炭のよう、舞い上がる波しぶきは返した石炭のよう。
      牛も羊も飲まず、烏も鵲も飛び渡れない。
      牛や羊は深い黒さを嫌って飲まず、烏や鵲は果ての見えない広がりを恐れて飛ばない。
      ただ岸辺の葦と浮草は季節を知り、浅瀬の花や草が鮮やかな緑を競っている。
      湖や川は天下の至るところにあり、谷川の源や沢や洞も世には多い。
      人は生きていれば、さまざまな場所に行き合わせるものだが、西方の黒水河（こくすいが）を見た者がいるだろうか。
    "translation_status": "reviewed"
  - "id": "xy-ch43-013"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧下馬道：「徒弟，這水怎麼如此渾黑？」八戒道：「是那家潑了靛缸了。」沙僧道：「不然，是誰家洗筆硯哩。」行者道：「你們且休胡猜亂道，且設法保師父過去。」八戒道：「這河若是老豬過去不難：或是駕了雲頭，或是下河負水，不消頓飯時，我就過去了。」沙僧道：「若教我老沙，也只消縱雲屣水，頃刻而過。」行者道：「我等容易，只是師父難哩。」三藏道：「徒弟啊，這河有多少寬麼？」八戒道：「約摸有十來里寬。」三藏道：「你三個計較，著那個馱我過去罷。」行者道：「八戒馱得。」八戒道：「不好馱：若是馱著騰雲，三尺也不能離地。常言道：『背凡人重若丘山。』若是馱著負水，轉連我墜下水去了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      三蔵は馬から下りて言った。「弟子たちよ、この水は、なぜこれほど黒く濁っているのだ？」
      八戒「どこかの家で、藍の染料を入れた甕をひっくり返したんでしょう。」
      沙悟浄「いや、誰かが筆や硯を洗ったのでしょう。」
      悟空「でたらめな当て推量はよせ。それより、お師匠さまを無事に向こうへ渡す方法を考えろ。」
      八戒「俺がこの川を渡るだけなら、難しくない。雲に乗ってもいいし、川へ入って泳いでもいい。一食分の時間もかからず、向こうへ着くよ。」
      沙悟浄「私も、雲に乗るか水を渡るかすれば、たちまち向こうへ行けます。」
      悟空「俺たちは簡単だ。難しいのは、お師匠さまだよ。」
      三蔵「弟子たちよ、この川の幅はどれほどある？」
      八戒「およそ十里あまりでしょう。」
      三蔵「三人で相談して、誰か私を背負って渡ってくれないか。」
      悟空「八戒なら背負えます。」
      八戒「うまくいかないよ。背負って雲に乗ろうとしても、地面から三尺だって上がれない。『生身の人間を背負えば、丘や山ほど重い』と言うだろう。背負って泳ごうものなら、かえって俺まで水に沈んじまう。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-014"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們在河邊正都商議，只見那上溜頭有一人棹下一隻小船兒來。唐僧喜道：「徒弟，有船來了，叫他渡我們過去。」沙僧厲聲高叫道：「棹船的，來渡人，來渡人。」船上人道：「我不是渡船，如何渡人？」沙僧道：「天上人間，方便第一。你雖不是渡船，我們也不是常來打攪你的。我等是東土欽差取經的佛子，你可方便方便，渡我們過去，謝你。」那人聞言，卻把船兒棹近岸邊，扶著槳道：「師父啊，我這船小，你們人多，怎能全渡？」三藏近前看了，那船兒原來是一段木頭刻的，中間只有一個艙口，只好坐下兩個人。三藏道：「怎生是好？」沙僧道：「這般啊，兩遭兒渡罷。」八戒就使心術，要躲懶討乖，道：「悟淨，你與大哥在這邊看著行李、馬匹，等我保師父先過去，卻再來渡馬。教大哥跳過去罷。」行者點頭道：「你說的是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      師弟が岸辺で相談していると、上流から、一人の男が小舟をこいで下ってきた。
      三蔵は喜んで言った。「弟子たちよ、舟が来た。あの人を呼んで、渡してもらおう。」
      沙悟浄が声を張り上げた。「舟の方、こちらを渡してください！　渡してください！」
      船頭「これは渡し舟じゃありません。どうして人を渡せましょう？」
      沙悟浄「天でも人の世でも、人の役に立つのが何よりです。渡し舟でなくても、私たちはいつも来てご迷惑をかけるわけではありません。東土（とうど）の皇帝の命を受け、経を求めに行く仏の弟子です。どうかお力を貸して、向こう岸へ渡してください。お願いいたします。」
      船頭はそれを聞くと舟を岸へ寄せ、櫂に手を添えて言った。「和尚さま、私の舟は小さいし、皆さんは大勢です。どうやって全員を渡せましょう？」
      三蔵が近寄って見ると、舟は一本の木をくり抜いたもので、中には乗るためのくぼみが一つあるだけ、二人がやっと座れる大きさだった。
      三蔵「どうすればよいだろう。」
      沙悟浄「それなら、二度に分けて渡してもらいましょう。」
      八戒はここで、うまく立ち回って楽をしようと考え、言った。「悟浄（ごじょう）、お前は兄貴とこっちに残って、荷物と馬を見ていてくれ。俺がお師匠さまを守って先に渡るから、そのあと舟に戻ってもらって馬を渡そう。兄貴には飛び越えてもらえばいい。」
      悟空はうなずいて言った。「そのとおりだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-015"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子扶著唐僧，那梢公撐開船，舉棹沖流，一直而去。方才行到中間，只聽得一聲響喨，捲浪翻波，遮天迷日。那陣狂風十分利害！好風："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 142
        "line_end": 142
    "translation_ja": "八戒は三蔵を支えて乗り込み、船頭は舟を岸から離し、櫂を動かして流れを切り、まっすぐ進んだ。ようやく川の真ん中へ来たとき、突然、大きな音が一つ鳴り響き、波が巻き返り、天を覆って日を隠した。その暴風のすさまじいこと！　まことに、こんな風だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-016"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      當空一片炮雲起，中溜千層黑浪高。
      兩岸飛沙迷日色，四邊樹倒振天號。
      翻江攪海龍神怕，播土揚塵花木凋。
      呼呼響若春雷吼，陣陣兇如餓虎哮。
      蟹鱉魚蝦朝上拜，飛禽走獸失窩巢。
      五湖船戶皆遭難，四海人家命不牢。
      溪內漁翁難把鉤，河間梢子怎撐篙？
      揭瓦翻磚房屋倒，驚天動地泰山搖。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 143
        "line_end": 150
    "translation_ja": |-
      空には一面、はじけるような雲が湧き、流れの真ん中には黒い波が千重にも高く立つ。
      両岸の砂が飛んで日の光をかすませ、四方の木々が倒れ、天を震わせて叫ぶ。
      川をひっくり返し海をかき回して竜神をおびえさせ、土と塵をまき上げて花木をしおれさせる。
      ごうごうという音は春雷のとどろきのよう、一陣ごとの猛威は飢えた虎のほえるよう。
      蟹もすっぽんも魚も蝦も上を向いて拝み、鳥も獣もねぐらや巣を失う。
      五湖（ごこ）の船乗りはみな災難に遭い、四海（しかい）の家々も命が危ない。
      谷川の漁師は釣り針を握れず、川の船頭がどうして竿を操れよう。
      瓦をはがし煉瓦をひっくり返して家を倒し、天を驚かせ地を揺るがして泰山（たいざん）まで震わせる。
    "translation_status": "reviewed"
  - "id": "xy-ch43-017"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這陣風，原來就是那棹船人弄的。他本是黑水河中怪物。眼看著那唐僧與豬八戒，連船兒淬在水裡，無影無形，不知攝了那方去也。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 152
        "line_end": 152
    "translation_ja": "この風を起こしたのは、ほかでもない、あの船頭だった。正体は黒水河の妖怪なのである。見る間に三蔵も八戒も、舟ごと水の中へ沈んでしまい、影も形もなくなった。いったいどこへさらっていったのか、分からない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-018"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這岸上沙僧與行者心慌道：「怎麼好？老師父步步逢災，才脫了魔障，幸得這一路平安，又遇著黑水迍邅。」沙僧道：「莫是翻了船？我們往下溜頭找尋去。」行者道：「不是翻船，若翻船，八戒會水，他必然保師父，負水而出。我才見那個棹船的有些不正氣，想必就是這廝弄風，把師父拖下水去了。」沙僧聞言道：「哥哥何不早說？你看著馬與行李，等我下水找尋去來。」行者道：「這水色不正，恐你不能去。」沙僧道：「這水比我那流沙河如何？去得，去得。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      岸に残った沙悟浄と悟空は、うろたえた。
      沙悟浄と悟空「どうしよう。お師匠さまは、一歩ごとに災難だ。やっと魔物の難を逃れ、この道中は無事でよかったと思ったら、また黒い川で災難に遭うとは。」
      沙悟浄「舟がひっくり返ったのでは？　下流へ捜しに行きましょう。」
      悟空「転覆じゃない。もし舟がひっくり返ったなら、八戒は泳げるんだから、お師匠さまを守って泳ぎ出てくるはずだ。さっき見た船頭には、どこかまともでない気配があった。きっとあいつが風を起こし、お師匠さまを水の中へ引きずり込んだんだ。」
      沙悟浄「兄さん、なぜ早く言ってくれなかったのです。馬と荷物を見ていてください。私が水に入って捜してきます。」
      悟空「この水は色がおかしい。お前でも行けないかもしれんぞ。」
      沙悟浄「この水が、私のいた流沙河（りゅうさが）と比べてどうだというのです。行けます、行けますとも。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-019"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好和尚，脫了褊衫，紮抹了手腳，掄著降妖寶杖，撲的一聲，分開水路，鑽入波中，大搭步行將進去。正走處，只聽得有人言語。沙僧閃在傍邊，偷睛觀看，那壁廂有一座亭臺，臺門外橫封了八個大字，乃是「衡陽峪黑水河神府」。又聽得那怪物坐在上面道：「一向辛苦，今日方能得物。這和尚乃十世修行的好人，但得吃他一塊肉，便做長生不老人。我為他也等夠多時，今朝卻不負我志。」教：「小的們，快把鐵籠擡出來，將這兩個和尚囫圇蒸熟，具柬去請二舅爺來，與他暖壽。」沙僧聞言，按不住心頭火起，掣寶杖，將門亂打。口中罵道：「那潑物，快送我唐僧師父與八戒師兄出來！」諕得那門內妖邪急跑去報：「禍事了。」老怪問：「甚麼禍事？」小妖道：「外面有一個晦氣色臉的和尚，打著前門罵，要人哩！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      さすがは沙悟浄、偏衫（へんさん）を脱ぎ、手足の身ごしらえをしっかり整え、降妖宝杖を振りかざした。ざぶんと水を分け、波の中へ潜り、大股で奥へ進んでいく。歩いていると、人の話し声が聞こえた。沙悟浄は脇へ身を隠し、そっとのぞいた。向こうには高殿があり、門の上には横に八つの大きな文字で「衡陽峪黒水河神府（こうようよくこくすいがしんぷ）」と掲げてある。妖怪はその上座に座り、こう話していた。
      妖怪「これまでずいぶん苦労したが、今日こそ獲物を手に入れた。この和尚は、十世にわたって修行した善人だ。肉を一切れでも食えば、不老長生の身になれる。こいつのためにずいぶん長く待ったが、今日はとうとう望みがかなったぞ。」
      妖怪は命じた。「お前たち、早く鉄の蒸籠を持ってこい。この和尚どもを二人とも丸ごと蒸し上げろ。招待状を書いて二番目のおじ上をお招きし、誕生日前祝いの宴を開くのだ。」
      これを聞いた沙悟浄は、腹の底から湧く怒りを抑えられなかった。宝杖を抜き、門をめった打ちにして怒鳴った。
      沙悟浄「このろくでなし！　早く俺の師、唐僧（とうそう）さまと、兄弟子の八戒を返せ！」
      門の内側の妖怪たちは驚き、小妖が急いで報告に走った。
      小妖「大変です！」
      妖怪「何が大変なのだ？」
      小妖「外に、薄暗い顔色の和尚が一人来て、正門をたたきながら、罵って人を返せと叫んでおります！」
    "translation_status": "reviewed"
  - "id": "xy-ch43-020"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪聞言，即喚取披掛。小妖擡出披掛。老妖結束整齊，手提一根竹節鋼鞭，走出門來，真個是兇頑毒像。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 157
        "line_end": 157
    "translation_ja": "妖怪は聞くなり、鎧兜を持ってこいと命じた。小妖が運んでくると、妖怪は身支度を整え、一本の竹節鋼鞭（ちくせつこうべん）を手にして門から出た。実に凶暴で、悪意のあふれる姿である。見ると、こんな有様だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-021"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      方面圜睛霞彩亮，捲唇巨口血盆紅。
      幾根鐵線稀髯擺，兩鬢朱砂亂髮蓬。
      形似顯靈真太歲，貌如發怒狠雷公。
      身披鐵甲團花燦，頭戴金盔嵌寶濃。
      竹節鋼鞭提手內，行時滾滾拽狂風。
      生來本是波中物，脫去原流變化兇。
      要問妖邪真姓字，前身喚做小鼉龍。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 158
        "line_end": 164
    "translation_ja": |-
      四角い顔に丸い目が霞のように光り、めくれた唇と巨大な口は、血を盛った鉢のように赤い。
      鉄線のようなまばらなひげが数本揺れ、両鬢には朱砂（しゅしゃ）色の乱れ髪がぼうぼうと広がる。
      姿は霊威を現した太歳神（たいさいしん）そのもの、顔は怒り狂う猛々しい雷公（らいこう）のよう。
      身には丸い花模様の輝く鉄の鎧、頭には宝石をびっしりはめた金の兜。
      竹節鋼鞭を手に提げ、歩けば激しい風が渦巻いてついてくる。
      もとは生まれながらの水の生き物、元の姿を脱して、凶悪な姿へ変化した。
      この妖怪の本当の名を尋ねるなら、元の身は小鼉竜（しょうだりゅう）と呼ばれるもの。
    "translation_status": "reviewed"
  - "id": "xy-ch43-022"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪喝道：「是甚人在此打我門哩？」沙僧道：「我把你個無知的潑怪！你怎麼弄玄虛，變作梢公，架船將我師父攝來？快早送還，饒你性命。」那怪呵呵笑道：「這和尚不知死活。你師父是我拿了，如今要蒸熟了請人哩。你上來，與我見個雌雄。三合敵得我啊，還你師父；如三合敵不得，連你一發都蒸吃了，休想西天去也。」沙僧聞言大怒，掄寶杖，劈頭就打；那怪舉鋼鞭，急架相迎。兩個在水底下，這場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      鼉竜（だりゅう）は一喝した。「俺の門をたたいているのは誰だ！」
      沙悟浄「この無知な妖怪め！　どうしていかさまを働き、船頭に化け、舟で師をさらってきた？　早く返せ。そうすれば命は助けてやる。」
      鼉竜は、からからと笑って言った。「この和尚は、命が惜しくないと見える。お前の師は俺が捕まえた。今から蒸し上げて、客を招くところだ。さあ来い、俺と勝負をつけよう。三合戦って俺に持ちこたえられたら、師を返してやる。三合も持ちこたえられなければ、お前もまとめて蒸して食うぞ。西天へ行けると思うなよ。」
      沙悟浄は激怒し、宝杖を振り上げて頭めがけて打ち下ろした。鼉竜は鋼鞭（こうべん）を上げ、すばやく受け止める。水の底で、二人はこんな見事な戦いを繰り広げた。
    "translation_status": "reviewed"
  - "id": "xy-ch43-023"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": "降妖杖與竹節鞭，二人怒發各爭先。一個是黑水河中千載怪，一個是靈霄殿外舊時仙。那個因貪三藏肉中吃，這個為保唐僧命可憐。都來水底相爭鬥，各要功成兩不然。殺得蝦魚對對搖頭躲，蟹鱉雙雙縮首潛。只聽水府群妖齊擂鼓，門前眾怪亂爭喧。好個沙門真悟淨，單身獨力展威權。躍浪翻波無勝敗，鞭迎杖架兩牽連。算來只為唐和尚，欲取真經拜佛天。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      降妖の杖（ごうようのつえ）と竹節の鞭、二人は怒りに燃え、我先にと打ちかかる。
      一方は黒水河に住む千年の妖怪、一方は昔、霊霄殿（れいしょうでん）の外にいた仙人。
      あちらは三蔵の肉をむさぼり食おうとし、こちらは唐僧の命をいとおしんで守ろうとする。
      ともに水底で争い、互いに功を立てようとして、どちらも譲らない。
      魚も蝦も頭を振って逃げ隠れ、蟹もすっぽんも首を引っ込めて潜る。
      水の館では妖怪たちが一斉に太鼓をたたき、門前では大勢の怪物が先を争ってわめく。
      さすが仏門の真の悟浄、たった一人の力で、その威勢を示している。
      波を跳び越え水をかき回しても勝負はつかず、鞭は杖を迎え、杖は鞭を受けて、互いに離れない。
      もとをたどれば、すべては唐（とう）の和尚が、真の経を求め、仏の世界へ参ろうとするためなのだ。
    "translation_status": "reviewed"
  - "id": "xy-ch43-024"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他二人戰經三十回合，不見高低。沙僧暗想道：「這怪物是我的對手，枉自不能取勝，且引他出去，教師兄打他。」這沙僧虛丟了個架子，拖著寶杖就走。那妖精更不趕來，道：「你去罷，我不與你鬥了，我且具柬帖兒去請客哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      二人は三十合戦ったが、優劣はつかなかった。沙悟浄は心の中で考えた。沙悟浄の心の声「この妖怪は、私と互角だ。このままでは、いくら戦っても勝てない。ひとまず外へ誘い出して、兄さんに打ってもらおう。」
      沙悟浄はわざと構えを崩し、宝杖を引きずって逃げた。ところが鼉竜は、少しも追ってこない。
      鼉竜「行ってしまえ。もうお前とは戦わん。俺は招待状を書いて、客を招くのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-025"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧氣呼呼跳出水來，見了行者道：「哥哥，這怪物無禮。」行者問道：「你下去許多時才出來，端的是甚妖邪？可曾尋見師父？」沙僧道：「他這裡邊有一座亭臺，臺門外橫書八個大字，喚做『衡陽峪黑水河神府』。我閃在傍邊，聽他在裡面說話，教小的們刷洗鐵籠，待要把師父與八戒蒸熟了，去請他舅爺來暖壽。是我發起怒來，就去打門。那怪物提一條竹節鋼鞭走出來，與我鬥了這半日，約有三十合，不分勝負。我卻使個佯輸法，要引他出來，著你助陣。那怪物乖得緊，他不來趕我，只要回去具柬請客。我才上來了。」行者道：「不知是個甚麼妖邪？」沙僧道：「那模樣象像個大鱉；不然，便是個鼉龍也。」行者道：「不知那個是他舅爺？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      沙悟浄は息を荒らげて水から飛び出し、悟空を見ると言った。「兄さん、あの妖怪はなんという無礼者でしょう。」
      悟空「ずいぶん長く潜っていたな。いったいどんな妖怪だった？　お師匠さまは見つかったか？」
      沙悟浄「水の中には高殿があって、門の上に横書きで八つの大文字、『衡陽峪黒水河神府』と書いてありました。私が脇に隠れていると、妖怪が中で話していたのです。手下に鉄の蒸籠を洗わせ、お師匠さまと八戒を蒸し上げて、おじを招き、誕生日前祝いの宴を開くと言っていました。腹が立ったので門をたたくと、妖怪は一本の竹節鋼鞭を手に出てきて、私とずいぶん戦いました。三十合ほど打ち合いましたが、勝敗はつきません。そこで負けたふりをして外へ誘い出し、兄さんに助太刀してもらおうとしたのですが、あいつはなかなか抜け目がない。追ってこず、招待状を書いて客を招くといって引き返したので、私だけ上がってきたのです。」
      悟空「いったい、何の妖怪なんだろうな？」
      沙悟浄「姿は大きなすっぽんに似ていました。そうでなければ、鼉竜でしょう。」
      悟空「おじというのは、誰なんだろう？」
    "translation_status": "reviewed"
  - "id": "xy-ch43-026"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，只見那下灣裡走出一個老人，遠遠的跪下，叫：「大聖，黑水河河神叩頭。」行者道：「你莫是那棹船的妖邪，又來騙我麼？」那老人磕頭滴淚道：「大聖，我不是妖邪，我是這河內真神。那妖精舊年五月間，從西洋海趁大潮來於此處，就與小神交鬥。奈我年邁身衰，敵他不過，把我坐的那衡陽峪黑水河神府就占奪去住了，又傷了我許多水族。我卻沒奈何，徑往海內告他。原來西海龍王是他的母舅，不准我的狀子，教我讓與他住。我欲啟奏上天，奈何神微職小，不能得見玉帝。今聞得大聖到此，特來參拜投生。萬望大聖與我出力報冤。」行者聞言道：「這等說，西海龍王都該有罪。他如今攝了我師父與師弟，揚言要蒸熟了，去請他舅爺暖壽。我正要拿他，幸得你來報信。這等，河神你陪著沙僧在此看守，等我去海中，先把那龍王捉來，教他擒此怪物。」河神道：「深感大聖大恩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      まだ話し終えないうちに、下流の曲がり角から一人の老人が現れ、遠くでひざまずいて呼びかけた。
      老人「大聖（たいせい）さま、黒水河の河神が、ご挨拶申し上げます。」
      悟空「お前、あの船頭の妖怪じゃないだろうな。また俺をだましに来たのか？」
      河神は額を地につけ、涙をこぼして言った。「大聖さま、私は妖怪ではございません。この川の本当の神です。あの妖怪は去年の五月、西洋海（せいようかい）から大潮に乗ってここへやって来て、私に戦いを挑みました。私は年老いて弱り、敵いませんでした。私の住んでいた衡陽峪黒水河神府を奪って住みつき、私の水の一族も大勢傷つけたのです。どうにもならず、海へ訴えに行ったのですが、西海（さいかい）の竜王は、実はあいつの母方のおじでした。私の訴えを受け付けず、住まいを譲ってやれとおっしゃったのです。天に上奏したくとも、私のような力の弱い、低い役目の神には、玉帝（ぎょくてい）にお目にかかれません。今日、大聖さまがいらしたと聞き、わざわざご挨拶に参り、おすがりいたしました。どうかお力を貸し、この恨みを晴らしてください。」
      悟空「そういうことなら、西海の竜王にも罪があるな。あいつは今、俺の師と弟弟子をさらい、蒸し上げておじの誕生日前祝いをする、と言いふらしている。俺も捕まえようとしていたところだ。知らせに来てくれて、ちょうどよかった。では河神、お前は沙悟浄とここを見張っていてくれ。俺が海へ行って、まず竜王を引っ立ててきて、この妖怪を捕らえさせよう。」
      河神「大聖さまの大きなご恩に、深く感謝いたします。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-027"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者即駕雲，徑至西洋大海。按觔斗，捻了避水訣，分開波浪。正然走處，撞見一個黑魚精捧著一個渾金的請書匣兒，從下流頭似箭如梭鑽將上來。被行者撲個滿面，掣鐵棒分頂一下，可憐就打得腦漿迸出，腮骨查開，嗗都的一聲，飄出水面。他卻揭開匣兒看處，裡邊有一張簡帖，上寫著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 174
        "line_end": 174
    "translation_ja": "悟空はただちに雲に乗り、まっすぐ西洋大海（せいようたいかい）へ向かった。筋斗雲（きんとうん）から降り、水を避ける呪文を唱えて、波を分けた。進んでいると、黒魚（こくぎょ）の精が、金一色の招待状入れを抱え、下流から矢のように、機織りの杼のように素早く泳ぎ上がってくるのに出くわした。悟空は真正面からぶつかり、鉄棒を抜いて頭の真上から一撃した。哀れにも脳みそが飛び散り、頬の骨が砕け、どぶんと水面へ浮かび上がった。悟空が箱のふたを開けて見ると、中に一枚の招待状があり、こう書いてあった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-028"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "愚甥鼉潔，頓首百拜，啟上二舅爺敖老大人臺下：向承佳惠，感感。今因獲得二物，乃東土僧人，實為世間之罕物，甥不敢自用。因念舅爺聖誕在邇，特設菲筵，預祝千壽。萬望車駕速臨，是荷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 175
        "line_end": 175
    "translation_ja": "愚かな甥の鼉潔（だけつ）、幾重にも頭を下げ、二番目のおじ上、敖（ごう）大人の御前に謹んで申し上げます。かねて賜りましたご厚情には、重ね重ね感謝いたしております。さてこのたび、東土の僧という、世にもまれな獲物を二つ手に入れました。甥の私だけでいただくわけにはまいりません。おじ上のお誕生日も近いこととて、ささやかな宴を設け、あらかじめ千年のご長寿をお祝い申し上げたく存じます。どうか速やかにお越しくださいますよう、お願い申し上げます。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-029"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者笑道：「這廝都把供狀先遞與老孫也。」這才袖了帖子，往前再行。早有一個探海的夜叉望見行者，急抽身撞上水晶宮：「報大王：齊天大聖孫爺爺來了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 177
        "line_end": 177
    "translation_ja": |-
      悟空は笑って言った。「こいつ、自分から俺へ罪の証拠まで差し出してくれたぞ。」
      招待状を袖に入れ、さらに進んでいくと、海を見張っていた夜叉（やしゃ）が早くも悟空を見つけ、急いで身を返し、水晶宮（すいしょうきゅう）へ駆け込んだ。
      夜叉「大王にご報告！　斉天大聖（せいてんたいせい）、孫（そん）さまがお越しです！」
    "translation_status": "reviewed"
  - "id": "xy-ch43-030"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那龍王敖順，即領眾水族，出宮迎接道：「大聖，請入小宮少座，獻茶。」行者道：「我還不曾吃你的茶，你倒先吃了我的酒也！」龍王笑道：「大聖一向皈依佛門，不動葷酒，卻幾時請我吃酒來？」行者道：「你便不曾去吃酒，只是惹下一個吃酒的罪名了。」敖順大驚道：「小龍為何有罪？」行者袖中取出簡帖兒，遞與龍王。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      西海の竜王の敖順（ごうじゅん）は、ただちに水の一族を率いて宮殿から迎えに出た。
      西海の竜王「大聖さま、どうぞ私の宮へお入りになり、少しお掛けください。お茶を差し上げましょう。」
      悟空「俺はまだお前の茶を飲んでいないのに、お前の方が先に俺の酒を飲んだんだな！」
      西海の竜王は笑って言った。「大聖さまは仏門に帰依してから、肉も酒もお召しになりません。それなのに、いつ私を酒宴へお招きになりましたか？」
      悟空「まだ酒を飲みに行っていなくても、酒を飲む罪の名は、もう背負い込んでいるんだよ。」
      西海の竜王は仰天して言った。「私に、どういう罪があるのでしょう？」
      悟空は袖から招待状を取り出し、竜王へ差し出した。
    "translation_status": "reviewed"
  - "id": "xy-ch43-031"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "龍王見了，魂飛魄散，慌忙跪下，叩頭道：「大聖恕罪。那廝是舍妹第九個兒子。因妹夫錯行了風雨，刻減了雨數，被天曹降旨，著人曹官魏徵丞相夢裡斬了。舍妹無處安身，是小龍帶他到此，恩養成人。前年不幸舍妹疾故，惟他無方居住，我著他在黑水河養性修真，不期他作此惡孽。小龍即差人去擒他來也。」行者道：「你令妹共有幾個賢郎？都在那裡作怪？」龍王道：「舍妹有九個兒子。那八個都是好的：第一個小黃龍，見居淮瀆；第二個小驪龍，見住濟瀆；第三個青背龍，占了江瀆；第四個赤髯龍，鎮守河瀆；第五個徒勞龍，與佛祖司鐘；第六個穩獸龍，與神宮鎮脊；第七個敬仲龍，與玉帝守擎天華表；第八個蜃龍，在大家兄處砥據太岳。此乃第九個鼉龍，因年幼無甚執事，自舊年才著他居黑水河養性，待成名，別遷調用。誰知他不遵吾旨，衝撞大聖也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 180
        "line_end": 180
    "translation_ja": |-
      竜王は読むと、魂も吹き飛ぶほどおびえ、慌ててひざまずき、頭を地につけた。
      西海の竜王「大聖さま、お許しください。あれは私の妹の九番目の息子です。妹の夫が、風雨を命令どおりに行わず、雨の量を減らしたため、天の役所から命が下り、人の世の官である丞相（じょうしょう）の魏徴（ぎちょう）に、夢の中で斬られました。妹は身を寄せるところがなくなり、私があの子をここへ連れてきて、大きくなるまで養ってやったのです。一昨年、不幸にも妹が病死し、あの子だけ住む場所がなかったので、黒水河で心を養い、真の道を修めるよう命じました。まさか、このような悪事を働こうとは思いませんでした。すぐに人を遣わし、捕らえてまいります。」
      悟空「お前の妹には、息子が全部で何人いるんだ？　どこで化け物をやっている？」
      西海の竜王「妹には九人の息子がおります。ほかの八人は皆、よい子です。一番目の小黄竜（しょうこうりゅう）は、今、淮瀆（わいとく）におります。二番目の小驪竜（しょうりりゅう）は済瀆（さいとく）に住み、三番目の青背竜（せいはいりゅう）は江瀆（こうとく）を治め、四番目の赤髯竜（せきぜんりゅう）は河瀆（かとく）を守っています。五番目の徒労竜（とろうりゅう）は仏祖（ぶっそ）のために鐘をつかさどり、六番目の穏獣竜（おんじゅうりゅう）は神々の宮殿の棟を守り、七番目の敬仲竜（けいちゅうりゅう）は玉帝のために、天を支える華表（かひょう）を守っています。八番目の蜃竜（しんりゅう）は、私の一番上の兄のところで太岳（たいがく）を支えています。この九番目が鼉竜です。まだ幼く、取り立てて役目もないため、去年から黒水河に住まわせ、心を養わせておりました。修行して名を成したら、別の役へ移して用いようと思っていたのです。それなのに私の命に背き、大聖さまに無礼を働くとは。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-032"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，笑道：「你妹妹有幾個妹丈？」敖順道：「只嫁得一個妹丈，乃涇河龍王。向年以此被斬，舍妹孀居於此，前年疾故了。」行者道：「一夫一妻，如何生此幾個雜種？」敖順道：「此正謂『龍生九種，九種各別。』」行者道：「我才心中煩惱，欲將簡帖為證，上奏天庭，問你個通同作怪，搶奪人口之罪。據你所言，是那廝不遵教誨，我且饒你這次：一則是看你昆玉分上；二來只該怪那廝年幼無知，你也不甚知情。你快差人擒來，救我師父，再作區處。」敖順即喚太子摩昂：「快點五百蝦魚壯兵，將小鼉捉來問罪。」一壁廂安排酒席，與大聖陪禮。行者道：「龍王再勿多心，既講開饒了你便罷，又何須辦酒？我今須與你令郎同去：一則老師父遭愆，二則我師弟盼望。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 181
        "line_end": 181
    "translation_ja": |-
      悟空は聞くと笑って言った。「お前の妹には、亭主が何人いたんだ？」
      西海の竜王「夫は一人だけ、涇河竜王（けいがりゅうおう）です。以前、そのことで斬られ、妹はここで未亡人として暮らしておりましたが、一昨年、病死いたしました。」
      悟空「夫一人に妻一人で、どうしてこんなにいろいろな雑種が生まれるんだ？」
      西海の竜王「まさに『竜は九種を生み、その九種はそれぞれ違う』ということです。」
      悟空「さっきは腹が立って、この招待状を証拠に天へ上奏し、妖怪と結託して人をさらった罪に、お前を問うつもりだった。今の話では、あいつがお前の教えに従わなかったのだな。それなら今回は見逃してやろう。一つには、お前たち兄弟の顔を立てるため。もう一つには、あいつが幼く無知だったのを責めるべきで、お前も詳しくは知らなかったからだ。早く人を遣って捕まえ、俺のお師匠さまを助けてくれ。あとの処置はそれからだ。」
      西海の竜王はすぐに太子の摩昂（まこう）を呼び、命じた。「すぐ蝦や魚の屈強な兵を五百集め、小鼉（しょうだ）を捕らえて罪を問え。」
      一方では酒宴を調え、悟空をもてなして詫びようとした。
      悟空「竜王、もう気を遣うな。話がついて、許すと言ったんだから、それでいい。なぜ酒宴まで用意する？　俺は今、お前の息子と一緒に行かねばならん。一つにはお師匠さまが難儀しているし、もう一つには弟弟子が待ちわびているからな。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-033"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老龍苦留不住，又見龍女捧茶來獻。行者立飲他一盞香茶，別了老龍，隨與摩昂領兵，離了西海，早到黑水河中。行者道：「賢太子，好生捉怪，我上岸去也。」摩昂道：「大聖寬心，小龍子將他拿上來先見了大聖，懲治了他罪名，把師父送上來，才敢帶回海內，見我家父。」行者欣然相別，捏了避水訣，跳出波津，徑到了東邊崖上。沙僧與那河神迎著道：「師兄，你去時從空而去，怎麼回來卻自河內而回？」行者把那打死魚精，得簡帖，怪龍王，與太子同領兵來之事，備陳了一遍。沙僧十分歡喜，都立在岸邊，候接師父不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 182
        "line_end": 182
    "translation_ja": |-
      老いた竜王は熱心に引き止めたが、留めることはできなかった。そこへ竜の娘が茶を捧げてきたので、悟空は立ったまま香り高い茶を一杯飲み、竜王に別れを告げた。摩昂とともに兵を率いて西海を離れると、たちまち黒水河に着いた。
      悟空「太子よ、しっかり妖怪を捕まえてくれ。俺は岸へ上がるぞ。」
      摩昂「大聖さま、ご安心ください。私はあいつを捕らえて、まず大聖さまの前へ引き出し、罪を懲らしめ、師を岸へお送りいたします。それが済んで初めて、あいつを海へ連れ帰り、父に会わせます。」
      悟空は喜んで別れ、水を避ける呪文を唱えて水面へ飛び出し、そのまま東岸の崖の上へ行った。沙悟浄と河神が迎えた。
      沙悟浄と河神「兄さん、行くときは空からだったのに、どうして帰りは川の中からなのです？」
      悟空は、魚の精を打ち殺したこと、招待状を手に入れたこと、竜王を責め、太子と一緒に兵を率いてきたことを、詳しく話した。沙悟浄は大いに喜んだ。皆が岸辺に立って、三蔵を迎えようと待つ話は、ひとまず置いておく。
    "translation_status": "reviewed"
  - "id": "xy-ch43-034"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那摩昂太子著介士先到他水府門前，報與妖怪道：「西海老龍王太子摩昂來也。」那怪正坐，忽聞摩昂來，心中疑惑道：「我差黑魚精投簡帖拜請二舅爺，這早晚不見回話，怎麼舅爺不來，卻是表兄來耶？」正說間，只見那巡河的小怪又來報：「大王，河內有一枝兵，屯於水府之西，旗號上書著『西海儲君摩昂小帥』。」妖怪道：「這表兄卻也狂妄。想是舅爺不得來，命他來赴宴。既是赴宴，如何又領兵勞士？咳！但恐其間有故。」教：「小的們，將我的披掛鋼鞭伺候，恐一時變暴。待我且出去迎他，看是何如。」眾妖領命，一個個擦掌摩拳準備。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      さて摩昂太子は、鎧を着た使者を先に水の館の門前へ遣わし、妖怪へ取り次がせた。
      使者「西海の竜王の太子、摩昂がお越しだ！」
      鼉竜は座っていたが、摩昂が来たと聞き、不審に思った。
      鼉竜「黒魚の精を遣わして招待状を届け、二番目のおじ上をお招きしたのに、今になっても返事がない。どうしておじ上は来ず、従兄が来たのだ？」
      話していると、川を見回る小妖がまた報告に来た。
      巡河の小妖「大王、川の中に軍勢が一隊あり、水の館の西に陣取っております。旗には『西海の世継ぎ、若き将帥・摩昂』と書いてあります。」
      鼉竜「この従兄も、ずいぶん偉そうなことをする。おじ上が来られず、代わりに宴へ来させたのだろうが、宴へ出るのに、どうして兵まで率いてくる？　うむ、何かわけがありそうだ。」
      鼉竜は命じた。「お前たち、俺の鎧兜と鋼鞭を用意しておけ。急に事が変わるかもしれん。まずは外へ迎えに出て、様子を見てこよう。」
      妖怪たちは命を受け、皆、手をこすり合わせ、拳をさすって待ち構えた。
    "translation_status": "reviewed"
  - "id": "xy-ch43-035"

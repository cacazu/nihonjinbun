  "known_gaps":
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-002"
      "description_ja": "「観音扭」は、両手を胸前で合わせたまま開けない状態の由来として語られる。具体的な拘束具や手印の形まで、この本文から断定しない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-003"
      "description_ja": "「五十三参」は善財童子の参訪の語を重ねた表現。陳怡安の観音信仰研究（駒澤大学所蔵PDF、212頁の検索本文）は、本回の二例を挙げ、繰り返し参拝する慣用句としての使用も説明する。本文を単に五十三歩歩いたという意味には限定しなかった。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-008"
      "description_ja": "多心経の句数・文字数は三蔵の発言どおり五十四句・二百七十字とし、別の流布本の字数へ訂正しない。「無眼耳鼻舌身意」の説明は、悟空が師を批判する発言として訳し、経文全体の唯一の解釈だと断定しない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-009"
      "description_ja": "「三三行」は修行の達成を示す象徴的な表現として「三三の行」とした。この場面だけで、具体的な修行項目の数え方まで確定しない。三蔵の詩は前段落から続く直接発話である。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-013"
      "description_ja": "里・尺は原単位を保持し、時代差のある数値を現代の距離へ換算しない。三人なら容易に川を越えられても、生身の三蔵を背負うと飛行・遊泳に支障があるという説明を、そのまま残した。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-019"
      "description_ja": "底本は門の文字を「八個大字」と数えるが、「衡陽峪黑水河神府」は九文字ある。訳でも八文字という説明と扁額の全文をともに残し、食い違いを訂正しなかった。衣の「褊衫」は既存の訳語「偏衫」にそろえたが、原文欄は原字を保持する。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-019"
      "description_ja": "「暖寿」は誕生日の前日に宴を設けて祝うこと。教育部『重編国語辞典修訂本』の語釈で確認した。ここでは誕生日前祝いの宴とした。「二舅爺」は母の兄弟の二番目という順序を示し、母より年上か年下かを本文だけで決めず「二番目のおじ上」とした。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-027"
      "description_ja": "悟空が使者の黒魚の精を問答なしに打ち殺す叙述は省略・美化しない。黒魚を一般に雷魚類と解することはできるが、物語中の精の厳密な魚種は確定しなかった。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-028"
      "description_ja": "招待状の署名は「鼉潔」。その前からこの名を使わない。底本の末尾には閉じ鉤括弧があるが、独立した書簡を読む構造として訳し、誰かが音読した台詞にはしない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-030"
      "description_ja": "底本はこの回の西海の竜王を「敖順」と記す。第三回の北海竜王・敖順、西海竜王・敖閏という配置とは異なり、第四十一回にも同じ逆転がある。訳は敖順を敖閏に直さず、通常の呼称を「西海の竜王」にそろえる。辞書では西海を治めるという役割に従って参照し、敖順をこの底本の異表記として扱う。名が一致するだけで北海の竜王と同一視しない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-031"
      "description_ja": "竜王の妹の子は九人。先の八人の名・居場所・役目をすべて残した。「砥據太岳」は大きな山を支える趣旨と解したが、太岳を特定の実在山と断定しない。また、妹の夫の名はこの段落には補わず、次の段落の名乗りに従った。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-033"
      "description_ja": "「沙僧與那河神迎著道」は二人が迎えて話す構文を保った。発言の「師兄」は沙悟浄から悟空への呼びかけだが、これだけを理由に発言全体を沙悟浄一人へ割り当てず、合同の発言とした。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-037"
      "description_ja": "鼉竜は三蔵の捕縛と沙悟浄との戦いを「昨日」と語るが、前後の展開には夜を越した明示がない。訳者が「今日」へ直さず、本人の語りとして保持した。沙悟浄を敗走させたというのも鼉竜の主張であり、語り手の事実認定へ変えない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-038"
      "description_ja": "摩昂は観音が悟空を善へ導いて改名したと語る。前の回までに描かれた命名経緯とは食い違うが、台詞を訂正しない。「三合」を三回攻撃が当たったこととはせず、武器を交える数として残した。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-040"
      "description_ja": "水族の戦いの魚貝名を全て残した。鯁・鮊を含む古い魚名と現代の標準種名との対応は未確定なものが多い。特に「少揚」「鯤司」は字形・語義の問題を解決できず、底本表記と音読を残した。鯖を日本で普通にいうサバと、鯊をサメと決めつけない。原文の「白蟮」を含む名と、白・烏の色彩語も訳文に保持した。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-041"
      "description_ja": "摩昂の武器は底本で「三棱簡」「三稜簡」の両表記があるため、訳でもそれぞれ残した。簡は棒状の打撃武器。「琵琶骨」は肩甲骨をいう古い名で、鎖を通す拘束の描写を省かない。 本文欠落ではなく、解釈・底本上の留保。"
    - "source_id": "wikisource-xiyou-ch43-1455592"
      "segment_ids":
        - "xy-ch43-042"
      "description_ja": "冒頭は「行者與沙僧見了道」だが、発言中に悟空の自称「老孫」と自分の棒への言及があるため、二人が見た後、悟空が発言したものと解した。 本文欠落ではなく、解釈・底本上の留保。"

  - "id": "xy-ch43-036"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      征旗飄繡帶，畫戟列明霞。
      寶劍凝光彩，長槍纓繞花。
      弓彎如月小，箭插似狼牙。
      大刀光燦燦，短棍硬沙沙。
      鯨鰲並蛤蚌，蟹鱉共魚蝦。
      大小齊齊擺，干戈似密麻。
      不是元戎令，誰敢亂爬蹅？
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 187
        "line_end": 193
    "translation_ja": |-
      軍旗には刺繍の帯がひるがえり、飾りの戟が明るい霞のように並ぶ。
      宝剣には光が集まり、長槍の房は花のようにめぐる。
      弓は細い月のように曲がり、並ぶ矢は狼の牙のよう。
      大刀はきらきら輝き、短い棒はがっしりと堅い。
      鯨や大海亀、蛤や二枚貝、蟹やすっぽん、魚や蝦。
      大小そろって整然と並び、盾や戈は麻のように密集している。
      総大将の命令もないのに、誰が勝手に動き回れよう。
    "translation_status": "reviewed"
  - "id": "xy-ch43-037"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "鼉怪見了，徑至那營門前，厲聲高叫：「大表兄，小弟在此拱候，有請。」有一個巡營的螺螺，急至中軍帳：「報千歲殿下：外有鼉龍叫請哩。」太子按一按頂上金盔，束一束腰間寶帶，手提一根三棱簡，拽開步，跑出營去，道：「你來請我怎麼？」鼉龍進禮道：「小弟今早有簡帖拜請舅爺，想是舅爺見棄，著表兄來的。兄長既來赴席，如何又勞師動眾？不入水府，扎營在此，又貫甲提兵，何也？」太子道：「你請舅爺做甚？」妖怪道：「小弟一向蒙恩賜居於此，久別尊顏，未得孝順。昨日捉得一個東土僧人，我聞他是十世修行的元體，人吃了他，可以延壽，欲請舅爺看過，上鐵籠蒸熟，與舅爺暖壽哩。」太子喝道：「你這廝十分懵懂！你道僧人是誰？」妖怪道：「他是唐朝來的僧人，往西天取經的和尚。」太子道：「你只知他是唐僧，不知他手下徒弟利害哩。」妖怪道：「他有一個長嘴的和尚，喚做個豬八戒，我也把他捉住了，要與唐和尚一同蒸吃。還有一個徒弟，喚做沙和尚，乃是一條黑漢子，晦氣色臉，使一根寶杖，昨日在這門外與我討師父，被我帥出河兵，一頓鋼鞭，戰得他敗陣逃生，也不見怎的利害。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 194
        "line_end": 194
    "translation_ja": |-
      鼉竜はその様子を見て、まっすぐ陣の門前へ行き、声を張り上げた。
      鼉竜「一番上の従兄上、弟分がここでお待ちしています。どうぞおいでください！」
      陣を巡回していた巻貝の兵が、急いで本陣の幕舎へ行った。
      巻貝の兵「千歳（せんざい）殿下、ご報告いたします。外で鼉竜がお呼びです。」
      太子は頭の金の兜を押さえ、腰の宝帯を締め直し、一本の三棱簡（さんりょうかん）を手に、大股で走って陣を出た。
      摩昂「何の用で俺を招いたのだ？」
      鼉竜は進み出て礼をし、言った。「私は今朝、招待状を差し上げて、おじ上をお招きしました。おじ上は私をお見限りになり、代わりに従兄上をお遣わしになったのでしょう。宴にお越しいただいたのに、どうしてまた、こんなに大勢の兵を動かされたのです？　水の館にも入らず、ここへ陣を敷き、鎧を着て武器を手にしておられるのは、なぜですか？」
      摩昂「おじ上を、何のために招いた？」
      鼉竜「私はいつもお世話になり、ここに住まわせていただきながら、長くお顔も拝見せず、孝行もできずにいました。昨日、東土の僧を一人捕らえたのですが、十世にわたって修行した身で、その肉を食べれば寿命が延びると聞いております。おじ上においでいただき、ご覧に入れてから鉄の蒸籠で蒸し上げ、誕生日前祝いをしようと思ったのです。」
      摩昂は一喝した。「お前は、まったく何も分かっていない！　その僧が誰だと思っている？」
      鼉竜「唐から来て、西天へ経を取りに行く和尚です。」
      摩昂「唐僧だということしか知らず、あの方の弟子たちの手ごわさは知らんのだな。」
      鼉竜「長い口の和尚が一人いて、猪八戒（ちょはっかい）とかいうのですが、そいつも捕まえました。唐の和尚と一緒に蒸して食うつもりです。もう一人、沙和尚（さおしょう）という弟子もいます。薄暗い顔色の黒い大男で、宝杖を一本使う奴です。昨日、この門の前へ師を返せと来ましたが、私が川の兵を率いて出て、鋼鞭で散々戦ってやると、敗れて命からがら逃げました。別にたいした奴とも思えませんでしたが。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-038"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "太子道：「原來是你不知。他還有一個大徒弟，是五百年前大鬧天宮上方太乙金仙齊天大聖。如今保護唐僧往西天拜佛求經，是普陀巖大慈大悲觀音菩薩勸善，與他改名，喚做孫悟空行者。你怎麼沒得做，撞出這件禍來？他又在我海內遇著你的差人，奪了請帖，徑入水晶宮，拿捏我父子們有結連妖邪，搶奪人口之罪。你快把唐僧、八戒送上河邊，交還了孫大聖，憑著我與他陪禮，你還好得性命；若有半個『不』字，休想得全生居於此也。」那怪鼉聞此言，心中大怒道：「我與你嫡親的姑表，你倒反護他人。聽你所言，就教把唐僧送出。天地間那裡有這等容易事也？你便怕他，莫成我也怕他？他若有手段，敢來我水府門前與我交戰三合，我才與他師父；若敵不過我，就連他也拿來，一齊蒸熟，也沒甚麼親人，也不去請客，自家關了門，教小的們唱唱舞舞，我坐在上面，自自在在，吃他娘不是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 195
        "line_end": 195
    "translation_ja": |-
      摩昂「やはり、お前は知らないのだ。あの方には、もう一人、一番弟子がいる。五百年前に天宮（てんきゅう）を大騒動に陥れた、天上の太乙金仙（たいいつきんせん）、斉天大聖だ。今は唐僧を守り、西天で仏を拝して経を求めようとしている。普陀岩（ふだがん）の大慈大悲の観音菩薩に善へ導かれ、名前を改めて、孫悟空行者（そんごくうぎょうじゃ）と呼ばれているのだ。お前はどうして、ほかにすることがないとでもいうように、こんな災いを引き起こした？　あの方はさらに、私たちの海でお前の使者に出会い、招待状を奪って、まっすぐ水晶宮へ来られた。私たち父子に、妖怪と結びつき、人をさらった罪があると責められたのだ。早く唐僧と八戒を岸辺へ送り、孫大聖（そんたいせい）に返せ。私が詫びを入れれば、お前も命は助かるだろう。少しでも嫌だと言うなら、ここで命を全うできると思うな。」
      鼉竜は聞くと、胸の中で激しく怒った。
      鼉竜「俺とお前は、実のいとこ同士だ。それなのに、お前はよその者の肩を持つのか。お前の言葉一つで唐僧を返せだと？　天地の間に、そんな都合のいい話があるものか。お前はあいつが怖くても、俺まで怖がると思うなよ。あいつに腕があるなら、俺の水の館の門前まで来て、三合戦ってみろ。そうして初めて、師を返してやる。俺に敵わなければ、あいつまで捕まえて一緒に蒸してやる。もう身内も何もあるものか。客も呼ばん。自分の家の門を閉じ、手下どもに歌わせ踊らせ、俺は上座に座って、気ままに食ってやるさ。それの何が悪い、くそったれ！」
    "translation_status": "reviewed"
  - "id": "xy-ch43-039"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "太子見說，開口罵道：「這潑邪！果然無狀。且不要教孫大聖與你對敵，你敢與我相持麼？」那怪道：「要做好漢，怕甚麼相持？」教：「取披掛。」呼喚一聲，眾小妖跟隨左右，獻上披掛，捧上鋼鞭。他兩個變了臉，各逞英雄；傳號令，一齊擂鼓。這一場比與沙僧爭鬥，甚是不同。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 197
        "line_end": 197
    "translation_ja": |-
      太子はそれを聞き、口を開いて罵った。
      摩昂「この邪悪なろくでなし！　本当に道理の分からぬ奴だ。孫大聖に相手をしていただくまでもない。俺と戦う度胸はあるか？」
      鼉竜「男の意地を見せるのに、戦いの何が怖い！」
      鼉竜は命じた。「鎧兜を持て！」
      その声に、小妖たちが左右につき従い、鎧兜を差し出し、鋼鞭を捧げた。二人は顔つきを変え、それぞれ武勇を示そうとした。号令が伝わり、一斉に太鼓が鳴る。今度の戦いは、沙悟浄と争ったときとは大違いであった。見ると、こんな有様だった。
    "translation_status": "reviewed"
  - "id": "xy-ch43-040"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": "旌旗照耀，戈戟搖光。這壁廂營盤解散，那壁廂門戶開張。摩昂太子提金簡，鼉怪掄鞭急架償。一聲炮響河兵烈，三棒鑼鳴海士狂。鰕與鰕爭，蟹與蟹鬥。鯨鰲吞赤鯉，鯁鮊起黃鱨。鯊鯔吃鮆鯖魚走，牡蠣擒蟶蛤蚌慌。少揚刺硬如鐵棍，鯤司針利似鋒芒。鱏鯕追白蟮，魲鱠捉烏鯧。一河水怪爭高下，兩處龍兵定弱強。混戰多時波浪滾，摩昂太子賽金剛。喝聲金簡當頭重，拿住妖鼉作怪王。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 198
        "line_end": 198
    "translation_ja": |-
      旗は照り輝き、戈や戟が光を揺らす。
      こちらでは陣が解かれ、あちらでは館の門が大きく開く。
      摩昂太子は金の簡（かん）を提げ、鼉竜は鞭を振るって、すばやく受け止める。
      一発の砲声に川の兵が猛り、三打の銅鑼に海の兵が狂い立つ。
      蝦は蝦と争い、蟹は蟹と戦う。
      鯨と大海亀は赤い鯉をのみ込み、鯁（こう）と鮊（はく）は黄鱨（こうしょう）を追い立てる。
      鯊（さ）と鯔（し）が鮆（せい）と鯖（せい）を食おうとすれば魚どもは逃げ、牡蠣が蟶（てい）を捕らえれば蛤や二枚貝はおびえる。
      少揚（しょうよう）のとげは鉄の棒のように堅く、鯤司（こんし）の針は刃先のように鋭い。
      鱏（しん）と鯕（き）は白い蟮（せん）を追い、魲（ろ）と鱠（かい）は黒い鯧（しょう）を捕まえる。
      川一面の水の怪物が優劣を争い、両方の竜の兵が強弱を決めようとする。
      長い乱戦に波が渦巻き、摩昂太子は金剛力士（こんごうりきし）にも勝る働き。
      一喝とともに金の簡を頭上から重く振り下ろし、悪事をなした妖王の鼉（だ）を捕らえる。
    "translation_status": "reviewed"
  - "id": "xy-ch43-041"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這太子將三稜簡閃了一個破綻，那妖精不知是詐，鑽將進來，被他使個解數，把妖精右臂只一簡，打了個躘踵。趕上前，又一拍腳，跌倒在地。眾海兵一擁上前，揪翻住，將繩子背綁了雙手，將鐵索穿了琵琶骨，拿上岸來。押至孫行者面前道：「大聖，小龍子捉住妖鼉，請大聖定奪。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 200
        "line_end": 200
    "translation_ja": |-
      太子は三稜簡（さんりょうかん）を操って、わざと隙を見せた。鼉竜は策略とは気づかず、そこへ飛び込んだ。太子は技を繰り出し、妖怪の右腕を簡で一撃してよろめかせ、追いすがってさらに足で蹴りつけ、地面へ倒した。海の兵たちがどっと押し寄せ、引き伏せて、両手を背中に回して縄で縛り、鉄の鎖を琵琶骨（びわこつ）へ通して、岸へ連れ上がった。摩昂は悟空の前へ引き立てて言った。
      摩昂「大聖さま、妖怪の鼉を捕らえました。どうぞご処置ください。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-042"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者與沙僧見了道：「你這廝不遵旨令。你舅爺原著你在此居住，教你養性存身，待你名成之日，別有遷用。你怎麼強占水神之宅，倚勢行兇，欺心誑上，弄玄虛，騙我師父、師弟？我待要打你這一棒，奈何老孫這棒子甚重，略打打兒就了了性命。你將我師父安在何處哩？」那怪叩頭不住道：「大聖，小鼉不知大聖大名。卻才逆了表兄，騁強背理，被表兄把我拿住。今見大聖，幸蒙大聖不殺之恩，感謝不盡。你師父還綑在那水府之間，望大聖解了我的鐵索，放了我手，等我到河中送他出來。」摩昂在傍道：「大聖，這廝是個逆怪，他極奸詐，若放了他，恐生惡念。」沙和尚道：「我認得他那裡，等我尋師父去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 201
        "line_end": 201
    "translation_ja": |-
      悟空と沙悟浄が見ると、悟空が言った。
      悟空「お前は命令に背いたな。おじ上はここへ住まわせ、心を養い、身を保たせて、名を成したら別の役目へ移すつもりだったのだ。それなのに、なぜ水神の家を奪い、威勢をかさに悪事を働き、良心を裏切って目上を欺き、いかさまで俺の師と弟弟子をだました？　この棒で一発打ってやりたいが、なにしろ俺の棒はひどく重い。ちょっと打っただけで命がなくなるぞ。俺のお師匠さまを、どこへ置いた？」
      鼉竜は、頭を地につけ続けながら答えた。
      鼉竜「大聖さま、私は大聖さまのご高名を存じませんでした。つい先ほども従兄に逆らい、力を誇って道理に背いたため、従兄に捕らえられました。今、大聖さまにお目にかかり、ありがたくも命をお助けいただき、感謝してもしきれません。お師匠さまは、まだ水の館の中に縛ってあります。どうか鉄の鎖を解き、手を自由にしてください。川へ入って、お送りしてまいります。」
      摩昂が脇から言った。「大聖さま、こいつは反抗的で、ひどくずる賢い妖怪です。放せば、また悪い心を起こすかもしれません。」
      沙悟浄「私はその場所を知っています。私がお師匠さまを捜してきましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch43-043"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個跳入水中，徑至水府門前。那裡門扇大開，更無一個小卒。直入亭臺裡面，見唐僧、八戒赤條條都綑在那裡。沙僧即忙解了師父，河神亦隨解了八戒，一家背著一個，出水面，徑至岸邊。豬八戒見那妖精鎖綁在側，急掣鈀上前就築，口裡罵道：「潑邪畜！你如今不吃我了？」行者扯住道：「兄弟，且饒他死罪罷，看敖順賢父子之情。」摩昂進禮道：「大聖，小龍子不敢久停。既然救得你師父，我帶這廝去見家父；雖大聖饒了他死罪，家父決不饒他活罪，定有發落處置，仍回覆大聖謝罪。」行者道：「既如此，你領他去罷。多多拜上令尊，尚容面謝。」那太子押著那妖潑，投水中，帥領海兵，徑轉西洋大海不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 202
        "line_end": 202
    "translation_ja": |-
      沙悟浄と河神の二人は水へ飛び込み、まっすぐ水の館の門前へ行った。扉は大きく開き、小さな兵一人いない。そのまま高殿の中へ入ると、三蔵も八戒も、裸で縛られていた。沙悟浄は急いで三蔵の縄を解き、河神も八戒の縄を解いた。それぞれ一人ずつ背負い、水面へ出て岸へ向かった。
      八戒は、妖怪が傍らに鎖でつながれ、縛られているのを見ると、急いで熊手を抜き、前へ出て打ち込もうとした。
      八戒「この邪悪な畜生め！　今はもう俺を食わないのか！」
      悟空は八戒を引き止めて言った。「弟よ、死罪だけは勘弁してやれ。敖順父子の顔を立ててやろう。」
      摩昂は進み出て礼をし、言った。「大聖さま、私は長居をいたせません。師をお助けできたからには、こいつを父のもとへ連れていきます。大聖さまが死罪を許されても、父は生きて受ける罰までは許しますまい。必ず裁きを下して処置し、改めて大聖さまにご報告して、お詫びいたします。」
      悟空「それなら、連れていくがいい。父上にくれぐれもよろしく伝えてくれ。いずれ直接お礼に伺うとな。」
      太子は、この悪辣な妖怪を引き立てて水へ入り、海の兵を率い、まっすぐ西洋大海へ帰っていった。この話はここまで。
    "translation_status": "reviewed"
  - "id": "xy-ch43-044"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那黑水河神謝了行者道：「多蒙大聖復得水府之恩。」唐僧道：「徒弟啊，如今還在東岸，如何渡此河也？」河神道：「老爺勿慮，且請上馬，小神開路，引老爺過河。」那師父才騎了白馬，八戒採著韁繩，沙和尚挑了行李，孫行者扶持左右。只見河神作起阻水的法術，將上流擋住，須臾，下流撤乾，開出一條大路。師徒們行過西邊，謝了河神，登崖上路。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 204
        "line_end": 204
    "translation_ja": |-
      さて、黒水河の河神は悟空に礼を述べた。
      河神「大聖さまのおかげで、水の館を取り戻すことができました。このご恩に感謝いたします。」
      三蔵「弟子たちよ、だが、まだ東岸にいる。どうやってこの川を渡るのだ？」
      河神「和尚さま、ご心配には及びません。どうぞ馬にお乗りください。私が道を開き、ご案内して川を渡っていただきます。」
      三蔵はそこで白馬に乗り、八戒が手綱を取り、沙悟浄が荷を担い、悟空が傍らで支えた。河神が水をせき止める術を使い、上流をふさぐと、たちまち下流の水が引いて干上がり、大きな道が現れた。師弟は西側へ渡り、河神に礼を言って、崖へ登り、旅路についた。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch43-045"
    "section_id": "chapter-43"
    "kind": "verse"
    "origin": "source"
    "source_text": "禪僧有救朝西域，徹地無波過黑河。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 206
        "line_end": 206
    "translation_ja": |-
      救われた禅僧は、西の国へと進みゆき、
      底までも波の消えた黒河（こくが）を、無事に渡ったのであった。
    "translation_status": "reviewed"
  - "id": "xy-ch43-046"
    "section_id": "chapter-43"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知怎生得拜佛求經，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch43-1455592"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第043回&oldid=1455592"
        "line_start": 208
        "line_end": 208
    "translation_ja": "この先、どのように仏を拝し、経を求めることになるのか。それは次の回のお話で。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-01-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「観音扭」は、両手を胸前で合わせたまま開けない状態の由来として語られる。具体的な拘束具や手印の形まで、この本文から断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-02-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「五十三参」は善財童子の参訪の語を重ねた表現。陳怡安の観音信仰研究（駒澤大学所蔵PDF、212頁の検索本文）は、本回の二例を挙げ、繰り返し参拝する慣用句としての使用も説明する。本文を単に五十三歩歩いたという意味には限定しなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-03-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "多心経の句数・文字数は三蔵の発言どおり五十四句・二百七十字とし、別の流布本の字数へ訂正しない。「無眼耳鼻舌身意」の説明は、悟空が師を批判する発言として訳し、経文全体の唯一の解釈だと断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-04-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三三行」は修行の達成を示す象徴的な表現として「三三の行」とした。この場面だけで、具体的な修行項目の数え方まで確定しない。三蔵の詩は前段落から続く直接発話である。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-05-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "里・尺は原単位を保持し、時代差のある数値を現代の距離へ換算しない。三人なら容易に川を越えられても、生身の三蔵を背負うと飛行・遊泳に支障があるという説明を、そのまま残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-06-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は門の文字を「八個大字」と数えるが、「衡陽峪黑水河神府」は九文字ある。訳でも八文字という説明と扁額の全文をともに残し、食い違いを訂正しなかった。衣の「褊衫」は既存の訳語「偏衫」にそろえたが、原文欄は原字を保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-07-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「暖寿」は誕生日の前日に宴を設けて祝うこと。教育部『重編国語辞典修訂本』の語釈で確認した。ここでは誕生日前祝いの宴とした。「二舅爺」は母の兄弟の二番目という順序を示し、母より年上か年下かを本文だけで決めず「二番目のおじ上」とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-08-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空が使者の黒魚の精を問答なしに打ち殺す叙述は省略・美化しない。黒魚を一般に雷魚類と解することはできるが、物語中の精の厳密な魚種は確定しなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-09-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "招待状の署名は「鼉潔」。その前からこの名を使わない。底本の末尾には閉じ鉤括弧があるが、独立した書簡を読む構造として訳し、誰かが音読した台詞にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-10-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本はこの回の西海の竜王を「敖順」と記す。第三回の北海竜王・敖順、西海竜王・敖閏という配置とは異なり、第四十一回にも同じ逆転がある。訳は敖順を敖閏に直さず、通常の呼称を「西海の竜王」にそろえる。辞書では西海を治めるという役割に従って参照し、敖順をこの底本の異表記として扱う。名が一致するだけで北海の竜王と同一視しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-11-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "竜王の妹の子は九人。先の八人の名・居場所・役目をすべて残した。「砥據太岳」は大きな山を支える趣旨と解したが、太岳を特定の実在山と断定しない。また、妹の夫の名はこの段落には補わず、次の段落の名乗りに従った。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-12-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「沙僧與那河神迎著道」は二人が迎えて話す構文を保った。発言の「師兄」は沙悟浄から悟空への呼びかけだが、これだけを理由に発言全体を沙悟浄一人へ割り当てず、合同の発言とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-13-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鼉竜は三蔵の捕縛と沙悟浄との戦いを「昨日」と語るが、前後の展開には夜を越した明示がない。訳者が「今日」へ直さず、本人の語りとして保持した。沙悟浄を敗走させたというのも鼉竜の主張であり、語り手の事実認定へ変えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-14-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "摩昂は観音が悟空を善へ導いて改名したと語る。前の回までに描かれた命名経緯とは食い違うが、台詞を訂正しない。「三合」を三回攻撃が当たったこととはせず、武器を交える数として残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-15-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "水族の戦いの魚貝名を全て残した。鯁・鮊を含む古い魚名と現代の標準種名との対応は未確定なものが多い。特に「少揚」「鯤司」は字形・語義の問題を解決できず、底本表記と音読を残した。鯖を日本で普通にいうサバと、鯊をサメと決めつけない。原文の「白蟮」を含む名と、白・烏の色彩語も訳文に保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-16-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "摩昂の武器は底本で「三棱簡」「三稜簡」の両表記があるため、訳でもそれぞれ残した。簡は棒状の打撃武器。「琵琶骨」は肩甲骨をいう古い名で、鎖を通す拘束の描写を省かない。"
    "translation_status": "reviewed"
  - "id": "xy-ch43-note-17-body"
    "section_id": "chapter-43"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭は「行者與沙僧見了道」だが、発言中に悟空の自称「老孫」と自分の棒への言及があるため、二人が見た後、悟空が発言したものと解した。"
    "translation_status": "reviewed"

        "line_start": 168
        "line_end": 168
    "translation_ja": "三蔵は喜んだ。馬には乗らず、木こりと師弟四人の一行が連れ立って、西南へ曲がりくねった道を歩いていった。いくらも行かぬうちに、なるほど、こんな所が見えてきた。"

    "translation_ja": |-
      先鋒は純鋼の刀斧（とうふ）を一振り取り、柳の根を人の頭の形に削り、人血を吹きかけてべたべたに塗りつけた。それを小妖に命じて漆塗りの盆に載せさせ、門の下へ運ばせた。
      盆を持つ小妖「大聖（たいせい）の大旦那さま、どうかお怒りをお鎮めになり、お聞き届けください。」
      悟空は実際、おだてに弱かった。「大聖の大旦那さま」という声を聞くと、すぐに八戒を止めた。
      悟空「まだ手を出すな。何を言うのか聞こう。」
      盆を持つ小妖「お師匠さまは大王が洞へ捕らえて来ましたが、ここの小妖どもは田舎者の頑固者で、物の道理も分かりません。こいつは呑み込む、あいつはかじる、引っかく者、噛む者、と寄ってたかってお師匠さまを食べてしまい、ここに頭が一つ残っただけでございます。」
      悟空「もう食ったのなら、仕方がない。その頭だけ出せ。本物か偽物か見てやる。」
      小妖は門の穴から、その頭を放り出した。八戒は見るなり泣き出した。
      八戒「ああ、かわいそうに！　あんなお師匠さまが中へ入って、こんなお師匠さまになって出てくるなんて！」
      悟空「馬鹿、泣く前に、本物か偽物かよく見ろ。」
      八戒「恥ずかしくないのか。生首に本物も偽物もあるかよ？」
      悟空「こいつは偽物だ。」
      八戒「どうして分かる？」
      悟空「本物の頭なら、放り出しても、ぼとっと落ちて響かない。偽物は、拍子木みたいな音がした。信じないなら、俺が放り投げるから聞いてみろ。」
      拾い上げて石へたたきつけると、かんと高い音がした。
      沙悟浄「兄さん、響きました。」
      悟空「響けば偽物だ。正体を現させて見せよう。」
      さっと金箍棒（きんこぼう）を抜き、一撃で打ち砕いた。八戒が見ると、柳の根だった。我慢できず、罵り出した。
      八戒「この毛玉どもめ！　お師匠さまを洞へ隠しておいて、柳の根で、この豚のご先祖さまをだますつもりか。俺のお師匠さまが柳の精の化けたものだとでもいうのか！」
    "translation_status": "reviewed"
  - "id": "xy-ch86-008"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "慌得那拿盤的小怪戰兢兢跑去報道：「難難難，難難難。」老妖道：「怎麼有許多難？」小妖道：「豬八戒與沙和尚倒哄過了，孫行者卻是個販古董的──識貨，識貨。他就認得是個假人頭。如今得個真人頭與他，或者他就去了。」老怪道：「怎麼得個真人頭？我們那剝皮亭內有吃不了的人頭選一個來。」眾妖即至亭內揀了個新鮮的頭，教啃淨頭皮，滑塔塔的，還使盤兒拿出，叫：「大聖爺爺，先前委是個假頭。這個真正是唐老爺的頭，我大王留了鎮宅子的，今特獻出來也。」撲通的把個人頭又從門窟裡拋出，血滴滴的亂滾。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      盆を持つ小妖は慌てふためき、震えながら走って報告に戻った。
      盆を持つ小妖「難しい、難しい、難しい、難しい、難しい、難しい！」
      妖怪の頭目「どうしてそんなに難しいのだ？」
      盆を持つ小妖「八戒と沙悟浄はだませましたが、悟空ときたら骨董商です。品を見分ける、見分ける！　すぐに偽物の頭だと分かってしまいました。本物の人の頭を一つやれば、帰るかもしれません。」
      妖怪の頭目「本物の頭をどうやって手に入れる？　そうだ、皮剝ぎの東屋には食べきれぬほど人の頭がある。一つ選んでこい。」
      妖怪たちはすぐ東屋へ行き、新鮮な頭を一つ選んだ。頭皮をきれいにかじり取らせ、つるつるにして、また盆に載せて外へ出した。
      首を運ぶ小妖「大聖の大旦那さま、先ほどは確かに偽物の頭でした。今度こそ本物の唐僧さまの頭でございます。大王は家の守りに取っておいたのですが、特別にお差し出しいたします。」
      また門の穴から頭を放り投げると、どさりと落ち、血を滴らせながら転がった。
    "translation_status": "reviewed"
  - "id": "xy-ch86-009"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫行者認得是個真人頭，沒奈何就哭；八戒、沙僧也一齊放聲大哭。八戒噙著淚道：「哥哥，且莫哭。天氣不是好天氣，恐一時弄臭了，等我拿將去，乘生氣埋下再哭。」行者道：「也說得是。」那獃子不嫌穢污，把個頭抱在懷裡，跑上山崖向陽處，尋了個藏風聚氣的所在，取釘鈀築了一個坑，把頭埋了，又築起一個墳塚。才叫沙僧：「你與哥哥哭著，等我去尋些甚麼供養供養。」他就走向澗邊，攀幾根大柳枝，拾幾塊鵝卵石。回至墳前，把柳枝兒插在左右，鵝卵石堆在面前。行者問道：「這是怎麼說？」八戒道：「這柳枝權為松柏，與師父遮遮墳頂；這石子權當點心，與師父供養供養。」行者喝道：「夯貨，人已死了，還將石子兒供他。」八戒道：「表表生人意，權為孝道心。」行者道：「且休胡弄。教沙僧在此：一則廬墓，二則看守行李、馬匹。我和你去打破他的洞府，拿住妖魔，碎屍萬段，與師父報仇去來。」沙和尚滴淚道：「大哥言之極當。你兩個著意，我在此處看守。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      悟空には、本物の人の頭だと分かった。どうしようもなく泣き出し、八戒と沙悟浄も声を合わせて大泣きした。
      八戒は涙をためて言った。八戒「兄貴、ちょっと泣くのをやめてくれ。いい天気じゃないから、そのうち腐って臭くなるかもしれねえ。俺が持っていって、まだ生気のあるうちに埋めてから泣こう。」
      悟空「それもそうだ。」
      八戒は汚れを嫌がらず、頭を胸に抱き、崖の日当たりのよい所へ駆け上がった。風を遮って気の集まる場所を見つけ、熊手で穴を掘って頭を埋め、上に塚を築いた。それから沙悟浄を呼んだ。
      八戒「兄貴と泣いていてくれ。俺は何か供えるものを捜してくる。」
      谷川へ下り、大きな柳の枝を何本か手折り、丸い川石をいくつか拾った。墓へ戻ると、柳の枝を左右に挿し、石を前に積み上げた。
      悟空「こりゃ何のつもりだ？」
      八戒「柳は松柏（しょうはく）の代わりにして、お師匠さまのお墓に日陰を作ってやるんだ。石は菓子の代わりに、お師匠さまへお供えするのさ。」
      悟空は怒鳴った。悟空「間抜けめ、人が死んだというのに、石なんぞを供えるのか！」
      八戒「生きてる者の気持ちを表すのさ。これでも孝行の心のつもりだよ。」
      悟空「もう、いいかげんなことはやめろ。沙悟浄にはここにいてもらおう。一つには墓のそばで喪に服し、一つには荷物と馬を見守るためだ。俺とお前は洞を打ち破り、妖魔を捕らえ、死体をずたずたに切り刻んで、お師匠さまの仇を討ちに行こう。」
      沙悟浄は涙をこぼした。沙悟浄「兄さんのおっしゃるとおりです。二人とも気をつけて。私はここを守っています。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-010"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好八戒，即脫了皂錦直裰，束一束著體小衣，舉鈀隨著行者，二人努力向前，不容分辨，徑自把他石門打破，喊聲振天，叫道：「還我活唐僧來耶！」那洞裡大小群妖，一個個魂飛魄散，都報怨先鋒的不是。老妖問先鋒道：「這些和尚打進門來，卻怎處治？」先鋒道：「古人說得好：『手插魚籃，避不得腥。』一不做，二不休，左右帥領家兵殺那和尚去來。」老怪聞言，無計可奈，真個傳令，叫：「小的們，各要齊心，將精銳器械跟我去出征。」果然一齊吶喊，殺出洞門。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      八戒は黒い錦の直裰（ちょくたつ）を脱ぎ、体に着けた薄着をきゅっと締め、熊手を持って悟空に従った。二人は力を込めて進み、弁解する隙も与えず、まっすぐ石門を打ち破った。叫び声が天を震わせた。
      悟空と八戒「生きた唐僧を返せえ！」
      洞の大小の妖怪たちは、どいつも魂が抜けるほどおびえ、皆、先鋒のしくじりを責めた。
      妖怪の頭目「坊主どもが門を破って入ってくるぞ。どう始末をつける？」
      先鋒「昔の人も、うまいことを言いました。『魚籠に手を入れたら、生臭さは避けられない』。始めた以上は、最後までやるしかありません。ともかく家来の兵を率い、あの坊主どもを殺しに出ましょう。」
      頭目にはほかに手もなく、その言葉を聞いて本当に命令を下した。
      妖怪の頭目「者ども、皆、心を一つにせよ。よく切れる武器を持ち、わしとともに出陣するのだ！」
      一同はそろってときの声を上げ、洞の門から攻め出た。
    "translation_status": "reviewed"
  - "id": "xy-ch86-011"

    "translation_ja": |-
      第八十六回
      木母は威勢を添えて怪物を征し、金公は術を施して妖邪を滅ぼす
    "translation_status": "reviewed"
  - "id": "xy-ch86-002"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說孫大聖牽著馬，挑著擔，滿山頭尋叫師父，忽見豬八戒氣呼呼的跑將來道：「哥哥，你喊怎的？」行者道：「師父不見了，你可曾看見？」八戒道：「我原來只跟唐僧做和尚的，你又捉弄我，教做甚麼將軍。我捨著命，與那妖精戰了一會，得命回來。師父是你與沙僧看著的，反來問我？」行者道：「兄弟，我不怪你。你不知怎麼眼花了，把妖精放回來拿師父。我去打那妖精，教沙和尚看著師父的，如今連沙和尚也不見了。」八戒笑道：「想是沙和尚帶師父那裡出恭去了。」說不了，只見沙僧來到。行者問道：「沙僧，師父那裡去了？」沙僧道：「你兩個眼都昏了，把妖精放將來拿師父。老沙去打那妖精的，師父自家在馬上坐來。」行者氣得暴跳道：「中他計了，中他計了。」沙僧道：「中他甚麼計？」行者道：「這是分瓣梅花計，把我弟兄們調開，他劈心裡撈了師父去了。天天天，卻怎麼好？」止不住腮邊淚滴。八戒道：「不要哭，一哭就膿包了。橫豎不遠，只在這座山上，我們尋去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、悟空（ごくう）は馬を引き、荷を担ぎ、山じゅうを歩いて師を呼び探していた。そこへ八戒（はっかい）が息を切らして駆けてきた。
      八戒「兄貴、何を叫んでるんだ？」
      悟空「お師匠さまがいなくなった。お前、見なかったか？」
      八戒「俺はもともと、三蔵（さんぞう）さまについて坊主をやるだけだったんだ。それをまた俺をからかって、何とかいう将軍にしやがって。命を捨てるつもりであの妖怪としばらく戦い、やっと生きて帰ってきたんだぞ。お師匠さまは兄貴と沙悟浄（さごじょう）が見ていたのに、どうして俺に聞くんだ？」
      悟空「兄弟、お前を責めてるんじゃない。どういうわけかお前の目がくらんで、妖怪を逃がし、お師匠さまをさらいに来させた。俺がそいつを倒しに行く時、沙悟浄にお師匠さまを見ているよう言ったんだ。ところが今は、沙悟浄までいない。」
      八戒は笑った。八戒「沙悟浄が、お師匠さまをどこかへ便所に連れていったんだろ。」
      言い終わらぬうちに、沙悟浄がやってきた。
      悟空「沙悟浄、お師匠さまはどこへ行った？」
      沙悟浄「二人とも目がくらんで、妖怪を逃がしてお師匠さまをさらいに来させたんですよ。私はそいつを倒しに行ったんです。お師匠さまはお一人で馬に乗っておられました。」
      悟空は腹を立てて跳びはねた。悟空「奴の策にはまった！　はまったんだ！」
      沙悟浄「どんな策です？」
      悟空「分瓣梅花の計（ぶんべんばいかのけい）だ。俺たち兄弟を花びらのように引き離し、真ん中からお師匠さまをさらっていったんだ。ああ、ああ、ああ、どうすればいい！」
      頬を伝う涙を止められなかった。
      八戒「泣くなよ。泣いたら意気地なしになっちまう。どのみち遠くじゃない、この山の中にいるんだ。探しに行こう。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-003"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人沒計奈何，只得入山找尋。行了有二十里遠近，只見那懸崖之下，有一座洞府："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 124
        "line_end": 124
    "translation_ja": "三人にはほかに手もなく、山の中へ入って捜すしかなかった。二十里（り）ほど進むと、切り立った崖の下に、一つの洞府が見えた。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-004"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": "削峰掩映，怪石嵯峨。奇花瑤草馨香，紅杏碧桃豔麗。崖前古樹，霜皮溜雨四十圍；門外蒼松，黛色參天二千尺。雙雙野鶴，常來洞口舞清風；對對山禽，每向枝頭啼白晝。簇簇黃藤如掛索，行行煙柳似垂金。方塘積水，深穴依山。方塘積水，隱窮鱗未變的蛟龍；深穴依山，住多年吃人的老怪。果然不亞神仙境，真是藏風聚氣巢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      削ぎ落としたような峰が見え隠れし、異様な岩が高々とそびえる。
      珍しい花と美しい草は香り、紅い杏と碧桃（へきとう）は艶やかに咲く。
      崖前の古木は幹まわり四十囲（い）、霜めいた樹皮を雨が伝い、
      門外の蒼い松は高さ二千尺（しゃく）、黒緑の色を空へ突き上げる。
      つがいの野鶴はしばしば洞口へ来て、清風に舞い、
      つがいの山鳥はいつも枝先で、昼の光に鳴く。
      群がる黄色い藤は縄を掛けたよう、列なす霞んだ柳は金を垂らすよう。
      四角い池には水がたまり、深い洞穴は山に寄り添う。
      水をたたえた四角い池には、まだ姿を変えぬ不遇の蛟竜（こうりゅう）が潜み、
      山に寄り添う深い洞穴には、長年人を食ってきた妖怪が住む。
      まことに神仙（しんせん）の境にも劣らず、風を遮り気を集める巣である。
    "translation_status": "reviewed"
  - "id": "xy-ch86-005"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見了，兩三步跳到門前看處，那石門緊閉，門上橫安著一塊石版，石版上有八個大字，乃「隱霧山折岳連環洞」。行者道：「八戒，動手啊。此間乃妖精住處，師父必在他家也。」那獃子仗勢行兇，舉釘鈀盡力築將去，把他那石頭門築了一個大窟窿，叫道：「妖怪，快送出我師父來，免得釘鈀築倒門，一家子都是了帳。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      悟空はそれを見ると、二、三歩で門前へ跳んだ。よく見ると石門は固く閉まり、その上に石板が一枚、横に渡してある。石板には八つの大きな文字、「隠霧山（いんむざん）折岳連環洞（せつがくれんかんどう）」と書かれていた。
      悟空「八戒、やれ！　ここが妖怪の住みかだ。お師匠さまは、きっとこの中にいる。」
      八戒は後ろ盾があるのをいいことに荒れ狂い、熊手を振り上げ、力いっぱい突き下ろした。石門に大穴を開けて叫んだ。
      八戒「妖怪め、早くお師匠さまを返せ！　でないと熊手で門をぶち倒し、一家残らずおしまいにしてやるぞ！」
    "translation_status": "reviewed"
  - "id": "xy-ch86-006"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "守門的小妖急急跑入報道：「大王，闖出禍來了。」老怪道：「有甚禍？」小妖道：「門前有人把門打破，嚷道要師父哩！」老怪大驚道：「不知是那個尋將來也？」先鋒道：「莫怕，等我出去看看。」那小妖奔至前門，從那打破的窟窿處，歪著頭，往外張，見是個長嘴大耳朵，即回頭高叫：「大王莫怕他，這是個豬八戒，沒甚本事，不敢無理。他若無理，開了門，拿他進來湊蒸。怕便只怕那毛臉雷公嘴的和尚。」八戒在外邊聽見道：「哥啊，他不怕我，只怕你哩。師父定在他家了，你快上前。」行者罵道：「潑孽畜，你孫外公在這裡，送我師父出來，饒你命罷。」先鋒道：「大王，不好了，孫行者也尋將來了。」老怪報怨道：「都是你定的甚麼『分瓣分瓣』，卻惹得禍事臨門。怎生結果？」先鋒道：「大王放心，且休埋怨。我記得孫行者是個寬洪海量的猴頭，雖則他神通廣大，卻好奉承。我們拿個假人頭出去哄他一哄，奉承他幾句，只說他師父是我們吃了。若還哄得他去了，唐僧還是我們受用；哄不過，再作理會。」老怪道：「那裡得個假人頭？」先鋒道：「等我做一個兒看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      門番の小妖が慌てて中へ駆け込み、報告した。
      門番の小妖「大王、大変なことになりました！」
      妖怪の頭目「何が大変なのだ？」
      門番の小妖「門の前に来た者が門を壊し、師匠を返せとわめいております！」
      頭目は仰天した。妖怪の頭目「いったい、誰が捜し当てたのだ？」
      先鋒「ご心配なく。私が見てまいります。」
      先鋒は正面の門へ駆けていき、壊れた穴に首を傾けて、外をのぞいた。長い口と大きな耳が見える。振り返って大声で言った。
      先鋒「大王、ご心配はいりません。猪八戒（ちょはっかい）です。大した腕もなく、無茶はできますまい。もし無茶をしたら門を開け、捕まえて中へ入れ、一緒に蒸してしまいましょう。恐ろしいのは、あの毛むくじゃらで雷神のような口をした坊主だけです。」
      外で聞いた八戒が言った。八戒「兄貴、奴は俺なんか怖くなくて、兄貴だけが怖いんだってよ。お師匠さまはきっと中だ。早く前へ出てくれ。」
      悟空は罵った。悟空「ろくでなしの畜生め！　お前の母方のじいさま、この孫（そん）さまがここにいるぞ。お師匠さまを出せ、そうすれば命だけは助けてやる！」
      先鋒「大王、いけません。孫行者（そんぎょうじゃ）まで捜し当てて来ました。」
      頭目は恨み言を言った。妖怪の頭目「何が花びらだ、花びらだ。お前の決めた策のせいで、災いが門前まで来たではないか。どう片をつける？」
      先鋒「大王、ご安心を。今はお責めにならないでください。私の覚えでは、孫行者は度量の広い猿です。神通力は並外れていますが、おだてに弱い。偽物の生首を持っていって、ひとつだましてやりましょう。何言か持ち上げて、師匠は食ってしまったとだけ言うのです。うまくだまして帰らせられれば、唐僧（とうそう）はやはり私どものごちそう。だませなければ、その時にまた考えましょう。」
      妖怪の頭目「偽物の生首を、どこから持ってくるのだ？」
      先鋒「私が一つ作ってご覧に入れます。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-007"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好妖怪，將一把衠鋼刀斧，把柳樹根砍做個人頭模樣，噴上些人血，糊糊塗塗的，著一個小怪，使漆盤兒拿至門下，叫道：「大聖爺爺，息怒容稟。」孫行者果好奉承，聽見叫聲「大聖爺爺」，便就止住八戒：「且莫動手，看他有甚話說。」拿盤的小怪道：「你師父被我大王拿進洞來，洞裡小妖村頑，不識好歹，這個來吞，那個來啃，抓的抓，咬的咬，把你師父吃了，只剩了一個頭在這裡也。」行者道：「既吃了便罷，只拿出人頭來，我看是真是假。」那小怪從門窟裡拋出那個頭來。豬八戒見了就哭道：「可憐啊！那們個師父進去，弄做這們個師父出來也。」行者道：「獃子，你且認認是真是假，就哭。」八戒道：「不羞，人頭有個真假的？」行者道：「這是個假人頭。」八戒道：「怎認得是假？」行者道：「真人頭拋出來，撲搭不響；假人頭拋得像梆子聲。你不信，等我拋了你聽。」拿起來往石頭上一摜，噹的一聲響亮。沙和尚道：「哥哥，響哩。」行者道：「響便是個假的。我教他現出本相來你看。」急掣金箍棒，撲的一下打破了。八戒看時，乃是個柳樹根。獃子忍不住罵起來道：「我把你這夥毛團！你將我師父藏在洞裡，拿個柳樹根哄你豬祖宗，莫成我師父是柳樹精變的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 129

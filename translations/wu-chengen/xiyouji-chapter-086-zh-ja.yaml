    "origin": "source"
    "source_text": "這大聖與八戒急退幾步，到那山場平處，抵住群妖，喝道：「那個是出名的頭兒？那個是拿我師父的妖怪？」那群妖扎下營盤，將一面錦繡花旗閃一閃，老怪持鐵杵，應聲高呼道：「那潑和尚，你認不得我？我乃南山大王，數百年放蕩於此。你唐僧已是我拿吃了，你敢如何？」行者罵道：「這個大膽的毛團！你能有多少的年紀，敢稱『南山』二字？李老君乃開天闢地之祖，尚坐於太清之右；佛如來是治世之尊，還坐於大鵬之下；孔聖人是儒教之尊，亦僅呼為『夫子』。你這個孽畜，敢稱甚麼『南山大王』，數百年之放蕩。不要走，吃你外公老爺一棒。」那妖精側身閃過，使杵抵住鐵棒，睜圓眼問道：「你這嘴臉像個猴兒模樣，敢將許多言語壓我？你有甚麼手段，在吾門下猖狂？」行者笑道：「我把你個無名的孽畜！是也不知老孫。你站住，硬著膽，且聽我說："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      悟空と八戒は急いで数歩退き、山中の平地へ出て妖怪の群れに立ち向かった。
      悟空と八戒「名のある親玉はどいつだ？　俺たちのお師匠さまを捕らえた妖怪はどいつだ？」
      妖怪たちは陣を敷き、錦に美しい刺繡をした旗をひらめかせた。頭目は鉄の杵を手に、応じて大声を張り上げた。
      妖怪の頭目「無礼な坊主め、わしが分からぬか！　わしこそ南山大王（なんざんだいおう）。数百年もの間、ここで思うままに暮らしてきた。唐僧は、もうわしが捕らえて食ってしまったぞ。どうするつもりだ？」
      悟空は罵った。悟空「大それた毛玉め！　いったい幾つ生きたというんだ、『南山（なんざん）』の二字を名乗るとは！　李老君（りろうくん）は天地を開いた祖なのに、なお太清（たいせい）の右に座る。如来仏（にょらいぶつ）は世を治める尊いお方なのに、なお大鵬（たいほう）の下に座る。聖人の孔子（こうし）は儒教で最も尊い方なのに、ただ『夫子（ふうし）』と呼ばれるだけだ。それをお前のような畜生が、何が『南山大王』だ、数百年好き勝手に暮らしただと！　逃げるな。この母方のじいさまの棒を食らえ！」
      南山大王は身をそらしてかわし、杵で鉄棒を受け止め、目を丸くして尋ねた。
      南山大王「その顔は猿のようだな。よくもあれこれ並べ立てて、わしを圧倒しようとするものだ。どんな腕があって、わしの門前で暴れる？」
      悟空は笑った。悟空「名もない畜生め！　やはり、この俺を知らないな。そこを動くな。肝を据えて聞いていろ。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-012"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      祖居東勝大神洲，天地包含幾萬秋。
      花果山頭仙石卵，卵開產化我根苗。
      生來不比凡胎類，聖體原從日月儔。
      本性自修非小可，天姿穎悟大丹頭。
      官封大聖居雲府，倚勢行兇鬥斗牛。
      十萬神兵難近我，滿天星宿易為收。
      名揚宇宙方方曉，智貫乾坤處處留。
      今幸皈依從釋教，扶持長老向西遊。
      逢山開路無人阻，遇水支橋有怪愁。
      林內施威擒虎豹，崖前復手捉貔貅。
      東方果正來西域，那個妖邪敢出頭？
      孽畜傷師真可恨，管教時下命將休。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 134
        "line_end": 145
    "translation_ja": |-
      悟空「俺の生まれは東勝大神洲（とうしょうだいしんしゅう）、天地に抱かれて幾万年。
      花果山（かかざん）の仙石の卵、それが割れて俺の命の根となった。
      生まれながらに凡人の胎とは違い、この聖なる体はもとより日月の仲間。
      本性を自ら修めた力は並でなく、生まれつき利発で、大丹（だいたん）のもとを備える。
      大聖に任ぜられ、雲の御殿に住み、勢いに任せて斗牛（とぎゅう）の天で暴れ戦った。
      十万の神兵も俺には近づけず、満天の星の神もたやすく取り押さえる。
      名は宇宙にとどろき、どの方角でも知られ、知恵は天地を貫き、至る所に跡を残す。
      今は幸いにも仏教に帰依し、長老を助けて西へ旅する。
      山に会えば道を開き、誰にも阻まれず、水に会えば橋を架け、妖怪を嘆かせる。
      林の中では威を振るい虎や豹を捕らえ、崖の前では手を返して貔貅（ひきゅう）を捕らえる。
      東方で正しい道を修め、西域（さいいき）へ来たこの俺に、どこの妖邪が顔を出せよう？
      畜生、お師匠さまを害した恨みは深い。今すぐお前の命を終わらせてやる！」
    "translation_status": "reviewed"

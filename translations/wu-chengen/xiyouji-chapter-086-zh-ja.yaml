      "gloss_ja": "破れた衣の名に掛けて詠まれる野菜の古名。破破衲という表記もあるが、底本の納を保持する。"
    - "entry_id": "xy-ch86-kumatai"
      "form_id": "xy-ch86-kumatai-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 432
        "end": 435
        "exact": "苦麻台"
      "rendered_text": "苦麻台（くまだい）"
      "gloss_ja": "苦麻臺とも記された野菜の古名。苦い菜と解されるが、種や句の構文は留保する。"
    - "entry_id": "xy-ch86-fanli"
      "form_id": "xy-ch86-fanli-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 446
        "end": 448
        "exact": "藩籬"
      "rendered_text": "藩籬（はんり）"
      "gloss_ja": "野菜を列挙する句で垣根の意味と重ねられる呼称。籓籬頭等との関係と語の切り方は留保する。"
    - "entry_id": "xy-ch86-queermiandan"
      "form_id": "xy-ch86-queermiandan-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 460
        "end": 464
        "exact": "雀児綿単"
      "rendered_text": "雀児綿単（じゃくじめんたん）"
      "gloss_ja": "地を覆って生える様子を雀の敷物や夜具に見立てた名を持つ野菜の古名。現代の種は未確定。"
    - "entry_id": "xy-ch86-husunjiaoji"
      "form_id": "xy-ch86-husunjiaoji-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 475
        "end": 479
        "exact": "猢猻脚跡"
      "rendered_text": "猢猻脚跡（こそんきゃくせき）"
      "gloss_ja": "猿の足跡という名を持つ野菜の古名。現代の種は未確定。"
    - "entry_id": "xy-ch86-youzhuozhuo"
      "form_id": "xy-ch86-youzhuozhuo-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 490
        "end": 493
        "exact": "油灼灼"
      "rendered_text": "油灼灼（ゆしゃくしゃく）"
      "gloss_ja": "古い野菜の名。油で焼くという調理の言葉にも重なる呼称。"
    - "entry_id": "xy-ch86-xiehao"
      "form_id": "xy-ch86-xiehao-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 516
        "end": 518
        "exact": "斜蒿"
      "rendered_text": "斜蒿（しゃこう）"
      "gloss_ja": "蒿の字を持つ野菜の古名。ほかの蒿類と同一の種とは断定しない。"
    - "entry_id": "xy-ch86-qinghao"
      "form_id": "xy-ch86-qinghao-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 525
        "end": 527
        "exact": "青蒿"
      "rendered_text": "青蒿（せいこう）"
      "gloss_ja": "蒿の類に関わる古い植物名。歴史上の呼称の幅があり、野菜としての個別種は限定しない。"
    - "entry_id": "xy-ch86-baonianghao"
      "form_id": "xy-ch86-baonianghao-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 534
        "end": 537
        "exact": "抱娘蒿"
      "rendered_text": "抱娘蒿（ほうじょうこう）"
      "gloss_ja": "母を抱く蒿という名を持つ野菜の古名。現代の種は未確定。"
    - "entry_id": "xy-ch86-dengerzi"
      "form_id": "xy-ch86-dengerzi-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 547
        "end": 550
        "exact": "灯蛾児"
      "rendered_text": "灯蛾児（とうがじ）"
      "gloss_ja": "灯に飛ぶ蛾を思わせる名を持つ野菜の古名。詩では蛾が飛ぶ像に重ねられる。"
    - "entry_id": "xy-ch86-banqiaoqiao"
      "form_id": "xy-ch86-banqiaoqiao-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 557
        "end": 560
        "exact": "板蕎蕎"
      "rendered_text": "板蕎蕎（ばんきょうきょう）"
      "gloss_ja": "中国の野菜の古名。板翹翹などの近い名との関係と個別種は留保する。"
    - "entry_id": "xy-ch86-yangertu"
      "form_id": "xy-ch86-yangertu-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 580
        "end": 583
        "exact": "羊耳禿"
      "rendered_text": "羊耳禿（ようじとく）"
      "gloss_ja": "羊の耳という字面を持つ野菜の古名。現代の種は未確定。"
    - "entry_id": "xy-ch86-gouqitou"
      "form_id": "xy-ch86-gouqitou-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 591
        "end": 594
        "exact": "枸杞頭"
      "rendered_text": "枸杞頭（くことう）"
      "gloss_ja": "クコ類の若い芽や葉を食用にする呼称。具体的な種は限定しない。"
    - "entry_id": "xy-ch86-wulan"
      "form_id": "xy-ch86-wulan-form"
      "segment_id": "xy-ch86-031"
      "translation_span":
        "start": 604
        "end": 606
        "exact": "烏藍"
      "rendered_text": "烏藍（うらん）"
      "gloss_ja": "中国の野菜の古名。底本の表記を保持し、現代の種は未確定。"
    - "entry_id": "xy-entry-0845"
      "form_id": "xy-form-0969"
      "segment_id": "xy-ch86-033"
      "translation_span":
        "start": 86
        "end": 88
        "exact": "三蔵"
      "rendered_text": "三蔵（さんぞう）"
      "gloss_ja": "仏教の教えを三つの部門にまとめた経典。人物の名前とは別の意味。"
    - "entry_id": "xy-entry-1380"
      "form_id": "xy-form-1590"
      "segment_id": "xy-ch86-033"
      "translation_span":
        "start": 104
        "end": 106
        "exact": "九霄"
      "rendered_text": "九霄（きゅうしょう）"
      "gloss_ja": "天の高みをいう古い呼び名。"
    - "entry_id": "xy-entry-0818"
      "form_id": "xy-form-1588"

  - "id": "xy-ch86-028"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      石徑重漫苔蘚，柴門蓬絡藤花。
      四面山光連接，一林鳥雀諠譁。
      密密松篁交翠，紛紛異卉奇葩。
      地僻雲深之處，竹籬茅舍人家。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 170
        "line_end": 173
    "translation_ja": |-
      石の小道には苔が厚く広がり、柴の門には藤の花が絡みつく。
      四方には山の景色が連なり、一つの林では鳥たちがにぎやかに鳴く。
      松と竹は密に茂って緑を交え、珍しい草花が入り乱れて咲く。
      人里離れた雲の深い所に、竹垣をめぐらせた茅葺きの家がある。
    "translation_status": "reviewed"
  - "id": "xy-ch86-029"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "遠見一個老嫗倚著柴扉，眼淚汪汪的，兒天兒地的痛哭。這樵子看見自家母親，丟了長老，急忙忙先跑到柴扉前，跪下叫道：「母親，兒來也。」老嫗一把抱住道：「兒啊，你這幾日不來家，我只說是山主拿你去，害了性命，是我心疼難忍。你既不曾被害，何以今日才來？你繩擔、柯斧俱在何處？」樵子叩頭道：「母親，兒已被山主拿去，綁在樹上，實是難得性命，幸虧這幾位老爺。這老爺是東土唐朝往西天取經的羅漢。那老爺倒也被山主拿去綁在樹上。他那三位徒弟老爺神通廣大，把山主一頓打死。卻是個艾葉花皮豹子精；概眾小妖，俱盡燒死，卻將那老老爺解下救出，連孩兒都解救出來。此誠天高地厚之恩。不是他們，孩兒也死無疑了。如今山上太平，孩兒徹夜行走，也無事矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      遠くから、一人の老婆が柴の門にもたれ、涙をいっぱいにためて、息子よ、天よ、地よと泣き叫んでいるのが見えた。木こりは自分の母を見ると、三蔵を後に残し、急いで先に門まで走り、ひざまずいて呼んだ。
      木こり「母さん、帰ってきました！」
      母は息子をひしと抱いた。
      母「お前、何日も帰ってこないものだから、山の主に捕まって殺されたと思っていたよ。胸が痛くて、たまらなかった。殺されていなかったなら、どうして今日まで帰らなかったんだい。縄と担ぎ棒と斧は、どこにあるの？」
      木こりは額を地につけた。
      木こり「母さん、私は山の主に捕まって、木に縛られていたんです。本当に命は助かりそうもありませんでしたが、この方たちのおかげで救われました。こちらの方は、東土の唐（とう）から西天（さいてん）へ経を取りに行く羅漢（らかん）さまです。あの長老さまも、山の主に捕まって木に縛られましたが、三人のお弟子さまには広大な神通力があって、山の主を打ち殺したのです。その正体は、ヨモギの葉のような斑紋の皮をした豹の妖怪でした。小妖どもも残らず焼き殺し、あの大長老さまの縄をほどいて助け出し、私まで助けてくださいました。天より高く、地より厚いご恩です。この方たちがいなければ、私も間違いなく死んでいました。もう山は平穏ですから、夜通し歩いても何の心配もありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-030"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老嫗聽言，一步一拜，拜接長老四眾，都入柴扉茅舍中坐下。娘兒兩個磕頭稱謝不盡，慌慌忙忙的安排些素齋酬謝。八戒道：「樵哥，我知你府上也寒薄，只可將就一飯，切莫費心大擺佈。」樵子道：「不瞞老爺說，我這山間實是寒薄，沒甚麼香蕈、蘑菰、川椒、大料，只是幾品野菜奉獻老爺，權表寸心。」八戒笑道：「聒噪，聒噪。放快些兒就是，我們肚中饑了。」樵子道：「就有，就有。」果然不多時，展抹桌凳，擺將上來，果是幾盤野菜。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      母は話を聞くと、一歩進むごとに拝み、三蔵たち四人を迎え入れた。皆が柴の門をくぐり、茅葺きの家に入って座ると、母子は何度も額を地につけ、尽きることなく礼を述べた。そして慌ただしく精進料理を用意し、恩に報いようとした。
      八戒「木こりの兄さん、あんたの家が豊かじゃないことは分かってる。あり合わせの飯でいいから、気を遣って大げさな支度なんかするなよ。」
      木こり「正直に申しますと、この山の暮らしは本当に貧しく、香蕈（こうしん）も蘑菰（まこ）も、川椒（せんしょう）も大料もございません。ただ何品かの野の菜をお出しして、せめて心ばかりのお礼にしたいと思います。」
      八戒は笑った。八戒「ご面倒、ご面倒。早く出してくれさえすりゃいいんだ。俺たちは腹が減ったよ。」
      木こり「すぐに、すぐにございます。」
      ほどなく卓と腰掛けを拭き、料理を並べた。なるほど、いく皿かの野の菜だった。見ると、こんな品々である。
    "translation_status": "reviewed"
  - "id": "xy-ch86-031"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": "嫩焯黃花菜，酸虀白鼓丁。浮薔馬齒莧，江薺雁腸英。燕子不來香且嫩，芽兒拳小脆還青。爛煮馬藍頭，白熝狗腳跡。貓耳朵，野落蓽，灰條熟爛能中吃；剪刀股，牛塘利，倒灌窩螺操帚薺；碎米薺，萵菜薺，幾品青香又滑膩。油炒烏英花，菱科甚可誇。蒲根菜並茭兒菜，四般近水實清華。看麥娘，嬌且佳；破破納，不穿他。苦麻臺下藩籬架。雀兒綿單，猢猻腳跡，油灼灼煎來只好吃。斜蒿青蒿抱娘蒿，燈蛾兒飛上板蕎蕎。羊耳禿，枸杞頭，加上烏藍不用油。幾般野菜一餐飯，樵子虔心為謝酬。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      柔らかく湯がいた黄花菜（こうかさい）、酸っぱい和え物の白鼓丁（はくこてい）。
      浮薔（ふしょう）と馬歯莧（ばしけん）、江薺（こうせい）と雁腸英（がんちょうえい）。
      燕子不来香（えんしふらいこう）は香りよく柔らかく、芽児拳（がじけん）は小さく、しゃきっとして青い。
      馬藍頭（ばらんとう）はくたくたに煮て、狗脚跡（くきゃくせき）は白く茹で上げる。
      猫耳朶（びょうじだ）、野落蓽（やらくひつ）、灰条（かいじょう）はよく煮れば口に合う。
      剪刀股（せんとうこ）、牛塘利（ぎゅうとうり）、倒灌（とうかん）、窩螺（から）、操帚薺（そうしゅうせい）。
      砕米薺（さいべいせい）、萵菜薺（わさいせい）、どれも青い香りに、つるりとなめらか。
      油で炒めた烏英花（うえいか）、菱科（りょうか）もほめるに値する。
      蒲根菜（ほこんさい）と茭児菜（こうじさい）、この四つの水辺の菜は実に清らかで美しい。
      看麦娘（かんばくじょう）は愛らしくて上等、破破納（ははのう）は破れ衣の名でも、身には着ない。
      苦麻台（くまだい）の下には、藩籬（はんり）が垣を組む。
      雀児綿単（じゃくじめんたん）、猢猻脚跡（こそんきゃくせき）、油灼灼（ゆしゃくしゃく）も、焼けばただただうまい。
      斜蒿（しゃこう）、青蒿（せいこう）、抱娘蒿（ほうじょうこう）、灯蛾児（とうがじ）は板蕎蕎（ばんきょうきょう）の上へ飛び上がる。
      羊耳禿（ようじとく）、枸杞頭（くことう）、それに烏藍（うらん）を足せば油もいらぬ。
      いく種類もの野の菜で一食の膳、木こりがまごころ込めて恩に報いる。
    "translation_status": "reviewed"
  - "id": "xy-ch86-032"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們飽餐一頓，收拾起程。那樵子不敢久留，請母親出來再拜，再謝。樵子只是磕頭，取了一條棗木棍，結束了衣裙，出門相送。沙僧牽馬，八戒挑擔，行者緊隨左右，長老在馬上拱手道：「樵哥，煩先引路，到大路上相別。」一齊登高下阪，轉澗尋坡。長老在馬上思量道：「徒弟啊，"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      師弟は腹いっぱい食べ、出立の支度をした。木こりは長く引き止めることは遠慮し、母を呼び出して、もう一度拝み、礼を言った。自分もただ繰り返し額を地につけ、それからナツメの木の棒を一本取り、衣をきちんと締めて、門を出て見送りに立った。沙悟浄が馬を引き、八戒が荷を担ぎ、悟空はすぐ左右に付き添った。三蔵は馬の上から両手を胸の前に重ねて礼をした。
      三蔵「木こりの兄さん、すみませんが先に立って道を案内してください。大きな道へ出た所で、お別れしましょう。」
      一同は高みに登り、坂を下り、谷川を回って斜面の道を探した。三蔵は馬上で思いを巡らせ、口にした。
      三蔵「お前たちよ、」
    "translation_status": "reviewed"
  - "id": "xy-ch86-033"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      自從別主來西域，遞遞迢迢去路遙。
      水水山山災不脫，妖妖怪怪命難逃。
      心心只為經三藏，念念仍求上九霄。
      碌碌勞勞何日了，幾時行滿轉唐朝？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 181
        "line_end": 184
    "translation_ja": |-
      三蔵「主君に別れ、西域へ来てから、次々と道をたどって、行く手は遥か。
      水また水、山また山、災いから逃れられず、妖また妖、怪また怪、命を保つのも難しい。
      ひたすら心にあるのは三蔵（さんぞう）の経、念じ続けるのは九霄（きゅうしょう）へ上ること。
      あくせくと労苦する日々は、いつ終わるのか。いつ修行を満たし、唐へ帰れるのか。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-034"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "樵子聞言道：「老爺切莫憂思。這條大路，向西方不滿千里，就是天竺國，極樂之鄉也。」長老聞言，翻身下馬道：「有勞遠涉。既是大路，請樵哥回府，多多拜上令堂老安人：適間厚擾盛齋，貧僧無甚相謝，只是早晚誦經，保佑你母子平安，百年長壽。」那樵子喏喏相辭，復回本路。師徒遂一直投西。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 186
        "line_end": 186
    "translation_ja": |-
      聞いた木こりが言った。
      木こり「長老さま、どうか思い悩まないでください。この大きな道を西へ行けば、千里もしないうちに天竺国（てんじくこく）です。極楽の里でございます。」
      三蔵はそれを聞くと、馬から下りた。
      三蔵「遠くまでお送りくださり、ありがとうございます。もう大きな道ですから、どうぞお帰りください。お母上にも、くれぐれもよろしくお伝えください。先ほどは、立派な食事をたくさんごちそうになりました。私には何もお礼に差し上げるものがありませんが、朝夕に経を唱え、あなた方母子が安らかに、百年の長寿を保たれるよう祈ります。」
      木こりは繰り返し礼をして別れ、来た道を戻った。師弟はまっすぐ西へ向かった。まことに、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch86-035"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": "降怪解冤離苦厄，受恩上路用心行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 188
        "line_end": 188
    "translation_ja": |-
      妖怪を降し、恨みを解いて苦難を離れ、
      恩を受けて旅路へ戻り、心を込めて歩み続ける。
    "translation_status": "reviewed"
  - "id": "xy-ch86-036"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知還有幾日得到西天，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 190
        "line_end": 190
    "translation_ja": "さて、西天に着くまで、あと幾日かかるのだろうか。それは次回のお話。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-01-body"

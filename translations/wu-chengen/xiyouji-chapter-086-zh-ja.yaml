    "source_languages": []
    "source_locations": []
    "translation_ja": "李老君・太清・如来仏・大鵬・孔子を並べて相手の大言を責めるのは、悟空の論法である。李老君と太清の位置関係や右・下という座の表現を、教理上の体系に合わせて直していない。大鵬は、如来の頭上に据えられた既知の妖王を踏まえると読んだ。一般の霊鳥や悟空の義兄弟の鵬魔王とは分ける。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-12-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "固定版は鬥斗牛で、最初の鬥は戦う動詞、後の斗牛は斗宿・牛宿を通じて天界を表す語と解した。現在の繁体変換表示の鬥鬥牛に置き換えず、取得した固定版の文字を残している。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-13-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の東方果正は、東方で正しい修行の成果を得たという趣旨で暫定的に採った。句の語順と果正の細かな解釈には留保があり、別版へ無断校訂していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-14-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "妖怪が豹であることを語り手が初めて明示する箇所。名乗りの段階では種を補わず、この詩の語も通常の話者名へ機械的に置き換えなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-15-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "固定版は南禺で、通常の号の南山とは字が異なる。同じ戦闘の頭目を指す語として接続するが、原字の禺を山へ訂正していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-16-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の九孔は身体の九つの孔をいう表現。残酷な殺傷描写を省略せず、孔の内訳は原文にないため列挙していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-17-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "纏長と腳多は、蛇の長い体と蟹の多い足に、出家者への小言を重ねる冗談として訳した。纏長には長く絡みつく感じがあるが、別の固有の教義や、原文にない動機へは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-18-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "蟻を詠んだ賦の藏修・鬥仙機は、仙術的な修行や巧みさを虫に重ねた表現。壘積塵多遂作灰の灰は、積もる土の見た目と解したが、具体的な習性の同定は留保する。現代の昆虫学上の事実を保証する訳ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-19-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "小妖は八戒・悟空・沙悟浄の三人が墓で泣いていると報告するが、この時点の悟空は洞へ入り、その報告を聞いている。過去に見たことの報告か時系列の揺れかを一方に確定せず、報告の人名と叙述順を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-20-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "面前有人は、目の前に人がいることを警戒する言葉。誰をどのように疑うのかまでは明示されていないため、囚人が内通者である等の事情は補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-21-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで小妖は假人頭と言う。先に埋めたのは本物の人の頭で、三蔵の頭ではない。木の偽物を埋めたことに修正せず、人物の言葉にある假を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-22-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "復三は葬ってから三日目に墓を訪れる習俗として採った。今日・明日・明後日の三段階は小妖の予測であり、実際に三日過ぎたとの語りではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-23-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "双掭灯は二つの灯芯をかき立てるような比喩と解し、眠らせる虫を左右へ増す場面に対応させた。最初の一つかみの毛、続く一本の毛、二匹の虫という数量を原文どおり残し、変化の仕組みを整合させる補足はしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-24-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "前の回で木こりは三日間捕まっていると話したが、三蔵はここで自分より一日先と述べる。前後の日数をそろえず、各人の発言を保った。木こりは読者には前の回ですでに身元が判明している。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-25-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "頭を出してごまかしたから自分が助かったというのは三蔵の推量である。妖怪の計画を語り手が確認した事実へ変えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-26-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "八戒の舉鈀就築を直後の制止へつながる動作として訳した。ここでは打撃の命中や死亡を明記しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-27-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の莫想有半個得命は、半人さえも命を取り留められないという徹底した表現。小妖の焼死と洞の焼失を、ただ逃散したという話へ弱めていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-28-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "斑の豹が虎を食うというのは悟空の言葉である。物語内の猛獣観として残し、現代の動物学上の性質と保証しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-29-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は長老を主語としながら、與樵子並四衆同行と続ける。四衆は師弟一行の呼称として扱い、三蔵以外に四人の僧が増えたことにはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-30-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "木こりは、三人の弟子が山の主を打ち殺し小妖を焼いたと母へまとめて語る。個々の実行者や順序を、直前の地の文と同じになるよう書き換えていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-31-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文が別々に挙げる茸二種と香辛料二種を保った。香蕈は香りのよい食用茸、蘑菰も食用茸の呼び名で、特定の近代的な種分類へ機械的に置き換えていない。川椒は山椒類、大料は八角などの強い香味料として解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-32-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この賦には、野菜の古い地方名と、その名を普通の言葉に重ねる洒落が並ぶ。王磐『野菜譜』を収録する『農政全書』等の検索表示に燕子不來香・芽兒拳・猫耳朶・破破衲・猢猻脚跡・倒灌薺・烏英等を確認したが、その『農政全書』ページの直接取得には成功していない。一方、別の公開『野菜譜』の燕子不來香の項と『古今図書集成』所収の雀兒綿單の項は表示本文を直接確認した。前者は燕が来る前の香り、後者は地を覆う菜を雀の敷物・夜具に見立てる名と解した。底本の野落蓽・操帚薺・破破納などを別資料の字へ直さず、倒灌・窩螺・操帚薺の切り方や苦麻臺下藩籬架の構文にも留保を残した。油灼灼も菜名を含む語として保持。原文の四般という数も維持した。名前だけから現代の植物種を一律に断定しない。これは古典の食事描写であり、現代の野草採食案内ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-33-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここでの經三藏は人物の三蔵ではなく、求める経典の三蔵。名の三蔵と別の語義として登録し、同形でも混同しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-34-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は思量道と内心を思わせる語を置くが、続く木こりは聞言として応答する。馬上で思いを巡らせて口にした言葉と解し、音声と内心の境目にある揺れを記録する。"
    "translation_status": "reviewed"

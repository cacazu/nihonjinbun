    "translation_ja": "原文の藏風聚氣は、風を避けて気を蓄えるよい地勢をいう風水の言葉。洞府を神仙の境にたとえつつ、人食いの妖怪が住むという対照を残した。特定の山や現代地理へ同定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-04-body"
    "section_id": "chapter-86"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の那小妖は、直前に自分が見に行くと言った先鋒を受けると解した。門番の報告者と先鋒を混同しない。先鋒は前の回で任命された策士である。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-note-05-body"
    "section_id": "chapter-86"
    "kind": "note_body"

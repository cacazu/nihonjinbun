    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪聞言，又驚又恨，咬著牙，跳近前來，使鐵杵望行者就打。行者輕輕的用棒架住，還要與他講話，那八戒忍不住，掣鈀亂築那怪的先鋒。先鋒帥眾齊來。這一場在山中平地處混戰，真是好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 147
        "line_end": 147
    "translation_ja": "南山大王は聞くと、驚きと憎しみに歯を食いしばり、前へ跳びかかって鉄の杵を悟空に振り下ろした。悟空は棒で軽々と受け止め、なおも話しかけようとしたが、八戒はこらえきれず、熊手を抜いて先鋒めがけてやたらに突きかかった。先鋒も群れを率いて一斉にかかってきた。山の平地で入り乱れたこの一戦、まことに激しい戦いである。"
    "translation_status": "reviewed"
  - "id": "xy-ch86-014"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": "東土大邦上國僧，西方極樂取真經。南山大豹噴風霧，路阻深山獨顯能。施巧計，弄乖伶，無知誤捉大唐僧。相逢行者神通廣，更遭八戒有聲名。群妖混戰山平處，塵土紛飛天不清。那陣上小妖呼哮，槍刀亂舉；這壁廂神僧叱喝，鈀棒齊興。大聖英雄無敵手，悟能精壯喜夯來。南禺老怪，部下先鋒，都為唐僧一塊肉，致令捨死又忘生。這兩個因師性命成仇隙，那兩個為要唐僧忒惡情。往來鬥經多半會，沖衝撞撞沒輸贏。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      東土（とうど）の大国、尊い国の僧が、西方極楽へ真の経を取りに行く。
      南山の大豹は風と霧を吐き、深山で道をふさいで力を誇る。
      巧みな策を施し、利口ぶって手を回し、物を知らずに大唐（だいとう）の僧を捕らえた。
      出会った悟空の神通力は広大、そのうえ名高い八戒もいる。
      群妖は山の平地で入り乱れ、飛び立つ土煙に空も濁る。
      あちらの陣では小妖どもが吠えたけり、槍と刀を乱れ振り、
      こちらでは神通ある僧が叱りつけ、熊手と棒を一斉に振るう。
      悟空は比類なき英雄、八戒はたくましく、打ちかかるのを好む。
      南禺（なんぐ）の妖怪の頭目と、その部下の先鋒、
      二人とも唐僧の肉を一切れ欲しさに、死を顧みず、命も忘れる。
      こちらの二人は師の命ゆえに恨みを結び、あちらの二人は唐僧欲しさにひどく悪辣。
      行きつ戻りつ長いこと戦い、突き当たりぶつかり合って、勝負はつかない。
    "translation_status": "reviewed"
  - "id": "xy-ch86-015"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖見那些小妖勇猛，連打不退，即使個分身法，把毫毛拔下一把，嚼在口中，噴出去，叫聲：「變！」都變做本身模樣，一個使一條金箍棒，從前邊往裡打進。那一二百個小妖顧前不能顧後，遮左不能遮右，一個個各自逃生，敗走歸洞。這行者與八戒從陣裡往外殺來，可憐那些不識俊的妖精搪著鈀，九孔血出；挽著棒，骨肉如泥。諕得那南山大王滾風生霧，得命逃回。那先鋒不能變化，早被行者一棒打倒，現出本相，乃是個鐵背蒼狼怪。八戒上前扯著腳，翻過來看了道：「這廝從小兒也不知偷了人家多少豬牙子、羊羔兒吃了。」行者將身一抖，收上毫毛道：「獃子，不可遲慢，快趕老怪，討師父的命去來。」八戒回頭，就不見那些小行者，道：「哥哥的法相兒都去了。」行者道：「我已收來也。」八戒道：「妙啊，妙啊！」兩個喜喜歡歡，得勝而回。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      小妖たちが勇猛で、何度打っても退かないのを見た悟空は、分身の術を使った。毛を一つかみ抜き、口でかんで吹き出し、悟空「変われ！」と叫ぶ。すべて自分と同じ姿に変わり、それぞれ一本の金箍棒を振るって、前方から中へ攻め込んだ。百か二百ほどの小妖は、前を守れば後ろが守れず、左を防げば右を防げない。みな思い思いに命からがら逃げ、洞へ敗走した。悟空と八戒は陣の中から外へ殺し進んだ。哀れ、身の程知らずの妖怪どもは、熊手に当たれば体の九つの穴から血を噴き、棒に触れれば骨も肉も泥のように砕けた。南山大王は恐れおののき、風を巻き霧を起こして、命だけは取り留めて逃げ戻った。先鋒は変化の術が使えず、早くも悟空の棒の一撃で倒され、本相を現していた。鉄の背をした蒼い狼の妖怪だった。八戒は進み出て足をつかみ、ひっくり返して見た。
      八戒「こいつ、小さいころから、よその子豚や子羊をどれだけ盗み食いしたか知れやしねえ。」
      悟空は体を震わせ、毛を回収して言った。悟空「馬鹿、ぐずぐずするな。早くあの親玉を追い、お師匠さまの命の借りを返させるぞ。」
      八戒が振り返ると、小さな悟空たちがもう見えない。
      八戒「兄貴の分身が、みんないなくなった。」
      悟空「もう取り戻したんだ。」
      八戒「妙な術だ、妙な術だ！」
      二人は喜びながら、勝利を収めて戻った。
    "translation_status": "reviewed"
  - "id": "xy-ch86-016"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那老怪逃了命回洞，吩咐小妖搬石塊，挑土把前門堵了。那些得命的小妖，一個個戰兢兢的，把門都堵了，再不敢出頭。這行者引八戒，趕至門首吆喝，內無人答應。八戒使鈀築時，莫想得動。行者知之，道：「八戒，莫費氣力，他把門已堵了。」八戒道：「堵了門，師仇怎報？」行者道：「且回上墓前，看看沙僧去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      さて、南山大王は命からがら洞へ戻ると、小妖どもに石を運び、土を担いできて、正面の門を塞ぐよう命じた。生き延びた小妖たちは、みな震えながら門をすっかり塞ぎ、もう顔を出すこともできなかった。悟空が八戒を連れて追いつき、門前で怒鳴っても、中から返事はない。八戒が熊手で突いても、びくともしなかった。悟空は事情を悟った。
      悟空「八戒、力を無駄にするな。奴は門を塞いだんだ。」
      八戒「門を塞がれたら、お師匠さまの仇をどうやって討つ？」
      悟空「ひとまず墓へ戻って、沙悟浄の様子を見よう。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-017"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二人復至本處，見沙僧還哭哩。八戒越發傷悲，丟了鈀，伏在墳上，手撲著土哭道：「苦命的師父啊！遠鄉的師父啊！那裡再得見你耶！」行者道：「兄弟，且莫悲切。這妖精把前門堵了，一定有個後門出入。你兩個只在此間，等我再去尋看。」八戒滴淚道：「哥啊，仔細著，莫連你也撈去了，我們不好哭得：哭一聲師父，哭一聲師兄，就要哭得亂了。」行者道：「沒事，我自有手段。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      二人がもとの場所へ戻ると、沙悟浄はまだ泣いていた。八戒はますます悲しくなり、熊手を放り出して墓へ伏し、手で土をたたきながら泣いた。
      八戒「ああ、不幸なお師匠さま！　遠い国で亡くなったお師匠さま！　もう、どこへ行ったら会えるんだよう！」
      悟空「兄弟、そう悲しむな。この妖怪は表門を塞いだんだ。出入りする裏門がきっとある。お前たち二人はここにいろ。俺がもう一度捜してくる。」
      八戒は涙をこぼした。八戒「兄貴、気をつけろよ。兄貴までさらわれたら、俺たちは泣くのにも困っちまう。お師匠さまと一声泣き、兄弟子と一声泣き、泣き方までこんがらがるぜ。」
      悟空「大丈夫だ。俺には俺の手がある。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-018"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，收了棒，束束裙，拽開步，轉過山坡，忽聽得潺潺水響。且回頭看處，原來是澗中水響，上溜頭沖泄下來。又見澗那邊有座門兒，門左邊有一個出水的暗溝。他道：「不消講！那就是後門了。若要是原嘴臉，恐有小妖開門看見認得，等我變作個水蛇兒過去。且住，變水蛇恐師父的陰靈兒知道，怪我出家人變蛇纏長。變作個小螃蟹兒過去罷。也不好，恐師父怪我出家人腳多。」即變做一個水老鼠，颼的一聲攛過去，從那出水的溝中，鑽至裡面天井中。探著頭兒觀看，只見那向陽處有個小妖，拿些人肉巴子，一塊塊的理著晒哩。行者道：「我的兒啊，那想是師父的肉吃不了，晒乾巴子防天陰的。我要現本相，趕上前，一棍子打殺，顯得我有勇無謀。且再變化進去，尋那老怪，看是何如。」跳出溝，搖身一變，變做個有翅的螞蟻兒。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      悟空は棒をしまい、腰の衣を締め、足を踏み出して山の斜面を回った。ふと、さらさらと水音が聞こえた。振り返って見ると、谷川の水が上流から流れ落ちる音だった。谷の向こうには門が一つあり、その左手に水を流す暗渠がある。
      悟空「あれに決まってる！　あそこが裏門だ。この姿のままだと、小妖が門を開けて見つけた時に、俺だと分かるかもしれん。小さな水蛇に化けて渡ろう。いや待て、水蛇になったとお師匠さまの霊が知ったら、出家の身で蛇になって長々と絡みつくのかと叱るかもしれん。小さな蟹になって行こうか。いや、それもいかん。出家のくせに足が多すぎると叱られそうだ。」
      そこで水鼠に変わり、ひゅっと向こうへ跳び、水の流れ出る溝から中庭へ潜り込んだ。頭を出して見回すと、日当たりのよい所で、小妖が人肉の塊を一つずつ整えて干していた。
      悟空「この小僧め！　あれはきっと、食い残したお師匠さまの肉を干し肉にして、天気の悪い日に備えているんだな。本相を現して駆け寄り、一撃で打ち殺したら、勇気だけあって知恵がないことになる。もう一度姿を変えて入り、親玉を捜し、様子を見よう。」
      溝から跳び出し、体を振ると、羽のある蟻に変わった。まことに、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch86-019"
    "section_id": "chapter-86"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      力微身小號玄駒，日久藏修有翅飛。
      閑渡橋邊排陣勢，喜來床下鬥仙機。
      善知雨至常封穴，壘積塵多遂作灰。
      巧巧輕輕能爽利，幾番不覺過柴扉。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 155
        "line_end": 158
    "translation_ja": |-
      力は弱く体は小さく、名を玄駒（げんく）という。長い間、隠れて修め、羽が生えて飛ぶ。
      のどかに橋のほとりを渡って陣を連ね、好んで寝台の下へ来て仙術の機知を競う。
      雨の訪れをよく知って、いつも巣穴を塞ぎ、塵を多く積み重ねて灰のような土を作る。
      巧みに軽やかに、すばしこく動き、気づかれぬまま幾たびも柴の戸を越える。
    "translation_status": "reviewed"
  - "id": "xy-ch86-020"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他展開翅，無聲無影，一直飛入中堂。只見那老怪煩煩惱惱正坐，有一個小妖從後面跳將來報道：「大王，萬千之喜。」老妖道：「喜從何來？」小妖道：「我才在後門外澗頭上探看，忽聽得有人大哭。即\U00027FFC上峰頭望望，原來是豬八戒、孫行者、沙和尚在那裡拜墳痛哭。想是把那個人頭認做唐僧的頭葬下，掆作墳墓哭哩。」行者在暗中聽說，心內歡喜道：「若出此言，我師父還藏在那裡，未曾吃哩。等我再去尋尋，看死活如何，再與他說話。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      悟空は羽を広げ、音も影も立てず、まっすぐ中央の広間へ飛び込んだ。南山大王がいらいらしながら座っている。そこへ、一匹の小妖が奥から跳び出て報告した。
      小妖「大王、幾重にもおめでたいことでございます！」
      南山大王「何がめでたいのだ？」
      小妖「先ほど裏門の外、谷川のほとりを探っておりますと、大泣きする声が聞こえました。山の頂へ跳び上がって見ると、八戒、悟空、沙悟浄が墓を拝んで泣いているのです。あの頭を唐僧の頭と思い込んで埋め、墓を築いて泣いているのでしょう。」
      暗がりで聞いていた悟空は、心の中で喜んだ。
      悟空は思った。「そんなことを言うなら、お師匠さまはまだどこかに隠されていて、食われてはいないんだ。もう少し捜して、生きているか死んでいるか確かめ、それからこいつを相手にしよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-021"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，飛在中堂，東張西看，見傍邊有個小門兒，關得甚緊。即從門縫兒裡鑽去看時，原是個大園子，隱隱的聽得悲聲。徑飛入深處，但見一叢大樹，樹底下綁著兩個人，一個正是唐僧。行者見了，心癢難撓，忍不住，現了本相，近前叫聲：「師父。」那長老認得，滴淚道：「悟空，你來了？快救我一救。悟空，悟空。」行者道：「師父莫只管叫名字：面前有人，怕走了風汛。你既有命，我可救得你。那怪只說已將你吃了，拿個假人頭哄我，我們與他恨苦相持。師父放心，且再熬熬兒，等我把那妖精弄倒，方好來解救。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      悟空は広間を飛びながら左右を見回し、脇に固く閉まった小さな戸を見つけた。隙間から潜って見ると、大きな庭園で、かすかに悲しげな声が聞こえる。奥へまっすぐ飛ぶと、大木がひとかたまりになり、その根元に二人の人が縛りつけられていた。一人は、まさしく三蔵だった。悟空は見た途端、むずむずしてじっとしていられず、たまらず本相を現し、近寄って呼んだ。
      悟空「お師匠さま。」
      三蔵は悟空と分かり、涙をこぼした。
      三蔵「悟空、来てくれたか！　早く助けておくれ。悟空、悟空！」
      悟空「お師匠さま、名前ばかり呼ばないでください。目の前には人もいます。話が漏れては困りますから。命がおありなら、お助けできます。あの妖怪は、お師匠さまを食ったと言い張り、偽物の頭を出して俺たちをだましました。それで、恨みを込めて激しく戦っていたのです。ご安心ください。もう少しだけ辛抱を。奴らを倒してからなら、お救いできます。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-022"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖念聲咒語，卻又搖身還變做個螞蟻兒，復入中堂，丁在正梁之上。只見那些未傷命的小妖簇簇攢攢，紛紛嚷嚷。內中忽跳出一個小妖，告道：「大王，他們見堵了門，攻打不開，死心塌地，捨了唐僧，將假人頭弄做個墳墓。今日哭一日，明日再哭一日，後日復了三，好道回去。打聽得他們散了啊，把唐僧拿出來，碎劖碎剁，把些大料煎了，香噴噴的大家吃一塊兒，也得個延年長壽。」又一個小妖拍著手道：「莫說，莫說，還是蒸了吃的有味。」又一個說：「煮了吃，還省柴。」又一個道：「他本是個稀奇之物，還著些鹽兒醃醃，吃得長久。」行者在那梁中聽見，心中大怒道：「我師父與你有甚毒情，這般算計吃他？」即將毫毛拔了一把，口中嚼碎，輕輕吹出，暗念咒語，都教變做瞌睡蟲兒，往那眾妖臉上拋去。一個個鑽入鼻中，小妖漸漸打盹，不一時都睡倒了。只有那個老妖睡不穩，他兩隻手揉頭搓臉，不住的打涕噴，捏鼻子。行者道：「莫是他曉得了？與他個雙掭燈。」又拔一根毫毛，依母兒做了，拋在他臉上，鑽於鼻孔內。兩個蟲兒，一個從左進，一個從右入。那老妖\U00027FFC起來，伸伸腰，打兩個啊欠，呼呼的也睡倒了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      悟空は呪文を唱え、体を振って、また蟻に戻り、広間へ引き返して棟木にとまった。命を失わずに済んだ小妖たちが群がり集まり、騒いでいる。その中から一匹が飛び出し、言った。
      最初の小妖「大王、奴らは門が塞がって打ち破れないのを見ると、すっかりあきらめて唐僧を見捨て、偽物の頭で墓を作りました。今日一日泣き、明日も一日泣き、明後日は三日目の墓参りを済ませれば、まず帰るでしょう。奴らが散ったと分かったら、唐僧を連れ出し、細かく切り刻み、大料（だいりょう）を加えて焼きましょう。香りよくして、皆で一切れずつ食べれば、寿命も延びて長生きできます。」
      別の小妖が手をたたいた。二匹目の小妖「いやいや、やっぱり蒸して食うほうがうまい。」
      また別の小妖が言った。三匹目の小妖「煮て食えば、薪も節約できるぞ。」
      さらに別の小妖が言った。四匹目の小妖「もともと珍しい品だ。塩を少し振って漬けておけば、長く食える。」
      梁の上で聞いていた悟空は、心の中で激怒した。
      悟空は思った。「お師匠さまに、いったいどんな深い恨みがあるんだ。こんなふうに食う算段ばかりしやがって！」
      すぐに毛を一つかみ抜き、口でかみ砕いて、そっと吹き出した。ひそかに呪文を唱え、全部を瞌睡虫（かっすいちゅう）に変えて、妖怪たちの顔へ投げかけた。虫は一匹ずつ鼻へ入り、小妖たちはだんだん居眠りを始め、ほどなく皆が眠り倒れた。南山大王だけがなかなか寝つかず、両手で頭を揉み、顔をこすり、くしゃみをしては鼻をつまんでいる。
      悟空「さては気づいたか？　双掭灯（そうてんとう）をくれてやろう。」
      もう一本毛を抜き、同じように虫を作って、その顔へ投げ、鼻の穴へ入れた。二匹の虫が、一匹は左から、一匹は右から入る。南山大王は跳び起きて腰を伸ばし、二度あくびをすると、ぐうぐうと眠り倒れた。
    "translation_status": "reviewed"
  - "id": "xy-ch86-023"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者暗喜，才跳下來，現出本相。耳朵裡取出棒來，幌一幌，有鴨蛋粗細，噹的一聲，把旁門打破，跑至後園，高叫：「師父！」長老道：「徒弟，快來解解繩兒，綁壞我了。」行者道：「師父不要忙，等我打殺妖精，再來解你。」急抽身跑至中堂，正舉棍要打，又滯住手道：「不好，等解了師父來打。」復至園中，又思量道：「等打了來救。」如此者兩三番，卻才跳跳舞舞的到園裡。長老見了，悲中作喜道：「猴兒，想是看見我不曾傷命，所以歡喜得沒是處，故這等作跳舞也？」行者才至前，將繩解了，挽著師父就走。又聽得對面樹上綁的人叫道：「老爺捨大慈悲，也救我一命。」長老立定身，叫：「悟空，那個人也解他一解。」行者道：「他是甚麼人？」長老道：「他比我先拿進一日。他是個樵子，說有母親年老，甚是思想，倒是個盡孝的，一發連他都救了罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      悟空はひそかに喜び、下へ跳び降りて本相を現した。耳から棒を取り出し、一振りすると、アヒルの卵ほどの太さになる。がんと一撃で脇の戸を打ち破り、裏庭へ走って大声で呼んだ。
      悟空「お師匠さま！」
      三蔵「早く縄をほどいておくれ。縛られて、体がひどく痛むのだ。」
      悟空「お師匠さま、急がないでください。妖怪を打ち殺してから、ほどきに来ます。」
      急いで身を返して広間へ走り、いざ棒を振り上げたが、手を止めた。
      悟空「いや、いかん。お師匠さまをほどいてから打とう。」
      庭へ戻ると、また考えた。悟空は思った。「やっぱり、打ってから助けよう。」
      こうして二度三度行き来したあげく、ようやく跳ねたり踊ったりしながら庭へやってきた。三蔵はそれを見て、悲しみの中に喜びを浮かべた。
      三蔵「猿よ、私が命を失っていないのを見て、うれしくてどうしてよいか分からず、そうやって跳ねて踊っているのだろう？」
      悟空はようやく前へ進み、縄をほどき、師の腕を引いて歩き出した。すると向かいの木に縛られた木こりが叫んだ。
      木こり「長老さま、大慈悲をおかけになり、私の命もお救いください！」
      三蔵は立ち止まって呼んだ。三蔵「悟空、あの人もほどいてあげなさい。」
      悟空「あの人は何者です？」
      三蔵「私より一日先に捕らえられた人だ。木こりで、年老いた母親がいると言い、ひどく気にかけていた。孝行な人なのだから、一緒に助けてあげよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch86-024"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者依言，也解了繩索，一同帶出後門，\U00027FFC上石崖，過了陡澗。長老謝道：「賢徒，虧你救了他與我命。悟能、悟淨都在何處？」行者道：「他兩個都在那裡哭你哩。你可叫他一聲。」長老果厲聲高叫道：「八戒，八戒。」那獃子哭得昏頭昏腦的，揩揩鼻涕眼淚道：「沙和尚，師父回家來顯魂哩，在那裡叫我們不是？」行者上前，喝了一聲道：「夯貨，顯甚麼魂？這不是師父來了？」那沙僧擡頭見了，忙忙跪在面前道：「師父，你受了多少苦啊！哥哥怎生救得你來也？」行者把上項事說了一遍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      悟空は言われたとおり、その縄もほどき、二人とも裏門から連れ出した。岩の崖へ跳び上がり、険しい谷川を越えた。
      三蔵「よい弟子よ、おかげでこの人も私も助かった。悟能（ごのう）と悟浄（ごじょう）は、どこにいるのだ？」
      悟空「あの二人は、向こうでお師匠さまを悼んで泣いていますよ。一声呼んでやってください。」
      三蔵は、ほんとうに声を張り上げた。三蔵「八戒、八戒！」
      八戒は泣きすぎて頭がぼんやりしていた。鼻水と涙をぬぐって言った。
      八戒「沙悟浄、お師匠さまの魂が家へ帰って現れたんだ。あそこで俺たちを呼んでるんじゃないか？」
      悟空が前へ来て怒鳴った。悟空「間抜け、何が魂だ！　お師匠さまが来てるじゃないか！」
      沙悟浄は顔を上げて姿を見ると、急いで前にひざまずいた。
      沙悟浄「お師匠さま、どんなにおつらかったことでしょう！　兄さんは、どうやってお助けしたのですか？」
      悟空は、ここまでの出来事を一通り話した。
    "translation_status": "reviewed"
  - "id": "xy-ch86-025"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒聞言，咬牙恨齒，忍不住舉起鈀把那墳塚一頓築倒，掘出那人頭，一頓築得稀爛。唐僧道：「你築他為何？」八戒道：「師父啊，不知他是那家的亡人，教我朝著他哭。」長老道：「虧他救了我命哩。你兄弟們打上他門，嚷著要我，想是拿他來搪塞；不然啊，就殺了我也。還把他埋一埋，見我們出家人之意。」那獃子聽長老此言，遂將一包稀爛骨肉埋下，也掆起個墳墓。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      話を聞いた八戒は、憎らしさに歯を食いしばり、たまらず熊手を持ち上げて墓をめった打ちに崩した。頭を掘り出すと、それもめった打ちにして、ぐちゃぐちゃに砕いた。
      三蔵「なぜ、その頭を打つのだ？」
      八戒「お師匠さま、どこの家の死んだ人かも分からねえのに、俺はこいつに向かって泣かされたんですよ！」
      三蔵「この人のおかげで、私の命が助かったのだよ。お前たちが門へ押しかけ、私を返せと叫んだので、この頭を出してごまかしたのだろう。そうでなければ、私を殺したに違いない。もう一度埋めてやり、出家した者の心を示しなさい。」
      八戒はこの言葉を聞き、ぐちゃぐちゃになった骨と肉の塊を埋め、また墓を築いた。
    "translation_status": "reviewed"
  - "id": "xy-ch86-026"
    "section_id": "chapter-86"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者卻笑道：「師父，你請略坐坐，等我剿除去來。」即又跳下石崖，過澗入洞，把那綁唐僧與樵子的繩索拿入中堂，那老妖還睡著了，即將他四馬攢蹄綑倒，使金箍棒掬起來，握在肩上，徑出後門。豬八戒遠遠的望見道：「哥哥好幹這握頭事。再尋一個兒趁頭挑著不好？」行者到跟前放下，八戒舉鈀就築。行者道：「且住，洞裡還有小妖怪未拿哩。」八戒道：「哥啊，有便帶我進去打他。」行者道：「打又費工夫了，不若尋些柴，教他斷根罷。」那樵子聞言，即引八戒去東凹裡尋了些破梢竹、敗葉松、空心柳、斷根藤、黃蒿、老荻、蘆葦、乾桑，挑了若干，送入後門裡。行者點上火，八戒兩耳搧起風。那大聖將身跳上，抖一抖，收了瞌睡蟲的毫毛。那些小妖及醒來，煙火齊著。可憐！莫想有半個得命。連洞府燒得精空。卻回見師父。師父聽見老妖方醒聲喚，便叫：「徒弟，妖精醒了。」八戒上前一鈀，把老怪築死，現出本相，原來是個艾葉花皮豹子精。行者道：「花皮會吃老虎，如今又會變人。這頓打死，才絕了後患也。」長老謝之不盡，攀鞍上馬。那樵子道：「老爺，向西南去不遠，就是舍下。請老爺到舍，見見家母，叩謝老爺活命之恩，送老爺上路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch86-1500525"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第086回&oldid=1500525"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      悟空は笑った。悟空「お師匠さま、少しお座りになっていてください。残らず退治してきます。」
      また岩の崖から跳び下り、谷川を渡って洞へ入った。三蔵と木こりを縛っていた縄を広間へ持っていくと、南山大王はまだ眠っていた。そこで四肢を寄せ集めて縛り上げ、金箍棒ですくい上げて肩へ担ぎ、そのまま裏門を出た。遠くから見た八戒が言った。
      八戒「兄貴は、そんな片っぽだけの担ぎ方が好きだな。もう一匹見つけて釣り合いを取り、両端で担いだほうがよくないか？」
      悟空がそばまで来て下ろすと、八戒は熊手を振り上げ、突きかかった。
      悟空「待て。洞の中には、まだ捕まえていない小妖どもがいる。」
      八戒「兄貴、いるなら俺を連れていってくれ。ぶちのめそう。」
      悟空「打つのも手間だ。薪を捜して、根絶やしにしたほうがいい。」
      木こりはそれを聞くと、八戒を東のくぼ地へ案内した。梢の折れた竹、葉の枯れた松、芯の空いた柳、根の切れた藤、黄ばんだヨモギ、枯れたオギ、アシ、乾いた桑を捜し、たくさん担いで裏門の中へ運んだ。悟空が火をつけ、八戒は両耳で風をあおった。悟空は身を跳び上がらせ、ひと震いして、瞌睡虫に変えた毛を回収した。小妖たちが目を覚ました時には、煙と火が一斉に燃え広がっていた。哀れなことに、半人たりとも生き残れはしない。洞府もろとも、きれいさっぱり焼き尽くした。それから師のもとへ戻った。三蔵は南山大王が目覚めてわめくのを聞いて、叫んだ。
      三蔵「お前たち、妖怪が目を覚ましたぞ。」
      八戒は進み出ると、熊手の一撃で南山大王を突き殺した。本相を現したそれは、ヨモギの葉のような斑紋の皮を持つ豹の妖怪だった。
      悟空「斑のあるこいつは虎まで食える。今では人にも化けるようになっていた。この一撃で殺してこそ、後の災いを断てたというものだ。」
      三蔵は繰り返し礼を述べ、鞍につかまって馬へ乗った。
      木こり「長老さま、西南へ少し行った所に、私の家がございます。どうぞお寄りくださり、母にお会いください。命を救ってくださったご恩を拝んでお礼申し上げてから、旅へお送りいたします。」
    "translation_status": "reviewed"

    "translation_ja": |-
      第三十六回
      心の猿が正しい所に収まり、もろもろの縁は鎮まる。邪道の門を打ち破り、月の明かりを見る。
    "translation_status": "reviewed"
  - "id": "xy-ch36-002"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫行者按落雲頭，對師父備言菩薩借童子，老君收去寶貝之事。三藏稱謝不已，死心塌地辦虔誠，捨命投西，攀鞍上馬，豬八戒挑著行李，沙和尚攏著馬頭，孫行者執了鐵棒，剖開路，徑下高山前進。說不盡那水宿風餐，披霜冒露。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 121
        "line_end": 121
    "translation_ja": "さて悟空（ごくう）は雲から降り、観音菩薩（かんのんぼさつ）が童子を借り受けたこと、太上老君（たいじょうろうくん）が宝を引き取ったことを、師に詳しく話した。三蔵（さんぞう）は何度も感謝し、もはや決して心を変えまいと信心を固め、命を投げ出す覚悟で西へ向かった。鞍につかまって馬に乗ると、八戒（はっかい）が荷を担ぎ、沙悟浄（さごじょう）が馬の手綱を取り、悟空が鉄棒を手に道を切り開いて、そのまま高い山を下り、先へ進んだ。水辺に宿り、風の中で食べ、霜を浴び露を冒す旅の苦労は、語り尽くせない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-003"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們行罷多時，前又一山阻路。三藏在那馬上高叫：「徒弟啊，你看那裡山勢崔巍，須是要仔細隄防，恐又有魔障侵身也。」行者道：「師父休要胡思亂想，只要定性存神，自然無事。」三藏道：「徒弟呀，西天怎麼這等難行？我記得離了長安城，在路上春盡夏來，秋殘冬至，有四五個年頭，怎麼還不能得到？」行者聞言，呵呵笑道：「早哩，早哩，還不曾出大門哩。」八戒道：「哥哥不要扯謊。人間就有這般大門？」行者道：「兄弟，我們還在堂屋裡轉哩。」沙僧笑道：「師兄，少說大話嚇我。那裡就有這般大堂屋，卻也沒處買這般大過梁啊。」行者道：「兄弟，若依老孫看時，把這青天為屋瓦，日月作窗櫺，四山五岳為梁柱，天地猶如一敞廳。」八戒聽說道：「罷了，罷了，我們只當轉些時回去罷。」行者道：「不必亂談，只管跟著老孫走路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      師弟が長いこと進むと、また一つの山が行く手を遮った。三蔵は馬上から声を張り上げた。三蔵「弟子たち、見なさい。あそこには険しい山がそびえている。よくよく用心しなくてはならぬ。また魔物に災いを受けそうで心配だ。」
      悟空「お師匠さま、取り越し苦労はおやめなさい。心を落ち着け、精神をしっかり保っていれば、自然と何事もありません。」
      三蔵「弟子よ、西天（さいてん）への道は、どうしてこれほど難しいのだろう。長安（ちょうあん）の城を出てから、道中で春が尽きて夏が来、秋が終わって冬になり、もう四、五年にもなる。それなのに、なぜまだ着かないのか。」
      悟空はそれを聞いて、からからと笑った。悟空「まだまだですよ。大門さえ出ていません。」
      八戒「兄貴、ほらを吹くなよ。この世に、そんな大きな門があるものか。」
      悟空「弟よ、俺たちは、まだ広間の中をぐるぐる回っているのさ。」
      沙悟浄も笑った。沙悟浄「兄貴、大げさなことを言って驚かさないでください。そんな大きな広間がどこにあるものですか。そんな大きな梁を買える所もありませんよ。」
      悟空「弟よ、俺に言わせれば、この青空を屋根瓦に、太陽と月を窓の格子に、四方の山々と五岳（ごがく）を梁や柱にすれば、天地は一つの広々とした大広間のようなものだ。」
      八戒「分かった、分かった。それなら俺たちも、しばらく回ったら帰ることにしよう。」
      悟空「無駄口をたたくな。ただ俺について歩いてくればいい。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-004"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，橫擔了鐵棒，領定了唐僧，剖開山路，一直前進。那師父在馬上遙觀，好一座山景。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 124
        "line_end": 124
    "translation_ja": "さすが悟空、鉄棒を横に担ぎ、三蔵を先導して山道を切り開き、まっすぐ進んでいった。師は馬の上から、遠くの見事な山の景色を眺めた。まさしく、こんな山であった。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-005"
    "section_id": "chapter-36"
    "kind": "verse"
    "origin": "source"
    "source_text": "山頂嵯峨摩斗柄，樹梢彷彿接雲霄。青煙堆裡，時聞得谷口猿啼；亂翠陰中，每聽得松間鶴唳。嘯風山魅立溪間，戲弄樵夫；成器狐狸坐崖畔，驚張獵戶。好山！看那八面崖巍，四圍險峻。古怪喬松盤翠蓋，枯摧老樹掛藤蘿。泉水飛流，寒氣透人毛髮冷；巔峰屹\U00021DA7，清風射眼夢魂驚。時聽大蟲哮吼，每聞山鳥時鳴。麂鹿成群穿荊棘，往來跳躍；獐\U00024731結黨尋野食，前後奔跑。佇立草坡，一望並無客旅；行來深凹，四邊俱有豺狼。應非佛祖修行處，盡是飛禽走獸場。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      高く険しい山頂は北斗（ほくと）の柄をこすり、木々の梢は雲の空につながるかに見える。
      青いもやの積もる中では、谷の入り口から猿の鳴き声が時折聞こえ、
      重なる緑の陰では、松の間に鶴の声がしばしば響く。
      風にうなる山の妖は渓流に立って木こりをからかい、
      霊力を得た狐は崖のほとりに座って猟師をおびえさせる。
      なんという山だ。八方に崖がそびえ、四方が険しく切り立つ。
      奇怪な高い松は緑の傘を広げ、枯れ折れた老木には藤や蔓が垂れかかる。
      泉の水は飛ぶように流れ、冷気が肌に染みて毛髪まで冷やす。
      峰は高くそそり立ち、清らかな風が目を打って夢の魂まで驚かす。
      時折は虎のうなりが聞こえ、山鳥も折々に声を上げる。
      キョンや鹿が群れをなし、いばらを抜けて、行きつ戻りつ跳び回る。
      キバノロや雌の猪は連れ立って野の食を探し、前へ後ろへ駆け回る。
      草の斜面に立って見渡しても、旅人の姿は一つもなく、
      深い窪地へ進めば、四方には山犬と狼ばかり。
      ここは仏祖（ぶっそ）が修行する所ではなさそうだ。空飛ぶ鳥と駆ける獣の住みかばかりである。
    "translation_status": "reviewed"
  - "id": "xy-ch36-006"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      那師父戰戰兢兢，進此深山，心中悽慘，兜住馬，叫聲：「悟空啊！我
      自從益智登山盟，王不留行送出城。
      路上相逢三棱子，途中催趲馬兜鈴。
      尋坡轉澗求荊芥，邁嶺登山拜茯苓。
      防己一身如竹瀝，茴香何日拜朝廷？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 127
        "line_end": 132
    "translation_ja": |-
      三蔵はおびえ震えながら、この深い山へ入った。心も寂しく沈み、馬を引き止めて声を上げた。
      三蔵「悟空よ、私は、
      益智（やくち）と知恵を増すため山に登る誓いを立ててから、王不留行（おうふるぎょう）と王にも引き留められず、城を送り出された。
      道では三棱子（さんりょうし）と三人の弟子に出会い、旅では馬兜鈴（ばとうれい）の鈴を響かせ、馬をせき立てる。
      坂を探り、谷川を巡って荊芥（けいがい）と経を求め、峰を越え、山を登って茯苓（ぶくりょう）と仏を拝む。
      防己（ぼうい）とわが身を慎み、竹瀝（ちくれき）のように清らかでありたいが、茴香（ういきょう）と故郷へ帰り、朝廷に拝礼するのはいつの日か。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-007"

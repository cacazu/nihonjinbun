    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，按一按頂上金箍，束一束腰間裙子，執著鐵棒，徑到大雄寶殿上，指著那三尊佛像道：「你本是泥塑金裝假像，內裡豈無感應？我老孫保領大唐聖僧往西天拜佛求取真經，今晚特來此處投宿，趁早與我報名；假若不留我等，就一頓棍打碎金身，教你還現本相泥土。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 173
        "line_end": 173
    "translation_ja": "さすが悟空、頭の金の輪を押さえ、腰に巻いた布を締め直し、鉄棒を携えて、まっすぐ大雄宝殿へ上がった。そして三尊の仏像を指さした。悟空「お前たちは泥で作って金をかぶせた仮の姿だが、中には霊験があるのだろう。俺は大唐の聖僧を守り、西天へ仏を拝み、まことの経を授かりに行くところだ。今夜はわざわざここへ泊まりに来た。さっさと俺たちの到着を取り次げ。もし泊めぬというなら、この棒で金色の体を打ち砕き、本来の土くれの姿に戻してやるぞ。」"
    "translation_status": "reviewed"
  - "id": "xy-ch36-022"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖正在前邊發狠，搗叉子亂說，只見一個燒晚香的道人點了幾枝香，來佛前爐裡插。被行者咄的一聲，諕了一跌；爬起來看見臉，又是一跌；嚇得滾滾蹡蹡，跑入方丈裡，報道：「老爺，外面有個和尚來了。」那僧官道：「你這夥道人都少打。一行說教他往前廊下去蹲，又報甚麼？再說打二十。」道人說：「老爺，這個和尚比那個和尚不同：生得惡躁，沒脊骨。」僧官道：「怎的模樣？」道人道：「是個圓眼睛，查耳朵，滿面毛，雷公嘴。手執一根棍子，咬牙狠狠的，要尋人打哩。」僧官道：「等我出去看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      悟空が前で威勢を張り、でたらめをまくしたてているところへ、夕べの香をたく寺男が、数本の香に火をつけて、仏前の香炉に挿しに来た。悟空が「こらっ」と一喝したので、寺男は驚いて一度転び、起き上がって顔を見て、もう一度転んだ。転がりよろめきながら方丈へ駆け込み、報告した。寺男「お師匠さま、外に和尚が参りました。」
      院主「お前たち寺男は、どいつもこいつも打たれ足りん。さっきから前の廊下にしゃがませろと言っているのに、何をまた報告する。もう一度言ったら二十叩きだぞ。」
      寺男「お師匠さま、この和尚は先ほどの和尚とは違います。恐ろしい顔で、道理もわきまえない者です。」
      院主「どんな姿だ。」
      寺男「丸い目に突き出た耳、顔いっぱいの毛に雷公（らいこう）のような口です。手には一本の棒を持ち、歯を食いしばって怒り、誰かを殴ろうと探しています。」
      院主「私が出て見よう。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-023"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他即開門，只見行者撞進來了。真個生得醜陋：七高八低孤拐臉，兩隻黃眼睛，一個磕額頭，獠牙往外生。就像屬螃蟹的，肉在裡面，骨在外面。那老和尚慌得把方丈門關了。行者趕上，撲的打破門扇，道：「趕早將乾淨房子打掃一千間，老孫睡覺。」僧官躲在房裡，對道人說：「怪他生得醜麼，原來是說大話折作的這般嘴臉。我這裡連方丈、佛殿、鐘鼓樓、兩廊，共總也不上三百間，他卻要一千間睡覺，卻打那裡來？」道人說：「師父，我也是嚇破膽的人了，憑你怎麼答應他罷。」那僧官戰索索的高叫道：「那借宿的長老，我這小荒山不方便，不敢奉留，往別處去宿罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      院主が戸を開けると、悟空が飛び込んできた。まことに醜い顔である。七か所は高く八か所は低いような、頬骨の張った顔、二つの黄色い目、張り出した額に、外へ突き出る牙。まるで蟹年生まれのように、肉は内側、骨は外側にある。老僧は慌てて方丈の戸を閉めた。悟空は追いつき、ばりんと扉を打ち破った。悟空「さっさと、きれいな部屋を千間、掃除しろ。俺が寝るのだ。」
      院主は部屋に隠れ、寺男に言った。院主「ひどい顔だと思ったら、あんな大口をたたくから、報いであの顔になったのだ。ここは方丈も、仏殿も、鐘楼も鼓楼も、両側の廊も、全部合わせて三百間にもならぬ。それを、寝るのに千間よこせとは、どこから出せばよいのだ。」
      寺男「お師匠さま、私も肝をつぶすほど怖いのです。どうお返事なさるかは、お任せします。」
      院主はがたがた震えながら、大声を出した。院主「お泊まりをお求めの長老さま、この粗末な山寺は都合が悪く、お泊め申せません。ほかへおいでください。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-024"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者將棍子變得盆來粗細，直壁壁的豎在天井裡，道：「和尚，不方便，你就搬出去。」僧官道：「我們從小兒住的寺，師公傳與師父，師父傳與我輩，我輩要遠繼兒孫。他不知是那裡勾當，冒冒失失的，教我們搬哩。」道人說：「老爺，十分不尷尬，搬出去也罷，扛子打進門來了。」僧官道：「你莫胡說，我們老少眾人四五百名和尚，往那裡搬？搬出去，卻也沒處住。」行者聽見道：「和尚，沒處搬，便著一個出來打樣棍。」老和尚叫道人：「你出去與我打個樣棍來。」那道人慌了道：「爺爺呀！那等個大杠子，教我去打樣棍？」老和尚道：「『養軍千日，用軍一朝。』你怎麼不出去？」道人說：「那杠子莫說打來，若倒下來，壓也壓個肉泥。」老和尚道：「也莫要說壓，只道豎在天井裡，夜晚間走路，不記得啊，一頭也撞個大窟窿。」道人說：「師父，你曉得這般重，卻教我出去打甚麼樣棍？」他自家裡面轉鬧起來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 177
        "line_end": 177
    "translation_ja": |-
      悟空は棒を盆ほどの太さに変え、中庭にまっすぐ立てた。悟空「和尚、都合が悪いなら、お前たちが出ていけ。」
      院主「ここは子供のころから住んでいる寺だ。師のお師匠さまから師へ、師から我々へと伝わり、我々はさらに後の弟子たちへ、長く伝えようとしている。それを、どこの何者とも知れぬあいつが、ぶしつけにも出ていけと言う。」
      寺男「お師匠さま、これは本当に厄介です。出ていってもよいではありませんか。太い棒が、もう門の中まで入ってきました。」
      院主「馬鹿なことを言うな。老いも若きも四、五百人の和尚が、どこへ引っ越すのだ。出ていっても、住む所がない。」
      悟空はそれを聞いた。悟空「和尚、引っ越す所がないなら、一人出して、棒の試し打ちを受けさせろ。」
      院主は寺男を呼んだ。院主「お前、私の代わりに出ていって、試し打ちを受けてこい。」
      寺男は慌てた。寺男「お師匠さま、そんな。あれほど大きな棒なのに、私に試し打ちを受けろとおっしゃるのですか。」
      院主「『軍を養うこと千日、軍を用いるは一朝』だ。なぜ出ていかぬ。」
      寺男「あの棒は、打たれるどころか、倒れてきただけでも肉の泥になるまで押しつぶされます。」
      院主「押しつぶされるまでもない。中庭に立っているだけでも、夜道でうっかり忘れていたら、頭をぶつけて大穴を開けるぞ。」
      寺男「お師匠さま、それほど重いと分かっていながら、なぜ私に試し打ちを受けさせるのです。」
      しまいには、中の者同士で言い争いを始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch36-025"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽見道：「是也禁不得，假若就一棍打殺一個，我師父又怪我行兇了。且等我另尋一個甚麼打與你看看。」忽擡頭，只見方丈門外有一個石獅子，卻就舉起棍來，乒乓一下，打得粉亂麻碎。那和尚在窗眼兒裡看見，就嚇得骨軟觔麻，慌忙往床下拱；道人就往鍋門裡鑽，口中不住叫：「爺爺，棍重，棍重，禁不得，方便，方便！」行者道：「和尚，我不打你。我問你：這寺裡有多少和尚？」僧官戰索索的道：「前後是二百八十五房頭，共有五百個有度牒的和尚。」行者道：「你快去把那五百個和尚都點得齊齊整整，穿了長衣服出去，把我那唐朝的師父接進來，就不打你了。」僧官道：「爺爺，若是不打，便擡也擡進來。」行者道：「趁早去。」僧官叫道人：「你莫說嚇破了膽，就是嚇破了心，便也去與我叫這些人來，接唐僧老爺爺來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      悟空は聞いて言った。悟空「なるほど、耐えられぬだろうな。もし一打ちで一人殺してしまえば、お師匠さまにまた乱暴をしたと叱られる。待っていろ。何か別のものを見つけて、打って見せてやる。」
      ふと見上げると、方丈の門の外に石の獅子が一つあった。悟空は棒を振り上げ、がんと一撃して、粉々に砕いてしまった。院主は窓の隙間からそれを見て、骨も筋も力が抜け、慌てて寝台の下へ潜り込んだ。寺男はかまどの焚き口へ頭を突っ込み、口では絶え間なく叫んでいた。寺男「お方さま、棒が重すぎます、重すぎます。耐えられません。お泊めします、お泊めします。」
      悟空「和尚、お前を殴りはしない。聞くが、この寺には何人の和尚がいる。」
      院主は震えながら答えた。院主「前後合わせて二百八十五の房があり、度牒（どちょう）を持つ和尚は五百人でございます。」
      悟空「すぐその五百人をきちんと集め、長い衣を着せて外へ出し、唐（とう）から来た俺のお師匠さまを迎え入れろ。そうすれば、殴らずにおいてやる。」
      院主「お方さま、殴らないでくださるなら、お担ぎしてでもお連れいたします。」
      悟空「さっさと行け。」
      院主は寺男を呼んだ。院主「肝がつぶれようが、心臓がつぶれようが、あの者たちを呼び集めてこい。唐の和尚さまをお迎えするのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-026"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那道人沒奈何，捨了性命，不敢撞門，從後邊狗洞裡鑽將出去，徑到正殿上，東邊打鼓，西邊撞鐘。鐘鼓一齊響處，驚動了兩廊大小僧眾，上殿問道：「這早還不晚哩，撞鐘打鼓做甚？」道人說：「快換衣服，隨老師父排班，出山門外，迎接唐朝來的老爺。」那眾和尚真個齊齊整整，擺班出門迎接。有的披了袈裟；有的著了偏衫；無的穿著個一口鐘直裰；十分窮的，沒有長衣服，就把腰裙接起兩條披在身上。行者看見道：「和尚，你穿的是甚麼衣服？」和尚見他醜惡，道：「爺爺，不要打，等我說。這是我們城中化的布，此間沒有裁縫，是自家做的個一裹窮。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      寺男はどうしようもなく、命がけの覚悟をした。門へ近づくのも恐ろしく、裏の犬くぐりから這い出して、そのまま本堂へ行った。東で太鼓を打ち、西で鐘を鳴らす。鐘と太鼓が一斉に響き、両側の廊にいた老若の僧たちが驚いて本堂へ来た。僧たち「まだ晩にもなっていないのに、鐘や太鼓を鳴らしてどうしたのだ。」
      寺男「早く着替え、老師父について列を組み、山門の外へ出て、唐からおいでの和尚さまをお迎えしてください。」
      僧たちは本当に、きちんと列を組んで迎えに出た。袈裟をまとった者もいれば、偏衫（へんさん）を着た者もいる。それもない者は、鐘をすっぽりかぶったような直裰（ちょくたつ）を着た。ひどく貧しくて長い衣もない者は、腰巻きの布を二枚つないで身にまとった。悟空はそれを見て尋ねた。悟空「和尚、お前の着ているのは何という衣だ。」
      その僧は悟空の醜い顔を見て言った。僧「お方さま、殴らずに、訳をお聞きください。これは町で施していただいた布です。ここには裁縫師がいないので、自分で作った『貧乏ひと包み』でございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-027"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言暗笑，押著眾僧，出山門外跪下。那僧官磕頭高叫道：「唐老爺，請方丈裡坐。」八戒看見道：「師父老大不濟事，你進去時，淚汪汪，嘴上掛得油瓶。師兄怎麼就有此獐智，教他們磕頭來接？」三藏道：「你這個獃子，好不曉禮。常言道：『鬼也怕惡人哩。』」唐僧見他們磕頭禮拜，甚是不過意，上前叫：「列位請起。」眾僧叩頭道：「老爺若和你徒弟說聲方便，不動杠子，就跪一個月也罷。」唐僧叫：「悟空，莫要打他。」行者道：「不曾打；若打，這會已打斷了根矣。」那些和尚卻才起身，牽馬的牽馬，挑擔的挑擔，擡著唐僧，馱著八戒，挽著沙僧，一齊都進山門裡去，卻到後面方丈中，依敘坐下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 180
        "line_end": 180
    "translation_ja": |-
      悟空は聞いてひそかに笑い、僧たちを追い立て、山門の外へ出してひざまずかせた。院主は頭を地につけ、大声で叫んだ。院主「唐の和尚さま、どうぞ方丈へおいでください。」
      八戒はそれを見て言った。八戒「お師匠さまは、まったく頼りにならないな。入っていったときは涙をいっぱい浮かべ、口には油の壺でも掛けられそうに、ふくれていたのに。兄貴はどうしてこんな知恵があって、あいつらに頭を下げて迎えに来させられるんだ。」
      三蔵「この愚か者、まるで道理が分かっていない。『鬼も悪人を恐れる』と言うではないか。」
      三蔵は僧たちが地に頭をつけて拝礼するのを見て、たいそう恐縮し、進み出て声をかけた。三蔵「皆さん、お立ちください。」
      僧たちは頭を下げたまま言った。僧たち「お弟子さまに、どうか棒を振るわないよう、ひと言お口添えくださるなら、一か月ひざまずいていてもかまいません。」
      三蔵「悟空、この方々を殴ってはならぬ。」
      悟空「殴ってなどいません。殴っていたら、今ごろは根こそぎ絶えてしまっています。」
      僧たちはようやく立ち上がった。馬を引く者は馬を引き、荷を担ぐ者は荷を担ぎ、三蔵を担ぎ、八戒を背負い、沙悟浄の手を取って、一斉に山門へ入った。そして奥の方丈へ行き、順序に従って座った。
    "translation_status": "reviewed"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老在馬上遙觀，只見那山凹裡有樓臺疊疊，殿閣重重。三藏道：「徒弟，此時天色已晚，幸得那壁廂有樓閣不遠，想必是庵觀寺院，我們都到那裡借宿一宵，明日再行罷。」行者道：「師父說得是。不要忙，等我且看好歹如何。」那大聖跳在空中，仔細觀看，果然是座山門。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      三蔵が馬上から遠くを見ると、山の窪みに楼台が幾重にも重なり、殿堂や閣が建ち並んでいた。三蔵「弟子たち、もう日が暮れた。幸い、あちらの楼閣はそう遠くない。きっと庵か、道観か、寺院だろう。皆であそこへ行って、一晩泊めてもらい、明日また進もう。」
      悟空「お師匠さまのおっしゃるとおりです。慌てずお待ちください。私がまず、どんな所か見てきます。」
      悟空は空へ跳び上がり、念入りに眺めた。果たして寺の山門である。見ると、
    "translation_status": "reviewed"
  - "id": "xy-ch36-010"
    "section_id": "chapter-36"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      八字磚牆泥紅粉，兩邊門上釘金釘。
      疊疊樓臺藏嶺畔，層層宮闕隱山中。
      萬佛閣對如來殿，朝陽樓應大雄門。
      七層塔屯雲宿霧，三尊佛神現光榮。
      文殊臺對伽藍舍，彌勒殿靠大慈廳。
      看山樓外青光舞，步虛閣上紫雲生。
      松關竹院依依綠，方丈禪堂處處清。
      雅雅幽幽供樂事，川川道道喜迴迎。
      參禪處有禪僧講，演樂房多樂器鳴。
      妙高臺上曇花墜，說法壇前貝葉生。
      正是那林遮三寶地，山擁梵王宮。
      半壁燈煙光閃灼，一行香靄霧朦朧。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 142
        "line_end": 153
    "translation_ja": |-
      八の字に開いた煉瓦の塀は紅に塗られ、両側の扉には金の鋲が打たれている。
      重なる楼台は峰のほとりに隠れ、幾層もの宮殿が山の中に潜む。
      万仏閣（まんぶつかく）は如来殿（にょらいでん）と向かい合い、朝陽楼（ちょうようろう）は大雄門（だいおうもん）と相対する。
      七重の塔には雲が集まり霧が宿り、三尊の仏は輝く光を現す。
      文殊台（もんじゅだい）は伽藍舎（がらんしゃ）と向かい合い、弥勒殿（みろくでん）は大慈庁（だいじちょう）に寄り添う。
      看山楼（かんざんろう）の外には青い光が舞い、歩虚閣（ほきょかく）の上には紫の雲が湧く。
      松の門、竹の庭はしなやかな緑に包まれ、方丈（ほうじょう）も禅堂も、どこも清らか。
      みやびで静かな楽しみがあり、川ごと道ごとに、喜んで迎える風情がある。
      禅を修める所では禅僧が教えを説き、音楽の部屋では多くの楽器が鳴り響く。
      妙高台（みょうこうだい）には曇花（どんげ）が降り、説法の壇の前には貝葉（ばいよう）が生い茂る。
      まさに、林が三宝（さんぼう）の地を覆い、山が梵王（ぼんおう）の宮を抱く景色。
      壁の半ばに灯火の煙が光りきらめき、一筋の香のもやが霧のようにたなびいている。
    "translation_status": "reviewed"
  - "id": "xy-ch36-011"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖按下雲頭，報與三藏道：「師父，果然是一座寺院，卻好借宿，我們去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 155
        "line_end": 155
    "translation_ja": "悟空は雲から降り、三蔵に報告した。悟空「お師匠さま、やはり寺院です。ちょうど泊めてもらうによい所だ。行きましょう。」"
    "translation_status": "reviewed"
  - "id": "xy-ch36-012"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這長老放開馬，一直前來，徑到了山門之外。行者道：「師父，這一座是甚麼寺？」三藏道：「我的馬蹄才然停住，腳尖還未出鐙，就問我是甚麼寺，好沒分曉。」行者道：「你老人家自幼為僧，須曾講過儒書，方才去演經法，文理皆通，然後受唐王的恩宥。門上有那般大字，如何不認得？」長老罵道：「潑猢猻！說話無知。我才面西催馬，被那太陽影射，奈何門雖有字，又被塵垢朦朧，所以未曾看見。」行者聞言，把腰兒躬一躬，長了二丈餘高，用手展去灰塵，道：「師父，請看。」上有五個大字，乃是「敕建寶林寺」。行者收了法身，道：「師父，這寺裡誰進去借宿？」三藏道：「我進去。你們的嘴臉醜陋，言語粗疏，性剛氣傲，倘或衝撞了本處僧人，不容借宿，反為不美。」行者道：「既如此，請師父進去，不必多言。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      三蔵は馬を進め、そのまま山門の外へ来た。悟空「お師匠さま、これは何という寺です。」
      三蔵「馬の足が止まったばかりで、まだつま先さえ鐙から抜いていない。それなのに何という寺かと聞くとは、まるで道理が分かっていないな。」
      悟空「お師匠さまは幼いころから僧になり、儒学の書を学んでから経の教えを説き、文章も道理もすべて通じたうえで、唐王（とうおう）の恩恵を受けたのでしょう。門にあれほど大きな文字があるのに、どうして読めないのです。」
      三蔵は叱った。三蔵「この不届きな猿め、物を知らぬ言い方をする。さっきは西に向かって馬を急がせ、太陽の光が目に入った。門に字があっても、塵や汚れでかすんでいるから、まだ見えなかったのだ。」
      悟空は腰をかがめると、背丈を二丈余りに伸ばし、手で塵を払いのけた。悟空「お師匠さま、ご覧ください。」
      そこには五つの大きな文字で「勅建宝林寺（ちょくけんほうりんじ）」とあった。悟空は体を元の大きさに戻した。悟空「お師匠さま、この寺へは誰が宿を頼みに入ります。」
      三蔵「私が入ろう。お前たちは顔が醜く、言葉遣いも荒く、気性も強くて高慢だ。ここの僧を怒らせでもして、宿を断られれば、かえってよくない。」
      悟空「それなら、お師匠さまがお入りください。これ以上言うことはありません。」
    "translation_status": "reviewed"

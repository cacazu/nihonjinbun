    "source_text": "那長老卻丟了錫杖，解下斗篷，整衣合掌，徑入山門。只見兩邊紅漆欄杆裡面，高坐著一對金剛，裝塑的威儀惡醜："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 158
        "line_end": 158
    "translation_ja": "三蔵は錫杖を置き、外套を脱いで衣服を整え、合掌して山門へ入った。両側の朱塗りの欄干の中には、一対の金剛（こんごう）が高々と座していた。その像は威厳に満ち、恐ろしい容貌に作られている。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-014"
    "section_id": "chapter-36"
    "kind": "verse"
    "origin": "source"
    "source_text": "一個鐵面鋼鬚似活容，一個燥眉圜眼若玲瓏。左邊的拳頭骨突如生鐵，右邊的手掌崚嶒賽赤銅。金甲連環光燦爛，明盔繡帶映飄風。西方真個多供佛，石鼎中間香火紅。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      一方は鉄の顔に鋼のひげを生やし、生きているかのよう。
      他方は荒々しい眉と丸い目で、くっきりした姿を見せる。
      左の拳は節が突き出て、まるで銑鉄。
      右の掌はごつごつと、赤銅にも勝る。
      金の鎧は環が連なってまばゆく輝き、光る兜と刺繡の帯は、吹く風に照り映える。
      西方には、まことに仏を供養する者が多い。石の香炉の中で、香の火が赤く燃えている。
    "translation_status": "reviewed"
  - "id": "xy-ch36-015"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏見了，點頭長嘆道：「我那東土，若有人也將泥胎塑這等大菩薩，燒香供養啊，我弟子也不去西天去矣。」正嘆息處，又到了二層山門之內。見有四大天王之像，乃是持國、多聞、增長、廣目，按東北西南風調雨順之意。進了二層門裡，又見有喬松四樹，一樹樹翠蓋蓬蓬，卻如傘狀。忽擡頭，乃是大雄寶殿。那長老合掌皈依，舒身下拜。拜罷起來，轉過佛臺，到於後門之下。又見有倒座觀音普度南海之像。那壁上都是良工巧匠裝塑的那些蝦、魚、蟹、鱉，出頭露尾，跳海水波潮耍子。長老又點頭三五度，感嘆萬千聲道：「可憐啊！鱗甲眾生都拜佛，為人何不肯修行？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      三蔵は見てうなずき、長くため息をついた。三蔵「わが東土（とうど）でも、このように大きな菩薩を泥で作り、香をたいて供養する人がいてくれたら、この私も西天へなど行かずに済むのだが。」
      そう感嘆しながら、二つ目の山門の中へ来た。そこには四大天王（しだいてんのう）、すなわち持国（じこく）、多聞（たもん）、増長（ぞうちょう）、広目（こうもく）の像があり、東・北・西・南に配して、風雨の順調なことを願う意味を表していた。二つ目の門を入ると、高い松が四本あり、それぞれ緑の枝葉をふさふさと広げ、傘のような姿をしていた。ふと顔を上げると、そこは大雄宝殿（だいおうほうでん）である。三蔵は合掌して帰依し、身を伸べてひれ伏した。拝礼を終えて立ち上がり、仏壇の後ろへ回って裏口に来ると、本尊の背面側に、南海（なんかい）の衆生を広く救う観音（かんのん）の像があった。壁には、巧みな職人が作った海老、魚、蟹、すっぽんが、頭や尾を出して、海の波間へ跳び出し遊んでいる。
      三蔵はまた三度、五度とうなずき、幾千、幾万にも及ぶ感嘆の声を上げた。三蔵「ああ、ありがたい。鱗や甲羅を持つ生き物まで仏を拝んでいる。人に生まれて、どうして修行をしようとしないのだろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-016"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正讚嘆間，又見三門裡走出一個道人。那道人忽見三藏相貌稀奇，丰姿非俗，急趨步上前施禮道：「師父那裡來的？」三藏道：「弟子是東土大唐駕下差來，上西天拜佛求經的。今到寶方，天色將晚，告借一宿。」那道人道：「師父莫怪，我做不得主，我是這裡掃地、撞鐘、打勤勞的道人。裡面還有個管家的老師父哩，待我進去稟他一聲。他若留你，我就出來奉請；若不留你，我卻不敢羈遲。」三藏道：「累及你了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      そう感嘆していると、三つ目の門から一人の寺男が出てきた。寺男は、三蔵の顔立ちがただ者でなく、姿も俗人とは違うのを見て、急いで進み出て礼をした。寺男「お坊さま、どちらからおいでになりました。」
      三蔵「私は東土、大唐（だいとう）の天子さまから遣わされ、西天へ仏を拝み、経を求めに参った者です。こちらへ着くと、もう日が暮れかけておりますので、一晩泊めていただきたいのです。」
      寺男「お坊さま、お気を悪くなさらないでください。私には決められません。私はここで掃除や鐘つきなどの雑務をする道人（どうにん）です。奥には寺を取り仕切る老僧がおりますから、ひと言お伝えしてまいります。お泊めすると申しましたら、私がお迎えに出ます。泊めないと申しましたら、お引き留めするわけにはまいりません。」
      三蔵「お手数をかけます。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-017"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那道人急到方丈報道：「老爺，外面有個人來了。」那僧官即起身，換了衣服，按一按毘盧帽，披上袈裟，急開門迎接，問道人：「那裡人來？」道人用手指定道：「那正殿後邊不是一個人？」那三藏光著一個頭，穿一領二十五條達摩衣，足下登一雙拖泥帶水的達公鞋，斜倚在那後門首。僧官見了，大怒道：「道人少打！你豈不知我是僧官，但只有城上來的士夫降香，我方出來迎接？這等個和尚，你怎麼多虛少實，報我接他？看他那嘴臉，不是個誠實的，多是雲遊方上僧，今日天晚，想是要來借宿。我們方丈中，豈容他打攪？教他往前廊下蹲罷了，報我怎麼？」抽身轉去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      寺男は急いで方丈へ報告に行った。寺男「お師匠さま、外に人が参りました。」
      僧官（そうかん）の地位にある院主はすぐに立ち上がり、着替えをし、毘盧帽（びるぼう）を整え、袈裟をまとって、急いで扉を開けて出迎えた。院主「どちらのお方だ。」
      寺男は手で指し示した。寺男「あの、本堂の後ろにおられる方です。」
      三蔵は頭に何もかぶらず、二十五条の達摩衣（だるまえ）を着て、泥と水にまみれた達公鞋（だっこうあい）を履き、後ろの出入り口にもたれていた。院主はそれを見ると、激しく怒った。院主「この寺男め、打たれ足りないようだな。私が僧官で、町のお偉方が焼香に来られたときしか出迎えに出ないことを知らぬのか。こんな和尚を、なぜ大げさに取り次いで迎えさせる。顔を見れば、まじめな者には見えぬ。どうせ諸方を放浪する旅僧で、今日は日が暮れたから泊まりに来たのだろう。わが方丈で邪魔をさせてなるものか。前の廊下にでもしゃがませておけ。いちいち私に知らせるな。」
      そう言うと、身をひるがえして戻ってしまった。
    "translation_status": "reviewed"
  - "id": "xy-ch36-018"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老聞言，滿眼垂淚道：「可憐，可憐！這才是人離鄉賤。我弟子從小兒出家，做了和尚，又不曾拜懺吃葷生歹意，看經懷怒壞禪心；又不曾丟瓦拋磚傷佛殿，阿羅臉上剝真金。噫！可憐啊！不知是那世裡觸傷天地，教我今生常遇不良人。──和尚，你不留我們宿便罷了，怎麼又說這等憊懶話，教我們在前道廊下去蹲？此話不與行者說還好，若說了，那猴子進來，一頓鐵棒，把孤拐都打斷你的。」長老道：「也罷，也罷。常言道：『人將禮樂為先。』我且進去問他一聲，看他意下如何？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      三蔵はこれを聞き、目いっぱいに涙を浮かべた。三蔵「ああ、情けない。故郷を離れた人間は軽く扱われるとは、このことだ。私は幼くして出家し、和尚となってから、懺悔の法要をしながら肉を食べて悪心を起こしたことも、経を読みながら怒りを抱き、禅の心を汚したこともない。瓦や煉瓦を投げて仏殿を傷つけたり、羅漢（らかん）の顔から純金を剥いだりもしていない。ああ、哀れなことだ。いったいどの前世で天地の怒りに触れ、今生でいつも悪い人に出会うのだろう。和尚よ、私たちを泊めぬというだけならそれでよいのに、なぜあんな無礼なことを言い、前の廊下にしゃがめなどと言うのだ。悟空にこのことを話さずにいればまだよいが、話してしまえば、あの猿が入ってきて鉄棒を振るい、お前の足の骨までへし折ってしまうぞ。」
      三蔵「まあよい、まあよい。『人は礼楽を第一とする』という。ひとまず中へ行き、もう一度尋ねて、その意向を確かめよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-019"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      那師父踏腳跡，跟他進方丈門裡。只見那僧官脫了衣服，氣呼呼的坐在那裡，不知是念經，又不知是與人家寫法事，見那桌案上有些紙劄堆積。唐僧不敢深入，就立於天井裡，躬身高叫道：「老院主，弟子問訊了。」那和尚就有些不耐煩他進裡邊來的意思，半答不答的還了個禮，道：「你是那裡來的？」三藏道：「弟子乃東土大唐駕下差來，上西天拜活佛求經的。經過寶方，天晚，求借一宿，明日不犯天光就行了。萬望老院主方便方便。」那僧官才欠起身來道：「你是那唐三藏麼？」三藏道：「不敢，弟子便是。」僧官道：「你既往西天取經，怎麼路也不會走？」三藏道：「弟子更不曾走貴處的路。」他道：「正西去，只有四五里遠近，有一座三十里店，店上有賣飯的人家，方便好宿。我這裡不便，不好留你們遠來的僧。」三藏合掌道：「院主，古人有云：『庵觀寺院，都是我方上人的館驛，見山門就有三升米分。』你怎麼不留我，卻是何情？」僧官怒聲叫道：「你這遊方的和尚，便是有些油嘴油舌的說話。」三藏道：「何為油嘴油舌？」僧官道：「古人云：『老虎進了城，家家都閉門。雖然不咬人，日前壞了名。』」三藏道：「怎麼『日前壞了名』？」他道：「向年有幾眾行腳僧，來於山門口坐下。是我見他寒薄，一個個衣破鞋無，光頭赤腳，我嘆他那般襤褸，即忙請入方丈，延之上坐，款待了齋飯，又將故衣各借一件與他，就留他住了幾日。怎知他貪圖自在衣食，更不思量起身，就住了七八個年頭。住便也罷，又幹出許多不公的事來。」三藏道：「有甚麼不公的事？」僧官道：「你聽我說：
      閑時沿牆拋瓦，悶來壁上扳釘。冷天向火折窗櫺。夏日拖門攔徑。
      幡布扯為腳帶，牙香偷換蔓菁。常將琉璃把油傾。奪碗奪鍋賭勝。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 167
        "line_end": 169
    "translation_ja": |-
      三蔵は院主の足跡を追って、方丈の門へ入った。院主は上着を脱ぎ、腹立たしげに座っていた。経を読むところなのか、人に頼まれた法事の文書を書くところなのか、机には紙が積み重なっていた。三蔵は奥まで入るのをためらい、中庭に立って腰をかがめ、大きな声で呼びかけた。三蔵「院主さま、ごあいさつ申し上げます。」
      院主は、奥まで入って来られたのを迷惑そうに、ろくな返事もせずに礼を返した。院主「どこから来たのだ。」
      三蔵「私は東土、大唐の天子さまから遣わされ、西天へ生き仏を拝み、経を求めに参った者です。こちらを通りかかって日が暮れましたので、一晩泊めていただき、明日は夜の明けぬうちに出立いたします。どうか院主さま、お情けをおかけください。」
      院主は、そこでようやく腰を少し浮かせた。院主「お前は、あの唐三蔵（とうさんぞう）か。」
      三蔵「恐れ入ります。私が、その者です。」
      院主「西天へ経を取りに行くというのに、道も分からぬのか。」
      三蔵「この辺りの道は、まだ歩いたことがありません。」
      院主「真西へ四、五里ほど行けば、三十里店（さんじゅうりてん）という所がある。飯を売る家もあり、泊まるにも便利だ。ここは都合が悪く、遠くから来た僧を泊めることはできぬ。」
      三蔵は合掌した。三蔵「院主さま、昔の人は『庵も道観も寺院も、われら旅の修行者にとっては宿駅であり、山門を見つければ米三升の分け前がある』と申しました。お泊めくださらないのは、どういうわけなのでしょう。」
      院主は怒鳴った。院主「お前のような諸国巡りの和尚は、口がうまいものだな。」
      三蔵「口がうまいとは、どういうことでしょう。」
      院主「古人はこう言う。『虎が町に入れば、家々はみな門を閉ざす。人をかまなくても、前から評判を悪くしている。』」
      三蔵「『前から評判を悪くしている』とは、どういうことですか。」
      院主「以前、何人かの行脚僧が、山門の前へ来て座ったことがある。皆みすぼらしく、破れた衣で、靴もなく、頭も足もむき出しだった。あまりのぼろぼろの姿が気の毒で、私はすぐ方丈へ招き入れ、上座に座らせ、食事を出し、古い衣を一人に一着ずつ貸して、数日泊まらせてやった。ところが、気楽に衣食を得られるのに味をしめ、立つ気も起こさず、七、八年も居着いてしまった。住むだけならまだしも、ずいぶん不届きなことまでしでかしたのだ。」
      三蔵「どんな不届きなことをしたのです。」
      院主「聞くがよい。
      暇なときは塀伝いに瓦を投げ、退屈すれば壁の釘を引き抜く。
      寒ければ窓の格子を折って火にくべ、夏には戸を引きずり外して道を塞ぐ。
      幡（はた）の布は裂いて足に巻き、上等の香は盗んで蕪と取り替える。
      いつも瑠璃の器から油を流し、碗や鍋を奪っては賭けの勝負をするのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-020"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聽言，心中暗道：「可憐啊！我弟子可是那等樣沒脊骨的和尚？」欲待要哭，又恐那寺裡的老和尚笑他，但暗暗扯衣揩淚，忍氣吞聲，急走出去，見了三個徒弟。那行者見師父面上含怒，向前問：「師父，寺裡和尚打你來？」唐僧道：「不曾打。」八戒說：「一定打來；不是，怎麼還有些哭包聲？」那行者道：「罵你來？」唐僧道：「也不曾罵。」行者道：「既不曾打，又不曾罵，你這般苦惱怎麼？好道是思鄉哩？」唐僧道：「徒弟，他這裡不方便。」行者笑道：「這裡想是道士？」唐僧怒道：「觀裡才有道士，寺裡只是和尚。」行者道：「你不濟事。但是和尚，即與我們一般。常言道：『既在佛會下，都是有緣人。』你且坐，等我進去看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      三蔵はそれを聞き、心の中で思った。三蔵（心の声）「ああ、情けない。私は、そんな恥知らずな和尚だというのか。」
      泣きたかったが、寺の老僧に笑われるのを恐れ、ひそかに衣を引いて涙を拭った。怒りも声も飲み込み、急いで外へ出て、三人の弟子に会った。悟空は師の顔に怒りが浮かんでいるのを見て、進み寄った。悟空「お師匠さま、寺の和尚に殴られたのですか。」
      三蔵「殴られてはいない。」
      八戒「いや、きっと殴られたんだ。でなければ、どうしてまだ泣き声なのです。」
      悟空「罵られたのですか。」
      三蔵「罵られてもいない。」
      悟空「殴られも罵られもしないのに、どうしてそんなに苦しんでいるのです。まさか、故郷が恋しくなったのですか。」
      三蔵「弟子よ、ここは都合が悪いのだそうだ。」
      悟空は笑った。悟空「ここにいるのは、道士なのでしょうか。」
      三蔵は怒って言った。三蔵「道士がいるのは道観だ。寺にいるのは和尚だけだ。」
      悟空「お師匠さまは頼りになりませんね。和尚なら、私たちと同じじゃありませんか。『仏の会座にいる者は、みな縁のある人』と言います。座ってお待ちください。私が中を見てきましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-021"

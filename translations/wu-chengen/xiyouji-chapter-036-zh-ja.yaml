  "known_gaps":
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-003"
      "description_ja": "三蔵の「四五個年頭」は四、五年とし、他の回の旅程から年数を訂正しない。悟空の大門・堂屋・天地の比喩と、弟子二人の冗談を別々の発話として保持した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-005"
      "description_ja": "底本の「\U00024731」は「豝」の異体で、雌の猪の意に採った。識典古籍が掲げる『康熙字典』「本又作豝」と『説文解字注』「牝豕也」、および同サイトの『西遊記』諸本の用例を照合した。「屹\U00021DA7」は峰が高くそびえる意味に採り、原字を別版へ訂正していない。参照：https://www.shidianguji.com/character/\U00024731 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-006"
      "description_ja": "益智・王不留行・三棱子・馬兜鈴・荊芥・茯苓・防己・竹瀝・茴香の九つの薬名を織り込む詩。薬名と、その文字・音による取経の旅への掛詞を両方残した。薬の効能を説明する詩ではない。「登山盟」は底本の山に登る誓いとして読み、「登壇」等へ訂正しない。「荊芥」は経を求め、「茯苓」は仏を拝むという掛詞と解したが、日本語の音で同じ効果は再現できない。「竹瀝」は竹を熱して得る液の清らかさに掛けたものとした。参照：泉州市正骨医院《西游记》中的药名诗词（https://www.qzzg.cn/paper/Html/2002-07-15/288.html）。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-008"
      "description_ja": "夕景詩は十・九・八・七・六・五・四・三・二・一を順に織り込む。八河・七千州県・六宮五府は詩の数詞表現として保持し、実在の行政組織や統計に合わせて修正していない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-010"
      "description_ja": "寺院詩の堂宇名、曇花・貝葉・三宝・梵王の仏教的景物をすべて保持した。「川川道道喜迴迎」は川ごと道ごとに喜んで迎える風情と解したが、建物の配置や具体的な儀式を補わない。「步虛」の道教的な語感も底本にあるため、寺だからという理由で名称を変更しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-012"
      "description_ja": "「敕建寶林寺」は皇帝の命で建てられた宝林寺という五文字の額。三蔵が字をまだ見ていないことと、直前に夕日が沈んだ語りがあることは、独自に時刻を整合させず保持する。寺名は塵を払って読めた時点で初めて示した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-015"
      "description_ja": "四天王の列挙は底本どおり持国・多聞・増長・広目、方位も東・北・西・南の順を保持した。一般的な四天王と方位の対応に合わせて並べ替えない。「倒座觀音」は本尊の背面側に据えた観音像と解し、像が上下逆さまという意味にはしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-016"
      "description_ja": "この「道人」は本人が説明する掃除・鐘つきなどの寺の雑務役で、道教の道士ではない。日本語の通常呼称を寺男とし、自称では道人を残した。夕香の寺男が最初の寺男と同じ人物であるとは断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-017"
      "description_ja": "「二十五條達摩衣」は袈裟の条数を二十五とし、「達公鞋」は僧の靴の呼び名として保持した。前者の達摩、後者の達公を本回の登場人物に増やさない。「少打」は打つ回数を少なくする意味ではなく、叱責の「打たれ足りない」と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-018"
      "description_ja": "「孤拐」は頬骨・足首などを表すが、鉄棒で打って折るこの箇所は足の骨と解した。後の悟空の「孤拐臉」は頬骨であり、同じ訳語へ機械的に統一しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-019"
      "description_ja": "院主が語る旅僧の七、八年の居座りと悪行は、院主の非難として保持した。「牙香」は上等の香の意、「琉璃」は油を入れた瑠璃の器と解した。原文にない正式な香の品種や灯具名へは特定していない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-022"
      "description_ja": "寺男の「沒脊骨」は背骨が物理的にないという観察ではなく、道理をわきまえない者への悪口として訳した。前に三蔵が嘆く同語も恥知らずの意である。悟空の外見を別の生物へ変える説明にはしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-023"
      "description_ja": "「屬螃蟹」は十二支に蟹があるかのような滑稽な言い方として、蟹年生まれの比喩を保持した。「七高八低」は顔のでこぼこを誇張する表現で、七・八の数も訳に残した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-025"
      "description_ja": "方丈など全体で三百間未満、老若四、五百人、二百八十五房に度牒を持つ僧が五百人という異なる数え方をそのまま保った。悟空が打ち砕くのは石の獅子であり、和尚を打ったとは補わない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-026"
      "description_ja": "「這早還不晚哩」は、まだ晩にはなっていないのにという、定時外の鐘への疑問として採った。すでに日暮れという先行叙述に合わせて台詞を修正していない。「一裹窮」は衣をひと包み巻いた貧乏者の冗談を含むため「貧乏ひと包み」とした。特定の正式な僧衣の名称ではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-028"
      "description_ja": "院主の「徒弟」は弟子への呼びかけとして残した。肉食の問いと、悟空の「胎裡素」はその場の応答のまま保持した。悟空らの過去の食歴を独自に修正する語りではない。一石の米を求める八戒の誇張も、現代の重量へ換算せず残した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-032"
      "description_ja": "月の詩は十聯すべてを保持した。「促晚奩」は、化粧箱を表す奩を化粧の営みと捉え、夜の化粧を急がせる意に解した。原文にない片づける動作や、特定の女性・事件は補わない。庾亮の詩が晋史に伝わるという言い方は底本のまま残し、別の典故へ改作しない。『白雪』はこの詩では古い楽曲・高雅な歌の意と解し、内丹の象徴語である同名の辞書項目とは区別した。「健有仙」は月光の清健な仙趣を言うものと解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-033"
      "description_ja": "月の三十日、三日、八日、十五日、十六日、二十二日の陰陽消長は物語中の内丹説であり、現代の天文学や月齢へ訂正していない。二八は陰陽各八両を合わせる象徴として、劉一明『西遊記百回詳注』第三十六回の説明を参照した。九九も修行の満成を表す数として残し、修行期間を日数で新たに限定していない。後世の道教的注釈は原著の唯一の意味と保証せず、語義理解の比較資料として用いた。参照：https://zh.wikisource.org/w/index.php?title=西遊記百回詳注/36&oldid=2578355 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-034"
      "description_ja": "沙悟浄の「弦前屬陽、弦後屬陰」は弦前・弦後のまま保持し、悟空の説明に合わせて語順や陰陽を直していない。土母は水火を調和させる土の働き、三家はその水・火・土の三者と解する。通常の発言者名を象徴語へ切り替えない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-036"
      "description_ja": "「還滿三塗業」は三つの苦しい境界へ至る業の報いを償い尽くす意に採った。「まだ三塗の業だらけ」と、還を再び・まだの意に取る訳にはしていない。「擺尾搖頭」は豚の姿に即した尾と頭の動きを残し、語り手が三蔵に実際の尾があると説明したことにはしない。末二句には主語の省略があるため、誰だけが昇天するのかを新たに限定しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch36-1455585"
      "segment_ids":
        - "xy-ch36-037"
      "description_ja": "悟空が三蔵の読経をからかう問いと、三蔵の復習の理由を両方残した。「銀缸」は銀の灯火とし、容器を水甕などへ読み替えない。 本文の欠落ではなく解釈・校訂上の留保。"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾僧卻又禮拜。三藏道：「院主請起，再不必行禮，作踐貧僧，我和你都是佛門弟子。」僧官道：「老爺是上國欽差，小和尚有失迎接。今到荒山，奈何俗眼不識尊儀，與老爺邂逅相逢。動問老爺：一路上是吃素？是吃葷？我們好去辦飯。」三藏道：「吃素。」僧官道：「徒弟，這個爺爺好的吃葷。」行者道：「我們也吃素，都是胎裡素。」那和尚道：「爺爺呀！這等兇漢也吃素？」有一個膽量大的和尚，近前又問：「老爺既然吃素，煮多少米的飯方夠吃？」八戒道：「小家子和尚，問甚麼？一家煮上一石米。」那和尚都慌了，便去刷洗鍋灶，各房中安排茶飯。高掌明燈，調開桌椅，管待唐僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 181
        "line_end": 181
    "translation_ja": |-
      僧たちはまた拝礼した。三蔵「院主さま、お立ちください。もう礼は結構です。この貧僧が恐縮してしまいます。あなたも私も、同じ仏門の弟子ですから。」
      院主「和尚さまは、上国の天子さまが遣わされたお使い。それを出迎えもせず、失礼いたしました。この粗末な山へお越しくださったのに、俗な目で尊いお姿を見分けられず、思いがけないお出会いとなりました。お尋ねしますが、道中は精進料理を召し上がるのでしょうか、それとも肉を。食事の用意をいたしますので。」
      三蔵「精進料理です。」
      院主「弟子よ、こちらのお方は、きっと肉を召し上がるだろう。」
      悟空「俺たちも精進だ。皆、母の胎内からずっとそうだ。」
      院主「お方さま、こんな恐ろしい方々まで、精進なさるのですか。」
      一人、肝の据わった僧が近寄り、さらに尋ねた。僧「皆さまが精進なさるのでしたら、米はどれほど炊けば足りますでしょう。」
      八戒「けちくさい和尚だな。何を聞く。一房で一石ずつ炊けばいい。」
      僧たちは皆、慌てて鍋やかまどを洗いに行き、各房で茶と食事の支度をした。明るい灯を高く掲げ、机と椅子を並べて、三蔵をもてなした。
    "translation_status": "reviewed"
  - "id": "xy-ch36-029"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們都吃罷了晚齋，眾僧收拾了家火。三藏稱謝道：「老院主，打攪寶山了。」僧官道：「不敢，不敢。怠慢，怠慢。」三藏道：「我師徒卻在這裡安歇？」僧官道：「老爺不要忙，小和尚自有區處。」叫：「道人，那壁廂有幾個人聽使令的？」道人說：「師父，有。」僧官吩咐道：「你們著兩個去安排草料，與唐老爺喂馬。著幾個去前面把那三間禪堂，打掃乾淨鋪設床帳，快請老爺安歇。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 183
        "line_end": 183
    "translation_ja": |-
      師弟が夕べの精進料理を食べ終えると、僧たちは食器を片づけた。三蔵は礼を言った。三蔵「院主さま、お寺にお邪魔をしました。」
      院主「とんでもない、とんでもない。お粗末さまでございました。」
      三蔵「私たちは、ここで休ませていただくのでしょうか。」
      院主「和尚さま、お急ぎにならずに。私のほうでよいようにいたします。」
      院主は呼びかけた。院主「寺男、あちらには、言いつけを受ける者が何人かいるか。」
      寺男「お師匠さま、おります。」
      院主「二人は草と飼葉を用意して、唐の和尚さまの馬に食べさせよ。何人かは前の三間の禅堂をきれいに掃除し、寝台と帳を整えて、早く和尚さまにお休みいただけ。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-030"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那些道人聽命，各各整頓齊備，卻來請唐老爺安寢。他師徒們牽馬挑擔，出方丈，徑至禪堂門首看處，只見那裡面燈火光明，兩梢間鋪著四張藤屜床。行者見了，喚那辦草料的道人，將草料擡來，放在禪堂裡面，拴下白馬，教道人都出去。三藏坐在中間。燈下，兩班兒立五百個和尚，都伺候著，不敢撤離。三藏欠身道：「列位請回，貧僧好自在安寢也。」眾僧決不敢退。僧官上前，吩咐大眾：「伏侍老爺安置了再回。」三藏道：「即此就是安置了，都就請回。」眾人卻才敢散去訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      寺男たちは命を受け、めいめい用意をすべて整えてから、三蔵に休むよう案内した。師弟は馬を引き、荷を担いで方丈を出て、まっすぐ禅堂の入口へ来た。見ると、中は灯火で明るく、両端の部屋には、藤を編んで張った寝台が四つ並んでいた。悟空は、飼葉の用意をした寺男を呼んで、それを禅堂の中へ運ばせ、白馬をつなぎ、寺男たちを皆外へ出した。三蔵は真ん中に座った。灯の下には五百人の和尚が二列に立ち並び、みな伺候して、恐ろしくて誰もその場を離れられない。三蔵は腰を浮かせた。三蔵「皆さん、お戻りください。私も気楽に休みたいので。」
      それでも、僧たちは退く勇気がなかった。院主が前へ出て、一同に命じた。院主「和尚さまのお休みの支度をお世話してから戻るのだ。」
      三蔵「これでもう支度はできています。どうぞ皆さん、お戻りください。」
      僧たちは、そこでようやく立ち去った。
    "translation_status": "reviewed"
  - "id": "xy-ch36-031"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧舉步出門小解，只見明月當天，叫：「徒弟。」行者、八戒、沙僧都出來侍立。因感這月清光皎潔，玉宇深沉，真是一輪高照，大地分明。對月懷歸，口占一首古風長篇。詩云："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 186
        "line_end": 186
    "translation_ja": |-
      三蔵は用を足しに外へ出ると、明るい月が空の真上にあった。三蔵「弟子たち。」
      悟空、八戒、沙悟浄が皆出てきて、そばに立った。三蔵は、月の光が清らかに白く、玉のような大空が深く澄んでいるのに心を動かされた。まことに一輪の月が高く照り、大地がくっきりと見えていた。月に向かって帰郷を思い、長い古風の詩を、その場で口ずさんだ。その詩はこうである。
    "translation_status": "reviewed"
  - "id": "xy-ch36-032"
    "section_id": "chapter-36"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      皓魄當空寶鏡懸，山河搖影十分全。
      瓊樓玉宇清光滿，冰鑑銀盤爽氣旋。
      萬里此時同皎潔，一年今夜最明鮮。
      渾如霜餅離滄海，卻似冰輪掛碧天。
      別館寒窗孤客悶，山村野店老翁眠。
      乍臨漢苑驚秋鬢，才到秦樓促晚奩。
      庾亮有詩傳晉史，袁宏不寐泛江船。
      光浮杯面寒無力，清映庭中健有仙。
      處處窗軒吟白雪，家家院宇弄冰弦。
      今宵靜玩來山寺，何日相同返故園？
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 188
        "line_end": 197
    "translation_ja": |-
      三蔵「白い月は空に宝の鏡を掛け、山河に影を揺らして、完全に満ちている。
      宝玉の楼と宮には清光が満ち、氷の鏡、銀の盤のまわりに爽やかな気が巡る。
      万里のかなたも、今は同じように明るく白い。一年のうちでも、今夜が最も鮮やかに輝く。
      まるで霜の餅が青い海を離れたよう、さながら氷の輪を碧い空へ掛けたようだ。
      旅の宿の寒い窓には、独りの客がもの思いに沈み、山村の野の宿では、老翁が眠る。
      漢（かん）の苑を照らしては、秋のように白い鬢に驚かせ、秦（しん）の楼に届いては、夜の化粧を急がせる。
      庾亮（ゆりょう）の詩は晋（しん）の史書に伝わり、袁宏（えんこう）は眠らず、川に船を浮かべた。
      杯の面に浮く光は、冷ややかで弱々しく、庭を清らかに照らす光には、健やかな仙人の気がある。
      あちこちの窓辺で白雪（はくせつ）の歌を吟じ、家々の庭では、氷のように澄んだ琴の弦を奏でる。
      今夜は山寺に来て静かに眺めているが、いつの日、同じこの月とともに故郷の園へ帰れるだろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-033"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      行者聞言，近前答曰：「師父啊，你只知月色光華，心懷故里，更不知月家之意，乃先天法象之規繩也。月至三十日，陽魂之金散盡，陰魄之水盈輪，故純黑而無光，乃曰『晦』。此時與日相交，在晦朔兩日之間，感陽光而有孕。至初三日一陽現，初八日二陽生，魄中魂半，其平如繩，故曰『上弦』。至今十五日，三陽備足，是以團圓，故曰『望』。至十六日一陰生，二十二日二陰生，此時魂中魄半，其平如繩，故曰『下弦』。至三十日三陰備足，亦當『晦』。此乃先天採煉之意。我等若能溫養二八，九九成功，那時節，見佛容易，返故田亦易也。詩曰：
      前弦之後後弦前，藥味平平氣象全。
      採得歸來爐裡煉，志心功果即西天。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 198
        "line_end": 201
    "translation_ja": |-
      悟空はそれを聞き、前へ出て答えた。悟空「お師匠さま、月の光の美しさだけを知り、故郷を懐かしんでおられる。けれど月に込められた意味が、先天（せんてん）の法にかたどる規準だということを、ご存じないのですね。
      月は三十日になると、陽の魂である金が散り尽くし、陰の魄（はく）である水が月輪いっぱいに満ちます。それで真っ黒になって光がなくなるので、これを『晦（かい）』と言います。このとき太陽と交わり、晦と朔（さく）の二日の間に、陽の光を感じて懐妊するのです。三日になると一つの陽が現れ、八日には二つの陽が生じ、魄の中の半分が魂となります。その境が墨縄のように平らなので、『上弦』と言います。今日の十五日には三つの陽がすべてそろうので、まるくなります。そこで『望（ぼう）』と言うのです。十六日になると一つの陰が生まれ、二十二日には二つの陰が生まれます。このときは魂の中の半分が魄となり、境が墨縄のように平らなので、『下弦』と言うのです。三十日になると三つの陰がすべてそろい、また『晦』になります。これが、先天の力を採り、練るということの意味です。私たちが二八（にはち）を温め養い、九九（きゅうきゅう）の功を成し遂げれば、そのときは仏に会うのも容易で、故郷に帰るのも容易になります。詩に言うとおりです。
      上弦の後、下弦の前、薬の性質は釣り合い、気のありさまもすべて整う。
      採って帰り、炉の中で練り上げ、心を尽くして功の実を得れば、そこが西天なのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-034"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      那長老聽說，一時解悟，明徹真言。滿心歡喜，稱謝了悟空。沙僧在傍笑道：「師兄此言雖當，只說的是弦前屬陽，弦後屬陰，陰中陽半，得水之金；更不道：
      水火相攙各有緣，全憑土母配如然。
      三家同會無爭競，水在長江月在天。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 203
        "line_end": 206
    "translation_ja": |-
      三蔵はそれを聞くと、たちまち悟り、まことの言葉を明らかに理解した。心から喜び、悟空に礼を言った。沙悟浄がそばで笑って言った。沙悟浄「兄貴のお言葉はもっともですが、それは、弦の前が陽に属し、弦の後が陰に属すること、陰の中の半ばが陽であり、水の中の金を得ることだけを説いたものです。まだ、こういうことをおっしゃっていません。
      水と火が混じり合うには、それぞれの縁があり、すべて土母（どぼ）の取り持ちで、そのように結び合わされる。
      三つのものが一つに集まれば、争い競うこともなく、水は長江（ちょうこう）に、月は空にあるのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-035"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      長老聞得，亦開茅塞。正是：
      理明一竅通千竅，說破無生即是仙。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 208
        "line_end": 210
    "translation_ja": |-
      三蔵はこれを聞いても、胸のつかえが取り払われた。まさに、
      一つの道理が明らかになれば、千の道理にも通じる。
      無生（むしょう）の理を説き明かせば、そのまま仙人なのである。
    "translation_status": "reviewed"
  - "id": "xy-ch36-036"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      八戒上前扯住長老道：「師父，莫聽亂講，誤了睡覺。這月啊：
      缺之不久又團圓，似我生來不十全。
      吃飯嫌我肚子大，拿碗又說有黏涎。
      他都伶俐修來福，我自痴愚積下緣。
      我說你取經還滿三塗業，擺尾搖頭直上天。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 212
        "line_end": 216
    "translation_ja": |-
      八戒が前へ出て、三蔵を引っ張った。八戒「お師匠さま、でたらめな話を聞いて、寝る暇をなくさないでください。この月だって、
      欠けてもすぐにまた満ちるが、十全でないところは生まれつきの俺と同じだ。
      飯を食えば、俺の腹が大きすぎると嫌がられ、碗を持てば、よだれがつくと言われる。
      あいつらは利口で、修行して福を得るが、俺は愚かで、縁を積んできたのさ。
      俺に言わせりゃ、お師匠さまの経取りで三塗（さんず）の業を償い尽くせば、尾を振り頭を揺すって、まっすぐ天へ上がれるのさ。」
    "translation_status": "reviewed"
  - "id": "xy-ch36-037"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏道：「也罷，徒弟們走路辛苦，先去睡下。等我把這卷經來念一念。」行者道：「師父差了。你自幼出家，做了和尚，小時的經文，那本不熟？卻又領了唐王旨意，上西天見佛，求取大乘真典。如今功未完成，佛未得見，經未曾取，你念的是那卷經兒？」三藏道：「我自出長安，朝朝跋涉，日日奔波，小時的經文恐怕生了。幸今夜得閑，等我溫習溫習。」行者道：「既這等說，我們先去睡也。」他三人各往一張藤床上睡下。長老掩上禪堂門，高剔銀缸，鋪開經本，默默看念。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 218
        "line_end": 218
    "translation_ja": |-
      三蔵「それもそうだ。弟子たち、道中で疲れただろう。先に休みなさい。私はこの一巻の経を読もう。」
      悟空「お師匠さま、それは違いますよ。幼いころから出家して和尚になり、子供のころの経文なら、どれだってよく覚えているでしょう。そのうえ唐王の命を受け、西天で仏に会い、大乗（だいじょう）のまことの経を授かりに行くのです。今はまだ功も成らず、仏にも会わず、経も手に入れていない。いったい、どの一巻を読もうというのです。」
      三蔵「長安を出てから、毎朝旅を続け、毎日奔走してきたから、幼いころの経文も、忘れかけているかもしれぬ。幸い今夜は暇があるので、復習しておこうと思うのだ。」
      悟空「そういうことなら、私たちは先に休みます。」
      三人は、それぞれ一つずつ藤の寝台へ行って横になった。三蔵は禅堂の戸を閉め、銀の灯の芯を高くかき立て、経本を広げて、静かに読んだ。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch36-038"
    "section_id": "chapter-36"
    "kind": "verse"
    "origin": "source"
    "source_text": "樓頭初鼓人煙靜，野浦漁舟火滅時。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 220
        "line_end": 220
    "translation_ja": |-
      楼の上に初更の太鼓が響き、人家は静まり返る。
      野の船着き場では、漁船の火が消えるころであった。
    "translation_status": "reviewed"
  - "id": "xy-ch36-039"
    "section_id": "chapter-36"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知那長老怎麼樣離寺，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 222
        "line_end": 222
    "translation_ja": "さて、三蔵がどのようにこの寺を去ることになるのか。それは次の回でお聞きいただこう。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-01-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵の「四五個年頭」は四、五年とし、他の回の旅程から年数を訂正しない。悟空の大門・堂屋・天地の比喩と、弟子二人の冗談を別々の発話として保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-02-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「\U00024731」は「豝」の異体で、雌の猪の意に採った。識典古籍が掲げる『康熙字典』「本又作豝」と『説文解字注』「牝豕也」、および同サイトの『西遊記』諸本の用例を照合した。「屹\U00021DA7」は峰が高くそびえる意味に採り、原字を別版へ訂正していない。参照：https://www.shidianguji.com/character/\U00024731"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-03-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "益智・王不留行・三棱子・馬兜鈴・荊芥・茯苓・防己・竹瀝・茴香の九つの薬名を織り込む詩。薬名と、その文字・音による取経の旅への掛詞を両方残した。薬の効能を説明する詩ではない。「登山盟」は底本の山に登る誓いとして読み、「登壇」等へ訂正しない。「荊芥」は経を求め、「茯苓」は仏を拝むという掛詞と解したが、日本語の音で同じ効果は再現できない。「竹瀝」は竹を熱して得る液の清らかさに掛けたものとした。参照：泉州市正骨医院《西游记》中的药名诗词（https://www.qzzg.cn/paper/Html/2002-07-15/288.html）。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-04-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "夕景詩は十・九・八・七・六・五・四・三・二・一を順に織り込む。八河・七千州県・六宮五府は詩の数詞表現として保持し、実在の行政組織や統計に合わせて修正していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-05-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "寺院詩の堂宇名、曇花・貝葉・三宝・梵王の仏教的景物をすべて保持した。「川川道道喜迴迎」は川ごと道ごとに喜んで迎える風情と解したが、建物の配置や具体的な儀式を補わない。「步虛」の道教的な語感も底本にあるため、寺だからという理由で名称を変更しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-06-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「敕建寶林寺」は皇帝の命で建てられた宝林寺という五文字の額。三蔵が字をまだ見ていないことと、直前に夕日が沈んだ語りがあることは、独自に時刻を整合させず保持する。寺名は塵を払って読めた時点で初めて示した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-07-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "四天王の列挙は底本どおり持国・多聞・増長・広目、方位も東・北・西・南の順を保持した。一般的な四天王と方位の対応に合わせて並べ替えない。「倒座觀音」は本尊の背面側に据えた観音像と解し、像が上下逆さまという意味にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-08-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この「道人」は本人が説明する掃除・鐘つきなどの寺の雑務役で、道教の道士ではない。日本語の通常呼称を寺男とし、自称では道人を残した。夕香の寺男が最初の寺男と同じ人物であるとは断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-09-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「二十五條達摩衣」は袈裟の条数を二十五とし、「達公鞋」は僧の靴の呼び名として保持した。前者の達摩、後者の達公を本回の登場人物に増やさない。「少打」は打つ回数を少なくする意味ではなく、叱責の「打たれ足りない」と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-10-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「孤拐」は頬骨・足首などを表すが、鉄棒で打って折るこの箇所は足の骨と解した。後の悟空の「孤拐臉」は頬骨であり、同じ訳語へ機械的に統一しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-11-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "院主が語る旅僧の七、八年の居座りと悪行は、院主の非難として保持した。「牙香」は上等の香の意、「琉璃」は油を入れた瑠璃の器と解した。原文にない正式な香の品種や灯具名へは特定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-12-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "寺男の「沒脊骨」は背骨が物理的にないという観察ではなく、道理をわきまえない者への悪口として訳した。前に三蔵が嘆く同語も恥知らずの意である。悟空の外見を別の生物へ変える説明にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-13-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「屬螃蟹」は十二支に蟹があるかのような滑稽な言い方として、蟹年生まれの比喩を保持した。「七高八低」は顔のでこぼこを誇張する表現で、七・八の数も訳に残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-14-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "方丈など全体で三百間未満、老若四、五百人、二百八十五房に度牒を持つ僧が五百人という異なる数え方をそのまま保った。悟空が打ち砕くのは石の獅子であり、和尚を打ったとは補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-15-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「這早還不晚哩」は、まだ晩にはなっていないのにという、定時外の鐘への疑問として採った。すでに日暮れという先行叙述に合わせて台詞を修正していない。「一裹窮」は衣をひと包み巻いた貧乏者の冗談を含むため「貧乏ひと包み」とした。特定の正式な僧衣の名称ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-16-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "院主の「徒弟」は弟子への呼びかけとして残した。肉食の問いと、悟空の「胎裡素」はその場の応答のまま保持した。悟空らの過去の食歴を独自に修正する語りではない。一石の米を求める八戒の誇張も、現代の重量へ換算せず残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-17-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "月の詩は十聯すべてを保持した。「促晚奩」は、化粧箱を表す奩を化粧の営みと捉え、夜の化粧を急がせる意に解した。原文にない片づける動作や、特定の女性・事件は補わない。庾亮の詩が晋史に伝わるという言い方は底本のまま残し、別の典故へ改作しない。『白雪』はこの詩では古い楽曲・高雅な歌の意と解し、内丹の象徴語である同名の辞書項目とは区別した。「健有仙」は月光の清健な仙趣を言うものと解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-18-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "月の三十日、三日、八日、十五日、十六日、二十二日の陰陽消長は物語中の内丹説であり、現代の天文学や月齢へ訂正していない。二八は陰陽各八両を合わせる象徴として、劉一明『西遊記百回詳注』第三十六回の説明を参照した。九九も修行の満成を表す数として残し、修行期間を日数で新たに限定していない。後世の道教的注釈は原著の唯一の意味と保証せず、語義理解の比較資料として用いた。参照：https://zh.wikisource.org/w/index.php?title=西遊記百回詳注/36&oldid=2578355"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-19-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "沙悟浄の「弦前屬陽、弦後屬陰」は弦前・弦後のまま保持し、悟空の説明に合わせて語順や陰陽を直していない。土母は水火を調和させる土の働き、三家はその水・火・土の三者と解する。通常の発言者名を象徴語へ切り替えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-20-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「還滿三塗業」は三つの苦しい境界へ至る業の報いを償い尽くす意に採った。「まだ三塗の業だらけ」と、還を再び・まだの意に取る訳にはしていない。「擺尾搖頭」は豚の姿に即した尾と頭の動きを残し、語り手が三蔵に実際の尾があると説明したことにはしない。末二句には主語の省略があるため、誰だけが昇天するのかを新たに限定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch36-note-21-body"
    "section_id": "chapter-36"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空が三蔵の読経をからかう問いと、三蔵の復習の理由を両方残した。「銀缸」は銀の灯火とし、容器を水甕などへ読み替えない。"
    "translation_status": "reviewed"

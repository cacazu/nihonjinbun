    "kind": "verse"
    "origin": "source"
    "source_text": |-
      十里長亭無客走，九重天上現星辰。
      八河船隻皆收港，七千州縣盡關門。
      六宮五府回官宰，四海三江罷釣綸。
      兩座樓頭鐘鼓響，一輪明月滿乾坤。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch36-1455585"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第036回&oldid=1455585"
        "line_start": 136
        "line_end": 139
    "translation_ja": |-
      十里ごとの長亭（ちょうてい）にも、行く旅人はなく、九重の空には星々が姿を現す。
      八つの川の船はすべて港へ戻り、七千の州県は残らず門を閉ざす。
      六宮五府から役人たちは帰り、四海三江では釣り糸を収める。
      二つの楼の上から鐘と太鼓が響き、一輪の明月が天地を照らす。

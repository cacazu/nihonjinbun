      悟空はそれを聞くと、ふふんと冷ややかに笑った。悟空「お師匠さま、気に病むには及びません。そう焦らず、安心して先へお進みください。功が積もれば、自然と成し遂げられますよ。」
      師弟は山の景色を楽しみながら、足の向くままに進んだ。いつしか赤い太陽が、西へ沈んでいた。まさに、

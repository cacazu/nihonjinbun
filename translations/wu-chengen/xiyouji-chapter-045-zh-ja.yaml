  "source_text": "行者聽得老師父經文念盡，卻去耳朵內取出鐵棒，迎風幌了一幌，就有丈二長短，碗來粗細，將棍望空一指。那風婆婆見了，急忙扯開皮袋；巽二郎解放口繩。只聽得呼呼風響，滿城中揭瓦翻磚，揚砂走石。看起來，真個好風，卻比那尋常之風不同也。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 151
    "line_end": 151
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 26
  "translation_ja": "悟空は師が経を読み終えたのを聞くと、耳の中から鉄棒を取り出し、風に向かってひと振りした。すると長さは一丈二尺、太さは鉢ほどになった。その棒で空を一度指すと、風婆婆は見て取って、急いで皮袋を引き開け、巽二郎は口のひもを解いた。ごうごうと風が鳴り、城じゅうで瓦がはがれ、煉瓦がひっくり返り、砂が巻き上がり、石が転がった。見れば実に大した風で、普通の風とは比べものにならない。そのさまはこうだ。"
  "translation_status": "reviewed"
- "id": "xy-ch45-027"

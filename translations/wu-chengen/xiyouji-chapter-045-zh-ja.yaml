  "translation_ja": |-
    虎力大仙はいよいよあわて、香を足し、符を焼き、呪文を唱え、令牌を打ち下ろした。空には今度は四海竜王（しかいりゅうおう）がそろって押し寄せた。悟空が正面から一喝した。
    悟空「敖広（ごうこう）、どこへ行く！」
    敖広、敖順（ごうじゅん）、敖欽（ごうきん）、敖閏（ごうじゅん）は前へ出て礼をした。悟空はまた同じ事情を話した。
    悟空「以前は骨を折ってもらったが、うまくいかなかった。今日のことは、どうか力を貸してくれ。」
    四海竜王「仰せのとおりに、仰せのとおりにいたします。」
    悟空はさらに、西海（さいかい）の竜王である敖順へ礼を言った。
    悟空「先日は、ご子息が妖怪を縛ってお師匠さまを助けてくれて、ありがたかった。」
    西海の竜王「あの者はまだ海の中につないであり、勝手な処置はしておりません。ちょうど大聖（たいせい）さまのご裁きを仰ぎたいと思っておりました。」
    悟空「どう処置するかは、お前に任せる。今は俺が手柄を立てられるよう、助けてくれ。あの道士はもう令牌を四度鳴らしたから、今度は俺が上がってやる番だ。だが俺は、符を出したり檄文を焼いたり、令牌を鳴らしたりすることを知らぬ。皆に手助けをしてもらわねばならない。」
    鄧天君「大聖さまのお言いつけに、誰が背きましょう。ただ、合図を一つ決めていただけば、それに従って動けます。そうしなければ雷も雨も乱れ、大聖さまに手順がないように見えてしまいます。」
    悟空「それなら、この棒を合図にしよう。」
    雷公は仰天した。「大聖さま！　私どもがその棒に耐えられるものですか。」
    悟空「お前たちを打つんじゃない。俺が棒で上を一度指したら、風を吹かせるんだ。」
    風婆婆と巽二郎は、繰り返し答えた。「すぐに風を出します。」
    悟空「二度目に指したら、雲を広げろ。」
    推雲童子と布霧郎君「すぐに雲を広げます。雲を広げます。」
    悟空「三度目に指したら、雷を鳴らし、稲妻を光らせろ。」
    雷公と電母「承知いたしました。承知いたしました。」
    悟空「四度目に指したら、雨を降らせろ。」
    四海竜王「仰せのとおりに。仰せのとおりにいたします。」
    悟空「五度目に指したら、太陽の輝く晴天にするんだ。間違えるなよ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-024"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "吩咐已畢，遂按下雲頭，把毫毛一抖，收上身來。那些人肉眼凡胎，那裡曉得。行者遂在傍邊高叫道：「先生請了。四聲令牌俱已響畢，更沒有風雲雷雨，該讓我了。」那道士無奈，不敢久占，只得下了臺讓他。努著嘴，徑往樓上見駕。行者道：「等我跟他去，看他說些甚的。」只聽得那國王問道：「寡人這裡洗耳誠聽，你那裡四聲令響，不見風雨，何也？」道士云：「今日龍神都不在家。」行者厲聲道：「陛下，龍神俱在家，只是這國師法不靈，請他不來。等和尚請來你看。」國王道：「即去登壇，寡人還在此候雨。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 148
    "line_end": 148
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 24
  "translation_ja": |-
    言いつけを済ませると、悟空は雲を下り、毛をひと振りして本身へ戻した。そこにいた者たちは肉眼しか持たぬ凡人で、知るよしもなかった。悟空は傍らから大声で呼んだ。
    悟空「先生、どうぞお譲りください。令牌は四度とも鳴り終わったが、風も雲も雷も雨もない。俺に譲る番だ。」
    虎力大仙はどうにもならず、いつまでも居座るわけにもいかないので、やむなく台を下りて譲った。そして口をとがらせ、まっすぐ楼上へ国王に会いに行った。
    悟空「ついていって、何を言うか聞いてみよう。」
    すると国王が尋ねるのが聞こえた。
    国王「朕はここで耳を澄ましておりました。そちらで令牌が四度鳴ったのに、風も雨もなかったのは、なぜです。」
    虎力大仙「今日は竜神たちが皆、留守なのです。」
    悟空は声を張り上げた。「陛下、竜神たちは皆、家におります。ただ、この国師の法が利かず、呼び出せないだけです。僧の私が呼んでお見せしましょう。」
    国王「すぐに祭壇へ上がれ。朕はここで雨を待とう。」
  "translation_status": "reviewed"
- "id": "xy-ch45-025"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者得旨，急抽身到壇所，扯著唐僧道：「師父請上臺。」唐僧道：「徒弟，我卻不會祈雨。」八戒笑道：「他害你了，若還沒雨，拿上柴蓬，一把火了帳。」行者道：「你不會求雨，好的會念經。等我助你。」那長老才舉步登壇，到上面，端然坐下，定性歸神，默念那《密多心經》。正坐處，忽見一員官飛馬來問：「那和尚，怎麼不打令牌，不燒符檄？」行者高聲答道：「不用！不用！我們是靜功祈禱。」那官去回奏不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 150
    "line_end": 150
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 25
  "translation_ja": |-
    悟空は勅命を受けると、急いで祭壇へ戻り、三蔵の手を引いた。
    悟空「お師匠さま、台へお上がりください。」
    三蔵「悟空、私には雨乞いはできないのだ。」
    八戒は笑った。「お師匠さま、はめられましたね。雨が降らなけりゃ、柴の山に載せられて、一焼きでおしまいですよ。」
    悟空「雨乞いはできなくても、お経ならお唱えになれますね。私がお手伝いします。」
    そこで三蔵は祭壇に上がり、上で端正に座り、心を静め、精神を一つに収めて、黙々と『密多心経（みったしんぎょう）』を唱えた。そうして座っていると、一人の役人が馬を飛ばして来て尋ねた。
    役人「そこの和尚、なぜ令牌を鳴らさず、符や檄文を焼かないのです。」
    悟空は大声で答えた。「いらぬ、いらぬ！　俺たちは静かに心を修めて祈っているのだ。」
    役人は戻って報告したが、その話はおいておこう。
  "translation_status": "reviewed"

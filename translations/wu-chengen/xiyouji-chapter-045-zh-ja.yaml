  "source_text": "推雲童子，佈霧郎君。推雲童子顯神威，骨都都觸石垂天；佈霧郎君施法力，濃漠漠飛煙蓋地。茫茫三市暗，冉冉六街昏。因風離海上，隨雨出崑崙。頃刻漫天地，須臾蔽世塵。宛然如混沌，不見鳳樓門。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 159
    "line_end": 159
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 30
  "translation_ja": |-
    推雲童子、布霧郎君。
    推雲童子は神威を示し、雲はもくもく岩に触れ、天から垂れ下がる。
    布霧郎君は法力を施し、霧は濃い煙となって飛び、地を覆う。
    三市は茫々と暗くなり、六街はしだいに暮れてゆく。
    風に乗って海上を離れ、雨とともに崑崙（こんろん）を出る。
    たちまち天地いっぱいに広がり、あっという間に塵の世を覆い隠す。
    さながら天地の分かれる前の混沌、五鳳楼の門さえ見えぬ。
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "那沉雷護閃，乒乒乓乓，一似那地裂山崩之勢。諕得那滿城人，戶戶焚香，家家化紙。孫行者高呼：「老鄧，仔細替我看那貪贓壞法之官、忤逆不孝之子，多打死幾個示眾。」那雷越發振響起來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 166
    "line_end": 166
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 34
  "translation_ja": |-
    重い雷が稲妻を伴い、ばんばん、どんどんと鳴り響き、まるで地が裂け山が崩れるようだった。城じゅうの人々は恐れ、家ごとに香をたき、紙銭を焼いた。悟空は大声で呼んだ。
    悟空「鄧（とう）さん、よく見てくれ。賄賂をむさぼって法を破る役人や、親に逆らう不孝者を、何人も打ち殺して見せしめにするんだ。」
    雷はますます激しく鳴り響いた。
  "translation_status": "reviewed"
- "id": "xy-ch45-035"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻又把鐵棒望上一指。只見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 168
    "line_end": 168
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 35
  "translation_ja": "悟空はまた鉄棒で上を指した。すると、"
  "translation_status": "reviewed"
- "id": "xy-ch45-036"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "龍施號令，雨漫乾坤。勢如銀漢傾天塹，疾似雲流過海門。樓頭聲滴滴，窗外響瀟瀟。天上銀河瀉，街前白浪滔。淙淙如瓮撿，滾滾似盆澆。孤莊將漫屋，野岸欲平橋。真個桑田變滄海，霎時陸岸滾波濤。神龍藉此來相助，擡起長江望下澆。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 170
    "line_end": 170
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 36
  "translation_ja": |-
    竜は号令を下し、雨は天地を満たす。
    勢いは天の川（あまのがわ）が空の濠から傾れ落ちるよう、速さは雲が海の入り口を流れ過ぎるよう。
    楼の屋根にはぱたぱたと落ち、窓の外にはざあざあと響く。
    天上から銀河が流れ落ち、通りの前には白波があふれる。
    どどっと、かめから注ぐかのよう、ざあざあと、たらいをぶちまけるよう。
    一軒離れた農家は屋根まで浸りかねず、野の川岸では水が橋の高さまで迫る。
    まことに桑畑も大海と変わり、たちまち陸地にも波がうねる。
    神竜たちはこうして助けに来て、長江（ちょうこう）を持ち上げ、上から注ぎかけるのだ。
  "translation_status": "reviewed"
- "id": "xy-ch45-037"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這場雨自辰時下起，只下到午時前後；下得那車遲城裡裡外外，水漫了街衢。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 172
    "line_end": 172
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 37
  "translation_ja": "この雨は辰（たつ）の刻に降り始め、午（うま）の刻ごろまで降り続いた。車遅城（しゃちじょう）の内も外も、通りいっぱいに水があふれた。"
  "translation_status": "reviewed"
- "id": "xy-ch45-038"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王傳旨道：「雨夠了，雨夠了；十分再多，又渰壞了禾苗，反為不美。」五鳳樓下聽事官策馬冒雨來報：「聖僧，雨夠了。」行者聞言，將金箍棒往上又一指。只見霎時間，雷收風息，雨散雲收。國王滿心歡喜，文武盡皆稱贊道：「好和尚！這正是『強中更有強中手』。就是我國師求雨雖靈，若要晴，細雨兒還下半日，便不清爽。怎麼這和尚要晴就晴，頃刻間杲杲日出，萬里就無雲也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 173
    "line_end": 173
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 38
  "translation_ja": |-
    国王は命を伝えた。
    国王「もう十分だ、もう十分だ。これ以上降ると、今度は苗を水浸しにしてしまい、かえってよくない。」
    五鳳楼の下で控えていた役人が、雨を冒して馬を走らせ、知らせに来た。
    役人「聖僧さま、雨はもう十分でございます。」
    悟空は聞くと、金箍棒で上をもう一度指した。すると、たちまち雷は収まり、風はやみ、雨は散り、雲も消えた。国王は心から喜び、文武の官たちも口々に褒めた。
    文武の官たち「見事な和尚だ！　まさに『強い者の上には、さらに強い者がいる』ということだ。国師の雨乞いも霊験はあるが、晴れさせようとしても、細かい雨がまだ半日は降って、すっきりとはしない。それがこの和尚は、晴れろと思えばすぐに晴れる。ほんの一瞬で日が明るく差し、万里に雲一つなくなるとは！」
  "translation_status": "reviewed"
- "id": "xy-ch45-039"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王教回鑾，倒換關文，打發唐僧過去。正用御寶時，又被那三個道士上前阻住道：「陛下，這場雨全非和尚之功，還是我道門之力。」國王道：「你才說龍王不在家，不曾有雨；他走上去，以靜功祈禱，就雨下來，怎麼又與他爭功，何也？」虎力大仙道：「我上壇發了文書，燒了符檄，擊了令牌，那龍王誰敢不來？想是別方召請，風、雲、雷、雨五司俱不在，一聞我令，隨趕而來，適遇著我下他上，一時撞著這個機會，所以就雨。從根算來，還是我請的龍，下的雨，怎麼算作他的功果？」那國王昏亂，聽此言，卻又疑惑未定。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 175
    "line_end": 175
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 39
  "translation_ja": |-
    国王は宮殿へ戻り、通行証を認証して三蔵を通すよう命じた。まさに御璽を押そうとしたとき、また三人の道士が進み出て阻んだ。
    三人の道士「陛下、今の雨は僧の手柄ではまったくありません。やはり私ども道門の力です。」
    国王「先ほどは竜王が留守なので雨が降らぬと申したではありませんか。あの者が上がって、静かな祈りをすると雨が降ってきたのに、どうしてまた手柄を争うのです。」
    虎力大仙「私が祭壇に上がり、文書を出し、符や檄文を焼き、令牌を打ったのですから、竜王が来ないわけがありません。おそらく、ほかの土地から呼ばれ、風、雲、雷、雨の五司はそろって留守だったのでしょう。私の命を聞き、すぐに追いついて来たものの、ちょうど私が下り、あの者が上がるところへ行き合わせたため、そこで雨が降ったのです。元をたどれば、やはり私が呼んだ竜が降らせた雨です。どうしてあの者の手柄になるのです。」
    判断の曇った国王は、この言葉を聞くと、また迷って決めかねた。
  "translation_status": "reviewed"
- "id": "xy-ch45-040"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者近前一步，合掌奏道：「陛下，這些傍門法術，也不成個功果，算不得我的他的。如今有四海龍王現在空中，我僧未曾發放，他還不敢遽退。那國師若能叫得龍王現身，就算他的功勞。」國王大喜道：「寡人做了二十三年皇帝，更不曾看見活龍是怎麼模樣。你兩家各顯法力，不論僧道，但叫得來的，就是有功；叫不出的，有罪。」那道士怎麼有那樣本事？就叫，那龍王見大聖在此，也不敢出頭。道士云：「我輩不能，你是叫來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 176
    "line_end": 176
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 40
  "translation_ja": |-
    悟空は一歩進み、合掌して奏した。
    悟空「陛下、このような傍流の術など大した修行の功にもなりませんし、私の手柄だ、あの者の手柄だと言うほどのこともありません。今、四海竜王は空におります。私が帰れと命じていないので、すぐには退けないのです。国師が竜王を呼び、姿を現させられたなら、国師の手柄ということにしましょう。」
    国王は大いに喜んだ。「朕は二十三年、皇帝を務めてきたが、生きた竜がどんな姿か、まだ一度も見たことがない。双方で法力を示せ。僧でも道士でも構わぬ。呼び出せた者を功ありとし、呼び出せぬ者を罪ありとする。」
    道士たちに、そんな力があるはずもなかった。たとえ呼んだところで、竜王は悟空がここにいるのを見ているので、勝手には顔を出せなかった。
    道士「我々にはできぬ。お前が呼んでみよ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-041"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖仰面朝空，厲聲高叫：「敖廣何在？弟兄們都現原身來看。」那龍王聽喚，即忙現了本身，四條龍。在半空中度霧穿雲，飛舞向金鑾殿上。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 178
    "line_end": 178
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 41
  "translation_ja": |-
    悟空は顔を上げ、空へ向かって声を張り上げた。
    悟空「敖広はどこだ。兄弟そろって、本来の姿を見せてくれ。」
    竜王たちは呼び声を聞くや、急いで四匹の竜の本体を現した。空中で霧を渡り雲をくぐり、金鑾殿の上へ飛び舞ってきた。その姿は、
  "translation_status": "reviewed"
- "id": "xy-ch45-042"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "飛騰變化，遶霧盤雲。玉爪垂鉤白，銀鱗舞鏡明。髯飄素練根根爽，角聳軒昂挺挺清。磕額崔巍，圓睛晃亮。隱顯莫能測，飛揚不可評。禱雨隨時佈雨，求晴即便天晴。這才是有靈有聖真龍像，祥瑞繽紛遶殿庭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 180
    "line_end": 180
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 42
  "translation_ja": |-
    飛び騰がって変化し、霧を巡り、雲を巻く。
    玉の爪は白い鉤を垂らし、銀の鱗は鏡のように明るく舞う。
    ひげは白絹をなびかせて一本ずつ鮮やか、角は高々とそびえ、すっくりと澄む。
    額は山のように高く張り、丸い瞳はまばゆく輝く。
    隠れるも現れるも測り知れず、飛び舞うさまは言い尽くせぬ。
    雨を祈れば、時に応じて雨を降らせ、晴れを求めれば、たちまち天を晴らす。
    これこそ霊力も聖性もある真の竜の姿、めでたいしるしが華やかに殿庭を取り巻く。
  "translation_status": "reviewed"
- "id": "xy-ch45-043"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王在殿上焚香，眾公卿在階前禮拜。國王道：「有勞貴體降臨，請回。寡人改日醮謝。」行者道：「列位眾神各自歸去，這國王改日醮謝。」那龍王徑自歸海，眾神各各回天。這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 182
    "line_end": 182
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 43
  "translation_ja": |-
    国王は殿上で香をたき、公卿たちは階前で礼拝した。
    国王「尊い御身にお降りいただき、かたじけない。どうぞお帰りください。朕は後日、醮（しょう）を営んでお礼をいたします。」
    悟空「神々の皆さん、それぞれお帰りください。この国王が日を改めて醮を営み、お礼をするそうだ。」
    竜王はまっすぐ海へ帰り、神々も各々天へ戻った。まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch45-044"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "廣大無邊真妙法，至真了性劈傍門。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 184
    "line_end": 184
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 44
  "translation_ja": |-
    広大で果てしない、まことに妙なる法。
    至真（ししん）の境地に至り、本性を悟って、傍流の道を打ち破る。
  "translation_status": "reviewed"
- "id": "xy-ch45-045"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎麼除邪，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 186
    "line_end": 186
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 45
  "translation_ja": "さて、この先どうやって邪を除くのか。それは次回のお話。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-01-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []

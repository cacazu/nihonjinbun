  "source_text": "折柳傷花，摧林倒樹。九重殿損壁崩牆，五鳳樓搖梁撼柱。天邊紅日無光，地下黃砂有翅。演武廳前武將驚，會文閣內文官懼。三宮粉黛亂青絲，六院嬪妃蓬寶髻。侯伯金冠落繡纓，宰相烏紗飄展翅。當駕有言不敢談，黃門執本無由遞。金魚玉帶不依班，象簡羅衫無品敘。彩閣翠屏盡損傷，綠窗朱戶皆狼狽。金鑾殿瓦走磚飛，錦雲堂門歪槅碎。這陣狂風果是兇，刮得那君王父子難相會；六街三市沒人蹤，萬戶千門皆緊閉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 153
    "line_end": 153
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 27
  "translation_ja": |-
    柳を折り、花を傷つけ、林を砕き、木々を倒す。
    九重の御殿は壁を損ない塀を崩し、五鳳楼は梁を揺さぶり柱を震わす。
    天辺の紅い日は光を失い、地上の黄砂には翼が生える。
    演武庁（えんぶちょう）の前では武将が驚き、会文閣（かいぶんかく）の中では文官がおびえる。
    三宮の化粧した女たちは黒髪を乱し、六院の妃たちは飾りの髻を乱される。
    侯や伯の金冠からは錦の冠ひもが落ち、宰相の黒い紗の冠は羽根をひらめかせる。
    御前に控える者は言葉があっても口に出せず、黄門官は奏状を持っても差し出せぬ。
    金の魚符（ぎょふ）と玉の帯の官人も列に従えず、象牙の笏（しゃく）と薄絹の衣の官人も位の順を守れぬ。
    彩りの楼閣も翠の屏風もすっかり傷み、緑の窓も朱の戸もみな散々だ。
    金鑾殿では瓦が走り煉瓦が飛び、錦雲堂（きんうんどう）では扉が傾き格子が砕ける。
    このつむじ風はまことに凶暴、吹きつけられて君王と王子も会えぬほど。
    六街三市（ろくがいさんし）に人影はなく、千戸万戸の門は固く閉ざされる。
  "translation_status": "reviewed"

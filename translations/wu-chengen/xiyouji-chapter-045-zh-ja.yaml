    "source_sequence": 7
  "translation_ja": |-
    悟空は立ち上がって虎皮の腰巻きをまくり、臭い小便を花瓶いっぱいにした。八戒はそれを見て喜んだ。
    八戒「兄貴、何年も兄弟分をやってるが、こんないたずらはまだ一度もなかったな。俺もさっき食ったばかりで、ちょうどこれをしたかったんだ。」
    八戒が衣をまくると、どどっと、まるで呂梁洪（りょりょうこう）の堰板を倒したように流れ出し、ざあざあと陶鉢いっぱいに小便をした。沙悟浄も水がめ半分ほどを満たした。元どおり衣を整え、高い座にきちんと座ると、声がした。
    声の主「小仙たち、聖水を受け取れ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-008"

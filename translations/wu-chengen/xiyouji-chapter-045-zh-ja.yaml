  "translation_status": "reviewed"
- "id": "xy-ch45-002"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫大聖左手把沙和尚捻一把，右手把豬八戒捻一把，他二人卻就省悟。坐在高處，倥著臉，不言不語。憑那些道士點燈著火，前後照看，他三個就如泥塑金裝一般模樣。虎力大仙道：「沒有歹人，如何把供獻都吃了？」鹿力大仙道：「卻像人吃的勾當，有皮的都剝了皮，有核的都吐出核，卻怎麼不見人形？」羊力大仙道：「師兄勿疑。想是我們虔心敬意，在此晝夜誦經，前後申文，又是朝廷名號，斷然驚動天尊。想是三清爺爺聖駕降臨，受用了這些供養。趁今仙從未返，鶴駕在斯，我等可拜告天尊，懇求些聖水金丹，進與陛下，卻不是長生永壽，見我們的功果也？」虎力大仙道：「說的是。」教：「徒弟們動樂誦經。一壁廂取法衣來，等我步罡拜禱。」那些小道士俱遵命，兩班兒擺列齊整。噹的一聲磬響，齊念一卷《黃庭道德真經》。虎力大仙披了法衣，擎著玉簡，對面前舞蹈揚塵，拜伏於地，朝上啟奏道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 117
    "line_end": 117
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 2
  "translation_ja": |-
    さて、悟空（ごくう）は左手で沙悟浄（さごじょう）を、右手で八戒（はっかい）をつねった。二人もすぐに察し、高い座にすまして座り、口も利かずにいた。道士たちが灯をともして前後から照らそうとも、三人は土をこねて金を塗った像さながらだった。
    虎力大仙（こりきたいせん）「悪人がいないのなら、どうして供物が食べ尽くされているのだ。」
    鹿力大仙（ろくりきたいせん）「どう見ても人間の仕業です。皮のあるものは皮をむき、種のあるものは種を吐き出してある。それなのに、人の姿が見えぬとは。」
    羊力大仙（ようりきたいせん）「兄上たち、お疑いには及びません。私どもが真心を尽くし、ここで昼も夜も経を唱え、たびたび祈りの文を奏し、しかも朝廷の名のもとで勤めているのですから、きっと天尊（てんそん）のお心に届いたのでしょう。三清（さんせい）さまがお降りになり、この供物を召し上がったに違いありません。まだお帰りにならず、仙人の鶴の駕もここにある今のうちに、お祈りを申し上げ、聖水や金丹（きんたん）をお願いしてはどうです。それを陛下に差し上げれば、陛下は永遠の長寿を得られ、私どもの修行の功も示せるではありませんか。」
    虎力大仙「そのとおりだ。」
    そして虎力大仙は命じた。「弟子たち、楽を奏して経を読め。それから法衣を持ってまいれ。私が歩罡（ほこう）の法で祈ろう。」
    若い道士たちは皆命に従い、二列にきちんと並んだ。磬（けい）がかんと一声鳴ると、一斉に『黄庭道徳真経（こうていどうとくしんきょう）』一巻を唱えた。虎力大仙は法衣をまとい、玉簡（ぎょくかん）を掲げ、御前で身を舞わせて塵を上げると、地にひれ伏し、上へ向かってこう奏した。
  "translation_status": "reviewed"
- "id": "xy-ch45-003"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "「誠惶誠恐，稽首歸依。臣等興教，仰望清虛。滅僧鄙俚，敬道光輝。敕修寶殿，御製庭闈。廣陳供養，高掛龍旗。通宵秉燭，鎮日香焚。一誠達上，寸敬虔歸。今蒙降駕，未返仙車。望賜些金丹聖水，進與朝廷，壽比南山。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 119
    "line_end": 119
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 3
  "translation_ja": |-
    虎力大仙「恐れかしこみ、額を地につけて帰依いたします。
    私どもは道の教えを興し、清く虚なる天界を仰いでおります。
    卑しい僧を滅ぼし、輝かしい道を敬っております。
    勅命で宝殿を建て、皇帝のご意向で堂宇を造りました。
    供物を広く並べ、竜の旗を高く掲げ、
    夜通し灯をともし、一日じゅう香をたいております。
    ひたすらな誠が天に届き、わずかな敬意を謹んで捧げます。
    今、ありがたくもお降りくださり、仙車もまだお帰りになりません。
    どうか金丹と聖水を少しお授けください。
    朝廷に献じ、陛下の寿命を南山（なんざん）にも等しく長くいたしたく存じます。」
  "translation_status": "reviewed"
- "id": "xy-ch45-004"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒聞言，心中忐忑，默對行者道：「這是我們的不是：吃了東西，且不走路，只等這般禱祝。卻怎麼答應？」行者又捻一把，忽地開口，叫聲：「晚輩小仙，且休拜祝。我等自蟠桃會上來的，不曾帶得金丹聖水，待改日再來垂賜。」那些大小道士聽見說出話來，一個個抖衣而戰道：「爺爺呀！活天尊臨凡，是必莫放，好歹求個長生的法兒。」鹿力大仙上前，又拜云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 120
    "line_end": 120
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 4
  "translation_ja": |-
    八戒は聞いて胸が落ち着かず、悟空に小声で言った。
    八戒「俺たちが悪かったな。食ったら帰ればいいものを、こんな祈りを聞くまで居残っちまった。どう返事をするんだ。」
    悟空はまた八戒をつねり、突然口を開いた。
    悟空「後輩の小仙たちよ、もう拝んで祈るには及ばぬ。我らは蟠桃会（ばんとうえ）から来たので、金丹も聖水も持ち合わせておらぬ。日を改めて来て、授けてやろう。」
    大人も若者も道士たちは、像が口を利いたのを聞き、衣まで震わせながら声を上げた。
    道士たち「天尊さま！　生きた天尊が地上へおいでになったのだ。決してお帰ししてはならぬ。何としても長生きの法を授けていただこう。」
    鹿力大仙が前へ出て、また拝礼しながら唱えた。
  "translation_status": "reviewed"
- "id": "xy-ch45-005"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "「揚塵頓首，謹辦丹誠。微臣歸命，俯仰三清。自來此界，興道除僧。國王心喜，敬重玄齡。羅天大醮，徹夜看經。幸天尊之不棄，降聖駕而臨庭。俯求垂念，仰望恩榮。是必留些聖水，與弟子們延壽長生。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 122
    "line_end": 122
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 5
  "translation_ja": |-
    鹿力大仙「塵を上げて額を地につけ、心からの誠を捧げます。
    卑しい臣である私どもは命をお任せし、伏しても仰いでも三清を敬います。
    この地へ来て以来、道を興し、僧を除きました。
    国王はお喜びになり、仙道の長寿を尊んでくださいます。
    羅天大醮（らてんたいしょう）を営み、夜通し経を読んでおります。
    幸いにも天尊はお見捨てにならず、聖なる御身をもってこの庭へお降りくださいました。
    伏してお心にかけていただくよう願い、仰いでお恵みをお待ちします。
    どうか必ず聖水を少しお残しになり、弟子たちの命を延ばし、長生きさせてください。」
  "translation_status": "reviewed"
- "id": "xy-ch45-006"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "沙僧捻著行者，默默的道：「哥呀，要得緊，又來禱告了。」行者道：「與他些罷。」八戒寂寂道：「那裡有得？」行者道：「你只看著我，我有時，你們也都有了。」那道士吹打已畢，行者開言道：「那晚輩小仙，不須拜伏。我欲不留些聖水與你們，恐滅了苗裔；若要與你，又忒容易了。」眾道聞言，一齊俯伏叩頭道：「萬望天尊念弟子恭敬之意，千乞喜賜些須。我弟子廣宣道德，奏國王普敬玄門。」行者道：「既如此，取器皿來。」那道士一齊頓首謝恩。虎力大仙愛強，就擡一口大缸，放在殿上；鹿力大仙端一砂盆，安在供桌之上；羊力大仙把花瓶摘了花，移在中間。行者道：「你們都出殿前，掩上格子，不可洩了天機，好留與你些聖水。」眾道一齊跪伏丹墀之下，掩了殿門。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 123
    "line_end": 123
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 6
  "translation_ja": |-
    沙悟浄は悟空をつねって、そっと言った。
    沙悟浄「兄さん、ずいぶんせがみますね。また祈り始めましたよ。」
    悟空「少しやろうじゃないか。」
    八戒も声をひそめた。「どこにあるんだよ。」
    悟空「俺を見ていろ。俺にあれば、お前たちにもあるさ。」
    道士たちの楽がやむと、悟空は口を開いた。
    悟空「後輩の小仙たちよ、ひれ伏すには及ばぬ。聖水を残さずに行けば、お前たちの後継ぎが絶えてしまわぬかと気がかりだ。だが授けるとなると、あまりにたやすい。」
    道士たちは一斉にひれ伏して頭を下げた。
    道士たち「どうか天尊さま、弟子たちの敬う心をおくみ取りになり、わずかでもお授けください。私どもは道の徳を広く伝え、国王にも道教をあまねく敬うよう申し上げます。」
    悟空「それなら器を持ってまいれ。」
    道士たちはそろって額を地につけ、恩を謝した。負けず嫌いの虎力大仙は大きな水がめを運んで殿内へ据えた。鹿力大仙は陶器の鉢を抱えて供物台に置き、羊力大仙は花瓶から花を抜いて中央へ移した。
    悟空「皆、殿の前へ出て、格子戸を閉めよ。天の秘密を漏らしてはならぬ。そうすれば聖水を残してやろう。」
    道士たちはそろって赤い石段の下にひざまずき、殿の扉を閉じた。
  "translation_status": "reviewed"
- "id": "xy-ch45-007"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者立將起來，掀著虎皮裙，撒了一花瓶臊溺。豬八戒見了，歡喜道：「哥啊，我和你做這幾年兄弟，只這些兒不曾弄過。我才吃了些東西，倒要幹這個事兒哩。」那獃子揭衣服，忽喇喇，就似呂梁洪倒下板來，沙沙的溺了一砂盆。沙和尚卻也撒了半缸。依舊整衣端坐在上，道：「小仙領聖水。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

- "id": "xy-ch45-033"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "雷公奮怒，電母生嗔。雷公奮怒，倒騎火獸下天關；電母生嗔，亂掣金蛇離斗府。唿喇喇施霹靂，振碎了鐵叉山；淅瀝瀝閃紅綃，飛出了東洋海。呼呼隱隱滾車聲，燁燁煌煌飄稻米。萬萌萬物精神改，多少昆蟲蟄已開。君臣樓上心驚駭，商賈聞聲膽怯忙。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 164
    "line_end": 164
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 33
  "translation_ja": |-
    雷公は怒りを奮い、電母は憤りを起こす。
    雷公は怒りを奮い、火の獣に後ろ向きにまたがって天の関を下る。
    電母は憤りを起こし、金色の蛇を乱れ走らせ、斗府（とふ）を離れる。
    ごろごろと雷霆を放ち、鉄叉山（てっさざん）を震わせ砕き、
    ぱちぱちと紅い薄絹をひらめかせ、東洋海（とうようかい）から飛び出す。
    ごうごう、ごろごろ、車が転がるような音。
    きらきら、かっかと、稲の米粒のように光が舞う。
    芽吹くもの、生あるものはすべて生気を改め、数多くの虫はすでに冬籠りから出る。
    楼上の君臣は心を震わせ、商人たちは音を聞いて胆をつぶす。
  "translation_status": "reviewed"
- "id": "xy-ch45-034"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "正疑惑之間，又見黃門官來奏：「陛下，門外有許多鄉老聽宣。」國王道：「有何事幹？」即命宣來。宣至殿前，有三四十名鄉老，朝上磕頭道：「萬歲，今年一春無雨，但恐夏月乾荒，特來啟奏，請那位國師爺爺祈一場甘雨，普濟黎民。」國王道：「鄉老且退，就有雨來也。」鄉老謝恩而出。國王道：「唐朝僧眾，朕敬道滅僧為何？只為當年求雨，我朝僧人更未嘗求得一點；幸天降國師，拯援塗炭。你今遠來，冒犯國師，本當即時問罪，姑且恕你，敢與我國師賭勝求雨麼？若祈得一場甘雨，濟度萬民，朕即饒你罪名，倒換關文，放你西去，若賭不過，無雨，就將汝等推赴殺場，典刑示眾。」行者笑道：「小和尚也曉得些兒求禱。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 136
    "line_end": 136
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 15
  "translation_ja": |-
    迷っているところへ、また黄門官が来て奏した。
    黄門官「陛下、門外に里の長老たちが大勢、お召しを待っております。」
    国王「何の用だ。」
    国王はすぐに呼び入れさせた。三、四十人の長老たちが殿前へ来て、上に向かって頭を下げた。
    里の長老たち「陛下、今年は春じゅう雨がございません。夏には干ばつになるのではと案じ、お願いに参りました。どうか国師さまに恵みの雨を一降りお祈りいただき、広く民をお救いください。」
    国王「長老たちは下がっておれ。じきに雨が降ろう。」
    長老たちは恩を謝して退出した。
    国王「唐（とう）の僧ども、朕が道教を敬い、僧を滅ぼすのはなぜか。昔、雨乞いをしたとき、この国の僧は一滴の雨さえ降らせられなかったからだ。幸い天が国師を下され、民を苦しみから救ってくださった。お前たちは遠くから来て国師を辱めたのだから、本来ならすぐ罪を問うべきだが、ひとまず許してやろう。国師と雨乞いの勝負をする気はあるか。恵みの雨を一降り求め、万人を救えたなら、罪を赦し、通行証を認証して西へ行かせてやる。勝てず、雨も降らなければ、刑場へ引き出し、見せしめに処刑するぞ。」
    悟空は笑った。「この小僧も、祈りの術なら少しは心得ております。」
  "translation_status": "reviewed"
- "id": "xy-ch45-016"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王見說，即命打掃壇場。一壁廂教：「擺駕，寡人親上五鳳樓觀看。」當時多官擺駕，須臾，上樓坐了。唐三藏隨著行者、沙僧、八戒，侍立樓下。那三道士陪國王坐在樓上。少時間，一員官飛馬來報：「壇場諸色皆備，請國師爺爺登壇。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 138
    "line_end": 138
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 16
  "translation_ja": |-
    国王はそれを聞くと、祭壇を清めさせ、同時に命じた。
    国王「御車を用意せよ。朕も自ら五鳳楼に上がって見よう。」
    官たちはすぐに行列を整え、やがて国王は楼上に着座した。三蔵は悟空、沙悟浄、八戒に続き、楼下に控え、三人の道士は楼上で国王に付き添って座った。ほどなく一人の役人が馬を飛ばして来て報告した。
    役人「祭壇の準備はすべて整いました。国師さま、どうぞ祭壇へお上がりください。」
  "translation_status": "reviewed"
- "id": "xy-ch45-017"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那虎力大仙欠身拱手，辭了國王，徑下樓來。行者向前攔住道：「先生那裡去？」大仙道：「登壇祈雨。」行者道：「你也忒自重了，更不讓我遠鄉之僧。也罷，這正是『強龍不壓地頭蛇』。先生先去，必須對君前講開。」大仙道：「講甚麼？」行者道：「我與你都上壇祈雨，知雨是你的，是我的？不見是誰的功績了。」國王在上聽見，心中暗喜道：「那小和尚說話，倒有些筋節。」沙僧聽見，暗笑道：「不知他一肚子筋節，還不曾拿出來哩。」大仙道：「不消講，陛下自然知之。」行者道：「雖然知之，奈我遠來之僧，未曾與你相會。那時彼此混賴，不成勾當，須講開方好行事。」大仙道：「這一上壇，只看我的令牌為號：一聲令牌響，風來；二聲響，雲起；三聲響，雷閃齊鳴；四聲響，雨至；五聲響，雲散雨收。」行者笑道：「妙啊！我僧是不曾見。請了，請了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 139
    "line_end": 139
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 17
  "translation_ja": |-
    虎力大仙は身をかがめて両手を組み、国王に辞して、まっすぐ楼を下りた。悟空が進み出て行く手をふさいだ。
    悟空「先生、どちらへ。」
    虎力大仙「祭壇に上がって雨を祈るのだ。」
    悟空「ずいぶんお偉いつもりだな。遠くから来た僧に先を譲りもしないとは。まあいい。『強い竜も土地の蛇を押さえつけられぬ』ということだ。先生からお先にどうぞ。ただ、陛下の御前ではっきり決めておかねばならぬ。」
    虎力大仙「何を決めるのだ。」
    悟空「俺とお前が二人とも祭壇に上がって雨を祈ったら、お前の降らせた雨か、俺の降らせた雨か、どうして分かる。誰の手柄か分からなくなるじゃないか。」
    国王は上で聞いて、ひそかに喜んだ。
    国王「この小僧の言うことは、なかなか筋が通っておる。」
    沙悟浄は聞いて、ひそかに笑った。
    沙悟浄「兄さんにはそんな理屈が腹いっぱい詰まっていて、まだ出してもいないことをご存じないんだ。」
    虎力大仙「決めるまでもない。陛下には自然とお分かりになる。」
    悟空「お分かりになるにしても、俺は遠来の僧で、お前とは会ったことがない。あとで互いに言い逃れを始めたら、話にならぬ。はっきり決めてから取りかかるのがいい。」
    虎力大仙「私が祭壇に上がったら、令牌（れいはい）の音を合図とする。一度鳴らせば風が来る。二度鳴らせば雲が起こる。三度鳴らせば雷と稲妻がともに現れる。四度鳴らせば雨が来る。五度鳴らせば雲が散り、雨がやむ。」
    悟空は笑った。「見事だ！　俺はまだ見たことがない。どうぞ、どうぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-018"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大仙拽開步進前，三藏等隨後，徑到了壇門外。擡頭觀看，那裡有一座高臺，約有三丈多高。臺左右插著二十八宿旗號。頂上放一張桌子，桌上有一個香爐，爐中香煙靄靄。兩邊有兩隻燭臺，臺上風燭煌煌。爐邊靠著一個金牌，牌上鐫的是雷神名號。底下有五個大缸，都注著滿缸清水，水上浮著楊柳枝，楊柳枝上托著一面鐵牌，牌上書的是雷霆都司的符字。左右有五個大樁，樁上寫著五方蠻雷使者的名錄。每一樁邊立兩個道士，各執鐵鎚，伺候著打樁。臺後面有許多道士，在那裡寫作文書。正中間設一架紙爐，又有幾個像生的人物，都是那執符使者、土地贊教之神。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 140
    "line_end": 140
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 18
  "translation_ja": "虎力大仙は大股で進み、三蔵たちも後について、まっすぐ祭壇の門の外まで来た。見上げると、三丈（じょう）余りの高さの台があり、その左右には二十八宿（にじゅうはっしゅく）の旗が立ててあった。上には机が一つ置かれ、机上の香炉には香の煙がもやもやと立っていた。両側には燭台が二つあり、その上で炎が風に揺れて明るく燃えていた。香炉の傍らには金の札が立てかけてあり、雷神の名が刻まれていた。下には大きな水がめが五つあり、どれも清水をいっぱいに張り、柳の枝が浮かべてあった。その枝の上に鉄の札が一枚ずつ載り、札には雷霆都司（らいていとし）の符字が書かれていた。左右には大きな杭が五本立ち、それぞれに五方蛮雷使者（ごほうばんらいししゃ）の名が書いてあった。杭ごとに二人の道士が立ち、各々鉄槌を持って、杭を打つ合図を待っていた。台の後ろには大勢の道士がいて、文書を書いていた。真ん中には紙を焼く炉が一基あり、ほかに人の姿をかたどった像がいくつか並んでいた。いずれも符（ふ）を運ぶ使者と、教えを助ける土地神の像だった。"
  "translation_status": "reviewed"
- "id": "xy-ch45-019"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大仙走進去，更不謙遜，直上高臺立定。傍邊有個小道士捧了幾張黃紙書就的符字、一口寶劍，遞與大仙。大仙執著寶劍，念聲咒語，將一道符在燭上燒了。那底下兩三個道士拿過一個執符的像生、一道文書，亦點火焚之。那上面乒的一聲令牌響，只見那半空裡悠悠的風色飄來。豬八戒口裡作念道：「不好了，不好了，這道士果然有本事。令牌響了一下，果然就刮風。」行者道：「兄弟悄悄的，你們再莫與我說話，只管護持師父，等我幹事去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 142
    "line_end": 142
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 19
  "translation_ja": |-
    虎力大仙は中へ入り、遠慮のそぶりもなく、まっすぐ高台に上がって立った。傍らの若い道士が、黄色い紙に符字を書いたものを数枚と宝剣一本を捧げ、虎力大仙に渡した。虎力大仙は宝剣を握り、呪文を唱えると、符を一枚、ろうそくの火で焼いた。下でも二、三人の道士が符を運ぶ使者の像を一つと文書一通を取り、火をつけて焼いた。上で令牌がぱんと鳴ると、空からゆるやかに風が吹いてきた。八戒はぶつぶつ言った。
    八戒「まずいぞ、まずいぞ。こいつは本当に術が使える。令牌を一つ鳴らしたら、本当に風が吹いた。」
    悟空「兄弟、静かにしろ。もう俺には話しかけず、お師匠さまだけをお守りしていろ。俺が仕事をしてくる。」
  "translation_status": "reviewed"
- "id": "xy-ch45-020"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，拔下一根毫毛，吹口仙氣，叫：「變！」就變作一個假行者，立在唐僧手下。他的真身出了元神，趕到半空中，高叫：「那司風的是那個？」慌得那風婆婆捻住布袋，巽二郎劄住口繩，上前施禮。行者道：「我保護唐朝聖僧西天取經，路過車遲國，與那妖道賭勝祈雨，你怎麼不助老孫，反助那道士？我且饒你，把風收了；若有一些風兒，把那道士的鬍子吹得動動，各打二十鐵棒。」風婆婆道：「不敢，不敢。」遂而沒些風氣。八戒忍不住亂嚷道：「那先生請退，令牌已響，怎麼不見一些風兒？你下來，讓我們上去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 143
    "line_end": 143
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 20
  "translation_ja": |-
    見事な悟空は毛を一本抜き、仙気を吹きかけた。
    悟空「変われ！」
    すると偽の悟空が一人でき、三蔵のそばに立った。本身の悟空は元神（げんしん）を抜け出させて空中へ急ぎ、大声で呼んだ。
    悟空「風を司るのは誰だ！」
    あわてた風婆婆（ふうばば）は布袋を押さえ、巽二郎（そんじろう）は口のひもを締め、前へ出て礼をした。
    悟空「俺は唐の聖僧を守って、西天へ経を求めに行く途中、車遅国（しゃちこく）を通りかかり、あの妖しい道士と雨乞いを競っている。なぜ俺を助けず、道士のほうを助けるんだ。今は許してやるから、風を収めろ。少しでも風が吹いて、あの道士のひげが動いたら、一人につき鉄棒二十打だぞ。」
    風婆婆「とんでもございません。そんなことはいたしません。」
    すると風はすっかりやんだ。八戒は我慢できずに大声を出した。
    八戒「そこの先生、引き下がってくれよ。令牌が鳴ったのに、なぜ風が少しもないんだ。下りてきて、俺たちに上がらせろ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-021"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那道士又執令牌，燒了符檄，撲的又打了一下，只見那空中雲霧遮滿。孫大聖又當頭叫道：「佈雲的是那個？」慌得那推雲童子、佈霧郎君當面施禮。行者又將前事說了一遍。那雲童、霧子也收了雲霧，放出太陽星耀耀，一天萬里更無雲。八戒笑道：「這先兒只好哄這皇帝，搪塞黎民，全沒些真實本事。令牌響了兩個，如何又不見雲生？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 145
    "line_end": 145
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 21
  "translation_ja": |-
    虎力大仙はまた令牌を握り、符と檄文（げきぶん）を焼き、ぱんともう一度打った。すると空いっぱいに雲と霧が覆いかぶさった。悟空がまた正面から声をかけた。
    悟空「雲を広げるのは誰だ！」
    推雲童子（すいうんどうじ）と布霧郎君（ふむろうくん）はあわてて悟空の前で礼をした。悟空が先ほどの事情を繰り返して話すと、二人も雲と霧を収め、輝く太陽を現した。万里の空に雲一つなくなった。
    八戒は笑った。「この仙人もどきは、あの皇帝をだまし、民をごまかすぐらいしかできぬ。まともな力なんて、何もないんだ。令牌を二度鳴らしたのに、どうして雲も出ないんだよ。」
  "translation_status": "reviewed"
- "id": "xy-ch45-022"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那道士心中焦躁，仗寶劍，解散了頭髮，念著咒，燒了符，再一令牌打將下去。只見那南天門裡，鄧天君領著雷公、電母到當空，迎著行者進禮。行者又將前項事說了一遍，道：「你們怎麼來的志誠？是何法旨？」天君道：「那道士五雷法是個真的，他發了文書，燒了文檄，驚動玉帝，玉帝擲下旨意，徑至九天應元雷聲普化天尊府下。我等奉旨前來，助雷電下雨。」行者道：「既如此，且都住了，同候老孫行事。」果然雷也不鳴，電也不灼。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 146
    "line_end": 146
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 22
  "translation_ja": |-
    虎力大仙は焦り、宝剣をつかみ、髪を解き乱して、呪文を唱え、符を焼き、また令牌を打ち下ろした。すると南天門（なんてんもん）から鄧天君（とうてんくん）が雷公（らいこう）と電母（でんぼ）を率いて空へ来て、悟空に向かって礼をした。悟空はまた先ほどの事情を説明した。
    悟空「お前たちはどうして、こんなに律義に来るんだ。誰の命令だ。」
    鄧天君「この道士の五雷法（ごらいほう）は本物です。文書を出し、檄文を焼いたのが玉帝（ぎょくてい）に届き、玉帝は九天応元雷声普化天尊（きゅうてんおうげんらいせいふけてんそん）の府へ、直接ご命令を下されました。私どもは勅命を受けて参り、雷と稲妻を起こし、雨を降らせるお手伝いをするのです。」
    悟空「それなら、皆いったんやめて、俺が取りかかるのを待っていろ。」
    果たして雷も鳴らず、稲妻も光らなかった。
  "translation_status": "reviewed"
- "id": "xy-ch45-023"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那道士愈加著忙，又添香、燒符、念咒、打下令牌。半空中，又有四海龍王一齊擁至。行者當頭喝道：「敖廣，那裡去？」那敖廣、敖順、敖欽、敖閏上前施禮。行者又將前項事說了一遍，道：「向日有勞，未曾成功；今日之事，望為助力。」龍王道：「遵命，遵命。」行者又謝了敖順道：「前日虧令郎縛怪，搭救師父。」龍王道：「那廝還鎖在海中，未敢擅便，正欲請大聖發落。」行者道：「憑你怎麼處治了罷。如今且助我一功。那道士四聲令牌已畢，卻輪到老孫上去幹事了。但我不會發符、燒檄，打甚令牌，你列位卻要助我行行。」鄧天君道：「大聖吩咐，誰敢不從？但只是得一個號令，方敢依令而行；不然，雷雨亂了，顯得大聖無款也。」行者道：「我將棍子為號罷。」那雷公大驚道：「爺爺呀！我們怎吃得這棍子？」行者道：「不是打你們，但看我這棍子往上一指，就要刮風。」那風婆婆、巽二郎沒口的答應道：「就放風。」「棍子第二指，就要佈雲。」那推雲童子、佈霧郎君道：「就佈雲，就佈雲。」「棍子第三指，就要雷鳴電灼。」那雷公、電母道：「奉承，奉承。」「棍子第四指，就要下雨。」那龍王道：「遵命，遵命。」「棍子第五指，就要大日晴天。卻莫違誤。」"
  "source_languages":

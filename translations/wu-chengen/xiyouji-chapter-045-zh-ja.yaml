  "kind": "paragraph"
  "origin": "source"
  "source_text": "那些道士推開格子，磕頭禮拜謝恩，擡出缸去，將那瓶、盆總歸一處，教：「徒弟，取個鍾子來嘗嘗。」小道士即便拿了一個茶鍾，遞與老道士。道士舀出一鍾來，喝下口去，只情抹唇咂嘴。鹿力大仙道：「師兄，好吃麼？」老道士努著嘴道：「不甚好吃，有些酣\U000288BF之味。」羊力大仙道：「等我嘗嘗。」也喝了一口，道：「有些豬溺臊氣。」行者坐在上面，聽見說出這話兒來，已此識破了，道：「我弄個手段，索性留個名罷。」大叫云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 126
    "line_end": 126
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 8
  "translation_ja": |-
    道士たちは格子戸を押し開け、頭を地につけて礼拝し、恩を謝すと、水がめを運び出し、花瓶と鉢の中身もそこへ一つに注いだ。
    年長の道士「弟子よ、茶碗を持ってまいれ。味を見てみよう。」
    若い道士がすぐ茶碗を一つ持ってきて、年長の道士に渡した。年長の道士は一杯すくって口に入れ、しきりに唇をぬぐっては舌を鳴らした。
    鹿力大仙「兄上、おいしゅうございますか。」
    年長の道士は口をとがらせた。「あまりうまくない。どうも悪い濁り酒のような味がする。」
    羊力大仙「私にも味を見させてください。」
    羊力大仙も一口飲み、言った。「何やら豚の小便のような臭いがします。」
    上に座っていた悟空は、この言葉を聞くと、もう見破られたと思った。
    悟空「ひとつ手を見せて、いっそ名乗っておこう。」
    そして大声で呼ばわった。
  "translation_status": "reviewed"
- "id": "xy-ch45-009"
  "section_id": "chapter-45"
  "kind": "verse"
  "origin": "source"
  "source_text": "「道號道號，你好胡思。那個三清，肯降凡基？吾將真姓，說與你知。大唐僧眾，奉旨來西。良宵無事，下降宮闈。吃了供養，閑坐嬉嬉。蒙你叩拜，何以答之？那裡是甚麼聖水，你們吃的都是我一溺之尿。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 128
    "line_end": 128
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 9
  "translation_ja": |-
    悟空「道士よ道士、なんという思い違いだ。
    三清がこんな下界へ降りてくるものか。
    本当の名を教えてやろう。
    俺たちは大唐（だいとう）の僧、勅命を受けて西へ向かう。
    よい夜で暇だったので、この御殿へ降りてきた。
    供物を食べて、のんびり座って遊んでいたのさ。
    お前たちが拝んでくれたので、何で答えようかと思ったが、
    あれは聖水なんかじゃない。
    お前たちが飲んだのは、俺がひとしきりひった小便だ！」
  "translation_status": "reviewed"
- "id": "xy-ch45-010"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那道士聞得此言，攔住門，一齊動叉鈀、掃帚、瓦塊、石頭，沒頭沒臉，往裡面亂打。好行者，左手挾了沙僧，右手挾了八戒，闖出門，駕著雲光，徑轉智淵寺方丈。不敢驚動師父，三人又復睡下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 130
    "line_end": 130
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 10
  "translation_ja": "道士たちはこれを聞くと、戸口をふさいだ。皆で叉や熊手、箒、瓦のかけら、石を手にし、頭も顔も見境なく、内側へ向けて打ちつけた。さすが悟空、左脇に沙悟浄、右脇に八戒を抱え、戸口を突っ切って飛び出すと、雲の光に乗って、まっすぐ智淵寺（ちえんじ）の方丈（ほうじょう）へ戻った。師を起こすわけにはいかず、三人はまた寝床に入った。"
  "translation_status": "reviewed"
- "id": "xy-ch45-011"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "早是五鼓三點。那國王設朝，聚集兩班文武、四百朝官，但見絳紗燈火光明，寶鼎香雲靉靆。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 132
    "line_end": 132
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 11
  "translation_ja": "はや五更（ごこう）の第三点、明け方になっていた。国王は朝議を開き、文武の二列に四百人の官を集めた。紅い紗を張った灯籠は明るく輝き、宝鼎（ほうてい）から香の雲がゆったりと立ちこめていた。"
  "translation_status": "reviewed"
- "id": "xy-ch45-012"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時唐三藏醒來，叫：「徒弟，徒弟，伏侍我倒換關文去來。」行者與沙僧、八戒急起身，穿了衣服，侍立左右道：「上告師父。這國君信著那些道士，興道滅僧，恐言語差錯，不肯倒換關文，我等護持師父，都進朝去也。」唐僧大喜，披了錦襴袈裟。行者帶了通關文牒，教悟淨捧著缽盂，悟能拿了錫杖；將行囊、馬匹，交與智淵寺僧看守。徑到五鳳樓前，對黃門官作禮，報了姓名，言是東土大唐取經的和尚來此倒換關文，煩為轉奏。那閣門大使進朝俯伏金階，奏曰：「外面有四個和尚，說是東土大唐取經的，欲來倒換關文，現在五鳳樓前候旨。」國王聞奏道：「這和尚沒處尋死，卻來這裡尋死。那巡捕官員，怎麼不拿他解來？」傍邊閃過當駕的太師啟奏道：「東土大唐，乃南贍部洲，號曰中華大國。到此有萬里之遙，路多妖怪。這和尚一定有些法力，方敢西來。望陛下看中華之遠僧，且召來驗牒放行，庶不失善緣之意。」國王准奏，把唐僧等宣至金鑾殿下。師徒們排列階前，捧關文遞與國王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 133
    "line_end": 133
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 12
  "translation_ja": |-
    そのころ三蔵（さんぞう）も目を覚まし、呼びかけた。
    三蔵「お前たち、お前たち。通行証に認証をいただきに行くから、支度をしておくれ。」
    悟空、沙悟浄、八戒は急いで起き、衣を着て左右に控えた。
    三人の弟子「お師匠さまに申し上げます。この国の君主はあの道士たちを信じ、道教を興して僧を滅ぼしております。言葉を間違えれば、通行証の認証を拒まれるかもしれません。私たちがお師匠さまをお守りし、そろって参内いたしましょう。」
    三蔵は大いに喜び、錦襴袈裟（きんらんげさ）をまとった。悟空は通行文牒（つうこうもんちょう）を携え、沙悟浄に鉢を捧げさせ、八戒に錫杖（しゃくじょう）を持たせた。荷物と馬は智淵寺の僧たちに預け、番を頼んだ。一行はまっすぐ五鳳楼（ごほうろう）の前へ行き、黄門官（こうもんかん）に礼をして姓名を告げ、東の大唐から経典を求めに行く僧で、通行証の認証に来たので取り次いでもらいたいと申し入れた。取次ぎを務めるこの閣門大使（かくもんたいし）は朝廷へ入り、金の階にひれ伏して奏した。
    黄門官「外に四人の僧が参っております。東の大唐から経典を求めに行く者で、通行証の認証を受けたいと申しております。今、五鳳楼の前で勅命をお待ちしております。」
    国王「この僧どもは、死ぬ場所がなくてここへ死にに来たのか。巡察の役人は、なぜ捕らえて引き立てて来ぬ。」
    傍らから、御前に控える太師（たいし）が進み出て奏した。
    太師「東の大唐は南贍部洲（なんせんぶしゅう）にあり、中華（ちゅうか）の大国と呼ばれております。ここから万里も離れ、途中には妖怪が多くおります。この僧はきっと法力があってこそ、西へ来ようとしたのでしょう。陛下には中華から遠路参った僧であることをおくみ取りになり、ひとまず召して文牒を確かめ、お通しください。そうすれば善い縁も失わずに済みましょう。」
    国王は奏上を認め、三蔵たちを金鑾殿（きんらんでん）の下へ召した。師弟は階前に並び、通行証を捧げて国王に差し出した。
  "translation_status": "reviewed"
- "id": "xy-ch45-013"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王展開方看，又見黃門官來奏：「三位國師來也。」慌得國王收了關文，急下龍座，著近侍的設了繡墩，躬身迎接。三藏等回頭觀看，見那大仙搖搖擺擺，後帶著一雙丫髻蓬頭的小童兒，往裡直進。兩班官控背躬身，不敢仰視。他上了金鑾殿，對國王徑不行禮。那國王道：「國師，朕未曾奉請，今日如何肯降？」老道士云：「有一事奉告，故來也。那四個和尚是那國來的？」國王道：「是東土大唐差去西天取經的，來此倒換關文。」那三道士鼓掌大笑道：「我說他走了，原來還在這裡。」國王驚道：「國師有何話說？他才來報了姓名，正欲拿送國師使用，怎奈當駕太師所奏有理，朕因看遠來之意，不滅中華善緣，方才召入驗牒，不期國師有此問。想是他冒犯尊顏，有得罪處也？」道士笑云：「陛下不知。他昨日來的，在東門外打殺了我兩個徒弟，放了五百個囚僧，捽碎車輛；夜間闖進觀來，把三清聖像毀壞，偷吃了御賜供養。我等被他蒙蔽了，只道是天尊下降，求些聖水金丹，進與陛下，指望延壽長生；不期他遺些小便，哄瞞我等。我等各喝了一口，嘗出滋味，正欲下手擒拿，他卻走了。今日還在此間，正所謂『冤家路兒窄』也。」那國王聞言發怒，欲誅四眾。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 134
    "line_end": 134
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 13
  "translation_ja": |-
    国王が広げて読もうとしたところへ、また黄門官が来て奏した。
    黄門官「三人の国師（こくし）さまがお越しでございます。」
    国王はあわてて通行証をしまい、竜の玉座を下りると、近侍に錦の腰掛けを用意させ、身をかがめて出迎えた。三蔵たちが振り向くと、大仙たちが悠々と身を揺すり、二つ髻を結って髪をふくらませた二人の童子を後ろに連れ、まっすぐ入ってきた。両列の官は背を丸めて頭を下げ、顔を上げることもできなかった。大仙たちは金鑾殿に上がっても、国王にまるで礼をしない。
    国王「国師、朕はまだお招きしておりませんのに、今日はどうしておいでくださったのです。」
    年長の道士「一つお知らせしたいことがあって参りました。あの四人の僧は、どこの国の者です。」
    国王「東の大唐から西天（さいてん）へ経を求めに遣わされた者で、通行証の認証に来ております。」
    三人の道士は手を打って大笑いした。「逃げたと思ったら、まだこんな所にいたのか。」
    国王は驚いた。「国師、何か事情がおありなのですか。あの者たちは今しがた名乗ったばかりです。捕らえて国師のお使いに差し出そうとしましたが、太師の奏上にも道理があったので、遠来の者への配慮から、中華との善い縁を失わぬようにと、召し入れて文牒を調べようとしたのです。国師からこのようにお尋ねがあるとは思いませんでした。ご尊顔を汚すような、何か罪を犯したのでしょうか。」
    年長の道士は笑って言った。「陛下はご存じありません。こやつらは昨日来て、東門の外で私どもの弟子を二人殺し、囚われの僧五百人を放し、車を壊しました。夜には観へ押し入り、三清の聖像を壊し、陛下から賜った供物を盗み食いしたのです。私どもはまんまと欺かれ、天尊が降臨されたと思い、陛下に差し上げて永遠の長寿を得ていただこうと、聖水と金丹を願いました。ところがこやつらは小便を残し、私どもをだましたのです。それぞれ一口飲み、味で気がついて、捕らえようとしたときには逃げておりました。それが今日は、まだここにいる。まったく『敵同士の会う道は狭い』とはこのことです。」
    国王はこれを聞いて怒り、四人を殺そうとした。
  "translation_status": "reviewed"
- "id": "xy-ch45-014"
  "section_id": "chapter-45"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖合掌開言，厲聲高叫道：「陛下暫息雷霆之怒，容僧等啟奏。」國王道：「你衝撞了國師，國師之言，豈有差謬？」行者道：「他說我昨日到城外打殺他兩個徒弟，是誰知證？我等且屈認了，著兩個和尚償命，還放兩個去取經。他又說我捽碎車輛，放了囚僧，此事亦無見證，料不該死，再著一個和尚領罪罷了。他說我毀了三清，鬧了觀宇，這又是栽害我也。」國王道：「怎見栽害？」行者道：「我僧乃東土之人，乍來此處，街道尚且不通，如何夜裡就知他觀中之事？既遺下小便，就該當時捉住，卻這早晚坐名害人。天下假名託姓的無限，怎麼就說是我？望陛下回嗔詳察。」那國王本來昏亂，被行者說了一遍，他就決斷不定。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch45-1455594"
    "precision": "line"
    "line_start": 135
    "line_end": 135
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第045回&oldid=1455594"
    "source_sequence": 14
  "translation_ja": |-
    悟空は合掌し、声を張り上げて申し上げた。
    悟空「陛下、どうかその激しいお怒りをしばしお鎮めになり、私どもの申し上げることをお聞きください。」
    国王「お前たちは国師に無礼を働いたのだ。国師の言葉に、どうして誤りがあろう。」
    悟空「昨日、城外で弟子を二人殺したとおっしゃいますが、誰が証人なのです。まあ、ここは不本意ながら認めたとしましょう。僧二人の命で償わせ、残る二人は経を求めに行かせてください。車を壊し、囚われの僧を逃がしたともおっしゃいますが、これにも証人はおりません。死罪にはなるまいと思いますから、さらに僧を一人、罪に服させればよいでしょう。それから三清の像を壊し、観を荒らしたというのは、私どもへのぬれぎぬです。」
    国王「どうしてぬれぎぬだと言える。」
    悟空「私どもは東の国から、ここへ着いたばかりです。通りもまだ分からぬのに、どうしてその夜に観の中のことまで知っておりましょう。小便を残したのなら、その場で捕らえるべきでした。今になって名指しで罪をかぶせるとは。世間には、他人の姓名をかたる者がいくらでもおります。どうして私どもだと言えるのです。陛下、どうかお怒りをお解きになり、よくお調べください。」
    もともと判断の曇った国王は、悟空にこう言われると、決めかねてしまった。
  "translation_status": "reviewed"

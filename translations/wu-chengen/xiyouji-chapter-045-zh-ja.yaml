  "translation_ja": "原文は《黃庭道德真經》という一つの経名として記す。黄庭経と道徳経を連ねた名称とも解されるが、独立した経典の正式名かどうかは確定していない。原文を分割・訂正せず、その名称を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-02-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「敬重玄齡」の玄齡は、この祈りの文脈では道を修めた者の長寿をいうものと解した。唐代の人物、房玄齢の名を挿入したのではない。語義に留保がある。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-03-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この一言の前の原文は「沙和尚卻也撒了半缸。依舊整衣端坐在上，道」。最後の発話の主語が沙悟浄だけか三人かは明示されないため、声の主を特定せずに訳した。三清の神々本人が語った場面ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-04-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「酣\U000288BF之味」。\U000288BFは識典古籍が引く漢語大詞典・康熙字典では濁酒、よくない酒と説明されるため、悪い濁り酒に似た味と解した。ただし複合語全体の細かな味覚は未確定。原文の珍しい字を鹹澀などへ書き換えていない。参照：https://www.shidianguji.com/character/\U000288BF"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-05-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "味見を命じる者と宮廷で被害を訴える者は、原文では「老道士」「道士」と呼ばれ、その発話箇所では固有名が明記されない。「年長の道士」はその呼称を保ったもの。三人とは別に人物を一人増やしたわけではない。雨乞いの登壇者は、後で虎力大仙と明記される。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-06-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空は本当の姓・名を教えると予告するが、この歌で告げるのは大唐の取経僧という身分であり、孫という姓を実際には口にしない。この底本の言い方を保持し、名を補ってはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-07-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "よそから来た強者でも土地を押さえる者には押し切れない、という諺。悟空はこれを皮肉に用いて、道士へ先を譲っている。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-08-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「他的真身出了元神」は、身代わりを毛で作ったのち、本身から元神を出して空へ行く描写として訳した。実体と霊的な精神の関係には解釈の余地があり、原文にない二つの身体の位置や別の変身手順は補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-09-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「金魚玉帶」は魚そのものではなく、官人が帯びる金の魚符と玉帯。続く「象簡」も象牙の儀礼用の笏である。装束によって官人たちを示す詩の言い方を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-10-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「燁燁煌煌飄稻米」は、雷電の光を描く句として、米粒のような光が舞うと解した。「稻米」の比喩の細部は未確定であり、雨粒・雹など別の天候へ原文を補訂してはいない。鉄叉山を砕き、東洋海から飛び出す表現も賦の誇張として保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-11-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「淙淙如瓮撿」。撿のこの用法は確定できないが、続く「滾滾似盆澆」と対になる、かめから水を注ぐような大雨の比喩と解した。原文の撿を別字に改めてはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-12-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は四つの名を列挙しながら「五司」と数える。先の雷公と電母を別に数えた可能性はあるが、本文に「電」を補わず、四語と五司という原文の形を保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-13-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "末尾の句は「至真了性劈傍門」。至真という道教的な語、本性を悟るという修行の語と、正道に対する傍門の対比を残した。単に「悟空が道士を倒す」という筋の要約に置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch45-note-14-body"
  "section_id": "chapter-45"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "本回の敖順は、息子が妖怪を縛って三蔵を救ったことについて礼を述べられるため、第四十三回の西海の竜王に対応する。第三回の通常の名の配置とは異なるが、原文の敖順を敖閏へ直さない。列挙中のもう一人の敖閏は、第四十一回で北海の竜王に用いられた異表記に対応させ、両者を別人として扱う。本回自体はそれぞれの海域を明記せず、この対応は既出の役割と救出事件の連続性に基づく。"
  "translation_status": "reviewed"

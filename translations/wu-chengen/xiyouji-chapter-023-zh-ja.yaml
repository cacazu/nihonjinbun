- "id": "xy-ch23-030"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒也不放馬，將馬拉向前來。怎知孫大聖已一一盡知，他轉翅飛來，現了本相，先見唐僧道：「師父，悟能牽馬來了。」長老道：「馬若不牽，恐怕撒歡走了。」行者笑將起來，把那婦人與八戒說的勾當，從頭說了一遍，三藏也似信不信的。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    八戒は馬を放しもしないまま、前へ引き返した。悟空がすべて聞いていたとは知らない。悟空は羽を返して先に飛び、本来の姿へ戻って三蔵に告げた。悟空「お師匠さま、悟能（ごのう）が馬を引いて、縁も引いて来ますよ。」
    三蔵「馬は引いておかねば、はしゃいで逃げてしまうかもしれないからね。」
    悟空は笑いだし、女主人と八戒が話したことを、初めからひと通り語った。三蔵は半信半疑だった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「牽馬」は馬を引く動作と、縁組を仲介することの掛詞。教育部辞典が本回の用例を挙げる語義を照合し、「馬を引いて、縁も引く」とした。次段の応酬にも二重の意味を残す。"
- "id": "xy-ch23-031"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "少時間，見獃子拉將馬來拴下。長老道：「你馬放了？」八戒道：「無甚好草，沒處放馬。」行者道：「沒處放馬，可有處牽馬麼？」獃子聞得此言，情知走了消息，也就垂頭扭頸，努嘴皺眉，半晌不言。又聽得呀的一聲，腰門開了，有兩對紅燈、一副提爐，香雲靄靄，環珮叮叮，那婦人帶著三個女兒，走將出來，叫真真、愛愛、憐憐，拜見那取經的人物。那女子排立廳中，朝上禮拜。果然也生得標致，但見他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 180
    "line_end": 180
  "translation_ja": |-
    まもなく八戒が馬を引いて来て、つないだ。
    三蔵「馬を草に放したかね。」
    八戒「よい草もなく、放す場所がありませんでした。」
    悟空「馬を放す場所はなくても、馬を引いて縁を結ぶ場所はあったんだろう。」
    八戒はこの言葉で話が漏れたと悟り、頭を垂れ、首をひねり、口を突き出して眉をしかめ、しばらく黙った。
    そこへ、ぎいっと中の戸が開く音がした。赤い灯籠が二対、持ち運ぶ香炉が一つ。香の雲が漂い、玉の飾りがりんりん鳴り、女主人が三人の娘を連れて出てきた。真真、愛愛、憐憐を呼び、取経の一行に礼をさせた。娘たちは広間に並び、上座へ向かって拝礼した。本当に器量がよい。こんな姿であった。
  "translation_status": "reviewed"
- "id": "xy-ch23-032"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": "一個個蛾眉橫翠，粉面生春。妖嬈傾國色，窈窕動人心。花鈿顯現多嬌態，繡帶飄搖迥絕塵。半含笑處櫻桃綻，緩步行時蘭麝噴。滿頭珠翠，顫巍巍無數寶釵簪；遍體幽香，嬌滴滴有花金縷細。說甚麼楚娃美貌，西子嬌容。真個是九天仙女從天降，月裡嫦娥出廣寒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    一人一人の細い眉は翠を引き、白い顔には春が生まれる。
    国を傾ける艶やかな美しさ、たおやかな姿は人の心を動かす。
    花鈿（かでん）は愛らしさを増し、刺繍の帯がなびけば俗塵を遠く離れる。
    笑みを半ば含めば桜桃の唇がほころび、ゆっくり歩けば蘭や麝香が香る。
    髪いっぱいの真珠と翡翠、数えきれぬ宝のかんざしが小刻みに揺れる。
    全身にほのかな香りが漂い、繊細な金糸の花模様があでやかだ。
    楚（そ）の美女や西施（せいし）の顔かたちを、何ほどのものと言おう。
    まさしく九天の仙女が降りたか、月の嫦娥（じょうが）が広寒宮（こうかんきゅう）を出たかのよう。
  "translation_status": "reviewed"
- "id": "xy-ch23-033"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那三藏合掌低頭，孫大聖佯佯不睬，這沙僧轉背回身。你看那豬八戒眼不轉睛，淫心紊亂，色膽縱橫，扭捏出悄語，低聲道：「有勞仙子下降。娘，請姐姐們去耶。」那三個女子轉入屏風，將一對紗燈留下。婦人道：「四位長老可肯留心，著那個配我小女麼？」悟淨道：「我們已商議了，著那個姓豬的招贅門下。」八戒道：「兄弟，不要栽我，還從眾計較。」行者道：「還計較甚麼？你已在後門首說合的停停當當，娘都叫了，又有甚麼計較？師父做個男親家，這婆兒做個女親家，等老孫做個保親，沙僧做個媒人。也不必看通書，今朝是個天恩上吉日，你來拜了師父，進去做了女婿罷。」八戒道：「弄不成，弄不成，那裡好幹這個勾當？」行者道：「獃子，不要者囂，你那口裡娘也不知叫了多少，又是甚麼弄不成。快快的應承，帶攜我們吃些喜酒，也是好處。」他一隻手揪著八戒，一隻手扯住婦人道：「親家母，帶你女婿進去。」那獃子腳兒趄趄的要往那裡走。那婦人即喚童子：「展抹桌椅，鋪排晚齋，管待三位親家。我領姑夫房裡去也。」一壁廂又吩咐庖丁排筵設宴，明晨會親。那幾個童子又領命訖。他三眾吃了齋，急急鋪鋪，都在客座裡安歇不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    三蔵は手を合わせて頭を下げ、悟空は知らん顔、沙悟浄は背を向けた。ところが八戒は目を離さず、色欲に心を乱し、大胆さを増した。もじもじしながら小声で言った。八戒「仙女さま方、わざわざお出ましを。お母さん、お姉さんたちはどうぞ奥へ。」
    娘たちは屏風の奥へ戻り、一対の紗の灯籠だけを残した。
    女主人「四人の長老方、どなたか娘の相手になろうと、お心を決められましたか。」
    沙悟浄「相談は済みました。あの猪（ちょ）という姓の者が、こちらへ婿入りします。」
    八戒「弟よ、人に押しつけるな。まだみんなで相談しよう。」
    悟空「まだ何を相談する。裏口で話はすっかりついて、お母さんとまで呼んだじゃないか。師匠が婿の側の親、この女主人が嫁の側の親、俺が縁組の保証人、沙悟浄が仲人だ。暦を見るまでもない。今日は天恩（てんおん）の大吉日だぞ。師匠を拝んで、奥へ入って婿になれ。」
    八戒「だめだ、だめだ。そんなこと、できるものか。」
    悟空「間抜け、隠し立てするな。お母さんと何度呼んだか分からないのに、何ができないんだ。早く承知して、俺たちにも祝い酒を飲ませてくれれば、それでよい。」
    悟空は片手で八戒をつかみ、片手で女主人を引いた。悟空「お母さん、婿を連れてお入りください。」
    八戒の足はためらうふりをしながら、そちらへ進もうとする。女主人は下男を呼んだ。女主人「卓と椅子を拭き、夕餉の精進料理を並べて、三人のご親類をもてなしなさい。私は婿どのを部屋へお連れします。」
    一方で料理人にも、明朝の親族顔合わせの宴を整えるよう命じた。下男たちは命を承った。三人は食事を済ませ、急いで寝具を敷き、客間で休んだ。こちらはひとまず置いておく。
  "translation_status": "reviewed"
- "id": "xy-ch23-034"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那八戒跟著丈母，行入裡面，一層層也不知多少房舍，磕磕撞撞，盡都是門檻絆腳。獃子道：「娘，慢些兒走，我這裡邊路生，你帶我帶兒。」那婦人道：「這都是倉房、庫房、碾房各房，還不曾到那廚房邊哩。」八戒道：「好大人家。」磕磕撞撞，轉彎抹角，又走了半會，才是內堂房屋。那婦人道：「女婿，你師兄說今朝是天恩上吉日，就教你招進來了。卻只是倉卒間，不曾請得個陰陽，拜堂撒帳。你可朝上拜八拜兒罷。」八戒道：「娘說得是。你請上坐，等我也拜幾拜，就當拜堂，就當謝親，兩當一兒，卻不省事？」他丈母笑道：「也罷，也罷。果然是個省事幹家的女婿。我坐著，你拜麼。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    さて、八戒は姑となる女主人について奥へ入ったが、何重にもいくつ家があるのか分からず、敷居に足を取られて、あちこちぶつかった。
    八戒「お母さん、もっとゆっくり。この中は不案内ですから、手を引いてください。」
    女主人「ここは穀倉、蔵、粉挽き小屋などで、まだ台所のそばにも来ていませんよ。」
    八戒「何て大きな家だ。」
    ぶつかり、角を曲がり、またしばらく歩いて、ようやく奥の広間に着いた。
    女主人「婿どの、兄弟子が今日は天恩の大吉日だと言うので、すぐに迎え入れました。ただ急なことで、陰陽師（いんようし）を呼んで拝堂（はいどう）や撒帳（さっちょう）の儀式をしてもらえませんでした。上座へ八度拝礼なさい。」
    八戒「お母さんのおっしゃるとおりです。上座にお座りください。俺が何度か拝めば、婚礼の礼にも、ご両親へのお礼にもなる。一つで二役なら手間が省けるでしょう。」
    女主人は笑った。女主人「よいでしょう。本当に手間を省く、家の切り盛りのできる婿ですね。私が座るから、拝みなさい。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "原文の「陰陽」はここでは婚礼を扱う暦・吉凶の専門家であり、日本の官職としての陰陽師へ同定しない。撒帳の習俗は教育部辞典を参照した。"
- "id": "xy-ch23-035"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "咦！滿堂中銀燭輝煌，這獃子朝上禮拜。拜畢，道：「娘，你把那個姐姐配我哩？」他丈母道：「正是這些兒疑難：我要把大女兒配你，恐二女怪；要把二女配你，恐三女怪；欲將三女配你，又恐大女怪：所以終疑未定。」八戒道：「娘，既怕相爭，都與我罷，省得鬧鬧吵吵，亂了家法。」他丈母道：「豈有此理！你一人就占我三個女兒不成！」八戒道：「你看娘說的話，那個沒有三房四妾？就再多幾個，你女婿也笑納了。我幼年間，也曾學得個鏖戰之法，管情一個個伏侍得他歡喜。」那婦人道：「不好，不好。我這裡有一方手帕，你頂在頭上，遮了臉，撞個天婚：教我女兒從你跟前走過，你伸開手扯到那個，就把那個配了你罷。」獃子依言，接了手帕，頂在頭上。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    さて、広間には白銀の燭火が輝き、八戒は上座に向かって拝礼した。済むと尋ねた。八戒「お母さん、どのお姉さんを俺の妻にしてくれるんです。」
    女主人「そこが難しいところです。長女をあなたにやれば次女が恨み、次女をやれば末娘が恨み、末娘をやれば長女が恨むかもしれません。それで、まだ決められないのです。」
    八戒「お母さん、争いが心配なら、みんな俺にください。そうすれば騒ぎもなく、家の決まりも乱れません。」
    女主人「何ということを。あなた一人で三人とも独り占めするつもりですか。」
    八戒「お母さん、誰だって妻や妾の三人四人ぐらい持つでしょう。それより多くても、この婿は喜んでお受けします。若いころ、長く戦い続ける術も習いましたから、一人一人、きっと喜んでくれるようお仕えできますよ。」
    女主人「いけません。ここに手巾があります。頭からかぶって顔を隠し、天任せの縁組をしましょう。娘たちをあなたの前に歩かせますから、手を伸ばしてつかまえた子を、妻にしてあげます。」
    八戒は言われたとおり手巾を受け取り、頭からかぶった。これを証す詩がある。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「鏖戰之法」は長く戦う術をうたう性的な含みのある自慢として保ち、具体的な行為の描写を増やさない。"
- "id": "xy-ch23-036"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    痴愚不識本原由，色劍傷身暗自休。
    從來信有周公禮，今日新郎頂蓋頭。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 186
    "line_end": 187
  "translation_ja": |-
    愚かにも事の根本を知らず、色欲の剣に身を傷つけ、人知れず身を滅ぼす。
    昔から周公（しゅうこう）の婚礼の礼はあると聞くが、今日は花婿が顔覆いをかぶっている。
  "translation_status": "reviewed"
- "id": "xy-ch23-037"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子頂裹停當，道：「娘，請姐姐們出來麼。」他丈母叫：「真真、愛愛、憐憐，都來撞天婚，配與你女婿。」只聽得環珮響亮，蘭麝馨香，似有仙子來往。那獃子真個伸手去撈人，兩邊亂撲，左也撞不著，右也撞不著。來來往往，不知有多少女子行動，只是莫想撈著一個。東撲抱著柱科，西撲摸著板壁。兩頭跑暈了，立站不穩，只是打跌。前來蹬著門扇，後去擋著磚牆，磕磕撞撞，跌得嘴腫頭青，坐在地下。喘氣呼呼的道：「娘啊，你女兒這等乖滑得緊，撈不著一個，奈何，奈何？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 188
    "line_end": 188
  "translation_ja": |-
    八戒は覆いをしっかり整えた。八戒「お母さん、お姉さんたちを呼んでください。」
    女主人「真真、愛愛、憐憐、みんなおいで。天任せの縁組で、婿どのと一緒になるのですよ。」
    玉の飾りが鳴り、蘭や麝香が香り、仙女が行き来しているようだった。八戒は本当に人をつかまえようと手を伸ばし、左右へむやみに飛びついたが、右も左も何も捕らえられない。行ったり来たりする女が何人いるか分からないのに、一人もつかめない。東へ飛びつけば柱を抱え、西へ寄れば板壁をなでる。両側へ走って目が回り、立っていられず転ぶばかり。前へ出れば戸に足をぶつけ、後ろへ下がれば煉瓦の壁に遮られ、あちこち打って口は腫れ、頭には青あざができた。ついに地面に座り込み、ふうふう息をついた。八戒「お母さん、娘さんたちはとてもすばしこくて、一人もつかまらない。どうしたらいいんです。」
  "translation_status": "reviewed"
- "id": "xy-ch23-038"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人與他揭了蓋頭道：「女婿，不是我女兒乖滑，他們大家謙讓，不肯招你。」八戒道：「娘啊，既是他們不肯招我啊，你招了我罷。」那婦人道：「好女婿啞！這等沒大沒小的，連丈母也都要了？我這三個女兒心性最巧，他一人結了一個珍珠篏錦汗衫兒。你若穿得那個的，就教那個招你罷。」八戒道：「好，好，好，把三件兒都拿來我穿了看，若都穿得，就教都招了罷。」那婦人轉進房裡，止取出一件來，遞與八戒。那獃子脫下青錦布直裰，取過衫兒，就穿在身上。還未曾繫上帶子，撲的一蹻，跌倒在地。原來是幾條繩緊緊繃住。那獃子疼痛難禁，這些人早已不見了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    女主人は顔覆いを取ってやった。女主人「婿どの、娘がすばしこいのではありません。みんな譲り合って、あなたを婿にしたがらないのです。」
    八戒「お母さん、娘さんたちが嫌なら、お母さんが俺を婿にしてください。」
    女主人「何という婿でしょう。上下の区別もなく、姑まで欲しがるとは。うちの娘たちは手先が器用で、一人一枚ずつ、真珠をはめ込んだ錦の肌着を作りました。着られた肌着を作った娘を、あなたの妻にしましょう。」
    八戒「いい、いい。三枚とも持ってきて、着せてください。全部着られたら、三人とも俺を婿にしてくれればいい。」
    女主人は部屋へ戻り、一枚だけ持ち出して渡した。八戒は青錦の布の直裰（ちょくたつ）を脱ぎ、肌着を受け取って身につけた。まだ帯も結ばぬうち、いきなり体がはね、地面へ倒れた。何本もの縄が、きつく体を締めつけていたのだ。八戒は痛みに耐えられなかったが、女たちの姿はもうなかった。
  "translation_status": "reviewed"
- "id": "xy-ch23-039"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏、行者、沙僧一覺睡醒，不覺的東方發白。忽睜睛擡頭觀看，那裡得那大廈高堂，也不是雕梁畫棟，一個個都睡在松柏林中。慌得那長老忙呼行者。沙僧道：「哥哥，罷了，罷了，我們遇著鬼了。」孫大聖心中明白，微微的笑道：「怎麼說？」長老道：「你看我們睡在那裡耶？」行者道：「這松林下落得快活。但不知那獃子在那裡受罪哩。」長老道：「那個受罪？」行者笑道：「昨日這家子娘女們，不知是那裡菩薩，在此顯化我等，想是半夜裡去了，只苦了豬八戒受罪。」三藏聞言，合掌頂禮。又只見那後邊古柏樹上，飄飄蕩蕩的掛著一張簡帖兒。沙僧急去取來與師父看時，卻是八句頌子云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    三蔵と悟空、沙悟浄がひと眠りして目を覚ますと、いつしか東の空が白んでいた。顔を上げて見ると、高い堂や大きな屋敷、彫刻の梁や彩った棟木はどこにもなく、みな松柏の林の中で眠っていた。三蔵は驚き、急いで悟空を呼んだ。
    沙悟浄「兄貴、大変です。私たちは化け物に会ったんだ。」
    悟空は事情が分かっているので、かすかに笑った。悟空「何を言う。」
    三蔵「私たちがどこで寝ているか、見てごらん。」
    悟空「この松林の下なら、気持ちよく休めます。ただ、あの間抜けがどこで苦しんでいるかは分かりませんが。」
    三蔵「誰が苦しんでいるのだね。」
    悟空は笑った。悟空「昨日の母娘は、どこの菩薩かは存じませんが、ここで私たちに姿を現されたのです。夜中に帰られたのでしょう。気の毒なのは苦しい目に遭っている八戒だけです。」
    三蔵は聞くと手を合わせ、拝礼した。そのとき、後ろの古い柏の木に一枚の書付がひらひら掛かっているのが見えた。沙悟浄が急いで取ってきて三蔵に見せると、八句の偈が記してあった。
  "translation_status": "reviewed"
- "id": "xy-ch23-040"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    黎山老母不思凡，南海菩薩請下山。
    普賢文殊皆是客，化成美女在林間。
    聖僧有德還無俗，八戒無禪更有凡。
    從此靜心須改過，若生怠慢路途難。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 193
    "line_end": 196
  "translation_ja": |-
    黎山老母（りざんろうぼ）は俗世を慕わず、南海菩薩（なんかいぼさつ）の招きで山を下りた。
    普賢（ふげん）と文殊（もんじゅ）もみな客となり、林の中で美女に姿を変えた。
    聖僧には徳があり、なお俗心はないが、八戒には禅心なく、凡心がある。
    これより心を静め、過ちを改めよ。怠りを生めば、道中は難しい。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "四聖の具体名はこの書付で初めて示す。黎山老母は既存の驪山老母と同一項目へ結びつけるが、底本の表記を保持する。娘たちと観音・普賢・文殊の一対一の対応は本文にないため補わない。"
- "id": "xy-ch23-041"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老、行者、沙僧正然唱念此頌，只聽得林深處高聲叫道：「師父啊，繃殺我了，救我一救，下次再不敢了。」三藏道：「悟空，那叫喚的可是悟能麼？」沙僧道：「正是。」行者道：「兄弟，莫睬他，我們去罷。」三藏道：「那獃子雖是心性愚頑，卻只是一味懞直，倒也有些膂力，挑得行李。還看當日菩薩之念，救他隨我們去罷，料他以後再不敢了。」那沙和尚卻捲起鋪蓋，收拾了擔子；孫大聖解韁牽馬，引唐僧入林尋看。咦！這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    三蔵と悟空、沙悟浄がこの偈を唱えていると、林の奥から大声が聞こえた。八戒「お師匠さま、締めつけられて死にそうです。どうか助けてください。もう二度といたしません。」
    三蔵「悟空、あの叫んでいるのは悟能かね。」
    沙悟浄「そのとおりです。」
    悟空「弟よ、かまうな。俺たちは行こう。」
    三蔵「あの者は愚かで頑なではあるが、ただひたすら素直なところもあり、力もあって荷物を担いでくれる。かつての菩薩のお心を思って、助けて一緒に連れていこう。これからはもう同じことはしないだろう。」
    沙悟浄は寝具を巻いて荷をまとめ、悟空は手綱を解いて馬を引き、三蔵を案内して林の中へ探しに入った。まさにこれ、

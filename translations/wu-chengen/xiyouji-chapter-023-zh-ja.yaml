  "source_text": "那婦人道：「既然幹得家事，你再去與你師父商量商量看，不尷尬，便招你罷。」八戒道：「不用商量，他又不是我的生身父母，幹與不幹，都在於我。」婦人道：「也罷，也罷，等我與小女說。」看他閃進去，撲的掩上後門。"

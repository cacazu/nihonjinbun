  "known_gaps":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-001"
    "description_ja": "「本」は書物ではなく修行者の根本・本分をいう回題として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-002"
    "description_ja": "木母・金公・黄婆・赤子は内丹修行の象徴語として残した。特定の臓器や登場人物との対応をこの詩の明示以上に固定しない。「乖猿」「劣馬」は修行の心の比喩と動物の字面を両立した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-006"
    "description_ja": "「大斗篷」は竹・藤で作られた大きな雨具と解した。笠・蓑など構造の細部までは確定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-008"
    "description_ja": "「巴山㨝嶺」は竜の力の列挙から山や峰を動かす意と解したが、㨝の原字と具体的動作には留保がある。原文の㨝を別字へ置き換えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-009"
    "description_ja": "「大達辿步走」は疾走後に歩みに戻る場面。教育部異体字字典（教育百科掲載）は辿を緩歩とし、本回の同じ句を引くため「ゆっくり歩く」は裏付けがある。「大達」の語形と大股とする解釈には留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-011"
    "description_ja": "「見自肚，別腰鬆」は自分の負担でなければ他人の重荷を気にしないという八戒の不平と解した。字面と文脈を保った訳だが、俗語としての細義は未確定。悟空が仏仙の化現を見抜くことと、その具体名を知ることを混同しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-012"
    "description_ja": "八戒の荷担ぎから沙悟浄が荷を下ろす場面への交代は本文で説明されないため、引き継ぎ動作を創作せず原文どおりにした。「退光黑漆」は磨き上げた黒漆と解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-013"
    "description_ja": "「喏喏」は教育部『重編國語辭典修訂本』の応答の声という語義を踏まえ、はいはいと応じる声を訳した。頭を下げる動作は加えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-014"
    "description_ja": "「二色盤龍髮」は髪飾りではなく竜状に巻き上げた髪と解し、二色という描写を保持した。続く「雲鬢半蒼」は半ば白い鬢として訳したが、結髪の細かな形式には留保がある。「官綠」は鮮やかな緑とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-016"
    "description_ja": "「黃水牛」は黄牛と水牛をまとめた表現と解した。千余頭は合計として保持し、種類ごとの頭数を補わない。牛の分類・語の区切りには留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-017"
    "description_ja": "丁亥・三月三日・酉の刻、母と娘の年齢をすべて保持したが、西暦や実際の出生年への換算はしない。申告された身の上として訳し、後に明かされる正体で置換しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-025"
    "description_ja": "悟空が八戒の加入を自分に捕えられた結果として語る箇所は、悟空のからかいを含む発言のまま保持し、過去回の事情を語り手として訂正しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-027"
    "description_ja": "「奈上祝下」は教育部『重編國語辭典修訂本』の礙手礙腳・猶豫為難の語義を照合し、気がねして踏ん切りがつかない意とした。上下の人をなだめるという逐語訳は採らない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-028"
    "description_ja": "「踢天弄井」は教育部辞典の上天入地の本領という語義を照合し、天にも地にも通じる離れ業と訳した。井戸を実際に操作する家事には限定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-030"
    "description_ja": "「牽馬」は馬を引く動作と、縁組を仲介することの掛詞。教育部辞典が本回の用例を挙げる語義を照合し、「馬を引いて、縁も引く」とした。次段の応酬にも二重の意味を残す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-034"
    "description_ja": "原文の「陰陽」はここでは婚礼を扱う暦・吉凶の専門家であり、日本の官職としての陰陽師へ同定しない。撒帳の習俗は教育部辞典を参照した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-035"
    "description_ja": "「鏖戰之法」は長く戦う術をうたう性的な含みのある自慢として保ち、具体的な行為の描写を増やさない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-040"
    "description_ja": "四聖の具体名はこの書付で初めて示す。黎山老母は既存の驪山老母と同一項目へ結びつけるが、底本の表記を保持する。娘たちと観音・普賢・文殊の一対一の対応は本文にないため補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "segment_ids":
    - "xy-ch23-041"
    "description_ja": "原文の発言者は声の時点では名を記さないが、直前までの八戒の状況と直後の悟能という確認から八戒と表示した。三蔵の救出指示と林へ探しに入る動作だけを訳し、実際の救出完了を先取りしない。 本文の欠落ではなく解釈・校訂上の留保。"

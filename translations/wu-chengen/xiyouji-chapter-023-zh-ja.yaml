  "translation_ja": |-
    八戒は大急ぎで手綱を解き、馬を外へ引き出した。
    悟空「沙悟浄、ここで師匠と座っていてくれ。俺があとをつけ、どこで馬を放すか見てこよう。」
    三蔵「悟空、見に行くのはよいが、あまりからかってばかりいてはいけないよ。」
    悟空「承知しました。」
    悟空は広間を出ると身を振るい、赤とんぼに変わって表門から飛び出し、八戒に追いついた。

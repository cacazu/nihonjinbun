- "id": "xy-ch23-002"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    奉法西來道路賒，秋風淅淅落霜花。
    乖猿牢鎖繩休解，劣馬勤兜鞭莫加。
    木母金公原自合，黃婆赤子本無差。
    咬開鐵彈真消息，般若波羅到彼家。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 121
    "line_end": 124
  "translation_ja": |-
    仏法を奉じて西へ行く道は遠く、秋風はさやさやと霜の花を降らす。
    利口な猿は固くつないで縄を解くな、荒馬はこまめに手綱を引き、鞭は加えるな。
    木母（もくぼ）と金公（きんこう）はもともと合うもの、黄婆（こうば）と赤子（せきし）にも本来隔てはない。
    鉄の玉を噛み破れば真の知らせがあり、般若波羅（はんにゃはら）によってかの岸へ至る。
  "translation_status": "reviewed"

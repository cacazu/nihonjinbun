  "translation_ja": |-
    沙悟浄「二番目の兄貴、あなたがここの婿になってはどうです。」
    八戒「弟よ、人に押しつけるな。よく相談しよう。」
    悟空「何を相談する。お前がその気なら、師匠とあの女を親同士の間柄にして、入り婿になればいい。あれほど財宝のある家なら、向こうから婚礼の支度まで整え、親族の顔合わせの宴もしてくれるだろう。俺たちもご相伴にあずかり、お前はここで還俗する。両方にとってよい話じゃないか。」
    八戒「話はそうだが、俗を離れたのにまた戻り、妻を置いてまた妻を迎えることになる。」
    沙悟浄「二番目の兄貴には、もともと奥さんがいたのですか。」
    悟空「お前はまだ知らなかったな。こいつはもと烏斯蔵（うしぞう）の高老荘で、高太公（こうたいこう）の婿だった。俺に降されたんだ。菩薩の戒も受けてはいたが、どうにもならなくなり、俺に捕まって坊主になった。それで前の妻を捨て、師匠に従って西へ仏を拝みに行くことになったんだ。別れて久しいので、またあのことを思い出したんだろう。さっき話を聞いて、その気になったに違いない。間抜け、ここの婿になれよ。ただし俺を何度も拝め。そうすれば告げ口はしないでやる。」
    八戒「でたらめを言うな。みんな同じ気持ちのくせに、俺だけ恥をかかせやがる。『坊主は色欲の餓鬼』というだろう。そうしたくない者がどこにいる。みんなもじもじと気取って、せっかくの話を壊し、そのせいで今は茶も出ず、灯りをつける者もない。この一夜をどうにかしのいでも、馬は明日また人を乗せて歩くんだぞ。今夜までひもじい思いをさせたら、あとは皮を剥ぐしかなくなる。みんなは座っていろ。俺は馬を草に放してくる。」

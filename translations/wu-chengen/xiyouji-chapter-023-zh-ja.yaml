- "id": "xy-ch23-028"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": "雖然人物醜，勤緊有些功。若言千頃地，不用使牛耕。只消一頓鈀，佈種及時生。沒雨能求雨，無風會喚風。房舍若嫌矮，起上二三層。地下不掃掃一掃，陰溝不通通一通。家長里短諸般事，踢天弄井我皆能。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    見た目は醜くとも、まめに働く力がある。
    千頃の畑でも、牛を使って耕す必要はない。
    熊手をひと働きさせれば、時を逃さず種をまいて育てられる。
    雨がなければ雨を願い、風がなければ風を呼べる。
    家が低いと思うなら、二層三層と積み上げよう。
    床が汚れていれば掃き、溝が詰まれば通してやる。
    家の内外のあらゆる用事から、天にも地にも通じる離れ業まで、俺には何でもできる。」

  "source_text": "那獃子拉著馬，有草處且不教吃草，嗒嗒嗤嗤的趕著馬，轉到後門首去。只見那婦人帶了三個女子，在後門外閑立著，看菊花兒耍子。他娘女們看見八戒來時，三個女兒閃將進去。那婦人佇立門首道：「小長老那裡去？」這獃子丟了韁繩，上前唱個喏，道聲「娘，我來放馬的。」那婦人道：「你師父忒弄精細。在我家招了女婿，卻不強似做掛搭僧，往西蹡路？」八戒笑道：「他們是奉了唐王的旨意，不敢有違君命，不肯幹這件事。剛才都在前廳上栽我，我又有些奈上祝下的，只恐娘嫌我嘴長耳大。」那婦人道：「我也不嫌，只是家下無個家長，招一個倒也罷了，但恐小女兒有些兒嫌醜。」八戒道：「娘，你上覆令愛，不要這等揀漢。想我那唐僧，人才雖俊，其實不中用。我醜自醜，有幾句口號兒。」婦人道：「你怎的說麼？」八戒道：「我："

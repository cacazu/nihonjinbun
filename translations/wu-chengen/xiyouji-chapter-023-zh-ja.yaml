- "id": "xy-ch23-003"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這回書蓋言取經之道，不離了一身務本之道也。卻說他師徒四眾了悟真如，頓開塵鎖，自跳出性海流沙，渾無罣礙，徑投大路西來。歷遍了青山綠水，看不盡野草閑花。真個也光陰迅速，又值九秋，但見了些："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 126
    "line_end": 126
  "translation_ja": "この回で語るのは、経を求める道は、自らの根本を修める道から離れないということである。さて、師弟四人は真如（しんにょ）を悟り、たちまち俗塵の鎖を解き、性の海の流砂から跳び出した。もはや何の妨げもなく、大道をまっすぐ西へ進んだ。青い山、緑の水を遍歴し、見尽くせない野草や花々を眺める。まことに月日の流れは速く、また秋たけなわとなった。見えるのはこんな景色である。"
  "translation_status": "reviewed"
- "id": "xy-ch23-004"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    楓葉滿山紅，黃花耐晚風。
    老蟬吟漸懶，愁蟋思無窮。
    荷破青紈扇，橙香金彈叢。
    可憐數行雁，點點遠排空。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 128
    "line_end": 131
  "translation_ja": |-
    楓の葉は山いっぱいに赤く、黄菊は夕風に耐えて咲く。
    老いた蝉は次第に鳴くのもおっくうになり、愁える蟋蟀は思いが尽きない。
    蓮の葉は青い絹団扇の破れた姿、橙は金の玉の群れとなって香る。
    愛らしい数列の雁は、点々と遠い空に並んでゆく。
  "translation_status": "reviewed"
- "id": "xy-ch23-005"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正走處，不覺天晚。三藏道：「徒弟，如今天色又晚，卻往那裡安歇？」行者道：「師父說話差了。出家人餐風宿水，臥月眠霜，隨處是家。又問那裡安歇，何也？」豬八戒道：「哥啊，你可知道你走路輕省，那裡管別人累墜？自過了流沙河，這一向爬山過嶺，身挑著重擔，老大難挨也。須是尋個人家，一則化些茶飯，二則養養精神，才是個道理。」行者道：「獃子，你這般言語，似有報怨之心。還像在高老莊倚懶不求福的自在，恐不能也。既是秉正沙門，須是要吃辛受苦，才做得徒弟哩。」八戒道：「哥哥，你看這擔行李多重？」行者道：「兄弟，自從有了你與沙僧，我又不曾挑著，那知多重？」八戒道：「哥啊，你看看數兒麼："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    歩くうちに、いつしか日が暮れた。
    三蔵（さんぞう）「お前たち、また日が暮れたが、今夜はどこで休もうか。」
    悟空（ごくう）「お師匠さま、それは違います。出家の者は風を食い、水辺に宿り、月の下に横たわり、霜の上に眠るもの。どこでも家です。それなのに、どこで休もうとお尋ねになるのはなぜです。」
    八戒（はっかい）「兄貴、お前は身軽に歩けるから、ほかの者の重荷など気にしないんだろう。流沙河（りゅうさが）を渡ってからずっと山や峠を越え、この重い荷を担いで、たまらないんだ。人家を探し、一つには茶や飯をもらい、二つには気力を養う。それこそ道理ってものだ。」
    悟空「間抜け、その口ぶりは不平がありそうだな。高老荘（こうろうそう）のときのように怠け、功徳も求めず気ままに暮らすわけにはいかんぞ。正しく仏門に入った以上、辛さや苦しさに耐えてこそ弟子だ。」
    八戒「兄貴、この荷がどれほど重いか分かるか。」
    悟空「兄弟、お前と沙悟浄（さごじょう）が来てから、俺は担いだことがない。重さなど分かるものか。」
    八戒「兄貴、それなら中身を数えてみろよ。
  "translation_status": "reviewed"
- "id": "xy-ch23-006"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": "四片黃藤蔑，長短八條繩。又要防陰雨，氈包三四層。匾擔還愁滑，兩頭釘上釘。銅鑲鐵打九環杖，篾絲藤纏大斗篷。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    黄藤を割った板が四枚、長短八本の縄。
    曇りや雨も防がねばならず、毛氈で三重四重に包む。
    天秤棒が滑らないよう、両端には釘まで打つ。
    銅をはめ、鉄で鍛えた九環杖（きゅうかんじょう）、竹ひごと藤を絡めた大きな雨具。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「大斗篷」は竹・藤で作られた大きな雨具と解した。笠・蓑など構造の細部までは確定しない。"
- "id": "xy-ch23-007"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "似這般許多行李，難為老豬一個逐日家擔著走，偏你跟師父做徒弟，拿我做長工。」行者笑道：「獃子，你和誰說哩？」八戒道：「哥哥，與你說哩。」行者道：「錯和我說了。老孫只管師父好歹，你與沙僧專管行李、馬匹。但若怠慢了些兒，孤拐上先是一頓粗棍。」八戒道：「哥啊，不要說打，打就是以力欺人。我曉得你的尊性高傲，你是定不肯挑。但師父騎的馬，那般高大肥盛，只馱著老和尚一個，教他帶幾件兒，也是弟兄之情。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    こんなにたくさんの荷物を、毎日この俺一人に担がせて歩かせる。お前だけは師匠について弟子をやり、俺は年季奉公人扱いか。」
    悟空は笑った。悟空「間抜け、誰に向かって言っている。」
    八戒「兄貴、お前に言っているんだ。」
    悟空「相手を間違えたな。俺は師匠の無事だけを見る。お前と沙悟浄は荷物と馬が役目だ。少しでも怠けたら、まず足首へ太い棒を食わせるぞ。」
    八戒「兄貴、殴るなんて言うな。殴れば力で人をいじめることになる。お前が気位の高い性分で、担ぐ気がないのは分かっている。それなら師匠の馬だ。あんなに大きく肥えていて、乗せるのは坊主一人だけ。いくつか荷を持たせるのも、兄弟の情けじゃないか。」
  "translation_status": "reviewed"
- "id": "xy-ch23-008"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「你說他是馬哩，他不是凡馬，本是西海龍王敖閏之子，喚名龍馬三太子。只因縱火燒了殿上明珠，被他父親告了忤逆，身犯天條，多虧觀音菩薩救了他的性命。他在那鷹愁陡澗久等師父，又幸得菩薩親臨，卻將他退鱗去角，摘了項下珠，才變做這匹馬，願馱師父往西天拜佛。這個都是各人的功果，你莫攀他。」那沙僧聞言道：「哥哥，真個是龍麼？」行者道：「是龍。」八戒道：「哥啊，我聞得古人云：龍能噴雲噯霧，播土揚沙；有巴山㨝嶺的手段，有翻江攪海的神通。怎麼他今日這等慢慢而走？」行者道：「你要他快走，我教他快走個兒你看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空「馬だと言うが、ただの馬じゃない。西海竜王（さいかいりゅうおう）の敖閏（ごうじゅん）の子で、竜馬三太子（りゅうめさんたいし）というんだ。火を放って殿上の宝珠を焼き、父に不孝の罪で訴えられ、天の掟を犯した。観音菩薩（かんのんぼさつ）のおかげで命を救われ、鷹愁陡澗（ようしゅうとうかん）で長く師匠を待っていたんだ。そのうえ菩薩がみずからおいでになり、鱗を落とし、角を除き、首の珠を取り去って、ようやくこの馬に変えられた。師匠を乗せて西天（さいてん）へ仏を拝みに行くのが、その願いだ。功を積む役目はそれぞれにある。あいつまで巻き込むな。」
    沙悟浄「兄貴、本当に竜なのですか。」
    悟空「竜だとも。」
    八戒「兄貴、昔から、竜は雲や霧を吐き、土や砂を巻き上げ、山や峰を動かす腕があり、川をひっくり返し海をかき回す神通力があると聞く。それが、どうして今日はこんなにのろのろ歩くんだ。」
    悟空「速く歩かせたいなら、俺がやって見せよう。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「巴山㨝嶺」は竜の力の列挙から山や峰を動かす意と解したが、㨝の原字と具体的動作には留保がある。原文の㨝を別字へ置き換えない。"
- "id": "xy-ch23-009"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，把金箍棒揝一揝，萬道彩雲生。那馬看見拿棒，恐怕打來，慌得四隻蹄疾如飛電，颼的跑將去了。那師父手軟勒不住，盡他劣性，奔上山崖，才大達辿步走。師父喘息始定，擡頭遠見一簇松陰，內有幾間房舍，著實軒昂，但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 138
    "line_end": 138
  "translation_ja": "悟空が金箍棒（きんこぼう）をぎゅっと握り直すと、万筋の彩雲が湧いた。馬は棒を見るや、打たれるのを恐れて、四つの蹄を稲妻のように動かし、さっと駆け出した。三蔵は手に力が入らず引き止められない。馬は荒い気性のまま山の崖上まで駆け、ようやく大股でゆっくり歩きだした。三蔵の息もやっと静まり、顔を上げて遠くを見ると、ひと群れの松陰に、軒も高い幾棟かの家が見えた。こんな様子である。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「大達辿步走」は疾走後に歩みに戻る場面。教育部異体字字典（教育百科掲載）は辿を緩歩とし、本回の同じ句を引くため「ゆっくり歩く」は裏付けがある。「大達」の語形と大股とする解釈には留保がある。"
- "id": "xy-ch23-010"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": "門垂翠柏，宅近青山。幾株松冉冉，數莖竹斑斑。籬邊野菊凝霜艷，橋畔幽蘭映水丹。粉泥牆壁，磚砌圍圜。高堂多壯麗，大廈甚清安。牛羊不見無雞犬，想是秋收農事閑。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    門には翠の柏が垂れ、屋敷は青山に寄り添う。
    数本の松はしなやかに伸び、幾茎かの竹には斑模様がある。
    垣根の野菊は霜を帯びてつややかに、橋のそばの蘭は赤く水に映る。
    壁は白く塗られ、周囲は煉瓦で囲まれる。
    高い堂は壮麗、大きな屋敷は清らかで静か。
    牛も羊も見えず、鶏も犬もいない。秋の収穫を終え、農事も暇なのだろう。
  "translation_status": "reviewed"
- "id": "xy-ch23-011"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那師父正按轡徐觀，又見悟空兄弟方到。悟淨道：「師父不曾跌下馬來麼？」長老罵道：「悟空這潑猴，他把馬兒驚了，早是我還騎得住哩。」行者陪笑道：「師父莫罵我，都是豬八戒說馬行遲，故此著他快些。」那獃子因趕馬，走急了些兒，喘氣噓噓，口裡唧唧噥噥的鬧道：「罷了，罷了，見自肚，別腰鬆。擔子沉重，挑不上來，又弄我奔奔波波的趕馬。」長老道：「徒弟啊，你且看那壁廂有一座莊院，我們卻好借宿去也。」行者聞言，急擡頭舉目而看，果見那半空中慶雲籠罩，瑞靄遮盈，情知定是佛仙點化，他卻不敢泄漏天機，只道：「好好好，我們借宿去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    三蔵が手綱を押さえ、ゆっくり見ているところへ、悟空たちも着いた。
    沙悟浄「お師匠さま、落馬はなさいませんでしたか。」
    三蔵は叱った。三蔵「悟空の乱暴な猿め、馬を驚かせて。どうにか乗っていられたからよかったものの。」
    悟空は愛想笑いをした。悟空「お師匠さま、私を叱らないでください。八戒が馬は遅いと言ったから、速くさせただけです。」
    八戒は馬を追って急いだため、息を切らし、ぶつぶつ騒いでいた。八戒「ああ、もうたくさんだ。自分の腹に響かぬなら、人の腰がどうなろうが気楽なもんだ。荷は重くて担ぎ上げられないのに、そのうえ馬を追って駆けずり回らせやがる。」
    三蔵「お前たち、あちらに屋敷がある。ちょうど泊めてもらえそうだ。」
    悟空が急いで顔を上げると、確かに空にはめでたい雲が覆い、瑞気が満ちていた。仏か仙人の現したものに違いないと悟ったが、天の秘密を漏らすわけにはいかず、ただ言った。悟空「よいですね。泊めてもらいに行きましょう。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「見自肚，別腰鬆」は自分の負担でなければ他人の重荷を気にしないという八戒の不平と解した。字面と文脈を保った訳だが、俗語としての細義は未確定。悟空が仏仙の化現を見抜くことと、その具体名を知ることを混同しない。"
- "id": "xy-ch23-012"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老連忙下馬。見一座門樓，乃是垂蓮象鼻，畫棟雕梁。沙僧歇了擔子，八戒牽了馬匹道：「這個人家，是過當的富實之家。」行者就要進去，三藏道：「不可，你我出家人，各自避些嫌疑，切莫擅入。且自等他有人出來，以禮求宿，方可。」八戒拴了馬，斜倚牆根之下；三藏坐在石鼓上；行者、沙僧坐在臺基邊。久無人出，行者性急，跳起身入門裡看處，原來有向南的三間大廳，簾櫳高控。屏門上掛一軸壽山福海的橫披畫；兩邊金漆柱上，貼著一副大紅紙的春聯，上寫著：「絲飄弱柳平橋晚；雪點香梅小院春。」正中間設一張退光黑漆的香几，几上放一個古銅獸爐。上有六張交椅兩山頭掛著四季吊屏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    三蔵はすぐに馬を下りた。門楼には垂れ蓮や象の鼻をかたどった飾りがあり、棟木は彩られ、梁には彫刻が施されている。沙悟浄が荷を下ろし、八戒は馬を引きながら言った。八戒「これは並外れた金持ちの家だ。」
    悟空が入ろうとすると、三蔵が止めた。三蔵「いけない。私たちは出家の者だ。疑われるような真似を避け、勝手に入ってはならない。誰か出てくるのを待ち、礼儀正しく宿を頼むのだ。」
    八戒は馬をつなぎ、塀の下にもたれた。三蔵は石の鼓台に座り、悟空と沙悟浄は壇の基部に腰を下ろした。長く待っても誰も出ない。悟空はせっかちなので跳び起き、門の中へ見に入った。南向きの三間の大広間があり、簾は高く巻き上げられている。仕切りの扉には寿山福海（じゅざんふくかい）の横長の絵が掛かり、両側の金塗りの柱には、赤い紙の春聯（しゅんれん）が貼られていた。
    細い柳の枝が糸のようになびく、平らな橋の夕暮れ。
    香る梅に雪が点々ととまる、小さな庭の春。
    中央には磨き上げた黒漆の香机が一つ置かれ、その上には古銅の獣形の香炉がある。奥には交椅（こうい）が六脚、両側の壁には四季を描いた掛け屏風が掛かっていた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "八戒の荷担ぎから沙悟浄が荷を下ろす場面への交代は本文で説明されないため、引き継ぎ動作を創作せず原文どおりにした。「退光黑漆」は磨き上げた黒漆と解した。"
- "id": "xy-ch23-013"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者正然偷看處，忽聽得後門內有腳步之聲，走出一個半老不老的婦人來，嬌聲問道：「是甚麼人，擅入我寡婦之門？」慌得個大聖喏喏連聲道：「小僧是東土大唐來的，奉旨向西方拜佛求經。一行四眾，路過寶方，天色已晚，特奔老菩薩檀府，告借一宵。」那婦人笑語相迎道：「長老，那三位在那裡？請來。」行者高聲叫道：「師父，請進來耶。」三藏才與八戒、沙僧牽馬挑擔而入，只見那婦人出廳迎接。八戒餳眼偷看，你道他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    悟空がそっと覗いていると、奥の戸の内側で足音がし、老いているともいないともつかぬ女性が出てきた。艶のある声で問いかけた。女主人「どなたです。夫を亡くした女の家へ、勝手にお入りになるとは。」
    悟空は慌て、はいはいと応じた。悟空「私は東土（とうど）大唐（だいとう）から来た僧で、勅命を受け、西へ仏を拝み、経をいただきに参ります。一行四人でこの地を通り、日も暮れましたので、お慈悲あるお方のお屋敷を頼り、一晩お泊めいただきに参りました。」
    女主人は笑顔で迎えた。女主人「長老、ほかのお三方はどちらに。お呼びください。」
    悟空は大声で呼んだ。悟空「お師匠さま、お入りください。」
    三蔵は八戒と沙悟浄を連れ、馬と荷物を持って入った。女主人は広間を出て迎えた。八戒は目をとろんとさせて盗み見た。その装いはどのようであったか。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「喏喏」は教育部『重編國語辭典修訂本』の応答の声という語義を踏まえ、はいはいと応じる声を訳した。頭を下げる動作は加えない。"
- "id": "xy-ch23-014"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": "穿一件織錦官綠紵絲襖，上罩著淺紅比甲；繫一條結綵鵝黃錦繡裙，下映著高底花鞋。時樣鬘髻皂紗漫，相襯著二色盤龍髮；宮樣牙梳朱翠晃，斜簪著兩股釧金釵。雲鬢半蒼飛鳳翅，耳環雙墜寶珠排。脂粉不施猶自美，風流還似少年才。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    鮮やかな緑の織り錦の絹の上着に、薄紅の比甲（ひこう）を重ねる。
    彩りを結ぶ淡黄色の刺繍の裳をまとい、その下には底の高い花模様の靴。
    二色の髪を竜がとぐろを巻くように結い上げ、流行りの髷に黒い薄絹をかける。
    宮中風の象牙の櫛には朱と翡翠が輝き、二股の金のかんざしを斜めに挿す。
    雲のような鬢は半ば白く、飛ぶ鳳凰の翼の形。両耳の飾りには宝珠が連なる。
    紅や白粉を施さなくとも美しく、風情はまだ若いころのまま。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「二色盤龍髮」は髪飾りではなく竜状に巻き上げた髪と解し、二色という描写を保持した。続く「雲鬢半蒼」は半ば白い鬢として訳したが、結髪の細かな形式には留保がある。「官綠」は鮮やかな緑とした。"
- "id": "xy-ch23-015"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人見了他三眾，更加欣喜，以禮邀入廳房。一一相見禮畢，請各敘坐看茶。那屏風後，忽有一個丫髻垂絲的女童，托著黃金盤、白玉盞，香茶噴暖氣，異果散幽香。那人綽彩袖，春筍纖長；擎玉盞，傳茶上奉。對他們一一拜了。茶畢，又吩咐辦齋。三藏啟手道：「老菩薩，高姓？貴地是甚地名？」婦人道：「此間乃西牛賀洲之地。小婦人娘家姓賈，夫家姓莫。幼年不幸，公姑早亡，與丈夫守承祖業。有家貲萬貫，良田千頃。夫妻們命裡無子，止生了三個女孩兒。前年大不幸，又喪了丈夫。小婦居孀，今歲服滿。空遺下田產家業，再無個眷族親人，只是我娘女們承領。欲嫁他人，又難捨家業。適承長老下降，想是師徒四眾，小婦娘女四人，意欲坐山招夫，四位恰好。不知尊意肯否如何。」三藏聞言，推聾妝啞，瞑目寧心，寂然不答。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    女主人は三人を見ると、さらに喜び、礼を尽くして広間へ招いた。一人ずつ挨拶を交わすと、席を勧めて茶を命じた。すると屏風の後ろから、髪を二つに結び房を垂らした少女の給仕が、金の盆と白玉の茶碗を捧げて出てきた。香る茶は暖かな湯気を立て、珍しい果物はほのかな香りを放つ。少女が彩りの袖をまくると、若筍のように細く長い指が現れ、玉の茶碗を持って順に差し出し、一人ずつ礼をした。茶が済むと、女主人はさらに精進の食事を用意させた。
    三蔵は手を合わせた。三蔵「お慈悲あるお方、お姓は何とおっしゃいます。ここは何という土地でしょう。」
    女主人「ここは西牛賀洲（さいごかしゅう）でございます。私の実家の姓は賈（か）、嫁ぎ先は莫（ばく）と申します。若いうちに不幸にも舅も姑も亡くなり、夫と二人で先祖の家業を守ってまいりました。財産は万貫、良田は千頃ありますが、夫婦とも息子に恵まれず、娘が三人生まれただけです。一昨年、また不幸にも夫を亡くし、私は寡婦となって、今年ようやく喪が明けました。田畑と家業は残りましたが、ほかに一族も親類もなく、私と娘たちだけが受け継いでおります。再婚しようにも、家業を捨てるのは惜しい。折よく長老方がおいでになりました。一行は師弟四人、こちらは母娘四人。私どもはこの家を守ったまま夫を迎えたいので、人数もちょうどよいのです。お心は、いかがでございましょう。」
    三蔵は聞こえず話せないふりをして、目を閉じ、心を静め、黙って答えなかった。
  "translation_status": "reviewed"
- "id": "xy-ch23-016"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人道：「舍下有水田三百餘頃，旱田三百餘頃，山場果木三百餘頃；黃水牛有一千餘隻，騾馬成群，豬羊無數；東南西北，莊堡草場，共有六七十處；家下有八九年用不著的米穀，十來年穿不著的綾羅，一生有使不著的金銀：勝強似那錦帳藏春，說甚麼金釵兩行。你師徒們若肯回心轉意，招贅在寒家，自自在在，享用榮華，卻不強如往西勞碌？」那三藏也只是如痴如蠢，默默無言。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    女主人「この家には水田が三百余頃、畑が三百余頃、山林や果樹地も三百余頃あります。黄牛と水牛は千頭あまり、騾馬や馬は群れをなし、豚や羊は数えきれません。東西南北にある荘園、囲い地、牧草地は合わせて六、七十か所。家には八、九年では食べ尽くせない穀物、十余年では着尽くせない綾や薄絹、一生かかっても使い尽くせない金銀があります。錦の帳に美女を囲うの、金のかんざしの侍女を二列に並べるのといった暮らしにも、勝るほどです。皆さまがお心を変え、この家へ婿入りなされば、気ままに栄華を味わって暮らせます。西へ苦労しながら歩くより、よほどよいではありませんか。」
    三蔵はただぼんやりしたふりで、黙り続けた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「黃水牛」は黄牛と水牛をまとめた表現と解した。千余頭は合計として保持し、種類ごとの頭数を補わない。牛の分類・語の区切りには留保がある。"
- "id": "xy-ch23-017"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人道：「我是丁亥年三月初三日酉時生，故夫比我年大三歲，我今年四十五歲。大女兒名真真，今年二十歲；次女名愛愛，今年十八歲；三小女名憐憐，今年十六歲：俱不曾許配人家。雖是小婦人醜陋，卻幸小女俱有幾分顏色，女工針指，無所不會。因是先夫無子，即把他們當兒子看養，小時也曾教他讀些儒書，也都曉得些吟詩作對。雖然居住山莊，也不是那十分粗俗之類，料想也配得過列位長老。若肯放開懷抱，長髮留頭，與舍下做個家長，穿綾著錦，勝強如那瓦缽緇衣，芒鞋雲笠。」三藏坐在上面，好便似雷驚的孩子，雨淋的蝦蟆：只是呆呆掙掙，翻白眼兒打仰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    女主人「私は丁亥（ひのとい）の年、三月三日の酉（とり）の刻に生まれました。亡き夫は三つ年上で、私は今年四十五歳です。長女は真真（しんしん）といって二十歳、次女は愛愛（あいあい）で十八歳、末娘は憐憐（れんれん）で十六歳。どの子にもまだ縁談はございません。私は醜い女ですが、幸い娘たちはそれなりの器量で、女の手仕事も針仕事も何でもできます。夫に息子がいなかったので、息子のように育て、幼いころには儒書も少し読ませました。詩を吟じ、対句を作ることも多少は心得ております。山里に暮らしてはいても、まったくの粗野な者ではありませんから、皆さまのお相手も務まるかと存じます。心を開いて髪を伸ばし、この家の主人となって、綾や錦をお召しになれば、土の鉢に黒衣、草鞋に旅笠よりはるかに勝りましょう。」
    上座の三蔵は雷に驚いた子供か、雨に打たれた蝦蟇のように、呆然と目を白黒させ、顔を仰向けるばかりだった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "丁亥・三月三日・酉の刻、母と娘の年齢をすべて保持したが、西暦や実際の出生年への換算はしない。申告された身の上として訳し、後に明かされる正体で置換しない。"
- "id": "xy-ch23-018"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒聞得這般富貴，這般美色，他卻心癢難撓；坐在那椅子上，一似針戳屁股，左扭右扭的，忍耐不住。走上前，扯了師父一把道：「師父，這娘子告誦你話，你怎麼佯佯不睬？好道也做個理會是。」那師父猛擡頭，咄的一聲，喝退了八戒道：「你這個孽畜！我們是個出家人，豈以富貴動心，美色留意，成得個甚麼道理。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    八戒はそれほどの富、それほどの美人と聞き、心がむずむずして仕方がない。椅子に座っていても、尻を針で突かれるようで、左右にもじもじし、我慢できなくなった。三蔵の前へ進み、袖を引いた。八戒「お師匠さま、奥方がお話しになっているのに、なぜ知らん顔をなさるのです。ひと言ぐらいお返事すべきではありませんか。」
    三蔵はぱっと顔を上げ、こらっと一喝して八戒を下がらせた。三蔵「この不心得者め。私たちは出家の身だ。富貴に心を動かされ、美色に気を引かれて、何の道が成し遂げられよう。」
  "translation_status": "reviewed"
- "id": "xy-ch23-019"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人笑道：「可憐，可憐。出家人有何好處？」三藏道：「女菩薩，你在家人，卻有何好處？」那婦人道：「長老請坐，等我把在家人好處說與你聽。怎見得？有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    女主人は笑った。女主人「おいたわしいこと。出家にどんなよさがあるのでしょう。」
    三蔵「慈悲ある奥方、在家の暮らしには、どんなよさがあるのですか。」
    女主人「長老、お座りになって、在家のよさをお聞きください。どんなものか、詩でお話しいたしましょう。
  "translation_status": "reviewed"
- "id": "xy-ch23-020"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    春裁方勝著新羅，夏換輕紗賞綠荷；
    秋有新蒭香糯酒，冬來暖閣醉顏酡。
    四時受用般般有，八節珍饈件件多。
    襯錦鋪綾花燭夜，強如行腳禮彌陀。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 156
    "line_end": 159
  "translation_ja": |-
    春は方勝（ほうしょう）の模様を裁ち、新しい薄絹をまとい、夏は軽い紗に替えて緑の蓮を楽しむ。
    秋には搾りたての香るもち米酒、冬には暖かな部屋で酔い、頬を赤らめる。
    四季の楽しみは何でもそろい、八節（はっせつ）のごちそうも品数豊富。
    錦を重ね、綾を敷いて迎える婚礼の夜、旅して弥陀（みだ）を拝むより、はるかによい。」
  "translation_status": "reviewed"
- "id": "xy-ch23-021"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「女菩薩，你在家人享榮華，受富貴，有可穿，有可吃，兒女團圓，果然是好。但不知我出家的人，也有一段好處。怎見得？有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 161
    "line_end": 161
  "translation_ja": "三蔵「慈悲ある奥方、在家の人が栄華と富貴を楽しみ、衣食に恵まれ、子供たちと集う暮らしは、まことによいでしょう。しかし出家した私たちにも、一つよいところがあるのです。どんなものか、詩で申し上げましょう。"
  "translation_status": "reviewed"
- "id": "xy-ch23-022"
  "section_id": "chapter-23"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    出家立志本非常，推倒從前恩愛堂。
    外物不生閑口舌，身中自有好陰陽。
    功完行滿朝金闕，見性明心返故鄉。
    勝似在家貪血食，老來墜落臭皮囊。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 163
    "line_end": 166
  "translation_ja": |-
    出家の志はもとより尋常でなく、以前の恩愛の堂を倒して出る。
    外の物事に無用の口論を起こさず、身の内にはおのずとよき陰陽がある。
    功と行を満たして金闕（きんけつ）に参り、己の本性を見きわめ、心を明らかにして故郷へ帰る。
    在家で肉食をむさぼり、老いて臭い皮袋にすぎぬ身が朽ちるより、はるかによい。」
  "translation_status": "reviewed"
- "id": "xy-ch23-023"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人聞言，大怒道：「這潑和尚無禮！我若不看你東土遠來，就該叱出。我倒是個真心實意，要把家緣招贅汝等，你倒反將言語傷我。你就是受了戒，發了願，永不還俗，好道你手下人，我家也招得一個，你怎麼這般執法？」三藏見他發怒，只得者者謙謙，叫道：「悟空，你在這裡罷。」行者道：「我從小兒不曉得幹那般事，教八戒在這裡罷。」八戒道：「哥啊，不要栽人麼，大家從長計較。」三藏道：「你兩個不肯，便教悟淨在這裡罷。」沙僧道：「你看師父說的話。弟子蒙菩薩勸化，受了戒行，等候師父。自蒙師父收了我，又承教誨，跟著師父還不上兩月，更不曾進得半分功果，怎敢圖此富貴？寧死也要往西天去，決不幹此欺心之事。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    女主人はこれを聞くと、大いに怒った。女主人「この無礼なお坊さま。東土から遠く来られたのでなければ、叱り出してしまうところです。私は真心から家の財産を添え、皆さまを婿に迎えようとしたのに、かえって言葉で私を傷つけるとは。たとえ戒を受け、願を立て、決して還俗なさらないとしても、お弟子を一人ぐらいこの家に迎えたってよいでしょう。なぜそんなに厳しくなさるのです。」
    三蔵は怒るのを見ると、へりくだって応じるほかなく、呼びかけた。三蔵「悟空、お前がここに残りなさい。」
    悟空「私は子供のころから、そんなことのやり方を知りません。八戒を残してください。」
    八戒「兄貴、人に押しつけるな。みんなでよく相談しよう。」
    三蔵「二人とも嫌なら、悟浄（ごじょう）をここに残そう。」
    沙悟浄「お師匠さま、何というお言葉です。弟子は菩薩のお導きで戒を受け、お師匠さまを待っておりました。お受け入れいただき、教えを賜ってから、まだ二か月もたたず、わずかな功徳さえ積んでおりません。どうしてこんな富を望めましょう。死んでも西天へ参ります。自分の心を欺くことは決していたしません。」
  "translation_status": "reviewed"
- "id": "xy-ch23-024"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那婦人見他們推辭不肯，急抽身轉進屏風，撲的把腰門關上。師徒們撇在外面，茶飯全無，再沒人出。八戒心中焦燥，埋怨唐僧道：「師父忒不會幹事，把話通說殺了。你好道還活著些腳兒，只含糊答應，哄他些齋飯吃了，今晚落得一宵快活。明日肯與不肯，在乎你我了。似這般關門不出，我們這清灰冷灶，一夜怎過？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch23-1512800"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第023回&oldid=1512800"
    "line_start": 169
    "line_end": 169
  "translation_ja": "女主人は皆が断るのを見ると、さっと身を返して屏風の奥へ入り、ばたんと中の戸を閉めた。師弟は外に残され、茶も飯もなく、誰も出てこない。八戒は焦れ、三蔵を責めた。八戒「お師匠さまは交渉が下手すぎます。逃げ道をなくすような言い方ばかりして。少しは余地を残し、曖昧に承知して食事を出させ、今晩は気楽に一夜を過ごせばよかったんです。明日、承知するかしないかは、こちらの勝手でしょう。こんなふうに戸を閉めて出てこなければ、冷えた灰と竈みたいに寒々として、一晩どう過ごすんです。」"
  "translation_status": "reviewed"
- "id": "xy-ch23-025"
  "section_id": "chapter-23"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟淨道：「二哥，你在他家做個女婿罷。」八戒道：「兄弟，不要栽人，從長計較。」行者道：「計較甚的？你要肯，便就教師父與那婦人做個親家，你就做個倒踏門的女婿。他家這等有財有寶，一定倒陪妝奩，整治個會親的筵席，我們也落些受用，你在此間還俗，卻不是兩全其美？」八戒道：「話便也是這等說，卻只是我脫俗又還俗，停妻再娶妻了。」沙僧道：「二哥原來是有嫂子的？」行者道：「你還不知他哩。他本是烏斯藏高老兒莊高太公的女婿，因被老孫降了。他也曾受菩薩戒行，沒及奈何，被我捉他來做個和尚，所以棄了前妻，投師父往西拜佛。他想是離別的久了，又想起那個勾當，卻才聽見這個勾當，斷然又有此心。獃子，你與這家子做了女婿罷，只是多拜老孫幾拜，我不檢舉你就罷了。」那獃子道：「胡說，胡說。大家都有此心，獨拿老豬出醜。常言道：『和尚是色中餓鬼。』那個不要如此？都這們扭扭捏捏的拿班兒，把好事都弄得裂了，致如今茶水不得見面，燈火也無人管。雖熬了這一夜，但那匹馬明日又要馱人，又要走路，再若餓上這一夜，只好剝皮罷了。你們坐著，等老豬去放放馬來。」"

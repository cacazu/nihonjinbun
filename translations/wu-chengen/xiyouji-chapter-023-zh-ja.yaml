  "source_text": "那獃子虎急急的解了韁繩，拉出馬去。行者道：「沙僧，你且陪師父坐這裡，等老孫跟他去，看他往那裡放馬。」三藏道：「悟空，你看便去看他，但只不可只管嘲他了。」行者道：「我曉得。」這大聖走出廳房，搖身一變，變作個紅蜻蜓兒，飛出前門，趕上八戒。"

    "line_end": 176
  "translation_ja": |-
    女主人「家の仕事ができるのなら、もう一度お師匠さまと相談しておいでなさい。差し支えなければ、あなたを迎えましょう。」
    八戒「相談なんか要りません。あの人は俺の生みの親じゃない。するもしないも俺が決めることです。」
    女主人「よいでしょう。それでは娘たちと話してきます。」
    そう言うと、さっと中へ入り、裏戸をばたんと閉めた。

    八戒は馬を引いていたが、草のある所でも食わせず、舌を鳴らして追い立て、裏口へ回った。そこでは女主人と三人の娘が、戸の外に立ち、菊の花を見て遊んでいた。八戒を見ると、娘たちはさっと中へ入った。女主人だけが門口にとどまった。
    女主人「若い長老、どちらへ。」
    八戒は手綱を放し、進み出て礼をした。八戒「お母さん、馬を放しに来たんです。」
    女主人「あなたのお師匠さまは、気難しすぎますね。この家の婿になるほうが、あちこちの寺を渡り歩く僧となって、西へ足を運ぶよりよいでしょうに。」
    八戒は笑った。八戒「あの人たちは唐王（とうおう）の命令を受け、君命には背けないから、この話を受けないんです。さっきも広間でみんな俺に押しつけまして、俺もあれこれ気がねして、踏ん切りがつかないんですが、ただお母さんが俺の長い口や大きな耳を嫌いはしないかと思って。」
    女主人「私は嫌いませんよ。家の主人がいませんから、一人迎えてもよいのですが、娘たちが少し醜いと思うかもしれませんね。」
    八戒「お母さん、娘さんたちに、そんなに男を選り好みしないようお伝えください。あの唐僧（とうそう）は見た目こそよいですが、実際には役に立ちません。俺は醜いなりに、こんな口上があります。」
    女主人「どんな口上です。」

    "translation_ja": |-
      兵たちは四人を取り囲んで担ぎ、たちまち町へ入った。そのまま府の法廷へ引き立て、報告した。捕り手たち「お代官さま、捕り手と民兵一同、盗賊を捕らえて参りました。」
      刺史は堂上に端座し、捕り手たちに褒美を与えてねぎらい、盗品を調べ、寇家に引き取らせた。それから三蔵たちを前へ引き出した。刺史「お前たち坊主は、はるか東から西天（さいてん）へ仏を拝みに行くなどと口で言いながら、実は手を尽くして家の出入りを探り、人家を襲う盗賊だったのだな。」
      三蔵「お代官さま、どうか申し上げることをお聞きください。私は本当に盗賊ではございません。決して偽りは申しません。現に通関文牒（つうかんもんちょう）を持っておりますので、お確かめいただけます。寇洪さまには半月も食事をいただき、深いご厚情を受けました。その私たちが道で賊に出会い、寇家から奪われた品を取り返したのです。ご恩に報いようと返しに行く途中、思いがけず捕り手の方々に捕らえられ、賊とされてしまいました。本当に賊ではございません。どうか詳しくお調べください。」
      刺史「役人の兵に捕らえられると、今度は恩返しだと巧みに言い逃れるのか。道で賊に会ったのなら、なぜ賊も一緒に捕らえ、役所へ届けて恩返しをしなかった。なぜお前たち四人だけなのだ。見ろ、寇梁が出した訴状には、お前たちの名を挙げてある。それでもまだ言い争うつもりか。」
      三蔵はその言葉に、大海に船をのみ込まれたように、魂も消し飛ぶ思いがした。三蔵「悟空、なぜ前へ出て弁明してくれないのです。」
      悟空「盗品を持っていたのは事実です。弁明したところで、どうなりましょう。」
      刺史「そのとおりだ。盗品という証拠が現にある。まだ言い逃れるか。」
      刺史は配下に命じた。刺史「頭を締める縄を持ってこい。この禿げ賊の頭を締めつけ、それから打ち据えろ。」
      悟空は慌て、ひそかに思った。悟空（心中）「お師匠さまにこの災難が定まっているとはいえ、ひどい苦しみまでは与えられん。」
      下役たちが縄を用意して頭を締める輪を結ぶのを見ると、すぐに声を上げた。悟空「お代官、そちらの坊主を締めつけるのはお待ちなさい。昨夜寇家へ押し入った時、灯をつけたのも俺、刀を持ったのも俺、財物を奪ったのも俺、人を殺したのも俺だ。俺が賊の頭だ。打つなら俺だけを打て。あの三人は関係ない。俺さえ放さなければ、それでいい。」
      刺史は聞くと、まずこちらを締めろと命じた。下役たちは一斉に取りかかり、悟空の頭へ縄の輪を掛け、ぐっと締めた。すると、ぶつりと縄が切れた。また結んで締めると、またぶつりと切れた。三度四度と続けても、頭の皮はしわ一つ寄らなかった。
    "translation_status": "reviewed"

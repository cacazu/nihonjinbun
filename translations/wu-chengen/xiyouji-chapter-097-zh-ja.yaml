    "source_text": "好大聖，束一束虎皮裙，抖一抖錦布直裰，走近前，叉手當胸道：「列位是做甚麼的？」賊徒喝道：「這廝不知死活，敢來問我。你額顱下沒眼，不認得我是大王爺爺？快將買路錢來，放你過去。」行者聞言，滿面陪笑道：「你原來是剪徑的強盜。」賊徒發狠叫：「殺了。」行者假假的驚恐道：「大王，大王，我是鄉村中的和尚，不會說話，衝撞莫怪，莫怪。若要買路錢，不要問那三個，只消問我。我是個管帳的，凡有經錢、襯錢，哪裡化緣的、布施的，都在包袱中，盡是我管出入。那個騎馬的雖是我的師父，他卻只會念經，不管閑事，財色俱忘，一毫沒有。那個黑臉的是我半路上收的個後生，只會養馬。那個長嘴的是我雇的長工，只會挑擔。你把三個放過去，我將盤纏、衣缽盡情送你。」眾賊皆說：「這個和尚倒是個老實頭兒。既如此，饒了你命，教那三個丟下行李，放他過去。」行者回頭使個眼色，沙僧就丟了行李擔子，與師父牽著馬，同八戒往西徑走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 131
        "line_end": 131

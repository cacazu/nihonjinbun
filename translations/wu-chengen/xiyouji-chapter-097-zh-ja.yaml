    "source_text": "卻說他師徒們在那華光行院破屋下挨至天曉，方才出門，上路奔西。可可的那些強盜當夜打劫了寇家，繫出城外，也向西方大路上，行經天曉，走過華光院西去，有二十里遠近，藏於山凹中，分撥金銀等物。分還未了，忽見唐僧四眾順路而來，眾賊心猶不歇，指定唐僧道：「那不是昨日送行的和尚來了？」眾賊笑道：「來得好，來得好。我們也是幹這般沒天理的買賣，這些和尚緣路來，又在寇家許久，不知身邊有多少東西，我們索性去截住他，奪了盤纏，搶了白馬湊分，卻不是遂心滿意之事？」眾賊遂持兵器，吶一聲喊，跑上大路，一字兒擺開，叫道：「和尚，不要走，快留下買路錢，饒你性命；牙迸半個『不』字，一刀一個，決不留存。」諕得唐僧在馬上亂戰，沙僧與八戒心慌，對行者道：「怎的了？怎的了？苦耐得半夜雨天，又早遇強徒斷路，誠所謂『禍不單行』也。」行者笑道：「師父莫怕，兄弟勿憂，等老孫去問他一問。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 130
        "line_end": 130
        "source_sequence": 8
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      さて、師弟は華光行院の荒れた建物の軒下で夜明けまで耐え、ようやく外へ出て西へ向かった。折しも寇家を襲った賊も、その夜、縄で城外へ降りると西への大路を進んでいた。夜明けまで歩き、華光行院から西へ二十里（り）ほど行った山あいに隠れ、金銀などを分けていたのである。
      分け終わらないうちに、三蔵たち四人が道をやってくるのが見えた。賊の欲はまだ収まらない。三蔵を指さして言った。盗賊たち「あれは昨日、見送られていた坊主じゃないか。」
      賊どもは笑った。盗賊たち「よく来た、よく来た。どうせ俺たちは、こんな天罰ものの商売をしているんだ。あの坊主たちは旅をしてきて、寇員外の家にも長いこといた。どれだけの物を持っているか知れやしない。いっそ行く手をふさいで旅費を奪い、白馬も分け前に加えよう。そうすれば、願ったりかなったりだ。」
      賊は武器を手にひと声わめくと、大路へ駆け出し、横一列になった。盗賊たち「坊主、止まれ！　通行料を置いていけば命だけは助けてやる。『いや』の半言でも口にしたら、一人一刀で斬り殺す。一人も生かしておかねえぞ。」
      三蔵は馬の上でがたがた震え、沙悟浄も八戒も慌てて悟空に言った。八戒と沙悟浄「どうしたらいい。どうしたらいいんだ。夜中の雨をやっとしのいだのに、もう賊に道をふさがれた。まったく、災難は重なるものだ。」
      悟空は笑った。悟空「お師匠さま、ご心配なく。お前たちも気にするな。この俺が、ちょっと話をつけてくる。」
    "translation_status": "reviewed"

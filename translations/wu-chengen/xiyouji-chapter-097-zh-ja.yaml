    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾官兵攢擁扛擡，須臾間，拿到城裡，徑自解上黃堂報道：「老爺，民快人等，捕獲強盜來了。」那刺史端坐堂上，賞勞了民快，檢看了賊贓，當叫寇家領去。卻將三藏等提近廳前，問道：「你這起和尚，口稱是東土遠來，向西天拜佛，卻原來是些設法屣看門路，打家劫舍之賊。」三藏道：「大人容告：貧僧實不是賊，決不敢假，隨身現有通關文牒可照。只因寇員外家齋我等半月，情意深重，我等路遇強盜，奪轉打劫寇家的財物，因送還寇家報恩，不期民快人等捉獲，以為是賊，實不是賊。望大人詳察。」刺史道：「你這廝見官兵捕獲，卻巧言報恩。既是路遇強盜，何不連他捉來，報官報恩？如何只是你四眾？你看，寇梁遞得失狀，坐名告你，你還敢展掙？」三藏聞言，一似大海吞舟，魂飛魄喪。叫：「悟空，你何不上來折辨？」行者道：「有贓是實，折辨何為？」刺史道：「正是啊，贓證現存，還敢抵賴？」叫手下：「拿腦箍來，把這禿賊的光頭箍他一箍，然後再打。」行者慌了，心中暗想道：「雖是我師父該有此難，還不可教他十分受苦。」他見那皂隸們收拾索子，結腦箍，即便開口道：「大人且莫箍那個和尚。昨夜打劫寇家，點燈的也是我，持刀的也是我，劫財的也是我，殺人的也是我。我是個賊頭，要打只打我，與他們無干，但只不放我便是。」刺史聞言，就教先箍起這個來。皂隸們齊來上手，把行者套上腦箍，收緊了一勒，扢撲的把索子斷了。又結又箍，又扢撲的斷了。一連箍了三四次，他的頭皮皺也不曾皺一些兒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"

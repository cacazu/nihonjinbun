        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      大地は開けて、凶悪なこともそこに置くが、
      天は高く、善い心の人を見捨てはしない。
      心安らかに、確かな足取りで如来（にょらい）への道を進み、
      ただ霊山（れいざん）の極楽（ごくらく）の門を目指す。

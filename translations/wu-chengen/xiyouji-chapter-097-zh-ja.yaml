    "translation_ja": |-
      さすがの悟空、虎皮の腰巻きを締め直し、錦の僧衣を払い、前へ進んで胸の前で両手を組んだ。悟空「皆さまは、何をなさる方ですか。」
      盗賊たち「この野郎、命知らずにも俺たちに尋ねるとは。額の下に目がねえのか。大王さまだと分からねえか。さっさと通行料を出せ。そうすれば通してやる。」
      悟空は満面に愛想笑いを浮かべた。悟空「なるほど、追いはぎの盗賊でしたか。」
      盗賊たち「殺せ！」
      悟空はわざと怯えたふりをした。悟空「大王さま、大王さま、私は田舎の坊主で、口のきき方を知りません。ご無礼はどうかお許しください、お許しください。通行料なら、あの三人には求めず、私だけにおっしゃってください。私は帳場役です。読経のお礼も、供養のお金も、どこかで托鉢（たくはつ）していただいた物も、寄進された物も、みんな包みの中にあり、出し入れは私がしています。馬に乗っているのは私の師匠ですが、読経ができるだけで、ほかのことには関わりません。金も女も忘れ、一文も持っていません。顔の黒いのは途中から連れにした若者で、馬の世話しかできません。口の長いのは雇い入れた下働きで、荷物を担ぐだけです。あの三人を通してくだされば、旅費も衣も鉢も、残らず差し上げます。」
      盗賊たち「こいつは正直な坊主だ。それなら命は助けてやる。三人には荷物を置かせて、通してやろう。」
      悟空が振り向いて目配せすると、沙悟浄は荷を下ろした。師の馬を引き、八戒とともに、そのまま西へ進んでいった。
    "translation_status": "reviewed"
  - "id": "xy-ch97-010"

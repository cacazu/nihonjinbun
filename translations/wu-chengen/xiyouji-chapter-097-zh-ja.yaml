    "translation_ja": "「龔黄」は漢代の名臣、龔遂と黄覇、「卓魯」は卓茂と魯恭を並べたものと解した。刺史の徳をたたえる定型的な比喩であり、転生を事実として断定する文ではない。雪の明かりで勉学する表現も、苦学をたたえる語として残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-005-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「経銭・襯銭」。前者は読経の礼として払う金、後者は僧への供養として施す金品と解した。悟空が盗賊に語っている口実の一部であり、実際にこれだけの金を所持していると語り手が保証したものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-006-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「只有錯捉、沒有錯放」を字義に沿って残した。捕らえることの誤りと、放すことを対比する諺を悟空が口にしているのであり、現代の刑事司法についての一般的な保証ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-007-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭では仲間を組んだ人数は十数人、ここで動きを止められた賊は三十人余り、作った縄は三十本となる。原文の人数と本数をそれぞれ保ち、途中で仲間が増えたなどの説明は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-008-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「囊突突」は、類語「囊囊突突」が口を動かしてぶつぶつ言うさまを表すことを参考に訳した。短い語形そのものの厳密な語感は留保する。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-009-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「設法屣看門路」とする。「屣」の字を別字へ無断で直さず、家の構造や出入りを下調べしたという告発の文脈から訳した。原字の詳しい用法は未確定。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-010-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "轄床は人を仰向けに寝かせて手足を固定する寝台形の刑具。滾肚は腹に当てる棒、敵脳は頭にはめる刑具、攀胸は胸を押さえて寝台から動けなくする刑具と辞書にある。本文は四つを区別し、細かな機械構造や、原文にない追加の傷害は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-011-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は包みを「彼に返す」、元のように包む、獄官に渡して保管させる、という順。返した相手は囚われた一行と解したが、包み直す動作の主体までは明示されていないため、訳でも決めつけない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-012-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「蜢虫児」はここでは小さくなって飛ぶ虫への変化として訳した。バッタ、蚊、別の既知の微小虫など、現代の特定の種へは同定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-013-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「十万家私」は十万という財産の額をいうが、ここでは通貨や換算単位が明示されない。妻が夫に福をもたらしたという評価と、家産の増減の説明は、豆腐屋の老人が語る話として保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-014-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "紙を燃やすのは、死者に金銭を送る供養の行為と解した。棺から聞こえる声は寇洪本人のものではなく、ここまでに明示された悟空の声まねである。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-015-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「校床」は、従者が携帯する腰掛けとして訳した。交床などの折り畳む家具との関係は考えられるが、底本の字を交床へ改めてはいない。正確な構造は未確定。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-016-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「甲科」は古くは科挙の上位の科・等級をいう。明清には進士を広く指す用法もあるため、厳密な順位までは決めず、ここでは上位の科に及第したという自述として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-017-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「伯考姜公乾一」の公は敬称と解し、伯父の名を姜乾一、祈りの形を姜公乾一として保持する。「神子」はここでは先祖の肖像。絵を見た段階では誰の肖像か不明で、刺史の祈りを聞いて初めて悟空が伯父だと知る。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-018-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「綽著經兒」は、手がかりに沿って事を進める意。ここでは、悟空が聞いた祈りの内容を利用する。教育部の辞典は「循著線索」と説明する。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-019-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「折証」は当事者を向き合わせて事実を確かめ、弁明させること。冥府へ呼び出して取り調べるという脅しであり、現実に刺史が死んだという叙述ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-020-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "浪蕩遊神は、この場で悟空が名乗る神の名。「玉帝に遣わされた」という話も悟空の芝居であり、実際に玉帝の勅命が出たと語り手が述べたものではない。役人だけでなく住民と町全体に及ぶ脅しを保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-021-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「魑魅化」は、妖鬼が神光によって変えられ、救済される趣旨と解した。具体的な変化の姿は述べられないため補わない。剣の木が傾き、刀の山が平らになる描写、亡者の生まれ変わりは詩の誇張を含む表現としてそのまま訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-022-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「卦数」は易の六十四卦に重ねた六十四という数と解し、先に老人が述べた寇洪の年齢に結びつけた。寿命が定まっていたという説明は、地蔵王菩薩の発言として保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch97-note-023-body"
    "section_id": "chapter-97"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "寇洪の魂、刺史の伯父の魂、遊神が現れたという説明は、姜坤三が経験をどう理解したかを語るもの。読者に示されている悟空の変化と声まねを、語り手が本物の死者や別の神の出現へ訂正したわけではない。 また、日が昇った後の場面でも底本は「今夜」とする。先の刺史の内心にも同じ表現があり、訳者が「昨夜」にそろえて時間を修復することはしない。"
    "translation_status": "reviewed"

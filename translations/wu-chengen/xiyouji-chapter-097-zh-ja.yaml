    "source_text": "行者一一聽之，卻早五更初點。他就飛入寇家，只見那堂屋裡已停著棺材，材頭邊點著燈，擺列著香燭花果，媽媽在傍啼哭；又見他兩個兒子也來拜哭，兩個媳婦拿兩盞飯兒供獻。行者就釘在他材頭上，咳嗽了一聲。諕得那兩個媳婦查手舞腳的往外跑；寇梁兄弟伏在地下不敢動．只叫：「爹爹！嚛嚛嚛……」那媽媽子膽大，把材頭撲了一把道：「老員外，你活了？」行者學著那員外的聲音道：「我不曾活。」兩個兒子一發慌了，不住的叩頭垂淚，只叫：「爹爹！嚛嚛嚛……」媽媽子硬著膽，又問道：「員外，你不曾活，如何說話？」行者道：「我是閻王差鬼使押將來家與你們講話的。那張氏穿針兒枉口誑舌，陷害無辜。」那媽媽子聽見叫他小名，慌得跪倒磕頭道：「好老兒啊！這等大年紀還叫我的小名兒！我哪些枉口誑舌，害甚麼無辜？」行者喝道：「有個甚麼『唐僧點著火，八戒叫殺人。沙僧劫出金銀去，行者打死你父親』。只因你誑言，把那好人受難。那唐朝四位老師路遇強徒，奪將財物，送來謝我，是何等好意！你卻假捏失狀，著兒子們首官。官府又未細審，又如今把他們監禁。那獄神、土地、城隍俱慌了，坐立不寧，報與閻王。閻王轉差鬼使押解我來家，教你們趁早解放他去；不然，教我在家攪鬧一月，將合家老幼並雞狗之類，一個也不存留。」寇梁兄弟又磕頭哀告道：「爹爹請回，切莫傷殘老幼。待天明就去本府投遞解狀，願認招回，只求存歿均安也。」行者聽了，即叫：「燒紙，我去呀。」他一家兒都來燒紙。"

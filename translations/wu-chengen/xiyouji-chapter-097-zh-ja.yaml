    "source_text": "行者又飛出來看時，東方早已發白。及飛到地靈縣，又見那合縣官卻都在堂上。他思道：「蜢蟲兒說話，被人看見，露出馬腳來不好。」他就半空中改了個大法身，從空裡伸下一隻腳來，把個縣堂屣滿。口中叫道：「眾官聽著：我乃玉帝差來的浪蕩遊神，說你這府監裡屈打了取經的佛子，驚動三界諸神不安，教我傳說，趁早放他；若有差池，教我再來一腳，先踢死合府縣官，後屣死四境居民，把城池都踏為灰燼。」概縣官吏人等慌得一齊跪倒，磕頭禮拜道：「上聖請回。我們如今進府，稟上府尊，即教放出。千萬莫動腳，驚諕死下官。」行者才收了法身，仍變做個蜢蟲兒，從監房瓦縫兒飛入，依舊鑽在轄床中間睡著。"
    "source_languages":
      - "zh-Hant"
    "source_locations":

        "line_end": 140
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      三蔵は、がたがた震え、涙をこぼして言葉も出ない。
      八戒は、くどくどと口を動かし、胸の内で不平を言う。
      沙悟浄は、ぶつぶつ言い、どうしたものかと思い迷う。
      悟空は、にこにこ笑い、これから術を使おうとしている。

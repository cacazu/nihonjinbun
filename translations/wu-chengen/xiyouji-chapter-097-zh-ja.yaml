    "translation_ja": |-
      悟空が再び飛び出して見ると、東の空はもう白んでいた。地霊県へ飛んでいくと、県の役人たちがそろって法廷に出ている。
      悟空（心中）「羽虫がしゃべっているところを見つかったら、正体がばれてまずいな。」
      そこで空中で巨大な姿に変わり、空から片足を下ろし、県の法廷いっぱいに踏み据えて叫んだ。
      悟空「役人ども、聞け！　俺は玉帝（ぎょくてい）に遣わされた浪蕩遊神（ろうとうゆうしん）だ。この府の牢で、経を取りに行く仏弟子たちを無実の罪で打ち据えたため、三界（さんがい）の神々が驚き、安らげずにいるという。そこで俺が言葉を伝えに来た。早く放せ。手違いでもあれば、俺がもう一度蹴りを入れ、まず府と県の役人を全員蹴り殺し、それから四方の住民を踏み殺す。町ごと踏み砕いて、灰にしてやるぞ。」
      県の官吏たちは慌てて一斉にひざまずき、頭を地につけて拝んだ。県の官吏たち「尊い神さま、どうかお帰りください。今すぐ府へ参り、府のお殿さまに申し上げ、ただちに放していただきます。くれぐれも足をお動かしになりませんように。私どもは怖くて死んでしまいます。」
      悟空はようやく巨大な姿を収め、また羽虫に変わった。牢の瓦の隙間から飛び込み、元どおり轄床の中へ潜り、眠った。

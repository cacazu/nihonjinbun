    "source_text": "行者低頭打開包袱，就地撾把塵土，往上一灑，念個咒語，乃是個定身之法；喝一聲：「住！」那夥賊共有三十來名，一個個咬著牙，睜著眼，撒著手，直直的站定，莫能言語，不得動身。行者跳出路口，叫道：「師父，回來，回來。」八戒慌了道：「不好，不好，師兄供出我們來了。他身上又無錢財，包裡又無金銀，必定是叫師父要馬哩。叫我們是剝衣服了。」沙僧笑道：「二哥莫亂說。大哥是個了得的，向者那般毒魔狠怪，也能收服，怕這幾個毛賊？他那裡招呼，必有話說，快回去看看。」長老聽言，欣然轉馬，回至邊前，叫道：「悟空，有甚事叫回來也？」行者道：「你們看這些賊是怎的說？」八戒近前推著他，叫道：「強盜，你怎的不動彈了？」那賊渾然無知，不言不語。八戒道：「好的痴啞了。」行者笑道：「是老孫使個定身法定住也。」八戒道：「既定了身，未曾定口，怎麼連聲也不做？」行者道：「師父請下馬坐著。常言道：『只有錯捉，沒有錯放。』兄弟，你們把賊都扳翻倒綑了，教他供一個供狀，看他是個雛兒強盜，把勢強盜。」沙僧道：「沒繩索哩。」行者即拔下些毫毛，吹口仙氣，變作三十條繩索。一齊下手，把賊扳翻，都四馬攢蹄綑住。卻又念念解咒，那夥賊漸漸甦醒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 132
        "line_end": 132
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      悟空はうつむいて包みを開けると、地面から土ぼこりをひとつかみ取り、上へまいた。呪文を唱える。身を縛って動けなくする術である。悟空「止まれ！」
      賊は合わせて三十人余りいたが、一人残らず、歯を食いしばり、目を見開き、手を広げたまま、棒立ちになった。声も出せず、体も動かせない。悟空は道へ躍り出て呼んだ。悟空「お師匠さま、戻ってください、戻ってください。」
      八戒は慌てた。八戒「まずい、まずい。兄貴が俺たちのことを白状しちまったぞ。あいつの懐に金はないし、包みにも金銀はない。お師匠さまを呼ぶのは、馬をよこせというんだ。俺たちは服をはぎ取られるぞ。」
      沙悟浄は笑った。沙悟浄「二番目の兄さん、でたらめを言わないでください。兄さんは並大抵の人ではありません。これまで、あれほど凶暴な魔物も妖怪も降してきたのに、こんな小賊を恐れるものですか。呼んでいるのですから、何か話があるのでしょう。早く戻ってみましょう。」
      三蔵はその言葉を聞いてほっとし、馬を返してそばへ来た。三蔵「悟空、何があって呼び戻したのです。」
      悟空「この賊どもがどうなっているか、ご覧ください。」
      八戒は近寄って賊を押した。八戒「盗賊、どうして動かねえんだ。」
      賊は何も分からず、一言も発しない。八戒「すっかりぼけて、口もきけなくなったぞ。」
      悟空は笑った。悟空「俺が定身法（ていしんほう）で動けなくしたんだ。」
      八戒「体を止めたのなら、口までは止めていないだろう。どうして声まで出ねえんだ。」
      悟空「お師匠さま、馬を降りてお座りください。『間違って捕らえることはあっても、放して間違いということはない』と言います。お前たち、賊をみんな引き倒して縛れ。白状させて、駆け出しなのか、年季の入った盗賊なのか、調べてみよう。」
      沙悟浄「縄がありません。」
      悟空は毛を抜き、仙気（せんき）を吹きかけ、三十本の縄に変えた。三人で一斉に賊を引き倒し、両手両足をひとまとめに縛った。それから悟空が術を解く呪文を唱えると、賊たちは少しずつ正気を取り戻した。
    "translation_status": "reviewed"
  - "id": "xy-ch97-011"

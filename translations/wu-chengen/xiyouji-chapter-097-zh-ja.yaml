    "translation_ja": |-
      さらに縄を替えて結び直そうとすると、誰かが知らせてきた。報告者「お代官さま、都の陳少保（ちんしょうほう）さまがお着きです。城外へお迎えにお出ましください。」
      刺史はすぐに刑事係の役人へ命じた。刺史「賊どもを牢へ入れ、厳重に見張れ。上役をお迎えしてから、また拷問する。」
      役人は三蔵たち四人を牢の門へ押し込んだ。八戒と沙悟浄は自分たちの荷を担いで持ち込んだ。三蔵「お前たち、どうしてこんなことになったのでしょう。」
      悟空は笑った。悟空「お師匠さま、入りましょう、入りましょう。中では犬に吠えられませんから、かえって面白いですよ。」
      哀れにも四人は引きずり込まれ、一人ずつ轄床（かつしょう）という寝台形の刑具へ押しつけられ、滾肚（こんと）、敵脳（てきのう）、攀胸（はんきょう）という腹、頭、胸を押さえる道具を掛けて締め上げられた。牢番たちはさらに、やたらに打ち据えた。三蔵は苦痛に耐えかね、声を上げた。三蔵「悟空、どうしたらいいのです。どうしたらいいのです。」
      悟空「打つのは金が欲しいからです。『居心地のよい所では身を落ち着け、つらい所では金を使え』と言います。いくらか渡せば、それでやめますよ。」
      三蔵「私のどこに、お金があるのです。」
      悟空「金がなければ、衣服でも同じです。あの袈裟（けさ）をやってしまいましょう。」
      三蔵はそれを聞いて、心臓を刀で刺されたようだった。だが、どうしても殴打に耐えられず、仕方なく口を開いた。三蔵「悟空、お前に任せます。」

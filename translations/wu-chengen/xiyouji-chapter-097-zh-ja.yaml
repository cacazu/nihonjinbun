    "source_text": "當時坐了堂，發放了一應事務，即令擡出放告牌。這寇梁兄弟抱牌而入，跪倒高叫道：「爺爺，小的們是告強盜得財，殺傷人命重情事。」刺史接上狀去，看了這般這的，如此如彼，即問道：「昨日有人傳說，你家齋僧圓滿，齋得四眾高僧，乃東土唐朝的羅漢，花撲撲的滿街鼓樂送行，怎麼卻有這般事情？」寇梁等磕頭道：「爺爺，小的父親寇洪，齋僧二十四年。因這四僧遠來，恰足萬僧之數，因此做了圓滿，留他住了半月。他就將路道、門窗都看熟了。當日送出，當晚復回，乘黑夜風雨，遂明火執杖，殺進房來，劫去金銀財寶、衣服首飾，又將父打死在地。望爺爺與小民做主。」刺史聞言，即點起馬步快手并民壯人役，共有百五十人，各執鋒利器械，出西門，一直來趕唐僧四眾。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 129
        "line_end": 129
        "source_sequence": 7
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      その時、刺史は法廷に出て一通りの用務を済ませ、訴えの受け付けを知らせる札を運び出させた。寇梁と寇棟は札を抱えて中へ入り、ひざまずいて声を張り上げた。寇梁と寇棟「お代官さま、盗賊に財物を奪われ、人の命まで失われた重大な事件を訴えに参りました。」
      刺史は訴状を受け取り、あれこれと事情を読んでから尋ねた。刺史「昨日、お前たちの家では施食の願いを果たし、東の唐から来た四人の高僧、羅漢（らかん）たちに食事を供したと聞いた。町じゅうに楽の音を響かせ、華やかに見送ったというではないか。それが、どうしてこのようなことになった。」
      寇梁と寇棟は頭を地につけて答えた。寇梁と寇棟「お代官さま、父の寇洪は二十四年の間、僧に食事を供してきました。遠方から来たこの四人で、ちょうど一万人に達しましたので、願いの成就を祝い、半月滞在していただいたのです。その間に、道筋も門も窓も、すべて見覚えられてしまいました。見送ったその日の晩に舞い戻り、闇と風雨に乗じて、火を掲げ、武器を持って部屋へ押し入ったのです。金銀財宝、衣服、装身具を奪い、父まで地面に打ち殺しました。どうか私どものため、お裁きください。」
      刺史はそれを聞くと、騎馬と徒歩の捕り手、民兵や役夫を合わせて百五十人呼び集めた。それぞれ鋭い武器を持たせ、西門からまっすぐ三蔵たち四人を追わせた。
    "translation_status": "reviewed"
  - "id": "xy-ch97-008"
    "section_id": "chapter-97"

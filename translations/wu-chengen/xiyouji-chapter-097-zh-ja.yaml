    "source_text": "一家子吵吵鬧鬧，不覺天曉。一壁廂傳請親人，置辦棺木；一壁廂寇梁兄弟，赴府投詞。原來這銅臺府刺史正堂大人："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 126

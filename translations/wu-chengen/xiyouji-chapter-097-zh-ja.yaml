    "source_text": "三藏師徒們將著金銀服飾拿轉，正行處，忽見那槍刀簇簇而來。三藏大驚道：「徒弟，你看那兵器簇擁相臨，是甚好歹？」八戒道：「禍來了，禍來了，這是那放去的強盜，他取了兵器，又夥了些人，轉過路來與我們鬥殺也。」沙僧道：「二哥，那來的不是賊勢。──大哥，你仔細觀之。」行者悄悄的向沙僧道：「師父的災星又到了，此必是官兵捕賊之意。」說不了，眾兵卒至邊前，撒開個圈子陣，把他師徒圍住道：「好和尚！打劫了人家東西，還在這裡搖擺哩。」一擁上前，先把唐僧抓下馬來，用繩綑了；又把行者三人，也一齊綑了。穿上杠子，兩個擡一個，趕著馬，奪了擔，徑轉府城。只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 138

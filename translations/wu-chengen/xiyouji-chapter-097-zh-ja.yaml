        "source_sequence": 5
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": "家中が泣いたり騒いだりしているうちに、いつしか夜が明けた。一方では親類を呼び、棺を用意し、もう一方では寇梁と寇棟が府の役所へ訴え出た。この銅台府を治める刺史（しし）は、そもそもこのような人であった。"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-001"
      "description_ja": "回題の「外護」は出家者を外から支える在家の施主を指すと解し、「本原」は命の根源と訳した。「魔蟄」の字面は魔による害を表すものとして取り、特定の虫や未登場の魔物は補わない。回題自体の予告と、本文の情報開示は区別した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-003"
      "description_ja": "「他兄弟」は寇梁と寇棟の兄弟をまとめて指すものと解した。ここでどちらか一人の発言と決めたり、どちらが兄かを補ったりしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-006"
      "description_ja": "「龔黄」は漢代の名臣、龔遂と黄覇、「卓魯」は卓茂と魯恭を並べたものと解した。刺史の徳をたたえる定型的な比喩であり、転生を事実として断定する文ではない。雪の明かりで勉学する表現も、苦学をたたえる語として残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-009"
      "description_ja": "原文は「経銭・襯銭」。前者は読経の礼として払う金、後者は僧への供養として施す金品と解した。悟空が盗賊に語っている口実の一部であり、実際にこれだけの金を所持していると語り手が保証したものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-015"
      "description_ja": "底本の「囊突突」は、類語「囊囊突突」が口を動かしてぶつぶつ言うさまを表すことを参考に訳した。短い語形そのものの厳密な語感は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-016"
      "description_ja": "底本は「設法屣看門路」とする。「屣」の字を別字へ無断で直さず、家の構造や出入りを下調べしたという告発の文脈から訳した。原字の詳しい用法は未確定。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-020"
      "description_ja": "原文は包みを「彼に返す」、元のように包む、獄官に渡して保管させる、という順。返した相手は囚われた一行と解したが、包み直す動作の主体までは明示されていないため、訳でも決めつけない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-021"
      "description_ja": "「蜢虫児」はここでは小さくなって飛ぶ虫への変化として訳した。バッタ、蚊、別の既知の微小虫など、現代の特定の種へは同定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-021"
      "description_ja": "「十万家私」は十万という財産の額をいうが、ここでは通貨や換算単位が明示されない。妻が夫に福をもたらしたという評価と、家産の増減の説明は、豆腐屋の老人が語る話として保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-023"
      "description_ja": "原文の「校床」は、従者が携帯する腰掛けとして訳した。交床などの折り畳む家具との関係は考えられるが、底本の字を交床へ改めてはいない。正確な構造は未確定。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-023"
      "description_ja": "「甲科」は古くは科挙の上位の科・等級をいう。明清には進士を広く指す用法もあるため、厳密な順位までは決めず、ここでは上位の科に及第したという自述として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-023"
      "description_ja": "「伯考姜公乾一」の公は敬称と解し、伯父の名を姜乾一、祈りの形を姜公乾一として保持する。「神子」はここでは先祖の肖像。絵を見た段階では誰の肖像か不明で、刺史の祈りを聞いて初めて悟空が伯父だと知る。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-030"
      "description_ja": "「魑魅化」は、妖鬼が神光によって変えられ、救済される趣旨と解した。具体的な変化の姿は述べられないため補わない。剣の木が傾き、刀の山が平らになる描写、亡者の生まれ変わりは詩の誇張を含む表現としてそのまま訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch97-1455646"
      "segment_ids":
        - "xy-ch97-032"
      "description_ja": "寇洪の魂、刺史の伯父の魂、遊神が現れたという説明は、姜坤三が経験をどう理解したかを語るもの。読者に示されている悟空の変化と声まねを、語り手が本物の死者や別の神の出現へ訂正したわけではない。 また、日が昇った後の場面でも底本は「今夜」とする。先の刺史の内心にも同じ表現があり、訳者が「昨夜」にそろえて時間を修復することはしない。 原文の欠落ではなく、解釈・校訂上の留保。"

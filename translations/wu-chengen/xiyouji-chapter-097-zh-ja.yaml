    "source_text": "卻又換索子再結時，只聽得有人來報道：「老爺，都下陳少保爺爺到了，請老爺出郭迎接。」那刺史即命刑房吏：「把賊收監，好生看轄。待我接過上司，再行拷問。」刑房吏遂將唐僧四眾推進監門。八戒、沙僧將自己行李擔進隨身。三藏道：「徒弟，這是怎麼起的？」行者笑道：「師父，進去，進去，這裡邊沒狗叫，倒好耍子。」可憐把四眾捉將進去，一個個都推入轄床，扣拽了滾肚、敵腦、攀胸。禁子們又來亂打。三藏苦痛難禁，只叫：「悟空，怎的好？怎的好？」行者道：「他打是要錢哩。常言道：『好處安身，苦處用錢。』如今與他些錢，便罷了。」三藏道：「我的錢自何來？」行者道：「若沒錢，衣物也是，把那袈裟與了他罷。」三藏聽說，就如刀刺其心。一時間見他打不過，只得開言道：「悟空，隨你罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"

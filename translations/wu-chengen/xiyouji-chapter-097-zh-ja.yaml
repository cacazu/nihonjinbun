    "source_text": "唐三藏，戰戰兢兢，滴淚難言；豬八戒，絮絮叨叨，心中報怨。沙和尚，囊突突，意下躊躇；孫行者，笑嘻嘻，要施手段。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"

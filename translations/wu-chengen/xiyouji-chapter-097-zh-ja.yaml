  - "id": "xy-ch97-006"
    "section_id": "chapter-97"
    "kind": "verse"
    "origin": "source"
    "source_text": "平生正直，素性賢良。少年向雪案攻書，早歲在金鑾對策。常懷忠義之心，每切仁慈之念。名揚青史播千年，龔黃再見；聲振黃堂傳萬古，卓魯重生。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 128
        "line_end": 128
        "source_sequence": 6
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      生涯の行いは正しく、生まれつき賢く善良。
      少年のころは雪明かりの机で書を学び、若くして宮殿で帝の問いに答えた。
      常に忠義の心を抱き、いつも慈しみの思いを切にする。
      名は歴史に輝いて千年に広まり、龔遂（きょうすい）と黄覇（こうは）が再び現れたかのよう。
      声望は府の役所から万代に伝わり、卓茂（たくも）と魯恭（ろきょう）が生まれ変わったかのよう。
    "translation_status": "reviewed"
  - "id": "xy-ch97-007"
    "section_id": "chapter-97"

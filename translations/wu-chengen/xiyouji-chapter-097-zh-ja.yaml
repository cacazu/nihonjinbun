      牢番たちは聞くなり一斉に手を出し、二つの包みを解いた。布の服が幾つかあり、証文を入れる袋もあったが、どれも金になりそうにない。ただ、何重もの油紙に包まれた一品が、夕焼けのような光を放っていたので、よい物だと分かった。広げてみると、そこには、

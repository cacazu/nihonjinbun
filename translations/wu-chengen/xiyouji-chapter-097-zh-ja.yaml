    "source_text": "說不了，已至堂口。那刺史、知縣並府縣大小官員一見，都下來迎接道：「聖僧昨日來時，一則接上司忙迫，二則又見了所獲之贓，未及細問端的。」唐僧合掌躬身，又將前情細陳了一遍。眾官滿口認稱，都道：「錯了，錯了。莫怪，莫怪。」又問獄中可曾有甚疏失。行者近前努目睜看，厲聲高叫道：「我的白馬是堂上人得了，行李是獄中人得了，快快還我。今日卻該我拷較你們了：枉拿平人做賊，你們該個甚罪？」府縣官見他作惡，無一個不怕，即便叫收馬的牽馬來，收行李的取行李來，一一交付明白。你看他三人一個個逞兇，眾官只以寇家遮飾。三藏勸解了道：「徒弟，是也不得明白。我們且到寇家去，一則吊問，二來與他對證對證，看是何人見我做賊？」行者道：「說得是。等老孫把那死的叫起來，看是哪個打他？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 155
        "line_end": 155
        "source_sequence": 27
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      言い終わらぬうちに法廷の入口へ着いた。姜坤三、知県、それに府県の大小の官吏は、四人を見るとそろって降りて迎えた。
      府県の官たち「聖僧さま方、昨日おいでになった時は、一つには上役を迎えるために忙しく、もう一つには押収した盗品を見たため、真相を詳しく伺うところまで至りませんでした。」
      三蔵は合掌して身をかがめ、改めてこれまでの事情を細かく話した。官たちは口々に認めた。府県の官たち「誤りでございました、誤りでございました。どうかお許しください、お許しください。」
      さらに、牢で何か不都合はなかったかと尋ねた。悟空は前へ出て目をむき、厳しい声で叫んだ。悟空「俺の白馬は法廷の者が取り、荷物は牢の者が取った。さっさと返せ！　今日は俺がお前たちを取り調べる番だ。罪のない人間を賊として捕らえたお前たちは、どんな罪に当たる。」
      府県の官たちは悟空が荒れ狂うのを見て、誰一人として恐れずにはいられなかった。すぐに馬を預かる者に引いてこさせ、荷物を預かる者に持ってこさせ、一つずつはっきりと引き渡した。三人の弟子はそろって威勢を振るい、役人たちは寇家のせいにして、ただ取り繕うばかりだった。
      三蔵はなだめた。三蔵「お前たち、それでは是非もはっきりしません。まず寇家へ行きましょう。一つには弔意を伝え、もう一つには向こうと突き合わせて、誰が私たちを賊と見たのか、確かめるのです。」
      悟空「そのとおりです。この俺が死んだ人を呼び起こして、誰に殺されたのか聞いてみましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch97-028"
    "section_id": "chapter-97"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧就在府堂上把唐僧撮上馬，吆吆喝喝，一擁而出。那些府縣多官，也一一俱到寇家。諕得那寇梁兄弟在門前不住的磕頭，接進廳。只見他孝堂之中，一家兒都在孝幔裡啼哭。行者叫道：「那打誑語栽害平人的媽媽子且莫哭，等老孫叫你老公來，看他說是哪個打死的，羞他一羞。」眾官員只道孫行者說的是笑話。行者道：「列位大人，略陪我師父坐坐。八戒、沙僧，好生保護。等我去了就來。」好大聖，跳出門，望空就起。只見那遍地彩霞籠住宅，一天瑞氣護元神。眾等方才認得是個騰雲駕霧之仙，起死回生之聖，這裡一一焚香禮拜不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 156
        "line_end": 156
        "source_sequence": 28
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      沙悟浄は府の法廷で三蔵をひょいと馬へ乗せた。一行は声高に呼び交わしながら、どっと出ていった。府県の官たちも皆、寇家へ向かった。寇梁と寇棟は怯えきり、門前で何度も頭を地につけ、広間へ迎え入れた。喪の広間では、一家がそろって喪の幕の内側で泣いていた。
      悟空は呼ばわった。悟空「嘘をついて罪のない人を陥れた婆さん、泣くのは待ちな。俺がお前の亭主を呼んでくる。誰に殺されたと言うか聞いて、お前に恥をかかせてやる。」
      官たちはみな、悟空が冗談を言っているのだと思った。悟空「お役人方、少しお師匠さまのお相手をしていてくれ。八戒、沙悟浄、しっかりお守りしろ。行ってすぐ戻る。」
      さすがの悟空、門の外へ躍り出ると空へ飛び上がった。地を覆う五色の雲が家を包み、空いっぱいの瑞気が元神（げんしん）を護る。皆はここに至って、雲や霧に乗る仙人、死者をよみがえらせる聖者なのだと分かり、それぞれ香を焚いて拝んだ。その話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch97-029"

    "source_text": "行者謝辭了菩薩，將他吹化為氣，掉於衣袖之間，同去幽府，復返陽間。駕雲頭，到了寇家，即喚八戒捎開材蓋，把他魂靈兒推付本身。須臾間，透出氣來活了。那員外爬出材來，對唐僧四眾磕頭道：「師父，師父，寇洪死於非命，蒙師父至陰司救活，乃再造之恩。」言謝不已。及回頭，見各官羅列，即又磕頭道：「列位老爹都如何在舍？」那刺史道：「你兒子始初遞失狀，坐名告了聖僧，我即差人捕獲。不期聖僧路遇殺劫你家之賊，奪取財物，送還你家。是我下人誤捉，未得詳審，當送監禁。今夜被你顯魂，我先伯亦來家訴告，縣中又蒙浪蕩遊神下界，一時就有這許多顯應，所以放出聖僧。聖僧卻又去救活你也。」那員外跪道：「老爹，其實枉了這四位聖僧。那夜有三十多名強盜，明火執杖，劫去家私。是我難捨，向賊理說，不期被他一腳，撩陰踢死。與這四位何干？」叫過妻子來，「是誰人踢死，你等輒敢妄告？請老爹定罪。」當時一家老小只是磕頭。刺史寬恩，免其罪過。寇洪教安排筵宴，酬謝府縣厚恩。個個未坐回衙。至次日，再掛齋僧牌，又款留三藏。三藏決不肯住。卻又請親友，辦旌幢，如前送行而去。咦！這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 162
        "line_end": 162
        "source_sequence": 32
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      悟空は菩薩に礼を述べて別れ、寇洪に息を吹きかけて一筋の気に変え、袖の中へ収めた。ともに冥府を去り、この世へ戻った。雲に乗って寇家へ着くと、すぐに八戒へ棺の蓋をこじ開けさせ、その魂を寇洪自身の体へ押し戻した。ほどなく息が通い、寇洪は生き返った。
      棺から這い出ると、三蔵たち四人に頭を地につけた。寇洪「老師さま、老師さま。寇洪は非業の死を遂げましたが、老師さまが冥府へおいでくださり、生き返らせてくださいました。命をもう一度造っていただいたご恩です。」
      礼を言っても言っても尽きない。振り返ると官たちが並んでいるので、また頭を地につけた。寇洪「お役人さま方は、どうして皆さま、私の家へおいでなのです。」
      姜坤三「初めにお前の息子たちが被害の訴状を出し、聖僧たちを名指しで告訴したので、私が人を遣わして捕らえた。ところが聖僧たちは、お前の家を襲って殺人を働いた賊と道で会い、財物を取り返して、家へ返しに来るところだったのだ。私の配下が誤って捕らえ、十分に取り調べぬまま牢へ送った。今夜、お前の魂が現れ、私の亡き伯父も家へ来て訴えた。県には浪蕩遊神まで下ってきた。一度にそれほどの霊験があったので、聖僧を釈放したのだ。聖僧はさらに、お前を生き返らせに行かれたというわけだ。」
      寇洪はひざまずいて言った。寇洪「お役人さま、この四人の聖僧さまは、本当に無実でございます。あの夜、三十人余りの盗賊が、火を掲げ、武器を持って家財を奪いました。私は惜しくてたまらず、賊に話をしに出たところ、思いがけず陰部を一蹴りされて死んだのです。この四人に何の関わりがありましょう。」
      妻を呼び寄せ、続けた。寇洪「誰が蹴り殺したのだ。お前たちは、よくもでたらめな訴えをしたな。お役人さま、どうか罪をお定めください。」
      一家の老いも若きも、ただ頭を地につけるばかりだった。姜坤三は寛大に、その罪を許した。寇洪は宴を用意させ、府県の官たちの厚意に礼を尽くそうとしたが、皆、席には着かず役所へ帰った。
      翌日になると、寇洪はまた施食の札を掲げ、三蔵を心を込めて引き留めた。三蔵は、どうしても泊まろうとしなかった。そこで再び親類や友人を招き、旗や幡を用意し、前のように見送って送り出した。ああ、まさにこういうことだ。
    "translation_status": "reviewed"

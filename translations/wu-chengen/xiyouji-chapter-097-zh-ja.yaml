    "source_text": "眾皆爭看，又驚動本司獄官，走來喝道：「你們在此嚷甚的？」禁子們跪道：「老爹，才子提審，送下四個和尚，乃是大夥強盜。他見我們打了他幾下，把這兩個包袱與我。我們打開看時，見有此物，無可處置：若眾人扯破分之，其實可惜；若獨歸一人，眾人無利。幸老爹來，憑老爹做個劈著。」獄官見了，乃是一件袈裟；又將別項衣服，並引袋兒通檢看了。又打開袋內關文一看，見有各國的寶印花押，道：「早是我來看呀，不然，你們都撞出事來了。這和尚不是強盜，切莫動他衣物。待明日太爺再審，方知端的。」眾禁子聽言，將包袱還與他，照舊包裹，交與獄官收訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 148
        "line_end": 148
        "source_sequence": 20
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      皆が争って見入る騒ぎは、牢を取り仕切る獄官の耳にまで入った。獄官はやってきて叱りつけた。獄官「ここで何を騒いでいる。」
      牢番たちはひざまずいた。牢番たち「お頭さま、先ほど取り調べのあと、四人の坊主が送られてきました。大盗賊の一味だということです。私どもが何度か打つと、この二つの包みをくれました。開けてみたら、こんな物が入っていたので、どうしてよいか分からないのです。皆で引き裂いて分けるのは、いかにも惜しい。一人がもらえば、ほかの者に得がありません。ちょうどお頭さまがおいでになったので、どう分けるかお決めください。」
      獄官が見ると、それは袈裟だった。ほかの衣服も、証文袋も残らず調べた。さらに袋の中の通行証を開くと、諸国の王の印や署名がある。獄官「私が見に来てよかった。さもなければ、お前たちは大変なことをしでかすところだったぞ。この坊主たちは盗賊ではない。決して衣服に手をつけるな。明日、お代官さまがもう一度調べれば、真相が分かるだろう。」
      牢番たちはその言葉に従い、包みを四人に返した。包みは元どおりに包み直され、獄官に渡されて保管された。

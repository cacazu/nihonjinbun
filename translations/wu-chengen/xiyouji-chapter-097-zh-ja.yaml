    "translation_ja": |-
      受けた恩に恩で報いる者は世に少なく、
      かえって慈しみを恨みへ変えてしまう。
      水へ飛び込み人を救えば、結局は損をする。
      三度考えてから行動すれば、憂いを免れよう。
    "translation_status": "reviewed"

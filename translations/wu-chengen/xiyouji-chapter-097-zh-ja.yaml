    "source_text": "行者一翅飛起，徑又飛至刺史住宅裡面，低頭觀看，那房內裡已有燈光，見刺史已起來了。他就飛進中堂看時，只見中間後壁掛著一軸畫兒，是一個官兒騎著一匹點子馬，有幾個從人打著一把青傘，搴著一張校床，更不識是甚麼故事。行者就丁在中間。忽然那刺史自房裡出來，彎著腰梳洗。行者猛的裡咳嗽一聲，把刺史諕得慌慌張張，走入房內。梳洗畢，穿了大衣，即出來對著畫兒焚香禱告道：「伯考姜公乾一神位：孝姪姜坤三，蒙祖上德廕，忝中甲科，今叨受銅臺府刺史，旦夕侍奉香火不絕，為何今日發聲？切勿為邪為祟，恐諕家眾。」行者暗笑道：「此是他大爺的神子。」卻就綽著經兒叫道：「坤三賢姪，你做官雖承祖廕，一向清廉，怎的昨日無知，把四個聖僧當賊，不審來音，囚於禁內？那獄神、土地、城隍不安，報與閻君，閻君差鬼使押我來對你說，教你推情察理，快快解放他；不然，就教你去陰司折證也。」刺史聽說，心中悚懼道：「大爺請回，小姪升堂，當就釋放。」行者道：「既如此，燒紙來，我去見閻君回話。」刺史復添香燒紙拜謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":

    "translation_ja": |-
      悟空は羽ばたき、今度は刺史の住まいへまっすぐ飛んだ。見下ろすと、部屋にはもう灯がつき、刺史も起きている。広間へ入ってみると、奥の壁の中央に一幅の絵が掛かっていた。斑のある馬に役人が乗り、数人の従者が青い傘を差しかけ、折り畳み式の腰掛けを運んでいる。何を描いたものか、悟空にはさっぱり分からなかった。そこで絵の真ん中にとまった。
      刺史が部屋から出てきて、腰をかがめて顔を洗おうとすると、悟空は突然咳をひとつした。刺史は仰天し、慌ただしく部屋へ逃げ込んだ。身支度を終え、礼服を着ると、また出てきて絵に向かって香を焚き、祈った。
      刺史「亡き伯父、姜公乾一（きょうこうけんいつ）の御霊に申し上げます。孝を尽くす甥、姜坤三（きょうこんさん）は、祖先のご加護によって、かたじけなくも科挙（かきょ）に上位で及第し、今は銅台府の刺史を拝命しております。朝夕、香を絶やさずお仕えしておりますのに、今日はなぜお声をお出しになったのでしょう。どうか怪異や祟りとなって、家の者を怯えさせないでください。」
      悟空はひそかに笑った。悟空（心中）「こいつの伯父の肖像だったのか。」
      そこで、今聞いた話を手がかりに呼びかけた。悟空「坤三（こんさん）、よい甥よ。お前は祖先の恩を受けて官に就き、これまでは清廉にしてきた。それなのに昨日はなぜ分別を失い、四人の聖僧を賊とし、事情も調べず牢へ入れたのだ。牢の神、土地神、城隍が心を乱し、閻王へ訴えた。閻王は鬼の使いに私を連れてこさせ、お前に話すよう命じたのだ。事情と道理をよく考え、早く釈放せよ。さもなければ、お前を冥府へ呼んで申し開きをさせることになる。」
      姜坤三はそれを聞き、心底怯えた。姜坤三「伯父上、どうかお帰りください。私が法廷へ出ましたら、ただちに釈放いたします。」
      悟空「それなら、紙銭を燃やせ。私は閻王のもとへ戻り、報告する。」
      姜坤三はさらに香を供え、紙銭を燃やし、拝んで礼を述べた。

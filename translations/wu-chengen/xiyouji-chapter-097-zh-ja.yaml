    "source_text": "且不言唐僧等在華光破屋中苦耐夜雨存身。卻說銅臺府地靈縣城內有夥兇徒，因宿娼、飲酒、賭博，花費了家私，無計過活，遂夥了十數人做賊，算道本城哪家是第一個財主，哪家是第二個財主，去打劫些金銀用度。內有一人道：「也不用緝訪，也不須算計，只有今日送那唐朝和尚的寇員外家十分富厚。我們乘此夜雨，街上人也不防備，火甲等也不巡邏，就此下手，劫他些貲本，我們再去嫖賭兒耍子，豈不美哉？」眾賊歡喜，齊了心，都帶了短刀、蒺藜、拐子、悶棍、麻繩、火把，冒雨前來，打開寇家大門，吶喊殺入。慌得他家裡若大若小，是男是女，俱躲個乾淨：媽媽兒躲在床底；老頭兒閃在門後；寇梁、寇棟與著親的幾個兒女，都戰戰兢兢的四散逃走顧命。那夥賊拿著刀，點著火，將他家箱籠打開，把些金銀寶貝、首飾衣裳、器皿家火，盡情搜劫。那員外割捨不得，拚了命，走出門來，對眾強人哀告道：「列位大王，夠你用的便罷，還留幾件衣物與我老漢送終。」那眾強人哪容分說，趕上前，把寇員外撩陰一腳，踢翻在地。可憐三魂渺渺歸陰府，七魄悠悠別世人！眾賊得了手，走出寇家，順城腳做了軟梯，漫城牆一一繫出，冒著雨連夜奔西而去。那寇家僮僕見賊退了，方才出頭。及看時，老員外已死在地下。放聲哭道：「天呀！主人公已打死了！」眾皆伏屍而哭，悲悲啼啼。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 121
        "line_end": 121
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      さて、三蔵（さんぞう）たちが華光行院（かこうぎょういん）の荒れた建物で夜の雨を耐え忍んでいた話は、ひとまず置こう。銅台府（どうたいふ）地霊県（ちれいけん）の町には、女郎買い、酒、賭博で家の財産を使い果たし、食べていく手立てもなくなった悪党がいた。十数人で盗賊の仲間を組み、町で一番の金持ちは誰だ、二番は誰だと相談し、金銀を奪って使おうとしていた。
      その一人が言った。盗賊の一人「探し回るまでも、あれこれ考えるまでもない。今日、唐（とう）の坊主たちを見送った寇員外（こういんがい）の家こそ、大変な金持ちだ。今夜の雨に乗じよう。町の人間も警戒していないし、火の番も見回りには出まい。今すぐ押し入って金を奪い、また女郎買いや賭博をして遊ぶ。いい考えじゃないか。」
      盗賊たちは喜び、心を合わせて短刀、とげのついた武器、かぎ形の棒、人を不意に殴る棍棒、麻縄、松明を持ち、雨を冒してやってきた。寇家の大門をこじ開け、わめきながら押し入る。家中の者は大人も子供も、男も女も、慌てて隠れた。寇洪（こうこう）の妻は寝台の下へ、寇洪は戸の陰へ。寇梁（こうりょう）と寇棟（こうとう）、それにすでに結婚していた子供たちも、震えながら四方へ逃げ、命を守ろうとした。賊は刀を持ち、火をともして箱やつづらを開け、金銀、宝物、装身具、衣服、器や家財を思う存分奪った。
      寇洪は惜しくてたまらず、命を懸けて戸の陰から出て、賊に哀願した。寇洪「大王さま方、十分お使いになれるだけでおやめください。せめてこの老いぼれを葬るための衣服を、幾つか残してください。」
      賊どもは聞く耳も持たず、駆け寄って寇洪の陰部を一蹴りし、地面に倒した。哀れ、三つの魂ははるか冥府（めいふ）へ帰り、七つの魄はこの世の人々を離れていった。賊は目的を果たすと寇家を出て、城壁の根元で縄ばしごを作り、壁を越えて一人ずつ縄で降りた。雨の中、その夜のうちに西へ逃げ去った。
      寇家の召使いたちは賊が引き揚げて、ようやく姿を現した。見れば、寇洪はもう地面に倒れて死んでいる。召使いたち「ああ、天よ！　旦那さまが殺されてしまった！」
      皆は遺体に取りすがり、声を上げて泣き続けた。
    "translation_status": "reviewed"
  - "id": "xy-ch97-003"
    "section_id": "chapter-97"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "將四更時，那媽媽想恨唐僧等不受他的齋供，因為花撲撲的送他，惹出這場災禍，便生妒害之心，欲陷他四眾。扶著寇梁道：「兒啊，不須哭了。你老子今日也齋僧，明日也齋僧，豈知今日做圓滿，齋著那一夥送命的僧也。」他兄弟道：「母親，怎麼是送命僧？」媽媽道：「賊勢兇勇，殺進房來，我就躲在床下，戰兢兢的留心向燈火處看得明白。你說是誰？點火的是唐僧，持刀的是豬八戒，搬金銀的是沙和尚，打死你老子的是孫行者。」二子聽言，認了真實道：「母親既然看得明白，必定是了。他四人在我家住了半月，將我家門戶牆垣、窗櫺巷道，俱看熟了，財動人心，所以乘此夜雨，復到我家，既劫去財物，又害了父親，此情何毒！待天明到府裡遞失狀，坐名告他。」寇棟道：「失狀如何寫？」寇梁道：「就依母親之言。」寫道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 122
        "line_end": 122
        "source_sequence": 3
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      四更（しこう）になろうというころ、寇洪の妻は三蔵たちへの恨みを募らせていた。自分の施食を受けずに去ったため、あれほど華やかに見送ることになり、この災いを招いたのだと思ったのである。憎しみから、四人を陥れようと考えた。
      妻は寇梁にすがって言った。寇洪の妻「もう泣くのはおよし。お前たちの父親は、今日も僧に食事を、明日も僧に食事をとやっていた。今日ようやく願いを果たしたと思ったら、あの命取りの坊主どもに食わせていたとはね。」
      寇梁と寇棟「母上、どうして命取りの坊主なのです。」
      寇洪の妻「賊がものすごい勢いで部屋へ押し込んだから、私は寝台の下へ隠れた。震えながらも、灯のあるほうを気をつけて見ていたから、はっきり分かったよ。誰だったと思う。火をつけていたのは三蔵、刀を持っていたのは八戒（はっかい）、金銀を運んでいたのは沙悟浄（さごじょう）、お前たちの父親を殺したのは悟空（ごくう）だった。」
      二人の息子はそれを真実と思い込んだ。寇梁と寇棟「母上がはっきりご覧になったのなら、間違いありません。あの四人は半月も家にいて、門や塀、窓や通路まで、すっかり見覚えていたのです。財産を見て欲が出て、夜の雨に乗じて戻ってきた。財物を奪うだけでなく、父上まで殺すとは、何という残酷さでしょう。夜が明けたら府の役所に被害の訴状を出し、名を挙げて告訴しましょう。」
      寇棟「訴状には、どう書けばよいのです。」
      寇梁「母上のおっしゃるとおりに。」
      こう書き記した。
    "translation_status": "reviewed"

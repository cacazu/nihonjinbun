    "translation_ja": |-
      悟空は一つ一つ聞き取った。もう五更（ごこう）の最初の点を知らせる時刻である。寇家へ飛び込むと、広間にはすでに棺が据えられ、頭のほうには灯がともり、香、蝋燭、花、果物が並び、寇洪の妻がそばで泣いていた。二人の息子も拝んで泣き、二人の嫁は飯を一膳ずつ供えていた。
      悟空は棺の頭のほうにとまり、こほんと咳をした。二人の嫁は仰天して手足をばたつかせ、外へ逃げ出した。寇梁と寇棟は地面に伏したまま動けず、ただ叫んだ。寇梁と寇棟「父上！　ああ、ああ、ああ……！」
      妻は気丈にも棺の頭をひと叩きした。寇洪の妻「あなた、生き返ったのかい。」
      悟空は寇洪の声をまねて答えた。悟空「生き返ってはいない。」
      息子たちはますます怯え、しきりに頭を地につけて涙を流した。寇梁と寇棟「父上！　ああ、ああ、ああ……！」
      妻は勇気を振り絞り、また尋ねた。寇洪の妻「あなた、生き返っていないのに、どうして話せるんだい。」
      悟空「閻王（えんおう）が鬼の使いに命じ、私を家まで連れてきて、お前たちに話をさせているのだ。あの張氏（ちょうし）、穿針児が、でたらめを言って罪のない者を陥れたからだ。」
      妻は幼名を呼ばれると慌ててひざまずき、頭を地につけた。寇洪の妻「ああ、お前さん、この年になって、まだ私の幼名を呼ぶのかい。私がどんなでたらめを言って、誰を陥れたっていうんだい。」
      悟空は怒鳴った。悟空「何が『三蔵が火をともし、八戒が人を殺せと叫び、沙悟浄が金銀を奪い出し、悟空がお前たちの父を殺した』だ。お前の嘘のために、善い人たちが災難に遭っている。唐から来た四人の老師さまは、道で賊に会い、財物を取り返して、私への礼に届けてくださった。何とありがたいご厚意ではないか。それなのに、お前は偽りの訴状を作り、息子たちに役所へ届けさせた。役所も詳しく調べず、今は老師さまたちを牢に入れている。牢の神も、土地神（とちがみ）も、城隍（じょうこう）も慌て、居ても立ってもいられず閻王に訴えた。そこで閻王は鬼の使いに私を家まで連れてこさせ、早くあの方たちを釈放させよと命じたのだ。さもなければ、私に一か月家中をかき回させ、家族の老いも若きも、鶏や犬に至るまで、一匹一人も生かしておくなと言っている。」
      寇梁と寇棟はまた頭を地につけて哀願した。寇梁と寇棟「父上、どうかお帰りください。家族を傷つけたり殺したりしないでください。夜が明けたら府の役所へ取り下げの訴状を出し、自分たちの訴えを撤回いたします。ただ、生きている者にも亡くなった者にも、安らぎがありますように。」
      悟空はそれを聞いて叫んだ。悟空「紙銭（しせん）を燃やせ。私は行くぞ。」
      一家はそろって、紙銭を燃やした。
    "translation_status": "reviewed"

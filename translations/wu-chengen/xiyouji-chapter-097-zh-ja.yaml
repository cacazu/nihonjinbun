    "source_text": "正忖度間，只見那地靈縣知縣等官急急跑上堂，亂道：「老大人，不好了，不好了，適才玉帝差浪蕩遊神下界，教你快放獄中好人。昨日拿的那些和尚，不是強盜，都是取經的佛子。若少遲延，就要踢殺我等官員，還要把城池連百姓都踏為灰燼。」刺史又大驚失色，即叫刑房吏火速寫牌提出。當時開了監門提出。八戒愁道：「今日又不知怎的打哩。」行者笑道：「管你一下兒也不敢打，老孫俱已幹辦停當。上堂切不可下跪，他還要下來請我們上坐。卻等我問他要行李、要馬匹，少了一些兒，等我打他你看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 154
        "line_end": 154
        "source_sequence": 26
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      考え込んでいると、地霊県の知県らが急いで法廷へ駆け上がり、口々に叫んだ。知県ら「お殿さま、大変です、大変です。たった今、玉帝が浪蕩遊神を地上へ遣わし、牢にいる無実の者を早く放せと命じました。昨日捕らえた坊主たちは盗賊ではなく、経を取りに行く仏弟子だということです。少しでも遅れれば、私ども役人を蹴り殺し、町も住民も一緒に踏み潰して灰にしてしまうと申しております。」
      姜坤三はまたも顔色を失い、刑事係の役人に、すぐ命令書を書いて四人を連れ出すよう命じた。さっそく牢の門が開き、四人が出された。
      八戒は心配そうに言った。八戒「今日はまた、どんなふうに打たれるんだろうな。」
      悟空は笑った。悟空「一度だって打てやしないと、俺が保証してやる。全部手は打っておいた。法廷へ出ても、決してひざまずくな。向こうが降りてきて、上座へどうぞと言うからな。それから俺が荷物と馬を返せと言う。少しでも足りなければ、俺があいつらをぶちのめすのを見ていろ。」

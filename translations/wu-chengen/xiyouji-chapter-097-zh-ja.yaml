    "source_text": "行者請唐僧坐在上首，他三人各執兵器喝道：「毛賊！你們一起有多少人？做了幾年買賣？打劫了有多少東西？可曾殺傷人口？還是初犯，卻是二犯、三犯？」眾賊開口道：「爺爺饒命。」行者道：「莫叫喚，從實供來。」眾賊道：「老爺，我們不是久慣做賊的，都是好人家子弟。只因不才，吃酒賭錢、宿娼頑耍，將父祖家業，盡花費了，一向無幹，又無錢用。訪知銅臺府城中寇員外家貲財豪富，昨日合夥，當晚乘夜雨昏黑，就去打劫。劫的有些金銀服飾，在這路北下山凹裡正自分贓，忽見老爺們來，內中有認得是寇員外送行的，必定身邊有物；又見行李沉重，白馬快走；人心不足，故又來邀截。豈知老爺有大神通法力，將我們困住。萬望老爺慈悲，收去那劫的財物，饒了我們性命也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 133
        "line_end": 133
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      悟空は三蔵に上座へ座ってもらい、三人はそれぞれ武器を構えて怒鳴った。悟空と八戒と沙悟浄「小賊ども！　仲間は全部で何人だ。何年この商売をしている。どれだけの物を奪った。人を傷つけたり、殺したりしたか。初犯か、それとも二度目、三度目か。」
      盗賊たち「お殿さま、どうか命ばかりは！」
      悟空「わめくな。正直に白状しろ。」
      盗賊たち「お殿さま、私どもは盗み慣れた者ではございません。みな、まともな家の子です。ただ、ふがいないことに酒を飲み、賭博をし、女郎を買って遊び、父祖の財産をすべて使い果たしました。ずっと仕事もなく、使う金もございません。銅台府の寇員外の家が大変な金持ちだと聞き込み、昨日仲間を集め、その晩、暗い雨の夜に乗じて押し入りました。金銀や衣服、装身具をいくらか奪い、この道の北の山あいで、ちょうど分けていたところです。そこへお殿さま方がお見えになり、仲間に、寇員外に見送られた方たちだと気づいた者がおりました。きっと何かお持ちだろうと。そのうえ荷物は重そうで、白馬も足が速い。欲にはきりがなく、また道をふさごうとしたのでございます。お殿さまにこれほどの神通力（じんつうりき）があって、私どもを捕らえてしまわれるとは思いませんでした。どうかお慈悲をもって、奪った品はお取りになり、命だけはお助けください。」
    "translation_status": "reviewed"
  - "id": "xy-ch97-012"
    "section_id": "chapter-97"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聽說是寇家劫的財物，猛然吃了一驚，慌忙站起道：「悟空，寇老員外十分好善，如何招此災厄？」行者笑道：「只為送我們起身，那等彩帳花幢，盛張鼓樂，驚動了人眼目，所以這夥光棍就去下手他家。今又幸遇著我們，奪下他這許多金銀服飾。」三藏道：「我們擾他半月，感激厚恩，無以為報，不如將此財物護送他家，卻不是一件好事？」行者依言。即與八戒、沙僧，去山凹裡取將那些贓物，收拾了，馱在馬上。又教八戒挑了一擔金銀，沙僧挑著自己行李。行者欲將這夥強盜一棍盡情打死，又恐唐僧怪他傷人性命，只得將身一抖，收上毫毛。那夥賊鬆了手腳，爬起來，一個個落荒逃生而去。這唐僧轉步回身，將財物送還員外。這一去，卻似飛蛾投火，反受其殃。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 134
        "line_end": 134
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      三蔵は、寇家から奪った品だと聞くと、はっと驚き、慌てて立ち上がった。三蔵「悟空、寇洪さまはあれほど善行を好むお方なのに、どうしてこんな災難に遭ったのでしょう。」
      悟空は笑った。悟空「私たちの出発を見送るため、あの色鮮やかな幕や花の幡を並べ、盛大に楽を鳴らして、人目を引いたからです。それで、こいつらのようなならず者が家を襲ったのです。今、幸いにも私たちに出くわしたので、この金銀や衣服、装身具を取り返せました。」
      三蔵「私たちは半月もお世話になり、深いご恩に感謝しながら、お返しができずにいました。この品々を護って家まで送り届ければ、善いことになるではありませんか。」
      悟空はその言葉に従い、八戒、沙悟浄と山あいへ行って盗品を取り出した。まとめて馬の背に積み、さらに八戒には金銀を一荷（いっか）担がせ、沙悟浄には自分たちの荷物を担がせた。悟空は賊どもを棒の一打で残らず打ち殺そうと思ったが、人命を奪ったと三蔵にとがめられるのが怖く、仕方なく体を揺すって毛を回収した。賊たちは手足が自由になると起き上がり、次々と荒野へ逃げて命をつないだ。
      三蔵は進む向きを変え、財物を寇洪の家へ返しに行った。ところがこの引き返しは、火へ飛び込む蛾のように、かえって災いを受けることになる。その証しに、こんな詩がある。
    "translation_status": "reviewed"
  - "id": "xy-ch97-013"

    "source_text": "卻說那刺史升堂，才擡出投文牌去，早有寇梁兄弟抱牌跪門叫喊。刺史著令進來。二人將解狀遞上。刺史見了，發怒道：「你昨日遞了失狀，就與你拿了賊來，你又領了贓去，怎麼今日又來遞解狀？」二人滴淚道：「老爺，昨夜小的父親顯魂道：『唐朝聖僧，原將賊徒拿住，奪獲財物，放了賊去，好意將財物送還我家報恩，怎麼反將他當賊，拿在獄中受苦？獄中土地、城隍不安，報了閻王，閻王差鬼使押解我來教你赴府再告，釋放唐僧，庶免災咎；不然，老幼皆亡。』因此，特來遞個解詞。望老爺方便方便。」刺史聽他說了這話，卻暗想道：「他那父親乃是熱屍，新鬼顯魂，報應猶可；我伯父死去五六年了，卻怎麼今夜也來顯魂，教我審放？看起來必是冤枉。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 153
        "line_end": 153
        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      さて、姜坤三が法廷に出て、書面の受け付けを知らせる札を運び出させると、早くも寇梁と寇棟が札を抱え、門にひざまずいて声を上げた。姜坤三は中へ入るよう命じた。二人は訴えを取り下げる書面を差し出した。
      姜坤三はそれを見ると怒った。姜坤三「昨日、被害の訴状を出したので、賊を捕らえてやった。盗品もすでに受け取ったではないか。それがどうして今日は、取り下げの訴状を出すのだ。」
      二人は涙をこぼした。寇梁と寇棟「お代官さま、昨夜、父の魂が現れて、こう申しました。『唐の聖僧たちは、もともと賊を捕らえ、財物を取り返して賊を逃がし、ご親切にも、恩返しのため家へ財物を届けてくださった。なぜ反対に賊扱いし、牢で苦しめているのだ。牢の土地神と城隍が安らげず閻王に訴えた。閻王は鬼の使いに私を連れてこさせ、お前たちに府の役所へもう一度訴え出て、三蔵たちを釈放させよと言っている。そうすれば災いを免れるが、さもなければ老いも若きも皆死ぬぞ。』そのため、取り下げの訴状を持って参りました。どうかお取り計らいください、お取り計らいください。」
      姜坤三はその話を聞き、ひそかに考えた。姜坤三（心中）「あの者たちの父は、まだ遺体も冷めきらぬ死にたてだ。死んだばかりの魂が現れるのは、因果の報いとしても分かる。しかし私の伯父は、死んで五、六年になる。それがどうして今夜も現れ、取り調べて放せと告げたのだろう。やはり、これは冤罪に違いない。」
    "translation_status": "reviewed"

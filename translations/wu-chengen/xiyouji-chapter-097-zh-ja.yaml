    "translation_ja": |-
      三蔵たちが金銀や衣服、装身具を持って引き返していると、槍や刀が群れをなして迫ってきた。三蔵は大いに驚いた。三蔵「お前たち、武器を持った大勢がこちらへ来ます。いったいどういうことでしょう。」
      八戒「災難だ、災難だ。あれは逃がした盗賊どもですよ。武器を取り、さらに仲間を集め、回り道して俺たちを殺しに来たんだ。」
      沙悟浄「二番目の兄さん、あれは賊の集まりではありません。兄さん、よく見てください。」
      悟空は沙悟浄にそっと言った。悟空「お師匠さまに、また災いの星が巡ってきた。あれはきっと賊を捕らえに来た役人の兵だ。」
      言い終わらぬうちに兵たちが迫り、輪を広げて師弟を囲んだ。捕り手たち「よくも、坊主ども！　人の家の物を奪っておいて、まだこんなところをのうのうと歩いているのか。」
      一斉に押し寄せ、まず三蔵を馬から引き下ろして縄で縛り、悟空たち三人もまとめて縛り上げた。棒を通して二人がかりで一人ずつ担ぎ、馬を追い、荷を取り上げ、まっすぐ府の町へ戻った。そのありさまといえば、

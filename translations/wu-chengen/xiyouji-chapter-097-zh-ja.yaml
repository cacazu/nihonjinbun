    "source_text": "行者便叫：「列位長官，不必打了。我們擔進來的那兩個包袱中，有一件錦襴袈裟，價值千金，你們解開拿了去罷。」眾禁子聽言，一齊動手，把兩個包袱解看。雖有幾件布衣，雖有個引袋，俱不值錢。只見幾層油紙包裹著一物，霞光焰焰，知是好物。抖開看時，但只見："

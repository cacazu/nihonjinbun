  - "id": "xy-ch97-030"
    "section_id": "chapter-97"
    "kind": "verse"
    "origin": "source"
    "source_text": "十代閻君拱手接，五方鬼判叩頭迎。千株劍樹皆攲側，萬疊刀山盡坦平。枉死城中魑魅化，奈河橋下鬼超生。正是那神光一照如天赦，黑暗陰司處處明。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 160
        "line_end": 160
        "source_sequence": 30
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      十代閻君（じゅうだいえんくん）は両手を組んで迎え、五方の鬼の判官（はんがん）は頭を地につけて出迎える。
      千本の剣の木はみな身を傾け、万重の刀の山は残らず平らになる。
      枉死城（おうしじょう）の妖鬼は救いを受け、奈河橋（なかきょう）の下の亡者は生まれ変わる。
      まさに、神の光がひとたび照れば天の赦しのよう、暗い冥府も至る所が明るい。
    "translation_status": "reviewed"
  - "id": "xy-ch97-031"
    "section_id": "chapter-97"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "十閻王接下大聖，相見了，問及何來何幹。行者道：「銅臺府地靈縣齋僧的寇洪之鬼，是哪個收了？快點查來與我。」十閻王道：「寇洪善士，也不曾有鬼使勾他，他自家到此，遇著地藏王的金衣童子，他引見地藏也。」行者即別了，徑至翠雲宮見地藏王菩薩。菩薩與他禮畢，具言前事。菩薩喜道：「寇洪陽壽，止該卦數命終，不染床蓆，棄世而去。我因他齋僧，是個善士，收他做個掌善緣簿子的案長。既大聖來取，我再延他陽壽一紀，教他跟大聖去。」金衣童子遂領出寇洪。寇洪見了行者，聲聲叫道：「老師，老師，救我一救。」行者道：「你被強盜踢死，此乃陰司地藏王菩薩之處。我老孫特來取你到陽世間對明此事。既蒙菩薩放回，又延你陽壽一紀，待十二年之後，你再來也。」那員外頂禮不盡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 161
        "line_end": 161
        "source_sequence": 31
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      十閻王（じゅうえんおう）は悟空を迎えて挨拶し、どこから何のために来たのか尋ねた。悟空「銅台府地霊県で僧に食事を施していた寇洪の魂は、誰が引き取った。早く調べて、俺に渡してくれ。」
      十閻王「善人の寇洪については、鬼の使いが迎えに行ったことはございません。ご自分でここへ来られ、地蔵王（じぞうおう）の金衣童子（きんいどうじ）に会われました。その童子が地蔵王へお引き合わせしたのです。」
      悟空はすぐに別れ、翠雲宮（すいうんきゅう）へまっすぐ行き、地蔵王菩薩（じぞうおうぼさつ）に会った。菩薩と挨拶を交わすと、これまでの事情を詳しく話した。
      地蔵王菩薩は喜んで言った。地蔵王菩薩「寇洪のこの世の寿命は、卦数（かすう）、すなわち六十四歳で尽きることになっていました。病床につくことなく、世を去ったのです。僧に食事を供してきた善人なので、私は善縁の帳簿を扱う案長（あんちょう）として召し抱えました。大聖（たいせい）が迎えに来たからには、さらに寿命を一紀（いっき）延ばし、大聖について帰らせましょう。」
      金衣童子が寇洪を連れてきた。寇洪は悟空を見ると、何度も呼びかけた。寇洪「老師さま、老師さま、どうか私をお救いください。」
      悟空「お前は盗賊に蹴り殺された。ここは冥府の地蔵王菩薩のもとだ。俺はこの件を明らかにするため、わざわざお前をこの世へ連れ戻しに来たんだ。菩薩はお前を帰してくださるうえ、寿命を一紀延ばしてくださった。十二年たったら、また来るがいい。」
      寇洪は、いつまでも伏し拝んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch97-032"
    "section_id": "chapter-97"

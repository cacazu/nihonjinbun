    "source_text": "漸漸天晚，聽得樓頭起鼓，火甲巡更。捱至四更三點，行者見他們都不呻吟，盡皆睡著，他暗想道：「師父該有這一夜牢獄之災。老孫不開口折辨，不使法力者，蓋為此耳。如今四更將盡，災將滿矣，我須去打點打點，天明好出牢門。」你看他弄本事，將身小一小，脫出轄床。搖身一變，變做個蜢蟲兒，從房簷瓦縫裡飛出。見那星光月皎，正是清和夜靜之天。他認了方向，徑飛向寇家門首，只見那街西下一家兒燈火明亮。又飛近他門口看時，原來是個做豆腐的。見一個老頭兒燒火，媽媽兒擠漿。那老兒忽的叫聲：「媽媽，寇大官且是有子有財，只是沒壽。我和他小時同學讀書，我還大他五歲。他老子叫做寇銘，當時也不上千畝田地，放些租帳，也討不起。他到二十歲時，那銘老兒死了，他掌著家當。其實也是他一步好運：娶的妻是那張旺之女，小名叫做穿針兒，卻倒旺夫，自進他門，種田又收，放帳又起，買著的有利，做著的賺錢，被他如今掙了有十萬家私。他到四十歲上，就回心向善，齋了萬僧，不期昨夜被強盜踢死。可憐！今年才六十四歲，正好享用。何期這等向善，不得好報，乃死於非命，可嘆，可嘆！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch97-1455646"
        "precision": "line"
        "line_start": 149
        "line_end": 149
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第097回&oldid=1455646"
    "translation_ja": |-
      次第に日が暮れ、楼上の太鼓が鳴り、火の番が夜回りをする音が聞こえた。四更の三点（さんてん）まで待つと、悟空は皆がうめくのをやめ、眠り込んでいるのを見た。
      悟空（心中）「お師匠さまには、一夜を牢で過ごす災難が定まっていた。俺が弁明もせず、術も使わなかったのは、そのためだ。もう四更も終わりに近い。災難も満ちようとしている。俺がひと働きして、夜明けには牢を出られるようにしよう。」
      そこで腕前を見せた。体を小さくし、轄床から抜け出す。体を振ると小さな羽虫に変わり、軒の瓦の隙間から飛び出した。星は輝き、月は明るい。まさに澄んで穏やかな、静かな夜であった。
      悟空は方角を見定め、まっすぐ寇家の門前へ飛んだ。すると通りの西側の一軒に、明々と灯がついている。近寄って戸口からのぞくと、豆腐を作る家だった。老人が火を焚き、その妻が豆乳を搾っている。ふと老人が声をかけた。
      豆腐屋の老人「なあ、お前。寇洪さんには子供も財産もあったのに、寿命だけはなかったのだな。わしは子供のころ、あの人と一緒に勉強した。わしのほうが五つ年上だ。父親は寇銘（こうめい）という人で、当時は田畑も千畝（ほ）に満たなかった。小作料や貸した金も、ろくに取り立てられなかった。寇洪さんが二十歳の時、父の寇銘さんが亡くなり、家の財産を引き継いだ。それからは、実に運がよかった。嫁に迎えたのは張旺（ちょうおう）の娘で、幼名を穿針児（せんしんじ）といった。あの嫁が夫に福をもたらしたのだな。嫁いできてからというもの、田を作れば実り、金を貸せば返り、買った物には利がつき、商いをすればもうかった。とうとう十万もの財産を築いた。四十歳になると心を改めて善行へ向かい、一万人の僧に食事を供した。それが思いもかけず、昨夜、盗賊に蹴り殺されてしまうとは。かわいそうに、今年まだ六十四歳だった。これから暮らしを楽しめるというのに。あれほど善いことをしても善い報いはなく、非業の死を遂げるとは。嘆かわしい、嘆かわしい。」
    "translation_status": "reviewed"

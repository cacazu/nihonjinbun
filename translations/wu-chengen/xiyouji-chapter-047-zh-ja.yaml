    "source_text": "行者道：「原來這等。也罷，也罷，你且抱你令郎出來，我看看。」那陳清急入裡面，將關保兒抱出廳上，放在燈前。小孩兒那知死活，籠著兩袖果子，跳跳舞舞的吃著耍子。行者見了，默默念聲咒語，搖身一變，變作那關保兒一般模樣。兩個孩兒攙著手，在燈前跳舞。諕得那老者慌忙跪著。唐僧道：「老爺，不當人子，不當人子。」這老者道：「這位老爺才然說話，怎麼就變作我兒一般模樣，叫他一聲，齊應齊走？卻折了我們年壽，請現本相，請現本相。」行者把臉抹了一把，現了本相。那老者跪在面前道：「老爺原來有這樣本事。」行者笑道：「可像你兒子麼？」老者道：「像像像，果然一般嘴臉，一般聲音，一般衣服，一般長短。」行者道：「你還沒細看哩。取秤來稱稱，可與他一般輕重？」老者道：「是是是，是一般重。」行者道：「似這等可祭賽得過麼？」老者道：「忒好，忒好，祭得過了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      悟空「そういうことか。よし、分かった。まず、息子さんを抱いてきてくれ。見てみよう。」
      陳清は急いで奥へ入り、関保を抱いて広間へ連れ出し、灯の前に下ろした。子供は自分の命がどうなるかなど、何も知らない。両袖に果物を入れ、跳ねたり踊ったりしながら、食べて遊んでいる。悟空はそれを見ると、黙って呪文を唱え、体を振って、関保とまったく同じ姿になった。二人の子供が手をつなぎ、灯の前で跳びはねたので、陳清は仰天し、慌ててひざまずいた。
      三蔵「ご主人、失礼いたしました。どうかお許しください。」
      陳清「こちらのお坊さまは、さっきまで話していらしたのに、どうして息子と同じ姿になられたのです。ひと声呼べば、二人そろって返事をし、駆けてくるではありませんか。これでは、私どもの寿命が縮まってしまいます。どうか、もとのお姿に戻ってください。お戻りください。」
      悟空は顔をひとなでし、もとの姿に戻った。陳清はその前にひざまずいて言った。
      陳清「お坊さまには、こんなお力がおありだったのですね。」
      悟空は笑った。
      悟空「息子さんに似ていたか。」
      陳清「似ていました。そっくりです。顔も同じ、声も同じ、衣服も同じ、背丈も同じでございました。」
      悟空「まだ、よく見ていないぞ。はかりを持ってきて、量ってみろ。重さだって同じじゃないか。」
      陳清「はい、はい。同じ重さです。」
      悟空「こうすれば、祭りの供え物として通用するか。」
      陳清「結構です。まことに結構です。それなら通用いたします。」

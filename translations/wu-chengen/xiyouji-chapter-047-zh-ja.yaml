  - "id": "xy-ch47-note-01-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の金と木は五行・内丹の寓意を重ねた呼び名で、ここでは子供の救済に向かう悟空と八戒に対応する。古い注釈『西遊原旨』の第四十七回詩結にも金木の協働が詠まれる。ただし、その注釈を唯一の著者意図と断定せず、回題の語を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-02-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "羊力の本体が羚羊であることは、この冒頭の悟空の発言で明かされる。既知の羊力大仙の略称として扱い、別人にはしない。二年後に国王の運が衰え、命と国を奪われたはずだというのは悟空の説明であり、語り手の確定した未来として書き足さない。羚羊を現代の特定の種に同定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-03-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「運轉雙關、穿夾脊」は、体内の関門と背の関を通す、内丹・身体修行に関わる表現として訳した。前に荷車を破壊した行為の振り返りであり、原文にない具体的な筋肉や器官を補わない。僧も道士も敬い、人材を育てるという三教帰一の全項目と、悟空による国家安泰の保証を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-04-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭の「經三藏」は経・律・論の三蔵を求める旅に関わる句と解し、人物名の三蔵と語義を分けた。「光一元」の一元は、ここでは修行によって明らかになる根源の元気と解したが、時間単位など別の用法もある語で、解釈には留保がある。冒頭の対句二句を散文段落の最初の一文に保っている。「腳後蹬妻」は気楽な在家の寝姿を誇張する表現として、足で妻を押しやる動作まで残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-05-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "石を投げた音や泡で深さを判断する方法は八戒の説明であり、実際の安全な渡河法として保証していない。「魚津」は魚が吐くような水面の泡と解した。悟能と八戒は同じ人物で、師の呼びかけにだけ悟能を保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-06-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "華岳は華山の別称。大河が山をのみ込み百川を貫くという誇張を保ち、実在の河川の地理説明に改めていない。五行の詩、各行の二つの句をすべて保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-07-body"
    "section_id": "chapter-47"

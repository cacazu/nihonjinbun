    "translation_ja": "碑文はここでは「亙古少行人」だが、悟空が再び引用する箇所では「亙古少人行」と語順が異なる。原文欄と訳中の漢字の引用はそれぞれの形を保ち、日本語での意味は同じく訳した。大字三字、小字十字・二行、距離八百里を落としていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-08-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "初めに遠望する集落は四、五百軒とされるが、後で老人は百軒と説明する。この数量差は底本のまま残した。鼓鈸の鈸は両手で打ち合わせる金属の楽器であり、食器の鉢へ字を置き換えていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-09-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「柳外啼鳴」は鳴くものが明示されないが、喉の描写から鳥の声と解した。白蘋は古典的な水草名で、辞書では田字草に結びつけられるが、この香りの描写から特定の植物種や実際の花の性質を断定しない。冷えた喉、無音の笛と砧、紅蓼・黄蘆、犬・漁師・月・西風をすべて残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-10-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「熟米三升」は炊いた米三升、「白布一段」は布を一まとまり数える一段として訳した。古い容量・貨幣・布の単位を、現在の量や通貨へ換算しない。東土から五万四千里という距離も老人の発言どおりに保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-11-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "闍黎は僧への呼び名、班首は僧の集まりの先頭に立つ者。班首が逃げるよう指示するのは詩の語りであり、原文にない直接台詞を作らない。「光乍乍」は散ってしまったさまを強める語と解したが、細かな方言的な語感には留保がある。十行の詩を十行で保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-12-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この段の老者は二人のどちらか明示されないため、話者を「老人」にとどめた。給仕の一人・二人・八人・二十人、全体の三、四十人を保持した。「七大八小」は七人と八人の厳密な内訳ではなく、大きい者、小さい者を取り混ぜて呼び出す表現と解した。八戒による顔への侮辱は彼の台詞として残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-13-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「籠」はここでは飯を懐や衣服の中へ隠す動作と解した。召使いが食べる速さを見誤る笑いを残した。「兒子們便說謊」は嘘をつけば相手の息子になるという、自分の言葉を保証する卑下・罵倒を兼ねた言い方と解したが、方言的な細部には留保がある。麵飯・米飯・閑食・粉湯はそれぞれ小麦粉の食べ物・米の飯・菓子・粉を使う汁物として区別し、製法や料理名は特定しない。麵飯一石と米飯五斗はそのままの数量である。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-14-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "青苗斎・平安斎・了場斎は農事や平安に関わる法要名、予修寄庫斎・予修填還斎は生前に死後への備えや冥界への返済を行う法要として解した。寄庫・填還については、『受生経』の原文を引用する紙銭寄庫研究を参照した。各儀礼の細かな手順までは確定しない。予修亡斎の対象と理由は、老人が後で説明するまで補わない。陳はここでは個人の略称ではなく姓である。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-15-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「暗喜道」から続く底本の一つの括弧には、悟空の内心の喜びと、老人への問いが含まれる。訳では内心と対面の発言を分け、両方を保持した。続く詩は二人の老人の合同発話の続きであり、その間で別の人物へ話者を切り替えない。霊感大王はこの段では祀られる称号だけが判明しており、後に明かされる正体を語釈へ入れない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-16-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は単数の「那老者」とだけ記し、二老人のどちらかを確定できないため「老人」とした。次の二行の詩は、その老人の発言の続きとして読む。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-17-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "陳澄が陳清を弟として紹介し、続いて自分の名を名乗る順序を保持した。自己紹介前の話者ラベルに陳澄とは付けない。兄六十三歳・弟五十八歳の合計は百二十一歳になるが、原文は後に「年歲百二」と述べるため、百二十歳のまま訳した。娘八歳・息子七歳、妾の子であること、三両・五両の帳簿、黄金三十斤＝一秤、関聖への祈願に基づく命名をすべて残す。命名の説明を削って既知の人名だけを並べていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-18-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「黃梅不落青梅落」は、年長者より先に子供が死ぬ悲しみを梅にたとえる諺である。「家財產業，也盡得數」は相当の財産と認められる程度との控えめな自称と解した。水田・畑・牧草地・水牛と黄牛・驢馬と馬・豚羊鶏鵞鳥・古い穀物と衣服を、数量とともに保持する。身代わりの子供を買う提案や金額は悟空の台詞としてそのまま訳し、賛同や現代の行動提案に変えていない。大王の知識や訪問の様子は老人たちの証言である。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-19-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「不當人子」は教育部辞典で罪過・不應該と説明される慣用的な謝罪・非礼の表現で、子供ではないという字面の意味ではない。ここでは老人を驚かせたことへの三蔵の謝罪として訳した。重さを比べるよう促す問いと、同じ重さだという返答は残し、実際に秤を持ってきたという動作は原文にないので補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-20-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「不吃你，好道嫌腥」は、食べないとしたらなまぐささを嫌うためだろうという皮肉な言葉と解した。悟空が食われると老人が信じていることと、悟空自身が天命に任せると語ることを区別する。最初の銀千両に加え、次段でさらに五百両を約束する順序を保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-21-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「雞兒不吃無工之食」は、ただ飯は食えないという趣旨の諺として、鶏のたとえを残した。八戒が変化できると挙げる山・木・石・癩象・水牛・大きな太った男を省略しない。「癩象」は皮膚の荒れた象としたが、動物種や病名を厳密に同定していない。師が危険な役目をひと遊びと呼ぶ軽さも原文のまま残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-22-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "紵絲は、研究論文に引用された『夢粱録』の染絲所織・『呉県志』の俗名緞という記述を参考に、絹の織物と解した。紵の字だけから麻にせず、原字を保持する。官綠は鮮やかな緑、棋盤領は碁盤のように四角い襟、蝦蟆頭は蛙の頭に似せた靴先、綃金膝褲は金を施した膝覆いと解したが、細かな色調・裁断・金飾りの工法は確定しない。花翠箍の翠は青緑の飾りとして残し、翡翠の玉やカワセミの羽など素材を一つに断定していない。頭飾り、上衣、外套、裳、靴、二つの膝覆いをすべて保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-23-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「郎伉」は体が大きく不格好なさまと解した。「佈起罡」は北斗の配置に関わる呪術上の構え・歩みと解し、具体的な手足の動作は補わない。変身の不完全さを男でも女でもないと言うのは悟空のからかいである。子供の泣き声から大王へ秘密が漏れるという心配も悟空の発言として残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-24-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この段の供え方を説明する老者は個人が特定できないため「老人」にとどめた。「上臺盤」は、実際に盆と卓に載ることと、立派な場へ出ることを重ねた冗談として訳した。教育部辞典の臺盤は上等場面と説明する。二つの盆、二つの卓、一卓二人で計四人の担ぎ手、男の子を先に食べるという目撃談まで省略しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-note-25-body"
    "section_id": "chapter-47"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "結末の「這老者」は単数の指示で、どちらの老人とも断定しない。村人たちの合同の呼び声、泣く老人、四人の若者が二人を運ぶ動作を保ち、次回の結果は補わない。"
    "translation_status": "reviewed"

  - "id": "xy-ch47-027"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「要吃童男女麼？」老者道：「正是。」行者道：「想必輪到你家了？」老者道：「今年正到舍下。我們這裡有百家人家居住。此處屬車遲國元會縣所管，喚做陳家莊。這大王一年一次祭賽，要一個童男、一個童女、豬羊牲醴供獻他。他一頓吃了，保我們風調雨順；若不祭賽，就來降禍生災。」行者道：「你府上幾位令郎？」老者搥胸道：「可憐，可憐！說甚麼令郎，羞殺我等。這個是我舍弟，名喚陳清。老拙叫做陳澄。我今年六十三歲，他今年五十八歲，兒女上都艱難。我五十歲上還沒兒子，親友們勸我納了一妾，沒奈何，尋下一房，生得一女，今年才交八歲，取名喚做一秤金。」八戒道：「好貴名。怎麼叫做一秤金？」老者道：「我只兒女艱難，修橋補路，建寺立塔，佈施齋僧，有一本帳目，那裡使三兩，那裡使五兩。到生女之年，卻好用過有三十斤黃金。三十斤為一秤，所以喚做一秤金。」行者道：「那個的兒子麼？」老者道：「舍弟有個兒子，也是偏出，今年七歲了，取名喚做陳關保。」行者問：「何取此名？」老者道：「家下供養關聖爺爺，因在關爺之位下求得這個兒子，故名關保。我兄弟二人，年歲百二，止得這兩個人種，不期輪次到我家祭賽，所以不敢不獻。故此父子之情，難割難捨，先與孩兒做個超生道場。故曰『預修亡齋』者，此也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空「男の子と女の子を食うのか。」
      老人「そのとおりです。」
      悟空「きっと、あんたの家の番が来たんだな。」
      老人「今年は、ちょうど我が家の番なのです。ここには百軒の家が住んでおります。車遅国（しゃちこく）の元会県（げんかいけん）が治める土地で、陳家荘（ちんかそう）と申します。大王には一年に一度、お礼の祭りをし、男の子一人、女の子一人、それに豚や羊のいけにえと酒を供えなければなりません。一度にお召し上がりになると、私どもに風雨の順調な恵みをお与えくださいます。祭らなければ、やって来て災難を降らせるのです。」
      悟空「お宅には、息子が何人いるんだ。」
      老人は胸をたたいた。
      老人「哀れなことです。哀れなことです。息子などと言われても、お恥ずかしいばかりです。こちらは弟で、名を陳清（ちんせい）と申します。私は陳澄（ちんちょう）と申します。今年、私は六十三歳、弟は五十八歳で、二人とも子供には恵まれませんでした。私は五十歳になっても息子がおらず、親類や友人に妾を迎えるよう勧められました。やむなく一人迎えたところ、娘が生まれました。今年ようやく八歳になり、一秤金（いっしょうきん）という名をつけております。」
      八戒「ずいぶん高価そうな名だな。どうして一秤金というんだ。」
      陳澄「なかなか子供が授からなかったので、橋を架け、道を直し、寺を建て、塔を造り、布施をして僧に食事を振る舞いました。帳面が一冊あり、あちらに三両（りょう）、こちらに五両と、使った金が記してあります。娘が生まれた年までに、ちょうど黄金を三十斤（きん）使っておりました。三十斤を一秤（しょう）といいます。それで、一秤金と呼ぶのです。」
      悟空「そちらの方には、息子がいるのか。」
      陳澄「弟には息子が一人おります。こちらも妾の子で、今年七歳になります。名を陳関保（ちんかんほう）と申します。」
      悟空「どうして、その名をつけたんだ。」
      陳澄「うちでは関聖（かんせい）さまをお祀りしております。関聖さまの神位の前で願って授かった息子ですので、関保（かんほう）と名づけました。私ども兄弟は、合わせて百二十歳にもなって、家の血を継ぐ子は、この二人きりです。それなのに、我が家に祭りの順番が巡ってきたのですから、差し出さぬわけにはまいりません。親子の情は、どうにも断ち切れず、手放しがたく、せめて先に子供たちがよい世に生まれ変われるよう、法要を営んだのです。これを『予修亡斎』と申したのは、そのためでございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-028"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，止不住腮邊淚下道：「這正是古人云：『黃梅不落青梅落，老天偏害沒兒人。』」行者笑道：「等我再問他。老公公，你府上有多大家當？」二老道：「頗有些兒：水田有四五十頃，旱田有六七十頃，草場有八九十處；水黃牛有二三百頭，驢馬有三二十匹，豬羊雞鵝無數。舍下也有吃不著的陳糧，穿不了的衣服。家財產業，也盡得數。」行者道：「你這等家業，也虧你省將起來的。」老者道：「怎見我省？」行者道：「既有這家私，怎麼捨得親生兒女祭賽？拚了五十兩銀子，可買一個童男；拚了一百兩銀子，可買一個童女。連絞纏不過二百兩之數，可就留下自己兒女後代，卻不是好？」二老滴淚道：「老爺，你不知道。那大王甚是靈感，常來我們人家行走。」行者道：「他來行走，你們看見他是甚麼嘴臉？有幾多長短？」二老道：「不見其形，只聞得一陣香風，就知是大王爺爺來了，即忙滿斗焚香，老少望風下拜。他把我們這人家匙大碗小之事，他都知道；老幼生時年月，他都記得。只要親生兒女，他方受用。不要說二三百兩沒處買，就是幾千萬兩，也沒處買這般一模一樣同年同月的兒女。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      三蔵は聞くと、頬を流れる涙を抑えられなかった。
      三蔵「まさしく昔の人の言う、『黄色く熟した梅は落ちず、青い梅が落ちる。天は、子に恵まれぬ者ばかりを苦しめる』ということですね。」
      悟空は笑った。
      悟空「もう少し聞かせてくれ。おじいさん、お宅には、どれほどの財産があるんだ。」
      陳澄と陳清「少しはございます。水田が四、五十頃（けい）、畑が六、七十頃、牧草地が八、九十か所。水牛と黄牛は二、三百頭、驢馬と馬は二、三十頭、豚や羊、鶏や鵞鳥は数えきれません。家には食べきれない古米や、着きれない衣服もございます。家財も土地も、どうにか数に入れていただけるほどはあります。」
      悟空「それほどの財産も、ずいぶんけちって、ためたものらしいな。」
      老人「どうして、けちったとお思いなのです。」
      悟空「それほどの財産があるのに、どうして実の子を祭りに差し出せるんだ。銀五十両を思い切って出せば男の子を一人買える。百両を出せば、女の子を一人買えるだろう。諸掛かりを入れても二百両にすぎない。それで自分の子を残し、後継ぎにできるなら、いいじゃないか。」
      陳澄と陳清は涙をこぼした。
      陳澄と陳清「お坊さまは、ご存じないのです。あの大王は非常に霊験あらたかで、しょっちゅう私どもの家々をお回りになります。」
      悟空「回ってくるなら、どんな顔をしているんだ。背丈はどれほどだ。」
      陳澄と陳清「姿は見えません。ひと吹き、香りのよい風が感じられると、大王さまがおいでだと分かるのです。急いで香をますいっぱいに焚き、老いも若きも、その風に向かってひれ伏します。私どもの家の、匙の大きさ、椀の小ささといったことまで、何もかもご存じです。老人から子供まで、生まれた年も月も、皆覚えておいでです。実の子供でなければ、お召し上がりになりません。二、三百両で買える子がいないどころか、何千万両を出しても、姿かたちから生まれた年、月まで、まったく同じ子など買えません。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-029"

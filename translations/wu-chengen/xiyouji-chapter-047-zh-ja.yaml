    "source_text": "行者道：「我今替這個孩兒性命，留下你家香煙後代，我去祭賽那大王去也。」那陳清跪地磕頭道：「老爺果若慈悲替得，我送白銀一千兩，與唐老爺做盤纏往西天去。」行者道：「就不謝謝老孫？」老者道：「你已替祭，沒了你也。」行者道：「怎的得沒了？」老者道：「那大王吃了。」行者道：「他敢吃我？」老者道：「不吃你，好道嫌腥。」行者笑道：「任從天命。吃了我，是我的命短；不吃，是我的造化。我與你祭賽去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      悟空「では、俺がこの子の命に代わろう。家の香を絶やさぬ後継ぎを残してやる。俺があの大王の祭りの供え物になってやろう。」
      陳清は地にひざまずき、頭を打ちつけて拝んだ。
      陳清「お坊さまが、本当に慈悲をおかけくださり、身代わりになってくださるなら、白銀千両を唐（とう）のお坊さまに差し上げ、西天へ向かう旅費にしていただきます。」
      悟空「俺には、礼をしてくれないのか。」
      陳清「あなたは身代わりの供え物になれば、もういらっしゃいませんので。」
      悟空「なぜ俺がいなくなるんだ。」
      陳清「大王に食べられてしまうのです。」
      悟空「あいつが、俺を食えるのか。」
      陳清「食べないとしたら、なまぐさいのが嫌だから、というほかありませんな。」
      悟空は笑った。
      悟空「天命に任せるさ。食われたら、俺の寿命が短かったのだし、食われなければ運がよかったんだ。お宅の祭りの供え物になってやろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-031"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那陳清只管磕頭相謝，又允送銀五百兩。惟陳澄也不磕頭，也不說謝，只是倚著那屏門痛哭。行者知之，上前扯住道：「老大，你這不允我，不謝我，想是捨不得你女兒麼？」陳澄才跪下道：「是，捨不得。敢蒙老爺盛情，救替了我侄子也夠了。但只是老拙無兒，止此一女，就是我死之後，他也哭得痛切，怎麼捨得？」行者道：「你快去蒸上五斗米的飯，整治些好素菜，與我那長嘴師父吃。教他變作你的女兒，我兄弟同去祭賽。索性行個陰騭，救你兩個兒女性命，如何？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      陳清は、ただひたすら頭を下げて感謝し、さらに銀五百両を出すと約束した。ところが陳澄だけは、頭も下げず、礼も言わず、目隠しの門にもたれて激しく泣いていた。悟空はそれを悟り、近づいて腕を取った。
      悟空「兄さんのほうは、何も約束せず、礼も言わないな。娘を手放せないんだろう。」
      陳澄は、ようやくひざまずいた。
      陳澄「はい、手放せません。お坊さまのご厚情で、甥を救い、身代わりになっていただけるだけで、もう十分でございます。ただ、私には息子がおらず、この娘一人きりです。私が死んだあとも、この子なら心の底から泣いてくれるでしょう。どうして手放せましょうか。」
      悟空「急いで、米五斗の飯を炊き、うまい精進料理を調えて、あの口の長いお坊さんに食わせてやってくれ。あいつを娘さんに変え、俺たち二人で祭りに行こう。いっそ陰徳（いんとく）を積み、お宅の二人の子供の命を救ってやろうじゃないか。どうだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-032"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那八戒聽得此言，心中大驚道：「哥哥，你要弄精神，不管我死活，就要攀扯我。」行者道：「賢弟，常言道：『雞兒不吃無工之食。』你我進門，感承盛齋，你還嚷吃不飽哩，怎麼就不與人家救些患難？」八戒道：「哥啊，變化的事情，我卻不會哩。」行者道：「你也有三十六般變化，怎麼不會？」三藏叫：「悟能，你師兄說得最是，處得甚當。常言：『救人一命，勝造七級浮屠。』一則感謝厚情；二來當積陰德；況涼夜無事，你兄弟耍耍去來。」八戒道：「你看師父說的話，我只會變山，變樹，變石頭，變癩象，變水牛，變大胖漢還可；若變小女兒，有幾分難哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      これを聞いた八戒は、ぎょっとした。
      八戒「兄貴、自分が腕を見せたいからって、俺の命なんか構いもせず、巻き込もうとするんだな。」
      悟空「弟よ、昔から『鶏だって、働きもせずに飯を食うものじゃない』と言うだろう。俺たちはここへ来て、ありがたいご馳走にあずかった。お前は、まだ食い足りないと騒いでいたじゃないか。それなのに、どうしてこの家の難儀を救ってやらないんだ。」
      八戒「兄貴、変身なんて、俺にはできないよ。」
      悟空「お前にも三十六通りの変化があるだろう。なぜ、できないんだ。」
      三蔵が呼びかけた。
      三蔵「悟能、兄弟子の言うことは、まことにもっともだ。たいへんよい取り計らいだよ。昔から、『人の命を一つ救うことは、七層の浮屠（ふと）を造るにも勝る』と言う。一つには厚いもてなしへのお礼、二つには人知れぬ徳を積むためだ。まして、涼しい夜で、ほかにすることもない。兄弟二人で、ひと遊びしておいで。」
      八戒「お師匠さまも、よくそんなことを言いますね。俺にできるのは、山や木や石に変わること、皮膚の荒れた象や水牛に変わること、それに、でかい太った男に変わるくらいですよ。小さな女の子になるのは、ちょいと難しいんです。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-033"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「老大莫信他，抱出你令愛來看。」那陳澄急入裡邊，抱將一秤金孩兒，到了廳上。一家子妻妾大小，不分老幼內外，都出來磕頭禮拜，只請救孩兒性命。那女兒頭上戴一個八寶垂珠的花翠箍；身上穿一件紅閃黃的紵絲襖，上套著一件官綠緞子棋盤領的披風；腰間繫一條大紅花絹裙；腳下踏一雙蝦蟆頭淺紅紵絲鞋；腿上穿兩隻綃金膝褲兒。也拿著果子吃哩。行者道：「八戒，這就是女孩兒。你快變的像他，我們祭賽去。」八戒道：「哥呀，似這般小巧俊秀，怎變？」行者叫：「快些，莫討打。」八戒慌了道：「哥哥不要打，等我變了看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      悟空「兄さん、こいつの言うことを信じるな。娘さんを抱いてきて、見せてくれ。」
      陳澄は急いで奥へ入り、一秤金を抱いて広間へ来た。家中の妻や妾、大人も子供も、老いも若きも、奥の者も表の者も、皆出てきて頭を地につけて拝み、子供の命を救ってほしいと願うばかりだった。
      娘は頭に、八つの宝飾と垂れる真珠をあしらった、花模様と青緑の飾りの輪を着けていた。体には赤地に黄色の光が差す紵絲（ちょし）の上衣を着て、その上に、碁盤のような四角い襟の、鮮やかな緑の繻子（しゅす）の外套をまとっている。腰には深紅の花模様の絹の裳（も）を結び、足には、つま先を蝦蟆の頭の形にした薄紅の紵絲の靴を履き、脚には金を施した膝覆いを二つ着けていた。やはり、手には果物を持って食べている。
      悟空「八戒、これが女の子だ。早く、この子そっくりに変われ。祭りへ行こう。」
      八戒「兄貴、こんなに小さくて、かわいくて、どうやって変わればいいんだ。」
      悟空「早くしろ。殴られたいのか。」
      八戒は慌てた。
      八戒「兄貴、殴らないでくれ。ひとまず、やってみるから。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-034"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這獃子念動咒語，把頭搖了幾搖，叫：「變！」真個變過頭來，就也像女孩兒面目，只是肚子胖大，郎伉不像。行者笑道：「再變變。」八戒道：「憑你打了罷，變不過來，奈何？」行者道：「莫成是丫頭的頭，和尚的身子？弄的這等不男不女，卻怎生是好？你可佈起罡來。」他就吹他一口仙氣，果然即時把身子變過，與那孩兒一般。便教：「二位老者，帶你寶眷與令郎、令愛進去，不要錯了。一會家，我兄弟躲懶討乖，走進去，轉難識認。你將好果子與他吃，不可教他哭叫，恐大王一時知覺，走了風汛。等我兩人耍子去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      八戒は呪文を唱え、頭を何度か振って叫んだ。
      八戒「変われ！」
      本当に頭は変わり、女の子そっくりの顔になった。だが、腹が太く大きく、体つきがごつくて似ていない。悟空は笑った。
      悟空「もう一度、変わってみろ。」
      八戒「殴るなら、好きに殴ってくれ。変われないものは、どうしようもないだろう。」
      悟空「女の子の頭に、坊主の体じゃないか。こんな男でも女でもない姿にして、どうするんだ。さあ、罡（こう）の構えを取れ。」
      悟空が仙気をひと息吹きかけると、たちまち体も変わり、その子と同じになった。それから言った。
      悟空「おじいさんたち、ご家族と息子さん、娘さんを奥へ連れていってくれ。取り違えるなよ。あとで俺たちが楽をしようと、うまくさぼって奥へ逃げ込んだら、かえって見分けがつかなくなる。子供には、うまい果物を食わせておいてくれ。泣かせたり叫ばせたりするな。大王がふと気づいて、秘密が漏れるといけない。では、俺たち二人で遊んでこよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-035"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，吩咐沙僧保護唐僧：「我變作陳關保，八戒變作一秤金。」二人俱停當了，卻問：「怎麼供獻？還是綑了去，是綁了去？蒸熟了去，是剁碎了去？」八戒道：「哥哥，莫要弄我，我沒這個手段。」老者道：「不敢，不敢。只是用兩個紅漆丹盤，請二位坐在盤內，放在桌上，著兩個後生擡一張桌子，把你們擡上廟去。」行者道：「好好好，拿盤子出來，我們試試。」那老者即取出兩個丹盤，行者與八戒坐上。四個後生擡起兩張桌子，往天井裡走走兒，又擡回放在堂上。行者歡喜道：「八戒，像這般子走走耍耍，我們也是上臺盤的和尚了。」八戒道：「若是擡了去，還擡回來，兩頭擡到天明，我也不怕。只是擡到廟裡，就要吃哩，這個卻不是耍子！」行者道：「你只看著我，剗著吃我時，你就走了罷。」八戒道：「知他怎麼吃哩？如先吃童男，我便好跑；如先吃童女，我卻如何？」老者道：「常年祭賽時，我這裡有膽大的鑽在廟後，或在供桌底下，看見他先吃童男，後吃童女。」八戒道：「造化，造化。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 180
        "line_end": 180
    "translation_ja": |-
      さすがの悟空は、沙悟浄に三蔵を守るよう言いつけた。
      悟空「俺は陳関保、八戒は一秤金になった。」
      二人とも支度が整うと、悟空は尋ねた。
      悟空「どうやって供えるんだ。くくって連れていくのか、縛って連れていくのか。蒸してからか、それとも細かく刻んでからか。」
      八戒「兄貴、からかわないでくれ。俺には、そんなことに耐える力はないぞ。」
      老人「とんでもございません。とんでもございません。ただ、赤漆塗りの盆を二つ使い、お二人にその中へお座りいただいて、卓の上に置きます。若者二人で卓を一つ担いで、お二人を廟まで運ぶのです。」
      悟空「いいだろう。いいだろう。盆を出してくれ。試してみよう。」
      老人がすぐに朱塗りの盆を二つ取り出すと、悟空と八戒は、その上に座った。四人の若者が二つの卓を担ぎ、中庭をぐるりと歩いてから、また戻って広間に下ろした。悟空は喜んだ。
      悟空「八戒、こうやって運んでもらって、ひと遊びすれば、俺たちも、とうとう大きな台盤（だいばん）に載せてもらえる、ご立派な坊主になったな。」
      八戒「担いでいって、また担いで戻ってくるなら、明け方まで行ったり来たりしても怖くはないよ。だが、廟へ運ばれたら食われるんだろう。それじゃ、遊びどころじゃないぞ！」
      悟空「俺のことだけ見ていろ。あいつが俺を食いかけたら、お前は逃げていい。」
      八戒「どうやって食うのか、分かるものか。先に男の子を食うなら、俺は逃げやすい。先に女の子を食ったら、俺はどうすりゃいいんだ。」
      老人「例年の祭りには、この辺りの肝の据わった者が、廟の後ろや供え物の卓の下へ潜り込んで、見ております。先に男の子を食べ、それから女の子を食べるのです。」
      八戒「運がいい。ありがたいことだ。」
    "translation_status": "reviewed"

      悟空「石碑が一つあっただけだ。上に『通天河』の三字、下には『徑過八百里、亙古少人行』の十字があって、『渡る距離は八百里、昔から通る人はまれ』ということだった。ほかには何もない。」
      老人「岸をもう少し上って、あの石碑から、ほんの一里ほどの所に、霊感大王（れいかんだいおう）の廟がありますが、ご覧になりませんでしたか。」
      悟空「見なかった。おじいさん、教えてくれ。どんな霊験があるというんだ。」
      二人の老人は、一緒に涙を流した。

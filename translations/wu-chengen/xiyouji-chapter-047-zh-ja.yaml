    "source_text": "兄弟正然談論，只聽得外面鑼鼓喧天，燈火照耀，同莊眾人打開前門，叫：「擡出童男童女來。」這老者哭哭啼啼，那四個後生將他二人擡將出去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 182
        "line_end": 182
    "translation_ja": |-
      二人がちょうど話していると、外では銅鑼と太鼓が空を揺るがすほど鳴り、灯が明るく輝いた。同じ村の人々が前の門を開け、呼ばわった。
      村人たち「男の子と女の子を担いで出してくれ。」
      老人は泣き続け、四人の若者は二人を担いで外へ出た。
    "translation_status": "reviewed"

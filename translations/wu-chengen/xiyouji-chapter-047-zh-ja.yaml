      第四十七回
      聖僧は夜、通天の流れに阻まれ、金と木は慈悲を垂れて幼子を救う
    "translation_status": "reviewed"
  - "id": "xy-ch47-002"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那國王倚著龍床，淚如泉湧，只哭到天晚不住。行者上前高呼道：「你怎麼這等昏亂？見放著那道士的屍骸，一個是虎，一個是鹿，那羊力是一個羚羊。不信時，撈上骨頭來看，那裡人有那樣骷髏？他本是成精的山獸，同心到此害你，因見氣數還旺，不敢下手。若再過二年，你氣數衰敗，他就害了你性命，把你江山一股兒盡屬他了。幸我等早來，除妖邪救了你命。你還哭甚？哭甚？急打發關文，送我出去。」國王聞此，方才省悟。那文武多官俱奏道：「死者果然是白鹿、黃虎，油鍋裡果是羊骨。聖僧之言，不可不聽。」國王道：「既是這等，感謝聖僧。今日天晚，」教：「太師，且請聖僧至智淵寺。明日早朝，大開東閣，教光祿寺安排素淨筵宴酬謝。」果送至寺裡安歇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて、国王は玉座にもたれ、泉のように涙を流して、日が暮れるまで泣きやまなかった。悟空（ごくう）が進み出て、大声で言った。
      悟空「どうして、そうも分別を失っているのです。あの道士たちの死骸が、目の前にあるではありませんか。一匹は虎、一匹は鹿、あの羊力（ようりき）は羚羊（れいよう）です。信じられなければ、骨をすくい上げてご覧なさい。あんな骨をした人間がいますか。あいつらは、もともと山の獣が化けたもので、示し合わせてここへ来て、あなたを害そうとしていたのです。まだあなたの運が盛んだったので、手を出せなかっただけです。あと二年もして運が衰えていれば、命を奪い、この国もそっくり自分たちのものにしていたでしょう。幸い、私たちが早く来て妖怪を退治し、あなたの命を救いました。それなのに、何を泣いているのです。何を！　早く通行証の手続きをして、私たちを送り出してください。」
      これを聞き、国王はようやく目が覚めた。文武の官たちも、そろって申し上げた。
      文武の官たち「死んだものは、確かに白鹿と黄色い虎でございます。油鍋の中にあるのも、羊の骨に違いありません。聖僧のお言葉を、お聞きにならぬわけにはまいりません。」
      国王「そういうことなら、聖僧にお礼を申す。今日はもう遅い。」
      国王は命じた。
      国王「太師（たいし）、ひとまず聖僧を智淵寺（ちえんじ）へご案内せよ。明朝は東閣（とうかく）を大きく開き、光禄寺（こうろくじ）に精進の宴を用意させて、お礼をするのだ。」
      こうして一行は寺へ送られ、休んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch47-003"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日五更時候，國王設朝，聚集多官，傳旨：「快出招僧榜文，四門各路張掛。」一壁廂大排筵宴，擺駕出朝，至智淵寺門外，請了三藏等，共入東閣赴宴，不在話下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      翌日の五更（ごこう）、国王は朝廷を開いて官たちを集め、命を下した。
      国王「ただちに僧を呼び戻す触れを出し、四方の城門と街道に張り出せ。」
      一方では盛大な宴が調えられた。国王は宮殿を出て智淵寺の門前まで赴き、三蔵（さんぞう）たちを招いて、一緒に東閣の宴へ向かった。その様子は、ここでは述べない。
    "translation_status": "reviewed"
  - "id": "xy-ch47-004"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那脫命的和尚聞有招僧榜，個個欣然，都入城來尋孫大聖，交納毫毛謝恩。這長老散了宴，那國王換了關文，同皇后嬪妃、兩班文武，送出朝門。只見那些和尚跪拜道傍，口稱：「齊天大聖爺爺，我等是沙灘上脫命僧人。聞知爺爺掃除妖孽，救拔我等，又蒙我王出榜招僧，特來交納毫毛，叩謝天恩。」行者笑道：「汝等來了幾何？」僧人道：「五百名，半個不少。」行者將身一抖，收了毫毛。對君臣僧俗人說道：「這些和尚，實是老孫放了；車輛是老孫運轉雙關，穿夾脊，捽碎了；那兩個妖道也是老孫打死了。今日滅了妖邪，方知是禪門有道。向後來，再不可胡為亂信。望你把三教歸一：也敬僧，也敬道，也養育人才。我保你江山永固。」國王依言，感謝不盡，遂送唐僧出城去訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      さて、命を救われた僧たちは、僧を呼び戻す触れが出たと聞くと、皆喜んで町へ入り、悟空を捜した。頂いた毛を返し、恩に礼を述べるためである。三蔵が宴を終えると、国王は通行証を改め、皇后や妃たち、文武の官を伴って、宮門の外まで一行を見送った。すると、僧たちが道端にひざまずいて拝み、呼びかけた。
      僧たち「斉天大聖（せいてんたいせい）さま、私どもは河原で命を救われた僧でございます。大聖（たいせい）さまが妖怪を滅ぼし、私どもをお救いくださったと伺いました。さらに王さまが僧を呼ぶ触れまで出してくださいましたので、頂いた毛をお返しし、お恵みに深く感謝申し上げに参りました。」
      悟空は笑った。
      悟空「お前たち、何人来たんだ。」
      僧たち「五百人でございます。一人たりとも欠けておりません。」
      悟空は体を一振りして毛を回収し、国王や臣下、僧と俗人たちに言った。
      悟空「この僧たちを逃がしたのは、確かに俺だ。荷車も、俺が体の二つの関門に力を巡らせ、背骨の関を通して、粉々にたたき壊した。あの二人の妖しい道士を殴り殺したのも俺だ。今こうして邪悪な妖怪を滅ぼし、仏門にも真の道があると分かっただろう。これからは、でたらめなことをして、むやみに信じ込んではならない。三教（さんきょう）を一つに合わせ、僧も敬い、道士も敬い、人材も育ててほしい。そうすれば、この国がいつまでも揺るがぬよう、俺が保証しよう。」
      国王はその言葉に従い、感謝してもしきれぬ思いで、三蔵たちを城外まで見送った。
    "translation_status": "reviewed"
  - "id": "xy-ch47-005"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這一去，只為慇懃經三藏，努力修持光一元。曉行夜住，渴飲飢餐，不覺的春盡夏殘，又是秋光天氣。一日，天色已晚，唐僧勒馬道：「徒弟，今宵何處安身也？」行者道：「師父，出家人莫說那在家人的話。」三藏道：「在家人怎麼？出家人怎麼？」行者道：「在家人，這時候溫床暖被，懷中抱子，腳後蹬妻，自自在在睡覺。我等出家人，那裡能夠？便是要帶月披星，餐風宿水，有路且行，無路方住。」八戒道：「哥哥，你只知其一，不知其二。如今路多嶮峻，我挑著重擔，著實難走，須要尋個去處，好眠一覺，養養精神，明日方好捱擔；不然，卻不累倒我也？」行者道：「趁月光再走一程，到有人家之所再住。」師徒們沒奈何，只得相隨行者往前。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      この旅は、ひたすら三蔵（さんぞう）の経を求め、修行に励んで根源の一元（いちげん）を輝かせるため。
      一行は朝に進んで夜に休み、渇けば飲み、腹が減れば食べた。いつの間にか春が尽き、夏も過ぎ、また秋の気配になっていた。ある日、もう日が暮れたころ、三蔵は馬の手綱を引いた。
      三蔵「お前たち、今夜はどこで休もうか。」
      悟空「お師匠さま、出家した者が、家に暮らす者のようなことを言ってはいけません。」
      三蔵「家に暮らす者はどうで、出家した者はどうだというのだ。」
      悟空「家に暮らす者なら、この時刻には温かい寝床で布団をかぶり、胸には子供を抱き、足では妻を押しやり、気楽に眠れます。出家した私たちに、そんなことができますか。月や星を頂いて歩き、風を食らい、水辺に寝るのです。道があれば進み、道がなくなって初めて休むのですよ。」
      八戒（はっかい）「兄貴は一つを知って、二つ目を知らないな。近ごろは険しい道ばかりだ。重い荷物を担いで、俺は本当に歩くのがつらいんだよ。どこか泊まる所を見つけて、ぐっすり眠り、元気を取り戻してこそ、明日また担いでいけるんだ。このままじゃ、疲れて倒れちまうだろう。」
      悟空「月明かりのうちに、もうひと歩きしよう。人の住んでいる所へ着いたら休めばいい。」
      三蔵たちはどうにもならず、悟空について先へ進んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch47-006"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又行不多時，只聽得滔滔浪響。八戒道：「罷了，來到盡頭路了。」沙僧道：「是一股水擋住也。」唐僧道：「卻怎生得渡？」八戒道：「等我試之，看深淺何如。」三藏道：「悟能，你休亂談，水之淺深，如何試得？」八戒道：「尋一個鵝卵石，拋在當中。若是濺起水泡來，是淺；若是骨都都沉下有聲，是深。」行者道：「你去試試看。」那獃子摸了一塊石頭，望水中拋去，只聽得骨都都泛起魚津，沉下水底。他道：「深深深，去不得！」唐僧道：「你雖試得深淺，卻不知有多少寬闊。」八戒道：「這個卻不知，不知。」行者道：「等我看看。」好大聖，縱觔斗雲，跳在空中，定睛觀看，但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      それほど歩かないうちに、ごうごうと波の音が聞こえた。
      八戒「駄目だ。行き止まりまで来ちまったぞ。」
      沙悟浄（さごじょう）「川が道をふさいでいます。」
      三蔵「どうやって渡ればよいのだろう。」
      八戒「俺が試して、深いか浅いか調べましょう。」
      三蔵「悟能（ごのう）、いい加減なことを言ってはいけない。水の深さを、どうして試せるのだ。」
      八戒「丸い石を一つ見つけて、真ん中へ投げ込むんです。水しぶきが跳ねたら浅い。ごぼごぼ音を立てて沈んだら、深いってわけです。」
      悟空「やってみろ。」
      八戒は手探りで石を一つ拾い、水の中へ投げた。ごぼごぼと魚の吐くような泡が立ち、石は底へ沈んでいった。
      八戒「深い、深い、深い！　渡れないぞ！」
      三蔵「深さを試せたとしても、幅がどれほどあるかは分からないではないか。」
      八戒「そいつは分かりません。分かりませんよ。」
      悟空「俺が見てみよう。」
      さすがは悟空、觔斗雲（きんとうん）を飛ばして空へ跳び上がり、じっと目を凝らした。見れば、こんなありさまであった。
    "translation_status": "reviewed"
  - "id": "xy-ch47-007"
    "section_id": "chapter-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      洋洋光浸月，浩浩影浮天。
      靈派吞華岳，長流貫百川。
      千層洶浪滾，萬疊峻波顛。
      岸口無漁火，沙頭有鷺眠。
      茫然渾似海，一望更無邊。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 125
        "line_end": 129
    "translation_ja": |-
      広々とした水の光に月が浸り、果てない水面に空の影が浮かぶ。
      霊妙な流れは華岳（かがく）をものみ込み、長い流れには百の川が通じる。
      千重の荒波が転がり、万重の高波が逆巻く。
      岸辺には漁火もなく、砂浜では鷺が眠る。
      見渡すかぎり海のようで、どこまで眺めても果てがない。
    "translation_status": "reviewed"
  - "id": "xy-ch47-008"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "急收雲頭，按落河邊道：「師父，寬哩，寬哩，去不得！老孫火眼金睛，白日裡常看千里，凶吉曉得是；夜裡也還看三五百里。如今通看不見邊岸，怎定得寬闊之數？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      悟空は急いで雲を収め、川岸へ降りて言った。
      悟空「お師匠さま、広いですよ。広すぎます。渡れません！　私の火眼金睛（かがんきんせい）なら、昼は千里（り）の先まで見て、吉凶を見分けられます。夜でも三百里、五百里は見えます。それなのに、今は向こう岸がまるで見えません。これでは、幅がどれほどあるかも決めようがありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-009"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏大驚，口不能言，聲音哽咽道：「徒弟啊，似這等怎了？」沙僧道：「師父莫哭。你看那水邊立的，可不是個人麼？」行者道：「想是扳罾的漁人，等我問他去來。」拿了鐵棒，兩三步，跑到面前看處，呀！不是人，是一面石碑。碑上有三個篆文大字，下邊兩行有十個小字。三個大字乃「通天河」，十個小字乃「徑過八百里，亙古少行人」。行者叫：「師父，你來看看。」三藏看見，滴淚道：「徒弟呀，我當年別了長安，只說西天易走，那知道妖魔阻隔，山水迢遙。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      三蔵は驚きのあまり言葉を失い、声を詰まらせながら言った。
      三蔵「お前たち、こんなことでは、どうすればよいのだ。」
      沙悟浄「お師匠さま、泣かないでください。あの水辺に立っているのは、人ではありませんか。」
      悟空「揚げ網を引いている漁師だろう。俺が聞いてこよう。」
      鉄の棒を持ち、二、三歩で駆け寄って見ると、おや、人ではなく石碑だった。碑には篆書の大きな字が三つ、その下には十の小さな字が二行に分けて刻んである。大きな三字は「通天河（つうてんが）」、小さな十字は「徑過八百里、亙古少行人」、すなわち「渡る距離は八百里、昔から通る人はまれ」であった。
      悟空「お師匠さま、こちらをご覧ください。」
      三蔵は碑を見て、涙をこぼした。
      三蔵「お前たち、あの年に長安（ちょうあん）を出たときは、西天（さいてん）へはたやすく行けると思っていた。妖魔に道をふさがれ、山も川も、これほど遠く隔たっていようとは思わなかったよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-010"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒道：「師父，你且聽，是那裡鼓鈸聲音？想是做齋的人家。我們且去趕些齋飯吃，問個渡口尋舡，明日過去罷。」三藏馬上聽得，果然有鼓鈸之聲：「卻不是道家樂器，足是我僧家舉事。我等去來。」行者在前引馬，一行聞響而來。那裡有甚正路，沒高沒低，漫過沙灘，望見一簇人家住處，約摸有四五百家，卻也都住得好。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      八戒「お師匠さま、ちょっと聞いてください。どこかで太鼓や鈸（はち）が鳴っていませんか。きっと、法要をしている家があるんでしょう。行ってお斎を少し頂き、渡し場を聞いて船を探し、明日渡りましょうよ。」
      三蔵が馬上で耳を澄ますと、確かに太鼓と鈸の音がした。
      三蔵「あれは道教の楽器ではない。間違いなく、私たち僧の法事だ。行ってみよう。」
      悟空が先に立って馬を引き、一行は音を頼りに進んだ。まともな道などなく、高い所も低い所も構わず河原を越えると、家々の集まりが見えてきた。四、五百軒ほどもあろうか。なかなか立派な住まいであった。その様子は、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch47-011"
    "section_id": "chapter-47"
    "kind": "verse"
    "origin": "source"
    "source_text": "倚山通路，傍岸臨溪。處處柴扉掩，家家竹院關。沙頭宿鷺夢魂清，柳外啼鳴喉舌冷。短笛無聲，寒砧不韻。紅蓼枝搖月，黃蘆葉鬥風。陌頭村犬吠疏籬，渡口老漁眠釣艇。燈火稀，人煙靜，半空皎月如懸鏡。忽聞一陣白蘋香，卻是西風隔岸送。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      山に寄り添って道が通じ、岸に沿って流れを望む。
      どこも柴の戸は閉ざされ、どの家も竹の垣の門を閉じている。
      砂浜に眠る鷺は澄んだ夢を見て、柳の向こうで鳴く鳥の喉は冷たい。
      短い笛の音もなく、寒夜の砧（きぬた）も響かない。
      赤い蓼の枝は月影に揺れ、黄色い葦の葉は風と競う。
      道端では村の犬がまばらな垣根のそばで吠え、渡し場では老いた漁師が釣り舟に眠る。
      灯はまばら、人里は静まり、空の半ばに白い月が鏡のように掛かる。
      ふと白蘋（はくひん）の香りが漂ってきたのは、西風が向こう岸から運んできたのであった。
    "translation_status": "reviewed"
  - "id": "xy-ch47-012"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏下馬，只見那路頭上有一家兒，門外豎一首幢幡，內裡有燈燭熒煌，香煙馥郁。三藏道：「悟空，此處比那山凹河邊卻是不同。在人間屋簷下，可以遮得冷露，放心穩睡。你都莫來，讓我先到那齋公門首告求。若肯留我，我就招呼汝等；假若不留，你卻休要撒潑。汝等臉嘴醜陋，只恐諕了人，闖出禍來，卻倒無住處矣。」行者道：「說得有理。請師父先去，我們在此守待。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      三蔵が馬を下りると、道の先に一軒の家があり、門の外には幢幡（どうばん）が一旒立っていた。中では灯と蝋燭が明るく輝き、香の煙が芳しく立ちこめている。
      三蔵「悟空、ここは山のくぼみや川辺とは違う。人の家の軒下なら、冷たい露も避けられ、安心して眠れるだろう。お前たちは来ずに、私だけで、施主の家の門前へお願いに行かせておくれ。泊めてくださるなら呼ぼう。断られたとしても、乱暴をしてはいけないよ。お前たちは顔つきが恐ろしいから、人を驚かせて騒ぎを起こし、かえって泊まれなくなるといけない。」
      悟空「もっともです。お師匠さま、先にいらしてください。私たちはここで待っています。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-013"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老才摘了斗笠，光著頭，抖抖褊衫，拖著錫杖，徑來到人家門外。見那門半開半掩，三藏不敢擅入。聊站片時，只見裡面走出一個老者，項下掛著數珠，口念阿彌陀佛，徑自來關門。慌得這長老合掌高叫：「老施主，貧僧問訊了。」那老者還禮道：「你這和尚，卻來遲了。」三藏道：「怎麼說？」老者道：「來遲無物了。早來啊，我舍下齋僧，盡飽吃飯，熟米三升，白布一段，銅錢十文。你怎麼這時候才來？」三藏躬身道：「老施主，貧僧不是趕齋的。」老者道：「既不趕齋，來此何幹？」三藏道：「我是東土大唐欽差往西天取經者，今到貴處，天色已晚。聽得府上鼓鈸之聲，特來告借一宿，天明就行也。」那老者搖手道：「和尚，出家人休打誑語。東土大唐，到我這裡，有五萬四千里路。你這等單身，如何來得？」三藏道：「老施主見得最是。但我還有三個小徒，逢山開路，遇水疊橋，保護貧僧，方得到此。」老者道：「既有徒弟，何不同來？」教：「請，請，我舍下有處安歇。」三藏回頭，叫聲：「徒弟，這裡來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      三蔵は笠を取って頭をあらわにし、褊衫（へんさん）を払い整え、錫杖（しゃくじょう）を引いて、家の門前へまっすぐ進んだ。門は半ば開いていたが、勝手に入るのははばかられた。しばらく立っていると、中から一人の老人が出てきた。首には数珠を掛け、阿弥陀仏（あみだぶつ）を唱えながら、門を閉めに来たのである。三蔵は慌てて合掌し、声を上げた。
      三蔵「ご老施主、旅の僧がご挨拶申し上げます。」
      老人は礼を返した。
      老人「お坊さま、来るのが遅かったですな。」
      三蔵「どういうことでしょう。」
      老人「遅すぎて、もう何もないのです。早く来れば、うちで僧に食事を振る舞いましたから、腹いっぱい食べたうえ、炊いた米を三升（しょう）、白い布を一段（だん）、銅銭を十文（もん）、差し上げられたのに。どうして、今ごろ来なさった。」
      三蔵は身をかがめた。
      三蔵「ご老施主、私はお斎を頂きに来たのではありません。」
      老人「それなら、何のご用ですかな。」
      三蔵「私は東土（とうど）の大唐（だいとう）から、帝の命を受けて西天へ経を取りに行く者です。今日こちらまで参ったところ、日が暮れました。お宅で太鼓や鈸の音がするのを聞き、一夜の宿をお借りしたく参りました。夜が明ければ出立いたします。」
      老人は手を振った。
      老人「お坊さま、出家した者が嘘をついてはいけません。東土の大唐からここまでは、五万四千里もあります。たったお一人で、どうして来られますか。」
      三蔵「ご老施主、ごもっともです。ただ、私には三人の弟子がおりまして、山に出会えば道を開き、水に出会えば橋を架け、守ってくれたおかげで、ようやくここまで来られました。」
      老人「お弟子さんがいるなら、なぜ一緒に来なさらんのです。さあ、どうぞ、どうぞ。うちには休んでいただく所がございます。」
      三蔵は振り返って呼んだ。
      三蔵「お前たち、こちらへおいで。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-014"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那行者本來性急，八戒生來粗魯，沙僧卻也莽撞，三個人聽得師父招呼，牽著馬，挑著擔，不問好歹，一陣風，闖將進去。那老者看見，諕得跌倒在地，口裡只說：「是妖怪來了，妖怪來了。」三藏攙起道：「施主莫怕，不是妖怪，是我徒弟。」老者戰兢兢道：「這般好俊師父，怎麼尋這樣醜徒弟。」三藏道：「雖然相貌不中，卻倒會降龍伏虎，捉怪擒妖。」老者似信不信的，扶著唐僧慢走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      もとから気のせく悟空、生まれつき粗っぽい八戒、そして沙悟浄も向こう見ずだった。三人は師の呼ぶ声を聞くと、馬を引き、荷を担ぎ、何も構わず、一陣の風のように飛び込んできた。老人は見るなり仰天して、その場に倒れ、口ではただ叫び続けた。
      老人「妖怪が来た、妖怪が来た！」
      三蔵は老人を助け起こした。
      三蔵「ご施主、怖がらないでください。妖怪ではありません。私の弟子です。」
      老人はがたがた震えながら言った。
      老人「こんなに立派なお師匠さまが、どうして、こんなに醜いお弟子を見つけなさった。」
      三蔵「見た目はよくありませんが、竜を降し、虎を伏せ、妖怪を捕らえる力があるのです。」
      老人は半信半疑のまま、三蔵につかまって、ゆっくり歩いた。
    "translation_status": "reviewed"
  - "id": "xy-ch47-015"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那三個兇頑闖入廳房上，拴了馬，丟下行李。那廳中原有幾個和尚念經，八戒掬著長嘴喝道：「那和尚，念的是甚麼經？」那些和尚聽見問了一聲，忽然擡頭："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      さて、三人の荒くれ者は広間へ飛び込むと、馬をつなぎ、荷物を投げ出した。広間には、もともと数人の僧がいて経を読んでいた。八戒は長い口先を突き出し、どなった。
      八戒「おい、坊さんたち、何の経を読んでいるんだ。」
      問いかけられた僧たちが、ぱっと顔を上げると、
    "translation_status": "reviewed"
  - "id": "xy-ch47-016"
    "section_id": "chapter-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      觀看外來人，嘴長耳朵大。
      身粗背膊寬，聲響如雷咋。
      行者與沙僧，容貌更醜陋。
      廳堂幾眾僧，無人不害怕。
      闍黎還念經，班首教行罷。
      難顧磬和鈴，佛像且丟下。
      一齊吹息燈，驚散光乍乍。
      跌跌與爬爬，門限何曾跨。
      你頭撞我頭，似倒葫蘆架。
      清清好道場，翻成大笑話。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 143
        "line_end": 152
    "translation_ja": |-
      見知らぬ客は、長い口に大きな耳。
      太い体、広い背中、声は雷のように鳴り響く。
      悟空と沙悟浄は、顔つきがなお恐ろしい。
      広間に集う僧たちは、誰もが恐怖に震えた。
      闍黎（じゃり）はまだ経を唱えているが、班首（はんしゅ）は、もう逃げよと言う。
      磬（けい）も鈴も構ってはいられず、仏像さえ投げ出した。
      一斉に灯を吹き消し、驚き散って、あっという間に影もない。
      転んでは這い、敷居をまともにまたぐ暇さえない。
      お前の頭と俺の頭がぶつかり、瓢箪の棚が崩れたよう。
      清らかだった立派な道場が、とんだ笑い話になってしまった。
    "translation_status": "reviewed"
  - "id": "xy-ch47-017"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這兄弟三人見那些人跌跌爬爬，鼓著掌哈哈大笑。那些僧越加悚懼，磕頭撞腦，各顧性命，通跑淨了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 154
        "line_end": 154
    "translation_ja": "三人の兄弟弟子は、人々が転んだり這ったりするのを見て、手を打ち、はははと大笑いした。僧たちはいっそう恐れ、頭をぶつけ合いながら、命ばかりを大事に、残らず逃げ去った。"
    "translation_status": "reviewed"
  - "id": "xy-ch47-018"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏攙那老者，走上廳堂，燈火全無，三人嘻嘻哈哈的還笑。唐僧罵道：「這潑物，十分不善。我朝朝教誨，日日叮嚀。古人云：『不教而善，非聖而何？教而後善，非賢而何？教亦不善，非愚而何？』汝等這般撒潑，誠為至下至愚之類。走進門不知高低，諕倒了老施主，驚散了念經僧，把人家好事都攪壞了，卻不是墮罪與我？」說得他們不敢回言。那老者方信是他徒弟，急回頭作禮道：「老爺，沒大事，沒大事。才然關了燈，散了花，佛事將收也。」八戒道：「既是了帳，擺出滿散，酒飯來，我們吃了睡覺。」老者叫：「掌燈來，掌燈來。」家裡人聽得，大驚小怪道：「廳上念經，有許多香燭，如何又教掌燈？」幾個僮僕出來看時，這裡黑洞洞的，即便點火把燈籠，一擁而至。忽擡頭見八戒、沙僧，慌得丟了火把，忽抽身關了中門。往裡嚷道：「妖怪來了！妖怪來了！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      三蔵は老人を支えて広間へ上がった。灯は一つもなく、三人はまだ、へらへらと笑っている。三蔵は叱った。
      三蔵「この乱暴者ども、まったく性根が悪い。私は毎朝教え、毎日言い聞かせている。昔の人は、『教えられずに善くある者、それを聖人と言わず何と言おう。教えられて善くなる者、それを賢人と言わず何と言おう。教えられても善くならぬ者、それを愚者と言わず何と言おう』と言った。これほど乱暴を働くお前たちは、まさしく、最も卑しく愚かな者たちだ。門を入るにも分別がなく、ご老施主を驚かせて倒し、読経する僧を追い散らし、人の家のよい営みを、すっかり台無しにした。これでは、私にまで罪を負わせるではないか。」
      三人は叱られて、言い返すこともできなかった。老人も、これで本当に三蔵の弟子なのだと信じ、急いで向き直って礼をした。
      老人「お坊さま、大したことではありません。大したことでは。ちょうど灯を消し、花を散らして、仏事を終えるところだったのです。」
      八戒「もう終わったんなら、満散（まんさん）の酒や飯を出してくれよ。食ったら寝よう。」
      老人「明かりを持ってきてくれ。明かりを！」
      家の者たちは聞きつけて、大げさに驚いた。
      家の者たち「広間ではお経を読んでいて、香も蝋燭もたくさんあったのに、どうしてまた明かりを持ってこいと言うんだろう。」
      数人の召使いが出てみると、辺りは真っ暗だった。すぐに松明と提灯を灯し、そろって押し寄せたが、顔を上げて八戒と沙悟浄を見たとたん、慌てて松明を投げ捨て、身を翻して中門を閉めた。そして奥へ向かって、どなった。
      召使いたち「妖怪だ！　妖怪が来た！」
    "translation_status": "reviewed"
  - "id": "xy-ch47-019"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者拿起火把，點上燈燭，扯過一張交椅，請唐僧坐在上面；他兄弟們坐在兩傍，那老者坐在前面。正敘坐間，只聽得裡面門開處，又走出一個老者，拄著拐杖道：「是甚麼邪魔，黑夜裡來我善門之家？」前面坐的老者，急起身迎到屏門後道：「哥哥莫嚷，不是邪魔，乃東土大唐取經的羅漢。徒弟們相貌雖兇，果然是相惡人善。」那老者方才放下拄杖，與他四位行禮。禮畢，也坐了面前，叫：「看茶來。排齋。」連叫數聲，幾個僮僕戰戰兢兢，不敢攏帳。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      悟空は松明を拾って灯と蝋燭をともし、折り畳み椅子を一脚引き寄せて、三蔵を上座に座らせた。三人の弟子は両側に、老人は向かいに座った。座を整えていると、奥の門が開く音がして、もう一人の老人が杖をついて出てきた。
      もう一人の老人「夜中に、善行を積むこの家へ来たのは、どんな魔物だ。」
      向かいに座っていた老人は、急いで立ち上がって目隠しの門の後ろへ迎えに行った。
      弟の老人「兄さん、騒がないでください。魔物ではありません。東土の大唐から経を取りに行く羅漢（らかん）さまたちです。お弟子さんたちは恐ろしい顔をしていますが、本当に、顔は悪くても心は善い方々です。」
      兄の老人は、ようやく杖を置き、四人に礼をした。挨拶を終えると、やはり向かいに座り、呼びつけた。
      兄の老人「お茶を持ってまいれ。お斎を用意するのだ。」
      何度も呼んだが、召使いたちは、びくびくして近寄ろうとしなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch47-020"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒忍不住問道：「老者，你這盛价兩邊走怎的？」老者道：「教他們捧齋來侍奉老爺。」八戒道：「幾個人伏侍？」老者道：「八個人。」八戒道：「這八個人伏侍那個？」老者道：「伏侍你四位。」八戒道：「那白面師父只消一個人，毛臉雷公嘴的只消兩個人，那晦氣臉的要八個人，我得二十個人伏侍方夠。」老者道：「這等說，想是你的食腸大些。」八戒道：「也將就看得過。」老者道：「有人，有人。」七大八小，就叫出有三四十人出來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      八戒は我慢できずに尋ねた。
      八戒「おじいさん、あんたの召使いたちは、なぜ両側を行ったり来たりしているんだ。」
      老人「お食事をお運びして、お給仕するよう申しつけたのです。」
      八戒「何人で給仕するんだ。」
      老人「八人です。」
      八戒「その八人で、誰の給仕をするんだ。」
      老人「あなた方、四人さまです。」
      八戒「あの色白のお師匠さまなら一人でいい。毛むくじゃらで雷公（らいこう）みたいな口の兄貴なら二人、あの陰気な顔の奴には八人いる。俺には二十人ついてくれなきゃ足りないぞ。」
      老人「それでは、食べる量が少々多いのですかな。」
      八戒「まあ、そこそこだよ。」
      老人「人手ならおります。おりますとも。」
      大きい者、小さい者をあれこれ呼び出すと、三、四十人になった。
    "translation_status": "reviewed"
  - "id": "xy-ch47-021"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那和尚與老者一問一答的講話，眾人方才不怕。卻將上面排了一張桌，請唐僧上坐；兩邊擺了三張桌，請他三位坐；前面一張桌，坐了二位老者。先排上素果品菜蔬，然後是麵飯、米飯、閑食、粉湯，排得齊齊整整。唐長老舉起箸來，先念一卷《啟齋經》。那獃子一則有些急吞，二來有些餓了，那裡等唐僧經完，拿過紅漆木碗來，把一碗白米飯撲的丟下口去，就了了。傍邊小的道：「這位老爺忒沒算計，不籠饅頭，怎的把飯籠了，卻不污了衣服？」八戒笑道：「不曾籠，吃了。」小的道：「你不曾舉口，怎麼就吃了？」八戒道：「兒子們便說謊，分明吃了；不信，再吃與你看。」那小的們又端了碗，盛一碗遞與八戒。獃子幌一幌，又丟下口去就了了。眾僮僕見了道：「爺爺呀！你是磨磚砌的喉嚨，著實又光又溜。」那唐僧一卷經還未完，他已五六碗過手了。然後卻才同舉箸，一齊吃齋。獃子不論米飯麵飯、果品閑食，只情一撈，亂噇，口裡還嚷：「添飯，添飯。」漸漸不見來了。行者叫道：「賢弟，少吃些罷，也強似在山凹裡忍餓，將就夠得半飽也好了。」八戒道：「嘴臉。常言道：『齋僧不飽，不如活埋』哩。」行者教：「收了家火，莫睬他。」二老者躬身道：「不瞞老爺說，白日裡倒也不怕，似這大肚子長老，也齋得起百十眾。只是晚了，收了殘齋，只蒸得一石麵飯、五斗米飯與幾桌素食，要請幾個親鄰與眾僧們散福。不期你列位來，諕得眾僧跑了，連親鄰也不曾敢請，盡數都供奉了列位。如不飽，再教蒸去。」八戒道：「再蒸去，再蒸去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      僧と老人が一問一答で話すうちに、皆もようやく怖がらなくなった。上座に卓を一つ据えて三蔵を迎え、両側には三つの卓を並べて、三人の弟子を座らせた。向かいの卓には、二人の老人が座った。まず精進の果物や野菜料理を並べ、続いて小麦粉の食べ物、米の飯、菓子、粉を使った汁物を出し、きちんと調えた。三蔵は箸を取り上げ、初めに『啓斎経（けいさいきょう）』を一巻唱えた。
      八戒は、がつがつ食べたい気持ちもあれば、腹も減っていた。三蔵が経を読み終わるのなど待っていられない。赤漆の木椀を引き寄せると、白米の飯を一杯、ぽんと口へ放り込んで、それで終わりだった。
      そばの召使い「このお坊さまは、ずいぶん考えなしですな。饅頭を懐にしまうならともかく、飯をしまうとは。服が汚れてしまいませんか。」
      八戒は笑った。
      八戒「しまっちゃいない。食ったんだ。」
      召使い「まだ口も動かしていないのに、どうして食べたのです。」
      八戒「嘘をついたら、お前たちの息子になってやる。確かに食ったんだ。信じないなら、もう一度食って見せよう。」
      召使いたちは、また椀を持ち、飯を一杯盛って渡した。八戒がちょいと手を動かし、口へ放り込むと、またそれで終わりである。
      召使いたち「おお、お坊さま！　その喉は、磨いた煉瓦を積んでできているのでしょう。本当に、つるつる滑らかですなあ。」
      三蔵が経を一巻読み終わらないうちに、八戒はもう五、六杯も平らげていた。それからようやく、皆もそろって箸を取り、お斎を頂いた。八戒は米の飯も小麦粉の食べ物も、果物も菓子も見境なく、ひたすらつかんではむさぼり、口ではまだ叫んでいた。
      八戒「飯をくれ。お代わりだ！」
      だんだん、食べ物が出てこなくなった。悟空が声をかけた。
      悟空「弟よ、そのくらいにしておけ。山のくぼみで腹をすかしているより、よほどましだ。ひとまず半分も腹が満ちれば、十分だろう。」
      八戒「よく言うよ。昔から、『僧に飯を振る舞って満腹にさせないくらいなら、生き埋めにしたほうがまし』って言うじゃないか。」
      悟空「食器を片づけてくれ。こいつには構わなくていい。」
      二人の老人は身をかがめた。
      二人の老人「正直に申し上げますと、昼間なら、何も心配はいりませんでした。この腹の大きいお坊さまのような方が百人ほどいらしても、お食事は差し上げられます。ただ、もう夜も遅く、昼の残りの食事は片づけ、小麦粉の食べ物を一石（こく）、米の飯を五斗（と）、精進料理を数卓分、用意しただけでございました。親類や隣近所の者を何人か、僧たちとともに招き、福を分かち合うつもりだったのです。思いがけず皆さまが来られ、僧たちは驚いて逃げてしまい、親類や隣人も招くに招けませんでしたので、すべて皆さまにお出しいたしました。足りなければ、また蒸してこさせましょう。」
      八戒「また蒸してくれ。また頼むよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-022"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話畢，收了家火桌席。三藏拱身，謝了齋供，才問：「老施主高姓？」老者道：「姓陳。」三藏合掌道：「這是我貧僧華宗了。」老者道：「老爺也姓陳？」三藏道：「是，俗家也姓陳。請問適才做的甚麼齋事？」八戒笑道：「師父問他怎的，豈不知道？必然是青苗齋、平安齋、了場齋罷了。」老者道：「不是，不是。」三藏又問：「端的為何？」老者道：「是一場預修亡齋。」八戒笑得打跌道：「公公忒沒眼力。我們是扯謊架橋哄人的大王，你怎麼把這謊話哄我？和尚家豈不知齋事？只有個預修寄庫齋、預修填還齋，那裡有個『預修亡齋』的？你家人又不曾有死的，做甚亡齋？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch47-2598626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第047回&oldid=2598626"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      こう話して、食器や卓、膳を片づけた。三蔵は身を正して食事の施しに礼を述べ、それから尋ねた。
      三蔵「ご老施主、お姓は何とおっしゃいますか。」
      老人「陳（ちん）と申します。」
      三蔵は合掌した。
      三蔵「それでは、私と同じ一族でいらっしゃいますね。」
      老人「お坊さまも、陳とおっしゃるのですか。」
      三蔵「はい、俗姓は陳です。お尋ねしますが、先ほどは何の法要をなさっていたのですか。」
      八戒は笑った。
      八戒「お師匠さま、聞くまでもないでしょう。分かりませんか。きっと青苗斎（せいびょうさい）か、平安斎（へいあんさい）か、了場斎（りょうじょうさい）ですよ。」
      老人「いいえ、違います。違います。」
      三蔵「では、本当は何のためなのでしょう。」
      老人「予修亡斎（よしゅうぼうさい）でございます。」
      八戒は転びそうになるほど笑った。
      八戒「おじいさん、見る目がないな。俺たちは嘘をつき、仕掛けをこしらえて、人をだます大親分だぞ。そんな嘘で俺をだまそうってのか。僧が法要を知らないわけがあるか。生きているうちにする予修寄庫斎（よしゅうきこさい）や予修填還斎（よしゅうてんかんさい）ならあるが、『予修亡斎』なんてものがどこにある。家の者が誰も死んでいないのに、何の死者供養だよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch47-023"
    "section_id": "chapter-47"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，暗喜道：「這獃子乖了些也。──老公公，你是錯說了。怎麼叫做『預修亡齋』？」那二位欠身道：「你等取經，怎麼不走正路，卻蹡到我這裡來？」行者道：「走的是正路，只見一股水擋住，不能得渡，因聞鼓鈸之聲，特來造府借宿。」老者道：「你們到水邊，可曾見些甚麼？」行者道：「止見一面石碑，上書『通天河』三字，下書『徑過八百里，亙古少人行』十字，再無別物。」老者道：「再往上岸走走，好的離那碑記只有里許，有一座靈感大王廟，你不曾見？」行者道：「未見。請公公說說，何為靈感？」那兩個老者一齊垂淚道：「老爺啊，那大王："
    "source_languages":
      - "zh-Hant"
    "source_locations":

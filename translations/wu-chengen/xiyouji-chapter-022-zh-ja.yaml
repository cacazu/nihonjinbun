    "description_ja": "悟空は生身の三蔵を雲で運べず妖怪の拉致も地面に沿うと説明するが、これは本人の発言として保持した。他の場面との整合を独自に修正しない。「五七千里」は五千〜七千里ほどの概数。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "segment_ids":

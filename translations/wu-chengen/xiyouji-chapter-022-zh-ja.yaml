  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖護了唐僧，牽著馬，守定行李。見八戒與那怪交戰，就恨得咬牙切齒，擦掌磨拳，忍不住要去打他，掣出棒來道：「師父，你坐著，莫怕。等老孫和他耍耍兒來。」那師父苦留不住。他打個唿哨，跳到前邊。原來那怪與八戒正戰到好處，難解難分。被行者掄起鐵棒，望那怪著頭一下，那怪急轉身，慌忙躲過，徑鑽入流沙河裡。氣得個八戒亂跳道：「哥啊，誰著你來的？那怪漸漸手慢，難架我鈀，再不上三五合，我就擒住他了。他見你兇險，敗陣而逃，怎生是好？」行者笑道：「兄弟，實不瞞你說，自從降了黃風怪，下山來，這個把月不曾耍棍，我見你和他戰的甜美，我就忍不住腳癢，故就跳將來耍耍的。那知那怪不識耍，就走了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空は三蔵を守り、馬を引き、荷物を見張っていた。八戒と妖怪が戦うのを見ていると、憎さに歯を食いしばり、手をこすって拳を握り、加勢したくてたまらなくなった。棒を抜いて言った。悟空「お師匠さま、座っていてください。恐れることはありません。私もあいつと少し遊んできます。」
    三蔵はしきりに引き留めたが、止められない。悟空は口笛を吹き、前へ跳んだ。折しも妖怪と八戒は戦いの佳境で、もつれ合って離れられない。悟空が鉄棒を振るって頭へ打ち下ろすと、妖怪は急いで身を返してかわし、そのまま流沙河へ飛び込んだ。
    八戒は腹を立て、跳びはねた。八戒「兄貴、誰がお前に来いと言ったんだ。あいつの手はだんだん鈍り、俺の熊手を受けきれなくなっていた。あと三合か五合もすれば捕らえられたのに。お前の恐ろしい勢いを見て逃げちまったじゃないか。どうするんだ。」
    悟空は笑った。悟空「兄弟、正直に言うと、黄風怪（こうふうかい）を降して山を下りてから、このひと月ほど棒を振るっていなくてな。お前たちがうまい具合に戦っているのを見たら、足がむずむずして辛抱できず、少し遊ぼうと飛び出したんだ。まさか、あいつが遊びも分からず逃げるとは思わなかった。」
  "translation_status": "reviewed"
- "id": "xy-ch22-010"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個攙著手，說說笑笑，轉回見了唐僧。唐僧道：「可曾捉得妖怪？」行者道：「那妖怪不奈戰，敗回鑽入水去也。」三藏道：「徒弟，這怪久住于此，他知道淺深。似這般無邊的弱水，又沒了舟楫，須是得個知水性的引領引領才好哩。」行者道：「正是這等說。常言道：『近硃者赤，近墨者黑。』那怪在此，斷知水性。我們如今拿住他，且不要打殺，只教他送師父過河，再做理會。」八戒道：「哥哥不必遲疑，讓你先去拿他，等老豬看守師父。」行者笑道：「賢弟呀，這樁兒我不敢說嘴，水裡勾當，老孫不大十分熟。若是空走，還要捻訣，又念念避水咒，方才走得；不然，就要變化做甚麼魚蝦蟹鱉之類，我才去得。若論賭手段，憑你在高山雲裡，幹甚麼蹊蹺異樣事兒，老孫都會；只是水裡的買賣，有些兒榔杭。」八戒道：「老豬當年總督天河，掌管了八萬水兵大眾，倒學得知些水性。卻只怕那水裡有甚麼眷族老小，七窩八代的都來，我就弄他不過，一時不被他撈去耶？」行者道：「你若到他水中與他交戰，卻不要戀戰，許敗不許勝，把他引將出來，等老孫下手助你。」八戒道：「言得是，我去耶。」說聲去，就剝了青錦直裰，脫了鞋，雙手舞鈀，分開水路，使出那當年舊手段，躍浪翻波，撞將進去，徑至水底之下，往前正走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    二人は手を取り合い、笑い話をしながら三蔵のもとへ戻った。
    三蔵「妖怪は捕らえたかね。」
    悟空「あいつは戦いに耐えきれず、敗れて水へ潜ってしまいました。」
    三蔵「お前たち、あの妖怪はここに長く住んでいるから、水の深さも浅さも知っているはずだ。この果てしない弱水を、舟も櫂もなく渡るのだから、水のことを心得た者に導いてもらわねばなるまい。」
    悟空「おっしゃるとおりです。『朱に交われば赤くなり、墨に交われば黒くなる』といいます。あいつもここにいる以上、必ず水の性質を知っています。捕らえたらすぐには殺さず、まずお師匠さまを渡らせ、そのあとで考えましょう。」
    八戒「兄貴、ためらうことはない。先に行って捕らえてきてくれ。俺は師匠を守っている。」
    悟空は笑った。悟空「兄弟、この件では大口はたたけない。水の中のことは、俺もそれほど得意じゃない。何もせず歩くだけでも、印を結んで避水の呪文を唱えねばならないし、そうでなければ魚や海老、蟹やスッポンに化けて、ようやく入れるんだ。腕比べなら、高い山でも雲の中でも、どんな変わった術でも俺は使える。ただ、水中での仕事は少々不器用でな。」
    八戒「俺は昔、天の川を統べ、八万の水兵を指揮していたから、水の扱いはいくらか学んでいる。ただ、あの水の底に一族の年寄りや子供がいて、七つ八つの巣や世代からどっと出てきたら、さばききれずに捕まっちまうんじゃないか。」
    悟空「水中で戦っても、夢中になるな。負けてよいが勝ってはいけない。あいつを外へ誘い出してくれれば、俺が手を貸す。」
    八戒「それがいい。行ってくるぞ。」
    そう言うと、青錦の直裰（ちょくたつ）と靴を脱ぎ、両手で熊手を振るって水を分けた。かつての腕前を発揮し、波を跳び、うねりを返して中へ入り、まっすぐ水底へ下りて進んでいった。
  "translation_status": "reviewed"

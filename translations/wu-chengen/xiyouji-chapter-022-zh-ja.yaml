- "id": "xy-ch22-004"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們正看碑文，只聽得那浪湧如山，波翻若嶺，河當中滑辣的鑽出一個妖精，十分兇醜："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 126
    "line_end": 126
  "translation_ja": "師弟が碑文を読んでいると、波が山のように湧き、峰のようにうねる音がした。川のただ中から、ざばっと一匹の妖怪が姿を現した。まことに恐ろしく醜い。"
  "translation_status": "reviewed"
- "id": "xy-ch22-005"
  "section_id": "chapter-22"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一頭紅燄髮蓬鬆，兩隻圓睛亮似燈。
    不黑不青藍靛臉，如雷如鼓老龍聲。
    身披一領鵝黃氅，腰束雙攢露白藤。
    項下骷髏懸九個，手持寶杖甚崢嶸。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 127
    "line_end": 130
  "translation_ja": |-
    炎のような赤い髪はぼうぼうに乱れ、丸い二つの目は灯火のように光る。
    黒でも青でもない藍染めのような顔、老竜の声は雷のよう、太鼓のよう。
    身には淡い黄色の羽織をまとい、腰には白い藤を二重に束ねた帯。
    首には髑髏を九つ下げ、手に持つ宝杖はひときわ物々しい。
  "translation_status": "reviewed"
- "id": "xy-ch22-006"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪一個旋風，奔上岸來，徑搶唐僧。慌得行者把師父抱住，急登高岸，回身走脫。那八戒放下擔子，掣出釘鈀；望妖精便築。那怪使寶杖架住。他兩個在流沙河岸，各逞英雄。這一場好鬥："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 132
    "line_end": 132
  "translation_ja": "河の妖怪はつむじ風のように岸へ駆け上がり、まっすぐ三蔵をさらおうとした。悟空は慌てて師匠を抱き、高い岸へ駆け上がって身を返し、逃れた。八戒は荷を下ろし、釘鈀（ていは）を抜いて妖怪へ打ちかかった。妖怪は宝杖で受け止める。流沙河の岸辺で、二人は互いに勇を振るった。激しい戦いである。"
  "translation_status": "reviewed"
- "id": "xy-ch22-007"
  "section_id": "chapter-22"
  "kind": "verse"
  "origin": "source"
  "source_text": "九齒鈀，降妖杖，二人相敵河岸上。這個是總督大天蓬，那個是謫下捲簾將。昔年曾會在靈霄，今日爭持賭猛壯。這一個鈀去探爪龍，那一個杖架磨牙象。伸開大四平，鑽入迎風戧。這個沒頭沒臉抓，那個無亂無空放。一個是久占流沙界吃人精，一個是秉教迦持修行將。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    九歯鈀（きゅうしは）と降妖杖（こうようじょう）、二人は岸で向かい合う。
    こちらは水軍を統べた大天蓬（だいてんぽう）、あちらは天から落とされた捲簾将（けんれんしょう）。
    昔は霊霄（れいしょう）で会った仲、今日は争って勇猛さを競う。
    こちらの熊手は爪を伸ばす竜、あちらの杖は牙を研ぐ象。
    大四平（だいしへい）の構えに大きく開き、迎風戧（げいふうそう）の突きへ潜り込む。
    こちらは頭も顔もかまわず打ち込み、あちらは乱れず、空振りもせずに返す。
    一方は久しく流沙を占める人食いの精、一方は教えと加持を受けて修行する将。

  "source_text": "捲簾將，天蓬帥，各顯神通真可愛。那個降妖寶杖著頭輪，這個九齒釘鈀隨手快。躍浪振山川，推波昏世界。兇如太歲撞幢幡，惡似喪門掀寶蓋。這一個赤心凜凜保唐僧，那一個犯罪滔滔為水怪。鈀抓一下九條痕，杖打之時魂魄敗。努力喜相持，用心要賭賽。算來只為取經人，怒氣沖天不忍耐。攪得那鯁鮊鯉鱖退鮮鱗，龜鱉黿鼉傷嫩蓋；紅蝦紫蟹命皆亡，水府諸神朝上拜。只聽得波翻浪滾似雷轟，日月無光天地怪。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    捲簾将と天蓬帥（てんぽうすい）、それぞれの神通はまことに見事。
    あちらは降妖の宝杖を頭上へ振り、こちらは九歯釘鈀（きゅうしていは）を手早くさばく。
    波を跳ねれば山河が震え、水を押せば世界は暗くなる。
    凶猛さは幟を突き倒す太歳（たいさい）のよう、荒々しさは宝の天蓋をひっくり返す喪門（そうもん）のよう。
    こちらはまっすぐな忠義の心で三蔵を守り、あちらは罪を重ねて水の妖怪となった。
    熊手が一度かけば九筋の傷、杖が打てば魂も砕ける。
    力を尽くして喜々と組み合い、心を込めて腕を競う。
    思えばみな取経の人のため、怒りが天を突き、抑えられない。
    かき乱されて鯁（こう）・鮊（はく）・鯉・鱖（けい）は鮮やかな鱗を失い、亀・鱉（べつ）・黿（げん）・鼉（だ）は柔らかな甲を傷つける。
    赤い海老、紫の蟹はみな命を失い、水府の神々は天へ向かって拝む。
    波のうねりは雷鳴のよう、日月に光なく、天地は異様な姿となる。

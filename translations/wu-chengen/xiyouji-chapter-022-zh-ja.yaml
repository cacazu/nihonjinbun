    "description_ja": "「鯁鮊鯉鱖」「龜鱉黿鼉」は全種類を保持した。鯁など厳密な生物学的同定ができないものは原字を残し、注で留保した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "segment_ids":

    "description_ja": "「金趁心」は金の芯、「珠絲玠」は真珠の糸と玉の飾りと解したが、趁・玠を含む武器装飾の細部には留保がある。梭羅を娑羅・桂へ無断変更しない。杖を後世の月牙鏟の形へ置き換えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch22-7910914"

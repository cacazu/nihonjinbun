- "id": "xy-ch22-032"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那怪懼怕猴王，回於水底，正在窩中歇息，只聽得叫他法名。情知是觀音菩薩；又聞得說「取經人在此」：他也不懼斧鉞，急翻波伸出頭來，又認得是木叉一作「吒」行者。你看他笑盈盈，上前作禮道：「尊者失迎。菩薩今在何處？」木叉一作「吒」道：「我師未來，先差我來吩咐你早跟唐僧做個徒弟。叫把你項下掛的骷髏與這個葫蘆，按九宮結做一隻法船，渡他過此弱水。」悟淨道：「取經人卻在那裡？」木叉一作「吒」用手指道：「那東岸上坐的不是？」悟淨看見了八戒道：「他不知是那裡來的個潑物，與我整鬥了這兩日，何曾言著一個取經的字兒？」又看見行者，道：「這個主子，是他的幫手，好不利害，我不去了。」木叉一作「吒」道：「那是豬八戒，這是孫行者，俱是唐僧的徒弟，俱是菩薩勸化的，怕他怎的？我且和你見唐僧去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 209
    "line_end": 209
  "translation_ja": |-
    河の妖怪は悟空を恐れて水底へ戻り、巣で休んでいたが、自分の法名を呼ぶ声を聞いた。観音菩薩に違いないと思い、さらに取経の方がいると聞くと、どんな危険も恐れず、急いで波を分けて頭を出した。すると、それが恵岸行者だと分かった。満面の笑みで進み出て礼をした。河の妖怪「尊者、お迎えもせず失礼いたしました。菩薩は今どちらに。」
    恵岸行者「師匠はおいでではない。先に私を遣わし、早く唐僧に従って弟子となれとのお言いつけだ。首に掛けた髑髏とこの瓢箪を九宮の形につなぎ、法の船を作って、この弱水を渡してさしあげなさい。」
    名を呼ばれて現れた悟浄が尋ねた。悟浄「取経の方はどちらにおいでです。」
    恵岸行者は手で指した。恵岸行者「あの東岸に座っておられるではないか。」
    悟浄は八戒を見ると言った。悟浄「あいつはどこから来たろくでなしなのか、丸二日も俺と戦いながら、取経のひと言も口にしませんでした。」
    さらに悟空を見た。悟浄「あの親玉は、あいつの加勢です。恐ろしく強い。俺は行きません。」
    恵岸行者「あれは猪八戒、こちらは孫行者。どちらも唐僧の弟子で、菩薩の教えを受けている。何を恐れることがある。私も一緒に唐僧に会いに行こう。」
  "translation_status": "reviewed"
- "id": "xy-ch22-033"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那悟淨才收了寶杖，整一整黃錦直裰，跳上岸來，對唐僧雙膝跪下道：「師父，弟子有眼無珠，不認得師父的尊容，多有衝撞，萬望恕罪。」八戒道：「你這膿包，怎的早不皈依，只管要與我打？是何說話？」行者笑道：「兄弟，你莫怪他，還是我們不曾說出取經的事情與姓名耳。」長老道：「你果肯誠心皈依吾教麼？」悟淨道：「弟子向蒙菩薩教化，指沙為姓，與我起個法名，喚做沙悟淨，豈有不從師父之理？」三藏道：「既如此，」叫：「悟空，取戒刀來，與他落了髮。」大聖依言，即將戒刀與他剃了頭。又來拜了三藏，拜了行者與八戒，分了大小。三藏見他行禮真像個和尚家風，故又叫他做沙和尚。木叉一作「吒」道：「既秉了迦持，不必絮煩，早與作法船去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 210
    "line_end": 210
  "translation_ja": |-
    そこで悟浄は宝杖を収め、黄錦の直裰を整えて岸へ跳び上がった。三蔵の前に両膝をつき、申し上げた。悟浄「お師匠さま、弟子は目がありながら何も見えず、お師匠さまのお顔が分からずに、大変な無礼を働きました。どうかお許しください。」
    八戒「この役立たず、なぜもっと早く帰依せず、俺と戦ってばかりいたんだ。どういうわけだ。」
    悟空は笑った。悟空「兄弟、責めるな。俺たちが取経のことも名前も言わなかったのが悪いんだ。」
    三蔵「本心から、私たちの教えに帰依するのかね。」
    悟浄「弟子は以前、菩薩のお導きを受けました。菩薩は砂を指して姓を沙（さ）とし、沙悟浄（さごじょう）という法名を授けてくださいました。お師匠さまに従わぬ道理がございましょうか。」
    三蔵「それならよい。」
    三蔵は命じた。三蔵「悟空、戒刀（かいとう）を持ってきて、髪を剃ってやりなさい。」
    悟空は言われたとおり戒刀を取り、沙悟浄の頭を剃った。沙悟浄は改めて三蔵を拝み、悟空と八戒にも礼をして、兄弟弟子の順を定めた。三蔵は礼の様子がいかにも僧らしいのを見て、さらに「沙和尚（さおしょう）」とも呼ぶことにした。
    恵岸行者「教えと加持を受けたのだから、もう長話はよい。早く法の船を作ってきなさい。」
  "translation_status": "reviewed"
- "id": "xy-ch22-034"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那悟淨不敢怠慢，即將頸項下掛的骷髏取下，用索子結作九宮，把菩薩葫蘆安在當中，請師父下岸。那長老遂登法船，坐於上面，果然穩似輕舟。左有八戒扶持，右有悟淨捧托；孫行者在後面牽了龍馬，半雲半霧相跟；頭直上又有木叉一作「吒」擁護。那師父才飄然穩渡流沙河界，浪靜風平過弱河。真個也如飛似箭，不多時，身登彼岸，得脫洪波；又不拖泥帶水，幸喜腳乾手燥，清淨無為，師徒們腳踏實地。那木叉一作「吒」按祥雲，收了葫蘆。又只見那骷髏一時解化作九股陰風，寂然不見。三藏拜謝了木叉一作「吒」，頂禮了菩薩。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 211
    "line_end": 211
  "translation_ja": |-
    沙悟浄はぐずぐずせず、首から髑髏を外し、縄で九宮の形につなぎ、中央へ菩薩の瓢箪を据えた。それから師匠に岸を下りるよう願った。三蔵が法の船へ乗って座ると、本当に軽い小舟のように安定していた。左では八戒が支え、右では沙悟浄が持ち上げる。後ろでは悟空が竜馬を引き、半ば雲、半ば霧の中を従い、真上には恵岸行者がいて守った。
    こうして三蔵は、風も波も穏やかな中をゆったり無事に流沙河を渡った。実際の速さは飛ぶよう、矢のようで、ほどなく向こう岸へ上がり、大波を脱した。泥も水も引きずらず、ありがたいことに手も足も乾いたまま、清らかで何のわずらいもなく、師弟はしっかり地面を踏んだ。
    恵岸行者はめでたい雲を下ろして瓢箪を収めた。すると髑髏はたちまち解け、九筋の陰の風となって音もなく消えた。三蔵は恵岸行者に礼を述べ、菩薩へも拝礼した。まさに、
  "translation_status": "reviewed"
- "id": "xy-ch22-035"
  "section_id": "chapter-22"
  "kind": "verse"
  "origin": "source"
  "source_text": "木叉一作「吒」徑回東洋海，三藏上馬卻投西。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 213
    "line_end": 213
  "translation_ja": "恵岸行者はまっすぐ東洋の海へ帰り、三蔵は馬に乗って西へ向かう。"
  "translation_status": "reviewed"
  "issues":

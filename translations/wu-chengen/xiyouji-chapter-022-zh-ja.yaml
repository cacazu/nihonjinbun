    "status": "open"
    "message_ja": "結びの「東洋海」はここでは東方の海として訳した。此前の南海への帰還と方位を独自に統一しない。木叉の異文注は読者注へまとめた。"
- "id": "xy-ch22-036"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知幾時才得正果求經，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 215
    "line_end": 215
  "translation_ja": "さて、いつになれば悟りの果を得て、経を求める旅を果たせるのか。続きは次回のお話をお聞きいただきたい。"

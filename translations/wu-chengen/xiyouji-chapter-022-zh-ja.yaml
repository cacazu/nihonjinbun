  "source_text": "卻說那怪敗了陣回，方才喘定，又聽得有人推得水響。忽起身觀看，原來是八戒執了鈀推水。那怪舉杖當面高呼道：「那和尚，那裡走？仔細看打。」八戒使鈀架住道：「你是個甚麼妖精，敢在此間擋路？」那妖道：「你是也不認得我。我不是那妖魔鬼怪，也不是少姓無名。」八戒道：「你既不是妖魔鬼怪，卻怎生在此傷生？你端的甚麼姓名，實實說來，我饒你性命。」那怪道：「我："
  "source_languages":

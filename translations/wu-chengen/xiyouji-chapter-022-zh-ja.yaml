  "translation_ja": |-
    宝杖はもともと名高く、月の梭羅（さら）の木から出たもの。
    呉剛（ごごう）がその枝を一本切り、魯班（ろはん）が見事な技で仕上げた。
    内には黄金の芯が一本通り、外には真珠の糸と玉の飾りが幾筋もある。
    宝杖の名はよく妖を降し、霊霄を永く鎮めて怪を伏せる。
    俺が大将軍に任じられたので、玉皇が身につけるよう授けられた。
    長くも短くも思いのまま、細くも太くも心のまま。
    蟠桃の宴で天子を護衛し、天界で朝廷にも侍った。
    殿を守れば聖者たちの参内に会い、簾を巻けば仙人たちの拝礼を見た。
    霊性を養った神の武器で、下界のありふれた道具ではない。
    天門（てんもん）の下へ落とされてからは、思うままに縦横に海の外を巡った。
    大それた自慢をするつもりはないが、天下の槍も刀も比べものにならぬ。
    お前の錆びた熊手を見ろ、田を耕し、菜畑をかくのがせいぜいだ。」

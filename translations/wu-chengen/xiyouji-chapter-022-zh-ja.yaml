  "source_text": |-
    寶杖原來名譽大，本是月裡梭羅派。
    吳剛伐下一枝來，魯班製造工夫蓋。
    裡邊一條金趁心，外邊萬道珠絲玠。
    名稱寶杖善降妖，永鎮靈霄能伏怪。
    只因官拜大將軍，玉皇賜我隨身帶。
    或長或短任吾心，要細要粗憑意態。
    也曾護駕宴蟠桃，也曾隨朝居上界。
    值殿曾經眾聖參，捲簾曾見諸仙拜。
    養成靈性一神兵，不是人間凡器械。
    自從遭貶下天門，任意縱橫遊海外。
    不當大膽自稱誇，天下槍刀難比賽。
    看你那個鏽釘鈀，只好鋤田與築菜。」
  "source_languages":
  - "zh-Hant"
  "source_locations":

  "source_text": "八戒聞言大怒，罵道：「你這潑物！全沒一些兒眼色。我老豬還掐出水沫兒來哩，你怎敢說我粗糙，要剁鮓醬？看起來，你把我認做個老走硝哩。休得無禮，吃你祖宗這一鈀。」那怪見鈀來，使一個「鳳點頭」躲過。兩個在水中打出水面，各人踏浪登波。這一場賭鬥，比前不同，你看那："

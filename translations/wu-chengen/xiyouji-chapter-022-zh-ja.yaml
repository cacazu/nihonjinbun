  "translation_ja": |-
    悟空はすぐに雲へ跳び乗り、まっすぐ北の人家で鉢一杯の精進の飯をもらって戻り、師匠へ差し出した。三蔵はあまりに早く戻ったのを見て呼びかけた。三蔵「悟空、その家へ私たちも行き、川を渡る手立てを尋ねたほうが、妖怪と争うよりよいのではないか。」
    悟空は笑った。悟空「あの家はたいそう遠く、五千里から七千里も離れております。ここの水のことなど、知っているはずがありません。尋ねても役には立ちません。」
    八戒「兄貴、また嘘をついているな。五千里も七千里もある道を、どうしてこんなに早く往復できるんだ。」
    悟空「お前は知らんだろうが、俺の觔斗雲（きんとうん）はひと跳びで十万八千里だ。五千里や七千里なら、頭を二度うなずかせ、腰を一度かがめれば往復できる。何が難しい。」
    八戒「兄貴、そんなに簡単なら、師匠を背負って、うなずいて腰をかがめ、向こうへ跳べばいいじゃないか。なぜあんな妖怪と苦労して戦うんだ。」
    悟空「お前だって雲に乗れるだろう。師匠を背負って渡ったらどうだ。」
    八戒「師匠の生身の骨肉は泰山（たいざん）のように重い。俺の雲でどうして支えきれる。お前の觔斗雲でなくては無理だ。」
    悟空「俺の觔斗雲だって、結局は雲に乗る術で、進む距離に違いがあるだけだ。お前に担げないものを、なぜ俺なら担げるんだ。昔から『泰山を動かすのは芥子粒ほども軽いが、凡夫を連れて俗塵を離れるのは難しい』という。凶暴な妖怪どもが取り込む術や風を使って人をさらうのも、引っ張って地面に沿って進むだけで、人を連れて空へは上がれない。ああいう術なら俺にも使えるし、姿を隠す術も、地を縮める術も、何だって知っている。ただ師匠は異国をくまなく歩まねばならず、苦の海をひと息に抜け出すわけにはいかないから、一歩進むのも難しいんだ。俺とお前にできるのは、付き添って身と命を守ることだけだ。苦労を肩代わりもできなければ、代わりに経をもらって来ることもできない。たとえ先に仏に会いに行けたとしても、仏はこちらへ気軽に経を渡してはくださらない。まさに『たやすく手に入れば、ありふれたものと見てしまう』ということだ。」
    八戒は聞き終えると、はいはいと教えを受け入れた。三人はおかずのない精進の飯を少し食べ、流沙河の東岸の崖下で休んだ。

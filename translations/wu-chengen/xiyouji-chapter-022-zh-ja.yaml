  "translation_ja": |-
    幼いころから精気が盛んで、天地万里を歩き回った。
    天下に英雄の威名を現し、豪傑たちの手本となった。
    万国九州を思うままに行き、五湖四海を自在に巡った。
    道を学ぼうと天の涯までさまよい、師を求めて広い大地を旅した。
    年じゅう衣と鉢を身から離さず、日ごとに心と精神を緩めなかった。
    あちこちを数十度も雲遊し、百たびあまり自由に歩いた。
    その末にようやく真人に会い、金色に輝く大道を開かれた。
    まず嬰児（えいじ）と姹女（たじょ）を収め、次に木母（もくぼ）と金公（きんこう）を放った。
    明堂（めいどう）の腎水（じんすい）を華池（かち）へ入れ、重楼（じゅうろう）の肝火（かんか）を心臓へ投じた。
    三千の功を満たして天顔を拝み、ひたすら明華（めいか）へ向かって朝礼した。
    玉皇大帝（ぎょくこうたいてい）は俺を取り立て、みずから捲簾将と任じられた。
    南天門（なんてんもん）の内では尊ばれ、霊霄殿（れいしょうでん）の前では上席を占めた。
    腰には虎頭牌（ことうはい）を下げ、手には降妖杖をしっかり握った。
    頭上の金の兜は日に輝き、身の鎧は明るい霞のようだった。
    行幸の警護には俺が先に立ち、出入りして朝廷に侍るにも上位にいた。
    ところが王母（おうぼ）が蟠桃（ばんとう）を下さり、瑤池（ようち）に宴を設けて諸将を招いたとき、
    誤って玉玻璃（ぎょくはり）の器を打ち壊し、神々はみな魂も飛ぶほど驚いた。
    玉皇（ぎょくこう）はたちまちお怒りになり、朝廷を掌る左輔相（さほしょう）に命じられた。
    冠を外し、鎧を脱がせ、官職を奪い、俺を処刑場へ押し出せ、と。
    幸い赤脚大天仙（せききゃくだいてんせん）が列を越えて奏上し、俺を助けてくださった。
    死を免れて命を得、死刑は執行されず、流沙河の東岸へ落とされた。
    満腹ならこの山で眠り、腹が減れば波を返して食い物を探す。
    木こりは俺に会えば命がなく、漁師も俺を見れば身を失う。
    行き来する人を大勢食らい、繰り返し命を奪って禍をなした。
    よくも俺の門まで暴れに来たな、今日は腹に物が入る見込みがついた。
    肉が粗くて食えぬとは言うまい、捕らえてじっくり肉醤に刻んでやる。」

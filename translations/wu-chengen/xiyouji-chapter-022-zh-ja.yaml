    八戒は聞くなり激怒し、罵った。八戒「このろくでなしめ、まるで見る目がないな。この俺はつまめば水が出るほどみずみずしいんだぞ。それを肉が粗いの、肉醤に刻むのと、よくも言えたな。俺を硝の効き目が抜けて皮も肉も硬くなった、古い塩漬け豚肉とでも思ったか。無礼はやめろ。お前のご先祖さまの熊手を受けてみろ。」
    妖怪は熊手が来ると、「鳳点頭（ほうてんとう）」の身のこなしでかわした。二人は水中で戦いながら水面へ出て、それぞれ波を踏み、うねりに乗った。この勝負は前とはまた違う。見よ、

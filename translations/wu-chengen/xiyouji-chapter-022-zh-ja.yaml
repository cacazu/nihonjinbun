- "id": "xy-ch22-016"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那大聖保著唐僧，立於左右，眼巴巴的望著他兩個在水上爭持，只是他不好動手。只見那八戒虛幌一鈀，佯輸詐敗，轉回頭往東岸上走。那怪隨後趕來，將近到了岸邊。這行者忍耐不住，撇了師父，掣鐵棒，跳到河邊，望妖精劈頭就打。那妖物不敢相迎，颼的又鑽入河內。八戒嚷道：「你這弼馬溫，徹是個急猴子！你再緩緩些兒，等我哄他到了高處，你卻阻住河邊，教他不能回首啊，卻不拿住他也？他這進去，幾時又肯出來？」行者笑道：「獃子，莫嚷，莫嚷。我們且回去見師父去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

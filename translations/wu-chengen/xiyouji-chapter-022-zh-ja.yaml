  "origin": "source"
  "source_text": "行者急縱雲跳起去，正到直北下人家化了一缽素齋，回獻師父。師父見他來得甚快，便叫：「悟空，我們去化齋的人家，求問他一個過河之策，不強似與這怪爭持？」行者笑道：「這家子遠得狠哩，相去有五七千里之路，他那裡得知水性？問他何益？」八戒道：「哥哥又來扯謊了，五七千里路，你怎麼這等去來得快？」行者道：「你那裡曉得，老孫的觔斗雲，一縱有十萬八千里。像這五七千路，只消把頭點上兩點，把腰躬上一躬，就是個往回，有何難哉？」八戒道：「哥啊，既是這般容易，你把師父背著，只消點點頭，躬躬腰，跳過去罷了，何必苦苦的與這怪廝戰？」行者道：「你不會駕雲？你把師父馱過去不是？」八戒道：「師父的凡胎肉骨，重似泰山，我這駕雲的，怎稱得起？須是你的觔斗方可。」行者道：「我的觔斗，好道也是駕雲，只是去的有遠近些兒。你是馱不動，我卻如何馱得動？自古道：『遣泰山輕如芥子，攜凡夫難脫紅塵。』像這潑魔毒怪，使攝法，弄風頭，卻是扯扯拉拉，就地而行，不能帶得空中而去。像那樣法兒，老孫也會使會弄。還有那隱身法、縮地法，老孫件件皆知。但只是師父要窮歷異邦，不能夠超脫苦海，所以寸步難行也。我和你只做得個擁護，保得他身在命在，替不得這些苦惱，也取不得經來；就是有能先去見了佛，那佛也不肯把經善與你我。正叫做『若將容易得，便作等閑看』。」那獃子聞言，喏喏聽受。遂吃了些無菜的素食，師徒們歇在流沙河東崖次之下。"

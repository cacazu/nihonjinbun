  "translation_ja": |-
    さて、河の妖怪は敗れて戻り、ようやく息を整えたところで、誰かが水を押し分ける音を聞いた。急いで起きて見ると、八戒が熊手を手に、水を分けて来る。妖怪は杖を挙げ、正面から大声で叫んだ。河の妖怪「坊主、どこへ行く。打たれぬよう用心しろ。」
    八戒は熊手で受けた。八戒「お前は何の妖怪だ。ここで道をふさぐとは。」
    河の妖怪「やはり俺が分からぬらしいな。俺はそこらの妖魔鬼怪ではないし、名も姓もない者でもない。」
    八戒「妖魔鬼怪でないなら、なぜここで生き物を殺す。どんな姓で何という名なのか、正直に言え。そうすれば命は助けてやる。」

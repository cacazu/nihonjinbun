  "source_text": |-
    自小生來神氣壯，乾坤萬里曾遊蕩。
    英雄天下顯威名，豪傑人家做模樣。
    萬國九州任我行，五湖四海從吾撞。
    皆因學道蕩天涯，只為尋師遊地曠。
    常年衣缽謹隨身，每日心神不可放。
    沿地雲遊數十遭，到處閑行百餘趟。
    因此才得遇真人，引開大道金光亮。
    先將嬰兒姹女收，後把木母金公放。
    明堂腎水入華池，重樓肝火投心臟。
    三千功滿拜天顏，志心朝禮明華向。
    玉皇大帝便加陞，親口封為捲簾將。
    南天門裡我為尊，靈霄殿前吾稱上。
    腰間懸掛虎頭牌，手中執定降妖杖。
    頭頂金盔晃日光，身披鎧甲明霞亮。
    往來護駕我當先，出入隨朝予在上。
    只因王母降蟠桃，設宴瑤池邀眾將。
    失手打破玉玻璃，天神個個魂飛喪。
    玉皇即便怒生嗔，卻令掌朝左輔相：
    卸冠脫甲摘官銜，將身推在殺場上。
    多虧赤腳大天仙，越班啟奏將吾放。
    饒死回生不點刑，遭貶流沙東岸上。
    飽時困臥此山中，餓去翻波尋食餉。
    樵子逢吾命不存，漁翁見我身皆喪。
    來來往往吃人多，翻翻覆覆傷生瘴。
    你敢行兇到我門，今日肚皮有所望。
    莫言粗糙不堪嘗，拿住消停剁鮓醬。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"

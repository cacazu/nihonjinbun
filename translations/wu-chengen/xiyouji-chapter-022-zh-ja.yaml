  "translation_ja": |-
    悟空は三蔵のそばに立って守りながら、二人が水上で争うのをじっと見つめていた。今は手を出すわけにはいかない。すると八戒が熊手を空振りし、負けたふりで東岸へ走った。妖怪はあとを追い、もう少しで岸へ着くところまで来た。
    悟空は辛抱できず、師匠のそばを離れて鉄棒を抜き、川べりへ跳んで妖怪の頭へ打ち下ろした。妖怪は受けて立とうともせず、さっとまた河へ潜った。
    八戒は怒鳴った。八戒「この弼馬温（ひつばおん）、本当にせっかちな猿だな。もう少し待って、俺が高い所までおびき出したら、お前が川べりをふさいで戻れなくすれば、捕らえられたじゃないか。また潜っちまって、今度はいつ出てくると思うんだ。」
    悟空は笑った。悟空「間抜け、騒ぐな、騒ぐな。まず師匠のところへ戻ろう。」
  "translation_status": "reviewed"
- "id": "xy-ch22-017"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒卻同行者到高岸上，見了三藏。三藏欠身道：「徒弟辛苦呀。」八戒道：「且不說辛苦，只是降了妖精，送得你過河，方是萬全之策。」三藏道：「你才與妖精交戰何如？」八戒道：「那妖的手段，與老豬是個對手。正戰處，使一個詐敗，他才趕到岸上。見師兄舉著棍子，他就跑了。」三藏道：「如此怎生奈何？」行者道：「師父放心，且莫焦惱。如今天色又晚，且坐在這崖岸之上，待老孫去化些齋飯來，你吃了睡去，待明日再處。」八戒道：「說得是，你快去快來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    八戒は悟空と高い岸へ戻り、三蔵に会った。三蔵は身を起こした。三蔵「お前たち、骨を折ってくれたね。」
    八戒「苦労はかまいませんが、妖怪を降してお師匠さまを渡らせてこそ、万全というものです。」
    三蔵「さきほど戦ってみて、どうだったかね。」
    八戒「あの妖怪の腕は、この俺と互角です。戦う途中で負けたふりをすると、岸まで追ってきましたが、兄貴が棒を振り上げたのを見て逃げてしまいました。」
    三蔵「それでは、どうすればよいのだろう。」
    悟空「お師匠さま、ご安心ください。お心を乱されませんように。もう日も暮れますから、この岸に座っていてください。私が食事を托鉢して参ります。召し上がってお休みになり、明日また考えましょう。」
    八戒「それがいい。早く行って、早く戻ってくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch22-018"

    "description_ja": "「老走硝」は硝の効き目が抜けて皮肉が再び硬くなった塩漬け豚肉にたとえた、老いて肌の粗い者への呼称。教育部重編國語辭典（教育百科掲載）を照合して訳した。 本文の欠落ではなく解釈・校訂上の留保。"

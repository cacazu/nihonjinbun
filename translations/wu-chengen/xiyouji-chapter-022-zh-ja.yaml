  "kind": "verse"
  "origin": "source"
  "source_text": "寶杖掄，釘鈀築，言語不通非眷屬。只因木母剋刀圭，致令兩下相戰觸。沒輸贏，無反覆，翻波淘浪不和睦。這個怒氣怎含容，那個傷心難忍辱。鈀來杖架逞英雄，水滾流沙能惡毒。氣昂昂，勞碌碌，多因三藏朝西域。釘鈀老大兇，寶杖十分熟。這個揪住要往岸上拖，那個抓來就將水裡沃。聲如霹靂動魚龍，雲暗天昏神鬼伏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    宝杖を振り、釘鈀を打ち込む。言葉も通じず、身内でもない。
    木母が刀圭（とうけい）を剋すゆえに、双方はぶつかり戦う。
    勝ち負けもなく、成り行きも変わらず、波をひっくり返して和解しない。
    こちらの怒りをどう抑えよう、あちらも心を傷つけられ辱めに耐えられない。
    熊手が来れば杖で受け、勇を競い、流沙の水は激しく渦を巻く。
    気は高ぶり、力を使い果たすのも、三蔵が西域（さいいき）へ赴くゆえ。
    熊手はすこぶる凶猛、宝杖の使い方も十分に熟している。
    こちらはつかんで岸へ引きずろうとし、あちらはつかんで水へ浸けようとする。
    声は霹靂のように魚や竜を震わせ、雲は暗く天も曇り、神も鬼も身を伏せる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「木母剋刀圭」は五行の木剋土の寓意と解し、象徴語を残した。各語の内丹論上の詳しい対応には解釈の幅がある。"
- "id": "xy-ch22-024"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一場，來來往往，鬥經三十回合，不見強弱。八戒又使個佯輸計，拖了鈀走。那怪隨後又趕來，擁波捉浪，趕至崖邊。八戒罵道：「我把你這個潑怪，你上來，這高處，腳踏實地好打。」那妖罵道：「你這廝哄我上去，又教那幫手來哩。你下來，還在水裡相鬥。」原來那妖乖了，再不肯上岸，只在河沿與八戒鬧吵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 195
    "line_end": 195
  "translation_ja": |-
    この戦いも、進んでは退きつつ三十合に及んだが、強弱は見えない。八戒は再び負けたふりをし、熊手を引きずって逃げた。妖怪も波を押し分けて追い、崖のそばまで来た。
    八戒は罵った。八戒「このろくでなしの妖怪め、上がってこい。高い所で地に足をつけて戦おう。」
    河の妖怪も罵り返した。河の妖怪「俺をだまして上がらせ、またあの加勢を呼ぶつもりだな。お前が下りてこい。水の中で戦うのだ。」
    妖怪も知恵をつけ、二度と岸へ上がろうとせず、水際で八戒と言い争うばかりだった。
  "translation_status": "reviewed"
- "id": "xy-ch22-025"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者見他不肯上岸，急得他心焦性爆，恨不得一把捉來。行者道：「師父，你自坐下，等我與他個『餓鷹叼食』。」就縱觔斗，跳在半空，刷的落下來，要抓那妖。那妖正與八戒嚷鬧，忽聽得風響，急回頭，見是行者落下雲來，卻又收了那杖，一頭淬下水，隱跡潛蹤，渺然不見。行者佇立岸上，對八戒說：「兄弟呀，這妖也弄得滑了，他再不肯上岸，如之奈何？」八戒道：「難，難，難，戰不勝他。就把吃奶的氣力也使盡了，只繃得個手平。」行者道：「且見師父去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 196
    "line_end": 196
  "translation_ja": |-
    悟空は妖怪が上陸しないのを見ると、じりじりして気がはやり、ひとつかみにしたくてたまらなくなった。悟空「お師匠さま、そこに座っていてください。あいつに『飢えた鷹が獲物をさらう』技をお見舞いします。」
    觔斗で空へ跳び、さっと舞い下りて妖怪をつかもうとした。妖怪は八戒と言い争っていたが、風を切る音を聞いて急いで振り向き、悟空が雲から下りてくるのを見ると、杖を収め、頭から水へ飛び込んだ。姿も跡も隠れて、すっかり見えなくなった。
    悟空は岸に立ち、八戒に言った。悟空「兄弟、こいつもすばしこくなったな。もう岸へは上がらない。どうしたものか。」
    八戒「難しい、難しい、難しい。戦っても勝てない。乳を吸う力まで出し尽くして、ようやく互角を保てるだけだ。」
    悟空「まず師匠に会おう。」
  "translation_status": "reviewed"
- "id": "xy-ch22-026"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人又到高岸，見了唐僧，備言難捉。那長老滿眼下淚道：「似此艱難，怎生得渡？」行者道：「師父莫要煩惱。這怪深潛水底，其實難行。──八戒，你只在此保守師父，再莫與他廝斗，等老孫往南海走走去來。」八戒道：「哥哥，你去南海何幹？」行者道：「這取經的勾當，原是觀音菩薩；及脫解我等，也是觀音菩薩。今日路阻流沙河，不能前進，不得他，怎生處治？等我去請他，還強如和這妖精相鬥。」八戒道：「也是，也是。師兄，你去時，千萬與我上覆一聲：向日多承指教。」三藏道：「悟空，若是去請菩薩，卻也不必遲疑，快去快來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 198
    "line_end": 198
  "translation_ja": |-
    二人はまた高い岸へ戻って三蔵に会い、捕らえがたい事情を詳しく話した。三蔵は目いっぱい涙をためた。三蔵「こんなに難しいのでは、どうして渡れよう。」
    悟空「お師匠さま、悩まないでください。妖怪が深い水底へ潜ってしまうので、確かに手が出しにくいのです。八戒、お前はここで師匠を守り、もうあいつとは戦うな。俺は南海（なんかい）へひと走りしてくる。」
    八戒「兄貴、南海へ何をしに行くんだ。」
    悟空「経を取りに行くこの一件は、もともと観音菩薩（かんのんぼさつ）のお導きだ。俺たちを救い出してくださったのも菩薩だろう。今、流沙河に道を阻まれ、先へ進めないのだから、あの方なしでどう始末がつく。お願いに行くほうが、妖怪と戦うよりましだ。」
    八戒「そうだ、それがいい。兄貴、行くなら俺からも、先日は教えをいただきありがとうございましたと、必ずお伝えしてくれ。」
    三蔵「悟空、菩薩をお迎えに行くなら、ためらうことはない。早く行って戻っておくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch22-027"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者即縱觔斗雲，徑上南海。咦！那消半個時辰，早望見普陀山境。須臾間，墜下觔斗，到紫竹林外，又只見那二十四路諸天上前迎著道：「大聖何來？」行者道：「我師有難，特來謁見菩薩。」諸天道：「請坐，容報。」那輪日的諸天徑至潮音洞口報道：「孫悟空有事朝見。」菩薩正與捧珠龍女在寶蓮池畔扶欄看花，聞報，即轉雲巖，開門喚入。大聖端肅皈依參拜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 199
    "line_end": 199
  "translation_ja": |-
    悟空は觔斗雲に飛び乗り、まっすぐ南海へ向かった。何と、半時辰もかからぬうちに、もう普陀山（ふださん）のあたりが見えた。ほどなく雲を下りて紫竹林（しちくりん）の外へ着くと、二十四路諸天（にじゅうしろしょてん）が進み出て迎えた。二十四路諸天「大聖、どうなさいました。」
    悟空「師匠が難に遭ったので、菩薩にお目にかかりに来た。」
    二十四路諸天「お座りになってください。お取り次ぎいたします。」
    当番の諸天が潮音洞（ちょうおんどう）の入り口へ行き、報告した。当番の諸天「孫悟空（そんごくう）が、ご用があって拝謁を願っております。」
    観音菩薩は宝珠を捧げる竜女と宝蓮池（ほうれんち）のほとりで、欄干にもたれて花を眺めていた。報告を聞くと雲巌（うんがん）へ戻り、門を開いて悟空を招き入れた。悟空は姿勢を正し、うやうやしく帰依の礼をした。
  "translation_status": "reviewed"
- "id": "xy-ch22-028"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩問曰：「你怎麼不保唐僧，為甚事又來見我？」行者啟上道：「菩薩，我師父前在高老莊，又收了一個徒弟，喚名豬八戒，多蒙菩薩又賜法諱悟能。才行過黃風嶺，今至八百里流沙河，乃是弱水三千，師父已是難渡；河中又有個妖怪，武藝高強，甚虧了悟能與他水面上大戰三次，只是不能取勝，被他攔阻，不能渡河。因此，特告菩薩，望垂憐憫，濟渡他一濟渡。」菩薩道：「你這猴子，又逞自滿，不肯說出保唐僧的話來麼？」行者道：「我們只是要拿住他，教他送我師父渡河。水裡事，我又弄不得精細。只是悟能尋著他窩巢，與他打話，想是不曾說出取經的勾當。」菩薩道：「那流沙河的妖怪，乃是捲簾大將臨凡，也是我勸化的善信，教他保護取經之輩。你若肯說出是東土取經人時，他決不與你爭持，斷然歸順矣。」行者道：「那怪如今怯戰，不肯上崖，只在水裡潛蹤，如何得他歸順？我師如何得渡弱水？」菩薩即喚惠岸，袖中取出一個紅葫蘆兒，吩咐道：「你可將此葫蘆，同孫悟空到流沙河水面上，只叫『悟淨』，他就出來了。先要引他歸依了唐僧。然後把他那九個骷髏穿在一處，按九宮佈列，卻把這葫蘆安在當中，就是法船一隻，能渡唐僧過流沙河界。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 200
    "line_end": 200
  "translation_ja": |-
    観音菩薩「なぜ唐僧を守っておらぬ。今度は何の用で私に会いに来たのか。」
    悟空は申し上げた。悟空「菩薩、師匠は先ごろ高老荘（こうろうそう）で、もう一人弟子をお取りになりました。猪八戒（ちょはっかい）と申します。菩薩からは悟能（ごのう）という法名も賜っております。黄風嶺を越え、今は八百里の流沙河へ来ましたが、弱水の深さは三千、師匠にはもとより渡れません。しかも河には武芸に秀でた妖怪がおり、悟能が水面で三度も大いに戦ってくれたのですが、勝てずに行く手を阻まれております。それで特にお知らせに参りました。どうかお憐れみを垂れ、お渡しください。」
    観音菩薩「この猿め、また力を誇って、唐僧を守っていることを言わなかったのだな。」
    悟空「ただあいつを捕らえて師匠を渡らせようとしておりました。私は水の中ではうまく立ち回れませんので、悟能だけが巣へ入り、話をしたのです。おそらく取経のことは言わなかったのでしょう。」
    観音菩薩「流沙河の妖怪は、下界へ降りた捲簾大将（けんれんたいしょう）で、私が教化した信者でもある。経を取りに行く者を守るよう言い聞かせておいた。東土（とうど）から経を求めて来たと名乗りさえすれば、決して争わず、必ず帰順したはずだ。」
    悟空「今は戦いを恐れて岸へ上がらず、水中に隠れています。どうすれば帰順させられましょう。師匠はどうして弱水を渡ればよいのでしょう。」
    菩薩はすぐに恵岸行者（えがんぎょうじゃ）を呼び、袖から赤い瓢箪を取り出して命じた。観音菩薩「この瓢箪を持って孫悟空と流沙河の水面へ行き、『悟浄（ごじょう）』と呼びなさい。そうすれば出てくる。まず唐僧に帰依するよう導くのだ。そのあと、あの九つの髑髏をつなぎ、九宮（きゅうきゅう）の形に並べ、この瓢箪を中央に置けば、一隻の法の船となる。唐僧を流沙河の向こうへ渡せるだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch22-029"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "惠岸聞言，謹遵師命，與大聖捧葫蘆出了潮音洞，奉法旨辭了紫竹林。有詩為證。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 201
    "line_end": 201
  "translation_ja": "恵岸行者は師の命をうやうやしく受け、瓢箪を捧げて悟空と潮音洞を出た。命令を奉じ、紫竹林をあとにしたのである。これを証す詩がある。"
  "translation_status": "reviewed"
- "id": "xy-ch22-030"
  "section_id": "chapter-22"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    五行匹配合天真，認得從前舊主人。
    煉已立基為妙用，辨明邪正見原因。
    金來歸性還同類，木去求情共復淪。
    二土全功成寂寞，調和水火沒纖塵。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 203
    "line_end": 206
  "translation_ja": |-
    五行（ごぎょう）が配されて天真（てんしん）と合い、以前からの主を認める。
    己を煉り、基を立てて妙用となし、邪正を明らかにして根本を見定める。
    金は性へ帰って同類に戻り、木は情を求めてともに再び沈む。
    二つの土が功を全うして静寂を成し、水火を調えて塵ひとつ残さない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「煉已」は修行の文脈から己を煉ると解したが、原文の已を己へ直さない。「共復淪」は底本に従い再び沈むと訳し、別版の倫等へ直さない。「二土」は内丹寓意の二つの土として保持した。"
- "id": "xy-ch22-031"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個不多時，按落雲頭，早來到流沙河岸。豬八戒認得是木叉一作「吒」行者，引師父上前迎接。那木叉一作「吒」與三藏禮畢，又與八戒相見。八戒道：「向蒙尊者指示，得見菩薩，我老豬果遵法教，今喜拜了沙門。這一向在途中奔碌，未及致謝，恕罪，恕罪。」行者道：「且莫敘闊，我們叫喚那廝去來。」三藏道：「叫誰？」行者道：「老孫見菩薩，備陳前事。菩薩說，這流沙河的妖怪，乃是捲簾大將臨凡，因為在天有罪，墮落此河，忘形作怪。他曾被菩薩勸化，願歸師父往西天去的。但是我們不曾說出取經的事情，故此苦苦爭鬥。菩薩今差木叉一作「吒」將此葫蘆，要與這廝結作法船，渡你過去哩。」三藏聞言，頂禮不盡，對木叉一作「吒」作禮道：「萬望尊者作速一行。」那木叉一作「吒」捧定葫蘆，半雲半霧，徑到了流沙河水面上，厲聲高叫道：「悟淨，悟淨，取經人在此久矣，你怎麼還不歸順？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 208
    "line_end": 208
  "translation_ja": |-
    二人はほどなく雲を下り、流沙河の岸に着いた。八戒は恵岸行者だと分かり、師匠を連れて迎えに進んだ。恵岸行者は三蔵と礼を交わし、八戒にも挨拶した。
    八戒「尊者には以前お導きをいただき、菩薩にお会いできました。この俺も確かに教えに従い、ありがたくも今は仏門に入りました。このところ道中の忙しさで、お礼も申し上げられませんでした。どうかお許しください。」
    悟空「積もる話はあとにして、あいつを呼びに行こう。」
    三蔵「誰を呼ぶのかね。」
    悟空「菩薩にお目にかかり、事情をすべて申し上げたところ、流沙河の妖怪は捲簾大将が下界へ降りた者だと分かりました。天界で罪を犯してこの河へ落ち、身を忘れて妖怪となったのです。以前に菩薩の教えを受け、お師匠さまに従って西天へ行こうと願っていました。ところが私たちが取経のことを言わなかったので、あれほど争ったのです。菩薩は今、この瓢箪を持たせて恵岸行者を遣わされました。あの者とともに法の船を作り、お師匠さまをお渡しするためです。」
    三蔵はこれを聞き、何度も拝礼し、恵岸行者に礼をして願った。三蔵「尊者、どうかお早くお願いいたします。」
    恵岸行者は瓢箪をしっかり持ち、半ば雲、半ば霧の中を流沙河の水面へ進んで、大声で呼んだ。恵岸行者「悟浄、悟浄。取経の方はここに来て久しいのに、なぜまだ帰順しないのだ。」

- "id": "xy-ch22-002"
  "section_id": "chapter-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說唐僧師徒三眾脫難前來，不一日行過了黃風嶺，進西卻是一脈平陽之地。光陰迅速，歷夏經秋，見了些寒蟬鳴敗柳，大火向西流。正行處，只見一道大水狂瀾，渾波湧浪。三藏在馬上忙呼道：「徒弟，你看那前邊水勢寬闊，怎不見船隻行走，我們從那裡過去？」八戒見了道：「果是狂瀾，無舟可渡。」那行者跳在空中，用手搭涼篷而看，他也心驚道：「師父啊，真個是難，真個是難。這條河若論老孫去時，只消把腰兒扭一扭，就過去了；若師父，誠千分難渡，萬載難行。」三藏道：「我這裡一望無邊，端的有多少寬闊？」行者道：「經過有八百里遠近。」八戒道：「哥哥怎的定得個遠近之數？」行者道：「不瞞賢弟說，老孫這雙眼，白日裡常看得千里路上的吉凶。卻才在空中看出，此河上下不知多遠，但只見這經過足有八百里。」長老憂嗟煩惱，兜回馬，忽見岸上有一通石碑。三眾齊來看時，見上有三個篆字，乃「流沙河」；腹上有小小的四行真字云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch22-7910914"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第022回&oldid=7910914"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、三蔵（さんぞう）と二人の弟子は難を逃れて先へ進み、ほどなく黄風嶺（こうふうれい）を越えた。西へ入ると、平らな土地がひと続きに広がっていた。時の流れは速く、夏を過ぎて秋を迎え、衰えた柳には寒蝉が鳴き、大火（たいか）の星が西へ傾くころとなった。
    進んでいくと、大河が荒れ狂い、濁った波が湧き立っていた。三蔵は馬上から急いで呼びかけた。三蔵「お前たち、あの広い水面を見なさい。船が行き来する姿もないが、どこから渡ればよいのだろう。」
    八戒（はっかい）も見て言った。八戒「本当にひどい波だ。渡る船もありません。」
    悟空（ごくう）は空へ跳び上がり、手をかざして見渡したが、彼も驚いた。悟空「お師匠さま、これは難しい、まことに難しい。私が渡るだけなら腰をひとひねりすれば済みますが、お師匠さまには千にも万にも難しい川です。」
    三蔵「ここからでは果てが見えない。いったいどれほどの幅があるのかね。」
    悟空「渡るには八百里ほどあります。」
    八戒「兄貴、どうしてそんな距離が分かるんだ。」
    悟空「兄弟、嘘ではないぞ。この俺の目は、昼間なら千里先の吉凶を見通せる。さっき空から見たところ、上流と下流がどれほど続くかは分からなかったが、向こう岸までならゆうに八百里ある。」
    三蔵は嘆き悩み、馬の向きを変えた。すると岸に一基の石碑が目についた。三人そろって近づくと、「流沙河（りゅうさが）」の三文字が篆書で刻まれ、その下には小さな楷書で四行、こう記されていた。
  "translation_status": "reviewed"

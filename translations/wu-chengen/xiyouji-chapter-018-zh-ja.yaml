  "kind": "paragraph"
  "origin": "source"
  "source_text": "他走來看見高老，一把扯住，抱頭大哭。行者道：「且莫哭，且莫哭。我問你，妖怪往那裡去了？」女子道：「不知往那裡去。這些時，天明就去，入夜方來。雲雲霧霧，往回不知何所。因是曉得父親要祛退他，他也常常防備，故此昏來朝去。」行者道：「不消說了。老兒，你帶令愛往前邊宅裡，慢慢的敘闊，讓老孫在此等他。他若不來，你卻莫怪；他若來了，定與你剪草除根。」那老高歡歡喜喜的把女兒帶將前去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    翠蘭は歩み寄って高太公を見ると、ひしとつかみ、頭を抱えて大声で泣いた。
    行者「まあ泣くな、泣くな。一つ聞くが、妖怪はどこへ行った。」
    翠蘭「どこへ行くのか、分かりません。このところ、夜が明けると出ていって、夜にならないと戻りません。雲や霧に包まれて、どこへ行き、どこから帰るのやら。父が追い払おうとしていると知って、いつも用心しています。それで日暮れに来て、朝になると去るのです。」
    行者「それだけ分かればいい。爺さん、娘を手前の屋敷へ連れていき、積もる話をゆっくりするといい。俺はここで奴を待つ。来なかったら、俺を恨むなよ。来れば、必ず根こそぎ退治してやる。」
    高太公は喜び勇んで、娘を手前の屋敷へ連れていった。
  "translation_status": "reviewed"
- "id": "xy-ch18-018"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻弄神通，搖身一變，變得就如那女子一般，獨自個坐在房裡等 那妖精。不多時，一陣風來，真個是走石飛砂。好風："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 146
    "line_end": 146
  "translation_ja": "行者は神通力を働かせ、身を揺すって変身し、翠蘭そっくりの姿になった。そして一人、部屋に座って妖怪を待った。ほどなく一陣の風が吹き、まさしく石を飛ばし、砂を巻き上げた。なんという風か。"
  "translation_status": "reviewed"
- "id": "xy-ch18-019"
  "section_id": "chapter-18"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    起初時微微蕩蕩，向後來渺渺茫茫。
    微微蕩蕩乾坤大，渺渺茫茫無阻礙。
    凋花折柳勝揌麻，倒樹摧林如拔菜。
    翻江攪海鬼神愁，裂石崩山天地怪。
    啣花糜鹿失來蹤，摘果猿猴迷在外。
    七層鐵塔侵佛頭，八面幢幡傷寶蓋。
    金梁玉柱起根搖，房上瓦飛如燕塊。
    舉棹梢公許願心，開船忙把豬羊賽。
    當坊土地棄祠堂，四海龍王朝上拜。
    海邊撞損夜叉船，長城刮倒半邊塞。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 148
    "line_end": 157
  "translation_ja": |-
    初めはかすかに揺れ動き、やがて果てなく吹き広がる。
    そよそよと揺れつつ広大な天地を満たし、果てなく広がって阻むものがない。
    花を散らし柳を折るのは、麻を揺するよりたやすく、木を倒して林を砕くのは、菜を抜くも同じ。
    川をひっくり返し海をかき乱せば鬼神も愁い、石を裂いて山を崩せば天地も驚く。
    花をくわえた大鹿は、来た道を見失い、実を摘んでいた猿は、外に迷って帰れない。
    七層の鉄塔では仏の頭を襲い、八方の幢幡（どうばん）をあおって宝蓋（ほうがい）を損なう。
    金の梁も玉の柱も根元から揺れ、屋根の瓦は燕の運ぶ土くれのように飛ぶ。
    棹を握る船頭は心に願をかけ、船を出す者は慌てて豚や羊を供えて祈る。
    土地神は祠を捨て、四海の竜王（しかいのりゅうおう）は天に向かって拝む。
    海辺では夜叉（やしゃ）の船を打ち壊し、長城（ちょうじょう）では砦の半分を吹き倒す。

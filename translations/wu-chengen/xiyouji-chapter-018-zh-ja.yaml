    "message_ja": "「咨牙徠嘴」は歯をむいて口をゆがめる様子、「磕頭毛臉」は頭髪が乱れ顔が毛深い様子。漢典の磕頭項がこの句を用例として毛髪散乱の語義を示す（https://zdic.net/hant/%E7%A3%95%E5%A4%B4）。底本の異字を一般的な別表記へ無断訂正していない。「斗牛宮」と「枉死獄」は天上と地下を対照させる追跡の誇張で、実際の到着描写ではない。"

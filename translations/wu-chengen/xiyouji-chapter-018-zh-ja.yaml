  "known_gaps":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-002"
    "description_ja": "「香柟」は原文欄の字形を保持し、訳文は通用字体の「香楠」とした。中国の楠木類を指すものと読み、日本のクスノキと同一種だとは確定しない。「紅風洞」は焼けた黒風洞をもじる語りで、別の洞窟への移動ではない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-003"
    "description_ja": "「散福」は祭祀の供物を分け、福を共に受けること。教育部『重編國語辭典修訂本』の語義に基づき、お供えのお下がりを食べると訳した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=144985&q=1&word=%E6%95%A3）。僧たちの礼願と紙を焚く行為を省かず、行者が僧たちに福を授ける意味へ変えていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-008"
    "description_ja": "「清氣」は清らかな空気ではなく、余計な腹立ちの意味と解した。「三耳草鞋」は草鞋の三つの緒留めを指すものとして訳すが、履物の細かな構造は未確定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-009"
    "description_ja": "「紇刺星」は行く手を妨げる厄介者の比喩とした。教育部『重編國語辭典修訂本』の該当項目は「魔星」「意外の阻難」と説明する（https://dict.revised.moe.edu.tw/dictView.jsp?ID=67929&la=0&powerMode=0）。 「湊四合六」は都合よい偶然の一致。四と六を合わせる数の言い回しと、「医者への便宜と目の治療」の諺を残した。語義は教育部辞典を参照（https://dict.revised.moe.edu.tw/dictView.jsp?ID=141680&la=0&powerMode=0）。 末娘が二十歳、婿になって三年、監禁から半年という時間を原文どおりとした。「更不曾配人」は妖怪が居座る前に別家へ嫁がせていなかった意で、妖怪との婚姻を語り手が正式に承認したという意味にはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-011"
    "description_ja": "「糙米皮的犢子靴」は、糙米皮を玄米のような色の革、犢子靴を子牛革の靴と仮に解して訳した。材質・色を特定する独立資料は確認できず、この服飾解釈には留保がある。「作揖」は胸の前で両手を組む挨拶で、ひざまずく動作には変えていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-012"
    "description_ja": "「昏去明來」は字面どおり日暮れに出て夜明けに戻ると訳した。別の版の勤労描写に合わせて「朝出て夜帰る」へ変更していない。「三五斗」は三、五斗という幅を残し、十五斗や現代のリットル値へ換算しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-015"
    "description_ja": "父が娘を呼ぶ「三姐姐」は三番目の娘への愛称と解し、「三番目の娘よ」とした。父の姉を呼ぶ場面ではない。門の錠は溶銅で固められており、行者の鍵を求める言葉は冗談として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-016"
    "description_ja": "櫻脣は桜の花ではなく、さくらんぼのように小さく赤い唇の比喩。教育部辞典の語釈に照らして訳した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=158018&la=0&powerMode=0）。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-019"
    "description_ja": "「揌麻」の揌は教育部『異體字字典』の「振動」を参考に「麻を揺する」としたが、麻加工のどの動作を指すかは未確定（https://dict.variants.moe.edu.tw/dictView.jsp?ID=86391）。「糜鹿」は底本の字を保持し、訳では鹿の種を厳密に同定せず「大鹿」とした。 「燕塊」は語義を直接説明する確かな資料を確認できず、燕の巣作りの土くれを指す比喩と仮に解した。別字へ原文を直さず、解釈の留保を残す。 「七層鐵塔侵佛頭」「八面幢幡傷寶蓋」は風が仏の頭、幢幡、宝蓋まで襲う列挙として訳した。倒壊の具体的な因果や仏像の配置を、本文以上に確定していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-020"
    "description_ja": "「姐姐」はここでは妻への親しい呼びかけとして訳し、実の姉という関係を補わない。「小跌」は投げ技の名として保持するが、現代武術の特定の技へ同定していない。「漫頭一抖」の頭の動作は文脈から訳した暫定解釈。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-021"
    "description_ja": "「姨夫」はこの文脈では妻の姉妹の夫をいうものと解し、既出の二人の姉の夫と訳した。両親が煉瓦や瓦を投げたという話は、翠蘭を装う行者の作り話であり、語り手が確認した事実ではない。 「官名」は役職名ではなく幼名に対する正式な名。教育部『重編國語辭典修訂本』の語義を参照した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=73525&la=0&powerMode=0）。名乗り前は「豚の妖怪」、名乗り後は「猪剛鬣」とし、本回では八戒の名を導入しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-022"
    "description_ja": "「天罡數」は三十六という数に対応する術。本文には数値を補わず、語の注釈で説明する。九天蕩魔祖師との面識や、相手が手出しを恐れるという豪語は猪剛鬣の発言として訳し、事実認定へ変えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "segment_ids":
    - "xy-ch18-023"
    "description_ja": "「咨牙徠嘴」は歯をむいて口をゆがめる様子、「磕頭毛臉」は頭髪が乱れ顔が毛深い様子。漢典の磕頭項がこの句を用例として毛髪散乱の語義を示す（https://zdic.net/hant/%E7%A3%95%E5%A4%B4）。底本の異字を一般的な別表記へ無断訂正していない。「斗牛宮」と「枉死獄」は天上と地下を対照させる追跡の誇張で、実際の到着描写ではない。 本文の欠落ではなく解釈・校訂上の留保。"

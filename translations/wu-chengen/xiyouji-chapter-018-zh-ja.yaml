  "origin": "source"
  "source_text": "那太公即忙換了衣服，與高才出來迎接，叫聲：「長老。」三藏聽見，急轉身，早已到了面前。那老者戴一頂烏綾巾，穿一領蔥白蜀錦衣，踏一雙糙米皮的犢子靴，繫一條黑綠絛子，出來笑語相迎，便叫：「二位長老，作揖了。」三藏還了禮，行者站著不動。那老者見他相貌兇醜，便就不敢與他作揖。行者道：「怎麼不唱老孫喏？」那老兒有幾分害怕，叫高才道：「你這小廝卻不弄殺我也？家裡現有一個醜頭怪腦的女婿打發不開，怎麼又引這個雷公來害我？」行者道：「老高，你空長了許大年紀，還不省事。若專以相貌取人，乾淨錯了。我老孫醜自醜，卻有些本事。替你家擒得妖精，捉得鬼魅，拿住你那女婿，還了你女兒，便是好事，何必諄諄以相貌為言？」太公見說，戰兢兢的，只得強打精神，叫聲：「請進。」這行者見請，才牽了白馬，教高才挑著行李，與三藏進去。他也不管好歹，就把馬拴在敞廳柱上，扯過一張退光漆交椅，叫師父坐下。他又扯過一張椅子，坐在傍邊。那高老道：「這個小長老，倒也家懷。」行者道：「你若肯留我住得半年，還家懷哩。」"

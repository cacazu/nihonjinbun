    "message_ja": "「湊四合六」は都合よい偶然の一致。四と六を合わせる数の言い回しと、「医者への便宜と目の治療」の諺を残した。語義は教育部辞典を参照（https://dict.revised.moe.edu.tw/dictView.jsp?ID=141680&la=0&powerMode=0）。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "末娘が二十歳、婿になって三年、監禁から半年という時間を原文どおりとした。「更不曾配人」は妖怪が居座る前に別家へ嫁がせていなかった意で、妖怪との婚姻を語り手が正式に承認したという意味にはしない。"
- "id": "xy-ch18-010"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那高才入了大門，徑往中堂上走，可可的撞見高太公。太公罵道：「你那個蠻皮畜生！怎麼不去尋人，又回來做甚？」高才放下包、傘道：「上告主人公得知：小人才行出街口，忽撞見兩個和尚：一個騎馬，一個挑擔。他扯住我不放，問我那裡去。我再三不曾與他說及，他纏得沒奈何，不得脫手，遂將主人公的事情，一一說與他知。他卻十分歡喜，要與我們拿那妖怪哩。」高老道：「是那裡來的？」高才道：「他說是東土駕下差來的御弟聖僧，前往西天拜佛求經的。」太公道：「既是遠來的和尚，怕不真有些手段。他如今在那裡 ？」高才道：「現在門外等候。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    高才は大門を入り、まっすぐ中の広間へ向かうと、ちょうど高太公に出くわした。
    高太公「この横着者の畜生め！　人を探しに行かずに、何をしに帰ってきた！」
    高才は包みと傘を下ろした。
    高才「ご主人さま、ご報告申し上げます。村の道の入口まで出たところで、二人の和尚に出会いました。一人は馬に乗り、一人は荷を担いでいました。その和尚が私をつかんで放さず、どこへ行くのかと聞くのです。何度も話さずにおりましたが、しつこくまとわりつかれ、どうしても手を逃れられません。それでご主人さまの事情を、一つ一つ話したのでございます。すると大喜びして、うちの妖怪を捕まえてやると言うのです。」
    高太公「どこから来た者たちだ。」
    高才「東土の帝から遣わされた御弟の聖僧で、西天へ仏を拝み、経を求めに行くのだと言っております。」
    高太公「遠くから来た和尚なら、本当に術があるかもしれない。今どこにいる。」
    高才「門の外で待っております。」

  "translation_ja": |-
    高太公は急いで着替え、高才と出迎えに出て、声をかけた。
    高太公「長老。」
    三蔵が聞きつけて、すぐ振り向くと、高太公はもう目の前に来ていた。黒い綾織りの頭巾をかぶり、淡い青白色の蜀錦（しょっきん）の衣を着て、玄米色の子牛革の靴を履き、黒緑色の組紐を締めている。笑顔で迎え出て、声をかけた。
    高太公「お二人の長老、ようこそおいでくださいました。」
    高太公が胸の前で両手を組んで礼をすると、三蔵も礼を返したが、行者は立ったまま動かなかった。高太公はその恐ろしい醜い顔を見て、行者には怖くて礼をできない。
    行者「どうして俺には挨拶をしない。」
    高太公は少しおびえ、高才を呼びつけた。
    高太公「お前は私を殺す気か。家にはもう、醜い頭に妙な顔の婿が一匹いて、追い払えずにいる。どうしてまた、こんな雷公（らいこう）を連れてきて私を苦しめる。」
    行者「高の爺さん、長く生きただけで、物が分からないな。見かけだけで人を取るなら、まるっきり間違いだ。俺は醜いには違いないが、ちゃんと力がある。お前の家の妖怪も幽鬼も捕まえ、その婿を取り押さえて、娘を返してやれば、結構なことじゃないか。どうしてくどくどと、顔のことばかり言う。」
    そう言われ、高太公は震えながらも、無理に気を取り直した。
    高太公「どうぞ、お入りください。」
    行者は招かれると、白馬を引き、高才に荷を担がせ、三蔵と中へ入った。遠慮も何もせず、馬を広間の柱につなぎ、磨き上げた漆塗りの折り畳み椅子を引き寄せて、師を座らせた。自分ももう一脚引き寄せて、そばに座る。
    高太公「この小さな長老は、ずいぶん我が家のようにおくつろぎだ。」
    行者「半年も泊めてくれるなら、もっとくつろいでみせるさ。」

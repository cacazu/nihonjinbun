- "id": "xy-ch18-009"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這人無奈，只得以實情告訴道：「我是高太公的家人，名叫高才。我那太公有個老女兒，年方二十歲，更不曾配人。三年前被一個妖精占了，那妖整做了這三年女婿。我太公不悅，說道：『女兒招了妖精，不是長法：一則敗壞家門，二則沒個親家來往。』一向要退這妖精。那妖精那裡肯退，轉把女兒關在他後宅，將有半年，再不放出與家內人相見。我太公與了我幾兩銀子，教我尋訪法師，拿那妖怪。我這些時不曾住腳，前前後後，請了有三四個人，都是不濟的和尚，膿包的道士，降不得那妖精 。剛才罵了我一場，說我不會幹事。又與了我五錢銀子做盤纏，教我再去請好法師降他。不期撞著你這個紇刺星扯住，誤了我走路，故此裡外受氣，我無奈，才與你叫喊。不想你又有些拿法，我掙不過你，所以說此實情。你放我走罷。」行者道：「你的造化，我有營生，這才是湊四合六的勾當。你也不須遠行，莫要花費了銀子。我們不是那不濟的和尚，膿包的道士，其實有些手段，慣會拿妖。這正是：『一來照顧郎中，二來又醫得眼好。』煩你回去上覆你那家主，說我們是東土駕下差來的御弟聖僧，往西天拜佛求經者，善能降妖縛怪。」高才道：「你莫誤了我。我是一肚子氣的人，你錯哄了我，沒甚手段，拿不住那妖精，卻不又帶累我來受氣？」行者道：「管教不誤了你，你引我到你家門首去來。」那人也無計奈何，真個提著包袱，拿了傘，轉步回身，領他師徒到於門首道：「二位長老，你且在馬臺上略坐坐，等我進去報主人知道。」行者才放了手，落擔牽馬，師徒們坐立門傍等候。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    若者はどうしようもなく、ありのままを話した。
    若者「俺は高太公（こうたいこう）の使用人で、高才（こうさい）というんだ。ご主人には、今年二十歳になる末娘がいる。まだ嫁にもやらないうちに、三年前、一匹の妖怪に居座られ、そいつが丸三年も婿になっている。ご主人は気に入らず、『娘の婿が妖怪では、末永くやっていけない。一つには家名を汚すし、もう一つ、相手の親と付き合うこともできない』と言って、ずっと縁を切ろうとしているのさ。ところが妖怪が承知するものか。逆に娘さんを奥の屋敷へ閉じ込めて、もう半年近く、家の者と会わせない。ご主人から銀を数両もらい、妖怪を捕まえる法師を探せと言いつけられた。それで俺は、この間ずっと休みもせず、前後に三、四人連れてきたんだが、役立たずの坊主や腰抜けの道士ばかりで、妖怪を降せやしない。さっきも役に立たない奴だとさんざん叱られた。また旅費に銀五銭を渡されて、今度こそ腕のよい法師を連れてこいと言われたんだ。そこへ思いがけず、あんたみたいな厄介者に出くわし、引き止められて行く手を邪魔された。内でも外でも腹を立てさせられ、たまらず怒鳴ったというわけさ。ところがあんたも、取り押さえる術をいくらか知っていると見えて、振りほどけない。だから本当のことを話したんだ。もう行かせてくれ。」
    行者「それはお前に運が向き、俺には仕事ができたというものだ。まったく、四と六で十になるように、ぴたりと話が合ったな。遠くへ行くことも、銀を使うこともない。俺たちは役立たずの坊主や腰抜けの道士とは違う。ちゃんと腕があって、妖怪退治には慣れている。まさに『医者には仕事を回し、自分の目も治る』というわけだ。家へ戻って、ご主人にこう伝えてくれ。東土（とうど）の帝から遣わされた御弟（ぎょてい）の聖僧で、西天（さいてん）へ仏を拝み、経を求めに行く者たちが来た、妖怪を降して縛り上げるのは得意だ、とな。」
    高才「俺を困らせないでくれよ。もう腹の中は怒りでいっぱいなんだ。うそで釣って、たいした術もなく、妖怪を捕まえられなかったら、また俺が巻き添えで叱られるじゃないか。」
    行者「困らせないと請け合おう。お前の家の門まで案内してくれ。」
    高才もほかに仕方がない。包みを取り上げ、傘を持ち、向き直って師弟を門前まで連れ戻した。
    高才「お二人の長老、ひとまず馬の乗り降り台でお休みください。中へ入って、主人に知らせてまいります。」
    ようやく行者は手を放し、担いでいた荷を下ろして馬を引き、師弟は門のそばで座ったり立ったりして待った。

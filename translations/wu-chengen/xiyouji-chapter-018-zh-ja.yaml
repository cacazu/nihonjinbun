  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「燕塊」は語義を直接説明する確かな資料を確認できず、燕の巣作りの土くれを指す比喩と仮に解した。別字へ原文を直さず、解釈の留保を残す。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「七層鐵塔侵佛頭」「八面幢幡傷寶蓋」は風が仏の頭、幢幡、宝蓋まで襲う列挙として訳した。倒壊の具体的な因果や仏像の配置を、本文以上に確定していない。"
- "id": "xy-ch18-020"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那陣狂風過處，只見半空裡來了一個妖精，果然生得醜陋：黑臉短毛，長喙大耳；穿一領青不青、藍不藍的梭布直裰，繫一條花布手巾。行者暗笑道：「原來是這個買賣。」好行者，卻不迎他，也不問他，且睡在床上推病，口裡哼哼嘖嘖的不絕。那怪不識真假，走進房，一把摟住，就要親嘴。行者暗笑道：「真個要來弄老孫哩。」即使個拿法，托著那怪的長嘴，叫做個小跌。漫頭一抖，撲的摜下床來。那怪爬起來，扶著床邊道：「姐姐，你怎麼今日有些怪我？想是我來得遲了？」行者道：「不怪，不怪。」那妖道：「既不怪我，怎麼就丟我這一跌？」行者道：「你怎麼就這等樣小家子，就摟我親嘴？我因今日有些不自在；若每常好時，便起來開門等你了。你可脫了衣服睡是。」那怪不解其意，真個就去脫衣。行者跳起來，坐在淨桶上。那怪依舊復來床上摸一把，摸不著人，叫道：「姐姐，你往那裡去了？請脫衣服睡罷。」行者道：「你先睡，等我出個恭來。」那怪果先解衣上床。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    その烈風が過ぎると、空中に一匹の妖怪が現れた。まったく醜い姿で、黒い顔に短い毛、長い鼻づらに大きな耳。青とも藍ともつかない機織りの木綿の長衣を着て、花模様の布の手拭いを腰に巻いている。行者は心の中で笑った。
    行者「なるほど、こういう代物か。」
    さても行者は迎えにも出ず、声もかけず、寝台に寝転がって病気を装い、うんうん、ああああと絶えずうめいた。豚の妖怪は本物か偽物かも知らず、部屋に入るなり抱きついて、口づけをしようとした。行者はひそかに笑った。
    行者「本気でこの俺に、いたずらしようというのか。」
    すぐに取り押さえの技を使い、妖怪の長い鼻づらを下から支え、「小跌（しょうてつ）」という投げ技をかけた。頭をぐいと揺すり、どさりと寝台の下へ放り落とす。豚の妖怪は起き上がり、寝台につかまって言った。
    豚の妖怪「なあ、今日はどうして俺に腹を立てている。来るのが遅かったからかい。」
    行者「怒ってなんかいないわ。」
    豚の妖怪「怒っていないなら、どうしてこんなふうに投げ落とすんだ。」
    行者「どうしてそうがさつに、いきなり抱きついて口づけするの。今日はちょっと気分が悪いのよ。いつものように元気なら、起きて戸を開け、待っていたわ。服を脱いで寝たらいいでしょう。」
    豚の妖怪はその意図に気づかず、本当に服を脱ぎに行った。行者は跳び起き、便器の上に座った。妖怪はまた寝台へ戻って手探りしたが、人に触れないので呼んだ。
    豚の妖怪「なあ、どこへ行った。服を脱いで寝なよ。」
    行者「先に寝ていて。用を足すまで待ってちょうだい。」
    豚の妖怪は、言われるまま先に服を脱ぎ、寝台へ上がった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「姐姐」はここでは妻への親しい呼びかけとして訳し、実の姉という関係を補わない。「小跌」は投げ技の名として保持するが、現代武術の特定の技へ同定していない。「漫頭一抖」の頭の動作は文脈から訳した暫定解釈。"
- "id": "xy-ch18-021"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者忽然嘆口氣，道聲：「造化低了。」那怪道：「你惱怎的？造化怎麼得低的？我得到了你家，雖是吃了些茶飯，卻也不曾白吃你的：我也曾替你家掃地通溝、搬磚運瓦、築土打牆、耕田耙地、種麥插秧、創家立業。如今你身上穿的錦，戴的金，四時有花果享用，八節有蔬菜烹煎，你還有那些兒不趁心處，這般短嘆長吁，說甚麼造化低了？」行者道：「不是這等說。今日我的父母隔著牆，丟磚料瓦的，甚是打我罵我哩。」那怪道：「他打罵你怎的？」行者道：「他說我和你做了夫妻，你是他門下一個女婿，全沒些兒禮體。這樣個醜嘴臉的人，又會不得姨夫，又見不得親戚，又不知你雲來霧去，端的是那裡人家，姓甚名誰，敗壞他清德，玷辱他門風，故此這般打罵，所以煩惱。」那怪道：「我雖是有些兒醜陋，若要俊，卻也不難。我一來時，曾與他講過，他願意方才招我。今日怎麼又說起這話？我家住在福陵山雲棧洞。我以相貌為姓，故姓豬，官名叫做豬剛鬣。他若再來問你，你就以此話與他說便了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    行者はふいにため息をついた。
    行者「ああ、私は運が悪いわ。」
    豚の妖怪「何をくよくよするんだ。どうして運が悪い。俺はお前の家へ来て、なるほど茶や飯は食ったが、ただ食いしたことはないぞ。掃除もしたし溝もさらい、煉瓦や瓦を運び、土を突き固めて壁を築き、田を耕してならし、麦を播き苗を植え、家を興して財も築いてやった。今お前が着ている錦、身につける金の飾り、それに一年中、花や果物を楽しみ、八節（はっせつ）ごとに野菜を煮炊きして食べている。まだ何が気に入らないんだ。そうため息ばかりついて、運が悪いだなんて。」
    行者「そんな話じゃないの。今日、父さまと母さまが塀越しに煉瓦や瓦を投げて、ひどく私を打ち、罵ったのよ。」
    豚の妖怪「どうしてお前を打ったり罵ったりするんだ。」
    行者「私とあなたが夫婦になり、あなたはこの家の婿になったのに、ちっとも礼儀を知らないと言うの。あんな醜い顔では、姉たちの夫にも会わせられず、親戚の前にも出せない。雲に乗って来て、霧になって去るけれど、本当はどこの生まれで、姓も名も何なのか分からない。父の清い名を汚し、家の名誉に泥を塗る、と。だからそんなふうに打ったり罵ったりされて、私は困っているのよ。」
    豚の妖怪「俺は少しばかり醜いが、美男子になるのも難しくはないさ。来たときにもちゃんと話し、向こうが承知してから婿に取ったんだ。どうして今ごろ、またそんなことを言う。俺の住処は福陵山の雲桟洞（うんさんどう）だ。見かけを姓にしたから猪といい、正式な名は猪剛鬣（ちょごうりょう）という。あの親父がまた聞いてきたら、そう話してやればいい。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「姨夫」はこの文脈では妻の姉妹の夫をいうものと解し、既出の二人の姉の夫と訳した。両親が煉瓦や瓦を投げたという話は、翠蘭を装う行者の作り話であり、語り手が確認した事実ではない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「官名」は役職名ではなく幼名に対する正式な名。教育部『重編國語辭典修訂本』の語義を参照した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=73525&la=0&powerMode=0）。名乗り前は「豚の妖怪」、名乗り後は「猪剛鬣」とし、本回では八戒の名を導入しない。"
- "id": "xy-ch18-022"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者暗喜道：「那怪卻也老實，不用動刑，就供得這等明白。既有了地方、姓名，不管怎的也拿住他。」行者道：「他要請法師來拿你哩。」那怪笑道：「睡著，睡著，莫睬他。我有天罡數的變化，九齒的釘鈀，怕甚麼法師、和尚、道士？就是你老子有虔心，請下九天蕩魔祖師下界，我也曾與他做過相識，他也不敢怎的我。」行者道：「他說請一個五百年前大鬧天宮姓孫的齊天大聖，要來拿你哩。」那怪聞得這個名頭，就有三分害怕道：「既是這等說，我去了罷，兩口子做不成了。」行者道：「你怎的就 去？」那怪道：「你不知道，那鬧天宮的弼馬溫有些本事，只恐我弄他不過，低了名頭，不像模樣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    行者は心中ひそかに喜んだ。
    行者「こいつは案外正直だ。拷問もしないうちに、こんなにはっきり白状した。住処も名前も分かったからには、どうあっても捕まえてやる。」
    そして口に出して言った。
    行者「父は法師を呼んで、あなたを捕まえさせようとしているのよ。」
    猪剛鬣は笑った。
    猪剛鬣「寝よう、寝よう。かまうものか。俺には天罡（てんこう）の数だけの変化と、九つ歯の釘鈀（ていは）がある。法師だろうが和尚だろうが道士だろうが、何を恐れる。お前の親父が信心を尽くして、九天蕩魔祖師（きゅうてんとうまそし）を地上へ呼び下したって、俺とは以前から顔なじみだ。あの方だって、俺に手出しする度胸はあるまい。」
    行者「五百年前に天宮で大暴れした、孫という姓の斉天大聖（せいてんたいせい）を呼んで、あなたを捕まえさせると言っていたわ。」
    その名を聞くと、猪剛鬣はいくらか怖くなった。
    猪剛鬣「そういうことなら、俺は行くよ。もう夫婦ではいられない。」
    行者「どうして行ってしまうの。」
    猪剛鬣「お前は知らないだろうが、天宮で暴れたあの弼馬温（ひつばおん）には、ちょっと力がある。かなわずに名を落としては、格好がつかないからな。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「天罡數」は三十六という数に対応する術。本文には数値を補わず、語の注釈で説明する。九天蕩魔祖師との面識や、相手が手出しを恐れるという豪語は猪剛鬣の発言として訳し、事実認定へ変えない。"
- "id": "xy-ch18-023"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說罷，套上衣服，開了門，往外就走。被行者一把扯住，將自己臉上抹了一抹，現出原身，喝道：「好妖怪，那裡走！你擡頭看看我是那個？」那怪轉過眼來，看見行者咨牙徠嘴，火眼金睛，磕頭毛臉，就是個活雷公相似。慌得他手麻腳軟，劃剌的一聲，掙破了衣服，化狂風脫身而去。行者急上前，掣鐵棒，望風打了一下。那怪化萬道火光，徑轉本山而去。行者駕雲，隨後趕來，叫聲：「那裡走！你若上天，我就趕到斗牛宮；你若入地，我就追至枉死獄。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    そう言うと猪剛鬣は服を引っかけ、戸を開けて出ていこうとした。行者はすかさずつかまえ、自分の顔をひと撫でして元の姿を現し、どなった。
    行者「こら妖怪、どこへ行く！　顔を上げて、俺が誰か見てみろ！」
    猪剛鬣が振り向くと、行者は歯をむき、口をゆがめ、火のような金色の目を光らせている。頭の毛は乱れ、顔は毛むくじゃらで、まるで生きた雷公だった。猪剛鬣は慌てて手足の力が抜けたが、ばりっと服を引き裂いて逃れ、烈風と化して飛び去った。行者は急いで進み、鉄棒を引き抜いて、風めがけて一打した。猪剛鬣は無数の火の光に変わり、まっすぐ自分の山へ逃げ帰った。行者は雲に乗り、あとを追って叫んだ。
    行者「どこへ逃げる！　天に上れば斗牛宮（とぎゅうきゅう）まで、地に潜れば枉死獄（おうしごく）まで追いかけてやるぞ！」
  "translation_status": "reviewed"

    "message_ja": "櫻脣は桜の花ではなく、さくらんぼのように小さく赤い唇の比喩。教育部辞典の語釈に照らして訳した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=158018&la=0&powerMode=0）。"

    "message_ja": "「昏去明來」は字面どおり日暮れに出て夜明けに戻ると訳した。別の版の勤労描写に合わせて「朝出て夜帰る」へ変更していない。「三五斗」は三、五斗という幅を残し、十五斗や現代のリットル値へ換算しない。"
- "id": "xy-ch18-013"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「這個何難？老兒你管放心，今夜管情與你拿住，教他寫了退親文書，還你女兒如何？」高老大喜道：「我為招了他不打緊，壞了我多少清名，疏了我多少親眷。但得拿住他，要甚麼文書？就煩與我除了根罷。」行者道：「容易，容易。入夜之時，就見好歹。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    行者「そんなこと、何が難しい。爺さん、安心していな。今夜きっと捕まえて、離縁の証文を書かせ、娘を返してやろう。それでどうだ。」
    高太公は大いに喜んだ。
    高太公「あれを婿に迎えたことだけならまだしも、どれほど私の名声が損なわれ、どれほど親類が遠のいたことか。捕まえていただけるなら、証文など要りません。どうか根絶やしにしてください。」
    行者「たやすいことだ。夜になれば、結果が分かる。」
  "translation_status": "reviewed"
- "id": "xy-ch18-014"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老兒十分歡喜，才教展抹桌椅，擺列齋供。齋罷將晚，老兒問道：「要甚兵器？要多少人隨？趁早好備。」行者道：「兵器我自有。」老兒道：「二位只是那根錫杖， 錫杖怎麼打得那個妖精？」行者隨於耳內取出一個繡花針來，捻在手中，迎風幌了一幌，就是碗來粗細的一根金箍鐵棒，對著高老道：「你看這條棍子，比你家兵器如何？可打得這怪否？」高老又道：「既有兵器，可要人跟？」行者道：「我不用人，只是要幾個年高有德的老兒，陪我師父清坐閑敘，我好撇他而去。等我把那妖精拿來，對眾取供，替你除了根罷。」那老兒即喚家僮，請了幾個親故朋友。一時都到，相見已畢，行者道：「師父， 你放心穩坐，老孫去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    高太公は大喜びで、机や椅子を拭かせ、精進の供え物を並べさせた。食事が済み、日が暮れかけると尋ねた。
    高太公「どのような武器が要りますか。何人お供をつけましょう。早いうちに用意いたします。」
    行者「武器なら、自分で持っている。」
    高太公「お二人には、あの錫杖（しゃくじょう）しかないではありませんか。錫杖で、どうして妖怪と戦えるのです。」
    行者は耳の中から刺繍針を一本取り出し、指先につまんで、風に向けてひと振りした。するとそれは、椀ほどの太さがある、金のたがの付いた鉄棒になった。高太公に向けて言う。
    行者「この棒を見な。お宅の武器と比べてどうだ。妖怪を打てるだろう？」
    高太公「武器がおありなら、供の者は要りますか。」
    行者「供は要らない。ただ、年を重ねた徳のある老人を何人か呼んで、俺の師匠とゆっくり世間話をしてもらいたい。そうすれば師匠を残して出かけられる。妖怪を捕まえてきたら、みなの前で白状させ、お前のために根を絶ってやる。」
    高太公はすぐ家僕を呼び、親戚や古なじみの友人を何人か招いた。ほどなく全員が集まり、挨拶を済ませると、行者が言った。
    行者「お師匠さま、安心してお座りになっていてください。私は行ってまいります。」
  "translation_status": "reviewed"
- "id": "xy-ch18-015"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他揝著鐵棒，扯著高老道：「你引我去後宅子裡妖精的住處看看。」高老遂引他到後宅門首。行者道：「你去取鑰匙來。」高老道：「你且看看，若是用得鑰匙，卻不請你了。」行者笑道：「你那老兒年紀雖大，卻不識耍。我把這話兒哄你一哄，你就當真。」走上前，摸了一摸，原來是銅汁灌的鎖子。狠得他將金箍棒一搗，搗開門扇，裡面卻黑洞洞的。行者道：「老高，你去叫你女兒一聲，看他可在裡面？」那老兒硬著膽叫道：「三姐姐！」那女兒認得是他父親的聲音，才少氣無力的應了一聲道：「爹爹，我在這裡哩。」行者閃金睛，向黑影裡仔細看時，你道他怎生模樣？但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    行者は鉄棒を握り、高太公を引いて言った。
    行者「奥の屋敷にある、妖怪の住処へ案内してくれ。見てやろう。」
    高太公は奥の屋敷の門まで連れていった。
    行者「鍵を取ってきな。」
    高太公「まあ、ご覧なさい。鍵で開くのなら、あなたをお呼びはしませんよ。」
    行者は笑った。
    行者「爺さん、年は取っても冗談が分からないな。ちょっとからかったら、本気にしてしまった。」
    前へ出て触ってみると、錠には溶かした銅が流し込んであった。行者は荒々しく金箍棒（きんこぼう）を突き出し、門扉を打ち開いた。中は真っ暗だった。
    行者「高の爺さん、娘を呼んでみな。中にいるかどうか。」
    高太公は勇気を振り絞って呼んだ。
    高太公「三番目の娘よ！」
    翠蘭は父の声だと分かり、息も絶え絶えに答えた。
    翠蘭「父さま、ここにおります。」
    行者は金色の目を光らせ、暗がりの中をよく見た。どんな姿であったかといえば、こうである。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "父が娘を呼ぶ「三姐姐」は三番目の娘への愛称と解し、「三番目の娘よ」とした。父の姉を呼ぶ場面ではない。門の錠は溶銅で固められており、行者の鍵を求める言葉は冗談として訳した。"
- "id": "xy-ch18-016"
  "section_id": "chapter-18"
  "kind": "verse"
  "origin": "source"
  "source_text": "雲鬢亂堆無掠，玉容未洗塵淄。一片蘭心依舊，十分嬌態傾頹。櫻唇全無氣血，腰肢屈屈偎偎。愁蹙蹙，蛾眉淡；瘦怯怯，語聲低。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    雲のような髪は乱れ、梳くこともなく、玉の顔は洗われず、塵に汚れている。
    蘭のように清らかな心は変わらぬが、あでやかな姿はすっかり衰えた。
    さくらんぼのような唇にはまるで血の気がなく、細い腰は力なく折れ曲がる。
    憂いに眉をひそめ、その眉も薄く、やせておどおどと、声も低い。
  "translation_status": "reviewed"
  "issues":

  "origin": "source"
  "source_text": "坐定，高老問道：「適間小价說，二位長老是東土來的？」三藏道：「便是。貧僧奉朝命往西天拜佛求經，因過寶莊，特借一宿，明日早行。」高老道：「二位原是借宿的，怎麼說會拿怪？」行者道：「因是借宿，順便拿幾個妖怪兒耍耍的。動問府上有多少妖怪？」高老道：「天哪！還吃得有多少哩，只這一個妖怪女婿，已被他磨慌了。」行者道：「你把那妖怪的始末，有多大手段，從頭兒說說我聽，我好替你拿他。」高老道：「我們這莊上，自古至今，也不曉得有甚麼鬼祟魍魎，邪魔作耗。只是老拙不幸，不曾有子，止生三個女兒：大的喚名香蘭，第二的名玉蘭，第三的名翠蘭。那兩個從小兒配與本莊人家。止有小的個要招個女婿，指望他與我同家過活，做個養老女婿，撐門抵戶，做活當差。不期三年前，有一個漢子，模樣兒倒也精緻。他說是福陵山上人家，姓豬，上無父母，下無兄弟，願與人家做個女婿。我老拙見是這般一個無根無絆的人，就招了他。一進門時，倒也勤謹：耕田耙地，不用牛具；收割田禾，不用刀杖；昏去明來，其實也好。只是一件，有些會變嘴臉。」行者道：「怎麼樣變？」高老道：「初來時是一條黑胖漢，後來就變做一個長嘴大耳朵的獃子，腦後又有一溜鬃毛，身體粗糙怕人，頭臉就像個豬的模樣。食腸卻又甚大：一頓要吃三五斗米飯，早間點心也得百十個燒餅才夠。喜得還吃齋素；若再吃葷酒，便是老拙這些家業田產之類，不上半年，就吃個罄淨。」三藏道：「只因他做得，所以吃得。」高老道：「吃還是件小事。他如今又會弄風，雲來霧去，走石飛砂，諕得我一家並左鄰右舍，俱不得安生。又把那翠蘭小女關在後宅子裡，一發半年也不曾見面，更不知死活如何。因此知他是個妖怪，要請個法師與他去退去退。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"

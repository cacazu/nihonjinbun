  "translation_ja": |-
    座が定まると、高太公が尋ねた。
    高太公「先ほど召使いが申しましたが、お二人は東土からおいでとか。」
    三蔵「そのとおりです。私は朝廷の命を受け、西天へ仏を拝み、経を求めにまいります。こちらの村を通りがかったので、一晩お泊めいただき、明朝早く出発したいと存じます。」
    高太公「お宿を求めていらしたのに、どうして妖怪を捕まえるなどとおっしゃったのです。」
    行者「宿を借りるついでに、妖怪を二、三匹捕まえて遊んでやろうというのさ。ところで、お宅には妖怪が何匹いる。」
    高太公「とんでもない！　何匹もいてたまりますか。この妖怪の婿一匹だけでも、さんざん悩まされております。」
    行者「その妖怪のいきさつや、どれほどの術を持っているかを、初めから話してくれ。そうすれば捕まえてやれる。」
    高太公「この村では昔から今まで、幽鬼や物の怪、邪魔のたぐいが災いをなしたなど、聞いたことがございません。ただ不幸にも、私には息子がなく、娘が三人いるだけです。上は香蘭（こうらん）、二番目は玉蘭（ぎょくらん）、三番目は翠蘭（すいらん）と申します。上の二人は幼いうちから、この村の家へ嫁ぐことが決まっておりました。ただ末の娘には婿を迎え、私と一つの家で暮らして、老後を養い、家を支え、働いて公の役目も果たしてほしいと願っていたのです。すると三年前、一人の男が現れました。見かけは、なかなか整っておりました。福陵山（ふくりょうざん）の者で、姓は猪（ちょ）、上に両親なく、下に兄弟なく、婿入りを願っているというのです。私は、そういう身寄りも足かせもない者ならばと、婿に迎えました。初めはよく働きました。田を耕してならすにも、牛も農具も使わず、稲を刈り取るにも、刃物や道具は要りません。日暮れに出かけ、夜明けには戻ってきて、まったく重宝いたしました。ただ一つ、顔つきが変わるのでございます。」
    行者「どう変わる。」
    高太公「来たばかりのころは、黒く太った男でした。ところがやがて、口の長い大耳の間抜け面に変わり、後頭部には一筋の剛毛が生え、体はごつごつして恐ろしく、頭も顔も豚そっくりになりました。そのうえ、とてつもない大食らいです。一度に米の飯を三、五斗（と）も食べ、朝の軽食にも焼餅（しょうへい）を百個ほど食べなければ足りません。幸い精進物しか食べませんが、もし肉や酒まで口にしたら、私のこれだけの家財も田畑も、半年たたぬうちに食べ尽くされましょう。」
    三蔵「それだけ働くから、それだけ食べるのでしょう。」
    高太公「食べるだけなら、まだ小さなことです。今は風まで起こし、雲に乗って来て霧になって去り、石や砂を巻き上げて、うちの家族も隣近所も、恐ろしさに落ち着いて暮らせません。そのうえ娘の翠蘭を奥の屋敷に閉じ込め、半年も会わせないのですから、生きているか死んでいるかも分かりません。それで妖怪だと知り、法師を頼んで追い払ってもらおうとしているのでございます。」

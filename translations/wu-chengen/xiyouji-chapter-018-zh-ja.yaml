- "id": "xy-ch18-002"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者辭了菩薩，按落雲頭，將袈裟掛在香柟樹上，掣出棒來，打入黑風洞裡，那洞裡那得一個小妖。原來是他見菩薩出現，降得那老怪就地打滾，急急都散走了。行者一發行兇，將他那幾層門上都積了乾柴，前前後後，一齊發火，把個黑風洞燒做個紅風洞，卻拿了袈裟，駕祥光，轉回直北。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 121
    "line_end": 121
  "translation_ja": "行者（ぎょうじゃ）は観音菩薩（かんのんぼさつ）に別れを告げ、雲を降りると、袈裟を香楠（こうなん）の木に掛け、棒を引き抜いて黒風洞（こくふうどう）へ攻め込んだ。ところが洞内には、小妖怪一匹いない。菩薩が姿を現して、親玉を地面に転げ回らせて降したのを見るや、みな大急ぎで散り散りに逃げてしまっていたのだ。行者はいっそう荒々しく振る舞い、幾重もの門に乾いた薪を積み上げ、前も後ろも一斉に火を放った。こうして黒風洞を真っ赤な「紅風洞（こうふうどう）」にしてしまうと、袈裟を取り、めでたい光に乗って、まっすぐ北へ帰った。"
  "translation_status": "reviewed"

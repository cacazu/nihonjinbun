    "message_ja": "「紇刺星」は行く手を妨げる厄介者の比喩とした。教育部『重編國語辭典修訂本』の該当項目は「魔星」「意外の阻難」と説明する（https://dict.revised.moe.edu.tw/dictView.jsp?ID=67929&la=0&powerMode=0）。"
  - "kind": "uncertain_translation"

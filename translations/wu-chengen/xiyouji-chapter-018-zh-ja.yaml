- "id": "xy-ch18-003"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說那三藏望行者急忙不來，心甚疑惑：不知是請菩薩不至，不知是行者託故而逃。正在那胡猜亂想之中，只見半空中彩霧燦燦，行者忽墜階前跪道：「師父，袈裟來了。」三藏大喜。眾僧亦無不歡悅道：「好了，好了，我等性命今日方才得全了。」三藏接了袈裟道：「悟空，你早間去時，原約到飯罷晌午，如何此時日西方回？」行者將那請菩薩施變化降妖的事情，備陳了一遍。三藏聞言，遂設香案，朝南禮拜罷，道：「徒弟啊，既然有了佛衣，可快收拾包裹去也。」行者道：「莫忙，莫忙。今日將晚，不是走路的時候，且待明日早行。」眾僧們一齊跪下道：「孫老爺說得是。一則天晚，二來我等有些願心兒，今幸平安，有了寶貝，待我還了願，請老爺散了福，明早再送西行。」行者道：「正是，正是。」你看那些和尚都傾囊倒底，把那火裡搶出的餘資，各出所有，整頓了些齋供，燒了些平安無事的紙，念了幾卷消災解厄的經。當晚事畢。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    さて三蔵（さんぞう）は、行者がなかなか戻らないので、ひどく疑っていた。菩薩を呼びに行っても来ていただけないのか、それとも口実を設けて逃げたのか。あれこれ勝手に思い巡らせていると、空に色とりどりの霧が輝き、行者がたちまち階の前に降りて、ひざまずいた。
    行者「お師匠さま、袈裟を取り戻しました。」
    三蔵は大いに喜び、僧たちも一人残らず喜んだ。
    僧たち「よかった、よかった。これで今日こそ、私どもの命が助かりました。」
    三蔵は袈裟を受け取って言った。
    三蔵「悟空（ごくう）、朝出かけるときには、食事を終えた昼ごろに戻る約束だったね。どうして日が西に傾く今になったのだ。」
    行者は、菩薩を迎え、変化の術を使って妖怪を降した次第を、残らず語った。三蔵はそれを聞くと香の台を設け、南へ向かって礼拝してから言った。
    三蔵「弟子よ、仏の衣も戻ったのだから、早く荷をまとめて出発しよう。」
    行者「お急ぎなさいますな。今日はもう暮れかけで、旅に出る時刻ではありません。明日の朝まで待って、早く発ちましょう。」
    僧たちはそろってひざまずいた。
    僧たち「孫（そん）さまのおっしゃるとおりです。一つには日が暮れますし、もう一つ、私どもにはお礼をすると誓った願がございます。幸い無事で、宝も戻りましたから、まずその願を果たし、お供えのお下がりをお召し上がりいただきとうございます。明朝、また西への旅にお送りいたします。」
    行者「そのとおり、それがいい。」
    見れば僧たちは、火の中から取り出した残りの財産を、袋の底をはたいてありったけ持ち寄った。精進の供え物を調え、平穏無事を祈る紙を焚き、災いを消して厄を解く経を幾巻か読んだ。その晩の務めは、こうして終わった。

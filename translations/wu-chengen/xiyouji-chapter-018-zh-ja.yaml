    "line_start": 124
    "line_end": 124
  "translation_ja": "翌朝、ようやく馬を磨いて身支度をし、旅の荷を包んで門を出た。僧たちは遠くまで見送ってから帰った。行者が先に立って道を行く。折しも春の暖かな季節で、目に入るのはこんな眺め。"
  "translation_status": "reviewed"
- "id": "xy-ch18-005"
  "section_id": "chapter-18"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    草襯玉驄蹄跡軟，柳搖金線露華新。
    桃杏滿林爭豔麗，薜蘿遶徑放精神。
    沙堤日暖鴛鴦睡，山澗花香蛺蝶馴。
    這般秋去冬殘春過半，不知何年行滿得真文。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 126
    "line_end": 129
  "translation_ja": |-
    草は玉のような駿馬の蹄を、柔らかに受け止め、柳は金の糸のような枝を揺らし、露の光はみずみずしい。
    林いっぱいの桃と杏は美を競い、道に絡むつる草も、生き生きと伸び広がる。
    砂の堤では暖かな日に鴛鴦が眠り、山の谷川では花が香り、蝶がおとなしく舞う。
    こうして秋が去り、冬も尽き、春も半ばを過ぎた。いったいいつの年、修行を満たして真の経文を得るのだろう。
  "translation_status": "reviewed"
- "id": "xy-ch18-006"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們行了五七日荒路，忽一日天色將晚，遠遠的望見一村人家。三藏道：「悟空，你看那壁廂有座山莊相近，我們去告宿一宵，明日再行何如？」行者道：「且等老孫去看看吉凶，再作區處。」那師父挽住絲韁，這行者定睛觀看，真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    師弟は荒れた道を五、七日進んだ。ある日の暮れ方、遠くに人家の集まる村が見えた。
    三蔵「悟空、あちらに山里の村が見えるね。あそこへ行って一晩の宿を頼み、明日また出発してはどうだろう。」
    行者「まず私が、吉と出るか凶と出るか、様子を見てきます。それから決めましょう。」
    三蔵は絹の手綱を引いて馬を止め、行者が目を凝らして見ると、まさしくこんな景色だった。
  "translation_status": "reviewed"
- "id": "xy-ch18-007"
  "section_id": "chapter-18"
  "kind": "verse"
  "origin": "source"
  "source_text": "竹籬密密，茅屋重重。參天野樹迎門，曲水溪橋映戶。道傍楊柳綠依依，園內花開香馥馥。此時那夕照沉西，處處山林喧鳥雀；晚煙出爨，條條道徑轉牛羊。又見那食飽雞豚眠屋角，醉酣鄰叟唱歌來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    竹の垣根は隙間なく、茅葺きの家々は幾重にも並ぶ。
    空を突く野の木が門前に迎え、曲がる流れと谷川の橋が戸口に映える。
    道端の柳はしなやかに緑を垂れ、園の花は開いてかぐわしい。
    折しも夕日は西へ沈み、そこここの山林で鳥や雀がにぎわう。
    夕餉の煙がかまどから上がり、道という道を牛や羊が帰ってくる。
    腹を満たした鶏と豚は家の隅で眠り、酔い心地のよい隣の老人が、歌いながらやって来る。
  "translation_status": "reviewed"
- "id": "xy-ch18-008"
  "section_id": "chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看罷道：「師父請行，定是一村好人家，正可借宿。」那長老催動白馬，早到街衢之口。又見一個少年，頭裹綿布，身穿藍襖，持傘背包，斂褌劄褲，腳踏著一雙三耳草鞋，雄糾糾的，出街忙走。行者順手一把扯住道：「那裡去？我問你一個信兒：此間是甚麼地方？」那個人只管苦掙，口裡嚷道：「我莊上沒人，只是我好問信？」行者陪著笑道：「施主莫惱。『與人方便，自己方便。』你就與我說說地名何害？我也可解得你的煩惱。」那人掙不脫手，氣得亂跳道：「蹭蹬，蹭蹬。家長的屈氣受不了，又撞著這個光頭，受他的清氣。」行者道：「你有本事，劈開我的手，你便就去了也罷。」那人左扭右扭，那裡扭得動，卻似一把鐵鈐拑住一般。氣得他丟了包袱，撇了傘，兩隻手雨點似來抓行者。行者把一隻手扶著行李，一隻手抵住那人，憑他怎麼支吾，只是不能抓著。行者愈加不放，急得爆燥如雷。三藏道：「悟空，那裡不有人來了？你再問那人就是，只管扯住他怎的？放他去罷。」行者笑道：「師父不知，若是問了別人沒趣，須是問他，才有買賣。」那人被行者扯住不放，只得說出道：「此處乃是烏斯藏國界之地，喚做高老莊。一莊人家有大半姓高，故此喚做高老莊。你放了我去罷。」行者又道：「你這樣行裝，不是個走近路的。你實與我說，你要往那裡去，端的所幹何事，我才放你。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch18-1455567"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第018回&oldid=1455567"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    見終えた行者が言った。
    行者「お師匠さま、お進みください。きっと善良な人たちの村です。泊めてもらうのにちょうどよいでしょう。」
    三蔵が白馬を進めると、たちまち村の道の入口に着いた。そこへ一人の若者が見えた。頭には木綿布を巻き、藍色の上着を着て、傘を持ち、荷を背負い、下ばきをたくし上げて裾をくくり、三つの緒の輪がある草鞋を履いている。威勢よく村から急ぎ出てくるところだった。行者はひょいと手を伸ばして引き止めた。
    行者「どこへ行く？　一つ聞きたい。この辺りは何という所だ。」
    若者はもがきながら、わめいた。
    若者「この村には、ほかに人がいないのか。聞く相手は俺だけかよ！」
    行者は愛想笑いを浮かべた。
    行者「ご仁、そう怒るな。『人に便宜を図れば、自分も便宜を得る』というだろう。地名を教えるぐらい、何の損がある。お前の悩みだって解いてやれるぞ。」
    若者は手から逃れられず、腹を立てて跳びはねた。
    若者「ついてない、ついてない！　主人に理不尽な扱いをされて我慢ならないのに、今度はこのつるっぱげに出くわして、余計な腹を立てさせられる。」
    行者「力があるなら、俺の手を振りほどいて行けばいいさ。」
    若者は右へ左へねじったが、まるで動かせない。鉄の挟みで押さえつけられたようだった。腹立ちまぎれに包みと傘を投げ捨て、両手で雨あられと行者につかみかかった。行者は片手で荷を支え、片手で若者を押さえている。若者がどれだけあがこうと、つかむことができない。行者はなおさら放さず、若者は焦って雷のように怒鳴った。
    三蔵「悟空、あちらから人が来るではないか。その人に聞けばよかろう。いつまでも引き止めてどうする。行かせてあげなさい。」
    行者は笑った。
    行者「お師匠さまにはお分かりにならない。ほかの人に聞いたのでは面白くありません。こいつに聞いてこそ、仕事が転がり込むのです。」
    若者は放してもらえず、仕方なく答えた。
    若者「ここは烏斯蔵国（うしぞうこく）の領内、高老荘（こうろうそう）という所だ。村の家の大半が高姓だから、高老荘と呼ぶのさ。もう行かせてくれ。」
    行者「その身なりじゃ、近くへ出かけるのではあるまい。どこへ行って、いったい何をするのか、本当のことを話せ。そうしたら放してやる。」

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-001"
      "description_ja": "回題の底本は「縛魔歸主」。一般的な「歸正」という表記へ直さず、「主のもとへ帰す」と訳した。ここでいう「主」の指示対象を、題だけから特定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-002"
      "description_ja": "冒頭は内丹の修練を、水と火・陰と陽の調和として詠む詞。「十二時」「百刻」はともに一昼夜を尽くす表現であり、「五年十萬八千周」の五年と十万八千周も原文どおり残した。これを一行の旅の日数や距離に置き換えず、具体的な修練法にも読み替えない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-004"
      "description_ja": "底本は「應鍾氣，閉蟄營。純陰陽，月帝玄溟；盛水德，舜日憐晴。」と区切る。「應鍾」は陰暦十月に配当する律名、「陽月」は同月の別称なので、訳では句読点を越えて「純陰／陽月／帝玄溟」と読む。句の切れ方と「營」の係り方には留保がある。「玄溟」は北方・水の神である玄冥に通じる名と解するが、原字の「溟」と称号の「帝」を残した。「舜日」は聖王の治世のような平穏な日々という賛辞として訳した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-006"
      "description_ja": "都市賛の「四垂華蓋近，百轉紫墟平」は、天子の傘蓋と紫の宮域を用いる荘厳な描写として訳した。語の係り方には幅がある。「未央宮」はこの詩に現れる宮殿名として残し、歴史上の長安や、別の国の同名宮殿との同一性を確定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-011"
      "description_ja": "「奉上心香」は祈る心を香にたとえる表現で、ここでは実際に香を取り出したという動作を補わない。「叩齒三咂」は歯を三度打ち合わせる礼拝の動作として残した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-013"
      "description_ja": "「夜放霞光？」には底本で疑問符があるが、続く昼の描写と並ぶ説明と解して訳した。血の雨は「三年之前」、朝貢の途絶は「這兩年」というまま区別する。「三輩」は寺の僧の三つの代・世代のまとまりと読み、正確な年齢層や人数を補わない。西梁国という表記だけから、既出の女国との同一性を確定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-018"
      "description_ja": "「環絛」は絹の組み紐の帯。「軟公鞋」は漢典で長筒の革靴と説明されるため、普通の草履や室内履きではなく、柔らかな革の長靴とした。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-022"
      "description_ja": "自己紹介は「あちらが奔波児灞、私が灞波児奔」「あちらが鮎魚怪、私が黑魚精」という対応。「鮎魚」はここではナマズ、「黑魚」は雷魚の仲間として訳した。この供述の盗難時期は「前年」、すなわち一昨年であり、僧が先に述べた三年前へそろえない。「二十分人才」は並外れた容貌をいう誇張なので、二十分という数を残す。王母の草は、この供述では淵の底で「養」うというところまでを訳した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-027"
      "description_ja": "三蔵の「昨晚」は「昨夜」とした。先の到着場面では申の刻の前後とされるが、時刻を整えるための補訂はしない。また王の発言では朝貢の途絶も三年とされ、僧の述べた二年とはそろえない。唐の王の病は、ここで王が通行文書を読んで述べる内容として残す。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-028"
      "description_ja": "「八擡八綽」は八人で担ぐこと、または人をうやうやしく担いで運ぶことをいう慣用句。漢典の説明と文脈により八人担ぎとし、二つの八を足して十六人とは断定しない。「大四聲喝路」は四声を大きく響かせる先払いの呼び声として残した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-030"
      "description_ja": "供述は「三載之外，七月初一」、距離は単位を付けず「路有百十」とあるので、三年以上前の七月一日、道のりで百十ばかり、と訳した。すでに朝廷へ来ている場面でも捕縛を「今夜」と述べる点は直さない。共同の供述後は「那怪道」と一匹に戻り、その発言中に初めて自分が奔波児灞だと明示するため、発言前のラベルは一匹の妖怪とした。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch62-1500611"
      "segment_ids":
        - "xy-ch62-031"
      "description_ja": "三蔵は三人の名をまとめて観世音菩薩がつけたと述べる。悟空の命名を語る第二回とは異なるが、ここでの発言を別の説明へ直さない。「和尚」はそれまでの一般的な僧の呼び方とは別に、この発言の中で沙悟浄への呼び名として示される。 本文欠落ではなく解釈・校訂上の留保。"

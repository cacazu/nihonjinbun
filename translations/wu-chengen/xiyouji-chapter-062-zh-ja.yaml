    "kind": "paragraph"
    "origin": "source"
    "source_text": "須臾，至白玉階對國王道：「那妖賊已取來了。」國王下降龍床，與唐僧及文武多官，同目視之。那怪一個是暴腮烏甲，尖嘴利牙；一個是滑皮大肚，巨口長鬚。雖然是有足能行，大抵是變成的人像。國王問曰：「你是何方賊怪，那處妖精？幾年侵吾國土，何年盜我寶貝？一夥共有多少賊徒，都喚做甚麼名字？從實一一供來。」二怪朝上跪下，頸內血淋淋的，更不知疼痛。供道：「三載之外，七月初一，有個萬聖龍王，帥領許多親戚，住居在本國東南，離此處路有百十。潭號碧波，山名亂石。生女多嬌，妖嬈美色。招贅一個九頭駙馬，神通無敵。他知你塔上珍奇，與龍王合盤做賊，先下血雨一場，後把舍利偷訖。見如今照耀龍宮，縱黑夜明如白日。公主施能，寂寂密密，又偷了王母靈芝，在潭中溫養寶物。我兩個不是賊頭，乃龍王差來小卒。今夜被擒，所供是實。」國王道：「既取了供，如何不供自家名字？」那怪道：「我喚做奔波兒灞，他喚做灞波兒奔。奔波兒灞是個鮎魚怪，灞波兒奔是個黑魚精。」國王教錦衣衛好生收監。傳旨：「赦了金光寺眾僧的枷鎖。快教光祿寺排宴，就於麒麟殿上謝聖僧獲賊之功，議請聖僧捕擒賊首。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      やがて白玉の階段に着くと、悟空は王に告げた。
      悟空「妖賊を連れてまいりました。」
      国王は竜の玉座を下り、三蔵や文武の官人たちとともに、そろって妖怪を見た。一匹はえらが張り出し、黒い鱗に覆われ、口先が尖って歯が鋭い。もう一匹は皮膚が滑らかで腹が大きく、口は巨大でひげが長い。足があって歩けはするが、要するに人の姿に化けているのだった。
      国王「お前たちはどの土地の賊怪、どこの妖精か。何年前からわが国へ入り込み、何年にわが宝を盗んだ。一味は全部で何人、みな何という名なのだ。一つ一つ、本当のことを白状せよ。」
      二匹は上座へ向かってひざまずいた。首もとは血が滴っていたが、もはや痛みも感じぬほどで、供述した。
      二匹の妖怪「三年以上前の七月一日、万聖竜王という方が、大勢の親類を率いて、この国の東南、ここから道のりで百十ばかりの所に住んでおりました。淵は碧波潭、山は乱石山と申します。娘はたいそう愛らしく、なまめかしい美貌を持ち、九頭駙馬という、神通力に敵のない婿を迎えました。婿はこの塔に珍しい宝があると知り、竜王とぐるになって盗みを働いたのです。まず血の雨を降らせ、その後で舎利を盗みました。今は竜宮を照らし、真っ暗な夜でも昼間のように明るいのでございます。公主も力を振るい、こっそりひそかに王母さまの霊芝（れいし）を盗んで、淵の中で宝を温め養っています。私たち二人は賊の頭ではなく、竜王に遣わされた小卒です。今夜捕まりましたが、申し上げたことは真実でございます。」
      国王「供述を取ったのに、なぜ自分たちの名を言わぬ。」
      妖怪の一匹「私は奔波児灞、あちらは灞波児奔と申します。奔波児灞はナマズの妖怪、灞波児奔は雷魚の精です。」
      国王は錦衣衛に、厳重に牢へ入れるよう命じ、さらに勅命を下した。
      国王「金光寺の僧たちを赦し、首枷と鎖を外せ。すぐ光禄寺（こうろくじ）に宴を整えさせ、麒麟殿（きりんでん）で聖僧の賊を捕らえた功に謝し、賊の頭を捕らえていただく相談をしよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-031"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "光祿寺即時備了葷素兩樣筵席。國王請唐僧四眾上麒麟殿敘坐，問道：「聖僧尊號？」唐僧合掌道：「貧僧俗家姓陳，法名玄奘。蒙君賜姓唐，賤號三藏。」國王又問：「聖僧高徒何號？」三藏道：「小徒俱無號。第一個名孫悟空，第二個名豬悟能，第三個名沙悟淨：此乃南海觀世音菩薩起的名字。因拜貧僧為師，貧僧又將悟空叫做行者，悟能叫做八戒，悟淨叫做和尚。」國王聽畢，請三藏坐了上席，孫行者坐了側首左席，豬八戒、沙和尚坐了側首右席。俱是素果、素菜、素茶、素飯。前面一席葷的，坐了國王；下首有百十席葷的，坐了文武多官。眾臣謝了君恩，徒告了師罪，坐定。國王把盞，三藏不敢飲酒，他三個各受了安席酒。下邊只聽得管弦齊奏，乃是教坊司動樂。你看八戒放開食嗓，真個是虎咽狼吞，將一席果菜之類，吃得罄盡。少頃間，添換湯飯又來，又吃得一毫不剩。巡酒的來，又杯杯不辭。這場筵席，直樂到午後方散。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      光禄寺はすぐ、肉食と精進の二種類の宴席を用意した。国王は三蔵師弟四人を麒麟殿へ招いて席を定め、尋ねた。
      国王「聖僧は、何というお号でおられる。」
      三蔵は合掌した。
      三蔵「私の俗姓は陳（ちん）、法名は玄奘（げんじょう）と申します。君主より唐（とう）の姓を賜り、つたない号を三蔵と申します。」
      国王「聖僧の高弟は、何という号でおられる。」
      三蔵「弟子には、いずれも号はございません。一番目の名は孫悟空、二番目は猪悟能（ちょごのう）、三番目は沙悟浄と申しまして、南海（なんかい）の観世音菩薩（かんぜおんぼさつ）がおつけになった名です。私を師として拝んだため、私はさらに、悟空を行者（ぎょうじゃ）、悟能（ごのう）を八戒、悟浄（ごじょう）を和尚（おしょう）と呼ぶことにいたしました。」
      王は聞き終えると、三蔵を上座に、悟空を脇の左席に、八戒と沙悟浄を脇の右席に座らせた。いずれも精進の果物、精進の野菜料理、精進の茶、精進の飯である。その向かいの肉料理の席には国王が座り、下座にある百十もの肉料理の席には文武の官人たちが座った。臣下たちは君恩に謝し、弟子たちは師に失礼をわびてから、席に着いた。王が杯を勧めたが、三蔵は酒を飲むのを遠慮し、弟子三人はそれぞれ、席に着いた祝いの酒を受けた。下の方では管弦がいっせいに鳴り出した。教坊司（きょうぼうし）が音楽を奏しているのである。見れば八戒は喉を大きく開き、まさに虎のように飲み込み、狼のようにむさぼって、一卓分の果物や野菜料理をすっかり平らげた。ほどなく汁と飯が改めて運ばれてくると、またもひと粒も残さず食べた。酌をして回る者が来れば、一杯たりとも断らない。宴は、そのまま午後まで楽しんでから、ようやくお開きになった。
    "translation_status": "reviewed"
  - "id": "xy-ch62-032"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏謝了盛宴。國王又留住道：「這一席聊表聖僧獲怪之功。」教光祿寺：「快翻席到建章宮裡，再請聖僧定捕賊首、取寶歸塔之計。」三藏道：「既要捕賊取寶，不勞再宴。貧僧等就此辭王，就擒捉妖怪去也。」國王不肯，一定請到建章宮，又吃了一席。國王舉酒道：「那位聖僧帥眾出師，降妖捕怪？」三藏道：「教大徒弟孫悟空去。」大聖拱手應承。國王道：「孫長老既去，用多少人馬？幾時出城？」八戒忍不住高聲叫道：「那裡用甚麼人馬？又那裡管甚麼時辰？趁如今酒醉飯飽，我共師兄去，手到擒來。」三藏甚喜道：「八戒這一向勤緊啊！」行者道：「既如此，著沙僧弟保護師父，我兩個去來。」那國王道：「二位長老既不用人馬，可用兵器？」八戒笑道：「你家的兵器，我們用不得，我弟兄自有隨身器械。」國王聞說，即取大觥來，與二位長老送行。孫大聖道：「酒不吃了，只教錦衣衛把兩個小妖拿來，我們帶了他去做鑿眼。」國王傳旨，即時提出。二人扯著兩個小妖，駕風頭，使個攝法，徑上東南去了。噫！他那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      三蔵は盛大な宴に礼を述べた。王はまた引き止めた。
      国王「この一席は、聖僧が妖怪を捕らえた功に、ささやかな感謝を表したにすぎぬ。」
      さらに光禄寺へ命じた。
      国王「すぐ建章宮（けんしょうきゅう）に席を改め、もう一度聖僧をお招きし、賊の頭を捕らえて宝を塔へ戻す策を定めていただこう。」
      三蔵「賊を捕らえて宝を取るのでしたら、重ねての宴には及びません。私どもはここでおいとまし、ただちに妖怪を捕らえにまいりましょう。」
      王は聞き入れず、どうしてもと建章宮へ招き、さらにもう一席の食事をした。王は杯を挙げた。
      国王「どちらの聖僧が軍勢を率いて出陣し、妖魔を降して怪物を捕らえてくださるのか。」
      三蔵「一番弟子の孫悟空に行かせましょう。」
      悟空は拱手して引き受けた。
      国王「孫長老（そんちょうろう）が行かれるのであれば、兵馬はどれほどお入り用か。いつ城を出られる。」
      八戒はこらえきれず、大声を上げた。
      八戒「兵馬なんて、どこに必要があるんです。時刻なんて、何を気にするんです。ちょうど今、酒も入って腹もいっぱいだ。俺が兄貴と行けば、手を伸ばすなり捕まえてみせますよ。」
      三蔵は大いに喜んだ。
      三蔵「八戒は、このところよく励んでくれますね。」
      悟空「それなら、沙悟浄はお師匠さまをお守りしてくれ。俺たち二人で行ってくる。」
      国王「お二人が兵馬をお使いにならぬなら、武器は要られるか。」
      八戒は笑った。
      八戒「お国の武器は、俺たちには使えませんよ。俺たち兄弟弟子は、自分の得物を身につけてます。」
      王は聞くと、大きな杯を取らせ、二人を見送る酒を勧めた。
      悟空「酒はもう結構です。ただ、錦衣衛に二匹の小妖を連れてこさせてください。手引き役に連れていきます。」
      王が命じると、ただちに二匹が引き出された。悟空と八戒はそれぞれ小妖を引っ張り、風に乗り、引き連れる術を使って、まっすぐ東南へ飛んでいった。ああ、まさに、
    "translation_status": "reviewed"

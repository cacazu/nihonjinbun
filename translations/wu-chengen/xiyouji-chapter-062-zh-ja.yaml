    "source_text": "八戒、沙僧聽得喝道，只說是國王差官，急出迎接，原來是行者坐在轎上。獃子當面笑道：「哥哥，你得了本身也。」行者下了轎，攙著八戒道：「我怎麼得了本身？」八戒道：「你打著黃傘，擡著八人轎，卻不是猴王之職分？故說你得了本身。」行者道：「且莫取笑。」遂解下兩個妖物，押見國王。沙僧道：「哥哥，也帶挈小弟帶挈。」行者道：「你只在此看守行李、馬匹。」那枷鎖之僧道：「爺爺們都去承受皇恩，等我們在此看守。」行者道：「既如此，等我去奏過國王，卻來放你。」八戒揪著一個妖賊，沙僧揪著一個妖賊，孫大聖依舊坐了轎，擺開頭搭，將兩個妖怪押赴當朝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      八戒と沙悟浄は先払いの声を聞き、王が役人を遣わしたのだと思って、急いで出迎えた。ところが、輿に乗っていたのは悟空だった。八戒は面と向かって笑った。
      八戒「兄貴、本来の身分を取り戻したな。」
      悟空は輿を下り、八戒を支えるように手を添えた。
      悟空「どうして俺が、本来の身分を取り戻したんだ。」
      八戒「黄色い傘を差しかけてもらい、八人担ぎの輿に乗ってるじゃないか。そりゃ猿の王さまにふさわしい待遇だろう。だから本来の身分に戻ったって言ったのさ。」
      悟空「からかうのは、それくらいにしろ。」
      そこで二匹の妖怪を解き、王の前へ引き立てることにした。
      沙悟浄「兄さん、私もお引き立てください。連れていってくださいよ。」
      悟空「お前はここで、荷物と馬を守っていろ。」
      枷と鎖をつけた僧「皆さまはそろって、王さまのお恵みをお受けください。私どもがここで見張っております。」
      悟空「それなら、俺が王に奏上したら、戻ってきてお前たちを解き放とう。」
      八戒が妖賊を一匹つかみ、沙悟浄がもう一匹をつかんだ。悟空は再び輿に乗り、先導の儀仗を並べて、二匹の妖怪を朝廷へ護送した。
    "translation_status": "reviewed"
  - "id": "xy-ch62-030"

    "translation_ja": |-
      第六十二回
      垢を落とし心を洗うにはひたすら塔を掃き　魔を縛り主のもとへ帰すことこそ身を修める道
    "translation_status": "reviewed"
  - "id": "xy-ch62-002"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      十二時中忘不得，行功百刻全收。五年十萬八千周，休教神水涸，莫縱火光愁。
      水火調停無損處，五行聯絡如鉤。陰陽和合上雲樓，乘鸞登紫府，跨鶴赴瀛洲。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 122
        "line_end": 123
    "translation_ja": |-
      一日の十二時辰（じしん）、ひとときも忘れてはならぬ。
      百刻（ひゃっこく）を通して修行し、その功を余さず収めよ。
      五年のあいだに十万八千たび巡らせ、
      神水（しんすい）を枯らすことなく、
      火の光を放って憂いを招くこともないように。
      水と火を調えて損なうところなく、
      五行（ごぎょう）を鉤の鎖のようにつなぎ合わせる。
      陰陽（いんよう）が和合すれば雲の楼閣へ上り、
      鸞（らん）に乗って紫府（しふ）へ登り、
      鶴を駆って瀛洲（えいしゅう）へ赴く。
    "translation_status": "reviewed"
  - "id": "xy-ch62-003"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這一篇詞，牌名《臨江仙》，單道唐三藏師徒四眾水火既濟，本性清涼。借得純陰寶扇，搧息燥火過山。不一日行過了八百之程，師徒們散誕逍遙，向西而去。正值秋末冬初時序，見了些："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 125
        "line_end": 125
    "translation_ja": "この一篇は、「臨江仙（りんこうせん）」という詞の調べである。語っているのは、三蔵（さんぞう）師弟四人の水と火がほどよく調い、本来の性が清らかに涼しくなったということ。純陰の宝の扇を借り、燃え盛る火をあおぎ消して山を越えたのだ。ほどなく八百里（り）の道のりを過ぎ、一行はのびのびと気ままに、西へ向かった。ちょうど秋の終わりから冬の初めへ移る季節で、こんな景色が目に入った。"
    "translation_status": "reviewed"
  - "id": "xy-ch62-004"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": "野菊殘英落，新梅嫩蕊生。村村納禾稼，處處食香羹。平林木落遠山現，曲澗霜濃幽壑清。應鍾氣，閉蟄營。純陰陽，月帝玄溟；盛水德，舜日憐晴。地氣下降，天氣上升。虹藏不見影，池沼漸生冰。懸崖掛索藤花敗，松竹凝寒色更青。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      野菊に残った花は散り、梅には新しい柔らかな蕾が生まれる。
      村々は穀物を取り入れ、どこでも香りのよい汁物を食べている。
      平地の林は葉を落として遠い山を見せ、曲がり流れる谷川には霜が深く、奥の谷は澄みきる。
      応鐘（おうしょう）の気が巡り、生き物は巣を閉じて冬ごもりする。
      陰の満ちる陽月（ようげつ）、その帝は玄溟（げんめい）。
      水の徳は盛んに、舜（しゅん）の世のような日々は晴天を慈しむ。
      大地の気は下へ降り、天の気は上へ昇る。
      虹は隠れて影もなく、池や沼には次第に氷が張る。
      断崖に縄のように垂れる藤は花を失い、松竹は寒さを凝らしていよいよ青い。
    "translation_status": "reviewed"
  - "id": "xy-ch62-005"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾行夠多時，前又遇城池相近。唐僧勒住馬，叫徒弟：「悟空，你看那廂樓閣崢嶸，是個甚麼去處？」行者擡頭觀看，乃是一座城池。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      四人がかなり長く歩いていると、またも前方に城が近づいてきた。三蔵は馬の手綱を引き、弟子を呼んだ。
      三蔵「悟空（ごくう）、あちらに楼閣が高くそびえているが、あれは何という所ですか。」
      悟空が顔を上げて眺めると、そこには城郭があった。まさしく、こんなありさまである。
    "translation_status": "reviewed"
  - "id": "xy-ch62-006"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": "龍蟠形勢，虎踞金城。四垂華蓋近，百轉紫墟平。玉石橋欄排巧獸，黃金臺座列賢明。真個是神洲都會，天府瑤京。萬里邦畿固，千年帝業隆。蠻夷拱服君恩遠，海岳朝元聖會盈。御階潔淨，輦路清寧。酒肆歌聲鬧，花樓喜氣生。未央宮外長春樹，應許朝陽彩鳳鳴。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      竜がわだかまる地勢、虎がうずくまる堅固な都。
      四方には天子の華蓋が間近に見え、幾重にも巡る紫の御所は平らかだ。
      玉石の橋の欄干には巧みな獣の彫刻が並び、黄金の台座には賢者たちが列をなす。
      まことに神の地の大都会、天の府にも等しい玉の都。
      万里の王土は堅く守られ、千年の帝業は栄える。
      異民族は手を拱いて服し、君恩は遠くに及ぶ。海や山からも天子を仰ぎ、聖なる集いを満たす。
      御殿の階段は清潔で、御車の道も清らかに静まる。
      酒場には歌声がにぎわい、華やかな楼には喜びが満ちる。
      未央宮（びおうきゅう）の外の、春を絶やさぬ木には、朝日に向かって色鮮やかな鳳凰も鳴こう。
    "translation_status": "reviewed"
  - "id": "xy-ch62-007"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「師父，那座城池是一國帝王之所。」八戒笑道：「天下府有府城，縣有縣城，怎麼就見是帝王之所？」行者道：「你不知帝王之居，與府縣自是不同。你看他四面有十數座門，週圍有百十餘里，樓臺高聳，雲霧繽紛。非帝京邦國，何以有此壯麗？」沙僧道：「哥哥眼明，雖識得是帝王之處，卻喚做甚麼名色？」行者道：「又無牌匾旌號，何以知之？須到城中詢問，方可知也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      悟空「お師匠さま、あの城は一国の帝王のお住まいです。」
      八戒（はっかい）は笑った。
      八戒「世の中には、府には府の城、県には県の城があるじゃないか。どうして帝王の住まいだと見て取れるんだい。」
      悟空「お前は知らないんだ。帝王の住まいは、府や県とはおのずと違う。見ろ、四方には十数か所の門があり、周囲は百十余里、楼台は高くそびえ、雲や霧が入り乱れている。国の都でなければ、どうしてこれほど壮麗なんだ。」
      沙悟浄（さごじょう）「兄さんは目がいい。帝王のおられる所だと分かるのは結構ですが、何という名なのでしょう。」
      悟空「額も旗印もないのに、どうして分かる。城内に入って尋ねて、初めて分かることさ。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-008"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老策馬，須臾到門。下馬過橋，進門觀看。只見六街三市，貨殖通財；又見衣冠隆盛，人物豪華。正行時，忽見有十數個和尚，一個個披枷戴鎖，沿門乞化，著實的藍縷不堪。三藏嘆曰：「兔死狐悲，物傷其類。」叫：「悟空，你上前去問他一聲，為何這等遭罪？」行者依言，即叫：「那和尚，你是那寺裡的？為甚事披枷戴鎖？」眾僧跪倒道：「爺爺，我等是金光寺負屈的和尚。」行者道：「金光寺坐落何方？」眾僧道：「轉過隅頭就是。」行者將他帶在唐僧前，問道：「怎生負屈，你說我聽。」眾僧道：「爺爺，不知你們是那方來的，我等似有些面善。不敢在此奉告，請到荒山，具說苦楚。」長老道：「也是，我們且到他那寺中去，仔細詢問緣由。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      三蔵は馬を進め、ほどなく門に着いた。馬を下りて橋を渡り、門内に入って眺めると、あちこちの通りや市場では商品が行き交い、財貨が流通している。人々の身なりは立派で、暮らしぶりも華やかだった。歩いていると、ふいに十数人の僧が目に入った。一人残らず首枷と鎖をつけ、家々の門を回って施しを求めており、そのぼろぼろの身なりは見るに堪えない。
      三蔵は嘆いた。
      三蔵「兎が死ねば狐も悲しむ。同類の苦しみには胸が痛むものです。」
      三蔵「悟空、前へ行って、どうしてこんな苦しい目に遭っているのか、尋ねてください。」
      悟空は言われたとおり声をかけた。
      悟空「そこのお坊さんたち、どこの寺の者だ。何のために首枷と鎖をつけられている。」
      僧たちはひざまずいた。
      僧たち「お方さま、私どもは金光寺（きんこうじ）の、無実の罪を着せられた僧でございます。」
      悟空「金光寺はどこだ。」
      僧たち「あの角を曲がった所でございます。」
      悟空は僧たちを三蔵の前へ連れてきて尋ねた。
      悟空「どんな無実の罪だ。俺に話してみろ。」
      僧たち「お方さま、どちらからおいでになったのかは存じませんが、私どもには、どこか見覚えがある気がいたします。ここでは申し上げかねます。どうぞ私どもの寺へおいでください。苦しみの次第を、詳しくお話しします。」
      三蔵「もっともです。まずはお寺へ行って、詳しい事情を尋ねるとしましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-009"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "同至山門，門上橫寫七個金字：「敕建護國金光寺」。師徒們進得門來觀看，但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 136
        "line_end": 136
    "translation_ja": "一緒に山門へ行くと、門の上には「勅建護国金光寺（ちょくけんごこくきんこうじ）」という七文字が金色で横書きされていた。師弟が門の中に入って見ると、そのありさまはこうだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch62-010"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": "古殿香燈冷，虛廊葉掃風。凌雲千尺塔，養性幾株松。滿地落花無客過，簷前蛛網任攀籠。空架鼓，枉懸鐘，繪壁塵多彩像朦。講座幽然僧不見，禪堂靜矣鳥常逢。淒涼堪歎息，寂寞苦無窮。佛前雖有香爐設，灰冷花殘事事空。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      古びた仏殿には香も灯も冷たく、人気のない廊下では風が落葉を掃く。
      雲をしのぐ千尺（しゃく）の塔、心を養う幾株かの松。
      地に花が散り敷いても客は通らず、軒先では蜘蛛の巣が好きなだけ張り巡らされる。
      太鼓はむなしく掛けられ、鐘もいたずらにつるされる。絵のある壁は塵深く、彩色の仏像もかすんでいる。
      講座はひっそりとして僧の姿なく、禅堂は静まり、出会うのはいつも鳥ばかり。
      この荒れ果てた姿は嘆かわしく、寂しさと苦しみには果てがない。
      仏前に香炉は置かれていても、灰は冷え、花はしおれ、何もかもむなしい。
    "translation_status": "reviewed"
  - "id": "xy-ch62-011"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏心酸，止不住眼中出淚。眾僧們頂著枷鎖，將正殿推開，請長老上殿拜佛。長老進殿，奉上心香，叩齒三咂。卻轉於後面，見那方丈簷柱上又鎖著六七個小和尚，三藏甚不忍見。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 139
        "line_end": 139
    "translation_ja": "三蔵は胸が痛み、目から流れる涙を止められなかった。僧たちは首枷と鎖をつけたまま本堂の戸を押し開け、三蔵に中へ入って仏を拝むよう勧めた。三蔵は堂内へ進み、祈りの心を香として捧げ、歯を三度かちりと打ち合わせた。それから裏へ回ると、方丈（ほうじょう）の軒柱には、さらに六、七人の小僧が鎖でつながれている。三蔵には、とても見ていられなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch62-012"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "及到方丈，眾僧俱來叩頭，問道：「列位老爺像貌不一，可是東土大唐來的麼？」行者笑道：「這和尚有甚未卜先知之法？我們正是。你怎麼認得？」眾僧道：「爺爺，我等有甚未卜先知之法？只是痛負了屈苦，無處分明，日逐家只是叫天叫地。想是驚動天神，昨日夜間，各人都得一夢：說有個東土大唐來的聖僧，救得我等性命，庶此冤苦可伸。今日果見老爺這般異像，故認得也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      方丈に入ると、僧たちはみなやってきて頭を下げ、尋ねた。
      僧たち「皆さまは、それぞれ違ったお姿をしておられますが、もしや東土（とうど）の大唐（だいとう）からおいでですか。」
      悟空は笑った。
      悟空「このお坊さんたちには、占わずに先を知る術でもあるのか。まさにそのとおりだ。どうして分かった。」
      僧たち「お方さま、私どもに、占わずに先を知るような術などございません。ただ、ひどく無実の罪に苦しめられ、訴えを明らかにする所もなく、日々、天や地に呼びかけてばかりおりました。それが天の神々のお耳に届いたのでしょうか、昨夜は一人一人がみな、ある夢を見たのです。東土の大唐から来る聖僧が私どもの命を救い、この冤罪の苦しみを晴らしてくださる、という夢でした。今日は果たして皆さまのような並々ならぬお姿を拝見しましたので、そうと分かったのでございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-013"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，大喜道：「你這裡是何地方？有何冤屈？」眾僧跪告：「爺爺，此城名喚祭賽國，乃西邦大去處。當年有四夷朝貢：南，月陀國；北，高昌國；東，西梁國；西，本缽國。年年進貢美玉、明珠、嬌妃、駿馬。我這裡不動干戈，不去征討，他那裡自然拜為上邦。」三藏道：「既拜為上邦，想是你這國王有道，文武賢良。」眾僧道：「爺爺，文也不賢，武也不良，國君也不是有道。我這金光寺，自來寶塔上祥雲籠罩，瑞靄高升：夜放霞光？萬里有人曾見；晝噴彩氣，四國無不同瞻。故此以為天府神京，四夷朝貢。只是三年之前，孟秋朔日，夜半子時，下了一場血雨。天明時，家家害怕，戶戶生悲。眾公卿奏上國王，不知天公甚事見責。當時延請道士打醮，和尚看經，答天謝地。誰曉得我這寺裡黃金寶塔污了，這兩年外國不來朝貢。我王欲要征伐，眾臣諫道：我寺裡僧人偷了塔上寶貝，所以無祥雲瑞靄，外國不朝。昏君更不察理。那些贓官將我僧眾拿了去，千般拷打，萬樣追求。當時我這裡有三輩和尚：前兩輩已被拷打不過，死了；如今又捉我輩，問罪枷鎖。老爺在上，我等怎敢欺心，盜取塔中之寶！萬望爺爺憐念，方以類聚，物以群分，捨大慈大悲，廣施法力，拯救我等性命。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      三蔵は聞くと、大いに喜んだ。
      三蔵「ここは何という所ですか。どんな無実の罪を着せられたのですか。」
      僧たちはひざまずいて申し上げた。
      僧たち「お方さま、この城は祭賽国（さいさいこく）といい、西方では大きな所でございます。かつては四方の国々が朝貢してまいりました。南には月陀国（げつだこく）、北には高昌国（こうしょうこく）、東には西梁国（せいりょうこく）、西には本鉢国（ほんぱつこく）があり、毎年、美しい玉、輝く真珠、美貌の妃、駿馬を貢いでおりました。この国から武器を取ることも、征伐に赴くこともなく、あちらから自然に上国と仰いだのです。」
      三蔵「上国と仰がれていたのなら、この国の王は道にかなった政治を行い、文武の臣も賢く立派なのでしょう。」
      僧たち「お方さま、文官は賢くもなく、武官も立派ではありません。国王も道にかなった君主ではございません。この金光寺では、昔から宝塔をめでたい雲が包み、吉祥の霞が高く立ち昇っておりました。夜は霞のような光を放ち、万里先でも見た者があり、昼は彩り豊かな気を噴き上げ、四か国のどこからも等しく仰がれていたのです。そのため、ここを天の府、神の都として、四方の国々が朝貢していたのでございます。ところが三年前、秋の最初の月の一日、真夜中の子の刻（ねのこく）に、血の雨が降りました。夜が明けると、どの家も恐れおののき、どの家でも悲しみに暮れました。公卿たちは王に奏上しましたが、天が何をおとがめになったのか分かりません。その時は道士を招いて祭壇の祈祷をさせ、僧には読経させて、天地におわびをしました。ところが何と、この寺の黄金の宝塔が汚されていたのです。この二年間は、外国が朝貢に来なくなりました。王が征伐しようとなさると、臣下たちは、『あの寺の僧どもが塔の宝を盗んだために、めでたい雲も吉祥の霞も消え、外国が朝貢しないのです』と諫めました。暗愚な王は、道理を調べもしません。汚職役人どもは僧たちを捕らえ、あらゆる拷問を加え、ありとあらゆる責め方で取り調べました。その頃この寺には三つの代にわたる僧がおりましたが、前の二代は拷問に耐えられず死んでしまいました。今度は私どもの代を捕らえて罪を問い、首枷と鎖をかけたのです。お方さまを前に、私どもがどうして良心を欺き、塔の宝を盗むようなまねをいたしましょう。どうかお憐れみください。同じ性のものは集まり、同じ類のものは群れると申します。大慈悲をおかけくださり、広い法力を振るって、私どもの命をお救いください。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-014"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，點頭歎道：「這樁事暗昧難明。一則是朝廷失政，二來是汝等有災。既然天降血雨，污了寶塔，那時節何不啟本奏君，致令受苦？」眾僧道：「爺爺，我等凡人，怎知天意？況前輩俱未辨得，我等如何處之？」三藏道：「悟空，今日甚時分了？」行者道：「有申時前後。」三藏道：「我欲面君倒換關文，奈何這眾僧之事不得明白，難以對君奏言。我當時離了長安，在法門寺裡立願：上西方逢廟燒香，遇寺拜佛，見塔掃塔。今日至此，遇有受屈僧人，乃因寶塔之累。你與我辦一把新笤帚，待我沐浴了，上去掃掃，即看這污穢之事何如，不放光之故何如，訪著端的，方好面君奏言，解救他們這苦難也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      三蔵はうなずいて嘆いた。
      三蔵「この件は闇に包まれ、はっきりさせにくい。一つには朝廷の政治が誤り、もう一つにはあなた方に災いが降りかかったのです。天から血の雨が降って宝塔が汚れたのなら、なぜその時に文書で王へ訴えず、こんな苦しみを受けることになったのですか。」
      僧たち「お方さま、私どもはただの人間で、どうして天のお心が分かりましょう。それに、先輩方も明らかにできなかったのに、私どもがどう対処できましょうか。」
      三蔵「悟空、今は何時ごろですか。」
      悟空「申の刻（さるのこく）の前後でしょう。」
      三蔵「王にお目通りして通行文書を改めたいのですが、この僧たちの一件が明らかでなくては、王へ申し上げにくい。私は長安（ちょうあん）を出た時、法門寺（ほうもんじ）で誓いを立てました。西へ赴く道で、廟に会えば香をたき、寺に会えば仏を拝み、塔を見れば塔を掃く、と。今日ここへ来て無実の罪に苦しむ僧たちに出会ったのも、宝塔が原因です。新しいほうきを一本用意してください。沐浴を済ませたら上へ行って掃き、この汚れとはどんなものか、光らなくなった理由は何か、調べてみましょう。真相を確かめれば、王にお目通りして申し上げ、皆さんをこの苦難から救うことができます。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-015"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這些枷鎖的和尚聽說，連忙去廚房取把廚刀，遞與八戒道：「爺爺，你將此刀打開那柱子上鎖的小和尚鐵鎖，放他去安排齋飯香湯，伏侍老爺進齋沐浴。我等且上街化把新笤帚來與老爺掃塔。」八戒笑道：「開鎖有何難哉？不用刀斧，教我那一位毛臉老爺，他是開鎖的積年。」行者真個近前，使個解鎖法，用手一抹，幾把鎖俱退落下。那小和尚俱跑到廚中，淨刷鍋灶，安排茶飯。三藏師徒們吃了齋，漸漸天昏。只見那枷鎖的和尚拿了兩把笤帚進來，三藏甚喜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      首枷と鎖をつけた僧たちはそれを聞くと、急いで台所から包丁を取ってきて、八戒に差し出した。
      僧たち「お方さま、この包丁で、柱につながれている小僧たちの鉄の錠を壊してください。解き放って、精進料理と香りのよい湯を用意させ、皆さまのお食事と沐浴のお世話をさせましょう。私どもは町へ行って、新しいほうきを一本喜捨してもらい、お方さまの塔掃きにお供えいたします。」
      八戒は笑った。
      八戒「錠を開けるくらい、何でもないさ。刀も斧もいらない。あそこにいる毛むくじゃらの顔のお方さまにやらせなよ。あの人は錠を開ける大ベテランだ。」
      悟空は本当に近寄って解錠の術を使い、手でさっとなでた。すると、幾つもの錠は残らず外れて落ちた。小僧たちはみな台所へ走り、鍋やかまどをきれいに洗って、お茶と食事を整えた。三蔵師弟が精進の食事を済ませると、次第に日が暮れた。そこへ首枷と鎖をつけた僧たちがほうきを二本持って帰り、三蔵は大いに喜んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch62-016"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，一個小和尚點了燈來請洗澡。此時滿天星月光輝，譙樓上更鼓齊發。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"

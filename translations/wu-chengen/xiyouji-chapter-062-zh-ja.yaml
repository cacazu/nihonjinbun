        "line_start": 146
        "line_end": 146
    "translation_ja": "こう話しているところへ、小僧が一人、灯をともして、入浴を勧めに来た。その頃には満天の星と月が輝き、物見の楼では夜の時を告げる太鼓がいっせいに鳴っていた。まさしく、"
    "translation_status": "reviewed"
  - "id": "xy-ch62-017"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      四壁寒風起，萬家燈火明。
      六街關戶牖，三市閉門庭。
      釣艇歸深樹，耕犁罷短繩。
      樵夫柯斧歇，學子誦書聲。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 148
        "line_end": 151
    "translation_ja": |-
      四方の壁に寒風が吹き起こり、家々には灯がともる。
      あちこちの通りでは戸も窓も閉じ、市場という市場は門を閉ざす。
      釣り舟は深い木立のもとへ帰り、耕す犁も短い引き綱を休める。
      木こりは斧の柄を置いて休み、学ぶ者が書を読む声がする。
    "translation_status": "reviewed"
  - "id": "xy-ch62-018"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏沐浴畢，穿了小袖褊衫，束了環絛，足下換一雙軟公鞋，手裡拿一把新笤帚，對眾僧道：「你等安寢，待我掃塔去來。」行者道：「塔上既被血雨所污，又況日久無光，恐生惡物；一則夜靜風寒，又沒個伴侶：自去恐有差池，老孫與你同上如何？」三藏道：「甚好，甚好。」兩人各持一把，先到大殿上，點起琉璃燈，燒了香，佛前拜道：「弟子陳玄奘奉東土大唐差往靈山參見我佛如來取經，今至祭賽國金光寺，遇本僧言寶塔被污，國王疑僧盜寶，啣冤取罪，上下難明。弟子竭誠掃塔，望我佛威靈，早示污塔之原因，莫致凡夫之冤屈。」祝罷，與行者開了塔門，自下層望上而掃。只見這塔，真是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      三蔵は沐浴を終えると、袖の狭い僧衣を着て、絹を組んだ帯を締め、足には柔らかな革の長靴一足を履き、新しいほうきを一本手にした。
      三蔵「皆さんは安心してお休みください。私は塔を掃いてきます。」
      悟空「塔は血の雨に汚されたうえ、長いこと光を失っています。悪いものが棲みついているかもしれません。それに、夜は静まり風も冷たいのに、連れもおられない。一人で行かれて何かあっては心配です。私も一緒に上りましょうか。」
      三蔵「それはよい、それはよい。」
      二人はそれぞれほうきを一本持ち、まず本堂へ行って瑠璃の灯をともし、香をたいた。仏前で拝み、三蔵は祈った。
      三蔵「弟子、陳玄奘（ちんげんじょう）は、東土の大唐の命を受け、霊山（れいざん）へ赴き、わが仏如来（にょらい）を拝して経をいただこうとしております。今、祭賽国の金光寺へ参りましたところ、ここの僧から、宝塔が汚されたと聞きました。王は僧が宝を盗んだと疑い、僧たちは無実の罪を受け、上も下も真相を明らかにできずにおります。弟子は誠を尽くして塔を掃きます。どうか仏の威霊により、塔が汚れた原因を早くお示しくださり、ただの人間に無実の苦しみをお受けさせになりませんように。」
      祈りを終えると、悟空と塔の戸を開け、下の階から上へと掃いていった。さて、この塔のありさまはこうである。
    "translation_status": "reviewed"
  - "id": "xy-ch62-019"
    "section_id": "chapter-62"
    "kind": "verse"
    "origin": "source"
    "source_text": "崢嶸倚漢，突兀凌空。正喚做五色琉璃塔，千金舍利峰。梯轉如穿窟，門開似出籠。寶瓶影射天邊月，金鐸聲傳海上風。但見那虛簷拱斗，絕頂留雲。虛簷拱斗，作成巧石穿花鳳；絕頂留雲，造就浮屠遶霧龍。遠眺可觀千里外，高登似在九霄中。層層門上琉璃燈，有塵無火；步步簷前白玉欄，積垢飛蟲。塔心裡，佛座上，香煙盡絕；窗櫺外，神面前，蛛網牽朦。爐中多鼠糞，盞內少油鎔。只因暗失中間寶，苦殺僧人命落空。三藏發心將塔掃，管教重見舊時容。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      高くそびえて天の川に寄りかかり、ひときわ空へ突き出している。
      これぞ五色の瑠璃塔、千金にも値する舎利（しゃり）の峰。
      階段を曲がれば洞穴をくぐるようで、戸を開けば籠から出るようだ。
      頂の宝瓶（ほうびょう）の影は天辺の月に映り、金の鈴の音は海からの風に運ばれる。
      見れば、高い軒には斗栱（ときょう）が組まれ、絶頂には雲がとどまる。
      高い軒の斗栱は、巧みに石を彫って花をくぐる鳳凰をなし、
      雲をとどめる絶頂は、霧を巡らす竜のように仏塔を形づくる。
      遠くを見渡せば千里の外まで眺められ、高く登れば九重の天の中にいるようだ。
      階ごとの戸の上の瑠璃の灯には、塵ばかりで火はない。
      歩を進めるごとに軒先の白玉の欄干には、垢が積もって虫が飛ぶ。
      塔の中、仏の台座の上では、香の煙がすっかり絶え、
      窓の格子の外、神の前には、蜘蛛の巣が張って姿を覆う。
      香炉の中には鼠の糞が多く、灯皿の中には油も乏しい。
      ただひそかに中の宝を失ったばかりに、僧たちは苦しめ殺され、命をむなしく散らした。
      三蔵が心を起こして塔を掃けば、きっと昔の姿が再び現れよう。
    "translation_status": "reviewed"
  - "id": "xy-ch62-020"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧用帚子掃了一層，又上一層。如此掃至第七層上，卻早二更時分。那長老漸覺困倦，行者道：「困了，你且坐下，等老孫替你掃罷。」三藏道：「這塔是多少層數？」行者道：「怕不有十三層哩。」長老耽著勞倦道：「是必掃了，方趁本願。」又掃了三層，腰酸腿痛，就於十層上坐倒道：「悟空，你替我把那三層掃淨下來罷。」行者抖擻精神，登上第十一層，霎時又上到第十二層。正掃處，只聽得塔頂上有人言語。行者道：「怪哉！怪哉！這早晚有三更時分，怎麼得有人在這頂上言語？斷乎是邪物也，且看看去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      三蔵はほうきで一層を掃くと、また一層上へ進んだ。こうして七層目まで掃いた頃には、早くも二更（にこう）になっていた。三蔵がだんだん疲れを覚えたので、悟空が言った。
      悟空「お疲れなら、しばらくお座りください。私が代わって掃きましょう。」
      三蔵「この塔は、何層あるのですか。」
      悟空「十三層はありましょう。」
      三蔵は疲れをこらえて言った。
      三蔵「どうしても掃ききってこそ、もとの願いを果たせます。」
      さらに三層を掃くと、腰はうずき、脚も痛み、とうとう十層目に座り込んだ。
      三蔵「悟空、あとの三層は、私の代わりにきれいに掃いて下りてきてください。」
      悟空は元気を奮い起こして十一層目へ上り、たちまち十二層目へ進んだ。掃いていると、塔の頂で誰かが話す声が聞こえた。
      悟空「おかしいぞ、おかしいぞ！　今はもう三更（さんこう）の頃だ。どうして塔のてっぺんで話をしている者がいる。きっと邪悪なものだな。ひとまず、見に行ってみよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-021"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好猴王，輕輕的挾著笤帚，撒起衣服，鑽出前門，踏著雲頭觀看。只見第十三層塔心裡坐著兩個妖精，面前放一盤下飯、一隻碗、一把壺，在那裡猜拳吃酒哩。行者使個神通，丟了笤帚，掣出金箍棒，攔住塔門，喝道：「好怪物，偷塔上寶貝的原來是你。」兩個怪物慌了，急起身，拿壺拿碗亂摜。被行者橫鐵棒攔住道：「我若打死你，沒人供狀。」只把棒逼將去。那怪貼在壁上，莫想掙扎得動。口裡只叫：「饒命，饒命。不干我事，自有偷寶貝的在那裡也。」行者使個拿法，一隻手抓將過來，徑拿下第十層塔中，報道：「師父，拿住個偷寶貝之賊了。」三藏正自盹睡，忽聞此言，又驚又喜道：「是那裡拿來的？」行者把怪物揪到面前跪下道：「他在塔頂上猜拳吃酒耍子，是老孫聽得喧譁，一縱雲，跳到頂上攔住。未曾著力，但恐一棒打死，沒人供狀，故此輕輕捉來。師父可取他個口詞，看他是那裡妖精，偷的寶貝在於何處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      さすがは悟空。そっとほうきを脇に挟み、衣の裾をからげ、表の戸から身をくぐらせて出ると、雲に乗って様子を見た。十三層目の中央には妖怪が二匹座り、目の前に酒の肴を一皿、碗を一つ、酒壺を一つ並べ、拳遊びをして酒を飲んでいる。悟空は神通力を振るい、ほうきを投げ出して金箍棒（きんこぼう）を抜き、塔の戸をふさいで怒鳴った。
      悟空「この妖怪ども！　塔の宝を盗んだのは、やはりお前たちだったか。」
      二匹は慌てて立ち上がり、壺や碗をつかんでめったやたらに投げつけた。悟空は鉄棒を横にして行く手をふさいだ。
      悟空「俺が殴り殺しちまったら、供述する奴がいなくなる。」
      ただ棒でじりじりと押し迫ると、妖怪は壁に押しつけられ、もがいて逃れようにも動けなかった。
      妖怪「お命ばかりは、お命ばかりは！　私にはかかわりのないことです。宝を盗んだ者は、ちゃんと別の所におります。」
      悟空は捕縛の術を使い、片手でつかむと、そのまま塔の十層目へ連れ下りて報告した。
      悟空「お師匠さま、宝を盗んだ賊を捕まえました。」
      三蔵はちょうどうとうとしていたが、突然その言葉を聞き、驚くと同時に喜んだ。
      三蔵「どこで捕まえてきたのですか。」
      悟空は妖怪を前へ引きずってひざまずかせた。
      悟空「塔の頂で、拳遊びをしながら酒を飲んで遊んでいたのです。騒ぎ声が聞こえたので、雲に乗ってひと跳びに頂へ上がり、逃げ道をふさぎました。力は込めていません。一撃で殺してしまっては供述を取れないと思い、軽く捕まえてきたのです。お師匠さま、この者から供述をお取りください。どこの妖怪で、盗んだ宝がどこにあるかを。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-022"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪物戰戰兢兢，口叫「饒命」，遂從實供道：「我兩個是亂石山碧波潭萬聖龍王差來巡塔的。他叫做奔波兒灞，我叫做灞波兒奔；他是鮎魚怪，我是黑魚精。因我萬聖老龍生了一個女兒，就喚做萬聖公主。那公主花容月貌，有二十分人才。招得一個駙馬，喚做九頭駙馬，神通廣大。前年與龍王來此，顯大法力，下了一陣血雨，污了寶塔，偷了塔中的舍利子佛寶。公主又去大羅天上，靈霄殿前，偷了王母娘娘的九葉靈芝草，養在那潭底下，金光霞彩，晝夜光明。近日聞得有個孫悟空往西天取經，說他神通廣大，沿路上專一尋人的不是，所以這些時常差我等來此巡探，若還有那孫悟空到時，好準備也。」行者聞言，嘻嘻冷笑道：「那孽畜等這等無禮，怪道前日請牛魔王在那裡赴會，原來他結交這夥潑魔，專幹不良之事。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      その妖怪はがたがたと震え、口では「お命ばかりは」と叫びながら、とうとう本当のことを白状した。
      妖怪「私たち二人は、乱石山（らんせきざん）の碧波潭（へきはたん）においでの万聖竜王（ばんせいりゅうおう）に遣わされて、塔を見回りに来たのです。あちらは奔波児灞（ほんぱじは）といい、私は灞波児奔（ははじほん）と申します。あちらはナマズの妖怪、私は雷魚（らいぎょ）の精です。私どもの万聖竜王には娘が一人おり、万聖公主（ばんせいこうしゅ）と呼ばれています。公主（こうしゅ）は花のような顔、月のような容貌で、二十分ともいうほどの美しさを備えたお方です。婿に迎えたのは九頭駙馬（きゅうとうふば）といい、広大な神通力をお持ちです。一昨年、竜王とここへ来て、大法力を示し、血の雨を一しきり降らせ、宝塔を汚して、塔の中から舎利子（しゃりし）という仏の宝を盗みました。公主はまた大羅天（だいらてん）の霊霄殿（れいしょうでん）の前へ行き、王母（おうぼ）さまの九葉霊芝草（きゅうようれいしそう）を盗んで、あの淵の底で育てているのです。金の光と彩り豊かな霞に包まれ、昼も夜も明るく輝いております。この頃、孫悟空（そんごくう）という者が西天（さいてん）へ経を取りに行くと聞きました。神通力が広大で、道々、人の悪事ばかり嗅ぎつけるといいます。それで近頃は、私たちがしばしばここへ偵察に遣わされ、その孫悟空が来たら備えられるようにしていたのです。」
      悟空は聞いて、へへっと冷笑した。
      悟空「あの畜生どもが、そこまで不届きだったとはな。道理で先日、牛魔王（ぎゅうまおう）をあそこでの宴に招いていたわけだ。あいつは、こんな悪党の魔物どもとつき合って、悪事ばかり働いていたのか。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-023"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說未了，只見八戒與兩三個小和尚自塔下提著兩個燈籠，走上來道：「師父，掃了塔不去睡覺，在這裡講甚麼哩？」行者道：「師弟，你來正好。塔上的寶貝，乃是萬聖老龍偷了去。今著這兩個小妖巡塔，探聽我等來的消息，卻才被我拿住也。」八戒道：「叫做甚麼名字？甚麼妖精？」行者道：「才然供了口詞，一個叫做奔波兒灞，一個叫做灞波兒奔；一個是鮎魚怪，一個是黑魚精。」八戒掣鈀就打，道：「既是妖精，取了口詞，不打死待何待？」行者道：「你不知，且留著活的，好去見皇帝講話，又好做鑿眼去尋賊追寶。」好獃子，真個收了鈀，一家一個，都抓下塔來。那怪只叫：「饒命。」八戒道：「正要你鮎魚、黑魚做些鮮湯，與那負冤屈的和尚吃哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      まだ話し終わらぬうちに、八戒と二、三人の小僧が二つの提灯を提げ、塔の下から上ってきた。
      八戒「お師匠さま、塔を掃いたのに寝にも行かず、ここで何を話しているんです。」
      悟空「弟弟子、ちょうどよかった。塔の宝は万聖竜王が盗んでいったんだ。今はこの二匹の小妖を塔の見回りに出し、俺たちが来る知らせを探っていた。そいつらを、たった今捕まえたところさ。」
      八戒「何て名前だい。何の妖怪なんだ。」
      悟空「今しがた供述した。一匹は奔波児灞、もう一匹は灞波児奔といい、一匹はナマズの妖怪、もう一匹は雷魚の精だ。」
      八戒は熊手を抜くなり打ちかかった。
      八戒「妖怪だというなら、供述も取ったことだし、殴り殺さずに何を待つんだ。」
      悟空「お前は分かっていない。ひとまず生かしておけば、皇帝に会って話をする時にもよいし、賊を捜して宝を取り戻す手引き役にも使える。」
      この八戒も、なるほど熊手を収めた。そして二人が一匹ずつつかみ、二匹とも塔を下りさせた。
      妖怪の声「お命ばかりは！」
      八戒「お前たちナマズと雷魚で、うまい汁を作って、無実の罪に苦しんだお坊さんたちに食わせてやるところさ。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-024"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "兩三個小和尚喜喜歡歡，提著燈籠，引長老下了塔。一個先跑報眾僧道：「好了，好了，我們得見青天了，偷寶貝的妖怪已是爺爺們捉將來矣。」行者教：「拿鐵索來，穿了琵琶骨，鎖在這裡。汝等看守，我們睡覺去，明日再做理會。」那些和尚都緊緊的守著，讓三藏們安寢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      二、三人の小僧は大喜びで提灯を持ち、三蔵を案内して塔を下りた。一人は先に走っていき、僧たちに知らせた。
      小僧「よかった、よかった！　私たちも、ようやく無実を晴らしてくださる方に巡り会えたぞ！　宝を盗んだ妖怪は、もうあのお方たちが捕まえてくださった！」
      悟空は命じた。
      悟空「鉄の鎖を持ってこい。琵琶骨（びわこつ）を貫いて、ここにつないでおけ。お前たちが見張るんだ。俺たちは寝に行って、明日また取り計らおう。」
      僧たちは厳重に見張り、三蔵たちには安心して休んでもらった。
    "translation_status": "reviewed"
  - "id": "xy-ch62-025"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不覺的天曉。長老道：「我與悟空入朝，倒換關文去來。」長老即穿了錦襴袈裟，戴了毘盧帽，整束威儀，拽步前進。行者也束一束虎皮裙，整一整綿布直裰，取了關文同去。八戒道：「怎麼不帶這兩個妖賊去？」行者道：「待我們奏過了，自有駕帖著人來提他。」遂行至朝門外。看不盡那朱雀黃龍，清都絳闕。三藏到東華門，對閣門大使作禮道：「煩大人轉奏，貧僧是東土大唐差去西天取經者，意欲面君，倒換關文。」那黃門官果與通報，至階前奏道：「外面有兩個異容異服僧人，稱言南贍部洲東土唐朝差往西方拜佛求經，欲朝我王，倒換關文。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      いつしか夜が明けた。
      三蔵「私は悟空と宮廷へ行き、通行文書を改めてきます。」
      三蔵は錦襴袈裟（きんらんげさ）をまとい、毘盧帽（びるぼう）をかぶり、威儀を整えて、ゆったりと歩み出た。悟空も虎皮の腰巻きを締め直し、綿布の僧衣を整え、通行文書を持って同行した。
      八戒「どうして、この二匹の妖賊を連れていかないんだい。」
      悟空「俺たちが奏上すれば、勅命の呼出状を持った者が引き取りに来るさ。」
      二人は朝廷の門外へ行った。朱雀や黄竜、天上の都にも似た朱塗りの宮殿は、見ても見きれない。三蔵は東華門（とうかもん）で、取次ぎをつかさどる閣門大使（かくもんたいし）に礼をした。
      三蔵「お手数ですが、王へお取り次ぎをお願いいたします。私は東土の大唐から、西天へ経を求めに遣わされた僧でございます。王にお目通りして、通行文書を改めたく存じます。」
      その取次役は、果たして報告に行き、御殿の階段の前で奏上した。
      取次役「外に、姿も衣服も変わった僧が二人参っております。南贍部洲（なんせんぶしゅう）の東土、唐朝（とうちょう）から西方へ、仏を拝して経を求めに遣わされた者と名乗り、わが王に拝謁して、通行文書を改めたいと申しております。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-026"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王聞言，傳旨教宣。長老即引行者入朝。文武百官見了行者，無不驚怕。有的說是猴和尚，有的說是雷公嘴和尚。個個悚然，不敢久視。長老在階前舞蹈山呼的行拜。大聖叉著手，斜立在傍，公然不動。長老啟奏道：「臣僧乃南贍部洲東土大唐國差來拜西方天竺國大雷音寺佛，求取真經者。路經寶方，不敢擅過，有隨身關文，乞倒驗方行。」那國王聞言大喜，傳旨教宣唐朝聖僧上金鑾殿，安繡墩賜坐。長老獨自上殿，先將關文捧上，然後謝恩敢坐。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      国王は聞くと、呼び入れるよう命を下した。三蔵は悟空を連れて朝廷へ入った。文武百官は悟空を見て、誰もが驚き恐れた。猿の和尚だという者もあれば、雷神のような突き出た口の和尚だという者もある。一人残らずおののき、長く見つめることもできない。三蔵は階段の前で礼の舞を行い、万歳を唱えて拝んだ。悟空は両手を組んで脇に斜めに立ち、堂々として動かなかった。
      三蔵「臣たる僧は、南贍部洲の東土、大唐国（だいとうこく）から、西方天竺国（てんじくこく）の大雷音寺（だいらいおんじ）の仏を拝し、真の経を求めるために遣わされた者でございます。尊いお国を通るに当たり、勝手に通過するわけにはまいりません。携えております通行文書をお改めいただき、そのうえで先へ進むことをお許し願います。」
      国王は聞いて大いに喜び、唐朝の聖僧を金鑾殿（きんらんでん）へ上げ、刺繍の腰掛けを置いて席を与えるよう命じた。三蔵は一人で殿上へ進み、まず通行文書を両手で捧げ、それから恩に謝して、ようやく腰を下ろした。
    "translation_status": "reviewed"
  - "id": "xy-ch62-027"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王將關文看了一遍，心中喜悅道：「似你大唐王有疾，能選高僧，不避路途遙遠，拜佛取經；寡人這裡和尚，專心只是做賊，敗國傾君。」三藏聞言，合掌道：「怎見得敗國傾君？」國王道：「寡人這國，乃是西域上邦，常有四夷朝貢，皆因國內有個金光寺，寺內有座黃金寶塔，塔上有光彩沖天。近被本寺賊僧暗竊了其中之寶，三年無有光彩，外國這三年也不來朝，寡人心痛恨之。」三藏合掌笑道：「萬歲，『差之毫釐，失之千里』矣。貧僧昨晚到於天府，一進城門，就見十數個枷紐之僧。問及何罪，他道是金光寺負冤屈者。因到寺細審，更不干本寺僧人之事。貧僧入夜掃塔，已獲那偷寶之妖賊矣。」國王大喜道：「妖賊安在？」三藏道：「現被小徒鎖在金光寺裡。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      国王は通行文書を一通り読み、心に喜びを覚えて言った。
      国王「そなたの大唐の王は病を患っても、高僧を選び、道の遠さもいとわせず、仏を拝して経を取らせることができる。それに引き換え、余の国の僧は、ひたすら盗みばかりに心を寄せ、国を破り、君主を滅ぼす。」
      三蔵は合掌した。
      三蔵「国を破り、君主を滅ぼすとは、どのようなことでございましょう。」
      国王「余の国は西域の上国で、いつも四方の国から朝貢を受けていた。それも、国の中に金光寺があり、寺に黄金の宝塔があり、塔の上から光が天へ突き上げていたからだ。ところが、このところあの寺の賊僧が中の宝をひそかに盗み、三年も光を失った。外国もこの三年、朝貢に来ぬ。余はそれが痛く恨めしいのだ。」
      三蔵は合掌したまま微笑んだ。
      三蔵「陛下、『わずかな違いが千里の隔たりになる』とは、このことでございます。私は昨夜、尊い都へ着き、城門を入ったところで、首枷と鎖につながれた十数人の僧を見かけました。何の罪かと尋ねると、金光寺の無実の罪を負った者だと申しました。それで寺へ行って詳しく調べましたが、この寺の僧の仕業ではまったくございません。私は夜に入って塔を掃き、すでに宝を盗んだ妖賊を捕らえたのでございます。」
      国王は大いに喜んだ。
      国王「妖賊はどこにおる。」
      三蔵「今は弟子が、金光寺につないでおります。」
    "translation_status": "reviewed"
  - "id": "xy-ch62-028"
    "section_id": "chapter-62"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王急降金牌：「著錦衣衛快到金光寺取妖賊來，寡人親審。」三藏又奏道：「萬歲，雖有錦衣衛，還得小徒去方可。」國王道：「高徒在那裡？」三藏用手指道：「那玉階旁立者便是。」國王見了，大驚道：「聖僧如此丰姿，高徒怎麼這等像貌？」孫大聖聽見了，厲聲高叫道：「陛下，『人不可貌相，海水不可斗量』。若愛丰姿者，如何捉得妖賊也？」國王聞言，回驚作喜道：「聖僧說的是。朕這裡不選人材，只要獲賊得寶歸塔為上。」再著當駕官看車蓋，教錦衣衛好生伏侍聖僧去取妖賊來。那當駕官即備大轎一乘、黃傘一柄，錦衣衛點起校尉，將行者八擡八綽，大四聲喝路，徑至金光寺。自此驚動滿城百姓，無處無一人不來看聖僧及那妖賊。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch62-1500611"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第062回&oldid=1500611"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      国王は急いで金の命令札を下した。
      国王「錦衣衛（きんいえい）をすぐ金光寺へ行かせ、妖賊を連れてこさせよ。余がじかに取り調べる。」
      三蔵はさらに奏上した。
      三蔵「陛下、錦衣衛がおりましても、私の弟子が行かなくてはなりません。」
      国王「そなたの高弟は、どこにおる。」
      三蔵は手で指した。
      三蔵「あの玉の階段の脇に立っている者でございます。」
      国王は見て、ひどく驚いた。
      国王「聖僧はこれほど立派なお姿なのに、弟子はどうしてあのような容貌なのだ。」
      悟空は聞きつけ、鋭い声で叫んだ。
      悟空「陛下、『人は顔かたちでは量れず、海の水は升では量れぬ』ものです。容姿ばかり好んでいて、どうして妖賊を捕まえられましょう。」
      国王は聞くと、驚きから喜びへ変わった。
      国王「聖僧の言うとおりだ。朕はここで顔だちを選ぶのではない。ただ賊を捕らえ、宝を得て塔へ返すのが何よりだ。」
      さらに御車をつかさどる役人に車と傘蓋を整えさせ、錦衣衛には聖僧を手厚くお世話して、妖賊を連れてくるよう命じた。その役人はすぐに大きな輿一乗と黄色い傘一柄を用意した。錦衣衛は校尉（こうい）をそろえ、悟空を八人担ぎの輿でうやうやしく運び、四声を大きく響かせて道を空けさせながら、まっすぐ金光寺へ向かった。このため都中の人々が騒ぎ出し、聖僧と妖賊を見ようとしない者は、どこにも一人としていなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch62-029"
    "section_id": "chapter-62"
    "kind": "paragraph"

    凌空子「無風の中にも、こんもりした影を揺らし、
    客が来れば、喜び愛でる、めでたい福寿の図。」
  "translation_status": "reviewed"
- "id": "xy-ch64-042"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "拂雲叟亦頂針道："
  "source_languages":

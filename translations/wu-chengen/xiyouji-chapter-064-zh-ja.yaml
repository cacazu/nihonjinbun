- "id": "xy-ch64-019"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「我亦千年約有餘，蒼然貞秀自如如。
    堪憐雨露生成力，借得乾坤造化機。
    萬壑風煙惟我盛，四時灑落讓吾疏。
    蓋張翠影留仙客，博弈調琴講道書。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 167
    "line_end": 170
  "translation_ja": |-
    十八公「わしもおよそ千年余り、青々と、貞く秀でて、おのずと変わらぬまま。
    雨露が生み育てる力は、ありがたいもの。天地の造化のはたらきを借り受ける。
    万の谷の風と霞の中で、わしこそ盛んに茂り、四季を通じたさっぱりした風姿も、わしの疎らな枝ぶりには譲る。
    天蓋のように翠の影を広げて仙客をとどめ、碁を打ち、琴を調べ、道の書を語り合う。」
  "translation_status": "reviewed"
- "id": "xy-ch64-020"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏稱謝道：「四位仙翁，俱享高壽，但勁節翁又千歲餘矣。高年得道，丰采清奇，得非漢時之『四皓』乎？」四老道：「承過獎，承過獎。吾等非四皓，乃深山之『四操』也。敢問聖僧，妙齡幾何？」三藏合掌躬身答曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    三蔵は感謝して言った。
    三蔵「四人の仙翁は皆さまご長寿ですが、勁節翁はさらに千歳を越えておられるのですね。ご高齢で道を得られ、清らかで並外れたお姿です。まさか、漢の時代の四皓（しこう）ではありませんか。」
    四人の老人「お褒めにあずかり、恐縮です、恐縮です。我々は四皓ではなく、深山の四操（しそう）です。失礼ですが、聖僧はおいくつでいらっしゃいますか。」
    三蔵は合掌し、身をかがめて答えた。
  "translation_status": "reviewed"
- "id": "xy-ch64-021"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「四十年前出母胎，未產之時命已災。
    逃生落水隨波滾，幸遇金山脫本骸。
    養性看經無懈怠，誠心拜佛敢俄捱。
    今蒙皇上差西去，路遇仙翁下愛來。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 174
    "line_end": 177
  "translation_ja": |-
    三蔵「四十年前に母の胎を出ましたが、生まれる前から命は災いに遭っていました。
    生き延びようと水に落ち、波に流され、幸い金山（きんざん）で救われて、この身の命をつなぎました。
    性を養い、経を読んで怠ることなく、まごころで仏を拝み、一時も遅れようとしませんでした。
    今、帝の命を受けて西へ向かい、その道中で仙翁のお情けにあずかったのです。」
  "translation_status": "reviewed"
- "id": "xy-ch64-022"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四老俱稱道：「聖僧自出娘胎，即從佛教，果然是從小修行，真中正有道之上僧也。我等幸接臺顏，敢求大教。望以禪法指教一二，足慰生平。」長老聞言，慨然不懼，即對眾言曰：禪者，靜也；法者，度也。靜中之度，非悟不成。悟者，洗心滌慮，脫俗離塵是也。夫人身難得，中土難生，正法難遇：全此三者，幸莫大焉。至德妙道，渺漠希夷，六根六識，遂可掃除。菩提者，不死不生，無餘無欠，空色包羅，聖凡俱遣。訪真了元始鉗鎚，悟實了牟尼手段。發揮象罔，踏碎涅槃。必須覺中覺了悟中悟，一點靈光全保護。放開烈焰照婆娑，法界縱橫獨顯露。至幽微，更守固，玄關口說誰人度？我本元修大覺禪，有緣有志方記悟。」四老側耳受了，無邊喜悅。一個個稽首皈依，躬身拜謝道：「聖僧乃禪機之悟本也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    四人の老人はそろって讃えた。
    四人の老人「聖僧は母の胎を出てから仏の教えに従い、まさしく幼いころから修行してこられた。真に正しく道を得た、高徳の僧でいらっしゃる。我々は幸いお目にかかれたので、ぜひ尊い教えを頂きたい。禅の法を一つ二つお授けくだされば、生涯の願いが慰められます。」
    それを聞いた三蔵は、心を奮い立たせ、恐れもなく皆に語った。
    三蔵「禅とは静けさ、法とは渡すことです。静けさのうちに渡るには、悟りがなくては成りません。悟りとは、心を洗い、思いわずらいを清め、俗を脱し、塵を離れることです。そもそも人の身は得がたく、中土には生まれがたく、正しい法には出会いがたい。この三つをすべて備えるのは、これ以上ない幸いです。至高の徳と玄妙な道は、はるかで、見えず聞こえず、そこでは六根（ろっこん）と六識（ろくしき）を、すっかり払い除けられます。菩提（ぼだい）とは、死なず生まれず、余りも欠けもなく、空と色を包み込み、聖と凡をともに払い去るものです。真を訪ねて元始（げんし）の鍛錬を究め、実を悟って牟尼（むに）の手立てを知る。象罔（しょうもう）を発揮し、涅槃（ねはん）を踏み砕くのです。
    覚りのうちにさらに覚り、悟りのうちにさらに悟り、一点の霊光を全うして守らねばならない。
    激しい炎を放って娑婆（しゃば）を照らせば、法界（ほっかい）を縦横にただひとり、明らかに現れる。
    きわめて幽かで微妙な境地に達しても、なお堅く守らねばならない。玄関（げんかん）の奥義を口で説くだけで、誰が渡れよう。
    私はもとより大覚の禅を修める者。縁と志があってこそ、心に留めて悟れるのです。」
    四人の老人は耳を傾けて教えを受け、限りなく喜んだ。一人ずつ頭を下げて帰依し、身をかがめて礼を述べた。
    四人の老人「聖僧こそ、禅の機微の根本を悟られた方です。」
  "translation_status": "reviewed"
- "id": "xy-ch64-023"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "拂雲叟道：「禪雖靜，法雖度，須要性定心誠。縱為大覺真仙，終坐無生之道。我等之玄，又大不同。」三藏云：「道乃非常，體用合一，如何不同？」拂雲叟笑云：「我等生來堅實，體用比爾不同。感天地以生身，蒙雨露而滋色。笑傲風霜，消磨日月。一葉不凋，千枝節操。似這話不叩沖虛，你執持梵語。道也者，本安中國，反來求證西方，空費了草鞋，不知尋個甚麼？石獅子剜了心肝，野狐涎灌徹骨髓。忘本參禪，妄求佛果，都似我荊棘嶺葛藤謎語，蘿蓏渾言。此般君子，怎生接引？這等規模，如何印授？必須要檢點見前面目，靜中自有生涯。沒底竹籃汲水，無根鐵樹生花。靈寶峰頭牢著腳，歸來雅會上龍華。」三藏聞言，叩頭拜謝。十八公用手攙扶，孤直公將身扯起，凌空子打個哈哈道：「拂雲之言，分明漏泄。聖僧請起，不可盡信。我等趁此月明，原不為講論修持，且自吟哦逍遙，放蕩襟懷也。」拂雲叟笑指石屋道：「若要吟哦，且入小庵一茶，何如？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    拂雲叟「禅は静けさ、法は渡すことだとしても、性が定まり、心が誠実でなければなりません。たとえ大覚の真仙になろうと、結局は無生（むしょう）の道に座するだけです。我々の玄妙な道とは、大いに違います。」
    三蔵「道は常なるものではなく、本体とはたらきは一つです。どう違うのでしょう。」
    拂雲叟は笑った。
    拂雲叟「我々は生まれつき堅実で、本体もはたらきも、あなた方とは違います。天地に感じて身を生じ、雨露を受けて色つやを養う。風霜を笑い飛ばし、月日を過ごす。一葉も凋まず、千の枝に節操がある。こうした話で虚にして澄んだ境地を求めず、あなたは仏の言葉に執着している。道というものは、本来中国に安んじているのに、逆に西方へ証しを求め、草鞋をむだにすり減らして、何を探すというのでしょう。石の獅子の心臓と肝をえぐり、野狐のよだれを骨髄まで注ぎ込むようなものです。本を忘れて禅を参究し、むなしく仏果を求めるとは、我が荊棘嶺の葛のつるのような謎、つる草や蔓の実のような取りとめない言葉に等しい。こういう御仁を、どう導けばよいのでしょう。こんなありさまで、どう悟りの証しを授けられましょう。まず目の前の本来の面目を点検すれば、静けさの中に、おのずと生きる道があるのです。
    底のない竹籠で水を汲み、根のない鉄の木に花を咲かせる。
    霊宝（れいほう）の峰の頂にしっかり足を据え、帰ってきて、風雅な集いから竜華（りゅうげ）の会へ参りましょう。」
    三蔵は聞くと、頭を地につけて礼をした。十八公が手を差し伸べ、孤直公が体を引き起こすと、凌空子があははと笑った。
    凌空子「拂雲（ふつうん）の言葉は、ずいぶん奥義を漏らしましたな。聖僧、どうぞお立ちください。すべて真に受けるには及びません。我々はこの明るい月に誘われたのであって、もともと修行を論じるつもりではありませんでした。ただ詩を吟じ、のびのびと胸のうちを解き放とうではありませんか。」
    拂雲叟は笑いながら石の家を指した。
    拂雲叟「詩を吟じるなら、まず小庵に入り、お茶でもいかがです。」
  "translation_status": "reviewed"
- "id": "xy-ch64-024"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老真個欠身，向石屋前觀看。門上有三個大字，乃「木仙庵」。遂此同入，又敘了坐次。忽見那赤身鬼使，捧一盤茯苓膏，將五盞香湯奉上。四老請唐僧先吃，三藏驚疑，不敢便吃。那四老一齊享用，三藏卻才吃了兩塊。各飲香湯收去。三藏留心偷看，只見那裡玲瓏光彩，如月下一般："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 180
    "line_end": 180
  "translation_ja": "三蔵は身を起こし、石の家の前を見ると、門に「木仙庵（もくせんあん）」の三文字があった。皆と入って、あらためて席順を定めた。するとあの赤裸の鬼の使いが、茯苓膏（ぶくりょうこう）の皿を捧げ、香りのよい飲み物を五椀差し出した。四人の老人は三蔵に先に食べるよう勧めたが、三蔵は怪しんで、すぐには食べられない。四人がそろって口にしたので、ようやく二切れ食べた。それぞれ香りのよい飲み物を飲むと、器が下げられた。三蔵が気をつけてそっと見ると、あたりは月の下のように、透き通った光に満ちていた。"
  "translation_status": "reviewed"
- "id": "xy-ch64-025"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    水自石邊流出，香從花裡飄來。
    滿座清虛雅致，全無半點塵埃。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 182
    "line_end": 183
  "translation_ja": |-
    水は石の傍らから流れ出し、香りは花の中から漂ってくる。
    座のすべては清らかで雅やか、塵ひとつ、まるでない。
  "translation_status": "reviewed"
- "id": "xy-ch64-026"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老見此仙境，以為得意，情樂懷開，十分歡喜，忍不住念了一句道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 185
    "line_end": 185
  "translation_ja": "三蔵はこの仙境を見て、心にかなう所と思い、胸を開いて、すっかり楽しくなった。喜びのあまり、思わず一句を口ずさんだ。"
  "translation_status": "reviewed"
- "id": "xy-ch64-027"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "「禪心似月迥無塵。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 187
    "line_end": 187
  "translation_ja": "三蔵「禅の心は月のよう、はるかに澄んで塵ひとつない。」"
  "translation_status": "reviewed"
- "id": "xy-ch64-028"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "勁節老笑而即聯道："
  "source_languages":
  - "zh-Hant"
  "source_locations":

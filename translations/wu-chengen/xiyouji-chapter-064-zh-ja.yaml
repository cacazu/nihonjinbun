- "id": "xy-ch64-017"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「歲寒虛度有千秋，老景瀟然清更幽。
    不雜囂塵終冷淡，飽經霜雪自風流。
    七賢作侶同談道，六逸為朋共唱酬。
    戛玉敲金非瑣瑣，天然情性與仙遊。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 160
    "line_end": 163
  "translation_ja": |-
    拂雲叟「寒い歳月を、むなしく千の秋も過ごし、老いた姿はさっぱりとして、清く、なお奥深い。
    騒がしい俗塵に交わらず、終始淡々として、霜雪を存分に経て、おのずと風流。
    七賢（しちけん）を仲間に道を語り合い、六逸（ろくいつ）を友に詩を唱えて応じ合う。
    玉を鳴らし金を打つ音も、ありふれたものではない。生まれつきの性情のまま、仙人と遊ぶ。」
  "translation_status": "reviewed"
- "id": "xy-ch64-018"
  "section_id": "chapter-64"

- "id": "xy-ch64-002"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表祭賽國王謝了唐三藏師徒獲寶擒怪之恩，所贈金玉，分毫不受。卻命當駕官照依四位常穿的衣服各做兩套，鞋襪各做兩雙，絛環各做兩條，外備乾糧烘炒，倒換了通關文牒，大排鑾駕，並文武多官、滿城百姓、伏龍寺僧人，大吹大打，送四眾出城。約有二十里，先辭了國王。眾人又送二十里辭回。伏龍寺僧人送有五六十里不回：有的要同上西天，有的要修行伏侍。行者見都不肯回去，遂弄個手段，把毫毛拔了三四十根，吹口仙氣，叫：「變！」都變作斑斕猛虎，攔住前路，哮吼踴躍。眾僧方懼，不敢前進。大聖才引師父策馬而去，少時間去得遠了。眾僧人放聲大哭，都喊：「有恩有義的老爺！我等無緣，不肯度我們也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    さて、祭賽国（さいさいこく）の王は、宝を取り戻し妖怪を捕らえた三蔵（さんぞう）たち師弟の恩に感謝したが、贈ろうとした金や玉は、わずかばかりも受け取ってもらえなかった。そこで側仕えの役人に命じ、四人がふだん着ているものに合わせて衣服を二着ずつ、靴と靴下を二足ずつ、飾り紐と環を二組ずつ作らせた。そのほかに保存食や炒り物を用意し、通行証の書き換えをすませ、盛大に車駕を整えた。文武の役人たち、町じゅうの民、伏竜寺（ふくりゅうじ）の僧たちとともに、管や太鼓をにぎやかに鳴らして、四人を城外まで送った。二十里ほどでまず国王と別れ、ほかの人々はさらに二十里送ってから別れて帰った。伏竜寺の僧たちは五、六十里も送って、なお帰ろうとしない。一緒に西天（さいてん）へ行きたい者も、修行して身の回りの世話をしたい者もいた。悟空（ごくう）は誰も帰ろうとしないのを見て、一つ手を使った。細い毛を三、四十本抜き、仙気を吹きつけて、悟空「変われ！」と叫ぶ。毛はみな縞模様の猛虎になり、行く手を遮って吠え、跳びはねた。ようやく僧たちは怖がり、それ以上進めなくなった。そこで悟空は三蔵に馬を進めさせて連れていき、ほどなく遠くまで離れた。僧たちは声を放って泣き、みな叫んだ。
    僧たち「情け深く、義理を知るお方さま！　私たちにはご縁がなく、お救いくださらないのですね！」
  "translation_status": "reviewed"
- "id": "xy-ch64-003"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不說眾僧啼哭。卻說師徒四眾走上大路，卻才收回毫毛，一直西去。正是時序易遷，又早冬殘春至，不暖不寒，正好逍遙行路。忽見一條長嶺，嶺頂上是路。三藏勒馬觀看，那嶺上荊棘丫叉，薜蘿牽繞，雖是有道路的痕跡，左右卻都是荊刺棘針。唐僧叫：「徒弟，這路怎生走得？」行者道：「怎麼走不得？」又道：「徒弟啊，路痕在下，荊棘在上，只除是蛇蟲伏地而遊，方可去了；若你們走，腰也難伸，教我如何乘馬？」八戒道：「不打緊，等我使出鈀柴手來，把釘鈀分開荊棘，莫說騎馬，就擡轎也包你過去。」三藏道：「你雖有力，長遠難熬，卻不知有多少遠近，怎生費得這許多精神？」行者道：「不須商量，等我去看看。」將身一縱，跳在半空看時，一望無際。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    僧たちの泣き声は、さておこう。師弟四人は大きな道に出ると、悟空がようやく毛を取り戻し、ひたすら西へ向かった。季節の移るのは早いもので、もう冬が尽き、春が来た。暖かすぎも寒すぎもせず、のびのび旅をするにはうってつけである。ふと、長い尾根が現れ、その頂に道が通っていた。三蔵が手綱を引いて眺めると、尾根には茨が枝を交差させ、つる草が絡みついている。道の跡こそあるが、左右は茨の棘だらけだった。
    三蔵「弟子たちよ、この道をどうやって通るのです。」
    悟空「どうして通れないのですか。」
    三蔵「道の跡は下にあり、茨がその上を覆っています。蛇や虫のように地を這って進むのでなければ、通れません。お前たちでさえ、歩けば腰も伸ばせないのに、どうして私が馬に乗れましょう。」
    八戒（はっかい）「大丈夫さ。俺が柴をかき集める手並みを見せて、まぐわで茨をかき分けてやる。馬どころか、輿に乗っていたって、ちゃんと通してみせるよ。」
    三蔵「力はあっても、長く続けばこらえきれません。どれほどの道のりかも分からないのに、そんなに力を使い続けられますか。」
    悟空「相談していても始まりません。私が見てきましょう。」
    身を躍らせて空中へ跳び上がり、見渡すと、果てしなく続いている。まことに、こういう眺めだった。
  "translation_status": "reviewed"
- "id": "xy-ch64-004"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "匝地遠天，凝煙帶雨。夾道柔茵亂，漫山翠蓋張。密密搓搓初發葉，攀攀扯扯正芬芳。遙望不知何所盡，近觀一似綠雲茫。蒙蒙茸茸，鬱鬱蒼蒼。風聲飄索索，日影映煌煌。那中間有松有柏還有竹，多梅多柳更多桑。薜蘿纏古樹，藤葛繞垂楊。盤團似架，聯絡如床。有處花開真佈錦，無端卉發遠生香。為人誰不遭荊棘，那見西方荊棘長？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    地の果てから遠い空まで、霞が凝り、雨を帯びる。
    道の両脇には柔らかな草が乱れ、山じゅうに翠の天蓋が張る。
    びっしり重なって若葉が芽吹き、引き合い絡み合って香り立つ。
    遠く望めば、どこまで続くか知れず、近く見れば、緑の雲がぼうっと広がるよう。
    こんもり、もじゃもじゃと、うっそう青々と茂る。
    風の音はさらさら流れ、日の光はきらきら映る。
    その中には松も柏（はく）も竹もあり、梅が多く、柳も多く、桑はなお多い。
    つる草は古木にまとい、葛は枝垂れ柳を巻く。
    ぐるぐる絡んで棚のよう、連なりつながって寝台のよう。
    ところどころ咲く花は、まさに錦を敷き、あちこち開く草花が遠くまで香る。
    人として生きて、茨の苦難に出会わぬ者があろうか。だが、西方の茨がこれほど長いとは、誰が見ただろう。
  "translation_status": "reviewed"
- "id": "xy-ch64-005"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看夠多時，將雲頭按下道：「師父，這去處遠哩。」三藏問：「有多少遠？」行者道：「一望無際，似有千里之遙。」三藏大驚道：「怎生是好？」沙僧笑道：「師父莫愁，我們也學燒荒的，放上一把火，燒絕了荊棘過去。」八戒道：「莫亂談。燒荒的須在十來月，草衰木枯，方好引火。如今正是蕃盛之時，怎麼燒得？」行者道：「就是燒得，也怕人了。」三藏道：「這般怎生得度？」八戒笑道：「要得度，還依我。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    悟空は長いこと十分に眺めてから、雲を降ろした。
    悟空「お師匠さま、ここは長く続いていますよ。」
    三蔵「どれほどです。」
    悟空「見渡しても果てがなく、千里もありそうです。」
    三蔵はひどく驚いた。
    三蔵「どうすればよいのです。」
    沙悟浄（さごじょう）は笑った。
    沙悟浄「お師匠さま、ご心配には及びません。野焼きにならって火を放ち、茨をすっかり焼き払って通ればよいのです。」
    八戒「いい加減なことを言うな。野焼きは十月ごろ、草が衰え、木が枯れてからでなけりゃ火をつけられない。今は盛んに茂る時季だ。どうして燃えるものか。」
    悟空「たとえ燃えたとしても、恐ろしいことになるぞ。」
    三蔵「それでは、どうして越えればよいのです。」
    八戒は笑った。
    八戒「越えたけりゃ、やっぱり俺に任せるんだな。」
  "translation_status": "reviewed"
- "id": "xy-ch64-006"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好獃子，捻個訣，念個咒語，把腰躬一躬，叫：「長！」就長了有二十丈高下的身軀。把釘鈀幌一幌，教：「變！」就變了有三十丈長短的鈀柄。拽開步，雙手使鈀，將荊棘左右摟開：「請師父跟我來也。」三藏見了甚喜，即策馬緊隨後面；沙僧挑著行李；行者也使鐵棒撥開。這一日未曾住手，行有百十里。將次天晚，見有一塊空闊之處。當路上有一通石碣，上有三個大字，乃「荊棘嶺」；下有兩行十四個小字，乃「荊棘蓬攀八百里，古來有路少人行」。八戒見了，笑道：「等我老豬與他添上兩句：『自今八戒能開破，直透西方路盡平。』」三藏欣然下馬道：「徒弟啊，累了你也。我們就在此住過了今宵，待明日天光再走。」八戒道：「師父莫住，趁此天色晴明，我等有興，連夜摟開路走他娘。」那長老只得相從。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    あっぱれ、このとぼけ者。指で印を結び、呪文を唱え、腰をかがめて、八戒「伸びろ！」と叫ぶと、二十丈ほどの大きな体になった。まぐわを振り動かして、八戒「変われ！」と命じれば、柄の長さは三十丈ほどになる。大股を開き、両手でまぐわを振るって、茨を左右へかき分けた。
    八戒「お師匠さま、俺についておいで！」
    三蔵は大喜びで馬を進め、すぐ後ろについた。沙悟浄は荷を担ぎ、悟空も鉄棒で茨をかき分ける。この日は手を休めず、百里あまり進んだ。日が暮れかけたころ、開けた場所が見えた。道に石碑が一基立ち、大きく「荊棘嶺（けいきょくれい）」の三文字、その下には小さく二行、十四文字が刻まれている。
    「茨と藪が絡んで八百里、
    古来道あれど行く人は少ない。」
    八戒はそれを見て笑った。
    八戒「俺がもう二句、つけ足してやろう。『今より八戒が切り拓けば、
    西方へまっすぐ、道はことごとく平らになる。』」
    三蔵は喜んで馬を下りた。
    三蔵「弟子よ、苦労をかけました。今夜はここに泊まり、明日、明るくなってから進みましょう。」
    八戒「お師匠さま、休むのはよそう。こんなに空が晴れて、俺たちもやる気があるんだ。夜通しかき分けて、くそっ、どんどん進もうぜ。」
    三蔵も従うほかなかった。
  "translation_status": "reviewed"
- "id": "xy-ch64-007"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒上前努力，師徒們人不住手，馬不停蹄，又行了一日一夜，卻又天色晚矣。那前面蓬蓬結結，又聞得風敲竹韻，颯颯松聲。卻好又有一段空地，中間乃是一座古廟。廟門之外，有松柏凝青，桃梅鬥麗。三藏下馬，與三個徒弟同看。只見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 129
    "line_end": 129
  "translation_ja": "八戒は先頭に立って力を尽くし、師弟たちは手を止めず、馬も足を止めず、さらに一昼夜進むうち、また夜になった。前方は藪がこんもり絡み合い、風が竹を打つ響きと、松のざわめきが聞こえてくる。折よく、また空き地があり、その真ん中に古い廟が建っていた。門の外では松と柏が青く茂り、桃と梅が美しさを競っている。三蔵は馬を下り、三人の弟子とともに眺めた。"
  "translation_status": "reviewed"
- "id": "xy-ch64-008"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    巖前古廟枕寒流，落目荒煙鎖廢丘。
    白鶴叢中深歲月，綠蕪臺下自春秋。
    竹搖青珮疑聞語，鳥弄餘音似訴愁。
    雞犬不通人跡少，閑花野蔓遶牆頭。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 131
    "line_end": 134
  "translation_ja": |-
    崖の前の古い廟は冷たい流れに寄り添い、目をやれば、荒れた霞が廃れた丘を閉ざしている。
    白鶴の群れる中には深い歳月があり、緑の草に埋もれた台の下にも、春秋はおのずと巡る。
    竹は青い佩玉を揺らすようで、言葉が聞こえるかと思われ、鳥の余韻は、愁いを訴えるよう。
    鶏や犬の声も通わず、人の跡もまれで、ひっそりした花と野のつるが塀の頂を取り巻く。
  "translation_status": "reviewed"
- "id": "xy-ch64-009"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看了道：「此地少吉多凶，不宜久坐。」沙僧道：「師兄差疑了。似這杳無人煙之處，又無個怪獸妖禽，怕他怎的？」說不了，忽見一陣陰風，廟門後轉出一個老者，頭戴角巾，身穿淡服，手持拐杖，足踏芒鞋。後跟著一個青臉獠牙、紅鬚赤身鬼使，頭頂著一盤麵餅。跪下道：「大聖，小神乃荊棘嶺土地。知大聖到此，無以接待，特備蒸餅一盤，奉上老師父，各請一餐。此地八百里，更無人家，聊吃些兒充饑。」八戒歡喜，上前舒手，就欲取餅。不知行者端詳已久，喝一聲：「且住，這廝不是好人。休得無禮，你是甚麼土地，來誑老孫？看棍。」那老者見他打來，將身一轉，化作一陣陰風，呼的一聲，把個長老攝將起去，飄飄蕩蕩，不知攝去何所。慌得那大聖沒跟尋處，八戒、沙僧俱相顧失色，白馬亦只自驚吟。三兄弟連馬四口，恍恍忽忽，遠望高張，並無一毫下落，前後找尋不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    悟空は眺めて言った。
    悟空「ここは吉が少なく凶が多い。長居はしない方がいい。」
    沙悟浄「兄さん、疑いすぎでしょう。こんな人けのない所で、怪しい獣も妖しい鳥もいないのに、何を恐れるのです。」
    言い終わらぬうちに、ひとしきり陰気な風が吹き、廟の門の後ろから老人が出てきた。角巾をかぶり、地味な服を着て、杖を手にし、草鞋を履いている。後ろには、青い顔に牙を生やし、赤い髭を蓄えた、赤裸の鬼の使いが一人従い、頭の上に小麦の蒸し餅を載せた皿を頂いていた。老人はひざまずいて言った。
    老人「大聖（たいせい）、私は荊棘嶺の土地神（とちがみ）でございます。お越しと知りながら、おもてなしする物もなく、せめて一皿の蒸し餅をご用意して、お師匠さまに差し上げます。皆さま、どうぞ一食お召し上がりください。この八百里には人家がございません。少しでも空腹をしのいでいただければ。」
    八戒は喜んで前へ出て手を伸ばし、餅を取ろうとした。だが悟空は、とっくに相手をじっと見極めていた。
    悟空「待て。こいつはまともな奴じゃない。ふざけるな、何の土地神だ。この俺をだましに来たのか。棒を食らえ！」
    老人は打ちかかってくるのを見ると、くるりと体を回して陰気な風となり、ひゅうっと三蔵をさらい上げた。ふわふわと漂って、どこへさらっていったのかも分からない。悟空は追う手がかりもなく慌て、八戒と沙悟浄は顔を見合わせて青ざめ、白馬まで、ただ驚いていなないた。三兄弟に馬を合わせた四つの口が、うろたえながら、遠くを見渡し首を伸ばしたが、少しの手がかりもない。前へ後ろへ捜し回る話は、ひとまず置いておく。
  "translation_status": "reviewed"
- "id": "xy-ch64-010"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那老者同鬼使，把長老擡到一座煙霞石屋之前，輕輕放下，與他攜手相攙道：「聖僧休怕。我等不是歹人，乃荊棘嶺十八公是也。因風清月霽之宵，特請你來會友談詩，消遣情懷故耳。」那長老卻才定性，睜眼仔細觀看。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    さて、あの老人は鬼の使いとともに、三蔵を霞のたなびく石の家の前まで運ぶと、そっと下ろし、手を取って支えながら言った。
    老人「聖僧（しょうそう）、ご心配なさるな。我々は悪人ではありません。わしは荊棘嶺の十八公（じゅうはちこう）です。風も清く、月も晴れわたった夜なので、友と集って詩を語り、心を慰めようと、特にお招きしただけなのです。」
    三蔵はようやく心を落ち着かせ、目を開けてよく眺めた。まことに、こういう所だった。
  "translation_status": "reviewed"
- "id": "xy-ch64-011"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    漠漠煙雲去所，清清仙境人家。
    正好潔身修煉，堪宜種竹栽花。
    每見翠巖來鶴，時聞青沼鳴蛙。
    更賽天臺丹灶，仍期華岳明霞。
    說甚耕雲釣月，此間隱逸堪誇。
    坐久幽懷如海，朦朧月上窗紗。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 138
    "line_end": 143
  "translation_ja": |-
    果てなく霞や雲の行き交う所、清らかな仙境の住まい。
    身を清めて修行するのにまさしくよく、竹を植え花を育てるにもふさわしい。
    翠の崖に鶴が来るのをいつも見、青い池に蛙が鳴くのを時折聞く。
    天台（てんだい）の丹を練る炉にもまさり、華岳（かがく）の明るい霞とも見まがう。
    雲を耕し月を釣るなど、何ほどのことか。ここでの隠逸こそ誇るに足る。
    長く座れば、奥深い思いは海のように広がり、ぼんやりした月が窓の紗に昇る。
  "translation_status": "reviewed"
- "id": "xy-ch64-012"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏正自點看，漸覺月明星朗，只聽得人語相談。都道：「十八公請得聖僧來也。」長老擡頭觀看，乃是三個老者：前一個霜姿丰采，第二個綠鬢婆娑，第三個虛心黛色。各各面貌、衣服俱不相同，都來與三藏作禮。長老還了禮，道：「弟子有何德行，敢勞列位仙翁下愛？」十八公笑道：「一向聞知聖僧有道，等待多時，今幸一見。如果不吝珠玉，寬坐敘懷，足見禪機真派。」三藏躬身道：「敢問仙翁尊號？」十八公道：「霜姿者號孤直公，綠鬢者號凌空子，虛心者號拂雲叟，老拙號曰勁節。」三藏道：「四翁尊壽幾何？」孤直公道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    三蔵があちらこちらを眺めるうち、月はいよいよ明るく、星も晴れやかになった。すると、人の話し合う声がした。
    声の主たち「十八公が聖僧をお招きしたぞ。」
    三蔵が顔を上げると、三人の老人だった。最初の者は霜のような姿に風格があり、二番目は青々とした鬢がふさふさしている。三番目は中身が空ろで、黛のような色をしていた。顔かたちも衣服もそれぞれ違い、みな三蔵に礼をした。三蔵も礼を返した。
    三蔵「私に何の徳があって、仙翁の皆さまのお情けをいただけるのでしょう。」
    十八公は笑った。
    十八公「かねて聖僧が道を得られたと聞き、長くお待ちしておりました。今日は幸いにお会いできた。玉のようなお言葉を惜しまず、ゆっくりお座りになって思いをお語りくだされば、禅の真の流れに触れられましょう。」
    三蔵は身をかがめた。
    三蔵「皆さまのお号を、お尋ねしてもよろしいでしょうか。」
    十八公「霜のような姿の方は孤直公（こちょくこう）、青い鬢の方は凌空子（りょうくうし）、中身が空ろな方は拂雲叟（ふつうんそう）といいます。老いぼれのわしの号は、勁節（けいせつ）です。」
    三蔵「四人の翁は、おいくつでいらっしゃいますか。」
    孤直公はこう答えた。
  "translation_status": "reviewed"
- "id": "xy-ch64-013"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「我歲今經千歲古，撐天葉茂四時春。
    香枝鬱鬱龍蛇狀，碎影重重霜雪身。
    自幼堅剛能耐老，從今正直喜修真。
    烏棲鳳宿非凡輩，落落森森遠俗塵。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 147
    "line_end": 150
  "translation_ja": |-
    孤直公「わしの齢は、今や千歳の昔に及ぶ。天を支える葉は茂り、四季いつも春。
    香る枝はうっそうと竜や蛇のように曲がり、細かな影を幾重にも落とす、霜雪のようなこの身。
    幼いころから堅く強く、老いにも耐え、今もまっすぐに、真の道を修めることを喜ぶ。
    烏が棲み、鳳凰が宿る、ただ者ではない。高くそびえて森々と、俗世の塵から遠く離れる。」
  "translation_status": "reviewed"
- "id": "xy-ch64-014"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "凌空子笑道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 152
    "line_end": 152
  "translation_ja": "凌空子は笑って詠んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch64-015"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「吾年千載傲風霜，高幹靈枝力自剛。
    夜靜有聲如雨滴，秋晴蔭影似雲張。
    盤根已得長生訣，受命尤宜不老方。
    留鶴化龍非俗輩，蒼蒼爽爽近仙鄉。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 153
    "line_end": 156
  "translation_ja": |-
    凌空子「わしは千年、風霜にも屈せず、高い幹と霊妙な枝は、おのずから力強い。
    夜が静まれば、雨滴のような音を立て、秋晴れには、雲のように木陰を広げる。
    絡み合った根にはすでに長生の秘訣を得て、授かった命には不老の法がことによくかなう。
    鶴をとどめ、竜とも化す、ただ者ではない。青々と清々しく、仙境に近い。」
  "translation_status": "reviewed"
- "id": "xy-ch64-016"

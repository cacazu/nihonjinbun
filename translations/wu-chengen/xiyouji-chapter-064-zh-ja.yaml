  "known_gaps":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-002"
    "description_ja": "衣服は各二套、鞋襪は各二双、絛環は各二条という底本の数量を保持した。絛環は紐と環を備えた服飾品と解して二組としたが、具体的な形状は確定しない。見送りの二十里・さらに二十里・僧の五六十里は、語りのまま並べ、起点を補って合計しない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-003"
    "description_ja": "底本の『又道』には主語がない。直後の『教我如何乘馬』という騎乗者の言葉と問答の流れから、三蔵の再発言として訳した。原文には主語を補わない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-008"
    "description_ja": "第一句の次は底本で『落目』。『落日』などに無断補訂せず、目を落とす・目をやる意に解して訳したが、字の異同と句の構文は留保する。青い佩玉は竹の揺れる様子を宝飾の音や色に重ねた詩語。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-017"
    "description_ja": "七賢と六逸は、文人の集いの典故を並べた表現と解した。前者は竹林の七賢、後者は李白ら竹溪の六逸を念頭に置く。第四十八回の画題『七賢』は人物内訳が未確定であるため、同じ表記だけでその辞書項目に統合しない。詩中で交友を語ることと、歴史上その交友が実在したと語り手が保証することを区別する。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-022"
    "description_ja": "三蔵の長い発言には底本で開始鉤括弧がなく、末尾の『記悟』の後に閉じ鉤括弧がある。発話動詞と応答に基づいて範囲を定めた。『發揮象罔、踏碎涅槃』は道家と仏教の語を交える逆説を保持した。『婆娑』はここでは世界を照らす文脈から娑婆と解して訳し、原文の字は保存する。後半の韻を含む句も散文の要約に置き換えない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-045"
    "description_ja": "頂針は末字を次の句の頭へ受け継ぐ技法。この連句は春→無→図→夫と続き、最後の夫は文を起こす語として『夫れ』とした。側葉・横柯・憲烏の句は、葉の向き、建築用材、御史台の烏を重ねるが、細部の構文には留保がある。前の『西山堅節老』『南國沒心夫』も、特定の名を原文に補わず、節義を守る老人と心を空にした男の像を保つ。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-051"
    "description_ja": "四絶堂の具体的な所在地と、この詩が踏まえる全典故は未確定。『石齒』も石の歯という比喩を保持し、石臼や歯形の岸など一つの物へ断定しない。鳥の王は詩的な呼称として訳した。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-055"
    "description_ja": "淇澳は詩経の淇奧に通じる地名表現、渭川は竹の多い地として伝わる。湘娥の涙には、舜の妃の涙が竹に斑点を残した故事が重なる。底本は『班籜』で、字を斑へ直さず、意味をまだらの竹皮とした。子猷は竹を愛する王子猷の故事として読む。『不染』という否定と、霜の葉の色が変わらぬことをそのまま保つ。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-058"
    "description_ja": "『煙裡火』『五色梅』『錦拖泥』は衣装の色・柄・裾を飾る詩語と解したが、染織上の細かな規格は確定しない。『天臺女』は天台で仙女に会う故事の比喩。妲姫は底本の姫の字を残し、よく知られる妲己へ本文を無断置換しない。登場した仙女自身の名や正体を、この比喩から決めつけない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-066"
    "description_ja": "杏仙の詩について、底本は『漢武王』であり、漢武帝への無断補訂はしない。天蓋との具体的な典故は未確定。孔子の壇と董仙の林は、杏壇および董奉の杏林の伝承に関連づけて読める。孫楚については、祭介子推の文に醴酪を供えることを確認できるが、この詩の香りとの結び付きの細部は留保する。ここでの『私』は詩の一人称の表現であり、語り手による正体の断定に変えない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-063"
    "description_ja": "『低行之言』は身を低くした言葉と解したが、細部の語義は留保する。鬼使の姐姐は親しい女性への呼称として『姉さん』とし、血縁を確定しない。蜜合色は古い色名で、淡黄白から微黄に赤みを帯びる色まで説明が揺れるため、本文には色名を保持した。僧も結婚もできなくするという脅し、三蔵の拒否と涙、身体を寄せる誘いを弱めていない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "segment_ids":
    - "xy-ch64-066"
    "description_ja": "悟空がここで初めて、各人物と樹木の対応を説明する。中国語の檜と柏は日本語のヒノキ・カシワと同じ種とは限らないため原表記を残す。前半は丹楓・楓樹、伐倒の列挙は楓楊となるが、無断統一しない。『兩顆臘梅、丹桂』の二株がどこまでかかるかは曖昧で、先の各二株へ数を補って直さない。根の鮮血と全伐倒を保持し、三蔵の制止と悟空の将来への懸念を、それぞれの発言として区別した。 本文欠落ではなく解釈・校訂上の留保。"

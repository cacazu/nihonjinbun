  "translation_ja": "凌空子「わしも、前の句の字を受け継いで二句を。」"
  "translation_status": "reviewed"
- "id": "xy-ch64-041"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "無風搖拽婆娑影，有客欣憐福壽圖。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 214
    "line_end": 214

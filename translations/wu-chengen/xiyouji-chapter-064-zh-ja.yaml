  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "衣服は各二套、鞋襪は各二双、絛環は各二条という底本の数量を保持した。絛環は紐と環を備えた服飾品と解して二組としたが、具体的な形状は確定しない。見送りの二十里・さらに二十里・僧の五六十里は、語りのまま並べ、起点を補って合計しない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-02-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の『又道』には主語がない。直後の『教我如何乘馬』という騎乗者の言葉と問答の流れから、三蔵の再発言として訳した。原文には主語を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-03-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "二十丈の身、三十丈の柄、百十里の進行、碑の八百里を保持した。行程を現代単位へ固定換算していない。碑文は二行十四字で、八戒が二句を付け足そうとする。『走他娘』の荒い強調は、行こうとする勢いを含めて訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-04-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "第一句の次は底本で『落目』。『落日』などに無断補訂せず、目を落とす・目をやる意に解して訳したが、字の異同と句の構文は留保する。青い佩玉は竹の揺れる様子を宝飾の音や色に重ねた詩語。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-05-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『虛心』は心が虚であることと、中が空ろであることの両方を響かせる表現として、具体的な種の同定をせず訳した。十八公はここで自らの号を勁節と説明するため、同一人物の通常名は十八公とし、紹介と有意味な呼びかけ・詩には勁節を残す。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-06-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "七賢と六逸は、文人の集いの典故を並べた表現と解した。前者は竹林の七賢、後者は李白ら竹溪の六逸を念頭に置く。第四十八回の画題『七賢』は人物内訳が未確定であるため、同じ表記だけでその辞書項目に統合しない。詩中で交友を語ることと、歴史上その交友が実在したと語り手が保証することを区別する。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-07-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵の自叙は『四十年前』という年数をそのまま保った。『脫本骸』は金山で助かってこの身を死から免れた意に解したが、文字どおりには元の骸を脱するとも読める。幼少期の各回との年齢・時系列をこの詩に合わせて補訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-08-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵の長い発言には底本で開始鉤括弧がなく、末尾の『記悟』の後に閉じ鉤括弧がある。発話動詞と応答に基づいて範囲を定めた。『發揮象罔、踏碎涅槃』は道家と仏教の語を交える逆説を保持した。『婆娑』はここでは世界を照らす文脈から娑婆と解して訳し、原文の字は保存する。後半の韻を含む句も散文の要約に置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-09-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『終坐無生之道』は無生の道に座してとどまるという批判と解した。『蘿蓏』の蓏はつる性植物の果実で、葛藤の謎と絡めた言葉遊びとしてつる草と蔓の実を残す。底のない籠・根のない鉄の木は逆説的な修行語であり、実用的な手順とは扱わない。霊宝の峰は修行の象徴を含む詩的表現として保持し、既出の霊宝天尊や実在の山に同定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-10-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "四始には『詩経』の風・小雅・大雅・頌を指す説と、それぞれの冒頭篇を指す説がある。ここでは詩篇の整理・選定に関わる名称として訳した。雅・頌は詩経の部門であり、仏教の偈頌の頌とは用法と読みを分ける。六朝の華美を洗い去るという言葉は、発言者の文学観である。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-11-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "頂針は末字を次の句の頭へ受け継ぐ技法。この連句は春→無→図→夫と続き、最後の夫は文を起こす語として『夫れ』とした。側葉・横柯・憲烏の句は、葉の向き、建築用材、御史台の烏を重ねるが、細部の構文には留保がある。前の『西山堅節老』『南國沒心夫』も、特定の名を原文に補わず、節義を守る老人と心を空にした男の像を保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-12-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "金芝三秀は霊芝が三度秀でる瑞祥の表現と解した。『百尺竿頭』は高い境地に達してもなお進むことを求める禅語。『行藏』は世に出て行うことと身を退いて隠れることをいう。ここでは進退の道として訳した。四聯八句を保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-13-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『木王』の具体的な樹種、『泉汲千年琥珀香』の生成に関する説は、詩が明示する以上には特定していない。『苓膏』はすでに供された茯苓膏に通じる省称として訳した。薬効は詩中の長寿表現であって、現代の効能を保証する説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-14-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "四絶堂の具体的な所在地と、この詩が踏まえる全典故は未確定。『石齒』も石の歯という比喩を保持し、石臼や歯形の岸など一つの物へ断定しない。鳥の王は詩的な呼称として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-15-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "太清宮は老子を祀る宮観の名だが、同名の施設が複数あり、この詩の場所は確定していない。『九泉』は地の深い所をいう。根と地下の描写を、死者が現に冥界へ移る出来事に変えていない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-16-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "淇澳は詩経の淇奧に通じる地名表現、渭川は竹の多い地として伝わる。湘娥の涙には、舜の妃の涙が竹に斑点を残した故事が重なる。底本は『班籜』で、字を斑へ直さず、意味をまだらの竹皮とした。子猷は竹を愛する王子猷の故事として読む。『不染』という否定と、霜の葉の色が変わらぬことをそのまま保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-17-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『煙裡火』『五色梅』『錦拖泥』は衣装の色・柄・裾を飾る詩語と解したが、染織上の細かな規格は確定しない。『天臺女』は天台で仙女に会う故事の比喩。妲姫は底本の姫の字を残し、よく知られる妲己へ本文を無断置換しない。登場した仙女自身の名や正体を、この比喩から決めつけない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-18-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "杏仙の詩について、底本は『漢武王』であり、漢武帝への無断補訂はしない。天蓋との具体的な典故は未確定。孔子の壇と董仙の林は、杏壇および董奉の杏林の伝承に関連づけて読める。孫楚については、祭介子推の文に醴酪を供えることを確認できるが、この詩の香りとの結び付きの細部は留保する。ここでの『私』は詩の一人称の表現であり、語り手による正体の断定に変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-19-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『佳客莫者』の者は語形・語義がはっきりしない。拒む三蔵に遊びを勧める文脈から、ためらうなという促しとして訳した。四老の同じ詩句を二度ほめる反復、媒人と縁組保証人の二つの役割を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-20-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『低行之言』は身を低くした言葉と解したが、細部の語義は留保する。鬼使の姐姐は親しい女性への呼称として『姉さん』とし、血縁を確定しない。蜜合色は古い色名で、淡黄白から微黄に赤みを帯びる色まで説明が揺れるため、本文には色名を保持した。僧も結婚もできなくするという脅し、三蔵の拒否と涙、身体を寄せる誘いを弱めていない。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-21-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵の回想では美しい女自身が灯火を持ってきたと語る。先の地の文の灯籠を持つ童女の描写に合わせて修正せず、人物の報告として保存した。老人たちの消失理由も三蔵の判断のまま訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch64-note-22-body"
  "section_id": "chapter-64"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空がここで初めて、各人物と樹木の対応を説明する。中国語の檜と柏は日本語のヒノキ・カシワと同じ種とは限らないため原表記を残す。前半は丹楓・楓樹、伐倒の列挙は楓楊となるが、無断統一しない。『兩顆臘梅、丹桂』の二株がどこまでかかるかは曖昧で、先の各二株へ数を補って直さない。根の鮮血と全伐倒を保持し、三蔵の制止と悟空の将来への懸念を、それぞれの発言として区別した。"
  "translation_status": "reviewed"

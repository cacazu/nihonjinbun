- "id": "xy-ch64-045"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "「夫因側葉稱梁棟，臺為橫柯作憲烏。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 222
    "line_end": 222
  "translation_ja": |-
    孤直公「夫れ、葉が横を向くゆえに梁や棟の材と称され、
    枝が横に張るゆえに、御史台（ぎょしだい）の烏の宿り木となる。」
  "translation_status": "reviewed"
- "id": "xy-ch64-046"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老聽了，讚嘆不已道：「真是陽春白雪，浩氣沖霄，弟子不才，敢再起兩句。」孤直公道：「聖僧乃有道之士，大養之人也。不必再相聯句，請賜教全篇，庶我等亦好勉強而和。」三藏無已，只得笑吟一律曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 224
    "line_end": 224
  "translation_ja": |-
    三蔵は聞いて、ひたすら感嘆した。
    三蔵「まことに陽春白雪（ようしゅんはくせつ）の高雅な調べ、雄大な気が空に届くようです。不才ながら、私もさらに二句、起こしてみましょう。」
    孤直公「聖僧は道を得られた方で、大いに徳を養われた方です。もう句を継ぎ合わず、どうか一篇まるごとお授けください。そうすれば、我々も何とか力を尽くして唱和できましょう。」
    三蔵は断りきれず、笑みを浮かべて律詩を一首吟じた。
  "translation_status": "reviewed"
- "id": "xy-ch64-047"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「杖錫西來拜法王，願求妙典遠傳揚。
    金芝三秀詩壇瑞，寶樹千花蓮蕊香。
    百尺竿頭須進步，十方世界立行藏。
    修成玉像莊嚴體，極樂門前是道場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 226
    "line_end": 229
  "translation_ja": |-
    三蔵「錫杖（しゃくじょう）をついて西へ来て、法王（ほうおう）を拝み、妙なる経典を求め、遠く広めることを願う。
    金の霊芝（れいし）が三度秀でて詩壇の瑞祥となり、宝の樹に千の花が咲いて、蓮の蕊が香る。
    百尺の竿の先からも、なお歩を進めねばならず、十方（じっぽう）の世界に、進退の道を立てる。
    玉の像のように荘厳な身を修め成せば、極楽（ごくらく）の門前こそ道場となる。」
  "translation_status": "reviewed"
- "id": "xy-ch64-048"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四老聽畢，俱極讚揚。十八公道：「老拙無能，大膽攙越，也勉和一首。」云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 231
    "line_end": 231
  "translation_ja": |-
    四人の老人は聞き終えると、口々に大いに讃えた。
    十八公「老いぼれに力はありませんが、大胆にも差し出がましく、一首、何とか唱和いたしましょう。」
    こう詠んだ。
  "translation_status": "reviewed"
- "id": "xy-ch64-049"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「勁節孤高笑木王，靈椿不似我名揚。
    山空百丈龍蛇影，泉汲千年琥珀香。
    解與乾坤生氣概，喜因風雨化行藏。
    衰殘自愧無仙骨，惟有苓膏結壽場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 233
    "line_end": 236
  "translation_ja": |-
    十八公「勁い節は孤高にして、木の王を笑い、霊椿（れいちん）でさえ、わしの名の広がりには及ばない。
    人気のない山には百丈の竜蛇の影があり、泉を汲めば、千年の琥珀の香りがする。
    天地とともに気概を生むことを知り、風雨に従って進退を変えることを喜ぶ。
    衰えた身に仙骨がないのを恥じるが、ただ茯苓（ぶくりょう）の膏だけは、長寿の場を結び成す。」
  "translation_status": "reviewed"
- "id": "xy-ch64-050"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孤直公道：「此詩起句豪雄，聯句有力，但結句自謙太過矣。堪羨！堪羨！老拙也和一首。」云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 237
    "line_end": 237
  "translation_ja": |-
    孤直公「この詩は起こしの句が豪快で、続く句にも力があります。ただ結びの句は、謙遜が過ぎますな。うらやましい、うらやましい。老いぼれも一首、唱和しましょう。」
    こう詠んだ。
  "translation_status": "reviewed"
- "id": "xy-ch64-051"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「霜姿常喜宿禽王，四絕堂前大器揚。
    露重珠纓蒙翠蓋，風輕石齒碎寒香。
    長廊夜靜吟聲細，古殿秋陰淡影藏。
    元日迎春曾獻壽，老來寄傲在山場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 239
    "line_end": 242
  "translation_ja": |-
    孤直公「霜のような姿には、鳥の王が宿るのをいつも喜び、四絶堂（しぜつどう）の前では、大いなる器が名を揚げる。
    重い露は珠の房となって翠の天蓋を覆い、軽い風は石の歯に、冷たい香りを砕いて散らす。
    長い廊の静かな夜には、吟ずる声もかすかで、古い殿の秋の陰には、淡い影が隠れる。
    元日には春を迎えて、かつて長寿を祝し、老いては山中に、世を誇る心を託す。」
  "translation_status": "reviewed"
- "id": "xy-ch64-052"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "凌空子笑而言曰：「好詩，好詩，真個是月脅天心。老拙何能為和？但不可空過，也須扯談幾句。」曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 244
    "line_end": 244
  "translation_ja": |-
    凌空子は笑って言った。
    凌空子「よい詩だ、よい詩だ。まことに月の脇腹、天の心を突くような妙句です。老いぼれにどうして唱和できましょう。ですが、何もせずに過ごすわけにもいかず、いくつか、勝手な句をひねってみます。」
    こう詠んだ。
  "translation_status": "reviewed"
- "id": "xy-ch64-053"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「梁棟之材近帝王，太清宮外有聲揚。
    晴軒恍若來青氣，暗壁尋常度翠香。
    壯節凜然千古秀，深根結矣九泉藏。
    凌雲勢蓋婆娑影，不在群芳豔麗場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 246
    "line_end": 249
  "translation_ja": |-
    凌空子「梁や棟となる材は帝王に近づき、太清宮（たいせいきゅう）の外には名声が揚がる。
    晴れた軒には、青い気が来るかと見え、暗い壁には、いつも翠の香りが渡る。
    強い節は凜として千古に秀で、深い根は結ばれて九泉（きゅうせん）に潜む。
    雲をしのぐ勢いは、こんもりした影を覆い、花々が美しさを競う場には立たない。」
  "translation_status": "reviewed"
- "id": "xy-ch64-054"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "拂雲叟道：「三公之詩，高雅清淡，正是放開錦繡之囊也。我身無力，我腹無才，得三公之教，茅塞頓開。無已，也打油幾句，幸勿哂焉。」詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 251
    "line_end": 251
  "translation_ja": |-
    拂雲叟「お三方の詩は、高雅で清淡、まさに錦繡の袋を開け放ったようです。私の身には力もなく、腹にも才はありませんが、お三方の教えを受け、塞がっていた心が、にわかに開けました。やむなく、つまらぬ句を少し作りますが、どうかお笑いくださいますな。」
    その詩はこうだった。
  "translation_status": "reviewed"
- "id": "xy-ch64-055"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「淇澳園中樂聖王，渭川千畝任分揚。
    翠筠不染湘娥淚，班籜堪傳漢史香。
    霜葉自來顏不改，煙梢從此色何藏？
    子猷去世知音少，亙古留名翰墨場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 253
    "line_end": 256
  "translation_ja": |-
    拂雲叟「淇澳（きいく）の園では聖なる王を楽しませ、渭川（いせん）の千畝には、思うままに広がる。
    翠の肌は湘娥（しょうが）の涙に染まらず、まだらの竹の皮は、漢の歴史の香りを伝えるに足る。
    霜を受ける葉はもとより色を変えず、霞む梢は、それならどこへ色を隠そう。
    子猷（しゆう）が世を去って、心を知る者は少ないが、はるかな昔から、筆墨の場に名を残す。」
  "translation_status": "reviewed"
- "id": "xy-ch64-056"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「眾仙老之詩，真個是吐鳳噴珠，游夏莫贊。厚愛高情，感之極矣。但夜已深沉，三個小徒不知在何處等我。弟子不能久留，敢此告回尋訪，尤無窮之至愛也。望老仙指示歸路。」四老笑道：「聖僧勿慮。我等也是千載奇逢，況天光晴爽，雖夜深卻月明如晝，再寬坐坐，待天曉自當遠送過嶺，高徒一定可相會也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 257
    "line_end": 257
  "translation_ja": |-
    三蔵「仙翁の皆さまの詩は、まことに鳳凰を吐き、珠を噴き出すようです。子游（しゆう）や子夏（しか）さえ、褒める言葉を添えられないでしょう。厚いお情けと高いお心に、感謝の極みです。ですが、もう夜も深く、三人の弟子がどこで私を待っているか分かりません。これ以上はとどまれませんので、お別れして捜しに戻りたいと存じます。それをお許しくだされば、この上ないお情けです。どうか帰り道をお教えください。」
    四人の老人は笑った。
    四人の老人「聖僧、ご心配なさるな。我々にも千年に一度の出会いです。しかも空は晴れわたり、夜は深くとも、月明かりは昼のよう。もう少しゆっくりお座りください。夜が明けたら、きっと遠く尾根の向こうまでお送りします。お弟子たちにも、必ず会えるでしょう。」
  "translation_status": "reviewed"
- "id": "xy-ch64-057"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正話間，只見石屋之外，有兩個青衣女童，挑一對絳紗燈籠，後引著一個仙女。那仙女撚著一枝杏花，笑吟吟進門相見。那仙女怎生模樣？他生得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 259
    "line_end": 259
  "translation_ja": "話していると、石の家の外に、青衣の童女が二人現れ、一対の深紅の紗の灯籠を担いで、その後ろに一人の仙女を導いてきた。仙女は杏の花を一枝、指に持ち、にこにこしながら門を入って会いに来た。その仙女は、どんな姿だったかといえば、"
  "translation_status": "reviewed"
- "id": "xy-ch64-058"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "青姿妝翡翠，丹臉賽胭脂。星眼光還彩，蛾眉秀又齊。下襯一條五色梅淺紅裙子，上穿一件煙裡火比甲輕衣。弓鞋彎鳳嘴，綾襪錦拖泥。妖嬈嬌似天臺女，不亞當年俏妲姬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 261
    "line_end": 261
  "translation_ja": |-
    若々しい姿を翡翠で飾り、赤い頬は紅にもまさる。
    星のような瞳には光と彩りがあり、蛾の触角のような眉は美しく整う。
    下には五色の梅をあしらった薄紅の裳、上には煙の中の火のような色の、袖なしの軽い比甲（ひこう）。
    弓なりの靴は鳳凰の嘴のように曲がり、綾の足袋に、錦の裾を地に引く。
    艶やかな美しさは天台の仙女に似て、その昔の美しい妲姫（だっき）にも劣らない。
  "translation_status": "reviewed"
- "id": "xy-ch64-059"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四老欠身問道：「杏仙何來？」那女子對眾道了萬福，道：「知有佳客在此賡酬，特來相訪，敢求一見。」十八公指著唐僧道：「佳客在此，何勞求見？」三藏躬身，不敢言語。那女子叫：「快獻茶來。」又有兩個黃衣女童捧一個紅漆丹盤，盤內有六個細磁茶盂，盂內設幾品異果，橫擔著匙兒；提一把白鐵嵌黃銅的茶壺，壺內香茶噴鼻。斟了茶，那女子微露春蔥，捧磁盂先奉三藏，次奉四老，然後一盞，自取而陪。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 263
    "line_end": 263
  "translation_ja": |-
    四人の老人は身を起こして尋ねた。
    四人の老人「杏仙（きょうせん）、どうしてこちらへ。」
    杏仙と呼ばれた女は、皆に万福の礼をした。
    杏仙「佳いお客さまがこちらで詩を唱和しておられると知り、特にお訪ねしました。ぜひ、お目にかかりたいと存じまして。」
    十八公は三蔵を指した。
    十八公「佳客はここにおられる。わざわざお求めになるまでもない。」
    三蔵は身をかがめたが、言葉も出せなかった。
    杏仙「早くお茶をお持ち。」
    今度は黄衣の童女が二人、赤漆の盆を捧げて現れた。盆には精巧な磁器の茶碗が六つあり、碗の中には珍しい果実が数種類入れてあり、匙を横に渡してあった。また、白い鉄に真鍮を象嵌した茶壺を一つ提げていて、その中の茶は鼻を打つほど香る。茶を注ぐと、杏仙は春の葱のような指を少しのぞかせ、磁器の碗を捧げて、まず三蔵に、次に四人の老人に渡し、それから一椀を自分で取って、相伴した。
  "translation_status": "reviewed"
- "id": "xy-ch64-060"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "凌空子道：「杏仙為何不坐？」那女子方才去坐。茶畢，欠身問道：「仙翁今宵盛樂，佳句請教一二如何？」拂雲叟道：「我等皆鄙俚之言，惟聖僧真盛唐之作，甚可嘉羨。」那女子道：「如不吝教，乞賜一觀。」四老即以長老前詩後詩並禪法論，宣了一遍。那女子滿面春風，對眾道：「妾身不才，不當獻醜。但聆此佳句，似不可虛，勉強將後詩奉和一律如何？」遂朗吟道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 264
    "line_end": 264
  "translation_ja": |-
    凌空子「杏仙、どうしてお座りにならない。」
    そこで杏仙もようやく席についた。茶がすむと、身を起こして尋ねた。
    杏仙「仙翁の皆さま、今宵はずいぶんお楽しみのご様子。佳い句を一つ二つ、お教えいただけませんか。」
    拂雲叟「我々のは、どれも拙く俗な言葉です。ただ聖僧の作こそ、真に盛唐（せいとう）の詩で、じつに讃え慕うべきものです。」
    杏仙「お教えを惜しまれなければ、ぜひ拝見させてください。」
    四人の老人は、三蔵の前の詩と後の詩、それに禅の法を論じた話を、ひと通り読み上げた。杏仙は顔いっぱいに春風のような笑みを浮かべ、皆に言った。
    杏仙「私は不才で、お恥ずかしいものをお目にかけるべきではありませんが、これほどの佳句を伺って、黙っているわけにもまいりません。後の詩に、何とか一首の律詩を唱和してもよろしいでしょうか。」
    そして朗々と吟じた。
  "translation_status": "reviewed"
- "id": "xy-ch64-061"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「上蓋留名漢武王，周時孔子立壇揚。
    董仙愛我成林積，孫楚曾憐寒食香。
    雨潤紅姿嬌且嫩，煙蒸翠色顯還藏。
    自知過熟微酸意，落處年年伴麥場。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 266
    "line_end": 269
  "translation_ja": |-
    杏仙「上を覆う天蓋として、漢武王（かんぶおう）に名を残し、周のころ、孔子（こうし）が壇を立てて名を揚げた。
    董仙（とうせん）は私を愛して林をなし、孫楚（そんそ）もかつて、寒食（かんしょく）の香りを愛でた。
    雨が潤す紅の姿は、艶やかで柔らかく、霞が蒸す翠の色は、現れては隠れる。
    熟しすぎれば、かすかな酸味を持つと自ら知り、落ちる所は毎年、麦打ち場の傍ら。」
  "translation_status": "reviewed"
- "id": "xy-ch64-062"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四老聞詩，人人稱賀，都道：「清雅脫塵，句內包含春意。好個『雨潤紅姿嬌且嫩』！『雨潤紅姿嬌且嫩』！」那女子笑而悄答道：「惶恐，惶恐。適聞聖僧之章，誠然錦心繡口。如不吝珠玉，賜教一闋如何？」唐僧不敢答應。那女子漸有見愛之情，挨挨軋軋，漸近坐邊，低聲悄語，呼道：「佳客莫者，趁此良宵，不耍子待要怎的？人生光景，能有幾何？」十八公道：「杏仙盡有仰高之情，聖僧豈可無俯就之意？如不見憐，是不知趣了也。」孤直公道：「聖僧乃有道有名之士，決不苟且行事。如此樣舉措，是我等取罪過了。污人名，壞人德，非遠達也。果是杏仙有意，可教拂雲叟與十八公做媒，我與凌空子保親，成此姻眷，何不美哉？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 270
    "line_end": 270
  "translation_ja": |-
    四人の老人は詩を聞いて、一人残らず褒めそやし、口をそろえた。
    四人の老人「清らかで雅やか、俗世を離れ、句の中には春の思いが満ちている。見事な『雨が潤す紅の姿は、艶やかで柔らかく』だ！　『雨が潤す紅の姿は、艶やかで柔らかく』！」
    杏仙は笑い、小声で答えた。
    杏仙「恐れ入ります、恐れ入ります。先ほど聖僧の詩を伺いましたが、まことに錦の心に刺繡の口をお持ちです。珠玉のお言葉を惜しまれず、一曲お教えいただけませんか。」
    三蔵は答えることもできなかった。杏仙はしだいに恋い慕う様子を見せ、じりじりと身をすり寄せ、座のそばへ近づいて、ひそひそと呼びかけた。
    杏仙「佳いお方、ためらわないで。このよい夜に楽しまず、どうなさるおつもり。人生のよい時など、どれほどあるでしょう。」
    十八公「杏仙はこれほど聖僧を仰ぎ慕っているのです。聖僧にも、身を低くしてお応えになるお気持ちがあってよいでしょう。憐れんでやらないのなら、風情を解さぬというものです。」
    孤直公「聖僧は道も名もある方だから、けっしていい加減なことはなさらぬ。こんな振る舞いでは、我々が罪を招くことになる。人の名を汚し、徳を損なうのは、先を見通したやり方ではない。本当に杏仙にその気があるなら、拂雲叟と十八公が媒人となり、わしと凌空子が縁組の保証人になればよい。この婚姻を結べば、まことにめでたいではないか。」
  "translation_status": "reviewed"
- "id": "xy-ch64-063"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏聽言，遂變了顏色，跳起來高叫道：「汝等皆是一類怪物，這般誘我。當時只以低行之言，談玄談道可也。如今怎麼以美人局來騙害貧僧？是何道理？」四老見三藏發怒，一個個咬指擔驚，再不復言。那赤身鬼使暴躁如雷道：「這和尚好不識擡舉。我這姐姐那些兒不好？他人材俊雅，玉質嬌姿，不必說那女工針指，只這一段詩材，也配得過你。你怎麼這等推辭？休錯過了。孤直公之言甚當，如果不可苟合，待我再與你主婚。」三藏大驚失色，憑他們怎麼胡談亂講，只是不從。鬼使又道：「你這和尚，我們好言好語，你不聽從。若是我們發起村野之性，還把你攝了去，教你和尚不得做，老婆不得娶，卻不枉為人一世也？」那長老心如金石，堅執不從。暗想道：「我徒弟們不知在那裡尋我哩！」說一聲，止不住眼中墮淚。那女子陪著笑，挨至身邊，翠袖中取出一個蜜合綾汗巾來，與他揩淚道：「佳客勿得煩惱。我與你倚玉偎香，耍子去來。」長老咄的一聲吆喝，跳起身來就走。被那些人扯扯拽拽，嚷到天明。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 271
    "line_end": 271
  "translation_ja": |-
    三蔵はそれを聞くと顔色を変え、跳び起きて大声を上げた。
    三蔵「お前たちはみな同じ類の化け物で、こんなふうに私を誘うのか。初めは身を低くした言葉で、玄妙なことや道を語るだけならよかった。今になって、どうして美人の罠で私をだまし、害そうとする。何という道理だ！」
    四人の老人は三蔵が怒ったのを見ると、一人ずつ指を噛み、恐れおののいて、二度と口をきかなかった。赤裸の鬼の使いは、雷のようにかっと怒った。
    鬼の使い「この和尚、まるで厚意が分からぬ奴だな。うちの姉さんの、どこが悪いんだ。器量は上品で美しく、玉のような肌に、あでやかな姿。針仕事の腕は言うまでもなく、詩の才だけでも、お前の相手には十分だ。なぜそう断る。好機を逃すな。孤直公の言うことはまったくだ。かりそめに交われないというなら、俺があらためて婚礼を取り仕切ってやる。」
    三蔵はひどく驚いて青ざめ、相手が何を勝手に言い立てようと、従おうとしなかった。
    鬼の使い「この和尚、俺たちが言葉を尽くして頼んでも聞かぬのか。こちらが荒々しい本性を出して、もう一度さらっていったら、和尚にもなれず、女房も娶れぬようにしてやるぞ。そうなれば、一生を人として生きた甲斐もなくなるではないか。」
    三蔵の心は金石のように固く、断じて従わなかった。ひそかに思った。
    三蔵の心の声「弟子たちは、どこで私を捜しているのだろう。」
    一声つぶやくと、目から涙がとめどなく落ちた。杏仙は愛想笑いをしながら体のそばへ寄り、翠の袖から蜜合色（みつごうしょく）の綾の手巾を出し、涙を拭いてやりながら言った。
    杏仙「佳いお方、くよくよなさらないで。私の玉のような肌、香る体に寄り添って、一緒に楽しみに参りましょう。」
    三蔵は「えいっ！」と一喝し、跳び起きて出ていこうとした。だが一同に引っ張られ、引き戻されて、夜明けまで騒ぎ続けた。
  "translation_status": "reviewed"
- "id": "xy-ch64-064"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "忽聽得那裡叫聲：「師父，師父，你在那方言語也？」原來那孫大聖與八戒、沙僧牽著馬，挑著擔，一夜不曾住腳，穿荊度棘，東尋西找。卻好半雲半霧的過了八百里荊棘嶺西下，聽得唐僧吆喝，卻就喊了一聲。那長老掙出門來，叫聲：「悟空，我在這裡哩。快來救我，快來救我。」那四老與鬼使，那女子與女童，幌一幌，都不見了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 272
    "line_end": 272
  "translation_ja": |-
    ふと、どこからか呼ぶ声が聞こえた。
    声の主「お師匠さま、お師匠さま、どちらでお話しになっているのですか。」
    それは悟空、八戒、沙悟浄が、馬を引き、荷を担いで来たのだった。一晩じゅう足を休めず、茨をくぐって東へ西へ捜し、ちょうど雲とも霧ともつかぬ中を、八百里の荊棘嶺を越えて西へ下ってきた。三蔵の怒鳴る声が聞こえたので、ひと声呼んだのである。三蔵は門の外へ身を振りほどいて出ると、叫んだ。
    三蔵「悟空、私はここです。早く助けておくれ、早く助けておくれ！」
    四人の老人と鬼の使い、杏仙と童女たちは、さっと身を揺らすと、みな消えてしまった。
  "translation_status": "reviewed"
- "id": "xy-ch64-065"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "須臾間，八戒、沙僧俱到邊前道：「師父，你怎麼得到此也？」三藏扯住行者道：「徒弟啊，多累了你們了。昨日晚間見的那個老者，言說土地送齋一事，是你喝聲要打，他就把我擡到此方。他與我攜手相攙，走入門，又見三個老者，來此會我，俱道我做『聖僧』。一個個言談清雅，極善吟詩。我與他賡和相攀，覺有夜半時候，又見一個美貌女子執燈火，也來這裡會我，吟了一首詩，稱我做『佳客』。因見我相貌，欲求配偶，我方省悟。正不從時，又被他做媒的做媒，保親的保親，主婚的主婚，我立誓不肯。正欲掙著要走，與他嚷鬧，不期你們到了。一則天明，二來還是怕你，只才還扯扯拽拽，忽然就不見了。」行者道：「你既與他敘話談詩，就不曾問他個名字？」三藏道：「我曾問他之號：那老者喚做十八公，號勁節；第二個號孤直公；第三個號凌空子；第四個號拂雲叟；那女子，稱他做杏仙。」八戒道：「此物在於何處？才往那方去了？」三藏道：「去向之方，不知何所；但只談詩之處，去此不遠。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 273
    "line_end": 273
  "translation_ja": |-
    すぐに八戒と沙悟浄も、そばへ来た。
    八戒と沙悟浄「お師匠さま、どうしてここへ来られたのです。」
    三蔵は悟空をつかんだ。
    三蔵「弟子たちよ、ずいぶん苦労をかけました。昨夜見たあの老人が、土地神だと言って斎食を持ってきたでしょう。お前が怒鳴って打とうとすると、私をこちらへ運んできたのです。私の手を取って支え、門へ入ると、さらに三人の老人が会いに来て、みな私を『聖僧』と呼びました。一人ひとり言葉は清らかで上品、たいそう詩に巧みでした。私も詩を唱和して親しく話しているうち、夜半ごろだったでしょうか、今度は美しい女が灯火を持ってやって来て、一首詠み、私を『佳客』と呼びました。私の顔を見て夫婦になりたがったので、そこでようやく気づいたのです。断ろうとしていると、媒人になる者、縁組を保証する者、婚礼を取り仕切る者まで出てきましたが、私は断じて承知しないと誓いました。振りほどいて出ようと争っているところへ、思いがけずお前たちが来てくれました。夜が明けたこともあり、やはりお前を恐れたのでしょう、つい先ほどまで引っ張っていたのに、急に姿を消したのです。」
    悟空「それほど話し、詩まで語り合ったのに、名前は聞かなかったのですか。」
    三蔵「号は尋ねました。あの老人は十八公といい、号は勁節。二番目は孤直公、三番目は凌空子、四番目は拂雲叟。あの女は杏仙と呼ばれていました。」
    八戒「そいつらは、どこにいるんだ。さっき、どっちへ行った。」
    三蔵「行った方角は分かりません。ただ、詩を語った所は、ここから遠くありません。」
  "translation_status": "reviewed"
- "id": "xy-ch64-066"

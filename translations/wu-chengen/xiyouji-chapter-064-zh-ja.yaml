- "id": "xy-ch64-poem-sanzo-rhymed-sermon"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch64-022"
    "source_span":
      "start": 213
      "end": 279
      "exact": "必須覺中覺了悟中悟，一點靈光全保護。放開烈焰照婆娑，法界縱橫獨顯露。至幽微，更守固，玄關口說誰人度？我本元修大覺禪，有緣有志方記悟。"
    "translation_span":
      "start": 493
      "end": 682
      "exact": |-
        覚りのうちにさらに覚り、悟りのうちにさらに悟り、一点の霊光を全うして守らねばならない。
        激しい炎を放って娑婆（しゃば）を照らせば、法界（ほっかい）を縦横にただひとり、明らかに現れる。
        きわめて幽かで微妙な境地に達しても、なお堅く守らねばならない。玄関（げんかん）の奥義を口で説くだけで、誰が渡れよう。
        私はもとより大覚の禅を修める者。縁と志があってこそ、心に留めて悟れるのです。
  "separator": |2+

  "description_ja": "散文単位内の碑文・追加二句・説法の韻文を全句対訳。独立した韻文26区画とは別に範囲を明示。"
- "id": "xy-ch64-poem-fuyun-rhymed-ending"
  "kind": "poem"
  "members":
  - "segment_id": "xy-ch64-023"
    "source_span":
      "start": 244
      "end": 274
      "exact": "沒底竹籃汲水，無根鐵樹生花。靈寶峰頭牢著腳，歸來雅會上龍華。"
    "translation_span":
      "start": 525
      "end": 606
      "exact": |-
        底のない竹籠で水を汲み、根のない鉄の木に花を咲かせる。
        霊宝（れいほう）の峰の頂にしっかり足を据え、帰ってきて、風雅な集いから竜華（りゅうげ）の会へ参りましょう。
  "separator": |2+


  "translation_status": "reviewed"
- "id": "xy-ch64-044"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孤直公亦頂針道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"

  "source_text": "他三人同師父看處，只見一座石崖，崖上有「木仙庵」三字。三藏道：「此間正是。」行者仔細觀之，卻原來是一株大檜樹、一株老柏、一株老松、一株老竹，竹後有一株丹楓。再看崖那邊，還有一株老杏、二株臘梅、二株丹桂。行者笑道：「你可曾看見妖怪？」八戒道：「不曾。」行者道：「你不知就是這幾株樹木在此成精也。」八戒道：「哥哥怎得知成精者是樹？」行者道：「十八公乃松樹，孤直公乃柏樹，凌空子乃檜樹，拂雲叟乃竹竿，赤身鬼乃楓樹，杏仙即杏樹，女童即丹桂即臘梅也。」八戒聞言，不論好歹，一頓釘鈀，三五長嘴，連拱帶築，把兩顆臘梅、丹桂、老杏、楓楊俱揮倒在地，果然那根下俱鮮血淋漓。三藏近前扯住道：「悟能，不可傷了他。他雖成了氣候，卻不曾傷我。我等找路去罷。」行者道：「師父不可惜他，恐日後成了大怪，害人不淺也。」那獃子索性一頓鈀，將松、柏、檜、竹一齊皆築倒，卻才請師父上馬，順大路一齊西行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 274
    "line_end": 274
  "translation_ja": |-
    三人が三蔵と一緒に見にいくと、石の崖があり、崖の上に「木仙庵」の三文字があった。
    三蔵「まさにここです。」
    悟空がよく見ると、そこにあるのは大きな檜（かい）の木一本、古い柏一本、古い松一本、古い竹一本で、竹の後ろには赤い楓が一本あった。崖の向こうを見ると、さらに古い杏が一本、臘梅（ろうばい）が二本、丹桂（たんけい）が二本ある。
    悟空は笑った。
    悟空「妖怪を見かけたか。」
    八戒「見てないぞ。」
    悟空「分からんのか。この何本かの木が、ここで精になったんだ。」
    八戒「兄貴、精になったのが木だと、どうして分かる。」
    悟空「十八公は松、孤直公は柏、凌空子は檜、拂雲叟は竹、赤裸の鬼は楓、杏仙は杏だ。童女たちは丹桂と臘梅さ。」
    八戒は聞くなり、善悪も構わずまぐわを続けざまに振るい、長い口でも三度五度と、掘り返したり突いたりして、二株の臘梅、丹桂、古い杏、楓楊（ふうよう）を、ことごとく地面へなぎ倒した。すると果たして、その根もとからは、どれも鮮血がだらだら流れた。三蔵は駆け寄って、八戒をつかんだ。
    三蔵「悟能（ごのう）、傷つけてはなりません。力を得たとはいえ、私を傷つけたわけではありません。道を探して行きましょう。」
    悟空「お師匠さま、惜しんではなりません。後に大きな妖怪となって、人にひどい害をなすかもしれません。」
    八戒は思い切って、さらにひとしきりまぐわを振るい、松、柏、檜、竹も一斉に突き倒した。それからようやく三蔵を馬に乗せ、皆そろって大きな道を西へ進んだ。
  "translation_status": "reviewed"

  "translation_ja": |-
    拂雲叟「六朝（りくちょう）の華やかな飾りを、すっかり洗い去り、
    四始（しし）をあらためて選び直して、雅（が）と頌（しょう）を分かつ。」
  "translation_status": "reviewed"
- "id": "xy-ch64-036"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「弟子一時失口，胡談幾字，誠所謂『班門弄斧』。適聞列仙之言，清新飄逸，真詩翁也。」勁節老道：「聖僧不必閑敘，出家人全始全終，既有起句，何無結句？望卒成之。」三藏道：「弟子不能，煩十八公結而成篇為妙。」勁節道：「你好心腸，你起的句，如何不肯結果？慳吝珠璣，非道理也。」三藏只得續後二句云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 205
    "line_end": 205
  "translation_ja": |-
    三蔵「私はつい口を滑らせ、でたらめを少し申しただけです。まさに班門（はんもん）で斧を振るうというもの。いま皆さまのお言葉を伺えば、清新で、世俗を離れた趣があります。真の詩の翁でいらっしゃる。」
    十八公「聖僧、余談はそのくらいに。出家の身なら、始めたことは終わりまで全うするものです。起こしの句があるのに、結びの句がないのはなぜでしょう。最後まで仕上げてください。」
    三蔵「私にはできません。十八公に結んでいただいて、一篇にしていただくのがよろしいでしょう。」
    十八公「ずいぶんお優しいお心ですな。ご自分が起こした句なのに、どうして結ぼうとしないのです。珠玉を惜しむとは、道理にかないません。」
    三蔵はやむなく、後の二句を継いだ。
  "translation_status": "reviewed"
- "id": "xy-ch64-037"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "「半枕松風茶未熟，吟懷瀟灑滿腔春。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 207
    "line_end": 207
  "translation_ja": |-
    三蔵「松風を半ば枕に、茶もまだ煮えぬうち、
    詠む心はさっぱりとして、胸いっぱいに春が満ちる。」
  "translation_status": "reviewed"
- "id": "xy-ch64-038"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "十八公道：「好個『吟懷瀟灑滿腔春』！」孤直公道：「勁節，你深知詩味，所以只管咀嚼。何不再起一篇？」十八公亦慨然不辭道：「我卻是頂針字起："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 208
    "line_end": 208
  "translation_ja": |-
    十八公「見事な『詠む心はさっぱりとして、胸いっぱいに春が満ちる』だ！」
    孤直公「勁節、君は詩の味わいをよく知っているから、いつまでも噛みしめるのだな。もう一篇、始めてはどうだ。」
    十八公も快く引き受けた。
    十八公「では、わしは字を受け継ぐ頂針（ちょうしん）で始めよう。」
  "translation_status": "reviewed"
- "id": "xy-ch64-039"
  "section_id": "chapter-64"
  "kind": "verse"
  "origin": "source"
  "source_text": "春不榮華冬不枯，雲來霧往只如無。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455613&title=西遊記/第064回"
    "line_start": 210
    "line_end": 210
  "translation_ja": |-
    十八公「春にも華やかに咲かず、冬にも枯れず、
    雲が来ても霧が去っても、ただ何もないのと同じ、無。」
  "translation_status": "reviewed"
- "id": "xy-ch64-040"
  "section_id": "chapter-64"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "凌空子道：「我亦體前頂針二句："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch64-1455613"

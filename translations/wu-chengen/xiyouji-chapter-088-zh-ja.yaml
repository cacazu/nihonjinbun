  "source_text": "卻說那王子退殿進宮，宮中有三個小王子，見他面容改色，即問道：「父王今日為何有此驚恐？」王子道：「適才有東土大唐差來拜佛取經的一個和尚倒換關文，卻一表非凡。我留他吃齋，他說有徒弟在府前，我即命請。少時進來，見我不行大禮，打個問訊，我已不快；及擡頭看時，一個個醜似妖魔，心中不覺驚駭，故此面容改色。」原來那三個小王子比眾不同，一個個好武好強，便就伸拳擄袖道：「莫敢是那山裡走來的妖精假裝人像，待我們拿兵器出去看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"

    "source_sequence": 17
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "三人の王子は恐れ入って、地べたにひざまずいた。暴紗亭にいる上下の役人たち、王府の玉華王、城じゅうの軍人、民、男、女、僧、尼、道士、俗人、すべての人々が、どの家でも念仏を唱えて頭を地につけ、家ごとに香をつまんで礼拝した。まさしく、"
  "translation_status": "reviewed"
- "id": "xy-ch88-018"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    見像歸真度眾僧，人間作福享清平。
    從今果正菩提路，盡是參禪拜佛人。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 151
    "line_end": 152
    "source_sequence": 18
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    神々しい姿を見て真へ帰り、多くの僧を救い導く。
    人の世に福をなし、安らかな平和を享受する。
    今からは悟りの実が、正しい菩提（ぼだい）の道に結ばれ、
    誰もが禅を修め、仏を拝む人となる。
  "translation_status": "reviewed"
- "id": "xy-ch88-019"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他三個各逞雄才，使了一路，按下祥雲，把兵器收了。到唐僧面前問訊，謝了師恩，各各坐下不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 153
    "line_end": 153
    "source_sequence": 19
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "三人はそれぞれ卓越した腕前を披露して、一連の技を演じ終えると、めでたい雲を下ろし、武器を収めた。三蔵の前で挨拶し、師の恩に礼を述べて、それぞれ座った。こちらはひとまずおく。"
  "translation_status": "reviewed"
- "id": "xy-ch88-020"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那三個小王子急回宮裡，告奏老王道：「父王萬千之喜，今有莫大之功也。適才可曾看見半空中舞弄麼？」老王道：「我才見半空霞彩，就於宮院內同你母親等眾焚香啟拜，更不知是那裡神仙降聚也。」小王子道：「不是那裡神仙，就是那取經僧三個醜徒弟。一個使金箍鐵棒，一個使九齒釘鈀，一個使降妖寶杖，把我三個的兵器比的通沒有分毫。我們教他使一路，他說：『地上窄狹，不好支吾，等我起在空中，使一路你看。』他就各駕雲頭，滿空中祥雲縹緲，瑞氣氤氳。才然落下，都坐在暴紗亭裡。做兒的十分歡喜，欲要拜他為師，學他手段，保護我邦。此誠莫大之功，不知父王以為何如？」老王聞言，信心從願。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 155
    "line_end": 155
    "source_sequence": 20
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    三人の王子は急いで奥の宮へ戻り、父王に申し上げた。
    三人の王子「父上、幾重にもお喜び申し上げます。今、これほど大きな恵みはございません。先ほど、空中で武器を振るっていたのをご覧になりましたか。」
    玉華王「さっき中空に色鮮やかな霞が見えたので、宮の庭で、お前たちの母や皆と香をたき、祈って拝んでいたのだ。どこの仙人が降り集まられたのか、まるで分からなかった。」
    王子の一人「どこかの仙人ではありません。経を取りに行く僧の、あの醜い三人の弟子です。一人は金箍鉄棒（きんこてつぼう）、一人は九歯釘鈀（きゅうしていは）、一人は降妖宝杖を使い、比べてみると、私たち三人の武器など物の数にも入りませんでした。ひととおり演じてほしいと頼むと、『地上は狭くて動きにくい。空へ上がって演じて見せよう』と言って、それぞれ雲に乗り、空一面にめでたい雲をたなびかせ、瑞気を満たしたのです。つい先ほど下りて、今は皆、暴紗亭に座っておられます。私たちはたいへん喜び、弟子入りしてあの技を学び、わが国を守りたいと存じます。これこそ、この上ない恵みです。父上はどうお考えでしょうか。」
    玉華王は聞くと、心から信じ、その願いを認めた。
  "translation_status": "reviewed"
- "id": "xy-ch88-021"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時父子四人不擺駕，不張蓋，步行到暴紗亭。他四眾收拾行李，欲進府謝齋，辭王起行，偶見玉華王父子上亭來，倒身下拜。慌得長老舒身，撲地還禮；行者等閃過傍邊，微微冷笑。眾拜畢，請四眾進府堂上坐。四眾欣然而入。老王起身道：「唐老師父，孤有一事奉求，不知三位高徒可能容否？」三藏道：「但憑千歲吩咐，小徒不敢不從。」老王道：「孤先見列位時，只以為唐朝遠來行腳僧，其實肉眼凡胎，多致輕褻。適見孫師、豬師、沙師起舞在空，方知是仙是佛。孤三個犬子，一生好弄武藝，今謹發虔心，欲拜為門徒，學些武藝。萬望老師開天地之心，普運慈舟，傳度小兒，必以傾城之資奉謝。」行者聞言，忍不住呵呵笑道：「你這殿下，好不會事。我等出家人，巴不得要傳幾個徒弟。你令郎既有從善之心，切不可說起分毫之利；但只以情相處，足為愛也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 156
    "line_end": 156
    "source_sequence": 21
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    その場で父子四人は、行列も仕立てず、傘も張らず、歩いて暴紗亭へ向かった。三蔵たち四人は荷物をまとめ、府へ行って食事の礼を述べ、王に別れを告げて出発しようとしていた。すると玉華王父子が亭に上がってきて、身を伏せて拝んだ。三蔵は慌てて立ち上がり、地に伏して礼を返した。悟空たちは脇へ身をかわし、かすかに冷ややかな笑みを浮かべた。拝礼が済むと、王は四人を府内の広間の上座へ招いた。四人は快く入った。王が立って言った。
    玉華王「唐（とう）の老師さま、ひとつお願いがございます。三人の高弟がお受けくださるか、分かりませんが。」
    三蔵「どうぞ殿下のお望みをお申しつけください。弟子どもも従わずにはおりますまい。」
    玉華王「先ほど皆さまを見た時には、ただ唐朝から遠く旅してきた行脚の僧と思っておりました。まことに凡人の目しか持たず、数々の失礼をいたしました。たった今、孫（そん）のお師匠さま、猪（ちょ）のお師匠さま、沙（さ）のお師匠さまが空中で武を舞われるのを見て、初めて仙人であり仏であると知りました。私の三人の愚息は、昔から武芸を好んでおります。今、真心を起こして門弟となり、少しでも武芸を学びたいと願っております。どうか老師方、天地のように広いお心を開き、慈悲の舟をあまねく巡らせ、息子たちを教え導いてください。必ず城の財を傾けて、お礼を申し上げます。」
    悟空はそれを聞くと、思わず声を上げて笑った。
    悟空「殿下も、ずいぶん物事をご存じない。俺たち出家の者は、弟子を何人か取りたくてたまらないのだ。ご子息に善へ向かう心があるのなら、少しでも金の話などするものじゃない。真心で付き合えば、それで十分に愛情は伝わる。」
  "translation_status": "reviewed"
- "id": "xy-ch88-022"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王子聽言，十分歡喜。隨命大排筵宴，就於本府正堂擺列。噫！一聲旨意，即刻俱完。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 158
    "line_end": 158
    "source_sequence": 22
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "玉華王は聞いて大いに喜び、ただちに盛大な宴を命じ、本府の正堂に席を並べさせた。ああ、ひと言のお下知で、たちまち何もかも整った。その様子は、"
  "translation_status": "reviewed"
- "id": "xy-ch88-023"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": "結綵飄颻，香煙馥郁。戧金桌子掛絞綃，晃人眼目；彩漆椅兒鋪錦繡，添座風光。樹果新鮮，茶湯香噴。三五道閑食清甜，一兩餐饅頭豐潔。蒸酥蜜煎更奇哉，油炸糖澆真美矣。有幾瓶香糯素酒，斟出來，賽過瓊漿；獻幾番陽羨仙茶，捧到手，香欺丹桂。般般品品皆齊備，色色行行盡出奇。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 159
    "line_end": 159
    "source_sequence": 23
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    飾りの絹がひらひらと舞い、香の煙が豊かに漂う。
    戧金（そうきん）の卓には絞綃（こうしょう）を掛け、見る者の目をまばゆく照らし、
    彩漆の椅子には錦繍を敷き、席に美しさを添えている。
    木の実や果物は新鮮で、茶は香りを立てる。
    三皿五皿の軽い菓子は清らかに甘く、一膳二膳の饅頭は豊かで清潔だ。
    蒸酥（じょうそ）や蜜煮は、いっそう見事、
    油で揚げ砂糖を掛けたものも、実においしい。
    数瓶の香りよい糯米の素酒（そしゅ）は、注げば仙界の美酒にもまさり、
    幾度も出される陽羨（ようせん）の仙茶は、手に受ければ丹桂（たんけい）をもしのぐ香りだ。
    あらゆる品々がそろい、どの色どの姿も、趣向を極めている。
  "translation_status": "reviewed"
- "id": "xy-ch88-024"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一壁廂叫承應的歌舞吹彈，撮弄演戲。他師徒們並王父子盡樂一日。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 161
    "line_end": 161
    "source_sequence": 24
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "その一方では、宴に仕える芸人たちに歌舞や管弦を奏させ、曲芸や芝居を演じさせた。師弟と玉華王父子は、一日じゅう存分に楽しんだ。"
  "translation_status": "reviewed"
- "id": "xy-ch88-025"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不覺天晚，散了酒席。又叫即於暴紗亭鋪設床幃，請師安宿。待明早竭誠焚香，再拜求傳武藝。眾皆聽從，即備香湯，請師沐浴，眾卻歸寢。此時那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 163
    "line_end": 163
    "source_sequence": 25
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "いつしか日が暮れ、酒宴が終わった。王はさらに暴紗亭に寝台と帳を整え、師たちを休ませるよう命じた。翌朝は心を尽くして香をたき、改めて拝礼し、武芸の伝授を願うつもりである。皆は言いつけどおり、香りのよい湯を用意し、師たちに沐浴を勧め、それぞれ床に就いた。この時、"
  "translation_status": "reviewed"
- "id": "xy-ch88-026"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    眾鳥高棲萬簌沉，詩人下榻罷哦吟。
    銀河光顯天彌亮，野徑荒涼草更深。
    砧杵叮咚敲別院，關山杳窵動鄉心。
    寒蛩聲朗知人意，嚦嚦床頭破夢魂。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 165
    "line_end": 168
    "source_sequence": 26
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    鳥たちはみな高い枝に宿り、あらゆる物音は静まり、
    詩人も床に入り、詩を吟じるのをやめる。
    天の川は光を現し、空はいよいよ明るく、
    野の小道は寂しく荒れて、草はさらに深い。
    別の庭では、砧（きぬた）を打つ杵がとんとんと響き、
    遠く隔たる関や山が、故郷を思う心を誘う。
    寒い夜のこおろぎは、人の心を知るように高らかに鳴き、
    枕元にりんりんと響いて、夢見る魂を呼び覚ます。
  "translation_status": "reviewed"
- "id": "xy-ch88-027"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一宵晚景題過。明早，那老王父子又來相見。這長老昨日相見還是王禮，今日就行師禮。那三個小王子對行者、八戒、沙僧當面叩頭，拜問道：「尊師之兵器，還借出來與弟子們看看。」八戒聞言，欣然取出釘鈀，拋在地下。沙僧將寶杖拋出，倚在牆邊。二王子與三王子跳起去便拿，就如蜻蜓撼石柱，一個個掙得紅頭赤臉，莫想拿動半分毫。大王子見了，叫道：「兄弟，莫費力了。師父的兵器，俱是神兵，不知有多少重哩。」八戒笑道：「我的鈀也沒多重，只有一藏之數，連柄五千零四十八斤。」三王子問沙僧道：「師父寶杖多重？」沙僧笑道：「也是五千零四十八斤。」大王子求行者的金箍棒看。行者去耳朵裡取出一個針兒來，迎風幌一幌，就有碗來粗細，直直的豎立面前。那王父子都皆悚懼，眾官員個個心驚。三個小王子禮拜道：「豬師、沙師之兵，俱隨身帶在衣下，即可取之。孫師為何自耳中取出，見風即長，何也？」行者笑道：「你不知我這棒不是凡間等閑可有者。這棒是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 169
    "line_end": 169
    "source_sequence": 27
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    一夜の景色は、ここまでとしよう。翌朝、玉華王父子がまた会いに来た。昨日の対面では王としての礼だったが、今日は三蔵たちを師と仰ぐ礼へと変わっていた。三人の王子は悟空、八戒、沙悟浄の前で頭を地につけ、拝んで頼んだ。
    三人の王子「お師匠さま方の武器を、もう一度お借りして、弟子どもに見せてください。」
    八戒は聞くと喜んで釘鈀（ていは）を取り出し、地面へ放った。沙悟浄も宝杖（ほうじょう）を放り出し、壁に立てかけた。第二王子と第三王子は跳び起きて取りにいったが、蜻蛉が石柱を揺するようなものだった。二人とも頭も顔も真っ赤にして力んだが、ほんのわずかも動かすことはできなかった。第一王子はそれを見て叫んだ。
    第一王子「弟たち、もう力を無駄にするな。お師匠さま方の武器は、みな神の武器だ。どれほど重いか分からないぞ。」
    八戒は笑った。
    八戒「俺の熊手は、たいして重くない。一蔵（いちぞう）の数だけで、柄も合わせて五千四十八斤だ。」
    第三王子が沙悟浄に尋ねた。
    第三王子「お師匠さまの宝杖は、どれほどの重さですか。」
    沙悟浄は笑った。
    沙悟浄「これも五千四十八斤です。」
    第一王子は悟空の金箍棒を見たいと頼んだ。悟空は耳から小さな針を取り出し、風に向けてひと振りすると、椀ほどの太さになり、目の前にまっすぐ立った。玉華王父子はみな恐れおののき、役人たちも一人残らず驚いた。三人の王子は拝礼して言った。
    三人の王子「猪のお師匠さま、沙のお師匠さまの武器は、衣の下に身につけておられ、そのまま取り出せます。孫のお師匠さまは、どうして耳から取り出されるのですか。風に当たると大きくなるのは、なぜですか。」
    悟空は笑った。
    悟空「お前たちは知らないだろうが、この棒は人間界でありふれている物じゃない。この棒は、こういう物なんだ。」
  "translation_status": "reviewed"
- "id": "xy-ch88-028"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": "鴻濛初判陶鎔鐵，大禹神人親所設。湖海江河淺共深，曾將此棒知之切。開山治水太平時，流落東洋鎮海闕。日久年深放彩霞，能消能長能光潔。老孫有分取將來，變化無方隨口訣。要大彌於宇宙間，要小卻似針兒節。棒名如意號金箍，天上人間稱一絕。重該一萬三千五百斤，或粗或細能生滅。也曾助我鬧天宮，也曾隨我攻地闕。伏虎降龍處處通，煉魔除怪方方徹。舉頭一指太陽昏，天地鬼神皆膽怯。混沌仙傳到至今，原來不是凡間鐵。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 170
    "line_end": 170
    "source_sequence": 28
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    悟空「混沌が初めて分かれた時に、溶かし鍛えられた鉄であり、
    神人の大禹（たいう）が、自ら用意したものなのだ。
    湖、海、江、河の浅さも深さも、
    かつてこの棒で、はっきりと測り知った。
    山を切り開き、水を治めて世が平らかになると、
    東の海へ流れ着き、海の宮殿を鎮めていた。
    長い歳月の中で、色鮮やかな霞を放ち、
    小さくも大きくもなり、輝き清らかにもなる。
    この俺には縁があって、手に入れることができたのだ。
    口訣（くけつ）に従って、変化のさまは限りない。
    大きくしたければ、宇宙の間いっぱいに広がり、
    小さくしたければ、針の一節ほどになる。
    名は如意（にょい）、号は金箍（きんこ）、
    天上でも人間界でも、天下一品と称えられる。
    重さは一万三千五百斤、
    太くも細くもなり、現れも消えもする。
    かつては俺を助けて天宮（てんきゅう）で暴れ、
    かつては俺とともに地の宮殿へ攻め込んだ。
    虎を伏せ竜を降すのは、どこでも自在、
    魔を練り伏せ怪を除くのも、どこでも徹底している。
    頭上へ持ち上げ、ひと指しすれば太陽も暗くなり、
    天地の鬼神たちは、みな肝をつぶす。
    混沌の仙人から、今に至るまで伝わった物、
    もともと人間界の鉄ではないのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch88-029"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那王子聽言，個個頂禮不盡。三個向前重重拜禮，虔心求授。行者道：「你三人不知學那般武藝？」王子道：「願使棍的就學棍，慣使鈀的就學鈀，愛用杖的就學杖。」行者笑道：「教便也容易，只是你等無力量，使不得我們的兵器，恐學之不精，如畫虎不成反類狗也。古人云：『訓教不嚴師之惰，學問無成子之罪。』汝等既有誠心，可去焚香來拜了天地，我先傳你些神力，然後可授武藝。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 172
    "line_end": 172
    "source_sequence": 29
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    王子たちはそれを聞き、そろって拝み続けた。三人の王子は進み出て重ね重ね礼をし、真心を込めて教えを請うた。
    悟空「お前たち三人は、どんな武芸を学びたいんだ。」
    王子の一人「棍を使いたい者は棍を、熊手を使い慣れた者は熊手を、杖を好む者は杖を学びたく存じます。」
    悟空は笑った。
    悟空「教えるのは簡単だが、お前たちは力がなく、俺たちの武器を使えない。うまく身につかず、虎を描いたつもりが犬に似てしまうようなことになりかねん。昔の人も、『教えが厳しくないのは師の怠慢、学んで成し遂げないのは子の罪』と言っている。お前たちに真心があるなら、香をたいて天地を拝んでこい。まず少し神の力を授け、それから武芸を教えてやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch88-030"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三個小王子聞言，滿心歡喜。即便親擡香案，沐手焚香，朝天禮拜。拜畢，請師傳法。行者轉下身來，對唐僧行禮道：「告尊師，恕弟子之罪。自當年在兩界山蒙師父大德救脫弟子，秉教沙門，一向西來，雖不曾重報師恩，卻也曾渡水登山，竭盡心力。今來佛國之鄉，幸遇賢王三子，投拜我等，欲學武藝。彼既為我等之徒弟，即為我師之徒孫也。謹稟過我師，庶好傳授。」三藏十分大喜。八戒、沙僧見行者行禮，也即轉身朝三藏磕頭道：「師父，我等愚魯，拙口鈍腮，不會說話。望師父高坐法位，也讓我兩個各招個徒弟耍耍，也是西方路上之憶念。」三藏俱欣然允之。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 173
    "line_end": 173
    "source_sequence": 30
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    三人の王子は聞いて心から喜び、自ら香卓を運び、手を清めて香をたき、天に向かって礼拝した。拝み終えて師に術の伝授を願うと、悟空は身をひるがえし、三蔵に礼をした。
    悟空「お師匠さまに申し上げます。弟子の差し出がましさをお許しください。かつて両界山（りょうかいざん）でお師匠さまの大きなご恩によって救い出され、教えを受けて仏門に入り、ひたすら西へ参りました。まだ師の恩に厚く報いることはできませんでしたが、水を渡り山に登って、心と力を尽くしてはまいりました。今、仏の国へ参り、幸いにも賢い王の三人のご子息と出会いました。私たちに弟子入りして、武芸を学びたいと願っておられます。私たちの弟子となるなら、お師匠さまにとっては孫弟子となります。まず謹んでお師匠さまに申し上げ、それからお教えしたいと存じます。」
    三蔵はたいそう喜んだ。八戒と沙悟浄も悟空が礼をするのを見ると、身を返して三蔵に頭を地につけた。
    八戒と沙悟浄「お師匠さま、私たちは愚かで、口下手で、うまくお話しできません。どうか法の座の高い所へお掛けになり、私たちにも一人ずつ弟子を取って、教える楽しみを味わわせてください。西へ向かう旅の思い出にもなりましょう。」
    三蔵は、どちらの願いも快く許した。
  "translation_status": "reviewed"
- "id": "xy-ch88-031"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者才教三個王子都在暴紗亭後，靜室之間，畫了罡斗。教三人都俯伏在內，一個個瞑目寧神。這裡卻暗暗念動真言，誦動咒語，將仙氣吹入他三人心腹之中，把元神收歸本舍。傳與口訣，各授得萬千之膂力，運添了火候，卻像個脫胎換骨之法。運遍了子午周天，那三個小王子方才甦醒，一齊爬將起來，抹抹臉，精神抖擻，一個個骨壯筋強：大王子就拿得金箍棒，二王子就掄得九齒鈀，三王子就舉得降妖杖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 175
    "line_end": 175
    "source_sequence": 31
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "それから悟空は、三人の王子を暴紗亭の後ろの静かな部屋へ集め、罡斗（こうと）の図を描いた。三人をその中にうつ伏せにさせ、一人ずつ目を閉じ、心を静めさせた。そしてひそかに真言（しんごん）と呪文を唱え、三人の胸と腹の中へ仙気を吹き込み、元神（げんしん）を本来の住まいへ収め戻した。口訣を伝え、一人ひとりに万千の腕力を授け、火候（かこう）の働きを増し加えた。まさしく胎を脱ぎ骨を換える術のようであった。子午周天（しごしゅうてん）をすっかり巡らせると、三人の王子はようやく目を覚まし、一斉に起き上がって顔をぬぐった。気力は盛んになり、一人残らず骨は頑丈、筋は強くなった。第一王子は金箍棒を取り上げられ、第二王子は九歯の熊手を振り回せ、第三王子は降妖杖を持ち上げられるようになった。"
  "translation_status": "reviewed"
- "id": "xy-ch88-032"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老王見了，歡喜不勝。又排素宴，啟謝他師徒四眾。就在筵前各傳各授：學棍的演棍，學鈀的演鈀，學杖的演杖。雖然打幾個轉身，丟幾般解數，此等終是凡夫，有些著力：走一路，便喘氣噓噓，不能耐久。蓋他那兵器都有變化，其進退攻揚，隨消隨長，皆有自然之妙，此等終是凡夫，豈能以遽及也？當日收了筵宴。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 176
    "line_end": 176
    "source_sequence": 32
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "玉華王はそれを見て喜びに堪えず、また精進の宴を設け、師弟四人に礼を述べた。宴席の前でそれぞれが教え、授けた。棍を学ぶ者は棍を演じ、熊手を学ぶ者は熊手を演じ、杖を学ぶ者は杖を演じた。何度か身を返し、いくつかの技を繰り出すことはできても、彼らはしょせん凡人であり、かなり力が要った。一連の技を通すと、はあはあと息が上がり、長くは続かなかった。なぜなら、その武器はどれも自在に変化し、進み、退き、攻め、振り上げるのに応じて、小さくなり、大きくなり、自然の妙を備えていたからである。彼らはしょせん凡人で、どうしてたちまちその域へ達せよう。その日はそこで宴を終えた。"
  "translation_status": "reviewed"
- "id": "xy-ch88-033"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日，三個王子又來稱謝道：「感蒙神師授賜了膂力，縱然掄得師的兵器，只是轉換艱難。意欲命匠依神師兵器式樣，減削斤兩，打造一般，未知師父肯容否？」八戒道：「好好好，說得有理。我們的器械，一則你們使不得，二則我們要護法降魔，正該另造另造。」王子隨即宣召鐵匠，買辦鋼鐵萬斤，就在王府內前院搭廠，支爐鑄造。先一日將鋼鐵煉熟。次日請行者三人將金箍棒、九齒鈀、降妖杖，都取出放在篷廠之間，看樣造作。遂此晝夜不收。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 178
    "line_end": 178
    "source_sequence": 33
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    翌日、三人の王子はまた礼を述べに来た。
    三人の王子「神のお師匠さま方に腕力をお授けいただき、感謝しております。お師匠さま方の武器を振るえるようにはなりましたが、持ち替えたり向きを変えたりするのは、やはり困難です。職人に命じ、神のお師匠さま方の武器を手本に、重さを減らした同じ形の物を作らせたいと思いますが、お許しいただけるでしょうか。」
    八戒「いい、いい、いいとも。道理にかなった話だ。第一、お前たちには俺たちの武器は使いこなせないし、第二、俺たちはこれで仏法を守り、魔を降さなきゃならない。ぜひとも別に作るがいい。」
    王子たちはすぐに鍛冶屋を呼び、鋼と鉄を一万斤買いそろえ、王府の前庭に小屋を建て、炉を据えて鋳造に取りかかった。まず一日かけて鋼鉄を十分に精錬した。翌日、悟空たち三人に頼み、金箍棒、九歯の熊手、降妖杖を取り出して小屋の中へ置いてもらい、それを手本に作った。それからは昼も夜も武器をしまわなくなった。
  "translation_status": "reviewed"
- "id": "xy-ch88-034"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "噫！這兵器原是他們隨身之寶，一刻不可離者，各藏在身，自有許多光彩護體。今放在廠院中幾日，那霞光有萬道沖天，瑞氣有千般罩地。其夜有一妖精，離城只有七十里遠近，山喚豹頭山，洞喚虎口洞，夜坐之間，忽見霞光瑞氣，即駕雲而看，見光彩起處是王府之內。他按下雲頭，近前觀看，乃是這三般兵器放光。妖精又喜又愛道：「好寶貝，好寶貝。這是甚人用的，今放在此？也是我的緣法，拿了去呀，拿了去呀。」他愛心一動，弄起威風，將三般兵器一股收之，徑轉本洞。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 179
    "line_end": 179
    "source_sequence": 34
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    ああ、この武器は本来、彼らが肌身離さず持つ宝であり、一刻たりとも離せぬ物だった。それぞれが身に収めていれば、多くの光が自然に体を守っていたのである。今、作業小屋の庭へ数日置いたため、万筋の霞の光が天を突き、千様のめでたい気が地を覆った。その夜、城からわずか七十里ほど離れた所に住む妖怪がいた。山は豹頭山（ひょうとうざん）、洞窟は虎口洞（ここうどう）といった。夜に座っていると、突然、霞の光とめでたい気が見えた。そこで雲に乗って見にいくと、光は王府の中から立ちのぼっていた。雲を下ろし、近づいて眺めると、この三つの武器が光を放っているのだった。妖怪は喜び、欲しくなって言った。
    妖怪「よい宝だ、よい宝だ。誰が使う物だろう。どうしてここへ置いてあるのだ。これも私との巡り合わせだ。持っていこう、持っていこう。」
    欲心が動くや、すさまじい風を起こして三つの武器をひとまとめに取り込み、まっすぐ自分の洞窟へ戻った。まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch88-035"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    道不須臾離，可離非道也。
    神兵盡落空，枉費參修者。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 181
    "line_end": 182
    "source_sequence": 35
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    道からは、ほんのひとときも離れてはならぬ。
    離れてもよいのなら、それは道ではない。
    神の武器がことごとく失われて、
    修行を積んだ者も、その苦労が無駄になる。
  "translation_status": "reviewed"
- "id": "xy-ch88-036"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎生尋得這兵器，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 184
    "line_end": 184
    "source_sequence": 36
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": "さて、この武器をどうやって探し出すのか。それは次回をお聞きあれ。"
  "translation_status": "reviewed"

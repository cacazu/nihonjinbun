    "description_ja": "底本の打著哈哈は、ここではあくびをしていると解した。笑うという一般的な語義もある一方、古い口語資料や方言にはあくびを指す用例がある。意味の取り方に余地を残し、原文の哈哈は変更しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-003"
    "description_ja": "柳衰穀秀は柳の衰えと穀物の出穂を並べる。晩秋という語りとの季節上のずれを、稔りや刈取りへ改めて整合させない。白蘋は古典詩文の水草名で、特定の現代植物種や花の色を確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-005"
    "description_ja": "底本は跌跌\U00027FFC\U00027FFC。足がもつれてよろめく様子と文脈から解した。珍字\U00027FFCを別字に無断で置き換えず、原文欄に保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-009"
    "description_ja": "底本は萬蟄千魔。蟄の字を劫などへ改めず、潜む虫獣と魔物の多数を挙げる表現と解した。教育部の教育百科の検索表示にも、蟄の項でこの用例を確認したが、熟語全体の細かな意味は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-010"
    "description_ja": "冒頭の「見ていない」という発言は主語が省略されている。招きに出た役人たちか、尋ねられた人々かを本文だけで確定せず、話者不明とした。直前の省略された主語の解釈に関する留保である。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-013"
    "description_ja": "原文は三人の行動の後、単数の小王子の発話になるが、どの兄弟かは明示しない。集団の行動を理由に発言者を長男などへ固定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-015"
    "description_ja": "上三下四、左五右六、前七後八は、四方八方に技を繰り出す勢いと数の並びを示す。具体的な打撃回数や現代の流派の技法へ限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-016"
    "description_ja": "金・木・刀圭には、三人の弟子と内丹修行の働きを重ねる寓意がある。刀圭は土やその調和作用に結び付けられる。丹器・戒性・帰中の細部は多義的で、武器の輝きと心の修行を重ねる詩として訳した。特定の実践法を説明するものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-023"
    "description_ja": "素酒は精進に差し支えないと扱われる酒で、必ずしもアルコールがないことを意味しない。蒸酥は菓子名として保ち、乳製品を用いる特定の製法を原文から断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-024"
    "description_ja": "撮弄はこの宴の芸能の並びでは、手技や見世物の類と解した。具体的な演目や演者の人数は原文から確定できない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-026"
    "description_ja": "底本は萬簌沉。万物の音が静まるという詩意で訳したが、簌を籟などへ原文校訂しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-027"
    "description_ja": "王礼から師礼へ変わる句は、同じ一行への接遇が君主としての儀礼から弟子として師を敬う礼に変わる意味と解した。授業の開始に伴う立場の変化であり、新たな官職への任命を表すものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-028"
    "description_ja": "底本の混沌仙傳は、混沌の仙人から伝わるという意味に取った。混沌仙を別の既知の仙人名へ同定せず、天地が分かれた時からの伝来と取る余地も残す。ここで語られる棒の来歴と能力は悟空自身の説明である。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "segment_ids":
    - "xy-ch88-031"
    "description_ja": "罡斗、元神、火候、子午周天は道教の修行論に関わる語。星の配置を描くこと、精神を本来の場所へ収めること、気の働きを強め巡らせることを、物語上の術として語る。肉体の変化を現代的な生理学の事実や実践上の助言として保証しない。 原文の欠落ではなく、解釈・校訂上の留保。"

  "source_text": "話說唐僧喜喜歡歡別了郡侯，在馬上向行者道：「賢徒，這一場善果，真勝似比丘國搭救兒童，皆爾之功也。」沙僧道：「比丘國只救得一千一百一十一個小兒，怎似這場大雨，滂沱浸潤，活夠者萬萬千千性命？弟子也暗自稱讚大師兄的法力通天，慈恩蓋地也。」八戒笑道：「哥的恩也有，善也有，卻只是外施仁義，內包禍心。但與老豬走，就要作踐人。」行者道：「我在那裡作踐你？」八戒道：「也夠了，也夠了。常照顧我綑，照顧我吊，照顧我煮，照顧我蒸。今在鳳仙郡施了恩惠與萬萬之人，就該住上半年，帶挈我吃幾頓自在飽飯，卻只管催促行路。」長老聞言，喝道：「這個獃子，怎麼只思量擄嘴？快走路，再莫鬥口。」八戒不敢言，掬掬嘴，挑著行囊，打著哈哈，師徒們奔上大路。此時光景如梭，又值深秋之候，但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":

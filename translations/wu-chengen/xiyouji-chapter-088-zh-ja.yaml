  "source_locations": []
  "translation_ja": "上三下四、左五右六、前七後八は、四方八方に技を繰り出す勢いと数の並びを示す。具体的な打撃回数や現代の流派の技法へ限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-009-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "金・木・刀圭には、三人の弟子と内丹修行の働きを重ねる寓意がある。刀圭は土やその調和作用に結び付けられる。丹器・戒性・帰中の細部は多義的で、武器の輝きと心の修行を重ねる詩として訳した。特定の実践法を説明するものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-010-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "素酒は精進に差し支えないと扱われる酒で、必ずしもアルコールがないことを意味しない。蒸酥は菓子名として保ち、乳製品を用いる特定の製法を原文から断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-011-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "撮弄はこの宴の芸能の並びでは、手技や見世物の類と解した。具体的な演目や演者の人数は原文から確定できない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-012-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は萬簌沉。万物の音が静まるという詩意で訳したが、簌を籟などへ原文校訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-013-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "王礼から師礼へ変わる句は、同じ一行への接遇が君主としての儀礼から弟子として師を敬う礼に変わる意味と解した。授業の開始に伴う立場の変化であり、新たな官職への任命を表すものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-014-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の混沌仙傳は、混沌の仙人から伝わるという意味に取った。混沌仙を別の既知の仙人名へ同定せず、天地が分かれた時からの伝来と取る余地も残す。ここで語られる棒の来歴と能力は悟空自身の説明である。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-015-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "罡斗、元神、火候、子午周天は道教の修行論に関わる語。星の配置を描くこと、精神を本来の場所へ収めること、気の働きを強め巡らせることを、物語上の術として語る。肉体の変化を現代的な生理学の事実や実践上の助言として保証しない。"
  "translation_status": "reviewed"
- "id": "xy-ch88-note-016-body"
  "section_id": "chapter-88"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「道はひとときも離れられない。離れられるのなら道ではない」は『中庸』冒頭に通じる句。武器と修行を離さないという物語の戒めにも重ねられている。"
  "translation_status": "reviewed"

  "source_text": "好大聖，唿哨一聲，將觔斗一抖，兩隻腳踏著五色祥雲，起在半空，離地約有三百步高下。把金箍棒丟開個「撒花蓋頂」，「黃龍轉身」，一上一下，左旋右轉，起初時人與棒似錦上添花；次後來不見人，只見一天棒滾。八戒在底下喝聲采，也忍不住手腳，厲聲喊道：「等老豬也去耍耍來。」好獃子，駕起風頭，也到半空，丟開鈀，上三下四，左五右六，前七後八，滿身解數，只聽得呼呼風響。正使到熱鬧處，沙僧對長老道：「師父，也等老沙去操演操演。」好和尚，雙著腳一跳，掄著杖，也起在空中，只見那銳氣氤氳，金光縹緲。雙手使降妖杖丟一個「丹鳳朝陽」，「餓虎撲食」，緊迎慢擋，急轉忙攛。弟兄三個大展神通，都在那半空中，一齊揚威耀武。這才是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"

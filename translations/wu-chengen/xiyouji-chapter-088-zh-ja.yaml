  "source_text": "好王子，大的個拿一條齊眉棍，第二個掄一把九齒鈀，第三個使一根烏油黑棒子，雄糾糾、氣昂昂的走出王府，吆喝道：「甚麼取經的和尚，在那裡？」時有典膳官員人等跪下道：「小王，他們在這暴紗亭吃齋哩。」小王子不分好歹，闖將進去，喝道：「汝等是人是怪？快早說來，饒你性命。」諕得三藏面容失色，丟下飯碗，躬著身道：「貧僧乃唐朝來取經者，人也，非怪也。」小王子道：「你便還像個人，那三個醜的斷然是怪。」八戒只管吃飯不睬。沙僧與行者欠身道：「我等俱是人，面雖醜而心良，身雖夯而性善。汝三個卻是何來，卻恁樣海口輕狂？」傍有典膳等官道：「三位是我王之子小殿下。」八戒丟了碗道：「小殿下，各拿兵器怎麼？莫是要與我們打哩？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"

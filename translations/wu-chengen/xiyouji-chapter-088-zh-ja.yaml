  "translation_ja": "回題は木土とし、その直後に「母とも作る」という異文表示を持つ。本文では悟空・八戒・沙悟浄の三人が教えるため、訳題は木と土を分けて示した。心猿・金・木・土は修行論の寓意とも重なるが、異文を一つへ統一して原文を変更しない。"

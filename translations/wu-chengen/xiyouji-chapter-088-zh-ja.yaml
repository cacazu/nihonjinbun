  "translation_ja": |-
    さて、三蔵（さんぞう）は喜びいっぱいに郡侯（ぐんこう）と別れ、馬上から悟空（ごくう）に言った。
    三蔵「よい弟子よ、今回の善行の実りは、比丘国（びくこく）で子供たちを救った時にもまさる。すべてお前の功績だ。」
    沙悟浄（さごじょう）「比丘国では千百十一人の子供を救っただけでした。今回の大雨は、降り注いで隅々まで潤し、何千万もの命を救ったのですから、比べようもありません。私もひそかに、兄さんの法力は天に通じ、慈悲の恵みは大地を覆うと、感心していたところです。」
    八戒（はっかい）は笑った。
    八戒「兄貴に恩情があるのも、善いところがあるのも確かさ。ただ、表向きは仁義を施していても、腹の中には悪だくみを包んでいる。俺と一緒に歩けば、必ず俺をひどい目に遭わせるんだ。」
    悟空「俺が、どこでお前をひどい目に遭わせたっていうんだ。」
    八戒「もう十分だ、十分だよ。いつも親切に、俺を縛らせてくれる、吊るさせてくれる、煮させてくれる、蒸させてくれる。今度は鳳仙郡（ほうせんぐん）で何万もの人に恩を施したんだから、半年ほど泊まって、俺にも何度か気楽に腹いっぱい食わせてくれりゃいいのに、道を急がせるばかりだ。」
    それを聞いた三蔵が叱った。
    三蔵「この間抜けめ、どうして食べることばかり考える。さっさと歩きなさい。もう口げんかはやめるのだ。」
    八戒は口答えできず、口を突き出して、荷物を担ぎ、あくびをしながら歩いた。師弟は大路を進んでいった。時は機の杼のように過ぎ、また晩秋になっていた。その景色はというと、

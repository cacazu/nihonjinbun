  "translation_ja": |-
    玉華王は顔を上げて三人の醜さを見ると、やはり内心恐ろしくなった。三蔵は合掌した。
    三蔵「殿下、ご安心ください。愚かな弟子どもは顔こそ醜くても、心はみな善良でございます。」
    八戒は王に向かって、声を張り上げて礼をした。
    八戒「僧の私が、ご挨拶申し上げます！」
    王はますますぎょっとした。
    三蔵「弟子たちはみな山野で拾い上げた者で、礼儀を存じません。どうかお許しください。」
    王は恐怖をこらえ、典膳官に、僧たちを暴紗亭（ぼうさてい）へ案内して食事をさせるよう命じた。三蔵は恩に感謝して王の前を辞し、殿を下りて一同と亭へ行くと、八戒を責めた。
    三蔵「この無骨者め、礼儀というものを少しも知らないのか。いっそ黙っていればよかったものを、どうしてあんなに乱暴なのだ。あのひと言では、泰山（たいざん）さえ倒れてしまう。」
    悟空は笑った。
    悟空「やっぱり、声を上げて挨拶しなかった私がよかった。力も使わずに済みましたしね。」
    沙悟浄「挨拶するにも、皆がそろうのを待たず、一人で先に口を突き出して叫ぶのですから。」
    八戒「まったく面倒だ、面倒だよ。お師匠さまは前に、人に会ったら挨拶するのが礼儀だと教えたじゃありませんか。今日は挨拶したら、それも悪いとおっしゃる。一体どうしろっていうんです。」
    三蔵「人に会ったら挨拶せよとは教えたが、王にお目にかかって、あんなでたらめをせよとは言わなかった。よく言うではないか、『物にもいろいろな等級があり、人にもいろいろな等級がある』と。なぜ身分の上下をわきまえないのだ。」
    こう話していると、典膳官が従者を連れ、机や椅子を整えて、食事を並べた。師弟はそこで口を閉じ、それぞれ食事をした。

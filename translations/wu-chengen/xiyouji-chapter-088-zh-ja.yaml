  "source_text": "水痕收，山骨瘦。紅葉紛飛，黃花時候。霜晴覺夜長，月白穿窗透。家家煙火夕陽多，處處湖光寒水溜。白蘋香，紅蓼茂。橘綠橙黃，柳衰穀秀。荒村雁落碎蘆花，野店雞聲收菽豆。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 124
    "line_end": 124
    "source_sequence": 3
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    水は引き、山は骨ばって痩せて見える。
    紅葉が舞い散り、黄菊の咲く頃となる。
    霜の降りた晴天には夜の長さを感じ、白い月の光が窓を通して差し込む。
    家々の炊煙は夕日に立ちのぼり、あちこちの湖面が光って冷たい水が流れる。
    白蘋（はくひん）は香り、赤い蓼（たで）は茂る。
    蜜柑は緑、橙は黄、柳は衰え、穀物は穂を出す。
    寂れた村では雁が降りて葦の花を散らし、野の宿屋では鶏の声の中で豆を取り入れる。
  "translation_status": "reviewed"
- "id": "xy-ch88-004"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四眾行夠多時，又見城垣影影。長老舉鞭遙指叫：「悟空，你看那裡又有一座城池，卻不知是甚去處？」行者道：「你我俱未曾到，何以知之？且行至邊前問人。」說不了，忽見樹叢裡走出一個老者，手持竹杖，身著輕衣，足踏一對棕鞋，腰束一條扁帶。慌得唐僧滾鞍下馬，上前道個問訊。那老者扶杖還禮道：「長老那方來的？」唐僧合掌道：「貧僧東土唐朝差往雷音拜佛求經者。今至寶方，遙望城垣，不知是甚去處，特問老施主指教。」那老者聞言，口稱：「有道禪師，我這敝處乃天竺國下郡，地名玉華縣。縣中城主，就是天竺皇帝之宗室，封為玉華王。此王甚賢，專敬僧道，重愛黎民。老禪師若去相見，必有重敬。」三藏謝了，那老者徑穿樹林而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 125
    "line_end": 125
    "source_sequence": 4
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    四人は長いこと歩き、また遠くに城壁がかすんで見えてきた。三蔵は鞭を上げ、はるか前方を指して呼びかけた。
    三蔵「悟空、見なさい。またあそこに城がある。何という所だろう。」
    悟空「私もお師匠さまも、まだ来たことがないのですから、分かるはずがありません。近くまで行って、人に聞いてみましょう。」
    話し終わらないうちに、木立から老人が一人出てきた。手には竹の杖を持ち、薄手の衣を着て、足には棕櫚の靴を一足履き、腰には平たい帯を締めている。三蔵は急いで鞍から滑り降り、進み出て挨拶した。老人は杖をつきながら礼を返した。
    老人「長老さまは、どちらからおいでですか。」
    三蔵は合掌した。
    三蔵「私は東土（とうど）の唐朝（とうちょう）から遣わされ、雷音（らいおん）へ仏を礼拝し、経を求めに参る僧です。こちらへ参って、遠くに城壁が見えましたが、何という所か分かりません。お年寄りのご施主に、教えていただきたいのです。」
    老人はそれを聞き、こう答えた。
    老人「徳の高い禅師さま、私どものこの土地は天竺国（てんじくこく）に属する郡で、地名を玉華県（ぎょくかけん）と申します。県内の城主は天竺（てんじく）皇帝の一族で、玉華王（ぎょくかおう）に封じられたお方です。この王はたいそう賢明で、とりわけ僧や道士を敬い、民を大切になさいます。お会いになれば、きっと厚くおもてなしくださるでしょう。」
    三蔵が礼を言うと、老人はそのまま林を抜けて去っていった。
  "translation_status": "reviewed"
- "id": "xy-ch88-005"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏才轉身對徒弟備言前事。他三人欣喜，扶師父上馬。三藏道：「沒多路，不須乘馬。」四眾遂步至城邊街道觀看。原來那關廂人家，做買做賣的，人煙湊集，生意亦甚茂盛。觀其聲音相貌，與中華無異。三藏吩咐：「徒弟們謹慎，切不可放肆。」那八戒低了頭，沙僧掩著臉，惟孫行者攙著師父。兩邊人都來爭看，齊聲叫道：「我這裡只有降龍伏虎的高僧，不曾見降豬伏猴的和尚。」八戒忍不住，把嘴一掬道：「你們可曾看見降豬王的和尚？」諕得滿街上人跌跌\U00027FFC\U00027FFC，都往兩邊閃過。行者笑道：「獃子，快藏了嘴，莫裝扮，仔細腳下過橋。」那獃子低著頭，只是笑。過了吊橋，入城門內，又見那大街上酒樓歌館，熱鬧繁華，果然是神州都邑。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 126
    "line_end": 126
    "source_sequence": 5
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    三蔵はそこで振り返り、弟子たちに今の話を詳しく伝えた。三人は喜んで、師を馬に乗せようとした。
    三蔵「そう遠くはない。馬には乗らなくてよい。」
    そこで四人は城のそばの通りまで歩き、あたりを眺めた。城外の町では、家々が商売をしていて、人が寄り集まり、たいそう繁盛していた。声や顔つきを見ると、中華（ちゅうか）の人々と変わりがない。三蔵は言い聞かせた。
    三蔵「お前たち、慎み深くするのだ。決して勝手に振る舞ってはいけない。」
    八戒は頭を下げ、沙悟浄は顔を隠し、悟空だけが師の手を支えていた。両側の人々は争って見物に来て、声をそろえて叫んだ。
    人々「ここには竜を降し虎を伏せる高僧はいるが、猪を降し猿を伏せる和尚なんて、見たことがないぞ。」
    八戒は我慢できず、口を突き出して言った。
    八戒「お前たち、猪の王を降す和尚を見たことがあるか。」
    通りの人々は驚いてつまずきよろめき、みな両側へ逃げのいた。悟空は笑った。
    悟空「間抜け、さっさと口を引っ込めろ。おかしな顔をするな。足元に気をつけて橋を渡れよ。」
    八戒は頭を下げ、ただ笑っていた。吊り橋を渡って城門の中へ入ると、大通りには酒楼や歌を聞かせる店が並び、にぎやかで繁華だった。まさに神州（しんしゅう）の都そのものである。これを示す詩がある。
  "translation_status": "reviewed"
- "id": "xy-ch88-006"
  "section_id": "chapter-88"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    錦城鐵瓮萬年堅，臨水依山色色鮮。
    百貨通湖船入市，千家沽酒店垂帘。
    樓臺處處人煙廣，巷陌朝朝客賈喧。
    不亞長安風景好，雞鳴犬吠亦般般。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 128
    "line_end": 131
    "source_sequence": 6
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    錦のような城は鉄の甕さながら、万年揺るがず堅固にそびえ、
    水に臨み、山に寄り添い、何もかもが鮮やかだ。
    湖を通じて百貨が届き、船が市場へ入ってくる。
    千軒の酒屋が酒を売り、店先にはすだれが下がる。
    楼台があちこちに立ち、人の暮らしは広く満ち、
    路地や通りでは朝ごとに、旅の商人たちがにぎわう。
    長安（ちょうあん）にも劣らぬ、すばらしい眺め、
    鶏の鳴き声も犬の吠え声も、まったく同じだ。
  "translation_status": "reviewed"
- "id": "xy-ch88-007"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏心中暗喜道：「人言西域諸番，更不曾到此。細觀此景，與我大唐何異？所謂極樂世界，誠此之謂也。」又聽得人說白米四錢一石，麻油八釐一斤，真是五穀豐登之處。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 133
    "line_end": 133
    "source_sequence": 7
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    三蔵は心ひそかに喜び、こう思った。
    三蔵「人は西域（さいいき）を異国の国々と言うが、ここへ来たことがないのだ。この景色をよく見れば、わが大唐（だいとう）と何の違いがあろう。極楽世界（ごくらくせかい）とは、まさにこのような所をいうのだ。」
    さらに人の話では、白米は一石（こく）につき四銭（せん）、胡麻油は一斤（きん）につき八釐（り）だという。まことに五穀の豊かな土地であった。
  "translation_status": "reviewed"
- "id": "xy-ch88-008"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行夠多時，方到玉華王府。府門左右有長史府、審理廳、典膳所、待客館。三藏道：「徒弟，此間是府，等我進去朝王，驗牒而行。」八戒道：「師父進去，我們可好在衙門前站立？」三藏道：「你不看這門上是『待客館』三字？！你們都去那裡坐下，看有草料，買些喂馬。我見了王，倘或賜齋，便來喚你等同享。」行者道：「師父放心前去，老孫自當理會。」那沙僧把行李挑至館中。館中有看館的人役，見他們面貌醜陋，也不敢問他，也不敢教他出去，只得讓他坐下不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 134
    "line_end": 134
    "source_sequence": 8
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    長いこと歩いて、ようやく玉華王の屋敷に着いた。門の左右には長史府（ちょうしふ）、審理庁（しんりちょう）、典膳所（てんぜんしょ）、待客館（たいきゃくかん）があった。
    三蔵「お前たち、ここが王府だ。私が中へ入って王にお目にかかり、通行文書を調べていただいてから出立しよう。」
    八戒「お師匠さまが中へお入りになる間、俺たちは役所の前に立っていればいいんですか。」
    三蔵「この門の上に『待客館』の三文字が見えないのか。お前たちはみな、あそこで座っていなさい。飼葉があったら、少し買って馬に食べさせるのだ。王にお目にかかって、もし食事を賜ったら、呼びに来て一緒にいただこう。」
    悟空「安心しておいでください。私がきちんと取り計らいます。」
    沙悟浄が荷物を担いで館に入った。館番の役人は三人の醜い顔を見ると、何か尋ねる勇気も、出ていってくれと言う勇気もなく、ただ座らせておいた。こちらはひとまずおく。
  "translation_status": "reviewed"
- "id": "xy-ch88-009"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說老師父換了衣帽，拿了關文，徑至王府前。早見引禮官迎著問道：「長老何來？」三藏道：「東土大唐差來大雷音拜佛祖求經之僧，今到貴地，欲倒換關文，特來朝參千歲。」引禮官即為傳奏。那王子果然賢達，即傳旨召進。三藏至殿下施禮，王子即請上殿賜坐。三藏將關文獻上，王子看了，見有各國印信手押，也就欣然將寶印了，押了花字，收摺在案。問道：「國師長老，自你那大唐至此，歷遍諸邦，共有幾多路程？」三藏道：「貧僧也未記程途，但先年蒙觀音菩薩在我王御前顯身，曾留了頌子，言西方十萬八千里。貧僧在路，已經過一十四遍寒暑矣。」王子笑道：「十四遍寒暑，即十四年了。想是途中有甚耽擱？」三藏道：「一言難盡。萬蟄千魔，也不知受了多少苦楚，才到得寶方。」那王子十分歡喜，即著典膳官備素齋管待。三藏：「啟上殿下：貧僧有三個小徒在外等候，不敢領齋，但恐遲誤行程。」王子教：「當殿官，快去請長老三位徒弟，進府同齋。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 135
    "line_end": 135
    "source_sequence": 9
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    さて三蔵は衣と帽子を替え、通行文書を持って、まっすぐ王府の前へ行った。すぐに引礼官（いんれいかん）が迎え、尋ねた。
    引礼官「長老さまは、どちらからおいでですか。」
    三蔵「東土の大唐から遣わされ、大雷音（だいらいおん）へ仏祖（ぶっそ）を礼拝し、経を求めに参る僧です。当地で通行文書の証印を頂きたく、殿下にお目にかかりに参りました。」
    引礼官はすぐに取り次いだ。玉華王は評判どおり賢明で、ただちに中へ通すよう命じた。三蔵が御殿の下で礼をすると、王は殿上へ招き、席を与えた。三蔵が通行文書を差し出すと、王は各国の印と署名があるのを見て、快く自分の印を押し、花押を書き添え、折り畳んで机に置いた。そして尋ねた。
    玉華王「国師長老、大唐からここまで、さまざまな国を通ってこられたが、合わせてどれほどの道のりでしたか。」
    三蔵「私は道のりを記しておりません。ただ、以前、観音菩薩（かんのんぼさつ）がわが国の王の御前にお姿を現された折、頌（じゅ）を残され、西方までは十万八千里（り）とおっしゃいました。旅に出てから、もう十四たび暑さ寒さを繰り返しました。」
    玉華王は笑った。
    玉華王「十四たびの暑さ寒さなら、十四年ですね。途中で、何か足止めがおありでしたか。」
    三蔵「ひと言では言い尽くせません。幾万の潜む虫や獣、幾千の魔物に遭い、どれほど苦しみを受けたか分からぬほどで、ようやくこちらまで参りました。」
    王はたいそう喜び、典膳官（てんぜんかん）に精進料理を用意してもてなすよう命じた。
    三蔵「殿下に申し上げます。外で三人の弟子が待っております。旅程を遅らせるのも心配ですので、私だけ食事を頂くわけには参りません。」
    玉華王「殿前の役人、急いで長老の三人の弟子をお招きし、府内で一緒に食事をしていただけ。」
  "translation_status": "reviewed"
- "id": "xy-ch88-010"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當殿官隨出外相請，都道：「未曾見，未曾見。」有跟隨的人道：「待客館中坐著三個醜貌和尚，想必是也。」當殿官同眾至館中，即問看館的道：「那個是大唐取經僧的高徒？我主有旨，請吃齋也。」八戒正坐打盹，聽見一個「齋」字，忍不住跳起身來答道：「我們是，我們是。」當殿官一見了，魂飛魄喪，都戰戰的道：「是個豬魈，豬魈。」行者聽見，一把扯住八戒道：「兄弟，放斯文些，莫撒村野。」那眾官見了行者，又道：「是個猴精，猴精。」沙僧拱手道：「列位休得驚恐。我三人都是唐僧的徒弟。」眾官見了，又道：「灶君，灶君。」孫行者即教八戒牽馬，沙僧挑擔，同眾入玉華王府。當殿官先入啟知。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 136
    "line_end": 136
    "source_sequence": 10
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    殿前の役人は外へ招きに出たが、皆が口々に言った。
    話者不明「見ておりません、見ておりません。」
    随行の者が言った。
    随行の者「待客館に醜い顔の僧が三人座っております。きっと、その者たちでしょう。」
    殿前の役人は一同と館へ行き、館番に尋ねた。
    殿前の役人「どなたが、大唐から経を取りに来た僧の高弟なのだ。わが王のお言いつけで、食事にお招きするのだが。」
    八戒は座って居眠りをしていたが、「食事」のひと言を聞くと、我慢できず飛び起きて答えた。
    八戒「俺たちだ、俺たちだ。」
    役人たちはその姿を見るなり魂も消えるほど驚き、皆が震えながら言った。
    役人たち「猪の化け物だ、猪の化け物だ。」
    悟空はそれを聞き、八戒をぐっと引き止めた。
    悟空「兄弟、少し上品にしろ。田舎者丸出しにするな。」
    役人たちは悟空を見ると、また言った。
    役人たち「猿の化け物だ、猿の化け物だ。」
    沙悟浄は胸の前で手を組み、一礼した。
    沙悟浄「皆さま、どうか恐れないでください。私たちは三人とも、唐僧（とうそう）の弟子です。」
    役人たちは沙悟浄を見ると、また叫んだ。
    役人たち「竈君（そうくん）だ、竈君だ。」
    悟空は八戒に馬を引かせ、沙悟浄に荷を担がせて、皆と一緒に玉華王府へ入った。殿前の役人は先に入って取り次いだ。
  "translation_status": "reviewed"
- "id": "xy-ch88-011"
  "section_id": "chapter-88"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那王子舉目見那等醜惡，卻也心中害怕。三藏合掌道：「千歲放心。頑徒雖是貌醜，卻都心良。」八戒朝上唱個喏道：「貧僧問訊了。」王子愈覺心驚。三藏道：「頑徒都是山野中收來的，不會行禮，萬望赦罪。」王子奈著驚恐，教典膳官請眾僧去暴紗亭吃齋。三藏謝了恩，辭王下殿，同至亭內，埋怨八戒道：「你這夯貨，全不知一毫禮體。索性不開口，便也罷了，怎麼那般粗魯？一句話，足足衝倒泰山。」行者笑道：「還是我不唱喏的好，也省些力氣。」沙僧道：「他唱喏又不等齊，預先就抒著個嘴吆喝。」八戒道：「活淘氣，活淘氣。師父前日教我見人打個問訊兒是禮，今日打問訊，又說不好，教我怎的幹麼。」三藏道：「我教你見了人打個問訊，不曾教你見王子就此歪纏。常言道：『物有幾等物，人有幾等人。』如何不分個貴賤？」正說處，那典膳官帶領人役，調開桌椅，擺上齋來。師徒們卻不言語，各各吃齋。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

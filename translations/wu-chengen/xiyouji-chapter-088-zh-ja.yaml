  "translation_ja": |-
    さすがは悟空、ひと声口笛を吹き、宙返りを打つと、両足で五色のめでたい雲を踏み、地上からおよそ三百歩（ぶ）の高さの中空へ上がった。金箍棒で「撒花蓋頂（さっかがいちょう）」、「黄竜転身（こうりゅうてんしん）」の型を繰り出し、上がり下がりし、左へ旋り右へ回る。初めのうちは、人と棒は錦に花を添えたようだったが、やがて人の姿は見えなくなり、空一面を棒だけが転がり回って見えた。八戒は下で喝采を送り、自分も手足がむずむずしてたまらず、大声で叫んだ。
    八戒「俺もひとつ、演じてやろう。」
    さすがの八戒、風に乗って中空へ上がると、熊手を振り、上に三、下に四、左に五、右に六、前に七、後ろに八と、全身で技を繰り出した。ただ、ごうごうと風の鳴る音が聞こえる。演技が盛んになったところで、沙悟浄が三蔵に言った。
    沙悟浄「お師匠さま、私も少し稽古をしてまいります。」
    さすがの沙悟浄、両足をそろえて跳び、杖を振り回しながら空へ上がった。鋭い気が立ちこめ、金色の光がたなびいている。両手で降妖杖（ごうようじょう）を操り、「丹鳳朝陽（たんぽうちょうよう）」、「餓虎撲食（がこぼくしょく）」の型を繰り出し、素早く迎え撃ち、ゆったりと防ぎ、急に身を返し、勢いよく突き進む。兄弟弟子の三人は大いに神通力を振るい、中空でそろって武威を示した。これこそ、

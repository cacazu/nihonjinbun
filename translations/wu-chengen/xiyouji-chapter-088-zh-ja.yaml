  "translation_ja": |-
    さて勇ましい王子たちは、長男が眉の高さまである棍を一本取り、次男が九歯の熊手を振りかざし、三男が黒く油光りする棒を携えて、意気揚々と王府から出てきた。そして声を張り上げた。
    三人の王子「経を取りに行くとかいう僧は、どこにいる。」
    そこにいた典膳官たちがひざまずいて答えた。
    典膳官たち「若殿さま、こちらの暴紗亭でお食事中です。」
    王子たちは有無を言わさず中へ押し入り、一人が怒鳴った。
    王子の一人「お前たちは人か、妖怪か。早く答えれば、命は助けてやる。」
    三蔵は驚いて顔色を失い、飯椀を置き、身をかがめた。
    三蔵「私は唐朝から経を取りに参った者です。人間であって、妖怪ではございません。」
    王子の一人「お前はまだ人間らしいが、あの醜い三人は、きっと妖怪だ。」
    八戒はひたすら飯を食い、取り合わなかった。沙悟浄と悟空は身を起こし、答えた。
    沙悟浄と悟空「私たちはみな人です。顔は醜くても心は善良で、体は無骨でも性質は穏やかです。そちらこそ、どこから来た三人ですか。なぜそんなに大口をたたき、無礼に振る舞うのです。」
    そばにいた典膳官たちが言った。
    典膳官たち「この三方は、わが王のご子息、若殿下でいらっしゃいます。」
    八戒は椀を置いた。
    八戒「若殿下か。そろって武器を持ち出して、何をするつもりだ。まさか俺たちと、けんかしようってんじゃないだろうな。」

  "source_text": "諕得那三個小王子跪在塵埃。暴紗亭大小人員，並王府裡老王子，滿城中軍民男女，僧尼道俗，一應人等，家家念佛磕頭，戶戶拈香禮拜。果然是："
  "source_languages":
  - "zh-Hant"
  "source_locations":

  "translation_ja": |-
    第二王子は足を踏み開き、両手で熊手を振って、八戒に打ちかかろうとした。八戒はにやにや笑った。
    八戒「お前の熊手なんざ、俺の熊手の孫になるのがせいぜいだ。」
    そして衣をまくり、腰から熊手を取り出してひと振りすると、万筋の金色の光が放たれた。技を繰り出せば、千筋のめでたい気が立ちのぼる。王子は恐れで手足の筋が緩み、もう武器を振り回す勇気がなくなった。悟空は、第一王子が眉の高さの棍を構えて跳びはねているのを見ると、耳から金箍棒（きんこぼう）を取り出し、ひと振りした。棒は椀ほどの太さ、一丈（じょう）二、三尺（しゃく）ほどの長さになった。それを地面へ突き下ろし、三尺ほど食い込ませ、そこへ立てた。悟空は笑って言った。
    悟空「この棍は、お前にやろう。」
    王子はそれを聞くと、自分の棍を放り出して、その棒を取りにいった。両手に力を込めて引き抜こうとしたが、ほんの少しも動くはずがない。もう一度持ち上げようとし、揺すってみても、まるで根が生えたようだった。第三王子は荒っぽい性分をむき出しにし、黒い油光りのする棒で打ちかかった。沙悟浄は片手でそれを払いのけ、降妖宝杖（ごうようほうじょう）を取り出してくるりと回した。まばゆい光が生まれ、霞がきらきらと輝いた。典膳官たちは一人残らず呆然とし、口もきけなくなった。三人の王子は一斉にひれ伏した。
    三人の王子「神のお師匠さま、神のお師匠さま、私ども凡人は、お見それいたしました。どうかひととおり演じてくださり、私たちも拝んで教えを受けられますように。」
    悟空はそばへ行き、軽々と棒を抜き取った。
    悟空「ここは狭くて、手足を伸ばせない。空へ跳び上がって一連の技を演じるから、見ているがいい。」

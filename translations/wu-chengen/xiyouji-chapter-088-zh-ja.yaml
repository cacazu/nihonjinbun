  "source_text": |-
    真禪景象不凡同，大道緣由滿太空。
    金木施威盈法界，刀圭展轉合圓通。
    神兵精銳隨時顯，丹器花生到處崇。
    天竺雖高還戒性，玉華王子總歸中。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"
    "precision": "line"
    "line_start": 144
    "line_end": 147
    "source_sequence": 16
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第088回&oldid=1500527"
  "translation_ja": |-
    真の禅の姿は、ありふれたものとは違い、
    大いなる道のいわれが、虚空のすべてに満ちている。
    金と木が威力を施し、あらゆる世界を満たし、
    刀圭（とうけい）は転じ巡って、円通（えんつう）にかなう。
    神の武器は精妙で鋭く、折に応じて現れ、
    丹の器には花が生まれ、至る所で尊ばれる。
    天竺は高尚でも、なお心を戒めねばならず、
    玉華（ぎょくか）の王子たちは、みな中なる道へ帰るのだ。

  "source_text": "二王子掣開步，雙手舞鈀，便要打八戒。八戒嘻嘻笑道：「你那鈀只好與我這鈀做孫子罷了。」即揭衣，腰間取出鈀來，幌一幌，金光萬道。丟了解數，有瑞氣千條。把個王子諕得手軟筋麻，不敢舞弄。行者見大的個使一條齊眉棍，跳阿跳的，即耳朵裡取出金箍棒來，幌一幌，碗來粗細，有丈二三長短。著地下一搗，搗了有三尺深淺，豎在那裡。笑道：「我把這棍子送你罷。」那王子聽言，即丟了自己棍，去取那棒，雙手盡氣力一拔，莫想得動分毫；再又端一端，搖一搖，就如生根一般。第三個撒起莽性，使烏油棒便來打。被沙僧一手劈開，取出降妖寶杖，撚一撚，艷艷光生，紛紛霞亮。諕得那典膳等官一個個呆呆掙掙，口不能言。三個小王子一齊下拜道：「神師，神師，我等凡人不識，萬望施展一番，我等好拜授也。」行者走近前，輕輕的把棒拿將起來道：「這裡窄狹，不好展手。等我跳在空中，耍一路兒，你們看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch88-1500527"

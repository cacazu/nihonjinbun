  "translation_ja": |-
    一方、玉華王は殿を下がって奥の宮へ入った。そこには三人の若い王子がいて、父の顔色が変わっているのを見て尋ねた。
    三人の王子「父上、今日はどうして、そんなにおびえておられるのですか。」
    玉華王「先ほど、東土の大唐から仏を拝み経を求めに遣わされた僧が、通行文書に証印を受けに来たのだ。その僧は、ひとかどの立派な人物だった。食事をさせようとしたところ、弟子が府の前にいるというので、すぐに呼びに行かせた。やがて入ってきたが、私を見ても正式な大礼をせず、ただ挨拶しただけなので、すでに不快だった。顔を上げて見ると、一人残らず妖魔のように醜く、思わず恐ろしくなった。それで顔色が変わっているのだ。」
    ところが三人の王子は並の者とは違い、そろって武芸と強さを好んでいた。拳を突き出し、袖をまくって言った。
    三人の王子「山から出てきた妖怪が、人の姿を装っているのではありませんか。武器を持って、見にいってまいります。」

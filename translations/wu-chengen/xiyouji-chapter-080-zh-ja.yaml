    "source_text": "三藏真個慈心，也就忍不住吊下淚來，聲音哽咽，叫道：「徒弟。」那八戒、沙僧正在林中尋花覓果，猛聽得師父叫得悽愴，獃子道：「沙和尚，師父在此認了親耶。」沙僧笑道：「二哥胡纏，我們走了這些時，好人也不曾撞見一個，親從何來？」八戒道：「不是親，師父那裡與人哭麼？我和你去看來。」沙僧真個回轉舊處，牽了馬，挑了擔，至跟前叫：「師父，怎麼說？」唐僧用手指定那樹上，叫：「八戒，解下那女菩薩來，救他一命。」獃子不分好歹，就去動手。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      三蔵は本当に慈悲深い心の持ち主なので、こらえきれず涙をこぼし、声を詰まらせて呼んだ。
      三蔵「お前たち。」
      八戒と沙悟浄は、ちょうど林で花や果物を探していた。師の悲しげな呼び声を聞くと、八戒がいった。
      八戒「沙和尚（さおしょう）、お師匠さま、ここで親類にでも会ったのかな。」
      沙悟浄は笑った。
      沙悟浄「八戒兄さん、何をでたらめな。この長い間、まともな人にさえ一人も会っていないのに、どこから親類が出てくるのです。」
      八戒「親類でなけりゃ、お師匠さまが誰かと一緒に泣くわけないだろ。見に行こうぜ。」
      沙悟浄は元の場所へ引き返し、馬を引いて荷を担ぎ、師のそばへ来て声をかけた。
      沙悟浄「お師匠さま、どうなさったのですか。」
      三蔵は木の上を指し示した。
      三蔵「八戒、あの女菩薩をほどいて下ろし、命を助けておあげ。」
      八戒はよしあしも考えず、すぐに手をかけた。

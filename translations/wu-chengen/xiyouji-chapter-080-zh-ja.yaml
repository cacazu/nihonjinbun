    "source_text": "唐僧在馬上聽得又這般叫喚，即勒馬叫：「悟空，去救那女子下來罷。」行者道：「師父走路，怎麼又想起他來了？」唐僧道：「他又在那裡叫哩。」行者問：「八戒，你聽見麼？」八戒道：「耳大遮住了，不曾聽見。」又問：「沙僧，你聽見麼？」沙僧道：「我挑擔前走，不曾在心，也不曾聽見。」行者道：「老孫也不曾聽見。師父，他叫甚麼？偏你聽見？」唐僧道：「他叫得有理。說道：『活人性命還不救，昧心拜佛取何經？』『救人一命，勝造七級浮屠。』快去救他下來，強似取經拜佛。」行者笑道：「師父要善將起來，就沒藥醫。你想你離了東土，一路西來，卻也過了幾重山場，遇著許多妖怪，常把你拿將進洞。老孫來救你，使鐵棒，常打死千千萬萬。今日一個妖精的性命，捨不得，要去救他？」唐僧道：「徒弟呀，古人云：『勿以善小而不為，勿以惡小而為之。』還去救他救罷。」行者道：「師父既然如此，只是這個擔兒，老孫卻擔不起。你要救他，我也不敢苦勸：我勸一會，你又惱了。任你去救。」唐僧道：「猴頭莫多話，你坐著，等我和八戒救他去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      馬上の三蔵はまたこの呼び声を聞き、すぐ手綱を引いた。
      三蔵「悟空、戻ってあの女を助け下ろしておあげ。」
      悟空「お師匠さま、道を進んでいるのに、どうしてまたあいつを思い出すんです。」
      三蔵「また、あそこで叫んでいるのだ。」
      悟空「八戒、お前には聞こえたか。」
      八戒「耳が大きくてふさがっちまい、聞こえなかったよ。」
      悟空「沙悟浄、お前には聞こえたか。」
      沙悟浄「荷を担いで先を歩いていたので、気に留めませんでした。聞こえませんでしたよ。」
      悟空「俺にも聞こえませんでした。お師匠さま、何といっていたんです。どうして、あなただけに聞こえたのです。」
      三蔵「もっともなことをいっていた。『生きている人の命を助けもしないのに、良心を偽って仏を拝み、いったい何の経を求めるのか』と。『人の命を一つ救えば、七重の浮屠（ふと）を建てるより勝る』という。早く助けて下ろしなさい。経を求めて仏を拝むより、その方がよい。」
      悟空は笑った。
      悟空「お師匠さまが慈悲を振り回し始めたら、つける薬もありませんね。考えてみてください。東土を離れ、西へ来る間、いくつもの山を越え、たくさんの妖怪に出くわし、しょっちゅう洞へさらわれたでしょう。俺が助けに行き、鉄の棒で千や万の妖怪を打ち殺してきた。それが今日は、一匹の妖怪の命が惜しくなって、救いに行くんですか。」
      三蔵「悟空よ、昔の人も『善は小さいからといって行わぬことなく、悪は小さいからといって行ってはならぬ』といっている。やはり戻って、助けておあげ。」
      悟空「そこまでおっしゃるなら、俺にはこの責任は負えませんよ。救いたいのなら、もう無理に止めるのもよしましょう。少し止めれば、またお怒りになる。お好きなように助けに行ってください。」
      三蔵「猿、もう口を挟むな。お前は座っていなさい。私と八戒で助けてくる。」

  - "id": "xy-ch80-024"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      多年古剎沒人修，狼狽凋零倒更休。
      猛風吹裂伽藍面，大雨澆殘佛像頭。
      金剛跌損隨淋灑，土地無房夜不收。
      更有兩般堪嘆處，銅鐘著地沒懸樓。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 158
        "line_end": 161
    "translation_ja": |-
      長年、誰も修めぬ古寺は、
      惨めに荒れ果て、崩れる一方。
      烈しい風が伽藍（がらん）の顔を裂き、
      大雨が仏像の頭を削る。
      金剛（こんごう）は転び壊れ、雨ざらしとなり、
      土地神（とちがみ）は住まいをなくして、夜も落ち着く所がない。
      さらに二つ、嘆かわしいことがある。
      銅の鐘は地に落ち、吊るす楼もなくなった。
    "translation_status": "draft"
  - "id": "xy-ch80-025"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏硬著膽，走進二層門。見那鐘鼓樓俱倒了，止有一口銅鐘，扎在地下，上半截如雪之白，下半截如靛之青。原來是日久年深，上邊被雨淋白，下邊是土氣上的銅青。三藏用手摸著鐘，高叫道：「鐘啊，你也曾懸掛高樓吼，也曾鳴遠彩梁聲。也曾雞啼就報曉，也曾天晚送黃昏。不知化銅的道人歸何處，鑄銅匠作那邊存。想他二命歸陰府，他無蹤跡你無聲。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      三蔵は勇気を振り絞り、二つ目の門へ入った。鐘楼も鼓楼も倒れ、銅の鐘が一つ、地面に突き刺さるようにして残っているだけだった。上半分は雪のように白く、下半分は藍のように青い。長い年月のうちに、上は雨に洗われて白くなり、下は土の気で銅の青錆が出たのだ。三蔵は鐘を手で撫で、大声で呼びかけた。
      三蔵「鐘よ、お前もかつては高い楼に吊られて吼え、
      彩った梁から、遠くまで声を響かせた。
      鶏が鳴けば夜明けを告げ、
      日が暮れれば夕べを送った。
      銅を募った修行者は、どこへ帰ったのか。
      お前を鋳た銅の職人は、どこにいるのか。
      あの二人の命は冥府へ帰ったのだろう。
      人の行方は知れず、お前にも声がない。」
    "translation_status": "draft"
  - "id": "xy-ch80-026"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老高聲讚嘆，不覺的驚動寺裡之人。那裡邊有一個侍奉香火的道人，他聽見人語，扒起來，拾一塊斷磚，照鐘上打將去，那鐘噹的響了一聲。把個長老諕了一跌，掙起身要走，又絆著樹根，撲的又是一跌。長老倒在地下，擡頭又叫道：「鐘啊，貧僧正然感嘆你，忽的叮噹響一聲。想是西天路上無人到，日久多年變作精。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      三蔵が大声で嘆きながら称えていると、知らぬ間に寺の人を起こしてしまった。中には香火の世話をする寺男がいた。話し声を聞いて起き上がり、割れた煉瓦を一つ拾い、鐘めがけて打ちつけると、鐘がごんと一声鳴った。三蔵は驚いて転び、ようやく起きて逃げようとしたが、また木の根につまずき、どさりと転んだ。地に倒れた三蔵は顔を上げ、また呼びかけた。
      三蔵「鐘よ、私はちょうどお前を思って嘆いていたのに、
      突然、ごんと鳴ったのか。
      西天の道には人も訪れず、
      長い年月に、お前まで精となったのだろう。」
    "translation_status": "draft"
  - "id": "xy-ch80-027"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那道人趕上前，一把攙住道：「老爺請起。不干鐘成精之事，卻才是我打得鐘響。」三藏擡頭見他的模樣醜黑，道：「你莫是魍魎妖邪？我不是尋常之人，我是大唐來的，我手下有降龍伏虎的徒弟。你若撞著他，性命難存也。」道人跪下道：「老爺休怕。我不是妖邪，我是這寺裡侍奉香火的道人。卻才聽見老爺善言相讚，就欲出來迎接；恐怕是個邪鬼敲門，故此拾一塊斷磚，把鐘打一下壓驚，方敢出來。老爺請起。」那唐僧方然正性道：「住持，險些兒諕殺我也。你帶我進去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      寺男は駆け寄り、三蔵の体を支えた。
      寺男「お坊さま、お立ちください。鐘が精になったのではありません。今の音は、私が叩いたのです。」
      三蔵は顔を上げ、その醜く黒い姿を見るといった。
      三蔵「お前は魍魎（もうりょう）や妖怪ではないのか。私はただの者ではない。大唐（だいとう）から来たのだ。私の下には、竜や虎も降す弟子たちがいる。彼らにぶつかれば、お前の命はないぞ。」
      寺男は膝をついた。
      寺男「お坊さま、怖がらないでください。私は妖怪ではなく、この寺の香火を世話する者です。先ほどお坊さまのありがたいお褒めの言葉を聞き、お迎えに出ようとしました。けれども、邪な鬼が門を叩いているのではないかと怖くなり、割れた煉瓦を拾って鐘をひと打ちし、恐れを追い払ってから、やっと出てきたのでございます。お坊さま、どうぞお立ちください。」
      三蔵はようやく正気に戻った。
      三蔵「住持（じゅうじ）どの、危うく驚きで死ぬところだった。中へ案内してください。」
    "translation_status": "draft"

  - "id": "xy-ch80-029"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": "青磚砌就彩雲牆，綠瓦蓋成琉璃殿。黃金裝聖像，白玉造階臺。大雄殿上舞青光，毘羅閣下生銳氣。文殊殿結采飛雲，輪藏堂描花堆翠。三簷頂上寶瓶尖，五福樓中平繡蓋。千株翠竹搖禪榻，萬種青松映佛門。碧雲宮裡放金光，紫霧叢中飄瑞靄。朝聞四野香風遠，暮聽山高畫鼓鳴。應有朝陽補破衲，豈無對月了殘經。又只見半壁燈光明後院，一行香霧照中庭。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      青い煉瓦で彩雲の壁を築き、釉薬をかけた緑の瓦で御堂を葺く。
      聖なる像は黄金で飾られ、階段と台は白玉で造られる。
      大雄殿（だいおうでん）には青い光が舞い、毘羅閣（びらかく）の下には鋭い気が生ずる。
      文殊殿（もんじゅでん）は彩りを結んで雲を飛ばし、輪蔵堂（りんぞうどう）には花を描いて翠を重ねる。
      三重の軒の屋根には宝瓶（ほうびょう）の尖りがそびえ、五福楼（ごふくろう）には刺繡の天蓋が平らに広がる。
      千株の翠竹が禅の寝台のほとりに揺れ、万種の青松が仏門を映す。
      碧雲宮（へきうんきゅう）では金色の光を放ち、紫の霧の中には瑞気が漂う。
      朝には四方の野の遠くから香る風を感じ、夕べには高い山で絵太鼓が鳴るのを聞く。
      朝日に向かって破れた僧衣を繕う者もいるはず、
      月に向かって読み残した経を読み終える者が、いないはずもない。
      さらに見れば、壁の半ばに灯の光が後庭を照らし、
      一筋の香の煙が中庭を照らしていた。
    "translation_status": "draft"
  - "id": "xy-ch80-030"

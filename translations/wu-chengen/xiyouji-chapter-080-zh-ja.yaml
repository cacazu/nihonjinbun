    "translation_ja": "歩いていくと、山門に五つの大きな文字が見えた。「鎮海禅林寺（ちんかいぜんりんじ）」である。足を上げて門内へ踏み込むと、一人の僧が歩いてきた。どんな姿だったかというと、"

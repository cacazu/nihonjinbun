    "translation_ja": |-
      一方、三蔵は林の中に座り、心を明らかにし、本性を見きわめながら、『摩訶般若波羅密多心経（まかはんにゃはらみったしんぎょう）』を唱えていた。すると突然、すすり泣くような叫びが聞こえた。
      声の主「助けてください。」
      三蔵ははっとした。
      三蔵「善哉（ぜんざい）、善哉。こんな深い林で、誰が叫んでいるのだろう。狼や虎や豹に驚いて、倒れでもしたのか。見に行ってみよう。」
      三蔵は立ち上がって足を運び、千年の柏（はく）を抜け、万年の松をかき分け、葛や藤の蔓につかまりながら、近づいてみた。大木に一人の女が縛りつけられている。上半身は葛の蔓で木にくくりつけられ、下半身は土に埋められていた。三蔵は立ち止まって尋ねた。
      三蔵「女菩薩（にょぼさつ）、どうしてこんな所へ縛られているのです。」
      ああ、これは紛れもなく妖怪なのに、生身の人間の眼しか持たない三蔵には見抜けない。女の妖怪は問いかけられると、泉のように涙をこぼした。桃色の頬を涙が伝うその顔は、魚も沈み、雁も落ちるほどの美しさ。星のような眼に悲しみをたたえる姿は、月も隠れ、花も恥じらうほどである。三蔵はどうしても近づけず、重ねて問いかけた。
      三蔵「女菩薩、いったいどのような罪があったのです。私にお話しくだされば、お助けもしやすい。」
      女の妖怪は言葉巧みに、偽りの情を装って、急いで答えた。
      女の妖怪「お坊さま、私はここから二百余里の、貧婆国（ひんばこく）に住む者でございます。両親は健在で、善行をたいそう好み、親類とは仲よく、友人とは親しく、生涯を過ごしてまいりました。清明（せいめい）のころ、親類や家中の老いも若きも招いて、先祖の墓へお参りに出かけました。一行は輿や馬を連ね、町はずれの野原へ出たのです。墓の前へ供物を並べ、紙馬（しば）を焼いた、そのとたんでした。銅鑼や太鼓の音がして、盗賊が一団、刀や棒を振りかざし、殺せと叫んで走り寄ってきたのです。私たちは魂も飛び散るほど驚き、両親や親類は馬や輿に乗れた者から、それぞれ逃げて命を助けました。私はまだ若くて走れず、恐ろしさに倒れたところを、盗賊たちに山へさらわれました。一番の頭領は夫人にするといい、二番の頭領は妻にするといい、三番も四番も私の容貌を欲しがって、七、八十人がいっせいに争ったのです。誰も引き下がらないので、私を林の木へ縛りつけ、盗賊たちは散り散りに去ってしまいました。もう五日五晩になります。命も尽きかけ、間もなく死んでしまうでしょう。どの代の先祖が功徳（くどく）を積んでくださったのか、今日、ありがたくもお坊さまにお会いできました。どうか深いお慈悲をかけ、命をお救いください。九泉（きゅうせん）の下へ参っても、決してご恩は忘れません。」
      そういうと、雨のように涙を流した。

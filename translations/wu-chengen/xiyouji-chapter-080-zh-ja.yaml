    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏見了，不敢進去，叫：「道人，你這前邊十分狼狽，後邊這等齊整，何也？」道人笑道：「老爺，這山中多有妖邪強寇，天色清明，沿山打劫，天陰就來寺裡藏身，被他把佛像推倒墊坐，木植搬來燒火。本寺僧人軟弱，不敢與他講論，因此把這前邊破房都捨與那些強人安歇，從新另化了些施主，蓋得那一所寺院。清混各一，這是西方的事情。」三藏道：「原來是如此。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      三蔵はこれを見ると、中へ進むのもためらい、声をかけた。
      三蔵「寺男どの、前の方はあれほど荒れているのに、奥はこんなに整っている。どういうわけです。」
      寺男は笑った。
      寺男「お坊さま、この山には妖怪や荒くれの盗賊がたくさんおります。晴れていれば山沿いで追い剝ぎをし、曇れば寺へ来て身を隠すのです。仏像を押し倒して腰掛けにし、建築の木材を運んで火にくべます。この寺の僧たちは気が弱く、文句をいうこともできません。そこで前の壊れた部屋はすべて盗賊どもの休み場に譲り、改めて施主を募って、あちらの寺を建てたのです。清らかな方と濁った方を、それぞれ分けております。これが西方の事情でして。」
      三蔵「そういうことでしたか。」
    "translation_status": "draft"

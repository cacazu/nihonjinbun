        "line_start": 183
        "line_end": 183
    "translation_ja": |-
      功徳を積むには、慈悲の思いが欠かせない。
      仏法が盛んになるとき、僧は僧を称える。
    "translation_status": "draft"
  - "id": "xy-ch80-037"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知怎生離寺，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 184
        "line_end": 184
    "translation_ja": "さて、どのようにこの寺を去ることになるのか。それは次の回でお話ししよう。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-01-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の姹女は若い女をいう語で、内丹の比喩にも用いられる。心猿は落ち着かぬ心を猿にたとえ、同時に悟空を指す。育陽と配偶は陽の力を養い、相手を得るという題の表現にとどめ、人物の未開示の正体や来歴は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-02-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は冬残春尽とする。冬の残りが過ぎ、春も尽きたという時間経過として訳し、旅の他の回の月日から期間を計算して補訂しない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-03-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この詩は骨牌遊びの牌や組合せの名を織り込む。天牌、錦屏風、観灯十五、天地分、竜虎風雲会、拗馬軍、巫山の十二峰、対子が各句の仕掛けに関わる。曲海総目提要巻二十四の骨牌名一覧でも多くの同形名が確認できる。天牌は勅命、対子は帝に向き合うことにも掛けたと解す。拗馬軍の旅の文脈での細かな比喩は未確定なので、名を残して行く手の難儀として訳した。観灯十五は十五夜の灯祭りを思わせるが、他の回の出立日へ合わせて変えない。巫山をこの旅の確定した地理上の通過点とも断定しない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-04-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の密查と蓼卻は難解な表記を含む。前後の荊棘・纏枝・盤・藤葛との対句から、密生する茨と枝に絡む草蔓の描写として訳した。別版の字へ原文を置き換えず、特定の植物種への同定は保留する。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-05-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の画眉郎也会看経は、鳥を人物のように呼んで経を読むと述べる擬人化として保った。単に鳴き声が美しいという要約へ置き換えない。大虫と老虎はいずれも虎を指すため、二つの動作を保って訳す。狐狢はこの森の獣の描写として扱い、別の登場人物の本体へ結びつけない。百舌は教育部辞典では各種の鳥声をまねる黒い鳥と説明され、日本語で百舌と書くモズへ直結させず、原語の音読みを添えて残した。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-06-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は三額金冠。三という数を残したが、額の具体的な造形は未詳。以前の紫金冠などとの同一性を決めつけず、原文の品目を無断統一しない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-07-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "五百年前・四万七千の部下、天宮での服装、師弟関係への感慨は悟空の回想であり、他の回の年数や装備へ合わせて直していない。師の帰還後の利益や自分の正果は、この時点では悟空自身の期待である。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-08-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "女菩薩は女性に対する仏教的な敬称で、実際の菩薩の身分を認定するものではない。ここでは三蔵の呼びかけとして残す。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-09-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "貧婆国の家、親の善行、清明の墓参、盗賊の争い、五日五晩という説明は、語り手が虚情仮意と明示する女の話である。地理や家族関係、日数を語り手の確認した事実へ変えない。七八十家はこの争い手を七、八十人と解した。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-10-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "人肉を食べる手口だという説明と、自分も経験したという言葉は悟空の発言。その指摘を、語り手が確認した女の目的や具体的な過去の事件へ広げない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-11-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "倒踏門は女の家へ入る婿の意味に取り、八戒が悟空へ性的な企図をなすりつける台詞として訳した。悟空が八戒の木に縛られた婿取りを持ち出すのも、八戒への反撃である。両者の悪口と語り手の事実説明を区別する。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-12-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "童身と元陽未泄は、三蔵が性交をせず性的な精を漏らしていないという女の理解。配合は交合の意味を保持した。相手との交合で仙人になれるというのは妖怪の企てと作中の修行観であり、現代の医療・健康上の事実や助言ではない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-13-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "善將は慈悲を持ち出して動きだすほどの意味と解し、悟空が師の頑固な善意をからかう調子で訳した。薬で治せる実際の病気とみなした表現ではない。千千万万の殺害という誇張も悟空の発言として保持する。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-14-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "小死は死ぬほどの打擲、充軍は軍役に送る刑、擺站は駅での苦役。不応は明文の罪名がなくても道理上してはならぬ行為を罰する不応為の語と解した。教育部辞典の擺站と、大明律の不応為を引く朝鮮王朝実録等を参照した。本文は悟空が予想して脅す処罰であり、この場で裁判や刑が実行されたわけではない。現代法の説明ではない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-15-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は線記号の後に他怎生得去とだけ置き、話者を明記しない。前後で悟空が移動の方法を問う流れから悟空の返答としたが、話者省略の留保を残す。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-16-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の無人不能自往には否定が重なる。ここでは、馬も人に導かれて進むという文脈の諺として訳した。字面を人なしでも進めると読んで、師を置いて行けるという意味へ反転させない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-17-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "借宿を先に頼みにいくこの台詞は、底本では主語が省略されている。前後の役割を照合し、三蔵の発言として訳した。悟空の前の発言から機械的に同じ話者へつなげず、話者省略の留保を残す。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-18-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この賦は三蔵が最初に目にした荒廃を描く。香厨は寺の厨房、琉璃香灯はガラス製の灯明具をいう。香厨を香の棚とせず、香灯に香炉を加えない。語りの昼・夜の記述も省かず、三蔵が昼夜とも観察を済ませたという補足は加えない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-19-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "末二句の兩般は、銅鐘が地に落ちたことと、鐘を吊るす楼がないことという二点に取った。前の金剛・土地神まで数えるかには留保がある。伽藍・金剛・土地の顔や住まいの損傷は寺の神像・祠の荒廃であり、天上の本人がこの場で傷ついたという意味へ変えない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-20-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "上部は雨で雪のように白く、下部は土の気で藍のように青いという、原文の色と説明を保持した。現代の腐食の知識で色や原因を訂正しない。化銅の道人は鋳造用の銅を勧進した者と解し、銅を溶かす職人と一人にまとめない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-21-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "道人はここでは寺の香火を世話する者なので、通常の地の文・話者は寺男とした。三蔵の住持という呼びかけは原文に残るが、本人が寺の院主だと名乗ったわけではない。鐘を鳴らしたのは、相手が邪鬼かもしれぬという恐れを払うためだと本人が説明している。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-22-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "建築と荘厳の列挙をすべて保った。毘羅閣は底本の字を採り、毘盧閣への誤記と断定しない。平繡蓋は平たく広がる刺繡の天蓋と解したが、構造の詳細は未確定。碧雲宮や五福楼を他の寺・宮殿の同種名へ同定しない。香風の聞は香りを感じる意味に取り、香霧が照らすという詩的な表現も残す。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-23-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "左笄は既存の左笄帽に通じる帽子の呼称と解したが、左側の笄という字面だけから具体的な構造は補わない。頗羅は毛線服に付く語で、布地や織物の呼称とみられるが、正確な語源・材質は未確定。後世の特定の織物名へ無断で置換せず、原字を残した。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-24-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "喇嘛はチベット語の師を表す語に由来し、中国文献ではチベット系の僧を指す呼称にもなる。ここでは原詩の呼び名を保持するが、特定宗派や民族、実在僧院を断定しない。耳飾り、服、振り鼓、聞き取れない経の描写から、それ以前の行で身分を先取りしない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-25-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "不当人子は相手をたしなめる言葉として訳した。華蓋に犯されて家に養えないという出家の説明は、喇嘛僧の述べる星回りの俗信と身の上話であり、仏教の一般的な出家理由とするものではない。家族や特定の病気に関する事実を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-26-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は二人の小喇嘛が走り出て戻り、まとめて道と報告するので、ここは二人の合同発話とした。三四個という人数も三人に直さない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-27-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "雷公嘴は悟空、碓挺嘴は八戒、青臉獠牙は沙悟浄を、三蔵が弟子三人と認める描写につなげた。不是個人生父母養的は、悟空が人の親から生まれ育った者ではないという三蔵の言葉を保持。打進來は暴力的に押し入ることで、まだ門の破壊や襲撃が起きたとは訳さない。この容貌の説明では底本の話者が単数の小和尚になるため、小喇嘛と記したが、先の二人のどちらかまでは推測しない。"
    "translation_status": "draft"
  - "id": "xy-ch80-note-28-body"
    "section_id": "chapter-80"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "慈悲によって功徳を積むことと、仏法の隆盛に僧どうしが称え合うことを並べた結び。女の救助をめぐる物語が終結したとの説明や、以後の結果は補わない。"
    "translation_status": "draft"

    "source_text": "卻說那大聖在半空中，又見那黑氣濃厚，把祥光盡情蓋了，道聲：「不好，不好！黑氣罩暗祥光，怕不是妖邪害俺師父？化齋還是小事，且去看我師父去。」卻返雲頭，按落林裡，只見八戒亂解繩兒。行者上前一把揪住耳朵，撲的捽了一跌。獃子擡頭看見，爬起來說道：「師父教我救人，你怎麼恃你有力，將我摜這一跌？」行者笑道：「兄弟，莫解他。他是個妖精，弄喧兒，騙我們哩。」三藏喝道：「你這潑猴，又來胡說了，怎麼這等一個女子，就認得他是個妖怪？」行者道：「師父原來不知，這都是老孫幹過的買賣，想人肉吃的法兒，你那裡認得？」八戒嗊著嘴道：「師父，莫信這弼馬溫哄你，這女子乃是此間人家。我們東土遠來，不與相較，又不是親眷，如何說他是妖精？他打發我們丟了前去，他卻翻觔斗，弄神法轉來和他幹巧事兒，倒踏門也。」行者喝道：「夯貨，莫亂談。我老孫一向西來，那裡有甚憊懶處？似你這個重色輕生、見利忘義的囔糟，不識好歹，替人家哄了招女婿，綁在樹上哩。」三藏道：「也罷，也罷。八戒啊，你師兄常時也看得不差，既這等說，不要管他，我們去罷。」行者大喜道：「好了，師父是有命的了。請上馬，出松林外，有人家化齋你吃。」四人果一路前進，把那怪撇了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      一方、空にいた悟空は、黒い気がさらに濃くなり、めでたい光をすっかり覆うのを見た。
      悟空「まずい、まずい！　黒い気が瑞光を隠した。妖怪がお師匠さまを害そうとしているんじゃないか。食事をもらうのは後回しだ。まずお師匠さまを見に行こう。」
      雲を返して林へ降りると、八戒がむやみに縄をほどいている。悟空は進み寄って耳をつかみ、どさりと地面へ投げ倒した。八戒は顔を上げ、相手を見ると起き上がっていった。
      八戒「お師匠さまに、人を助けろといわれたんだぞ。力が強いからって、なんで俺を投げ飛ばすんだよ！」
      悟空は笑った。
      悟空「兄弟、ほどくな。そいつは妖怪だ。騒ぎ立てて、俺たちをだましているんだよ。」
      三蔵は叱りつけた。
      三蔵「この不届きな猿、またでたらめをいう！　こんな女を見て、どうして妖怪だと分かるのだ。」
      悟空「お師匠さまは知らないでしょうが、こういうのは俺もやってきた稼業なんです。人肉が食いたいときの手口ですよ。あなたには見分けがつかないでしょう。」
      八戒は口を突き出した。
      八戒「お師匠さま、この弼馬温（ひつばおん）の嘘を信じちゃいけません。この女はこの辺の家の人です。俺たちは遠い東土から来た身で、つきあいもないし、親類でもない。どうして妖怪だなんていえるんです。こいつは俺たちに女を置いて先へ行かせ、自分は宙返りだの術だので戻ってきて、女とうまいことをやり、婿入りするつもりなんですよ。」
      悟空は怒鳴った。
      悟空「ばか者、勝手なことをいうな。俺が西へ来る間、いつそんなふしだらなことをした？　色欲のために命を軽んじ、得になれば義理も忘れる、お前みたいな汚いやつと一緒にするな。よしあしも分からず、人にだまされて婿に取ってもらおうとし、木に縛られたくせに！」
      三蔵「もうよい、もうよい。八戒、お前の兄弟子は、ふだんから見立てを間違えぬ。そういうのなら、かまわず行こう。」
      悟空は大喜びした。
      悟空「よかった。お師匠さまは、まだ命の運がある。馬にお乗りください。松林を出て人家があれば、食事をもらってさしあげます。」
      四人はそのまま先へ進み、女の妖怪を置き去りにした。

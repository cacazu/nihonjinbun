    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧回至林裡，教八戒解了上半截繩子，用鈀築出下半截身子。那怪跌跌鞋，束束裙，喜孜孜跟著唐僧出松林，見了行者。行者只是冷笑不止。唐僧罵道：「潑猴頭，你笑怎的？」行者道：「我笑你時來逢好友，運去遇佳人。」三藏又罵道：「潑猢猻胡說。我自出娘肚皮，就做和尚，如今奉旨西來，虔心禮佛求經，又不是利祿之輩，有甚運退時？」行者笑道：「師父，你雖是自幼為僧，卻只會看經念佛，不曾見王法條律。這女子生得年少標致，我和你乃出家人，同他一路行走，倘或遇著歹人，把我們拿送官司，不論甚麼取經拜拂，且都打做姦情；縱無此事，也要問個拐帶人口：師父追了度牒，打個小死；八戒該問充軍；沙僧也問擺站；我老孫也不得乾淨，饒我口能，怎麼折辯，也要問個不應。」三藏喝道：「莫胡說，終不然，我救他性命，有甚貽累不成？帶了他去，凡有事，都在我身上。」行者道：「師父雖說有事在你，卻不知你不是救他，反是害他。」三藏道：「我救他出林，得其活命，怎麼反是害他？」行者道：「他當時綁在林間，或三五日，十日半月，沒飯吃，餓死了，還得個完全身體歸陰。如今帶他出來，你坐得是個快馬，行路如風，我們只得隨你，那女子腳小，挪步艱難，怎麼跟得上走？一時把他丟下，若遇著狼蟲虎豹，一口吞之，卻不是反害其生也？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      三蔵は林へ戻り、八戒に上半身の縄をほどかせ、下半身の土を熊手で掘り起こさせた。女の妖怪は靴を履き直し、裳を締め、嬉しそうに三蔵の後を追って松林を出て、悟空に会った。悟空はただ冷笑を続けた。三蔵が叱った。
      三蔵「不届きな猿、何を笑っている。」
      悟空「『運が巡ればよき友に会い、運が去れば美女に会う』というのがおかしくてね。」
      三蔵はまた罵った。
      三蔵「この不届きな猿め、でたらめをいうな。私は母の腹を出たときから僧であり、今も勅命を受けて西へ行き、一心に仏を拝んで経を求めている。利益や俸禄（ほうろく）を目当てにする者でもないのに、どうして運が衰えることがある。」
      悟空は笑った。
      悟空「お師匠さまは幼いころから僧でも、読経や念仏しかご存じなく、国の法律をご覧になったことがない。この女は若くて美しい。俺たちは出家の身だというのに、一緒に旅をしていて、もし悪いやつに会い、役所へ突き出されたらどうなります？　経を求めるだの仏を拝むだのにかかわりなく、まずみな、姦通だと決めつけて打たれます。そんな事実がなくても、人さらいの罪には問われますよ。お師匠さまは度牒（どちょう）を取り上げられ、死ぬ寸前まで打たれる。八戒は軍役へ流され、沙悟浄は駅の苦役を命じられる。俺だって無事ではすみません。いくら口が達者でも、どんなに弁じ立てても、やってはならぬことをした、不応（ふおう）の罪ぐらいは科されます。」
      三蔵は叱った。
      三蔵「でたらめをいうな。命を助けてやったために、災難を招くなどということがあるものか。連れていこう。何があっても、すべて私が引き受ける。」
      悟空「何があっても自分が、とはおっしゃいますが、あの女を助けるどころか、かえって害するのだとはお分かりにならない。」
      三蔵「林から連れ出して、命を助けるのに、どうして害するのだ。」
      悟空「林に縛られたままなら、三日か五日、十日か半月、食べ物がなくて餓死しても、五体の揃った身で冥土へ行けます。ところが連れ出してみれば、お師匠さまは風のように走る速い馬に乗り、俺たちもついていくしかない。あの女は足が小さく、一歩進むのも大変なのに、どうしてついてこられます？　うっかり置き去りにして、狼や虎や豹に会えば、ひと口に呑まれてしまう。これこそ、かえって命を損なうことじゃありませんか。」
    "translation_status": "draft"
  - "id": "xy-ch80-019"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏道：「正是呀，這件事卻虧你想，如何處置？」行者笑道：「抱他上來，和你同騎著馬走罷。」三藏沉吟道：「我那裡好與他同馬？」──「他怎生得去？」三藏道：「教八戒馱他走罷。」行者笑道：「獃子造化到了。」八戒道：「『遠路沒輕擔。』教我馱人，有甚造化？」行者道：「你那嘴長，馱著他，轉過嘴來，計較私情話兒，卻不便益？」八戒聞此言，搥胸爆跳道：「不好，不好。師父要打我幾下，寧可忍疼。背著他決不得乾淨，師兄一生會贓埋人。我馱，不成。」三藏道：「也罷，也罷。我也還走得幾步，等我下來，慢慢的同走，著八戒牽著空馬罷。」行者大笑道：「獃子倒有買賣，師父照顧你牽馬哩。」三藏道：「這猴頭又胡說了。古人云：『馬行千里，無人不能自往。』假如我在路上慢走，你好丟了我去？我若慢，你們也慢。大家一處同這女菩薩走下山去，或到庵觀寺院，有人家之處，留他在那裡，也是我們救他一場。」行者道：「師父說得有理，快請前進。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      三蔵「まったくだ。それによく気がついてくれた。どうしたものだろう。」
      悟空は笑った。
      悟空「抱き上げて、お師匠さまと一緒に馬へ乗せたらどうです。」
      三蔵は考え込んだ。
      三蔵「私があの女と同じ馬に乗るわけにはいかぬ。」
      悟空「では、どうやって連れていくんです。」
      三蔵「八戒に背負っていかせよう。」
      悟空は笑った。
      悟空「ばか者にも運が向いてきたな。」
      八戒「『長い道のりに軽い荷はない』というだろ。人を背負わされて、何が幸運だよ。」
      悟空「お前の口は長いからな。背負った女の方へ口を回して、こっそり恋の話ができる。都合がいいだろう？」
      八戒はそう聞くと、胸を叩き、飛び跳ねて怒った。
      八戒「だめだ、だめだ！　お師匠さまに何発か叩かれる方が、まだ痛みを我慢できる。女を背負ったら、絶対に潔白ではいられない。兄貴は人に濡れ衣を着せるのが、昔からうまいんだ。俺が背負うなんて、まっぴらだ！」
      三蔵「よい、よい。私にもまだ少しは歩ける。私が降りて、女とゆっくり歩こう。八戒には、誰も乗らない馬を引かせればよい。」
      悟空は大笑いした。
      悟空「ばか者め、今度は仕事にありついたな。お師匠さまが、お前に馬引きの世話をしてくださったぞ。」
      三蔵「この猿はまたでたらめをいう。昔の人も『馬が千里を行くにも、人がいなければ自らは進めぬ』といっている。私が道をゆっくり歩くからといって、私を置いていけるものか。私がゆっくりなら、お前たちもゆっくり歩けばよい。みな一緒に、この女菩薩と山を下り、庵や道観（どうかん）や寺、人家のある所へ着けば、そこで預かってもらおう。それも、人助けを最後までやり遂げることになる。」
      悟空「お師匠さまのおっしゃるとおりです。さあ、お進みください。」
    "translation_status": "draft"
  - "id": "xy-ch80-020"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏撩前走，沙僧挑擔，八戒牽著空馬，引著女子，行者拿鐵棒，一行前進。不上二三十里，天色將晚，又見一座樓臺殿閣。三藏道：「徒弟，那裡必定是座庵觀寺院，就此借宿了，明日早行。」行者道：「師父說得是，各各走動些。」霎時到了門首，吩咐道：「你們略站遠些，等我先去借宿，若有方便處，著人來叫你。」眾人俱立在柳蔭之下，惟行者拿鐵棒，轄著那女子。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      三蔵が先へ歩き、沙悟浄が荷を担ぎ、八戒は空の馬を引きながら女の妖怪を導き、悟空は鉄の棒を手に、一同は進んだ。二、三十里も行かないうちに、日は暮れかけ、また楼台や殿閣が見えてきた。
      三蔵「お前たち、あれはきっと庵か道観か寺だろう。あそこで一夜を借り、明日早く出発しよう。」
      悟空「そのとおりです。みんな、もう少し足を進めよう。」
      ほどなく門前へ着くと、三蔵が言いつけた。
      三蔵「お前たちは、少し離れた所に立っていなさい。私が先に泊まりを頼んでこよう。都合よく泊まれる所があれば、人をやって呼ばせる。」
      一同は柳の陰に立った。ただ悟空だけは鉄の棒を持ち、女の妖怪を見張っていた。
    "translation_status": "draft"
  - "id": "xy-ch80-021"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老拽步近前，只見那門東倒西歪，零零落落。推開看時，忍不住心中悽慘：長廊寂靜，古剎蕭疏；苔蘚盈庭，蒿蓁滿徑；惟螢火之飛燈，只蛙聲而代漏。長老忽然吊下淚來。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 152
        "line_end": 152
    "translation_ja": "三蔵が足を運んで近づくと、門は東へ西へ傾き、あちこちが崩れていた。押し開けてみると、胸を痛めずにはいられない。長い廊下は静まり返り、古い寺は荒れ果て、庭には苔が満ち、道にはよもぎや草木が茂っている。飛ぶ蛍だけが灯火の代わりとなり、蛙の声だけが時を知らせる。三蔵は思わず涙を流した。まことに、こんな有様だ。"
    "translation_status": "draft"
  - "id": "xy-ch80-022"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": "殿宇凋零倒塌，廊房寂寞傾頹。斷磚破瓦十餘堆，盡是些歪梁折柱。前後盡生青草，塵埋朽爛香廚。鐘樓崩壞鼓無皮，琉璃香燈破損。佛祖金身沒色，羅漢倒臥東西。觀音淋壞盡成泥，楊柳淨瓶墜地。日內並無僧人，夜間盡宿狐狸。只聽風響吼如雷，都是虎豹藏身之處。四下牆垣皆倒，亦無門扇關居。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      御堂は朽ちて倒れ、廊や部屋は寂しく傾く。
      割れた煉瓦と欠けた瓦が十余りの山をなし、
      どこも歪んだ梁と折れた柱ばかり。
      前も後ろも青草が生え、朽ちた寺の厨房は埃に埋もれる。
      鐘楼は崩れ、太鼓は皮を失い、ガラスの灯明具も壊れている。
      仏祖（ぶっそ）の金色の像は色あせ、羅漢（らかん）は東に西に倒れ伏す。
      観音（かんのん）は雨に打たれてすっかり泥となり、楊柳（ようりゅう）と浄瓶（じょうへい）は地に落ちる。
      昼には僧の姿もなく、夜には狐やむじなが宿るばかり。
      雷のように吼える風の音だけが聞こえ、
      どこも虎や豹の隠れ場となる。
      四方の塀はみな倒れ、住まいを閉ざす扉さえない。
    "translation_status": "draft"

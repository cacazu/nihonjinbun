    "source_text": "卻說那怪綁在樹上，咬牙恨齒道：「幾年家聞人說孫悟空神通廣大，今日見他，果然話不虛傳。那唐僧乃童身修行，一點元陽未泄，正欲拿他去配合，成太乙金仙，不知被此猴識破吾法，將他救去了。若是解了繩，放我下來，隨手捉將去，卻不是我的人兒也？今被他一篇散言碎語帶去，卻又不是勞而無功？等我再叫他兩聲，看是如何。」妖精不動繩索，把幾聲善言善語，用一陣順風，嚶嚶的吹在唐僧耳內。你道叫的甚麼？他叫道：「師父啊，你放著活人的性命還不救，昧心拜佛取何經？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      木に縛られた女の妖怪は、歯を食いしばり、憎々しげにつぶやいた。
      女の妖怪「孫悟空（そんごくう）は神通力（じんつうりき）が大きいと、何年も前から聞いていたが、今日見れば、噂は嘘ではなかった。あの唐僧（とうそう）は童貞のまま修行を続け、元陽（げんよう）を一滴も漏らしていない。捕らえて交わり、太乙金仙（たいいつきんせん）になろうと思っていたのに、あの猿に術を見破られ、助けられてしまった。縄をほどいて下ろしてくれさえすれば、その場でさらって、私のものにできたではないか。それを、あれこれいう言葉に連れていかれて、苦労がすっかり無駄になった。もう二声ほど呼びかけて、どうなるか見てやろう。」
      女の妖怪は縄を動かさぬまま、やさしく殊勝な言葉を、ひと吹きの追い風に乗せ、すすり泣くように三蔵の耳へ送り込んだ。何といったのか。
      女の妖怪「お坊さま、生きている人の命を見捨てて助けもしないのに、良心を偽って仏を拝み、いったい何の経を求めるのです。」

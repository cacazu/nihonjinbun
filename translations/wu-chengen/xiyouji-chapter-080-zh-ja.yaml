    "translation_ja": |-
      第八十回
      若い女は陽を育てようと夫を求め、心猿は師を守って妖邪を見抜く
    "translation_status": "draft"
  - "id": "xy-ch80-002"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說比丘國君臣黎庶送唐僧四眾出城，有二十里之遠，還不肯捨。三藏勉強下輦，乘馬辭別而行，目送者直至望不見蹤影方回。四眾行夠多時，又過了冬殘春盡，看不了野花山樹，景物芳菲。前面又見一座高山峻嶺。三藏心驚，問道：「徒弟，前面高山有路無路？是必小心。」行者笑道：「師父這話，也不像走長路的，卻似個公子王孫，坐井觀天之類。自古道：『山不礙路，路自通山。』何以言有路無路？」三藏道：「雖然是山不礙路，但恐嶮峻之間生怪物，密叢深處出妖精。」八戒道：「放心，放心。這裡來相近極樂不遠，管取太平無事。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、比丘国（びくこく）の王と臣下、民衆は、三蔵（さんぞう）たち四人を城外二十里（り）の先まで送り、それでも別れようとしなかった。三蔵はようやく輦（れん）を降りて馬に乗り、別れを告げて出発した。見送る人々は、その姿が見えなくなってから引き返した。四人が長い旅を続けるうち、冬の残りも過ぎ、春も尽きた。野の花、山の木々は眺め尽くせず、どこも美しく香っていた。前方にまた、高い山と険しい峰が現れた。三蔵は胸騒ぎがして尋ねた。
      三蔵「お前たち、あの高い山に道はあるのだろうか。くれぐれも気をつけなさい。」
      悟空（ごくう）は笑った。
      悟空「お師匠さま、そんなことでは長旅をしてきた人とも思えませんよ。まるで井戸の底から空を眺める、世間知らずのお坊ちゃんじゃありませんか。昔から『山は道を妨げず、道はおのずと山へ通じる』といいます。道があるかないかなんて、どうしておっしゃるのです。」
      三蔵「山が道を妨げないのはそうだが、険しい所には怪物が生まれ、深いやぶには妖怪が出るのが心配なのだ。」
      八戒（はっかい）「大丈夫、大丈夫。ここまで来れば極楽（ごくらく）もすぐ近くです。何事もなく、無事に行けますって。」
    "translation_status": "draft"
  - "id": "xy-ch80-003"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒正說，不覺的到了山腳下。行者取出金箍棒，走上石崖，叫道：「師父，此間乃轉山的路兒，忒好走。快來，快來。」長老只得放懷策馬。沙僧教：「二哥，你把擔子挑一肩兒。」真個八戒接了擔子挑上，沙僧攏著韁繩，老師父穩坐雕鞍，隨行者都奔山崖上大路。但見那山："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      師弟が話しているうちに、いつしか山の麓へ着いた。悟空は金箍棒（きんこぼう）を取り出し、岩の崖へ登って呼んだ。
      悟空「お師匠さま、ここは山腹を回っていく道で、とても歩きやすいですよ。早く、早く！」
      三蔵も気を楽にして、馬を進めることにした。沙悟浄（さごじょう）が頼んだ。
      沙悟浄「八戒兄さん、少し荷を代わってください。」
      八戒は本当に荷を受け取って担いだ。沙悟浄が手綱を取り、三蔵は彫り物を施した鞍にゆったりと座って、みな悟空に従い、山の崖沿いの大きな道へ進んだ。その山はどうかというと、
    "translation_status": "draft"
  - "id": "xy-ch80-004"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": "雲霧籠峰頂，潺湲湧澗中。百花香滿路，萬樹密叢叢。梅青李白，柳綠桃紅。杜鵑啼處春將暮，紫燕呢喃社已終。嵯峨石，翠蓋松。崎嶇嶺道，突兀玲瓏。削壁懸崖峻，薜蘿草木穠。千巖競秀如排戟，萬壑爭流遠浪洪。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      雲と霧が峰の頂を包み、谷川の水はさらさらと湧き流れる。
      百の花の香りが道に満ち、万の木々が密に茂る。
      梅は青く、李は白く、柳は緑、桃は紅。
      ほととぎすの鳴く所、春は暮れようとし、
      黒紫の燕がさえずるころ、春の社日（しゃにち）はもう過ぎた。
      岩は険しくそびえ、松は翠の傘を広げる。
      山道は曲がりくねり、峰は高く突き出て、姿もさまざま。
      削り立つ岩壁と断崖は険しく、蔓や草木がこんもり茂る。
      千の岩が戟（げき）を並べたように美しさを競い、
      万の谷が流れを競って、遠く大波を送り出す。
    "translation_status": "draft"
  - "id": "xy-ch80-005"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老師父緩觀山景，忽聞啼鳥之聲，又起思鄉之念，兜馬叫道：「徒弟！"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      三蔵はゆっくり山の景色を眺めていたが、ふと鳥の声を聞くと、また故郷が恋しくなった。馬を引き回し、呼びかけた。
      三蔵「お前たち！」
    "translation_status": "draft"
  - "id": "xy-ch80-006"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      我自天牌傳旨意，錦屏風下領關文。
      觀燈十五離東土，才與唐王天地分。
      甫能龍虎風雲會，卻又師徒拗馬軍。
      行盡巫山峰十二，何時對子見當今？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 129
        "line_end": 132
    "translation_ja": |-
      三蔵「私は天牌（てんぱい）にも似た天子の札から勅旨（ちょくし）を伝えられ、
      錦の屏風の下で通関の文書をいただいた。
      灯を見る十五日に東土（とうど）を離れ、
      唐王（とうおう）と、天と地ほど隔たってしまった。
      ようやく竜虎が風雲に会うようにめぐり合えたのに、
      今度は師弟の行く手が、拗馬軍（おうばぐん）のように阻まれる。
      巫山（ふざん）の十二の峰をことごとく越えて、
      いつになれば対子（といつ）のように揃って、今の帝にお目にかかれるのか。」
    "translation_status": "draft"
  - "id": "xy-ch80-007"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「師父，你常以思鄉為念，全不似個出家人。放心且走，莫要多憂。古人云：『欲求生富貴，須下死工夫。』」三藏道：「徒弟雖然說得有理，但不知西天路還在那裡哩。」八戒道：「師父，我佛如來捨不得那三藏經，知我們要取去，想是搬了；不然，如何只管不到？」沙僧道：「莫胡談，只管跟著大哥走。只把工夫捱他，終須有個到之之日。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      悟空「お師匠さまはいつも故郷のことばかり気にかけて、まるで出家した人らしくありません。気を楽にして進みましょう。あまり思い悩まないことです。昔の人も『生きて富貴を得たければ、死ぬ気で励まねばならぬ』といっています。」
      三蔵「お前のいうことはもっともだが、西天（さいてん）への道は、まだどこまで続くのだろう。」
      八戒「お師匠さま、仏さまの如来（にょらい）は三蔵経（さんぞうきょう）を手放すのが惜しいんですよ。俺たちが取りに来ると知って、引っ越したんじゃありませんか。でなきゃ、どうしていつまでも着かないんです？」
      沙悟浄「でたらめを言わず、兄さんについて進みましょう。ひたすら手間をかけて進んでいれば、いつかは着く日も来ます。」
    "translation_status": "draft"
  - "id": "xy-ch80-008"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒正自閑敘，又見一派黑松大林。唐僧害怕，又叫道：「悟空，我們才過了那崎嶇山路，怎麼又遇這個深黑松林？是必在意。」行者道：「怕他怎的？」三藏道：「說那裡話？『不信直中直，須防仁不仁。』我也與你走過好幾處松林，不似這林深遠？你看："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      師弟がそんな話をしていると、また黒々とした松の大森林が現れた。三蔵は怖くなり、また声をかけた。
      三蔵「悟空、あの険しい山道をやっと越えたのに、今度はこんな奥深い、暗い松林か。くれぐれも気をつけなさい。」
      悟空「何が怖いんです？」
      三蔵「何をいう。『正直そうでも正直と信じず、慈悲深そうでも慈悲がないかと用心せよ』というだろう。お前といくつもの松林を越えてきたが、これほど深く広い林はなかったのではないか。見なさい。」
    "translation_status": "draft"
  - "id": "xy-ch80-009"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": "東西密擺，南北成行。東西密擺徹雲霄，南北成行侵碧漢。密查荊棘週圍結，蓼卻纏枝上下盤。藤來纏葛，葛去纏藤。藤來纏葛，東西客旅難行；葛去纏藤，南北經商怎進。這林中住半年，那分日月；行數里，不見斗星。你看那背陰之處千般景，向陽之所萬叢花。又有那千年槐，萬載檜，耐寒松，山桃果，野芍藥，旱芙蓉，一攢攢密砌重堆，亂紛紛神仙難畫。又聽得百鳥聲：鸚鵡哨，杜鵑啼；喜鵲穿枝，烏鴉反哺；黃鸝飛舞，百舌調音；鷓鴣鳴，紫燕語；八哥兒學人說話，畫眉郎也會看經。又見那大蟲擺尾，老虎磕牙；多年狐狢妝娘子，日久蒼狼吼振林。就是托塔天王來到此，縱會降妖也失魂。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      三蔵「東西にぎっしりと並び、南北に列をなす。
      東西に並ぶ木々は雲のかなたへ突き抜け、南北に連なる木々は青い天へ迫る。
      密な茨が周りを取り巻き、蔓草が枝に絡み、上下に巻きつく。
      藤は葛に絡み、葛は藤へ巻きつく。
      藤が葛に絡めば、東西を行く旅人は通りにくく、
      葛が藤に巻きつけば、南北を渡る商人はどうして進めよう。
      この林に半年暮らせば、太陽か月かも区別できず、
      数里歩けば、北斗（ほくと）の星も見えはしない。
      ほら、日陰には千もの景色、日向には万の花の茂み。
      千年の槐（えんじゅ）、万年の檜（かい）、寒さに耐える松、山桃の実、野のシャクヤク、陸に咲く芙蓉（ふよう）もある。
      ひと群れ、またひと群れとぎっしり重なり、
      入り乱れる姿は仙人にだって描ききれぬ。
      また聞こえてくる、百の鳥の声。
      オウムは口笛を吹き、ほととぎすは鳴く。
      かささぎは枝を抜け、烏は親へ餌を運ぶ。
      コウライウグイスは飛び舞い、百舌（ひゃくぜつ）は声を調える。
      シャコは鳴き、黒紫の燕は語る。
      ハッカは人の言葉をまね、ガビチョウどのも経を読むことを心得る。
      また見れば、虎が尾を振り、虎が牙を鳴らす。
      年を経た狐やむじなは女に化け、老いた灰色狼は林を震わせて吼える。
      たとえ托塔天王（たくとうてんのう）がここへ来ても、
      妖怪を降せる身ながら、肝をつぶすに違いない。」
    "translation_status": "draft"
  - "id": "xy-ch80-010"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖公然不懼，使鐵棒上前劈開大路，引唐僧徑入深林。逍逍遙遙，行經半日，未見出林之路。唐僧叫道：「徒弟，一向西來，無數的山林崎嶮，幸得此間清雅，一路太平。這林中奇花異卉，其實可人情意。我要在此坐坐：一則歇馬；二則腹中饑了，你去那裡化些齋來我吃。」行者道：「師父請下馬，老孫化齋去來。」那長老果然下了馬，八戒將馬拴在樹上。沙僧歇下行李，取了缽盂，遞與行者。行者道：「師父穩坐，莫要驚怕，我去了就來。」三藏端坐松陰之下，八戒、沙僧卻去尋花覓果閑耍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      悟空はまるで恐れず、鉄の棒で道を切り開いて、三蔵をそのまま林の奥へ導いた。のんびりと半日歩いたが、まだ林を出る道は見つからなかった。三蔵が呼びかけた。
      三蔵「お前たち、西へ来る間、数知れぬ山林の険しい道を通ったが、ここは清らかで静かだし、道中も無事でありがたい。この林の珍しい花や草は、本当に心を楽しませてくれる。ここで少し座りたい。一つには馬を休ませたいし、二つには腹が減った。どこかで食事を托鉢（たくはつ）してきてくれないか。」
      悟空「お師匠さま、馬をお降りください。俺がもらってきます。」
      三蔵は馬を降り、八戒が馬を木につないだ。沙悟浄は荷を下ろし、鉢を取り出して悟空へ渡した。
      悟空「お師匠さまは、落ち着いて座っていてください。怖がらなくて大丈夫。すぐ戻ります。」
      三蔵は松陰に端座し、八戒と沙悟浄は花や果物を探して、のんびり遊びに行った。
    "translation_status": "draft"
  - "id": "xy-ch80-011"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說大聖縱觔斗，到了半空，佇定雲光，回頭觀看，只見松林中祥雲縹緲，瑞靄氤氳。他忽失聲叫道：「好啊！好啊！」你道他叫好做甚？原來誇獎唐僧，說他是金蟬長老轉世，十世修行的好人，所以有此祥瑞罩頭。「若我老孫，方五百年前大鬧天宮之時，雲遊海角，放蕩天涯；聚群精，自稱齊天大聖；降龍伏虎，消了死籍。頭戴著三額金冠，身穿著黃金鎧甲，手執著金箍棒，足踏著步雲履。手下有四萬七千群怪，都稱我做大聖爺爺，著實為人。如今脫卻天災，做小伏低，與你做了徒弟。想師父頭頂上有祥雲瑞靄罩定，徑回東土，必定有些好處，老孫也必定得個正果。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      さて、悟空は宙返りで空へ上がり、雲の光の中にとどまって振り返った。見ると、松林にはめでたい雲が漂い、瑞気が立ちこめている。思わず声を上げた。
      悟空「いいぞ、いいぞ！」
      なぜ「いいぞ」といったのか。これは三蔵を褒めたのだ。金蝉長老（きんせんちょうろう）の生まれ変わりで、十代の生を通じて修行した善人だから、頭上をこうしためでたい気が覆っているというわけだ。
      悟空「俺ときたら、五百年前、天宮（てんきゅう）で大暴れしたころは、雲に乗って海の果てを巡り、天涯で気ままに暮らしていた。妖怪どもを集めて斉天大聖（せいてんたいせい）と名乗り、竜や虎を降し、死者の名簿から名を消した。頭には三額の金冠、身には黄金の鎧、手には金箍棒、足には歩雲履（ほうんり）。四万七千の妖怪を従え、みな俺を大聖（たいせい）さまと呼んだ。まったく、たいした暮らしだったよ。それが今じゃ天の災難を逃れ、腰を低くして、あんたの弟子になっている。お師匠さまの頭を、めでたい雲と瑞気がしっかり覆っているのだから、東土へ帰り着けば、きっとよいことがあるはずだ。俺も必ず、修行の正果（しょうか）を得られるに違いない。」
    "translation_status": "draft"
  - "id": "xy-ch80-012"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正自家這等誇念中間，忽然見林南下有一股子黑氣，骨都都的冒將上來。行者大驚道：「那黑氣裡必定有邪了。我那八戒、沙僧卻不會放甚黑氣。」那大聖在半空中詳察不定。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空がこうして、ひとり褒めそやして思いを巡らせていると、突然、林の南側から一筋の黒い気が、もくもくと立ちのぼった。悟空は大いに驚いた。
      悟空「あの黒い気の中には、必ず邪なものがいる。八戒も沙悟浄も、あんな黒い気は出せないぞ。」
      悟空は空にとどまり、詳しく探りながら、判断を決めかねていた。
    "translation_status": "draft"
  - "id": "xy-ch80-013"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏坐在林中，明心見性，諷念那《摩訶般若波羅密多心經》，忽聽得嚶嚶的叫聲「救人」。三藏大驚道：「善哉，善哉！這等深林裡，有甚麼人叫？想是狼蟲虎豹諕倒的，待我看看。」那長老起身挪步，穿過千年柏，隔起萬年松，附葛攀藤，近前觀之。只見那大樹上綁著一個女子，上半截使葛滕綁在樹上，下半截埋在土裡。長老立定腳，問他一句道：「女菩薩，你有甚事，綁在此間？」咦！分明這廝是個妖怪，長老肉眼凡胎，卻不能認得。那怪見他來問，淚如泉湧。你看他桃腮垂淚，有沉魚落雁之容；星眼含悲，有閉月羞花之貌。長老實不敢近前，又開口問道：「女菩薩，你端的有何罪過？說與貧僧，卻好救你。」那妖精巧語花言，虛情假意，忙忙的答應道：「師父，我家住在貧婆國，離此有二百餘里。父母在堂，十分好善，一生的和親愛友。時遇清明，邀請諸親及本家老小拜掃先塋，一行轎馬，都到了荒郊野外。至塋前，擺開祭祀，剛燒化紙馬，只聞得鑼鳴鼓響，跑出一夥強人，持刀弄杖，喊殺前來，慌得我們魂飛魄散。父母諸親得馬得轎的各自逃了性命；奴奴年幼。跑不動，諕倒在地，被眾強人拐來山內，大大王要做夫人，二大王要做妻室，第三第四個都愛我美色，七八十家一齊爭吵，大家都不忿氣，所以把奴奴綁在林間，眾強人散盤而去。今已五日五夜，看看命盡，不久身亡。不知是那世裡祖宗積德，今日遇著老師父到此。千萬發大慈悲，救我一命，九泉之下，決不忘恩。」說罷，淚下如雨。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"

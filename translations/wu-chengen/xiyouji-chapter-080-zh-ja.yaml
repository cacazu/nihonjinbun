  - "id": "xy-ch80-032"
    "section_id": "chapter-80"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      頭戴左笄絨錦帽，一對銅圈墜耳根。
      身著頗羅毛線服，一雙白眼亮如銀。
      手中搖著播郎鼓，口念番經聽不真。
      三藏原來不認得，這是西方路上喇嘛僧。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 174
        "line_end": 177
    "translation_ja": |-
      頭には毛織りの錦でできた左笄帽（さけいぼう）、両の耳には銅の輪が垂れる。
      身には頗羅（はら）の毛糸の服、二つの白い眼は銀のように輝く。
      手には振り鼓を揺らし、口には異国の経を唱えて、はっきりとは聞き取れない。
      三蔵には、どんな僧なのか分からない。
      これは西方への道にいる、喇嘛僧（らまそう）であった。
    "translation_status": "draft"
  - "id": "xy-ch80-033"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那喇嘛和尚走出門來，看見三藏眉清目秀，額闊頂平，耳垂肩，手過膝，好似羅漢臨凡，十分俊雅。他走上前扯住，滿面笑唏唏的與他捻手捻腳，摸他鼻子，揪他耳朵，以示親近之意。攜至方丈中，行禮畢，卻問：「老師父何來？」三藏道：「弟子乃東土大唐駕下欽差往西方天竺國大雷音寺拜佛取經者。適行至寶方天晚，特奔上剎借宿一宵，明日早行。望垂方便一二。」那和尚笑道：「不當人子，不當人子。我們不是好意要出家的，皆因父母生身，命犯華蓋，家裡養不住，才捨斷了出家。既做了佛門弟子，切莫說脫空之話。」三藏道：「我是老實話。」和尚道：「那東土到西天，有多少路程？路上有山，山中有洞，洞內有精。想你這個單身，又生得嬌嫩，那裡像個取經的？」三藏道：「院主也見得是。貧僧一人，豈能到此？我有三個徒弟，逢山開路，遇水疊橋，保我弟子，所以到得上剎。」那和尚道：「三位高徒何在？」三藏道：「現在山門外伺候。」那和尚慌了道：「師父，你不知我這裡有虎狼、妖賊、鬼怪傷人。白日裡不敢遠出，未經天晚就關了門戶。這早晚還把人放在外邊？」叫：「徒弟，快去請將進來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      その喇嘛僧は門を出ると、三蔵の端正な眉と眼、広い額と平らな頭頂、肩に垂れる耳、膝を越える手を見た。羅漢が人の世へ降りてきたような、まことに優美な姿である。歩み寄って三蔵をつかみ、顔いっぱいに笑みを浮かべ、手足を撫でたり、鼻に触ったり、耳を引っ張ったりして、親しみを示した。方丈（ほうじょう）へ連れていき、礼を交わし終えると尋ねた。
      喇嘛僧「長老、どちらからいらしたのです。」
      三蔵「私は東土、大唐の帝から、西方の天竺国（てんじくこく）にある大雷音寺（だいらいおんじ）へ、仏を拝み、経をいただきに行くよう命じられた者です。この地へ着くと日が暮れましたので、お寺でひと晩の宿を借り、明日早く出ようと、わざわざ参りました。どうか少しばかり、お情けをおかけください。」
      喇嘛僧は笑った。
      喇嘛僧「それはいけない、それはいけない。私たちは、立派な志があって出家したわけではありません。みな両親から生まれたときに、華蓋（かがい）の星に災いされる命を受け、家では養いきれず、世の縁を断って出家したのです。せっかく仏門の弟子となった以上、作り話などしてはいけませんよ。」
      三蔵「本当のことを申し上げています。」
      喇嘛僧「東土から西天まで、どれほどの道のりがあります？　道には山があり、山には洞があり、洞には妖怪がいる。あなたのようにひとりきりで、しかも柔らかな体つきをした方が、どうして経を求める旅人に見えましょう。」
      三蔵「院主のおっしゃることも、もっともです。私ひとりで、どうしてここまで来られましょう。三人の弟子がいて、山に会えば道を開き、水に会えば橋を架け、私を守ってくれるので、このお寺まで来られたのです。」
      喇嘛僧「その三人のお弟子さんは、どちらに？」
      三蔵「今、山門の外で待たせております。」
      喇嘛僧は慌てた。
      喇嘛僧「長老、ここでは虎や狼、妖怪や盗賊、鬼や化け物が人を害するのを、ご存じないのですね。昼でも遠くへは出られず、日が暮れないうちに戸を閉めます。この時刻に、まだ人を外へ置いておられるとは！」
      喇嘛僧「お前たち、早くお迎えに行きなさい。」
    "translation_status": "draft"
  - "id": "xy-ch80-034"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "有兩個小喇嘛兒跑出外去，看見行者，諕了一跌；見了八戒，又是一跌。扒起來往後飛跑，道：「爺爺，造化低了，你的徒弟不見，只有三四個妖怪站在那門首也。」三藏問道：「怎麼模樣？」小和尚道：「一個雷公嘴，一個碓挺嘴，一個青臉獠牙。傍有一個女子，倒是個油頭粉面。」三藏笑道：「你不認得。那三個醜的，是我徒弟。那一個女子，是我打松林裡救命來的。」那喇嘛道：「爺爺呀！這們好俊師父，怎麼尋這般醜徒弟？」三藏道：「他醜自醜，卻俱有用。你快請他進來，若再遲了些兒，那雷公嘴的有些闖禍，不是個人生父母養的，他就打進來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      二人の小喇嘛（しょうらま）が外へ駆けていった。悟空を見ると、驚いて転んだ。八戒を見ると、また転んだ。起き上がって飛ぶように引き返し、いった。
      二人の小喇嘛「長老さま、運が悪うございます。お弟子さんは見当たらず、三、四匹の妖怪が門前に立っているだけです。」
      三蔵「どんな姿です。」
      小喇嘛「一人は雷公（らいこう）のような口、一人は足踏み臼の杵のような口、一人は青い顔に突き出た牙をしています。そばに女が一人いて、そちらは髪を油で整え、顔に白粉を塗っております。」
      三蔵は笑った。
      三蔵「あなたたちには分からないでしょうが、その醜い三人が、私の弟子です。女の方は、私が松林から命を助けて連れてきたのです。」
      喇嘛僧「長老さま、これほど立派なお師匠さまが、どうしてそんな醜いお弟子さんをお探しになったのです？」
      三蔵「醜いのは醜いですが、みな役に立ちます。早く中へ呼んでください。もう少し遅れれば、雷公のような口の者が騒ぎを起こしかねません。人から生まれ、親に育てられた者ではないので、打って押し入ってきますよ。」
    "translation_status": "draft"
  - "id": "xy-ch80-035"
    "section_id": "chapter-80"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那小和尚即忙跑出，戰兢兢的跪下道：「列位老爺，唐老爺請哩。」八戒笑道：「哥啊，他請便罷了，卻這般戰兢兢的，何也？」行者道：「看見我們醜陋害怕。」八戒道：「可是扯淡。我們乃生成的，那個是好要醜哩？」行者道：「把那醜且略收拾收拾。」獃子真個把嘴揣在懷裡，低著頭，牽著馬；沙僧挑著擔；行者在後面拿著棒，轄著那女子：一行進去。穿過了那倒塌房廊，入三層門裡，拴了馬，歇了擔。進方丈中，與喇嘛僧相見，分了坐次。那和尚入裡邊，引出七八十個小喇嘛來，見禮畢，收拾辦齋管待。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch80-1808715"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第080回&oldid=1808715"
        "line_start": 181
        "line_end": 181
    "translation_ja": |-
      小喇嘛は急いで外へ駆け戻り、びくびく震えながら膝をついた。
      小喇嘛「皆さま、唐の長老がお呼びでございます。」
      八戒は笑った。
      八戒「兄貴、呼ぶならそれでいいのに、あんなにびくびくしているのは、どうしてだい。」
      悟空「俺たちの醜い姿を見て、怖くなったのさ。」
      八戒「そりゃばかな話だ。俺たちは生まれつきだぞ。誰が好きこのんで醜くなったもんか。」
      悟空「その醜いところを、少し引っ込めておけよ。」
      八戒は本当に口を懐へ押し込み、うつむいて馬を引いた。沙悟浄は荷を担ぎ、悟空は後ろで棒を持ち、女の妖怪を見張る。こうして一行は中へ入った。崩れた部屋や廊を通り、三つ目の門へ入り、馬をつなぎ、荷を下ろす。方丈へ入って喇嘛僧に会い、席順を決めて座った。喇嘛僧は奥へ入り、七、八十人の小喇嘛を連れてきた。挨拶が済むと、支度を整え、精進の食事を用意して、一行をもてなした。まさに、

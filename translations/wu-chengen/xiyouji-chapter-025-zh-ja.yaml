    "line_end": 126
  "translation_ja": |-
    三蔵、西へ来たりて万寿山（ばんじゅさん）に至り、悟空、草還丹を台なしにする。
    枝は裂け、葉は落ち、仙木の根はあらわとなり、明月と清風は心胆を冷やす。
  "translation_status": "reviewed"
- "id": "xy-ch25-006"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個倒在塵埃，語言顛倒，只叫：「怎的好？怎的好？害了我五莊觀裡的丹頭，斷絕我仙家的苗裔，師父來家，我兩個怎的回話？」明月道：「師兄莫嚷，我們且整了衣冠，莫要驚張了這幾個和尚。這個沒有別人，定是那個毛臉雷公嘴的那廝，他來出神弄法，壞了我們的寶貝。若是與他分說，那廝畢竟抵賴，定要與他相爭；爭起來，就要交手相打，你想我們兩個怎麼敵得過他四個？且不如去哄他一哄，只說果子不少，我們錯數了，轉與他陪個不是。他們的飯已熟了，等他吃飯時，再貼他些兒小菜。他一家拿著一個碗，你卻站在門左，我卻站在門右，撲的把門關倒，把鎖鎖住，將這幾層門都鎖了，不要放他，待師父來家，憑他怎的處置。他又是師父的故人，饒了他，也是師父的人情；不饒他，我們也拿住個賊在，庶幾可以免我等之罪。」清風聞言道：「有理，有理。」"
  "source_languages":

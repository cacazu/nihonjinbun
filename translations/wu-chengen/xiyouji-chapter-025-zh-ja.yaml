    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 128
    "line_end": 128
  "translation_ja": "二人は土ぼこりの中に倒れ、言葉もまとまらず、ただ叫んだ。清風と明月「どうしよう、どうしよう。五荘観（ごそうかん）の丹の源を壊され、仙人の家の命の苗を絶たれてしまった。師匠がお帰りになったら、何と申し上げよう。」明月「兄さん、騒いではいけない。まず身なりを整えて、和尚たちに気づかれないようにしよう。他の誰でもない、毛むくじゃらの顔に雷公（らいこう）のような口をしたあいつが、ひそかに神通力を使って、私たちの宝を壊したに決まっている。問い詰めても、きっとしらを切るから、争わずにはいられない。口論になれば、殴り合いになる。私たち二人で、向こうの四人にかなうと思うかい。それより、ひとまずだまして、実は減っていなかった、数え間違えたと言い、こちらから謝ろう。飯はもう炊けているから、食べるときにおかずも少し添えてやる。一人ずつ碗を持ったら、兄さんは戸の左、私は右に立ち、ぱっと戸を閉めて鍵を掛ける。幾重もの門を全部施錠して逃がさず、師匠のお帰りを待って、ご処分に任せるんだ。あの和尚は師匠の旧友だから、許すにしても師匠が恩を施せる。許さないにしても、私たちが盗人を捕らえておけば、罪を免れられるかもしれない。」清風「もっともだ、もっともだ。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-007"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個強打精神，勉生歡喜，從後園中徑來殿上，對唐僧控背躬身道：「師父，適間言語粗俗，多有衝撞，莫怪，莫怪。」三藏問道：「怎麼說？」清風道：「果子不少，只因樹葉高密，不曾看得明白。才然又去查查，還是原數。」那八戒就趁腳兒蹺道：「你這個童兒，年幼不知事體，就來亂罵，白口咀咒，枉賴了我們也，不當人子。」行者心上明白，口裡不言，心中暗想道：「是謊，是謊。果子已是了了帳，怎的說這般話？想必有起死回生之法。」三藏道：「既如此，盛將飯來，我們吃了去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 129
    "line_end": 129
  "translation_ja": "二人は無理に気を取り直して笑顔を作り、裏の園から殿へ来ると、三蔵に身をかがめて言った。清風と明月「和尚さま、さきほどは言葉が乱暴で、たいへん失礼いたしました。どうぞお許しください。」三蔵「どういうことです。」清風「実は減っておりません。木が高く、葉が密なので、よく見えなかったのです。今また数えましたら、もとの数のままでした。」八戒はすぐにつけ上がった。八戒「この童子ども、年が若くて物事も分からず、いきなり悪口を浴びせ、勝手にのろって、俺たちに濡れ衣を着せたんだな。人のすることじゃない。」悟空は事情を知っていたが、口には出さず、心の中で考えた。悟空「うそだ、うそだ。果実はもうすべておしまいのはずなのに、どうしてこんなことを言う。きっと死んだものを生き返らせる術でもあるのだろう。」三蔵「そういうことなら、飯をよそってきなさい。食べたら出発しよう。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-008"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒便去盛飯，沙僧安放棹椅。二童忙取小菜，卻是些醬瓜、醬茄、糟蘿蔔、醋豆角、醃窩蕖、綽芥菜，共排了七八碟兒，與師徒們吃飯；又提一壺好茶，兩個茶鍾，伺候左右。那師徒四眾卻才拿起碗來，這童兒一邊一個，撲的把門關上，插上一把兩錤銅鎖。八戒笑道：「這童子差了，你這裡風俗不好，卻怎的關了門裡吃飯？」明月道：「正是，正是，好歹吃了飯兒開門。」清風罵道：「我把你這個害饞勞、偷嘴的禿賊！你偷吃了我的仙果，已該一個擅食田園瓜果之罪；卻又把我的仙樹推倒，壞了我五莊觀裡仙根，你還要說嘴哩。若能夠到得西方參佛面，只除是轉背搖車再托生。」三藏聞言，丟下飯碗，把塊石頭放在心上。那童子將那前山門、二山門，通都上了鎖。卻又來正殿門首，惡語惡言，賊前賊後，只罵到天色將晚，才去吃飯。飯畢，歸房去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 130
    "line_end": 130
  "translation_ja": "八戒は飯をよそいに行き、沙悟浄は卓と椅子を整えた。二人の童子は急いで、瓜の味噌漬け、なすの味噌漬け、大根の粕漬け、ささげの酢漬け、ちしゃの塩漬け、ゆでたからし菜など、おかずを七、八皿並べて、一行の食事に添えた。さらに上等な茶を一壺と茶碗二つを持ち、左右に控えた。師弟四人が碗を取り上げたとたん、童子たちは一人ずつ両側から、ぱたんと戸を閉め、二股の銅の錠を掛けた。八戒は笑った。八戒「童子、間違えているぞ。ここの習わしはよくないな。どうして戸を閉めて中で飯を食わせるんだ。」明月「そうです、そうです。とにかく食事が終わったら開けますよ。」清風はののしった。清風「この食い意地の病にかかった、盗み食いの禿げ賊め。仙果を盗み食いしただけでも、他人の畑の瓜や果物を勝手に食べた罪がある。それなのに仙木まで倒し、五荘観の霊妙な根を壊しておいて、まだ減らず口をきくのか。西方（さいほう）へ着いて仏のお顔を拝みたかったら、一度死んで、また揺り籠から生まれ直すほかないぞ。」三蔵は聞くと、飯碗を取り落とし、心に石を載せられたように重くなった。童子たちは山門も二つ目の門もすべて施錠し、また正殿の戸口へ戻ると、盗人、盗人と口汚く罵り続けた。夕暮れになるまでやめず、ようやく食事に行き、食べ終えると部屋へ戻った。"
  "translation_status": "reviewed"

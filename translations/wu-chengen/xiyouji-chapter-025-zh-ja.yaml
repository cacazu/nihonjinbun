- "id": "xy-ch25-004"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那仙童罵夠多時，清風道：「明月，這些和尚也受得氣哩，我們就像罵雞一般，罵了這半會，通沒個招聲，想必他不曾偷吃。倘或樹高葉密，數得不明，不要枉罵了他，我和你再去查查。」明月道：「也說得是。」他兩個果又到園中，只見那樹倒枒開，果無葉落。諕得清風腳軟跌根頭，明月腰酥打骸垢，那兩個魂飛魄散。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 124
    "line_end": 124
  "translation_ja": "さて、仙童たちはさんざん悪口を言い続けた末、清風が言った。清風「明月、この和尚たちはずいぶん我慢強い。鶏に向かってでも言うように、これだけののしったのに、ひと言も返さない。ひょっとすると盗み食いはしていないのかもしれない。木が高く、葉も茂っていて、私たちの数え方が悪かったのなら、むやみに責めてはいけない。もう一度、確かめに行こう。」明月「それもそうだ。」二人はまた園へ行った。すると木は倒れ、枝は裂け、実はなく、葉は落ちていた。清風は驚いて足の力を失い、ひっくり返り、明月は腰が抜けて震えた。二人とも魂が飛び散る思いだった。このことを詠んだ詩がある。"
  "translation_status": "reviewed"

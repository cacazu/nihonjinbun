  "translation_status": "reviewed"
- "id": "xy-ch25-002"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說他兄弟三眾到了殿上，對師父道：「飯將熟了，叫我們怎的？」三藏道：「徒弟，不是問飯。他這觀裡有甚麼人參果，似孩子一般的東西，你們是那一個偷他的吃了？」八戒道：「我老實，不曉得，不曾見。」清風道：「笑的就是他，笑的就是他。」行者喝道：「我老孫生的是這個笑容兒，莫成為你不見了甚麼果子，就不容我笑？」三藏道：「徒弟息怒。我們是出家人，休打誑語，莫吃昧心食。果然吃了他的，陪他個禮罷，何苦這般抵賴？」行者見師父說得有理，他就實說道：「師父，不干我事。是八戒隔壁聽見那兩個道童吃甚麼人參果，他想一個兒嘗新，著老孫去打了三個，我兄弟各人吃了一個。如今吃也吃了，待要怎麼？」明月道：「偷了我四個，這和尚還說不是賊哩。」八戒道：「阿彌陀佛！既是偷了四個，怎麼只拿出三個來分，預先就打起一個偏手？」那獃子倒轉胡嚷。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて、三人の弟子が殿へ上がり、師に言った。三人の弟子「飯はもうすぐ炊き上がります。何のご用ですか。」三蔵（さんぞう）「お前たち、飯のことを聞くのではない。この道観には、人参果（にんじんか）とかいう、子供そっくりのものがあるそうだが、誰が盗んで食べたのだ。」八戒（はっかい）「私は正直者です。何も知りませんし、見てもいません。」清風（せいふう）「あの笑っている者です、あれが犯人です。」悟空（ごくう）はどなった。悟空「俺は生まれつき、こんな笑い顔なんだ。お前の何とかいう実がなくなったからといって、俺は笑ってもいけないのか。」三蔵「悟空、怒るのはよしなさい。私たちは出家の身だ。うそをつかず、良心に背くものを食べてはならない。本当に食べたのなら、おわびしなさい。どうしてそこまでしらを切るのだ。」悟空は師の言うことがもっともだと分かり、正直に話した。悟空「お師匠さま、私のせいではありません。八戒が隣で、二人の道童が人参果とかいうものを食べているのを聞き、一つ味見したくなって、私に三つ取ってこさせたのです。それで兄弟一人一つずつ食べました。もう食べたものを、今さらどうしろというのです。」明月（めいげつ）「四つも盗んでおいて、この和尚はまだ盗人ではないと言うのです。」八戒「阿弥陀仏（あみだぶつ）。四つ盗ったのなら、なぜ三つしか出して分けなかったんだ。先に一つ、余分に取ったのか。」八戒はかえって悟空に向かい、騒ぎ始めた。"
  "translation_status": "reviewed"
- "id": "xy-ch25-003"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二仙童問得是實，越加毀罵。就恨得個大聖鋼牙咬響，火眼睜圓，把條金箍棒揝了又揝，忍了又忍道：「這童子只說當面打人也罷，受他些氣兒。送他個絕後計，教他大家都吃不成。」好行者，把腦後的毫毛拔了一根，吹口仙氣，叫：「變！」變做個假行者，跟定唐僧，陪著悟能、悟淨，忍受著道童嚷罵。他的真身出一個神，縱雲頭，跳將起去，徑到人參園裡，掣金箍棒，往樹上乒乓一下，又使個推山移嶺的神力，把樹一推推倒。可憐葉落枒開根出土，道人斷絕草還丹。那大聖推倒樹，在枝兒上尋果子，那裡得有半個。原來這寶貝遇金而落，他的棒兩頭是金裹的，況鐵又是五金之類，所以敲著就振下來；既下來，又遇土而入。因此上邊再沒一個果子。他道：「好，好，好！大家散火。」他收了鐵棒，徑往前來，把毫毛一抖，收上身來。那些人肉眼凡胎，看不明白。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 122
    "line_end": 122
  "translation_ja": "二人の仙童は盗みが事実だと聞き出して、ますます激しくののしった。悟空は腹を立て、鋼のような歯をかみ鳴らし、火のような目を丸く見開き、金箍棒（きんこぼう）を何度も握りしめ、こらえにこらえながら言った。悟空「この童子どもめ、面と向かって殴るのはよして、この屈辱は受けておこう。その代わり、元も子もなくしてやる。誰一人食べられなくしてやればいい。」悟空は後頭部の毛を一本抜き、仙気を吹きかけて叫んだ。悟空「変われ！」毛は偽の悟空となり、三蔵のそばで八戒と沙悟浄（さごじょう）に並び、道童の罵声に耐え忍んだ。本物の悟空は神通力で身を抜け出させ、雲に乗って跳び上がると、人参果の園へ直行し、金箍棒を振り上げ、木にがつんと一撃を加えた。さらに山を押し、峰を移す神力を使って、一押しで木を倒してしまった。哀れ、葉は落ち、枝は裂け、根は土から抜け出し、道士たちの草還丹（そうかんたん）は絶えたのである。悟空は木を倒してから枝の実を捜したが、半個さえありはしない。この宝は金属に触れれば落ちる。棒の両端には金が巻かれ、鉄もまた五金（ごきん）の一つだから、一打しただけで実は揺すり落とされ、落ちれば土に触れて潜ってしまったのだ。そのため、木には一つも残っていなかった。悟空「よし、よし、よし。これで皆、お開きだ。」鉄棒を納めて前殿へ戻ると、毛をひと振りして身に戻した。そこにいた者たちは凡人の目なので、何が起きたか見分けられなかった。"

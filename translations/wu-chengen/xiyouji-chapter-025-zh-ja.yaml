    "status": "open"
    "message_ja": "「綽芥菜」は湯がいたからし菜、「醃窩蕖」は塩漬けのちしゃと解した。「兩錤銅鎖」は二股の銅の錠としたが、器具の具体的形状は未確認。"
- "id": "xy-ch25-009"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧埋怨行者道：「你這個猴頭，番番撞禍。你偷吃了他的果子，就受他些氣兒，讓他罵幾句便也罷了，怎麼又推倒他的樹？若論這般情由，告起狀來，就是你老子做官，也說不通。」行者道：「師父莫鬧，那童兒都睡去了，只等他睡著了，我們連夜起身。」沙僧道：「哥啊，幾層門都上了鎖，閉得甚緊，如何走麼？」行者笑道：「莫管，莫管，老孫自有法兒。」八戒道：「愁你沒有法兒哩，你一個變，甚麼蟲蛭兒，瞞格子眼裡就飛將出去。只苦了我們不會變的，便在此頂缸受罪哩。」唐僧道：「他若干出這個勾當，不同你我出去啊，我就念起舊話經兒，他卻怎生消受？」八戒聞言，又愁又笑道：「師父，你說的那裡話？我只聽得佛教中有卷《楞嚴經》、《法華經》、《孔雀經》、《觀音經》、《金剛經》，不曾聽見個甚那『舊話兒經』啊。」行者道：「兄弟，你不知道。我頂上戴的這個箍兒，是觀音菩薩賜與我師父的，師父哄我戴了，就如生根的一般，莫想拿得下來，叫做緊箍兒咒，又叫做緊箍兒經。他『舊話兒經』，即此是也。但若念動，我就頭疼，故有這個法兒難我。師父，你莫念，我決不負你，管情大家一齊出去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 131
    "line_end": 131
  "translation_ja": "三蔵は悟空を責めた。三蔵「この猿め、お前はそのたびに災いを引き起こす。実を盗んで食べたのだから、少しは相手の怒りを受け、幾言かの悪口を我慢すればよかった。なぜ木まで倒したのだ。この事情で訴えられたら、たとえお前の父親が裁く役人でも、言い分は通らないよ。」悟空「お師匠さま、そう騒がないでください。童子たちはもう寝に行きました。寝ついたら、今夜のうちに出ましょう。」沙悟浄「兄貴、幾重もの門がみな施錠され、固く閉じられています。どうして出るのです。」悟空は笑った。悟空「心配するな、するな。俺には手がある。」八戒「兄貴に手がないとは思っちゃいない。何か小さな虫に化けて、窓の格子の隙間から飛び出せるだろうさ。困るのは、変身できない俺たちだ。ここで身代わりになって罰を受けるんだろう。」三蔵「そんなことをして、私たちを一緒に連れ出さなければ、あのいつもの経を唱えるまでだ。どうして耐えられよう。」八戒は心配しながらも笑った。八戒「お師匠さま、何というお話です。仏教に『楞厳経（りょうごんきょう）』『法華経（ほけきょう）』『孔雀経（くじゃくきょう）』『観音経（かんのんきょう）』『金剛経（こんごうきょう）』があるのは聞いたことがありますが、『いつもの経』なんてものは聞いたことがありません。」悟空「兄弟、お前は知らんのだ。この頭にはめている輪は、観音菩薩（かんのんぼさつ）がお師匠さまに授けたものだ。お師匠さまにだまされてかぶったら、根を生やしたように外れなくなった。これを締めるのが緊箍児呪（きんこじじゅ）、またの名を緊箍児経（きんこじきょう）だ。お師匠さまの言う『いつもの経』とは、このことさ。唱えられると俺は頭が痛くなる。それで、この術を使って俺を困らせるんだ。お師匠さま、唱えないでください。決して裏切りません。必ず皆で一緒に出ますから。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-010"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說話後，都已天昏，不覺東方月上。行者道：「此時萬籟無聲，冰輪明顯，正好走了去罷。」八戒道：「哥啊，不要搗鬼，門俱鎖閉，往那裡走？」行者道：「你看手段。」把金箍棒捻在手中，使一個「解鎖法」，往門上一指，只聽得突蹡的一聲響，幾層門雙鐄俱落，唿喇的開了門扇。八戒笑道：「好本事，就是叫小爐兒匠使掭子，便也不像這等爽利。」行者道：「這個門兒有甚稀罕，就是南天門，指一指也開了。」卻請師父出了門，上了馬，八戒挑著擔，沙僧攏著馬，徑投西路而去。行者道：「你們且慢行，等老孫去照顧那兩個童兒睡一個月。」三藏道：「徒弟，不可傷他性命；不然，又一個得財傷人的罪了。」行者道：「我曉得。」行者復進去，來到那童兒睡的房門外。他腰裡有帶的瞌睡蟲兒，原來在東天門與增長天王猜枚耍子贏的。他摸出兩個來，瞞窗眼兒彈將進去，徑奔到那童子臉上，鼾鼾沉睡，再莫想得醒。他才拽開雲步，趕上唐僧，順大路一直西奔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 132
    "line_end": 132
  "translation_ja": "話し終えたころにはすっかり暗くなり、いつしか東に月が昇っていた。悟空「今は物音一つなく、月もはっきり出ている。出ていくにはちょうどよい。さあ、行こう。」八戒「兄貴、でたらめを言うな。門は全部鍵が掛かっている。どこから出るんだ。」悟空「俺の腕を見ていろ。」金箍棒を手に持ち、解錠の術を使って戸を指した。すると、がちゃりと音がし、幾重もの門の錠がみな外れ、ばたばたと扉が開いた。八戒は笑った。八戒「大した腕だ。錠前直しの職人に道具を使わせても、こんなにすばやくはいかないぞ。」悟空「こんな門など、何ほどのことがある。南天門（なんてんもん）だって、ひと指しすれば開くさ。」師を門から出して馬に乗せ、八戒が荷を担ぎ、沙悟浄が馬を引いて、西の道へ向かった。悟空「皆はゆっくり行っていてくれ。俺はあの童子二人を、一か月眠らせてくる。」三蔵「お前、命を傷つけてはいけないよ。そんなことをすれば、盗んだうえに人を傷つけた罪まで加わる。」悟空「分かっています。」悟空は引き返し、童子たちの寝室の戸口へ来た。腰には眠り虫を携えていた。かつて東天門（とうてんもん）で増長天王（ぞうちょうてんのう）と数当ての遊びをし、勝って手に入れたものだ。二匹取り出し、窓の格子の隙間からはじき入れると、まっすぐ童子たちの顔へ飛んでいった。二人はいびきをかいて深く眠り、もう目覚めようがない。そこで悟空は雲を踏む足取りを速めて三蔵に追いつき、大道を一路西へ急いだ。"
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那大仙自元始宮散會，領眾小仙出離兜率，徑下瑤天，墜祥雲，早來到萬壽山五莊觀門首。看時，只見觀門大開，地上乾淨。大仙道：「清風、明月，卻也中用。常時節日高三丈，腰也不伸；今日我們不在，他倒肯起早，開門掃地。」眾小仙俱悅。行至殿上，香火全無，人蹤俱寂，那裡有明月、清風。眾仙道：「他兩個想是因我們不在，拐了東西走了。」大仙道：「豈有此理！修仙的人，敢有這般壞心的事？想是昨晚忘卻關門，就去睡了，今早還未醒哩。」眾仙到他房門首看處，真個關著房門，鼾鼾沉睡；任外邊打門亂叫，那裡叫得醒來。眾仙撬開門板，著手扯下床來，也只是不醒。大仙笑道：「好仙童啊，成仙的人，神滿再不思睡，卻怎麼這般困倦？莫不是有人做弄了他也？快取水來。」一童急取水半盞遞與大仙。大仙念動咒語，噀一口水，噴在臉上，隨即解了睡魔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 135
    "line_end": 135
  "translation_ja": "さて、鎮元子（ちんげんし）は元始宮（げんしきゅう）の会が終わると、弟子の仙人たちを連れて兜率（とそつ）を出、きらめく天界を下って、めでたい雲を降ろし、早くも万寿山の五荘観の門前へ戻った。見ると、道観の門は大きく開き、地面はきれいになっている。鎮元子「清風と明月も、なかなか役に立つ。いつもは日が三丈も昇ってなお、寝床から腰も伸ばさぬのに、今日は私たちがいないので、早起きして門を開け、掃除までしている。」弟子たちも喜んだ。しかし殿へ行くと、香の煙もなく、人影も静まり返り、明月も清風もいない。弟子たち「私たちの留守に乗じて、物を持ち逃げしたのではないでしょうか。」鎮元子「そんなことがあるものか。仙道を修める者が、そのような悪心を起こすはずがない。昨夜、門を閉め忘れて寝てしまい、今朝もまだ起きていないのだろう。」弟子たちが寝室の戸口へ行ってみると、確かに戸を閉め、いびきをかいて熟睡していた。外から戸をたたき、いくら叫んでも起きない。戸板をこじ開け、手を掛けて寝台から引きずり下ろしても、まだ目覚めなかった。鎮元子は笑った。鎮元子「困った仙童たちだ。仙人になれば精気が満ち、眠りたいとも思わぬはずなのに、どうしてこうも眠る。誰かに術を掛けられたのではないか。早く水を持ってきなさい。」一人の童子が急いで杯半分の水を持ってきた。鎮元子は呪文を唱え、一口の水を二人の顔へ吹きかけた。すると、たちまち眠りの魔が解けた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "帰還場所は底本に元始宮・兜率とある。前回の上清天・弥羅宮と独自に整合させない。"
- "id": "xy-ch25-013"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人方醒，忽睜睛，抹抹臉，擡頭觀看，認得是仙師與世同君和仙兄等眾。慌得那清風頓首，明月叩頭道：「師父啊，你的故人原是東來的和尚，一夥強盜，十分兇狠。」大仙笑道：「莫驚恐，慢慢的說來。」清風道：「師父啊，當日別後不久，果有個東土唐僧，一行有四個和尚，連馬五口。弟子不敢違了師命，問及來因，將人參果取了兩個奉上。那長老俗眼愚心，不識我們仙家的寶貝。他說是三朝未滿的孩童，再三不吃。是弟子各吃了一個。不期他那手下有三個徒弟，有一個姓孫的，名悟空行者，先偷四個果子吃了。是弟子們向伊理說，實實的言語了幾句。他卻不容，暗自裡弄了個出神的手段。苦啊！……」二童子說到此處，止不住腮邊淚落。眾仙道：「那和尚打你來？」明月道：「不曾打，只是把我們人參樹打倒了。」大仙聞言，更不惱怒，道：「莫哭，莫哭。你不知那姓孫的也是個太乙散仙，也曾大鬧天宮，神通廣大。既然打倒了寶樹，你可認得那些和尚？」清風道：「都認得。」大仙道：「既認得，都跟我來。──眾徒弟們，都收拾下刑具，等我回來打他。」眾仙領命。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 136
    "line_end": 136
  "translation_ja": "二人はようやく目覚め、目を見開いて顔をぬぐい、顔を上げると、師の与世同君（よせいどうくん）こと鎮元子と兄弟子たちだと分かった。清風はあわてて頭を下げ、明月も額を地につけて言った。明月「お師匠さま、ご友人というのは、東から来た和尚の強盗一味で、それは恐ろしい者たちです。」鎮元子は笑った。鎮元子「驚くことはない。ゆっくり話しなさい。」清風「お師匠さま、お発ちになって間もなく、確かに東土（とうど）の唐僧（とうそう）が来ました。一行は和尚が四人、馬を入れて五口です。弟子たちはお言いつけに背くまいと、来られたわけを尋ね、人参果を二つ取って差し上げました。ところが、あの和尚は目も心も俗人で、仙人の宝が分からず、生まれて三日にもならない赤子だと言って、何度勧めても食べませんでした。そこで、私たちが一つずつ食べました。思いがけず、配下の三人の弟子のうち、孫という姓で悟空行者（ごくうぎょうじゃ）という者が、まず四つの実を盗んで食べたのです。私たちは道理を話して、ほんの幾言か、ありのままを言っただけなのに、相手は我慢できず、ひそかに身を抜け出させる術を使って……ああ、何ということでしょう。」ここまで話すと、二人は頬を流れる涙を止められなかった。弟子たち「その和尚に殴られたのか。」明月「殴られはしませんでした。ただ、人参果の木を倒されてしまいました。」鎮元子はそれを聞いても、なお怒らなかった。鎮元子「泣くな、泣くな。お前たちは知らぬだろうが、あの孫という者も太乙散仙（たいいつさんせん）で、天宮で大暴れしたこともあり、神通力はたいしたものだ。宝の木を倒されたというが、その和尚たちの顔は分かるか。」清風「皆、分かります。」鎮元子「分かるなら、二人ともついて来なさい。弟子たちは刑具を整えておけ。戻ったら、あの者たちを打つ。」弟子たちは命を受けた。"
  "translation_status": "reviewed"
- "id": "xy-ch25-014"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大仙與明月、清風縱起祥光，來趕三藏，頃刻間就有千里之遙。大仙在雲端裡向西觀看，不見唐僧。及轉頭向東看時，倒多趕了九百餘里。原來那長老一夜馬不停蹄，只行了一百二十里路；大仙的雲頭，一縱趕過了九百餘里。仙童道：「師父，那路旁樹下坐的是唐僧。」大仙道：「我已見了。你兩個回去安排下繩索，等我自家拿他。」清風、明月先回不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 137
    "line_end": 137
  "translation_ja": "鎮元子は明月と清風を連れてめでたい光に乗り、三蔵を追った。たちまち千里も進み、雲の上から西を見たが、三蔵の姿はない。振り返って東を見ると、九百里余りも追い越していた。三蔵は一晩中馬を止めず進んでも、わずか百二十里しか来ておらず、鎮元子の雲は一跳びで九百里余りも先へ出てしまったのだ。仙童「お師匠さま、道端の木の下に座っているのが唐僧です。」鎮元子「もう見えた。お前たちは帰って縄を用意しておけ。私が自分で捕らえる。」清風と明月は先に帰った。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "千里、九百余里の行き過ぎ、三蔵の百二十里は原文の概数として保持し、計算で訂正しない。"

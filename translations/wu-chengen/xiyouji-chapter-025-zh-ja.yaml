  "source_text": |-
    三藏西臨萬壽山，悟空斷送草還丹。
    枒開葉落仙根露，明月清風心膽寒。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"

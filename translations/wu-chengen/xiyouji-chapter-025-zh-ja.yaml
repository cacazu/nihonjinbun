    "line_end": 139
  "translation_ja": "鎮元子は雲を降ろし、身をひと振りして、諸国を巡る道士に化けた。そのいでたちは、"
  "translation_status": "reviewed"
- "id": "xy-ch25-016"
  "section_id": "chapter-25"
  "kind": "verse"
  "origin": "source"
  "source_text": "穿一領百衲袍，繫一條呂公絛。手搖麈尾，漁鼓輕敲。三耳草鞋登腳下，九陽巾子把頭包。飄飄風滿袖，口唱月兒高。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 141
    "line_end": 141
  "translation_ja": "継ぎはぎの百衲袍（ひゃくのうほう）をまとい、呂公絛（りょこうとう）を腰に結ぶ。手には麈尾（しゅび）を振り、漁鼓（ぎょこ）を軽くたたく。足には三つの輪のある草履、頭には九陽巾（きゅうようきん）を巻く。袖いっぱいに風をはらませ、口には「月児高（げつじこう）」を歌う。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三耳草鞋は三つの輪・緒通しを備えた草履と解した。呂公絛・九陽巾の具体的な装束形状には留保がある。"
- "id": "xy-ch25-017"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "徑直來到樹下，對唐僧高叫道：「長老，貧道起手了。」那長老忙忙答禮道：「失瞻，失瞻。」大仙問：「長老是那方來的？為何在途中打坐？」三藏道：「貧僧乃東土大唐差往西天取經者，路過此間，權為一歇。」大仙佯訝道：「長老東來，可曾在荒山經過？」長老道：「不知仙官是何寶山？」大仙道：「萬壽山五莊觀，便是貧道棲止處。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 143
    "line_end": 143
  "translation_ja": "鎮元子はまっすぐ木の下へ来て、三蔵に声を掛けた。鎮元子「和尚さま、道士の私からご挨拶いたします。」三蔵は急いで礼を返した。三蔵「気づきませず、失礼いたしました。」鎮元子「和尚さまは、どちらからおいでです。なぜ道中で座っておられるのですか。」三蔵「私は東土大唐（だいとう）から、西天（さいてん）へ経を取りに遣わされた僧です。ここを通り、ひとまず休んでおります。」鎮元子は意外そうなふりをした。鎮元子「東からおいでなら、私の山をお通りになりませんでしたか。」三蔵「道士さまのお住まいは、どちらの山でしょう。」鎮元子「万寿山の五荘観が、私のすみかです。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-018"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，他心中有物的人，忙答道：「不曾，不曾，我們是打上路來的。」那大仙指定笑道：「我把你這個潑猴！你瞞誰哩？你倒在我觀裡，把我人參果樹打倒，你連夜走在此間，還不招認，遮飾甚麼？不要走，趁早去還我樹來。」那行者聞言，心中惱怒，掣鐵棒，不容分說，望大仙劈頭就打。大仙側身躲過，踏祥光，徑到空中。行者也騰雲，急趕上去。大仙在半空現了本相，你看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 144
    "line_end": 144
  "translation_ja": "悟空は聞くと、やましいことがあるだけに、あわてて答えた。悟空「通っていない、通っていない。俺たちは上の道から来たんだ。」鎮元子は指さして笑った。鎮元子「この不届きな猿め、誰をごまかすつもりだ。私の道観で人参果の木を倒し、夜通し逃げてここまで来ておきながら、まだ認めず、何を取り繕う。逃げるな。早く戻って、私の木を返せ。」悟空は腹を立て、鉄棒を抜くと、問答無用で鎮元子の頭めがけて打ち下ろした。鎮元子は身をそらしてかわし、めでたい光を踏んで空中へ上がった。悟空も雲に乗り、急いで追いかける。鎮元子は空中で本来の姿を現した。そのいでたちは、"
  "translation_status": "reviewed"
- "id": "xy-ch25-019"
  "section_id": "chapter-25"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭戴紫金冠，無憂鶴氅穿。
    履鞋登足下，絲帶束腰間。
    體如童子貌，面似美人顏。
    三鬚飄頷下，鴉翎疊鬢邊。
    相迎行者無兵器，止將玉麈手中撚。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 146
    "line_end": 150
  "translation_ja": |-
    頭には紫金の冠、身には無憂の鶴氅（かくしょう）。
    足には履をはき、腰には絹の帯を結ぶ。
    姿は童子のように若く、顔は美人のように麗しい。
    顎の下には三筋の髭がなびき、鬢には烏の羽のような黒髪が重なる。
    悟空を迎え撃つのに武器はなく、ただ玉の麈尾を手に持つばかり。
  "translation_status": "reviewed"
- "id": "xy-ch25-020"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者沒高沒低的，棍子亂打。大仙把玉麈左遮右擋，奈了他兩三回合。使一個「袖裡乾坤」的手段，在雲端裡把袍袖迎風輕輕的一展，刷地前來，把四僧連馬一袖子籠住。八戒道：「不好了，我們都裝在䌋縺裡了。」行者道：「獃子，不是䌋縺，我們被他籠在衣袖中哩。」八戒道：「這個不打緊，等我一頓釘鈀，築他個窟窿，脫將下去，只說他不小心，籠不牢，吊的了罷。」那獃子使鈀亂築，那裡築得動：手捻著雖然是個軟的，築起來就比鐵還硬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 152
    "line_end": 152
  "translation_ja": "悟空は上も下も構わず、棒をやたらに振り回した。鎮元子は玉の麈尾で左を遮り、右を払い、二、三合受け止めた。それから「袖裏乾坤（しゅうりけんこん）」の術を使い、雲の上で袍の袖を風に向けて軽く広げると、さっと差し出し、四人の僧も馬も、一つの袖の中へ包み込んでしまった。八戒「大変だ、皆、振り分け袋に詰め込まれたぞ。」悟空「間抜け、袋じゃない。あいつの袖に包み込まれたんだ。」八戒「それなら大したことはない。俺が熊手で穴を開けて、下へ抜け出してやる。あいつが不注意で包み損ね、落としたことにしてしまえばいい。」八戒は熊手をやたらに突き立てたが、まるで歯が立たない。手でつまめば柔らかいのに、突けば鉄よりも硬かった。"
  "translation_status": "reviewed"
- "id": "xy-ch25-021"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大仙轉祥雲，徑落五莊觀坐下，叫徒弟拿繩來。眾小仙一一伺候。你看他從袖子裡卻像撮傀儡一般，把唐僧拿出，縛在正殿簷柱上。又拿出他三個，每一根柱上綁了一個。將馬也拿出拴在庭下，與他些草料。行李拋在廊下。又道：「徒弟，這和尚是出家人，不可用刀槍，不可加鈇鉞。且與我取出皮鞭來，打他一頓，與我人參果出氣。」眾仙即忙取出一條鞭，──不是甚麼牛皮、羊皮、麂皮、犢皮的，原來是龍皮做的七星鞭，著水浸在那裡。令一個有力量的小仙，把鞭執定道：「師父，先打那個？」大仙道：「唐三藏做大不尊，先打他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 153
    "line_end": 153
  "translation_ja": "鎮元子は雲を返して五荘観へ下り、腰を下ろして、弟子に縄を持ってこさせた。弟子の仙人たちは、一つ一つ言いつけに従った。鎮元子は袖の中から、操り人形をつまみ出すように三蔵を取り出し、正殿の軒柱に縛らせた。続いて三人の弟子を取り出し、それぞれ一本ずつ柱に縛った。馬も出して庭につなぎ、草と飼い葉を与え、荷物は廊下へ投げた。鎮元子「弟子たち、この和尚たちは出家の身だから、刀や槍、斧や鉞を用いてはいけない。ひとまず革の鞭を持ってきて打ち、人参果の恨みを晴らしてやろう。」弟子たちは急いで一本の鞭を持ってきた。牛革でも羊革でも、麂の革でも子牛の革でもない。竜の皮で作った七星鞭（しちせいべん）で、水に浸してあったものだ。力の強い弟子が命じられて鞭を握り、尋ねた。鞭を持つ弟子「お師匠さま、誰から打ちますか。」鎮元子「唐三蔵（とうさんぞう）は年長者のくせに、立場にふさわしい振る舞いがない。まずあの者を打て。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-022"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，心中暗道：「我那老和尚不禁打，假若一頓鞭打壞了啊，卻不是我造的孽？」他忍不住，開言道：「先生差了。偷果子是我，吃果子是我，推倒樹也是我，怎麼不先打我，打他做甚？」大仙笑道：「這潑猴倒言語膂烈。這等便先打他。」小仙問：「打多少？」大仙道：「照依果數，打三十鞭。」那小仙掄鞭就打。行者恐仙家法大，睜圓眼瞅定，看他打那裡。原來打腿，行者就把腰扭一扭，叫聲：「變！」變作兩條熟鐵腿，看他怎麼打。那小仙一下一下的打了三十，天早向午了。大仙又吩咐道：「還該打三藏訓教不嚴，縱放頑徒撒潑。」那仙又掄鞭來打。行者道：「先生又差了。偷果子時，我師父不知，他在殿上與你二童講話，是我兄弟們做的勾當。縱是有教訓不嚴之罪，我為弟子的也當替打，再打我罷。」大仙道：「這潑猴，雖是狡猾奸頑，卻倒也有些孝意。既這等，還打他罷。」小仙又打了三十。行者低頭看看，兩隻腿似明鏡一般，通打亮了，更不知些疼癢。此時天色將晚，大仙道：「且把鞭子浸在水裡，待明朝再拷打他。」小仙且收鞭去浸，各各歸房。晚齋已畢，盡皆安寢不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 154
    "line_end": 154
  "translation_ja": "悟空は聞くと、心の中で考えた。悟空「お師匠さまは鞭には耐えられない。もし打たれて体を壊したら、俺が罪を作ることになるではないか。」こらえきれず声に出した。悟空「先生、それは違うぞ。実を盗んだのも俺、食べたのも俺、木を倒したのも俺だ。どうして先に俺を打たず、あの人を打つんだ。」鎮元子は笑った。鎮元子「この不届きな猿も、言うことは勇ましい。それなら、まずあの者を打て。」鞭を持つ弟子「何回打ちましょう。」鎮元子「実の数に合わせて三十打だ。」弟子は鞭を振り上げた。悟空は仙人の術が強力かもしれないと警戒し、目を見開いて、どこを打つか見据えた。狙いは脚だった。悟空は腰をひねって叫んだ。悟空「変われ！」両脚を錬鉄に変え、どう打つか見てやろうというのだ。弟子は一つ一つ、三十回打った。もう日は昼に近づいていた。鎮元子はまた命じた。鎮元子「三蔵にも、弟子を厳しく教えず、わんぱく者を野放しにして暴れさせた罰を与えねばならぬ。」弟子はまた鞭を振り上げた。悟空「先生、また間違っている。実を盗んだとき、お師匠さまは知らなかったんだ。殿でお前の二人の童子と話していて、やったのは俺たち兄弟だ。たとえ教え方が甘かった罪があるにしても、弟子の俺が代わって打たれるべきだ。もう一度俺を打て。」鎮元子「この猿はずる賢く、悪知恵があって、頑固だが、師を思う孝心もいくらかある。そのように言うなら、また打ってやれ。」弟子はさらに三十回打った。悟空が下を向いて見ると、両脚は鏡のようにぴかぴかに磨かれていたが、痛くもかゆくもなかった。そのころには夕暮れが近づいていた。鎮元子「ひとまず鞭を水に浸しておけ。明朝また責めるとしよう。」弟子は鞭を片づけて水に浸し、皆それぞれの部屋へ戻った。夕食を済ませると、一同寝静まった。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三十鞭で昼近く、さらに三十鞭で夕暮れになる叙述を底本どおり残す。"
- "id": "xy-ch25-023"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老淚眼雙垂，怨他三個徒弟道：「你等闖出禍來，卻帶累我在此受罪，這是怎的起？」行者道：「且休報怨，打便先打我，你又不曾吃打，倒轉嗟呀怎的？」唐僧道：「雖然不曾打，卻也綁得身上疼哩。」沙僧道：「師父，還有陪綁的在這裡哩。」行者道：「都不要嚷，再停會兒走路。」八戒道：「哥哥又弄虛頭了。這裡麻繩噴水，緊緊的綁著，還比關在殿上，被你使解鎖法搠開門走哩。」行者道：「不是誇口說，那怕他三股的麻繩噴上了水，就是碗粗的棕纜，也只好當秋風。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 155
    "line_end": 155
  "translation_ja": "三蔵は両目に涙をため、三人の弟子を責めた。三蔵「お前たちが騒ぎを起こしたために、私までここで苦しむことになった。いったいどうしたものだろう。」悟空「そう責めないでください。打たれるなら先に私です。お師匠さまはまだ打たれてもいないのに、どうして嘆くのです。」三蔵「打たれなくても、縛られて体が痛いのだよ。」沙悟浄「お師匠さま、ここにも一緒に縛られている者がおります。」悟空「皆、騒ぐな。もう少ししたら出発だ。」八戒「兄貴はまた口先だけだ。水を掛けた麻縄で、きつく縛られているんだぞ。殿に閉じ込められ、解錠の術で門を開けて逃げたときとは違う。」悟空「ほらを吹くのではない。三つ撚りの麻縄に水を掛けたくらい何でもない。たとえ碗ほど太い棕櫚縄だって、俺には秋風ほどにも感じられんさ。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-024"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正話處，早已萬籟無聲，正是天街人靜。好行者，把身子小一小，脫下索來道：「師父去啞。」沙僧慌了道：「哥哥，也救我們一救。」行者道：「悄言，悄言。」他卻解了三藏，放下八戒、沙僧，整束了褊衫，扣背了馬匹，廊下拿了行李，一齊出了觀門。又教八戒：「你去把那崖邊柳樹伐四顆來。」八戒道：「要他怎的？」行者道：「有用處，快快取來。」那獃子有些夯力，走了去，一嘴一顆，就拱了四顆，一抱抱來。行者將枝梢折了，教兄弟二人復進去，將原繩照舊綁在柱上。那大聖念動咒語，咬破舌尖，將血噴在樹上，叫：「變！」一根變作長老，一根變作自身，那兩根變作沙僧、八戒；都變得容貌一般，相貌皆同，問他也就說話，叫名也就答應。他兩個卻才放開步，趕上師父。這一夜依舊馬不停蹄，躲離了五莊觀。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 156
    "line_end": 156
  "translation_ja": "話しているうちに、あたりはすっかり物音が絶え、人も寝静まった。悟空は体を少し小さくして縄を抜けた。悟空「お師匠さま、行きましょう。」沙悟浄はあわてた。沙悟浄「兄貴、私たちも助けてください。」悟空「静かに、静かに。」三蔵の縄を解き、八戒と沙悟浄も放し、僧衣を整え、馬に鞍を置き、廊下の荷を取って、皆で道観の門を出た。そこで八戒に命じた。悟空「あの崖のそばの柳を四本切ってこい。」八戒「何に使うんだ。」悟空「使い道がある。早く取ってこい。」八戒には強い力がある。行くと、鼻先で一本ずつ、四本の柳を掘り起こし、ひと抱えに抱えて持ってきた。悟空は枝先を折り取り、二人の弟弟子に、もう一度中へ入って、元の縄で柱に縛りつけるように言った。それから呪文を唱え、舌先をかんで血を木に吹きかけ、叫んだ。悟空「変われ！」一本は三蔵、一本は自分、残る二本は沙悟浄と八戒になった。どれも姿形がそっくりで、問えば話し、名を呼べば返事もする。そこで二人は歩を速めて師に追いついた。その夜も馬を休めず進み、五荘観から逃げ去った。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「他兩個」は直前の二人の弟弟子を受けると読み「二人」とした。悟空が同行しないことを意味すると断定しない。"
- "id": "xy-ch25-025"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只是到天明，那長老在馬上搖樁打盹。行者見了，叫道：「師父不濟，出家人怎的這般辛苦？我老孫千夜不眠，也不曉得些困倦。且下馬來，莫教走路的人看見笑你，權在山坡下藏風聚氣處歇歇再走。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 158
    "line_end": 158
  "translation_ja": "ただ、夜が明けると、三蔵は馬上で体を揺らしながら居眠りを始めた。悟空は見て呼びかけた。悟空「お師匠さま、頼りないですね。出家の方が、どうしてそんなにお疲れなのです。私は千晩眠らなくても、少しも眠いとは思いません。ひとまず馬を下りてください。道を行く人に見られて笑われないよう、山の斜面の下、風を避けて気を養える場所で、休んでから進みましょう。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-026"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不說他師徒在路暫住。且說那大仙天明起來，吃了早齋，出在殿上，教：「拿鞭來，今日卻該打唐三藏了。」那小仙掄著鞭，望唐僧道：「打你哩。」那柳樹也應道：「打麼。」乒乓打了三十。掄過鞭來，對八戒道：「打你哩。」那柳樹也應道：「打麼。」及打沙僧，也應道教打。及打到行者，那行者在路，偶然打個寒噤道：「不好了！」三藏問道：「怎麼說？」行者道：「我將四顆柳樹變作我師徒四眾，我只說他昨日打了我兩頓，今日想不打了，卻又打我的化身，所以我真身打噤。收了法罷。」那行者慌忙念咒收法。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 159
    "line_end": 159
  "translation_ja": "一行が道中でしばし休んだ話は措く。さて、鎮元子は夜明けに起き、朝食を取って殿へ出た。鎮元子「鞭を持ってこい。今日は唐三蔵を打つ番だ。」弟子は鞭を振り上げ、三蔵に向かって言った。鞭を持つ弟子「お前を打つぞ。」三蔵に化けた柳「打ちなさい。」ばしばしと三十回打った。それから鞭を振り向け、八戒に言った。鞭を持つ弟子「お前を打つぞ。」八戒に化けた柳「打てばいい。」沙悟浄を打とうとしたときも、柳は打てと答えた。悟空を打つ番になると、道中の本物の悟空が、ふいにぶるりと身震いした。悟空「まずいぞ。」三蔵「どうしたのだ。」悟空「四本の柳を、私たち師弟四人に化けさせておいたのです。昨日、私を二度打ったので、今日はもう打たぬと思ったのに、また私の身代わりを打っている。それで本物の私が震えたのです。術を解きましょう。」悟空はあわてて呪文を唱え、術を解いた。"
  "translation_status": "reviewed"
- "id": "xy-ch25-027"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那些道童害怕，丟了皮鞭，報道：「師父啊，為頭打的是大唐和尚，這一會打的都是柳樹之根。」大仙聞言，呵呵冷笑，誇不盡道：「孫行者，真是一個好猴王。曾聞他大鬧天宮，佈地網天羅，拿他不住，果有此理。──你走了便也罷，卻怎麼綁些柳樹在此冒名頂替？決莫饒他，趕去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 161
    "line_end": 161
  "translation_ja": "すると道童たちは驚いて革の鞭を放り出し、報告した。弟子たち「お師匠さま、初めに打ったときは大唐の和尚だったのに、今は全部、柳の根株になっています。」鎮元子は聞くと、はははと冷ややかに笑い、しきりに感心した。鎮元子「孫行者（そんぎょうじゃ）は、まったく大した猿の王だ。天宮で大暴れし、地にも天にも網を張ったのに捕まらなかったと聞くが、確かにもっともだ。逃げただけならまだしも、どうして柳を縛って身代わりにしておいた。決して許さぬ。追いかけよう。」"
  "translation_status": "reviewed"
- "id": "xy-ch25-028"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大仙說聲趕，縱起雲頭，往西一望，只見那和尚挑包策馬，正然走路。大仙低落雲頭，叫聲：「孫行者，往那裡走？還我人參樹來。」八戒聽見道：「罷了，對頭又來了。」行者道：「師父，且把善字兒包起，讓我們使些兇惡，一發結果了他，脫身去罷。」唐僧聞言，戰戰兢兢，未曾答應。沙僧掣寶杖，八戒舉釘鈀，大聖使鐵棒，一齊上前，把大仙圍住在空中，亂打亂築。這場惡鬥，有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 162
    "line_end": 162
  "translation_ja": "鎮元子は追うと言うが早いか、雲に乗って西を望んだ。和尚たちは荷を担ぎ、馬に鞭を当て、ちょうど道を進んでいた。鎮元子は雲を低く降ろして呼んだ。鎮元子「孫行者、どこへ行く。人参果の木を返せ。」八戒「やれやれ、敵がまた来たぞ。」悟空「お師匠さま、しばらく慈悲の心はしまっておいてください。私たちに荒っぽい手を使わせて、ひと思いにあいつを始末し、逃げ出しましょう。」三蔵は震え上がり、返事もできなかった。沙悟浄は宝杖を抜き、八戒は熊手を構え、悟空は鉄棒を振るって、一斉に進み出た。三人は空中で鎮元子を囲み、打ち、突きかかった。この激戦を詠んだ詩がある。"
  "translation_status": "reviewed"
- "id": "xy-ch25-029"
  "section_id": "chapter-25"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    悟空不識鎮元仙，與世同君妙更玄。
    三件神兵施猛烈，一根麈尾自飄然。
    左遮右擋隨來往，後架前迎任轉旋。
    夜去朝來難脫體，淹留何日到西天！
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 164
    "line_end": 167
  "translation_ja": |-
    悟空は鎮元仙（ちんげんせん）の力を知らぬ、与世同君の妙術はいっそう奥深い。
    三つの神妙な武器は猛威を振るい、一本の麈尾はひらりと舞うばかり。
    左を遮り、右を防ぎ、寄せ来るままに受け、後ろを払って前を迎え、自在に身をめぐらす。
    夜に逃げても朝には来られ、この身はなかなか抜け出せぬ。足止めされたまま、いつ西天へ着けるのか。
  "translation_status": "reviewed"
- "id": "xy-ch25-030"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兄弟三眾各舉神兵，一齊攻打；那大仙只把蠅帚兒演架。那裡有半個時辰，他將袍袖一展，依然將四僧一馬並行李一袖籠去。返雲頭，又到觀裡，眾仙接著。仙師坐於殿上，卻又在袖兒裡一個個搬出：將唐僧綁在階下矮槐樹上；八戒、沙僧各綁在兩邊樹上；將行者捆倒。行者道：「想是調問哩。」不一時，捆綁停當，教把長頭布取十疋來。行者笑道：「八戒，這先生好意思，拿出布來與我們做中袖哩。減省些兒，做個一口中罷了。」那小仙將家機布搬將出來。大仙道：「把唐三藏、豬八戒、沙和尚都使布裹了。」眾仙一齊上前裹了。行者笑道：「好，好，好，夾活兒就大殮了。」須臾，纏裹已畢。又教拿出漆來。眾仙即忙取了些自收自晒的生熟漆，把他三個渾身布裹漆了，渾身俱裹漆，上留著頭臉在外。八戒道：「先生，上頭倒不打緊，只是下面還留孔兒，我們好出恭。」那大仙又教把大鍋擡出來。行者笑道：「八戒，造化，擡出鍋來，想是煮飯我們吃哩。」八戒道：「也罷了，讓我們吃些飯兒，做個飽死的鬼也好看。」眾仙果擡出一口大鍋支在階下。大仙叫架起乾柴，發起烈火，教：「把清油拗上一鍋，燒得滾了，將孫行者下油鑊炸他一煠，與我人參樹報仇。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 168
    "line_end": 168
  "translation_ja": "兄弟三人はそれぞれ神妙な武器を振るい、一斉に攻めたが、鎮元子はただ払子を操って受け流した。半時もたたぬうちに袍の袖を広げ、また四人の僧と一頭の馬、荷物まで、一袖の中へ包み込んだ。雲を返して道観へ戻ると、弟子たちが迎えた。鎮元子は殿に座り、袖から一人ずつ取り出した。三蔵は階の下の低い槐につなぎ、八戒と沙悟浄はその両側の木に縛り、悟空は縛り倒した。悟空「尋問でもするつもりらしいな。」やがて縛り終えると、長い頭巻き用の布を十匹持ってくるよう命じた。悟空は笑った。悟空「八戒、この先生は親切だぞ。布を出して、俺たちに肌着を作ってくれるらしい。少し節約して、袖のない一枚物にしてもらおうじゃないか。」弟子たちが家で織った布を運び出すと、鎮元子は言った。鎮元子「唐三蔵と猪八戒（ちょはっかい）と沙和尚（さおしょう）を、みな布で巻いてしまえ。」弟子たちは一斉に取り掛かった。悟空は笑った。悟空「よし、よし、よし。生きたまま、葬り支度をしてくれるのか。」たちまち巻き終わると、今度は漆を持ってこさせた。弟子たちは自分たちで採って日干しした生漆と精製した漆を取り出し、三人の全身に巻いた布へ塗りつけた。全身は布と漆で固められ、頭と顔だけが外へ出ていた。八戒「先生、上のほうは構わないが、下には穴を残してくれ。用を足せるようにな。」鎮元子はさらに大鍋を運び出させた。悟空は笑った。悟空「八戒、運がいいぞ。鍋を出すとは、俺たちに飯を炊いてくれるらしい。」八戒「それもいい。飯を少し食わせてもらえば、腹いっぱいで死んだ鬼になれて、格好もつくだろう。」弟子たちは本当に大鍋を階の下へ据えた。鎮元子は乾いた薪を積ませ、火を盛んに燃やして命じた。鎮元子「清い油を鍋いっぱいに注いで、煮立てよ。孫行者を油鍋に入れて揚げ、人参果の木の仇を討つのだ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「長頭布」は長い頭巻き用布と解したが布の規格名の可能性もある。「中袖」は肌着、「一口中」は一口鐘に通じる袖なしの一枚物と解した。「夾活兒」は生きたままと解した。底本を補訂せず、衣服語の解釈を留保する。"
- "id": "xy-ch25-031"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，暗喜道：「正可老孫之意，這一向不曾洗澡，有些兒皮膚燥癢，好歹燙燙，足感盛情。」頃刻間，那油鍋將滾。大聖卻又留心，恐他仙法難參，油鍋裡難做手腳，急回頭四顧，只見那臺下東邊是一座日規臺，西邊是一個石獅子。行者將身一縱，滾到西邊，咬破舌尖，把石獅子噴了一口，叫聲：「變！」變作他本身模樣，也這般捆作一團。他卻出了元神，起在雲端裡，低頭看著道士。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 169
    "line_end": 169
  "translation_ja": "悟空は聞くと、ひそかに喜んだ。悟空「それこそ俺の望むところだ。しばらく風呂に入っていないので、肌が乾いてかゆい。ひとつ湯に浸からせてもらえば、ご厚意には大いに感謝するぞ。」ほどなく油鍋は煮立ちそうになった。しかし悟空はなお注意した。仙人の術は見きわめがたく、油鍋に入ってからでは手が打てないかもしれない。急いで周囲を見まわすと、台の下、東には日時計の台、西には石の獅子があった。悟空は身を跳ねさせ、西側へ転がっていき、舌先をかんで石の獅子へ血を吹きかけ、叫んだ。悟空「変われ！」石の獅子は悟空そっくりになり、同じように丸く縛られていた。悟空自身は元神（げんしん）を抜け出させて雲の上へ昇り、道士たちを見下ろした。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「出了元神」は元神を体外へ出す表現として訳した。変身した石獅子に真の身体が入ったとは補わない。"
- "id": "xy-ch25-032"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那小仙報道：「師父，油鍋滾透了。」大仙教：「把孫行者擡下去。」四個仙童擡不動，八個來也擡不動，又加四個也擡不動。眾仙道：「這猴子戀土難移，小自小，倒也結實。」卻教二十個小仙扛將起來，往鍋裡一摜，烹的響了一聲，濺起些滾油點子，把那小道士們臉上燙了幾個燎漿大泡。只聽得燒火的小童喊道：「鍋漏了，鍋漏了。」說不了，油已漏得罄盡，鍋底打破，原來是一個石獅子放在裡面。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 171
    "line_end": 171
  "translation_ja": "一人の弟子が報告した。弟子「お師匠さま、油が十分に煮立ちました。」鎮元子「孫行者を運び入れろ。」四人の仙童では持ち上がらず、八人でもだめで、さらに四人加わっても動かない。弟子たち「この猿は地面にしがみついて動きません。小さいくせに、ずいぶんがっしりしています。」そこで二十人の弟子で担ぎ上げ、鍋へどさりと投げ込んだ。ぼんと音がして煮えた油がはね、若い道士たちの顔に幾つも大きな水ぶくれを作った。火をたいていた童子が叫んだ。火をたく童子「鍋が漏れた、鍋が漏れた。」言い終わらぬうちに油は残らず流れ出た。鍋の底は割れ、中にあったのは石の獅子だった。"
  "translation_status": "reviewed"
- "id": "xy-ch25-033"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大仙大怒道：「這個潑猴，著然無禮，教他當面做了手腳。你走了便罷，怎麼又搗了我的灶？這潑猴枉自也拿他不住；就拿住他，也似摶砂弄汞，捉影捕風。罷，罷，罷，饒他去罷。且將唐三藏解下，另換新鍋，把他扎一扎，與人參樹報報仇罷。」那小仙真個動手，拆解布漆。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 173
    "line_end": 173
  "translation_ja": "鎮元子は激怒した。鎮元子「この不届きな猿め、まったく無礼だ。目の前で細工をさせてしまった。逃げるだけならまだしも、なぜ私のかまどまで壊す。この猿は捕らえようとしても無駄だ。たとえ捕らえても、砂を握り、水銀をつかみ、影を捕らえ、風を追うようなものだ。もうよい、もうよい、行かせてしまえ。ひとまず唐三蔵を解いて、新しい鍋に取り替え、あの者を揚げて、人参果の木の仇を討とう。」弟子たちは本当に取り掛かり、布と漆を外し始めた。"
  "translation_status": "reviewed"
- "id": "xy-ch25-034"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者在半空裡聽得明白，他想著：「師父不濟，他若到了油鍋裡，一滾就死，二滾就焦，到三五滾他就弄做個稀爛的和尚了。我還去救他一救。」好大聖，按落雲頭，上前叉手道：「莫要拆壞了布漆，扎我師父，還等我來下油鍋罷。」那大仙驚罵道：「我把你這猢猴！怎麼弄手段搗了我的灶？」行者笑道：「你遇著我就該倒灶，干我甚事？我才自也要領你些油湯油水之愛，但只是大小便急了，若在鍋裡開風，恐怕污了你的熟油，不好調菜吃。如今大小便通乾淨了，才好下鍋。不要扎我師父，還來扎我罷。」那大仙聞言，呵呵冷笑，走出殿來，一把扯住。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 174
    "line_end": 174
  "translation_ja": "悟空は空中でその言葉をはっきり聞き、考えた。悟空「お師匠さまは耐えられぬ。油鍋に入ったら、一煮立ちで死に、二煮立ちで焦げ、三つ五つと煮立つころには、和尚のどろどろ煮にされてしまう。戻って助けよう。」悟空は雲を降り、前へ出て両手を組み合わせた。悟空「布と漆を壊して、お師匠さまを揚げることはない。俺が油鍋へ入るまで待ってくれ。」鎮元子は驚いてののしった。鎮元子「この猿め、なぜ小細工で私のかまどを壊した。」悟空は笑った。悟空「俺に会ったからには、かまどが倒れるほどの不運に遭うのも当然さ。俺のせいじゃない。さっきは油の湯だの、油の汁だのというご親切を受けようと思ったが、大小の用が急にしたくなってね。鍋の中で屁でも放って、火の通った油を汚したら、料理に使えなくなるだろう。今は大小ともきれいに済ませたから、鍋へ入れる。お師匠さまを揚げず、俺を揚げてくれ。」鎮元子はそれを聞くと、はははと冷ややかに笑い、殿から出て、悟空をひとつかみにつかんだ。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「倒灶」はかまどが倒れることと、不運に遭うことを掛ける。「油湯油水之愛」のおどけた礼辞と排泄の言い訳を弱めずに訳した。"
- "id": "xy-ch25-035"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知有何話說，端的怎麼脫身，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 176
    "line_end": 176
  "translation_ja": "さて、どんな話があるのか、いったいどうして逃れられるのか。それは次回のお話。"
  "translation_status": "reviewed"

    "message_ja": "東天門で増長天王と数当てをして眠り虫を得たという底本の記述を保持。増長天王の一般的な南方との配当へ変更しない。"
- "id": "xy-ch25-011"
  "section_id": "chapter-25"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一夜馬不停蹄，行到天曉。三藏道：「這個猴頭弄殺我也，你因為嘴，帶累我一夜無眠。」行者道：「不要只管埋怨。天色明了，你且在這路旁邊樹林中將就歇歇，養養精神再走。」那長老只得下馬，倚松根權作禪床坐下；沙僧歇了擔子打盹；八戒枕著石睡覺。孫大聖偏有心腸，你看他跳樹扳枝頑耍。四眾歇息不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch25-1455574"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第025回&oldid=1455574"
    "line_start": 133
    "line_end": 133
  "translation_ja": "その夜は馬の足を一度も止めず、夜明けまで進んだ。三蔵「この猿め、私をひどい目に遭わせる。お前の食い意地のせいで、私は一晩眠れなかった。」悟空「そうお責めにならないでください。もう明るくなりましたから、ひとまず道端の林で休み、元気を取り戻してから進みましょう。」三蔵は仕方なく馬を下り、松の根元を仮の座禅の床として、寄りかかって座った。沙悟浄も荷を下ろしてまどろみ、八戒は石を枕に眠った。悟空だけはのんきなもので、木に跳びつき、枝につかまって遊んでいた。一行が休む話はここまでとする。"
  "translation_status": "reviewed"

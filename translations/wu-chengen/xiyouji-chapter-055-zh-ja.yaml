  "translation_ja": |-
    悟空は頭を抱え、眉を寄せ、顔をしかめて叫んだ。
    悟空「ひどい、ひどい！」
    八戒がそばへ来て尋ねた。
    八戒「兄貴、いいところで戦っていたのに、どうして苦しい苦しいと叫んで逃げてきたんだ？」
    悟空は頭を抱えたまま、叫ぶばかりだった。
    悟空「痛い、痛い、痛い！」
    沙悟浄「頭風（ずふう）の発作でも起きたんですか。」
    悟空は跳び上がった。
    悟空「違う、違う！」
    八戒「兄貴、傷を受けたようにも見えなかったのに、なぜ頭が痛いんだ？」
    悟空はうめきながら言った。
    悟空「とんでもない、とんでもない。あいつと戦っていたら、俺が叉の攻めを破ったのを見て、身をひょいと躍らせたんだ。何の武器だか知らんが、俺の頭を一刺ししやがった。それで、こんなに我慢できないほど痛む。だから逃げてきたのさ。」
    八戒は笑った。
    八戒「こういう静かなところでは、いつも修行で鍛えた頭だと大口をたたくくせに、たった一刺しに耐えられないのか？」
    悟空「そうなんだ。俺の頭は、修行してまことの身となり、蟠桃（ばんとう）や仙酒、老君（ろうくん）の金丹（きんたん）を盗み食いしてからというもの、天宮で大暴れしたときも無事だった。玉帝（ぎょくてい）が大力鬼王（だいりききおう）や二十八宿（にじゅうはっしゅく）に命じて、俺を斗牛宮（とぎゅうきゅう）へ引き立てて斬らせ、神将どもが刀、斧、槌、剣であちこち打っても、雷を落として火で焼いてもな。そのうえ老君が八卦炉（はっけろ）に放り込み、四十九日焼き鍛えたが、少しも傷つかなかった。ところが今日は、あの女が何の武器を使ったのか、この俺の頭を傷つけやがった。」
    沙悟浄「手をどけて、見せてください。皮が破れていませんか。」
    悟空「破れていない、破れていない。」
    八戒「俺が西梁国へ行って、膏薬をもらってきて貼ってやろうか。」
    悟空「腫れてもいないし、皮も破れていない。膏薬なんぞ貼ってどうする。」
    八戒は笑った。
    八戒「兄貴、俺には産前産後の病気は何もなかったのに、そっちが頭のできものにかかっちまったな。」

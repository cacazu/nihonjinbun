  "source_text": "行者抱頭，皺眉苦面，叫聲：「利害！利害！」八戒到跟前問道：「哥哥，你怎麼正戰到好處，卻就叫苦連天的走了？」行者抱著頭，只叫：「疼疼疼。」沙僧道：「想是你頭風發了？」行者跳道：「不是，不是。」八戒道：「哥哥，我不曾見你受傷，卻頭疼，何也？」行者哼哼的道：「了不得，了不得。我與他正然打處，他見我破了他的叉勢，他就把身子一縱，不知是件甚麼兵器，著我頭上扎了一下，就這般頭疼難禁，故此敗了陣來。」八戒笑道：「只這等靜處常誇口，說你的頭是修煉過的。卻怎麼就不禁這一下扎？」行者道：「正是。我這頭，自從修煉成真，盜食了蟠桃仙酒、老子金丹，大鬧天宮時，又被玉帝差大力鬼王、二十八宿，押赴斗牛宮處處斬，那些神將使刀斧鎚劍，雷打火燒；及老子把我安於八卦爐，煅煉四十九日：俱未傷損。今日不知這婦人用的是甚麼兵器，把老孫頭弄傷也。」沙僧道：「你放了手，等我看看，莫破了？」行者道：「不破，不破。」八戒道：「我去西梁國討個膏藥你貼貼。」行者道：「又不瘇不破，怎麼貼得膏藥？」八戒笑道：「哥啊，我的胎前產後病倒不曾有，你倒弄了個腦門癰了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

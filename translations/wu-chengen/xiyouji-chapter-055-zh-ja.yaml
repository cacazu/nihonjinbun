  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者在格子眼聽著兩個言語相攀，恐怕師父亂了真性，忍不住，現了本相，掣鐵棒喝道：「孽畜無禮！」那女怪見了，口噴一道煙光，把花亭子罩住，教：「小的們，收了御弟。」他卻拿一柄三股鋼叉，跳出亭門，罵道：「潑猴憊懶！怎麼敢私入吾家，偷窺我容貌？不要走，吃老娘一叉。」這大聖使鐵棒架住，且戰且退，二人打出洞外。那八戒、沙僧正在石屏前等候，忽見他兩人爭持，慌得八戒將白馬牽過道：「沙僧，你只管看守行李、馬匹，等老豬去幫打幫打。」好獃子，雙手舉鈀，趕上前叫道：「師兄靠後，讓我打這潑賤。」那怪見八戒來，他又使個手段，呼了一聲，鼻中出火，口內生煙，把身子抖了一抖，三股叉飛舞沖迎。那女怪也不知有幾隻手，沒頭沒臉的滾將來。這行者與八戒兩邊攻住。那怪道：「孫悟空，你好不識進退。我便認得你，你是不認得我。你那雷音寺裡佛如來，也還怕我哩。量你這兩個毛人，到得那裡？都上來，一個個仔細看打。」這一場怎見得好戰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    悟空は格子の穴から二人の言葉のやり取りを聞き、師のまことの本性が乱れるのではないかと恐れた。とうとうこらえきれず、元の姿に戻り、鉄棒を抜いて怒鳴った。
    悟空「この畜生、無礼な！」
    女の妖怪は悟空を見ると、一筋の煙を口から吐き、花亭をすっぽり覆って命じた。
    女の妖怪「お前たち、御弟さまを奥へお入れ！」
    自分は三つ又の鋼の叉を手に取り、亭の入口から跳び出して罵った。
    女の妖怪「ふてぶてしい、ろくでなしの猿め！　よくもあたしの家へ忍び込み、あたしの顔を盗み見たね。逃がさないよ。この叉をお受け！」
    悟空は鉄棒で受け止め、戦いながら退いていった。二人は打ち合いながら洞の外へ出た。八戒と沙悟浄は石の屏風の前で待っていたが、二人が争って出てきたので、八戒は慌てて白馬を沙悟浄の方へ引き渡した。
    八戒「沙悟浄、お前は荷物と馬を見ていてくれ。俺が加勢に行く。」
    この八戒、両手で熊手を上げ、駆け寄って叫んだ。
    八戒「兄貴、後ろへ下がってくれ。このあばずれは俺が打ちのめす！」
    女の妖怪は八戒が来ると、さらに術を使った。ふっと吹き、鼻から火を、口から煙を出し、体を一つ震わせて、三つ又の叉を振り回しながら突っ込んできた。何本の手があるのか分からぬほど、頭も顔もかまわず襲いかかる。悟空と八戒は左右から攻め立てた。
    女の妖怪「孫悟空（そんごくう）、引き際というものを知らないね。あたしはお前を知っているけれど、お前はあたしを知らないだろう。お前たちの雷音寺（らいおんじ）の仏、如来（にょらい）だって、あたしを怖がるんだよ。お前ら毛むくじゃらの二人に、どれほどのことができるものか。二人とも来るがいい。一人ずつ、打ち据えてやるから気をつけな！」
    さて、この見事な戦いはどのようであったか。
  "translation_status": "reviewed"
- "id": "xy-ch55-010"
  "section_id": "chapter-55"
  "kind": "verse"
  "origin": "source"
  "source_text": "女怪威風長，猴王氣概興。天蓬元帥爭功績，亂舉釘鈀要顯能。那一個手多叉緊煙光繞，這兩個性急兵強霧氣騰。女怪只因求配偶，男僧怎肯泄元精。陰陽不對相持鬥，各逞雄才恨苦爭。陰靜養榮思動動，陽收息衛愛清清。致令兩處無和睦，叉鈀鐵棒賭輸贏。這個棒有力，鈀更能，女怪鋼叉丁對丁。毒敵山前三不讓，琵琶洞外兩無情。那一個喜得唐僧諧鳳侶，這兩個必隨長老取真經。驚天動地來相戰，只殺得日月無光星斗更。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    女の妖怪の威勢は増し、猿王（えんおう）の気概は高まる。
    天蓬元帥（てんぽうげんすい）も手柄を競い、熊手を乱れ振って力を示す。
    あちらは手が多く、叉の攻めは激しく、煙の光に包まれ、
    こちらの二人は気が急き、武器は強く、霧の気が立ち昇る。
    女の妖怪はただ夫を求めるが、
    男の僧が、どうして元精（げんせい）を漏らそうか。
    陰と陽は折り合わず、向かい合って戦い、
    互いに雄々しい力を振るい、恨んで激しく争う。
    陰は静かに営気（えいき）を養いながら、動いて動いてと願い、
    陽は息を収めて衛気（えき）を守り、清らかに清らかにと望む。
    こうして二方は和らぐことなく、
    叉と熊手と鉄棒で、勝ち負けを争った。
    この棒には力があり、熊手もまた優れ、
    女の妖怪の鋼の叉と、丁々とぶつかり合う。
    毒敵山の前で三者は譲らず、
    琵琶洞の外、両陣営に情けはない。
    あちらは三蔵を得て、鳳凰（ほうおう）のような夫婦になる喜びを求め、
    こちらの二人は必ず師に従い、まことの経を取りに行こうとする。
    天を驚かし地を揺るがして戦い続け、
    日月は光を失い、星の運行さえ変わるほどだった。
  "translation_status": "reviewed"
- "id": "xy-ch55-011"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三個戰鬥多時，不分勝負。那女怪將身一縱，使出個倒馬毒樁，不覺的把大聖頭皮上扎了一下。行者叫聲：「苦啊！」忍耐不得，負痛敗陣而走。八戒見事不諧，拖著鈀撤身而退。那怪得了勝，收了鋼叉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    三人は長い間戦ったが、勝敗がつかない。女の妖怪が身を躍らせ、倒馬毒樁（とうばどくとう）を繰り出すと、悟空の気づかぬ間に頭皮をちくりと刺した。
    悟空「うわっ、たまらん！」
    痛みにこらえきれず、悟空は敗れて逃げ出した。八戒も形勢が悪いと見て、熊手を引きずって退いた。女の妖怪は勝ちを収め、鋼の叉をしまった。
  "translation_status": "reviewed"
- "id": "xy-ch55-012"

  "source_text": "沙僧道：「二哥且休取笑。如今天色晚矣，大哥傷了頭，師父又不知死活，怎的是好？」行者哼道：「師父沒事。我進去時，變作蜜蜂兒，飛入裡面，見那婦人坐在花亭子上。少頃，兩個丫鬟捧兩盤饝饝：一盤是人肉餡，葷的；一盤是鄧沙餡，素的。又著兩個女童扶師父出來吃一個壓驚，又要與師父做甚麼道伴兒。師父始初不與那婦人答話，也不吃饝饝。後見他甜言美語，不知怎麼，就開口說話，卻說吃素的。那婦人就將一個素的劈開，遞與師父。師父將個囫圇葷的遞與那婦人。婦人道：『怎不劈破？』師父道：『出家人不敢破葷。』那婦人道：『既不破葷，前日怎麼在子母河邊飲水高，今日又好吃鄧沙餡？』師父不解其意，答他兩句道：『水高船去急，沙陷馬行遲。』我在格子上聽見，恐怕師父亂性，便就現了原身，掣棒就打。他也使神通，噴出煙霧，叫『收了御弟』，就掄鋼叉，與老孫打出洞來也。」沙僧聽說，咬指道：「這潑賤也不知從那裡就隨將我們來，把上項事情都知道了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"

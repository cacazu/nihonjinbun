    "line_start": 161
    "line_end": 161
  "translation_ja": "悟空は喜んで皆と別れ、光明宮の門へ行った。なるほど誰もいない。引き返そうとすると、向こうに一列の兵士が並び、その後ろから昴日星官が来るのが見えた。星官はまだ、玉帝への拝謁に着る朝服をまとい、全身に金糸が輝いていた。その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch55-031"
  "section_id": "chapter-55"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    冠簪五岳金光彩，笏執山河玉色瓊。
    袍掛七星雲靉靆，腰圍八極寶環明。
    叮噹珮響如敲韻，迅速風聲似擺鈴。
    翠羽扇開來昴宿，天香飄襲滿門庭。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 163
    "line_end": 166
  "translation_ja": |-
    冠には五岳（ごがく）の金の光を挿し、
    手には山河をかたどる美玉の笏（しゃく）を執る。
    袍には七星（しちせい）を掛け、雲がたなびき、
    腰には八極（はっきょく）を巡らせ、宝の環が輝く。
    佩玉はちりんちりんと、調べを打つように鳴り、
    素早く吹く風の音は、鈴を振るように響く。
    翠の羽の扇が開き、昴宿（ぼうしゅく）がやって来れば、
    天上の香りが流れ、門庭いっぱいに満ちる。
  "translation_status": "reviewed"
- "id": "xy-ch55-032"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "前行的兵士看見行者立於光明宮外，急轉身報道：「主公，孫大聖在這裡也。」那星官斂雲霧整束朝衣，停執事分開左右，上前作禮道：「大聖何來？」行者道：「專來拜煩救師父一難。」星官道：「何難？在何地方？」行者道：「在西梁國毒敵山琵琶洞。」星官道：「那山洞有甚妖怪，卻來呼喚小神？」行者道：「觀音菩薩適才顯化，說是一個蝎子精，特舉先生方能治得，因此來請。」星官道：「本欲回奏玉帝，奈大聖至此，又感菩薩舉薦，恐遲誤事，小神不敢請獻茶，且和你去降妖精，卻再來回旨罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    先頭の兵士たちは、悟空が光明宮の外に立っているのを見て、急いで振り返って報告した。
    兵士たち「殿、孫大聖（そんたいせい）がこちらにおいでです。」
    昴日星官は雲霧を収め、朝服を整え、供の列を止めて左右へ分かれさせた。進み出て礼をした。
    昴日星官「大聖、何のご用でしょう。」
    悟空「師の難を一つお救いいただきたく、お願いに参りました。」
    昴日星官「どのような難で、どちらの場所ですか。」
    悟空「西梁国の毒敵山、琵琶洞です。」
    昴日星官「あの山の洞に、どんな妖怪がいるのでしょう。私ごときをお呼びになるとは。」
    悟空「つい先ほど観音菩薩がお姿を現し、蠍の精だとおっしゃいました。あなたでなければ退治できないと、特にお勧めくださったので、お迎えに来たのです。」
    昴日星官「これから玉帝に復命するつもりでしたが、大聖がお越しになり、菩薩からもお勧めをいただいては、遅れて事を損なってはなりません。お茶を差し上げることも控え、まずあなたと一緒に妖怪を降伏させに行き、その後で復命することにしましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch55-033"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖聞言，即同出東天門，直至西梁國，望見毒敵山不遠，行者指道：「此山便是。」星官按下雲頭，同行者至石屏前山坡之下。沙僧見了道：「二哥起來，大哥請得星官來了。」那獃子還侮著嘴道：「恕罪，恕罪。有病在身，不能行禮。」星官道：「你是個修行之人，何病之有？」八戒道：「早間與那妖精交戰，被他著我唇上扎了一下，至今還疼哩。」星官道：「你上來，我與你醫治醫治。」獃子才放了手，口裡哼哼唧唧道：「千萬治治，待好了謝你。」那星官用手把嘴唇上摸了一摸，吹一口氣，就不疼了。獃子歡喜下拜道：「妙啊！妙啊！」行者笑道：「煩星官也把我頭上摸摸。」星官道：「你未遭毒，摸他何為？」行者道：「昨日也曾遭過，只是過了夜，才不疼。如今還有些麻癢，只恐發天陰，也煩治治。」星官真個也把頭上摸了一摸，吹口氣，也就解了餘毒，不麻不癢了。八戒發狠道：「哥哥，去打那潑賤去。」星官道：「正是，正是。你兩個叫他出來，等我好降他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    悟空はそれを聞くと、星官とともに東天門を出て、まっすぐ西梁国へ向かった。毒敵山が近くに見えてくると、指さして言った。
    悟空「あの山です。」
    星官は雲を降ろし、悟空とともに石の屏風の前、山の斜面の下へ来た。沙悟浄は見つけると呼びかけた。
    沙悟浄「二番目の兄さん、起きてください。兄さんが星官をお連れしました。」
    八戒はまだ口を押さえていた。
    八戒「失礼します、失礼します。病気をしておりまして、礼もできません。」
    昴日星官「修行をしている身で、何の病気ですか。」
    八戒「今朝、あの妖怪と戦っていたら、唇を一刺しされまして、今も痛むんです。」
    昴日星官「こちらへ来なさい。治してあげましょう。」
    八戒はやっと手を放し、うんうんうめきながら言った。
    八戒「どうか治してください。治ったら、お礼を申し上げます。」
    星官が手で唇をひと撫でし、息を一つ吹きかけると、痛みは消えた。八戒は喜び、ひざまずいた。
    八戒「見事です、見事です！」
    悟空も笑った。
    悟空「星官、どうか私の頭も撫でてください。」
    昴日星官「あなたは毒に当たっていないのに、なぜ撫でるのですか。」
    悟空「昨日、私もやられたのです。ただ、一晩経つと痛まなくなりました。今も少ししびれ、かゆいので、曇りの天気になったらぶり返しはしないかと。どうか治してください。」
    星官は本当に頭もひと撫でし、息を吹きかけた。残っていた毒も抜け、しびれもかゆみも消えた。八戒が勢い込んだ。
    八戒「兄貴、あのあばずれを打ちのめしに行こう！」
    昴日星官「そうです、そうです。二人であいつを呼び出しなさい。私が降伏させましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch55-034"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者與八戒跳上山坡，又至石屏之後。獃子口裡亂罵「手似撈鉤」，一頓釘鈀，把那洞門外壘疊的石塊爬開。闖至一層門，又一釘鈀，將二門築得粉碎。慌得那門裡小妖飛報：「奶奶，那兩個醜男人又把二層門也打破了。」那怪正教解放唐僧，討素茶飯與他吃哩。聽見打破二門，即便跳出花亭子，掄叉來刺八戒；八戒使釘鈀迎架；行者在傍，又使鐵棒來打。那怪趕至身邊，要下毒手；行者與八戒識得方法，回頭就走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    悟空と八戒は山の斜面へ跳び上がり、再び石の屏風の後ろへ行った。八戒は口では悪口をまくし立て、手は引っ掛け鉤のように動かした。熊手を何度も振るい、洞の門の外に積み上げた石を掻きのける。一の門へ押し入ると、もう一度熊手を振るい、二の門を粉々にした。中の小妖怪が仰天し、飛ぶように駆けて報告した。
    小妖怪「おかみさま、あの醜い男二人が、今度は二の門まで壊しました！」
    女の妖怪はちょうど、三蔵の縄を解かせ、精進の茶や飯を用意して食べさせようとしていた。二の門を壊されたと聞くと、すぐ花亭から跳び出し、叉を振り回して八戒を突いた。八戒は熊手で迎え受け、悟空もそばから鉄棒で打ちかかる。妖怪が身近に迫り、毒の手を下そうとしたが、悟空も八戒も、もうそのやり方を知っている。くるりと向き直って逃げ出した。
  "translation_status": "reviewed"
- "id": "xy-ch55-035"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖怪趕過石屏之後，行者叫聲：「昴宿何在？」只見那星官立於山坡之上，現出本相，原來是一隻雙冠子大公雞，昂起頭來，約有六七尺高，對著妖怪叫了一聲。那怪即時就現了本相，原來是個琵琶來大小的一個蝎子精。這星官再叫一聲，那怪渾身酥軟，死在坡前。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    妖怪が石の屏風を回って追いかけてくると、悟空が叫んだ。
    悟空「昴宿、どちらです！」
    星官は山の斜面の上に立っていた。そこで本来の姿を現すと、何と二つの鶏冠を持った、大きな雄鶏だった。頭をもたげると、高さはおよそ六、七尺（しゃく）もある。妖怪に向かって一声鳴いた。妖怪は即座に本来の姿に戻った。琵琶ほどの大きさの蠍の精だった。星官がもう一度鳴くと、妖怪は全身の力が抜け、斜面の前で息絶えた。これを裏づける詩がある。
  "translation_status": "reviewed"
- "id": "xy-ch55-036"
  "section_id": "chapter-55"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    花冠繡頸若團纓，爪硬距長目怒睛。
    踴躍雄威全五德，崢嶸壯勢羨三鳴。
    豈如凡鳥啼茅屋，本是天星顯聖名。
    毒蝎枉修人道行，還原反本見真形。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 173
    "line_end": 176
  "translation_ja": |-
    花のような鶏冠、刺繍のような首は、房飾りを束ねたよう。
    爪は堅く、蹴爪は長く、目を怒らせてにらみつける。
    跳び躍る雄々しい威には五徳（ごとく）が備わり、
    高くそびえる勇ましい勢い、三たび鳴く声も見事なもの。
    どうして茅葺きの家で鳴く、ただの鳥と比べられよう。
    もとより天の星が、聖なる名を示したのだ。
    毒の蠍はむなしく人の修行を重ねたが、
    根本に帰って、まことの姿を現した。
  "translation_status": "reviewed"
- "id": "xy-ch55-037"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒上前，一隻腳屣住那怪的胸背道：「孽畜！今番使不得倒馬毒了。」那怪動也不動，被獃子一頓釘鈀，搗作一團爛醬。那星官復聚金光，駕雲而去。行者與八戒、沙僧朝天拱謝道：「有累，有累。改日赴宮拜酬。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    八戒が進み出て、片足で妖怪の胴を踏み押さえた。
    八戒「この畜生！　今度は倒馬毒も使えまい！」
    妖怪はぴくりとも動かない。それを八戒は熊手で何度も打ち、一塊の肉醤に叩き潰した。星官は再び金色の光を集め、雲に乗って去った。悟空、八戒、沙悟浄は天に向かって手を組み、礼を述べた。
    三人「お手数をおかけしました、お手数をおかけしました。後日、お宮へお礼に伺います。」
  "translation_status": "reviewed"
- "id": "xy-ch55-038"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三人謝畢卻才收拾行李、馬匹，都進洞裡。見那大小丫鬟兩邊跪下，拜道：「爺爺，我們不是妖邪，都是西梁國女人，前者被這妖精攝來的。你師父在後邊香房裡坐著哭哩。」行者聞言，仔細觀看，果然不見妖氣。遂入後邊叫道：「師父。」那唐僧見眾齊來，十分歡喜道：「賢徒，累及你們了。那婦人何如也？」八戒道：「那廝原是個大母蝎子。幸得觀音菩薩指示，大哥去天宮裡請得那昴日星官下降，把那廝收伏。才被老豬築做個泥了，方敢深入於此，得看師父之面。」唐僧謝之不盡。又尋些素米、素麵，安排了飲食，吃了一頓。把那些攝將來的女子趕下山，指與回家之路。點上一把火，把幾間房宇燒毀罄盡。請唐僧上馬，找尋大路西行。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    三人は礼を終えると、荷物と馬をまとめ、そろって洞へ入った。年かさの侍女も若い侍女も、両側にひざまずいて拝んだ。
    侍女たち「お方さま、私たちは妖怪ではございません。皆、西梁国の女です。以前、あの妖怪にさらわれて来たのです。お師匠さまは奥の香の部屋に座って、泣いておいでです。」
    悟空が聞いてよく見ると、なるほど妖気はない。そこで奥へ入り、呼びかけた。
    悟空「お師匠さま。」
    三蔵は皆がそろって来たのを見て、大喜びした。
    三蔵「よい弟子たちよ、お前たちに苦労をかけた。あの女はどうなった？」
    八戒「あいつはもともと、大きな雌の蠍だったのです。幸い観音菩薩のお教えがあり、兄貴が天宮へ行って昴日星官をお連れして、あいつを降伏させてもらいました。それからこの俺が、泥のように叩き潰してやりました。それでようやく奥まで入ることができ、お師匠さまのお顔を拝めたのです。」
    三蔵は尽きぬ礼を述べた。一行はさらに精進の米や麺を捜し、食事を用意して一食を済ませた。さらわれて来た女たちを山から下りさせ、家へ帰る道を教えた。火を一つつけて、幾棟もの建物をすっかり焼き払い、三蔵を馬に乗せると、大道を捜して西へ進んだ。まことに、
  "translation_status": "reviewed"
- "id": "xy-ch55-039"
  "section_id": "chapter-55"
  "kind": "verse"
  "origin": "source"
  "source_text": "割斷塵緣離色相，推乾金海悟禪心。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    俗世の縁を断ち切って、色相（しきそう）を離れ、
    金海（きんかい）を押し干して、禅の心を悟る。
  "translation_status": "reviewed"
- "id": "xy-ch55-040"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知幾年上才得成真，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 183
    "line_end": 183
  "translation_ja": "さて、いったい何年の後に、まことの境地を得るのだろうか。続きは次回のお話で。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-01-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は国の君臣の女たちが跪いたあと「都道」とし、発話中に女王へ「我主」「主公」と呼びかける。訳では跪く女王と、女王へ帰国を勧める女官たちの声を区別した。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-02-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "門の原文は「毒敵山琵琶洞」の六字。読みによる括弧や日本語の語順にかかわらず、字数は原文どおり六とした。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-03-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「投衙」は、蜜蜂が王のもとへ集まる姿を朝参にたとえる表現と解した。「尾利善降蟾」の、蜂がひきがえるを制するという描写も省かず残した。これは詩の生き物観であり、実際の生態を確定する説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-04-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「師父中毒了」は、顔色と涙を見た悟空自身の言葉である。この時点で三蔵が実際に毒に侵されたと、語り手が確認したわけではない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-05-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "饝饝は餡入りの蒸した饅頭として訳した。鄧沙は細かく濾した豆餡。原文の「破葷」は肉を割ることと肉食の禁を破ることを掛け、性の誘いも重ねる。「水高」「鄧沙餡」に対し、三蔵は「水高船去急、沙陷馬行遲」と字面を水の高さ・砂に足を取られることへ返す。食物・水を口にすることと性的な欲望の含みはあるが、細部の掛詞の一義的な解読は留保する。玄奘仏学研究27期の当該箇所の検索取得抜粋も、この対話の版による削除と情色的な含みを論じる。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-06-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「陰靜養榮思動動、陽收息衛愛清清」は、陰陽・営衛という身体観と女の求愛、僧の潔斎を対置する。榮は営に通じると解し、営気・衛気を本文へ示した。動動・清清の反復を残す。細かな構文と修行体系の対応は一義的に確定できず、現代の生理学へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-07-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この名は語り手がここで初めて示す。名称の説明にとどめ、まだ明かされていない武器の形状・由来はここに補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-08-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空が過去の刑罰を語る言葉をそのまま保持した。以前の回で使われる斬妖台などの名称へ、整合のために置き換えない。頭風の問い、腫れても破れてもいないという返答、八戒の産前産後と腫れ物の冗談も、確定した診断にしない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-09-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空が二人の会話を弟たちへ語り直す場面。先のやり取りを再度全て訳した。「師父不解其意」は悟空の説明に含まれる語であり、三蔵の心の状態についての新たな語り手の断定ではない。引用内の女・師の声を悟空の直接発話と取り違えない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-10-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "柳翠翠・月闍黎は、遊女柳翠を月明和尚が導く故事を踏まえると解した。李寿卿『月明和尚度柳翠』の楔子では、柳翠は観音の楊柳が人の世へ下った姿、月明尊者は彼女を教化する羅漢として描かれる。本回の柳翠翠という重ね字と月闍黎という呼称を、別作品の表記へ無断で置き換えない。女の誘いは故事の利用であって、この二人の関係をそのまま恋愛関係だと説明するものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-11-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「我越王因此久埋屍」とする。一方、西施の美に溺れて国を失う故事の王は呉王夫差で、李白「西施」も夫差の国が破れると詠む。訳では越王を呉王へ訂正せず、三蔵の言葉の形を保った。「我」の詳しい働きにも留保がある。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-12-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の猱獅は獅子の一種をいう語と解した。縛られた姿の具体的な形は確定できないため、単に手足の縛り方を言い換えてこの比喩を削除せず、語を残した。この比喩を特定の固有名へ読み替えない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-13-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は悟空の「放放放」と八戒の「浪浪浪」を音の近い反復で掛ける。「放」は放屁を含む罵りの省略と解し、訳でも同じ三回の反復を保った。八戒が三蔵の夜を色事と決めつける冗談であり、実際に交わったという意味ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-14-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "欲望の対象をそばに置いて無事に済むはずがないという反語の諺。八戒の憶測として訳し、三蔵が誘惑に負けた事実へ変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-15-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「四馬攢蹄」は四本の脚を寄せるように両手両足を一緒に縛ること。四頭の馬がそこにいたという意味ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-16-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "南無は帰依の意。大慈大悲、救苦救難、霊感という尊号を含む祈念全体を保持した。悟空が老婆の正体を見破って唱える祈念である。南山路は南の山道と訳し、既出の別の南山と同じ地名だと断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-17-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の字は「左手中拇指」。中拇指はここでは中指と解した。『西遊記』の手指を扱う大学公開論文の検索取得抜粋104頁も、この刺傷を中指の描写として論じる。拇の字だけを根拠に親指と決めず、原文欄はそのまま保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-18-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "鋼の叉が二本の鋏脚であること、刺すものが尾の鉤であること、正体が蠍であることは、ここで観音が初めて説明する。三つ又と二本の対応を現実の形状へ修正せず、説明どおり残した。如来の刺傷と観音自身にも近づけないことも、省かず人物の説明として保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-19-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本では増長天王が東天門の外に登場する。通常の四天王の方角配置や前の回の南天門へ置き換えない。陶・張・辛・鄧はここで元帥と呼ばれ、辛天君・陶天君はそのうち二人の尊称として追う。南天門の同姓天兵や雷部の同姓官将との同一性は、この場面の本文からは立証できない。辞書でも東天門で星官の動静を伝える四元帥という役割に限定し、別人とも断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-20-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冠の五岳、笏の山河、袍の七星、腰の八極をすべて残した。具体的な装飾技法や図柄は本文だけでは確定しないため、材質・形状を必要以上に補わない。昴宿はこの詩では星官を指す呼称。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-21-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文「只恐發天陰」は天候が陰るとぶり返すことを恐れる言葉と解した。悟空の懸念であり、毒の効果について現代的な医学の説明を足したものではない。息を吹いて治す行為も物語どおりに保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-22-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本では「手似撈鉤」が鉤括弧に入るが、「手が鉤のようだ」は動作を描く句と解した。八戒の悪口の内容として不自然に直結させず、口では罵り手では石を掻きのける対照を訳した。引用符を含む原文欄は変更しない。小妖という原文の呼称も保持するが、従者全員の種をここで確定する語釈は付けない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-23-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "昴日星官が双冠の大きな雄鶏であることは、この本相の開示で初めて訳出する。最初の鳴き声で敵の本相が現れ、二度目で死ぬ、という順序を保持した。琵琶ほどという大きさも、種類の新たな名へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-24-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "散文では星官の鳴き声は二回だが、詩は「三鳴」と詠む。詩を二鳴へ変えず、夜明けの鶏鳴を含む称揚表現として保持し、実際に三回鳴いたと散文を補わない。五徳は『新序』などに見える文・武・勇・仁・信で、仏教の別の五徳と混同しない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-25-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "従者たちが西梁国からさらわれた人間だと明かすのは、この発言が初めてで、続いて悟空が妖気のないことを確認する。これ以前のラベル・語釈では、さらわれた人間という身分を先取りしない。"
  "translation_status": "reviewed"
- "id": "xy-ch55-note-26-body"
  "section_id": "chapter-55"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は金海とする。色相を離れ、禅心を悟るという対句から、欲念を断ち尽くす象徴的な海と解したが、金の字の具体的な内丹上の意味は確定しない。情海・苦海など別の字へ訂正せず、金海の語を残した。"
  "translation_status": "reviewed"

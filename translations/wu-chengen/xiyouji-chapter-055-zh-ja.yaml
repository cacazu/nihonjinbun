- "id": "xy-ch55-002"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫大聖與豬八戒正要使法定那些婦女，忽聞得風響處，沙僧嚷鬧，急回頭時，不見了唐僧。行者道：「是甚人來搶師父去了？」沙僧道：「是一個女子，弄陣旋風，把師父攝去也。」行者聞言，唿哨跳在雲端裡，用手搭涼篷，四下裡觀看。只見一陣灰塵，風滾滾，往西北上去了。急回頭叫道：「兄弟們，快駕雲同我趕師父去來。」八戒與沙僧即把行囊捎在馬上，響一聲，都跳在半空裡去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 118
    "line_end": 118
  "translation_ja": |-
    さて、悟空（ごくう）と八戒（はっかい）が女たちを術で動けなくしようとした、そのときのこと。突然、風の鳴る方で沙悟浄（さごじょう）が騒ぎ立てた。急いで振り向くと、三蔵（さんぞう）の姿がない。
    悟空「誰がお師匠さまをさらっていったんだ？」
    沙悟浄「一人の女です。つむじ風を起こして、お師匠さまをさらっていきました。」
    これを聞いた悟空は口笛を吹き、雲の上へ跳び上がった。手をひさしにして四方を見回すと、砂ぼこりが渦を巻き、風に転がされて西北へ去っていく。急いで振り返って呼びかけた。
    悟空「二人とも、早く雲に乗れ。俺と一緒にお師匠さまを追うぞ！」
    八戒と沙悟浄はすぐに荷を馬の背に載せた。一声響くと、そろって空中へ跳び上がった。
  "translation_status": "reviewed"
- "id": "xy-ch55-003"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "慌得那西梁國君臣女輩，跪在塵埃，都道：「是白日飛昇的羅漢，我主不必驚疑。唐御弟也是個有道的禪僧，我們都有眼無珠，錯認了中華男子，枉費了這場神思。請主公上輦回朝也。」女王自覺慚愧，多官都一齊回國不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 120
    "line_end": 120
  "translation_ja": |-
    西梁国（せいりょうこく）の女王と女官たちは仰天し、地面にひざまずいた。女官たちが口々に言った。
    女官たち「あれは白昼に天へ昇る羅漢（らかん）です。陛下、驚き疑うには及びません。唐の御弟（ぎょてい）さまも、道を得た禅僧だったのでございます。私どもには人を見る目がなく、中華（ちゅうか）から来たただの男だと思い違いをして、むなしく気をもんでしまいました。どうぞ御輿にお乗りになり、宮廷へお帰りください。」
    女王も自ら恥じ入り、女官たちとそろって都へ帰った。この話はひとまず置く。
  "translation_status": "reviewed"

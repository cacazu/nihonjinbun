  "source_text": "卻說孫大聖兄弟三人騰空踏霧，望著那陣旋風，一直趕來。前至一座高山，只見灰塵息靜，風頭散了，更不知妖向何方。兄弟們按落雲霧，找路尋訪，忽見一壁廂青石光明，卻似個屏風模樣。三人牽著馬轉過石屏，石屏後有兩扇石門，門上有六個大字，乃是「毒敵山琵琶洞」。八戒無知，上前就使釘鈀築門。行者急止住道：「兄弟莫忙。我們隨旋風趕便趕到這裡，尋了這會，方遇此門，又不知深淺如何。倘不是這個門兒，卻不惹他見怪？你兩個且牽了馬，還轉石屏前立等片時，待老孫進去打聽打聽，察個有無虛實，卻好行事。」沙僧聽說，大喜道：「好好好，正是粗中有細，果然急處從寬。」他二人牽馬回頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、悟空ら三人は空を飛び、霧を踏み、あのつむじ風を目当てにひたすら追いかけた。高い山まで来ると、砂ぼこりは静まり、風も散って、妖怪がどこへ行ったのか分からなくなった。三人は雲を降り、道を捜して歩き回った。ふと片側に、つややかな青石が屏風のように立っているのが見えた。馬を引いてその石の屏風を回ると、後ろに二枚扉の石門があり、上には「毒敵山（どくてきざん）琵琶洞（びわどう）」の大きな六文字が掲げられていた。
    八戒は何も考えず、進み出て熊手で門を打とうとした。悟空が急いで止めた。
    悟空「弟よ、慌てるな。つむじ風を追ってここまで来て、しばらく捜してやっとこの門を見つけたが、中の様子は何も分からん。もしここでなかったら、相手を怒らせるだけじゃないか。二人とも馬を引いて石の屏風の前へ戻り、少し待っていろ。この俺が中へ入って、いるかいないか、何がどうなっているかを探ってくる。そのうえで動けばいい。」
    沙悟浄は喜んで言った。
    沙悟浄「いいですね、いいですね！　大まかに見えて細かいところまで気がつく。急ぐときこそ、ゆっくり構えるものです。」
    二人は馬を引いて引き返した。
  "translation_status": "reviewed"
- "id": "xy-ch55-005"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖顯個神通，捻著訣，念個咒語，搖身一變，變作蜜蜂兒，真個輕巧。你看他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 123
    "line_end": 123
  "translation_ja": "悟空は神通力を使った。指を組み、呪文を唱えて身を揺すると、小さな蜜蜂に変わった。その身軽さといったらない。見よ。"
  "translation_status": "reviewed"
- "id": "xy-ch55-006"
  "section_id": "chapter-55"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    翅薄隨風軟，腰輕映日纖。
    嘴甜曾覓蕊，尾利善降蟾。
    釀蜜功何淺，投衙禮自謙。
    如今施巧計，飛舞入門簷。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 125
    "line_end": 128
  "translation_ja": |-
    薄い羽は風に従って柔らかく、
    軽い腰は日差しに透けて細い。
    甘い口で花のしべを探してきて、
    鋭い尾でひきがえるをも屈服させる。
    蜜を醸す功は、どうして小さかろう。
    王のもとへ集う礼にも、おのずとへりくだる。
    今は巧みな計略を施して、
    ひらひらと門の軒へ飛び込んだ。
  "translation_status": "reviewed"
- "id": "xy-ch55-007"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者自門瑕處鑽將進去，飛過二層門裡。只見正當中花亭子上端坐著一個女妖，左右列幾個彩衣繡服、丫髻兩揫的女童，都歡天喜地，正不知講論甚麼。這行者輕輕的飛上去，釘在那花亭格子上，側耳才聽，又見兩個總角蓬頭女子，捧兩盤熱騰騰的麵食，上亭來道：「奶奶，一盤是人肉餡的葷饝饝，一盤是鄧沙餡的素饝饝。」那女怪笑道：「小的們，攙出唐御弟來。」幾個彩衣繡服的女童走向後房，把唐僧扶出。那師父面黃唇白，眼紅淚滴。行者在暗中嗟嘆道：「師父中毒了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    悟空は門の隙間をくぐり、二の門の内へ飛び込んだ。真ん中の花亭には、女の妖怪がきちんと座っていた。左右には、髪を二つに結い上げ、色鮮やかな刺繍の衣を着た女童が何人か並び、楽しげに何やら話している。悟空はそっと飛び寄り、花亭の格子に止まって耳を澄ませた。そこへ、髪を左右に結った、ほつれ髪の女童が二人、湯気の立つ粉物を二皿捧げて、亭へ上がってきた。
    女童たち「おかみさま、一皿は人肉の餡を入れた肉饅頭、もう一皿は鄧沙（とうさ）の餡を入れた精進饅頭でございます。」
    女の妖怪は笑って言った。
    女の妖怪「お前たち、唐の御弟さまをお連れしなさい。」
    刺繍の衣を着た女童たちが奥の部屋へ行き、三蔵を支えて連れ出した。三蔵は顔が黄色く、唇は白く、目を赤くして涙を流していた。悟空は隠れたまま嘆いた。
    悟空「お師匠さまは毒に当たってしまった。」
  "translation_status": "reviewed"
- "id": "xy-ch55-008"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪走下亭，露春蔥十指纖纖，扯住長老道：「御弟寬心。我這裡雖不是西梁女國的宮殿，不比富貴奢華，其實卻也清閑自在，正好念佛看經。我與你做個道伴兒，真個是百歲和諧也。」三藏不語。那怪道：「且休煩惱。我知你在女國中赴宴之時，不曾進得飲食。這裡葷素麵飯兩盤，憑你受用些兒壓驚。」三藏沉思默想道：「我待不說話，不吃東西，此怪比那女王不同：女王還是人身，行動以禮；此怪乃是妖神，恐為加害，奈何？我三個徒弟不知我困陷在於這裡，倘或加害，卻不枉丟性命？」以心問心，無計所奈，只得強打精神，開口道：「葷的何如？素的何如？」女怪道：「葷的是人肉餡饝饝，素的是鄧沙餡饝饝。」三藏道：「貧僧吃素。」那怪笑道：「女童，看熱茶來，與你家長爺爺吃素饝饝。」一女童果捧著香茶一盞，放在長老面前。那怪將一個素饝饝劈破，遞與三藏。三藏將個葷饝饝囫圇遞與女怪。女怪笑道：「御弟，你怎麼不劈破與我？」三藏合掌道：「我出家人，不敢破葷。」那女怪道：「你出家人不敢破葷，怎麼前日在子母河邊吃水高，今日又好吃鄧沙餡？」三藏道：「水高船去急，沙陷馬行遲。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    女の妖怪は亭を下り、春の葱のように細く白い十本の指を伸ばし、三蔵の手を取った。
    女の妖怪「御弟さま、安心なさいませ。ここは西梁女国（せいりょうじょこく）の宮殿ではありませんから、あの富や贅沢にはかないません。でも、実に静かで気ままに暮らせます。念仏を唱え、経を読むには、もってこいです。あたしとともに道を修める伴侶になれば、百年仲よく暮らせますよ。」
    三蔵は答えない。
    女の妖怪「もうお悩みなさいますな。女国の宴に出たとき、何も召し上がれなかったことは知っています。ここに肉と精進、二皿の粉物がありますから、お好きなものを少し召し上がって、恐ろしかったお気持ちを鎮めてください。」
    三蔵は黙って考え込んだ。
    三蔵の心の声「口もきかず、何も食べずにいようか。だが、この妖怪は女王とは違う。女王は人間で、何をするにも礼を守った。こちらは妖しい魔物だ。私を殺そうとしたら、どうすればよい？　三人の弟子は、私がここに捕らわれていることを知らない。万一、害を加えられたら、むざむざ命を捨てることになるではないか。」
    心の中で自分に問いかけても、どうしようもない。やむなく気を奮い起こして口を開いた。
    三蔵「肉のものと、精進のものは、それぞれどのようなものですか。」
    女の妖怪「肉の方は人肉入りの饅頭、精進の方は鄧沙の餡の饅頭です。」
    三蔵「私は精進のものをいただきます。」
    女の妖怪は笑った。
    女の妖怪「女童、熱いお茶をお持ち。この家の旦那さまに、精進饅頭を召し上がっていただきなさい。」
    女童の一人が香り高い茶を一杯持ってきて、三蔵の前へ置いた。女の妖怪は一つの精進饅頭を二つに割り、三蔵へ差し出した。三蔵は肉饅頭を丸ごと一つ、女の妖怪へ差し出した。
    女の妖怪「御弟さま、どうしてあたしの分は割ってくださらないの？」
    三蔵は合掌した。
    三蔵「私は出家の身、肉を破る、つまり肉食の戒を破るわけにはまいりません。」
    女の妖怪「出家の身で肉食の戒は破れないのに、どうして先日は子母河（しぼか）のほとりで、水かさの高い川の水を飲み、今日はまた鄧沙の餡をお好きになるの？」
    三蔵「水が高ければ船は速く進み、砂に沈めば馬の歩みは遅くなります。」
  "translation_status": "reviewed"
- "id": "xy-ch55-009"

  "origin": "source"
  "source_text": "大聖遂喜，即別他們。至光明宮門首，果是無人，復抽身就走，只見那壁廂有一行兵士擺列，後面星官來了。那星官還穿的是拜駕朝衣，一身金縷。但見他："
  "source_languages":

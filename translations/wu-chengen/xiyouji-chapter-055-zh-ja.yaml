  "kind": "verse"
  "origin": "source"
  "source_text": "目不視惡色，耳不聽淫聲。他把這錦繡嬌容如糞土，金珠美貌若灰塵。一生只愛參禪，半步不離佛地。那裡會惜玉憐香，只曉得修真養性。那女怪活潑潑，春意無邊；這長老死丁丁，禪機有在。一個似軟玉溫香，一個如死灰槁木。那一個展鴛衾，淫興濃濃；這一個束褊衫，丹心耿耿。那個要貼胸交股和鸞鳳，這個要面壁歸山訪達摩。女怪解衣，賣弄他肌香膚膩；唐僧斂衽，緊藏了糙肉粗皮。女怪道：「我枕剩衾閑何不睡？」唐僧道：「我頭光服異怎相陪？」那個道：「我願作前朝柳翠翠。」這個道：「貧僧不是月闍黎。」女怪道：「我美若西施還嬝娜。」唐僧道：「我越王因此久埋屍。」女怪道：「御弟，你記得『寧教花下死，做鬼也風流？』」唐僧道：「我的真陽為至寶，怎肯輕與你這粉骷髏……」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    目は邪な色を見ず、耳は淫らな声を聞かない。
    錦をまとった艶姿を糞土と見なし、
    金玉で飾る美貌を塵や灰と見なす。
    生涯ただ禅を究めることを愛し、
    半歩たりとも仏の境地を離れない。
    美女を愛し、香しい女をいたわることなど知ろうか。
    ただまことの道を修め、本性を養うことを知るばかり。
    女の妖怪は生き生きと、春の欲情に限りがなく、
    この長老は死んだように動かず、禅の機微を胸に保つ。
    一方は柔らかな玉、温かな香りのごとく、
    一方は冷えた灰、枯れ木のごとし。
    あちらは鴛鴦（おしどり）の衾を広げ、淫らな興がいよいよ濃く、
    こちらは褊衫（へんさん）を締め、まごころはいよいよ揺るがない。
    あちらは胸を合わせ、腿を絡め、鸞鳳（らんぽう）のように交わろうとし、
    こちらは壁に向かって坐し、山へ帰って達摩（だるま）を訪ねようとする。
    女の妖怪は衣を解き、香る肌と滑らかな皮膚を見せつけ、
    三蔵は襟を合わせ、粗い肉と荒い肌をきつく隠す。
    女の妖怪「枕は余り、衾は空いているのに、どうして寝てくださらないの？」
    三蔵「私は頭を剃り、衣も俗人とは違う。どうしてあなたのお相手ができよう。」
    女の妖怪「あたしは昔の柳翠翠（りゅうすいすい）になってもいいわ。」
    三蔵「私は月闍黎（げつじゃり）ではありません。」
    女の妖怪「あたしは西施（せいし）ほど美しく、それに、しなやかよ。」
    三蔵「そのために、わが越王（えつおう）はとうに土の下に葬られました。」
    女の妖怪「御弟さま、『花の下なら死んでもよい、鬼になっても色男』という言葉を覚えていらっしゃる？」
    三蔵「私の真陽（しんよう）は、この上ない宝。それをどうして、お前のような白粉を塗った骸骨に、軽々しく与えられよう……。」
  "translation_status": "reviewed"
- "id": "xy-ch55-017"
  "section_id": "chapter-55"

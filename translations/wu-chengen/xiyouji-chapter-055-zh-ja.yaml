  "source_text": "好行者，急忙駕觔斗雲，須臾到東天門外。忽見增長天王當面作禮道：「大聖何往？」行者道：「因保唐僧西方取經，路遇魔障纏身，要到光明宮見昴日星官走走。」忽又見陶、張、辛、鄧四大元帥，也問何往。行者道：「要尋昴日星官去降妖救師。」四元帥道：「星官今早奉玉帝旨意，上觀星臺巡察去了。」行者道：「可有這話？」辛天君道：「小將等與他同下斗牛宮，豈敢說假？」陶天君道：「今已許久，或將回矣。大聖還先去光明宮，如未回，再去觀星臺可也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    悟空は急いで觔斗雲（きんとうん）に乗り、たちまち東天門の外へ着いた。増長天王（ぞうちょうてんのう）が目の前に現れ、礼をした。
    増長天王「大聖（たいせい）、どちらへおいでですか。」
    悟空「三蔵を守って西へ経を取りに行く途中、魔物に付きまとわれましてね。光明宮へ行き、昴日星官にお会いしたいのです。」
    そこへさらに、陶（とう）・張（ちょう）・辛（しん）・鄧（とう）の四大元帥が現れ、やはり行き先を尋ねた。
    悟空「昴日星官にお願いして、妖怪を退治し、師を救っていただきたいのです。」
    四大元帥「星官は今朝、玉帝の仰せを受け、観星台（かんせいだい）へ巡察に出られました。」
    悟空「それは本当ですか？」
    辛天君（しんてんくん）「私どももあの方と一緒に、斗牛宮から下がったのです。どうして嘘など申し上げましょう。」
    陶天君（とうてんくん）「もうずいぶん経ちましたから、お戻りかもしれません。大聖はまず光明宮へおいでなさい。まだお戻りでなければ、観星台へ行かれるとよいでしょう。」
  "translation_status": "reviewed"
- "id": "xy-ch55-030"
  "section_id": "chapter-55"

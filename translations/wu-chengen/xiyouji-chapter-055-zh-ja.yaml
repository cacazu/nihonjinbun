  "translation_ja": |-
    沙悟浄「二番目の兄さん、からかうのはやめてください。もう日も暮れるし、兄さんは頭を傷め、お師匠さまは生きているのかどうかも分からない。いったいどうしたらいいんでしょう。」
    悟空はうめいた。
    悟空「お師匠さまは無事だ。俺は蜜蜂になって中へ飛び込み、あの女が花亭に座っているのを見た。少しすると、侍女が二人、饅頭を二皿持ってきた。一皿は人肉の餡入り、つまり肉饅頭で、もう一皿は鄧沙の餡入りの精進饅頭だ。それから女童二人にお師匠さまを支えて連れ出させ、恐ろしかった気持ちを鎮めるために一つ食べろと言い、なんとかいう、ともに道を修める伴侶になれと言うんだ。お師匠さまは初め、その女に返事もしなければ、饅頭も食べなかった。だが、あいつの甘い言葉にどうしたものか口を開き、精進の方を食べると言った。女は精進饅頭を一つ割って、お師匠さまに渡した。お師匠さまは肉饅頭を丸ごと女へ渡した。女が『どうして割ってくれないの？』と言うと、お師匠さまは『出家の身だから、肉食の戒は破れない』と答えた。女は『戒を破れないのに、どうして先日、子母河で水かさの高い川の水を飲み、今日は鄧沙の餡を好むの？』と言う。お師匠さまはその意味が分からず、『水が高ければ船は速く進み、砂に沈めば馬の歩みは遅くなる』と二句返した。俺は格子の上でそれを聞き、お師匠さまの心が乱れはしまいかと、元の姿に戻り、棒を抜いて殴りかかった。あいつも術を使って煙や霧を噴き、『御弟さまを奥へお入れ』と言って、鋼の叉を振り回し、この俺と打ち合いながら洞から出てきたのさ。」
    沙悟浄は指を噛んだ。
    沙悟浄「あのあばずれ、どこから私たちをつけてきたのでしょう。それまでのことを、みんな知っているとは。」

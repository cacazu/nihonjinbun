  "source_text": "八戒道：「這等說，便我們安歇不成。莫管甚麼黃昏半夜，且去他門上索戰，嚷嚷鬧鬧，攪他個不睡，莫教他捉弄了我師父。」行者道：「頭疼，去不得。」沙僧道：「不須索戰：一則師兄頭痛；二來我師父是個真僧，決不以色空亂性。且就在山坡下，閉風處坐這一夜，養養精神，待天明再作理會。」遂此三個弟兄拴牢白馬，守護行囊，就在坡下安歇不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    八戒「そういうことなら、俺たちも休んでいられない。宵だろうが真夜中だろうがかまわん。あいつの門へ行って戦いを挑み、大騒ぎして眠らせないようにしよう。お師匠さまを弄ばれてたまるか。」
    悟空「頭が痛くて、行けん。」
    沙悟浄「戦いを挑むことはありません。一つには兄さんの頭が痛むし、もう一つ、お師匠さまは真の僧です。色という幻に惑わされて本性を乱すことなど、決してありません。この山の斜面の下、風の当たらないところで一晩過ごし、元気を取り戻して、夜が明けてから考えましょう。」
    こうして三人は白馬をしっかりつなぎ、荷物を守りながら斜面の下で休んだ。こちらの話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch55-015"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那女怪放下兇惡之心，重整歡愉之色，叫：「小的們，把前後門都關緊了。」又使兩個支更，防守行者，但聽門響，即時通報。卻又教：「女童，將臥房收拾齊整，掌燭焚香，請唐御弟來，我與他交歡。」遂把長老從後邊攙出。那女怪弄出十分嬌媚之態，攜定唐僧道：「常言：『黃金未為貴，安樂值錢多。』且和你做會夫妻兒耍子去也。」這長老咬定牙關，聲也不透。欲待不去，恐他生心害命，只得戰兢兢，跟著他步入香房。卻如痴如啞，那裡擡頭舉目，更不曾看他房裡是甚床鋪幔帳，也不知有甚箱籠梳妝。那女怪說出的雨意雲情，亦漠然無聽。好和尚，真是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    さて、女の妖怪は凶暴な心を収め、再び嬉しげな顔を作って命じた。
    女の妖怪「お前たち、前と後ろの門をしっかり閉めておきな。」
    さらに二人に夜の番をさせ、悟空に備えて、門の音がしたらすぐ知らせるよう言いつけた。それからまた命じた。
    女の妖怪「女童、寝室をきれいに整え、明かりをともし、香を焚いて、唐の御弟さまをお迎えしな。あたしはあの方と交わるのだよ。」
    三蔵は奥から支えられて連れ出された。女の妖怪はこの上なく艶めいた仕草をし、三蔵の手を取った。
    女の妖怪「よく言うでしょう。『黄金が尊いのではない、安らかな楽しみこそ金にまさる』って。さあ、しばらく夫婦になって、楽しみに行きましょうよ。」
    三蔵は歯を食いしばり、声一つ漏らさなかった。行くまいと思っても、相手が殺意を起こすのが怖い。やむなく震えながら後について、香の漂う部屋へ入った。まるで何も分からず、口もきけなくなった者のようで、顔を上げも、目を向けもしない。部屋にどんな寝台や帳があるかも見ず、どんな箱や化粧道具があるかも知らなかった。女の妖怪が雨雲の交わりを誘う言葉を並べても、何の反応も示さず聞き流した。見事な僧ではないか。まことに、
  "translation_status": "reviewed"
- "id": "xy-ch55-016"

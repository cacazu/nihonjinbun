  "origin": "source"
  "source_text": "他兩個散言碎語的，直鬥到更深，唐長老全不動念。那女怪扯扯拉拉的不放，這師父只是老老成成的不肯。直纏到有半夜時候，把那怪弄得惱了，叫：「小的們，拿繩來。」可憐將一個心愛的人兒，一條繩，綑的像個猱獅模樣。又教拖在房廊下去，卻吹滅銀燈，各歸寢處。一夜無詞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    二人は途切れ途切れに言い合い、夜が深まるまで争ったが、三蔵は少しも心を動かさなかった。女の妖怪が引っ張ったり引き寄せたりして放さなくても、三蔵はひたすら重々しく構え、承知しない。半夜ほども絡み続け、とうとう女の妖怪は腹を立てた。
    女の妖怪「お前たち、縄を持っておいで！」
    ああ哀れにも、恋しいその人を一本の縄で、猱獅（どうし）のような格好に縛り上げた。さらに部屋の前の廊下へ引きずっていかせると、銀の灯火を吹き消し、皆それぞれ寝所へ入った。その夜はほかに何事もなかった。
  "translation_status": "reviewed"
- "id": "xy-ch55-018"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不覺的雞聲三唱。那山坡下孫大聖欠身道：「我這頭疼了一會，到如今也不疼不麻，只是有些作癢。」八戒笑道：「癢便再教他扎一下，何如？」行者啐了一口道：「放放放。」八戒又笑道：「放放放，我師父這一夜倒浪浪浪。」沙僧道：「且莫鬥口。天亮了，快趕早兒捉妖怪去。」行者道：「兄弟，你只管在此守馬，休得動身。豬八戒跟我去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    いつしか鶏が三度鳴いた。山の斜面の下で、悟空が身を起こした。
    悟空「俺の頭はしばらく痛んだが、今では痛くもなければ、しびれもしない。ただ、少しかゆいな。」
    八戒は笑った。
    八戒「かゆいなら、もう一度あいつに刺してもらったらどうだ？」
    悟空はぺっと唾を吐いた。
    悟空「屁でもこけ、こけ、こけ！」
    八戒はまた笑った。
    八戒「こけ、こけ、こけか。お師匠さまは一晩、色にふけ、ふけ、ふけだろうよ。」
    沙悟浄「口げんかはやめてください。もう夜が明けました。早く妖怪を捕まえに行きましょう。」
    悟空「弟よ、お前はここで馬を守っていろ。動くなよ。八戒は俺についてこい。」
  "translation_status": "reviewed"
- "id": "xy-ch55-019"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子抖擻精神，束一束皂錦直裰，相隨行者，各帶了兵器，跳上山崖，徑至石屏之下。行者道：「你且立住。只怕這怪物夜裡傷了師父，先等我進去打聽打聽。倘若被他哄了，喪了元陽，真個虧了德行，卻就大家散火；若不亂性情，禪心未動，卻好努力相持，打死精怪，救師西去。」八戒道：「你好痴啞。常言道：『乾魚可好與貓兒作枕頭？』就不如此，就不如此，也要抓你幾把是。」行者道：「莫胡疑亂說，待我看去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    八戒は元気を奮い起こし、黒い錦の直裰（ちょくたつ）を締め直した。二人はそれぞれ武器を持ち、悟空を先に立てて崖へ跳び上がり、まっすぐ石の屏風の下へ行った。
    悟空「ここで待て。あの化け物が夜の間にお師匠さまを傷つけたかもしれん。先に俺が入って探ってくる。もしあいつにだまされ、元陽（げんよう）を失ったのなら、まことに修行の徳を損なったことになる。そのときは、みんな解散だ。もし本性を乱さず、禅の心が動かなかったのなら、力を尽くして戦い、妖怪を打ち殺して、お師匠さまを救い出し、西へ進もう。」
    八戒「兄貴はずいぶんお人よしだな。『干し魚を、猫の枕にできるものか』というじゃないか。たとえ、そういうことをしないにしても、しないにしてもだ、何度か引っかかずにはおかないだろうよ。」
    悟空「勝手に疑って、でたらめを言うな。俺が見てくる。」
  "translation_status": "reviewed"
- "id": "xy-ch55-020"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，轉石屏，別了八戒，搖身還變個蜜蜂兒，飛入門裡。見那門裡有兩個丫鬟，頭枕著梆鈴，正然睡哩。卻到花亭子觀看，那妖精原來弄了半夜，都辛苦了，一個個都不知天曉，還睡著哩。行者飛來後面，影影的只聽見唐僧聲喚。忽擡頭，見那房廊下四馬攢蹄綑著師父。行者輕輕的釘在唐僧頭上，叫：「師父。」唐僧認得聲音，道：「悟空來了？快救我命。」行者道：「夜來好事如何？」三藏咬牙道：「我寧死也不肯如此。」行者道：「昨日我見他有相憐相愛之意，卻怎麼今日把你這般挫折？」三藏道：「他把我纏了半夜，我衣不解帶，身未沾床。他見我不肯相從，才綑我在此。你千萬救我取經去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    悟空は石の屏風を回り、八戒と別れると、身を揺すって再び蜜蜂となり、門の内へ飛び込んだ。中では二人の侍女が、夜回りの拍子木と鈴を枕にして眠っていた。花亭へ行って見ると、妖怪どもは半夜もの騒ぎですっかり疲れ、誰も夜が明けたのに気づかず、まだ寝ている。悟空が奥へ飛ぶと、かすかに三蔵の呼ぶ声がした。ふと見上げれば、部屋の前の廊下に、手足をひと束に縛られた師がいる。悟空はそっと三蔵の頭に止まった。
    悟空「お師匠さま。」
    三蔵は声を聞き分けた。
    三蔵「悟空が来たのか。早く命を助けてくれ。」
    悟空「昨夜のお楽しみは、いかがでした？」
    三蔵は歯を食いしばった。
    三蔵「死んでも、そのようなことは承知しない。」
    悟空「昨日は、あの女がずいぶん優しく、いとおしそうにしていたのを見ました。それがどうして、今日はこんなひどい仕打ちをするのです？」
    三蔵「あの女は半夜も私にまとわりついたが、私は衣の帯も解かず、体を寝台にも触れさせなかった。言いなりにならないのを見て、ここへ縛りつけたのだ。どうか私を助け、経を取りに行かせてくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch55-021"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他師徒們正然問答，早驚醒了那個妖精。妖精雖是下狠，卻還有流連不捨之意。一覺翻身，只聽見「取經去也」一句，他就滾下床來，厲聲高叫道：「好夫妻不做，卻取甚麼經去？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    師弟がそうして問答しているうちに、あの妖怪は目を覚ました。手ひどい仕打ちをしたとはいえ、まだ三蔵が恋しく、手放したくないのだ。寝返りを打った拍子に、「経を取りに行かせてくれ」という一句だけが聞こえると、寝台から転げ下り、鋭い声を上げた。
    女の妖怪「仲のよい夫婦になろうともせず、何の経を取りに行くというのさ！」
  "translation_status": "reviewed"
- "id": "xy-ch55-022"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者慌了，撇卻師父，急展翅，飛將出去，現了本相，叫聲：「八戒。」那獃子轉過石屏道：「那話兒成了否？」行者笑道：「不曾，不曾。老師父被他摩弄不從，惱了綑在那裡。正與我訴說前情，那怪驚醒了，我慌得出來也。」八戒道：「師父曾說甚來？」行者道：「他只說衣不解帶，身未沾床。」八戒笑道：「好好好，還是個真和尚！我們救他去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    悟空は慌て、師を残して急いで羽を広げ、外へ飛び出した。元の姿に戻り、声を上げた。
    悟空「八戒！」
    八戒は石の屏風を回ってきた。
    八戒「あのことは、できちまったのか？」
    悟空は笑った。
    悟空「いや、していない、していない。お師匠さまがあいつに弄ばれても言いなりにならなかったので、あいつは怒って縛りつけたんだ。ちょうど事情を話してくれていたら、妖怪が目を覚ましたもんで、俺は慌てて出てきた。」
    八戒「お師匠さまは、何と言っていた？」
    悟空「ただ、衣の帯も解かず、体を寝台にも触れさせなかった、とさ。」
    八戒は笑った。
    八戒「よし、よし、よし。やっぱり本物の坊さんだ！　助けに行こう。」
  "translation_status": "reviewed"
- "id": "xy-ch55-023"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "獃子粗鹵，不容分說，舉釘鈀，望他那石頭門上盡力氣一鈀，唿喇喇築做幾塊。諕得那幾個枕梆鈴睡的丫鬟跑至二層門外，叫聲：「開門，前門被昨日那兩個醜男人打破了！」那女怪正出房門，只見四五個丫鬟跑進去報道：「奶奶，昨日那兩個醜男人又來把前門已打碎矣。」那怪聞言，即忙叫：「小的們，燒湯洗面梳妝。」叫：「把御弟連繩擡在後房收了。等我打他去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    気の荒い八戒は、それ以上の話も聞かず、熊手を振り上げ、石門めがけて力いっぱい打ち下ろした。ごろごろと音を立て、門は何片にも砕け散った。拍子木と鈴を枕にしていた侍女たちは仰天し、二の門の外へ走っていった。
    侍女たち「開けてください！　昨日の醜い男二人が、表の門を壊しました！」
    女の妖怪がちょうど部屋を出るところへ、四、五人の侍女が駆け込んで報告した。
    侍女たち「おかみさま、昨日の醜い男二人がまた来て、表の門を砕いてしまいました。」
    聞くなり、女の妖怪は急いで命じた。
    女の妖怪「お前たち、湯を沸かしな。顔を洗って化粧するよ。」
    さらに命じた。
    女の妖怪「御弟さまは縄ごと奥の部屋へ担ぎ込んで、お入れしておきな。あたしがあいつらを打ちのめしてくる。」
  "translation_status": "reviewed"
- "id": "xy-ch55-024"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好妖精，走出來，舉著三股叉，罵道：「潑猴！野彘！老大無知。你怎敢打破我門？」八戒罵道：「濫淫賤貨！你倒困陷我師父，返敢硬嘴。我師父是你哄將來做老公的，快快送出饒你；敢再說半個『不』字，老豬一頓鈀，連山也築倒你的。」那妖精那容分說，抖擻身軀，依前弄法，鼻口內噴煙冒火，舉鋼叉就刺八戒。八戒側身躲過，著鈀就築；孫大聖使鐵棒並力相幫。那怪又弄神通，也不知是幾隻手，左右遮攔。交鋒三五個回合，不知是甚兵器，把八戒嘴唇上也扎了一下。那獃子拖著鈀，侮著嘴，負痛逃生。行者卻也有些醋他，虛丟一棒，敗陣而走。那怪得勝而回，叫小的們搬石塊壘疊了前門不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    女の妖怪は三つ又の叉を持って出てきて、罵った。
    女の妖怪「ろくでなしの猿！　野豚！　まったく、ものの分からぬ奴らだね。よくもあたしの門を壊したものだ！」
    八戒も罵り返した。
    八戒「淫乱なあばずれめ！　お師匠さまを閉じ込めておいて、よくも減らず口をたたく。お師匠さまをだまして連れてきて、亭主にしようというんだな。さっさとお送りしろ。そうすりゃ許してやる。『嫌』の半言でも言ってみろ。この俺が熊手を浴びせかけ、山ごと崩してやるぞ！」
    女の妖怪はそれ以上言わせず、身を震わせて以前と同じ術を使い、鼻と口から煙や火を噴き出した。鋼の叉を上げて八戒を突く。八戒は身をよけ、熊手で打ち返し、悟空も鉄棒を使って力を合わせた。女の妖怪はまた神通力を使い、何本あるのか分からぬ手で、左右からの攻撃を防ぐ。三、五合（ごう）も渡り合ったところで、何の武器だか、八戒の唇も一刺しされた。八戒は熊手を引きずり、口を押さえ、痛みに耐えながら命からがら逃げ出した。悟空も少々相手を恐れ、一棒を当てるふりだけして、敗れて逃げた。女の妖怪は勝って帰り、手下たちに石を運ばせ、表の門を積み塞がせた。こちらはひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch55-025"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那沙和尚正在坡前放馬，只聽得那裡豬哼。忽擡頭，見八戒侮著嘴，哼將來。沙僧道：「怎的說？」獃子哼道：「了不得，了不得。疼疼疼。」說不了，行者也到跟前，笑道：「好獃子啊，昨日咒我是腦門癰，今日卻也弄做個瘇嘴瘟了。」八戒哼道：「難忍難忍，疼得緊，利害利害。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    さて、沙悟浄は斜面の前で馬を放していたが、どこからか豚のうめき声が聞こえた。顔を上げると、八戒が口を押さえ、うんうん言いながら戻ってくる。
    沙悟浄「どうしたんです？」
    八戒はうめいた。
    八戒「大変だ、大変だ。痛い、痛い、痛い！」
    ろくに話もできないうちに、悟空もそばへ来て笑った。
    悟空「いい気味だ、この間抜けめ。昨日は俺を、頭のできものだとからかったが、今日は自分が口を腫らした疫病神になったじゃないか。」
    八戒はうめいた。
    八戒「たまらん、たまらん。ひどく痛む。こりゃひどい、ひどい！」
  "translation_status": "reviewed"
- "id": "xy-ch55-026"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三人正然難處，只見一個老媽媽兒，左手提著一個青竹籃兒，自南山路上挑菜而來。沙僧道：「大哥，那媽媽來得近了，等我問他個信兒，看這個是甚妖精，是甚兵器，這般傷人？」行者道：「你且住，等老孫問他去來。」行者急睜睛看，只見頭直上有祥雲蓋頂，左右有香霧籠身。行者認得，即叫：「兄弟們，還不來叩頭，那媽媽是菩薩來也。」慌得豬八戒忍疼下拜，沙和尚牽馬躬身，孫大聖合掌跪下，叫聲：「南無大慈大悲救苦救難靈感觀世音菩薩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    三人が困り果てていると、一人の老婆が左手に青竹の籠を提げ、南の山道から青菜を摘んでやってきた。
    沙悟浄「兄さん、あのおばあさんが近くまで来ました。どんな妖怪なのか、どんな武器であんなに人を傷つけるのか、聞いてみましょう。」
    悟空「ちょっと待て。この俺が聞いてくる。」
    悟空は目を見開いてよく見た。老婆の頭の真上にはめでたい雲が覆い、左右には香しい霧が身を包んでいる。正体を見抜き、すぐに呼びかけた。
    悟空「二人とも、早く来てひれ伏せ。あのおばあさんは、菩薩（ぼさつ）さまがおいでになったんだ！」
    八戒は慌てて痛みをこらえ、ひざまずいた。沙悟浄は馬を引いたまま身をかがめ、悟空は合掌して跪き、唱えた。
    悟空「南無大慈大悲救苦救難霊感観世音菩薩（なむだいじだいひきゅうくきゅうなんれいかんかんぜおんぼさつ）。」
  "translation_status": "reviewed"
- "id": "xy-ch55-027"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩見他們認得元光，即踏祥雲，起在半空，現了真像，原來是魚籃之像。行者趕到空中，拜告道：「菩薩，恕弟子失迎之罪。我等努力救師，不知菩薩下降。今遇魔難難收，萬望菩薩搭救搭救。」菩薩道：「這妖精十分利害。他那三股叉是生成的兩隻鉗腳。扎人痛者，是尾上一個鉤子，喚做倒馬毒。本身是個蝎子精。他前者在雷音寺聽佛談經，如來見了，不合用手推他一把，他就轉過鉤子，把如來左手中拇指上扎了一下。如來也疼難禁，即著金剛拿他。他卻在這裡。若要救得唐僧，除是別告一位方好，我也是近他不得。」行者再拜道：「望菩薩指示指示，別告那位去好？弟子即去請他也。」菩薩道：「你去東天門裡光明宮告求昴日星官，方能降伏。」言罷，遂化作一道金光，徑回南海。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    観音菩薩（かんのんぼさつ）は三人が本来の光を見抜いたと知り、めでたい雲を踏んで空中へ昇り、本来の姿を現した。それは魚籃（ぎょらん）を持つ姿だった。悟空は空中へ追い、拝んで申し上げた。
    悟空「菩薩さま、お迎えもせず失礼いたしました。私たちは師を助けようと力を尽くしていて、菩薩さまがお下りになったことを存じませんでした。今度の魔物はどうにも手ごわく、降伏させられません。どうか、どうかお助けください。」
    観音菩薩「あの妖怪は非常に手ごわいのです。あの三つ又の叉は、生まれつき備わった二本の鋏脚です。人を刺して苦しめるのは尾の先の鉤で、倒馬毒（とうばどく）と呼ばれます。その正体は蠍の精です。以前、雷音寺で仏の説法を聞いていたとき、如来がこれを見つけ、うっかり手で押しのけてしまいました。すると鉤を振り返し、如来の左手の中指を一刺ししたのです。如来も痛みに耐えかね、すぐ金剛（こんごう）に捕らえるよう命じました。ところが、ここにいたのですね。三蔵を救いたいのなら、ほかの方に頼むよりありません。私も、この妖怪には近づけないのです。」
    悟空はまた拝んだ。
    悟空「菩薩さま、どうかお教えください。どなたにお願いすればよろしいのでしょう。弟子の私が、すぐお迎えに参ります。」
    観音菩薩「東天門（とうてんもん）の内、光明宮（こうめいきゅう）へ行って、昴日星官（ぼうじつせいかん）に頼みなさい。あの方なら降伏させられます。」
    そう言い終えると、一筋の金色の光になり、まっすぐ南海（なんかい）へ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch55-028"
  "section_id": "chapter-55"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖才按雲頭，對八戒、沙僧道：「兄弟放心，師父有救星了。」沙僧道：「是那裡救星？」行者道：「才然菩薩指示，教我告請昴日星官。老孫去來。」八戒侮著嘴哼道：「哥啊，就問星官討些止疼的藥餌來。」行者笑道：「不須用藥，只似我昨日疼過夜就好了。」沙僧道：「不必煩絮，快早去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch55-2316520"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第055回&oldid=2316520"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    悟空は雲を降りると、八戒と沙悟浄に告げた。
    悟空「二人とも安心しろ。お師匠さまに救いの神が見つかったぞ。」
    沙悟浄「どちらの救いの神です？」
    悟空「たった今、菩薩さまが昴日星官に頼めと教えてくださった。俺が行ってくる。」
    八戒は口を押さえたまま、うめいた。
    八戒「兄貴、星官に頼んで、痛み止めの薬ももらってきてくれ。」
    悟空は笑った。
    悟空「薬なんぞ要らん。昨日の俺と同じさ。一晩痛めば治る。」
    沙悟浄「ぐずぐず話していないで、早く行ってください。」
  "translation_status": "reviewed"
- "id": "xy-ch55-029"

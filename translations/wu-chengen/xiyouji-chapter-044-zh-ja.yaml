  - "id": "xy-ch44-003"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      求經脫障向西遊，無數名山不盡休。
      兔走烏飛催晝夜，鳥啼花落自春秋。
      微塵眼底三千界，錫杖頭邊四百州。
      宿水餐風登紫陌，未期何日是回頭。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 121
        "line_end": 124
    "translation_ja": |-
      経を求め、妨げを脱して西へ旅する。数知れぬ名山を越えても、歩みは尽きない。
      月の兎は走り、日の烏は飛んで、昼と夜をせき立てる。鳥は鳴き、花は散り、おのずと春秋が移る。
      眼下の三千世界（さんぜんせかい）は微塵のよう。錫杖（しゃくじょう）の先には四百の州。
      水辺に宿り、風を食とし、大道を進む。いつ帰途に就くのか、まだ見通しもない。
    "translation_status": "draft"
  - "id": "xy-ch44-004"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說唐三藏幸虧龍子降妖，黑水河神開路，師徒們過了黑水河，找大路一直西來。真個是迎風冒雪，戴月披星。行夠多時，又值早春天氣。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 125
        "line_end": 125
    "translation_ja": "さて、三蔵（さんぞう）は竜王の子が妖怪を降し、黒水河（こくすいが）の神が道を開いてくれたおかげで、弟子たちと黒水河を渡り、大道を見つけてひたすら西へ向かった。まさしく風に向かい、雪を冒し、月を頂き、星を身に浴びての旅である。長く歩くうちに、また早春の季節がやってきた。目に映るのは、こんな景色だった。"
    "translation_status": "draft"
  - "id": "xy-ch44-005"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": "三陽轉運，萬物生輝。三陽轉運，滿天明媚開圖畫；萬物生輝，遍地芳菲設繡茵。梅殘數點雪，麥漲一川雲。漸開冰解山泉溜，盡放萌芽沒燒痕。正是那：太昊乘震，勾芒御辰；花香風氣暖，雲淡日光新；道傍楊柳舒青眼，膏雨滋生萬象春。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      三陽（さんよう）が巡り、万物が輝く。
      三陽が巡れば、空いっぱいの明るさが絵巻を広げ、万物が輝けば、地いっぱいの花々が刺繍の敷物を敷く。
      梅の残り花は、ちらほらと雪のよう。麦は一面に育ち、雲のようにうねる。
      氷は次第に解けて山の泉が流れ、芽はすべて伸び出して、野焼きの跡を覆い隠す。
      まさに太昊（たいこう）が震（しん）の方位に乗じ、勾芒（こうぼう）が春の時を治める。
      花は香り、風は暖かく、雲は淡く、日の光は新しい。
      道端の柳は青い芽を目のように開き、恵みの雨が万象を育てる春であった。
    "translation_status": "draft"
  - "id": "xy-ch44-006"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們在路上，遊觀景色，緩馬而行，忽聽得一聲吆喝，好便似千萬人吶喊之聲。唐三藏心中害怕，兜住馬不能前進，急回頭道：「悟空，是那裡這等響振？」八戒道：「好一似地裂山崩。」沙僧道：「也就如雷聲霹靂。」三藏道：「還是人喊馬嘶。」孫行者笑道：「你們都猜不著，且住，待老孫看是何如。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      師弟は道すがら景色を眺め、馬をゆっくり歩かせていた。すると突然、まるで何千何万もの人が叫ぶような掛け声が聞こえた。三蔵は恐ろしくなり、手綱を引いて進めなくなると、急いで振り返った。
      三蔵「悟空（ごくう）、あれほど響くのは、どこで何が起きているのだ。」
      八戒（はっかい）「大地が裂け、山が崩れるみたいだ。」
      沙悟浄（さごじょう）「雷がとどろいているようでもあります。」
      三蔵「いや、人の叫び声と馬のいななきだ。」
      悟空は笑った。
      悟空「みんな見当違いだ。ちょっと待っていてくれ。俺が何なのか見てくる。」
    "translation_status": "draft"
  - "id": "xy-ch44-007"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，將身一縱，踏雲光，起在空中，睜眼觀看，遠見一座城池。又近覷，倒也祥光隱隱，不見甚麼凶氣紛紛。行者暗自沉吟道：「好去處，如何有響聲振耳？那城中又無旌旗戈戟，又不是炮聲響振，何以若人馬諠譁？」正疑間，只見那城門外，有一塊沙灘空地，攢簇了許多和尚，在那裡扯車兒哩。原來是一齊著力打號，齊喊「大力王菩薩」，所以驚動唐僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      見事な悟空は身を躍らせ、雲の光に乗って空へ上がり、目を見開いて見回した。遠くに城郭が一つ見えた。近くから見ても、めでたい光がかすかに差していて、不吉な気配が立ち込めているわけではない。悟空はひそかに考えた。
      悟空「いい所じゃないか。それなのに、どうして耳をつんざく音がするんだ。城の中に旗や武器が立ち並んでいるわけでもなく、砲声でもない。何だって人馬が騒いでいるように聞こえるんだろう。」
      いぶかしんでいると、城門の外の砂地の空き地に、大勢の僧が群がって車を引いているのが見えた。一斉に力を入れて掛け声を合わせ、僧たちが「大力王菩薩（だいりきおうぼさつ）！」と叫んでいたのだ。その声に三蔵は驚いたのであった。
    "translation_status": "draft"
  - "id": "xy-ch44-008"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者漸漸按下雲頭來看處，呀！那車子裝的都是磚瓦、木植、土坯之類。灘頭上坡最高，又有一道夾脊小路，兩座大關。關下之路都是直立壁陡之崖，那車兒怎麼拽得上去？雖是天色和暖，那些人卻也衣衫藍縷，看此像十分窘迫。行者心疑道：「想是修蓋寺院，他這裡五穀豐登，尋不出雜工人來，所以這和尚親自努力。」正自猜疑未定，只見那城門裡搖搖擺擺，走出兩個少年道士來。你看他怎生打扮。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      悟空が少しずつ雲を下げて眺めると、なんと、車に積んであるのは煉瓦や瓦、材木、日干し煉瓦のたぐいばかりだった。砂地から上がる坂は非常に高く、さらに、背骨のような尾根の細道が一本と、大きな関門が二つあった。関門の下の道は、どこも切り立った壁のような急崖である。どうしてこんな所へ車を引き上げられよう。天気は暖かいのに、僧たちはみなぼろぼろの衣を着て、見るからにひどく困窮していた。悟空は怪しんだ。
      悟空「きっと寺を建てているんだろう。ここは五穀が豊かに実っていて、雑用の働き手が見つからないから、僧たちが自分で力仕事をしているんだな。」
      まだ考えが定まらないうちに、城門から二人の若い道士が、悠々と体を揺らして出てきた。さて、どんな身なりであったか。見れば、こうである。
    "translation_status": "draft"
  - "id": "xy-ch44-009"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": "頭戴星冠，身披錦繡。頭戴星冠光耀耀，身披錦繡彩霞飄。足踏雲頭履，腰繫熟絲絛。面如滿月多聰俊，形似瑤天仙客嬌。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      頭には星冠（せいかん）、身には錦繍。
      星冠はきらきらと光り、錦繍は彩り豊かな霞のようにひるがえる。
      足には雲頭履（うんとうり）を履き、腰には練り絹の組みひもを結ぶ。
      顔は満月のようで、聡明で才気にあふれ、姿は玉の天界の仙客のように美しい。
    "translation_status": "draft"
  - "id": "xy-ch44-010"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那些和尚見道士來，一個個心驚膽戰，加倍著力，恨苦的拽那車子。行者就曉得了：「咦！想必這和尚們怕那道士；不然啊，怎麼這等著力拽扯？我曾聽得人言，西方路上有個敬道滅僧之處，斷乎此間是也。我待要回報師父，奈何事不明白，返惹他怪，道我這等一個伶俐之人，就不能探個實信。且等下去問得明白，好回師父話。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      僧たちは道士が来るのを見ると、一人残らず肝を冷やし、倍の力を出して、苦しみながら必死に車を引いた。悟空には事情が分かった。
      悟空「おや、こいつらはきっと道士を怖がっているんだ。そうでなければ、どうしてあんなに力を込めて引くものか。西へ行く途中に、道教を尊んで僧を滅ぼす土地があると聞いたことがある。間違いなくここだな。お師匠さまに報告したいが、事情がはっきりしない。かえって、これほど機転の利く男なのに確かな話も探れないのかと、叱られるだろう。まず降りて詳しく聞き、それからお師匠さまに話そう。」
    "translation_status": "draft"
  - "id": "xy-ch44-011"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你道他來問誰？好大聖，按落雲頭，去郡城腳下，搖身一變，變做個遊方的雲水全真，左臂上掛著一個水火籃兒，手敲著漁鼓，口唱著道情詞，近城門，迎著兩個道士，當面躬身道：「道長，貧道起手。」那道士還禮道：「先生那裡來的？」行者道：「我弟子雲遊於海角，浪蕩在天涯。今朝來此處，欲募善人家。動問二位道長：這城中那條街上好道？那個巷裡好賢？我貧道好去化些齋吃。」那道士笑道：「你這先生，怎麼說這等敗興的話？」行者道：「何為敗興？」道士道：「你要化些齋吃，卻不是敗興？」行者道：「出家人以乞化為由，卻不化齋吃，怎生有錢買？」道士笑道：「你是遠方來的，不知我這城中之事。我這城中，且休說文武官員好道，富民長者愛賢，大男小女見我等拜請奉齋，這般都不須掛齒，頭一等就是萬歲君王好道愛賢。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      さて、悟空は誰に尋ねたのだろう。見事な悟空は雲を下ろして城壁の下へ行き、身を振るわせて、諸国を巡る雲水全真（うんすいぜんしん）の姿に変わった。左腕には水火籃（すいからん）を一つ掛け、手で漁鼓（ぎょこ）をたたき、口では道情（どうじょう）の詞を歌いながら城門へ近づいた。二人の道士を迎えると、その前で身をかがめた。
      悟空「道長（どうちょう）、ご挨拶申し上げます。」
      道士は礼を返した。
      道士「先生、どちらから来られたのです。」
      悟空「弟子の私は海の果てまで巡り、天の果てまでさすらって、今日ここへ参り、善い方々に施しを募ろうと存じます。お二人の道長に伺います。この城のどの通りには道を敬う方が、どの路地には賢者を尊ぶ方がおいででしょう。そちらへ行って食べ物の施しを受けたいのです。」
      道士は笑った。
      道士「先生ともあろう方が、どうしてそんな景気の悪いことをおっしゃる。」
      悟空「何が景気の悪いことなのです。」
      道士「食べ物を乞おうとは、景気の悪いことではありませんか。」
      悟空「出家の身は托鉢で暮らすものです。食べ物を乞わずに、どうして買う金がありましょう。」
      道士は笑った。
      道士「遠くからおいでなので、この城の事情をご存じないのですね。この城では文武の役人が道を好み、富裕な人々や長者が賢者を尊び、大人の男から幼い娘まで、我々を見ると拝んで食事に招きますが、そんなことは言うまでもありません。何よりもまず、万歳なる国王が、道を好んで賢者を尊ばれるのです。」
    "translation_status": "draft"
  - "id": "xy-ch44-012"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「我貧道一則年幼，二則是遠方乍來，實是不知。煩二位道長將這裡地名，君王好道愛賢之事，細說一遍，足見同道之情。」道士說：「此城名喚車遲國。寶殿上君王與我們有親。」行者聞言，呵呵笑道：「想是道士做了皇帝？」他道：「不是。只因這二十年前，民遭亢旱，天無點雨，地絕穀苗，不論君臣黎庶，大小人家，家家沐浴焚香，戶戶拜天求雨。正都在倒懸捱命之處，忽然天降下三個仙長來，俯救生靈。」行者問道：「是那三個仙長？」道士說：「便是我家師父。」行者道：「尊師甚號？」道士云：「我大師父號做虎力大仙，二師父鹿力大仙，三師父羊力大仙。」行者問曰：「三位尊師有多少法力？」道士云：「我那師父呼風喚雨，只在翻掌之間；指水為油，點石成金，卻如轉身之易。所以有這般法力，能奪天地之造化，換星斗之玄微，君臣相敬，與我們結為親也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空「私は一つにはまだ若く、二つには遠方から来たばかりで、本当に存じません。お二人の道長、ここの地名と、国王が道を好み賢者を尊ばれる事情とを、詳しくお話しください。同じ道を歩む者へのお情けです。」
      道士「この城は車遅国（しゃちこく）と申します。宝殿の国王は、我々と身内の間柄です。」
      悟空は聞いて、からからと笑った。
      悟空「それなら、道士が皇帝になったのですか。」
      道士「そうではありません。今から二十年前、民がひどい旱魃に遭い、空からは一滴の雨も降らず、地上の穀物の苗は絶えました。君臣、庶民、身分の高い家も低い家も、家ごとに沐浴して香を焚き、戸ごとに天を拝んで雨を願ったのです。誰もが逆さにつるされたような苦しみの中で命をつないでいたところへ、突然、三人の仙長が天から降り、生きとし生けるものを救いに来てくださいました。」
      悟空「その三人の仙長とは、どなたです。」
      道士「私たちの師父です。」
      悟空「お師匠さまのお名前は。」
      道士「一番目の師父は虎力大仙（こりきたいせん）、二番目の師父は鹿力大仙（ろくりきたいせん）、三番目の師父は羊力大仙（ようりきたいせん）と号されます。」
      悟空「三人のお師匠さまには、どれほどの法力がおありですか。」
      道士「師父が風を呼び、雨を招くのは、手のひらを返すほどの間です。水を指して油にし、石に触れて金に変えるのも、身をひねるほどにたやすい。そのような法力で天地の造化を奪い、星々の深遠な働きを移し変えられるので、君臣に敬われ、我々とは身内の間柄になったのです。」
    "translation_status": "draft"
  - "id": "xy-ch44-013"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「這皇帝十分造化。常言道：『術動公卿。』老師父有這般手段，結了親，其實不虧他。噫！不知我貧道可有星星緣法，得見那老師父一面哩？」道士笑曰：「你要見我師父，有何難處？我兩個是他靠胸貼肉的徒弟，我師父卻又好道愛賢，只聽見說個『道』字，就也接出大門，若是我兩個引進你，乃吹灰之力。」行者深深的唱個大喏道：「多承舉薦，就此進去罷。」道士說：「且少待片時，你在這裡坐下，等我兩個把公事幹了來，和你進去。」行者道：「出家人無拘無束，自由自在，有甚公事？」道士用手指定那沙灘上僧人：「他做的是我家生活，恐他躲懶，我們去點他一卯就來。」行者笑道：「道長差了，僧道之輩都是出家人，為何他替我們做活，伏我們點卯？」道士云：「你不知道。因當年求雨之時，僧人在一邊拜佛，道士在一邊告斗，都請朝廷的糧食。誰知那和尚不中用，空念空經，不能濟事。後來我師父一到，喚雨呼風，拔濟了萬民塗炭。卻才發惱了朝廷，說那和尚無用，拆了他的山門，毀了他的佛像，追了他的度牒，不放他回鄉，御賜與我們家做活，就當小廝一般。我家裡燒火的也是他，掃地的也是他，頂門的也是他。因為後邊還有住房，未曾完備，著這和尚來拽磚瓦，拖木植，起蓋房宇。只恐他貪頑躲懶，不肯拽車，所以著我兩個去查點查點。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      悟空「この皇帝はたいへん幸運ですね。『術は公卿の心を動かす』といいます。ご老師にそれほどの技がおありなら、身内となっても皇帝は決して損をなさいますまい。ああ、私にもほんのわずかな縁があって、ご老師のお顔を拝めればよいのですが。」
      道士は笑った。
      道士「師父に会うことなど、何が難しいものですか。私たち二人は、師父にとって胸に抱くほど身近な弟子です。そのうえ師父は道を好み、賢者を尊び、『道』という字を耳にするだけで、大門まで迎えに出られるのです。私たちがお引き合わせするなら、灰を吹き払うほどの手間もかかりません。」
      悟空は深々と拝礼して声をかけた。
      悟空「お取り次ぎ、まことにありがとうございます。それでは、すぐに参りましょう。」
      道士「少しお待ちください。ここに座って、私たちが公の仕事を済ませて戻るのを待っていてください。それからご一緒しましょう。」
      悟空「出家の者は縛られることなく、自由自在の身です。どんな公の仕事があるのです。」
      道士は手で砂地の僧たちを指した。
      道士「あいつらがしているのは、私どもの家の仕事です。怠けては困るので、人数を一度調べて戻ってくるのです。」
      悟空は笑った。
      悟空「道長、それはおかしい。僧も道士も同じ出家の者でしょう。どうしてあちらが我々のために働き、点呼まで受けなければならないのです。」
      道士「ご存じないのです。あの年、雨を求めたとき、僧たちは一方で仏を拝み、道士たちは一方で北斗（ほくと）に祈り、どちらも朝廷から食糧を受けていました。ところが僧たちは役立たずで、むなしい経をむなしく唱えるばかり、何の役にも立ちませんでした。そのあと師父が来るや、雨を呼び風を招いて、万民を塗炭の苦しみから救い出されました。そこで朝廷は怒り、僧どもは無用だと、山門を壊し、仏像を砕き、度牒（どちょう）を取り上げ、故郷にも帰さず、我々の家で働くように下されたのです。下男同然ですよ。私どもの家では、火を焚くのも、掃除をするのも、門番もあいつらです。裏にはまだ完成していない住まいがあるので、あの僧たちに煉瓦や瓦を引かせ、材木を運ばせて、家を建てているのです。遊びたがって怠け、車を引かなくなるといけないので、私たち二人が見回りを命じられたわけです。」
    "translation_status": "draft"
  - "id": "xy-ch44-014"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，扯住道士滴淚道：「我說我無緣，真個無緣，不得見老師父尊面。」道士云：「如何不得見面？」行者道：「我貧道在方上雲遊，一則是為性命，二則也為尋親。」道士問：「你有甚麼親？」行者道：「我有一個叔父，自幼出家，削髮為僧。向日年程饑饉，也來外面求乞。這幾年不見回家，我念祖上之恩，特來順便尋訪。想必是羈遲在此等地方，不能脫身，未可知也。我怎的尋著他，見一面，才可與你進城。」道士云：「這般卻是容易。我兩個且坐下，即煩你去沙灘上替我一查，只點頭目有五百名數目便罷，看內中那個是你令叔。果若有呀，我們看道中情分，放他去了，卻與你進城好麼？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      悟空はそれを聞くと、道士の袖を引いて涙を流した。
      悟空「私には縁がないと思っていましたが、本当に縁がありません。ご老師のお顔を拝めないのです。」
      道士「どうして会えないのです。」
      悟空「私が諸国を巡っているのは、一つには性命（せいめい）の道を求め、もう一つには身内を捜すためなのです。」
      道士「どんな身内がおいでなのです。」
      悟空「叔父が一人おります。幼いうちに出家し、髪を剃って僧になりました。以前、飢饉の年に、外へ出て施しを乞うようになったのです。この数年、家へ戻らないので、私は先祖の恩を思い、旅のついでに、わざわざ捜し訪ねております。もしかすると、このような土地に足止めされて、抜け出せずにいるのかもしれません。どうにか捜し当てて一度顔を見なければ、あなた方と城へ入るわけにはいかないのです。」
      道士「それなら簡単です。私たち二人はここに座っていましょう。あなたが代わりに砂地へ行って調べてください。頭数が五百人そろっていればよいのです。その中の誰が叔父上なのか、ご覧になればよい。もし本当にいれば、同道のよしみで放してあげます。それから一緒に城へ入るということで、どうです。」
    "translation_status": "draft"
  - "id": "xy-ch44-015"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者頂謝不盡，長揖一聲，別了道士，敲著漁鼓，徑往沙灘之上。過了雙關，轉下夾脊，那和尚一齊跪下磕頭道：「爺爺，我等不曾躲懶，五百名半個不少，都在此扯車哩。」行者看見，暗笑道：「這些和尚被道士打怕了，見我這假道士就這般悚懼。若是個真道士，好道也活不成了。」行者又搖手道：「不要跪，休怕。我不是監工的，我來此是尋親的。」眾僧們聽說認親，就把他圈子陣圍將上來，一個個出頭露面，咳嗽打響，巴不得要認出去。道：「不知那個是他親哩。」行者認了一會，呵呵笑將起來。眾僧道：「老爺不認親，如何發笑？」行者道：「你們知我笑甚麼？笑你這些和尚全不長俊。父母生下你來，皆因命犯華蓋，妨爺剋娘，或是不招姊妹，才把你捨斷了出家。你怎的不遵三寶，不敬佛法，不去看經拜懺，卻怎麼與道士傭工，作奴婢使喚？」眾僧道：「老爺，你來羞我們哩。你老人家想是個外邊來的，不知我這裡利害。」行者道：「果是外方來的，其實不知你這裡有甚利害。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      悟空は礼を尽くして何度も感謝し、深く拝礼して道士と別れると、漁鼓をたたきながら砂地へまっすぐ向かった。二つの関門を通り、背骨のような尾根の細道を下りると、僧たちは一斉にひざまずき、額を地につけた。
      僧たち「旦那さま、私どもは怠けてなどおりません。五百人、一人の半分さえ欠けず、みんなここで車を引いております。」
      悟空はそれを見て、ひそかに笑った。
      悟空「こいつら、道士に殴られて怖くなっているんだな。俺のような偽道士を見ても、こんなに震えている。本物の道士に出くわしたら、とても生きた心地もしないだろう。」
      悟空は手を振った。
      悟空「ひざまずくな。怖がらなくていい。俺は監督に来たんじゃない。身内を捜しに来たんだ。」
      僧たちは身内を捜すと聞くと、悟空を輪になって囲み、一人ずつ顔を突き出し、咳払いで注意を引いた。何とか自分を身内と認めてもらい、連れ出してほしいのだ。
      僧たち「誰がこの方の身内なんだろう。」
      悟空はしばらく見回してから、からからと笑い出した。
      僧たち「旦那さま、身内を捜さず、なぜお笑いになるのです。」
      悟空「何を笑っているか分かるか。お前たち僧は、まるで甲斐性がないと笑っているんだ。父母に産んでもらったのに、みんな華蓋（かがい）の凶運に当たり、父に災いし、母の命を縮め、あるいは姉妹とうまくいかず、それで縁を切られて出家させられたのだろう。それなのに、どうして三宝（さんぼう）を仰がず、仏法を敬わず、経を読み懺悔の礼拝をすることもしないで、道士の雇い人になり、奴婢として使われているんだ。」
      僧たち「旦那さま、私どもを辱めにいらしたのですか。よそから来られて、この土地の恐ろしさをご存じないのでしょう。」
      悟空「確かによそから来た。この土地にどんな恐ろしさがあるのか、本当に知らないんだ。」
    "translation_status": "draft"
  - "id": "xy-ch44-016"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾僧滴淚道：「我們這一國君王偏心無道，只喜得是老爺等輩，惱的是我們佛子。」行者道：「為何來？」眾僧道：「只因呼風喚雨，三個仙長來此處滅了我等，哄信君王，把我們寺拆了，度牒追了，不放歸鄉，亦不許補役當差，賜與那仙長家使用，苦楚難當。但有個遊方道者至此，即請拜王領賞；若是和尚來，不分遠近，就拿來與仙長家傭工。」行者道：「想必那道士還有甚麼巧法術，誘了君王；若只是呼風喚雨，也都是傍門小法術耳，安能動得君心？」眾僧道：「他會摶砂煉汞、打坐存神、指水為油、點石成金；如今興蓋三清觀宇，對天地晝夜看經懺悔，祈君王萬年不老：所以就把君心惑動了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      僧たちは涙を流した。
      僧たち「この国の王は偏った心の無道な方で、旦那さま方のような人ばかりお好みになり、仏弟子の私どもをお憎みになります。」
      悟空「それはまた、どうしてだ。」
      僧たち「風雨を呼び起こすというだけで、三人の仙長がここへ来て私どもを滅ぼし、王をだまして信じ込ませたのです。寺を壊し、度牒を取り上げ、故郷へ帰ることも許さず、役夫として勤めに出ることさえ認めず、仙長の家へ下して使わせています。苦しみは耐え難いものです。旅の道士が来れば、すぐに王に拝謁して褒美を頂くよう招かれます。僧が来れば、遠方からでも近隣からでも、捕らえて仙長の家で働かせるのです。」
      悟空「その道士どもには、王をたぶらかす別の巧妙な術があるに違いない。風雨を呼ぶだけなら、どれも脇道の小さな術だ。どうしてそれだけで王の心を動かせるものか。」
      僧たち「丹砂を練り、水銀を錬り、座して精神を守り、水を指して油にし、石に触れて金に変える術を心得ています。今は三清観（さんせいかん）の建物を造り、天地に向かって昼夜経を読み、懺悔して、王が万年老いないよう祈っています。それで王の心を惑わせたのです。」
    "translation_status": "draft"
  - "id": "xy-ch44-017"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「原來這般。你們都走了便罷。」眾僧道：「老爺，走不脫。那仙長奏准君王，把我們畫了影身圖，四下裡長川張掛。他這車遲國地界也寬，各府州縣鄉村店集之方，都有一張和尚圖，上面是御筆親題。若有官職的，拿得一個和尚，高陞三級；無官職的，拿得一個和尚，就賞白銀五十兩：所以走不脫。且莫說是和尚，就是剪鬃、禿子、毛稀的，都也難逃。四下裡快手又多，緝事的又廣，憑你怎麼也是難脫。我們沒奈何，只得在此苦捱。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      悟空「そういうことだったのか。みんな逃げてしまえばいいじゃないか。」
      僧たち「旦那さま、逃げられません。仙長たちは王に願い出て許しを得ると、私どもの人相書きを描かせ、あらゆる所に絶えず張り出させています。車遅国の領土は広く、府、州、県、村、宿場、市場のどこへ行っても、僧の絵が一枚ずつあり、王自らの筆で命令が記されています。官職のある者が僧を一人捕らえれば三階級昇進、官職のない者なら、僧一人につき白銀五十両（りょう）の褒美です。だから逃げられません。僧は言うまでもなく、髪を短く刈った者、禿げた者、髪の薄い者さえ、逃れるのは難しいのです。捕り手は至る所に大勢いて、取り締まりの網も広く張られ、どうやっても逃げられません。仕方がないので、ここで苦しみに耐えるばかりです。」
    "translation_status": "draft"
  - "id": "xy-ch44-018"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「既然如此，你們死了便罷。」眾僧道：「老爺，有死的。到處捉來與本處和尚，也共有二千餘眾。到此熬不得苦楚，受不得爊煎，忍不得寒冷，服不得水土，死了有六七百，自盡了有七八百。只有我這五百個不得死。」行者道：「怎麼不得死？」眾僧道：「懸梁繩斷，刀刎不疼；投河的飄起不沉，服藥的身安不損。」行者道：「你卻造化，天賜汝等長壽哩。」眾僧道：「老爺呀，你少了一個字兒，是『長受罪』哩。我等日食三餐，乃是糙米熬得稀粥。到晚就在沙灘上冒露安身。才合眼，就有神人擁護。」行者道：「想是累苦了，見鬼麼？」眾僧道：「不是鬼，乃是六丁六甲、護教伽藍。但至夜，就來保護。但有要死的，就保著，不教他死。」行者道：「這些神卻也沒理。只該教你們早死早生天，卻來保護怎的？」眾僧道：「他在夢寐中勸解我們，教不要尋死，且苦捱著，等那東土大唐聖僧往西天取經的羅漢。他手下有個徒弟，乃齊天大聖，神通廣大，專秉忠良之心，與人間報不平之事，濟困扶危，恤孤念寡。只等他來顯神通，滅了道士，還敬你們沙門禪教哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      悟空「それなら、死んでしまえばいいじゃないか。」
      僧たち「旦那さま、死んだ者もおります。各地から捕らえてきた者と、もとからこの土地にいた僧とを合わせ、二千人余りもいました。ここへ来て苦しみに耐えられず、責めさいなまれることに耐えられず、寒さを忍べず、水や土地が体に合わずに死んだ者が六、七百人、自ら命を絶った者が七、八百人。私ども五百人だけは死ねないのです。」
      悟空「どうして死ねないんだ。」
      僧たち「梁からつれば縄が切れ、刃物で首を切っても痛みません。川に飛び込めば浮き上がって沈まず、毒を飲んでも体は無事で、傷つきません。」
      悟空「それは運がいい。天がお前たちに長寿を授けたんだな。」
      僧たち「旦那さま、一字足りません。長く寿命を授かるのではなく、長く罪苦を受けるのです。私どもの一日三度の食事は、粗米を煮た薄い粥。夜は砂地で露にぬれながら休みます。目を閉じた途端、神々が守りに来るのです。」
      悟空「疲れ果てて、化け物でも見るんじゃないか。」
      僧たち「化け物ではありません。六丁六甲（ろくていろっこう）と、教えを守る護教伽藍（ごきょうがらん）です。夜になると守りに来て、死のうとする者があれば、その者を守って死なせないのです。」
      悟空「その神々も筋が通らないな。早く死なせ、早く天へ生まれさせてやればいいのに、どうして守りに来るんだ。」
      僧たち「夢の中で私どもを諭し、死のうとせず、しばらく苦しみに耐えて、東土（とうど）大唐（だいとう）から西天（さいてん）へ経を取りに向かう聖僧の羅漢（らかん）を待つように言うのです。その方の弟子に、斉天大聖（せいてんたいせい）という、神通力のたいへん広大な方がおられる。ひたすら忠実で善良な心を抱き、世の不正をただし、困窮する者を救い、危うい者を助け、孤児を憐れみ、寡婦を思いやる方だと。その方が来て神通力を示し、道士を滅ぼし、私どもの沙門（しゃもん）の教えが、また尊ばれるようにしてくださるのを待て、と言うのです。」
    "translation_status": "draft"
  - "id": "xy-ch44-019"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞得此言，心中暗笑道：「莫說老孫無手段，預先神聖早傳名。」他急抽身，敲著漁鼓，別了眾僧，徑來城門口，見了道士。那道士迎著道：「先生，那一位是令親？」行者道：「五百個都與我有親。」兩個道士笑道：「你怎麼就有許多親？」行者道：「一百個是我左鄰，一百個是我右舍，一百個是我父黨，一百個是我母黨，一百個是我交契。你若肯把這五百人都放了，我便與你進去；不放，我不去了。」道士云：「你想有些風病，一時間就胡說了。那些和尚乃國王御賜，若放一二名，還要在師父處遞了病狀，然後補個死狀，才了得哩，怎麼說都放了？此理不通，不通。且不要說我家沒人使喚，就是朝廷也要怪他。那里長要差官查勘，或時御駕也親來點劄，怎麼敢放？」行者道：「不放麼？」道士說：「不放！」行者連問三聲，就怒將起來，把耳朵裡鐵棒取出，迎風捻了一捻，就碗來粗細，幌了一幌，照道士臉上一刮。可憐就打得頭破血流身倒地，皮開頸折腦漿傾。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      悟空は聞いて、心の中でひそかに笑った。
      悟空「俺に手腕がないとは言わせないぞ。神々はもう先回りして名を広めてくれているんだから。」
      すぐに身を抜き出し、漁鼓をたたいて僧たちと別れ、城門へまっすぐ戻って道士に会った。道士は迎えて尋ねた。
      道士「先生、どなたがお身内でしたか。」
      悟空「五百人とも、私の身内でした。」
      二人の道士は笑った。
      二人の道士「どうしてそんなに大勢の身内がいるのです。」
      悟空「百人は左隣、百人は右隣、百人は父方の親族、百人は母方の親族、百人は親しい友人です。五百人みんなを放してくれるなら、あなた方と一緒に参ります。放さないなら、行きません。」
      道士「どうやら気でもおかしくなって、急にでたらめを言い出したようですね。あの僧どもは国王から下された者です。一人か二人を放すにしても、師父に病気の届けを出し、そのあと死亡の届けを補って、やっと済ませられるのですよ。それを全員放せとは、どういうことです。筋が通りません。まったく通りません。我が家に使う者がいなくなるだけでなく、朝廷からも咎められます。あちらではしょっちゅう役人を遣わして調べ、ときには王自らお出ましになって人数を確かめるのです。どうして勝手に放せますか。」
      悟空「放さないのか。」
      道士「放しません！」
      悟空は三度続けて問い、ついに怒った。耳の中から鉄棒を取り出し、風に向けてひねると、椀ほどの太さになった。それを一振りし、道士たちの顔を目がけて払った。哀れにも、頭は割れ、血が流れ、体は地に倒れ、皮膚は裂け、首は折れ、脳漿がこぼれた。
    "translation_status": "draft"
  - "id": "xy-ch44-020"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那灘上僧人遠遠望見他打殺了兩個道士，丟了車兒，跑將上來道：「不好了，不好了，打殺皇親了。」行者道：「那個是皇親？」眾僧把他簸箕陣圍了，道：「他師父上殿不參王，下殿不辭主，朝廷常稱做『國師兄長先生』。你怎麼到這裡闖禍？他徒弟出來監工，與你無干，你怎麼把他來打死？那仙長不說是你來打殺，只說是來此監工，我們害了他性命，我等怎了？且與你進城去，會了人命出來。」行者笑道：「列位休嚷。我不是雲水全真，我是來救你們的。」眾僧道：「你倒打殺人，害了我們，添了擔兒，如何是救我們的？」行者道：「我是大唐聖僧徒弟孫悟空行者，特特來此救你們性命。」眾僧道：「不是，不是，那老爺我們認得他。」行者道：「又不曾會他，如何認得？」眾僧道：「我們夢中嘗見一個老者，自言太白金星，常教誨我等，說那孫行者的模樣，莫教錯認了。」行者道：「他和你怎麼說來？」眾僧道：「他說那大聖："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      砂地の僧たちは、悟空が二人の道士を殴り殺したのを遠くから見ると、車を放り出して駆けつけた。
      僧たち「大変だ、大変だ！　皇帝の身内を殺してしまった！」
      悟空「誰が皇帝の身内だって。」
      僧たちは箕の形に悟空を取り囲んだ。
      僧たち「あの者たちの師父は、殿に上がっても王に拝礼せず、殿を下がっても王に暇乞いをしません。朝廷ではいつも『国師（こくし）たる兄上先生』とお呼びになるのです。なぜあなたはここへ来て災いを起こすのです。弟子たちが監督に出てきても、あなたには関係がないでしょう。どうして殺してしまったのですか。仙長たちは、あなたが来て殺したとは思わず、監督に来たところを私どもが殺したと言うでしょう。私どもはどうなるのです。さあ、あなたと一緒に城へ行き、この人殺しの責任をはっきりさせましょう。」
      悟空は笑った。
      悟空「みんな、騒ぐな。俺は旅の全真（ぜんしん）じゃない。お前たちを救いに来たんだ。」
      僧たち「人を殺して私どもを巻き込み、余計な重荷を背負わせておいて、どうして助けに来たと言えるのです。」
      悟空「俺は大唐の聖僧の弟子、孫悟空行者（そんごくうぎょうじゃ）だ。わざわざお前たちの命を救いに来た。」
      僧たち「違います、違います。あの方のお姿は、私どもも知っています。」
      悟空「会ったこともないのに、どうして知っているんだ。」
      僧たち「夢の中で、太白金星（たいはくきんせい）と名乗るお年寄りに何度もお会いしました。その方がいつも私どもに、見間違えぬようにと孫行者（そんぎょうじゃ）のお姿を教えてくださるのです。」
      悟空「何と言って教えたんだ。」
      僧たち「大聖（たいせい）のことを、こうおっしゃいました。」
    "translation_status": "draft"
  - "id": "xy-ch44-021"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      磕額金睛晃亮，圓頭毛臉無腮。咨牙尖嘴性情乖。貌比雷公古怪。
      慣使金箍鐵棒，曾將天闕攻開。如今皈正保僧來。專救人間災害。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 149
        "line_end": 150
    "translation_ja": |-
      『額は突き出て、金色の目がきらめく。頭は丸く、顔は毛だらけで、頬がない。
      牙をむき、口は尖り、気性はひねくれている。顔つきは雷公（らいこう）のように奇怪だ。
      金の輪をはめた鉄棒を使いこなし、かつては天の宮殿を攻め破った。
      今は正道に帰し、僧を守って来る。ひたすら世の人々を災難から救う。』
    "translation_status": "draft"
  - "id": "xy-ch44-022"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，又嗔又喜。喜道：「替老孫傳名！」嗔道：「那老賊憊懶，把我的元身都說與這夥凡人。」忽失聲道：「列位誠然認我不是孫行者，我是孫行者的門人，來此處學闖禍耍子的。那裡不是孫行者來了？」用手向東一指，哄得眾僧回頭，他卻現了本相。眾僧們方才認得，一個個倒身下拜道：「爺爺，我等凡胎肉眼，不知是爺爺顯化。望爺爺與我們雪恨消災，早進城降邪從正也。」行者道：「你們且跟我來。」眾僧緊隨左右。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      悟空は聞くと、怒るとともに喜んだ。喜んで言った。
      悟空「俺の名を広めてくれたんだな！」
      一方では怒って言った。
      悟空「あの油断ならない老いぼれめ。俺の本当の姿まで、この凡人どもにすっかり話してしまいやがって。」
      ふと声を上げた。
      悟空「みんなの言うとおり、俺は孫行者じゃない。孫行者の門人で、ここへは騒ぎの起こし方を習って遊びに来たんだ。あそこに孫行者が来ているじゃないか。」
      手を東へ向けて指し、僧たちをだまして振り返らせると、その間に本当の姿を現した。僧たちはようやく悟空だと分かり、一人ずつ身を投げ出して拝んだ。
      僧たち「大聖さま、私どもはただの肉眼を持つ凡人ゆえ、大聖さまが姿を変えておられるとは存じませんでした。どうか恨みを晴らし、災難を除いてください。早く城へ入り、邪を降して正道に戻してくださいませ。」
      悟空「ひとまず、俺についてこい。」
      僧たちは左右に寄り添ってついていった。
    "translation_status": "draft"
  - "id": "xy-ch44-023"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那大聖徑至沙灘上，使個神通，將車兒拽過兩關，穿過夾脊，提起來，摔得粉碎。把那些磚瓦、木植，盡拋下坡坂。喝教眾僧：「散，莫在我手腳邊。等我明日見這皇帝，滅那道士。」眾僧道：「爺爺呀！我等不敢遠走，但恐在官人拿住解來，卻又吃打發贖，反又生災。」行者道：「既如此，我與你個護身法兒。」好大聖，把毫毛拔了一把，嚼得粉碎，每一個和尚與他一截。都教他：「捻在無名指甲裡，捻著拳頭，只情走路。無人敢拿你便罷；若有人拿你，攢緊了拳頭，叫一聲齊天大聖，我就來護你。」眾僧道：「爺爺，倘若去得遠了，看不見你，叫你不應，怎麼是好？」行者道：「你只管放心，就是萬里之遙，可保全無事。」眾僧有膽量大的，捻著拳頭，悄悄的叫聲：「齊天大聖！」只見一個雷公站在面前，手執鐵棒，就是千軍萬馬，也不能近身。此時有百十眾齊叫，足有百十個大聖護持。眾僧叩頭道：「爺爺，果然靈顯。」行者又吩咐：「叫聲『寂』字，還你收了。」真個是叫聲「寂」，依然還是毫毛在那指甲縫裡。眾和尚卻才歡喜逃生，一齊而散。行者道：「不可十分遠遁，聽我城中消息，但有招僧榜出，就進城還我毫毛也。」五百個和尚東的東，西的西，走的走，立的立，四散不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      悟空は砂地へまっすぐ行き、神通力を使って車を二つの関門の向こうまで引き、背骨のような尾根の細道を通り抜けた。車を持ち上げてたたきつけ、粉々にすると、煉瓦や瓦、材木を残らず坂の下へ投げ捨てた。それから僧たちに声をかけた。
      悟空「散れ。俺の手足のそばにいるな。明日、あの皇帝に会って、道士どもを滅ぼしてやる。」
      僧たち「大聖さま、遠くへ逃げる勇気はございません。役人に捕まって送り返され、また殴られて罰金を納めさせられれば、かえって災難が増えます。」
      悟空「それなら、身を守る術を授けてやろう。」
      見事な悟空は毛を一つかみ抜き、噛んで細かくし、僧一人につき一切れずつ渡した。そして皆に言い聞かせた。
      悟空「薬指の爪の中へ挟み、拳を握って、気にせず歩いていけ。誰も捕まえようとしなければ、それでいい。もし誰かが捕まえようとしたら、拳を固く握り、『斉天大聖』と一声呼べ。俺が来て守ってやる。」
      僧たち「大聖さま、もし遠くまで行ってしまい、お姿も見えず、お呼びしてもお返事がなかったら、どうすればよいのです。」
      悟空「心配するな。たとえ万里（り）離れていても、何事もないよう、守り通してやる。」
      僧の中の胆の据わった者が拳を握り、そっと呼んだ。
      僧「斉天大聖！」
      すると目の前に、雷公のような姿で鉄棒を手にした者が一人立った。千軍万馬が来ても、近づけそうにない。このとき百人余りの僧が一斉に呼ぶと、百人余りの悟空が、それぞれを守った。僧たちは額を地につけて拝んだ。
      僧たち「大聖さま、本当に霊験あらたかでございます。」
      悟空はさらに教えた。
      悟空「『寂（じゃく）』と一声唱えれば、また収まる。」
      本当に「寂」と唱えると、もとの毛となって、爪の隙間に戻った。僧たちはようやく喜んで命を逃れ、いっせいに散っていった。
      悟空「あまり遠くへは行くな。城の中の知らせを待ち、僧を呼び戻す立て札が出たら、城へ来て俺の毛を返すんだぞ。」
      五百人の僧は、東へ行く者、西へ行く者、立ち去る者、立ち止まる者と四方に散った。この話は、しばらくここまでとする。
    "translation_status": "draft"
  - "id": "xy-ch44-024"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那唐僧在路傍等不得行者回話，教豬八戒引馬投西，遇著些僧人奔走。將近城邊，見行者還與十數個未散的和尚在那裡。三藏勒馬道：「悟空，你怎麼來打聽個響聲，許久不回？」行者引了十數個和尚，對唐僧馬前施禮，將上項事說了一遍。三藏大驚道：「這般啊，我們怎了？」那十數個和尚道：「老爺放心，孫大聖爺爺乃天神降的，神通廣大，定保老爺無虞。我等是這城裡敕建智淵寺內僧人。因這寺是先王太祖御造的，現有先王太祖神像在內，未曾拆毀。城中寺院，大小盡皆拆了。我等請老爺趕早進城，到我荒山安下，待明日早朝，孫大聖必有處置。」行者道：「汝等說得是，也罷，趁早進城去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      さて、三蔵は道端で悟空の報告を待ちきれず、八戒に馬を引かせて西へ進み、逃げてくる僧たちに出会った。城に近づくと、悟空が、まだ散らずに残っていた十数人の僧と一緒にいるのが見えた。三蔵は馬を止めた。
      三蔵「悟空、物音のことを調べに来ただけなのに、どうしていつまでも戻らないのだ。」
      悟空は十数人の僧を連れ、三蔵の馬の前で礼をすると、先ほどの事情をすべて話した。三蔵はたいそう驚いた。
      三蔵「そのようなことなら、私たちはどうすればよいのだ。」
      十数人の僧たち「お師匠さま、ご安心ください。孫大聖（そんたいせい）さまは天の神が下られたお方で、神通力は広大です。必ずやお師匠さまを無事にお守りくださいます。私どもはこの城の勅建智淵寺（ちょっけんちえんじ）の僧でございます。この寺は先王太祖が勅命でお造りになり、今も先王太祖の像が中にあるので、まだ壊されておりません。城のほかの寺は、大小を問わず、すべて壊されました。お師匠さま、早く城へ入り、私どもの粗末な寺にお泊まりください。明日の朝の参内になれば、孫大聖が必ず何とかしてくださるでしょう。」
      悟空「お前たちの言うとおりだ。よし、早く城へ入ろう。」
    "translation_status": "draft"
  - "id": "xy-ch44-025"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老卻才下馬，行到城門之下。此時已太陽西墜。過吊橋，進了三層門裡，街上人見智淵寺的和尚牽馬挑包，盡皆迴避。正行時，卻到山門前。但見那門上高懸著一面金字大匾，乃「敕建智淵寺」。眾僧推開門，穿過金剛殿，把正殿門開了。唐僧取袈裟披起，拜畢金身，方入。眾僧叫：「看家的。」老和尚走出來，看見行者，就拜道：「爺爺，你來了？」行者道：「你認得我是那個爺爺，就是這等呼拜？」那和尚道：「我認得你是齊天大聖孫爺爺。我們夜夜夢中見你。太白金星常常來託夢，說道只等你來，我們才得性命。今日果見尊顏與夢中無異。爺爺呀！喜得早來；再遲一兩日，我等俱做鬼矣。」行者笑道：「請起，請起。明日就有分曉。」眾僧安排齋飯，他師徒們吃了。打掃乾淨方丈，安寢一宿。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      三蔵はそこでようやく馬を下り、城門の下へ歩いていった。もう太陽は西へ沈んでいた。吊り橋を渡り、三重の門を入ると、町の人々は智淵寺（ちえんじ）の僧たちが馬を引き、荷を担ぐのを見るや、みな避けて通った。歩いているうちに山門へ着いた。門の上には、金文字の大きな額が高く掛かり、「勅建智淵寺」と書かれていた。僧たちは門を押し開け、金剛殿（こんごうでん）を通って、本殿の扉を開いた。三蔵は袈裟を取り出して羽織り、金色の仏像を拝んでから奥へ入った。僧たちが呼んだ。
      僧たち「留守番の方！」
      老僧が出てきて、悟空を見ると、すぐに拝んだ。
      老僧「旦那さま、お越しになったのですね。」
      悟空「俺をどこの旦那だと知って、そんなふうに呼んで拝むんだ。」
      老僧「斉天大聖、孫さまだと存じております。私どもは毎夜、夢でお目にかかっています。太白金星がたびたび夢に現れ、あなたがおいでになって初めて、命が助かると教えてくださるのです。今日、お顔を拝見すると、夢のお姿と少しも違いません。大聖さま、早く来てくださって、ありがたいことです。あと一日か二日遅ければ、私どもはみな死人になっていました。」
      悟空は笑った。
      悟空「さあ、立ってくれ。立ってくれ。明日になれば、すべてはっきりする。」
      僧たちは精進の食事を用意し、師弟はそれを食べた。方丈（ほうじょう）がきれいに掃除され、一行はそこで一晩休むことになった。
    "translation_status": "draft"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-001"
      "description_ja": "回題の「法身」「元運」「車力」「脊關」は、車を引いて関門と細道を越える物語と、身体の内で気を巡らせる内丹の表現を重ねるものと読める。「元」は根源の気、「脊関」は背の関門の意として語を残したが、寓意の対応を一義的に決めてはいない。『重陽真人金關玉鎖訣』の「夾脊為雙關」は、康自強の論文が引用している。参照：https://www.ch.ntnu.edu.tw/SIS/downloadfile.php?issue_id=12&paper_id=57&periodicalsPage=2 （検索本文で確認）。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-003"
      "description_ja": "月の兎と日の烏は月日を表す伝統的な像。「三千界」「四百州」の数を残し、特定の行政区画数への訂正はしない。「微塵眼底三千界」は眼下の広大な世界さえ塵のように見える像として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-005"
      "description_ja": "「三陽」は易の陽爻が三つそろう旧暦正月、春の到来をいう。「太昊乘震」は春・東方の神と、東を表す震との対応を残した。「勾芒御辰」の辰はこの春の時・時運と解し、辰刻という特定時刻には限定しない。勾芒を一般的な別表記の句芒へ書き換えない。参照：https://kotobank.jp/word/三陽-1327766 、https://kotobank.jp/word/太皡-2058260 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-008"
      "description_ja": "「夾脊小路」は背骨のような尾根の狭い道として訳した。本文の二つの関門・急な崖と、回題にもある内丹的な脊関の像を残し、地形の正確な断面は特定しない。原文の「土坯」は焼成しない煉瓦で、「磚瓦」と分けた。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-011"
      "description_ja": "「起手」は挨拶・拝礼の言葉として訳した。「水火籃兒」は教育部辞典が本作の同じ箇所を引用し、食べ物を入れる小籠と説明する。参照：https://pedia.cloud.edu.tw/Entry/Detail?title=水火籃兒 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-012"
      "description_ja": "三人の師の名と、二十年前の旱魃・雨乞い・国王との関係は、二人の道士の説明として示す。彼らの本体や動物種はこの回では明かされないため、名前の字から先取りしていない。「有親」「結為親」は身内として遇される関係をいい、実際の血縁や婚姻を補わない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-013"
      "description_ja": "道士の説明では僧も道士も朝廷から食糧を受けていたとされる。その後の寺院破壊、仏像破壊、度牒の没収、帰郷禁止、労働への下賜、火・掃除・門番の役務をすべて残した。「頂門」はこの並列では門番と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-015"
      "description_ja": "「命犯華蓋、妨爺剋娘」は悟空がからかう際に持ち出す星占い的な説明で、僧たちの生い立ちを語り手が認定したものではない。「半個不少」は一人の半分さえ欠けないという誇張を残した。 「全不長俊」は、物事を理解できないというより、甲斐性・見込みがないとの悪口。教育部辞典「不長進」は別形「不長俊」を示し、進歩しない、見込みがないなどの意を挙げる。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=21297&la=0&powerMode=0 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-018"
      "description_ja": "「長壽」と「長受罪」は、中国語で「寿」と「受」の音が重なる語呂合わせ。「一字足りない」という応答と、長生きではなく長く苦しむという対比を残した。僧の人数は二千余、苦痛などで亡くなった者は六、七百、自死は七、八百、生存者は五百と、底本の概数をそのまま保持した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-019"
      "description_ja": "「那里長要差官查勘」は「那里」を朝廷側、「長」を常にという意味に読み、しょっちゅう役人を遣わすとした。里長という村の役職が主語だと断定しない。五百人の内訳は左隣・右隣・父方・母方・親友の各百人。病気と死亡の二つの届出を経るという説明も保った。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-020"
      "description_ja": "「國師兄長先生」は国師・兄長・先生という敬称を重ねた王の呼び方。王に拝礼・暇乞いをしない扱いとともに示し、具体的な血縁にはしない。「會了人命出來」は殺人の件を明らかにして責任を問う趣旨と解した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-021"
      "description_ja": "「磕額」は突き出た額、「無腮」は頬のない外貌を描く語として残した。「性情乖」はこの戯画的な詩ではひねくれた気性と解したが、機敏さを含む読みもあり、性格全体の断定ではない。詩は僧たちが太白金星の言葉として伝えた引用である。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-023"
      "description_ja": "「打發贖」は捕らえられて殴られ、金を納めさせられる罰として訳した。法制上の具体的な罪目や定額は特定しない。「百十」は百人ほどの概数として百人余りとし、千人には変えていない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-024"
      "description_ja": "「先王太祖」は底本の呼び方を保つ。直前の王だけを指すのか、王朝の祖である太祖を指すのかを特定して年代や系譜を補っていない。太祖の像があるため智淵寺だけは壊されていないという説明は、僧たちの言葉にとどめる。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-027"
      "description_ja": "底本の「高公」は、儀礼を主宰する道士をいう語と解し、通用表記の「高功」に無断で直していない。「揚塵」は払子を振る動作、「表白」は祈りの文の読み上げ、「查罡佈斗」は北斗に対応する儀礼上の位置・配置を扱う動作と解した。儀礼の具体的な手順は確定しない。「化樂宮」は天上の宮殿の名を残し、仏教の特定の天との同定を断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-028"
      "description_ja": "対聯は底本どおり二十二字と説明されているが、実際に掲げられた二句は句読を除けば各十一字、計二十二字である。日本語の字数を二十二字に合わせるための省略はしていない。三人の老道士を虎力・鹿力・羊力だろうと見るのは、この場では悟空の判断。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-029"
      "description_ja": "底本は「修蘸」だが、供物と読経を伴う道教儀礼を指す文脈から修醮の意と解し、日本語では斎醮とした。原文欄の蘸は保持する。饅頭は中国の蒸しパン類。「斗大」と一個五、六十斤の焼き菓子という誇張は、現代単位へ換算せず残した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-030"
      "description_ja": "壁に掛けた「功德」は礼拝用の神仏画と解して「功徳画」とした。国立台湾歴史博物館の解説は功德畫を法会で壁に掛ける巻軸画と説明する。参照：https://tcmb.culture.tw/zh-tw/detail?id=11000129973&indexCode=MOCCOLLECTIONS 。「巽」は風・東南に対応する卦。語り手は風の術で花瓶などを倒したとするが、門を破壊したとは書いていない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-032"
      "description_ja": "「五穀輪迴之所」は食べた穀物が排泄物となる巡りをいう、便所のもったいぶった呼び方。続く八戒の「道号」とのからかいに合わせ、婉曲名を残した。原文の「穢氣畜人」は臭気が人を襲う意と解したが、畜の字は原文欄で改めない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-036"
      "description_ja": "供物は全品目を別々に訳した。「簇盤」は盛り合わせの皿、「襯飯」は供え飯。「餅錠」は糕餅類、「油煠」は油で揚げる麵食と教育部辞典にある。「拖爐」は小麦粉の焼き菓子と解した。「蒸酥」は菓子名としての使用を確認したが、細かな材料や製法、特定の現代菓子との一致は断定しない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=142290&la=0&powerMode=0 、https://dict.revised.moe.edu.tw/dictView.jsp?ID=19662&la=0&powerMode=0 、https://dict.revised.moe.edu.tw/dictView.jsp?ID=153878&la=0&powerMode=0 、https://journal.kci.go.kr/kucsi/archive/articlePdf?artiId=ART001578506 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch44-1455593"
      "segment_ids":
        - "xy-ch44-037"
      "description_ja": "「底衣」は直裰の下に着る衣類。ここでは下着と訳し、上下の別や具体的な形状は確定しない。「三魂」「七魄」は恐怖の誇張として数を残し、現実に死んだという意味にはしない。最後に応じる「老道士」は三人が直前の主語なので合同の発言とし、特定の一人に決めつけない。 本文の欠落ではなく解釈・校訂上の留保。"

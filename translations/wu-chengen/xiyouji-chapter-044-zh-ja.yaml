    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二更時候，孫大聖心中有事，偏睡不著，只聽得那裡吹打。悄悄的爬起來，穿了衣服，跳在空中觀看，原來是正南上燈燭熒煌。低下雲頭仔細再看，卻是三清觀道士禳星哩。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 156
        "line_end": 156
    "translation_ja": "二更（にこう）のころ、悟空は気にかかることがあって、どうにも眠れなかった。どこかから、吹き鳴らし、打ち鳴らす楽の音が聞こえる。こっそり起き上がって服を着ると、空へ跳び上がって見渡した。真南に、灯やろうそくが明々と輝いていた。雲を低く下ろしてよく見ると、三清観の道士たちが禳星（じょうせい）の祈りをしていたのである。そこには、こんな光景が見えた。"
    "translation_status": "draft"
  - "id": "xy-ch44-027"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": "靈區高殿，福地真堂。靈區高殿，巍巍壯似蓬壺景；福地真堂，隱隱清如化樂宮。兩邊道士奏笙簧，正面高公擎玉簡。宣理消災懺，開講《道德經》。揚塵幾度盡傳符，表白一番皆俯伏。咒水發檄，燭焰飄搖沖上界；查罡佈斗，香煙馥郁透清霄。案頭有供獻新鮮，桌上有齋筵豐盛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      霊妙な地には高殿、福の宿る土地には真人の堂。
      霊妙な地の高殿は、そびえ立つ蓬壺（ほうこ）の景色のように壮麗で、福地の真堂は、ほのかに化楽宮（けらくきゅう）のように清らかだ。
      両脇の道士は笙を奏で、正面の高公（こうこう）は玉簡（ぎょくかん）を捧げ持つ。
      消災の懺法（せんぼう）を説き、『道徳経（どうとくきょう）』を講じる。
      幾度も払子（ほっす）を振り、符（ふ）をくまなく伝え、祈りの文を一たび読み上げれば、皆がひれ伏す。
      水に呪をかけ、檄を発すると、ろうそくの炎は揺れながら上界へ立ち昇る。
      罡（こう）を調べ、北斗を配すれば、香の煙はかぐわしく澄んだ空へ届く。
      祭壇には新鮮な供物、卓上には豊かな精進の宴。
    "translation_status": "draft"
  - "id": "xy-ch44-028"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "殿門前掛一聯黃綾織錦的對句，繡著二十二個大字云：「雨順風調，願祝天尊無量法；河清海晏，祈求萬歲有餘年。」行者見三個老道士披了法衣，想是那虎力、鹿力、羊力大仙。下面有七八百個散眾司鼓司鐘、侍香表白，盡都侍立兩邊。行者暗自喜道：「我欲下去與他混一混，奈何單絲不線，孤掌難鳴。且回去照顧八戒、沙僧，一同來耍耍。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      殿の門前には、黄色い綾絹の錦織の対聯（ついれん）が掛かり、二十二の大きな文字が刺繍されていた。
      「雨は順じ、風は調う。願わくは天尊（てんそん）の限りない法力をたたえん。
      川は清み、海は穏やか。万歳なる君の齢がなお長からんことを祈る。」
      悟空は、三人の老道士が法衣を着ているのを見て、あれが虎力（こりき）、鹿力（ろくりき）、羊力大仙だろうと思った。その下には七、八百人の道士が、太鼓や鐘をつかさどり、香を供え、祈りの文を読み上げる役として、両側にずらりと控えていた。悟空はひそかに喜んだ。
      悟空「降りていって、あいつらをかき回してやりたいな。だが一本の糸では綱にならず、片手だけでは音は鳴らせない。ひとまず戻り、八戒と沙悟浄に声をかけて、一緒に遊んでこよう。」
    "translation_status": "draft"
  - "id": "xy-ch44-029"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "按落祥雲，徑至方丈中。原來八戒與沙僧通腳睡著。行者先叫悟淨，沙和尚醒來道：「哥哥，你還不曾睡哩？」行者道：「你且起來，我和你受用些來。」沙僧道：「半夜三更，口枯眼澀，有甚受用？」行者道：「這城裡果有一座三清觀，觀裡道士們修蘸，三清殿上有許多供養：饅頭足有斗大，燒果有五六十斤一個，襯飯無數，果品新鮮。和你受用去來。」那豬八戒睡夢裡聽見說吃好東西，就醒了，道：「哥哥，就不帶挈我些兒？」行者道：「兄弟，你要吃東西，不要大呼小叫，驚醒了師父，都跟我去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      めでたい雲を下ろし、まっすぐ方丈へ戻ると、八戒と沙悟浄は足を向け合って寝ていた。悟空が先に沙悟浄を呼ぶと、沙悟浄は目を覚ました。
      沙悟浄「兄さん、まだ眠っていなかったのですか。」
      悟空「まず起きろ。一緒にいい思いをしてこよう。」
      沙悟浄「こんな夜中に、口は乾き、目もしょぼしょぼします。何を楽しめるのです。」
      悟空「この城には確かに三清観があって、道士どもが斎醮（さいしょう）をしている。三清殿（さんせいでん）には供物が山ほどあるんだ。饅頭はゆうに一斗（と）ほどの大きさ、焼き菓子は一個が五十、六十斤（きん）もある。供え飯は数知れず、果物も新鮮だ。一緒に食べに行こう。」
      八戒は眠りながらも、うまいものを食べるという話を聞きつけ、目を覚ました。
      八戒「兄貴、俺も連れていってくれないのか。」
      悟空「兄弟、食いたければ大声を出すな。お師匠さまが目を覚ます。二人とも俺についてこい。」
    "translation_status": "draft"
  - "id": "xy-ch44-030"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個套上衣服，悄悄的走出門前，隨行者踏了雲頭，跳將起去。那獃子看見燈光，就要下手。行者扯住道：「且休忙，待他散了，方可下去。」八戒道：「他才念到興頭上，卻怎麼肯散？」行者道：「等我弄個法兒，他就散了。」好大聖，捻著訣，念個咒語，往巽地上吸一口氣，呼的吹去，便是一陣狂風，徑直捲進那三清殿上，把他些花瓶、燭臺，四壁上懸掛的功德，一齊刮倒，遂而燈火無光。眾道士心驚膽戰。虎力大仙道：「徒弟們且散。這陣神風所過，吹滅了燈燭香花。各人歸寢，明朝早起，多念幾卷經文補數。」眾道士果各退回。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      二人は服を着込み、ひそかに戸口を出て、悟空とともに雲に乗り、空へ跳び上がった。八戒は灯を見ると、すぐに手を出そうとしたが、悟空が引き止めた。
      悟空「まだ慌てるな。あいつらが散ってから降りるんだ。」
      八戒「ちょうど経を唱えるのに興が乗ってきたところだ。そうそう引き上げるものか。」
      悟空「俺がひとつ術を使えば、散っていくさ。」
      見事な悟空は指で印を結び、呪を唱え、巽（そん）の方から息を吸い込んで、ふうっと吹き出した。たちまち激しい風となって三清殿へまっすぐ吹き込み、花瓶や燭台、四方の壁に掛けた功徳画（くどくが）を、いっせいに吹き倒した。灯火は光を失い、道士たちは肝を冷やした。
      虎力大仙「弟子たち、ひとまず散れ。この神風が通り過ぎ、灯もろうそくも消え、香や花も吹き散らされた。それぞれ寝所へ戻り、明朝は早く起きて、経を数巻余分に読み、数を埋め合わせよ。」
      道士たちは、言葉どおり一人ずつ引き上げていった。
    "translation_status": "draft"
  - "id": "xy-ch44-031"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者卻引八戒、沙僧，按落雲頭，闖上三清殿。獃子不論生熟，拿過燒果來，張口就啃。行者掣鐵棒，著手便打。八戒縮手躲過道：「還不曾嘗著甚麼滋味，就打。」行者道：「莫要小家子行，且敘禮坐下受用。」八戒道：「不羞，偷東西吃，還要敘禮。若是請將來，卻要如何？」行者道：「這上面坐的是甚麼菩薩？」八戒笑道：「三清也認不得，卻認做甚麼菩薩。」行者道：「那三清？」八戒道：「中間的是元始天尊，左邊的是靈寶道君，右邊的是太上老君。」行者道：「都要變得這般模樣，才吃得安穩哩。」那獃子急了，聞得那香噴噴供養，要吃，爬上高臺，把老君一嘴拱下去道：「老官兒，你也坐得夠了，讓我老豬坐坐。」八戒變做太上老君，行者變做元始天尊，沙僧變作靈寶道君。把原像都推下去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      そこで悟空は八戒と沙悟浄を連れて雲を下ろし、三清殿へ押し入った。八戒は生か火が通っているかも構わず、焼き菓子をつかみ、口を開けてかじった。悟空は鉄棒を引き出すと、すぐその手を打とうとした。八戒は手を引っ込めてかわした。
      八戒「まだどんな味かも分からないうちから、殴るのか。」
      悟空「みっともない真似はするな。まず礼を交わし、座っていただこう。」
      八戒「恥ずかしくないのか。盗み食いなのに礼儀だなんて。招かれて来たんだったら、いったいどうするんだ。」
      悟空「この上に座っているのは、何の菩薩だ。」
      八戒は笑った。
      八戒「三清（さんせい）も知らないのか。何の菩薩だっていうんだ。」
      悟空「どの三清だ。」
      八戒「真ん中が元始天尊（げんしてんそん）、左が霊宝道君（れいほうどうくん）、右が太上老君（たいじょうろうくん）だ。」
      悟空「みんなこの姿に変わってこそ、落ち着いて食べられるぞ。」
      八戒は焦れた。香ばしい供物の匂いを嗅いで食べたくてたまらず、高い台へよじ登ると、鼻先で老君（ろうくん）の像を突き落とした。
      八戒「老先生、もう十分に座っただろう。この俺にも、ひと座りさせてくれ。」
      八戒は太上老君に、悟空は元始天尊に、沙悟浄は霊宝道君に化け、もとの像を全部下へ押し落とした。
    "translation_status": "draft"
  - "id": "xy-ch44-032"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "及坐下時，八戒就搶大饅頭吃。行者道：「莫忙哩。」八戒道：「哥哥，變得如此，還不吃等甚？」行者道：「兄弟呀，吃東西事小，泄漏天機事大。這聖像都推在地下，倘有起早的道士來撞鐘掃地，或絆一個根頭，卻不走漏消息？你把他藏過一邊來。」八戒道：「此處路生，摸門不著，卻那裡藏他？」行者道：「我才進來時，那右手下有一重小門兒，那裡面穢氣畜人，想必是個五穀輪迴之所。你把他送在那裡去罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      座るやいなや、八戒は大きな饅頭を奪い取って食べようとした。
      悟空「まだ慌てるな。」
      八戒「兄貴、こんな姿にまで化けたのに、食わずに何を待つんだ。」
      悟空「兄弟、食べ物のことは小さいが、天機（てんき）が漏れるのは大事だ。神像をみんな床へ落としたままだろう。もし早起きの道士が鐘をついたり掃除をしたりしに来て、つまずいて転んだら、秘密がばれてしまうじゃないか。どこかへ隠してこい。」
      八戒「ここは初めてで、勝手がまるで分からない。どこへ隠せばいいんだ。」
      悟空「さっき入ってきたとき、右手に小さな門が一つあった。中からひどい臭気が人を襲ってきたから、きっと五穀輪廻（ごこくりんね）の所だ。そこへ運んでおけ。」
    "translation_status": "draft"
  - "id": "xy-ch44-033"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這獃子有些夯力量，跳下來，把三個聖像拿在肩膊上，扛將出來。到那廂，用腳登開門看時，原來是個大東廁。笑道：「這個弼馬溫著然會弄嘴弄舌，把個毛坑也與他起個道號，叫做甚麼『五穀輪迴之所』。」那獃子扛在肩上且不丟了去，口裡嘓嘓噥噥的禱道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      八戒には馬鹿力があった。台から跳び下り、三体の神像を肩に担いで外へ運んだ。そこへ行って足で門を蹴り開けると、なるほど、大きな東厠（とうし）だった。八戒は笑った。
      八戒「あの弼馬温（ひつばおん）は、本当に口がうまい。肥だめにまで道士の名みたいなものを付けて、何が『五穀輪廻の所』だ。」
      八戒はまだ神像を投げ込まず、肩に担いだまま、口の中でぶつぶつと祈った。
    "translation_status": "draft"
  - "id": "xy-ch44-034"
    "section_id": "chapter-44"
    "kind": "verse"
    "origin": "source"
    "source_text": "「三清，三清，我說你聽：遠方到此，慣滅妖精。欲享供養，無處安寧。借你坐位，略略少停。你等坐久，也且暫下毛坑。你平日家受用無窮，做個清淨道士；今日裡不免享些穢物，也做個受臭氣的天尊！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      八戒「三清よ、三清よ、俺の言うことを聞いてくれ。
      遠方からここへ来た、妖怪退治ならお手のもの。
      供物にあずかりたいのに、落ち着ける場所がない。
      あんたたちの席を借り、ほんのしばらく休ませてくれ。
      あんたたちは長く座ったから、ひとまず肥だめへ下りてくれ。
      いつもは尽きぬ供物を楽しみ、清らかな道士でいるのだろうが、
      今日ばかりは汚物も味わって、悪臭を受ける天尊にもなってもらおう！」
    "translation_status": "draft"
  - "id": "xy-ch44-035"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "祝罷，烹的望裡一捽，灒了半衣襟臭水，走上殿來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 170
        "line_end": 170
    "translation_ja": "祈り終えると、どぼんと中へ放り投げた。臭い水が跳ねて衣の前を半分ぬらしたが、八戒はそのまま殿へ戻ってきた。"
    "translation_status": "draft"
  - "id": "xy-ch44-036"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「可藏得好麼？」八戒道：「藏便藏得好，只是灒起些水來，污了衣服，有些醃臟臭氣，你休惡心。」行者笑道：「也罷，你且來受用。但不知可得個乾淨身子出門哩。」那獃子還變做老君，三人坐下，盡情受用。先吃了大饅頭，後吃簇盤、襯飯、點心、拖爐、餅錠、油煠、蒸酥，那裡管甚麼冷熱，任情吃起。原來孫行者不大吃煙火食，只吃幾個果子，陪他兩個。那一頓如流星趕月，風捲殘雲，吃得罄盡，已此沒得吃了。還不走路，且在那裡閑講，消食耍子。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      悟空「うまく隠したか。」
      八戒「隠すにはうまく隠した。ただ、水が少し跳ねて服を汚したので、ちょっと汚い匂いがする。気持ち悪がらないでくれよ。」
      悟空は笑った。
      悟空「まあいい。こっちへ来て食べろ。ただ、きれいな体でここを出られるかどうかは、分からないぞ。」
      八戒はまた老君の姿に変わり、三人は座って心ゆくまで食べた。まず大きな饅頭を食べ、続いて盛り合わせの皿、供え飯、点心、拖炉（たろ）、餅錠（へいてい）、油煠（ゆさつ）、蒸酥（じょうそ）を食べた。冷たいか熱いかなど構わず、好きなだけ食べる。もともと悟空は人間の煮炊きした食べ物をあまり口にしないので、果物をいくつか食べ、二人につき合うだけだった。その一食は、流星が月を追い、風が残り雲を巻き払うような勢いで、すっかり食べ尽くし、もう何も残らなかった。それでも立ち去らず、そこで気ままな話をし、腹ごなしをして遊んでいた。
    "translation_status": "draft"
  - "id": "xy-ch44-037"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "噫！有這般事。原來那東廊下有一個小道士才睡下，忽然起來道：「我的手鈴兒忘記在殿上，若失落了，明日師父見責。」與那同睡者道：「你睡著，等我尋去。」急忙中不穿底衣，止扯一領直裰，徑到正殿中尋鈴。摸來摸去，鈴兒摸著了。正欲回頭，只聽得有呼吸之聲。道士害怕，急拽步往外走時，不知怎的，屣著一個荔枝核子，撲的滑了一跌。噹的一聲，把個鈴兒跌得粉碎。豬八戒忍不住呵呵大笑出來。把個小道士諕走了三魂，驚回了七魄，一步一跌，撞到那方丈外，打著門叫：「師公，不好了，禍事了。」三個老道士還未曾睡，即開門問：「有甚禍事？」他戰戰兢兢道：「弟子忘失了手鈴兒，因去殿上尋鈴，只聽得有人呵呵大笑，險些兒諕殺我也。」老道士聞言，即叫：「掌燈來，看是甚麼邪物？」一聲傳令，驚動那兩廊的道士，大大小小，都爬起來點燈著火，往正殿上觀看。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      さて、こんなことが起きた。東の廊下にいた若い道士が、寝たばかりなのに、突然起き上がって言った。
      若い道士「手鈴を殿に忘れてきた。なくしたら、明日、師父に叱られる。」
      同じ所で寝ている者に声をかけた。
      若い道士「君は寝ていてくれ。私が捜してくる。」
      慌てていたので下着も着けず、直裰（ちょくたつ）を一枚引っ掛けただけで、まっすぐ本殿へ鈴を捜しに行った。あちらこちらと手探りするうち、鈴が見つかった。戻ろうとしたところ、息をする音が聞こえた。道士は怖くなり、急いで外へ出ようとしたが、どうしたことか、ライチの種を踏んで滑り、どんと転んだ。からんという音とともに、鈴は落ちて粉々になった。八戒はこらえきれず、からからと大笑いした。若い道士は三魂（さんこん）が飛び出し、七魄（しちはく）が縮み上がるほど驚き、一歩ごとにつまずきながら、方丈の外へ転がり着いた。戸をたたいて叫んだ。
      若い道士「師公（しこう）、大変です！　災いです！」
      三人の老道士はまだ寝ておらず、すぐ戸を開けて尋ねた。
      三人の老道士「どんな災いだ。」
      若い道士はぶるぶる震えて答えた。
      若い道士「弟子の私が手鈴を忘れ、殿へ捜しに参りましたところ、誰かがからからと大笑いするのが聞こえ、危うく驚き死ぬところでした。」
      三人の老道士はそれを聞くと、すぐに命じた。
      三人の老道士「灯を持て！　何の邪物か見てやろう。」
      その一声の命令で、両側の廊下にいる道士たちは、年長も年少もみな飛び起き、灯をともし火をつけ、本殿へ様子を見に向かった。
    "translation_status": "draft"
  - "id": "xy-ch44-038"
    "section_id": "chapter-44"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不知端的何如，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch44-1455593"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第044回&oldid=1455593"
        "line_start": 175
        "line_end": 175
    "translation_ja": "さて、実際にはどうなるのか。それは次回のお話。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-01-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「法身」「元運」「車力」「脊關」は、車を引いて関門と細道を越える物語と、身体の内で気を巡らせる内丹の表現を重ねるものと読める。「元」は根源の気、「脊関」は背の関門の意として語を残したが、寓意の対応を一義的に決めてはいない。『重陽真人金關玉鎖訣』の「夾脊為雙關」は、康自強の論文が引用している。参照：https://www.ch.ntnu.edu.tw/SIS/downloadfile.php?issue_id=12&paper_id=57&periodicalsPage=2 （検索本文で確認）。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-02-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "月の兎と日の烏は月日を表す伝統的な像。「三千界」「四百州」の数を残し、特定の行政区画数への訂正はしない。「微塵眼底三千界」は眼下の広大な世界さえ塵のように見える像として訳した。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-03-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三陽」は易の陽爻が三つそろう旧暦正月、春の到来をいう。「太昊乘震」は春・東方の神と、東を表す震との対応を残した。「勾芒御辰」の辰はこの春の時・時運と解し、辰刻という特定時刻には限定しない。勾芒を一般的な別表記の句芒へ書き換えない。参照：https://kotobank.jp/word/三陽-1327766 、https://kotobank.jp/word/太皡-2058260"
    "translation_status": "draft"
  - "id": "xy-ch44-note-04-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「夾脊小路」は背骨のような尾根の狭い道として訳した。本文の二つの関門・急な崖と、回題にもある内丹的な脊関の像を残し、地形の正確な断面は特定しない。原文の「土坯」は焼成しない煉瓦で、「磚瓦」と分けた。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-05-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「起手」は挨拶・拝礼の言葉として訳した。「水火籃兒」は教育部辞典が本作の同じ箇所を引用し、食べ物を入れる小籠と説明する。参照：https://pedia.cloud.edu.tw/Entry/Detail?title=水火籃兒"
    "translation_status": "draft"
  - "id": "xy-ch44-note-06-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三人の師の名と、二十年前の旱魃・雨乞い・国王との関係は、二人の道士の説明として示す。彼らの本体や動物種はこの回では明かされないため、名前の字から先取りしていない。「有親」「結為親」は身内として遇される関係をいい、実際の血縁や婚姻を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-07-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "道士の説明では僧も道士も朝廷から食糧を受けていたとされる。その後の寺院破壊、仏像破壊、度牒の没収、帰郷禁止、労働への下賜、火・掃除・門番の役務をすべて残した。「頂門」はこの並列では門番と解した。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-08-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「命犯華蓋、妨爺剋娘」は悟空がからかう際に持ち出す星占い的な説明で、僧たちの生い立ちを語り手が認定したものではない。「半個不少」は一人の半分さえ欠けないという誇張を残した。 「全不長俊」は、物事を理解できないというより、甲斐性・見込みがないとの悪口。教育部辞典「不長進」は別形「不長俊」を示し、進歩しない、見込みがないなどの意を挙げる。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=21297&la=0&powerMode=0"
    "translation_status": "draft"
  - "id": "xy-ch44-note-09-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「長壽」と「長受罪」は、中国語で「寿」と「受」の音が重なる語呂合わせ。「一字足りない」という応答と、長生きではなく長く苦しむという対比を残した。僧の人数は二千余、苦痛などで亡くなった者は六、七百、自死は七、八百、生存者は五百と、底本の概数をそのまま保持した。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-10-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「那里長要差官查勘」は「那里」を朝廷側、「長」を常にという意味に読み、しょっちゅう役人を遣わすとした。里長という村の役職が主語だと断定しない。五百人の内訳は左隣・右隣・父方・母方・親友の各百人。病気と死亡の二つの届出を経るという説明も保った。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-11-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「國師兄長先生」は国師・兄長・先生という敬称を重ねた王の呼び方。王に拝礼・暇乞いをしない扱いとともに示し、具体的な血縁にはしない。「會了人命出來」は殺人の件を明らかにして責任を問う趣旨と解した。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-12-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「磕額」は突き出た額、「無腮」は頬のない外貌を描く語として残した。「性情乖」はこの戯画的な詩ではひねくれた気性と解したが、機敏さを含む読みもあり、性格全体の断定ではない。詩は僧たちが太白金星の言葉として伝えた引用である。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-13-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「打發贖」は捕らえられて殴られ、金を納めさせられる罰として訳した。法制上の具体的な罪目や定額は特定しない。「百十」は百人ほどの概数として百人余りとし、千人には変えていない。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-14-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「先王太祖」は底本の呼び方を保つ。直前の王だけを指すのか、王朝の祖である太祖を指すのかを特定して年代や系譜を補っていない。太祖の像があるため智淵寺だけは壊されていないという説明は、僧たちの言葉にとどめる。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-15-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「高公」は、儀礼を主宰する道士をいう語と解し、通用表記の「高功」に無断で直していない。「揚塵」は払子を振る動作、「表白」は祈りの文の読み上げ、「查罡佈斗」は北斗に対応する儀礼上の位置・配置を扱う動作と解した。儀礼の具体的な手順は確定しない。「化樂宮」は天上の宮殿の名を残し、仏教の特定の天との同定を断定しない。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-16-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "対聯は底本どおり二十二字と説明されているが、実際に掲げられた二句は句読を除けば各十一字、計二十二字である。日本語の字数を二十二字に合わせるための省略はしていない。三人の老道士を虎力・鹿力・羊力だろうと見るのは、この場では悟空の判断。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-17-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「修蘸」だが、供物と読経を伴う道教儀礼を指す文脈から修醮の意と解し、日本語では斎醮とした。原文欄の蘸は保持する。饅頭は中国の蒸しパン類。「斗大」と一個五、六十斤の焼き菓子という誇張は、現代単位へ換算せず残した。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-18-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "壁に掛けた「功德」は礼拝用の神仏画と解して「功徳画」とした。国立台湾歴史博物館の解説は功德畫を法会で壁に掛ける巻軸画と説明する。参照：https://tcmb.culture.tw/zh-tw/detail?id=11000129973&indexCode=MOCCOLLECTIONS 。「巽」は風・東南に対応する卦。語り手は風の術で花瓶などを倒したとするが、門を破壊したとは書いていない。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-19-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「五穀輪迴之所」は食べた穀物が排泄物となる巡りをいう、便所のもったいぶった呼び方。続く八戒の「道号」とのからかいに合わせ、婉曲名を残した。原文の「穢氣畜人」は臭気が人を襲う意と解したが、畜の字は原文欄で改めない。"
    "translation_status": "draft"
  - "id": "xy-ch44-note-20-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "供物は全品目を別々に訳した。「簇盤」は盛り合わせの皿、「襯飯」は供え飯。「餅錠」は糕餅類、「油煠」は油で揚げる麵食と教育部辞典にある。「拖爐」は小麦粉の焼き菓子と解した。「蒸酥」は菓子名としての使用を確認したが、細かな材料や製法、特定の現代菓子との一致は断定しない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=142290&la=0&powerMode=0 、https://dict.revised.moe.edu.tw/dictView.jsp?ID=19662&la=0&powerMode=0 、https://dict.revised.moe.edu.tw/dictView.jsp?ID=153878&la=0&powerMode=0 、https://journal.kci.go.kr/kucsi/archive/articlePdf?artiId=ART001578506"
    "translation_status": "draft"
  - "id": "xy-ch44-note-21-body"
    "section_id": "chapter-44"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「底衣」は直裰の下に着る衣類。ここでは下着と訳し、上下の別や具体的な形状は確定しない。「三魂」「七魄」は恐怖の誇張として数を残し、現実に死んだという意味にはしない。最後に応じる「老道士」は三人が直前の主語なので合同の発言とし、特定の一人に決めつけない。"
    "translation_status": "draft"

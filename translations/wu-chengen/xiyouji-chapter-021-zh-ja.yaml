    "status": "open"
    "message_ja": "「金花耀眼意朦朧」は身につけた金花とそのおぼろげな趣をいうと解したが、具体的な装飾と句意に留保がある。"
- "id": "xy-ch21-027"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒望見大喜道：「師兄，常言道：『要知山下路，須問去來人。』你上前問他一聲，何如？」真個大聖藏了鐵棒，放下衣襟，上前叫道：「老公公，問訊了。」那老者半答不答的還了個禮道：「你是那裡和尚？這曠野處，有何事幹？」行者道：「我們是取經的聖僧。昨日在此失了師父，特來動問公公一聲：靈吉菩薩在那裡住？」老者道：「靈吉在直南上，到那裡還有三千里路。有一山，呼名小須彌山，山中有個道場，乃是菩薩講經禪院。汝等是取他的經去了？」行者道：「不是取他的經，我有一事煩他，不知從那條路去。」老者用手向南指道：「這條羊腸路就是了。」哄得那孫大聖回頭看路，那公公化作清風，寂然不見。只是路傍留下一張簡帖，上有四句頌子云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    八戒は老人を見ると、大喜びした。八戒「兄貴、『山の下の道を知りたければ、行き来する人に尋ねよ』というだろう。行ってひと声尋ねてみたらどうだ。」
    悟空は鉄棒をしまい、衣の裾を下ろして前へ進んだ。悟空「おじいさん、ご挨拶申し上げます。」
    老人はそっけなく礼を返した。道ばたの老人「どこの僧だね。この荒野に何の用か。」
    悟空「私たちは経をいただきに行く僧です。昨日ここで師匠を失いまして、おじいさんにお尋ねしたいのです。霊吉菩薩はどこにお住まいでしょう。」
    道ばたの老人「霊吉菩薩はまっすぐ南だ。ここからまだ三千里ある。小須弥山（しょうしゅみせん）という山に道場があって、それが菩薩の経を説く寺だ。お前たちは、あの方の経をいただきに行くのかね。」
    悟空「その方の経をいただくのではなく、一つお願いしたいことがあるのです。どの道を行けばよいのでしょう。」
    老人は南を指さした。道ばたの老人「この曲がりくねった細い道だよ。」
    悟空がつられて振り返り、道を見た隙に、老人は清らかな風と化し、音もなく姿を消した。ただ道ばたに一枚の書付が残り、四句の偈が記されていた。
  "translation_status": "reviewed"
- "id": "xy-ch21-028"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    上覆齊天大聖聽：老人乃是李長庚。
    須彌山有飛龍杖，靈吉當年受佛兵。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 187
    "line_end": 188
  "translation_ja": |-
    斉天大聖（せいてんたいせい）へ申し上げる、あの老人こそ李長庚（りちょうこう）である。
    須弥山（しゅみせん）には飛竜杖（ひりゅうじょう）あり、霊吉（れいきつ）はかつて仏からこの武器を授かった。
  "translation_status": "reviewed"
- "id": "xy-ch21-029"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者執了帖兒，轉身下路。八戒道：「哥啊，我們連日造化低了，這兩日白日裡見鬼。那個化風去的老兒是誰？」行者把帖兒遞與八戒，念了一遍道：「李長庚是那個？」行者道：「是西方太白金星的名號。」八戒慌得望空下拜道：「恩人，恩人，老豬若不虧金星奏准玉帝啊，性命也不知化作甚的了。」行者道：「兄弟，你卻也知感恩。但莫要出頭，只藏在這樹林深處，仔細看守行李、馬匹。等老孫尋須彌山，請菩薩去耶。」八戒道：「曉得，曉得，你只管快快前去。老豬學得個烏龜法，得縮頭時且縮頭。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 189
    "line_end": 189
  "translation_ja": |-
    悟空は書付を手に取り、振り返って道を下りた。
    八戒「兄貴、このところ運が悪いな。二日続けて白昼に化け物を見るとは。風になって消えたあの爺さんは誰だ。」
    悟空が書付を渡すと、八戒はひと通り読んで尋ねた。八戒「李長庚というのは誰なんだ。」
    悟空「西方の太白金星（たいはくきんせい）の名だ。」
    八戒は慌てて空に向かって拝んだ。八戒「恩人だ、恩人だ。金星（きんせい）が玉帝（ぎょくてい）にお取りなしくださらなければ、この俺の命もどうなっていたことか。」
    悟空「兄弟、お前も恩を知っているんだな。ただし、ここから顔を出すなよ。この林の奥に隠れて、荷物と馬をしっかり守っていてくれ。俺は須弥山を探して、菩薩をお迎えに行く。」
    八戒「分かった、分かった。早く行ってきてくれ。俺は亀の術を覚えたから、首を引っ込められるうちは引っ込めておくよ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「行者把帖兒遞與八戒，念了一遍道」の読んで問う主語は明示されないが、書付を受け取る八戒と悟空の返答から、問いを八戒に割り当てた。"
- "id": "xy-ch21-030"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖跳在空中，縱觔斗雲，徑往直南上去，果然速快，他點頭經過三千里，扭腰八百有餘程。須臾，見一座高山，半中間有祥雲出現，瑞藹紛紛。山凹裡果有一座禪院，只聽得鐘磬悠揚，又見那香煙縹緲。大聖直至門前，見一道人，項掛數珠，口中念佛。行者道：「道人作揖。」那道人躬身答禮道：「那裡來的老爺？」行者道：「這可是靈吉菩薩講經處麼？」道人道：「此間正是，有何話說？」行者道：「累煩你老人家與我傳答傳答：我是東土大唐駕下御弟三藏法師的徒弟齊天大聖孫悟空行者，今有一事，要見菩薩。」道人笑道：「老爺字多話多，我不能全記。」行者道：「你只說是唐僧徒弟孫悟空來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    悟空は空へ跳び上がり、觔斗雲（きんとうん）を飛ばしてまっすぐ南へ向かった。まことに速い。ひとうなずきで三千里を過ぎ、腰をひとひねりすれば八百里あまりを進む。ほどなく、高い山の中腹にめでたい雲がたなびき、瑞気が群がるのが見えた。山のくぼみには確かに寺があり、鐘や磬の音が遠く響き、香の煙がかすかに漂っていた。
    悟空が門前まで行くと、首に数珠をかけて念仏を唱える修行者がいた。悟空「修行者どの、ご挨拶申し上げる。」
    修行者は身をかがめて礼を返した。寺の修行者「どちらからいらっしゃったお方ですか。」
    悟空「ここは霊吉菩薩が経を説かれる所か。」
    寺の修行者「さようでございます。どのようなご用ですか。」
    悟空「お手数だが、こう取り次いでくれ。私は東土大唐の天子の御弟（ぎょてい）、三蔵法師（さんぞうほうし）の弟子、斉天大聖孫悟空行者（そんごくうぎょうじゃ）。お願いがあって菩薩にお目にかかりたい、と。」
    修行者は笑った。寺の修行者「お方のお名前もお言葉も長くて、すべては覚えられません。」
    悟空「それなら、唐僧（とうそう）の弟子、孫悟空が来たとだけ言ってくれ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「道人」は数珠をかけ念仏して仏教寺院で取次ぐ人物なので、「寺の修行者」とした。道教の道士とは決めつけない。"
- "id": "xy-ch21-031"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "道人依言，上講堂傳報。那菩薩即穿袈裟，添香迎接。這大聖才舉步入門，往裡觀看，只見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 192
    "line_end": 192
  "translation_ja": "修行者は言われたとおり講堂へ取り次ぎに行った。霊吉菩薩はすぐに袈裟を着け、香を焚き足して迎えた。悟空が門を入り、奥を見ると、こんな様子であった。"
  "translation_status": "reviewed"
- "id": "xy-ch21-032"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": "滿堂錦繡，一屋威嚴。眾門人齊誦《法華經》，老班首輕敲金鑄磬。佛前供養，盡是仙果仙花；案上安排，皆是素殽素品。輝煌寶燭，條條金燄射虹霓；馥郁真香，道道玉煙飛彩霧。正是那講罷心閑方入定，白雲片片繞松梢。靜收慧劍魔頭絕，般若波羅善會高。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 194
    "line_end": 194
  "translation_ja": |-
    堂には錦が満ち、建物には威厳があふれる。
    門人たちはそろって法華経（ほけきょう）を唱え、老いた班首（はんしゅ）は金鋳の磬を静かに打つ。
    仏前の供え物はすべて仙果と仙花、机に並ぶのはみな精進の料理。
    輝く宝の燭は一本ごとに金の炎を放って虹を射抜き、かぐわしい香は筋ごとに玉の煙を上げ、彩る霞を飛ばす。
    まさに、説法を終えて心は静まり、禅定に入れば、白雲がひらひら松の梢をめぐる。
    静かに智慧の剣を収めて魔を断ち、般若波羅（はんにゃはら）の尊い集いは高くそびえる。
  "translation_status": "reviewed"
- "id": "xy-ch21-033"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩整衣出迓，行者登堂，坐了客位，隨命看茶。行者道：「茶不勞賜，但我師父在黃風山有難，特請菩薩施大法力降怪救師。」菩薩道：「我受了如來法令，在此鎮押黃風怪。如來賜了我一顆定風丹、一柄飛龍寶杖。當時被我拿住，饒了他的性命，放他去隱性歸山，不許傷生造孽。不知他今日欲害令師，有違教令，我之罪也。」那菩薩欲留行者，治齋相敘，行者懇辭，隨取了飛龍杖，與大聖一齊駕雲。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 196
    "line_end": 196
  "translation_ja": |-
    霊吉菩薩は衣を整えて出迎えた。悟空は堂へ上がって客の席に座り、菩薩は茶を出すよう命じた。
    悟空「お茶には及びません。師匠が黄風山（こうふうざん）で難に遭っております。どうか大いなる法力で妖怪を降し、師匠をお救いください。」
    霊吉菩薩「私は如来（にょらい）の命を受け、この地で黄風怪を押さえる役目を負っています。如来から定風丹（ていふうたん）一粒と飛竜宝杖（ひりゅうほうじょう）一本を授かりました。以前あれを捕らえた際、命を助け、本性を抑えて山へ戻らせ、生き物を傷つけ罪を犯してはならぬと命じたのです。それが今日、あなたの師を害そうとしていたとは知りませんでした。教えに背かせたのは、私の罪です。」
    菩薩は悟空を引き留め、精進料理でもてなして語り合おうとしたが、悟空は丁重に辞退した。そこで菩薩は飛竜杖を取り、悟空とともに雲に乗った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「隱性歸山」は本性を抑えて山へ帰る趣旨と解した。隱姓などの別字へ無断補訂しない。"
- "id": "xy-ch21-034"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，至黃風山上。菩薩道：「大聖，這妖怪有些怕我，我只在雲端內住定，你下去與他索戰，誘他出來，我好施法力。」行者依言，按落雲頭，不容分說，掣鐵棒把他洞門打破。叫道：「妖怪，還我師父來也！」慌得那把門小妖急忙傳報。那怪道：「這潑猴著實無禮，再不伏善，反打破我門。這一出去，使陣神風，定要把他吹死。」仍前披掛，手綽鋼叉，又走出門來。見了行者，更不打話，撚叉當胸就刺；大聖側身躲過。舉棒對面相還戰不數合，那怪吊回頭，望巽地上，才待要張口呼風，只見那半空裡，靈吉菩薩將飛龍寶杖丟將下來，不知念了些甚麼咒語，卻是一條八爪金龍，撥喇的掄開兩爪，一把抓住妖精，提著頭，兩三捽，捽在山石崖邊，現了本相，卻是一個黃毛貂鼠。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    ほどなく黄風山の上に着いた。
    霊吉菩薩「大聖、この妖怪は私をいくらか恐れています。私は雲の中にとどまりますから、あなたは下りて戦いを挑み、外へ誘い出してください。そうすれば法力を使えます。」
    悟空は言われたとおり雲を下り、問答無用で鉄棒を抜いて洞窟の門を打ち壊した。悟空「妖怪、俺の師匠を返せ！」
    門番の小妖は驚いて急いで知らせに走った。
    黄風怪「この乱暴な猿め、まったく無礼だ。おとなしくならぬどころか、私の門を打ち壊すとは。今度こそ神風を起こして、必ず吹き殺してやる。」
    黄風怪は前と同じく武装し、鋼の叉をつかんで門を出た。悟空を見るなりひと言も交わさず、叉をひねって胸を突く。悟空は身をかわし、棒を振り上げて正面から応じた。
    数合も戦わぬうち、黄風怪は首を返して巽の方を向き、口を開いて風を呼ぼうとした。そのとき、空中の霊吉菩薩が飛竜宝杖を投げ下ろし、何やら呪文を唱えた。杖は八つ爪の金竜となり、ばさっと二つの爪を振り広げ、妖怪をひとつかみにした。頭をつかんで二、三度振り回し、山の岩壁のきわへ叩きつけると、妖怪は正体を現した。それは黄色い毛の貂鼠（ちょうそ）だった。
  "translation_status": "reviewed"
- "id": "xy-ch21-035"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者趕上，舉棒就打，被菩薩攔住道：「大聖，莫傷他命我還要帶他去見如來。」又對行者道：「他本是靈山腳下的得道老鼠，因為偷了琉璃盞內的清油，燈火昏暗，恐怕金剛拿他，故此走了，卻在此處成精作怪。如來照見了他，不該死罪，故著我轄押，但他傷生造孽，拿上靈山。今又衝撞大聖，陷害唐僧，我拿他去見如來，明正其罪，才算這場功績哩。」行者聞言，卻謝了菩薩。菩薩西歸不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 199
    "line_end": 199
  "translation_ja": |-
    悟空は駆け寄り、棒を振り上げて打とうとしたが、菩薩が止めた。霊吉菩薩「大聖、命を奪ってはなりません。私はまだこれを如来のもとへ連れていかねばなりません。」
    さらに悟空へ説明した。霊吉菩薩「これはもと霊山（れいざん）の麓で道を得た鼠です。瑠璃の灯皿の清らかな油を盗み、灯火を暗くしてしまったので、金剛に捕らえられるのを恐れて逃げ出し、ここで妖怪となって悪さをしていたのです。如来はそのことを見通しましたが、死罪には当たらぬとして、私に監督させ、生き物を傷つけ罪を犯したときには霊山へ連行するよう命じました。今また大聖に逆らい、唐僧を陥れましたから、如来のもとへ引き立て、その罪を明らかにして正さねば、この一件の手柄も成し遂げたことにはなりません。」
    悟空は聞き終えると、菩薩に礼を述べた。菩薩は西へ帰っていった。こちらはひとまず置いておく。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「莫傷他命我還要…」の句読欠落は原文のままとし、訳文のみ文を区切った。「但他傷生造孽，拿上靈山」は、罪を犯したときに連行するという如来の条件付き命令と解した。"
- "id": "xy-ch21-036"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說豬八戒在那林內，正思量行者，只聽得山坂下叫聲：「悟能兄弟，牽馬挑擔來耶。」那獃子認得是行者聲音，急收拾跑出林外，見了行者道：「哥哥，怎的幹事來？」行者道：「請靈吉菩薩，使一條飛龍杖，拿住妖精，原來是個黃毛貂鼠成精，被他帶去靈山見如來去了。我和你洞裡去救師父。」那獃子才歡歡喜喜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 200
    "line_end": 200
  "translation_ja": |-
    さて、八戒は林の中で悟空のことを考えていた。すると坂の下から声がした。悟空「悟能（ごのう）、兄弟。馬を引いて、荷物を担いで来てくれ。」
    八戒は悟空の声と分かると、急いで身の回りをまとめ、林の外へ走り出た。悟空を見て尋ねた。八戒「兄貴、どう片がついたんだ。」
    悟空「霊吉菩薩をお願いしてお連れした。菩薩が飛竜杖を使って妖怪を捕らえたら、正体は黄色い毛の貂鼠の化け物だったんだ。菩薩が如来に会わせるため、霊山へ連れていかれた。さあ、一緒に洞窟へ入って師匠を助けよう。」
    八戒はようやく大喜びした。
  "translation_status": "reviewed"
- "id": "xy-ch21-037"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人撞入裡面，把那一窩狡兔、妖狐、香獐、角鹿，一頓釘鈀、鐵棒，盡情打死，卻往後園拜救師父。師父出得門來，問道：「你兩人怎生捉得妖精？如何方救得我？」行者將那請靈吉降妖的事情，陳了一遍。師父謝之不盡。他兄弟們把洞中素物，安排些茶飯吃了，方才出門，找大路向西而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 202
    "line_end": 202
  "translation_ja": |-
    二人は洞窟へ押し入り、そこに巣くう狡猾な兎、妖狐、麝香鹿、角鹿どもを、熊手と鉄棒で片端から打ち殺した。それから裏庭へ行き、師匠に礼をして救い出した。
    三蔵は門を出ると尋ねた。三蔵「お前たちはどうやって妖怪を捕らえ、私を救ってくれたのだね。」
    悟空は霊吉菩薩を迎えて妖怪を降した次第を、ひと通り述べた。三蔵は感謝してもしきれなかった。兄弟弟子は洞窟の精進の食材で茶と食事を整え、それを食べてから門を出て、街道を探し、西へ進んでいった。
  "translation_status": "reviewed"
- "id": "xy-ch21-038"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 204
    "line_end": 204
  "translation_ja": "さて、この先どうなることか。続きは次回のお話をお聞きいただきたい。"
  "translation_status": "reviewed"

  "translation_ja": |-
    第二十一回
    護法の神々、屋敷を設けて大聖を泊め　須弥山の霊吉、風魔を鎮める
  "translation_status": "reviewed"
- "id": "xy-ch21-002"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那五十個敗殘的小妖拿著些破旗、破鼓，撞入洞裡，報道：「大王，虎先鋒戰不過那毛臉和尚，被他趕下東山坡去了。」老妖聞說，十分煩惱。正低頭不語，默思計策，又有把前門的小妖道：「大王，虎先鋒被那毛臉和尚打殺了，拖在門口罵戰哩。」那老妖聞言，愈加煩惱道：「這廝卻也無知。我倒不曾吃他師父，他轉打殺我家先鋒，可恨！可恨！」叫：「取披掛來。我也只聞得講甚麼孫行者，等我出去，看是個甚麼九頭八尾的和尚，拿他進來，與我虎先鋒對命。」眾小妖急急擡出披掛。老妖結束齊整，綽一杆三股鋼叉，帥群妖跳出本洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、敗残の小妖五十人は、破れた旗や壊れた太鼓を持って洞窟へ駆け込み、報告した。敗残の小妖たち「大王、虎先鋒（こせんぽう）はあの毛むくじゃらの僧にかなわず、山の東の坂へ追われていきました。」
    黄風怪（こうふうかい）はこれを聞き、ひどく思い悩んだ。うつむいて黙り込み、手立てを考えていると、今度は表門の番をする小妖が言った。門番の小妖「大王、虎先鋒があの毛むくじゃらの僧に殺されました。死骸を門前まで引きずってきて、悪口を浴びせながら戦いを挑んでおります。」
    黄風怪はますます腹を立てた。黄風怪「何もわきまえぬ奴だ。私はまだあいつの師匠を食っていないのに、向こうはこちらの先鋒を殺すとは。憎い、憎い！」
    さらに叫んだ。黄風怪「鎧を持ってこい。孫行者（そんぎょうじゃ）とかいう名は聞いているが、私が出ていって、九つの頭に八つの尾でもある僧なのか見てやろう。捕らえてきて、虎先鋒の命を償わせるのだ。」
    小妖たちは急いで武具を運び出した。黄風怪は身支度を整え、三つ又の鋼の叉を引っつかむと、妖怪たちを率いて洞窟から飛び出した。
  "translation_status": "reviewed"
- "id": "xy-ch21-003"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖停立門外，見那妖走將出來，著實驍勇。看他怎生打扮，但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 123
    "line_end": 123
  "translation_ja": "悟空（ごくう）は門の外に立っていた。出てきた黄風怪を見ると、まことに勇ましい。その身なりはどうかというと、こんな姿であった。"
  "translation_status": "reviewed"
- "id": "xy-ch21-004"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": "金盔晃日，金甲凝光。盔上纓飄山雉尾，羅袍罩甲淡鵝黃。勒甲絛盤龍耀彩，護心鏡繞眼輝煌。鹿皮靴，槐花染色；錦圍裙，柳葉絨妝。手持三股鋼叉利，不亞當年顯聖郎。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    金の兜は日にきらめき、金の鎧には光が宿る。
    兜の飾りには山雉の尾がなびき、鎧の上の薄絹の袍は淡い黄色。
    鎧を締める組紐には竜がとぐろを巻いて彩り輝き、胸を守る鏡は目を射るほどに光る。
    鹿革の長靴は槐の花で染められ、錦の前垂れには柳葉模様の織り飾り。
    手には鋭い三つ又の鋼の叉、かつての顕聖郎（けんせいろう）にも劣らない。
  "translation_status": "reviewed"
- "id": "xy-ch21-005"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老妖出得門來，厲聲高叫道：「那個是孫行者？」這行者腳屣著虎怪的皮囊，手執著如意的鐵棒，答道：「你孫外公在此。送出我師父來。」那怪仔細觀看，見行者身軀鄙猥，面容羸瘦，不滿四尺。笑道：「可憐，可憐。我只道是怎麼樣扳翻不倒的好漢，原來是這般一個骷髏的病鬼。」行者笑道：「你這個兒子，忒沒眼色。你外公雖是小小的，你若肯照頭打一叉柄，就長三尺。」那怪道：「你硬著頭，吃吾一柄。」大聖公然不懼。那怪果打一下來。他把腰躬一躬，足長了三尺，有一丈長短。慌得那妖把鋼叉按住，喝道：「孫行者，你怎麼把這護身的變化法兒，拿來我門前使出？莫弄虛頭，走上來，我與你見見手段。」行者笑道：「兒子啊，常言道：『留情不舉手，舉手不留情。』你外公手兒重重的，只怕你捱不起這一棒。」那怪那容分說，撚轉鋼叉，望行者當胸就刺；這大聖正是會家不忙，忙家不會，理開鐵棒，使一個「烏龍掠地勢」，撥開鋼叉，又照頭便打。他二人在那黃風洞口，這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    黄風怪は門を出るなり、鋭い声で叫んだ。黄風怪「どいつが孫行者だ。」
    悟空は虎先鋒の死骸を足で踏み、如意の鉄棒を手に答えた。悟空「お前のおじいさま、この孫悟空（そんごくう）がここにいるぞ。俺の師匠を返せ。」
    黄風怪はよくよく見た。悟空はみすぼらしい体つきで顔も痩せこけ、背丈は四尺にも足りない。黄風怪は笑った。黄風怪「哀れな奴だ。どれほど倒しても倒れぬ豪傑かと思えば、こんな骸骨じみた病人だったとは。」
    悟空も笑った。悟空「せがれめ、見る目のない奴だな。おじいさまはちっぽけだが、この頭を叉の柄で一つ打てば、三尺は伸びてやるぞ。」
    黄風怪「頭をしっかり据えて、この柄を受けてみろ。」
    悟空は平然として恐れない。黄風怪が本当に打ち下ろすと、悟空は腰を一つかがめ、まるまる三尺伸びて一丈ほどになった。黄風怪は驚いて叉を押さえ、怒鳴った。黄風怪「孫行者、身を守る変化の術を、なぜ私の門前で見せびらかす。こけおどしはやめて、こちらへ来い。腕前を見てやろう。」
    悟空は笑った。悟空「せがれよ、『情けをかけるなら手は出さぬ、手を出すからには情けはかけぬ』というだろう。おじいさまの手は重いぞ。この棒の一撃に、お前が耐えられるか心配だ。」
    黄風怪は皆まで言わせず鋼の叉をひねり、悟空の胸をめがけて突き出した。さすが悟空、心得のある者は慌てず、慌てる者は心得がない。鉄棒をさばき、「烏竜掠地（うりゅうりゃくち）の構え」で叉を払い、すぐさま頭へ打ち下ろした。黄風洞（こうふうどう）の前で、二人は激しく戦った。
  "translation_status": "reviewed"

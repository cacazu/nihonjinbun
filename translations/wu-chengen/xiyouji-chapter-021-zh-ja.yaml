    - "xy-ch21-005"
    "description_ja": "身長は底本で「不滿四尺」、三尺伸びて「有一丈長短」となる。数値の不整合らしさを独自換算・修正せず保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-008"
    "description_ja": "風の長詩の「嶺坫」は難語で、山の裾・張り出しが崩れる意味を採った。「魯班吊了金頭鑽」は吊を取り落とす意に解したが、字義と異文の再検討を要する。原文は無補訂。 「梓橦」は梓潼帝君を指すと推定するが、底本の字を保持した。「灌州城」「十代閻王」も通行表記へ無断で直さない。風の被害の列挙は語りの誇張として全行を訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-014"
    "description_ja": "夾腦風・羊耳風・大麻風・偏正頭風は「風」と病名をかける言葉遊び。現代の診断名を確定せず、底本の病名を保持した。胡麻飯の具体的な穀物・調理法は断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-016"
    "description_ja": "「躲門戶」は戸に課される公的負担を逃れる含意と解し、何の税役かは断定しない。引越しと家屋解体は八戒の推測として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-026"
    "description_ja": "「金花耀眼意朦朧」は身につけた金花とそのおぼろげな趣をいうと解したが、具体的な装飾と句意に留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-029"
    "description_ja": "「行者把帖兒遞與八戒，念了一遍道」の読んで問う主語は明示されないが、書付を受け取る八戒と悟空の返答から、問いを八戒に割り当てた。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-030"
    "description_ja": "「道人」は数珠をかけ念仏して仏教寺院で取次ぐ人物なので、「寺の修行者」とした。道教の道士とは決めつけない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-033"
    "description_ja": "「隱性歸山」は本性を抑えて山へ帰る趣旨と解した。隱姓などの別字へ無断補訂しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "segment_ids":
    - "xy-ch21-035"
    "description_ja": "「莫傷他命我還要…」の句読欠落は原文のままとし、訳文のみ文を区切った。「但他傷生造孽，拿上靈山」は、罪を犯したときに連行するという如来の条件付き命令と解した。 本文の欠落ではなく解釈・校訂上の留保。"

  "source_text": "他卻牽了馬，挑了擔，出山凹，行上路口。此時漸漸黃昏，只聽得路南山坡下有犬吠之聲。二人停身觀看，乃是一家莊院，影影的有燈火光明。他兩個也不管有路無路，漫草而行，直至那家門首。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 156
    "line_end": 156
  "translation_ja": "八戒は馬を引き、荷を担いで山のくぼみを出ると、道へ上がった。次第にたそがれが迫るころ、道の南側、山の斜面の下から犬の吠える声が聞こえた。二人が足を止めて見ると、一軒の屋敷があり、ぼんやりと灯火が光っている。二人は道があろうがなかろうがかまわず、草をかき分けて門前まで進んだ。見ると、こんなたたずまいである。"
  "translation_status": "reviewed"
- "id": "xy-ch21-012"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": "紫芝翳翳，白石蒼蒼。紫芝翳翳多青草，白石蒼蒼半綠苔。數點小螢光灼灼，一林野樹密排排。香蘭馥郁，嫩竹新栽。清泉流曲澗，古柏倚深崖。地僻更無遊客到，門前惟有野花開。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    紫の霊芝はこんもり茂り、白い石は青みを帯びる。
    霊芝のまわりには青草が多く、白い石には半ば緑の苔がつく。
    点々と小さな蛍が明るく光り、林の野の木々は密に並ぶ。
    蘭はかぐわしく香り、若竹は新たに植えられている。
    清い泉は曲がりくねる谷を流れ、古い柏は深い崖に寄りかかる。
    人里離れて旅人も来ず、門前にはただ野の花が咲いている。
  "translation_status": "reviewed"
- "id": "xy-ch21-013"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個不敢擅入，只得叫一聲：「開門，開門！」那裡有一老者，帶幾個年幼的農夫，叉鈀掃帚齊來，問道：「甚麼人？甚麼人？」行者躬身道：「我們是東土大唐聖僧的徒弟。因往西方拜佛求經，路過此山，被黃風大王拿了我師父去了，我們還未曾救得。天色已晚，特來府上告借一宵，萬望方便方便。」那老者答禮道：「失迎，失迎。此間乃雲多人少之處，卻才聞得叫門，恐怕是妖狐、老虎及山中強盜等類，故此小介愚頑，多有衝撞，不知是二位長老。請進，請進。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    二人は勝手に入るわけにもいかず、悟空と八戒「門を開けてください、開けてください！」と呼んだ。
    すると一人の老人が、若い農夫を何人か連れて出てきた。皆、叉や熊手や箒を持っている。宿の老人「誰だ、誰だ。」
    悟空は身をかがめた。悟空「私たちは東土（とうど）大唐（だいとう）の聖僧の弟子です。西へ仏を拝み、経をいただきに行く途中、この山を通ったところ、黄風大王（こうふうだいおう）に師匠をさらわれてしまいました。まだ助け出せておりません。日が暮れましたので、お屋敷で一晩泊めていただきたく参りました。どうかお慈悲をおかけください。」
    老人は礼を返した。宿の老人「お迎えもせず失礼しました。ここは雲ばかり多く、人の少ない所です。門前から呼ぶ声を聞いて、妖狐か虎か、山賊のたぐいかと思ったものですから。下男どもが無骨で、お二人が長老とは知らず、ぶしつけをいたしました。どうぞ、どうぞお入りください。」
  "translation_status": "reviewed"
- "id": "xy-ch21-014"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兄弟們牽馬挑擔而入，徑至裡邊，拴馬歇擔，與莊老拜見敘坐。又有蒼頭獻茶。茶罷，捧出幾碗胡麻飯。飯畢，命設鋪就寢。行者道：「不睡還可，敢問善人，貴地可有賣眼藥的？」老者道：「是那位長老害眼？」行者道：「不瞞你老人家說，我們出家人自來無病，從不曉得害眼。」老人道：「既不害眼，如何討藥？」行者道：「我們今日在黃風洞口救我師父，不期被那怪將一口風噴來，吹得我眼珠酸痛，今有些眼淚汪汪，故此要尋眼藥。」那老者道：「善哉，善哉！你這個長老，小小的年紀，怎麼說謊？那黃風大王，風最利害。他那風，比不得甚麼春秋風、松竹風與那東西南北風。……」八戒道：「想必是夾腦風、羊耳風、大麻風、偏正頭風？」長者道：「不是，不是。他叫做三昧神風。」行者道：「怎見得？」老者道：「那風能吹天地暗，善刮鬼神愁，裂石崩崖惡，吹人命即休。你們若遇著他那風吹了時，還想得活哩？只除是神仙，方可得無事。」行者道：「果然，果然。我們雖不是神仙，神仙還是我的晚輩。這條命急切難休，卻只是吹得我眼珠酸痛。」那老者道：「既如此說，也是個有來頭的人。我這敝處卻無賣眼藥的。老漢也有些迎風冷淚，曾遇異人，傳了一方，名喚三花九子膏，能治一切風眼。」行者聞言，低頭唱喏道：「願求些兒，點試點試。」那老者應承，即走進去，取出一個瑪瑙石的小罐兒來，拔開塞口，用玉簪兒蘸出少許，與行者點上，教他不得睜開，寧心睡覺，明早就好。點畢，收了石罐，徑領小介們退於裡面。"
  "source_languages":
  - "zh-Hant"

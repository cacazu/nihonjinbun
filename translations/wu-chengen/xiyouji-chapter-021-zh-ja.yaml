- "id": "xy-ch21-009"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖怪使出這陣狂風，就把孫大聖毫毛變的小行者刮得在那半空中卻似紡車兒一般亂轉，莫想掄得棒，如何攏得身？慌得行者將毫毛一抖，收上身來。獨自個舉著鐵棒，上前來打。又被那怪劈臉噴了一口黃風，把兩隻火眼金睛刮得緊緊閉合，莫能睜開。因此難使鐵棒，遂敗下陣來。那妖收風回洞不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 154
    "line_end": 154
  "translation_ja": "黄風怪がこの暴風を起こすと、悟空の毛から変わった小さな悟空たちは、空中で糸車のようにぐるぐる回された。棒を振るうどころか、自分の身を保つことさえできない。悟空は慌てて毛を振るい、自分の身へ収めた。独り鉄棒を構えて攻めかかったが、黄風怪がまた顔の真正面から黄色い風を吹きつけたので、二つの火眼金睛（かがんきんせい）は固く閉じてしまい、開けられなくなった。これでは棒も使えず、悟空は敗れて退いた。黄風怪は風を収め、洞窟へ戻った。こちらはひとまず置いておく。"
  "translation_status": "reviewed"
- "id": "xy-ch21-010"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說豬八戒見那黃風大作，天地無光，牽著馬，守著擔，伏在山凹之間，也不敢睜眼，不敢擡頭，口裡不住的念佛許願；又不知行者勝負何如，師父死活何如。正在那疑思之時，卻早風定天晴。忽擡頭往那洞門前看處，卻也不見兵戈，不聞鑼鼓。獃子又不敢上他門，又沒人看守馬匹、行李，果是進退兩難，愴惶不已。憂慮間，只聽得孫大聖從西邊吆喝而來，他才欠身迎著道：「哥哥，好大風啊！你從那裡走來？」行者擺手道：「利害，利害！我老孫自為人，不曾見這大風。那老妖使一柄三股鋼叉，來與老孫交戰。戰到有三十餘合，是老孫使一個『身外身』的本事。把他圍打，他甚著急，故弄出這陣風來。果是兇惡，刮得我站立不住，收了本事，冒風而逃。──哏，好風！哏，好風！老孫也會呼風，也會喚雨，不曾似這個妖精的風惡。」八戒道：「師兄，那妖精的武藝如何？」行者道：「也看得過，叉法兒倒也齊整，與老孫也戰個手平。卻只是風惡了，難得贏他。」八戒道：「似這般怎生救得師父？」行者道：「救師父且等再處。不知這裡可有眼科先生，且教他把我眼醫治醫治。」八戒道：「你眼怎的來？」行者道：「我被那怪一口風噴將來，吹得我眼珠酸痛，這會子冷淚常流。」八戒道：「哥啊，這半山中，天色又晚，且莫說要甚麼眼科，連宿處也沒有了。」行者道：「要宿處不難，我料著那妖精還不敢傷我師父，我們且找上大路，尋個人家住下，過此一宵，明日天光，再來降妖罷。」八戒道：「正是，正是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    一方、八戒（はっかい）は黄色い風が荒れ狂い天地の光が失われると、馬を引いて荷物を守り、山のくぼみに伏せていた。目も開けられず、顔も上げられず、口では絶えず念仏を唱えて願をかける。悟空は勝ったのか負けたのか、師匠は生きているのか死んだのか、それも分からない。思い悩むうちに、風はやみ、空は晴れた。ふと顔を上げて洞窟の門を見ても、戦う姿はなく、銅鑼や太鼓も聞こえない。八戒は門へ近づく勇気もなく、かといって馬と荷物を見てくれる者もいない。進むも退くもままならず、うろたえるばかりだった。
    そこへ、西の方から悟空の呼ぶ声がした。八戒は身を起こして迎えた。八戒「兄貴、すごい風だったな。どこから来たんだ。」
    悟空は手を振った。悟空「ひどい、ひどい。俺も生まれてこのかた、こんな風は見たことがない。あの黄風怪が三つ又の鋼の叉でかかってきたから、三十合あまり戦って、身外身の術を使った。囲んで打ちかかると、ひどく慌ててあの風を出したんだ。まったく凶悪な風で、立っていられず、術を収めて風を突っ切り逃げてきた。くう、すさまじい風だ。くう、すさまじい！　この俺も風を呼び、雨を呼ぶが、あいつほどひどい風は起こせない。」
    八戒「兄貴、妖怪の武芸のほうはどうなんだ。」
    悟空「なかなかのものだ。叉の使い方もきちんとしていて、俺と互角に戦える。ただ、あの風がひどくてな。勝つのは難しい。」
    八戒「それじゃ、どうやってお師匠さまを救うんだ。」
    悟空「救う手は、ひとまずあとで考えよう。このあたりに目医者はいないか。まず俺の目を治してもらいたい。」
    八戒「目がどうした。」
    悟空「妖怪がひと吹き吹きつけた風で、目玉がうずいて痛むんだ。今も涙が止まらない。」
    八戒「兄貴、こんな山の中で、もう日も暮れる。目医者どころか、泊まる場所さえないぞ。」
    悟空「宿を見つけるのは難しくない。あいつも、まだ俺の師匠に手を出す気はないだろう。まず街道へ出て、人家を探して泊まろう。一晩明かして、明日明るくなってから、また妖怪を退治しに来ればいい。」
    八戒「そうだ、そうしよう。」
  "translation_status": "reviewed"

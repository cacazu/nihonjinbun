- "id": "xy-ch21-006"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": "妖王發怒，大聖施威。妖王發怒，要拿行者抵先鋒；大聖施威，欲捉精靈救長老。叉來棒架，棒去叉迎。一個是鎮山都總帥，一個是護法美猴王。初時還在塵埃戰，後來各起在中央。點鋼叉，尖明銳利；如意棒，身黑箍黃。戳著的魂歸冥府，打著的定見閻王。全憑著手疾眼快，必須要力壯身強。兩家捨死忘生戰，不知那個平安那個傷。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    妖王は怒りをあらわし、大聖（たいせい）は威を振るう。
    妖王は怒り、悟空を捕らえて先鋒の代わりに殺そうとし、大聖は威を振るい、妖怪を捕らえて長老を救おうとする。
    叉が来れば棒が受け、棒が行けば叉が迎える。
    一方は山を鎮める総大将、一方は仏法を守る美猴王（びこうおう）。
    初めは土ぼこりの中で戦い、やがて両者は空のただ中へ上がる。
    鋼の叉の先は明るく鋭く、如意棒（にょいぼう）の身は黒く、たがは黄金。
    突かれた者の魂は冥府へ帰り、打たれた者は必ず閻王（えんおう）に会う。
    頼りは手の速さと目の鋭さ、欠かせぬものは強い力と丈夫な体。
    死を顧みず、命を忘れて戦う二人、どちらが無事でどちらが傷つくのか。
  "translation_status": "reviewed"
- "id": "xy-ch21-007"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老妖與大聖鬥經三十回合，不分勝敗。這行者要見功績，使一個「身外身」的手段：把毫毛揪下一把，用口嚼得粉碎，望上一噴，叫聲：「變！」變有百十個行者，都是一樣打扮，各執一根鐵棒，把那怪圍在空中。那怪害怕，也使一般本事：急回頭，望著巽地上，把口張了三張，呼的一口氣吹將出去，忽然間，一陣黃風，從空刮起。好風，真個利害："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    黄風怪と悟空は三十合も戦ったが、勝負はつかない。悟空は手柄を立てようと「身外身（しんがいしん）」の術を使った。毛をひとつかみ抜き、口で細かく噛み砕いて上へ吹き出し、悟空「変われ！」と叫ぶ。すると百人あまりの悟空に変わり、皆同じ身なりで一本ずつ鉄棒を持ち、空中で黄風怪を取り囲んだ。
    黄風怪は恐れ、自分も術を使った。急に振り向いて巽（たつみ）の方へ口を三度開き、ふうっと一息吹き出すと、たちまち一陣の黄色い風が空から吹き起こった。その風のすさまじさといったら、まことに恐ろしい。
  "translation_status": "reviewed"
- "id": "xy-ch21-008"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    冷冷颼颼天地變，無影無形黃沙旋。
    穿林折嶺倒松梅，播土揚塵崩嶺坫。
    黃河浪潑徹底渾，湘江水湧翻波轉。
    碧天振動斗牛宮，爭些刮倒森羅殿。
    五百羅漢鬧喧天，八大金剛齊嚷亂。
    文殊走了青毛獅，普賢白象難尋見。
    真武龜蛇失了群，梓橦騾子飄其韂。
    行商喊叫告蒼天，梢公拜許諸般願。
    煙波性命浪中流，名利殘生隨水辦。
    仙山洞府黑攸攸，海島蓬萊昏暗暗。
    老君難顧煉丹爐，壽星收了龍鬚扇。
    王母正去赴蟠桃，一風吹亂裙腰釧。
    二郎迷失灌州城，哪吒難取匣中劍。
    天王不見手心塔，魯班吊了金頭鑽。
    雷音寶闕倒三層，趙州石橋崩兩斷。
    一輪紅日蕩無光，滿天星斗皆昏亂。
    南山鳥往北山飛，東湖水向西湖漫。
    雌雄拆對不相呼，子母分離難叫喚。
    龍王遍海找夜叉，雷公到處尋閃電。
    十代閻王覓判官，地府牛頭追馬面。
    這風吹倒普陀山，捲起觀音經一卷。
    白蓮花卸海邊飛，吹倒菩薩十二院。
    盤古至今曾見風，不似這風來不善。
    唿喇喇，乾坤險不炸崩開，萬里江山都是顫。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 130
    "line_end": 153
  "translation_ja": |-
    ひゅうひゅう冷たい風に天地は変わり、影も形もない風の中を黄色い砂が渦巻く。
    林を貫き、峰を折り、松梅を倒し、土を散らして塵を巻き、山の裾まで崩し去る。
    黄河（こうが）は波を吹き上げ底まで濁り、湘江（しょうこう）の水は湧き立って逆巻く。
    青空の斗牛宮（とぎゅうきゅう）は揺れ動き、森羅殿（しんらでん）も危うく吹き倒されそうだ。
    五百羅漢（ごひゃくらかん）は天も響けと騒ぎ立て、八大金剛（はちだいこんごう）もそろって叫び乱れる。
    文殊（もんじゅ）は青毛の獅子に逃げられ、普賢（ふげん）も白象を見つけられない。
    真武（しんぶ）の亀と蛇ははぐれ、梓橦（しとう）の騾馬は鞍の泥よけをはためかす。
    行商人は叫んで天に訴え、船頭は拝んであらゆる願をかける。
    霞む波間に人の命は流れ、名利を追う残りの生も水のままに任せるほかない。
    仙山の洞府は真っ暗、海の仙島・蓬莱（ほうらい）も闇に沈む。
    太上老君（たいじょうろうくん）は煉丹炉をかまう暇もなく、寿星（じゅせい）は竜鬚の扇をしまい込む。
    王母（おうぼ）が蟠桃（ばんとう）の宴へ赴こうとすれば、ひと吹きで裳も腰飾りも腕輪も乱れる。
    二郎真君（じろうしんくん）は灌州城（かんしゅうじょう）への道を失い、哪吒（なた）は箱から剣を取り出すこともできない。
    李天王（りてんのう）は手のひらの塔を見失い、魯班（ろはん）は金の穂先の錐を取り落とす。
    雷音（らいおん）の宝殿は三層も倒れ、趙州（ちょうしゅう）の石橋は真っ二つに崩れ落ちる。
    赤い太陽は揺らいで光を失い、満天の星々もみな暗く乱れる。
    南山の鳥は北山へ飛ばされ、東湖の水は西湖へあふれ出す。
    雌雄は引き離されて呼び合えず、親子は離ればなれで声も届かない。
    竜王（りゅうおう）は海じゅうで夜叉（やしゃ）を捜し、雷公（らいこう）はあちこちで稲妻を捜す。
    十代の閻王は判官を捜し、地府の牛頭（ごず）は馬面（ばめん）を追う。
    風は普陀山（ふださん）を吹き倒し、観音菩薩（かんのんぼさつ）の経巻一巻を巻き上げる。
    白蓮の花は散って海辺へ飛び、菩薩の十二の院も吹き倒される。
    盤古（ばんこ）の昔から風はあったが、これほどたちの悪い風はない。
    ごうごうと、天地は危うく弾け崩れそうになり、万里の山河がことごとく震える。

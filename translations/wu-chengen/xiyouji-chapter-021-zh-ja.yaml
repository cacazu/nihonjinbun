    "message_ja": "風の長詩の「嶺坫」は難語で、山の裾・張り出しが崩れる意味を採った。「魯班吊了金頭鑽」は吊を取り落とす意に解したが、字義と異文の再検討を要する。原文は無補訂。"
  - "kind": "uncertain_translation"

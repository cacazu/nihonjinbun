- "id": "xy-ch21-026"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    身健不扶拐杖，冰髯雪鬢蓬蓬。金花耀眼意朦朧，瘦骨衰筋強硬。
    屈背低頭緩步，龐眉赤臉如童。看他容貌是人稱，卻似壽星出洞。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 182
    "line_end": 183
  "translation_ja": |-
    身は健やかで杖もつかず、氷のような髭と雪のような鬢がふさふさしている。金花は目もくらむほど輝いて、その趣はおぼろげ、痩せた骨と衰えた筋もなお強い。
    背をかがめ頭を垂れ、ゆっくり歩む。眉はふさふさ、赤い顔は子供のよう。その姿は人の称えるところ、寿星が洞から出てきたかと思われた。
  "translation_status": "reviewed"
  "issues":

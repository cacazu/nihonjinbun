    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    兄弟弟子は馬と荷物を持って入り、奥へ進んで馬をつなぎ、荷を下ろした。屋敷の老人と挨拶を交わして席に着くと、下男がお茶を差し出した。お茶のあとには胡麻飯が何椀か運ばれ、食事が済むと、老人は寝床を整えるよう命じた。
    悟空「眠るのはまだよいのですが、善人のお方、このあたりに目薬を売る所はありませんか。」
    宿の老人「どちらの長老が目を患っておいでですか。」
    悟空「おじいさん、正直に言いますと、私たち出家の者はもともと病気をせず、目を患うとはどういうことかも知りません。」
    宿の老人「患っていないのに、なぜ薬をお求めです。」
    悟空「今日、黄風洞の前で師匠を救おうとしたら、思いがけず妖怪が風をひと吹き吹きかけてきました。目玉がうずいて痛み、今も涙がたまるので、目薬を探しているのです。」
    宿の老人「これは、これは。長老、まだ若いのに、どうして嘘をおっしゃる。黄風大王の風は何より恐ろしい。春や秋の風、松や竹を鳴らす風、東西南北の風などとは違います……」
    八戒「それなら、夾脳風（きょうのうふう）、羊耳風（ようじふう）、大麻風（だいまふう）、偏正頭風（へんせいずふう）といった病気の風かい。」
    宿の老人「違います、違います。三昧神風（さんまいしんぷう）というのです。」
    悟空「どういう風です。」
    宿の老人「吹けば天地は暗くなり、鬼神さえも憂い恐れる。石を裂き、崖を崩す荒々しさで、人に吹けば命が絶える。あの風に吹かれて、まだ生きていられるものですか。神仙でもなければ無事では済みません。」
    悟空「なるほど、そのとおりです。私たちは神仙ではありませんが、神仙のほうが私の後輩です。この命はそう簡単には絶えません。ただ目玉がうずいて痛むだけなのです。」
    宿の老人「そうおっしゃるなら、ただならぬお方なのでしょう。こんな所に目薬を売る店はありませんが、私も風に当たると涙の出ることがありまして、以前、ある異人から薬の処方を授かりました。三花九子膏（さんかきゅうしこう）といい、風で起こるあらゆる目の病を治します。」
    悟空はこれを聞くと頭を下げ、礼をした。悟空「どうか少しいただき、試しにさしてください。」
    老人は承知して中へ入り、小さな瑪瑙の壺を持ち出した。栓を抜き、玉のかんざしで少しすくって悟空の目へさすと、目を開けず、心を静めて眠れば明朝にはよくなると教えた。薬をさし終えると石の壺をしまい、下男たちを連れて奥へ引き取った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "夾腦風・羊耳風・大麻風・偏正頭風は「風」と病名をかける言葉遊び。現代の診断名を確定せず、底本の病名を保持した。胡麻飯の具体的な穀物・調理法は断定しない。"
- "id": "xy-ch21-015"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒解包袱，展開鋪蓋，請行者安置。行者閉著眼亂摸。八戒笑道：「先生，你的明杖兒呢？」行者道：「你這個饢糟的獃子，你照顧我做瞎子哩。」那獃子啞啞的暗笑而睡。行者坐在鋪上，轉運神功，直到三更後方才睡下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    八戒は包みをほどいて寝具を広げ、悟空を休ませた。悟空は目を閉じたまま、手探りであちこち触っていた。
    八戒は笑った。八戒「先生、お使いの探り杖はどこだい。」
    悟空「このろくでなしの間抜けめ、俺を目の見えない者扱いしやがって。」
    八戒はくっくっと忍び笑いをしながら眠った。悟空は寝床に座って神通の功をめぐらせ、三更（さんこう）を過ぎてからようやく横になった。
  "translation_status": "reviewed"
- "id": "xy-ch21-016"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不覺又是五更將曉。行者抹抹臉，睜開眼道：「果然好藥，比常更有百分光明。」卻轉頭後邊望望，呀！那裡得甚房舍窗門，但只見些老槐高柳，兄弟們都睡在那綠莎茵上。那八戒醒來道：「哥哥，你嚷怎的？」行者道：「你睜開眼睛看看。」獃子忽擡頭，見沒了人家，慌得一轂轆爬將起來道：「我的馬哩？」行者道：「樹上拴的不是？」「行李呢？」行者道：「你頭邊放的不是？」八戒道：「這家子也憊懶，他搬了，怎麼就不叫我們一聲？通得老豬知道，也好與你送些茶果。想是躲門戶的，恐怕里長曉得，卻就連夜搬了。──噫！我們也忒睡得死，怎麼他家拆房子，響也不聽見響響？」行者吸吸的笑道：「獃子，不要亂嚷。你看那樹上是個甚麼紙帖兒？」八戒走上前，用手揭了，原來上面四句頌子云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    いつしか五更（ごこう）、夜明けが近づいた。悟空は顔をこすり、目を開けた。悟空「本当によい薬だ。いつもより百倍も明るく見える。」
    振り向いてあたりを見ると、何と、家も窓も門もどこにもない。あるのは古い槐と高い柳ばかりで、二人は緑の草の上で眠っていたのだ。
    八戒が目を覚ました。八戒「兄貴、何を騒いでいるんだ。」
    悟空「目を開けて見てみろ。」
    八戒は顔を上げ、人家がなくなっているのを見ると、慌てて飛び起きた。八戒「俺の馬は。」
    悟空「木につないであるじゃないか。」
    八戒「荷物は。」
    悟空「お前の枕元に置いてあるじゃないか。」
    八戒「あの家の連中もけしからん。引っ越すなら、なぜひと言呼んでくれないんだ。この俺に知らせてくれれば、茶や菓子ぐらい餞別にやれたのに。きっと家にかかる負担を逃れるため、里長に知られるのを恐れて夜のうちに引っ越したんだろう。いやあ、俺たちもずいぶんよく寝たもんだ。家を取り壊したのに、物音一つ聞かなかったとは。」
    悟空は鼻で笑った。悟空「間抜け、でたらめをわめくな。あの木に貼ってあるのは、何の紙か見てみろ。」
    八戒は進み寄って紙をはがした。そこには四句の偈が記してあった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「躲門戶」は戸に課される公的負担を逃れる含意と解し、何の税役かは断定しない。引越しと家屋解体は八戒の推測として訳した。"
- "id": "xy-ch21-017"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    莊居非是俗人居，護法伽藍點化廬。
    妙藥與君醫眼痛，盡心降怪莫躊躇。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 166
    "line_end": 167
  "translation_ja": |-
    この屋敷は俗人の住まいではなく、護法伽藍（ごほうがらん）が術で現した庵である。
    妙薬でそなたの目の痛みを治した、心を尽くして妖怪を降せ、ためらうな。
  "translation_status": "reviewed"
- "id": "xy-ch21-018"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「這夥強神，自換了龍馬，一向不曾點他，他倒又來弄虛頭。」八戒道：「哥哥莫扯架子，他怎麼伏你點札？」行者道：「兄弟，你還不知哩。這護教伽藍、六丁六甲、五方揭諦、四值功曹奉菩薩的法旨，暗保我師父者。自那日報了名，只為這一向有了你，再不曾用他們，故不曾點札罷了。」八戒道：「哥哥，他既奉法旨暗保師父，所以不能現身明顯，故此點化仙莊。你莫怪他，昨日也虧他與你點眼，又虧他管了我們一頓齋飯，亦可謂盡心矣。你莫怪他，我們且去救師父來。」行者道：「兄弟說得是。此處到那黃風洞口不遠，你且莫動身，只在林子裡看馬守擔。等老孫去洞裡打聽打聽，看師父下落如何，再與他爭戰。」八戒道：「正是這等，討一個死活的實信。假若師父死了，各人好尋頭幹事；若是未死，我們好竭力盡心。」行者道：「莫亂談，我去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    悟空「あの横着な神どもめ。竜馬に取り替えたとき以来、呼びつけずにいたら、またこんなこけおどしをしやがって。」
    八戒「兄貴、偉そうにするなよ。どうしてあの神々がお前の点呼に従うんだ。」
    悟空「兄弟、お前はまだ知らないんだ。この護教伽藍（ごきょうがらん）、六丁六甲（ろくていろっこう）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）は、観音菩薩の命令で俺の師匠を陰から守っている。あの日、一度名乗り出たんだが、このところはお前がいるから、神どもを使うこともなく、呼びつけなかっただけだ。」
    八戒「兄貴、命令で師匠を陰から守っているなら、あからさまに姿を見せるわけにはいかない。それで仙人の屋敷を術で現したんだろう。責めるなよ。昨日はお前の目に薬をさしてくれたうえ、俺たちに一食食べさせてくれた。十分に心を尽くしているじゃないか。責めるのはやめて、師匠を救いに行こう。」
    悟空「兄弟、そのとおりだ。ここから黄風洞の入り口までは遠くない。お前は動かず、この林で馬と荷物を守っていてくれ。俺が洞窟へ忍び込んで師匠の様子を確かめ、それからあいつと戦おう。」
    八戒「それがいい。生きているのか死んでいるのか、確かな知らせをつかもう。もし師匠が死んでいたら、それぞれ別の仕事を探せるし、生きているなら力と心を尽くせばいい。」
    悟空「縁起でもないことを言うな。行ってくるぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch21-019"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他將身一縱，徑到他門首，門尚關著睡覺。行者不叫門，且不驚動妖怪，捻著訣，念個咒語，搖身一變，變做一個花腳蚊蟲，真個小巧。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 170
    "line_end": 170
  "translation_ja": "悟空は身を躍らせ、一気に洞窟の門前へ着いた。門はまだ閉ざされ、中の者は眠っている。門前で呼びかけて妖怪を驚かすことはせず、指で印を結んで呪文を唱え、身を振るわせると、脚にまだら模様のある蚊に変わった。まことに小さく巧みな姿である。これを証す詩がある。"
  "translation_status": "reviewed"
- "id": "xy-ch21-020"
  "section_id": "chapter-21"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    擾擾微形利喙，嚶嚶聲細如雷。 蘭房紗帳善通隨，正愛炎天暖氣。
    只怕薰煙撲扇，偏憐燈火光輝。 輕輕小小忒鑽疾，飛入妖精洞裡。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 172
    "line_end": 173
  "translation_ja": |-
    せわしなく動く小さな体に鋭いくちばし、ぶんぶん細い声を雷さながらに響かせる。香る部屋も薄絹の蚊帳もやすやす通り抜け、夏の暖かい空気を好む。
    恐れるものは燻す煙と扇の一振り、ひときわ好むは灯火の輝き。軽く小さな身ですばやく潜り、妖怪の洞へ飛び込んだ。
  "translation_status": "reviewed"
- "id": "xy-ch21-021"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那把門的小妖正打鼾睡，行者往他臉上叮了一口，那小妖翻身醒了，道：「我爺啞！好大蚊子，一口就叮了一個大疙疸。」忽睜眼道：「天亮了。」又聽得支的一聲，二門開了。行者嚶嚶的飛將進去，只見那老妖吩咐各門上謹慎，一壁廂收拾兵器：「只怕昨日那陣風不曾刮死孫行者，他今日必定還來，來時定教他一命休矣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    門番の小妖はいびきをかいて眠っていた。悟空がその顔をひと刺しすると、小妖は寝返りを打って目を覚ました。門番の小妖「おお、何て大きな蚊だ。一度刺しただけで、こんな大きなこぶができた。」
    ふと目を開いた。門番の小妖「もう明るくなったぞ。」
    きいっと音がして二の門が開いた。悟空はぶんぶんと飛んで中へ入った。黄風怪は各門を厳重に守るよう命じながら、武器を整えていた。黄風怪「昨日の風で孫行者が死んでいなければ、今日また必ず来るだろう。来たら今度こそ命を絶ってやる。」
  "translation_status": "reviewed"
- "id": "xy-ch21-022"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽說，又飛過那廳堂，徑來後面，但見一層門關得甚緊。行者漫門縫兒鑽將進去，原來是個大空園子，那壁廂定風樁上繩纏索綁著唐僧哩。那師父紛紛淚落，心心只念著悟空、悟能，不知都在何處。行者停翅，叮在他光頭上，叫聲：「師父。」那長老認得他的聲音，道：「悟空啊，想殺我也。你在那裡叫我哩？」行者道：「師父，我在你頭上哩。你莫要心焦，少得煩惱。我們務必拿住妖精，方才救得你的性命。」唐僧道：「徒弟啊，幾時才拿得妖精麼？」行者道：「拿你的那虎怪，已被八戒打死了。只是老妖的風勢利害，料著只在今日，管取拿他。你放心莫哭，我去啞。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    悟空はその言葉を聞き、広間を飛び越えて奥へ向かった。固く閉じた門があったので、すき間をくぐり抜けると、そこは広い空の庭で、向こうの定風樁（ていふうとう）に三蔵（さんぞう）が何重にも縄で縛りつけられていた。師匠は涙を流し続け、悟空と八戒はどこにいるのだろうと、ひたすら二人を思っていた。
    悟空は羽ばたきを止めて三蔵のつるつるした頭にとまり、呼びかけた。悟空「お師匠さま。」
    三蔵はその声が分かった。三蔵「悟空、どれほどお前を待ち焦がれたことか。どこから呼んでいるのだね。」
    悟空「お師匠さま、頭の上におります。気をもまず、あまりお悲しみにならないでください。私たちは何としても妖怪を捕らえねばなりません。そうして初めて、お命をお救いできるのです。」
    三蔵「弟子よ、いつになれば妖怪を捕らえられるのだろう。」
    悟空「あなたをさらった虎の妖怪は、もう八戒が打ち殺しました。ただ黄風怪の風が恐ろしいのです。それでも今日じゅうにはきっと捕らえます。安心して、もう泣かないでください。では参ります。」
  "translation_status": "reviewed"
- "id": "xy-ch21-023"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說聲去，嚶嚶的飛到前面。只見那老妖坐在上面，正點札各路頭目。又見那洞前有一個小妖精，把個令字旗磨一磨，撞上廳來報道：「大王，小的巡山，才出門，見一個長嘴大耳朵的和尚坐在林裡，若不是我跑得快些，幾乎被他捉住。卻不見昨日那個毛臉和尚。」老妖道：「孫行者不在，想必是風吹死也；再不便去那裡求救兵去了。」眾妖道：「大王，若果吹殺了他，是我們的造化；只恐吹不死他，他去請些神兵來，卻怎生是好？」老妖道：「怕那甚麼神兵？若還定得我的風勢，只除了靈吉菩薩來是，其餘何足懼也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    行くと言うなり、悟空はぶんぶんと前へ飛んだ。黄風怪は上座に座り、各部の頭目を点呼している。そこへ洞窟の前から一人の小妖が、「令」の字の旗を振り回しながら広間へ駆け込み、報告した。巡山の小妖「大王、山を見回ろうと門を出たばかりのところで、長い口に大きな耳の僧が林に座っているのを見ました。すばやく逃げなければ、危うく捕まるところでした。ただ、昨日の毛むくじゃらの僧は見かけませんでした。」
    黄風怪「孫行者がいないなら、風に吹かれて死んだのだろう。そうでなければ、どこかへ援軍を求めに行ったのだ。」
    妖怪たち「大王、本当に吹き殺せたなら幸運ですが、死なずに天界の神兵でも頼んできたら、どうしましょう。」
    黄風怪「神兵など、何を恐れる。私の風を鎮められる者がいるとしても、霊吉菩薩（れいきつぼさつ）だけだ。それ以外に恐れる者などない。」
  "translation_status": "reviewed"
- "id": "xy-ch21-024"
  "section_id": "chapter-21"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者在屋梁上，只聽得他這一句言語，不勝歡喜。即抽身飛出，現本相，來至林中，叫聲：「兄弟。」八戒道：「哥，你往那裡去來？剛才一個打令字旗的妖精，被我趕了去也。」行者笑道：「虧你，虧你。老孫變做蚊蟲兒，進他洞去探看師父，原來師父被他綁在定風樁上哭哩。是老孫吩咐，教他莫哭。又飛在屋梁上聽了一聽，只見那拿令字旗的喘噓噓的走進去報道：只是被你趕他，卻不見我。老妖亂猜亂說，說老孫是風吹殺了，又說是請神兵去了。他卻自家供出一個人來，甚妙，甚妙。」八戒道：「他供的是誰？」行者道：「他說怕甚麼神兵，那個能定他的風勢，只除是靈吉菩薩來是。──但不知靈吉住在何處？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch21-2609807"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第021回&oldid=2609807"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    梁の上にいた悟空はこのひと言を聞くと、嬉しくてたまらなくなった。すぐに飛び出して本来の姿に戻り、林へやって来た。悟空「兄弟。」
    八戒「兄貴、どこへ行っていたんだ。さっき『令』の旗を持った妖怪を追い払ってやったぞ。」
    悟空は笑った。悟空「ありがたい、ありがたい。俺は蚊になって洞窟へ入り、師匠の様子を見てきた。定風樁に縛られて泣いておられたから、もう泣かないように言っておいた。それから梁の上へ飛んで聞いていると、『令』の旗を持った奴が息を切らして戻り、お前に追われたこと、俺は見なかったことを報告したんだ。黄風怪は勝手な推量を並べ、俺は風で死んだのだろうとか、神兵を頼みに行ったのだろうとか言っていたが、そこで自分から一人の名を漏らした。実にうまい、うまいぞ。」
    八戒「誰の名を漏らしたんだ。」
    悟空「神兵など恐れるものか、自分の風を鎮められるのは霊吉菩薩だけだ、と言ったんだ。ただ、霊吉菩薩がどこに住んでおられるか分からない。」
  "translation_status": "reviewed"
- "id": "xy-ch21-025"

- "id": "xy-ch20-007"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子縱身跳起，口裡絮絮叨叨的，挑著擔子，只得死心塌地，跟著前來。早到了路傍人家門首。三藏下馬，行者接了韁繩，八戒歇了行李，都佇立綠蔭之下。三藏拄著九環錫杖，按按藤纏篾織斗篷，先奔門前。只見一老者，斜倚竹床之上口裡嚶嚶的念佛。三藏不敢高言，慢慢的叫一聲：「施主，問訊了。」那老者一骨魯跳將起來，忙斂衣襟，出門還禮道：「長老，失迎。你自那方來的？到我寒門何故？」三藏道：「貧僧是東土大唐和尚，奉聖旨，上雷音寺拜佛求經。適至寶方天晚，意投檀府告借一宵，萬祈方便方便。」那老兒擺手搖頭道：「去不得，西天難取經。要取經，往東天去罷。」三藏口中不語，意下沉吟：「菩薩指道西去，怎麼此老說往東行？東邊那得有經？」靦腆難言，半晌不答。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    八戒はひょいと跳び起き、口の中でぶつぶつ言いながら荷を担ぐと、腹を据えてついていくよりなかった。やがて道端の家の門前に着いた。三蔵は馬を下り、行者が手綱を受け取り、八戒は荷を下ろして、一同は緑の木陰にたたずんだ。三蔵は九環錫杖（きゅうかんしゃくじょう）をつき、藤を巻いて竹ひごを編んだ笠を押さえ直し、先に門前へ進んだ。見ると、老人が竹の寝台にもたれかかり、口の中で低く念仏を唱えている。三蔵は大声を出すのをはばかり、静かに呼びかけた。
    三蔵「施主さま、ご挨拶申し上げます。」
    老人はがばりと跳び起き、急いで襟を整え、門を出て礼を返した。
    老人「長老、お迎えもせず失礼しました。どちらからおいでです。このあばら屋に何のご用でしょう。」
    三蔵「私は東土（とうど）の大唐（だいとう）から来た僧です。勅命を奉じ、雷音寺（らいおんじ）へ仏を拝し、経を求めに参ります。こちらに着いたところで日が暮れましたので、お宅で一夜の宿をお借りしたいのです。どうぞ、よしなにお取り計らいください。」
    老人は手を振り、首を横に振った。
    老人「行かれません。西天へは、経を取りに行くのも難しい。経を取りたいなら、東天（とうてん）へ行きなさい。」
    三蔵は口をつぐみ、心の内で考えた。
    三蔵の心の声「菩薩さまは西へ行けとお導きくださったのに、なぜこの老人は東へ行けと言うのだろう。東にどんな経があるというのか。」
    気が引けて言葉に出せず、しばらく返事をしなかった。
  "translation_status": "reviewed"
- "id": "xy-ch20-008"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者素性兇頑，忍不住，上前高叫道：「那老兒，你這們大年紀，全不曉事。我出家人遠來借宿，就把這厭鈍的話虎諕我。十分你家窄狹，沒處睡時，我們在樹底下，好道也坐一夜，不打攪你。」那老者扯住三藏道：「師父，你倒不言語，你那個徒弟，那般拐子臉別頦腮，雷公嘴，紅眼睛，一個癆病魔鬼，怎麼反衝撞我這年老之人？」行者笑道：「你這個老兒，忒也沒眼色。似那俊刮些兒的，叫做中看不中吃。想我老孫雖小，頗結實，皮裹一團筋哩。」那老者道：「你想必有些手段。」行者道：「不敢誇言，也將就看得過。」老者道：「你家居何處？因甚事削髮為僧？」行者道：「老孫祖貫東勝神洲海東傲來國花果山水簾洞居住。自小兒學做妖怪，稱名悟空。憑本事，做了一個齊天大聖。只因不受天錄，大反天宮，惹了一場災愆。如今脫難消災，轉拜沙門，前求正果。保我這唐朝駕下的師父，上西天拜佛走遭，怕甚麼山高路險，水闊波狂？我老孫也捉得怪，降得魔，伏虎擒龍，踢天弄井，都曉得些兒。倘若府上有甚麼丟磚打瓦、鍋叫門開，老孫便能安鎮。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 140

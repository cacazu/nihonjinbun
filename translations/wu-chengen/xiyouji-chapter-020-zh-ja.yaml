  "translation_ja": |-
    第二十回
    黄風嶺で唐僧が難に遭い　山の半ばで八戒が先を争う
  "translation_status": "reviewed"
- "id": "xy-ch20-002"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    法本從心生，還是從心滅。
    生滅盡由誰？請君自辨別。
    既然皆己心，何用別人說？
    只須下苦功，扭出鐵中血。
    絨繩著鼻穿，挽定虛空結。
    拴在無為樹，不使他顛劣。
    莫認賊為子，心法都忘絕。
    休教他瞞我，一拳先打徹。
    現心亦無心，現法法也輟。
    人牛不見時，碧天光皎潔。
    秋月一般圓，彼此難分別。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 121
    "line_end": 131
  "translation_ja": |-
    法はもと心より生じ、また心より滅する。
    生滅はいったい誰によるのか、どうか自ら見分けよ。
    いずれも己の心ならば、他人の言葉が何になろう。
    ただひたすらに苦労を重ね、鉄から血を搾り出せ。
    毛縄を鼻に通し、虚空に結んで固く引け。
    無為（むい）の木につなぎとめ、気ままに暴れさせるな。
    賊を我が子と思い違えるな、心も法もすっかり忘れ去れ。
    己を欺かせるな、一拳まずは打ち抜け。
    心を現しても心はなく、法を現しても法またやむ。
    人も牛も見えなくなれば、青空の光は澄みわたる。
    秋の月のようにまんまるで、彼も此も分けられぬ。
  "translation_status": "reviewed"

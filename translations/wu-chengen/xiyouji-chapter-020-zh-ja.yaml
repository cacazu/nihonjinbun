- "id": "xy-ch20-003"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一篇偈子，乃是玄奘法師悟徹了《多心經》，打開了門戶，那長老常念常存，一點靈光自透。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 133
    "line_end": 133
  "translation_ja": "この一篇の偈（げ）は、玄奘法師（げんじょうほうし）が『多心経（たしんきょう）』をすっかり悟り、その門を開いたことを詠んだものである。三蔵（さんぞう）は常にこれを唱え、常に心に留めていたので、一点の霊光（れいこう）がおのずから差し通った。"
  "translation_status": "reviewed"
- "id": "xy-ch20-004"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且說他三眾在路餐風宿水，帶月披星，早又至夏景炎天。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 135
    "line_end": 135
  "translation_ja": "さて、三人は旅路で風を食らい、水辺に宿り、月と星を身に浴びて進むうち、早くも暑い夏を迎えた。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch20-005"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": "花盡蝶無情敘，樹高蟬有聲喧。 野蠶成繭火榴妍，沼內新荷出現。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    花は尽き、蝶は思いを語る相手もなく、高い木には蝉の声が騒がしい。
    野蚕は繭を結び、火のような柘榴の花は美しく、沼には新しい蓮が顔を出す。
  "translation_status": "reviewed"
- "id": "xy-ch20-006"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那日正行時，忽然天晚，又見山路傍邊有一村舍。三藏道：「悟空，你看那日落西山藏火鏡，月升東海現冰輪。幸而道傍有一人家，我們且借宿一宵，明日再走。」八戒道：「說得是，我老豬也有些餓了，且到人家化些齋吃，有力氣，好挑行李。」行者道：「這個戀家鬼，你離了家幾日，就生報怨。」八戒道：「哥啊，比不得你這喝風啊煙的人。我從跟了師父這幾日，長忍半肚饑，你可曉得？」三藏聞之道：「悟能，你若是在家心重啊，不是個出家的了，你還回去罷。」那獃子慌得跪下道：「師父，你莫聽師兄之言，他有些贓埋人。我不曾報怨甚的，他就說我報怨。我是個直腸的痴漢，我說道肚內饑了，好尋個人家化齋，他就罵我是戀家鬼。師父啊，我受了菩薩的戒行，又承師父憐憫，情願要伏侍師父往西天去，誓無退悔。這叫做『恨苦修行』。怎的說不是出家的話？」三藏道：「既是如此，你且起來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    その日も歩いていると、いつしか日が暮れ、山道の傍らに一軒の家が見えた。
    三蔵「悟空（ごくう）、見なさい。日は西の山に落ちて火の鏡を隠し、月は東の海から昇って氷の輪を現している。幸い道の傍らに人家がある。ひとまず一夜の宿を借り、明日また行こう。」
    八戒（はっかい）「そのとおりです。この猪（ちょ）さまも、少し腹が減りました。まずあのお宅で精進の食べ物を施してもらいましょう。力がつけば、荷物も担げます。」
    行者（ぎょうじゃ）「この家恋しがりめ。家を離れて何日もたたぬうちに、もう不平か。」
    八戒「兄貴、俺はあんたのように風を飲み、煙を吸って暮らす身じゃないんだ。お師匠さまについてきてからこの数日、いつも腹を半分すかせて我慢しているんだぜ。分かっているのかい。」
    これを聞いて三蔵は言った。
    三蔵「悟能（ごのう）、在家への未練がそれほど強いのなら、出家したとはいえない。帰ったほうがよい。」
    八戒は慌ててひざまずいた。
    八戒「お師匠さま、兄弟子の言うことをお聞きにならないでください。あの人は人に濡れ衣を着せるんです。私は何も不平を言っていないのに、不平を言ったと言い立てる。私は腹に何もない愚直な男です。腹が減ったから、人家を探して食べ物を施してもらおうと言っただけで、家恋しがりと罵るんです。お師匠さま、私は菩薩さまの戒めを受け、そのうえお師匠さまにも慈悲をおかけいただき、心からお仕えして西天（さいてん）へ参りたいと願っています。退いたり悔やんだりは決してしないと誓います。これが『恨苦修行（こんくしゅぎょう）』というものでしょう。どうして出家した者の言葉ではないとおっしゃるのです。」
    三蔵「それなら、もう立ちなさい。」

  "translation_ja": |-
    さて、行者はもともと気が荒く強情なので、我慢できず、前へ出て大声を上げた。
    行者「そこの爺さん、その年になって、まるで物が分からんのか。俺たち出家の者が遠くから宿を借りに来たのに、そんな縁起の悪い言葉で脅すとは。たとえ家が狭くて寝る場所がなくても、俺たちは木の下で一晩座っていられる。あんたの邪魔はしないさ。」
    老人は三蔵を引き止めて言った。
    老人「お師匠さん、あなたは何もおっしゃらんが、あのお弟子は、ひしゃげた顔に尖った顎と頬、雷公（らいこう）のような口に赤い目をして、労咳（ろうがい）病みの化け物そのものではありませんか。それでいて、なぜこの年寄りに突っかかるのです。」
    行者は笑った。
    行者「爺さん、よほど見る目がないな。顔のきれいな奴は、見栄えはよくても役には立たないと言うものだ。この孫（そん）さまは小柄だが、ずいぶん丈夫だぜ。皮の中は筋肉の塊なのさ。」
    老人「きっと何か腕をお持ちなのだな。」
    行者「自慢はせんが、まあ見られぬほどではない。」
    老人「お住まいはどちらだ。どういうわけで髪を落として僧になったのです。」
    行者「この孫さまの生まれ故郷は東勝神洲（とうしょうしんしゅう）、海の東の傲来国（ごうらいこく）だ。花果山（かかざん）の水簾洞（すいれんどう）に住んでいた。小さいころから妖怪になる修業をして、悟空と名乗り、腕一本で斉天大聖（せいてんたいせい）になったのさ。ただ、天の名簿に縛られるのをよしとせず、天宮（てんきゅう）に大反逆を起こして、災いと罪を招いてしまった。今はその苦難も災厄も解け、あらためて仏門に入り、正果（しょうか）を求めている。唐（とう）の帝にお仕えするこのお師匠さまを守り、西天へ仏を拝みに行くのだ。山が高く道が険しかろうと、水が広く波が荒かろうと、何が怖い。この孫さまは、怪を捕らえ、魔を降し、虎を伏せ、竜をつかまえ、天を蹴り井戸をかき回すような暴れ技まで、ひととおり心得ている。もしお宅に、煉瓦や瓦が飛んだり、鍋が鳴ったり、戸が勝手に開いたりする怪異があれば、この孫さまが鎮めてやれるぞ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は『不受天錄』であり、『天禄』等へ訂正せず、天の名簿・統制を受け入れない意に解した。『踢天弄井』は乱暴な大技を誇る慣用表現として、天を蹴り井戸をかき回す像を保持した。"
- "id": "xy-ch20-009"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老兒聽得這篇言語，哈哈笑道：「原來是個撞頭化緣的熟嘴兒和尚。」行者道：「你兒子便是熟嘴。我這些時，只因跟我師父走路辛苦，還懶說話哩。」那老兒道：「若是你不辛苦，不懶說話，好道活活的聒殺我。你既有這樣手段，西方也還去得，去得。你一行幾眾？請至茅舍裡安宿。」三藏道：「多蒙老施主不叱之恩。我一行三眾。」老者道：「那一眾在那裡？」行者指著道：「這老兒眼花，那綠蔭下站的不是？」老兒果然眼花，忽擡頭細看，一見八戒這般嘴臉，就諕得一步一跌，往屋裡亂跑，只叫：「關門，關門，妖怪來了！」行者趕上扯住道：「老兒莫怕，他不是妖怪，是我師弟。」老者戰兢兢的道：「好好好，一個醜似一個的和尚。」八戒上前道：「老官兒，你若以相貌取人，乾淨差了。我們醜自醜，卻都有用。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    老人はこの話を聞くと、はっはと笑った。
    老人「なるほど、あちこち頭を突っ込んで施しを求める、口達者なお坊さんだったか。」
    行者「口達者なのはあんたの息子だ。このごろは、お師匠さまについて旅をするのが骨で、口をきくのも面倒なくらいなんだぜ。」
    老人「疲れてもおらず、話すのも面倒でなかったら、私は生きたままうるささに殺されそうだ。そのような腕があるなら、西へも行かれる、行かれる。お連れは何人です。どうぞあばら屋でお休みください。」
    三蔵「お叱りもせずお許しくださり、ありがとうございます。私どもは三人です。」
    老人「もう一人はどちらに。」
    行者は指さした。
    行者「爺さん、目がかすんでいるな。あの木陰に立っているじゃないか。」
    老人は本当に目がかすんでいた。顔を上げてよく見たとたん、八戒の顔に驚き、一歩ごとにつまずきながら家の中へ逃げ込み、ただ叫んだ。
    老人「戸を閉めろ、戸を閉めろ。妖怪が来た！」
    行者は追いついて引き止めた。
    行者「爺さん、怖がるな。あいつは妖怪じゃない。俺の弟弟子だ。」
    老人はぶるぶる震えながら言った。
    老人「いやはや、まったく、一人よりもう一人のほうが醜い坊さんだ。」
    八戒は前へ出た。
    八戒「ご老人、顔つきで人を決めつけるなら、大間違いだぜ。俺たちは醜いことは醜いが、どちらも役に立つんだ。」
  "translation_status": "reviewed"
- "id": "xy-ch20-010"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老者正在門前與三個和尚相講，只見那莊南邊有兩個少年人，帶著一個老媽媽、三四個小男女，斂衣赤腳，插秧而回。他看見一匹白馬、一擔行李，都在他家門首喧嘩，不知是甚來歷，都一擁上前問道：「做甚麼的？」八戒調過頭來，把耳朵擺了幾擺，長嘴伸了一伸，嚇得那些人東倒西歪，亂蹡亂跌。慌得那三藏滿口招呼道：「莫怕，莫怕。我們不是歹人，我們是取經的和尚。」那老兒才出了門，攙著媽媽道：「婆婆起來，少要驚恐。這師父是唐朝來的，只是他徒弟臉嘴醜些，卻也面惡人善。帶男女們家去。」那媽媽才扯著老兒，二少年領著兒女進去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    老人が門前で三人の僧と話していると、村の南から若者が二人、年老いた女と三、四人の幼い男女を連れ、着物の裾をたくし上げ、裸足で田植えから帰ってきた。白馬が一頭、荷物が一荷あって、家の門前が騒がしいので、どんな者たちか分からず、一斉に駆け寄って尋ねた。
    帰ってきた家族「何をしているのです。」
    八戒が振り向き、耳を何度か振って、長い口を突き出すと、皆は仰天して右へ左へよろめき、もつれ合って転んだ。三蔵は慌てて声をかけ続けた。
    三蔵「怖がらないでください。怖がらないで。私どもは悪い者ではなく、経を取りに行く僧です。」
    老人は門を出て、老女に手を貸した。
    老人「婆さん、起きなさい。そんなに驚くことはない。このお師匠さんは唐からおいでだ。ただ、お弟子たちの顔が少し醜いだけで、顔は怖くても心はよい人たちだ。子供たちを家に連れてお入り。」
    老女は老人につかまり、二人の若者は子供たちを連れて中へ入った。
  "translation_status": "reviewed"
- "id": "xy-ch20-011"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏卻坐在他門樓裡竹床之上，埋怨道：「徒弟呀，你兩個相貌既醜，言語又粗，把這一家兒嚇得七損八傷，都替我身造罪哩。」八戒道：「不瞞師父說，老豬自從跟了你，這些時俊了許多哩。若像往常在高老莊時，把嘴朝前一掬，把耳兩頭一擺，常嚇殺二三十人哩。」行者笑道：「獃子不要亂說，把那醜也收拾起些。」三藏道：「你看悟空說的話，相貌是生成的，你教他怎麼收拾？」行者道：「把那個耙子嘴揣在懷裡，莫拿出來；把那蒲扇耳貼在後面，不要搖動：這就是收拾了。」那八戒真個把嘴揣了，把耳貼了，拱著頭，立於左右。行者將行李拿入門裡，將白馬拴在樁上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    三蔵は門楼の竹の寝台に腰を下ろし、弟子をたしなめた。
    三蔵「お前たち二人は、顔が醜いうえに言葉まで荒い。この家の者たちをさんざん驚かせて、私にまで罪を負わせているではないか。」
    八戒「お師匠さま、正直に言えば、この猪さまもお供するようになってから、ずいぶん男前になったんですよ。以前、高老荘（こうろうそう）にいたころのように、口をぐいと前に突き出し、両耳をぱたぱたやったら、いつも二、三十人は死ぬほど驚いたものです。」
    行者は笑った。
    行者「馬鹿、でたらめを言うな。その醜さも、少し引っ込めておけ。」
    三蔵「悟空は何を言うのだ。顔つきは生まれつきのものなのに、どうやって引っ込めるというのか。」
    行者「その熊手みたいな口を懐に押し込み、出さないようにする。蒲の団扇みたいな耳は後ろへぴたりとつけて、動かさない。それで引っ込みますよ。」
    八戒は本当に口を引っ込め、耳を伏せ、頭をかがめて傍らに立った。行者は荷物を門の中へ運び、白馬を杭につないだ。
  "translation_status": "reviewed"
- "id": "xy-ch20-012"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那老兒才引個少年，拿一個板盤兒，托三杯清茶來獻。茶罷，又吩咐辦齋。那少年又拿一張有窟窿無漆水的舊桌，端兩條破頭折腳的凳子，放在天井中，請三眾涼處坐下。三藏方問道：「老施主高姓？」老者道：「在下姓王。」「有幾位令嗣？」道：「有兩個小兒，三個小孫。」三藏道：「恭喜，恭喜。」又問：「年壽幾何？」道：「痴長六十一歲。」行者道：「好，好，好，花甲重逢矣。」三藏復問道：「老施主，始初說西天經難取者，何也？」老者道：「經非難取，只是道中艱澀難行。我們這向西去，只有三十里遠近，有一座山，叫做八百里黃風嶺，那山中多有妖怪。故言難取者，此也。若論此位小長老，說有許多手段，卻也去得。」行者道：「不妨，不妨。有了老孫與我這師弟，任他是甚麼妖怪，不敢惹我。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    やがて老人が若者を連れてきた。若者は板の盆に薄い茶を三杯載せ、差し出した。茶が済むと、老人はまた精進の食事を支度するよう命じた。若者は、穴があいて塗りも剝げた古い卓を運び、端が欠け脚の折れた腰掛けを二脚、中庭へ置いて、三人を涼しい所へ座らせた。
    三蔵「ご老人、お姓は何とおっしゃいます。」
    老人「私は王（おう）と申します。」
    三蔵「ご子息は何人おありですか。」
    王老人（おうろうじん）「息子が二人、孫が三人おります。」
    三蔵「それはおめでたいことです。」
    三蔵はさらに尋ねた。
    三蔵「お年はおいくつでしょう。」
    王老人「むやみに年を重ね、六十一になりました。」
    行者「よい、よい、よい。干支が一巡して、まためぐり合ったのだな。」
    三蔵は重ねて尋ねた。
    三蔵「ご老人、初めに西天の経は取り難いとおっしゃったのは、どういうわけです。」
    王老人「経が取り難いのではなく、途中の道が険しく、通るのが難しいのです。ここから西へ三十里ほどの所に、八百里の黄風嶺（こうふうれい）という山があります。その山には妖怪が多い。それで、取り難いと申し上げたのです。ただ、こちらの小柄な長老は、いろいろな腕をお持ちだというから、行かれるでしょう。」
    行者「構わん、構わん。この孫さまと弟弟子がいるんだ。どんな妖怪だろうと、俺に手出しはできまい。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『有幾位令嗣』『有兩個小兒』『年壽幾何』『痴長六十一歲』の省略された話者は、質問を三蔵、返答を宿主と文脈から判断した。『花甲重逢』は直前の六十一歳を受け、干支が一巡して再び同じ年にめぐり合う意とし、百二十歳などへ年齢を変えていない。姓の判明前は老人、名乗り後は王老人とする。"
- "id": "xy-ch20-013"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說處，又見兒子拿將飯來，擺在桌上，道聲：「請齋。」三藏就合掌諷起齋經。八戒早已吞了一碗。長老的幾句經還未了，那獃子又吃夠三碗。行者道：「這個饢糠的，好道撞著餓鬼了。」那老王倒也知趣，見他吃得快，道：「這個長老，想著實餓了，快添飯來。」那獃子真個食腸大，看他不擡頭，一連就吃有十數碗。三藏、行者俱各吃不上兩碗。獃子不住，便還吃哩。老王道：「倉卒無殽，不敢苦勸，請再進一箸。」三藏、行者俱道：「夠了。」八戒道：「老兒滴答甚麼，誰和你發課，說甚麼五爻六爻？有飯只管添將來就是。」獃子一頓，把他一家子飯都吃得罄盡，還只說才得半飽。卻才收了家火，在那門樓下，安排了竹床板鋪睡下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    話しているところへ、息子が飯を持ってきて、卓に並べた。
    息子「お食事をどうぞ。」
    三蔵は合掌し、食事の経を唱え始めた。だが八戒は早くも一杯を飲み込んでいた。三蔵のわずかな読経が終わらぬうちに、八戒はさらに三杯を平らげた。
    行者「この糠袋め、まるで餓鬼が取りついたようだ。」
    王老人も気が利いていた。食べるのが速いのを見て、言った。
    王老人「この長老は、よほどお腹がすいているらしい。早く飯を足しておあげ。」
    八戒の腹は、実に大きかった。顔も上げず、続けざまに十数杯を食べたのである。三蔵と行者は、どちらも二杯に届かなかった。八戒は止まらず、まだ食べ続けていた。
    王老人「急なことで肴もございませんし、無理にお勧めはできませんが、どうぞもう一箸お召し上がりください。」
    三蔵と行者「もう十分です。」
    八戒「爺さん、何をぐずぐず言っている。誰があんたと占いをやって、五爻（ごこう）だの六爻（りくこう）だの言うんだ。飯があるなら、どんどん足してくれればいい。」
    八戒は一食で、その家の飯をすっかり食べ尽くし、それでもまだ腹半分にしかならぬと言った。やっと食器を片づけ、門楼の下に竹の寝台と板の寝床を用意して、皆は横になった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『殽』は肴、『爻』は易の爻で、中国語の音を利用した掛け合い。八戒の返答に五爻・六爻と占いへの言及を残した。語義の異なる二字を同一の語へ統一していない。"
- "id": "xy-ch20-014"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日天曉，行者去背馬，八戒去整擔。老王又教媽媽整治些點心湯水管待，三眾方致謝告行。老者道：「此去倘路間有甚不虞，是必還來茅舍。」行者道：「老兒，莫說哈話。我們出家人不走回頭路。」遂此策馬挑擔西行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    翌朝、夜が明けると、行者は馬に鞍を置きに行き、八戒は荷を整えた。王老人はまた老妻に軽い食べ物と汁物を用意させて、もてなした。三人は礼を述べ、別れを告げた。
    王老人「この先、道中で万一のことがありましたら、必ずまたこのあばら屋へお戻りください。」
    行者「爺さん、つまらんことを言うな。俺たち出家の者は、来た道を引き返さないんだ。」
    こうして馬を進め、荷を担ぎ、西へ向かった。
  "translation_status": "reviewed"
- "id": "xy-ch20-015"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "噫！這一去，果無好路朝西域，定有邪魔降大災。三眾前來，不上半日，果逢一座高山，說起來十分險峻。三藏馬到臨崖，斜挑寶\U00029262觀看， 果然那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 150
    "line_end": 150
  "translation_ja": "ああ、この出立からは、果たして西域（さいいき）へ通じるよい道などなく、必ずや邪魔が大きな災いをもたらすのだ。三人は半日も行かぬうちに、まさしく高い山に出会った。言うまでもなく、ひどく険しい山である。三蔵は馬で崖ぎわまで来ると、宝\U00029262（ほうげき）を斜めに持ち上げて見渡した。なるほど、"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の『寶\U00029262』を『宝\U00029262』と保持した。中国哲学書電子化計画の『康熙字典』では\U00029262を『鞍也』『音戟』とする。他の公開翻刻には『宝镫』『宝鞭』があるが、底本をそれらへ補訂していない。『斜挑』を斜めに持ち上げると直訳したが、鞍という字義と馬上の具体的動作の関係は未確定。日本語読み『ほうげき』は『音戟』と日本漢字音に基づく推定である。"
- "id": "xy-ch20-016"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": "高的是山，峻的是嶺；陟的是崖，深的是壑；響的是泉，鮮的是花。那山高不高，頂上接青霄；這澗深不深，底中見地府。山前面，有骨都都白雲，屹嶝嶝怪石，說不盡千丈萬丈挾魂崖。崖後有彎彎曲曲藏龍洞，洞中有叮叮噹噹滴水巖。又見些丫丫叉叉帶角鹿，泥泥痴痴看人獐，盤盤曲曲紅鱗蟒，耍耍頑頑白面猿。至晚巴山尋穴虎，帶曉翻波出水龍，登的洞門唿喇喇響。草裡飛禽撲轤轤起，林中走獸掬哷哷行。猛然一陣狼蟲過，嚇得人心趷蹬蹬驚。正是那當倒洞當當倒洞，洞當當倒洞當山。青岱染成千丈玉，碧紗籠罩萬堆煙。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    高くそびえるのは山、険しく切り立つのは峰。そそり立つのは崖、深く落ち込むのは谷。響くのは泉、鮮やかなのは花。
    山はどれほど高いか、その頂は青空につながる。谷はどれほど深いか、その底には地府（ちふ）が見える。
    山の前には、むくむく湧く白雲、でこぼこ突き立つ奇岩。千丈万丈にも及ぶ、魂を奪う崖は語り尽くせぬ。
    崖の後ろには曲がりくねった竜の隠れる洞。その中には、ちんちん、こんこんと水の滴る岩がある。
    枝分かれした角を持つ鹿、ぼんやり人を眺める麞（しょう）、くねくねとぐろを巻く赤い鱗の大蛇、戯れ遊ぶ白い顔の猿もいる。
    夕暮れには虎が山をよじ登って穴を探し、夜明けには竜が波を返して水から出る。洞の口を上りゆけば、ごうごうと鳴り響く。
    草の中では鳥がばたばた飛び立ち、林の中では獣ががさがさ進む。
    突然、狼や獣の一群が通り過ぎれば、人の心もどきどきして驚く。
    まことに、どんどろ洞、どんどんどろ洞、洞どんどんどろ、洞どん山。
    青い山色は千丈の玉を染め上げ、碧い薄絹は幾万の煙を包み込む。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『當倒洞當當倒洞，洞當當倒洞當山』は音を重ねた山の描写として、洞・山の字を残して調子を移した。字面だけから特定の地形へ確定していない。『登的洞門』の主語・動作も明瞭でなく、洞の口を上る動きとして仮訳した。"
- "id": "xy-ch20-017"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那師父緩促銀驄，孫大聖停雲慢步，豬悟能磨擔徐行。正看那山，忽聞得一陣旋風大作。三藏在馬上心驚，道：「悟空，風起了。」行者道：「風卻怕他怎的？此乃天家四時之氣，有何懼哉？」三藏道：「此風甚惡，比那天風不同。」行者道：「怎見得不比天風？」三藏道：「你看這風："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    三蔵は白馬をゆっくり促し、行者は雲を止めて歩みを緩め、八戒は担ぎ荷を揺すりながらゆるゆる進んだ。山を眺めていると、突然、つむじ風が激しく起こった。三蔵は馬上でおびえた。
    三蔵「悟空、風が出てきた。」
    行者「風の何が怖いのです。天の四季の気にすぎないのに、恐れることがありますか。」
    三蔵「この風はひどく荒々しい。普通の風とは違う。」
    行者「どうして普通の風とは違うと分かるのです。」
    三蔵「この風を見るがよい。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三蔵の『你看這風』から次の韻文末まで一続きの発話である。原文の段落区分を保持し、訳文でも開き括弧を次の詩末で閉じた。"
- "id": "xy-ch20-018"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    巍巍蕩蕩颯飄飄，渺渺茫茫出碧霄。
    過嶺只聞千樹吼，入林但見萬竿搖。
    岸邊擺柳連根動，園內吹花帶葉飄。
    收網漁舟皆緊纜，落篷客艇盡拋錨。
    途半征夫迷失路，山中樵子擔難挑。
    仙果林間猴子散，奇花叢內鹿兒逃。
    崖前檜柏顆顆倒，澗下松篁葉葉凋。
    播土揚塵沙迸迸，翻江攪海浪濤濤。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 154
    "line_end": 161
  "translation_ja": |-
    とどろき広がり、さっと吹き、果てなくかすんで青空から出る。
    峰を越せば千の木が吼えるのが聞こえ、林へ入れば万の竹が揺れるのが見える。
    岸の柳を揺さぶり、根ごと動かし、庭の花を吹き散らし、葉もろとも舞わせる。
    網を収めた漁船はみな綱を固く締め、帆を下ろした旅船はことごとく錨を投げる。
    旅人は道の半ばで行き先を失い、山の木こりは荷を担ぐこともかなわぬ。
    仙果の林では猿が散り、珍しい花の茂みでは鹿が逃げる。
    崖前の檜柏（かいはく）は一本残らず倒れ、谷底の松と竹は葉という葉がしおれる。
    土をまき、塵を上げ、砂をほとばしらせ、川を覆し、海をかき乱し、波をとどろかせる。」
  "translation_status": "reviewed"
- "id": "xy-ch20-019"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒上前一把扯住行者道：「師兄，十分風大，我們且躲一躲兒乾淨。」行者笑道：「兄弟不濟。風大時就躲，倘或親面撞見妖精，怎的是好？」八戒道：「哥啊，你不曾聞得『避色如避仇，避風如避箭』哩？我們躲一躲，也不虧人。」行者道：「且莫言語，等我把這風抓一把來聞一聞看。」八戒笑道：「師兄又扯空頭謊了，風又好抓得過來聞？就是抓得來，便也鑽了去了。」行者道：「兄弟，你不知道老孫有個『抓風』之法。」好大聖，讓過風頭，把那風尾抓過來聞了一聞，有些腥氣。道：「果然不是好風，這風的味道不是虎風，定是怪風，斷乎有些蹊蹺。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    八戒は前へ出て、行者をぐいとつかんだ。
    八戒「兄弟子、ものすごい風だ。ひとまず避けたほうがすっきりするぜ。」
    行者は笑った。
    行者「兄弟、だらしないぞ。風が強いだけで逃げ隠れするのなら、妖怪に面と向かって出くわしたとき、どうするんだ。」
    八戒「兄貴、『色は仇を避けるように避け、風は矢を避けるように避けよ』と聞いたことがないかい。ちょっと隠れたって、誰に損をさせるわけでもない。」
    行者「まあ黙っていろ。この風をひとつかみつかんで、匂いをかいでみよう。」
    八戒は笑った。
    八戒「兄弟子はまた空っぽのほらを吹いている。風をつかまえて、匂いがかげるかい。つかめたとしても、すり抜けてしまうじゃないか。」
    行者「兄弟、お前は、この孫さまに『風をつかむ』術があるのを知らないんだな。」
    見事な行者は、風の先頭をやり過ごし、その尾をつかんでかいでみた。少し生臭い。
    行者「果たして、よい風ではない。この匂いは、虎の起こす風でなければ、きっと妖怪の風だ。間違いなく、何かあるぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch20-020"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，只見那山坡下剪尾跑蹄，跳出一隻斑斕猛虎。慌得那三藏坐不穩雕鞍，翻根頭跌下白馬，斜倚在路傍，真個是魂飛魄散。八戒丟了行李，掣釘鈀，不讓行者走上前，大喝一聲道：「孽畜，那裡走！」趕將去，劈頭就築。那隻虎直挺挺站將起來，把那前左爪掄起，摳住自家的胸膛，往下一抓，滑剌的一聲，把個皮剝將下來，站立道傍。你看他怎生惡相？咦！那模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    言い終わらぬうちに、山の斜面の下から、尾を振り、足を蹴立てて、縞模様の猛虎が一頭跳び出した。三蔵は慌て、彫り物のある鞍に座っていられず、もんどり打って白馬から落ち、道端に横たわった。まさに魂も魄も飛び散るほどである。八戒は荷物を投げ出し、釘鈀（ていは）を抜き、行者に先を越させず進み出て、大喝した。
    八戒「畜生め、どこへ行く！」
    追いつくなり、頭めがけて打ち込んだ。虎はまっすぐに立ち上がり、左の前脚を振り上げて自分の胸に爪をかけ、下へ引っかいた。すると、ずるりと音がして皮を脱ぎ、道の傍らに立った。どのような恐ろしい顔か、見てみるがよい。おお、その姿は、
  "translation_status": "reviewed"
- "id": "xy-ch20-021"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    血津津的赤剝身軀，紅媸媸的彎環腿足。
    火燄燄的兩鬢蓬鬆，硬搠搠的雙眉直豎。
    白森森的四個鋼牙，光耀耀的一雙金眼。
    氣昂昂的努力大哮，雄糾糾的厲聲高喊。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 166
    "line_end": 169
  "translation_ja": |-
    血がにじむ赤裸の胴体、赤黒く曲がった脚と足。
    火のようにもじゃもじゃの両鬢、硬く逆立った左右の眉。
    白々と光る四本の鋼の牙、まばゆく輝く一対の金の目。
    気負い立って力いっぱい吼え、猛々しく声を張り上げる。
  "translation_status": "reviewed"
- "id": "xy-ch20-022"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "喊道：「慢來，慢來。吾當不是別人，乃是黃風大王部下的前路先鋒。今奉大王嚴命，在山巡邏，要拿幾個凡夫去做案酒。你是那裡來的和尚，敢擅動兵器傷我？」八戒罵道：「我把你這個孽畜！你是認不得我。我等不是那過路的凡夫，乃東土大唐御弟三藏之弟子，奉旨上西方拜佛求經者。你早早的遠避他方，讓開大路，休驚了我師父，饒你性命；若似前猖獗，鈀舉處，卻不留情。」那妖精那容分說，急近步，丟一個架子，望八戒劈臉來抓；這八戒忙閃過，掄鈀就築。那怪手無兵器，回身就走；八戒隨後趕來；那怪到了山坡下亂石叢中，取出兩口赤銅刀，急掄起，轉身來迎。兩個在這坡前一往一來，一衝一撞的賭鬥。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    虎の妖怪は叫んだ。
    虎の妖怪「待て、待て。俺はほかでもない、黄風大王（こうふうだいおう）の配下の先鋒だ。今、大王の厳命を受けて山を見回り、ただの人間を何人か捕らえて、酒の肴にしようとしていた。お前はどこから来た坊主だ。よくも勝手に武器を振り回し、俺を傷つけようとしたな。」
    八戒は罵った。
    八戒「この畜生め、俺を知らないな。俺たちは、ただ道を通る凡人じゃない。東土大唐の御弟三蔵（ぎょていさんぞう）のお弟子で、勅命を受け、西方へ仏を拝し、経を求めに行く者だ。早くよそへ遠ざかり、大道を開け、お師匠さまを驚かせるな。そうすれば命は助けてやる。さっきのように暴れるなら、この鈀を振り上げたが最後、容赦はしないぞ。」
    妖怪は言い分など聞こうともせず、さっと詰め寄って構えを取り、八戒の顔へ爪を突き出した。八戒は急いで身をかわし、鈀を振り回して打ち込む。妖怪は手に武器がなかったので、振り向いて走り出した。八戒は後を追った。妖怪は山の斜面の下、岩の入り乱れた所まで来ると、赤銅刀（しゃくどうとう）を二振り取り出し、すばやく振り上げ、向き直って迎え撃った。二人は斜面の前で、行きつ戻りつ、突き進みぶつかり合いながら、勝負を争った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "虎の妖怪は『黄風大王の配下の先鋒』と名乗るが、『虎先鋒』の呼称が明示されるのは後の門番への伝言である。それまで地の文・ラベルは虎の妖怪とした。洞主も語り手が黄風怪と明示するまで洞主とする。"
- "id": "xy-ch20-023"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那孫行者攙起唐僧道：「師父，你莫害怕。且坐住，等老孫去助助八戒，打倒那怪好走。」三藏才坐將起來，戰兢兢的，口裡念著《多心經》不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    行者は三蔵を助け起こした。
    行者「お師匠さま、怖がらないでください。ひとまずここへお座りください。この孫さまが八戒を助けて、あの妖怪を倒してから先へ進みましょう。」
    三蔵はようやく身を起こして座り、ぶるぶる震えながら『多心経』を唱えた。その話はひとまずおく。
  "translation_status": "reviewed"
- "id": "xy-ch20-024"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者掣了鐵棒，喝聲叫：「拿了！」此時八戒抖擻精神，那怪敗下陣去。行者道：「莫饒他，務要趕上。」他兩個掄起鈀，舉鐵棒，趕下山來。那怪慌了手腳，使個金蟬脫殼計，打個滾，現了原身，依然是一隻猛虎。行者與八戒那裡肯捨，趕著那虎，定要除根。那怪見他趕得至近，卻又摳著胸膛，剝下皮來，苫蓋在那臥虎石上，脫真身，化一陣狂風，徑回路口。忽見著那師父正念《多心經》，被他一把拿住，駕長風攝將去了。可憐那三藏啊，江流註定多磨折，寂滅門中功行難。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    行者は鉄の棒を抜き、大声で叫んだ。
    行者「捕らえろ！」
    八戒はそこでいよいよ奮い立ち、妖怪は戦いに敗れて逃げ出した。
    行者「逃がすな。必ず追いつくんだ。」
    二人は鈀を振り、鉄の棒を掲げ、山を下って追いかけた。妖怪は慌てふためき、金蝉脱殻（きんせんだっかく）の計を使った。ひと転がりして本来の姿を現すと、もとの一頭の猛虎となったのである。行者と八戒は決して放そうとせず、根こそぎ退治しようと虎を追った。妖怪は二人が間近まで追いついたのを見て、また胸に爪をかけて皮を脱ぎ、伏せた虎に似た岩にかぶせた。自分の体はそこから抜け出し、一陣の狂風と化して、まっすぐ道の入口へ戻った。ふと見ると、三蔵がまさに『多心経』を唱えている。妖怪は一つかみにし、吹き渡る風に乗ってさらっていった。哀れな三蔵よ。江流（こうりゅう）には苦難が重なる定め、寂滅（じゃくめつ）の門で功を積むのは難しい。
  "translation_status": "reviewed"
- "id": "xy-ch20-025"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪把唐僧擒來洞口，按住狂風，對把門的道：「你去報大王說，前路虎先鋒拿了一個和尚，在門外聽令。」那洞主傳令，教拿進來。那虎先鋒腰插著兩口赤銅刀，雙手捧著唐僧，上前跪下道：「大王，小將不才，蒙鈞令差往山上巡邏，忽遇一個和尚，他是東土大唐駕下御弟三藏法師，上西方拜佛求經，被我擒來奉上，聊具一饌。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    妖怪は三蔵を捕らえて洞の入口へ来ると、狂風を鎮め、門番に言った。
    虎の妖怪「大王に申し上げろ。先鋒の虎先鋒（こせんぽう）が坊主を一人捕らえ、門の外で命令をお待ちしているとな。」
    洞主は、連れて入れと命じた。虎先鋒は赤銅刀二振りを腰に差し、両手で三蔵を抱え、前へ進んでひざまずいた。
    虎先鋒「大王、未熟な小将の私は、ご命令を受けて山の巡回に出ましたところ、ある僧に出会いました。東土大唐の帝の御弟（ぎょてい）、三蔵法師（さんぞうほうし）で、西方へ仏を拝し、経を求めに行く者です。捕らえてお連れしましたので、いささかながらお食事に供します。」
  "translation_status": "reviewed"
- "id": "xy-ch20-026"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那洞主聞得此言，吃了一驚道：「我聞得前者有人傳說：三藏法師乃大唐奉旨意取經的神僧；他手下有一個徒弟，名喚孫行者，神通廣大，智力高強。你怎麼能夠捉得他來？」先鋒道：「他有兩個徒弟：先來的使一柄九齒釘鈀，他生得嘴長耳大；又一個使一根金箍鐵棒，他生得火眼金睛。正趕著小將爭持，被小將使一個金蟬脫殼之計，撤身得空，把這和尚拿來，奉獻大王，聊表一餐之敬。」洞主道：「且莫吃他哩。」先鋒道：「大王，見食不食，呼為劣蹶？」洞主道：「你不曉得。吃了他不打緊，只恐怕他那兩個徒弟上門吵鬧，未為穩便。且把他綁在後園定風樁上，待三五日，他兩個不來攪擾，那時節，一則圖他身子乾淨，二來不動口舌，卻不任我們心意？或煮或蒸，或煎或炒，慢慢的自在受用不遲。」先鋒大喜道：「大王深謀遠慮，說得有理。」教：「小的們，拿了去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    洞主はこの話を聞くと、驚いた。
    洞主「以前、人の話を聞いたことがある。三蔵法師は大唐の勅命で経を取りに行く神僧で、その配下には孫行者（そんぎょうじゃ）という弟子がおり、神通力は広大、知恵も力も並外れているというぞ。どうやってあの者を捕らえてこられたのだ。」
    虎先鋒「弟子は二人おります。先に来た者は九歯釘鈀（きゅうしていは）を一本使い、口が長く、耳が大きい。もう一人は金箍鉄棒（きんこてつぼう）を一本使い、火の目に金の瞳をしております。二人が小将の私を追って争っていたので、金蝉脱殻の計を使い、身を引いて隙をつくり、この僧を捕らえ、大王に献上して、一食ばかりの敬意を表した次第です。」
    洞主「今はまだ食うな。」
    虎先鋒「大王、食い物を見ながら食わぬのは、ひねくれ者と言うではありませんか。」
    洞主「お前には分からぬ。食うだけなら何でもないが、あの二人の弟子が門前へ騒ぎに来れば、安心できぬだろう。まずは裏庭の定風樁（ていふうとう）に縛っておけ。三、五日待って、あの二人が邪魔をしに来なければ、そのころには一つにはあの者の体もきれいになり、二つには口争いもせずに済む。あとは我々の思いのままではないか。煮るなり蒸すなり、焼くなり炒めるなり、ゆっくり気ままに味わっても遅くはない。」
    虎先鋒は大喜びした。
    虎先鋒「大王は深くお考えになり、先々まで見通しておられる。おっしゃるとおりです。」
    そして命じた。
    虎先鋒「お前たち、連れていけ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『見食不食，呼為劣蹶』の劣蹶は教育部系辞書で、もとは馬が従順でないことから、人の頑固な性分をいう語とされる。ここでは食べないことへの反語的な非難を『ひねくれ者と言うではありませんか』とした。『身子乾淨』は体をきれいにするという原文のままとし、排泄・絶食・呪術など具体的手段を補っていない。"
- "id": "xy-ch20-027"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "旁邊擁上七八個綁縛手，將唐僧拿去，好便似鷹拿燕雀，索綁繩纏。這的是苦命江流思行者，遇難神僧想悟能。道聲：「徒弟啊！不知你在那山擒怪，何處降妖，我卻被魔頭拿來，遭此毒害，幾時再得相見？好苦啊！你們若早些兒來，還救得我命；若十分遲了，斷然不能保矣。」一邊嗟嘆，一邊淚落如雨。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    傍らから、縛り役が七、八人押し寄せ、三蔵を引き立てていった。まるで鷹が燕や雀を捕らえるように、綱で縛り、縄を巻きつけたのである。まさに、薄幸の江流は行者を思い、難に遭った神僧は悟能を恋う。
    三蔵「弟子たちよ。どの山で怪を捕らえ、どこで妖を降しているのだろう。私は魔物に捕らえられ、こんなひどい目に遭っている。いつになったら、また会えるのだ。ああ、つらい。早く来てくれれば、まだ命を救えるだろうが、すっかり遅れてしまえば、もう助かりはしない。」
    嘆きながら、涙を雨のように流した。
  "translation_status": "reviewed"
- "id": "xy-ch20-028"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那行者、八戒趕那虎下山坡，只見那虎跑倒了，塌伏在崖前。行者舉棒儘力一打，轉震得自己手疼。八戒復築了一鈀，亦將鈀齒迸起。原來是一張虎皮，蓋著一塊臥虎石。行者大驚道：「不好了，不好了，中了他計也！」八戒道：「中他甚計？」行者道：「這個叫做金蟬脫殼計：他將虎皮蓋在此，他卻走了。我們且回去看看師父，莫遭毒手。」兩個急急轉來，早已不見了三藏。行者大叫如雷道：「怎的好？師父已被他擒去了。」八戒即便牽著馬，眼中滴淚道：「天哪，天哪！卻往那裡找尋？」行者擡著頭道：「莫哭，莫哭，一哭就挫了銳氣。橫豎想只在此山，我們尋尋去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    さて、行者と八戒は虎を追って斜面を下り、虎が走ってきて倒れ、崖の前に平たく伏せているのを見つけた。行者は棒を振り上げ、力いっぱい打ったが、かえって反動で自分の手が痛くなった。八戒も鈀を一撃打ち込んだが、その歯が跳ね返された。実は、伏せた虎に似た岩に、一枚の虎の皮をかぶせてあったのだ。行者は大いに驚いた。
    行者「しまった、しまった。奴の計略にかかったぞ！」
    八戒「どんな計略だい。」
    行者「これが金蝉脱殻の計というやつだ。ここへ虎の皮をかぶせ、自分は逃げてしまったのだ。まず戻ってお師匠さまを見よう。ひどい目に遭っていなければよいが。」
    二人は急いで戻ったが、三蔵の姿はすでになかった。行者は雷のような大声を上げた。
    行者「どうしよう。お師匠さまはもう奴にさらわれてしまった。」
    八戒はすぐに馬を引き、目から涙をこぼした。
    八戒「ああ、何てことだ。いったいどこを探せばいいんだ。」
    行者は顔を上げて言った。
    行者「泣くな、泣くな。泣けば気勢がくじける。いずれにせよ、この山の中にいるはずだ。探しに行こう。」
  "translation_status": "reviewed"
- "id": "xy-ch20-029"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個果奔入山中，穿崗越嶺，行夠多時，只見那石崖之下聳出一座洞府。兩人定步觀瞻，果然兇險。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 181
    "line_end": 181
  "translation_ja": "二人はさっそく山へ駆け入り、丘を抜け、峰を越えた。長いこと歩くと、岩壁の下に洞府がそびえているのが見えた。二人は足を止めて眺めた。なるほど険悪な場所である。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch20-030"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": "疊障尖峰，迴巒古道。青松翠竹依依，綠柳碧梧冉冉。崖前有怪石雙雙，林內有幽禽對對。澗水遠流沖石壁，山泉細滴漫沙堤。野雲片片，瑤草芊芊。妖狐狡兔亂攛梭，角鹿香獐齊鬥勇。劈崖斜掛萬年籐，深壑半懸千歲柏。奕奕巍巍欺華嶽，落花啼鳥賽天臺。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    重なる岩壁、とがる峰、巡る山並み、古い道。
    青い松と翠の竹はしなやかに、緑の柳と碧い梧桐はゆらゆらと。
    崖の前には怪石が二つずつ、林の中には幽かな鳥がつがいずつ。
    谷の水は遠く流れて石壁を洗い、山の泉は細く滴り、砂の堤にあふれる。
    野の雲は一片また一片、瑤草（ようそう）は生い茂る。
    妖しい狐とすばしこい兎が、梭（ひ）のように入り乱れて駆け、角のある鹿と香を持つ麞が、そろって勇を競う。
    裂けた崖には万年の藤が斜めに垂れ、深い谷には千年の柏（はく）が半ば宙につり下がる。
    輝かしく高くそびえて華岳（かがく）をしのぎ、散る花と鳴く鳥では天台（てんだい）にも負けはしない。
  "translation_status": "reviewed"
- "id": "xy-ch20-031"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「賢弟，你可將行李歇在藏風山凹之間，撒放馬匹，不要出頭。等老孫去他門首與他賭鬥，必須拿住妖精，方才救得師父。」八戒道：「不消吩咐，請快去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    行者「兄弟、荷物は風の当たらぬ山のくぼみに下ろし、馬を放しておけ。姿を見せるな。この俺が門前へ行って勝負を挑む。妖怪を捕らえてこそ、お師匠さまも救えるのだ。」
    八戒「言われなくても分かっている。早く行ってくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch20-032"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者整一整直裰，束一束虎裙，掣了棒，撞至那門前，只見那門上有六個大字，乃「黃風嶺黃風洞」。卻便丁字腳站定，執著棒，高叫道：「妖怪，趁早兒送我師父出來，省得掀翻了你窩巢，屣平了你住處。」那小怪聞言，一個個害怕，戰兢兢的跑入裡面報道：「大王，禍事了。」那黃風怪正坐間，問：「有何事？」小妖道：「洞門外來了一個雷公嘴毛臉的和尚，手持著一根許大粗的鐵棒，要他師父哩。」那洞主驚張，即喚虎先鋒道：「我教你去巡山，只該拿些山牛、野彘、肥鹿、胡羊，怎麼拿那唐僧來，卻惹他那徒弟來此鬧吵，怎生區處？」先鋒道：「大王放心穩便，高枕勿憂。小將不才，願帶領五十個小校出去，把那甚麼孫行者拿來湊吃。」洞主道：「我這裡除了大小頭目，還有五七百名小校，憑你選擇，領多少去。只要拿住那行者，我們才自自在在吃那和尚一塊肉，情願與你拜為兄弟；但恐拿他不得，反傷了你，那時休得埋怨我也。」虎怪道：「放心，放心。等我去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    行者は直裰（ちょくたつ）を整え、虎皮の腰巻きを締め直し、棒を抜いて門前へ突き進んだ。見ると、門には「黄風嶺黄風洞（こうふうどう）」という六つの大きな字がある。そこで足を丁の字に開いて踏ん張り、棒を持って高らかに叫んだ。
    行者「妖怪、さっさとお師匠さまを返せ。そうすれば、お前の巣をひっくり返し、住みかを踏みつぶさずに済むぞ。」
    小妖たちはその声を聞くと、一人残らず怖がり、ぶるぶる震えながら中へ走って報告した。
    小妖たち「大王、大変です。」
    黄風怪（こうふうかい）は座ったまま尋ねた。
    黄風怪「何事だ。」
    小妖たち「洞の門の外に、雷公のような口に毛むくじゃらの顔をした坊主が来ております。ひどく太い鉄の棒を手に持ち、師匠を返せと言っています。」
    黄風怪はうろたえ、すぐに虎先鋒を呼んだ。
    黄風怪「お前に山を見回れと命じたのは、山の牛、野の猪、肥えた鹿、胡羊（こよう）などを捕らえさせるためだ。なぜ唐僧（とうそう）などを捕らえ、弟子がここへ騒ぎに来るような厄介を引き起こした。どう始末するのだ。」
    虎先鋒「大王、どうぞ心安くお構えください。枕を高くして、ご心配には及びません。未熟な小将の私が、五十人の手下を率いて出て、その何とかいう孫行者を捕らえ、一緒に食う足しにしてご覧に入れます。」
    黄風怪「ここには大小の頭目のほかにも、五百から七百の手下がいる。好きに選び、何人でも連れていけ。あの行者を捕らえてこそ、我々もあの僧の肉を心おきなく一切れ食えるのだ。そうなれば、喜んでお前と義兄弟になろう。ただ、捕らえられず、かえってお前が傷つくことを恐れる。そのとき私を恨むなよ。」
    虎先鋒「ご安心ください、ご安心ください。では、行ってまいります。」
  "translation_status": "reviewed"
- "id": "xy-ch20-033"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "果然點起五十名精壯小妖，擂鼓搖旗，纏兩口赤銅刀，騰出門來，厲聲高叫道：「你是那裡來的個猴和尚，敢在此間大呼小叫的做甚？」行者罵道：「你這個剝皮的畜生！你弄甚麼脫殼法兒，把我師父攝了，倒轉問我做甚。趁早好好送我師父出來，還饒你這個性命。」虎怪道：「你師父是我拿了，要與我大王做頓下飯。你識起倒，回去罷；不然，拿住你，一齊湊吃，卻不是買一個又饒一個？」行者聞言，心中大怒，扢迸迸鋼牙錯嚙，滴流流火眼睜圓，掣鐵棒喝道：「你多大手段，敢說這等大話？休走，看棍。」那先鋒急持刀接住。這一場果然不善，他兩個各顯威能，好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    虎先鋒はさっそく精悍な小妖を五十人選び、太鼓を打ち、旗を振らせ、二振りの赤銅刀を身に帯びて門から躍り出ると、鋭い声を張り上げた。
    虎先鋒「お前はどこから来た猿坊主だ。ここで大声を張り上げて、いったい何をする。」
    行者は罵った。
    行者「皮を剝ぐ畜生め！　妙な抜け殻の術を使ってお師匠さまをさらっておきながら、逆に俺へ何をするとは何だ。さっさとおとなしくお師匠さまを返せ。そうすれば命だけは助けてやる。」
    虎先鋒「お前の師匠は、俺が捕らえたのだ。大王の飯のおかずにするのさ。物の道理が分かるなら、帰れ。さもなければ、お前も捕らえて一緒に食ってやる。一つ買えばもう一つおまけがつくというわけだ。」
    行者はそれを聞いて腹の底から怒り、鋼の歯をぎりぎり食いしばり、火のような目をぎょろりと丸く見開くと、鉄の棒を抜いて喝した。
    行者「どれほどの腕があって、そんな大口をたたく。逃げるな、棒を受けろ！」
    虎先鋒は急いで刀を構え、受け止めた。この一戦は、まことにただでは済まぬ。二人はそれぞれの力を現した。なんと激しい戦いか。
  "translation_status": "reviewed"
- "id": "xy-ch20-034"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    那怪是個真鵝卵，悟空是個鵝卵石。
    赤銅刀架美猴王，渾如壘卵來擊石。
    鳥鵲怎與鳳凰爭，鵓鴿敢和鷹鷂敵。
    那怪噴風灰滿山，悟空吐霧雲迷日。
    來往不禁三五回，先鋒腰軟全無力。
    轉身敗了要逃生，卻被悟空抵死逼。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 189
    "line_end": 194
  "translation_ja": |-
    妖怪は本物の鵞鳥（がちょう）の卵、悟空は卵形の丸い石。
    赤銅刀で美猴王（びこうおう）を受け止めるのは、卵を積み重ねて石に打ちつけるようなもの。
    鵲（かささぎ）がどうして鳳凰（ほうおう）と争えよう、鳩が鷹や鷂（はいたか）と敵対できようか。
    妖怪が風を噴けば灰が山に満ち、悟空が霧を吐けば雲が日を隠す。
    三、五合も渡り合うのに耐えられず、先鋒は腰が抜けて力を失う。
    身を返して敗走し、命をつなごうとするが、悟空は死にものぐるいで追い詰める。
  "translation_status": "reviewed"
- "id": "xy-ch20-035"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那虎怪抵架不住，回頭就走。他原來在那洞主面前說了嘴，不敢回洞，徑往山坡上逃生。行者那裡肯放，執著棒，只情趕來，呼呼吼吼，喊聲不絕，卻趕到那藏風山凹之間。正擡頭，見八戒在那裡放馬。八戒忽聽見呼呼聲喊，回頭觀看，乃是行者趕敗的虎怪，就丟了馬，舉起鈀，刺斜著頭一築。可憐那先鋒，脫身要跳黃絲網，豈知又遇罩魚人，卻被八戒一鈀，築得九個窟窿鮮血冒，一頭腦髓盡流乾。有詩為證，詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 195
    "line_end": 195
  "translation_ja": "虎先鋒は受けきれなくなり、振り返って逃げ出した。黄風怪の前で大口をたたいていたので、洞には帰れず、まっすぐ山の斜面へ逃れて命をつなごうとした。行者が放しておくはずもない。棒を持ち、ひたすら追いかけ、吼え叫ぶ声を絶やさぬまま、風の当たらぬ山のくぼみへ追い込んだ。そこで顔を上げると、八戒が馬を放していた。八戒は突然、吼え叫ぶ声を聞き、振り向いて見ると、行者に負かされ追われてくる虎先鋒だった。そこで馬を放って鈀を振り上げ、斜めから頭めがけて打ち込んだ。哀れな先鋒、身を抜いて黄絹の網を飛び越えようとしたのに、また投網の漁師に出会おうとは思いもよらぬ。八戒の一撃で、九つの穴から鮮血が噴き、頭いっぱいの脳髄は残らず流れ出た。証拠の詩がある。詩にいう、"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『黃絲網』『罩魚人』の逃走と再捕獲の比喩を保持し、妖怪が実際に網にかかった出来事へ変えない。殺害時の九つの穴と脳髄の描写も省略していない。"
- "id": "xy-ch20-036"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    三五年前歸正宗，持齋把素悟真空。
    誠心要保唐三藏，初秉沙門立此功。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 197
    "line_end": 198
  "translation_ja": |-
    三、五年前に正しい教えへ帰し、斎戒（さいかい）し精進を守って真空（しんくう）を悟る。
    真心から唐三蔵（とうさんぞう）を守ろうとし、初めて仏門に身を置いて、この功を立てた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『三五年前』は三、五年前という原文の年数を保持する。前回の入門からの経過日数に合わせて数日前へ変更せず、観音への帰依と三蔵門下への加入のどちらを数えるかも原文以上に断定しない。『真空』は物理的な真空ではなく仏教の空の境地。"
- "id": "xy-ch20-037"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子一腳屣住他的脊背，兩手掄鈀又築。行者見了，大喜道：「兄弟，正是這等。他領了幾十個小妖，敢與老孫賭鬥，被我打敗了，他轉不往洞跑，卻跑來這裡尋死。虧你接著，不然又走了。」八戒道：「弄風攝師父去的可是他？」行者道：「正是，正是。」八戒道：「你可曾問他師父的下落麼？」行者道：「這怪把師父拿在洞裡，要與他甚麼鳥大王做下飯。老孫惱了，就與他鬥將這裡來，卻被你送了性命。兄弟啊，這個功勞算你的。你可還守著馬與行李，等我把這死怪拖了去，再到那洞口索戰。須是拿得那老妖，方才救得師父。」八戒道：「哥哥說得有理。你去，你去。若是打敗了這老妖，還趕將這裡來，等老豬截住殺他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 199
    "line_end": 199
  "translation_ja": |-
    八戒は片足で虎先鋒の背を踏みつけ、両手で鈀を振り、さらに打ち込んだ。行者はそれを見ると大喜びした。
    行者「兄弟、まさにそうしてくれればよい。こいつは数十人の小妖を率いて、この孫さまに勝負を挑んだのだ。俺に打ち負かされると、洞へは逃げ帰らず、ここへ死にに来た。お前が受け止めてくれて助かった。でなければ、また逃げられていたぞ。」
    八戒「風を起こして、お師匠さまをさらったのは、こいつかい。」
    行者「そうだ、そうだ。」
    八戒「お師匠さまの行方は、もう聞いたのかい。」
    行者「こいつはお師匠さまを洞へ連れ込み、何とかいうろくでもない大王の飯のおかずにするつもりなのだ。この孫さまは腹が立ち、戦いながらここへ来たところ、お前が息の根を止めたのさ。兄弟、この手柄はお前のものだ。引き続き馬と荷物を守っていてくれ。俺はこの死んだ妖怪を引きずっていき、もう一度洞の入口で勝負を挑む。あの親玉を捕らえてこそ、お師匠さまを救えるのだ。」
    八戒「兄貴の言うとおりだ。行け、行け。あの親玉を負かしたら、またここへ追ってきてくれ。この猪さまが待ち受けて殺してやる。」
  "translation_status": "reviewed"
- "id": "xy-ch20-038"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，一隻手提著鐵棒，一隻手拖著死虎，徑至他洞口。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 201
    "line_end": 201
  "translation_ja": "見事な行者は、片手に鉄の棒を提げ、片手で死んだ虎を引きずり、まっすぐ洞の入口へ向かった。まさに、"
  "translation_status": "reviewed"
- "id": "xy-ch20-039"
  "section_id": "chapter-20"
  "kind": "verse"
  "origin": "source"
  "source_text": "法師有難逢妖怪，情性相和伏亂魔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 203
    "line_end": 203
  "translation_ja": |-
    法師は難に遭い、妖怪に出会う。
    情と性が相和して、乱す魔を降す。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『情性相和』は情と性が調和する修心の寓意を保つ。二つをただ弟子二人の仲の良さへ還元せず、それぞれの人物と教義概念の対応も本文内で断定しない。"
- "id": "xy-ch20-040"
  "section_id": "chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去可降得妖怪，救得唐僧，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第020回&oldid=1455569"
    "line_start": 205
    "line_end": 205
  "translation_ja": "さて、今度こそ妖怪を降し、唐僧を救うことができるのか。それは次の回でお聞きいただこう。"

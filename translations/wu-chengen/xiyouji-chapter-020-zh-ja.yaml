  "known_gaps":
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-002"
    "description_ja": "鼻縄で牛をつなぎ、最後に人と牛がともに見えなくなる表現を、心を調える修行の寓意として訳した。特定の十牛図の段階と一対一には対応づけず、心・法・生滅の語も本文以上に教義へ固定しない。『無為』は仏教の生滅を離れた真実という語義を採用し、単なる怠惰や道家の無為自然と混同しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-006"
    "description_ja": "『恨苦修行』は底本の字を残した。教育部『重編國語辭典修訂本』は『痛苦修行』と説明するため、苦しみに耐える修行と解した。『刻苦』など別の熟語へ補訂していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-008"
    "description_ja": "底本は『不受天錄』であり、『天禄』等へ訂正せず、天の名簿・統制を受け入れない意に解した。『踢天弄井』は乱暴な大技を誇る慣用表現として、天を蹴り井戸をかき回す像を保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-012"
    "description_ja": "『有幾位令嗣』『有兩個小兒』『年壽幾何』『痴長六十一歲』の省略された話者は、質問を三蔵、返答を宿主と文脈から判断した。『花甲重逢』は直前の六十一歳を受け、干支が一巡して再び同じ年にめぐり合う意とし、百二十歳などへ年齢を変えていない。姓の判明前は老人、名乗り後は王老人とする。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-013"
    "description_ja": "『殽』は肴、『爻』は易の爻で、中国語の音を利用した掛け合い。八戒の返答に五爻・六爻と占いへの言及を残した。語義の異なる二字を同一の語へ統一していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-015"
    "description_ja": "底本の『寶\U00029262』を『宝\U00029262』と保持した。中国哲学書電子化計画の『康熙字典』では\U00029262を『鞍也』『音戟』とする。他の公開翻刻には『宝镫』『宝鞭』があるが、底本をそれらへ補訂していない。『斜挑』を斜めに持ち上げると直訳したが、鞍という字義と馬上の具体的動作の関係は未確定。日本語読み『ほうげき』は『音戟』と日本漢字音に基づく推定である。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-016"
    "description_ja": "『當倒洞當當倒洞，洞當當倒洞當山』は音を重ねた山の描写として、洞・山の字を残して調子を移した。字面だけから特定の地形へ確定していない。『登的洞門』の主語・動作も明瞭でなく、洞の口を上る動きとして仮訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-017"
    "description_ja": "三蔵の『你看這風』から次の韻文末まで一続きの発話である。原文の段落区分を保持し、訳文でも開き括弧を次の詩末で閉じた。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-022"
    "description_ja": "虎の妖怪は『黄風大王の配下の先鋒』と名乗るが、『虎先鋒』の呼称が明示されるのは後の門番への伝言である。それまで地の文・ラベルは虎の妖怪とした。洞主も語り手が黄風怪と明示するまで洞主とする。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-026"
    "description_ja": "『見食不食，呼為劣蹶』の劣蹶は教育部系辞書で、もとは馬が従順でないことから、人の頑固な性分をいう語とされる。ここでは食べないことへの反語的な非難を『ひねくれ者と言うではありませんか』とした。『身子乾淨』は体をきれいにするという原文のままとし、排泄・絶食・呪術など具体的手段を補っていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-035"
    "description_ja": "『黃絲網』『罩魚人』の逃走と再捕獲の比喩を保持し、妖怪が実際に網にかかった出来事へ変えない。殺害時の九つの穴と脳髄の描写も省略していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-036"
    "description_ja": "『三五年前』は三、五年前という原文の年数を保持する。前回の入門からの経過日数に合わせて数日前へ変更せず、観音への帰依と三蔵門下への加入のどちらを数えるかも原文以上に断定しない。『真空』は物理的な真空ではなく仏教の空の境地。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch20-1455569"
    "segment_ids":
    - "xy-ch20-039"
    "description_ja": "『情性相和』は情と性が調和する修心の寓意を保つ。二つをただ弟子二人の仲の良さへ還元せず、それぞれの人物と教義概念の対応も本文内で断定しない。 本文の欠落ではなく解釈・校訂上の留保。"

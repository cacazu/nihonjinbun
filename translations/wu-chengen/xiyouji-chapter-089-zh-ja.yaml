      "description_ja": "原文は「\U000247F7猍口」「查耳朵」「砍額頭」「青臉泡浮」。\U000247F7はUnicode U+247F7であり、原文欄ではそのまま保持した。字形と顔つきの文脈から口のゆがみを表すと解し、耳は張り出し、額は削いだようで、青い顔はむくむと訳した。\U000247F7猍の厳密な語義と「砍」の具体的形状は確定できていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch89-1500528"
      "segment_ids":
        - "xy-ch89-021"
      "description_ja": "変装の割当は八戒が刁鑽古怪、悟空が古怪刁鑽。しかし黄獅は悟空へ「刁鑽兒」、八戒へ「古怪」と呼びかける。二名は同じ二語の逆順で、短称の取り方は一様でない。呼びかけは底本を保ち、通常の話者ラベルは悟空・八戒のままにする。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch89-1500528"
      "segment_ids":
        - "xy-ch89-027"
      "description_ja": "ここで物の由来を尋ねる「王子」は、三人の息子の直後に現れる一方、この回では父王にも同じ語が使われる。父王か息子の一人か、またどの息子かを確定せず、「王家の一人」とした。 原文の欠落ではなく、解釈・校訂上の留保。"

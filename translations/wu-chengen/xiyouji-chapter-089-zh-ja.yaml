  - "id": "xy-ch89-002"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那院中幾個鐵匠因連日辛苦，夜間俱自睡了。及天明起來打造，篷下不見了三般兵器，一個個呆掙神驚，四下尋找。只見那三個王子出宮來看，那鐵匠一齊磕頭道：「小主啊，神師的三般兵器，都不知那裡去了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 122
        "line_end": 122
    "translation_ja": "さて、王府の庭にいた鉄工たちは、連日の仕事に疲れ、夜は皆眠っていた。夜が明けて仕事に取りかかろうとすると、天幕の下から三種類の武器がなくなっている。一人残らず呆然とし、驚き慌ててあちこちを探した。そこへ三人の王子が宮中から様子を見に来ると、鉄工たちは一斉にひざまずいて頭を地につけ、鉄工たち「若殿さま、神師さまの三種類の武器が、どれもどこへ行ったか分からなくなりました。」"
    "translation_status": "reviewed"
  - "id": "xy-ch89-003"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "小王子聽言，心驚膽戰道：「想是師父今夜收拾去了。」急奔暴紗亭看時，見白馬尚在廊下，忍不住叫道：「師父還睡哩？」沙僧道：「起來了。」即將房門開了，讓王子進裡看時，不見兵器，慌慌張張問道：「師父的兵器都收來了？」行者跳起道：「不曾收啊。」王子道：「三般兵器，今夜都不見了。」八戒連忙爬起道：「我的鈀在麼？」小王道：「適才我等出來，只見眾人前後找尋不見，弟子恐是師父收了，卻才來問。老師的寶貝，俱是能長能消，想必藏在身邊哄弟子哩。」行者道：「委的未收。都尋去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      王子の一人は聞いて胸を震わせ、王子の一人「お師匠さまが、昨夜おしまいになったのだろう。」
      急いで暴紗亭（ぼうさてい）へ駆けつけると、白馬はまだ廊下にいた。思わず声を上げ、王子の一人「お師匠さま、まだお休みですか。」
      沙悟浄（さごじょう）「もう起きています。」
      沙悟浄がすぐに戸を開けて招き入れた。中を見ても武器がないので、王子の一人は慌てふためいて尋ねた。王子の一人「お師匠さま方の武器は、全部こちらへお持ちになりましたか。」
      悟空（ごくう）は跳ね起き、悟空「いや、持ってきちゃいないぞ。」
      王子の一人「三種類とも、昨夜のうちに消えてしまいました。」
      八戒（はっかい）も急いで起き上がり、八戒「俺の熊手はあるのか。」
      王子の一人「さきほど私たちが出てまいりますと、皆で前も後ろも探しておりましたが、見つかりません。お師匠さまが片づけられたのかと思い、お尋ねに来たのです。老師さまのお宝は、どれも大きくも小さくもなるもの。きっとお手元に隠し、弟子をからかっておいでなのでしょう。」
      悟空「本当に片づけちゃいない。みんなで探しに行こう。」
    "translation_status": "reviewed"
  - "id": "xy-ch89-004"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "隨至院中篷下，果然不見蹤影。八戒道：「定是這夥鐵匠偷了。快拿出來，略遲了些兒，就都打死，打死。」那鐵匠慌得磕頭滴淚道：「爺爺，我們連日辛苦，夜間睡著，乃至天明起來，遂不見了。我等乃一概凡人，怎麼拿得動？望爺爺饒命，饒命。」行者無語，暗恨道：「還是我們的不是，既然看了式樣，就該收在身邊，怎麼卻丟放在此？那寶貝霞彩光生，想是驚動甚麼歹人，乘夜竊去也。」八戒不信道：「哥哥說那裡話？這般個太平境界，又不是曠野深山，怎得個歹人來？定是鐵匠欺心，他見我們的兵器光彩，認得是三件寶貝，連夜走出王府，夥些人來，擡的擡，拉的拉，偷出去了。拿過來打呀，打呀。」眾匠只是磕頭發誓。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      一緒に庭の天幕の下へ行ってみると、なるほど影も形もなかった。
      八戒「きっと、この鉄工どもが盗んだんだ。さっさと出せ。少しでもぐずぐずしたら、皆打ち殺すぞ、打ち殺すぞ！」
      鉄工たちは恐れおののき、頭を地につけて涙を流し、鉄工たち「お師匠さま、私どもは連日の仕事で疲れ、夜は眠り込んでおりました。夜が明けて起きたときには、もうなかったのでございます。私どもは皆ただの人間、どうして持ち動かせましょう。どうか命ばかりは、お助けください、お助けください。」
      悟空は声を出さず、心の中で悔やんだ。悟空の心の声「やっぱり俺たちが悪かった。形を見せたら、すぐ手元に戻しておけばよかったんだ。なぜここに置きっぱなしにした。宝の輝きが悪い奴の目を引いて、夜に紛れて盗んでいったんだろう。」
      八戒は納得せず、八戒「兄貴、何を言ってるんだ。こんな平穏な土地だぞ。荒野でも山奥でもあるまいし、悪い奴なんかどこから来る。きっと鉄工どもが悪心を起こしたんだ。俺たちの武器が光るのを見て、三つとも宝だと気づいた。夜のうちに王府を抜け出し、仲間を集め、担ぐ奴、引っぱる奴で盗み出したんだろう。引っ捕らえてぶて、ぶて！」
      鉄工たちは、ただ頭を地につけて無実を誓い続けた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-005"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正嚷處，只見老王子出來，問及前事，卻也面無人色，沉吟半晌道：「神師兵器，本不同凡，就有百十餘人也禁挫不動。況孤在此城，今已五代，不是大膽海口，孤也頗有個賢名在外；這城中軍民匠作人等，也頗懼孤之法度，斷是不敢欺心。望神師再思可矣。」行者笑道：「不用再思，也不須苦賴鐵匠。我問殿下：你這州城四面，可有甚麼山林妖怪？」王子道：「神師此問，甚是有理。孤這州城之北，有一座豹頭山，山中有一座虎口洞。往往人言洞內有仙，又言有虎狼，又言有妖怪。孤未曾訪得端的，不知果是何物。」行者笑道：「不消講了，定是那方歹人，知道俱是寶貝，一夜偷將去了。」叫：「八戒、沙僧，你都在此保著師父，護著城池，等老孫尋訪去來。」又叫鐵匠們不可住了爐火，一一煉造。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      騒いでいるところへ玉華王（ぎょくかおう）が出てきた。事情を尋ねると、王も顔色を失い、しばらく考え込んでから、玉華王「神師のお武器は、そもそも尋常の品ではない。百人余りを集めたところで、持ち動かせますまい。それに、わが家がこの城を治めて、今や五代になります。大言を吐くつもりではありませんが、私も世間では、多少は賢明な君主と評判を頂いております。この城の兵も民も職人も、私の法をそれなりに恐れておりますから、決して悪心など起こすまいと存じます。神師には、どうか今一度お考え直しください。」
      悟空は笑い、悟空「考え直すまでもないし、無理に鉄工たちのせいにする必要もない。殿下、一つ伺うが、この州城の周りの山や林に、妖怪はいないか。」
      玉華王「なるほど、それはもっともなお尋ねです。この州城の北に豹頭山（ひょうとうざん）という山があり、その中に虎口洞（ここうどう）という洞があります。洞には仙人がいるとも、虎や狼がいるとも、妖怪がいるとも、よく人が申します。私自身、確かなことを調べたわけではなく、本当は何がいるのか分かりません。」
      悟空は笑い、悟空「もう分かった。きっとそこの悪い奴が、どれも宝だと見抜いて、一晩のうちに盗んでいったんだ。」
      そして、悟空「八戒、沙悟浄、お前たちはここでお師匠さまと城を守っていろ。俺が探りに行ってくる。」
      さらに鉄工たちには、炉の火を止めず、それぞれの武器を鍛え続けるよう言いつけた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-006"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好猴王，辭了三藏，唿哨一聲，形影不見，早跨到豹頭山上。原來那城相去只有三十里，一瞬即到。徑上山峰觀看，果然有些妖氣。真是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 128
        "line_end": 128
    "translation_ja": "さすがの悟空、三蔵（さんぞう）に別れを告げると、一声口笛を吹き、姿も影も消えて、早くも豹頭山へひとまたぎ。城からはわずか三十里（り）なので、一瞬で着いた。まっすぐ山頂へ登って見渡すと、やはり妖気が漂っている。まさしく、こんな山であった。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-007"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": "龍脈悠長，地形遠大。尖峰挺挺插天高，陡澗沉沉流水急。山前有瑤草鋪茵，山後有奇花佈錦。喬松老柏，古樹修篁。山鴉山鵲亂飛鳴，野鶴野猴皆嘯唳。懸崖下，麋鹿雙雙；峭壁前，獾狐對對。一起一伏遠來龍，九曲九灣潛地脈。埂頭相接玉華州，萬古千秋興勝處。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      竜脈（りゅうみゃく）は遠く長く続き、地形は広々と雄大だ。
      尖った峰々はすっくと高く天を突き、切り立つ谷は深く、流れは速い。
      山の前には美しい草が敷物のように広がり、山の後ろには珍しい花が錦を織りなす。
      高い松、年経た柏、古木に長い竹。
      山烏と山鵲が入り乱れて飛び鳴き、野の鶴も猿も声を上げる。
      崖の下には大鹿や鹿が二匹ずつ、絶壁の前には穴熊、狐が二匹ずつ。
      遠くから来た竜のような山並みが起伏し、幾重にも曲がりくねった地脈が地中に潜む。
      尾根の先は玉華州（ぎょくかしゅう）へつながり、万古千秋に栄える景勝の地。
    "translation_status": "reviewed"
  - "id": "xy-ch89-008"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者正然看時，忽聽得山背後有人言語。急回頭視之，乃兩個狼頭妖怪，朗朗的說著話，向西北上走。行者揣道：「這定是巡山的怪物，等老孫跟他去聽聽，看他說些甚的。」捻著訣，念個咒，搖身一變，變做個蝴蝶兒，展開翅，翩翩翻翻，徑自趕上。果然變得有樣範："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      悟空が眺めていると、不意に山の向こうから人の話す声がした。すぐ振り向くと、狼の頭をした妖怪が二匹、朗らかに話しながら西北へ歩いていく。悟空は考えた。悟空の心の声「きっと山を見回っている化け物だ。あとをつけて、何を話しているのか聞いてやろう。」
      指で印を結び、呪文を唱え、身を振るうと一匹の蝶に変わった。羽を広げ、ひらひらと飛んで、まっすぐあとを追う。その変身は、実に見事だった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-009"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": "一雙粉翅，兩道銀鬚。乘風飛去急，映日舞來徐。渡水過牆能疾俏，偷香弄絮甚歡娛。體輕偏愛鮮花味，雅態芳情任卷舒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      ひと対の白粉まぶした羽に、二本の銀色の触角。
      風に乗れば素早く飛び、陽に映ればゆるやかに舞う。
      水を越え、塀を越える姿は敏捷で美しく、花の香を盗み、柳絮（りゅうじょ）と戯れて楽しげだ。
      軽い体はひときわ生花の蜜を好み、優雅な姿、花に寄せる心で、羽を思うままに開き閉じる。
    "translation_status": "reviewed"
  - "id": "xy-ch89-010"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他飛在那個妖精頭頂上，飄飄蕩蕩，聽他說話。那妖猛的叫道：「二哥，我大王連日僥倖：前月裡得了一個美人兒，在洞內盤桓，十分快樂；昨夜裡又得了三般兵器，果然是無價之寶。明朝開宴慶釘鈀會哩，我們都有受用。」這個道：「我們也有些僥倖：拿這二十兩銀子買豬羊去。如今到了乾方集上，先吃幾壺酒兒。把東西開個花帳兒，落他二三兩銀子，買件綿衣過寒，卻不是好？」兩個怪說說笑笑的，上大路急走如飛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      悟空は妖怪の頭の上をふわふわ飛びながら、話に耳を傾けた。すると、最初の狼頭の妖怪が急に声を上げた。最初の狼頭の妖怪「二番目の兄貴、うちの大王は、このところついてるな。先月は美人を一人手に入れて、洞で一緒に暮らし、たいそう楽しんでおられる。そのうえ昨夜は、三種類の武器を手に入れた。まったく値のつけられない宝だよ。明日の朝は宴を開いて、釘鈀会（ていはかい）のお祝いだ。俺たちも、ごちそうにありつけるぞ。」
      もう一匹の狼頭の妖怪「俺たちにも、ちょっと運が向いてるさ。この銀二十両（りょう）で、豚と羊を買いに行くんだ。乾方集（けんぽうしゅう）へ着いたら、まず酒を何壺か飲もうじゃないか。品物の勘定を水増しして二、三両浮かせ、綿入れを一着買って寒さをしのぐ。いい考えだろう。」
      二匹は笑いさざめきながら大通りに出て、飛ぶように歩いていった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-011"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽得要慶釘鈀會，心中暗喜。欲要打殺他，爭奈不干他事，況手中又無兵器。他即飛向前邊，現了本相，在路口上立定。那怪看看走到身邊，被他一口法唾噴將去，念一聲「唵吽吒唎」，即使個定身法，把兩個狼頭精定住。眼睜睜，口也難開；直挺挺，雙腳站住。又將他扳翻倒，揭衣搜檢，果是有二十兩銀子，著一條搭包兒打在腰間裙帶上；又各掛著一個粉漆牌兒，一個上寫著「刁鑽古怪」，一個上寫著「古怪刁鑽」。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      釘鈀会を祝うと聞いて、悟空はひそかに喜んだ。二匹を打ち殺そうとも思ったが、そもそも盗みはこの二匹のしたことではないし、手に武器もない。そこで前方へ飛んで本来の姿に戻り、道の分かれ目に立った。妖怪たちが近づいてきたところへ術を込めた唾を吹きかけ、悟空「唵吽吒唎（おんうんたり）。」
      一声唱えて定身法（ていしんほう）を使うと、狼頭の妖怪二匹はその場に固まった。目ばかり見開き、口を開くこともできず、両足を突っ立てたまま動けない。悟空はさらに二匹を引き倒して衣をめくり、体を探った。なるほど銀二十両が入った振り分け袋を、腰の裾帯に結びつけている。また、それぞれ白く漆を塗った札を掛けており、一方には「刁鑽古怪（ちょうさんこかい）」、もう一方には「古怪刁鑽（こかいちょうさん）」と書いてあった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-012"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，取了他銀子，解了他牌兒，返跨步回至州城。到王府中，見了王子、唐僧並大小官員、匠作人等，具言前事。八戒笑道：「想是老豬的寶貝霞彩光明，所以買豬羊，治筵席慶賀哩。但如今怎得他來？」行者道：「我兄弟三人俱去。這銀子是買辦豬羊的，且將這銀子賞了匠人，教殿下尋幾個豬羊。八戒，你變做刁鑽古怪，我變做古怪刁鑽，沙僧裝做個販豬羊的客人，走進那虎口洞裡，得便處，各人拿了兵器，打絕那妖邪，回來卻收拾走路。」沙僧笑道：「妙妙妙，不宜遲，快走。」老王果依此計，即教管事的買辦了七八口豬、四五腔羊。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空は銀を取り、札を外すと、ひとまたぎで州城へ戻った。王府に入り、玉華王、三蔵、それに上下の役人や鉄工たちと会うと、先ほどのことを詳しく話した。
      八戒は笑い、八戒「きっと俺の宝がまばゆく光るもんだから、豚や羊を買って宴のお祝いをするんだな。だが、どうやって取り戻すんだ。」
      悟空「俺たち三人で行く。この銀は豚や羊を買うためのものだが、ひとまず職人たちに褒美としてやろう。殿下には、豚と羊を何頭か用意していただく。八戒、お前は刁鑽古怪に化けろ。俺は古怪刁鑽になる。沙悟浄は豚や羊を売る商人に扮して、あの虎口洞へ入るんだ。隙を見つけて、それぞれ武器を取り返し、あの妖怪どもを皆殺しにする。戻ってきたら、旅立ちの支度だ。」
      沙悟浄は笑い、沙悟浄「いい、いい、実にいい策です。ぐずぐずせず、早く行きましょう。」
      玉華王はその計画どおり、すぐに係の者に命じて、豚を七、八頭、羊を四、五頭買いそろえさせた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-013"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他三人辭了師父，在城外大顯神通。八戒道：「哥哥，我未曾看見那刁鑽古怪，怎生變得他模樣？」行者道：「那怪被老孫使了定身法定住在那裡，直到明日此時方醒。我記得他的模樣，你站下，等我教你變。……如此，如彼，就是他的模樣了。」那獃子真個口裡念著咒，行者吹口仙氣，霎時就變得與那刁鑽古怪一般無二，將一個粉牌兒帶在腰間。行者即變做古怪刁鑽，腰間也帶了一個牌兒。沙僧打扮得像個販豬羊的客人。一起兒趕著豬羊，上大路，徑奔山來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      三人は師に別れを告げ、城の外で大いに神通力を発揮した。
      八戒「兄貴、俺は刁鑽古怪を見たことがないんだ。どうやってそいつの姿に化ければいい。」
      悟空「俺の定身法で、あいつはあそこに動けなくしてある。明日の今ごろまで目を覚まさない。姿は覚えているから、じっと立っていろ。俺が変わり方を教えてやる。……ここをこうして、そこをそうすれば、そいつの姿だ。」
      八戒が言われたとおり口の中で呪文を唱え、悟空が仙気（せんき）を吹きかけると、たちまち刁鑽古怪と寸分違わぬ姿になった。白い札を一枚、腰に着ける。悟空も古怪刁鑽に化け、腰にもう一枚の札を着けた。沙悟浄は豚と羊を売る商人の身なりをした。三人一緒に豚や羊を追い立て、大通りをまっすぐ山へ向かった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-014"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時，進了山凹裡，又遇見一個小妖，他生得嘴臉也恁地兇惡！看那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 141
        "line_end": 141
    "translation_ja": "ほどなく山のくぼみに入ると、また一匹の小妖に出会った。これがまた、何とも恐ろしい顔つきである。その姿を見れば、"
    "translation_status": "reviewed"
  - "id": "xy-ch89-015"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": "圓滴溜兩隻眼，如燈晃亮；紅剌媸一頭毛，似火飄光。糟鼻子，\U000247F7猍口，獠牙尖利；查耳朵，砍額頭，青臉泡浮。身穿一件淺黃衣，足踏一雙莎蒲履。雄雄糾糾若兇神，急急忙忙如惡鬼。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      くるくる丸い両目は、灯のようにぎらぎら輝き、
      真っ赤な頭の毛は、火のように光を揺らす。
      酒焼けの赤鼻、いびつに曲がった口に、鋭く尖った牙。
      張り出した耳、削り落としたような額、青い顔はむくんでいる。
      薄黄色の衣を一枚身に着け、両足には莎蒲履（さほり）を履く。
      いかめしく勇ましい姿は凶神さながら、せかせか忙しない様子は悪鬼のよう。
    "translation_status": "reviewed"
  - "id": "xy-ch89-016"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪左脅下挾著一個彩漆的請書匣兒，迎著行者叫道：「古怪刁鑽，你兩個來了？買了幾口豬羊？」行者道：「這趕的不是？」那怪朝沙僧道：「此位是誰？」行者道：「就是販豬羊的客人。還少他幾兩銀子，帶他來家取的。你往那裡去？」那怪道：「我往竹節山去請老大王明早赴會。」行者綽他的口氣兒，就問：「共請多少人？」那怪道：「請老大王坐首席，連本山大王共頭目等眾，約有四十多位。」正說處，八戒道：「去罷，去罷，豬羊都四散走了。」行者道：「你去邀著，等我討他帖兒看看。」那怪見自家人，即揭開取出，遞與行者。行者展開看時，上寫著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      その小妖は左の脇に、彩色した漆塗りの招待状入れを抱えていた。悟空を迎えて声を掛ける。小妖「古怪刁鑽、二人とも戻ってきたか。豚と羊は何頭買った。」
      悟空「今、追っているのがそうだろう。」
      小妖は沙悟浄に顔を向け、小妖「こちらは誰だ。」
      悟空「豚と羊を売っている商人さ。まだ銀を何両か払い足りないんで、取りに来てもらった。お前はどこへ行く。」
      小妖「竹節山（ちくせつざん）へ行って、老大王を明日の朝の宴にお招きするんだ。」
      悟空は相手の言葉をとらえ、悟空「全部で何人、お招きするんだ。」
      小妖「老大王には上座についていただく。この山の大王や頭領たちも合わせて、四十人余りになるだろうな。」
      話しているところへ、八戒「行けよ、行けよ。豚も羊も、ばらばらに逃げちまったぞ。」
      悟空「お前が追い集めてこい。俺はこいつから招待状を借りて見てみる。」
      小妖は身内だと思っているので、箱を開けて取り出し、悟空へ渡した。広げてみると、こう書かれていた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-017"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "明辰敬治餚酌，慶釘鈀嘉會，屈尊過山一敘。幸勿外，至感。右啟祖翁九靈元聖老大人尊前。門下孫黃獅頓首百拜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      明朝、謹んで酒肴を整え、釘鈀（ていは）のめでたい宴を祝いたく存じます。お手数ながら山を越えてお越しくださり、ひとときお話しください。どうか他人行儀なお断りなどなさらず、お越しいただければこの上ない幸いです。
      右、祖翁（そおう）・九霊元聖（きゅうれいげんせい）老大人の御前へ申し上げます。
      門下の孫、黄獅（こうし）、頭を垂れ百拝。
    "translation_status": "reviewed"
    "source_kind": "invitation"
  - "id": "xy-ch89-018"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者看畢，仍遞與那怪。那怪放在匣內，徑往東南上去了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 148
        "line_end": 148
    "translation_ja": "悟空は読み終えると、小妖に返した。小妖は箱に収め、まっすぐ東南へ去っていった。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-019"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧問道：「哥哥，帖兒上是甚麼話頭？」行者道：「乃慶釘鈀會的請帖。名字寫著『門下孫黃獅頓首百拜』。請的是祖翁九靈元聖老大人。」沙僧笑道：「黃獅想必是個金毛獅子成精。但不知九靈元聖是個何物？」八戒聽言，笑道：「是老豬的貨了。」行者道：「怎見得是你的貨？」八戒道：「古人云：『癩母豬專趕金毛獅子。』故知是老豬之貨物也。」他三人說說笑笑，趕著豬羊，卻就望見虎口洞門。但見那門兒外："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      沙悟浄「兄さん、招待状には何が書いてあったのですか。」
      悟空「釘鈀会を祝う招待状だ。署名は『門下の孫、黄獅、頭を垂れ百拝』。招く相手は『祖翁・九霊元聖老大人』とある。」
      沙悟浄は笑い、沙悟浄「黄獅なら、きっと金毛の獅子が化けたのでしょう。しかし九霊元聖というのは、何者でしょうね。」
      八戒はそれを聞いて笑い、八戒「そいつなら俺の獲物だ。」
      悟空「なぜ、お前の獲物だと分かる。」
      八戒「昔から『皮膚のただれた雌豚は、金毛の獅子ばかり追い立てる』というだろう。だから、俺の獲物だと分かるのさ。」
      三人は笑いながら豚と羊を追い、やがて虎口洞の入口を見つけた。その門の外は、
    "translation_status": "reviewed"
  - "id": "xy-ch89-020"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      周圍山遶翠，一脈氣連城。
      峭壁扳青蔓，高崖掛紫荊。
      鳥聲深樹匝，花影洞門迎。
      不亞桃源洞，堪宜避世情。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 151
        "line_end": 154
    "translation_ja": |-
      周りには緑の山々が巡り、ひと筋の気が城へつながる。
      切り立つ壁には青いつるが這い、高い崖には紫荊（はなずおう）が垂れる。
      深い木立は鳥の声に包まれ、洞の門には花の影が出迎える。
      桃源洞（とうげんどう）にも劣らず、世を逃れて暮らす心にふさわしい。
    "translation_status": "reviewed"
  - "id": "xy-ch89-021"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "漸漸近於門口，又見一叢大大小小的雜項妖精，在那花樹之下頑耍。忽聽得八戒「呵呵」趕豬羊到時，都來迎接。便就捉豬的捉豬，捉羊的捉羊，一齊綑倒。早驚動裡面妖王，領十數個小妖，出來問道：「你兩個來了？買了多少豬羊？」行者道：「買了八口豬，七腔羊，共十五個牲口。豬銀該一十六兩，羊銀該九兩。前者領銀二十兩，仍欠五兩。這個就是客人，跟來找銀子的。」妖王聽說，即喚：「小的們，取五兩銀子，打發他去。」行者道：「這客人一則來找銀子，二來要看看嘉會。」那妖大怒，罵道：「你這個刁鑽兒憊懶！你買東西罷了，又與人說甚麼會不會？」八戒上前道：「主人公得了寶貝，誠是天下之奇珍，就教他看看怕怎的？」那怪咄的一聲道：「你這古怪也可惡！我這寶貝乃是玉華州城中得來的，倘這客人看了，去那州中傳說，說得人知，那王子一時來訪求，卻如之何？」行者道：「主公，這個客人乃乾方集後邊的人，去州許遠，又不是他城中人也，那裡去傳說？二則他肚裡也饑了，我兩個也未曾吃飯，家中有現成酒飯，賞他些吃了，打發他去罷。」說不了，有一小妖取了五兩銀子，遞與行者。行者將銀子遞與沙僧道：「客人，收了銀子，我與你進後面去吃些飯來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      入口へ近づくと、花の咲く木の下で、大きいのも小さいのも取り交ぜて、さまざまな妖怪が遊んでいた。八戒「ほら、ほら！」
      豚や羊を追う声を聞くと、皆が迎えに出た。豚を捕らえる者、羊を捕らえる者、たちまち皆まとめて縛り倒してしまう。中の妖王、黄獅にもすぐに知れ、小妖を十数匹連れて出てきた。黄獅「二人とも戻ったか。豚と羊を、どれだけ買ってきた。」
      悟空「豚八頭に羊七頭、合わせて十五頭買ってきました。豚の代金が銀十六両、羊が九両です。先に頂いたのが二十両ですから、まだ五両足りません。こちらがその商人で、残りの銀を受け取りに来ました。」
      黄獅は聞くとすぐに、黄獅「お前たち、銀五両を取ってきて、客を帰してやれ。」
      悟空「このお客は、銀を取りに来ただけでなく、めでたい宴の様子も見たいのだそうです。」
      黄獅は激怒して罵った。黄獅「この刁鑽児（ちょうさんじ）め、横着な奴だ。買物をすればいいものを、よその者に宴の話なんかしてどうする！」
      八戒が進み出て、八戒「ご主人が手に入れた宝は、まさに天下の珍品です。ちょっと見せてやったって、構わないでしょう。」
      黄獅は一喝し、黄獅「この古怪（こかい）も、ふざけた奴だ。俺の宝は、玉華州の城で手に入れたものだぞ。こいつが見て、あの州へ行ってしゃべり、人に知られたらどうする。王がふと探しに来たりしたら、どうするんだ。」
      悟空「ご主人、このお客は乾方集の向こうに住んでいる者です。州からずっと遠いうえに、あの城の住民でもありません。どうしてわざわざ言いふらしに行くものですか。それに腹もすかせていますし、私たち二人も、まだ食事をしておりません。家に酒や飯ができているなら、少し食べさせてから帰してやってください。」
      言い終わらないうちに、小妖の一匹が銀五両を持ってきて、悟空へ渡した。悟空はそれを沙悟浄に渡し、悟空「お客さん、銀をお収めください。一緒に奥へ行って、飯を食ってきましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch89-022"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧仗著膽，同八戒、行者進於洞內。到二層廠廳之上，只見正中間桌上，高高的供養著一柄九齒釘鈀，真個是光彩映目；東山頭靠著一條金箍棒，西山頭靠著一條降妖杖。那怪王隨後跟著道：「客人，那中間放光亮的就是釘鈀，你看便看，只是出去，千萬莫與人說。」沙僧點頭稱謝了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      沙悟浄は勇気を奮い起こし、八戒と悟空について洞へ入った。二つ目の広間まで来ると、真ん中の卓上には九歯釘鈀（きゅうしていは）が高々と祭られ、その輝きはまさに目もくらむばかり。東側の壁には金箍棒（きんこぼう）、西側の壁には降妖杖（ごうようじょう）が立てかけてある。黄獅もあとからついてきて、黄獅「お客さん、真ん中で光っているのが釘鈀だ。見るなら見ればいい。ただし外へ出たら、決して誰にも話すなよ。」
      沙悟浄はうなずいて礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch89-023"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "噫！這正是：物見主，必定取。那八戒一生是個魯夯的人，他見了釘鈀，那裡與他敘甚麼情節，跑上去，拿下來，掄在手中，現了本相，丟了解數，望妖精劈臉就築。這行者、沙僧也奔至兩山頭各拿器械，現了原身，三兄弟一齊亂打。慌得那怪王急抽身閃過，轉入後邊，取一柄四明鏟，桿長鐏利，趕到天井中，支住他三般兵器，厲聲喝道：「你是甚人，敢弄虛頭，騙我寶貝？」行者罵道：「我把你這個賊毛團！你是認我不得。我們乃東土聖僧唐三藏的徒弟。因至玉華州倒換關文，蒙賢王教他三個王子拜我們為師，學習武藝，將我們寶貝作樣，打造如式兵器。因放在院中，被你這賊毛團夤夜入城偷來，倒說我弄虛頭騙你寶貝。不要走，就把我們這三件兵器各奉承你幾下嘗嘗。」那妖精就舉鏟來敵。這一場，從天井中鬥出前門，看他三僧攢一怪，好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      ああ、まさしく「物が持ち主に会えば、必ず取り戻される」というものだ。八戒は生来、無骨で荒っぽい男である。釘鈀を見たら、あれこれ事情を述べ合っているどころではない。駆け寄って取り下ろし、手に振るうなり本来の姿を現し、技を繰り出して黄獅の顔面めがけて突きかかった。悟空と沙悟浄も両側の壁へ走り、それぞれ武器を取り、本来の姿に戻って、三兄弟一斉に打ちかかった。黄獅は慌てて身をひねってかわし、奥へ回ると四明鏟（しめいさん）を取った。柄は長く、石突（いしづき）は鋭い。中庭へ駆け出し、三種類の武器を受け止めて、厳しい声で怒鳴った。黄獅「お前たちは何者だ。よくもたばかって、俺の宝をだまし取ったな！」
      悟空は罵り返し、悟空「この盗人の毛玉野郎！　俺たちが分からないのか。俺たちは東土（とうど）の聖僧、唐三蔵（とうさんぞう）の弟子だ。玉華州へ通行証の書き換えに来たところ、賢明な王が三人のご子息を俺たちの弟子にして、武芸を習わせることになった。それで、俺たちの宝を見本に、同じ形の武器を作っているんだ。庭へ置いておいたら、この盗人の毛玉野郎が、真夜中に城へ忍び込んで盗みやがった。それを、俺たちがお前をだまして宝を取っただと。逃げるなよ。この三つの武器を、何発かずつ、お前にたっぷり味わわせてやる！」
      黄獅は鏟（さん）を振り上げて迎え撃った。戦いは中庭から表門へと移り、三人の僧が一匹の妖怪に攻めかかる。すさまじい戦いであった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-024"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": "呼呼棒若風，滾滾鈀如雨。降妖杖舉滿天霞，四明鏟伸雲生綺。好似三仙煉大丹，火光彩晃驚神鬼。行者施威甚有能，妖精盜寶多無禮。天蓬八戒顯神通，大將沙僧英更美。弟兄合意運機謀，虎口洞中興鬥起。那怪豪強弄巧乖，四個英雄堪廝比。當時殺至日頭西，妖邪力軟難相抵。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      棒は風のようにひゅうひゅう鳴り、熊手は雨のように続けざまに降る。
      降妖杖を挙げれば空いっぱいに霞が満ち、四明鏟を突き出せば雲が綾を織る。
      まるで三人の仙人が大丹（だいたん）を練るように、火と光がきらめき、神も鬼も驚かす。
      悟空は威力を振るい、まことに腕が立つ。宝を盗んだ妖怪は、何とも無礼な奴。
      天蓬（てんぽう）の八戒は神通力を示し、大将たる沙悟浄の勇姿はさらに見事。
      兄弟が心を合わせて計略を働かせ、虎口洞の中に戦いが起こる。
      妖怪も強くたけだけしく、巧みに立ち回り、四人の豪傑がしのぎを削る。
      やがて戦いは日が西に傾くまで続き、妖怪は力が衰え、とうてい抗しきれない。
    "translation_status": "reviewed"
  - "id": "xy-ch89-025"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他們在豹頭山戰鬥多時，那妖精抵敵不住，向沙僧前喊一聲：「看鏟。」沙僧讓個身法躲過。妖精得空而走，向東南巽宮上，乘風飛去。八戒拽步要趕，行者道：「且讓他去。自古道：『窮寇勿追。』且只來斷他歸路。」八戒依言。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      豹頭山で長らく戦ううち、黄獅は持ちこたえられなくなり、沙悟浄の前で一声叫んだ。黄獅「この鏟を受けてみろ！」
      沙悟浄が身をかわす。その隙に黄獅は逃げ出し、東南の巽（たつみ）の方角へ、風に乗って飛んでいった。八戒が大股で追おうとすると、悟空「ひとまず行かせろ。昔から『窮寇（きゅうこう）は追うな』という。まずは帰る先を断ってやろう。」
      八戒はその言葉に従った。
    "translation_status": "reviewed"
  - "id": "xy-ch89-026"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人徑至洞口，把那百十個若大若小的妖精盡皆打死。原來都是些虎狼彪豹、馬鹿山羊。被大聖使個手法，將他那洞裡細軟物件並打死的雜項獸身與趕來的豬羊，通皆帶出。沙僧就取出乾柴放起火來、八戒使兩個耳朵搧風，把一個巢穴一時燒得乾淨。卻將帶出的諸物，即轉州城。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 163
        "line_end": 163
    "translation_ja": "三人はまっすぐ洞の入口へ行き、そこにいた大小百匹余りの妖怪を、一匹残らず打ち殺した。正体は皆、虎や狼、彪（ひょう）や豹、馬や鹿、山羊であった。悟空は術を使い、洞の中の金品や貴重な品、それに打ち殺したさまざまな獣の死骸と、追ってきた豚や羊を、残らず運び出した。沙悟浄が乾いた柴を取り出して火を放ち、八戒は両耳で風をあおいだ。巣窟はたちまち焼き尽くされた。そして三人は、運び出した品々を持ち、州城へ戻った。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-027"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時城門尚開，人家未睡。老王父子與唐僧俱在暴紗亭盼望，只見他們撲哩撲剌的丟下一院子死獸、豬羊及細軟物件。一齊叫道：「師父，我們已得勝回來也。」那殿下喏喏相謝。唐長老滿心歡喜。三個小王子跪拜於地，沙僧攙起道：「且莫謝，都近前看看那物件。」王子道：「此物俱是何來？」行者笑道：「那虎狼彪豹、馬鹿山羊，都是成精的妖怪。被我們取了兵器，打出門來。那老妖是個金毛獅子，他使一柄四明鏟，與我等戰到天晚，敗陣逃生，往東南上走了。我等不曾趕他，卻掃除他歸路，打殺這些群妖，搜尋他這些物件，帶將來的。」老王聽說，又喜又憂：喜的是得勝而回，憂的是那妖日後報仇。行者道：「殿下放心，我已慮之熟，處之當矣。一定與你掃除盡絕，方才起行，決不至貽害於後。我午間去時，撞見一個青臉紅毛的小妖送請書，我看他帖子上寫著：『明辰敬治餚酌，慶釘鈀嘉會，屈尊過山一敘。幸勿外，至感。右啟祖翁九靈元聖老大人尊前。』名字是『門下孫黃獅頓首百拜』。才子那妖精敗陣，必然向他祖翁處去會話，明辰斷然尋我們報仇，當情與你掃蕩乾淨。」老王稱謝了，擺上晚齋。師徒們齋畢，各歸寢處不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      城門はまだ開いており、人々も寝てはいなかった。玉華王と三人の息子、それに三蔵は、暴紗亭で帰りを待ちわびていた。そこへ三人が、獣の死骸や豚や羊、金品や貴重な品を、どさどさと庭いっぱいに投げ下ろした。三人は一斉に、悟空・八戒・沙悟浄「お師匠さま、勝って戻りました！」
      玉華王は何度も礼を言い、三蔵は心から喜んだ。三人の王子が地にひざまずいて拝むと、沙悟浄が助け起こし、沙悟浄「お礼はあとで結構です。皆さん、近くへ来て、これをご覧ください。」
      王家の一人「これらは、どこから来た物なのですか。」
      悟空は笑い、悟空「あの虎や狼、彪や豹、馬や鹿、山羊は、皆、化け物になった獣だ。俺たちが武器を取り返し、門の外まで打って出たんだ。あの大妖怪の黄獅は金毛の獅子で、四明鏟を使う。日暮れまで俺たちと戦ったが、敗れて命からがら東南へ逃げていった。俺たちは追わず、その代わり帰る場所をなくしてやった。この妖怪どもを打ち殺し、持ち物を探し出して、運んできたのさ。」
      玉華王は聞いて、喜びもし、憂えもした。勝って戻ったのはうれしいが、妖怪があとで報復に来るのが心配だった。
      悟空「殿下、心配はいらない。よく考えたうえで、きちんと始末してある。必ずすっかり退治してから出発する。後々の災いを残すようなことは、絶対にしない。昼ごろ出かけたとき、青い顔に赤毛の小妖が招待状を届けるところに出くわしたんだ。読んでみると、『明朝、謹んで酒肴を整え、釘鈀のめでたい宴を祝いたく存じます。お手数ながら山を越えてお越しくださり、ひとときお話しください。どうか他人行儀なお断りなどなさらず、お越しいただければこの上ない幸いです。右、祖翁・九霊元聖老大人の御前へ申し上げます』とあり、署名は『門下の孫、黄獅、頭を垂れ百拝』だった。さっきあいつは敗れたから、きっとその祖父のところへ話をしに行ったに違いない。明日の朝には必ず、俺たちに仕返しをしに来る。そのとき、残らず退治してあげよう。」
      玉華王は礼を述べ、夕食を並べさせた。師弟たちは精進の食事を済ませ、それぞれ寝所へ戻った。この話はいったん置く。
    "translation_status": "reviewed"
  - "id": "xy-ch89-028"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖精果然向東南方奔到竹節山。那山中有一座洞天之處，喚名九曲盤桓洞。洞中的九靈元聖是他的祖翁。當夜足不停風，行至五更時分，到於洞口，敲門而進。小妖見了道：「大王，昨晚有青臉兒下請書，老爺留他住到今早，欲同他來赴你釘鈀會，你怎麼又絕早親來邀請？」妖精道：「不好說，不好說，會成不得了。」正說處，見青臉兒從裡邊走出道：「大王，你來怎的？老大王爺爺起來就同我去赴會哩。」妖精慌張張的，只是搖手不言。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      さて黄獅は、やはり東南へ向かい、竹節山へ逃げていった。山中には九曲盤桓洞（きゅうきょくばんかんどう）という仙境の洞があり、そこに住む九霊元聖が黄獅の祖父であった。その夜は風に乗ったまま休まず進み、五更（ごこう）のころ洞の入口へ着き、門をたたいて中へ入った。洞の小妖が見つけて、洞の小妖「大王、昨夜は青臉児（せいれんじ）が招待状を届けに来ました。老大王さまは今朝まで泊めて、一緒にあなたの釘鈀会へ行くおつもりです。どうしてまた、こんな朝早くご自身でお招きに来られたのですか。」
      黄獅「言いにくい、言いにくいことだ。宴はもう、開けなくなった。」
      話していると、昨日の使いの小妖、青臉児が中から出てきた。青臉児「大王、どうしておいでになったのですか。老大王のおじいさまは、お起きになったら私と一緒に宴へお出かけになりますよ。」
      黄獅はうろたえ、ただ手を振るばかりで何も言わなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch89-029"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃，老妖起來了，喚入。這妖精丟了兵器，倒身下拜，止不住腮邊淚落。老妖道：「賢孫，你昨日下柬，今早正欲來赴會，你又親來，為何發悲煩惱？」妖精叩頭道：「小孫前夜對月閑行，只見玉華州城中有光彩沖空。急去看時，乃是王府院中三般兵器放光：一件是九齒滲金釘鈀，一件是寶杖，一件是金箍棒。小孫即使神法攝來，立名『釘鈀嘉會』，著小的們買豬羊果品等物，設宴慶會，請祖爺爺賞之，以為一樂。昨差青臉來送柬之後，只見原差買豬羊的刁鑽兒等趕著幾個豬羊，又帶了一個販賣的客人來找銀子。他定要看看會去，是小孫恐他外面傳說，不容他看。他又說肚中饑餓，討些飯吃，因教他後邊吃飯。他走到裡邊，看見兵器，說是他的。三人就各搶去一件，現出原身：一個是毛臉雷公嘴的和尚，一個是長嘴大耳朵的和尚，一個是晦氣色臉的和尚。他都不分好歹，喊一聲亂打。是小孫急取四明鏟趕出與他相持，問是甚麼人敢弄虛頭。他道是東土大唐差往西天去的唐僧之徒弟，因過州城，倒換關文，被王子留住，習學武藝，將他這三件兵器作樣子打造，放在院內，被我偷來，遂此不忿相持。不知那三個和尚叫做甚名，卻俱有本事。小孫一人敵他三個不過，所以敗走祖爺處。望拔刀相助，拿那和尚報仇，庶見我祖愛孫之意也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      しばらくすると九霊元聖が起き、黄獅を呼び入れた。黄獅は武器を投げ出して身を伏せ、拝礼したが、頬を流れる涙が止まらない。
      九霊元聖「よい孫よ、昨日は招待状をくれたので、今朝これから宴へ出かけようと思っていた。お前が自分で来たうえに、そのように悲しみ悩むのはなぜだ。」
      黄獅は頭を地につけ、黄獅「おとといの晩、私は月を眺めながら歩いておりました。すると玉華州の城から、光が空へ立ち上がっているのが見えたのです。急いで見に行くと、王府の庭で三種類の武器が光っていました。一つは九歯滲金釘鈀（きゅうししんきんていは）、一つは宝の杖、一つは金箍棒です。そこで私は神術を使って取り寄せ、『釘鈀の祝宴』と名づけて、下の者に豚や羊、果物などを買わせました。酒宴を開き、おじいさまにも宝をご覧いただき、楽しみにしようと思ったのです。昨日、青臉児に招待状を届けさせたあと、買物に出しておいた刁鑽児たちが豚と羊を何頭か追って戻り、残りの銀を受け取りに来たという商人も連れてきました。その客が、どうしても宴を見たいと言い張るのです。私は外で言いふらされるのを恐れ、見るのを許しませんでした。すると今度は腹がすいたと言って、飯を欲しがるので、奥で食べさせることにしたのです。ところが中へ入って武器を見るなり、自分の物だと言うではありませんか。三人は一つずつ武器を奪い、本来の姿を現しました。一人は毛むくじゃらの顔で雷公（らいこう）のような口の坊主、一人は長い鼻面に大きな耳の坊主、もう一人はくすんだ顔色の坊主です。有無を言わせず、叫びながらやみくもに打ちかかってきました。私は急いで四明鏟を取って駆け出し、立ち向かいながら、何者が人をたばかるのかと問い詰めました。相手は、東土の大唐（だいとう）から西天（さいてん）へ遣わされた唐僧（とうそう）の弟子だと言うのです。州城を通って通行証を書き換える際、王に引き留められ、武芸を教えるために、あの三つの武器を見本として同じ物を作らせていた。それを庭へ置いておいたところ、私に盗まれたので、怒って取り合いになったのだと。あの三人の坊主が何という名かは分かりませんが、いずれも腕が立ちます。私一人では三人に勝てず、敗れておじいさまのところへ逃げてきました。どうか刀を抜いてお助けくださり、あの坊主どもを捕らえて仇を討ってください。そうしてこそ、おじいさまの孫を思うお心も示されるというものです。」
    "translation_status": "reviewed"
  - "id": "xy-ch89-030"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老妖聞言，默想片時，笑道：「原來是他。我賢孫，你錯惹了他也。」妖精道：「祖爺知他是誰？」老妖道：「那長嘴大耳者，乃豬八戒；晦氣色臉者，乃沙和尚：這兩個猶可。那毛臉雷公嘴者，叫做孫行者。這個人其實神通廣大：五百年前曾大鬧天宮，十萬天兵也不曾拿得住。他專意尋人的，他便就是個搜山揭海、破洞攻城、闖禍的個都頭，你怎麼惹他？也罷，等我和你去，把那廝連玉華王子，都擒來替你出氣。」那妖精聽說，即叩頭而謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      九霊元聖は話を聞き、しばらく黙って考えたのち、笑った。九霊元聖「なんだ、あいつだったか。孫よ、お前はとんでもない相手に手を出したものだ。」
      黄獅「おじいさまは、あいつらが誰かご存じなのですか。」
      九霊元聖「鼻面が長く耳の大きいのは、猪八戒（ちょはっかい）。くすんだ顔色なのは、沙和尚（さおしょう）。この二人なら、まだよい。毛むくじゃらで雷公のような口の男は、孫行者（そんぎょうじゃ）という。こいつは、まことに途方もない神通力の持ち主だ。五百年前には天宮（てんきゅう）で大暴れし、十万の天兵でも捕らえられなかった。わざわざ人のところへ厄介を持ち込む奴で、山をあさり、海をひっくり返し、洞を破り、城を攻める、騒動の頭目のような男なのだ。どうしてそんな奴に手を出した。まあよい、私も一緒に行こう。あいつらを玉華王もろとも捕らえ、お前の憂さを晴らしてやる。」
      黄獅は聞くと、頭を地につけて礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch89-031"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當時老妖點猱獅、雪獅、狻猊、白澤、伏狸、摶象諸孫，各執鋒利器械，黃獅引領，各縱狂風，徑至豹頭山界。只聞得煙火之氣撲鼻，又聞得有哭泣之聲。仔細看時，原來是刁鑽、古怪二人在那裡叫主公哭主公哩。妖精近前喝道：「你是真刁鑽兒，假刁鑽兒？」二怪跪倒，噙淚叩頭道：「我們怎是假的？昨日這早晚領了銀子去買豬羊，走至山西邊大路之上，見一個毛臉雷公嘴的和尚，他啐了我們一口，我們就腳軟口強，不能言語，不能移步。被他扳倒，把銀子搜了去，牌兒解了去。我兩個昏昏沉沉，直到此時才醒。及到家，見煙火未息，房舍盡皆燒了。又不見主公並大小頭目。故在此傷心痛哭。不知這火是怎生起的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      九霊元聖はその場で、猱獅（どうし）、雪獅（せつし）、狻猊（しゅんげい）、白沢（はくたく）、伏狸（ふくり）、摶象（たんしょう）という孫たちを呼び集めた。それぞれ鋭い武器を手にし、黄獅の案内で荒れ狂う風を起こし、まっすぐ豹頭山へ向かった。山の境へ来ると、煙と火の臭いが鼻を突き、泣く声まで聞こえる。よく見ると、刁鑽古怪と古怪刁鑽の二人が、そこで主人を呼びながら泣いていた。黄獅が進み寄り、一喝した。黄獅「お前は本物の刁鑽児か、それとも偽物か。」
      二人はひざまずき、涙を浮かべて頭を地につけた。刁鑽古怪と古怪刁鑽「どうして私たちが偽物でありましょう。昨日の今ごろ、銀を頂いて豚と羊を買いに行き、山の西の大通りまで来ると、毛むくじゃらの顔に雷公のような口の坊主がいました。そいつがひと口、唾を吐きかけると、私たちは足がなえ、口がこわばり、しゃべることも、歩くこともできなくなったのです。倒されて、銀を探り取られ、札も外されました。そのまま意識がぼんやりして、たった今やっと正気に戻ったのです。家へ帰ってみると、まだ煙も火も消えず、建物はすべて焼けていました。ご主人も、大小の頭領たちも見当たりません。それでここで、悲しみのあまり泣いていたのでございます。この火がどうして起こったか、私たちには分かりません。」
    "translation_status": "reviewed"
  - "id": "xy-ch89-032"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精聞言，止不住淚如泉湧，雙腳齊跌，喊聲振天，恨道：「禿廝！十分作惡，怎麼幹出這般毒事？把我洞府燒盡，美人燒死，家當老小一空。氣殺我也，氣殺我也！」老妖叫猱獅扯他過來道：「賢孫，事已至此，徒惱無益。且養全銳氣，到州城裡拿那和尚去。」那妖精猶不肯住哭，道：「老爺，我那們個山場，非一日治的，今被這禿廝盡毀，我卻要此命做甚的？」掙起來，往石崖上撞頭磕腦。被雪獅、猱獅等苦勸方止。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      黄獅は聞くと涙が泉のようにあふれ、両足で地を踏み鳴らし、天を震わすほど叫んで恨みをぶつけた。黄獅「あの禿頭ども！　どこまで悪逆なんだ。どうしてこんな残酷なことができる。俺の洞をすべて焼き、美人を焼き殺し、家財も老いも若きも何もかも失わせた。腹が立って死にそうだ、死にそうだ！」
      九霊元聖は猱獅に、黄獅をこちらへ引っぱって来させ、九霊元聖「孫よ、こうなっては、ただ嘆いても役には立たぬ。まず気力を十分に蓄え、州城へあの坊主を捕らえに行こう。」
      それでも黄獅は泣きやまず、黄獅「おじいさま、あれだけの山の住まいは、一日で築いたのではありません。それを今、あの禿頭どもに何もかも壊された。こんな命に、何の用があるというのです！」
      黄獅は振りほどいて立ち上がり、岩崖へ頭をぶつけ、打ちつけた。雪獅や猱獅たちが懸命にいさめて、ようやくやめた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-033"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當時丟了此處，都奔州城。只聽得那風滾滾，霧騰騰，來得甚近。諕得那城外各關廂人等，拖男挾女，顧不得家私，都往州城中走，走入城門，將門閉了。有人報入王府中道：「禍事，禍事。」那王子唐僧等正在暴紗亭吃早齋，聽得人報禍事，卻出門來問。眾人道：「一群妖精，飛沙走石、噴霧掀風的來近城了。」老王大驚道：「怎麼好？」行者笑道：「都放心，都放心。這是虎口洞妖精昨日敗陣，往東南方去夥了那甚麼九靈元聖兒來也。等我同兄弟們出去。吩咐教關了四門，汝等點人夫看守城池。」那王子果傳令把四門閉了，點起人夫上城，他父子並唐僧在城樓上點劄，旌旗蔽日，炮火連天。行者三人，卻半雲半霧，出城迎敵。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      そこで一同はその場を離れ、州城へ向かった。風はごうごうと巻き、霧はもうもうと湧き立ち、見る間に迫ってくる。城外の各地区の人々は恐れおののき、男の子の手を引き、女の子を抱え、家財も顧みず州城へ逃げ込んだ。門をくぐると、その門を閉ざす。王府へ駆け込んだ者が、急報に来た者「大変です、大変です！」
      玉華王たちと三蔵は、ちょうど暴紗亭で朝の精進食を取っていた。災難の知らせを聞いて、門の外へ出て尋ねると、人々「妖怪の群れが、砂を飛ばし石を走らせ、霧を噴き風を巻き起こして、城へ近づいています！」
      玉華王は仰天し、玉華王「どうしたらよいのだ。」
      悟空は笑い、悟空「皆、心配するな、心配するな。昨日負けた虎口洞の黄獅が、東南へ行って、あの九霊元聖とかいう奴を仲間に連れてきたんだ。俺が弟たちと出ていこう。四つの門を閉じるよう命じてくれ。お前たちは人を集め、城を守るんだ。」
      玉華王はそのとおり四つの門を閉じるよう命じ、人夫を集めて城壁へ上げた。王と息子たち、三蔵は城楼で人員を配置した。旗は日を覆い、砲火は天を震わせる。悟空たち三人は雲と霧をまとい、城を出て敵を迎えた。まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch89-034"
    "section_id": "chapter-89"
    "kind": "verse"
    "origin": "source"
    "source_text": "失卻慧兵緣不謹，頓教魔起眾邪凶。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      不注意ゆえに智慧の武器を失い、
      たちまち魔を起こし、多くの邪悪を荒れ狂わせた。
    "translation_status": "reviewed"
  - "id": "xy-ch89-035"
    "section_id": "chapter-89"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知這場勝敗如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch89-1500528"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第089回&oldid=1500528"
        "line_start": 175
        "line_end": 175
    "translation_ja": "さて、この戦いの勝敗やいかに。それは次回のお話。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-01-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の金・木・土は、五行の象徴によって悟空・八戒・沙悟浄を表す。黄獅精という名も原典の回題にあるため、題ではそのまま保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-02-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空の言葉は底本では「無語、暗恨道」と内心の思いとして導入されるが、その後の八戒は「哥哥說那裡話」と返す。この語り方のずれを、悟空が声に出したことに無断で直してはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-03-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は城と豹頭山の距離を三十里とする。前の回では七十里と記されていた。距離を統一せず、それぞれの記述を保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-04-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "定身法を使う際に唱える呪文の文字をそのまま残した。仮名は各字の音写的な読みを組み合わせたもので、特定のサンスクリット原句への復元や、実在の儀礼との同定は行っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-05-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「\U000247F7猍口」「查耳朵」「砍額頭」「青臉泡浮」。\U000247F7はUnicode U+247F7であり、原文欄ではそのまま保持した。字形と顔つきの文脈から口のゆがみを表すと解し、耳は張り出し、額は削いだようで、青い顔はむくむと訳した。\U000247F7猍の厳密な語義と「砍」の具体的形状は確定できていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-06-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「祖翁」と「門下孫」は、祖父への敬称と門下の孫というへりくだった自称。招待者と招かれる側の上下・親族の呼び方は保つが、この文面だけで具体的な血統や師弟系譜までは補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-07-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "雌豚が金毛の獅子を追うという句は、八戒が自分の強さを言い立てるために引く俗諺。原文の「癩母豬」は皮膚のただれた雌豚として残した。現実の動物の習性を説明・保証する記述ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-08-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "王が実際に用意した数は豚七、八頭・羊四、五頭だが、ここで悟空が相手に告げる数は豚八頭・羊七頭、計十五頭である。計略の中の発言を、先の数量へ合わせて修正しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-09-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "変装の割当は八戒が刁鑽古怪、悟空が古怪刁鑽。しかし黄獅は悟空へ「刁鑽兒」、八戒へ「古怪」と呼びかける。二名は同じ二語の逆順で、短称の取り方は一様でない。呼びかけは底本を保ち、通常の話者ラベルは悟空・八戒のままにする。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-10-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「東山頭」「西山頭」は、広間の中で武器が立てかけられる東西の壁と解した。教育部『重編國語辭典修訂本』の「山頭」には壁の語義があり、『西遊記』の用例を挙げる。屋外の山頂へ武器が移ったとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-11-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「桿長鐏利」の鐏は、長柄の下端に付く金属部分。教育部『重編國語辭典修訂本』の鐏の説明に基づき、石突と訳した。上端の刃が鋭いという別の記述へ置き換えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-12-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで物の由来を尋ねる「王子」は、三人の息子の直後に現れる一方、この回では父王にも同じ語が使われる。父王か息子の一人か、またどの息子かを確定せず、「王家の一人」とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-13-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "猱獅・雪獅・狻猊・白澤・伏狸・摶象は、九霊元聖の孫たちとして列挙される個体の名。猱獅や狻猊のように獣の一般名としても使う語を、既出の別個体や一般分類と同一視しない。白澤だけは日本語の字体で白沢とし、摶象を別字の「搏象」へは変えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch89-note-14-body"
    "section_id": "chapter-89"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「慧兵」は、妖魔と戦う武器を智慧の働きにも重ねる結びの語。武器の盗難という出来事と、修行上の不注意という寓意をともに残す。"
    "translation_status": "reviewed"

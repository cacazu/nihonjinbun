    "source_text": "那獃子不知好歹，就跟著他，徑回舊路，卻不向南洋海，隨赴火雲門，頃刻間到了門首。妖精進去道：「你休疑忌。他是我的故人，你進來。」獃子只得舉步入門。眾妖一齊吶喊，將八戒捉倒，裝於袋內，束緊了口繩，高吊在馱梁之上。妖精現了本像，坐在當中道：「豬八戒，你有甚麼手段，就敢保唐僧取經？就敢請菩薩降我？你大睜著兩個眼，還不認得我是聖嬰大王哩。如今拿你，吊得三五日，蒸熟了賞賜小妖，權為案酒。」八戒聽言，在裡面罵道：「潑怪物！十分無禮。若論你百計千方，騙了我吃，管教你一個個遭腫頭天瘟。」獃子罵了又罵，嚷了又嚷，不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 205
        "line_end": 205
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L204-L204"
    "translation_ja": |-
      八戒は何も見抜けないまま紅孩児についていき、元来た道を戻った。南の海へは向かわず、火雲洞の門へ向かい、たちまち到着した。紅孩児は中へ入り、声をかけた。
      紅孩児「疑うことはありません。ここの主人は私の古い知り合いです。入りなさい」
      八戒は仕方なく、足を踏み入れた。すると小妖怪たちが一斉に鬨の声を上げ、八戒を捕らえて押し倒し、袋へ詰め、口紐を固く締めて、梁の高いところへ吊るした。紅孩児は本来の姿に戻り、中央に座って言った。
      紅孩児「猪八戒、お前にどれほどの腕があるというんだ。唐僧を守って取経に行くだと？　菩薩を呼んで、俺を降伏させるだと？　二つの目を大きく開いていながら、俺が聖嬰大王だと見抜けもしなかったじゃないか。こうして捕まえたからには、三日か五日吊るしておいてから、蒸し上げて小妖怪どもへ褒美にやり、酒の肴にしてやる」
      八戒は聞くと、袋の中から罵った。
      八戒「悪党め、無礼にもほどがあるぞ！　お前たちがあの手この手で俺をだまして食おうというなら、一人残らず、頭の腫れる天罰の疫病にかかるがいい！」
      八戒は罵り続け、わめき続けたが、この話はひとまず置こう。
    "translation_status": "reviewed"

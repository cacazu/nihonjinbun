        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 203
        "line_end": 203
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L202-L202"
    "translation_ja": "紅孩児は長年ここに暮らし、あたりはどこも歩き慣れた土地だった。南海へ行くには、どの道が近く、どの道が遠回りなのかも心得ている。近道を取って雲を飛ばし、八戒を追い越すと、岩壁の上へ端然と座り、観世音（かんぜおん）の偽の姿に化けて、八戒を待ち構えた。"

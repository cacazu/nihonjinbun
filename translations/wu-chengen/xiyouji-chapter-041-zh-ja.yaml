        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 190
        "line_end": 190
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L189-L189"
    "translation_ja": |-
      悟空はようやく立ち上がり、顔を上げた。
      悟空「敖家のご兄弟、どこにおられる？」
      四海の竜王が、空中から答えた。
      四海の竜王「私どもは、ここでお待ちしております」
      悟空「遠くまでお手数をかけたのに、功を成せなかった。ひとまずお帰りください。改めてお礼を申し上げます」
      竜王たちは水族の軍勢を率い、堂々と引き揚げていった。この話は、ひとまずここまでとしよう。

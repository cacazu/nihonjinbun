  - "id": "xy-ch41-spoken-poem-036"
    "kind": "poem"
    "members":
      - "segment_id": "xy-ch41-036"
        "source_span":
          "start": 45
          "end": 113
          "exact": |-
            憶昔當年出大唐，巖前救我脫災殃。
            三山六水遭魔障，萬苦千辛割寸腸。
            托缽朝餐隨厚薄，參禪暮宿或林莊。
            一心指望成功果，今日安知痛受傷？」
        "translation_span":
          "start": 89
          "end": 277
          "exact": |-
            あの昔、大唐（だいとう）を出発なされ、
            岩山の前で私を救い、災いから解き放ってくださった。
            三つの山、六つの川で、魔に行く手を阻まれ、
            万の苦しみ、千の辛さに、はらわたも裂ける思い。
            朝は鉢を差し出し、施しの多い少ないに任せて食べ、
            夕べは禅を修め、林や村に泊まった。
            ひたすら修行を成し遂げる日を待ち望んできたのに、
            今日、こんなにひどく傷つくとは、誰が知っていたでしょう」
    "separator": |2+

    "description_ja": "散文の発話導入から続く詩。話者を保ち、詩末で引用を閉じる。"
  - "id": "xy-ch41-spoken-poem-045"
    "kind": "poem"
    "members":
      - "segment_id": "xy-ch41-045"
        "source_span":
          "start": 162
          "end": 196
          "exact": |-
            大展齊天無量法，滿山潑怪等時擒。
            解開皮袋放我出，築你千鈀方趁心。」
        "translation_span":
          "start": 243
          "end": 333
          "exact": |-
            天にも等しい、限りない術を大いに振るい、
            山じゅうの悪い妖怪を、たちどころに捕らえるぞ。
            革袋をほどき、俺を外へ出してくれたら、
            お前らを熊手で千回突いて、やっと気が晴れるんだ！」
    "separator": |2+

    "description_ja": "散文の発話導入から続く詩。話者を保ち、詩末で引用を閉じる。"

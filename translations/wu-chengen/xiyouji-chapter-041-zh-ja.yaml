    "source_text": "行者卻才起身，仰面道：「敖氏弟兄何在？」那四海龍王在半空中答應道：「小龍在此伺候。」行者道：「累你遠勞，不曾成得功果，且請回去，改日再謝。」龍王帥水族，泱泱而回，不在話下。"
    "source_languages":

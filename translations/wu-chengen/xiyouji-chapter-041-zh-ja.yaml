  - "id": "xy-ch41-036"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      沙僧攙著行者，一同到松林之下坐定。少時間，卻定神順氣，止不住淚滴腮邊。又叫：「師父啊！

      憶昔當年出大唐，巖前救我脫災殃。
      三山六水遭魔障，萬苦千辛割寸腸。
      托缽朝餐隨厚薄，參禪暮宿或林莊。
      一心指望成功果，今日安知痛受傷？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 192
        "line_end": 197
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L191-L196"
    "translation_ja": |-
      沙悟浄は悟空に手を貸し、一緒に松林の下へ戻って座った。しばらくして、ようやく心が落ち着き、息も整ったが、悟空は頬を伝う涙を止められなかった。また声を上げた。
      悟空「お師匠さま！
      あの昔、大唐（だいとう）を出発なされ、
      岩山の前で私を救い、災いから解き放ってくださった。
      三つの山、六つの川で、魔に行く手を阻まれ、
      万の苦しみ、千の辛さに、はらわたも裂ける思い。
      朝は鉢を差し出し、施しの多い少ないに任せて食べ、
      夕べは禅を修め、林や村に泊まった。
      ひたすら修行を成し遂げる日を待ち望んできたのに、
      今日、こんなにひどく傷つくとは、誰が知っていたでしょう」
    "translation_status": "reviewed"
  - "id": "xy-ch41-037"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧道：「哥哥，且休煩惱。我們早安計策，去那裡請兵助力，搭救師父耶。」行者道：「那裡請救麼？」沙僧道：「當初菩薩吩咐，著我等保護唐僧，他曾許我們：叫天天應，叫地地應。那裡請救去？」行者道：「想老孫大鬧天宮時，那些神兵都禁不得我。這妖精神通不小，須是比老孫手段大些的才降得他哩。天神不濟，地煞不能，若要拿此妖魔，須是去請觀音菩薩才好。奈何我皮肉酸麻，腰膝疼痛，駕不起觔斗雲，怎生請得？」八戒道：「有甚話吩咐，等我去請。」行者笑道：「也罷，你是去得。若見了菩薩，切休仰視，只可低頭禮拜。等他問時，你卻將地名、妖名說與他，再請救師父之事。他若肯來，定取擒了怪物。」八戒聞言，即便駕了雲霧，向南而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 198
        "line_end": 198
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L197-L197"
    "translation_ja": |-
      沙悟浄「兄さん、ひとまず悲しむのはおやめください。早く策を立てて、どこかへ援軍を頼み、お師匠さまを助けましょう」
      悟空「どこへ助けを頼めばいい？」
      沙悟浄「初めに菩薩は、私たちに唐僧を守るよう命じたとき、『天を呼べば天が応え、地を呼べば地が応える』と約束してくださいました。どこへ助けを求めましょう？」
      悟空「俺が天宮で暴れたころ、天の神兵は誰も俺を抑えられなかった。この妖怪の神通力は並ではない。俺より腕の上の者でなければ、降伏させられないだろう。天の神々では役に立たず、地の神々にもできない。この妖怪を捕まえるには、観音菩薩（かんのんぼさつ）をお呼びするしかない。だが、皮膚も肉もしびれてうずき、腰や膝が痛む。觔斗雲（きんとうん）に乗れないんだ。どうやってお呼びしたらいい？」
      八戒「伝えることがあるなら、言ってくれ。俺が行ってくる」
      悟空は笑った。
      悟空「それもいい。お前なら行けるな。菩薩にお会いしたら、決して顔を見上げるな。ただ頭を下げて拝め。お尋ねになったら、場所の名、妖怪の名をお伝えし、それから師匠を助けていただくようお願いするんだ。来てくだされば、きっと妖怪を捕まえてくださる」
      八戒はそれを聞くと、すぐ雲霧に乗り、南へ向かった。
    "translation_status": "reviewed"

    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L152-L152"
    "translation_ja": "煙と炎が舞い上がり、悟空には紅孩児がどこにいるのか分からなくなった。洞の門の前の道も見えず、身を返して火の中から跳び出した。紅孩児は門のところで、これをはっきり見ていた。悟空が逃げたのを見届けてから、ようやく火の道具を収め、小妖怪たちを率いて洞へ引き返し、石の扉を閉じた。勝ったつもりで部下に宴を用意させ、音楽を奏でさせて笑い楽しんだが、その話はさておこう。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-018"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者跳過枯松澗，按下雲頭，只聽得八戒與沙僧朗朗的在松間講話。行者上前喝八戒道：「你這獃子，全無人氣。你就懼怕妖火，敗走逃生，卻把老孫丟下。早是我有些南北哩。」八戒笑道：「哥啊，你被那妖精說著了，果然不達時務。古人云：『識得時務者，呼為俊傑。』那妖精不與你親，你強要認親；既與你賭鬥，放出那般無情的火來，又不走，還要與他戀戰哩。」行者道：「那怪物的手段比我何如？」八戒道：「不濟。」「槍法比我何如？」八戒道：「也不濟。老豬見他撐持不住，卻來助你一鈀，不期他不識耍，就敗下陣來，沒天理，就放火了。」行者道：「正是你不該來。我再與他鬥幾合，我取巧兒撈他一棒，卻不是好？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 155
        "line_end": 155
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L154-L154"
    "translation_ja": |-
      悟空が枯松澗を跳び越え、雲を降りると、松林の中から八戒と沙悟浄の明るい話し声が聞こえた。悟空は近づいて八戒を怒鳴った。
      悟空「このばか、まるで人情のないやつだな！　妖怪の火が怖くなって、自分だけ命を助けようと逃げ、俺を置いていくとは。俺に少しは心得があったから、助かったものの！」
      八戒は笑った。
      八戒「兄貴、妖怪が言ったとおりだな。本当に物の分からないやつだ。昔から『時勢をわきまえる者を、俊傑と呼ぶ』っていうだろう。向こうは親戚だと思ってもいないのに、無理に親戚になろうとする。戦いになって、あんな情け容赦のない火を出されても、まだ逃げずに戦おうとするんだからな」
      悟空「あの妖怪の腕前は、俺と比べてどうだ？」
      八戒「かなわないな」
      悟空「槍の技は、俺と比べてどうだ？」
      八戒「それもかなわない。俺は、あいつがもう持ちこたえられないと見て、熊手の一撃で加勢してやったんだ。ところが、あいつは洒落の分からないやつで、負けて逃げたと思ったら、ひどいことに火を出しやがった」
      悟空「だから、お前が出てくることはなかったんだ。もう数合戦っていれば、うまく一発たたき込めた。それでよかったじゃないか」
    "translation_status": "reviewed"
  - "id": "xy-ch41-019"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個只管論那妖精的手段，講那妖精的火毒。沙和尚倚著松根，笑得騃了。行者看見道：「兄弟，你笑怎麼？你好道有甚手段，擒得那妖魔，破得那火陣？這樁事，也是大家有益的事。常言道：『眾毛攢毬。』你若拿得妖魔，救了師父，也是你的一件大功績。」沙僧道：「我也沒甚手段，也不能降妖。我笑你兩個都著了忙也。」行者道：「我怎麼著忙？」沙僧道：「那妖精手段不如你，槍法不如你，只是多了些火勢，故不能取勝。若依小弟說，以相生相剋拿他，有甚難處？」行者聞言，呵呵笑道：「兄弟說得有理，果然我們著忙了，忘了這事。若以相生相剋之理論之，須是以水剋火。卻往那裡尋些水來，潑滅這妖火，可不救了師父？」沙僧道：「正是這般，不必遲疑。」行者道：「你兩個只在此間，莫與他索戰，待老孫去東洋大海求借龍兵，將些水來，潑息妖火，捉這潑怪。」八戒道：「哥哥放心前去，我等理會得。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 156
        "line_end": 156
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L155-L155"
    "translation_ja": |-
      二人がひたすら紅孩児の腕前や、火の恐ろしさについて話していると、沙悟浄は松の根にもたれ、呆けたように笑っていた。悟空はそれに気づいた。
      悟空「兄弟、何を笑っている？　あの妖怪を捕まえ、火の陣を破れるような手でもあるのか。これは俺たちみんなのためになることだ。『毛を集めれば球になる』というじゃないか。お前が妖怪を捕まえて師匠を助ければ、それも大きな手柄だぞ」
      沙悟浄「私にも、特別な手はありません。妖怪を降伏させられるわけでもない。ただ、二人とも慌てているので笑ったんです」
      悟空「俺たちのどこが慌てている？」
      沙悟浄「あの妖怪は、腕前でも槍の技でも、兄さんに及びません。ただ、火の勢いが加わるから勝てないのです。私に言わせれば、相生相剋（そうせいそうこく）の理で捕まえれば、難しいことはないでしょう」
      悟空は聞くなり、からからと笑った。
      悟空「兄弟、そのとおりだ。なるほど、俺たちは焦って、そんなことも忘れていた。相生相剋で考えれば、水で火を抑えればいい。どこかで水を手に入れ、妖怪の火を消せば、師匠を救えるじゃないか」
      沙悟浄「そのとおりです。ためらうことはありません」
      悟空「お前たちはここにいて、あいつに戦いを挑むな。俺が東の大海へ行って、竜王の兵を借りてくる。水を持って来て、妖怪の火を消し、あの悪党を捕まえるんだ」
      八戒「兄貴、安心して行ってこい。俺たちは心得ているよ」
    "translation_status": "reviewed"
  - "id": "xy-ch41-020"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，縱雲離此地，頃刻到東洋，卻也無心看玩海景，使個逼水法，分開波浪。正行時，見一個巡海夜叉相撞，看見是孫大聖，急回到水晶宮裡，報知那老龍王。敖廣即率龍子、龍孫、蝦兵、蟹卒一齊出門迎接，請裡面坐。坐定，禮畢，告茶。行者道：「不勞茶，有一事相煩：我因師父唐僧往西天拜佛取經，經過號山枯松澗火雲洞，有個紅孩兒妖精，號聖嬰大王，把我師父拿了去。是老孫尋到洞邊，與他交戰，他卻放出火來。我們禁不得他，想著水能剋火，特來問你求些水去，與我下場大雨，潑滅了那火，救唐僧一難。」那龍王道：「大聖差了，若要求取雨水，不該來問我。」行者道：「你是四海龍王，主司雨澤，不來問你，卻去問誰？」龍王道：「我雖司雨，不敢擅專。須得玉帝旨意，吩咐在那地方，要幾尺幾寸，甚麼時辰起住，還要三官舉筆，太乙移文，會令了雷公、電母、風伯、雲童。俗語云：『龍無雲而不行』哩。」行者道：「我也不用著風雲雷電，只是要些雨水滅火。」龍王道：「大聖不用風雲雷電，但我一人也不能助力。著舍弟們同助大聖一功如何？」行者道：「令弟何在？」龍王道：「南海龍王敖欽、北海龍王敖閏、西海龍王敖順。」行者笑道：「我若再遊過三海，不如上界去求玉帝旨意了。」龍王道：「不消大聖去，只我這裡撞動鐵鼓、金鐘，他自頃刻而至。」行者聞其言道：「老龍王，快撞鐘鼓。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 157
        "line_end": 157
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L156-L156"
    "translation_ja": |-
      悟空は雲を飛ばしてその場を離れ、たちまち東の海に着いた。海の眺めを楽しむ気もなく、水を押しのける術で波を分けて進んだ。途中で巡海の夜叉に出会った。夜叉は悟空だと気づき、急いで水晶宮（すいしょうきゅう）へ戻って竜王に知らせた。敖広（ごうこう）はただちに竜の子や孫、蝦の兵や蟹の兵卒を率い、そろって門へ出迎え、悟空を中へ招いて座らせた。着席して挨拶がすむと、茶を用意させた。
      悟空「お茶には及ばない。頼みが一つある。私の師匠、唐僧が西天（さいてん）へ仏を拝み、経を取りに行く途中、号山の枯松澗、火雲洞を通りかかった。そこに紅孩児という妖怪がいて、聖嬰大王（せいえいだいおう）と名乗り、師匠を捕らえてしまった。私が洞を探し当てて戦うと、やつは火を放った。私たちにはしのぎきれない。水は火を抑えるものだと思い、あなたに水を借りに来たのだ。大雨を降らせて火を消し、唐僧の難儀を救っていただきたい」
      敖広「大聖さま、それはお門違いです。雨をお求めなら、私に頼むべきではございません」
      悟空「あなたは四海の竜王の一人で、雨をつかさどっている。あなたでなければ、誰に頼めばいい？」
      敖広「雨をつかさどってはおりますが、勝手には降らせられません。玉帝（ぎょくてい）のご命令をいただき、どの場所に、何尺何寸（すん）、何の刻から何の刻まで降らせるのかを定めていただかなければなりません。そのうえ三官（さんかん）が筆を執り、太乙（たいいつ）が文書を回し、雷公（らいこう）・電母（でんぼ）・風伯（ふうはく）・雲童（うんどう）へ、一斉に指令を伝えるのです。俗に『竜は雲なくしては行かぬ』と申しますから」
      悟空「風も雲も、雷も稲妻も要らない。火を消す雨水さえあればいいんだ」
      敖広「風雲雷電がご不要でも、私一人ではお力になれません。弟たちにも手伝わせ、大聖さまに力を貸しては、いかがでしょう？」
      悟空「弟さんたちは、どこにいる？」
      敖広「南海（なんかい）の竜王、敖欽（ごうきん）。北海（ほっかい）の竜王、敖閏（ごうじゅん）。西海（さいかい）の竜王、敖順（ごうじゅん）でございます」
      悟空は笑った。
      悟空「さらに三つの海を回るくらいなら、天へ行って玉帝の命令をいただくほうが早い」
      敖広「大聖さまが行かれるには及びません。ここで鉄の太鼓と金の鐘を鳴らせば、あっという間にやって来ます」
      悟空「竜王、それなら早く鐘と太鼓を鳴らしてくれ」
    "translation_status": "reviewed"

    "translation_ja": |-
      まもなく、三海の竜王がそろってやって来た。
      三海の竜王「兄上、私たちに何をお命じになりますか？」
      敖広「孫大聖（そんたいせい）が、妖怪退治を助ける雨を借りに来られたのだ」
      三人の弟は中へ通され、悟空と挨拶を交わした。悟空は水を借りたい事情を、詳しく説明した。神々はみな喜んで従い、さっそく兵を召集した。

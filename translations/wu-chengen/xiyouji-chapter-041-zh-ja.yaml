  - "id": "xy-ch41-041"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子正縱雲行處，忽然望見菩薩。他那裡識得真假？這才是見像作佛。獃子停雲下拜道：「菩薩，弟子豬悟能叩頭。」妖精道：「你不保唐僧去取經，卻見我有何事幹？」八戒道：「弟子因與師父行至中途，遇著號山枯松澗火雲洞有個紅孩兒妖精，他把我師父攝了去。是弟子與師兄等尋上他門，與他交戰。他原來會放火，頭一陣，不曾得贏。第二陣，請龍王助雨，也不能滅火。師兄被他燒壞了，不能行動，著弟子來請菩薩。萬望垂慈，救我師父一難。」妖精道：「那火雲洞洞主，不是個傷生的，一定是你們衝撞了他也。」八戒道：「我不曾衝撞他，是師兄悟空衝撞他的。他變作一個小孩兒，吊在樹上，試我師父。師父甚有善心，教我解下來，著師兄馱他一程。是師兄摜了他一摜，他就弄風兒，把師父攝去了。」妖精道：「你起來，跟我進那洞裡見洞主，與你說個人情，你陪一個禮，把你師父討出來罷。」八戒道：「菩薩呀，若肯還我師父，就磕他一個頭也罷。」妖王道：「你跟來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 204
        "line_end": 204
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L203-L203"
    "translation_ja": |-
      八戒は雲を飛ばしているうち、ふと菩薩の姿を見つけた。本物か偽物か、区別できるはずもない。これこそ、姿を見ただけで仏だと思い込むというものだ。雲を止め、身を伏せて拝んだ。
      八戒「菩薩さま、弟子の猪悟能（ちょごのう）が、謹んでお拝みいたします」
      紅孩児「唐僧を守って経を取りに行かず、私に会って何をするつもりです？」
      八戒「私たちが師匠と旅を続けていると、途中の号山、枯松澗の火雲洞に、紅孩児という妖怪がおりまして、師匠をさらってしまいました。私が兄弟子らと洞を捜し当て、戦いを挑んだところ、やつは火を放つ術を持っていて、最初の戦いでは勝てませんでした。二度目は竜王に雨の助けを頼みましたが、それでも火を消せません。兄弟子は火に傷つけられて動けなくなり、私を菩薩さまのお迎えに出しました。どうか慈悲をお垂れになり、師匠の難をお救いください」
      紅孩児「火雲洞の主人は、生き物を傷つける者ではありません。きっと、お前たちが怒らせたのでしょう」
      八戒「私は怒らせておりません。怒らせたのは兄弟子の悟空です。やつは小さな子供に化け、木に吊られて、師匠を試しました。師匠はたいそう心がお優しく、私に縄を解いて降ろさせ、兄弟子には背負って少し運ぶよう命じました。ところが兄弟子が地面へたたきつけたので、やつは風を起こし、師匠をさらっていったのです」
      紅孩児「立ちなさい。私について洞へ入り、主人に会うのです。私が取りなしてあげますから、お前が一言謝り、師匠を返してもらいなさい」
      八戒「菩薩さま、師匠を返してくれるのなら、頭を地につけて拝んだって構いません」
      紅孩児「ついておいで」
    "translation_status": "reviewed"
  - "id": "xy-ch41-042"
    "section_id": "chapter-41"
    "kind": "paragraph"

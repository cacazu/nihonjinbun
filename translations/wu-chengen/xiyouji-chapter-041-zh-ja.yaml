      紅孩児「お前たち、孫行者はひどい目に遭って逃げたぞ。今の戦いで死ななかったにしても、ひどく気を失ったに違いない。おや、待てよ。あいつはまた援軍を呼ぶかもしれない。早く門を開けろ。誰を呼ぶのか、見てこよう」

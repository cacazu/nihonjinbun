    "source_text": "卻說那妖王久居於此，俱是熟遊之地，他曉得那條路上南海去近，那條路去遠。他從那近路上，一駕雲頭，趕過了八戒，端坐在壁巖之上，變作一個假觀世音模樣，等候著八戒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"

        "line_start": 172
        "line_end": 173
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L171-L172"
    "translation_ja": |-
      四海の竜王は喜んで力を貸し、
      斉天大聖は、ともに来てくれと頼む。
      すべては三蔵が旅の途中で難に遭ったため、
      水を借りて来て、赤い炎を消すのだ。
    "translation_status": "reviewed"
  - "id": "xy-ch41-025"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那行者領著龍兵，不多時，早到號山枯松澗上。行者道：「敖氏昆玉，有煩遠踄。此間乃妖魔之處，汝等且停於空中，不要出頭露面。讓老孫與他賭鬥，若贏了他，不須列位捉拿；若輸與他，也不用列位助陣。只是他但放火時，可聽我呼喚，一齊噴雨。」龍王俱如號令。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 175
        "line_end": 175
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L174-L174"
    "translation_ja": |-
      悟空は竜王の兵を率い、ほどなく号山の枯松澗の上空に着いた。
      悟空「敖家（ごうけ）のご兄弟、遠路おいでいただいて、かたじけない。ここが妖魔の住むところだ。皆さんはひとまず空中にとどまり、姿を見せないでいただきたい。私がやつと戦って、勝ったとしても、皆さんに捕まえていただくには及ばない。負けたとしても、加勢は要らない。ただ、やつが火を放ったら、私の呼ぶ声を合図に、一斉に雨を噴いてほしい」
      竜王たちはみな、その指示に従った。
    "translation_status": "reviewed"
  - "id": "xy-ch41-026"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者卻按雲頭，入松林裡，見了八戒、沙僧，叫聲：「兄弟。」八戒道：「哥哥來得快啞。可曾請得龍王來？」行者道：「俱來了。你兩個切須仔細，只怕雨大，莫濕了行李。待老孫與他打去。」沙僧道：「師兄放心前去，我等俱理會得了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 176
        "line_end": 176
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L175-L175"
    "translation_ja": |-
      悟空は雲を降り、松林へ入って八戒と沙悟浄に会った。
      悟空「兄弟！」
      八戒「兄貴、ずいぶん早かったな。竜王を呼んでこられたか？」
      悟空「みんな来てくれた。お前たちは十分注意しろ。大雨になるかもしれないから、荷物を濡らすなよ。俺はあいつと戦ってくる」
      沙悟浄「兄さん、安心して行ってください。私たちはみな、心得ています」
    "translation_status": "reviewed"
  - "id": "xy-ch41-027"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者跳過澗，到了門首，叫聲：「開門！」那些小妖又去報道：「孫行者又來了。」紅孩仰面笑道：「那猴子想是火中不曾燒了他，故此又來。這一來切莫饒他，斷然燒個皮焦肉爛才罷。」急縱身，挺著長槍，教：「小的們，推出火車子來。」他出門前，對行者道：「你又來怎的？」行者道：「還我師父來。」那怪道：「你這猴頭，忒不通變。那唐僧與你做得師父，也與我做得按酒，你還思量要他哩，莫想，莫想。」行者聞言，十分惱怒，掣金箍棒，劈頭就打；那妖精使火尖槍，急架相迎。這一場賭鬥，比前不同。好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 178
        "line_end": 178
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L177-L177"
    "translation_ja": |-
      悟空は谷川を跳び越え、門の前まで行って叫んだ。
      悟空「門を開けろ！」
      小妖怪たちは、また報告に走った。
      小妖怪たち「孫行者がまた来ました！」
      紅孩児は顔を仰向けて笑った。
      紅孩児「あの猿め、さっきの火では焼かれずにすんだので、また来たのだろう。今度は決して許さん。皮は焦げ、肉はただれるまで焼いてやる」
      さっと立ち上がり、長槍を構えて命じた。
      紅孩児「お前たち、火の車を押し出せ！」
      門を出ると、悟空に言った。
      紅孩児「何しにまた来た？」
      悟空「師匠を返せ！」
      紅孩児「この猿、融通の利かないやつだな。あの唐僧は、お前の師匠にもなれるが、俺の酒の肴にもなれる。それでもまだ、取り戻すつもりか。諦めろ、諦めろ！」
      悟空はひどく腹を立て、金箍棒を抜くと、頭めがけて打ち下ろした。紅孩児は火尖槍で、すばやく受け止める。今度の戦いは、さっきとは違った。その激しさは、
    "translation_status": "reviewed"
  - "id": "xy-ch41-028"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": "怒發潑妖魔，惱急猴王將。這一個專救取經僧，那一個要吃唐三藏。心變沒親情，情疏無義讓。這個恨不得捉住活剝皮，那個恨不得拿來生蘸醬。真個忒英雄，果然多猛壯。棒來槍架賭輸贏，槍去棒迎爭下上。舉手相掄二十回，兩家本事一般樣。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 180
        "line_end": 180
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L179-L179"
    "translation_ja": |-
      悪い妖魔は怒りを爆発させ、猿の王も怒りの極みに達する。
      こちらはひたすら取経の僧を救おうとし、
      あちらは唐三蔵（とうさんぞう）を食おうとする。
      心が変わって、身内の情など消え失せ、
      情が遠のけば、義理も譲り合いもない。
      こちらは捕まえて、生きたまま皮をはぎたいと願い、
      あちらは捕らえて、生のまま味噌につけて食いたいと願う。
      まことに勇ましく、なるほど、どちらも強くたくましい。
      棒が来れば槍で受け、勝ち負けを賭け、
      槍が行けば棒で迎え、優劣を争う。
      手を上げて、互いに二十合打ち合ったが、
      二人の腕前は、互角だった。
    "translation_status": "reviewed"
  - "id": "xy-ch41-029"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖王與行者戰經二十回合，見得不能取勝，虛幌一槍，急抽身，捏著拳頭，又將鼻子搥了兩下，卻就噴出火來，那門前車子上煙火迸起，口眼中赤焰飛騰。孫大聖回頭叫道：「龍王何在？」那龍王兄弟帥眾水族，望妖精火光裡噴下雨來。好雨！真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 181
        "line_end": 181
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L180-L180"
    "translation_ja": |-
      紅孩児は悟空と二十合戦い、勝てないと見ると、槍を一つ、空振りするように見せかけ、急いで身を引いた。拳を握り、また鼻を二度殴ると、たちまち火を噴き出した。門の前の車から煙と火がほとばしり、口と目からも赤い炎が舞い上がる。悟空は振り返って叫んだ。
      悟空「竜王、どこにおられる！」
      竜王の兄弟は水族の軍勢を率い、妖怪の炎めがけて雨を噴き下ろした。なんという雨だろう。まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch41-030"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": "瀟瀟灑灑，密密沉沉。瀟瀟灑灑，如天邊墜落星辰；密密沉沉，似海口倒懸浪滾。起初時如拳大小，次後來甕潑盆傾。滿地澆流鴨頂綠，高山洗出佛頭青。溝壑水飛千丈玉，澗泉波漲萬條銀。三叉路口看看滿，九曲溪中漸漸平。這個是唐僧有難神龍助，扳倒天河往下傾。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 183
        "line_end": 183
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L182-L182"
    "translation_ja": |-
      ざあざあと降り注ぎ、びっしりと重く垂れ込める。
      ざあざあと降るさまは、空の果てから星が落ちるよう。
      びっしりと垂れ込めるさまは、海の出口を逆さに吊り、波が転げ落ちるよう。
      初めは拳ほどの大きな雨粒、
      やがては甕や桶をひっくり返したようになる。
      大地を洗う流れは、鴨の頭のような緑となり、
      高山は洗い出されて、仏の頭のような青となる。
      溝や谷には、千丈の玉のような水が飛び、
      谷川や泉には、万筋の銀のような波が増す。
      三つまたの道は、見る間に水で満ち、
      九重に曲がる川も、次第に岸と同じ高さになる。
      唐僧の難を、神竜たちが助けようと、
      天の川をひっくり返し、地上へ注いでいるのだ。
    "translation_status": "reviewed"
  - "id": "xy-ch41-031"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那雨淙淙大小，莫能止息那妖精的火勢。原來龍王私雨，只好潑得凡火，妖精的三昧真火如何潑得？好一似火上澆油，越潑越灼。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 185
        "line_end": 185
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L184-L184"
    "translation_ja": "雨は強弱を変えながら、とうとうと降り続いたが、紅孩児の火勢を鎮めることはできなかった。そもそも竜王が自分たちの判断で降らせる雨は、普通の火なら消せても、妖怪の三昧真火（さんまいしんか）をどうして消せよう。まるで火に油を注ぐように、水をかければかけるほど、激しく燃えた。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-032"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖道：「等我捻著訣，鑽入火中。」掄鐵棒，尋妖要打。那妖見他來到，將一口煙劈臉噴來。行者急回頭，煼得眼花雀亂，忍不住淚落如雨。原來這大聖不怕火，只怕煙。當年因大鬧天宮時，被老君放在八卦爐中鍛過一番，他幸在那巽位安身，不曾燒壞。只是風攪得煙來，把他煼做火眼金睛，故至今只是怕煙。那妖又噴一口，行者當不得，縱雲頭走了。那妖王卻又收了火具，回歸洞府。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 187
        "line_end": 187
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L186-L186"
    "translation_ja": |-
      悟空「よし、印を結んで、火の中へ入ってみよう」
      鉄棒を振りかざし、紅孩児を見つけて打とうとした。紅孩児は悟空が近づくと、真正面から顔へ、一口の煙を噴きつけた。悟空は急いで顔を背けたが、燻されて目がちらつき、涙が雨のように流れるのをこらえられなかった。
      実は悟空は火を恐れず、ただ煙を恐れた。かつて天宮で大暴れしたため、太上老君（たいじょうろうくん）の八卦炉（はっけろ）へ入れられ、一度火で煉られたことがあった。幸い、巽（そん）の方位へ身を寄せたので、焼けはしなかった。ただ、風が煙を巻き込み、その煙に燻されて火眼金睛（かがんきんせい）になったため、今でも煙だけは苦手だったのである。
      紅孩児がもう一口煙を噴くと、悟空は耐えきれず、雲に飛び乗って逃げた。紅孩児は再び火の道具を収め、洞へ戻った。
    "translation_status": "reviewed"
  - "id": "xy-ch41-033"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖一身煙火，炮燥難禁，徑投於澗水內救火。怎知被冷水一逼，弄得火氣攻心，三魂出舍。可憐氣塞胸堂喉舌冷，魂飛魄散喪殘生。慌得那四海龍王在半空裡收了雨澤，高聲大叫：「天蓬元帥、捲簾將軍，休在林中藏隱，且尋你師兄出來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 188
        "line_end": 188
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L187-L187"
    "translation_ja": |-
      悟空は全身を煙と火に包まれ、焼けつく熱さに耐えられず、火を消そうと、まっすぐ谷川へ飛び込んだ。ところが冷水に急に冷やされ、火の気が心へ攻め上り、三つの魂が体を離れてしまった。ああ、気は胸に詰まり、喉も舌も冷え、魂は飛び散って、残る命も失った。
      四海の竜王は慌て、空中で雨をやめて、大声で叫んだ。
      四海の竜王「天蓬元帥（てんぽうげんすい）、捲簾将軍（けんれんしょうぐん）！　林に隠れていないで、早く兄弟子を捜し出してください！」
    "translation_status": "reviewed"
  - "id": "xy-ch41-034"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒與沙僧聽得呼他聖號，急忙解了馬，挑著擔，奔出林來，也不顧泥濘，順澗邊找尋。只見那上溜頭翻波滾浪，急流中淌下一個人來。沙僧見了，連衣跳下水中，抱上岸來，卻是孫大聖身軀。噫！你看他蜷跼四肢伸不得，渾身上下冷如冰。沙和尚滿眼垂淚道：「師兄，可惜了你，億萬年不老長生客，如今化作個中途短命人。」八戒笑道：「兄弟莫哭。這猴子佯推死，嚇我們哩。你摸他摸，胸前還有一點熱氣沒有？」沙僧道：「渾身都冷了，就有一點兒熱氣，怎的就得回生？」八戒道：「他有七十二般變化，就有七十二條性命。你扯著腳，等我擺佈他。」真個那沙僧扯著腳，八戒扶著頭，把他拽個直，推上腳來，盤膝坐定。八戒將兩手搓熱，仵住他的七竅，使一個按摩禪法。原來那行者被冷水逼了，氣阻丹田，不能出聲。卻幸得八戒按摸揉擦，須臾間，氣透三關，轉明堂，沖開孔竅，叫了一聲：「師父啊！」沙僧道：「哥啊，你生為師父，死也還在口裡。且甦醒，我們在這裡哩。」行者睜開眼道：「兄弟們在這裡？老孫吃了虧也。」八戒笑道：「你才子發昏的，若不是老豬救你啊，已此了帳了，還不謝我哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 189
        "line_end": 189
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L188-L188"
    "translation_ja": |-
      八戒と沙悟浄は、自分たちの昔の尊称で呼ばれるのを聞くと、急いで馬の縄を解き、荷物を担いで林から駆け出した。ぬかるみも構わず谷川沿いを捜すと、上流で波が渦を巻き、急流の中を一人の体が流されてきた。沙悟浄はそれを見るなり、衣服のまま水へ飛び込み、抱きかかえて岸へ上げた。ほかでもない、悟空の体だった。ああ、手足は縮こまって伸びず、全身が氷のように冷えている。
      沙悟浄は目いっぱいに涙をためて言った。
      沙悟浄「兄さん、なんということだ。億万年も老いずに生きるはずだったのに、今では旅の途中で短い命を終える人になってしまった」
      八戒は笑った。
      八戒「兄弟、泣くな。この猿は死んだふりで、俺たちを驚かせているんだ。触ってみろ。胸のあたりに、まだ少しは温かみが残っていないか？」
      沙悟浄「全身冷えきっています。少し温かみがあったところで、どうして生き返るんです？」
      八戒「七十二とおりに変化できるんだから、命だって七十二ある。お前は足を引っ張れ。俺が何とかしてやる」
      沙悟浄が足を引き、八戒が頭を支えて体をまっすぐに伸ばした。それから足を押し上げ、あぐらを組ませて座らせた。八戒は両手をこすって温め、悟空の七竅（しちきょう）に当て、按摩の禅法を施した。
      悟空は冷水に押さえられ、気が丹田（たんでん）で滞っていたので、声を出せなかったのである。幸い八戒が押したり揉んだりさすったりすると、やがて気が三関（さんかん）を通り、明堂（めいどう）をめぐり、体の穴を押し開いて、声が出た。
      悟空「お師匠さま！」
      沙悟浄「兄さん、生きているときも師匠、死んでもなお、やはり師匠ですか。さあ、気を確かにしてください。私たちはここにいます」
      悟空は目を開けた。
      悟空「兄弟たち、ここにいたのか。俺はひどい目に遭ったな」
      八戒は笑った。
      八戒「さっきは気を失っていたんだぞ。俺が助けなければ、とっくにおしまいだった。まだ礼も言わないのか」
    "translation_status": "reviewed"
  - "id": "xy-ch41-035"

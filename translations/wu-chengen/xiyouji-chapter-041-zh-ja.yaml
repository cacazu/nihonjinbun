    "translation_ja": |-
      めらめら、烈しく、空いっぱいを焼き払い、
      あかあか、威勢よく、大地を赤く染める。
      火の輪が上下に飛び交うよう、
      炭のかけらが東西に舞うよう。
      これは燧人（すいじん）が木をこすって起こした火ではなく、
      老子（ろうし）が丹薬を煉る火でもない。
      天の火でも、野の火でもなく、
      妖魔が修行して会得した、まことの三昧の火（さんまいのひ）だ。
      五台の車は五行に合い、
      五行が生み変わる働きから、火が煉り出される。
      肝の木が心の火を生み、盛んにし、
      心の火は脾の土を整える。
      脾の土が金を生み、金は水を生み、
      水は木を生んで、霊妙な働きがすべてにつながる。
      次々と生まれ変わるのは、いずれも火によるもの。
      火が大空に広がれば、万物は栄える。
      妖魔は長い修練の末、その奥義を三昧と呼び、
      西方第一の名を、いつまでも誇っている。
    "translation_status": "reviewed"
  - "id": "xy-ch41-017"

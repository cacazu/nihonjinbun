    "source_text": "行者被他煙火飛騰，不能尋怪，看不見他洞門前路徑，抽身跳出火中。那妖精在門首看得明白，他見行者走了，卻才收了火具，帥群妖，轉於洞內，閉了石門，以為得勝，著小的排宴奏樂，歡笑不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"

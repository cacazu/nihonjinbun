  - "id": "xy-ch41-022"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      鯊魚驍勇為前部，鱯痴口大作先鋒。
      鯉元帥翻波跳浪，鯁提督吐霧噴風。
      鯖太尉東方打哨，鮊都司西路催征。
      紅眼馬郎南面舞，黑甲將軍北下衝。
      鯕把總中軍掌號，五方兵處處英雄。
      縱橫機巧黿樞密，妙算玄微龜相公。
      有謀有智鼉丞相，多變多能鱉總戎。
      橫行蟹士掄長劍，直跳蝦婆扯硬弓。
      鮎外郎查明文簿，點龍兵出離波中。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 160
        "line_end": 168
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L159-L167"
    "translation_ja": |-
      勇猛な鮫が先の部隊を務め、大口の鱯痴（ごち）が先鋒となる。
      鯉元帥（りげんすい）は波を翻して飛び跳ね、鯁提督（こうていとく）は霧を吐き、風を噴く。
      鯖太尉（せいたいい）は東で斥候に立ち、鮊都司（はくとし）は西の路で進軍を促す。
      紅眼馬郎（こうがんばろう）は南で舞い、黒甲将軍（こっこうしょうぐん）は北へ突き進む。
      鯕把総（きはそう）が中軍で号令をつかさどり、五方の兵はどこも豪傑ぞろい。
      黿枢密（げんすうみつ）は縦横に機略をめぐらし、亀相公（きしょうこう）は奥深く巧妙な策を立てる。
      鼉丞相（だじょうしょう）は知恵と策略に富み、鼈総戎（べつそうじゅう）は変化も技も多彩だ。
      横に進む蟹の兵は長剣を振り、まっすぐ跳ねる蝦婆（かば）は強弓を引く。
      鮎外郎（ねんがいろう）が名簿を詳しく調べ、竜の兵を点呼して、波の中から出発させる。
    "translation_status": "reviewed"

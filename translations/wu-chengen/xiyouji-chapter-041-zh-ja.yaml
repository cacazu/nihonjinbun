    "source_text": "眾妖開了門，妖精就跑在空裡觀看，只見八戒往南去了。妖精想著南邊再無他處，斷然是請觀音菩薩。急按下雲，叫：「小的們，把我那皮袋尋出來。多時不用，只恐口繩不牢，與我換上一條，放在二門之下。等我去把八戒賺將回來，裝於袋內，蒸得稀爛，犒勞你們。」原來那妖精有一個如意的皮袋。眾小妖拿出來，換了口繩，安於洞門內不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 201
        "line_end": 201
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L200-L200"
    "translation_ja": |-
      小妖怪たちが門を開けると、紅孩児は空へ駆け上がって見回した。八戒が南へ向かっている。南にはほかに行くところもないから、きっと観音菩薩を呼びに行くのだろうと考えた。すぐ雲を降り、命じた。
      紅孩児「お前たち、俺の革袋を出してこい。長らく使っていないから、口を縛る紐が弱っているかもしれない。新しい紐に替えて、二つ目の門の下へ置いておけ。八戒をだまして連れ帰り、袋へ詰め、ぐずぐずになるまで蒸して、お前たちに振る舞ってやる」
      紅孩児は、思いのままに使える革袋を一つ持っていた。小妖怪たちはそれを取り出し、口紐を取り替えて、洞の門の内側へ置いた。この話はさておこう。

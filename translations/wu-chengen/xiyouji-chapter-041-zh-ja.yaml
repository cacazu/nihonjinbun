    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖與沙僧正坐，只見一陣腥風，刮面而過，他就打了一個噴嚏道：「不好，不好！這陣風凶多吉少，想是豬八戒走錯路也。」沙僧道：「他錯了路，不會問人？」行者道：「想必撞見妖精了。」沙僧道：「撞見妖精，他不會跑回？」行者道：「不停當。你坐在這裡看守，等我跑過澗去打聽打聽。」沙僧道：「師兄腰疼，只恐又著他手，等小弟去罷。」行者道：「你不濟事，還讓我去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 207
        "line_end": 207
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L206-L206"
    "translation_ja": |-
      さて、悟空と沙悟浄が座っていると、生臭い風がさっと顔をかすめた。悟空はくしゃみを一つした。
      悟空「まずい、まずい！　この風は吉より凶が多い。猪八戒は道を間違えたらしいぞ」
      沙悟浄「道を間違えたのなら、人に聞けばよいでしょう？」
      悟空「きっと妖怪に出会ったんだ」
      沙悟浄「妖怪に出会ったのなら、逃げて帰れないんですか？」
      悟空「これはまずい。お前はここにいて、見張っていろ。俺が谷を越えて、様子を探ってくる」
      沙悟浄「兄さんは腰が痛いのでしょう。また敵の手に落ちるかもしれません。私に行かせてください」
      悟空「お前には無理だ。やはり俺が行こう」
    "translation_status": "reviewed"
  - "id": "xy-ch41-044"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，咬著牙，忍著疼，捻著鐵棒，走過澗，到那火雲洞前，叫聲：「潑怪！」那把門的小妖又急入裡報：「孫行者又在門首叫哩。」那妖王傳令叫拿。那夥小妖槍刀簇擁，齊聲吶喊，即開門，都道：「拿住，拿住。」行者果然疲倦，不敢相迎，將身鑽在路傍，念個咒語，叫：「變！」即變做一個銷金包袱。小妖看見取了進去，報道：「大王，孫行者怕了，只見說一聲『拿』字，慌得把包袱丟下，走了。」妖王笑道：「那包袱也無甚麼值錢之物，左右是和尚的破褊衫、舊帽子，背進來拆洗做補襯。」一個小妖果將包袱背進，不知是行者變的。行者道：「好了，這個銷金包袱背著了。」那妖精不以為事，丟在門內。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 208
        "line_end": 208
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L207-L207"
    "translation_ja": |-
      悟空は歯を食いしばり、痛みをこらえ、鉄棒を握って谷川を越え、火雲洞の前へ行った。
      悟空「悪党め！」
      門番の小妖怪は、また急いで中へ報告した。
      門番の小妖怪「孫行者がまた門の前で叫んでおります！」
      紅孩児は捕らえろと命じた。小妖怪たちは槍や刀を群がるように構え、一斉に鬨の声を上げて門を開けた。
      小妖怪たち「捕まえろ、捕まえろ！」
      悟空はやはり疲れきっていて、迎え撃てなかった。道の脇へ身を潜め、呪文を唱えた。
      悟空「変われ！」
      たちまち金箔の文様入りの包みへ変わった。小妖怪が見つけて持ち込み、報告した。
      小妖怪「大王、孫行者は怖くなったようです。『捕まえろ』の一言を聞いただけで、慌てて包みを投げ捨て、逃げました」
      紅孩児は笑った。
      紅孩児「そんな包みに、値打ちのある物など入っていまい。どうせ坊主の破れた上衣や古い帽子だ。背負って来て、ほどいて洗い、継ぎ布にでもしろ」
      小妖怪の一人が、その包みを背負って中へ入った。悟空が化けたものとは知らない。
      悟空「よし、金箔模様のこの包みを、背負ってくれたぞ」
      紅孩児は気にも留めず、門の内側へ放っておかせた。
    "translation_status": "reviewed"
  - "id": "xy-ch41-045"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      好行者，假中又假，虛裡還虛：即拔一根毫毛，吹口仙氣，變作個包袱一樣；他的真身卻又變作一個蒼蠅兒，釘在門樞上。只聽得八戒在那裡哼哩哼的，聲音不清，卻似一個瘟豬。行者嚶的飛了去尋時，原來他吊在皮袋裡也。行者釘在皮袋上，又聽得他惡言惡語罵妖怪長，妖怪短：「你怎麼假變作個觀音菩薩，哄我回來，吊我在此，還說要吃我？有一日我師兄：

      大展齊天無量法，滿山潑怪等時擒。
      解開皮袋放我出，築你千鈀方趁心。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 210
        "line_end": 213
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L209-L212"
    "translation_ja": |-
      悟空は偽りの中にさらに偽り、虚の中にさらに虚を重ねた。毛を一本抜いて仙気を吹きかけ、同じ形の包みに変え、自分の体は蝿に変えて、門の軸へ止まった。
      耳を澄ますと、どこかで八戒がううん、ううんと唸っている。声はこもって、病気の豚のようだった。悟空がぶんと飛んで捜すと、八戒は革袋の中へ入れられ、吊るされていた。袋に止まると、八戒はなおも口汚く妖怪を罵っていた。
      八戒「よくも偽の観音菩薩に化けて、俺をだまして連れ帰り、こんなところに吊るしてくれたな。そのうえ食うだと！　いつか俺の兄貴が、
      天にも等しい、限りない術を大いに振るい、
      山じゅうの悪い妖怪を、たちどころに捕らえるぞ。
      革袋をほどき、俺を外へ出してくれたら、
      お前らを熊手で千回突いて、やっと気が晴れるんだ！」
    "translation_status": "reviewed"
  - "id": "xy-ch41-046"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，暗笑道：「這獃子雖然在這裡面受悶氣，卻還不倒了旗槍。老孫一定要拿了此怪；若不如此，怎生雪恨。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 214
        "line_end": 214
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L213-L213"
    "translation_ja": |-
      悟空はそれを聞き、ひそかに笑った。
      悟空「このばか、こんな中で憂さをためていても、まだ降参する気はないらしいな。俺は必ずこの妖怪を捕まえてやる。そうでなければ、どうして恨みを晴らせるものか」
    "translation_status": "reviewed"
  - "id": "xy-ch41-047"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正欲設法拯救八戒出來，只聽得妖王叫道：「六健將何在？」時有六個小妖是他知己的精靈，封為健將，都有名字：一個叫做雲裡霧，一個叫做霧裡雲；一個叫做急如火，一個叫做快如風；一個叫做興烘掀，一個叫做掀烘興。六健將上前跪下。妖王道：「你們認得老大王家麼？」六健將道：「認得。」妖王道：「你與我星夜去請老大王來，說我這裡捉唐僧蒸與他吃，壽延千紀。」六怪領命，一個個廝拖廝扯，徑出門去了。行者嚶的一聲，飛下袋來，跟定那六怪，躲離洞中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 216
        "line_end": 216
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L215-L215"
    "translation_ja": |-
      悟空が八戒を救い出す方法を考えようとしたとき、紅孩児の声が聞こえた。
      紅孩児「六健将（ろっけんしょう）はいるか！」
      紅孩児がとくに信頼し、健将に任じた小妖怪が六人いた。それぞれに名があり、一人は雲裡霧（うんりむ）、一人は霧裡雲（むりうん）、一人は急如火（きゅうじょか）、一人は快如風（かいじょふう）、一人は興烘掀（こうこうけん）、一人は掀烘興（けんこうこう）といった。六健将が進み出てひざまずいた。
      紅孩児「お前たち、老大王のお住まいを知っているな？」
      六健将「存じております」
      紅孩児「夜道を急いで、老大王を迎えに行け。ここで唐僧を捕まえたので、蒸して召し上がっていただき、千紀（き）の寿命をお延ばしいただこうとな」
      六人の妖怪は命令を受け、互いに引っ張り合い、連れ立ってまっすぐ門を出た。悟空はぶんと音を立てて袋を離れ、六人のあとについて、そっと洞を抜け出した。
    "translation_status": "reviewed"
  - "id": "xy-ch41-048"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知怎的請來，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 218
        "line_end": 218
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L217-L217"
    "translation_ja": "さて、いったいどのようにして迎えてくるのか。それは次回のお話で。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-01-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の心猿は心を猿にたとえた語で、ここでは悟空を指す。木母は内丹の寓意語で、八戒に重ねられる。通常の地の文・話者名をこの寓意語へ置き換えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-02-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭の『迴鑾古道』は、御車が引き返す古道として訳した。具体的な行幸の故事や地名の同定は未確定。『崑崙地脈發來龍』は風水の地脈を竜になぞらえる語で、生きた竜がここから出たという出来事を補ってはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-03-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "義兄弟の列挙は底本どおり七人・七つの称号と順を残した。大鵬魔王、獅㾩王、\U000247F9狨王は、従前の鵬魔王、獅駝王、禺狨王に対応する異表記として同じ辞書項目へ結ぶ。㾩を駝などへ無断訂正せず、原字を訳文にも残す。『以長欺幼』は年長者が年少者をいじめる意味で、父子関係を新たに作らない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-04-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『正果善財郎』は、この時点の原詩が紅孩児へ与えている予告的な呼び名として訳した。場面内で正式に名づけられたとは扱わず、通常の地の文と発言者名は紅孩児のままとする。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-05-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "五行の生化は肝木→心火→脾土→金→水→木の順を保持した。身体の気と火を結びつける物語上の内丹的な説明であり、現代の生理学・医療の説明ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-06-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『槍法比我何如？』には底本で発話動詞が省かれているが、悟空の比較の問いと八戒の返答が続く文脈に従い、悟空の発話とした。原文は変更していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-07-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この回の敖広の発言は、敖閏を北海、敖順を西海の竜王とする。第三回の敖順＝北海、敖閏＝西海とは逆だが、原文の発言を無断で訂正せず、そのまま訳した。人物の対応は海域の役割を基準にし、北海の敖閏は従前の北海竜王の異名、西海の敖順は従前の西海竜王の異名として扱う。同じ字の個人名だけで北海と西海の人物を取り違えず、双方の竜王を一人に統合しない。降雨の手続きで文書を回す『太乙』の具体的な神格の同定は未確定であり、他の太乙を含む神名へ拡張しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-08-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "水族の軍勢は、魚介・水生動物に人間の官職を割り当てた列挙であり、全役職と動作を保持した。鱯痴、鯁、鯖、鮊、鯕、紅眼馬郎、黒甲将軍、蝦婆の種の厳密な同定は留保する。蝦婆の婆という字だけで性別を女性と断定せず、黒甲の甲を生物の甲羅と断定しない。別版本の検索表示には鯕と鱑などの違いがあるが、底本の字を変更していない。鮎は中国語ではナマズをいい、日本語のアユではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-09-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『鴨頂綠』『佛頭青』は水や山の色をたとえる語。鴨の頭や仏像が水中に実在するという出来事にはしていない。千丈・万条の数は詩の誇張として残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-10-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "語り手の『喪殘生』と沙悟浄の『死也』という死亡の表現はそのまま残した。続いて八戒が死んだふりだと言い、悟空が回復するが、これを理由に先の表現を昏倒だけへ書き換えない。悟空の倒れた状態と回復は、魂・丹田・三関・明堂・七竅などを用いた物語上の身体観である。三関の具体的な部位は説が分かれ、本文だけから確定しない。八戒の『七十二の変化だから七十二の命』は本人の発言として残し、語り手の説明にはしていない。按摩の描写は現代の救命処置を示すものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-11-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原詩の『三山六水』は多くの山川をいう表現として読めるが、数字を落とさず三つの山、六つの川と訳した。ここで過去の旅程を実際に三山六河と数え直したものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-12-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "八戒は紅孩児の変身を見抜かず、悟空が子供を地面へたたきつけたことを説明する。これは八戒の認識・弁明として訳し、紅孩児を害のない善人とする語り手の判断へ変えない。観音の姿をした発話者は紅孩児である。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-13-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『銷金包袱』は金箔による文様のある包みとして訳す。小妖怪が背負い込むという字面を残し、『厄介を背負い込んだ』という含みの可能性はあるが、本文へ断定的な説明を加えなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-note-14-body"
    "section_id": "chapter-41"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "六健将の名は、対になる語を入れ替えた三組の構成を保持した。末尾の『老大王』はこの時点の呼びかけを残す。千紀は長寿を誇張する表現として訳し、現代の年数へ確定的に換算していない。"
    "translation_status": "reviewed"
"notes":
  - "id": "xy-ch41-note-01"

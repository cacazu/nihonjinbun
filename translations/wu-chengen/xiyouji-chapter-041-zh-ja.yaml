  "known_gaps":
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-004"
      "description_ja": "冒頭の『迴鑾古道』は、御車が引き返す古道として訳した。具体的な行幸の故事や地名の同定は未確定。『崑崙地脈發來龍』は風水の地脈を竜になぞらえる語で、生きた竜がここから出たという出来事を補ってはいない。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-010"
      "description_ja": "義兄弟の列挙は底本どおり七人・七つの称号と順を残した。大鵬魔王、獅㾩王、\U000247F9狨王は、従前の鵬魔王、獅駝王、禺狨王に対応する異表記として同じ辞書項目へ結ぶ。㾩を駝などへ無断訂正せず、原字を訳文にも残す。『以長欺幼』は年長者が年少者をいじめる意味で、父子関係を新たに作らない。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-020"
      "description_ja": "この回の敖広の発言は、敖閏を北海、敖順を西海の竜王とする。第三回の敖順＝北海、敖閏＝西海とは逆だが、原文の発言を無断で訂正せず、そのまま訳した。人物の対応は海域の役割を基準にし、北海の敖閏は従前の北海竜王の異名、西海の敖順は従前の西海竜王の異名として扱う。同じ字の個人名だけで北海と西海の人物を取り違えず、双方の竜王を一人に統合しない。降雨の手続きで文書を回す『太乙』の具体的な神格の同定は未確定であり、他の太乙を含む神名へ拡張しない。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-022"
      "description_ja": "水族の軍勢は、魚介・水生動物に人間の官職を割り当てた列挙であり、全役職と動作を保持した。鱯痴、鯁、鯖、鮊、鯕、紅眼馬郎、黒甲将軍、蝦婆の種の厳密な同定は留保する。蝦婆の婆という字だけで性別を女性と断定せず、黒甲の甲を生物の甲羅と断定しない。別版本の検索表示には鯕と鱑などの違いがあるが、底本の字を変更していない。鮎は中国語ではナマズをいい、日本語のアユではない。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-034"
      "description_ja": "語り手の『喪殘生』と沙悟浄の『死也』という死亡の表現はそのまま残した。続いて八戒が死んだふりだと言い、悟空が回復するが、これを理由に先の表現を昏倒だけへ書き換えない。悟空の倒れた状態と回復は、魂・丹田・三関・明堂・七竅などを用いた物語上の身体観である。三関の具体的な部位は説が分かれ、本文だけから確定しない。八戒の『七十二の変化だから七十二の命』は本人の発言として残し、語り手の説明にはしていない。按摩の描写は現代の救命処置を示すものではない。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"
    - "source_id": "wikisource-xiyou-ch41-1500598"
      "segment_ids":
        - "xy-ch41-044"
      "description_ja": "『銷金包袱』は金箔による文様のある包みとして訳す。小妖怪が背負い込むという字面を残し、『厄介を背負い込んだ』という含みの可能性はあるが、本文へ断定的な説明を加えなかった。 本文の欠落ではなく、解釈・底本の異表記に関する留保。"

    "source_text": "須臾間，三海龍王擁至，問：「大哥，有何事命弟等？」敖廣道：「孫大聖在這裡借雨助力降妖。」三弟即引進見畢，行者備言借水之事。眾神個個歡從，即點起："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"

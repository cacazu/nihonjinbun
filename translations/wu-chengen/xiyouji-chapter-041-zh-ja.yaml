  - "id": "xy-ch41-002"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      善惡一時忘念，榮枯都不關心。晦明隱現任浮沉。隨分饑餐渴飲。
      神靜湛然常寂，昏冥便有魔侵。五行蹬蹭破禪林。風動必然寒凜。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 119
        "line_end": 120
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L118-L119"
    "translation_ja": |-
      善だ悪だという思いを、ひとときすっかり忘れ、
      栄えるも衰えるも、心にかけない。
      暗きも明るきも、隠れるも現れるも、浮き沈みに任せ、
      身の分に応じ、腹が減れば食い、渇けば飲む。
      精神が静まれば、澄みきった静けさが続くが、
      心が暗く曇れば、そこへ魔が入り込む。
      五行（ごぎょう）の歩みがもつれれば、禅の境地も破られ、
      風が動けば、必ず身にしみる寒さが来る。
    "translation_status": "reviewed"
  - "id": "xy-ch41-003"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那孫大聖引八戒別了沙僧，跳過枯松澗，徑來到那怪石崖前。果見有一座洞府，真個也景致非凡。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 122
        "line_end": 122
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L121-L121"
    "translation_ja": "さて悟空（ごくう）は、八戒（はっかい）を連れて沙悟浄（さごじょう）に別れを告げ、枯松澗（こしょうかん）を跳び越え、まっすぐ怪石のそびえる崖へ向かった。果たしてそこには洞府（どうふ）があり、まことに並々ならぬ景色だった。見れば、"
    "translation_status": "reviewed"
  - "id": "xy-ch41-004"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      迴鑾古道幽還靜，風月也聽玄鶴弄。
      白雲透出滿川光，流水過橋仙意興。
      猿嘯鳥啼花木奇，藤蘿石蹬芝蘭勝。
      蒼搖崖壑散煙霞，翠染松篁招彩鳳。
      遠列巔峰似插屏，山朝澗繞真仙洞。
      崑崙地脈發來龍，有分有緣方受用。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 123
        "line_end": 128
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L122-L127"
    "translation_ja": |-
      御車も引き返す古道は、奥深く、ひっそりと静まり、
      風も月も、黒い鶴の戯れに身を任せる。
      白雲の間から光が差して、川辺一面を照らし、
      橋をくぐる流れは、仙境の趣を湧き立たせる。
      猿が叫び、鳥が鳴き、珍しい花木が茂り、
      蔓や藤のからむ石段に、芝草や蘭が美しい。
      青々とした木々が崖や谷に揺れ、霞を散らし、
      緑に染まる松や竹が、彩り豊かな鳳凰を招く。
      遠く連なる峰は、立て並べた屏風のよう。
      山々が向き合い、谷川がめぐる、まさに仙人の洞。
      崑崙（こんろん）から延びる地脈が、この地の竜脈となり、
      運と縁のある者だけが、この景色を我がものにする。
    "translation_status": "reviewed"
  - "id": "xy-ch41-005"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "將近行到門前，見有一座石碣，上鐫八個大字，乃是「號山枯松澗火雲洞」。那壁廂一群小妖，在那裡掄槍舞劍的跳風頑耍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 130
        "line_end": 130
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L129-L129"
    "translation_ja": "門の近くまで行くと、石碑が立っていた。八つの大きな文字が彫られ、「号山（ごうざん）・枯松澗・火雲洞（かうんどう）」とある。向こうでは小妖怪たちが槍を振り、剣を舞わせ、跳びはねて遊んでいた。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-006"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖厲聲高叫道：「那小的們，趁早去報與洞主知道，教他送出我唐僧師父來，免你這一洞精靈的性命；牙迸半個『不』字，我就掀翻了你的山場，屣平了你的洞府。」那些小妖，聞此言，慌忙急轉身，各歸洞裡，關了兩扇石門，到裡邊來報：「大王，禍事了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 132
        "line_end": 132
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L131-L131"
    "translation_ja": |-
      悟空は厳しい声で怒鳴った。
      悟空「おい、下っ端ども！　さっさと洞の主人に知らせろ。俺の師匠、唐僧（とうそう）を返せと言うんだ。そうすれば、この洞の妖怪どもの命は助けてやる。少しでも『いや』などと口にしてみろ。この山をひっくり返し、洞を踏みつぶしてやるぞ！」
      小妖怪たちはこれを聞くと、慌てて向きを変え、みな洞へ逃げ戻った。二枚の石の扉を閉め、中へ駆け込んで報告した。
      小妖怪たち「大王、大変です！」
    "translation_status": "reviewed"
  - "id": "xy-ch41-007"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那怪自把三藏拿到洞中，選剝了衣服，四馬攢蹄綑在後院裡，著小妖打乾淨水刷洗，要上籠蒸吃哩。忽聽得報聲禍事，且不刷洗，便來前庭上問：「有何禍事？」小妖道：「有個毛臉雷公嘴的和尚，帶一個長嘴大耳的和尚，在門前要甚麼唐僧師父哩。但若牙迸半個『不』字，就要掀翻山場，屣平洞府。」魔王微微冷笑道：「這是孫行者與豬八戒，他卻也會尋哩。我拿他師父，自半山中到此，有百五十里，卻怎麼就尋上門來？」教小的們把管車的推出車去。那一班幾個小妖，推出五輛小車兒來，開了前門。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 133
        "line_end": 133
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L132-L132"
    "translation_ja": |-
      紅孩児（こうがいじ）は三蔵（さんぞう）を洞へ捕らえてくると、衣服をはぎ取り、両手両足を一つに縛って裏庭へ置いていた。小妖怪にきれいな水を汲ませ、体を洗ってから蒸籠に入れ、蒸して食べるつもりだった。そこへ大変だという声がしたので、洗うのをひとまずやめさせ、前庭へ来て尋ねた。
      紅孩児「何が大変だ？」
      小妖怪「毛むくじゃらの顔で雷神のような口をした僧が、口の長い、耳の大きな僧を連れて来まして、門の前で何とかいう唐僧師匠を返せと言っております。少しでも『いや』と口にすれば、山をひっくり返し、洞を踏みつぶすそうです」
      紅孩児は薄く冷笑した。
      紅孩児「孫行者（そんぎょうじゃ）と猪八戒（ちょはっかい）だな。よく探し当てたものだ。師匠をさらった山の中腹から、ここまでは百五十里（り）もある。それなのに、どうやってこの門までたどり着いた？」
      そして部下たちに、車を扱う者に車を外へ出させろと命じた。担当の小妖怪たちは、小さな車を五台押して来て、表の門を開いた。
    "translation_status": "reviewed"
  - "id": "xy-ch41-008"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒望見道：「哥哥，這妖精想是怕我們，推出車子，往那廂搬哩。」行者道：「不是，且看他放在那裡。」只見那小妖將車子按金、木、水、火、土安下，著五個看著，五個進去通報。那魔王問：「停當了？」答應：「停當了。」教取過槍來。有那一夥管兵器的小妖，著兩個擡出一桿丈八長的火尖槍，遞與妖王。妖王掄槍拽步，也無甚麼盔甲，只是腰間束一條錦繡戰裙，赤著腳，走出門前。行者與八戒擡頭觀看，但見那怪物："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 135
        "line_end": 135
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L134-L134"
    "translation_ja": |-
      それを見た八戒が言った。
      八戒「兄貴、妖怪は俺たちが怖くなったんじゃないか。車を出して、どこかへ引っ越すつもりだぞ」
      悟空「違う。どこへ置くのか、まず見ていろ」
      小妖怪たちは、金・木・水・火・土の配置に従って車を据えた。五人を見張りに残し、五人が中へ報告に戻った。
      紅孩児「準備はできたか？」
      小妖怪たち「できました」
      紅孩児は槍を持ってくるよう命じた。武器係の小妖怪のうち二人が、一丈（じょう）八尺（しゃく）の火尖槍（かせんそう）を担いで来て差し出した。紅孩児は槍を振り回し、大股で歩き出した。兜も鎧も着けず、腰に錦繍の戦裙（せんくん）を一枚巻いただけで、裸足のまま門の前へ出てくる。悟空と八戒が顔を上げて見ると、その姿は、
    "translation_status": "reviewed"
  - "id": "xy-ch41-009"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      面如傅粉三分白，唇若塗朱一表才。
      鬢挽青雲欺靛染，眉分新月似刀裁。
      戰裙巧繡盤龍鳳，形比哪吒更富胎。
      雙手綽槍威凜冽，祥光護體出門來。
      哏聲響若春雷吼，暴眼明如掣電乖。
      要識此魔真姓氏，名揚千古喚紅孩。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 136
        "line_end": 141
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L135-L140"
    "translation_ja": |-
      顔はおしろいを塗ったように、ひときわ白く、
      唇は朱を引いたような、美しい顔立ち。
      鬢の髪は青雲のように結われ、藍染めよりも黒々とし、
      眉は新月の形に分かれ、刀で切りそろえたよう。
      戦裙には、からみ合う竜と鳳凰を巧みに縫い取り、
      体つきは哪吒（なた）にも増して、ふくよかだ。
      両手に槍を構える威勢は凜として、
      瑞光を身にまとい、門から出てくる。
      唸り声は、春の雷が轟くように響き、
      見開く目は、走る稲妻のように鋭く光る。
      この妖魔のまことの名を知りたければ、
      千年の後まで名をとどろかす、紅孩（こうがい）だ。
    "translation_status": "reviewed"
  - "id": "xy-ch41-010"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那紅孩兒怪出得門來，高叫道：「是甚麼人在我這裡吆喝！」行者近前笑道：「我賢姪莫弄虛頭。你今早在山路傍高吊在松樹梢頭，是那般一個瘦怯怯的黃病孩兒，哄了我師父。我倒好意馱著你，你就弄風兒把我師父攝將來。你如今又弄這個樣子，我豈不認得你？趁早送出我師父，不要白了面皮，失了親情，恐你令尊知道，怪我老孫以長欺幼，不象模樣。」那怪聞言，心中大怒，咄的一聲喝道：「那潑猴頭！我與你有甚親情？你在這裡滿口胡柴，綽甚聲經兒？那個是你賢姪？」行者道：「哥哥，是你也不曉得。當年我與你令尊做弟兄時，你還不知在那裡哩。」那怪道：「這猴子一發胡說！你是那裡人，我是那裡人，怎麼得與我父親做弟兄？」行者道：「你是不知。我乃五百年前大鬧天宮的齊天大聖孫悟空是也。我當初未鬧天宮時，遍遊海角天涯，四大部洲，無方不到，那時節專慕豪傑。你令尊叫做牛魔王，稱為平天大聖，與我老孫結為七弟兄，讓他做了大哥；還有個蛟魔王，稱為覆海大聖，做了二哥；又有個大鵬魔王，稱為混天大聖，做了三哥；又有個獅㾩王，稱為移山大聖，做了四哥；又有個獼猴王，稱為通風大聖，做了五哥；又有個\U000247F9狨王，稱為驅神大聖，做了六哥；惟有老孫身小，稱為齊天大聖，排行第七。我老弟兄們那時節耍子時，還不曾生你哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 142
        "line_end": 142
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L141-L141"
    "translation_ja": |-
      紅孩児は門を出るなり、大声を上げた。
      紅孩児「俺のところで騒いでいるのは、何者だ！」
      悟空は近づき、笑って言った。
      悟空「甥っ子よ、小細工はよせ。今朝、山道のそばの松の梢に高く吊られていたときは、やせこけた、弱々しい顔色の悪い子供になって、俺の師匠をだましたな。俺は親切に背負ってやったのに、お前は風を起こして、師匠をここへさらってきた。今はそんな姿になっているが、俺がお前を見抜けないとでも思ったか。早く師匠を返せ。互いに顔を背け、親戚の情を捨てるようなことはするな。お父上が知ったら、俺が年上のくせに子供をいじめた、みっともないと言うだろうからな」
      紅孩児はこれを聞くと、腹の底から怒り、かっと怒鳴った。
      紅孩児「ろくでなしの猿め！　俺とお前に、何の親戚関係がある！　でたらめばかり並べて、何をもっともらしくぬかす。誰がお前の甥だ！」
      悟空「おいおい、お前は知らないんだな。昔、俺がお前の父上と義兄弟になったころ、お前はまだ、どこにいたのかも分からないんだぞ」
      紅孩児「この猿、ますますでたらめを言う！　お前はどこの者で、俺はどこの者だ。どうして俺の父と義兄弟になれたんだ？」
      悟空「知らないなら教えてやろう。俺こそ、五百年前に天宮（てんきゅう）で大暴れした、斉天大聖（せいてんたいせい）・孫悟空（そんごくう）だ。天宮を騒がせる前には、海の果てから空の果てまで、四大部洲（しだいぶしゅう）のどこへでも出かけた。そのころは、豪傑をひたすら慕っていたものだ。お前の父は牛魔王（ぎゅうまおう）といい、平天大聖（へいてんたいせい）を名乗っていた。俺たちは七人で義兄弟の契りを結び、お前の父を一番上の兄貴にした。そのほか、蛟魔王（こうまおう）は覆海大聖（ふくかいたいせい）といい、二番目の兄貴。大鵬魔王（たいほうまおう）は混天大聖（こんてんたいせい）といい、三番目。獅㾩王（しかいおう）は移山大聖（いざんたいせい）といい、四番目。獼猴王（びこうおう）は通風大聖（つうふうたいせい）といい、五番目。𤟹狨王（ぐじゅうおう）は駆神大聖（くしんたいせい）といい、六番目の兄貴だった。俺だけは体が小さく、斉天大聖を名乗って、七番目になった。俺たち義兄弟が遊び回っていたころには、お前はまだ生まれていなかったんだぞ」
    "translation_status": "reviewed"
  - "id": "xy-ch41-011"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪物聞言，那裡肯信，舉起火尖槍就刺。行者正是那會家不忙，又使了一個身法，閃過槍頭，掄起鐵棒，罵道：「你這小畜生，不識高低，看棍！」那妖精也使身法，讓過鐵棒道：「潑猢猻，不達時務，看槍！」他兩個也不論親情，一齊變臉，各使神通，跳在雲端裡，好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 143
        "line_end": 143
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L142-L142"
    "translation_ja": |-
      紅孩児はそんな話を信じようともせず、火尖槍を持ち上げて突きかかった。そこは心得のある悟空、少しも慌てず、身をかわして穂先を避け、鉄棒を振り上げて罵った。
      悟空「この小僧、身の程を知らないな。棒を食らえ！」
      紅孩児も身をかわして鉄棒を避け、言い返した。
      紅孩児「ろくでなしの猿め、物の分からないやつだ。槍を食らえ！」
      二人はもう親戚の情など顧みず、そろって顔色を変え、おのおの神通力を振るい、雲の上へ跳び上がって戦った。その激しさは、
    "translation_status": "reviewed"
  - "id": "xy-ch41-012"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": "行者名聲大，魔王手段強。一個橫舉金箍棒，一個直挺火尖槍。吐霧遮三界，噴雲照四方。一天殺氣兇聲吼，日月星辰不見光。語言無遜讓，情意兩乖張。那一個欺心失禮儀，這一個變臉沒綱常。棒架威風長，槍來野性狂。一個是混元真大聖，一個是正果善財郎。二人努力爭強勝，只為唐僧拜法王。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 145
        "line_end": 145
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L144-L144"
    "translation_ja": |-
      悟空の名声は高く、妖王の技も強い。
      一人は金箍棒（きんこぼう）を横に構え、一人は火尖槍をまっすぐ突き出す。
      霧を吐いて三界（さんがい）を覆い、雲を噴いて四方を照らす。
      空いっぱいに殺気がみなぎり、すさまじい叫びが轟き、
      日も月も星も、光が見えない。
      言葉には譲り合いがなく、心は互いに背き合う。
      あちらは良心を欺き、礼儀を失い、
      こちらも顔色を変え、身内の道理を捨てる。
      棒で受ければ、威風はいよいよ高まり、
      槍が襲えば、荒々しい気性がほとばしる。
      一人は混元（こんげん）のまことの大聖（たいせい）、
      一人は正果（しょうか）を得る善財郎（ぜんざいろう）。
      二人が力を尽くして勝ちを争うのは、
      ひとえに唐僧が法王（ほうおう）を拝みに行くためだ。
    "translation_status": "reviewed"
  - "id": "xy-ch41-013"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖魔與孫大聖戰經二十合，不分勝敗。豬八戒在傍邊看得明白：妖精雖不敗陣，卻只是遮攔隔架，全無攻殺之能；行者縱不贏他，棒法精強，來往只在那妖精頭上，不離了左右。八戒暗想道：「不好啊，行者溜撒，一時間丟個破綻，哄那妖魔鑽進來，一鐵棒打倒，就沒了我的功勞。」你看他抖擻精神，舉著九齒鈀在空裡，望妖精劈頭就築。那怪見了心驚，急拖槍敗下陣來。行者喝教：「八戒，趕上，趕上。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 147
        "line_end": 147
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L146-L146"
    "translation_ja": |-
      紅孩児と悟空は二十合戦ったが、勝負はつかなかった。そばで見ていた八戒には、様子がよく分かった。紅孩児は負けこそしないものの、防いだり受け流したりするばかりで、まるで攻め込めない。悟空はまだ勝てないものの、棒の技は精妙で力強く、その一撃一撃は紅孩児の頭上と左右を離れなかった。八戒はひそかに考えた。
      八戒「まずいぞ。悟空は抜け目がない。わざと隙を見せて、妖怪を誘い込み、鉄棒で一撃して倒しでもしたら、俺の手柄がなくなる」
      そこで元気を振るい起こし、空中で九本歯の熊手（きゅうほんばのくまで）を持ち上げ、紅孩児の頭めがけて振り下ろした。紅孩児は驚き、急いで槍を引きずって敗走した。
      悟空「八戒、追え、追え！」
    "translation_status": "reviewed"
  - "id": "xy-ch41-014"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二人趕到他洞門前，只見妖精一隻手舉著火尖槍，站在那中間一輛小車兒上；一隻手捏著拳頭，往自家鼻子上搥了兩拳。八戒笑道：「這廝放賴不羞。你好道搥破鼻子，淌出些血來，搽紅了臉，往那裡告我們去耶？」那妖魔搥了兩拳，念個咒語，口裡噴出火來，鼻子裡濃煙迸出，閘閘眼，火焰齊生，那五輛車子上火光湧出。連噴了幾口，只見那紅焰焰大火燒空，把一座火雲洞被那煙火迷漫，真個是熯天熾地。八戒慌了道：「哥哥，不停當，這一鑽在火裡，莫想得活。把老豬弄做個燒熟的，加上香料，盡他受用哩。快走，快走。」說聲走，他也不顧行者，跑過澗去了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 148
        "line_end": 148
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L147-L147"
    "translation_ja": |-
      二人が洞の門まで追うと、紅孩児は真ん中の小車の上に立ち、片手に火尖槍を持っていた。もう一方の手を握り、自分の鼻を二度殴った。
      八戒は笑った。
      八戒「こいつ、恥ずかしくもなく言いがかりをつける気か。鼻を殴って血を出し、顔じゅう赤くして、どこかへ俺たちを訴えに行くつもりだな？」
      紅孩児は二度殴ったあと、呪文を唱えた。口から火が噴き出し、鼻から濃い煙がほとばしり、まばたきをすると、そこにも炎が燃え上がった。五台の車からも火が湧き出す。続けて数度噴くと、真っ赤な大火が空を焼き、火雲洞全体が煙と炎に包まれた。まさに天を焦がし、地を焼く勢いだ。八戒は慌てた。
      八戒「兄貴、こりゃまずい！　こんな火の中へ飛び込んだら、生きては帰れないぞ。俺を丸焼きにして、香料をふりかけて、好きなだけ食うつもりだ。逃げよう、逃げよう！」
      逃げようと言うなり、悟空のことなど構わず、谷川を越えて走り去った。
    "translation_status": "reviewed"
  - "id": "xy-ch41-015"
    "section_id": "chapter-41"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者神通廣大，捏著避火訣，撞入火中，尋那妖怪。那妖怪見行者來，又吐上幾口，那火比前更勝。好火："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第041回&oldid=1500598"
        "line_start": 150
        "line_end": 150
    "source_alignment":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "original_unit_id": "ws41-L149-L149"
    "translation_ja": "悟空は神通力が広大だったので、火を避ける印を結び、炎の中へ飛び込んで紅孩児を捜した。紅孩児は悟空が来るのを見ると、さらに数度火を噴き、炎は先ほどよりも激しくなった。なんという火だろう。"
    "translation_status": "reviewed"
  - "id": "xy-ch41-016"
    "section_id": "chapter-41"
    "kind": "verse"
    "origin": "source"
    "source_text": "炎炎烈烈盈空燎，赫赫威威遍地紅。卻似火輪飛上下，猶如炭屑舞西東。這火不是燧人鑽木，又不是老子炮丹，非天火，非野火，乃是妖魔修煉成真三昧火。五輛車兒合五行，五行生化火煎成。肝木能生心火旺，心火致令脾土平。脾土生金金化水，水能生木徹通靈。生生化化皆因火，火遍長空萬物榮。妖邪久悟呼三昧，永鎮西方第一名。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch41-1500598"
        "precision": "line"

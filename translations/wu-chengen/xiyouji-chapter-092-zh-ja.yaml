    "translation_ja": |-
      ほどなく通明殿（つうめいでん）の下へ着くと、まず葛・丘・張・許（かつ・きゅう・ちょう・きょ）の四大天師（しだいてんし）に会った。
      四大天師「どちらへ？」
      悟空「近ごろ金平府へ来たのですが、師匠が修行の心を緩め、元宵の夜に灯を見ていて妖魔にさらわれました。俺には降せず、特に玉帝へ奏上し、救援を願いに参りました。」四大天師は悟空を霊霄宝殿（れいしょうほうでん）へ案内して取り次いだ。それぞれ礼を終え、事情を詳しく述べると、玉帝が仰せになった。
      玉帝「どの天兵を選んで加勢させようか。」悟空は奏上した。
      悟空「先ほど西天門で長庚星（ちょうこうせい）に会いましたところ、あの妖怪は犀が化けたもので、四木禽星でなければ降せないとのことでした。」玉帝はすぐ、天師の許旌陽（きょせいよう）を悟空とともに斗牛宮へ遣わし、四木禽星を選んで下界へ降し、妖怪を討たせることにした。

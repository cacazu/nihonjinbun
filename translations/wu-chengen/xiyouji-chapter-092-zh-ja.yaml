    "source_text": "暗放玉籠飛彩鳳，私開金鎖走蛟龍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"

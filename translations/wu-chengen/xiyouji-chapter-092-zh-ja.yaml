    "source_text": "沙僧認得是二星，隨同拜謝。因問：「二位如何到此相救？」二星道：「吾等是孫大聖奏玉帝請旨調來收怪救你也。」唐僧又滴淚道：「我悟空徒弟怎麼不見進來？」二星道：「那三個老怪是三隻犀牛，他見吾等，各各顧命，向東北艮方逃遁，孫大聖帥井木犴、角木蛟追趕去了。我二星掃蕩群牛到此，特來解放聖僧。」唐僧復又頓首拜謝，朝天又拜。八戒攙起道：「師父，禮多必詐，不須只管拜了。四星官，一則是玉帝聖旨，二則是師兄人情。今既掃蕩群妖，還不知老妖如何降伏。我們且收拾些細軟東西出來，掀翻此洞，以絕其根，回寺等候師兄罷。」奎木狼道：「天蓬元帥說得有理。你與捲簾大將保護你師回寺安歇，待吾等還去艮方迎敵。」八戒道：「正是，正是。你二位還協同一捉，必須剿盡，方好回旨。」二星官即時追襲。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      沙悟浄は二星だと分かり、皆と一緒に拝んで礼を述べ、尋ねた。
      沙悟浄「お二方は、どうしてこちらへ助けに来てくださったのですか。」
      斗木獬と奎木狼「孫大聖が玉帝へ奏上し、聖旨を請われたので、我々は妖怪を討ってあなた方を救うため、遣わされたのです。」三蔵はまた涙をこぼした。
      三蔵「私の弟子の悟空は、なぜ入ってこないのでしょう。」
      斗木獬と奎木狼「あの三人の大妖怪は三頭の犀です。我々を見るなり、各々命を守ろうと、東北の艮の方角へ逃げました。孫大聖は井木犴と角木蛟を率いて追っています。我々二星は牛の群れを一掃してここへ来て、聖僧をお解きしたのです。」三蔵は再び額を地につけて礼を言い、さらに天を仰いで拝んだ。八戒は三蔵を助け起こして言った。
      八戒「お師匠さま、礼が多すぎると裏があると言いますよ。いつまでも拝んでいなくていいでしょう。四人の星官は、一つには玉帝の聖旨、二つには兄貴との義理で来たのです。手下どもは一掃したものの、大将の妖怪がどう降されるかは、まだ分かりません。ひとまず値打ちのある持ち運べる品を集め、この洞をひっくり返して根を絶ち、寺へ戻って兄貴を待ちましょう。」
      奎木狼「天蓬元帥（てんぽうげんすい）のおっしゃるとおりです。捲簾大将（けんれんたいしょう）とともにお師匠を守って寺へ帰り、お休みください。我々はまた艮の方角へ行き、敵に当たります。」
      八戒「そうです、そうです。お二方も一緒に捕らえ、必ず残らず始末してこそ、復命できますよ。」二人の星官はただちに追撃に向かった。
    "translation_status": "reviewed"
  - "id": "xy-ch92-019"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒與沙僧將他洞內細軟寶貝（有許多珊瑚、瑪瑙、珍珠、琥珀、琚、寶貝、美玉、良金）搜出一石，搬在外面。請師父到山崖上坐了，他又進去放起火來，把一座洞燒成灰燼。卻才領唐僧找路回金平慈雲寺去。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 150
        "line_end": 150
    "translation_ja": "八戒と沙悟浄は、洞の中にあった携帯しやすい宝物を一石（こく）分、探し出して外へ運んだ。珊瑚（さんご）、瑪瑙（めのう）、真珠、琥珀、琚（きょ）、宝物、美しい玉、上等な黄金などがたくさんあった。師を山の崖の上に座らせると、二人はまた中へ入って火を放ち、洞を丸ごと灰にした。それから三蔵を連れ、道を探して金平の慈雲寺へ帰った。まさしく、"
    "translation_status": "reviewed"
  - "id": "xy-ch92-020"
    "section_id": "chapter-92"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      經云「泰極還生否」，好處逢凶實有之。
      愛賞花燈禪性亂，喜遊美景道心漓。
      大丹自古宜長守，一失原來到底虧。
      緊閉牢拴休曠蕩，須臾懈怠見參差。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 151
        "line_end": 154
    "translation_ja": |-
      経にいう「安泰が極まれば、また行き詰まりが生じる」。よい境遇で凶事にあうことは、確かにある。
      美しい灯を愛でて禅の心が乱れ、景色を楽しんで道を求める心が薄れる。
      大丹（だいたん）は古くから、長く守り続けるべきもの。一度失えば、ついには損なわれる。
      固く閉じ、しっかりつなぎ、放ち散らしてはならぬ。ひとときでも怠れば、狂いが生じる。
    "translation_status": "reviewed"
  - "id": "xy-ch92-021"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且不言他三眾得命回寺。卻表斗木獬、奎木狼二星官駕雲直向東北艮方趕妖怪來，二人在那半空中尋看不見。直到西洋大海，遠望見孫大聖在海上吆喝。他兩個按落雲頭道：「大聖，妖怪那裡去了？」行者恨道：「你兩個怎麼不來追降？這會子卻冒冒失失的問甚？」斗木獬道：「我見大聖與井、角二星戰敗妖魔追趕，料必擒拿。我二人卻就掃蕩群精，入玄英洞救出你師父、師弟。搜了山，燒了洞，把你師父付托與你二弟，領回府城慈雲寺。多時不見車駕回轉，故又追尋到此也。」行者聞言，方才喜謝道：「如此，卻是有功，多累，多累。但那三個妖魔被我趕到此間，他就鑽下海去。當有井、角二星緊緊追拿，教老孫在岸邊抵擋。你兩個既來，且在岸邊把截，等老孫也再去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      三人が命を取り留めて寺へ戻る話は、しばらくおこう。さて、斗木獬と奎木狼は雲に乗り、まっすぐ東北の艮の方角へ妖怪を追った。二人で空から探しても見つからず、西洋大海（せいようたいかい）へ着くと、遠くで悟空が海の上に立ち、声を上げているのが見えた。二人は雲を下ろして尋ねた。
      斗木獬と奎木狼「大聖、妖怪はどこへ行きましたか。」悟空は腹を立てて言った。
      悟空「お前たちは、どうして追って捕まえに来なかった？　今ごろ、のこのこ来て何を聞くんだ！」
      斗木獬「大聖が井木犴と角木蛟を連れて妖魔を負かし、追われるのを見たので、きっと捕らえられると思いました。我々二人はそこで手下どもを一掃し、玄英洞へ入ってお師匠と弟弟子を救い出したのです。山を捜し、洞を焼き、お師匠をお二人の弟弟子にお任せして、府城（ふじょう）の慈雲寺へ連れ帰ってもらいました。ずいぶん待ってもお戻りにならないので、ここまで追って来たのです。」悟空はこれを聞いて初めて喜び、礼を言った。
      悟空「そうだったか。それならお手柄だ。手数をかけたな、ありがとう。だが、あの三匹をここまで追い詰めたところ、海へ潜り込んでしまった。井木犴と角木蛟がぴったり追って捕まえに行き、俺には岸で防いでいろと言ったのだ。お前たちが来たなら、岸を塞いでいてくれ。俺ももう一度行ってこよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch92-022"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，掄著棒，捻著訣，辟開水逕，直入波濤深處，只見那三個妖魔在水底下與井木犴、角木蛟捨死忘生苦鬥哩。他跳近前喊道：「老孫來也。」那妖精抵住二星官，措手不及，正在危難之處，忽聽得行者叫喊，顧殘生，撥轉頭往海心裡飛跑。原來這怪頭上角極能分水，只聞得花花花，沖開明路。這後邊二星官並孫大聖並力追之。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      さすが悟空、棒を振るい、指で印を結び、水に道を開いて、波の奥深くへまっすぐ入った。見ると三大王が水底で、井木犴と角木蛟を相手に生死を忘れて戦っていた。悟空はそばへ跳び寄って叫んだ。
      悟空「俺が来たぞ！」三大王は二人の星官を食い止めるだけで手いっぱいで、危ないところだった。そこへ悟空の声を聞くと、残る命を惜しみ、向きを変えて海の中心へ飛ぶように逃げた。もともとこの妖怪の頭の角には、水をよく分ける力があった。ざあざあと水を押しのけ、はっきりと道を開く。その後を二星と悟空が力を合わせて追った。
    "translation_status": "reviewed"
  - "id": "xy-ch92-023"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說西海中有個探海的夜叉、巡海的介士，遠見犀牛分開水勢，又認得孫大聖與二天星，即赴水晶宮對龍王慌慌張張報道：「大王，有三隻犀牛，被齊天大聖和二位天星趕來也。」老龍王敖順聽言，即喚太子摩昂：「快點水兵，想是犀牛精辟寒、辟暑、辟塵兒三個惹了孫行者，今既至海，快快拔刀相助。」敖摩昂得令，即忙點兵。頃刻間，龜鱉黿鼉、鯁鮊鱖鯉與蝦兵蟹卒等各執槍刀，一齊吶喊，騰出水晶宮外，擋住犀牛精。犀牛精不能前進，急退後，又有井、角二星並大聖攔阻。慌得他失了群，各各逃生，四散奔走，早把個辟塵兒被老龍王領兵圍住。孫大聖見了心歡，叫道：「消停，消停，捉活的，不要死的。」摩昂聽令，一擁上前，將辟塵兒扳翻在地，用鐵鉤子穿了鼻，攢蹄綑倒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      さて、西海（さいかい）には、海を探る夜叉（やしゃ）と、海を巡る介士（かいし）がいた。遠くから犀が水を分けて来るのを見て、さらに悟空と二人の天の星官だと見分けると、すぐ水晶宮（すいしょうきゅう）へ赴き、慌てふためいて竜王へ報告した。
      夜叉と介士「大王、三頭の犀が、斉天大聖と二人の天の星官に追われて来ます！」西海の老竜王、敖順（ごうじゅん）はこれを聞き、ただちに太子の摩昂（まこう）を呼んだ。
      西海竜王（さいかいりゅうおう）「急いで水軍を集めよ。おそらく犀の妖怪の辟寒・辟暑・辟塵の三人が、孫行者（そんぎょうじゃ）を怒らせたのだろう。もう海へ来たからには、早く刀を抜いて加勢してさしあげよ。」摩昂は命を受けると、急いで兵を集めた。たちまち亀、スッポン、大スッポン、ワニ、鯁（こう）、鮊（はく）、鱖（けい）、鯉、そしてエビやカニの兵が、各々槍や刀を手に、一斉にときの声を上げて水晶宮から飛び出し、犀の妖怪たちを阻んだ。三大王は前へ進めず、急いで退こうとすると、後ろにも井木犴と角木蛟、そして悟空が立ちはだかっていた。慌ててばらばらになり、それぞれ逃げようと四散したが、早くも辟塵大王が、西海竜王の率いる兵に囲まれた。悟空はうれしくなって叫んだ。
      悟空「待て、待て！　生け捕りだ。殺してはいかん！」摩昂はその言葉に従い、皆と一斉に押し寄せ、辟塵大王を地にねじ伏せた。鉄の鉤を鼻に通し、四本の蹄を寄せて縛り倒した。
    "translation_status": "reviewed"
  - "id": "xy-ch92-024"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老龍王又傳號令，教分兵趕那兩個，協助二星官擒拿。即時小龍王帥眾前來，只見井木犴現原身，按住辟寒兒，大口小口的啃著吃哩。摩昂高叫道：「井宿，井宿，莫咬死他，孫大聖要活的，不要死的哩。」連喊數喊，已是被他把頸項咬斷了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      西海竜王はさらに命令を出し、兵を分けて残る二頭を追い、二星の捕縛を助けさせた。摩昂がすぐ兵を率いて進むと、井木犴が本来の姿に戻り、辟寒大王を押さえつけ、大口、小口と、かじって食べているではないか。摩昂は大声で呼んだ。
      摩昂「井宿、井宿、噛み殺してはいけません！　孫大聖は生け捕りをお望みで、死体は要らないとおっしゃいました！」何度も続けて叫んだが、すでに首を噛み切られていた。
    "translation_status": "reviewed"
  - "id": "xy-ch92-025"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "摩昂吩咐蝦兵蟹卒，將個死犀牛擡轉水晶宮，卻又與井木犴向前追趕。只見角木蛟把那辟暑兒倒趕回來，只撞著井宿。摩昂帥龜鱉黿鼉，撒開簸箕陣圍住。那怪只教：「饒命，饒命。」井木犴走近前，一把揪住耳朵，奪了他的刀，叫道：「不殺你，不殺你，拿與孫大聖發落去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      摩昂はエビやカニの兵に、死んだ犀を水晶宮へ担いで戻るよう言いつけ、自分はまた井木犴とともに追いかけた。すると角木蛟が辟暑大王をこちらへ追い返してきて、辟暑大王はちょうど井木犴とぶつかった。摩昂は亀、スッポン、大スッポン、ワニを率い、箕（み）のように広がる陣を敷いて包囲した。辟暑大王はただ、
      辟暑大王「命だけは、命だけは助けてくれ！」と叫ぶ。井木犴は近寄り、耳をひっつかんで刀を奪い、
      井木犴「殺しはしない、殺しはしない。孫大聖のところへ連れていって、処分してもらうぞ。」と言った。
    "translation_status": "reviewed"
  - "id": "xy-ch92-026"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當即倒干戈，復至水晶宮外，報道：「都捉來也。」行者見一個斷了頭，血淋淋的，倒在地下。一個被井木犴揪著耳朵，推跪在地。近前仔細看了道：「這頭不是兵刀傷的啊。」摩昂笑道：「不是我喊得緊，連身子都著井星官吃了。」行者道：「既是如此，也罷，取鋸子來，鋸下他的這兩隻角，剝了皮帶去。犀牛肉還留與龍王賢父子享之。」又把辟塵兒穿了鼻，教角木蛟牽著；辟暑兒也穿了鼻，教井木犴牽著：「帶他上金平府見那刺史官，明究其由，問他個積年假佛害民，然後的決。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      そこで武器を引き、水晶宮の外へ戻って報告した。
      一行「全部捕らえて来ました！」悟空が見ると、一頭は首がちぎれ、血まみれで地に倒れ、もう一頭は井木犴に耳をつかまれ、地にひざまずかされていた。悟空は近寄ってよく見た。
      悟空「この首の傷は、刀でやったものではないな。」摩昂は笑った。
      摩昂「私が必死に叫ばなければ、胴体まで井星官（せいせいかん）に食べられていましたよ。」
      悟空「そういうことなら、まあ仕方がない。鋸を持ってきて、こいつの二本の角を切り落とし、皮を剥いで持っていこう。犀の肉はここへ残し、竜王どの父子に召し上がっていただこう。」さらに辟塵大王の鼻に穴をあけ、角木蛟に引かせた。辟暑大王の鼻にも穴をあけ、井木犴に引かせて、
      悟空「こいつらを金平府の刺史（しし）のところへ連れていき、事情をはっきり調べよう。長年、仏を装って民を苦しめた罪を問い、そのうえで処刑するのだ。」と言った。
    "translation_status": "reviewed"
  - "id": "xy-ch92-027"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾等遵言，辭龍王父子，都出西海。牽著犀牛，會著奎、斗二星，駕雲霧，徑轉金平府。行者足踏祥光，半空中叫道：「金平府刺史、各佐貳郎官並府城內外軍民人等聽著：吾乃東土大唐差往西天取經的聖僧。你這府縣，每年家供獻金燈，假充諸佛降祥者，即此犀牛之怪。我等過此，因元夜觀燈，見這怪將燈油並我師父攝去，是我請天神收伏。今已掃清山洞，剿盡妖魔，不得為害。以後你府縣再不可供獻金燈，勞民傷財也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      皆はその言葉に従い、西海竜王父子に別れを告げ、そろって西海を出た。犀を引き、奎木狼と斗木獬に合流すると、雲や霧に乗って、まっすぐ金平府へ帰った。悟空はめでたい光を踏み、空から呼びかけた。
      悟空「金平府の刺史、補佐役の役人たち、そして府城の内外の軍人、民よ、聞け。俺は東土（とうど）の大唐（だいとう）から、西天（さいてん）へ経を取りに遣わされた聖僧だ。この府と県が毎年供える金の灯に、仏がめでたいしるしを示して降りてくると称していたのは、この犀の妖怪である。俺たちがここを通り、元宵の夜に灯を見ていると、こいつらが灯油と師匠をさらっていったので、俺が天の神々を頼んで降したのだ。今や山の洞を一掃し、妖魔を残らず討ち、害をなせなくした。今後、この府と県は二度と金の灯を供え、民を苦しめ、財を浪費してはならぬ！」
    "translation_status": "reviewed"
  - "id": "xy-ch92-028"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那慈雲寺裡，八戒、沙僧方保唐僧進得山門，只聽見行者在半空言語，即便撇了師父，丟下擔子，縱風雲起到空中，問行者降妖之事。行者道：「那一隻被井星咬死，已鋸角剝皮帶來；兩隻活拿在此。」八戒道：「這兩個索性推下此城，與官員人等看看，也認得我們是聖是神。左右累四位星官收雲下地，同到府堂，將這怪的決。已此情真罪當，再有甚講？」四星道：「天蓬帥近來知理明律，卻好呀。」八戒道：「因做了這幾年和尚，也略學得些兒。」眾神果推落犀牛，一簇彩雲，降至府堂之上。諕得這府縣官員、城裡城外人等，都家家設香案，戶戶拜天神。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      慈雲寺では、八戒と沙悟浄が三蔵を守り、山門へ入ったばかりだった。空から悟空の声が聞こえると、二人は師を置き去りにし、荷物を放り出して風と雲に乗り、上空へ行って妖怪退治の次第を尋ねた。
      悟空「一頭は井星官が噛み殺した。角を切り、皮を剥いで持って来た。あとの二頭はここに生け捕りにしてある。」
      八戒「この二頭はいっそ城へ突き落とし、役人たちにも見せて、俺たちが聖者や神だと分からせてやろう。どうせなら四人の星官にもひと手間かけてもらい、雲を収めて地上へ下り、一緒に府の役所へ行って、こいつらを処刑しよう。事実はもう明らかで、その罪に相当するのだから、これ以上何を言うことがある？」
      四木禽星「天蓬帥（てんぽうすい）は近ごろ道理も法律もお分かりになって、結構なことですな。」
      八戒「ここ数年、坊主をやっているおかげで、少しばかり学びましたよ。」神々は本当に犀を押し落とし、一群の彩雲に乗って府の役所へ降りた。府と県の役人たちも、城内外の人々も仰天し、家々で香をたく台を設け、こぞって天の神々を拝んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch92-029"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少時間，慈雲寺僧把長老用轎擡進府門，會著行者，口中不離「謝」字道：「有勞上宿星官救出我等。因不見賢徒，懸懸在念，今幸得勝而回。然此怪不知趕向何方才捕獲也？」行者道：「自前日別了尊師，老孫上天查訪，蒙太白金星識得妖魔是犀牛，指示請四木禽星。當時奏聞玉帝，蒙旨差委，直至洞口交戰，妖王走了。又蒙斗、奎二宿救出尊師。老孫與井、角二宿並力追妖，直趕到西洋大海，又虧龍王遣子帥兵相助，所以捕獲到此審究也。」長老讚揚稱謝不已。又見那府縣正官並佐貳首領，都在那裡高燒寶燭，滿斗焚香，朝上禮拜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      しばらくすると、慈雲寺の僧たちが三蔵を輿（こし）に乗せて府の門へ運び入れた。三蔵は悟空に会うと、何度も礼を言いながら語った。
      三蔵「尊い星官の皆さまには、お手数をかけて私たちをお救いいただきました。だが、お前の姿が見えないので、ずっと気にかかっていたのです。幸い勝って戻ってくれた。いったい、あの妖怪をどこまで追って捕らえたのですか。」
      悟空「先日、お師匠さまと別れてから天へ上り、素性を調べました。太白金星が犀の妖怪だと見抜き、四木禽星を頼むよう教えてくださったので、すぐに玉帝へ奏上し、勅命をいただいて遣わしてもらいました。洞の前へ行って戦うと、三大王は逃げました。その間に斗木獬と奎木狼が、お師匠さまを助け出してくださったのです。俺は井木犴と角木蛟と力を合わせて妖怪を追い、はるか西洋大海まで追い詰めました。さらに竜王が太子に兵を率いさせて助けてくださったおかげで捕らえ、ここへ連れてきて調べることになったのです。」三蔵は称賛し、礼を言い続けた。見ると、府と県の長官も、補佐役や下役の頭たちも、立派な蝋燭を高くともして香をいっぱいにたき、上に向かって拝んでいた。
    "translation_status": "reviewed"
  - "id": "xy-ch92-030"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃間，八戒發起性來，掣出戒刀，將辟塵兒頭一刀砍下，又一刀把辟暑兒頭也砍下。隨即取鋸子鋸下四隻角來。孫大聖更有主張：就教四位星官將此四隻犀角拿上界去，進貢玉帝，回繳聖旨。把自己帶來的二隻，留一隻在府堂鎮庫，以作向後免徵燈油之證；自己帶一隻去，獻靈山佛祖。四星心中大喜。即時拜別大聖，忽駕彩雲回奏而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 170
        "line_end": 170
    "translation_ja": "ほどなく八戒がかっとなり、戒刀（かいとう）を引き抜いて辟塵大王の首を一刀で斬り落とし、もう一刀で辟暑大王の首も斬り落とした。続いて鋸を取り、四本の角を切り落とした。悟空にはさらに考えがあった。この四本の犀角（さいかく）は四人の星官に天界へ持っていってもらい、玉帝へ献上し、聖旨を果たした報告をさせることにした。自分が持ってきた二本のうち一本は府の役所に残し、倉の守りとして、今後、灯油を取り立てない証拠にする。残る一本は自分が持ち、霊山（れいざん）の仏祖へ献上することにした。四星はたいへん喜び、ただちに悟空に別れを告げ、さっと彩雲に乗って復命に帰った。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-031"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "府縣官留住他師徒四眾，大排素宴，遍請鄉官陪奉。一壁廂出給告示，曉諭軍民人等，下年不許點設金燈，永蠲買油大戶之役。一壁廂叫屠子宰剝，犀牛之皮硝熟燻乾，製造鎧甲；把肉普給官員人等。又一壁廂動支枉罰無礙錢糧，買民間空地，起建四星降妖之廟，又為唐僧四眾建立生祠，各各樹碑刻文，用傳千古，以為報謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 171
        "line_end": 171
    "translation_ja": "府と県の役人は師弟四人を引き留め、大いに精進の宴を開き、土地の官人たちを広く招いてもてなした。一方では告示を出し、軍人や民たちに、翌年から金の灯をともして供えてはならず、油を買い入れる大戸（たいこ）の負担を永久に免除すると知らせた。また一方では屠殺人に解体と皮剥ぎをさせ、犀の皮を硝（しょう）でなめしていぶし乾かし、鎧を作らせ、肉は役人たちへ広く配った。さらに、不当な罰金や、差し支えなく使える公金を支出し、民間の空き地を買って四星の妖怪退治を祀る廟を建て、三蔵ら四人にも生祠（せいし）を建てた。それぞれ碑を立てて文を刻み、千年の後まで伝えて、感謝のしるしとしたのである。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-032"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們索性寬懷領受。又被那二百四十家燈油大戶這家酬，那家請，略無虛刻。八戒遂心滿意受用，把洞裡搜來的寶物，每樣各籠些須在袖，以為各家齋筵之賞。住經個月，猶不得起身。長老吩咐：「悟空，將餘剩的寶物盡送慈雲寺僧，以為酬禮。瞞著那些大戶人家，天不明走罷。恐只管貪樂，誤了取經，惹佛祖見罪，又生災厄，深為不便。」行者隨將前件一一處分。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      師弟たちもすっかり心を緩め、もてなしを受けた。さらに、灯油を負担していた二百四十軒の大戸が、こちらの家で礼をし、あちらの家で招くので、少しも暇がなかった。八戒は思いどおりに腹いっぱい楽しみ、洞から集めてきた宝物を、種類ごとに少しずつ袖へ入れ、各家の精進料理のお礼に渡した。一か月も滞在したのに、まだ旅立てなかった。三蔵は言いつけた。
      三蔵「悟空、余った宝物はすべて慈雲寺の僧たちに、お礼として渡しなさい。大戸の家々には知らせず、夜が明ける前に出ましょう。楽しみにかまけて取経を遅らせ、仏祖のお咎めを受け、また災難が起きては、まことに困ります。」悟空は、そのとおりに一つずつ手配した。
    "translation_status": "reviewed"
  - "id": "xy-ch92-033"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日五更早起，喚八戒備馬。那獃子吃了自在酒飯，睡得夢夢乍道：「這早備馬怎的？」行者喝道：「師父教走路哩。」獃子抹抹臉道：「又是這長老沒正經。二百四十家大戶都請，才吃了有三十幾頓飽齋，怎麼又弄老豬忍餓？」長老聽言罵道：「饢糟的夯貨，莫胡說，快早起來；再若強嘴，教悟空拿金箍棒打牙。」那獃子聽見說打，慌了手腳道：「師父今番變了：常時疼我愛我，念我蠢夯護我，哥要打時，他又勸解；今日怎麼發狠轉教打麼？」行者道：「師父怪你為嘴，誤了路程。快早收拾行李，備馬，免打！」那獃子真個怕打，跳起來穿了衣服，吆喝沙僧：「快起來，打將來了。」沙僧也隨跳起，各各收拾皆完。長老搖手道：「寂寂悄悄的，不要驚動寺僧。」連忙上馬開了山門，找路而去。這一去，正所謂："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      翌日、五更（ごこう）に早く起き、八戒を呼んで馬の支度をさせた。気楽に酒や飯を楽しんでいた八戒は、眠り込んで寝ぼけたまま言った。
      八戒「こんなに早く、馬の支度をしてどうするんだよ。」悟空は怒鳴った。
      悟空「お師匠さまが出発するとおっしゃってるんだ！」八戒は顔をぬぐった。
      八戒「またこの長老の気まぐれか。二百四十軒の大戸が皆招いてくれるのに、まだ三十数回、腹いっぱい精進料理を食っただけじゃないか。なんでまた俺を飢えさせるんだ。」三蔵はこれを聞きつけて叱った。
      三蔵「穀潰しのうすのろめ、ばかなことを言わず、早く起きなさい。まだ口答えするなら、悟空に金箍棒（きんこぼう）で歯を打たせますよ。」殴られると聞くと、八戒は慌てた。
      八戒「お師匠さまは、今度ばかりは変わっちまった。いつもは俺をかわいがって、のろまだからと守ってくださり、兄貴が殴ろうとすると止めてくださるのに。今日はなぜそんなに怒って、逆に殴れとおっしゃるんです？」
      悟空「お師匠さまは、お前が食い気のために旅を遅らせるのを怒っているんだ。早く荷物をまとめ、馬の支度をしろ。そうすれば殴られずに済むぞ！」八戒は本当に殴られるのが怖く、跳ね起きて服を着ると、沙悟浄を怒鳴った。
      八戒「早く起きろ、殴られるぞ！」沙悟浄もすぐ跳ね起き、それぞれ支度をすべて整えた。三蔵は手で制した。
      三蔵「静かに、そっと。寺の僧たちを起こしてはなりません。」急いで馬に乗り、山門を開け、道を探して立ち去った。この出立は、まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch92-034"

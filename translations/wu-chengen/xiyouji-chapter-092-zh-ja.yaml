    "source_text": "好大聖，早至西天門外。忽見太白金星與增長天王、殷、朱、陶、許四大靈官講話。他見行者來，都慌忙施禮道：「大聖那裡去？」行者道：「因保唐僧行至天竺國東界金平府旻天縣，我師被本縣慈雲寺僧留賞元宵。比至金燈橋，有金燈三盞，點燈用酥合香油，價貴白金五萬餘兩，年年有諸佛降祥受用。正看時，果有三尊佛像降臨。我師不識好歹，上橋就拜。我說不是好人，早被他侮暗燈光，連油並我師一風攝去。我隨風追襲，至天曉，到一山，幸四功曹報道：那山名青龍山，山有玄英洞。洞有三怪，名辟寒大王、辟暑大王、辟塵大王。老孫急上門尋討，與他賭鬥一陣，未勝。是我變化入裡，見師父鎖住未傷，隨解了欲出，又被他知覺，我遂走了。後又同八戒、沙僧苦戰，復被他將二人也捉去綑了。老孫因此特啟玉帝，查他來歷，請命將降之。」金星呵呵冷笑道：「大聖既與妖怪相持，豈看不出他的出處？」行者道：「認得，認得，是一夥牛精。只是他大有神通，急不能降也。」金星道：「那是三個犀牛之精。他因有天文之象，累年修悟成真，亦能飛雲步霧。其怪極愛乾淨，常嫌自己影身，每欲下水洗浴。他的名色也多：有兕犀，有雄犀，有牯犀，有斑犀，又有胡冒犀、墮羅犀、通天花文犀。都是一孔三毛二角，行於江海之中，能開水道。似那辟寒、辟暑、辟塵都是角有貴氣，故以此為名而稱大王也。若要拿他，只是四木禽星見面就伏。」行者連忙唱喏問道：「是那四木禽星？煩長庚老一一明示明示。」金星笑道：「此星在斗牛宮外，羅佈乾坤。你去奏聞玉帝，便見分明。」行者拱拱手稱謝，徑入天門裡去。"

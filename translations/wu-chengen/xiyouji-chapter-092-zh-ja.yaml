  "known_gaps":
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-011"
      "description_ja": "原文は「藤紇䌋」「藤條節懞」「扢撻藤條」と表記する。藤の棒の節・こぶを言い表すものと解したが、「節懞」などの細かな字義・用字は未確定。原文欄はこれらの字をそのまま保存している。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-012"
      "description_ja": "原文の「發喊\U00021143聲」は、群がる牛の妖怪が声を張り上げる文脈として訳した。珍字「\U00021143」を他字に校訂していない。同じ段落の「躘踵」も、引かれて足元が乱れ、起き上がれない動作として解している。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-014"
      "description_ja": "犀の名称・性質は太白金星の説明である。「一孔三毛」は一つの毛穴から三本の毛が出るという古い犀の記述と読んだ。兕犀以下の七名は、現代動物学の七種と同一視せず、原表記と列挙を保持した。胡冒犀は古書に見える胡帽犀との関係が考えられるが、本文を帽へ改めていない。「天文之象」も天に関わる文様を備える意と解したが、具体的な対応は確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-019"
      "description_ja": "底本は「琚、寶貝」と区切る。琚は身に着ける玉の飾りと解し、「寶貝」はここでは宝物と訳した。別の翻刻には「\U0002496D琚寶貝」という文字列も見えるが、その字や区切りを本底本へ補わず、貝の特定種にも断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-023"
      "description_ja": "水族の兵として挙げられた魚の名は、元の四字をそれぞれ保った。鯁の種は未確定で、鮊・鱖も現代の一種へ無条件に限定しない。先の亀・スッポン・大スッポン・ワニは、原文の龜・鱉・黿・鼉をそれぞれ訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-029"
      "description_ja": "原文は「前日」。前のある日を指す「先日」と訳し、暦の何日前かを固定しない。夜襲、天界への往復、追跡について、先の「這一日」などとの時間のつながりには揺れがある。道中に日数を追加して調整してはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch92-1455641"
      "segment_ids":
        - "xy-ch92-031"
      "description_ja": "原文は「枉罰無礙錢糧」。「枉罰」を不当な罰金、「無礙錢糧」を他の用途に差し支えなく支出できる公金と読むが、語の切り方と財政上の厳密な内訳は確定しない。善政として整えるために「枉」の否定的な意味を落とさず、原文欄も改めていない。 原文の欠落ではなく、解釈・校訂上の留保。"

    "source_text": "四木道：「大聖不必遲疑，你先去索戰，引他出來，我們隨後動手。」行者即近前罵道：「偷油的賊怪！還我師來。」原來那門被八戒築破，幾個小妖弄了幾塊板兒搪住。在裡邊聽得罵詈，急跑進報道：「大王，孫和尚在外面罵哩。！」辟塵兒道：「他敗陣去了，這一日怎麼又來？想是那裡求些救兵來了。」辟寒、辟暑道：「怕他甚麼救兵？快取披掛來。小的們都要用心圍繞，休放他走了。」那夥精不知死活，一個個各執槍刀，搖旗擂鼓，走出洞來，對行者喝道：「你個不怕打的猢猻兒，你又來了。」行者最惱得是這「猢猻」二字，咬牙發狠，舉鐵棒就打。三個妖王調小妖，跑個圈子陣，把行者圈在垓心。那壁廂四木禽星一個個各掄兵刃道：「孽畜！休動手。」那三個妖王看他四星，自然害怕，俱道：「不好了，不好了，他尋將降手兒來了。小的們，各顧性命走耶。」只聽得呼呼吼吼，喘喘呵呵，眾小妖都現了本身，原來是那山牛精、水牛精、黃牛精，滿山亂跑。那三個妖王，也現了本相，放下手來，還是四隻蹄子，就如鐵炮一般，徑往東北上跑。這大聖帥井木犴、角木蛟緊追急趕，略不放鬆。惟有斗木獬、奎木狼在東山凹裡、山頭上、山澗中、山谷內，把些牛精打死的、活捉的，盡皆收淨。卻向玄英洞裡解了唐僧、八戒、沙僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"

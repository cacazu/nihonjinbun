    "translation_ja": |-
      四木禽星「大聖、ためらうことはありません。先に戦いを挑んで、敵を引き出してください。我々が後に続いて仕掛けます。」悟空はすぐ近くへ行って罵った。
      悟空「油泥棒の妖怪め！　師匠を返せ！」先の門は八戒に壊されたので、何匹かの小妖が板切れを何枚か持ってきてふさいでいた。中で罵声を聞くと、急いで奥へ走って報告した。
      小妖たち「大王、孫の坊主が外で罵っています！」
      辟塵大王「負けて逃げたのに、この日のうちにまた来るとは。どこかで援軍を頼んできたのだろう。」
      辟寒大王と辟暑大王「どんな援軍が来ようと、怖いものか。早く鎧を持て。小ども、しっかり取り囲んで、逃がすなよ。」妖怪どもは命知らずにも、それぞれ槍や刀を手に、旗を振り太鼓を打って洞から出てきて、悟空を怒鳴りつけた。
      妖怪たち「この殴られても懲りない猿め、また来たか！」悟空は「猿」と呼ばれるのが何より腹立たしかった。歯を食いしばり、怒りに任せて鉄棒で打ちかかった。三大王は手下を動かして円陣を作り、悟空を真ん中へ囲み込んだ。そこへ四木禽星が各々武器を振りかざして現れ、
      四木禽星「畜生ども、手を出すな！」と叫んだ。三大王は四星を見ると、おのずと恐怖に駆られ、口々に叫んだ。
      三大王「まずい、まずい！　こいつ、俺たちを降せる相手を探して来やがった。小ども、各自、命を守って逃げろ！」ただ、ふうふう、ごうごうとほえ、はあはあと息をつく音が響き、手下たちは皆、本来の姿を現した。正体は山牛や水牛や黄牛の妖怪で、山じゅうを逃げ回った。三大王も元の姿を現し、手を地につくと、やはり四本の蹄になり、鉄砲玉のように東北へ走った。悟空は井木犴と角木蛟を率い、少しも緩めず追いかけた。一方、斗木獬と奎木狼は、東の山のくぼみ、峰、渓流、谷の中で牛の妖怪どもを打ち殺し、あるいは生け捕りにして、一匹残らず片づけた。そして玄英洞へ入り、三蔵と八戒、沙悟浄の縛めを解いた。

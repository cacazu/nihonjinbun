    "source_text": "不一時，到於通明殿下，先見葛、丘、張、許四大天師。天師問道：「何往？」行者道：「近行至金平府地方，因我師寬放禪性，元夜觀燈，遇妖魔攝去。老孫不能收降，特來奏聞玉帝求救。」四天師即領行者至靈霄寶殿啟奏，各各禮畢，備言其事。玉帝傳旨：「教點那路天兵相助？」行者奏道：「老孫才到西天門，遇長庚星說：那怪是犀牛成精，惟四木禽星可以降伏。」玉帝即差許天師同行者去斗牛宮點四木禽星下界收降。"

      三人の僧、青竜山で大いに戦い　四星、力を合わせて犀の妖怪を捕らえる
    "translation_status": "reviewed"
  - "id": "xy-ch92-002"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖挾同二弟滾著風，駕著雲，向東北艮地上，頃刻至青龍山玄英洞口，按落雲頭，八戒就欲築門。行者道：「且消停，待我進去看看師父生死如何，再好與他爭持。」沙僧道：「這門閉緊，如何得進？」行者道：「我自有法力。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、悟空（ごくう）は二人の弟弟子とともに風を巻き、雲に乗って東北の艮（ごん）の方角へ向かい、たちまち青竜山（せいりゅうざん）の玄英洞（げんえいどう）の前へ着いて、雲を下ろした。八戒（はっかい）がさっそく門に熊手を打ち込もうとすると、
      悟空「まあ待て。俺が中へ入り、お師匠さまが生きているかどうかを確かめてから、あいつらと戦おう。」
      沙悟浄（さごじょう）「門は固く閉まっています。どうやって入るのです？」
      悟空「俺には術がある。」
    "translation_status": "reviewed"
  - "id": "xy-ch92-003"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，收了棒，捻著訣，念聲咒語，叫：「變！」即變做個火焰蟲兒，真個也疾伶。你看他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      さすが悟空。棒をしまい、指で印を結んで呪文を唱え、
      悟空「変われ！」と叫ぶと、すぐに一匹の蛍になった。実にすばしこい。その姿といえば、
    "translation_status": "reviewed"
  - "id": "xy-ch92-004"
    "section_id": "chapter-92"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      展翅星流光燦，古云腐草為螢。神通變化不可輕。自有徘徊之性。
      飛近石門懸看，傍邊瑕縫穿風。將身一縱到幽庭。打探妖魔動靜。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 126
        "line_end": 127
    "translation_ja": |-
      翼を広げれば流れ星のように光がきらめき、古くは腐った草が蛍になるという。
      軽く見るなかれ、神通の変化。あたりを飛び回る性質もおのずと備える。
      石門近くへ飛び寄って、宙に浮かんで見定める。脇の隙間には風が通る。
      ひと飛びすれば奥まった庭。妖魔の動静を探るため。
    "translation_status": "reviewed"
  - "id": "xy-ch92-005"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他自飛入，只見幾隻牛橫敧直倒，一個個呼吼如雷，盡皆睡熟了。至中廳裡面，全無消息。四下門戶通關，不知那三個妖精睡在何處。才轉過廳房，向後又照，只聞得啼泣之聲，乃是唐僧鎖在後房簷柱上哭哩。行者暗暗聽他哭甚，只見他哭道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 129
        "line_end": 129
    "translation_ja": "悟空が飛び込むと、何頭かの牛が縦横に寝転がり、どれも雷のようないびきをかいて熟睡していた。中の広間へ行っても物音はなく、四方の戸はすべて閉ざされ、三大王がどこで寝ているのか分からない。広間を回り、さらに奥を照らしてみると、泣き声が聞こえた。三蔵（さんぞう）が奥の部屋の軒柱に鎖でつながれ、泣いていたのである。悟空は何を嘆いているのか、そっと耳を澄ませた。三蔵はこう泣いていた。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-006"
    "section_id": "chapter-92"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「一別長安十數年，登山涉水苦熬煎。
      幸來西域逢佳節，喜到金平遇上元。
      不識燈中假佛像，皆因命裡有災愆。
      賢徒追襲施威武，但願英雄展大權。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 130
        "line_end": 133
    "translation_ja": |-
      三蔵「長安（ちょうあん）を離れて十数年、山を登り川を渡り、苦しみに耐えてきた。
      幸い西域（さいいき）へ来てめでたい節にあい、喜びのうちに金平（きんぺい）で上元（じょうげん）を迎えた。
      灯の中の偽の仏を見抜けなかったのも、わが運命に災いがあるためだ。
      頼もしい弟子は追いかけて武威を振るう。どうか英雄の大いなる力を示しておくれ。」
    "translation_status": "reviewed"
  - "id": "xy-ch92-007"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，滿心歡喜，展開翅，飛近師前。唐僧揩淚道：「呀！西方景象不同，此時正月，蟄蟲始振，為何就有螢飛？」行者忍不住，叫聲：「師父，我來了。」唐僧喜道：「悟空，我說正月間怎得螢火？原來是你。」行者即現了本相道：「師父啊，為你不識真假，誤了多少路程，費了多少心力。我一行說不是好人，你就下拜，卻被這怪侮暗燈光，盜取酥合香油，連你都攝將來了。我當吩咐八戒、沙僧回寺看守，我即聞風追至此間，不識地名。幸遇四值功曹傳報，說此山名青龍山玄英洞。我日間與此怪鬥至天晚方回，與師弟輩細道此情，卻就不曾睡，同他兩個來此。我恐夜深不便交戰，又不知師父下落，所以變化進來，打聽打聽。」唐僧喜道：「八戒、沙僧如今在外邊哩？」行者道：「在外邊。方才老孫看時，妖精都睡著。我且解了鎖，搠開門，帶你出去罷。」唐僧點頭稱謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      これを聞いた悟空はうれしくなり、翼を広げて師のそばへ飛んだ。三蔵は涙をぬぐって言った。
      三蔵「おや、西方では様子が違うのだな。今は正月、冬ごもりの虫が動き始めるころなのに、どうしてもう蛍が飛ぶのだろう。」悟空はこらえきれず、
      悟空「お師匠さま、来ましたよ。」と声を上げた。三蔵は喜んだ。
      三蔵「悟空、正月に蛍とはおかしいと思ったが、お前だったのか。」悟空は本来の姿に戻って言った。
      悟空「お師匠さま、あなたが本物と偽物を見分けられないために、どれほど旅が遅れ、どれほど苦労を費やしたことでしょう。私は、まともな連中ではないと言い続けたのに、あなたは拝んでしまった。そこであの妖怪は灯を暗くし、酥合香油（そごうこうゆ）を盗み、あなたまでさらって来たのです。私は八戒と沙悟浄に寺へ戻って番をするよう言いつけ、その風を頼りにここまで追って来ましたが、地名が分かりませんでした。幸い、四値功曹（しちこうそう）が知らせに来て、青竜山の玄英洞だと教えてくれました。昼間はこの妖怪と日暮れまで戦ってから帰り、弟弟子たちに詳しく話しました。そして眠らずに、二人とここへ来たのです。夜が深くて戦いにくいうえ、あなたの居場所も分からないので、姿を変えて入り、様子を探っていたのです。」三蔵は喜んで尋ねた。
      三蔵「では、八戒と沙悟浄は今、外にいるのか。」
      悟空「外にいます。さっき見たところ、妖怪どもは皆寝ています。まず錠を外し、門を押し開けて、お連れしましょう。」三蔵はうなずいて礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch92-008"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者使個解鎖法，用手一抹，那鎖早自開了。領著師父往前正走，忽聽得妖王在中廳內房裡叫道：「小的們，緊閉門戶，小心火燭。這會怎麼不叫更巡邏，梆鈴都不響了？」原來那夥小妖征戰一日，俱辛辛苦苦睡著，聽見叫喚，卻才醒了，梆鈴響處，有幾個執器械的敲著鑼，從後而走，可可的撞著他師徒兩個。眾小妖一齊喊道：「好和尚啊，扭開鎖往那裡去？」行者不容分說，掣出棒幌一幌，碗來粗細，就打，棒起處，打死兩個。其餘的丟了器械，近中廳，打著門叫：「大王，不好了，不好了，毛臉和尚在家裡打殺人了。」那三怪聽見，一轂轆爬將起來，只教「拿住，拿住。」諕得個唐僧手軟腳軟。行者也不顧師父，一路棒，滾向前來。眾小妖遮架不住，被他放倒三兩個，推倒兩三個。打開幾層門，徑自出來，叫道：「兄弟們何在？」八戒、沙僧正舉著鈀、杖等待，道：「哥哥，如何了？」行者將變化入裡解放師父，正走，被妖驚覺，顧不得師父，打出來的事，講說一遍不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      悟空が解錠の術を使って手でひとなですると、錠はひとりでに開いた。師を連れて前へ進んでいたところ、中の広間の内室から、三大王の一人が叫ぶのが聞こえた。
      三大王の一人「小ども、戸締まりをしっかりしろ。火の用心も怠るな。今はなぜ時を知らせて巡回しない？　拍子木も鈴も鳴らんぞ。」手下たちは一日戦って疲れきり、皆眠り込んでいたが、呼び声でようやく目を覚ました。拍子木と鈴が鳴り、武器を持った何人かが銅鑼をたたいて奥から出てきて、折悪しく師弟二人に出くわした。小妖たちは一斉に叫んだ。
      小妖たち「こら坊主、錠をこじ開けてどこへ行く！」悟空は有無を言わせず、棒を引き抜いてひと振りし、椀ほどの太さにして打ちかかった。棒が振り下ろされ、二人が打ち殺された。残りは武器を捨てて中の広間へ走り、戸をたたいて叫んだ。
      小妖たち「大王、大変です、大変です！　毛むくじゃらの坊主が中で人を殺しています！」三大王はこれを聞くなり跳ね起き、
      三大王「捕まえろ、捕まえろ！」と命じた。三蔵はおびえきって手足がなえた。悟空も師をかまうどころではなくなり、棒を振り回しながら前へ突き進んだ。手下たちは防ぎきれず、二、三人を打ち倒され、また二、三人を押し倒された。悟空は幾重もの門を開き、そのまま外へ出て叫んだ。
      悟空「お前たち、どこだ！」八戒と沙悟浄は熊手と杖を構えて待っており、
      八戒と沙悟浄「兄さん、どうなりました？」と尋ねた。悟空は、変化して中へ入り師を解き放ったものの、連れ出す途中で気づかれ、師にかまっていられず戦って出てきた次第を、一通り話した。さて、この話はここまでとする。
    "translation_status": "reviewed"
  - "id": "xy-ch92-009"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖王把唐僧捉住，依然使鐵索鎖了。執著刀，掄著斧，燈火齊明，問道：「你這廝怎樣開鎖？那猴子如何得進？快早供來，饒你之命；不然，就一刀兩段。」慌得那唐僧戰戰兢兢的跪道：「大王爺爺，我徒弟孫悟空，他會七十二般變化。才變個火焰蟲兒，飛進來救我。不期大王知覺，被小大王等撞見。是我徒弟不知好歹，打傷兩個，眾皆喊叫，舉兵著火，他遂顧不得我，走出去了。」三個妖王呵呵大笑道：「早是驚覺，未曾走了。」叫小的們把前後門緊緊關閉，亦不諠譁。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      三大王は三蔵を捕らえ、また鉄の鎖でつないだ。刀を持ち、斧を振り上げ、灯火を明々とともして尋問した。
      三大王の一人「お前、どうやって錠を開けた？　あの猿はどうして入れた？　早く白状すれば命は助けてやる。そうでなければ、一刀で真っ二つだ。」三蔵は慌てふためき、ぶるぶる震えてひざまずいた。
      三蔵「大王さま、私の弟子の孫悟空（そんごくう）は、七十二通りの変化ができます。今しがた蛍に変わって飛び込み、私を助けに来たのです。思いがけず大王さまがお気づきになり、小大王さまたちに見つかりました。弟子がわきまえもなく二人を傷つけたので、皆さまが声を上げ、武器を取り、火をともされると、私をかまっていられず、外へ逃げ出しました。」三大王は、はははと笑った。
      三大王「早く気づいてよかった。逃げられずに済んだわい。」そして手下に前後の門を固く閉じさせ、騒がなくなった。
    "translation_status": "reviewed"
  - "id": "xy-ch92-010"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧道：「閉門不諠譁，想是暗弄我師父。我們動手耶。」行者道：「說的是，快早打門。」那獃子賣弄神通，舉鈀盡力築去，把那石門築得粉碎，卻又厲聲喊罵道：「偷油的賊怪！快送吾師出來也。」諕得那門內小妖滾將進去，報道：「大王，不好了，不好了，前門被和尚打破了。」三個妖王十分煩惱道：「這廝著實無禮。」即命取披掛結束了，各持兵器，帥小妖出門迎敵。此時約有三更時候，半天中月明如晝。走出來，更不打話，便就掄兵。這裡行者抵住鉞斧，八戒敵住大刀，沙僧迎住大棍。這場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      沙悟浄「門を閉じて物音もしません。ひそかにお師匠さまを手にかけているのかもしれません。こちらから仕掛けましょう。」
      悟空「そうだな。さっさと門を打て。」八戒は神通力をひけらかし、熊手を持ち上げて力いっぱい打ち込み、石門を粉々にした。さらに声を張り上げて罵った。
      八戒「油泥棒の妖怪め！　早く師匠を返せ！」門の内側にいた小妖は震え上がり、転がるように奥へ入って報告した。
      小妖「大王、大変です、大変です！　坊主が前の門を壊しました！」三大王はひどく腹を立てた。
      三大王「なんと無礼な奴だ！」すぐに鎧を持ってこさせて身を固め、それぞれ武器を手に、手下を率いて迎え撃った。そのころは三更（さんこう）ほどで、空の月は昼のように明るかった。出てくるなり言葉も交わさず、武器を振りかざした。こちらは悟空が鉞（まさかり）を受け、八戒が大刀と戦い、沙悟浄が大棒を迎え撃つ。すさまじい戦いだ。
    "translation_status": "reviewed"
  - "id": "xy-ch92-011"
    "section_id": "chapter-92"
    "kind": "verse"
    "origin": "source"
    "source_text": "僧三眾，棍杖鈀，三個妖魔膽氣加。鉞斧鋼刀藤紇䌋，只聞風響並塵沙。初交幾合噴愁霧，次後飛騰散彩霞。釘鈀解數隨身滾，鐵棒英豪更可誇。降妖寶杖人間少，妖怪頑心不讓他。鉞斧口明尖鐏利，藤條節懞一身花。大刀晃亮如門扇，和尚神通偏賽他。這壁廂因師性命發狠打，那壁廂不放唐僧劈臉撾。斧剁棒迎爭勝負，鈀掄刀砍兩交搽。扢撻藤條降怪杖，翻翻覆覆逞豪華。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      三人の僧には棒と杖と熊手、三人の妖魔も勇み立つ。
      鉞と鋼の刀、こぶだらけの藤の棒。風がうなり、砂ぼこりが舞うばかり。
      初めの数合には憂いの霧が噴き、やがて宙へ舞い上がって彩りの霞を散らす。
      熊手の技は体に沿って自在に巡り、鉄棒の勇ましさはいよいよ見事。
      降妖宝杖（ごうようほうじょう）は人の世にもまれ、妖怪の強情さも引けは取らぬ。
      鉞は刃が輝き、尖った石突（いしづき）も鋭い。藤の節くれは全体に模様をなす。
      大刀は戸板のように大きく光り、僧たちの神通はそれをなお上回る。
      こちらは師の命ゆえ、激しく打ちかかり、あちらは三蔵を放さず、顔めがけて殴りつける。
      斧が斬り、棒が受けて勝負を争い、熊手がうなり、刀が斬って入り乱れる。
      こぶのある藤の棒と妖怪を降す杖、幾度も幾度も見事な技を競い合う。
    "translation_status": "reviewed"
  - "id": "xy-ch92-012"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三僧三怪賭鬥多時，不見輸贏。那辟寒大王喊一聲，叫：「小的們上來。」眾精各執兵刃齊來，早把個八戒絆倒在地，被幾個水牛精揪揪扯扯，拖入洞裡綑了。沙僧見沒了八戒，只見那群牛發喊\U00021143聲。即掣寶杖，望辟塵大王虛丟了架子要走。又被群精一擁而來，拉一個躘踵，急掙不起，也被捉去綑了。行者覺道難為，縱觔斗雲，脫身而去。當時把八戒、沙僧拖至唐僧前。唐僧見了，滿眼垂淚道：「可憐你二人也遭了毒手。悟空何在？」沙僧道：「師兄見捉住我們，他就走了。」唐僧道：「他既走了，必然那裡去求救。但我等不知何日方得脫網。」師徒們悽悽慘慘不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      三人の僧と三大王は長く戦ったが、勝負がつかなかった。そこで辟寒大王（へきかんだいおう）が大声で、
      辟寒大王「小ども、かかれ！」と叫んだ。手下たちが各々武器を取って一斉に襲いかかり、早くも八戒は足を取られて地に倒れた。何匹かの水牛の妖怪が八戒をつかんで引きずり、洞へ連れ込んで縛った。沙悟浄は八戒の姿が消えたのを見た。周りには牛どもがわめき立てるばかりだ。そこで宝杖（ほうじょう）を引き、辟塵大王（へきじんだいおう）へ見せかけの一手を繰り出して逃げようとした。だが群がる妖怪どもにまたどっと押し寄せられ、引っ張られてつまずき、急には起き上がれず、こちらも捕まって縛られた。悟空はこれではかなわないと悟り、筋斗雲（きんとうん）に跳び乗って逃れた。
      八戒と沙悟浄は三蔵の前へ引きずり出された。三蔵は涙をいっぱいにためて言った。
      三蔵「気の毒に、お前たちまで毒牙にかかったか。悟空はどこだ？」
      沙悟浄「兄さんは私たちが捕らえられるのを見ると、逃げていきました。」
      三蔵「逃げたのなら、きっとどこかへ助けを求めに行ったのだろう。ただ、私たちはいつこの網から逃れられるのか。」師弟たちは悲嘆に暮れたが、ひとまずおいておこう。
    "translation_status": "reviewed"
  - "id": "xy-ch92-013"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者駕觔斗雲復至慈雲寺，寺僧接著，來問：「唐老爺救得否？」行者道：「難救，難救。那妖精神通廣大，我弟兄三個與他三人鬥了多時，被他呼小妖先捉了八戒，後捉了沙僧，老孫幸走脫了。」眾僧害怕道：「爺爺這般會騰雲駕霧，還捉獲不得，想老師父被傾害也。」行者道：「不妨，不妨。我師父自有伽藍、揭諦、丁甲等神暗中護佑，卻也曾吃過草還丹，料不傷命。只是那妖精有本事，汝等可好看馬匹、行李，等老孫上天去求救兵來。」眾僧膽怯道：「爺爺又能上天？」行者笑道：「天宮原是我的舊家。當年我做齊天大聖，因為亂了蟠桃會，被我佛收降。如今沒奈何，保唐僧取經，將功折罪，一路上輔正除邪。我師父該有此難，汝等卻不知也。」眾僧聽此言，又磕頭禮拜。行者出得門，打個唿哨，即時不見。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      さて、悟空は筋斗雲に乗り、再び慈雲寺（じうんじ）へ戻った。寺の僧たちが出迎えて尋ねた。
      寺僧たち「唐（とう）の老師さまは救い出せましたか。」
      悟空「難しい、難しい。妖怪どもは大した神通力だ。俺たち三人で奴ら三人と長く戦ったが、手下を呼び出され、まず八戒、次に沙悟浄を捕らえられた。俺だけが運よく逃げたのだ。」僧たちは恐れた。
      寺僧たち「孫さまはこれほど雲や霧に乗る術をお持ちなのに、なお捕らえられないのなら、老師さまは殺されてしまうのではありませんか。」
      悟空「大丈夫、大丈夫。師匠には伽藍（がらん）や掲諦（ぎゃてい）、丁甲（ていこう）などの神々が陰からついているし、草還丹（そうかんたん）を食べたこともある。命まで失いはすまい。ただ、妖怪どもは腕が立つ。お前たちは馬と荷物をよく見張っていてくれ。俺が天へ行き、援軍を頼んで来る。」寺僧たちはおそるおそる言った。
      寺僧たち「孫さまは、天へもお上りになれるのですか。」悟空は笑った。
      悟空「天宮はもともと俺の古巣さ。昔は斉天大聖（せいてんたいせい）だったが、蟠桃会（ばんとうえ）を荒らしたせいで、仏さまに降された。今はやむなく三蔵を守って経を取りに行き、功を立てて罪を償い、道々、正しきを助けて邪悪を除いている。師匠にはこの災難を受ける定めがあったのだ。お前たちには分からんだろうがな。」僧たちはこれを聞くと、また額を地につけて拝んだ。悟空は門を出てひと声口笛を吹き、たちまち姿を消した。

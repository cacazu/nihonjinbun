        "line_end": 176
    "translation_ja": |-
      玉の籠をひそかに開けば、彩りの鳳凰（ほうおう）が飛び去り、
      金の錠をこっそり外せば、蛟竜（こうりゅう）が走り去る。
    "translation_status": "reviewed"
  - "id": "xy-ch92-035"
    "section_id": "chapter-92"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知天明時，酬謝之家端的如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 178
        "line_end": 178
    "translation_ja": "さて、夜が明けたとき、お礼をしようとしていた家々は、いったいどうなったのか。それは次回のお話。"

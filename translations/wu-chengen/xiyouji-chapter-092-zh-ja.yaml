    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵の供述は「打傷兩個」。直前の地の文は悟空が二人を打ち殺したと述べる。話者の報告と語り手の叙述の差を、どちらかへ統一していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-03-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「藤紇䌋」「藤條節懞」「扢撻藤條」と表記する。藤の棒の節・こぶを言い表すものと解したが、「節懞」などの細かな字義・用字は未確定。原文欄はこれらの字をそのまま保存している。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-04-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「發喊\U00021143聲」は、群がる牛の妖怪が声を張り上げる文脈として訳した。珍字「\U00021143」を他字に校訂していない。同じ段落の「躘踵」も、引かれて足元が乱れ、起き上がれない動作として解している。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-05-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "犀の名称・性質は太白金星の説明である。「一孔三毛」は一つの毛穴から三本の毛が出るという古い犀の記述と読んだ。兕犀以下の七名は、現代動物学の七種と同一視せず、原表記と列挙を保持した。胡冒犀は古書に見える胡帽犀との関係が考えられるが、本文を帽へ改めていない。「天文之象」も天に関わる文様を備える意と解したが、具体的な対応は確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-06-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "許姓の天師。以前に四天師の一人として名を挙げられた許旌陽との対応は、姓だけでなく、葛・丘・張・許という同じ四人組、玉帝への取り次ぎ、勅命を伝える役割が一致することから判断した。原文の役職を保ちつつ、通常の地の文と話者名は既知の許旌陽にそろえた。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-07-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「琚、寶貝」と区切る。琚は身に着ける玉の飾りと解し、「寶貝」はここでは宝物と訳した。別の翻刻には「\U0002496D琚寶貝」という文字列も見えるが、その字や区切りを本底本へ補わず、貝の特定種にも断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-08-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「泰」「否」は、安泰と閉塞という対照であり、『易』の卦名を用いた盛衰の表現として訳した。本文の「經」を、特定の巻・章からの逐字引用と断定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-09-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "斗木獬は二星の働きを説明する中で、山の捜索と洞の焼却を挙げる。一方、先の地の文では八戒と沙悟浄が火を放っている。報告の文言を残し、行為者を整合させるための書き換えはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-10-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "西海竜王をここでは「敖順」と記す。同じ作品では西海と北海の竜王に敖閏・敖順の異なる対応が見られるが、ここでは西海の支配者で摩昂の父という関係を重視し、通常の地の文・話者名を西海竜王にそろえた。北海竜王と同一人物にしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-11-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "水族の兵として挙げられた魚の名は、元の四字をそれぞれ保った。鯁の種は未確定で、鮊・鱖も現代の一種へ無条件に限定しない。先の亀・スッポン・大スッポン・ワニは、原文の龜・鱉・黿・鼉をそれぞれ訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-12-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "辟塵大王の鼻に鉤を通す動作は、捕らえた場面ですでに記されるが、ここでも「又把辟塵兒穿了鼻」と繰り返す。重複を省略したり、新たな理由を補ったりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-13-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「前日」。前のある日を指す「先日」と訳し、暦の何日前かを固定しない。夜襲、天界への往復、追跡について、先の「這一日」などとの時間のつながりには揺れがある。道中に日数を追加して調整してはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch92-note-14-body"
    "section_id": "chapter-92"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「枉罰無礙錢糧」。「枉罰」を不当な罰金、「無礙錢糧」を他の用途に差し支えなく支出できる公金と読むが、語の切り方と財政上の厳密な内訳は確定しない。善政として整えるために「枉」の否定的な意味を落とさず、原文欄も改めていない。"
    "translation_status": "reviewed"

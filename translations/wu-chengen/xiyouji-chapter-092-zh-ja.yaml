    "translation_ja": |-
      さすが悟空、早くも西天門（さいてんもん）の外へ着いた。見ると太白金星（たいはくきんせい）が、増長天王（ぞうちょうてんのう）および殷・朱・陶・許（いん・しゅ・とう・きょ）の四大霊官（しだいれいかん）と話していた。神々は悟空が来たのを見ると、急いで礼をした。
      天門の神々「大聖（たいせい）、どちらへおいでですか。」
      悟空「三蔵を守って天竺国（てんじくこく）の東の境、金平府（きんぺいふ）の旻天県（びんてんけん）へ来たところ、師匠が県内の慈雲寺の僧たちに引き留められ、元宵（げんしょう）の灯を見ることになった。金灯橋（きんとうきょう）へ行くと金の灯が三つあり、灯油には酥合香油を使っている。その値が銀五万両（りょう）余りもするのに、毎年、仏たちがめでたいしるしを示しに降りてきて、お召し上がりになるという。見ていると、本当に三体の仏の姿が降りてきた。師匠は良し悪しも見分けず、橋へ上がって拝んだ。俺はまともな連中ではないと言ったのに、あいつらはすぐ灯を暗くして、油も師匠も風でさらった。風を追い、夜明けに山へ着くと、幸い四功曹（しこうそう）が、そこは青竜山で、玄英洞という洞があると教えてくれた。洞には三匹の妖怪がいて、辟寒大王、辟暑大王（へきしょだいおう）、辟塵大王という。俺は急いで押しかけ、師匠を返せと戦ったが勝てず、姿を変えて中へ入った。師匠は鎖でつながれていたが、けがはなかった。解いて連れ出そうとすると気づかれたので、俺は逃げた。その後、八戒と沙悟浄も連れて苦戦したが、今度は二人まで捕らえられて縛られたのだ。それで特に玉帝（ぎょくてい）へ申し上げ、奴らの素性を調べ、将を差し向けて降す命令をいただきに来た。」太白金星は、はははと冷ややかに笑った。
      太白金星「大聖、妖怪とそれだけ渡り合っていながら、どんな生まれか見抜けませんでしたか。」
      悟空「分かっている、分かっている。牛の妖怪どもだ。ただ神通力が大きくて、すぐには降せないのだ。」
      太白金星「あれは三頭の犀の精です。天の文様を身に備え、長い年月修行して真の力を得たので、雲や霧を踏んで行くこともできます。あの生き物はたいへんきれい好きで、自分の姿や影まで嫌がり、何かというと水に入って体を洗いたがるのです。その呼び名も多く、兕犀（じさい）、雄犀（ゆうさい）、牯犀（こさい）、斑犀（はんさい）、さらに胡冒犀（こぼうさい）、堕羅犀（だらさい）、通天花文犀（つうてんかもんさい）があります。いずれも一つの毛穴に三本の毛が生え、角は二本。川や海を行けば、水の中に道を開けます。辟寒（へきかん）・辟暑（へきしょ）・辟塵（へきじん）といったものは、いずれも角に貴い気があるので、それを名として大王を称しているのです。捕らえたければ、四木禽星（しもくきんせい）に会わせるだけでひれ伏します。」悟空は急いで礼をして尋ねた。
      悟空「四木禽星とは、どなたです？　長庚（ちょうこう）どの、お手数ですが、一人ずつ教えていただけませんか。」太白金星は笑った。
      太白金星「その星々は斗牛宮（とぎゅうきゅう）の外にあって、天地に広がっています。玉帝へ奏上なされば、はっきりしますよ。」悟空は両手を組んで礼を述べ、そのまま天門の中へ入った。

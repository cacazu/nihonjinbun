    "source_text": "及至宮外，早有二十八宿星辰來接。天師道：「吾奉聖旨，教點四木禽星與孫大聖下界降妖。」傍即閃過角木蛟、斗木獬、奎木狼、井木犴應聲呼道：「孫大聖，點我等何處降妖？」行者笑道：「原來是你。這長庚老兒卻隱匿，我不解其意。早說是二十八宿中的四木，老孫徑來相請，又何必勞煩旨意？」四木道：「大聖說那裡話，我等不奉旨意，誰敢擅離？端的是那方？快早去來。」行者道：「在金平府東北艮地青龍山玄英洞，犀牛成精。」斗木獬、奎木狼、角木蛟道：「若果是犀牛成精，不須我們，只消井宿去罷，他能上山吃虎，下海擒犀。」行者道：「那犀不比望月之犀，乃是修行得道，都有千年之壽者。須得四位同去才好，切勿推調。倘一時一位拿他不住，卻不又費事了？」天師道：「你們說得是甚話？旨意著你四人，豈可不去？趁早飛行。我回旨去也。」那天師遂別行者而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch92-1455641"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第092回&oldid=1455641"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      宮の外へ着くと、早くも二十八宿（にじゅうはっしゅく）の星々が出迎えた。
      許旌陽「聖旨を奉じて参りました。四木禽星を選び、孫大聖（そんたいせい）とともに下界へ行って妖怪を降せとのお命じです。」すると脇から角木蛟（かくもくこう）・斗木獬（ともくかい）・奎木狼（けいもくろう）・井木犴（せいもくかん）が進み出て、呼びかけた。
      四木禽星「孫大聖、我々をどこへお遣わしになるのですか。」悟空は笑った。
      悟空「何だ、お前たちだったのか。あの長庚の爺さんが隠すものだから、意味が分からなかった。二十八宿のうち、木に属する四人だと言ってくれれば、俺がじかに頼みに来たのに。わざわざ聖旨をいただく手間もなかったろう。」
      四木禽星「大聖、何をおっしゃいます。我々は聖旨を受けなければ、誰も勝手に持ち場を離れられません。それで、いったいどちらです？　早く参りましょう。」
      悟空「金平府から東北、艮の方角にある青竜山の玄英洞だ。犀が妖怪になっている。」
      斗木獬・奎木狼・角木蛟「本当に犀の精なら、我々は要りません。井宿（せいしゅく）一人で十分です。彼は山に入れば虎を食い、海へ入れば犀を捕らえますから。」
      悟空「あの犀は、ただ月を眺めているような犀とは違うぞ。修行して道を得て、どれも千年生きている。四人とも一緒に行くのがいい。どうか押しつけ合わないでくれ。一人で捕まえそこなったら、また手間になるじゃないか。」
      許旌陽「何を言っているのです。聖旨で四人を遣わすとあるのに、行かずに済みますか。早く飛んでいきなさい。私は復命に戻ります。」そう言うと許旌陽は悟空に別れを告げ、去っていった。

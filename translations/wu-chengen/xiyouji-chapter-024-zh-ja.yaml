  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏在馬上歡喜道：「徒弟，我一向西來，經歷許多山水，都是那嵯峨險峻之處，更不似此山好景，果然的幽趣非常。若是相近雷音不遠路，我們好整肅端嚴見世尊。」行者笑道：「早哩，早哩，正好不得到哩。」沙僧道：「師兄，我們到雷音有多少遠？」行者道：「十萬八千里，十停中還不曾走了一停哩。」八戒道：「哥啊，要走幾年才得到？」行者道：「這些路，若論二位賢弟，便十來日也可到；若論我走，一日也好走五十遭，還見日色；若論師父走，莫想，莫想。」唐僧道：「悟空，你說得幾時方可到？」行者道：「你自小時走到老，老了再小，老小千番也還難；只要你見性志誠，念念回首處，即是靈山。」沙僧道：「師兄，此間雖不是雷音，觀此景致，必有個好人居止。」行者道：「此言卻當。這裡決無邪祟，一定是個聖僧、仙輩之鄉，我們遊玩慢行。」不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 129
    "line_end": 129
  "translation_ja": "三蔵は馬上で喜んで言った。三蔵「お前たち、私は西へ来て、数々の山や川を通ってきたが、どこも険しくそびえたつ場所ばかりだった。この山ほど景色のよいところはなく、静かな趣がまことに格別だ。もし雷音寺（らいおんじ）がもう遠くないなら、身なりを整えて、おごそかに世尊（せそん）にお目にかかろう。」悟空は笑った。悟空「まだまだですよ。とても着けるところではありません。」沙悟浄「兄貴、雷音寺までは、あとどれほどあるのです。」悟空「十万八千里だ。その十分の一さえ、まだ歩いていない。」八戒「兄貴、何年歩けば着くんだ。」悟空「お前たち二人なら、十日ほどでも着けるだろう。俺なら、一日に五十回行っても、まだ日が残っている。だがお師匠さまが歩くとなると、まあ、考えても始まらん。」三蔵「悟空、お前はいつになれば着けると言うのだ。」悟空「幼いころから老いるまで歩き、老いてまた幼くなり、それを千度繰り返しても難しいでしょう。ただ、ご自分の本性を見きわめ、ひたすら真心を尽くし、一念ごとに自らを顧みるなら、その場が霊山（れいざん）なのです。」沙悟浄「兄貴、ここは雷音寺ではありませんが、この景色からすると、きっと立派なお方が住んでいるでしょう。」悟空「それはもっともだ。ここには邪悪なものなど決していない。きっと高僧か仙人の住む土地だろう。ゆっくり見物しながら行こう。」こちらの話はひとまず措く。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「正好不得到哩」は難句。前後の遠距離の説明に沿い「とても着けるところではありません」とした。「老小千番」は誇張の発言として保つ。"
- "id": "xy-ch24-008"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說這座山名喚萬壽山。山中有一座觀，名喚五莊觀。觀裡有一尊仙，道號鎮元子，混名與世同君。那觀裡出一般異寶，乃是混沌初分，鴻濛始判，天地未開之際，產成這顆靈根。蓋天下四大部洲，惟西牛賀洲五莊觀出此，喚名草還丹，又名人參果。三千年一開花，三千年一結果，再三千年才得熟，短頭一萬年方得吃。似這萬年，只結得三十個果子。果子的模樣，就如三朝未滿的小孩相似，四肢俱全，五官咸備。人若有緣，得那果子聞了一聞，就活三百六十歲；吃一個，就活四萬七千年。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 130
    "line_end": 130
  "translation_ja": "さて、この山の名は万寿山（ばんじゅさん）。山中には五荘観（ごそうかん）という道観があり、そこに一人の仙人が住んでいた。道号を鎮元子（ちんげんし）、別名を与世同君（よせいどうくん）という。その道観には不思議な宝が実った。混沌が初めて分かれ、原初の世界が分かれ始め、まだ天地も開けぬころに生まれた、霊妙な根を持つ木である。天下の四大部洲（しだいぶしゅう）のうち、西牛賀洲（さいごかしゅう）の五荘観にしかなく、草還丹（そうかんたん）、またの名を人参果（にんじんか）といった。三千年に一度花が咲き、三千年に一度実がなり、さらに三千年を経て初めて熟す。およそ一万年を待ってようやく食べられるのである。その一万年に実るのは、わずか三十個。実の形は、生まれて三日にも満たない赤子そっくりで、四肢も五官もすべて備わっていた。縁のある者がその香りをひと嗅ぎすれば三百六十歳まで生き、一つ食べれば四万七千年生きられた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「短頭一萬年」は三千年ずつ三段階という説明を受け「およそ一万年」とした。九千年へ算術的に書き換えない。"
- "id": "xy-ch24-009"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日鎮元大仙得元始天尊的簡帖，邀他到上清天彌羅宮中聽講「混元道果」。大仙門下出的散仙，也不計其數，見如今還有四十八個徒弟，都是得道的全真。當日帶領四十六個上界去聽講，留下兩個絕小的看家：一個喚做清風，一個喚做明月。清風只有一千三百二十歲，明月才交一千二百歲。鎮元子吩咐二童道：「不可違了大天尊的簡帖，要往彌羅宮聽講，你兩個在家仔細。不日有一個故人從此經過，卻莫怠慢了他。可將我人參果打兩個與他吃，權表舊日之情。」二童道：「師父的故人是誰？望說與弟子，好接待。」大仙道：「他是東土大唐駕下的聖僧，道號三藏，今往西天拜佛求經的和尚。」二童笑道：「孔子云：『道不同，不相為謀。』我等是太乙玄門，怎麼與那和尚做甚相識？」大仙道：「你那裡得知。那和尚乃金蟬子轉生，西方聖老如來佛第二個徒弟。五百年前，我與他在蘭盆會上相識。他曾親手傳茶，佛子敬我，故此是為故人也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 131
    "line_end": 131
  "translation_ja": "その日、鎮元子は元始天尊（げんしてんそん）から書状を受け取った。上清天（じょうせいてん）の弥羅宮（みらきゅう）に来て、「混元道果（こんげんどうか）」の講義を聴くようにという招きである。鎮元子の門下から出た散仙（さんせん）は数知れず、今も四十八人の弟子がいて、皆、道を体得した修行者だった。その日は四十六人を連れて上界へ聴講に行き、いちばん幼い二人を留守番に残した。一人は清風（せいふう）、一人は明月（めいげつ）という。清風はまだ一千三百二十歳、明月はようやく一千二百歳になったところだった。鎮元子は二人に言いつけた。鎮元子「大天尊のお招きに背くわけにはいかぬので、弥羅宮へ講義を聴きに行く。お前たちは留守をよく守りなさい。近いうちに、古い友人がここを通るだろう。決して粗略にしてはならぬ。私の人参果を二つ落として食べてもらい、昔のよしみを示すがよい。」清風と明月「師匠のご友人とは、どなたですか。おもてなしできるよう、弟子たちに教えてください。」鎮元子「東土大唐（だいとう）の帝に仕える高僧で、三蔵という。今、西天へ仏を拝し、経を求めに行く和尚だ。」二人は笑った。清風と明月「孔子（こうし）は『道が違えば、ともに事をはからない』と申しております。私たちは太乙玄門（たいいつげんもん）の修行者なのに、どうして和尚などとお知り合いなのですか。」鎮元子「お前たちは知らぬのだ。あの和尚は金蝉子（きんせんし）の生まれ変わりで、西方の聖老、如来仏（にょらいぶつ）の二番目の弟子だった。五百年前、私は蘭盆会（らんぼんえ）で知り合った。あの人は自分の手で茶を差し出してくれた。仏弟子が私を敬ってくれたので、それ以来の古い友なのだ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "宮殿名は底本の「彌羅宮」を弥羅宮とし、通行する弥羅／弥羅天・弥羅宮等の別伝承へ訂正しない。「蘭盆會」も底本の語形を保つ。"
- "id": "xy-ch24-010"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二仙童聞言，謹遵師命。那大仙臨行，又叮嚀囑咐道：「我那果子有數，只許與他兩個，不得多費。」清風道：「開園時，大眾共吃了兩個，還有二十八個在樹，不敢多費。」大仙道：「唐三藏雖是故人，須要防備他手下人囉唣，不可驚動他知。」二童領命訖，那大仙承眾徒弟飛昇，竟朝天界。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 133
    "line_end": 133
  "translation_ja": "二人の仙童は、その言葉を聞いて謹んで師の命に従った。鎮元子は出立にあたり、さらに念を押した。鎮元子「私の実は数が決まっている。差し上げるのは二つだけだ。余計に使ってはならぬ。」清風「園を開いたとき、皆で二つ食べましたので、木にはまだ二十八個あります。余計には使いません。」鎮元子「唐三蔵（とうさんぞう）は古い友人だが、配下の者たちが騒ぎを起こさぬよう、用心が必要だ。その者たちに気づかれてはいけない。」二人が命を受けると、鎮元子は弟子たちに囲まれて舞い上がり、まっすぐ天界へ向かった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-011"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說唐僧四眾在山遊玩，忽擡頭，見那松篁一簇，樓閣數層。唐僧道：「悟空，你看那裡是甚麼去處？」行者看了道：「那所在不是觀宇，定是寺院。我們走動些，到那廂方知端的。」不一時，來於門首觀看，見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 134
    "line_end": 134
  "translation_ja": "さて、三蔵一行の四人は山を見物していたが、ふと顔を上げると、ひと群れの松と竹の向こうに、幾層もの楼閣が見えた。三蔵「悟空、あそこは何だろう。」悟空は見て答えた。悟空「あれは道観でなければ、きっと寺です。少し急いで行ってみれば、はっきり分かります。」やがて門の前に着くと、こんな様子が目に入った。"
  "translation_status": "reviewed"
- "id": "xy-ch24-012"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": "松坡冷淡，竹徑清幽。往來白鶴送浮雲，上下猿猴時獻果。那門前池寬樹影長，石裂苔花破。宮殿森羅紫極高，樓臺縹緲丹霞墮。真個是福地靈區，蓬萊雲洞。清虛人事少，寂靜道心生。青鳥每傳王母信，紫鸞常寄老君經。看不盡那巍巍道德之風，果然漠漠神仙之宅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 136
    "line_end": 136
  "translation_ja": "松の斜面はひんやりとし、竹の小道は清らかに奥深い。行き交う白鶴は浮雲を送り、上り下りする猿は折々果実を献ずる。門の前では池が広く、木の影は長い。石は裂け、その割れ目から苔がのぞく。宮殿は天の御殿さながらに高く立ち並び、楼台はほのかにかすんで、朱の霞が降りかかる。まさしく福地にして霊境、蓬莱の雲の洞。清らかに澄んで俗事は少なく、静けさの中に道を求める心が生まれる。青鳥はたびたび王母（おうぼ）の便りを運び、紫鸞はいつも太上老君（たいじょうろうくん）の経を届ける。見尽くせぬほど高くおごそかな道徳の気風、なるほど、奥深く静まる神仙の住まいである。"
  "translation_status": "reviewed"
- "id": "xy-ch24-013"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏離鞍下馬，又見那山門左邊有一通碑，碑上有十個大字，乃是「萬壽山福地，五莊觀洞天」。長老道：「徒弟，真個是一座觀宇。」沙僧道：「師父，觀此景鮮明，觀裡必有好人居住。我們進去看看，若行滿東回，此間也是一景。」行者道：「說得好。」遂都一齊進去，又見那二門上有一對春聯：「長生不老神仙府；與天同壽道人家。」行者笑道：「這道士說大話諕人。我老孫五百年前大鬧天宮時，在那太上老君門首，也不曾見有此話說。」八戒道：「且莫管他，進去，進去，或者這道士有些德行，未可知也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 138
    "line_end": 138
  "translation_ja": "三蔵は馬を下りた。山門の左側には石碑があり、「万寿山福地　五荘観洞天」という十の大文字が刻まれていた。三蔵「お前たち、やはり道観だね。」沙悟浄「お師匠さま、この清らかで明るい景色なら、きっと立派な方が住んでおられます。中へ入って拝見しましょう。修行を果たして東へ帰るときにも、ここは見どころの一つになるでしょう。」悟空「いいことを言う。」そこで皆で中へ入ると、二つ目の門には一対の聯があった。「長生不老の神仙の府、天と寿をともにする道人の家」。悟空は笑った。悟空「この道士は大げさなことを言って、人を驚かせるな。俺が五百年前、天宮で大暴れしたときでさえ、太上老君の門前にこんな言葉は見なかったぞ。」八戒「まあ、放っておいて、中へ入ろう、入ろう。案外、この道士は大した徳を積んでいるのかもしれないぜ。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-014"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "及至二層門裡，只見那裡面急急忙忙，走出兩個小童兒來。看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 140
    "line_end": 140
  "translation_ja": "二つ目の門をくぐると、中から二人の童子があわただしく出てきた。そのいでたちをご覧あれ。"
  "translation_status": "reviewed"
- "id": "xy-ch24-015"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    骨清神爽容顏麗，頂結丫髻短髮鬅。
    道服自然襟繞霧，羽衣偏是袖飄風。
    環絛緊束龍頭結，芒履輕纏蠶口絨。
    丰采異常非俗輩，正是那清風明月二仙童。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 141
    "line_end": 144
  "translation_ja": |-
    骨格は清らか、心気はさわやか、顔立ちは美しく、頭には二股の髷、短い髪はふんわりと立つ。
    道服の襟にはおのずと霧がめぐり、羽衣の袖にはひときわ風がひるがえる。
    組みひもの帯は竜頭の結びに固く締め、草履には蚕の口から出る絹糸を軽く巻く。
    姿は並外れ、俗人ではない。これぞ清風と明月、二人の仙童。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「蠶口絨」は蚕の口から出る絹の糸・組紐と解した。「丫髻」は二股の髷。衣装細部の実物同定は未確認。"
- "id": "xy-ch24-016"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那童子控背躬身，出來迎接道：「老師父，失迎，請坐。」長老歡喜，遂與二童子上了正殿觀看。原來是向南的五間大殿，都是上明下暗的雕花格子。那仙童推開格子，請唐僧入殿處，只見那壁中間掛著五彩裝成的「天地」二大字，設一張朱紅雕漆的香几，几上有一副黃金爐瓶，爐邊有方便整香。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 146
    "line_end": 146
  "translation_ja": "童子たちは背をかがめて迎えに出た。童子「和尚さま、お迎えもせず失礼しました。どうぞお掛けください。」三蔵は喜び、二人と正殿へ上がって見まわした。南向きの五間の大殿で、上部は透かし、下部は板張りになった彫り模様の格子戸が並んでいる。仙童が格子戸を開いて三蔵を中へ招くと、壁の中央には、五彩の飾りを施した「天地」の二大文字が掛けられていた。朱の彫漆の香机が一脚置かれ、その上には金の香炉と花瓶が一組、香炉のそばにはすぐ供えられるよう香が整えてあった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-017"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧上前，以左手撚香注爐，三匝禮拜。拜畢，回頭道：「仙童，你五莊觀真是西方仙界。何不供養三清、四帝、羅天諸宰，只將『天地』二字侍奉香火？」童子笑道：「不瞞老師說，這兩個字，上頭的，禮上還當；下邊的，還受不得我們的香火，是家師父諂佞出來的。」三藏道：「何為諂佞？」童子道：「三清是家師的朋友，四帝是家師的故人；九曜是家師的晚輩，元辰是家師的下賓。」那行者聞言，就笑得打跌。八戒道：「哥啊，你笑怎的？」行者道：「只講老孫會搗鬼，原來這道童會綑風。」三藏道：「令師何在？」童子道：「家師元始天尊降簡，請到上清天彌羅宮聽講『混元道果』去了，不在家。」行者聞言，忍不住喝了一聲道：「這個臊道童，人也不認得，你在那個面前搗鬼，扯甚麼空心架子？那彌羅宮有誰是太乙天仙？請你這潑牛蹄子去講甚麼？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 147
    "line_end": 147
  "translation_ja": "三蔵は前へ進み、左手で香をつまんで香炉に立て、三度拝礼した。拝み終えると、振り向いて尋ねた。三蔵「仙童よ、この五荘観はまことに西方の仙境ですね。どうして三清（さんせい）、四帝（してい）、あまねく天の主宰神をお祭りせず、『天地』の二字だけに香を供えるのですか。」童子は笑った。童子「和尚さま、正直に申しますと、この二字のうち、上の『天』は礼を尽くすにふさわしいのですが、下の『地』は、私たちの香を受けるほどではありません。師匠がお世辞で加えたものです。」三蔵「お世辞とは、どういうことです。」童子「三清は師匠の友人、四帝は師匠の旧友、九曜（くよう）は師匠より後輩で、元辰（げんしん）は師匠の下座の客です。」それを聞いた悟空は、転げるほど笑い出した。八戒「兄貴、何がおかしいんだ。」悟空「でたらめを言うのは俺だけかと思ったら、この道童も大ぼら吹きだ。」三蔵「お師匠さまは、どちらにおいでですか。」童子「元始天尊からお手紙があり、上清天の弥羅宮へ『混元道果』の講義を聴きに招かれましたので、留守です。」悟空は聞くと、こらえきれず声を荒らげた。悟空「この生臭い道童め、人の顔も分からず、誰の前ででたらめを言っている。中身もない見栄を張りやがって。弥羅宮の誰が太乙天仙（たいいつてんせん）だというんだ。お前の師匠のようなろくでなしの道士を招いて、何を講じるっていうんだ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「那彌羅宮有誰是太乙天仙」は疑問の向け先が曖昧。底本どおり弥羅宮の誰を指すかを断定せず訳した。童子の個人名も清風・明月のどちらかと断定しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「潑牛蹄子」は道士への罵り。字面の「牛の蹄」を本文に持ち込むと対象が分かりにくくなるため「ろくでなしの道士」と訳した。"
- "id": "xy-ch24-018"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏見他發怒，恐怕那童子回言，鬥起禍來，便道：「悟空，且休爭競，我們既進來就出去，顯得沒了方情。常言道：『鷺鷥不吃鷺鷥肉。』他師既是不在，攪亂他做甚？你去山門前放馬，沙僧看守行李，教八戒解包袱，取些米糧，借他鍋灶，做頓飯吃，待臨行，送他幾文柴錢，便罷了。各依執事，讓我在此歇息歇息，飯畢就行。」他三人果各依執事而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 149
    "line_end": 149
  "translation_ja": "三蔵は悟空が怒るのを見て、童子が言い返して争いになるのを恐れ、なだめた。三蔵「悟空、争うのはよしなさい。入ったとたんに出ていっては、礼を知らぬことになる。昔から『鷺は鷺の肉を食べない』と言うではないか。師匠が留守なのに、この子たちを騒がせてどうする。お前は山門の前で馬を放しておやり。沙悟浄は荷物の番、八戒は包みを解いて米を取り出し、ここの釜とかまどを借りて、飯を炊きなさい。出発するときに薪代を何文か渡せばよい。それぞれ役目を果たして、私はここで少し休ませてもらおう。食事が済んだら出発だ。」三人はそれぞれ命じられた仕事に出ていった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-019"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那明月、清風暗自誇稱不盡道：「好和尚，真個是西方愛聖臨凡，真元不昧。師父命我們接待唐僧，將人參果與他吃，以表故舊之情；又教防著他手下人囉唣。果然那三個嘴臉兇頑，性情粗糙。幸得就把他們調開了；若在邊前，卻不與他人參果見面？」清風道：「兄弟，還不知那和尚可是師父的故人。問他一問看，莫要錯了。」二童子又上前道：「啟問老師可是大唐往西天取經的唐三藏？」長老回禮道：「貧僧就是。仙童為何知我賤名？」童子道：「我師臨行，曾吩咐教弟子遠接。不期車駕來促，有失迎迓。老師請坐，待弟子辦茶來奉。」三藏道：「不敢。」那明月急轉本房，取一杯香茶，獻與長老。茶畢，清風道：「兄弟，不可違了師命，我和你去取果子來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 150
    "line_end": 150
  "translation_ja": "明月と清風は、ひそかに三蔵をしきりにほめた。清風と明月「よい和尚だ。まことに西方の愛聖（あいせい）がこの世に下ったお方、もとの霊性を失っていない。師匠は唐僧をもてなし、人参果を差し上げて昔のよしみを示せとおっしゃり、配下の者が騒ぎを起こさぬよう注意せよともおっしゃった。なるほど、あの三人は顔つきが凶暴で、気性も荒っぽい。うまく仕事を言いつけて、離してくれたものだ。そばにいたら、人参果を見られてしまうところだった。」清風「兄弟、まだあの和尚が師匠のご友人かどうか分からない。間違えてはいけないから、尋ねてみよう。」二人はまた前へ出た。清風と明月「お尋ねいたしますが、和尚さまは、大唐から西天へ経を取りに行かれる唐三蔵さまでしょうか。」三蔵は答礼した。三蔵「いかにも私です。仙童はどうして私の名をご存じなのです。」童子「師匠は出立の折、遠くまでお迎えに出るよう弟子たちに命じました。思いがけずお早いお着きで、お迎えを怠りました。どうぞお掛けください。茶を用意してまいります。」三蔵「どうぞお構いなく。」明月は急いで自分たちの部屋へ戻り、香り高い茶を一杯取ってきて、三蔵に供した。茶が済むと、清風が言った。清風「兄弟、師匠の命に背いてはいけない。一緒に実を取りに行こう。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の「西方愛聖」は異文の可能性があるが、「愛聖」の字を保持し、後世の別称に置換しない。"
- "id": "xy-ch24-020"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二童別了三藏，同到房中，一個拿了金擊子，一個拿了丹盤，又多將綠帕墊著盤底，徑到人參園內。那清風爬上樹去，使金擊子敲果。明月在樹下，以丹盤等接。須臾，敲下兩個果來，接在盤中，徑至前殿奉獻道：「唐師父，我五莊觀土僻山荒，無物可奉，土儀素果二枚，權為解渴。」那長老見了，戰戰兢兢，遠離三尺道：「善哉！善哉！今歲倒也年豐時稔，怎麼這觀裡作荒吃人？這個是三朝未滿的孩童，如何與我解渴？」清風暗道：「這和尚在那口舌場中，是非海裡，弄得眼肉胎凡，不識我仙家異寶。」明月上前道：「老師，此物叫做人參果，吃一個兒不妨。」三藏道：「胡說，胡說。他那父母懷胎，不知受了多少苦楚，方生下來。未及三日，怎麼就把他拿來當果子？」清風道：「實是樹上結的。」長老道：「亂談，亂談。樹上又會結出人來？拿過去，不當人子。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 151
    "line_end": 151
  "translation_ja": "二人は三蔵のもとを辞して部屋へ行き、一人は金撃子（きんげきし）、一人は丹盤（たんばん）を取り、さらに緑の布を盆の底に敷いて、人参果の園へ直行した。清風が木に登って金撃子で実をたたき、明月は木の下で丹盤を構えて受けた。たちまち二つの実を落として盆に受けると、前殿へ持っていき、献じた。清風と明月「三蔵さま、五荘観は辺鄙な山中にあり、おもてなしする品もございません。土地で取れたつつましい果物を二つ、どうぞ喉を潤す足しにしてください。」三蔵は見るなりぶるぶる震え、三尺も遠ざかって言った。三蔵「ああ、何ということ。今年は作柄もよく、穀物も豊かだというのに、この道観では飢饉のように人を食べるのですか。これは生まれて三日にも満たない赤子です。どうして私の喉を潤せましょう。」清風は心の中でつぶやいた。清風「この和尚は、口論や是非の渦の中で、すっかり肉眼の凡人になり、仙人の宝も見分けられなくなったのだな。」明月は前へ出た。明月「和尚さま、これは人参果というものです。一つ召し上がっても差し支えありません。」三蔵「でたらめを言ってはいけません。その親が身ごもってから、どれほど苦しんで、ようやく産み落としたことでしょう。まだ三日もたたないのに、なぜ果物の代わりに持ってくるのです。」清風「本当に木になった実なのです。」三蔵「ばかなことを。木に人間がなるものですか。持っていきなさい。人のすることではありません。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-021"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那兩個童兒見千推萬阻不吃，只得拿著盤子，轉回本房。那果子卻也蹺蹊，久放不得；若放多時，即僵了，不中吃。二人到於房中，一家一個，坐在床邊上，只情吃起。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 153
    "line_end": 153
  "translation_ja": "二人の童子は、いくら勧めても拒んで食べようとしないので、仕方なく盆を持って自分たちの部屋へ戻った。この実は不思議なもので、長く置いておけず、時間がたつと固くなって食べられなくなる。二人は部屋へ着くと、一つずつ取り、寝台の縁に腰掛け、心ゆくまで食べ始めた。"
  "translation_status": "reviewed"
- "id": "xy-ch24-022"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "噫！原來有這般事哩。他那道房，與那廚房緊緊的間壁，這邊悄悄的言語，那邊即便聽見。八戒正在廚房裡做飯，先前聽見說取金擊子，拿丹盤，他已在心；又聽見他說唐僧不認得是人參果，即拿在房裡自吃。口裡忍不住流涎道：「怎得一個兒嘗新？」自家身子又狼犺，不能夠得動，只等行者來，與他計較。他在那鍋門前更無心燒火，不時的伸頭探腦，出來觀看。不多時，見行者牽將馬來，拴在槐樹上，徑往後走。那獃子用手亂招道：「這裡來，這裡來。」行者轉身，到於廚房門首，道：「獃子，你嚷甚的？想是飯不夠吃，且讓老和尚吃飽，我們前邊大人家，再化吃去罷。」八戒道：「你進來，不是飯少。這觀裡有一件寶貝，你可曉得？」行者道：「甚麼寶貝？」八戒笑道：「說與你，你不曾見；拿與你，你不認得。」行者道：「這獃子笑話我老孫。老孫五百年前，因訪仙道時，也曾雲遊在海角天涯，那般兒不曾見？」八戒道：「哥啊，人參果你曾見麼？」行者驚道：「這個真不曾見。但只常聞得人說，人參果乃是草還丹，人吃了極能延壽。如今那裡有得？」八戒道：「他這裡有。那童子拿兩個與師父吃，那老和尚不認得，道是三朝未滿的孩兒，不曾敢吃。那童子老大憊懶，師父既不吃，便該讓我們，他就瞞著我們，才自在這隔壁房裡，一家一個，嘓啅嘓啅的吃了出去。就急得我口裡水泱。怎麼得一個兒嘗新？我想你有些溜撒，去他那園子裡偷幾個來嘗嘗，如何？」行者道：「這個容易，老孫去，手到擒來。」急抽身，往前就走，八戒一把扯住道：「哥啊，我聽得他在這房裡說，要拿甚麼金擊子去打哩。須是幹得停當，不可走露風聲。」行者道：「我曉得，我曉得。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 154
    "line_end": 154
  "translation_ja": "ところが、こんなこともあるものだ。二人の部屋は台所と壁一枚を隔ててぴったり隣り合い、こちらで小声で話しても、あちらにはすぐ聞こえた。八戒は台所で飯を炊いていたが、さっき金撃子を取り、丹盤を持っていくという話を聞いて、もう気に掛けていた。さらに、三蔵が人参果と分からず、二人が部屋へ持ち帰って自分で食べるという話を聞き、口からよだれをこらえきれずに言った。八戒「どうしたら一つ、初物の味見ができるだろう。」だが、自分は体が大きくて思うように動けないので、悟空が来たら相談しようと待っていた。かまどの前にいても火をたくことなど上の空で、何度も首を伸ばし、顔を出して様子を見た。やがて悟空が馬を引いてきて、槐につなぎ、まっすぐ奥へ歩いていくのが見えた。八戒はむやみに手を振った。八戒「こっちだ、こっちだ。」悟空は振り返って台所の戸口へ来た。悟空「間抜け、何を騒いでいる。飯が足りないのか。まずお師匠さまに腹いっぱい食べてもらえ。俺たちはこの先の大きな家で、また托鉢すればいい。」八戒「中へ入ってくれ。飯が少ないんじゃない。この道観には宝物があるんだが、知っているか。」悟空「どんな宝だ。」八戒は笑った。八戒「話しても、兄貴は見たことがない。持ってきても、何だか分からないさ。」悟空「この間抜け、俺を笑いものにする気か。俺は五百年前、仙人の道を求めて、海の果て、地の果てまで巡り歩いた。見たことのないものがあるものか。」八戒「兄貴、人参果は見たことがあるか。」悟空は驚いた。悟空「それは本当に見たことがない。ただ人参果は草還丹ともいい、食べれば寿命がひどく延びると、よく人から聞いたものだ。今、どこにあるんだ。」八戒「ここにあるんだ。あの童子たちがお師匠さまに二つ食べさせようとしたのに、お師匠さまは見分けがつかず、生まれて三日にもならない赤子だと言って、怖がって食べなかった。あの童子たちも大した不届き者だ。師匠が食べないなら俺たちに勧めるべきなのに、こっそりこの隣の部屋で、一人一つずつ、むしゃむしゃ食べて出ていったんだ。それで俺は、よだれが止まらなくてね。どうすれば一つ味見できるだろう。兄貴はすばしっこいから、あの園へ行って幾つか盗んできて、食べてみないか。」悟空「たやすいことだ。俺が行けば、すぐ手に入る。」さっと身をひるがえして歩き出すと、八戒がつかんで引き止めた。八戒「兄貴、あの部屋で、金撃子とかいうものを持っていって、たたき落とすと言っていたぞ。うまくやって、決して気づかれないようにな。」悟空「分かった、分かった。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-023"

    "description_ja": "「原本」「資本」は生命・精気を元手にたとえる戒色の詞。訳は比喩を保ち、特定の生理説へ狭めない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-006"
    "description_ja": "山景の千年峰・五福峰・芙蓉峰・万歳石・虎牙石・三天石は詩中の固有的呼称として保持。実在の地形へ同定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-007"
    "description_ja": "「正好不得到哩」は難句。前後の遠距離の説明に沿い「とても着けるところではありません」とした。「老小千番」は誇張の発言として保つ。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-008"
    "description_ja": "「短頭一萬年」は三千年ずつ三段階という説明を受け「およそ一万年」とした。九千年へ算術的に書き換えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-009"
    "description_ja": "宮殿名は底本の「彌羅宮」を弥羅宮とし、通行する弥羅／弥羅天・弥羅宮等の別伝承へ訂正しない。「蘭盆會」も底本の語形を保つ。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-015"
    "description_ja": "「蠶口絨」は蚕の口から出る絹の糸・組紐と解した。「丫髻」は二股の髷。衣装細部の実物同定は未確認。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-017"
    "description_ja": "「那彌羅宮有誰是太乙天仙」は疑問の向け先が曖昧。底本どおり弥羅宮の誰を指すかを断定せず訳した。童子の個人名も清風・明月のどちらかと断定しない。 「潑牛蹄子」は道士への罵り。字面の「牛の蹄」を本文に持ち込むと対象が分かりにくくなるため「ろくでなしの道士」と訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-019"
    "description_ja": "底本の「西方愛聖」は異文の可能性があるが、「愛聖」の字を保持し、後世の別称に置換しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-024"
    "description_ja": "「錦巢榴」「繡墩草」「碧砂蘭」は植物の飾り名として残す。具体的品種は未確定。「荼䕷」はときんいばらと解したが、古典植物名の同定には幅がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-026"
    "description_ja": "菜名「薑苔」はしょうがの茎、「窩蕖」はちしゃ、「童蒿」はしゅんぎく、「苦藚」はにが菜と解した。原文の字は訂正しない。「羊頭」は菜名と読み羊頭菜としたが、植物種は未同定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "segment_ids":
    - "xy-ch24-030"
    "description_ja": "「這個土有四萬七千年」は句が省略的で、土に果実の四万七千年の効力が移って硬化すると解した。土が硬いまま続く期間をいう可能性も残る。水に溶かす食法と、後続の丸のみ・咀嚼の描写は原文のまま併存させた。 本文の欠落ではなく解釈・校訂上の留保。"

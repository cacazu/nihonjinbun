- "id": "xy-ch24-004"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒撮土焚香，望空禮拜。行者道：「你可認得那些菩薩麼？」八戒道：「我已此暈倒昏迷，眼花撩亂，那認得是誰？」行者把那簡帖兒遞與八戒。八戒見了是頌子，更加慚愧。沙僧笑道：「二哥有這般好處哩，感得四位菩薩來與你做親。」八戒道：「兄弟再莫題起，不當人子了。從今後，再也不敢妄為。就是累折骨頭，也只是摩肩壓擔，隨師父西域去也。」三藏道：「既如此說才是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 125
    "line_end": 125
  "translation_ja": "八戒は土をひとつかみ盛って香をたき、空を仰いで拝んだ。悟空「お前、あの菩薩たちが誰か分かったか。」八戒「気を失って頭はぼんやり、目もくらんでいたのに、誰だか分かるものか。」悟空はあの書き付けを八戒に渡した。八戒はそこに記された偈を読んで、いっそう恥じ入った。沙悟浄は笑った。沙悟浄「二番目の兄貴には、こんなにありがたいことがあるのですね。四人もの菩薩が、縁組をしに来てくださるとは。」八戒「兄弟、もうその話はよしてくれ。まったく面目ない。これからは二度と無茶はしない。骨が折れるほど疲れても、肩をすり減らして荷を担ぎ、お師匠さまについて西域（さいいき）へ行くだけだ。」三蔵「その言葉どおりなら、それでよい。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-005"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者遂領師父上了大路。行夠多時，忽見有高山擋路，三藏勒馬停鞭道：「徒弟，前面一山，必須仔細，恐有妖魔作耗，侵害吾黨。」行者道：「馬前但有吾等三人，怕甚妖魔？」因此，長老安心前進。只見那座山，真是好山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 127
    "line_end": 127
  "translation_ja": "そこで悟空は師を導いて大道へ出た。しばらく行くと、高い山が行く手に立ちはだかっていた。三蔵は手綱を引き、鞭を止めて言った。三蔵「お前たち、前に山がある。気をつけて進みなさい。妖魔が悪さをして、私たちを襲うかもしれない。」悟空「馬の前には私たち三人がいるのです。妖魔など何が怖いものですか。」それで三蔵は安心して進んだ。見れば、まことに見事な山であった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-006"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": "高山峻極，大勢崢嶸。根接崑崙脈，頂摩霄漢中。白鶴每來棲檜柏，玄猿時復掛藤蘿。日映晴林，疊疊千條紅霧繞；風生陰壑，飄飄萬道彩雲飛。幽鳥亂啼青竹裡，錦雞齊鬥野花間。只見那千年峰、五福峰、芙蓉峰，巍巍凜凜放毫光；萬歲石、虎牙石、三天石，突突磷磷生瑞氣。崖前草秀，嶺上梅香。荊棘密森森，芝蘭清淡淡。深林鷹鳳聚千禽，古洞麒麟轄萬獸。澗水有情，曲曲灣灣多遶顧；峰巒不斷，重重疊疊自週迴。又見那綠的槐、斑的竹、青的松，依依千載鬥穠華；白的李、紅的桃、翠的柳，灼灼三春爭艷麗。龍吟虎嘯，鶴舞猿啼。麋鹿從花出，青鸞對日鳴。乃是仙山真福地，蓬萊閬苑只如然。又見些花開花謝山頭景，雲去雲來嶺上峰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 128
    "line_end": 128
  "translation_ja": "山はひときわ高く険しく、その姿は雄々しくそびえる。根は崑崙（こんろん）の山脈につながり、頂は天の川に触れる。白鶴はしばしば檜や柏の枝に宿り、黒い猿は折々つるにぶら下がる。晴れた林に日が差せば、幾重にも千筋の紅の霧がたなびき、暗い谷に風が起これば、万筋の彩雲がひらひら飛ぶ。奥の鳥は青竹の中で鳴き交わし、錦鶏（きんけい）は野の花の間で競い合う。見よ、千年峰（せんねんほう）、五福峰（ごふくほう）、芙蓉峰（ふようほう）は、おごそかに高くそびえて光を放ち、万歳石（ばんざいせき）、虎牙石（こがせき）、三天石（さんてんせき）は、突き出た岩肌からめでたい気を立ちのぼらせる。崖の前では草が茂り、峰の上では梅が香る。いばらはびっしり密生し、芝草と蘭はほのかに香る。深い林では鷹や鳳凰（ほうおう）が千の鳥を集め、古い洞では麒麟（きりん）が万の獣を統べる。谷川は心あるかのように曲がりくねって何度も振り返り、山並みは絶え間なく幾重にも連なって、みずから輪を描く。緑の槐、まだらの竹、青い松は、千年の歳月をしなやかに栄え競い、白い李、紅の桃、翠の柳は、春の三か月を鮮やかに美を争う。竜はうなり、虎はほえ、鶴は舞い、猿は鳴く。大鹿は花の間から現れ、青鸞（せいらん）は日に向かってさえずる。まさしく仙山、真の福地、蓬莱（ほうらい）や閬苑（ろうえん）もこれに勝るまい。山の上では花が咲いては散り、峰のあたりでは雲が去ってはまた来る。"
  "translation_status": "reviewed"

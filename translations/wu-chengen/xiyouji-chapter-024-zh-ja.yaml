  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖使一個隱身法，閃進道房看時，原來那兩個道童吃了果子，上殿與唐僧說話，不在房裡。行者四下裡觀看，看有甚麼金擊子，但只見窗櫺上掛著一條赤金，有二尺長短，有指頭粗細；底下是一個蒜疙疸的頭子；上邊有眼，系著一根綠絨繩兒。他道：「想必就是此物叫做金擊子。」他卻取下來，出了道房，徑入後邊去，推開兩扇門，擡頭觀看，呀！卻是一座花園！但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 155
    "line_end": 155
  "translation_ja": "悟空は隠身の術を使い、道士たちの部屋へするりと入った。二人の道童は果実を食べ終え、殿へ三蔵と話しに行っていて、部屋にはいなかった。悟空は金撃子とはどんなものかと見まわした。窓の格子に、長さ二尺ほど、太さは指ほどの純金の棒が掛かっている。下端にはニンニクの玉のような頭があり、上端には穴が開いて、緑の絹ひもが結ばれていた。悟空「きっとこれが金撃子というものだろう。」それを外して部屋を出ると、まっすぐ奥へ向かい、二枚の扉を押し開けて顔を上げた。おや、そこは花園ではないか。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch24-024"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": "朱欄寶檻，曲砌峰山。奇花與麗日爭妍，翠竹共青天鬥碧。流杯亭外，一灣綠柳似拖煙；賞月臺前，數簇喬松如潑靛。紅拂拂，錦巢榴；綠依依，繡墩草；青茸茸，碧砂蘭；攸蕩蕩，臨溪水。丹桂映金井梧桐，錦槐傍朱欄玉砌。有或紅或白千葉桃，有或香或黃九秋菊。荼䕷架，映著牡丹亭；木槿臺，相連芍藥圃。看不盡傲霜君子竹，欺雪大夫松。更有那鶴莊鹿宅，方沼圓池；泉流碎玉，地萼堆金。朔風觸綻梅花白，春來點破海棠紅。誠所謂人間第一仙景，西方魁首花叢。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 157
    "line_end": 157
  "translation_ja": "朱の欄干、宝の手すり、曲がる石畳に峰をかたどる築山。珍しい花は麗らかな日と美を競い、翠の竹は青空と碧さを争う。流杯亭（りゅうはいてい）の外には、ひと曲がりの緑の柳が煙を引くように垂れ、賞月台（しょうげつだい）の前には、幾群れもの高い松が藍を注いだように立つ。赤く揺れるのは錦巣榴（きんそうりゅう）、緑にしなうのは繍墩草（しゅうとんそう）、青々と柔らかいのは碧砂蘭（へきさらん）、ゆらゆらとたゆたうのは小川の水。朱の桂は金の井戸の梧桐に映え、錦の槐は朱の欄干、玉の石畳に寄り添う。赤や白の八重桃があり、香り高いもの、黄色いものと秋の菊もある。ときんいばらの棚は牡丹亭（ぼたんてい）に映え、むくげの台は芍薬の畑につながる。霜をものともしない君子の竹、雪をも侮る大夫の松は、いくら見ても見飽きない。さらに鶴のすみか、鹿の住まい、四角い沼、丸い池があり、泉は砕いた玉のように流れ、地には金のような花びらが積もる。北風が触れて白梅をほころばせ、春が来て海棠の紅を咲かせる。まことに人間界第一の仙景、西方随一の花の園と呼ぶべきである。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「錦巢榴」「繡墩草」「碧砂蘭」は植物の飾り名として残す。具体的品種は未確定。「荼䕷」はときんいばらと解したが、古典植物名の同定には幅がある。"
- "id": "xy-ch24-025"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者觀看不盡，又見一層門，推開看處，卻是一座菜園："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 159
    "line_end": 159
  "translation_ja": "悟空は見尽くせぬ景色の先に、また一つ門を見つけた。押し開けて見ると、そこは菜園だった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-026"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    佈種四時蔬菜，菠芹莙薘薑苔。 筍薯瓜瓠茭白，蔥蒜芫荽韭薤。
    窩蕖童蒿苦藚，葫蘆茄子須栽。 蔓菁蘿蔔羊頭埋，紅莧青菘紫芥。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 161
    "line_end": 162
  "translation_ja": |-
    四季の野菜を植えつけてある。ほうれん草、せり、ふだん草、しょうがの茎。たけのこ、いも、瓜、ひょうたん、まこものたけ。ねぎ、にんにく、香菜、にら、らっきょう。
    ちしゃ、しゅんぎく、にが菜、ひょうたん、なすも植えなくては。かぶ、大根、羊頭菜（ようとうさい）を土に植え、赤ひゆ、青菜、紫からし菜。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "菜名「薑苔」はしょうがの茎、「窩蕖」はちしゃ、「童蒿」はしゅんぎく、「苦藚」はにが菜と解した。原文の字は訂正しない。「羊頭」は菜名と読み羊頭菜としたが、植物種は未同定。"
- "id": "xy-ch24-027"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者笑道：「他也是個自種自吃的道士。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 164
    "line_end": 164
  "translation_ja": "悟空は笑った。悟空「この道士も、自分で作って自分で食べるんだな。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-028"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "走過菜園，又見一層門。推開看處，呀！只見那正中間有根大樹，真個是青枝馥郁，綠葉陰森，那葉兒卻似芭蕉模樣，直上去有千尺餘高，根下有七八丈圍圓。那行者倚在樹下，往上一看，只見向南的枝上露出一個人參果，真個像孩兒一般。原來尾間上是個扢蒂，看他丁在枝頭，手腳亂動，點頭幌腦，風過處似乎有聲。行者歡喜不盡，暗自誇稱道：「好東西呀！果然罕見，果然罕見！」他倚著樹，颼的一聲，攛將上去。那猴子原來第一會爬樹偷果子。他把金擊子敲了一下，那果子撲的落將下來。他也隨跳下來跟尋，寂然不見；四下裡草中找尋，更無蹤跡。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 165
    "line_end": 165
  "translation_ja": "菜園を通り抜けると、また一つ門があった。押し開けて見ると、なんと真ん中に一本の大木が生えている。青い枝は香り豊かで、緑の葉はうっそうと茂り、葉の形は芭蕉に似ていた。まっすぐ上へ千尺余りも伸び、根元の幹回りは七、八丈もある。悟空が木の下に寄って見上げると、南に伸びる枝に人参果が一つのぞいていた。本当に赤子そっくりで、尻のところにへたがあり、それで枝にくっついている。手足を動かし、頭を振り、うなずいて、風が吹き過ぎると声さえするようだった。悟空は大喜びで、ひそかにほめた。悟空「いいものだ。これは珍しい、本当に珍しい。」木に取りつくと、ひゅっと一息に登った。もともと木に登って果実を盗むことなら、この猿は第一人者である。金撃子で一つたたくと、実はぽとりと落ちた。悟空も跳び下りて捜したが、ひっそりと消えていて見当たらない。四方の草の中を捜しても、跡形もなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-029"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「蹺蹊，蹺蹊。想是有腳的會走，就走也跳不出牆去。我知道了，想是花園中土地不許老孫偷他果子，他收了去也。」他就捻著訣，念一口「唵」字咒，拘得那花園土地前來，對行者施禮道：「大聖呼喚小神，有何吩咐？」行者道：「你不知老孫是蓋天下有名的賊頭，我當年偷蟠桃、盜御酒、竊靈丹，也不曾有人敢與我分用。怎麼今日偷他一個果子，你就抽了我的頭分去了？這果子是樹上結的，空中過鳥也該有分，老孫就吃他一個，有何大害？怎麼剛打下來，你就撈了去？」土地道：「大聖錯怪了小神也。這寶貝乃是地仙之物，小神是個鬼仙，怎麼敢拿去？就是聞也無福聞聞。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 166
    "line_end": 166
  "translation_ja": "悟空「妙だ、妙だ。足があるから歩くのかもしれんが、歩いたって塀の外へ跳び出せるはずはない。分かったぞ。この花園の土地神（とちがみ）が、俺に実を盗ませまいと取り上げたんだな。」そこで指を組んで印を結び、「唵（おん）」の一字の呪を唱え、花園の土地神を呼び出した。土地神は悟空に礼をした。土地神「大聖さま、この小さな神をお呼びとは、どんなご用でしょうか。」悟空「俺が天下に名高い盗賊の親玉だと知らぬのか。昔、蟠桃（ばんとう）を盗み、帝の酒を盗み、霊丹（れいたん）を盗んだときでさえ、俺の分け前に手を出す者はいなかった。それが今日は、実を一つ盗んだだけで、お前に上前をはねられたとはどういうことだ。木になった実なら、空を飛ぶ鳥にだって分け前はある。俺が一つ食べたところで、何の大きな害がある。どうして落としたとたん、さらっていったんだ。」土地神「大聖さま、それはお門違いでございます。この宝は地仙（ちせん）の持ち物、私はただの鬼仙（きせん）ですから、どうして持ち去ることなどできましょう。香りを嗅ぐ福分さえございません。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-030"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「你既不曾拿去，如何打下來就不見了？」土地道：「大聖只知這寶貝延壽，更不知他的出處哩。」行者道：「有甚出處？」土地道：「這寶貝三千年一開花，三千年一結果，再三千年方得成熟。短頭一萬年，只結得三十個。有緣的，聞一聞，就活三百六十歲；吃一個，就活四萬七千年。卻是只與五行相畏。」行者道：「怎麼與五行相畏？」土地道：「這果子遇金而落，遇木而枯，遇水而化，遇火而焦，遇土而入。敲時必用金器，方得下來。打下來，卻將盤兒用絲帕襯墊方可。若受些木器，就枯了，就吃也不得延壽。吃他須用磁器，清水化開食用。遇火即焦而無用。遇土而入者，大聖方才打落地上，他即鑽下土去了。這個土有四萬七千年，就是鋼鑽鑽他也鑽不動些須，比生鐵也還硬三四分，人若吃了，所以長生。大聖不信時，可把這地下打打兒看。」行者即掣金箍棒築了一下，響一聲，迸起棒來，土上更無痕跡。行者道：「果然，果然。我這棍打石頭如粉碎，撞生鐵也有痕，怎麼這一下打不傷些兒？這等說，我卻錯怪了你了，你回去罷。」那土地即回本廟去訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 167
    "line_end": 167
  "translation_ja": "悟空「お前が持ち去らなかったのなら、どうして落ちたとたんに消えたんだ。」土地神「大聖さまは、この宝で寿命が延びることはご存じでも、その由来はご存じないのです。」悟空「どんな由来だ。」土地神「この宝は三千年に一度花が咲き、三千年に一度実を結び、さらに三千年を経て初めて熟します。およそ一万年で、わずか三十個しか実りません。縁のある方がひと嗅ぎすれば三百六十歳まで生き、一つ食べれば四万七千年生きられます。ただし、五行（ごぎょう）を嫌うのです。」悟空「五行を嫌うとは、どういうことだ。」土地神「この果実は、金に触れれば落ち、木に触れれば枯れ、水に触れれば溶け、火に触れれば焦げ、土に触れれば潜ります。たたいて落とすには、必ず金属の道具が必要です。落としたら、絹の布を敷いた盆で受けなくてはいけません。木の器に少しでも触れると枯れ、食べても寿命は延びません。食べるときには磁器を使い、清水に溶かしていただきます。火に当たれば焦げて役に立ちません。土に触れると潜ると申したのは、大聖さまがさきほど地面へ落とされたとき、そのまま土中へ潜ったということです。この土には四万七千年の力が宿り、鋼のきりでも少しも掘れず、鋳鉄より三、四分も硬くなります。だからこそ人が食べれば長生きするのです。お疑いなら、この地面を打ってごらんなさい。」悟空は金箍棒（きんこぼう）を取り出して地を突いた。音がして棒は跳ね返り、土には跡もつかない。悟空「なるほど、本当だ。俺の棒は石なら粉々に砕き、鋳鉄でも傷がつくのに、今回は少しも傷つかない。それなら、俺が見当違いをしたわけだ。帰ってよいぞ。」土地神は自分の廟へ戻っていった。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「這個土有四萬七千年」は句が省略的で、土に果実の四万七千年の効力が移って硬化すると解した。土が硬いまま続く期間をいう可能性も残る。水に溶かす食法と、後続の丸のみ・咀嚼の描写は原文のまま併存させた。"
- "id": "xy-ch24-031"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖卻有算計：爬上樹，一隻手使擊子，一隻手將錦布直裰的襟兒扯起來做個兜子等住，他卻串枝分葉，敲了三個果，兜在襟中。跳下樹，一直前來，徑到廚房裡去。那八戒笑道：「哥哥，可有麼？」行者道：「這不是？老孫的手到擒來。這個果子，也莫背了沙僧，可叫他一聲。」八戒即招手叫道：「悟淨，你來。」那沙僧搬下行李，跑進廚房道：「哥哥，叫我怎的？」行者放開衣兜道：「兄弟，你看這個是甚的東西？」沙僧見了道：「是人參果。」行者道：「好啊！你倒認得，你曾在那裡吃過的？」沙僧道：「小弟雖不曾吃，但舊時做捲簾大將，扶侍鸞輿赴蟠桃宴，嘗見海外諸仙將此果與王母上壽。見便曾見，卻未曾吃。哥哥，可與我些兒嘗嘗？」行者道：「不消講，兄弟們一家一個。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 168
    "line_end": 168
  "translation_ja": "そこで悟空は工夫した。木に登り、片手に金撃子を持ち、もう片手で錦の直裰（ちょくたつ）の前裾をたくし上げ、袋のように広げて受けるのだ。枝を渡り、葉を分けて、実を三つ落とし、裾で受け止めた。木から跳び下りると、まっすぐ台所へ戻った。八戒は笑った。八戒「兄貴、あったかい。」悟空「ほら、このとおりだ。俺が手を出せば、すぐ手に入る。この果実を沙悟浄に内緒で食べるのはよくない。呼んでやれ。」八戒は手招きした。八戒「悟浄（ごじょう）、こっちへ来い。」沙悟浄は荷物を置いて台所へ駆け込んだ。沙悟浄「兄貴、何の用です。」悟空は裾を広げた。悟空「兄弟、これが何か分かるか。」沙悟浄「人参果です。」悟空「ほう、お前は知っているのか。どこで食べたことがあるんだ。」沙悟浄「私はまだ食べたことはありません。しかし昔、捲簾大将（けんれんたいしょう）として帝の御車に付き添い、蟠桃の宴へ参ったとき、海のかなたの仙人たちが、この果実を王母の長寿祝いに献じるのを見たことがあります。見たことはあっても、食べたことはありません。兄貴、少し味見させてもらえませんか。」悟空「言うまでもない。兄弟で一人一つずつだ。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-032"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他三人將三個果各各受用。那八戒食腸大，口又大，一則是聽見童子吃時，便覺饞蟲拱動，卻才見了果子，拿過來，張開口，轂轆的囫圇吞嚥下肚。卻白著眼胡賴，向行者、沙僧道：「你兩個吃的是甚麼？」沙僧道：「人參果。」八戒道：「甚麼味道？」行者道：「悟淨，不要睬他。──你倒先吃了，又來問誰？」八戒道：「哥哥，吃的忙了些，不像你們細嚼細嚥，嘗出些滋味。我也不知有核無核，就吞下去了。哥啊，為人為徹。已經調動我這饞蟲，再去弄個兒來，老豬細細的吃吃。」行者道：「兄弟，你好不知止足。這個東西，比不得那米食麵食，撞著儘飽。像這一萬年只結得三十個，我們吃他這一個，也是大有緣法，不等小可。罷罷罷，夠了。」他欠起身來，把一個金擊子，瞞窗眼兒，丟進他道房裡，竟不睬他。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 169
    "line_end": 169
  "translation_ja": "三人はそれぞれ一つずつ果実を食べた。八戒は胃袋も口も大きいうえ、童子たちが食べる音を聞いたときから、腹の虫がうずいていた。実を見るや手に取り、大口を開け、ころりと丸のみして腹へ納めた。それから目をむいて無理を言い、悟空と沙悟浄に尋ねた。八戒「二人が食べているのは何だ。」沙悟浄「人参果ですよ。」八戒「どんな味だ。」悟空「悟浄、相手にするな。お前は先に食べたくせに、今さら誰に聞いているんだ。」八戒「兄貴、ちょっと急いで食べたんだよ。二人のようによくかんでゆっくりのみ、味わわなかった。種があるかないかも分からないうちに、のみこんでしまったんだ。兄貴、人に親切にするなら最後までしてくれ。もう俺の腹の虫を起こしたんだから、もう一つ取ってきてくれよ。今度はゆっくり食べるから。」悟空「兄弟、お前は本当に足ることを知らんな。これは米や麺とは違って、手に入れば腹いっぱい食えるものじゃない。一万年に三十個しか実らぬのだ。俺たちが一つ食べたのも、大した縁あってのことで、並大抵ではない。もうよせ、よせ。これで十分だ。」悟空は腰を浮かせ、金撃子を窓の格子の隙間からそっと道童の部屋へ投げ戻すと、もう八戒を相手にしなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-033"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子只管絮絮叨叨的唧噥。不期那兩個道童復進房來取茶去獻，只聽得八戒還嚷甚麼「人參果吃得不快活，再得一個兒吃吃才好。」清風聽見，心疑道：「明月，你聽那長嘴和尚講：『人參果還要個吃吃。』師父別時叮嚀，教防他手下人囉唣，莫敢是他偷了我們寶貝麼？」明月回頭道：「哥耶，不好了，不好了，金擊子如何落在地下？我們去園裡看看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 171
    "line_end": 171
  "translation_ja": "それでも八戒は、いつまでもぶつぶつ文句を言い続けた。折しも二人の道童が、三蔵に差し上げる茶を取りに部屋へ戻ると、まだ八戒が騒いでいるのが聞こえた。八戒「人参果は食い足りなかったなあ。もう一つ食べられればいいのに。」清風は疑いを抱いた。清風「明月、あの口の長い和尚が『人参果をもう一つ食べたい』と言っている。師匠はお発ちになるとき、配下の者の騒ぎに気をつけろと念を押された。まさか、あいつらが私たちの宝を盗んだのではないか。」明月は振り返った。明月「兄さん、大変だ、大変だ。どうして金撃子が床に落ちているんだ。園へ見に行こう。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-034"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個急急忙忙的走去，只見花園開了。清風道：「這門是我關的，如何開了？」又急轉過花園，只見菜園門也開了。忙入人參園裡，倚在樹下，望上查數，顛倒來往，只得二十二個。明月道：「你可會算帳？」清風道：「我會，你說將來。」明月道：「果子原是三十個，師父開園，分吃了兩個，還有二十八個；適才打兩個與唐僧吃，還有二十六個；如今止剩得二十二個，卻不少了四個？不消講，不消講，定是那夥惡人偷了，我們只罵唐僧去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 172
    "line_end": 172
  "translation_ja": "二人は大急ぎで駆けつけると、花園の門が開いていた。清風「この門は私が閉めたのに、どうして開いているんだ。」急いで花園を通り抜けると、菜園の門も開いていた。あわてて人参果の園に入り、木の下から見上げて数を数えた。何度数え直しても二十二個しかない。明月「計算はできるかい。」清風「できる。言ってみな。」明月「実はもともと三十個だった。師匠が園を開いたとき、分けて二つ食べたから、二十八個残った。さっき唐僧に食べさせようと二つ落としたから、二十六個。それが今は二十二個しかない。四つ足りないではないか。もう考えるまでもない。あの悪党どもが盗んだに決まっている。唐僧を責めに行こう。」"
  "translation_status": "reviewed"
- "id": "xy-ch24-035"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兩個出了園門，徑來殿上，指著唐僧，禿前禿後，穢語污言，不絕口的亂罵；賊頭鼠腦，臭短臊長，沒好氣的胡嚷。唐僧聽不過道：「仙童啊，你鬧的是甚麼？消停些兒，有話慢說不妨，不要胡說散道的。」清風說：「你的耳聾？我是蠻話，你不省得？你偷吃了人參果，怎麼不容我說？」唐僧道：「人參果怎麼模樣？」明月道：「才拿來與你吃，你說像孩童的不是？」唐僧道：「阿彌陀佛！那東西一見，我就心驚膽戰，還敢偷他吃哩？就是害了饞痞，也不敢幹這賊事。不要錯怪了人。」清風道：「你雖不曾吃，還有手下人要偷吃的哩。」三藏道：「這等也說得是，你且莫嚷，等我問他們看。果若是偷了，教他賠你。」明月道：「賠呀！就有錢那裡去買？」三藏道：「縱有錢沒處買啊，常言道：『仁義值千金。』教他賠你個禮，便罷了。也還不知是他不是他哩。」明月道：「怎的不是他？他那裡分不均，還在那裡嚷哩。」三藏叫聲：「徒弟，且都來。」沙僧聽見道：「不好了，決撒了。老師父叫我們，小道童胡廝罵，不是舊話兒走了風，卻是甚的？」行者道：「活羞殺人。這個不過是飲食之類，若說出來，就是我們偷嘴了，只是莫認。」八戒道：「正是，正是，昧了罷。」他三人只得出了廚房，走上殿去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 173
    "line_end": 173
  "translation_ja": "二人は園の門を出ると、まっすぐ殿へ行き、三蔵を指さして、禿げだの何だのと、汚い言葉を絶え間なく浴びせた。盗賊顔だ、鼠頭だ、臭いの汚らしいのと、怒りにまかせて怒鳴り散らす。三蔵は聞くに堪えず言った。三蔵「仙童たち、何をそんなに騒ぐのです。少し静かにして、事情があるなら、ゆっくり話してください。やたらな悪口はいけません。」清風「耳が聞こえないのですか。私の言葉は異国の言葉で、分からないとでも。人参果を盗み食いしておきながら、文句も言わせないのですか。」三蔵「人参果とは、どんな形のものです。」明月「さっき持ってきたら、子供のようだとおっしゃった、あれではありませんか。」三蔵「阿弥陀仏（あみだぶつ）。あれは一目見ただけで心が震え上がったのに、盗んで食べられるものですか。たとえ食い意地の病にかかっても、そんな盗みはいたしません。人をお門違いに責めてはいけません。」清風「あなたが食べなくても、配下には盗んで食べる者がいるでしょう。」三蔵「それはもっともです。まず騒ぐのをやめて、あの者たちに尋ねさせてください。本当に盗んだのなら、償わせましょう。」明月「償うですって。金があったところで、どこで買えるのです。」三蔵「金があっても買う場所がないのなら、昔から『仁義は千金に値する』と言います。おわびさせて、それで収めてください。そもそも、あの者たちの仕業かどうか、まだ分かりません。」明月「どうして違うものですか。向こうでは分け前が不公平だと言って、まだ騒いでいるのですよ。」三蔵は呼んだ。三蔵「お前たち、皆こちらへ来なさい。」沙悟浄が聞きつけて言った。沙悟浄「まずい、ばれました。お師匠さまが呼んで、小さな道童たちはののしっている。さっきの話が漏れたのでなければ、何でしょう。」悟空「生き恥をかくことになったな。これはただの食べ物にすぎないが、口に出せば俺たちが盗み食いをしたことになる。とにかく認めるな。」八戒「そうだ、そうだ。しらを切ろう。」三人は仕方なく台所を出て、殿へ上がっていった。"
  "translation_status": "reviewed"
- "id": "xy-ch24-036"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎麼與他抵賴，且聽下回分解。"
  "source_languages":

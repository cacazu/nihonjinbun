    万寿山で大仙は旧友をもてなし、五荘観で悟空は人参果を盗む
  "translation_status": "reviewed"
- "id": "xy-ch24-002"
  "section_id": "chapter-24"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那三人穿林入裡，只見那獃子繃在樹上，聲聲叫喊，痛苦難禁。行者上前笑道：「好女婿呀，這早晚還不起來謝親，又不到師父處報喜，還在這裡賣解兒耍子哩。咄！你娘呢？你老婆呢？好個繃巴吊拷的女婿呀。」那獃子見他來搶白著羞，咬著牙，忍著疼，不敢叫喊。沙僧見了，老大不忍，放下行李，上前解了繩索救下。獃子對他們只是磕頭禮拜，其實羞恥難當。有《西江月》為證："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて、三蔵（さんぞう）たち三人が林の中へ入っていくと、八戒（はっかい）が木に縛りつけられ、耐えがたい痛みに声を上げ続けていた。悟空（ごくう）は近づいて笑った。悟空「よう、立派な婿殿。こんな時刻になっても起きて新しい親に礼をせず、お師匠さまにめでたい報告にも来ないで、まだここで曲芸を見せているのか。おい、お母さんはどうした。嫁さんはどこだ。まったく、縛られてつるされ、責められているとは、結構な婿殿だな。」八戒は、来るなりからかわれて恥ずかしくなり、歯を食いしばって痛みをこらえ、声も立てられなかった。沙悟浄（さごじょう）は見かねて荷物を下ろし、そばへ行って縄をほどき、助け下ろしてやった。八戒はただ皆に頭を地につけて礼を繰り返すばかりで、まことに恥ずかしくてたまらなかった。このことを歌う「西江月（せいこうげつ）」がある。"
  "translation_status": "reviewed"
- "id": "xy-ch24-003"
  "section_id": "chapter-24"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    色乃傷身之劍，貪之必定遭殃。佳人二八好容妝。更比夜叉兇壯。
    只有一個原本，再無微利添囊。好將資本謹收藏。堅守休教放蕩。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch24-1455573"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第024回&oldid=1455573"
    "line_start": 123
    "line_end": 124
  "translation_ja": |-
    色欲は身を傷つける剣、むさぼれば必ず災いを招く。十六の美女の美しい装いは、夜叉（やしゃ）よりなお恐ろしい。
    元手はただ一つきり、わずかな利も加えて蓄えることはできぬ。大切な資本をよくしまい、固く守って放蕩に費やすな。
  "translation_status": "reviewed"

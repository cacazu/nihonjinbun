  - "id": "xy-ch69-014"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那國王耽病設朝，請唐僧見了，即命眾官快往會同館參拜神僧孫長老取藥去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 139
        "line_end": 139
    "translation_ja": "さて国王は、病を抱えながら朝廷を開き、三蔵を招いて会うと、ただちに臣たちへ、早く会同館へ行って神僧孫長老（しんそうそんちょうろう）を拝し、薬を受け取ってくるよう命じた。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-015"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "多官隨至館中，對行者拜伏於地道：「我王特命臣等拜領妙劑。」行者叫八戒取盒兒，揭開蓋子，遞與多官。多官啟問：「此藥何名？好見王回話。」行者道：「此名烏金丹。」八戒二人暗中作笑道：「鍋灰拌的，怎麼不是烏金？」多官又問道：「用何引子？」行者道：「藥引兒兩般都下得。有一般易取者，乃六物煎湯送下。」多官問：「是何六物？」行者道：「半空飛的老鴉屁，緊水負的鯉魚尿，王母娘娘搽臉粉，老君爐裡煉丹灰，玉皇戴破的頭巾要三塊，還要五根困龍鬚。六物煎湯送此藥，你王憂病等時除。」多官聞言道：「此物乃世間所無者。請問那一般引子是何？」行者道：「用無根水送下。」眾官笑道：「這個易取。」行者道：「怎見得易取？」多官道：「我這裡人家俗論：若用無根水，將一個碗盞，到井邊或河下，舀了水，急轉步，更不落地，亦不回頭，到家與病人吃藥，便是。」行者道：「井中河內之水，俱是有根的。我這無根水，非此之論，乃是天上落下者，不沾地就吃，才叫做無根水。」多官又道：「這也容易。等到天陰下雨時，再吃藥便罷了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      臣たちは館に着くと、悟空の前で地にひれ伏した。
      臣たち「わが王が、妙薬を拝領してくるよう、私どもに特にお命じになりました。」
      悟空は八戒に箱を取らせ、蓋を開けて臣たちに渡した。臣たちは尋ねた。
      臣たち「この薬は何という名でございましょう。王にお目にかかって、ご報告したいのです。」
      悟空「烏金丹（うきんたん）という。」
      八戒と沙悟浄は、ひそかに笑い合った。
      八戒と沙悟浄「鍋の煤を混ぜたんだから、黒い金じゃないか。」
      臣たち「どんな薬引（やくいん）を用いればよいでしょう。」
      悟空「薬引は二通り、どちらでも飲める。手に入りやすいほうなら、六つの物を煎じた汁で飲ませればよい。」
      臣たち「どの六つでございます。」
      悟空「空飛ぶ烏の屁、急流を背に負う鯉の尿、王母（おうぼ）さまが顔に塗る白粉、太上老君（たいじょうろうくん）の炉で丹を練った灰、玉皇（ぎょくこう）がかぶり古した頭巾を三切れ、それに眠る竜の髭を五本。六つを煎じ、この薬を飲ませれば、お前たちの王の憂いの病も、たちどころに消えるだろう。」
      臣たち「それは、この世にはない品々でございます。もう一つの薬引とは何でしょう。」
      悟空「無根水（むこんすい）で飲めばよい。」
      臣たちは笑った。
      臣たち「それなら簡単に手に入ります。」
      悟空「どうして簡単だと分かる。」
      臣たち「この土地では、こう申します。無根水が要るなら、碗か小鉢を持って井戸端か川へ行き、水を汲むとすぐ足を返し、地面に置くことも、振り返ることもせず、家へ帰って病人に薬を飲ませる。それでよいのです。」
      悟空「井戸や川の水には、みな根がある。俺のいう無根水は、そんなものではない。天から降ってきた水を、地面に触れないうちに飲む。それこそ無根水というのだ。」
      臣たち「それもたやすいこと。空が曇って雨が降ったら、そのときに薬を飲めばよいのですな。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-016"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "遂拜謝了行者，將藥持回獻上。國王大喜，即命近侍接上來，看了道：「此是甚麼丸子？」多官道：「神僧說是『烏金丹』，用無根水送下。」國王便教宮人取無根水。眾官道：「神僧說，無根水不是井、河中者，乃是天上落下不沾地的才是。」國王即喚當駕官傳旨，教請法官求雨。眾官遵依出榜不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      臣たちは悟空に拝して礼を述べ、薬を持ち帰って献上した。国王は大いに喜び、近侍に受け取らせ、それを見て言った。
      国王「これは、何という丸薬だ。」
      臣たち「神僧さまは『烏金丹』と申し、無根水で飲むようにとのことでございます。」
      国王は宮人に無根水を取ってくるよう命じた。
      臣たち「神僧さまがおっしゃるには、無根水は井戸や川の水ではなく、天から降り、まだ地面に触れていない水だということです。」
      国王は、すぐに御前の役人を呼んで命令を伝え、法術を行う者を招いて雨乞いをさせるよう命じた。臣たちは従って布告を出した。このことは、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch69-017"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者在會同館廳上，叫豬八戒道：「適間允他天落之水，才可用藥，此時急忙，怎麼得個雨水？我看這王倒也是個大賢大德之君，我與你助他些兒雨下藥，如何？」八戒道：「怎麼樣助？」行者道：「你在我左邊立下，做個輔星。」又叫沙僧：「你在我右邊立下，做個弼宿。等老孫助他些無根水兒。」好大聖，步了罡訣，念聲咒語，早見那正東上一朵烏雲，漸近於頭頂上。叫道：「大聖，東海龍王敖廣來見。」行者道：「無事不敢捻煩，請你來助些無根水與國王下藥。」龍王道：「大聖呼喚時，不曾說用水，小龍隻身來了，不曾帶得雨器，亦未有風雲雷電，怎生降雨？」行者道：「如今用不著風雲雷電，亦不須多雨，只要些須引藥之水便了。」龍王道：「既如此，待我打兩個噴涕，吐些涎津溢，與他吃藥罷。」行者大喜道：「最好，最好。不必遲疑，趁早行事。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      一方、悟空は会同館の広間で八戒を呼んだ。
      悟空「さっきは天から落ちる水でなければ薬は飲めないと言ってやったが、この急なときに、どうして雨水が手に入るだろう。見たところ、この王はなかなか賢く徳もある君主だ。お前と俺とで、薬を飲むための雨を少し降らせてやるのはどうだ。」
      八戒「どうやって助けるんだ。」
      悟空「俺の左に立ち、輔星（ほせい）の役をしてくれ。」
      続いて沙悟浄を呼んだ。
      悟空「お前は俺の右に立ち、弼宿（ひつしゅく）の役をしてくれ。この俺が、少しばかり無根水を用意してやろう。」
      さて悟空が星の位置を踏む秘法を行い、呪文を唱えると、早くも真東に一かたまりの黒雲が見え、次第に頭上へ近づいてきた。そこから敖広（ごうこう）が呼ばわった。
      敖広「大聖、東海竜王（とうかいりゅうおう）の敖広が、お目にかかりに参りました。」
      悟空「用もなくお煩わせはしない。来てもらったのは、国王が薬を飲むための無根水を、少し助けてもらいたいからだ。」
      敖広「大聖がお呼びのときには、水が要るとはおっしゃいませんでした。私は身一つで参り、雨の道具を持っておりません。風も雲も雷も稲妻もそろえていないのに、どうして雨を降らせましょう。」
      悟空「今は風も雲も雷も稲妻も要らない。大雨も必要ない。ただ薬引にする水が、ほんの少しあればよいのだ。」
      敖広「それでしたら、くしゃみを二つして、少し唾液を吐き出し、薬を飲ませましょう。」
      悟空は大喜びした。
      悟空「それがよい、それがよい。ためらわず、早く取りかかってくれ。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-018"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老龍在空中漸漸低下烏雲，直至皇宮之上，隱身潛像，噀一口津唾，遂化作甘霖。那滿朝官齊聲喝采道：「我主萬千之喜，天公降下甘雨來也。」國王即傳旨，教：「取器皿盛著，不拘宮內外及官大小，都要等貯仙水，拯救寡人。」你看那文武多官並三宮六院妃嬪與三千綵女、八百嬌娥，一個個擎杯托盞，舉碗持盤，等接甘雨。那老龍在半空運化津涎，不離了王宮前後。將有一個時辰，龍王辭了大聖回海。眾臣將杯盂碗盞收來，也有等著一點兩點者，也有等著三點五點者，也有一點不曾等著者，共合一處，約有三盞之多，總獻至御案。真個是異香滿襲金鑾殿，佳味熏飄天子庭。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      敖広は空から次第に黒雲を低くし、王宮の真上へ来ると、姿を隠して一口の唾を吹き出した。それがたちまち恵みの雨となった。朝廷じゅうの臣たちが、一斉に喝采した。
      臣たち「わが君、幾重にもおめでとうございます。天がお恵みの雨を降らせてくださいました！」
      国王はすぐに命令を下した。
      国王「器を取って受けよ。宮中の内外を問わず、官位の上下を問わず、みな仙水を待ち受けて蓄え、余を救うのだ。」
      見ると、文武の臣たちも、三宮六院（さんぐうりくいん）の妃嬪も、三千の綵女（さいじょ）、八百の美女たちも、一人ずつ杯を捧げ、小鉢を支え、碗を上げ、盤を持って、恵みの雨を待ち受けた。敖広は空中で唾液を変化させ、王宮の前後を離れなかった。一時辰（じしん）ほどたつと、悟空に暇を告げ、海へ帰っていった。臣たちが杯や鉢や碗を集めると、一滴、二滴を受けた者も、三滴、五滴を受けた者も、一滴も受けられなかった者もいた。全部を合わせて、三杯ほど。それをすべて御机に献上した。まことに、珍しい香りは金鑾殿（きんらんでん）いっぱいに満ち、美味なる気は天子の庭に漂ったのである。
    "translation_status": "reviewed"
  - "id": "xy-ch69-019"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王辭了法師，將著烏金丹並甘雨至宮中，先吞了一丸，吃了一盞甘雨；再吞了一丸，又飲了一盞甘雨；三次，三丸俱吞了，三盞甘雨俱送下。不多時，腹中作響，如轆轤之聲不絕。即取淨桶，連行了三五次。服了些米飲，攲倒在龍床之上。有兩個妃子將淨桶檢看，說不盡那穢污痰涎，內有糯米飯塊一團。妃子近龍床前來報：「病根都行下來也。」國王聞此言，甚喜，又進一次米飯。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      国王は法師に別れを告げ、烏金丹と恵みの雨を持って宮中へ戻った。まず一丸を飲み込み、雨水を一杯飲んだ。さらに一丸を飲み込み、また雨水を一杯飲んだ。三度繰り返し、三丸とも飲み込み、三杯の雨水ですべてを流し込んだ。ほどなく腹が鳴りだし、轆轤のような音が絶えなくなった。すぐ便器を取り、続けざまに三、五回便を下した。それから少し重湯を飲み、竜床に横になった。二人の妃が便器を調べると、言い尽くせないほどの汚物や痰や涎の中に、もち米飯の塊が一つあった。妃は竜床のそばへ来て報告した。
      妃「病の根が、すっかり下りました。」
      国王はこの言葉を聞いて大いに喜び、もう一度、米の飯を食べた。
    "translation_status": "reviewed"
  - "id": "xy-ch69-020"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃，漸覺胸心寬泰，氣血調和，就精神抖擻，腳力強健。下了龍床，穿上朝服，即登寶殿，見了唐僧，輒倒身下拜。那長老忙忙還禮。拜畢，以御手攙著，便教閣下：「快具簡帖，帖上寫朕『再拜頓首』字樣，差官奉請法師高徒三位。一壁廂大開東閣，光祿寺排宴酬謝。」多官領旨，具簡的具簡，排宴的排宴，正是：國家有倒山之力，霎時俱完。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      しばらくすると、次第に胸のつかえが取れて心地よくなり、気血も調い、精神は奮い立ち、足にも力がみなぎった。竜床を下り、朝服を着て宝殿へ上がると、三蔵を見るなり身を伏せて拝した。三蔵は慌てて礼を返した。拝礼を終えると、国王は自らの手で三蔵を支え、閣老たちに命じた。
      国王「急いで招待状を用意し、朕が『再拝頓首（さいはいとんしゅ）』すると書き添え、役人を遣わして、法師の三人の高弟を丁重にお招きせよ。一方では東閣（とうかく）を大きく開き、光禄寺（こうろくじ）に礼の宴を調えさせよ。」
      臣たちは命を受け、招待状を作る者は作り、宴を設ける者は設けた。まさに、国家には山をも倒す力がある。すべて、たちまち整った。
    "translation_status": "reviewed"
  - "id": "xy-ch69-021"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說八戒見官投簡，喜不自勝道：「哥啊，果是好妙藥。今來酬謝，乃兄長之功。」沙僧道：「二哥說那裡話，常言道：『一人有福，帶挈一屋。』我們在此合藥，俱是有功之人。只管受用去，再休多話。」咦！你看他弟兄們俱歡歡喜喜，徑入朝來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      さて八戒は、役人が招待状を持ってきたのを見ると、うれしくてたまらず言った。
      八戒「兄貴、本当にすごい薬だったな。こうしてお礼に呼ばれるのも、兄貴のお手柄だ。」
      沙悟浄「二番目の兄さん、何を言うんだい。『一人に福があれば、家じゅうに及ぶ』というじゃないか。私たちもここで薬を調えたのだから、みな手柄を立てたのだ。遠慮なくご馳走になろう。もう余計なことは言わなくていい。」
      さあ、ご覧あれ。兄弟弟子たちはみな、喜び勇んで宮中へ入っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch69-022"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾官接引，上了東閣，早見唐僧、國王、閣老，已都在那裡安排筵宴哩。這行者與八戒、沙僧對師父唱了個喏。隨後眾官都至。只見那上面有四張素桌面，都是吃一看十的筵席。前面有一張葷桌面，也是吃一看十的珍饈。左右有四五百張單桌面，真個排得齊整："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 151
        "line_end": 151
    "translation_ja": "臣たちに案内されて東閣へ上がると、三蔵、国王、閣老たちは、すでにそこで宴の用意をしていた。悟空は八戒、沙悟浄とともに、師に声をかけて礼をした。その後、臣たちもみなやって来た。見ると、上座には精進料理の卓が四つあり、いずれも一品食べれば十品を眺めるほどの宴席だった。その前には肉料理の卓が一つあり、こちらも一品食べれば十品を眺めるほどの珍味である。左右には四、五百もの一人用の卓が、まことに整然と並んでいた。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-023"
    "section_id": "chapter-69"
    "kind": "verse"
    "origin": "source"
    "source_text": "古云：「珍饈百味，美祿千鍾。瓊膏酥酪，錦縷肥紅。」寶妝花彩豔，果品味香濃。斗糖龍纏列獅仙，餅錠拖爐擺鳳侶。葷有豬羊雞鵝魚鴨般般肉，素有蔬餚筍芽木耳並蘑菇。幾樣香湯餅，數次透糖酥。滑軟黃粱飯，清新菰米糊。色色粉湯香又辣，般般添換美還甜。君臣舉盞方安席，名分品級慢傳壺。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      古くいう。「珍味は百種、美酒は千杯。玉の膏、酥（そ）と酪（らく）、錦糸のような細切り、赤く肥えた肉。」
      宝の飾りのように花は色鮮やか、果物は味も香りも濃やか。
      斗糖（とうとう）や竜纏（りゅうてん）に獅子と仙人を並べ、餅錠（へいてい）や拖炉（たろ）には鳳凰のつがいを配す。
      肉の料理には豚、羊、鶏、鵞鳥、魚、鴨と、ありとあらゆる肉、
      精進には野菜の料理、筍の芽、木耳、それに茸。
      香りよい汁麺が幾種も、砂糖をしみ込ませた菓子が幾度も出る。
      滑らかで柔らかい黄粱（こうりょう）の飯、清らかで新鮮な菰米（こべい）の粥。
      色とりどりの粉の汁物は香りよく、ぴりりと辛く、
      次々と取り替える料理はうまく、また甘い。
      君臣は杯を挙げて、ようやく席に落ち着き、
      身分と官位の順に従い、ゆるやかに酒壺を巡らせる。
    "translation_status": "reviewed"
  - "id": "xy-ch69-024"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王御手擎杯，先與唐僧安坐。三藏道：「貧僧不會飲酒。」國王道：「素酒，法師飲此一杯何如？」三藏道：「酒乃僧家第一戒。」國王甚不過意道：「法師戒飲，卻以何物為敬？」三藏道：「頑徒三眾代飲罷。」國王卻才歡喜，轉金卮，遞與行者。行者接了酒，對眾禮畢，吃了一杯。國王見他吃得爽利，又奉一杯。行者不辭，又吃了。國王笑道：「吃個三寶鍾兒。」行者不辭，又吃了。國王又叫斟上，吃個四季杯兒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      国王は自ら杯を取り、まず三蔵の席に進んで酒を勧めた。
      三蔵「私は酒をいただけません。」
      国王「精進の素酒（そしゅ）です。法師、この一杯はいかがかな。」
      三蔵「酒を断つことは、僧の第一の戒めでございます。」
      国王は、たいそう申し訳なく思った。
      国王「法師が飲酒を戒めておられるなら、何をもって敬意を表せばよいのだろう。」
      三蔵「不肖の三人の弟子に、代わりに飲ませてください。」
      国王はそこでようやく喜び、金の杯を悟空へ回した。悟空は酒を受け取り、一同へ礼をして、一杯飲んだ。国王は、その飲みっぷりのよさを見て、さらに一杯差し出した。悟空は断らず、それも飲んだ。
      国王は笑った。
      国王「三宝にちなみ、三杯目も。」
      悟空は断らず、また飲んだ。国王はさらに注がせ、四季にちなむ四杯目も飲ませようとした。
    "translation_status": "reviewed"
  - "id": "xy-ch69-025"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒在旁，見酒不到他，忍得他嘓嘓嚥唾。又見那國王苦勸行者，他就叫將起來道：「陛下，吃的藥也虧了我，那藥裡有馬……」這行者聽說，恐怕獃子走了消息，卻將手中酒遞與八戒。八戒接著就吃，卻不言語。國王問道：「神僧說藥裡有馬，是甚麼馬？」行者接過口來道：「我這兄弟是這般口敞，他有個經驗的好方兒，他就要說與人。陛下早間吃藥，內有馬兜鈴。」國王問眾官道：「馬兜鈴是何品味？能醫何症？」時有太醫院官在旁道：「主公："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      八戒はそばで、酒が自分へ回ってこないのを見ながら、我慢してごくりごくりと唾を飲んでいた。国王がまだ悟空にしきりと勧めるのを見ると、とうとう叫びだした。
      八戒「陛下、飲まれた薬は、俺にも世話になっているんですよ。あの薬には馬の……」
      悟空はそれを聞き、八戒が秘密を漏らすのを恐れて、手の杯を八戒へ渡した。八戒は受け取ると、すぐ飲み、もう何も言わなかった。
      国王「神僧が、薬の中に馬が入っていると言われたが、何という馬なのだ。」
      悟空はすかさず引き取った。
      悟空「この弟は、こんなふうに口が軽いのです。経験のあるよい処方を持っていると、すぐ人に話したがる。陛下が今朝お飲みになった薬には、馬兜鈴（ばとうれい）が入っていました。」
      国王は臣たちに尋ねた。
      国王「馬兜鈴とは、どのような薬で、どんな症を治すのだ。」
      そのとき、そばにいた太医院の官が申し上げた。
      太医院の官「陛下。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-026"
    "section_id": "chapter-69"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      兜鈴味苦寒無毒，定喘消痰大有功。
      通氣最能除血蠱，補虛寧嗽又寬中。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 157
        "line_end": 158
    "translation_ja": |-
      太医院の官「兜鈴（とうれい）は苦味で寒性、毒はなく、喘ぎを鎮め痰を消す功が大きい。
      気を通して血蠱（けっこ）を除くのに最も優れ、虚を補い、咳を鎮め、胸腹のつかえも除く。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-027"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王笑道：「用得當，用得當。豬長老再飲一杯。」獃子亦不言語，卻也吃了個三寶鍾。國王又遞了沙僧酒，也吃了三杯，卻俱敘坐。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      国王は笑った。
      国王「まことにふさわしい薬だ、ふさわしい薬だ。猪長老（ちょちょうろう）、もう一杯飲まれよ。」
      八戒はやはり何も言わず、こちらも三宝にちなむ三杯を飲んだ。国王は沙悟浄にも酒を渡し、沙悟浄も三杯飲んで、それから一同は席順どおりに座った。
    "translation_status": "reviewed"
  - "id": "xy-ch69-028"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "飲宴多時，國王又擎大爵，奉與行者。行者道：「陛下請坐。老孫依巡痛飲，決不敢推辭。」國王道：「神僧恩重如山，寡人酬謝不盡。好歹進此一巨觥，朕有話說。」行者道：「有甚話說了，老孫好飲。」國王道：「寡人有數載憂疑病，被神僧一貼靈丹打通，所以就好了。」行者笑道：「昨日老孫看了陛下，已知是憂疑之疾，但不知憂疑何事？」國王道：「古人云：『家醜不可外談。』奈神僧是朕恩主，惟不笑，方可告之。」行者道：「怎敢笑話？請說無妨。」國王道：「神僧東來，不知經過幾個邦國？」行者道：「經有五六處。」又問：「他國之后，不知是何稱呼。」行者道：「國王之后，都稱為正宮、東宮、西宮。」國王道：「寡人不是這等稱呼：將正宮稱為金聖宮，東宮稱為玉聖宮，西宮稱為銀聖宮。現今只有銀、玉二后在宮。」行者道：「金聖宮因何不在宮中？」國王滴淚道：「不在已三年矣。」行者道：「向那廂去了？」國王道：「三年前，正值端陽之節，朕與嬪后都在御花園海榴亭下解粽插艾，飲菖蒲雄黃酒，看鬥龍舟。忽然一陣風至，半空中現出一個妖精，自稱賽太歲，說他在麒麟山獬豸洞居住，洞中少個夫人，訪得我金聖宮生得貌美嬌姿，要做個夫人，教朕快早送出；如若三聲不獻出來，就要先吃寡人，後吃眾臣，將滿城黎民盡皆吃絕。那時節，朕卻憂國憂民，無奈，將金聖宮推出海榴亭外，被那妖響一聲攝將去了。寡人為此著了驚恐，吃那粽子，凝滯在內；況又晝夜憂思不息：所以成此苦疾三年。今得神僧靈丹服後，行了數次，盡是那三年前積滯之物，所以這會體健身輕，精神如舊。今日之命，皆是神僧所賜，豈但如泰山之重而已乎！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"

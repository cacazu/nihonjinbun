    "translation_ja": |-
      第六十九回
      心の主は夜に薬を調え　君王は宴席で妖邪を語る
    "translation_status": "reviewed"
  - "id": "xy-ch69-002"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表孫大聖同近侍宦官到於皇宮內院，直至寢宮門外立定。將三條金線與宦官拿入裡面，吩咐：「教內宮妃后，或近侍太監，先繫在聖躬左手腕下，按寸、關、尺三部上，卻將線頭從窗櫺兒穿出與我。」真個那宦官依此言，請國王坐在龍床，按寸、關、尺，以金線一頭繫了，一頭理出窗外。行者接了線頭，以自己右手大指先托著食指，看了寸脈；次將中指按大指，看了關脈；又將大指托定無名指，看了尺脈。調停自家呼吸，分定四氣、五鬱、七表、八裡、九候、浮中沉、沉中浮，辨明了虛實之端。又教解下左手，依前繫在右手腕下部位。行者即以左手指，一一從頭診視畢，卻將身抖了一抖，把金線收上身來。厲聲高呼道：「陛下左手寸脈強而緊，關脈濇而緩，尺脈芤且沉；右手寸脈浮而滑，關脈遲而結，尺脈數而牢。夫左寸強而緊者，中虛心痛也；關濇而緩者，汗出肌麻也；尺芤而沉者，小便赤而大便帶血也。右手寸脈浮而滑者，內結經閉也；關遲而結者，宿食留飲也；尺數而牢者，煩滿虛寒相持也。診此貴恙，是一個驚恐憂思，號為『雙鳥失群』之症。」那國王在內聞言，滿心歡喜，打起精神，高聲應道：「指下明白，指下明白，果是此疾。請出外面用藥來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      さて、悟空（ごくう）は近侍の宦官と宮中の内院へ入り、寝殿の門の外まで来て立ち止まった。三本の金の糸を宦官に渡して中へ持たせ、悟空は言いつけた。
      悟空「奥の妃さまか、そばに仕える太監（たいかん）に、まず陛下の左の手首の下、寸・関・尺（すん・かん・しゃく）の三つの部位に糸を結んでもらい、その端を窓の格子から通して俺によこしてくれ。」
      宦官はそのとおりにし、国王を竜床（りゅうしょう）に座らせ、寸・関・尺の位置に糸の一端を結び、もう一端をそろえて窓の外へ出した。悟空は糸の端を受け取り、まず右手の親指で人差し指を支え、寸の脈を診た。次に中指を親指へ押し当てて関の脈を診てから、親指で薬指を支えて尺の脈を診た。自分の呼吸を調え、四気（しき）・五鬱（ごうつ）・七表（しちひょう）・八裏（はちり）・九候（きゅうこう）、浮の中の沈、沈の中の浮をそれぞれ見分け、虚実のありさまを明らかにした。それから左手の糸を解かせ、前と同じように右手首の部位に結ばせた。悟空は左手の指で、一つずつ初めから診終えると、体をひと振りし、金の糸を自分の身に収めた。そして鋭い声で呼ばわった。
      悟空「陛下の左手の寸の脈は強く張り、関の脈は渋く緩やか、尺の脈は中空で沈んでいます。右手の寸の脈は浮いて滑らか、関の脈は遅く途切れ、尺の脈は速く堅い。左の寸が強く張るのは、内が虚して胸が痛むこと。関が渋く緩やかなのは、汗が出て肌がしびれること。尺が中空で沈むのは、小便が赤く、大便に血が交じることです。右手の寸が浮いて滑らかなのは、内にしこりができ、経脈がふさがること。関が遅く途切れるのは、古い食物と水分が体にたまっていること。尺が速く堅いのは、胸苦しく張る症状と、衰弱による冷えとがせめぎ合っていることです。診たところ、陛下のご病気は驚き恐れ、思い悩んで起こった、『双鳥失群（そうちょうしつぐん）』という症でございます。」
      国王は中でこれを聞き、心から喜び、気力を振り起こして大声で答えた。
      国王「指先でよく分かった、指先でよく分かった。まさにその病なのだ。外へ出て、薬を調えてきてくだされ。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-003"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖卻才緩步出宮。早有在傍聽見的太監，已先對眾報知。須臾，行者出來，唐僧即問如何。行者道：「診了脈，如今對症製藥哩。」眾官上前道：「神僧長老適才說『雙鳥失群』之症，何也？」行者笑道：「有雌雄二鳥，原在一處同飛，忽被暴風驟雨驚散，雌不能見雄，雄不能見雌，雌乃想雄，雄亦想雌：這不是『雙鳥失群』也？」眾官聞說，齊聲喝采道：「真是神僧！真是神醫！」稱讚不已。當有太醫官問道：「病勢已看出矣，但不知用何藥治之？」行者道：「不必執方，見藥就要。」醫官道：「經云：『藥有八百八味，人有四百四病。』病不在一人之身，藥豈有全用之理？如何見藥就要？」行者道：「古人云：『藥不執方，合宜而用。』故此全徵藥品，而隨便加減也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      悟空はそこでようやく、ゆっくりと宮中を出た。そばで聞いていた太監が、すでに先回りして一同に知らせていた。ほどなく悟空が出てくると、三蔵（さんぞう）はどうだったかと尋ねた。
      悟空「脈は診ました。これから症に合う薬を作るところです。」
      臣たちは進み出た。
      臣たち「神僧さま、先ほどおっしゃった『双鳥失群』の症とは、何でございましょう。」
      悟空は笑った。
      悟空「雄と雌の二羽の鳥が、もとは一緒に飛んでいた。それが突然、激しい風雨に驚いて離れ離れになり、雌は雄に会えず、雄は雌に会えない。雌は雄を思い、雄も雌を思う。これが『二羽の鳥が仲間とはぐれた』ということじゃないか。」
      臣たちは聞くと、声をそろえて喝采した。
      臣たち「まことに神僧、まことに神医でございます！」
      称賛がやまぬところへ、一人の医官が尋ねた。
      医官「病状はお見抜きになりましたが、どの薬で治されるのでしょう。」
      悟空「決まった処方にとらわれることはない。ある薬は何でも持ってこい。」
      医官「医書には『薬には八百八味、人には四百四病がある』と申します。あらゆる病が一人の体にあるわけではないのに、薬をすべて使う道理がございましょうか。なぜ、ある薬は何でもとおっしゃるのです。」
      悟空「昔の人は『薬は処方にとらわれず、適切に用いる』と言った。だから、すべての薬を取り寄せて、必要に応じて加減するのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-004"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那醫官不復再言，即出朝門之外，差本衙當值之人，遍曉滿城生熟藥鋪，即將藥品。每味各辦三斤，送與行者。行者道：「此間不是製藥處，可將諸藥之數並製藥一應器皿，都送入會同館，交與我師弟二人收下。」醫官聽命，即將八百八味每味三斤及藥碾、藥磨、藥羅、藥乳並乳缽、乳槌之類都送至館中，一一交付收訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      医官はそれ以上何も言わず、朝門の外へ出ると、役所で当直している者たちを遣わし、都じゅうの生薬や調製薬を売る店に触れさせ、薬を一種類につき三斤（きん）ずつ用意して、悟空へ届けさせた。
      悟空「ここは薬を作る場所ではない。薬は全部、製薬に要る道具一式とともに会同館（かいどうかん）へ運び、俺の二人の弟弟子に渡してくれ。」
      医官は命に従い、八百八味の薬を三斤ずつ、薬研、薬のひき臼、薬をふるう篩、薬をすりつぶす道具に乳鉢、乳棒のたぐいまで、すべて館へ運ばせ、一つずつ確かに引き渡した。
    "translation_status": "reviewed"
  - "id": "xy-ch69-005"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者往殿上請師父同至館中製藥。那長老正自起身，忽見內宮傳旨，教閣下留住法師，同宿文華殿。待明朝服藥之後，病痊酬謝，倒換關文送行。三藏大驚道：「徒弟啊，此意是留我做當頭哩。若醫得好，歡喜起送；若醫不好，我命休矣。你須仔細上心，精虔制度也。」行者笑道：「師父放心在此受用，老孫自有醫國之手。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      悟空は殿上へ行き、師にも館での製薬に同行してもらおうとした。三蔵がちょうど立ち上がると、宮中から命令が伝わり、閣老たちに法師を引き留め、文華殿（ぶんかでん）で一緒に泊まるようにという。明朝、薬を服用して病が治ったら礼をし、通行文書を取り替えて送り出すというのである。三蔵は大いに驚いた。
      三蔵「弟子よ、これは私を担保に取っておくつもりなのだ。うまく治せば喜んで送り出してくれるが、治せなければ、私の命はない。十分気をつけて、心を込め、念入りに薬を作っておくれ。」
      悟空は笑った。
      悟空「お師匠さまは、安心してここでもてなしを受けていてください。私には王さまを治す腕がございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-006"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，別了三藏，辭了眾臣，徑至館中。八戒迎著笑道：「師兄，我知道你了。」行者道：「你知甚麼？」八戒道：「知你取經之事不果，欲作生涯無本，今日見此處富庶，設法要開藥鋪哩。」行者喝道：「莫胡說，醫好國王，得意處辭朝走路，開甚麼藥鋪？」八戒道：「終不然，這八百八味藥，每味三斤，共計二千四百二十四斤，只醫一人，能用多少？不知多少年代方吃得了哩。」行者道：「那裡用得許多？他那太醫院官都是些愚盲之輩，所以取這許多藥品，教他沒處捉摸，不知我用的是那幾味，難識我神妙之方也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      さて悟空は三蔵と別れ、臣たちにも暇を告げて、まっすぐ館へ戻った。八戒（はっかい）が出迎え、笑いながら言った。
      八戒「兄貴、何を考えているか分かったぞ。」
      悟空「何が分かった。」
      八戒「経を取りに行くことは実を結ばず、商売をしようにも元手がない。今日、この国が豊かなのを見て、薬屋を開く算段をしているんだろう。」
      悟空は叱った。
      悟空「でたらめを言うな。国王を治せば、めでたく宮中を辞して旅を続けるのだ。何が薬屋だ。」
      八戒「そうでなけりゃ、八百八味の薬を三斤ずつ、合わせて二千四百二十四斤も、一人を治すのにどれほど使うんだ。飲み切るには何年かかるか分からないぞ。」
      悟空「そんなに使うものか。太医院（たいいいん）の役人どもは、みな物の分からぬ連中だから、わざとあれほどの薬を取り寄せたのだ。何を使ったのか見当もつかず、俺の妙なる処方を見抜けないようにな。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-007"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，只見兩個館使當面跪下道：「請神僧老爺進晚齋。」行者道：「早間那般待我，如今卻跪而請之，何也？」館使叩頭道：「老爺來時，下官有眼無珠，不識尊顏。今聞老爺大展三折之肱，治我一國之主，若主上病愈，老爺江山有分，我輩皆臣子也，禮當拜請。」行者見說，欣然登堂上坐；八戒、沙僧分坐左右。擺上齋來，沙僧便問道：「師兄，師父在那裡哩？」行者笑道：「師父被國王留住作當頭哩。只待醫好了病，方才酬謝送行。」沙僧又問：「可有些受用麼？」行者道：「國王豈無受用？我來時，他已有三個閣老陪侍左右，請入文華殿去也。」八戒道：「這等說，還是師父大哩：他倒有閣老陪侍，我們只得兩個館使奉承。且莫管他，讓老豬吃頓飽飯也。」兄弟們遂自在受用一番。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      そう話していると、二人の館使が目の前にひざまずいた。
      二人の館使「神僧さま、どうぞ夕の精進をお召し上がりください。」
      悟空「朝はあんな扱いをしておきながら、今はひざまずいて招くとは、どういうわけだ。」
      館使は頭を地につけた。
      館使「おいでの折には、私どもは目がありながら見えず、お見それいたしました。今、長老さまが腕を三度折ったほどの経験から得た医術を存分に振るい、わが国の主をお治しくださると伺いました。もし主上の病が癒えれば、長老さまも国土の分け前をお受け取りになり、私どもはみな臣下となります。礼に従って、拝してお招きするのが当然でございます。」
      悟空はそれを聞いて、喜んで広間へ上がり、上座に着いた。八戒と沙悟浄（さごじょう）は左右に座った。食事が並ぶと、沙悟浄が尋ねた。
      沙悟浄「兄さん、お師匠さまはどこにいらっしゃるんだい。」
      悟空は笑った。
      悟空「国王がお師匠さまを担保に引き留めたのさ。病が治ってから、礼をして送り出すというんだ。」
      沙悟浄「何か、もてなしは受けられるのかい。」
      悟空「国王の所で、もてなしがないものか。俺が来るときには、もう三人の閣老が左右に付き添い、文華殿へ案内していたぞ。」
      八戒「それなら、やっぱりお師匠さまが偉いのだな。あちらには閣老が付き添い、俺たちには館使が二人、機嫌を取るだけだ。まあ、そっちは放っておこう。俺に腹いっぱい飯を食わせてくれ。」
      兄弟弟子たちは、気兼ねなくひとしきり食事を楽しんだ。
    "translation_status": "reviewed"
  - "id": "xy-ch69-008"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "天色已晚。行者叫館使：「收了家火，多辦些油蠟，我等到夜靜時，方好製藥。」館使果送若干油蠟，各命散訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      日はすっかり暮れた。悟空は館使を呼んだ。
      悟空「食器を片づけて、灯油と蝋燭を多めに用意してくれ。夜が静まってからなら、薬を作るのに都合がよい。」
      館使は、さっそく幾らかの油と蝋燭を届けた。それから皆は、それぞれ命じられて下がった。
    "translation_status": "reviewed"
  - "id": "xy-ch69-009"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "至半夜，天街人靜，萬籟無聲。八戒道：「哥哥，製何藥？趕早幹事，我瞌睡了。」行者道：「你將大黃取一兩來，碾為細末。」沙僧乃道：「大黃味苦，性寒無毒。其性沉而不浮，其用走而不守。奪諸鬱而無壅滯，定禍亂而致太平。名之曰『將軍』。此行藥耳，但恐久病虛弱，不可用此。」行者笑道：「賢弟不知。此藥利痰順氣，蕩肚中凝滯之寒熱。你莫管我。你去取一兩巴豆，去殼去膜，搥去油毒，碾為細末來。」八戒道：「巴豆味辛，性熱有毒。削堅積，蕩肺腑之沉寒；通閉塞，利水穀之道路。乃斬關奪門之將，不可輕用。」行者道：「賢弟，你也不知。此藥破結宣腸，能理心膨水脹。快製來，我還有佐使之味輔之也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      真夜中になると、都の大路も人が静まり、物音一つしなくなった。
      八戒「兄貴、どんな薬を作るんだ。早いところ仕事に取りかかろう。俺は眠くなったぞ。」
      悟空「大黄（だいおう）を一両（りょう）取り、細かい粉に挽いてくれ。」
      沙悟浄「大黄は味が苦く、性質は寒で、毒はない。その性質は沈んで浮かず、働きは走ってとどまらない。さまざまな鬱滞を取り除いて詰まりをなくし、災いと乱れを鎮めて太平をもたらす。だから『将軍』と呼ばれる。これは下す薬だが、長患いで弱っている人には、使えないのではないか。」
      悟空は笑った。
      悟空「弟よ、分かっていないな。この薬は痰を通し、気の流れを整え、腹に凝り滞った寒熱を払い去るのだ。俺のことに口を出すな。お前は巴豆（はず）を一両取って、殻と薄皮を除き、搗いて油と毒を抜き、細かい粉に挽いてきてくれ。」
      八戒「巴豆は味が辛く、性質は熱で、毒がある。堅い積もりを削り取り、肺腑の奥の寒を払い、閉じふさがった所を開き、水や食物の通り道をよくする。いわば関所を破って城門を奪う将軍だ。軽々しく使ってはいけないぞ。」
      悟空「お前も分かっていないな。この薬は固まりを破り、腸を通し、胸の張りや水のたまった膨れを治めるのだ。早く調えてこい。ほかに佐使（さし）となって助ける薬もある。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-010"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他二人即時將二藥碾細道：「師兄，還用那幾十味？」行者道：「不用了。」八戒道：「八百八味，每味三斤，只用此二兩，誠為起奪人了。」行者將一個花磁盞子，道：「賢弟莫講，你拿這個盞兒，將鍋臍灰刮半盞過來。」八戒道：「要怎的？」行者道：「藥內要用。」沙僧道：「小弟不曾見藥內用鍋灰。」行者道：「鍋灰名為『百草霜』，能調百病，你不知道。」那獃子真個刮了半盞，又碾細了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      二人はすぐに二種の薬を細かく挽いた。
      八戒と沙悟浄「兄さん、ほかには何十種類使うんだい。」
      悟空「もう使わない。」
      八戒「八百八味を三斤ずつ集めて、使うのはこの二両だけか。まったく人をからかっているな。」
      悟空は絵付けの磁器の小鉢を持った。
      悟空「弟よ、文句を言うな。これを持って、鍋底の煤を半分ほど削り取ってきてくれ。」
      八戒「何にするんだ。」
      悟空「薬に入れる。」
      沙悟浄「薬に鍋の煤を入れるのは、見たことがないよ。」
      悟空「鍋の煤は『百草霜（ひゃくそうそう）』といって、いろいろな病を調えるのだ。お前は知らないのさ。」
      八戒は本当に小鉢半分の煤を削り取り、これも細かく挽いた。
    "translation_status": "reviewed"
  - "id": "xy-ch69-011"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者又將盞子遞與他道：「你再去把我們的馬尿等半盞來。」八戒道：「要他怎的？」行者道：「要丸藥。」沙僧又笑道：「哥哥，這事不是耍子。馬尿腥臊，如何入得藥品？我只見醋糊為丸，陳米糊為丸，煉蜜為丸，或只是清水為丸，那曾見馬尿為丸？那東西腥腥臊臊，脾虛的人，一聞就吐；再服巴豆、大黃，弄得人上吐下瀉，可是耍子？」行者道：「你不知就裡。我那馬不是凡馬，他本是西海龍身。若得他肯去便溺，憑你何疾，服之即愈。但急不可得耳。」八戒聞言，真個去到邊前，那馬斜伏地下睡哩。獃子一頓腳踢起，襯在肚下，等了半會，全不見撒尿。他跑將來，對行者說：「哥啊，且莫去醫皇帝，且快去醫醫馬來。那亡人乾結了，莫想尿得出一點兒。」行者笑道：「我和你去。」沙僧道：「我也去看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      悟空はさらに、その小鉢を八戒へ渡した。
      悟空「もう一度行って、俺たちの馬の尿を半鉢受けてきてくれ。」
      八戒「何にするんだ。」
      悟空「丸薬を練るのだ。」
      沙悟浄はまた笑った。
      沙悟浄「兄さん、これは冗談では済まないよ。馬の尿は生臭く、臭気もひどいのに、どうして薬に入れられるんだい。酢の糊で丸めるのや、古米の糊で丸めるの、煮詰めた蜜で丸めるの、ただの水で丸めるのなら見たことはある。馬の尿で丸めるなんて、聞いたことがない。あんな生臭くて臭いものは、脾の弱い人なら嗅いだだけで吐いてしまう。そのうえ巴豆と大黄を飲ませて、上から吐かせ、下から下させたら、冗談で済むかい。」
      悟空「お前は内情を知らない。あの馬は、ただの馬ではなく、もとは西海（さいかい）の竜なのだ。あいつが尿をしてくれさえすれば、どんな病でも、飲んだとたん治る。ただ、急には手に入らないがな。」
      八戒は聞くと、さっそく竜馬（りゅうめ）のそばへ行った。竜馬は地面に横になって眠っていた。八戒は何度も蹴って起こし、腹の下へ小鉢を当ててしばらく待ったが、まったく尿をしない。走って戻り、悟空に言った。
      八戒「兄貴、皇帝を治すのは後にして、まずあの馬を治してくれ。あのろくでなし、すっかり詰まってしまって、一滴も出やしない。」
      悟空は笑った。
      悟空「一緒に行こう。」
      沙悟浄「私も見に行こう。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-012"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人都到馬邊，那馬跳將起來，口吐人言，厲聲高叫道：「師兄，你豈不知？我本是西海飛龍，因為犯了天條，觀音菩薩救了我，將我鋸了角，退了鱗，變作馬，馱師父往西天取經，將功折罪。我若過水撒尿，水中遊魚食了成龍；過山撒尿，山中草頭得味變作靈芝，仙僮採去長壽。我怎肯在此塵俗之處輕拋卻也？」行者道：「兄弟謹言。此間乃西方國王，非塵俗也，亦非輕拋棄也。常言道：『眾毛攢裘。』要與本國之王治病哩。醫得好時，大家光輝；不然，恐俱不得善離此地也。」那馬才叫聲：「等著。」你看他往前撲了一撲，往後蹲了一蹲，咬得那滿口牙齕支支的響喨，僅努出幾點兒，將身立起。八戒道：「這個亡人，就是金汁子，再撒些兒也罷。」那行者見有少半盞，道：「夠了，夠了。拿去罷。」沙僧方才歡喜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      三人がそろって竜馬のそばへ来ると、竜馬は跳ね起き、人の言葉で鋭く叫んだ。
      竜馬「兄さん、ご存じないのですか。私はもともと西海の飛竜です。天の法に背いたため、観音菩薩（かんのんぼさつ）に救われ、角を鋸で切られ、鱗を取り去られ、馬に変えられて、お師匠さまを乗せ、西天（さいてん）へ経を取りに行き、功績で罪を償っているのです。私が川を渡って尿をすれば、水中の魚はそれを食べて竜になる。山を越えて尿をすれば、山の草はその気を受けて霊芝（れいし）になり、仙童が摘んで長寿を得るのです。それを、どうしてこんな俗世の場所で、むやみに捨てられましょう。」
      悟空「弟よ、言葉を慎め。ここは西方の国王の所だ。俗世扱いする所でもなければ、むやみに捨てるのでもない。『多くの毛を集めて一枚の毛皮衣にする』というだろう。この国の王の病を治すためなのだ。治せば、みんなの誉れになる。そうでなければ、全員、無事にはここを去れないかもしれないぞ。」
      そこで竜馬は声を上げた。
      竜馬「待っていてください。」
      見ると、前へひと跳ねし、後ろへしゃがみ、満口の歯をぎりぎりと鳴らすほど食いしばり、ようやく数滴しぼり出して、また立ち上がった。
      八戒「このろくでなしめ。たとえ金の汁でも、もう少し出していいじゃないか。」
      悟空は小鉢の半分に足りないほどたまったのを見て言った。
      悟空「もういい、もういい。持っていこう。」
      沙悟浄も、ようやく喜んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch69-013"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人回至廳上，把前項藥餌攪和一處，搓了三個大丸子。行者道：「兄弟，忒大了。」八戒道：「只有核桃大，若論我吃，還不夠一口哩。」遂此收在一個小盒兒裡，兄弟們連衣睡下。一夜無詞，早是天曉。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"

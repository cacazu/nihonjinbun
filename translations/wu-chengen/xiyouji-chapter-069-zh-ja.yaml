    "origin": "source"
    "source_text": "一行文武官引導，那國王並行者相攙，穿過皇宮，到了御花園後，更不見樓臺殿閣。行者道：「避妖樓何在？」說不了，只見兩個太監拿兩根紅漆扛子，往那空地上掬起一塊四方石板。國王道：「此間便是。這底下有三丈多深，穵成的九間朝殿。內有四個大缸，缸內滿注清油，點著燈火，晝夜不息。寡人聽得風響，就入裡邊躲避，外面著人蓋上石板。」行者笑道：「那妖精還是不害你；若要害你，這裡如何躲得？」正說間，只見那正南上，呼呼的吹得風響，播土揚塵。諕得那多官齊聲報怨道：「這和尚鹽醬口，講甚麼妖精，妖精就來了。」慌得那國王丟了行者，即鑽入地穴；唐僧也就跟入；眾官亦躲個乾淨。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      文武の臣たちが先に立ち、国王と悟空は手を取り合って、王宮を抜け、御花園の後ろへ来た。ところが楼台も殿閣も見当たらない。
      悟空「避妖楼はどこですか。」
      言い終わらぬうちに、二人の太監が二本の赤漆の棒を持ち、空き地にある四角い石板を一枚持ち上げた。
      国王「ここなのだ。この下は三丈（じょう）余りの深さがあり、掘り抜いて九間（けん）の朝殿を造ってある。中には大甕が四つあり、澄んだ油をいっぱいに入れ、灯をともして昼も夜も絶やさぬ。余は風の音を聞くと、中へ入って隠れ、外の者に石板をかぶせさせるのだ。」
      悟空は笑った。
      悟空「あの妖怪は、まだあなたを害する気がないのですよ。害そうとしたら、どうしてここで隠れられましょう。」
      そう話していると、真南の方から、ごうごうと風の音がして、土を巻き上げ、塵を吹き飛ばした。臣たちは驚き、声をそろえて恨み言を言った。
      臣たち「この和尚は、縁起でもないことを言って当てる口だ。妖怪の話などするから、本当に来てしまった。」
      国王は慌てふためき、悟空の手を放すと、地下の穴へ潜り込んだ。三蔵も後に続き、臣たちも残らず隠れてしまった。
    "translation_status": "reviewed"
  - "id": "xy-ch69-031"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒、沙僧也都要躲，被行者左右手扯住他兩個道：「兄弟們不要怕得，我和你認他一認，看是個甚麼妖精？」八戒道：「可是扯淡，認他怎的？眾官躲了，師父藏了，國王避了，我們不去了罷，衒的是那家世？」那獃子左掙右掙，掙不得脫手。被行者拿定多時，只見那半空裡閃出一個妖精。你看他怎生模樣："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      八戒と沙悟浄も隠れようとしたが、悟空が左右の手で二人をつかまえた。
      悟空「弟たち、怖がるな。俺と一緒にあいつをよく見て、どんな妖怪か確かめよう。」
      八戒「ふざけるな。確かめてどうする。臣たちは隠れ、お師匠さまも隠れ、国王も逃げ込んだ。俺たちだけ行かないなんて、いったいどこの家柄を誇ろうというんだ。」
      八戒は左へ右へともがいたが、手を振りほどけなかった。悟空が長いことつかんでいると、空中に一匹の妖怪が、さっと姿を現した。その姿はどうであったか。
    "translation_status": "reviewed"
  - "id": "xy-ch69-032"
    "section_id": "chapter-69"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      九尺長身多惡獰，一雙環眼閃金燈。
      兩輪查耳如撐扇，四個鋼牙似插釘。
      鬢繞紅毛眉豎焰，鼻垂糟準孔開明。
      髭髯幾縷朱砂線，顴骨崚嶒滿面青。
      兩臂紅觔藍靛手，十條尖爪把槍擎。
      豹皮裙子腰間繫，赤腳蓬頭若鬼形。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 166
        "line_end": 171
    "translation_ja": |-
      九尺（しゃく）の長身はいかにも獰猛、丸い両目は金の灯のように光る。
      二つの張り出た耳は開いた扇、四本の鋼の牙は打ち込んだ釘のよう。
      鬢には赤毛が巻き、眉は炎のように逆立ち、鼻先は酒粕色に垂れ、鼻の穴ははっきり開く。
      口髭と顎髭は幾筋もの朱砂（しゅしゃ）の糸、頬骨はごつごつ高く、顔じゅうが青い。
      両腕は赤い筋肉、手は藍の色、十本の鋭い爪で槍を握る。
      豹の皮の裳を腰にまとい、裸足に乱れ髪、その姿は鬼さながら。
    "translation_status": "reviewed"
  - "id": "xy-ch69-033"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見了道：「沙僧，你可認得他？」沙僧道：「我又不曾與他相識，那裡認得？」又問：「八戒，你可認得他？」八戒道：「我又不曾與他會茶會酒，又不是賓朋鄰里，我怎麼認得他？」行者道：「他卻像東嶽天齊手下把門的那個醮面金睛鬼。」八戒道：「不是，不是。」行者道：「你怎知他不是？」八戒道：「鬼乃陰靈也，一日至晚，交申酉戌亥時方出。今日還在巳時，那裡有鬼敢出來？就是鬼，也不會駕雲。縱會弄風，也只是一陣旋風耳，有這等狂風？或者他就是賽太歲也。」行者笑道：「好獃子，倒也有些論頭。既如此說，你兩個護持在此，等老孫去問他個名號，好與國王救取金聖宮來朝。」八戒道：「你去自去，切莫供出我們來。」行者昂然不答，急縱祥光，跳將上去。咦！正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      悟空はそれを見て言った。
      悟空「沙悟浄、あいつが分かるか。」
      沙悟浄「知り合ったこともないのに、どうして分かるんだい。」
      悟空は、さらに尋ねた。
      悟空「八戒、あいつが分かるか。」
      八戒「一緒に茶や酒を飲んだこともないし、友達でも隣人でもない。どうして俺に分かるものか。」
      悟空「東嶽天斉（とうがくてんせい）の配下で門番をしている、あの醮面金睛鬼（しょうめんきんせいき）に似ているな。」
      八戒「違う、違う。」
      悟空「どうして違うと分かる。」
      八戒「鬼は陰の霊だ。一日の終わり、申（さる）・酉（とり）・戌（いぬ）・亥（い）の刻になって、ようやく出てくる。今はまだ巳（み）の刻じゃないか。出てこられる鬼がどこにいる。たとえ鬼でも、雲には乗れない。風を起こせるにしても、せいぜいつむじ風だ。こんな荒れ狂う風を起こせるか。ひょっとすると、あれこそ賽太歳じゃないのか。」
      悟空は笑った。
      悟空「なかなかやるじゃないか。少しは理屈が通っている。そういうことなら、お前たちはここを守っていろ。俺が行って名前を尋ね、国王のために金聖宮を救い出し、宮中へ戻してやろう。」
      八戒「行くのは勝手だが、俺たちの名は絶対に出すなよ。」
      悟空は胸を張って答えず、ただちに瑞光を放ち、空へ跳び上がった。ああ、まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch69-034"
    "section_id": "chapter-69"
    "kind": "verse"
    "origin": "source"
    "source_text": "安邦先卻君王病，守道須除愛惡心。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      国を安んずるには、まず君王の病を除き、
      道を守るには、愛し憎む心を除かねばならぬ。
    "translation_status": "reviewed"
  - "id": "xy-ch69-035"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知此去到於空中，勝敗如何，怎麼擒得妖怪，救得金聖宮，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 177
        "line_end": 177
    "translation_ja": "さて、これから空へ上がって、勝敗はどうなるのか。いかにして妖怪を捕らえ、金聖宮を救い出すのか。それは次回のお話をお聞きいただこう。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-01-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「心主」は心猿の悟空を心の主として捉える寓意的な呼び方。回題そのものの象徴を訳し、別の登場人物の名とはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-02-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "金の糸を介した脈診と脈の分類は、物語の伝奇的な医療描写として訳した。四気・五鬱の具体的な分類には解釈の余地がある。「芤」は中が空いたような脈、「濇」は渋滞する脈として表現した。右寸の「內結經閉」は内に結ぼれ経脈が閉じる意に採り、特定の現代疾患へ置き換えない。記述を現代の診断法として保証するものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-03-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「薬八百八味、人四百四病」は古い数え方による引用句。病や薬の現代的な総数を述べる記述ではない。すべてを一人に使うのかという医官の疑問と、悟空の返答を区別した。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-04-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "器具の原文は「藥碾、藥磨、藥羅、藥乳並乳缽、乳槌」。薬を挽くもの、ふるうもの、すりつぶすものを列挙している。「薬乳」と乳鉢・乳槌との器具上の細かな区別は確定せず、すべての語を訳に対応させた。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-05-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三折之肱」は腕を何度も折った経験から医療に通じるという、経験のある医者をたたえる故事的な表現。悟空が実際に三度骨折したという経歴は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-06-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "大黄・巴豆の性味、毒の有無、作用、量や調製は、古い本草の語法を用いた登場人物の医学談義である。寒・熱はその体系の性質区分として保った。「将軍」「関所を破って城門を奪う将軍」の比喩も原文のまま。現代の服用法や安全性を案内する文章ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-07-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「起奪」は人をからかう、弄ぶこと。教育部『重編國語辭典修訂本』も、この発言を用例として掲げる。薬材を強奪したという意味にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-08-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "竜馬の角・鱗・変身の来歴と、魚が竜になり草が霊芝になるという力は、本人が述べる説明として保った。「眾毛攢裘」は、多くの毛を集めて一枚の毛皮衣を作るという、皆で力を合わせるたとえ。「金汁子」は八戒が尿の惜しみ方を金にたとえる言い方として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-09-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "六つの薬引は、烏の屁、鯉の尿、王母の白粉、老君の炉灰、玉皇の古頭巾三切れ、眠る竜の髭五本。「緊水負的」は底本の字を保持し、急流を背に負う鯉として暫定的に訳した。別字へ校訂しない。無根水は臣たちの俗説と悟空の説明が異なり、両方を省かず示した。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-10-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「步了罡訣」は北斗などの星の位置を踏む道教的な歩法として訳した。輔星と弼宿を左右の補佐として立てるが、星の現代的な天体同定は確定しない。敖広は黒雲で現れる一方、自分は風雲雷電を備えていないと言う。矛盾を解くための説明は加えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-11-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "敖広はくしゃみを二つすると提案したが、実行描写は唾を一口吹くことになっている。その後は約一時辰の降雨とされる。人数、一滴・二滴、三滴・五滴、一滴もなしという違い、全部で約三杯という量を底本どおり保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-12-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "服薬・排便・便器の汚物ともち米の塊は原文の身体描写を省かず訳した。病根が出たとの言葉は妃の報告で、現代的な病因の説明へ置き換えない。二人の妃が調べるが、報告の「妃子」は単複を断定できないため「妃」とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-13-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "宴席の賦を全訳した。「斗糖龍纏列獅仙」「餅錠拖爐擺鳳侶」は、糖菓や餅菓子に獅子・仙人・鳳凰などを配する装飾と解した。斗糖・竜纏の切れ目や製法は未確定で、原語を残す。「錦縷肥紅」も食品の具体的な調理法は確定せず、細切りと赤く肥えた肉という字義を示した。「一を食べ十を見る」は贅沢な品数を示す表現として保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-14-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三宝鍾・四季杯は、三杯・四杯という数に縁起を添えて酒を勧める言葉として訳した。素酒は僧や精進の席にふさわしいとされる酒であり、無酒精と確定しない。三蔵の「僧家第一戒」は本人の断酒の言葉として保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-15-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "兜鈴は馬兜鈴の略称。直前の太医院の官の発言が詩へ続くため、訳ではこの詩にも話者を明記した。「無毒」を含む薬性は古い本草説をいう作中人物の発言で、現代の安全性を保証しない。「血蠱」は古い病名のまま残し、現代の疾患名へ同定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-16-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三妃の呼称と拉致の経緯は国王の回想によって明かされる。三度呼ぶ間という条件、国王・臣・都の民を順に食い尽くす脅し、国王が自ら妃を押し出す動作を保持した。国と民を案じたという理由、粽が三年間体内に残ったという説明も国王の語りであり、語り手の独立した医学的判断へ変えていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-17-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "拉致について先の発言は「三年前」、ここでは「前年五月節」となり、続いて去年三月・七月、今年二月と語る。底本の年数の食い違いを無断で統一しない。宮女は十月・三月・七月・二月に二人ずつ、四度の要求をすべて残す。十月の献上と、七月・二月の「要去」に示される連れ去りも、要求だけへ弱めない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-18-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「避妖楼」は楼という名だが、説明される実体は地下三丈余りの九間の朝殿。地上の楼へ直さない。「鹽醬口」は、この文脈では縁起の悪いことを言って当ててしまう口と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-19-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「查耳」は張り出た耳、「糟準」は酒粕のような色の鼻先と暫定的に解した。鼻の形と色の細部は未確定。「紅觔」「藍靛手」は赤い腕の筋肉と藍色の手として分けた。この描写は、現れた妖怪の名や正体を明かすものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch69-note-20-body"
    "section_id": "chapter-69"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空は東嶽天斉の門番に似ていると言い、八戒は違うと論じてから、賽太歳かもしれないと推測する。いずれも眼前の妖怪の確定した身元ではない。「醮面」は底本の醮を保持し、焦面などへ無断訂正せず、王霊官など別の固有名にも結びつけない。申酉戌亥にのみ鬼が出る、今は巳の刻という説明は八戒の主張のまま保った。"
    "translation_status": "reviewed"

        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      三人は広間へ戻り、先ほどの薬をみな一緒にかき混ぜ、三つの大きな丸薬に丸めた。
      悟空「弟よ、大きすぎるぞ。」
      八戒「胡桃ほどしかないじゃないか。俺が食うなら、一口にも足りないよ。」
      こうして小箱に収め、兄弟弟子たちは着物のまま横になった。その夜はほかに語ることもなく、早くも夜が明けた。

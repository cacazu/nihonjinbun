  "known_gaps":
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-001"
      "description_ja": "回題の「心主」は心猿の悟空を心の主として捉える寓意的な呼び方。回題そのものの象徴を訳し、別の登場人物の名とはしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-002"
      "description_ja": "金の糸を介した脈診と脈の分類は、物語の伝奇的な医療描写として訳した。四気・五鬱の具体的な分類には解釈の余地がある。「芤」は中が空いたような脈、「濇」は渋滞する脈として表現した。右寸の「內結經閉」は内に結ぼれ経脈が閉じる意に採り、特定の現代疾患へ置き換えない。記述を現代の診断法として保証するものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-003"
      "description_ja": "「薬八百八味、人四百四病」は古い数え方による引用句。病や薬の現代的な総数を述べる記述ではない。すべてを一人に使うのかという医官の疑問と、悟空の返答を区別した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-004"
      "description_ja": "器具の原文は「藥碾、藥磨、藥羅、藥乳並乳缽、乳槌」。薬を挽くもの、ふるうもの、すりつぶすものを列挙している。「薬乳」と乳鉢・乳槌との器具上の細かな区別は確定せず、すべての語を訳に対応させた。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-007"
      "description_ja": "「三折之肱」は腕を何度も折った経験から医療に通じるという、経験のある医者をたたえる故事的な表現。悟空が実際に三度骨折したという経歴は補わない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-009"
      "description_ja": "大黄・巴豆の性味、毒の有無、作用、量や調製は、古い本草の語法を用いた登場人物の医学談義である。寒・熱はその体系の性質区分として保った。「将軍」「関所を破って城門を奪う将軍」の比喩も原文のまま。現代の服用法や安全性を案内する文章ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-010"
      "description_ja": "「起奪」は人をからかう、弄ぶこと。教育部『重編國語辭典修訂本』も、この発言を用例として掲げる。薬材を強奪したという意味にはしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-012"
      "description_ja": "竜馬の角・鱗・変身の来歴と、魚が竜になり草が霊芝になるという力は、本人が述べる説明として保った。「眾毛攢裘」は、多くの毛を集めて一枚の毛皮衣を作るという、皆で力を合わせるたとえ。「金汁子」は八戒が尿の惜しみ方を金にたとえる言い方として訳した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-015"
      "description_ja": "六つの薬引は、烏の屁、鯉の尿、王母の白粉、老君の炉灰、玉皇の古頭巾三切れ、眠る竜の髭五本。「緊水負的」は底本の字を保持し、急流を背に負う鯉として暫定的に訳した。別字へ校訂しない。無根水は臣たちの俗説と悟空の説明が異なり、両方を省かず示した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-017"
      "description_ja": "「步了罡訣」は北斗などの星の位置を踏む道教的な歩法として訳した。輔星と弼宿を左右の補佐として立てるが、星の現代的な天体同定は確定しない。敖広は黒雲で現れる一方、自分は風雲雷電を備えていないと言う。矛盾を解くための説明は加えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-018"
      "description_ja": "敖広はくしゃみを二つすると提案したが、実行描写は唾を一口吹くことになっている。その後は約一時辰の降雨とされる。人数、一滴・二滴、三滴・五滴、一滴もなしという違い、全部で約三杯という量を底本どおり保つ。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-019"
      "description_ja": "服薬・排便・便器の汚物ともち米の塊は原文の身体描写を省かず訳した。病根が出たとの言葉は妃の報告で、現代的な病因の説明へ置き換えない。二人の妃が調べるが、報告の「妃子」は単複を断定できないため「妃」とした。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-023"
      "description_ja": "宴席の賦を全訳した。「斗糖龍纏列獅仙」「餅錠拖爐擺鳳侶」は、糖菓や餅菓子に獅子・仙人・鳳凰などを配する装飾と解した。斗糖・竜纏の切れ目や製法は未確定で、原語を残す。「錦縷肥紅」も食品の具体的な調理法は確定せず、細切りと赤く肥えた肉という字義を示した。「一を食べ十を見る」は贅沢な品数を示す表現として保持する。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-024"
      "description_ja": "三宝鍾・四季杯は、三杯・四杯という数に縁起を添えて酒を勧める言葉として訳した。素酒は僧や精進の席にふさわしいとされる酒であり、無酒精と確定しない。三蔵の「僧家第一戒」は本人の断酒の言葉として保つ。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-026"
      "description_ja": "兜鈴は馬兜鈴の略称。直前の太医院の官の発言が詩へ続くため、訳ではこの詩にも話者を明記した。「無毒」を含む薬性は古い本草説をいう作中人物の発言で、現代の安全性を保証しない。「血蠱」は古い病名のまま残し、現代の疾患名へ同定しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-028"
      "description_ja": "三妃の呼称と拉致の経緯は国王の回想によって明かされる。三度呼ぶ間という条件、国王・臣・都の民を順に食い尽くす脅し、国王が自ら妃を押し出す動作を保持した。国と民を案じたという理由、粽が三年間体内に残ったという説明も国王の語りであり、語り手の独立した医学的判断へ変えていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-029"
      "description_ja": "拉致について先の発言は「三年前」、ここでは「前年五月節」となり、続いて去年三月・七月、今年二月と語る。底本の年数の食い違いを無断で統一しない。宮女は十月・三月・七月・二月に二人ずつ、四度の要求をすべて残す。十月の献上と、七月・二月の「要去」に示される連れ去りも、要求だけへ弱めない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-030"
      "description_ja": "「避妖楼」は楼という名だが、説明される実体は地下三丈余りの九間の朝殿。地上の楼へ直さない。「鹽醬口」は、この文脈では縁起の悪いことを言って当ててしまう口と解した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-032"
      "description_ja": "「查耳」は張り出た耳、「糟準」は酒粕のような色の鼻先と暫定的に解した。鼻の形と色の細部は未確定。「紅觔」「藍靛手」は赤い腕の筋肉と藍色の手として分けた。この描写は、現れた妖怪の名や正体を明かすものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch69-1455618"
      "segment_ids":
        - "xy-ch69-033"
      "description_ja": "悟空は東嶽天斉の門番に似ていると言い、八戒は違うと論じてから、賽太歳かもしれないと推測する。いずれも眼前の妖怪の確定した身元ではない。「醮面」は底本の醮を保持し、焦面などへ無断訂正せず、王霊官など別の固有名にも結びつけない。申酉戌亥にのみ鬼が出る、今は巳の刻という説明は八戒の主張のまま保った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

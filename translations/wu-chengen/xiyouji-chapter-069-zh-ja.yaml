    "translation_ja": |-
      宴もたけなわになると、国王はまた大きな酒器を取り、悟空へ差し出した。
      悟空「陛下、お座りください。順に回ってくれば、私は存分に飲みます。決してお断りはしません。」
      国王「神僧のご恩は山より重く、余には礼を尽くし切れぬ。どうか、この大杯を受けてくだされ。朕には話があるのだ。」
      悟空「何のお話です。聞かせていただけば、気持ちよく飲めます。」
      国王「余は数年、憂いと疑いによる病にかかっていた。それを神僧の霊丹一服が通してくださったので、たちまち治ったのだ。」
      悟空は笑った。
      悟空「昨日、陛下を診たとき、憂いや疑いからの病だとは分かりましたが、何を思い悩んでおられたのかは存じません。」
      国王「『家の恥は外に話すな』と昔の人は言う。だが、神僧は朕の恩人だ。笑わぬとおっしゃるなら、お話しできる。」
      悟空「どうして笑いものにしましょう。ご遠慮なくお話しください。」
      国王「神僧は東から来られたが、いくつの国を通ったのだろう。」
      悟空「五、六か国を通りました。」
      国王はさらに尋ねた。
      国王「ほかの国の妃は、何と呼ばれているのだろう。」
      悟空「国王の妃は、みな正宮（せいぐう）、東宮（とうぐう）、西宮（せいぐう）と呼ばれます。」
      国王「余の国では、そうは呼ばぬ。正宮を金聖宮（きんせいきゅう）、東宮を玉聖宮（ぎょくせいきゅう）、西宮を銀聖宮（ぎんせいきゅう）と呼ぶ。今、宮中にいるのは銀と玉の二人の妃だけだ。」
      悟空「金聖宮は、なぜ宮中にいないのです。」
      国王は涙をこぼした。
      国王「いなくなって、もう三年になる。」
      悟空「どちらへ行かれたのです。」
      国王「三年前、ちょうど端陽（たんよう）の節句だった。朕は妃たちとともに御花園の海榴亭（かいりゅうてい）の下で、粽（ちまき）を解き、艾（よもぎ）を挿し、菖蒲と雄黄（ゆうおう）の酒を飲み、竜舟の競漕を眺めていた。すると突然、一陣の風が吹き、空中に一匹の妖怪が現れた。自ら賽太歳（さいたいさい）と名乗り、麒麟山（きりんざん）の獬豸洞（かいちどう）に住んでいるという。洞には夫人がいないので、わが金聖宮が美しく艶やかだと聞きつけ、夫人にしたい、朕はすぐ差し出せと言った。三度呼ぶ間に差し出さなければ、まず余を食い、次に臣たちを食い、都じゅうの民を残らず食い尽くすという。そのとき朕は国と民を案じ、やむなく金聖宮を海榴亭の外へ押し出した。妖怪は一声響かせると、術でさらっていってしまった。余はそのために驚き恐れ、食べていた粽が腹の中に凝り固まった。そのうえ昼も夜も思い悩みがやまず、こうして三年もの苦しい病になったのだ。今、神僧の霊丹をいただいて何度も便を下すと、みな、あの三年前からたまっていた物だった。だから、こうして体は健やかで軽くなり、気力も元に戻った。今日の命はすべて神僧の賜物。その恩は、泰山（たいざん）ほどの重さなどというだけで済もうか！」
    "translation_status": "reviewed"
  - "id": "xy-ch69-029"
    "section_id": "chapter-69"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞得此言，滿心喜悅，將那巨觥之酒，兩口吞之，笑問國王曰：「陛下原來是這般驚憂。今遇老孫，幸而獲愈。但不知可要金聖宮回國？」那國王滴淚道：「朕切切思思，無晝無夜，但只是沒一個能獲得妖精的，豈有不要他回國之理？」行者道：「我老孫與你去伏妖邪，何如？」國王跪下道：「若救得朕后，朕願領三宮九嬪，出城為民，將一國江山，盡付神僧，讓你為帝。」八戒在旁，見出此言，行此禮，忍不住呵呵大笑道：「這皇帝失了體統，怎麼為老婆就不要江山，跪著和尚？」行者急上前，將國王攙起道：「陛下，那妖精自得金聖宮去後，這一向可曾再來？」國王道：「他前年五月節攝了金聖宮，至十月間，來要兩個宮娥，說是伏侍娘娘，朕即獻出兩個；至舊年三月間，又來要兩個宮娥；七月間，又要去兩個；今年二月裡，又要去兩個。不知到幾時又要來也。」行者道：「似他這等頻來，你們可怕他麼？」國王道：「寡人見他來得多遭，一則懼怕，二來又恐有傷害之意。舊年四月內，是朕命工起了一座避妖樓，但聞風響，知是他來，即與二后、九嬪入樓躲避。」行者道：「陛下不棄，可攜老孫去看那避妖樓一番，何如？」那國王即將左手攜著行者出席。眾官一齊起身。豬八戒道：「哥哥，你不達禮。這般御酒不吃，搖席破坐的，且去看甚麼哩？」國王聞說，情知八戒是為嘴，即命當駕官擡兩張素桌面看酒，在避妖樓外伺候。獃子卻才不嚷，同師父、沙僧笑道：「翻席去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch69-1455618"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第069回&oldid=1455618"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      悟空はその話を聞くと、心から喜び、大杯の酒を二口で飲み干した。そして笑って国王に尋ねた。
      悟空「陛下は、そうした驚きと憂いを抱えておられたのですね。今、私に出会って、幸いお治りになった。ところで、金聖宮を国へお戻しになりたいのですか。」
      国王は涙を流した。
      国王「朕は心を尽くして思い続け、昼も夜も忘れぬ。ただ、あの妖怪を捕らえられる者が一人もいないのだ。戻ってほしくない道理があろうか。」
      悟空「この俺が、あなたのために妖邪を降しに行くのはどうです。」
      国王はひざまずいた。
      国王「朕の妃を救い出してくださるなら、朕は三宮九嬪（さんぐうきゅうひん）を連れて都を出て、一介の民となろう。一国の山河をことごとく神僧にお渡しし、帝となっていただく。」
      八戒はそばで、この言葉と礼を見ると、こらえ切れず、からからと笑った。
      八戒「この皇帝、体面を失ったな。どうして女房のために国まで捨てて、和尚にひざまずくんだ。」
      悟空は急いで進み、国王を助け起こした。
      悟空「陛下、あの妖怪は金聖宮を連れ去ってから、また来たことがありますか。」
      国王「一昨年の五月の節句に金聖宮をさらい、十月には宮女を二人よこせと来た。妃に仕えさせると言うので、朕はすぐ二人差し出した。去年の三月にも、また宮女を二人要求し、七月にも二人連れ去った。今年の二月にも二人連れ去った。次はいつ来るか分からぬ。」
      悟空「そんなにたびたび来るのでは、皆さんは恐れているのでしょうね。」
      国王「何度も来るので、余は恐ろしいばかりか、危害を加えるつもりではないかと案じた。そこで去年の四月、職人に命じて避妖楼（ひようろう）を一棟建てたのだ。風の音がして、あれが来たと知ると、二人の妃と九嬪を連れ、その楼へ隠れる。」
      悟空「陛下、差し支えなければ、私をその避妖楼へ案内していただけませんか。」
      国王はすぐに左手で悟空の手を取り、席を離れた。臣たちも一斉に立ち上がった。
      八戒「兄貴、礼儀を知らないな。こんな結構なお酒を飲まず、宴席をかき乱して立ち上がり、今さら何を見に行くんだ。」
      国王はそれを聞き、八戒が食い気のために言っていると察して、御前の役人へ、精進料理の卓を二つと酒を運び、避妖楼の外で控えるよう命じた。八戒はそこでようやく騒ぐのをやめ、三蔵と沙悟浄に笑いかけた。
      八戒「宴のお引っ越しだな。」
    "translation_status": "reviewed"
  - "id": "xy-ch69-030"
    "section_id": "chapter-69"

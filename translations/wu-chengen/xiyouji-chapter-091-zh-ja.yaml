  "known_gaps":
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-002"
      "description_ja": "冒頭の馬と猿は、落ち着かない意と心を示す修養のたとえとして訳した。「五彩」「神丹」「玉性」は修行の成果や保つべき本性を示す詩語と読めるが、五色の個別の対応や丹の具体的な修法は本文に示されないため、補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-004"
      "description_ja": "「應佛僧人」は、仏に仕えて読経する僧と解した。儀式上の特定の職名や宗派に限定できるかは確定していない。輪蔵はこの寺院景の経典収納設備を指すものとし、冥府の転生の場所という別義とは区別した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-009"
      "description_ja": "庭園の賦は、春の描写に四季の花木や仙境のたとえを重ねる。花の実際の開花時期に合わせて列挙を削ったり並べ替えたりしていない。「煉魔室」は心を乱す魔を除く修養の部屋と解したが、具体的な修法は未詳。「含笑花」の厳密な種も確定していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-015"
      "description_ja": "長い灯の賦は、さまざまな形の灯籠や飾りの人形、見物人を描く。寿星や李白が現実に降臨した場面ではない。玉韂は馬の泥よけをいう語として訳し、音の描写も残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-017"
      "description_ja": "底本は「唱彩蓮」と記す。祭りの歌の文脈から「採蓮」に通じる蓮摘みの歌と解して訳したが、原文欄の「彩」を「採」へ直していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-019"
      "description_ja": "原文は「縣有二百四十里」。続く賦役名簿と二百四十家の負担の説明から、ここでの里は道のりではなく県内の住民組織・地区と解した。各里の戸数や詳しい割当方式までは本文に示されないため補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-019"
      "description_ja": "酥合香油は底本の文字を保った油名。蘇合香との関係は考えられるが、配合や成分は確定しない。油の消失と豊凶を結び付ける言葉は、寺僧たちが伝える土地の信仰として訳し、語り手が因果関係を保証したことにはしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-026"
      "description_ja": "三蔵はここで「俗名陳玄奘」と述べる。玄奘を僧名として述べた以前の命名とそのままでは一致しないが、この供述を別の俗名へ訂正せず、底本の自己紹介として保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-028"
      "description_ja": "底本は「二角」「四隻耳」と述べる。三者をまとめて描く賦の中で、この角と耳の数をどう各個体へ配分するかは明示されないため、数を変更したり、一体ごとの数だと補ったりしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-028"
      "description_ja": "扢撻藤は藤の棒状の武器と解した。「扢撻」を節くれの意と読む余地はあるが、形状の細部は確定しない。扢・撻の原字を保ち、別の字へ無断で直していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch91-1455640"
      "segment_ids":
        - "xy-ch91-034"
      "description_ja": "五百年飲食しなかったというのは、この場の悟空の発言である。以前に鉄の丸や銅汁を与えられたという叙述との緊張は、本文を直して解消しない。 原文の欠落ではなく、解釈・校訂上の留保。"

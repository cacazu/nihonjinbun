    "translation_status": "reviewed"
  - "id": "xy-ch91-002"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      修禪何處用工夫，馬劣猿顛速剪除。
      牢捉牢拴生五彩，暫停暫住墮三途。
      若教自在神丹漏，才放從容玉性枯。
      喜怒憂思須掃淨，得玄得妙恰如無。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 122
        "line_end": 125
    "translation_ja": |-
      禅を修めるには、どこに力を注ぐべきか。
      荒馬のような意、跳ね猿のような心を、急いで鎮めねばならぬ。
      しっかり捕らえ、固くつなげば五色の輝きが生じ、
      少しでも手を休め、修行をとどめれば三途（さんず）に落ちる。
      気ままに任せれば、霊妙な丹（たん）が漏れ失せ、
      気を緩めたとたん、玉のような本性も枯れてしまう。
      喜び、怒り、憂い、思いを、すっかり払い去れ。
      奥深い妙境を得たときこそ、何もないかのようになる。
    "translation_status": "reviewed"
  - "id": "xy-ch91-003"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表唐僧師徒四眾離了玉華城，一路平穩，誠所謂極樂之鄉。去有五六日程途，又見一座城池。唐僧問行者道：「此又是甚麼處所？」行者道：「是座城池。但城上有杆無旗，不知地方，俟近前再問。」及至東關廂，見那兩邊茶坊酒肆喧嘩，米市油房熱鬧。街衢中有幾個無事閑遊的浪子，見豬八戒嘴長，沙和尚臉黑，孫行者眼紅，都擁擁簇簇的爭看，只是不敢近前而問。唐僧捏著一把汗，惟恐他們惹禍。又走過幾條巷口，還不到城。忽見有一座山門，門上有「慈雲寺」三字。唐僧道：「此處略進去歇歇馬，打一個齋如何？」行者道：「好，好。」四眾遂一齊而入。但見那裡邊："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      さて、三蔵（さんぞう）一行四人は玉華城（ぎょくかじょう）を離れると、道中何事もなく進んだ。まさに極楽の土地というべきところである。五、六日ほど行くと、また一つの城郭が見えてきた。
      三蔵「今度は、何というところだろう。」
      悟空（ごくう）「町のようですが、城壁には竿だけで旗がありません。どこの町か分からないので、近づいてから聞いてみましょう。」
      東門の外の町へ来ると、通りの両側には茶店や酒屋がにぎわい、米市場や油屋も繁盛していた。通りをぶらついていた何人かの遊び人は、八戒（はっかい）の長い口、沙悟浄（さごじょう）の黒い顔、悟空の赤い目を見ると、われ先にと群がって眺めたが、近寄って尋ねる勇気はなかった。三蔵は弟子たちが騒ぎを起こしはしないかと、冷や汗をかいていた。さらにいくつかの横町を過ぎても、まだ城内には着かない。そのとき寺の山門が目に入った。門には「慈雲寺（じうんじ）」の三字が掲げてある。
      三蔵「少しここへ入り、馬を休ませて、食事のお布施を頂いてはどうだろう。」
      悟空「いいですね。そうしましょう。」
      四人はそろって入った。中を見れば、こんな眺めであった。
    "translation_status": "reviewed"
  - "id": "xy-ch91-004"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "珍樓壯麗，寶座崢嶸。佛閣高雲外，僧房靜月中。丹霞縹緲浮屠挺，碧樹陰森輪藏清。真淨土，假龍宮，大雄殿上紫雲籠。兩廊不絕閑人戲，一塔常開有客登。爐中香火時時爇，臺上燈花夜夜熒。忽聞方丈金鐘韻，應佛僧人朗誦經。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      美しい楼閣は壮麗に、仏の宝座は高くそびえる。
      仏堂は雲の外まで高く、僧房は月の光の中に静まる。
      紅の霞がたなびく中、仏塔がすっくと立ち、
      緑の木々が深い陰を落とす中、輪蔵（りんぞう）は清らかだ。
      まことの浄土、さながらの竜宮。
      大雄殿（だいおうでん）の上には紫の雲がこもる。
      両側の回廊には遊びに来た人が絶えず、
      一基の塔はいつも開かれ、訪れた客が登ってゆく。
      香炉では絶えず香が燃え、
      台の上では夜ごと灯の花が輝く。
      ふいに方丈（ほうじょう）から鐘の音が聞こえ、
      仏に仕える僧たちが、朗々と経を読む。
    "translation_status": "reviewed"
  - "id": "xy-ch91-005"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾正看時，又見廊下走出一個和尚，對唐僧作禮道：「老師何來？」唐僧道：「弟子中華唐朝來者。」那和尚倒身下拜。慌得唐僧攙起道：「院主何為行此大禮？」那和尚合掌道：「我這裡向善的人，看經念佛，都指望修到你中華地托生。才見老師丰采衣冠，果然是前生修到的，方得此受用，故當下拜。」唐僧笑道：「惶恐，惶恐。我弟子乃行腳僧，有何受用？若院主在此閑養自在，才是享福哩。」那和尚領唐僧入正殿，拜了佛像，唐僧方才招呼徒弟進來。原來行者三人自見那和尚與師父講話，他都背著臉，牽著馬，守著擔，立在一處，和尚不曾在心。忽的聞唐僧叫「徒弟」，他三人方才轉面。那和尚見了，慌得叫：「爺爺呀！你高徒如何恁般醜樣？」唐僧道：「醜則雖醜，倒頗有些法力，我一路甚虧他們保護。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      四人が眺めていると、回廊の下から一人の僧が出てきて、三蔵に礼をした。
      僧「老師は、どちらからおいでですか。」
      三蔵「私は中華（ちゅうか）の唐朝（とうちょう）から参った者です。」
      僧は身を伏せて拝んだ。三蔵は慌てて抱き起こした。
      三蔵「院主さま、どうしてそのような大礼をなさるのです。」
      院主は合掌した。
      院主「この地で善い行いを心がける者は、経を読み、念仏を唱え、みな修行の末に、あなたの中華の地へ生まれ変わりたいと願っております。いま老師のお姿やお召し物を拝見して、やはり前の世で修行を積まれたからこそ、こうした恵みを受けられるのだと分かりました。それで拝んだのでございます。」
      三蔵は笑った。
      三蔵「いや、恐れ入ります。私は旅の僧ですから、何の恵みを受けておりましょう。院主さまのように、ここで静かに、心ゆくまで暮らされるほうが、幸せというものです。」
      院主は三蔵を本堂へ案内した。仏像を拝んでから、三蔵はようやく弟子たちを呼び入れた。実は悟空たち三人は、僧と師匠が話し始めると、顔を背け、馬を引き、荷物を守って一か所に立っていたので、僧も気に留めていなかったのである。
      三蔵「お前たち。」
      そう呼ばれて三人が顔を向けると、院主はぎょっとして叫んだ。
      院主「ああ、これは！　お弟子さま方は、どうしてこんなにも醜いお姿なのです。」
      三蔵「見た目は醜くても、なかなかの法力を持っております。道中はこの者たちに守られ、ずいぶん助けられているのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-006"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，裡面又走出幾個和尚作禮。先見的那和尚對後的說道：「這老師是中華大唐來的人物，那三位是他高徒。」眾僧且喜且懼道：「老師中華大國，到此何為？」唐僧言：「我奉唐王聖旨，向靈山拜佛求經。適過寶方，特奔上剎，一則求問地方，二則打頓齋食就行。」那僧人個個歡喜，又邀入方丈。方丈裡又有幾個與人家做齋的和尚。這先進去的又叫道：「你們都來看看中華人物。原來中華有俊的，有醜的。俊的真個難描難畫，醜的卻十分古怪。」那許多僧同齋主都來相見。見畢，各坐下。茶罷，唐僧問道：「貴處是何地名？」眾僧道：「我這裡乃天竺國外郡，金平府是也。」唐僧道：「貴府至靈山還有許多遠近？」眾僧道：「此間到都下有二千里。這是我等走過的。西去到靈山，我們未走，不知還有多少路，不敢妄對。」唐僧謝了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      話していると、奥からまた数人の僧が出てきて礼をした。先ほどの院主が、後から来た者たちに話した。
      院主「この老師は中華の大唐（だいとう）からおいでだ。あちらの三人は、そのお弟子さまたちだよ。」
      寺僧たちは喜びながらも、おっかなびっくり尋ねた。
      寺僧たち「老師、中華という大国から、何のためにこちらへおいでになったのですか。」
      三蔵「唐（とう）の天子の勅命を受け、霊山（れいざん）へ仏を拝して経を頂きに参ります。たまたまこの土地を通ったので、こちらのお寺にお邪魔いたしました。一つには土地の名を伺い、もう一つには一食のお布施を頂いて、また出発したいのです。」
      僧たちはみな喜び、さらに方丈へ招き入れた。そこには、檀家のために斎会（さいえ）を営んでいる僧も数人いた。先に入った院主が、また声をかけた。
      院主「みんな、中華の方々を見においで。中華にも美しい方と醜い方がおられるのだね。美しい方は絵にも描ききれないほどで、醜い方はなんとも変わったお姿だ。」
      大勢の僧が、斎会の施主である斎主（さいしゅ）とともに挨拶に来た。挨拶が済むとそれぞれ座り、茶を飲み終えてから、三蔵が尋ねた。
      三蔵「ここは、何という土地でしょうか。」
      寺僧たち「天竺国（てんじくこく）の外郡（がいぐん）で、金平府（きんぺいふ）と申します。」
      三蔵「この府から霊山までは、あとどのくらいございますか。」
      寺僧たち「ここから都までは二千里（り）ございます。それは私どもも歩いた道です。しかし西へ霊山に至る道は歩いたことがありませんので、あとどれほどあるか、いい加減なお答えはできません。」
      三蔵は礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch91-007"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少時，擺上齋來。齋罷，唐僧要行，卻被眾僧並齋主款留道：「老師寬住一二日，過了元宵，耍耍去不妨。」唐僧驚問道：「弟子在路，只知有山有水，怕的是逢怪逢魔，把光陰都錯過了，不知幾時是元宵佳節？」眾僧笑道：「老師拜佛與悟禪心重，故不以此為念。今日乃正月十三，到晚就試燈。後日十五上元。直至十八九，方才謝燈。我這裡人家好事，本府太守老爺愛民，各地方俱高張燈火，徹夜笙簫。還有個金燈橋，乃上古傳留，至今豐盛。老爺們寬住數日，我荒山頗管待得起。」唐僧無奈，遂俱住下。當晚只聽得佛殿上鐘鼓喧天，乃是街坊眾信人等送燈來獻佛。唐僧等都出方丈來看了燈，各自歸寢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      やがて食事が運ばれてきた。食べ終わって三蔵が出発しようとすると、僧たちと斎主が丁重に引き留めた。
      寺僧たちと斎主「老師、あと一日か二日、ゆっくりお泊まりください。元宵（げんしょう）を過ごし、ひと遊びなさってから行かれてもよいでしょう。」
      三蔵は驚いて尋ねた。
      三蔵「私は旅の間、山や川を越えることばかり考え、妖怪に出会いはしないかと恐れておりましたので、日取りもすっかり分からなくなりました。元宵の祭りは、いつなのでしょう。」
      寺僧たちは笑った。
      寺僧たち「老師は仏を拝み、禅を悟ろうとなさるお心が強いので、そんなことはお考えにならないのですね。今日は正月十三日で、今夜は灯の試し点けをいたします。あさって十五日が上元（じょうげん）です。十八日か十九日になって、ようやく灯を納めます。この土地の人々は催し物が好きで、府の太守（たいしゅ）さまも民を慈しまれますから、どこでも灯を高く掲げ、夜通し笙や笛を奏でます。金灯橋（きんとうきょう）という、昔から伝わる場所もあり、今でも盛大です。皆さま、数日ごゆっくりなさってください。この山寺でも、それくらいのおもてなしはできます。」
      三蔵も断りきれず、一行は泊まることにした。その晩、仏殿から鐘や太鼓の音が響き渡った。町内の信者たちが、仏に供える灯を持ってきたのである。三蔵たちも方丈から出て灯を見物し、それぞれ床に就いた。
    "translation_status": "reviewed"
  - "id": "xy-ch91-008"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，寺僧又獻齋。吃罷，同步後園閑耍。果然好個去處，正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 134
        "line_end": 134
    "translation_ja": "翌日も寺の僧たちが食事を供えた。食べ終わると、一行は連れ立って裏庭を散策した。なるほど、よいところである。まさにこんな景色であった。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-009"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "時維正月，歲屆新春。園林幽雅，景物妍森。四時花木爭奇，一派峰巒疊翠。芳草階前萌動，老梅枝上生馨。紅入桃花嫩，青歸柳色新。金谷園富麗休誇，《輞川圖》流風慢說。水流一道，野鳧出沒無常；竹種千竿，墨客推敲未定。芍藥花、牡丹花、紫薇花、含笑花，天機方醒；山茶花、紅梅花、迎春花、瑞香花，艷質先開。陰崖積雪猶含凍，遠樹浮煙已帶春。又見那鹿向池邊照影，鶴來松下聽琴。東幾廈，西幾亭，客來留宿；南幾堂，北幾塔，僧靜安禪。花卉中，有一兩座養性樓，重簷高拱；山水內，有三四處煉魔室，靜几明窗。真個是天然堪隱逸，又何須他處覓蓬瀛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      時は正月、年は新春を迎えた。
      庭は静かで雅やかに、景物は美しく茂る。
      四季の花木が珍しさを競い、幾重もの峰が緑を重ねる。
      階の前には香り草が芽吹き、老梅の枝には芳香が生まれる。
      桃の花には若々しい紅が差し、柳の色には新たな青が戻る。
      金谷園（きんこくえん）の富み栄えを誇るなかれ、『輞川図（もうせんず）』の風雅も、そう語るには及ばぬ。
      一筋の水の流れでは、野鴨が出たり隠れたり。
      千本もの竹を前にして、詩人は句を練って、まだ決められない。
      芍薬、牡丹、百日紅、含笑花（がんしょうか）は、自然の命が目覚めかけ、
      椿、紅梅、迎春花（げいしゅんか）、瑞香（ずいこう）は、ひと足先に美しい花を開く。
      日の当たらぬ崖の積雪には、まだ凍てつく冷たさが残り、
      遠い木々に浮かぶ霞には、もう春の気配がある。
      鹿は池のほとりで姿を映し、鶴は松の下へ来て琴を聞く。
      東には幾棟かの大屋、西には幾つかのあずまやがあり、訪れた客を泊める。
      南には幾つかの堂、北には幾基かの塔があり、僧は静かに禅を修める。
      花々の中には、一、二棟の養性楼（ようせいろう）があって、重なった軒が高く反り、
      山水の間には、三、四か所の煉魔室（れんましつ）があって、机は清潔、窓は明るい。
      まさに自然のままで、世を離れて住むのにふさわしい。
      よそへ蓬瀛（ほうえい）を探しに行く必要など、どこにあろう。
    "translation_status": "reviewed"
  - "id": "xy-ch91-010"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們玩賞一日，殿上看了燈，又都去看燈遊戲。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 137
        "line_end": 137
    "translation_ja": "師弟は一日、景色を楽しみ、仏殿の灯を見たあと、みなさらに灯を見物して遊んだ。見れば、こんな眺めである。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-011"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "瑪瑙花城，琉璃仙洞，水晶雲母諸宮：似重重錦繡，疊疊玲瓏。星橋影晃乾坤動，看數株火樹搖紅。六街簫鼓，千門璧月，萬戶香風。幾處鰲峰高聳，有魚龍出海，鸞鳳騰空。羨燈光月色，和氣融融。綺羅隊裡，人人喜聽笙歌。車馬轟轟：看不盡花容玉貌，風流豪俠，佳景無窮。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      瑪瑙の花の都、瑠璃の仙人の洞、
      水晶や雲母でできたかのような、幾つもの宮殿。
      錦を幾重にも重ねたように、きらめく光が折り重なる。
      星を並べた橋の光が揺れると、天地までも動き、
      幾本もの火の木には、紅い光が揺らいでいる。
      大通りには笛と太鼓、千の門には玉のような月、万の家には香る風。
      あちこちに鰲峰（ごうほう）が高くそびえ、
      魚や竜が海を出て、鸞（らん）や鳳（ほう）が空へ舞う。
      灯の輝きも月の光も美しく、和やかな気が満ちあふれる。
      美しい衣をまとった人々は、みな喜んで笙や歌に聞き入る。
      車馬はごうごうと行き交い、
      花や玉のような美しい顔も、風流で気前のよい男たちも、見尽くすことができない。
      すばらしい景色は、どこまでも続く。
    "translation_status": "reviewed"
  - "id": "xy-ch91-012"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏與眾僧在本寺裡看了燈，又到東關廂各街上遊戲。到二更時，方才回轉安置。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 141
        "line_end": 141
    "translation_ja": "三蔵は寺の僧たちと境内の灯を見てから、東門の外の町のあちこちへ見物に出た。二更（にこう）になって、ようやく戻って寝床に入った。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-013"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，唐僧對眾僧道：「弟子原有掃塔之願，趁今日上元佳節，請院主開了塔門，讓弟子了此願心。」眾僧隨開了門。沙僧取了袈裟，隨從唐僧；到了一層，就披了袈裟，拜佛禱祝畢，即將笤帚掃了一層，卸了袈裟，付與沙僧。……又掃二層，一層層直掃上絕頂。那塔上層層有佛，處處開窗，掃一層，賞玩讚羨一層。掃畢下來，天色已晚，又都點上燈火。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      翌日、三蔵は僧たちに言った。
      三蔵「私は以前から、塔を掃除するという願を立てております。今日は上元のめでたい日ですから、院主さま、塔の扉を開けて、その願を果たさせてください。」
      僧たちはすぐに扉を開けた。沙悟浄が袈裟を持って三蔵に付き添う。一層目へ着くと、三蔵は袈裟をまとい、仏を拝んで祈ったあと、ほうきでその階を掃いた。そして袈裟を脱ぎ、沙悟浄に渡した。……次に二層目を掃き、こうして一層ずつ、頂上まで掃き上げた。塔の中にはどの階にも仏があり、あちこちに窓が開いている。一階を掃くごとに、その階の眺めを楽しみ、感嘆した。掃除を終えて下りてくると、もう日が暮れ、また灯がともされた。
    "translation_status": "reviewed"
  - "id": "xy-ch91-014"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此夜正是十五元宵。眾僧道：「老師父，我們前晚只在荒山與關廂看燈，今晚正節，進城看看金燈如何？」唐僧欣然從之，同行者三人及本寺多僧進城看燈。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      この夜こそ、十五日の元宵であった。
      寺僧たち「老師さま、前の晩はこの山寺と門外の町だけで灯をご覧になりましたが、今夜が本番でございます。城内へ金灯を見に行かれませんか。」
      三蔵は喜んで承知し、悟空たち三人と寺の多くの僧を連れ、城内へ灯を見に出かけた。まさしく、こうであった。
    "translation_status": "reviewed"
  - "id": "xy-ch91-015"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "三五良宵節，上元春色和。花燈懸鬧市，齊唱太平歌。又見那六街三市燈亮，半空一鑑初升。那月如馮夷推上爛銀盤，這燈似仙女織成鋪地錦。燈映月，增一倍光輝；月照燈，添十分燦爛。觀不盡鐵鎖星橋，看不了燈花火樹。雪花燈、梅花燈，春冰剪碎；繡屏燈、畫屏燈，五彩攢成。核桃燈、荷花燈，燈樓高掛；青獅燈、白象燈，燈架高檠。蝦兒燈、鱉兒燈，棚前高弄；羊兒燈、兔兒燈，簷下精神。鷹兒燈、鳳兒燈，相連相併；虎兒燈、馬兒燈，同走同行。仙鶴燈、白鹿燈，壽星騎坐；金魚燈、長鯨燈，李白高乘。鰲山燈，神仙聚會；走馬燈，武將交鋒。萬千家燈火樓臺，十數里雲煙世界。那壁廂，索琅琅玉韂飛來；這壁廂，轂轆轆香車輦過。看那紅妝樓上，倚著欄，隔著簾，並著肩，攜著手，雙雙美女貪歡；綠水橋邊，鬧吵吵，錦簇簇，醉醺醺，笑呵呵，對對遊人戲彩。滿城中簫鼓諠譁，徹夜裡笙歌不斷。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      三五、十五日のよき宵の祭り、上元の春の景色は穏やかだ。
      花灯籠はにぎわう町にかかり、人々はそろって太平の歌を歌う。
      見ればあらゆる通り、市場に灯が輝き、空には丸い鏡が昇り始めた。
      月は馮夷（ひょうい）が押し上げた、まばゆい銀の盆のよう。
      灯は仙女が織り上げた、地を覆う錦のよう。
      灯が月を映せば、輝きは倍になり、
      月が灯を照らせば、きらめきはいっそう増す。
      鉄の鎖を張った星の橋も、灯の花、火の木も、見尽くせない。
      雪花灯籠、梅花灯籠は、春の氷を細かく切ったよう。
      刺繍屏風の灯籠、絵屏風の灯籠は、五色を集めて作られる。
      胡桃の灯籠、蓮の灯籠は、灯の楼に高くかかり、
      青獅子の灯籠、白象の灯籠は、高い台に掲げられる。
      海老の灯籠、すっぽんの灯籠は、小屋の前で高く揺れ、
      羊の灯籠、兎の灯籠は、軒の下で生き生きとしている。
      鷹の灯籠、鳳の灯籠は、つながり並び、
      虎の灯籠、馬の灯籠は、一緒に駆け、一緒に歩く。
      仙鶴の灯籠、白鹿の灯籠には、寿星（じゅせい）がまたがり、
      金魚の灯籠、長鯨の灯籠には、李白（りはく）が高く乗る。
      鰲山灯（ごうざんとう）には神仙が集まり、走馬灯（そうまとう）では武将が刃を交える。
      幾千幾万の家の楼台に灯がともり、十数里にわたって雲霞の世界が広がる。
      あちらからは、玉飾りの馬の泥よけを鳴らして、馬が走り来る。
      こちらでは、香り高い車が、ごろごろと通り過ぎる。
      紅に飾られた楼の上では、欄干にもたれ、簾を隔て、肩を並べ、手を取り合って、
      二人連れの美女たちが、楽しみに夢中になっている。
      緑の水にかかる橋のほとりでは、騒がしく、錦のように群れ、ほろ酔いで、にこにこと、
      連れ立った遊客たちが、華やかな遊びを楽しむ。
      町じゅうに笛と太鼓が鳴り響き、夜通し笙と歌が絶えなかった。
    "translation_status": "reviewed"

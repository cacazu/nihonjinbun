  - "id": "xy-ch91-017"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      錦繡場中唱彩蓮，太平境內簇人煙。
      燈明月皎元宵夜，雨順風調大有年。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 149
        "line_end": 150
    "translation_ja": |-
      錦のような広場には、蓮摘みの歌が響き、
      平和な土地には、人々が群れ集う。
      灯は明るく、月は白く澄む元宵の夜、
      雨も風も順調で、実り豊かな年となる。
    "translation_status": "reviewed"
  - "id": "xy-ch91-018"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時正是金吾不禁，亂烘烘的，無數人煙。有那跳舞的，屣蹺的，裝鬼的，騎象的，東一攢，西一簇，看之不盡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 152
        "line_end": 152
    "translation_ja": "この時ばかりは夜間の取り締まりもなく、どこも大騒ぎで、数えきれないほどの人であった。踊る者、高足で歩く者、鬼に扮する者、象に乗る者。東にも一群、西にも一群と、いくら見ても見尽くせない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-019"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻才到金燈橋上，唐僧與眾僧近前看處，原來是三盞金燈。那燈有缸來大，上照著玲瓏剔透的兩層樓閣。都是細金絲兒編成，內托著琉璃薄片，其光晃月，其油噴香。唐僧回問眾僧道：「此燈是甚油？怎麼這等異香撲鼻？」眾僧道：「老師不知。我這府後有一縣，名喚旻天縣，縣有二百四十里。每年審造差徭，共有二百四十家燈油大戶。府縣的各項差徭猶可，惟有此大戶甚是吃累：每家當一年，要使二百多兩銀子。此油不是尋常之油，乃是酥合香油。這油每一兩值價銀二兩，每一斤值三十二兩銀子。三盞燈，每缸有五百斤，三缸共一千五百斤，共該銀四萬八千兩。還有雜項繳纏使用，將有五萬餘兩，只點得三夜。」行者道：「這許多油，三夜何以就點得盡？」眾僧道：「這缸裡每缸有四十九個大燈馬，都是燈草札的把，裹了絲綿，有雞子粗細。只點過今夜，見佛爺現了身，明夜油也沒了，燈就昏了。」八戒在傍笑道：「想是佛爺連油都收去了。」眾僧道：「正是此說，滿城裡人家，自古及今，皆是這等傳說。但油乾了，人俱說是佛祖收了燈，自然五穀豐登；若有一年不乾，卻就年成荒旱，風雨不調。所以人家都要這供獻。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      ようやく金灯橋に着き、三蔵が寺の僧たちと近づいて見ると、そこにあるのは三つの金灯であった。灯は大甕ほどもあり、その上を、透かし細工の二層の楼閣が覆っていた。どれも細い金の糸で編まれ、内側には薄い瑠璃の板がはめ込んである。光は月をもまぶしく照らし、油はよい香りを放っていた。三蔵は僧たちを振り返って尋ねた。
      三蔵「この灯には、何の油を使っているのですか。どうしてこんなに珍しい香りが、鼻を打つのでしょう。」
      寺僧たち「老師はご存じないでしょう。この府の奥には旻天県（びんてんけん）という県があり、二百四十の地区に分かれております。毎年、賦役を割り当てる名簿を調べて作り、灯油大戸（とうゆたいこ）に当たる家が合わせて二百四十戸ございます。府や県のほかの賦役はまだよいのですが、この大戸だけは、ひどい負担です。一戸が一年の当番に当たると、銀二百両（りょう）余りを使わなければなりません。この油は普通の油ではなく、酥合香油（そごうこうゆ）と申します。油一両につき銀二両、一斤（きん）につき銀三十二両もするのです。灯は三つで、甕一つに五百斤、三つで合計千五百斤ですから、銀四万八千両になります。そのほか、さまざまな費用や手間賃もあって、五万両余りにもなります。それで点けられるのは、たった三晩なのです。」
      悟空「それほどたくさんの油が、どうして三晩で燃え尽きるんだ。」
      寺僧たち「甕の中には、それぞれ四十九本の大きな灯心がございます。どれも灯心草を束ねて真綿でくるみ、鶏の卵ほどの太さがあります。今夜、仏さまがお姿を現されるのを拝見すれば、あすの夜にはもう油がなくなり、灯は暗くなります。」
      八戒はそばで笑った。
      八戒「仏さまが、油ごと持っていってしまうんじゃないか。」
      寺僧たち「まさにそのとおりで、町じゅうの家々が昔からそう伝えております。油がなくなると、みな仏祖（ぶっそ）が灯の供物をお納めになったと言い、五穀はおのずと豊かに実ります。もし、ある年に油がなくならなければ、その年は飢饉や日照りとなり、雨も風も順調ではございません。ですから、どの家もこの供え物を望むのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-020"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，只聽得半空中呼呼風響，諕得些看燈的人盡皆四散。那些和尚也立不住腳道：「老師父，回去罷。風來了，是佛爺降祥，到此看燈也。」唐僧道：「怎見得是佛來看燈？」眾僧道：「年年如此，不上三更，就有風來。知道是諸佛降祥，所以人皆迴避。」唐僧道：「我弟子原是思佛念佛拜佛的人，今逢佳景，果有諸佛降臨，就此拜拜，多少是好。」眾僧連請不回。少時，風中果現出三位佛身，近燈來了。慌得那唐僧跑上橋頂，倒身下拜。行者急忙扯起道：「師父，不是好人，必定是妖邪也。」說不了，見燈光昏暗，呼的一聲，把唐僧抱起，駕風而去。噫！不知是那山那洞真妖怪，積年假佛看金燈。諕得那八戒兩邊尋找，沙僧左右招呼。行者叫道：「兄弟，不須在此叫喚。師父樂極生悲，已被妖精攝去了。」那幾個和尚害怕道：「爺爺，怎見得是妖精攝去？」行者笑道：「原來你這夥凡人累年不識，故被妖邪惑了，只說是真佛降祥，受此燈供。剛才風到處，現佛身者，就是三個妖精。我師父亦不能識，上橋頂就拜，卻被他侮暗燈光，將器皿盛了油，連我師父都攝去。我略走遲了些兒，所以他三個化風而遁。」沙僧道：「師兄，這般卻如之何？」行者道：「不必遲疑，你兩個同眾回寺，看守馬匹、行李，等老孫趁此風追趕去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      話していると、空でごうごうと風が鳴り始めた。灯を見ていた人々は驚き、四方へ散った。僧たちもその場にとどまっていられず、声を上げた。
      寺僧たち「老師さま、帰りましょう。風が来ました。仏さまがめでたくお降りになり、灯を見にいらっしゃるのです。」
      三蔵「なぜ、仏が灯を見に来ると分かるのですか。」
      寺僧たち「毎年こうなのです。三更（さんこう）になる前に風が吹きます。諸仏がお降りになるのだと分かっておりますから、みな避けるのでございます。」
      三蔵「私はもともと仏を思い、念じ、拝む者です。今この美しい景色の中へ、本当に諸仏がおいでになるなら、ここで拝ませて頂けるとは、なんとありがたいことでしょう。」
      僧たちが何度勧めても、三蔵は帰ろうとしなかった。ほどなく風の中に、本当に三体の仏の姿が現れ、灯に近づいてきた。三蔵は慌てて橋の頂へ駆け上がり、身を伏せて拝んだ。悟空は急いで引き起こした。
      悟空「お師匠さま、まともな者ではありません。きっと妖怪です！」
      言い終わらぬうちに灯が暗くなり、ひゅうと音がして、三蔵は抱え上げられ、風に乗って連れ去られた。ああ、どこの山、どこの洞の妖怪とも知れぬ者が、長年仏のふりをして、金灯を見に来ていたのだ。
      八戒は驚いてあちらこちらを捜し、沙悟浄も左右へ呼びかけた。悟空が叫んだ。
      悟空「二人とも、ここで呼んでいても仕方がない。お師匠さまは楽しみの果てに悲しみに遭い、もう妖怪にさらわれてしまった。」
      そばにいた僧たちはおびえて尋ねた。
      寺僧たち「老師さま、なぜ妖怪にさらわれたと、お分かりになるのです。」
      悟空は笑った。
      悟空「お前たち凡人は長年見抜けなかったから、妖怪にだまされ、本物の仏が降りてきて灯を受け取ると思い込んでいたんだな。いま風の中で仏の姿になっていたのは、三匹の妖怪だ。お師匠さまも見破れず、橋の上へ行って拝んだ。やつらは灯を暗くし、器に油を入れ、ついでにお師匠さままでさらっていったんだ。俺が少し動くのに遅れたので、三匹は風に化けて逃げてしまった。」
      沙悟浄「兄さん、ではどうすればよいでしょう。」
      悟空「迷っている暇はない。お前たち二人は、みんなと寺へ帰って馬と荷物を守ってくれ。俺は、この風を追っていく。」
    "translation_status": "reviewed"

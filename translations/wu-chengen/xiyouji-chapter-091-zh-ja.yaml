    "source_text": "好大聖，急縱觔斗雲，起在半空，聞著那腥風之氣，往東北上徑趕。趕至天曉，倏爾風息。見有一座大山，十分險峻，著實嵯峨，好山："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 155
        "line_end": 155
    "translation_ja": "さすがの悟空は、すぐさま筋斗雲（きんとうん）を飛ばして空へ上がり、風の生臭さを嗅ぎながら、北東へまっすぐ追った。夜明けまで追うと、ふいに風がやんだ。そこには大きな山があり、ひどく険しく、いかにも高々とそびえていた。なんという山だろう。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-022"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "重重丘壑，曲曲源泉。藤蘿懸削壁，松柏挺虛巖。鶴鳴晨霧裡，鴈唳曉雲間。峨峨矗矗峰排戟，突突磷磷石砌磐。頂巔高萬仞，峻嶺疊千灣。野花佳木知春發，杜宇黃鶯應景妍。能巍奕，實巉巖，古怪崎嶇險又艱。停玩多時人不語，只聽虎豹有聲鼾。香獐白鹿隨來往，玉兔青狼去復還。深澗水流千萬里，回湍激石響潺潺。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      丘と谷が幾重にも連なり、水の源は曲がりくねる。
      藤や蔓は切り立つ壁に垂れ、松や柏は高い岩場にそびえる。
      鶴は朝霧の中で鳴き、雁は明け方の雲間に声を上げる。
      高く突き出た峰々は戟を並べたよう、
      ごつごつ重なる岩々は、巨大な盤を積んだよう。
      頂は万仞（じん）もの高さに達し、険しい尾根は幾千の曲折を重ねる。
      野の花や美しい木々は春を知って芽吹き、
      ほととぎすや高麗鶯は、季節にふさわしい美しさを添える。
      なんと高く雄大で、まことに険しい岩山か。
      怪しく曲がりくねり、危険で進むのも難しい。
      しばらく立ち止まって眺めても人の声はなく、
      聞こえるのは、虎や豹のうなり声ばかり。
      麝香鹿や白鹿が行き来し、白兎や青い狼が去っては戻る。
      深い谷の水は千里万里を流れ、
      渦巻く早瀬が石を打ち、さらさらと音を立てる。
    "translation_status": "reviewed"
  - "id": "xy-ch91-023"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖在山崖上正自找尋路徑，只見四個人趕著三隻羊，從西坡下，齊吆喝：「開泰。」大聖閃火眼金睛，仔細觀看，認得是年、月、日、時四值功曹使者，隱像化形而來。大聖即掣出鐵棒，幌一幌，碗來粗細，有丈二長短。跳下崖來，喝道：「你都藏頭縮頸的那裡走？」四值功曹見他說出風息，慌得喝散三羊，現了本相，閃下路傍施禮道：「大聖恕罪，恕罪。」行者道：「這一向也不曾用著你們，你們見老孫寬慢，都一個個弄懈怠了，見也不來見我一見，是怎麼說？你們怎麼不暗中保祐吾師，都往那裡去？」功曹道：「你師父寬了禪性，在於金平府慈雲寺貪歡，所以泰極生否，樂盛成悲，今被妖邪捕獲。他身邊有護法伽藍保著哩。吾等知大聖連夜追尋，恐大聖不識山林，特來傳報。」行者道：「你既傳報，怎麼隱姓埋名，趕著三個羊兒，吆吆喝喝作甚？」功曹道：「設此三羊，以應開泰之言，喚做『三陽開泰』，破解你師之否塞也。」行者恨恨的要打，見有此意，卻就免之，收了棒，回嗔作喜道：「這座山可是妖精之處？」功曹道：「正是，正是。此山名青龍山，內有洞，名玄英洞。洞中有三個妖精：大的個名辟寒大王，第二個號辟暑大王，第三個號辟塵大王。這妖精在此有千年了。他自幼兒愛食酥合香油，當年成精，到此假裝佛像，哄了金平府官員人等，設立金燈，燈油用酥合香油。他年年到正月半，變佛像收油。今年見你師父，他認得是聖僧之身，連你師父都攝在洞內，不日要割剮你師之肉，使酥合香油煎吃哩。你快用工夫，救援去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      悟空が山の崖の上で道を探していると、四人の男が三匹の羊を追い、西の斜面から下りてきた。一緒に声を張り上げている。
      四人の男「開泰（かいたい）！」
      悟空は火眼金睛（かがんきんせい）を光らせ、よく見た。年、月、日、時をそれぞれ受け持つ四値功曹（しちこうそう）の使者が、本来の姿を隠して化けて来たのだと分かったのである。すぐ鉄棒を取り出して一振りすると、太さは椀ほど、長さは一丈（じょう）二尺（しゃく）ほどになった。悟空は崖から跳び下りて怒鳴った。
      悟空「こそこそ正体を隠して、どこへ行く！」
      四値功曹は見破られたと知り、慌てて羊を追い散らして本来の姿に戻り、道の脇へ退いて礼をした。
      四値功曹「大聖（たいせい）、お許しください。お許しください。」
      悟空「このところお前たちを使わずにいたら、俺が甘いのをいいことに、みんな怠けるようになったな。顔を見せに来もしないとは、どういうことだ。なぜ陰で師匠を守らず、どこをほっつき歩いていた！」
      四値功曹「お師匠さまは禅の心を緩め、金平府の慈雲寺で楽しみにふけられました。そのため、順境が極まって逆境へ転じ、楽しみが盛んになって悲しみとなり、妖怪に捕らえられたのでございます。おそばでは護法伽藍（ごほうがらん）が守っております。私どもは大聖が夜通し追ってこられたと知り、この山林のことをお分かりにならないだろうと、わざわざ知らせに参りました。」
      悟空「知らせに来たなら、どうして名も正体も隠し、三匹の羊を追って、わあわあ叫んでいたんだ。」
      四値功曹「この三匹の羊を用意したのは、開泰という言葉に合わせるためです。『三陽開泰（さんようかいたい）』と申し、お師匠さまの行き詰まった運を開こうとしたのでございます。」
      悟空は腹立ちまぎれに打ちかかろうとしたが、そんな意図があったと知って、やめた。棒を収め、怒りを笑顔に変えて尋ねた。
      悟空「この山が、妖怪の住みかなのか。」
      四値功曹「そのとおりです。この山は青竜山（せいりゅうざん）といい、中に玄英洞（げんえいどう）という洞がございます。そこには三匹の妖怪がおり、いちばん上は辟寒大王（へきかんだいおう）、二番目は辟暑大王（へきしょだいおう）、三番目は辟塵大王（へきじんだいおう）と名乗っております。ここに住みついて千年になります。幼いころから酥合香油を食べるのが好きで、昔、妖怪となってからこの地へ来て、仏の姿に化け、金平府の役人や人々をだましました。金灯を設けさせ、灯油には酥合香油を使わせているのです。毎年正月の半ばになると仏に化けて油を集めますが、今年はお師匠さまを見て聖僧の身だと見抜き、お師匠さままで洞へさらいました。近いうちに、その肉をそぎ取って、酥合香油で焼いて食べるつもりでございます。急いで力を尽くし、お救いください。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-024"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，喝退四功曹，轉過山崖，找尋洞府。行未數里，只見那澗邊有一石崖。崖下是座石屋，屋有兩扇石門，半開半掩。門傍立有石碣，上有六字，卻是「青龍山玄英洞」。行者不敢擅入，立定步，叫聲：「妖怪！快送我師父出來。」那裡唿喇一聲，大開了門，跑出一陣牛頭精，鄧鄧呆呆的問道：「你是誰，敢在這裡呼喚！」行者道：「我本是東土大唐取經的聖僧唐三藏之大徒弟。路過金平府觀燈，我師被你家魔頭攝來。快早送還，免汝等性命；如或不然，掀翻你窩巢，教你群精都化為膿血。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空は聞き終わると、四値功曹を下がらせ、崖を回って洞を捜した。数里も行かぬうちに、谷川のほとりに石の崖が見つかった。崖の下には石造りの家があり、二枚の石の扉は半ば開き、半ば閉じていた。門の脇には石碑が立ち、「青竜山玄英洞」の六字が刻まれている。悟空はむやみに入らず、足を止めて叫んだ。
      悟空「妖怪ども、さっさと俺の師匠を返せ！」
      門がばっと大きく開き、牛の頭をした小妖たちが一群となって駆け出し、ぼんやりと目を見張って尋ねた。
      牛頭の小妖たち「誰だ、お前は！　ここで騒ぐとは、どういうつもりだ！」
      悟空「俺は、東土（とうど）大唐から経を取りに来た聖僧、唐三蔵（とうさんぞう）の一番弟子だ。金平府を通って灯を見ていたところ、お前たちの頭が、師匠をさらってきた。すぐに返せば、お前たちの命は助けてやる。さもなければ巣をひっくり返し、お前たち一匹残らず膿と血に変えてやるぞ！」
    "translation_status": "reviewed"
  - "id": "xy-ch91-025"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那些小妖聽言，急入裡邊報道：「大王，禍事了，禍事了。」三個老妖正把唐僧拿在那洞中深遠處，那裡問甚麼青紅皂白，教小的選剝了衣裳，汲湍中清水洗淨，算計要細切細剉，著酥合香油煎吃。忽聞得報聲「禍事」，老大著驚，問是何故。小妖道：「大門前有一個毛臉雷公嘴的和尚嚷道：大王攝了他師父來，教快送出去，免吾等性命；不然，就要掀翻窩巢，教我們都化為膿血哩。」那老妖聽說，個個心驚道：「才拿了這廝，還不曾問他個姓名來歷。小的們，且把衣服與他穿了，帶過來審他一審，端是何人，何自而來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      小妖たちは聞くなり、急いで奥へ報告に走った。
      小妖たち「大王、大変です、大変です！」
      辟寒大王たち三人は、そのころ三蔵を洞の奥深くへ捕らえていた。事情など何一つ聞かず、手下に衣をはぎ取らせ、谷川の澄んだ水を汲んで体を洗わせ、細かく切り刻んで酥合香油で焼いて食べようと考えていたのである。「大変だ」という報告を聞くと、辟寒大王は驚き、何事かと尋ねた。
      小妖「大門の前に、毛むくじゃらの顔で雷神のような口をした僧が来て、叫んでおります。大王が自分の師匠をさらってきたので、すぐ返せ、そうすれば我々の命は助ける、さもなければ巣をひっくり返し、みな膿と血に変えてやる、と。」
      三大王は聞いて、一人残らずぎくりとした。
      三大王「こいつを捕らえたばかりで、まだ名前も素性も聞いていなかった。お前たち、ひとまず服を着せて、こちらへ連れてこい。いったい何者で、どこから来たのか、取り調べてみよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-026"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾妖一擁上前，把唐僧解了索，穿了衣服，推至座前。諕得唐僧戰兢兢的跪在下面，只叫：「大王饒命，饒命。」三個妖精異口同聲道：「你是那方來的和尚？怎麼見佛像不躲，卻衝撞我的雲路？」唐僧磕頭道：「貧僧是東土大唐駕下差來的，前往天竺國大雷音寺拜佛祖取經的。因到金平府慈雲寺打齋，蒙那寺僧留過元宵看燈。正在金燈橋上，見大王顯現佛像，貧僧乃肉眼凡胎，見佛就拜，故此衝撞大王雲路。」那妖精道：「你那東土到此，路程甚遠。一行共有幾眾？都叫甚名字？快實實供來，我饒你性命。」唐僧道：「貧僧俗名陳玄奘，自幼在金山寺為僧。後蒙唐皇敕賜在長安洪福寺為僧官。又因魏徵丞相夢斬涇河老龍，唐王遊地府，回生陽世，開設水陸大會，超度陰魂，蒙唐王又選賜貧僧為壇主，大闡都綱。幸觀世音菩薩出現，指化貧僧，說西天大雷音寺有三藏真經，可以超度亡者昇天，差貧僧來取，因賜號三藏，即倚唐為姓，所以人都呼我為唐三藏。我有三個徒弟。第一個姓孫，名悟空行者，乃齊天大聖歸正。」群妖聞得此名，著了一驚道：「這個齊天大聖，可是五百年前大鬧天宮的？」唐僧道：「正是，正是。第二個姓豬，名悟能八戒，乃天蓬大元帥轉世。第三個姓沙，名悟淨和尚，乃捲簾大將臨凡。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      小妖たちはどっと三蔵に寄り、縄を解いて服を着せると、玉座の前へ押していった。三蔵は恐怖に震えながら下にひざまずき、ただ命乞いをした。
      三蔵「大王、命だけは、どうか命だけはお助けください。」
      三大王は口をそろえて尋ねた。
      三大王「お前はどこから来た僧だ。なぜ仏の姿を見て避けずに、俺たちの雲の通り道へ飛び込んだ。」
      三蔵は額を地につけた。
      三蔵「私は東土大唐の皇帝陛下から遣わされ、天竺国の大雷音寺（だいらいおんじ）へ仏祖を拝して経を頂きに参る者です。金平府の慈雲寺で食事のお布施を頂いたところ、寺の僧たちが、元宵の灯を見ていくよう引き留めてくださいました。金灯橋の上で、大王が仏のお姿を現されたのを拝見したのです。私は肉眼しか持たぬ凡人ですから、仏を見れば拝みます。それで、大王の雲のお通りを邪魔してしまいました。」
      三大王の一人「その東土からここまでは、ずいぶん遠いはずだ。一行は何人で、それぞれ何という名だ。さあ、正直にすべて述べれば、命は助けてやろう。」
      三蔵「私の俗名は陳玄奘（ちんげんじょう）といい、幼いころから金山寺（きんざんじ）の僧でした。その後、唐の皇帝から勅命を賜り、長安（ちょうあん）の洪福寺（こうふくじ）で僧官となりました。また、丞相（じょうしょう）の魏徴（ぎちょう）が夢の中で涇河（けいが）の老竜を斬ったため、唐の天子が冥府へ赴き、この世に生き返られて、水陸大会（すいりくだいえ）を開き、亡者の魂を供養なさいました。その折、天子はさらに私を選んで壇主（だんしゅ）、大闡都綱（だいせんとこう）に任じてくださいました。幸いにも観世音菩薩（かんぜおんぼさつ）がお姿を現して私を導き、西天（さいてん）の大雷音寺には、亡者を救い天へ昇らせる三蔵の真経があるとお教えになり、私はそれを取りに遣わされました。そのため三蔵の号を賜り、唐を姓とすることになったので、皆が私を唐三蔵と呼ぶのでございます。弟子は三人おります。一人目は姓を孫（そん）、名を悟空行者（ごくうぎょうじゃ）といい、正しい道へ帰した斉天大聖（せいてんたいせい）です。」
      妖怪たちはこの名を聞いて驚いた。
      群妖「その斉天大聖とは、五百年前に天宮で大暴れしたやつのことか。」
      三蔵「そのとおりです。そのとおりです。二人目は姓を猪（ちょ）、名を悟能八戒（ごのうはっかい）といい、天蓬大元帥（てんぽうだいげんすい）の生まれ変わりです。三人目は姓を沙（さ）、名を悟浄和尚（ごじょうおしょう）といい、捲簾大将（けんれんたいしょう）がこの世へ下った者です。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-027"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三個妖王聽說，個個心驚道：「早是不曾吃他。小的們，且把唐僧將鐵鏈鎖在後面，待拿他三個徒弟來湊吃。」遂點了一群山牛精、水牛精、黃牛精，各持兵器，走出門，掌了號頭，搖旗擂鼓。三個妖披掛整齊，都到門外喝道：「是誰人敢在我這裡吆喝？」行者閃在石崖上，仔細觀看，那妖精生得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      三大王は聞くと、そろって肝を冷やした。
      三大王「まだ食っていなくてよかった。お前たち、ひとまず三蔵を奥へ鉄の鎖でつないでおけ。三人の弟子も捕まえて、一緒に食ってやろう。」
      そこで山牛の妖、水牛の妖、黄牛の妖を一隊選び、それぞれ武器を持たせて門の外へ出した。合図のラッパを吹き、旗を振り、太鼓を打つ。三大王も鎧兜を整え、門の外へ出て怒鳴った。
      三大王「誰だ、俺たちのところでわめいているのは！」
      悟空は石の崖に身を寄せて、よく見た。三大王の姿は、こうであった。
    "translation_status": "reviewed"
  - "id": "xy-ch91-028"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "彩面環睛，二角崢嶸。尖尖四隻耳，靈竅閃光明。一體花紋如彩畫，滿身錦繡若蜚英。第一個，頭頂狐裘花帽暖，一臉昂毛熱氣騰；第二個，身掛輕紗飛烈焰，四蹄花瑩玉玲玲；第三個，威雄聲吼如雷振，獠牙尖利賽銀針。個個勇而猛，手持三樣兵：一個使鉞斧，一個大刀能；但看第三個，肩上橫擔扢撻藤。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      彩りある顔に、丸く見開いた目、二本の角が高くそびえる。
      尖った四つの耳、その霊妙な穴には光がきらめく。
      一つの体の模様は彩色の絵のよう、全身の錦は舞い散る花のよう。
      一人目は、狐の毛皮の花帽子で頭を暖め、
      顔じゅうの逆立つ毛から、熱気を立ち昇らせる。
      二人目は、薄絹をまとって烈火をひるがえし、
      四つの蹄は花のように輝き、玉のようにつややかだ。
      三人目は、雄々しく威勢よく、雷のような声で吼え、
      鋭く尖った牙は、銀の針をしのぐ。
      どれも勇ましく猛々しく、手に持つ武器は三種類。
      一人は鉞斧（えっぷ）を使い、一人は大刀に秀で、
      三人目を見れば、肩に扢撻藤（こったつとう）を横たえている。
    "translation_status": "reviewed"
  - "id": "xy-ch91-029"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又見那七長八短、七肥八瘦的大大小小妖精，都是些牛頭鬼怪，各執槍棒。有三面大旗，旗上明明書著「辟寒大王」、「辟暑大王」、「辟塵大王」。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 167
        "line_end": 167
    "translation_ja": "ほかにも、背の高い者低い者、太った者痩せた者、大小さまざまな妖怪が見えた。みな牛頭の鬼のような姿で、槍や棒を手にしている。大旗が三本あり、それぞれにはっきりと「辟寒大王」「辟暑大王」「辟塵大王」と書かれていた。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-030"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫行者看了一會，忍耐不得，上前高叫道：「潑賊怪！認得老孫麼？」那妖喝道：「你是那鬧天宮的孫悟空？真個是聞名不曾見面，見面羞殺天神。你原來是這等個猢猻兒。」行者大怒，罵道：「我把你這個偷燈油的賊，油嘴妖怪，不要胡談，快還我師父來。」趕近前，掄鐵棒就打；那三個老妖舉三般兵器，急架相迎。這一場在山凹中好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      悟空はしばらく見ていたが、もう我慢できず、進み出て大声を上げた。
      悟空「悪党の妖怪め！　この俺が分かるか！」
      三大王の一人が怒鳴った。
      三大王の一人「お前が天宮で暴れた孫悟空（そんごくう）か。噂には聞いていたが、顔は見たことがなかった。会ってみれば、天の神々も赤恥をかくというものだ。なんだ、こんな猿っころだったのか！」
      悟空は激怒して罵った。
      悟空「この灯油泥棒め！　油まみれの口で、よくもぺらぺらとほざく妖怪だ。くだらないことを言わず、すぐ師匠を返せ！」
      駆け寄って鉄棒を振り下ろすと、三大王はそれぞれの武器を挙げ、急いで受け止めた。山あいで、すさまじい戦いが始まった。
    "translation_status": "reviewed"
  - "id": "xy-ch91-031"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "鉞斧鋼刀扢撻藤，猴王一棒敢來迎。辟寒辟暑辟塵怪，認得齊天大聖名。棒起致令神鬼怕，斧來刀砍亂飛騰。好一個混元有法真空像，抵住三妖假佛形。那三個偷油潤鼻今年犯，務捉欽差駕下僧。這個因師不懼山程遠，那個為嘴常年設獻燈。乒乓只聽刀斧響，劈朴惟聞棒有聲。衝衝撞撞三攢一，架架遮遮各顯能。一朝鬥至天將晚，不知那個虧輸那個贏。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      鉞斧、鋼の刀、扢撻藤に、悟空が一本の棒で果敢に挑む。
      辟寒（へきかん）、辟暑（へきしょ）、辟塵（へきじん）の妖怪は、斉天大聖の名を知っている。
      棒が振るわれれば神も鬼も恐れ、斧が襲い、刀が斬り、入り乱れて飛び交う。
      さすがは混元（こんげん）の法を備えた、真空（しんくう）の姿。
      仏の姿を偽る三匹の妖怪を、食い止める。
      あの三匹は、油を盗んで鼻先を潤してきたが、今年は罪を重ね、
      勅命を受けた皇帝の使者たる僧を、どうしても捕らえようとする。
      こちらは師のため、遠い山道も恐れず、
      あちらは口を養うため、長年、灯を供えさせてきた。
      がんがんと、刀と斧の音ばかりが響き、
      ばしばしと、棒の音だけが聞こえる。
      突き進み、ぶつかり合い、三人が一人に群がり、
      受け止め、払いのけ、それぞれ腕を見せる。
      朝から戦って、空は夕暮れに近づいたが、
      どちらが負け、どちらが勝つのか、まだ分からない。
    "translation_status": "reviewed"
  - "id": "xy-ch91-032"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫行者一條棒與那三個妖魔鬥經百五十合，天色將晚，勝負未分。只見那辟塵大王把扢撻藤閃一閃，跳過陣前，將旗搖了一搖。那夥牛頭怪簇擁上前，把行者圍在垓心，各掄兵器，亂打將來。行者見事不諧，唿喇的縱起觔斗雲，敗陣而走。那妖更不來趕，招回群妖，安排些晚食，眾各吃了。也叫小妖送一碗與唐僧，只待拿住孫行者等才要整治。那師父一則長齋，二則愁苦，哭啼啼的未敢沾唇不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 172
        "line_end": 172
    "translation_ja": "悟空は一本の棒で三大王を相手に百五十合を戦った。日が暮れかけても、勝負はつかない。すると辟塵大王が扢撻藤をさっと振り、陣の前へ跳び出して旗を一振りした。牛頭の小妖たちがどっと押し寄せ、悟空を真ん中に囲むと、それぞれ武器を振るい、めった打ちにかかってきた。悟空は形勢が悪いと見て、ひゅっと筋斗雲へ跳び乗り、敗走した。辟塵大王たちは追わず、小妖たちを呼び戻して夕食を用意させ、みな食事をした。小妖には三蔵にも一杯届けさせた。悟空たちを捕らえてから、まとめて料理するつもりなのである。三蔵はいつも精進を守っていたうえ、悲しみに沈んでいたので、泣くばかりで、口をつけようとしなかった。この話はいったん置く。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-033"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者駕雲回至慈雲寺內，叫聲：「師弟。」那八戒、沙僧正自盼望商量，聽得叫時，一齊出接道：「哥哥，如何去這一日方回？端的師父下落何如？」行者笑道：「昨夜聞風而趕，至天曉，到一山，不見。幸四值功曹傳信道：那山叫做青龍山，山中有一玄英洞。洞中有三個妖精，喚做辟寒大王、辟暑大王、辟塵大王。原來積年在此偷油，假變佛像，哄了金平府官員人等。今年遇見我們，他不知好歹，反連師父都攝去。老孫審得此情，吩咐功曹等眾暗中保護師父，我尋近門前叫罵。那三怪齊出，都像牛頭鬼形。第一個使鉞斧，第二個使大刀，第三個使藤棍。後引一窩子牛頭鬼怪，搖旗擂鼓，與老孫鬥了一日，殺個手平。那妖王搖動旗，小妖都來。我見天晚，恐不能取勝，所以駕觔斗回來也。」八戒道：「那裡想是酆都城鬼王弄喧？」沙僧道：「你怎麼就猜道是酆都城鬼王弄喧？」八戒笑道：「哥哥說是牛頭鬼怪，故知之耳。」行者道：「不是，不是。若論老孫看那怪，是三隻犀牛成的精。」八戒道：「若是犀牛，且拿住他，鋸下角來，倒值好幾兩銀子哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      一方、悟空は雲に乗って慈雲寺へ戻り、声をかけた。
      悟空「二人とも！」
      八戒と沙悟浄は、帰りを待ちわびながら相談していたところだった。声を聞くと、そろって迎えに出た。
      八戒と沙悟浄「どうして丸一日もかかって、今ごろ帰ってきたのです。お師匠さまの居所は、結局どうなりましたか。」
      悟空は笑った。
      悟空「昨夜は風の臭いを追いかけ、夜明けに一つの山へ着いたが、やつらを見失った。幸い四値功曹が知らせてくれたんだ。青竜山という山で、中には玄英洞がある。そこに三匹の妖怪がいて、辟寒大王、辟暑大王、辟塵大王という。長年ここで油を盗み、仏の姿に化けて、金平府の役人や人々をだましていたのだ。今年は俺たちに出くわし、相手もわきまえず、お師匠さままでさらっていった。俺は事情を確かめると、功曹たちに師匠を陰で守るよう言いつけ、門の前まで捜し当てて、怒鳴りつけた。三匹がそろって出てきたが、どれも牛頭の鬼のような姿だった。一匹目は鉞斧、二匹目は大刀、三匹目は藤の棒を使う。後ろには牛頭の小妖どもを一群引き連れ、旗を振り、太鼓を打っていた。俺と一日戦って、互角だったんだ。その妖王が旗を振ると、小妖どもまで寄ってきた。日が暮れたし、勝ちを収められそうにないと思ったので、筋斗雲で戻ったというわけさ。」
      八戒「そりゃ酆都城（ほうとじょう）の鬼王が騒いでいるんじゃないか。」
      沙悟浄「どうして、酆都城の鬼王が騒いでいると決めつけるのです。」
      八戒は笑った。
      八戒「兄貴が牛頭の鬼みたいだって言うから、そうと分かったのさ。」
      悟空「違う、違う。俺があの姿を見たところでは、三匹の犀が妖怪になったものだ。」
      八戒「犀なら、捕まえて角を鋸で切り落とせば、銀何両もの値がつくぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch91-034"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，眾僧道：「孫老爺可吃晚齋？」行者道：「方便吃些兒，不吃也罷。」眾僧道：「老爺征戰這一日，豈不饑了？」行者笑道：「這日把兒那裡便得饑？老孫曾五百年不吃飲食哩。」眾僧不知是實，只以為說笑。須臾拿來，行者也吃了。道：「且收拾睡覺，待明日我等都去相持，拿住妖王，庶可救師父也。」沙僧在傍道：「哥哥說那裡話！常言道：『停留長智。』那妖精倘或今晚不睡，把師父害了，卻如之何？不若如今就去，嚷得他措手不及，方才好救師父。少遲，恐有失也。」八戒聞言，抖擻神威道：「沙兄弟說得是，我們都趁此月光去降魔耶。」行者依言，即吩咐寺僧：「看守行李、馬匹，待我等把妖精捉來，對本府刺史證其假佛，免卻燈油，以蘇概縣小民之困，卻不是好？」眾僧遵命。他三個遂縱起祥雲，出城而去。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      話していると、寺の僧たちが尋ねた。
      寺僧たち「孫さま、夕食をお召し上がりになりますか。」
      悟空「用意できるなら、少し食べよう。なければ食べなくてもいい。」
      寺僧たち「一日じゅう戦われて、お腹がおすきではありませんか。」
      悟空は笑った。
      悟空「一日やそこらで、どうして腹がすくものか。俺は昔、五百年、何も飲み食いしなかったんだぞ。」
      僧たちは本当の話とは知らず、冗談だと思った。やがて食事を運んできたので、悟空も食べた。
      悟空「ひとまず片づけて眠ろう。明日はみんなで戦いに行き、妖王どもを捕らえれば、師匠を助けられるだろう。」
      そばにいた沙悟浄が言った。
      沙悟浄「兄さん、何を言うのです。『暇を与えれば知恵がつく』と申します。もし妖怪が今夜眠らず、お師匠さまを害したら、どうするのですか。今すぐ行って、手を打つ暇もないほど騒ぎ立てたほうが、救い出せます。少しでも遅れれば、取り返しのつかないことになりかねません。」
      八戒はそれを聞くと、勇み立った。
      八戒「沙の弟の言うとおりだ。みんなでこの月明かりを頼りに、妖怪退治へ行こうじゃないか。」
      悟空は二人の言葉に従い、寺の僧たちに言いつけた。
      悟空「荷物と馬を守っていてくれ。俺たちが妖怪を捕まえてきて、この府の刺史（しし）の前で、偽の仏だと証明してやろう。そうすれば灯油の負担をなくし、県じゅうの庶民を苦しみから救える。いいことじゃないか。」
      僧たちは承知した。三人はめでたい雲に乗り、町を出ていった。まことに、こういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch91-035"
    "section_id": "chapter-91"
    "kind": "verse"
    "origin": "source"
    "source_text": "懶散無拘禪性亂，災危有分道心蒙。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      気ままに怠ければ、禅の心は乱れ、
      定まった災いが迫れば、道を求める心も曇る。
    "translation_status": "reviewed"
  - "id": "xy-ch91-036"
    "section_id": "chapter-91"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知此去勝敗何如，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch91-1455640"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第091回&oldid=1455640"
        "line_start": 178
        "line_end": 178
    "translation_ja": "さて、今度は勝つのか、負けるのか。それは次回のお話で。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-01-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「供狀」は、取り調べを受けて事実や素性を述べること。ここでは供述の意味で訳し、書面への署名や提出という動作は補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-02-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭の馬と猿は、落ち着かない意と心を示す修養のたとえとして訳した。「五彩」「神丹」「玉性」は修行の成果や保つべき本性を示す詩語と読めるが、五色の個別の対応や丹の具体的な修法は本文に示されないため、補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-03-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「應佛僧人」は、仏に仕えて読経する僧と解した。儀式上の特定の職名や宗派に限定できるかは確定していない。輪蔵はこの寺院景の経典収納設備を指すものとし、冥府の転生の場所という別義とは区別した。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-04-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "庭園の賦は、春の描写に四季の花木や仙境のたとえを重ねる。花の実際の開花時期に合わせて列挙を削ったり並べ替えたりしていない。「煉魔室」は心を乱す魔を除く修養の部屋と解したが、具体的な修法は未詳。「含笑花」の厳密な種も確定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-05-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "瑪瑙の都や瑠璃の洞は、灯の景色を宝石や仙境になぞらえた表現。実在する別の都や洞へ一行が移動したとは訳していない。鰲峰は、鰲になぞらえて山形に組んだ灯飾りとして読んだ。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-06-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "六つの点による省略符は底本本文にもある。訳者が掃除の描写を省いた記号ではない。袈裟を着て拝み、掃除をし、脱いで沙悟浄へ渡すという動作を保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-07-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "長い灯の賦は、さまざまな形の灯籠や飾りの人形、見物人を描く。寿星や李白が現実に降臨した場面ではない。玉韂は馬の泥よけをいう語として訳し、音の描写も残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-08-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「唱彩蓮」と記す。祭りの歌の文脈から「採蓮」に通じる蓮摘みの歌と解して訳したが、原文欄の「彩」を「採」へ直していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-09-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「金吾不禁」は、都の警備を担う金吾が夜間の外出を禁じないという祭りの表現。日本語では意味が伝わるよう、夜間の取り締まりがないと訳した。特定の金吾という人物が登場したわけではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-10-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「縣有二百四十里」。続く賦役名簿と二百四十家の負担の説明から、ここでの里は道のりではなく県内の住民組織・地区と解した。各里の戸数や詳しい割当方式までは本文に示されないため補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-11-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "油一両が銀二両、一斤が銀三十二両という価格は、一斤を十六両とする計算に合う。五百斤入りの甕三つで油千五百斤、銀四万八千両となる。各家の二百両余り、雑費込み五万両余りという概数も、そのまま保持した。現代の重量や貨幣額には換算していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-12-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "酥合香油は底本の文字を保った油名。蘇合香との関係は考えられるが、配合や成分は確定しない。油の消失と豊凶を結び付ける言葉は、寺僧たちが伝える土地の信仰として訳し、語り手が因果関係を保証したことにはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-13-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "風中に現れた仏の姿を、ここでは悟空が妖怪と説明する。先の寺僧の仏への信仰と、悟空による正体の判断を分け、最初から名や動物の種類を補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-14-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三羊と三陽は中国語で音が通じるため、三匹の羊を三陽開泰の吉祥の言葉に掛けている。三匹の羊を追っていた者の意図が本人たちの言葉で明かされてから、この注を付けた。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-15-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "碑文の原字は「青龍山玄英洞」。訳では龍を竜にしたが、六字という字数は変えていない。洞の名が判明する前の山景には、この名を遡って補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-16-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵はここで「俗名陳玄奘」と述べる。玄奘を僧名として述べた以前の命名とそのままでは一致しないが、この供述を別の俗名へ訂正せず、底本の自己紹介として保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-17-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この三蔵は人名ではなく、経・律・論の三つの教えの集成をいう。同じ表記でも、僧本人を呼ぶ名前・称号と、この経典を表す用法とを区別する。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-18-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここでの三人の名前は、三蔵が姓・名・以前の地位を改めて説明する正式な紹介。通常の呼称は悟空・八戒・沙悟浄のままとする。三蔵の回顧は以前の出来事を圧縮して語っているが、発言の順序や大闡都綱などの表記を、前の回に合わせて無断で改めていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-19-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「二角」「四隻耳」と述べる。三者をまとめて描く賦の中で、この角と耳の数をどう各個体へ配分するかは明示されないため、数を変更したり、一体ごとの数だと補ったりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-20-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "扢撻藤は藤の棒状の武器と解した。「扢撻」を節くれの意と読む余地はあるが、形状の細部は確定しない。扢・撻の原字を保ち、別の字へ無断で直していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-21-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「油嘴」は油の付いた口という字面と、口がうまく軽口をたたくことを重ねた罵り。灯油泥棒という非難と、ぺらぺらとしゃべるなという意味をともに残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-22-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「混元」「真空」は、悟空を道教的な根源の気と仏教的な空の境地に重ねる賛辞。三大王の偽の仏形との対比を保ち、悟空がここで新しい仏の位を授かったとは訳していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-23-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空はここで功曹たちへ護衛を命じたと報告する。それ以前の直接描写には、その命令の台詞はない。報告を削ったり、前の場面に新しい台詞を作って補ったりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-24-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "犀という種類は、ここで悟空が自分の見立てとして初めて述べる。牛頭というそれ以前の外見描写や、三大王の名に先回りしてこの種類を付けていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-25-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "五百年飲食しなかったというのは、この場の悟空の発言である。以前に鉄の丸や銅汁を与えられたという叙述との緊張は、本文を直して解消しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch91-note-26-body"
    "section_id": "chapter-91"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「停留長智」は、時を置けば考える余裕ができるという諺。ここでは待つことを勧めるのではなく、敵へ策を練る暇を与えぬよう、沙悟浄が即時行動を求めている。"
    "translation_status": "reviewed"

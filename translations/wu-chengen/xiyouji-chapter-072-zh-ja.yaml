  - "id": "xy-ch72-028"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一氣無冬夏，三秋永注春。
      炎波如鼎沸，雪浪似湯新。
      分溜滋禾稼，停流蕩俗塵。
      涓涓珠淚泛，滾滾玉生津。
      潤滑原非釀，清平還自溫。
      瑞祥本地秀，造化乃天真。
      佳人洗處冰肌滑，滌蕩塵煩玉體新。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 169
        "line_end": 175
    "translation_ja": |-
      一つの気には冬も夏もなく、秋の三か月にもいつまでも春を注ぐ。
      熱い波は鼎の煮え立つよう、雪白の波は沸かしたての湯のよう。
      流れを分ければ作物を潤し、流れをとどめれば俗世の塵を洗い去る。
      さらさらと珠の涙が浮かび、ごぼごぼと玉のしずくが湧く。
      なめらかな潤いは醸したものではなく、清く静かな水はおのずから温かい。
      めでたいしるしはこの地の秀でた気、造化の働きは自然そのもの。
      美女が洗えば氷の肌はなめらかになり、煩わしい塵を洗い流せば、玉の体は生まれ変わる。
    "translation_status": "reviewed"
  - "id": "xy-ch72-029"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那浴池約有五丈餘闊，十丈多長，內有四尺深淺，但見水清徹底。底下水一似滾珠泛玉，骨都都冒將上來，四面有六七個孔竅通流。流去二三里之遙，淌到田裡，還是溫水。池上又有三間亭子。亭子中近後壁放著一張八隻腳的板凳。兩山頭放著兩個彩漆的衣架。行者暗中喜嚶嚶的，一翅飛在那衣架頭上釘住。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 177
        "line_end": 177
    "translation_ja": "浴場の池は幅が五丈余り、長さが十丈余り、深さは四尺ほどあり、水は底まで透き通っていた。底からは、珠が転がり玉が浮かぶように、ごぼごぼと湯が湧き上がり、四方の六、七か所の穴を通って流れ出している。二、三里も流れて田に入ってなお、温かい水のままであった。池のほとりには三間のあずまやもある。その奥の壁近くには、脚が八本ある長い腰掛けが置かれ、両側の妻壁のところには、彩色した漆塗りの衣桁が二つ置かれていた。悟空はひそかに嬉しく羽音を立て、ひと羽ばたきで衣桁の上へ飛んで止まった。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-030"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那些女子見水又清又熱，便要洗浴，即一齊脫了衣服，搭在衣架上，一齊下去。被行者看見："
    "source_languages":

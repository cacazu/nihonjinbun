  "known_gaps":
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-003"
      "description_ja": "「與他換了衣帽」は八戒が三蔵の衣帽を替えて整える動作と解した。二人が互いの衣服を交換したとは断定せず、その後に屋敷へ歩く主語は前後から三蔵とした。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-009"
      "description_ja": "蹴鞠の技名と動作を列挙する賦。すべての句を残したが、拿頭・過論・張泛の切れ目や具体的な型には未確定の点がある。「出牆花」「大過海」「一團泥」「單槍」「明珠上佛頭」「窄磚」「臥魚」「扳凳」「披肩」「絞襠」「鎖項」「黃河水倒流」「金魚灘上買」「潠草鞋」「販簍」「奪門揣」などは、確実な競技技法の復元とせず、字面を日本語へ移した。底本の「腳抷」「喧泛」「只一歹」等も別版に直さず、文脈から暫定的に訳す。「叫海」は遊びを終える、または中断する呼び声と解した。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-012"
      "description_ja": "「攔路齋僧」は、道端で食事を与えて済ませず家へ迎える意に取った。女たちの歓待の台詞を、通行を妨げないという一般論には置き換えない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-026"
      "description_ja": "底本の「太陽星原貞有十」は「もと十あった」と解した。「原貞」の字は原文欄にそのまま残す。九つの泉は底本の順序と字を守り、特に東合泉・潢山泉を別の泉名へ訂正しない。「温泉」と「湯泉」もこの列挙ではそれぞれ一つの泉の固有名として数える。これは物語が語る起源説であり、現実の温泉の成因の説明ではない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-035"
      "description_ja": "「寧少路邊錢，莫少路邊拳」は、旅路で害をなす者への打撃を手控えるな、という八戒の理屈として訳した。妖怪を殺すべきだという本人の主張であり、語り手の一般的な勧めにしない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-037"
      "description_ja": "女たちは「責め苦を加えたことはない」と弁明するが、先に三蔵が吊られて苦しむ描写はある。その食い違いは修正しない。「各人走路」は打たれた後に各自の道を行けという言い回しで、八戒がここで助命を約束したとは読まない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-038"
      "description_ja": "糸が出る場所を、前には「腰眼」、ここでは「臍孔」とする。訳もそれぞれ腰のくぼみ、臍の穴とし、底本の身体部位を一つにそろえない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-039"
      "description_ja": "七人の名は蜜・螞・蠦・班・蜢・蜡・蜻、対応する虫は蜜蜂・螞蜂・蠦蜂・班毛・牛蜢・抹蜡・蜻蜓で、列挙順を保った。班毛は教育部辞典が麻蠅と説明する。蠦蜂・牛蜢・抹蜡などには種の同定の留保があり、通行字や現代の分類へ無断で置き換えない。名としての一字と虫の一般名は辞書で分けた。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-041"
      "description_ja": "ここでの「七仙姑」は小妖怪たちが母を呼ぶ語。土地神が説明した、濯垢泉の元の持ち主である天上の七仙姑と同一の存在だとはしない。 本文の欠落ではなく、解釈・底本の留保。"
    - "source_id": "wikisource-xiyou-ch72-2557105"
      "segment_ids":
        - "xy-ch72-044"
      "description_ja": "七種の鷹は黄・麻・鴏・白・鵰・魚・鷂、説明では黄鷹・麻鷹・鴏鷹・白鷹・鵰鷹・魚鷹・鷂鷹とする。底本の「鴏」の字を保持した。漢典では鴏に別の字義や鳥の字義があり、この複合鳥名の種は未確定。「魚鷹」等も一律に現生種の名称へ確定しない。 本文の欠落ではなく、解釈・底本の留保。"

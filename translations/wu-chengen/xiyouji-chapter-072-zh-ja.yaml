        "line_end": 135
    "translation_ja": "言葉では語り尽くせない。さらに詩がそのさまを伝える。詩にいう。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-011"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      蹴踘當場三月天，仙風吹下素嬋娟。
      汗沾粉面花含露，塵染蛾眉柳帶煙。
      翠袖低垂籠玉筍，緗裙斜拽露金蓮。
      幾回踢罷嬌無力，雲鬢蓬鬆寶髻偏。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 137
        "line_end": 140
    "translation_ja": |-
      蹴鞠（しゅうきく）の場は春三月、仙界の風が清らかな美女たちを吹き降ろした。
      白粉の顔に汗がにじむのは、花が露を含むよう。眉に塵がかかるのは、柳が霞を帯びるよう。
      緑の袖は低く垂れて玉の指を覆い、薄黄色の裳は斜めに流れて小さな足をのぞかせる。
      幾度か蹴って遊び終えると、あでやかな身は力も抜け、雲の鬢はほつれ、宝を飾る髻も傾いた。
    "translation_status": "reviewed"
  - "id": "xy-ch72-012"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏看得時辰久了，只得走上橋頭，應聲高叫道：「女菩薩，貧僧這裡隨緣佈施些兒齋吃。」那些女子聽見，一個個喜喜歡歡拋了針線，撇了氣毬，都笑笑吟吟的接出門來道：「長老，失迎了。今到荒莊，決不敢攔路齋僧，請裡面坐。」三藏聞言，心中暗道：「善哉，善哉！西方正是佛地，女流尚且注意齋僧，男子豈不虔心向佛？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      三蔵は長いこと見ていたが、ついに橋のたもとへ進み出て、声を張り上げた。三蔵「女菩薩さま、こちらの僧に、ご縁のお導きのまま、少し食事をお施しください。」
      女たちはそれを聞くと、みな嬉しそうに針仕事を放り、鞠を捨て、にこにこ笑いながら門を出て迎えた。女たち「長老さま、お迎えにも出ず失礼しました。せっかくこんな田舎の家へお越しくださったのですもの、道端で食事を差し上げて済ませるわけにはまいりません。どうぞ中へお座りください。」
      三蔵はそれを聞き、心でつぶやいた。三蔵「ありがたい、ありがたい。西方はまさしく仏の地だ。女たちでさえ僧に食事を施す心がけがある。男たちが心から仏を敬わないはずがあろうか。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-013"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老向前問訊了，相隨眾女入茅屋。過木香亭看處，呀！原來那裡邊沒甚房廊。只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 143
        "line_end": 143
    "translation_ja": "三蔵は進み出て挨拶の礼をし、女たちに連れられて茅葺きの家へ入った。木香のあずまやを過ぎて見ると、おや、内側には家屋も廊下もありはしない。ただ、"
    "translation_status": "reviewed"
  - "id": "xy-ch72-014"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": "巒頭高聳，地脈遙長。巒頭高聳接雲煙，地脈遙長通海岳。門近石橋，九曲九灣流水顧；園栽桃李，千株千顆斗穠華。藤薜掛懸三五樹，芝蘭香散萬千花。遠觀洞府欺蓬島，近睹山林壓太華。正是妖仙尋隱處，更無鄰舍獨成家。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      峰の頂は高くそびえ、地の脈は遥かに長い。
      高い峰の頂は雲や霞につながり、長い地の脈は海や山々へ通じている。
      門は石橋に近く、幾曲がりもする流れが巡る。
      園には桃や李が植えられ、千もの木々が豊かな花を競う。
      蔓や薜蘿（へいら）は幾本もの木から垂れ、霊芝や蘭は万の花に香りを散らす。
      遠く見れば洞府は蓬莱（ほうらい）の島にも勝り、近く見れば山林は太華（たいか）を圧する。
      まさしく妖仙が隠れ住む場所、隣家は一軒もなく、ただここだけが家をなす。
    "translation_status": "reviewed"
  - "id": "xy-ch72-015"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "有一女子上前，把石頭門推開兩扇，請唐僧裡面坐。那長老只得進去。忽擡頭看時，鋪設的都是石桌、石凳，冷氣陰陰。長老心驚，暗自思忖道：「這去處少吉多凶，斷然不善。」眾女子喜笑吟吟，都道：「長老請坐。」長老沒奈何，只得坐了。少時間，打個冷禁。眾女子問道：「長老是何寶山？化甚麼緣？還是修橋補路，建寺禮塔，還是造佛印經？請緣簿出來看看。」長老道：「我不是化緣的和尚。」女子道：「既不化緣，到此何幹？」長老道：「我是東土大唐差去西天大雷音求經者。適過寶方，腹間饑餒，特造檀府，募化一齋，貧僧就行也。」眾女子道：「好好好。常言道：『遠來的和尚好看經。』妹妹們。不可怠慢，快辦齋來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      女の一人が前へ出て、二枚の石の扉を押し開け、三蔵に中へ座るよう勧めた。三蔵は仕方なく中へ入った。ふと顔を上げて見ると、置いてあるのは石の卓、石の腰掛けばかりで、ひやりと陰気が漂っている。三蔵はぎくりとし、心の中で考えた。三蔵「ここはよいことより悪いことの多そうな場所だ。決して穏やかでは済むまい。」
      女たちはにこにこ笑って、口々に勧めた。女たち「長老さま、お座りください。」
      三蔵はどうしようもなく腰を下ろし、やがてぶるっと身震いした。
      女たち「長老さまは、どちらのお山から？　何のためのお布施集めですの。橋や道の修繕でしょうか、お寺を建て、塔を拝むためでしょうか、それとも仏像を造り、お経を刷るためでしょうか。勧進の帳面をお見せください。」
      三蔵「私は、お布施を集める僧ではありません。」
      女「お布施集めでないなら、何をしにこちらへ？」
      三蔵「東土（とうど）の大唐（だいとう）から西天（さいてん）の大雷音寺（だいらいおんじ）へ遣わされ、経を求めている者です。ちょうどこの地を通りかかって空腹を覚え、わざわざ施主のお宅に参りました。一食のお施しをいただけば、すぐ立ち去ります。」
      女たち「まあまあ、それは結構です。『遠くから来た坊さまほど、よくお経を読む』と申しますもの。妹たち、粗相のないよう、早く食事を用意しておくれ。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-016"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時有三個女子陪著，言來語去，論說些因緣。那四個到廚中撩衣斂袖，炊火刷鍋。你道他安排的是些甚麼東西？原來是人油炒煉，人肉煎熬：熬得黑糊充作麵觔樣子，剜的人腦煎作豆腐塊片。兩盤兒捧到石桌上放下，對長老道：「請了。倉卒間，不曾備得好齋，且將就吃些充腹。後面還有添換來也。」那長老聞了一聞，見那腥膻，不敢開口，欠身合掌道：「女菩薩，貧僧是胎裡素。」眾女子笑道：「長老，此是素的。」長老道：「阿彌陀佛！若像這等素的啊，我和尚吃了，莫想見得世尊，取得經卷。」眾女子道：「長老，你出家人，切莫揀人佈施。」長老道：「怎敢，怎敢。我和尚奉大唐旨意，一路西來，微生不損，見苦就救；遇穀粒手拈入口，逢絲縷聯綴遮身。怎敢揀主佈施？」眾女子笑道：「長老雖不揀人佈施，卻只有些上門怪人。莫嫌粗淡，吃些兒罷。」長老道：「實是不敢吃，恐破了戒。望菩薩養生不若放生，放我和尚出去罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      そこで三人の女が相手をして、言葉を交わし、あれこれ仏縁の話をした。残る四人は台所へ行き、裾をからげ、袖をまくり、火をたき、鍋を洗った。さて、何を料理したと思うか。人の脂を熱して、人肉を炒め煮にしていたのである。黒くどろどろに煮たものを麩に見立て、えぐり出した人の脳を焼いて、豆腐の切り身に見立てた。二皿を持ってきて石の卓へ置き、三蔵に言った。女たち「さあどうぞ。急のことで、よい精進料理をご用意できませんでしたが、ひとまずこれでお腹をお満たしください。あとから替わりの料理も出ますから。」
      三蔵は少し匂いを嗅ぎ、その生臭さに口をつける気になれず、腰を浮かせて合掌した。三蔵「女菩薩さま、私は母の胎内にいたときからの精進食なのです。」
      女たちは笑った。女たち「長老さま、これは精進料理ですわ。」
      三蔵「阿弥陀仏！　こんな精進料理を食べたのでは、世尊（せそん）にお目にかかって経巻をいただくことなど、望めません。」
      女たち「長老さま、出家なさった方が、施しを選り好みなさってはいけません。」
      三蔵「とんでもない、とんでもない。私は大唐の勅命を受け、一路西へ参りました。微かな命も損なわず、苦しむ者を見れば救い、穀物の一粒に出会えば手でつまんで口へ入れ、糸の一筋に出会えば継ぎ合わせて身を覆います。施主の施しをどうして選り好みできましょう。」
      女たちは笑った。女たち「長老さまは施しを選り好みなさらなくても、よその家へ来て文句をおっしゃるのね。粗末な物だと嫌がらず、少しお食べくださいな。」
      三蔵「本当に食べるわけにはいきません。戒めを破るのが恐ろしいのです。菩薩さま、命を養ってくださるより、命を放してくださるほうがありがたい。どうかこの僧を外へお出しください。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-017"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老掙著要走，那女子攔住門，怎麼肯放，俱道：「上門的買賣，倒不好做。『放了屁兒，卻使手掩。』你往那裡去？」他一個個都會些武藝，手腳又活，把長老扯住，順手牽羊，撲的摜倒在地。眾人按住，將繩子綑了，懸梁高吊。這吊有個名色，叫做「仙人指路」。原來是一隻手向前，牽絲吊起；一隻手攔腰綑住，將繩吊起；兩隻腳向後，一條繩吊起：三條繩把長老吊在梁上，卻是脊背朝上，肚皮朝下。那長老忍著疼，噙著淚，心中暗恨道：「我和尚這等命苦，只說是好人家化頓齋吃，豈知道落了火坑。徒弟啊，速來救我，還得見面；但遲兩個時辰，我命休矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      三蔵は身を振りほどいて立ち去ろうとしたが、女たちは門をふさぎ、放すはずもない。女たち「向こうから来た商売ほど、かえってやりにくいものね。『屁を放ってから、手で押さえる』とはこのことだ。どこへ行くつもり？」
      女たちは一人残らず武芸の心得があり、手足も素早い。三蔵をつかむと、手近な羊を引くようにたやすく、どさりと地面へ投げ倒した。みなで押さえつけ、縄で縛り、梁へ高く吊り上げた。この吊り方には「仙人指路（せんにんしろ）」という名がある。片手を前へ伸ばして糸縄で吊り、もう片方の手は腰にくくって縄で吊る。両足は後ろへ向けて一本の縄で吊る。三本の縄で三蔵を梁から吊り、背中を上、腹を下へ向けたのである。三蔵は痛みをこらえ、涙をため、心中でわが身を恨んだ。三蔵「なんと私は不運なのだろう。普通の家で一食の施しをもらうだけのつもりが、こんな地獄へ落ちようとは。弟子たちよ、早く助けに来ておくれ。そうすれば、まだ会える。二時辰（じしん）も遅れたら、私の命はもうない。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-018"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老雖然苦惱，卻還留心看著那些女子。那些女子把他吊得停當，便去脫剝衣服。長老心驚，暗自忖道：「這一脫了衣服，是要打我的情了。或者夾生兒吃我的情也有哩。」原來那女子們只解了上身羅衫，露出肚腹，各顯神通：一個個腰眼中冒出絲繩，有鴨蛋粗細，骨都都的，迸玉飛銀，時下把莊門瞞了不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      苦しみながらも、三蔵は女たちの様子に気を配っていた。女たちは吊り終えると、衣を脱ぎ始めた。三蔵は肝を冷やし、内心思った。三蔵「衣を脱いだからには、私を殴るつもりなのだろう。ひょっとすると、半煮えにして食べるつもりかもしれぬ。」
      ところが女たちは、上半身の薄絹の上着だけを解き、腹をあらわにして、それぞれ神通力を現した。一人一人の腰のくぼみから、鴨の卵ほども太い糸縄が、もくもくと湧き出る。玉が弾け、銀が飛び散るように、たちまち屋敷の門を覆い隠した。その話はしばらくおく。
    "translation_status": "reviewed"
  - "id": "xy-ch72-019"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那行者、八戒、沙僧都在大道之傍，他二人都放馬看擔，惟行者是個頑皮，他且跳樹攀枝，摘葉尋果。忽回頭，只見一片光亮，慌得跳下樹來，吆喝道：「不好，不好，師父造化低了。」行者用手指道：「你看那莊院如何？」八戒、沙僧共目視之，那一片如雪又亮如雪，似銀又光似銀。八戒道：「罷了，罷了，師父遇著妖精了，我們快去救他也。」行者道：「賢弟莫嚷。你都不見怎的，等老孫去來。」沙僧道：「哥哥仔細。」行者道：「我自有處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      さて悟空、八戒、沙悟浄は、みな大道のかたわらにいた。八戒と沙悟浄は馬を放して草を食わせ、荷を見張っていたが、悟空だけはいたずら好きで、木へ跳び上がって枝にぶら下がり、葉を摘み、実を探していた。ふと振り向くと、一面の輝きが目に入り、慌てて木から跳び下り、声を上げた。悟空「まずい、まずい。お師匠さまの運が落ちたぞ。」
      悟空は指さした。悟空「あの屋敷は、どうなっている？」
      八戒と沙悟浄がいっしょに目を向けると、一面が雪のようで雪のように明るく、銀のようで銀のように光っている。
      八戒「ああ、いけない。お師匠さまが妖怪に出くわしたんだ。早く助けに行こう。」
      悟空「弟たち、騒ぐな。何が何やら見えてもいないだろう。俺が行ってくる。」
      沙悟浄「兄さん、気をつけて。」
      悟空「俺には手立てがある。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-020"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，束一束虎皮裙，掣出金箍棒，拽開腳，兩三步跑到前邊，看見那絲繩纏了有千百層厚，穿穿道道，卻似經緯之勢。用手按了一按，有些粘軟沾人。行者更不知是甚麼東西。他即舉棒道：「這一棒，莫說是幾千層，就有幾萬層，也打斷了。」正欲打，又停住手道：「若是硬的便可打斷，這個軟的，只好打匾罷了。假如驚了他，纏住老孫，反為不美。等我且問他一問再打。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      見よ、悟空は虎皮の腰巻きをきゅっと締め、金箍棒（きんこぼう）を抜き、大股で二、三歩走って前へ出た。見ると、糸縄が千重、百重に厚く絡み合い、縦糸と横糸のように幾筋も交差している。手で押すと、少し粘りと柔らかさがあり、手にまとわりついた。悟空にも、いったい何なのか分からない。棒を振り上げて言った。悟空「この一打なら、数千重どころか数万重でも、打ち切ってやる。」
      打とうとしかけたが、また手を止めた。悟空「硬いものなら打ち切れるが、こんな柔らかいものは押し潰せるだけだ。やつらを驚かせて、この俺まで絡め取られたら、まずいことになる。まず尋ねてから打つとしよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-021"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你道他問誰？即捻一個訣，念一個咒，拘得個土地老兒在廟裡似推磨的一般亂轉。土地婆兒道：「老兒，你轉怎的？好道是羊兒風發了。」土地道：「你不知，你不知。有一個齊天大聖來了，我不曾接他，他那裡拘我哩。」婆兒道：「你去見他便了，卻如何在這裡打轉？」土地道：「若去見他，他那棍子好不重，他管你好歹就打哩。」婆兒道：「他見你這等老了，那裡就打你？」土地道：「他一生好吃沒錢酒，偏打老年人。」兩口兒講一會，沒奈何，只得走出去，戰兢兢的跪在路傍，叫道：「大聖，當境土地叩頭。」行者道：「你且起來，不要假忙。我且不打你，寄下在那裡。我問你，此間是甚地方？」土地道：「大聖從那廂來？」行者道：「我自東土往西來的。」土地道：「大聖東來，可曾在那山嶺上？」行者道：「正在那山嶺上。我們行李、馬匹還歇在那嶺上不是！」土地道：「那叫做盤絲嶺。嶺下有洞，叫做盤絲洞。洞裡有七個妖精。」行者道：「是男怪，是女怪？」土地道：「是女怪。」行者道：「他有多大神通？」土地道：「小神力薄威短，不知他有多大手段。只知那正南上，離此有三里之遙，有一座濯垢泉，乃天生的熱水，原是上方七仙姑的浴池。自妖精到此居住，占了他的濯垢泉，仙姑更不曾與他爭競，平白地就讓與他了。我見天仙不惹妖魔怪，必定精靈有大能。」行者道：「占了此泉何幹？」土地道：「這怪占了浴池，一日三遭，出來洗澡。如今巳時已過，午時將來呀。」行者聽言道：「土地，你且回去，等我自家拿他罷。」那土地老兒磕了一個頭，戰兢兢的回本廟去了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      さて、誰に尋ねるのか。悟空が指を組んで印を結び、呪文を唱えると、呼び出される土地神（とちがみ）の老人は、廟の中で石臼でも回すように、くるくる回りだした。
      土地神の妻「お前さん、どうして回っているんだい。てんかんの発作でも起こったのかね。」
      土地神「お前は知らんのだ、知らんのだ。斉天大聖（せいてんたいせい）が来なさったのに、わしが迎えに出なかったので、あちらで呼びつけておるのだ。」
      土地神の妻「会いに行けばいいじゃないか。どうしてここでぐるぐる回っているんだい。」
      土地神「会いに行ったら、あのお方の棒はひどく重い。よいも悪いもお構いなしに、殴りなさるのだ。」
      土地神の妻「お前さんがそんな年寄りなのを見て、いきなり殴ったりするものかね。」
      土地神「昔からただ酒を飲むのが好きで、年寄りばかり殴りなさるのだ。」
      夫婦はしばらく話していたが、どうにもならず、土地神は外へ出て、震えながら道端にひざまずいた。土地神「大聖（たいせい）さま、この地の土地神が、頭を下げてご挨拶いたします。」
      悟空「まず起きろ。慌てたふりをするな。今は殴らずにおく。殴る分は預けておこう。聞くが、ここは何という所だ？」
      土地神「大聖さまは、どちらからお越しですか。」
      悟空「東土から西へ来たのだ。」
      土地神「東からお越しなら、あの峠にはおいでになりましたか。」
      悟空「まさにあの峠にいたのさ。荷物も馬も、まだあの峠で休ませてあるじゃないか。」
      土地神「あれは盤糸嶺（ばんしれい）と申します。嶺の下に洞があり、盤糸洞（ばんしどう）と申します。洞には七人の妖怪がおります。」
      悟空「男の妖怪か、女の妖怪か？」
      土地神「女の妖怪でございます。」
      悟空「神通力はどれほどだ？」
      土地神「私などは力も威も乏しく、どれほどの術を持つのか存じません。ただ、真南の、ここから三里ほど先に、濯垢泉（たっこうせん）という天然の温泉があるのは存じております。もとは天上の七仙姑（しちせんこ）の浴場でしたが、妖怪がここに住みつくと、その濯垢泉を占領しました。仙姑たちは争うこともなく、ただそのまま譲ってしまったのです。天女が妖魔に手を出さないところを見ると、よほどの力があるに違いないと、私は思います。」
      悟空「その泉を占領して何をする？」
      土地神「妖怪たちは浴場を占領して、一日に三度、風呂に入りに出てくるのです。今はもう巳の刻を過ぎ、午の刻が近づいております。」
      悟空はそれを聞いて言った。悟空「土地神、お前は帰っていろ。俺が自分で捕まえる。」
      土地神の老人は一つ額を地につけ、震えながら自分の廟へ帰っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch72-022"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖獨顯神通，搖身一變，變作個麻蒼蠅兒，釘在路傍草梢上等待。須臾間，只聽得呼呼吸吸之聲，猶如蠶食葉，卻似海生潮。只好有半盞茶時，絲繩皆盡，依然現出莊村，還像當初模樣。又聽得呀的一聲，柴扉響處，裡邊笑語諠譁，走出七個女子。行者在暗中細看，見他一個個攜手相攙，挨肩執袂，有說有笑的走過橋來，果是標致。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 155
        "line_end": 155
    "translation_ja": "悟空は独り神通力を現し、身を振るって一匹のまだらのハエに変わると、道端の草の先に止まって待った。ほどなく、しゅうしゅうと吸い込むような音が聞こえた。蚕が葉を食うようでもあり、海に潮が満ちるようでもある。茶碗半分の茶を飲むほどの間に糸縄はすっかり消え、屋敷が再び姿を現して、もとのとおりになった。さらにぎいっと柴の戸が鳴り、内側からにぎやかな笑い声と話し声がして、七人の女が出てきた。悟空がそっと詳しく見ると、互いに手を取り、肩を寄せ、袖をつかみ、笑い話をしながら橋を渡ってくる。なるほど、見事な器量である。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-023"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      比玉香尤勝，如花語更真。
      柳眉橫遠岫，檀口破櫻唇。
      釵頭翹翡翠，金蓮閃絳裙。
      卻似嫦娥臨下界，仙子落凡塵。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 157
        "line_end": 160
    "translation_ja": |-
      玉に比べれば香りで勝り、花に似ていても、その言葉はまことのもの。
      柳の眉は遠い峰を横たえ、紅い口は桜色の唇を開く。
      かんざしの先には翡翠が反り、小さな足が紅の裳の下でちらつく。
      まるで嫦娥（じょうが）が下界に臨み、仙女が人の世へ降りてきたようだ。
    "translation_status": "reviewed"
  - "id": "xy-ch72-024"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者笑道：「怪不得我師父要來化齋，原來是這一般好物。這七個美人兒，假若留住我師父，要吃也不夠一頓吃，要用也不夠兩日用；要動手輪流，一擺佈就是死了。且等我去聽他一聽，看他怎的算計。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 162
        "line_end": 162
    "translation_ja": "悟空は笑った。悟空「お師匠さまが食事をもらいに来たがるのも道理だ。こんないい女がいたとはな。この七人の美人がお師匠さまを引き止めたところで、食うには一食分にも足りず、男として使うにも二日ともつまい。順番に手を出したら、ひと回りなぶられただけで死んでしまうぞ。まず何を企んでいるのか、聞きに行こう。」"
    "translation_status": "reviewed"
  - "id": "xy-ch72-025"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，嚶的一聲，飛在那前面走的女子雲髻上釘住。才過橋來，後邊的走向前來呼道：「姐姐，我們洗了澡，來蒸那胖和尚吃去。」行者暗笑道：「這怪物好沒算計，煮還省些柴，怎麼轉要蒸了吃？」那些女子採花鬥草向南來，不多時到了浴池。但見一座門牆，十分壯麗，遍地野花香豔豔，滿傍蘭蕙密森森。後面一個女子走上前，唿哨的一聲，把兩扇門兒推開，那中間果有一塘熱水。這水："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      悟空はぶうんと飛び、先頭を歩く女の雲のような髻に止まった。ちょうど橋を渡り終えると、後ろの女が前へ進んで呼びかけた。後ろの女「姉さん、風呂に入ったら、あの太った和尚を蒸して食べに戻りましょうよ。」
      悟空は内心笑った。悟空「この妖怪どもは勘定を知らないな。煮れば薪も少なくて済むのに、どうしてわざわざ蒸して食うんだ。」
      女たちは花を摘み、草を取り合わせて競い遊びながら南へ進み、ほどなく浴場へ着いた。門と塀はまことに壮麗で、あたり一面、野の花が鮮やかに香り、まわりには蘭や香草がびっしり茂っている。後ろの女が一人前へ出て、ぴゅっと口笛を吹き、二枚の扉を押し開けた。中には、なるほど熱い湯をたたえた池があった。この湯のいわれは、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch72-026"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "自開闢以來，太陽星原貞有十，後被羿善開弓，射落九烏墜地，止存金烏一星，乃太陽之真火也。天地有九處湯泉，俱是眾烏所化。那九陽泉，乃香冷泉、伴山泉、溫泉、東合泉、潢山泉、孝安泉、廣汾泉、湯泉──此泉乃濯垢泉。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 165
        "line_end": 165
    "translation_ja": "天地が開けたころ、太陽の星はもと十あった。のちに弓の名手、羿（げい）が九羽の烏を射落として地へ落とし、金烏（きんう）の星一つだけを残した。これこそが太陽のまことの火である。天地の間には九か所の温泉があり、いずれもその烏たちが姿を変えたものだ。その九陽泉（きゅうようせん）とは、香冷泉（こうれいせん）、伴山泉（ばんざんせん）、温泉（おんせん）、東合泉（とうごうせん）、潢山泉（こうざんせん）、孝安泉（こうあんせん）、広汾泉（こうふんせん）、湯泉（とうせん）、そしてこの濯垢泉である。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-027"

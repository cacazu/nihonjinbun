    "translation_status": "reviewed"
  - "id": "xy-ch72-002"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表三藏別了朱紫國王，整頓鞍馬西進。行夠多少山原，歷盡無窮水道，不覺的秋去冬殘，又值春光明媚。師徒們正在路踏青玩景，忽見一座庵林。三藏滾鞍下馬，站立大道之傍。行者問道：「師父，這條路平坦無邪，因何不走？」八戒道：「師兄好不通情。師父在馬上坐得困了，也讓他下來關關風是。」三藏道：「不是關風，我看那裡是個人家，意欲自去化些齋吃。」行者笑道：「你看師父說的是那裡話，你要吃齋，我自去化。俗語云：『一日為師，終身為父。』豈有為弟子者高坐，教師父去化齋之理？」三藏道：「不是這等說。平日間一望無邊無際，你們沒遠沒近的去化齋。今日人家逼近，可以叫應，也讓我去化一個來。」八戒道：「師父沒主張。常言道：『三人出外，小的兒苦。』你況是個父輩，我等俱是弟子。古書云：『有事弟子服其勞。』等我老豬去。」三藏道：「徒弟啊，今日天氣晴明，與那風雨之時不同。那時節，汝等必定遠去。此個人家，等我去，有齋無齋，可以就回走路。」沙僧在傍笑道：「師兄，不必多講，師父的心性如此，不必違拗。若惱了他，就化將齋來，他也不吃。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて三蔵（さんぞう）は朱紫国（しゅしこく）の王に別れを告げ、馬具を整えて西へ進んだ。幾つもの山や原を越え、数限りない水辺をたどるうち、いつしか秋が過ぎ、冬も終わって、また春の光が明るく照らすころになった。師弟が道すがら若草を踏み、景色を楽しんでいると、ふと庵を囲むような林が見えた。三蔵は鞍から滑り下り、大道のかたわらに立った。
      悟空（ごくう）「お師匠さま、この道は平らで危ないところもないのに、どうしてお進みにならないのです？」
      八戒（はっかい）「兄貴も気が利かないな。お師匠さまは馬に乗っていてくたびれたんだ。下りて少し景色を見てもらえばいいだろう。」
      三蔵「景色を見るのではない。あそこに人家が見えるので、自分で少し食事の施しをもらってこようと思うのだ。」
      悟空は笑った。悟空「お師匠さま、何をおっしゃいます。お食事なら私がもらってきます。『一日でも師とした人は、生涯の父』というではありませんか。弟子がどっかり座り込み、師匠に托鉢へ行かせる道理がありますか。」
      三蔵「そういうことではない。いつもは見渡す限り果てもなく、お前たちが遠いとも近いとも分からぬところまで食事をもらいに行ってくれる。今日は人家がすぐ近く、呼べば返事が届くほどだ。私にも一度、もらいに行かせておくれ。」
      八戒「お師匠さまも分別がないな。『三人で旅に出れば、年下が骨を折る』と言うでしょう。それにあなたは父親の立場で、俺たちはみな弟子です。昔の書物にも『用事があれば弟子が働く』とあります。俺に行かせてください。」
      三蔵「弟子たちよ、今日は天気も晴れやかで、風雨のときとは違う。そのようなときは、お前たちがきっと遠くまで行かねばなるまい。この人家には私を行かせておくれ。食事があってもなくても、すぐ戻って旅を続けられる。」
      沙悟浄（さごじょう）はそばで笑った。沙悟浄「兄さん、もう言うことはない。お師匠さまはそういうお気性だ。逆らわなくていい。お怒りになれば、食事をもらってきたって召し上がらないよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-003"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒依言，即取出缽盂，與他換了衣帽。拽開步，直至那莊前觀看，卻也好座住場。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 120
        "line_end": 120
    "translation_ja": "八戒はその言葉に従い、すぐ鉢を取り出して渡し、三蔵の衣と帽子を替えてやった。三蔵は大股で歩き、その屋敷の前まで来て眺めた。なるほど、よい住まいである。見れば、"
    "translation_status": "reviewed"
  - "id": "xy-ch72-004"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": "石橋高聳，古樹森齊。石橋高聳，潺潺流水接長溪；古樹森齊，聒聒幽禽鳴遠岱。橋那邊有數椽茅屋，清清雅雅若仙庵；又有那一座蓬窗，白白明明欺道院。窗前忽見四佳人，都在那裡刺鳳描鸞做針線。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      石橋は高くそびえ、古木はこんもり並ぶ。
      石橋は高くそびえ、さらさら流れる水は長い渓流へ続く。
      古木はこんもり並び、奥深い鳥の声が遠い峰まで響きわたる。
      橋の向こうには茅葺きの家が幾棟か、清らかにみやびで仙人の庵のよう。
      また蓬を張った窓が一つ、白々と明るく道院にも勝っている。
      窓の前にはふと四人の美女が見え、みな鳳凰の模様を刺繡して、針仕事をしていた。
    "translation_status": "reviewed"
  - "id": "xy-ch72-005"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老見那人家沒個男兒，只有四個女子，不敢進去，將身立定，閃在喬林之下。只見那女子一個個："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 123
        "line_end": 123
    "translation_ja": "三蔵は、その家に男が一人もおらず、女が四人だけなのを見て、入るのをためらった。立ち止まって、高い木の下へ身を寄せた。見ると、その女たちは一人一人、"
    "translation_status": "reviewed"
  - "id": "xy-ch72-006"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      閨心堅似石，蘭性喜如春。
      嬌臉紅霞襯，朱唇絳脂勻。
      蛾眉橫月小，蟬鬢疊雲新。
      若到花間立，遊蜂錯認真。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 125
        "line_end": 128
    "translation_ja": |-
      奥ゆかしい心は石のように堅く、蘭のような気立ては春のように喜ばしい。
      愛らしい顔には紅の霞が映り、朱の唇には濃い紅がむらなくのる。
      細い眉は小さな月を横たえ、薄い鬢は新たな雲を重ねたよう。
      花の間に立とうものなら、飛び交う蜂が本物の花と思い違えるだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch72-007"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少停有半個時辰，一發靜悄悄，雞犬無聲。自家思慮道：「我若沒本事化頓齋飯，也惹那徒弟笑我：敢道為師的化不出齋來，為徒的怎能去拜佛？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 130
        "line_end": 130
    "translation_ja": "しばらく、半時辰（はんじしん）ほど待ってみても、いっそう静まり返るばかりで、鶏も犬も声を立てない。三蔵は心の中で考えた。三蔵「一食の施しももらえないようでは、弟子たちに笑われてしまう。師匠が食事の施しをもらえないのに、弟子がどうして仏さまを拝みに行けるのか、と言われかねない。」"
    "translation_status": "reviewed"
  - "id": "xy-ch72-008"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老沒計奈何，也帶了幾分不是，趨步上橋。又走了幾步，只見那茅屋裡面有一座木香亭子，亭子下又有三個女子在那裡踢氣毬哩。你看那三個女子，比那四個又生得不同。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 132
        "line_end": 132
    "translation_ja": "三蔵はどうすることもできず、いくらか後ろめたさを覚えながら、急ぎ足で橋へ上がった。さらに数歩進むと、茅葺きの家の内側に木香（もっこう）の花を這わせたあずまやがあり、その下でもう三人の女が、空気を入れた鞠を蹴っていた。見れば、この三人は、先ほどの四人とはまた違う美しさである。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-009"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": "飄揚翠袖，搖拽緗裙。飄揚翠袖，低籠著玉筍纖纖；搖拽緗裙，半露出金蓮窄窄。形容體勢十分全，動靜腳跟千樣屣。拿頭過論有高低，張泛送來真又楷。轉身踢個出牆花，退步翻成大過海。輕接一團泥，單槍急對拐。明珠上佛頭，實捏來尖靴。窄磚偏會拿，臥魚將腳抷。平腰折膝蹲，扭頂翹跟屣。扳凳能喧泛，披肩甚脫灑。絞襠任往來，鎖項隨搖擺。踢的是黃河水倒流，金魚灘上買。那個錯認是頭兒，這個轉身就打拐。端然捧上臁，周正尖來捽。提跟潠草鞋，倒插回頭採。退步泛肩妝，鉤兒只一歹。販簍下來長，便把奪門揣。踢到美心時，佳人齊喝采。一個個汗流粉膩透羅裳，興懶情疏方叫海。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      緑の袖をひるがえし、薄黄色の裳を揺らす。
      ひるがえる緑の袖は低く垂れ、玉の筍のような細い指を覆う。
      揺れる薄黄色の裳からは、金蓮（きんれん）と呼ぶ小さな足が半ばのぞく。
      姿も身のこなしも申し分なく、動いても止まっても、足さばきは千変万化。
      「拿頭（だとう）」「過論（かろん）」には高低があり、「張泛（ちょうはん）」で送る鞠は、まことに正確。
      くるりと身を返して「塀越しの花」を蹴り、後ずさりして「大海越え」を翻す。
      「泥の塊」を軽く受け、「一本槍」で素早く「拐（かい）」に応じる。
      「明珠が仏の頭へ上る」、しっかり押さえて、尖った靴先へ来る。
      「狭い煉瓦」を受けるのも巧み、「横たわる魚」では足を差し出す。
      腰を平らに、膝を折ってうずくまり、頭をひねって、踵を上げて踏み替える。
      「腰掛けを引く」では高々と送れ、「肩掛け」はいとも軽やか。
      股を交差させて自在に行き来し、首を押さえる型では揺れに任せる。
      蹴る技は「黄河の水の逆流」、そして「金魚を瀬で買う」。
      あちらが頭で受けるかと見れば、こちらは身を返して足の側で打つ。
      すっと脛へ捧げ上げ、まっすぐ靴先を差し出して払う。
      踵を上げて「草鞋に水を吹く」、逆向きに差し込み、振り返って取る。
      後ずさりして肩へ送る構え、鉤足はひとたびさっと掛ける。
      「売り籠」が長く下りてくると、すぐさま「門を奪う」で蹴り出す。
      蹴りぶりが心地よく決まれば、美女たちはそろって喝采する。
      一人一人、汗と白粉の脂が薄絹の衣にまで染み通り、遊び疲れて気分も薄れて、ようやく終わりの声を上げた。
    "translation_status": "reviewed"
  - "id": "xy-ch72-010"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "言不盡，又有詩為證。詩曰："
    "source_languages":

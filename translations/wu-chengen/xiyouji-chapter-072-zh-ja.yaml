    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 179
        "line_end": 179
    "translation_ja": "女たちは湯が澄んで温かいのを見ると、すぐ風呂に入ろうと、いっせいに衣を脱ぎ、衣桁に掛け、みな池へ下りていった。悟空の目に映ったのは、"
    "translation_status": "reviewed"
  - "id": "xy-ch72-031"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      褪放紐扣兒，解開羅帶結。
      酥胸白似銀，玉體渾如雪。
      肘膊賽冰鋪，香肩疑粉捏。
      肚皮軟又綿，脊背光還潔。
      膝腕半圍團，金蓮三寸窄。
      中間一段情，露出風流穴。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 180
        "line_end": 185
    "translation_ja": |-
      留め紐を外し、薄絹の帯の結び目を解く姿。
      ふくよかな乳房は銀のように白く、玉の体はまるごと雪のよう。
      肘や腕は敷き詰めた氷に勝り、香る肩は白粉でこねたかと思うほど。
      腹は柔らかく綿のよう、背中はつややかで汚れがない。
      膝のあたりは半円を描き、小さな足はわずか三寸。
      その間の色めいたところには、情欲を誘う女陰があらわになった。
    "translation_status": "reviewed"
  - "id": "xy-ch72-032"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那女子都跳下水去，一個個躍浪翻波，負水頑耍。行者道：「我若打他啊，只消把這棍子往池中一攪，就叫做滾湯潑老鼠──一窩兒都是死。可憐，可憐！打便打死他，只是低了老孫的名頭。常言道：『男不與女鬥。』我這般一個漢子，打殺這幾個丫頭，著實不濟。不要打他，只送他一個絕後計，教他動不得身，多少是好？」好大聖，捏著訣，念個咒，搖身一變，變作一個餓老鷹。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 187
        "line_end": 187
    "translation_ja": |-
      女たちはみな湯へ跳び込み、波を立て、水をかきながら遊んだ。
      悟空「こいつらを打つなら、この棒で池の中をひとかきすればいい。まさしく『鼠に熱湯を浴びせる』で、一巣残らずお陀仏だ。かわいそうに、かわいそうに。打てば殺せるが、それではこの俺の名が下がる。『男は女と争わぬ』と言うからな。俺ほどの男が、こんな女どもを殴り殺すのも、実に情けない。打つのはやめて、身動きのできなくなる決定的な手を食わせてやろう。そのほうが少しはよかろう。」
      悟空は印を結び、呪文を唱え、身を振るって一羽の飢えた鷹に変わった。そのさまは、
    "translation_status": "reviewed"
  - "id": "xy-ch72-033"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": "毛猶霜雪，眼若明星。妖狐見處魂皆喪，狡兔逢時膽盡驚。鋼爪鋒芒快，雄姿猛氣橫。會使老拳供口腹，不辭親手逐飛騰。萬里寒空隨上下，穿雲撿物任他行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 189
        "line_end": 189
    "translation_ja": |-
      羽は霜雪のよう、目は明るい星のよう。
      妖狐は見れば魂を失い、すばしこい兎も出くわせば肝をつぶす。
      鋼の爪は鋭くとがり、雄々しい姿に猛々しい気がみなぎる。
      こぶしのような足を使って腹を満たし、自ら飛ぶ獲物を追う労も惜しまない。
      万里の冷たい空を自在に上り下りし、雲をくぐって獲物を取るのも思いのまま。
    "translation_status": "reviewed"
  - "id": "xy-ch72-034"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "呼的一翅，飛向前，掄開利爪，把他那衣架上搭的七套衣服，盡情叼去，徑轉嶺頭，現出本相，來見八戒、沙僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 191
        "line_end": 191
    "translation_ja": "ごうっとひと羽ばたきして前へ飛び、鋭い爪を開くと、衣桁に掛けられた七人分の衣を、残らずひっさらった。そのまま峠へ戻り、本来の姿に返って、八戒と沙悟浄に会った。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-035"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看那獃子迎著笑道：「師父原來是典當鋪裡拿了去的。」沙僧道：「怎見得？」八戒道：「你不見師兄把他些衣服都搶將來也？」行者放下道：「此乃妖精穿的衣服。」八戒道：「怎麼就有這許多？」行者道：「七套。」八戒道：「如何剝得這般容易，又剝得乾淨？」行者道：「那曾用剝。原來此處喚做盤絲嶺，那莊村喚做盤絲洞。洞中有七個女怪，把我師父拿住，吊在洞裡，都向濯垢泉去洗浴。那泉卻是天地產成的，一塘子熱水。他都算計著洗了澡，要把師父蒸吃。是我跟到那裡，見他脫了衣服下水，我要打他，恐怕污了棍子，又怕低了名頭，是以不曾動棍，只變做一個餓老鷹，叼了他的衣服。他都忍辱含羞，不敢出頭，蹲在水中哩。我等快去解下師父走路罷。」八戒笑道：「師兄，你凡幹事，只要留根。既見妖精，如何不打殺他，卻就去解師父？他如今縱然藏羞不出，到晚間必定出來。他家裡還有舊衣服，穿上一套，來趕我們。縱然不趕，他久住在此，我們取了經，還從那條路回去。常言道：『寧少路邊錢，莫少路邊拳。』那時節，他攔住了吵鬧，卻不是個仇人也？」行者道：「憑你如何主張？」八戒道：「依我，先打殺了妖精，再去解放師父：此乃斬草除根之計。」行者道：「我是不打他，你要打，你去打他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 192
        "line_end": 192
    "translation_ja": |-
      八戒は笑いながら迎えた。八戒「お師匠さまは、質屋に連れていかれたのか。」
      沙悟浄「どうしてそう思う？」
      八戒「兄貴があんなに衣を奪ってきたじゃないか。」
      悟空は衣を下ろした。悟空「これは妖怪が着ていた衣だ。」
      八戒「どうしてそんなにたくさんある？」
      悟空「七着だ。」
      八戒「どうしてそんなに簡単に、すっかり脱がせられたんだ？」
      悟空「脱がせたわけじゃない。ここは盤糸嶺、あの屋敷は盤糸洞というんだ。洞には女の妖怪が七人いて、お師匠さまをつかまえ、洞の中に吊るし、みんな濯垢泉へ風呂に入りに行った。泉は天地が造ったもので、池いっぱいの湯だ。やつらは風呂のあとで、お師匠さまを蒸して食うつもりでいる。俺はついていって、やつらが衣を脱ぎ、湯に入るのを見た。打とうとも思ったが、棒が汚れるのも嫌だし、名を落とすのも嫌なので、棒は振るわなかった。ただ飢えた鷹に変わって、衣をさらってきたんだ。やつらは恥を忍び、顔も出せずに湯の中でうずくまっている。早くお師匠さまの縄を解き、旅を続けよう。」
      八戒は笑った。八戒「兄貴は、何をするにも禍根を残したがる。妖怪を見つけたのに、どうして殺さずに、お師匠さまを助けに行くんだ？　今は恥ずかしくて出てこなくても、晩には必ず出てくる。家には古着もあるから、それを一着着て追いかけてくるぞ。たとえ追ってこなくても、やつらはずっとここに住む。俺たちがお経を取ったら、またこの道を戻るじゃないか。『旅の金は足りなくても、敵に食わせる拳は不足させるな』というだろう。そのときに道をふさいで騒ぎだしたら、立派な敵を残したことになるじゃないか。」
      悟空「では、どうしろと言うんだ？」
      八戒「俺に言わせりゃ、まず妖怪を殺し、それからお師匠さまを助け出す。これこそ草を刈り、根まで抜くやり方だ。」
      悟空「俺は打たない。打ちたければ、お前が行って打て。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-036"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒抖擻精神，歡天喜地，舉著釘鈀，拽開步，徑直跑到那裡。忽的推開門看時，只見那七個女子蹲在水裡，口中亂罵那鷹哩，道：「這個匾毛畜生，貓嚼頭的亡人，把我們衣服都叼去了，教我們怎的動手？」八戒忍不住笑道：「女菩薩，在這裡洗澡哩？也攜帶我和尚洗洗，何如？」那怪見了，作怒道：「你這和尚，十分無禮。我們是在家的女流，你是個出家的男子。古書云：『七年男女不同席。』你好和我們同塘洗澡？」八戒道：「天氣炎熱，沒奈何，將就容我洗洗兒罷，那裡調甚麼書擔兒，同席不同席？」獃子不容說，丟了釘鈀，脫了皂錦直裰，撲的跳下水來。那怪心中煩惱，一齊上前要打。不知八戒水勢極熟，到水裡搖身一變，變做一個鮎魚精。那怪就都摸魚，趕上拿他不住：東邊摸，忽的又漬了西去；西邊摸，忽的又漬了東去。滑扢虀的，只在那腿襠裡亂鑽。原來那水有攙胸之深，水上盤了一會，又盤在水底，都盤倒了，喘噓噓的，精神倦怠。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 193
        "line_end": 193
    "translation_ja": |-
      八戒は張り切り、嬉しくてたまらない様子で熊手を上げ、大股でそこへ駆けつけた。さっと扉を押し開けると、七人の女が湯の中にうずくまり、あの鷹をさんざん罵っていた。女たち「この羽毛の畜生め。猫に頭をかじられて死んじまえ。私たちの衣をみんなさらっていって、どうしろと言うんだい。」
      八戒はこらえきれず笑った。八戒「女菩薩さま方、ここでお風呂ですか。俺も仲間に入れて、洗わせてくれないか？」
      女の妖怪たちは八戒を見ると、怒りだした。女の妖怪たち「何て無礼な和尚だね。私たちは在家の女、お前は出家の男だろう。昔の書物にも『七歳になれば男女は席を同じくしない』とある。私たちと同じ池で風呂に入れるものかい。」
      八戒「暑くてかなわないんだ。ひとつ大目に見て、洗わせてくれよ。何を本の知識を担ぎ出して、席が同じだの違うだのと言ってるんだ。」
      八戒は相手にものも言わせず、熊手を投げ出し、黒い錦の直裰（ちょくたつ）を脱ぐと、どぼんと湯へ跳び込んだ。妖怪たちは腹を立て、いっせいに進み出て殴ろうとした。ところが八戒は水中の扱いにひどく慣れていて、湯の中で身を振るうと、ナマズの妖怪に変わった。女たちはみな魚をつかまえようとしたが、追っても捕らえられない。東で手を伸ばすと、さっと西へ潜り抜け、西で手を伸ばすと、さっと東へ潜り抜ける。ぬるぬる滑りながら、ひたすら女たちの股の間をくぐり回る。湯は胸までの深さで、しばらく水面でまとわりついたのち、また底へ潜って絡みつき、女たちをみな転ばせた。女たちは息を切らし、すっかり疲れ果ててしまった。
    "translation_status": "reviewed"
  - "id": "xy-ch72-037"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒卻才跳將上來，現了本相，穿了直裰，執著釘鈀，喝道：「我是那個？你把我當鮎魚精哩。」那怪見了，心驚膽戰，對八戒道：「你先來是個和尚，到水裡變作鮎魚，及拿你不住，卻又這般打扮，你端的是從何到此？是必留名。」八戒道：「這夥潑怪當真的不認得我。我是東土大唐取經的唐長老之徒弟，乃天蓬元帥悟能八戒是也。你把我師父吊在洞裡，算計要蒸他受用。我的師父，又好蒸吃？快早伸過頭來，各築一鈀，教你斷根。」那些妖聞此言，魂飛魄散，就在水中跪拜道：「望老爺方便方便！我等有眼無珠，誤捉了你師父，雖然吊在那裡，不曾敢加刑受苦。望慈悲饒了我的性命，情願貼些盤費，送你師父往西天去也。」八戒搖手道：「莫說這話。俗語說得好：『曾著賣糖君子哄，到今不信口甜人。』是便築一鈀，各人走路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 194
        "line_end": 194
    "translation_ja": |-
      そこでようやく八戒は湯から跳び上がり、本来の姿に戻り、直裰を着て熊手を握り、怒鳴った。八戒「俺が誰だか分かるか。ナマズの妖怪だと思っていたのか？」
      女の妖怪たちはそれを見ると、肝を冷やして震え、八戒に言った。女の妖怪たち「初めは和尚だったのに、水へ入ればナマズに変わり、捕まえられないと思ったら、またその姿。いったい、どこからここへ来たんだい？　どうか名前を聞かせておくれ。」
      八戒「このろくでもない妖怪どもは、本当に俺を知らんのだな。俺は東土の大唐から経を求める唐長老（とうちょうろう）の弟子、天蓬元帥（てんぽうげんすい）、悟能八戒（ごのうはっかい）だ。お前たちは俺のお師匠さまを洞に吊るし、蒸して食ってやろうと企んだな。俺のお師匠さまが、そう簡単に蒸して食えるものか。さっさと頭を突き出せ。一人ひと熊手ずつ食わせ、根絶やしにしてやる。」
      妖怪たちはこれを聞くと魂も飛ぶほど驚き、湯の中でひざまずいて拝んだ。女の妖怪たち「どうか旦那さま、お見逃しを、お見逃しを！　私たちに見る目がなく、お師匠さまを誤って捕らえてしまいました。あそこに吊るしてはありますが、責め苦を加えたことはございません。どうか慈悲をおかけになり、命をお助けください。喜んで旅費をいくらか添え、お師匠さまを西天へお送りいたします。」
      八戒は手を振った。八戒「そんなことを言うな。『飴売りの紳士に騙されてから、今も甘い口の者は信じない』とは、よく言ったものだ。とにかくひと熊手食らえば、それぞれ自分の道を行ける。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-038"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "獃子一味粗夯，顯手段，那有憐香惜玉之心，舉著鈀，不分好歹，趕上前亂築。那怪慌了手腳，那裡顧甚麼羞恥，只是性命要緊，隨用手侮著羞處，跳出水來，都跑在亭子裡站立，作出法來：臍孔中骨都都冒出絲繩，瞞天搭了個大絲篷，把八戒罩在當中。那獃子忽擡頭，不見天日，即抽身往外便走，那裡舉得腳步。原來放了絆腳索，滿地都是絲繩，動動腳，跌個躘踵；左邊去，一個面磕地；右邊去，一個倒栽蔥；急轉身，又跌了個嘴搵地；忙爬起，又跌了個豎蜻蜓。也不知跌了多少跟頭，把個獃子跌得身麻腳軟，頭暈眼花，爬也爬不動，只睡在地下呻吟。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 195
        "line_end": 195
    "translation_ja": "八戒はひたすら荒々しく、腕を振るうばかりで、美女を惜しむ気などない。熊手を振り上げ、よいも悪いもお構いなしに、追いかけてめった打ちに突きかかった。妖怪たちは慌てふためき、もう恥も外聞もない。命こそ大事と、手で陰部を隠しながら湯から跳び出し、みなあずまやへ駆け込んで立ち、術を使った。臍の穴から糸縄がもくもく湧き出して、空を覆う大きな糸の天幕となり、その中へ八戒を包み込んだ。八戒がふと見上げると、空も日も見えない。さっと身を返して外へ出ようとしたが、一歩も足を運べない。足を引っかける縄が張り巡らされ、地面じゅう糸縄だらけだったのである。少し足を動かせばもんどり打ち、左へ行けば顔を地面にぶつけ、右へ行けば頭から逆さに突っ込む。慌てて振り向けば口から地面へ倒れ、急いで起き上がれば、また頭を下に脚を突き立てる。何度転んだか分からず、とうとう体はしびれ、脚は萎え、頭はくらくら、目はちかちか。這うことさえできず、地べたに寝てうめくばかりとなった。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-039"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪物卻將他困住，也不打他，也不傷他，一個個跳出門來，將絲篷遮住天光，各回本洞。到了石橋上站下，念動真言，霎時間，把絲篷收了，赤條條的跑入洞裡，侮著那話，從唐僧面前笑嘻嘻的跑過去。走入石房，取幾件舊衣穿了，徑至後門口立定，叫：「孩兒們何在？」原來那妖精一個有一個兒子，卻不是他養的，都是他結拜的乾兒子。有名叫做蜜、螞、蠦、班、蜢、蜡、蜻：蜜是蜜蜂，螞是螞蜂，蠦是蠦蜂，班是班毛，蜢是牛蜢，蜡是抹蜡，蜻是蜻蜓。原來那妖精幔天結網，擄住這七般蟲蛭，卻要吃他。古云：「禽有禽言，獸有獸語。」當時這些蟲哀告饒命，願拜為母。遂此春採百花供怪物，夏尋諸卉孝妖精。忽聞一聲呼喚，都到面前，問：「母親有何使令？」眾怪道：「兒啊，早間我們錯惹了唐朝來的和尚，才然被他徒弟攔在池裡，出了多少醜，幾乎喪了性命。汝等努力，快出門前去退他一退。如得勝後，可到你舅舅家來會我。」那些怪既得逃生，往他師兄處，孽嘴生災不題。你看這些蟲蛭，一個個摩拳擦掌，出來迎敵。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 196
        "line_end": 196
    "translation_ja": |-
      妖怪たちは八戒を閉じ込めたまま、殴りも傷つけもせず、一人一人門から跳び出し、糸の天幕で空の光を隠したまま、みな自分たちの洞へ帰った。石橋へ着くと立ち止まり、真言を唱え、たちまち糸の天幕を収めた。裸のまま洞へ駆け入り、あそこを手で隠しながら、三蔵の前をにやにや笑って通り過ぎた。石の部屋に入ると古着を何枚か出して着込み、そのまま裏門へ行って立ち、呼んだ。女の妖怪たち「子供たち、どこにいる？」
      実は妖怪たちには、一人につき一人ずつ息子がいた。ただし自分で産んだのではなく、みな契りを結んだ義理の息子である。名は、蜜（みつ）、螞（ば）、蠦（ろ）、班（はん）、蜢（もう）、蜡（さ）、蜻（せい）。蜜はミツバチ、螞は螞蜂（ばほう）、蠦は蠦蜂（ろほう）、班は班毛（はんもう）、蜢は牛蜢（ぎゅうもう）、蜡は抹蜡（まつさ）、蜻はトンボである。もともと妖怪たちは、空を覆う網を張り、この七種類の虫を捕らえて食べようとした。「鳥には鳥の言葉、獣には獣の言葉がある」と昔からいう。そのとき虫たちは命乞いをし、母と仰ぎたいと願い出た。それ以来、春にはさまざまな花を摘んで妖怪へ供え、夏には草花を探して母たちへ孝行していた。呼ぶ声がすると、みな目の前へ集まって尋ねた。義理の息子たち「母さん、何のご用ですか。」
      女の妖怪たち「お前たち、今朝、私たちは唐から来た和尚にうっかり手を出してしまった。さっきその弟子に池の中で押さえ込まれ、さんざん恥をかかされ、危うく命を失うところだったのだ。力を尽くして、早く門の前へ出て、やつらを追い払っておくれ。勝ったなら、お前たちの叔父の家へ来て、私たちと落ち合いなさい。」
      命からがら逃げ延びた妖怪たちは、兄弟子のもとへ行き、その災いを招く口からひと騒動を起こすのだが、その話はしばらくおく。さて虫たちは、一人一人こぶしを揉み、手をこすって、敵を迎えに出た。
    "translation_status": "reviewed"
  - "id": "xy-ch72-040"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說八戒跌得昏頭昏腦，猛擡頭，見絲篷絲索俱無，他才一步一探，爬將起來，忍著疼，找回原路。見了行者，用手扯住道：「哥哥，我的頭可腫，臉可青麼？」行者道：「你怎的來？」八戒道：「我被那廝將絲繩罩住，放了絆腳索，不知跌了多少跟頭，跌得我腰駝背折，寸步難移。卻才絲篷索子俱空，方得了性命回來也。」沙僧見了道：「罷了，罷了，你闖下禍來也，那怪一定往洞裡去傷害師父。我等快去救他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 197
        "line_end": 197
    "translation_ja": |-
      さて八戒は、転び続けて頭もぼうっとしていたが、はっと顔を上げると、糸の天幕も糸縄もすっかり消えていた。そこで一歩ごとに足場を探り、ようやく起き上がり、痛みをこらえてもとの道へ戻った。悟空に会うと、その腕をつかんで言った。八戒「兄貴、俺の頭は腫れていないか、顔は青あざになっていないか？」
      悟空「どうしてそんなことになった？」
      八戒「あいつらに糸縄で覆いかぶされ、足を引っかける縄を張られて、何度転んだか分からん。腰も背も折れ曲がって、一歩も動けなかった。ようやく糸の天幕も縄も消えたので、命が助かって戻れたんだ。」
      沙悟浄はそれを見て言った。沙悟浄「ああ、しまった。厄介なことを起こしてくれたな。妖怪たちはきっと洞へ帰って、お師匠さまを傷つける。早く助けに行こう。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-041"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，急拽步便走；八戒牽著馬。急急來到莊前，但見那石橋上有七個小妖兒擋住道：「慢來，慢來，吾等在此。」行者看了道：「好笑，乾淨都是些小人兒。長的也只有二尺五六寸，不滿三尺；重的也只有八九斤，不滿十斤。」喝道：「你是誰？」那怪道：「我乃七仙姑的兒子。你把我母親欺辱了，還敢無知，打上我門。不要走，仔細。」好怪物，一個個亂打將來。八戒本是跌惱了的性子，又見那夥蟲蛭小巧，就發狠舉鈀來築。那些怪見獃子兇猛，一個個現了本像，飛將起去，叫聲：「變！」須臾間，一個變十個，十個變百個，百個變千個，千個變萬個，個個都變成無窮之數。只見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 199
        "line_end": 199
    "translation_ja": |-
      悟空は聞くなり、急いで大股に歩きだした。八戒は馬を引く。大急ぎで屋敷の前へ来ると、石橋に七人の小妖怪がいて、道をふさいだ。七人の小妖怪「待て、待て。ここには俺たちがいるぞ。」
      悟空は見て言った。悟空「おかしいな、みんなちっぽけなやつらだ。背の高いやつでも二尺五、六寸、三尺にも足りない。重いやつでも八、九斤、十斤にもならないぞ。」
      悟空は怒鳴った。悟空「何者だ？」
      小妖怪たち「俺たちは七仙姑（しちせんこ）の息子だ。母さんたちを辱めておいて、まだ何も知らぬ顔をして、家まで攻めてくるのか。逃げるな、覚悟しろ。」
      妖怪たちは一人一人、乱れ打ちにかかってきた。八戒は転ばされた怒りがまだ収まらず、この虫どもが小さいのを見ると、猛り立って熊手を振り上げ、突きかかった。妖怪たちは八戒の凄まじさを見ると、みな本来の姿を現し、飛び上がって叫んだ。小妖怪たち「変われ！」
      たちまち一匹は十匹、十匹は百匹、百匹は千匹、千匹は万匹となり、どれもどれも限りない数に増えた。見れば、
    "translation_status": "reviewed"
  - "id": "xy-ch72-042"
    "section_id": "chapter-72"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      滿天飛抹蜡，遍地舞蜻蜓。
      蜜螞追頭額，蠦蜂扎眼睛。
      班毛前後咬，牛蜢上下叮。
      撲面漫漫黑，翛翛神鬼驚。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 200
        "line_end": 203
    "translation_ja": |-
      空いっぱいに抹蜡が飛び、地面じゅうにトンボが舞う。
      ミツバチと螞蜂は頭や額を追い、蠦蜂は目を刺す。
      班毛は前から後ろからかみつき、牛蜢は上から下から刺してくる。
      顔へ押し寄せる黒い群れが果てしなく、ざわざわと飛ぶさまに鬼神も驚く。
    "translation_status": "reviewed"
  - "id": "xy-ch72-043"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒慌了道：「哥啊，只說經好取，西方路上，蟲兒也欺負人哩。」行者道：「兄弟，不要怕，快上前打。」八戒道：「撲頭撲臉，渾身上下，都叮有十數層厚，卻怎麼打？」行者道：「沒事，沒事，我自有手段。」沙僧道：「哥啊，有甚手段，快使出來罷，一會子光頭上都叮腫了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 205
        "line_end": 205
    "translation_ja": |-
      八戒は慌てた。八戒「兄貴、お経を取るのはたやすいなんて言っても、西方への道では、虫まで人をいじめるじゃないか。」
      悟空「弟よ、怖がるな。早く前へ出て打て。」
      八戒「頭にも顔にも押し寄せ、体じゅう十何重にも取りついて刺すんだぞ。どうやって打てる？」
      悟空「大丈夫、大丈夫。俺には手立てがある。」
      沙悟浄「兄さん、手立てがあるなら早く使ってくれ。もう少ししたら、つるつるの頭が刺されて腫れ上がってしまう。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-044"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，拔了一把毫毛，嚼得粉碎，噴將出去，即變做些黃、麻、鴏、白、鵰、魚、鷂。八戒道：「師兄，又打甚麼市語，黃啊、麻啊哩？」行者道：「你不知。黃是黃鷹，麻是麻鷹，鴏是鴏鷹，白是白鷹，鵰是鵰鷹，魚是魚鷹，鷂是鷂鷹。那妖精的兒子是七樣蟲，我的毫毛是七樣鷹。」鷹最能嗛蟲，一嘴一個，爪打翅敲，須臾，打得罄盡，滿空無跡，地積尺餘。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 207
        "line_end": 207
    "translation_ja": |-
      悟空は毛をひとつかみ抜き、かみ砕いて吹き飛ばした。するとすぐ、黄（こう）、麻（ま）、鴏（とく）、白（はく）、鵰（ちょう）、魚（ぎょ）、鷂（よう）へと変わった。
      八戒「兄貴、また何の隠語だい。黄だの麻だのって？」
      悟空「知らないのか。黄は黄鷹（こうよう）、麻は麻鷹（まよう）、鴏は鴏鷹（とくよう）、白は白鷹（はくよう）、鵰は鵰鷹（ちょうよう）、魚は魚鷹（うおたか）、鷂は鷂鷹（ようよう）だ。妖怪の息子は七種類の虫、俺の毛は七種類の鷹になったのさ。」
      鷹は虫をくわえるのが何より得意で、ひと口に一匹ずつ、爪で打ち、翼でたたき、たちまちすっかり倒してしまった。空には跡形もなくなり、地には一尺余りも積もった。
    "translation_status": "reviewed"
  - "id": "xy-ch72-045"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三兄弟方才闖過橋去，徑入洞裡，只見老師父吊在那裡哼哼的哭哩。八戒近前道：「師父，你是要來這裡吊了耍子，不知作成我跌了多少跟頭哩。」沙僧道：「且解下師父再說。」行者即將繩索挑斷，放下師父。問道：「妖精那裡去了？」唐僧道：「那七個都赤條條的往後邊叫兒子去了。」行者道：「兄弟們，跟我來尋去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 209
        "line_end": 209
    "translation_ja": |-
      ようやく三兄弟は橋を押し渡り、まっすぐ洞へ入った。お師匠さまはそこに吊るされたまま、うんうんとうめき、泣いていた。八戒は近づいて言った。八戒「お師匠さま、ここへ来て吊るされて遊びたかったんですか。そのおかげで俺が何度転ばされたか、ご存じないでしょう。」
      沙悟浄「まずお師匠さまを下ろしてからにしよう。」
      悟空はすぐ縄を引っかけて切り、師を下ろして尋ねた。悟空「妖怪どもは、どこへ行きました？」
      三蔵「七人とも裸のまま、裏へ息子を呼びに行った。」
      悟空「弟たち、俺について捜しに来い。」
    "translation_status": "reviewed"
  - "id": "xy-ch72-046"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人各持兵器，往後園裡尋處，不見蹤跡。都到那桃李樹上尋遍不見。八戒道：「去了，去了。」沙僧道：「不必尋他，等我扶師父去也。」弟兄們復來前面，請唐僧上馬。八戒道：「你們扶師父走著，等老豬一頓鈀築倒他這房子，教他來時沒處安身。」行者笑道：「築還費力，不若尋些柴來，與他個斷根罷。」好獃子，尋了些朽松、破竹、乾柳、枯藤，點上一把火，烘烘的都燒得乾淨。師徒卻才放心前來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 210
        "line_end": 210
    "translation_ja": |-
      三人はそれぞれ武器を持ち、裏庭を捜したが、姿はなかった。桃や李の木の上まで残らず捜しても、見つからない。
      八戒「逃げた、逃げた。」
      沙悟浄「もう捜すことはない。俺がお師匠さまを支えていこう。」
      兄弟たちは再び前へ戻り、三蔵を馬に乗せた。
      八戒「二人はお師匠さまを支えて行ってくれ。俺が熊手でこの家をめった打ちに壊して、やつらが帰ってきても住めなくしてやる。」
      悟空は笑った。悟空「突き壊すのも骨が折れる。薪を探してきて、すっかり根絶やしにしてやるほうがいい。」
      八戒は朽ちた松、割れた竹、枯れた柳、干からびた蔓を探してきて、火を放った。ごうごうと燃えて、何もかもきれいに焼け尽くした。それでようやく師弟は安心し、先へ進んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch72-047"
    "section_id": "chapter-72"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "咦！畢竟這去，不知那怪的吉凶如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch72-2557105"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第072回&oldid=2557105"
        "line_start": 212
        "line_end": 212
    "translation_ja": "ああ、こうして去ったのち、あの妖怪たちの吉凶はいかに。続きは次回のお話に。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-01-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「與他換了衣帽」は八戒が三蔵の衣帽を替えて整える動作と解した。二人が互いの衣服を交換したとは断定せず、その後に屋敷へ歩く主語は前後から三蔵とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-02-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "蹴鞠の技名と動作を列挙する賦。すべての句を残したが、拿頭・過論・張泛の切れ目や具体的な型には未確定の点がある。「出牆花」「大過海」「一團泥」「單槍」「明珠上佛頭」「窄磚」「臥魚」「扳凳」「披肩」「絞襠」「鎖項」「黃河水倒流」「金魚灘上買」「潠草鞋」「販簍」「奪門揣」などは、確実な競技技法の復元とせず、字面を日本語へ移した。底本の「腳抷」「喧泛」「只一歹」等も別版に直さず、文脈から暫定的に訳す。「叫海」は遊びを終える、または中断する呼び声と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-03-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「攔路齋僧」は、道端で食事を与えて済ませず家へ迎える意に取った。女たちの歓待の台詞を、通行を妨げないという一般論には置き換えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-04-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「太陽星原貞有十」は「もと十あった」と解した。「原貞」の字は原文欄にそのまま残す。九つの泉は底本の順序と字を守り、特に東合泉・潢山泉を別の泉名へ訂正しない。「温泉」と「湯泉」もこの列挙ではそれぞれ一つの泉の固有名として数える。これは物語が語る起源説であり、現実の温泉の成因の説明ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-05-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「寧少路邊錢，莫少路邊拳」は、旅路で害をなす者への打撃を手控えるな、という八戒の理屈として訳した。妖怪を殺すべきだという本人の主張であり、語り手の一般的な勧めにしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-06-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "女たちは「責め苦を加えたことはない」と弁明するが、先に三蔵が吊られて苦しむ描写はある。その食い違いは修正しない。「各人走路」は打たれた後に各自の道を行けという言い回しで、八戒がここで助命を約束したとは読まない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-07-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "糸が出る場所を、前には「腰眼」、ここでは「臍孔」とする。訳もそれぞれ腰のくぼみ、臍の穴とし、底本の身体部位を一つにそろえない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-08-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "七人の名は蜜・螞・蠦・班・蜢・蜡・蜻、対応する虫は蜜蜂・螞蜂・蠦蜂・班毛・牛蜢・抹蜡・蜻蜓で、列挙順を保った。班毛は教育部辞典が麻蠅と説明する。蠦蜂・牛蜢・抹蜡などには種の同定の留保があり、通行字や現代の分類へ無断で置き換えない。名としての一字と虫の一般名は辞書で分けた。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-09-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここでの「七仙姑」は小妖怪たちが母を呼ぶ語。土地神が説明した、濯垢泉の元の持ち主である天上の七仙姑と同一の存在だとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch72-note-10-body"
    "section_id": "chapter-72"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "七種の鷹は黄・麻・鴏・白・鵰・魚・鷂、説明では黄鷹・麻鷹・鴏鷹・白鷹・鵰鷹・魚鷹・鷂鷹とする。底本の「鴏」の字を保持した。漢典では鴏に別の字義や鳥の字義があり、この複合鳥名の種は未確定。「魚鷹」等も一律に現生種の名称へ確定しない。"
    "translation_status": "reviewed"

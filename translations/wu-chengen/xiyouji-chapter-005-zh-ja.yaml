    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 13
  "translation_ja": "斉天大聖は雲に乗ったまま呪文を唱え、体を一揺すりすると、赤脚大仙の姿になり、瑤池へ急いだ。ほどなく宝閣に着き、雲を止めて、足音を忍ばせながら中へ入った。そこには、こんな光景が広がっていた。"
  "translation_status": "reviewed"
- "id": "xy-ch05-015"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": "瓊香繚繞，瑞靄繽紛。瑤臺鋪彩結，寶閣散氤氳。鳳翥鸞翔形縹緲，金花玉萼影浮沉。上排著九鳳丹霞扆，八寶紫霓墩，五彩描金桌，千花碧玉盆。桌上有龍肝和鳳髓，熊掌與猩唇。珍饈百味般般美，異果嘉殽色色新。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 14
  "translation_ja": |-
    かぐわしい香りが漂い、めでたい霞があふれる。
    玉の台には色とりどりの飾りが掛かり、宝閣にはゆらゆらと気（き・推定。ここでは宮殿の周囲に漂うもやのようなもの）がたなびく。
    鳳凰（ほうおう。中国の伝説に登場する、めでたい鳥）や鸞（らん・推定。鳳凰に似た、伝説上のめでたい鳥）が舞う姿はほのかにかすみ、金の花、玉の萼（がく・推定。花びらの根元を包む部分）の影が浮いては沈む。
    上座には九羽の鳳凰と赤い霞を描いたついたて、八宝（はっぽう・推定。八つの宝物。またはさまざまな宝飾）と紫の虹で飾った腰掛け、五彩に金をあしらった卓、千の花を刻んだ碧玉（へきぎょく・推定。青緑色の美しい玉石）の鉢が並ぶ。
    卓には竜（りゅう・推定。中国の伝説に登場する、長い体をもつ神聖な動物）の肝と鳳凰の髄、熊の手のひらと猩々（しょうじょう・推定。人に似た猿のような伝説上の生き物）の唇。
    百味の珍味はどれも美味で、珍しい果実や見事な料理は、すべて目新しい。
  "translation_status": "reviewed"
- "id": "xy-ch05-016"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那裡鋪設得齊齊整整，卻還未有仙來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 15
  "translation_ja": "会場は何もかも整然としつらえられていたが、まだ仙人は一人も来ていなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch05-017"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖點看不盡，忽聞得一陣酒香撲鼻。忽轉頭，見右壁廂長廊之下，有幾個造酒的仙官、盤糟的力士，領幾個運水的道人、燒火的童子，在那裡洗缸刷甕，已造成了玉液瓊漿，香醪佳釀。大聖止不住口角流涎，就要去吃，奈何那些人都在這裡。他就弄個神通，把毫毛拔下幾根，丟入口中嚼碎，噴將出去，念聲咒語，叫：「變！」即變做幾個瞌睡蟲，奔在眾人臉上。你看那夥人，手軟頭低，閉眉合眼，丟了執事，都去盹睡。大聖卻拿了些百味八珍，佳殽異品，走入長廊裡面，就著缸，挨著甕，放開量，痛飲一番。吃勾了多時，酕醄醉了。自揣自摸道：「不好，不好！再過會，請的客來，卻不怪我？一時拿住，怎生是好？不如早回府中睡去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 16
  "translation_ja": |-
    斉天大聖が見ても見ても見尽くせずにいると、ふいに酒の香りが鼻を打った。顔を向けると、右手の長い廊下に、酒を造る仙官（せんかん・推定。天界の役人）や酒粕を扱う力士が何人かおり、水を運ぶ道人（どうじん・推定。道教の修行をする者）や火をたく童子（どうじ。ここでは、仙人に仕える少年の姿の者）を率いて、大甕（おおがめ・推定。酒や水などを入れる大きなかめ）や壺を洗っていた。玉のしずくのような仙酒（せんしゅ・推定。仙人の世界の特別な酒）、芳醇な酒がすでに出来上がっていたのである。斉天大聖はよだれが止まらず、飲みに行きたくなったが、皆がいるので困った。そこで神通力（じんつうりき。修行によって得る、人の力を超えた不思議な能力）を使い、毛を数本抜いて口に入れ、かみ砕いて吹き出し、呪文を唱えた。
    斉天大聖「変われ！」
    毛はたちまち眠りの虫となり、人々の顔へ飛んでいった。すると皆は手から力が抜け、頭を垂れ、まぶたを閉じて、仕事を放り出し、居眠りを始めた。斉天大聖は数々の珍味や八珍（はっちん・推定。特に珍しく上等な食べ物）の料理をいくらか取ると、長い廊下へ入って、甕（かめ・推定。酒や水などを入れる大きな器）や壺にじかに口をつけ、好きなだけ痛飲した。長いことたらふく飲み食いし、すっかり酔ってしまった。そこで自分なりに考えた。
    斉天大聖「まずい、まずい！　そのうち招待客が来たら、俺をとがめずにはおかないぞ。捕まったら、どうすればいい？　早く府へ帰って寝るに限る」
  "translation_status": "reviewed"
- "id": "xy-ch05-018"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，搖搖擺擺，仗著酒，任情亂撞。一會把路差了，不是齊天府，卻是兜率天宮。一見了，頓然醒悟道：「兜率宮是三十三天之上，乃離恨天太上老君之處，如何錯到此間？也罷，也罷，一向要來望此老，不曾得來，今趁此殘步，就望他一望也好。」即整衣撞進去，那裡不見老君，四無人跡。原來那老君與燃燈古佛在三層高閣朱陵丹臺上講道，眾仙童、仙將、仙官、仙吏都侍立左右聽講。這大聖直至丹房裡面，尋訪不遇。但見丹灶之傍，爐中有火。爐左右安放著五個葫蘆，葫蘆裡都是煉就的金丹。大聖喜道：「此物乃仙家之至寶。老孫自了道以來，識破了內外相同之理，也要煉些金丹濟人，不期到家無暇。今日有緣，卻又撞著此物。趁老子不在，等我吃他幾丸嘗新。」他就把那葫蘆都傾出來，就都吃了，如吃炒豆相似。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 17
  "translation_ja": |-
    さて斉天大聖、酒の勢いでふらふら揺れながら、気ままに歩き回った。やがて道を間違え、斉天大聖府ではなく、兜率宮（とそつきゅう・推定。太上老君が住み、丹薬を作る天界の宮殿）へ来てしまった。それを見て、はっと気づいた。
    斉天大聖「兜率宮は三十三天（さんじゅうさんてん。ここでは、はるか上方にある天界をいう）の上、離恨天（りこんてん・推定。この回で三十三天の上にあるとされる太上老君の住む天）にある太上老君（たいじょうろうくん。道教で老子を神とした存在。ここでは丹薬を作る仙人）の住まいだ。どうして、こんな所へ迷い込んだんだろう？　まあいい、まあいい。前からあのご老体を訪ねたいと思いながら、来られなかった。こうしてたどり着いたついでに、お目にかかっていくとしよう」
    衣を整えて中へ入ったが、太上老君は見えず、あたりに人影もない。実は太上老君は、燃灯古仏（ねんとうこぶつ・推定。太上老君とともに教えを説く、はるかな昔の仏）とともに三層の高楼にある朱陵丹台（しゅりょうたんだい・推定。太上老君と燃灯古仏が教えを説いている高楼の場所）で道を説いていた。仙童（せんどう。仙人に仕える童子）、仙将（せんしょう・推定。仙人の世界の将軍）、仙官、仙吏たちは、みな左右に控えて話を聞いていたのである。斉天大聖は丹薬（たんやく・推定。不老長寿を求めて仙人が練り上げる薬）を作る部屋まで探しに来たが、誰にも会わなかった。ただ丹薬の炉のそばに来ると、炉の中には火があり、左右に五つの瓢箪（ひょうたん・推定。乾かしたヒョウタンの実で作る容器）が置いてあった。中はすべて、練り上がった金丹（きんたん・推定。仙人が練り上げる不老長寿の薬）だった。斉天大聖は喜んだ。
    斉天大聖「これは仙人にとってこの上ない宝だ。俺も道を得てから、内と外が同じ理に通じることを悟り、人を助ける金丹を練りたいと思っていた。ところが、山へ帰ってからは暇がなかった。今日は縁があって、思いがけずこいつに出会えたぞ。老君（ろうくん・推定。太上老君を短く呼ぶ名）がいない間に、何粒か食べて、味見をさせてもらおう」
    そう言うと、瓢箪の中身を残らずあけ、炒り豆でも食べるように、すべて食べてしまった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "内外相同は内と外の修煉の理の一致と解したが、特定の内丹・外丹の学説との厳密な同定は留保する。"
- "id": "xy-ch05-019"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一時間，丹滿酒醒。又自己揣度道：「不好，不好！這場禍比天還大，若驚動玉帝，性命難存。走，走，走，不如下界為王去也。」他就跑出兜率宮，不行舊路，從西天門，使個隱身法逃去。即按雲頭，回至花果山界。但見那旌旗閃灼，戈戟光輝，原來是四健將與七十二洞妖王，在那裡演習武藝。大聖高叫道：「小的們，我來也！」眾怪丟了器械，跪倒道：「大聖好寬心，丟下我等許久，不來相顧。」大聖道：「沒多時，沒多時。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 18
  "translation_ja": |-
    しばらくすると、金丹で腹が満ち、酒の酔いも覚めた。また一人で考えた。
    斉天大聖「まずい、まずい！　今度の騒ぎは、天よりも大きいぞ。玉帝の耳に入ったら、命は助からない。逃げろ、逃げろ、逃げろ！　下界（げかい・推定。天界から見て下にある地上の世界）へ戻って王になるに限る」
    斉天大聖は兜率宮を駆け出し、来た道は通らず、西天門（さいてんもん・推定。天界の西側にある門）から姿を隠す術で逃げ去った。雲を降ろし、花果山（かかざん。石猿が生まれ、猿たちが暮らす山）の領内へ帰ると、旗がひるがえり、戈（ほこ・推定。長い柄の横に刃を付けた古代の武器）や戟（げき。長い柄の先に突く刃と横向きの刃を備えた武器）がきらめいていた。四健将（しけんしょう・推定。馬元帥・流元帥・崩将軍・芭将軍の四人の勇将）と七十二洞（しちじゅうにどう・推定。花果山の周辺にある多くの妖怪の洞窟）の妖王たちが、武芸の稽古をしていたのである。斉天大聖は大声で呼んだ。
    斉天大聖「お前たち、帰ったぞ！」
    妖怪たちは武器を放り出し、ひざまずいた。
    妖怪たち「大聖は、ずいぶんのんきでいらっしゃいます。私たちを長い間ほったらかしにして、顔も見せてくださいませんでした」
    斉天大聖「大してたっていないさ。大してたっていない」
  "translation_status": "reviewed"
- "id": "xy-ch05-020"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且說且行，徑入洞天深處。四健將打掃安歇，叩頭禮拜畢，俱道：「大聖在天這百十年，實受何職？」大聖笑道：「我記得才半年光景，怎麼就說百十年話？」健將道：「在天一日，即在下方一年也。」大聖道：「且喜這番玉帝相愛，果封做齊天大聖，起一座齊天府，又設安靜、寧神二司，司設仙吏侍衛。向後見我無事，著我看管蟠桃園。近因王母娘娘設蟠桃大會，未曾請我，是我不待他請，先赴瑤池，把他那仙品、仙酒，都是我偷吃了。走出瑤池，踉踉蹡蹡誤入老君宮闕，又把他五個葫蘆金丹也偷吃了。但恐玉帝見罪，方才走出天門來也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 19
  "translation_ja": |-
    話しながら歩き、まっすぐ洞天（どうてん。仙人が住むとされる洞窟の世界）の奥深くへ入った。四健将は休む場所を掃除し、頭を下げて礼拝を済ませると、そろって尋ねた。
    四健将「大聖は天上でこの百年ほど、実際にはどのようなお役目に就かれたのでしょう？」
    斉天大聖は笑った。
    斉天大聖「俺の覚えでは、まだ半年ほどだ。どうして百年もたったと言うんだ？」
    四健将「天上の一日が、下界では一年になるのでございます」
    斉天大聖「ありがたいことに、今度は玉帝が俺を大事にしてくれて、本当に斉天大聖に任じ、斉天大聖府を一つ建ててくれた。安静司（あんせいし・推定。斉天大聖府の内部に置かれた役所の一つ）と寧神司（ねいしんし・推定。斉天大聖府の内部に置かれた役所の一つ）の二つの役所も置き、仙吏をつけて世話や警護をさせた。その後、俺が暇なのを見て、蟠桃園の管理を命じたんだ。ところが先日、王母さまが蟠桃大会（ばんとうたいえ・推定。王母が蟠桃を供して開く神々の宴）を開くのに、俺を招かなかった。そこで招きを待たずに瑤池へ行き、仙人のごちそうも酒も、盗み食いしてやった。瑤池を出てふらついているうちに、間違って老君の宮殿へ入り、五つの瓢箪に入った金丹まで盗み食いした。玉帝に罪を問われるのが心配で、さっき天門（てんもん・推定。天界への出入口となる門）を出て来たというわけさ」
  "translation_status": "reviewed"
- "id": "xy-ch05-021"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾怪聞言大喜。即安排酒果接風，將椰酒滿斟一石碗奉上。大聖喝了一口，即咨牙徠嘴道：「不好吃，不好吃。」崩、芭二將道：「大聖在天宮吃了仙酒、仙殽，是以椰酒不甚美口。常言道：『美不美，鄉中水。』」大聖道：「你們就是『親不親，故鄉人。』我今早在瑤池中受用時，見那長廊之下有許多瓶罐，都是那玉液瓊漿。你們都不曾嘗著，待我再去偷他幾瓶回來，你們各飲半杯，一個個也長生不老。」眾猴歡喜不勝。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 20
  "translation_ja": |-
    妖怪たちはこれを聞いて大いに喜び、帰還を祝おうと、すぐに酒や果物を用意した。石の椀に椰子酒（やしざけ・推定。ヤシから作る酒）をなみなみと注ぎ、差し出した。斉天大聖は一口飲むと、歯をむき出し、口をゆがめた。
    斉天大聖「まずい、まずい」
    崩（ほう・推定。四健将の一人。崩将軍の略称）・芭（は・推定。四健将の一人。芭将軍の略称）の二将「大聖は天宮（てんきゅう・推定。天界にある宮殿）で仙酒や仙人のごちそうを召し上がったので、椰子酒はあまりお口に合わないのでしょう。ですが、よく申しますでしょう。『うまくてもまずくても、故郷の水』と」
    斉天大聖「お前たちは、まさに『親しくてもそうでなくても、故郷の人』だな。今朝、瑤池で飲み食いしたとき、長い廊下に壺や瓶がたくさんあるのを見た。どれも極上の仙酒だったぞ。お前たちは飲んだことがないだろう。俺がもう一度行って、何瓶か盗んで来てやる。お前たちも半杯ずつ飲めば、一人残らず不老長生になれるぞ」
    猿たちは大喜びした。
  "translation_status": "reviewed"
- "id": "xy-ch05-022"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖即出洞門，又翻一觔斗，使個隱身法，徑至蟠桃會上，進瑤池宮闕，只見那幾個造酒、盤糟、運水、燒火的還鼾睡未醒。他將大的從左右脅下挾了兩個，兩手提了兩個，即撥轉雲頭回來，會眾猴在於洞中，就做個仙酒會，各飲了幾杯，快樂不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 21
  "translation_ja": "斉天大聖は洞窟の門を出ると、また筋斗（きんと・推定。宙返り。ここでは雲で移動するための動作）を一つ打ち、姿を隠す術を使って、まっすぐ蟠桃の宴へ向かった。瑤池の宮殿へ入ると、酒を造る者、酒粕を扱う者、水を運ぶ者、火をたく者は、まだいびきをかいて眠っていた。斉天大聖は大きな酒の容器を二つ、左右の脇に一つずつ抱え、両手にも一つずつ提げると、雲の向きを変えて帰ってきた。洞窟に猿たちを集め、仙酒の会を催して、それぞれ数杯ずつ飲んだ。その楽しみようは、ひとまずおく。"
  "translation_status": "reviewed"
- "id": "xy-ch05-023"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那七衣仙女自受了大聖的定身法術，一周天方能解脫。各提花籃，回奏王母，說道：「齊天大聖使術法困住我等，故此來遲。」王母問道：「汝等摘了多少蟠桃？」仙女道：「只有兩籃小桃，三籃中桃。至後面，大桃半個也無，想都是大聖偷吃了。及正尋間，不期大聖走將出來，行兇拷打，又問設宴請誰。我等把上會事說了一遍，他就定住我等，不知去向。直到如今，才得醒解回來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 22
  "translation_ja": |-
    一方、七衣仙女は、斉天大聖の定身法にかけられてから、丸一昼夜が過ぎて、ようやく解放された。それぞれ花籠を提げて戻り、王母へ報告した。
    七衣仙女「斉天大聖が術で私たちを動けなくしたため、遅くなりました」
    王母「蟠桃はいくつ摘めたのですか？」
    七衣仙女「小さな桃が二籠、中くらいの桃が三籠だけでございます。奥へ行きますと、大きな桃は半個さえなく、きっと大聖が盗み食いされたのでしょう。探しているところへ、思いがけず大聖が現れ、乱暴をして殴りつけ、宴に誰を招くのかとお尋ねになりました。私たちが、これまでの宴のことをお話しすると、体を動けなくされ、どこかへ行ってしまわれました。つい先ほど、ようやく術が解けて、帰って来られたのでございます」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "仙女の報告では行兇拷打とあるが、先の語り手の描写には殴打が明示されていない。報告として訳し、前段へ行為を補わない。大桃が半個もないという報告と半紅半白の桃の描写も校訂せず保持した。"
- "id": "xy-ch05-024"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王母聞言，即去見玉帝，備陳前事。說不了，又見那造酒的一班人，同仙官等來奏：「不知甚麼人，攪亂了蟠桃大會，偷吃了玉液瓊漿；其八珍百味，亦俱偷吃了。」又有四個大天師來奏上：「太上道祖來了。」玉帝即同王母出迎。老君朝禮畢，道：「老道宮中煉了些九轉金丹，伺候陛下做丹元大會，不期被賊偷去，特啟陛下知之。」玉帝見奏悚懼。少時，又有齊天府仙吏叩頭道：「孫大聖不守執事，自昨日出遊，至今未轉，更不知去向。」玉帝又添疑思。只見那赤腳大仙又頫顖上奏道：「臣蒙王母詔，昨日赴會，偶遇齊天大聖，對臣言萬歲有旨，著他邀臣等先赴通明殿演禮，方去赴會。臣依他言語，即返至通明殿外，不見萬歲龍車鳳輦，又急來此俟候。」玉帝越發大驚道：「這廝假傳旨意，賺哄賢卿。快著糾察靈官緝訪這廝蹤跡。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 23
  "translation_ja": |-
    王母はそれを聞くと、すぐに玉帝に会いに行き、一部始終を話した。話し終えないうちに、酒を造っていた者たちも、仙官と一緒にやって来て申し上げた。
    酒造りの者たちと仙官たち「何者かが蟠桃大会を荒らし、仙酒を盗み飲みいたしました。八珍百味（はっちんひゃくみ・推定。多種多様な上等のごちそう）のごちそうも、すっかり盗み食いされております」
    さらに四大天師（しだいてんし・推定。天界に仕える四人の道教の高位の仙人）が報告した。
    四大天師「太上道祖（たいじょうどうそ・推定。太上老君を道教の祖として敬う呼び名）がお見えでございます」
    玉帝は王母とともに迎えに出た。太上老君は挨拶の礼を済ませると、申し上げた。
    太上老君「私の宮では、陛下が丹元大会（たんげんたいえ・推定。玉帝が金丹を用意して開く予定の集まり）をお開きになるのに備え、九転金丹（きゅうてんきんたん・推定。繰り返し練り上げて作る特別な金丹）を練っておりました。ところが、思いがけず賊に盗まれましたので、陛下にお知らせに参ったのでございます」
    玉帝はこの報告を聞いて、恐れ驚いた。ほどなく、斉天大聖府の仙吏たちも頭を下げた。
    斉天大聖府の仙吏「孫大聖（そんたいせい・推定。孫悟空を姓と称号で呼ぶ名）はお役目を守らず、昨日遊びに出られてから、今もお戻りになりません。行方も分からないのでございます」
    玉帝の疑念はさらに深まった。そこへ赤脚大仙が、頭を下げて申し上げた。
    赤脚大仙「臣は王母さまのお招きを受け、昨日宴へ向かっておりましたが、斉天大聖に出会いました。大聖は、陛下のお言いつけで、私たちをまず通明殿での礼に招き、それから宴へ行かせるのだと申しました。その言葉どおり、通明殿へ引き返しましたが、陛下の竜車（りゅうしゃ・推定。竜で飾るなどした天帝の車）も鳳輦（ほうれん・推定。鳳凰の飾りが付いた君主の乗り物）も見えませんので、急いでこちらへ来て、お待ちしていたのでございます」
    玉帝はますます驚いた。
    玉帝「あの者は偽の勅命（ちょくめい。帝王からの命令）を伝えて、そなたをだましたのだ。すぐに糾察霊官（きゅうさつれいかん・推定。天界で不正や事件を調べる役目の神）に、その行方を調べさせよ」
  "translation_status": "reviewed"
- "id": "xy-ch05-025"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "靈官領旨，即出殿遍訪，盡得其詳細，回奏道：「攪亂天宮者，乃齊天大聖也。」又將前事盡訴一番。玉帝大惱，即差四大天王，協同李天王並哪吒太子，點二十八宿、九曜星官、十二元辰、五方揭諦、四值功曹、東西星斗、南北二神、五岳四瀆、普天星相，共十萬天兵，佈一十八架天羅地網，下界去花果山圍困，定捉獲那廝處治。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 24
  "translation_ja": |-
    糾察霊官は勅命を受け、殿を出て各所を調べ回り、詳しい事情をすべてつかむと、戻って報告した。
    糾察霊官「天宮を荒らしたのは、斉天大聖でございます」
    さらに、それまでの出来事を残らず申し上げた。玉帝は激怒した。四大天王に、李天王（りてんのう・推定。天軍を率いる李靖の称号）および哪吒（なた。李天王の三男である少年神）と協力し、二十八宿、九曜星官（くようせいかん・推定。九曜星をつかさどる九人の天界の神）、十二元辰、五方掲諦（ごほうぎゃてい・推定。東西南北と中央を守る仏教系の五柱の神）、四値功曹（しちこうそう・推定。年・月・日・時を受け持つ四柱の神）、東西の星斗（せいと・推定。星々。ここでは東西の星の神々）、南北の二神（なんぼくのにしん・推定。天界の軍勢に加わる南北の神々）、五岳四瀆（ごがくしとく・推定。中国の五つの聖山と四つの大河。ここではそれらの神々）、天じゅうの星の神々、合わせて十万の天兵（てんぺい・推定。天界に仕える兵士）を召集するよう命じた。十八の天羅地網（てんらちもう・推定。天と地を覆い、逃げ道をなくす包囲の網）を張り巡らし、下界の花果山を包囲して、必ずあの者を捕らえ、処罰せよというのである。
  "translation_status": "reviewed"
- "id": "xy-ch05-026"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾神即時興師，離了天宮。這一去，但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 25
  "translation_ja": "神々はすぐに兵を起こし、天宮を出発した。その進軍のありさまは、こうだった。"
  "translation_status": "reviewed"
- "id": "xy-ch05-027"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": "黃風滾滾遮天暗，紫霧騰騰罩地昏。只為妖猴欺上帝，致令眾聖降凡塵。四大天王，五方揭諦：四大天王權總制，五方揭諦調多兵。李托塔中軍掌號，惡哪吒前部先鋒。羅猴星為頭檢點，計都星隨後崢嶸。太陰星精神抖擻，太陽星照耀分明。五行星偏能豪傑，九曜星最喜相爭。元辰星子午卯酉，一個個都是大力天丁。五瘟五岳東西擺，六丁六甲左右行。四瀆龍神分上下，二十八宿密層層。角亢氐房為總領，奎婁胃昴慣翻騰。斗牛女虛危室壁，心尾箕星個個能。井鬼柳星張翼軫，掄槍舞劍顯威靈。停雲降霧臨凡世，花果山前扎下營。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 26
  "translation_ja": |-
    黄色い風が渦巻いて天を暗くし、紫の霧が立ちのぼって地を覆う。
    妖猿が天帝（てんてい・推定。天界の帝王。ここでは玉帝を指す）を欺いたため、神聖な者たちが俗世へ降りる。
    四大天王、五方掲諦。四大天王は全軍を統べ、五方掲諦は多くの兵を動かす。
    塔を持つ李天王が中軍で号令を下し、荒々しい哪吒が前軍の先鋒を務める。
    羅猴星（らごうせい・推定。日食や月食に結びつく星の神。一般に羅睺星と書く）は先頭で兵を点検し、計都星（けいとせい。九曜に数えられる星の神）は後ろに続いて威容を示す。
    太陰星（たいいんせい・推定。月を神としたもの）は意気盛ん、太陽星（たいようせい・推定。太陽を神としたもの）は明るく光を放つ。
    五行星（ごぎょうせい・推定。木・火・土・金・水に対応する五つの惑星の神々）はそれぞれ勇猛、九曜星は争いを好む。
    元辰星（げんしんせい・推定。十二支に対応する十二元辰の星の神々）の子（ね・推定。十二支の一つ。ここでは対応する元辰の星の神）・午（うま・推定。十二支の一つ。ここでは対応する元辰の星の神）・卯（う・推定。十二支の一つ。ここでは対応する元辰の星の神）・酉（とり・推定。十二支の一つ。ここでは対応する元辰の星の神）、一人一人が力ある天兵。
    五瘟（ごおん・推定。疫病をつかさどる五柱の神）と五岳（ごがく・推定。中国の五つの聖山。ここではその山々の神）は東西に並び、六丁（りくてい。六つの丁の干支に対応する道教の神々）と六甲（ろっこう。六つの甲の干支に対応する道教の神々）は左右を進む。
    四瀆（しとく。中国の四つの大河。ここではその川をつかさどる竜神）の竜神は上下に分かれ、二十八宿は幾重にも重なる。
    角（かく。二十八宿の一つ。ここではその星の神）・亢（こう。二十八宿の一つ。ここではその星の神）・氐（てい。二十八宿の一つ。ここではその星の神）・房（ぼう。二十八宿の一つ。ここではその星の神）が総領となり、奎（けい。二十八宿の一つ。ここではその星の神）・婁（ろう。二十八宿の一つ。ここではその星の神）・胃（い。二十八宿の一つ。ここではその星の神）・昴（ぼう。二十八宿の一つ。ここではその星の神）は自在に駆け巡る。
    斗（と。二十八宿の一つ、斗宿を神格化した天界の武将）・牛（ぎゅう。二十八宿の一つ、牛宿を神格化した天界の武将）・女（じょ。二十八宿の一つ。ここではその星の神）・虚（きょ。二十八宿の一つ。ここではその星の神）・危（き。二十八宿の一つ。ここではその星の神）・室（しつ。二十八宿の一つ。ここではその星の神）・壁（へき。二十八宿の一つ。ここではその星の神）、心（しん。二十八宿の一つ。ここではその星の神）・尾（び。二十八宿の一つ。ここではその星の神）・箕（き。二十八宿の一つ。ここではその星の神）はみな腕達者。
    井（せい。二十八宿の一つ。ここではその星の神）・鬼（き。二十八宿の一つ。ここではその星の神）・柳（りゅう。二十八宿の一つ。ここではその星の神）・星（せい。二十八宿の一つ。ここではその星の神）・張（ちょう。二十八宿の一つ、張宿を神格化した天界の武将）・翼（よく。二十八宿の一つ。ここではその星の神）・軫（しん。二十八宿の一つ。ここではその星の神）は、槍や剣を振るって神威（しんい・推定。神の威力や威厳）を示す。
    雲を止め、霧を降ろして人の世へ着くと、花果山の前に陣を敷いた。
  "translation_status": "reviewed"

- "id": "xy-ch05-029"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    天產猴王變化多，偷丹偷酒樂山窩。
    只因攪亂蟠桃會，十萬天兵佈網羅。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 28
  "translation_ja": |-
    天が生んだ猿の王、変化（へんげ。術によって姿や形を変えること）自在に丹（たん・推定。仙人が練り上げる薬。ここでは盗み出した金丹）と酒を盗み、山のねぐらで楽しむ。
    蟠桃の宴を乱したために、十万の天兵が網を張る。
  "translation_status": "reviewed"
- "id": "xy-ch05-030"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時李天王傳了令，著眾天兵扎了營，把那花果山圍得水泄不通，上下佈了十八架天羅地網，先差九曜惡星出戰。九曜即提兵徑至洞外，只見那洞外大小群猴跳躍頑耍。星官厲聲高叫道：「那小妖，你那大聖在那裡？我等乃上界差調的天神，到此降你這造反的大聖。教他快快來歸降；若道半個不字，教汝等一概遭誅。」那小妖慌忙傳入道：「大聖，禍事了！禍事了！外面有九個兇神，口稱上界差來的天神，收降大聖。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 29
  "translation_ja": |-
    そのとき李天王は命令を下し、天兵たちに陣を敷かせた。花果山を水も漏らさぬほど囲み、上下に十八の天羅地網を張り巡らせ、まず荒々しい九曜星官を出陣させた。九曜星官は兵を率いて洞窟の外へ直進した。そこでは大小の猿たちが、跳び回って遊んでいた。九曜星官は厳しい声で叫んだ。
    九曜星官「小妖怪ども、お前たちの大聖はどこだ！　我々は上界から遣わされた天神で、反逆者の大聖を降伏させに来た。すぐに出てきて降伏せよと伝えろ。少しでも嫌だと言えば、お前たちを皆殺しにするぞ」
    小妖怪は慌てて中へ伝えた。
    小妖怪「大聖、大変です！　大変です！　外に恐ろしい神が九人います。上界から遣わされた天神で、大聖を降伏させに来たと言っております」
  "translation_status": "reviewed"
- "id": "xy-ch05-031"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖正與七十二洞妖王並四健將分飲仙酒，一聞此報，公然不理道：「今朝有酒今朝醉，莫管門前是與非。」說不了，一起小妖又跳來道：「那九個兇神惡言潑語，在門前罵戰哩。」大聖笑道：「莫採他。詩酒且圖今日樂，功名休問幾時成。」說猶未了，又一起小妖來報：「爺爺！那九個兇神已把門打破，殺進來也。」大聖怒道：「這潑毛神，老大無禮。本待不與他計較，如何上門來欺我？」即命獨角鬼王：「領帥七十二洞妖王出陣。老孫領四健將隨後。」那鬼王疾帥妖兵出門迎敵，卻被九曜惡星一齊掩殺，抵住在鐵板橋頭，莫能得出。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 30
  "translation_ja": |-
    斉天大聖はちょうど、七十二洞の妖王と四健将とで仙酒を飲んでいた。報告を聞いても、まるで取り合わなかった。
    斉天大聖「今日酒があるなら、今日酔おう。門前のいざこざなど構うな」
    言い終えないうちに、また一団の小妖怪が跳び込んできた。
    小妖怪たち「あの九人の恐ろしい神が、門の前で口汚くののしり、勝負しろと叫んでいます」
    斉天大聖は笑った。
    斉天大聖「相手にするな。詩と酒で今日を楽しもう。功名がいつ成るかなど、問うものか」
    まだ話しているところへ、別の一団の小妖怪が報告に来た。
    小妖怪たち「大王さま！　あの九人の神が、門を打ち破って攻め込んできます！」
    斉天大聖は怒った。
    斉天大聖「あの下っ端の神ども、なんという無礼だ。相手にしないでおこうと思っていたのに、わざわざ家まで押しかけて俺を侮るとは！」
    すぐに独角鬼王（どっかくきおう・推定。孫悟空に仕えようと訪れた一本角の鬼の王。二人いる）へ命じた。
    斉天大聖「七十二洞の妖王を率いて出陣せよ。俺は四健将を連れて、後から行く」
    独角鬼王は急いで妖兵を率いて門を出て迎え撃ったが、九曜星官が一斉に攻めかかり、鉄の板の橋のたもとへ押しとどめられて、先へ出られなくなった。
  "translation_status": "reviewed"
- "id": "xy-ch05-032"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正嚷間，大聖到了，叫一聲：「開路！」掣開鐵棒，幌一幌，碗來粗細，丈二長短，丟開架子，打將出來。九曜星那個敢抵，一時打退。那九曜星立住陣勢道：「你這不知死活的弼馬溫，你犯了十惡之罪：先偷桃，後偷酒，攪亂了蟠桃大會，又竊了老君仙丹，又將御酒偷來此處享樂。你罪上加罪，豈不知之？」大聖笑道：「這幾樁事，實有，實有。但如今你怎麼？」九曜星道：「吾奉玉帝金旨，帥眾到此收降你。快早皈依，免教這些生靈納命，不然，就屣平了此山，掀翻了此洞也。」大聖大怒道：「量你這些毛神，有何法力，敢出浪言。不要走，請吃老孫一棒。」這九曜星一齊踴躍；那美猴王不懼分毫，掄起金箍棒，左遮右擋。把那九曜星戰得筋疲力軟，一個個倒拖器械，敗陣而走，急入中軍帳下，對托塔天王道：「那猴王果十分驍勇，我等戰他不過，敗陣來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 31
  "translation_ja": |-
    騒ぎの最中、斉天大聖がやって来て叫んだ。
    斉天大聖「道をあけろ！」
    鉄棒を取り出して一振りし、椀ほどの太さ、一丈（じょう・推定。昔の長さの単位。一丈は十尺）二尺（しゃく・推定。昔の長さの単位。一尺は十寸。実際の長さは時代や地域で異なる）の長さにすると、構えを取り、打って出た。九曜星官も、とても受け止められず、一度は押し返された。九曜星官は陣を立て直して言った。
    九曜星官「命知らずの弼馬温（ひつばおん。孫悟空が任じられた天界の馬の管理役）め！　お前は十悪（じゅうあく・推定。とりわけ重い十種の悪事や罪）の大罪を犯した。まず桃を盗み、次に酒を盗んで蟠桃大会を荒らし、さらに老君の仙丹（せんたん・推定。仙人が練り上げる薬。ここでは太上老君の金丹）まで盗んだ。そのうえ、御酒（ぎょしゅ・推定。君主の酒を敬っていう語）をここまで盗んで来て楽しんでいる。罪に罪を重ねていることが、分からないのか？」
    斉天大聖は笑った。
    斉天大聖「その話は、本当だ、本当だ。それで、お前たちはどうするつもりだ？」
    九曜星官「我々は玉帝の勅命を受け、兵を率いてお前を降伏させに来た。早く服従せよ。そうすれば、この者たちは命を差し出さずに済む。さもなくば、この山を踏み平らにし、この洞窟をひっくり返してやる」
    斉天大聖は激怒した。
    斉天大聖「お前たちみたいな下っ端の神に、どれほどの法力（ほうりき・推定。仏法や修行から得るとされる不思議な力）があるというんだ。よくも大口をたたいたな。逃げるな、俺の棒を食らえ！」
    九曜星官は一斉に躍りかかったが、斉天大聖は少しも恐れず、如意金箍棒を振るい、左を防ぎ、右を払った。九曜星官は戦ううちに疲れ果て、手足から力が抜け、一人一人が武器を引きずって逃げ出した。急いで中軍の陣幕へ入り、李天王に報告した。
    九曜星官「あの猿は、まことに勇猛です。我々では敵わず、敗れて戻りました」
  "translation_status": "reviewed"
- "id": "xy-ch05-033"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "李天王即調四大天王與二十八宿，一路出師來鬥。大聖也公然不懼，調出獨角鬼王、七十二洞妖王與四個健將，就於洞門外列成陣勢。你看這場混戰，好驚人也："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 32
  "translation_ja": "李天王はすぐに四大天王と二十八宿を動かし、一隊となって戦いに向かわせた。斉天大聖もまったく恐れず、独角鬼王、七十二洞の妖王、四健将を呼び出し、洞窟の門の外に陣を構えた。この混戦は、見よ、なんと恐ろしいことか。"
  "translation_status": "reviewed"
- "id": "xy-ch05-034"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": "寒風颯颯，怪霧陰陰。那壁廂旌旗飛彩，這壁廂戈戟生輝。滾滾盔明，層層甲亮。滾滾盔明映太陽，如撞天的銀磬；層層甲亮砌岩崖，似壓地的冰山。大桿刀，飛雲掣電；楮白槍，度霧穿雲。方天戟，虎眼鞭，麻林擺列；青銅劍，四明鏟，密樹排陣。彎弓硬弩雕翎箭，短棍蛇矛挾了魂。大聖一條如意棒，翻來覆去戰天神。殺得那空中無鳥過，山內虎狼奔；揚砂走石乾坤黑，播土飛塵宇宙昏。只聽兵兵撲撲驚天地，煞煞威威振鬼神。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 33
  "translation_ja": |-
    冷たい風がざわざわ吹き、怪しい霧が暗く立ちこめる。
    あちらには色鮮やかな旗が飛び、こちらには戈や戟が輝く。
    数知れぬ兜が光り、幾重もの鎧がきらめく。
    兜は日に映えて、天を打つ銀の磬（けい。吊るした石や金属を打ち鳴らす楽器）のよう。鎧は岩崖に積み重なり、大地を押しつぶす氷山のよう。
    長柄の大刀（だいとう。大きな刀）は雲を飛び、稲妻のようにひらめき、楮白槍（ちょはくそう・推定。槍の一種。具体的な形は未確定）は霧を渡って雲を貫く。
    方天戟（ほうてんげき・推定。左右に刃の付いた長柄の戟）と虎眼鞭（こがんべん・推定。棒状の打撃武器の名。細かな形は未確定）は麻の林のように並び、青銅剣（せいどうけん・推定。青銅で作られた剣）と四明鏟（しめいさん・推定。鏟という長柄の武器の一種。具体的な形は未確定）は密林のように陣を組む。
    曲がった弓、強い弩（ど。台と引き金の仕組みを備えた弓）、鷲の羽の矢、短い棍棒、蛇のような矛（ほこ。長い柄の先に刃を付けた武器）が、魂を奪う。
    大聖は如意の棒（にょいのぼう・推定。如意金箍棒を短く説明した呼び名）一本、返しては振り、天神たちと戦う。
    戦いのため、空には鳥も飛ばず、山では虎や狼が逃げ惑う。
    砂が舞い、石が飛んで天地は黒くなり、土と塵が巻き上がって世界を暗くする。
    ただ、打ち合う響きが天地を驚かせ、すさまじい威勢が鬼神（きしん・推定。人知を超える霊や神々）を震わせる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "楮白槍・四明鏟・虎眼鞭は原名を保持。名称の細かな由来・形状を未確認のまま別の武器に置き換えていない。"
- "id": "xy-ch05-035"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一場自辰時佈陣，混殺到日落西山。那獨角鬼王與七十二洞妖怪，盡被眾天神捉拿去了。止走了四健將與那群猴，深藏在水簾洞底。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 34
  "translation_ja": "この戦いは辰（たつ・推定。十二支の一つ。ここでは時刻や天地の時代区分にも用いる）の刻（こく・推定。ここでは、一日を十二支で区切った時刻）に陣を敷いて始まり、日が西の山へ落ちるまで続いた。独角鬼王と七十二洞の妖怪は、すべて天神たちに捕らえられてしまった。四健将と猿たちだけが逃れ、水簾洞（すいれんどう。滝の裏に隠れた、猿たちの住まいとなる洞窟）の奥深くに隠れた。"
  "translation_status": "reviewed"
- "id": "xy-ch05-036"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖一條棒，抵住了四大天神與李托塔、哪吒太子，俱在半空中，殺勾多時，大聖見天色將晚，即拔毫毛一把，丟在口中，嚼碎了，噴將出去，叫聲：「變！」就變了千百個大聖，都使的是金箍棒，打退了哪吒太子，戰敗了五個天王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 35
  "translation_ja": |-
    斉天大聖は棒一本で四大天王、李天王、哪吒を食い止め、皆と空中で長いこと戦っていた。日が暮れかけたのを見ると、毛を一つかみ抜き、口でかみ砕いて吹き出し、叫んだ。
    斉天大聖「変われ！」
    たちまち幾百、幾千もの斉天大聖が現れ、どれも如意金箍棒を振るって、哪吒を打ち退け、五人の天王を敗走させた。
  "translation_status": "reviewed"
- "id": "xy-ch05-037"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖得勝，收了毫毛，急轉身回洞，早又見鐵板橋頭，四個健將領眾叩迎，那大眾，哽哽咽咽大哭三聲，又唏唏哈哈大笑三聲。大聖道：「汝等見了我，又哭又笑，何也？」四健將道：「今早帥眾將與天王交戰，把七十二洞妖王與獨角鬼王盡被眾神捉了，我等逃生，故此該哭。這見大聖得勝回來，未曾傷損，故此該笑。」大聖道：「勝負乃兵家之常。古人云：『殺人一萬，自損三千。』況捉了去的頭目乃是虎豹狼蟲、獾獐狐狢之類，我同類者未傷一個，何須煩惱？他雖被我使個分身法殺退，他還要安營在我山腳下。我等且緊緊防守，飽食一頓，安心睡覺，養養精神。天明看我使個大神通，拿這些天將，與眾報仇。」四將與眾猴將椰酒吃了幾碗，安心睡覺不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 36
  "translation_ja": |-
    斉天大聖は勝利を収め、毛を元へ戻すと、急いで洞窟へ帰った。すると、鉄の板の橋のたもとで、四健将が皆を率い、頭を下げて迎えていた。一同は、すすり泣きながら三度大きく泣き、そのあと声を上げて三度笑った。
    斉天大聖「俺を見て、泣いたり笑ったりするのは、どういうわけだ？」
    四健将「今朝、皆を率いて天王たちと戦ったところ、七十二洞の妖王と独角鬼王は、すべて神々に捕らえられてしまいました。私たちだけが命からがら逃げたので、泣いたのでございます。今、大聖が勝って、傷もなく戻られたのを見たので、笑ったのでございます」
    斉天大聖「勝ち負けは、戦では常のことだ。昔の人も『敵を一万殺せば、味方も三千失う』と言っている。そのうえ、捕まった頭領は、虎や豹、狼やほかの獣、穴熊、ノロジカ、狐、狢（むじな・推定。アナグマやタヌキに似た獣を指す古い呼び名）のたぐいだ。俺と同じ猿の仲間は、一匹も傷ついていない。何を悩むことがある？　奴らは俺の分身の術で退いたが、まだ山の麓に陣を張るだろう。こちらは厳重に守りを固め、腹いっぱい食べて、安心して眠り、力を養おう。夜が明けたら、俺が大きな神通力を使って天将（てんしょう・推定。天界の軍を率いる将軍）どもを捕まえ、皆の仇を討つところを見せてやる」
    四健将と猿たちは椰子酒を数杯飲み、安心して眠った。この話はひとまずおく。
  "translation_status": "reviewed"
- "id": "xy-ch05-038"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那四大天王收兵罷戰，眾各報功：有拿住虎豹的，有拿住獅象的，有拿住狼蟲狐狢的。更不曾捉著一個猴精。當時果又安轅營，下大寨，賞\U000246EE了得功之將，吩咐了天羅地網之兵，各各提鈴喝號，圍困了花果山，專待明早大戰。各人得令，一處處謹守。此正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 37
  "translation_ja": "四大天王は兵を収めて戦いを終え、各隊が戦果を報告した。虎や豹を捕らえた者、獅子や象を捕らえた者、狼やほかの獣、狐や狢を捕らえた者がいた。だが、猿の妖怪は一匹も捕まえていなかった。果たして再び指揮の陣営を置き、大きな陣を敷くと、手柄を立てた将をねぎらい、天羅地網の兵に命じ、それぞれ鈴を鳴らして声を掛け合いながら花果山を囲み、翌朝の大戦を待たせた。皆は命令を受け、各所を厳重に守った。まさしく、こういうことだ。"
  "translation_status": "reviewed"
- "id": "xy-ch05-039"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": "妖猴作亂驚天地，佈網張羅晝夜看。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 38
  "translation_ja": "妖猿の乱が天地を驚かせ、網を張り巡らして昼も夜も見張り続ける。"
  "translation_status": "reviewed"
- "id": "xy-ch05-040"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟天曉後如何處治，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

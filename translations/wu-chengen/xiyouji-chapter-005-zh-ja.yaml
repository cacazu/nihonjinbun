  "translation_ja": |-
    第五回
    蟠桃の宴を乱して大聖は金丹を盗み、天宮に背いた妖怪を神々が捕らえに向かう
  "translation_status": "reviewed"
- "id": "xy-ch05-002"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表齊天大聖到底是個妖猴，更不知官銜品從，也不較俸祿高低，但只註名便了。那齊天府下二司仙吏，早晚伏侍，只知日食三餐，夜眠一榻，無事牽縈，自由自在。閑時節會友遊宮，交朋結義。見三清稱個「老」字，逢四帝道個「陛下」。與那九曜星、五方將、二十八宿、四大天王、十二元辰、五方五老、普天星相、河漢群神，俱只以弟兄相待，彼此稱呼。今日東遊，明日西蕩，雲去雲來，行蹤不定。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 1
  "translation_ja": "さて、斉天大聖（せいてんたいせい。孫悟空が名乗る、天と並ぶ偉大な聖者という称号）は、結局のところ妖怪の猿である。官職の位階（いかい・推定。官職などの身分の等級）など知らず、俸禄（ほうろく・推定。役人に支給する報酬）の高い低いも気にしない。ただ名が登録されれば、それでよかった。斉天大聖府（せいてんたいせいふ・推定。天界に設けられた孫悟空の屋敷）の二つの役所の仙吏（せんり・推定。仙界の役人）が朝夕仕え、毎日三度の食事を取り、夜は一つの寝台で眠る。気にかかることもなく、自由気ままだった。暇な折には宮々を巡って友に会い、仲間と交わり、義兄弟の契りを結んだ。三清（さんせい。道教で最高位とされる三柱の神）に会えば「ご老体」、四帝（してい・推定。道教の四柱の天帝をまとめた呼び名）に会えば「陛下」と呼ぶ。九曜星（くようせい・推定。九つの星を神とした一群）、五方の将（ごほうのしょう・推定。東西南北と中央を守る天界の将たち）、二十八宿（にじゅうはっしゅく。天を二十八に分けた星座群。ここではその星々の神）、四大天王（しだいてんのう。四方を守る四柱の天界の王）、十二元辰（じゅうにげんしん・推定。十二支に対応する十二柱の神）、五方五老（ごほうごろう・推定。東西南北と中央を代表する尊い神々）、天じゅうの星の神々、天の川（あまのがわ。夜空を帯状に渡る星の集まり。物語では天上の川）の神々とは、みな兄弟同然に付き合い、互いにそう呼び合った。今日は東、明日は西へと遊び歩き、雲で行き来して、居場所は定まらなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch05-003"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，玉帝早朝，班部中閃出許旌陽真人，頫顖啟奏道：「今有齊天大聖無事閑遊，結交天上眾星宿，不論高低，俱稱朋友，恐後閑中生事。不若與他一件事管，庶免別生事端。」玉帝聞言，即時宣詔。那猴王欣欣然而至，道：「陛下，詔老孫有何陞賞？」玉帝道：「朕見你身閑無事，與你件執事：你且權管那蟠桃園，早晚好生在意。」大聖歡喜謝恩，朝上唱喏而退。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 2
  "translation_ja": |-
    ある日の朝、玉帝（ぎょくてい・推定。天上の神々を治める帝王）が朝議（ちょうぎ・推定。君主のもとで臣下たちが行う会議）を開くと、列の中から許旌陽真人（きょせいようしんじん・推定。斉天大聖に仕事を与えるよう玉帝へ進言する仙人）が進み出て、頭を下げて申し上げた。
    許旌陽真人「今、斉天大聖は何の仕事もなく遊び歩き、天上の星々の神と交わって、位の高低に関わらず皆を友と呼んでおります。このままでは、暇に任せて騒ぎを起こす恐れがございます。何か一つ管理する仕事をお与えになれば、余計な問題を起こさずに済むかと存じます」
    玉帝はこれを聞くと、すぐに召し出した。斉天大聖は喜び勇んでやって来た。
    斉天大聖「陛下、私をお呼びとは、何か昇進やご褒美でしょうか？」
    玉帝「朕が見るに、そなたには仕事がなく、暇を持て余しているようだ。そこで一つ役目を与える。ひとまず蟠桃園（ばんとうえん。天界にある仙桃の園）を管理し、朝夕よく心を配るがよい」
    斉天大聖は喜んで恩に感謝し、玉帝に向かって声を上げ、両手を組んで礼をすると退出した。
  "translation_status": "reviewed"
- "id": "xy-ch05-004"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他等不得窮忙，即入蟠桃園內查勘。本園中有個土地攔住問道：「大聖何往？」大聖道：「吾奉玉帝點差，代管蟠桃園，今來查勘也。」那土地連忙施禮，即呼那一班鋤樹力士、運水力士、修桃力士、打掃力士都來見大聖磕頭，引他進去。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 3
  "translation_ja": |-
    斉天大聖はせわしく待ちきれない様子で、すぐに蟠桃園へ入り、見回ろうとした。園の土地神（とちがみ・推定。その土地を守る神。ここでは蟠桃園の守り神）が行く手を止めて尋ねた。
    土地神「大聖（たいせい・推定。孫悟空の称号、斉天大聖の略）、どちらへおいでですか？」
    斉天大聖「玉帝のお言いつけで、この蟠桃園を預かることになった。今日は見回りに来たんだ」
    土地神は急いで礼をし、木の根元を耕す力士（りきし・推定。天界で庭の手入れなどの力仕事を担う者）、水を運ぶ力士、桃の木を手入れする力士、掃除の力士を呼び集めた。皆は斉天大聖に額を地につけて挨拶し、園内へ案内した。見ると、こんな眺めだった。
  "translation_status": "reviewed"
- "id": "xy-ch05-005"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": "夭夭灼灼，顆顆株株。夭夭灼灼花盈樹，顆顆株株果壓枝。果壓枝頭垂錦彈；花盈樹上簇胭脂。時開時結千年熟，無夏無冬萬載遲。先熟的，酡顏醉臉；還生的，帶蒂青皮。凝煙肌帶綠，映日顯丹姿。樹下奇葩並異卉，四時不謝色齊齊；左右樓臺並館舍，盈空常見罩雲霓。不是玄都凡俗種，瑤池王母自栽培。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 4
  "translation_ja": |-
    みずみずしく、鮮やかに、実は一つ一つ、木は一本一本。
    鮮やかな花が木を埋め、鈴なりの実が枝をたわませる。
    枝先に重なる果実は錦の玉のように垂れ、木を満たす花は紅のかたまり。
    折にふれて花咲き実を結び、熟すには千年、夏も冬もなく、万年もの時をゆっくりと待つ。
    早く熟した実は、酒に酔った顔のように赤く、まだ若い実は、へたをつけて皮も青い。
    霞をまとった肌には緑が差し、日に映れば赤い姿を見せる。
    木の下には珍しい花や草が並び、四季を通してしおれず、色をそろえている。
    左右には楼台（ろうだい。高く造った建物や見晴らし台）や館が建ち、空いっぱいの雲や虹がいつもそれを覆う。
    玄都（げんと・推定。桃の名所として対比される地。具体的な所在地は本文だけでは確定しない）にあるありふれた桃とは違う。瑤池（ようち。王母が住み、神々の宴を開く天界の場所）の王母（おうぼ・推定。長寿の桃を育て、神々の宴を主催する女神）が、自ら育てた木なのだ。
  "translation_status": "reviewed"
- "id": "xy-ch05-006"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖看玩多時，問土地道：「此樹有多少株數？」土地道：「有三千六百株：前面一千二百株，花微果小，三千年一熟，人吃了成仙了道，體健身輕；中間一千二百株，層花甘實，六千年一熟，人吃了霞舉飛昇，長生不老；後面一千二百株，紫紋緗核，九千年一熟，人吃了與天地齊壽，日月同庚。」大聖聞言，歡喜無任。當日查明了株樹，點看了亭閣，回府。自此後，三五日一次賞玩，也不交友，也不他遊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 5
  "translation_ja": |-
    斉天大聖はしばらく眺めてから、土地神に尋ねた。
    斉天大聖「この木は全部で何本ある？」
    土地神「三千六百本ございます。手前の千二百本は、花も実も小さく、三千年に一度熟します。人が食べれば仙人（せんにん・推定。修行によって不老長寿や不思議な力を得たとされる人）となって道を得、体は健やかに、身は軽くなります。真ん中の千二百本は、花が幾重にも咲き、実は甘く、六千年に一度熟します。食べれば霞に乗って天へ昇り、不老長生（ふろうちょうせい・推定。老いることなく長く生きること）となります。奥の千二百本は、紫の筋があり、種は淡い黄色で、九千年に一度熟します。食べれば天地と寿命を等しくし、日月と同じ年月を生きるのでございます」
    斉天大聖はこれを聞いて、このうえなく喜んだ。その日は木々の様子を確かめ、亭（てい・推定。休憩や眺望のために建てる小さな建物）や楼閣（ろうかく・推定。階を重ねて高く造った建物）を見回ってから斉天大聖府へ帰った。それからは三日か五日に一度、園へ眺めに来るようになり、友にも会わず、ほかへ遊びにも行かなくなった。
  "translation_status": "reviewed"
- "id": "xy-ch05-007"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，見那老樹枝頭，桃熟大半。他心裡要吃個嘗新，奈何本園土地、力士並齊天府仙吏緊隨不便。忽設一計道：「汝等且出門外伺候，讓我在這亭上少憩片時。」那眾仙果退。只見那猴王脫了冠服，爬上大樹，揀那熟透的大桃，摘了許多，就在樹枝上自在受用。吃了一飽，卻才跳下樹來，簪冠著服，喚眾等儀從回府。遲三二日，又去設法偷桃，儘他享用。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 6
  "translation_ja": |-
    ある日、古い木の枝を見ると、桃の大半が熟していた。初物を一つ食べてみたくなったが、土地神や力士、それに斉天大聖府の仙吏がぴったり付き添っているので、都合が悪い。そこで、ふと一計を案じた。
    斉天大聖「お前たちは門の外で待っていろ。俺はこの亭で、少し休む」
    仙人たちは、言われたとおりに引き下がった。斉天大聖は冠も衣も脱ぎ、大きな木へ登ると、十分に熟した大桃を選んでいくつも摘み、枝の上で気兼ねなく食べた。腹いっぱいになると、ようやく木から飛び降り、冠を留め、衣を着て、供の者を呼び、斉天大聖府へ帰った。それから二、三日すると、また工夫して桃を盗み、好きなだけ食べた。
  "translation_status": "reviewed"
- "id": "xy-ch05-008"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一朝，王母娘娘設宴，大開寶閣，瑤池中做蟠桃勝會。即著那紅衣仙女、青衣仙女、素衣仙女、皂衣仙女、紫衣仙女、黃衣仙女、綠衣仙女各頂花籃，去蟠桃園摘桃建會。七衣仙女直至園門首，只見蟠桃園土地、力士同齊天府二司仙吏，都在那裡把門。仙女近前道：「我等奉王母懿旨，到此摘桃設宴。」土地道：「仙娥且住。今歲不比往年了，玉帝點差齊天大聖在此督理，須是報大聖得知，方敢開園。」仙女道：「大聖何在？」土地道：「大聖在園內，因困倦，自家在亭子上睡哩。」仙女道：「既如此，尋他去來，不可遲誤。」土地即與同進。尋至花亭不見，只有衣冠在亭，不知何往，四下裡都沒尋處。原來大聖耍了一會，吃了幾個桃子，變做二寸長的個人兒，在那大樹梢頭濃葉之下睡著了。七衣仙女道：「我等奉旨前來，尋不見大聖，怎敢空回？」傍有仙使道：「仙娥既奉旨來，不必遲疑。我大聖閑遊慣了，想是出園會友去了。汝等且去摘桃，我們替你回話便是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 7
  "translation_ja": |-
    ある朝、王母は宴を催すことにし、宝閣（ほうかく・推定。美しく飾られた立派な建物）を大きく開いて、瑤池で蟠桃（ばんとう。食べると長寿を得るという王母の桃）の盛大な会を開こうとした。赤い衣、青い衣、白い衣、黒い衣、紫の衣、黄色い衣、緑の衣の七人の仙女（せんにょ・推定。女性の仙人）に、それぞれ花籠を頭に載せさせ、宴に出す桃を摘みに蟠桃園へ遣わした。七衣仙女（しちいせんにょ・推定。七色の衣を着て王母に仕える七人の仙女）が園の門へ着くと、土地神と力士、斉天大聖府の二司（にし・推定。安静司と寧神司という二つの役所）の仙吏が、そろって門を守っていた。仙女たちは進み出た。
    七衣仙女「王母さまのお言いつけで、宴に出す桃を摘みに参りました」
    土地神「仙女の皆さま、お待ちください。今年はこれまでとは違います。玉帝が斉天大聖を管理役にお命じになったので、大聖へお知らせしてからでなければ、園をお開けできません」
    七衣仙女「大聖はどちらに？」
    土地神「園の中においでです。お疲れになり、亭でお休みになっております」
    七衣仙女「それなら、会いに行きましょう。遅れるわけにはまいりません」
    土地神は皆と一緒に入った。花の亭まで探しに行っても姿はなく、衣と冠が置いてあるだけで、どこへ行ったのか分からない。あたりを見回しても見当たらなかった。実は斉天大聖は、しばらく遊んで桃をいくつか食べたあと、身の丈二寸（すん・推定。昔の長さの単位。一尺の十分の一）の小さな人に変わり、大木の梢の茂った葉の下で眠っていたのである。
    七衣仙女「ご命令で来たのに、大聖が見つからないからといって、手ぶらでは帰れません」
    そばにいた仙使（せんし・推定。仙人の世界の使者。ここでは園の仙女たちを案内する者）が言った。
    仙使「ご命令でおいでなら、おためらいには及びません。大聖は遊び歩くのがお好きですから、園を出てお友達に会いに行かれたのでしょう。どうぞ桃をお摘みください。大聖へのご報告は、私たちがいたします」
  "translation_status": "reviewed"
- "id": "xy-ch05-009"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那仙女依言，入樹林之下摘桃：先在前樹摘了二籃，又在中樹摘了三籃，到後樹上摘取，只見那樹上花果稀疏，止有幾個毛蒂青皮的。原來熟的都是猴王吃了。七仙女張望東西，只見向南枝上止有一個半紅半白的桃子。青衣女用手扯下枝來，紅衣女摘了，卻將枝子望上一放。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 8
  "translation_ja": "仙女たちはその言葉に従って、木立へ入り、桃を摘んだ。まず手前の木で二籠、次に真ん中の木で三籠を満たし、奥の木へ移った。ところが、花も実もまばらで、へたに産毛をつけた青い実が、いくつかあるだけだった。熟した桃は、斉天大聖がすっかり食べてしまっていたのである。七衣仙女があちこち見渡すと、南へ伸びた枝に、半分赤く半分白い桃が一つだけ見えた。青い衣の仙女が手で枝を引き下ろし、赤い衣の仙女が桃を摘むと、枝を上へ放した。"
  "translation_status": "reviewed"
- "id": "xy-ch05-010"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那大聖變化了，正睡在此枝，被他驚醒。大聖即現本相，耳朵內掣出金箍棒，幌一幌，碗來粗細，咄的一聲道：「你是那方怪物，敢大膽偷摘我桃。」慌得那七仙女一齊跪下道：「大聖息怒。我等不是妖怪，乃王母娘娘差來的七衣仙女，摘取仙桃，大開寶閣，做蟠桃勝會。適至此間，先見了本園土地等神，尋大聖不見。我等恐遲了王母懿旨，是以等不得大聖，故先在此摘桃。萬望恕罪。」大聖聞言，回嗔作喜道：「仙娥請起。王母開閣設宴，請的是誰？」仙女道：「上會自有舊規，請的是西天佛老、菩薩、聖僧、羅漢，南方南極觀音，東方崇恩聖帝、十洲三島仙翁，北方北極玄靈，中央黃極黃角大仙，這個是五方五老。還有五斗星君，上八洞三清、四帝、太乙天仙等眾，中八洞玉皇、九壘、海嶽神仙，下八洞幽冥教主、注世地仙，各宮各殿大小尊神，俱一齊赴蟠桃嘉會。」大聖笑道：「可請我麼？」仙女道：「不曾聽得說。」大聖道：「我乃齊天大聖，就請我老孫做個席尊，有何不可？」仙女道：「此是上會舊規，今會不知如何。」大聖道：「此言也是，難怪汝等。你且立下，待老孫先去打聽個消息，看可請老孫不請。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 9
  "translation_ja": |-
    変身した斉天大聖は、ちょうどその枝で眠っていたので、これに驚いて目を覚ました。すぐ元の姿に戻り、耳から如意金箍棒（にょいきんこぼう。思いどおりに大きさを変える、金のたがの付いた鉄棒）を引き抜いて一振りし、椀ほどの太さにすると、かっと声を上げた。
    斉天大聖「どこの化け物だ！　よくも大胆に、俺の桃を盗み取ったな」
    七衣仙女は慌てて、そろってひざまずいた。
    七衣仙女「大聖、どうかお怒りをお鎮めください。私たちは妖怪ではなく、王母さまのお使いの七衣仙女でございます。宝閣を開いて蟠桃の宴をなさるので、仙桃（せんとう・推定。仙人の世界の桃。ここでは蟠桃を指す）を摘みに参りました。先ほど着いて、まず土地神さまたちにお会いし、大聖をお探ししたのですが、見つかりませんでした。王母さまのご命令に遅れてはいけないと思い、お戻りを待ちきれず、先に桃を摘んでおりました。どうかお許しください」
    斉天大聖はこれを聞くと、怒りを収めて機嫌を直した。
    斉天大聖「仙女たち、立ってくれ。王母さまの宴には、誰が招かれているんだ？」
    七衣仙女「宴に出席する方々には、昔からの決まりがございます。西天（さいてん・推定。西方にある仏たちの世界）の仏老（ぶつろう・推定。西天の尊い仏を敬っていう呼び名）、菩薩（ぼさつ。悟りを求めながら、人々を救おうとする仏教の尊い存在）、聖僧（しょうそう。聖者として敬われる徳の高い僧）、羅漢（らかん・推定。仏教で悟りを得た修行者）、南方の南極観音（なんきょくかんのん・推定。この回で五方五老の南方に挙げられる観音の呼び名）、東方の崇恩聖帝（すうおんせいてい・推定。この回で五方五老の東方に挙げられる神）と十洲三島（じっしゅうさんとう・推定。仙人が住むとされる海上の島々）の仙翁（せんおう・推定。年老いた仙人を敬う呼び名）、北方の北極玄霊（ほっきょくげんれい・推定。この回で五方五老の北方に挙げられる神）、中央の黄極黄角大仙（こうきょくこうかくだいせん・推定。この回で五方五老の中央に挙げられる仙人）。これが五方五老でございます。そのほか五斗星君（ごとせいくん・推定。五方の星をつかさどる神々）、上八洞（じょうはちどう・推定。この回で三清・四帝・太乙天仙をまとめて呼ぶ一群）の三清、四帝、太乙天仙（たいいつてんせん・推定。天界の高位の仙人たちの呼び名）などの方々、中八洞（ちゅうはちどう・推定。この回で玉皇・九塁・海や山の神仙をまとめて呼ぶ一群）の玉皇（ぎょくこう・推定。天上の神々を統べる帝王。玉皇大天尊はその尊称。）、九塁（きゅうるい・推定。この回で中八洞に含めて挙げられる神々の名。内訳は未確定）、海や山の神仙（しんせん・推定。神々や仙人）、下八洞（げはちどう・推定。この回で幽冥教主や地仙をまとめて呼ぶ一群）の幽冥教主（ゆうめいきょうしゅ・推定。死者の世界をつかさどる尊い存在の称号）、世をつかさどる地仙（ちせん・推定。地上の仙境に住む仙人）、それに各宮各殿の大小の尊い神々が、皆そろって蟠桃の宴へおいでになります」
    斉天大聖は笑った。
    斉天大聖「俺も呼ばれているか？」
    七衣仙女「そのようなお話は、伺っておりません」
    斉天大聖「俺は斉天大聖だぞ。この俺を主賓に招いたって、何の不都合がある？」
    七衣仙女「申し上げたのは、以前からの決まりでございます。今回のことは、私たちには分かりません」
    斉天大聖「それもそうだ。お前たちを責めても仕方がない。ここで待っていろ。まず俺が、自分も呼ばれているかどうか、聞きに行ってくる」
  "translation_status": "reviewed"
  "issues":

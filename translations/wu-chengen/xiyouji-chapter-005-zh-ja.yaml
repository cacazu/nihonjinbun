    "status": "open"
    "message_ja": "五方五老と八洞等の列挙は、この版の呼称と配列を保持した。九塁の具体的内訳や注世地仙の神格上の分類は未確定。"
- "id": "xy-ch05-011"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，捻著訣，念聲咒語，對眾仙女道：「住！住！住！」這原來是個定身法，把那七衣仙女，一個個睖睖睜睜，白著眼，都站在桃樹之下。大聖縱朵祥雲，跳出園內，竟奔瑤池路上而去。正行時，只見那壁廂："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 10
  "translation_ja": |-
    さて斉天大聖、指で印（いん・推定。術や祈りのため指で結ぶ決まった形）を結び、呪文（じゅもん。術の効き目を生じさせるために唱える言葉）を唱えると、仙女たちへ言い放った。
    斉天大聖「止まれ！　止まれ！　止まれ！」
    これは身を動かなくする定身法（ていしんほう・推定。相手の体を動かなくする術）である。七衣仙女は一人残らず目を見開き、白目をむいたまま、桃の木の下に立ち尽くした。斉天大聖はめでたい雲を起こして園から飛び出し、瑤池へ向かう道をまっすぐ進んだ。すると、向こうにこんな姿が見えた。
  "translation_status": "reviewed"
- "id": "xy-ch05-012"
  "section_id": "chapter-05"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一天瑞靄光搖曳，五色祥雲飛不絕。
    白鶴聲鳴振九皋，紫芝色秀分千葉。
    中間現出一尊仙，相貌天然丰采別。
    神舞虹霓幌漢霄，腰懸寶籙無生滅。
    名稱赤腳大羅仙，特赴蟠桃添壽節。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 11
  "translation_ja": |-
    空いっぱいの瑞雲（ずいうん・推定。めでたい兆しとされる美しい雲）に光が揺れ、五色のめでたい雲が絶えず流れる。
    白鶴の鳴き声は奥深い沢まで響き、紫の霊芝（れいし。長寿の薬として尊ばれたキノコの仲間）は美しい色で幾重にも葉を分ける。
    その中に一人の仙人が現れ、生まれつきの姿は、ひときわ優れている。
    神々しい姿は虹と舞い、天の川の空にきらめき、腰には生滅（しょうめつ・推定。生まれることと消え去ること）を離れる宝の符籍（ふせき。ここでは神聖な力を記した札や文書）を下げる。
    名を赤脚大羅仙（せききゃくだいらせん・推定。蟠桃の宴へ向かう、はだしの仙人。赤脚大仙と同一人物）といい、寿命を延ばす蟠桃の祝いに、わざわざ赴くところだった。
  "translation_status": "reviewed"
- "id": "xy-ch05-013"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那赤腳大仙覿面撞見大聖，大聖低頭定計，賺哄真仙，他要暗去赴會，卻問：「老道何往？」大仙道：「蒙王母見招，去赴蟠桃嘉會。」大聖道：「老道不知。玉帝因老孫觔斗雲疾，著老孫五路邀請列位，先至通明殿下演禮，後方去赴宴。」大仙是個光明正大之人，就以他的誑語作真，道：「常年就在瑤池演禮謝恩，如何先去通明殿演禮，方去瑤池赴會？」無奈，只得撥轉祥雲，徑往通明殿去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch5-1455554"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第005回&oldid=1455554"
    "source_sequence": 12
  "translation_ja": |-
    赤脚大仙（せききゃくだいせん・推定。斉天大聖の偽の勅命にだまされる、はだしの仙人）は、斉天大聖とばったり出会った。斉天大聖は頭を伏せて策を練った。この真の仙人をだまし、自分だけでこっそり宴へ行こうというのである。
    斉天大聖「ご老体、どちらへ？」
    赤脚大仙「王母さまのお招きを受けて、蟠桃の宴へ参ります」
    斉天大聖「まだご存じなかったか。玉帝は俺の筋斗雲（きんとうん・推定。宙返り一つで十万八千里を進む仙術の雲）が速いので、五つの方角を回って皆さんをお呼びするよう命じられたんだ。まず通明殿（つうめいでん・推定。天界で来訪者が召されるのを待つ宮殿）で礼を行い、それから宴へ行くことになっている」
    赤脚大仙は公明正大な人なので、そのでたらめを本当だと思った。
    赤脚大仙「例年は瑤池で礼を行い、恩に感謝するのですが。どうして、先に通明殿で礼をしてから、瑤池の宴へ行くのでしょう？」
    それでも仕方なく雲の向きを変え、まっすぐ通明殿へ向かった。
  "translation_status": "reviewed"
- "id": "xy-ch05-014"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖駕著雲，念聲咒語，搖身一變，就變做赤腳大仙模樣，前奔瑤池。不多時，直至寶閣，按住雲頭，輕輕移步，走入裡面。只見那裡："

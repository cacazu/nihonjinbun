  "translation_ja": |-
    悟空は手を伸ばし、尾の毛を一本抜いて、指先でひねった。悟空「変われ！」
    たちまち毛は長さ一尺七寸もある、大きな紫金紅葫蘆になった。悟空はそれを腰から取り出した。悟空「俺の瓢箪を見たいか。」
    伶俐虫は手に取って眺めた。伶俐虫「お師匠さま、この瓢箪は大きくて、形も立派で、見栄えはよいのですが、役には立ちませんね。」
    悟空「なぜ役に立たぬ。」
    伶俐虫「私たちの二つの宝は、一つ一つに千人も入るのです。」
    悟空「人を入れるだけの物など、何が珍しい。俺の瓢箪には、天まで入るのだぞ。」
    伶俐虫「天を入れられるのですか。」
    悟空「本当に、天を収められる。」
    伶俐虫「どうも嘘のようです。実際に入れて見せてくだされば信じますが、そうでなければ、決して信じられません。」
    悟空「天が俺を怒らせれば、ひと月に七、八度は収めてやる。怒らせなければ、半年に一度も収めはしない。」
    伶俐虫「兄貴、天を収める宝だぞ。交換してもらおう。」
    精細鬼「向こうは天を入れるのに、こちらの人しか入らない物と、交換してくれるものか。」
    伶俐虫「駄目だというなら、この浄瓶（じょうへい）も付ければいい。」
    悟空は内心喜んだ。悟空「瓢箪と瓢箪を取り替え、さらに浄瓶まで付く。一つを二つと交換とは、まったく割のいい話だ。」
    悟空は進み寄り、伶俐虫をつかまえた。悟空「天を収められたら、交換するか。」
    伶俐虫「天が入るなら交換します。しなければ、私はあなたの息子です。」
    悟空「よし、よし。それでは、収めて見せてやろう。」

    "message_ja": "「外好裡枒槎」は他人にはよくし、身内には手厳しい意。漢典「外」（https://zdic.net/hans/外）の当該用例の説明と照合し、悟空の不満の発話として訳した。三蔵の性格についての客観的断定にはしない。"
- "id": "xy-ch33-012"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行不上三五里路，師父與沙僧下了山凹之中，行者卻望不見，心中埋怨道：「師父偌大年紀，再不曉得事體。這等遠路，就是空身子也還嫌手重，恨不得捽了，卻又教我馱著這個妖怪。莫說他是妖怪，就是好人，這們年紀，也死得著了。摜殺他罷，馱他怎的？」這大聖正算計要摜，原來那怪就知道了，且會遣山。就使一個「移山倒海」的法術，就在行者背上捻訣，念動真言，把一座須彌山遣在空中，劈頭來壓行者。這大聖慌得把頭偏一偏，壓在左肩臂上，笑道：「我的兒，你使甚麼重身法來壓老孫哩？這個倒也不怕，只是正擔好挑，偏擔兒難挨。」那魔道：「一座山壓他不住。」卻又念咒語，把一座峨嵋山遣在空中來壓。行者又把頭偏一偏，壓在右肩臂上。看他挑著兩座大山，飛星來趕師父。那魔頭看見，就嚇得渾身是汗，遍體生津道：「他卻會擔山。」又整性情，把真言念動，將一座泰山遣在空中，劈頭壓住行者。那大聖力軟觔麻，遭逢他這泰山下頂之法，只壓得三尸神咋，七竅噴紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    三、五里も行かぬうちに、三蔵と沙悟浄は山あいへ下り、悟空から姿が見えなくなった。悟空は心の中で不満をこぼした。悟空「お師匠さまも、いい年をしているのに、まるで物の道理が分からない。こんな遠い旅では、手ぶらで歩いていてさえ、手の重みが邪魔で振り捨てたいくらいなのに、この妖怪まで背負わせるとは。妖怪なら言うまでもない。たとえ善人でも、この年なら、もう死んだっておかしくないだろう。叩きつけて殺してしまえ。何だって背負ってやるんだ。」
    悟空が投げつけようと考えていると、銀角大王はその心を察した。しかも、この妖怪は山を移すことができる。そこで「山を移し、海を覆す」法術を使い、悟空の背中で印を結び、真言を唱えた。須弥山（しゅみせん）を空中へ呼び寄せ、悟空の頭めがけて押し下したのである。悟空は慌てて首を横へよけ、左の肩で山を受け止めた。そして笑った。悟空「小僧、どんな術で体を重くして、俺を押し潰そうというんだ。それくらいは怖くもないが、荷は釣り合っていれば担ぎやすく、片寄っているとつらいな。」
    銀角大王「山一つでは押さえられぬか。」
    また呪文を唱え、今度は峨嵋山（がびさん）を空中へ呼び寄せて押し下した。悟空はもう一度首をよけ、右の肩で受け止めた。二つの大山を担いだまま、流れ星のように三蔵を追っていく。
    銀角大王はこれを見て、驚きのあまり全身から汗が噴き出した。銀角大王「こいつは山を担げるのか。」
    気を立て直して真言を唱え、泰山（たいざん）を空中へ呼び寄せると、悟空の頭の上から押さえつけた。悟空は力が抜け、筋がしびれ、この泰山で頭を圧する術に遭って、体内の三尸神（さんししん）まで悲鳴を上げ、目、耳、鼻、口の七つの穴から血を噴いた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "山の順序は須弥山、峨嵋山、泰山。最初の二つは左右の肩で受け、最後は頭上から押される。「三尸神咋」は体内の神が悲鳴を上げるほどの苦痛として訳し、七竅からの出血も残した。"
- "id": "xy-ch33-013"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好妖魔，使神通壓倒行者，卻疾駕長風，去趕唐三藏，就於雲端裡伸下手來，馬上撾人。慌得個沙僧丟了行李，掣出降妖棒，當頭擋住。那妖魔舉一口七星劍，對面來迎。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 132
    "line_end": 132
  "translation_ja": "銀角大王は神通力で悟空を押し伏せると、たちまち長い風に乗って三蔵を追い、雲の上から手を伸ばし、馬上の人をつかもうとした。沙悟浄は慌てて荷物を投げ出し、降妖棒（ごうようぼう）を抜いて、頭上から来る手を防いだ。銀角大王は七星剣（しちせいけん）を振り上げ、正面から迎え撃つ。さても激しい戦いだ。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "沙悟浄の得物は本回で降妖棒とも宝杖とも呼ばれる。同じ杖に接続し、別の武器を持ち替えたとはしない。"
- "id": "xy-ch33-014"
  "section_id": "chapter-33"
  "kind": "verse"
  "origin": "source"
  "source_text": "七星劍，降妖棒，萬映金光如閃亮。這個圜眼兇如黑殺神，那個鐵臉真是捲簾將。那怪山前大顯能，一心要捉唐三藏。這個努力保真僧，一心寧死不肯放。他兩個噴雲噯霧照天宮，播土揚塵遮斗象。殺得那一輪紅日淡無光，大地乾坤昏蕩蕩。來往相持八九回，不期戰敗沙和尚。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    七星剣と降妖棒、幾万もの金の光が稲妻のようにひらめく。
    丸い目をむく妖怪は、黒殺神（こくさつしん）のような凶悪さ。鉄の顔の沙悟浄は、まさしく捲簾将（けんれんしょう）。
    妖怪は山の前で大いに力を振るい、ひたすら三蔵を捕らえようとする。
    沙悟浄は力を尽くしてまことの僧を守り、死んでも決して渡すまいとする。
    二人は雲を噴き、霧を吐き、天宮まで照らし出す。土を散らし、塵を巻き上げ、星々を覆い隠す。
    戦いの勢いに赤い太陽も光を失い、天も地も、あたり一面薄暗くなる。
    打ち合い、渡り合うこと八、九合。思いがけず、沙悟浄が敗れた。
  "translation_status": "reviewed"
- "id": "xy-ch33-015"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔十分兇猛，使口寶劍，流星的解數滾來，把個沙僧戰得軟弱難搪，回頭要走。早被他逼住寶杖，掄開大手，撾住沙僧，挾在左脅下；將右手去馬上拿了三藏，腳尖兒鉤著行李，張開口咬著馬鬃；使起攝法，把他們一陣風，都拿到蓮花洞裡，厲聲高叫道：「哥哥！這和尚都拿來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 135
    "line_end": 135
  "translation_ja": "銀角大王はひどく凶猛で、宝剣を操り、流れ星のような技を次々と浴びせた。沙悟浄は力が弱り、防ぎきれず、振り返って逃げようとした。だが、銀角大王はすばやく杖を押さえ、大きな手を伸ばして沙悟浄をつかみ、左の脇へ挟んだ。右手では馬上の三蔵を捕らえ、足の先で荷物を引っかけ、口を開けて馬のたてがみをくわえた。物を引き寄せる術を使い、一陣の風に乗せて、皆まとめて蓮花洞（れんげどう）へ運び込み、鋭い声で叫んだ。銀角大王「兄上！　和尚どもを、みんな捕まえてきました！」"
  "translation_status": "reviewed"
- "id": "xy-ch33-016"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老魔聞言，大喜道：「拿來我看。」二魔道：「這不是？」老魔道：「賢弟呀，又錯拿來了也。」二魔道：「你說拿唐僧的。」老魔道：「是便就是唐僧，只是還不曾拿住那有手段的孫行者。須是要拿住他，才好吃唐僧哩；若不曾拿得他，切莫動他的人。那猴王神通廣大，變化多般，我們若吃了他師父，他肯甘心？來那門前吵鬧，莫想能得安生。」二魔笑道：「哥啊，你也忒會擡舉人。若依你誇獎他，天上少有，地下全無；自我觀之，也只如此，沒甚手段。」老魔道：「你拿住了？」二魔道：「他已被我遣三座大山壓在山下，寸步不能舉移。所以才把唐僧、沙和尚連馬、行李，都攝將來也。」那老魔聞言，滿心歡喜道：「造化，造化。拿住這廝，唐僧才是我們口裡的食哩。」叫小妖：「快安排酒來，且與你二大王奉一個得功的杯兒。」二魔道：「哥哥，且不要吃酒，叫小的們把豬八戒撈上水來吊起。」遂把八戒吊在東廊，沙僧吊在西邊，唐僧吊在中間，白馬送在槽上，行李收將進去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    金角大王はこれを聞いて大喜びした。金角大王「連れてきて見せろ。」
    銀角大王「ここにおります。」
    金角大王「弟よ、また捕まえる相手を間違えたな。」
    銀角大王「三蔵を捕らえろとおっしゃったではありませんか。」
    金角大王「なるほど、三蔵には違いない。だが、腕の立つ悟空をまだ捕まえておらぬ。あいつを捕まえてこそ、三蔵を食えるのだ。まだ捕まえていなければ、あいつの仲間には絶対に手を出すな。あの猿は神通力が広大で、変化も自在だ。師匠を食われて、黙っているものか。門前へ騒ぎに来たら、安らかに暮らせると思うなよ。」
    銀角大王は笑った。銀角大王「兄上は、あまりに人を買いかぶります。お話を聞けば天にもまれ、地には並ぶ者もないほどですが、私に言わせれば、あの程度のものです。大した腕などありません。」
    金角大王「捕まえたのか。」
    銀角大王「あいつは私が動かした三つの大山の下へ押さえつけてあります。一寸も身動きできません。だから三蔵と沙悟浄を、馬や荷物ごと、術で運んでこられたのです。」
    金角大王は心から喜んだ。金角大王「運がいい、運がいい。あいつを捕らえたなら、三蔵はようやく我々の口に入るぞ。」
    金角大王は小妖たちに命じた。金角大王「早く酒を用意しろ。まず二大王の手柄を祝い、一杯差し上げるのだ。」
    銀角大王「兄上、酒はまだ後でよいのです。手下どもに、猪八戒を水から引き上げ、吊るしておくようお命じください。」
    そこで八戒を東の廊に吊るし、沙悟浄は西側、三蔵は中央に吊るした。白馬は飼葉桶のところへ送り、荷物は奥へしまい込んだ。
  "translation_status": "reviewed"
- "id": "xy-ch33-017"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老魔笑道：「賢弟好手段，兩次捉了三個和尚。但孫行者雖是有山壓住，也須要作個法，怎麼拿他來湊蒸，才好哩。」二魔道：「兄長請坐。若要拿孫行者，不消我們動身，只教兩個小妖，拿兩件寶貝，把他裝將來罷。」老魔道：「拿甚麼寶貝去？」二魔道：「拿我的紫金紅葫蘆，你的羊脂玉淨瓶。」老魔將寶貝取出道：「差那兩個去？」二魔道：「差精細鬼、伶俐蟲二人去。」吩咐道：「你兩個拿著這寶貝，徑至高山絕頂，將底兒朝天，口兒朝地，叫一聲：『孫行者。』他若應了，就已裝在裡面，隨即貼上『太上老君急急如律令奉敕』的帖兒，他就一時三刻化為膿了。」二小妖叩頭，將寶貝領出去拿行者不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    金角大王は笑った。金角大王「弟よ、見事な腕だ。二度で三人の和尚を捕まえたな。しかし悟空は山で押さえてあるにしても、何か手を考えて、あいつも捕まえ、一緒に蒸し上げねばなるまい。」
    銀角大王「兄上、座っておいでください。悟空を捕らえるのに、我々が出向くには及びません。二匹の小妖に二つの宝を持たせ、あいつを中へ吸い込んでこさせればよいのです。」
    金角大王「どの宝を持たせる。」
    銀角大王「私の紫金紅葫蘆（しきんべにひさご）と、兄上の羊脂玉浄瓶（ようしぎょくじょうへい）です。」
    金角大王は宝を取り出した。金角大王「どの二匹を行かせる。」
    銀角大王「精細鬼（せいさいき）と伶俐虫（れいりちゅう）をやりましょう。」
    銀角大王は二匹に言いつけた。銀角大王「お前たちはこの宝を持って、まっすぐ高い山の頂上へ行け。底を天へ、口を地へ向け、『孫行者』と一声呼ぶのだ。奴が返事をすれば、そのまま中へ収まる。すぐに『太上老君（たいじょうろうくん）、急急如律令（きゅうきゅうにょりつりょう）、勅を奉ず』と書いた札を貼れば、一時三刻（いちじさんこく）のうちに膿に変わるぞ。」
    二匹の小妖は地に頭をつけて礼をし、宝を受け取って、悟空を捕らえに出ていった。この話はひとまず置く。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「一時三刻」は短時間を表す表現として原語を残した。時刻を厳密な現代の分数に換算しない。符の「太上老君急急如律令奉敕」は原文の語順を保って句切った。宝の来歴や所有者の後の正体は補わない。"
- "id": "xy-ch33-018"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那大聖被魔使法壓住在山根之下，遇苦思三藏，逢災念聖僧。厲聲叫道：「師父啊，想當時你到兩界山，揭了壓帖，老孫脫了大難，秉教沙門。感菩薩賜與法旨，我和你同住同修，同緣同相，同見同知。乍想到了此處，遭逢魔障，又被他遣山壓了。可憐，可憐！你死該當，只難為沙僧、八戒與那小龍化馬一場。這正是：樹大招風風撼樹，人為名高名喪人。」嘆罷，那珠淚如雨。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    さて悟空は、妖怪の術によって山の根元へ押さえ込まれていた。苦しみに遭っては三蔵を思い、災いに遭っては聖なる僧を案じ、激しく叫んだ。悟空「お師匠さま！　あの時、あなたが両界山（りょうかいざん）へ来て、押さえの札を剝がしてくださったおかげで、俺は大きな災難から抜け出し、仏門の教えに従うようになりました。菩薩さまからありがたくお言いつけを頂き、あなたと同じところに住み、共に修行し、縁を同じくし、あり方を同じくし、共に見、共に悟ってきたのです。それが、ここへ来て魔の妨げに遭い、また山を動かされて下敷きになるとは。ああ、情けない！　あなたが死ぬのは自業自得だとしても、沙悟浄と八戒、そして馬に姿を変えたあの小竜が気の毒です。まさしく、大木は風を招き、風が木を揺さぶる。人は名が高ければ、その名によって命を失うのです。」
    嘆き終えると、玉のような涙が雨さながらにこぼれた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「你死該當」は三蔵への悟空の激しい恨み言として「自業自得」と訳す。前後の師を思う気持ちや涙を削らず、沙悟浄・八戒・馬になった小竜への同情も残した。「同緣同相」などは共に修行する結びつきとして訳すが、教理上の厳密な同定はしない。"
- "id": "xy-ch33-019"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "早驚了山神、土地與五方揭諦神眾，會金頭揭諦道：「這山是誰的？」土地道：「是我們的。」「你山下壓的是誰？」土地道：「不知是誰。」揭諦道：「你等原來不知。這壓的是五百年前大鬧天宮的齊天大聖孫悟空行者。如今皈依正果，跟唐僧做了徒弟。你怎麼把山借與妖魔壓他？你們是死了，他若有一日脫身出來，他肯饒你？就是從輕，土地也問個擺站，山神也問個充軍，我們也領個大不應是。」那山神、土地才怕道：「委實不知，不知。只聽得那魔頭念起遣山咒法，我們就把山移將來了。誰曉得是孫大聖？」揭諦道：「你且休怕。律上有云：『不知者不坐罪。』我與你計較，放他出來，不要教他動手打我們。」土地道：「就沒理了，既放出來又打？」揭諦道：「你不知。他有一條如意金箍棒，十分利害：打著的就死，挽著的就傷；磕一磕兒觔斷，擦一擦兒皮塌哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    その声は早くも山神（さんじん）、土地神（とちがみ）、五方掲諦（ごほうぎゃてい）の神々を驚かせた。皆が集まると、金頭掲諦（きんとうぎゃてい）が言った。金頭掲諦「この山は誰のものだ。」
    土地神「私どもの山です。」
    金頭掲諦「その山の下に押さえられているのは誰だ。」
    土地神「誰なのか存じません。」
    金頭掲諦「お前たちは知らなかったのか。押さえられているのは、五百年前に天宮で大暴れした斉天大聖（せいてんたいせい）、孫悟空（そんごくう）という行者だ。今は正しい悟りの道に帰依し、三蔵の弟子となっている。なぜ山を妖怪に貸し、あの方を押さえさせたのだ。お前たちはもうおしまいだぞ。いつか抜け出してきたとき、許してくれるものか。軽く済んでも、土地神は宿駅での使役、山神は軍への流刑に処され、我々も、してはならぬことをした罪に問われるぞ。」
    山神と土地神は、ようやく恐ろしくなった。山神と土地神「本当に知りませんでした。知りませんでした。あの魔王が山を動かす呪文を唱えるのを聞き、山を移してきただけです。孫大聖（そんたいせい）さまだなどと、誰が思いましょう。」
    金頭掲諦「ひとまず怖がるな。法にも『知らなかった者は罪に問わない』とある。私が一緒に策を考え、あの方を出してやろう。殴られないようにせねばならぬ。」
    土地神「それは筋が通りません。出してさしあげても、まだ殴られるのですか。」
    金頭掲諦「お前は知らぬのだ。あの方には、恐ろしく強力な如意金箍棒（にょいきんこぼう）がある。まともに打たれれば死に、巻き込まれれば傷つく。少し当たっただけで筋が切れ、かすっただけで皮が剝がれるのだぞ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "擺站は宿駅での使役、充軍は軍への流刑、大不應是は「してはならぬことをした罪」とした。神々への罰を語る金頭掲諦の発言であり、特定の歴史的法令の正確な引用とまでは断定しない。"
- "id": "xy-ch33-020"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那土地、山神心中恐懼，與五方揭諦商議了，卻來到三山門外叫道：「大聖，山神、土地、五方揭諦來見。」好行者，他虎瘦雄心還在，自然的氣象昂昂，聲音朗朗道：「見我怎的？」土地道：「告大聖得知：遣開山，請大聖出來，赦小神不恭之罪。」行者道：「遣開山，不打你。」喝聲：「起去！」就如官府發放一般，那眾神念動真言咒語，把山仍遣歸本位，放起行者。行者跳將起來，抖抖土，束束裙，耳後掣出棒來，叫山神、土地：「都伸過孤拐來，每人先打兩下，與老孫散散悶。」眾神大驚道：「剛才大聖已吩咐，恕我等之罪，怎麼出來就變了言語要打？」行者道：「好土地，好山神，你道不怕老孫，卻怕妖怪？」土地道：「那魔神通廣大，法術高強，念動真言咒語，拘喚我等在他洞裡，一日一個輪流當值哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    土地神と山神は恐れおののき、五方掲諦と相談したのち、三つの山の外まで来て呼びかけた。神々「大聖（たいせい）さま、山神、土地神、五方掲諦がお目にかかりに参りました。」
    さすがは悟空。虎は痩せても勇ましい心を失わぬように、おのずと気高く、声も朗々としていた。悟空「何の用で会いに来た。」
    土地神「大聖さまに申し上げます。山をどけて、お出まし願います。どうか、この卑しい神の無礼の罪をお許しください。」
    悟空「山をどけろ。殴りはしない。」
    さらに悟空は一喝した。悟空「さっさとどけ！」
    まるで役所で命令を下すようであった。神々は真言と呪文を唱え、山をそれぞれ元の場所へ戻して、悟空を解き放った。悟空は跳ね起き、土を払い、腰の衣を締め直すと、耳の後ろから棒を抜き出し、山神と土地神を呼んだ。悟空「みんな、足首を突き出せ。まず一人につき二つずつ殴って、俺の憂さを晴らしてやる。」
    神々は仰天した。神々「大聖さまは、たった今、私どもの罪をお許しくださったではありませんか。なぜ出てこられた途端、お言葉を変えて、殴るとおっしゃるのです。」
    悟空「立派な土地神に、立派な山神だな。お前たちはこの俺が怖くなくて、妖怪のほうが怖いというのか。」
    土地神「あの魔王は神通力が広大で、法術も強力です。真言と呪文を唱えて私どもを洞へ呼びつけ、一日一人ずつ、交代で勤めさせております。」
  "translation_status": "reviewed"
- "id": "xy-ch33-021"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽見「當值」二字，卻也心驚。仰面朝天，高聲大叫道：「蒼天，蒼天！自那混沌初分，天開地闢，花果山生了我，我也曾遍訪明師，傳授長生秘訣。想我那隨風變化，伏虎降龍，大鬧天宮，名稱大聖，更不曾把山神、土地欺心使喚。今日這個妖魔無狀，怎敢把山神、土地喚為奴僕，替他輪流當值？天啊！既生老孫，怎麼又生此輩？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 143
    "line_end": 143
  "translation_ja": "悟空は「勤めさせる」という言葉を聞き、はっとした。顔を天へ向け、大声で叫んだ。悟空「天よ、天よ！　混沌が初めて分かれ、天地が開かれてから、この俺は花果山（かかざん）に生まれ、優れた師をあまねく訪ねて、長生きの秘訣を教わった。風のままに姿を変え、虎を伏せ、竜を従え、天宮で大暴れし、大聖の名まで掲げた俺だが、山神や土地神を無理に召し使ったことなどない。それを今日、この不届きな妖怪は、よくも山神や土地神を召し使い同然に呼びつけ、交代で勤めさせられるものだ。天よ！　この俺を生んでおきながら、なぜまたこんな奴まで生んだのだ！」"
  "translation_status": "reviewed"
- "id": "xy-ch33-022"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖正感嘆間，又見那山凹裡霞光焰焰而來。行者道：「山神、土地，你既在這洞中當值，那放光的是甚物件？」土地道：「那是妖魔的寶貝放光，想是有妖精拿寶貝來降你。」行者道：「這個卻好耍子兒啊。我且問你，他這洞中有甚人與他相往？」土地道：「他愛的是燒丹煉藥，喜的是全真道人。」行者道：「怪道他變個老道士，把我師父騙去了。既這等，你都且記打，回去罷。等老孫自家拿他。」那眾神俱騰空而散。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    悟空が嘆いていると、山あいから、霞のような光が燃え立つばかりに近づいてきた。悟空「山神、土地神。お前たちはあの洞で勤めているのだろう。光っているのは何だ。」
    土地神「妖怪の宝が放つ光です。おそらく、宝を持った妖怪が、あなたを降伏させに来るのでしょう。」
    悟空「それは面白くなってきたな。ところで、あいつの洞へは、どんな者が出入りしている。」
    土地神「丹薬を練るのが大好きで、全真（ぜんしん）の道士を好んでおります。」
    悟空「どうりで老道士に化け、うちのお師匠さまを騙したわけだ。そういうことなら、お前たちへの殴打は、ひとまずつけにしておく。帰っていいぞ。この俺が、自分で捕まえてやる。」
    神々はみな空へ昇り、散っていった。
  "translation_status": "reviewed"

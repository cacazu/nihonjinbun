  "translation_ja": |-
    三蔵「それなら、こうしましょう。私はまだ歩けますから、しばらくこの馬をお貸しします。道観に着いたら、返してくださればよいのです。」
    銀角大王「お坊さま、ご厚情はありがたいのですが、脚と股を傷めておりまして、馬にも乗れません。」
    三蔵「それもそうですね。」
    三蔵は沙悟浄を呼んだ。三蔵「荷物を私の馬に載せて、お前がこの方をしばらく背負ってあげなさい。」
    沙悟浄「私が背負いましょう。」
    銀角大王は急いで振り向き、沙悟浄をちらりと見た。銀角大王「お坊さま、私は猛虎に肝をつぶしました。この陰気なお顔のお坊さまを見ると、ますます怖くなります。とても背負っていただく気にはなれません。」
    三蔵「悟空、お前が背負ってあげなさい。」
    悟空はすぐさま何度も答えた。悟空「背負いましょう、背負いましょう。」
    銀角大王は初めから悟空を狙っていたので、素直に背負わせることにし、それ以上は何も言わなかった。
    沙悟浄は笑った。沙悟浄「人を見る目のない老道士だな。俺に背負われるのは嫌がるくせに、よりによって兄貴を選ぶとは。お師匠さまが見えなくなったら、尖った石へ叩きつけられ、筋という筋を切られてしまうぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch33-011"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽了，口中笑道：「你這個潑魔，怎麼敢來惹我？你也問問老孫是幾年的人兒？你這般鬼話兒，只好瞞唐僧，又好來瞞我？我認得你是這山中的怪物，想是要吃我師父哩。我師父又非是等閑之輩，是你吃的？你要吃他，也須是分多一半與老孫是。」那魔聞得行者口中念誦，道：「師父，我是好人家兒孫，做了道士。今日不幸，遇著虎狼之厄，我不是妖怪。」行者道：「你既怕虎狼，怎麼不念北斗經？」三藏正然上馬，聞得此言，罵道：「這個潑猴！『救人一命，勝造七級浮屠。』你馱他馱兒便罷了，且講甚麼『北斗經』、『南斗經』。」行者聞言道：「這廝造化哩，我那師父是個慈悲好善之人，又有些外好裡枒槎。我待不馱你，他就怪我。馱便馱，須要與你講開：若是大小便，先和我說；若在脊梁上淋下來，臊氣不堪，且污了我的衣服，沒人漿洗。」那怪道：「我這般一把子年紀，豈不知你的話說？」行者才拉將起來，背在身上，同長老、沙僧，奔大路西行。那山上高低不平之處，行者留心慢走，讓唐僧前去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    悟空はそれを聞き、笑いながら言った。悟空「この不届きな妖怪め、よくも俺にちょっかいを出したな。俺が何年生きてきたか、聞いてみるがいい。そんなでたらめで騙せるのは三蔵くらいだ。俺まで騙せると思うのか。お前がこの山の妖怪だとは、分かっている。俺のお師匠さまを食いたいのだろう。だが、あのお方はただ者じゃない。お前などに食えるものか。どうしても食いたいなら、半分より多く、この俺に分けてもらわなくちゃな。」
    銀角大王は悟空の口からぶつぶつ漏れる言葉を聞いた。銀角大王「お坊さま、私はまっとうな家に生まれ、道士となった者です。今日は不幸にも虎狼の災難に遭いましたが、妖怪ではありません。」
    悟空「虎や狼が怖いなら、なぜ北斗経（ほくときょう）を唱えないんだ。」
    ちょうど馬に乗ろうとしていた三蔵は、この言葉を聞いて叱った。三蔵「この不届きな猿め！　『一人の命を救うのは、七重の仏塔を建てるにも勝る』というではないか。背負ってあげれば、それでよいのだ。北斗経だの南斗経（なんときょう）だの、何を言っている。」
    悟空「お前は運がいいな。俺のお師匠さまは慈悲深く、善いことがお好きだが、よその人に優しい一方で、身内には少々手厳しいところもある。俺が背負うのを断れば、お叱りになる。背負ってやるが、先に言っておくぞ。大でも小でも、用を足すなら、まず俺に言え。背中に漏らされたら臭くてたまらんし、服も汚れる。洗ってくれる者はいないんだからな。」
    銀角大王「この年です。それくらい、言われなくても分かっていますよ。」
    そこで悟空は銀角大王を引き起こして背負い、三蔵、沙悟浄とともに、大道を西へ向かった。山道の起伏の激しいところでは、わざと気をつけてゆっくり歩き、三蔵を先へ行かせた。
  "translation_status": "reviewed"
  "issues":

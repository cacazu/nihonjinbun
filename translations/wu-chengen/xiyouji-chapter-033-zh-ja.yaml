  "translation_ja": |-
    早くも巡回の神が降りてきて、悟空の耳もとで告げた。巡回の神「哪吒太子（なたたいし）が、助けに来られました。」
    悟空が顔を上げると、めでたい雲がめぐり、確かに神がいた。そこで小妖へ振り向いた。悟空「では、天を収めよう。」
    小妖「収めるなら、さっさと収めてください。何をぐずぐずしているのです。」
    悟空「今、精神を集中させて、呪文を唱えていたのだ。」
    小妖たちは目を見開き、どのように天を収めるのか見つめた。悟空は偽の瓢箪を一つ、上へ放り投げた。考えてもみよ、一本の毛が変わった物に、どれほどの重さがあろう。山頂の風に吹き流され、ふわりふわりと漂い、たっぷり半時もしてから、ようやく落ちてきた。すると南天門の上で、哪吒が黒い旗をばさばさと広げ、太陽も月も星も、すべて覆い隠した。まるで天地を墨で染め、宇宙を藍で塗りつぶしたようであった。
    二匹の小妖は仰天した。二匹の小妖「さっき話していた時は、まだ昼前だったのに、なぜもう日暮れになったのです。」
    悟空「天を収めたのだから、時刻など分からぬ。日暮れになっても当然だ。」
    小妖「それに、どうしてこんなに暗いのです。」
    悟空「日も月も星も中へ収めたので、外には光がない。暗いのは当然だろう。」
    小妖「お師匠さま、どちらで話しておられるのですか。」
    悟空「お前の目の前にいるではないか。」
    小妖は手を伸ばして探った。小妖「声は聞こえますが、お顔はまるで見えません。お師匠さま、ここはいったいどこなのです。」
    悟空はまた騙した。悟空「足を動かすな。ここは渤海（ぼっかい）の岸だ。踏み外して落ちたら、七、八日たっても底へ着かぬぞ。」
    小妖は大いに驚いた。小妖「もう結構です、結構です。天を放してください。どう収めるのか、分かりました。いつまでもいじっていて海へ落ちたら、家へ帰れなくなります。」

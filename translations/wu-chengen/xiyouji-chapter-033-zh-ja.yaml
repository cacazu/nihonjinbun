  "translation_ja": |-
    さて銀角大王（ぎんかくだいおう）は八戒（はっかい）を洞へ捕らえて帰り、言った。銀角大王「兄上、一人捕まえてきました。」
    金角大王（きんかくだいおう）は喜んだ。金角大王「連れてきて見せろ。」
    銀角大王「ここにおります。」
    金角大王「弟よ、捕まえる相手が違うぞ。この和尚は役に立たぬ。」
    八戒はその言葉に乗じた。八戒「大王、役に立たない和尚なら、外へ放してやってくださいよ。こんなの、ひどいじゃありませんか。」
    銀角大王「兄上、放してはなりません。役には立たなくとも、三蔵（さんぞう）の仲間で、猪八戒（ちょはっかい）という奴です。ひとまず奥の清水の池に漬けておき、毛が抜けたら塩漬けにして干し、曇りの日に酒の肴にしましょう。」
    八戒はそれを聞いて言った。八戒「ああ、ついてない。塩漬けの干し肉を売る妖怪に出くわしちまった。」
    小妖たちは八戒を奥へ担ぎ込み、水へ投げ入れた。この話はひとまず置く。
  "translation_status": "reviewed"

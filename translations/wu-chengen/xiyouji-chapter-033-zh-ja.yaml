  "source_text": "早有遊神急降大聖耳邊道：「哪吒太子來助功了。」行者仰面觀之，只見祥雲繚繞，果是有神。卻回頭對小妖道：「裝天罷。」小妖道：「要裝就裝，只管阿綿花屎怎的？」行者道：「我方才運神念咒來。」那小妖都睜著眼，看他怎麼樣裝天。這行者將一個假葫蘆兒拋將上去。你想，這是一根毫毛變的，能有多重？被那山頂上風吹去，飄飄蕩蕩，足有半個時辰，方才落下。只見那南天門上，哪吒太子把皂旗撥喇喇展開，把日月星辰俱遮閉了。真是乾坤墨染就，宇宙靛裝成。二小妖大驚道：「才說話時，只好向午，卻怎麼就黃昏了？」行者道：「天既裝了，不辨時候，怎不黃昏？」「如何又這等樣黑？」行者道：「日月星辰都裝在裡面，外卻無光，怎麼不黑？」小妖道：「師父，你在那廂說話哩？」行者道：「我在你面前不是？」小妖伸手摸著道：「只見說話，更不見面目。師父，此間是甚麼去處？」行者又哄他道：「不要動腳，此間乃是渤海岸上，若塌了腳，落下去啊，七八日還不得到底哩。」小妖大驚道：「罷罷罷，放了天罷，我們曉得是這樣裝了。若弄一會子，落下海去，不得歸家。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"

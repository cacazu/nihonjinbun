  "translation_ja": |-
    日遊神はまっすぐ南天門（なんてんもん）の内へ入り、霊霄殿の下で玉帝へ奏上し、一部始終を詳しく伝えた。玉帝「この不届きな猿め、無礼なことを申す。以前、観音（かんのん）が来て、あの猿を解き放ち、三蔵を守らせると申したので、朕も五方掲諦と四値功曹（しちこうそう）を遣わし、交代で守らせている。それが今度は、天を借りて収めたいというのか。天など収められるものか。」
    玉帝が収められぬと言った途端、列の中から哪吒三太子（なたさんたいし）が進み出て奏上した。哪吒（なた）「陛下、天も収めることができます。」
    玉帝「どうすれば収められる。」
    哪吒「混沌が初めて分かれた時、軽く澄んだものが天となり、重く濁ったものが地となりました。天とは、ひとかたまりの清らかな気で、天上の美しい宮殿を支えております。道理から申せば、確かに収めるのは難しゅうございます。ただ、悟空が三蔵を守って西へ経を取りに行くのは、まさしく泰山ほどの福縁、海の深さにも等しい善い功徳をもたらすことです。本日は、その成功を助けるべきでございます。」
    玉帝「そなたには、どんな助け方がある。」
    哪吒「どうか勅命をお下しください。北天門（ほくてんもん）へ行き、真武（しんぶ）から皂雕旗（そうちょうき）を借りてまいります。南天門の上で一振りすれば、日も月も星も覆い隠せます。向かい合っても人が見えず、白い物をつかんでも黒い物と見分けられません。あの妖怪には天を収めたと思い込ませ、悟空の成功を助けるのです。」
    玉帝は聞き入れた。玉帝「そなたの申すとおりにせよ。」
    哪吒は勅命を受け、北天門へ来て真武に会い、事情を詳しく話した。真武はさっそく旗を哪吒に渡した。

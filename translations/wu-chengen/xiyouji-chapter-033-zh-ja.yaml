  "translation_ja": |-
    一方、三蔵は悟空と沙悟浄を頼みにして、安心して歩みを進めていた。すると、道士姿の銀角大王の声がした。銀角大王「お坊さま、お助けください！」
    三蔵はそれを聞いた。三蔵「おお、何ということだ。この山の荒野には、四方を見ても村や家などない。誰が叫んでいるのだろう。きっと虎や豹、狼などの獣に脅かされたのだ。」
    三蔵は馬を引き返し、呼びかけた。三蔵「難儀をしているのは、どなたです。出ていらっしゃい。」
    銀角大王は草むらから這い出し、馬の前で、音がするほど何度も地に頭を打ちつけた。三蔵は馬上から、相手が道士で、しかもひどく年を取っているのを見て、恐縮した。急いで馬を下り、助け起こそうとした。三蔵「お立ちください。さあ、お立ちください。」
    銀角大王「痛い、痛い、痛い！」
    三蔵は手を放して見た。脚から血が流れている。驚いて尋ねた。三蔵「先生、どちらからおいでになったのです。どうしてお脚を傷めなさったのですか。」
    銀角大王は巧みな甘言を弄し、偽りの情けを込めて言った。銀角大王「お坊さま、この山を西へ行くと、静かな道観（どうかん）が一つございます。私はそこの道士です。」
    三蔵「道観で香を供え、経や法を学ばず、なぜこちらを歩いておられたのですか。」
    銀角大王「一昨日、山の南に住む施主の家から、道士たちを招いて星の災いを払う祈祷をし、供物を分けて福にあやかる儀式をしてほしいと頼まれました。帰りが遅くなり、弟子と二人、連れ立って帰る途中、奥深い道で、突然、縞模様の猛虎に出くわしたのです。虎は私の弟子をくわえて行ってしまいました。私は震え上がり、逃げるにも逃げられず、石だらけの斜面で転んで脚を傷め、帰り道も分からなくなりました。今日は天のお恵みで、お坊さまにお会いできました。どうか慈悲のお心をお起こしになり、この命をお救いください。道観へ帰り着くことができたなら、身を質に入れ、命を売ってでも、必ずこの深いご恩にお報いいたします。」
    三蔵はその話を本当だと思った。三蔵「先生、あなたにも私にも、命は一つです。私は僧、あなたは道士。着る物や冠は違っても、修行の道理は同じです。あなたをお救いしないようでは、出家した者とはいえません。お助けいたしますが、道を歩くことはできないのでしょう。」
    銀角大王「立つことさえできません。どうして歩けましょう。」
  "translation_status": "reviewed"

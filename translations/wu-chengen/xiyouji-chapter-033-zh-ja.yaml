  "source_text": "三藏道：「也罷，也罷，我還走得路，將馬讓與你騎一程，到你上宮，還我馬去罷。」那怪道：「師父，感蒙厚情，只是腿胯跌傷，不能騎馬。」三藏道：「正是。」叫沙和尚：「你把行李捎在我馬上，你馱他一程罷。」沙僧道：「我馱他。」那怪急回頭，抹了他一眼，道：「師父啊，我被那猛虎諕怕了，見這晦氣色臉的師父，愈加驚怕，不敢要他馱。」三藏叫道：「悟空，你馱罷。」行者連聲答應道：「我馱，我馱。」那妖就認定了行者，順順的要他馱，再不言語。沙僧笑道：「這個沒眼色的老道。我馱著不好，顛倒要他馱。他若看不見師父時，三尖石上，把觔都摜斷了你的哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"

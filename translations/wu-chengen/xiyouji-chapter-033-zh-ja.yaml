  "source_text": "那日遊神徑至南天門裡，靈霄殿下，啟奏玉帝，備言前事。玉帝道：「這潑猴頭，出言無狀。前者觀音來說放了他，保護唐僧，朕這裡又差五方揭諦、四值功曹，輪流護持。如今又借天裝，天可裝乎？」才說裝不得，那班中閃出哪吒三太子，奏道：「萬歲，天也裝得。」玉帝道：「天怎樣裝？」哪吒道：「自混沌初分，以輕清為天，重濁為地。天是一團清氣而扶托瑤天宮闕，以理論之，其實難裝；但只孫行者保唐僧西去取經，誠所謂泰山之福緣，海深之善慶，今日當助他成功。」玉帝道：「卿有何助？」哪吒道：「請降旨意，往北天門問真武借皂雕旗，在南天門上一展，把那日月星辰閉了。對面不見人，捉白不見黑，哄那怪道，只說裝了天，以助行者成功。」玉帝聞言：「依卿所奏。」那太子奉旨，前來北天門，見真武，備言前事。那祖師隨將旗付太子。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

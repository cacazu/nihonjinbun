  "known_gaps":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-007"
    "description_ja": "底本は「清牛道士」「素券先生」。清を青へ訂正せず、他の伝説上の人物へ同定しない。「黃棕」は黄色い棕櫚の繊維による履物の飾りとして訳したが、製法の細部は原文以上に確定しない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-009"
    "description_ja": "「無奔走」は逃げるすべを失った意に採った。散福は祈祷だけでなく供物の分配を含むものとした（教育部《重編國語辭典修訂本》「散福」https://dict.revised.moe.edu.tw/dictView.jsp?ID=144985&q=1&word=散）。老道士の経歴、弟子が虎にさらわれた話、負傷は妖怪が語る虚言で、語り手の確認した事実ではない。「前日」は一昨日としたが、昔の用法には先日の幅もある。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-011"
    "description_ja": "「外好裡枒槎」は他人にはよくし、身内には手厳しい意。漢典「外」（https://zdic.net/hans/外）の当該用例の説明と照合し、悟空の不満の発話として訳した。三蔵の性格についての客観的断定にはしない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-012"
    "description_ja": "山の順序は須弥山、峨嵋山、泰山。最初の二つは左右の肩で受け、最後は頭上から押される。「三尸神咋」は体内の神が悲鳴を上げるほどの苦痛として訳し、七竅からの出血も残した。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-013"
    "description_ja": "沙悟浄の得物は本回で降妖棒とも宝杖とも呼ばれる。同じ杖に接続し、別の武器を持ち替えたとはしない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-017"
    "description_ja": "「一時三刻」は短時間を表す表現として原語を残した。時刻を厳密な現代の分数に換算しない。符の「太上老君急急如律令奉敕」は原文の語順を保って句切った。宝の来歴や所有者の後の正体は補わない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-018"
    "description_ja": "「你死該當」は三蔵への悟空の激しい恨み言として「自業自得」と訳す。前後の師を思う気持ちや涙を削らず、沙悟浄・八戒・馬になった小竜への同情も残した。「同緣同相」などは共に修行する結びつきとして訳すが、教理上の厳密な同定はしない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-019"
    "description_ja": "擺站は宿駅での使役、充軍は軍への流刑、大不應是は「してはならぬことをした罪」とした。神々への罰を語る金頭掲諦の発言であり、特定の歴史的法令の正確な引用とまでは断定しない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-024"
    "description_ja": "「漁鼓簡」は漁鼓と簡板という道士の楽器を挙げたものとして訳した。底本の原字は保存し、原文に楽器の寸法や形状を補っていない。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-025"
    "description_ja": "「那妖」「那怪」「小妖」とだけある発言は、精細鬼・伶俐虫のどちらかを新たに特定せず「小妖」とした。二匹が一緒と明示される発言のみ集団表示。第27単位の「那怪」は直前の伶俐虫から発話が続くと読んだ。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-029"
    "description_ja": "「捉白不見黑」は白黒の見分けもつかない暗さと解し、白い物を手でつかむ動作も残した。「泰山之福緣、海深之善慶」は取経の大きな功徳を述べる比喩として訳した。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-030"
    "description_ja": "「阿綿花屎」はぐずぐずして時間を引き延ばす意で訳した（漢典 https://www.zdic.net/hans/阿綿花屎）。原文の半個時辰と、前後の向午・正午はそのまま残し、時計の矛盾を独自に補正しない。渤海の岸だという説明は悟空の作り話。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "segment_ids":
    - "xy-ch33-031"
    "description_ja": "「養家」は家計を支える意とし、よい家柄の出身かどうかをいう表現にはしない。教育部《重編國語辭典修訂本》「養家」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=157742&la=0&powerMode=0）と照合。 本文欠落ではなく解釈・校訂上の留保。"

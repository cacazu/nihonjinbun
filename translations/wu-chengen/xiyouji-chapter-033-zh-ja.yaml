  "source_text": "好行者，理開棒，在馬前丟幾個解數，上三下四，左五右六，盡按那六韜三略，使起神通。那長老在馬上觀之，真個是寰中少有，世上全無。剖開路一直前行，險些兒不諕倒那怪物。他在山頂上看見，魂飛魄喪，忽失聲道：「幾年間聞說孫行者，今日才知話不虛傳果是真。」眾怪上前道：「大王，怎麼長他人之志氣，滅自己之威風？你誇誰哩？」二魔道：「孫行者神通廣大，那唐僧吃他不成。」眾怪道：「大王，你沒手段，等我們著幾個去報大大王，教點起本洞大小兵來，擺開陣勢，合力齊心，怕他走了那裡去？」二魔道：「你們不曾見他那條鐵棒，有萬夫不當之勇。我洞中不過有四五百兵，怎禁得他那一棒？」眾妖道：「這等說，唐僧吃不成，卻不把豬八戒錯拿了？如今送還他罷。」二魔道：「拿便也不曾錯拿，送便也不好輕送。唐僧終是要吃，只是眼下還尚不能。」眾妖道：「這般說，還過幾年麼？」二魔道：「也不消幾年。我看見那唐僧只可善圖，不可惡取。若要倚勢拿他，聞也不得一聞。只可以善去感他，賺得他心與我心相合，卻就善中取計，可以圖之。」眾妖道：「大王如定計拿他，可用我等？」二魔道：「你們都各回本寨，但不許報與大王知道；若是驚動了他，必然走了風汛，敗了我計策。我自有個神通變化，可以拿他。」眾妖散去。"

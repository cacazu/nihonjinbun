    "message_ja": "「養家」は家計を支える意とし、よい家柄の出身かどうかをいう表現にはしない。教育部《重編國語辭典修訂本》「養家」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=157742&la=0&powerMode=0）と照合。"
- "id": "xy-ch33-032"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說了誓，將身一縱，把尾子趬了一趬，跳在南天門前，謝了哪吒太子麾旗相助之功。太子回宮繳旨，將旗送還真武不題。這行者佇立霄漢之間，觀看那個小妖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 161
    "line_end": 161
  "translation_ja": "誓いを立てると、悟空は身を躍らせ、尾をひょいと上げて南天門の前へ跳び、旗を振って力を貸してくれた哪吒に礼を述べた。哪吒は宮へ戻って勅命を果たしたことを報告し、旗を真武へ返した。その話はさておき、悟空は天の高みに立ち、小妖たちの様子を眺めていた。"
  "translation_status": "reviewed"
- "id": "xy-ch33-033"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎生區處，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 163
    "line_end": 163
  "translation_ja": "さて、この後どう始末をつけるのか。それは次の回でお話ししよう。"
  "translation_status": "reviewed"

  "source_text": "卻說那怪將八戒拿進洞去，道：「哥哥啊，拿將一個來了。」老魔喜道：「拿來我看。」二魔道：「這不是？」老魔道：「兄弟，錯拿了，這個和尚沒用。」八戒就綽經說道：「大王，沒用的和尚，放他出去罷。不當人子。」二魔道：「哥哥，不要放他。雖然沒用，也是唐僧一起的，叫做豬八戒。把他且浸在後邊淨水池中，浸退了毛衣，使鹽醃著，晒乾了，等天陰下酒。」八戒聽言道：「蹭蹬啊，撞著個販醃臘的妖怪了。」那小妖把八戒擡進去，拋在水裡不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

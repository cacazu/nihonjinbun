  "source_text": "好大聖，低頭捻訣，念個咒語，叫那日遊神、夜遊神、五方揭諦神：「即去與我奏上玉帝，說老孫皈依正果，保唐僧去西天取經，路阻高山，師逢苦厄。妖魔那寶，吾欲誘他換之。萬千拜上，將天借與老孫裝閉半個時辰，以助成功，若道半聲不肯，即上靈霄殿，動起刀兵。」"

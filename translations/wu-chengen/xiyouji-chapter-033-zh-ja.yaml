    "line_end": 155
  "translation_ja": "悟空は頭を下げ、印を結び、呪文を唱えて、日遊神（にちゆうしん）、夜遊神（やゆうしん）、五方掲諦を呼んだ。悟空「すぐに玉帝（ぎょくてい）へ奏上してくれ。この俺は正しい悟りの道に帰依し、三蔵を守って西天（さいてん）へ経を取りに行く途中、高山に道を阻まれ、師匠が災難に遭った。妖怪どもの宝を、うまく誘って交換させたい。幾重にもお願い申し上げる。天を半時（はんとき）だけ俺に貸して、収めて閉じ込めさせ、この仕事の成功を助けていただきたいとな。もし少しでも嫌だと言うなら、ただちに霊霄殿（れいしょうでん）へ乗り込み、戦を始めるぞ。」"

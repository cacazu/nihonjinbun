  "source_text": "星冠晃亮，鶴髮蓬鬆。羽衣圍繡帶，雲履綴黃棕。神清目朗如仙客，體健身輕似壽翁。說甚麼清牛道士，也強如素券先生。妝成假像如真像，捏作虛情似實情。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

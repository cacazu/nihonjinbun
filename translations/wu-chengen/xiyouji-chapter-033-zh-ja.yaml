    頭挽雙髽髻，身穿百衲衣。
    手敲漁鼓簡，腰繫呂公絛。
    斜倚大路下，專候小魔妖。
    頃刻妖來到，猴王暗放刁。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 148
    "line_end": 151
  "translation_ja": |-
    髪は二つの髷に結い、身には百衲衣（ひゃくのうえ）をまとう。
    手で漁鼓（ぎょこ）と簡板（かんばん）を打ち、腰には呂公絛（りょこうとう）を結ぶ。
    大道のほとりに斜めに身をもたせ、ひたすら小妖怪を待つ。
    たちまち妖怪たちがやって来て、悟空はひそかにいたずらを仕掛ける。

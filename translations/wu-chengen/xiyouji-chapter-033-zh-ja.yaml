  "source_text": "卻說這三藏仗著孫大聖與沙僧，歡喜前來。正行處，只聽得叫：「師父救人！」三藏聞得，道：「善哉！善哉！這曠野山中，四下裡更無村舍，是甚麼人叫？想必是虎豹狼蟲諕倒的。」這長老兜回駿馬，叫道：「那有難者是甚人？可出來。」這怪從草科裡爬出，對長老馬前，乒乓的只情磕頭。三藏在馬上見他是個道者，卻又年紀高大，甚不過意。連忙下馬攙道：「請起，請起。」那怪道：「疼，疼，疼。」丟了手看處，只見他腳上流血。三藏驚問道：「先生啊，你從那裡來？因甚傷了尊足？」那怪巧語花言，虛情假意道：「師父啊，此山西去，有一座清幽觀宇，我是那觀裡的道士。」三藏道：「你不在本觀中侍奉香火，演習經法，為何在此閑行？」那魔道：「因前日山南里施主家邀道眾禳星散福來晚，我師徒二人一路而行。行至深衢，忽遇著一隻斑斕猛虎，將我徒弟銜去。貧道戰兢兢的無奔走，一跤跌在亂石坡上，傷了腿足，不知回路。今日大有天緣，得遇師父。萬望師父大發慈悲，救我一命。若得到觀中，就是典身賣命，一定重謝深恩。」三藏聞言，認為真實，道：「先生啊，你我都是一命之人，我是僧，你是道，衣冠雖別，修行之理則同。我不救你啊，就不是出家之輩。救便救你，你卻走不得路哩。」那怪道：「立也立不起來，怎生走路？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

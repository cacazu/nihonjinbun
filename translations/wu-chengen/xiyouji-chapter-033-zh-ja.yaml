    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    星冠（せいかん）はきらきらと輝き、鶴のような白髪はふさふさと広がる。
    羽衣には刺繡の帯を締め、雲履（うんり）には黄色い棕櫚の繊維を縫い添える。
    澄んだ気品と明るい目は仙人のよう、健やかな体と軽い身のこなしは長寿の翁のよう。
    清牛道士（せいぎゅうどうし）など、何ほどのこともない。素券先生（そけんせんせい）にも勝る姿だ。
    偽りの姿をまことらしく装い、作り上げた情けを本当の情けと見せかける。

    "message_ja": "「無奔走」は逃げるすべを失った意に採った。散福は祈祷だけでなく供物の分配を含むものとした（教育部《重編國語辭典修訂本》「散福」https://dict.revised.moe.edu.tw/dictView.jsp?ID=144985&q=1&word=散）。老道士の経歴、弟子が虎にさらわれた話、負傷は妖怪が語る虚言で、語り手の確認した事実ではない。「前日」は一昨日としたが、昔の用法には先日の幅もある。"
- "id": "xy-ch33-010"

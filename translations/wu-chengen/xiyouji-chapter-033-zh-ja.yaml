  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，見他認了真實，又念咒語，驚動太子，把旗捲起，卻早見日光正午。小妖笑道：「妙啊！妙啊！這樣好寶貝，若不換啊，誠為不是養家的兒子。」那精細鬼交了葫蘆，伶俐蟲拿出淨瓶，一齊兒遞與行者。行者卻將假葫蘆兒遞與小妖換了。既換了寶貝，卻又幹事找絕：臍下拔一根毫毛，吹口仙氣，變作一個銅錢。叫道：「小童，你拿這個錢去買張紙來。」小妖道：「何用？」行者道：「我與你寫個合同文書。你將這兩件裝人的寶貝換了我一件裝天的寶貝，恐人心不平，向後去日久年深，有甚反悔不便，故寫此各執為照。」小妖道：「此間又無筆墨，寫甚文書？我與你賭個咒罷。」行者道：「怎麼樣賭？」小妖道：「我兩件裝人之寶，貼換你一件裝天之寶，若有反悔，一年四季遭瘟。」行者笑道：「我是決不反悔；如有反悔，也照你四季遭瘟。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"

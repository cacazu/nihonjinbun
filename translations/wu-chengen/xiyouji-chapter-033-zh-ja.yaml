  "translation_ja": |-
    さすがは悟空。棒を繰り出し、馬の前でいくつも技を見せた。上へ三つ、下へ四つ、左へ五つ、右へ六つ。ことごとく六韜三略（りくとうさんりゃく）の兵法にかない、神通力を発揮する。三蔵が馬上から見れば、まことに天下にもまれで、この世に並ぶもののない技であった。道を切り開き、まっすぐ進むその姿は、妖怪を危うく驚き倒すところだった。山頂から眺めていた銀角大王は、魂も消えるほど恐れ、思わず声を漏らした。銀角大王「何年も前から孫行者（そんぎょうじゃ）の噂は聞いていたが、今日こそ分かった。噂に偽りはなく、本当だったのだ。」
    妖怪たちが前へ出た。妖怪たち「大王、なぜよその威勢を盛り立て、ご自分の威風を損なうのです。誰を褒めておられるのですか。」
    銀角大王「悟空の神通力は広大だ。三蔵を食うことはできぬ。」
    妖怪たち「大王に手立てがないのなら、何匹かを大大王へ知らせにやりましょう。洞じゅうの兵を大小残らず集めて陣を張り、力と心を一つにすれば、奴らに逃げ場などありますまい。」
    銀角大王「お前たちはあの鉄棒を見なかったのか。万人でも食い止められぬ勇ましさだ。うちの洞には四、五百の兵しかおらぬ。あの一撃に、どうして耐えられよう。」
    妖怪たち「それでは三蔵は食えず、猪八戒を捕まえたのも間違いだったことになるではありませんか。今から返してやりましょう。」
    銀角大王「捕まえたのは間違いではないし、たやすく返してやるわけにもいかぬ。三蔵はいずれ食う。ただ、今すぐにはできぬだけだ。」
    妖怪たち「では、まだ何年も先ですか。」
    銀角大王「何年もかかりはせぬ。見たところ、三蔵には善意を装って近づくほかなく、手荒に捕らえることはできぬ。力ずくで捕まえようとすれば、匂いを嗅ぐことすらかなわん。善意であいつの心を動かし、こちらと心を通わせたと思い込ませるのだ。その善意の中へ計略を忍ばせれば、捕らえられる。」
    妖怪たち「大王、計略で捕らえるおつもりなら、私どもは必要ですか。」
    銀角大王「お前たちは皆、持ち場へ帰れ。ただし大王には知らせるな。兄上が騒ぎだせば、必ず話が漏れて、計略がだめになる。俺には変化の神通力がある。それで捕まえてやる。」
    妖怪たちは散っていった。

- "id": "xy-ch33-025"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，那兩個小妖到了。行者將金箍棒伸開，那妖不曾防備，絆著腳，撲的一跌。爬起來，才看見行者，口裡嚷道：「憊懶，憊懶！若不是我大王敬重你這行人，就和你比較起來。」行者陪笑道：「比較甚麼？道人見道人，都是一家人。」那怪道：「你怎麼睡在這裡絆我一跌？」行者道：「小道童見我這老道人，要跌一跌兒做見面錢。」那妖道：「我大王見面錢只要幾兩銀子，你怎麼跌一跌兒做見面錢？你別是一鄉風，決不是我這裡道士。」行者道：「我當真不是，我是蓬萊山來的。」那妖道：「蓬萊山是海島神仙境界。」行者道：「我不是神仙，誰是神仙？」那妖卻回嗔作喜，上前道：「老神仙，老神仙，我等肉眼凡胎，不能識認，言語衝撞，莫怪，莫怪。」行者道：「我不怪你。常言道：『仙體不踏凡地。』你怎知之？我今日到你山上，要度一個成仙了道的好人。那個肯跟我去？」精細鬼道：「師父，我跟你去。」伶俐蟲道：「師父，我跟你去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    ほどなく、二匹の小妖がやって来た。悟空が金箍棒（きんこぼう）を伸ばすと、油断していた小妖は足を引っかけられ、どさりと転んだ。起き上がって初めて悟空に気づき、わめいた。小妖「ふざけた奴だ、ふざけた奴だ！　うちの大王が道士どもを大切にしていなければ、ただでは済まさないところだぞ。」
    悟空は笑顔を作った。悟空「何を争うことがある。道士と道士が会ったのだから、みな身内ではないか。」
    小妖「なぜこんなところで寝転がり、俺の足を引っかけたんだ。」
    悟空「若い道士が年寄りの道士に会ったのだから、一つ転んで、お目通りの礼にしてもらおうと思ってな。」
    小妖「うちの大王なら、面会の礼には銀を数両取るだけだ。どうしてお前は、転ばせて礼にするんだ。どこかほかの土地の習わしだな。決して、この辺りの道士ではあるまい。」
    悟空「いかにも、違う。俺は蓬萊山（ほうらいさん）から来たのだ。」
    小妖「蓬萊山は、海に浮かぶ仙人の島ではないか。」
    悟空「俺が仙人でなければ、誰が仙人なのだ。」
    小妖は怒りを喜びに変え、前へ進み出た。小妖「仙人さま、仙人さま。私どもは凡人の目と体しか持たず、お見それしておりました。無礼なことを申しましたが、お怒りにならないでください。」
    悟空「怒りはせぬ。昔から『仙人の体は俗界の地を踏まぬ』というが、お前たちにどうして分かろう。今日はこの山へ、仙人となって道を究められる善人を一人、導きに来たのだ。どちらが俺について来る。」
    精細鬼「お師匠さま、私がお供します。」
    伶俐虫「お師匠さま、私がお供します。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「那妖」「那怪」「小妖」とだけある発言は、精細鬼・伶俐虫のどちらかを新たに特定せず「小妖」とした。二匹が一緒と明示される発言のみ集団表示。第27単位の「那怪」は直前の伶俐虫から発話が続くと読んだ。"
- "id": "xy-ch33-026"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者明知故問道：「你二位從那裡來的？」那怪道：「自蓮花洞來的。」「要往那裡去？」那怪道：「奉我大王教命，拿孫行者去的。」行者道：「拿那個？」那怪又道：「拿孫行者。」孫行者道：「可是跟唐僧取經的那個孫行者麼？」那妖道：「正是，正是。你也認得他？」行者道：「那猴子有些無禮。我認得他，我也有些惱他。我與你同拿他去，就當與你助功。」那怪道：「師父，不須你助功。我二大王有些法術，遣了三座大山，把他壓在山下，寸步難移，教我兩個拿寶貝來裝他的。」行者道：「是甚寶貝？」精細鬼道：「我的是紅葫蘆，他的是玉淨瓶。」行者道：「怎麼樣裝他？」小妖道：「把這寶貝的底兒朝天，口兒朝地，叫他一聲，他若應了，就裝在裡面；貼上一張『太上老君急急如律令奉敕』的帖子，他就一時三刻，化為膿了。」行者見說，心中暗驚道：「利害，利害！當時日值功曹報信，說有五件寶貝，這是兩件了。不知那三件又是甚麼東西？」行者笑道：「二位，你把寶貝借我看看。」那小妖那知甚麼訣竅，就於袖中取出兩件寶貝，雙手遞與行者。行者見了，心中暗喜道：「好東西，好東西。我若把尾子一抉，颼的跳起走了，只當是送老孫。」忽又思道：「不好，不好。搶便搶去，只是壞了老孫的名頭。這叫做白日搶奪了。」復遞與他去道：「你還不曾見我的寶貝哩。」那怪道：「師父有甚寶貝？也借與我凡人看看壓災。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    悟空は分かっていながら、わざと尋ねた。悟空「二人はどこから来たのだ。」
    小妖「蓮花洞からです。」
    悟空「どこへ行く。」
    小妖「大王のお言いつけで、孫行者を捕まえに行きます。」
    悟空「誰を捕まえると。」
    小妖はもう一度答えた。小妖「孫行者です。」
    悟空「三蔵について経を取りに行く、あの孫行者か。」
    小妖「そうです、そうです。ご存じなのですか。」
    悟空「あの猿は、少々無礼な奴だな。知っているとも。俺も、あいつには腹を立てている。お前たちと一緒に捕まえに行き、手柄の手助けをしてやろう。」
    小妖「お師匠さま、助けていただくまでもありません。うちの二大王が法術を使い、三つの大山を動かして、奴を山の下へ押さえつけました。一寸も動けないのです。そこで、私たち二人が宝を持って、奴を吸い込みに来たのです。」
    悟空「どんな宝だ。」
    精細鬼「私のは紅葫蘆（べにひさご）、あちらのは玉浄瓶（ぎょくじょうへい）です。」
    悟空「どうやって吸い込むのだ。」
    小妖「宝の底を天へ、口を地へ向けて、奴の名を一声呼びます。返事をすれば、そのまま中へ入ります。『太上老君、急急如律令、勅を奉ず』と書いた札を一枚貼れば、一時三刻のうちに膿になるのです。」
    悟空は話を聞き、内心はっとした。悟空「恐ろしい、恐ろしい。先ほど日値功曹（にっちこうそう）が知らせに来て、五つの宝があると言っていたが、これで二つだ。残りの三つは何だろう。」
    悟空は笑って言った。悟空「二人とも、その宝を貸して、見せてくれないか。」
    小妖たちは、どんな企みがあるかなど、まるで気づかない。袖から二つの宝を取り出し、両手で悟空へ渡した。悟空は見て、ひそかに喜んだ。悟空「いい物だ、いい物だ。ここで尻尾をぴんと立て、ひゅっと跳んで逃げたら、この俺への贈り物になっちまうな。」
    だが、すぐに考え直した。悟空「いや、いかん。奪うのはたやすいが、俺の名に傷がつく。これでは白昼の強盗だ。」
    そこで宝を返して言った。悟空「お前たちは、まだ俺の宝を見ていないな。」
    小妖「お師匠さまは、どんな宝をお持ちなのです。私どものような凡人にも、厄払いに拝ませてください。」

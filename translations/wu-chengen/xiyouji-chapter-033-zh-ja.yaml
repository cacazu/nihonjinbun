  "source_text": "卻說三藏坐在坡前，耳熱眼跳，身體不安，叫聲：「悟空，怎麼悟能這番巡山，去之久而不來？」行者道：「師父還不曉得他的心哩。」三藏道：「他有甚心？」行者道：「師父啊，此山若是有怪，他半步難行，一定虛張聲勢，跑將回來報我。想是無怪，路途平靜，他一直去了。」三藏道：「假若真個去了，卻在那裡相會？此間乃是山野空闊之處，比不得那店市城井之間。」行者道：「師父莫慮，且請上馬。那獃子有些懶惰，斷然走的遲慢。你把馬打動些兒，我們定趕上他，一同去罷。」真個唐僧上馬，沙僧挑擔，行者前面引路上山。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    一方、三蔵は斜面の手前に座っていたが、耳が熱くなり、まぶたがぴくついて、どうにも落ち着かなかった。三蔵「悟空（ごくう）、悟能（ごのう）は今度の山の見回りに出てから、なぜこんなに長く戻らないのだ。」
    悟空「お師匠さまは、まだあいつの腹をご存じないのですね。」
    三蔵「どういう腹づもりなのだ。」
    悟空「お師匠さま、もしこの山に妖怪がいれば、あいつは半歩も先へ進めず、さも大ごとのように騒いで、必ず私のところへ駆け戻って知らせます。妖怪もおらず、道が穏やかなので、そのまま先へ行ったのでしょう。」
    三蔵「本当に先へ行ってしまったなら、どこで落ち合えばよいのだ。ここは広々とした山野で、宿屋や市場のある町とは違うぞ。」
    悟空「ご心配なく。まずは馬にお乗りください。あの間抜けは怠け者ですから、どうせのろのろ歩いています。馬を少し急がせれば、きっと追いつきます。一緒に参りましょう。」
    そこで三蔵は馬に乗り、沙悟浄（さごじょう）は荷を担ぎ、悟空が先に立って道を案内しながら山へ登った。
  "translation_status": "reviewed"
- "id": "xy-ch33-004"
  "section_id": "chapter-33"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那老怪又喚二魔道：「兄弟，你既拿了八戒，斷然就有唐僧。再去巡巡山來，切莫錯過他去。」二魔道：「就行，就行。」你看他急點起五十名小妖，上山巡邏。正走處，只見祥雲縹緲，瑞氣盤旋，二魔道：「唐僧來了。」眾妖道：「唐僧在那裡？」二魔道：「好人頭上祥雲照頂，惡人頭上黑氣沖天。那唐僧原是金蟬長老臨凡，十世修行的好人，所以有這祥雲縹緲。」眾怪都不看見。二魔用手指道：「那不是？」那三藏就在馬上打了一個寒噤；又一指，又打個寒噤。一連指了三指，他就一連打了三個寒噤。心神不寧道：「徒弟啊，我怎麼打寒噤麼？」沙僧道：「打寒噤想是傷食病發了。」行者道：「胡說，師父是走著這深山峻嶺，必然小心虛驚。莫怕，莫怕，等老孫把棒打一路與你壓壓驚。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch33-1500615"
    "precision": "line"
    "url": "https://zh.wikisource.org/wiki/西遊記/第033回"
    "line_start": 120
    "line_end": 120
  "translation_ja": |-
    さて金角大王は、また銀角大王を呼びつけた。金角大王「弟よ、八戒を捕まえたからには、三蔵も必ずいる。もう一度山を見回ってこい。決して取り逃がすな。」
    銀角大王「すぐ行きます、すぐ行きます。」
    銀角大王は急いで五十匹の小妖を選び出し、山を巡らせた。歩いていると、めでたい雲がたなびき、瑞気が渦を巻いているのが見えた。銀角大王「三蔵が来たぞ。」
    妖怪たち「三蔵はどこにおりますか。」
    銀角大王「善人の頭上にはめでたい雲が照り、悪人の頭上には黒い気が天へ立ちのぼる。あの三蔵は、もとは金蝉長老（きんせんちょうろう）が人の世へ下った者で、十度生まれ変わりながら修行を積んだ善人だ。だから、ああしてめでたい雲がたなびいているのだ。」
    妖怪たちには、誰にも見えなかった。銀角大王は手で指し示した。銀角大王「あれではないか。」
    すると三蔵は、馬上でぞくりと身震いした。もう一度指すと、また身震いした。こうして指したのは、合わせて三度。三蔵も、そのたびに一度ずつ身を震わせた。三蔵は心が落ち着かず、言った。三蔵「弟子たちよ、私はどうしてこんなに寒気がするのだろう。」
    沙悟浄「食べ物が障って、具合が悪くなったのでしょうか。」
    悟空「何を言う。こんな深山の険しい峰を行くので、お師匠さまはきっと気を張り、何でもないことにおびえておられるんだ。怖がることはありません。私が道すがら棒を振るって、その驚きを鎮めてさしあげましょう。」
  "translation_status": "reviewed"

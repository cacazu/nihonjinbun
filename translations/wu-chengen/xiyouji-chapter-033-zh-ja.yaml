  "source_text": "好行者，伸下手，把尾上毫毛拔了一根，捻一捻，叫：「變！」即變做一個一尺七寸長的大紫金紅葫蘆，自腰裡拿將出來道：「你看我的葫蘆麼？」那伶俐蟲接在手，看了道：「師父，你這葫蘆長大，有樣範，好看，卻只是不中用。」行者道：「怎的不中用？」那怪道：「我這兩件寶貝，每一個可裝千人哩。」行者道：「你這裝人的，何足稀罕？我這葫蘆，連天都裝在裡面哩。」那怪道：「就可以裝天？」行者道：「當真的裝天。」那怪道：「只怕是謊，就裝與我們看看才信；不然，決不信你。」行者道：「天若惱著我，一月之間，常裝他七八遭，不惱著我，就半年也不裝他一次。」伶俐蟲道：「哥啊，裝天的寶貝，與他換了罷。」精細鬼道：「他裝天的，怎肯與我裝人的相換？」伶俐蟲道：「若不肯啊，貼他這個淨瓶也罷。」行者心中暗喜道：「葫蘆換葫蘆，餘外貼淨瓶：一件換兩件，其實甚相應。」即上前扯住那伶俐蟲道：「裝天可換麼？」那怪道：「但裝天就換，不換我是你的兒子。」行者道：「也罷，也罷，我裝與你們看看。」"

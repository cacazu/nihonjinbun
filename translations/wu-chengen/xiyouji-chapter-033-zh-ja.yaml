  "translation_ja": |-
    悟空は、小妖が本当だと思い込んだのを見ると、また呪文を唱えた。それを察した哪吒が旗を巻き取ると、たちまち真昼の日差しが戻った。小妖は笑った。小妖「見事だ、見事だ！　こんなによい宝と交換しないようでは、本当に一家を養う息子として失格です。」
    精細鬼は瓢箪を渡し、伶俐虫は浄瓶を取り出して、一緒に悟空へ差し出した。悟空は偽の瓢箪を小妖へ渡し、交換した。宝を取り替えたうえ、なおも後腐れなく片をつけようと、へその下から毛を一本抜き、仙気を吹きかけ、一枚の銅銭に変えた。悟空「若いの、この銭で紙を一枚買ってきてくれ。」
    小妖「何に使うのですか。」
    悟空「お前たちと取り交わす契約書を書くのだ。お前たちは、人を入れる二つの宝を、俺の天を収める一つの宝と交換した。後々、年月がたってから、気に入らぬと言い出し、後悔して取り消そうとすると困る。だから、書いて一通ずつ持ち、証拠にしておこう。」
    小妖「ここには筆も墨もありません。何で書きましょう。それより、あなたと誓いを立てましょう。」
    悟空「どんな誓いだ。」
    小妖「私たちは人を入れる二つの宝を合わせて、あなたの天を収める一つの宝と交換します。もし後悔して取り消そうとしたら、一年じゅう、どの季節にも疫病にかかります。」
    悟空は笑った。悟空「俺は決して取り消さん。もし取り消そうとしたら、お前たちと同じく、四季を通じて疫病にかかろう。」

  "origin": "source"
  "source_text": |-
    身穿金甲亮堂堂，頭戴金冠光映映。
    手舉金箍棒一根，足踏雲鞋皆相稱。
    一雙怪眼似明星，兩耳過肩查又硬。
    挺挺身才變化多，聲音響喨如鐘磬。
    尖嘴咨牙弼馬溫，心高要做齊天聖。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 13
  "translation_ja": |-
    身には黄金の鎧がまばゆく、頭には黄金の冠が輝く。
    手に掲げるは一本の金箍棒（きんこぼう・推定。如意金箍棒の略称）、足に履いた雲の靴（くものくつ・推定。雲の上を歩く孫悟空の靴の略称）もよく似合う。
    二つの怪眼は明るく輝く星のよう、肩を越す両耳は張って硬い。
    すらりと立つ体は変化（へんげ。姿を自在に変える術）自在、声は鐘や磬（けい。吊るした石や金属を打ち鳴らす楽器）のように響き渡る。
    尖った口に歯をむき出す弼馬温、志高く斉天聖（せいてんせい・推定。斉天大聖を縮めた詩中の呼び名）を望んでいる。
  "translation_status": "reviewed"
- "id": "xy-ch04-015"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "巨靈神厲聲高叫道：「那潑猴！你認得我麼？」大聖聽言，急問道：「你是那路毛神？老孫不曾會你，你快報名來。」巨靈神道：「我把你那欺心的猢猻！你是認不得我。我乃高上神霄托塔李天王部下先鋒巨靈天將，今奉玉帝聖旨，到此收降你。你快卸了裝束，歸順天恩，免得這滿山諸畜遭誅；若道半個不字，教你頃刻化為齏粉。」猴王聽說，心中大怒道：「潑毛神！休誇大口，少弄長舌。我本待一棒打死你，恐無人去報信。且留你性命，快早回天，對玉皇說：他甚不用賢。老孫有無窮的本事，為何教我替他養馬？你看我這旌旗上字號，若依此字號陞官，我就不動刀兵，自然的天地清泰；如若不依，時間就打上靈霄寶殿，教他龍床定坐不成。」這巨靈神聞此言，急睜睛迎風觀看，果見門外豎一高竿，竿上有旌旗一面，上寫著「齊天大聖」四大字。巨靈神冷笑三聲道：「這潑猴，這等不知人事，輒敢無狀，你就要做齊天大聖。好好的吃吾一斧。」劈頭就砍將去。那猴王正是會家不忙，將金箍棒應手相迎。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 14
  "translation_ja": |-
    巨霊神は鋭く大声を上げた。
    巨霊神「この不埒（ふらち・推定。道理や礼儀から外れていること）な猿め！　我を知っているか？」
    斉天大聖は聞くと、すぐに問い返した。
    斉天大聖「お前はどこの下っ端の神だ？　俺は会ったこともない。早く名を名乗れ」
    巨霊神「この不心得な猿めが！　我を知らぬのだな。我は高き神霄（しんしょう・推定。高く神聖な天界）の托塔李天王に仕える先鋒、巨霊天将（きょれいてんしょう・推定。巨霊神が名乗る天界の将軍としての称号）だ。今、玉帝の勅命を奉じ、お前を降伏させに来た。早く武装を解き、天の恩に従え。さすれば山じゅうの畜生どもも誅殺（ちゅうさつ・推定。罪があるとして討ち殺すこと）を免れよう。ひと言でも嫌だと言えば、たちまち粉々にしてくれる」
    斉天大聖は聞くと、心中大いに怒った。
    斉天大聖「ろくでもない下っ端の神め！　大口をたたくな、べらべらしゃべるな。本当なら一撃で叩き殺してやるところだが、そうすると知らせに戻る者がいなくなる。ひとまず命は助けてやる。早く天へ帰って玉皇（ぎょくこう・推定。玉帝の別称）に伝えろ。あいつはまったく賢者を用いることを知らん。この俺には尽きぬ技があるのに、なぜ奴の馬を養わせる？　俺の旗に書いた名を見ろ。この名どおりの官へ昇進させるなら、俺も兵を動かさず、天地はおのずと平穏になる。承知しなければ、すぐに霊霄宝殿へ攻め上がり、奴が玉座に落ち着いて座れないようにしてやる」
    巨霊神は聞くと、すぐに目を見開き、風上を見やった。なるほど洞門の外に高い竿が立ち、一枚の旗に「斉天大聖」の四文字が大きく書いてある。巨霊神は三度冷ややかに笑った。
    巨霊神「この不埒な猿め、そこまで世の道理を知らず、無礼にも斉天大聖になろうというのか。我の斧をたっぷり受けてみよ」
    頭めがけて斬りかかった。斉天大聖は心得のある者の落ち着きで、如意金箍棒を手に応じて差し出し、迎え撃った。ここに見事な戦いが始まる。
  "translation_status": "reviewed"
- "id": "xy-ch04-016"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": "棒名如意，斧號宣花。他兩個乍相逢，不知深淺，斧和棒，左右交加。一個暗藏神妙，一個大口稱誇。使動法，噴雲曖霧；展開手，播土揚沙。天將神通就有道，猴王變化實無涯。棒舉卻如龍戲水，斧來猶似鳳穿花。巨靈名望傳天下，原來本事不如他：大聖輕輕掄鐵棒，著頭一下滿身麻。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 15
  "translation_ja": "棒の名は如意（にょい・推定。詩中で如意金箍棒を縮めた名）、斧の名は宣花（せんか・推定。詩中で宣花斧を縮めた名）。二人は初めて相まみえ、相手の力のほどは知らぬまま、斧と棒を左右に打ち交わす。一人はひそかに妙技を蔵し、一人は大口をたたいて誇る。術を使えば雲を噴き、霧をかすませ、腕を振るえば土を飛ばし、砂を巻き上げる。天将の神通力にも道の心得はあるが、猴王の変化はまことに果てしない。棒を挙げれば竜が水に戯れるよう、斧が来れば鳳凰が花をくぐるよう。巨霊（きょれい・推定。巨霊神の略称）の名は天下に知れ渡っていたが、実の腕前は猴王に及ばない。大聖が軽々と鉄棒を振り、頭上へ一撃すれば、全身がしびれてしまう。"
  "translation_status": "reviewed"
- "id": "xy-ch04-017"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "巨靈神抵敵他不住，被猴王劈頭一棒，慌忙將斧架隔，扢扠的一聲，把個斧柄打做兩截，急撤身敗陣逃生。猴王笑道：「膿包，膿包。我已饒了你，你快去報信，快去報信。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 16
  "translation_ja": |-
    巨霊神は相手に抗しきれず、斉天大聖が頭めがけて振り下ろした一撃に、慌てて斧を差し上げて防いだ。ばきりという音とともに斧の柄は真っ二つになり、急いで身を引き、敗走して命を拾った。斉天大聖は笑った。
    斉天大聖「腰抜けめ、腰抜けめ！　命は助けてやったぞ。早く知らせに行け、知らせに行け！」
  "translation_status": "reviewed"
- "id": "xy-ch04-018"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "巨靈神回至營門，徑見托塔天王，忙哈哈跪下道：「弼馬溫果是神通廣大，末將戰他不得，敗陣回來請罪。」李天王發怒道：「這廝剉吾銳氣，推出斬之！」傍邊閃出哪吒太子拜告：「父王息怒，且恕巨靈之罪。待孩兒出師一遭，便知深淺。」天王聽諫，且教回營待罪管事。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 17
  "translation_ja": |-
    巨霊神は陣門へ帰ると、まっすぐ李天王の前へ進み、慌ただしくひざまずいた。
    巨霊神「弼馬温は、まことに神通力の大きな者でございます。末将（まっしょう・推定。武将が自分をへりくだっていう語）では敵わず、敗れて戻りました。どうかお裁きください」
    李天王は怒った。
    李天王「この者、我が軍の鋭気をくじきおった。引き出して斬れ！」
    傍らから哪吒が進み出て、拝して申し上げた。
    哪吒「父上、お怒りをお鎮めください。ひとまず巨霊の罪をお許し願います。私が一度出陣すれば、相手の力のほども分かりましょう」
    李天王は諫めを聞き入れ、ひとまず巨霊神を陣へ戻し、処分を待ちながら務めを続けるよう命じた。
  "translation_status": "reviewed"
- "id": "xy-ch04-019"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這哪吒太子甲冑齊整，跳出營盤，撞至水簾洞外。那悟空正來收兵，見哪吒來的勇猛。好太子："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 18
  "translation_ja": "哪吒は鎧兜を整え、陣営から跳び出して水簾洞の外へ押し寄せた。斉天大聖はちょうど兵を収めようとしており、勇ましくやって来る哪吒を見た。なんと見事な哪吒であろう。"
  "translation_status": "reviewed"
- "id": "xy-ch04-020"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": "總角才遮顖，披毛未蓋肩。神奇多敏悟，骨秀更清妍。誠為天上麒麟子，果是煙霞彩鳳仙。龍種自然非俗相，妙齡端不類塵凡。身帶六般神器械，飛騰變化廣無邊。今受玉皇金口詔，敕封海會號三壇。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 19
  "translation_ja": "両角に結った髪は、ようやく頭の頂を覆うほど。垂らした髪も、まだ肩には届かない。不思議なほど聡明で機敏、骨格は秀で、姿はいよいよ清らかで美しい。まことに天上の麒麟児（きりんじ・推定。才知に優れた子供をたたえる語）、まさしく霞の中の彩鳳（さいほう・推定。色鮮やかな羽を持つ鳳凰）の仙人。竜の血筋ゆえ、おのずと俗人の相ではなく、若い年頃ながら、まるで下界の者とは違う。身には六種の神の武器を帯び、飛翔も変化も広大無辺（こうだいむへん・推定。広く大きく、果てがないこと）。今、玉皇じきじきの詔（みことのり。帝王が下す命令）を受け、海会（かいえ・推定。聖者が海のように大勢集うこと。ここでは哪吒の称号の一部）をつかさどり三壇（さんだん・推定。三つの壇。ここでは哪吒の称号の一部）と号する大神に封ぜられた。"
  "translation_status": "reviewed"
- "id": "xy-ch04-021"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空迎近前來問曰：「你是誰家小哥？闖近吾門，有何事幹？」哪吒喝道：「潑妖猴！豈不認得我？我乃托塔天王三太子哪吒是也，今奉玉帝欽差，至此捉你。」悟空笑道：「小太子，你的嬭牙尚未退，胎毛尚未乾，怎敢說這般大話？我且留你的性命，不打你。你只看我旌旗上是甚麼字號，拜上玉帝：是這般官銜，再也不須動眾，我自皈依；若是不遂我心，定要打上靈霄寶殿。」哪吒擡頭看處，乃「齊天大聖」四字。哪吒道：「這妖猴能有多大神通，就敢稱此名號？不要怕，吃吾一劍。」悟空道：「我只站下不動，任你砍幾劍罷。」那哪吒奮怒，大喝一聲，叫：「變！」即變做三頭六臂，惡狠狠，手持著六般兵器，乃是斬妖劍、砍妖刀、縛妖索、降妖杵、繡毬兒、火輪兒，丫丫叉叉，撲面來打。悟空見了，心驚道：「這小哥倒也會弄些手段。莫無禮，看我神通。」好大聖，喝聲：「變！」也變做三頭六臂；把金箍棒幌一幌，也變作三條。六隻手拿著三條棒架住。這場鬥，真個是地動山搖，好殺也："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 20
  "translation_ja": |-
    斉天大聖は進み出て迎え、尋ねた。
    斉天大聖「お前は、どこの家の坊やだ？　俺の門まで押しかけて、何の用だ？」
    哪吒は怒鳴った。
    哪吒「不埒な妖猿め！　我を知らぬのか。我こそ托塔天王（たくとうてんのう。李靖の略称）の三太子（さんたいし・推定。ここでは李天王の第三子である哪吒を指す）、哪吒だ。玉帝からじきじきに命を受け、お前を捕らえに来た」
    斉天大聖は笑った。
    斉天大聖「小太子よ、まだ乳歯も抜けず、産毛も乾かんくせに、よくもそんな大口をたたくものだ。ひとまず命は助けてやる。お前を打ちはせん。俺の旗に何と書いてあるかを見て、玉帝へ申し上げろ。この官名を授けるなら、もう大勢の兵を動かすまでもなく、俺から帰順（きじゅん・推定。敵対をやめ、相手の支配に従うこと）する。望みをかなえないなら、必ず霊霄宝殿へ攻め上がるぞ」
    哪吒が顔を上げて見ると、「斉天大聖」の四文字だった。
    哪吒「この妖猿、どれほどの神通力があって、その名を称する気だ？　怖じけるな。我の剣を受けてみよ」
    斉天大聖「俺はここに立ったまま動かん。好きなだけ斬りつけてみろ」
    哪吒は怒りに燃え、声を張り上げた。
    哪吒「変われ！」
    たちまち三つの頭、六本の腕となり、凶暴な形相で六種の武器を手にした。斬妖剣（ざんようけん・推定。哪吒が持つ、妖魔を斬る剣）、砍妖刀（かんようとう・推定。哪吒が持つ、妖魔を切り倒す刀）、縛妖索（ばくようさく・推定。哪吒が持つ、妖魔を縛る綱）、降妖杵（ごうようしょ・推定。哪吒が持つ、妖魔を打ち伏せる杵形の武器）、刺繍の毬（ししゅうのまり・推定。哪吒が武器として用いる刺繍入りの毬）、火の輪（ひのわ・推定。哪吒が武器として用いる燃える輪）である。それらを入り乱れさせ、正面から襲いかかった。斉天大聖は見ると、心中驚いて言った。
    斉天大聖「この坊や、なかなかの術を使うじゃないか。無礼はよせ。俺の神通力を見ろ」
    見事な斉天大聖も一声叫んだ。
    斉天大聖「変われ！」
    こちらも三つの頭、六本の腕となり、如意金箍棒をひと振りして三本に変えた。六つの手で三本の棒を取り、相手の攻撃を受け止める。この戦い、まことに地は揺れ山は震え、すさまじい争いとなった。
  "translation_status": "reviewed"
- "id": "xy-ch04-022"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": "六臂哪吒太子，天生美石猴王，相逢真對手，正遇本源流。那一個蒙差來下界，這一個欺心鬧鬥牛。斬妖寶劍鋒芒快，砍妖刀狠鬼神愁；縛妖索子如飛蟒，降妖大杵似狼頭；火輪掣電烘烘艷，往往來來滾繡毬。大聖三條如意棒，前遮後擋運機謀。苦爭數合無高下，太子心中不肯休。把那六件兵器多教變，百千萬億照頭丟。猴王不懼呵呵笑，鐵棒翻騰自運籌。以一化千千化萬，滿空亂舞賽飛虯。諕得各洞妖王都閉戶，遍山鬼怪盡藏頭。神兵怒氣雲慘慘，金箍鐵棒響颼颼。那壁廂，天丁吶喊人人怕；這壁廂，猴怪搖旗個個憂。發狠兩家齊鬥勇，不知那個剛強那個柔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 21
  "translation_ja": "六本腕の哪吒太子（なたたいし・推定。哪吒に太子の敬称を付けた呼び名）と、天の生んだ美しい石の猴王。真に好敵手と巡り合い、まさしく同じ根源に通じる者と出会った。あちらは命を受けて下界へ来たり、こちらは不遜にも斗（と・推定。中国の星座区分でいう斗宿）・牛（ぎゅう・推定。中国の星座区分でいう牛宿）の星々の天界を騒がす。妖を斬る宝剣は鋭く、妖を断つ刀はすさまじく、鬼神（きしん・推定。人の世を超えた霊的な存在である神や鬼）すら憂える。妖を縛る索は飛ぶ大蛇のよう、妖を降す大杵は狼の頭のよう。火の輪は稲妻を放って赤々と燃え、刺繍の毬は行きつ戻りつ転がる。大聖の三本の如意棒（にょいぼう・推定。如意金箍棒の略称）は、前を遮り後ろを防ぎ、巧みに策を巡らせる。何合（ごう・推定。武器を交える回数を数える言葉）も激しく争ってなお優劣はなく、太子の心は休もうとしない。六つの武器をさらに変じ、百千万億に増やして頭上へ投げつける。猴王は恐れず、からからと笑い、鉄棒をひるがえして自ら策を繰り出す。一を千に、千を万に変じ、空いっぱいに乱舞させれば、飛ぶ竜にも勝る勢い。恐れた各洞の妖王はみな戸を閉ざし、山じゅうの鬼怪はことごとく頭を隠す。神の武器は怒気を発して雲を暗くし、金箍（きんこ・推定。棒にはめられた金の輪）の鉄棒はひゅうひゅうと鳴る。あちらでは天兵がときの声を上げ、誰もが恐れを抱き、こちらでは猿の妖怪が旗を振り、一匹一匹が気をもむ。両者とも激しく勇を競い、どちらが強く、どちらが弱いとも分からない。"
  "translation_status": "reviewed"
- "id": "xy-ch04-023"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三太子與悟空各騁神威，鬥了個三十回合。那太子六般兵，變做千千萬萬；孫悟空金箍棒，變作萬萬千千。半空中似雨點流星，不分勝負。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 22
  "translation_ja": "哪吒と斉天大聖は、互いに神威（しんい・推定。神の威力や威厳）を振るい、三十合を戦った。哪吒の六種の武器は千にも万にも変わり、斉天大聖の如意金箍棒も万にも千にも増える。空中は雨粒や流星が降るようで、勝敗はつかなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch04-024"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來悟空手疾眼快，正在那混亂之時，他拔下一根毫毛，叫聲：「變！」就變做他的本相，手挺著棒，演著哪吒；他的真身，卻一縱，趕至哪吒腦後，著左膊上一棒打來。哪吒正使法間，聽得棒頭風響，急躲閃時，不能措手，被他著了一下，負痛逃走。收了法，把六件兵器依舊歸身，敗陣而回。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 23
  "translation_ja": |-
    もともと斉天大聖は手も目も素早い。この入り乱れた最中に、毛を一本抜いて叫んだ。
    斉天大聖「変われ！」
    毛は斉天大聖自身の姿となり、棒を突き出して哪吒と渡り合った。その間に本体はひと跳びして哪吒の背後へ回り、左腕めがけて一棒を打ち下ろした。哪吒はまさに術を使っている最中、棒の先が風を切る音を聞き、急いでかわそうとしたが、手を打つ間もなく一撃を受けた。痛みに耐えながら逃れ、術を収め、六つの武器を元どおり身に戻して、敗走した。
  "translation_status": "reviewed"
- "id": "xy-ch04-025"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那陣上李天王早已看見，急欲提兵助戰，不覺太子倏至面前，戰兢兢報道：「父王，弼馬溫真個有本事，孩兒這般法力，也戰他不過，已被他打傷膊也。」天王大驚失色道：「這廝恁的神通，如何取勝？」太子道：「他洞門外豎一竿旗，上寫『齊天大聖』四字。親口誇稱，教玉帝就封他做齊天大聖，萬事俱休；若還不是此號，定要打上靈霄寶殿哩。」天王道：「既然如此，且不要與他相持，且去上界，將此言回奏，再多遣天兵，圍捉這廝，未為遲也。」太子負痛，不能復戰，故同天王回天啟奏不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 24
  "translation_ja": |-
    陣中の李天王は早くから様子を見ており、急いで兵を率いて加勢しようとした。すると、いつの間にか哪吒が目の前へ戻り、震えながら報告した。
    哪吒「父上、弼馬温は本当に腕が立ちます。私のこれほどの法力（ほうりき・推定。仏法や修行から得るとされる不思議な力）をもってしても敵わず、腕を打たれてしまいました」
    李天王は仰天して顔色を変えた。
    李天王「あやつにそれほどの神通力があるとは。どうすれば勝てるのだ？」
    哪吒「洞門の外に旗を一本立て、『斉天大聖』の四文字を大きく書いています。玉帝が自分を斉天大聖に封じれば、すべてを収めるが、その名でなければ必ず霊霄宝殿へ攻め上がると、本人が大言しておりました」
    李天王「それなら、ひとまずあやつと争うのはやめよう。まず天上へ戻り、その言葉を奏上して、さらに多くの天兵を遣わしてもらい、取り囲んで捕らえても遅くはない」
    哪吒は傷が痛んで再び戦うことができず、李天王とともに天へ戻り、奏上することとなった。そちらの話は、ひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch04-026"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那猴王得勝歸山，那七十二洞妖王與那六弟兄，俱來賀喜，在洞天福地，飲樂無比。他卻對六弟兄說：「小弟既稱齊天大聖，你們亦可以大聖稱之。」內有牛魔王忽然高叫道：「賢弟言之有理，我即稱做平天大聖。」蛟魔王道：「我稱做覆海大聖。」鵬魔王道：「我稱混天大聖。」獅狔王道：「我稱移山大聖。」獼猴王道：「我稱通風大聖。」\U000247F9狨王道：「我稱驅神大聖。」此時七大聖自作自為，自稱自號，耍樂一日，各散訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 25
  "translation_ja": |-
    一方、勝って山へ帰った斉天大聖には、七十二洞の妖王と六人の義兄弟がみな祝いに来て、恵まれた仙境でこの上なく楽しく酒を酌み交わしていた。斉天大聖は六人に言った。
    斉天大聖「弟分の俺が斉天大聖と称したのですから、兄さんたちも大聖と名乗ってはいかがですか」
    その中で牛魔王（ぎゅうまおう。孫悟空と義兄弟となった六人の魔王の一人）が、突然大声を上げた。
    牛魔王「弟よ、それはもっともだ。俺は平天大聖（へいてんたいせい・推定。牛魔王が自ら定めた大聖の称号）と名乗ろう」
    蛟魔王（こうまおう・推定。孫悟空と義兄弟となった六人の魔王の一人）「俺は覆海大聖（ふくかいたいせい・推定。蛟魔王が自ら定めた大聖の称号）と名乗ろう」
    鵬魔王（ほうまおう・推定。孫悟空と義兄弟となった六人の魔王の一人）「俺は混天大聖（こんてんたいせい・推定。鵬魔王が自ら定めた大聖の称号）と名乗ろう」
    獅狔王（しじおう・推定。孫悟空の義兄弟で、移山大聖を名乗る魔王）「俺は移山大聖（いざんたいせい・推定。獅狔王が自ら定めた大聖の称号）と名乗ろう」
    獼猴王（びこうおう・推定。孫悟空と義兄弟となった六人の魔王の一人。美猴王とは別人）「俺は通風大聖（つうふうたいせい・推定。獼猴王が自ら定めた大聖の称号）と名乗ろう」
    禺狨王（ぐじゅうおう・推定。孫悟空と義兄弟となった六人の魔王の一人）「俺は駆神大聖（くしんたいせい・推定。禺狨王が自ら定めた大聖の称号）と名乗ろう」
    こうして七大聖（しちたいせい・推定。孫悟空と六人の義兄弟の総称）は、勝手気ままに自分で名を称し、号を定め、一日遊び楽しんでから、それぞれ帰っていった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "この固定版は「獅狔王」であり、第三回の「獅駝王」と表記が異なる。訳文にも獅狔王を残し、異同の校訂は留保する。"
- "id": "xy-ch04-027"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那李天王與三太子領著眾將，直至靈霄寶殿，啟奏道：「臣等奉聖旨出師下界，收伏妖仙孫悟空，不期他神通廣大，不能取勝，仍望萬歲添兵剿除。」玉帝道：「諒一妖猴，有多少本事，還要添兵？」太子又近前奏道：「望萬歲赦臣死罪。那妖猴使一條鐵棒，先敗了巨靈神，又打傷臣臂膊。洞門外立一竿旗，上書『齊天大聖』四字。道是封他這官職，即便休兵來投；若不是此官，還要打上靈霄寶殿也。」玉帝聞言，驚訝道：「這妖猴何敢這般狂妄？著眾將即刻誅之。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 26
  "translation_ja": |-
    さて、李天王と哪吒は諸将を率い、まっすぐ霊霄宝殿へ進んで奏上した。
    李天王と哪吒「臣らは勅命を奉じて下界へ出陣し、妖仙孫悟空を降そうといたしましたが、思いのほか神通力が大きく、勝つことができませんでした。どうか陛下、さらに兵を増やして討ち滅ぼしてくださいますよう」
    玉帝「たかが一匹の妖猿に、どれほどの力があるというのだ。さらに増援を求めるのか？」
    哪吒はまた前へ進んで奏上した。
    哪吒「どうか陛下、臣の死罪をお許しください。あの妖猿は鉄棒を一本使い、まず巨霊神を破り、さらに臣の腕を打ち傷つけました。洞門の外に旗を一本立て、『斉天大聖』の四文字を大きく記しております。この官職に封じられるなら、ただちに戦をやめて帰順するが、そうでなければ霊霄宝殿へ攻め上がると言っておりました」
    玉帝は聞いて、驚きあきれた。
    玉帝「あの妖猿、どうしてそこまで思い上がるのだ。諸将は即刻これを誅せよ」
  "translation_status": "reviewed"
- "id": "xy-ch04-028"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說間，班部中又閃出太白金星，奏道：「那妖猴只知出言，不知大小。欲加兵與他爭鬥，想一時不能收伏，反又勞師。不若萬歲大捨恩慈，還降招安旨意，就教他做個齊天大聖。只是加他個空銜，有官無祿便了。」玉帝道：「怎麼喚做『有官無祿』？」金星道：「名是齊天大聖，只不與他事管，不與他俸祿，且養在天壤之間，收他的邪心，使不生狂妄，庶乾坤安靖，海宇得清寧也。」玉帝聞言道：「依卿所奏。」即命降了詔書，仍著金星領去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 27
  "translation_ja": |-
    話の最中、列の中から再び太白金星が進み出て奏上した。
    太白金星「あの妖猿は口に出すことだけを知り、身のほどをわきまえておりません。兵を増やして戦っても、すぐには降せず、かえって軍を疲れさせるでしょう。陛下が大いなる慈悲をお示しになり、もう一度招安（しょうあん。反抗する者を許し、官職などを与えて従わせること）の勅命を下して、斉天大聖にしてやるのがよろしいかと存じます。ただし名ばかりの称号を与え、官はあっても俸禄（ほうろく・推定。役人に支給する報酬）はないことにすればよいのです」
    玉帝「『官はあっても俸禄はない』とは、どういうことか？」
    太白金星「名は斉天大聖としながら、何の務めも任せず、俸禄も与えず、ひとまず天地の間で養っておくのです。邪な心を収めさせ、思い上がりを起こさせなければ、天地も安らぎ、天下も清く静かに治まりましょう」
    玉帝は聞くと答えた。
    玉帝「そなたの奏上どおりにせよ」
    さっそく詔書（しょうしょ。帝王の命令を記した文書）を下し、再び太白金星に持っていかせた。
  "translation_status": "reviewed"
- "id": "xy-ch04-029"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "金星復出南天門，直至花果山水簾洞外觀看。這番比前不同，威風凜凜，殺氣森森，各樣妖精，無般不有。一個個都執劍拈槍，拿刀弄杖的在那裡咆哮跳躍。一見金星，皆上前動手。金星道：「那眾頭目來，累你去報你大聖知之：吾乃上帝遣來天使，有聖旨在此請他。」眾妖即跑入報道：「外面有一老者，他說是上界天使，有旨意請你。」悟空道：「來得好，來得好。想是前番來的那太白金星。那次請我上界，雖是官爵不堪，卻也天上走了一次，認得那天門內外之路。今番又來，定有好意。」教眾頭目大開旗鼓，擺隊迎接。大聖即帶引群猴，頂冠貫甲，甲上罩了赭黃袍，足踏雲履，急出洞門，躬身施禮，高叫道：「老星請進，恕我失迎之罪。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 28
  "translation_ja": |-
    太白金星はまた南天門を出て、まっすぐ花果山の水簾洞へ来た。外から見ると、今回は前とは違い、威風は凜々として、殺気が立ちこめていた。ありとあらゆる妖怪がそろい、一人一人が剣を執り槍をつかみ、刀や杖を振り回し、吠えながら跳びはねている。太白金星を見るなり、みな前へ出て手をかけようとした。
    太白金星「頭目たち、こちらへ。すまないが、お前たちの大聖へ知らせてくれ。私は上帝（じょうてい・推定。ここでは玉帝の別称）から遣わされた天の使者で、大聖をお招きする勅命を持っている」
    妖怪たちはすぐに駆け込んで報告した。
    妖怪たち「外に老人が一人おります。天上の使者で、大聖をお招きする勅命を持っていると申しております」
    斉天大聖「よく来た、よく来た。きっと前に来た太白金星だ。あのとき天上に招かれて、官位はひどいものだったが、ともかく天へ一度行って、天門の内外の道を覚えた。今度また来たからには、きっと好意があってのことだろう」
    斉天大聖は頭目たちに、旗と太鼓を盛大に繰り出し、列を整えて迎えるよう命じた。斉天大聖は猿たちを率い、冠をかぶり、鎧を着け、その上に赭黄色の袍を羽織り、雲の靴を履いて、急いで洞門を出た。身をかがめて礼をし、大きな声で呼びかけた。
    斉天大聖「金星さま、どうぞお入りください。お迎えが遅れた失礼をお許しください」
  "translation_status": "reviewed"
- "id": "xy-ch04-030"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "金星趨步向前，徑入洞內，面南立著道：「今告大聖：前者因大聖嫌惡官小，躲離御馬監，當有本監中大小官員奏了玉帝。玉帝傳旨道：『凡授官職，皆由卑而尊，為何嫌小？』即有李天王領哪吒下界取戰。不知大聖神通，故遭敗北，回天奏道：『大聖立一竿旗，要做齊天大聖。眾武將還要支吾，是老漢力為大聖冒罪奏聞，免興師旅，請大王授籙。玉帝准奏，因此來請。」悟空笑道：「前番動勞，今又蒙愛，多謝，多謝！但不知上天可與我齊天大聖之官銜也？」金星道：「老漢以此銜奏准，方敢領旨而來；如有不遂，只坐罪老漢便是。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 29
  "translation_ja": |-
    太白金星は足早に進み、洞内に入って南を向いて立った。
    太白金星「大聖、お話し申し上げます。先日は官位の低さを嫌って御馬監を離れられたため、監内の大小の役人たちが玉帝に奏上しました。玉帝は『およそ官位は、低いところから高いところへ進むものなのに、なぜ低いと不満を抱くのか』と仰せになりました。そこへ李天王が哪吒を率いて下界へ戦いに来たのですが、大聖の神通力を知らなかったため敗れ、天に戻って『大聖は旗を一本立て、斉天大聖になろうとしております』と奏上したのです。武将たちはなお抗おうとしましたが、この私が、大聖のために罪を問われるのも覚悟で懸命に奏上し、軍を起こさず、大王を仙籍（せんせき・推定。仙人としての身分を記す名簿）に迎えるようお願いしました。玉帝がお聞き届けになったので、お招きに参ったのです」
    斉天大聖は笑って答えた。
    斉天大聖「先日はご足労いただき、今度もお心にかけてくださって、ありがとうございます、ありがとうございます。ただ、天上では本当に斉天大聖の官名をいただけるのでしょうか？」
    太白金星「この名で奏上してお許しを得たからこそ、勅命を受けて参ったのです。もしご希望どおりでなければ、この私だけを罪にお問いください」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「回天奏道：『大聖立一竿旗，要做齊天大聖。」の内側引用を閉じる符号が底本にない。原文は変更せず、文脈に従って訳文ではこの報告の後で引用を閉じた。「是老漢力為大聖冒罪奏聞」以下の老漢は太白金星本人の自称と解する。句読の厳密な校訂は未実施。"
- "id": "xy-ch04-031"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空大喜，懇留飲宴不肯，遂與金星縱著祥雲，到南天門外。那些天丁天將都拱手相迎。徑入靈霄殿下。金星拜奏道：「臣奉詔宣弼馬溫孫悟空已到。」玉帝道：「那孫悟空過來，今宣你做個齊天大聖，官品極矣，但切不可胡為。」這猴亦止朝上唱個喏，道聲「謝恩」。玉帝即命工幹官張、魯二班，在蟠桃園右首，起一座齊天大聖府，府內設個二司：一名安靜司，一名寧神司。司俱有仙吏，左右扶持。又差五斗星君送悟空去到任，外賜御酒二瓶，金花十朵，著他安心定志，再勿胡為。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 30
  "translation_ja": |-
    斉天大聖は大いに喜び、酒宴にと懸命に引き留めたが、太白金星は応じなかった。そこで、ともに瑞雲（ずいうん・推定。めでたい兆しとされる美しい雲）に乗り、南天門の外へ来た。天兵も天将も、みな両手を組んで迎えた。そのまま霊霄宝殿の下へ進むと、太白金星が拝礼して奏上した。
    太白金星「臣、詔を奉じ、弼馬温孫悟空を召し連れてまいりました」
    玉帝「孫悟空、こちらへ参れ。今、そなたを斉天大聖に任ずる。官の位はこれで極まった。ただし、決して勝手なことをしてはならぬ」
    この猿はやはり、玉帝に向かって声を上げ、両手を組んで一礼するだけで、ひと言述べた。
    斉天大聖「ご恩に感謝します」
    玉帝はただちに工事をつかさどる張班（ちょうはん・推定。天宮の建築をつかさどる神の役人）と魯班（ろはん。天宮の建築をつかさどる神の役人）の二官に命じ、蟠桃園（ばんとうえん。天界にある仙桃の園）の右側に斉天大聖府（せいてんたいせいふ・推定。天界に設けられた孫悟空の屋敷）を一棟建てさせた。府内には二つの司を設け、一つを安静司（あんせいし・推定。斉天大聖府の内部に置かれた役所の一つ）、一つを寧神司（ねいしんし・推定。斉天大聖府の内部に置かれた役所の一つ）と名づけた。それぞれの司には仙吏（せんり・推定。仙界の役人）を置き、左右から補佐させた。また五斗星君（ごとせいくん・推定。五方の星をつかさどる神々）に命じて斉天大聖を赴任先へ送らせ、さらに御酒二瓶と金花（きんか。金で作った花形の飾り）十輪を賜い、心を落ち着け、志を定めて、二度と勝手なことをしないよう言い聞かせた。
  "translation_status": "reviewed"
- "id": "xy-ch04-032"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那猴王信受奉行，即日與五斗星君到府，打開酒瓶，同眾盡飲。送星官回轉本宮，他才遂心滿意，喜地歡天，在於天宮快樂，無掛無礙。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 31
  "translation_ja": "斉天大聖はありがたく承って仰せに従い、その日のうちに五斗星君とともに斉天大聖府へ来ると、酒瓶を開け、一同とすっかり飲み干した。星官を送り、それぞれの宮へ帰ってもらうと、ようやく望みがかなって満足し、天にも地にも躍り上がる心地で喜んだ。天宮で楽しく暮らし、気にかかることも、妨げとなることもない。まさしく、"
  "translation_status": "reviewed"
- "id": "xy-ch04-033"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": "仙名永注長生籙，不墮輪迴萬古傳。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 32
  "translation_ja": "仙人の名は永く長生（ちょうせい・推定。長く生き続けること）の名簿に記され、輪廻（りんね・推定。死んで生まれ変わることを繰り返すこと）に落ちず、万古（ばんこ・推定。遠い昔から続く長い年月。ここでは永久の意）に伝わる。"
  "translation_status": "reviewed"
- "id": "xy-ch04-034"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 33
  "translation_ja": "さて、この先どうなるか。それは次回の物語をお聞きいただきたい。"
  "translation_status": "reviewed"

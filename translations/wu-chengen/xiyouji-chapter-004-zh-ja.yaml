  "origin": "source"
  "source_text": "一朝閑暇，眾監官都安排酒席，一則與他接風，二則與他賀喜。正在歡飲之間，猴王忽停杯問曰：「我這弼馬溫是個甚麼官銜？」眾曰：「官名就是此了。」又問：「此官是個幾品？」眾道：「沒有品從。」猴王道：「沒品，想是大之極也？」眾道：「不大，不大，只喚做未入流。」猴王道：「怎麼叫做『未入流』？」眾道：「末等。這樣官兒最低最小，只可與他看馬。似堂尊到任之後，這等慇懃，餵得馬肥，只落得道聲『好』字；如稍有些尪羸，還要見責；再十分傷損，還要罰贖問罪。」猴王聞此，不覺心頭火起，咬牙大怒道：「這般藐視老孫！老孫在那花果山稱王稱祖，怎麼哄我來替他養馬？養馬者，乃後生小輩下賤之役，豈是待我的？不做他，不做他，我將去也。」忽喇的一聲，把公案推倒，耳中取出寶貝，幌一幌，碗來粗細，一路解數，直打出御馬監，徑至南天門。眾天丁知他受了仙籙，乃是個弼馬溫，不敢阻當，讓他打出天門去了。"
  "source_languages":

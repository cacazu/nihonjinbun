  "source_text": "正飲酒歡會間，有人來報道：「大王，門外有兩個獨角鬼王，要見大王。」猴王道：「教他進來。」那鬼王整衣跑入洞中，倒身下拜。美猴王問他：「你見我何幹？」鬼王道：「久聞大王招賢，無由得見；今見大王授了天籙，得意榮歸，特獻赭黃袍一件，與大王稱慶。肯不棄鄙賤，收納小人，亦得效犬馬之勞。」猴王大喜，將赭黃袍穿起。眾等欣然排班朝拜。即將鬼王封為前部總督先鋒。鬼王謝恩畢，復啟道：「大王在天許久，所授何職？」猴王道：「玉帝輕賢，封我做個甚麼『弼馬溫』。」鬼王聽言，又奏道：「大王有此神通，如何與他養馬？就做個齊天大聖，有何不可？」猴王聞說，歡喜不勝，連道幾個「好！好！好！」教四健將：「就替我快置個旌旗，旗上寫『齊天大聖』四大字，立竿張掛。自此以後，只稱我為齊天大聖，不許再稱大王。亦可傳與各洞妖王，一體知悉。」此不在話下。"

  "kind": "verse"
  "origin": "source"
  "source_text": "初登上界，乍入天堂。金光萬道滾紅霓，瑞氣千條噴紫霧。只見那南天門，碧沉沉，琉璃造就；明幌幌，寶玉粧成。兩邊擺數十員鎮天元帥，一員員頂梁靠柱，持銑擁旄；四下列十數個金甲神人，一個個執戟懸鞭，持刀仗劍。外廂猶可，入內驚人：裡壁廂有幾根大柱，柱上纏繞著金鱗耀日赤鬚龍；又有幾座長橋，橋上盤旋著彩羽凌空丹頂鳳。明霞幌幌映天光，碧霧濛濛遮斗口。這天上有三十三座天宮，乃遣雲宮、毘沙宮、五明宮、太陽宮、花樂宮，……一宮宮脊吞金穩獸；又有七十二重寶殿，乃朝會殿、凌虛殿、寶光殿、天王殿、靈官殿，……一殿殿柱列玉麒麟。壽星臺上，有千千年不卸的名花；煉藥爐邊，有萬萬載常青的繡草。又至那朝聖樓前，絳紗衣，星辰燦爛；芙蓉冠，金璧輝煌。玉簪珠履，紫綬金章。金鐘撞動，三曹神表進丹墀；天鼓鳴時，萬聖朝王參玉帝。又至那靈霄寶殿，金釘攢玉戶，彩鳳舞朱門。復道迴廊，處處玲瓏剔透；三簷四簇，層層龍鳳翱翔。上面有個紫巍巍，明幌幌，圓丟丟，亮灼灼，大金葫蘆頂。下面有天妃懸掌扇，玉女捧仙巾，惡狠狠掌朝的天將，氣昂昂護駕的仙卿。正中間，琉璃盤內，放許多重重疊疊太乙丹；瑪瑙瓶中，插幾枝彎彎曲曲珊瑚樹。正是天宮異物般般有，世上如他件件無。金闕銀鑾並紫府，琪花瑤草暨瓊葩。朝王玉兔壇邊過，參聖金烏著底飛。猴王有分來天境，不墮人間點污泥。"

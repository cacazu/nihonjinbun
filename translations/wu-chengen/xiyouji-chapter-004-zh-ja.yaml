  "source_text": "將近天門，金星高叫道：「那天門天將、大小吏兵，放開路者。此乃下界仙人，我奉玉帝聖旨，宣他來也。」那增長天王與眾天丁俱才斂兵退避。猴王始信其言，同金星緩步入裡觀看。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":

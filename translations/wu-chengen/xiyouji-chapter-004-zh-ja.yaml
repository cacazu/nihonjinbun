    將近天門，金星高叫道：「那天門天將、大小吏兵，放開路者。此乃下界仙人，我奉玉帝聖旨，宣他來也。」那增長天王與眾天丁俱才斂兵退避。猴王始信其言，同金星緩步入裡觀看。真個是：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 2
  "translation_ja": |-
    天門に近づくと、金星は大声を上げた。
    太白金星「天門を守る天将、大小の役人や兵たち、道をあけなさい。この方は下界の仙人で、私が玉帝の勅命を奉じてお連れしたのだ」
    増長天王と天兵たちは、そこでようやく武器を収めて道を譲った。猴王も初めて金星の言葉を信じ、ともにゆっくりと中へ進み、あたりを眺めた。そのありさまは、まことに次のとおり。

  "origin": "source"
  "source_text": |-
    正飲酒歡會間，有人來報道：「大王，門外有兩個獨角鬼王，要見大王。」猴王道：「教他進來。」那鬼王整衣跑入洞中，倒身下拜。美猴王問他：「你見我何幹？」鬼王道：「久聞大王招賢，無由得見；今見大王授了天籙，得意榮歸，特獻赭黃袍一件，與大王稱慶。肯不棄鄙賤，收納小人，亦得效犬馬之勞。」猴王大喜，將赭黃袍穿起。眾等欣然排班朝拜。即將鬼王封為前部總督先鋒。鬼王謝恩畢，復啟道：「大王在天許久，所授何職？」猴王道：「玉帝輕賢，封我做個甚麼『弼馬溫』。」鬼王聽言，又奏道：「大王有此神通，如何與他養馬？就做個齊天大聖，有何不可？」猴王聞說，歡喜不勝，連道幾個「好！好！好！」教四健將：「就替我快置個旌旗，旗上寫『齊天大聖』四大字，立竿張掛。自此以後，只稱我為齊天大聖，不許再稱大王。亦可傳與各洞妖王，一體知悉。」此不在話下。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 10
  "translation_ja": |-
    楽しく酒を飲んでいると、報告に来た者がいた。
    報告者「大王、門の外に独角鬼王が二人、大王にお目にかかりたいと申しております」
    孫悟空「通してやれ」
    鬼王は衣を整えて洞内へ駆け入り、身を伏せて拝した。美猴王は尋ねた。
    孫悟空「俺に何の用だ？」
    独角鬼王「大王が賢者をお招きだとはかねて伺っておりましたが、お目にかかる機会がございませんでした。このたび天の名簿に名を連ねられ、めでたくご帰還なさったと聞き、赭黄色の袍を一着、お祝いに献上いたします。卑しい者とお見捨てにならず、私をお召し抱えくだされば、犬馬の労を尽くすこともできましょう」
    猴王は大喜びで赭黄色の袍を着た。一同は喜んで列を整え、拝礼した。悟空はさっそく鬼王を前部総督先鋒に任じた。鬼王は恩に謝してから、重ねて申し上げた。
    独角鬼王「大王は長らく天上にいらっしゃいましたが、どの官職を授けられたのですか？」
    孫悟空「玉帝は賢者を軽んじて、俺を『弼馬温』とかいう官にしたのだ」
    これを聞くと、鬼王はまた進言した。
    独角鬼王「大王ほどの神通力がおありなのに、どうしてあの方の馬を養うことなどありましょう。斉天大聖とおなりになって、何の差し障りがありましょうか」
    猴王は聞くと喜びきって、何度も言った。
    孫悟空「いいぞ！　いいぞ！　いいぞ！」
    さらに四健将へ命じた。
    孫悟空「すぐに旗を用意し、『斉天大聖』の四文字を大きく書いて、竿を立てて掲げよ。これからは俺を斉天大聖とだけ呼べ。二度と大王と呼んではならん。各洞の妖王にも伝え、みなに知らせておけ」
    この話は、ここまでとしておこう。
  "translation_status": "reviewed"
- "id": "xy-ch04-012"
  "section_id": "chapter-04"
  "kind": "paragraph"

  "source_text": |-
    卻說那李天王與三太子領著眾將，直至靈霄寶殿，啟奏道：「臣等奉聖旨出師下界，收伏妖仙孫悟空，不期他神通廣大，不能取勝，仍望萬歲添兵剿除。」玉帝道：「諒一妖猴，有多少本事，還要添兵？」太子又近前奏道：「望萬歲赦臣死罪。那妖猴使一條鐵棒，先敗了巨靈神，又打傷臣臂膊。洞門外立一竿旗，上書『齊天大聖』四字。道是封他這官職，即便休兵來投；若不是此官，還要打上靈霄寶殿也。」玉帝聞言，驚訝道：「這妖猴何敢這般狂妄？著眾將即刻誅之。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 26
  "translation_ja": |-
    さて、李天王と三太子は諸将を率い、まっすぐ霊霄宝殿へ進んで奏上した。
    李天王と哪吒「臣らは勅命を奉じて下界へ出陣し、妖仙孫悟空を降そうといたしましたが、思いのほか神通力が大きく、勝つことができませんでした。どうか陛下、さらに兵を増やして討ち滅ぼしてくださいますよう」
    玉帝「たかが一匹の妖猿に、どれほどの力があるというのだ。さらに増援を求めるのか？」
    太子はまた前へ進んで奏上した。
    哪吒「どうか陛下、臣の死罪をお許しください。あの妖猿は鉄棒を一本使い、まず巨霊神を破り、さらに臣の腕を打ち傷つけました。洞門の外に旗を一本立て、『斉天大聖』の四文字を大きく記しております。この官職に封じられるなら、ただちに戦をやめて帰順するが、そうでなければ霊霄宝殿へ攻め上がると言っておりました」
    玉帝は聞いて、驚きあきれた。
    玉帝「あの妖猿、どうしてそこまで思い上がるのだ。諸将は即刻これを誅せよ」
  "translation_status": "reviewed"
- "id": "xy-ch04-028"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    正說間，班部中又閃出太白金星，奏道：「那妖猴只知出言，不知大小。欲加兵與他爭鬥，想一時不能收伏，反又勞師。不若萬歲大捨恩慈，還降招安旨意，就教他做個齊天大聖。只是加他個空銜，有官無祿便了。」玉帝道：「怎麼喚做『有官無祿』？」金星道：「名是齊天大聖，只不與他事管，不與他俸祿，且養在天壤之間，收他的邪心，使不生狂妄，庶乾坤安靖，海宇得清寧也。」玉帝聞言道：「依卿所奏。」即命降了詔書，仍著金星領去。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 27
  "translation_ja": |-
    話の最中、列の中から再び太白金星が進み出て奏上した。
    太白金星「あの妖猿は口に出すことだけを知り、身のほどをわきまえておりません。兵を増やして戦っても、すぐには降せず、かえって軍を疲れさせるでしょう。陛下が大いなる慈悲をお示しになり、もう一度招安の勅命を下して、斉天大聖にしてやるのがよろしいかと存じます。ただし名ばかりの称号を与え、官はあっても俸禄はないことにすればよいのです」
    玉帝「『官はあっても俸禄はない』とは、どういうことか？」
    太白金星「名は斉天大聖としながら、何の務めも任せず、俸禄も与えず、ひとまず天地の間で養っておくのです。邪な心を収めさせ、思い上がりを起こさせなければ、天地も安らぎ、天下も清く静かに治まりましょう」
    玉帝は聞くと答えた。
    玉帝「そなたの奏上どおりにせよ」
    さっそく詔書を下し、再び金星に持っていかせた。
  "translation_status": "reviewed"
- "id": "xy-ch04-029"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    金星復出南天門，直至花果山水簾洞外觀看。這番比前不同，威風凜凜，殺氣森森，各樣妖精，無般不有。一個個都執劍拈槍，拿刀弄杖的在那裡咆哮跳躍。一見金星，皆上前動手。金星道：「那眾頭目來，累你去報你大聖知之：吾乃上帝遣來天使，有聖旨在此請他。」眾妖即跑入報道：「外面有一老者，他說是上界天使，有旨意請你。」悟空道：「來得好，來得好。想是前番來的那太白金星。那次請我上界，雖是官爵不堪，卻也天上走了一次，認得那天門內外之路。今番又來，定有好意。」教眾頭目大開旗鼓，擺隊迎接。大聖即帶引群猴，頂冠貫甲，甲上罩了赭黃袍，足踏雲履，急出洞門，躬身施禮，高叫道：「老星請進，恕我失迎之罪。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 28
  "translation_ja": |-
    金星はまた南天門を出て、まっすぐ花果山の水簾洞へ来た。外から見ると、今回は前とは違い、威風は凜々として、殺気が立ちこめていた。ありとあらゆる妖怪がそろい、一人一人が剣を執り槍をつかみ、刀や杖を振り回し、吠えながら跳びはねている。金星を見るなり、みな前へ出て手をかけようとした。
    太白金星「頭目たち、こちらへ。すまないが、お前たちの大聖へ知らせてくれ。私は上帝から遣わされた天の使者で、大聖をお招きする勅命を持っている」
    妖怪たちはすぐに駆け込んで報告した。
    妖怪たち「外に老人が一人おります。天上の使者で、大聖をお招きする勅命を持っていると申しております」
    孫悟空「よく来た、よく来た。きっと前に来た太白金星だ。あのとき天上に招かれて、官位はひどいものだったが、ともかく天へ一度行って、天門の内外の道を覚えた。今度また来たからには、きっと好意があってのことだろう」
    悟空は頭目たちに、旗と太鼓を盛大に繰り出し、列を整えて迎えるよう命じた。大聖は猿たちを率い、冠をかぶり、鎧を着け、その上に赭黄色の袍を羽織り、雲の靴を履いて、急いで洞門を出た。身をかがめて礼をし、大きな声で呼びかけた。
    孫悟空「金星さま、どうぞお入りください。お迎えが遅れた失礼をお許しください」
  "translation_status": "reviewed"
- "id": "xy-ch04-030"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    金星趨步向前，徑入洞內，面南立著道：「今告大聖：前者因大聖嫌惡官小，躲離御馬監，當有本監中大小官員奏了玉帝。玉帝傳旨道：『凡授官職，皆由卑而尊，為何嫌小？』即有李天王領哪吒下界取戰。不知大聖神通，故遭敗北，回天奏道：『大聖立一竿旗，要做齊天大聖。眾武將還要支吾，是老漢力為大聖冒罪奏聞，免興師旅，請大王授籙。玉帝准奏，因此來請。」悟空笑道：「前番動勞，今又蒙愛，多謝，多謝！但不知上天可與我齊天大聖之官銜也？」金星道：「老漢以此銜奏准，方敢領旨而來；如有不遂，只坐罪老漢便是。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 29
  "translation_ja": |-
    金星は足早に進み、洞内に入って南を向いて立った。
    太白金星「大聖、お話し申し上げます。先日は官位の低さを嫌って御馬監を離れられたため、監内の大小の役人たちが玉帝に奏上しました。玉帝は『およそ官位は、低いところから高いところへ進むものなのに、なぜ低いと不満を抱くのか』と仰せになりました。そこへ李天王が哪吒を率いて下界へ戦いに来たのですが、大聖の神通力を知らなかったため敗れ、天に戻って『大聖は旗を一本立て、斉天大聖になろうとしております』と奏上したのです。武将たちはなお抗おうとしましたが、この私が、大聖のために罪を問われるのも覚悟で懸命に奏上し、軍を起こさず、大王を仙籍に迎えるようお願いしました。玉帝がお聞き届けになったので、お招きに参ったのです」
    悟空は笑って答えた。
    孫悟空「先日はご足労いただき、今度もお心にかけてくださって、ありがとうございます、ありがとうございます。ただ、天上では本当に斉天大聖の官名をいただけるのでしょうか？」
    太白金星「この名で奏上してお許しを得たからこそ、勅命を受けて参ったのです。もしご希望どおりでなければ、この私だけを罪にお問いください」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「回天奏道：『大聖立一竿旗，要做齊天大聖。」の内側引用を閉じる符号が底本にない。原文は変更せず、文脈に従って訳文ではこの報告の後で引用を閉じた。「是老漢力為大聖冒罪奏聞」以下の老漢は太白金星本人の自称と解する。句読の厳密な校訂は未実施。"
- "id": "xy-ch04-031"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    悟空大喜，懇留飲宴不肯，遂與金星縱著祥雲，到南天門外。那些天丁天將都拱手相迎。徑入靈霄殿下。金星拜奏道：「臣奉詔宣弼馬溫孫悟空已到。」玉帝道：「那孫悟空過來，今宣你做個齊天大聖，官品極矣，但切不可胡為。」這猴亦止朝上唱個喏，道聲「謝恩」。玉帝即命工幹官張、魯二班，在蟠桃園右首，起一座齊天大聖府，府內設個二司：一名安靜司，一名寧神司。司俱有仙吏，左右扶持。又差五斗星君送悟空去到任，外賜御酒二瓶，金花十朵，著他安心定志，再勿胡為。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 30
  "translation_ja": |-
    悟空は大いに喜び、酒宴にと懸命に引き留めたが、金星は応じなかった。そこで、ともに瑞雲に乗り、南天門の外へ来た。天兵も天将も、みな両手を組んで迎えた。そのまま霊霄殿の下へ進むと、金星が拝礼して奏上した。
    太白金星「臣、詔を奉じ、弼馬温孫悟空を召し連れてまいりました」
    玉帝「孫悟空、こちらへ参れ。今、そなたを斉天大聖に任ずる。官の位はこれで極まった。ただし、決して勝手なことをしてはならぬ」
    この猿はやはり、玉帝に向かって声を上げ、両手を組んで一礼するだけで、ひと言述べた。
    孫悟空「ご恩に感謝します」
    玉帝はただちに工事をつかさどる張班と魯班の二官に命じ、蟠桃園の右側に斉天大聖府を一棟建てさせた。府内には二つの司を設け、一つを安静司、一つを寧神司と名づけた。それぞれの司には仙吏を置き、左右から補佐させた。また五斗星君に命じて悟空を赴任先へ送らせ、さらに御酒二瓶と金花十輪を賜い、心を落ち着け、志を定めて、二度と勝手なことをしないよう言い聞かせた。
  "translation_status": "reviewed"
- "id": "xy-ch04-032"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    那猴王信受奉行，即日與五斗星君到府，打開酒瓶，同眾盡飲。送星官回轉本宮，他才遂心滿意，喜地歡天，在於天宮快樂，無掛無礙。正是：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 31
  "translation_ja": |-
    猴王はありがたく承って仰せに従い、その日のうちに五斗星君とともに大聖府へ来ると、酒瓶を開け、一同とすっかり飲み干した。星官を送り、それぞれの宮へ帰ってもらうと、ようやく望みがかなって満足し、天にも地にも躍り上がる心地で喜んだ。天宮で楽しく暮らし、気にかかることも、妨げとなることもない。まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch04-033"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    仙名永注長生籙，不墮輪迴萬古傳。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 32
  "translation_ja": |-
    仙人の名は永く長生の名簿に記され、輪廻に落ちず、万古に伝わる。
  "translation_status": "reviewed"
- "id": "xy-ch04-034"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    畢竟不知向後如何，且聽下回分解。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 33
  "translation_ja": |-
    さて、この先どうなるか。それは次回の物語をお聞きいただきたい。
  "translation_status": "reviewed"

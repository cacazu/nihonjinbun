    "source_sequence": 1
  "translation_ja": |-
    太白金星（たいはくきんせい。玉帝に孫悟空の招きを進言し、使者となる星の神）と孫悟空（そんごくう。石から生まれた主人公の猿）は、洞天（どうてん。仙人が住むとされる洞窟の世界）の奥深くから連れ立って出ると、ともに雲に乗って舞い上がった。もともと孫悟空の筋斗雲（きんとうん・推定。宙返り一つで十万八千里を進む仙術の雲）はほかとは違い、たいへん速い。太白金星を後方へ置き去りにして、先に南天門（なんてんもん・推定。天上の宮殿に通じる南側の門）の外へ着いてしまった。雲を収めて進もうとすると、増長天王（ぞうちょうてんのう。南天門を守る天界の神将）が龐（ほう・推定。増長天王に従い南天門を守る天兵の姓）・劉（りゅう・推定。増長天王に従い南天門を守る天兵の姓）・苟（こう・推定。増長天王に従い南天門を守る天兵の姓）・畢（ひつ・推定。増長天王に従い南天門を守る天兵の姓）・鄧（とう・推定。増長天王に従い南天門を守る天兵の姓）・辛（しん・推定。増長天王に従い南天門を守る天兵の姓）・張（ちょう・推定。増長天王に従い南天門を守る天兵の姓）・陶（とう・推定。増長天王に従い南天門を守る天兵の姓）の力ある天兵（てんぺい・推定。天界に仕える兵士）たちを率い、槍、刀、剣、戟（げき。長い柄の先に突く刃と横向きの刃を備えた武器）を構えて天門（てんもん・推定。ここでは南天門の略称）をふさぎ、中へ入れようとしない。
    孫悟空「あの金星（きんせい・推定。ここでは太白金星の略称）のじいさんは、腹黒い奴だ。俺を招いておきながら、どうして人に刀や槍を振るわせ、道をふさがせるんだ？」
    わめいているところへ、太白金星がたちまち追いついた。孫悟空はその顔を見るなり、怒りをあらわにした。
    孫悟空「じいさん、よくも俺をだましたな。玉帝（ぎょくてい・推定。天上の神々を治める帝王）が招き入れるという勅命（ちょくめい。帝王からの命令）で迎えに来たと言ったくせに、なぜこいつらに天門をふさがせ、俺を入れないんだ？」
    太白金星は笑って答えた。
    太白金星「大王、お怒りをお鎮めください。あなたは、これまでこの天界へ来られたことがなく、まだ名も登録されておりません。天兵たちもあなたとは面識がありませんから、勝手にお通しするわけにはいかないのです。これから天尊（てんそん・推定。ここでは玉帝への尊称）にお会いし、仙人（せんにん・推定。修行によって不老長寿や不思議な力を得たとされる人）の名簿に載り、官名が記されれば、以後は自由に出入りできます。誰が止めましょう」
    孫悟空「そういうことなら、もういい。俺は入らん」
    太白金星は再び孫悟空の手を引いた。
    太白金星「まあ、私と一緒にお入りください」

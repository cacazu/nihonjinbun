  "source_text": |-
    一朝閑暇，眾監官都安排酒席，一則與他接風，二則與他賀喜。正在歡飲之間，猴王忽停杯問曰：「我這弼馬溫是個甚麼官銜？」眾曰：「官名就是此了。」又問：「此官是個幾品？」眾道：「沒有品從。」猴王道：「沒品，想是大之極也？」眾道：「不大，不大，只喚做未入流。」猴王道：「怎麼叫做『未入流』？」眾道：「末等。這樣官兒最低最小，只可與他看馬。似堂尊到任之後，這等慇懃，餵得馬肥，只落得道聲『好』字；如稍有些尪羸，還要見責；再十分傷損，還要罰贖問罪。」猴王聞此，不覺心頭火起，咬牙大怒道：「這般藐視老孫！老孫在那花果山稱王稱祖，怎麼哄我來替他養馬？養馬者，乃後生小輩下賤之役，豈是待我的？不做他，不做他，我將去也。」忽喇的一聲，把公案推倒，耳中取出寶貝，幌一幌，碗來粗細，一路解數，直打出御馬監，徑至南天門。眾天丁知他受了仙籙，乃是個弼馬溫，不敢阻當，讓他打出天門去了。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 8
  "translation_ja": |-
    ある日、暇を得た監官たちは宴席を設けた。一つには着任をねぎらい、一つには栄達を祝うためである。楽しく飲んでいる最中、猴王はふと杯を置いて尋ねた。
    孫悟空「俺の弼馬温というのは、どういう官職なんだ？」
    監官たち「それが、そのまま官名でございます」
    孫悟空「その官は、何品なんだ？」
    監官たち「品級はございません」
    孫悟空「品がない？　それなら、この上なく高いということか？」
    監官たち「高くはありません、高くはありません。ただ『未入流』と呼ばれております」
    孫悟空「『未入流』とは、どういうことだ？」
    監官たち「いちばん末の位です。この官は最も低く、小さな役で、馬の世話をするだけです。長官のように、ご着任から熱心に働き、馬を肥やしても、『よい』と一言ほめられるだけ。少しでも馬が痩せ衰えれば叱責を受け、ひどく傷つけでもすれば、罰金を科され、罪を問われるのです」
    猴王はこれを聞くと、思わず胸に火がついた。歯を食いしばり、激しく怒った。
    孫悟空「そこまで俺を見くびるのか！　花果山では王と仰がれ、祖と敬われていたこの俺を、だまして連れてきて、奴の馬を養わせるとは。馬飼いなど、若い下っ端の下賤な仕事だ。俺にさせることか！　やめだ、やめだ。俺は帰るぞ」
    どんと役所の机をひっくり返し、耳から宝を取り出してひと振りすると、椀ほどの太さになった。棒の技を繰り出しながら御馬監を打って出て、まっすぐ南天門へ向かった。天兵たちは、悟空が仙人の名簿に載り、弼馬温の官にあると知っていたので、あえて止めず、天門から打って出るままにした。
  "translation_status": "reviewed"
- "id": "xy-ch04-010"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    須臾，按落雲頭，回至花果山上。只見那四健將與各洞妖王，在那裡操演兵卒。這猴王厲聲高叫道：「小的們，老孫來了。」一群猴都來叩頭，迎接進洞天深處，請猴王高登寶位，一壁廂辦酒接風。都道：「恭喜大王，上界去十數年，想必得意榮歸也？」猴王道：「我才半月有餘，那裡有十數年？」眾猴道：「大王，你在天上不覺時辰。天上一日，就是下界一年哩。請問大王，官居何職？」猴王搖手道：「不好說，不好說，活活的羞殺人。那玉帝不會用人，他見老孫這般模樣，封我做個甚麼『弼馬溫』，原來是與他養馬，未入流品之類。我初到任時不知，只在御馬監中頑耍。及今日問我同寮，始知是這等卑賤。老孫心中大惱，推倒席面，不受官銜，因此走下來了。」眾猴道：「來得好，來得好。大王在這福地洞天之處為王，多少尊重快樂，怎麼肯去與他做馬夫？」教小的們快辦酒來，與大王釋悶。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 9
  "translation_ja": |-
    ほどなく雲を下ろし、花果山へ帰ってみると、四健将と各洞の妖王が兵卒を訓練していた。猴王は鋭い大声を上げた。
    孫悟空「お前たち、俺が帰ったぞ！」
    猿たちはみな頭を地につけて礼をし、洞天の奥へ迎え入れ、猴王を宝座の高みに座らせた。一方では帰還を祝う酒宴を用意し、みな口々に言った。
    猿たち「大王、おめでとうございます！　天上へ行かれて十数年、さぞご出世なさって、晴れがましいお帰りなのでしょうね？」
    孫悟空「俺は半月余りいただけだ。どうして十数年にもなるんだ？」
    猿たち「大王、天上では時の流れにお気づきにならなかったのでしょう。天上の一日は、下界の一年なのです。ところで、どの官職にお就きになったのですか？」
    猴王は手を振った。
    孫悟空「言えたものじゃない、言えたものじゃない。まったく恥ずかしくてたまらん。あの玉帝は人の使い方を知らない。俺のこの姿を見て、『弼馬温』とかいう官にしたが、実は奴の馬を養う、位階にも入らない類だった。着任したばかりのころは知らずに、御馬監で遊んでいたんだが、今日、同僚に尋ねて、そんな卑しい役だと初めて分かった。腹が立って宴の席をひっくり返し、官名など受けぬと、こうして下りてきたのさ」
    猿たち「よくお戻りになりました！　大王はこの幸いな仙境の王でいらっしゃれば、どれほど敬われ、楽しく過ごせることか。どうして、あちらの馬丁などになれましょう」
    そして子猿たちに、早く酒を用意して大王の憂さを晴らすよう命じた。
  "translation_status": "reviewed"

  "source_text": "須臾，按落雲頭，回至花果山上。只見那四健將與各洞妖王，在那裡操演兵卒。這猴王厲聲高叫道：「小的們，老孫來了。」一群猴都來叩頭，迎接進洞天深處，請猴王高登寶位，一壁廂辦酒接風。都道：「恭喜大王，上界去十數年，想必得意榮歸也？」猴王道：「我才半月有餘，那裡有十數年？」眾猴道：「大王，你在天上不覺時辰。天上一日，就是下界一年哩。請問大王，官居何職？」猴王搖手道：「不好說，不好說，活活的羞殺人。那玉帝不會用人，他見老孫這般模樣，封我做個甚麼『弼馬溫』，原來是與他養馬，未入流品之類。我初到任時不知，只在御馬監中頑耍。及今日問我同寮，始知是這等卑賤。老孫心中大惱，推倒席面，不受官銜，因此走下來了。」眾猴道：「來得好，來得好。大王在這福地洞天之處為王，多少尊重快樂，怎麼肯去與他做馬夫？」教小的們快辦酒來，與大王釋悶。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 9
  "translation_ja": |-
    ほどなく雲を下ろし、花果山へ帰ってみると、四健将（しけんしょう・推定。馬元帥・流元帥・崩将軍・芭将軍の四人の勇将）と各洞の妖王が兵卒を訓練していた。孫悟空は鋭い大声を上げた。
    孫悟空「お前たち、俺が帰ったぞ！」
    猿たちはみな頭を地につけて礼をし、洞天の奥へ迎え入れ、孫悟空を宝座の高みに座らせた。一方では帰還を祝う酒宴を用意し、みな口々に言った。
    猿たち「大王、おめでとうございます！　天上へ行かれて十数年、さぞご出世なさって、晴れがましいお帰りなのでしょうね？」
    孫悟空「俺は半月余りいただけだ。どうして十数年にもなるんだ？」
    猿たち「大王、天上では時の流れにお気づきにならなかったのでしょう。天上の一日は、下界の一年なのです。ところで、どの官職にお就きになったのですか？」
    孫悟空は手を振った。
    孫悟空「言えたものじゃない、言えたものじゃない。まったく恥ずかしくてたまらん。あの玉帝は人の使い方を知らない。俺のこの姿を見て、『弼馬温』とかいう官にしたが、実は奴の馬を養う、位階にも入らない類だった。着任したばかりのころは知らずに、御馬監で遊んでいたんだが、今日、同僚に尋ねて、そんな卑しい役だと初めて分かった。腹が立って宴の席をひっくり返し、官名など受けぬと、こうして下りてきたのさ」
    猿たち「よくお戻りになりました！　大王はこの幸いな仙境（せんきょう・推定。仙人が住むとされる、俗世から離れた場所）の王でいらっしゃれば、どれほど敬われ、楽しく過ごせることか。どうして、あちらの馬丁（ばてい・推定。馬の飼育や世話をする者）などになれましょう」
    そして子猿たちに、早く酒を用意して大王の憂さを晴らすよう命じた。

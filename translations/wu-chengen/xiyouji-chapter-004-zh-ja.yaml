  "source_text": "李天王與哪吒叩頭謝辭，徑至本宮，點起三軍，帥眾頭目，著巨靈神為先鋒，魚肚將掠後，藥叉將催兵。一霎時出南天門外，徑來到花果山，選平陽處安了營寨，傳令教巨靈神挑戰。巨靈神得令，結束整齊，掄著宣花斧，到了水簾洞外。只見小洞門外許多妖魔，都是些狼蟲虎豹之類，丫丫叉叉，掄槍舞劍，在那裡跳鬥咆哮。這巨靈神喝道：「那業畜！快早去報與弼馬溫知道：吾乃上天大將，奉玉帝旨意，到此收伏；教他早早出來受降，免致汝等皆傷殘也。」那些妖怪奔奔波波，傳報洞中道：「禍事了！禍事了！」猴王問：「有甚禍事？」眾妖道：「門外有一員天將，口稱大聖官銜，道奉玉帝聖旨，來此收伏。教早早出去受降，免傷我等性命。」猴王聽說，教：「取我披掛來。」就戴上紫金冠，貫上黃金甲，登上步雲鞋，手執如意金箍棒，領眾出門，擺開陣勢。這巨靈神睜睛觀看，真好猴王："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 12
  "translation_ja": |-
    李天王と哪吒は頭を地につけて恩に謝し、退出して自らの宮へ戻った。三軍（さんぐん・推定。軍全体を指す語）を集め、諸将を率い、巨霊神（きょれいしん・推定。天軍の先鋒として孫悟空と戦う神将）を先鋒とし、魚肚将（ぎょとしょう・推定。李天王の軍で後詰めを務める将軍）を後詰め（ごづめ。後方から援護する部隊）に、薬叉将（やくしゃしょう・推定。李天王の軍で兵を督励する将軍）を督戦（とくせん。兵を指揮し戦いを励ますこと）に当てた。たちまち南天門を出て花果山へ向かい、開けた平地を選んで陣を敷くと、巨霊神に挑戦を命じた。命を受けた巨霊神は身なりを整え、宣花斧（せんかふ・推定。巨霊神が使う長柄の斧）を振るって水簾洞（すいれんどう。滝の裏に隠れた、猿たちの住まいとなる洞窟）の外へ来た。小さな洞門の外には、狼や虎、豹などの猛獣の類の妖魔が大勢おり、入り乱れて槍や剣を振り、跳びはねて争い、吠えていた。巨霊神は一喝した。
    巨霊神「この畜生ども！　急いで弼馬温に知らせよ。我は天上の大将、玉帝の勅命を奉じ、ここへ討ち従えに来た。早く出てきて降伏せよと伝えろ。さもなくば、お前たちまでみな傷つき、倒れることになるぞ」
    妖怪たちは慌てふためき、洞内へ駆け込んで報告した。
    妖怪たち「大変です！　大変です！」
    斉天大聖「何が大変なんだ？」
    妖怪たち「門の外に天将が一人、大聖（たいせい・推定。ここでは斉天大聖の略称で、孫悟空を指す）の官名を呼び、玉帝の勅命で討ち従えに来たと言っております。私たちの命が惜しければ、早く出て降伏せよと」
    これを聞いた斉天大聖は命じた。
    斉天大聖「俺の鎧兜を持ってこい」
    紫金（しきん。紫がかった色合いを持つ良質の金）の冠をかぶり、黄金の鎧を着け、歩雲の靴（ほうんのくつ・推定。雲の上を歩くための孫悟空の靴）を履き、如意金箍棒（にょいきんこぼう。思いどおりに大きさを変える、金のたがの付いた鉄棒）を手にして、一同を率いて門を出ると、陣形を整えた。巨霊神が目を見開いて見れば、まことに見事な斉天大聖である。
  "translation_status": "reviewed"

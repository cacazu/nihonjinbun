    "source_sequence": 2
  "translation_ja": |-
    天門に近づくと、太白金星は大声を上げた。
    太白金星「天門を守る天将（てんしょう・推定。天界の軍を率いる将軍）、大小の役人や兵たち、道をあけなさい。この方は下界の仙人で、私が玉帝の勅命を奉じてお連れしたのだ」
    増長天王と天兵たちは、そこでようやく武器を収めて道を譲った。孫悟空も初めて太白金星の言葉を信じ、ともにゆっくりと中へ進み、あたりを眺めた。そのありさまは、まことに次のとおり。
  "translation_status": "reviewed"
- "id": "xy-ch04-004"

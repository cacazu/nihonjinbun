  "translation_ja": "初めて上界へ昇り、初めて天宮（てんきゅう・推定。天界にある宮殿）へ足を踏み入れる。幾万筋もの金の光が紅の虹にうねり、幾千筋もの瑞気（ずいき。めでたい兆しを表す光や気配）が紫の霧を噴き上げる。見れば南天門は、深く澄んだ碧の瑠璃（るり・推定。青く美しい宝石。ここでは宮殿を飾る宝材）で造られ、まばゆい宝玉で飾られている。両側には数十人の鎮天元帥（ちんてんげんすい・推定。天界を守護する神将の称号）が並び、一人一人が梁や柱のもとにそびえ立ち、金飾りの弓を持ち、旄旗（ぼうき・推定。ヤクの尾の毛などを飾りに付けた旗）を抱えている。四方には十数人の金甲（きんこう・推定。金色に輝く鎧）の神人（しんじん・推定。神の力を備えた者）が列をなし、戟を執って鞭を腰に掛け、刀や剣を構える。外側だけでも見事だが、中へ入ればさらに目を驚かす。奥には何本もの大柱があり、金の鱗が日に輝く赤髯（せきぜん・推定。赤いひげ。ここでは柱に巻きつく竜のひげ）の竜（りゅう・推定。中国の伝説に登場する、長い体をもつ神聖な動物）が柱に巻きついている。また幾つもの長い橋があり、彩り豊かな羽で空をしのぐ丹頂（たんちょう。赤い頭の頂。ここでは鳳凰の頭の赤い部分）の鳳凰（ほうおう。中国の伝説に登場する、めでたい鳥）が、その上を巡っている。明るい霞はきらめいて天光を映し、碧の霧はおぼろに北斗（ほくと・推定。北の空にひしゃく形に並ぶ七つの星）の口を覆う。この天上には三十三の天宮がある。遣雲宮（けんうんきゅう・推定。天界にある宮殿の一つ）、毘沙宮（びしゃきゅう・推定。天界にある宮殿の一つ）、五明宮（ごみょうきゅう・推定。天界にある宮殿の一つ）、太陽宮（たいようきゅう・推定。天界にある宮殿の一つ）、花楽宮（からくきゅう・推定。天界にある宮殿の一つ）などで、どの宮にも、棟をくわえる金の獣飾りが据わる。また七十二重の宝殿がある。朝会殿（ちょうかいでん・推定。天界にある宝殿の一つ）、凌虚殿（りょうきょでん・推定。天界にある宝殿の一つ）、宝光殿（ほうこうでん・推定。天界にある宝殿の一つ）、天王殿（てんのうでん・推定。天界にある宝殿の一つ）、霊官殿（れいかんでん・推定。天界にある宝殿の一つ）などで、どの殿にも玉の麒麟（きりん。中国の伝説の獣。実在の首の長いキリンとは別）を飾った柱が並ぶ。寿星台（じゅせいだい・推定。天宮にある高台の名）には、幾千年も散らない名花。煉薬炉（れんやくろ・推定。仙薬を練って作る炉）のほとりには、幾万年も青さを失わない美しい草。さらに朝聖楼（ちょうせいろう・推定。天宮にある楼閣の名）の前まで来ると、深紅の薄絹の衣には星々がきらめき、芙蓉（ふよう・推定。ここでは蓮の花をかたどった冠の飾り）の冠には黄金と玉が輝く。玉の簪（かんざし・推定。髪に挿して留めたり飾ったりする道具）、真珠の履、紫の組紐、金の印章。金の鐘が鳴れば三曹（さんそう・推定。玉帝への奏状を捧げる天界の三つの官署。具体的な内訳はここでは留保する）の神々が奏状（そうじょう・推定。帝王へ差し出す報告の文書）を携えて丹塗り（にぬり。朱色の顔料で塗ること）の御階（みはし。宮殿の階段を敬っていう語）へ進み、天の太鼓が響けば万の聖者が王に朝して玉帝を拝する。さらに霊霄宝殿（れいしょうほうでん・推定。玉帝が臣下たちを集める天上の宮殿）へ来れば、玉の扉には金の鋲が群がり、朱の門には彩りの鳳凰が舞う。二重の通路と回廊は、どこも精巧で透き通るよう。三重の軒が四方に群がり、層ごとに竜と鳳凰が飛び交う。その上には、紫がかって高々と、まばゆく、まん丸く、きらきら輝く、大きな金の瓢箪（ひょうたん・推定。中ほどがくびれた実を付ける植物。ここではその実の形）形の頂がある。下には天妃（てんぴ・推定。ここでは天上の宮廷に仕える女性）が儀仗（ぎじょう。儀式で威儀を示すために備える道具）の扇を掲げ、玉女（ぎょくじょ。天界で文書を取り次ぐ女性の仙人）が仙巾（せんきん・推定。仙人が用いる布や頭巾）を捧げ、朝廷を守る天将は厳めしく、御駕（ぎょが・推定。帝王の乗り物。転じてその外出）を護る仙卿（せんけい・推定。天界で玉帝に仕える高官）は意気高い。真ん中の瑠璃の皿には、太乙丹（たいいつたん・推定。天宮に積まれている霊妙な仙薬）が幾重にも積まれ、瑪瑙（めのう。色や縞模様を持つ装飾用の石）の瓶には、曲がりくねった珊瑚（さんご・推定。海の生物が作る枝状の骨格で、装飾に使うもの）の枝が幾本も挿してある。まさしく天宮には、ありとあらゆる珍しい品があり、下界にはそのどれ一つとして同じものがない。金の宮門、銀の御車（みくるま・推定。帝王の乗る車を敬っていう語）、紫の仙宮、玉のような花々と美しい草花。王に朝する玉兎（ぎょくと。月に住むとされる兎。月の象徴）は壇のほとりを過ぎ、聖帝（せいてい・推定。ここでは玉帝への尊称）に参る金烏（きんう。太陽に住むとされる烏。太陽の象徴）はその下を飛ぶ。猴王（こうおう・推定。猿の王という孫悟空の呼び名）は縁あって天の境へ来たり、人の世の泥に汚されずにすんだのである。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "天宮の建築装飾「金穩獸」の具体的な様式・形状は未確定。棟をくわえる金の獣飾りとして訳し、特定の動物や建築様式名へ置き換えていない。「三曹神表」は三曹の神々の上表と解したが構文の細部と三曹の内訳は留保し、「三簷四簇」も具体的な建築形式は確定していない。"
- "id": "xy-ch04-005"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太白金星領著美猴王，到於靈霄殿外，不等宣詔，直至御前，朝上禮拜。悟空挺身在傍，且不朝禮，但側耳以聽金星啟奏。金星奏道：「臣領聖旨，已宣妖仙到了。」玉帝垂簾問曰：「那個是妖仙？」悟空卻才躬身答應道：「老孫便是。」仙卿們都大驚失色道：「這個野猴，怎麼不拜伏參見，輒敢這等答應道：『老孫便是。』卻該死了，該死了。」玉帝傳旨道：「那孫悟空乃下界妖仙，初得人身，不知朝禮，且姑恕罪。」眾仙卿叫聲：「謝恩。」猴王卻才朝上唱個大喏。玉帝宣文選武選仙卿，看那處少甚官職，著孫悟空去除授。傍邊轉過武曲星君啟奏道：「天宮裡各宮各殿，各方各處，都不少官，只是御馬監缺個正堂管事。」玉帝傳旨道：「就除他做個弼馬溫罷。」眾臣叫謝恩，他也只朝上唱個大喏。玉帝又差木德星官送他去御馬監到任。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 4
  "translation_ja": |-
    太白金星は孫悟空を連れて霊霄宝殿の外へ来ると、お召しを待たずに御前まで進み、玉帝へ礼拝した。孫悟空は傍らに体をまっすぐ立て、朝廷の礼もとらず、太白金星の奏上に耳を傾けるばかりだった。
    太白金星「臣、勅命を奉じ、妖仙（ようせん・推定。仙術を身につけた妖怪。ここでは孫悟空を指す）を召し連れてまいりました」
    玉帝は御簾（みす。貴人の席の前などに垂らすすだれ）を垂れたまま尋ねた。
    玉帝「どれが妖仙か？」
    孫悟空はようやく身をかがめて答えた。
    孫悟空「この俺だ」
    仙卿たちはみな仰天し、顔色を変えた。
    仙卿たち「この野猿め、なぜひざまずいて拝謁（はいえつ・推定。身分の高い人に会うことをへりくだっていう語）もせず、『この俺だ』などと答えるのだ。死罪に当たるぞ、死罪だ」
    玉帝は旨を伝えた。
    玉帝「孫悟空は下界の妖仙で、ようやく人の身を得たばかり、朝廷の礼を知らぬ。ひとまず罪を許せ」
    仙卿たち「ご恩に謝せよ」
    孫悟空はそこで初めて、玉帝に向かって声を上げ、両手を組んで一礼した。玉帝は文官・武官の選任をつかさどる仙卿を呼び、どこにどんな欠員があるか調べ、孫悟空を任命するよう命じた。傍らから武曲星君（ぶきょくせいくん・推定。御馬監の欠員を玉帝へ奏上する星の神）が進み出て奏上した。
    武曲星君「天宮の各宮、各殿、いずれの場所にも官の欠員はございません。ただ御馬監（ぎょばかん。天界の馬を管理する役所）に、全体を取り仕切る長官がおりません」
    玉帝「では、弼馬温（ひつばおん。天界の馬の世話をつかさどる官職。孫悟空が任じられる）に任ぜよ」
    臣下たちが恩に謝するよう促しても、弼馬温はやはり玉帝に向かって声を上げ、両手を組んで一礼するだけだった。玉帝はさらに木徳星官（もくとくせいかん・推定。孫悟空を御馬監へ案内する星の神）を遣わし、御馬監へ送り届けて着任させた。
  "translation_status": "reviewed"
- "id": "xy-ch04-006"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時猴王歡歡喜喜，與木德星官徑去到任。事畢，木德星官回宮。他在監裡，會聚了監丞、監副、典簿、力士、大小官員人等，查明本監事務，止有天馬千匹。乃是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 5
  "translation_ja": "弼馬温は喜び勇んで木徳星官とともに着任した。用がすむと、木徳星官は自分の宮へ帰った。弼馬温は御馬監で、監丞（かんじょう・推定。御馬監の長官を補佐する役人）、監副（かんふく。御馬監の副官）、典簿（てんぼ・推定。帳簿や物資の調達を担当する役人）、力士（りきし・推定。ここでは馬の世話など実務に当たる役人）をはじめ、大小の役人たちを集め、役所の務めを調べた。管理するのは天馬（てんば。天界で飼われる不思議な馬）千匹である。その馬とは、次のような名馬たちだった。"
  "translation_status": "reviewed"
- "id": "xy-ch04-007"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": "驊騮騏驥，騄駬纖離；龍媒紫燕，挾翼驌驦；駃騠銀騔，騕褭飛黃；騊駼翻羽，赤兔超光；踰輝彌景，騰霧勝黃；追風絕地，飛\U0002646D奔霄；逸飄赤電，銅爵浮雲；驄瓏虎\U00029932，絕塵紫鱗；……四極大宛，八駿九逸，千里絕群。此等良馬，一個個嘶風逐電精神壯，踏霧登雲氣力長。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 6
  "translation_ja": "驊騮（かりゅう。天界の御馬監で飼われる名馬の名）、騏驥（きき。天界の御馬監で飼われる名馬の名）、騄駬（りょくじ。天界の御馬監で飼われる名馬の名）、繊離（せんり・推定。天界の御馬監で飼われる名馬の名）。竜媒（りゅうばい・推定。天界の御馬監で飼われる名馬の名）、紫燕（しえん・推定。天界の御馬監で飼われる名馬の名）、挾翼（きょうよく・推定。天界の御馬監で飼われる名馬の名）、驌驦（しゅくそう。天界の御馬監で飼われる名馬の名）。駃騠（けってい。天界の御馬監で飼われる名馬の名）、銀騔（ぎんかつ・推定。天界の御馬監で飼われる名馬の名）、騕褭（ようじょう。天界の御馬監で飼われる名馬の名）、飛黄（ひこう・推定。天界の御馬監で飼われる名馬の名）。騊駼（とうと。天界の御馬監で飼われる名馬の名）、翻羽（ほんう・推定。天界の御馬監で飼われる名馬の名）、赤兎（せきと・推定。天界の御馬監で飼われる名馬の名）、超光（ちょうこう・推定。天界の御馬監で飼われる名馬の名）。踰輝（ゆき・推定。天界の御馬監で飼われる名馬の名）、弥景（びけい・推定。天界の御馬監で飼われる名馬の名）、騰霧（とうむ・推定。天界の御馬監で飼われる名馬の名）、勝黄（しょうこう・推定。天界の御馬監で飼われる名馬の名）。追風（ついふう・推定。天界の御馬監で飼われる名馬の名）、絶地（ぜっち・推定。天界の御馬監で飼われる名馬の名）、飛\U0002646D（ひひょく・推定。天界の御馬監で飼われる名馬の名）、奔霄（ほんしょう・推定。天界の御馬監で飼われる名馬の名）。逸飄（いつひょう・推定。天界の御馬監で飼われる名馬の名）、赤電（せきでん・推定。天界の御馬監で飼われる名馬の名）、銅爵（どうしゃく・推定。天界の御馬監で飼われる名馬の名）、浮雲（ふうん・推定。天界の御馬監で飼われる名馬の名）。驄瓏（そうろう・推定。天界の御馬監で飼われる名馬の名）、虎\U00029932（こらつ・推定。天界の御馬監で飼われる名馬の名）、絶塵（ぜつじん・推定。天界の御馬監で飼われる名馬の名）、紫鱗（しりん・推定。天界の御馬監で飼われる名馬の名）など。四極（しきょく・推定。東西南北の世界の果て）の地や大宛（だいえん。名馬の産地として知られた中央アジアの古国）の名馬、八駿（はっしゅん・推定。周の穆王が乗ったという八頭の名馬）や九逸（きゅういつ・推定。九頭を一組として伝えられる名馬）にも並ぶ、千里（り・推定。昔の道のりの単位。ここで日本の一里と同じ長さに換算はできない）を走る比類なき駿馬たちである。これらの良馬は、一匹一匹が風にいななき稲妻を追うほど気力に満ち、霧を踏み雲に昇るほど尽きぬ力を備えていた。"
  "translation_status": "reviewed"

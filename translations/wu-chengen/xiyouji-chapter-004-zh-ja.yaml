  "translation_ja": |-
    楽しく酒を飲んでいると、報告に来た者がいた。
    報告者「大王、門の外に独角鬼王（どっかくきおう・推定。孫悟空に仕えようと訪れた一本角の鬼の王。二人いる）が二人、大王にお目にかかりたいと申しております」
    孫悟空「通してやれ」
    独角鬼王は衣を整えて洞内へ駆け入り、身を伏せて拝した。孫悟空は尋ねた。
    孫悟空「俺に何の用だ？」
    独角鬼王「大王が賢者をお招きだとはかねて伺っておりましたが、お目にかかる機会がございませんでした。このたび天の名簿に名を連ねられ、めでたくご帰還なさったと聞き、赭黄色（しゃこうしょく・推定。赤みがかった黄色）の袍（ほう・推定。体をゆったり包む長い上着）を一着、お祝いに献上いたします。卑しい者とお見捨てにならず、私をお召し抱えくだされば、犬馬の労（けんばのろう・推定。主君のために忠実に尽くす働きをへりくだっていう言葉）を尽くすこともできましょう」
    孫悟空は大喜びで赭黄色の袍を着た。一同は喜んで列を整え、拝礼した。孫悟空はさっそく独角鬼王を前部総督先鋒（ぜんぶそうとくせんぽう・推定。軍の前方を統率して先に進む将の役職）に任じた。独角鬼王は恩に謝してから、重ねて申し上げた。
    独角鬼王「大王は長らく天上にいらっしゃいましたが、どの官職を授けられたのですか？」
    孫悟空「玉帝は賢者を軽んじて、俺を『弼馬温』とかいう官にしたのだ」
    これを聞くと、独角鬼王はまた進言した。
    独角鬼王「大王ほどの神通力（じんつうりき。修行によって得る、人の力を超えた不思議な能力）がおありなのに、どうしてあの方の馬を養うことなどありましょう。斉天大聖（せいてんたいせい。孫悟空が名乗る、天と並ぶ偉大な聖者という称号）とおなりになって、何の差し障りがありましょうか」
    孫悟空は聞くと喜びきって、何度も言った。
    孫悟空「いいぞ！　いいぞ！　いいぞ！」
    さらに四健将へ命じた。
    孫悟空「すぐに旗を用意し、『斉天大聖』の四文字を大きく書いて、竿を立てて掲げよ。これからは俺を斉天大聖とだけ呼べ。二度と大王と呼んではならん。各洞の妖王にも伝え、みなに知らせておけ」
    この話は、ここまでとしておこう。

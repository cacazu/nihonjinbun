  "translation_ja": |-
    初めて上界へ昇り、初めて天宮へ足を踏み入れる。幾万筋もの金の光が紅の虹にうねり、幾千筋もの瑞気が紫の霧を噴き上げる。見れば南天門は、深く澄んだ碧の瑠璃で造られ、まばゆい宝玉で飾られている。両側には数十人の鎮天元帥が並び、一人一人が梁や柱のもとにそびえ立ち、金飾りの弓を持ち、旄旗を抱えている。四方には十数人の金甲の神人が列をなし、戟を執って鞭を腰に掛け、刀や剣を構える。外側だけでも見事だが、中へ入ればさらに目を驚かす。奥には何本もの大柱があり、金の鱗が日に輝く赤髯の竜が柱に巻きついている。また幾つもの長い橋があり、彩り豊かな羽で空をしのぐ丹頂の鳳凰が、その上を巡っている。明るい霞はきらめいて天光を映し、碧の霧はおぼろに北斗の口を覆う。この天上には三十三の天宮がある。遣雲宮、毘沙宮、五明宮、太陽宮、花楽宮などで、どの宮にも、棟をくわえる金の獣飾りが据わる。また七十二重の宝殿がある。朝会殿、凌虚殿、宝光殿、天王殿、霊官殿などで、どの殿にも玉の麒麟を飾った柱が並ぶ。寿星台には、幾千年も散らない名花。煉薬炉のほとりには、幾万年も青さを失わない美しい草。さらに朝聖楼の前まで来ると、深紅の薄絹の衣には星々がきらめき、芙蓉の冠には黄金と玉が輝く。玉の簪、真珠の履、紫の組紐、金の印章。金の鐘が鳴れば三曹の神々が奏状を携えて丹塗りの御階へ進み、天の太鼓が響けば万の聖者が王に朝して玉帝を拝する。さらに霊霄宝殿へ来れば、玉の扉には金の鋲が群がり、朱の門には彩りの鳳凰が舞う。二重の通路と回廊は、どこも精巧で透き通るよう。三重の軒が四方に群がり、層ごとに竜と鳳凰が飛び交う。その上には、紫がかって高々と、まばゆく、まん丸く、きらきら輝く、大きな金の瓢箪形の頂がある。下には天妃が儀仗の扇を掲げ、玉女が仙巾を捧げ、朝廷を守る天将は厳めしく、御駕を護る仙卿は意気高い。真ん中の瑠璃の皿には、太乙丹が幾重にも積まれ、瑪瑙の瓶には、曲がりくねった珊瑚の枝が幾本も挿してある。まさしく天宮には、ありとあらゆる珍しい品があり、下界にはそのどれ一つとして同じものがない。金の宮門、銀の御車、紫の仙宮、玉のような花々と美しい草花。王に朝する玉兎は壇のほとりを過ぎ、聖帝に参る金烏はその下を飛ぶ。猴王は縁あって天の境へ来たり、人の世の泥に汚されずにすんだのである。

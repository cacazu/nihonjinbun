  "source_text": |-
    卻說那玉帝次日設朝，只見張天師引御馬監監丞、監副在丹墀下拜奏道：「萬歲，新任弼馬溫孫悟空，因嫌官小，昨日反下天宮去了。」正說間，又見南天門外增長天王領眾天丁，亦奏道：「弼馬溫不知何故，走出天門去了。」玉帝聞言，即傳旨：「著兩路神元，各歸本職。朕遣天兵，擒拿此怪。」班部中閃上托塔李天王與哪吒三太子，越班奏上道：「萬歲，微臣不才，請旨降此妖怪。」玉帝大喜，即封托塔天王李靖為降魔大元帥，哪吒三太子為三壇海會大神，即刻興師下界。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 11
  "translation_ja": |-
    さて、翌日、玉帝が朝議を開くと、張天師が御馬監の監丞と監副を連れてきた。二人は丹塗りの御階の下で拝礼し、奏上した。
    監丞と監副「陛下、新任の弼馬温、孫悟空は、官位が低いことを不満とし、昨日、天宮に背いて下界へ戻りました」
    その最中に、南天門から増長天王が天兵たちを率いて来て、やはり奏上した。
    増長天王「弼馬温が、どうしたわけか天門から出ていきました」
    玉帝はこれを聞き、ただちに旨を伝えた。
    玉帝「両方の神官は、それぞれ元の職務へ戻れ。朕が天兵を遣わし、この怪物を捕らえさせる」
    列の中から托塔李天王と哪吒三太子が進み出て奏上した。
    李天王と哪吒「陛下、臣らは不才ではございますが、この妖怪を降す勅命をお下しください」
    玉帝は大いに喜び、托塔天王李靖を降魔大元帥に、哪吒三太子を三壇海会大神に封じ、即刻兵を起こして下界へ向かわせた。
  "translation_status": "reviewed"
- "id": "xy-ch04-013"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    李天王與哪吒叩頭謝辭，徑至本宮，點起三軍，帥眾頭目，著巨靈神為先鋒，魚肚將掠後，藥叉將催兵。一霎時出南天門外，徑來到花果山，選平陽處安了營寨，傳令教巨靈神挑戰。巨靈神得令，結束整齊，掄著宣花斧，到了水簾洞外。只見小洞門外許多妖魔，都是些狼蟲虎豹之類，丫丫叉叉，掄槍舞劍，在那裡跳鬥咆哮。這巨靈神喝道：「那業畜！快早去報與弼馬溫知道：吾乃上天大將，奉玉帝旨意，到此收伏；教他早早出來受降，免致汝等皆傷殘也。」那些妖怪奔奔波波，傳報洞中道：「禍事了！禍事了！」猴王問：「有甚禍事？」眾妖道：「門外有一員天將，口稱大聖官銜，道奉玉帝聖旨，來此收伏。教早早出去受降，免傷我等性命。」猴王聽說，教：「取我披掛來。」就戴上紫金冠，貫上黃金甲，登上步雲鞋，手執如意金箍棒，領眾出門，擺開陣勢。這巨靈神睜睛觀看，真好猴王：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 12
  "translation_ja": |-
    李天王と哪吒は頭を地につけて恩に謝し、退出して自らの宮へ戻った。三軍を集め、諸将を率い、巨霊神を先鋒とし、魚肚将を後詰めに、薬叉将を督戦に当てた。たちまち南天門を出て花果山へ向かい、開けた平地を選んで陣を敷くと、巨霊神に挑戦を命じた。命を受けた巨霊神は身なりを整え、宣花斧を振るって水簾洞の外へ来た。小さな洞門の外には、狼や虎、豹などの猛獣の類の妖魔が大勢おり、入り乱れて槍や剣を振り、跳びはねて争い、吠えていた。巨霊神は一喝した。
    巨霊神「この畜生ども！　急いで弼馬温に知らせよ。我は天上の大将、玉帝の勅命を奉じ、ここへ討ち従えに来た。早く出てきて降伏せよと伝えろ。さもなくば、お前たちまでみな傷つき、倒れることになるぞ」
    妖怪たちは慌てふためき、洞内へ駆け込んで報告した。
    妖怪たち「大変です！　大変です！」
    孫悟空「何が大変なんだ？」
    妖怪たち「門の外に天将が一人、大聖の官名を呼び、玉帝の勅命で討ち従えに来たと言っております。私たちの命が惜しければ、早く出て降伏せよと」
    これを聞いた猴王は命じた。
    孫悟空「俺の鎧兜を持ってこい」
    紫金の冠をかぶり、黄金の鎧を着け、歩雲の靴を履き、如意金箍棒を手にして、一同を率いて門を出ると、陣形を整えた。巨霊神が目を見開いて見れば、まことに見事な猴王である。
  "translation_status": "reviewed"
- "id": "xy-ch04-014"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    身穿金甲亮堂堂，頭戴金冠光映映。
    手舉金箍棒一根，足踏雲鞋皆相稱。
    一雙怪眼似明星，兩耳過肩查又硬。
    挺挺身才變化多，聲音響喨如鐘磬。
    尖嘴咨牙弼馬溫，心高要做齊天聖。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 13
  "translation_ja": |-
    身には黄金の鎧がまばゆく、頭には黄金の冠が輝く。
    手に掲げるは一本の金箍棒、足に履いた雲の靴もよく似合う。
    二つの怪眼は明るく輝く星のよう、肩を越す両耳は張って硬い。
    すらりと立つ体は変化自在、声は鐘や磬のように響き渡る。
    尖った口に歯をむき出す弼馬温、志高く斉天聖を望んでいる。
  "translation_status": "reviewed"
- "id": "xy-ch04-015"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    巨靈神厲聲高叫道：「那潑猴！你認得我麼？」大聖聽言，急問道：「你是那路毛神？老孫不曾會你，你快報名來。」巨靈神道：「我把你那欺心的猢猻！你是認不得我。我乃高上神霄托塔李天王部下先鋒巨靈天將，今奉玉帝聖旨，到此收降你。你快卸了裝束，歸順天恩，免得這滿山諸畜遭誅；若道半個不字，教你頃刻化為齏粉。」猴王聽說，心中大怒道：「潑毛神！休誇大口，少弄長舌。我本待一棒打死你，恐無人去報信。且留你性命，快早回天，對玉皇說：他甚不用賢。老孫有無窮的本事，為何教我替他養馬？你看我這旌旗上字號，若依此字號陞官，我就不動刀兵，自然的天地清泰；如若不依，時間就打上靈霄寶殿，教他龍床定坐不成。」這巨靈神聞此言，急睜睛迎風觀看，果見門外豎一高竿，竿上有旌旗一面，上寫著「齊天大聖」四大字。巨靈神冷笑三聲道：「這潑猴，這等不知人事，輒敢無狀，你就要做齊天大聖。好好的吃吾一斧。」劈頭就砍將去。那猴王正是會家不忙，將金箍棒應手相迎。這一場好殺：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 14
  "translation_ja": |-
    巨霊神は鋭く大声を上げた。
    巨霊神「この不埒な猿め！　我を知っているか？」
    大聖は聞くと、すぐに問い返した。
    孫悟空「お前はどこの下っ端の神だ？　俺は会ったこともない。早く名を名乗れ」
    巨霊神「この不心得な猿めが！　我を知らぬのだな。我は高き神霄の托塔李天王に仕える先鋒、巨霊天将だ。今、玉帝の勅命を奉じ、お前を降伏させに来た。早く武装を解き、天の恩に従え。さすれば山じゅうの畜生どもも誅殺を免れよう。ひと言でも嫌だと言えば、たちまち粉々にしてくれる」
    猴王は聞くと、心中大いに怒った。
    孫悟空「ろくでもない下っ端の神め！　大口をたたくな、べらべらしゃべるな。本当なら一撃で叩き殺してやるところだが、そうすると知らせに戻る者がいなくなる。ひとまず命は助けてやる。早く天へ帰って玉皇に伝えろ。あいつはまったく賢者を用いることを知らん。この俺には尽きぬ技があるのに、なぜ奴の馬を養わせる？　俺の旗に書いた名を見ろ。この名どおりの官へ昇進させるなら、俺も兵を動かさず、天地はおのずと平穏になる。承知しなければ、すぐに霊霄宝殿へ攻め上がり、奴が玉座に落ち着いて座れないようにしてやる」
    巨霊神は聞くと、すぐに目を見開き、風上を見やった。なるほど洞門の外に高い竿が立ち、一枚の旗に「斉天大聖」の四文字が大きく書いてある。巨霊神は三度冷ややかに笑った。
    巨霊神「この不埒な猿め、そこまで世の道理を知らず、無礼にも斉天大聖になろうというのか。我の斧をたっぷり受けてみよ」
    頭めがけて斬りかかった。猴王は心得のある者の落ち着きで、金箍棒を手に応じて差し出し、迎え撃った。ここに見事な戦いが始まる。
  "translation_status": "reviewed"
- "id": "xy-ch04-016"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    棒名如意，斧號宣花。他兩個乍相逢，不知深淺，斧和棒，左右交加。一個暗藏神妙，一個大口稱誇。使動法，噴雲曖霧；展開手，播土揚沙。天將神通就有道，猴王變化實無涯。棒舉卻如龍戲水，斧來猶似鳳穿花。巨靈名望傳天下，原來本事不如他：大聖輕輕掄鐵棒，著頭一下滿身麻。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 15
  "translation_ja": |-
    棒の名は如意、斧の名は宣花。二人は初めて相まみえ、相手の力のほどは知らぬまま、斧と棒を左右に打ち交わす。一人はひそかに妙技を蔵し、一人は大口をたたいて誇る。術を使えば雲を噴き、霧をかすませ、腕を振るえば土を飛ばし、砂を巻き上げる。天将の神通力にも道の心得はあるが、猴王の変化はまことに果てしない。棒を挙げれば竜が水に戯れるよう、斧が来れば鳳凰が花をくぐるよう。巨霊の名は天下に知れ渡っていたが、実の腕前は猴王に及ばない。大聖が軽々と鉄棒を振り、頭上へ一撃すれば、全身がしびれてしまう。
  "translation_status": "reviewed"
- "id": "xy-ch04-017"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    巨靈神抵敵他不住，被猴王劈頭一棒，慌忙將斧架隔，扢扠的一聲，把個斧柄打做兩截，急撤身敗陣逃生。猴王笑道：「膿包，膿包。我已饒了你，你快去報信，快去報信。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 16
  "translation_ja": |-
    巨霊神は相手に抗しきれず、猴王が頭めがけて振り下ろした一撃に、慌てて斧を差し上げて防いだ。ばきりという音とともに斧の柄は真っ二つになり、急いで身を引き、敗走して命を拾った。猴王は笑った。
    孫悟空「腰抜けめ、腰抜けめ！　命は助けてやったぞ。早く知らせに行け、知らせに行け！」
  "translation_status": "reviewed"
- "id": "xy-ch04-018"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    巨靈神回至營門，徑見托塔天王，忙哈哈跪下道：「弼馬溫果是神通廣大，末將戰他不得，敗陣回來請罪。」李天王發怒道：「這廝剉吾銳氣，推出斬之！」傍邊閃出哪吒太子拜告：「父王息怒，且恕巨靈之罪。待孩兒出師一遭，便知深淺。」天王聽諫，且教回營待罪管事。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 17
  "translation_ja": |-
    巨霊神は陣門へ帰ると、まっすぐ托塔天王の前へ進み、慌ただしくひざまずいた。
    巨霊神「弼馬温は、まことに神通力の大きな者でございます。末将では敵わず、敗れて戻りました。どうかお裁きください」
    李天王は怒った。
    李天王「この者、我が軍の鋭気をくじきおった。引き出して斬れ！」
    傍らから哪吒太子が進み出て、拝して申し上げた。
    哪吒「父上、お怒りをお鎮めください。ひとまず巨霊の罪をお許し願います。私が一度出陣すれば、相手の力のほども分かりましょう」
    天王は諫めを聞き入れ、ひとまず巨霊神を陣へ戻し、処分を待ちながら務めを続けるよう命じた。
  "translation_status": "reviewed"
- "id": "xy-ch04-019"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    這哪吒太子甲冑齊整，跳出營盤，撞至水簾洞外。那悟空正來收兵，見哪吒來的勇猛。好太子：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 18
  "translation_ja": |-
    哪吒太子は鎧兜を整え、陣営から跳び出して水簾洞の外へ押し寄せた。悟空はちょうど兵を収めようとしており、勇ましくやって来る哪吒を見た。なんと見事な太子であろう。
  "translation_status": "reviewed"
- "id": "xy-ch04-020"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    總角才遮顖，披毛未蓋肩。神奇多敏悟，骨秀更清妍。誠為天上麒麟子，果是煙霞彩鳳仙。龍種自然非俗相，妙齡端不類塵凡。身帶六般神器械，飛騰變化廣無邊。今受玉皇金口詔，敕封海會號三壇。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 19
  "translation_ja": |-
    両角に結った髪は、ようやく頭の頂を覆うほど。垂らした髪も、まだ肩には届かない。不思議なほど聡明で機敏、骨格は秀で、姿はいよいよ清らかで美しい。まことに天上の麒麟児、まさしく霞の中の彩鳳の仙人。竜の血筋ゆえ、おのずと俗人の相ではなく、若い年頃ながら、まるで下界の者とは違う。身には六種の神の武器を帯び、飛翔も変化も広大無辺。今、玉皇じきじきの詔を受け、海会をつかさどり三壇と号する大神に封ぜられた。
  "translation_status": "reviewed"
- "id": "xy-ch04-021"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    悟空迎近前來問曰：「你是誰家小哥？闖近吾門，有何事幹？」哪吒喝道：「潑妖猴！豈不認得我？我乃托塔天王三太子哪吒是也，今奉玉帝欽差，至此捉你。」悟空笑道：「小太子，你的嬭牙尚未退，胎毛尚未乾，怎敢說這般大話？我且留你的性命，不打你。你只看我旌旗上是甚麼字號，拜上玉帝：是這般官銜，再也不須動眾，我自皈依；若是不遂我心，定要打上靈霄寶殿。」哪吒擡頭看處，乃「齊天大聖」四字。哪吒道：「這妖猴能有多大神通，就敢稱此名號？不要怕，吃吾一劍。」悟空道：「我只站下不動，任你砍幾劍罷。」那哪吒奮怒，大喝一聲，叫：「變！」即變做三頭六臂，惡狠狠，手持著六般兵器，乃是斬妖劍、砍妖刀、縛妖索、降妖杵、繡毬兒、火輪兒，丫丫叉叉，撲面來打。悟空見了，心驚道：「這小哥倒也會弄些手段。莫無禮，看我神通。」好大聖，喝聲：「變！」也變做三頭六臂；把金箍棒幌一幌，也變作三條。六隻手拿著三條棒架住。這場鬥，真個是地動山搖，好殺也：
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 20
  "translation_ja": |-
    悟空は進み出て迎え、尋ねた。
    孫悟空「お前は、どこの家の坊やだ？　俺の門まで押しかけて、何の用だ？」
    哪吒は怒鳴った。
    哪吒「不埒な妖猿め！　我を知らぬのか。我こそ托塔天王の三太子、哪吒だ。玉帝からじきじきに命を受け、お前を捕らえに来た」
    悟空は笑った。
    孫悟空「小太子よ、まだ乳歯も抜けず、産毛も乾かんくせに、よくもそんな大口をたたくものだ。ひとまず命は助けてやる。お前を打ちはせん。俺の旗に何と書いてあるかを見て、玉帝へ申し上げろ。この官名を授けるなら、もう大勢の兵を動かすまでもなく、俺から帰順する。望みをかなえないなら、必ず霊霄宝殿へ攻め上がるぞ」
    哪吒が顔を上げて見ると、「斉天大聖」の四文字だった。
    哪吒「この妖猿、どれほどの神通力があって、その名を称する気だ？　怖じけるな。我の剣を受けてみよ」
    孫悟空「俺はここに立ったまま動かん。好きなだけ斬りつけてみろ」
    哪吒は怒りに燃え、声を張り上げた。
    哪吒「変われ！」
    たちまち三つの頭、六本の腕となり、凶暴な形相で六種の武器を手にした。斬妖剣、砍妖刀、縛妖索、降妖杵、刺繍の毬、火の輪である。それらを入り乱れさせ、正面から襲いかかった。悟空は見ると、心中驚いて言った。
    孫悟空「この坊や、なかなかの術を使うじゃないか。無礼はよせ。俺の神通力を見ろ」
    見事な大聖も一声叫んだ。
    孫悟空「変われ！」
    こちらも三つの頭、六本の腕となり、金箍棒をひと振りして三本に変えた。六つの手で三本の棒を取り、相手の攻撃を受け止める。この戦い、まことに地は揺れ山は震え、すさまじい争いとなった。
  "translation_status": "reviewed"
- "id": "xy-ch04-022"
  "section_id": "chapter-04"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    六臂哪吒太子，天生美石猴王，相逢真對手，正遇本源流。那一個蒙差來下界，這一個欺心鬧鬥牛。斬妖寶劍鋒芒快，砍妖刀狠鬼神愁；縛妖索子如飛蟒，降妖大杵似狼頭；火輪掣電烘烘艷，往往來來滾繡毬。大聖三條如意棒，前遮後擋運機謀。苦爭數合無高下，太子心中不肯休。把那六件兵器多教變，百千萬億照頭丟。猴王不懼呵呵笑，鐵棒翻騰自運籌。以一化千千化萬，滿空亂舞賽飛虯。諕得各洞妖王都閉戶，遍山鬼怪盡藏頭。神兵怒氣雲慘慘，金箍鐵棒響颼颼。那壁廂，天丁吶喊人人怕；這壁廂，猴怪搖旗個個憂。發狠兩家齊鬥勇，不知那個剛強那個柔。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 21
  "translation_ja": |-
    六本腕の哪吒太子と、天の生んだ美しい石の猴王。真に好敵手と巡り合い、まさしく同じ根源に通じる者と出会った。あちらは命を受けて下界へ来たり、こちらは不遜にも斗・牛の星々の天界を騒がす。妖を斬る宝剣は鋭く、妖を断つ刀はすさまじく、鬼神すら憂える。妖を縛る索は飛ぶ大蛇のよう、妖を降す大杵は狼の頭のよう。火の輪は稲妻を放って赤々と燃え、刺繍の毬は行きつ戻りつ転がる。大聖の三本の如意棒は、前を遮り後ろを防ぎ、巧みに策を巡らせる。何合も激しく争ってなお優劣はなく、太子の心は休もうとしない。六つの武器をさらに変じ、百千万億に増やして頭上へ投げつける。猴王は恐れず、からからと笑い、鉄棒をひるがえして自ら策を繰り出す。一を千に、千を万に変じ、空いっぱいに乱舞させれば、飛ぶ竜にも勝る勢い。恐れた各洞の妖王はみな戸を閉ざし、山じゅうの鬼怪はことごとく頭を隠す。神の武器は怒気を発して雲を暗くし、金箍の鉄棒はひゅうひゅうと鳴る。あちらでは天兵がときの声を上げ、誰もが恐れを抱き、こちらでは猿の妖怪が旗を振り、一匹一匹が気をもむ。両者とも激しく勇を競い、どちらが強く、どちらが弱いとも分からない。
  "translation_status": "reviewed"
- "id": "xy-ch04-023"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    三太子與悟空各騁神威，鬥了個三十回合。那太子六般兵，變做千千萬萬；孫悟空金箍棒，變作萬萬千千。半空中似雨點流星，不分勝負。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 22
  "translation_ja": |-
    三太子と悟空は、互いに神威を振るい、三十合を戦った。太子の六種の武器は千にも万にも変わり、孫悟空の金箍棒も万にも千にも増える。空中は雨粒や流星が降るようで、勝敗はつかなかった。
  "translation_status": "reviewed"
- "id": "xy-ch04-024"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    原來悟空手疾眼快，正在那混亂之時，他拔下一根毫毛，叫聲：「變！」就變做他的本相，手挺著棒，演著哪吒；他的真身，卻一縱，趕至哪吒腦後，著左膊上一棒打來。哪吒正使法間，聽得棒頭風響，急躲閃時，不能措手，被他著了一下，負痛逃走。收了法，把六件兵器依舊歸身，敗陣而回。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 23
  "translation_ja": |-
    もともと悟空は手も目も素早い。この入り乱れた最中に、毛を一本抜いて叫んだ。
    孫悟空「変われ！」
    毛は悟空自身の姿となり、棒を突き出して哪吒と渡り合った。その間に本体はひと跳びして哪吒の背後へ回り、左腕めがけて一棒を打ち下ろした。哪吒はまさに術を使っている最中、棒の先が風を切る音を聞き、急いでかわそうとしたが、手を打つ間もなく一撃を受けた。痛みに耐えながら逃れ、術を収め、六つの武器を元どおり身に戻して、敗走した。
  "translation_status": "reviewed"
- "id": "xy-ch04-025"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    那陣上李天王早已看見，急欲提兵助戰，不覺太子倏至面前，戰兢兢報道：「父王，弼馬溫真個有本事，孩兒這般法力，也戰他不過，已被他打傷膊也。」天王大驚失色道：「這廝恁的神通，如何取勝？」太子道：「他洞門外豎一竿旗，上寫『齊天大聖』四字。親口誇稱，教玉帝就封他做齊天大聖，萬事俱休；若還不是此號，定要打上靈霄寶殿哩。」天王道：「既然如此，且不要與他相持，且去上界，將此言回奏，再多遣天兵，圍捉這廝，未為遲也。」太子負痛，不能復戰，故同天王回天啟奏不題。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 24
  "translation_ja": |-
    陣中の李天王は早くから様子を見ており、急いで兵を率いて加勢しようとした。すると、いつの間にか太子が目の前へ戻り、震えながら報告した。
    哪吒「父上、弼馬温は本当に腕が立ちます。私のこれほどの法力をもってしても敵わず、腕を打たれてしまいました」
    天王は仰天して顔色を変えた。
    李天王「あやつにそれほどの神通力があるとは。どうすれば勝てるのだ？」
    哪吒「洞門の外に旗を一本立て、『斉天大聖』の四文字を大きく書いています。玉帝が自分を斉天大聖に封じれば、すべてを収めるが、その名でなければ必ず霊霄宝殿へ攻め上がると、本人が大言しておりました」
    李天王「それなら、ひとまずあやつと争うのはやめよう。まず天上へ戻り、その言葉を奏上して、さらに多くの天兵を遣わしてもらい、取り囲んで捕らえても遅くはない」
    太子は傷が痛んで再び戦うことができず、天王とともに天へ戻り、奏上することとなった。そちらの話は、ひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch04-026"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    你看那猴王得勝歸山，那七十二洞妖王與那六弟兄，俱來賀喜，在洞天福地，飲樂無比。他卻對六弟兄說：「小弟既稱齊天大聖，你們亦可以大聖稱之。」內有牛魔王忽然高叫道：「賢弟言之有理，我即稱做平天大聖。」蛟魔王道：「我稱做覆海大聖。」鵬魔王道：「我稱混天大聖。」獅狔王道：「我稱移山大聖。」獼猴王道：「我稱通風大聖。」𤟹狨王道：「我稱驅神大聖。」此時七大聖自作自為，自稱自號，耍樂一日，各散訖。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 25
  "translation_ja": |-
    一方、勝って山へ帰った猴王には、七十二洞の妖王と六人の義兄弟がみな祝いに来て、恵まれた仙境でこの上なく楽しく酒を酌み交わしていた。悟空は六人に言った。
    孫悟空「弟分の俺が斉天大聖と称したのですから、兄さんたちも大聖と名乗ってはいかがですか」
    その中で牛魔王が、突然大声を上げた。
    牛魔王「弟よ、それはもっともだ。俺は平天大聖と名乗ろう」
    蛟魔王「俺は覆海大聖と名乗ろう」
    鵬魔王「俺は混天大聖と名乗ろう」
    獅狔王「俺は移山大聖と名乗ろう」
    獼猴王「俺は通風大聖と名乗ろう」
    禺狨王「俺は駆神大聖と名乗ろう」
    こうして七大聖は、勝手気ままに自分で名を称し、号を定め、一日遊び楽しんでから、それぞれ帰っていった。
  "translation_status": "reviewed"

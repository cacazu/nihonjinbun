  "translation_ja": |-
    ある日、暇を得た監官（かんかん・推定。御馬監に勤める役人）たちは宴席を設けた。一つには着任をねぎらい、一つには栄達を祝うためである。楽しく飲んでいる最中、弼馬温はふと杯を置いて尋ねた。
    弼馬温「俺の弼馬温というのは、どういう官職なんだ？」
    監官たち「それが、そのまま官名でございます」
    弼馬温「その官は、何品（ひん・推定。官吏の等級・位階を表す単位）なんだ？」
    監官たち「品級（ひんきゅう・推定。官職の上下を表す等級）はございません」
    弼馬温「品がない？　それなら、この上なく高いということか？」
    監官たち「高くはありません、高くはありません。ただ『未入流（みにゅうりゅう・推定。正規の官位の等級に入らない下級の身分）』と呼ばれております」
    弼馬温「『未入流』とは、どういうことだ？」
    監官たち「いちばん末の位です。この官は最も低く、小さな役で、馬の世話をするだけです。長官のように、ご着任から熱心に働き、馬を肥やしても、『よい』と一言ほめられるだけ。少しでも馬が痩せ衰えれば叱責を受け、ひどく傷つけでもすれば、罰金を科され、罪を問われるのです」
    弼馬温はこれを聞くと、思わず胸に火がついた。歯を食いしばり、激しく怒った。
    弼馬温「そこまで俺を見くびるのか！　花果山（かかざん。石猿が生まれ、猿たちが暮らす山）では王と仰がれ、祖と敬われていたこの俺を、だまして連れてきて、奴の馬を養わせるとは。馬飼いなど、若い下っ端の下賤な仕事だ。俺にさせることか！　やめだ、やめだ。俺は帰るぞ」
    どんと役所の机をひっくり返し、耳から宝を取り出してひと振りすると、椀ほどの太さになった。棒の技を繰り出しながら御馬監を打って出て、まっすぐ南天門へ向かった。天兵たちは、孫悟空が仙人の名簿に載り、弼馬温の官にあると知っていたので、あえて止めず、天門から打って出るままにした。

  "translation_ja": |-
    さて、翌日、玉帝が朝議を開くと、張天師（ちょうてんし・推定。御馬監の役人を玉帝へ取り次ぐ道教の天師）が御馬監の監丞と監副を連れてきた。二人は丹塗りの御階の下で拝礼し、奏上した。
    監丞と監副「陛下、新任の弼馬温、孫悟空は、官位が低いことを不満とし、昨日、天宮に背いて下界へ戻りました」
    その最中に、南天門から増長天王が天兵たちを率いて来て、やはり奏上した。
    増長天王「弼馬温が、どうしたわけか天門から出ていきました」
    玉帝はこれを聞き、ただちに旨を伝えた。
    玉帝「両方の神官は、それぞれ元の職務へ戻れ。朕が天兵を遣わし、この怪物を捕らえさせる」
    列の中から托塔李天王（たくとうりてんのう・推定。天軍を率いる李靖の称号）と哪吒三太子（なたさんたいし・推定。李天王の三男である少年神）が進み出て奏上した。
    李天王（りてんのう・推定。天軍を率いる李靖の呼び名）と哪吒（なた。李天王の三男である少年神）「陛下、臣らは不才ではございますが、この妖怪を降す勅命をお下しください」
    玉帝は大いに喜び、托塔天王李靖（たくとうてんのうりせい・推定。天軍を率いる李靖の称号と名）を降魔大元帥（ごうまだいげんすい・推定。妖魔討伐の総指揮官として李靖に授けられた称号）に、哪吒三太子を三壇海会大神（さんだんかいえだいじん・推定。玉帝が哪吒に授けた神の称号）に封じ、即刻兵を起こして下界へ向かわせた。

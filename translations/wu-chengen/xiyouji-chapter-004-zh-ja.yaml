    猴王は喜び勇んで木徳星官とともに着任した。用がすむと、木徳星官は自分の宮へ帰った。悟空は御馬監で、監丞、監副、典簿、力士をはじめ、大小の役人たちを集め、役所の務めを調べた。管理するのは天馬千匹である。その馬とは、次のような名馬たちだった。

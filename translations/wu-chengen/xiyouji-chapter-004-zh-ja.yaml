    驊騮騏驥，騄駬纖離；龍媒紫燕，挾翼驌驦；駃騠銀騔，騕褭飛黃；騊駼翻羽，赤兔超光；踰輝彌景，騰霧勝黃；追風絕地，飛𦑭奔霄；逸飄赤電，銅爵浮雲；驄瓏虎𩤲，絕塵紫鱗；……四極大宛，八駿九逸，千里絕群。此等良馬，一個個嘶風逐電精神壯，踏霧登雲氣力長。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"

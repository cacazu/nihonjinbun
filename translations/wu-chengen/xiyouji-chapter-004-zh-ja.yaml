    這猴王查看了文簿，點明了馬數。本監中典簿管徵備草料；力士官管刷洗馬匹、扎草、飲水、煮料；監丞、監副輔佐催辦。弼馬晝夜不睡，滋養馬匹。日間舞弄猶可，夜間看管慇懃：但是馬睡的，趕起來吃草；走的，捉將來靠槽。那些天馬見了他，泯耳攢蹄。倒養得肉肥膘滿。不覺的半月有餘。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 7
  "translation_ja": |-
    猴王は帳簿を調べ、馬の数を確かめた。御馬監では、典簿が飼料の調達を受け持ち、力士の役人が馬を洗い、草を束ね、水を飲ませ、飼料を煮る。監丞と監副は長官を助け、仕事を督励する。弼馬温は昼も夜も眠らず、馬を養った。昼間に動き回るのはまだしも、夜もかいがいしく見守り、寝ている馬は起こして草を食べさせ、歩き回る馬はつかまえて飼い葉桶につけた。天馬たちは悟空を見ると、耳を伏せて蹄を寄せ、おとなしくなった。そのため馬はよく肥え、肉づきもたっぷりした。いつしか半月余りが過ぎていた。
  "translation_status": "reviewed"

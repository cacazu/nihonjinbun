  "source_text": |-
    那太白金星與美猴王同出了洞天深處，一齊駕雲而起。原來悟空觔斗雲比眾不同，十分快疾，把個金星撇在腦後，先至南天門外。正欲收雲前進，被增長天王領著龐、劉、苟、畢、鄧、辛、張、陶一路大力天丁，槍刀劍戟，擋住天門，不肯放進。猴王道：「這個金星老兒乃奸詐之徒，既請老孫，如何教人動刀動槍，阻塞門路？」正嚷間，金星倏到。悟空就覿面發狠道：「你這老兒，怎麼哄我？被你說奉玉帝招安旨意來請，卻怎麼教這些人阻住天門，不放老孫進去？」金星笑道：「大王息怒。你自來未曾到此天堂，卻又無名，眾天丁又與你素不相識，他怎肯放你擅入？等如今見了天尊，授了仙籙，注了官名，向後隨你出入，誰復擋也？」悟空道：「這等說，也罷，我不進去了。」金星又用手扯住道：「你還同我進去。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 1
  "translation_ja": |-
    太白金星と美猴王は、洞天の奥深くから連れ立って出ると、ともに雲に乗って舞い上がった。もともと悟空の筋斗雲はほかとは違い、たいへん速い。金星を後方へ置き去りにして、先に南天門の外へ着いてしまった。雲を収めて進もうとすると、増長天王が龐・劉・苟・畢・鄧・辛・張・陶の力ある天兵たちを率い、槍、刀、剣、戟を構えて天門をふさぎ、中へ入れようとしない。
    孫悟空「あの金星のじいさんは、腹黒い奴だ。俺を招いておきながら、どうして人に刀や槍を振るわせ、道をふさがせるんだ？」
    わめいているところへ、金星がたちまち追いついた。悟空はその顔を見るなり、怒りをあらわにした。
    孫悟空「じいさん、よくも俺をだましたな。玉帝が招き入れるという勅命で迎えに来たと言ったくせに、なぜこいつらに天門をふさがせ、俺を入れないんだ？」
    金星は笑って答えた。
    太白金星「大王、お怒りをお鎮めください。あなたは、これまでこの天界へ来られたことがなく、まだ名も登録されておりません。天兵たちもあなたとは面識がありませんから、勝手にお通しするわけにはいかないのです。これから天尊にお会いし、仙人の名簿に載り、官名が記されれば、以後は自由に出入りできます。誰が止めましょう」
    孫悟空「そういうことなら、もういい。俺は入らん」
    金星は再び悟空の手を引いた。
    太白金星「まあ、私と一緒にお入りください」
  "translation_status": "reviewed"

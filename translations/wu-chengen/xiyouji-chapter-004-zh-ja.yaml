  "reader_notes_ja":
  - "対象は第四回「官封弼馬心何足 名注齊天意未寧」の回題から回末の結語まで。散文・会話・挿入韻文7箇所を省略せず、全34対訳単位に収めた。口頭の奏上はあるが、独立した奏状文書はこの回にない。"
  - "底本は中文Wikisourceの固定版oldid=2449093（2024年8月23日03:20の版）。同じoldidを示す繁体表示と全文比較し、「喂→餵」「斗→鬥」の表示差2字を記録した。取得原文の全行と単位対応はverificationのマニフェストに収めた。"
  - "原典は公有である一方、電子翻刻の帰属と継承条件を保持する。日本語はAIによる新訳であり、専門家による独立校訂は未実施。"
  - "人物の口調は原文通読後に作品READMEへ追加した新人物・発話集団17項目、各3創作例の設計を参照した。各セリフの直前に話者を示し、悟空の怒り、兄たちへの敬意、再招安の使者への礼を区別する。"
  - "名馬「飛\U0002646D」「虎\U00029932」は原字を保持し、名称の日本語読みを留保した。獅狔王は第三回の獅駝王と異なる底本の表記を保持する。禺狨王の原文表記「\U000247F9狨王」は変更していない。"
  - "金星の再招安の説明には内側の閉じ引用符の欠けがある。原文は補訂せず、訳文では「斉天大聖になろうとしております」で引用を閉じ、続く「この私が」を金星本人の自称として扱った。"
  - "「未入流」は位階外の低い役職であり、位階がないから最高位だという悟空の誤解を区別する。「唱喏」は声と両手を組む礼で、平伏へ置き換えない。哪吒の刺繍の毬と火の輪を、別の武器名や乗り物に改めない。"
  - "韻文中の繁体表示「鬧鬥牛」は無変換表示「鬧斗牛」に対応し、斗・牛の星宿を通じた天界の表現として訳した。建築装飾「金穩獸」は棟をくわえる金の獣飾りとし、個別の様式名は確定していない。"

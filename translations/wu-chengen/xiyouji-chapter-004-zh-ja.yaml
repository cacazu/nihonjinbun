  "source_text": |-
    太白金星領著美猴王，到於靈霄殿外，不等宣詔，直至御前，朝上禮拜。悟空挺身在傍，且不朝禮，但側耳以聽金星啟奏。金星奏道：「臣領聖旨，已宣妖仙到了。」玉帝垂簾問曰：「那個是妖仙？」悟空卻才躬身答應道：「老孫便是。」仙卿們都大驚失色道：「這個野猴，怎麼不拜伏參見，輒敢這等答應道：『老孫便是。』卻該死了，該死了。」玉帝傳旨道：「那孫悟空乃下界妖仙，初得人身，不知朝禮，且姑恕罪。」眾仙卿叫聲：「謝恩。」猴王卻才朝上唱個大喏。玉帝宣文選武選仙卿，看那處少甚官職，著孫悟空去除授。傍邊轉過武曲星君啟奏道：「天宮裡各宮各殿，各方各處，都不少官，只是御馬監缺個正堂管事。」玉帝傳旨道：「就除他做個弼馬溫罷。」眾臣叫謝恩，他也只朝上唱個大喏。玉帝又差木德星官送他去御馬監到任。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第004回&oldid=2449093&variant=zh-hant"
    "source_sequence": 4
  "translation_ja": |-
    太白金星は美猴王を連れて霊霄殿の外へ来ると、お召しを待たずに御前まで進み、玉帝へ礼拝した。悟空は傍らに体をまっすぐ立て、朝廷の礼もとらず、金星の奏上に耳を傾けるばかりだった。
    太白金星「臣、勅命を奉じ、妖仙を召し連れてまいりました」
    玉帝は御簾を垂れたまま尋ねた。
    玉帝「どれが妖仙か？」
    悟空はようやく身をかがめて答えた。
    孫悟空「この俺だ」
    仙卿たちはみな仰天し、顔色を変えた。
    仙卿たち「この野猿め、なぜひざまずいて拝謁もせず、『この俺だ』などと答えるのだ。死罪に当たるぞ、死罪だ」
    玉帝は旨を伝えた。
    玉帝「孫悟空は下界の妖仙で、ようやく人の身を得たばかり、朝廷の礼を知らぬ。ひとまず罪を許せ」
    仙卿たち「ご恩に謝せよ」
    猴王はそこで初めて、玉帝に向かって声を上げ、両手を組んで一礼した。玉帝は文官・武官の選任をつかさどる仙卿を呼び、どこにどんな欠員があるか調べ、孫悟空を任命するよう命じた。傍らから武曲星君が進み出て奏上した。
    武曲星君「天宮の各宮、各殿、いずれの場所にも官の欠員はございません。ただ御馬監に、全体を取り仕切る長官がおりません」
    玉帝「では、弼馬温に任ぜよ」
    臣下たちが恩に謝するよう促しても、悟空はやはり玉帝に向かって声を上げ、両手を組んで一礼するだけだった。玉帝はさらに木徳星官を遣わし、御馬監へ送り届けて着任させた。
  "translation_status": "reviewed"

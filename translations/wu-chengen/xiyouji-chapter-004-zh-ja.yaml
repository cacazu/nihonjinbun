  "translation_ja": |-
    驊騮、騏驥、騄駬、繊離。竜媒、紫燕、挾翼、驌驦。駃騠、銀騔、騕褭、飛黄。騊駼、翻羽、赤兎、超光。踰輝、弥景、騰霧、勝黄。追風、絶地、飛𦑭、奔霄。逸飄、赤電、銅爵、浮雲。驄瓏、虎𩤲、絶塵、紫鱗など。四極の地や大宛の名馬、八駿や九逸にも並ぶ、千里を走る比類なき駿馬たちである。これらの良馬は、一匹一匹が風にいななき稲妻を追うほど気力に満ち、霧を踏み雲に昇るほど尽きぬ力を備えていた。

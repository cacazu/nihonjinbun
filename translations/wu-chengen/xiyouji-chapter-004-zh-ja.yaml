  "source_text": "那太白金星與美猴王同出了洞天深處，一齊駕雲而起。原來悟空觔斗雲比眾不同，十分快疾，把個金星撇在腦後，先至南天門外。正欲收雲前進，被增長天王領著龐、劉、苟、畢、鄧、辛、張、陶一路大力天丁，槍刀劍戟，擋住天門，不肯放進。猴王道：「這個金星老兒乃奸詐之徒，既請老孫，如何教人動刀動槍，阻塞門路？」正嚷間，金星倏到。悟空就覿面發狠道：「你這老兒，怎麼哄我？被你說奉玉帝招安旨意來請，卻怎麼教這些人阻住天門，不放老孫進去？」金星笑道：「大王息怒。你自來未曾到此天堂，卻又無名，眾天丁又與你素不相識，他怎肯放你擅入？等如今見了天尊，授了仙籙，注了官名，向後隨你出入，誰復擋也？」悟空道：「這等說，也罷，我不進去了。」金星又用手扯住道：「你還同我進去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch4-2449093"

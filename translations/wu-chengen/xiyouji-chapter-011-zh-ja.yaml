  "translation_ja": |-
    はるかな昔から国は幾度変わり、代々の王朝は興っては滅びてきた。
    周（しゅう）、秦（しん）、漢（かん）、晋（しん）に珍事は多いが、誰が唐王（とうおう）のように死んで蘇っただろう。
  "translation_status": "reviewed"
- "id": "xy-ch11-029"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日天色已晚，眾臣請王歸寢，各各散訖。"
  "source_languages":

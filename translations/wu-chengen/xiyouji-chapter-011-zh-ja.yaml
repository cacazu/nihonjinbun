- "id": "xy-ch11-016"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    前進又歷了許多衙門，一處處俱是悲聲振耳，惡怪驚心。太宗又道：「此是何處？」判官道：「此是陰山背後一十八層地獄。」太宗道：「是那十八層？」判官道：「你聽我說：
    吊筋獄、幽枉獄、火坑獄，寂寂寥寥，煩煩惱惱，盡皆是生前作下千般業，死後通來受罪名。酆都獄、拔舌獄、剝皮獄，哭哭啼啼，悽悽慘慘，只因不忠不孝傷天理，佛口蛇心墮此門。磨捱獄、碓搗獄、車崩獄，皮開肉綻，抹嘴咨牙，乃是瞞心昧己不公道，巧語花言暗損人。寒冰獄、脫殼獄、抽腸獄，垢面蓬頭，愁眉皺眼，都是大斗小秤欺痴蠢，致使災屯累自身。油鍋獄、黑暗獄、刀山獄，戰戰兢兢，悲悲切切，皆因強暴欺良善，藏頭縮頸苦伶仃。血池獄、阿鼻獄、秤杆獄，脫皮露骨，折臂斷筋，也只為謀財害命，宰畜屠生，墮落千年難解釋，沉淪永世不翻身。一個個緊縛牢拴，繩纏索綁。差些赤髮鬼、黑臉鬼，長槍短劍；牛頭鬼、馬面鬼，鐵簡銅鎚：只打得皺眉苦面血淋淋，叫地叫天無救應。
    正是：
    人生卻莫把心欺，神鬼昭彰放過誰？
    善惡到頭終有報，只爭來早與來遲。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 156
    "line_end": 163
  "translation_ja": |-
    さらに進み、いくつもの役所を通ったが、どこも悲鳴が耳を打ち、恐ろしい怪物が心を震えさせた。太宗はまた尋ねた。
    太宗「ここはどこなのだ。」
    崔珏「陰山の裏にある、十八層の地獄です。」
    太宗「その十八層とは、どのようなものだ。」
    崔珏「お聞きください。
    吊筋獄（ちょうきんごく）、幽枉獄（ゆうおうごく）、火坑獄（かこうごく）。寂しく心細く、悩み苦しむ者ばかり。皆、生前に千様の悪業をなしたため、死後ここへ来て罪を受けるのです。
    酆都獄（ほうとごく）、抜舌獄（ばつぜつごく）、剝皮獄（はくひごく）。泣きに泣いて、惨めに苦しむ者ばかり。不忠不孝によって天の道理を損ない、口では仏を唱えながら心は蛇のようであったため、この門に堕ちたのです。
    磨捱獄（まがいごく）、碓搗獄（たいとうごく）、車崩獄（しゃほうごく）。皮は裂け、肉ははじけ、口をゆがめて歯をむき出す者ばかり。自分の良心を欺いて道理に背き、巧みな口先でひそかに人を損なった者です。
    寒氷獄（かんぴょうごく）、脱殻獄（だっかくごく）、抽腸獄（ちゅうちょうごく）。顔は垢にまみれ、髪は乱れ、眉を曇らせ、目元にしわを寄せる者ばかり。大きな枡で受け取り、小さな秤で渡して、愚かなお人好しを欺いたため、災いが重なって我が身に及んだのです。
    油鍋獄（ゆかごく）、黒暗獄（こくあんごく）、刀山獄（とうざんごく）。おののき震え、悲しみ嘆く者ばかり。暴力を振るって善良な人をいじめたため、頭を隠し首をすくめ、孤独な苦しみにあえぐのです。
    血池獄（けっちごく）、阿鼻獄（あびごく）、秤杆獄（しょうかんごく）。皮が剝けて骨があらわになり、腕を折られ筋を断たれる者ばかり。財を奪おうと人を殺し、家畜や生き物を殺したため、千年堕ちても解き放たれず、とこしえに沈んで浮かばれないのです。
    一人残らず固くつながれ、縄で巻かれ綱で縛られています。そこへ赤髪の鬼と黒い顔の鬼が長槍と短剣を、牛頭の鬼と馬面の鬼が鉄の棒と銅の槌を持って差し向けられます。打たれる者は眉をひそめ苦悶の顔をして、血だらけになり、地に叫び天に叫んでも助けはありません。
    まことに、こういうことです。
    人として生きるなら、己の心を欺くな。神も鬼も明らかに見通している。誰を見逃そうか。
    善も悪もついには報いを受ける。ただ、来るのが早いか遅いかの違いだけ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "地獄十八名称は底本字を保持し全列挙した。磨捱の具体的な処刑内容や幽枉等の難解な名称の意味は無断で詳説しない。抹嘴咨牙は顔をゆがめ歯をむく苦悶の表情と解した。鉄簡は巻物ではなく打撃用武器として鉄の棒とした。"

    "line_end": 194
  "translation_ja": "その日はもう遅くなっていたので、臣たちは太宗にお休みになるよう勧め、それぞれ退出した。"
  "translation_status": "reviewed"
- "id": "xy-ch11-030"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次早，脫卻孝衣，換了綵服，一個個紅袍烏帽，一個個紫綬金章，在那朝門外等候宣召。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 196
    "line_end": 196
  "translation_ja": "翌朝は喪服を脱ぎ、晴れの衣に着替えた。皆、紅の袍に黒い帽子、紫の組紐に金の印章という姿で、朝門（ちょうもん）の外に立ち、召し出しを待った。"
  "translation_status": "reviewed"
- "id": "xy-ch11-031"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說太宗自服了安神定魄之劑，連進了數次粥湯，被眾臣扶入寢室，一夜穩睡，保養精神，直至天明方起，抖擻威儀，你看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 198
    "line_end": 198
  "translation_ja": "さて、太宗は心を静め魂を落ち着かせる薬を飲み、続けて幾度か粥や汁物をとると、臣たちに支えられて寝室へ入った。一晩ぐっすり眠って気力を養い、夜が明けてから起き上がると、威儀を整えた。その装いをご覧いただこう。"
  "translation_status": "reviewed"
- "id": "xy-ch11-032"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": "戴一頂沖天冠，穿一領赭黃袍。繫一條藍田碧玉帶，踏一對創業無憂履。貌堂堂，賽過當朝；威烈烈，重興今日。好一個清平有道的大唐王，起死回生的李陛下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 200
    "line_end": 200
  "translation_ja": |-
    頭には沖天冠（ちゅうてんかん）を戴き、身には赭黄色の袍を着る。
    腰には藍田（らんでん）の碧玉の帯を締め、足には創業無憂履（そうぎょうむゆうり）を一足。
    容貌は堂々として、これまで朝廷にあった時にも勝り、威勢は烈々として、今日新たによみがえる。
    まことに天下を清らかに治め、道をわきまえた大唐の王、死から生へ帰った李陛下（りへいか）である。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "創業無憂履は物語の装束名・めでたい形容を帯びた靴の呼称として原語を保持。実在の靴の制度名とは断定しない。賽過當朝は以前の朝廷での姿にも勝るという趣旨に解した。"
- "id": "xy-ch11-033"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王上金鑾寶殿，聚集兩班文武，山呼已畢，依品分班。只聽得傳旨道：「有事出班來奏，無事退朝。」那東廂閃過徐茂公、魏徵、王珪、杜如晦、房玄齡、袁天罡、李淳風、許敬宗等；西廂閃過殷開山、劉洪基、馬三寶、段志玄、程咬金、秦叔寶、胡敬德、薛仁貴等，一齊上前，在白玉階前俯伏啟奏道：「陛下前朝一夢，如何許久方覺？」太宗道：「日前接得魏徵書，朕覺神魂出殿，只見羽林軍請朕出獵。正行時，人馬無蹤，又見那先君父王與先兄弟爭嚷。正難解處，見一人烏帽皂袍，乃是判官崔珏，喝退先兄弟。朕將魏徵書傳遞與他。正看時，又見青衣者執幢幡，引朕入內，到森羅殿上，與十代閻王敘坐。他說那涇河龍誣告我許救轉殺之事，是朕將前言陳具一遍。他說已三曹對過案了，急命取生死文簿，檢看我的陽壽。時有崔判官傳上簿子，閻王看了，道寡人有三十三年天祿，才過得一十三年，還該我二十年陽壽，即著朱太尉、崔判官送朕回來。朕與十王作別，允了送他瓜果謝恩。自出了森羅殿，見那陰司裡不忠不孝、非禮非義、作踐五穀、明欺暗騙、大斗小秤、姦盜詐偽、淫邪欺罔之徒，受那些磨燒舂剉之苦，煎熬弔剝之刑，有千千萬萬，看之不足。又過著枉死城中，有無數的冤魂，盡都是六十四處煙塵的草寇、七十二處叛賊的魂靈，擋住了朕之來路。幸虧崔判官作保，借得河南相老兒的金銀一庫，買轉鬼魂，方得前行。崔判官教朕回陽世，千萬作一場水陸大會，超度那無主的孤魂，將此言叮嚀。分別出了那六道輪迴之下，有朱太尉請朕上馬，飛也相似，行到渭水河邊，我看見那水面上有雙頭魚戲。正歡喜處，他將我撮著腳，推下水中，朕方得還魂也。」眾臣聞此言，無不稱賀。遂此編行傳報天下，各府縣官員上表稱慶不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 201
    "line_end": 201
  "translation_ja": |-
    太宗は金鑾宝殿（きんらんほうでん）へ上り、文武両班の臣を集めた。万歳の声が終わると、皆が位階に従って列を分けた。勅旨を伝える声が響いた。
    伝旨役「上奏すべきことがあれば、列を出て奏上せよ。なければ退朝せよ。」
    東側からは徐世勣、魏徴、王珪、杜如晦、房玄齢、袁天罡（えんてんこう）、李淳風（りじゅんぷう）、許敬宗らが、西側からは殷開山（いんかいざん）、劉洪基（りゅうこうき）、馬三宝、段志玄、程咬金、秦叔宝、尉遅恭、薛仁貴（せつじんき）らが進み出た。一同そろって白玉の階の前にひれ伏し、奏上した。
    文武の臣たち「陛下は先日の朝廷で夢に入られましたが、なぜこれほど長く、お目覚めにならなかったのでしょうか。」
    太宗「先日、魏徴の手紙を受け取ると、朕は魂が殿から抜け出すのを感じた。すると羽林軍が狩りへ誘うのである。進んでいくうちに人馬の影は消え、今度は亡き父帝と兄弟が現れ、騒ぎ立てた。どうにもならずにいると、黒い帽子に黒い袍を着た者が現れた。判官の崔珏で、亡き兄弟を叱り退けてくれた。朕は魏徴の手紙を渡した。彼が読んでいると、青衣の者が幢幡を持って来て、朕を中へ導き、森羅殿へ連れていった。そこで十王と挨拶を交わし、席に着いた。
    十王は、涇河の竜が、朕は救うと約束しておきながら殺したと偽って訴えたことを話した。そこで朕が先の事情を一通り説明すると、三曹対案はもう済んだと言い、急いで生死の帳簿を取り寄せて、朕のこの世での寿命を調べさせた。崔判官（さいはんがん）が帳簿を差し出すと、閻王はそれを見て、朕には三十三年の天禄があり、まだ十三年しか過ぎていないから、この世での寿命があと二十年あると言った。そして朱太尉と崔判官に、朕を送り返すよう命じた。朕は十王に別れを告げ、お礼に瓜や果物を送ると約束した。
    森羅殿を出てみると、冥府では、不忠不孝、無礼不義、五穀を粗末にする者、公然と人を欺きひそかに騙す者、大きな枡で受け取って小さな秤で渡す者、姦通、盗み、詐り、偽り、淫行、邪悪、欺瞞をなす者たちが、挽きつぶされ、焼かれ、臼で搗かれ、切り刻まれ、油で煮られ、あぶられ、吊られ、皮を剝がされる責めを受けていた。千千万万もいて、とても見尽くせぬほどであった。
    さらに枉死城を通ると、無数の怨霊がいた。皆、六十四か所で戦乱を起こした草賊、七十二か所の反逆者の魂で、朕の道をふさいだ。幸い崔判官が保証人となり、河南の相老人（しょうろうじん）の金銀を一蔵分借り、亡霊たちに金を渡して退かせたので、ようやく先へ進めた。崔判官は、この世へ戻ったら必ず水陸大会を営み、祭る者のない孤独な魂を救うようにと、念を押して朕に勧めた。
    別れを告げて六道輪廻のもとを出ると、朱太尉に馬へ乗るよう勧められた。馬は飛ぶように走り、渭水の岸へ行った。朕は水面に二匹の魚が戯れるのを見ていたが、楽しく思っているところを、朱太尉に足をつかまれて水へ突き落とされ、それでようやく魂が戻ったのだ。」
    臣たちはこれを聞き、誰もが賀を述べた。そこでその次第を書きまとめ、天下へ伝え知らせた。各府県の役人が賀表を奉ったことは、ここでは詳しく述べない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "太宗の回想は005〜008の手紙授受・父兄との遭遇の順序と一致しないが、本人の語りの順番を保持。劉洪基は第十回の劉洪紀へ訂正しない。薛仁貴の時代整合性等を理由に列挙を削らない。雙頭魚は027と同様に二匹の魚とした。"
- "id": "xy-ch11-034"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說太宗又傳旨赦天下罪人。又查獄中重犯。時有審官將刑部絞斬罪人，查有四百餘名呈上。太宗放赦回家，拜辭父母兄弟，託產與親戚子姪，明年今日赴曹，仍領應得之罪。眾犯謝恩而退。又出恤孤榜文。又查宮中老幼綵女共有三千人，出旨配軍。自此，內外俱善。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 202
    "line_end": 202
  "translation_ja": "太宗はさらに勅旨を出して、天下の罪人を赦した。また、獄中の重罪人を調べさせた。審理を担当する役人が、刑部（けいぶ）に属する絞首と斬首の死刑囚を調べると、四百人余りいたので、その名簿を奉った。太宗は彼らをいったん赦して家へ帰し、父母兄弟に別れを告げ、財産を親戚や子、甥に託し、来年の今日、役所へ出頭して、改めて受けるべき刑を受けるようにさせた。囚人たちは恩に謝して去った。また、寄る辺ない者をいたわる高札を出した。さらに宮中の年かさから年若までの宮女を数えると、合わせて三千人いたので、兵士たちに嫁がせる勅旨を出した。この時から、宮中も外も善く治まった。証しの詩がある。詩にいう。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "四百余人の死刑囚は永久に刑を赦されたのではなく、一時帰宅ののち翌年の同日に出頭し刑を受ける命令。配軍は文脈上、宮女を兵士に嫁がせることと解する。流刑や軍務への動員とはしない。"
- "id": "xy-ch11-035"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大國唐王恩德洪，道過堯舜萬民豐。
    死囚四百皆離獄，怨女三千放出宮。
    天下多官稱上壽，朝中眾宰賀元龍。
    善心一念天應佑，福蔭應傳十七宗。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 204
    "line_end": 207
  "translation_ja": |-
    大国、唐の王の恩徳は広く、道は堯舜（ぎょうしゅん）にも勝って、万民は豊かになる。
    四百の死刑囚は皆、獄を出て、宮中で嘆く三千の女は宮を放たれた。
    天下の役人はこぞって長寿を祝い、朝廷の宰相たちは元竜（げんりょう）たる天子を賀す。
    ひとたび善を思えば天は必ず助け、その福徳の蔭は十七代の帝に伝わるであろう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "元龍は天子を称える竜の比喩として「元竜たる天子」と暫定訳。字義を省いて単に再起などへ置き換えない。十七宗は物語上の後代の帝の数として十七代を保持し、史実の皇帝の数へ訂正しない。"
- "id": "xy-ch11-036"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗既放宮女，出死囚已畢，又出御製榜文，遍傳天下。榜曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 209
    "line_end": 209
  "translation_ja": "太宗は宮女を放ち、死刑囚を出したのち、さらに自ら作った高札の文を天下へあまねく伝えさせた。その文にはこうあった。"
  "translation_status": "reviewed"
- "id": "xy-ch11-037"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "乾坤浩大，日月照鑒分明；宇宙寬洪，天地不容姦黨。使心用術，果報只在今生；善布淺求，獲福休言後世。千般巧計，不如本分為人；萬種強徒，怎似隨緣節儉。心行慈善，何須努力看經；意欲損人，空讀如來一藏！"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 211
    "line_end": 211
  "translation_ja": |-
    乾坤（けんこん）は広大であり、日と月は明らかにすべてを照らし見ている。宇宙は広くとも、天地は悪人の一党を容れない。
    邪心を働かせ、策略を用いれば、その報いは今生にこそ現れる。善を施し、求めるものを少なくすれば、福を得るのは後の世だなどと言うには及ばない。
    千様の巧みな計略も、分を守って人として生きるには及ばない。万種の強暴な者も、縁に従って倹約する人にはかなわない。
    心と行いが慈悲深く善良なら、何も懸命に経ばかり読むには及ばない。人を損なおうと思うなら、如来（にょらい）の一切の経蔵を読んでも空しい。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "善布淺求は善を広く施して求めるものを少なくする趣旨と解した。報いを後世に先送りする必要はないという対句を保持。強徒は強暴な者、一藏は仏典全体で、特定の一経へ縮めない。"
- "id": "xy-ch11-038"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "自此時，蓋天下無一人不行善者。一壁廂又出招賢榜，招人進瓜果到陰司裡去；一壁廂將寶藏庫金銀一庫，差尉遲恭、胡敬德上河南開封府，訪相良還債。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 213
    "line_end": 213
  "translation_ja": "この時から、天下に善を行わない者は一人もいなくなったという。一方では賢者を募る高札を出し、冥府へ瓜や果物を届ける者を求めた。また一方では、宝蔵庫の金銀一蔵分を用意し、尉遅恭と胡敬德を河南の開封府へ遣わして、相良（しょうりょう）を訪ね、借りを返させることにした。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "尉遲恭と胡敬德は同一人物を指す呼称だが、底本は二人のように併記する。重複を削らず訳文も「尉遅恭と胡敬德」とした。辞書は別人物のentryに分けず同一人物のformsに置く。"
- "id": "xy-ch11-039"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "榜張數日，有一赴命進瓜果的賢者，本是均州人，姓劉名全，家有萬貫之資。只因妻李翠蓮在門首拔金釵齋僧，劉全罵了他幾句，說他不遵婦道，擅出閨門。李氏忍氣不過，自縊而死。撇下一雙兒女年幼，晝夜悲啼。劉全又不忍見，無奈，遂捨了性命，棄了家緣，撇了兒女，情願以死進瓜，將皇榜揭了，來見唐王。王傳旨意，教他去金亭館裡，頭頂一對南瓜，袖帶黃錢，口噙藥物。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 214
    "line_end": 214
  "translation_ja": "高札を出して数日すると、命を受けて瓜や果物を届けようという奇特な者が現れた。もとは均州（きんしゅう）の人で、姓は劉（りゅう）、名は全（ぜん）といい、家には万貫の財産があった。妻の李翠蓮（りすいれん）が門前で金のかんざしを抜き取って僧に施したため、劉全（りゅうぜん）は、婦道を守らず勝手に閨門を出たと、幾言か罵った。李翠蓮はその怒りと悔しさに耐えきれず、首をくくって死んだ。幼い男の子と女の子が残され、昼も夜も泣き続けた。劉全はそれも見るに忍びず、どうにもならなくなり、ついに命を捨て、家の縁を断ち、子供たちを置いて、死んで瓜を届けようと決心した。皇帝の高札をはがし、太宗に会いに来たのである。太宗は勅旨を伝え、金亭館（きんていかん）へ行き、二つの南瓜を頭に載せ、袖に黄銭（こうせん）を入れ、口に薬を含むよう命じた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "李翠蓮が僧に金のかんざしを施した行為、劉全の非難、李翠蓮の自死は物語中の出来事として訳す。非難の価値観を語り手・翻訳者の規範として強めない。薬物の種類や量は原文にないため補わない。"
- "id": "xy-ch11-040"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那劉全果服毒而死，一點魂靈，頂著瓜果，早到鬼門關上。把門的鬼使喝道：「你是甚人，敢來此處？」劉全道：「我奉大唐太宗皇帝欽差，特進瓜果與十代閻王受用的。」那鬼使欣然接引。劉全徑至森羅寶殿，見了閻王，將瓜果進上道：「奉唐王旨意，遠進瓜果，以謝十王寬宥之恩。」閻王大喜道：「好一個有信有德的太宗皇帝！」遂此收了瓜果。便問那進瓜的人姓名，那方人氏。劉全道：「小人是均州城民籍。姓劉名全。因妻李氏縊死，撇下兒女，無人看管，小人情願捨家棄子，捐軀報國，特與我王進貢瓜果，謝眾大王厚恩。」十王聞言，即命查勘劉全妻李氏。那鬼使速取來在森羅殿下，與劉全夫妻相會。訴罷前言，回謝十王恩宥。那閻王卻檢生死簿子看時，他夫妻們都有登仙之壽，急差鬼使送回。鬼使啟上道：「李翠蓮歸陰日久，屍首無存，魂將何附？」閻王道：「唐御妹李玉英今該促死，你可借他屍首，教他還魂去也。」那鬼使領命，即將劉全夫妻二人還魂，同出陰司而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 215
    "line_end": 215
  "translation_ja": |-
    劉全は果たして毒を飲んで死に、そのひとすじの魂は瓜や果物を頭に載せ、たちまち鬼門関（きもんかん）へ着いた。門を守る鬼使が怒鳴った。
    門番の鬼使「お前は何者だ。よくもここへ来たな。」
    劉全「私は大唐の太宗皇帝から直々に遣わされ、十王に召し上がっていただく瓜や果物を、特にお届けに参りました。」
    鬼使は喜んで案内した。劉全はまっすぐ森羅宝殿へ行き、閻王に会って瓜や果物を献じた。
    劉全「唐の陛下の勅旨を受け、十王の寛大なお取り計らいの恩にお礼申し上げるため、遠くから瓜や果物を届けに参りました。」
    閻王は大いに喜んだ。
    閻王「なんと信義と徳のある太宗皇帝であろう！」
    こうして瓜や果物を受け取り、届けた者の姓名と出身地を尋ねた。
    劉全「私は均州の町の民籍にある者で、姓は劉、名は全と申します。妻の李氏（りし）が首をくくって死に、子供たちを残しましたが、面倒を見る者がおりません。私は自ら家も子も捨て、身をなげうって国に報いようと願い、我が王のために瓜や果物をお届けし、大王方の厚いご恩にお礼申し上げに参りました。」
    十王はこれを聞くと、ただちに劉全の妻、李氏を調べさせた。鬼使は急いで森羅殿の前へ連れてきて、劉全と妻を引き合わせた。二人はこれまでのことを語り合い、十王の慈悲深い恩に礼を述べた。閻王が生死簿を調べてみると、夫婦にはどちらも仙人となって天へ昇るほどの寿命があったので、急いで鬼使を遣わし、送り返すことにした。鬼使は申し上げた。
    鬼使「李翠蓮が冥界へ来てからは日が経っており、亡骸はもう残っておりません。魂は何に宿ればよいのでしょうか。」
    閻王「唐の皇帝の妹、李玉英（りぎょくえい）が、今ちょうど急死する定めである。その亡骸を借り、李翠蓮の魂を戻してやれ。」
    鬼使は命を受け、劉全と妻の二人を還魂させるため、ともに冥府を出ていった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "登仙之壽は、ここで死の婉曲表現とすると送り返す理由に合わないため、仙人となるほどの寿命があると解した。李玉英はこれから急死する定めという命令で、命を奪った動作や妻の身体移行の完了を先取りして加えない。末文は次回の還魂へ向けて冥府を出ると訳した。"
- "id": "xy-ch11-041"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知夫妻二人如何還魂，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 217
    "line_end": 217
  "translation_ja": "はたして夫婦二人は、どのようにして魂を取り戻すのか。それは次回をお聞きいただきたい。"
  "translation_status": "reviewed"

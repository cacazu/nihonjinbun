  "known_gaps":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-002"
    "description_ja": "白蟻の陣の敗北は南柯の夢の故事を踏まえる表現と解する。本文は「白蟻の陣が敗れて初めて幻と知る」とし、物語本文へ故事の説明を追加しない。読み・語義の根拠は共通辞書の出典に記録した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-004"
    "description_ja": "語り手は崔珏をかつての唐国の宰相と描くが、005の本人の説明は茲州令・礼部侍郎。双方を保持し、官職の整合を図って改変しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-005"
    "description_ja": "三曹對案は原告・被告・証人の三者の対質という訴訟用語。既存辞書にある天界の三官署という三曹の別義を流用しない。茲州は底本字を保持し、磁州に無断訂正しない。第十回は茲洲という異表記。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-006"
    "description_ja": "大都案は冥都の記録を総べる者への尊称と文脈から解した。生日は誕生日ではなく生前の意。書簡を崔珏または魏徴の音読台詞にしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-008"
    "description_ja": "来たぞという声は列挙された三者の合同発言とした。その後の暴行・命の取り立ては建成と元吉だけ。李淵が暴行したとは補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-010"
    "description_ja": "十王の名称と順序を底本どおり保持。初江を楚江、仵官を五官、卞城を卞城以外へ無断訂正しない。十代は十代の継承者ではなく十王の集団として訳す。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-011"
    "description_ja": "南斗が死簿を持つという底本の記載を北斗へ訂正しない。一十三の一に二画を足して三十三とする改竄を明示。天禄はこの場で在位年数と余命を結び付ける物語上の数字で、史実へ換算しない。東瓜は通常の冬瓜を思わせるが原字保持。単独の閻王はどの王か不明のため秦広王等に割り当てない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-012"
    "description_ja": "還魂者を転生の経路へ案内する説明。別人に生まれ変わったと結果を先取りしない。「別の身に託して生まれ出る道を通っていただく」と、道筋の説明として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-014"
    "description_ja": "廬巖は廬山の岩と解したが、廬の指示対象の厳密な校訂は未実施。猖亡は荒ぶる亡霊と文脈で解した。これらを確定した地理・字義として辞書登録しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-016"
    "description_ja": "地獄十八名称は底本字を保持し全列挙した。磨捱の具体的な処刑内容や幽枉等の難解な名称の意味は無断で詳説しない。抹嘴咨牙は顔をゆがめ歯をむく苦悶の表情と解した。鉄簡は巻物ではなく打撃用武器として鉄の棒とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-018"
    "description_ja": "㪥は張り広げた親指と中指または小指の間隔を表す身体尺で、尺ではない。本文は三㪥を残し、段落末の意味説明で補う。奈河は奈何へ変更しない。木に掛かる物は底本どおり絹の着物として訳し、別の刑罰や身体部位を補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-020"
    "description_ja": "六十四・七十二という数と、王子・頭目という列挙を保持。「王子」を一般的な諸王に正規化していないが、ここでは戦乱の王侯・首領を広く指す可能性がある。相良の預託は十三蔵、そのうち借用・配布するのは一蔵。現代金額へ換算しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-021"
    "description_ja": "金魚は魚の金魚ではなく官位を示す金の魚符。受籙は仙籍・官職の資格を受ける意に解しうるが、前半の雲に乗る仙人との対比と魚符の描写から、ここは官位を授かる者と解した。六道は仙道・貴道・福道・人道・富道・鬼道という本章独自の分類を全て保持し、仏教の通常の六道へ直さない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-023"
    "description_ja": "鯉は二匹であり、後段の雙頭魚戲もこの描写を受けて解した。海騮馬は馬の呼称のまま保持し、毛色や産地を確定的に追加しない。渭水と渭河は同一河川の別称。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-024"
    "description_ja": "徐茂公と李世勣は同一人物の異名だが、底本は同じ列挙中に併記している。列挙を削らずそのまま残した。通常の地の文・話者名では既存方針どおり徐世勣とする。胡敬德も尉遅恭の呼称として扱うが、この列挙の原字は保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-027"
    "description_ja": "理烈は一般的な語形として未確定。魏徴の性質を表す並列から「道理を貫く」と暫定的に解した。雙頭魚戲は023の二匹の金色の鯉を受けて「二匹の魚が戯れる」とし、双頭の怪魚とはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-032"
    "description_ja": "創業無憂履は物語の装束名・めでたい形容を帯びた靴の呼称として原語を保持。実在の靴の制度名とは断定しない。賽過當朝は以前の朝廷での姿にも勝るという趣旨に解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-033"
    "description_ja": "太宗の回想は005〜008の手紙授受・父兄との遭遇の順序と一致しないが、本人の語りの順番を保持。劉洪基は第十回の劉洪紀へ訂正しない。薛仁貴の時代整合性等を理由に列挙を削らない。雙頭魚は027と同様に二匹の魚とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-034"
    "description_ja": "四百余人の死刑囚は永久に刑を赦されたのではなく、一時帰宅ののち翌年の同日に出頭し刑を受ける命令。配軍は文脈上、宮女を兵士に嫁がせることと解する。流刑や軍務への動員とはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-035"
    "description_ja": "元龍は天子を称える竜の比喩として「元竜たる天子」と暫定訳。字義を省いて単に再起などへ置き換えない。十七宗は物語上の後代の帝の数として十七代を保持し、史実の皇帝の数へ訂正しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-037"
    "description_ja": "善布淺求は善を広く施して求めるものを少なくする趣旨と解した。報いを後世に先送りする必要はないという対句を保持。強徒は強暴な者、一藏は仏典全体で、特定の一経へ縮めない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-038"
    "description_ja": "尉遲恭と胡敬德は同一人物を指す呼称だが、底本は二人のように併記する。重複を削らず訳文も「尉遅恭と胡敬德」とした。辞書は別人物のentryに分けず同一人物のformsに置く。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-039"
    "description_ja": "李翠蓮が僧に金のかんざしを施した行為、劉全の非難、李翠蓮の自死は物語中の出来事として訳す。非難の価値観を語り手・翻訳者の規範として強めない。薬物の種類や量は原文にないため補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "segment_ids":
    - "xy-ch11-040"
    "description_ja": "登仙之壽は、ここで死の婉曲表現とすると送り返す理由に合わないため、仙人となるほどの寿命があると解した。李玉英はこれから急死する定めという命令で、命を奪った動作や妻の身体移行の完了を先取りして加えない。末文は次回の還魂へ向けて冥府を出ると訳した。 本文の欠落ではなく解釈・校訂上の留保。"

    "status": "open"
    "message_ja": "白蟻の陣の敗北は南柯の夢の故事を踏まえる表現と解する。本文は「白蟻の陣が敗れて初めて幻と知る」とし、物語本文へ故事の説明を追加しない。読み・語義の根拠は共通辞書の出典に記録した。"
- "id": "xy-ch11-003"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說太宗渺渺茫茫，魂靈徑出五鳳樓前，只見那御林軍馬，請大駕出朝採獵。太宗忻然從之，縹渺而去。行了多時，人馬俱無。獨自一個，散步荒郊草野之間。正驚惶難尋道路，只見那一邊，有一人高聲大叫道：「大唐皇帝，往這裡來，往這裡來。」太宗聞言，擡頭觀看，只見那人："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    さて、太宗（たいそう）は意識もおぼろなまま、魂がまっすぐ五鳳楼（ごほうろう）の前へ抜け出た。すると御林軍（ぎょりんぐん）の兵馬がいて、朝廷を出て狩りにおいでになるよう勧めた。太宗は喜んで従い、ふわふわと進んでいった。ずいぶん行くうちに、人馬はすっかり消え失せ、ただ一人、荒れた野の草むらを歩いていた。道が分からず心細く思っていると、向こうに一人の男が現れ、大声で呼んだ。
    男「大唐（だいとう）の皇帝、こちらへおいでください、こちらへ。」
    太宗が顔を上げて見ると、その男はこんな姿だった。
  "translation_status": "reviewed"
- "id": "xy-ch11-004"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭頂烏紗，腰圍犀角。頭頂烏紗飄軟帶，腰圍犀角顯金廂。手擎牙笏凝祥靄，身著羅袍隱瑞光。腳踏一雙粉底靴，登雲促霧；懷揣一本生死簿，注定存亡。鬢髮蓬鬆飄耳上，鬍鬚飛舞繞腮旁。昔日曾為唐國相，如今掌案侍閻王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    頭には烏紗帽（うさぼう）、腰には犀角（さいかく）の帯。
    烏紗帽から柔らかな紐をなびかせ、犀角の帯には金の縁飾りが輝く。
    手に掲げた象牙の笏（しゃく）にはめでたい霞が凝り、身につけた薄絹の袍には瑞光がほのめく。
    足には白底の長靴を一足、雲に乗り霧を追って進む。
    懐には一冊の生死簿（せいしぼ）、人の生き死にを書き定める。
    鬢の髪はふさふさと耳の上に舞い、髭はひらひらと頬のまわりに踊る。
    かつて唐国（とうこく）の宰相を務め、今は記録を取り仕切って閻王（えんおう）に仕えている。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "語り手は崔珏をかつての唐国の宰相と描くが、005の本人の説明は茲州令・礼部侍郎。双方を保持し、官職の整合を図って改変しない。"
- "id": "xy-ch11-005"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗行到那邊，只見他跪拜路旁，口稱：「陛下，赦臣失誤遠迎之罪。」太宗問曰：「你是何人？因甚事前來接拜？」那人道：「微臣半月前在森羅殿上，見涇河鬼龍告陛下許救反誅之故，第一殿秦廣大王即差鬼使催請陛下，要三曹對案。臣已知之，故來此間候接。不期今日來遲，望乞恕罪，恕罪。」太宗道：「你姓甚名誰？是何官職？」那人道：「微臣存日，在陽曹侍先君駕前，為茲州令，後拜禮部侍郎，姓崔名珏。今在陰司，得受酆都掌案判官。」太宗大喜，即近前，御手忙攙道：「先生遠勞。朕駕前魏徵有書一封，正寄與先生，卻好相遇。」判官謝恩，問書在何處。太宗即向袖中取出遞與。崔珏拜接了，拆封而看。其書曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    太宗がそこへ行くと、男は道端にひざまずいて拝した。
    男「陛下、遠くまでお迎えに上がらず、手落ちのあった臣の罪をお許しください。」
    太宗「そなたは何者だ。何のために出迎え、礼をしてくれるのだ。」
    男「臣は半月前、森羅殿（しんらでん）で、涇河（けいが）の竜の亡霊が、陛下は救うと約束なさったのに、かえって殺したと訴えるのを見ました。第一殿の秦広大王（しんこうだいおう）は、すぐ鬼使を遣わして陛下に急いでおいで願い、原告・被告・証人を対質させる三曹対案（さんそうたいあん）を行うことにしたのでございます。臣はそれを知り、ここへお迎えに参った次第です。あいにく今日は遅れてしまいました。どうかお許しを、どうかお許しを。」
    太宗「そなたの姓と名は何という。どんな官職にあるのだ。」
    男「臣は生前、この世で先帝のおそばに仕え、茲州（じしゅう）の県令（けんれい）を務めたのち、礼部侍郎（れいぶじろう）に任ぜられました。姓は崔（さい）、名は珏（かく）と申します。今は冥府で、酆都（ほうと）の記録を取り扱う判官（はんがん）の職を授かっております。」
    太宗は大喜びし、そばへ寄ると、自ら手を差し伸べて崔珏（さいかく）を助け起こした。
    太宗「先生、遠くまでご苦労であった。朕に仕える魏徴（ぎちょう）から、先生に宛てた手紙を一通預かっている。よいところで会えた。」
    崔珏は恩に謝し、手紙はどこにあるかと尋ねた。太宗が袖から取り出して渡すと、崔珏は恭しく受け取り、封を切って読んだ。手紙にはこうあった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "三曹對案は原告・被告・証人の三者の対質という訴訟用語。既存辞書にある天界の三官署という三曹の別義を流用しない。茲州は底本字を保持し、磁州に無断訂正しない。第十回は茲洲という異表記。"
- "id": "xy-ch11-006"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "辱愛弟魏徵頓首書拜大都案契兄崔老先生臺下：憶昔交遊，音容如在。倏爾數載，不聞清教。常只是遇節令，設蔬品奉祭，未卜享否？又承不棄，夢中臨示，始知我兄長大人高遷。奈何陰陽兩隔，天各一方，不能面覿。今因我太宗文皇帝倏然而故，料是對案三曹，必然得與兄長相會。萬祈俯念生日交情，方便一二，放我陛下回陽，殊為愛也。容再修謝。不盡。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    ご厚情にあずかる弟分、魏徴、謹んで頭を地につけ、冥都の記録を総べる盟友、崔老先生の御前に書を差し上げます。
    昔の交わりを思い返せば、お声もお姿も今なお目の前にあるようです。たちまち数年が過ぎ、清らかなお教えを伺うこともかないません。いつも節日には精進の供え物を設けてお祭りしておりますが、召し上がっていただけたでしょうか。また、お見捨てなく夢にお姿をお見せくださり、兄上が高いお役目に昇られたことを、ようやく知りました。いかんせん陰と陽に隔てられ、互いに天の一方にあって、お目にかかることができません。
    このたび、我が太宗文皇帝（たいそうぶんこうてい）がにわかに崩御なさいました。おそらく三曹対案のためであり、必ず兄上にお会いになることでしょう。どうか生前の交情をお汲み取りになり、いささかお取り計らいくださって、我が陛下をこの世へお返しくださいますよう、幾重にもお願い申し上げます。そうしていただければ、これにまさるご厚意はありません。改めてお礼を申し述べる機会をお与えください。意を尽くせぬまま、筆を置きます。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "大都案は冥都の記録を総べる者への尊称と文脈から解した。生日は誕生日ではなく生前の意。書簡を崔珏または魏徴の音読台詞にしない。"
- "id": "xy-ch11-007"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那判官看了書，滿心歡喜道：「魏人曹前日夢斬老龍一事，臣已早知，甚是誇獎不盡。又蒙他早晚看顧臣的子孫，今日既有書來，陛下寬心，微臣管送陛下還陽，重登玉闕。」太宗稱謝了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    手紙を読んだ崔珏は、心から喜んで言った。
    崔珏「人曹官（じんそうかん）の魏徴殿が先日、夢の中で老竜を斬られたことは、臣もすでに存じております。まことに、褒めても褒めきれぬお働きでした。そのうえ、日頃から臣の子孫の面倒を見てくださっております。今日こうしてお手紙をいただいたからには、陛下、どうかご安心ください。臣が必ずこの世へお送りし、再び宮城にお上りいただきます。」
    太宗は礼を述べた。
  "translation_status": "reviewed"
- "id": "xy-ch11-008"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人正說間，只見那邊有一對青衣童子執幢幡、寶蓋，高叫道：「閻王有請，有請。」太宗遂與崔判官並二童子舉步前進。忽見一座城，城門上掛著一面大牌，上寫著「幽冥地府鬼門關」七個大金字。那青衣將幢幡搖動，引太宗徑入城中，順街而走。只見那街傍邊有先主李淵、先兄建成、故弟元吉，上前道：「世民來了，世民來了。」那建成、元吉就來揪打索命。太宗躲閃不及，被他扯住。幸有崔判官喚一青面獠牙鬼使，喝退了建成、元吉，太宗方得脫身而去。行不數里，見一座碧瓦樓臺，真個壯麗。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    二人が話していると、向こうに青衣の童子が二人、幢幡（どうばん）と宝蓋（ほうがい）を持って現れ、大声を上げた。
    青衣の童子たち「閻王がお招きです、お招きです。」
    太宗は崔珏、二人の童子とともに歩きだした。やがて一つの城が見え、城門には大きな額が掛かり、「幽冥地府鬼門關（ゆうめいちふきもんかん）」という七つの大きな金文字が記されていた。青衣の童子が幢幡を振り、太宗を導いて城に入り、通りを進んでいく。すると道の脇に、亡き父帝の李淵（りえん）、亡き兄の建成（けんせい）、亡き弟の元吉（げんきつ）がいて、前へ出て声を上げた。
    李淵・建成・元吉「世民（せいみん）が来たぞ、世民が来たぞ。」
    建成と元吉は太宗につかみかかり、殴って命を返せと迫った。太宗は身をかわす間もなく、つかまってしまった。幸い崔珏が、青い顔に牙をむいた鬼使を呼び、建成と元吉を叱り退けさせたので、ようやく逃れることができた。数里も行かぬうちに、碧い瓦の楼台が見えた。実に壮麗な建物である。見れば、
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "来たぞという声は列挙された三者の合同発言とした。その後の暴行・命の取り立ては建成と元吉だけ。李淵が暴行したとは補わない。"
- "id": "xy-ch11-009"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    飄飄萬疊彩霞堆，隱隱千條紅霧現。
    耿耿簷飛怪獸頭，輝輝五疊鴛鴦片。
    門鑽幾路赤金釘，檻設一橫白玉段。
    牕牖近光放曉煙，簾櫳幌亮穿紅電。
    樓臺高聳接青霄，廊廡平排連寶院。
    獸鼎香雲襲御衣，絳紗燈火明宮扇。
    左邊猛烈擺牛頭，右下崢嶸羅馬面。
    接亡送鬼轉金牌，引魄招魂垂素練。
    喚作陰司總會門，下方閻老森羅殿。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 138
    "line_end": 146
  "translation_ja": |-
    幾万重もの彩雲がひらひらと重なり、幾千筋もの紅の霧がおぼろに現れる。
    輝く軒は怪獣の頭をかたどって反り、五重に並ぶ鴛鴦瓦（えんおうがわら）がきらめく。
    門には幾筋もの赤金の鋲が打たれ、敷居には一本の白玉が横たわる。
    窓には光がさして暁の靄が立ち、簾と格子の間を紅い稲妻が貫く。
    楼台は高くそびえて青空に届き、廊下と庇は整然と並んで宝の中庭へ続く。
    獣形の鼎から香の雲が御衣に漂い、深紅の紗の灯火が宮廷の扇を照らす。
    左には猛々しい牛頭（ごず）が居並び、右にはいかめしい馬面（ばめん）が列をなす。
    死者を迎え亡霊を送る金札が巡り、魂魄を招き導く白絹が垂れる。
    ここは冥府の総会の門、地の底の閻王の森羅殿と呼ばれるところ。
  "translation_status": "reviewed"
- "id": "xy-ch11-010"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗正在外面觀看，只見那壁廂環珮叮噹，仙香奇異，外有兩對提燭，後面卻是十代閻王降階而至，是那十代閻君：秦廣王、初江王、宋帝王、仵官王、閻羅王、平等王、泰山王、都市王、卞城王、轉輪王。十王出在森羅寶殿，控背躬身，迎迓太宗。太宗謙下，不敢前行。十王道：「陛下是陽間人王，我等是陰間鬼王，分所當然，何須過讓？」太宗道：「朕得罪麾下，豈敢論陰陽人鬼之道？」遜之不已。太宗前行，徑入森羅殿上，與十王禮畢，分賓主坐定。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    太宗が外から眺めていると、向こうで佩玉がりんりんと鳴り、仙境の不思議な香りが漂った。外側に二組の灯燭持ちが並び、その後ろから十王（じゅうおう）が階段を降りてきた。十王とは、秦広王（しんこうおう）、初江王（しょこうおう）、宋帝王（そうていおう）、仵官王（ごかんおう）、閻羅王（えんらおう）、平等王（びょうどうおう）、泰山王（たいざんおう）、都市王（としおう）、卞城王（べんじょうおう）、転輪王（てんりんおう）である。十王は森羅宝殿（しんらほうでん）を出て、背を丸めて身をかがめ、太宗を迎えた。太宗はへりくだり、あえて先へ進もうとしない。
    十王「陛下はこの世の人の王、我々はあの世の鬼の王です。それぞれの分にかなったことなのに、何をそれほどお譲りになるのです。」
    太宗「朕は御下に対して罪を得た身。どうして陰と陽、人と鬼の立場など申せましょう。」
    譲り合いが尽きなかったが、太宗が先に進んで森羅殿へ入った。十王と礼を交わし、主客それぞれの席に着いた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "十王の名称と順序を底本どおり保持。初江を楚江、仵官を五官、卞城を卞城以外へ無断訂正しない。十代は十代の継承者ではなく十王の集団として訳す。"
- "id": "xy-ch11-011"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "約有片時，秦廣王拱手而進言曰：「涇河鬼龍告陛下許救而反殺之，何也？」太宗道：「朕曾夜夢老龍求救，實是允他無事。不期他犯罪當刑，該我那人曹官魏徵處斬。朕宣魏徵在殿著棋，不知他一夢而斬。這是那人曹官出沒神機，又是那龍王犯罪當死，豈是朕之過也？」十王聞言，伏禮道：「自那龍未生之前，南斗星死簿上已註定該遭殺於人曹之手，我等早已知之。但只是他在此折辨，定要陛下來此，三曹對案。是我等將他送入輪藏，轉生去了。今又有勞陛下降臨，望乞恕我催促之罪。」言畢，命掌生死簿判官急取簿子來，看陛下陽壽天祿該有幾何。崔判官急轉司房，將天下萬國國王天祿總簿，先逐一檢閱，只見南贍部洲大唐太宗皇帝註定貞觀一十三年。崔判官吃了一驚，急取濃墨大筆，將「一」字上添了兩畫，卻將簿子呈上。十王從頭一看，見太宗名下註定三十三年，閻王驚問：「陛下登基多少年了？」太宗道：「朕即位，今一十三年了。」閻王道：「陛下寬心勿慮，還有二十年陽壽。此一來已是對案明白，請返本還陽。」太宗聞言，躬身稱謝。十閻王差崔判官、朱太尉二人，送太宗還魂。太宗出森羅殿，又起手問十王道：「朕宮中老少安否如何？」十王道：「俱安，但恐御妹壽似不永。」太宗又再拜啟謝：「朕回陽世，無物可酬謝，惟答瓜果而已。」十王喜曰：「我處頗有東瓜、西瓜，只少南瓜。」太宗道：「朕回去即送來，即送來。」從此遂相揖而別。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    しばらくすると、秦広王が手を組んで礼をし、進み出て言った。
    秦広王「涇河の竜の亡霊は、陛下が救うと約束なさったのに、かえって殺されたと訴えています。どういうことでしょう。」
    太宗「朕はある夜、老竜が助けを求めてくる夢を見て、確かに無事でいられると約束した。ところが、あの竜は罪を犯して刑を受ける身であり、朕に仕える人曹官の魏徴が斬ることになっていた。そこで魏徴を殿に呼んで碁を打たせていたのだが、まさか夢の中で斬るとは思わなかった。これは人曹官が神妙な術で出没したためであり、また竜王が罪を犯して死すべき身だったためでもある。どうして朕の過ちであろうか。」
    十王はこれを聞き、身を伏せて礼をした。
    十王「あの竜がまだ生まれぬうちから、南斗星（なんとせい）の死簿には、人曹官の手で殺されると記されており、我々も早くから承知しておりました。ただ、あの竜がここでしつこく言い争い、どうしても陛下においでいただいて、三曹対案を行うと言い張ったのです。我々はすでにあの竜を輪蔵（りんぞう）に送り、転生させました。今また陛下をお煩わせてお越しいただきましたこと、せき立てた罪をどうかお許しください。」
    そう言うと、生死簿を預かる判官に、帳簿を急いで持ってきて、太宗のこの世での寿命と天禄（てんろく）がどれほどあるか調べるよう命じた。崔珏は急いで役所の部屋へ戻り、天下万国の国王の天禄を載せた総簿を、まず一つずつ調べた。すると南贍部洲（なんせんぶしゅう）の大唐太宗皇帝（たいそうこうてい）の項には、貞観（じょうがん）十三年と定めてあった。崔珏は驚き、すぐに濃い墨を含ませた大筆を取り、「一」の上に二画を足して、帳簿を差し出した。十王が初めから見ていくと、太宗の名の下には三十三年とあった。閻王は驚いて尋ねた。
    閻王「陛下は即位なさって、何年になりますか。」
    太宗「朕が即位して、今年で十三年になる。」
    閻王「陛下、ご心配には及びません。この世での寿命が、まだ二十年ございます。今回おいでいただいて対審も明らかになりましたから、どうぞ元のお体に戻って、この世へお帰りください。」
    太宗は身をかがめて礼を述べた。十王は崔珏と朱太尉（しゅたいい）の二人に、太宗を送り、魂を戻すよう命じた。太宗は森羅殿を出ると、改めて手を組んで十王に尋ねた。
    太宗「朕の宮中の者たちは、老いも若きも無事でしょうか。」
    十王「皆、無事です。ただ、陛下の妹君は、お命が長くないかもしれません。」
    太宗は再び拝礼し、礼を述べた。
    太宗「朕がこの世へ戻っても、お礼にできるものはございません。せめて瓜や果物をお届けいたしましょう。」
    十王は喜んで言った。
    十王「こちらには東瓜（とうが）と西瓜はかなりあるのですが、南瓜だけがありません。」
    太宗「戻ったら、すぐにお送りしましょう。すぐにお送りしましょう。」
    こうして互いに礼を交わし、別れた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "南斗が死簿を持つという底本の記載を北斗へ訂正しない。一十三の一に二画を足して三十三とする改竄を明示。天禄はこの場で在位年数と余命を結び付ける物語上の数字で、史実へ換算しない。東瓜は通常の冬瓜を思わせるが原字保持。単独の閻王はどの王か不明のため秦広王等に割り当てない。"
- "id": "xy-ch11-012"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那太尉執一首引魂旛，在前引路。崔判官隨後保著太宗，徑出幽司。太宗舉目而看，不是舊路，問判官曰：「此路差矣？」判官道：「不差。陰司裡是這般，有去路，無來路。如今送陛下自轉輪藏出身，一則請陛下遊觀地府，一則教陛下轉托超生。」太宗只得隨他兩個引路前來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    朱太尉が引魂幡（いんこんばん）を一本持って先に立ち、崔珏は後ろについて太宗を守り、冥府を出た。太宗が見回すと、来た時とは違う道だったので、崔珏に尋ねた。
    太宗「この道は間違ってはいないか。」
    崔珏「間違ってはおりません。冥府では、行く道はあっても、来た道へは戻れないのです。今、陛下を転輪蔵（てんりんぞう）からお送りするのは、一つには冥府をご覧いただくため、一つには別の身に託して生まれ出る道を通っていただくためです。」
    太宗は二人の案内に従っていくほかなかった。
  "translation_status": "reviewed"
  "issues":

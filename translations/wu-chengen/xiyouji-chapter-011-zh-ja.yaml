  "source_text": |-
    進前又走不多時，見一夥鬼卒各執幢幡，路傍跪下道：「橋梁使者來接。」判官喝令起去，上前引著太宗，從金橋而過。太宗又見那一邊有一座銀橋，橋上行幾個忠孝賢良之輩，公平正大之人，亦有幢幡接引；那壁廂又有一橋，寒風滾滾，血浪滔滔，號泣之聲不絕。太宗問道：「那座橋是何名色？」判官道：「陛下，那叫做奈河橋。若到陽間，切須傳記。那橋下都是些：
    奔流浩浩之水，險峻窄窄之路。儼如疋練搭長江，卻似火坑浮上界。陰氣逼人寒透骨，腥風撲鼻味鑽心。波翻浪滾，往來並沒渡人船；赤腳蓬頭，出入盡皆作業鬼。橋長數里，闊只三㪥，高有百尺，深卻千重。上無扶手欄杆，下有搶人惡怪。枷杻纏身，打上奈河險路。你看那橋邊神將甚兇頑，河內孽魂真苦惱。枒杈樹上，掛的是青紅黃紫色絲衣；壁斗崖前，蹲的是毀罵公婆淫潑婦。銅蛇鐵狗任爭餐，永墮奈河無出路。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 166
    "line_end": 168
  "translation_ja": |-
    さらに少し行くと、幢幡をそれぞれ持った鬼卒の一隊が、道端にひざまずいて言った。
    橋梁使者（きょうりょうししゃ）たち「橋梁使者がお迎えに参りました。」
    崔珏は立って退くよう命じ、自ら前へ出て太宗を導き、金の橋を渡った。太宗が見ると、向こうには銀の橋もあった。橋の上を、忠義と孝行を尽くした賢く善良な者や、公平で正しい者が何人か渡っており、やはり幢幡を持った迎えの者が導いていた。さらに別の橋があり、冷たい風が吹き荒れ、血の波が滔々と流れ、泣き叫ぶ声が絶えなかった。
    太宗「あの橋は何というのだ。」
    崔珏「陛下、あれは奈河橋（なかきょう）と申します。この世へ戻られたら、必ず人々に伝え、書き留めさせてください。あの橋の下にあるのは、こんなものです。
    勢いよく流れる広大な水、険しく細い道。
    白絹を一筋、長江（ちょうこう）に架けたかのようで、また火坑が上界へ浮かび上がったかのようです。
    陰気は身に迫って骨まで冷やし、生臭い風は鼻をついて心までえぐります。
    波が翻り、うねり逆巻く中、行き来する渡し船は一艘もありません。
    裸足で髪を振り乱し、出入りするのは悪業を積んだ鬼ばかりです。
    橋は長さ数里、幅はわずか三㪥（さ）。高さは百尺、下は幾重にも深く落ちこんでいます。
    上には手すりも欄干もなく、下には人をさらう悪鬼がいます。
    首枷、手枷を身につけられ、打たれながら奈河（なか）の険しい道を上らされます。
    ご覧ください、橋のほとりの神将の、なんと獰猛なこと。川の中の罪ある魂の、なんと苦しげなこと。
    枝の叉に掛かっているのは、青、紅、黄、紫の絹の着物。
    切り立つ崖の前にうずくまるのは、舅や姑を罵り、淫らで乱暴に振る舞った女たちです。
    銅の蛇と鉄の犬が思うままに争って食らいつき、とこしえに奈河へ堕ちて、逃れる道はありません。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "㪥は張り広げた親指と中指または小指の間隔を表す身体尺で、尺ではない。本文は三㪥を残し、段落末の意味説明で補う。奈河は奈何へ変更しない。木に掛かる物は底本どおり絹の着物として訳し、別の刑罰や身体部位を補わない。"
- "id": "xy-ch11-019"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    詩曰：
    時聞鬼哭與神號，血水渾波萬丈高。
    無數牛頭並馬面，猙獰把守奈河橋。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 170
    "line_end": 173
  "translation_ja": |-
    詩にいう。
    絶えず鬼の泣く声、神の叫ぶ声が聞こえ、血の混じる濁った波は万丈の高さに盛り上がる。
    数知れぬ牛頭と馬面が、恐ろしい顔をして奈河橋を守っている。
  "translation_status": "reviewed"
- "id": "xy-ch11-020"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說間，那幾個橋梁使者早已回去了。太宗心又驚惶，點頭暗嘆，默默悲傷。相隨著判官、太尉，早過了奈河惡水，血盆苦界。前又到枉死城，只聽哄哄人嚷，分明說：「李世民來了，李世民來了。」太宗聽叫，心驚膽戰。見一夥拖腰折臂、有足無頭的鬼魅，上前攔住；都叫道：「還我命來！還我命來！」慌得那太宗藏藏躲躲，只叫：「崔先生救我！崔先生救我！」判官道：「陛下，那些人都是那六十四處煙塵、七十二處草寇眾王子、眾頭目的鬼魂，盡是枉死的冤業，無收無管，不得超生，又無錢鈔盤纏，都是孤寒餓鬼。陛下得些錢鈔與他，我才救得哩。」太宗道：「寡人空身到此，卻那裡得有錢鈔？」判官道：「陛下，陽間有一人，金銀若干，在我這陰司裡寄放。陛下可出名立一約，小判可作保，且借他一庫，給散這些餓鬼，方得過去。」太宗問曰：「此人是誰？」判官道：「他是河南開封府人氏，姓相名良，他有十三庫金銀在此。陛下若借用過他的，到陽間還他便了。」太宗甚喜，情願出名借用。遂立了文書與判官，借他金銀一庫，著太尉盡行給散。判官復吩咐道：「這些金銀，汝等可均分用度，放你大唐爺爺過去，他的陽壽還早哩。我領了十王鈞語，送他還魂，教他到陽間做一個水陸大會，度汝等超生，再休生事。」眾鬼聞言，得了金銀，俱唯唯而退。判官令太尉搖動引魂幡，領太宗出離了枉死城中，奔上平陽大路，飄飄蕩蕩而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    話しているうちに、橋梁使者たちは早くも戻っていった。太宗はまた心をおののかせ、うなずいてひそかにため息をつき、黙って悲しんだ。崔珏と朱太尉に従い、奈河の恐ろしい水、血盆（けつぼん）の苦界を通り過ぎた。さらに枉死城（おうしじょう）へ来ると、わあわあと騒ぐ声が聞こえ、はっきりこう言っていた。
    枉死城の亡霊たち「李世民（りせいみん）が来たぞ、李世民が来たぞ。」
    太宗はその声に肝をつぶした。腰を引きずり、腕が折れ、足はあっても頭のない亡霊の群れが、前へ出て道をふさぎ、口々に叫ぶ。
    枉死城の亡霊たち「命を返せ！　命を返せ！」
    太宗は慌てて逃げ隠れし、ただ叫んだ。
    太宗「崔先生、助けてくれ！　崔先生、助けてくれ！」
    崔珏「陛下、あの者たちは、六十四か所に戦乱を起こし、七十二か所に群れた草賊の、王子たちや頭目たちの亡霊です。皆、不慮に死んだ怨みを抱え、引き取る者も面倒を見る者もなく、生まれ変わることもできません。旅費にする銭もなく、寄る辺のない飢えた鬼になっているのです。陛下が幾らか銭をお与えになれば、臣もお救いできます。」
    太宗「朕は身一つでここへ来たのだ。どこに銭など持っていよう。」
    崔珏「陛下、この世のある人が、かなりの金銀をこちらの冥府に預けております。陛下がお名前を出して借用の証文をお書きになれば、私が保証人となりましょう。ひとまず一蔵分を借りて、あの餓鬼たちに配れば、通ることができます。」
    太宗「それは誰なのだ。」
    崔珏「河南（かなん）の開封府（かいほうふ）に住む、姓を相（しょう）、名を良（りょう）という者です。こちらに十三蔵分の金銀を置いております。陛下がお借りになった分は、この世へ戻ってから返せばよいのです。」
    太宗は大いに喜び、自分の名で借りることに同意した。そこで証文を作って崔珏に渡し、金銀一蔵分を借り受け、朱太尉にすべて配らせた。崔珏は重ねて言い聞かせた。
    崔珏「この金銀はお前たちで等しく分けて使い、大唐のご主君を通してさしあげよ。この世での寿命は、まだまだあるのだ。私は十王のご命令でお送りし、魂を戻してさしあげる。この世で水陸大会（すいりくだいえ）を営み、お前たちを救って生まれ変わらせるようにするから、もう騒ぎを起こすな。」
    亡霊たちはその言葉を聞き、金銀を受け取ると、皆おとなしく承知して引き下がった。崔珏は朱太尉に引魂幡を振らせ、太宗を導いて枉死城を出た。一行は平らで明るい大道に上り、ふわふわと進んでいった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "六十四・七十二という数と、王子・頭目という列挙を保持。「王子」を一般的な諸王に正規化していないが、ここでは戦乱の王侯・首領を広く指す可能性がある。相良の預託は十三蔵、そのうち借用・配布するのは一蔵。現代金額へ換算しない。"
- "id": "xy-ch11-021"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    前進多時，卻來到六道輪迴之所。又見那騰雲的，身披霞帔；受籙的，腰掛金魚。僧尼道俗，走獸飛禽，魑魅魍魎，滔滔都奔走那輪迴之下，各進其道。唐王問曰：「此意何如？」判官道：「陛下明心見性，是必記了，傳與陽間人知。這喚做六道輪迴：那行善的，昇化仙道；盡忠的，超生貴道；行孝的，再生福道；公平的，還生人道；積德的，轉生富道；惡毒的，沉淪鬼道。」唐王聽說，點頭嘆曰：「
    善哉真善哉，作善果無災。
    善心常切切，善道大開開。
    莫教興惡念，是必少刁乖。
    休言不報應，神鬼有安排。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 175
    "line_end": 180
  "translation_ja": |-
    長いこと進むと、六道輪廻（ろくどうりんね）の場所へ着いた。そこには、雲に乗って霞の衣をまとった者もいれば、官位を授かり、金の魚符（ぎょふ）を腰に下げた者もいた。僧や尼、道士や俗人、走る獣、飛ぶ鳥、魑魅魍魎が、絶えることなく輪廻のもとへ駆け寄り、それぞれの道に入っていく。
    太宗「これはどういうことなのだ。」
    崔珏「陛下、ご自身の心と本性を明らかになさり、ぜひこれを覚えて、この世の人々にお伝えください。これを六道輪廻と申します。善を行った者は昇って仙道（せんどう）に変わり、忠義を尽くした者は貴道（きどう）に生まれ、孝行した者は福道（ふくどう）に再生し、公平であった者は人道（じんどう）に戻り、徳を積んだ者は富道（ふどう）に転生し、悪辣であった者は鬼道（きどう）に沈みます。」
    太宗は聞いてうなずき、感嘆して詠んだ。
    太宗「善いことだ、まことに善いことだ。善をなせば、果たして災いはない。
    善を思う心はいつも切に、善へ進む道は大きく開く。
    悪い念を起こさせず、必ず狡猾さを慎め。
    報いなどないと言うな。神も鬼も取り計らっている。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "金魚は魚の金魚ではなく官位を示す金の魚符。受籙は仙籍・官職の資格を受ける意に解しうるが、前半の雲に乗る仙人との対比と魚符の描写から、ここは官位を授かる者と解した。六道は仙道・貴道・福道・人道・富道・鬼道という本章独自の分類を全て保持し、仏教の通常の六道へ直さない。"
- "id": "xy-ch11-022"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "判官送唐王直至那超生貴道門，拜呼唐王道：「陛下啊，此間乃出頭之處，小判告回，著朱太尉再送一程。」唐王謝道：「有勞先生遠踄。」判官道：「陛下到陽間，千萬做個水陸大會，超度那無主的冤魂，切勿忘了。若是陰司裡無報怨之聲，陽世間方得享太平之慶。凡百不善之處，俱可一一改過。普諭世人為善，管教你後代綿長，江山永固。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    崔珏は太宗を、貴道に生まれ出る門まで送り、拝礼して呼びかけた。
    崔珏「陛下、ここが外へ出る場所でございます。私はこれにて戻らせていただき、朱太尉にもう少しお送りさせます。」
    太宗は礼を述べた。
    太宗「先生、遠くまで足を運んでいただき、かたじけない。」
    崔珏「陛下、この世へお戻りになったら、必ず水陸大会を営み、祭る者のない怨霊たちをお救いください。決してお忘れになりませぬよう。冥府に怨みを訴える声がなくなってこそ、この世も太平の喜びを享受できるのです。善くないことは何事も、一つ一つ改めてください。世の人々に広く善行を勧めれば、必ずやお家の後代は長く続き、国は永く安泰となりましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch11-023"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王一一准奏，辭了崔判官，隨著朱太尉，同入門來。那太尉見門裡有一匹海騮馬，鞍韂齊備，急請唐王上馬，太尉左右扶持。馬行如箭，早到了渭水河邊。只見那水面上有一對金色鯉魚，在河裡翻波跳鬥。唐王見了心喜，兜馬貪看不捨。太尉道：「陛下，趲動些，趁早趕時辰進城去也。」那唐王只管貪看，不肯前行。被太尉撮著腳，高呼道：「還不走，等甚？」撲的一聲，望那渭河推下馬去。卻就脫了陰司，徑回陽世。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    太宗は一つ一つの進言を聞き入れ、崔珏に別れを告げると、朱太尉とともに門へ入った。中には鞍と泥よけを備えた一頭の海騮馬（かいりゅうば）がいたので、朱太尉はすぐに太宗を乗せ、左右から支えた。馬は矢のように走り、たちまち渭水（いすい）の岸に着いた。水面には金色の鯉が二匹、波を翻し、跳ねて戯れていた。太宗は喜び、馬を止め、いつまでも見飽きなかった。
    朱太尉「陛下、もう少しお急ぎください。時刻に間に合うよう、早く城へ参りましょう。」
    それでも太宗は見とれるばかりで、先へ進もうとしなかった。朱太尉はその足をつかみ、大声で叫んだ。
    朱太尉「まだ行かぬか。何を待っている！」
    そしてどんと一押し、太宗を馬から渭河（いが）へ突き落とした。これで太宗は冥府を脱し、まっすぐこの世へ帰ったのである。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "鯉は二匹であり、後段の雙頭魚戲もこの描写を受けて解した。海騮馬は馬の呼称のまま保持し、毛色や産地を確定的に追加しない。渭水と渭河は同一河川の別称。"
- "id": "xy-ch11-024"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那唐朝駕下有徐茂公、秦叔寶、胡敬德、段志玄、馬三寶、程咬金、高士廉、李世勣、房玄齡、杜如晦、蕭瑀、傅奕、張道源、張士衡、王珪等兩班文武，俱保著那東宮太子與皇后、嬪妃、宮娥、侍長，都在那白虎殿上舉哀。一壁廂議傳哀詔，要曉諭天下，欲扶太子登基。時有魏徵在傍道：「列位且住，不可，不可。假若驚動州縣，恐生不測。且再按候一日，我主必還魂也。」下邊閃上許敬宗道：「魏丞相言之甚謬。自古云：『潑水難收，人逝不返。』你怎麼還說這等虛言，惑亂人心，是何道理？」魏徵道：「不瞞許先生說，下官自幼得授仙術，推算最明，管取陛下不死。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    さて、唐（とう）の朝廷では、徐茂公（じょもこう）、秦叔宝（しんしゅくほう）、胡敬德（こけいとく）、段志玄（だんしげん）、馬三宝（ばさんぽう）、程咬金（ていこうきん）、高士廉（こうしれん）、李世勣（りせいせき）、房玄齢（ぼうげんれい）、杜如晦（とじょかい）、蕭瑀（しょうう）、傅奕（ふえき）、張道源（ちょうどうげん）、張士衡（ちょうしこう）、王珪（おうけい）ら文武両班の臣が、皇太子と皇后、嬪妃、宮女、侍従の長たちを守り、白虎殿（びゃっこでん）で喪に服していた。一方では崩御を告げる詔を天下へ知らせ、太子を帝位に就けようと相談していた。その時、傍らにいた魏徴が言った。
    魏徴「皆さま、しばらくお待ちください。それはいけません、いけません。州県を驚かせれば、不測の事態を招くおそれがあります。もう一日だけ、お待ちください。我が君は必ず魂を取り戻されます。」
    下手から許敬宗（きょけいそう）が進み出た。
    許敬宗「魏丞相のお言葉は、甚だしく間違っています。昔から『こぼれた水は取り戻せず、死んだ人は帰らない』と申します。なぜそのような空言を述べ、人心を惑わされるのです。どういうおつもりですか。」
    魏徴「許先生、隠さず申し上げましょう。下官は幼い頃から仙術を授かり、推算にはきわめて通じております。陛下が亡くなられないことは、私がお請け合いします。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "徐茂公と李世勣は同一人物の異名だが、底本は同じ列挙中に併記している。列挙を削らずそのまま残した。通常の地の文・話者名では既存方針どおり徐世勣とする。胡敬德も尉遅恭の呼称として扱うが、この列挙の原字は保持した。"
- "id": "xy-ch11-025"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正講處，只聽得棺中連聲大叫道：「渰殺我耶！渰殺我耶！」諕得個文官武將心慌，皇后嬪妃膽戰。一個個："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    ちょうどそう話している時、棺の中から立て続けに大声が上がった。
    太宗「溺れてしまう！　溺れてしまう！」
    文官も武将も慌てふためき、皇后も嬪妃も肝を冷やした。その誰もが、
  "translation_status": "reviewed"
- "id": "xy-ch11-026"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": "面如秋後黃桑葉，腰似春前嫩柳條。儲君腳軟，難扶喪杖盡哀儀；侍長魂飛，怎戴梁冠遵孝禮。嬪妃打跌，綵女欹斜。嬪妃打跌，卻如狂風吹倒敗芙蓉；綵女欹斜，好似驟雨沖歪嬌菡萏。眾臣悚懼，骨軟筋麻。戰戰兢兢，痴痴啞啞。把一座白虎殿，卻像斷梁橋；鬧喪臺，就如倒塌寺。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 188
    "line_end": 188
  "translation_ja": |-
    顔は秋の末の黄色い桑の葉のよう、腰は春を待つ柔らかな柳の枝のよう。
    皇太子は足がなえ、喪の杖にすがって弔いの儀を尽くすこともできない。
    侍従の長は魂も飛び、どうして梁冠（りょうかん）を戴き、孝の礼に従えよう。
    嬪妃は転び、宮女はよろめく。
    嬪妃が転ぶさまは、激しい風に朽ちた蓮が倒されるよう。
    宮女がよろめくさまは、にわか雨に愛らしい蓮のつぼみが押し傾けられるよう。
    臣たちは恐れ、骨に力なく筋もしびれ、おののき震え、呆然として声も出ない。
    白虎殿はまるで桁の折れた橋、喪の祭壇は崩れた寺のようになった。
  "translation_status": "reviewed"
- "id": "xy-ch11-027"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時眾宮人走得精光，那個敢近靈扶柩。多虧了正直的徐茂公、理烈的魏丞相、有膽量的秦瓊、忒猛撞的敬德，上前來扶著棺材，叫道：「陛下有甚麼放不下心處，說與我等，不要弄鬼，驚駭了眷族。」魏徵道：「不是弄鬼，此乃陛下還魂也。快取器械來。」打開棺蓋，果見太宗坐在裡面，還叫：「渰死我了！是誰救撈？」茂公等上前扶起道：「陛下甦醒，莫怕，臣等都在此護駕哩。」唐王方才開眼道：「朕適才好苦：躲過陰司惡鬼難，又遭水面喪身災。」眾臣道：「陛下寬心勿懼，有甚水災來？」唐王道：「朕騎著馬，正行至渭水河邊，見雙頭魚戲。被朱太尉欺心，將朕推下馬來，跌落河中，幾乎渰死。」魏徵道：「陛下鬼氣尚未解。」急著太醫院進安神定魄湯藥，又安排粥膳。連服一二次，方才反本還原，知得人事。一計唐王死去，已三晝夜，復回陽間為君。有詩為證："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    宮中の者たちは、この時すっかり逃げ出してしまい、誰があえて霊前へ近づき、棺を支えようか。幸い、正直な徐世勣（じょせいせき）、道理を貫く魏徴、胆力のある秦叔宝、向こう見ずなほど勇猛な尉遅恭（うっちきょう）が、前へ出て棺を押さえ、呼びかけた。
    徐世勣・魏徴・秦叔宝・尉遅恭「陛下、何かお心残りがおありなら、臣らにお聞かせください。どうか化けて出て、ご家族を驚かせないでください。」
    魏徴「化けて出られたのではありません。陛下の魂がお戻りになったのです。早く道具を持ってきなさい。」
    棺の蓋を開けると、果たして太宗が中に座り、なおも叫んでいた。
    太宗「溺れて死んでしまう！　誰か助けてくれ！」
    徐世勣らは前へ出て助け起こした。
    徐世勣ら「陛下、お気がつかれましたか。恐れることはございません。臣ら皆がここでお守りしております。」
    太宗はようやく目を開いた。
    太宗「朕はたった今、ひどい目に遭った。冥府の悪鬼の難を逃れたのに、今度は水の上で命を失う災難に遭ったのだ。」
    臣たち「陛下、ご安心ください。何をお恐れになります。どこに水難などございましょう。」
    太宗「朕は馬に乗って渭水の岸へ行き、二匹の魚が戯れるのを見ていた。すると朱太尉が意地悪くも朕を馬から突き落とし、川へ落ちて、危うく溺れ死ぬところだった。」
    魏徴「陛下には、まだ冥府の気が残っておられます。」
    そこで急いで太医院（たいいいん）に命じ、心を静め魂を落ち着かせる煎じ薬を出させ、粥も用意させた。一、二度続けて口にすると、ようやく本来の状態に戻り、この世のことが分かるようになった。数えてみれば、太宗が亡くなってから、すでに三日三晩が経っており、再びこの世の君主に戻ったのであった。証しの詩がある。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "理烈は一般的な語形として未確定。魏徴の性質を表す並列から「道理を貫く」と暫定的に解した。雙頭魚戲は023の二匹の金色の鯉を受けて「二匹の魚が戯れる」とし、双頭の怪魚とはしない。"

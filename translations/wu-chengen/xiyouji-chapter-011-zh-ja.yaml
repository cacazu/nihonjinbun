  "translation_status": "reviewed"
- "id": "xy-ch11-002"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    詩曰：
    百歲光陰似水流，一生事業等浮漚。
    昨朝面上桃花色，今日頭邊雪片浮。
    白蟻陣殘方是幻，子規聲切早回頭。
    古來陰騭能延壽，善不求憐天自周。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 121
    "line_end": 126
  "translation_ja": |-
    詩にいう。
    百年の月日は流れる水のよう、一生の事業は浮かぶ泡にも等しい。
    昨日は顔に桃の花の色があったのに、今日は頭に雪のかけらが浮いている。
    白蟻の陣が敗れて初めて幻と知る。ほととぎすが切なく鳴くうちに、早く立ち返れ。
    昔から人知れぬ善行は寿命を延ばす。恵みを求めず善をなせば、天がおのずと報いてくれる。
  "translation_status": "reviewed"
  "issues":

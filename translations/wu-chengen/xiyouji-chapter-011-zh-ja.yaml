    "status": "open"
    "message_ja": "還魂者を転生の経路へ案内する説明。別人に生まれ変わったと結果を先取りしない。「別の身に託して生まれ出る道を通っていただく」と、道筋の説明として訳した。"
- "id": "xy-ch11-013"
  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "徑行數里，忽見一座高山，陰雲垂地，黑霧迷空。太宗道：「崔先生，那廂是甚麼山？」判官道：「乃幽冥背陰山。」太宗悚懼道：「朕如何去得？」判官道：「陛下寬心，有臣等引領。」太宗戰戰兢兢，相隨二人，上得山岩，擡頭觀看，只見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    数里ほど進むと、突然、高い山が見えた。陰鬱な雲が地まで垂れ、黒い霧が空を覆っている。
    太宗「崔先生、あちらは何という山だ。」
    崔珏「冥界の背陰山（はいんざん）でございます。」
    太宗はぞっとして言った。
    太宗「朕に、どうしてあそこを行けようか。」
    崔珏「陛下、ご安心ください。臣らがお導きいたします。」
    太宗はびくびく震えながら二人に従い、山の岩場へ上った。顔を上げると、目の前にはこんな光景があった。
  "translation_status": "reviewed"
- "id": "xy-ch11-014"
  "section_id": "chapter-11"
  "kind": "verse"
  "origin": "source"
  "source_text": "形多凸凹，勢更崎嶇。峻如蜀嶺，高似廬巖。非陽世之名山，實陰司之險地。荊棘叢叢藏鬼怪，石崖磷磷隱邪魔。耳畔不聞獸鳥噪，眼前惟見鬼妖行。陰風颯颯，黑霧漫漫。陰風颯颯，是神兵口內哨來煙；黑霧漫漫，是鬼祟暗中噴出氣。一望高低無景色，相看左右盡猖亡。那裡山也有，峰也有，嶺也有，洞也有，澗也有；只是山不生草，峰不插天，嶺不行客，洞不納雲，澗不流水。岸前皆魍魎，嶺下盡神魔，洞中收野鬼，澗底隱邪魂。山前山後，牛頭馬面亂喧呼；半掩半藏，餓鬼窮魂時對泣。催命的判官，急急忙忙傳信票；追魂的太尉，吆吆喝喝趲公文。急腳子，旋風滾滾；勾司人，黑霧紛紛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch11-1500624"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第011回&oldid=1500624"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    山肌はでこぼこと起伏し、地勢はいよいよ険しい。
    蜀（しょく）の嶺のように切り立ち、廬山（ろざん）の岩のように高い。
    この世の名山ではなく、まさに冥府の険しい地。
    茨の茂みには鬼怪が潜み、ごつごつした岩崖には邪魔が隠れる。
    耳には獣や鳥の声もなく、目の前を行くのは鬼や妖ばかり。
    陰風はさあさあと吹き、黒霧は果てなく広がる。
    陰風がさあさあと吹くのは、神兵の口が吹き鳴らす煙。
    黒霧が果てなく広がるのは、物の怪が闇で吐き出す気。
    高い所も低い所も風情などなく、右を見ても左を見ても荒ぶる亡霊ばかり。
    山もあり、峰もあり、嶺もあり、洞もあり、谷川もある。
    ただ、山には草が生えず、峰は空を突かず、嶺には旅人がなく、洞には雲が入らず、谷川には水が流れない。
    岸の前は魍魎ばかり、嶺の下は神魔ばかり。洞は野の亡霊を収め、谷底は邪悪な魂を隠す。
    山の前も後ろも、牛頭と馬面が入り乱れて叫ぶ。
    半ば覆われ、半ば隠れた所では、飢えた鬼や寄る辺ない魂が、時に向かい合って泣く。
    命を取り立てる判官は、あわただしく召喚状を伝える。
    魂を追う太尉は、わめき立てながら公文書の手続きをせき立てる。
    足の速い使いが走れば、つむじ風が渦を巻く。
    魂を拘引する役人が行けば、黒い霧が乱れ飛ぶ。
  "translation_status": "reviewed"
  "issues":

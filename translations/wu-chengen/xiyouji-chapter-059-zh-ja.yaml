  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖撥轉雲頭，徑回東路，霎時按落雲頭，立在紅磚壁下。八戒見了，歡喜道：「師父，師兄來了，來了。」三藏即與本莊老者同沙僧出門接著，同至舍內。把芭蕉扇靠在旁邊道：「老官兒，可是這個扇子？」老者道：「正是，正是。」唐僧喜道：「賢徒有莫大之功。求此寶貝，甚勞苦了。」行者道：「勞苦倒也不說。那鐵扇仙，你道是誰？那廝原來是牛魔王的妻，紅孩兒的母，名喚羅剎女，又喚鐵扇公主。我尋到洞外借扇，他就與我講起讎隙，把我砍了幾劍。是我使棒嚇他，他就把扇子搧了我一下，飄飄蕩蕩，直刮到小須彌山。幸見靈吉菩薩，送了我一粒定風丹，指與歸路。復至翠雲山，又見羅剎女。羅剎女又使扇子，搧我不動，他就回洞。是老孫變作一個蟭蟟蟲，飛入洞去。那廝正討茶吃，是我又鑽在茶沫之下，到他肚裡，做起手腳。他疼痛難禁，不住口的叫我做叔叔饒命，情願將扇借與我。我卻饒了他，拿將扇來。待過了火焰山，仍送還他。」三藏聞言，感謝不盡。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    悟空は雲の向きを変え、まっすぐ東の道へ戻った。ほどなく雲を降ろし、赤煉瓦の壁の下へ立つと、八戒が見つけて喜んだ。
    八戒「お師匠さま、兄貴が帰ってきました、帰ってきました。」
    三蔵は邸の老人、沙悟浄とともに門へ迎えに出て、皆で家の中へ入った。悟空は芭蕉扇を脇へ立てかけて言った。
    悟空「ご老人、扇というのは、これでしょうか。」
    老人「それです、それです。」
    三蔵は喜んだ。
    三蔵「弟子よ、まことに大きな手柄だ。この宝を求めるには、さぞ苦労しただろう。」
    悟空「苦労は、まあよいのです。あの鉄扇仙が誰だと思われますか。牛魔王の妻、紅孩児の母で、羅刹女といい、鉄扇公主とも呼ばれている女でした。洞の外まで行って扇を頼むと、恨みつらみを持ち出して、私を何度か剣で斬りました。棒で脅してやると、扇で一あおぎされ、ふわふわと飛ばされて、とうとう小須弥山まで行ってしまいました。幸い、霊吉菩薩にお会いでき、定風丹を一粒いただいて、帰り道も教えていただきました。もう一度翠雲山へ行って羅刹女に会うと、また扇であおぎましたが、今度は私は動きません。そこであの女は洞へ引っ込みました。私は蟭蟟虫に化けて、洞へ飛び込みました。ちょうど女が茶を飲もうとしていたので、茶の泡の下へ潜り込み、腹の中へ入って手足を動かしてやったのです。痛みに耐えられず、弟御、命だけは助けてくれと、ひっきりなしに頼み、扇を貸すと承知しました。そこで命を助け、扇を持ってきたのです。火焔山を越えたら、また返してやりましょう。」
    三蔵はそれを聞き、感謝してやまなかった。
  "translation_status": "reviewed"
- "id": "xy-ch59-031"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們俱拜辭老者，一路西來。約行有四十里遠近，漸漸酷熱蒸人。沙僧只叫：「腳底烙得慌。」八戒又道：「爪子燙得痛。」馬比尋常又快，只因他熱難停，十分躁進。行者道：「師父且請下馬，兄弟們莫走。等我搧息了火，待風雨之後，地土冷些，再過山去。」行者果舉扇，徑至火邊，盡力一搧，那山上火光烘烘騰起；再一扇，更著百倍；又一扇，那火足有千丈之高，漸漸燒著身體。行者急回，已將兩股毫毛燒淨。徑跑至唐僧面前叫：「快回去，快回去。火來了，火來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    師弟は皆で老人に別れの礼を述べ、西へ進んだ。四十里ほど行くと、次第にひどい熱気で蒸し上げられるようになった。沙悟浄が何度も叫ぶ。
    沙悟浄「足の裏が、焼けついてたまりません。」
    八戒も言った。
    八戒「俺の足先も、熱くて痛い。」
    馬はいつもより足が速かった。暑くて立ち止まれず、ひどくせき立てられるように進むのだ。
    悟空「お師匠さま、ひとまず馬をお下りください。弟たちも歩くな。俺が火をあおぎ消すから、風雨の過ぎたあと、地面が少し冷めるのを待って、山を越えよう。」
    悟空は扇を持ち上げ、まっすぐ火のそばへ行って、力いっぱいあおいだ。すると山の火が、ごうごうと燃え上がった。もう一あおぎすると、さらに百倍も激しく燃え、また一あおぎすると、炎は千丈（じょう）もの高さとなり、次第に体まで焼き始めた。悟空は急いで引き返したが、すでに両腿の毛が、すっかり焼けていた。まっすぐ三蔵の前へ駆け戻り、叫んだ。
    悟空「早く戻ってください、早く戻ってください！　火が来た、火が来た！」
  "translation_status": "reviewed"
- "id": "xy-ch59-032"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那師父爬上馬，與八戒、沙僧，復東來有二十餘里，方才歇下，道：「悟空，如何了呀？」行者丟下扇子道：「不停當，不停當，被那廝哄了。」三藏聽說，愁促眉尖，悶添心上，止不住兩淚交流，只道：「怎生是好？」八戒道：「哥哥，你急急忙忙叫回去是怎麼說？」行者道：「我將扇子搧了一下，火光烘烘；第二扇，火氣愈盛；第三扇，火頭飛有千丈之高。若是跑得不快，把毫毛都燒盡矣。」八戒笑道：「你常說雷打不傷，火燒不損，如今何又怕火？」行者道：「你這獃子，全不知事。那時節用心防備，故此不傷；今日只為搧息火光，不曾捻避火訣，又未使護身法，所以把兩股毫毛燒了。」沙僧道：「似這般火盛，無路通西，怎生是好？」八戒道：「只揀無火處走便罷。」三藏道：「那方無火？」八戒道：「東方、南方、北方俱無火。」又問：「那方有經？」八戒道：「西方有經。」三藏道：「我只欲往有經處去哩。」沙僧道：「有經處有火，無火處無經，誠是進退兩難。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    三蔵は馬へよじ登り、八戒、沙悟浄とともに、また東へ二十余里戻って、ようやく足を止めた。
    三蔵「悟空、いったいどうなったのだ。」
    悟空は扇を投げ出して言った。
    悟空「だめです、だめです。あの女にだまされました。」
    三蔵はそれを聞くと、眉をひそめ、胸に憂いを募らせ、両の目から涙が流れるのを止められなかった。ただ、繰り返す。
    三蔵「どうしたらよいのだ。」
    八戒「兄貴、あんなに慌てて戻れと叫んだのは、どういうわけだ。」
    悟空「扇で一あおぎしたら、火がごうごうと上がり、二度目には、なお激しく燃えた。三度目には炎が千丈も跳ね上がったんだ。素早く逃げなければ、毛を全部焼かれていたぞ。」
    八戒は笑った。
    八戒「いつも雷に打たれても傷つかず、火に焼かれても損なわれないと言っているのに、今度はどうして火を怖がるんだ。」
    悟空「この間抜け、何も分かっちゃいない。あのときは用心して備えていたから、傷つかなかったんだ。今日はただ火をあおぎ消すことばかり考え、避火訣（ひかけつ）の印も結ばず、身を守る術も使わなかった。それで両腿の毛を焼かれたのさ。」
    沙悟浄「これほど火が激しくては、西へ通じる道がありません。どうしましょう。」
    八戒「火のない所を選んで歩けばいいだけだ。」
    三蔵「どちらに火がないのだ。」
    八戒「東も、南も、北も、火はありません。」
    三蔵はさらに尋ねた。
    三蔵「では、どちらに経がある。」
    八戒「西に経があります。」
    三蔵「私は、ただ経のある所へ行きたいのだよ。」
    沙悟浄「経のある所には火があり、火のない所には経がない。まことに、進むにも退くにも困りました。」
  "translation_status": "reviewed"

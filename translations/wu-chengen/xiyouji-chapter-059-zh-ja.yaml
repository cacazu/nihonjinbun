  "source_text": "且不說這家子供奉唐僧加倍。卻說那行者霎時徑到翠雲山，按住祥光，正自找尋洞口，只聞得丁丁之聲，乃是山林內一個樵夫伐木。行者即趨步至前，又聞得他道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"

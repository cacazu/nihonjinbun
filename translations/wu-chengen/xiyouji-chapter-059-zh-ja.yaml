    "line_start": 134
    "line_end": 134
  "translation_ja": "この家が三蔵をいっそう大切にもてなした話は、ひとまず置こう。さて、悟空は一瞬で翠雲山に着き、めでたい光を収めて降り立ち、洞穴の入口を探していた。すると、かんかんと音がする。山林で一人の木こりが木を伐っていたのだ。悟空が足早に近づくと、さらにその声が聞こえてきた。"
  "translation_status": "reviewed"
- "id": "xy-ch59-013"

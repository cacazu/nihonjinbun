  "source_text": "師徒們正自胡談亂講，只聽得有人叫道：「大聖不須煩惱，且來吃些齋飯再議。」四眾回看時，見一老人，身披飄風氅，頭頂偃月冠，手持龍頭杖，足踏鐵靿靴。後帶著一個雕嘴魚腮鬼，鬼頭上頂著一個銅盆，盆內有些蒸餅糕糜、黃糧米飯。在於西路下躬身道：「我本是火焰山土地，知大聖保護聖僧，不能前進，特獻一齋。」行者道：「吃齋小可，這火光幾時滅得，讓我師父過去？」土地道：「要滅火光，須求羅剎女借芭蕉扇。」行者去路旁拾起扇子道：「這不是？那火光越搧越著，何也？」土地看了，笑道：「此扇不是真的，被他哄了。」行者道：「如何方得真的？」那土地又控背躬身，微微笑道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    師弟が取りとめもなく言い合っていると、人の呼ぶ声がした。
    声の主「大聖、お悩みなさいますな。まず少し精進の食事を召し上がってから、ご相談を。」
    四人が振り返ると、一人の老人が見えた。風になびく外套をまとい、半月形の冠をかぶり、竜の頭をかたどった杖を手にし、筒の部分が鉄の靴を履いている。後ろには、鷲のくちばしと魚のえらを持つ鬼を一人連れていた。鬼は頭に銅の盆を載せ、盆には蒸し餅、菓子や粥、黄色い穀物の飯があった。老人は西へ向かう道に立ち、腰をかがめて言った。
    老人「私は火焔山の土地神でございます。大聖が聖僧をお守りしながらも、先へ進めないと知り、わざわざ一食お届けに参りました。」
    悟空「食事はともかく、この火はいつ消して、師匠を通せるんだ。」
    土地神「火を消すには、羅刹女に頼んで芭蕉扇を借りねばなりません。」
    悟空は道端へ行き、扇を拾い上げて言った。
    悟空「これじゃないか。あおげばあおぐほど燃えるのは、どうしたことだ。」
    土地神は見て笑った。
    土地神「この扇は本物ではございません。だまされたのです。」
    悟空「どうすれば、本物を手に入れられる。」
    土地神はまた背を丸めて腰をかがめ、かすかに笑って言った。
  "translation_status": "reviewed"

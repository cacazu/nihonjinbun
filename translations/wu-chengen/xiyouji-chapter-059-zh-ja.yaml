    "line_end": 142
  "translation_ja": "悟空は木こりと別れ、まっすぐ芭蕉洞の入口へ行った。二枚の扉は、ぴったりと閉ざされている。洞の外は景色も美しい。まことによい所だ。そのありさまは、"
  "translation_status": "reviewed"
- "id": "xy-ch59-017"

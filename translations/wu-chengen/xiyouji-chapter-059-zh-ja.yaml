    "line_end": 160
  "translation_ja": |-
    悟空は門が閉まるのを見ると、一計を案じ、襟の縫い目をほどいて定風丹を口に含んだ。体を揺すって小さな蟭蟟虫（しょうりょうちゅう）に変わり、門の隙間から入り込む。中では羅刹女が叫んでいた。
    羅刹女「喉が渇いた、喉が渇いた。早く茶を持ってきな。」
    近くに仕える娘が、香りのよい茶を壺から、ざあざあと碗いっぱいに注ぐと、茶の泡が盛り上がった。悟空は喜び、ぶんと羽ばたいて、その泡の下へ飛び込んだ。羅刹女はひどく喉が渇いていたので、茶を受け取ると、二、三口で飲み干した。悟空はすでに腹の中へ入り、もとの姿になって、鋭い声で叫んだ。
    悟空「姉上、扇を貸してくださいな。」
    羅刹女は驚いて顔色を変え、叫んだ。
    羅刹女「お前たち、前の門は閉めたか。」
    侍女たち「閉めました。」
    羅刹女「閉めたのに、どうして孫行者が家の中で叫んでいるのだ。」
    侍女「奥さまのお体から叫んでおります。」
    羅刹女「孫行者、どこで術を使っている。」
    悟空「俺は生まれてこのかた、見せかけの術など使わん。どれも本当の腕前、本物の力さ。今は姉上のおなかの中で遊んでいて、肺も肝も拝見した。姉上も腹が減り、喉が渇いただろう。まずは『坐碗（ざわん）』を一杯差し上げて、渇きを癒やそう。」
    そう言って、足を下へ踏みつけた。羅刹女は下腹の痛みに耐えられず、地べたへ座り込み、苦しみを叫んだ。
    悟空「姉上、遠慮はいらん。今度は『点心（てんしん）』を一つ差し上げて、腹を満たそう。」
    さらに頭で上へ突き上げると、羅刹女は胸の痛みに耐えられず、地面を転げ回った。痛みで顔は黄色く、唇は白くなり、ただ叫ぶばかりだった。
    羅刹女「孫の弟御、命だけはお助けください！」
  "translation_status": "reviewed"
- "id": "xy-ch59-029"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻才收了手腳道：「你才認得叔叔麼？我看牛大哥情上，且饒你性命。快將扇子拿來我使使。」羅剎道：「叔叔，有扇，有扇，你出來拿了去。」行者道：「拿扇子我看了出來。」羅剎即叫女童拿一柄芭蕉扇，執在傍邊。行者探到喉嚨之上見了道：「嫂嫂，我既饒你性命，不在腰肋之下搠個窟窿出來，還自口出。你把口張三張兒。」那羅剎果張開口。行者還作個蟭蟟蟲，先飛出來，丁在芭蕉扇上。那羅剎不知，連張三次，叫：「叔叔出來罷。」行者化原身，拿了扇子，叫道：「我在此間不是？謝借了，謝借了。」拽開步，往前便走。小的們連忙開了門，放他出洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    悟空はようやく手足を収めて言った。
    悟空「やっと弟分だと認めたか。牛の兄貴の顔を立てて、命は助けてやろう。早く扇を出して、使わせてくれ。」
    羅刹女「弟御、扇はあります、あります。出てきて、お持ちください。」
    悟空「扇を出して、俺に見せろ。それから出る。」
    羅刹女はすぐ娘に芭蕉扇を一本持ってこさせ、そばで持たせた。悟空は喉の上まで探り寄り、扇を見て言った。
    悟空「姉上、命を助けると言ったからには、腰やあばらの下に穴を開けては出ない。やはり口から出よう。口を三度開いてくれ。」
    羅刹女は言われたとおり口を開けた。悟空はまた蟭蟟虫になり、真っ先に飛び出して、芭蕉扇に止まった。羅刹女はそれに気づかず、続けて三度口を開き、呼んだ。
    羅刹女「弟御、どうぞお出になってください。」
    悟空はもとの姿に戻り、扇をつかんで叫んだ。
    悟空「ここにいるじゃないか。貸してくれて、ありがたい、ありがたい。」
    大股で前へ歩き出すと、侍女たちは急いで門を開け、洞の外へ通した。
  "translation_status": "reviewed"
- "id": "xy-ch59-030"

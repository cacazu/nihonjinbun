  "kind": "verse"
  "origin": "source"
  "source_text": "山以石為骨，石作土之精。煙霞含宿潤，苔蘚助新青。嵯峨勢聳欺蓬島，幽靜花香若海瀛。幾樹喬松棲野鶴，數株衰柳語山鶯。誠然是千年古跡，萬載仙蹤。碧梧鳴彩鳳，活水隱蒼龍。曲逕蓽蘿垂掛，石梯藤葛攀籠。猿嘯翠巖忻月上，鳥啼高樹喜晴空。兩林竹蔭涼如雨，一逕花濃沒繡絨。時見白雲來遠岫，略無定體漫隨風。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    山は石を骨とし、石は土の精となる。
    霞は夜からの潤いを含み、苔は新たな青さを添える。
    高く険しい峰は蓬島（ほうとう）をしのぐ勢い、静かな花の香は海瀛（かいえい）にも似る。
    数本の高い松には野の鶴が宿り、幾株かの衰えた柳では山の鶯がさえずる。
    まさに千年の古跡、万年の仙人の足跡だ。
    青い梧桐に彩り鮮やかな鳳凰が鳴き、生きて流れる水には青竜が潜む。
    曲がりくねった小道には蔓草が垂れ、石段には葛や藤が絡みつく。
    猿は青い岩に叫んで月の出を喜び、鳥は高い木に鳴いて晴れた空を喜ぶ。
    両側の竹林の陰は雨のように涼しく、道いっぱいの濃い花は刺繍の敷物を埋めるよう。
    時折、遠い峰から白雲が来て、定まった姿もなく、風のままに漂ってゆく。
  "translation_status": "reviewed"
- "id": "xy-ch59-018"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者上前叫：「牛大哥，開門，開門。」呀的一聲，洞門開了，裡邊走出一個毛兒女，手中提著花籃，肩上擔著鋤子。真個是一身藍縷無妝飾，滿面精神有道心。行者上前迎著合掌道：「女童，累你轉報公主一聲：我本是取經的和尚，在西方路上，難過火焰山，特來拜借芭蕉扇一用。」那毛女道：「你是那寺裡和尚？叫甚名字？我好與你通報。」行者道：「我是東土來的，叫做孫悟空和尚。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    悟空は前へ出て呼んだ。
    悟空「牛の兄貴、門を開けてくれ。開けてくれ。」
    ぎいっと洞の扉が開き、中から一人の若い娘が出てきた。手に花籠を提げ、肩には鍬を担いでいる。着物はぼろで飾りもないが、顔いっぱいに生気があり、道を求める心がうかがえた。悟空は迎え寄って合掌した。
    悟空「娘さん、公主に取り次いでもらえませんか。私は経を求める僧ですが、西への道で火焔山を越えられず、芭蕉扇をひとたびお借りしたく、お訪ねしました。」
    娘「どちらの寺のお坊さまで、何とおっしゃいますか。お名前が分かれば、お取り次ぎできます。」
    悟空「東土から来た、孫悟空（そんごくう）という僧です。」
  "translation_status": "reviewed"
- "id": "xy-ch59-019"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那毛女即便回身，轉於洞內，對羅剎跪下道：「奶奶，洞門外有個東土來的孫悟空和尚，要見奶奶，拜求芭蕉扇，過火焰山一用。」那羅剎聽見「孫悟空」三字，便似撮鹽入火，火上澆油，骨都都紅生臉上，惡狠狠怒發心頭。口中罵道：「這潑猴！今日來了。」叫：「丫鬟，取披掛，拿兵器來。」隨即取了披掛，拿兩口青鋒寶劍，整束出來。行者在洞外閃過，偷看怎生打扮。只見他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    娘はすぐに身を返し、洞の奥へ行って、羅刹女の前にひざまずいた。
    娘「奥さま、洞の門前に、東土からいらした孫悟空というお坊さまが、奥さまにお目にかかりたいと申しております。火焔山を越えるため、芭蕉扇をお借りしたいそうです。」
    羅刹女は「孫悟空」の三文字を聞くと、火へ塩をひとつまみ投げ込まれ、燃える上から油を注がれたようになった。みるみる顔を赤くし、心に激しい怒りが湧き上がる。口を開いて罵った。
    羅刹女「あのろくでなしの猿め！　とうとう来たか。」
    さらに叫んだ。
    羅刹女「侍女たち、鎧を持て。武器を持ってこい。」
    すぐさま鎧を取り、青く輝く二振りの宝剣を持ち、身支度を整えて出てきた。悟空は洞の外で身をかわし、どんな格好かと、こっそり見た。その姿は、
  "translation_status": "reviewed"
- "id": "xy-ch59-020"
  "section_id": "chapter-59"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭裹團花手帕，身穿納錦雲袍。腰間雙束虎觔絛，微露繡裙偏綃。
    鳳嘴弓鞋三寸，龍鬚膝褲金銷。手提寶劍怒聲高，兇比月婆容貌。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 149
    "line_end": 150
  "translation_ja": |-
    頭には丸い花模様の布を巻き、身には錦を縫い込んだ雲模様の袍。
    腰には虎の筋の組紐を二重に締め、刺繍の裳の薄絹が、わずかにのぞく。
    鳳凰のくちばし形の小さな靴は三寸（すん）、竜のひげをあしらう膝覆いには金の飾り。
    宝剣を手に取り、怒りの声を高く上げ、その凶相は月婆（げつば）の姿にもまさる。
  "translation_status": "reviewed"
- "id": "xy-ch59-021"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那羅剎出門，高叫道：「孫悟空何在？」行者上前，躬身施禮道：「嫂嫂，老孫在此奉揖。」羅剎咄的一聲道：「誰是你的嫂嫂？那個要你奉揖？」行者道：「尊府牛魔王，當初曾與老孫結義，乃七兄弟之親。今聞公主是牛大哥令正，安得不以嫂嫂稱之？」羅剎道：「你這潑猴！既有兄弟之親，如何坑陷我子？」行者佯問道：「令郎是誰？」羅剎道：「我兒是號山枯松澗火雲洞聖嬰大王紅孩兒。被你傾了，我們正沒處尋你報仇，你今上門納命，我肯饒你？」行者滿臉陪笑道：「嫂嫂原來不察理，錯怪了老孫。你令郎因是捉了師父，要蒸要煮，幸虧了觀音菩薩收他去，救出我師。他如今現在菩薩處做善財童子，實受了菩薩正果，不生不滅，不垢不淨，與天地同壽，日月同庚。你倒不謝老孫保命之恩，返怪老孫，是何道理？」羅剎道：「你這個巧嘴的潑猴！我那兒雖不傷命，再怎生得到我的跟前，幾時能見一面？」行者笑道：「嫂嫂要見令郎，有何難處？你且把扇子借我，搧息了火，送我師父過去，我就到南海菩薩處請他來見你，就送扇子還你，有何不可？那時節，你看他可曾損傷一毫？如有些須之傷，你也怪得有理；如比舊時標致，還當謝我。」羅剎道：「潑猴！少要饒舌，伸過頭來，等我砍上幾劍：若受得疼痛，就借扇子與你；若忍耐不得，教你早見閻君。」行者叉手向前，笑道：「嫂嫂切莫多言。老孫伸著光頭，任尊意砍上多少，但沒氣力便罷。是必借扇子用用。」那羅剎不容分說，雙手掄劍，照行者頭上乒乒乓乓，砍有十數下，這行者全不認真。羅剎害怕，回頭要走。行者道：「嫂嫂那裡去？快借我使使。」那羅剎道：「我的寶貝原不輕借。」行者道：「既不肯借，吃你老叔一棒。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    羅刹女は門を出て、大声で呼んだ。
    羅刹女「孫悟空はどこだ。」
    悟空は進み出て、腰をかがめて礼をした。
    悟空「姉上、私がここで、ごあいさつ申し上げます。」
    羅刹女は、ふんと声を上げた。
    羅刹女「誰がお前の姉上だ。誰がお前の礼など欲しがった。」
    悟空「ご主人の牛魔王（ぎゅうまおう）とは、その昔、義兄弟の契りを結びました。七人兄弟の間柄です。今、公主が牛の兄貴の奥方だと伺ったのですから、姉上とお呼びせずにおれましょうか。」
    羅刹女「このろくでなしの猿！　兄弟のよしみがあるなら、どうして私の子を陥れた。」
    悟空は知らぬふりをして尋ねた。
    悟空「ご子息とは、どなたですか。」
    羅刹女「私の子は、号山（ごうざん）の枯松澗（こしょうかん）、火雲洞の聖嬰大王（せいえいだいおう）、紅孩児だ。お前にひどい目に遭わされ、私たちは仇を討とうにも、お前を探す当てがなかった。今、自分から命を差し出しに来たのに、私が許すと思うか。」
    悟空は顔いっぱいに愛想笑いを浮かべた。
    悟空「姉上は事情をよくご存じないので、私をお責めになるのです。ご子息は私の師を捕らえ、蒸すか煮るかするつもりだったのです。幸い、観音菩薩があの子を引き取ってくださり、お師匠さまを救い出せたのです。今では菩薩のもとで善財童子（ぜんざいどうじ）となり、本当に菩薩の正果を授かっています。生まれることも滅びることもなく、汚れることも清まることもなく、天地と同じ寿命、日月と同じ年を得ているのです。命を守ってやった私の恩に感謝なさるどころか、お責めになるとは、どういう道理でしょう。」
    羅刹女「口のうまい、ろくでなしの猿め！　あの子の命は無事でも、どうすれば私のそばへ戻ってこられる。いつになれば、一目でも会えるのだ。」
    悟空は笑った。
    悟空「姉上がご子息に会いたいなら、何も難しくはありません。まず扇を貸してください。火をあおぎ消し、師を向こうへ渡したら、南海（なんかい）の菩薩のもとへ行って、あの子をこちらへお連れしましょう。そのとき扇も返します。それでよいではありませんか。あの子が毛一本でも傷ついているか、そのときご覧ください。少しでも傷があれば、お責めもごもっともです。以前より立派になっていたら、感謝していただかなくては。」
    羅刹女「猿め、無駄口をたたくな。頭を差し出せ。この剣で何度か斬りつけてやる。その痛みに耐えたら、扇を貸してやろう。耐えられなければ、早々に閻君（えんくん）に会わせてやる。」
    悟空は両手を胸の前で重ね、進み出て笑った。
    悟空「姉上、それ以上のお話には及びません。この剥き出しの頭を差し出します。お好きなだけお斬りになり、力が尽きたらやめてください。その代わり、ぜひ扇をお貸し願います。」
    羅刹女は有無を言わせず、両手で剣を振るい、悟空の頭めがけて、がんがん、かんかんと十数回斬りつけた。だが、悟空はいっこうに気にも留めない。羅刹女は恐れをなし、身を返して立ち去ろうとした。
    悟空「姉上、どちらへ。早く扇を貸してください。」
    羅刹女「私の宝は、そうたやすく貸すものではない。」
    悟空「貸さないなら、この弟分の棒を一つ食らえ！」
  "translation_status": "reviewed"
- "id": "xy-ch59-022"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好猴王，一隻手扯住，一隻手去耳內掣出棒來，幌一幌，有碗來粗細。那羅剎掙脫手，舉劍來迎。行者隨又掄棒便打。兩個在翠雲山前，不論親情，卻只講讎隙。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 152
    "line_end": 152
  "translation_ja": "さすがは猿王（えんおう）、片手で羅刹女をつかみ、もう片方の手で耳から棒を取り出した。ひと振りすると、碗ほどの太さになった。羅刹女はその手を振りほどき、剣を上げて迎え撃つ。悟空もまた棒を振るって打ちかかった。二人は翠雲山の前で、身内の情けを顧みず、ただ恨みをぶつけ合った。まことに激しい戦いだ。"
  "translation_status": "reviewed"
- "id": "xy-ch59-023"
  "section_id": "chapter-59"
  "kind": "verse"
  "origin": "source"
  "source_text": "裙釵本是修成怪，為子懷仇恨潑猴。行者雖然生狠怒，因師路阻讓娥流。先言拜借芭蕉扇，不展驍雄耐性柔。羅剎無知掄劍砍，猴王有意說親由。女流怎與男兒鬥，到底男剛壓女流。這個金箍鐵棒多兇猛，那個霜刃青鋒甚緊稠。劈面打，照頭丟，恨苦相持不罷休。左擋右遮施武藝，前迎後架騁奇謀。卻才鬥到沉酣處，不覺西方墜日頭。羅剎忙將真扇子，一搧揮動鬼神愁。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    裳と簪をまとう女は、もともと修行を積んだ妖怪、
    子のために仇を思い、ろくでなしの猿を憎む。
    行者（ぎょうじゃ）にも激しい怒りが生じたが、
    師の道が塞がれているため、女に譲っていた。
    初めは芭蕉扇を借りたいと礼を尽くし、
    勇猛な力を示さず、辛抱して柔らかく頼んだ。
    羅刹女は道理も知らず、剣を振って斬りつけ、
    猿王はわざわざ身内のいわれを語った。
    女の身で、どうして男と戦えよう、
    結局は男の剛力が女を圧する。
    こちらの金箍鉄棒（きんこてつぼう）は凄まじく、
    あちらの霜の刃、青い剣先は、間断なく迫る。
    顔面へ打ち、頭へ振り下ろす。
    深い恨みで渡り合い、やめようともしない。
    左で受け、右で防ぎ、武芸を尽くす。
    前で迎え、後ろで支え、奇策を競う。
    戦いがまさに佳境へ入るころ、
    いつしか西へ日が落ちた。
    羅刹女が急いで本物の扇を取り出し、
    一あおぎすれば、鬼神さえ憂える。
  "translation_status": "reviewed"
- "id": "xy-ch59-024"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那羅剎女與行者相持到晚，見行者棒重，卻又解數周密，料鬥他不過，即便取出芭蕉扇，幌一幌，一扇陰風，把行者搧得無影無形，莫想收留得住。這羅剎得勝回歸。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 156
    "line_end": 156
  "translation_ja": "羅刹女は悟空と夕方まで渡り合ったが、相手の棒が重く、技にも隙がないのを見て、戦ってはかなわぬと悟った。すぐに芭蕉扇を取り出し、ひと振りしてあおぐと、陰の風が起こり、悟空を影も形も見えなくなるまで吹き飛ばした。踏みとどまろうとしても、どうにもならない。羅刹女は勝ちを得て帰った。"
  "translation_status": "reviewed"
- "id": "xy-ch59-025"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖飄飄蕩蕩，左沉不能落地，右墜不得存身。就如旋風翻敗葉，流水淌殘花。滾了一夜，直至天明，方才落在一座山上，雙手抱住一塊峰石。定性良久，仔細觀看，卻才認得是小須彌山。大聖長嘆一聲道：「好利害婦人！怎麼就把老孫送到這裡來了？我當年曾記得在此處告求靈吉菩薩降黃風怪救我師父。那黃風嶺至此直南上有三千餘里，今在西路轉來，乃東南方隅，不知有幾萬里。等我下去問靈吉菩薩一個消息，好回舊路。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    悟空はふわふわ、ゆらゆらと漂い、左へ沈もうとしても地につかず、右へ落ちようとしても身を置く所がない。つむじ風に翻弄される枯葉、流水に運ばれる散り花のようだった。一晩じゅう転がるように飛ばされ、夜明けになって、ようやく一つの山へ落ち、峰の岩に両手でしがみついた。しばらくして気を落ち着け、よく見回すと、ようやく小須弥山（しょうしゅみせん）だと分かった。悟空は長い溜息をついた。
    悟空「何てすごい女だ！　この俺を、ここまで吹き送ったのか。前にここで霊吉菩薩（れいきつぼさつ）にお願いし、黄風怪（こうふうかい）を降伏させてお師匠さまを救ってもらったのを覚えている。黄風嶺（こうふうれい）からここまでは真南へ三千余里だったが、今は西への道から回ってきたので、ここは東南の隅になる。何万里あるのか分からん。下りて霊吉菩薩に尋ね、もとの道へ帰ることにしよう。」
  "translation_status": "reviewed"
- "id": "xy-ch59-026"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正躊躇間，又聽得鐘聲響亮，急下山坡，徑至禪院。那門前道人認得行者的形容，即入裡面報道：「前年來請菩薩去降黃風怪的那個毛臉大聖又來了。」菩薩知是悟空，連忙下寶座相迎，入內施禮道：「恭喜，取經來耶？」悟空答道：「正好未到，早哩，早哩。」靈吉道：「既未曾得到雷音，何以回顧荒山？」行者道：「自上年蒙盛情降了黃風怪，一路上不知歷過多少苦楚。今到火焰山，不能前進，詢問土人，說有個鐵扇仙，芭蕉扇搧得火滅，老孫特去尋訪。原來那仙是牛魔王的妻，紅孩兒的母。他說我把他兒子做了觀音菩薩的童子，不得常見，恨我為仇，不肯借扇，與我爭鬥。他見我的棒重難撐，遂將扇子把我一搧，搧得我悠悠蕩蕩，直至於此，方才落住。故此輕造禪院，問個歸路。此處到火焰山，不知有多少里數？」靈吉笑道：「那婦人喚名羅剎女，又叫做鐵扇公主。他的那芭蕉扇本是崑崙山後，自混沌開闢以來，天地產成的一個靈寶，乃太陰之精葉，故能滅火氣。假若搧著人，要飄八萬四千里，方息陰風。我這山到火焰山，只有五萬餘里，此還是大聖有留雲之能，故止住了；若是凡人，正好不得住也。」行者道：「利害，利害！我師父卻怎生得度那方？」靈吉道：「大聖放心。此一來，也是唐僧的緣法，合教大聖成功。」行者道：「怎見成功？」靈吉道：「我當年受如來教旨，賜我一粒定風丹、一柄飛龍杖。飛龍杖已降了風魔。這定風丹尚未曾見用，如今送了大聖，管教那廝搧你不動，你卻要了扇子，搧息火，卻不就立此功也？」行者低頭作禮，感謝不盡。那菩薩即於衣袖中取出一個錦袋兒，將那一粒定風丹，與行者安在衣領裡邊，將針線緊緊縫了。送行者出門道：「不及留款。往西北上去，就是羅剎的山場也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    そう思案していると、また鐘の響きが聞こえた。急いで山の斜面を下り、まっすぐ寺へ行くと、門前の修行者は悟空の姿に見覚えがあり、中へ入って取り次いだ。
    寺の修行者「一昨年、黄風怪を降伏させていただきたいと、菩薩さまをお迎えに来た、あの毛むくじゃらの大聖（たいせい）が、またいらっしゃいました。」
    霊吉菩薩は悟空と知ると、急いで宝座を下りて迎えた。中へ入って礼をし、言った。
    霊吉菩薩「おめでとうございます。経を得てお帰りなのですか。」
    悟空「いえ、まだ着いてもおりません。まだ先です、まだ先です。」
    霊吉菩薩「まだ雷音（らいおん）へ着いていないのに、どうしてまた、この山へお越しになったのです。」
    悟空「昨年は、ご親切にも黄風怪を降伏させていただきましたが、その後も道中、どれだけ苦しんだか分かりません。今は火焔山に来て、前へ進めなくなっています。土地の人に聞くと、鉄扇仙という方が芭蕉扇で火を消せるというので、わざわざ訪ねました。ところが、その仙人は牛魔王の妻、紅孩児の母だったのです。私があの子を観音菩薩の童子にしたせいで、いつでも会えなくなったと言って、私を仇と憎み、扇を貸さずに戦いを挑んできました。私の重い棒を支えきれぬと見ると、扇で一あおぎし、私をふわふわと吹き飛ばしたのです。ここまで来て、ようやく落ち着けました。そこで、失礼ながらお寺へ押しかけ、帰り道をお尋ねしたく参りました。ここから火焔山までは、何里ほどあるのでしょう。」
    霊吉菩薩は笑った。
    霊吉菩薩「あの女性は羅刹女といい、鉄扇公主とも呼ばれます。その芭蕉扇は、崑崙山（こんろんざん）の裏で、混沌から天地が開けて以来、天地が生み成した霊宝です。太陰（たいいん）の精の葉なので、火の気を消せるのです。人があおがれれば、八万四千里も漂って、ようやく陰の風がやみます。この山から火焔山までは、五万余里しかありません。大聖には雲をとどめる力があるから、ここで止まれたのです。普通の人なら、とても止まれませんでした。」
    悟空「すさまじい、すさまじい！　お師匠さまを、どうすれば向こうへ渡せるでしょう。」
    霊吉菩薩「大聖、ご安心ください。ここへ来たのも唐僧のご縁、大聖が功を立てることになっているのです。」
    悟空「どうして功を立てられるのですか。」
    霊吉菩薩「その昔、如来（にょらい）の教えを受けたとき、私は定風丹（ていふうたん）を一粒と、飛竜杖（ひりゅうじょう）を一本授かりました。飛竜杖では、すでに風の魔物を降伏させましたが、この定風丹は、まだ使ったことがありません。今、大聖に差し上げましょう。これがあれば、あの者があおいでも、必ずあなたは動きません。そうして扇を手に入れ、火をあおぎ消せば、まさにその功を立てられるではありませんか。」
    悟空は頭を下げて礼をし、いくら感謝してもし足りない様子だった。霊吉菩薩は袖から小さな錦の袋を取り出し、その一粒の定風丹を悟空の襟の内側へ収め、針と糸でしっかり縫いつけた。悟空を門まで送って言った。
    霊吉菩薩「ゆっくりおもてなしもできません。西北へ行けば、羅刹女の山に着きます。」
  "translation_status": "reviewed"
- "id": "xy-ch59-027"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者辭了靈吉，駕觔斗雲，徑返翠雲山，頃刻而至。使鐵棒打著洞門叫道：「開門，開門！老孫來借扇子使使哩。」慌得那門裡女童即忙來報：「奶奶，借扇子的又來了。」羅剎聞言，心中悚懼道：「這潑猴真有本事。我的寶貝搧著人，要去八萬四千里，方能停止；他怎麼才吹去，就回來也？這番等我一連搧他兩三扇，教他找不著歸路。」急縱身，結束整齊，雙手提劍，走出門來道：「孫行者，你不怕我，又來尋死？」行者笑道：「嫂嫂勿得慳吝，是必借我使使，保得唐僧過山，就送還你。我是個志誠有餘的君子，不是那借物不還的小人。」羅剎又罵道：「潑猢猻！好沒道理，沒分曉。奪子之仇，尚未報得；借扇之意，豈得如心？你不要走，吃我老娘一劍。」大聖公然不懼，使鐵棒劈手相迎。他兩個往往來來，戰經五七回合，羅剎女手軟難掄，孫行者身強善敵。他見事勢不諧，即取扇子，望行者搧了一扇，行者巍然不動。行者收了鐵棒，笑吟吟的道：「這番不比那番，任你怎麼搧來，老孫若動一動，就不算漢子。」那羅剎又搧兩扇。果然不動。羅剎慌了，急收寶貝轉回，走入洞裡，將門緊緊關上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    悟空は霊吉菩薩と別れ、筋斗雲（きんとうん）に乗って、まっすぐ翠雲山へ引き返し、あっという間に着いた。鉄棒で洞の門をたたいて叫ぶ。
    悟空「開けろ、開けろ！　扇を借りに、また来たぞ。」
    門の中の娘は驚き、急いで知らせた。
    娘「奥さま、扇を借りたいと言っていた者が、また来ました。」
    羅刹女は聞いて、心ひそかに恐れた。
    羅刹女「この猿、本当に大した力だ。私の宝であおがれた者は、八万四千里行かなければ止まれない。それなのに、今吹き飛ばしたばかりで、どうして戻ってこられる。今度は続けて二、三度あおいで、帰る道も分からなくしてやろう。」
    急いで立ち上がり、身支度をきちんと整え、両手に剣を提げて門を出た。
    羅刹女「孫行者（そんぎょうじゃ）、私が怖くないのか。また死にに来たのか。」
    悟空は笑った。
    悟空「姉上、けちけちなさらず、ぜひ一度貸してください。唐僧を無事に山の向こうへ渡したら、お返しします。私は誠意あふれる君子で、借りた物を返さぬ小人ではありません。」
    羅刹女はまた罵った。
    羅刹女「ろくでなしの猿め！　まるで道理も分別もない。子を奪われた仇も、まだ討っていないのに、扇を借りたいという願いが、どうして思いどおりになるものか。逃げるな。この私の剣を食らえ。」
    悟空は少しも恐れず、鉄棒で真っ向から迎え撃った。二人は行きつ戻りつ、五、七合ほど戦った。羅刹女は腕が弱って剣を振るい難くなるが、悟空は身も強く、巧みに戦う。羅刹女は形勢が悪いと見るや、扇を取り出し、悟空めがけて一度あおいだ。悟空は山のように、びくともしない。鉄棒を収め、にこにこと言った。
    悟空「今度はさっきとは違うぞ。どれだけあおいでもいい。この俺が少しでも動いたら、男とはいえん。」
    羅刹女はさらに二度あおいだが、やはり動かない。慌てて宝をしまい、身を返して洞へ駆け込み、門をぴったり閉めた。
  "translation_status": "reviewed"
- "id": "xy-ch59-028"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見他閉了門，卻就弄個手段，拆開衣領，把定風丹噙在口中。搖身一變，變作一個蟭蟟蟲兒，從他門隙處鑽進。只見羅剎叫道：「渴了，渴了，快拿茶來。」近侍女童，即將香茶一壺，沙沙的滿斟一碗，沖起茶沫漕漕。行者見了歡喜，嚶的一翅，飛在茶沫之下。那羅剎渴極，接過茶，兩三氣都吃了。行者已到他肚腹之內，現原身，厲聲高叫道：「嫂嫂，借扇子我使使。」羅剎大驚失色，叫：「小的們，關了前門否？」俱說：「關了。」他又說：「既關了門，孫行者如何在家裡叫喚？」女童道：「在你身上叫哩。」羅剎道：「孫行者，你在那裡弄術哩？」行者道：「老孫一生不會弄術，都是些真手段，實本事，已在尊嫂尊腹之內耍子，已見其肺肝矣。我知你也饑渴了，我先送你個坐碗兒解渴。」卻就把腳往下一登。那羅剎小腹之中疼痛難禁，坐於地下叫苦。行者道：「嫂嫂休得推辭，我再送你個點心充饑。」又把頭往上一頂。那羅剎心痛難禁，只在地上打滾，疼得他面黃唇白，只叫：「孫叔叔饒命。」"
  "source_languages":
  - "zh-Hant"

    "line_end": 115
  "translation_ja": |-
    第五十九回
    唐三蔵は火焔山に行く手を阻まれ、孫行者は一度目の芭蕉扇借りに赴く
  "translation_status": "reviewed"
- "id": "xy-ch59-002"
  "section_id": "chapter-59"
  "kind": "verse"
  "origin": "source"
  "source_text": "若干種性本來同，海納無窮。千思萬慮終成妄，般般色色和融。有日功完行滿，圓明法性高隆。休教差別走西東，緊鎖牢籠。收來安放丹爐內，煉得金烏一樣紅。朗朗輝輝嬌艷，任教出入乘龍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    さまざまな種性（しゅしょう）も、もとは同じもの、海のように限りなく包み込む。
    千の思い、万の思案も、ついには妄念となる。あらゆるもの、あらゆる姿を、融け合わせよ。
    いつか功を成し、行を満たせば、円満で明らかな法性（ほっしょう）が、高く輝く。
    分け隔てに心を東西へ走らせず、牢にしっかり閉じ込めよ。
    集めて丹炉（たんろ）の中に据え、金烏（きんう）と同じ赤さに錬り上げるのだ。
    明るく、きらめき、美しく照り映えれば、出入りするにも、自在に竜に乗れる。
  "translation_status": "reviewed"
- "id": "xy-ch59-003"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表三藏遵菩薩教旨，收了行者，與八戒、沙僧剪斷二心，鎖籠猿馬，同心戮力，趕奔西天。說不盡光陰似箭，日月如梭。歷過了夏月炎天，卻又值三秋霜景。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 120
    "line_end": 120
  "translation_ja": "さて、三蔵（さんぞう）は観音菩薩（かんのんぼさつ）の教えに従って悟空（ごくう）を受け入れた。八戒（はっかい）、沙悟浄（さごじょう）とともに二心を断ち、猿のように騒ぐ心と馬のように走る意を囲いに収め、心を一つに力を合わせて西天（さいてん）へ急いだ。光陰は矢のよう、月日は機の杼のように行き交うとは、まことに言い尽くせぬ。炎暑の夏を過ぎ、また霜の降りる秋を迎えた。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch59-004"
  "section_id": "chapter-59"
  "kind": "verse"
  "origin": "source"
  "source_text": "薄雲斷絕西風緊，鶴鳴遠岫霜林錦。光景正蒼涼，山長水更長。征鴻來北塞，玄鳥歸南陌。客路怯孤單，衲衣容易寒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    薄雲は途切れ、西風は強く吹く。
    鶴は遠い峰に鳴き、霜の林は錦をまとう。
    あたりの景色はもの寂しく、
    山並みは長く、川の流れはなお長い。
    渡りの雁は北の国境から来て、
    燕は南の野道へ帰る。
    旅路では独りの心細さが身にしみ、
    継ぎはぎの僧衣には、たやすく寒さが通う。
  "translation_status": "reviewed"
- "id": "xy-ch59-005"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒四眾進前行處，漸覺熱氣蒸人。三藏勒馬道：「如今正是秋天，卻怎返有熱氣？」八戒道：「原來不知。西方路上有個斯哈哩國，乃日落之處，俗呼為天盡頭。若到申酉時，國王差人上城，擂鼓吹角，混雜海沸之聲。日乃太陽真火，落於西海之間，如火淬水，接聲滾沸。若無鼓角之聲混耳，即振殺城中小兒。此地熱氣蒸人，想必到日落之處也。」大聖聽說，忍不住笑道：「獃子莫亂談。若論斯哈哩國，正好早哩。似師父朝三暮二的這等擔閣，就從小至老，老了又小，老小三生，也還不到。」八戒道：「哥啊！據你說，不是日落之處，為何這等酷熱？」沙僧道：「想是天時不正，秋行夏令故也。」他三個正都爭講，只見那路傍有座莊院，乃是紅瓦蓋的房舍，紅磚砌的垣牆，紅油門扇，紅漆板榻，一片都是紅的。三藏下馬道：「悟空，你去那人家問個消息，看那炎熱之故何也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    師弟四人が先へ進んでいくと、次第に熱気で蒸されるようになった。三蔵は馬を止めて言った。
    三蔵「今はまさしく秋なのに、どうしてかえって熱気があるのだろう。」
    八戒「ご存じなかったんですか。西へ行く道には斯哈哩国（しかりこく）という、日が沈む国があって、俗に天の果てと呼ばれているんです。申（さる）や酉（とり）の刻になると、王が人を城壁の上へ遣わし、太鼓を打ち、角笛を吹かせて、海の煮え立つ音を紛らわせます。日は太陽の真火ですから、西海（さいかい）へ落ちると、焼いた物を水へ入れるように、音を立ててぐらぐら煮え立つんです。太鼓と角笛の音を耳に混ぜなければ、町の子供たちは、その響きで震え殺されてしまいます。ここもこんなに熱気が立ちこめているから、きっと日が沈む所まで来たんですよ。」
    悟空はそれを聞き、こらえきれずに笑った。
    悟空「間抜け、でたらめを言うな。斯哈哩国なら、まだまだ先だ。お師匠さまのように朝に三つ、夕に二つというのろのろ歩きで時間を食っていたら、子供から老人になり、老人からまた子供になって、老いたり若返ったり三生（さんしょう）を重ねても、まだ着かないぞ。」
    八戒「兄貴、日が沈む所じゃないというなら、どうしてこんなに暑いんだ。」
    沙悟浄「天候の巡りが狂って、秋なのに夏の気が働いているのでしょう。」
    三人がそう言い争っていると、道端に一軒の邸が見えた。屋根は赤い瓦、塀は赤い煉瓦、門の扉は赤い油塗り、板の腰掛けは赤い漆塗りで、何もかも赤一色だった。三蔵は馬を下りて言った。
    三蔵「悟空、あの家で事情を聞いてきなさい。なぜこれほど暑いのか、尋ねておくれ。」

  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭詞は種性・法性という仏教語と、丹炉・金烏・乗竜という仙道の語を重ねる。特定宗派の教理分類に固定せず、全句を訳した。丹を錬る描写は内面の修行の比喩として扱い、実用の修行法や医療的効能にしない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-02-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "斯哈哩国の日没と海が沸く話は八戒の説明であり、語り手の地理学的事実ではない。「朝三暮二」はのろのろ進むという趣旨で、原文にない距離単位を補わなかった。「老小三生」の三度の生涯も誇張のまま保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-03-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の珍しい表記「\U00022BCC靸䩺鞋」を保持した。教育部の異体字辞典は\U00022BCCを掰・㧳の異体とし、漢典は䩺に靴筒・綿靴の語義を挙げる。靸の履き方に関する意味も合わせ、つっかけ状の靴と解したが、複合語全体の厳密な形態・日本語読みは未確定。新旧の対句と二足ではなく一足である点を保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-04-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "火焔山は第四十回にも紅孩児の修行地として出る。本回の地名・距離・八百里の火は老人の説明のまま訳し、現実の山の規模へ換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-05-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「往回要走一月」に続く「一千四百五六十里」は往復の道のりの説明として訳した。片道の距離に書き換えず、千四百五十〜六十里ほどという概数を保つ。「花紅表裡」は祝いの花や赤絹、衣服の表地・裏地などの贈り物と解するが、各品の材質・数量は追加しない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-06-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "鉄扇仙と鉄扇公主・羅刹女が同一だという説明は、この木こりの言葉から示す。羅刹女が牛魔王の子の母であることは第四十回で既知だが、初めから鉄扇仙の語釈へ移さない。芭蕉扇は以前の太上老君の同名の宝と同一だとは示されないので、辞書上も別の道具として扱う。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-07-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "教育部辞典の「溲話」は古い話・時代遅れの話をいう。本段の木こりの助言は、古い争いを自ら認めて持ち出さないようにという趣旨で訳した。「前年」は一昨年と訳し、他回との時系列を独自に修正しない。夫の弟との水争いは第五十三回に接続するが、本文にない名をこの回の台詞へ補っていない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-08-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "蓬島と海瀛は山水を仙境に比べる表現。前者は蓬莱の島と解し、後者は海上の仙境を指すとしたが、特定の島との同一性は確定しない。「沒繡絨」は花が刺繍の敷物を埋めるほどの濃さと解した。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-09-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「毛兒女」「毛女」はここでは若い娘を示す呼称として訳し、毛深い種族や固有の妖怪名と断定しない。「藍縷」は衣のぼろをいう。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-10-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「偏綃」「龍鬚膝褲」「月婆」とする。「偏綃」は裳に添う薄絹、「龍鬚膝褲」は竜のひげにちなむ装飾の膝覆いと解したが、裁縫上の細部を確定しない。「月婆」が何を指すかは未確定で、他版の月孛や月の女神の名へ無断で置き換えていない。三寸の靴もそのまま保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-11-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「嫂嫂」は義兄の妻への呼びかけとして姉上、「老叔」は夫の義弟に当たる自称として弟分とした。実の兄妹や実の叔父への改変は避ける。紅孩児の境遇が救済だという説明は悟空の主張で、母の会えない苦しみを語り手が否定したわけではない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-12-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "男女の力関係を一般化する句は原典の語りに含まれる価値判断として訳し、削除せず、現代の事実説明や訳者の主張とも扱わない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-13-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "寺の修行者は「前年」、悟空は「上年」と述べる。訳では一昨年・昨年の差を保ち、同じ年へ直していない。八万四千里・五万余里の差は悟空の雲をとどめる力によるという、霊吉菩薩の説明を保持した。芭蕉扇の崑崙山・太陰の由来はこの説明から示し、早い注や語釈へ移していない。定風丹と飛竜杖は第二十一回に既出である。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-14-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「坐碗」は碗の飲み物などに見立てた名で、蹴り下ろして相手を座り込ませる動作、「點心」は食物名と胸を突く動作を重ねた戯れと解した。正確な料理名は確定しない。「心痛」はこの場では胸部の痛みとして訳し、現代の特定の病気へ同定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-15-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "口を三度開けさせる命令、口が開いたところで悟空が先に飛び出す動作、気づかず「連張三次」とされる羅刹女の動作を全て保持した。計三度か追加三度かを本文以上に確定しない。腰肋に穴を開けて出ることは悟空がしないと述べた脅しであり、実際の穿孔として訳さない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-16-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "火傷は両腿の毛であり、全身の毛がすべて焼けたとはしない。火を避ける印や護身術を今回は使わなかったという悟空の説明も残す。「又問」は三蔵と八戒の続く問答から三蔵の再質問と判断した。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-17-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "最初の声は未同定の声の主、姿が見えてからは老人とし、「私は火焔山の土地神」の名乗り後から土地神とする。扇を偽物と断定するのはこの発言からで、受け取った場面の地の文や注に先取りしない。"
  "translation_status": "reviewed"
- "id": "xy-ch59-note-18-body"
  "section_id": "chapter-59"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "結びの大力王に関する事情は次回へ保留される。称号を残し、後の行動・居所・関係を説明へ追加しない。"
  "translation_status": "reviewed"

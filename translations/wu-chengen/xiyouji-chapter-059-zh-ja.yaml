    "line_end": 125
  "translation_ja": "悟空は金箍棒（きんこぼう）をしまい、衣服を整え、わざとおとなしい文人めいた様子を作って、大道を外れ、まっすぐ門前へ行って中をうかがった。すると門の中から、一人の老人が出てきた。その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch59-007"
  "section_id": "chapter-59"
  "kind": "verse"
  "origin": "source"
  "source_text": "穿一領黃不黃紅不紅的葛布深衣，戴一頂青不青皂不皂的篾絲涼帽。手中拄一根彎不彎直不直暴節竹杖，足下踏一雙新不新舊不舊\U00022BCC靸䩺鞋。面似紅銅，鬚如白練。兩道壽眉遮碧眼，一張咍口露金牙。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 127
    "line_end": 127
  "translation_ja": "黄色とも赤ともつかぬ葛の布で作った深衣（しんい）を着て、\n青とも黒ともつかぬ細竹編みの涼み帽をかぶる。\n手には、曲がっているとも真っすぐともつかぬ、節くれだった竹の杖。\n足には、新しいとも古いともつかぬ一足の\U00022BCC靸䩺鞋（はいそうおうあい）。\n顔は赤銅のよう、ひげは白絹のよう。\n長寿を思わせる二筋の長眉が青い目を覆い、\nにやりと開いた口から、金色の歯がのぞく。"
  "translation_status": "reviewed"
- "id": "xy-ch59-008"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老者猛擡頭，看見行者，吃了一驚，拄著竹杖，喝道：「你是那裡來的怪人？在我這門首何幹？」行者答禮道：「老施主休怕我，我不是甚麼怪人。貧僧是東土大唐欽差上西方求經者。師徒四人，適至寶方，見天氣蒸熱，一則不解其故，二來不知地名，特拜問指教一二。」那老者卻才放心，笑云：「長老勿罪。我老漢一時眼花，不識尊顏。」行者道：「不敢。」老者又問：「令師在那條路上？」行者道：「那南首大路上立的不是？」老者教：「請來，請來。」行者歡喜，把手一招，三藏即同八戒、沙僧，牽白馬，挑行李近前，都對老者作禮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    老人はふと顔を上げ、悟空を見て驚いた。竹の杖をついて、声を荒らげた。
    老人「どこから来た怪しい人だ。うちの門前で何をしておる。」
    悟空は礼をして答えた。
    悟空「ご老人、怖がらないでください。私は怪しい者ではございません。東土（とうど）の大唐（だいとう）から勅命を受けて、西方へ経を求めに参る僧です。師弟四人で、ただ今こちらへ着いたのですが、蒸し上がるような暑さに出会いました。一つにはその訳が分からず、二つには土地の名も存じませんので、少し教えていただきたく、お訪ねしたのです。」
    老人はようやく安心して、笑った。
    老人「お坊さま、どうかお気を悪くなさらず。年寄りの目が一時かすんで、お顔を見誤りました。」
    悟空「いえ、とんでもございません。」
    老人「お師匠さまは、どちらの道におられますか。」
    悟空「南の大道に立っているのが、お分かりでしょう。」
    老人「どうぞお招きください。どうぞ。」
    悟空は喜んで手招きした。三蔵は八戒、沙悟浄とともに、白馬を引き、荷物を担いでやって来て、皆で老人に礼をした。
  "translation_status": "reviewed"
- "id": "xy-ch59-009"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老者見三藏丰姿標致，八戒、沙僧相貌奇稀，又驚又喜。只得請入裡坐，教小的們看茶，一壁廂辦飯。三藏聞言，起身稱謝道：「敢問公公：貴處遇秋，何返炎熱？」老者道：「敝地喚做火焰山，無春無秋，四季皆熱。」三藏道：「火焰山卻在那邊？可阻西去之路？」老者道：「西方卻去不得。那山離此有六十里遠，正是西方必由之路，卻有八百里火焰，四週圍寸草不生。若過得山，就是銅腦蓋，鐵身軀，也要化成汁哩。」三藏聞言，大驚失色，不敢再問。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    老人は、三蔵の姿が美しく立派なのに、八戒と沙悟浄の顔つきが世にも珍しいので、驚きもし、喜びもした。ともかく中へ招いて座らせ、家の者たちに茶を出すよう命じ、その一方で食事も支度させた。三蔵はそれを聞き、立って礼を述べた。
    三蔵「ご老人、お尋ねいたします。こちらでは秋になっても、どうしてこんなに暑いのでしょう。」
    老人「この土地は火焔山（かえんざん）と申します。春も秋もなく、一年中暑いのです。」
    三蔵「その火焔山は、どちらにあるのでしょう。西へ行く道を、塞いでおりますか。」
    老人「西へはおいでになれません。山はここから六十里（り）先で、西へ行くには必ず通らねばならぬ道にありますが、八百里にわたって炎が燃え、その周りには草一本生えません。越えようとすれば、銅の頭に鉄の体であっても、どろどろに溶けてしまいますよ。」
    三蔵はそれを聞くと、ひどく驚いて顔色を失い、それ以上は尋ねられなかった。
  "translation_status": "reviewed"
- "id": "xy-ch59-010"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見門外一個少年男子，推一輛紅車兒，住在門傍，叫聲：「賣糕。」大聖拔根毫毛，變個銅錢，問那人買糕。那人接了錢，不論好歹，揭開車兒上衣裹，熱氣騰騰，拿出一塊糕，遞與行者。行者托在手中，好似火裡燒的灼炭，煤爐內的紅釘。你看他左手倒在右手，右手換在左手，只道：「熱熱熱，難吃難吃！」那男子笑道：「怕熱，莫來這裡，這裡是這等熱。」行者道：「你這漢子好不明理。常言道：『不冷不熱，五穀不結。』他這等熱得很，你這糕粉自何而來？」那人道：「若知糕粉米，敬求鐵扇仙。」行者道：「鐵扇仙怎的？」那人道：「鐵扇仙有柄芭蕉扇，求得來，一扇息火，二扇生風，三扇下雨。我們就布種，及時收割，故得五穀養生；不然，誠寸草不能生也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    そこへ門の外に若い男が赤い荷車を押して来て、門脇に止め、呼び声を上げた。
    菓子売り「蒸し菓子はいかが。」
    悟空は毛を一本抜いて銅銭に変え、その男から菓子を買った。男は銭を受け取ると、よい銭かどうかも確かめず、荷車の覆いを開け、湯気の立つ中から菓子を一つ取り出して悟空に渡した。悟空が手のひらに載せると、火で焼いた炭の塊か、石炭炉の中の赤い釘のように熱い。見れば、左手から右手へ、右手から左手へと移し替え、ただ繰り返す。
    悟空「熱い、熱い、熱い。食えない、食えない！」
    男は笑った。
    菓子売り「熱いのが嫌なら、ここへ来てはいけませんよ。ここは、こんな暑さなんです。」
    悟空「お前も、ずいぶん物の道理が分からないな。昔から『寒さも暑さもなければ、五穀は実らぬ』と言うだろう。こんなに暑いばかりなのに、菓子にする粉はどこから来るんだ。」
    菓子売り「菓子の粉や米の由来を知りたければ、鉄扇仙（てっせんせん）に、うやうやしくお願いすることです。」
    悟空「鉄扇仙が、どうするんだ。」
    菓子売り「鉄扇仙は芭蕉扇（ばしょうせん）を一本持っています。頼んで持ってきてもらえば、一あおぎで火が消え、二あおぎで風が起こり、三あおぎで雨が降ります。そこで私たちは種をまき、時季に間に合うよう刈り入れ、五穀で暮らしを立てるのです。そうでなければ、本当に草一本も生えません。」
  "translation_status": "reviewed"
- "id": "xy-ch59-011"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，急抽身走入裡面，將糕遞與三藏道：「師父放心，且莫隔年焦著。吃了糕，我與你說。」長老接糕在手，向本宅老者道：「公公請糕。」老者道：「我家的茶飯未奉，敢吃你糕？」行者笑道：「老人家，茶飯倒不必賜，我問你：鐵扇仙在那裡住？」老者道：「你問他怎的？」行者道：「適才那賣糕人說，此仙有柄芭蕉扇。求將來，一扇息火，二扇生風，三扇下雨，你這方布種收割，才得五穀養生。我欲尋他討來搧息火燄山過去，且使這方依時收種，得安生也。」老者道：「固有此說，你們卻無禮物，恐那聖賢不肯來也。」三藏道：「他要甚禮物？」老者道：「我這裡人家，十年拜求一度。四豬四羊、花紅表裡、異香時果、雞鵝美酒，沐浴虔誠，拜到那仙山，請他出洞，至此施為。」行者道：「那山坐落何處？喚甚地名？有幾多里數？等我問他要扇子去。」老者道：「那山在西南方，名喚翠雲山。山中有一仙洞，名喚芭蕉洞。我這裡眾信人等去拜仙山，往回要走一月，計有一千四百五六十里。」行者笑道：「不打緊，就去就來。」那老者道：「且住，吃些茶飯，辦些乾糧，須得兩人做伴。那路上沒有人家，又多狼虎，非一日可到，莫當耍子。」行者笑道：「不用，不用。我去也。」說一聲，忽然不見。那老者慌張道：「爺爺呀！原來是騰雲駕霧的神人也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    悟空はそれを聞くと、急いで身を返して家へ入り、三蔵に菓子を渡して言った。
    悟空「お師匠さま、ご安心ください。まだ先のことまで気をもまないでください。菓子を召し上がったら、お話しします。」
    三蔵は菓子を受け取り、家の老人に声をかけた。
    三蔵「ご老人、お菓子をどうぞ。」
    老人「こちらの茶飯もまだ差し上げないうちから、お菓子をいただいてよいものでしょうか。」
    悟空は笑った。
    悟空「ご老人、茶飯のおもてなしには及びません。一つ伺いますが、鉄扇仙はどちらにお住まいですか。」
    老人「その方に何のご用ですか。」
    悟空「今、菓子売りが申すには、その仙人には一本の芭蕉扇があって、頼んで持ってきてもらうと、一あおぎで火が消え、二あおぎで風が起こり、三あおぎで雨が降り、それから皆さんが種をまき、刈り入れをして、五穀で暮らせるのだそうですね。私はその方を訪ねて扇を借り、火焔山の火をあおぎ消して通りたいのです。それに、この地方でも時季どおりに種まきと収穫ができて、安心して暮らせるようになります。」
    老人「確かにそういうことはございますが、あなた方は贈り物をお持ちでない。あの聖なるお方が、おいでくださらないのではありませんか。」
    三蔵「どのような贈り物が必要なのでしょうか。」
    老人「こちらの者は、十年に一度、お願いに参ります。豚四頭、羊四頭、花や赤絹、表地と裏地、珍しい香、季節の果物、鶏、鵞鳥、うまい酒をそろえ、沐浴して心を清め、仙人の山まで拝みに行くのです。そして洞穴からお出ましを願い、ここで術を施していただきます。」
    悟空「その山はどちらにあり、何という名で、何里ほど離れていますか。私が扇を借りに行きましょう。」
    老人「山は西南にあって、翠雲山（すいうんざん）と申します。山中に仙人の洞穴があり、名は芭蕉洞（ばしょうどう）。こちらの信者たちが仙山を拝みに行けば、往復で一月かかります。道のりにして千四百五、六十里ほどです。」
    悟空は笑った。
    悟空「大したことではありません。すぐ行って、戻ってきます。」
    老人「お待ちなさい。まず茶飯を召し上がり、道中の食糧も支度して、必ず二人で連れ立ってお行きなさい。途中には人家もなく、狼や虎も多い。一日では着けません。遊び半分に考えてはいけませんよ。」
    悟空は笑った。
    悟空「いりません、いりません。では、行ってきます。」
    そう言うなり、たちまち姿が消えた。老人は慌てて叫んだ。
    老人「これはたまげた！　雲に乗り、霧を駆る神人でいらしたのか。」
  "translation_status": "reviewed"
- "id": "xy-ch59-012"

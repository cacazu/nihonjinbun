  "source_text": |-
    「雲際依依認舊林，斷崖荒草路難尋。
    西山望見朝來雨，南澗歸時渡處深。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 136
    "line_end": 137
  "translation_ja": |-
    木こり「雲の際に、おぼろげながら、見慣れた林を見分ける。
    断崖に草が茂り、道は探し難い。
    西の山を望めば、朝から降る雨が見え、
    南の谷から帰るころには、渡る流れも深くなる。」

  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者近前作禮道：「樵哥，問訊了。」那樵子撇了柯斧，答禮道：「長老何往？」行者道：「敢問樵哥，這可是翠雲山？」樵子道：「正是。」行者道：「有個鐵扇仙的芭蕉洞，在何處？」樵子笑道：「這芭蕉洞雖有，卻無個鐵扇仙，只有個鐵扇公主，又名羅剎女。」行者道：「人言他有一柄芭蕉扇，能熄得火焰山，敢是他麼？」樵子道：「正是，正是。這聖賢有這件寶貝，善能熄火，保護那方人家，故此稱為鐵扇仙。我這裡人家用不著他，只知他叫做羅剎女，乃大力牛魔王妻也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    悟空は近づいて礼をした。
    悟空「木こりさん、ごあいさつ申し上げます。」
    木こりは斧を置き、礼を返した。
    木こり「お坊さま、どちらへおいでですか。」
    悟空「お尋ねしますが、ここは翠雲山でしょうか。」
    木こり「そのとおりです。」
    悟空「鉄扇仙の住む芭蕉洞というのは、どこにありますか。」
    木こりは笑った。
    木こり「芭蕉洞はありますが、鉄扇仙という方はいません。いらっしゃるのは鉄扇公主（てっせんこうしゅ）、別名は羅刹女（らせつにょ）という方です。」
    悟空「一本の芭蕉扇を持っていて、火焔山の火を消せると聞きました。その方ではありませんか。」
    木こり「そうです、そうです。あの聖なる方は、その宝で見事に火を消し、あちらの人々を守っておられるので、鉄扇仙と呼ばれます。こちらの者はご厄介になりませんから、羅刹女という名だけを知っているのです。大力牛魔王（だいりきぎゅうまおう）の奥方ですよ。」
  "translation_status": "reviewed"
- "id": "xy-ch59-015"
  "section_id": "chapter-59"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，大驚失色，心中暗想道：「又是冤家了。當年伏了紅孩兒，說是這廝養的。前在那解陽山破兒洞遇他叔子，尚且不肯與水，要作報仇之意；今又遇他父母，怎生借得這扇子耶？」樵子見行者沉思默慮，嗟嘆不已，便笑道：「長老，你出家人，有何憂疑？這條小路兒向東去，不尚五六里，就是芭蕉洞，休得心焦。」行者道：「不瞞樵哥說，我是東土唐朝差往西天求經的唐僧大徒弟，前年在火雲洞，曾與羅剎之子紅孩兒有些言語，但恐羅剎懷仇不與，故生憂疑。」樵子道：「大丈夫鑒貌辨色，只以求扇為名，莫認往時之溲話，管情借得。」行者聞言，深深唱個大喏道：「謝樵哥教誨，我去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch59-1455608"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第059回&oldid=1455608"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    悟空はそれを聞き、ひどく驚いて顔色を変え、心の中で考えた。
    悟空の心の声「また仇の間柄か。あのとき降伏させた紅孩児（こうがいじ）は、この女が産んだと聞いた。先には解陽山（かいようざん）の破児洞（はじどう）で、その夫の弟に会ったが、仇を討つつもりで水さえよこさなかった。今度はまた、あの子の父母に出会うとは。どうすれば扇を借りられるだろう。」
    木こりは、悟空が考え込んで溜息ばかりつくのを見て、笑った。
    木こり「お坊さま、出家の方が、何をそんなに心配なさるのです。この細道を東へ行けば、五、六里もせぬうちに芭蕉洞です。気をもむことはありません。」
    悟空「木こりさん、隠さず申します。私は東土の唐朝（とうちょう）から遣わされ、西天へ経を求めに行く唐僧（とうそう）の一番弟子です。一昨年、火雲洞（かうんどう）で羅刹女の子の紅孩児と、少し言い争いをしましてね。羅刹女が恨みを抱き、扇を貸してくれないのではないかと、心配しているのです。」
    木こり「一人前の男なら、相手の顔つきや様子を見て、ただ扇を借りたいと言えばよいのです。昔の古い話を自分から認めて持ち出さなければ、きっと借りられますよ。」
    悟空はそれを聞き、深々と礼をして言った。
    悟空「お教え、ありがとうございます。では、参ります。」
  "translation_status": "reviewed"
- "id": "xy-ch59-016"

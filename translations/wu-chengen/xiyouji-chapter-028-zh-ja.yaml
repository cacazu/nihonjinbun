    "line_start": 181
    "line_end": 181
  "translation_ja": "三蔵がさらに進んで塔の門に着くと、中には斑竹（はんちく）の簾が一枚下がっていた。門をまたいで入り、簾を持ち上げ、そのまま中へ進んで、ふと顔を上げた。石の寝台に、一匹の妖魔が横向きに寝ているではないか。どのような姿だったか。"
  "translation_status": "reviewed"
- "id": "xy-ch28-026"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": "青靛臉，白獠牙，一張大口呀呀。兩邊亂蓬蓬的鬢毛，卻都是些胭脂染色；三四紫巍巍的髭髯，恍疑是那荔枝排芽。鸚嘴般的鼻兒拱拱，曙星樣的眼兒巴巴。兩個拳頭，和尚缽盂模樣；二隻藍腳，懸崖榾柮枒槎。斜披著淡黃袍帳，賽過那織錦袈裟。拿的一口刀，精光耀映；眠的一塊石，細潤無瑕。他也曾小妖排蟻陣，他也曾老怪坐蜂衙。你看他威風凜凜，大家吆喝，叫一聲爺。他也曾月作三人壺酌酒，他也曾風生兩腋盞傾茶。你看他神通浩浩，霎著下眼，遊遍天涯。荒林喧鳥雀，深莽宿龍蛇。仙子種田生白玉，道人伏火養丹砂。小小洞門，雖到不得那阿鼻地獄；楞楞妖怪，卻就是一個牛頭夜叉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 182
    "line_end": 182
  "translation_ja": "藍色の顔、白い牙、大口をあんぐりと開く。左右にもじゃもじゃした鬢は、みな紅で染めた色。紫がかった口髭や顎髭が三、四房、ライチの芽が並ぶかと見える。鼻は鸚鵡の嘴のように突き出し、目は明けの星のようにぎょろりと大きい。二つの拳は僧の鉢ほど、二本の青い足は崖の切り株や節くれだった枝のよう。淡い黄色の袍を斜めにはおり、錦織りの袈裟にも勝る。手にする刀は鋭く光り、寝床の石は肌理が細かく、なめらかで傷もない。小妖を蟻のような陣に並べたこともあり、群れの中心に、蜂の役所の主のように座したこともある。威風堂々たるさまに、皆は声をそろえて「大王さま」とたたえる。月と影を相手に三人となって壺の酒を酌み、両脇に風の生ずる心地で茶碗を傾けたこともある。神通は広大で、まばたきの間に天の果てまで遊び回る。荒れた林では鳥や雀が騒ぎ、深い草むらには竜や蛇が宿る。仙人は畑に白玉を生やし、道士は火を制して丹砂（たんしゃ）を養う。この小さな洞の門は阿鼻地獄（あびじごく）ほどではなくとも、この荒々しい妖怪は、まさしく牛頭の夜叉（やしゃ）さながらだ。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「月作三人」は月と影を加えて三人とする詩的表現と解した。「風生兩腋」は茶により身が軽くなる仙境の感覚と解した。白玉を育てる仙人、丹砂を養う道士は詩の比喩であり、妖怪の後の正体を断定する材料にしない。"
- "id": "xy-ch28-027"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老看見他這般模樣，諕得打了一個倒退，遍體酥麻，兩腿酸軟，即忙的抽身便走。剛剛轉了一個身，那妖魔他的靈性著實是強，大撐開著一雙金睛鬼眼，叫聲：「小的們，你看門外是甚麼人？」一個小妖就伸頭望門外一看，看見是個光頭的長老，連忙跑將進去報道：「大王，外面是個和尚哩。團頭大面，兩耳垂肩；嫩刮刮的一身肉，細嬌嬌的一張皮：且是好個和尚。」那妖聞言，啊聲笑道：「這叫做個『蛇頭上蒼蠅，自來的衣食』。你眾小的們，疾忙趕上去，與我拿將來，我這裡重重有賞。」那些小妖就是一窩蜂，齊齊擁上。三藏見了，雖則是一心忙似箭，兩腳走如飛，終是心驚膽顫，腿軟腳麻；況且是山路崎嶇，林深日暮，步兒那裡移得動：被那些小妖平擡將去。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    三蔵はその姿を見て、恐怖に一歩後ずさった。全身がしびれ、両脚が力を失い、急いで身を引いて逃げだした。ちょうど体を翻したとき、ひどく勘の鋭い妖怪が、金色に光る鬼の目を大きく開き、声を上げた。
    妖怪「お前たち、門の外に何者がいるか見てこい。」
    一匹の小妖が頭を伸ばして外を見ると、頭を剃った僧がいた。すぐに走って戻り、報告した。
    小妖「大王、外に和尚がおります。丸い頭に大きな顔、両耳は肩まで垂れています。全身の肉は柔らかそうで、皮は細やかでなめらか。まことに上等な和尚です。」
    妖怪は聞くと、ああ、と笑った。
    妖怪「これが『蛇の頭に止まる蠅、衣食のほうからやって来る』というやつだ。皆、早く追いかけ、捕らえてこい。たっぷり褒美をやるぞ。」
    小妖たちは蜂の群れのように、一斉に押し寄せた。三蔵は見て、一刻も早くと矢のように気が急き、飛ぶように走ろうとしたが、やはり肝がつぶれ、脚はなえ、足はしびれる。まして険しい山道、深い林に日も暮れ、どうして足を運べよう。小妖たちに横向きに担ぎ上げられてしまった。まさに。
  "translation_status": "reviewed"
- "id": "xy-ch28-028"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    龍遊淺水遭蝦戲，虎落平原被犬欺。
    縱然好事多磨障，誰像唐僧西向時？
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 185
    "line_end": 186
  "translation_ja": |-
    竜も浅瀬に出れば蝦にからかわれ、虎も平原へ下りれば犬に侮られる。
    よいことには妨げが多いというが、西へ向かう三蔵ほどの者があろうか。
  "translation_status": "reviewed"
- "id": "xy-ch28-029"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那眾小妖擡得長老，放在那竹簾兒外，歡歡喜喜報聲道：「大王，拿得和尚進來了。」那老妖他也偷眼瞧一瞧，只見三藏頭直上，貌堂堂，果然好一個和尚。他便心中想道：「這等好和尚，必是上方人物，不當小可的。若不做個威風，他怎肯服降哩？」陡然間，就狐假虎威，紅鬚倒豎，血髮朝天，眼睛迸裂，大喝一聲道：「帶那和尚進來！」眾妖們大家響響的答應了一聲：「是！」就把三藏望裡面只是一推。這是「既在矮檐下，怎敢不低頭。」三藏只得雙手合著，與他見個禮。那妖道：「你是那裡和尚？從那裡來？到那裡去？快快說明！」三藏道：「我本是唐朝僧人，奉大唐皇帝敕命，前往西方訪求經偈，經過貴山，特來塔下謁聖，不期驚動威嚴，望乞恕罪。待往西方取得經回東土，永註高名也。」那妖聞言，呵呵大笑道：「我說是上邦人物，果然是你。正要吃你哩，卻來的甚好，甚好，不然，卻不錯放過了？你該是我口內的食，自然要撞將來，就放也放不去，就走也走不脫！」叫小妖：「把那和尚拿去綁了。」果然那些小妖一擁上前，把個長老繩纏索綁，縛在那定魂樁上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    小妖たちは三蔵を担いで竹簾の外へ置き、喜び勇んで報告した。
    小妖たち「大王、和尚を捕らえてまいりました。」
    妖怪は横目でちらりと見ると、三蔵の頭はすっと高く、容貌は堂々とし、まことに立派な僧だった。心の中で考えた。
    妖怪（心中）「これほど立派な僧なら、きっと上国の者だ。並の相手として扱えぬ。威勢を見せなければ、どうしておとなしく従うものか。」
    急に虎の威を借る狐のように威張り、赤い髭を逆立て、血の色の髪を天へ突き上げ、目をかっと見開いて大喝した。
    妖怪「その和尚を連れてこい！」
    小妖たち「はい！」
    一同が大きく返事をし、三蔵を中へ押し込んだ。これこそ「低い軒の下にいれば、頭を下げないわけにはいかぬ」である。三蔵は仕方なく両手を合わせ、礼をした。
    妖怪「どこの和尚だ。どこから来て、どこへ行く。さっさと明かせ！」
    三蔵「私は唐の僧です。大唐（だいとう）の皇帝の勅命を受け、西方（さいほう）へ経典や偈を求めております。こちらの山を通りかかり、塔で聖なるものを拝もうと参りました。思いがけずご威光をお騒がせしました。どうかお許しください。西方で経を頂いて東土へ戻りましたら、あなたのお名前を永く書き留めましょう。」
    妖怪は聞いて、からからと大笑いした。
    妖怪「上国の者と思えば、やはりお前か。ちょうど食ってやろうと思っていた。よく来た、よく来た。それを知らねば、うっかり逃がすところだった。お前は俺の口に入る食い物と決まっているから、自分からぶつかってきたのだ。放してやろうとしても放せず、逃げようとしても逃げられんぞ。」
    妖怪「その和尚を連れていき、縛れ。」
    小妖たちは一斉に進み寄り、三蔵を縄でぐるぐる巻きにして、定魂樁（ていこんしょう）へ縛りつけた。
  "translation_status": "reviewed"
- "id": "xy-ch28-030"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老妖持刀又問道：「和尚，你一行有幾個？終不然一人敢上西天？」三藏見他持刀，又老實說道：「大王，我有兩個徒弟，叫做豬八戒、沙和尚，都出松林化齋去了。還有一擔行李，一匹白馬，都在松林裡放著哩。」老妖道：「又造化了。兩個徒弟，連你三個，連馬四個，夠吃一頓了。」小妖道：「我們去捉他來。」老妖道：「不要出去，把前門關了。他兩個化齋來，一定尋師父吃；尋不著，一定尋著我門上。常言道：『上門的買賣好做。』且等慢慢的捉他。」眾小妖把前門閉了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 188
    "line_end": 188
  "translation_ja": |-
    妖怪は刀を持ち、さらに尋ねた。
    妖怪「和尚、お前たちは何人連れだ。まさか一人で西天へ行こうというのではあるまいな。」
    三蔵は刀を見ると、また正直に答えた。
    三蔵「大王、弟子が二人おります。猪八戒（ちょはっかい）と沙和尚（さおしょう）といい、どちらも松林を出て、食事をもらいに行っています。荷物一担と白馬一頭も、松林へ置いてあります。」
    妖怪「またついているぞ。弟子が二人、お前と合わせて三人、馬を入れれば四つ。一食分には十分だ。」
    小妖「私たちが捕まえてきましょう。」
    妖怪「外へは出るな。表の門を閉めろ。二人は飯をもらって戻れば、師を捜して食べさせようとする。見つからなければ、きっとここの門まで捜しに来る。『向こうから来る商売はしやすい』というではないか。ゆっくり待って捕まえよう。」
    小妖たちは表の門を閉じた。
  "translation_status": "reviewed"
- "id": "xy-ch28-031"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言三藏逢災。卻說那沙僧出林找八戒，直有十餘里遠近，不曾見個莊村。他卻站在高埠上正然觀看，只聽得草中有人言語，急使杖撥開深草看時，原來是獃子在裡面說夢話哩。被沙僧揪著耳朵，方叫醒了。道：「好獃子啊！師父教你化齋，許你在此睡覺的？」那獃子冒冒失失的醒來道：「兄弟，有甚時候了？」沙僧道：「快起來，師父說有齋沒齋也罷，教你我那裡尋下住處哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    三蔵の災難はいったん置く。沙悟浄は林を出て八戒を捜し、十余里ほど進んだが、村も集落も見つからなかった。高い丘に立って見渡していると、草の中から人の声が聞こえた。急いで杖で深い草をかき分けると、中で八戒が寝言を言っていた。沙悟浄はその耳をつかんで引っ張り、ようやく目を覚まさせた。
    沙悟浄「たいした間抜けだ。お師匠さまが托鉢に行けと言ったのは、ここで寝てよいということだったのか。」
    八戒は慌てて目を覚ました。
    八戒「兄弟、今は何時だ。」
    沙悟浄「早く起きてください。お師匠さまは、飯があってもなくてもよいから、二人で泊まる所を探せとおっしゃっています。」
  "translation_status": "reviewed"
- "id": "xy-ch28-032"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "獃子懵懵懂懂的托著缽盂，拑著釘鈀，與沙僧徑直回來。到林中看時，不見了師父。沙僧埋怨道：「都是你這獃子化齋不來，必有妖精拿師父也。」八戒笑道：「兄弟，莫要胡說。那林子裡是個清雅的去處，決然沒有妖精。想是老和尚坐不住，往那裡觀風去了。我們尋他去來。」二人只得牽馬挑擔，收拾了斗篷、錫杖，出松林尋找師父。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    八戒はまだぼんやりしながら、鉢を手に、熊手を抱え、沙悟浄とまっすぐ戻った。林に着いて見ると、師の姿がない。沙悟浄が責めた。
    沙悟浄「みんな、兄貴が飯をもらいに行ったきり戻らなかったせいだ。きっと妖怪がお師匠さまをさらったんですよ。」
    八戒は笑った。
    八戒「兄弟、でたらめを言うな。あの林は静かで風情のある所だ。妖怪などいるわけがない。年寄り和尚がじっと座っていられず、どこかへ景色を見に行ったんだろう。捜しに行こう。」
    二人は仕方なく馬を引き、荷物を担ぎ、外套と錫杖を取りまとめ、松林を出て師を捜した。

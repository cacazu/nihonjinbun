  "source_text": "長老獨坐林中，十分悶倦，只得強打精神，跳將起來，把行李攢在一處，將馬拴在樹上。取下戴的斗笠，插定了錫杖，整一整緇衣，徐步幽林，權為散悶。那長老看遍了野草山花，聽不得歸巢鳥噪。原來那林子內都是些草深路小的去處，只因他情思紊亂，卻走錯了。他一來也是要散散悶，二來也是要尋八戒、沙僧。不期他兩個走的是直西路，長老轉了一會，卻走向南邊去了。出得松林，忽擡頭，見那壁廂金光閃爍，彩氣騰騰。仔細看處，原來是一座寶塔，金頂放光。這是那西落的日色，映著那金頂放亮。他道：「我弟子卻沒緣法哩。自離東土，發願逢廟燒香，見佛拜佛，遇塔掃塔。那放光的不是一座黃金寶塔？怎麼就不曾走那條路？塔下必有寺院，院內必有僧家，且等我走走。這行李、白馬，料此處無人行走，卻也無事。那裡若有方便處，待徒弟們來，一同借歇。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    三蔵は独り林に座り、ひどく退屈して疲れも感じたので、無理に元気を出して立ち上がった。荷物を一か所へまとめ、馬を木につなぎ、かぶっていた笠を取り、錫杖（しゃくじょう）を突き立てた。黒い僧衣を整え、気晴らしに、静かな林の中をゆっくり歩いた。野の草や山の花をあれこれ眺めたものの、巣へ帰る鳥の騒がしい声には耐えられなかった。林の中は草が深く、道の狭い所ばかりで、気が乱れていた三蔵は道を間違えた。気晴らしだけでなく、八戒や沙悟浄を捜すつもりでもあったのだが、二人は真西へ進んだのに、三蔵はひと巡りするうち、南へ向かってしまった。松林を出てふと顔を上げると、向こうに金色の光がきらめき、彩雲のような気が立ち上っていた。よく見れば宝塔で、その金の頂が輝いている。西へ沈む夕日が金の屋根に映って光っていたのである。三蔵は言った。
    三蔵「私の弟子たちは、よい縁に恵まれなかったようだ。東土（とうど）を出てから、廟に会えば香を焚き、仏を見れば礼拝し、塔に会えば掃除をすると誓った。あの光るものは、黄金の宝塔ではないか。どうしてあちらの道を通らなかったのだろう。塔の下にはきっと寺があり、寺には必ず僧がいる。ひとまず行ってみよう。荷物と白馬は、ここを通る人もいないだろうから、心配あるまい。あちらに都合のよい所があれば、弟子たちを待ち、一緒に泊めてもらおう。」
  "translation_status": "reviewed"

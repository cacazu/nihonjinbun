  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖正當悲切，只聽得那芳草坡前，曼荊凹內，響一聲，跳出七八個小猴，一擁上前，圍住叩頭。高叫道：「大聖爺爺，今日來家了？」美猴王道：「你們因何不耍不頑，一個個都潛蹤隱跡？我來多時了，不見你們形影，何也？」群猴聽說，一個個垂淚告道：「自大聖擒拿上界，我們被獵人之苦，著實難捱。怎禁他硬弩強弓，黃鷹劣犬，網扣槍鉤，故此各惜性命，不敢出頭頑耍，只是深潛洞府，遠避窩巢。饑去坡前偷草食，渴來澗下吸清泉。卻才聽得大聖爺爺聲音，特來接見，伏望扶持。」那大聖聞得此言，愈加悽慘。便問：「你們還有多少在此山上？」群猴道：「老者小者，只有千把。」大聖道：「我當時共有四萬七千群妖，如今都往那裡去了？」群猴道：「自從爺爺去後，這山被二郎菩薩點上火，燒殺了大半。我們蹲在井裡，鑽在澗內，藏於鐵板橋下，得了性命。及至火滅煙消出來時，又沒花果養贍，難以存活，別處又去了一半。我們這一半，捱苦的住在山中。這兩年，又被些打獵的搶了一半去也。」行者道：「他搶你去何幹？」群猴道：「說起這獵戶，可恨！他把我們中箭著槍的，中毒打死的，拿了去剝皮剔骨，醬煮醋蒸，油煎鹽炒，當做下飯食用。或有那遭網的，遇扣的，夾活兒拿去了，教他跳圈做戲，翻觔斗，豎蜻蜓，當街上篩鑼擂鼓，無所不為的頑耍。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    悟空が悲しんでいると、草の茂る坂の前、蔓や荊の生えた谷間で、物音がした。七、八匹の小猿が跳び出し、一斉に進み寄って悟空を囲み、頭を地につけて大声を上げた。
    小猿たち「大聖（たいせい）さま、今日お帰りになったのですか。」
    悟空「どうしてお前たちは遊ばず、一匹残らず身を隠している。俺が来てからしばらくたつのに、誰の姿も見えなかった。なぜだ。」
    小猿たちはそれを聞き、皆涙を流して訴えた。
    小猿たち「大聖さまが天界へ捕らえられて以来、私たちは猟師に苦しめられ、とても耐えきれません。強い弩や弓、鷹や猛犬、網や罠、槍や鉤に、どうして抵抗できましょう。皆が命を惜しみ、外へ出て遊ぶこともできず、洞の奥深くに潜み、巣からも遠くへ避難しています。腹が減れば坂へ出てそっと草を食べ、喉が渇けば谷で清水を吸うのです。さきほど大聖さまのお声が聞こえたので、お迎えに来ました。どうか私たちをお守りください。」
    悟空は聞いて、なおさら悲しんだ。
    悟空「この山には、まだ何匹残っている。」
    小猿たち「年寄りも子供も合わせて、千匹ほどしかおりません。」
    悟空「昔は四万七千の妖たちがいた。それが今、皆どこへ行ったんだ。」
    小猿たち「大聖さまが去られたあと、二郎菩薩（じろうぼさつ）が山に火をつけ、大半を焼き殺しました。私たちは井戸にうずくまり、谷間へ潜り、鉄板橋の下へ隠れて命を助けました。火が消え煙が収まって外へ出ると、食べる花も果物もなく、生きることが難しくなり、また半分がよそへ去りました。残った私たち半分は、苦しみに耐えて山で暮らしていましたが、この二年で、そのまた半分が猟師にさらわれてしまったのです。」
    悟空「さらって何をするんだ。」
    小猿たち「あの猟師たちのことを思うと、憎くてなりません。矢や槍に当たり、毒を受けたり打たれたりして死んだ仲間を持ち去り、皮を剥ぎ骨を抜き、味噌で煮たり酢で蒸したり、油で焼いたり塩で炒めたりして、おかずにするのです。網や罠にかかって生け捕りにされた仲間には、輪くぐりや芝居、宙返り、逆立ちを仕込み、往来で銅鑼や太鼓を鳴らして、ありとあらゆる芸をさせています。」
  "translation_status": "reviewed"
- "id": "xy-ch28-007"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖聞此言，更十分惱怒道：「洞中有甚麼人執事？」群妖道：「還有馬、流二元帥，崩、芭二將軍管著哩。」大聖道：「你們去報他知道，說我來了。」那些小妖，撞入門內報道：「大聖爺爺來家了。」那馬、流、奔、芭聞報，忙出門叩頭，迎接進洞。大聖坐在中間，群怪羅拜於前，啟道：「大聖爺爺，近聞得你得了性命，保唐僧往西天取經，如何不走西方，卻回本山？」大聖道：「小的們，你不知道，那唐三藏不識賢愚：我為他一路上捉怪擒魔，使盡了平生的手段，幾番家打殺妖精；他說我行兇作惡，不要我做徒弟，把我逐趕回來，寫立貶書為照，永不聽用了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    悟空は聞くと、いっそう激しく怒った。
    悟空「洞の中を取り仕切っているのは誰だ。」
    小猿たち「まだ馬元帥（ばげんすい）と流元帥（りゅうげんすい）、崩将軍（ほうしょうぐん）と芭将軍（はしょうぐん）がおります。」
    悟空「俺が帰ったと知らせてこい。」
    小猿たちは門の中へ駆け込み、報告した。
    小猿たち「大聖さまがお帰りになったぞ！」
    馬元帥・流元帥・崩将軍・芭将軍はそれを聞くと、急いで門を出て頭を下げ、悟空を洞へ迎え入れた。悟空が中央に座ると、妖たちは前に並んで拝礼し、申し上げた。
    妖たち「大聖さま、近ごろ命を救われ、唐（とう）の僧を守って西天（さいてん）へ経を取りに行かれたと聞きました。どうして西へ進まず、この山へお戻りなのですか。」
    悟空「お前たちは知らないだろうが、あの唐三蔵（とうさんぞう）は、賢い者と愚かな者の区別もつかない。俺はあいつのために、旅の途中ずっと妖怪や魔物を捕らえ、一生の腕前を使い尽くし、何度も妖怪を打ち殺してやった。それなのに、凶暴な悪事をしていると言って、弟子から外し、追い帰したのだ。証しに破門状まで書き、二度と使わぬという。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "同じ四健将の列挙で「崩」と「奔」が交替する。訳文は既知の崩将軍に統一し、別人を増やさない。原文の字形は保持した。"
- "id": "xy-ch28-008"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾猴鼓掌大笑道：「造化，造化。做甚麼和尚，且家來，帶攜我們耍子幾年罷。」叫：「快安排椰子酒來，與爺爺接風。」大聖道：「且莫飲酒，我問你那打獵的人，幾時來我山上一度？」馬、流道：「大聖，不論甚麼時度，他逐日家在這裡纏擾。」大聖道：「他怎麼今日不來？」馬、流道：「看待來耶。」大聖吩咐：「小的們，都出去把那山上燒酥了的碎石頭與我搬將起來堆著。或二三十個一推，或五六十個一堆堆著，我有用處。」那些小猴都是一窩峰，一個個亂搬了許多堆集。大聖看了，教：「小的們，都往洞內藏躲，讓老孫作法。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    猿たちは手をたたいて大笑いした。
    猿たち「ありがたい、ありがたい！　僧などになって何になります。ひとまずお帰りになり、私たちを連れて何年か遊んでください。」
    猿たち「早く椰子酒（やしざけ）を用意し、大聖さまをお迎えしよう！」
    悟空「酒はまだよい。聞くが、あの猟師どもは、どのくらいの間隔でこの山へ来る。」
    馬元帥と流元帥「大聖さま、刻限など決まっておりません。毎日ここへ来て、しつこく荒らすのです。」
    悟空「なぜ今日は来ない。」
    馬元帥と流元帥「もうじき来るでしょう。」
    悟空「皆、外へ出て、山にある焼けてもろくなった砕け石を運び集めろ。二、三十個ずつでも、五、六十個ずつでもよいから、山に積んでおけ。俺に使い道がある。」
    小猿たちは蜂の群れのように飛び出し、めいめい石を運んでは、あちこちへ山と積んだ。悟空はそれを見て命じた。
    悟空「皆、洞の中へ隠れろ。俺が術を使う。」
  "translation_status": "reviewed"
- "id": "xy-ch28-009"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖上了山巔看處，只見那南半邊鼕鼕鼓響，噹噹鑼鳴，閃上有千餘人馬，都架著鷹犬，持著刀槍。猴王仔細看那些人來得兇險，好男子，真個驍勇。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 146
    "line_end": 146
  "translation_ja": "悟空が山頂へ登って見ると、南の方からドンドンと太鼓、ガンガンと銅鑼が鳴り、千余りの人馬が現れた。皆、鷹を据え犬を連れ、刀や槍を持っている。悟空がよく見れば、いかにも恐ろしい勢いで迫る者たちだった。堂々とした男たちで、まことに勇猛である。その様子は。"
  "translation_status": "reviewed"
- "id": "xy-ch28-010"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    狐皮蓋肩頂，錦綺裹腰胸。
    袋插狼牙箭，胯掛寶雕弓。
    人似搜山虎，馬如跳澗龍。
    成群引著犬，滿膀架其鷹。
    荊筐擡火炮，帶定海東青。
    粘竿百十擔，兔叉有千根。
    牛頭攔路網，閻王扣子繩。
    一齊亂吆喝，散撒滿天星。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 148
    "line_end": 155
  "translation_ja": |-
    狐の毛皮で肩や頭を覆い、錦や綾で腰と胸を包む。
    矢袋には狼牙箭（ろうがせん）を差し、腰には立派な彫り弓を掛ける。
    人は山を捜す虎のよう、馬は谷を跳ぶ竜のよう。
    犬を群れで引き連れ、腕いっぱいに鷹を据える。
    荊の籠で火砲を担ぎ、海東青（かいとうせい）も連れている。
    鳥黐（とりもち）の竿は百余荷、兎を突く叉は千本。
    牛頭（ごず）のように道をふさぐ網、閻王（えんおう）のように命を取る罠の縄。
    皆いっせいに叫び立て、満天の星のように四方へ散った。
  "translation_status": "reviewed"
- "id": "xy-ch28-011"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖見那些人佈上他的山來，心中大怒，手裡捻訣，口內念念有詞，往那巽地上吸了一口氣，呼的吹將去，便是一陣狂風。好風！但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 157
    "line_end": 157
  "translation_ja": "悟空は、猟師たちが自分の山に広がってくるのを見ると、激しく怒った。手で印を結び、口の中で呪文を唱え、巽（たつみ）の方へ向けて息を吸い、ふうっと吹き出した。するとひとしきりの烈風が起こった。すさまじい風である。"
  "translation_status": "reviewed"
- "id": "xy-ch28-012"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": "揚塵播土，倒樹摧林。海浪如山聳，渾波萬疊侵。乾坤昏蕩蕩，日月暗沉沉。一陣搖松如虎嘯，忽然入竹似龍吟。萬竅怒號天噫氣，飛砂走石亂傷人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 159
    "line_end": 159
  "translation_ja": "塵を巻き上げ土を散らし、木を倒し林を砕く。海の波は山のようにそびえ、濁ったうねりは万重に押し寄せる。天地は暗く揺れ、日も月も沈んだように光を失う。ひと吹き松を揺らせば虎の吠え声、たちまち竹へ入れば竜のうなり。あらゆる穴が怒号を上げ、天は息を吐き、飛ぶ砂と走る石が人を打ち傷つける。"
  "translation_status": "reviewed"
- "id": "xy-ch28-013"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖作起這大風，將那碎石，乘風亂飛亂舞。可憐把那些千餘人馬，一個個："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 161
    "line_end": 161
  "translation_ja": "悟空はこの大風を起こし、砕け石を風に乗せ、乱れ飛ばせた。哀れ、千余りの人馬は、一つまた一つと。"
  "translation_status": "reviewed"
- "id": "xy-ch28-014"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": "石打烏頭粉碎，沙飛海馬俱傷。人參官桂嶺前忙，血染朱砂地上。附子難歸故里，檳榔怎得還鄉。屍骸輕粉臥山場，紅娘子家中盼望。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 163
    "line_end": 163
  "translation_ja": "石に黒い頭、烏頭（うず）は粉々、飛ぶ砂に馬たち、海馬（かいば）もことごとく傷つく。人参（にんじん）・官桂（かんけい）、峰の前では人々が慌てふためき、血は地上を朱砂（しゅしゃ）の赤に染める。附子（ぶし）、父も子も故里へ帰れず、檳榔（びんろう）、夫もどうして故郷へ戻れよう。屍は軽粉（けいふん）のように砕けて山に横たわり、紅娘子（こうじょうし）、妻たちは家で帰りを待ちわびる。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "烏頭・海馬・人参・官桂・朱砂・附子・檳榔・軽粉・紅娘子の九つの薬名を織り込む詞。薬名と犠牲となった人馬の描写をともに残し、附子／父子などの掛詞を日本語で補った。人参・官桂の句の細かな掛詞、および檳榔に重なる人間関係の読みは推定を含む。医療上の効能を示すものではない。"
- "id": "xy-ch28-015"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 165
    "line_end": 165
  "translation_ja": "詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch28-016"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    人亡馬死怎歸家，野鬼孤魂亂似麻。
    可憐抖擻英雄將，不辨賢愚血染沙。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 167
    "line_end": 168
  "translation_ja": |-
    人は亡び馬は死に、どうして家へ帰れよう。野にさまよう孤独な魂は、麻のように乱れる。
    哀れ、勇ましく奮い立って来た男たちは、賢愚の区別もなく、その血で砂を染めた。
  "translation_status": "reviewed"
- "id": "xy-ch28-017"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖按落雲頭，鼓掌大笑道：「造化，造化。自從歸順唐僧，做了和尚，他每每勸我話道：『千日行善，善猶不足；一日行惡，惡自有餘。』真有此話。我跟著他，打殺幾個妖精，他就怪我行兇。今日來家，卻結果了這許多獵戶。」叫：「小的們，出來！」那群猴狂風過去，聽得大聖呼喚，一個個跳將出來。大聖道：「你們去南山下，把那打死的獵戶衣服剝得來家，洗淨血跡，穿了遮寒；把死人的屍首都推在那萬丈深潭內；把死倒的馬拖將來，剝了皮，做靴穿，將肉醃著，慢慢的食用；把那些弓箭槍刀，與你們操演武藝；將那雜色旗號，收來我用。」群猴一個個領諾。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    悟空は雲を下ろし、手をたたいて大笑いした。
    悟空「ついている、ついている！　三蔵に従い、僧になってから、あいつはいつもこう諭したものだ。『千日善を行っても、善はなお足りない。一日悪を行えば、悪はあり余る。』なるほど、まったくそのとおりだ。俺がついて歩き、妖怪を何匹か殺しただけで、凶暴だと責めた。今日は故郷へ帰り、こんなに大勢の猟師を片づけてやったぞ。」
    悟空「皆、出てこい！」
    大風が過ぎ、悟空の呼び声を聞くと、猿たちはめいめい跳び出してきた。
    悟空「南の山の麓へ行き、死んだ猟師どもの着物を剥いで持ち帰れ。血を洗い落とし、寒さをしのぐために着るんだ。人の死体は皆、あの万丈もある深い淵へ突き落とせ。死んだ馬は引きずってきて皮を剥ぎ、靴にしろ。肉は塩漬けにして、少しずつ食べればよい。弓矢や槍や刀は、お前たちが武芸を習うのに使え。色とりどりの旗は集めてこい。俺が使う。」
    猿たちは一匹ずつ承知した。
  "translation_status": "reviewed"
- "id": "xy-ch28-018"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖把旗拆洗，總鬥做一面雜彩花旗，上寫著「重修花果山，復整水簾洞，齊天大聖」十四字。豎起杆子，將旗掛於洞外。逐日招魔聚獸，積草屯糧，不題「和尚」二字。他的人情又大，手段又高，便去四海龍王借些甘霖仙水，把山洗青了。前栽榆柳，後種松柟，桃李棗梅，無所不備。逍遙自在，樂業安居不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 171
    "line_end": 171
  "translation_ja": "悟空は旗をほどいて洗い、一つにつぎ合わせて、色鮮やかな大旗を作った。その上に「重修花果山、復整水簾洞（すいれんどう）、斉天大聖（せいてんたいせい）」の十四字、すなわち花果山を修復し、水簾洞を再び整える斉天大聖と書いた。竿を立て、旗を洞の外へ掲げた。それからは日々、魔物を招き獣を集め、まぐさと食糧を蓄え、「和尚」の二文字は口にしなかった。顔が利き、腕も立つ悟空は、四海の竜王（しかいのりゅうおう）の所へ行って恵みの仙雨を借り、山を洗って青々とよみがえらせた。前には楡（にれ）や柳、後ろには松や楠を植え、桃・李・棗・梅、ないものはなくなった。気ままに暮らし、なりわいを楽しみ、安らかに住んだ。ひとまずこの話は置こう。"
  "translation_status": "reviewed"
- "id": "xy-ch28-019"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說唐僧聽信狡性，縱放心猿，攀鞍上馬。八戒前邊開路，沙僧挑著行李西行。過了白虎嶺，忽見一帶林坵，真個是藤攀葛繞，柏翠松青。三藏叫道：「徒弟呀，山路崎嶇，甚是難走，卻又松林叢簇，樹木森羅，切須仔細，恐有妖邪妖獸。」你看那獃子抖擻精神，叫沙僧帶著馬，他使釘鈀開路，領唐僧徑入松林之內。正行處，那長老兜住馬道：「八戒，我這一日其實饑了，那裡尋些齋飯我吃？」八戒道：「師父請下馬，在此等老豬去尋。」長老下了馬，沙僧歇了擔，取出缽盂，遞與八戒。八戒道：「我去也。」長老問：「那裡去？」八戒道：「莫管，我這一去，鑽冰取火尋齋至，壓雪求油化飯來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    さて三蔵は、ずるい八戒（はっかい）の言葉を信じ、心猿（しんえん）である悟空を放してしまうと、鞍につかまって馬に乗った。八戒が前で道を開き、沙悟浄（さごじょう）が荷物を担いで、西へ進んだ。白虎嶺（びゃっこれい）を越えると、林の続く丘が現れた。藤や葛が絡み、柏は翠、松は青く茂っている。
    三蔵「弟子たち、山道は険しく、たいへん歩きにくい。そのうえ松林が密生して、木々が重なり合っている。妖怪や魔獣がいるかもしれないから、くれぐれも用心しておくれ。」
    八戒は元気を奮い立たせ、沙悟浄に馬を引かせ、自分は熊手で道を切り開いて、三蔵を松林へ導いた。進むうち、三蔵が馬を止めた。
    三蔵「八戒、今日は本当に腹が減った。どこかで食べるものを探してくれないか。」
    八戒「お師匠さま、馬を下りてここでお待ちください。俺が探しに行きます。」
    三蔵が馬を下り、沙悟浄が荷を置き、鉢を取り出して八戒へ渡した。
    八戒「では行ってきます。」
    三蔵「どこへ行くのだ。」
    八戒「お任せください。氷に穴をあけて火を取るようなことをしてでも食事を探し、雪を搾って油を取るようなことをしてでも飯をもらってきますよ。」
  "translation_status": "reviewed"
- "id": "xy-ch28-020"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他出了松林，往西行經十餘里，更不曾撞著一個人家，真是有狼虎無人煙的去處。那獃子走得辛苦，心內沉吟道：「當年行者在日，老和尚要的就有；今日輪到我的身上，誠所謂『當家才知柴米價，養子方曉父娘恩』。公道沒去化處。」卻又走得瞌睡上來，思道：「我若就回去，對老和尚說沒處化齋，他也不信我走了這許多路。須是再多幌個時辰，才好去回話。也罷，也罷，且往這草科裡睡睡。」獃子就把頭拱在草裡睡下。當時也只說朦朧朦朧就起來，豈知走路辛苦的人，丟倒頭，只管齁齁睡起。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    八戒は松林を出て、西へ十余里も歩いたが、人家一つ見つからなかった。まさに狼や虎ばかりで、人の気配のない所だった。歩き疲れ、心の中で考えた。
    八戒（心中）「悟空がいたころは、年寄り和尚が欲しがれば何でもあった。今日になって俺の番が回ってくると、まさに『家を切り盛りして初めて薪や米の値が分かり、子を育てて初めて父母の恩を知る』だ。どう見ても、もらえる場所がないじゃないか。」
    そのうち歩きながら眠くなり、また考えた。
    八戒（心中）「今戻って、托鉢する所がないと言っても、年寄り和尚は、こんなに遠くまで来たとは信じまい。もうしばらく時間をつぶしてからでなければ、戻って話しにくい。よし、よし、この草むらで少し寝よう。」
    八戒は頭を草へ突っ込んで横になった。ちょっとうとうとしたら起きるつもりだったが、歩いて疲れた者のこと、頭を落とすと、ただぐうぐう眠り続けた。
  "translation_status": "reviewed"
- "id": "xy-ch28-021"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言八戒在此睡覺。卻說長老在那林間耳熱眼跳，身心不安。急回叫沙僧道：「悟能去化齋，怎麼這早晚還不回？」沙僧道：「師父，你還不曉得哩。他見這西方上人家齋僧的多，他肚子又大，他管你？直等他吃飽了才來哩。」三藏道：「正是呀，倘或他在那裡貪著吃齋，我們那裡會他？天色晚了，此間不是個住處，須要尋個下處方好哩。」沙僧道：「不打緊，師父，你且坐在這裡，等我去尋他來。」三藏道：「正是，正是。有齋沒齋罷了，只是尋下處要緊。」沙僧綽了寶杖，徑出松林來找八戒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    ここで眠る八戒の話はいったん置く。三蔵は林の中で耳が熱くなり、まぶたがぴくぴくして、心も体も落ち着かなかった。急いで振り返り、沙悟浄に尋ねた。
    三蔵「悟能（ごのう）は食事をもらいに行ったが、なぜこんな時刻まで戻らないのだ。」
    沙悟浄「お師匠さまは、まだあの人のことがお分かりでないのですね。西方には僧へ食事を施す家が多いと知っているうえ、あの大食らいです。お師匠さまのことなどかまうものですか。自分が満腹になるまで戻りませんよ。」
    三蔵「なるほど。もしどこかで食事に夢中になっているなら、私たちはどうやって会えばよいのだ。日も暮れる。ここは泊まる場所ではないから、宿を探さなければならない。」
    沙悟浄「大丈夫です。お師匠さまはここに座っていてください。私が捜してきます。」
    三蔵「そうしてくれ。食事があってもなくてもかまわぬ。宿を探すのが先決だ。」
    沙悟浄は宝杖（ほうじょう）を取り、まっすぐ松林を出て、八戒を捜しに行った。

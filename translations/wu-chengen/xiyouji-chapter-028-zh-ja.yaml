- "id": "xy-ch28-033"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一回，也是唐僧不該死。他兩個尋一會不見，忽見那正南下有金光閃灼，八戒道：「兄弟啊，有福的只是有福，你看師父往他家去了。那放光的是座寶塔，誰敢怠慢？一定要安排齋飯，留他在那裡受用。我們還不走動些，也趕上去吃些齋兒。」沙僧道：「哥啊，定不得吉兇哩，我們且去看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    このときも、三蔵はまだ死ぬ定めではなかった。二人がしばらく捜しても見つからずにいると、ふと真南に金色の光がきらめいた。
    八戒「兄弟、福のある者にはやっぱり福がある。見ろ、お師匠さまはあそこへ行ったんだ。あの光るものは宝塔だぞ。誰が粗末に扱うものか。きっと食事を用意し、引きとめてご馳走しているんだ。俺たちも早く行き、飯にありつこう。」
    沙悟浄「兄貴、よいことか悪いことか、まだ分かりません。ひとまず見に行きましょう。」
  "translation_status": "reviewed"

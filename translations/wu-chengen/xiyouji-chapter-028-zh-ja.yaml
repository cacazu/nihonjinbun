    "status": "open"
    "message_ja": "「臺座上、長明明白粉」は白粉の指示物が明らかでない。台座の上の明るい白い粉として字面を保持し、漆喰や灯明などへ確定しない。「水流雲竇月無根」も景の比喩として原像を残した。"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人雄糾糾的到了門前：「呀！閉著門哩。」只見那門上橫安了一塊白玉石板，上鐫著六個大字：「碗子山波月洞」。沙僧道：「哥啊，這不是甚麼寺院，是一座妖精洞府也。我師父在這裡，也見不得哩。」八戒道：「兄弟莫怕。你且拴下馬匹，守著行李，待我問他的信看。」那獃子舉著鈀，上前高叫：「開門！開門！」那洞內有把門的小妖開了門忽見他兩個的模樣，急抽身，跑入裡面報道：「大王，買賣來了。」老妖道：「那裡買賣？」小妖道：「洞門外有一個長嘴大耳的和尚，與一個晦氣色的和尚，來叫門了。」老妖大喜道：「是豬八戒與沙僧尋將來也。噫，他也會尋哩，怎麼就尋到我這門上？既然嘴臉兇頑，卻莫要怠慢了他。」叫：「取披掛來。」小妖擡來，就結束了，綽刀在手，徑出門來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 194
    "line_end": 194
  "translation_ja": |-
    二人は勇ましく門前へやって来た。
    八戒と沙悟浄「あれ、門が閉まっているぞ。」
    見ると、門の上には白玉の石板が横に据えられ、「碗子山（わんしざん）波月洞（はげつどう）」の六つの大字が彫ってあった。
    沙悟浄「兄貴、ここは寺などではありません。妖怪の洞です。お師匠さまが中におられても、会わせてもらえそうにありません。」
    八戒「兄弟、怖がるな。ひとまず馬をつなぎ、荷物を守っていろ。俺が消息を聞いてみる。」
    八戒は熊手を上げて前へ進み、大声を張り上げた。
    八戒「開けろ！　開けろ！」
    中にいた門番の小妖が門を開け、二人の姿を見ると、すぐ身を翻して奥へ走り込み、報告した。
    門番の小妖「大王、商売がやって来ました。」
    妖怪「どこに商売だ。」
    門番の小妖「洞の門の外で、口が長く耳の大きい和尚と、顔色の悪い和尚が、門を開けろと呼んでおります。」
    妖怪は大喜びした。
    妖怪「猪八戒と沙悟浄が捜しに来たのだ。ほう、あいつらもなかなか捜すのがうまい。どうしてすぐここまで来られたのだ。顔つきが凶悪そうなら、こちらも軽く扱ってはならぬ。」
    妖怪「鎧兜を持て。」
    小妖が運んでくると、身支度を整え、刀を手に、まっすぐ門を出た。
  "translation_status": "reviewed"
- "id": "xy-ch28-035"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那八戒、沙僧在門前正等，只見妖魔來得兇險。你道他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 196
    "line_end": 196
  "translation_ja": "八戒と沙悟浄が門前で待っていると、妖魔が恐ろしい勢いで出てきた。どんな身なりかというと。"
  "translation_status": "reviewed"
- "id": "xy-ch28-036"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    青臉紅鬚赤髮飄，黃金鎧甲亮光饒。
    裹肚襯腰磲石帶，攀胸勒甲步雲絛。
    閑立山前風吼吼，悶遊海外浪滔滔。
    一雙藍靛焦觔手，執定追魂取命刀。
    要知此物名和姓，聲揚二字喚黃袍。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 198
    "line_end": 202
  "translation_ja": |-
    青い顔に紅の髭、赤髪はなびき、黄金の鎧は輝きを満たす。
    腹と腰を包む磲石（きょせき）の帯、胸を巡って鎧を締める歩雲絛（ほうんとう）。
    山の前にたたずめば風はごうごう、気晴らしに海の外へ出れば波はとうとう。
    藍色の筋張った両手には、魂を追い命を奪う刀を握る。
    この者の名は何というのか、響き渡る二文字の名は黄袍（こうほう）。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「磲石」は硨磲に類する宝飾材と解するが、底本の語形を「磲石」として保った。「步雲絛」は雲を歩む名を持つ組紐として訳したが、具体的な形状・機能は独立確認を要する。"
- "id": "xy-ch28-037"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那黃袍老怪出得門來，便問：「你是那方和尚，在我門首吆喝？」八戒道：「我兒子，你不認得？我是你老爺。我是大唐差往西天去的。我師父是那御弟三藏。若在你家內，趁早送出來，省了我釘鈀築進去。」那怪笑道：「是是是，有一個唐僧在我家，我也不曾怠慢他，安排些人肉包兒與他吃哩。你們也進去吃一個兒，何如？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 203
    "line_end": 203
  "translation_ja": |-
    黄袍怪（こうほうかい）は門を出ると、尋ねた。
    黄袍怪「どこの和尚だ。俺の門先で何をわめく。」
    八戒「こら息子、分からぬか。俺はお前の親父さまだ。大唐から西天へ遣わされ、師は皇帝の御弟（ぎょてい）、三蔵という。お前の家にいるなら、さっさと返せ。熊手を打ち込まれずに済むぞ。」
    黄袍怪は笑った。
    黄袍怪「そうだ、そうだ。唐の僧なら一人、うちにいる。粗末にはしておらんぞ。人肉の饅頭を用意して食わせている。お前たちも中へ入り、一つ食っていかないか。」
  "translation_status": "reviewed"
- "id": "xy-ch28-038"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這獃子認真就要進去。沙僧一把扯住道：「哥啊，他哄你哩，你幾時又吃人肉哩？」獃子卻才省悟，掣釘鈀，望妖怪劈臉就築；那怪物側身躲過，使鋼刀急架相迎。兩個都顯神通，縱雲頭，跳在空中廝殺。沙僧撇了行李、白馬，舉寶杖，急急幫攻。此時兩個狠和尚，一個潑妖魔，在雲端裡，這一場好殺。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 205
    "line_end": 205
  "translation_ja": |-
    八戒は本気で中へ入ろうとした。沙悟浄は腕をつかんで引きとめた。
    沙悟浄「兄貴、だまされているんですよ。いつからまた人肉を食べるようになったんですか。」
    八戒はようやく気がつき、熊手を取り出して妖怪の顔めがけて打ち込んだ。黄袍怪は身をかわし、鋼の刀で素早く受け止めた。二人はともに神通を現し、雲に乗って空へ跳び上がり、戦った。沙悟浄も荷物と白馬を置き、宝杖を上げて、急いで加勢した。二人の勇猛な僧と一匹の荒々しい妖魔が、雲の上で繰り広げる激闘。そのさまは。
  "translation_status": "reviewed"
- "id": "xy-ch28-039"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": "杖起刀迎，鈀來刀架。一員魔將施威，兩個神僧顯化。九齒鈀真個英雄，降妖杖誠然兇咤。沒前後左右齊來，那黃袍公然不怕。你看他蘸鋼刀晃亮如銀，其實的那神通也為廣大。只殺得滿空中霧遶雲迷，半山裡崖崩嶺咋。一個為聲名，怎肯干休；一個為師父，斷然不怕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 207
    "line_end": 207
  "translation_ja": "杖が上がれば刀が迎え、熊手が来れば刀が受ける。一人の魔将が威を振るい、二人の神僧が変化を見せる。九歯鈀（きゅうしは）はまことに勇ましく、降妖杖（ごうようじょう）も恐ろしく猛々しい。前後左右を構わず一斉に攻めても、黄袍怪は平然と恐れない。その焼き入れした鋼の刀は銀のようにきらめき、神通も実に広大だ。戦いのため空いっぱいに霧がまとわり、雲が迷い、山の中腹では崖が崩れ、嶺が裂ける。一方は名声のため、どうして引き下がれよう。一方は師のため、決して恐れはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch28-040"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他三個在半空中往往來來，戰經數十回合，不分勝負。各因性命要緊，其實難解難分。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 209
    "line_end": 209
  "translation_ja": "三人は空中を往来し、数十合戦っても勝敗がつかなかった。誰にとっても命が大切で、まことに離れるにも離れられぬ激戦となった。"
  "translation_status": "reviewed"
- "id": "xy-ch28-041"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎救唐僧，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 211
    "line_end": 211
  "translation_ja": "さて、どうすれば三蔵を救い出せるのか。それは次回のお話で。"
  "translation_status": "reviewed"

    花果山に妖たちが義を結んで集い、黒松林で三蔵は魔に遭う
  "translation_status": "reviewed"
- "id": "xy-ch28-002"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那大聖雖被唐僧逐趕，然猶思念感嘆不已，早望見東洋大海，道：「我不走此路者，已五百年矣！」只見那海水："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、悟空（ごくう）は三蔵（さんぞう）に追い払われたとはいえ、それでも師を思い、ため息がやまなかった。やがて東の大海を望み、口にした。
    悟空「この道を通らなくなって、もう五百年か。」
    海の水を見れば。
  "translation_status": "reviewed"
- "id": "xy-ch28-003"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": "煙波蕩蕩，巨浪悠悠。煙波蕩蕩接天河，巨浪悠悠通地脈。潮來洶湧，水浸灣環。潮來洶湧，猶如霹靂吼三春；水浸灣環，卻似狂風吹九夏。乘龍福老，往來必定皺眉行；跨鶴仙童，反覆果然憂慮過。近岸無村社，傍水少漁舟。浪捲千年雪，風生六月秋。野禽憑出沒，沙鳥任沉浮。眼前無釣客，耳畔只聞鷗。海底遊魚樂，天邊過雁愁。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 123
    "line_end": 123
  "translation_ja": "霞む波は広々と揺れ、大波ははるかにうねる。霞む波は天の川（あまのがわ）へと連なり、大波は大地の脈へと通じる。押し寄せる潮は激しく、水は入り江を巡って満ちる。潮の勢いは春の三か月に鳴り響く雷のよう、水の巡るさまは夏の九十日に吹く烈風のよう。竜に乗る福徳の仙翁も、往来するには眉をひそめ、鶴にまたがる仙童も、行き来するたび気をもむ。岸近くに村はなく、水辺に漁船もまれだ。波は千年の雪のような白さを巻き上げ、風は六月に秋の涼しさを生む。野の鳥は自由に現れ隠れ、砂浜の鳥は思いのままに浮き沈みする。目の前に釣り人はなく、耳にはただ鴎の声。海底の魚は楽しげに泳ぎ、空の果てを渡る雁は愁いを帯びる。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「福老」は竜に乗る福徳の老仙と解した。福星の神格そのものと確定する資料は未確認で、固有名として断定しない。三春・九夏はそれぞれ春の三か月・夏の九十日の意味として訳した。"
- "id": "xy-ch28-004"
  "section_id": "chapter-28"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者將身一縱，跳過了東洋大海，早至花果山。按落雲頭，睜睛觀看，那山上花草俱無，煙霞盡絕；峰巖倒塌，林樹焦枯。你道怎麼這等？只因他鬧了天宮，拿上界去，此山被顯聖二郎神率領那梅山七弟兄，放火燒壞了。這大聖倍加悽慘。有一篇敗山頹景的古風為證。古風云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 125
    "line_end": 125
  "translation_ja": "悟空は身を躍らせ、ひと跳びで東の大海を越え、早くも花果山（かかざん）に着いた。雲を下ろして目を凝らすと、山には花も草もなく、煙る霞も絶え果て、峰も岩も崩れ、林の木々は焼け枯れていた。どうしてこのようになったのか。悟空が天宮で騒ぎを起こして天界へ捕らえられたあと、顕聖二郎神（けんせいじろうしん）こと二郎真君（じろうしんくん）が梅山の七兄弟（ばいざんのしちきょうだい）を率い、この山へ火を放って焼き払ったからである。悟空の悲しみはいよいよ深まった。この荒れ果てた山の景色を詠む一篇の古風（こふう）が、その証しとなる。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は二郎神が率いた一団を「梅山七弟兄」とする。第六回の六兄弟との数え方の違いは無断で六に直さず、七兄弟のまま訳した。"
- "id": "xy-ch28-005"
  "section_id": "chapter-28"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    回顧仙山兩淚垂，對山悽慘更傷悲。
    當時只道山無損，今日方知地有虧。
    可恨二郎將我滅，堪嗔小聖把人欺。
    行兇掘你先靈墓，無干破爾祖墳基。
    滿天霞霧皆消蕩，遍地風雲盡散稀。
    東嶺不聞斑虎嘯，西山那見白猿啼。
    北谿狐兔無蹤跡，南谷獐𤜱沒影遺。
    青石燒成千塊土，碧砂化作一堆泥。
    洞外喬松皆倚倒，崖前翠柏盡稀少。
    椿杉槐檜栗檀焦，桃杏李梅梨棗了。
    柘絕桑無怎養蠶？柳稀竹少難棲鳥。
    峰頭巧石化為塵，澗底泉乾都是草。
    崖前土黑沒芝蘭，路畔泥紅藤薜攀。
    往日飛禽飛那處？當時走獸走何山？
    豹嫌蟒惡傾頹所，鶴避蛇回敗壞間。
    想是日前行惡念，致令目下受艱難。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 126
    "line_end": 141
  "translation_ja": |-
    仙山を振り返れば両眼から涙が落ち、山に向かえば悲しみはいっそう募る。
    あのときは山に損ないなどないと思っていたが、今日初めて、この地の傷みを知った。
    憎いのは俺を滅ぼした二郎（じろう）、腹立たしいのは人を侮ったあの小聖（しょうせい）だ。
    俺がお前の祖霊の墓を荒らし、わけもなく祖先の墓を壊しでもしたというのか。
    空いっぱいの霞と霧は消え去り、大地を覆う風雲もすっかり散った。
    東の嶺には斑虎の吠え声もなく、西の山には白猿の鳴く姿もない。
    北の谷に狐や兎の跡はなく、南の沢に獐（しょう）や雌の猪の影もない。
    青い石は焼け砕けて千の土塊となり、碧の砂はただ一堆の泥と化した。
    洞の外の高い松はみな倒れかかり、崖の前の翠の柏（はく）も乏しくなった。
    香椿（ちゃんちん）・杉・槐（えんじゅ）・檜・栗・檀（だん）は焦げ、桃・杏・李・梅・梨・棗も尽きた。
    柘（しゃ）が絶え桑がなければ、どうして蚕を養える。柳もまれで竹も少なく、鳥もすみにくい。
    峰の頂の奇岩は塵となり、谷底の泉は干上がって草ばかり。
    崖の前の土は黒く、芝蘭（しらん）もなく、道端の赤い泥には藤やつる草が絡む。
    昔の鳥はどこへ飛び去り、あのころの獣はどの山へ走ったのか。
    豹もうわばみもこの荒廃を嫌い、鶴は避け、蛇は引き返す。
    思えばかつて悪い心を起こしたために、今この苦しみを受けるのだろう。

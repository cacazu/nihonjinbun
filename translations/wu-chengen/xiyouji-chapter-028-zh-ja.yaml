  "source_text": "石崖高萬丈，山大接青霄。根連地厚，峰插天高。兩邊雜樹數千棵，前後藤纏百餘里。花映草梢風有影，水流雲竇月無根。倒木橫擔深澗，枯藤結掛光峰。石橋下，流滾滾清泉；臺座上，長明明白粉。遠觀一似三島天堂，近看有如蓬萊勝境。香松紫竹遶山溪，鴉鵲猿猴穿峻嶺。洞門外，有一來一往的走獸成行；樹林裡，有或出或入的飛禽作隊。青青香草秀，艷艷野花開。這所在分明是惡境，那長老晦氣撞將來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第028回&oldid=1455577"
    "line_start": 179
    "line_end": 179
  "translation_ja": "石の崖は万丈も高く、大山は青い空に届く。根は厚い大地につながり、峰は高い天を突く。両側には幾千本の雑木、前後には百余里にわたって藤蔓が絡む。花が草の先に映れば風にも影があり、雲のかかる岩穴を水が流れれば月にも根はない。倒れ木は深い谷を横切り、枯れ藤は裸の峰に結びついて垂れる。石橋の下には清泉がとうとうと流れ、台座の上には白い粉が明るく照り映える。遠くからは三島（さんとう）の天国のよう、近くからは蓬莱（ほうらい）の美景のよう。香る松と紫の竹が山の流れを囲み、烏・鵲・猿が険しい尾根を通り抜ける。洞門の外では獣が列をなして往来し、林の中では鳥が群れを組んで出入りする。青々と香草が伸び、色鮮やかに野の花が咲く。明らかに恐ろしい境地なのに、三蔵は不運にも足を踏み入れてしまった。"
  "translation_status": "reviewed"
  "issues":

  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-003"
    "description_ja": "「福老」は竜に乗る福徳の老仙と解した。福星の神格そのものと確定する資料は未確認で、固有名として断定しない。三春・九夏はそれぞれ春の三か月・夏の九十日の意味として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-004"
    "description_ja": "底本は二郎神が率いた一団を「梅山七弟兄」とする。第六回の六兄弟との数え方の違いは無断で六に直さず、七兄弟のまま訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-005"
    "description_ja": "「行兇掘你先靈墓、無干破爾祖墳基」は主語と語気が明示されない難句。悟空が二郎に、祖先の墓を荒らしでもしたのかと抗議する反語として訳した。墓の破壊を別の確定事件として創作しない。別解の余地があり、独立校訂が必要。 「獐\U00024731」の\U00024731は豝の異体字で、康熙字典・説文解字を照合した第27回と同じく雌の猪と訳した。樹名の椿は日本のツバキでなく中国の香椿として訳し、檀などの細かい現生種は確定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-007"
    "description_ja": "同じ四健将の列挙で「崩」と「奔」が交替する。訳文は既知の崩将軍に統一し、別人を増やさない。原文の字形は保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-014"
    "description_ja": "烏頭・海馬・人参・官桂・朱砂・附子・檳榔・軽粉・紅娘子の九つの薬名を織り込む詞。薬名と犠牲となった人馬の描写をともに残し、附子／父子などの掛詞を日本語で補った。人参・官桂の句の細かな掛詞、および檳榔に重なる人間関係の読みは推定を含む。医療上の効能を示すものではない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-024"
    "description_ja": "「臺座上、長明明白粉」は白粉の指示物が明らかでない。台座の上の明るい白い粉として字面を保持し、漆喰や灯明などへ確定しない。「水流雲竇月無根」も景の比喩として原像を残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-026"
    "description_ja": "「月作三人」は月と影を加えて三人とする詩的表現と解した。「風生兩腋」は茶により身が軽くなる仙境の感覚と解した。白玉を育てる仙人、丹砂を養う道士は詩の比喩であり、妖怪の後の正体を断定する材料にしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-032"
    "description_ja": "三蔵が外した物は先に「斗笠」、弟子たちが回収する物はここで「斗篷」となっている。原文の違いを残し、それぞれ笠・外套と訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch28-1455577"
    "segment_ids":
    - "xy-ch28-036"
    "description_ja": "「磲石」は硨磲に類する宝飾材と解するが、底本の語形を「磲石」として保った。「步雲絛」は雲を歩む名を持つ組紐として訳したが、具体的な形状・機能は独立確認を要する。 本文の欠落ではなく解釈・校訂上の留保。"

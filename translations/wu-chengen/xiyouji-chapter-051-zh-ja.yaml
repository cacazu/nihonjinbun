    第五十一回
    心の猿は千の策をむなしく用い、水も火も効かず、魔物を練り伏せられず
  "translation_status": "reviewed"
- "id": "xy-ch51-002"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說齊天大聖空著手敗了陣，來坐於金兜本作“⿰山兜”，Unicode缺字山後，撲梭梭兩眼滴淚，叫道：「師父啊，指望和你："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    さて、斉天大聖（せいてんたいせい）こと悟空（ごくう）は、手ぶらで戦に敗れ、金兜山（きんとうざん）の裏手まで来て腰を下ろした。両目からぼろぼろ涙を落とし、声を上げた。
    悟空「お師匠さま、あなたとこうしていけるものと願っていたのに。」
  "translation_status": "reviewed"
- "id": "xy-ch51-003"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    佛恩有德有和融，同幼同生意莫窮。
    同住同修同解脫，同慈同念顯靈功。
    同緣同相心真契，同見同知道轉通。
    豈料如今無主杖，空拳赤腳怎興隆！
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 120
    "line_end": 123
  "translation_ja": |-
    仏の恩に徳あり、心は和らぎ融け合い、幼き時も生もともにして、思いは尽きぬ。
    ともに住み、ともに修め、ともに解脱し、ともに慈しみ、ともに念じて霊妙な力を現す。
    縁も姿もともにして、心は真にかない、見方も知ることもともにして、道は通い合う。
    それなのに今、頼みの杖を失うとは。素手に裸足で、どうして道を栄えさせられよう！
  "translation_status": "reviewed"
- "id": "xy-ch51-004"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖悽慘多時，心中暗想道：「那妖精認得我，我記得他在陣上誇獎道：『真個是鬧天宮之類！』這等啊，決不是凡間怪物，定然是天上兇星，想因思凡下界。又不知是那裡降下來魔頭，且須上界去查勘查勘。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    悟空は長いこと悲嘆に暮れたが、心の中で考えた。
    悟空の心の声「あの妖怪は俺を知っていた。戦場で『さすがに天宮（てんきゅう）で暴れたやつだけのことはある！』と褒めていたのを覚えている。となれば、下界のただの化け物じゃない。きっと天上の凶星が、人の世を恋しがって降りてきたんだろう。だが、どこから降りた魔物か分からない。まず天上へ行って、調べてみなきゃならん。」
  "translation_status": "reviewed"
- "id": "xy-ch51-005"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者這才是以心問心，自張自主，急翻身，縱起祥雲，直至南天門外。忽擡頭見廣目天王，當面迎著長揖道：「大聖何往？」行者道：「有事要見玉帝。你在此何幹？」廣目道：「今日輪該巡視南天門。」說未了，又見那馬、趙、溫、關四大元帥作禮道：「大聖，失迎。請待茶。」行者道：「有事哩。」遂辭了廣目並四元帥，徑入南天門裡，直至靈霄殿外，果又見張道陵、葛仙翁、許旌陽、丘弘濟四天師，並南斗六司、北斗七元，都在殿前迎著行者，一齊起手道：「大聖如何到此？」又問：「保唐僧之功完否？」行者道：「早哩，早哩，路遙魔廣，才有一半之功。見如今阻住在金兜本作“⿰山兜”，Unicode缺字山金兜本作“⿰山兜”，Unicode缺字洞。有一個兕怪，把唐師父拿於洞裡，是老孫尋上門與他交戰一場，那廝神通廣大，把老孫的金箍棒搶去了，因此難縛魔王。疑是上界那個兇星思凡下界，又不知是那裡降來的魔頭，老孫因此來尋尋玉帝，問他個鉗束不嚴。」許旌陽笑道：「這猴頭還是如此放刁。」行者道：「不是放刁，我老孫一生是這口兒緊些，才尋的著個頭兒。」張道陵道：「不消多說，只與他傳報便了。」行者道：「多謝，多謝。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    これぞ自分の心に問い、自分で考え、自分で決めるというもの。悟空はすばやく身を翻し、めでたい雲に乗って、まっすぐ南天門（なんてんもん）の外へ向かった。ふと顔を上げると、広目天王（こうもくてんのう）が目の前に来て、深く手を組んで礼をした。
    広目天王「大聖（たいせい）、どちらへお出かけですか。」
    悟空「玉帝（ぎょくてい）に会う用がある。あんたはここで何をしてる。」
    広目天王「今日は南天門を見回る当番なのです。」
    話が終わらぬうちに、馬（ば）・趙（ちょう）・温（おん）・関（かん）の四元帥も来て礼をした。
    四元帥「大聖、お迎えもできず失礼しました。お茶をどうぞ。」
    悟空「急ぎの用があるんだ。」
    悟空は広目天王と四元帥に別れを告げ、南天門に入り、霊霄殿（れいしょうでん）の前へ直行した。すると今度は張道陵（ちょうどうりょう）・葛仙翁（かっせんおう）・許旌陽（きょせいよう）・丘弘済（きゅうこうさい）の四天師（してんし）、それに南斗六司（なんとろくし）と北斗七元（ほくとしちげん）が、殿の前で悟空を迎え、そろって手を上げて礼をした。
    四天師と星の神々「大聖、どうしてこちらへお越しに。」
    四天師と星の神々「唐僧（とうそう）をお守りするお役目は、もう果たされたのですか。」
    悟空「まだまだ、道は遠いし、魔物も多い。やっと半分といったところだ。今は金兜山の金兜洞（きんとうどう）で足止めを食っている。兕（じ）の妖怪がいて、唐の師匠を洞へ捕らえてしまった。俺が押しかけて一戦交えたんだが、やつは神通力が大したもので、俺の金箍棒（きんこぼう）を奪いやがった。それで捕まえられないんだ。天上の凶星の誰かが人の世に心を引かれ、下界へ降りたんじゃないかと疑っている。どこから来た魔物か分からんから、玉帝を捜して、取り締まりが甘いじゃないかと問いただしに来たのさ。」
    許旌陽は笑った。
    許旌陽「この猿め、相変わらず強引なことを言う。」
    悟空「強引なんじゃない。この俺は昔から口だけは引き下がらないから、やっと物事の糸口をつかめるんだ。」
    張道陵「もうよかろう。来訪をお取り次ぎしてやればよい。」
    悟空「ありがたい、ありがたい。」
  "translation_status": "reviewed"
- "id": "xy-ch51-006"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時四天師傳奏靈霄，引見玉陛。行者朝上唱個大喏道：「老官兒，累你，累你。我老孫保護唐僧往西天取經，一路凶多吉少，也不消說。於今來在金兜本作“⿰山兜”，Unicode缺字山，金兜本作“⿰山兜”，Unicode缺字洞，有一兕怪，把唐僧拿在洞裡，不知是要蒸，要煮，要晒。是老孫尋上他門，與他交戰，那怪卻就有些認得老孫，卓是神通廣大，把老孫的金箍棒搶去，因此難縛妖魔。疑是上天兇星，思凡下界，為此老孫特來啟奏。伏乞天尊垂慈洞鑒，降旨查勘兇星，發兵收剿妖魔，老孫不勝戰慄屏營之至。」卻又打個深躬道：「以聞。」傍有葛仙翁笑道：「猴子是何前倨後恭？」行者道：「不敢，不敢。不是甚前倨後恭，老孫於今是沒棒弄了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    四天師は霊霄殿へ取り次ぎ、悟空を玉座の前へ案内した。悟空は上に向かって、声高に挨拶した。
    悟空「お偉いご老人、ご面倒をかけるね、ご面倒をかけるね。俺は唐僧を守って西天（さいてん）へ経を取りに行くところだが、道中は災いばかりで、いいことは少ない。そいつはもう言うまでもないだろう。今度、金兜山の金兜洞へ来たところ、兕の妖怪が唐僧を洞の中へ捕らえてしまったんだ。蒸すつもりか、煮るつもりか、干すつもりかは知らん。俺が門まで押しかけて戦うと、やつは俺のことを少し知っている様子だった。実に大した神通力で、俺の金箍棒を奪ってしまい、妖魔を捕らえられなくなった。天上の凶星が人の世に心を引かれて降りたのではないかと疑い、このたび、特に奏上に参った次第。伏してお願い申し上げます。天尊（てんそん）、どうか慈悲を垂れて事情をお見通しになり、凶星の調査をお命じくださり、兵を出して妖魔を討ち取ってくださいませ。私は恐れおののき、かしこまるばかりでございます。」
    さらに深々と腰を折った。
    悟空「以上、謹んで申し上げます。」
    傍らの葛仙翁が笑った。
    葛仙翁「猿よ、なぜ初めは横柄で、後ではうやうやしいのだ。」
    悟空「いやいや、そんなつもりはありません。初めは横柄、後ではうやうやしいなんてことじゃないんです。今の俺には、振り回す棒がないもんでね。」
  "translation_status": "reviewed"
- "id": "xy-ch51-007"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "彼時玉皇天尊聞奏，即忙降旨可韓司知道：「既如悟空所奏，可隨查諸天星斗、各宿神王，有無思凡下界，隨即覆奏施行，以聞。」可韓丈人真君領旨，當時即同大聖去查。先查了四天門門上神王官吏。次查了三微垣垣中大小群真。又查了雷霆官將陶、張、辛、鄧，苟、畢、龐、劉。最後才查三十三天，天天自在。又查二十八宿：東七宿：角、亢、氐、房、參、尾、箕；西七宿：斗、牛、女、虛、危、室、壁；南七宿、北七宿：宿宿安寧。又查了太陽、太陰、水、火、木、金、土七政；羅睺、計都、炁孛四餘。滿天星斗，並無思凡下界。行者道：「既是如此，我老孫也不消上那靈霄寶殿。打攪玉皇大帝，深為不便。你自回旨去罷，我只在此等你回話便了。」那可韓丈人真君依命。孫行者等候良久，作詩紀興曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    玉帝は奏上を聞くと、ただちに可韓司（かかんし）へ命を下した。
    玉帝「悟空の申すことがそのとおりなら、諸天の星々と各宿の神王を調べ、人の世を恋しがって下界へ降りた者がいないか確かめよ。ただちに結果を奏上し、処置するように。以上、伝えよ。」
    可韓丈人真君（かかんじょうじんしんくん）は勅命を受け、すぐ悟空とともに調査へ向かった。まず四つの天門の神王と役人を調べ、次に三微垣（さんびえん）の大小の仙人たちを調べた。さらに雷部（らいぶ）の官将、陶（とう）・張（ちょう）・辛（しん）・鄧（とう）、苟（こう）・畢（ひつ）・龐（ほう）・劉（りゅう）を調べた。最後に三十三天（さんじゅうさんてん）を調べると、どの天も平穏だった。また二十八宿（にじゅうはっしゅく）を調べた。東の七宿、角（かく）・亢（こう）・氐（てい）・房（ぼう）・参（さん）・尾（び）・箕（き）、西の七宿、斗（と）・牛（ぎゅう）・女（じょ）・虚（きょ）・危（き）・室（しつ）・壁（へき）、さらに南の七宿、北の七宿も、どの宿も安らかだった。続いて太陽・太陰（たいいん）・水・火・木・金・土の七政（しちせい）、それに羅睺（らごう）・計都（けいと）・炁（き）・孛（はい）の四余（しよ）を調べた。満天の星々の中に、人の世を恋しがって下界へ降りた者は一人もいなかった。
    悟空「そうと分かれば、俺まで霊霄宝殿（れいしょうほうでん）へ上がるには及ばん。玉皇大帝（ぎょくこうたいてい）のお邪魔をするのも、まことに具合が悪い。あんた一人で復命してくれ。俺はここで返事を待っている。」
    可韓丈人真君は言われたとおりにした。悟空は長いこと待つ間、興を詩に託した。
  "translation_status": "reviewed"
- "id": "xy-ch51-008"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    風清雲霽樂昇平，神靜星明顯瑞禎。
    河漢安寧天地泰，五方八極偃戈旌。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 130
    "line_end": 131
  "translation_ja": |-
    風は清く、雲は晴れて、太平の世を楽しみ、神々は静かに、星々は明るく、めでたいしるしを示す。
    天の川は穏やかに、天地は安らぎ、五方八極（ごほうはっきょく）の隅々まで、戈（ほこ）も軍旗も伏せられている。
  "translation_status": "reviewed"
- "id": "xy-ch51-009"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那可韓司丈人真君歷歷查勘，回奏玉帝道：「滿天星宿不少，各方神將皆存，並無思凡下界者。」玉帝聞奏：「著孫悟空挑選幾員天將，下界擒魔去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    可韓丈人真君は隅々まで調べ終え、玉帝に復命した。
    可韓丈人真君「満天の星の神々に欠けた者はなく、各方の神将も皆そろっております。人の世を恋しがって下界へ降りた者は、一人もございません。」
    玉帝は報告を聞いて命じた。
    玉帝「孫悟空（そんごくう）に天将を何人か選ばせ、下界へ妖魔を捕らえに行かせよ。」
  "translation_status": "reviewed"
- "id": "xy-ch51-010"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四大天師奉旨意，即出靈霄寶殿，對行者道：「大聖啊，玉帝寬恩，言天宮無神思凡，著你挑選幾員天將，擒魔去哩。」行者低頭暗想道：「天上將不如老孫者多，勝似老孫者少。想我鬧天宮時，玉帝遣十萬天兵，佈天羅地網，更不曾有一將敢與我比手。向後來，調了小聖二郎，方是我的對手。如今那怪物手段又強似老孫，卻怎麼得能夠取勝？」許旌陽道：「此一時，彼一時，大不同也。常言道：『一物降一物』哩。你好違了旨意？但憑高見，選用天將，勿得遲疑誤事。」行者道：「既然如此，深感上恩，果是不好違旨；一則老孫又不可空走這遭。煩旌陽轉奏玉帝，只教托塔李天王與哪吒太子去罷，他還有幾件降妖兵器，且下界與那怪見一仗，以看如何。果若能擒得他，是老孫之幸；若不能，那時再作區處。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    四天師は勅命を受け、霊霄宝殿を出て悟空に告げた。
    四天師「大聖、玉帝は寛大なお心で、天宮から人の世に心を引かれて降りた神はいないが、天将を何人か選び、妖魔を捕らえに行くよう仰せです。」
    悟空はうつむき、心の中で考えた。
    悟空の心の声「天上の将には俺に及ばないやつが多く、俺に勝るやつは少ない。天宮で暴れたとき、玉帝は十万の天兵を出し、天羅地網（てんらちもう）を張ったが、俺と手を合わせようという将は一人もいなかった。後から小聖二郎（しょうせいじろう）を呼んできて、やっと俺の相手になったんだ。今度の化け物は、その俺より強い。どうすりゃ勝てるだろう。」
    許旌陽「昔と今では事情が大違いだ。『一つの物には、それを抑える別の物がある』というではないか。勅命に背いてよいものか。お前の見立てで天将を選び、ためらって事を遅らせてはならぬ。」
    悟空「そういうことなら、ご厚恩は深く感謝するし、勅命に背くわけにはいかない。せっかく来たのに、手ぶらで帰るわけにもいかんからな。旌陽（せいよう）殿、玉帝にお伝え願いたい。托塔李天王（たくとうりてんのう）と哪吒太子（なたたいし）に来てもらえばいい。あの太子には、妖怪を降す武器が何点かある。まず下界でやつと一戦交え、様子を見てみよう。捕まえてくれりゃ、俺にとってありがたいことだ。駄目なら、そのときまた別の手を考える。」
  "translation_status": "reviewed"
- "id": "xy-ch51-011"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真個那天師啟奏了玉帝，玉帝即令李天王父子率領眾部天兵，與行者助力。那天王即奉旨來會行者。行者又對天師道：「蒙玉帝遣差天王，謝謝不盡。還有一事，再煩轉達：但得兩個雷公使用，等天王戰鬥之時，教雷公在雲端裡下個雷㨝，照頂門上錠死那妖魔，深為良計也。」天師笑道：「好好好。」天師又奏玉帝，傳旨教九天府下點鄧化、張蕃二雷公，與天王合力縛妖救難。遂與天王、孫大聖徑下南天門外。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    そこで天師が玉帝に奏上すると、玉帝はただちに李天王（りてんのう）父子に命じ、諸部隊の天兵を率いて悟空を助けさせた。李天王は勅命を受けて悟空のところへ来た。悟空はまた天師に頼んだ。
    悟空「玉帝が天王をお遣わしくださり、お礼の申し上げようもない。もう一つ、お取り次ぎを頼みたいんだ。雷公（らいこう）を二人使わせてもらい、天王が戦っているとき、雲の上から雷の楔（かみなりのくさび）を落とし、妖魔の頭のてっぺんへ打ち込んで殺させよう。これはまったくいい手だ。」
    天師は笑った。
    天師「よいとも、よいとも、よいとも。」
    天師はさらに玉帝へ奏上した。勅命により、九天府（きゅうてんふ）から鄧化（とうか）と張蕃（ちょうはん）の二人の雷公が選ばれ、李天王と力を合わせて独角兕大王（どっかくじだいおう）を捕らえ、難を救うことになった。二人は李天王と悟空とともに、南天門の外へ下りていった。
  "translation_status": "reviewed"
- "id": "xy-ch51-012"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "頃刻而到。行者道：「此山便是金兜本作“⿰山兜”，Unicode缺字山。山中間乃是金兜本作“⿰山兜”，Unicode缺字洞。列位商議，卻教那個先去索戰？」天王停下雲頭，扎住天兵在於山南坡下道：「大聖素知小兒哪吒，曾降九十六洞妖魔，善能變化，隨身有降妖兵器，須教他先去出陣。」行者道：「既如此，等老孫引太子去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    一行はたちまち山に着いた。
    悟空「この山が金兜山だ。山の中ほどにあるのが金兜洞。皆で相談しよう。誰が先に戦いを挑む？」
    李天王は雲を止め、山の南斜面の下に天兵を駐屯させた。
    李天王「大聖もよくご存じの息子、哪吒（なた）は、九十六の洞の妖魔を降したことがあり、変化に巧みで、妖怪を降す武器を身につけています。まずあれを出陣させましょう。」
    悟空「それなら、俺が太子を案内してこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch51-013"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那太子抖擻雄威，與大聖跳在高山，徑至洞口，但見那洞門緊閉，崖下無精。行者上前高叫：「潑魔！快開門，還我師父來也。」那洞裡把門的小妖看見，急報道：「大王，孫行者領著一個小童男，在門前叫戰哩。」那魔王道：「這猴子鐵棒被我奪了，空手難爭，想是請得救兵來也。」叫：「取兵器。」魔王綽槍在手，走到門外觀看，那小童男生得相貌清奇，十分精壯。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    哪吒は勇ましく身構え、悟空とともに高い山へ跳び上がり、まっすぐ洞の入り口へ向かった。洞門は固く閉ざされ、崖の下にも妖怪の姿はなかった。悟空は進み出て、大声で呼ばわった。
    悟空「悪党め、さっさと開けろ。師匠を返せ！」
    洞内で門番をしていた小妖はそれを見て、急いで報告した。
    小妖「大王、孫行者（そんぎょうじゃ）が男の子を一人連れて、門の前で戦いを挑んでおります。」
    独角兕大王「この猿は鉄棒をわしに奪われ、素手では戦えん。援軍を頼んできたのだろう。」
    独角兕大王「武器を持ってこい。」
    独角兕大王は槍をつかみ、門の外へ出て眺めた。その少年は顔立ちが並外れて美しく、たいそうたくましい。まことに、こんな姿だった。
  "translation_status": "reviewed"
- "id": "xy-ch51-014"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    玉面嬌容如滿月，朱脣方口露銀牙。
    眼光掣電睛珠暴，額闊凝霞髮髻髽。
    繡帶舞風飛彩焰，錦袍映日放金花。
    環絛灼灼攀心鏡，寶甲輝輝襯戰靴。
    身小聲洪多壯麗，三天護教惡哪吒。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 141
    "line_end": 145
  "translation_ja": |-
    玉のような顔、愛らしい容貌は満月さながら。朱の唇、四角い口から銀の歯がのぞく。
    眼光は稲妻を放ち、目玉はぎょろりと張り出し、広い額には霞が凝り、髪は高く髷に結う。
    刺繡の帯は風に舞い、色とりどりの炎を飛ばし、錦の袍（ほう）は日に映えて、金の花を放つ。
    輪飾りと組紐はきらきらと胸当ての鏡に連なり、宝の鎧は戦靴に映えて輝く。
    体は小さく、声は大きく、勇壮で麗しい。三天（さんてん）で教えを護る、猛々しい哪吒。
  "translation_status": "reviewed"
- "id": "xy-ch51-015"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "魔王笑道：「你是李天王第三個孩兒，名喚做哪吒太子，卻如何到我這門前呼喝？」太子道：「因你這潑魔作亂，困害東土聖僧，奉玉帝金旨，特來拿你。」魔王大怒道：「你想是孫悟空請來的。我就是那聖僧的魔頭哩。量你這小兒曹有何武藝，敢出朗言？不要走，吃吾一槍。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    独角兕大王は笑った。
    独角兕大王「お前は李天王の三番目の子、名を哪吒太子というな。どうしてわしの門前で騒いでいる。」
    哪吒「お前が乱暴を働き、東土（とうど）の聖僧を捕らえて苦しめているからだ。玉帝の尊い勅命を受け、わざわざお前を捕らえに来た。」
    独角兕大王はかっと怒った。
    独角兕大王「さては孫悟空に頼まれて来たな。わしこそ、その聖僧の行く手を阻む魔物だ。お前のような小僧に、どれほどの武芸があって大口をたたく。逃げるな、この槍を受けろ！」
  "translation_status": "reviewed"
- "id": "xy-ch51-016"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這太子使斬妖劍，劈手相迎。他兩個搭上手，卻才賭鬥，那大聖急轉山坡，叫：「雷公何在？快早去，著妖魔下個雷㨝，助太子降伏來也。」鄧、張二公即踏雲光，正欲下手，只見那太子使出法來，將身一變，變作三頭六臂，手持六般兵器，望妖魔砍來；那魔王也變作三頭六臂，三柄長槍抵住。這太子又弄出降妖法力，將六般兵器拋將起去。是那六般兵器？卻是砍妖劍、斬妖刀、縛妖索、降魔杵、繡球、火輪兒。大叫一聲：「變！」一變十，十變百，百變千，千變萬，都是一般兵器，如驟雨冰雹，紛紛密密，望妖魔打將去。那魔王公然不懼，一隻手取出那白森森的圈子來，望空拋起，叫聲：「著！」唿喇的一下，把六般兵器套將下來。慌得那哪吒太子赤手逃生。魔王得勝而回。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    哪吒は斬妖剣（ざんようけん）を振り上げ、鋭く迎え撃った。二人が手を合わせ、戦い始めたところで、悟空は急いで山の斜面を回り、呼びかけた。
    悟空「雷公はどこだ！　早く行って、妖魔に雷の楔を落とし、太子が降伏させるのを助けてくれ！」
    鄧化と張蕃はすぐに光る雲へ乗り、まさに手を下そうとした。そのとき、哪吒が術を使い、体を三頭六臂（さんとうろっぴ）に変えた。六つの武器を持ち、独角兕大王へ斬りかかる。独角兕大王も三頭六臂となり、三本の長槍で受け止めた。哪吒はさらに降妖の法力を繰り出し、六つの武器を空へ投げ上げた。さて、その六つとは何か。砍妖剣（かんようけん）、斬妖刀（ざんようとう）、縛妖索（ばくようさく）、降魔杵（ごうましょ）、繡球（しゅうきゅう）、それに火輪（かりん）である。
    哪吒「変われ！」
    一つが十、十が百、百が千、千が万へと変わり、同じ武器が幾重にも増え、にわか雨や雹のように、独角兕大王めがけてびっしり降り注いだ。独角兕大王は少しも恐れず、片手で白くぎらつく輪を取り出すと、空へ投げ上げた。
    独角兕大王「当たれ！」
    ごうっと一息、六つの武器をまとめて輪に取り込んでしまった。哪吒は慌て、素手のまま命からがら逃げ出した。独角兕大王は勝ち誇って引き返した。
  "translation_status": "reviewed"
- "id": "xy-ch51-017"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "鄧、張二雷公在空中暗笑道：「早是我先看頭勢，不曾放了雷㨝。假若被他套將去，卻怎麼回見天尊？」二公按落雲頭，與太子來山南坡下，對李天王道：「妖魔果神通廣大。」悟空在傍笑道：「那廝神通也只如此，爭奈那個圈子利害。不知是甚麼寶貝，丟起來善套諸物。」哪吒恨道：「這大聖甚不成人。我等折兵敗陣，十分煩惱，都只為你，你反喜笑何也？」行者道：「你說煩惱，終然我老孫不煩惱？我如今沒計奈何，哭不得，所以只得笑也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    鄧化と張蕃の二人の雷公は、空の上でひそかに笑った。
    鄧化と張蕃「先に様子をうかがって、雷の楔を落とさずにおいてよかった。あれまで取り込まれたら、どんな顔で天尊のもとへ帰れたものか。」
    二人は雲を下ろし、哪吒とともに山の南斜面の下へ戻り、李天王に告げた。
    鄧化と張蕃「妖魔は、まことに並々ならぬ神通力の持ち主です。」
    悟空は傍らで笑った。
    悟空「やつの神通力そのものは、まああの程度だ。困るのは、あの輪の強ささ。どんな宝か知らんが、投げ上げると何でも取り込んでしまう。」
    哪吒は腹立たしげに言った。
    哪吒「大聖、あなたは本当に人が悪い。こちらは武器を失い、戦に負けて、ひどく困っているのです。それも全部あなたのためなのに、どうしてかえって嬉しそうに笑うのですか。」
    悟空「困っているというが、この俺だって困っていないとでも思うのか。今はもう打つ手がなく、泣くにも泣けない。だから、笑うしかないんだよ。」
  "translation_status": "reviewed"
- "id": "xy-ch51-018"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "天王道：「似此怎生結果？」行者道：「憑你等再怎計較；只是圈子套不去的，就可拿住他了。」天王道：「套不去者，惟水火最利。常言道：『水火無情。』」行者聞言道：「說得有理。你且穩坐在此，待老孫再上天走走來。」鄧、張二公道：「又去做甚的？」行者道：「老孫這去，不消啟奏玉帝，只到南天門裡，上彤華宮，請熒惑火德星君來此放火，燒那怪物一場，或者連那圈子燒做灰燼，捉住妖魔。一則取兵器還汝等歸天，二則可解脫吾師之難。」太子聞言甚喜道：「不必遲疑，請大聖早去早來，我等只在此拱候。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    李天王「こうなっては、どう始末をつけましょう。」
    悟空「みんなで、もう一度考えてみてくれ。あの輪に取り込めないものさえあれば、やつを捕まえられるんだが。」
    李天王「取り込めぬものなら、水と火が何より強力です。『水火は情け容赦なし』と申しますから。」
    悟空「そいつは道理だ。あんたたちは、ここで落ち着いていてくれ。俺がもう一度天上へ行ってこよう。」
    鄧化と張蕃「また何をしに行くのですか。」
    悟空「今度は玉帝へ奏上するまでもない。南天門の内の彤華宮（とうかきゅう）へ行って、熒惑火徳星君（けいこくかとくせいくん）を頼んでくる。ここで火を放ち、あの化け物を焼かせるのさ。ひょっとしたら輪まで灰にして、妖魔を捕まえられるかもしれん。一つには武器を取り返して、あんたたちを天上へ帰すため、二つには師匠の難を救うためだ。」
    哪吒はこれを聞いて、大いに喜んだ。
    哪吒「ためらうことはありません。大聖、どうぞ早く行って、早くお戻りください。私たちはここでお待ちしております。」
  "translation_status": "reviewed"
- "id": "xy-ch51-019"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者縱起祥光，又至南天門外。那廣目與四將迎道：「大聖如何又來？」行者道：「李天王著太子出師，只一陣，被那魔王把六件兵器撈了去了。我如今要到彤華宮請火德星君助陣哩。」四將不敢久留，讓他進去。至彤華宮，只見那火部眾神，即入報道：「孫悟空欲見主公。」那南方三炁火德星君整衣出門迎進道：「昨日可韓司查點小宮，更無一人思凡。」行者道：「已知。但李天王與太子敗陣，失了兵器，特來請你救援救援。」星君道：「那哪吒乃三壇海會大神，他出身時，曾降九十六洞妖魔，神通廣大，若他不能，小神又怎敢望也？」行者道：「因與李天王計議，天地間至利者，惟水火也。那怪物有一個圈子，善能套人的物件，不知是甚麼寶貝，故此說火能滅諸物，特請星君領火部到下方縱火燒那妖魔，救我師父一難。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    悟空はめでたい光に乗り、再び南天門の外へ着いた。広目天王と四元帥が迎えた。
    広目天王と四元帥「大聖、またお越しになったのは、どうしたことですか。」
    悟空「李天王が太子を出陣させたんだが、たった一戦で、六つの武器を妖魔に全部さらわれちまった。それで今度は彤華宮へ行って、火徳星君（かとくせいくん）に加勢を頼むんだ。」
    四元帥は長く引き止めることもできず、道をあけて中へ通した。彤華宮へ着くと、火部の神々がいた。すぐ中へ入って取り次いだ。
    火部の神々「孫悟空が、主君にお目にかかりたいと申しております。」
    南方三炁火徳星君（なんぽうさんきかとくせいくん）は衣服を整え、門外へ出て迎え入れた。
    火徳星君「昨日、可韓司が私の宮を調べましたが、人の世に心を引かれて下界へ降りた者は、一人もおりませんでした。」
    悟空「それは分かっている。ただ、李天王と太子が負けて、武器を失ったもんで、あんたに援軍を頼みに来たんだ。」
    火徳星君「哪吒は三壇海会大神（さんだんかいえだいじん）です。世に出たときから九十六の洞の妖魔を降し、大した神通力を備えておいでです。あの方にできぬのなら、私などに何が望めましょう。」
    悟空「李天王と相談したところ、天地の間でいちばん強力なのは、水と火だということになった。あの化け物は、他人の物を何でも取り込む輪を持っている。どういう宝かは分からん。それで、火ならあらゆる物を焼き滅ぼせるだろうと、あんたに火部を率いて下界へ来てもらい、妖魔を焼いて、師匠の難を救ってほしいんだ。」
  "translation_status": "reviewed"
- "id": "xy-ch51-020"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "火德星君聞言，即點本部神兵，同行者到金兜本作“⿰山兜”，Unicode缺字山南坡下，與天王、雷公等相見了。天王道：「孫大聖，你還去叫那廝出來，等我與他交戰，待他拿動圈子，我卻閃過，教火德帥眾燒他。」行者笑道：「正是，我和你去來。」火德共太子、鄧、張二公立於高峰之上，與他眺戰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    火徳星君は話を聞くと、すぐ配下の神兵を選び、悟空とともに金兜山の南斜面の下へ来て、李天王や雷公たちと顔を合わせた。
    李天王「孫大聖（そんたいせい）、もう一度あいつを呼び出してください。私が戦い、輪を動かしたところで身をかわします。それから火徳星君が神々を率い、焼いてください。」
    悟空は笑った。
    悟空「そのとおり。俺も一緒に行こう。」
    火徳星君は哪吒、鄧化、張蕃とともに高い峰に立ち、一行の戦いを見守った。

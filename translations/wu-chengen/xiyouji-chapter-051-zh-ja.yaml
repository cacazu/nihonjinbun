  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は山名・洞名の「兜」の後に、サイトの編集説明「本作“⿰山兜”，Unicode缺字」を繰り返し挿入している。左に山、右に兜を置く字が原字だという説明である。原文欄には全出現をそのまま保持し、訳文は前回から「金兜山」「金兜洞」とする。物語中の発言や地名の一部として編集説明を読み込まない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-02-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「同幼同生」の「同幼」は結びつきの意味が明瞭でない。同じ幼少期や生をともにするという字面を保ったが、三蔵と悟空が実際に同年齢・同時出生だったという事実を述べるものとは扱わない。別字へ校訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-03-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「主杖」は棒を失ったことを述べる一方、「主張」、すなわち自分で判断し主導する心にも響く。劉一明『西遊記百回詳注』の同回も「主意」を失うことと重ねて読む。ここでは具体的な鉄棒を消さず「頼みの杖」と訳し、回末の同じ語と対応させた。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-04-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「張道陵」。前の回の「張道齡」とは末字が異なるが、四天師の同じ人物として扱う。原字を黙って統一せず、各表記を辞書の同じ項目へまとめる。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-05-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「口兒緊些」はこの文脈では口をきかない意味に取らず、要求を緩めず言い張ることと解した。「頭兒」は物事の糸口・決着の手掛かりとしたが、古い口語の細かな含みには留保がある。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-06-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「三微垣」。一般の星域の呼称「三垣」を思わせるが、ここでは「微」の字を削らず保持した。どの天域を個別に指すかは本文が列挙しない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-07-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "星の列挙は底本どおりとした。国立天文台の通常の二十八宿表では、東七宿は「角・亢・氐・房・心・尾・箕」、北七宿は「斗・牛・女・虚・危・室・壁」であり、参は西七宿に属する。本文の「参」や「西七宿」を心・北へ黙って訂正しない。南北の名前の省略も底本の構成であり、訳抜けではない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-08-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「羅睺、計都、炁孛四餘」は「炁」と「孛」を分けた四者として訳す。『古今律歷考』卷六十四は七政以外の四隠曜を紫氣・月孛・羅㬋・計都と説明し、炁・孛とも略す。本文へ「紫」「月」を補って原字を変えず、語釈で補う。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-09-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の語形は「雷㨝」。空から頭へ打ち込む道具なので、雷神の道具「雷楔」に相当するものと解し、本文は「雷の楔」とした。『道法會元』卷七十三の雷霆神器に雷砧を雷楔ともいう説明がある。底本の㨝を楔と同字であると断定したり、原文を修正したりはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-10-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この段落の最初は「斬妖劍」、六武器の列挙では「砍妖劍、斬妖刀」。第四回での「斬妖劍、砍妖刀」とも字の組合せが異なる。剣・刀として同じ哪吒の武器を追いつつ、本文はその都度の字を残す。続く降魔杵は哪吒の持物で、恵岸の同名の武器と同一視しない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-11-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "前に火徳星君も、ここで水徳星君も、調査を「昨日」と言う。直前の天界の点検からの時間経過は本文で詳しく説明されていない。「先ほど」へ置き換えず、底本の時間表現を保った。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-12-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原詩の「金兜山生成的惡怪」を訳したもの。これはこの詩の形容であり、妖怪の来歴の調査が終わり、真の出自が確定したという訳者の説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-13-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「甯戚鞭牛」。牛を扱った甯戚の故事を、ここでは火勢の描写と結び付けているが、そのつながりは明瞭でない。一般に火牛の故事で知られる別人へ、本文の人名を置き換えない。周郎・赤壁との二つの比較を両方保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-14-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "四海・五湖・八河・四瀆・三江・九派は水域のまとまりを連ねた表現。本文は個々の川や湖を特定しないため、すべてに一意の地理的内訳を割り当てない。ここではそれらをつかさどる神々を点検していると読んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-15-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「二門」は入口の石門とは別の内側の門と解した。「輪を据えて支える」という動作を保ち、輪が水を吸い込んだとは訳さない。水が外へあふれたことを、次の段落と合わせて区別する。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-16-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「筋䯞子」は筋張り骨ばった拳をからかう表現と解したが、䯞の字を用いたこの語の厳密な語義は未確定。「鎚子」は拳の打撃を槌になぞらえたものと読み、金属製の武器を悟空が持つとはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-17-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "拳法の列挙は全句を残し、「韜脅劈胸墩」「淬地龍」「拿天橐」などの難句も字面に沿って訳した。技の具体的な実演手順、流派、攻撃部位の詳しい同定は未確定。特に天橐は原語を残す。「長掌」の不利を述べる句と、末尾の互角との言い方も両方保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-18-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三五十個」は三十から五十ほどを幅をもっていう数え方として「三十から五十匹ほど」と訳す。十五匹に固定せず、本文にある二度の出現を同じ数として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-19-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「圈套」は物としての輪・輪の仕掛けと、策略・罠を思わせる語。前後を通じて物の輪を指すことを保ち、輪そのものの固有名を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-20-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「麻蒼蠅」。灰色のまだらを持つハエと解し、特定の現代の生物種へ断定しない。小さくすらりとした姿をいう「秀溜」も残す。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-21-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文「定盤星」は棹秤などの、空の皿と分銅が釣り合う位置を示す最初の目印。教育部辞典の説明による。ここではほとんど重さのないほど小さい姿を詠むと解し、具体的な重量へ換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch51-note-22-body"
  "section_id": "chapter-51"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「羊酪椰醪」は乳の加工品と椰子の酒に関わる語を続けたものとして訳した。酒壺・大碗とともに飲食物を描くが、混合の仕方や製法は明記されない。特定の現代の酒・チーズへ確定しない。「演近」はそろそろ近寄る動作と解した。"
  "translation_status": "reviewed"

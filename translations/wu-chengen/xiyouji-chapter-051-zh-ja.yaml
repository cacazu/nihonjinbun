  "source_text": "這大聖到了金兜本作“⿰山兜”，Unicode缺字洞口，叫聲：「開門！快早還我師父。」那小怪又急通報道：「孫悟空又來了。」那魔帥眾出洞，見了行者道：「你這潑猴，又請了甚麼兵來耶？」這壁廂轉上托塔天王喝道：「潑魔頭！認得我麼？」魔王笑道：「李天王，想是要與你令郎報仇，欲討兵器麼？」天王道：「一則報仇要兵器，二來是拿你救唐僧。不要走，吃吾一刀。」那怪物側身躲過，挺長槍，隨手相迎。他兩個在洞前這場好殺。你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    悟空は金兜洞の入り口へ着き、声を上げた。
    悟空「開けろ！　さっさと師匠を返せ！」
    小妖はまた急いで知らせた。
    小妖「孫悟空がまた来ました。」
    独角兕大王は手下を率いて洞を出ると、悟空に言った。
    独角兕大王「この猿め、今度はどんな援軍を頼んできた。」
    こちらから托塔天王（たくとうてんのう）こと李天王が進み出て、怒鳴った。
    李天王「悪党め、この私を知っているか。」
    独角兕大王は笑った。
    独角兕大王「李天王、息子の仇を討ち、武器を取り返しに来たのだろう。」
    李天王「一つには仇を討ち、武器を取り返すため、二つにはお前を捕らえ、唐僧を救うためだ。逃げるな、この刀を受けろ！」
    独角兕大王は身を横にしてかわすと、長槍を突き出し、すかさず迎え撃った。洞の前で、二人は激しく戦った。そのありさまといえば、
  "translation_status": "reviewed"
- "id": "xy-ch51-022"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": "天王刀砍，妖怪槍迎。刀砍霜光噴烈火，槍迎銳氣迸愁雲。一個是金兜本作“⿰山兜”，Unicode缺字山生成的惡怪，一個是靈霄殿差下的天神。那一個因欺禪性施威武，這一個為救師災展大倫。天王使法飛沙石，魔怪爭強播土塵。播土能教天地暗，飛沙善著海江渾。兩家努力爭功績，皆為唐僧拜世尊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    天王は刀で斬り、妖怪は槍で迎える。
    刀が斬れば霜の光から烈火を噴き、槍が迎えれば鋭い気が愁いの雲をほとばしらせる。
    一方は金兜山に生じた悪い怪物、一方は霊霄殿から遣わされた天の神。
    あちらは禅の心を侮って武威を振るい、こちらは師の災いを救おうと、人の大いなる道義を示す。
    天王は術を使って砂石を飛ばし、妖怪は強さを競って土煙をまき散らす。
    土をまけば天地を暗くでき、砂を飛ばせば海も川も濁らせる。
    両者は力を尽くして手柄を争う。ことの起こりはすべて、唐僧が世尊（せそん）を拝みに行くため。
  "translation_status": "reviewed"
- "id": "xy-ch51-023"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那孫大聖見他兩個交戰，即轉身跳上高峰，對火德星君道：「三炁用心者。」你看那個妖魔與天王正鬥到好處，卻又取出圈子來。天王看見，即撥祥光，敗陣而走。這高峰上火德星君忙傳號令，教眾部火神一齊放火。這一場真個利害，好火："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    悟空は二人が戦うのを見ると、身を翻して高い峰へ跳び上がり、火徳星君に言った。
    悟空「三炁（さんき）殿、気をつけてくれよ。」
    独角兕大王と李天王がいよいよ激しく戦っていると、独角兕大王はまた輪を取り出した。李天王はそれを見るや、めでたい光に乗って引き返し、敗れて逃げた。峰の上では火徳星君が急いで号令を出し、配下の火の神々に一斉に火を放たせた。これは実に恐ろしい、すさまじい火だった。
  "translation_status": "reviewed"
- "id": "xy-ch51-024"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": "經云：「南方者火之精也。」雖星星之火，能燒萬頃之田；乃三炁之威，能變百端之火。今有火槍、火刀、火弓、火箭，各部神祗，所用不一。但見那半空中火鴉飛噪，滿山頭火馬奔騰。雙雙赤鼠，對對火龍。雙雙赤鼠噴烈焰，萬里通紅；對對火龍吐濃煙，千方共黑。火車兒推出，火葫蘆撒開。火旗搖動一天霞，火棒攪行盈地燎。說甚麼甯戚鞭牛，勝強似周郎赤壁。這個是天火非凡真利害，烘烘\U000242A8\U000242A8火風紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    経にいう、「南方は火の精なり」と。
    ほんの小さな火種でも、万頃（けい）の田を焼くことができる。まして三炁の威力なら、百通りの火へ姿を変える。
    今ここに、火の槍、火の刀、火の弓、火の矢。各部の神々が用いるものは、それぞれ異なる。
    空のただ中では火の烏が飛び騒ぎ、山じゅうでは火の馬が駆け回る。
    赤い鼠は二匹ずつ、火の竜は一対ずつ。
    赤い鼠が二匹ずつ烈火を噴けば、万里（り）は真っ赤になり、火の竜が一対ずつ濃煙を吐けば、あらゆる方角が真っ黒になる。
    火の車を押し出し、火の瓢簞から炎をまき放つ。
    火の旗を振れば空いっぱいの霞となり、火の棒をかき回せば地は炎に満ちる。
    甯戚（ねいせき）が牛を鞭打ったことなど、何ほどのものか。周郎（しゅうろう）の赤壁（せきへき）の火攻めさえ上回る。
    これは尋常ならぬ天の火、本当に恐ろしい。ごうごうと燃え盛り、火を巻く風まで赤くなる。
  "translation_status": "reviewed"
- "id": "xy-ch51-025"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖魔見火來時，全無恐懼。將圈子望空拋起，唿喇一聲，把這火龍、火馬、火鴉、火鼠、火槍、火刀、火弓、火箭，一圈子又套將下去，轉回本洞，得勝收兵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 162
    "line_end": 162
  "translation_ja": "独角兕大王は火が来るのを見ても、まったく恐れなかった。輪を空へ投げ上げると、ごうっという音とともに、火の竜、火の馬、火の烏、火の鼠、火の槍、火の刀、火の弓、火の矢を、またも一つの輪ですっかり取り込んだ。そして洞へ引き返し、勝ちを収めて兵を引いた。"
  "translation_status": "reviewed"
- "id": "xy-ch51-026"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這火德星君手執著一桿空旗，招回眾將，會合天王等，坐於山南坡下，對行者道：「大聖啊，這個兇魔真是罕見。我今折了火具，怎生是好？」行者笑道：「不須報怨。列位且請寬坐坐，老孫再去去來。」天王道：「你又往那裡去？」行者道：「那怪物既不怕火，斷然怕水。常言道：『水能剋火。』等老孫去北天門裡，請水德星君施佈水勢，往他洞裡一灌，把魔王渰死，取物件還你們。」天王道：「此計雖妙，但恐連你師父都淹死也。」行者道：「沒事。渰死我師，我自有個法兒教他活來。如今稽遲列位，甚是不當。」火德道：「既如此，且請行，請行。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    火徳星君は、旗だけを一本握り、配下の将を呼び戻した。李天王たちと合流して山の南斜面の下に座り、悟空に言った。
    火徳星君「大聖、この凶悪な魔物は、まことにめったにないやつです。火の道具まで失ってしまい、どうすればよいのでしょう。」
    悟空は笑った。
    悟空「そう恨み言を言わないでくれ。皆さん、ゆっくり座っていてくれよ。俺がもう一度出かけてくる。」
    李天王「またどこへ行くのです。」
    悟空「火を恐れないなら、きっと水を恐れる。『水は火に勝つ』というじゃないか。北天門（ほくてんもん）の内へ行き、水徳星君（すいとくせいくん）に水を放ってもらう。洞へ一気に流し込んで魔王を溺れ死にさせ、道具を取り返して、あんたたちに返すのさ。」
    李天王「見事な策ではありますが、お師匠さままで一緒に溺れ死んでしまうのではありませんか。」
    悟空「大丈夫だ。師匠を溺れ死にさせても、俺には生き返らせる方法がある。これ以上、皆さんを足止めするのは申し訳ないからな。」
    火徳星君「それでしたら、どうぞお出かけください。どうぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch51-027"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，又駕觔斗雲，徑到北天門外。忽擡頭，見多聞天王向前施禮道：「孫大聖何往？」行者道：「有一事要入烏浩宮見水德星君。你在此作甚？」多聞道：「今日輪該巡視。」正說處，又見那龐、劉、苟、畢四大天將進禮邀茶。行者道：「不勞，不勞，我事急矣。」遂別卻門神，直至烏浩宮，著水部眾神即時通報。眾神報道：「齊天大聖孫悟空來了。」水德星君聞言，即將查點四海、五湖、八河、四瀆、三江、九派並各處龍王俱遣退。整冠束帶，接出宮門，迎進宮內道：「昨日可韓司查勘小宮，恐有本部之神思凡作怪，正在此點查江海河瀆之神，尚未完也。」行者道：「那魔王不是江河之神，此乃廣大之精。先蒙玉帝差李天王父子並兩個雷公下界擒拿，被他弄個圈子，將六件神兵套去。老孫無奈，又上彤華宮請火德星君帥火部眾神放火，又將火龍、火馬等物一圈子套去。我想此物既不怕火，必然怕水，特來告請星君施水勢，與我捉那妖精，取兵器歸還天將，吾師之難，亦可救也。」水德聞言，即令黃河水伯神王：「隨大聖去助功。」水伯自衣袖中取出一個白玉盂兒道：「我有此物盛水。」行者道：「看這盂兒能盛幾何？妖魔如何渰得？」水伯道：「不瞞大聖說。我這一盂乃是黃河之水，半盂就是半河，一盂就是一河。」行者喜道：「只消半盂足矣。」遂辭別水德，與黃河神躲離天闕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    悟空はまた觔斗雲（きんとうん）に乗り、まっすぐ北天門の外へ向かった。ふと顔を上げると、多聞天王（たもんてんのう）が進み出て礼をした。
    多聞天王「孫大聖、どちらへいらっしゃいますか。」
    悟空「烏浩宮（うこうきゅう）へ入り、水徳星君に会う用がある。あんたはここで何をしてる。」
    多聞天王「今日は見回りの当番です。」
    話していると、龐・劉・苟・畢の四天将も来て礼をし、茶を勧めた。
    悟空「お構いなく、お構いなく。急いでいるんだ。」
    悟空は門の神々に別れを告げ、烏浩宮へ直行し、水部の神々にすぐ取り次がせた。
    水部の神々「斉天大聖孫悟空がお越しです。」
    水徳星君はそれを聞くと、点検中だった四海（しかい）、五湖（ごこ）、八河（はっか）、四瀆（しとく）、三江（さんこう）、九派（きゅうは）をつかさどる神々と、各地の竜王たちを、いったん皆下がらせた。冠を直し、帯を締め、宮門を出て迎え、宮内へ案内した。
    水徳星君「昨日、可韓司が私の宮を調べました。配下の神が人の世を恋しがり、下界で悪さをしてはいないかと、今も川や海の神々を点検しており、まだ終わっていないのです。」
    悟空「あの魔王は川の神なんかじゃない。途方もない力のある魔物だ。まず玉帝が李天王父子と二人の雷公を遣わして捕らえさせたが、やつは輪を使い、六つの神の武器を取り込んじまった。俺は仕方なく彤華宮へ上がり、火徳星君に火部の神々を率いて火を放ってもらったが、火の竜や火の馬まで、輪一つでさらわれた。火を恐れないなら、きっと水を恐れるだろうと思ってね。そこで、星君に水を放ってもらい、一緒に妖怪を捕まえ、武器を取り返して天将たちへ返したい。そうすりゃ、師匠の難も救えるんだ。」
    水徳星君は話を聞くと、黄河水伯神王（こうがすいはくしんおう）に命じた。
    水徳星君「大聖についていき、力を貸すのだ。」
    水伯（すいはく）は袖から白玉の鉢を一つ取り出した。
    水伯「私には、水を入れるこの道具がございます。」
    悟空「そんな鉢にどれだけ入る？　どうやって妖魔を溺れさせるんだ。」
    水伯「大聖、本当のことを申しますと、これ一鉢には黄河（こうが）の水が入ります。半鉢なら川の半分、一鉢なら川一本分です。」
    悟空は喜んだ。
    悟空「半鉢あれば十分だ。」
    こうして水徳星君に別れを告げ、水伯とともに天の宮殿を離れた。
  "translation_status": "reviewed"
- "id": "xy-ch51-028"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那水伯將盂兒望黃河舀了半盂，跟大聖至金兜本作“⿰山兜”，Unicode缺字山，向南坡下見了天王、太子、雷公、火德，具言前事。行者道：「不必細講，且教水伯跟我去。待我叫開他門，不要等他出來，就將水往門裡一倒，那怪物一窩子可都渰死。我卻去撈師父的屍首，再救活不遲。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    水伯は鉢を黄河へ向け、半鉢の水をくみ、悟空について金兜山へ来た。南斜面の下で李天王、哪吒、雷公、火徳星君に会い、事情を詳しく話した。
    悟空「詳しい話はもういい。まず水伯、俺についてきてくれ。俺が呼びかけて門を開けさせたら、やつが出てくるのを待たず、門の内へ水をざっと注ぎ込むんだ。そうすりゃ、あの化け物どもを巣ごとみな溺れ死にさせられる。俺はそれから師匠の死体を引き上げて、生き返らせれば間に合う。」
  "translation_status": "reviewed"
- "id": "xy-ch51-029"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那水伯依命，緊隨行者，轉山坡，徑至洞口，叫聲：「妖怪開門！」那把門的小妖，聽得是孫大聖的聲音，急又去報道：「孫悟空又來矣！」那魔聞說，帶了寶貝，綽槍就走，響一聲，開了石門。這水伯將白玉盂向裡一傾。那妖見是水來，撒了長槍，即忙取出圈子，撐住二門。只見那股水骨都都的只往外泛將出來。慌得孫大聖急縱觔斗，與水伯跳在高峰。那天王同眾都駕雲停於高峰之前，觀看那水，波濤泛漲，著實狂瀾，好水！真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    水伯は指示に従い、悟空のすぐ後について山の斜面を回り、洞の入り口へ進んだ。
    悟空「妖怪、門を開けろ！」
    門番の小妖は悟空の声だと聞き取ると、また急いで知らせに行った。
    小妖「孫悟空がまた来ました！」
    独角兕大王はそれを聞き、宝を携え、槍をつかんで駆け出し、音高く石門を開けた。水伯が白玉の鉢を洞の内側へ傾ける。独角兕大王は水が来るのを見ると、長槍を放し、急いで輪を取り出して、奥の門を支えるように据えた。すると水はごぼごぼと、ただ外へあふれ出てきた。悟空は慌てて宙返りをし、水伯とともに高い峰へ跳び上がった。李天王も神々と雲に乗り、峰の前に留まって水を眺めた。波は盛り上がり、まさしく荒れ狂う大波、ものすごい水だった。まことに、
  "translation_status": "reviewed"
- "id": "xy-ch51-030"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": "一勺之多，果然不測。蓋唯神功運化，利萬物而流漲百川。只聽得那潺潺聲振谷，又見那滔滔勢漫天。雄威響若雷奔走，猛湧波如雪捲顛。千丈波高漫路道，萬層濤激泛山巖。冷冷如漱玉，滾滾似鳴絃。觸石滄滄噴碎玉，回湍渺渺漩窩圓。低低凹凹隨流蕩，滿澗平溝上下連。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    わずか一杯であっても、その量はまことに測り知れぬ。
    神の力が働けばこそ、万物を潤す水は流れ、百の川を満たしてあふれる。
    せせらぎの音が谷を揺るがすかと思えば、滔々たる勢いが天を覆う。
    威勢ある響きは雷が走るよう、激しく湧き立つ波は雪が巻き上がるよう。
    千丈（じょう）の高波が道を覆い、万重の大波が山の岩を洗う。
    冷やかな音は玉をすすぐかのよう、渦巻く響きは弦を鳴らすかのよう。
    石に当たってざあざあと砕けた玉を噴き、返る流れははるかに巡り、丸い渦を巻く。
    低い所も、くぼんだ所も、流れのままに揺れ動き、谷を満たし、溝を埋め、上も下も一続きとなる。
  "translation_status": "reviewed"
- "id": "xy-ch51-031"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，心慌道：「不好啊！水漫四野，渰了民田，未曾灌在他的洞裡，曾奈之何？」喚水伯急忙收水。水伯道：「小神只會放水，卻不會收水。常言道：『潑水難收。』」咦！那座山卻也高峻，這場水只奔低流。須臾間，四散而歸澗壑。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    悟空はこれを見て、慌てふためいた。
    悟空「まずいぞ！　水が四方に広がって、人々の田畑を水浸しにした。やつの洞には流れ込んでいない。いったいどうすりゃいい！」
    悟空は水伯を呼び、急いで水を収めるよう言った。
    水伯「私には水を放つことしかできず、収めることはできません。『まいた水は取り戻せぬ』と申しますから。」
    ああ、もっともその山は高く険しく、水は低い所へと流れるばかり。ほどなく四方へ散って、谷や沢へ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch51-032"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "又只見那洞外跳出幾個小妖，在外邊吆吆喝喝，伸拳邏袖，弄棒拈槍，依舊喜喜歡歡耍子。天王道：「這水原來不曾灌入洞內，枉費一場之功也。」行者忍不住心中怒發，雙手掄拳，闖至妖魔門首，喝道：「那裡走！看打！」諕得那幾個小妖丟了槍棒，跑入洞裡，戰兢兢的報道：「大王，不好了，打將來了！」那魔王挺長槍，迎出門前道：「這潑猴老大憊懶！你幾番家敵不過我，縱水火亦不能近，怎麼又踵將來送命？」行者道：「這兒子反說了哩。不知是我送命，是你送命？走過來，吃老外公一拳。」那妖魔笑道：「這猴兒強勉纏帳！我倒使槍，他卻使拳。那般一個筋䯞子拳頭，只好有個核桃兒大小，怎麼稱得個鎚子起也？罷罷罷，我且把槍放下，與你走一路拳看看。」行者笑道：「說得是，走上來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    そのうち洞の外へ、小妖が何匹か跳び出してきた。外でわあわあと声を上げ、拳を伸ばし、袖をまくり、棒を振り、槍をいじり、前と同じように嬉しげに遊んでいる。
    李天王「水はやはり洞の中へ入らず、骨折りが無駄になったのですね。」
    悟空は胸に湧く怒りを抑えられず、両の拳を振り上げ、独角兕大王の門前へ突っ込んだ。
    悟空「どこへ行く！　食らえ！」
    小妖たちは肝をつぶし、槍や棒を投げ捨てて洞へ逃げ込み、震えながら報告した。
    小妖たち「大王、大変です。殴り込んできました！」
    独角兕大王は長槍を突き出し、門の前へ迎えに出た。
    独角兕大王「この猿め、まったくしつこい。何度戦ってもわしに勝てず、水や火を放っても近づけられなかったのに、なぜまた後を追って、命を捨てに来た。」
    悟空「このせがれめ、あべこべを言いやがる。命を捨てるのが俺か、お前か、まだ分からんぞ。こっちへ来い。じいさまの拳を食らえ！」
    独角兕大王は笑った。
    独角兕大王「この猿は無理やりしつこく絡んでくる。わしは槍を使うというのに、やつは拳だ。筋と骨ばかりのその拳は、せいぜい胡桃ほどの大きさ。そんな拳が、槌と呼べるしろものか。よしよし、槍は置いて、お前と拳法をひとわたり使ってみてやろう。」
    悟空は笑った。
    悟空「話が分かる。かかってこい。」
  "translation_status": "reviewed"
- "id": "xy-ch51-033"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖撩衣進步，丟了個架子，舉起兩個拳來，真似打油的鐵鎚模樣。這大聖展足挪身，擺開解數，在那洞門前，與那魔王遞走拳勢。這一場好打。咦！"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 175
    "line_end": 175
  "translation_ja": "独角兕大王は裾をからげ、一歩進み、構えを取り、二つの拳を振り上げた。まるで油を搾るときに打ちつける鉄槌のようだ。悟空も足を伸ばし、身を移し、技を繰り出す構えを取った。洞門の前で、独角兕大王と代わる代わる拳の技を仕掛け合う。なんという見事な殴り合いか！"
  "translation_status": "reviewed"
- "id": "xy-ch51-034"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": "拽開大四平，踢起雙飛腳。韜脅劈胸墩，剜心摘膽著。仙人指路，老子騎鶴。餓虎撲食最傷人，蛟龍戲水能兇惡。魔王使個蟒翻身，大聖卻施鹿解角。翹跟淬地龍，扭腕拿天橐。青獅張口來，鯉魚跌脊躍。蓋頂撒花，遶腰貫索。迎風貼扇兒，急雨催花落。妖精便使觀音掌，行者就對羅漢腳。長掌開闊自然鬆，怎比短拳多緊削。兩個相持數十回，一般本事無強弱。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    大きく開くは大四平（だいしへい）の構え、蹴り上げるは双飛脚（そうひきゃく）。
    脇を包み、胸を打ち砕く突き、心臓をえぐり、胆嚢を取る技。
    仙人は道を指し示し、老子（ろうし）は鶴にまたがる。
    餓えた虎が獲物に飛びかかれば人をひどく傷つけ、蛟竜（こうりゅう）が水に戯れれば猛威を振るう。
    妖怪が大蛇の身返しを使えば、悟空は鹿が角を落とす技。
    かかとを上げて地竜を沈め、手首をひねって天橐（てんたく）を捕らえる。
    青獅子が口を開けて来るかと思えば、鯉が背を返して跳び上がる。
    頭上を覆って花をまき、腰を巡って縄を通す。
    風に向けて扇をぴたりと添え、にわか雨が花を散らす。
    妖怪が観音掌（かんのんしょう）を繰り出せば、悟空は羅漢脚（らかんきゃく）で受けて立つ。
    長く伸ばす掌は大きく開き、おのずと緩みがある。短い拳の、鋭く引き締まった打撃にどう比べられよう。
    二人が渡り合うこと数十合。腕前は同じ、優劣はつかない。
  "translation_status": "reviewed"
- "id": "xy-ch51-035"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個在那洞門前廝打，只見這高峰頭喜得個李天王厲聲喝采，火德星鼓掌誇稱。那兩個雷公與哪吒太子，帥眾神跳到跟前，都要來相助；這壁廂群妖搖旗擂鼓，舞劍掄刀一齊護。孫大聖見事不諧，將毫毛拔下一把，望空撒起，叫：「變！」即變做三五十個小猴，一擁上前，把那妖纏住，抱腿的抱腿，扯腰的扯腰，抓眼的抓眼，撏毛的撏毛。那怪物慌了，急把圈子拿將出來。大聖與天王等見他弄出圈套，撥轉雲頭，走上高峰逃陣。那妖把圈子往上拋起，唿喇的一聲，把那三五十個毫毛變的小猴，收為本相，套入洞中，得了勝，領兵閉門，賀喜而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    二人が洞門の前で殴り合うのを見て、高い峰の上では李天王が喜び、大声で喝采し、火徳星君が手を打って褒めそやした。二人の雷公と哪吒は神々を率いて近くへ跳び下り、皆で加勢しようとする。するとこちらでは妖怪の群れが旗を振り、太鼓を打ち、剣や刀を振るって、一斉に主人を守りに出た。
    悟空は形勢がまずいと見ると、毛をひとつかみ抜き、空へまき散らした。
    悟空「変われ！」
    毛はたちまち三十から五十匹ほどの小猿に変わり、どっと前へ押し寄せて独角兕大王にまとわりついた。脚にしがみつく者、腰を引っ張る者、目を引っかく者、毛をむしる者。独角兕大王は慌て、急いで輪を取り出した。悟空と李天王たちは、輪を持ち出すのを見るや、雲を返し、高い峰へ逃れて戦場を離れた。独角兕大王が輪を投げ上げると、ごうっという音とともに、毛から変えた三十から五十匹ほどの小猿は元の姿へ戻され、洞の中へ取り込まれた。独角兕大王は勝ちを収め、兵を引いて門を閉ざし、勝利を祝いに戻った。
  "translation_status": "reviewed"
- "id": "xy-ch51-036"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這太子道：「孫大聖還是個好漢。這一路拳，走得似錦上添花；使分身法，正是人前顯貴。」行者笑道：「列位在此遠觀，那怪的本事，比老孫如何？」李天王道：「他拳鬆腳慢，不如大聖的緊疾。他見我們去時，也就著忙；又見你使出分身法來，他就急了。所以大弄個圈套。」行者道：「魔王好治，只是套子難降。」火德與水伯道：「若還取勝，除非得了他那寶貝，然後可擒。」行者道：「他那寶貝如何可得？只除是偷去來。」鄧、張二公笑道：「若要行偷禮，除大聖再無能者。想當年大鬧天宮時，偷御酒，偷蟠桃，偷龍肝、鳳髓及老君之丹，那是何等手段！今日正該拿此處用也。」行者道：「好說，好說。既如此，你們且坐，等老孫打聽去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    哪吒「やはり孫大聖は豪傑ですね。ひとわたりの拳法は、錦の上に花を添えるようでした。分身の術も、まさしく人々の前で腕を見せる見事さです。」
    悟空は笑った。
    悟空「皆さんはここで遠くから見ていたが、あいつの腕は、俺と比べてどうだった？」
    李天王「拳は緩く、足は遅く、大聖ほど鋭く素早くはありません。私たちが近づくのを見て、あいつはもう慌てていました。さらに分身の術を見せられて、焦ったのです。それで、あの輪を大いに使いだしたのでしょう。」
    悟空「魔王そのものはどうにでもなるが、あの輪が手に負えないんだ。」
    火徳星君と水伯「勝つには、まずあの宝を手に入れるよりありません。それからでなければ、捕らえられません。」
    悟空「だが、どうやって宝を手に入れる。盗みに行くしかないか。」
    鄧化と張蕃は笑った。
    鄧化と張蕃「盗みをなさるなら、大聖のほかにできる方はありません。昔、天宮で大暴れされた折には、帝の酒を盗み、蟠桃（ばんとう）を盗み、竜の肝や鳳凰の髄、それに老君（ろうくん）の仙丹（せんたん）まで盗まれた。あれほどの手際があったでしょう。今日こそ、その腕をここでお使いになるときです。」
    悟空「いやはや、お口がお上手だ。それなら、皆さんは座っていてくれ。俺が探りに行ってこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch51-037"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，跳下峰頭，私至洞口，搖身一變，變做個麻蒼蠅兒，真個秀溜。你看他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 181
    "line_end": 181
  "translation_ja": "悟空は峰から跳び下り、ひそかに洞の入り口へ向かった。身をひと揺すりすると、灰色のまだらのハエに変わった。まことに小さく、すらりとしている。その姿をご覧あれ。"
  "translation_status": "reviewed"
- "id": "xy-ch51-038"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    翎翅薄如竹膜，身軀小似花心。
    手足比毛更奘，星星眼窟明明。
    善自聞香逐氣，飛時迅速乘風。
    稱來剛壓定盤星，可愛些些有用。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 183
    "line_end": 186
  "translation_ja": |-
    羽は竹の薄皮のように薄く、体は花の芯ほどに小さい。
    手足は毛より太く、点のような目は明るく輝く。
    香りを嗅いではその匂いを追うのに長け、飛べば風に乗って素早い。
    量れば、ようやく秤の最初の目印にかかるほど。愛らしく小さくても、役に立つ。
  "translation_status": "reviewed"
- "id": "xy-ch51-039"
  "section_id": "chapter-51"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "輕輕的飛在門上，爬到門縫邊，鑽進去。只見那大小群妖舞的舞，唱的唱，排列兩傍。老魔王高坐臺上，面前擺著些蛇肉、鹿脯、熊掌、駝峰、山蔬果品。有一把青磁酒壺，香噴噴的羊酪椰醪，大碗家寬懷暢飲。行者落於小妖叢裡，又變做一個獾頭精，慢慢的演近臺邊。看夠多時，全不見寶貝放在何方。急抽身轉至臺後，又見那後廳上高吊著火龍吟嘯，火馬號嘶。忽擡頭，見他的那金箍棒靠在東壁，喜得他心癢難撾，忘記了更容變像，走上前拿了鐵棒，現原身丟開解數，一路棒打將出去。慌得那群妖膽戰心驚，老魔王措手不及，卻被他推倒三個，放倒兩個，打開一條血路，徑自出了洞門。這才是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第051回&oldid=1498138"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    悟空はそっと門に飛びつき、隙間まで這って、中へ潜り込んだ。見ると、大小の妖怪が踊ったり歌ったりしながら、両側に並んでいる。独角兕大王は高い台に座り、目の前には蛇の肉、鹿の干し肉、熊の掌、駱駝のこぶ、山の野菜、果物が並べてあった。青磁の酒壺が一つあり、よい香りのする羊の酪（らく）や椰子の酒を、大碗で心おきなく飲んでいる。
    悟空は小妖の群れへ降り、今度は獾（かん）の頭をした妖怪に変わって、そろそろと台のそばへ近づいた。長いこと見回したが、宝がどこに置かれているか、まるで見当たらない。すばやく身を引いて台の後ろへ回ると、奥の広間には火の竜が高く吊るされてうなり、火の馬がいなないていた。ふと顔を上げると、自分の金箍棒が東の壁に立てかけてある。嬉しさに心がむずむずし、じっとしていられない。姿を変えていることも忘れ、進み寄って鉄棒をつかみ、元の姿を現した。技を繰り出し、棒で打ちまくりながら外へ向かう。妖怪たちは肝をつぶし、心を震わせ、独角兕大王も手の打ちようがなかった。悟空は三匹を突き倒し、二匹を打ち倒し、血路を開くと、一気に洞門の外へ飛び出した。これこそ、
  "translation_status": "reviewed"
- "id": "xy-ch51-040"
  "section_id": "chapter-51"
  "kind": "verse"
  "origin": "source"
  "source_text": "魔頭驕傲無防備，主杖還歸與本人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch51-1498138"
    "precision": "line"

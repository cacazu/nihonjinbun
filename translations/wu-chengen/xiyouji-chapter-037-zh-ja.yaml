    "source_text": "行者果然開門，一齊看處，只見星月光中，階簷上，真個放著一柄金廂白玉珪。八戒近前拿起道：「哥哥，這是甚麼東西？」行者道：「這是國王手中執的寶貝，名喚玉珪。師父啊，既有此物，想此事是真。明日拿妖，全都在老孫身上。只是要你三樁兒造化低哩。」八戒道：「好好好，做個夢罷了，又告訴他。他那些兒不會作弄人哩？就教你三樁兒造化低。」三藏回入裡面道：「是那三樁？」行者道：「明日要你頂缸、受氣、遭瘟。」八戒笑道：「一樁兒也是難的，三樁兒卻怎麼耽得？」唐僧是個聰明的長老，便問：「徒弟啊，此三事如何講？」行者道：「也不消講，等我先與你二件物。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      悟空がさっそく戸を開け、皆で外を見ると、星と月の光の中、軒下の石段に、本当に金縁の白玉珪が置かれていた。八戒が近寄って拾い上げた。
      八戒「兄貴、これは何だい。」
      悟空「国王が手に持つ宝で、玉珪（ぎょくけい）というものだ。お師匠さま、これがあるからには、本当の話でしょう。明日の妖怪退治は、すべて私にお任せください。ただ、あなたには三つばかり、割の悪い目に遭っていただきます。」
      八戒「ほら、見たことか。夢を見たらそれまでにしておけばいいのに、わざわざ兄貴に話すからだ。人を困らせるなら、何だってやるんだから。さっそく三つも、割の悪い目に遭わされるぞ。」
      三蔵は中へ戻って尋ねた。
      三蔵「その三つとは何だ。」
      悟空「明日は、身代わりに責めを負い、腹の立つ仕打ちを受け、ひどい災難に遭っていただきます。」
      八戒は笑った。
      八戒「一つでも大変なのに、三つもどうして耐えられるんだ。」
      三蔵は物分かりのよい僧だったので、こう尋ねた。
      三蔵「悟空、その三つは、どういう意味で言うのだ。」
      悟空「説明は後でよいでしょう。まず、二つの品を差し上げます。」

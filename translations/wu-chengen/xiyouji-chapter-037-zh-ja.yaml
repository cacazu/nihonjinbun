    "source_text": "不多時，東方發白。行者又吩咐了八戒、沙僧，教他兩個：「不可攪擾僧人，出來亂走。待我成功之後，共汝等同行。」才別了，唿哨，一觔斗，跳在空中。睜火眼平西看處，果見有一座城池。你道怎麼就看見了？當時說那城池離寺只有四十里，故此憑高就望見了。行者近前仔細看處，又見那怪霧愁雲漠漠，妖風怨氣紛紛。行者在空中讚嘆道："

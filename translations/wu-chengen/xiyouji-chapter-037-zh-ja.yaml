    "translation_ja": |-
      それを見た三蔵は、顔色を変えるほど驚き、急いで身をかがめ、大声で呼びかけた。
      三蔵「どちらの国の陛下でいらっしゃいますか。どうぞ、お掛けください。」
      慌てて手を差し伸べて支えようとしたが、つかんだのは空ばかり。振り向いて座り、もう一度見ると、やはり先ほどの男がいる。三蔵は尋ねた。
      三蔵「陛下、どこの皇帝で、どの国を治めておられるのです。国が乱れ、悪臣に欺かれ虐げられて、夜中にここまで逃げてこられたのでしょうか。お話があれば、私にお聞かせください。」
      男は頬に涙を流して過ぎたことを語り、眉に愁いを寄せて事の起こりを訴えた。
      男「お師匠さま、私の住まいは真西、ここからわずか四十里（り）ほどの所にございます。そこに城があり、私が王業の基を築いた場所なのです。」
      三蔵「何という所ですか。」
      男「隠さずに申せば、私が国を興したとき、名を改めて烏鶏国（うけいこく）とした国です。」
      三蔵「陛下、それほど取り乱してここへいらしたのは、どのようなわけです。」
      烏鶏国王（うけいこくおう）「お師匠さま、わが国では五年前、大旱魃に遭いました。草の種も芽を出さず、民はみな飢えて死に、まことに痛ましい有様でした。」
      三蔵はうなずき、ほほえんで言った。
      三蔵「陛下、昔の人も『国の政治が正しければ、天の心も従う』と言います。民を慈しみ、いたわることをなさらなかったのではありませんか。凶作に遭ったからといって、どうして都から逃げ出すのです。まず蔵を開いて民を救い、過ちを悔い、今から善い政治を始め、法を曲げられて無実の罪に苦しむ人を放しておやりなさい。そうすれば自然と天の心にもかない、雨も風も時節にかなうでしょう。」
      烏鶏国王「国の穀倉は空になり、金も食糧も尽きておりました。文官にも武官にも俸禄を払えず、私の食膳からも肉がなくなりました。禹王（うおう）の治水にならい、万民と苦楽をともにし、身を清めて斎戒（さいかい）し、昼も夜も香をたいて祈りました。そうして三年、川は枯れ、井戸も干上がるばかりでした。誰もが危機に瀕していたところへ、突然、鍾南山（しょうなんざん）から一人の全真（ぜんしん）がやって来たのです。風雨を呼び、石を金に変えることができる道士でした。初めに文武の官人たちに会い、その後で私に会いました。さっそく壇に上って祈るよう頼むと、果たして効き目がありました。令牌（れいはい）を鳴らすや、たちまち大雨が降り注いだのです。私は三尺（しゃく）も降れば十分と思いましたが、長い旱魃のあとではまだ潤わないと言って、さらに二寸（すん）降らせてくれました。そのように義を重んじる人物と見て、私は八拝（はっぱい）の礼を交わして契りを結び、兄弟と呼び合うようになったのです。」
      三蔵「それは陛下にとって、この上ない喜びではありませんか。」
      烏鶏国王「どこに喜びがあるのでしょう。」
      三蔵「その全真にそれほどの力があるなら、雨が欲しければ雨を降らせ、金が欲しければ金を作らせればよい。まだ何が足りず、都を離れてここへ来られたのです。」
      烏鶏国王「その者と寝食をともにしたのは、わずか二年でした。うららかな春になり、紅い杏や美しい桃が花を開くと、家々の男女も、あちこちの貴公子も、春の景色を楽しみに出掛けておりました。その日、文武の官人たちは役所へ戻り、妃たちもそれぞれの御殿へ帰りました。私と全真は手を取り合い、ゆっくりと御花園（ぎょかえん）を歩いて、八角形の瑠璃井（るりせい）のそばに来ました。すると、彼が何かを投げ込んだらしく、井戸の中から無数の金色の光が射しました。宝があるから見てみよと私を井戸端へ誘い、いきなり凶暴な心を起こして、どぶんと井戸の中へ突き落としたのです。そして井戸口を石板でふさぎ、土をかぶせ、その上へ芭蕉を一本移し植えました。ああ、哀れな私です。死んでから、もう三年。井戸に落とされて命を奪われた、恨みを抱く亡霊なのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-007"

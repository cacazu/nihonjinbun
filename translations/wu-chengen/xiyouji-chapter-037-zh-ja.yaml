    "source_text": "又問道：「你縱有太子在朝，我怎的與他相見？」那人道：「如何不得見？」三藏道：「他被妖魔拘轄，連一個生身之母尚不得見，我一個和尚，欲見何由？」那人道：「他明早出朝來也。」三藏問：「出朝作甚？」那人道：「明日早朝，領三千人馬，架鷹犬，出城採獵，師父斷得與他相見。見時肯將我的言語說與他，他便信了。」三藏道：「他本是肉眼凡胎，被妖魔哄在殿上，那一日不叫他幾聲父王？他怎肯信我的言語？」那人道：「既恐他不信，我留下一件表記與你罷。」三藏問：「是何物件？」那人把手中執的金廂白玉珪放下道：「此物可以為記。」三藏道：「此物何如？」那人道：「全真自從變作我的模樣，只是少變了這件寶貝。他到宮中，說那求雨的全真拐了此珪去了。自此三年，還沒此物。我太子若看見，他睹物思人，此仇必報。」三藏道：「也罷，等我留下，著徒弟與你處置。卻在那裡等麼？」那人道：「我也不敢等。我這去，還央求夜遊神，再使一陣神風，把我送進皇宮內院，託一夢與我那正宮皇后，教他母子們合意，你師徒們同心。」三藏點頭應承道：「你去罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"

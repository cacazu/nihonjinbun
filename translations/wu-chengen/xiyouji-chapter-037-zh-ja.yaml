    "translation_ja": |-
      さすがは悟空、毛を一本抜き、仙気（せんき）を吹きかけて叫んだ。
      悟空「変われ！」
      毛は金をあしらった朱塗りの小箱に変わり、悟空はその中へ白玉珪を納めた。
      悟空「お師匠さま、これを手に持っていてください。夜が明けたら錦襴袈裟（きんらんげさ）を着て、本堂に座り、経を読んでいてください。その間に私は城を見てきます。本当に妖怪なら打ち殺し、この土地でも手柄を立てましょう。もしそうでないなら、むやみに災いを起こしてはなりませんから。」
      三蔵「そのとおり、そのとおりだ。」
      悟空「太子が城から出てこなければ、それまでです。夢の話どおり出てきたら、必ずここへお連れします。」
      三蔵「お会いしたら、どう受け答えすればよい。」
      悟空「来る前に、私がまずお知らせします。この箱のふたを少し開けておいてください。私は長さ二寸の小さな和尚に化けて中へ入りますから、私もろとも手に持っていてください。太子は寺に入れば、必ず仏を拝みます。どのように拝んでも、あなたは知らん顔をしていてください。立ち上がらないあなたを見て、きっと捕らえよと命じます。引きずり下ろされるままにして、殴るも、縛るも、殺すも、相手のするままに任せておくのです。」
      三蔵「ああ、軍令には誰も逆らえまい。本当に殺されてしまったら、どうする。」
      悟空「大丈夫、私がいます。いざという時には、必ずお守りします。尋ねられたら、東土から勅命を受け、西天へ仏を拝み、経を取りに行く、宝を献上する僧だと言ってください。『どんな宝がある』と言われたら、錦襴袈裟のことを説明して、『これは三番目の宝です。一番目、二番目には、もっとよい品があります』と言うのです。さらに聞かれたら、この箱の中には、上の五百年、下の五百年、中の五百年、合わせて千五百年の過去も未来も、残らず知っている宝があると答え、私を出してください。そこで私が夢の話を太子に伝えます。信じるなら妖魔を捕らえに行きましょう。一つには父王の仇を討ち、二つには私たちの名誉を立てるためです。信じなければ、白玉珪を見せてください。ただ、若い方だから、品を見ても分からないかもしれませんが。」
      三蔵は大喜びした。
      三蔵「悟空、見事な策だ。ところで、その宝の一つは錦襴袈裟、もう一つは白玉珪だが、お前が変身する宝は、何という名にするのだ。」
      悟空「立帝貨（りっていか）とでもしておきましょう。」
      三蔵は言われたとおりに覚えた。師弟は一夜まったく眠らず、夜明けを待ち焦がれた。うなずくだけで扶桑（ふそう）の太陽を呼び出し、ひと息吹いて満天の星を吹き散らしたいほどだった。

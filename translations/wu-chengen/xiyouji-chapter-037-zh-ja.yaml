    "source_text": "三藏見了，大驚失色，急躬身厲聲高叫道：「是那一朝陛下？請坐。」用手忙攙，撲了個空虛。回身坐定，再看處，還是那個人。長老便問：「陛下，你是那裡皇帝？何邦帝王？想必是國土不寧，讒臣欺虐，半夜逃生至此。有何話說，說與我聽。」這人才淚滴腮邊談舊事，愁攢眉上訴前因。道：「師父啊，我家住在正西，離此只有四十里遠近。那廂有座城池，便是興基之處。」三藏道：「叫做甚麼地名？」那人道：「不瞞師父說，便是朕當時創立家邦，改號烏雞國。」三藏道：「陛下這等驚慌，卻因甚事至此？」那人道：「師父啊，我這裡五年前，天年乾旱，草子不生，民皆饑死，甚是傷情。」三藏聞言，點頭笑道：「陛下啊，古人云：『國正天心順。』想必是你不慈恤萬民，既遭荒歉，怎麼就躲離城郭？且去開了倉庫，賑濟黎民，悔過前非，重興今善，放赦了那枉法冤人，自然天心和合，雨順風調。」那人道：「我國中倉廩空虛，錢糧盡絕。文武兩班停俸祿，寡人膳食亦無葷。倣效禹王治水，與萬民同受甘苦，沐浴齋戒，晝夜焚香祈禱。如此三年，只乾得河枯井涸。正都在危急之處，忽然鍾南山來了一個全真，能呼風喚雨，點石成金。先見我文武多官，後來見朕，當即請他登壇祈禱，果然有應，只見令牌響處，頃刻間大雨滂沱。寡人只望三尺雨足矣，他說久旱不能潤澤，又多下了二寸。朕見他如此尚義，就與他八拜為交，以兄弟稱之。」三藏道：「此陛下萬千之喜也。」那人道：「喜自何來？」三藏道：「那全真既有這等本事，若要雨時，就教他下雨；若要金時，就教他點金。還有那些不足，卻離了城闕來此？」那人道：「朕與他同寢食者，只得二年。又遇著陽春天氣，紅杏夭桃，開花綻蕊。家家士女，處處王孫，俱去遊春賞玩。那時節，文武歸衙，嬪妃轉院。朕與那全真攜手緩步，至御花園裡，忽行到八角琉璃井邊，不知他拋下些甚麼物件，井中有萬道金光。哄朕到井邊看甚麼寶貝，他陡起兇心，撲通的把寡人推下井內，將石板蓋住井口，擁上泥土，移一株芭蕉栽在上面。可憐我啊，已死去三年，是一個落井傷生的冤屈之鬼也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

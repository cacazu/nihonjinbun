    "origin": "source"
    "source_text": "好大聖，拔了一根毫毛，吹口仙氣，叫聲：「變！」變做一個紅金漆匣兒，把白玉珪放在內盛著，道：「師父，你將此物捧在手中，到天曉時，穿上錦襴袈裟，去在正殿坐著念經，等我去看看他那城池。端的是個妖怪，就打殺他，也在此間立個功績；假若不是，且休撞禍。」三藏道：「正是，正是。」行者道：「那太子不出城便罷，若真個應夢出城來，我定引他來見你。」三藏道：「見了我如何迎答？」行者道：「來到時，我先報知。你把那匣蓋兒扯開些，等我變作二寸長的一個小和尚，放在匣兒裡，你連我捧在手中。那太子進了寺來，必然拜佛。你盡他怎的下拜，只是不睬他。他見你不動身，一定教拿你。你憑他拿下去，打也由他，綁也由他，殺也由他。」三藏道：「呀！他的軍令大，真個殺了我，怎麼好？」行者道：「沒事，有我哩，若到那緊關處，我自然護你。他若問時，你說是東土欽差上西天拜佛取經進寶的和尚。他道：『有甚寶貝？』你卻把錦襴袈裟對他說一遍，說道：『此是三等寶貝。還有頭一等、第二等的好物哩。』但問處，就說這匣內有一件寶貝，上知五百年，下知五百年，中知五百年，共一千五百年過去未來之事，俱盡曉得。卻把老孫放出來。我將那夢中話告訴那太子。他若是肯信，就去拿了那妖魔，一則與他父王報仇，二來我們立個名節；他若不信，再將白玉珪拿與他看。只恐他年幼，還不認得哩。」三藏聞言，大喜道：「徒弟啊，此計絕妙！但說這寶貝，一個叫做錦襴袈裟，一個叫做白玉珪；你變的寶貝卻叫做甚名？」行者道：「就叫做立帝貨罷。」三藏依言，記在心上。師徒們一夜那曾得睡，盼到天明，恨不得點頭喚出扶桑日，噴氣吹散滿天星。"

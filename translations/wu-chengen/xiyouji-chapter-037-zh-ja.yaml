    "translation_ja": |-
      やがて東の空が白み始めた。悟空は八戒と沙悟浄にも言い含めた。
      悟空「僧たちを煩わせたり、出てきて歩き回ったりするなよ。俺が仕事を片づけたら、お前たちと一緒に出発する。」
      別れるなり口笛を吹き、宙返りを一つして空へ跳び上がった。火眼（かがん）を開いて真西を見ると、果たして城がある。どうしてすぐ見えたのか、とお思いだろう。先ほど言ったとおり、城は寺からわずか四十里なので、高い所からなら見えたのである。近づいてよく見ると、怪しい霧と陰鬱な雲が一面に広がり、妖風と恨みの気が乱れ飛んでいた。悟空は空中で嘆じて言った。

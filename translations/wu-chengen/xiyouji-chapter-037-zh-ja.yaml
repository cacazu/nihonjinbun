    "translation_ja": |-
      三蔵はさらに尋ねた。
      三蔵「朝廷に太子がおられるにしても、どうすればお会いできますか。」
      烏鶏国王「どうして会えないことがありましょう。」
      三蔵「妖怪に取り締まられ、生みの母にさえ会えないのです。一介の僧の私が、どうやって会えるでしょう。」
      烏鶏国王「明日の朝、宮中から出てまいります。」
      三蔵「何のために出てくるのです。」
      烏鶏国王「明朝、三千の兵を率い、鷹や犬を連れて、城外へ狩りに出ます。必ずお会いになれます。その折に私の話を伝えてくだされば、信じるでしょう。」
      三蔵「太子は生身の人間の目しか持ちません。御殿で妖怪に欺かれ、毎日何度も父王と呼びかけているでしょう。どうして私の話を信じるでしょうか。」
      烏鶏国王「信じないかもしれないとおっしゃるなら、しるしの品を一つ残していきましょう。」
      三蔵「どんな品ですか。」
      烏鶏国王は手に持っていた金縁の白玉珪を置いた。
      烏鶏国王「これが証拠になります。」
      三蔵「この品が、どうして証拠になるのです。」
      烏鶏国王「全真は私の姿に化けましたが、この宝だけは作り出せませんでした。宮中へ行って、雨を降らせた全真がこの品を持ち逃げしたと言ったのです。それから三年、この品は姿を見せていません。太子が見れば、品から私を思い出し、きっと仇を討ってくれるでしょう。」
      三蔵「承知しました。預かって、弟子に取り計らわせましょう。あなたはどこでお待ちになりますか。」
      烏鶏国王「私は待っているわけにもまいりません。戻って夜遊神にもう一度お願いし、神風で後宮へ送ってもらい、正宮の皇后の夢に現れようと思います。母子が心を合わせ、お師匠さま方も力を合わせられるようにするのです。」
      三蔵はうなずいて承知した。
      三蔵「では、おいでなさい。」

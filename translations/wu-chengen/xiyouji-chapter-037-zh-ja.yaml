    "source_text": "三藏道：「卻好，卻好。想必是一代親王侍長，發付何處鎮守去了？」那人道：「不是。我本宮有個太子，是我親生的儲君。」三藏道：「那太子想必被妖魔貶了？」那人道：「不曾。他只在金鑾殿上，五鳳樓中，或與學士講書，或共全真登位。自此三年，禁太子不入皇宮，不能夠與娘娘相見。」三藏道：「此是何故？」那人道：「此是妖怪使下的計策。只恐他母子相見，閑中論出長短，怕走了消息。故此兩不會面，他得永住常存也。」三藏道：「你的災屯，想應天付，卻與我相類。當時我父曾被水賊傷生；我母被水賊欺占，經三個月，分娩了我。我在水中逃了性命，幸金山寺恩師救養成人。記得我幼年無父母，此間那太子失雙親，真個可憐！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      三蔵「それはよい。それはよい。ご一族の親王か、側近の長が、どこかの守備に出されているのでしょうか。」
      烏鶏国王「いいえ。宮中には太子がおります。私がもうけた実の子で、王位の跡継ぎです。」
      三蔵「その太子は、妖怪に身分を落とされたのではありませんか。」
      烏鶏国王「そうではありません。金鑾殿（きんらんでん）や五鳳楼（ごほうろう）にいて、学士と書物を論じたり、全真とともに御殿の席に着いたりしています。ただ、この三年、後宮に入ることを禁じられ、母である后に会えないのです。」
      三蔵「それは、どうしてです。」
      烏鶏国王「妖怪のたくらみです。母子が会ってよもやま話をすれば、何か違うと気づかれ、秘密が漏れるかもしれない。それが怖いのです。二人を会わせなければ、いつまでも居座れるというわけです。」
      三蔵「あなたの災難は、天の定めなのでしょう。私の身の上にも似ています。かつて私の父は水賊に殺され、母はその賊に奪われました。それから三か月して、私を産んだのです。私は水の中で命を取り留め、幸い金山寺（きんざんじ）の恩師に救われて、大人になるまで育てていただきました。幼いころの私には父母がいなかった。それを思えば、この太子も両親を失ったようなもの。まことにお気の毒です。」
    "translation_status": "reviewed"

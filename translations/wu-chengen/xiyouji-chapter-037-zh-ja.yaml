  - "id": "xy-ch37-002"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏坐於寶林寺禪堂中燈下，念一會《梁皇水懺》，看一會《孔雀真經》，只坐到三更時候，卻才把經本包在囊裡。正欲起身去睡，只聽得門外撲剌剌一聲響喨，淅零零刮陣狂風。那長老恐吹滅了燈，慌忙將褊衫袖子遮住。又見那燈或明或暗，便覺有些心驚膽戰。此時又困倦上來，伏在經案上盹睡。雖是合眼朦朧，卻還心中明白。耳內嚶嚶，聽著那窗外陰風颯颯。好風！真個那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 121
        "line_end": 121
    "translation_ja": "さて、三蔵（さんぞう）は宝林寺（ほうりんじ）の禅堂（ぜんどう）で灯の下に座り、『梁皇水懺（りょうこうすいせん）』を唱えたり、『孔雀真経（くじゃくしんぎょう）』を読んだりしていた。三更（さんこう）になるまでそうして過ごし、ようやく経本を袋にしまった。立って寝に行こうとしたとき、戸の外でばたばたと大きな音がし、ざあっと激しい風が吹きつけた。三蔵は灯が吹き消されるのを恐れ、慌てて褊衫（へんさん）の袖で覆った。火が明るくなったり暗くなったりするのを見て、何やら胸騒ぎがして恐ろしくなった。そこへ眠気も襲ってきて、経机にうつ伏せになり、うとうとと眠った。目を閉じてぼんやりしてはいたが、心にはまだ意識が残り、窓の外で陰気な風がさわさわと鳴るのが、耳の奥に響いていた。なんという風だろう。まさに、こうである。"
    "translation_status": "reviewed"
  - "id": "xy-ch37-003"
    "section_id": "chapter-37"
    "kind": "verse"
    "origin": "source"
    "source_text": "淅淅瀟瀟，飄飄蕩蕩。淅淅瀟瀟飛落葉，飄飄蕩蕩捲浮雲。滿天星斗皆昏昧，遍地塵沙盡灑紛。一陣家猛，一陣家純。純時松竹敲清韻，猛處江湖波浪渾；刮得那山鳥難棲聲哽哽，海魚不定跳噴噴；東西館閣門窗脫，前後廊房神鬼瞋；佛殿花瓶吹墮地，琉璃搖落慧燈昏；香爐攲倒香灰迸，燭架歪斜燭焰煙。幢幡寶蓋都搖拆，鐘鼓樓臺撼動根。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      ざわざわと吹きすさび、ひらひらと漂い流れる。
      ざわざわと落ち葉を飛ばし、ひらひらと浮雲を巻き上げる。
      満天の星々はことごとく光を失い、地上の砂ぼこりは一面に舞い散る。
      あるときは激しく、あるときは穏やかに。
      穏やかなときには松竹が澄んだ音を奏で、激しくなると川や湖の波が濁り立つ。
      山の鳥はねぐらにつけず、声を詰まらせて鳴き、海の魚も落ち着けず、しぶきを上げて跳ねる。
      東西の館や楼閣では戸や窓が外れ、前後の回廊や部屋では神も鬼も顔をしかめる。
      仏殿の花瓶は吹き落とされ、瑠璃の飾りは揺れ落ち、仏の智慧の灯も暗くなる。
      香炉が傾き倒れて灰が飛び、燭台はゆがみ、ろうそくの炎から煙が上がる。
      幢幡（どうばん）も宝蓋（ほうがい）も揺られて折れ、鐘楼、鼓楼、高殿は根元から震え動く。
    "translation_status": "reviewed"
  - "id": "xy-ch37-004"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老昏夢中聽著風聲一時過處，又聞得禪堂外隱隱的叫一聲「師父」！忽擡頭夢中觀看，門外站著一條漢子，渾身上下水淋淋的，眼中垂淚，口裡不住的只叫「師父」。三藏欠身道：「你莫是魍魎妖魅、神怪邪魔，至夜深時，來此戲我？我卻不是那貪慾貪嗔之類。我本是個光明正大之僧，奉東土大唐旨意，上西天拜佛求經者。我手下有三個徒弟，都是降龍伏虎之英豪，掃怪除魔之壯士。他若見了你，碎屍粉骨，化作微塵。此是我大慈悲之意，方便之心。你趁早兒潛身遠遁，莫上我的禪門來。」那人倚定禪堂道：「師父，我不是妖魔鬼怪，亦不是魍魎邪神。」三藏道：「你既不是此類，卻深夜來此何為？」那人道：「師父，你舍眼看我一看。」長老果仔細定睛看處，呀！只見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      三蔵が浅い夢の中で風の音を聞いていると、それがひとしきり過ぎたあと、禅堂の外からかすかに、誰かが呼ぶ声がした。
      声の主「お師匠さま！」
      夢の中でふと顔を上げて見ると、戸の外に一人の男が立っていた。全身がびしょ濡れで、涙を流し、絶えず「お師匠さま」と呼んでいる。三蔵は身を起こして言った。
      三蔵「お前は妖魅や魍魎（もうりょう）、怪しい神や邪悪な魔物のたぐいで、夜更けに私をからかいに来たのではないか。私は欲や怒りにふける者ではない。東土（とうど）の大唐（だいとう）の命を奉じ、西天（さいてん）へ仏を拝み経を求めに行く、心にやましいところのない僧だ。私には三人の弟子がいる。いずれも竜を降し虎を伏せる豪傑、妖怪や魔物を払う勇士だ。お前を見つければ、肉も骨も粉々にし、微塵にしてしまうぞ。こう言うのも大慈悲の思いから、お前を救おうという心からだ。早く身を隠して遠くへ逃げ、私の禅堂には近寄るな。」
      男は禅堂に身を寄せて答えた。
      男「お師匠さま、私は妖魔や鬼怪でも、魍魎や邪神でもございません。」
      三蔵「それなら、何のためにこの夜更けに来たのだ。」
      男「お師匠さま、目を開いて、よく私をご覧ください。」
      三蔵が言われたとおり目を凝らすと、なんと、こんな姿であった。
    "translation_status": "reviewed"
  - "id": "xy-ch37-005"
    "section_id": "chapter-37"
    "kind": "verse"
    "origin": "source"
    "source_text": "頭戴一頂沖天冠，腰束一條碧玉帶，身穿一領飛龍舞鳳赭黃袍，足踏一雙雲頭繡口無憂履，手執一柄列斗羅星白玉珪。面如東岳長生帝，形似文昌開化君。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      頭には沖天冠（ちゅうてんかん）、腰には碧玉の帯。
      身には竜が飛び鳳凰が舞う模様の、赤みを帯びた黄色の袍（ほう）。
      足には雲形のつま先と刺繍の縁を備えた無憂履（むゆうり）。
      手には北斗（ほくと）と星々をちりばめた白玉珪（はくぎょくけい）を握っている。
      顔つきは東岳長生帝（とうがくちょうせいてい）のごとく、その姿は文昌開化君（ぶんしょうかいかくん）にも似ていた。

    "translation_ja": |-
      その恨みの魂は頭を地につけて別れを告げた。三蔵が立ち上がって送ろうとすると、どうしたはずみか足が引っ掛かり、ひっくり返った。その拍子にはっと目が覚めた。なんと、南柯の夢（なんかのゆめ）だったのである。三蔵は薄暗い灯を前に、慌てて呼んだ。
      三蔵「弟子たち、弟子たち！」
      目を覚ました八戒（はっかい）が文句を言った。
      八戒「何だよ、『土地（とち）、土地』って。昔、俺が豪傑を気取って、人ばかり食って暮らしていたころは、生臭い肉をたらふく食えて、本当に気楽だった。それなのに、あんたが出家したばっかりに、俺たちが守って旅をすることになった。和尚になるだけのはずが、今じゃ奴隷扱いだ。昼は荷を担ぎ、馬を引き、夜は尿瓶を持ち、足元に寝て、あんたの足を体で温める役までさせられる。こんな時分に寝もしないで、また弟子を呼ぶのは何の用だ。」
      三蔵「弟子たちよ、今、机でうたた寝をして、不思議な夢を見たのだ。」
      悟空（ごくう）が跳ね起きた。
      悟空「お師匠さま、夢は思いから生じるものです。まだ山へ入らぬうちから妖怪を怖がり、雷音（らいおん）への道が遠くて行き着けないのではと心配し、長安（ちょうあん）を恋しがって、いつ帰れるかと案じる。考え事が多いから、夢も多いのです。私のように、一筋の真心で西方の仏に会うことだけを目指していれば、夢など一つも見ません。」
      三蔵「悟空、今のは故郷を恋しがる夢ではない。目を閉じると、激しい風がひとしきり吹き、禅房の戸の外に一人の皇帝が現れて、烏鶏国王と名乗ったのだ。全身が水に濡れ、目には涙をいっぱいにためていた。」
      三蔵は、ああだった、こうだったと、夢の中で聞いたことを一つ残らず悟空に話した。悟空は笑って言った。
      悟空「もう分かりました。夢枕に立ったのは、私に一仕事くれるために違いありません。きっと妖怪が王位を奪い、国を乗っ取っているのでしょう。私が本物と偽者を見分けてみせます。その妖魔め、棒を浴びせれば、たちまちひと手柄です。」
      三蔵「だが、その妖怪は神通力が大きいと言っていたぞ。」
      悟空「どれほど大きかろうと、恐れることがありますか。私が来ると早くから知っていたとしても、逃げるすべはなくしてやります。」
      三蔵「そういえば、しるしとして宝を一つ置いていったはずだ。」
      八戒「お師匠さま、いつまでも夢にこだわるなよ。夢を見た、それだけでいいじゃないか。なぜそこまで本気にするんだ。」
      沙悟浄（さごじょう）「『正直そうでも心まで正直とは信じるな。情け深そうでも、情けのなさに用心せよ』とも言います。灯をつけて戸を開け、どうなっているか見ればよいでしょう。」

    "source_text": "唐僧見說是鬼，諕得觔力酥軟，毛骨聳然。沒奈何，只得將言又問他道：「陛下，你說的這話，全不在理。既死三年，那文武多官、三宮皇后，遇三朝見駕殿上，怎麼就不尋你？」那人道：「師父啊，說起他的本事，果然世間罕有。自從害了朕，他當時在花園內搖身一變，就變做朕的模樣，更無差別。現今占了我的江山，暗侵了我的國土。他把我兩班文武、四百朝官、三宮皇后、六院嬪妃，盡屬了他矣。」三藏道：「陛下，你忒也懦。」那人道：「何懦？」三藏道：「陛下，那怪倒有些神通，變作你的模樣，侵占你的乾坤，文武不能識，后妃不能曉，只有你死的明白，你何不在陰司閻王處具告，把你的屈情伸訴伸訴？」那人道：「他的神通廣大，官吏情熟：都城隍常與他會酒，海龍王盡與他有親，東嶽齊天是他的好朋友，十代閻羅是他的異兄弟。因此這般，我也無門投告。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      幽霊だと聞いて、三蔵は全身の力が抜け、身の毛もよだつほど恐れた。どうすることもできず、言葉をつないで、なお尋ねた。
      三蔵「陛下、今のお話は、どうにも腑に落ちません。亡くなって三年もたつのなら、文武の官人や三宮（さんぐう）の后たちは、三朝（さんちょう）の拝謁で御殿に伺ったとき、どうしてあなたを捜さなかったのです。」
      烏鶏国王「お師匠さま、あの者の術は、まったく世に並ぶものがありません。私を殺すと、その場で身をひと振りし、庭の中で私と寸分違わぬ姿に変わったのです。今はわが王位を占め、ひそかに国を奪い取っています。文武の二班、四百人の朝官、三宮の后、六院（りくいん）の妃たちまで、すべて彼のものになってしまいました。」
      三蔵「陛下、あなたもあまりに気が弱い。」
      烏鶏国王「どうして気が弱いとおっしゃるのです。」
      三蔵「その妖怪に神通力（じんつうりき）があり、あなたに化けて国を奪ったので、官人にも后妃にも見抜けなかったのでしょう。しかし、あなただけは自分がどう死んだかを知っています。なぜ陰司（いんし）の閻王（えんおう）に訴え出て、受けた不正を申し立てないのです。」
      烏鶏国王「あの者は神通力が大きいうえ、あちらの役人とも懇意なのです。都城隍（とじょうこう）とはしょっちゅう酒を飲み、海の竜王（りゅうおう）たちとは皆、縁戚です。東嶽斉天（とうがくせいてん）とは親友、十代閻羅（じゅうだいえんら）とは義兄弟。そんなわけで、私には訴える先がございません。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-008"

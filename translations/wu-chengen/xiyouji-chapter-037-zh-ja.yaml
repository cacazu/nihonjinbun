    "source_text": "三藏道：「陛下，你陰司裡既沒本事告他，卻來我陽世間作甚？」那人道：「師父啊，我這一點冤魂，怎敢上你的門來？山門前有那護法諸天、六丁六甲、五方揭諦、四值功曹、一十八位護教伽藍，緊隨鞍馬。卻才被夜遊神一陣神風，把我送將進來。他說我三年水災該滿，著我來拜謁師父。他說你手下有一個大徒弟，是齊天大聖，極能斬怪降魔。今來志心拜懇，千乞到我國中，拿住妖魔，辨明邪正。朕當結草銜環，報酬師父恩也。」三藏道：「陛下，你此來是請我徒弟與你去除卻那妖怪麼？」那人道：「正是，正是。」三藏道：「我徒弟幹別的事不濟，但說降妖捉怪，正合他宜。陛下啊，雖是著他拿怪，但恐理上難行。」那人道：「怎麼難行？」三藏道：「那怪既神通廣大，變得與你相同；滿朝文武，一個個言和心順；三宮妃嬪，一個個意合情投。我徒弟縱有手段，決不敢輕動干戈。倘被多官拿住，說我們欺邦滅國，問一款大逆之罪，困陷城中，卻不是畫虎刻鵠也？」那人道：「我朝中還有人哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      三蔵「陛下、陰司であの者を訴えることができないのに、こちらの生きた人間の世へ何をしに来られたのです。」
      烏鶏国王「お師匠さま、私のような小さな恨みの魂が、どうして勝手にあなたを訪ねられましょう。山門の前には、あなたの馬に付き従う護法諸天（ごほうしょてん）、六丁六甲（ろくていろっこう）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、十八柱の護教伽藍（ごきょうがらん）がおられます。先ほど、夜遊神（やゆうしん）が神風を起こして、私をここへ送り込んでくださったのです。水の中で三年苦しむ災難も、そろそろ終わるはずだから、お師匠さまにお目にかかるようにと。そのお話では、あなたの一番弟子は斉天大聖（せいてんたいせい）で、妖怪や魔物を退治することに大変優れておられるそうです。そこで心からお願いに参りました。どうか、どうかわが国へおいでになり、妖魔を捕らえ、邪と正を明らかにしてください。草を結び、輪をくわえてでも、お師匠さまのご恩に報います。」
      三蔵「では、私の弟子を頼んで、あの妖怪を取り除いてもらいに来たのですね。」
      烏鶏国王「そのとおり、そのとおりでございます。」
      三蔵「私の弟子はほかの仕事には役に立ちませんが、妖怪退治といえば、まさに得意です。ただ、陛下、あれに捕らえさせるにしても、筋道の上で難しいことがありそうです。」
      烏鶏国王「何が難しいのでしょう。」
      三蔵「その妖怪は神通力が大きく、あなたと同じ姿になっている。朝廷の官人たちは皆、彼に従い、三宮の妃たちも皆、心を通わせている。弟子にどれほど腕があっても、軽々しく武力を振るうわけにはいきません。万一、役人たちに捕まって、国を欺いて滅ぼそうとした大逆罪に問われ、城内で身動きが取れなくなったら、虎を描き白鳥を彫るつもりが失敗するように、よい事をしようとして、かえって悪い結果になるではありませんか。」
      烏鶏国王「わが朝廷には、まだ頼れる者がおります。」
    "translation_status": "reviewed"

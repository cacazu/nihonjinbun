    "source_text": "那冤魂叩頭拜別，舉步相送，不知怎麼踢了腳，跌了一個觔斗，把三藏驚醒，卻原來是南柯一夢。慌得對著那盞昏燈，連忙叫：「徒弟，徒弟。」八戒醒來道：「甚麼『土地土地』？當時我做好漢，專一吃人度日，受用腥羶，其實快活，偏你出家，教我們保護你跑路。原說只做和尚，如今拿做奴才，日間挑包袱、牽馬，夜間提尿瓶、務腳！這早晚不睡，又叫徒弟作甚？」三藏道：「徒弟，我剛才伏在案上打盹，做了一個怪夢。」行者跳將起來道：「師父，夢從想中來。你未曾上山，先怕怪物；又愁雷音路遠，不能得到；思念長安，不知何日回程：所以心多夢多。似老孫一點真心，專要西方見佛，更無一個夢兒到我。」三藏道：「徒弟，我這一夢，不是思鄉之夢。才然合眼，見一陣狂風過處，禪房門外有一朝皇帝，自言是烏雞國王。渾身水濕，滿眼垂淚。」這等這等，如此如此，將那夢中話一一的說與行者。行者笑道：「不消說了，他來託夢與你，分明是照顧老孫一場生意。必然是個妖怪在那裡篡位謀國，等我與他辨個真假。想那妖魔棍到處，立業成功。」三藏道：「徒弟，他說那怪神通廣大哩。」行者道：「怕他甚麼廣大？早知老孫到，教他即走無方。」三藏道：「我又記得留下一件寶貝做表記。」八戒答道：「師父莫要胡纏，做個夢便罷了，怎麼只管當真？」沙僧道：「『不信直中直，須防仁不仁。』我們打起火，開了門，看看如何便是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"

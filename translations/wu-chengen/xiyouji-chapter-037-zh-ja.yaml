        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 137
        "line_end": 138
    "translation_ja": |-
      悟空「まことの王が宝座にあれば、めでたい光と五色の雲が現れる。
      妖怪が竜の位を奪ったために、立ちのぼる黒い気が黄金の門を閉ざすのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-016"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者正在感嘆，忽聽得炮聲響喨，又只見東門開處，閃出一路人馬，真個是採獵之軍，果然勢勇。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 140
        "line_end": 140
    "translation_ja": "悟空がそう嘆じていると、ふいに砲声が響いた。東門が開き、一隊の人馬が現れた。まさに狩りの軍勢で、いかにも勇ましい。その様子はこうである。"
    "translation_status": "reviewed"
  - "id": "xy-ch37-017"
    "section_id": "chapter-37"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      曉出禁城東，分圍淺草中。
      彩旗開映日，白馬驟迎風。
      鼉鼓鼕鼕擂，標槍對對衝。
      架鷹軍猛烈，牽犬將驍雄。
      火炮連天振，粘竿映日紅。
      人人支弩箭，個個挎雕弓。
      張網山坡下，鋪繩小徑中。
      一聲驚霹靂，千騎擁貔熊。
      狡兔身難保，乖獐智亦窮。
      狐狸該命盡，麋鹿喪當中。
      山雉難飛脫，野雞怎避兇。
      他都揀占山場擒猛獸，摧殘林木射飛蟲。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 142
        "line_end": 153
    "translation_ja": |-
      暁に宮城の東を出て、浅い草むらで手分けして囲みを敷く。
      色とりどりの旗は広がって日に映え、白馬は風を受けて駆ける。
      鼉（だ）の皮の太鼓がどんどんと鳴り、投げ槍は二本ずつ並んで突き出される。
      鷹を腕に据えた兵は猛々しく、犬を引く将も強く勇ましい。
      砲声は空まで震わせ、鳥もち竿は日に照らされて赤く輝く。
      誰もが弩（ど）に矢をつがえ、誰もが飾り彫りの弓を携える。
      山の斜面の下には網を張り、細道には罠の縄を敷く。
      雷のような一声とともに、千騎の列には貔（ひ）や熊さながらの猛者がひしめく。
      すばしこい兎も身を守れず、利口なノロも知恵を使い果たす。
      狐も山猫も命の尽きる時、大鹿も鹿も囲みの中で命を落とす。
      山の雉は飛んで逃げられず、野の鶏もこの凶事を避けられぬ。
      彼らは山場を選んで押さえ、猛獣を捕らえ、林木をなぎ倒して空飛ぶものを射落とす。
    "translation_status": "reviewed"
  - "id": "xy-ch37-018"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那些人出得城來，散步東郊。不多時，有二十里向高田地，又只見中軍營裡，有小小的一個將軍：頂著盔，貫著甲，裹肚花，十八札，手執青鋒寶劍，坐下黃驃馬，腰帶滿弦弓。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 154
        "line_end": 154
    "translation_ja": "一行は城を出ると、東の郊外へ散らばって進んだ。やがて二十里ほど先の高い田畑に来ると、中軍（ちゅうぐん）の中に、若い将軍が一人見えた。兜をかぶり、模様入りの腹当てを巻き、十八枚の札（さね）を連ねた鎧をまとっている。手には青く鋭い宝剣、乗るのは黄色の毛に白の交じる馬、腰には弦を張った弓を帯びていた。まさに、こうである。"
    "translation_status": "reviewed"
  - "id": "xy-ch37-019"
    "section_id": "chapter-37"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      隱隱君王像，昂昂帝主容。
      規模非小輩，行動顯真龍。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 156
        "line_end": 157
    "translation_ja": |-
      おのずから君王の面影があり、堂々とした帝王の容貌。
      ただの若者とは器が違い、その立ち居振る舞いに、まことの竜の威風が現れる。
    "translation_status": "reviewed"
  - "id": "xy-ch37-020"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者在空暗喜道：「不須說，那個就是皇帝的太子了。等我戲他一戲。」好大聖，按落雲頭，撞入軍中太子馬前，搖身一變，變作一個白兔兒，只在太子馬前亂跑。太子看見，正合歡心，拈起箭，拽滿弓，一箭正中了那兔兒。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空は空から見て、ひそかに喜んだ。
      悟空「言うまでもない、あれが皇帝の太子だな。ひとつ、からかってやろう。」
      さすがは悟空、雲から降り、軍勢の中へ飛び込んで太子の馬の前に出ると、身をひと振りして白い兎に変わり、馬の前を走り回った。太子はそれを見ると、まさに望んでいた獲物とばかり、矢を取り、弓をいっぱいに引き絞って放った。一矢は見事に兎に命中した。
    "translation_status": "reviewed"
  - "id": "xy-ch37-021"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來是那大聖故意教他中了，卻眼乖手疾，一把接住那箭頭，把箭翎花落在前邊，丟開腳步跑了。那太子見箭中了玉兔，兜開馬，獨自爭先來趕。不知馬行的快，行者如風；馬行的遲，行者慢走：只在他面前不遠。看他一程一里，將太子哄到寶林寺山門之下，行者現了本身。不見兔兒，只見一枝箭插在門檻上。徑撞進去，見唐僧道：「師父，來了，來了。」卻又一變，變做二寸長的小和尚兒，鑽在紅匣之內。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      実は悟空が、わざと当てさせたのである。素早く目を配り手を動かして、矢じりをぱっとつかみ、矢羽を前に突き出したまま、勢いよく駆け出した。太子は白兎に命中したのを見て、馬を向け、一人で先頭に立って追った。だが、馬が速く走れば悟空も風のように走り、馬が遅くなれば悟空も足を緩め、いつもさほど離れぬ前方を走っていた。そうして一里、また一里と太子を誘い、宝林寺の山門の下まで来ると、悟空は元の姿に戻った。兎は消え、門の敷居に矢が一本刺さっているだけとなった。悟空はそのまま中へ飛び込み、三蔵に告げた。
      悟空「お師匠さま、来ました、来ました。」
      さらにもう一度姿を変え、長さ二寸の小さな和尚となって、朱塗りの箱へ潜り込んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch37-022"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那太子趕到山門前，不見了玉兔，只見門檻上插著一枝雕翎箭。太子大驚失色道：「怪哉！怪哉！分明我箭中了玉兔，玉兔怎麼不見，只見箭在此間？想是年多日久，成了精魅也。」拔了箭，擡頭看處，山門上有五個大字，寫著「敕建寶林寺」。太子道：「我知之矣。向年間曾記得我父王在金鑾殿上，差官賫些金帛，與這和尚修理佛殿佛象，不期今日到此。正是：因過道院逢僧話，又得浮生半日閑。我且進去走走。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      さて、太子が山門の前まで追ってくると、白兎の姿はなく、敷居に鷲の羽を付けた矢が一本刺さっている。太子は顔色を変えて驚いた。
      太子「不思議だ、実に不思議だ。確かに私の矢は白兎に当たったのに、なぜ兎が消え、矢だけここにあるのだ。長い年月を生きて、精霊になった兎なのだろうか。」
      矢を抜いて顔を上げると、山門に「勅建宝林寺（ちょくけんほうりんじ）」と大きな五文字が書かれていた。
      太子「思い出した。以前、父上が金鑾殿から役人を使いに出し、金や絹をここの和尚たちに与えて、仏殿や仏像を修理させたことがあった。今日ここへ来ようとは、思いもしなかった。まさに、
      修行の寺を通りかかって僧と語り、浮世の半日の暇を得る、
      というところだ。ひとまず中を歩いてみよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-023"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那太子跳下馬來，正要進去，只見那保駕的官將與三千人馬趕上，簇簇擁擁，都入山門裡面。慌得那本寺眾僧，都來叩頭拜接，接入正殿中間，參拜佛像。卻才舉目觀瞻，又欲遊廊玩景，忽見正當中坐著一個和尚，太子大怒道：「這個和尚無禮！我今半朝鑾駕進山，雖無旨意知會，不當遠接，此時軍馬臨門，也該起身，怎麼還坐著不動？」教：「拿下來！」說聲「拿」字，兩邊校尉一齊下手，把唐僧抓將下來，急理繩索便綑。行者在匣裡默默的念咒，教道：「護法諸天、六丁六甲，我今設法降妖，這太子不能知識，將繩要綑我師父，汝等即早護持；若真綑了，汝等都該有罪。」那大聖暗中吩咐，誰敢不遵，卻將三藏護持定了，那些人摸也摸不著他光頭，好似一壁牆擋住，難攏其身。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      太子が馬を下り、入ろうとしたところへ、護衛の官人や将軍、三千の兵が追いつき、どっと山門の中へ入った。寺の僧たちは慌てて集まり、頭を地につけて迎え、本堂へ案内して仏像を拝ませた。太子は顔を上げて仏像を眺め、それから回廊を巡って景色を楽しもうとしたが、真ん中に一人の和尚が座ったままでいるのを見つけ、激しく怒った。
      太子「無礼な和尚だ！　今日は国王の行幸に準ずるこの私が寺へ来たのだ。あらかじめ知らせる命令は出していなかったから、遠くまで迎えに来ることはないにしても、兵馬が門まで来た今は、立ち上がるのが当然だろう。なぜ座ったまま動かぬ。」
      そして太子は命じた。
      太子「引っ立てよ！」
      命令の声と同時に、左右の兵士が一斉に手を出し、三蔵を座から引きずり下ろした。急いで縄を整え、縛ろうとする。悟空は箱の中でひそかに呪文を唱え、命じた。
      悟空「護法諸天、六丁六甲よ。俺は今、妖怪を降す策を進めている。太子は事情を知らず、お師匠さまを縄で縛ろうとしているから、早く守れ。本当に縛られたら、お前たち全員の罪だぞ。」
      悟空の密かな命令に、誰が逆らえよう。神々は三蔵をしっかり守った。兵士たちは、その剃り上げた頭に触ることすらできない。目の前に壁があるようで、体に近寄れなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch37-024"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那太子道：「你是那方來的，使這般隱身法欺我？」三藏上前施禮道：「貧僧無隱身法，乃是東土唐僧，上雷音寺拜佛求經進寶的和尚。」太子道：「你那東土雖是中原，其窮無比，有甚寶貝，你說來我聽。」三藏道：「我身上穿的這袈裟，是第三樣寶貝。還有第一等、第二等更好的物哩。」太子道：「你那衣服，半邊苫身，半邊露臂，能值多少物，敢稱寶貝？」三藏道：「這袈裟雖不全體，有詩幾句。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      太子「お前はどこから来た。そんな隠身（いんしん）の術を使い、私を欺くつもりか。」
      三蔵は前へ出て礼をした。
      三蔵「私は隠身の術など持っておりません。東土から来た唐僧（とうそう）で、雷音寺（らいおんじ）へ仏を拝み、経を求めに行く、宝を献上する和尚でございます。」
      太子「東土は中原（ちゅうげん）だといっても、この上なく貧しい所ではないか。どんな宝があるというのだ。話してみよ。」
      三蔵「身に着けているこの袈裟（けさ）が、三番目の宝でございます。ほかに一番目と二番目の、もっとよい品があります。」
      太子「その衣は半身しか覆わず、もう半分は腕がむき出しだ。いったいどれほどの値打ちがあって、宝などと言える。」
      三蔵「この袈裟は全身を覆いませんが、それを詠んだ詩がございます。
    "translation_status": "reviewed"
  - "id": "xy-ch37-025"
    "section_id": "chapter-37"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      佛衣偏袒不須論，內隱真如脫世塵。
      萬線千針成正果，九珠八寶合元神。
      仙娥聖女恭修製，遺賜禪僧靜垢身。
      見駕不迎猶自可，你的父冤未報枉為人。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 167
        "line_end": 170
    "translation_ja": |-
      片肌をあらわす仏の衣を、とやかく言うには及ばない。
      内には真如（しんにょ）を秘め、俗世の塵を脱ぎ捨てる。
      幾千の針、幾万の糸で悟りの実りを成し、九つの珠と八つの宝が元神（げんしん）に合する。
      仙女と聖女がつつしんで仕立て、汚れた身を清めるよう僧に授けたもの。
      お出ましを迎えぬことなど、まだ許せることだが、父の無念を晴らさぬあなたは、人として生きている甲斐もない。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-026"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "太子聞言，心中大怒道：「這潑和尚胡說！你那半片衣，憑著你口能舌便，誇好誇強。我的父冤從何未報？你說來我聽。」三藏進前一步，合掌問道：「殿下，為人生在天地之間，能有幾恩？」太子道：「有四恩。」三藏道：「那四恩？」太子道：「感天地蓋載之恩，日月照臨之恩，國王水土之恩，父母養育之恩。」三藏笑曰：「殿下言之有失。人只有天地蓋載，日月照臨，國王水土，那得個父母養育來？」太子怒道：「和尚是那遊手遊食削髮逆君之徒！人不得父母養育，身從何來？」三藏道：「殿下，貧僧不知。但只這紅匣內有一件寶貝，叫做立帝貨，他上知五百年，中知五百年，下知五百年，共知一千五百年過去未來之事，便知無父母養育之恩，令貧僧在此久等多時矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      太子はそれを聞き、心底腹を立てた。
      太子「このろくでなしの和尚め、でたらめを言うな！　半切れの衣を、口先で立派だ、すばらしいと褒め立ておって。父の無念を晴らしていないとは、どこから出た話だ。説明してみよ。」
      三蔵は一歩進み、合掌して尋ねた。
      三蔵「殿下、人がこの天地の間に生きるに当たって、受ける恩はいくつございますか。」
      太子「四恩（しおん）がある。」
      三蔵「どの四つです。」
      太子「天が覆い地が載せてくれる恩、日月が照らしてくれる恩、国王が水と土地を与えてくれる恩、父母が養い育ててくれる恩だ。」
      三蔵は笑って言った。
      三蔵「殿下、そのお言葉には誤りがございます。人にあるのは、天地が覆い載せてくれる恩、日月が照らしてくれる恩、国王の水土の恩だけ。父母に養育される恩など、どこにございましょう。」
      太子は怒鳴った。
      太子「この和尚は、働きもせずに食べ歩き、頭を剃って君主に背く輩だな！　父母が養育しなければ、人の体はどこから来るのだ。」
      三蔵「殿下、私には分かりません。ただ、この朱塗りの箱に、立帝貨という宝がございます。上の五百年、中の五百年、下の五百年、合わせて千五百年の過去も未来も知っております。それが、父母に養育される恩などないと知っていて、私をここで、長らくお待ちさせていたのでございます。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-027"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "太子聞說，教：「拿來我看。」三藏扯開匣蓋兒，那行者跳將出來，\U000253B1呀\U000253B1的兩邊亂走。太子道：「這星星小人兒，能知甚事？」行者聞言嫌小，卻就使個神通，把腰伸一伸，就長了有三尺四五寸。眾軍士吃驚道：「若是這般快長，不消幾日，就撐破天也。」行者長到原身，就不長了。太子才問道：「立帝貨，這老和尚說你能知未來過去吉凶，你卻有龜作卜？有蓍作筮？憑書句斷人禍福？」行者道：「我一毫不用，只是全憑三寸舌，萬事盡皆知。」太子道：「這廝又是胡說。自古以來，《周易》之書，極其玄妙，斷盡天下吉凶，使人知所趨避，故龜所以卜，蓍所以筮。聽汝之言，憑據何理？妄言禍福，扇惑人心。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      太子はそれを聞いて命じた。
      太子「持ってまいれ。見てやろう。」
      三蔵が箱のふたを開けると、悟空が飛び出し、ぴょんぴょんと左右を駆け回った。
      太子「こんな点ほどの小人に、何が分かる。」
      悟空は小さいと言われたのが気に入らず、術を使って腰をぐっと伸ばすと、背丈が三尺四、五寸ほどになった。軍士たちは驚いた。
      軍士たち「こんな速さで伸びるなら、数日もたたず、天を突き破ってしまうぞ。」
      悟空は本来の背丈まで伸びると、それ以上は大きくならなかった。そこで太子が尋ねた。
      太子「立帝貨、この老和尚は、お前が過去や未来の吉凶を知ると言う。では、亀で占うのか、蓍（めどぎ）で占うのか。それとも書物の言葉を頼りに、人の禍福を判断するのか。」
      悟空「何一つ使いません。ただこの三寸の舌だけで、万事を知ることができます。」
      太子「こいつもでたらめを言う。昔から『周易（しゅうえき）』はきわめて奥深い書物で、天下の吉凶をことごとく判断し、人に何を目指し何を避けるべきか知らせてくれる。それゆえ亀の甲で占い、蓍の茎でも占うのだ。お前の言い分は、何を根拠にしている。勝手に禍福を言い立て、人心を惑わせるつもりか。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-028"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「殿下且莫忙，等我說與你聽。你本是烏雞國王的太子。你那裡五年前，年程荒旱，萬民遭苦，你家皇帝共臣子秉心祈禱。正無點雨之時，鍾南山來了一個道士，他善呼風喚雨，點石為金。君王忒也愛小，就與他拜為兄弟。這樁事有麼？」太子道：「有有有，你再說說。」行者道：「後三年不見全真，稱孤的卻是誰？」太子道：「果是有個全真，父王與他拜為兄弟，食則同食，寢則同寢。三年前在御花園裡玩景，被他一陣神風，把父王手中金廂白玉珪攝回鍾南山去了。至今父王還思慕他。因不見他，遂無心賞玩，把花園緊閉了，已三年矣。做皇帝的，非我父王而何？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      悟空「殿下、まあ、お待ちになって、お聞きください。あなたは烏鶏国王の太子です。五年前、国は旱魃で凶作となり、万民が苦しみ、皇帝は臣下とともに心を尽くして祈っていた。一滴の雨も降らぬところへ、鍾南山から一人の道士が来ました。風雨を呼び、石を金にする術に優れた男です。国王は目先の利に心を奪われ、その男と兄弟の契りを結んだ。そういうことがありましたね。」
      太子「ある、ある、ある。その先も話してみよ。」
      悟空「その後、この三年は全真の姿が見えません。では、今、王を名乗っているのは誰でしょう。」
      太子「確かに全真が一人来て、父上は兄弟の契りを結び、食事も寝るのも一緒にしていた。三年前、御花園で景色を楽しんでいたとき、その全真が神風を起こし、父上の手から金縁の白玉珪を奪って、鍾南山へ帰ってしまったのだ。父上は今も彼を慕っておられる。彼がいなくなったので、景色を楽しむ気もなくし、御花園を閉ざして、もう三年になる。皇帝であるのが父上でなくて、誰だというのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-029"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，哂笑不絕。太子再問不答，只是哂笑。太子怒道：「這廝當言不言，如何這等哂笑？」行者又道：「還有許多話哩，奈何左右人眾，不是說處。」太子見他言語有因，將袍袖一展，教軍士且退。那駕上官將急傳令，將三千人馬都出門外住扎。此時殿上無人，太子坐在上面，長老立在前邊，左手傍立著行者。本寺諸僧皆退。行者才正色上前道：「殿下，化風去的是你生身之父母；見坐位的，是那祈雨之全真。」太子道：「胡說，胡說。我父自全真去後，風調雨順，國泰民安。照依你說，就不是我父王了。還是我年孺，容得你；若我父王聽見你這反話，拿了去，碎屍萬段。」把行者咄的喝下來。行者對唐僧道：「何如？我說他不信，果然，果然。如今卻拿那寶貝進與他，倒換關文，往西方去罷。」三藏即將紅匣子遞與行者。行者接過來，將身一抖，那匣兒卒不見了。原是他毫毛變的，被他收上身去。卻將白玉珪雙手捧上，獻與太子。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      それを聞くと、悟空は鼻で笑い続けた。太子が問い直しても答えず、ただ笑っている。太子は腹を立てた。
      太子「こいつめ、言うべきことを言わずに、なぜそうして笑っている。」
      悟空「まだお話しすべきことは、たくさんございます。ただ、周りに人が多すぎて、ここでは話せません。」
      太子は、その言葉にわけがありそうだと思い、袍の袖を広げ、兵士たちにひとまず下がるよう命じた。護衛の官人や将軍が急いで命令を伝え、三千の兵はみな門の外へ出て陣を張った。堂内にほかの者はいなくなり、太子は上座に座り、三蔵はその前、悟空はその左脇に立った。寺の僧たちも全員下がっていた。悟空は初めて顔を改めて進み出た。
      悟空「殿下、風になって去ったとされているのは、あなたの生みの父です。今、王位に座っているのが、雨を祈ったあの全真なのです。」
      太子「でたらめだ、でたらめだ！　全真が去ってからというもの、父上の治める国では雨風が時節にかない、国は安らかで民も穏やかに暮らしている。お前の話では、それが父上ではないというのか。私がまだ若いからこそ、お前を我慢してやっているのだ。父上がお前のそんな反逆の言葉をお聞きになったら、捕らえて体を八つ裂きにするぞ。」
      太子は悟空を叱りつけ、下がらせた。悟空は三蔵に言った。
      悟空「どうです。信じないと言ったでしょう。やはり、やはりそのとおりです。もう、あの宝を差し上げて通行文書の手続きを済ませ、西方へ行きましょう。」
      三蔵は朱塗りの箱を悟空へ渡した。悟空が受け取って身をひと振りすると、箱はたちまち消えた。もともと自分の毛から作ったものだから、体へ収め直したのである。そして白玉珪を両手で捧げ、太子に差し出した。
    "translation_status": "reviewed"
  - "id": "xy-ch37-030"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "太子見了道：「好和尚，好和尚。你五年前本是個全真，來騙了我家的寶貝，如今又妝做和尚來進獻。」叫：「拿了！」一聲傳令，把長老諕得慌忙指著行者道：「你這弼馬溫，專撞空頭禍，帶累我哩。」行者近前一齊攔住道：「休嚷，莫走了風！我不叫做立帝貨，還有真名哩。」太子怒道：「你上來。我問你個真名字，好送法司定罪！」行者道：「我是那長老的大徒弟，名喚悟空孫行者。因與我師父上西天取經，昨宵到此覓宿。我師父夜讀經卷，至三更時分，得一夢。夢見你父王道，他被那全真欺害，推在御花園八角琉璃井內，全真變作他的模樣。滿朝官不能知。你年幼亦無分曉，禁你入宮，關了花園，大端怕漏了消息。你父王今夜特來請我降魔。我恐不是妖邪，自空中看了，果然是個妖精。正要動手拿他，不期你出城打獵。你箭中的玉兔，就是老孫。老孫把你引到寺裡，見師父，訴此衷腸，句句是實。你既然認得白玉珪，怎麼不念鞠養恩情，替親報仇？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      それを見た太子は言った。
      太子「よくもやったな、よくもやったな、和尚。五年前には全真の姿で来て、わが家の宝を騙し取ったくせに、今度は和尚に化けて献上するというのか。」
      太子「捕らえよ！」
      その命令に、三蔵はうろたえ、悟空を指さした。
      三蔵「この弼馬温（ひつばおん）め、いつも余計な災いを招いて、私まで巻き添えにする！」
      悟空は前へ出て、双方を制した。
      悟空「お静かに。秘密が漏れてしまいます。私は立帝貨という者ではありません。本当の名は別にあります。」
      太子は怒って言った。
      太子「こちらへ来い。本名を聞いて、法をつかさどる役所へ送り、罪を定めてやる。」
      悟空「私はその僧の一番弟子で、悟空孫行者（ごくうそんぎょうじゃ）と申します。師と西天へ経を取りに行く途中、昨夜ここへ宿を求めました。師は夜に経巻を読んでいて、三更のころに夢を見ました。そこにあなたの父王が現れ、全真に欺かれて御花園の八角形の瑠璃井へ突き落とされ、全真は自分の姿に化けたと話したのです。朝廷の官人たちは誰も気づかず、あなたも年若くて見抜けなかった。あなたを後宮へ入れず、庭を閉ざしたのは、おおかた秘密が漏れるのを恐れたためです。父王は今夜、わざわざ私に妖魔退治を頼みに来たのです。相手が妖怪でないかもしれないと思い、私は空から見てきましたが、果たして妖怪でした。さっそく捕らえようとしたところへ、思いがけず、あなたが狩りに出ていらした。あなたが矢を当てた白兎は、この私です。寺へお連れして師に会っていただき、事情を打ち明けました。一言一句、本当のことです。白玉珪を見覚えておいでなら、なぜ育てていただいた恩を思い、親の仇を討とうとなさらないのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-031"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那太子聞言，心中慘慼，暗自傷愁道：「若不信此言語，他卻有三分兒真實；若信了，怎奈殿上見是我父王？」這才是進退兩難心問口，三思忍耐口問心。行者見他疑惑不定，又上前道：「殿下不必心疑，請殿下駕回本國，問你國母娘娘一聲，看他夫妻恩愛之情，比三年前如何。只此一問，便知真假矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      太子はそれを聞き、胸が痛み、ひそかに悲しんで考えた。
      太子の思い「この話を信じないにしても、三割ほどは本当らしいところがある。だが信じるにしても、御殿には今、父上がいるではないか。」
      まさに、進むも退くも難しく、心は口に問い、三たび思い、耐え忍んで、口は心に問い返すのであった。悟空は、太子が疑い迷って決めかねているのを見て、もう一度進み出た。
      悟空「殿下、お迷いになることはありません。国へお戻りになり、国母である皇后にお尋ねください。夫婦の情愛が三年前と比べてどうか、と。その一言を尋ねれば、本物か偽者か分かります。」
    "translation_status": "reviewed"
  - "id": "xy-ch37-032"
    "section_id": "chapter-37"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那太子回心道：「正是。且待我問我母親去來。」他跳起身，籠了白玉珪就走。行者扯住道：「你這些人馬都回，卻不走漏消息，我難成功？但要你單人獨馬進城，不可揚名賣弄。莫入正陽門，須從後宰門進去。到宮中見你母親，切休高聲大氣，須是悄語低言。恐那怪神通廣大，一時走了消息，你娘兒們性命俱難保也。」太子謹遵教命。出山門吩咐將官：「穩在此扎營，不得移動。我有一事，待我去了就來，一同進城。」看他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch37-1808441"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第037回&oldid=1808441"
        "line_start": 178
        "line_end": 178
    "translation_ja": |-
      太子は思い直して言った。
      太子「そのとおりだ。母上に聞いてこよう。」
      飛び起き、白玉珪を袖に収めて行こうとしたが、悟空が引き止めた。
      悟空「この兵馬を全部連れて帰れば、秘密が漏れ、私の仕事が難しくなるではありませんか。あなた一人、一騎だけで城へ入り、大げさに名乗ったり、威勢を示したりしないでください。正陽門（せいようもん）からは入らず、後宰門（こうさいもん）から入るのです。後宮でお母上に会ったら、決して大声を出さず、声を潜めて話してください。妖怪は神通力が大きいので、ひとたび秘密が漏れれば、あなたもお母上も命が危うくなります。」
      太子はつつしんでその教えに従った。山門を出て、将軍たちに命じた。
      太子「ここにしっかり陣を敷き、動かずに待て。用事を一つ済ませて、すぐに戻る。それから一緒に城へ帰るのだ。」
      さて、その姿は、
    "translation_status": "reviewed"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-002"
      "description_ja": "底本の経名は「梁皇水懺」と「孔雀真經」。前者を一般に知られる「梁皇宝懺」や「水懺」のいずれかに勝手に直さず、後者も「真」の字を残した。『二十四尊得道羅漢傳』十三にも「梁皇水懺」の題名が見える。法界仏教総会の書目では梁皇宝懺と慈悲三昧水懺を別に掲げており、本訳は底本の呼び方を優先する。参照：https://zh.wikisource.org/zh/二十四尊得道羅漢傳/13 、https://drbachinese.org/online_reading/index.htm 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-006"
      "description_ja": "国王の話には「五年前」の旱魃、「三年」の旱魃、「二年」の共同生活、死後「三年」が併存する。年月を訳者の計算で整合させず、数をすべて残した。道士が来た山も底本は「鍾南山」であり、「終南山」に改めていない。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-007"
      "description_ja": "「三朝」は宮中の拝謁に関わる表現だが、この箇所の具体的な日取り・回数・制度は確定しない。数字を落とさず原語を残した。また、底本の「東嶽齊天」は「東嶽斉天」と訳し、広く見られる尊号「東嶽天斉」へ字順を直していない。国王が語る妖怪と諸神との関係は、国王の訴えとして示した。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-009"
      "description_ja": "三蔵の生い立ちの回想は、底本どおり母が賊に奪われてから「三か月」で三蔵を産んだと訳す。別の箇所の年月に合わせた変更は行わない。皇后に会えないことを「両親を失ったようなもの」とする箇所は、太子の母まで死んだという意味ではない。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-011"
      "description_ja": "「徒弟」と「土地」は中国語の音が近く、寝ぼけた八戒の聞き違いになっている。訳では三蔵の「弟子たち」と八戒の「土地」の対照を残した。夢から覚める直前の「舉步相送」以下は主語が省かれるため、客を送ろうとした三蔵が転び、その拍子に目覚めたものと解した。沙悟浄の諺は、外見の正直さや仁慈を鵜呑みにするなという戒めであり、条件文にはしていない。「務腳」は足元に寝て自分の体で相手の足を温める奉仕をいい、単なる足の手入れではない。参照：https://pedia.cloud.edu.tw/Entry/Detail?title=務腳 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-013"
      "description_ja": "「立帝貨」は悟空が小さな和尚の姿の宝物として付ける仮名。「帝を立てる品」という字面を示し、日本語の読みは「りっていか」と採用した。音韻上の語源は確定しておらず、後の人物名とは同一視しない。「上・下・中の五百年」の順序はこの台詞と、のちの説明とで異なるため、双方の原文どおりに残した。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-017"
      "description_ja": "狩りの詩の「貔熊」は勇猛な将士の比喩と解し、貔と熊の像を残した。「獐」はノロ、「狸」は山猫、「麋」は大鹿とし、雉と野鶏も別々に残す。動物名を特定の現生種へ厳密に同定した訳ではない。教育部異體字字典「貔」は猛獣と勇猛な将士の比喩の両義を掲げる。参照：https://dict.variants.moe.edu.tw/dictView.jsp?ID=71892&la=1 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-018"
      "description_ja": "「裹肚花，十八札」は、模様入りの腹当てと十八枚の鎧の札を描くものと解した。「裹肚」は腰腹に巻く布、「札」は鎧を作る小板の語義を資料で確認したが、十八枚が具体的にどの部分を組むかは確定しない。特定の甲冑様式や年代の断定は避けた。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=72508&la=0&powerMode=0 、https://chardb.iis.sinica.edu.tw/char/13139 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-029"
      "description_ja": "「生身之父母」は字面では「父母」だが、この会話で全真と入れ替わったと述べているのは父王であり、母は宮中にいる。新しい失踪者を作らないよう「生みの父」と訳した。底本の原文欄の「父母」は保持している。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-030"
      "description_ja": "悟空の名乗りは底本の字順どおり「悟空孫行者」。通常の地の文・話者名は引き続き悟空とする。夢について「昨夜」と説明したあとに「今夜」と言う箇所も、底本の時の言葉をそのまま保持した。 本文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch37-1808441"
      "segment_ids":
        - "xy-ch37-031"
      "description_ja": "「三分兒真實」は、ある程度真実らしいと迷う言い方。数の像を残して「三割ほど」としたが、太子が厳密な確率を算出したという意味ではない。 本文の欠落ではなく、解釈・校訂上の留保。"

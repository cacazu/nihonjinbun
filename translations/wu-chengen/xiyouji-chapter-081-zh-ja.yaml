    "translation_ja": |-
      第八十一回
      鎮海寺で心の猿が妖怪を見抜き　黒松林で三人の弟子が師を捜す
    "translation_status": "reviewed"
  - "id": "xy-ch81-002"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表三藏師徒到鎮海禪林寺，眾僧相見，安排齋供。四眾食畢，那女子也得些食力。漸漸天昏，方丈裡點起燈來。眾僧一則是問唐僧取經來歷，二則是貪看那女子，都攢攢簇簇，排列燈下。三藏對那初見的喇嘛僧道：「院主，明日離了寶山，西去的路途如何？」那僧雙膝跪下。慌得長老一把扯住道：「院主請起。我問你個路程，你為何行禮？」那僧道：「老師父明日西行，路途平正，不須費心。只是眼下有件事兒不尷尬，一進門就要說，恐怕冒犯洪威。卻才齋罷，方敢大膽奉告：老師東來，路遙辛苦，都在小和尚房中安歇甚好；只是這位女菩薩，不方便，不知請他那裡睡好。」三藏道：「院主，你不要生疑，說我師徒們有甚邪意。早間打黑松林過，撞見這個女子綁在樹上。小徒孫悟空不肯救他，是我發菩提心，將他救了。到此，隨院主送他那裡睡去。」那僧謝道：「既老師寬厚，請他到天王殿裡，就在天王爺爺身後，安排個草鋪，教他睡罷。」三藏道：「甚好，甚好。」遂此時眾小和尚引那女子往殿後睡去。長老就在方丈中，請眾院主自在，遂各散去。三藏吩咐悟空：「辛苦了，早睡早起。」遂一處都睡了，不敢離側，護著師父。漸入夜深，正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      さて、三蔵（さんぞう）と弟子たちは鎮海禅林寺（ちんかいぜんりんじ）に着き、僧たちと挨拶を交わして、精進料理のもてなしを受けた。四人が食べ終わるころには、女の妖怪も食事をしていくらか力を取り戻していた。しだいに日が暮れ、方丈（ほうじょう）に灯がともされた。僧たちは、三蔵の取経のいきさつを聞きたいのと、あの女を眺めたいのとで、押し合いへし合い灯の下に並んだ。
      三蔵は最初に会った喇嘛僧（らまそう）に尋ねた。三蔵「院主、明日こちらのお寺を発ってから、西への道はどうなっていますか。」
      喇嘛僧が両膝をつくと、三蔵は慌ててその腕をつかんだ。三蔵「院主、お立ちください。私は道を尋ねただけです。なぜそんなお辞儀をなさるのです。」
      喇嘛僧「長老、明日から西への道は平らですから、ご心配は要りません。ただ、いま少々困っていることがございます。お入りになったときから申し上げたかったのですが、お気を悪くされるのが怖くて、食事のすんだ今ようやく思いきってお話しするのです。東から遠い道を来られて、お疲れでしょう。皆さまには私どもの部屋でお休みいただけばよろしいのですが、この女菩薩（にょぼさつ）だけは、そうもまいらず、どこでお休みいただけばよいか分かりません。」
      三蔵「院主、私たちに何かよこしまな心があるのではとお疑いにならないでください。朝、黒松林（こくしょうりん）を通ったところ、この女が木に縛りつけられていたのです。弟子の孫悟空（そんごくう）は助けまいとしましたが、私が菩提心（ぼだいしん）を起こして救い出しました。ここまで来たのですから、寝る場所は院主にお任せします。」
      喇嘛僧は礼を述べた。喇嘛僧「長老がお許しくださるのでしたら、天王殿（てんのうでん）へお連れして、天王さまの像の後ろにわらを敷き、そこで休んでいただきましょう。」
      三蔵「結構です。結構です。」
      そこで小僧たちは女の妖怪を堂の後ろへ案内した。三蔵は方丈にとどまり、院主たちにどうぞお休みくださいと告げたので、皆それぞれ引き取った。
      三蔵は悟空（ごくう）に言いつけた。三蔵「ご苦労だった。早く寝て、早く起きるのだぞ。」
      弟子たちは皆その場で眠り、師を守って、そばを離れようとしなかった。夜はしだいに更けてゆく。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch81-003"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      玉兔高升萬籟寧，天街寂靜斷人行。
      銀河耿耿星光燦，鼓發譙樓趲換更。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 122
        "line_end": 123
    "translation_ja": |-
      玉兎（ぎょくと）は高く昇り、万の音も静まって、
      天上の道はひっそりと、人影も絶える。
      銀河は明るく、星はきらめき、
      物見の楼から太鼓が鳴り、夜の時が足早に替わる。
    "translation_status": "reviewed"
  - "id": "xy-ch81-004"

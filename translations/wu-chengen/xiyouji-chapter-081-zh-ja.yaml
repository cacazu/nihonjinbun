    "kind": "paragraph"
    "origin": "source"
    "source_text": "一宵晚話不題。及天明了，行者起來，教八戒、沙僧收拾行囊、馬匹，卻請師父走路。此時長老還貪睡未醒。行者近前叫聲：「師父。」那師父把頭擡了一擡，又不曾答應得出。行者問：「師父怎麼說？」長老呻吟道：「我怎麼這般頭懸眼脹，渾身皮骨皆疼？」八戒聽說，伸手去摸摸身上，有些發熱。獃子笑道：「我曉得了，這是昨晚見沒錢的飯，多吃了幾碗，倒沁著頭睡，傷食了。」行者喝道：「胡說！等我問師父，端的何如。」三藏道：「我半夜之間起來解手，不曾戴得帽子，想是風吹了。」行者道：「這還說得是。如今可走得路麼？」三藏道：「我如今起坐不得，怎麼上馬？但只誤了路啊。」行者道：「師父說那裡話。常言道：『一日為師，終身為父。』我等與你做徒弟，就是兒子一般。又說道：『養兒不用阿金溺銀，只是見景生情便好。』你既身子不快，說甚麼誤了行程？便寧耐幾日何妨？」兄弟們都伏侍著師父，不覺的早盡午來昏又至，良宵才過又侵晨。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      その夜の話はさておく。夜が明けると悟空は起き出し、八戒（はっかい）と沙悟浄（さごじょう）に荷物と馬の支度をさせて、師に出発を促そうとした。ところが三蔵はまだ眠ったまま、目を覚まさない。悟空がそばに寄った。悟空「お師匠さま。」
      三蔵は少し頭を持ち上げたが、返事もできなかった。
      悟空「お師匠さま、どうなさったんです。」
      三蔵はうめいた。三蔵「どうしてこんなに頭がふらつき、目が張って、体じゅう皮も骨も痛むのだろう。」
      八戒が手を伸ばして体に触ると、少し熱があった。八戒は笑った。八戒「分かったぞ。昨夜はただ飯だからと何杯も余計に食べて、頭を低くして寝たもんだから、食べすぎで腹を悪くしたんですよ。」
      悟空「でたらめを言うな！　何があったのか、お師匠さまに聞く。」
      三蔵「夜中に用を足しに起きたとき、帽子をかぶらなかった。風に当たったせいだろう。」
      悟空「それならまだ分かります。いま、道を行けますか。」
      三蔵「起き上がって座ることさえできないのに、どうして馬に乗れよう。ああ、旅が遅れてしまう。」
      悟空「お師匠さま、何をおっしゃるんです。『一日でも師となった人は、生涯の父』と言うでしょう。私たち弟子は、子供も同じです。『子を育てるのは、金の糞や銀の小便をさせるためではない。親の様子を見て、思いやってくれればよい』とも言います。体の具合が悪いのに、旅の遅れなんて気にしなくていい。何日かじっと休んだって、構わないでしょう。」
      弟子たちはそろって師の世話をした。いつしか朝は昼となり、夕暮れが訪れ、長い夜が明ければ、また朝になった。
    "translation_status": "reviewed"
  - "id": "xy-ch81-005"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "光陰迅速，早過了三日。那一日，師父欠身起來叫道：「悟空，這兩日病體沉痾，不曾問得你：那個脫命的女菩薩，可曾有人送些飯與他吃？」行者笑道：「你管他怎的？且顧了自家的病著。」三藏道：「正是，正是。你且扶我起來，取出我的紙、筆、墨，寺裡借個硯臺來使使。」行者道：「要怎的？」長老道：「我要修一封書，並關文封在一處，你替我送上長安駕下，見太宗皇帝一面。」行者道：「這個容易，我老孫別事無能，若說送書，人間第一。你把書收拾停當取與我，我一觔斗送到長安，遞與唐王，再一觔斗轉將回來，你的筆硯還不乾哩。但只是你寄書怎的？且把書意念念我聽，念了再寫不遲。」長老滴淚道：「我寫著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      時は足早に過ぎ、もう三日がたった。その日、三蔵は少し身を起こして呼んだ。三蔵「悟空、この二日は病が重く、聞くこともできなかったが、命を救ったあの女菩薩には、誰か食事を届けているか。」
      悟空は笑った。悟空「あんな女のことを気にして、どうするんです。まずご自分の病気のことだけお考えください。」
      三蔵「そうだな、そうだな。私を助け起こして、紙と筆と墨を出しておくれ。寺から硯も一つ借りてきてほしい。」
      悟空「何をなさるんです。」
      三蔵「手紙を一通書いて、通行の証文と一緒に封をする。お前が長安（ちょうあん）へ持っていって、太宗皇帝（たいそうこうてい）にお目通りしてくれないか。」
      悟空「そんなことなら簡単です。俺はほかのことはともかく、手紙を届けることなら天下一です。書き終えて渡してくだされば、ひと筋斗（きんと）で長安へ行って唐王（とうおう）に届け、もうひと筋斗で戻ってきますよ。筆と硯もまだ乾かないうちにね。しかし、何のための手紙です。まず内容を聞かせてください。書くのはそれからでも遅くないでしょう。」
      三蔵は涙をこぼして言った。三蔵「こう書こうと思うのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-006"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      臣僧稽首三頓首，萬歲山呼拜聖君；
      文武兩班同入目，公卿四百共知聞：
      當年奉旨離東土，指望靈山見世尊。
      不料途中遭厄難，何期半路有災迍。
      僧病沉痾難進步，佛門深遠接天門。
      有經無命空勞碌，啟奏當今別遣人。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 128
        "line_end": 133
    "translation_ja": |-
      三蔵「臣たる僧、頭を垂れ、三度額を地につけ、
      万歳の声高く、聖なる君を拝します。
      文武の両列にもお読みいただき、
      四百の公卿にもお聞きいただきたい。
      かつて勅命を受けて東土（とうど）を発ち、
      霊山（れいざん）で世尊（せそん）に会うことを願いました。
      思いもよらず、道中で厄難に遭い、
      旅半ばで災いを受けようとは。
      私は重い病にかかり、先へ進めず、
      仏の門は天へ続くほど、はるか遠くにあります。
      経があっても命がなければ、骨折りはむなしいばかり。
      今上陛下に申し上げます。どうかほかの者をお遣わしください。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-007"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽得此言，忍不住呵呵大笑道：「師父，你忒不濟，略有些些病兒，就起這個意念。你若是病重，要死要活，只消問我，我老孫自有個本事：問道那個閻王敢起心？那個判官敢出票？那個鬼使來勾取？若惱了我，我拿出那大鬧天宮之性子，又一路棍，打入幽冥，捉住十代閻王，一個個抽了他的筋，還不饒他哩。」三藏道：「徒弟呀，我病重了，切莫說這大話。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      これを聞いた悟空は、こらえきれず、からからと笑った。悟空「お師匠さま、意気地がなさすぎますよ。少し病気をしただけで、もうそんなことを考えるなんて。病が重くなって、生きるか死ぬかというときには、俺に相談すればいい。俺にはちゃんと手があります。いったい、どの閻王（えんおう）がそんな気を起こせる。どの判官（はんがん）が呼び出し状を出せる。どの鬼の使いが魂を引き立てに来られるっていうんです。俺を怒らせたら、天宮（てんきゅう）で大暴れしたころの気性を出して、棒を振り回しながら冥界（めいかい）へ乗り込み、十王（じゅうおう）をつかまえて、一人ずつ筋を引き抜いてやる。それでもまだ許しませんよ。」
      三蔵「悟空、私は重病なのだ。そんな大言壮語はやめておくれ。」

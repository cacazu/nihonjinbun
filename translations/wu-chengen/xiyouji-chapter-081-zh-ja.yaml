    "source_languages": []
    "source_locations": []
    "translation_ja": "原文「願見祇園釋世尊低頭看見心」は句切りが欠けたように続き、「秇三乘慈航共法雲」の秇は藝の古字である。訳では祇園の世尊を願い見て、低頭して心を見るという対句に区切り、慈航・法雲は教えによって渡る比喩と読んだ。底本の文字と句読点は変更していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-09-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "年齢・背丈・体つきの列挙と、その後の新旧・生熟・村俏は、前後で僧たちの勤行の様子を述べるものとして訳した。ただし底本は列挙の主語を逐一明示せず、信者側の姿も重なる余地がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-10-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「不上我方便慈悲大法乘」は語のつながりが明瞭でない。鳥たちの争いを僧の修行の外に置く趣旨と解したが、厳密な構文は留保する。原文の否定を落とさず訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-11-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "仙丹や酒の数量は悟空の自慢の言い方であり、過去の事件の数量を訂正する語り手の説明ではない。「白でも黒でもない」「長すぎも短すぎもしない」の対句も、その言い回しを残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-12-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「公了」は、この場面に適した名詞としては確定しにくい。別の流布本文で「公子」とする例もあるが、原文は改めず、宴に招かれた者という広い意味で「客」と訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-13-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "小僧の姿をしているのは悟空本人である。変装中も通常の話者ラベルは悟空を継続し、別の子供を登場させたようには訳さない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-14-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "風の詩は、塵を上げると星の光が見えるという句と、木を倒すと月が暗くなるという句を対にする。前後を自然現象として整合させるための否定補入はしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-15-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文「偷生㧚熟」は、生や煮た物を盗み食いする字面を持つ方言的表現。㧚は教育部字典で「すくい取る」と説明される。密通で相手を選ばないという解釈もあるが、女性の盗み食いをいう方言解もあり、一義に断定せず食物の比喩を保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-16-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「不會洞房花燭」は若い夫が婚礼の夜の交わりを知らないと読む。夫の具体的な年齢や身体能力は補わず、女が語る身の上話として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-17-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「臊根」は男性の性器をいう卑俗な呼称。手を伸ばす動作の直後に悟空が手を受け止めるため、接触を完遂したと断定せず「つかもうとした」とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-18-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「小坐跌法」は、座った状態から相手を倒す小さな投げ技と解した。特定の現代格闘技の技名へ同定していない。悟空の「我的兒」と女の「你的娘」は相手をからかい、挑発する親子の呼び合いで、実の親子関係を述べるものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-19-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「如來吩咐下天曹」は命令と天界の役所を結ぶ圧縮された詩句で、誰がどこへ移されたかまでこの句だけで確定しない。訳は仰せが天曹へ下るという形にとどめ、命令の内容を補わなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-20-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『晋書』張華伝には、雷煥が地中から二振りの名剣を掘り出した説話がある。妖怪が恐れない名高い武器の例であり、この場に雷煥が現れたり、その剣が持ち込まれたりする描写ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-21-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『晋書』王覧伝には、呂虔が三公に至る人物だけが帯びるべきだとされた刀を、王祥へ譲った話がある。原文の剣と刀を区別し、当該の武器の銘は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-22-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この詩で、金の鼻・雪の毛、霊山との関わり、托塔天王の娘、哪吒のきょうだい、最後に鼠が精となった姿という順で語られる。この時点では本名や親族関係の詳しい性質を確定する名乗りはない。訳でも、その範囲にとどめる。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-23-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「玉樓抓翡翠、金殿碎鴛鴦」は豪華な楼殿と翡翠・鴛鴦を用いる戦闘の比喩。翡翠が鳥か宝玉・装飾か、鴛鴦が鳥か文様かは、この句だけでは断定しにくい。具体的に建物や宝物を壊した事件へはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-24-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の数は三十二である。一般的な三十三天という語に合わせて訂正しない。像や神々を生きた観客のように描く詩の擬人化を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-25-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「靈山大將」は語り手が沙悟浄を称える句。ここで新たな任官が行われたとか、現在すでに霊山に赴任しているという意味にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-26-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "管仲と鮑叔は、金を分ける際にも相手の境遇を理解する友情の典型。孫臏と龐涓は、同じ兵学を学びながら敵対した人物として知られる。原文の「管鮑」「孫龐」は、この二組が分かる名へ開いた。『史記』管晏列伝・孫子呉起列伝を参照。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-27-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "女の宿泊は初夜だけだったとする僧の証言をそのまま残した。一行が三日滞在したこと、寺で僧が食われたこととの関係を、訳者の補足で埋めてはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-28-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "強盗や妖怪との共謀は、怒った悟空の非難であって、語り手が罪を立証したものではない。供え物の豚と羊、共謀の二段階を省略しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-29-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「三人採住馬」。採は引き止める・取り押さえるような動作と解したが、三人それぞれが馬に乗っていたとは書かれていない。馬を三頭に増やさず、三人と白馬の行動として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-30-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「打仰」は、ここでは後悔して前言をひるがえす意味。教育部の辞書もこの台詞をその語義の例に挙げる。仰向けに倒れるという別義にしない。"
    "translation_status": "reviewed"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-004"
      "description_ja": "八戒の食傷説と三蔵自身の風の説明は、それぞれの見立てとして残した。現代医学上の診断や治療法を示すものではない。「倒沁著頭」は頭を低くして寝ると解したが、姿勢の細部には留保がある。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-005"
      "description_ja": "原文はここで三日が過ぎたといいながら、三蔵の台詞では「這兩日」とする。経過日数と本人の言い方を一つにそろえず残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-008"
      "description_ja": "原文「往下一試」「屣了一粒米」の字はそのまま保存した。試の具体的な動きは明瞭ではないが、居眠り後に左足で米を踏む文脈から、足を下へ伸ばしたはずみと解した。異本の「失」などへ無断訂正はしていない。三日の病との因果は悟空が語る宗教的説明である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-008"
      "description_ja": "「佛不與你眾生為念」は、仏が八戒のような衆生を一々問題にしないという慰めと解した。仏教一般の教義として断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-009"
      "description_ja": "原文「願見祇園釋世尊低頭看見心」は句切りが欠けたように続き、「秇三乘慈航共法雲」の秇は藝の古字である。訳では祇園の世尊を願い見て、低頭して心を見るという対句に区切り、慈航・法雲は教えによって渡る比喩と読んだ。底本の文字と句読点は変更していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-009"
      "description_ja": "年齢・背丈・体つきの列挙と、その後の新旧・生熟・村俏は、前後で僧たちの勤行の様子を述べるものとして訳した。ただし底本は列挙の主語を逐一明示せず、信者側の姿も重なる余地がある。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-009"
      "description_ja": "「不上我方便慈悲大法乘」は語のつながりが明瞭でない。鳥たちの争いを僧の修行の外に置く趣旨と解したが、厳密な構文は留保する。原文の否定を落とさず訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-011"
      "description_ja": "底本の「公了」は、この場面に適した名詞としては確定しにくい。別の流布本文で「公子」とする例もあるが、原文は改めず、宴に招かれた者という広い意味で「客」と訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-015"
      "description_ja": "風の詩は、塵を上げると星の光が見えるという句と、木を倒すと月が暗くなるという句を対にする。前後を自然現象として整合させるための否定補入はしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-016"
      "description_ja": "原文「偷生㧚熟」は、生や煮た物を盗み食いする字面を持つ方言的表現。㧚は教育部字典で「すくい取る」と説明される。密通で相手を選ばないという解釈もあるが、女性の盗み食いをいう方言解もあり、一義に断定せず食物の比喩を保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-017"
      "description_ja": "「不會洞房花燭」は若い夫が婚礼の夜の交わりを知らないと読む。夫の具体的な年齢や身体能力は補わず、女が語る身の上話として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-019"
      "description_ja": "「臊根」は男性の性器をいう卑俗な呼称。手を伸ばす動作の直後に悟空が手を受け止めるため、接触を完遂したと断定せず「つかもうとした」とした。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-019"
      "description_ja": "「小坐跌法」は、座った状態から相手を倒す小さな投げ技と解した。特定の現代格闘技の技名へ同定していない。悟空の「我的兒」と女の「你的娘」は相手をからかい、挑発する親子の呼び合いで、実の親子関係を述べるものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-020"
      "description_ja": "「如來吩咐下天曹」は命令と天界の役所を結ぶ圧縮された詩句で、誰がどこへ移されたかまでこの句だけで確定しない。訳は仰せが天曹へ下るという形にとどめ、命令の内容を補わなかった。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-022"
      "description_ja": "「玉樓抓翡翠、金殿碎鴛鴦」は豪華な楼殿と翡翠・鴛鴦を用いる戦闘の比喩。翡翠が鳥か宝玉・装飾か、鴛鴦が鳥か文様かは、この句だけでは断定しにくい。具体的に建物や宝物を壊した事件へはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-022"
      "description_ja": "底本の数は三十二である。一般的な三十三天という語に合わせて訂正しない。像や神々を生きた観客のように描く詩の擬人化を残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-024"
      "description_ja": "「靈山大將」は語り手が沙悟浄を称える句。ここで新たな任官が行われたとか、現在すでに霊山に赴任しているという意味にはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-025"
      "description_ja": "女の宿泊は初夜だけだったとする僧の証言をそのまま残した。一行が三日滞在したこと、寺で僧が食われたこととの関係を、訳者の補足で埋めてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-030"
      "description_ja": "原文は「三人採住馬」。採は引き止める・取り押さえるような動作と解したが、三人それぞれが馬に乗っていたとは書かれていない。馬を三頭に増やさず、三人と白馬の行動として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch81-1455630"
      "segment_ids":
        - "xy-ch81-032"
      "description_ja": "「打仰」は、ここでは後悔して前言をひるがえす意味。教育部の辞書もこの台詞をその語義の例に挙げる。仰向けに倒れるという別義にしない。 原文の欠落ではなく、解釈・校訂上の留保。"

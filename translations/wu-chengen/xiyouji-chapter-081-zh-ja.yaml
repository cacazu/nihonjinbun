  - "id": "xy-ch81-008"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒上前道：「師兄，師父說不好，你只管說好，十分不尷尬。我們趁早商量，先賣了馬，典了行囊，買棺木送終散火。」行者道：「獃子又胡說了，你不知道。師父是我佛如來第二個徒弟，原叫做金蟬長老，只因他輕慢佛法，該有這場大難。」八戒道：「哥啊，師父既是輕慢佛法，貶回東土，在是非海內，口舌場中，託化做人身，發願往西天拜佛求經，遇妖精就捆，逢魔頭就吊，受諸苦惱，也夠了，怎麼又叫他害病？」行者道：「你那裡曉得。老師父不曾聽佛講法，打了一個盹，往下一試，左腳屣了一粒米，下界來，該有這三日病。」八戒驚道：「像老豬吃東西潑潑撒撒的，也不知害多少年代病是。」行者道：「兄弟，佛不與你眾生為念，你又不知。人云：『鋤禾日當午，汗滴禾下土。誰知盤中餐，粒粒皆辛苦。』師父只今日一日，明日就好了。」三藏道：「我今日比昨日不同：咽喉裡十分作渴。你去那裡有涼水，尋些來我吃。」行者道：「好了，師父要水吃，便是好了。等我取水去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      八戒が進み出た。八戒「兄貴、お師匠さまが悪いと言うのに、兄貴はいい、いいとばかり言って、まるで話にならないぞ。早く相談して、まず馬を売り、荷物を質に入れて、棺を買おう。最期をみとって、それぞれ別れるんだ。」
      悟空「ばかがまた、でたらめを言い出した。お前は知らないんだ。お師匠さまは、わが仏、如来（にょらい）の二番目の弟子で、もとは金蝉長老（きんせんちょうろう）とおっしゃった。仏法を軽んじたから、この大難に遭わなければならないのさ。」
      八戒「兄貴、仏法を軽んじて東土へ落とされ、善悪の波が立つ海、言い争いの絶えない世に、人の身で生まれ変わった。それで、西天（さいてん）へ行って仏を拝み、経を求めると願を立て、妖怪に出会えば縛られ、魔物に遭えば吊るされ、さんざん苦しんできたじゃないか。もう十分だろう。どうしてまた病気にさせるんだ。」
      悟空「お前には分からん。お師匠さまは仏の説法を聞かずに居眠りをし、足を下へ伸ばしたはずみに、左足で米を一粒踏んだんだ。だから下界に来て、この三日間の病気を受けることになったのさ。」
      八戒は驚いた。八戒「俺なんか、食べるたびにぼろぼろこぼすぞ。それじゃ、何年病気をすればいいんだ。」
      悟空「弟よ、仏はお前のような衆生のことを、一々問題にはなさらない。お前はそれも知らんのか。こんな詩があるだろう。『真昼に畑の草を鋤き、汗は苗の下の土に滴る。皿に盛られた飯の、その一粒一粒が苦労のたまものだと、誰が知ろう。』お師匠さまは今日一日だけさ。明日にはよくなる。」
      三蔵「今日は昨日とは違って、ひどく喉が渇く。どこかに冷たい水がないか、少し探してきておくれ。」
      悟空「よかった。水を飲みたいというのは、治るしるしですよ。さっそく汲んできます。」

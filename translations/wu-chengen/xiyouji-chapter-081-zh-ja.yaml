        "line_end": 145
    "translation_ja": |-
      風が通り過ぎたと思うと、にわかに蘭と麝香（じゃこう）の香りが漂い、玉飾りの触れ合う音がした。悟空が少し身を起こして顔を上げると、なんと、美しい女がまっすぐ仏殿へ上がってくる。悟空は口の中でもごもご言いながら、ひたすら経を唱え続けた。女の妖怪は近寄って、いきなり抱きついた。女の妖怪「小さなお坊さま、何のお経を読んでいるの。」
      悟空「願をかけて、読むと誓った経です。」
      女の妖怪「ほかの人はみんな、気楽に寝ているのに、なぜあなたはまだ経を読むの。」
      悟空「読むと誓ったのだから、読まないわけにはいきません。」
      女の妖怪は抱き寄せて口づけをした。女の妖怪「私と裏へ行って、遊びましょうよ。」
      悟空はわざと顔をそむけた。悟空「あんたは、ちょっと心得違いをしているね。」
      女の妖怪「人相が見られるの。」
      悟空「少しはね。」
      女の妖怪「私の相は、どんなふう。」
      悟空「生でも煮たものでも、あれこれつまみ食いをして、夫の親に追い出された相に見える。」
      女の妖怪「当たらない、当たらない。私はね、」
    "translation_status": "reviewed"
  - "id": "xy-ch81-017"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      不是公婆趕逐，不因㧚熟偷生。
      奈我前生命薄，投配男子年輕。
      不會洞房花燭，避夫逃走之情。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 147
        "line_end": 149
    "translation_ja": |-
      女の妖怪「夫の親に追われたのではなく、
      生でも煮たものでも、つまみ食いしたのでもない。
      前の世から薄幸の身で、
      嫁いだ夫は、あまりにも若かった。
      婚礼の夜の営みも知らないので、
      夫を避けて、逃げ出してきたの。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-018"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "趁如今星光月皎，也是有緣千里來相會。我和你到後園中交歡配鸞儔去也。」行者聞言，暗點頭道：「那幾個愚僧，都被色慾引誘，所以傷了性命。他如今也來哄我。」就隨口答應道：「娘子，我出家人年紀尚幼，卻不知甚麼交歡之事。」女子道：「你跟我去，我教你。」行者暗笑道：「也罷，我跟他去，看他怎生擺佈。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      女の妖怪「いまは星も月も明るいし、これも縁があれば千里（り）離れていても巡り会うというものでしょう。私と裏庭へ行って、愛を交わし、仲のよい夫婦になりましょうよ。」
      悟空は聞いて、心の中でうなずいた。悟空の心の声「ばかな坊主たちは、みんな色欲に誘われて命を落としたんだな。今度は俺までだまそうとしている。」
      悟空は話を合わせた。悟空「奥さん、私はまだ年若い出家ですから、愛を交わすなんて、どんなことか知りません。」
      女の妖怪「ついていらっしゃい。私が教えてあげる。」
      悟空は心の中で笑った。悟空の心の声「よかろう。ついていって、どんな手で来るか見てやる。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-019"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個摟著肩，攜著手，出了佛殿，徑至後邊園裡。那怪把行者使個絆子腿，跌倒在地。口裡「心肝哥哥」的亂叫，將手就去掐他的臊根。行者道：「我的兒，真個要吃老孫哩。」卻被行者接住他手，使個小坐跌法，把那怪一轆轤掀翻在地上。那怪口裡還叫道：「心肝哥哥，你倒會跌你的娘哩。」行者暗算道：「不趁此時下手他，還到幾時？正是：『先下手為強，後下手遭殃。』」就把手一叉，腰一躬，一跳跳起來，現出原身法像，掄起金箍鐵棒，劈頭就打。那怪倒也吃了一驚。他心想道：「這個小和尚，這等利害。」打開眼一看，原來是那唐長老的徒弟姓孫的。他也不懼他。你說這精怪是甚麼精怪："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      二人は肩を抱き、手を取り合って仏殿を出ると、まっすぐ裏庭へ行った。女の妖怪は足をかけて悟空を地面に倒し、女の妖怪「いとしいあなた、いとしいあなた」としきりに呼びながら、手を伸ばして悟空の男根をつかもうとした。
      悟空「俺のかわいい娘よ、本当に俺を食うつもりだな。」
      悟空はその手を受け止め、座ったまま投げる小技で、女の妖怪をごろりと地面へひっくり返した。それでも女の妖怪は呼び続けた。女の妖怪「いとしいあなた、よくもお母ちゃんを投げ飛ばしてくれたわね。」
      悟空は心で考えた。悟空の心の声「いま手を下さずに、いつやるんだ。『先に手を出せば勝ち、後からでは災いを受ける』というやつだ。」
      両手を開き、腰をかがめ、一気に跳び上がると、本来の姿を現した。金箍鉄棒（きんこてつぼう）を振り上げ、真っ向から打ち下ろす。さすがの女の妖怪も驚いた。女の妖怪の心の声「この小僧、こんなに手ごわいのか。」
      目を見開いてよく見れば、あの唐の長老の弟子、孫（そん）という者ではないか。それでも女の妖怪は恐れなかった。さて、この妖怪とは、どんな妖怪なのか。
    "translation_status": "reviewed"
  - "id": "xy-ch81-020"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": "金作鼻，雪鋪毛。地道為門屋，安身處處牢。養成三百年前氣，曾向靈山走幾遭。一飽香花和蠟燭，如來吩咐下天曹。托塔天王恩愛女，哪吒太子認同胞。也不是個填海鳥，也不是個戴山鰲。也不怕的雷煥劍，也不怕的呂虔刀。往往來來，一任他水流江漢闊；上上下下，那論他山聳泰恆高。你看他月貌花容嬌滴滴，誰識得是個鼠老成精逞點豪。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      金の鼻に、雪を敷いたような毛。
      地の中の通り道を門と家にし、
      どこへ身を置いても、安全堅固。
      三百年前から気を養い、
      霊山へも、幾度か足を運んだ。
      香花と蝋燭を腹いっぱい食らい、
      如来の仰せが天曹（てんそう）へ下った。
      托塔天王（たくとうてんのう）にかわいがられる娘であり、
      哪吒太子（なたたいし）はきょうだいとして認めている。
      海を埋めようとする鳥でもなく、
      山を頭に載せる大亀でもない。
      雷煥（らいかん）の剣も恐れず、
      呂虔（りょけん）の刀も恐れない。
      行きつ戻りつ、長江（ちょうこう）や漢水（かんすい）がいかに広く流れても、思いのまま。
      上り下り、泰山（たいざん）や恒山（こうざん）がどれほど高くそびえても、意に介さない。
      月のような顔、花のような容貌、しなやかなその姿を見よ。
      これが、年経た鼠が精となり、威勢を張っているものだと、誰が知ろう。
    "translation_status": "reviewed"
  - "id": "xy-ch81-021"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他自恃的神通廣大，便隨手架起雙股劍，玎玎璫璫的響，左遮右格，隨東倒西。行者雖強些，卻也撈他不倒。陰風四起，殘月無光。你看他兩人。後園中一場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 156
        "line_end": 156
    "translation_ja": "女の妖怪は自分の神通力を頼み、二振りの剣をさっと構えた。じゃんじゃん、がんがんと音を立て、左で受け、右で払い、東へ西へ身をかわす。悟空のほうがやや勝ってはいるが、倒すには至らない。不気味な風が四方から起こり、欠けた月も光を失った。裏庭で繰り広げられる二人の激しい戦いをご覧あれ。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-022"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": "陰風從地起，殘月蕩微光。闃靜梵王宇，闌珊小鬼廊，後園裡一片戰爭場。孫大士，天上聖；毛姹女，女中王：賭賽神通未肯降。一個兒扭轉芳心嗔黑禿，一個兒圓睜慧眼恨新妝。兩手劍飛，那認得女菩薩；一根棍打，狠似個活金剛。響處金箍如電掣，霎時鐵白耀星芒。玉樓抓翡翠，金殿碎鴛鴦。猿啼巴月小，雁叫楚天長。十八尊羅漢暗暗喝采，三十二諸天個個慌張。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      陰気な風が地から吹き上がり、
      欠けた月のかすかな光が揺らぐ。
      仏をまつる堂はひっそりとし、
      小鬼の並ぶ廊は物寂しく、
      裏庭一面が戦場となる。
      孫大士（そんだいし）、天上の聖者。
      毛姹女（もうたじょ）、女の中の王。
      神通力を競い、どちらも降参しようとしない。
      一方は女心を翻し、黒い坊主に腹を立て、
      一方は智慧の目を見開いて、着飾った女を憎む。
      両手の剣は飛ぶように動き、女菩薩とはとても見えず、
      一本の棒は打ちまくり、生きた金剛力士（こんごうりきし）もかくやの激しさ。
      金箍（きんこ）が鳴り響けば稲妻が走り、
      またたく間に、白い鉄の光が星のようにきらめく。
      玉の楼で翡翠（ひすい）をつかみ、金の殿で鴛鴦（おしどり）を砕くかのよう。
      猿は巴（は）の小さな月に鳴き、雁は楚（そ）のはるかな空に叫ぶ。
      十八人の羅漢（らかん）はひそかに喝采し、
      三十二の諸天（しょてん）は、一人残らず慌てふためく。
    "translation_status": "reviewed"
  - "id": "xy-ch81-023"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那孫大聖精神抖擻，棍兒沒半點差池。妖精自料敵他不住，猛可的眉頭一蹙，計上心來，抽身便走。行者喝道：「潑貨，那走？快快來降。」那妖精只是不理，直往後退。等行者趕到緊急之時，即將左腳上花鞋脫下來，吹口仙氣，念個咒語，叫一聲：「變！」就變做本身模樣，使兩口劍舞將來；真身一幌，化陣清風而去。這卻不是三藏的災星？他便徑撞到方丈裡，把唐三藏攝將去雲頭上，杳杳冥冥，霎霎眼，就到了陷空山，進了無底洞，叫小的們安排素筵席成親不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空は気力を奮い立たせ、棒のさばきには少しの狂いもなかった。女の妖怪はかなわないと見て、ふと眉をひそめ、計略を思いついた。身を引いて逃げ出す。
      悟空「このあばずれ、どこへ行く！　さっさと降参しろ。」
      女の妖怪は返事もせず、後ろへ退き続けた。悟空が激しく追い詰めてきたところで、左足の花模様の靴を脱ぎ、仙気（せんき）を吹きかけ、呪文を唱えた。女の妖怪「変われ！」
      靴は女の妖怪そっくりになり、二本の剣を振るって向かってきた。本体のほうは身をひらりと動かし、一陣の清風となって去った。これこそ三蔵に災いをもたらす星ではないか。女の妖怪はまっすぐ方丈へ押し入り、三蔵をさらって雲の上へ連れ去った。暗く遠い空を、またたくうちに陷空山（かんくうざん）まで飛び、無底洞（むていどう）へ入ると、手下たちに精進の宴を用意させ、婚礼を挙げることにした。こちらの話はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch81-024"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者鬥得心焦性燥，閃一個空，一棍把那妖精打落下來，乃是一隻花鞋。行者曉得中了他計，連忙轉身來看師父，那有個師父。只見那獃子和沙僧口裡嗚哩嗚哪說甚麼。行者怒氣填胸，也不管好歹，撈起棍來一片打，連聲叫道：「打死你們，打死你們。」那獃子慌得走也沒路。沙僧卻是個靈山大將，見得事多，就軟款溫柔，近前跪下道：「兄長，我知道了，想你要打殺我兩個，也不去救師父，徑自回家去哩。」行者道：「我打殺你兩個，我自去救他。」沙僧笑道：「兄長說那裡話？無我兩個，真是『單絲不線，孤掌難鳴』。兄啊，這行囊、馬匹，誰與看顧？寧學管鮑分金，休仿孫龐鬥智。自古道：『打虎還得親兄弟，上陣須教父子兵。』望兄長且饒打，待天明和你同心戮力，尋師去也。」行者雖是神通廣大，卻也明理識時。見沙僧苦苦哀告，便就回心道：「八戒、沙僧，你都起來。明日找尋師父。卻要用力。」那獃子聽見饒了，恨不得天也許下半邊，道：「哥啊，這個都在老豬身上。」兄弟們思思想想，那曾得睡，恨不得點頭喚出扶桑日，一口吹散滿天星。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      一方、悟空は戦いながら、焦りと苛立ちを募らせていた。隙を突いて一打を浴びせ、女の妖怪を叩き落としてみれば、それは花模様の靴が片方だけ。計略にはまったと悟り、急いで引き返して師を見に行ったが、三蔵の姿などない。ただ八戒と沙悟浄が、口の中でもごもご何やら言っているだけだった。悟空は胸いっぱいに怒りが込み上げ、わけも聞かず、棒をつかんで手当たり次第に打った。悟空「打ち殺してやる！　打ち殺してやる！」
      八戒は慌てふためき、逃げる道も見つからない。だが沙悟浄は霊山の大将、場数を踏んだ者だった。柔らかな態度でそばへ進み、ひざまずいて言った。沙悟浄「兄さん、分かりました。私たち二人を打ち殺し、お師匠さまも救わずに、そのまま故郷へ帰るつもりなのですね。」
      悟空「お前たち二人は打ち殺す。師は俺が助けに行く。」
      沙悟浄は笑って言った。沙悟浄「兄さん、何をおっしゃるんです。私たちがいなければ、『一本の糸では縒り糸にならず、片手では拍子を打てない』ということになります。兄さん、この荷物と馬は誰が世話をするのです。管仲（かんちゅう）と鮑叔（ほうしゅく）のように仲よく金を分け合い、孫臏（そんぴん）と龐涓（ほうけん）のように知略を争うのはやめましょう。昔から『虎を打つにも実の兄弟、戦場へ出すなら父子の兵』と言います。どうか、もう打つのはお許しください。夜が明けたら、兄さんと心と力を合わせて、お師匠さまを捜しに行きますから。」
      悟空は神通力が大きいばかりでなく、道理をわきまえ、時宜も知る者だった。沙悟浄が懸命に頼むのを見て、心を和らげた。悟空「八戒、沙悟浄、二人とも立て。明日はお師匠さまを捜すぞ。しっかり働けよ。」
      八戒はもう殴られずにすむと聞くと、空の半分でも引き受けかねない勢いで答えた。八戒「兄貴、それはすべて俺に任せてくれ。」
      三人はあれこれ考え続け、眠るどころではなかった。うなずき一つで扶桑（ふそう）の太陽を呼び出し、ひと息で空いっぱいの星を吹き散らしたい思いだった。
    "translation_status": "reviewed"
  - "id": "xy-ch81-025"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三眾只坐到天曉，收拾要行，早有寺僧攔門來問：「老爺那裡去？」行者笑道：「不好說。昨日對眾誇口，說與他們拿妖精，妖精未曾拿得，倒把我個師父不見了。我們尋師父去哩。」眾僧害怕道：「老爺，小可的事，倒帶累老師；卻往那裡去尋？」行者道：「有處尋他。」眾僧忙道：「既去莫忙，且吃些早齋。」連忙的端了兩三盆湯飯。八戒盡力吃個乾淨，道：「好和尚，我們尋著師父，再到你這裡來耍子。」行者道：「還到這裡吃他飯哩？你去天王殿裡看看那女子在否。」眾僧道：「老爺，不在了，不在了。自是當晚宿了一夜，第二日就不見了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      三人は夜が明けるまで座り通し、出発の支度をした。すると寺の僧たちが早くも門をふさいで尋ねた。僧たち「お坊さま、どちらへ行かれるのです。」
      悟空は苦笑した。悟空「言いにくい話だな。昨日はみんなの前で、妖怪を捕まえてやると大口をたたいたのに、捕まえられないばかりか、師までいなくなってしまった。これから捜しに行くんだ。」
      僧たちはおびえた。僧たち「お坊さま、私どもの小さな一件で、長老まで巻き込んでしまいました。いったいどこを捜されるのです。」
      悟空「捜す当てはある。」
      僧たちは急いで言った。僧たち「お出かけになるにしても、そうお急ぎなさいますな。まず朝のお斎を召し上がってください。」
      急いで汁や飯を二、三鉢運んできた。八戒はせっせと、すっかり食べ尽くした。八戒「親切な坊さんたち、お師匠さまが見つかったら、またここへ遊びに来るよ。」
      悟空「また飯を食わせてもらうつもりか。お前、天王殿へ行って、あの女がいるか見てこい。」
      僧たち「お坊さま、おりません、おりません。あの晩にひと晩泊まっただけで、次の日にはもういなくなっていたのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-026"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者喜喜歡歡的辭了眾僧，著八戒、沙僧牽馬挑擔，徑回東走。八戒道：「哥哥差了，怎麼又往東行？」行者道：「你豈知道？前日在那黑松林綁的那個女子，老孫火眼金睛，把他認透了，你們都認做好人。今日吃和尚的也是他，攝師父的也是他。你們救得好女菩薩。今既攝了師父，還從舊路上找尋去也。」二人嘆服道：「好好好，真是粗中有細。去來，去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      悟空は喜んで僧たちに別れを告げた。八戒と沙悟浄に馬を引き、荷を担がせ、まっすぐ東へ引き返す。
      八戒「兄貴、間違ってるぞ。どうしてまた東へ行くんだ。」
      悟空「お前に何が分かる。この前、黒松林で縛られていたあの女は、俺の火眼金睛（かがんきんせい）には、何者かすっかり見えていた。ところがお前たちは、善人だと思い込んだ。僧を食ったのもあいつ、師をさらったのもあいつだ。たいそう立派な女菩薩を助けたものだよ。いま師をさらっていったからには、元来た道へ戻って捜すんだ。」
      二人は感心して言った。八戒と沙悟浄「なるほど、なるほど、なるほど。大ざっぱなようで、本当に細かいところまで気がつく。行こう、行こう。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-027"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人急急到於林內，只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 165
        "line_end": 165
    "translation_ja": "三人が急いで林へ着いてみると、"
    "translation_status": "reviewed"
  - "id": "xy-ch81-028"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": "雲藹藹，霧漫漫；石層層，路盤盤。狐蹤兔跡交加走，虎豹豺狼往復鑽。林內更無妖怪影，不知三藏在何端。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      雲は幾重にも立ちこめ、霧は果てしなく漂う。
      石は層をなし、道はくねくねと曲がる。
      狐と兎の足跡は入り乱れ、
      虎、豹、山犬、狼が、行きつ戻りつ茂みをくぐる。
      林には妖怪の影一つなく、
      三蔵がどこにいるのか、まるで分からない。
    "translation_status": "reviewed"
  - "id": "xy-ch81-029"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者心焦，掣出棒來，搖身一變，變作大鬧天宮的本相：三頭六臂，六隻手，理著三根棒，在林裡辟哩撥喇的亂打。八戒見了道：「沙僧，師兄著了惱，尋不著師父，弄做個氣心風了。」原來行者打了一路，打出兩個老頭兒來：一個是山神，一個是土地，上前跪下道：「大聖，山神、土地來見。」八戒道：「好靈根啊，打了一路，打出兩個山神、土地；若再打一路，連太歲都打出來也。」行者問道：「山神、土地，汝等這般無禮，在此處專一結夥強盜。強盜得了手，買些豬羊祭賽你，又與妖精結擄，打夥兒把我師父攝來。如今藏在何處？快快的從實供來，免打。」二神慌了道：「大聖錯怪了我耶。妖精不在小神山上，不伏小神管轄。但只夜間風響處，小神略知一二。」行者道：「既知，一一說來。」土地道：「那妖精攝你師父去，在那正南下，離此有千里之遙。那廂有座山，喚做陷空山。山中有個洞，叫做無底洞。是那山裡妖精，到此變化攝去也。」行者聽言，暗自驚心。喝退了山神、土地，收了法身，現出本相，與八戒、沙僧道：「師父去得遠了。」八戒道：「遠便騰雲趕去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      悟空は焦れ、棒を引き抜いて身を振ると、天宮で大暴れしたときの姿になった。三つの頭に六本の腕、六つの手で三本の棒を操り、林の中をばりばり、ばたばたと手当たり次第に打ちまくる。八戒がそれを見て言った。八戒「沙悟浄、兄貴は頭に血が上ったぞ。お師匠さまが見つからないので、怒りすぎて気が狂ったんだ。」
      悟空がひとしきり打ち進むと、二人の老人が出てきた。一人は山神（さんじん）、一人は土地（とち）だった。二神は進み出てひざまずいた。山神と土地「大聖（たいせい）、山神と土地がお目にかかります。」
      八戒「すごい霊力だな。ひとしきり叩いただけで、山神と土地が二人、出てきたぞ。もうひとしきりやったら、太歳（たいさい）まで叩き出すんじゃないか。」
      悟空「山神、土地、お前たちはけしからん。この辺りで、強盗とつるむことばかりしている。強盗が仕事に成功すると、豚や羊を買って、お前たちに礼の供え物をするんだな。そのうえ妖怪とも組んで、俺の師を一緒になってさらってきた。いま、どこへ隠した。さっさと本当のことを吐け。そうすれば殴らずにすませてやる。」
      二神は慌てた。山神と土地「大聖、私どもをお疑いになるのは間違いです。あの妖怪は私どもの山にはおらず、私どもの管轄にも属しておりません。ただ、夜の風の吹きようから、少しばかり存じていることはあります。」
      悟空「知っているなら、一つ残らず話せ。」
      土地「あの妖怪がお師匠さまをさらっていった先は、真南、ここから千里ほど離れたところです。そこに陷空山という山があり、山中に無底洞という洞がございます。その山の妖怪が、ここへ来て姿を変え、お師匠さまをさらっていったのです。」
      悟空は聞いて、ひそかに驚いた。山神と土地を叱って退かせ、変化した姿を収めて元に戻ると、八戒と沙悟浄に言った。悟空「お師匠さまは、ずいぶん遠くへ連れ去られたぞ。」
      八戒「遠いなら、雲に乗って追いかけよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-030"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好獃子，一縱狂風先起；隨後是沙僧駕雲；那白馬原是龍子出身，馱了行李，也踏了風霧；大聖即起觔斗：一直南來。不多時，早見一座大山，阻住雲腳。三人採住馬，都按定雲頭。見那山："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 169
        "line_end": 169
    "translation_ja": "この八戒、さっそく烈風を起こし、真っ先に飛び上がった。沙悟浄が雲に乗って続く。白馬はもともと竜の子だから、荷を背負って風と霧を踏み、悟空も筋斗雲（きんとうん）を起こした。一直線に南へ進む。ほどなく、大きな山が雲の行く手をふさいだ。三人は馬を止め、そろって雲を下ろした。見れば、その山は、"
    "translation_status": "reviewed"
  - "id": "xy-ch81-031"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": "頂摩碧漢，峰接青霄。周圍雜樹萬萬千，來往飛禽喳喳噪。虎豹成陣走，獐鹿打叢行。向陽處，琪花瑤草馨香；背陰方，臘雪頑冰不化。崎嶇峻嶺，削壁懸崖。直立高峰，灣環深澗。松鬱鬱，石磷磷，行人見了悚其心。打柴樵子全無影，採藥仙童不見蹤。眼前虎豹能興霧，遍地狐狸亂弄風。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      頂は青い天の川をこすり、峰は青空へ続く。
      周りには数えきれない木々が生い茂り、
      鳥が行き交い、じゃあじゃあと鳴き騒ぐ。
      虎や豹は群れをなして走り、
      キバノロや鹿は連れ立って歩く。
      日向には、琪花（きか）と瑶草（ようそう）が芳しい香りを放ち、
      日陰には、年の暮れの雪と固い氷が解けずに残る。
      険しくそばだつ尾根、削ったような壁、切り立つ崖。
      まっすぐ立つ高峰、曲がりくねる深い谷。
      松はうっそうとし、石はごつごつとして、
      通りかかった者は、見ただけで身の毛がよだつ。
      薪を切る木こりの姿はなく、
      薬草を採る仙童の跡もない。
      目の前の虎や豹は霧を起こし、
      至るところで狐や狸が、勝手に風を操る。
    "translation_status": "reviewed"
  - "id": "xy-ch81-032"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒道：「哥啊，這山如此嶮峻，必有妖邪。」行者道：「不消說了，山高原有怪，嶺峻豈無精？」叫：「沙僧，我和你且在此，著八戒先下山凹裡打聽打聽，看那條路好走，端的可有洞府，再看是那裡開門，俱細細打探，我們好一齊去尋師父救他。」八戒道：「老豬晦氣，先拿我頂缸。」行者道：「你夜來說都在你身上，如何打仰？」八戒道：「不要嚷，等我去。」獃子放下鈀，抖抖衣裳，空著手，跳下高山，找尋路徑。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      八戒「兄貴、こんな険しい山なら、きっと妖怪がいるぞ。」
      悟空「言うまでもない。高い山にはもともと怪物がいる。険しい峰に、妖怪がいないはずがあるか。」
      続いて悟空は呼びかけた。悟空「沙悟浄、俺たちはひとまずここにいよう。八戒を先に山あいへ下らせて、様子を探らせるんだ。どの道が通りやすいか、本当に洞があるのか、入り口はどこに開いているか、何もかも詳しく調べてもらおう。それから一緒に、お師匠さまを捜して救いに行く。」
      八戒「俺はついてないな。真っ先に俺を矢面に立たせるのか。」
      悟空「昨夜は、すべてお前に任せろと言っただろう。どうして今さら引っ込めるんだ。」
      八戒「がみがみ言うなよ。行ってくるさ。」
      八戒は熊手を置き、衣を振り整え、手ぶらで高い山から跳び下りて、道を探した。
    "translation_status": "reviewed"
  - "id": "xy-ch81-033"

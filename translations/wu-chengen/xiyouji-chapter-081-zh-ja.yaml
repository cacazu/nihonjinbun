    "translation_ja": "原文「阿金溺銀」の阿は屙、すなわち排便の意味で、金銀を排泄するほど財を生むことをいう。教育部の辞書もこの句を挙げる。身体の比喩を削らず、親への思いやりを富より重んじる諺として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-03-body"
    "section_id": "chapter-81"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "八戒の食傷説と三蔵自身の風の説明は、それぞれの見立てとして残した。現代医学上の診断や治療法を示すものではない。「倒沁著頭」は頭を低くして寝ると解したが、姿勢の細部には留保がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-note-04-body"

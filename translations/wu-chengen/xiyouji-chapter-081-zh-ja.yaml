    "source_text": "那風才然過處，猛聞得蘭麝香熏，環珮聲響。即欠身擡頭觀看，呀！卻是一個美貌佳人，徑上佛殿。行者口裡嗚哩嗚喇，只情念經。那女子走近前，一把摟住道：「小長老，念的甚麼經？」行者道：「許下的。」女子道：「別人都自在睡覺，你還念經怎麼？」行者道：「許下的，如何不念？」女子摟住，與他親個嘴道：「我與你到後面耍耍去。」行者故意的扭過頭去道：「你有些不曉事。」女子道：「你會相面？」行者道：「也曉得些兒。」女子道：「你相我怎的樣子？」行者道：「我相你有些兒偷生㧚熟，被公婆趕出來的。」女子道：「相不著，相不著。我"

  - "id": "xy-ch81-009"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "即時取了缽盂，往寺後面香積廚取水。忽見那些和尚一個個眼兒通紅，悲啼哽咽，只是不敢放聲大哭。行者道：「你們這些和尚忒小家子樣。我們住幾日，臨行謝你，柴火錢照日算還，怎麼這等膿包？」眾僧慌跪下道：「不敢，不敢。」行者道：「怎麼不敢？想是我那長嘴和尚食腸大，吃傷了你的本兒也？」眾僧道：「老爺，我這荒山，大大小小也有百十眾和尚，每一人養老爺一日，也養得起百十日。怎麼敢欺心，計較甚麼食用？」行者道：「既不計較，你卻為甚麼啼哭？」眾僧道：「老爺，不知是那山裡來的妖邪在這寺裡。我們晚夜間著兩個小和尚去撞鐘打鼓，只聽得鐘鼓響罷，再不見人回。至次日找尋，只見僧帽、僧鞋丟在後邊園裡，骸骨尚存，將人吃了。你們住了三日，我寺裡不見了六個和尚。故此，我兄弟們不由的不怕，不由的不傷。因見你老師父貴恙，不敢傳說，忍不住淚珠偷垂也。」行者聞言，又驚又喜道：「不消說了，必定是妖魔在此傷人也。等我與你剿除他。」眾僧道：「老爺，妖精不精者不靈。一定會騰雲駕霧，一定會出幽入冥。古人道得好：『莫信直中直，須防人不仁。』老爺，你莫怪我們說：你若拿得他住哩，便與我荒山除這條禍根，正是三生有幸了；若還拿他不住啊，卻有好些兒不便處。」行者道：「怎叫做好些不便處？」那眾僧道：「直不相瞞老爺說，我這荒山雖有百十眾和尚，卻都只是自小兒出家的。髮長尋刀削，衣單破衲縫。早晨起來洗著臉，叉手躬身皈依大道；夜來收拾燒著香，虔心叩齒念的彌陀。舉頭看見佛蓮九品，秇三乘慈航共法雲，願見祇園釋世尊低頭看見心，受五戒，度大千，生生萬法中，願悟頑空與色空。諸檀越來啊，老的小的、長的矮的、胖的瘦的，一個個敲木魚，擊金磬，挨挨拶拶，兩卷《法華經》，一策《梁王懺》；諸檀越不來啊，新的舊的、生的熟的、村的俏的，一個個合著掌，瞑著目，悄悄冥冥，入定蒲團上，牢關月下門。一任他鶯啼鳥語閑爭鬥，不上我方便慈悲大法乘。因此上，也不會伏虎，也不會降龍；也不識的怪，也不識的精。你老爺若還惹起那妖魔啊，我百十個和尚只夠他齋一飽。一則墮落我眾生輪迴；二則滅抹了這禪林古跡；三則如來會上全沒半點兒光輝。這卻是好些兒不便處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      悟空はすぐ鉢盂（はつう）を持って、寺の裏の香積厨（こうしゃくちゅう）へ水を汲みに行った。すると僧たちが皆、目を真っ赤にして泣きむせび、声を上げて泣くのだけをこらえているのが見えた。
      悟空「お前たちはずいぶんみみっちい坊主だな。何日か泊めてもらった礼は、発つときにするさ。薪代だって、日数を数えて払ってやる。どうしてそんな情けない顔をしてるんだ。」
      僧たちは慌ててひざまずいた。僧たち「とんでもございません。とんでもございません。」
      悟空「何がとんでもないんだ。あの口の長い坊主が大食らいだから、食いつぶされそうだっていうのか。」
      僧たち「お坊さま、この山寺には大小合わせて百人余りの僧がおります。一人が一日おもてなしすれば、百日余りはお養いできます。良心に背いて、どうして食費など惜しみましょう。」
      悟空「惜しんでいないなら、なぜ泣くんだ。」
      僧たち「お坊さま、どこの山から来たか分からぬ妖怪が、この寺にいるのです。夜、小僧を二人、鐘と太鼓を鳴らしに行かせると、その音は聞こえるのに、人は戻ってまいりません。翌日捜すと、裏の庭に僧帽と僧の靴が投げ出してあり、骨だけが残っていました。食べられたのです。皆さまがお泊まりの三日間に、六人の僧がいなくなりました。怖がらずにも、悲しまずにもいられません。お師匠さまがご病気なのでお知らせできず、こらえきれずに、そっと涙を落としていたのでございます。」
      悟空は驚くとともに、喜んだ。悟空「もう分かった。妖怪がここで人を襲っているに違いない。俺が退治してやろう。」
      僧たち「お坊さま、妖怪は妖術を身につけてこその妖怪です。雲に乗り霧を駆けるでしょうし、闇を出入りする術もあるに違いありません。昔から『いかにも正直だからと信用するな。人の不仁には用心せよ』と申します。申し上げることを、お怒りにならないでください。捕まえられるなら、この山寺の災いの根を断っていただけますから、三世にわたる幸いです。しかし、捕まえられなかったら、いろいろと困ることになります。」
      悟空「どう困るんだ。」
      僧たち「正直に申します。ここには百人余りの僧がおりますが、皆、幼いころからの出家です。髪が伸びれば剃刀を探し、衣が薄く破れれば、つぎを当てる。朝は起きて顔を洗い、両手を組み、身をかがめて大いなる道に帰依する。夜は支度をして香を焚き、一心に歯を打ち鳴らして、阿弥陀（あみだ）の名を念じる。顔を上げれば九品（くほん）の蓮台を仰ぎ、三乗（さんじょう）の慈悲の舟と法の雲に乗り、祇園（ぎおん）の釈尊（しゃくそん）に会いたいと願う。顔を伏せれば自らの心を見つめ、五戒（ごかい）を受け、大千世界（だいせんせかい）を渡り、次々に生まれる万法のうちで、頑空（がんくう）と色空（しきくう）を悟りたいと願うのです。
      檀越（だんおつ）の方々がおいでになれば、年寄りも若い者も、背の高い者も低い者も、太った者も痩せた者も、一人一人木魚を打ち、金磬（きんけい）を鳴らし、肩を寄せ合って、二巻の『法華経（ほけきょう）』と一冊の『梁王懺（りょうおうさん）』を唱えます。檀越がおいでにならなければ、新参も古参も、未熟な者も慣れた者も、無骨な者も気のきいた者も、一人一人手を合わせ、目を閉じ、ひっそりと蒲団の上で坐禅を組み、月の下の門を固く閉ざします。鶯や鳥が鳴いて勝手に争っていても、私どもの方便と慈悲の大乗の教えには立ち入らせません。
      そんな暮らしですから、虎を伏せることも竜を降すこともできず、魔物も妖怪も見分けられません。お坊さまが妖怪を怒らせたら、私ども百人余りは、あれの一食分にしかなりません。第一に私ども衆生を輪廻へ落とし、第二にこの古い禅寺の跡を絶ち、第三に如来の会座の面目を、少しも残さずつぶすことになります。こういう困りごとがあるのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-010"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞得眾和尚說出這一端的話語，他便怒從心上起，惡向膽邊生，高叫一聲：「你這眾和尚，好獃哩！只曉得那妖精，就不曉得我老孫的行止麼？」眾僧輕輕的答道：「實不曉得。」行者道：「我今日略節說說，你們聽著。我也曾花果山伏虎降龍，我也曾上天堂大鬧天宮。饑時把老君的丹，略略咬了兩三顆；渴時把玉帝的酒，輕輕呼了六七鍾。睜著一雙不白不黑的金睛眼，天慘淡，月朦朧；拿著一條不短不長的金箍棒，來無影，去無蹤。說甚麼大精小怪，那怕他憊懶煨膿。一趕趕上去，跑的跑，顫的顫，躲的躲，慌的慌；一捉捉將來，銼的銼，燒的燒，磨的磨，舂的舂。正是八仙同過海，獨自顯神通。眾和尚，我拿這妖精與你看看，你才認得我老孫。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      僧たちの一席の話を聞くと、悟空は胸に怒りがこみ上げ、腹の底に荒々しい気が湧いた。悟空「お前たち坊主は、本当にばかだな！　妖怪のことばかり知っていて、この俺が何をしてきたかは知らないのか。」
      僧たちは小声で答えた。僧たち「まことに存じません。」
      悟空「今日はあらましだけ話してやるから、聞いてろ。俺は花果山（かかざん）で虎を伏せ、竜を降し、天へ登って天宮で大暴れもした。腹が減れば、老君（ろうくん）の仙丹をちょいと二、三粒かじり、喉が渇けば、玉帝（ぎょくてい）の酒を軽く六、七杯あおった。白でも黒でもない金色の目を見開けば、天は薄暗く、月はかすむ。長すぎも短すぎもしない金箍棒（きんこぼう）を手に、来るときは影もなく、去るときは跡もない。大きな妖怪だの小さな魔物だのというが、あんなならず者や、ろくでなしを恐れるものか。追い立てていけば、逃げるやつ、震えるやつ、隠れるやつ、慌てるやつ。捕まえてしまえば、切り刻まれるやつ、焼かれるやつ、磨りつぶされるやつ、杵で搗かれるやつ。八仙（はっせん）がそろって海を渡るときも、それぞれ自分の神通力（じんつうりき）を見せると言うじゃないか。坊主ども、あの妖怪を捕まえて見せてやる。そのとき初めて、この俺が分かるだろうよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-011"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾僧聽著，暗點頭道：「這賊禿開大口，說大話，想是有些來歷。」都一個個諾諾連聲。只有那喇嘛僧道：「且住。你老師父貴恙，你拿這妖精不至緊。俗語道：『公了登筵，不醉便飽；壯士臨陣，不死即傷。』你兩下裡角鬥之時，倘貽累你師父，不當穩便。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      僧たちは聞きながら、そっとうなずいて、ささやき合った。僧たち「あの生臭坊主、大きな口を開けて大変なほらを吹く。きっと何かいわれのある者なんだろう。」
      そして皆、はい、はいと続けて返事をした。ただ一人、喇嘛僧だけが言った。喇嘛僧「お待ちください。お師匠さまはご病気です。妖怪を捕らえることは、それほど急ぐ話ではございません。『客が宴に出れば、酔わぬとも腹は膨れる。勇士が戦場へ出れば、死なぬとも傷を負う』と申します。お二人が争ううち、お師匠さままで巻き添えになったら、穏やかではありますまい。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-012"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「有理，有理。我且送涼水與師父吃了再來。」掇起缽盂，著上涼水，轉出香積廚，就到方丈，叫聲：「師父，吃涼水哩。」三藏正當煩渴之時，便擡起頭來，捧著水，只是一吸。真個：渴時一滴如甘露，藥到真方病即除。行者見長老精神漸爽，眉目舒開，就問道：「師父，可吃些湯飯麼？」三藏道：「這涼水就是靈丹一般，這病兒減了一半，有湯飯也吃得些。」行者連聲高高叫道：「我師父好了，要湯飯吃哩。」教那些和尚忙忙的安排：淘米煮飯、捍麵烙餅，蒸饝饝、做粉湯，擡了四五桌。唐僧只吃得半碗兒米湯，行者、沙僧止用了一席，其餘的都是八戒一肚餐之。家火收去，點起燈來，眾僧各散。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      悟空「もっともだ、もっともだ。まずお師匠さまに冷たい水を飲ませてから、戻ってくる。」
      悟空は鉢盂を取り上げて冷水を満たし、香積厨を出て方丈へ戻った。悟空「お師匠さま、冷たい水ですよ。」
      三蔵はちょうどひどい渇きに苦しんでいたので、頭を上げて水を受け取り、ひと息に飲んだ。まこと、渇いたときの一滴は甘露のよう、正しい薬が届けば病は消える。しだいに三蔵の気分がよくなり、眉間も顔つきも和らぐのを見て、悟空が尋ねた。悟空「お師匠さま、汁や飯も少し召し上がれそうですか。」
      三蔵「この冷水は霊薬のようだ。病が半分軽くなった。汁や飯があれば、少しは食べられそうだ。」
      悟空は声を張り上げ、繰り返し呼んだ。悟空「お師匠さまがよくなったぞ。汁や飯を食べたいそうだ！」
      僧たちは急いで用意をした。米を研いで飯を炊き、粉を練って伸ばした餅を焼き、饅頭を蒸し、粉の麺の汁を作って、四、五卓運んできた。三蔵が食べたのは、茶碗に半分の重湯だけだった。悟空と沙悟浄は二人で一卓分を食べ、残りはすべて八戒一人の腹に収まった。器を下げ、灯をともし、僧たちは皆引き取った。
    "translation_status": "reviewed"
  - "id": "xy-ch81-013"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏道：「我們今住幾日了？」行者道：「三整日矣。明朝向晚，便就是四個日頭。」三藏道：「三日誤了許多路程。」行者道：「師父，也算不得路程，明日去罷。」三藏道：「正是，就帶幾分病兒，也沒奈何。」行者道：「既是明日要去，且讓我今晚捉了妖精看。」三藏驚道：「又捉甚麼妖精？」行者道：「有個妖精在這寺裡，等老孫替他捉捉。」唐僧道：「徒弟呀，我的病身未可，你怎麼又興此念？倘那怪有神通，你拿他不住啊，卻又不是害我？」行者道：「你好滅人威風。老孫到處降妖，你見我弱與誰的？只是不動手，動手就要贏。」三藏扯住道：「徒弟，常言說得好：『遇方便時行方便，得饒人處且饒人。』『操心怎似存心好，爭氣何如忍氣高？』」孫大聖見師父苦苦勸他，不許降妖，他說出老實話來道：「師父，實不瞞你說，那妖在此吃了人了。」唐僧大驚道：「吃了甚麼人？」行者說道：「我們住了三日，已是吃了這寺裡六個小和尚了。」長老道：「『兔死狐悲，物傷其類。』他既吃了寺內之僧，我亦僧也，我放你去，只但用心仔細些。」行者道：「不消說，老孫的手到就消除了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      三蔵「ここに泊まって、もう何日になる。」
      悟空「丸三日です。明日の夕方になれば、四日になります。」
      三蔵「三日も、ずいぶん道を遅らせたものだ。」
      悟空「お師匠さま、それほどの道のりでもありませんよ。明日出発しましょう。」
      三蔵「そうだな。多少病が残っていても、しかたがない。」
      悟空「明日出発するのなら、今夜は俺に妖怪を捕まえさせてください。」
      三蔵は驚いた。三蔵「また、何の妖怪を捕まえるのだ。」
      悟空「この寺に一匹いるんです。俺が捕まえてやろうと思いまして。」
      三蔵「悟空、私はまだ病が治っていないのに、どうしてまたそんな気を起こすのだ。妖怪に神通力があって、お前が捕まえられなかったら、また私に害が及ぶのではないか。」
      悟空「ずいぶん人の威勢をくじくんですね。俺は行く先々で妖怪を降してきましたが、誰かに負けたところをご覧になりましたか。手を出さなければそれまでですが、出せば必ず勝ちますよ。」
      三蔵は悟空を引き止めた。三蔵「悟空、昔からよく言うではないか。『便宜を図れるときは図り、人を許せるときは許しておけ。』『気をもむより、心を落ち着けて守るほうがよい。意地を張るより、怒りをこらえるほうが立派だ。』」
      師が懸命になだめ、退治に行かせまいとするので、悟空は本当のことを打ち明けた。悟空「お師匠さま、隠さず言います。あの妖怪は、ここで人を食ったんです。」
      三蔵は仰天した。三蔵「誰を食べたのだ。」
      悟空「俺たちがここに泊まった三日間に、この寺の小僧を六人、もう食っています。」
      三蔵「『兎が死ねば狐が悲しみ、生き物は同類の災難を悼む』と言う。寺の僧を食べたなら、私も同じ僧だ。行ってもよい。ただ、十分気をつけておくれ。」
      悟空「言われるまでもありません。俺が手を出せば、それで片づきますよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch81-014"
    "section_id": "chapter-81"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他燈光前吩咐八戒、沙僧看守師父，他喜孜孜跳出方丈，徑來佛殿看時，天上有星，月還未上，那殿裡黑暗暗的。他就吹出真火，點起琉璃，東邊打鼓，西邊撞鐘。響罷，搖身一變，變做個小和尚兒，年紀只有十二三歲，披著黃絹褊衫，白布直裰，手敲著木魚，口裡念經。等到一更時分，不見動靜。二更時分，殘月才升，只聽見呼呼的一陣風響。好風："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 142
        "line_end": 142
    "translation_ja": "悟空は灯の前で八戒と沙悟浄に師を守るよう言いつけ、うれしげに方丈から跳び出した。まっすぐ仏殿へ行ってみると、空には星があるものの、月はまだ出ておらず、堂内は真っ暗だった。悟空は真火（しんか）を吹き出してガラスの灯明をともし、東で太鼓を打ち、西で鐘を撞いた。鳴らし終えると身をひと振り、十二、三歳ばかりの小僧に変わった。黄色い絹の褊衫（へんさん）をまとい、白布の直裰（ちょくたつ）を着て、手で木魚を叩き、口で経を唱える。一更（いっこう）になっても、何の動きもない。二更（にこう）になって、欠けた月がようやく昇るころ、急にごうごうと一陣の風が聞こえてきた。ものすごい風である。"
    "translation_status": "reviewed"
  - "id": "xy-ch81-015"
    "section_id": "chapter-81"
    "kind": "verse"
    "origin": "source"
    "source_text": "黑霧遮天暗，愁雲照地昏。四方如潑墨，一派靛妝渾。先刮時揚塵播土，次後來倒樹摧林。揚塵播土星光現，倒樹摧林月色昏。只刮得：嫦娥緊抱梭羅樹，玉兔團團找藥盆；九曜星官皆閉戶，四海龍王盡掩門；廟裡城隍覓小鬼，空中仙子怎騰雲；地府閻羅尋馬面，判官亂跑趕頭巾。刮動崑崙頂上石，捲得江湖波浪混。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch81-1455630"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第081回&oldid=1455630"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      黒い霧が天を覆い、暗く閉ざし、
      愁いの雲が地を照らして薄闇に沈める。
      四方は墨を流したよう、
      一面、藍に塗りつぶされる。
      吹き始めには、塵と土を舞い上げ、
      やがて木々を倒し、林を砕く。
      塵と土を舞い上げる間には、星の光も見えたが、
      木々を倒し林を砕くころには、月の色も暗くなる。
      あまりの風に、嫦娥（じょうが）は梭羅樹（さらじゅ）へしがみつき、
      玉兎は薬の鉢を捜して、くるくる駆け回る。
      九曜星官（くようせいかん）は皆、戸を閉ざし、
      四海の竜王（しかいのりゅうおう）も、残らず門を閉める。
      廟の城隍（じょうこう）は小鬼を捜し、
      空の仙女は、どうして雲に乗れよう。
      地府（ちふ）の閻羅（えんら）は馬面（ばめん）を捜し、
      判官たちは頭巾を追って、あちらこちらへ走る。
      崑崙（こんろん）の頂の岩さえ揺らし、
      川や湖の波を巻き上げ、入り乱れさせる。
    "translation_status": "reviewed"
  - "id": "xy-ch81-016"

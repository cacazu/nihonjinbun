  "source_text": "這行者即同多官頃間便到。眾臣先走，奏知那國王，高捲珠簾，閃龍睛鳳目，開金口御言，便問：「那一位是神僧孫長老？」行者進前一步，厲聲道：「老孫便是。」那國王聽得聲音兇狠，又見相貌刁鑽，諕得戰兢兢，跌在龍床之上。慌得那女官內宦，急扶入宮中。道：「諕殺寡人也！」眾官都嗔怨行者道：「這和尚怎麼這等粗魯村疏？怎敢就擅揭榜？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    悟空は大勢の官たちとともに、ほどなく宮廷へ着いた。臣たちが先に行って国王へ知らせると、国王は珠の簾を高く巻き上げ、竜や鳳凰のような目を光らせ、御口を開いて尋ねた。
    国王「どちらが神僧孫長老か。」
    悟空は一歩進み、鋭い声で言った。
    悟空「この俺だ。」
    国王は荒々しい声を聞き、そのうえ狡猾そうな面構えを見ると、恐ろしさに震え、竜床（りゅうしょう）の上へ倒れ込んだ。女官や宦官はあわてて、急いで宮中へ抱え入れた。
    国王「余は、驚きのあまり死ぬかと思うた。」
    官たちは皆、悟空を責めた。
    官たち「この和尚は、何という粗野な無作法者だ。よくも勝手に榜を剝がせたものだ。」

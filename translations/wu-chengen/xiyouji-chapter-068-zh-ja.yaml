  "translation_ja": |-
    通りの群衆は、わいわい騒ぎながら押し進んだ。その数は三百や五百ではきかず、皆で会同館の門前へ来た。
    八戒「皆さん、待ってくれ。兄貴は、俺のようにお前らのからかいに付き合いはしない。気性が激しく、物事を真剣に受け取る男だ。会ったら、きちんと大礼をし、『孫（そん）さま』と呼ぶんだ。そうすれば引き受けてくれる。そうしなければ、顔色を変えて怒り出し、話はまとまらないぞ。」
    太監と校尉たちはそろって言った。
    太監と校尉たち「兄弟子に本当の腕があり、国王の病を治してくださるなら、国の半分をお持ちになるのです。我々も、拝礼するのが当然です。」
  "translation_status": "reviewed"
- "id": "xy-ch68-025"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那些閑雜人都在門外諠譁。八戒領著一行太監、校尉，徑入館中。只聽得行者與沙僧在客房裡正說那揭榜之事耍笑哩。八戒上前扯住，亂嚷道：「你可成個人？哄我去買素麵、燒餅、饝饝我吃，原來都是空頭。又弄旋風，揭了甚麼皇榜，暗暗的揣在我懷裡，拿我裝胖。這可成個弟兄？」行者笑道：「你這獃子，想是錯了路，走向別處去。我過鼓樓，買了調和，急回來尋你不見，我先來了。在那裡揭甚皇榜？」八戒道：「現在看榜的官員在此。」說不了，只見那幾個太監、校尉朝上禮拜道：「孫老爺，今日我王有緣，天遣老爺下降。是必大展經綸手，微施三折肱，治得我王病愈，江山有分，社稷平分也。」行者聞言，正了聲色，接了八戒的榜文，對眾道：「你們想是看榜的官麼？」太監叩頭道：「奴婢乃司禮監內臣。這幾個是錦衣校尉。」行者道：「這招醫榜，委是我揭的，故遣我師弟引見。既然你主有病，常言道：　『藥不輕賣，病不討醫。』你去教那國王親來請我，我有手到病除之功。」太監聞言，無不驚駭。校尉道：「口出大言，必有度量。我等著一半在此啞請，著一半入朝啟奏。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"

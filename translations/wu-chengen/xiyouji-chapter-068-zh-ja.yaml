  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，笑道：「列位錯怪了我也。若像這等慢人，你國王之病，就是一千年也不得好。」眾臣道：「人生能有幾多陽壽？就一千年也還不好？」行者道：「他如今是個病君，死了是個病鬼，再轉世也還是個病人，卻不是一千年也還不好？」眾臣怒曰：「你這和尚甚不知禮，怎麼敢這等滿口胡柴？」行者笑道：「不是胡柴，你都聽我道來："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    悟空は聞くと、笑って言った。
    悟空「皆さん、俺を責めるのは筋違いだ。このように人を軽んじるなら、お前たちの国王の病は、千年たっても治らないぞ。」
    臣たち「人に、いったいどれほどの寿命がある。千年たっても治らぬとは。」
    悟空「今は病気の王だろう。死ねば病気の亡者になり、また生まれ変わっても病人だ。これでは、千年たっても治らないじゃないか。」
    臣たちは怒った。
    臣たち「この和尚は、まったく礼を知らぬ。よくも、そんなでたらめばかり言えるものだ。」
    悟空は笑った。
    悟空「でたらめじゃない。皆、俺の話を聞け。」
  "translation_status": "reviewed"
- "id": "xy-ch68-030"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    醫門理法至微玄，大要心中有轉旋。
    望聞問切四般事，缺一之時不備全：
    第一望他神氣色，潤枯肥瘦起和眠；
    第二聞聲清與濁，聽他真語及狂言；
    三問病原經幾日，如何飲食怎生便；
    四才切脈明經絡，浮沉表裡是何般。
    我不望聞並問切，今生莫想得安然。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 163
    "line_end": 169
  "translation_ja": |-
    悟空「医の道の理と法は、きわめて微妙で奥深く、肝心なのは心を柔軟に働かせることだ。
    望・聞・問・切（ぼう・ぶん・もん・せつ）の四つがあり、一つ欠けても十分ではない。
    第一にその精神、気色を見て、潤いか乾きか、肥えているか痩せているか、起きているか眠っているかを確かめる。
    第二に声の澄みと濁りを聞き、まともな言葉と狂った言葉を聞き分ける。
    第三に病の原因、何日たったかを問い、飲み食いの具合、便の出方を尋ねる。
    第四に脈を取り、経絡（けいらく）を明らかにし、浮・沈・表・裏（ふ・ちん・ひょう・り）がどのようであるかを知る。
    俺が望・聞・問・切を行わねば、この世で安らかになれると思うなよ。」
  "translation_status": "reviewed"
- "id": "xy-ch68-031"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那兩班文武叢中，有太醫院官，一聞此言，對眾稱揚道：「這和尚也說得有理。就是神仙看病，也須望、聞、問、切，謹合著神聖功巧也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    文武の二つの列の中に、太医院の官がいた。この言葉を聞くと、皆に向かって褒めた。
    太医院の官「この和尚の言うことにも理があります。神仙が診察するにしても、望・聞・問・切は必要です。まさに神・聖・功・巧（しん・せい・こう・こう）の説に合っています。」
  "translation_status": "reviewed"
- "id": "xy-ch68-032"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾官依此言，著近侍傳奏道：「長老要用望、聞、問、切之理，方可認病用藥。」那國王睡在龍床上，聲聲喚道：「叫他去罷，寡人見不得生人面了。」近侍的出宮來道：「那和尚，我王旨意，教你去罷，見不得生人面哩。」行者道：「若見不得生人面啊，我會懸絲診脈。」眾官暗喜道：「懸絲診脈，我等耳聞，不曾眼見。再奏去來。」那近侍的又入宮奏道：「主公，那孫長老不見主公之面，他會懸絲診脈。」國王心中暗想道：「寡人病了三年，未曾試此，宣他進來。」近侍的即忙傳出道：「主公已許他懸絲診脈，快宣孫長老進宮診視。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    官たちはこの言葉に従い、近侍にこう奏上させた。
    近侍「長老は望・聞・問・切の理に従ってこそ、病を見分け、薬を使えると申しております。」
    国王は竜床に横たわったまま、何度も声を上げた。
    国王「あの者は帰らせよ。余はもう、見知らぬ顔を見るのは耐えられぬ。」
    近侍は宮中から出て言った。
    近侍「和尚、王の仰せだ。帰るがよい。見知らぬ顔をご覧になれないのだ。」
    悟空「見知らぬ顔を見られないというなら、俺は懸糸診脈（けんししんみゃく）ができる。」
    官たちはひそかに喜んだ。
    官たち「糸を掛けて脈を診るとは、耳にしたことはあるが、この目で見たことはない。もう一度、奏上してきてくれ。」
    近侍はまた宮中へ入り、奏上した。
    近侍「陛下、孫長老は陛下のお顔を見ずとも、糸を掛けて脈を診られるそうです。」
    国王は心の中で考えた。
    国王「余は三年も病んだが、これはまだ試しておらぬ。あの者を入らせよう。」
    近侍は、急いで外へ伝えた。
    近侍「陛下は懸糸診脈をお許しになった。早く孫長老を宮中へお通しし、診察していただけ。」
  "translation_status": "reviewed"
- "id": "xy-ch68-033"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻就上了寶殿。唐僧迎著罵道：「你這潑猴，害了我也。」行者笑道：「好師父，我倒與你壯觀，你返說我害你？」三藏喝道：「你跟我這幾年，那曾見你醫好誰來？你連藥性也不知，醫書也未讀，怎麼大膽撞這個大禍？」行者笑道：「師父，你原來不曉得。我有幾個草頭方兒，能治大病，管情醫得他好便了。就是醫殺了，也只問得個庸醫殺人罪名，也不該死，你怕怎的！不打緊，不打緊，你且坐下，看我的脈理如何？」長老又道：「你那曾見《素問》、《難經》、《本草》、《脈訣》是甚般章句，怎生註解？就這等胡說亂道，會甚麼懸絲診脈？」行者笑道：「我有金線在身，你不曾見哩。」即伸手下去，尾上拔了三根毫毛，捻一把，叫聲：「變！」即變作三條絲線，每條各長二丈四尺，按二十四氣，托於手內，對唐僧道：「這不是我的金線？」近侍宦官在傍道：「長老且休講口，請入宮中診視去來。」行者別了唐僧，隨著近侍入宮看病。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    そこで悟空は宝殿へ上がった。三蔵が迎え、罵った。
    三蔵「この猿め、私をひどい目に遭わせてくれたな。」
    悟空は笑った。
    悟空「お師匠さま、私はお師匠さまの面目を上げて差し上げているのに、ひどい目に遭わせるとは、あべこべですよ。」
    三蔵は叱った。
    三蔵「お前は何年も私についているが、誰かの病を治したところを、一度でも見せたことがあるか。薬の性質も知らず、医書も読んでいないのに、どうして大胆にも、こんな大変な災いを招いたのだ。」
    悟空は笑った。
    悟空「お師匠さまは、ご存じなかったのですね。私は大病を治せる、ちょっとした民間の処方をいくつか持っています。必ず治してみせますから。それに、たとえ治療して死なせても、やぶ医者が人を殺したという罪に問われるだけで、死罪にはならないのです。何を怖がるのです。たいしたことはありません、たいしたことはありません。まあお座りになり、私の脈の診方をご覧ください。」
    三蔵はまた言った。
    三蔵「お前は『素問（そもん）』『難経（なんけい）』『本草（ほんぞう）』『脈訣（みゃくけつ）』に、どんな文章があり、どのように注解されているか、見たことがあるのか。それで、こんなでたらめを言って、何が懸糸診脈だ。」
    悟空は笑った。
    悟空「私は金線を持っています。お師匠さまが見たことがないだけです。」
    すぐに手を下へ伸ばし、尾から毛を三本抜くと、ひとひねりして叫んだ。
    悟空「変われ！」
    すると毛は、三筋の糸に変わった。一筋ごとに二丈四尺の長さで、二十四気（にじゅうしき）に合わせてあった。悟空は手のひらに載せ、三蔵へ言った。
    悟空「これが私の金線ではありませんか。」
    そばにいた近侍の宦官が言った。
    近侍「長老、口論はそれくらいにして、宮中へ診察においでください。」
    悟空は三蔵に別れを告げ、近侍について宮中へ病を診に行った。まさしく、
  "translation_status": "reviewed"
- "id": "xy-ch68-034"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": "心有秘方能治國，內藏妙訣註長生。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    心には、国を治めうる秘方があり、
    内には、長生きを記す妙訣が蔵される。
  "translation_status": "reviewed"
- "id": "xy-ch68-035"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟這去不知看出甚麼病來，用甚麼藥品。欲知端的，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 177
    "line_end": 177
  "translation_ja": "さて、行った先でどのような病と見立て、どんな薬を用いるのだろうか。詳しいことは、次回をお聞きいただきたい。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-01-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の詞は修行の清浄と超俗を詠む。底本の『善正萬緣收』は構文が明瞭でなく、善と正しさに諸縁が収まる意と解した。『蝴蝶夢』は人の世を夢にたとえる表現。語義の細部は留保し、原字を改めない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-02-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵が語る通史は底本の順序と数字を保った。『因無車馬』は字面どおり車馬がないためとしたが、併呑の原因をいう構文は難しく、誤字とは断定しない。『魯沛』は魯公の項羽と沛公の劉邦を指すと解される。『史記』項羽本紀は項羽を魯公と記すが、この詩の省略形の同定には留保を残す（https://zh.wikisource.org/wiki/史記/卷007）。漢から司馬氏へ直接進む圧縮や『南北十二』も、一般の通史に合わせて補訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-03-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『今要做水陸大會』という三蔵の語りを、これから法会を催したいという時間関係のまま残した。取経出発前の法会の叙述と整合させるために過去形へ変えない。『大乘經三藏』の三蔵は経典の三部門で、人名の三蔵ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-04-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八戒の『獐智』は、辞書では知恵・機転の意だが、この発話では直前の人々を驚かせた出来事を指すと解して『騒ぎ』とした。語調には留保がある。会同館前の語り手は数十人、ここで八戒は十余人というが、話者の数え方をそろえない。教育部重編國語辭典の語義は検索表示で確認（https://pedia.cloud.edu.tw/Entry/Detail?title=獐智）。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-05-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "食物の全列挙を保持。『\U00029707』は教育部異體字字典で、筒状に巻いた食物と説明される（https://dict.variants.moe.edu.tw/dictView.jsp?ID=109853）。『\U00029707子』を特定の現代料理に置き換えず、原字を残す。日本語読みは漢字音に基づく推定。蒸酥の具体的な材料・製法も未確定。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-06-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『把耳朵捽了兩拄』は耳を二度振る動作と解した。『兩拄』の細かな語法は未確定で、二という数量を保つ。人が転んで死ぬのは八戒が述べる仮定であり、この場で実際に死者が出たわけではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-07-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『三分』は、ここでは幾分かという言い回しと解し、数字は原文どおり保った。実測された確率を述べるものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-08-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『把嘴一\U00022D6E』の珍字は原文欄で保持。漢典は音lūと北京官話の『抽打』（打つ）という語義を挙げる（https://zdic.net/hant/\U00022D6E）。ここは口を急に振り出す動作と文脈から解したが、正確な動きは未確定。続く文は校尉が驚いて倒れたと述べるので、殴打や負傷は補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-09-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は『你兒子便揭了皇榜，你孫子便會醫治』。相手の子・孫に自分を下げる言い方によって、自分は榜を剝がしておらず、医術もできないと強く否定する口調と解した。相手の実在の子や孫を登場させる意味には取らない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-10-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "公公は年長の男性への呼称で、宮中の宦官にも用いる。八戒は太監をわざと婆さん扱いし、男女があべこべだとからかっている。これは八戒の侮辱であって、語り手による性別の認定ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-11-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三折肱は、三たび腕を折れば良医となるという『春秋左氏伝』定公十三年の言葉にちなみ、経験を積んだ医術をいう。回題でもこの語を用いる。原典の検索表示を確認したが、ctext本文の直接取得は403で未完了（https://ctext.org/chun-qiu-zuo-zhuan/ding-gong-shi-san-nian/zh）。悟空が実際に三度骨折したと説明するものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-12-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は『藥不輕賣，病不討醫』。後半は字面だけでは主語・目的語の関係が取りにくい。王自身に迎えに来させる文脈から、医者が患者を求めて回らぬという意味に訳したが、構文の細部は留保する。治療できるとの断言は、この時点の悟空自身の主張。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-13-body"

  "known_gaps":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-002"
    "description_ja": "冒頭の詞は修行の清浄と超俗を詠む。底本の『善正萬緣收』は構文が明瞭でなく、善と正しさに諸縁が収まる意と解した。『蝴蝶夢』は人の世を夢にたとえる表現。語義の細部は留保し、原字を改めない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-014"
    "description_ja": "三蔵が語る通史は底本の順序と数字を保った。『因無車馬』は字面どおり車馬がないためとしたが、併呑の原因をいう構文は難しく、誤字とは断定しない。『魯沛』は魯公の項羽と沛公の劉邦を指すと解される。『史記』項羽本紀は項羽を魯公と記すが、この詩の省略形の同定には留保を残す（https://zh.wikisource.org/wiki/史記/卷007）。漢から司馬氏へ直接進む圧縮や『南北十二』も、一般の通史に合わせて補訂しない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-016"
    "description_ja": "八戒の『獐智』は、辞書では知恵・機転の意だが、この発話では直前の人々を驚かせた出来事を指すと解して『騒ぎ』とした。語調には留保がある。会同館前の語り手は数十人、ここで八戒は十余人というが、話者の数え方をそろえない。教育部重編國語辭典の語義は検索表示で確認（https://pedia.cloud.edu.tw/Entry/Detail?title=獐智）。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-016"
    "description_ja": "食物の全列挙を保持。『\U00029707』は教育部異體字字典で、筒状に巻いた食物と説明される（https://dict.variants.moe.edu.tw/dictView.jsp?ID=109853）。『\U00029707子』を特定の現代料理に置き換えず、原字を残す。日本語読みは漢字音に基づく推定。蒸酥の具体的な材料・製法も未確定。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-017"
    "description_ja": "『把耳朵捽了兩拄』は耳を二度振る動作と解した。『兩拄』の細かな語法は未確定で、二という数量を保つ。人が転んで死ぬのは八戒が述べる仮定であり、この場で実際に死者が出たわけではない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-022"
    "description_ja": "『把嘴一\U00022D6E』の珍字は原文欄で保持。漢典は音lūと北京官話の『抽打』（打つ）という語義を挙げる（https://zdic.net/hant/\U00022D6E）。ここは口を急に振り出す動作と文脈から解したが、正確な動きは未確定。続く文は校尉が驚いて倒れたと述べるので、殴打や負傷は補わない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-025"
    "description_ja": "三折肱は、三たび腕を折れば良医となるという『春秋左氏伝』定公十三年の言葉にちなみ、経験を積んだ医術をいう。回題でもこの語を用いる。原典の検索表示を確認したが、ctext本文の直接取得は403で未完了（https://ctext.org/chun-qiu-zuo-zhuan/ding-gong-shi-san-nian/zh）。悟空が実際に三度骨折したと説明するものではない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-025"
    "description_ja": "底本は『藥不輕賣，病不討醫』。後半は字面だけでは主語・目的語の関係が取りにくい。王自身に迎えに来させる文脈から、医者が患者を求めて回らぬという意味に訳したが、構文の細部は留保する。治療できるとの断言は、この時点の悟空自身の主張。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-025"
    "description_ja": "『啞請』は、言葉を控えてその場にとどまり、迎えの手配を待つ意味に取ったが、細部は未確定。『裝胖』も、八戒を見かけだけの大人物に仕立てる意と解した。いずれも原字を保持し、別字へ補訂しない。 本文欠落ではなく解釈・資料取得上の留保。"
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "segment_ids":
    - "xy-ch68-034"
    "description_ja": "『治國』は国を治めることと国王を治すことを重ねる表現と解する。『註長生』は長生きを記す意として訳したが、註の語感には留保がある。診察前の結びの詩であり、治癒の結果を述べ足さない。 本文欠落ではなく解釈・資料取得上の留保。"

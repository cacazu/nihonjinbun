  "source_text": "他二人攜手相攙，徑上街西而去。行者過了幾處茶房，幾家飯店，當買的不買，當吃的不吃。八戒叫道：「師兄，這裡將就買些用罷。」那行者原是耍他，那裡肯買，道：「賢弟，你好不經紀，再走走，揀大的買吃。」兩個人說說話兒，又領了許多人跟隨爭看。不時到了鼓樓邊，只見那樓下無數人喧嚷，擠擠挨挨，填街塞路。八戒見了道：「哥哥，我不去了。那裡人嚷得緊，只怕是拿和尚的，又況是面生可疑之人，拿了去，怎的了？」行者道：「胡談！和尚又不犯法，拿我怎的？我們走過去，到鄭家店買些調和來。」八戒道：「罷罷罷，我不撞禍。這一擠到人叢裡，把耳朵捽了兩拄，諕得他跌跌爬爬，跌死幾個，我倒償命哩！」行者道：「既然如此，你在這壁根下站定，等我過去買了回來，與你買素麵、燒餅吃罷。」那獃子將碗盞遞與行者，把嘴拄著牆根，背著臉，死也不動。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"

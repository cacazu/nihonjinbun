  "translation_ja": |-
    やがて騒ぎは近所へ広がり、人々が取り囲んだ。その中の二人の老いた太監が言った。
    二人の老いた太監「お前は姿も珍しく、声も妙だ。どこから来て、そんなに乱暴を言うのだ。」
    八戒「俺たちは東土から、西天へ経を取りに遣わされたんだ。師匠は唐王の御弟法師（ぎょていほうし）で、ついさっき、通行文書に証印をもらいに朝廷へ行った。俺は兄貴と調味料を買いに来たが、楼の下に人が大勢いたから、怖くて行かなかった。兄貴がここで待っていろと言ったんだ。あいつは榜文を見つけ、つむじ風を起こして剝がし、こっそり俺の懐へ入れて、先に行ってしまったのさ。」
    太監「先ほど、色白で太った和尚が、まっすぐ朝門へ行くのを見た。それがお前の師匠か。」
    八戒「そうだ、そうだ。」
    太監「兄弟子はどこへ行った。」
    八戒「俺たちは四人連れだ。師匠は通行文書の証印をもらいに行き、俺たち三人は荷物も馬も一緒に、会同館で休んでいる。兄貴は俺をからかって、先に館へ帰ったんだ。」
    太監「校尉たち、引っ張るのはやめなさい。一緒に館へ行けば、事の次第は分かる。」
    八戒「この二人のばあさまは話が分かる。」
    校尉たち「この和尚は、まるで人を見る目がない。公公（こうこう）に向かって、どうしてばあさまなどと呼ぶのだ。」
    八戒は笑った。
    八戒「恥ずかしくないのか。陰陽を逆にしているのはお前らだ。あの二人はおばあさんじゃないか。ばあさん、ばあさまと呼ばずに、じいさまの公公だって？」
    人々「口をたたくのはよせ。早く兄弟子を探しに行こう。」
  "translation_status": "reviewed"
- "id": "xy-ch68-024"

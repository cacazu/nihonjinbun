  "origin": "source"
  "source_text": "覽畢，滿心歡喜道：「古人云：『行動有三分財氣。』早是不在館中獃坐。即此不必買甚調和，且把取經事寧耐一日，等老孫做個醫生耍耍。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    読み終えた悟空は、心から喜んで言った。
    悟空「昔から『出歩けば、三分の金運がつく』と言う。館でぼんやり座っていなくてよかった。こうなれば調味料なんぞ買うことはない。経を取りに行くのは一日待ってもらって、この俺が医者になって遊んでやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch68-021"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，彎倒腰，丟了碗盞，拈一撮土，往上灑去，念聲咒語，使個隱身法，輕輕的上前揭了榜。朝著巽地上吸口仙氣吹來，立起一陣旋風，將人都吹散。他卻回身，徑到八戒站處，只見那獃子嘴拄著牆根，卻是睡著了一般。行者更不驚他，將榜文摺了，輕輕揣在他懷裡，拽轉步，先往會同館去了不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 152
    "line_end": 152
  "translation_ja": "見事な悟空、腰をかがめ、碗や小鉢を放り出し、土を一つまみ取って上へ撒いた。呪文を唱え、姿を隠す術を使い、そっと前へ出て榜を剝がす。巽（たつみ）の方角へ向き、仙気を一口吸って吹き出すと、たちまちつむじ風が起こり、人々を吹き散らした。それから身を返し、まっすぐ八戒の立っている所へ行った。八戒は口を壁の根元へ押しつけ、眠っているも同然だった。悟空は起こさず、榜文を折り畳むと、そっと懐へ差し込み、くるりと踵を返して、ひと足先に会同館へ帰った。こちらはひとまず置く。"
  "translation_status": "reviewed"
- "id": "xy-ch68-022"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那樓下眾人見風起時，各各蒙頭閉眼。不覺風過時，沒了皇榜，眾皆悚懼。那榜原有十二個太監、十二個校尉早朝領出，才掛不上三個時辰，被風吹去，戰兢兢左右追尋，忽見豬八戒懷中露出個紙邊兒來。眾人近前道：「你揭了榜來耶？」那獃子猛擡頭，把嘴一\U00022D6E。諕得那幾個校尉踉踉蹡蹡，跌倒在地。他卻轉身要走，又被面前幾個膽大的扯住道：「你揭了招醫的皇榜，還不進朝醫治我萬歲去，卻待何往？」那獃子慌慌張張道：「你兒子便揭了皇榜，你孫子便會醫治。」校尉道：「你懷中揣的是甚？」獃子卻才低頭看時，真個有一張字紙。展開一看，咬著牙罵道：「那猢猻害殺我也。」恨一聲，便要扯破。早被眾人架住道：「你是死了。此乃當今國王出的榜文，誰敢扯壞？你既揭在懷中，必有醫國之手，快同我去。」八戒喝道：「汝等不知。這榜不是我揭的，是我師兄孫悟空揭的。他暗暗揣在我懷中，他卻丟下我去了。若得此事明白，我與你尋他去。」眾人道：「說甚麼亂話？現鐘不打打鑄鐘？你現揭了榜文，教我們尋誰？不管你，扯了去見主上。」那夥人不分清白，將獃子推推扯扯。這獃子立定腳，就如生了根一般，十來個人也弄他不動。八戒道：「汝等不知高低，再扯一會，扯得我獃性子發了，你卻休怪。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    さて、楼の下の人々は、風が起こると、それぞれ頭を覆い、目を閉じた。風が過ぎたと思うと、いつの間にか王の榜がなくなっており、皆は恐れおののいた。この榜は、太監（たいかん）十二人、校尉（こうい）十二人が朝早く受け取って運び出したもので、掲げてからまだ三時辰（じしん）もたたぬうちに、風に吹き去られてしまったのだ。びくびくしながら辺りを捜すと、ふと八戒の懐から紙の端がのぞいているのが見えた。
    掲示を守る者たちは近寄って言った。
    掲示を守る者たち「榜を剝がしたのはお前か。」
    八戒は急に頭を上げ、口をひょいと振り出した。校尉たちは驚き、よろめいて地面へ倒れた。八戒が身を返して行こうとすると、前にいた何人かの胆の据わった者がつかまえた。
    胆の据わった者たち「医者を招く王の榜を剝がしたからには、朝廷へ行って陛下を治療しないか。どこへ行こうというのだ。」
    八戒はうろたえて言った。
    八戒「俺が王の榜を剝がしたなら、お前の息子になってやる。治療ができるなら、お前の孫になってやる。」
    校尉「では、その懐に入れているものは何だ。」
    八戒がようやくうつむいて見ると、本当に字の書かれた紙が一枚あった。広げて見るなり、歯を食いしばって罵った。
    八戒「あの猿、俺をひどい目に遭わせやがった。」
    恨みの声を上げ、破ろうとしたが、人々がすかさず押さえた。
    掲示を守る者たち「お前、命がないぞ。これは今の国王がお出しになった榜文だ。誰が破ってよいものか。剝がして懐に入れたからには、王の病を治す腕があるはずだ。早く来い。」
    八戒は怒鳴った。
    八戒「お前らは何も知らない。この榜を剝がしたのは俺じゃない。兄弟子の孫悟空（そんごくう）だ。こっそり俺の懐へ入れて、置き去りにしやがった。はっきりさせたいなら、一緒にあいつを探しに行こう。」
    掲示を守る者たち「何をでたらめな。目の前の鐘を鳴らさず、これから鋳る鐘を鳴らせと言うのか。お前が榜文を剝がして持っているのに、誰を探せと言う。知るものか。主上の前へ引っ立てていくぞ。」
    連中は是非もわきまえず、八戒を押したり引いたりした。だが八戒は足を踏みしめ、根を生やしたように立ち、十人余りでも動かせなかった。
    八戒「お前ら、身の程を知らないな。これ以上引っ張って、俺の癇癪に火をつけても、恨むなよ。」
  "translation_status": "reviewed"

  "translation_ja": |-
    二人は手を取り合い、通りを西へ進んだ。悟空は茶店をいくつも、飯屋を何軒も通り過ぎたが、買うべき所で買わず、食べるべき所で食べない。
    八戒「兄貴、この辺りで適当に買って食おうよ。」
    もとから八戒をからかうつもりの悟空は、買う気などなく、言った。
    悟空「弟よ、お前は買い物が下手だな。もう少し歩いて、大きなのを選んで食おう。」
    二人が話しながら歩くと、また大勢が後をついて、争って見物した。やがて鼓楼のそばに来ると、その下で無数の人が騒ぎ、ぎゅうぎゅう詰めになって道を塞いでいた。八戒は見て言った。
    八戒「兄貴、俺は行かない。あそこは大騒ぎだ。坊主を捕まえているんじゃないか。まして俺たちは、見知らぬ怪しい奴らだ。捕まったらどうする。」
    悟空「ばかなことを言うな。坊主でも法を犯していないのに、どうして捕まる。向こうへ行って、鄭家の店で調味料を買おう。」
    八戒「やめた、やめた、やめた。俺は厄介を起こしたくない。あの人込みへ押し入って、耳を二度振ったら、皆は驚いて転んだり這ったりするだろう。何人か転んで死ねば、俺が命で償わされるんだ。」
    悟空「それなら、ここの壁際にじっと立っていろ。俺が向こうで買って戻るから、精進の麺と焼餅を買ってやろう。」
    八戒は碗や小鉢を悟空へ渡し、口を壁の根元へ押しつけ、顔をそむけて、何があろうと動かなくなった。
  "translation_status": "reviewed"

  "source_text": "這行者走至樓邊，果然擠塞。直挨入人叢裡聽時，原來是那皇榜張掛樓下，故多人爭看。行者擠到近處，閃開火眼金睛，仔細看時，那榜上卻云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 147
    "line_end": 147
  "translation_ja": "悟空が楼のそばへ行くと、果たして人で詰まっていた。人込みへ体をねじ込んで聞くと、楼下に王の榜文が掲げられたので、皆が争って見ているのだった。悟空は近くまで押し進み、火眼金睛（かがんきんせい）を光らせて、よく読んだ。榜にはこう書いてあった。"
  "translation_status": "reviewed"
- "id": "xy-ch68-019"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "朕西牛賀洲朱紫國王，自立業以來，四方平服，百姓清安。近因國事不祥，沉痾伏枕，淹延日久難痊。本國太醫院屢選良方，未能調治。今出此榜文，普招天下賢士。不拘北往東來，中華外國，若有精醫藥者，請登寶殿，療理朕躬。稍得病愈，願將社稷平分，決不虛示。為此出給張掛。須至榜者。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    朕は西牛賀洲（さいごかしゅう）、朱紫国の王である。国を立てて以来、四方は服し、民は安らかに暮らしてきた。近ごろ国事に不祥のことがあり、朕は重い病で床に伏し、長い時が過ぎても癒えぬ。本国の太医院（たいいいん）は、たびたびよい処方を選んだが、治療できなかった。
    よって今、この榜文を出し、広く天下の賢士を招く。北へ往く者、東から来る者、中華の者、外国の者を問わず、医薬に精通した者があれば、宝殿へ参り、朕の身を治療されたい。いささかでも病が癒えたなら、国を等しく二分して与える所存である。決して空言ではない。
    このため榜文を出し、掲示する。右、榜示するものなり。
  "translation_status": "reviewed"

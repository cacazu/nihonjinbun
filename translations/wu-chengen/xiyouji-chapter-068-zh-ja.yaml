  "translation_ja": |-
    臣たちは命を受け、榜の番をしていた太監や校尉とともに、会同館へまっすぐ向かい、位の順に並んで拝礼した。八戒は驚いて脇の部屋へ隠れ、沙悟浄も壁際へ身を引いた。だが見れば、悟空は中央に端然と座り、身じろぎもしなかった。八戒はひそかに恨めしそうに言った。
    八戒「あの猿、こんな大層な礼を受けて、命を縮めるぞ。これだけ大勢の役人が拝礼しているのに、礼も返さず、立ち上がりさえしないとは。」
    ほどなく拝礼が終わり、臣たちは班ごとに申し上げた。
    臣たち「神僧孫長老に申し上げます。我々は皆、朱紫国王の臣です。王の命を受け、謹んで清らかな礼を尽くして神僧をお招きし、朝廷で病を診ていただきたく参りました。」
    悟空は、ようやく立ち上がり、一同へ言った。
    悟空「なぜ王が来ない。」
    臣たち「王は体が弱り、力も乏しく、輦にお乗りになれません。特に我々へ、君主に代わる礼を行い、神僧を拝してお迎えするよう命じられたのです。」
    悟空「そういうことなら、皆さん、先に行ってくれ。俺も続いて行こう。」
    臣たちは、それぞれの位に従って列を組み、出ていった。悟空も衣服を整え、立ち上がった。
    八戒「兄貴、俺たちまで巻き添えにしないでくれよ。」
    悟空「巻き添えにはしない。二人で、俺の薬を受け取っておいてくれればいい。」
    沙悟浄「どんな薬を受け取るんだい。」
    悟空「俺のために薬を届ける者がいたら、数を確かめて、そのとおり受け取っておけ。帰ってきたら使う。」
    二人は承知した。その話は、ひとまず置く。
  "translation_status": "reviewed"

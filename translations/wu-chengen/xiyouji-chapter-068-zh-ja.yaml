  "source_languages": []
  "source_locations": []
  "translation_ja": "『啞請』は、言葉を控えてその場にとどまり、迎えの手配を待つ意味に取ったが、細部は未確定。『裝胖』も、八戒を見かけだけの大人物に仕立てる意と解した。いずれも原字を保持し、別字へ補訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-14-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "直前には半数ずつに分かれるとの提案があるが、実際に出て行った人数は太監四人・校尉六人。初めの太監十二人・校尉十二人との計算を合わせず、提案と実行をそのまま区別した。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-15-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「背馬」は馬の背に鞍を置くこと。教育部重編國語辭典の検索表示でこの語義を確認した（https://dict.revised.moe.edu.tw/dictView.jsp?ID=15116&la=0&powerMode=0）。馬を背負って歩く動作へ置き換えない。弟子の医術を否定しているのは三蔵であり、語り手が能力を確定した説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-16-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『折殺』は、身分不相応な大礼を受けて寿命や福を減らすという言い方。ここでは八戒の陰での不満として訳す。悟空の寿命が実際に縮んだという語り手の事実説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-17-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "望・聞・問・切は伝統的な診察の四段階。詩は顔色や体の様子、声、病歴・飲食・便通、脈と経絡の順をすべて説明する。『浮沉表裡』は脈の浮沈と病の表裏に関わる古い医理の語であり、本文の列挙を現代医学の診断基準へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-18-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『難経』六十一難は、望んで知るものを神、聞いて知るものを聖、問うて知るものを工、脈を切して知るものを巧という。底本の『神聖功巧』は工でなく功の字なので、訳文でも功を保持した。難経の原文は検索表示で照合（https://ctext.org/dictionary.pl?char=六十一&if=gb）。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-19-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "国王のこの言葉は原文の『心中暗想』に従う内心である。近侍がどのように許可を聞いたかの発言・動作は原文にないので追加しない。懸糸診脈を試す許可が述べられたのであって、まだ診断や治療の成功は示されていない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-20-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "治療して死なせても死罪にはならないというのは悟空の発言であり、語り手の確認した法制説明ではない。原文の『庸醫殺人罪名』と、繰り返す『不打緊』を省かず残した。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-21-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "挙げられる四書名を保持した。『素問』と『難経』の読みは国立国会図書館の書誌（https://ndlsearch.ndl.go.jp/books/R100000002-I000002803271）、『脈訣』は京都大学の所蔵書誌（https://rmda.kulib.kyoto-u.ac.jp/item/rb00005301）の検索表示で確認。『本草』『脈訣』には複数の伝本・系統があるため、本文だけから特定の著者・版へ限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-22-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "毛は三本、変わった糸も三筋で、それぞれ二丈四尺。二十四気という暦の区分に二十四尺を対応させる原文の説明を保った。丈・尺は当時の度量衡であり、確定したメートル値へ換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch68-note-23-body"
  "section_id": "chapter-68"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『治國』は国を治めることと国王を治すことを重ねる表現と解する。『註長生』は長生きを記す意として訳したが、註の語感には留保がある。診察前の結びの詩であり、治癒の結果を述べ足さない。"
  "translation_status": "reviewed"

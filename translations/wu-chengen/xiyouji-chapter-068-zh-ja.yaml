    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    見物の連中は、皆、門の外で騒いでいた。八戒は太監と校尉の一行を連れて館に入った。客室では、悟空と沙悟浄が、ちょうど榜を剝がした話をして笑っていた。八戒は進み出て悟空をつかみ、大声でわめいた。
    八戒「お前、それでも人間か。精進の麺や焼餅、饝饝を買って食わせるとだましたが、全部口先だけじゃないか。そのうえつむじ風を起こして、何だか知らない王の榜を剝がし、こっそり俺の懐へ入れて、俺を大物に仕立てたな。これが兄弟のすることか。」
    悟空は笑った。
    悟空「ばかだな、お前は道を間違えて、よそへ行ったんだろう。俺は鼓楼を過ぎ、調味料を買って急いで戻ったが、お前がいないので先に帰ったんだ。どこで王の榜なんぞ剝がしたというんだ。」
    八戒「榜を見張っていた役人たちが、ここにいるぞ。」
    言い終わらぬうちに、太監と校尉たちが、悟空に向かって礼拝した。
    太監と校尉たち「孫さま、今日、わが王に幸いな縁があって、天があなたさまをお遣わしくださったのです。どうか大きく世を治めるお力を発揮し、三折肱（さんせつこう）の腕を少しお使いになって、王の病をお治しください。国土もお分けし、国を半分ずつにいたします。」
    悟空はこれを聞くと、声と顔つきを改め、八戒から榜文を受け取り、一同へ言った。
    悟空「お前たちが、榜の番をしていた役人か。」
    太監は頭を地につけた。
    太監「私どもは、司礼監（しれいかん）の内臣でございます。こちらは錦衣校尉（きんいこうい）たちでございます。」
    悟空「医者を求めるこの榜を剝がしたのは、確かに俺だ。それで弟弟子をやって、取り次がせた。主君が病んでいるなら、昔から『薬は軽々しく売らず、医者は病人を追って回らぬ』と言う。王に、自分で俺を迎えに来るよう言ってくれ。俺なら手を下すなり病を除ける。」
    太監たちは、一人残らず驚いた。
    校尉「これだけ大きなことを言うからには、それに見合う力量がおありなのだろう。我々の半分はここに残り、黙ってお迎えを待ち、半分は朝廷へ奏上に行こう。」

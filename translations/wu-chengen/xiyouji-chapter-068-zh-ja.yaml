  "source_text": "當分了四個太監、六個校尉，更不待宣召，徑入朝，當階奏道：「主公萬千之喜。」那國王正與三藏膳畢清談，忽聞此奏，問道：「喜自何來？」太監奏道：「奴婢等早領出招醫皇榜，鼓樓下張掛。有東土大唐遠來取經的一個聖僧孫長老揭了，現在會同館內，要王親自去請他，他有手到病除之功。故此特來啟奏。」國王聞言，滿心歡喜，就問唐僧道：「法師有幾位高徒？」三藏合掌答曰：「貧僧有三個頑徒。」國王問：「那一位高徒善醫？」三藏道：「實不瞞陛下說，我那頑徒，俱是山野庸才，只會挑包背馬，轉澗尋波，帶領貧僧登山涉嶺，或者到峻險之處，可以伏魔擒怪，捉虎降龍而已，更無一個能知藥性者。」國王道：「法師何必太謙？朕當今日登殿，幸遇法師來朝，誠天緣也。高徒既不知醫，他怎肯揭我榜文，教寡人親迎？斷然有醫國之能也。」叫：「文武眾卿，寡人身虛力怯，不敢乘輦。汝等可替寡人，俱到朝外，敦請孫長老，看朕之病。汝等見他，切不可輕慢，稱他做『神僧孫長老』，皆以君臣之禮相見。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    そこで太監四人と校尉六人が分かれ出て、召されるのも待たずに朝廷へ入り、階前で奏上した。
    太監と校尉たち「陛下、幾重にもお喜び申し上げます。」
    国王は、三蔵と食事を終えて静かに語り合っていたが、突然の奏上を聞いて尋ねた。
    国王「何がめでたいのだ。」
    太監「私どもが朝早く受け取り、鼓楼の下へ掲げた医者募集の詔榜を、東土の大唐からはるばる経を取りに来た、孫長老（そんちょうろう）という聖僧が剝がしました。今、会同館におり、陛下ご自身に迎えに来ていただきたい、手を下せばただちに病を除けると申しております。それゆえ、お知らせに参りました。」
    国王は心から喜び、三蔵に尋ねた。
    国王「法師には、何人の立派な弟子がおるのか。」
    三蔵は合掌して答えた。
    三蔵「愚かな弟子が三人おります。」
    国王「どの弟子が医術に優れておるのか。」
    三蔵「陛下に隠すつもりはございません。私の弟子たちは、皆、山野の凡庸な者で、荷物を担ぎ、馬に鞍を置き、谷や川の道を探し、私を導いて山や峰を越えることしかできません。もし険しい危険な所へ行けば、魔物や妖怪を捕らえ、虎や竜を降すことはできますが、それだけです。薬の性質を知る者は、一人もおりません。」
    国王「法師よ、何もそこまで謙遜せずともよい。朕が今日、殿に出たところ、幸いにも法師が朝廷へ来られた。まことに天の縁だ。弟子に医術の心得がないなら、なぜ朕の榜文を剝がし、余自身に迎えに来いと言うだろう。必ずや王を治す力があるのだ。」
    国王は呼びかけた。
    国王「文武の臣たちよ、余は体が弱り、力も乏しく、輦（れん）に乗るのも心もとない。皆は余に代わり、そろって朝廷の外へ行き、孫長老を丁重に迎え、朕の病を診てもらえ。会ったら、決して軽んじてはならぬ。『神僧孫長老（しんそうそんちょうろう）』と呼び、皆、君に仕える臣の礼をもって接するのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch68-027"

  "source_text": "不多時，鬧動了街坊，將他圍繞。內有兩個年老的太監道：「你這相貌稀奇，聲音不對，是那裡來的，這般村強？」八戒道：「我們是東土差往西天取經的。我師父乃唐王御弟法師，卻才入朝，倒換關文去了。我與師兄來此買辦調和，我見樓下人多，未曾敢去，是我師兄教我在此等候。他原來見有榜文，弄陣旋風揭了，暗揣我懷內，先去了。」那太監道：「我先前見個白面胖和尚，徑奔朝門而去，想就是你師父？」八戒道：「正是，正是。」太監道：「你師兄往那裡去了？」八戒道：「我們一行四眾，師父去倒換關文，我三眾並行囊、馬匹俱歇在會同館。師兄弄了我，他先回館中去了。」太監道：「校尉不要扯他，我等同到館中，便知端的。」八戒道：「你這兩個奶奶知事。」眾校尉道：「這和尚委不識貨，怎麼趕著公公叫起奶奶來耶？」八戒笑道：「不羞，你這反了陰陽的。他二位老媽媽兒，不叫他做婆婆、奶奶，倒叫他做公公？」眾人道：「莫弄嘴，快尋你師兄去。」"

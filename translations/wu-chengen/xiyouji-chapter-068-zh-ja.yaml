  "source_text": "那街上人吵吵鬧鬧，何止三五百，共扛到館門首。八戒道：「列位住了。我師兄卻不比我任你們作戲。他卻是個猛烈認真之士。汝等見了，須要行個大禮，叫他聲孫老爺，他就招架了；不然啊，他就變了嘴臉，這事卻弄不成也。」眾太監、校尉俱道：「你師兄果有手段，醫好國王，他也該有一半江山，我等合該下拜。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"

  "translation_status": "reviewed"
- "id": "xy-ch68-002"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": "善正萬緣收，名譽傳揚四部洲。智慧光明登彼岸，颼颼，靉靉雲生天際頭。諸佛共相酬，永住瑤臺萬萬秋。打破人間蝴蝶夢，休休，滌淨塵氛不惹愁。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    善と正しさに、あらゆる縁が収まり、
    その名声は四部洲（しぶしゅう）に伝わる。
    智慧の光に照らされ、彼岸へ登れば、
    さわさわと、
    幾重もの雲が天の果てに湧き起こる。
    諸仏とともに応え合い、
    瑶台（ようだい）に永く住まう、万々の秋。
    人の世の胡蝶の夢を打ち破れ、
    やめよ、やめよ、
    塵の汚れを洗い尽くせば、憂いにとらわれることもない。
  "translation_status": "reviewed"
- "id": "xy-ch68-003"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表三藏師徒洗污穢之衚衕，上逍遙之道路，光陰迅速，又值炎天。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 124
    "line_end": 124
  "translation_ja": "さて、三蔵（さんぞう）たち師弟は汚れた細道を清め、ゆったりと行ける道へ出た。月日の過ぎるのは早く、またも暑い季節となった。まさしく、"
  "translation_status": "reviewed"
- "id": "xy-ch68-004"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": "海榴舒錦彈，荷葉綻青盤。兩路綠楊藏乳燕，行人避暑扇搖紈。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    ザクロは錦の玉をほどくように咲き、蓮の葉は青い皿を広げる。
    道の両側の緑の柳には燕の雛が隠れ、旅人は暑さを避けて絹の団扇を揺らす。
  "translation_status": "reviewed"
- "id": "xy-ch68-005"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "進前行處，忽見有一城池相近。三藏勒馬叫：「徒弟們，你看那是甚麼去處？」行者道：「師父原來不識字，虧你怎麼領唐王旨意離朝也？」三藏道：「我自幼為僧，千經萬典皆通，怎麼說我不識字？」行者道：「既識字，怎麼那城頭上杏黃旗，明書三個大字，就不認得，卻問是甚去處何也？」三藏喝道：「這潑猴胡說。那旗被風吹得亂擺，縱有字也看不明白。」行者道：「老孫偏怎看見？」八戒、沙僧道：「師父，莫聽師兄搗鬼。這般遙望，城池尚不明白，如何就見是甚字號？」行者道：「卻不是『朱紫國』三字？」三藏道：「朱紫國必是西邦王位，卻要倒換關文。」行者道：「不消講了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    先へ進むうち、ふと近くに城郭が見えてきた。三蔵は馬を止めて呼びかけた。
    三蔵「弟子たちよ、あれはどこだろう。」
    悟空（ごくう）「お師匠さまは、実は字が読めないのですね。それでよく、唐王（とうおう）の勅命を受けて都を発たれたものです。」
    三蔵「私は幼いころから僧となり、千の経、万の典に通じている。なぜ字が読めぬなどと言うのだ。」
    悟空「読めるのでしたら、城壁の上の山吹色の旗に、三つの大きな字がはっきり書いてあるのに、どうして読まず、どこだなどとお尋ねになるのです。」
    三蔵は叱った。
    三蔵「この猿め、でたらめを言うな。旗が風にあおられて揺れている。字があっても、よく見えぬではないか。」
    悟空「それでは、どうして私には見えるのでしょう。」
    八戒（はっかい）と沙悟浄（さごじょう）「お師匠さま、兄弟子のからかいにおつき合いなさらないでください。こんな遠くからでは、城郭さえはっきりしないのに、何という字か分かるはずがありません。」
    悟空「『朱紫国（しゅしこく）』の三字じゃないか。」
    三蔵「朱紫国なら、きっと西方の王国だ。通行文書に証印をもらわねばならないね。」
    悟空「それは言うまでもありません。」
  "translation_status": "reviewed"
- "id": "xy-ch68-006"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，至城門下馬，過橋，入進三層門裡，真個好個皇州，但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 129
    "line_end": 129
  "translation_ja": "ほどなく城門の下に着いて馬を下り、橋を渡り、三重の門をくぐった。まことに立派な帝都である。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch68-007"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": "門樓高聳，垛疊齊排。周圍活水通流，南北高山相對。六街三市貨資多，萬戶千家生意盛。果然是個帝王都會處，天府大京城。絕域梯航至，遐方玉帛盈。形勝連山遠，宮垣接漢清。三關嚴鎖鑰，萬古樂昇平。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    門楼は高くそびえ、狭間のある胸壁が整然と並ぶ。
    周囲には流れる水が通じ、南と北には高山が向かい合う。
    六街三市（ろくがいさんし）には商品が豊かにあふれ、万戸千家の商いは盛ん。
    まことに帝王の住む都、豊かさに恵まれた大京城。
    遠い異国から山を越え海を渡って人が来て、遠方の玉や絹が満ちあふれる。
    すぐれた地勢は山々へ遠く連なり、宮殿の垣は清らかな天の川へと届く。
    三つの関門は厳重に鎖され、万代の太平を楽しむ。
  "translation_status": "reviewed"
- "id": "xy-ch68-008"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們在那大街市上行時，但見人物軒昂，衣冠齊整，言語清朗，真不亞大唐世界。那兩邊做買做賣的，忽見豬八戒相貌醜陋，沙和尚面黑身長，孫行者臉毛額廓，丟了買賣，都來爭看。三藏只叫：「不要撞禍，低著頭走。」八戒遵依，把個蓮蓬嘴揣在懷裡；沙僧不敢仰視；惟行者東張西望，緊隨唐僧左右。那些人有知事的，看看兒就回去了。有那遊手好閑的，並那頑童們，烘烘笑笑，都上前拋瓦丟磚，與八戒作戲。唐僧捏著一把汗，只教：「莫要生事。」那獃子不敢擡頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    師弟が大通りを歩くと、人々は堂々とし、衣冠は整い、言葉も明瞭で、まったく大唐（だいとう）の世に劣らなかった。道の両側で商売をしていた者たちは、八戒の醜い顔、沙悟浄の黒い顔と長身、悟空の毛だらけの顔と張り出した額を見るなり、商いを放り出して争って見に来た。
    三蔵は繰り返し言った。
    三蔵「厄介を起こさないよう、頭を下げて歩きなさい。」
    八戒は言いつけどおり、蓮の実の房のような口を懐へ引っ込めた。沙悟浄も顔を上げようとしない。ただ悟空だけは、きょろきょろと辺りを見回しながら、三蔵のすぐそばについていた。分別のある人々は、しばらく眺めると帰っていった。だが、仕事もせずにぶらつく連中やいたずらな子供たちは、わいわい笑いながら進み出て、瓦や煉瓦を投げて八戒をからかった。三蔵は冷や汗を握り、ただ言い聞かせた。
    三蔵「騒ぎを起こしてはいけないよ。」
    八戒は頭を上げられなかった。
  "translation_status": "reviewed"
- "id": "xy-ch68-009"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，轉過隅頭，忽見一座門牆，上有「會同館」三字。唐僧道：「徒弟，我們進這衙門去也。」行者道：「進去怎的？」唐僧道：「會同館乃天下通會通同之所，我們也打攪得。且到裡面歇下，待我見駕，倒換了關文，再趕出城走路。」八戒聞言，掣出嘴來，把那些隨看的人諕倒了數十個。他上前道：「師父說的是，我們且到裡邊藏下，免得這夥鳥人噪嚷。」遂進館去。那些人方漸漸而退。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    やがて角を曲がると、一軒の門構えがあり、その上に「会同館（かいどうかん）」の三字があった。
    三蔵「弟子たちよ、この役所へ入ろう。」
    悟空「入ってどうするのです。」
    三蔵「会同館は、天下の人が行き交い、集まるところだ。私たちも世話になれる。ひとまず中で休み、私が王に会って通行文書に証印をいただいたら、また急いで城を出て旅を続けよう。」
    これを聞いて八戒が口を突き出すと、後をついて見物していた人が何十人も驚いて倒れた。八戒は前へ出て言った。
    八戒「お師匠さまの言うとおりです。ひとまず中に隠れましょう。このろくでなしどもの騒ぎ声を聞かずにすみます。」
    そこで館へ入ると、人々もようやく少しずつ引き揚げていった。
  "translation_status": "reviewed"
- "id": "xy-ch68-010"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那館中有兩個大使，乃是一正一副，都在廳上查點人夫，要往那裡接官。忽見唐僧來到，個個心驚，齊道：「是甚麼人？是甚麼人？往那裡走？」三藏合掌道：「貧僧乃東土大唐駕下差往西天取經者。今到寶方，不敢私過，有關文欲倒驗放行，權借高衙暫歇。」那兩個館使聽言，屏退左右，一個個整冠束帶，下廳迎上相見。即命打掃客房安歇，教辦清素支應。三藏謝了。二官帶領人夫，出廳而去。手下人請老爺客房安歇，三藏便走。行者恨道：「這廝憊懶，怎麼不讓老孫在正廳？」三藏道：「他這裡不服我大唐管屬，又不與我國相連，況不時又有上司過客來往，所以不好留此相待。」行者道：「這等說，我偏要他相待。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    さて、その館には正使と副使の二人の館使がおり、広間で人足の数を調べ、どこかへ役人を迎えに行こうとしていた。三蔵が来るのを見ると、二人とも驚き、声をそろえて言った。
    二人の館使「何者です。何者です。どちらへ行かれるのです。」
    三蔵は合掌した。
    三蔵「私は東土（とうど）の大唐の天子から、西天（さいてん）へ経を取りに遣わされた僧です。当地へ参りましたが、勝手に通り過ぎるわけにはまいりません。通行文書を調べて証印をいただき、通過をお許し願いたく、しばらくこちらの役所で休ませていただければと存じます。」
    これを聞いた二人の館使は、左右の者を下がらせ、それぞれ冠と帯を整え、広間を下りて迎え、挨拶した。そして客室を掃除して休ませるよう命じ、精進の食料も用意させた。三蔵は礼を言った。二人の役人は人足を連れ、広間を出ていった。配下の者に客室で休むよう勧められ、三蔵はそちらへ向かった。悟空は不満を口にした。
    悟空「不届きな連中だ。どうして俺を正面の広間に置かないんだ。」
    三蔵「この国は大唐の支配下ではないし、わが国と国境を接してもいない。それに、上役や旅の客がときどき来るのだから、ここへ私たちを留めて接待するわけにもいかないのだよ。」
    悟空「そういうことなら、なおさら俺を接待させてやりましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch68-011"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說處，有管事的送支應來，乃是一盤白米、一盤白麵、兩把青菜、四塊豆腐、兩個麵觔、一盤乾筍、一盤木耳。三藏教徒弟收了，謝了管事的。管事的道：「西房裡有乾淨鍋灶，柴火方便，請自去做飯。」三藏道：「我問你一聲：國王可在殿上麼？」管事的道：「我萬歲爺爺久不上朝，今日乃黃道良辰，正與文武多官議出黃榜。你若要倒換關文，趁此急去，還趕上；到明日，就不能夠了，不知還有多少時伺候哩。」三藏道：「悟空，你們在此安排齋飯，等我急急去驗了關文回來，吃了走路。」八戒急取出袈裟關文。三藏整束了進朝，只是吩咐徒弟，不可出外去生事。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    そう話していると、管理役が食料を運んできた。白米一皿、小麦粉一皿、青菜二束、豆腐四切れ、麩二つ、干し筍一皿、木耳一皿だった。三蔵は弟子たちに受け取らせ、管理役へ礼を言った。
    管理役「西の部屋に、きれいな鍋と竈がございます。薪も自由に使えますから、ご自分でお炊きください。」
    三蔵「一つ伺いますが、国王は今、殿上においででしょうか。」
    管理役「陛下は長く朝廷にお出ましになりませんでしたが、今日は黄道吉日（こうどうきちじつ）で、ちょうど文武の官たちと、黄色い詔榜を出す相談をなさっています。通行文書に証印をいただくのでしたら、今すぐ行けば、まだ間に合います。明日になったら、もう駄目です。次にいつまで待たねばならないか、分かりませんよ。」
    三蔵「悟空、お前たちはここで精進の食事を用意しておくれ。私は急いで通行文書を調べていただいてくる。帰ってから食べて、出発しよう。」
    八戒は急いで袈裟と通行文書を取り出した。三蔵は身なりを整えて朝廷へ向かい、弟子たちには、外へ出て騒ぎを起こしてはならないと、くれぐれも言いつけた。
  "translation_status": "reviewed"
- "id": "xy-ch68-012"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不一時，已到五鳳樓前。說不盡那殿閣崢嶸，樓臺壯麗。直至端門外，煩奏事官轉達天廷，欲倒驗關文。那黃門官果至玉階前啟奏道：「朝門外有東土大唐欽差一員僧，前往西天雷音寺拜佛求經，欲倒換通關文牒，聽宣。」國王聞言，喜道：「寡人久病，不曾登基。今上殿出榜招醫，就有高僧來國。」即傳旨宣至階下。三藏即禮拜俯伏。國王又宣上金殿賜坐，命光祿寺辦齋。三藏謝了恩，將關文獻上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    まもなく五鳳楼（ごほうろう）の前に着いた。そびえる殿閣や壮麗な楼台は、とても語り尽くせない。三蔵は端門（たんもん）の外まで進み、奏事の官に取り次ぎを頼んで、通行文書の確認と証印を願った。黄門官（こうもんかん）は、さっそく玉の階の前へ出て奏上した。
    黄門官「朝門の外に、東土の大唐から勅命を受けた僧が一人、参っております。西天の雷音寺（らいおんじ）へ仏を拝み、経を求めに行く途中で、通関文牒（つうかんもんちょう）の証印を願い、お召しを待っております。」
    国王は聞くと喜んだ。
    国王「余は長く病み、王座にも出ておらなんだ。今日は殿に出て医者を求める榜を出そうとしたところ、もう高僧がこの国へ来てくれたか。」
    ただちに階下へ召すよう命じた。三蔵が礼拝してひれ伏すと、国王はさらに金殿へ上がらせ、席を与え、光禄寺（こうろくじ）に精進料理を用意するよう命じた。三蔵は恩を謝し、通行文書を差し出した。
  "translation_status": "reviewed"
- "id": "xy-ch68-013"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王看畢，十分歡喜道：「法師，你那大唐，幾朝君正？幾輩臣賢？至於唐王，因甚作疾回生，著你遠涉山川求經？」這長老因問，即欠身合掌道：「貧僧那裡："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    国王は読み終えると、大いに喜んで言った。
    国王「法師よ、その大唐には、これまで幾代の正しい君主、幾代の賢臣があったのか。また唐王は、何ゆえ病んでのちによみがえり、そなたをはるばる山川のかなたまで、経を求めに行かせたのか。」
    問われた三蔵は、身を起こして合掌した。
    三蔵「私どもの国では、次のように代が続いてまいりました。」
  "translation_status": "reviewed"
- "id": "xy-ch68-014"
  "section_id": "chapter-68"
  "kind": "verse"
  "origin": "source"
  "source_text": "三皇治世，五帝分倫。堯舜正位，禹湯安民。成周子眾，各立乾坤。倚強欺弱，分國稱君。邦君十八，分野邊塵。後成十二，宇宙安淳。因無車馬，卻又相吞。七雄爭勝，六國歸秦。天生魯沛，各懷不仁。江山屬漢，約法欽遵。漢歸司馬，晉又紛紜。南北十二，宋齊梁陳。列祖相繼，大隋紹真。賞花無道，塗炭多民。我王李氏，國號唐君。高祖晏駕，當今世民。河清海晏，大德寬仁。茲因長安城北，有個怪水龍神，刻減甘雨，應該損身。夜間託夢，告王救迍。王言准赦，早召賢臣。款留殿內，慢把棋輪。時當日午，那賢臣夢斬龍身。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    三蔵「三皇（さんこう）が世を治め、五帝（ごてい）が人の倫を定めました。
    堯（ぎょう）と舜（しゅん）が位を正し、禹（う）と湯（とう）が民を安んじました。
    周（しゅう）の子孫は多く、それぞれ天地を打ち立て、
    強さに頼って弱者を欺き、国を分けて君と称しました。
    国の君主は十八、領地の境には戦塵が立ち、
    後に十二となって、天下は穏やかになりました。
    車馬がないため、また互いに併呑し、
    七雄（しちゆう）が勝ちを争い、六国は秦（しん）に帰しました。
    天は魯（ろ）と沛（はい）を生み、両者はそれぞれ不仁の心を抱きました。
    江山は漢（かん）のものとなり、簡明な法を慎んで守りました。
    漢は司馬氏（しばし）へ帰し、晋（しん）もまた乱れ、
    南北には十二、宋（そう）・斉（せい）・梁（りょう）・陳（ちん）。
    代々の祖が継いで、大隋（だいずい）が正統を受けましたが、
    花を賞でて道に背き、多くの民を塗炭の苦しみに陥れました。
    わが王は李氏（りし）、国号は唐（とう）と申します。
    高祖（こうそ）が崩じ、今の天子は世民（せいみん）。
    河は清く海は穏やか、大きな徳を備え、寛く仁に富んでおられます。
    ところが長安城（ちょうあんじょう）の北に、ある怪しい水の竜神がおり、
    恵みの雨を削ったために、命を失うことになりました。
    夜中に夢へ現れ、王へ難を救ってくれるよう願い、
    王は赦すと約束して、早々に賢臣をお召しになりました。
    手厚く殿内へ引き留め、ゆっくりと碁を打ち続けましたが、
    ちょうど正午、その賢臣は夢の中で竜の身を斬ったのです。」
  "translation_status": "reviewed"
- "id": "xy-ch68-015"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王聞言，忽作呻吟之聲，問道：「法師，那賢臣是那邦來者？」三藏道：「就是我王駕前丞相，姓魏名徵。他識天文，知地理，辨陰陽，乃安邦立國之大宰輔也。因他夢斬了涇河龍王，那龍王告到陰司，說我王許救又殺之，故我王遂得促病，漸覺身危。魏徵又寫書一封，與我王帶至陰司，寄與酆都城判官崔珏。少時，唐王身死，至三日復得回生。虧了魏徵，感崔判官改了文書，加王二十年壽。今要做水陸大會，故遣貧僧遠涉道途，詢求諸國，拜佛祖，取《大乘經》三藏，超度孽苦昇天也。」那國王又呻吟嘆道：「誠乃是天朝大國，君正臣賢。似我寡人久病多時，並無一臣拯救。」長老聽說，偷睛觀看，見那皇帝面黃肌瘦，形脫神衰。長老正欲啟問，有光祿寺官奏請唐僧奉齋。王傳旨，教「在披香殿，連朕之膳擺下，與法師同享。」三藏謝了恩，與王同進膳進齋不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    国王は聞くと、ふとうめき声を漏らし、尋ねた。
    国王「法師よ、その賢臣は、どこの国から来た者なのか。」
    三蔵「わが王に仕える丞相（じょうしょう）で、姓を魏（ぎ）、名を徴（ちょう）と申します。天文を知り、地理に通じ、陰陽（いんよう）を弁える、国を安んじて立てる大宰相です。その魏徴（ぎちょう）が夢の中で涇河竜王（けいがりゅうおう）を斬ったため、竜王は冥府へ訴え出て、わが王が救うと約束したのに殺したと言いました。それで王は急な病を得て、次第に命が危うくなりました。魏徴はさらに一通の手紙を書き、王に冥府まで持たせ、酆都城（ほうとじょう）の判官、崔珏（さいかく）へ届けました。間もなく唐王は亡くなり、三日目によみがえりました。これは魏徴のおかげで、崔判官（さいはんがん）を動かして文書を書き改めさせ、王の寿命を二十年延ばしてもらえたのです。今、水陸大会（すいりくだいえ）を催したいとお考えになり、私を遠い道へ遣わし、諸国を尋ね歩かせ、仏祖（ぶっそ）を拝み、大乗経（だいじょうきょう）の三蔵（さんぞう）を持ち帰らせて、罪業に苦しむ者たちを救い、天へ昇らせようとなさっているのです。」
    国王はまたうめき、ため息をついた。
    国王「まことに天朝の大国、君主は正しく、臣は賢い。余は長らく病んでいるのに、救ってくれる臣が一人もおらぬ。」
    三蔵はこれを聞いて、そっと目をやった。国王は顔が黄色く、肉が落ち、体はやつれ、気力も衰えていた。三蔵が尋ねようとしたところへ、光禄寺の官が、食事の用意ができたと奏上した。国王は命じた。
    国王「披香殿（ひこうでん）に、朕の膳と一緒に並べよ。法師とともにいただこう。」
    三蔵は恩を謝し、国王とともに、それぞれの食事と精進料理をとった。こちらの話は、ひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch68-016"
  "section_id": "chapter-68"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者在會同館中，著沙僧安排茶飯，並整治素菜。沙僧道：「茶飯易煮，蔬菜不好安排。」行者問道：「如何？」沙僧道：「油、鹽、醬、醋俱無也。」行者道：「我這裡有幾文襯錢，教八戒上街買去。」那獃子躲懶道：「我不敢去，嘴臉欠俊，恐惹下禍來，師父怪我。」行者道：「公平交易，又不化他，又不搶他，何禍之有？」八戒道：「你才不曾看見獐智？在這門前扯出嘴來，把人諕倒了十來個；若到鬧市叢中，也不知諕殺多少人哩。」行者道：「你只知鬧市叢中，你可曾看見那市上賣的是甚麼東西？」八戒道：「師父只教我低著頭，莫撞禍，實是不曾看見。」行者道：「酒店、米鋪、磨坊並綾羅雜貨不消說，著然又好茶房、麵店、大燒餅、大饝饝，飯店又有好湯飯、好椒料、好蔬菜，與那異品的糖糕、蒸酥、點心、\U00029707子、油食、蜜食，……無數好東西，我去買些兒請你如何？」那獃子聞說，口內流涎，喉嚨裡嘓嘓的嚥唾，跳起來道：「哥哥，這遭我擾你，待下次趲錢，我也請你回席。」行者暗笑道：「沙僧，好生煮飯，等我們去買調和來。」沙僧也知是耍獃子，只得順口應承道：「你們去，須是多買些，吃飽了來。」那獃子撈個碗盞拿了，就跟行者出門。有兩個在官人問道：「長老那裡去？」行者道：「買調和。」那人道：「這條街往西去，轉過拐角鼓樓，那鄭家雜貨店，憑你買多少，油、鹽、醬、醋、薑、椒、茶葉俱全。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch68-1455617"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455617&title=西遊記/第068回"
    "line_start": 144
    "line_end": 144
  "translation_ja": "さて、会同館にいる悟空は、沙悟浄に茶と飯を用意させ、精進の菜も調えさせていた。\n沙悟浄「茶を沸かし、飯を炊くのは簡単だが、野菜の料理は困ったな。」\n悟空「どうしてだ。」\n沙悟浄「油も、塩も、醤（ひしお）も、酢もないんだ。」\n悟空「ここに布施でもらった銭が何文かある。八戒に買いに行かせよう。」\n八戒は怠けようとして言った。\n八戒「俺は行かないよ。顔がよくないから、厄介を起こして、お師匠さまに叱られそうだ。」\n悟空「正当に取引するんだ。布施をねだるのでも、奪うのでもない。何の厄介がある。」\n八戒「さっきの騒ぎを見なかったのか。この門前で口を突き出したら、十人余りも驚いて倒れたじゃないか。人込みへ入ったら、何人驚き死にするか分からないよ。」\n悟空「人込み、人込みと言うが、お前、あの市場で何を売っていたか見たか。」\n八戒「お師匠さまが、厄介を起こさないよう頭を下げていろと言うから、本当に見ていない。」\n悟空「酒屋に米屋、粉ひき屋、綾絹や雑貨の店なんぞは言うまでもない。そればかりか、いい茶店に麺屋、大きな焼餅（しょうへい）、大きな饝饝（もも）もある。飯屋にはうまい汁飯、上等の香辛料、うまい野菜があって、珍しい糖糕（とうこう）、蒸酥（じょうそ）、点心（てんしん）、\U00029707子（けんし）、揚げ菓子、蜜菓子……数えきれないほどいい物があるんだ。俺が買って、お前におごってやろうか。」\n八戒は聞くなり涎を垂らし、ごくりごくりと唾をのみ込んで、跳び上がった。\n八戒「兄貴、今度はごちそうになるよ。今度俺が銭をためたら、お返しにごちそうしよう。」\n悟空はひそかに笑って言った。\n悟空「沙悟浄、飯をうまく炊いておけ。俺たちは調味料を買ってくる。」\n沙悟浄も、八戒をからかうつもりだと分かっていたので、調子を合わせて答えた。\n沙悟浄「行くなら、たくさん買って、腹いっぱい食べておいで。」\n八戒は碗や小鉢をつかみ、悟空について門を出た。役人が二人いて尋ねた。\n二人の役人「長老、どちらへ。」\n悟空「調味料を買いに。」\n役人「この通りを西へ行き、鼓楼の角を曲がると、鄭家（ていけ）の雑貨店があります。いくらでも買えますよ。油、塩、醤、酢、生姜、山椒、茶の葉まで、何でもそろっています。」"
  "translation_status": "reviewed"
- "id": "xy-ch68-017"
  "section_id": "chapter-68"

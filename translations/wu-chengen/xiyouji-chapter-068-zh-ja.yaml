  "origin": "source"
  "source_text": "那眾臣領旨，與看榜的太監、校尉徑至會同館，排班參拜。諕得那八戒躲在廂房，沙僧閃於壁下。那大聖看他坐在當中，端然不動。八戒暗地裡怨惡道：「這猢猻活活的折殺也。怎麼這許多官員禮拜，更不還禮，也不站將起來？」不多時，禮拜畢，分班啟奏道：「上告神僧孫長老：我等俱朱紫國王之臣，今奉王旨，敬以潔禮參請神僧，入朝看病。」行者方才立起身來，對眾道：「你王如何不來？」眾臣道：「我王身虛力怯，不敢乘輦，特令臣等行代君之禮，拜請神僧也。」行者道：「既如此說，列位請前行，我當隨至。」眾臣各依品從，作隊而走。行者整衣而起。八戒道：「哥哥，切莫攀出我們來。」行者道：「我不攀你，只要你兩個與我收藥。」沙僧道：「收甚麼藥？」行者道：「凡有人送藥來與我，照數收下，待我回來取用。」二人領諾不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

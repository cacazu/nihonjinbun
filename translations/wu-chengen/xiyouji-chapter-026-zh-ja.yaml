    "line_start": 229
    "line_end": 229
  "translation_ja": "このとき、観音菩薩と三老は各一個ずつ食べ、三蔵も初めて仙人の宝だと知って、一つ食べた。悟空たち三人も一つずつ、鎮元子も相伴して一つ食べ、道観の仙人たちは一つを分けて食べた。悟空は観音菩薩に礼を述べ、普陀岩へ帰るのを見送り、三老も蓬莱島（ほうらいとう）へ送り返した。鎮元子はさらに精進料理と酒を用意し、悟空と義兄弟になった。これぞ、争わなければ知り合えず、二つの家が一つになったというもの。師弟四人は喜び合い、夜になると休んだ。三蔵こそ、まさに、"
  "translation_status": "reviewed"
- "id": "xy-ch26-043"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": "有緣吃得草還丹，長壽苦捱妖怪難。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 231
    "line_end": 231
  "translation_ja": "縁あって草還丹を食べられたが、長い命でなお、妖怪の災難を苦しく耐えねばならぬ。"
  "translation_status": "reviewed"
- "id": "xy-ch26-044"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟到明日如何作別，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 233
    "line_end": 233
  "translation_ja": "さて、翌日はどのように別れを告げるのだろうか。それは次回のお話。"
  "translation_status": "reviewed"

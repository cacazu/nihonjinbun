  "known_gaps":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-003"
    "description_ja": "「心上刃」は忍、「寸邊而」は耐の字の構成を利用した戒め。次句の底本は「刃字」であり、忍字へ無断訂正せず「刃の字」とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-005"
    "description_ja": "「光皮散兒」「者著」は難句・異文の可能性がある。八戒が悟空のその場しのぎを疑う文脈から「見栄えのよい口先の薬」「ふり」と解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-006"
    "description_ja": "「衣服禳了」は衣が汚れる意と解し、禳の字は原文で保持した。三茶六飯は手厚い待遇の誇張だが数を残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-008"
    "description_ja": "「蓬萊分合鎮波濤」「瑤臺影蘸天心冷」は構文・景の関係が明確でない。波の寄り離れ、玉台の影と水面に映る天の冷たさの像として訳し、地理的説明へ固定しない。 修正は現稿が採る水面の解釈の範囲で主体と対象を整理するもの。影蘸・分合の構文解釈自体は引き続き留保する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-009"
    "description_ja": "竜虎・坎離は内丹術の象徴。特定の身体部位や化学物質へ断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-011"
    "description_ja": "「蜾蟲鱗長」は生類列挙の難句。蜾は裸の異字・誤字の可能性もあるが原文を訂正せず、虫や鱗ある生き物と訳した。太乙散数と真流の区分は本回の三老の説明として扱う。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-013"
    "description_ja": "星籌・海屋は寿命や長い歳月を数える札に関わる吉祥の典故として解釈。「拄杖懸龍」は杖と竜の関係の細部が明瞭でなく、詩の像を残した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-014"
    "description_ja": "加冠進禄は加官進禄との同音を使う。添寿・添福・添禄は召使いの吉祥名を連想させるからかいと解した。中国語の音の効果は日本語では完全に再現できない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-016"
    "description_ja": "番番是福は番／翻、四時吉慶は四匙／四時・撃磬／吉慶の同音を使うと解した。「兩頭頑耍」は匙と磬の両方をもて遊ぶと読んだが、動作の細部は未確定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-018"
    "description_ja": "「槃蕊闕」「玉膏誰逼」「信萬年」は難句。槃蕊は宮門の飾り名として保持し、玉膏を注ぐ者への問い、果実の成熟を万年の時を告げるものとして訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-020"
    "description_ja": "「武帝曾宣加壽齡」は主語・授受の関係が省略的で、武帝について寿齢を加える宣言があったとした。王朝・人物を後漢や北周等へ断定しない。長生篆は長寿をもたらす符篆と解した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-022"
    "description_ja": "東方朔の曼倩は史実では字とされるが、024の本文は道名と説明するため、そのまま訳す。詩の三度の蟠桃の盗みも物語内の伝承として保持。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-026"
    "description_ja": "「玉液錕鋘鐵石堅」の句の構成は不明瞭。錕鋘は名刀やその材料を指す語として名を保持し、崑崙山の鉄とは同定しない。教育部異体字字典の鋘の項（https://pedia.cloud.edu.tw/Entry/Detail?title=%E9%8B%98）を参照したが、句全体の解釈は未確定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-033"
    "description_ja": "「海主」「四聖授時」「少林」は難句。「四聖」は六凡との対から仏教の四聖と解したが、特定の四人物とする可能性も残る。「授時」の字を受字等へ直さず、時に教えを授けるとした。「少林」は底本の表記を保持し、具体的寺院へ同定しない。 善財図賛の具足の段にも「四聖授時」「少林別有真滋味」を含む類似詩がある。授時を授記の誤字とは断定できない。現稿の「時に教えを授ける」は暫定解釈とし、原字を保持する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-037"
    "description_ja": "「無垢佛」の特定経典上の同定は未確定。「有為身」は底本どおり有為の身とし、無為身へ無断訂正しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-039"
    "description_ja": "復活後の二十三個は、地中へ入った一個を含む。五行を避けて玉器で汲む操作、茶碗二三十個・酒杯四五十個、根の皮がつながる説明を原文どおり保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "segment_ids":
    - "xy-ch26-041"
    "description_ja": "本回の詩は成熟まで九千年と明記する。第24回の短頭一万年という概数へ統一しない。 本文の欠落ではなく解釈・校訂上の留保。"

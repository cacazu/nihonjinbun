- "id": "xy-ch26-006"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他急整虎皮裙，出門來對大仙道：「先生放心，我就去就來。你卻要好生伏侍我師父，逐日家三茶六飯，不可欠缺；若少了些兒，老孫回來和你算帳，先搗塌你的鍋底。衣服禳了，與他漿洗漿洗。臉兒黃了些兒，我不要；若瘦了些兒，不出門。」那大仙道：「你去，你去，定不教他忍餓。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 131
    "line_end": 131
  "translation_ja": "悟空は急いで虎皮の腰巻きを整え、門へ出ると鎮元子に言った。悟空「先生、安心して待っていろ。すぐ行って帰ってくる。その間はお師匠さまを大事にもてなし、毎日三度の茶、六度の飯を、少しも欠かすなよ。ちょっとでも足りなければ、戻ってから勘定をつけ、まずお前の鍋底をぶち抜いてやる。衣が汚れたら、洗って糊をつけてくれ。顔色が少しでも黄ばんでいたら承知しないし、痩せていたら門を出てやらんぞ。」鎮元子「行くがよい、行くがよい。決して空腹な思いはさせぬ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「衣服禳了」は衣が汚れる意と解し、禳の字は原文で保持した。三茶六飯は手厚い待遇の誇張だが数を残した。"
- "id": "xy-ch26-007"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好猴王，急縱觔斗雲，別了五莊觀，徑上東洋大海。在半空中，快如掣電，疾如流星，早到蓬萊仙境。按雲頭，往下仔細觀看，真個好去處。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 132
    "line_end": 132
  "translation_ja": "悟空は急いで觔斗雲（きんとうん）に乗り、五荘観（ごそうかん）をあとにして、東の大海へ直行した。空中を稲妻のように速く、流星のように走り、早くも蓬莱（ほうらい）の仙境に着いた。雲を降ろして下をよく見ると、まことに見事な場所だった。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-008"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大地仙鄉列聖曹，蓬萊分合鎮波濤。
    瑤臺影蘸天心冷，巨闕光浮海面高。
    五色煙霞含玉籟，九霄星月射金鰲。
    西池王母常來此，奉祝三仙幾次桃。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 134
    "line_end": 137
  "translation_ja": |-
    大地の仙郷には聖なる者たちが列し、蓬莱は寄り離れする波濤を鎮める。
    玉の台の影は水に浸り、天のただ中は冷ややか。大きな宮門の光は海面の上に高く浮かぶ。
    五色の煙霞は玉の笛の音を含み、はるかな天の星月は金の大亀を照らす。
    西池（せいち）の王母（おうぼ）もしばしば訪れ、三仙の祝いに、幾度となく桃を献じる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「蓬萊分合鎮波濤」「瑤臺影蘸天心冷」は構文・景の関係が明確でない。波の寄り離れ、玉台の影と水面に映る天の冷たさの像として訳し、地理的説明へ固定しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "修正は現稿が採る水面の解釈の範囲で主体と対象を整理するもの。影蘸・分合の構文解釈自体は引き続き留保する。"
- "id": "xy-ch26-009"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者看不盡仙景，徑入蓬萊。正然走處，見白雲洞外，松陰之下，有三個老兒圍碁，觀局者是壽星，對局者是福星、祿星。行者上前叫道：「老弟們，作揖了。」那三星見了，拂退碁枰，回禮道：「大聖何來？」行者道：「特來尋你們耍子。」壽星道：「我聞大聖棄道從釋，脫性命保護唐僧往西天取經，逐日奔波山路，那些兒得閑，卻來耍子？」行者道：「實不瞞列位說，老孫因往西方，行在半路，有些兒阻滯，特來小事欲干，不知肯否？」福星道：「是甚地方？因何阻滯？乞為明示，吾好裁處。」行者道：「因路過萬壽山五莊觀有阻。」三老驚訝道：「五莊觀是鎮元大仙的仙宮，你莫不是把他人參果偷吃了？」行者笑道：「偷吃了能值甚麼？」三老道：「你這猴子，不知好歹。那果子聞一聞，活三百六十歲。吃一個，活四萬七千年。叫做萬壽草還丹。我們的道，不及他多矣。他得之甚易，就可與天齊壽；我們還要養精、煉氣、存神，調和龍虎、捉坎填離，不知費多少工夫。你怎麼說他的能值甚緊？天下只有此種靈根。」行者道：「靈根，靈根，我已弄了他個斷根哩。」三老驚道：「怎的斷根？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 138
    "line_end": 138
  "translation_ja": "見尽くせぬ仙景の中、悟空はまっすぐ蓬莱へ入った。歩いていくと、白雲洞（はくうんどう）の外、松陰で三人の老人が碁を囲んでいた。見物しているのが寿星（じゅせい）、対局しているのが福星（ふくせい）と禄星（ろくせい）である。悟空は前へ出て呼びかけた。悟空「兄弟たち、ご挨拶だ。」三老（さんろう）は碁盤を脇へ押しやり、礼を返した。三老「大聖、どちらから来られた。」悟空「わざわざお前たちと遊びに来たんだ。」寿星「大聖は道教を離れて仏教へ入り、命を投げ出して唐僧（とうそう）を守り、西天へ経を取りに行くと聞いた。毎日山道を奔走していて、遊びに来る暇など、どこにあるのだ。」悟空「正直に言おう。西へ行く途中で少し足止めを食らってね。小さな頼みがあって来たんだが、引き受けてくれるかい。」福星「どこで、何のために足止めされたのか、はっきり聞かせてくれ。そうすれば考えられる。」悟空「万寿山（ばんじゅさん）の五荘観を通って、止められたんだ。」三老は驚いた。三老「五荘観は鎮元大仙（ちんげんだいせん）の仙宮だ。まさか、人参果を盗み食いしたのではあるまいな。」悟空は笑った。悟空「盗み食いくらい、何だというんだ。」三老「この猿は、物の価値が分からぬ。あの実はひと嗅ぎすれば三百六十歳まで生き、一つ食べれば四万七千年生きる。万寿草還丹（ばんじゅそうかんたん）というのだ。我々の道など、あの方には遠く及ばない。あの方はたやすくそれを手に入れ、天と同じ寿命を得られる。我々は精を養い、気を練り、神を保ち、竜虎（りゅうこ）を調え、坎（かん）を取って離（り）を満たす修行に、どれほど手間をかけることか。それを何ほどのものでもないとは、どういうことだ。天下に一つしかない霊妙な根なのだぞ。」悟空「霊妙な根、霊妙な根というが、俺はその根を絶ってしまったんだ。」三老は驚いた。三老「どうして根を絶ったのだ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "竜虎・坎離は内丹術の象徴。特定の身体部位や化学物質へ断定しない。"
- "id": "xy-ch26-010"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「我們前日在他觀裡，那大仙不在家，只有兩個小童接待了我師父，卻將兩個人參果奉與我師。我師不認得，只說是三朝未滿的孩童，再三不吃。那童子就拿去吃了，不曾讓得我們。是老孫就去偷了他三個，我兄弟三人吃了。那童子不知高低，賊前賊後的罵個不住。是老孫惱了，把他樹打了一棍，推倒在地，樹上果子全無，枒開葉落，根出枝傷，已枯死了。不想那童子關住我們，又被老孫扭開鎖走了。次日清辰，那先生回家趕來，問答間，語言不和，遂與他賭鬥，被他閃一閃，把袍袖展開，一袖子都籠去了。繩纏索綁，拷問鞭敲，就打了一日。是夜又逃了，他又趕上，依舊籠去。他身無寸鐵，只是把個麈尾遮架，我兄弟這等三般兵器，莫想打得著。他這一番仍舊擺佈，將布裹漆了我師父與兩師弟，卻將我下油鍋。我又做了個脫身本事走了，把他鍋都打破。他見拿我不住，儘有幾分醋我。是我又與他好講，教他放了我師父、師弟，我與他醫樹管活，兩家才得安寧。我想著『方從海上來』，故此特遊仙境，訪三位老弟。有甚醫樹的方兒，傳我一個，急救唐僧脫苦。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 139
    "line_end": 139
  "translation_ja": "悟空「一昨日、道観へ行ったとき、あの大仙は留守で、二人の童子だけがお師匠さまを迎え、人参果を二つ差し上げた。お師匠さまはそれと分からず、生まれて三日にも満たない赤子だと言って、どうしても食べなかった。童子たちは持ち帰って食べ、俺たちには勧めなかった。そこで俺が三つ盗みに行き、兄弟三人で食べたのさ。童子どもが身のほどを知らず、盗人だ何だと罵り続けるので、俺は腹を立て、木を一打ちして地面へ倒した。実は全部なくなり、枝は裂け、葉は落ち、根が出て、枝が傷み、もう枯れ死んだ。すると童子どもは俺たちを閉じ込めたが、俺が錠を開けて逃げた。翌朝、先生が帰ってきて追いつき、問答のうちに話が合わなくなり、戦ったんだ。ところが、さっと身をかわして袍の袖を広げ、俺たちを丸ごと一袖に包んでしまった。縄で縛り上げ、拷問し、鞭打って、一日中打たれた。その夜また逃げたのに、また追いつかれ、同じように包まれた。あの人は一寸の武器も持たず、ただ麈尾（しゅび）で防ぐだけなのに、俺たち三人の三種の武器が、どうしても当たらない。今度もあれこれ手を尽くし、お師匠さまと二人の弟弟子を布で巻いて漆を塗り、俺は油鍋に入れようとした。俺はまた脱出の術で逃げ、鍋まで割ってやった。あいつも俺を捕らえ切れぬと知って、いくらかは俺を怖がっている。それから俺が穏やかに話をつけ、お師匠さまたちを放してくれれば、木は必ず生き返らせると約束して、ようやく両方収まったのだ。『処方は海の上から来る』と思い出したので、わざわざ仙境へ来て、三人の兄弟を訪ねたわけさ。木を治す方法があるなら、一つ教えてくれ。急いで唐僧を苦しみから救いたいんだ。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-011"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三星聞言，心中也悶道：「你這猴兒，全不識人。那鎮元子乃地仙之祖；我等乃神仙之宗；你雖得了天仙，還是太乙散數，未入真流，你怎麼脫得他手？若是大聖打殺了走獸飛禽、蜾蟲鱗長，只用我黍米之丹，可以救活。那人參果乃仙木之根，如何醫治？沒方，沒方。」那行者見說無方，卻就眉峰雙鎖，額蹙千痕。福星道：「大聖，此處無方，他處或有，怎麼就生煩惱？」行者道：「無方別訪，果然容易，就是遊遍海角天涯，轉透三十六天，亦是小可。只是我那唐長老法嚴量窄，止與了我三日期限；三日以外不到，他就要念那緊箍兒咒哩。」三星笑道：「好，好，好，若不是這個法兒拘束你，你又鑽天了。」壽星道：「大聖放心，不須煩惱。那大仙雖稱上輩，卻也與我等有識。一則久別，不曾拜望；二來是大聖的人情：如今我三人同去望他一望，就與你道達此情，教那唐和尚莫念緊箍兒咒，休說三日五日，只等你求得方來，我們才別。」行者道：「感激，感激。就請三位老弟行行，我去也。」大聖辭別三星不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 140
    "line_end": 140
  "translation_ja": "三老も聞いて困り果てた。三老「この猿は、まったく相手を知らぬ。鎮元子は地仙（ちせん）の祖、我々は神仙の宗である。お前は天仙にはなったが、まだ太乙散数（たいいつさんすう）に属し、正統な仙人の列には入っていない。どうしてあの方の手を逃れられよう。大聖が走る獣、飛ぶ鳥、虫や鱗ある生き物を殺したのなら、我々の黍粒の丹を使えば生き返らせられる。しかし人参果は仙木の霊根だ。どうして治せよう。方法はない、ないのだ。」悟空は方法がないと聞いて、眉を固く寄せ、額に幾筋ものしわを刻んだ。福星「大聖、ここになくても、よそにはあるかもしれない。なぜそんなに思い悩むのだ。」悟空「なければ別を訪ねるのは、実にたやすい。海の果て、地の果てまで巡り、三十六天（さんじゅうろくてん）を残らず回っても、何でもない。ただ、俺の唐長老（とうちょうろう）は法に厳しく、心が狭い。期限は三日しかくれず、それを過ぎて戻らなければ、緊箍児呪（きんこじじゅ）を唱えるというんだ。」三老は笑った。三老「よいことだ、よいことだ。その法で縛っておかなければ、お前はまた天を突き破るだろうからな。」寿星「大聖、安心しなさい。心配はいらぬ。あの大仙は先輩に当たるが、我々とも知り合いだ。長く会わず、ご挨拶もしていないことだし、大聖へのよしみもある。今から三人で訪ね、事情を取り次いで、唐の和尚に緊箍児呪を唱えないよう頼もう。三日、五日どころか、お前が方法を求めて戻るまで、我々も帰らぬ。」悟空「ありがたい、ありがたい。それなら三人の兄弟、ひとつ頼む。俺は行くぞ。」悟空は三老に別れを告げた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「蜾蟲鱗長」は生類列挙の難句。蜾は裸の異字・誤字の可能性もあるが原文を訂正せず、虫や鱗ある生き物と訳した。太乙散数と真流の区分は本回の三老の説明として扱う。"
- "id": "xy-ch26-012"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說這三星駕起祥光，即往五莊觀而來。那觀中合眾人等，忽聽得長天鶴唳，原來是三老光臨。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 142
    "line_end": 142
  "translation_ja": "さて、三老はめでたい光に乗り、五荘観へ向かった。道観の一同が、ふと大空に鶴の鳴く声を聞いたのは、三老が来訪したためだった。その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch26-013"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    盈空藹藹祥光簇，霄漢紛紛香馥郁。
    彩霧千條護羽衣，輕雲一朵擎仙足。
    青鸞飛，丹鳳䎘，袖引香風滿地撲。
    拄杖懸龍喜笑生，皓髯垂玉胸前拂。
    童顏歡悅更無憂，壯體雄威多有福。
    執星籌，添海屋，腰掛葫蘆並寶籙。
    萬紀千旬福壽長，十洲三島隨緣宿。
    常來世上送千祥，每向人間增百福。
    概乾坤，榮福祿，福壽無疆今喜得。
    三老乘祥謁大仙，福堂和氣皆無極。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 143
    "line_end": 152
  "translation_ja": |-
    空いっぱいに穏やかな瑞光が群がり、天の川あたりに豊かな香りが満ちる。
    千筋の彩霧が羽衣を守り、一片の軽い雲が仙人の足を支える。
    青鸞（せいらん）は飛び、朱の鳳凰（ほうおう）は羽ばたき、袖が呼ぶ香風は地上いっぱいに吹き寄せる。
    杖をつき、竜を垂らして笑みを浮かべ、白い髭は玉のように胸を払う。
    童子の顔は喜びに満ちて憂いなく、たくましい体は威厳があり、福も多い。
    星籌（せいちゅう）を手に取り、海屋（かいおく）に数取りの札を添え、腰にはひょうたんと宝籙（ほうろく）を下げる。
    万紀、千旬にもわたる福と寿、十洲三島（じっしゅうさんとう）に縁のままに宿る。
    たびたびこの世へ来て千の瑞祥を送り、人間界へは百の福を増し加える。
    天地を包み、福禄を栄えさせ、今喜び得た福寿は果てしない。
    三老は瑞光に乗って大仙を訪ね、福ある堂の和やかな気は、どこまでも満ちる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "星籌・海屋は寿命や長い歳月を数える札に関わる吉祥の典故として解釈。「拄杖懸龍」は杖と竜の関係の細部が明瞭でなく、詩の像を残した。"
- "id": "xy-ch26-014"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那仙童看見，即忙報道：「師父，海上三星來了。」鎮元子正與唐僧師弟閑敘，聞報，即降階奉迎。那八戒見了壽星，近前扯住，笑道：「你這肉頭老兒，許久不見，還是這般脫灑，帽兒也不帶個來。」遂把自家一個僧帽，撲的套在他頭上，撲著手呵呵大笑道：「好，好，好，真是『加冠進祿』也。」那壽星將帽子摜了，罵道：「你這個夯貨，老大不知高低。」八戒道：「我不是夯貨，你等真是奴才。」福星道：「你倒是個夯貨，反敢罵人是奴才？」八戒又笑道：「既不是人家奴才，好道叫做『添壽』、『添福』、『添祿』？」那三藏喝退了八戒，急整衣拜了三星。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 154
    "line_end": 154
  "translation_ja": "仙童が見つけ、急いで報告した。仙童「お師匠さま、海上の三星（さんせい）がお見えです。」鎮元子はちょうど三蔵たちと静かに話していたが、知らせを聞くと階を下りて迎えた。八戒は寿星を見ると、そばへ行ってつかまえ、笑った。八戒「頭のでっかい爺さん、久しぶりだな。相変わらずの身軽な姿で、帽子一つ持ってこないのか。」そして自分の僧帽を、ぽんと相手の頭へかぶせ、手をたたいて大笑いした。八戒「いいぞ、いいぞ。これぞ『加冠進禄（かかんしんろく）』だな。」寿星は帽子を投げ捨て、叱った。寿星「この馬鹿者、まったく礼儀を知らぬ。」八戒「俺は馬鹿者じゃない。あんたたちのほうこそ、本当の召使いだ。」福星「馬鹿者のくせに、よくも人を召使いなどとののしるな。」八戒はまた笑った。八戒「人の召使いでないのなら、どうして『添寿（てんじゅ）』『添福（てんぷく）』『添禄（てんろく）』なんて、召使いみたいな名で呼ばれるんだ。」三蔵は八戒を叱って退かせ、急いで衣を整え、三老を拝した。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "加冠進禄は加官進禄との同音を使う。添寿・添福・添禄は召使いの吉祥名を連想させるからかいと解した。中国語の音の効果は日本語では完全に再現できない。"
- "id": "xy-ch26-015"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那三星以晚輩之禮見了大仙，方才敘坐。坐定，祿星道：「我們一向久闊尊顏。有失恭敬，今因孫大聖攪擾仙山，特來相見。」大仙道：「孫行者到蓬萊去的？」壽星道：「是，因為傷了大仙的丹樹，他來我處求方醫治。我輩無方，他又到別處求訪，但恐違了聖僧三日之限，要念緊箍兒咒。我輩一來奉拜，二來討個寬限。」三藏聞言，連聲應道：「不敢念，不敢念。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 155
    "line_end": 155
  "translation_ja": "三老は後輩としての礼を尽くして鎮元子に挨拶し、それから席に着いた。座ると、禄星が言った。禄星「長らくお顔を拝せず、ご無礼いたしました。このたび孫大聖（そんたいせい）が仙山をお騒がせしたため、特にお目にかかりに参りました。」鎮元子「孫行者（そんぎょうじゃ）は蓬莱へ行ったのですか。」寿星「はい。大仙の丹の木を傷つけ、治療の法を求めて私たちを訪ねました。私たちには方法がなく、ほかへ捜しに行きましたが、聖僧の三日の期限に遅れ、緊箍児呪を唱えられるのを恐れております。私たちはご挨拶を兼ね、期限をお延ばしいただきたく参りました。」三蔵は聞くと、繰り返して答えた。三蔵「唱えません、決して唱えません。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-016"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說處，八戒又跑進來，扯住福星，要討果子吃。他去袖裡亂摸，腰裡亂挖，不住的揭他衣服搜檢。三藏笑道：「那八戒是甚麼規矩！」八戒道：「不是沒規矩，此叫做『番番是福』。」三藏又叱令出去。那獃子跨出門，瞅著福星，眼不轉睛的發狠。福星道：「夯貨，我那裡惱了你來，你這等恨我？」八戒道：「不是恨你，這叫『回頭望福』。」那獃子出得門來，只見一個小童拿了四把茶匙，方去尋鍾取果看茶，被他一把奪過，跑上殿，拿著小磬兒，用手亂敲亂打，兩頭頑耍。大仙道：「這個和尚越發不尊重了。」八戒笑道：「不是不尊重，這叫做『四時吉慶』。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 157
    "line_end": 157
  "translation_ja": "話していると、八戒がまた駆け込んできて福星をつかまえ、果物をねだった。袖の中を探り、腰のあたりをまさぐり、衣を何度もめくって捜す。三蔵は笑った。三蔵「八戒、それは何という作法だ。」八戒「無作法じゃありません。これは『番番是福（ばんばんぜふく）』、めくるたびに福、というものです。」三蔵はまた叱って外へ出した。八戒は戸をまたぐと、福星をじっと見つめ、目もそらさず険しい顔をした。福星「馬鹿者、私がお前を怒らせる何をした。なぜそんなに恨むのだ。」八戒「恨んでいるんじゃない。これは『回頭望福（かいとうぼうふく）』、振り返って福を望む、というものさ。」門を出た八戒は、一人の童子が茶匙を四本持ち、茶碗を捜して果物を取り、茶を出そうとしているのを見ると、ひったくって殿へ駆け上がった。小さな磬（けい）を持ち、両手でやたらに打ち鳴らし、匙と磬の両方でもて遊んだ。鎮元子「この和尚は、ますます行儀が悪くなる。」八戒は笑った。八戒「行儀が悪いんじゃない。これは『四時吉慶（しじきっけい）』、四季いつもめでたし、というものです。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "番番是福は番／翻、四時吉慶は四匙／四時・撃磬／吉慶の同音を使うと解した。「兩頭頑耍」は匙と磬の両方をもて遊ぶと読んだが、動作の細部は未確定。"
- "id": "xy-ch26-017"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不說八戒打諢亂纏。卻表行者縱祥雲離了蓬萊，又早到方丈仙山，這山真好去處。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 159
    "line_end": 159
  "translation_ja": "八戒のおどけた騒ぎは、ひとまず措く。さて悟空は瑞雲に乗って蓬莱を離れ、早くも方丈（ほうじょう）の仙山へ着いた。この山もまことにすばらしい。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-018"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    方丈巍峨別是天，太元宮府會神仙。
    紫臺光照三清路，花木香浮五色煙。
    金鳳自多槃蕊闕，玉膏誰逼灌芝田。
    碧桃紫李新成熟，又換仙人信萬年。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 160
    "line_end": 163
  "translation_ja": |-
    方丈は高くそびえて別天地、太元宮府（たいげんきゅうふ）には神仙が集う。
    紫の台の光は三清（さんせい）への道を照らし、花木の香りは五色の煙に浮かぶ。
    金の鳳凰は槃蕊（ばんずい）の宮門に多く、玉膏（ぎょっこう）は誰が注いで芝の畑を潤すのか。
    碧の桃と紫の李が新たに熟し、仙人にはまた一万年の時の便りが巡ってきた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「槃蕊闕」「玉膏誰逼」「信萬年」は難句。槃蕊は宮門の飾り名として保持し、玉膏を注ぐ者への問い、果実の成熟を万年の時を告げるものとして訳した。"
- "id": "xy-ch26-019"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者按落雲頭，無心玩景。正走處，只聞得香風馥馥，玄鶴聲鳴，那壁廂有個神仙。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 165
    "line_end": 165
  "translation_ja": "悟空は雲を降ろしたが、景色を眺める気はなかった。歩いていると、よい香りの風が満ち、黒い鶴の鳴く声がした。向こうに一人の仙人がいた。その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch26-020"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    盈空萬道霞光現，彩霧飄颻光不斷。
    丹鳳啣花也更鮮，青鸞飛舞聲嬌艷。
    福如東海壽如山，貌似小童身體健。
    壺隱洞天不老丹，腰懸與日長生篆。
    人間數次降禎祥，世上幾番消厄願。
    武帝曾宣加壽齡，瑤池每赴蟠桃宴。
    教化眾僧脫俗緣，指開大道明如電。
    也曾跨海祝千秋，常去靈山參佛面。
    聖號東華大帝君，煙霞第一神仙眷。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 167
    "line_end": 175
  "translation_ja": |-
    空いっぱいに万筋の霞の光が現れ、彩る霧は漂い、光は絶えない。
    朱の鳳凰は花をくわえていっそう鮮やか、青鸞は舞い飛び、鳴き声も艶やかである。
    福は東海（とうかい）のごとく、寿は山のごとく、顔は幼子のようで体は健やか。
    壺には洞天の不老丹を隠し、腰には太陽とともに長生きする符篆（ふてん）を下げる。
    人間界に幾度も瑞祥を下し、世の災厄を幾たびも除こうと願う。
    武帝（ぶてい）にはかつて寿齢を加える宣言があり、瑤池（ようち）へはいつも蟠桃（ばんとう）の宴に赴く。
    僧たちを教化して俗縁から離れさせ、大道を開き示す明るさは稲妻のよう。
    海を渡って千秋の寿を祝い、しばしば霊山（れいざん）で仏の御顔を拝する。
    聖号は東華大帝君（とうかだいていくん）、煙霞の境にあって第一の神仙である。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「武帝曾宣加壽齡」は主語・授受の関係が省略的で、武帝について寿齢を加える宣言があったとした。王朝・人物を後漢や北周等へ断定しない。長生篆は長寿をもたらす符篆と解した。"
- "id": "xy-ch26-021"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫行者靦面相迎，叫聲：「帝君，起手了。」那帝君慌忙回禮道：「大聖，失迎。請荒居奉茶。」遂與行者攙手而入。果然是貝闕仙宮，看不盡瑤池瓊閣。方坐待茶，只見翠屏後轉出一個童兒。他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 177
    "line_end": 177
  "translation_ja": "悟空は厚かましくも前へ出て、声を掛けた。悟空「帝君（ていくん）、ご挨拶申し上げる。」東華大帝君は急いで礼を返した。東華大帝君「大聖、お迎えもせず失礼した。粗末な住まいだが、お茶を差し上げよう。」手を取り合って中へ入ると、まことに貝のように輝く仙宮で、玉の池、玉の楼閣は見尽くせないほどだった。座って茶を待っていると、翠の屏風の後ろから、一人の童子が現れた。そのいでたちは、"
  "translation_status": "reviewed"
- "id": "xy-ch26-022"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    身穿道服飄霞爍，腰束絲絛光錯落。
    頭戴綸巾佈斗星，足登芒履遊仙岳。
    煉元真，脫本殼，功行成時遂意樂。
    識破原流精氣神，主人認得無虛錯。
    逃名今喜壽無疆，甲子週天管不著。
    轉回廊，登寶閣，天上蟠桃三度摸。
    縹緲香雲出翠屏，小仙乃是東方朔。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 178
    "line_end": 184
  "translation_ja": |-
    身には道服、ひるがえる霞がきらめき、腰には絹の帯、光が入り交じる。
    頭には斗星（とせい）を配した綸巾（かんきん）、足には草履をはき、仙岳を遊ぶ。
    根源の真気を練り、もとの殻を脱し、修行が成れば思いのままに楽しむ。
    源から流れる精・気・神を見抜き、まことの主を誤りなく知る。
    世の名声を逃れ、今は果てしない寿を喜び、めぐる甲子（かっし）の歳月にも縛られぬ。
    回廊をめぐり、宝閣へ登り、天上の蟠桃には三度手を伸ばした。
    ほのかな香雲に包まれ、翠の屏風から出る小仙は、すなわち東方朔（とうほうさく）。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "東方朔の曼倩は史実では字とされるが、024の本文は道名と説明するため、そのまま訳す。詩の三度の蟠桃の盗みも物語内の伝承として保持。"
- "id": "xy-ch26-023"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，笑道：「這個小賊在這裡哩。帝君處沒有桃子你偷吃！」東方朔朝上進禮，答道：「老賊，你來這裡怎的？我師父沒有仙丹你偷吃。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 186
    "line_end": 186
  "translation_ja": "悟空は見ると笑った。悟空「小盗人がこんな所にいたのか。帝君のもとには、お前が盗み食いする桃などないぞ。」東方朔は礼をして答えた。東方朔「大盗人、ここへ何をしに来た。俺の師匠のところには、お前が盗み食いする仙丹などないぞ。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-024"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "帝君叫道：「曼倩休亂言，看茶來也。」曼倩原是東方朔的道名，他急入裡取茶二杯。飲訖，行者道：「老孫此來，有一事奉干，未知允否？」帝君道：「何事？自當領教。」行者道：「近因保唐僧西行，路過萬壽山五莊觀，因他那小童無狀，是我一時發怒，把他人參果樹推倒，一時阻滯，唐僧不得脫身，特來尊處求賜一方醫治，萬望慨然。」帝君道：「你這猴子，不管一二，到處裡闖禍。那五莊觀鎮元子，聖號與世同君，乃地仙之祖，你怎麼就衝撞了他？他那人參果樹乃草還丹，你偷吃了，尚說有罪；卻又連樹推倒，他肯干休？」行者道：「正是呢。我們走脫了，被他趕上，把我們就當汗巾兒一般，一袖子都籠去了，所以閣氣。沒奈何，許他求方醫治，故此拜求。」帝君道：「我有一粒九轉太乙還丹，但能治世間生靈，卻不能醫樹。樹乃土木之靈，天滋地潤。若是凡間的果木，醫治還可；這萬壽山乃先天福地，五莊觀乃賀洲洞天，人參果又是天開地闢之靈根，如何可治，無方，無方。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 187
    "line_end": 187
  "translation_ja": "東華大帝君は呼んだ。東華大帝君「曼倩（まんせん）、余計なことを言わず、茶を持ってきなさい。」曼倩は東方朔の道名である。東方朔は急いで奥へ入り、茶を二杯取ってきた。飲み終えると、悟空は言った。悟空「ここへ来たのは、一つ頼みがあるためだ。引き受けていただけるだろうか。」東華大帝君「どんなことかね。まず伺おう。」悟空「このごろ唐僧を守って西へ行き、万寿山の五荘観を通った。そこの童子が無礼だったので、俺がつい腹を立て、人参果の木を倒してしまった。それで足止めされ、唐僧が身動きできない。お宅へ治療の法を授かりに来たのだ。どうか快くお教え願いたい。」東華大帝君「この猿は、あとさき考えず、行く先々で騒ぎを起こす。五荘観の鎮元子は、聖号を与世同君（よせいどうくん）といい、地仙の祖なのだ。どうしてあの方に逆らった。あの人参果の木は草還丹（そうかんたん）だ。盗み食いだけでも罪になるのに、木まで倒して、あの方が黙って済ませるものか。」悟空「そのとおりなんだ。逃げても追いつかれ、俺たちを手拭いのように、丸ごと袖へ包み込んだ。だから腹が立ってね。どうにもならず、治療の法を求めて治すと約束したので、お願いに来たんだ。」東華大帝君「私には九転太乙還丹（きゅうてんたいいつかんたん）が一粒あるが、世の生き物は治せても、その木は治せない。木は土と木の霊気を受け、天に養われ、地に潤されるものだ。人間界の果樹なら治せようが、万寿山は天地に先立つ福地、五荘観は賀洲（がしゅう）の洞天、人参果は天地開闢の霊根だ。どうして治せよう。方法はない、ないのだ。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-025"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「既然無方，老孫告別。」帝君仍欲留奉玉液一杯，行者道：「急救事緊，不敢久滯。」遂駕雲復至瀛洲海島，也好去處。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 189
    "line_end": 189
  "translation_ja": "悟空「方法がないなら、俺はこれで失礼する。」東華大帝君はなお引き止め、玉液（ぎょくえき）を一杯勧めようとしたが、悟空は言った。悟空「救いを急ぐ大事な用なので、長居はできない。」そこで雲に乗り、今度は海上の瀛洲（えいしゅう）へ来た。ここも見事な場所だった。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-026"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    珠樹玲瓏照紫煙，瀛洲宮闕接諸天。
    青山綠水琪花艷，玉液錕鋘鐵石堅。
    五色碧雞啼海日，千年丹鳳吸朱煙。
    世人罔究壺中景，象外春光億萬年。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 190
    "line_end": 193
  "translation_ja": |-
    真珠の木は透き通って紫の煙を照らし、瀛洲の宮殿は諸天につながる。
    青い山、緑の水、玉のような花は艶やかに、玉液あり、錕鋘（こんご）あり、鉄石は堅い。
    五色の碧鶏（へきけい）は海の日に鳴き、千年の朱の鳳凰は紅の霞を吸う。
    世の人は壺中の景色を究めえず、形ある世界の外では、春の光が億万年も続く。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「玉液錕鋘鐵石堅」の句の構成は不明瞭。錕鋘は名刀やその材料を指す語として名を保持し、崑崙山の鉄とは同定しない。教育部異体字字典の鋘の項（https://pedia.cloud.edu.tw/Entry/Detail?title=%E9%8B%98）を参照したが、句全体の解釈は未確定。"
- "id": "xy-ch26-027"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖至瀛洲，只見那丹崖珠樹之下，有幾個皓髮皤髯之輩，童顏鶴鬢之仙，在那裡著棋飲酒，談笑謳歌。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 195
    "line_end": 195
  "translation_ja": "悟空が瀛洲へ来ると、朱の崖、真珠の木の下に、白髪に白い髭、童顔に鶴のような白い鬢の仙人たちがいて、碁を打ち、酒を飲み、談笑して歌っていた。まさに、"
  "translation_status": "reviewed"
- "id": "xy-ch26-028"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": "祥雲光滿，瑞靄香浮。彩鸞鳴洞口，玄鶴舞山頭。碧藕水桃為按酒，交梨火棗壽千秋。一個個丹詔無聞，仙符有籍。逍遙隨浪蕩，散淡任清幽。周天甲子難拘管，大地乾坤只自由。獻果玄猿，對對參隨多美愛；啣花白鹿，雙雙拱伏甚綢繆。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 197
    "line_end": 197
  "translation_ja": "瑞雲は光に満ち、めでたい靄には香りが浮かぶ。彩鸞は洞口で鳴き、黒い鶴は山上で舞う。碧の蓮根、水の桃を酒の肴とし、交梨（こうり）と火棗（かそう）で千秋の寿を得る。一人一人、帝の朱の詔など聞きもせず、仙人の名簿には名を連ねる。気ままに歩き、のんびりと、静かな趣に身を任せる。めぐる甲子の歳月にも縛られず、広い天地の間でただ自由。果実を献じる黒い猿は、二匹ずつ付き従って愛らしく、花をくわえた白鹿は、二頭ずつ前に伏して、たいそうなついている。"
  "translation_status": "reviewed"
- "id": "xy-ch26-029"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那些老兒正然灑樂。這行者厲聲高叫道：「帶我耍耍兒便怎的？」眾仙見了，急忙趨步相迎。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 199
    "line_end": 199
  "translation_ja": "老人たちは、ちょうど酒を楽しんでいた。悟空は声高に呼びかけた。悟空「俺も仲間に入れて遊ばせてくれたって、いいじゃないか。」仙人たちは見つけると、急いで歩み寄って迎えた。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-030"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    人參果樹靈根折，大聖訪仙求妙訣。
    繚繞丹霞出寶林，瀛洲九老來相接。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 201
    "line_end": 202
  "translation_ja": |-
    人参果の木、その霊根は折れ、大聖は仙人を訪ねて妙法を求める。
    朱の霞のめぐる宝の林から、瀛洲九老（えいしゅうきゅうろう）が出迎えに来る。
  "translation_status": "reviewed"
- "id": "xy-ch26-031"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者認得是九老，笑道：「老兄弟們自在哩。」九老道：「大聖當年若存正，不鬧天宮，比我們還自在哩。如今好了，聞你歸真向西拜佛，如何得暇至此？」行者將那醫樹求方之事，具陳了一遍。九老也大驚道：「你也忒惹禍，惹禍！我等實是無方。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 204
    "line_end": 204
  "translation_ja": "悟空は九老（きゅうろう）だと認めて笑った。悟空「兄弟たち、のんきにやっているな。」九老「大聖も昔、正しい心を保ち、天宮で騒ぎさえ起こさなければ、我々以上にのんきだったろうに。今は結構なことだ。真の道に帰して、西へ仏を拝みに行くと聞いたが、どうしてここへ来る暇ができたのだ。」悟空は木を治す法を求める事情を、詳しく一通り話した。九老も大いに驚いた。九老「お前はまったく、騒ぎを起こしすぎる。我々には本当に方法がない。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-032"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「既是無方，我且奉別。」九老又留他飲瓊漿，食碧藕。行者定不肯坐，止立飲了一杯漿，吃了一塊藕，急急離了瀛洲，徑轉東洋大海。早望見落伽山不遠，遂落下雲頭，直到普陀巖上，見觀音菩薩在紫竹林中與諸天大神、木吒、龍女講經說法。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 205
    "line_end": 205
  "translation_ja": "悟空「方法がないのなら、ひとまず失礼する。」九老はなお引き止め、瓊漿（けいしょう）を飲み、碧の蓮根を食べるよう勧めた。悟空はどうしても座ろうとせず、立ったまま一杯の酒を飲み、蓮根を一切れ食べただけで、急いで瀛洲を離れ、東の大海へ戻った。早くも落伽山（らっかさん）が近くに見え、雲を降ろしてまっすぐ普陀岩（ふだがん）へ行くと、観音菩薩（かんのんぼさつ）が紫竹林（しちくりん）で、諸天の大神、恵岸行者（えがんぎょうじゃ）、竜女（りゅうにょ）に経を講じ、法を説いていた。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-033"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    海主城高瑞氣濃，更觀奇異事無窮。
    須知隱約千般外，盡出希微一品中。
    四聖授時成正果，六凡聽後脫樊籠。
    少林別有真滋味，花果馨香滿樹紅。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 207
    "line_end": 210
  "translation_ja": |-
    海主（かいしゅ）の城は高く、めでたい気は濃い。さらに見れば、奇異な事は尽きることがない。
    知るがよい、ほのかに見える千の姿も、みな微妙で一なる境地から現れる。
    四聖（ししょう）は時に教えを授けて正果を成し、六凡（ろくぼん）は聞いたのち、籠の束縛を脱する。
    少林（しょうりん）にはまた真の味わいがあり、花と果実はかぐわしく、木いっぱいに紅を満たす。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「海主」「四聖授時」「少林」は難句。「四聖」は六凡との対から仏教の四聖と解したが、特定の四人物とする可能性も残る。「授時」の字を受字等へ直さず、時に教えを授けるとした。「少林」は底本の表記を保持し、具体的寺院へ同定しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "善財図賛の具足の段にも「四聖授時」「少林別有真滋味」を含む類似詩がある。授時を授記の誤字とは断定できない。現稿の「時に教えを授ける」は暫定解釈とし、原字を保持する。"
- "id": "xy-ch26-034"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩早已看見行者來到，即命守山大神去迎。那大神出林來，叫聲：「孫悟空，那裡去？」行者擡頭喝道：「你這個熊羆，悟空可是你叫的？當初不是老孫饒了你，你已是做了黑風山的屍鬼矣。今日跟了菩薩，受了善果，居此仙山，常聽法教，你叫不得我一聲『老爺』？」那黑熊真個得了正果，在菩薩處鎮守普陀，稱為大神，是也虧了行者。他只得陪笑道：「大聖，古人云：『君子不念舊惡。』只管題他怎的？菩薩著我來迎你哩。」這行者就端肅尊誠，與大神到了紫竹林裡，參拜菩薩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 212
    "line_end": 212
  "translation_ja": "観音菩薩はすでに悟空が来たのを見つけ、守山大神（しゅざんだいしん）に迎えに行くよう命じていた。大神は林から出て、声を掛けた。守山大神「孫悟空（そんごくう）、どこへ行く。」悟空は顔を上げてどなった。悟空「この熊め、お前が悟空と呼び捨てにしてよいのか。あのとき俺が許してやらなければ、もう黒風山（こくふうざん）の死霊になっていたはずだ。今では菩薩に従ってよい果報を受け、この仙山に住み、いつも法の教えを聞いているのだから、俺を旦那さまと一言呼べないのか。」この黒熊は、実際に正果を得て、観音菩薩のもとで普陀（ふだ）を守り、大神と称する身になっていた。それも悟空のおかげだったので、仕方なく笑顔を作った。守山大神「大聖さま、昔から『君子は昔の悪事を根に持たない』と申します。どうしていつまでも持ち出されるのです。菩薩さまのお言いつけで、お迎えに来たのですよ。」そこで悟空は姿勢を正して敬意を表し、大神と紫竹林へ入り、観音菩薩を拝んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch26-035"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩道：「悟空，唐僧行到何處也？」行者道：「行到西牛賀洲萬壽山了。」菩薩道：「那萬壽山有座五莊觀，鎮元大仙你曾會他麼？」行者頓首道：「因是在五莊觀，弟子不識鎮元大仙，毀傷了他的人參果樹，衝撞了他，他就困滯了我師父，不得前進。」那菩薩情知，怪道：「你這潑猴不知好歹，他那人參果樹乃天開地闢的靈根。鎮元子乃地仙之祖，我也讓他三分，你怎麼就打傷他樹？」行者再拜道：「弟子實是不知。那一日他不在家，只有兩個仙童候待我等。是豬悟能曉得他有果子，要一個嘗新，弟子委偷了他三個，兄弟們分吃了。那童子知覺，罵我等無已，是弟子發怒，遂將他樹推倒。他次日回來趕上，將我等一袖子籠去，繩綁鞭抽，拷打了一日。我等當夜走脫，又被他趕上，依然籠了。三番兩次，其實難逃。已允了與他醫樹，卻才自海上求方，遍遊三島，眾神仙都沒有本事。弟子因此志心朝禮，特拜告菩薩，伏望慈憫，俯賜一方，以救唐僧早早西去。」菩薩道：「你怎麼不早來見我，卻往島上去尋找？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 213
    "line_end": 213
  "translation_ja": "観音菩薩「悟空、唐僧はどこまで来ましたか。」悟空「西牛賀洲（さいごかしゅう）の万寿山まで参りました。」観音菩薩「あの山には五荘観があります。鎮元大仙には会いましたか。」悟空は頭を下げた。悟空「五荘観で、私は鎮元大仙のことを存じ上げず、人参果の木を壊して、あの方に逆らってしまいました。それでお師匠さまを足止めされ、先へ進めないのです。」観音菩薩は事情を悟り、叱った。観音菩薩「この無分別な猿。あの人参果の木は、天地開闢の霊根です。鎮元子は地仙の祖で、私も一目置く方です。どうして木を傷つけたのです。」悟空はもう一度拝んだ。悟空「本当に知りませんでした。その日はあの方が留守で、二人の仙童だけがもてなしてくれたのです。猪悟能（ちょごのう）が実のあることを知り、一つ味見したがったので、私は確かに三つ盗み、兄弟で分けて食べました。童子たちが気づいて、いつまでも罵るので、腹を立てて木を倒しました。翌日、あの方が帰ってきて追いつき、私たちを一袖に包み、縄で縛り、鞭で一日中責めました。その夜逃げたのに、また追いつかれ、同じように包まれました。幾度繰り返しても、本当に逃げられません。そこで木を治すと約束し、海上へ治療の法を求め、三島（さんとう）をくまなく巡りましたが、どの仙人にも手立てがありません。ですから真心を尽くしてお参りし、特に菩薩さまにお願いに来たのです。どうかお慈悲をもって、一つ方法を授け、唐僧が早く西へ進めるようお救いください。」観音菩薩「どうして早く私に会いに来ず、島々を捜し回ったのです。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-036"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞得此言，心中暗喜道：「造化了，造化了，菩薩一定有方也。」他又上前懇求。菩薩道：「我這淨瓶底的甘露水，善治得仙樹靈苗。」行者道：「可曾經驗過麼？」菩薩道：「經驗過的。」行者問：「有何經驗？」菩薩道：「當年太上老君曾與我賭勝：他把我的楊柳枝拔了去，放在煉丹爐裡，炙得焦乾，送來還我。是我拿了插在瓶中，一晝夜，復得青枝綠葉，與舊相同。」行者笑道：「真造化了，真造化了。烘焦了的尚能醫活，況此推倒的，有何難哉？」菩薩吩咐大眾：「看守林中，我去去來。」遂手托淨瓶，白鸚哥前邊巧囀，孫大聖隨後相從。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 214
    "line_end": 214
  "translation_ja": "悟空はその言葉を聞いて、ひそかに喜んだ。悟空「ありがたい、ありがたい。菩薩さまには、きっと方法があるのだ。」さらに前へ出て願うと、観音菩薩は言った。観音菩薩「私の浄瓶（じょうへい）の底にある甘露水（かんろすい）は、仙木や霊妙な苗をよく治します。」悟空「お試しになったことはありますか。」観音菩薩「あります。」悟空「どんなお試しでしょう。」観音菩薩「昔、太上老君（たいじょうろうくん）と力比べをしたとき、あの方が私の柳の枝を抜き取り、煉丹炉へ入れて、からからに焦がしてから返してきました。私はそれを瓶に挿しました。一昼夜のうちに、枝は青く、葉は緑に戻り、もとのとおりになったのです。」悟空は笑った。悟空「本当にありがたいことです。焦がしたものさえ生き返るなら、ただ倒れた木など、何の難しいことがありましょう。」観音菩薩は一同に命じた。観音菩薩「林を守っていなさい。私は行ってきます。」浄瓶を手に載せると、白い鸚哥が前で巧みにさえずり、悟空が後ろに付き従った。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-037"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    玉毫金象世難論，正是慈悲救苦尊。
    過去劫逢無垢佛，至今成得有為身。
    幾生慾海澄清浪，一片心田絕點塵。
    甘露久經真妙法，管教寶樹永長春。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 216
    "line_end": 219
  "translation_ja": |-
    玉の白毫（びゃくごう）、金の御姿は、世の言葉では言い尽くせぬ。まさに慈悲によって苦しみを救う尊者である。
    過去の劫に無垢仏（むくぶつ）と巡り会い、今に至って、この有為（うい）の身を成し遂げた。
    幾たびの生で欲の海の波を澄ませ、一片の心の田には、塵一つもない。
    甘露のまことに妙なる法は、すでに長く試されており、必ず宝の木を永遠の春へ戻すだろう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「無垢佛」の特定経典上の同定は未確定。「有為身」は底本どおり有為の身とし、無為身へ無断訂正しない。"
- "id": "xy-ch26-038"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那觀裡大仙與三老正然清話，忽見孫大聖按落雲頭，叫道：「菩薩來了，快接，快接。」慌得那三星與鎮元子共三藏師徒，一齊迎出寶殿。菩薩才住了祥雲，先與鎮元子陪了話，後與三星作禮，禮畢上坐。那階前，行者引唐僧、八戒、沙僧都拜了。那觀中諸仙也來拜見。行者道：「大仙不必遲疑，趁早兒陳設香案，請菩薩替你治那甚麼果樹去。」大仙躬身謝菩薩道：「小可的勾當，怎麼敢勞菩薩下降？」菩薩道：「唐僧乃我之弟子，孫悟空衝撞了先生，理當賠償寶樹。」三老道：「既如此，不須謙講了，請菩薩都到園中去看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 220
    "line_end": 220
  "translation_ja": "さて、道観で鎮元子と三老が清談していると、悟空が雲を降ろして呼びかけた。悟空「菩薩さまがおいでだ。早くお迎えを、早く。」三老も鎮元子も、三蔵たちとともに、急いで宝殿から迎えに出た。観音菩薩は瑞雲を止めると、まず鎮元子にわびの言葉を述べ、それから三老に礼をした。礼が済んで上座に着くと、階の前で悟空が三蔵、八戒、沙悟浄を導いて拝礼し、道観の仙人たちも参った。悟空「大仙、ぐずぐずせず、早く香案を整え、菩薩さまにあの何とかいう果樹を治していただこう。」鎮元子は身をかがめ、観音菩薩に礼を述べた。鎮元子「このような小さな用のために、どうして菩薩さまにお下りいただくお手数をかけられましょう。」観音菩薩「唐僧は私の弟子です。孫悟空があなたに逆らったのですから、宝の木は償うのが当然です。」三老「それなら、もうご謙遜は無用です。菩薩さまと一緒に、皆で園へ見に参りましょう。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-039"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大仙即命設具香案，打掃後園，請菩薩先行，三老隨後。三藏師徒與本觀眾仙都到園內觀看時，那棵樹倒在地下，土開根現，葉落枝枯。菩薩叫：「悟空，伸手來。」那行者將左手伸開。菩薩將楊柳枝蘸出瓶中甘露，把行者手心裡畫了一道起死回生的符字，教他放在樹根之下，但看水出為度。那行者捏著拳頭，往那樹根底下揣著，須臾，有清泉一汪。菩薩道：「那個水不許犯五行之器，須用玉瓢舀出，扶起樹來，從頭澆下，自然根皮相合，葉長芽生，枝青果出。」行者道：「小道士們，快取玉瓢來。」鎮元子道：「貧道荒山沒有玉瓢，只有玉茶盞、玉酒杯，可用得麼？」菩薩道：「但是玉器，可舀得水的便罷，取將來看。」大仙即命小童子取出有二三十個茶盞、四五十個酒盞，卻將那根下清泉舀出。行者、八戒、沙僧扛起樹來，扶得周正，擁上土，將玉器內甘泉，一甌甌捧與菩薩。菩薩將楊柳枝細細灑上，口中又念著經咒。不多時，灑淨那舀出之水，見那樹果然依舊青綠葉陰森，上有二十三個人參果。清風、明月二童子道：「前日不見了果子時，顛倒只數得二十二個；今日回生，怎麼又多了一個？」行者道：「『日久見人心。』前日老孫只偷了三個，那一個落下地來，土地說這寶遇土而入，八戒只嚷我打了偏手，故走了風信，只纏到如今，才見明白。」菩薩道：「我方才不用五行之器者，知道此物與五行相畏故耳。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 221
    "line_end": 221
  "translation_ja": "鎮元子はただちに香案を整え、裏の園を掃除するよう命じた。観音菩薩を先に立て、三老が続き、三蔵一行と道観の仙人たちも園へ入った。見ると、木は地面に倒れ、土は割れて根が現れ、葉は落ちて枝は枯れていた。観音菩薩「悟空、手を出しなさい。」悟空は左手を広げた。観音菩薩は柳の枝を瓶の甘露に浸し、悟空の掌へ、死を生に戻す符の文字を一つ描いた。そして木の根の下へ差し入れ、水が出るまで待つよう教えた。悟空は拳を握り、木の根の下へ差し入れた。ほどなく、清い泉がひとたまり湧き出た。観音菩薩「この水には、五行（ごぎょう）に属する器を触れさせてはいけません。玉のひしゃくで汲み出し、木を起こして、上から注ぎなさい。そうすれば、自然に根の皮がつながり、葉が伸び、芽が出て、枝が青くなり、実が現れます。」悟空「道士の子たち、早く玉のひしゃくを持ってこい。」鎮元子「この山には玉のひしゃくがございません。玉の茶碗と酒杯ならありますが、使えましょうか。」観音菩薩「玉の器で、水を汲めるものならよいのです。持ってきてごらんなさい。」鎮元子は童子たちに命じ、茶碗を二、三十個、酒杯を四、五十個出させ、根元の清い泉を汲ませた。悟空、八戒、沙悟浄は木を担ぎ起こし、まっすぐ支えて土を寄せ、玉器の甘い泉を一杯ずつ観音菩薩へ捧げた。観音菩薩は柳の枝で丁寧に振りかけ、口には経文と呪を唱えた。ほどなく汲み出した水をすべてまき終えると、木は確かにもとのとおり青々となり、葉はうっそうと茂り、その上には二十三個の人参果があった。清風（せいふう）と明月（めいげつ）「一昨日、実がなくなったとき、何度数え直しても二十二個しかありませんでした。今日生き返ると、なぜ一つ増えたのでしょう。」悟空「『時がたてば人の心が分かる』というものさ。一昨日、俺が盗ったのは三つだけだ。もう一つは地面に落ち、土地神（とちがみ）が、この宝は土に触れると潜ると言った。八戒が、俺が一つ余計に取ったとわめくばかりだったので、話が漏れ、ここまでこじれて、ようやく明らかになったわけだ。」観音菩薩「先ほど五行の器を使わなかったのは、この品が五行を嫌うと知っていたからです。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "復活後の二十三個は、地中へ入った一個を含む。五行を避けて玉器で汲む操作、茶碗二三十個・酒杯四五十個、根の皮がつながる説明を原文どおり保持した。"
- "id": "xy-ch26-040"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大仙十分歡喜，急令取金擊子來，把果子敲下十個，請菩薩與三老復回寶殿，一則謝勞，二來做個人參果會。眾小仙遂調開桌椅，鋪設丹盤，請菩薩坐了上面正席，三老左席，唐僧右席，鎮元子前席相陪，各食了一個。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 222
    "line_end": 222
  "translation_ja": "鎮元子は大喜びで、急いで金撃子（きんげきし）を持ってこさせ、果実を十個落とした。観音菩薩と三老に宝殿へ戻ってもらい、労を謝すとともに、人参果の宴を開くことにした。弟子の仙人たちは卓と椅子を並べ替え、丹盤（たんばん）を整えた。観音菩薩を上座の正席へ、三老を左席へ、三蔵を右席へ招き、鎮元子は前の席に着いて相伴し、それぞれ一つずつ食べた。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch26-041"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    萬壽山中古洞天，人參一熟九千年。
    靈根現出芽枝損，甘露滋生果葉全。
    三老喜逢皆舊契，四僧幸遇是前緣。
    自今會服人參果，盡是長生不老仙。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 224
    "line_end": 227
  "translation_ja": |-
    万寿山の古き洞天、人参果が一度熟すには九千年。
    霊根があらわになり、芽も枝も傷ついたが、甘露が潤し、果実も葉もすべて戻る。
    三老は旧知との巡り会いを喜び、四僧が幸いにも出会ったのは前世からの縁。
    今よりともに人参果をいただけば、皆、長生不老の仙人である。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "本回の詩は成熟まで九千年と明記する。第24回の短頭一万年という概数へ統一しない。"
- "id": "xy-ch26-042"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時菩薩與三老各吃了一個，唐僧始知是仙家寶貝，也吃了一個，悟空三人亦各吃一個，鎮元子陪了一個，本觀仙眾分吃了一個。行者才謝了菩薩回上普陀巖，送三星徑轉蓬萊島。鎮元子卻又安排蔬酒，與行者結為兄弟。這才是不打不成相識，兩家合了一家。師徒四眾，喜喜歡歡，天晚歇了。那長老才是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"

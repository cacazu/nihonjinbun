- "id": "xy-ch26-003"
  "section_id": "chapter-26"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    處世須存心上刃，修身切記寸邊而。
    常言刃字為生意，但要三思戒怒欺。
    上士無爭傳亙古，聖人懷德繼當時。
    剛強更有剛強輩，究竟終成空與非。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 123
    "line_end": 126
  "translation_ja": |-
    世を渡るには、心に刃を載せた「忍」を胸に置き、身を修めるには、寸のそばに而を添えた「耐」を深く心に刻め。
    常にいう、刃の字こそ生きる道、よくよく考え、怒りと欺きを戒めよ。
    すぐれた者は争わぬと、はるか昔から伝えられ、聖人は徳を抱いて、その時代に受け継ぐ。
    強情な者には、さらに強情な相手がいる。ついには空しいこと、誤ったこととなるばかり。
  "translation_status": "reviewed"

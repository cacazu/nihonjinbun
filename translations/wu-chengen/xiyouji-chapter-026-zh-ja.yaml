- "id": "xy-ch26-004"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那鎮元大仙用手攙著行者道：「我也知道你的本事，我也聞得你的英名，只是你今番越理欺心，縱有騰那，脫不得我手。我就和你講到西天，見了你那佛祖，也少不得還我人參果樹。你莫弄神通。」行者笑道：「你這先生，好小家子樣。若要樹活，有甚疑難？早說這話，可不省了一場爭競？」大仙道：「不爭競，我肯善自饒你！」行者道：「你解了我師父，我還你一棵活樹如何？」大仙道：「你若有此神通，醫得樹活，我與你八拜為交，結為兄弟。」行者道：「不打緊，放了他們，老孫管教還你活樹。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 128
    "line_end": 128
  "translation_ja": "さて、鎮元子（ちんげんし）は悟空（ごくう）の手をつかんで言った。鎮元子「お前の腕前は私も知っているし、その名声も聞いている。だが今回は、道理にも良心にも背いた。いくら跳び回っても、私の手からは逃れられぬ。西天（さいてん）まで行ってお前の仏祖の前で言い分を争っても、人参果（にんじんか）の木は必ず返してもらう。もう神通力を弄するな。」悟空は笑った。悟空「先生も、ずいぶんけちなことを言うな。木を生き返らせたいなら、何が難しい。初めからそう言えば、この争いもせずに済んだではないか。」鎮元子「争わずに、私がおとなしく許すと思うか。」悟空「お師匠さまを解放してくれれば、生きた木を返す。それでどうだ。」鎮元子「本当にそんな神通力があって、木を治して生き返らせるなら、八拝（はっぱい）の礼を交わし、お前と義兄弟になろう。」悟空「何でもないことだ。皆を放してくれ。必ず、生きた木を返してやる。」"
  "translation_status": "reviewed"
- "id": "xy-ch26-005"
  "section_id": "chapter-26"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大仙諒他走不脫，即命解放了三藏、八戒、沙僧。沙僧道：「師父啊，不知師兄搗得是甚麼鬼哩。」八戒道：「甚麼鬼，這叫做『當面人情鬼』。樹死了，又可醫得活？他弄個光皮散兒好看，者著求醫治樹，單單了脫身走路，還顧得你和我哩。」三藏道：「他決不敢撒了我們。我們問他那裡求醫去。」遂叫道：「悟空，你怎麼哄了仙長，解放我等？」行者道：「老孫是真言實語，怎麼哄他？」三藏道：「你往何處去求方？」行者道：「古人云：『方從海上來。』我今要上東洋大海，遍遊三島十洲，訪問仙翁聖老，求一個起死回生之法，管教醫得他樹活。」三藏道：「此去幾時可回？」行者道：「只消三日。」三藏道：「既如此，就依你說，與你三日之限。三日裡來便罷；若三日之外不來，我就念那話兒經了。」行者道：「遵命，遵命。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch26-1808230"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第026回&oldid=1808230"
    "line_start": 129
    "line_end": 129
  "translation_ja": "鎮元子は悟空が逃げ切れないと見込んで、ただちに三蔵（さんぞう）、八戒（はっかい）、沙悟浄（さごじょう）を解放するよう命じた。沙悟浄「お師匠さま、兄貴はどんな手を使うつもりなのでしょう。」八戒「どんな手だって。あれは、その場だけいい顔をする手だ。木が死んだのに、生き返らせられるものか。見栄えのよい口先の薬を振りまき、木を治す医者を捜すふりで、一人だけ逃げ出すんだ。俺たちのことなど構うものか。」三蔵「あの者は、決して私たちを見捨てはしまい。どこへ治療を求めに行くのか、聞いてみよう。」そこで呼びかけた。三蔵「悟空、仙人さまをどうだまして、私たちを放していただいたのだ。」悟空「私は本当のことを言いました。どうしてだますのです。」三蔵「どこへ治す方法を求めに行くのだ。」悟空「昔から『処方は海の上から来る』と申します。今から東の大海へ行き、三島十洲（さんとうじっしゅう）をくまなく巡って、仙翁や聖人を訪ね、死んだものを生き返らせる法を求めます。必ずあの木を生き返らせてみせます。」三蔵「行ったら、いつ帰ってこられる。」悟空「三日あれば十分です。」三蔵「それなら、お前の言うとおり、期限は三日としよう。三日のうちに帰ればよいが、それを過ぎても戻らなければ、あのいつもの経を唱えるよ。」悟空「承知しました、承知しました。」"
  "translation_status": "reviewed"

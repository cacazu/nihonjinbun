    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "南海・天界・師のもとを巡る二人の戦いと、沙悟浄の三昼夜の帰路が交差して語られる。前回の四日間という証言、各場面の所要時間を訳者が換算して整合させてはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-07-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「前年」。ここでは字面どおり「おととし」とした。以前に悟空を迎えに行った出来事からの年数を、他の回の旅程に合わせて訂正していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-08-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "十王の殿の順序、卞城王・平等王・都市王・忤官王などの字を底本どおり保存した。他の回や一般的な十王の順序へ無断で並べ替えない。「楚江王」は初江王の異表記として辞典に見えるが、本回の楚の字を残す。参照：https://www.zhongwen.cn/cidian/chujiangwang/ 。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-09-body"
    "section_id": "chapter-58"

        "line_start": 143
        "line_end": 143
    "translation_ja": "さて、二人の悟空は雲を飛ばし、霧を駆け、戦いながら西天へ上っていった。その証しに詩がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-021"
    "section_id": "chapter-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      人有二心生禍災，天涯海角致疑猜。
      欲思寶馬三公位，又憶金鑾一品臺。
      南征北討無休歇，東擋西除未定哉。
      禪門須學無心訣，靜養嬰兒結聖胎。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 144
        "line_end": 147
    "translation_ja": |-
      人に二つの心があれば災いが生まれ、天の果て、海の果てまで疑いが及ぶ。
      名馬と三公（さんこう）の位を望み、また金鑾（きんらん）の殿の一品（いっぽん）の高位を思う。
      南へ征き、北を討って休むことなく、東を防ぎ、西を払い、まだ落ち着かぬ。
      禅門では無心の要訣を学び、静かに嬰児（えいじ）を養って聖胎（せいたい）を結ぶべし。
    "translation_status": "reviewed"
  - "id": "xy-ch58-022"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個在那半空裡扯扯拉拉，抓抓掗掗，且行且鬥，直嚷至大西天靈鷲仙山雷音寶剎之外。早見那四大菩薩、八大金剛、五百阿羅、三千揭諦、比丘尼、比丘僧、優婆塞、優婆夷諸大聖眾，都到七寶蓮臺之下，淨聽如來說法。那如來正講到這："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 149
        "line_end": 149
    "translation_ja": "二人は空中で引っ張り合い、引きずり合い、つかみ合い、押し合い、進みながら戦って、大西天（だいさいてん）の霊鷲仙山（りょうじゅせんざん）、雷音宝刹（らいおんほうせつ）の外まで怒鳴り込んできた。そこではすでに、四大菩薩（しだいぼさつ）、八大金剛（はちだいこんごう）、五百の阿羅漢（あらかん）、三千の掲諦（ぎゃてい）、比丘尼（びくに）、比丘僧（びくそう）、優婆塞（うばそく）、優婆夷（うばい）という聖者たちが皆、七宝の蓮台の下に集まり、心を澄ませて如来（にょらい）の説法を聞いていた。如来はちょうど、次のところを説いていた。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-023"
    "section_id": "chapter-58"
    "kind": "verse"
    "origin": "source"
    "source_text": "「不有中有，不無中無。不色中色，不空中空。非有為有，非無為無。非色為色，非空為空。空即是空，色即是色。色無定色，色即是空。空無定空，空即是色。知空不空，知色不色。名為照了，始達妙音。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      如来「有ならぬ中に有があり、無ならぬ中に無がある。
      色（しき）ならぬ中に色があり、空（くう）ならぬ中に空がある。
      有にあらぬものを有とし、無にあらぬものを無とする。
      色にあらぬものを色とし、空にあらぬものを空とする。
      空はすなわち空であり、色はすなわち色である。
      色には定まった色がなく、色はすなわち空である。
      空には定まった空がなく、空はすなわち色である。
      空を知って空とせず、色を知って色としない。
      これを照了（しょうりょう）と名づけ、初めて妙音（みょうおん）に達するのである。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-024"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "概眾稽首皈依，流通誦讀之際，如來降天花普散繽紛，即離寶座，對大眾道：「汝等俱是一心，且看二心競鬥而來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      一同は頭を下げて帰依し、教えを広め、唱え読んでいた。その時、如来は天の花を降らせ、あまねく舞い散らせると、宝座を離れて皆に告げた。
      如来「お前たちは皆、一つの心である。見なさい、二つの心が競い争ってやって来る。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-025"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大眾舉目看之，果是兩個行者，吆天喝地，打至雷音勝境。慌得那八大金剛上前擋住道：「汝等欲往那裡去？」這大聖道：「妖精變作我的模樣，欲至寶蓮臺下，煩如來為我辨個虛實也。」眾金剛抵擋不住，直嚷至臺下，跪於佛祖之前，拜告道：「弟子保護唐僧，來造寶山，求取真經，一路上煉魔縛怪，不知費了多少精神。前至中途，偶遇強徒劫擄，委是弟子二次打傷幾人。師父怪我趕回，不容同拜如來金身。弟子無奈，只得投奔南海，見觀音訴苦。不期這個妖精假變弟子聲音、相貌，將師父打倒，把行李搶去。師弟悟淨尋至我山，被這妖假捏巧言，說有真僧取經之故。悟淨脫身至南海，備說詳細。觀音知之，遂令弟子同悟淨再至我山。因此，兩人比併真假，打至南海，又打到天宮，又曾打見唐僧，打見冥府，俱莫能辨認。故此大膽輕造，千乞大開方便之門，廣垂慈憫之念，與弟子辨明邪正，庶好保護唐僧親拜金身，取經回東土，永揚大教。」大眾聽他兩張口一樣聲，俱說一遍，眾亦莫辨。惟如來則通知之，正欲道破，忽見南下彩雲之間，來了觀音，參拜我佛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      一同が目を上げて見ると、本当に二人の悟空が、天へ叫び地へ怒鳴り、戦いながら雷音寺の聖地へ来ていた。八大金剛は慌てて進み出て、行く手を遮った。
      八大金剛「お前たちは、どこへ行こうというのだ。」
      悟空「妖怪が私の姿に化けています。宝蓮台（ほうれんだい）の下へ参り、如来に私たちの真偽を見分けていただきたいのです。」
      金剛たちには食い止められず、二人は怒鳴りながら台の下まで来ると、仏祖の前にひざまずき、拝んで訴えた。
      一方の悟空「弟子の私は三蔵を守り、御山へ参って真の経典を求めようと、道中ずっと魔を練り伏せ、怪を縛り、どれほど心を砕いてきたか知れません。先ごろ道半ばで強盗に襲われ、確かに私は二度にわたって何人かを打ち傷つけました。師はそれをとがめ、追い返して、如来の金身（こんじん）をともに拝むことを許してくれませんでした。私は仕方なく南海へ身を寄せ、観音菩薩さまに苦しい胸の内を訴えました。思いがけず、この妖怪が私の声と姿をまね、師を打ち倒して荷物を奪いました。弟弟子の悟浄（ごじょう）が私の山へ探しに行くと、この妖怪は巧みな嘘をこしらえ、本物の僧が経を取りに行くのだと言い立てたのです。悟浄は逃れて南海へ行き、詳しく話しました。観音菩薩さまはそれを知り、私に悟浄ともう一度山へ行くよう命じました。こうして二人で真偽を競い、南海まで戦い、天宮へも戦い上り、三蔵のもとにも、冥府にも戦いながら行きましたが、どこでも見分けられませんでした。そのため、恐れながら軽々しくお訪ねした次第です。どうか方便の門を大きく開き、広く慈悲のお心をお垂れになって、私たちの邪と正を明らかにしてください。そうすれば三蔵を守って、じかに金身を拝ませ、経典を東土（とうど）へ持ち帰り、偉大な教えを永く広められます。」
      一同は、二つの口が同じ声で、それぞれ同じ話を一度ずつ述べるのを聞いたが、やはり見分けられなかった。ただ如来だけはすべてを知り、まさに明かそうとしていた。すると南方の彩雲の間から観音菩薩が来て、仏を拝んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch58-026"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "我佛合掌道：「觀音尊者，你看那兩個行者，誰是真假？」菩薩道：「前日在弟子荒境，委不能辨。他又至天宮、地府，亦俱難認。特來拜告如來，千萬與他辨明辨明。」如來笑道：「汝等法力廣大，只能普閱周天之事，不能遍識周天之物，亦不能廣會周天之種類也。」菩薩又請示周天種類。如來才道：「周天之內有五仙：乃天、地、神、人、鬼。有五蟲：乃蠃、鱗、毛、羽、昆。這廝非天、非地、非神、非人、非鬼，亦非蠃、非鱗、非毛、非羽、非昆。又有四猴混世，不入十類之種。」菩薩道：「敢問是那四猴？」如來道：「第一是靈明石猴，通變化，識天時，知地利，移星換斗；第二是赤尻馬猴，曉陰陽，會人事，善出入，避死延生；第三是通臂猿猴，拿日月，縮千山，辨休咎，乾坤摩弄；第四是六耳獼猴，善聆音，能察理，知前後，萬物皆明。此四猴者，不入十類之種，不達兩間之名。我觀假悟空乃六耳獼猴也。此猴若立一處，能知千里外之事；凡人說話，亦能知之。故此善聆音，能察理，知前後，萬物皆明。與真悟空同像同音者，六耳獼猴也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      如来は合掌して言った。
      如来「観音尊者（かんのんそんじゃ）、二人の悟空を見て、どちらが本物か偽物か分かるか。」
      観音菩薩「先日、私のつたない住まいに参りましたが、確かに見分けられませんでした。その後、天宮と地府へも行きましたが、どこでも判別できません。わざわざ如来にお願いに参りました。どうか、どうかお見分けください。」
      如来は笑った。
      如来「お前たちの法力は広大だが、天のもとの出来事を広く見渡せるだけで、そのあらゆる物を知り尽くすことも、あらゆる種類を広く理解することもできないのだ。」
      観音菩薩は、天のもとにある種類について、さらに教えを願った。そこで如来は説いた。
      如来「天のもとには五仙（ごせん）がある。天・地・神・人・鬼である。また五虫（ごちゅう）がある。蠃・鱗・毛・羽・昆である。この者は天でも地でも神でも人でも鬼でもなく、蠃でも鱗でも毛でも羽でも昆でもない。さらに、この十の種類に入らず、世に交じって生きる四種の猿がある。」
      観音菩薩「お尋ねしますが、どの四種でしょうか。」
      如来「第一は霊明石猴（れいめいせきこう）。変化に通じ、天の時を知り、地の利を知り、星を移し北斗（ほくと）の位置を替える。第二は赤尻馬猴（せきこうばこう）。陰陽を悟り、人の事に通じ、巧みに出入りして、死を避け寿命を延ばす。第三は通臂猿猴（つうひえんこう）。日月を取り、千の山を縮め、吉凶を見分け、天地を手でもてあそぶ。第四は六耳獼猴（ろくじびこう）。音をよく聞き分け、道理を察し、前も後も知り、万物をことごとく明らかにする。この四種の猿は、十の種類に入らず、天地の二界の名簿にも名が載らない。私の見るところ、偽の悟空は六耳獼猴なのだ。この猿は、ある場所に立てば千里の外の出来事を知り、人の話すこともみな知ることができる。だから、音をよく聞き分け、道理を察し、前も後も知り、万物をことごとく明らかにするのだ。本物の悟空と同じ姿、同じ声を持つ者は、六耳獼猴である。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-027"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獼猴聞得如來說出他的本像，膽戰心驚，急縱身，跳起來就走。如來見他走時，即令大眾下手。早有四菩薩、八金剛、五百阿羅、三千揭諦、比丘僧、比丘尼、優婆塞、優婆夷、觀音、木叉，一齊圍繞。孫大聖也要上前，如來道：「悟空休動手，待我與你擒他。」那獼猴毛骨悚然，料著難脫，即忙搖身一變，變作個蜜蜂兒，往上便飛。如來將金缽盂撇起去，正蓋著那蜂兒，落下來。大眾不知，以為走了。如來笑云：「大眾休言。妖精未走，見在我這缽盂之下。」大眾一發上前，把缽盂揭起，果然見了本像，是一個六耳獼猴。孫大聖忍不住，掄起鐵棒，劈頭一下打死，至今絕此一種。如來不忍，道聲：「善哉！善哉！」大聖道：「如來不該慈憫他。他打傷我師父，搶奪我包袱，依律問他個得財傷人，白晝搶奪，也該個斬罪哩。」如來道：「你自快去保護唐僧來此求經罷。」大聖叩頭謝道：「上告如來得知：那師父定是不要我，我此去，若不收留，卻不又勞一番神思？望如來方便，把鬆箍兒咒念一念，褪下這個金箍，交還如來，放我還俗去罷。」如來道：「你休亂想，切莫放刁。我教觀音送你去，不怕他不收。好生保護他去，那時功成歸極樂，汝亦坐蓮臺。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      その猿、六耳獼猴は、如来に本来の姿を言い当てられると、肝を震わせておびえ、急いで身を躍らせ、跳び上がって逃げ出した。如来は逃げるのを見ると、ただちに一同へ取り押さえるよう命じた。四菩薩（しぼさつ）、八金剛（はちこんごう）、五百の阿羅漢、三千の掲諦、比丘僧、比丘尼、優婆塞、優婆夷、観音菩薩、恵岸行者が、一斉に取り囲んだ。悟空も進み出ようとしたが、如来が言った。
      如来「悟空、手を出すな。私がお前のために捕らえよう。」
      六耳獼猴は総毛立ち、逃れがたいと悟ると、慌てて身を揺すり、一匹の蜜蜂に化けて上へ飛んだ。如来が金の鉢を放り上げると、それはちょうど蜜蜂を覆って落ちてきた。一同には分からず、逃げられたと思った。如来は笑って言った。
      如来「皆、騒ぐな。妖怪は逃げておらず、今、この鉢の下にいる。」
      一同はどっと進み出て鉢を持ち上げた。すると果たして本来の姿が現れ、一匹の六耳獼猴がいた。悟空はこらえきれず、鉄棒を振り上げ、頭めがけて一撃で打ち殺した。それ以来、今に至るまでこの一種は絶えている。如来は忍びなく思い、声を漏らした。
      如来「善哉（ぜんざい）、善哉。」
      悟空「如来さま、こいつを哀れんではいけません。師を打ち傷つけ、私の荷物を奪いました。律に照らせば、財物を得て人を傷つけ、白昼に強奪した罪で、斬首になって当然です。」
      如来「お前は早く三蔵を守り、ここへ経を求めに来るがよい。」
      悟空は頭を下げて礼を述べた。
      悟空「如来さまに申し上げます。あの師は、きっと私を必要としません。戻っても受け入れてもらえなければ、また一苦労するだけではありませんか。どうかお取り計らいを。鬆箍児呪（しょうこじじゅ）を唱えて、この金箍（きんこ）を外し、如来さまへお返しさせてください。私は俗世へ戻らせていただきたいのです。」
      如来「勝手なことを考えるな。決して意地を張るな。観音（かんのん）に送らせよう。受け入れぬ心配はない。しっかりと師を守って行くのだ。功を成し遂げて極楽（ごくらく）へ帰る時には、お前も蓮台に座ることになる。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-028"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那觀音在傍聽說，即合掌謝了聖恩，領悟空，輒駕雲而去。隨後木叉行者、白鸚哥一同趕上。不多時，到了中途草舍人家。沙和尚看見，急請師父拜門迎接。菩薩道：「唐僧，前日打你的，乃假行者六耳獼猴也。幸如來知識，已被悟空打死。你今須是收留悟空，一路上魔障未消，必得他保護你，才得到靈山，見佛取經。再休嗔怪。」三藏叩頭道：「謹遵教旨。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      そばで聞いていた観音菩薩は、すぐ合掌して仏の恩に感謝し、悟空を連れて雲に乗って去った。その後から恵岸行者と白鸚哥（しろいんこ）が、一緒に追いついた。ほどなく、道中の草ぶきの家に着いた。沙悟浄はそれを見ると、急いで師に願い、門へ出て拝んで迎えてもらった。
      観音菩薩「唐僧（とうそう）、先日お前を打ったのは、偽の悟空、六耳獼猴です。幸い如来が見抜かれ、すでに悟空が打ち殺しました。今は悟空を受け入れなければなりません。道中の魔障はまだ消えておらず、必ず悟空に守ってもらわなければ、霊山（れいざん）へ行き、仏に会って経を取ることはできません。もう怒って責めてはなりません。」
      三蔵は頭を下げた。
      三蔵「謹んで仰せに従います。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-029"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正拜謝時，只聽得正東上狂風滾滾，豬八戒背著兩個包袱，駕風而至。獃子見了菩薩，倒身下拜道：「弟子前日別了師父，至花果山水簾洞尋取包袱，果見一個假唐僧、假八戒，都被弟子打死，原是兩個猴身。卻入裡，方尋著包袱，當時查點，一物不少，卻駕風轉此。更不知兩行者下落如何？」菩薩把如來識怪之事說了一遍。那獃子十分歡喜，稱謝不盡。師徒們拜謝了，菩薩回海。卻都照舊合意同心，洗冤解怒。又謝了那村舍人家，整束行囊、馬匹，找大路而西。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      ちょうど礼を述べていると、真東から烈風がごうごうと鳴り、八戒が二つの包みを背負い、風に乗ってやって来た。この猪男は観音菩薩を見ると、ひれ伏して拝んだ。
      八戒「弟子の私は先日、師と別れて花果山の水簾洞へ荷物を取りに行きました。すると本当に偽の三蔵と偽の八戒が一人ずついたので、私が二人とも打ち殺しました。正体は二匹の猿でした。それから中へ入り、ようやく包みを見つけ、その場で調べると、一つも欠けていませんでした。それで風に乗ってこちらへ戻ったのです。二人の悟空がどうなったかは、まるで知りませんが。」
      観音菩薩は、如来が妖怪を見分けた一件を一通り話した。八戒はたいそう喜び、礼を言っても言い尽くせなかった。師と弟子たちが礼を述べると、観音菩薩は海へ帰った。一行はもとのように意志を合わせ、心を一つにし、冤罪を晴らし、怒りを解いた。さらにその村の家の人々へ礼を言い、荷物と馬を整え、大道を目指して西へ向かった。まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch58-030"
    "section_id": "chapter-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      中道分離亂五行，降妖聚會合元明。
      神歸心舍禪方定，六識祛降丹自成。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 161
        "line_end": 162
    "translation_ja": |-
      道半ばの離別で五行（ごぎょう）は乱れ、妖を降して集えば元明（げんめい）は一つとなる。
      神が心の宿へ帰ってこそ禅は定まり、六識（ろくしき）を払い鎮めれば丹（たん）はおのずと成る。
    "translation_status": "reviewed"
  - "id": "xy-ch58-031"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟這去，不知三藏幾時得面佛求經，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 164
        "line_end": 164
    "translation_ja": "さて、この先、三蔵はいつ仏にお目にかかり、経を求めることができるのか。それは次の回でお話ししよう。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-01-body"
    "section_id": "chapter-58"

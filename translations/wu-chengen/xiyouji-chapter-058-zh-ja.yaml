    "source_text": "卻說那兩個行者又打嚷到陰山背後，諕得那滿山鬼戰戰兢兢，藏藏躲躲。有先跑的，撞入陰司門裡，報上森羅寶殿道：「大王，背陰山上有兩個齊天大聖打將來也。」慌得那第一殿秦廣王傳報與二殿楚江王、三殿宋帝王、四殿卞城王、五殿閻羅王、六殿平等王、七殿泰山王、八殿都市王、九殿忤官王、十殿轉輪王：一殿轉一殿，霎時間，十王會齊，又著人飛報與地藏王。盡在森羅殿上，點聚陰兵，等擒真假。只聽得那強風滾滾，慘霧漫漫，二行者一翻一滾的打至森羅殿下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      さて、二人の悟空はまた戦い、怒鳴りながら陰山（いんざん）の裏へやって来た。山じゅうの鬼は驚いてぶるぶる震え、あちらこちらへ隠れた。先に逃げた者たちは冥界の門へ飛び込み、森羅宝殿（しんらほうでん）へ報告した。
      冥界の報告者たち「大王、背陰山（はいんざん）から二人の斉天大聖が戦いながらやって来ます！」
      驚いた第一殿の秦広王（しんこうおう）は、第二殿の楚江王（そこうおう）、第三殿の宋帝王（そうていおう）、第四殿の卞城王（べんじょうおう）、第五殿の閻羅王（えんらおう）、第六殿の平等王（びょうどうおう）、第七殿の泰山王（たいざんおう）、第八殿の都市王（としおう）、第九殿の忤官王（ごかんおう）、第十殿の転輪王（てんりんおう）へ知らせを回した。一殿から次の一殿へと伝え、またたく間に十王（じゅうおう）がそろうと、さらに地蔵王（じぞうおう）のもとへ急使を走らせた。一同は森羅殿（しんらでん）に集まり、冥界の兵を点呼して集め、本物も偽物も捕らえようと待ち構えた。すると、烈風がごうごうと鳴り、陰惨な霧が一面に立ちこめ、二人の悟空がもんどり打ち、転げながら戦って、森羅殿の下までやって来た。
    "translation_status": "reviewed"
  - "id": "xy-ch58-018"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "陰君近前擋住道：「大聖有何事，鬧我幽冥？」這大聖道：「我因保唐僧西天取經，路過西梁國，至一山，有強賊截劫我師。是老孫打死幾個，師父怪我，把我逐回。我隨到南海菩薩處訴告，不知那妖精怎麼就綽著口氣，假變作我的模樣，在半路上打倒師父，搶奪了行李。師弟沙僧向我本山取討包袱，這妖假立師名，要往西天取經。沙僧逃遁至南海見菩薩，我正在側。他備說原因，菩薩又命我同他至花果山觀看，果被這廝占了我巢穴。我與他爭辨到菩薩處，其實相貌、言語等俱一般，菩薩也難辨真假。又與這廝打上天堂，眾神亦果難辨。因見我師，我師念緊箍咒試驗，與我一般疼痛。故此鬧至幽冥，望陰君與我查看生死簿，看假行者是何出身，快早追他魂魄，免教二心沌亂。」那怪亦如此說一遍。陰君聞言，即喚管簿判官一一從頭查勘，更無個假行者之名。再看毛蟲文簿，那猴子一百三十條，已是孫大聖幼年得道之時，大鬧陰司，消死名，一筆勾之。自後來，凡是猴屬，盡無名號。查勘畢，當殿回報。陰君各執笏，對行者道：「大聖，幽冥處既無名號可查，你還到陽間去折辨。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      冥王は進み出て遮った。
      冥王「大聖（たいせい）、何事があって、わが冥界を騒がせるのですか。」
      悟空「私は三蔵を守って西天へ経を取りに行く途中、西梁国（せいりょうこく）を過ぎて、ある山へ来ました。すると強盗どもが師を襲ったので、私が何人か打ち殺しました。師はそれをとがめ、私を追い返したのです。そこで南海の菩薩さまのもとへ訴えに行った。ところが、この妖怪がどうやって話をかぎつけたのか、私の姿に化けて道中のお師匠さまを打ち倒し、荷物を奪ったのです。弟弟子の沙悟浄が私の山へ包みを取り戻しに行くと、こいつは偽の師を立て、西天へ経を取りに行こうとしていた。沙悟浄は逃れて南海へ行き、菩薩さまに会いました。その時、私はそばにいました。沙悟浄が事情を詳しく話すと、菩薩さまは私に、沙悟浄と花果山へ行ってみるよう命じました。すると、本当にこいつが私のすみかを占領していたのです。私はこいつと争いながら菩薩さまのところへ行きましたが、姿も言葉もすべて同じなので、菩薩さまにも真偽が分かりません。さらにこいつと戦いながら天界へ上りましたが、神々にもやはり見分けられませんでした。それで師のもとへ行き、師が緊箍呪（きんこじゅ）を唱えて試したところ、こいつも私と同じように痛がりました。そのため冥界まで騒がせに来たのです。冥王さま、どうか生死簿（せいしぼ）を調べて、偽の悟空が何者かを突き止め、早く魂を取り立ててください。二つの心が混じって乱れぬように。」
      相手も同じ話を一度繰り返した。冥王は聞くと、名簿を扱う判官を呼び、初めから一件ずつ調べさせたが、偽の悟空の名などどこにもなかった。毛虫（もうちゅう）の名簿も調べたが、猿の百三十条の記載は、悟空が若いころ道を得て冥界で暴れた際、死の名を消すために一筆で抹消していた。それ以後、猿の仲間はすべて、名が載っていなかった。調査を終え、殿前で報告した。冥王たちはそれぞれ笏（しゃく）を手にし、悟空たちに言った。
      冥王たち「大聖、冥界には調べられる名がありません。この世に戻って決着をつけていただきたい。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-019"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，只聽得地藏王菩薩道：「且住，且住。等我著諦聽與你聽個真假。」原來那諦聽是地藏菩薩經案下伏的一個獸名。他若伏在地下，一霎時，將四大部洲山川社稷，洞天福地之間，蠃蟲、鱗蟲、毛蟲、羽蟲、昆蟲、天仙、地仙、神仙、人仙、鬼仙，可以照鑒善惡，察聽賢愚。那獸奉地藏鈞旨，就於森羅庭院之中，俯伏在地。須臾，擡起頭來，對地藏道：「怪名雖有，但不可當面說破，又不能助力擒他。」地藏道：「當面說出便怎麼？」諦聽道：「當面說出，恐妖精惡發，搔擾寶殿，致令陰府不安。」又問：「何為不能助力擒拿？」諦聽道：「妖精神通，與孫大聖無二。幽冥之神，能有多少法力？故此不能擒拿。」地藏道：「似這般怎生祛除？」諦聽言：「佛法無邊。」地藏早已省悟，即對行者道：「你兩個形容如一，神通無二，若要辨明，須到雷音寺釋迦如來那裡，方得明白。」兩個一齊嚷道：「說的是，說的是。我和你西天佛祖之前折辨去。」那十殿陰君送出，謝了地藏，回上翠雲宮，著鬼使閉了幽冥關隘不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      そう話していると、地蔵王菩薩（じぞうおうぼさつ）の声がした。
      地蔵王菩薩「待ちなさい、待ちなさい。諦聴（たいちょう）に、真偽を聞き分けさせましょう。」
      諦聴とは、地蔵王菩薩の経机の下に伏せている獣の名である。この獣が地に伏せると、一瞬のうちに四大部洲（しだいぶしゅう）の山川や国土、洞天福地（どうてんふくち）にいる蠃虫（らちゅう）・鱗虫（りんちゅう）・毛虫・羽虫（うちゅう）・昆虫（こんちゅう）、天仙（てんせん）・地仙（ちせん）・神仙（しんせん）・人仙（じんせん）・鬼仙（きせん）について、善悪を見抜き、賢愚を聞き分けることができる。諦聴は地蔵王菩薩の命を受け、森羅殿の庭で地に伏した。しばらくすると頭を上げ、地蔵王菩薩へ告げた。
      諦聴「妖怪の名は分かりましたが、面前で明かすわけにはいきません。また、助力して捕らえることもできません。」
      地蔵王菩薩「面前で言えば、どうなるのです。」
      諦聴「面前で明かせば、妖怪が怒り狂って宝殿を荒らし、冥府を不安に陥れる恐れがあります。」
      地蔵王菩薩「どうして、助力して捕らえられないのです。」
      諦聴「妖怪の神通力は孫大聖（そんたいせい）と変わりません。冥界の神々に、どれほどの法力がありましょう。それで捕らえられないのです。」
      地蔵王菩薩「それでは、どうすれば取り除けますか。」
      諦聴「仏法は無辺です。」
      地蔵王菩薩はすぐに悟り、悟空たちへ言った。
      地蔵王菩薩「お前たちは姿が一つのようで、神通力にも違いがありません。見分けたければ、雷音寺（らいおんじ）の釈迦如来（しゃかにょらい）のところへ行くほかありません。そこでこそ明らかになるでしょう。」
      二人の悟空は同時に叫んだ。
      二人の悟空「そのとおり、そのとおり。西天の仏祖（ぶっそ）の前で、俺とお前の決着をつけよう。」
      十殿の冥王たちは二人を送り出し、地蔵王菩薩に礼を述べ、翠雲宮（すいうんきゅう）へ戻り、鬼の使いに冥界の関所を閉じさせた。その話はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch58-020"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "看那兩個行者飛雲奔霧，打上西天。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"

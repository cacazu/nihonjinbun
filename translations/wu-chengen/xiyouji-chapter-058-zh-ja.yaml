    "origin": "source"
    "source_text": "那家老老小小的都來問沙僧道：「你這幾日往何處討盤纏去的？」沙僧笑道：「我往東勝神洲花果山尋大師兄取討行李，又到南海普陀山拜見觀音菩薩，卻又到花果山，方才轉回至此。」那老者又問：「往返有多少路程？」沙僧道：「約有二十餘萬里。」老者道：「爺爺呀！似這幾日，就走了這許多路，只除是駕雲，方能夠得到！」八戒道：「不是駕雲，如何過海？」沙僧道：「我們那算得走路，若是我大師兄，只消一二日，可往回也。」那家子聽言，都說是神仙。八戒道：「我們雖不是神仙，神仙還是我們的晚輩哩！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      その家の者たちが、老人も子供も皆やって来て、沙悟浄に尋ねた。
      家の人々「この何日か、どちらへ路銀を取りに行っていたのですか。」
      沙悟浄は笑って答えた。
      沙悟浄「東勝神洲（とうしょうしんしゅう）の花果山へ、いちばん上の兄弟子を訪ねて荷物を取り戻しに行き、それから南海の普陀山（ふださん）で観音菩薩さまにお目にかかりました。それからまた花果山へ行き、ようやくここへ戻ってきたところです。」
      老人「往復で、どれくらいの道のりなのです。」
      沙悟浄「およそ二十余万里です。」
      老人「これは、なんと！　この数日でそれほどの道を行くとは。雲に乗るのでなければ、とても行き着けますまい！」
      八戒「雲に乗らずに、どうやって海を渡るんだ。」
      沙悟浄「私たちの旅の速さなど、大したものではありません。いちばん上の兄さんなら、一日か二日で往復できます。」
      家の者たちは聞くと、皆、仙人だと言った。
      八戒「俺たちは仙人ではないが、仙人の方が俺たちの後輩なんだぞ！」
    "translation_status": "reviewed"
  - "id": "xy-ch58-014"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說間，只聽半空中喧嘩亂嚷。慌得都出來看，卻是兩個行者打將來。八戒見了，忍不住手癢道：「等我去認認看。」好獃子，急縱身跳起，望空高叫道：「師兄莫嚷，我老豬來也！」那兩個一齊應道：「兄弟，來打妖精，來打妖精。」那家子又驚又喜道：「是幾位騰雲駕霧的羅漢歇在我家，就是發願齋僧的，也齋不著這等好人。」更不計較茶飯，愈加供養。又說：「這兩個行者只怕鬥出不好來，地覆天翻，作禍在那裡！」三藏見那老者當面是喜，背後是憂，即開言道：「老施主放心，莫生憂嘆。貧僧收伏了徒弟，去惡歸善，自然謝你。」那老者滿口回答道：「不敢，不敢。」沙僧道：「施主休講。師父可坐在這裡，等我和二哥去，一家扯一個來到你面前，你就念念那話兒，看那個害疼的就是真的，不疼的就是假的。」三藏道：「言之極當。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      ちょうどそんな話をしていると、空中からやかましい怒鳴り合いが聞こえた。皆が驚いて外へ出てみると、二人の悟空が戦いながら来るところだった。八戒はそれを見ると、腕がむずむずするのを抑えられなかった。
      八戒「俺が行って見分けてみよう。」
      この猪男、さっと身を躍らせ、空へ向かって大声を張り上げた。
      八戒「兄貴、騒ぐな。俺が来たぞ！」
      二人の悟空は同時に応じた。
      二人の悟空「弟よ、妖怪を打て、妖怪を打て！」
      家の者たちは、驚くやら喜ぶやらだった。
      家の人々「雲や霧に乗る羅漢（らかん）さまが何人も、うちにお泊まりなのだ。僧に食事を供えようと願を立てても、これほど立派な方には供えられまい。」
      茶や食事の費えなどいっそう気にせず、ますます手厚くもてなした。だがまた、こんなことも言った。
      家の人々「この二人の悟空の争いが、悪いことにならなければよいが。天地がひっくり返ったら、どこで災いが起こるやら！」
      三蔵は、老人が面と向かっては喜び、陰では心配しているのを見ると、口を開いた。
      三蔵「ご老人、どうぞご安心ください。心配して嘆かれますな。私が弟子を収め、悪を去って善に帰らせたら、きっとお礼をいたします。」
      老人はしきりに答えた。
      老人「いえ、いえ、とんでもございません。」
      沙悟浄「施主さま、お話はそれまでに。お師匠さまはここにお座りください。私と八戒兄さんが行って、一人ずつ引っ張ってお師匠さまの前へ連れて来ます。そうしたら、あの言葉を唱えてください。痛がる方が本物で、痛がらぬ方が偽物です。」
      三蔵「まことに、そのとおりだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-015"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧果起在半空道：「二位住了手，我同你到師父面前辨個真假去。」這大聖放了手，那行者也放了手。沙僧攙住一個，叫道：「二哥，你也攙住一個。」果然攙住，落下雲頭，徑至草舍門外。三藏見了，就念緊箍兒咒。二人一齊叫苦道：「我們這等苦鬥，你還咒我怎的？莫念，莫念。」那長老本心慈善，遂住了口不念，卻也不認得真假。他兩個掙脫手，依然又打。這大聖道：「兄弟們保著師父，等我與他打到閻王前折辨去也。」那行者也如此說。二人抓抓掗掗，須臾又不見了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      沙悟浄は本当に空中へ上り、呼びかけた。
      沙悟浄「お二人とも、手を止めてください。お師匠さまの前へ一緒に行き、真偽を見分けてもらいましょう。」
      悟空が手を放すと、もう一人の悟空も放した。沙悟浄は一人の腕を取って叫んだ。
      沙悟浄「八戒兄さんも、一人の腕を取ってください。」
      そのとおり一人ずつつかまえると、雲を降ろし、まっすぐ草ぶきの家の門前へ来た。三蔵は二人を見るなり、緊箍児呪を唱えた。二人は同時に苦しみを訴えた。
      二人の悟空「私たちはこんなに苦労して戦っているのに、まだ私を呪うのですか。唱えないでください。唱えないでください。」
      三蔵はもともと慈悲深い心の持ち主なので、口を閉じて唱えるのをやめた。しかし、本物と偽物はやはり見分けられない。二人は手を振りほどき、また元どおり戦った。
      悟空「弟たち、お師匠さまを守っていてくれ。俺はこいつと戦いながら閻王（えんおう）の前へ行き、決着をつける。」
      もう一人の悟空も同じように言った。二人はつかみ合い、押し合い、たちまちまた姿を消してしまった。

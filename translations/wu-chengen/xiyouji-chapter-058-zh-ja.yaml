    "translation_ja": "末尾の「謝了地藏，回上翠雲宮」は主語が省略されている。訳文は先行する十王の行為としてつなげたが、翠雲宮は地蔵王菩薩の宮であり、帰還の主体には構文上の留保がある。地蔵が戻ると明記された原文へ無断で修正していない。"

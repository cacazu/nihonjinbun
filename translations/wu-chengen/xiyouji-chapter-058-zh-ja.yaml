  - "id": "xy-ch58-002"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者與沙僧拜辭了菩薩，縱起兩道祥光，離了南海。原來行者觔斗雲快，沙和尚仙雲覺遲，行者就要先行。沙僧扯住道：「大哥不必這等藏頭露尾，先去安根。待小弟與你一同走。」大聖本是良心，沙僧卻有疑意。真個二人同駕雲而去。不多時，果見花果山。按下雲頭，二人洞外細看，果見一個行者，高坐石臺之上，與群猴飲酒作樂。模樣與大聖無異：也是黃髮金箍，金睛火眼；身穿也是綿布直裰，腰繫虎皮裙；手中也拿一條兒金箍鐵棒；足下也踏一雙麂皮靴；也是這等毛臉雷公嘴，朔腮別土星，查耳額顱闊，獠牙向外生。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      悟空（ごくう）と沙悟浄（さごじょう）は観音菩薩（かんのんぼさつ）に別れの礼をすると、二筋のめでたい光となって南海（なんかい）を離れた。もともと悟空の觔斗雲（きんとうん）は速く、沙悟浄の仙雲は遅いので、悟空は先へ行こうとした。沙悟浄は引き止めて言った。
      沙悟浄「兄さん、そんなふうに隠し立てをして、先回りして仕掛けを整えるのはやめてください。弟分の私と一緒に行きましょう。」
      悟空にはやましい心などなかったが、沙悟浄は疑っていた。そこで本当に二人一緒に雲に乗って行った。ほどなく花果山（かかざん）が見えた。雲を降ろし、洞の外で二人してよく見ると、やはりもう一人の悟空が石の台に高々と座り、猿たちと酒を飲んで楽しんでいた。その姿は悟空と少しも違わない。黄色い髪に金の輪、金色の瞳に火のような目。着ているのも木綿の直裰（ちょくたつ）で、腰には虎皮の腰巻き。手にはやはり金のたがをはめた鉄棒を一本持ち、足には麂（き）の皮の靴を一足履いている。毛だらけの顔と雷公（らいこう）のような突き出た口も同じ。頬はこけ、鼻は曲がり、耳は張り出し、額と頭は広く、牙は外へ突き出ていた。
    "translation_status": "reviewed"
  - "id": "xy-ch58-003"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖怒發，一撒手，撇了沙和尚，掣鐵棒上前罵道：「你是何等妖邪，敢變我的相貌，敢占我的兒孫，擅居吾仙洞，擅作這威福？」那行者見了，公然不答，也使鐵棒來迎。二行者在一處，果是不分真假，好打呀："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      悟空は怒りを爆発させ、手を振りほどいて沙悟浄を置き去りにし、鉄棒を抜いて進み出ると怒鳴った。
      悟空「お前は何という邪悪な妖怪だ。よくも俺の姿に化け、俺の子や孫を奪い、勝手に俺の仙洞に居座って、威張り散らしているな！」
      もう一人の悟空はそれを見ると、平然として答えもせず、やはり鉄棒を振るって迎え撃った。二人の悟空が一つ所で戦えば、本当にどちらが本物か分からない。なんという戦いだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch58-004"
    "section_id": "chapter-58"
    "kind": "verse"
    "origin": "source"
    "source_text": "兩條棒，二猴精，這場相敵實非輕。都要護持唐御弟，各施功績立英名。真猴實受沙門教，假怪虛稱佛子情。蓋為神通多變化，無真無假兩相平。一個是混元一氣齊天聖，一個是久煉千靈縮地精。這個是如意金箍棒，那個是隨心鐵桿兵。隔架遮攔無勝敗，撐持抵敵沒輸贏。先前交手在洞外，少頃爭持起半空。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      二本の棒、二匹の猿の精、この対決はただならぬ。
      どちらも唐（とう）の御弟（ぎょてい）を守ると言い、手柄を立てて名を上げんとする。
      真の猿はまことに仏門の教えを受け、偽の怪は仏弟子の心を偽って称する。
      神通の変化があまりに多く、真も偽も見分けられず、互いに同じ。
      一方は混元（こんげん）一気の斉天大聖（せいてんたいせい）、一方は久しく千の霊力を練り、大地を縮める精。
      こちらは如意金箍棒（にょいきんこぼう）、あちらは随心鉄桿兵（ずいしんてっかんへい）。
      受け止め、遮り、勝敗はなく、支え、打ち合い、優劣もない。
      初めは洞の外で手を交え、ほどなく争いは空中へ。
    "translation_status": "reviewed"
  - "id": "xy-ch58-005"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個各踏雲光，跳鬥上九霄雲內。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 124
        "line_end": 124
    "translation_ja": "二人はそれぞれ雲の光を踏み、跳ねて戦いながら九重の空の雲の中へ上っていった。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-006"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧在傍，不敢下手。見他們戰此一場，誠然難認真假。欲待拔刀相助，又恐傷了真的。忍耐良久，且縱身跳下山崖，使降妖寶杖，打近水簾洞外，驚散群妖，掀翻石凳，把飲酒食肉的器皿盡情打碎。尋他的青氈包袱，四下裡全然不見。原來他水簾洞本是一股瀑布飛泉，遮掛洞門，遠看似一條白布簾兒，近看乃是一股水脈，故曰水簾洞。沙僧不知進步來歷，故此難尋。即便縱雲，趕到九霄雲裡，掄著寶杖，又不好下手。大聖道：「沙僧，你既助不得力，且回覆師父，說我等這般這般，等老孫與此妖打上南海落伽山菩薩前辨個真假。」道罷，那行者也如此說。沙僧見兩個相貌、聲音，更無一毫差別，皂白難分，只得依言，撥轉雲頭，回覆唐僧不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      沙悟浄はそばにいたが、手を出せなかった。この戦いを見ても、実に本物と偽物を見分けにくい。刀を抜いて加勢しようにも、本物を傷つけるのが怖かった。長いこと辛抱した末、ひとまず山の崖を跳び下り、降妖宝杖（ごうようほうじょう）を振るいながら水簾洞（すいれんどう）の外へ攻め寄せた。妖怪たちを驚かせて追い散らし、石の腰掛けをひっくり返し、酒を飲み肉を食べる器を残らず叩き割った。青い毛氈の包みを探したが、どこを見てもまるで見つからない。実は水簾洞では、一筋の滝の水が洞の入口を覆って垂れていた。遠目には白布の簾のようで、近寄れば一筋の水の流れなので、水簾洞というのである。沙悟浄は中へ入る道筋を知らなかったため、探し出せなかった。そこで雲を起こし、九重の空の雲の中まで追いかけた。宝杖を振り上げても、やはり手を出せない。
      悟空「沙悟浄、加勢できないのなら、ひとまずお師匠さまのところへ戻って、俺たちがこうしていると知らせてくれ。俺はこの妖怪と戦いながら南海の落伽山（らっかさん）へ行き、菩薩（ぼさつ）さまの前で真偽を明らかにする。」
      言い終えると、もう一人の悟空も同じことを言った。二人は姿にも声にも、ほんのわずかな違いさえない。沙悟浄には白黒の区別がつかず、言葉に従うしかなかった。雲の向きを変え、三蔵（さんぞう）へ報告に戻った。その話はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch58-007"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看那兩個行者，且行且鬥，直來到南海，徑至落伽山，打打罵罵，喊聲不絕。早驚動護法諸天，即報入潮音洞裡道：「菩薩，果然兩個孫悟空打將來也。」那菩薩與木叉行者、善財童子、龍女降蓮臺，出門喝道：「那孽畜那裡走？」這兩個遞相揪住道：「菩薩，這廝果然像弟子模樣。才自水簾洞打起，戰鬥多時，不分勝負。沙悟淨肉眼愚蒙，不能分識，有力難助，是弟子教他回西路去回覆師父。我與這廝打到寶山，借菩薩慧眼，與弟子認個真假，辨明邪正。」道罷，那行者也如此說一遍。眾諸天與菩薩都看良久，莫想能認。菩薩道：「且放了手，兩邊站下，等我再看。」果然撒手，兩邊站定。這邊說：「我是真的。」那邊說：「他是假的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      さて、二人の悟空は進みながら戦い、まっすぐ南海へ来て、落伽山へ向かった。殴り合い、罵り合い、叫び声が絶えない。早くも護法の神々が驚き、潮音洞（ちょうおんどう）へ報告した。
      護法の神々「菩薩さま、本当に二人の孫悟空（そんごくう）が戦いながらやって来ました。」
      観音菩薩は恵岸行者（えがんぎょうじゃ）、善財童子（ぜんざいどうじ）となった紅孩児（こうがいじ）、竜女（りゅうにょ）とともに蓮台（れんだい）を降り、門を出て叱りつけた。
      観音菩薩「その畜生め、どこへ行く！」
      二人は互いにつかみ合い、一方の悟空が言った。
      一方の悟空「菩薩さま、こいつは本当に私と同じ姿です。先ほど水簾洞から戦い始め、長いこと戦っても勝敗がつきません。沙悟浄の凡人の目は鈍く、見分けがつかないので、力があっても加勢できません。それで私が西への道へ帰らせ、お師匠さまに報告させたのです。私はこいつと戦いながら、このお山まで参りました。どうか菩薩さまの慧眼（えげん）で、私たちの真偽を見分け、邪と正を明らかにしてください。」
      その言葉が終わると、もう一方も同じ話を一度繰り返した。神々も観音菩薩も長いこと見つめたが、見分けがつくはずもなかった。
      観音菩薩「ひとまず手を放し、両側へ分かれて立ちなさい。もう一度見てみましょう。」
      二人は本当に手を放し、両側に立った。
      こちらの悟空「俺が本物です。」
      あちらの悟空「あいつが偽物です。」
    "translation_status": "reviewed"
  - "id": "xy-ch58-008"
    "section_id": "chapter-58"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "菩薩喚木叉與善財上前，悄悄吩咐：「你一個幫住一個，等我暗念緊箍兒咒，看那個害疼的便是真，不疼的便是假。」他二人果各幫一個。菩薩暗念真言，兩個一齊喊疼，都抱著頭，地下打滾，只叫：「莫念，莫念。」菩薩不念，他兩個又一齊揪住，照舊嚷鬥。菩薩無計奈何，即令諸天、木叉上前助力。眾神恐傷真的，亦不敢下手。菩薩叫聲「孫悟空」，兩個一齊答應。菩薩道：「你當年官拜弼馬溫，大鬧天宮時，神將皆認得你，你且上界去分辨回話。」這大聖謝恩，那行者也謝恩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      観音菩薩は恵岸行者と紅孩児を前へ呼び、そっと命じた。
      観音菩薩「一人ずつ、それぞれを支えていなさい。私がひそかに緊箍児呪（きんこじじゅ）を唱えます。痛がる方が本物、痛がらぬ方が偽物です。」
      二人は言われたとおり、一人ずつ支えた。観音菩薩がひそかに真言（しんごん）を唱えると、二人とも同時に痛いと叫び、頭を抱えて地面を転げ回った。
      二人の悟空「唱えないでください。唱えないでください。」
      観音菩薩が唱えるのをやめると、二人はまた同時につかみ合い、元どおり怒鳴って戦い始めた。観音菩薩にはどうする手立てもなく、神々と恵岸行者に進み出て加勢するよう命じた。だが神々も本物を傷つけるのが怖くて、手を出せない。
      観音菩薩「孫悟空。」
      二人は同時に返事をした。
      観音菩薩「かつて弼馬温（ひつばおん）に任じられ、天宮（てんきゅう）で大暴れした折、神将たちは皆お前を見知っています。ひとまず天界へ行って見分けてもらい、報告しなさい。」
      悟空が礼を言うと、もう一人の悟空も礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch58-009"

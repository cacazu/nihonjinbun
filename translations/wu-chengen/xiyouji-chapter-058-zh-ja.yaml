    "source_text": "八戒道：「沙僧，你既到水簾洞，看見假八戒挑著行李，怎麼不搶將來？」沙僧道：「那妖精見我使寶杖打他假沙僧，他就亂圍上來要拿，是我顧性命走了。及告菩薩，與行者復至洞口，他兩個打在空中，是我去掀翻他的石凳，打散他的小妖。只見一股瀑布泉水流，竟不知洞門開在何處，尋不著行李，所以空手回覆師命也。」八戒道：「你原來不曉得。我前年請他去時，先在洞門外相見。後被我說泛了他，他就跳下，去洞裡換衣來時，我看見他將身往水裡一鑽。那一股瀑布水流，就是洞門。想必那怪將我們包袱收在那裡面也。」三藏道：「你既知此門，你可趁他都不在，可先到他洞裡取出包袱，我們往西天去罷。他就來，我也不用他了。」八戒道：「我去。」沙僧說：「二哥，他那洞前有千數小猴，你一人恐弄他不過，反為不美。」八戒笑道：「不怕，不怕。」急出門，縱著雲霧，徑上花果山尋取行李不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      八戒「沙悟浄、水簾洞まで行って、偽の八戒が荷物を担いでいるのを見たのなら、どうして奪い返してこなかったんだ。」
      沙悟浄「私が宝杖で偽の沙悟浄を打ったのを見ると、妖怪どもが寄ってたかって私を捕らえようとしたので、命を守るために逃げたのです。菩薩さまへ訴え、悟空兄さんともう一度洞の入口へ戻ってから、二人が空中で戦っている間に、私は石の腰掛けをひっくり返し、小妖怪たちを追い散らしました。しかし、滝の水が一筋流れているばかりで、洞の入口がどこにあるのか、まるで分かりませんでした。荷物が見つからなかったので、手ぶらでお師匠さまへの報告に戻ったのです。」
      八戒「なるほど、知らなかったのか。おととし俺が迎えに行った時は、まず洞の外で会った。その後、俺の言葉で気を変えた兄貴が跳び下りて、洞で着物を替えてきたが、その時、水の中へ体を潜らせるのが見えたんだ。その一筋の滝の流れが洞の入口だ。きっとあの妖怪は、俺たちの包みをその中へしまっているんだろう。」
      三蔵「入口を知っているなら、二人ともいない今のうちに、まず洞へ行って包みを取り出してきなさい。我々は西天へ向かおう。あいつが来ても、もう使わぬ。」
      八戒「俺が行きます。」
      沙悟浄「八戒兄さん、洞の前には小猿が千ほどいます。一人では手に負えず、かえって困ったことになるかもしれません。」
      八戒は笑った。
      八戒「平気だ、平気だ。」
      急いで門を出て雲霧に乗り、まっすぐ花果山へ荷物を取りに行った。この話はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch58-017"

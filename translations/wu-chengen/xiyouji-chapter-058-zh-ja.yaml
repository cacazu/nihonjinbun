    "source_text": "眾神搪抵不住，放開天門，直至靈霄寶殿。馬元帥同張、葛、許、丘四天師奏道：「下界有一般兩個孫悟空打進天門，口稱見王。」說不了，兩個直嚷進來。諕得那玉帝即降立寶殿，問曰：「你兩個因甚事擅鬧天宮，嚷至朕前尋死？」大聖口稱：「萬歲，萬歲，臣今皈命，秉教沙門，再不敢欺心誑上。只因這個妖精變作臣的模樣， ……」如此如彼，把前情備陳了一遍，「望乞與臣辨個真假。」那行者也如此陳了一遍。玉帝即傳旨宣托塔李天王，教：「把照妖鏡來照這廝誰真誰假，教他假滅真存。」天王即取鏡照住，請玉帝同眾神觀看。鏡中乃是兩個孫悟空的影子，金箍、衣服，毫髮不差。玉帝亦辨不出，趕出殿外。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      神々は食い止められず、天門を開いた。二人はまっすぐ霊霄宝殿（れいしょうほうでん）へ来た。馬元帥（ばげんすい）と、張・葛・許・丘（ちょう・かつ・きょ・きゅう）の四天師（してんし）が奏上した。
      馬元帥と四天師「下界から、まったく同じ二人の孫悟空が、戦いながら天門へ乱入し、陛下にお目にかかると申しております。」
      言い終わらぬうちに、二人は怒鳴りながら入ってきた。驚いた玉帝はすぐに降りて宝殿に立ち、尋ねた。
      玉帝「お前たちは何事で勝手に天宮を騒がせ、朕の前まで怒鳴り込んで来たのだ。死にたいのか。」
      悟空「万歳、万歳。臣は今や仏に帰依し、仏門の教えを奉じております。二度と心を偽り、陛下を欺いたりはいたしません。ただこの妖怪が臣の姿に化けまして……」
      悟空は、ああだこうだとそれまでの事情をすべて述べた。
      悟空「どうか臣のために、真偽をお見分けくださいますよう。」
      もう一人の悟空も、同じ事情を一度述べた。玉帝はただちに命を下し、托塔李天王（たくとうりてんのう）を呼び出した。
      玉帝「照妖鏡（しょうようきょう）を持ってきて、この者どものどちらが本物か偽物かを映せ。偽物を滅ぼし、本物を残すのだ。」
      李天王（りてんのう）はすぐに鏡を取り、二人を映して、玉帝と神々に見るよう願った。鏡の中には二人の孫悟空の姿があり、頭の輪も着物も、毛一本ほどの違いもなかった。玉帝にも見分けられず、殿の外へ追い出した。
    "translation_status": "reviewed"

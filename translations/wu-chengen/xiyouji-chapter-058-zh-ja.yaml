    "source_languages": []
    "source_locations": []
    "translation_ja": "「不有中有」から「始達妙音」までの全十八句を、対句の順序で訳した。前半の十六句では有・無・色・空の関係を繰り返し反転させる。仏教語を用いた作中の説法として扱い、特定の経典からの正確な引用だとは確認していない。中・為・不のかかり方には解釈の余地があり、訳では固定した有無・色空への執着を離れる文脈で読んだ。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-14-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここでの悟空の訴えは原文「二次打傷幾人」であり、先の「打死」という説明を理由に「二度殺した」へ統一していない。人物が語る説明の違いを保ち、語り手の確認した事実へ置き換えない。仏前の長い訴えは直前の二人を受け、後で双方が同じ話を述べたと明示されるため、最初の話者を「一方の悟空」とした。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-15-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "四種の猿の能力の列挙と、その後の偽の悟空の同定を順番どおり保った。霊明石猴を悟空の別名とする断定、赤尻馬猴を以前の猿集団とする同定、通臂猿猴を第一回の長腕の猿とする同定、六耳獼猴を過去の獼猴王とする同定は、この本文の名の類似だけでは加えない。「不達兩間之名」は天地二界の名簿にも名がない意に解したが、原文に「簿」の字はなく解釈上の補いである。この注は同定の結論より後を起点にし、四種の最初の言及から答えを先取りさせない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-16-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空は財物の強奪と傷害を挙げ、律に照らして斬罪だと自分の行為を正当化する。その発言として訳したもので、訳者による法的評価ではない。如来の「不忍」と、すでに起きた殴殺、語り手の種の断絶の記述も省かなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-17-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「元明」を別字に直さず、もとの霊明な本性を指すものと解した。「神」「心舍」「禪」「六識」「丹」は仏教と内丹の語を重ねる結句。六耳と六識の対応などは解釈としてあり得ても、この訳で説明を付け足していない。"
    "translation_status": "reviewed"

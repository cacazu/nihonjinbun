  "known_gaps":
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-002"
      "description_ja": "原文「朔腮別土星」。漢典「朔」は本回を引いて凹むの意味を示す。「土星」は古い人相書で鼻を指す用語として現れるため、ここでは「別」を曲がる意に解した。語句全体の確実な注解は未確認で、この解釈には留保がある。土星という星神との比較だとはしない。原字は保存した。参照：https://zdic.net/hant/朔 、https://www.zdic.net/hans/别 、https://www.luckclub.cn/renxiang/005/046/ 。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-006"
      "description_ja": "同じ原文段落が初めに「刀を抜いて」と述べ、続いて「降妖宝杖」を振るうとする。原文の武器表現の揺れを保存し、訳者が一律に杖へ訂正しなかった。実際に二種類の武器を持ち替えたと断定するものでもない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-007"
      "description_ja": "この段落の長い第一の訴えは「這兩個遞相揪住道」の後にあり、直後にもう一方も繰り返すと記されるため、最初は「一方の悟空」とした。末尾の「這邊／那邊」も位置しか示さないので、「こちら／あちら」とし、誰がどちらかを断定しない。二人の発言内容から個体を識別しない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-012"
        - "xy-ch58-015"
      "description_ja": "南海・天界・師のもとを巡る二人の戦いと、沙悟浄の三昼夜の帰路が交差して語られる。前回の四日間という証言、各場面の所要時間を訳者が換算して整合させてはいない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-016"
      "description_ja": "原文は「前年」。ここでは字面どおり「おととし」とした。以前に悟空を迎えに行った出来事からの年数を、他の回の旅程に合わせて訂正していない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-017"
      "description_ja": "十王の殿の順序、卞城王・平等王・都市王・忤官王などの字を底本どおり保存した。他の回や一般的な十王の順序へ無断で並べ替えない。「楚江王」は初江王の異表記として辞典に見えるが、本回の楚の字を残す。参照：https://www.zhongwen.cn/cidian/chujiangwang/ 。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-018"
      "description_ja": "原文は猿の記載を「一百三十條」とし、悟空が名を一筆で消してから猿の仲間はすべて名がないと語る。他の回の帳簿の数や記載と照合して改変せず、この回の叙述をそのまま訳した。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-019"
      "description_ja": "蠃・鱗・毛・羽・昆は古い生類の区分、天・地・神・人・鬼はこの作品の五仙の区分である。「虫」をすべて現代日本語の虫へ狭めない。五虫の最後は底本の「昆」を保持し、一般の説明に見える「介」「甲」へ訂正しない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-019"
      "description_ja": "末尾の「謝了地藏，回上翠雲宮」は主語が省略されている。訳文は先行する十王の行為としてつなげたが、翠雲宮は地蔵王菩薩の宮であり、帰還の主体には構文上の留保がある。地蔵が戻ると明記された原文へ無断で修正していない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-021"
      "description_ja": "この詩は禅の無心と、嬰児を養い聖胎を結ぶ内丹の語を重ねる。母体の妊娠の描写ではなく、修行の象徴として訳した。特定人物一人へすべての比喩を割り当てる解釈は本文へ追加していない。参照：https://zh.daoinfo.org/index.php?mobileaction=toggle_view_desktop&title=真胎&variant=zh-hant 。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-023"
      "description_ja": "「不有中有」から「始達妙音」までの全十八句を、対句の順序で訳した。前半の十六句では有・無・色・空の関係を繰り返し反転させる。仏教語を用いた作中の説法として扱い、特定の経典からの正確な引用だとは確認していない。中・為・不のかかり方には解釈の余地があり、訳では固定した有無・色空への執着を離れる文脈で読んだ。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-025"
      "description_ja": "ここでの悟空の訴えは原文「二次打傷幾人」であり、先の「打死」という説明を理由に「二度殺した」へ統一していない。人物が語る説明の違いを保ち、語り手の確認した事実へ置き換えない。仏前の長い訴えは直前の二人を受け、後で双方が同じ話を述べたと明示されるため、最初の話者を「一方の悟空」とした。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-026"
      "description_ja": "四種の猿の能力の列挙と、その後の偽の悟空の同定を順番どおり保った。霊明石猴を悟空の別名とする断定、赤尻馬猴を以前の猿集団とする同定、通臂猿猴を第一回の長腕の猿とする同定、六耳獼猴を過去の獼猴王とする同定は、この本文の名の類似だけでは加えない。「不達兩間之名」は天地二界の名簿にも名がない意に解したが、原文に「簿」の字はなく解釈上の補いである。この注は同定の結論より後を起点にし、四種の最初の言及から答えを先取りさせない。 本文の欠落ではなく解釈・底本表記に関する留保。"
    - "source_id": "xy-ch58-primary-1455607"
      "segment_ids":
        - "xy-ch58-030"
      "description_ja": "原文の「元明」を別字に直さず、もとの霊明な本性を指すものと解した。「神」「心舍」「禪」「六識」「丹」は仏教と内丹の語を重ねる結句。六耳と六識の対応などは解釈としてあり得ても、この訳で説明を付け足していない。 本文の欠落ではなく解釈・底本表記に関する留保。"

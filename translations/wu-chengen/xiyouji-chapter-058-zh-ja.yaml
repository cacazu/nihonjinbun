    "translation_ja": "原文は猿の記載を「一百三十條」とし、悟空が名を一筆で消してから猿の仲間はすべて名がないと語る。他の回の帳簿の数や記載と照合して改変せず、この回の叙述をそのまま訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-10-body"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那沙僧自花果山辭他兩個，又行了三晝夜，回至本莊，把前事對唐僧說了一遍。唐僧自家悔恨道：「當時只說是孫悟空打我一棍，搶去包袱，豈知卻是妖精假變的行者。」沙僧又告道：「這妖又假變一個長老，一匹白馬；又有一個八戒挑著我們包袱，又有一個變作是我。我忍不住惱怒，一杖打死，原是一個猴精。因此驚散，又到菩薩處訴苦。菩薩著我與師兄又同去識認，那妖果與師兄一般模樣。我難助力，故先來回覆師父。」三藏聞言，大驚失色。八戒哈哈大笑道：「好好好，應了這施主家婆婆之言了：他說有幾起取經的，這卻不又是一起？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      さて、沙悟浄は花果山で二人と別れてから、また三昼夜旅をして、もとの村の家に戻った。そしてそれまでの出来事を三蔵へ一通り話した。三蔵はひとり悔やんで言った。
      三蔵「あの時は、孫悟空に棒で一度打たれ、荷物を奪われたとばかり思っていた。妖怪が悟空に化けていたとは、知るよしもなかった。」
      沙悟浄はさらに告げた。
      沙悟浄「あの妖怪は、さらに偽の長老一人と白馬一頭の姿まで作り出し、さらに八戒（はっかい）の姿をした者に私たちの荷物を担がせ、私に化けた者まで置いていました。私は怒りを抑えきれず、その偽物を杖の一撃で殺しました。正体は猿の妖怪でした。そのため騒ぎになって逃れ、また菩薩さまのもとへ訴えに行ったのです。菩薩さまは私と兄さんに、もう一度一緒に行って見分けるよう命じました。するとあの妖怪は、本当に兄さんとまったく同じ姿でした。加勢しようにもできないので、先にお師匠さまへご報告に戻りました。」
      三蔵は聞いて大いに驚き、顔色を変えた。八戒は、はははと大笑いした。
      八戒「いや、いや、いや。ここのおばあさんの言ったとおりになったな。経を取りに行く者が何組いるんだって言っていたが、これでまた一組増えたわけだ！」
    "translation_status": "reviewed"
  - "id": "xy-ch58-013"
    "section_id": "chapter-58"

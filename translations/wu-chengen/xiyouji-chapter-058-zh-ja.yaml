    "origin": "source"
    "source_text": "二人扯扯拉拉，口裡不住的嚷鬥，徑至南天門外。慌得那廣目天王帥馬、趙、溫、關四大天將，及把門大小眾神，各使兵器擋住道：「那裡走？此間可是爭鬥之處？」大聖道：「我因保護唐僧往西天取經，在路上打殺賊徒，那三藏趕我回去，我徑到普陀崖見觀音菩薩訴苦。不想這妖精幾時就變作我的模樣，打倒唐僧，搶去包袱。有沙僧至花果山尋討，只見這妖精占了我的巢穴。後到普陀崖告請菩薩，又見我侍立臺下，沙僧誑說是我駕觔斗雲，又先在菩薩處遮飾。菩薩卻是個正明，不聽沙僧之言，命我同他到花果山看驗。原來這妖精果像老孫模樣，才自水簾洞打到落伽山見菩薩，菩薩也難識認。故打至此間，煩諸天眼力，與我認個真假。」道罷，那行者也似這般這般說了一遍。眾天神看夠多時，也不能辨。他兩個吆喝道：「你們既不能認，讓開路，等我們去見玉帝！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "xy-ch58-primary-1455607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第058回&oldid=1455607"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      二人は引っ張り合い、引きずり合い、口では絶えず怒鳴って争いながら、まっすぐ南天門（なんてんもん）の外へ来た。驚いた広目天王（こうもくてんのう）は、馬（ば）・趙（ちょう）・温（おん）・関（かん）の四大天将と、門を守る大小の神々を率い、各々武器を振るって行く手を遮った。
      門の神々「どこへ行く！　ここを争いの場だと思っているのか！」
      悟空「私は唐の僧を守って西天（さいてん）へ経を取りに行く途中、賊どもを打ち殺しました。それで三蔵に追い返され、まっすぐ普陀崖（ふだがい）へ行き、観音菩薩さまに会って苦しい胸の内を訴えたのです。ところが、いつの間にかこの妖怪が私の姿に化け、三蔵を打ち倒して荷物を奪っていました。沙悟浄が花果山へ取り戻しに行くと、この妖怪が私のすみかを占領していた。次に普陀崖へ行って菩薩さまに訴えると、私が蓮台の下に仕えて立っているのを見つけ、觔斗雲で先回りして菩薩さまのところでごまかしているのだと、でたらめを言いました。菩薩さまは確かな証人なので、沙悟浄の言葉をお聞きにならず、私に沙悟浄と花果山へ行って確かめるよう命じました。すると本当に、この妖怪が私そっくりだったのです。それで水簾洞から戦って落伽山へ行き、菩薩さまにお目にかかりましたが、菩薩さまも見分けられません。そこでここまで戦ってきたのです。どうか皆さまのお眼力で、私たちの真偽をお見分けください。」
      言い終えると、もう一人の悟空も、やはりこれこれこうだと同じ話を一度述べた。天の神々はたっぷり時間をかけて見たが、それでも見分けられなかった。
      二人の悟空「お前たちに見分けられないなら、道を開けろ。玉帝（ぎょくてい）に会いに行く！」
    "translation_status": "reviewed"

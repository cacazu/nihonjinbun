    "translation_ja": "原文「朔腮別土星」。漢典「朔」は本回を引いて凹むの意味を示す。「土星」は古い人相書で鼻を指す用語として現れるため、ここでは「別」を曲がる意に解した。語句全体の確実な注解は未確認で、この解釈には留保がある。土星という星神との比較だとはしない。原字は保存した。参照：https://zdic.net/hant/朔 、https://www.zdic.net/hans/别 、https://www.luckclub.cn/renxiang/005/046/ 。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-02-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "詩は二人を「真猴／假怪」と対置し、棒にも別の呼称を与える。この原典自身の叙述は保つが、この時点でまだ明かされていない相手の種族・真の名までは補わない。「千靈」は多くの霊力、「縮地」は大地を縮める神通と解して訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-03-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "同じ原文段落が初めに「刀を抜いて」と述べ、続いて「降妖宝杖」を振るうとする。原文の武器表現の揺れを保存し、訳者が一律に杖へ訂正しなかった。実際に二種類の武器を持ち替えたと断定するものでもない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-04-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この段落の長い第一の訴えは「這兩個遞相揪住道」の後にあり、直後にもう一方も繰り返すと記されるため、最初は「一方の悟空」とした。末尾の「這邊／那邊」も位置しか示さないので、「こちら／あちら」とし、誰がどちらかを断定しない。二人の発言内容から個体を識別しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-05-body"
    "section_id": "chapter-58"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで奏上する馬元帥は、直前の南天門の神将から続く役割に従って読む。花果山の四健将の一人である馬元帥とは別の項目で扱う。四天師の姓「張・葛・許・丘」も、同姓の天兵・雷神などへ割り振らない。"
    "translation_status": "reviewed"
  - "id": "xy-ch58-note-06-body"

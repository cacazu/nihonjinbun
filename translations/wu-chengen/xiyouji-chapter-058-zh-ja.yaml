    "translation_ja": |-
      悟空はふふんと冷ややかに笑い、もう一人の悟空も、はははと喜んだ。頭をつかみ、首を押さえ、また戦いながら天門を出て、西へ行く道へ降りてきた。
      二人の悟空「俺とお前でお師匠さまに会いに行くぞ。俺とお前でお師匠さまに会いに行くぞ。」

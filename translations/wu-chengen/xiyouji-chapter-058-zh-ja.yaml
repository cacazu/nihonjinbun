    "translation_ja": "蠃・鱗・毛・羽・昆は古い生類の区分、天・地・神・人・鬼はこの作品の五仙の区分である。「虫」をすべて現代日本語の虫へ狭めない。五虫の最後は底本の「昆」を保持し、一般の説明に見える「介」「甲」へ訂正しない。"

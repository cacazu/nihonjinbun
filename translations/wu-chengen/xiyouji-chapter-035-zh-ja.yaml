  "origin": "source"
  "source_text": "他就按落雲頭，拿著葫蘆，心心念念，只是要救師父，又往蓮花洞口而來。那山上都是些窪踏不平之路，況他又是個圈盤腿，拐呀拐的走著，搖的那葫蘆裡漷漷索索，響聲不絕。你道他怎麼便有響聲？原來孫大聖是熬煉過的身體，急切化他不得；那怪雖也能騰雲駕霧，不過是些法術，大端是凡胎未脫，到於寶貝裡就化了。行者還不當他就化了，笑道：「我兒子啊，不知是撒尿耶，不知是漱口哩？這是老孫幹過的買賣。不等到七八日，化成稀汁，我也不揭蓋來看。忙怎的？有甚要緊？想著我出來的容易，就該千年不看才好。」他拿著葫蘆，說著話，不覺的到了洞口，把那葫蘆搖搖，一發響了。他道：「這個像發課的筩子響，倒好發課。等老孫發一課，看師父甚麼時才得出門。」你看他手裡不住的搖，口裡不住的念道：「周易文王、孔子聖人、桃花女先生、鬼谷子先生。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    悟空は雲から下り、瓢箪を手に、ただ師を救いたい一心で、また蓮花洞（れんげどう）の入り口へ向かった。山道はどこも窪みだらけのでこぼこで、しかも悟空はがに股である。ひょこひょこ歩くたびに瓢箪が揺れ、中でざぶざぶ、しゃらしゃらと、音がやまなかった。なぜ音がしたのか、とお思いだろう。悟空は鍛え練り上げられた身体だから、すぐには溶かせない。しかし銀角大王は、雲や霧に乗ることができても、それは術にすぎず、根本のところではまだ凡身を脱していなかった。宝の中へ入ったとたんに、溶けてしまったのである。悟空はまだ溶けたとは思わず、笑って言った。
    悟空「せがれよ、小便をしているのか、それともうがいか？　それは俺もやった手だぞ。七日か八日たって薄い汁になるまで、蓋を開けて見るものか。何を急ぐ？　何がそんなに大事なんだ？　俺があれほどたやすく出てきたことを思えば、千年は見ないでおくのがよさそうだ。」
    瓢箪を持ち、そう言いながら歩くうちに、いつしか洞の入り口に着いた。瓢箪を振ってみると、いっそう音が鳴った。
    悟空「これは占いの筒を振る音に似ているな。占いにはちょうどいい。俺が一卦立てて、お師匠さまがいつ門を出られるか、見てみよう。」
    ご覧なさい。手で絶えず振りながら、悟空は口でも絶えず唱えていた。
    悟空「周易（しゅうえき）の文王（ぶんおう）、聖人孔子（こうし）、桃花女（とうかじょ）先生、鬼谷子（きこくし）先生。」

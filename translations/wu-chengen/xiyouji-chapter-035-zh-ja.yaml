  "translation_ja": |-
    それを見た銀角大王は、驚いて言った。
    銀角大王「あいつの瓢箪はどこから来た？　なぜ俺のものと同じなのだ？　同じ蔓になったものでも、大きさや傾きには違いがあるはずだ。どうしてまるきり同じなのだ？」
    そして真顔で呼びかけた。
    銀角大王「行者孫、お前の瓢箪はどこから来た？」
    悟空は本当にその由来を知らなかったので、すぐに相手の言葉を受けて問い返した。
    悟空「お前の瓢箪はどこから来たんだ？」
    銀角大王はそれが一計だとは気づかず、ただ正直に尋ねたものと思い、由来を初めから話した。
    銀角大王「この瓢箪は、混沌（こんとん）が初めて分かれ、天地が開けたころのものだ。太上老祖（たいじょうろうそ）という方が、女媧（じょか）という名で姿を現し、石を練って天を補い、閻浮世界（えんぶせかい）をあまねく救われた。乾宮（けんきゅう）の欠けたところを補っていたとき、崑崙山（こんろんざん）のふもとに仙界の蔓が一本あるのをご覧になった。その蔓になっていたのが、この紫金紅葫蘆（しきんべにひさご）だ。老君（ろうくん）が残され、今に伝わったものなのだ。」
    それを聞いた悟空は、相手の話に乗じた。
    悟空「俺の瓢箪も、そこで取れたものさ。」
    銀角大王「どうしてそう言える？」
    悟空「清らかなものと濁ったものとが初めて分かれたとき、天は西北が欠け、地は東南が欠けていた。太上道祖（たいじょうどうそ）が女媧となって天の欠けたところを補い終え、崑崙山のふもとへ行くと、仙界の蔓が一本あって、二つの瓢箪がなっていたんだ。俺がもらったのは雄で、お前のは雌さ。」
    銀角大王「雄か雌かはどうでもよい。人を吸い込めれば、立派な宝だ。」
    悟空「もっともだ。では、先に吸い込ませてやろう。」

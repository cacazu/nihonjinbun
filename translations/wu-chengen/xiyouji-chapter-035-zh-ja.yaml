  "kind": "paragraph"
  "origin": "source"
  "source_text": "那洞裡小妖看見道：「大王，禍事了，行者孫把二大王爺爺裝在葫蘆裡發課哩。」那老魔聞得此言，諕得魂飛魄散，骨軟觔麻，撲的跌倒在地，放聲大哭道：「賢弟呀！我和你私離上界，轉託塵凡，指望同享榮華，永為山洞之主。怎知為這和尚，傷了你的性命，斷吾手足之情。」滿洞群妖，一齊痛哭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    洞の中の小妖がそれを見つけて言った。
    小妖「大王、大変でございます。行者孫が二の大王さまを瓢箪に入れ、それで占いをしております！」
    金角大王はそれを聞くと、魂が抜けるほど驚き、骨も筋もなえて、どさりと地面へ倒れた。そして声を上げて泣いた。
    金角大王「弟よ！　お前と私はひそかに上界を抜け出し、人の世へ身を移した。ともに栄華を楽しみ、いつまでもこの山の洞の主であろうと願っていたのに。あの和尚のためにお前の命が失われ、手足のように結ばれた兄弟の情が断たれようとは！」
    洞じゅうの妖怪が、そろって激しく泣いた。

- "id": "xy-ch35-008"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔見了，大驚道：「他葫蘆是那裡來的？怎麼就與我的一般？縱是一根藤上結的，也有個大小不同，偏正不一，卻怎麼一般無二？」他便正色叫道：「行者孫，你那葫蘆是那裡來的？」行者委的不知來歷，接過口來，就問他一句道：「你那葫蘆是那裡來的？」那魔不知是個見識，只道是句老實言語，就將根本從頭說出道：「我這葫蘆是混沌初分，天開地闢，有一位太上老祖，解化女媧之名，煉石補天，普救閻浮世界。補到乾宮缺地，見一座崑崙山腳下，有一縷仙藤，上結著這個紫金紅葫蘆，卻便是老君留下到如今。」大聖聞言，就綽了他口氣道：「我的葫蘆，也是那裡來的。」魔頭道：「怎見得？」大聖道：「自清濁初開，天不滿西北，地不滿東南，太上道祖解化女媧，補完天缺，行至崑崙山下，有根仙藤，藤結有兩個葫蘆。我得一個是雄的，你那個卻是雌的。」那怪道：「莫說雌雄，但只裝得人的，就是好寶貝。」大聖道：「你也說得是，我就讓你先裝。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

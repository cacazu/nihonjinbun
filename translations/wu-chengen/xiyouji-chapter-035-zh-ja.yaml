  "origin": "source"
  "source_text": "正嚷處，只見前門外一個小妖報道：「行者孫又罵上門來了。」那老魔又大驚道：「這廝輕我無人。」叫：「小的們，且把豬八戒照舊吊起，查一查還有幾件寶貝。」管家的小妖道：「洞中還有三件寶貝哩。」老魔問：「是那三件？」管家的道：「還有七星劍、芭蕉扇與淨瓶。」老魔道：「那瓶子不中用：原是叫人，人應了就裝得，轉把個口訣兒教了那孫行者，倒把自家兄弟裝去了。不用他，放在家裡。快將劍與扇子拿來。」那管家的即將兩件寶貝獻與老魔。老魔將芭蕉扇插在後項衣領，把七星劍提在手中，又點起大小群妖有三百多名，都教一個個拈槍弄棒，理索掄刀。這老魔卻頂盔貫甲，罩一領赤焰焰的絲袍。群妖擺出陣去，要拿孫大聖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    こうして騒いでいるところへ、表門の小妖が知らせに来た。
    小妖「行者孫が、また門まで来て罵っております。」
    金角大王はまた驚いた。
    金角大王「あいつめ、私に戦う者がいないと侮っているな！」
    そして命じた。
    金角大王「お前たち、猪八戒は元のとおり吊るしておけ。宝があといくつあるか調べろ。」
    管理役の小妖「洞には、あと三つの宝がございます。」
    金角大王「どの三つだ？」
    管理役の小妖「七星剣（しちせいけん）、芭蕉扇（ばしょうせん）、それに浄瓶（じょうへい）でございます。」
    金角大王「あの瓶は役に立たぬ。もとは人を呼び、返事をすれば吸い込めるものだったのに、孫行者に秘訣を教えることになって、逆に自分の弟を吸い込まれてしまった。使わぬ。家に置いておけ。早く剣と扇を持ってこい。」
    管理役は二つの宝を差し出した。金角大王は芭蕉扇を首の後ろの襟へ差し込み、七星剣を手に取り、大小の妖怪を三百人あまり集めた。各々に槍や棒を持たせ、縄を整え、刀を振るわせる。自分も兜と鎧を着け、燃えるように赤い絹の上衣をまとった。妖怪たちは陣を組んで出ていき、悟空を捕らえようとした。
  "translation_status": "draft"
- "id": "xy-ch35-014"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那孫大聖早已知二魔化在葫蘆裡面，卻將他緊緊拴扣停當，撒在腰間，手持著金箍棒，準備廝殺。只見那老妖紅旗招展，跳出門來。卻怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 149
    "line_end": 149
  "translation_ja": "悟空は、銀角大王が瓢箪の中で溶けてしまったことを、もう知っていた。そこで瓢箪をしっかり縛って留め、腰へぶら下げ、金箍棒（きんこぼう）を握って戦いに備えた。すると金角大王が赤い旗をひらめかせ、門から跳び出してきた。そのいでたちは、どのようなものだったか。"
  "translation_status": "draft"
- "id": "xy-ch35-015"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭上盔纓光燄燄，腰間帶束彩霞鮮。
    身穿鎧甲龍鱗砌，上罩紅袍烈火然。
    圓眼睜開光掣電，鋼鬚飄起亂飛煙。
    七星寶劍輕提手，芭蕉扇子半遮肩。
    行似流雲離海岳，聲如霹靂震山川。
    威風凜凜欺天將，怒帥群妖出洞前。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 151
    "line_end": 156
  "translation_ja": |-
    頭の兜の房は、光を放ってきらめき、腰に締めた帯は、鮮やかな彩雲のよう。
    身の鎧には竜の鱗のごとく札が並び、その上の赤い上衣は烈火のように燃える。
    丸い目を見開けば稲妻の光、鋼のようなひげがなびけば乱れ飛ぶ煙。
    七星剣を軽々と手に提げ、芭蕉扇は肩を半ば覆う。
    行く姿は海山を離れる流雲のよう、声は山川を震わせる雷鳴のよう。
    天の将をも圧する威風堂々たる姿で、怒りに燃え、妖怪たちを率いて洞の前へ出る。
  "translation_status": "draft"
- "id": "xy-ch35-016"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老魔急令小妖擺開陣勢，罵道：「你這猴子，十分無禮。害我兄弟，傷我手足，著然可恨！」行者罵道：「你這討死的怪物，你一個妖精的性命捨不得。似我師父、師弟，連馬四個生靈，平白的吊在洞裡，我心何忍？情理何甘？快快的送將出來還我，多多貼些盤費，喜喜歡歡打發老孫起身，還饒了你這個老妖的狗命。」那怪那容分說，舉寶劍劈頭就砍；這大聖使鐵棒舉手相迎。這一場在洞門外好殺。咦！"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    金角大王はすぐに小妖たちへ陣を敷かせ、罵った。
    金角大王「この猿め、なんと無礼な！　私の弟を害し、手足も同然の者を傷つけた。まことに憎いやつだ！」
    悟空も罵り返した。
    悟空「この死にたがりの化け物め。お前は妖怪一人の命が惜しいのか。俺の師匠と弟弟子、それに馬まで、四つの命が、何のいわれもなく洞で吊るされているんだぞ。俺の心が耐えられるか？　情理の上でも納得できるか？　さっさと送り出して俺に返せ。旅費をたっぷりつけて、気持ちよく俺を出発させれば、お前のような年食った妖怪の犬の命でも、助けてやろう。」
    金角大王は言い分を聞く余地も与えず、宝剣を上げ、頭めがけて斬りつけた。悟空は鉄棒を振り上げて迎え撃つ。洞の門前で、激しい戦いが始まった。ああ！
  "translation_status": "draft"
- "id": "xy-ch35-017"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": "金箍棒與七星劍，對撞霞光如閃電。悠悠冷氣逼人寒，蕩蕩昏雲遮嶺堰。那個皆因手足情，些兒不放善；這個只為取經僧，毫釐不容緩。兩家各恨一般仇，二處每懷生怒怨。只殺得天昏地暗鬼神驚，日淡煙濃龍虎戰。這個咬牙剉玉釘，那個怒目飛金焰。一來一往逞英雄，不住翻騰棒與劍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    金箍棒と七星剣がぶつかれば、霞の光が稲妻のように走る。
    ひたひたと冷気が迫って人を凍えさせ、広がる暗雲は峰と土手を覆う。
    あちらはひとえに兄弟の情ゆえ、少しも手心を加えず、
    こちらはただ経を求める僧のため、ほんのわずかも緩めない。
    双方は同じほどの仇を憎み、どちらも胸に怒りと恨みを抱く。
    戦いは天地を暗ませて鬼神（きしん）を驚かせ、日もかすみ、煙も濃い中、竜虎が争う。
    こちらが歯を食いしばれば玉の釘を擦るよう、あちらが目を怒らせれば金色の炎が飛ぶ。
    行きつ戻りつ勇を競い、棒と剣は絶えず翻る。
  "translation_status": "draft"
- "id": "xy-ch35-018"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這老魔與大聖戰經二十回合，不分勝負。他把那劍梢一指，叫聲：「小妖齊來。」那三百餘精一齊擁上，把行者圍在垓心。好大聖，公然無懼，使一條棒，左衝右撞，後抵前遮。那小妖都有手段，越打越上，一似綿絮纏身，摟腰扯腿，莫肯退後。大聖慌了，即使個身外身法，將左脅下毫毛拔了一把，嚼碎噴去，喝聲叫：「變！」一根根都變做行者。你看他長的使棒，短的掄拳，再小的沒處下手，抱著孤拐啃觔，把那小妖都打得星落雲散，齊聲喊道：「大王啊，事不諧矣，難矣乎哉！滿地盈山，皆是孫行者了。」被這身外法把群妖打退，止撇得老魔圍困中間，趕得東奔西走，出路無門。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    金角大王と悟空は二十合戦ったが、勝負がつかなかった。金角大王は剣先を差し向けて叫んだ。
    金角大王「小妖ども、一斉にかかれ！」
    三百あまりの妖怪がどっと押し寄せ、悟空を真ん中に取り囲んだ。さすがの悟空、少しも恐れず、一本の棒を使い、左へ突き、右へぶつかり、後ろを防ぎ、前を遮る。だが、小妖たちもそれぞれ腕があり、打たれるほど前へ出て、綿がまといつくように腰へ抱きつき、足を引っ張って、誰一人退かない。悟空は慌てて身外身法（しんがいしんほう）を使い、左脇の毛をひとつかみ抜いて、噛み砕いて吹き出し、一喝した。
    悟空「変われ！」
    毛の一本一本が、みな悟空の姿になった。ご覧なさい。大きいのは棒を振り、小さいのは拳を振るい、もっと小さくて手を出す場所のないものは、足首に抱きついて筋へ噛みつく。小妖たちは、星が散り雲が吹き払われるように、さんざんに打ち散らされ、一斉に叫んだ。
    妖兵たち「大王、もう駄目です、とてもかないません！　地べたも山じゅうも、みんな孫行者だらけです！」
    この分身の術に妖怪たちは撃退され、金角大王だけが真ん中へ取り残された。東へ西へと追い立てられ、逃げ出す道もなかった。
  "translation_status": "draft"
- "id": "xy-ch35-019"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔慌了，將左手擎著寶劍，右手伸於項後，取出芭蕉扇子，望東南丙丁火，正對離宮，唿喇的一扇子搧將下來只見那就地上，火光焰焰。原來這般寶貝，平白地搧出火來。那怪物著實無情，一連搧了七八扇子，熯天熾地，烈火飛騰。好火："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 162
    "line_end": 162
  "translation_ja": "金角大王は慌て、左手で宝剣を構え、右手を首の後ろへ伸ばして芭蕉扇を引き抜いた。東南の丙丁（へいてい）の火の方、まっすぐ離宮（りきゅう）に向け、ぶわっと一あおぎすると、地面に炎が燃え立った。この宝は、何もないところから火をあおぎ出すものだったのである。金角大王はまったく容赦せず、七、八回続けてあおいだ。天も地も焼けるばかり、烈火が舞い上がった。すさまじい火である。"
  "translation_status": "draft"
- "id": "xy-ch35-020"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": "那火不是天上火，不是爐中火，也不是山頭火，也不是灶底火，乃是五行中自然取出的一點靈光火。這扇也不是凡間常有之物，也不是人工造就之物，乃是自開闢混沌以來產成的真寶之物。用此扇，搧此火，煌煌燁燁，就如電掣紅綃；灼灼輝輝，卻似霞飛絳綺。更無一縷青煙，盡是滿山赤焰。只燒得嶺上松翻成火樹，崖前柏變作燈籠。那窩中走獸貪性命，西撞東奔；這林內飛禽惜羽毛，高飛遠舉。這場神火飄空燎，只燒得石爛溪乾遍地紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    その火は、天上の火でもなければ、炉の火でもなく、山に燃える火でも、かまどの下の火でもない。
    五行（ごぎょう）のうちから、おのずと取り出された、一点の霊妙な光の火なのだ。
    この扇もまた、俗世によくある物ではなく、人の手で作った物でもない。
    混沌が開けて以来、この世に生じた真の宝である。
    この扇でこの火をあおげば、きらきらと輝いて、赤い薄絹に稲妻が走るよう。
    灼けつく光がきらめけば、深紅の綾絹に霞が飛ぶよう。
    青い煙は一筋もなく、山を埋めるのは赤い炎ばかり。
    峰の松は火の木となり、崖の前の柏は灯籠となる。
    巣穴の獣は命が惜しくて、西へ突進し、東へ駆け、
    林の鳥は羽を惜しんで、高く飛び、遠くへ去る。
    神火は空に舞って焼き尽くし、岩は崩れ、谷川は干上がり、一面が赤く染まった。
  "translation_status": "draft"
- "id": "xy-ch35-021"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖見此惡火，卻也心驚膽顫，道聲：「不好了，我本身可處，毫毛不濟，一落這火中，豈不真如燎毛之易？」將身一抖，遂將毫毛收上身來。只將一根變作假身子，避火逃災。他的真身，捻著避火訣，縱觔斗，跳將起去，脫離了大火之中，徑奔他蓮花洞裡，想著要救師父。急到門前，把雲頭按落，又見那洞門外有百十個小妖，都破頭折腳，肉綻皮開。原來都是他分身法打傷了的，都在這裡聲聲喚喚，忍疼而立。大聖見了，按不住惡性兇頑，掄起鐵棒，一路打將進去。可憐把那苦煉人身的功果息，依然是塊舊皮毛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    悟空はこの恐ろしい火を見ると、さすがに肝を冷やした。
    悟空「まずいぞ。俺の本体は持ちこたえられるが、毛のほうはいけない。この火に落ちれば、まさに毛を焼くように簡単に燃えてしまうではないか。」
    身震いして毛を身体へ戻し、一本だけを偽物の身体に変えて、火を避け、災いを逃れさせた。本体は避火訣（ひかけつ）の印を結び、筋斗を切って跳び上がると、炎の中を抜け出した。そして師を助けようと、一目散に蓮花洞へ向かった。急いで門へ着き、雲から下りると、洞の外には、頭を割られ、足を折られ、皮も肉も裂けた小妖が百人ほどいた。皆、悟空の分身に打ち傷を負わされた者で、ここでうめき、痛みをこらえて立っていたのである。悟空はそれを見ると、荒々しく凶暴な気性を抑えきれず、鉄棒を振り回し、道すがら打ち殺しながら入っていった。哀れにも、人の姿になろうと苦労して修行した功徳（くどく）は消え失せ、また元どおりの毛皮に戻ってしまった。
  "translation_status": "draft"
- "id": "xy-ch35-022"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖打絕了小妖，撞入洞裡，要解師父。又見那內面有火光焰焰，諕得他手慌腳忙道：「罷了，罷了，這火從後門口燒起來，老孫卻難救師父也。」正悚懼處，仔細看時，呀！原來不是火光，卻是一道金光。他正了性，往裡視之，乃羊脂玉淨瓶放光，卻自心中歡喜道：「好寶貝耶！那瓶子曾是那小妖拿在山上放光，老孫得了，不想那怪又復搜去。今日藏在這裡，原來也放光。」你看他竊了這瓶子，喜喜歡歡，且不救師父，急抽身往洞外而走。才出門，只見那妖魔提著寶劍，拿著扇子，從南而來。孫大聖迴避不及，被那老魔舉劍劈頭就砍。大聖急縱觔斗雲跳將起去，無影無蹤的逃了不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    悟空は小妖を皆殺しにして洞へ飛び込み、師の縄を解こうとした。ところが奥にも炎の光が燃え立って見え、うろたえて叫んだ。
    悟空「もう駄目だ、もう駄目だ。この火は裏口から燃え込んでいる。これでは俺もお師匠さまを助けられない！」
    恐れながらよく見ると、何と、それは火ではなく、一筋の金色の光だった。心を落ち着けて奥を見れば、羊脂玉浄瓶（ようしぎょくじょうへい）が光を放っていたのである。悟空は心の中で喜んだ。
    悟空の心の声「いい宝だ！　この瓶は、あの小妖が山で持っていたときも光っていた。俺が手に入れたのに、思いがけず妖怪にまた取り上げられたんだ。今日はここに隠されているが、やはり光るのだな。」
    ご覧なさい。悟空はこの瓶を盗み、うきうきして、師を助けるのはひとまず後回しにし、急いで身を返して洞の外へ向かった。門を出たとたん、金角大王が宝剣と扇を持って南から来るのに出くわした。悟空は身を隠す間もなく、金角大王に頭めがけて剣を振り下ろされた。急いで觔斗雲（きんとうん）に跳び乗り、影も形もなく逃げ去った。その話はひとまずおく。
  "translation_status": "draft"
- "id": "xy-ch35-023"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那怪到得門口，但見屍橫滿地，就是他手下的群精。慌得仰天長嘆，止不住放聲大哭道：「苦哉！痛哉！」有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    さて金角大王が門へ着いてみると、そこらじゅうに死骸が転がっていた。どれも配下の妖怪たちである。動転して天を仰ぎ、深く嘆き、声を上げて泣かずにはいられなかった。
    金角大王「ああ、つらい！　何と痛ましいことだ！」
    これを証しする詩がある。詩にいう。
  "translation_status": "draft"
- "id": "xy-ch35-024"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    可恨猿乖馬劣頑，靈胎轉託降塵凡。
    只因錯念離天闕，致使忘形落此山。
    鴻雁失群情切切，妖兵絕族淚潺潺。
    何時孽滿開愆鎖，返本還原上御關？
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 170
    "line_end": 173
  "translation_ja": |-
    猿はずるく、馬は荒々しく頑なであることの、何と恨めしいことか。
    霊妙な身は姿を変え、俗世へ降りた。
    ひとたび思いを誤って天の宮を離れたため、
    本来の姿を忘れ、この山へ落ちたのだ。
    群れを失った雁のように思いは切なく、
    妖兵の一族は絶え、涙はとめどなく流れる。
    いつ業の報いが尽き、罪の鎖が解け、
    もとへ立ち返って、天の御門へ上れるのだろうか。
  "translation_status": "draft"
- "id": "xy-ch35-025"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老魔慚惶不已，一步一聲，哭入洞內。只見那什物傢火俱在，只落得靜悄悄，沒個人形，悲切切，愈加悽慘。獨自個坐在洞中，蹋伏在那石案之上，將寶劍斜倚案邊，把扇子插於肩後，昏昏默默睡著了，這正是：人逢喜事精神爽，悶上心來瞌睡多。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 174
    "line_end": 174
  "translation_ja": "金角大王は恥じ、うろたえ、一歩ごとに声を漏らし、泣きながら洞へ入った。道具や家財はすべて残っているのに、ただ静まり返って、人影が一つもない。悲しみは深まり、ますます惨めになった。一人洞に座り、石の机へうつ伏せになって、宝剣を机のそばへ斜めに立てかけ、扇を肩の後ろへ差し込んだまま、ぼんやりと眠ってしまった。まさに、喜びごとに会えば気は晴れ晴れとし、悩みが心にのしかかれば眠気が増す、というものである。"
  "translation_status": "draft"
- "id": "xy-ch35-026"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說孫大聖撥轉觔斗雲，佇立山前，想著要救師父，把那淨瓶兒牢扣腰間，徑來洞口打探。見那門開兩扇，靜悄悄的不聞消耗。隨即輕輕移步，潛入裡邊。只見那魔斜倚石案，呼呼睡著。芭蕉扇褪出肩衣，半蓋著腦後；七星劍還斜倚案邊。卻被他輕輕的走上前拔了扇子，急回頭，呼的一聲，跑將出去。原來這扇柄兒刮著那怪的頭髮，早驚醒他。擡頭看時，是孫行者偷了，急慌忙執劍來趕。那大聖早已跳出門前，將扇子撒在腰間，雙手掄開鐵棒，與那魔抵敵。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 176
    "line_end": 176
  "translation_ja": "さて悟空は觔斗雲を引き返し、山の前に立った。師を救わねばと思い、浄瓶を腰へしっかり留めると、洞の入り口を探りに来た。二枚の門は開いており、しんと静まって物音一つしない。そろそろと足を運び、中へ忍び込むと、金角大王は石の机にもたれ、ぐうぐう眠っていた。芭蕉扇は肩の衣からずり出て、後頭部を半ば覆い、七星剣はまだ机のそばに斜めに立てかけてあった。悟空はそっと近づいて扇を引き抜き、すぐに振り返り、さっと駆け出した。ところが、扇の柄が金角大王の髪をこすり、目を覚まさせてしまった。顔を上げ、悟空に盗まれたと知ると、慌てて剣をつかみ、追いかける。悟空はすでに門の外へ跳び出し、扇を腰へ差し、両手で鉄棒を振り開いて迎え撃った。またも激しい戦いとなった。"
  "translation_status": "draft"
- "id": "xy-ch35-027"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": "惱壞潑妖王，怒發沖冠志。恨不過撾來囫圇吞，難解心頭氣。惡口罵猢猻：「你老大將人戲，傷我若干生，還來偷寶貝。這場決不容，定見存亡計。」大聖喝妖魔：「你好不知趣，徒弟要與老孫爭，累卵焉能擊石碎？」寶劍來，鐵棒去，兩家更不留仁義。一翻二復賭輸贏，三轉四回施武藝。蓋為取經僧，靈山參佛位。致令金火不相投，五行撥亂傷和氣；揚威耀武顯神通，走石飛沙弄本事。交鋒漸漸日將晡，魔頭力怯先迴避。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    妖王は怒り狂い、髪は冠を突き上げる。
    捕まえて丸呑みにしてもなお、胸の怒りは鎮まるまい。
    猿を悪しざまに罵る金角大王。
    金角大王「よくもよくも人をもてあそぶな。
    幾つもの命を奪い、なお宝を盗みに来るとは。
    今度ばかりは許さぬ。必ず生きるか死ぬか、決着をつけてやる。」
    悟空も妖魔を叱りつける。
    悟空「何と物の分からぬやつだ。
    弟子の分際でこの俺と争うのか。積み重ねた卵で、岩を打ち砕けるものか。」
    宝剣が来れば、鉄棒が行き、双方もはや情けも義理も残さない。
    一たび二たび翻って勝負を賭け、三たび四たび巡って武芸を尽くす。
    すべては経を求める僧が、霊山（れいざん）へ仏を拝しに行くため。
    それゆえ金と火は相容れず、五行は乱され、和気は損なわれる。
    威を張り武を誇って神通を示し、岩を転がし砂を飛ばして技を競う。
    打ち合ううちに日は暮れへ近づき、妖魔は力が尽き、先に身を避けた。
  "translation_status": "draft"
- "id": "xy-ch35-028"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老魔與大聖戰經三四十合，天將晚矣，抵敵不住，敗下陣來；徑往西南上，投奔壓龍洞去不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 179
    "line_end": 179
  "translation_ja": "金角大王は悟空と三、四十合戦ったが、もう夕方になり、支えきれずに敗走した。そのまま西南へ向かい、圧竜洞（あつりゅうどう）を頼って逃げていった。その話はひとまずおく。"
  "translation_status": "draft"
- "id": "xy-ch35-029"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖才按落雲頭，闖入蓮花洞裡，解下唐僧與八戒、沙和尚來。他三人脫得災危，謝了行者，卻問：「妖魔那裡去了？」行者道：「二魔已裝在葫蘆裡，想是這會子已化了。大魔才然一陣戰敗，往西南壓龍山去訖。概洞小妖，被老孫分身法打死一半；還有些敗殘回的，又被老孫殺絕。方才得入此處，解放你們。」唐僧謝之不盡道：「徒弟啊，多虧你受了勞苦。」行者笑道：「誠然勞苦。你們還只是吊著受疼，我老孫再不曾住腳，比急遞鋪的鋪兵還甚，反復裡外，奔波無已。因是偷了他的寶貝，方能平退妖魔。」豬八戒道：「師兄，你把那葫蘆兒拿出來與我們看看。只怕那二魔已化了也。」大聖先將淨瓶解下，又將金繩與扇子取出，然後把葫蘆兒拿在手道：「莫看，莫看。他先曾裝了老孫，被老孫漱口，哄得他揭開蓋子，老孫方得走了。我等切莫揭蓋，只怕他也會弄喧走了。」師徒們喜喜歡歡，將他那洞中的米麵菜蔬尋出，燒刷了鍋灶，安排些素齋吃了。飽餐一頓，安寢洞中，一夜無詞，早又天曉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 180
    "line_end": 180
  "translation_ja": |-
    悟空はそこで雲から下り、蓮花洞へ飛び込んで、三蔵（さんぞう）と八戒、沙悟浄を解き下ろした。三人は危難を脱し、悟空に礼を述べて尋ねた。
    三蔵たち三人「妖怪はどこへ行った？」
    悟空「弟のほうは瓢箪に入れたから、今ごろはもう溶けたはずです。兄のほうは、たった今の戦いで敗れ、西南の圧竜山（あつりゅうざん）へ行きました。洞の小妖どもは、私の分身の術で半分を殺し、敗れて戻ってきた残りも、私が皆殺しにしました。それでようやくここへ入り、皆さんを解放できたのです。」
    三蔵は感謝してもしきれなかった。
    三蔵「弟子よ、よく苦労してくれた。お前のおかげだ。」
    悟空は笑った。「本当に苦労しましたよ。皆さんは吊るされて痛い思いをしていただけですが、私は一度も足を止めませんでした。急逓鋪（きゅうていほ）の駅卒よりもひどく、内へ外へ、行ったり来たり、休みなく走り回ったのです。あいつの宝を盗んだからこそ、ようやく妖魔を退けられました。」
    八戒「兄貴、その瓢箪を出して、俺たちにも見せてくれ。弟の妖怪はもう溶けているんじゃないか。」
    悟空はまず浄瓶を腰から外し、金の縄と扇を取り出し、それから瓢箪を手に取った。
    悟空「見るな、見るな。あいつは先に俺を入れたが、俺がうがいをして蓋を開けさせ、そこから逃げ出したんだ。俺たちも絶対に蓋を開けるな。あいつまで騒いでだまし、逃げ出すかもしれない。」
    師弟は喜び合い、洞の米や粉、野菜を探し出し、かまどに火を入れ、鍋を洗って、精進料理を用意して食べた。腹いっぱい食べると、洞で安らかに眠った。一夜は何事もなく過ぎ、早くも夜が明けた。
  "translation_status": "draft"
- "id": "xy-ch35-030"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那老魔徑投壓龍山，會聚了大小女怪，備言打殺母親，裝了兄弟，絕滅妖兵，偷騙寶貝之事。眾女怪一齊大哭，哀痛多時道：「你等且休悽慘。我身邊還有這口七星劍，欲會汝等女兵，都去壓龍山後，會借外家親戚，斷要拿住那孫行者報仇。」說不了，有門外小妖報道：「大王，山後老舅爺帥領若干兵卒來也。」老魔聞言，急換了縞素孝服，躬身迎接。原來那老舅爺是他母親之弟，名喚狐阿七大王。因聞得哨山的妖兵報道，他姐姐被孫行者打死，假變姐形，盜了外甥寶貝，連日在平頂山拒敵，他即帥本洞妖兵二百餘名，特來助陣，故此先攏姐家問信。才進門，見老魔掛了孝服，二人大哭。哭久，老魔拜下，備言前事。那阿七大怒，即命老魔換了孝服，提了寶劍，盡點女妖，合同一處，縱風雲，徑投東北而來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    一方、金角大王はまっすぐ圧竜山へ向かい、大小の女妖怪たちを集めた。そして、母を殴り殺され、弟を吸い込まれ、妖兵を全滅させられ、宝を盗まれ騙し取られた一部始終を話した。女妖怪たちは皆声を上げて泣き、長い間悲しんだ。
    金角大王「お前たち、ひとまず嘆くのはやめろ。私の手元には、まだこの七星剣がある。お前たち女兵を集め、皆で圧竜山の裏へ行って、母方の親戚から援軍を借りよう。何としても孫行者を捕らえ、仇を討つのだ。」
    言い終わらぬうちに、門の外の小妖が報告した。
    小妖「大王、山の裏から叔父君が、兵を率いておいでです。」
    金角大王は聞くと、急いで白い喪服へ着替え、身をかがめて出迎えた。この叔父君は母の弟で、狐阿七大王（こあしちだいおう）という名である。山を見回る妖兵から、姉が悟空に殺され、悟空がその姿を装って甥の宝を盗み、ここ数日平頂山（へいちょうざん）で戦いが続いていると聞いていた。そこで、自分の洞の妖兵二百人あまりを率い、わざわざ加勢に来たのである。そのため、まず姉の家へ寄って事情を尋ねようとしたのだった。門をくぐると、金角大王が喪服を着ているのを見て、二人は声を上げて泣いた。長く泣いた後、金角大王は拝礼して、これまでのことを詳しく話した。狐阿七大王は激怒し、金角大王に喪服を着替えさせ、宝剣を持たせ、女妖怪を残らず集めた。こうして全軍を一つにし、風雲に乗って、まっすぐ東北へ向かった。
  "translation_status": "draft"
- "id": "xy-ch35-031"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖卻教沙僧整頓早齋，吃了走路。忽聽得風聲，走出門看，乃是一夥妖兵，自西南上來。行者大驚，急抽身，忙呼八戒道：「兄弟，妖精又請救兵來也。」三藏聞言，驚恐失色道：「徒弟，似此如何？」行者笑道：「放心，放心。把他這寶貝都拿來與我。」大聖將葫蘆、淨瓶繫在腰間，金繩籠於袖內，芭蕉扇插在肩後，雙手掄著鐵棒。教沙僧保守師父，穩坐洞中。著八戒執釘鈀，同出洞外迎敵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    悟空は沙悟浄に朝の精進料理を用意させ、食べてから出発するつもりだった。ふと風の音がしたので、門を出て見ると、一群の妖兵が西南から来る。驚いた悟空は身を返し、急いで八戒を呼んだ。
    悟空「弟よ、妖怪がまた援軍を呼んできたぞ！」
    三蔵はそれを聞くと、恐ろしさに顔色を失った。
    三蔵「弟子よ、これではどうしたらよいのだ？」
    悟空は笑った。「ご安心を、ご安心を。あいつらの宝を全部、私に渡してください。」
    悟空は瓢箪と浄瓶を腰へ結びつけ、金の縄を袖へ納め、芭蕉扇を肩の後ろへ差し、両手で鉄棒を構えた。沙悟浄には洞の中に落ち着いて座り、師を守るよう言いつけ、八戒には釘鈀（ていは）を持たせ、ともに洞の外へ迎え撃ちに出た。
  "translation_status": "draft"
- "id": "xy-ch35-032"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪物擺開陣勢，只見當頭的是阿七大王。他生的玉面長髯，鋼眉刀耳；頭戴金煉盔，身穿鎖子甲，手執方天戟。高聲罵道：「我把你個大膽的潑猴！怎敢這等欺人？偷了寶貝，傷了眷族，殺了妖兵，又敢久占洞府。趕早兒一個個引頸受死，雪我姐家之仇。」行者罵道：「你這夥作死的毛團，不識你孫外公的手段。不要走，領吾一棒。」那怪物側身躲過，使方天戟劈面相迎。兩個在山頭上一來一往，戰經三四回合，那怪力軟。敗陣回走。行者趕來，卻被老魔接住。又鬥了三合，只見那狐阿七復轉來攻。這壁廂八戒見了，急掣九齒鈀擋住。一個抵一個，戰經多時，不分勝敗，那老魔喝了一聲，眾妖兵一齊圍上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    妖怪たちは陣を敷いた。先頭にいたのは狐阿七大王である。玉のような顔に長いひげ、鋼の眉と刀のような耳。頭には精錬した金の兜、身には鎖帷子、手には方天戟（ほうてんげき）を持っていた。大声で罵る。
    狐阿七大王「この大胆不敵なろくでなしの猿め！　よくもそこまで人を踏みにじったな。宝を盗み、一族を傷つけ、妖兵を殺したうえ、まだ洞まで居座って占領するとは。一人ずつ、早く首を差し出して死ね。姉の家の仇を晴らしてやる！」
    悟空も罵った。
    悟空「この死にたがりの毛玉どもめ。お前たちの母方の爺さま、この孫（そん）の腕を知らぬな。逃げるな、俺の一棒を受けろ！」
    狐阿七大王は身体を横へかわし、方天戟で真っ向から迎え撃った。二人は山の上で行きつ戻りつ戦ったが、三、四合で狐阿七大王の力がなえ、敗れて引き返した。悟空が追うと、金角大王が立ちはだかった。さらに三合打ち合ううち、狐阿七大王が戻って攻めかかってきた。それを見た八戒は急いで九歯鈀（きゅうしは）を引き出し、受け止めた。一対一となって長く戦ったが、勝敗はつかない。金角大王が一喝すると、妖兵たちが一斉に取り囲んだ。
  "translation_status": "draft"
- "id": "xy-ch35-033"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那三藏坐在蓮花洞裡，聽得喊聲振地，便叫：「沙和尚，你出去看你師兄勝負如何？」沙僧果舉降妖杖出來，喝一聲，撞將出去，打退群妖。阿七見事勢不利，回頭就走；被八戒趕上，照背後一鈀，就築得九點鮮紅往外冒，可憐一靈真性赴前程。急拖來剝了衣服看處，原來也是個狐狸精。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    そのころ三蔵は蓮花洞に座っていたが、大地を震わせる喊声を聞き、呼びかけた。
    三蔵「沙和尚（さおしょう）、外へ行って、兄弟子たちの勝負がどうなっているか見ておいで。」
    沙悟浄はすぐに降妖杖（ごうようじょう）を持って出た。一声喝して突っ込み、群がる妖怪を打ち退ける。狐阿七大王は形勢が不利と見ると、身を翻して逃げた。八戒が追いつき、背後から一度、熊手を打ち込むと、九つの穴から鮮血が噴き出した。哀れにも、その一つの真の魂は次の世への道をたどった。すぐに引きずってきて衣服を剥いで見ると、これも狐の妖怪だったのである。
  "translation_status": "draft"
- "id": "xy-ch35-034"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老魔見傷了他老舅，丟了行者，提起寶劍，就劈八戒；八戒使鈀架住。正賭鬥間，沙僧撞近前來，舉杖便打。那妖抵敵不住，縱風雲，往南逃走。八戒、沙僧緊緊趕來。大聖見了，急縱雲跳在空中，解下淨瓶，罩定老魔，叫聲：「金角大王。」那怪只道是自家敗殘的小妖呼叫，就回頭應了一聲。颼的裝將進去，被行者貼上「太上老君急急如律令奉敕」的帖子。只見那七星劍墜落塵埃，也歸了行者。八戒迎著道：「哥哥，寶劍你得了，精怪何在？」行者笑道：「了了，已裝在我這瓶兒裡也。」沙僧聽說，與八戒十分歡喜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    金角大王は叔父を殺されたのを見ると、悟空を振り切り、宝剣を提げて八戒へ斬りつけた。八戒は熊手で受け止める。戦っているところへ、沙悟浄が突っ込んできて、杖を振り上げて打った。金角大王は支えきれず、風雲に乗って南へ逃げた。八戒と沙悟浄が、ぴたりと後を追う。悟空はそれを見ると、急いで雲に乗って空へ跳び、浄瓶を外し、金角大王に狙いを定め、一声呼んだ。
    悟空「金角大王！」
    金角大王は敗残の部下が呼んだものとばかり思い、振り向いて返事をした。そのとたん、すうっと吸い込まれ、悟空は「太上老君の勅命を奉じ、急ぎ律令のとおりに行え」と書いた札を貼った。七星剣は地上へ落ち、それも悟空の手に入った。八戒が近寄って言った。
    八戒「兄貴、宝剣は手に入ったが、妖怪はどこだ？」
    悟空は笑った。「片づいた、片づいた。もうこの瓶の中さ。」
    沙悟浄はそれを聞き、八戒とともに大いに喜んだ。
  "translation_status": "draft"
- "id": "xy-ch35-035"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時通掃淨諸邪，回至洞裡，與三藏報喜道：「山已淨，妖已無矣，請師父上馬走路。」三藏喜不自勝。師徒們吃了早齋，收拾了行李、馬匹，奔西找路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 189
    "line_end": 189
  "translation_ja": |-
    こうして邪悪なものをすべて掃き清めると、洞へ戻り、三蔵へ喜びを報告した。
    話者不明「山は清まり、妖怪はもうおりません。お師匠さま、馬に乗って出発なさってください。」
    三蔵は喜びにたえなかった。師弟は朝の精進料理を食べ、荷物と馬を整え、西へ道を探して進んだ。
  "translation_status": "draft"
- "id": "xy-ch35-036"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正行處，猛見路傍閃出一個瞽者，走上前，扯住三藏馬道：「和尚，那裡去？還我寶貝來。」八戒大驚道：「罷了，這是老妖來討寶貝了。」行者仔細觀看，原來是太上李老君，慌得近前施禮道：「老官兒，那裡去？」那老祖急昇玉局寶座，在九霄空裡佇立，叫：「孫行者，還我寶貝。」大聖起到空中道：「甚麼寶貝？」老君道：「葫蘆是我盛丹的，淨瓶是我盛水的，寶劍是我煉魔的，扇子是我搧火的，繩子是我一根勒袍的帶。那兩個怪：一個是我看金爐的童子，一個是我看銀爐的童子。只因他偷了我的寶貝，走下界來，正無覓處，卻是你今拿住，得了功績。」大聖道：「你這老官兒，著實無禮。縱放家屬為邪，該問個鈐束不嚴的罪名。」老君道：「不干我事，不可錯怪了人。此乃海上菩薩問我借了三次，送他在此，託化妖魔，試你師徒可有真心往西去也。」大聖聞言，心中作念道：「這菩薩也老大憊懶。當時解逃老孫，教保唐僧西去取經，我說路途艱澀難行，他曾許我到急難處，親來相救；如今反使精邪掯害。語言不的，該他一世無夫。若不是老官兒親來，我決不與他。既是你這等說，拿去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    進んでいると、突然、道端から目の見えない男が現れた。近づいて三蔵の馬を引き留め、言った。
    目の見えない男「和尚、どこへ行く。私の宝を返せ。」
    八戒は驚いた。
    八戒「もう駄目だ。年寄りの妖怪が宝を取り返しに来たぞ。」
    悟空がよく見定めると、それは太上李老君（たいじょうりろうくん）だった。慌てて進み出て、礼をした。
    悟空「ご老体、どちらへ？」
    太上老君はすぐに玉局宝座（ぎょくきょくほうざ）へ上がり、九霄（きゅうしょう）の空中にとどまって呼んだ。
    太上老君「孫行者、私の宝を返せ。」
    悟空も空へ上がった。
    悟空「何の宝だい？」
    太上老君「瓢箪は私が丹薬（たんやく）を入れる物、浄瓶は水を入れる物、宝剣は魔を退治する物、扇は火をあおぐ物、縄は私の上衣を締める帯だ。あの二人の妖怪は、一人が私の金の炉の番をする童子（どうじ）、一人が銀の炉の番をする童子なのだ。私の宝を盗んで下界へ行き、ちょうど居場所も分からずにいたところを、今お前が捕らえた。手柄を立てたものだ。」
    悟空「このご老体、まったく無礼じゃないか。身内を野放しにして悪事をさせたのだから、監督不行き届きの罪に問うべきだぞ。」
    太上老君「私の責任ではない。人を間違って責めるな。これは海上菩薩（かいじょうぼさつ）が私に三度頼んで借り受け、ここへ送り、妖魔の姿を取らせたのだ。お前たち師弟に、本当に西へ行く心があるか試すためだった。」
    悟空は聞くと、心の中でこう考えた。
    悟空の心の声「この菩薩（ぼさつ）も、まったくいい加減な方だ。あのとき俺を解き放ち、三蔵を守って西へ経を取りに行くよう命じた。道が険しく、旅は難しいと俺が言ったら、急難に遭ったときには、自分で助けに来ると約束したではないか。それなのに、今度は逆に妖怪を使って苦しめるとは。言うことが当てにならない。一生夫なしでいるのも当然だ。ご老体がじきじき来たのでなければ、決して渡してやらぬところだった。だが、そういうことなら、持っていきな。」
  "translation_status": "draft"
- "id": "xy-ch35-037"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老君收得五件寶貝，揭開葫蘆與淨瓶蓋口，倒出兩股仙氣。用手一指，仍化為金、銀二童子，相隨左右。只見那霞光萬道，咦！"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 192
    "line_end": 192
  "translation_ja": "太上老君は五つの宝を受け取り、瓢箪と浄瓶の蓋を開けて、二筋の仙気（せんき）を注ぎ出した。指を差すと、再び金・銀二人の童子となり、左右に付き従った。幾万もの霞の光が広がる。ああ！"
  "translation_status": "draft"
- "id": "xy-ch35-038"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": "縹緲同歸兜率院，逍遙直上大羅天。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    かすみの彼方、ともに兜率院（とそついん）へ帰り、
    自由に悠々と、大羅天（だいらてん）へまっすぐ上ってゆく。
  "translation_status": "draft"
- "id": "xy-ch35-039"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此後又有甚事，孫大聖怎生保護唐僧，幾時得到西天，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 195
    "line_end": 195
  "translation_ja": "さて、この後はまた何が起こり、悟空はどのように三蔵を守り、いつ西天（さいてん）にたどり着くのだろうか。それは次回のお話をお聞きいただきたい。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-01"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "円明・清濁・劫の詩は修行の象徴を含む。「清濁」を人物名に置換せず、天地の生成と長生の境地が重なる表現として訳した。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-02"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "孫行者・者行孫・行者孫は同じ三文字の並べ替え。悟空の偽名の仕掛けと、金角大王が複数の兄弟と誤認する筋をそのまま保持する。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-03"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の名乗りは前段落の悟空の開き鉤括弧から続く詩。「祖貫」は本籍・出自。「罷爭競」は争いをやめていた意で、拘禁の年数はここにないため補わない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-04"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "太上老祖が女媧の名で化身し天を補ったという由来は、銀角大王の話として保持した。一般的な創世神話へ訂正しない。悟空はそれを聞いて二個の雌雄の瓢箪という話を作っている。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-05"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "封じの札「太上老君急急如律令奉敕」は語順を整えて「太上老君の勅命を奉じ、急ぎ律令のとおりに行え」とした。第三十四回に同じ文字列が記されていたと断定しない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-06"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「圈盤腿」はがに股と読んだ。「凡胎未脫」で銀角大王が溶ける説明は、後の由来説明と勝手に整合させない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-07"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "発課は占いを行うこと。周易の文王、孔子、桃花女、鬼谷子の四者への呼びかけを保つ。桃花女と占術の伝承についてはDurand-Dastèsの研究を参照したが、日本語読みは直接資料未確認。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-08"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「\U00023662戶\U00023662戶」は難しい方言句。本文では煮えやすいという流れに沿い「煮える、煮えるとも」とした。ただし盱眙文藝の方言論（荔枝網2017-04-26）は「圈户」を、皮ごと煮ると食べる肉の量が多くて得だという意味だと説明し、易く煮えるだけという注を批判する。字形・方言との対応は未確定で、この異説を留保する。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-09"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "受生経は死者のために唱えるとされる経名として残した。既存辞書の受生度亡経と同一の経だとは確認できず、別項目とする。食材八種と剥皮の脅し・八戒の言い換えを省かない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-10"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "金角大王は「那瓶子不中用」と瓶を非難するが、弟が吸い込まれたのは瓢箪である。底本の不整合を直さず、本人の台詞として保持した。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-11"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「東南丙丁火、正對離宮」とする。丙丁は五行の火、離は一般に南に配されるが、「東南」を「南」へ訂正しない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-12"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "負傷した小妖を悟空が皆殺しにする描写と、人身を得る修行の功が失われたという語り手の哀惜を、救出の美談へ弱めない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-13"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「猿乖馬劣」は猿と馬に心意を重ねる修行的表現。「靈胎」や天を離れた由来も原文の詩が示す範囲で訳し、この時点でまだ明かされていない正体を先取りしない。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-14"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "詩中の「徒弟」は悟空が相手を弟子扱いする侮りで、妖怪が実際の弟子という意味ではない。「累卵擊石」と金・火・五行の比喩を保持した。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-15"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "女妖怪たちが泣いた後の「道」の主語は省略されるが、「身邊還有這口七星劍」と軍の編成指示から金角大王の発言とした。叔父の名は語り手が紹介する箇所以後、正体の確認も本文の叙述順に従う。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-16"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵へ喜びを報告する「報喜道」の主語は省略されている。悟空一人か弟子たちかを本文だけでは確定できないため、話者不明とした。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-17"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭は底本に「瞽者」とあるため、目の見えない男と訳し、悟空が見定める前に老君と名づけない。老君が語る所有物五つと童子二人の役割、菩薩が三度借りた事情を保つ。"
  "translation_status": "draft"
- "id": "xy-ch35-note-body-18"
  "section_id": "chapter-35"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「心中作念道」から「拿去罷」まで一つの鉤括弧内に置く。末尾は老君への直接の返答とも読めるが、底本の引用範囲を優先し全体を悟空の心の声とした。「該他一世無夫」は菩薩に対する悟空の悪口であり、語り手の断定に変えていない。"
  "translation_status": "draft"

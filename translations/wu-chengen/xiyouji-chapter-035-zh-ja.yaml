  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪甚喜，急縱身跳將起去，到空中，執著葫蘆，叫一聲：「行者孫。」大聖聽得，卻就不歇氣，連應了八九聲，只是不能裝去。那魔墜將下來，跌腳搥胸道：「天那！只說世情不改變哩，這樣個寶貝，也怕老公，雌見了雄，就不敢裝了。」行者笑道：「你且收起，輪到老孫該叫你哩。」急縱觔斗，跳起去，將葫蘆底兒朝天，口兒朝地，照定妖魔，叫聲：「銀角大王。」那怪不敢閉口，只得應了一聲。倏的裝在裡面，被行者貼上「太上老君急急如律令奉敕」的帖子。心中暗喜道：「我的兒，你今日也來試試新了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    銀角大王は大喜びで宙へ跳び上がり、瓢箪を構えて一声呼んだ。
    銀角大王「行者孫！」
    悟空はそれを聞くと、息もつかず八、九回続けて返事をしたが、少しも吸い込まれなかった。銀角大王は地上へ下り、地団駄を踏み、胸をたたいて嘆いた。
    銀角大王「ああ、天よ！　世の習いは変わらぬというが、こんな宝まで亭主を恐れるのか。雌は雄を見ると、吸い込むこともできないとは！」
    悟空は笑った。「そいつをしまえ。今度は俺がお前を呼ぶ番だ。」
    すぐさま筋斗（きんと）を切って跳び上がり、瓢箪の底を天へ、口を地へ向け、妖怪に狙いを定めて呼んだ。
    悟空「銀角大王！」
    銀角大王は黙っているわけにもいかず、一声返事をした。たちまち中へ吸い込まれ、悟空は「太上老君（たいじょうろうくん）の勅命を奉じ、急ぎ律令のとおりに行え」と記した札を貼った。
    悟空の心の声「せがれよ、今日はお前にも初めての味を試させてやるぞ。」

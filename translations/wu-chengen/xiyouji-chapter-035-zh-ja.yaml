  "translation_ja": |-
    第三十五回
    外道、威を振るって正しき本性を脅かす　心猿、宝を得て邪魔を降す
  "translation_status": "draft"
- "id": "xy-ch35-002"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    本性圓明道自通，翻身跳出網羅中。
    修成變化非容易，煉就長生豈俗同？
    清濁幾番隨運轉，闢開數劫任西東。
    逍遙萬億年無計，一點神光永注空。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 121
    "line_end": 124
  "translation_ja": |-
    本性が円く明らかなら、おのずと道に通じ、身を翻して網の中から飛び出す。
    変化（へんげ）の術を修めるのはたやすくなく、長生（ちょうせい）を練り上げた身が凡俗と同じであろうか。
    清らかなものも濁ったものも、幾たびとなく運に従って巡り、幾劫（こう）もの時を切り開いて東西を自在に行く。
    万億年を数えることもなく自由に遊び、一点の神光は永遠に虚空を照らす。
  "translation_status": "draft"
- "id": "xy-ch35-003"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此詩暗合孫大聖的道妙。他自得了那魔真寶，籠在袖中，喜道：「潑魔苦苦用心拿我，誠所謂水中撈月；老孫若要擒你，就好似火上弄冰。」藏著葫蘆，密密的溜出門外，現了本相，厲聲高叫道：「精怪開門！」傍有小妖道：「你又是甚人，敢來吆喝？」行者道：「快報與你那老潑魔，吾乃行者孫來也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    この詩は、悟空（ごくう）が得た道の奥妙に暗に通じる。悟空は妖怪の本物の宝を手に入れ、袖に隠すと、うれしそうに言った。
    悟空「ろくでなしの妖怪め、あれほど知恵を絞って俺を捕まえようとしたが、まさに水の中の月をすくうようなものさ。俺がお前を捕まえるなら、火の上で氷を扱うも同然だ。」
    瓢箪を隠してそっと門の外へ抜け出し、元の姿に戻ると、鋭い声で叫んだ。
    悟空「妖怪ども、門を開けろ！」
    そばにいた小妖「今度は何者だ。よくもここでわめけるな？」
    悟空「早くあの年食ったろくでなしに知らせろ。この行者孫（ぎょうじゃそん）が来たとな！」
  "translation_status": "draft"
- "id": "xy-ch35-004"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那小妖急入裡報道：「大王，門外有個甚麼行者孫來了。」老魔大驚道：「賢弟，不好了，惹動他一窩風了。幌金繩現拴著孫行者，葫蘆裡現裝著者行孫，怎麼又有個甚麼行者孫？想是他幾個兄弟都來了。」二魔道：「兄長放心。我這葫蘆裝下一千人哩，我才裝了者行孫一個，又怕那甚麼行者孫？等我出去看看，一發裝來。」老魔道：「兄弟仔細。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    小妖は急いで中へ入り、報告した。
    小妖「大王、門の外に行者孫とかいう者が参りました。」
    金角大王（きんかくだいおう）は仰天した。
    金角大王「弟よ、大変だ。あいつの仲間をぞろぞろ呼び寄せてしまったぞ。幌金縄（こうきんじょう）では今、孫行者（そんぎょうじゃ）を縛っており、瓢箪には者行孫（しゃぎょうそん）が入っている。それなのに、また行者孫とかいうのが現れるとは？　きっと兄弟がそろって来たのだ。」
    銀角大王（ぎんかくだいおう）「兄上、ご安心を。この瓢箪は千人でも入ります。まだ者行孫を一人入れただけですから、行者孫だか何だかを恐れることはありません。俺が出て見てきます。そいつもまとめて入れてしまいましょう。」
    金角大王「弟よ、気をつけるのだぞ。」
  "translation_status": "draft"
- "id": "xy-ch35-005"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那二魔拿著個假葫蘆，還像前番，雄糾糾，氣昂昂，走出門高呼道：「你是那裡人氏，敢在此間吆喝？」行者道：「你認不得我："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    ご覧なさい。銀角大王は偽物の瓢箪を持ち、先ほどと変わらぬ威勢で、肩をそびやかして門を出ると、大声で呼ばわった。
    銀角大王「お前はどこの者だ。よくもここでわめけるな？」
    悟空「俺を知らないのか。
  "translation_status": "draft"
- "id": "xy-ch35-006"
  "section_id": "chapter-35"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    家居花果山，祖貫水簾洞。
    只為鬧天宮，多時罷爭競。
    如今幸脫災，棄道從僧用。
    秉教上雷音，求經歸覺正。
    相逢野潑魔，卻把神通弄。
    還我大唐僧，上西參佛聖。
    兩家罷戰爭，各守平安境。
    休惹老孫焦，傷殘老性命。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 131
    "line_end": 138
  "translation_ja": |-
    住まいは花果山（かかざん）、生まれの本籍は水簾洞（すいれんどう）。
    天宮（てんきゅう）で大暴れしたばかりに、長い間、争いをやめていた。
    今は幸い災いを逃れ、道士（どうし）の道を捨てて僧に仕える身となった。
    教えを奉じて雷音（らいおん）へ赴き、経を求めて正しい悟りへ帰るのだ。
    野放図な妖怪に出くわしたので、神通（じんずう）を振るっている。
    大唐（だいとう）の僧を返せ。西へ行き、尊い仏に参ろう。
    双方争いをやめて、それぞれ平穏な境遇を守ればよい。
    この俺を怒らせるな。お前の命を損なうぞ。」
  "translation_status": "draft"
- "id": "xy-ch35-007"
  "section_id": "chapter-35"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔道：「你且過來，我不與你相打，但我叫你一聲，你敢應麼？」行者笑道：「你叫我，我就應了；我若叫你，你可應麼？」那魔道：「我叫你，是我有個寶貝葫蘆，可以裝人；你叫我，卻有何物？」行者道：「我也有個葫蘆兒。」那魔道：「既有，拿出來我看。」行者就於袖中取出葫蘆道：「潑魔，你看。」幌一幌，復藏在袖中，恐他來搶。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    銀角大王「まずこちらへ来い。戦いはしない。ただ一声呼んだら、お前は返事をする勇気があるか？」
    悟空は笑った。「呼べば返事をするさ。俺が呼んだら、お前も返事をするか？」
    銀角大王「俺が呼ぶのは、人を吸い込める宝の瓢箪を持っているからだ。お前が俺を呼んで、何を使うつもりだ？」
    悟空「俺も瓢箪を一つ持っている。」
    銀角大王「あるなら、出して見せろ。」
    悟空は袖から瓢箪を取り出した。
    悟空「ろくでなしめ、見ろ。」
    ひらりと振って見せると、奪われてはならぬと、また袖へしまった。

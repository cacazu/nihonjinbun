  "known_gaps":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-002"
    "description_ja": "円明・清濁・劫の詩は修行の象徴を含む。「清濁」を人物名に置換せず、天地の生成と長生の境地が重なる表現として訳した。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-004"
    "description_ja": "孫行者・者行孫・行者孫は同じ三文字の並べ替え。悟空の偽名の仕掛けと、金角大王が複数の兄弟と誤認する筋をそのまま保持する。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-006"
    "description_ja": "冒頭の名乗りは前段落の悟空の開き鉤括弧から続く詩。「祖貫」は本籍・出自。「罷爭競」は争いをやめていた意で、拘禁の年数はここにないため補わない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-008"
    "description_ja": "太上老祖が女媧の名で化身し天を補ったという由来は、銀角大王の話として保持した。一般的な創世神話へ訂正しない。悟空はそれを聞いて二個の雌雄の瓢箪という話を作っている。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-009"
    "description_ja": "封じの札「太上老君急急如律令奉敕」は語順を整えて「太上老君の勅命を奉じ、急ぎ律令のとおりに行え」とした。第三十四回に同じ文字列が記されていたと断定しない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-010"
    "description_ja": "「圈盤腿」はがに股と読んだ。「凡胎未脫」で銀角大王が溶ける説明は、後の由来説明と勝手に整合させない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-010"
    "description_ja": "発課は占いを行うこと。周易の文王、孔子、桃花女、鬼谷子の四者への呼びかけを保つ。桃花女と占術の伝承についてはDurand-Dastèsの研究を参照したが、日本語読みは直接資料未確認。\
      \ 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-012"
    "description_ja": "「\U00023662戶\U00023662戶」は難しい方言句。本文では煮えやすいという流れに沿い「煮える、煮えるとも」とした。ただし盱眙文藝の方言論（荔枝網2017-04-26）は「圈户」を、皮ごと煮ると食べる肉の量が多くて得だという意味だと説明し、易く煮えるだけという注を批判する。字形・方言との対応は未確定で、この異説を留保する。\
      \ 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-012"
    "description_ja": "受生経は死者のために唱えるとされる経名として残した。既存辞書の受生度亡経と同一の経だとは確認できず、別項目とする。食材八種と剥皮の脅し・八戒の言い換えを省かない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-013"
    "description_ja": "金角大王は「那瓶子不中用」と瓶を非難するが、弟が吸い込まれたのは瓢箪である。底本の不整合を直さず、本人の台詞として保持した。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-019"
    "description_ja": "底本は「東南丙丁火、正對離宮」とする。丙丁は五行の火、離は一般に南に配されるが、「東南」を「南」へ訂正しない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-021"
    "description_ja": "負傷した小妖を悟空が皆殺しにする描写と、人身を得る修行の功が失われたという語り手の哀惜を、救出の美談へ弱めない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-024"
    "description_ja": "「猿乖馬劣」は猿と馬に心意を重ねる修行的表現。「靈胎」や天を離れた由来も原文の詩が示す範囲で訳し、この時点でまだ明かされていない正体を先取りしない。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-027"
    "description_ja": "詩中の「徒弟」は悟空が相手を弟子扱いする侮りで、妖怪が実際の弟子という意味ではない。「累卵擊石」と金・火・五行の比喩を保持した。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-030"
    "description_ja": "女妖怪たちが泣いた後の「道」の主語は省略されるが、「身邊還有這口七星劍」と軍の編成指示から金角大王の発言とした。叔父の名は語り手が紹介する箇所以後、正体の確認も本文の叙述順に従う。\
      \ 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-035"
    "description_ja": "三蔵へ喜びを報告する「報喜道」の主語は省略されている。悟空一人か弟子たちかを本文だけでは確定できないため、話者不明とした。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-036"
    "description_ja": "冒頭は底本に「瞽者」とあるため、目の見えない男と訳し、悟空が見定める前に老君と名づけない。老君が語る所有物五つと童子二人の役割、菩薩が三度借りた事情を保つ。 本文の欠落ではなく解釈上の留保。"
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "segment_ids":
    - "xy-ch35-036"
    "description_ja": "底本は「心中作念道」から「拿去罷」まで一つの鉤括弧内に置く。末尾は老君への直接の返答とも読めるが、底本の引用範囲を優先し全体を悟空の心の声とした。「該他一世無夫」は菩薩に対する悟空の悪口であり、語り手の断定に変えていない。\
      \ 本文の欠落ではなく解釈上の留保。"

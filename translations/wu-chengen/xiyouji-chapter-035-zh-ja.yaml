  "source_text": "豬八戒吊在梁上，聽得他一家子齊哭，忍不住叫道：「妖精，你且莫哭，等老豬講與你聽。先來的孫行者，次來的者行孫，後來的行者孫，返復三字，都是我師兄一人。他有七十二變化，騰那進來，盜了寶貝，裝了令弟。令弟已是死了，不必這等扛喪。快些兒刷淨鍋灶，辦些香蕈、蘑菇、茶芽、竹筍、豆腐、麵觔、木耳、蔬菜，請我師徒們下來，與你令弟念卷《受生經》。」那老魔聞言，心中大怒道：「只說豬八戒老實，原來甚不老實！他倒作笑話兒打覷我。」叫：「小妖，且休舉哀，把豬八戒解下來，蒸得稀爛，等我吃飽了，再去拿孫行者報仇。」沙僧埋怨八戒道：「好麼，我說教你莫多話，多話的要先蒸吃哩。」那獃子也盡有幾分悚懼。傍有一小妖道：「大王，豬八戒不好蒸。」八戒道：「阿彌陀佛！是那位哥哥積陰德的？果是不好蒸。」又有一個妖道：「將他皮剝了，就好蒸。」八戒慌了道：「好蒸，好蒸，皮骨雖然粗糙，湯滾就爛，\U00023662\
    戶\U00023662戶。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch35-1500616"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第035回&oldid=1500616"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    梁から吊るされた八戒（はっかい）は、一家そろって泣くのを聞き、こらえきれずに叫んだ。
    八戒「妖怪よ、まあ泣くな。俺が教えてやる。初めに来た孫行者、次に来た者行孫、後から来た行者孫、三つの字を入れ替えているだけで、みんな俺の兄貴一人なんだ。七十二変化の術があるから、うまく中へ入り込み、宝を盗んで、お前の弟を吸い込んだのさ。弟はもう死んでいる。そんなに大騒ぎして弔うこともないだろう。早く鍋とかまどをきれいに洗って、椎茸、茸、茶の芽、筍、豆腐、麩、木耳、野菜を用意し、俺たち師弟を下ろしてくれよ。弟のために『受生経（じゅしょうきょう）』を一巻読んでやるから。」
    金角大王は聞くなり、腹の底から怒った。
    金角大王「猪八戒（ちょはっかい）は正直者だと思っていたが、まるで正直ではない！　冗談を言って私をからかうつもりか。」
    金角大王は叫んだ。「小妖ども、ひとまず泣くのはやめろ。猪八戒を下ろし、とろとろになるまで蒸せ。腹いっぱい食べてから孫行者を捕らえ、仇を討ってやる。」
    沙悟浄（さごじょう）は八戒を責めた。
    沙悟浄「いいことになりましたね。余計な口をきかないよう言ったでしょう。口数の多い人から、先に蒸して食べられるんですよ。」
    八戒もさすがに、いくらか恐ろしくなった。そばにいた小妖が言った。
    小妖「大王、猪八戒はなかなか蒸し上がりませんよ。」
    八戒「阿弥陀仏（あみだぶつ）！　人知れず善いことをしてくれるのは、どちらの兄さんだい？　本当に、俺はなかなか蒸し上がらないんだ。」
    別の小妖「皮を剥いでしまえば、よく蒸せます。」
    八戒は慌てた。「よく蒸せる、よく蒸せるとも。皮や骨はごつごつしていても、湯が沸けばすぐ柔らかくなる。煮える、煮えるとも！」

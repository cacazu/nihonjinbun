  - "id": "xy-ch94-027"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      薰風拂拂思遲遲，宮院榴葵映日輝。
      玉笛音調驚午夢，芰荷香散到庭幃。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 172
        "line_end": 173
    "translation_ja": |-
      薫る南風はそよそよと吹き、思いはゆったりと漂う。宮中の庭ではザクロとアオイが日に映えて輝く。
      玉の笛の調べが昼の夢を破り、ヒシとハスの香りは庭の帳まで流れてくる。
    "translation_status": "reviewed"
  - "id": "xy-ch94-028"

  - "id": "xy-ch94-036"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      斗指南方白晝遲，槐雲榴火鬥光輝。
      黃鸝紫燕啼宮柳，巧轉雙聲入絳幃。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 194
        "line_end": 195
    "translation_ja": |-
      北斗（ほくと）は南を指し、昼は長い。雲のように茂るエンジュと、火のようなザクロの花が輝きを競う。
      黄色いコウライウグイスと紫の燕が宮中の柳で鳴き、二つの声を巧みに転がし、紅い帳の内へ届ける。
    "translation_status": "reviewed"
  - "id": "xy-ch94-037"

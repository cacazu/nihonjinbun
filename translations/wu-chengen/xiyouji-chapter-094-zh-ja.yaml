    "kind": "verse"
    "origin": "source"
    "source_text": |-
      金井梧桐一葉黃，珠簾不捲夜來霜。
      燕知社日辭巢去，鴈折蘆花過別鄉。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 177
        "line_end": 178
    "translation_ja": |-
      飾りの井戸のそばで青桐の一葉が黄ばみ、珠の簾は巻かれぬまま、夜には霜が降りる。
      燕は社日（しゃにち）を知って巣を辞し、雁は葦の花を折り取り、よその里へ渡ってゆく。
    "translation_status": "reviewed"
  - "id": "xy-ch94-030"

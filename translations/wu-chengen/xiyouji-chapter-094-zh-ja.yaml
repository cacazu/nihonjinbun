      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 159
        "line_end": 162
    "translation_ja": |-
      高くそびえる宮門に暁の光が生まれ、鳳閣（ほうかく）、竜楼（りゅうろう）にはめでたい靄がたなびく。
      春の色は花草の錦繍を細やかに敷き、天の光は遠くから錦の袍を明るく照らす。
      笙（しょう）と歌声が巡るさまは仙人の宴のよう、杯は飛ぶように回り、玉の酒は澄み渡る。
      君も喜び、臣も楽しみ、ともに景色を眺める。内外の国々は永く鎮まり、世は安らかだ。

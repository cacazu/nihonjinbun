    "kind": "verse"
    "origin": "source"
    "source_text": |-
      天雨飛雲暗淡寒，朔風吹雪積千山。
      深宮自有紅爐暖，報道梅開玉滿欄。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 182
        "line_end": 183
    "translation_ja": |-
      天から雨が降り、雲は飛び、薄暗く寒い。北風が雪を吹き、幾千もの山に積もらせる。
      奥深い宮殿には紅く燃える炉の暖かさがある。梅が開き、欄干いっぱいに玉の花が咲いたと知らせが来る。
    "translation_status": "reviewed"
  - "id": "xy-ch94-032"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王見唐僧恣意看詩，便道：「駙馬喜玩詩中之味，必定善於吟哦。如不吝珠玉，請依韻各和一首如何？」長老是個對景忘情，明心見性之意。見國王欽重，命和前韻，他不覺忽詠一句道：「日暖冰消大地鈞。」國王大喜，即召侍衛官：「取文房四寶，請駙馬和完錄下，俟朕緩緩味之。」長老欣然不辭，舉筆而和："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 185
        "line_end": 185
    "translation_ja": |-
      三蔵が心ゆくまで詩を眺めているのを見て、国王は言った。
      国王「お婿殿は、詩の味わいを楽しんでおられる。きっとご自身も詠むのがお得意であろう。珠玉の作を惜しまず、それぞれ同じ韻で一首ずつ和していただけまいか。」
      三蔵には、景色に向かえば俗情を忘れ、心を明らかにして本性を見ようとする思いがあった。国王に尊重され、先の韻に和するよう頼まれると、思わず一節を口にした。
      三蔵「日は暖かく、氷は消え、大地は調う。」
      国王は大喜びし、近衛の役人を呼びつけた。
      国王「文房四宝（ぶんぼうしほう）を持ってまいれ。お婿殿に最後まで詠んで書き留めていただき、朕は後でゆっくりと味わうことにしよう。」
      三蔵は喜んで引き受け、筆を取って和した。
    "translation_status": "reviewed"

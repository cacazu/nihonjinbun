  - "id": "xy-ch94-020"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "徑鋪彩石，檻鑿雕欄。徑鋪彩石，徑邊石畔長奇葩；檻鑿雕欄，檻外欄中生異卉。夭桃迷翡翠，嫩柳閃黃鸝。步覺幽香來袖滿，行沾清味上衣多。鳳臺龍沼，竹閣松軒。鳳臺之上，吹簫引鳳來儀；龍沼之間，養魚化龍而去。竹閣有詩，費盡推敲裁白雪；松軒文集，考成珠玉註青編。假山拳石翠，曲水碧波深。牡丹亭，薔薇架，疊錦鋪絨；茉藜檻，海棠畦，堆霞砌玉。芍藥異香，蜀葵奇豔。白梨紅杏鬥芳菲，紫蕙金萱爭爛熳。麗春花、木筆花、杜鵑花，夭夭灼灼；含笑花、鳳仙花、玉簪花，戰戰巍巍。一處處紅透胭脂潤，一叢叢芳濃錦繡圍。更喜東風回煖日，滿園嬌媚逞光輝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      小道には彩りの石を敷き、柵には彫りの欄干を巡らす。
      小道には彩りの石を敷き、道の脇、石のそばには珍しい花が咲く。
      柵には彫りの欄干を巡らし、柵の外にも欄の中にも不思議な草花が茂る。
      若い桃の花にカワセミは迷い、柔らかな柳の間にはコウライウグイスがちらつく。
      一歩ごとに奥ゆかしい香りが袖に満ち、歩けば清らかな気配が衣に染みる。
      鳳台（ほうだい）に竜沼（りゅうしょう）、竹の楼閣に松のあずまや。
      鳳台の上では簫（しょう）を吹き、鳳凰（ほうおう）を招いてその美しい姿を現させる。
      竜沼では魚を養い、魚は竜と化して去ってゆく。
      竹の楼閣には詩があり、推敲を尽くして白雪（はくせつ）のような高雅な調べを綴る。
      松のあずまやには文章が集い、珠玉の作を吟味して青い竹簡に記す。
      築山の小さな石は青く、曲がり流れる水の碧い波は深い。
      牡丹のあずまや、薔薇の棚には、錦を重ね、柔らかな織物を敷いたよう。
      茉藜（まつり）の柵、海棠の畑には、霞を積み、玉を並べたよう。
      シャクヤクは格別の香りを放ち、タチアオイは目を見張るほど艶やかだ。
      白い梨の花と赤い杏の花は芳しさを競い、紫の蕙（けい）と金色のカンゾウは咲き盛る美を争う。
      麗春花（れいしゅんか）、木筆花（もくひつか）、ツツジの花は、若々しく、照り輝く。
      含笑花（がんしょうか）、ホウセンカ、ギボウシの花は、揺れ動き、すらりと立つ。
      あちらでもこちらでも紅は紅粉のように潤い、群れ咲く花の濃い香りを錦繍が取り巻く。
      何よりうれしいのは東風が暖かな日を連れ戻すこと。庭いっぱいの艶やかさが、競って光を放っている。
    "translation_status": "reviewed"

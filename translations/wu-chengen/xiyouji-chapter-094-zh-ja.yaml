  - "id": "xy-ch94-053"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "姻姻姻，蘭麝香噴。仙子陣，美人群。嬪妃換綵，宮主妝新。雲鬢堆鴉髻，霓裳壓鳳裙。一派仙音嘹喨，兩行朱紫繽紛。當年曾結乘鸞信，今朝幸喜會佳姻。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 228
        "line_end": 228
    "translation_ja": |-
      縁組、縁組、縁組。蘭と麝香（じゃこう）の香りがあふれる。
      仙女の陣、美人の群れ。
      妃たちは彩りの衣に着替え、宮の姫は新たに装う。
      雲のような髪には烏の羽のような黒いまげを結い、虹の衣を鳳凰の裳（も）の上に重ねる。
      一面に仙楽が高らかに響き、二列の朱や紫が色鮮やかだ。
      かつて鸞（らん）に乗って結ばれる約束を交わし、今朝は幸いにも喜ばしい佳縁を迎える。
    "translation_status": "reviewed"
  - "id": "xy-ch94-054"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說國王駕到，那后妃引著公主，並綵女、宮娥，都來迎接。國王喜孜孜，進了昭陽宮坐下。后妃等朝拜畢，國王道：「公主賢女，自初八日結綵拋毬，幸遇聖僧，想是心願已足。各衙門官又能體朕心，各項事俱已完備。今日正是佳期，可早赴合巹之宴，不要錯過時辰。」那公主走近前，倒身下拜，奏道：「父王，乞赦小女萬千之罪，有一言啟奏：這幾日聞得宮官傳說，唐聖僧有三個徒弟，他生得十分醜惡。小女不敢見他，恐見時必生恐懼。萬望父王將他發放出城方好，不致驚傷弱體，反為禍害也。」國王道：「孩兒不說，朕幾乎忘了。果然生得有些醜惡，連日教他在御花園裡留春亭管待。趁今日就上殿，打發他關文，教他出城，卻好會宴。」公主叩頭謝了恩。國王即出駕上殿，傳旨請駙馬共他三位。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 230
        "line_end": 230
    "translation_ja": |-
      さて、国王が来ると、后妃たちは偽の王女を連れ、彩衣の女官や宮女たちと一緒に迎えに出た。国王はうれしそうに昭陽宮へ入り、席に着いた。后妃たちの拝礼が済むと、国王は言った。
      国王「賢い娘よ、八日に楼を飾って毬を投げ、幸いにも聖僧と巡り会ったのだから、願いはかなったことであろう。役所の者たちも朕の心をくみ、何もかも準備を済ませた。今日はまさしく佳き日だ。時刻を逃さぬよう、早く合巹の宴へ赴くがよい。」
      偽の王女は前へ進み、身を伏せて拝礼してから申し上げた。
      偽の王女「父上、娘の幾重もの罪をどうかお許しください。一言申し上げたいことがございます。この数日、宮中の役人から聞きましたところ、唐の聖僧さまには三人のお弟子がおり、それは恐ろしい姿をしているとか。私はとてもお会いできません。顔を見れば、きっと恐ろしくなってしまいます。どうか父上、あの方々を城の外へお帰しになってくださいませ。か弱い身が驚き傷つき、かえって災いとなるようなことを避けたいのでございます。」
      国王「そなたが言わなければ、朕も忘れるところであった。確かにいくらか醜い姿をしておる。ここ数日は御花園の留春亭でもてなしていたのだ。今日のうちに御殿に出て、通行文書を渡し、城の外へ行かせよう。それで心おきなく宴に臨める。」
      偽の王女は頭を下げて恩を謝した。国王はただちに御殿へ出て、婿と三人を招くよう命を下した。
    "translation_status": "reviewed"
  - "id": "xy-ch94-055"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來那唐僧捏指頭兒算日子，熬至十二日，天未明，就與他三人計較道：「今日卻是十二了，這事如何區處？」行者道：「那國王我已識得他有些晦氣，還未沾身，不為大害。但只不得公主見面，若得出來，老孫一覷，就知真假，方才動作。你只管放心。他如今一定來請，打發我等出城。你自應承莫怕，我閃閃身兒就來，緊緊隨護你也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 231
        "line_end": 231
    "translation_ja": |-
      実は三蔵は指を折って日を数え、やっと十二日まで耐えたところだった。夜が明けぬうちから三人に相談していたのである。
      三蔵「とうとう今日は十二日です。この件はどう始末するのだ。」
      悟空「国王に少し不吉な気配があるのは、もう見抜きました。でもまだ身に降りかかってはいないので、大きな害にはなりません。何しろ王女と顔を合わせられないのです。出てくれれば、俺が一目見て本物か偽物か分かりますから、そこで手を打ちます。安心していてください。今にきっと呼びに来て、俺たちを城の外へ出すでしょう。お師匠さまは怖がらず承知しておいてください。俺はちょいと身をかわして戻ってきて、ぴったり付き添い、お守りします。」
    "translation_status": "reviewed"
  - "id": "xy-ch94-056"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們正講，果見當駕官同儀制司來請。行者笑道：「去來，去來。必定是與我們送行，好留師父會合。」八戒道：「送行必定有千百兩黃金白銀，我們也好買些人事回去。到我那丈人家，也再會親耍子兒去耶。」沙僧道：「二哥箝著口，休亂說，只憑大哥主張。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 233
        "line_end": 233
    "translation_ja": |-
      師弟が話していると、果たして御前の役人が儀制司の役人と一緒に招きに来た。悟空は笑った。
      悟空「さあ行こう、行こう。きっと俺たちの見送りだ。お師匠さまだけ残して、婚礼をさせるんだろう。」
      八戒「見送りなら、金銀を千両（りょう）、百両とくれるに違いない。土産を買って帰れるぞ。俺の舅の家にも寄って、また身内と集まって楽しむとしようかね。」
      沙悟浄「二番目の兄貴、口を閉じてください。でたらめを言わず、兄さんの判断に任せましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch94-057"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "遂此將行李、馬匹，俱隨那些官到於丹墀下。國王見了，教請行者三位近前道：「汝等將關文拿上來，朕當用寶、花押，交付汝等，外多備盤纏，送你三位早去靈山見佛。若取經回來，還有重謝。留駙馬在此，勿得懸念。」行者稱謝。遂教沙僧取出關文遞上。國王看了，即用了印，押了花字，又取黃金十錠、白金二十錠，聊達親禮。八戒原來財色心重，即去接了。行者朝上唱個喏道：「聒噪，聒噪。」便轉身要走。慌得個三藏一轂轆爬起，扯住行者，咬響牙根道：「你們都不顧我就去了？」行者把手捏著三藏手掌，丟個眼色道：「你在這裡寬懷歡會，我等取了經，回來看你。」那長老似信不信的，不肯放手。多官都看見，以為實是相別而去。早見國王又請駙馬上殿，著多官送三位出城。長老只得放了手上殿。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 234
        "line_end": 234
    "translation_ja": |-
      そこで荷物も馬も伴い、役人たちに従って朱塗りの階の下へ行った。国王は一行を見ると、悟空たち三人を前へ招いて言った。
      国王「そなたたち、通行文書を出すがよい。朕が宝印を押し、花押（かおう）を書いて返そう。そのほかに旅費も十分用意するから、三人は早く霊山（れいざん）へ行き、仏に会ってくるがよい。経を取って戻ってきたら、さらに厚く礼をしよう。お婿殿はここにお留まりいただく。心配はいらぬ。」
      悟空は礼を言い、沙悟浄に通行文書を出して差し上げるよう言いつけた。国王は目を通し、印を押して花押を書いた。さらに金の延べ棒十錠（じょう）、銀の延べ棒二十錠を出し、ささやかな姻戚の礼とした。もともと金にも色にも欲深い八戒は、すぐに受け取りに行った。悟空は国王に向かって礼の声を上げた。
      悟空「お世話になりました、お世話になりました。」
      そして身を返して去ろうとした。三蔵は慌てて転がるように立ち上がり、悟空を引き留め、歯を食いしばって言った。
      三蔵「お前たち、私を見捨てて行ってしまうのか。」
      悟空は三蔵の手のひらを握り、目配せした。
      悟空「ここで気楽に祝いを楽しんでいてください。俺たちは経を取ったら、また会いに戻りますよ。」
      三蔵は信じてよいものか迷い、手を放そうとしなかった。役人たちはみなその様子を見て、本当に別れて行くのだと思った。すると国王が再び婿を御殿へ招き、役人たちには三人を城外へ送るよう命じた。三蔵はやむなく手を放し、御殿へ上がった。
    "translation_status": "reviewed"
  - "id": "xy-ch94-058"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者三人同眾出了朝門，各自相別。八戒道：「我們當真的走哩？」行者不言語，只管走至驛中。驛丞接入，看茶，擺飯。行者對八戒、沙僧道：「你兩個只在此，切莫出頭。但驛丞問甚麼事情，且含糊答應，莫與我說話。我保師父去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 236
        "line_end": 236
    "translation_ja": |-
      悟空たち三人は役人たちと宮門を出て、それぞれ別れを告げた。
      八戒「俺たち、本当に行っちまうのか。」
      悟空は何も答えず、ただ駅へ歩いていった。駅丞（えきじょう）が迎え入れ、茶を出し、食事を並べた。悟空は八戒と沙悟浄に言った。
      悟空「お前たち二人は、ここにいろ。決して表へ顔を出すな。駅丞に何か尋ねられても、適当に曖昧な返事をして、俺には話しかけるなよ。俺はお師匠さまを守りに行く。」
    "translation_status": "reviewed"
  - "id": "xy-ch94-059"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，拔一根毫毛，吹口仙氣，叫：「變！」即變作本身模樣，與八戒、沙僧同在驛內。真身卻幌的跳在半空，變作一個蜜蜂兒。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 238
        "line_end": 238
    "translation_ja": |-
      さすがの悟空、毛を一本抜き、仙気（せんき）を吹きかけて叫んだ。
      悟空「変われ！」
      毛はたちまち悟空そのままの姿となり、八戒、沙悟浄とともに駅に残った。本体の悟空は、さっと空中へ跳び、一匹の蜜蜂に変わった。その姿は、
    "translation_status": "reviewed"
  - "id": "xy-ch94-060"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      翅黃口甜尾利，隨風飄舞顛狂。最能摘蕊與偷香。度柳穿花搖蕩。
      辛苦幾番淘染，飛來飛去空忙。釀成濃美自何嘗。只好留存名狀。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 239
        "line_end": 240
    "translation_ja": |-
      羽は黄色く、口は甘く、尾は鋭い。風に乗り、激しく舞い踊る。
      花の芯を摘み、香りを盗むのが大得意。柳を越え、花をくぐり、揺れ飛んでゆく。
      幾たびも苦労して蜜を練り上げ、あちらへこちらへ飛び、むなしく働く。
      濃く甘い蜜を醸しても、自分で味わえるものか。ただその名と姿を残すほかはない。
    "translation_status": "reviewed"
  - "id": "xy-ch94-061"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他輕輕的飛入朝中，遠見那唐僧在國王左邊繡墩上坐著，愁眉不展，心存焦燥。徑飛至他毘盧帽上，悄悄的爬及耳邊，叫道：「師父，我來了，切莫憂慮。」這句話只有唐僧聽見，那夥凡人莫想知覺。唐僧聽見，始覺心寬。不一時，宮官來請道：「萬歲，合巹嘉筵已排設在鳷鵲宮中，娘娘與公主俱在宮伺候，專請萬歲同貴人會親也。」國王喜之不盡，即同駙馬進宮而去。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 242
        "line_end": 242
    "translation_ja": |-
      見よ、悟空はそっと朝廷へ飛び込み、国王の左側の刺繍の腰掛けに座る三蔵を遠くから見つけた。師は眉をひそめたまま、心に焦りを抱いている。悟空はまっすぐ毘盧帽（びるぼう）へ飛んでいき、静かに耳元へ這って、呼びかけた。
      悟空「お師匠さま、戻ってきました。何も心配なさらないで。」
      この言葉が聞こえたのは三蔵だけで、そこにいた凡人たちには気づきようもなかった。三蔵はそれを聞いて、初めて胸をなで下ろした。ほどなく宮官が招きに来た。
      宮官「陛下、合巹の宴は鳷鵲宮（しじゃくきゅう）にすっかり整っております。皇后さまと王女さまも宮中でお待ちで、陛下と貴人さまに、ご親族の集いへお越しいただきたいと申しております。」
      国王は喜びもひとしおに、婿とともに宮中へ入っていった。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch94-062"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "邪主愛花花作禍，禪心動念念生愁。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 244
        "line_end": 244
    "translation_ja": |-
      邪な主は花を愛し、その花が災いを生む。
      禅の心に思いが動けば、その思いが憂いを生む。
    "translation_status": "reviewed"
  - "id": "xy-ch94-063"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知唐僧在內宮怎生解脫，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 246
        "line_end": 246
    "translation_ja": "さて、三蔵は内宮でどのように逃れ出るのだろうか。その顛末は次回のお楽しみ。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-01-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "二八と三三は、道教の内丹修行を数で表す象徴的な言い方。二八は陰陽を等しく合わせる表現と解するが、ここにいう三三の前後の具体的な手順・区分は本文だけでは定まらない。数を単なる年齢や回数へ置き換えなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-02-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "孩児と姹女は内丹で身体内の働きを男女に見立てた語と解し、実際の出産や婚姻としない。四相は内丹の四象に通じる象徴と解するが、原文の相を象へ直してはいない。四つの具体的な内訳と三千の功の数え方は、本文だけでは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-03-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「指河為姓」。流沙河にちなむ沙の姓を語るものとして訳した。以前の回にある命名のいきさつと無断で整合させず、本人の自伝の言い方を保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-04-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "陰陽官の暦判断では、八日を戊申、十二日を壬子とする。申を猿に結び付けた「猿猴獻果」も、その人物が述べる吉祥の説明として残す。現実の暦占の効能を保証する説明ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-05-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「十節兒已上了九節七八分」は、全行程を十に分ければ九を過ぎてその先も七、八分ほど進んだ、という言い方。原文の細かな割合を省かず、単に「ほとんど終わった」とはしなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-06-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "上頭は婚礼に備えて髪を結い上げる儀礼。餪子は婚礼に伴う飲食の祝いと解した。餪には婚礼後三日の食物の贈り物・宴という用法もあるが、底本では十二日の婚礼より前に置かれる。一般的な習俗に合わせて物語の日程を直さない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-07-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "茉藜はジャスミン類、麗春花はヒナゲシ類、木筆花はモクレン類、含笑花はオガタマ類の花木を指すと解されるが、ここでの現代的な種の特定は留保する。蕙と萱にも古い植物名としての幅があるため、色の描写を残し、学名を断定しない。鳳台の簫と鳳凰、竜沼の魚と竜は詩の描写のまま訳し、原文にない具体的な伝説の人物は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-08-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "雁が葦を携えて渡るという古い詩的な表現。「折蘆花」の字を保ち、現代の鳥の生態として保証したり、別の動作に置き換えたりしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-09-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「天雨飛雲」。ここでは天から雨が降り、雲が飛ぶと読む。天字を他の文字へ改めたり、雨を無言で雪に統一したりしない。句の切り方には留保を残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-10-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "獣炭には、獣の形に成形した炭と、獣骨から作った炭という説明がある。この詩では炉に使う炭である以上に製法を確定せず、語を残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-11-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「侮著他嘴」。直後の発話制止という文脈から、口をふさぐ動作と解したが、侮の字は原文欄にそのまま残し、捂などへの補訂は施さない。また二十打ちは三蔵の命令であり、取りなしが入るまでに何打ちしたかは記されない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-12-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "楚妹は、毛嬙と対に置かれた楚の美女の呼び名と解した。特定の女性や神女の名は本文に明示されず、別の伝承の人物との同一性は断定しない。毛嬙と王嬙は同じ嬙の字を持つが、別の美女を指す。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-13-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鸞に乗るという句は、仙人のような幸福な婚姻をたたえる詩的表現として訳した。語りの時点で過去の具体的な婚約や人物名が示されたとは扱わず、後の展開をこの詞に補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-14-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "蜜蜂の詞の「淘染」は語義が確定しにくく、採ったものを加工して蜜を醸すという前後の流れから「蜜を練り上げる」と訳した。「名狀」は名と姿を残すと読んだが、句の含意には留保がある。末尾の反語と、働いても自らは味わえないという嘆きを保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-note-15-body"
    "section_id": "chapter-94"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「邪主」は「邪な主」と訳し、誰を指すかを注で一人に決めつけない。「愛花花」「動念念」の語の反復と、花が災いを、念が憂いを生むという対句の構造を残した。"
    "translation_status": "reviewed"

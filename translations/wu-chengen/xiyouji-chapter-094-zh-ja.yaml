  - "id": "xy-ch94-047"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "喜喜喜，欣然樂矣。結婚姻，恩愛美。巧樣宮妝，嫦娥怎比。龍釵與鳳釵，豔豔飛金縷。櫻唇皓齒朱顏，嬝娜如花輕體。錦重重，五彩叢中；香拂佛，千金隊裡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 217
        "line_end": 217
    "translation_ja": |-
      喜び、喜び、喜び。うれしく、楽しいことよ。
      婚姻を結び、愛情は美しく深い。
      巧みに工夫した宮中の装いに、嫦娥もどうして比べられよう。
      竜のかんざし、鳳のかんざし、金の糸はきらきらと飛ぶよう。
      サクランボのような唇、白い歯、紅の顔、花のようにしなやかで軽やかな身。
      錦は幾重にも重なり、五彩の群れの中にある。
      香りはほのかに漂い、高貴な娘たちの列を包む。
    "translation_status": "reviewed"
  - "id": "xy-ch94-048"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "《會詞》云："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 219
        "line_end": 219

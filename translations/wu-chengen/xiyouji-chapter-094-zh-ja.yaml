  - "id": "xy-ch94-038"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      香飄橘綠與橙黃，松柏青青喜降霜。
      籬菊半開攢錦繡，笙歌韻徹水雲鄉。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 199
        "line_end": 200
    "translation_ja": |-
      緑の橘と黄色い橙の香りが漂い、松と柏は青々と、降りる霜を喜ぶ。
      垣根の菊は半ば開き、錦繍を寄せ集めたよう。笙と歌の調べは、水と雲の里へ響き渡る。
    "translation_status": "reviewed"
  - "id": "xy-ch94-039"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "《和冬景詩》曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 202
        "line_end": 202
    "translation_ja": "「冬の景色の詩に和す」には、こうある。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-040"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      瑞雪初晴氣味寒，奇峰巧石玉團山。
      爐燒獸炭煨酥酪，袖手高歌倚翠欄。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 203
        "line_end": 204
    "translation_ja": |-
      めでたい雪の後、空は晴れ初め、冷たい気配が漂う。珍しい峰と巧みな形の岩は、玉を固めた山となる。
      炉には獣炭（じゅうたん）を燃やし、酥（そ）と酪（らく）を温める。両手を袖に入れ、高らかに歌い、翠の欄干にもたれる。
    "translation_status": "reviewed"
  - "id": "xy-ch94-041"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王見和大喜，稱唱道：「好個『袖手高歌倚翠欄』！」遂命教坊司以新詩奏樂，盡日而散。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 206
        "line_end": 206
    "translation_ja": |-
      和した詩を見て国王は大喜びし、声に出して褒めた。
      国王「『両手を袖に入れ、高らかに歌い、翠の欄干にもたれる』とは、なんとよい句だ！」
      そして教坊司に命じ、その新しい詩を音楽に乗せて奏でさせた。こうして一日中楽しみ、宴はお開きとなった。
    "translation_status": "reviewed"
  - "id": "xy-ch94-042"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者三人在留春亭亦盡受用，各飲了幾杯，也都有些酣意。正欲去尋長老，只見長老已同國王在一閣。八戒獃性發作，應聲叫道：「好快活，好自在，今日也受用這一下了。卻該趁飽兒睡覺去也。」沙僧笑道：「二哥忒沒修養。這氣飽飫，如何睡覺？」八戒道：「你那裡知道，俗語云：『吃了飯兒不挺屍，肚裡沒板脂』哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 208
        "line_end": 208
    "translation_ja": |-
      悟空たち三人も留春亭で存分にもてなされ、それぞれ数杯ずつ飲んで、いくらか酔いが回っていた。三蔵を探しに行こうとすると、師はすでに国王と同じ楼閣にいるのが見えた。八戒はいつもの無邪気な性分を出し、いきなり叫んだ。
      八戒「ああ、愉快だ、気楽だ！　今日は俺もたっぷり楽しませてもらった。腹の満ちているうちに、寝に行くとしようぜ。」
      沙悟浄は笑った。
      沙悟浄「二番目の兄貴、ずいぶん修養が足りませんね。こんなに腹がいっぱいで、どうして眠れるのです。」
      八戒「お前には分からねえな。ことわざにも『飯を食って死体のように横にならなきゃ、腹に脂はつかぬ』っていうだろうが。」
    "translation_status": "reviewed"
  - "id": "xy-ch94-043"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧與國王相別，至亭內，嗔責八戒道：「這夯貨，越發村了。這是甚麼去處，只管大呼小叫？倘或惱著國王，卻不被他傷害性命？」八戒道：「沒事，沒事。我們與他親家禮道的，他便不好生怪。常言道：『打不斷的親，罵不斷的鄰。』大家耍子，怕他怎的？」長老叱道，教拿過獃子來，打他二十禪杖。行者果一把揪翻，長老舉杖就打。獃子喊叫道：「駙馬爺爺，饒罪，饒罪。」傍有陪宴官勸住。獃子爬將起來，突突囔囔的道：「好貴人，好駙馬，親還未成，就行起王法來了。」行者侮著他嘴道：「莫胡說，莫胡說，快早睡去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 210
        "line_end": 210
    "translation_ja": |-
      三蔵は国王と別れて亭へ戻ると、八戒を怒って責めた。
      三蔵「このろくでなし、ますます無作法になるばかりだ。ここをどこだと思って、大声でわめいているのです。もし国王を怒らせたら、命を取られてしまうではないか。」
      八戒「平気、平気。俺たちは向こうと姻戚の間柄なんだから、あちらもひどくは怒れませんよ。昔から『殴っても切れない親戚、罵っても切れない隣近所』と言います。みんなで遊んでるだけなのに、何を怖がることがありますか。」
      三蔵は叱りつけ、八戒を引っ立てて、禅杖（ぜんじょう）で二十打ち打つよう命じた。悟空が本当にひとつかみにして引き倒すと、三蔵は杖を振り上げて打ち始めた。
      八戒「駙馬の旦那さま、どうかお許しを、お許しを！」
      そばにいた相伴の役人が取りなしてやめさせた。八戒は這うように起き上がり、ぶつぶつとこぼした。
      八戒「結構な貴人さま、結構な駙馬さまだ。まだ婚礼もしないうちから、もう王法を振りかざすとはね。」
      悟空は八戒の口を押さえた。
      悟空「くだらんことを言うな、言うな。さっさと寝に行け。」
    "translation_status": "reviewed"
  - "id": "xy-ch94-044"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他們又在留春亭住了一宿。到明早，依舊宴樂。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 212
        "line_end": 212
    "translation_ja": "一行はまた留春亭で一晩を過ごした。翌朝になると、やはり宴の楽しみが続いた。"
    "translation_status": "reviewed"
  - "id": "xy-ch94-045"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不覺樂了三四日，正值十二日佳辰。有光祿寺三部各官回奏道：「臣等自八日奉旨，駙馬府已修完，專等妝奩鋪設。合巹宴亦已完備，葷素共五百餘席。」國王心喜，欲請駙馬赴席，忽有內宮官對御前啟奏道：「萬歲，正宮娘娘有請。」國王遂退入內宮，只見那三宮皇后、六院嬪妃，引領著公主，都在昭陽宮談笑。真個是花團錦簇，那一片富麗妖嬈，真勝似天堂月殿，不亞於仙府瑤宮。有喜會佳姻新詞四首為證。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 213
        "line_end": 213
    "translation_ja": |-
      いつしか三日四日と楽しむうちに、十二日の佳き日が来た。光禄寺三部の役人たちが復命した。
      役人たち「私どもは八日にご命令を受け、駙馬のお屋敷の修繕を済ませました。あとは嫁入り道具を運び込んで据えるのを待つばかりです。合巹の宴も整い、肉料理と精進料理を合わせて五百余りの卓をご用意しております。」
      国王はうれしくなり、婿を宴席に招こうとした。そこへ内宮の役人が御前に出て申し上げた。
      内宮の役人「陛下、正宮（せいぐう）の皇后さまがお呼びでございます。」
      国王は内宮へ引き下がった。見ると、三宮の皇后、六院の妃たちは偽の王女を伴い、みな昭陽宮（しょうようきゅう）で談笑している。まことに花が群れ、錦が寄り集まったよう。その富み栄えた艶やかさは、天上の月の宮にも勝り、仙人の玉の宮殿にも劣らなかった。ここに「喜・会・佳・姻」の祝いの新しい詞四首を挙げて、その証しとしよう。
    "translation_status": "reviewed"
  - "id": "xy-ch94-046"

    "source_text": |-
      崢嶸閶闔曙光生，鳳閣龍樓瑞靄橫。
      春色細鋪花草繡，天光遙射錦袍明。
      笙歌繚繞如仙宴，杯斝飛傳玉液清。
      君悅臣歡同玩賞，華夷永鎮世康寧。

    "translation_status": "reviewed"
  - "id": "xy-ch94-051"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "佳佳佳，玉女仙娃。深可愛，實堪誇。異香馥郁，脂粉交加。天臺福地遠，怎似國王家。笑語紛然嬌態，笙歌繚繞喧嘩。花堆錦砌千般美，看遍人間怎若他。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 225
        "line_end": 225
    "translation_ja": |-
      佳し、佳し、佳し。玉の乙女、仙人の娘。
      深く愛らしく、まことに褒めたたえるに足りる。
      不思議なよい香りが豊かに漂い、紅と白粉はとりどりに重なる。
      天台（てんだい）の仙境は遠く、どうしてこの国王の家に並べよう。
      笑い声、語る声は入り乱れて愛らしく、笙と歌は巡り響いてにぎやかだ。
      花を積み、錦を重ねた千様の美。人の世を見尽くしても、どうしてここに及ぶだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch94-052"

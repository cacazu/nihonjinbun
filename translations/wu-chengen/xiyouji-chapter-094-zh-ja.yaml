  - "id": "xy-ch94-017"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      宮殿開軒紫氣高，風吹御樂透青霄。
      雲移豹尾旌旗動，日射螭頭玉珮搖。
      香霧細添宮柳綠，露珠微潤苑花嬌。
      山呼舞蹈千官列，海晏河清一統朝。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 148
        "line_end": 151
    "translation_ja": |-
      宮殿の扉が開き、紫の瑞気（ずいき）が高く昇り、風に乗る宮廷の音楽は青空を貫く。
      雲が移ると豹尾の旗がなびき、日が差すと角のない竜の頭の飾りを照らし、玉の佩び物が揺れる。
      香りの霧は宮中の柳の緑をそっと深め、露の粒は苑の花をかすかに潤す。
      万歳を唱えて舞い拝する千官が並ぶ。海は穏やか、黄河（こうが）は澄み、一つに治まる朝廷。
    "translation_status": "reviewed"
  - "id": "xy-ch94-018"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾文武百官朝罷，又宣：「光祿寺安排十二日會喜佳筵。今日且整春罍，請駙馬在御花園中款玩。」吩咐儀制司領三位賢親去會同館少坐，著光祿寺安排三席素宴去彼奉陪。兩處俱著教坊司奏樂，伏侍賞春景，消遲日也。八戒聞得，應聲道：「陛下，我師徒自相會，更無一刻相離。今日既在御花園飲宴，帶我們去耍兩日，好教師父替你家做駙馬；不然，這個買賣生意弄不成。」那國王見他醜陋，說話粗俗，又見他扭頭捏頸，掬嘴巴，搖耳朵，即像有些風氣，猶恐攪破親事，只得依從。便教：「在永鎮華夷閣裡安排二席，我與駙馬同坐。留春亭上安排三席，請三位別坐，恐他師徒們坐次不便。」那獃子才朝上唱個喏，叫聲：「多謝。」各各而退。又傳旨教內宮官排宴，著三宮六院后妃與公主上頭，就為添妝餪子，以待十二日佳配。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      文武百官の朝拝が済むと、国王はさらに命を下した。
      国王「光禄寺（こうろくじ）は十二日の祝いの宴を整えよ。今日はひとまず春の酒を用意し、お婿殿に御花園でゆっくり楽しんでもらおう。」
      そして儀制司（ぎせいし）には三人の親族を会同館（かいどうかん）へ案内してしばらく休ませるよう命じ、光禄寺には三卓の精進の宴を用意して、そちらへ出向いて相伴するよう言いつけた。両方の席で教坊司（きょうぼうし）に演奏させ、春の景色を楽しみ、長い春の日を過ごせるよう世話をさせるのである。
      八戒はそれを聞き、すぐ口を挟んだ。
      八戒「陛下、俺たち師弟は一緒になってから、片時も離れたことがありません。今日、御花園で酒盛りをするなら、俺たちも連れていって二日ばかり遊ばせてくださいよ。そうすれば師匠をお宅のお婿さんにしてやれます。そうでなければ、この商売はまとまりませんぜ。」
      国王は、その醜い姿に粗野な物言い、さらに頭と首をひねり、口を突き出して耳を動かす様子を見て、どこか気が変になっているようだと思った。縁談を壊されるのも恐ろしく、仕方なく言い分に従った。
      国王「永鎮華夷閣（えいちんかいかく）に二卓を整え、私とお婿殿が一緒に座ることにしよう。留春亭（りゅうしゅんてい）には三卓を設け、そなたたち三人には別に座ってもらう。師弟が一緒では席順に不都合があるかもしれぬからな。」
      それでようやく八戒は国王に向かって声を上げて礼をした。
      八戒「ありがたいことです。」
      一同はそれぞれ退出した。国王はまた、内宮の役人に宴を用意させ、三宮六院（さんぐうりくいん）の后妃たちに王女の髪を婚礼の形に結わせた。嫁入り道具を添え、餪子（だんし）の祝いをして、十二日の佳き婚姻を待つのである。
    "translation_status": "reviewed"

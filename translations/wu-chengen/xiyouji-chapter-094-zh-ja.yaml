    "translation_status": "reviewed"
  - "id": "xy-ch94-049"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "會會會，妖嬈嬌媚。賽毛嬙，欺楚妹。傾國傾城，比花比玉。妝飾更鮮妍，釵環多豔麗。蘭心蕙性清高，粉臉冰肌榮貴。黛眉一線遠山微，窈窕嫣姌攢錦隊。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 221
        "line_end": 221
    "translation_ja": |-
      集い、集い、集い。艶めかしく、愛らしい。
      毛嬙（もうしょう）にも勝り、楚妹（そまい）をも凌ぐ。
      国も城も傾ける美しさ、花にも玉にも比べられよう。
      装いはひときわ鮮やかで、かんざしも耳飾りも艶やかだ。
      蘭や蕙のような心根は清く高く、粉を施した顔と氷のような肌は栄え貴い。
      細く引いた眉は遠山のほのかな姿、しとやかな美女たちが錦の列に集まっている。
    "translation_status": "reviewed"
  - "id": "xy-ch94-050"
    "section_id": "chapter-94"
    "kind": "paragraph"

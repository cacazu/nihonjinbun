  "known_gaps":
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-006"
      "description_ja": "二八と三三は、道教の内丹修行を数で表す象徴的な言い方。二八は陰陽を等しく合わせる表現と解するが、ここにいう三三の前後の具体的な手順・区分は本文だけでは定まらない。数を単なる年齢や回数へ置き換えなかった。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-009"
      "description_ja": "孩児と姹女は内丹で身体内の働きを男女に見立てた語と解し、実際の出産や婚姻としない。四相は内丹の四象に通じる象徴と解するが、原文の相を象へ直してはいない。四つの具体的な内訳と三千の功の数え方は、本文だけでは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-018"
      "description_ja": "上頭は婚礼に備えて髪を結い上げる儀礼。餪子は婚礼に伴う飲食の祝いと解した。餪には婚礼後三日の食物の贈り物・宴という用法もあるが、底本では十二日の婚礼より前に置かれる。一般的な習俗に合わせて物語の日程を直さない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-020"
      "description_ja": "茉藜はジャスミン類、麗春花はヒナゲシ類、木筆花はモクレン類、含笑花はオガタマ類の花木を指すと解されるが、ここでの現代的な種の特定は留保する。蕙と萱にも古い植物名としての幅があるため、色の描写を残し、学名を断定しない。鳳台の簫と鳳凰、竜沼の魚と竜は詩の描写のまま訳し、原文にない具体的な伝説の人物は補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-031"
      "description_ja": "底本は「天雨飛雲」。ここでは天から雨が降り、雲が飛ぶと読む。天字を他の文字へ改めたり、雨を無言で雪に統一したりしない。句の切り方には留保を残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-040"
      "description_ja": "獣炭には、獣の形に成形した炭と、獣骨から作った炭という説明がある。この詩では炉に使う炭である以上に製法を確定せず、語を残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-043"
      "description_ja": "原文は「侮著他嘴」。直後の発話制止という文脈から、口をふさぐ動作と解したが、侮の字は原文欄にそのまま残し、捂などへの補訂は施さない。また二十打ちは三蔵の命令であり、取りなしが入るまでに何打ちしたかは記されない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-049"
      "description_ja": "楚妹は、毛嬙と対に置かれた楚の美女の呼び名と解した。特定の女性や神女の名は本文に明示されず、別の伝承の人物との同一性は断定しない。毛嬙と王嬙は同じ嬙の字を持つが、別の美女を指す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-060"
      "description_ja": "蜜蜂の詞の「淘染」は語義が確定しにくく、採ったものを加工して蜜を醸すという前後の流れから「蜜を練り上げる」と訳した。「名狀」は名と姿を残すと読んだが、句の含意には留保がある。末尾の反語と、働いても自らは味わえないという嘆きを保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch94-1500607"
      "segment_ids":
        - "xy-ch94-062"
      "description_ja": "原文の「邪主」は「邪な主」と訳し、誰を指すかを注で一人に決めつけない。「愛花花」「動念念」の語の反復と、花が災いを、念が憂いを生むという対句の構造を残した。 原文の欠落ではなく、解釈・校訂上の留保。"

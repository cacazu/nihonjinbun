  - "id": "xy-ch94-014"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": "沉沉宮漏，廕廕花香。繡戶垂珠箔，閑庭絕火光。鞦韆索冷空留影，羌笛聲殘靜四方。繞屋有花籠月燦，隔空無樹顯星芒。杜鵑啼歇，蝴蝶夢長。銀漢橫天宇，白雲歸故鄉。正是離人情切處，風搖嫩柳更淒涼。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      宮中の水時計は夜深く時を刻み、花の香りはひそやかに漂う。
      飾り戸には珠の簾が垂れ、静かな庭から火の光が消える。
      ぶらんこの綱は冷え、ただ影だけを残し、羌笛（きょうてき）の余韻も絶えて四方は静まる。
      屋を巡る花々は明るい月光を包み、空を遮る木のないところには星の光が現れる。
      ほととぎすは鳴きやみ、蝶の夢は長く続く。
      天の川は大空を横切り、白雲は故郷へ帰ってゆく。
      まさしく故郷を離れた者の思いが胸に迫るとき、風に揺れる若柳がいっそうもの寂しい。
    "translation_status": "reviewed"

    "source_text": "此時長老見那國王敬重，無計可奈，只得勉強隨喜，誠是外喜而內憂也。坐間見壁上掛著四面金屏，屏上畫著春夏秋冬四景，皆有題詠，皆是翰林名士之詩："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 164
        "line_end": 164
    "translation_ja": "国王にこれほど丁重に扱われては、三蔵にもどうしようもなく、無理にでも喜ぶそぶりをするしかなかった。まことに顔は喜び、心は憂えていたのである。座っていると、壁に四面の金屏風が掛かっているのが見えた。それぞれ春夏秋冬の景色が描かれ、どれにも詩が題されていた。すべて翰林（かんりん）の名士たちの作品である。"
    "translation_status": "reviewed"

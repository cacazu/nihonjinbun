  - "id": "xy-ch94-002"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表孫行者三人隨著宣召官至午門外，黃門官即時傳奏宣進。他三個齊齊站定，更不下拜。國王問道：「那三位是聖僧駙馬之高徒？姓甚名誰？何方居住？因甚事出家？取何經卷？」行者即近前，意欲上殿。傍有護駕的喝道：「不要走，有甚話，立下奏來。」行者笑道：「我們出家人，得一步就進一步。」隨後八戒、沙僧亦俱近前。長老恐他村魯驚駕，便起身叫道：「徒弟啊，陛下問你來因，你即奏上。」行者見他那師父在傍侍立，忍不住大叫一聲道：「陛下輕人輕己。既招我師為駙馬，如何教他侍立？世間稱女夫謂之貴人，豈有貴人不坐之理。」國王聽說，大驚失色，欲退殿，恐失了觀瞻。只得硬著膽，教近侍的取繡墩來，請唐僧坐了。行者才奏道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、悟空（ごくう）たち三人は召しに来た役人に従って午門（ごもん）の外へ着いた。黄門官（こうもんかん）がただちに取り次ぎ、入るよう命が下った。三人は並んで立ったまま、拝礼もしなかった。
      国王「そなたたち三人が、聖僧であるお婿殿の高弟か。姓は何、名は何と申す。どこに住み、何があって出家し、どのような経を取りに行くのだ。」
      悟空が前へ進み、御殿に上がろうとすると、そばの護衛が怒鳴った。
      護衛「動くな。話があるなら、その場に立って申し上げよ。」
      悟空は笑った。
      悟空「我々出家の者は、一歩進めるなら一歩進むものですよ。」
      八戒（はっかい）と沙悟浄（さごじょう）も後に続いて前へ出た。三蔵（さんぞう）は、弟子たちの無作法が国王を驚かせはしないかと案じ、立ち上がって呼びかけた。
      三蔵「弟子たちよ、陛下がお前たちの来歴をお尋ねです。すぐに申し上げなさい。」
      師が脇に立って仕えているのを見た悟空は、たまらず声を張り上げた。
      悟空「陛下、人を軽んじるのは、ご自分を軽んじることです。師を駙馬（ふば）に迎えたというのに、なぜ脇に立たせておくのです。世間では娘の婿を貴人と呼ぶでしょう。貴人を座らせないなどという道理がありますか。」
      国王は聞くなり顔色を失った。御殿から引き下がりたかったが、人前で威厳を失うのも恐ろしい。やむなく気を強く持ち、近侍に刺繍の腰掛けを持ってこさせ、三蔵に座ってもらった。そこでようやく悟空が来歴を申し上げた。
    "translation_status": "reviewed"
  - "id": "xy-ch94-003"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "「老孫祖居東勝神洲傲來國花果山水簾洞。父天母地，石裂吾生。曾拜至人，學成大道。復轉仙鄉，嘯聚在洞天福地。下海降龍，登山擒獸。消死名，上生籍，官拜齊天大聖。玩賞瓊樓，喜遊寶閣。會天仙，日日歌歡；居聖境，朝朝快樂。只因亂卻蟠桃宴，大反天宮，被佛擒伏。困壓在五行山下，饑餐鐵彈，渴飲銅汁，五百年未嘗茶飯。幸我師出東土，拜西方，觀音教令脫天災，離大難，皈正在瑜伽門下。舊諱悟空，稱名行者。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 124
        "line_end": 124
    "translation_ja": "悟空「私の故郷は、東勝神洲（とうしょうしんしゅう）、傲来国（ごうらいこく）の花果山（かかざん）、水簾洞（すいれんどう）です。天を父、地を母とし、石が裂けてこの身が生まれました。かつて道を極めた人を師と仰ぎ、大道（だいどう）を学び終えると、仙境の故郷へ帰り、恵まれた洞天（どうてん）に仲間を呼び集めました。海に潜って竜を降し、山に登って獣を捕らえ、死者の名簿から名を消し、長生の名簿へ名を載せ、斉天大聖（せいてんたいせい）に任じられました。玉の楼閣を眺め、宝の御殿を喜んで巡り、天仙（てんせん）たちと会っては日ごとに歌い楽しみ、聖なる境に住んでは朝ごとに喜びを味わいました。ただ、蟠桃（ばんとう）の宴を乱し、天宮（てんきゅう）に大いに逆らったため、仏に捕らえられ、五行山（ごぎょうざん）の下に押し込められたのです。飢えれば鉄の丸を食い、渇けば溶けた銅を飲み、五百年もの間、茶も飯も口にしませんでした。幸い師が東土（とうど）を出て西方へ礼拝に向かわれ、観音（かんのん）のお導きによって天の災いを逃れ、大難を離れ、瑜伽（ゆが）の門下に帰依いたしました。以前からの法名を悟空と申し、行者（ぎょうじゃ）と称しております。」"
    "translation_status": "reviewed"
  - "id": "xy-ch94-004"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王聞得這般名重，慌得下了龍床，走將來，以御手挽定長老道：「駙馬，也是朕之天緣，得遇你這仙姻仙眷。」三藏滿口謝恩，請國王登位。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      これほど名高い者と聞いた国王は、慌てて玉座を降り、三蔵のところへ歩み寄った。そして自らの手でしっかりと三蔵を取り、言った。
      国王「お婿殿、これも朕に天の授けた縁であろう。そなたという仙人の婿、仙人の親族を迎えられるとは。」
      三蔵はしきりに恩を謝し、国王に玉座へ戻るようお願いした。
    "translation_status": "reviewed"
  - "id": "xy-ch94-005"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "復問：「那位是第二高徒？」八戒掬嘴揚威道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      国王「それでは、二番目の高弟はどなたかな。」
      八戒は口を突き出し、威勢を示して語った。
    "translation_status": "reviewed"
  - "id": "xy-ch94-006"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "「老豬先世為人，貪歡愛懶。一生混沌，亂性迷心。未識天高地厚，難明海闊山遙。正在幽閑之際，忽然遇一真人。半句話，解開孽網；兩三言，劈破災門。當時省悟，立地投師，謹修二八之工夫，敬煉三三之前後。行滿飛昇，得超天府。荷蒙玉帝厚恩，官賜天蓬元帥，管押河兵，逍遙漢闕。只因蟠桃酒醉，戲弄嫦娥，謫官銜，遭貶臨凡；錯投胎，托生豬像。住福陵山，造惡無邊。遇觀音，指明善道。皈依佛教，保護唐僧。徑往西天，拜求妙典。法諱悟能，稱為八戒。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 129
        "line_end": 129
    "translation_ja": "八戒「俺は前の世では人間で、遊びと怠けることが大好きでした。一生ぼんやりと過ごし、性を乱して心を迷わせ、天の高さも地の厚さも知らず、海の広さも山の遠さも分かりませんでした。そうして気ままに暮らしていたころ、ふと一人の真人（しんじん）に出会ったのです。半句の言葉で罪の網が解かれ、二言三言で災いの門が打ち破られました。俺はその場で悟り、ただちに弟子入りし、謹んで二八（にはち）の修練を行い、うやうやしく三三（さんさん）の前後を練りました。修行が満ちると飛び立って天の府へ昇り、玉帝（ぎょくてい）の厚いお恵みを受け、天蓬元帥（てんぽうげんすい）の官職を授かりました。天の川の水軍を指揮し、天宮で気ままに暮らしていたのです。ところが蟠桃の酒に酔い、嫦娥（じょうが）に戯れかかったため、官位を落とされて下界へ流されました。生まれ変わる胎を間違え、豚の姿に生まれてしまったのです。福陵山（ふくりょうざん）に住み、限りもなく悪事を重ねていましたが、観音にお会いして善い道を示され、仏教に帰依いたしました。唐（とう）の僧をお守りして、まっすぐ西天（さいてん）へ向かい、尊い経典を拝み求めております。法名は悟能（ごのう）、八戒と呼ばれております。」"
    "translation_status": "reviewed"
  - "id": "xy-ch94-007"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王聽言，膽戰心驚，不敢觀覷。這獃子越弄精神，搖著頭，掬著嘴，撐起耳朵，呵呵大笑。三藏又怕驚駕，即叱道：「八戒收斂！」方才叉手拱立，假扭斯文。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      国王は聞いて肝を冷やし、八戒をまともに見ることもできなかった。八戒はますます調子に乗り、頭を振り、口を突き出し、耳を立てて、はっはっと大笑いした。三蔵はまた国王が驚くのを案じ、叱りつけた。
      三蔵「八戒、慎みなさい！」
      そこでやっと八戒は手を胸の前に組み、お行儀のよいふりをして立った。
    "translation_status": "reviewed"
  - "id": "xy-ch94-008"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又問：「第三位高徒，因甚皈依？」沙和尚合掌道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      国王「三番目の高弟は、何があって帰依したのだ。」
      沙悟浄は合掌して答えた。
    "translation_status": "reviewed"
  - "id": "xy-ch94-009"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "「老沙原係凡夫，因怕輪迴訪道。雲遊海角，浪蕩天涯。常得衣缽隨身，每煉心神在舍。因此虔誠，得逢仙侶。養就孩兒，配緣姹女。工滿三千，合和四相。超天界，拜玄穹，官授捲簾大將，侍御鳳輦龍車，封號將軍。也為蟠桃會上，失手打破玻璃盞，貶在流沙河，改頭換面，造孽傷生。幸喜菩薩遠遊東土，勸我皈依，等候唐朝佛子，往西天求經果正。從立自新，復修大覺。指河為姓，法諱悟淨，稱名和尚。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 134
        "line_end": 134
    "translation_ja": "沙悟浄「私ももとは凡人でしたが、輪廻を恐れて道を訪ねました。海の果てまで雲のように旅し、地の果てまでさすらい、いつも衣と鉢を携え、心と神を身の内に保って鍛えました。その真心によって仙人の友に巡り会い、孩児（がいじ）を養い成し、姹女（たじょ）と結び合わせ、三千の功を満たして四相（しそう）を一つに調えました。天界へ昇り、玄穹（げんきゅう）に拝謁し、捲簾大将（けんれんたいしょう）に任じられ、天子の鳳輦（ほうれん）や竜車（りゅうしゃ）のそばに仕え、将軍の号を授かりました。しかし私も蟠桃の宴で手を滑らせ、玻璃（はり）の杯を割ってしまい、流沙河（りゅうさが）へ落とされたのです。姿も顔も変わり、罪を重ねて生き物を害しました。幸い菩薩が遠く東土へ旅をなさった折、帰依をお勧めくださり、唐から来る仏弟子を待って、西天へ経を求め、正しい果を得るようお教えくださいました。それから心を入れ替え、再び大覚（だいかく）を修めております。川にちなんだ姓を定め、法名を悟浄（ごじょう）、和尚（おしょう）と称しております。」"
    "translation_status": "reviewed"
  - "id": "xy-ch94-010"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王見說，多驚多喜：喜的是女兒招了活佛，驚的是三個實乃妖神。正在驚喜之間，忽有正臺陰陽官奏道：「婚期已定本年本月十二日壬子辰良，周堂通利，宜配婚姻。」國王道：「今日是何日辰？」陰陽官奏：「今日初八，乃戊申之日，猿猴獻果，正宜進賢納事。」國王大喜，即著當駕官打掃御花園館閣樓亭，且請駙馬同三位高徒安歇，待後安排合巹佳筵，著公主匹配。眾等欽遵，國王退朝，多官皆散不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      国王はその話に、驚くと同時に大いに喜んだ。娘が生き仏を婿に迎えたのはうれしいが、三人の弟子はまさしく妖神なのが恐ろしい。その驚きと喜びのさなか、暦をつかさどる役所の陰陽官（おんようかん）が進み出て申し上げた。
      陰陽官「婚礼の日は、今年今月十二日、壬子（じんし）の吉日と定まりました。周堂（しゅうどう）もすべて差し障りがなく、婚姻に適しております。」
      国王「今日は何日で、どの干支に当たるのだ。」
      陰陽官「今日は八日、戊申（ぼしん）の日でございます。猿が果実を献じる日に当たり、賢人を迎え、用件をお受けになるのにちょうどよろしゅうございます。」
      国王は大喜びし、御前の役人に命じて御花園（ぎょかえん）の館、楼閣、あずまやを清めさせた。そしてひとまず婿と三人の高弟にそこで休んでもらい、後に合巹（ごうきん）の盛大な宴を整えて、王女と夫婦にさせることにした。一同は謹んで命に従った。国王は朝議を終え、役人たちもみな退出した。こちらの話はいったん置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch94-011"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏師徒們都到御花園，天色漸晚，擺了素膳。八戒喜道：「這一日也該吃飯了。」管辦人即將素米飯、麵飯等物，整擔挑來。那八戒吃了又添，添了又吃，直吃得撐腸拄腹，方才住手。少頃，又點上燈，設鋪蓋，各自歸寢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      さて、三蔵一行はそろって御花園に入った。日が暮れてくると精進料理が並んだ。
      八戒は喜んだ。
      八戒「今日もようやく飯にありつけるってわけだ！」
      世話役たちは、精進の米飯や小麦粉の料理などを天秤棒いっぱいに担いで運んできた。八戒は食べてはお代わりし、お代わりしては食べ、腸も腹も張りきるまで詰め込んで、ようやく手を止めた。やがて明かりがともされ、寝具も整えられ、それぞれ寝所へ入った。
    "translation_status": "reviewed"
  - "id": "xy-ch94-012"
    "section_id": "chapter-94"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老見左右無人，卻恨責行者，怒聲叫道：「悟空，你這猢猻，番番害我。我說只去倒換關文，莫向彩樓前去，你怎麼直要引我去看看？如今看得好麼，卻惹出這般事來，怎生是好？」行者陪笑道：「師父說：『先母也是拋打繡毬，遇舊緣，成其夫婦。』似有慕古之意，老孫才引你去。又想著那個給孤布金寺長老之言，就此檢視真假。適見那皇帝之面，略有些晦暗之色，但只未見公主何如耳。」長老道：「你見公主便怎的？」行者道：「老孫的火眼金睛，但見面，就認得真假善惡，富貴貧窮，卻好施為，辨明邪正。」沙僧與八戒笑道：「哥哥近日又學得會相面了。」行者道：「相面之士，當我孫子罷了。」三藏喝道：「且休調嘴。只是他如今定要招我，果何以處之？」行者道：「且到十二日會喜之時，必定那公主出來參拜父母，等老孫在傍觀看。若還是個真女人，你就做了駙馬，享用國內之榮華也罷。」三藏聞言，越生嗔怒，罵道：「好猢猻！你還害我哩。卻是悟能說的，我們十節兒已上了九節七八分了，你還把熱舌頭鐸我。快早夾著，你休開那臭口；再若無禮，我就念起咒來，教你了當不得。」行者聽說念咒，慌得跪在面前道：「莫念，莫念。若是真女人，待拜堂時，我們一齊大鬧皇宮，領你去也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      三蔵は周りに人がいなくなったのを見ると、恨めしげに悟空を責め、怒鳴った。
      三蔵「悟空、この猿め。お前はいつも私を困らせる。私は通行文書の手続きだけをしに行き、飾り楼の前へは行くなと言ったのに、どうしてぜひ見物しようと連れていったのです。さあ、見物してよかったか。こんな面倒を起こしてしまって、いったいどうするのだ。」
      悟空は愛想笑いを浮かべた。
      悟空「お師匠さまは『亡き母も繍毬（しゅうきゅう）を投げ、前世からの縁に出会って夫婦となった』とおっしゃいました。昔を慕うお気持ちでもあるのかと思って、俺はお連れしたんですよ。それに給孤布金寺（ぎっこふきんじ）の長老の話も思い出して、これを機に本物か偽物か見極めようとしたのです。さっきあの王さまの顔を見たら、少し暗い相が出ていました。ただ、王女がどんな様子なのかはまだ見ていません。」
      三蔵「王女を見たら、どうするというのです。」
      悟空「俺の火眼金睛（かがんきんせい）なら、顔を見るだけで真偽も善悪も、富貴も貧窮も分かります。それでこそ手の打ちようもあり、邪と正をはっきり見分けられるんですよ。」
      沙悟浄と八戒は笑った。
      沙悟浄と八戒「兄貴、近ごろは人相を見る術まで覚えたのか。」
      悟空「人相見なんて、俺の孫にしかなれないね。」
      三蔵「口先でふざけるのはやめなさい。王はどうしても私を婿にするつもりなのです。結局どう対処するのだ。」
      悟空「十二日の祝いの日まで待ちましょう。王女はきっと出てきて父母に拝礼するでしょうから、俺がそばで見ておきます。本物の女だったら、お師匠さまは駙馬になって、この国の栄華を楽しむのもよいでしょう。」
      三蔵は聞くと、いよいよ怒りを募らせて罵った。
      三蔵「よくも言ったな、この猿め！　まだ私を苦しめるつもりか。悟能も言ったとおり、十の道のりのうち、もう九と七、八分まで来たというのに、その熱い舌で私をからかうのか。さっさと口を閉じなさい。その臭い口を開くな。これ以上無礼をするなら、呪文を唱え、お前をひどい目に遭わせますよ。」
      呪文と聞いた悟空は、慌てて師の前にひざまずいた。
      悟空「唱えないでください、唱えないで。本物の女だったら、婚礼の拝礼が始まるときに、俺たちみんなで皇宮に大騒ぎを起こして、お師匠さまを連れ出しますから。」
    "translation_status": "reviewed"

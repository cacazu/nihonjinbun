  - "id": "xy-ch94-034"
    "section_id": "chapter-94"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      日暖冰消大地鈞，御園花卉又更新。
      和風膏雨民沾澤，海晏河清絕俗塵。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 189
        "line_end": 190
    "translation_ja": |-
      日は暖かく、氷は消え、大地は調う。御苑の花々も、また新しくなる。
      和やかな風と恵みの雨に民は潤い、海は静まり、黄河は澄み、俗世の塵は絶える。
    "translation_status": "reviewed"
  - "id": "xy-ch94-035"

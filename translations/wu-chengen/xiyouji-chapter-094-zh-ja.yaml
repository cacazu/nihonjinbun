    "origin": "source"
    "source_text": |-
      周天一氣轉洪鈞，大地熙熙萬象新。
      桃李爭妍花爛熳，燕來畫棟疊香塵。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch94-1500607"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?oldid=1500607&title=西遊記/第094回"
        "line_start": 167
        "line_end": 168
    "translation_ja": |-
      天を巡る一つの気が造化（ぞうか）の大きなろくろを回し、大地は和らぎ、万物は新たになる。
      桃と李は美を競って咲き誇り、燕が彩りの梁へ来て、香る塵を幾重にも運ぶ。
    "translation_status": "reviewed"
  - "id": "xy-ch94-026"

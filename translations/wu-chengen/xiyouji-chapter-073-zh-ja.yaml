  "known_gaps":
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-001"
      "description_ja": "回題の「心主」は心を代表する悟空を指す寓意的表現。底本では「魔」の後に異文注「一作『迷』」が本文表示へ続けて入るため、原文欄にそのまま保存し、訳題でも異文の情報を分けて残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-003"
      "description_ja": "「劉阮」は、天台山で仙女に出会ったという劉晨・阮肇の故事。劉という姓だけで既出の別人物に結び付けず、二人の名を展開した。法鼓文理学院の阮肇の人名資料と、橋本公民館の公開資料の検索表示にある「劉阮天台」の説明を照合した。後者のPDF本文の直接取得は404エラーだった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-004"
      "description_ja": "底本の「撒貨頭口」は、撒和の異表記として家畜に飼料を与える意に解した。早稲田大学リポジトリ所載「中国文学研究」第十三期の論文の検索表示は、この一節を挙げてその語義を説明する。PDF本文の直接取得は429エラーで成功しておらず、検索表示での照合にとどまる。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-006"
      "description_ja": "底本は「瓜鐵」。顔の色や形を表す難語だが、確かな語義・異文を確認できないため、通行本の別字などへ置き換えず原字に対応する「瓜鉄」を残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-006"
      "description_ja": "回回と達達は中国の古い民族呼称。この人物の鼻や口をそれらにたとえる原文の表現を保存したもので、現実の集団全体の容貌を説明するものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-010"
      "description_ja": "これは女の妖怪が述べる告発。衣服の奪取を長い口の和尚に帰すことも含め、前の回の語りと一致しない点を、その人物の発言として保持した。翻訳者が客観的な事実へ直したり、訴えの性行為の含意を削ったりしていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-010"
      "description_ja": "「一打三分低」は、先に人を殴る側が道理上の立場を失うという諺。教育部「重編國語辭典修訂本」の検索表示で、この一節を例文とする説明を確認した。直接ページ取得はCache missで、成功とは記録していない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-013"
      "description_ja": "「分」「釐」はここでは重さの小単位で、一分は十釐。十二釐を四人分に分け、一人三個の棗へ一釐ずつ詰める数量を保存する。直前の毒薬を作る詩の三分も重量であり、長さの分とは別義。現代のグラムへ確定換算せず、物語の毒薬描写を現実の製法や効能の保証とはしない。この短い発言は、底本の「內一女子急拿了一把等子道」に従って秤を持つ女に帰した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-019"
      "description_ja": "ここで土地神が七人の本相を初めて明言する。それまでは「女の妖怪」と呼び、本人たちの種族を説明や注の起点から先取りしない。到着から十年未満と、土地神が調べた三年前は異なる時点として保った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-026"
      "description_ja": "底本は「撞破金光」と記すが、この発言の時点でも光の囲いから脱していない。衝突によって光を破ったという動作と、脱出に成功しない展開をともに保持し、「破れなかった」等へ無断訂正しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-028"
      "description_ja": "鯪鯉鱗は、この底本で穿山甲の別名として示される語。通行形「鯪鯉」へ短縮せず残した。詩の薬性への言及も文学上の記述として保存し、現実の医薬的効能を保証する説明にはしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-030"
      "description_ja": "大海を恐れず渡ってきたのに、小さな溝で風難に遭うという逆転の比喩。底本の一つの発話は散文段落から詩へまたがるが、日本語では直前の呼びかけと詩に分け、どちらも悟空の声として明示した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-032"
      "description_ja": "悟空の発言は三蔵の死を嘆いているが、語り手が死を確定したわけではない。「三人、馬を合わせて四口」は捕らわれた命の数であり、馬も毒茶を飲んだとの記述を追加しない。戦いの五、六十合を、ここで悟空は六十合と述べている。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-033"
      "description_ja": "底本の字は「黎山老姆」。既出の黎山老母と同じ女仙として、通常名を維持する。喪服の女との同定は悟空が姿を見たこの箇所で初めて行い、直前の空の声にはまだ名を付けない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-037"
      "description_ja": "洞内で見つかった女道士が毘藍婆だと明かす詩末の呼称。道教的な装束と仏教の三乗・四諦・菩薩という語彙は混在するまま残す。注の起点も名前の開示より後に置く。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-039"
      "description_ja": "原文は「乃我小兒日眼裡煉成的」。日眼という神秘的な語を保持し、針を作る場所や具体的な製法の説明は補わない。「太陽の眼」とも、息子の眼に関わる表現とも取れるが、この訳ではどちらかへ確定していない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-042"
      "description_ja": "毘藍婆が雌鶏であるという結論は、息子の昴日星官が雄鶏であることから悟空が推し量ったもの。本人が本相を現した事実や、語り手による明示へ格上げしない。針の説明もここでは悟空による言い直しである。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch73-1500620"
      "segment_ids":
        - "xy-ch73-044"
      "description_ja": "「了性」は本性を悟ることをいう寓意表現。回題の心の主と響き合うものとして訳した。悟空が一人で妖怪を倒したという新しい出来事を付け加えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

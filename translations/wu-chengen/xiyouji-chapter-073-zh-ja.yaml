    "source_text": "那道士換了一件衣服，虛禮謙恭，走將出去，請唐僧等又至客位坐下，道：「老師父莫怪。適間去後面吩咐小徒，教他們挑些青菜、蘿蔔，安排一頓素齋供養，所以失陪。」三藏道：「貧僧素手進拜，怎麼敢勞賜齋？」道士笑云：「你我都是出家人，見山門就有三升俸糧，何言素手？敢問老師父，在何寶山？到此何幹？」三藏道：「貧僧乃東土大唐駕下差往西天大雷音寺取經者。卻才路過仙宮，竭誠進拜。」道士聞言，滿面生春道：「老師乃忠誠大德之佛，小道不知，失於遠候，恕罪，恕罪。」叫：「童兒，快去換茶來，一廂作速辦齋。」那小童走將進去，眾女子招呼他來道：「這裡有現成好茶，拿出去。」那童子果然將五鍾茶拿出。道士連忙雙手拿一個紅棗兒茶鍾奉與唐僧。他見八戒身軀大，就認做大徒弟；沙僧認做二徒弟；見行者身量小，認做三徒弟。所以第四鍾才奉與行者。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      道士は着替えをし、うわべだけは礼儀正しくへりくだって外へ出ると、三蔵たちを再び客の席へ招いた。
      道士「長老さま、お許しください。先ほどは奥で弟子たちに、青菜や大根を選んで、精進料理を一膳ご用意するよう申しつけておりましたので、お相手ができませんでした。」
      三蔵「私は手ぶらでご挨拶に伺いましたのに、食事までいただいては、あまりに申し訳ありません。」
      道士は笑った。
      道士「お互い出家の身です。山門を見れば三升の食糧にありつけるもの。手ぶらなどとおっしゃることはありません。失礼ながら、長老さまはどちらの山で修行され、何のご用でこちらへ。」
      三蔵「私は東土（とうど）大唐（だいとう）の皇帝陛下の命で、西天の大雷音寺（だいらいおんじ）へ経を取りに参る者です。たまたまこちらの仙宮のそばを通り、真心からご挨拶に伺いました。」
      道士は聞くと、満面に笑みを浮かべた。
      道士「長老さまは忠誠にして徳高き仏でいらしたのですね。存じ上げず、遠くまでお迎えにも上がらず、どうかお許しください、お許しください。」
      さらに声を上げた。
      道士「童子、早く茶を替えて来い。食事の用意も急ぐのだ。」
      童子が奥へ入ると、女の妖怪たちが呼び寄せた。
      女の妖怪たち「ここに、もうおいしいお茶ができているよ。持ってお行き。」
      童子は五つの茶碗を運び出した。道士は急いで、赤い棗の入った茶碗を両手で三蔵へ差し出した。八戒は体が大きいので一番弟子だと思い、沙悟浄を二番弟子と見なし、悟空は背が低いので三番弟子だと思った。それで四つ目の茶碗を、ようやく悟空に差し出したのである。
    "translation_status": "reviewed"
  - "id": "xy-ch73-015"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者眼乖，接了茶鍾，早已見盤子裡那茶鍾是兩個黑棗兒。他道：「先生，我與你穿換一杯。」道士笑道：「不瞞長老說，山野中貧道士，茶果一時不備，才然在後面親自尋果子，止有這十二個紅棗，做四鍾茶奉敬。小道又不可空陪，所以將兩個下色棗兒作一杯奉陪。此乃貧道恭敬之意也。」行者笑道：「說那裡話？古人云：『在家不是貧？路貧貧殺人。』你是住家兒的，何以言貧！像我們這行腳僧，才是真貧哩。我和你換換。我和你換換。」三藏聞言道：「悟空，這仙長實乃愛客之意，你吃了罷，換怎的？」行者無奈，將左手接了，右手蓋住，看著他們。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空は目が利く。茶碗を受け取るときには、すでに盆に残った茶碗だけ、黒い棗が二個入っていると見抜いていた。
      悟空「先生、俺のと一杯取り替えてくれ。」
      道士は笑った。
      道士「包み隠さず申しますと、山野に住む貧しい道士で、急には茶菓子もそろいません。先ほど自分で奥を探したところ、赤い棗が十二個しかなく、四杯の茶にして皆さまにお出ししました。私だけ何も飲まずにお相伴するわけにもいかず、質の落ちる棗二個で一杯作ったのです。これも皆さまを敬ってのことでございます。」
      悟空は笑った。
      悟空「何を言うんだ。昔の人も『家にいての貧乏が、何ほどの貧乏か。旅先の貧乏こそ、人を殺すほどつらい』と言う。あんたは住む家があるのに、どうして貧しいなどと言える。俺たちのような旅の僧こそ、本当の貧乏さ。取り替えてくれよ。取り替えてくれよ。」
      三蔵が聞いて言った。
      三蔵「悟空、この仙人さまは本当に客を大事にしてくださっているのだ。いただきなさい。どうして替えてもらうのです。」
      悟空は仕方なく左手で受け取り、右手で上を覆ったまま、一同を見ていた。
    "translation_status": "reviewed"
  - "id": "xy-ch73-016"

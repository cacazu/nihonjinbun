    "translation_ja": |-
      第七十三回
      情は古い恨みから災いの毒を生み、心の主は魔に遭うも幸いに光を破る〔「魔」は「迷」とするものもある〕
    "translation_status": "reviewed"
  - "id": "xy-ch73-002"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說孫大聖扶持著唐僧，與八戒、沙僧奔上大路，一直西來。不半晌，忽見一處樓閣重重，宮殿巍巍。唐僧勒馬道：「徒弟，你看那是個甚麼去處？」行者舉頭觀看，忽然見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 119
        "line_end": 119
    "translation_ja": |-
      さて悟空（ごくう）は三蔵（さんぞう）を助け、八戒（はっかい）、沙悟浄（さごじょう）とともに大道へ出て、まっすぐ西へ進んだ。ほどなく、楼閣が幾重にも重なり、宮殿が高々とそびえる場所が見えてきた。三蔵は馬を止めて言った。
      三蔵「お前たち、あれは何の建物だろう。」
      悟空が顔を上げて眺めると、こんな景色が目に入った。
    "translation_status": "reviewed"
  - "id": "xy-ch73-003"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "山環樓閣，溪遶亭臺。門前雜樹密森森，宅外野花香豔豔。柳間棲白鷺，渾如煙裡玉無瑕；桃內囀黃鶯，卻是火中金有色。雙雙野鹿，忘情閑踏綠莎茵；對對山禽，飛語高鳴紅樹杪。真如劉阮天臺洞，不亞神仙閬苑家。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      山は楼閣を取り囲み、流れはあずまやを巡る。
      門前にはさまざまな木が鬱蒼と茂り、屋敷の外には野の花が香り鮮やかに咲く。
      柳にとまる白鷺は、霞の中の傷なき玉さながら。
      桃の木でさえずる黄鶯は、炎の中で色を放つ黄金のよう。
      野の鹿は二頭ずつ、何の憂いもなく緑の草の敷物をのんびり踏み、
      山の鳥はつがいとなって、紅い木々の梢を飛び交い、高らかに鳴く。
      まさに劉晨（りゅうしん）・阮肇（げんちょう）の入った天台（てんだい）の洞、仙人の住む閬苑（ろうえん）にも劣らない。
    "translation_status": "reviewed"
  - "id": "xy-ch73-004"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者報道：「師父，那所在也不是王侯第宅，也不是豪富人家，卻像一個庵觀寺院。到那裡方知端的。」三藏聞言，加鞭促馬。師徒們來至門前觀看，門上嵌著一塊石板，上有「黃花觀」三字。三藏下馬。八戒道：「黃花觀乃道士之家，我們進去會他一會也好，他與我們衣冠雖別，修行一般。」沙僧道：「說得是。一則進去看看景致，二來也當撒貨頭口。看方便處，安排些齋飯，與師父吃。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      悟空「お師匠さま、あそこは王侯の屋敷でも、大金持ちの家でもありません。庵や道観、お寺のように見えます。行ってみれば、はっきり分かるでしょう。」
      三蔵はそれを聞いて鞭を加え、馬を急がせた。一行が門前へ来て見ると、門に石の額がはめ込まれ、「黄花観（こうかかん）」の三文字があった。三蔵は馬から下りた。
      八戒「黄花観なら、道士の住む所だな。中へ入って会ってみるのもいい。着る物や冠は違っても、修行するのは同じことだ。」
      沙悟浄「そのとおりだ。一つには中の景色を見物できるし、二つには馬に飼い葉をやって休ませられる。都合のよい所で精進料理を用意してもらい、お師匠さまに召し上がっていただこう。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-005"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老依言，四眾共入。但見二門上有一對春聯：「黃芽白雪神仙府；瑤草琪花羽士家。」行者笑道：「這個是燒茅煉藥，弄爐火，提罐子的道士。」三藏捻他一把道：「謹言，謹言。我們不與他相識，又不認親，左右暫時一會，管他怎的？」說不了，進了二門，只見那正殿謹閉，東廊下坐著一個道士，在那裡丸藥。你看他怎生打扮："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      三蔵もその言葉に従い、四人そろって入った。二の門には、対になった春聯（しゅんれん）が掛かっていた。
      「黄芽（こうが）白雪（はくせつ）、神仙の府。
      瑤草（ようそう）琪花（きか）、羽士（うし）の家。」
      悟空は笑って言った。
      悟空「茅を焼いて薬を練り、炉の火をいじり、壺を持ち回る道士だな。」
      三蔵は悟空をつねった。
      三蔵「口を慎みなさい、慎みなさい。お知り合いでも親戚でもなく、ほんのしばらくお会いするだけなのに、よその方のことをとやかく言うものではない。」
      そう言い終わらぬうちに二の門をくぐると、正殿の戸は固く閉じ、東の廊下に一人の道士が座って丸薬を作っていた。さて、どんな身なりであろう。
    "translation_status": "reviewed"
  - "id": "xy-ch73-006"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "戴一頂紅豔豔戧金冠，穿一領黑淄淄烏皂服，踏一雙綠陣陣雲頭履，繫一條黃拂拂呂公絛。面如瓜鐵，目若朗星。準頭高大類回回，唇口翻張如達達。道心一片隱轟雷，伏虎降龍真羽士。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      頭には真っ赤な戧金冠（そうきんかん）、身には真っ黒な道服、
      足には鮮やかな緑の雲頭履（うんとうり）、腰には黄色に輝く呂公絛（りょこうとう）。
      顔は瓜鉄（かてつ）のよう、目は明るい星のよう。
      高く大きな鼻先は回回（かいかい）に似て、そり返った口唇は達達（たつたつ）のよう。
      道を求める一心には轟く雷を秘め、虎を伏せ竜を降す、まことの道士である。
    "translation_status": "reviewed"
  - "id": "xy-ch73-007"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏見了，厲聲高叫道：「老神仙，貧僧問訊了。」那道士猛擡頭，一見心驚，丟了手中之藥，按簪兒，整衣服，降階迎接道：「老師父，失迎了。請裡面坐。」長老歡喜上殿。推開門，見有三清聖像，供桌有爐有香。即拈香注爐，禮拜三匝，方與道士行禮。遂至客位中，同徒弟們坐下。急喚仙童看茶。當有兩個小童，即入裡邊，尋茶盤，洗茶盞，擦茶匙，辦茶果，忙忙的亂走，早驚動那幾個冤家。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      三蔵はその姿を見ると、声を張り上げた。
      三蔵「ご老仙、僧の私からご挨拶申し上げます。」
      道士ははっと顔を上げ、一目見るなり驚いて、手にした薬を置いた。簪を押さえ、衣を整えると、階段を下りて迎えた。
      道士「長老さま、お迎えもせず失礼いたしました。どうぞ中へお掛けください。」
      三蔵は喜んで殿へ上がった。戸を開けると三清（さんせい）の聖像があり、供物台には香炉と香が置いてあった。そこで香を取り、炉に立て、三度礼拝してから道士に挨拶した。客の席へ移り、弟子たちと一緒に座ると、道士は急いで仙童を呼び、茶を命じた。二人の童子が奥へ入り、盆を探し、茶碗を洗い、茶さじを拭き、茶菓子をそろえ、あわただしく走り回った。この騒ぎで、早くもあの仇敵たちが気づいたのである。
    "translation_status": "reviewed"
  - "id": "xy-ch73-008"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來那盤絲洞七個女怪與這道士同堂學藝。自從穿了舊衣，喚出兒子，徑來此處。正在後面裁剪衣服，忽見那童子看茶，便問道：「童兒，有甚客來了，這般忙冗？」仙童道：「適間有四個和尚進來，師父教來看茶。」女怪道：「可有個白胖和尚？」道：「有。」又問：「可有個長嘴大耳朵的？」道：「有。」女怪道：「你快去遞了茶，對你師父丟個眼色，著他進來，我有要緊的話說。」果然那仙童將五杯茶拿出去，道士斂衣，雙手拿一杯遞與三藏，然後與八戒、沙僧、行者。茶罷，收鍾。小童丟個眼色，那道士就欠身道：「列位請坐。」教：「童兒，放了茶盤陪侍。等我去去就來。」此時長老與徒弟們並一個小童，出殿上觀玩不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      実は、盤糸洞（ばんしどう）の七人の女の妖怪は、この道士と同じ師のもとで術を学んだ仲だった。古い着物を着て息子たちを呼び出すと、まっすぐここへ来ていたのである。今は奥で衣服を裁っていたが、童子が茶を用意しているのを見て尋ねた。
      女の妖怪「童子、どんなお客様が来て、そんなに忙しくしているの。」
      童子「先ほど四人のお坊さまがおいでになり、師匠からお茶を用意するよう言われたのです。」
      女の妖怪「色白で太った和尚もいるかい。」
      童子「はい、います。」
      女の妖怪「口先が長くて耳の大きいのもいるかい。」
      童子「はい、います。」
      女の妖怪「急いでお茶を出したら、師匠に目配せして、こちらへ来てもらっておくれ。大事な話があるんだよ。」
      童子は五つの茶碗を運んでいった。道士は衣の裾を整え、両手で一杯を三蔵に差し出し、それから八戒、沙悟浄、悟空へ渡した。茶が済むと茶碗を下げた。童子が目配せすると、道士は少し身を起こして言った。
      道士「皆さま、そのままおくつろぎください。」
      さらに命じた。
      道士「童子、盆を置いてお相手をしていなさい。私は少し行ってくるが、すぐ戻る。」
      この間、三蔵と弟子たちは、一人の童子とともに殿を出て見物していたが、それはさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch73-009"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說道士走進方丈中，只見七個女子齊齊跪倒，叫：「師兄，師兄，聽小妹子一言。」道士用手攙起道：「你們早間來時，要與我說甚麼話，可可的今日丸藥，這枝藥忌見陰人，所以不曾答你。如今又有客在外面，有話且慢慢說罷。」眾怪道：「告稟師兄：這樁事，專為客來，方敢告訴；若客去了，縱說也沒用了。」道士笑道：「你看賢妹說話，怎麼專為客來才說？卻不瘋了？且莫說我是個清靜修仙之輩，就是個俗人家，有妻子老小家務事，也等客去了再處。怎麼這等不賢，替我裝幌子哩？且讓我出去。」眾怪又一齊扯住道：「師兄息怒。我問你，前邊那客是那方來的？」道士唾著臉，不答應。眾怪道：「方才小童進來取茶，我聞得他說，是四個和尚。」道士作怒道：「和尚便怎麼？」眾怪道：「四個和尚，內有一個白面胖的，有一個長嘴大耳的，師兄可曾問他是那裡來的？」道士道：「內中是有這兩個，你怎麼知道？想是在那裡見他來？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      道士が方丈（ほうじょう）へ入ると、七人の女が一斉にひざまずいた。
      女の妖怪たち「兄さま、兄さま、妹たちの話をお聞きください。」
      道士は手を貸して起こした。
      道士「朝来たとき、何か話したがっていたな。あいにく今日は丸薬を作っていて、この薬は女に見られるのを忌むから、返事ができなかった。今は外にお客様もおられる。話は後でゆっくり聞こう。」
      女の妖怪たち「兄さまに申し上げます。この件は、まさにお客様が来たからこそお話しするのです。帰ってしまっては、話しても何にもなりません。」
      道士は笑った。
      道士「妙なことを言う妹たちだ。どうして客が来たからこそ話すというのだ。気でも違ったか。静かに仙道を修める私でなくとも、俗人の家に妻子や老人、家の用事があれば、客が帰ってから片づけるものだ。そんなに物分かりが悪くて、私を見せ物にでもしたいのか。さあ、外へ行かせてくれ。」
      女の妖怪たちは、またそろって道士を引き止めた。
      女の妖怪たち「兄さま、お怒りにならないで。伺いますが、表のお客様はどちらからおいでなのです。」
      道士は顔をしかめ、答えなかった。
      女の妖怪たち「さっき童子がお茶を取りに来たとき、四人の和尚だと聞きました。」
      道士は怒った声を出した。
      道士「和尚だからどうした。」
      女の妖怪たち「四人のうち、色白で太ったのが一人、口先が長くて耳の大きいのが一人いるでしょう。兄さまは、どこから来たかお尋ねになりましたか。」
      道士「確かにその二人はいるが、なぜお前たちが知っている。どこかで会ったのか。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-010"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "女子道：「師兄原不知這個委曲。那和尚乃唐朝差往西天取經去的。今早到我洞裡化齋，委是妹子們聞得唐僧之名，將他拿了。」道士道：「你拿他怎的？」女子道：「我們久聞人說，唐僧乃十世修行的真體，有人吃他一塊肉，延壽長生，故此拿了他。後被那個長嘴大耳朵的和尚把我們攔在濯垢泉裡，先搶了衣服，後弄本事，強要同我等洗浴，也止他不住。他就跳下水，變作一個鮎魚，在我們腿襠裡鑽來鑽去，欲行姦騙之事，果有十分憊懶。他又跳出水去，現了本相。見我們不肯相從，他就使一柄九齒釘鈀，要傷我們性命。若不是我們有些見識，幾乎遭他毒手，故此戰兢兢逃生。又著你愚外甥與他敵鬥，不知存亡如何。我們特來投兄長，望兄長念昔日同窗之雅，與我今日做個報冤之人。」那道士聞此言，卻就惱恨，遂變了聲色道：「這和尚原來這等無禮，這等憊懶。你們都放心，等我擺佈他。」眾女子謝道：「師兄如若動手，等我們都來相幫打他。」道士道：「不用打，不用打。常言道：『一打三分低。』你們都跟我來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      女の妖怪「兄さまは、この事情をご存じないのです。あの和尚は、唐の国から西天（さいてん）へ経を取りに遣わされた者です。今朝、私たちの洞へ食事を乞いに来ました。妹たちは唐僧（とうそう）の名を聞いていましたから、捕らえたのです。」
      道士「何のために捕らえた。」
      女の妖怪「唐僧は十度の生を修行してきた真の肉体で、その肉を一切れ食べれば寿命が延び、長生きできると、前から人に聞いていました。それで捕らえたのです。ところが後で、あの長い口と大きな耳の和尚が、私たちを濯垢泉（たっこうせん）で引き止めました。まず着物を奪い、それから術を使い、無理やり一緒に水浴びしようとしたので、止めようもありませんでした。水に飛び込むと鯰に変わり、私たちの股の間を行ったり来たりして、だまして私たちを犯そうとしたのです。本当に、ひどくたちの悪い奴でした。また水から飛び出して元の姿に戻り、私たちが言うことを聞かないのを見ると、九歯のまぐわを振り回して、命を奪おうとしました。少しばかり心得がなければ、危うく毒手にかかるところでした。そこで震えながら逃げ延び、さらに兄さまの不出来な甥たちを敵と戦わせましたが、生きているのか死んだのかも分かりません。こうして兄さまを頼って来たのです。昔、同じ師に学んだよしみを思い出し、今日、私たちの恨みを晴らしてくださいますよう。」
      道士は聞くうちに腹を立て、顔色も声も変えた。
      道士「あの和尚は、そんなに無礼で、そんなにたちの悪い奴だったのか。皆、安心しろ。私が始末してやろう。」
      女の妖怪たちは礼を言った。
      女の妖怪たち「兄さまが手を下すなら、私たちも皆で加勢して打ちます。」
      道士「打つ必要はない、打つ必要はない。昔から『先に人を殴れば、理屈の上で三分は負ける』という。皆、ついて来い。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-011"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾女子相隨左右。他入房內，取了梯子，轉過床後，爬上屋梁，拿下一個小皮箱兒。那箱兒有八寸高下，一尺長短，四寸寬窄，上有一把小銅鎖兒鎖住。即於袖中拿出一方鵝黃綾汗巾兒來，汗巾鬚上繫著一把小鑰匙兒。開了鎖，取出一包兒藥來。此藥乃是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 131
        "line_end": 131
    "translation_ja": "女たちは道士の左右について行った。道士は部屋に入り、梯子を持って寝台の裏へ回り、梁へ上って、小さな革箱を下ろした。高さは八寸ほど、長さは一尺ほど、幅は四寸ほどで、小さな銅の錠が掛かっていた。袖から薄黄色の綾織りの汗拭きを取り出すと、その房に小さな鍵が結んであった。錠を開け、薬の包みを一つ取り出した。その薬とは、こんなものであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-012"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      山中百鳥糞，掃積上千斤。
      是用銅鍋煮，煎熬火候勻。
      千斤熬一杓，一杓煉三分。
      三分還要炒，再煅再重熏。
      製成此毒藥，貴似寶和珍。
      如若嘗他味，入口見閻君。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 133
        "line_end": 138
    "translation_ja": |-
      山のあらゆる鳥の糞を、掃き集めること千斤余り。
      銅の鍋で煮立てては、火加減そろえて煮詰めてゆく。
      千斤を杓子一杯まで煮詰め、一杯を三分（ぶ）まで練り上げる。
      三分になってなお炒り、また焼き、さらに繰り返し燻す。
      こうして仕上げる毒薬は、宝石にも等しい貴重さ。
      もしその味をなめてみれば、口に入れた途端に閻君（えんくん）と対面する。
    "translation_status": "reviewed"
  - "id": "xy-ch73-013"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "道士對七個女子道：「妹妹，我這寶貝，若與凡人吃，只消一釐，入腹就死；若與神仙吃，也只消三釐就絕；這些和尚，只怕也有些道行，須得三釐。快取等子來。」內一女子急拿了一把等子道：「稱出一分二釐，分作四分。」卻拿了十二個紅棗兒，將棗掐破些兒，揌上一釐，分在四隻茶鍾內；又將兩個黑棗兒做一個茶鍾，著一個托盤安了對眾女說：「等我去問他，不是唐朝的便罷；若是唐朝來的，就教換茶，你卻將此茶令童兒拿出。但吃了，個個身亡，就與你報了此讎，解了煩惱也。」七女感激不盡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      道士は七人の女に言った。
      道士「妹たち、この宝は、普通の人間なら一釐（り）飲ませるだけで、腹へ入った途端に死ぬ。仙人でも三釐で息絶える。あの和尚たちにも幾らか修行の力がありそうだから、三釐は要る。早く小秤を持って来い。」
      一人の女の妖怪が急いで小秤を持って来て言った。
      一人の女の妖怪「一分二釐を量って、四つに分けましょう。」
      そこで赤い棗を十二個用意し、一つずつ少し割って一釐の薬を詰め、四つの茶碗へ分け入れた。別に黒い棗を二個、一つの茶碗へ入れ、盆に載せると、道士は女たちに言った。
      道士「私が出て行って尋ねてみる。唐の国の者でなければ、それまでだ。唐から来たのなら、茶を替えるよう命じるから、お前たちはこの茶を童子に運ばせろ。飲んだが最後、一人残らず死ぬ。そうすれば、お前たちの仇も討て、悩みも消える。」
      七人の女は、感謝してもしきれない様子だった。
    "translation_status": "reviewed"
  - "id": "xy-ch73-014"
    "section_id": "chapter-73"

    "source_text": "卻說那八戒一則饑，二則渴，原來是食腸大大的，見那鍾子裡有三個紅棗兒，拿起來嘓的都咽在肚裡。師父也吃了，沙僧也吃了。一霎時，只見八戒臉上變色，沙僧滿眼流淚，唐僧口中吐沫。他們都坐不住，暈倒在地。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 144
        "line_end": 144
    "translation_ja": "さて八戒は、腹が減り、喉も渇き、もともと大変な大食漢である。茶碗の中に赤い棗が三個あるのを見ると、持ち上げて、ごくりと全部腹へ飲み込んだ。三蔵も飲み、沙悟浄も飲んだ。たちまち八戒は顔色が変わり、沙悟浄は目いっぱいに涙を流し、三蔵は口から泡を吐いた。皆、座っていられず、気を失って床へ倒れた。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-017"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖情知是毒，將茶鍾手舉起來，望道士劈臉一摜。道士將袍袖隔起，噹的一聲，把個鍾子跌得粉碎。道士怒道：「你這和尚，十分村魯！怎麼把我鍾子捽了？」行者罵道：「你這畜生！你看我那三個人是怎麼說？我與你有甚相干，你卻將毒藥茶藥倒我的人？」道士道：「你這個村畜生闖下禍來，你豈不知？」行者道：「我們才進你門，方敘了坐次，道及鄉貫，又不曾有個高言，那裡闖下甚禍？」道士道：「你可曾在盤絲洞化齋麼？你可曾在濯垢泉洗澡麼？」行者道：「濯垢泉乃七個女怪，你既說出這話，必定與他苟合，必定也是妖精。不要走，吃我一棒。」好大聖，去耳朵裡摸出金箍棒，幌一幌，碗來粗細，望道士劈臉打來；那道士急轉身躲過，取一口寶劍來迎。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      悟空は毒だと悟り、茶碗を振り上げ、道士の顔めがけて投げつけた。道士が袖で遮ると、がちゃんと音がして、茶碗は落ちて粉々になった。
      道士は怒鳴った。
      道士「この和尚、なんと乱暴な奴だ！　なぜ私の茶碗を叩き割った。」
      悟空は罵った。
      悟空「この畜生！　俺の連れの三人を見ろ、いったいどういうことだ。俺たちがあんたに何をした。なぜ毒の茶で倒したんだ。」
      道士「この無作法な畜生め。自分で引き起こした災いが分からんのか。」
      悟空「たった今ここへ来て、席に着き、故郷の話をしただけだ。大声を出したことさえない。どんな災いを引き起こしたというんだ。」
      道士「盤糸洞で食事を乞わなかったか。濯垢泉で水浴びをしなかったか。」
      悟空「濯垢泉には七人の女の妖怪がいる。そんなことを言い出すからには、あんたはあいつらと密通しているに違いない。きっと、あんたも妖怪だ。逃げるな、一発食らえ！」
      悟空は耳から金箍棒（きんこぼう）を取り出し、ひと振りして茶碗ほどの太さにすると、道士の顔めがけて打ち下ろした。道士は急いで身をかわし、宝剣を取って迎え撃った。
    "translation_status": "reviewed"
  - "id": "xy-ch73-018"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個廝罵廝打，早驚動那裡邊的女怪。他七個一擁出來，叫道：「師兄且莫勞心，待小妹子拿他。」行者見了，越生嗔怒，雙手掄鐵棒，丟開解數，滾將進去亂打。只見那七個敞開懷，腆著雪白肚子，臍孔中作出法來：骨都都絲繩亂冒，搭起一個天篷，把行者蓋在底下。行者見事不諧，即翻身念聲咒語，打個觔斗，撲的撞破天篷走了。忍著性氣，淤淤的立在空中看處，見那怪絲繩晃亮，穿穿道道，卻是穿梭的經緯，頃刻間，把黃花觀的樓臺殿閣都遮得無影無形。行者道：「利害，利害。早是不曾著他手。怪道豬八戒跌了若干。似這般怎生是好？我師父與師弟卻又中了毒藥。這夥怪合意同心，卻不知是個甚來歷，待我還去問那土地神也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      二人は罵り合い、打ち合った。その騒ぎに奥の女の妖怪たちが気づき、七人そろって押し出してきた。
      女の妖怪たち「兄さま、お手を煩わせるには及びません。妹たちが捕らえます。」
      悟空はその姿を見ると、いよいよ怒りを募らせた。両手で鉄棒を振り回し、技を繰り出しながら突っ込んで、めった打ちにした。すると七人は胸元を開き、雪のように白い腹を突き出し、臍の穴から術を放った。ごぼごぼと糸の縄が際限なく湧き出し、天幕を張って悟空を下へ覆い込んだ。
      悟空はまずいと見て身をひるがえし、呪文を唱え、宙返りを一つ打つと、ばっと天幕を突き破って逃れた。怒りをこらえて空中にじっと立ち、見下ろすと、妖怪たちの糸はきらきらと光り、縦横に走って、織機の縦糸と横糸のようだった。たちまち黄花観の楼台も殿閣も、跡形が見えないほどに覆ってしまった。
      悟空「大したものだ、大したものだ。つかまらずに済んでよかった。猪八戒（ちょはっかい）が何度も転ばされたわけだ。これではどうしたものか。お師匠さまと弟弟子たちは、毒まで食らっている。この妖怪どもはすっかり息が合っているが、いったい何者なのか分からん。もう一度、土地神（とちがみ）に聞いてこよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-019"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，按落雲頭，捻著訣，念聲「唵」字真言，把個土地老兒又拘來了。戰兢兢跪下路旁，叩頭道：「大聖，你去救你師父的，為何又轉來也？」行者道：「早間救了師父，前去不遠，遇一座黃花觀，我與師父等進去看看，那觀主迎接。才敘話間，被他把毒藥茶藥倒我師父等。我幸不曾吃茶，使棒就打。他卻說出盤絲洞化齋，濯垢泉洗澡之事，我就知那廝是怪。才舉手相敵，只見那七個女子跑出，吐放絲繩，老孫虧有見識走了。我想你在此間為神，定知他的來歷，是個甚麼妖精？老實說來，免打。」土地叩頭道：「那妖精到此，住不上十年。小神自三年前檢點之後，方見他的本相，乃是七個蜘蛛精。他吐那些絲繩，乃是蛛絲。」行者聞言，十分歡喜道：「據你說，卻是小可。既這般，你回去，等我作法降他也。」那土地叩頭而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      悟空は雲を下ろし、指で印を結び、「唵（おん）」の真言（しんごん）を唱えて、また土地神の老人を呼びつけた。土地神は震えながら道端にひざまずき、頭を下げた。
      土地神「大聖（たいせい）さま、お師匠さまを助けに行かれたのに、どうしてまたお戻りなのです。」
      悟空「朝のうちにお師匠さまを助け出し、少し行った所で黄花観に出会った。皆で見に入ると、観の主人が迎えてくれたが、話し始めたところで、お師匠さまたちを毒の茶で倒しやがった。幸い俺は飲んでいなかったから、棒で打ってやった。すると、盤糸洞で食事を乞うたこと、濯垢泉で水浴びしたことを持ち出したので、妖怪だと分かった。戦い始めた途端に、例の七人が飛び出し、糸の縄を吐いた。俺は心得があったおかげで逃げられた。ここで神をしているお前なら、連中の素性を知っているはずだ。どんな妖怪か、正直に言え。そうすれば殴らん。」
      土地神は頭を下げて答えた。
      土地神「あの妖怪たちがここへ来て住みついてから、まだ十年にはなりません。私が三年前に調べて、ようやく本相を見たのですが、七匹の蜘蛛の妖怪でございます。あの糸の縄は、蜘蛛の糸なのです。」
      悟空は聞いて大いに喜んだ。
      悟空「そういうことなら、たいしたことはない。分かった、帰っていい。俺が術で降してやる。」
      土地神は頭を下げ、去っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch73-020"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者卻到黃花觀外，將尾巴上毛捋下七十根，吹口仙氣，叫：「變！」即變做七十個小行者；又將金箍棒吹口仙氣，叫：「變！」即變做七十一條雙角叉兒棒。每一個小行者與他一根，他自家使一根，站在外邊，將叉兒攪那絲繩，一齊著力，打個號子，把那絲繩都攪斷，各攪了有十餘斤。裡面拖出七個蜘蛛，足有巴斗大小的身軀。一個個攢著手腳，索著頭，只叫：「饒命，饒命。」此時七十個小行者，按住七個蜘蛛，那裡肯放。行者道：「且不要打他，只教還我師父、師弟來。」那怪厲聲高叫道：「師兄，還他唐僧，救我命也。」那道士從裡邊跑出道：「妹妹，我要吃唐僧哩，救不得你了。」行者聞言，大怒道：「你既不還我師父，且看你妹妹的樣子。」好大聖，把叉兒棒幌一幌，復了一根鐵棒，雙手舉起，把七個蜘蛛精盡情打爛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      悟空は黄花観の外へ戻り、尾の毛を七十本抜き、仙気を吹きかけて叫んだ。
      悟空「変われ！」
      毛は七十人の小さな悟空に変わった。さらに金箍棒へ仙気を吹きかけて叫んだ。
      悟空「変われ！」
      棒は七十一本の、先が二つに分かれた叉の棒になった。小さな悟空に一本ずつ渡し、自分も一本持ち、外から叉を糸の縄へ差し込み、声を合わせて一斉に力を入れた。糸を巻き絡めてすべて断ち切り、一人につき十余斤ずつも巻き取った。その中から引きずり出されたのは、七匹の蜘蛛だった。体はどれも丸い大籠ほどもあり、足を縮め、頭を引っ込め、ただ叫んだ。
      蜘蛛の妖怪たち「お助けください、お助けください！」
      七十人の小さな悟空は七匹を押さえつけ、少しも放そうとしなかった。
      悟空「まだ殴るな。お師匠さまと弟弟子たちを返させればいい。」
      蜘蛛の妖怪たちは声を張り上げた。
      蜘蛛の妖怪たち「兄さま、唐僧を返して、私たちの命を助けてください！」
      道士は奥から走り出てきた。
      道士「妹たち、私は唐僧を食べたいのだ。お前たちを助けることはできん。」
      悟空は聞いて激怒した。
      悟空「お師匠さまを返さないなら、お前の妹たちがどうなるか、見ていろ！」
      悟空は叉の棒をひと振りして一本の鉄棒へ戻し、両手で振り上げ、七匹の蜘蛛の妖怪を残らず、ぐちゃぐちゃに叩き潰した。
    "translation_status": "reviewed"
  - "id": "xy-ch73-021"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻又將尾巴搖了兩搖，收了毫毛，單身掄棒，趕入裡邊來打道士。那道士見他打死了師妹，心甚不忍，即發狠舉劍來迎。這一場各懷忿怒，一個個大展神通。這一場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 150
        "line_end": 150
    "translation_ja": "さらに尾を二度振って毛を回収すると、ただ一人で棒を振り回し、奥へ駆け込んで道士を打とうとした。道士は妹弟子たちが殺されたのを見て、耐えがたい思いに駆られ、凶暴な勢いで剣を上げ、迎え撃った。双方とも怒りを胸に、それぞれ神通力を存分に振るう。見よ、この戦いを。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-022"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "妖精掄寶劍，大聖舉金箍。都為唐朝三藏，先教七女嗚呼。如今大展經綸手，施威弄法逞金吾。大聖神光壯，妖仙膽氣粗。渾身解數如花錦，雙手騰那似轆轤。乒乓劍棒響。慘淡野雲浮。劖言語，使機謀，一來一往如畫圖。殺得風響沙飛狼虎怕，天昏地暗斗星無。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      妖怪は宝剣を振り、悟空は金箍棒を掲げる。
      すべては唐の三蔵のため、まず七人の女があの世へ送られた。
      今こそ腕前を存分に展べ、威勢と術とで武勇を競う。
      悟空の神の光は強く、妖仙の胆力も太い。
      全身の技は花の錦、両手の動きは回る轆轤。
      剣と棒が丁々と鳴り、野の雲は陰惨に漂う。
      言葉で切りつけ、計略を使い、往き来する姿は絵さながら。
      戦えば風がうなり砂が飛び、狼も虎も恐れおののく。
      空は曇り、地は暗み、北斗（ほくと）の星さえ見えなくなる。
    "translation_status": "reviewed"
  - "id": "xy-ch73-023"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那道士與大聖戰經五六十合，漸覺手軟。一時間鬆了筋節，便解開衣帶，忽辣的響一聲，脫了皂袍。行者笑道：「我兒子，打不過人，就脫剝了也是不能夠的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      道士は悟空と五、六十合も戦ううち、次第に腕の力が抜けてきた。筋も関節も緩んだところで帯を解き、ばさりと音を立てて黒い道服を脱いだ。悟空は笑った。
      悟空「せがれよ、人にかなわないからって、裸になったところで勝てるものか。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-024"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來這道士剝了衣裳，把手一齊擡起，只見那兩脅下有一千隻眼，眼中迸放金光，十分利害："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 155
        "line_end": 155
    "translation_ja": "道士は衣を脱ぐと、両腕を同時に上げた。見ると、両脇には千もの目があり、その目から金色の光が迸った。実に恐ろしい威力である。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-025"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "森森黃霧，艷艷金光。森森黃霧，兩邊脅下似噴雲；艷艷金光，千隻眼中如放火。左右卻如金桶，東西猶似銅鐘。此乃妖仙施法力，道士顯神通：幌眼迷天遮日月，罩人爆燥氣朦朧；把個齊天孫大聖，困在金光黃霧中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      濃く立ちこめる黄色い霧、まばゆく輝く金色の光。
      濃い黄霧は、両脇から雲を吹くかのよう。
      鮮やかな金光は、千の目から火を放つかのよう。
      左右は金の桶さながら、東西は銅の鐘のよう。
      これぞ妖仙が法力を施し、道士が神通力を現すところ。
      目をくらませ、天を惑わせ、日月を遮る。
      人を覆っていらだたせ、気は朦朧となる。
      かの斉天大聖（せいてんたいせい）孫悟空（そんごくう）も、金の光と黄色い霧の中に閉じ込められた。
    "translation_status": "reviewed"
  - "id": "xy-ch73-026"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者慌了手腳，只在那金光影裡亂轉，向前不能舉步，退後不能動腳，卻便似在個桶裡轉的一般。無奈又爆燥不過，他急了，往上著實一跳，卻撞破金光，撲的跌了一個倒栽蔥，覺道撞的頭疼。急伸頭摸摸，把頂梁皮都撞軟了。自家心焦道：「晦氣，晦氣，這顆頭今日也不濟了。常時刀砍斧剁，莫能傷損，卻怎麼被這金光撞軟了皮肉？久以後定要貢膿。縱然好了，也是個破傷風。」一會家爆燥難禁，卻又自家計較道：「前去不得，後退不得，左行不得，右行不得，往上又撞不得，卻怎麼好？往下走他娘罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      悟空は慌てふためき、金色の光の中をぐるぐる回った。前へ進もうとしても足が上がらず、後ろへ退こうとしても足が動かない。まるで桶の中を回っているようだ。どうにもならず、いらだちに耐えられなくなり、思い切って上へ跳んだ。金光に突き当たって破ったものの、どさりと頭から逆さまに落ち、ぶつけた頭が痛んだ。急いで触ってみると、頭のてっぺんの皮が、打ちつけられてぶよぶよになっていた。悟空は焦って独り言を言った。
      悟空「ついてない、ついてない。今日はこの頭まで役に立たん。いつもなら刀で斬られようが斧で叩かれようが、傷一つつかないのに、どうしてこの金光にぶつかっただけで、皮や肉が柔らかくなったんだ。時間がたてば、きっと膿が出るぞ。たとえ傷が治っても、破傷風になるぞ。」
      しばらくすると、いよいよいらだたしくてたまらなくなり、また考えた。
      悟空「前へ行けない、後ろへ退けない、左にも右にも行けない、上へぶつかっても駄目。どうすればいい。くそ、下へ行くまでだ！」
    "translation_status": "reviewed"
  - "id": "xy-ch73-027"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，念個咒語，搖身一變，變做個穿山甲，又名鯪鯉鱗。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 160
        "line_end": 160
    "translation_ja": "悟空は呪文を唱えて身を揺すり、穿山甲（せんざんこう）、別名を鯪鯉鱗（りょうりりん）という獣に変わった。その姿といえば、こうである。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-028"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "四隻鐵爪，鑽山碎石如撾粉；滿身鱗甲，破嶺穿巖似切蔥。兩眼光明，好便似雙星晃亮；一嘴尖利，勝強如鋼鑽金錐。藥中有性穿山甲，俗語呼為鯪鯉鱗。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      四本の鉄の爪は、山に穴をあけ石を砕くこと、粉を叩くよう。
      全身を覆う鱗の鎧は、峰を破り岩を貫くこと、葱を切るよう。
      光る両眼は、二つの星が輝くかのよう。
      一つの鋭い口先は、鋼の錐にも金の錐にも勝る。
      薬としての性質もあるのが、穿山甲。
      俗に呼ぶ名は、鯪鯉鱗という。
    "translation_status": "reviewed"
  - "id": "xy-ch73-029"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他硬著頭，往地下一鑽，就鑽了有二十餘里，方才出頭。原來那金光只罩得十餘里。出來現了本相，力軟觔麻，渾身疼痛，止不住眼中流淚。忽失聲叫道：「師父啊，"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      見よ、悟空は頭を突き出して地面に潜り、二十余里も掘り進んで、ようやく顔を出した。金光が覆っていたのは、十余里だけだったのである。外へ出て本来の姿に戻ると、力は抜け、筋はしびれ、全身が痛み、目から涙が止まらなかった。思わず声を上げた。
      悟空「お師匠さま、ああ。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-030"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      當年秉教出山中，共往西來苦用工。
      大海洪波無恐懼，陽溝之內卻遭風。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 166
        "line_end": 167
    "translation_ja": |-
      悟空「かつて教えを受けて山を出て、ともに西へと苦労を重ねてきた。
      大海の荒波さえ恐れなかったのに、浅い溝で嵐に遭うとは。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-031"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "美猴王正當悲切，忽聽得山背後有人啼哭，即欠身揩了眼淚，回頭觀看。但見一個婦人，身穿重孝，左手托一盞涼漿水飯，右手執幾張燒紙黃錢，從那廂一步一聲，哭著走來。行者點頭嗟嘆道：「正是：『流淚眼逢流淚眼，斷腸人遇斷腸人。』這一個婦人，不知所哭何事？待我問他一問。」那婦人不一時走上前來，迎著行者。行者躬身問道：「女菩薩，你哭的是甚人？」婦人噙淚道：「我丈夫因與黃花觀觀主買竹竿爭講，被他將毒藥茶藥死，我將這陌紙錢燒化，以報夫婦之情。」行者聽言，眼中流淚。那女子見了，作怒道：「你甚無知，我為丈夫煩惱生悲，你怎麼淚眼愁眉，欺心戲我？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      悟空が悲しみに暮れていると、山の向こうで人の泣く声がした。身を起こし、涙を拭って振り返ると、一人の女が見えた。深い喪の衣を着て、左手には冷たい水飯を一碗、右手には焼いて供える黄色い紙銭（しせん）を数枚持ち、一歩進むごとに声を上げ、泣きながらやって来た。悟空はうなずき、ため息をついた。
      悟空「まさに『涙の目は涙の目に出会い、断腸の人は断腸の人に出会う』だな。あの女は、何を悲しんで泣いているのだろう。聞いてみよう。」
      ほどなく女は悟空の前まで来た。悟空は身をかがめて尋ねた。
      悟空「女菩薩（にょぼさつ）、どなたのことで泣いておられるのです。」
      女は涙を浮かべて言った。
      女「夫は黄花観の主人から竹竿を買うとき、言い争いになり、毒の茶で殺されました。私はこの一陌（はく）の紙銭を焼いて、夫婦の情けに報いようとしているのです。」
      悟空は聞くと、目に涙を浮かべた。女はそれを見ると、怒った。
      女「何も分からない人ですね。私は夫のことで悲しみ苦しんでいるのに、あなたまで涙を流し、眉を曇らせて、心にもなく私をからかうのですか。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-032"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者躬身道：「女菩薩息怒。我本是東土大唐欽差御弟唐三藏大徒弟孫悟空行者。因往西天，行過黃花觀歇馬。那觀中道士，不知是個甚麼妖精，他與七個蜘蛛精結為兄妹。蜘蛛精在盤絲洞要害我師父，是我與師弟八戒、沙僧救解得脫。那蜘蛛精走到他這裡，背了是非，說我等有欺騙之意。道士將毒藥茶藥倒我師父、師弟共三人，連馬四口，陷在他觀裡。惟我不曾吃他茶，將茶鍾摜碎，他就與我相打。正嚷時，那七個蜘蛛精跑出來吐放絲繩，將我網住，是我使法力走脫。問及土地，說他本相。我卻又使分身法攪絕絲繩，拖出妖來，一頓棒打死。這道士即與他報仇，舉寶劍與我相鬥。鬥經六十回合，他敗了陣，隨脫了衣裳，兩脅下放出千隻眼，有萬道金光，把我罩定。所以進退兩難，才變做一個鯪鯉鱗，從地下鑽出來。正自悲切，忽聽得你哭，故此相問。因見你為丈夫有此紙錢報答，我師父喪身，更無一物相酬，所以自怨生悲，豈敢相戲。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      悟空は身をかがめた。
      悟空「女菩薩、お怒りにならないでください。私は東土大唐の勅使、皇帝の御弟（ぎょてい）である唐三蔵（とうさんぞう）の一番弟子、孫悟空行者（そんごくうぎょうじゃ）です。西天へ向かう途中、黄花観で馬を休めました。そこの道士は、何の妖怪か分かりませんが、七匹の蜘蛛の妖怪と兄妹の契りを結んでいました。蜘蛛の妖怪たちは盤糸洞でお師匠さまを殺そうとしましたが、私と弟弟子の八戒、沙悟浄が助け出しました。すると連中は道士の所へ来て、事実を曲げ、私たちがだまして悪事を働こうとしたと言いつけたのです。道士は毒の茶で、お師匠さまと弟弟子、合わせて三人を倒しました。馬も合わせれば四つの命が、あの観に閉じ込められています。私だけは茶を飲まず、茶碗を叩きつけて割ると、道士が戦いを挑んできました。争っているところへ七匹の蜘蛛の妖怪が駆け出し、糸の縄を吐いて網を張ったので、私は術で逃れました。土地神に尋ねると、本相を教えてくれました。そこで分身の術を使い、糸を巻き取って断ち、妖怪を引きずり出し、棒で打ち殺しました。道士はその仇を討とうと、宝剣で私と戦い、六十合で敗れると衣を脱ぎました。両脇の千の目から万筋もの金光を放ち、私を閉じ込めたのです。進むことも退くこともできず、鯪鯉鱗に変わって、地中を掘って出てきたところでした。悲しんでいるとあなたの泣く声がしたので、お尋ねしたのです。あなたには夫に報いる紙銭がある。お師匠さまは亡くなってしまったのに、私にはお供えするものさえない。それで自分を責め、悲しくなったのです。どうして、あなたをからかったりいたしましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-033"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那婦女放下水飯、紙錢，對行者陪禮道：「莫怪，莫怪，我不知你是被難者。才據你說將起來，你不認得那道士。他本是個百眼魔君，又喚做多目怪。你既然有此變化，脫得金光，戰得許久，必定有大神通，卻只是還近不得那廝。我教你去請一位聖賢，他能破得金光，降得道士。」行者聞言，連忙唱喏道：「女菩薩知此來歷，煩為指教指教。果是那位聖賢，我去請求，救我師父之難，就報你丈夫之仇。」婦人道：「我就說出來，你去請他，降了道士，只可報仇而已，恐不能救你師父。」行者道：「怎不能救？」婦人道：「那廝毒藥最狠：藥倒人，三日之間，骨髓俱爛。你此往回恐遲了，故不能救。」行者道：「我會走路，憑他多遠，只消半日。」女子道：「你既會走路，聽我說：此處到那裡有千里之遙。那廂有一座山，名喚紫雲山。山中有個千花洞，洞中有位聖賢，喚做毘藍婆，他能降得此怪。」行者道：「那山坐落何方？卻從何方去？」女子用手指定道：「那直南上便是。」行者回頭看時，那女子早不見了。行者慌忙禮拜道：「是那位菩薩？我弟子鑽昏了，不能相識，千乞留名，好謝。」只見那半空中叫道：「大聖，是我。」行者急擡頭看處，原是黎山老姆。趕至空中謝道：「老姆從何來指教我也？」老姆道：「我才自龍華會上回來，見你師父有難，假做孝婦，借夫喪之名，免他一死。你快去請他，但不可說出是我指教，那聖賢有些多怪人。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      女は水飯と紙銭を置き、悟空に詫びた。
      女「どうかお許しください、お許しください。災難に遭った方とは知りませんでした。今のお話では、あの道士を知らないのですね。あれは百眼魔君（ひゃくがんまくん）、またの名を多目怪（たもくかい）という者です。変化して金光から逃れ、あれほど長く戦えたのですから、あなたにも大きな神通力があるに違いありません。でも、まだあの者には近づけません。ある聖者をお頼りなさいとお教えしましょう。その方なら金光を破り、道士を降せます。」
      悟空は聞くと、急いで礼をした。
      悟空「事情をご存じなのですね。どうかお教えください、お教えください。どなたなのか伺えれば、お頼みしてお師匠さまを救い、あなたのご主人の仇も討ちます。」
      女「お教えして、その方を招き、道士を降しても、仇を討てるだけで、お師匠さまは救えないかもしれません。」
      悟空「なぜ救えないのです。」
      女「あの者の毒薬は極めて強く、飲まされた人は三日のうちに骨も髄も腐ります。往復する間に手遅れになる恐れがあるので、救えないというのです。」
      悟空「私は足が速いのです。どんなに遠くても、半日で済みます。」
      女「足が速いのなら、お聞きなさい。そこはここから千里も離れています。紫雲山（しうんざん）という山があり、山中には千花洞（せんかどう）という洞があります。そこに毘藍婆（びらんば）という聖者がいて、この妖怪を降せるのです。」
      悟空「その山はどちらです。どの方角へ行けばよいのです。」
      女は手で指した。
      女「まっすぐ南です。」
      悟空がそちらを見て振り返ると、女の姿はもうなかった。悟空は慌てて拝んだ。
      悟空「どちらの菩薩（ぼさつ）さまでしょう。地中を掘って頭がぼうっとしており、お見分けできませんでした。どうかお名前をお残しください。お礼を申し上げたいのです。」
      空から声がした。
      声の主「大聖、私ですよ。」
      悟空が急いで顔を上げると、それは黎山老母（りざんろうぼ）だった。空中へ駆け上がり、礼を言った。
      悟空「老姆（ろうぼ）、どちらからおいでになって、お導きくださったのですか。」
      黎山老母「竜華会（りゅうげえ）から帰ってきたところです。お師匠さまが災難に遭っているのを見て、喪服の女に化け、夫を失ったという口実で、あの方を死から救おうとしたのです。早くその方を招きに行きなさい。ただし私に教わったとは言ってはいけません。あの聖者は、人をとやかく責めがちな方ですから。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-034"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者謝了，辭別，把觔斗雲一縱，隨到紫雲山上。按定雲頭，就見那千花洞。那洞外："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 171
        "line_end": 171
    "translation_ja": "悟空は感謝して別れ、筋斗雲（きんとうん）でひと飛びすると、すぐ紫雲山へ着いた。雲を止めると、千花洞が見えた。洞の外は、こんな様子だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-035"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      青松遮勝境，翠柏繞仙居。
      綠柳盈山道，奇花滿澗渠。
      香蘭圍石屋，芳草映巖嵎。
      流水連溪碧，雲封古樹虛。
      野禽聲聒聒，幽鹿步徐徐。
      修竹枝枝秀，紅梅葉葉舒。
      寒鴉棲古樹，春鳥噪高樗。
      夏麥盈田廣，秋禾遍地餘。
      四時無葉落，八節有花如。
      每生瑞藹連霄漢，常放祥雲接太虛。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 173
        "line_end": 182
    "translation_ja": |-
      青松は勝れた景色を覆い、翠柏は仙人の住まいを巡る。
      緑の柳は山道に満ち、珍しい花は谷川を埋める。
      香る蘭は石の家を囲み、芳しい草は岩陰を彩る。
      流水は碧い渓流へつながり、雲は古木の間の空間を閉ざす。
      野鳥はかしましく鳴き、奥山の鹿はゆっくり歩む。
      長い竹は枝ごとに美しく、紅梅は葉ごとに伸びやか。
      冬の烏は古木にとまり、春の鳥は高い樗でさえずる。
      夏の麦は広い畑に満ち、秋の穀物は大地に余るほど。
      四季を通じて葉は落ちず、八つの節気にはいつも花が咲く。
      めでたい霞は絶えず天の川まで続き、吉祥の雲は常に大空へつながる。
    "translation_status": "reviewed"
  - "id": "xy-ch73-036"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖喜喜歡歡走將進去，一程一節，看不盡無邊的景致。直入裡面，更沒個人兒，靜靜悄悄的，雞犬之聲也無。心中暗道：「這聖賢想是不在家了。」又進數里看時，見一個女道姑坐在榻上。你看他怎生模樣："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      悟空は喜び勇んで入っていった。行く先々に景色が果てしなく続き、とても見尽くせない。そのまま奥へ進んでも、人っ子一人いない。静まり返り、鶏や犬の声さえしなかった。悟空は心の中で思った。
      悟空「この聖者は、ご不在なのだろうか。」
      さらに数里進んで見ると、一人の女道士が寝台に座っていた。さて、どんな姿であろう。
    "translation_status": "reviewed"
  - "id": "xy-ch73-037"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      頭戴五花納錦帽，身穿一領織金袍。
      腳踏雲尖鳳頭履，腰繫攢絲雙穗絛。
      面似秋容霜後老，聲如春燕社前嬌。
      腹中久諳三乘法，心上常修四諦饒。
      悟出空空真正果，煉成了了自逍遙。
      正是千花洞裡佛，毘藍菩薩姓名高。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 186
        "line_end": 191
    "translation_ja": |-
      頭には五花の錦を縫い合わせた帽子、身には金糸を織り込んだ衣。
      足には雲の形の爪先を持つ鳳頭履（ほうとうり）、腰には糸を組んだ二房の帯。
      顔は霜を経た秋景色のように老い、声は春の社日の前の燕のように愛らしい。
      腹の内には三乗（さんじょう）の教えを長く知り、心にはいつも四諦（したい）を豊かに修める。
      空（くう）をも空と悟って真の果報を得、はっきりした悟りを練り成して、自在に遊ぶ。
      まさしく千花洞の仏、毘藍菩薩（びらんぼさつ）の名は高い。
    "translation_status": "reviewed"
  - "id": "xy-ch73-038"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者止不住腳，近前叫道：「毘藍婆菩薩，問訊了。」那菩薩即下榻，合掌回禮道：「大聖，失迎了。你從那裡來的？」行者道：「你怎麼就認得我是大聖？」毘藍婆道：「你當年大鬧天宮時，普地裡傳了你的形像，誰人不知，那個不識？」行者道：「正是：『好事不出門，惡事傳千里。』像我如今皈正佛門，你就不曉的了？」毘藍道：「幾時皈正？恭喜，恭喜。」行者道：「近能脫命，保師父唐僧上西天取經，師父遇黃花觀道士，將毒藥茶藥倒。我與那廝賭鬥，他就放金光罩住我，是我使神通走脫了。聞菩薩能滅他的金光，特來拜請。」菩薩道：「是誰與你說的？我自赴了盂蘭會，到今三百餘年，不曾出門。我隱姓埋名，更無一人得知，你卻怎麼知道？」行者道：「我是個地裡鬼，不管那裡，自家都會訪著。」毘藍道：「也罷，也罷。我本當不去，奈蒙大聖下臨，不可滅了求經之善，我和你去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 192
        "line_end": 192
    "translation_ja": |-
      悟空は足を止めず、そのまま近くへ進んで呼びかけた。
      悟空「毘藍婆菩薩（びらんばぼさつ）、ご挨拶申し上げます。」
      毘藍婆はすぐ寝台から下り、合掌して礼を返した。
      毘藍婆「大聖、お迎えもせず失礼しました。どちらからいらしたのです。」
      悟空「なぜすぐ、私が大聖だとお分かりなのです。」
      毘藍婆「昔、天宮で大暴れしたとき、あなたの姿はあまねく知れ渡りました。知らぬ者、見分けぬ者などいるでしょうか。」
      悟空「まさに『善いことは門を出ず、悪いことは千里を伝わる』ですね。今は仏門へ帰依して正道に戻ったのに、そのことはご存じないのですか。」
      毘藍婆「いつ正道へ戻ったのです。おめでとうございます、おめでとうございます。」
      悟空「近ごろようやく命拾いし、師の唐僧を守って西天へ経を取りに行くところです。その師が黄花観の道士に会い、毒の茶で倒されました。私が戦うと、道士は金光を放って閉じ込めたので、神通力で逃れました。菩薩ならあの金光を消せると伺い、お願いに参ったのです。」
      毘藍婆「誰がそう言ったのです。私は盂蘭会（うらんえ）に出て以来、もう三百余年、外へ出ていません。名も身分も隠し、知っている者は一人もいないのに、どうしてあなたが知ったのです。」
      悟空「私は土地のことなら何でも嗅ぎつける、地中の鬼のような者です。どこであろうと、自分で探し当てられるのです。」
      毘藍婆「よいでしょう、よいでしょう。本来は行かないところですが、大聖がわざわざ訪ねてくださったのです。経を求める善い志を絶やすわけにはいきません。一緒に参りましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-039"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者稱謝了，道：「我忒無知，擅自催促。但不知曾帶甚麼兵器？」菩薩道：「我有個繡花針兒，能破那廝。」行者忍不住道：「老姆誤了我，早知是繡花針，不須勞你，就問老孫要一擔也是有的。」毘藍道：「你那繡花針，無非是鋼鐵金針，用不得。我這寶貝，非鋼非鐵非金，乃我小兒日眼裡煉成的。」行者道：「令郎是誰？」毘藍道：「小兒乃昴日星官。」行者驚駭不已。早望見金光艷艷，即回向毘藍道：「金光處便是黃花觀也。」毘藍隨於衣領裡取出一個繡花針，似眉毛粗細，有五六分長短，拈在手，望空拋去。少時間，響一聲，破了金光。行者喜道：「菩薩，妙哉，妙哉！尋針，尋針。」毘藍托在手掌內道：「這不是？」行者卻同按下雲頭，走入觀裡，只見那道士合了眼，不能舉步。行者罵道：「你這潑怪裝瞎子哩。」耳朵裡取出棒來就打。毘藍扯住道：「大聖莫打，且看你師父去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 193
        "line_end": 193
    "translation_ja": |-
      悟空は礼を言った。
      悟空「礼もわきまえず、勝手にせき立ててしまいますが、どんな武器をお持ちになりましたか。」
      毘藍婆「刺繍針を一本持っています。これであの者を破れます。」
      悟空は思わず口走った。
      悟空「老姆にしてやられた。刺繍針だと分かっていれば、あなたにご足労いただかなくても、俺に言えば一荷分でも出せたものを。」
      毘藍婆「あなたの刺繍針は、鋼や鉄や金でできたものにすぎず、役には立ちません。この宝は鋼でも鉄でも金でもなく、私の息子の日眼（じつがん）の中で練り上げたものです。」
      悟空「ご子息とはどなたです。」
      毘藍婆「息子は昴日星官（ぼうじつせいかん）です。」
      悟空は驚いてやまなかった。やがて、まばゆい金光が見えてきたので、毘藍婆を振り返った。
      悟空「あの光のある所が黄花観です。」
      毘藍婆は襟の中から刺繍針を一本取り出した。太さは眉毛ほど、長さは五、六分（ぶ）ほどで、指に挟むと空へ投げた。しばらくして一声響き、金光が破れた。悟空は喜んだ。
      悟空「菩薩、お見事です、お見事です！　針を捜しましょう、捜しましょう。」
      毘藍婆は掌に載せて見せた。
      毘藍婆「これではありませんか。」
      悟空も一緒に雲を下ろして観へ入ると、百眼魔君は目を閉じ、一歩も動けずにいた。悟空は罵った。
      悟空「このろくでもない妖怪め、目が見えぬふりをしているな！」
      耳から棒を取り出して打とうとすると、毘藍婆が引き止めた。
      毘藍婆「大聖、殴ってはいけません。まずお師匠さまを見に行きなさい。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-040"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者徑至後面客位裡看時，他三人都睡在地上吐痰吐沫哩。行者垂淚道：「卻怎麼好？卻怎麼好？」毘藍道：「大聖莫悲。也是我今日出門一場，索性積個陰德。我這裡有解毒丹，送你三丸。」行者轉身拜求。那菩薩袖中取出一個破紙包兒，內將三粒紅丸子遞與行者，教放入口裡。行者把藥扳開他們牙關，每人揌了一丸。須臾，藥味入腹，便就一齊嘔噦，遂吐出毒味，得了性命。那八戒先爬起道：「悶殺我也。」三藏、沙僧俱醒了道：「好暈也。」行者道：「你們那茶裡中了毒了。虧這毘藍菩薩搭救，快都來拜謝。」三藏欠身整衣謝了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 194
        "line_end": 194
    "translation_ja": |-
      悟空がまっすぐ奥の客の間へ行くと、三人とも床に横たわり、痰や泡を吐いていた。悟空は涙を垂らした。
      悟空「どうしたらいいのです、どうしたらいいのです。」
      毘藍婆「大聖、悲しむことはありません。今日はせっかく外へ出たのですから、いっそ陰徳（いんとく）を積みましょう。解毒丹（げどくたん）を持っています。三粒差し上げます。」
      悟空は振り向いて拝み、願い求めた。毘藍婆は袖から破れた紙包みを取り出し、中の赤い丸薬三粒を悟空へ渡して、口に入れるよう言った。悟空は三人の歯をこじ開け、一人に一粒ずつ押し込んだ。ほどなく薬が腹へ入ると、三人は一斉にえずき、毒を吐き出して命を取り留めた。真っ先に起き上がったのは八戒だった。
      八戒「苦しくて、死ぬかと思った。」
      三蔵と沙悟浄も目を覚ました。
      三蔵と沙悟浄「ひどく目が回る。」
      悟空「あの茶に毒が入っていたのです。この毘藍菩薩にお助けいただいたおかげですよ。さあ、皆でお礼を申し上げてください。」
      三蔵は身を起こし、衣を整えて礼を言った。
    "translation_status": "reviewed"
  - "id": "xy-ch73-041"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒道：「師兄，那道士在那裡？等我問他一問，為何這般害我？」行者把蜘蛛精上項事說了一遍。八戒發狠道：「這廝既與蜘蛛為姊妹，定是妖精。」行者指道：「他在那殿外立定裝瞎子哩。」八戒拿鈀就築，又被毘藍止住道：「天蓬息怒。大聖知我洞裡無人，待我收他去看守門戶也。」行者道：「感蒙大德，豈不奉承。但只是教他現本像，我們看看。」毘藍道：「容易。」即上前用手一指，那道士撲的倒在塵埃，現了原身，乃是一條七尺長短的大蜈蚣精。毘藍使小指頭挑起，駕祥雲，徑轉千花洞去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 196
        "line_end": 196
    "translation_ja": |-
      八戒「兄貴、あの道士はどこだ。どうしてこんな目に遭わせたのか、聞いてやる。」
      悟空は蜘蛛の妖怪たちの一件を最初から話して聞かせた。八戒は怒りをあらわにした。
      八戒「あいつは蜘蛛と兄妹になっているのなら、きっと妖怪だ。」
      悟空は指した。
      悟空「殿の外に突っ立って、目が見えぬふりをしている。」
      八戒がまぐわを手に取り、打ち込もうとすると、また毘藍婆が止めた。
      毘藍婆「天蓬（てんぽう）、怒りを鎮めなさい。大聖は、私の洞に誰もいないと知っています。この者を引き取って、門番をさせたいのです。」
      悟空「大きなご恩をいただいたのですから、どうして従わずにいられましょう。ただ、本相を現させて、私たちにも見せてください。」
      毘藍婆「たやすいことです。」
      進み出て指をさすと、百眼魔君はどさりと土の上に倒れ、元の姿を現した。それは長さ七尺ほどもある、大きなムカデの妖怪だった。毘藍婆は小指でひょいと引っ掛けて持ち上げ、めでたい雲に乗り、まっすぐ千花洞へ帰っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch73-042"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒打仰道：「這媽媽兒卻也利害，怎麼就降這般惡物？」行者笑道：「我問他有甚兵器破他金光，他道有個繡花針兒，是他兒子在日眼裡煉的。及問他令郎是誰，他道是昴日星官。我想昴日星是隻公雞，這老媽媽必定是個母雞。雞最能降蜈蚣，所以能收伏也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 197
        "line_end": 197
    "translation_ja": |-
      八戒は仰向いて見送った。
      八戒「あのばあさまも大したものだ。どうして、あんな悪い化け物を降せたんだ。」
      悟空は笑った。
      悟空「どんな武器で金光を破るのかと聞いたら、刺繍針があって、息子が日眼の中で練ったものだと言った。それで息子は誰だと聞くと、昴日星官だと答えた。考えてみれば、昴日星（ぼうじつせい）は雄鶏だ。だったら、あのばあさまはきっと雌鶏だろう。鶏はムカデを降すのが得意だから、取り押さえられたのさ。」
    "translation_status": "reviewed"
  - "id": "xy-ch73-043"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，頂禮不盡。教：「徒弟們，收拾去罷。」那沙僧即在裡面尋了些米糧，安排了些齋，俱飽餐一頓。牽馬挑擔，請師父出門。行者從他廚中放了一把火，把一座觀霎時燒得煨燼，卻拽步長行。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 199
        "line_end": 199
    "translation_ja": |-
      三蔵は聞くと、何度も何度も深く拝んだ。そして言った。
      三蔵「お前たち、支度をして出かけよう。」
      沙悟浄は中で米などの食糧を探し、精進の食事を用意した。一同は腹いっぱい一食を取り、馬を引き、荷を担ぎ、三蔵を門へ案内した。悟空は台所から火をつけ、道観一つをたちまち灰にして、それから大股に歩き去った。まさに、こういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch73-044"
    "section_id": "chapter-73"
    "kind": "verse"
    "origin": "source"
    "source_text": "唐僧得命感毘藍，了性消除多目怪。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 201
        "line_end": 201
    "translation_ja": |-
      唐僧は命を得て、毘藍（びらん）に感謝し、
      本性を悟る心は、多目怪を取り除いた。
    "translation_status": "reviewed"
  - "id": "xy-ch73-045"
    "section_id": "chapter-73"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟向前去還有甚麼事體，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch73-1500620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第073回&oldid=1500620"
        "line_start": 203
        "line_end": 203
    "translation_ja": "さて、これから先に、またどんな出来事が待つのか。それは次回のお話をお聞きあれ。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-01-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「心主」は心を代表する悟空を指す寓意的表現。底本では「魔」の後に異文注「一作『迷』」が本文表示へ続けて入るため、原文欄にそのまま保存し、訳題でも異文の情報を分けて残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-02-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「劉阮」は、天台山で仙女に出会ったという劉晨・阮肇の故事。劉という姓だけで既出の別人物に結び付けず、二人の名を展開した。法鼓文理学院の阮肇の人名資料と、橋本公民館の公開資料の検索表示にある「劉阮天台」の説明を照合した。後者のPDF本文の直接取得は404エラーだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-03-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「撒貨頭口」は、撒和の異表記として家畜に飼料を与える意に解した。早稲田大学リポジトリ所載「中国文学研究」第十三期の論文の検索表示は、この一節を挙げてその語義を説明する。PDF本文の直接取得は429エラーで成功しておらず、検索表示での照合にとどまる。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-04-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「瓜鐵」。顔の色や形を表す難語だが、確かな語義・異文を確認できないため、通行本の別字などへ置き換えず原字に対応する「瓜鉄」を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-05-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回回と達達は中国の古い民族呼称。この人物の鼻や口をそれらにたとえる原文の表現を保存したもので、現実の集団全体の容貌を説明するものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-06-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "これは女の妖怪が述べる告発。衣服の奪取を長い口の和尚に帰すことも含め、前の回の語りと一致しない点を、その人物の発言として保持した。翻訳者が客観的な事実へ直したり、訴えの性行為の含意を削ったりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-07-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「一打三分低」は、先に人を殴る側が道理上の立場を失うという諺。教育部「重編國語辭典修訂本」の検索表示で、この一節を例文とする説明を確認した。直接ページ取得はCache missで、成功とは記録していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-08-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「分」「釐」はここでは重さの小単位で、一分は十釐。十二釐を四人分に分け、一人三個の棗へ一釐ずつ詰める数量を保存する。直前の毒薬を作る詩の三分も重量であり、長さの分とは別義。現代のグラムへ確定換算せず、物語の毒薬描写を現実の製法や効能の保証とはしない。この短い発言は、底本の「內一女子急拿了一把等子道」に従って秤を持つ女に帰した。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-09-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで土地神が七人の本相を初めて明言する。それまでは「女の妖怪」と呼び、本人たちの種族を説明や注の起点から先取りしない。到着から十年未満と、土地神が調べた三年前は異なる時点として保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-10-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「撞破金光」と記すが、この発言の時点でも光の囲いから脱していない。衝突によって光を破ったという動作と、脱出に成功しない展開をともに保持し、「破れなかった」等へ無断訂正しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-11-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鯪鯉鱗は、この底本で穿山甲の別名として示される語。通行形「鯪鯉」へ短縮せず残した。詩の薬性への言及も文学上の記述として保存し、現実の医薬的効能を保証する説明にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-12-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "大海を恐れず渡ってきたのに、小さな溝で風難に遭うという逆転の比喩。底本の一つの発話は散文段落から詩へまたがるが、日本語では直前の呼びかけと詩に分け、どちらも悟空の声として明示した。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-13-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空の発言は三蔵の死を嘆いているが、語り手が死を確定したわけではない。「三人、馬を合わせて四口」は捕らわれた命の数であり、馬も毒茶を飲んだとの記述を追加しない。戦いの五、六十合を、ここで悟空は六十合と述べている。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-14-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の字は「黎山老姆」。既出の黎山老母と同じ女仙として、通常名を維持する。喪服の女との同定は悟空が姿を見たこの箇所で初めて行い、直前の空の声にはまだ名を付けない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-15-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "洞内で見つかった女道士が毘藍婆だと明かす詩末の呼称。道教的な装束と仏教の三乗・四諦・菩薩という語彙は混在するまま残す。注の起点も名前の開示より後に置く。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-16-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「乃我小兒日眼裡煉成的」。日眼という神秘的な語を保持し、針を作る場所や具体的な製法の説明は補わない。「太陽の眼」とも、息子の眼に関わる表現とも取れるが、この訳ではどちらかへ確定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-17-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "毘藍婆が雌鶏であるという結論は、息子の昴日星官が雄鶏であることから悟空が推し量ったもの。本人が本相を現した事実や、語り手による明示へ格上げしない。針の説明もここでは悟空による言い直しである。"
    "translation_status": "reviewed"
  - "id": "xy-ch73-note-18-body"
    "section_id": "chapter-73"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「了性」は本性を悟ることをいう寓意表現。回題の心の主と響き合うものとして訳した。悟空が一人で妖怪を倒したという新しい出来事を付け加えない。"
    "translation_status": "reviewed"

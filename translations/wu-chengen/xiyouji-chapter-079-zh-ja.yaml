    "source_text": "那大聖攜著八戒，徑到南方七十里之地，住下風雲，找尋妖處。但只見一股清溪，兩邊夾岸，岸上有千千萬萬的楊柳，更不知清華莊在於何處。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 134
        "line_end": 134
    "translation_ja": "悟空は八戒を連れ、まっすぐ南へ七十里の地まで来て風雲を止め、妖怪の住まいを捜した。だが見えるのは一本の清らかな流れと、その両岸、岸に生える数限りない楊柳ばかりで、清華荘がどこにあるのか、まるで分からない。まさしくこういうありさまだ。"
    "translation_status": "draft"
  - "id": "xy-ch79-012"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "萬頃野田觀不盡，千堤煙柳隱無蹤。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      広大な野の田は、見渡しても果てがない。
      幾千の堤を煙る柳が覆い、住まいの跡さえ見えぬ。
    "translation_status": "draft"
  - "id": "xy-ch79-013"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖尋覓不著，即捻訣，念一聲「唵」字真言，拘出一個當方土地，戰兢兢近前跪下叫道：「大聖，柳林坡土地叩頭。」行者道：「你休怕，我不打你。我問你：柳林坡有個清華莊，在於何方？」土地道：「此間有個清華洞，不曾有個清華莊。小神知道了，大聖想是自比丘國來的？」行者道：「正是，正是。比丘國王被一個妖精哄了，是老孫到那廂，識得是妖怪，當時戰退那怪，化一道寒光，不知去向。及問比丘王，他說三年前進美女時，曾問其由，怪言居住城南七十里柳林坡清華莊。適尋到此，只見林坡，不見清華莊，是以問你。」土地叩頭道：「望大聖恕罪。比丘王亦我地之主也，小神理當鑒察。奈何妖精神威法大，如我泄漏他事，就來欺凌，故此未獲。大聖今來，只去那南岸九叉頭一顆楊樹根下，左轉三轉，右轉三轉，用兩手齊撲樹上，連叫三聲『開門』，即現清華洞府。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空は捜しても見つからないので、指で印を結び、「唵（おん）」の一字の真言（しんごん）を唱え、その土地の神を呼び出した。神はおそるおそる近づき、ひざまずいて言った。
      土地神（とちがみ）「大聖、柳林坡の土地神、ひれ伏してご挨拶いたします。」
      悟空「怖がるな。殴りはしない。尋ねたいんだが、柳林坡にあるという清華荘は、どこにある。」
      土地神「このあたりには清華洞（せいかどう）ならございますが、清華荘というものはございません。ははあ、分かりました。大聖は比丘国からおいでになったのではありませんか。」
      悟空「そうだ、そのとおりだ。比丘国の王は妖怪にだまされていて、俺が行って正体を見破り、戦って追い払った。すると妖怪は一筋の冷たい光に変わり、行方が分からなくなった。王に尋ねると、三年前に美女を献上したとき、来たところを尋ねたら、城の南七十里、柳林坡の清華荘に住むと答えたそうだ。そこで捜しに来たんだが、林と丘は見えても、清華荘は見えない。それでお前に聞いたんだ。」
      土地神は頭を地につけた。
      土地神「大聖、どうかお許しください。比丘王は私めの土地の主でもございますから、見張っているべきでした。けれど妖怪の威力と術は強大で、私めがその仕業を漏らせば、すぐに虐げに来ます。そのため、取り締まれずにおりました。大聖がおいでになった今は、南岸にある九つ叉の楊の木の根元へお進みください。左へ三回、右へ三回まわり、両手で同時に木を打ち、『門を開けろ』と続けて三度お呼びになれば、清華洞の入り口が現れます。」
    "translation_status": "draft"
  - "id": "xy-ch79-014"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖聞言，即令土地回去，與八戒跳過溪來，尋那顆楊樹。果然有九條叉枝，總在一顆根上。行者吩咐八戒：「你且遠遠的站定，待我叫開門，尋著那怪，趕將出來，你卻接應。」八戒聞命，即離樹有半里遠近立下。這大聖依土地之言，繞樹根，左轉三轉，右轉三轉，雙手齊撲其樹，叫：「開門，開門。」霎時間，一聲響喨，唿喇喇的門開兩扇，更不見樹的蹤跡。那裡邊光明霞采，亦無人煙。行者趁神威，撞將進去，但見那裡好個去處："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      悟空は聞くと、土地神を帰らせ、八戒と川を跳び越して、その楊の木を捜した。果たして九本に枝分かれしているが、根元は一本の木があった。悟空は八戒に言いつけた。
      悟空「お前は離れたところで待て。俺が門を開かせ、妖怪を見つけて追い出すから、そこで迎え撃ってくれ。」
      八戒は命令を聞き、木から半里ほど離れたところに立った。悟空は土地神の言うとおり、木の根元を左へ三回、右へ三回まわり、両手で木を打った。
      悟空「門を開けろ、門を開けろ！」
      たちまち大きな音がして、ばっと二枚の扉が開き、木の姿はどこにも見えなくなった。中は明るい霞の光に満ち、人の暮らす気配はない。悟空は神威を頼みに勢いよく中へ入り、すばらしい場所を見た。
    "translation_status": "draft"
  - "id": "xy-ch79-015"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "煙霞晃亮，日月偷明。白雲常出洞，翠蘚亂漫庭。一徑奇花爭豔麗，遍階瑤草鬥芳榮。溫暖氣，景常春，渾如閬苑，不亞蓬瀛。滑凳攀長蔓，平橋掛亂藤。蜂啣紅蕊來巖窟，蝶戲幽蘭過石屏。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      煙る霞はきらめき、日と月の明るさをもひそかに奪う。
      白雲は絶えず洞から湧き、緑の苔は庭一面に広がる。
      小道には珍しい花が美しさを競い、階には瑤草（ようそう）が芳しさと茂りを争う。
      気は暖かく、眺めはいつも春。
      まるで閬苑（ろうえん）、蓬瀛（ほうえい）にも劣りはしない。
      滑らかな腰掛けには長い蔓が這い、平らな橋には藤が乱れて垂れる。
      蜂は赤い花のしべをくわえて岩窟へ戻り、蝶はひそやかな蘭に戯れて石の屏風を越えていく。
    "translation_status": "draft"
  - "id": "xy-ch79-016"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者急拽步，行近前邊細看，見石屏上有四個大字：「清華仙府」。他忍不住，跳過石屏看處，只見那老怪懷中摟著個美女，喘噓噓的，正講比丘國事，齊聲叫道：「好機會來，三年事，今日得完，被那猴頭破了。」行者跑近身，掣棒高叫道：「我把你這夥毛團！甚麼『好機會』？吃我一棒。」那老怪丟了美人，掄起蟠龍拐，急架相迎。他兩個在洞前，這場好殺，比前又甚不同："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      悟空は足を速め、前へ進んでよく見ると、石の屏風には「清華仙府（せいかせんぷ）」の四文字が大きく刻まれていた。待ちきれず屏風を跳び越えて見ると、国丈が美后を腕に抱き、息を弾ませながら、ちょうど比丘国の話をしていた。二人は声をそろえて叫んだ。
      国丈と美后「絶好の機会だったのに。三年越しのことが今日こそ成し遂げられるところを、あの猿めにぶち壊された！」
      悟空はそばへ駆け寄り、棒を引き抜いて怒鳴った。
      悟空「この毛玉どもめ！　何が『絶好の機会』だ。俺の一撃を受けろ！」
      国丈は美后を放り出し、蟠竜の杖を振って急いで受け止めた。二人は洞の前で、また激しく戦ったが、前とはまるで違う戦いだった。
    "translation_status": "draft"
  - "id": "xy-ch79-017"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "棒舉迸金光，拐掄兇氣發。那怪道：「你無知敢進我門來。」行者道：「我有意降妖怪。」那怪道：「我戀國主你無干，怎的欺心來展抹？」行者道：「僧修政教本慈悲，不忍兒童活見殺。」語去言來各恨仇，棒迎拐架當心扎。促損琪花為顧生，踢破翠苔因把滑。只殺得那洞中霞采欽光明，崖上芳菲俱掩壓。乒乓驚得鳥難飛，吆喝嚇得美人散。只存老怪與猴王，呼呼捲地狂風刮。看看殺出洞門來，又撞悟能獃性發。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      棒を上げれば金の光がほとばしり、杖を回せば凶暴な気が湧き立つ。
      国丈「物知らずめ、よくもわしの門をくぐったな。」
      悟空「俺は承知で妖怪を降しに来たのさ。」
      国丈「わしが国王に取り入っても、お前には関係なかろう。なぜ悪意で邪魔をする。」
      悟空「僧が正しい教えを修める根本は慈悲だ。生きた子供が殺されるのを、見ていられるものか。」
      言葉を交わすたびに恨みは募り、棒を迎え、杖で受け、胸元を突く。
      命を守ろうとして珍しい花を踏み荒らし、足を滑らせまいと緑の苔を蹴り破る。
      激しい戦いに、洞の霞も輝きを失い、崖の香る草花も押しつぶされる。
      がんがんという音に鳥も飛べず、怒号におびえた美后は逃げる。
      残るは老いた妖怪と猴王（こうおう）だけ。ごうごうと暴風が地を巻いて吹きすさぶ。
      やがて戦いながら洞の門を出ると、またも悟能（ごのう）が愚直な性分をむき出しにする。
    "translation_status": "draft"
  - "id": "xy-ch79-018"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來八戒在外邊，聽見他們裡面嚷鬧，激得他心癢難撓，掣釘鈀，把一顆九叉楊樹鈀倒，使鈀築了幾下，築得那鮮血直冒，嚶嚶的似乎有聲。他道：「這顆樹成了精也，這顆樹成了精也。」八戒舉鈀，又正築處，只見行者引怪出來。那獃子不打話，趕上前，舉鈀就築。那老怪戰行者已是難敵，見八戒鈀來，愈覺心慌，敗了陣，將身一幌，化道寒光，徑投東走。他兩個決不放鬆，向東趕來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      八戒は外で二人が中から騒ぐのを聞き、むずむずして我慢できなくなったのだった。釘鈀（ていは）を取り出すと、九つ叉の楊の木を掻き倒し、何度か打ち込んだ。すると鮮血がどっと噴き出し、かすかに泣くような声まで聞こえる。
      八戒「この木は妖怪になったんだ。この木は妖怪になったんだ！」
      八戒がまた熊手を上げ、打ち込もうとしたとき、悟空が国丈を誘い出してきた。八戒は何も言わずに駆け寄り、熊手を振り上げて打った。国丈は悟空だけでも手に余るのに、八戒の熊手まで来たので、ますます慌て、敗れて身をひるがえすと冷たい光に変わり、まっすぐ東へ逃げた。二人は決して逃がすまいと、東へ追いかけた。
    "translation_status": "draft"
  - "id": "xy-ch79-019"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正當喊殺之際，又聞得鸞鶴聲鳴，祥光縹緲。舉目視之，乃南極老人星也。那老人把寒光罩住，叫道：「大聖慢來，天蓬休趕，老道在此施禮哩。」行者即答禮道：「壽星兄弟，那裡來？」八戒笑道：「肉頭老兒罩住寒光，必定捉住妖怪了。」壽星陪笑道：「在這裡，在這裡。望二公饒他命罷。」行者道：「老怪不與老弟相干，為何來說人情？」壽星笑道：「他是我的一副腳力，不意走將來，成此妖怪。」行者道：「既是老弟之物，只教他現出本相來看看。」壽星聞言，即把寒光放出，喝道：「孽畜！快現本相，饒你死罪。」那怪打個轉身，原來是隻白鹿。壽星拿起拐杖道：「這孽畜，連我的拐棒也偷來也。」那隻鹿俯伏在地，口不能言，只管叩頭滴淚。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      追い殺そうと声を上げていたそのとき、鸞（らん）と鶴の鳴き声が聞こえ、めでたい光がたなびいた。目を上げると、南極老人星（なんきょくろうじんせい）、すなわち寿星（じゅせい）である。寿星は逃げる冷光を覆いとどめ、呼びかけた。
      寿星「大聖、しばらくお待ちを。天蓬（てんぽう）、追うのをおやめなさい。老道（ろうどう）の私が、ここでご挨拶しております。」
      悟空はすぐ答礼した。
      悟空「寿星、兄弟、どこから来たんだ。」
      八戒は笑った。
      八戒「あの肉づきのいい爺さんが光を包んだからには、きっと妖怪を捕まえたんだな。」
      寿星は愛想よく笑った。
      寿星「ここにおります、ここにおります。どうかお二方、命だけは許してやってください。」
      悟空「あの老いた妖怪は、あんたと関わりがないだろう。どうして取りなすんだ。」
      寿星「あれは私の乗り物なのです。思いがけず逃げ出してきて、こんな妖怪になってしまいました。」
      悟空「あんたのものなら、本来の姿を現させて、見せてくれ。」
      寿星は冷光を解き放ち、怒鳴った。
      寿星「この畜生め！　早く本来の姿を現せ。そうすれば死罪は許してやる。」
      国丈がくるりと身を回すと、正体は一頭の白鹿だった。寿星は杖を拾い上げた。
      寿星「この畜生、私の杖まで盗んできたのか。」
      鹿は地に伏し、言葉を発することもできず、ただ頭を下げて涙を流していた。その姿はこうであった。
    "translation_status": "draft"
  - "id": "xy-ch79-020"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一身如玉簡斑斑，兩角參差七叉彎。
      幾度饑時尋藥圃，有朝渴處飲雲潺。
      年深學得飛騰法，日久修成變化顏。
      今見主人呼喚處，現身抿耳伏塵寰。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 149
        "line_end": 152
    "translation_ja": |-
      全身は玉の札にも似て、斑模様が浮かび、二本の角は七つ叉に、入り組んで曲がる。
      腹が減れば幾度も薬草園を訪ね、喉が渇けば雲間のせせらぎを飲んだ。
      長年を経て空を飛ぶ術を覚え、日を重ねて姿を変える力を修めた。
      今、主人の呼ぶ声に、本来の姿を現して耳を伏せ、俗世の塵の上にうずくまる。
    "translation_status": "draft"
  - "id": "xy-ch79-021"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "壽星謝了行者，就跨鹿而行。被行者一把扯住道：「老弟，且慢走，還有兩件事未完哩。」壽星道：「還有甚麼未完之事？」行者道：「還有美人未獲，不知是個甚麼怪物；還又要同到比丘城見那昏君，現相回旨也。」壽星道：「既這等說，我且寧耐。你與天蓬下洞擒捉那美人來，同去現相可也。」行者道：「老弟略等等兒，我們去了就來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      寿星は悟空に礼を言うと、鹿にまたがって立ち去ろうとした。悟空はひとつかみに引き止めた。
      悟空「兄弟よ、まだ行くな。片づいていないことが二つある。」
      寿星「まだ、何が残っているのですか。」
      悟空「まだあの美女を捕まえていない。何の妖怪なのかも分からない。それから、一緒に比丘城（びくじょう）へ行って、あの愚かな王に正体を見せ、頼まれたことの始末をつけなければならん。」
      寿星「それなら待ちましょう。あなたと天蓬で洞へ降り、あの美女を捕まえてきてください。それから一緒に、正体を見せに行けばよろしい。」
      悟空「少しだけ待っていてくれ。行って、すぐ戻る。」
    "translation_status": "draft"
  - "id": "xy-ch79-022"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那八戒抖擻精神，隨行者徑入清華仙府，吶聲喊，叫：「拿妖精，拿妖精！」那美人戰戰兢兢，正自難逃，又聽得喊聲大振，即轉石屏之內，又沒個後門出頭。被八戒喝聲：「那裡走？我把你這個哄漢子的臊精，看鈀。」那美人手中又無兵器，不能迎敵，將身一閃，化道寒光，往外就走。被大聖抵住寒光，乒乓一棒。那怪立不住腳，倒在塵埃，現了本相，原來是一個白面狐狸。獃子忍不住手，舉鈀照頭一築。可憐把那個傾城傾國千般笑，化作毛團狐狸形。行者叫道：「莫打爛他，且留他此身去見昏君。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      八戒は元気を振り起こして悟空についていき、清華仙府へまっすぐ入ると、大声を上げた。
      八戒「妖怪を捕まえろ、妖怪を捕まえろ！」
      美后はぶるぶる震え、逃げることもできずにいたが、また大声が響くのを聞き、石の屏風の内側へ回った。しかし外へ出る裏口もない。八戒が怒鳴った。
      八戒「どこへ行く。この男をだます臭い妖怪め、俺の熊手を受けろ！」
      美后は手に武器もなく、迎え撃てない。身をひるがえすと冷光に変わり、外へ逃げようとした。そこを悟空が冷光を遮り、がつんと棒を振り下ろした。美后は踏みとどまれず、地に倒れて本来の姿を現した。その正体は、顔の白い狐だった。八戒は手を止められず、熊手を上げて頭を一撃した。ああ、城を傾け国を傾けるほどの、千変万化の笑みを浮かべた美貌が、毛に覆われた狐の姿となってしまった。悟空が叫んだ。
      悟空「潰してしまうな。あの愚かな王に見せるから、ひとまずこの体を残しておけ。」
    "translation_status": "draft"
  - "id": "xy-ch79-023"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子不嫌穢污，一把揪住尾子，拖拖扯扯，跟隨行者出得門來。只見那壽星老兒手摸著鹿頭罵道：「好孽畜啊，你怎麼背主逃去，在此成精？若不是我來，孫大聖定打死你了。」行者跳出來道：「老弟說甚麼？」壽星道：「我囑鹿哩，我囑鹿哩。」八戒將個死狐狸摜在鹿的面前道：「這可是你的女兒麼？」那鹿點頭幌腦，伸著嘴，聞他幾聞，呦呦發聲，似有眷戀不捨之意。被壽星劈頭撲了一掌道：「孽畜！你得命足矣，又聞他怎的？」即解下勒袍腰帶，把鹿扣住頸項，牽將起來，道：「大聖，我和你比丘國相見去也。」行者道：「且住，索性把這邊都掃個乾淨，庶免他年復生妖孽。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      八戒は汚れもいとわず、尾をひとつかみにし、引きずりながら悟空について門を出た。見ると寿星が鹿の頭をなで、叱っていた。
      寿星「まったく、とんでもない畜生だ。なぜ主人に背いて逃げ、この地で妖怪になった。私が来なければ、孫大聖に打ち殺されていたぞ。」
      悟空は跳び出して尋ねた。
      悟空「兄弟、何を言っているんだ。」
      寿星「鹿に言い聞かせているのです、言い聞かせているのです。」
      八戒は狐の死骸を、鹿の前へ投げつけた。
      八戒「こいつがお前の娘かい。」
      鹿は頭を振ってうなずき、口先を伸ばして何度か嗅ぐと、きゅうきゅうと鳴いた。名残を惜しみ、離れがたく思っているかのようだった。寿星は鹿の頭をぱんと一つ叩いた。
      寿星「この畜生！　命が助かっただけで十分だろう。まだ何を嗅いでいる。」
      寿星は衣を締めた腰帯を解くと、鹿の首に巻き、引いて立たせた。
      寿星「大聖、あなたと一緒に比丘国へ参りましょう。」
      悟空「待ってくれ。いっそのこと、ここもすっかり片づけて、後の年にまた妖怪が生まれないようにしよう。」
    "translation_status": "draft"
  - "id": "xy-ch79-024"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒聞言，舉鈀將柳樹亂築。行者又念聲「唵」字真言，依然拘出當方土地，叫：「尋些枯柴，點起烈火，與你這方消除妖患，以免欺凌。」那土地即轉身，陰風颯颯，帥起陰兵，搬取了些迎霜草、秋青草、蓼節草、山蕊草、蔞蒿柴、龍骨柴、蘆荻柴，都是隔年乾透的枯焦之物，見火如同油膩一般。行者叫：「八戒，不必築樹，但得此物填塞洞裡，放起火來，燒得個乾淨。」火一起，果然把一座清華妖怪宅，燒作火池坑。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      八戒は聞くと、熊手を振り上げて柳の木をめった打ちにした。悟空は再び「唵」の一字の真言を唱え、同じ土地神を呼び出して命じた。
      悟空「枯れ枝を捜して、大きな火を起こせ。この土地から妖怪の災いを取り除き、もう虐げられないようにしてやる。」
      土地神が身を返すと、陰風がさっと起こった。神は陰兵を率い、迎霜草（げいそうそう）、秋青草（しゅうせいそう）、蓼節草（りょうせつそう）、山蕊草（さんずいそう）、蔞蒿柴（ろうこうさい）、竜骨柴（りゅうこつさい）、蘆荻柴（ろてきさい）を運んできた。どれも前年から乾ききった、からからの草や柴で、火がつけば油も同然に燃える。
      悟空「八戒、もう木を打たなくていい。この燃料を洞いっぱいに詰め、火をつけて、きれいさっぱり焼いてしまおう。」
      火が上がると、果たして一軒の清華の妖怪屋敷は、燃えさかる火の池のような穴に変わった。
    "translation_status": "draft"
  - "id": "xy-ch79-025"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這裡才喝退土地，同壽星牽著鹿，拖著狐狸，一齊回到殿前，對國王道：「這是你的美后，與他耍子兒麼？」那國王膽戰心驚。又只見孫大聖引著壽星，牽著白鹿，都到殿前，諕得那國裡君臣妃后一齊下拜。行者近前，攙住國王，笑道：「且休拜我。這鹿兒卻是國丈，你只拜他便是。」那國王羞愧無地，只道：「感謝神僧救我一國小兒，真天恩也。」即傳旨，教光祿寺安排素宴，大開東閣，請南極老人與唐僧四眾，共坐謝恩。三藏拜見了壽星，沙僧亦以禮見。都問道：「白鹿既是老壽星之物，如何得到此間為害？」壽星笑道：「前者，東華帝君過我荒山，我留坐著棋，一局未終，這孽畜走了。及客去尋他不見，我因屈指一算，知他走在此處，特來尋他，正遇著孫大聖施威。若果來遲，此畜休矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      それから土地神を帰らせ、寿星とともに鹿を引き、狐を引きずって、一行は殿前へ戻った。国王に向かって声がした。
      話者不明「これがお前の美后だぞ。一緒に遊んでみるか。」
      国王は肝を冷やして震え上がった。また、悟空が寿星を案内し、白鹿を引いて殿前へ来るのが見えると、王も臣下も妃たちも、恐れて一斉にひざまずいた。悟空は国王のそばへ寄り、支え起こして笑った。
      悟空「俺を拝むのはよせ。この鹿こそ国丈なんだから、こいつを拝めばいい。」
      国王は身の置きどころもないほど恥じ入り、ただこう言った。
      国王「この国の子供を救ってくださった神僧に感謝いたします。まことに天のご恩です。」
      国王は光禄寺に精進の宴を用意するよう命じ、東閣（とうかく）を広く開いて、南極老人（なんきょくろうじん）と三蔵の師弟四人を招き、同じ席で礼を述べることにした。三蔵が寿星に拝礼すると、沙悟浄も礼をして挨拶した。二人は尋ねた。
      三蔵と沙悟浄「白鹿は寿星さまのものだというのに、どうしてこの地へ来て害をなしたのでしょう。」
      寿星は笑って答えた。
      寿星「先日、東華帝君（とうかていくん）が私の山に立ち寄られたので、引き止めて碁を打っておりました。一局も終わらぬうちに、この畜生が逃げてしまったのです。お客が帰ってから捜しても見当たらず、指を折って占いますと、ここへ来たと分かりました。それで捜しに来て、ちょうど孫大聖が威力を振るうところへ行き会ったのです。本当にもう少し遅ければ、この畜生の命はありませんでした。」
    "translation_status": "draft"
  - "id": "xy-ch79-026"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "敘不了，只見報道：「宴已完備。」好素宴："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      話の終わらぬうちに、報告が来た。
      報告者「宴の支度が整いました。」
      実に立派な精進の宴であった。
    "translation_status": "draft"
  - "id": "xy-ch79-027"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "五彩盈門，異香滿座。桌掛繡緯生錦豔，地鋪紅毯晃霞光。寶鴨內，沉檀香裊；御筵前，蔬品香馨。看盤高果砌樓臺，龍纏斗糖擺走獸。鴛鴦錠，獅仙糖，似模似樣；鸚鵡杯，鷺鶿杓，如相如形。席前果品般般盛，案上齋殽件件精。魁圓繭栗，鮮荔桃子。棗兒柿餅味甘甜，松子葡萄香膩酒。幾般蜜食，數品蒸酥。油炸糖澆，花團錦砌。金盤高壘大饝饝，銀碗滿盛香稻飯。辣煼煼湯水粉條長，香噴噴相連添換美。說不盡蘑菇、木耳、嫩筍、黃精，十香素菜，百味珍饈。往來綽摸不曾停，進退諸般皆盛設。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      五色の飾りが門にあふれ、不思議なよい香りが席に満ちる。
      卓に掛けた刺繍の垂れ布は錦の艶を放ち、地に敷いた赤い絨毯は霞の光を照り返す。
      鴨の形の香炉には沈香と檀香が細く立ち、王の宴席には野菜料理の香りが漂う。
      飾り皿の果物は高く楼台をかたどり、竜纏（りゅうてん）と斗糖（とうとう）は走る獣の姿に並べられる。
      鴛鴦錠（えんおうてい）に獅仙糖（しせんとう）、そっくりの姿に作られ、
      鸚鵡杯（おうむはい）に鷺鶿杓（ろじしゃく）も、それぞれの鳥の姿そのまま。
      席の前には種々の果物がふんだんに、卓の上には精進の肴がどれも精巧に。
      魁円（かいえん）と繭栗（けんりつ）、新鮮なライチに桃。
      ナツメと干し柿は甘く、松の実と葡萄に、香り豊かでこくのある酒。
      幾種類もの蜜菓子、いくつもの蒸酥（じょうそ）。
      油で揚げ、砂糖をかけ、花の房や錦のように積み飾る。
      金の皿には大きな饅頭を高く盛り、銀の椀には香る米の飯がいっぱい。
      ぴりりと辛い汁には長い春雨、香り立つ美味が次々に足され、取り替えられる。
      キノコ、キクラゲ、若いタケノコ、黄精（おうせい）、語り尽くせぬほど。
      十の香りの精進料理、百の味の珍しいご馳走。
      行き来して取り回す手は休まず、出すものも下げるものも、すべてが盛大なもてなし。
    "translation_status": "draft"
  - "id": "xy-ch79-028"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當時敘了坐次：壽星首席，長老次席，國王前席，行者、八戒、沙僧側席。傍又有兩三個大師相陪左右。即命教坊司動樂。國王擎著紫霞杯，一一奉酒。惟唐僧不飲。八戒向行者道：「師兄，果子讓你，湯飯等須請讓我受用受用。」那獃子不分好歹，一齊亂上，但來的吃個精空。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      その場で席順を定め、寿星を上座、三蔵を次の席、国王を正面の席に据え、悟空、八戒、沙悟浄は脇の席に座った。さらに二、三人の大師（だいし）が左右で相伴した。国王は教坊司（きょうぼうし）に演奏を命じ、紫霞杯（しかはい）を手に、一人一人へ酒を勧めた。ただ三蔵だけは飲まなかった。八戒は悟空に言った。
      八戒「兄貴、果物は譲るから、汁や飯は俺に存分に食わせてくれよ。」
      この食いしん坊は、よいも悪いも選ばず、手当たり次第に手を出して、運ばれてくるものを何もかも平らげた。
    "translation_status": "draft"
  - "id": "xy-ch79-029"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一席筵宴已畢，壽星告辭。那國王又近前跪拜壽星，求祛病延年之法。壽星笑道：「我因尋鹿，未帶丹藥。欲傳你修養之方，你又筋衰神敗，不能還丹。我這衣袖中只有三個棗兒，是與東華帝君獻茶的，我未曾吃，今送你罷。」國王吞之，漸覺身輕病退。後得長生者，皆原於此。八戒看見，就叫道：「老壽，有火棗，送我幾個吃吃。」壽星道：「未曾帶得，待改日我送你幾斤。」遂出了東閣，道了謝意，將白鹿一聲喝起，飛跨背上，踏雲而去。這朝中君王妃后、城中黎庶居民，各各焚香禮拜不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      宴が終わると、寿星は別れを告げた。国王はまた近寄ってひざまずき、病を除いて寿命を延ばす方法を願い求めた。寿星は笑った。
      寿星「鹿を捜しに来たので、丹薬は持ってきておりません。修養の方法を伝えようにも、あなたは筋力も精神も衰え、還丹（かんたん）を成すことができません。私の袖の中には、ただナツメが三つあります。東華帝君にお茶を差し上げたときのもので、私はまだ食べておりません。今、あなたに差し上げましょう。」
      国王がそれを飲み下すと、次第に体が軽く、病が退いていくように感じられた。後に長寿を得たのも、すべてこれがもとである。八戒は見ると、声をかけた。
      八戒「寿星の爺さん、火棗（かそう）があるなら、俺にも幾つかくれよ。」
      寿星「持ってきておりません。また別の日に、何斤（きん）か差し上げましょう。」
      寿星は東閣を出て、礼を述べた。そして一声叱って白鹿を立たせ、ひらりと背にまたがると、雲を踏んで去っていった。朝廷の王や妃たち、城下の民は、それぞれ香を焚いて拝礼したが、その話はさておく。
    "translation_status": "draft"
  - "id": "xy-ch79-030"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏叫：「徒弟，收拾辭王。」那國王又苦留求教。行者道：「陛下，從此色欲少貪，陰功多積，凡百事將長補短，自足以祛病延年，就是教也。」遂拿出兩盤散金碎銀，奉為路費。唐僧堅辭，分文不受。國王無已，命擺鑾駕，請唐僧端坐鳳輦龍車，王與嬪后，俱推輪轉轂，方送出朝。六街三市，百姓群黎，亦皆盞添淨水，爐焚真香，又送出城。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      三蔵は呼びかけた。
      三蔵「弟子たち、支度をして、王にお別れを申し上げよう。」
      国王はまた懸命に引き止め、教えを請うた。
      悟空「陛下、これからは色欲を貪るのを控え、人知れぬ善行を多く積み、何事にも長所をもって短所を補うようにすれば、おのずと病を退け、寿命を延ばせる。それが教えだ。」
      国王はそこで、金銀の小さな塊を盛った皿を二つ取り出し、旅費として差し出した。しかし三蔵はきっぱり辞退し、一文も受け取らなかった。国王も仕方なく行列を整えさせ、三蔵を鳳凰と竜を飾った御車にきちんと座らせた。王と妃たちはともに車輪を押し、車軸を回して朝廷から送り出した。大通りも市場も、民はみな器に清らかな水を満たし、香炉によい香を焚いて、一行を城外へ送った。
    "translation_status": "draft"
  - "id": "xy-ch79-031"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "忽聽得半空中一聲風響，路兩邊落下一千一百一十一個鵝籠，內有小兒啼哭，暗中有原護的城隍、土地、社令、真官、五方揭諦、四值功曹、六丁六甲、護教伽藍等眾，應聲高叫道：「大聖，我等前蒙吩咐，攝去小兒鵝籠，今知大聖功成起行，一一送來也。」那國王妃后與一應臣民，又俱下拜。行者望空道：「有勞列位，請各歸祠，我著民間祭祀謝你。」呼呼淅淅，陰風又起而退。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      そのとき突然、空中で風の鳴る音がして、道の両側に一千一百一十一個の鵞鳥籠が降りてきた。中では子供たちが泣いている。姿は見えないが、もともと子供を守っていた城隍（じょうこう）、土地神、社令（しゃれい）、真官（しんかん）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、六丁六甲（ろくていろっこう）、護教伽藍（ごきょうがらん）たちが、音とともに大声で呼びかけた。
      神々「大聖、私どもは先にお言いつけを受け、子供たちの入った鵞鳥籠を運び去りました。今、大聖が功を遂げて出立なさると知り、一つ残らずお返しに参りました。」
      国王も妃も臣民も、また一斉にひざまずいた。悟空は空を仰いで言った。
      悟空「みなさん、ご苦労だった。それぞれの祠へお戻りください。民に祭りをさせて、お礼をさせよう。」
      ごうごう、さあさあと陰風が再び起こり、神々は去っていった。
    "translation_status": "draft"
  - "id": "xy-ch79-032"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者叫城裡人家來認領小兒。當時傳播，俱來各認出籠中之兒，歡歡喜喜，抱出叫哥哥，叫肉兒，跳的跳，笑和笑，都叫：「扯住唐朝爺爺，到我家奉謝救兒之恩。」無大無小，若男若女，都不怕他相貌之醜，擡著豬八戒，扛著沙和尚，頂著孫大聖，撮著唐三藏，牽著馬，挑著擔，一擁回城。那國王也不能禁止。這家也開宴，那家也設席。請不及的，或做僧帽、僧鞋、褊衫、布襪，裡裡外外，大小衣裳，都來相送。如此盤桓，將有個月，才得離城。又有傳下影神，立起牌位，頂禮焚香供養。這才是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空は町の家々に、子供を確かめて引き取るよう呼びかけた。知らせはたちまち広まり、人々はそれぞれ籠の中からわが子を見つけ、喜び勇んで抱き上げ、「坊や」「かわいい子よ」と呼びかけた。跳ね回る者、笑う者がいて、みな叫んだ。
      人々「唐から来た恩人をお引き止めしよう。うちへ来ていただいて、子供を救ってくださったお礼をしよう！」
      大人も子供も、男も女も、誰一人その醜い姿を恐れなかった。八戒を担ぎ、沙悟浄を肩に載せ、悟空を高く頂き、三蔵を抱え上げ、馬を引き、荷を担ぎ、どっと城へ戻った。国王にも止めることはできない。こちらの家も宴を開き、あちらの家も席を設けた。招ききれなかった家では、僧帽や僧靴、褊衫（へんさん）や布の足袋を作り、肌着から上着まで、大きな衣から小さな衣まで、みな贈りに来た。こうしてひと月近く引き止められ、ようやく城を離れることができた。さらに師弟の肖像を後世へ残し、位牌を立て、地に頭をつけて拝み、香を焚いて供養する者もいた。まさにこういうことだ。
    "translation_status": "draft"
  - "id": "xy-ch79-033"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "陰功高疊恩山重，救活千千萬萬人。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      人知れぬ功徳は高く積もり、その恩は山にも重い。
      救って生かす人の数、千にも万にも及ぶのだ。
    "translation_status": "draft"
  - "id": "xy-ch79-034"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知向後又有甚麼事體，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 174
        "line_end": 174
    "translation_ja": "さて、この先またどのようなことが起こるのか。それは次回のお話。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-01-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「多心」は、心臓が多いという字面と、心があれこれ動く・疑い深いという意味を重ねた言葉。「心」は肉体の臓器と精神の両方を指す。「黒心」も黒い心臓と腹黒い心を掛けている。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-02-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "心の列挙には「謹慎心」という慎みの心も交じる。善悪を整理し直さず、赤・白・黄の三色から「種種不善之心」まで十七の表現を原文の順で残した。「無名隱暗」は、名を示さず暗く隠れた心と解したが、細部は未確定。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-03-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「沒佈擺」は、恐れてどう対処してよいか分からない状態と解した。「佈擺」の細かな語義は、この用例だけでは確定できない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-04-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「閣下太宰」は、朝廷の高官を示す呼び方として残した。現代の日本語の敬称「閣下」とまったく同じ制度用法であるとは断定しない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-05-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「臊泥」「臊臉」は、前の出来事で八戒の尿を混ぜて作った泥の面の臭さを指す。三蔵の顔を変えた主体と、三蔵に化けた悟空を区別した。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-06-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「元陽未泄」は、性行為で生命の根源とされる陽の精気を漏らしていないという修行上の表現。国王は国丈から聞いた薬効を語っているのであり、実際の医療効果を保証するものではない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-07-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「萬頃」は一万の頃という広大さの表現。頃は田の面積の単位で、具体的な現代面積への換算は行わない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-08-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "土地神の指示では「開門」を三度唱えるが、実演の原文に記されるのは二度。その違いを埋めるための三度目の台詞は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-09-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "先行する「日月偷明」は、日と月の光までひそかに取るほど明るい景色と解した。何かの術が実際に日月を盗むという出来事にはしていない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-10-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「滑凳」。滑らかな腰掛けと解して字面を残したが、岩などの別字へ原文を直す根拠はない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-11-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「展抹」は、国王に取り入るのを邪魔し、企てを潰す行為と文脈から解した。語の具体的な来歴や動作の細部は未確定。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-12-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の「促損琪花為顧生、踢破翠苔因把滑」は、命を守るために花を踏み荒らし、滑らないよう苔を蹴り破る描写と解した。「把滑」は滑るのを防ぐ意味で確認できるが、「促損」「顧生」の語の結び方には留保がある。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-13-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の底本は「霞采欽光明」。欽の字のままでは語の結びつきが難しく、戦いで霞の光が失われるという文脈で訳した。比較資料の公開検索表示には「欠光明」とあるが、本原文を欠へ変更してはいない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-14-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "門が開いたときには楊の木の跡が消えたと語られるが、外にいる八戒は九つ叉の木を倒して打っている。木から血と声が出ることも原文どおり残し、地形や変化の仕組みを補って整合させない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-15-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「肉頭」は身体がふっくらして肉づきがよいという用法があり、『西遊記』で寿星をからかう同形の用例も辞書に引かれる。ここでは単に愚かだという罵倒にはしない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-16-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "国丈が寿星の乗り物であるという説明、白鹿の本相、寿星の杖を盗んだという叱責は、それぞれ本文の示す順で訳した。白鹿と美后との実の親子関係までは、ここでは確定しない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-17-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "白鹿の詩の「玉簡」は玉製の札をいう字面として残した。「斑斑」の具体的な斑模様や材質の対応は未確定。「七叉」は鹿の角の枝で、洞の入口の木の九枝とは別の数である。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-18-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "国王が語った「後妻の娘」は国丈の言い分を伝えたもの。八戒が娘かと問い、鹿がうなずいたり匂いを嗅いだりする反応も、語り手による実血縁の確定とはしていない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-19-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "燃料は迎霜草・秋青草・蓼節草・山蕊草・蔞蒿柴・龍骨柴・蘆荻柴の七つを省かず残した。草名や柴名の具体的な植物種はすべてが確定するわけではなく、龍骨を薬材の化石骨へ置き換えたり、現代の同名植物と断定したりしない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-20-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の「これがお前の美后だぞ」という呼びかけは、原文で発言者を明示していない。狐を引きずる八戒の発言とも読めるが、断定せず「話者不明」とした。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-21-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「都問」は、直前に寿星へ挨拶する三蔵と沙悟浄を受けた合同の問いと読んだ。ほかの同席者も含むかどうかは、原文だけでは明示されない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-22-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "先行する「龍纏斗糖」は、既存の訳語に合わせて「竜纏」と「斗糖」という飾り菓子の名に分けて訳した。菓子の細かな製法や語の切れ目は未確定であり、並べられた走る獣の形という描写を残した。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-23-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の「魁圓」は、古い植物名対照資料の検索表示で龍眼の別称として載るので、リュウガンの名と解した。ただし資料のPDF全文は容量制限で取得できていない。「繭栗」はこの精進の宴の食物名として原字を残す。一般辞書には小牛・花のつぼみ・若い筍の用例があり、この場面の食物を一意には確定できない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-24-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の「松子葡萄香膩酒」は、松の実・葡萄と、芳醇な酒を並べると解した。松の実や葡萄から作る酒という限定はせず、句の結びつきに留保を残す。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-25-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「往來綽摸」は宴席で物を取り扱い、給仕が絶えず行き来する様子と解した。「綽摸」の具体的な語義の確証は得られておらず、作業の細部は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-26-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「大師」は高僧への敬称にも高位の官の呼称にもなりうる。相伴する人物の役割は明示されないため、僧とも官とも断定せず原字を残した。読みは一般的な字音に基づく。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-27-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「還丹」は道教の錬丹術と修養の語。ここでは弱った心身では、その修養を成し遂げられないという寿星の説明として訳した。現実の治療法を示す説明ではない。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-28-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "金銀を差し出す箇所は原文の主語が省略されている。三蔵が断る応答と、この場での送り手が国王であることから、差し出したのは国王と解した。"
    "translation_status": "draft"
  - "id": "xy-ch79-note-29-body"
    "section_id": "chapter-79"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の「哥哥」「肉兒」は、取り戻した幼児をかわいがる呼びかけとして訳した。前者を実の兄への呼びかけ、後者を食べる肉とみなして、新たな人物関係や行動を加えてはいない。"
    "translation_status": "draft"

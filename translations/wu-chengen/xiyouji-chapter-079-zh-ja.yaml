    "translation_ja": |-
      第七十九回
      洞を尋ねて妖怪を捕らえ、寿星の老人に出会う
      朝廷で君主を正し、幼い子供たちを救う
    "translation_status": "draft"
  - "id": "xy-ch79-002"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那錦衣官把假唐僧扯出館驛，與羽林軍圍圍繞繞，直至朝門外，對黃門官言：「我等已請唐僧到此，煩為轉奏。」黃門官急進朝，依言奏上昏君，遂請進去。眾官都在階下跪拜，惟假唐僧挺立階心，口中高叫：「比丘王，請我貧僧何說？」君王笑道：「朕得一疾，纏綿日久不愈。幸國丈賜得一方，藥餌俱已完備，只少一味引子。特請長老，求些藥引。若得病愈，與長老修建祠堂，四時奉祭，永為傳國之香火。」假唐僧道：「我乃出家人，隻身至此，不知陛下問國丈要甚東西作引？」昏君道：「特求長老的心肝。」假唐僧道：「不瞞陛下說，心便有幾個兒，不知要的甚麼色樣？」那國丈在傍指定道：「那和尚，要你的黑心。」假唐僧道：「既如此，快取刀來，剖開胸腹，若有黑心，謹當奉命。」那昏君歡喜相謝，即著當駕官取一把牛耳短刀，遞與假僧。假僧接刀在手，解開衣服，挺起胸膛，將左手抹腹，右手持刀，唿喇的響一聲，把肚皮剖開，那裡頭就骨都都的滾出一堆心來。諕得文官失色，武將身麻。國丈在殿上見了道：「這是個多心的和尚。」假僧將那些心，血淋淋的一個個撿開與眾觀看，卻都是些紅心、白心、黃心、慳貪心、利名心、嫉妒心、計較心、好勝心、望高心、侮慢心、殺害心、狠毒心、恐怖心、謹慎心、邪妄心、無名隱暗之心、種種不善之心，更無一個黑心。那昏君諕得呆呆掙掙，口不能言，戰兢兢的教：「收了去，收了去。」那假唐僧忍耐不住，收了法心，現出本相，對昏君道：「陛下全無眼力。我和尚家都是一片好心，惟你這國丈是個黑心，好做藥引。你不信，等我替你取他的出來看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      さて、錦衣官（きんいかん）は三蔵（さんぞう）の姿に化けた悟空（ごくう）を駅館から引っ張り出し、羽林軍（うりんぐん）とともにぐるりと取り囲んで、宮門の外まで連れてきた。錦衣官は黄門官（こうもんかん）に言った。
      錦衣官「唐（とう）から来た僧を、こちらへお連れしました。どうかお取り次ぎください。」
      黄門官は急いで朝廷へ入り、愚かな国王にそのとおり奏上してから、悟空を中へ案内した。官たちはみな階段の下でひざまずいて拝礼していたが、三蔵の姿の悟空だけは階段の真ん中にすっくと立ち、大声を上げた。
      悟空「比丘王（びくおう）、この貧しい僧をお呼びになったのは、何のお話ですか。」
      国王は笑って答えた。
      国王「朕は病を患い、長いこと癒えずにいる。幸い、国丈（こくじょう）が一つの処方を授けてくださり、薬はすっかりそろったのだが、効き目を引き出す引き薬が一つだけ足りぬ。そこで長老（ちょうろう）をお招きして、その薬を頂こうと思った。病が治れば、長老のために祠堂を建て、四季を通じてお祭りし、代々この国で香を絶やさずお祀りしよう。」
      悟空「私は出家の身で、身一つでここへ参りました。陛下は国丈から、何を引き薬にするようお聞きになったのですか。」
      国王「長老の心臓と肝を頂きたいのだ。」
      悟空「隠さず申しますが、心なら幾つか持っております。どのような色、どのような心がお入り用ですか。」
      傍らの国丈が指を差した。
      国丈「坊主、お前の黒い心が要るのだ。」
      悟空「それでしたら、早く刃物を持ってきてください。胸と腹を切り開いて、黒い心があれば、謹んでお命じのとおりにいたしましょう。」
      愚かな国王は喜んで礼を言い、御前に仕える官に、牛の耳の形をした短刀を一本取ってこさせ、偽の三蔵に渡した。悟空は刀を受け取ると衣服を解き、胸を反らした。左手で腹をなで、右手の刀でざくりと腹の皮を切り開くと、中からごろごろと心臓が山ほど転がり出た。文官は顔色を失い、武将も体がしびれるほど驚いた。殿上の国丈は、それを見て言った。
      国丈「これは、やたらと心の多い坊主だな。」
      悟空は血の滴る心臓を一つずつ拾い分け、みなに見せた。それらは、赤い心、白い心、黄色い心、物惜しみして貪る心、名利を求める心、ねたむ心、損得を計る心、負けず嫌いの心、高みを望む心、人を侮る心、殺そうとする心、残忍な心、恐れる心、慎む心、邪悪で偽りに満ちた心、名もなく暗く隠れた心、さまざまな善くない心ばかりで、黒い心は一つもなかった。国王は恐ろしさに呆然として言葉も出ず、やっと震えながら命じた。
      国王「しまえ、しまってくれ。」
      三蔵の姿の悟空は、もう我慢できなくなり、術で出した心臓を収めて本来の姿を現し、国王に言った。
      悟空「陛下には、まるで物を見る目がない。俺たち坊主は、みな善い心でいっぱいだ。黒い心を持っているのは、この国丈だけだぞ。こいつこそ引き薬にちょうどいい。信じられないなら、俺が代わりに取り出して見せよう。」
    "translation_status": "draft"

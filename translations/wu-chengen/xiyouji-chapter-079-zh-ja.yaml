  - "id": "xy-ch79-007"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精與行者苦戰二十餘合，蟠龍拐抵不住金箍棒，虛幌了一拐，將身化作一道寒光，落入皇宮內院，把進貢的妖后帶出宮門，並化寒光，不知去向。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 130
        "line_end": 130
    "translation_ja": "国丈は悟空と二十余合（ごう）も激しく戦ったが、蟠竜の杖は金箍棒（きんこぼう）にかなわなかった。そこで杖を一振りするふりをして、身を一筋の冷たい光に変え、皇宮の奥庭へ降りた。そして献上した妖女の美后（びこう）を宮門から連れ出すと、二人そろって冷光に変わり、行方をくらませてしまった。"
    "translation_status": "draft"
  - "id": "xy-ch79-008"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖按落雲頭，到了宮殿下，對多官道：「你們的好國丈啊！」多官一齊禮拜，感謝神僧。行者道：「且休拜，且去看你那昏主何在？」多官道：「我主見爭戰時，驚恐潛藏，不知向那座宮中去也。」行者即命：「快尋，莫被美后拐去。」多官聽言，不分內外，同行者先奔美后宮，漠然無蹤，連美后也通不見了。正宮、東宮、西宮、六院，概眾后妃，都來拜謝大聖。大聖道：「且請起，不到謝處哩。且去尋你主公。」少時，見四五個太監攙著那昏君，自謹身殿後面而來。眾臣俯伏在地，齊聲啟奏道：「主公，主公，感得神僧到此，辨明真假。那國丈乃是個妖邪，連美后亦不見矣。」國王聞言，即請行者出皇宮，到寶殿，拜謝了，道：「長老，你早間來的模樣那般俊偉，這時如何就改了形容？」行者笑道：「不瞞陛下說，早間來者，是我師父，乃唐朝御弟三藏。我是他徒弟孫悟空，還有兩個師弟豬悟能、沙悟淨，見在金亭館驛。因知你信了妖言，要取我師父心肝做藥引，是老孫變作師父模樣，特來此降妖也。」那國王聞說，即傳旨著閣下太宰快去驛中請師眾來朝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      悟空は雲を降ろして宮殿の下へ戻り、官たちに言った。
      悟空「たいした国丈さまだな、お前たちのところは！」
      官たちは一斉にひざまずいて拝み、神僧の恩に感謝した。
      悟空「拝むのはあとだ。あの愚かな王がどこにいるか、見てこい。」
      官たち「わが王はお二人の戦いを見て、恐れてお隠れになりました。どの宮へおいでになったか、分かりません。」
      悟空「早く捜せ。美后にさらわれてはいけない。」
      官たちはそう聞くと、外の役人が奥へ入る区別なども構わず、悟空とともに、まず美后の宮へ駆け込んだ。だが人影はなく、美后さえすっかり姿を消していた。正宮（せいぐう）、東宮（とうぐう）、西宮（せいぐう）、六院（りくいん）の妃たちが、一人残らず出てきて悟空に礼をした。
      悟空「さあ、お立ちください。礼を言ってもらうには、まだ早い。まずは王を捜さなければ。」
      しばらくすると、四、五人の宦官（かんがん）に支えられた国王が、謹身殿（きんしんでん）の裏から出てきた。臣下は地にひれ伏し、声をそろえて奏上した。
      官たち「わが王、わが王。この神僧がお越しくださったおかげで、真偽が明らかになりました。国丈は妖怪で、美后も姿を消しております。」
      国王は聞くと、悟空を奥宮から宝殿へ招き、礼をして尋ねた。
      国王「長老、朝にお見えになったときは、あれほど立派なお顔だったのに、今はなぜ姿が変わったのですか。」
      悟空は笑った。
      悟空「正直に申し上げると、朝に来たのは俺の師匠、唐の帝の御弟（ぎょてい）、三蔵法師（さんぞうほうし）だ。俺は弟子の孫悟空（そんごくう）。ほかに猪悟能（ちょごのう）、沙悟浄（さごじょう）という弟弟子が二人いて、今は金亭館駅（きんていかんえき）にいる。陛下が妖怪の言葉を信じて、師匠の心臓と肝を引き薬にしようとしていると知ったので、俺が師匠の姿に化け、妖怪を降しに来たんだ。」
      国王はそれを聞き、閣下の太宰（たいさい）に命じて、急いで駅館へ行き、師と弟子たちを朝廷に招かせた。
    "translation_status": "draft"
  - "id": "xy-ch79-009"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那三藏聽見行者現了相，在空中降妖，嚇得魂飛魄散。幸有八戒、沙僧護持，他又臉上戴著一片子臊泥。正悶悶不快，只聽得人叫道：「法師，我等乃比丘國王差來的閣下太宰，特請入朝謝恩也。」八戒笑道：「師父，莫怕，莫怕。這不是又請你取心，想是師兄得勝，請你酬謝哩。」三藏道：「雖是得勝來請，但我這個臊臉，怎麼見人？」八戒道：「沒奈何，我們且去見了師兄，自有解釋。」真個那長老無計，只得跟著八戒、沙僧，挑著擔，牽著馬，同去驛庭之上。那太宰見了，害怕道：「爺爺呀！這都像似妖頭怪腦之類。」沙僧道：「朝士休怪醜陋，我等乃是生成的遺體。若我師父，來見了我師兄，他就俊了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      三蔵は、悟空が元の姿を現して空で妖怪と戦っていると聞き、魂も消し飛ぶほどおびえた。幸い八戒（はっかい）と沙悟浄が付き添っていたが、顔にはまだ、尿臭い泥の面をかぶっている。気がふさいで落ち着かずにいると、呼ぶ声がした。
      使者の声「法師さま、私どもは比丘国王から遣わされた閣下の太宰でございます。お礼を申し上げるため、朝廷へお招きに参りました。」
      八戒は笑った。
      八戒「お師匠さま、怖がらなくてもいいんです、怖がらなくても。今度は心臓を取りに呼んだんじゃない。兄貴が勝ったから、お礼に招くんでしょうよ。」
      三蔵「勝ったので招いてくれたのだとしても、こんな臭い顔で、どうして人に会えるのだ。」
      八戒「仕方ないですよ。とにかく兄貴に会いに行けば、なんとかしてくれます。」
      三蔵も手の打ちようがなく、八戒と沙悟浄について出た。荷を担ぎ、馬を引いて、三人は駅館の庭へ向かった。太宰は三人を見ると恐れた。
      太宰「お方さま！　みな妖怪の頭や怪物の顔のようではありませんか。」
      沙悟浄「お役人さま、醜い姿をおとがめなさらないでください。私たちは、生まれつき授かった体がこれなのです。お師匠さまのほうは、兄さんに会えば、すぐ端正なお顔に戻ります。」
    "translation_status": "draft"
  - "id": "xy-ch79-010"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他三人與眾來朝，不待宣召，直至殿下。行者看見，即轉身下殿，迎著面，把師父的泥臉子抓下，吹口仙氣，叫：「變！」那唐僧即時復了原身，精神愈覺爽利。國王下殿親迎，口稱：「法師老佛。」師徒們將馬拴住，都上殿來相見。行者道：「陛下可知那怪來自何方？等老孫去與你一併擒來，剪除後患。」三宮六院、諸嬪群妃都在那翡翠屏後；聽見行者說剪除後患，也不避內外男女之嫌，一齊出來拜告道：「萬望神僧老佛大施法力，斬草除根，把他剪除盡絕，誠為莫大之恩，自當重報。」行者忙忙答禮，只教國王說他住居。國王含羞告道：「三年前他到時，朕曾問他。他說離城不遠，只在向南去七十里路，有一座柳林坡清華莊上。國丈年老無兒，止後妻生一女，年方十六，不曾配人，願進與朕。朕因愛那女，遂納了，寵幸在宮。不期得疾，太醫屢藥無功。他說：『我有仙方，止用小兒心煎湯為引。』是朕不才，輕信其言，遂選民間小兒，選定今日午時開刀取心。不料神僧下降，恰恰又遇籠兒都不見了。他就說神僧十世修真，元陽未泄，得其心，比小兒心更加萬倍。一時誤犯，不知神僧識透妖魔。敢望廣施大法，剪其後患，朕以傾國之資酬謝。」行者笑道：「實不相瞞，籠中小兒，是我師慈悲，著我藏了。你且休題甚麼資財相謝，待我捉了妖怪，是我的功行。」叫：「八戒，跟我去來。」八戒道：「謹依兄命。但只是腹中空虛，不好著力。」國王即傳旨，教光祿寺快辦齋供。不一時齋到。八戒盡飽一餐，抖擻精神，隨行者駕雲而起。諕得那國王、妃后並文武多官，一個個朝空禮拜，都道：「是真仙真佛降臨凡也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      三人は使者たちとともに朝廷へ行き、召し出しを待たず、そのまま殿の下へ進んだ。悟空は三人を見ると、すぐ身を返して殿を下り、師の顔に手を伸ばして泥の面を取り去った。それから仙気（せんき）を一息吹きかけ、叫んだ。
      悟空「変われ！」
      三蔵はたちまち本来の姿に戻り、気分もいっそう爽やかになった。国王はみずから殿を下りて迎えた。
      国王「法師さま、生き仏さま。」
      師弟は馬をつなぎ、そろって殿上へ進んで対面した。
      悟空「陛下、あの妖怪がどこから来たか、ご存じか。俺が行って二人とも捕らえ、あとに災いを残さないようにしてやろう。」
      三宮六院（さんぐうりくいん）の妃たちは、みな翡翠の屏風の後ろにいた。悟空が後の災いまで取り除くと言うのを聞くと、内外や男女の隔てを気にすることもなく、一斉に進み出て拝み、願った。
      后妃たち「どうか神僧さま、生き仏さま、その法力を存分にお使いになって、災いの根を断ち、残らず滅ぼしてください。それこそ、この上ないご恩です。必ず厚くお報いいたします。」
      悟空は慌てて答礼し、国王に、ただ住まいを教えてくれと言った。国王は恥じ入りながら話した。
      国王「三年前、あの者が来たときに、朕は尋ねたことがある。すると、城から遠くない、南へ七十里（り）の柳林坡（りゅうりんは）にある清華荘（せいかそう）に住むと言った。年老いて男の子はなく、後妻が産んだ娘が一人だけいて、まだ十六歳で嫁いでおらぬので、朕に献上したいという。朕はあの娘が気に入り、迎え入れて宮中で寵愛した。思いがけず病になり、太医に何度薬をもらっても、効き目がなかった。あの者は『私には仙人の処方がございます。子供の心臓を煎じた汁だけを、引き薬に使います』と言った。不徳な朕は、たやすくそれを信じ、民の子供を選び集め、今日の正午に刃を入れて心臓を取ることにした。そこへ思いもかけず神僧がお越しになり、ちょうど子供の籠も一つ残らず消えた。するとあの者は、神僧は十世にわたって真の道を修め、元陽（げんよう）をまだ漏らしていないから、その心臓が得られれば、子供のものより一万倍もよいと言ったのだ。一時の過ちでご無礼を働いてしまったが、神僧が妖怪を見抜いておいでとは知らなかった。どうか大いなる法力を施し、後の災いを取り除いていただきたい。朕は国の財を尽くしてお礼をしよう。」
      悟空は笑った。
      悟空「実を言うと、籠の子供たちは、お師匠さまが哀れんで、俺に隠させたんだ。財宝で礼をするなどという話はやめてくれ。妖怪を捕らえるのは、俺の修行の功徳になる。」
      そして呼びかけた。
      悟空「八戒、俺と一緒に来い。」
      八戒「謹んで兄貴の言うとおりにしますよ。ただ、腹が空っぽじゃ力が入りません。」
      国王はすぐに、光禄寺（こうろくじ）へ精進料理を大急ぎで用意するよう命じた。ほどなく料理が届き、八戒は満腹になるまで食べると、元気を振り起こし、悟空について雲に乗った。国王も妃たちも文武の官も驚き、一人一人、空に向かって拝んだ。
      一同「まことの仙人、まことの仏が、この世に降りてこられたのだ。」
    "translation_status": "draft"
  - "id": "xy-ch79-011"
    "section_id": "chapter-79"
    "kind": "paragraph"

    "source_text": "那國丈聽見，急睜睛仔細觀看，見那和尚變了面皮，不是那般模樣。咦！"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 122
        "line_end": 122
    "translation_ja": "国丈はそれを聞くと、急いで目を見開いて、じっと見た。坊主の顔が変わり、さっきとは別の姿になっている。おや、これは。"
    "translation_status": "draft"
  - "id": "xy-ch79-004"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "認得當年孫大聖，五百年前舊有名。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      見覚えがある、あの日の孫大聖（そんたいせい）。
      五百年前から名の知れたあの者だ。
    "translation_status": "draft"
  - "id": "xy-ch79-005"
    "section_id": "chapter-79"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻抽身，騰雲就起，被行者翻觔斗，跳在空中喝道：「那裡走？吃吾一棒。」那國丈即使蟠龍拐杖來迎。他兩個在半空中這場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      国丈は身を引くや雲に乗って飛び上がった。悟空もとんぼ返りを打って空へ跳び、怒鳴った。
      悟空「どこへ行く。俺の一撃を受けろ！」
      国丈はすぐに蟠竜の杖（はんりゅうのつえ）を繰り出して迎え撃った。二人は空中で、こうも激しく戦った。
    "translation_status": "draft"
  - "id": "xy-ch79-006"
    "section_id": "chapter-79"
    "kind": "verse"
    "origin": "source"
    "source_text": "如意棒，蟠龍拐，虛空一片雲靉靉。原來國丈是妖精，故將怪女稱嬌色。國主貪歡病染身，妖邪要把兒童宰。相逢大聖顯神通，捉怪救人將難解。鐵棒當頭著實兇，拐棍迎來堪喝采。殺得那滿天霧氣暗城池，城裡人家都失色。文武多官魂魄飛，嬪妃繡女容顏改。諕得那比丘昏主亂身藏，戰戰兢兢沒佈擺。棒起猶如虎出山，拐掄卻似龍離海。今番大鬧比丘國，致令邪正分明白。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch79-1455628"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第079回&oldid=1455628"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      如意棒（にょいぼう）と蟠竜の杖、空には一面、雲が重なる。
      国丈は、そもそも妖怪。ゆえに妖女を美しい女と称したのだ。
      国の主は歓楽にふけって病を得、邪悪な妖怪は子供を屠ろうとする。
      大聖（たいせい）に出くわし、神通力を示される。怪物を捕らえ、人を救い、災難を解くために。
      頭上へ落ちる鉄棒は実に凶暴、迎え撃つ杖の勢いも見事なもの。
      戦いで空いっぱいに霧が立ち、城も暗くなり、町の人々はみな顔色を失った。
      文武の官は魂が飛ぶほどおびえ、妃や宮女の顔からも血の気が引く。
      比丘国（びくこく）の愚かな王は慌てふためいて身を隠し、ただ震えて、どうすることもできない。
      振り上げる棒は、山から飛び出す虎のよう。
      振り回す杖は、海を離れる竜のよう。
      このたび比丘国を大いに騒がせ、邪と正をはっきり分ける。

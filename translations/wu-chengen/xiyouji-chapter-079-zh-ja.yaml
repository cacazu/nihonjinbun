    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-002"
      "description_ja": "心の列挙には「謹慎心」という慎みの心も交じる。善悪を整理し直さず、赤・白・黄の三色から「種種不善之心」まで十七の表現を原文の順で残した。「無名隱暗」は、名を示さず暗く隠れた心と解したが、細部は未確定。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-008"
      "description_ja": "原文の「閣下太宰」は、朝廷の高官を示す呼び方として残した。現代の日本語の敬称「閣下」とまったく同じ制度用法であるとは断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-017"
      "description_ja": "原文の「展抹」は、国王に取り入るのを邪魔し、企てを潰す行為と文脈から解した。語の具体的な来歴や動作の細部は未確定。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-017"
      "description_ja": "直前の「促損琪花為顧生、踢破翠苔因把滑」は、命を守るために花を踏み荒らし、滑らないよう苔を蹴り破る描写と解した。「把滑」は滑るのを防ぐ意味で確認できるが、「促損」「顧生」の語の結び方には留保がある。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-021"
      "description_ja": "白鹿の詩の「玉簡」は玉製の札をいう字面として残した。「斑斑」の具体的な斑模様や材質の対応は未確定。「七叉」は鹿の角の枝で、洞の入口の木の九枝とは別の数である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-024"
      "description_ja": "燃料は迎霜草・秋青草・蓼節草・山蕊草・蔞蒿柴・龍骨柴・蘆荻柴の七つを省かず残した。草名や柴名の具体的な植物種はすべてが確定するわけではなく、龍骨を薬材の化石骨へ置き換えたり、現代の同名植物と断定したりしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-025"
      "description_ja": "直前の「これがお前の美后だぞ」という呼びかけは、原文で発言者を明示していない。狐を引きずる八戒の発言とも読めるが、断定せず「話者不明」とした。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-027"
      "description_ja": "先行する「龍纏斗糖」は、既存の訳語に合わせて「竜纏」と「斗糖」という飾り菓子の名に分けて訳した。菓子の細かな製法や語の切れ目は未確定であり、並べられた走る獣の形という描写を残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-027"
      "description_ja": "直前の「松子葡萄香膩酒」は、松の実・葡萄と、芳醇な酒を並べると解した。松の実や葡萄から作る酒という限定はせず、句の結びつきに留保を残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-028"
      "description_ja": "原文の「大師」は高僧への敬称にも高位の官の呼称にもなりうる。相伴する人物の役割は明示されないため、僧とも官とも断定せず原字を残した。読みは一般的な字音に基づく。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch79-1455628"
      "segment_ids":
        - "xy-ch79-030"
      "description_ja": "金銀を差し出す箇所は原文の主語が省略されている。三蔵が断る応答と、この場での送り手が国王であることから、差し出したのは国王と解した。 原文の欠落ではなく、解釈・校訂上の留保。"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖同八戒、沙僧出城頭，覿面相迎，見那夥妖精都是些雜毛獅子：黃獅精在前引領，狻猊獅、摶象獅在左，白澤獅、伏狸獅在右，猱獅、雪獅在後，中間卻是一個九頭獅子。那青臉兒怪執一面錦鏽團花寶幢，緊挨著九頭獅子；刁鑽古怪兒、古怪刁鑽兒打兩面紅旗。齊齊的都佈在坎宮之地。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 122
        "line_end": 122
    "translation_ja": "さて、悟空（ごくう）は八戒（はっかい）、沙悟浄（さごじょう）とともに城壁を飛び出し、真正面から迎え撃った。見ると、妖怪の一団はみな毛色のさまざまな獅子だった。黄獅（こうし）が先頭に立ち、狻猊（しゅんげい）と摶象（たんしょう）が左、白沢（はくたく）と伏狸（ふくり）が右、猱獅（どうし）と雪獅（せつし）が後ろに続き、中央の九霊元聖（きゅうれいげんせい）は九つの頭を持つ獅子だった。青臉児（せいれんじ）は錦に丸い花模様を織り出した宝幢（ほうどう）を手に、九霊元聖にぴったり寄り添っている。刁鑽古怪（ちょうさんこかい）と古怪刁鑽（こかいちょうさん）は、二本の赤旗を掲げていた。一団はそろって、坎（かん）の方位、すなわち北側に陣を敷いた。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-003"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒莽撞，走近前罵道：「偷寶貝的賊怪，你去那裡夥這幾個毛團來此怎的？」黃獅精切齒罵道：「潑狠禿廝！昨日三個敵我一個，我敗回去，讓你為人罷了，你怎麼這般狠惡，燒了我的洞府，損了我的山場，傷了我的眷族？我和你冤仇深如大海，不要走，吃你老爺一鏟。」好八戒，舉鈀就迎。兩個才交手還未見高低，那猱獅精掄一根鐵蒺藜，雪獅精使一條三楞簡，徑來奔打。八戒發一聲喊道：「來得好！」你看這壁廂，沙和尚急掣降妖杖，近前相助。又見那狻猊精、白澤精與摶象、伏狸二精，一擁齊上。這裡孫大聖使金箍棒架住群精。狻猊使悶棍，白澤使銅鎚，摶象使鋼槍，伏狸使鉞斧。那七個獅子精，這三個狠和尚，好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 123
        "line_end": 123
    "translation_ja": |-
      八戒は向こう見ずにも前へ進み、罵った。
      八戒「宝を盗んだ泥棒妖怪め！　どこからその毛玉どもを仲間にして連れてきた。何をしに来やがった！」
      黄獅は歯ぎしりして罵り返した。
      黄獅「荒くれの禿坊主め！　昨日は三人で俺一人にかかってきたな。俺は敗れて引き揚げ、お前たちには顔を立ててやった。それなのに、どうしてそこまでむごいことをする。俺の洞を焼き、山を荒らし、身内を傷つけやがって！　お前との恨みは海より深い。逃げるな、この俺の鋤形の武器を食らえ！」
      さすがの八戒、熊手を掲げて迎え撃った。二人が打ち合い始め、まだ勝負もつかぬうち、猱獅が鉄蒺藜（てつしつり）を振るい、雪獅が三楞簡（さんりょうかん）を使って、まっしぐらに打ちかかってきた。
      八戒「よし、来たな！」
      一声叫ぶ。そのこちら側では、沙悟浄がすばやく降妖杖（ごうようじょう）を抜き、助太刀に進み出る。すると狻猊、白沢、摶象、伏狸の四人も、いっせいに押し寄せてきた。悟空は金箍棒（きんこぼう）で妖怪たちの攻撃を受け止めた。狻猊は眉の高さほどある棍棒、白沢は銅の鎚、摶象は鋼の槍、伏狸は鉞（まさかり）を使う。七人の獅子の妖怪と、三人の猛々しい僧。すさまじい戦いとなった。
    "translation_status": "reviewed"
  - "id": "xy-ch90-004"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      棍鎚槍斧三楞簡，蒺藜骨朵四明鏟。
      七獅七器甚鋒芒，圍戰三僧齊吶喊。
      大聖金箍鐵棒兇，沙僧寶杖人間罕。
      八戒顛風騁勢雄，釘鈀晃亮光華慘。
      前遮後擋各施功，左架右迎都勇敢。
      城頭王子助威風，擂鼓篩鑼齊壯膽。
      投來搶去弄神通，殺得昏蒙天地反。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 125
        "line_end": 131
    "translation_ja": |-
      棍棒、鎚、槍、鉞、三楞簡、
      蒺藜（しつり）と呼ぶ、突起を備えた骨朶（こつだ）、そして四明鏟（しめいさん）。
      七獅が操る七つの武器は、いずれも鋭い威力を見せ、
      三僧を取り囲んでは、声を合わせて雄叫びを上げる。
      悟空の金箍鉄棒（きんこてつぼう）は凶猛をきわめ、
      沙悟浄の宝杖（ほうじょう）は、人の世にまれな品。
      八戒はつむじ風の勢いで勇を振るい、
      熊手のきらめきには、すさまじい光が宿る。
      前を遮り後ろを防ぎ、それぞれ技を尽くし、
      左を受けて右を迎え、誰もが勇敢に戦う。
      城壁の王と王子たちは威勢を添え、
      太鼓と銅鑼（どら）を鳴らして、勇気を奮い立たせる。
      躍りかかり奪い合い、神通力を競い、
      戦いの闇に天地さえ覆りそうだ。
    "translation_status": "reviewed"
  - "id": "xy-ch90-005"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那一夥妖精齊與大聖三人，戰經半日，不覺天晚。八戒口吐粘涎，看看腳軟，虛幌一鈀，敗下陣去。被那雪獅、猱獅二精喝道：「那裡走？看打。」獃子躲閃不及，被他照脊梁上打了一簡，睡在地下，只叫：「罷了，罷了。」兩個精把八戒採鬃拖尾，扛將去見那九頭獅子，報道：「祖爺，我等拿了一個來也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      妖怪の一団は悟空たち三人と半日戦い、いつしか日が暮れかけた。八戒は粘つく唾を口から垂らし、しだいに足元がおぼつかなくなった。熊手で一つ見せかけの攻撃をすると、負けて陣から逃げ出した。
      雪獅と猱獅「どこへ行く！　これを食らえ！」
      八戒は身をかわす間もなく、背中へ簡（かん）の一撃を受け、地面に倒れ込んだ。
      八戒「もう駄目だ、もう駄目だ！」
      そう叫ぶばかりだ。二人は八戒のたてがみをつかみ、尾を引きずって担ぎ上げ、九霊元聖のもとへ連れていった。
      雪獅と猱獅「おじいさま、一人捕らえてまいりました！」
    "translation_status": "reviewed"
  - "id": "xy-ch90-006"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，沙僧、行者也都戰敗，眾妖精一齊趕來。被行者拔一把毫毛，嚼碎噴將去，叫聲：「變！」即變做百十個小行者，圍圍繞繞，將那白澤、狻猊、摶象、伏狸並金毛獅怪圍裹在中。沙僧、行者卻又上前攢打。到晚，拿住狻猊、白澤，走了伏狸、摶象。金毛報知老怪。老怪見失了二獅，吩咐：「把豬八戒綑了，不可傷他性命。待他還我二獅，卻將八戒與他；他若無知，壞了我二獅，即將八戒殺了對命。」當晚群妖安歇城外不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      その言葉も終わらぬうちに、沙悟浄と悟空も敗れて退き、妖怪たちがいっせいに追ってきた。悟空は毛を一つかみ抜き、口でかみ砕いて吹き飛ばした。
      悟空「変われ！」
      たちまち百ほどの小さな悟空になり、幾重にも取り囲んで、白沢、狻猊、摶象、伏狸、それに金毛の黄獅を包み込んだ。沙悟浄と悟空も、再び進み出て集中して打ちかかる。夕刻までに狻猊と白沢を捕らえたが、伏狸と摶象には逃げられた。黄獅が九霊元聖に知らせると、九霊元聖は二人の獅子を失ったと知り、命じた。
      九霊元聖「八戒を縛っておけ。ただし命を傷つけてはならぬ。向こうがこちらの二人を返せば、八戒を渡してやる。もし愚かにも二人を殺したら、八戒を殺して命で償わせよ」
      その夜、妖怪たちは城外で休んだ。この話はいったん置く。
    "translation_status": "reviewed"
  - "id": "xy-ch90-007"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖把兩個獅子精擡近城邊，老王見了，即傳令開門，差二三十個校尉，拿繩趕出門，綁了獅精，扛入城裡。孫大聖收了法毛，同沙僧徑至城樓上，見了唐僧。唐僧道：「這場事甚是利害呀。悟能性命，不知有無？」行者道：「沒事，我們把這兩個妖精拿了，他那裡斷不敢傷。且將二精牢拴緊縛，待明早抵換八戒也。」三個小王子對行者叩頭道：「師父先前賭鬥，只見一身；及後佯輸而回，卻怎麼就有百十位師身？及至拿住妖精，近城來還是一身。此是甚麼法力？」行者笑道：「我身上有八萬四千毫毛，以一化十，以十化百，百千萬億之變化，皆身外身之法也。」那王子一個個頂禮，即時擺上齋來，就在城樓上吃了。各垛口上都要燈籠旗幟，梆鈴鑼鼓，支更傳箭，放炮吶喊。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      悟空が二人の獅子の妖怪を城の近くまで担いでくると、玉華王（ぎょくかおう）はすぐ城門を開くよう命じた。二、三十人の校尉（こうい）に縄を持って出させ、獅子たちを縛って城内へ担ぎ入れさせる。悟空は術に使った毛を回収し、沙悟浄とともに城楼へ上がって三蔵（さんぞう）に会った。
      三蔵「これは、たいへんなことになった。悟能（ごのう）はまだ、生きているのだろうか」
      悟空「大丈夫です。こちらが二人の妖怪を捕まえたのですから、向こうも手出しはできません。この二人をしっかりつなぎ、きつく縛っておいて、明朝、八戒と交換しましょう」
      三人の王子は悟空に頭を下げて尋ねた。
      三人の王子「お師匠さまは、初めに戦っておられたときはお一人でした。負けたふりで戻られると、どうして百人ほどものお姿が現れたのですか。妖怪を捕らえて城の近くへお戻りになると、またお一人になりました。どのような法力なのでしょう」
      悟空は笑った。
      悟空「俺の体には八万四千本の毛がある。一つを十に、十を百に、百、千、万、億と変えるのは、みんな身外身（しんがいしん）の術なのさ」
      王子たちは一人ずつ深く礼拝し、すぐに精進料理を運ばせた。一行はそのまま城楼で食事をした。城壁の銃眼ごとに灯籠と旗を備え、拍子木、鈴、銅鑼、太鼓を用意し、夜番を置いて時刻を伝え、砲を鳴らして声を張り上げた。
    "translation_status": "reviewed"
  - "id": "xy-ch90-008"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "早又天明。老怪即喚黃獅精定計道：「汝等今日用心拿那行者、沙僧；等我暗自飛空上城，拿他那師父并那老王父子，先轉九曲盤桓洞，待你得勝回報。」黃獅領計，便引猱獅、雪獅、摶象、伏狸，各執兵器到城邊，滾風釀霧的索戰。這裡行者與沙僧跳出城頭，厲聲罵道：「賊潑怪！快將我師弟八戒送還我，饒你性命；不然，都教你粉骨碎屍。」那妖精那容分說，一擁齊來。這大聖弟兄兩個，各運機謀，擋住五個獅子。這殺比昨日又甚不同："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      また早くも夜が明けた。九霊元聖は黄獅を呼び、策を授けた。
      九霊元聖「今日はお前たちが力を尽くし、悟空と沙悟浄を捕らえよ。その間に私はひそかに空へ上がって城に入り、あの師匠と王親子を捕らえる。先に九曲盤桓洞（きゅうきょくばんかんどう）へ戻り、お前たちの勝利の知らせを待とう」
      黄獅は指示を受け、猱獅、雪獅、摶象、伏狸を引き連れた。それぞれ武器を手に城の近くへ来ると、風を巻き、霧を起こして戦いを挑む。こちらも悟空と沙悟浄が城壁を飛び出し、激しく罵った。
      悟空と沙悟浄「不届きな泥棒妖怪め！　さっさとこちらの弟弟子の八戒を返せ。そうすれば命は助けてやる。でなければ、そろって骨も肉も粉々にしてやるぞ！」
      妖怪たちは話も聞かず、いっせいに押し寄せた。二人はおのおの策をめぐらせ、五人の獅子を受け止める。今度の戦いは、昨日にもましてすさまじかった。
    "translation_status": "reviewed"
  - "id": "xy-ch90-009"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": "呼呼刮地狂風惡，暗暗遮天黑霧濃。走石飛沙神鬼怕，推林倒樹虎狼驚。鋼槍狠狠鉞斧明，蒺藜簡鏟太毒情。恨不得囫圇吞行者，活活潑潑擒住小沙僧。這大聖一條如意棒，卷舒收放甚精靈。沙僧那柄降妖杖，靈霄殿外有名聲。今番幹運神通廣，西域施功掃蕩精。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      ごうごうと大地を削る荒れ狂う風、
      暗く空を覆い尽くす濃い黒霧。
      飛ぶ石と舞う砂に神も鬼もおびえ、
      なぎ倒される林の木々に虎も狼も震える。
      鋼の槍は猛々しく、鉞は輝き、
      蒺藜、簡、鋤形の武器も、情け容赦のない武器ばかり。
      悟空を丸ごとのみ込みたいとばかり、
      小僧の沙悟浄を生きたまま取り押さえようとする。
      だが悟空の一本の如意棒（にょいぼう）は、
      伸ばすも縮めるも、引くも放つも自在で巧み。
      沙悟浄の降妖杖は、
      霊霄殿（れいしょうでん）の外にまで、その名を知られている。
      今ここで、広大な神通力を奮い立たせ、
      西域（さいいき）に武功を示して、妖怪どもを掃き払う。
    "translation_status": "reviewed"
  - "id": "xy-ch90-010"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這五個雜毛獅子精與行者、沙僧正自殺到好處，那老怪駕著黑雲，徑直騰至城樓上，搖一搖頭，諕得那城上文武大小官員并守城人夫等都滾下城去。被他奔入樓中，張開口，把三藏與老王父子一頓噙出；復至坎宮地下，將八戒也著口噙之。原來他九個頭就有九張口。一口噙著唐僧，一口噙著八戒，一口噙著老王，一口噙著大王子，一口噙著二王子，一口噙著三王子：六口噙著六人，還空了三張口。發聲喊叫道：「我先去也。」這五個小獅精見他祖得勝，一個個愈展雄才。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      五人の毛色の異なる獅子の妖怪が、悟空と沙悟浄と激しく戦っていたそのとき、九霊元聖は黒雲に乗り、まっすぐ城楼へ舞い上がった。頭を一振りすると、城壁上の文武の大小の役人も、城を守る人足たちも、恐れのあまり転げ落ちるように下へ逃げた。九霊元聖は楼の中へ駆け込み、口を開いて三蔵と王親子を一度にくわえ出した。さらに北側の陣へ戻ると、八戒も口にくわえた。九つの頭には、九つの口があったのである。一つの口に三蔵、一つに八戒、一つに玉華王、一つに第一王子、一つに第二王子、一つに第三王子。六つの口に六人をくわえても、まだ三つの口が空いている。
      九霊元聖「私は先に行くぞ！」
      大声で叫んだ。五人の獅子の妖怪は自分たちの祖翁（そおう）の成功を見て、いよいよ勇猛に戦った。
    "translation_status": "reviewed"
  - "id": "xy-ch90-011"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞得城上人喊嚷，情知中了他計，急喚沙僧仔細。他卻把臂膊上毫毛盡皆拔下，入口嚼爛噴出，變作千百個小行者，一擁攻上。當時拖倒猱獅，活捉了雪獅，拿住了摶象獅，扛翻了伏狸獅，將黃獅打死，烘烘的嚷到州城之下。倒轉走脫了青臉兒與刁鑽古怪、古怪刁鑽兒三怪。那城上官看見，卻又開門，將繩把五個獅精又綑了，擡進城去。還未發落，只見那王妃哭哭啼啼，對行者禮拜道：「神師啊，我殿下父子並你師父，性命休矣。這孤城怎生是好？」大聖收了法毛，對王妃作禮道：「賢后莫愁。只因我拿他七個獅精，那老妖弄攝法，定將我師父與殿下父子攝去，料必無傷。待明日絕早，我兄弟二人去那山中，管情捉住老妖，還你四個王子。」那王妃一簇女眷聞得此言，都對行者下拜道：「願求殿下父子全生，皇圖堅固。」拜畢，一個個含淚還宮。行者吩咐各官：「將打死的黃獅精，剝了皮；六個活獅精，牢牢拴鎖。取些齋飯來，我們吃了睡覺。你們都放心，保你無事。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      悟空は城壁の上の人々の叫びを聞き、敵の策にはまったと悟った。急いで沙悟浄に用心するよう呼びかけ、自分の腕の毛をすっかり抜いて口でかみ砕き、吹き飛ばした。千、百もの小さな悟空に変わり、いっせいに攻めかかる。たちまち猱獅を引き倒し、雪獅を生け捕り、摶象を押さえ、伏狸を突き倒し、黄獅を打ち殺した。そしてわいわいと叫びながら、州城の下へ押し寄せた。その一方、青臉児、刁鑽古怪、古怪刁鑽の三匹には逃げられてしまった。
      城壁の役人たちはこれを見ると、また門を開き、五人の獅子を縄で縛って城内へ担ぎ入れた。処置も決めぬうち、王妃が泣きながら悟空を礼拝した。
      王妃「神師さま！　殿下と息子たち、それにあなたのお師匠さまの命は、もうありません。この取り残された城は、どうしたらよいのでしょう！」
      悟空は術の毛を回収し、王妃に礼を返した。
      悟空「妃殿下、ご心配なさらず。こちらがあの七人の獅子を捕らえたので、年寄り妖怪が取り込む術を使い、きっと師匠と殿下親子をさらっていったのです。おそらく傷つけられてはいません。明日の早朝、俺たち二人で山へ行き、必ずあの年寄り妖怪を捕らえ、殿下と三人の王子、四人をお返しします」
      王妃と付き添う女たちはこれを聞き、そろって悟空の前にひざまずいた。
      王妃と女たち「どうか殿下とお子さまたちの命をお救いくださり、王家の治世を安泰にしてください」
      礼拝を終えると、一人一人、涙を浮かべたまま宮中へ戻った。悟空は役人たちに命じた。
      悟空「打ち殺した黄獅は、皮を剝いでおけ。生きている六人の獅子は、しっかり鎖につなぐんだ。それから精進料理を持ってきてくれ。俺たちは食べて寝る。みんなも安心していい。無事は保証してやる」
    "translation_status": "reviewed"
  - "id": "xy-ch90-012"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "至次日，大聖領沙僧駕起祥雲，不多時，到於竹節山頭。按雲頭觀看，好座高山。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 143
        "line_end": 143
    "translation_ja": "翌日、悟空は沙悟浄を連れて瑞雲に乗り、ほどなく竹節山（ちくせつざん）の頂に着いた。雲を下げて眺めれば、まことに見事な高山だ。その様子といえば、"
    "translation_status": "reviewed"
  - "id": "xy-ch90-013"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": "峰排突兀，嶺峻崎嶇。深澗下潺湲水漱，陡崖前錦鏽花香。回巒重疊，古道灣環。真是鶴來松有伴，果然雲去石無依。玄猿覓果向晴暉，麋鹿尋花歡日暖。青鸞聲淅嚦，黃鳥語綿蠻。春來桃李爭妍，夏至柳槐競茂。秋到黃花佈錦，冬交白雪飛綿。四時八節好風光，不亞瀛洲仙景象。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      峰々は突き立って並び、尾根は険しく起伏する。
      深い谷底では水がさらさらと岩を洗い、
      切り立つ崖の前には錦のような花が香る。
      めぐる山並みは幾重にも重なり、古道はくねくねと曲がる。
      鶴が来れば松にも友ができ、
      雲が去れば岩には寄り添うものもなくなる。
      黒い猿は晴れた日の光のもとで果実を探し、
      鹿は暖かな日差しを喜び、花を尋ねる。
      青い鸞（らん）の鳴く声はさやかに、
      黄色い鳥のさえずりは絶え間なく続く。
      春には桃と李が美を競い、夏には柳と槐（えんじゅ）が茂り合う。
      秋には黄の菊が錦を敷き、冬には白い雪が綿のように舞う。
      四季、八つの節目、いつも風光はすばらしく、
      瀛洲（えいしゅう）の仙境にも劣らない。
    "translation_status": "reviewed"
  - "id": "xy-ch90-014"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個正在山頭上看景，忽見那青臉兒手拿一條短棍，徑跑出崖谷之間。行者喝道：「那裡走，老孫來也。」諕得那小妖一翻一滾的跑下崖谷。他兩個一直追來，又不見蹤跡。向前又轉幾步，卻是一座洞府，兩扇花斑石門，緊緊關閉。門楟上橫嵌著一塊石版，楷鐫了十個大字，乃是「萬靈竹節山，九曲盤桓洞」。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      二人が山の上で景色を眺めていると、短い棒を手にした青臉児が、崖と谷の間から駆け出してきた。
      悟空「どこへ行く！　この俺が来たぞ！」
      青臉児は驚き、転び転び谷へ駆け下りた。二人はまっすぐ追いかけたが、姿が見えなくなった。さらに幾歩か曲がって進むと、一つの洞があり、まだら模様の石の扉が二枚、ぴったり閉ざされていた。門の上には石板が横にはめ込まれ、楷書で十の大きな文字が刻まれていた。
      「万霊竹節山（ばんれいちくせつざん）、九曲盤桓洞」
    "translation_status": "reviewed"
  - "id": "xy-ch90-015"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那小妖原來跑進洞去，即把洞門閉了。到中間對老妖道：「爺爺，外面又有兩個和尚來了。」老妖道：「你大王並猱獅、雪獅、摶象、伏狸可曾來？」小妖道：「不見，不見。只是兩個和尚在山峰高處眺望。我看見回頭就跑，他趕將來，我卻閉門來也。」老妖聽說，低頭不語。半晌，忽的吊下淚來，叫聲：「苦啊！我黃獅孫死了，猱獅孫等又盡被和尚捉進城去矣。此恨怎生報得？」八戒綑在傍邊，與王父子、唐僧俱攢在一處，恓恓惶惶受苦。聽見老妖說聲眾孫被和尚捉進城去，暗暗喜道：「師父莫怕，殿下休愁。我師兄已得勝，捉了眾妖，尋到此間救拔吾等也。」說罷，又聽得老妖叫：「小的們，好生在此看守，等我出去拿那兩個和尚進來，一發懲治。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      青臉児は洞へ逃げ込み、すぐに門を閉めていた。奥へ行き、九霊元聖に告げた。
      青臉児「おじいさま、外にまた二人の僧が来ました」
      九霊元聖「お前の大王と、猱獅、雪獅、摶象、伏狸は来たか」
      青臉児「見ません、見ませんでした。二人の僧が山の高い所から眺めていただけです。見つけて引き返すと追ってきたので、私は門を閉めたのです」
      九霊元聖はそれを聞き、頭を垂れたまま何も言わなかった。しばらくすると、突然涙をこぼし、叫んだ。
      九霊元聖「ああ、なんということだ！　孫の黄獅は死んだ。猱獅たちもみな、坊主どもに捕らえられて城へ運ばれてしまった。この恨みを、どうして晴らせばよい！」
      そばには八戒が縛られ、王親子や三蔵と一か所に集められて、心細く苦しんでいた。九霊元聖が孫たちを僧に捕らえられたと言うのを聞くと、八戒はひそかに喜んで言った。
      八戒「お師匠さま、怖がることはありません。殿下もご心配なく。兄貴が勝って妖怪どもを捕まえたんです。ここまで捜し当てて、俺たちを助けに来てくれたんですよ」
      言い終わると、また九霊元聖の叫びが聞こえた。
      九霊元聖「お前たち、ここをしっかり見張っていろ。私が出て、あの二人の坊主を捕らえてくる。まとめて懲らしめてやるのだ」
    "translation_status": "reviewed"
  - "id": "xy-ch90-016"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他身無披掛，手不拈兵，大踏步走到前邊，只聞得孫行者吆喝哩。他就大開了洞門，不答話，徑奔行者。行者使鐵棒，當頭支住。沙僧掄寶杖就打。那老妖把頭搖一搖，左右八個頭，一齊張開口，把行者、沙僧輕輕的又啣於洞內。教：「取繩索來。」那刁鑽古怪、古怪刁鑽與青臉兒是昨夜逃生而回者，即拿兩條繩，把他二人著實綑了。老妖問道：「你這潑猴，把我那七個兒孫捉了；我今拿住你和尚四個、王子四個，也足以抵得我兒孫之命。小的們，選荊條柳棍來，且打這猴頭一頓，與我黃獅孫報報冤仇。」那三個小妖各執柳棍，專打行者。行者本是熬煉過的身體，那些些柳棍兒，只好與他拂癢，他那裡做聲，憑他怎麼捶打，略不介意。八戒、唐僧與王子見了，一個個毛骨悚然。少時，打折了柳棍。直打到天晚，也不計其數。沙僧見打得多了，甚不過意道：「我替他打百十下罷。」老妖道：「你且莫忙，明日就打到你了。一個個挨次兒打將來。」八戒著忙道：「後日就打到我老豬也。」打一會，漸漸的天昏了。老妖叫：「小的們，且住，點起燈火來，你們吃些飲食，讓我到錦雲窩略睡睡去。汝三人都是遭過害的，卻用心看守，待明早再打。」三個小妖移過燈來，拿柳棍又打行者腦蓋，就像敲梆子一般，剔剔托，托托剔，緊幾下，慢幾下。夜將深了，卻都盹睡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      九霊元聖は鎧も着けず、武器も持たず、大股で表へ歩いていった。聞こえるのは悟空の怒鳴り声だ。そこで門を大きく開くと、返事もせず、まっすぐ悟空へ突進した。悟空は鉄棒で正面から受け止め、沙悟浄も宝杖を振るって打ちかかった。九霊元聖が頭を振ると、左右の八つの頭がいっせいに口を開き、悟空と沙悟浄を軽々とくわえて、また洞へ運び入れてしまった。
      九霊元聖「縄を持ってこい」
      刁鑽古怪、古怪刁鑽、青臉児は、昨夜逃げ帰って助かった者たちである。すぐに二本の縄を持ってきて、二人をきつく縛った。
      九霊元聖「不届きな猿め、私の七人の子や孫を捕らえおって。今度は私が坊主四人、王親子四人を捕らえた。これで子や孫の命は十分償える。お前たち、茨の枝や柳の棒を選んでこい。まずこの猿を打ちのめし、孫の黄獅の恨みを晴らしてやるのだ」
      三匹の小妖は、それぞれ柳の棒を持ち、悟空ばかりを殴りつけた。だが悟空の体は、もともと厳しく鍛え抜かれている。その程度の柳の棒では、かゆい所を払うほどのことしかない。声一つ上げず、どれほど打たれても、まるで気に留めなかった。見ている八戒、三蔵、王親子は、誰もが身の毛のよだつ思いだった。しばらくすると、柳の棒が折れた。その後も夕方まで打ち続け、回数は知れなかった。
      沙悟浄はあまりに長く殴られるのを見て、気の毒でならず、申し出た。
      沙悟浄「私が代わりに、百ほど打たれましょう」
      九霊元聖「そう急ぐな。明日はお前の番だ。一人ずつ、順繰りに打ってやる」
      八戒は慌てた。
      八戒「すると、あさっては俺の番じゃないか！」
      さらにしばらく打つうち、しだいに暗くなった。
      九霊元聖「お前たち、そこまでだ。明かりをともし、何か食べたり飲んだりするがよい。私は錦雲窩（きんうんか）へ行って、少し眠る。お前たち三人はどれも、ひどい目に遭わされた者だ。しっかり見張り、明朝また打つのだぞ」
      三匹の小妖は明かりを移し、また柳の棒で悟空の頭を打った。まるで拍子木をたたくように、チッ、チッ、トッ、トッ、トッ、チッ。速く幾つか、ゆっくり幾つかと打った。やがて夜が更けると、三匹とも居眠りを始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch90-017"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者就使個遁法，將身一小，脫出繩來。抖一抖毫毛，整束了衣服。耳朵內取出棒來，幌一幌，有吊桶粗細，二丈長短，朝著三個小妖道：「你這孽畜，把你老爺就打了許多棍子。老爺還只照舊，老爺也把這棍子略掗你掗，看道如何？」把三個小妖輕輕一掗，就掗做三個肉餅。卻又剔亮了燈，解放沙僧。八戒綑急了，忍不住大聲叫道：「哥哥，我的手腳都綑腫了，倒不來先解放我？」這獃子喊了一聲，卻早驚動老妖。老妖一轂轆爬起來道：「是誰人解放？」那行者聽見，一口吹息燈，也顧不得沙僧等眾，使鐵棒，打破幾重門走了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      悟空は逃れる術を使い、体を小さくして縄を抜けた。毛を一振りし、衣服を整え、耳から棒を取り出して振ると、釣瓶ほどの太さ、二丈（じょう）ほどの長さになった。三匹の小妖に向かって言った。
      悟空「この畜生ども、この俺をずいぶん棒で殴ってくれたな。だが俺は、ご覧のとおりぴんぴんしている。今度は俺が、この棒でちょいと押しつけてやろう。どうなるか、見てみるか」
      三匹へ軽く棒を押しつけると、たちまち三枚の肉の餅にしてしまった。それから灯心をかき立てて明るくし、沙悟浄の縄を解いた。八戒はあまりにきつく縛られていたので、我慢できず大声を上げた。
      八戒「兄貴！　俺の手足は縛られて腫れ上がってるんだぞ。どうして俺を先に解いてくれないんだ！」
      この一声で、九霊元聖を起こしてしまった。九霊元聖はがばと起き上がった。
      九霊元聖「誰が縄を解いている！」
      悟空はその声を聞くや、ひと息に灯を吹き消した。沙悟浄たちを構ってもいられず、鉄棒で幾重もの門を打ち破り、逃げ出した。
    "translation_status": "reviewed"
  - "id": "xy-ch90-018"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老妖到中堂裡叫：「小的們，怎麼沒了燈光？只莫走了人也？」叫一聲，沒人答應；又叫一聲，又沒人答應。及取燈火來看時，只見地下血淋淋的三塊肉餅，老王父子及唐僧、八戒俱在，只不見了行者、沙僧。點著火，前後趕看，只見沙僧還背貼在廊下站哩。被他一把拿住捽倒，照舊綑了。又找尋行者，但見幾層門盡皆破損，情知是行者打破走了。也不去追趕，將破門補的補，遮的遮，固守家業不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      九霊元聖は中央の広間へ来て叫んだ。
      九霊元聖「お前たち、どうして明かりが消えている。まさか、逃がしたのではあるまいな」
      一度呼んでも返事がない。もう一度呼んでも返事がない。明かりを持ってきて見ると、床には血だらけの肉の餅が三枚転がっている。玉華王親子と三蔵、八戒はいるが、悟空と沙悟浄だけが見当たらない。火をともして前後を捜すと、沙悟浄はまだ廊下で壁に背をつけて立っていた。九霊元聖はつかんで投げ倒し、元どおり縛り上げた。さらに悟空を捜したが、幾重もの門が残らず壊されているのを見て、悟空が打ち破って逃げたのだと分かった。追いかけようとはせず、壊れた門を修繕したり、ふさいだりして、自分の住まいを固く守った。この話はいったん置く。
    "translation_status": "reviewed"
  - "id": "xy-ch90-019"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖出了那九曲盤桓洞，跨祥雲，徑轉玉華州。但見那城頭上各方的土地、神祗與城隍之神迎空拜接。行者道：「汝等怎麼今夜才見？」城隍道：「小神等知大聖下降玉華州，因有賢王款留，故不敢見。今知王等遇怪，大聖降魔，特來叩接。」行者正在嗔怪處，又見金頭揭諦、六甲六丁神將押著一尊土地，跪在面前道：「大聖，吾等捉得這個地裡鬼來也。」行者喝道：「汝等不在竹節山護我師父，卻怎麼嚷到這裡？」丁甲神道：「大聖，那妖精自你逃時，復捉住捲簾大將，依然綑了。我等見他法力甚大，卻將竹節山土地押解至此。他知那妖精的根由，乞大聖問他一問，便好處治，以救聖僧、賢王之苦。」行者聽言，甚喜。那土地戰兢兢叩頭道：「那老妖前年下降竹節山。那九曲盤桓洞原是六獅之窩，那六個獅子自得老妖至此，就都拜為祖翁。祖翁乃是個九頭獅子，號為九靈元聖。若得他滅，須去到東極妙巖宮，請他主人公來，方可收伏；他人莫想擒也。」行者聞言，思憶半晌道：「東極妙巖宮，是太乙救苦天尊啊，他坐下正是個九頭獅子。這等說。」便教：「揭諦、金甲，還同土地回去，暗中護祐師父、師弟並州王父子；本處城隍守護城池。」眾神各各遵守去訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      九曲盤桓洞を脱け出した悟空は、瑞雲に乗り、まっすぐ玉華州（ぎょくかしゅう）へ戻った。すると城壁の上では、各地の土地神（とちがみ）や神々、それに城隍（じょうこう）が、空へ向かって礼拝して迎えた。
      悟空「お前たちは、どうして今夜になって初めて顔を見せるんだ」
      城隍「私どもは、大聖（たいせい）が玉華州へおいでになったことを存じておりました。ただ、賢明な王がお引き留めしておもてなし中でしたので、参上を遠慮しておりました。今、王たちが妖怪に遭い、大聖が魔物を降しておられると知り、お迎えに参ったのでございます」
      悟空がなおもとがめようとしていると、金頭掲諦（きんとうぎゃてい）と六甲六丁（ろっこうろくてい）の神将が、一柱の土地神を引き立ててきた。悟空の前にひざまずき、報告した。
      金頭掲諦と六甲六丁「大聖、この土地の事情に通じたやつを捕らえてまいりました」
      悟空は一喝した。
      悟空「お前たちは竹節山で俺の師匠を守りもせず、なぜここへ騒ぎ立てて来た！」
      六甲六丁「大聖、あの妖怪はあなたが逃れた後、捲簾大将（けんれんたいしょう）をまた捕らえて、元どおり縛りました。私どもはその法力の強大さを見て、竹節山の土地神をここへ引き立ててきたのでございます。この者は妖怪の来歴を知っております。どうかお尋ねください。そうすれば対処の方法も分かり、聖僧と王の苦しみを救えましょう」
      悟空はこれを聞いて大いに喜んだ。土地神は震えながら頭を下げた。
      土地神「あの年寄り妖怪は、おととし竹節山へ降りてきました。九曲盤桓洞は、もともと六人の獅子の巣でした。その六人は、年寄り妖怪がここへ来ると、みな祖翁と仰ぐようになったのでございます。祖翁とは九つの頭を持つ獅子で、九霊元聖と号しております。これを退治するには、東極妙巌宮（とうきょくみょうがんきゅう）へ行き、主人をお招きしてこなければ、降すことはできません。ほかの者には捕らえようがないのです」
      悟空はしばらく考え込み、それから言った。
      悟空「東極妙巌宮といえば、太乙救苦天尊（たいいつきゅうくてんそん）だ。あの方の乗り物は、まさしく九頭の獅子だった。そういうことか」
      そして命じた。
      悟空「掲諦（ぎゃてい）、金の鎧の神々、土地神とともに戻り、師匠と弟弟子、それに州の王親子をひそかに守れ。この土地の城隍は、城を守っているように」
      神々はそれぞれ命に従って去った。
    "translation_status": "reviewed"
  - "id": "xy-ch90-020"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖縱觔斗雲，連夜前行。約有寅時，到了東天門外，正撞著廣目天王與天丁、力士一行儀從。眾皆停住，拱手迎道：「大聖何往？」行者對眾禮畢，道：「前去妙巖宮走走。」天王道：「西天路不走，卻又東天來做甚？」行者道：「因到玉華州，蒙州王相款，遣三子拜我等弟兄為師，習學武藝，不期遇著一夥獅怪。今訪得妙巖宮太乙救苦天尊乃怪之主人公，欲請他來降怪救師。」天王道：「那廂因你欲為人師，所以惹出這一窩獅子來也。」行者笑道：「正為此，正為此。」眾天丁、力士一個個拱手，讓道而行。大聖進了東天門，不多時，到妙巖宮前。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      悟空は筋斗雲（きんとうん）を飛ばし、夜を徹して進んだ。寅（とら）の刻ごろ東天門（とうてんもん）の外へ着くと、ちょうど広目天王（こうもくてんのう）と、天丁（てんてい）、力士（りきし）の随従の一行に出会った。皆が立ち止まり、両手を胸の前で組んで礼をし、迎えた。
      一同「大聖、どちらへおいでですか」
      悟空は皆に礼を返した。
      悟空「妙巌宮（みょうがんきゅう）へ、ちょっと参るところです」
      広目天王「西天（さいてん）への道を進まず、東天（とうてん）へ来て、何をするのです」
      悟空「玉華州に着いたところ、州の王におもてなしを頂きました。王は三人の息子を私たちの弟子にして、武芸を習わせたのですが、思いがけず一群れの獅子の妖怪に出くわしたのです。今調べたところ、妙巌宮の太乙救苦天尊が妖怪の主人と分かりました。お招きして、妖怪を降し、師匠を救って頂こうというわけです」
      広目天王「あちらで人の師になろうとしたため、こうして一群れの獅子を呼び込んだのですね」
      悟空は笑った。
      悟空「まったくそのとおり、そのとおりです」
      天丁や力士たちは一人ずつ礼をし、道をあけた。悟空は東天門へ入り、ほどなく妙巌宮の前に着いた。その有様は、
    "translation_status": "reviewed"
  - "id": "xy-ch90-021"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": "彩雲重疊，紫氣蘢蔥。瓦漾金波焰，門排玉獸崇。花盈雙闕紅霞遶，日映騫林翠霧籠。果然是萬真環拱，千聖興隆。殿閣層層錦，窗軒處處通。蒼龍盤護神光藹，黃道光輝瑞氣濃。這的是青華長樂界，東極妙巖宮。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      彩りの雲は重なり、紫の気はこんもりと満ちる。
      瓦には金の波のような炎がゆらめき、
      門には玉の獣が高々と並ぶ。
      二つの楼門には花があふれ、紅の霞がめぐり、
      日を受ける騫林（けんりん）には、緑の霧がこもる。
      まさしく万の真人（しんじん）が取り巻いて礼し、
      千の聖者が栄え集う所。
      幾層もの殿閣は錦さながら、窓も高間もどこも開ける。
      青竜が巻きついて守り、神の光はやわらかく満ち、
      黄道（こうどう）の輝きには、めでたい気が濃くたなびく。
      こここそ青華長楽界（せいかちょうらくかい）、東極妙巌宮である。
    "translation_status": "reviewed"
  - "id": "xy-ch90-022"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那宮門立著一個穿霓帔的仙童，忽見孫大聖，即入宮報道：「爺爺，外面是鬧天宮的齊天大聖來了。」太乙救苦天尊聽得，即喚侍衛眾仙迎接。迎至宮中，只見天尊高坐九色蓮花座上，百億瑞光之中。見了行者，下座來相見。行者朝上施禮。天尊答禮道：「大聖，這幾年不見，前聞得你棄道歸佛，保唐僧西天取經，想是功行完了？」行者道：「功行未完，卻也將近。但如今因保唐僧到玉華州，蒙王子遣三子拜老孫等為師，習學武藝，把我們三件神兵照樣打造，不期夜間被賊偷去。及天明尋找，原是城北豹頭山虎口洞一個金毛獅子成精盜去。老孫用計取出，那精就夥了若干獅精與老孫大鬧。內有一個九頭獅子，神通廣大，將我師父與八戒並王父子四人都啣去，到一竹節山九曲盤桓洞。次日，老孫與沙僧跟尋，亦被啣去。老孫被他綑打無數，幸而弄法走了。他們正在彼處受罪。問及當坊土地，始知天尊是他主人，特來奉請收降解救。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      宮門には、虹色の肩掛けを着けた仙童が立っていた。悟空を見ると、すぐ宮中へ入って報告した。
      仙童「天尊（てんそん）さま、天宮を騒がせた斉天大聖（せいてんたいせい）が、外へおいでになりました」
      太乙救苦天尊は聞くと、護衛の仙人たちに迎えに出るよう命じた。悟空が宮中へ案内されると、天尊は九色の蓮華座の高みに、百億の瑞光に包まれて座っていた。悟空を見ると、座を下りて会いに来た。悟空は天尊へ礼をし、天尊も答礼した。
      太乙救苦天尊「大聖、ここ数年お会いしませんでしたね。道教を離れて仏門に入り、唐僧（とうそう）を守って西天へ経を取りに行かれたと聞いております。もう修行の功は、成し遂げられたのでしょうか」
      悟空「まだ成し遂げてはおりませんが、終わりは近づいています。ところがこのたび、唐僧を守って玉華州へ参りましたところ、王が三人の息子を私どもの弟子にして、武芸を学ばせました。私どもの三つの神の武器を手本に新しく造らせていたのですが、思いがけず夜の間に、その手本の武器を盗まれてしまったのです。夜明けに捜すと、城の北、豹頭山（ひょうとうざん）の虎口洞（ここうどう）で妖怪となっていた金毛の獅子が盗んだと分かりました。私が計略で取り返すと、その妖怪は何人もの獅子の妖怪を仲間にして、激しく争いを仕掛けてきました。中でも九つの頭を持つ獅子は神通力が強大で、師匠と八戒、それに王親子の四人をくわえ、竹節山の九曲盤桓洞へさらっていったのです。翌日、私と沙悟浄が追って捜しに行くと、私どもまでくわえられて捕まりました。私は縛られ、数え切れぬほど打たれましたが、幸い術を使って逃げてきました。皆は今も、あそこで苦しんでおります。土地神に尋ねて、天尊が主人であると初めて知りました。そこで、お招きして降伏させ、助けて頂こうと参った次第です」
    "translation_status": "reviewed"
  - "id": "xy-ch90-023"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "天尊聞言，即令仙將到獅子房喚出獅奴來問。那獅奴熟睡，被眾將推搖方醒，揪至中廳來見。天尊問道：「獅獸何在？」那奴兒垂淚叩頭，只教：「饒命，饒命。」天尊道：「孫大聖在此，且不打你。你快說為何不謹，走了九頭獅子。」獅奴道：「爺爺，我前日在大千甘露殿中見一瓶酒，不知偷去吃了，不覺沉醉睡著，失於拴鎖，是以走了。」天尊道：「那酒是太上老君送的，喚做輪迴瓊液，你吃了該醉三日不醒。那獅獸今走幾日了？」大聖道：「據土地說，他前年下降，到今二三年矣。」天尊笑道：「是了，是了，天宮裡一日，在凡世就是一年。」叫獅奴道：「你且起來，饒你死罪，跟我與大聖下方去收他來。汝眾仙都回去，不用跟隨。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      天尊は聞くと、すぐ仙将たちに命じ、獅子部屋から獅子番を呼び出して問いただした。獅子番はぐっすり眠っており、仙将たちに押し揺すられてようやく目を覚ました。中央の広間へ引っ張ってこられると、天尊にまみえた。
      太乙救苦天尊「獅子はどこにいる」
      獅子番は涙を流して頭を下げ、ただ叫んだ。
      獅子番「命ばかりはお助けください、お助けください！」
      太乙救苦天尊「孫大聖（そんたいせい）がおられるので、今は打たずにおく。なぜ注意を怠り、九頭の獅子を逃がしたのか、早く申せ」
      獅子番「天尊さま、先日、大千甘露殿（だいせんかんろでん）で酒を一瓶見かけ、つい盗んで飲んでしまいました。いつの間にかひどく酔って眠り込み、つなぐのを怠ったため、逃げられてしまったのでございます」
      太乙救苦天尊「あの酒は太上老君（たいじょうろうくん）が贈られたもので、輪廻瓊液（りんねけいえき）という。飲めば三日は酔って目を覚まさぬはずだ。獅子が逃げてから、何日になる」
      悟空「土地神によれば、おととし下界へ降りたそうです。今までに二、三年はたっております」
      天尊は笑った。
      太乙救苦天尊「そうか、そうか。天宮の一日は、人の世の一年だからな」
      そして獅子番に命じた。
      太乙救苦天尊「立ちなさい。死罪は赦してやる。私と大聖について下界へ行き、連れ戻すのだ。仙人たちは皆、それぞれ戻りなさい。ついてくるには及ばぬ」
    "translation_status": "reviewed"
  - "id": "xy-ch90-024"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "天尊遂與大聖、獅奴，踏雲徑至竹節山。只見那五方揭諦、六丁六甲、本山土地都來跪接。行者道：「汝等護祐，可曾傷著我師？」眾神道：「妖精著了惱睡了，更不曾動甚刑罰。」天尊道：「我那元聖兒也是一個久修得道的真靈：他喊一聲，上通三聖，下徹九泉，等閑也便不傷生。孫大聖，你去他門首索戰，引他出來，我好收之。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      天尊は悟空、獅子番とともに雲に乗り、まっすぐ竹節山へ下りた。五方掲諦（ごほうぎゃてい）、六丁六甲（ろくていろっこう）、この山の土地神がそろってひざまずき、出迎えた。
      悟空「お前たちが守っている間に、俺の師匠は傷つけられなかったか」
      神々「妖怪は腹を立てて眠ってしまい、その後は刑罰を加えておりません」
      太乙救苦天尊「私の元聖（げんせい）も、長く修行して道を得た真霊なのだ。一声叫べば上は三聖（さんせい）に届き、下は九泉（きゅうせん）を貫く。むやみに生き物を傷つけることもない。孫大聖、洞の前へ行って戦いを挑み、ここへ誘い出してください。そうすれば私が収めよう」
    "translation_status": "reviewed"
  - "id": "xy-ch90-025"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽言，果掣棒跳近洞口，高罵道：「潑妖精，還我人來也。潑妖精，還我人來也。」連叫了數聲，那老妖睡著了，無人答應。行者性急起來，掄鐵棒，往內打進，口中不住的喊罵。那老妖方才驚醒，心中大怒，爬起來，喝一聲：「趕戰。」搖搖頭，便張口來啣。行者回頭跳出。妖精趕到外邊，罵道：「賊猴，那裡走？」行者立在高崖上笑道：「你還敢這等大膽無禮，你死活也不知哩，這不是你老爺主公在此？」那妖精趕到崖前，早被天尊念聲咒語，喝道：「元聖兒，我來了。」那妖認得是主人，不敢展掙，四隻腳伏之於地，只是磕頭。傍邊跑過獅奴兒，一把撾住項毛，用拳著項上打夠百十，口裡罵道：「你這畜生，如何偷走，教我受罪？」那獅獸合口無言，不敢搖動。獅奴兒打得手困，方才住了，即將錦韂安在他身上。天尊騎了，喝聲教走。他就縱身駕起彩雲，徑轉妙巖宮去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      悟空は言われたとおり棒を抜いて洞の入り口へ跳び、激しく罵った。
      悟空「不届きな妖怪め、みんなを返せ！　不届きな妖怪め、みんなを返せ！」
      何度も叫んだが、九霊元聖は眠っており、返事をする者がいない。せっかちな悟空は鉄棒を振るって中へ攻め入り、口でも絶えず怒鳴り続けた。ようやく九霊元聖は目を覚まし、激怒して起き上がった。
      九霊元聖「打って出るぞ！」
      頭を振り、口を開いてくわえにかかる。悟空は身をひるがえして外へ跳び出した。九霊元聖は追いかけて罵った。
      九霊元聖「泥棒猿め、どこへ行く！」
      悟空は高い崖の上に立ち、笑った。
      悟空「まだそんな大胆なまねをして、礼を知らんのか。自分の命がどうなるかも分からんとはな。ほら、お前のご主人さまがここにおられるぞ！」
      九霊元聖が崖の前まで追ってくると、天尊はすでに呪文を唱え、一喝した。
      太乙救苦天尊「元聖、私が来たぞ！」
      九霊元聖は主人だと認めると、逆らおうともせず、四つの足を地につけ、ひたすら頭を下げた。そばから獅子番が駆け寄り、首の毛をつかむと、首筋へ拳を百ほども浴びせ、罵った。
      獅子番「この畜生、どうして勝手に逃げた！　おかげで俺までひどい目に遭ったぞ！」
      獅子は口を閉じて何も言わず、身動きもできなかった。獅子番は手が疲れてようやく打つのをやめ、錦の鞍覆いをその体に取り付けた。天尊が乗って進めと命じると、獅子は身を躍らせて彩雲に乗り、まっすぐ妙巌宮へ戻っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch90-026"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖望空稱謝了，卻入洞中，先解玉華王，次解唐三藏，次又解了八戒、沙僧並三王子。共搜他洞裡物件，逍逍停停，將眾領出門外。八戒就取了若干枯柴，前後堆上，放起火來，把一個九曲盤桓洞，燒做個烏焦破瓦窰。大聖又發放了眾神，還教土地在此鎮守。卻令八戒、沙僧各各使法，把王父子背馱回州。他攙著唐僧。不多時，到了州城，天色漸晚，當有妃后、官員都來接見了。擺上齋筵，共坐享之。長老師徒還在暴紗亭安歇。王子們入宮各寢。一宵無話。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      悟空は空へ向かって礼を述べ、それから洞に入り、まず玉華王、次に三蔵、続いて八戒、沙悟浄、三人の王子の縄を解いた。皆で洞の中の品物を探し出し、ゆっくりと落ち着いて一同を外へ連れ出した。八戒は枯れ柴をいくらも集め、前と後ろに積んで火を放った。九曲盤桓洞は、黒焦げの壊れた瓦窯のようになった。
      悟空は神々を帰らせ、土地神には引き続きここを守るよう命じた。そして八戒と沙悟浄にそれぞれ術を使わせ、王親子を背に乗せて州へ運ばせ、自分は三蔵に手を添えた。ほどなく州城に着いたころ、日は暮れかけていた。王妃や役人たちが出迎え、精進の宴を設けて、皆で席についた。三蔵一行はまた暴紗亭（ぼうさてい）で休み、王と王子たちは宮中へ入って、それぞれ床についた。その夜は何事もなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch90-027"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，王又傳旨，大開素宴。合府大小官員，一一謝恩。行者又叫屠子來，把那六個活獅子殺了，共那黃獅子都剝了皮，將肉安排將來受用。殿下十分歡喜，即命殺了：把一個留在本府內外人用；一個與王府長史等官分用；把五個都剁做一二兩重的塊子，差校尉散給州城內外軍民人等，各吃些須：一則嘗嘗滋味，二則押押驚恐。那些家家戶戶，無不瞻仰。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 163
        "line_end": 163
    "translation_ja": "翌日、玉華王はまた命を下し、盛大な精進の宴を開いた。王府の大小の役人たちは、一人一人恩に礼を述べた。悟空は屠殺人を呼び、生きた六人の獅子を殺して、黄獅と合わせてみな皮を剝ぎ、肉を調えて食べるよう言いつけた。殿下はたいそう喜び、すぐ殺すよう命じた。一頭は王府の内外で働く人々の分に、一頭は王府の長史（ちょうし）などの役人たちの分にした。五頭は一、二両（りょう）ほどの大きさに切り刻み、校尉を遣わして、州城の内外の兵士や住民へ配り、皆が少しずつ食べられるようにした。一つには味を試し、一つには怖かった気持ちを鎮めるためである。どの家の人々も、敬い慕わぬ者はなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-028"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又見那鐵匠人等造成了三般兵器，對行者磕頭道：「爺爺，小的們工都完了。」問道：「各重多少斤兩？」鐵匠道：「金箍棒有千斤，九齒鈀與降妖杖各有八百斤。」行者道：「也罷。」叫請三位王子出來，各人執兵器。三子對老王道：「父王，今日兵器完矣。」老王道：「為此兵器，幾乎傷了我父子之命。」小王子道：「幸蒙神師施法，救出我等，卻又掃蕩妖邪，除了後患。誠所謂海晏河清，太平之世界也。」當時老王父子賞勞了匠作，又至暴紗亭拜謝了師恩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 164
        "line_end": 164
    "translation_ja": |-
      そこへ鉄工たちが王子たちのための三種類の武器を完成させ、悟空に頭を下げて告げた。
      鉄工たち「大聖さま、私どもの仕事はすべて終わりました」
      悟空「それぞれ何斤（きん）の重さになった」
      鉄工たち「金箍棒は千斤、九歯の熊手と降妖杖は、それぞれ八百斤ございます」
      悟空「よかろう」
      悟空は三人の王子を呼ばせ、それぞれに武器を持たせた。
      三人の王子「父上、今日、武器が出来上がりました」
      玉華王「その武器のために、私たち親子は命まで失うところだった」
      王子の一人「幸い神師さまが術を施して救い出してくださり、さらには妖怪どもを掃き払い、後の災いまで取り除いてくださいました。まさしく海は穏やか、河は清く、世は太平というものです」
      玉華王親子は職人たちをねぎらい、褒美を与えた。その後また暴紗亭へ行き、師の恩に礼を述べた。
    "translation_status": "reviewed"
  - "id": "xy-ch90-029"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏又教大聖等快傳武藝，莫誤行程。他三人就各掄兵器，在王府院中，一一傳授。不數日，那三個王子盡皆操演精熟，其餘攻退之方，緊慢之法，各有七十二道解數，無不知之。一則那諸王子心堅，二則虧孫大聖先授了神力，此所以那千斤之棒，八百斤之鈀、杖，俱能舉能運；較之初時自家弄的武藝，真天淵也。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 166
        "line_end": 166
    "translation_ja": "三蔵は悟空たちに、旅を遅らせぬよう、早く武芸を伝えるよう促した。三人はそれぞれ武器を振るい、王府の庭で一つ一つ教え授けた。幾日もたたぬうち、三人の王子はみな、鍛錬を重ねて熟達した。ほかにも攻め退く方法、速く遅く動く技、それぞれ七十二の型を、知らぬものがなくなった。一つには王子たちの志が固く、一つには悟空から先に神力を授けられていたおかげだった。だからこそ、千斤の棒も八百斤の熊手や杖も、持ち上げ、振るうことができたのである。最初に自分たちでしていた武芸と比べれば、まさに天と深い淵ほどの違いだった。これを証す詩がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-030"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      緣因善慶遇神師，習武何期動怪獅。
      掃蕩群邪安社稷，皈依一體定邊夷。
      九靈數合元陽理，四面精通道果之。
      授受心明遺萬古，玉華永樂太平時。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 168
        "line_end": 171
    "translation_ja": |-
      善を積んだめでたい縁により、神の師と出会ったが、
      武芸を習って怪しき獅子を動かすとは、誰が思っただろう。
      群れなす邪を掃き払って、国は安らかになり、
      一つに帰依して、辺境の異民族も治まる。
      九霊（きゅうれい）の数は元陽（げんよう）の理に合い、
      あらゆる面に通じて、道の成果に至る。
      授ける者と受ける者の心は明らかとなり、万古に伝わる。
      玉華（ぎょくか）は永く、太平の世を楽しむのだ。
    "translation_status": "reviewed"
  - "id": "xy-ch90-031"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那王子又大開筵宴，謝了師教。又取出一大盤金銀，用答微情。行者笑道：「快拿進去，快拿進去。我們出家人，要他何用？」八戒在傍道：「金銀實不敢受，奈何我這件衣服被那些獅子精扯拉破了，但與我們換件衣服，足為愛也。」那王子隨命針工，照依色樣，取青錦、紅錦、茶褐錦各數疋，與三位各做了一件。三人欣然領受，各穿了錦布直裰，收拾了行裝起程。只見那城裡城外，若大若小，無一人不稱是羅漢臨凡，活佛下界。鼓樂之聲，旌旗之色，盈街塞道。正是家家戶外焚香火，處處門前獻彩燈。來至許遠方回，他四眾方得離城西去。這一去頓脫群獅，潛心正果。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      玉華王はまた盛大な宴を開き、師の教えに礼を述べた。さらに大きな盆一つに金銀を盛って差し出し、ささやかな謝意を表した。悟空は笑った。
      悟空「早くしまってください、早くしまってください。出家の身に、そんなものが何の役に立ちましょう」
      八戒が脇から言った。
      八戒「金銀は、本当に頂くわけにはいきません。ただ、この服が獅子どもに引っ張られて破れてしまいました。私たちの服を取り替えてくだされば、それだけで十分ありがたいです」
      玉華王はすぐに仕立ての職人に命じた。元の色と形に合わせ、青い錦、紅の錦、茶褐色の錦をそれぞれ数反取り、三人に一着ずつ作らせた。三人は喜んで受け取り、錦織の直裰（ちょくたつ）を着ると、旅支度を整えて出発した。
      城内でも城外でも、大人から子供まで、羅漢（らかん）が人の世へ現れ、生きた仏が下界へ降りてきたのだと称えぬ者はなかった。太鼓と楽の音、色とりどりの旗が、通りを満たし、道を埋めた。まさに、家々の外では香を焚き、あちこちの門前では彩りの灯籠を献じる有様だった。人々はずいぶん遠くまで送って、ようやく引き返した。四人はそこでやっと城を離れ、西へ進むことができた。この旅立ちにより、群れなす獅子からきっぱりと脱し、心をひたすら修行の成就に向けた。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch90-032"
    "section_id": "chapter-90"
    "kind": "verse"
    "origin": "source"
    "source_text": "無慮無憂來佛界，誠心誠意上雷音。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      憂いも悩みもなく、仏の世界へと赴き、
      真心の限りを尽くして、雷音（らいおん）へ上る。
    "translation_status": "reviewed"
  - "id": "xy-ch90-033"
    "section_id": "chapter-90"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知到靈山還有幾多路程，何時行到，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch90-1455639"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第090回&oldid=1455639"
        "line_start": 176
        "line_end": 176
    "translation_ja": "さて、霊山（れいざん）までは、あとどれほどの道のりがあるのか。いつそこへ行き着くのか。それは次回のお話で。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-01-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題には、師と獅、盗と道、纏と禅という、音を響かせ合う語が重ねられている。「盜道纏禪」の構文・寓意には解釈の幅があるため、訳では道を盗む、禅に絡むという字面を残した。清代の『西遊真詮』の評も複数の読みを示すが、その内丹的な説明を唯一の作者意図と確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-02-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「悶棍」はここでは不意打ちの比喩でなく武器名。教育部『重編國語辭典修訂本』の第一義は齊眉棍で、使用者の眉の高さほどに作る堅い棒をいう。本文の武器列挙に即して訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-03-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原詩の「蒺藜骨朵」は、突起を備えた頭部のある打撃武器と解した。「七獅七器」に合わせ、一つの武器として扱う。鉄蒺藜の具体的な構造や寸法までは、この原文から確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-04-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「城頭王子」。この物語では王子が父王を指す場合もあり、息子たちを指す場合もある。城上には父子ともいるため、ここは王と王子たちをまとめて訳したが、詩が個別に誰を数えるかは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-05-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「支更傳箭」は夜の番を置き、時刻を知らせることと解した。傳箭には令箭を回す軍事用法もあるが、教育部『重編國語辭典修訂本』の時刻報告の義を優先し、ここで特定の札や矢を回す動作までは補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-06-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の発話導入は「行者與沙僧」で二人の合同だが、台詞は「我師弟八戒」と言う。八戒を兄弟子とする沙悟浄の立場へ合わせて原文を訂正せず、共同発話の中の呼称として残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-07-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空の言葉では、七人の獅子を捕らえたことを引き合いに出し、人質はおそらく無傷だと推量している。すでに黄獅一人は打ち殺されているが、話者の「七個」を六人に訂正しない。無傷という判断も、語り手が確認した事実にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-08-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「十個大字」と言うが、掲げられた「萬靈竹節山，九曲盤桓洞」は句読点を除いて十二字ある。字数の食い違いをそのまま残し、名称を削って十字に合わせない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-09-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「我替他打百十下」は、沙悟浄が悟空の代わりに打たれるという申し出と解する。直前の同情と、九霊元聖の「明日はお前を打つ」という返答に基づく。百十は厳密な百十回とせず、百ほどの意で訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-10-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「掗」は、ここでは大きくした棒を押しつけて押し潰す動作と解した。肉餅になったという結果は明示されるが、細かな棒の動かし方には解釈の余地がある。珍字を原文で保持し、単に追い払ったことにはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-11-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "固定版の表記は「東極妙巖宮」。道教資料でよく見られる「妙嚴宮」に原文を改めず、日本語では巖の新字体に当たる巌を用いる。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-12-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の呼びかけは「揭諦、金甲」。直前には金頭掲諦と六甲六丁が現れるが、金甲をそのどちらかの誤字と断定せず、金の鎧の神々への呼びかけとして残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-13-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "騫林は道教の仙境に結びつく樹木・林の名。『雲笈七籤』巻二十三に月中の樹木として言及されるが、ここで宮殿自体が月にあるとは読まない。具体的な現実の樹種も確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-14-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "土地神の「前年」と悟空の「二三年」、獅子番の「前日」、酒を飲むと「三日」眠るという説明を、それぞれ話者の言葉として保存した。天上と地上の時間差の説明は原文にあるが、厳密に日数を計算して語句を改めない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-15-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三聖は天上の聖なる三者をいうが、この本文はその内訳を明示しない。天尊が言う「等閑也便不傷生」は普段はむやみに生き物を傷つけないという評価であり、語り手による無害の保証ではない。三聖の具体的な神名は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-16-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "黄獅の皮を剝ぐ命令は先にすでに出ているが、ここでも「共那黃獅子都剝了皮」と繰り返す。前の命令が完了したかを推測して反復を消さず、六頭の生け捕りと一頭の死体、計七頭の食肉への処置をそのまま訳す。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-17-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この質問は原文で主語を省いた「問道」。鉄工たちが悟空に完成を報告し、重量の答えに悟空が応じる流れから、悟空の発話と解した。王子の発話と断定して補わない。ここで完成した三種は王子用に新造した武器で、悟空たちが所有する原型とは別の物である。"
    "translation_status": "reviewed"
  - "id": "xy-ch90-note-18-body"
    "section_id": "chapter-90"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「九靈數合元陽理，四面精通道果之」は、九という数と元陽・修道の成果を結ぶ寓意的な句と解した。とくに末尾の「之」の構文は明瞭でないため、別字へ補訂せず、この理解の留保を残す。九の数理を具体的な修行法として補わない。"
    "translation_status": "reviewed"

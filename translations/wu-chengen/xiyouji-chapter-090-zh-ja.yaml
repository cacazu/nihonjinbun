  "known_gaps":
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-001"
      "description_ja": "回題には、師と獅、盗と道、纏と禅という、音を響かせ合う語が重ねられている。「盜道纏禪」の構文・寓意には解釈の幅があるため、訳では道を盗む、禅に絡むという字面を残した。清代の『西遊真詮』の評も複数の読みを示すが、その内丹的な説明を唯一の作者意図と確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-004"
      "description_ja": "原詩の「蒺藜骨朵」は、突起を備えた頭部のある打撃武器と解した。「七獅七器」に合わせ、一つの武器として扱う。鉄蒺藜の具体的な構造や寸法までは、この原文から確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-004"
      "description_ja": "原文は「城頭王子」。この物語では王子が父王を指す場合もあり、息子たちを指す場合もある。城上には父子ともいるため、ここは王と王子たちをまとめて訳したが、詩が個別に誰を数えるかは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-007"
      "description_ja": "「支更傳箭」は夜の番を置き、時刻を知らせることと解した。傳箭には令箭を回す軍事用法もあるが、教育部『重編國語辭典修訂本』の時刻報告の義を優先し、ここで特定の札や矢を回す動作までは補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-008"
      "description_ja": "原文の発話導入は「行者與沙僧」で二人の合同だが、台詞は「我師弟八戒」と言う。八戒を兄弟子とする沙悟浄の立場へ合わせて原文を訂正せず、共同発話の中の呼称として残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-011"
      "description_ja": "悟空の言葉では、七人の獅子を捕らえたことを引き合いに出し、人質はおそらく無傷だと推量している。すでに黄獅一人は打ち殺されているが、話者の「七個」を六人に訂正しない。無傷という判断も、語り手が確認した事実にはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-014"
      "description_ja": "原文は「十個大字」と言うが、掲げられた「萬靈竹節山，九曲盤桓洞」は句読点を除いて十二字ある。字数の食い違いをそのまま残し、名称を削って十字に合わせない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-017"
      "description_ja": "「掗」は、ここでは大きくした棒を押しつけて押し潰す動作と解した。肉餅になったという結果は明示されるが、細かな棒の動かし方には解釈の余地がある。珍字を原文で保持し、単に追い払ったことにはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-019"
      "description_ja": "原文の呼びかけは「揭諦、金甲」。直前には金頭掲諦と六甲六丁が現れるが、金甲をそのどちらかの誤字と断定せず、金の鎧の神々への呼びかけとして残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-021"
      "description_ja": "騫林は道教の仙境に結びつく樹木・林の名。『雲笈七籤』巻二十三に月中の樹木として言及されるが、ここで宮殿自体が月にあるとは読まない。具体的な現実の樹種も確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-023"
      "description_ja": "土地神の「前年」と悟空の「二三年」、獅子番の「前日」、酒を飲むと「三日」眠るという説明を、それぞれ話者の言葉として保存した。天上と地上の時間差の説明は原文にあるが、厳密に日数を計算して語句を改めない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-024"
      "description_ja": "三聖は天上の聖なる三者をいうが、この本文はその内訳を明示しない。天尊が言う「等閑也便不傷生」は普段はむやみに生き物を傷つけないという評価であり、語り手による無害の保証ではない。三聖の具体的な神名は補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-027"
      "description_ja": "黄獅の皮を剝ぐ命令は先にすでに出ているが、ここでも「共那黃獅子都剝了皮」と繰り返す。前の命令が完了したかを推測して反復を消さず、六頭の生け捕りと一頭の死体、計七頭の食肉への処置をそのまま訳す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-028"
      "description_ja": "この質問は原文で主語を省いた「問道」。鉄工たちが悟空に完成を報告し、重量の答えに悟空が応じる流れから、悟空の発話と解した。王子の発話と断定して補わない。ここで完成した三種は王子用に新造した武器で、悟空たちが所有する原型とは別の物である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch90-1455639"
      "segment_ids":
        - "xy-ch90-030"
      "description_ja": "「九靈數合元陽理，四面精通道果之」は、九という数と元陽・修道の成果を結ぶ寓意的な句と解した。とくに末尾の「之」の構文は明瞭でないため、別字へ補訂せず、この理解の留保を残す。九の数理を具体的な修行法として補わない。 原文の欠落ではなく、解釈・校訂上の留保。"

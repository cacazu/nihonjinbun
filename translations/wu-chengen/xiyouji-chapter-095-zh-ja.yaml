    "translation_ja": |-
      太陰星君はその言葉を受け入れ、玉兔を指さして叱った。
      太陰星君「この畜生、早く元に戻って、一緒に来なさい！」
      玉兔はごろりと転がり、本来の姿を現した。まことに、こうであった。

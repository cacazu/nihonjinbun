  - "id": "xy-ch95-023"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": "缺唇尖齒，長耳稀鬚。團身一塊毛如玉，展足千山蹄若飛。直鼻垂酥，果賽霜華填粉膩；雙睛紅映，猶欺雪上點胭脂。伏在地，白穰穰一堆素練；伸開腰，白鐸鐸一架銀絲。幾番家吸殘清露瑤天曉，搗藥長生玉杵奇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 169
        "line_end": 169
        "source_sequence": 23
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      割れた唇、とがった歯、長い耳、まばらな髭。
      身を丸めれば玉の毛の塊となり、足を伸ばせば千の山を飛ぶように走る。
      まっすぐな鼻には白い乳脂のような艶が垂れ、霜の花に白粉を厚く満たしたよりも白く、
      両の眼は赤く輝き、雪の上に紅をさしたよりも鮮やかだ。
      地に伏せば、ふわふわと白い練絹の山。
      腰を伸ばせば、まばゆく白い銀糸の架けもの。
      幾度となく清い露を吸い尽くし、玉の空は明けてきた。
      長生の薬をつく玉の杵は、なんと不思議なものだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch95-024"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那大聖見了，不勝欣喜，踏雲光，向前引導。那太陰君領著眾姮娥仙子，帶著玉兔兒，徑轉天竺國界。此時正黃昏，看看月上。到城邊，聞得譙樓上擂鼓。那國王與唐僧尚在殿內，八戒、沙僧與多官都在階前，方議退朝，只見正南上一片彩霞，光明如晝。眾擡頭看處，又聞得孫大聖厲聲高叫道：「天竺陛下，請出你那皇后、嬪妃看者：這寶幢下乃月宮太陰星君，兩邊的仙妹是月裡嫦娥。這個玉兔兒卻是你家的假公主，今現真相也。」那國王急召皇后、嬪妃與宮娥、綵女等眾朝天禮拜，他和唐僧及多官亦俱望空拜謝。滿城中各家各戶，也無一人不設香案，叩頭念佛。正此觀看處，豬八戒動了慾心，忍不住，跳在空中，把霓裳仙子抱住道：「姐姐，我與你是舊相識，我和你耍子兒去也。」行者上前，揪著八戒，打了兩掌，罵道：「你這個村潑獃子！此是甚麼去處，敢動淫心？」八戒道：「拉閑散悶耍子而已。」那太陰君令轉仙幢，與眾嫦娥收回玉兔，徑上月宮而去。行者把八戒揪落塵埃。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 170
        "line_end": 170
        "source_sequence": 24
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空はその姿を見て、喜びに堪えず、雲の光を踏んで先に立った。太陰星君は姮娥仙子たちを率い、玉兔を連れて天竺国へ向かう。ちょうど黄昏で、月が上りかけていた。城のそばまで来ると、物見楼から太鼓の音が聞こえた。国王と三蔵はまだ御殿におり、八戒と沙悟浄、役人たちは階段の前で、朝議を終えて退出しようかと相談していた。すると真南に、一面の彩りの霞が現れ、昼のように明るくなった。皆が顔を上げると、悟空の大声が聞こえた。
      悟空「天竺の陛下、皇后と妃たちをお呼びになり、ご覧ください！　この宝の幢（どう）の下におられるのが、月宮（げっきゅう）の太陰星君。両側の仙女たちは月の嫦娥（じょうが）です。この玉兔こそ、お宅の偽王女。今、本当の姿を現したのです！」
      国王は急いで皇后、妃、宮女たちを呼び、天へ向かって拝ませた。国王自身も三蔵や役人たちとともに空を仰ぎ、礼を述べる。城じゅうの家でも、香案を設け、頭を地につけて仏を念じない者はいなかった。
      こうして見上げているうちに、八戒は欲情し、こらえきれず空へ跳び上がると、霓裳仙子（げいしょうせんし）を抱きしめた。
      八戒「姉さん、俺とあんたは昔からの知り合いだろう。一緒に遊びに行こうぜ！」
      悟空は駆け寄って八戒をつかみ、平手で二度たたいて罵った。
      悟空「この野卑で無作法な馬鹿め！　ここをどこだと思って、淫らな気を起こすんだ！」
      八戒「世間話でもして、気晴らしに遊ぶだけだよ。」
      太陰星君は仙の幢を返すよう命じ、嫦娥たちと玉兔を連れ、まっすぐ月宮へ帰っていった。悟空は八戒をつかんで、地上へ引き戻した。
    "translation_status": "reviewed"
  - "id": "xy-ch95-025"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這國王在殿上謝了行者，又問前因道：「多感神僧大法力捉了假公主。朕之真公主，卻在何處所也？」行者道：「你那真公主也不是凡胎，就是月宮裡素娥仙子。因十八年前，他將玉兔兒打了一掌，就思凡下界，投胎在你正宮腹內，生下身來。那玉兔兒懷恨前仇，所以於舊年間偷開玉關金鎖走下來，把素娥攝拋荒野，他卻變形哄你。這段因果，是太陰君親口才與我說的。今日既去其假者，明日請御駕去尋其真者。」國王聞說，又心意慚惶，止不住腮邊流淚道：「孩兒，我自幼登基，雖城門也不曾出去，卻教我那裡去尋你也？」行者笑道：「不須煩惱，你公主現在給孤布金寺裡裝風，今且各散，到天明我還你個真公主便是。」眾官又拜伏奏道：「我王且心寬，這幾位神僧乃騰雲駕霧之佛，必知未來過去之因由，明日煩神僧同去一尋，便知端的。」國王依言，即請至留春亭擺齋安歇。此時已近二更。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 171
        "line_end": 171
        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      国王は御殿で悟空に礼を述べ、さらに元の事情を尋ねた。
      国王「神僧の大いなる法力で、偽の王女を捕らえてくださり、ありがたい。だが、朕の本物の王女は、どこにいるのだろう。」
      悟空「本物の王女も、ただの人間ではありません。月宮の素娥仙子（そがせんし）なのです。十八年前、玉兔を一度たたき、そののち人の世を慕って降りてきて、正宮皇后の腹に宿り、生まれました。玉兔はその昔の恨みを抱き、昨年、玉の関の金の錠を盗み開けて下りてきて、素娥をさらって荒野へ放り出し、自分が姿を変えて陛下をだましていたのです。この因果は、たった今、太陰星君がご自分の口で私に話されたことです。今日は偽物を除いたので、明日は陛下みずから、本物を捜しにおいでください。」
      国王は聞くと、恥ずかしさと不安に襲われ、頬を流れる涙を止められなかった。
      国王「わが子よ。朕は幼いころに位について以来、城門の外にさえ出たことがない。いったいどこへ、お前を捜しに行けばよいのだ。」
      悟空は笑った。
      悟空「心配はいりません。王女は今、給孤布金寺（ぎっこふきんじ）で狂ったふりをしています。今夜はひとまず散会し、夜が明けたら、本物の王女をお返ししましょう。」
      役人たちも平伏して申し上げた。
      役人たち「陛下、どうかお心を安らかになさってください。この神僧たちは、雲霧に乗る仏でございます。未来も過去も、その因果をご存じに違いありません。明日、ご同行をお願いして捜せば、確かなことが分かりましょう。」
      国王はその言葉に従い、一行を留春亭（りゅうしゅんてい）へ招き、精進料理を出して休ませた。このとき、すでに二更（にこう）が近づいていた。まさに、こうであった。
    "translation_status": "reviewed"
  - "id": "xy-ch95-026"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      銅壺滴漏月華明，金鐸叮噹風送聲。
      杜宇正啼春去半，落花無路近三更。
      御園寂寞鞦韆影，碧落空浮銀漢橫。
      三市六街無客走，一天星斗夜光晴。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 173
        "line_end": 176
        "source_sequence": 26
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      銅の壺の水時計は雫を落とし、月の光は明るい。
      金の鈴はちりんちりんと鳴り、風がその音を運んでくる。
      杜宇（とう）がしきりに鳴き、春は半ばを過ぎ、
      落ち花で道も見えぬころ、三更（さんこう）が近づく。
      御苑には寂しく、ぶらんこの影が映り、
      青い空には天の川だけが、横たわって浮かぶ。
      三つの市場、六つの街路に、行き来する客もなく、
      満天の星は、晴れた夜に明るく輝く。
    "translation_status": "reviewed"

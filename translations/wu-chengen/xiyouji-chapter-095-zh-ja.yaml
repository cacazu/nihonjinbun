  "known_gaps":
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-001"
      "description_ja": "回題の「真陰」「靈元」は、陰陽や本性の回復を示す修養上の語として読むが、象徴の指示対象を一つに固定しない。底本が併記する「真形／形骸」の異文も見出しの訳に残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-007"
      "description_ja": "底本は「芰荷楟」。楟は辞書では梨の類をいう木の名だが、菱・蓮との結び付きは明確でない。茎を指す文字の異写とも考えられるが確証はなく、原字を残す。植物の別種や「梗」へ無断で改めない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-014"
      "description_ja": "「四相」「五行」「三元」は、仙器の威力を宇宙や修養の調和になぞらえる語。四相は内丹でいう四象との関連が考えられるが、日月星辰など一つの内訳に固定しない。三元にも天地人・精気神などの解釈があり、この詩だけでは一つに絞れない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-014"
      "description_ja": "「君」はこの詩の語りかけ。文脈では婚姻相手を意識するが、悟空に向けた武器の自慢から声が移るため、訳では特定人物の名へ置き換えず「君」を残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-016"
      "description_ja": "「國王沒正經，愛花引得妖邪喜」は、国王のふまじめさと花好みを原因に挙げる語り手の詩句。直前までの妖怪自身の花好みとは主語が違うが、国王を妖怪へ取り替えて整合させない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-018"
      "description_ja": "悟空は「初めに半日戦い、相手は勝てなかった」と報告するが、先の語り手は半日の勝敗が決まらなかったと述べる。報告を改めて一致させない。また、ここでの「現了相」は風の姿を解いて戦ったという報告であり、この時点で本来の種が明示されたとはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-019"
      "description_ja": "「五環」は原字を保つ。劉一明『西遊記百回詳注』は、五行を集める内丹的な象徴として解釈するが、それを底本の唯一の意味と断定しない。具体的な地理や五つの環状物へも確定しない。「福地」は仙人が住むにふさわしい恵まれた土地をいう。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-021"
      "description_ja": "太陰星君が述べた一年・十八年前・昨年という時間をそのまま残し、天上と下界の時間を独自換算しない。素娥と王女の同一性、玉兔の恨みや出奔は星君の説明として示す。「姮娥／嫦娥」は一般には同じ月の女神名だが、この場面の「眾仙妹」は複数の仙女を指す。既存の単独の女神や八戒の過去の相手へ、全員をまとめて同定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-023"
      "description_ja": "「白穰穰」「白鐸鐸」は底本の字を保ち、白さや豊かな毛並みを畳語で強める表現として訳した。「穰」「鐸」を別字へ補訂しない。「直鼻垂酥」の垂れる乳脂も、鼻と白毛の艶を詠む比喩として残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-026"
      "description_ja": "直前の散文は二更近く、この詩では三更近くとする。経過時間を補ったり、どちらかの数を直したりせず残す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-028"
      "description_ja": "原文の「明性月」は、心の本性を月になぞらえ、それを明らかにする修養の表現として訳した。単に外の月を眺めていたと置き換えない。三蔵による回想の引用は、以前の老僧自身の説明と表現が異なるところも、そのまま別の語りとして保つ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-030"
      "description_ja": "「才知後房裡鎖得是個女子」と、僧たちがこの時に初めて女だと知ったとする原文を残した。前の会話からどこまで知っていたはずかを訳者が補って、認識の時点を変更しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-034"
      "description_ja": "「報國僧官，永遠世襲」と、僧の官職を永久に世襲させるという原文の表現を残す。僧の世襲の仕組みや対象者は説明されない。三十六石は俸禄の量で、支給周期や現代の重量は本文から補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-036"
      "description_ja": "底本はここを「華夷樓」と呼ぶ。先の宴に出た「永鎮華夷閣／華夷閣」と同じ建物である可能性はあるが、明示されないため、名前を無断統一せず区別して残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-037"
      "description_ja": "原文は「金銀二百錠、寶貝各一盤」。金と銀それぞれ二百錠とは明記しないため、数を倍にしない。宝の種類や一錠の重量も特定されていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch95-1500606"
      "segment_ids":
        - "xy-ch95-038"
      "description_ja": "「金海」は字義の黄金の海を残した。富貴の境遇から離れることを含む修養的な比喩として読めるが、実在の海を通過したという出来事へは変えない。 原文の欠落ではなく、解釈・校訂上の留保。"

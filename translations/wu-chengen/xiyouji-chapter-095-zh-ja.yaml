    "translation_ja": |-
      第九十五回
      本物の姿をかたる（「真形」は別本で「形骸」）玉兔を捕らえ、真の陰は正道へ戻って霊元に会う
    "translation_status": "reviewed"
  - "id": "xy-ch95-002"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那唐僧憂憂愁愁，隨著國王至後宮。只聽得鼓樂喧天，隨聞得異香撲鼻。低著頭，不敢仰視。行者暗裡欣然，丁在那毘盧帽頂上，運神光，睜火眼金睛觀看。又只見那兩班綵女，擺列的似蕊宮仙府，勝強似錦帳春風。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 122
        "line_end": 122
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "さて、三蔵（さんぞう）は憂いに沈みながら、国王について後宮へ入った。楽の音は空を震わせ、かぐわしい香りが鼻を打つ。うつむいたまま、顔を上げようともしない。一方、悟空（ごくう）はひそかに喜び、毘盧帽（びるぼう）のてっぺんにとまって、火眼金睛（かがんきんせい）に神光を宿し、あたりを見回した。左右に二列、色鮮やかな装いの宮女たちが並び、その様子は仙女の住む花の宮殿さながら。錦の帳の内に春風が吹くような眺めさえ、これには及ばない。まことに、こうであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-003"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": "娉婷嬝娜，玉質冰肌。一雙雙嬌欺楚女，一對對美賽西施。雲髻高盤飛彩鳳，蛾眉微顯遠山低。笙簧雅奏，簫鼓頻吹。宮商角徵羽，抑揚高下齊。清歌妙舞常堪愛，錦砌花團色色怡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 124
        "line_end": 124
        "source_sequence": 3
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      しなやかに、たおやかに、玉のような身体、氷のように澄んだ肌。
      二人ずつ並ぶ艶やかさは楚（そ）の美女をしのぎ、対になって立つ美しさは西施（せいし）をも超える。
      高く結い上げた雲のような髪には、彩りの鳳凰（ほうおう）が飛び、
      かすかに引いた蛾の触角のような眉の前では、遠山さえ低く見える。
      笙の舌は雅な音を奏で、笛と太鼓はしきりに響く。
      宮商角徴羽（きゅうしょうかくちう）、五つの音が、高く低く、抑揚をそろえる。
      清らかな歌と見事な舞は、いつまでも見飽きず、
      錦を敷き、花を寄せたような彩りは、どれも目を楽しませる。
    "translation_status": "reviewed"
  - "id": "xy-ch95-004"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見師父全不動念，暗自裡咂嘴誇稱道：「好和尚，好和尚。身居錦繡心無愛，足步瓊瑤意不迷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 126
        "line_end": 126
        "source_sequence": 4
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空は、師の心に少しも欲念が起こらないのを見て、ひそかに舌を鳴らして褒めた。
      悟空「立派な坊さんだ、立派な坊さんだ。身は錦の中にあっても心はそれを愛でず、足は玉を踏んでも思いは迷わない。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-005"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少時，皇后、嬪妃簇擁著公主出鳷鵲宮，一齊迎接，都道聲：「我王萬歲，萬萬歲。」慌的個長老戰戰兢兢，莫知所措。行者早已知識，見那公主頭頂上微露出一點妖氛，卻也不十分兇惡。即忙爬近耳朵叫道：「師父，公主是個假的。」長老道：「是假的，卻如何放他現相？」行者道：「使出法身，就此拿他也。」長老道：「不可，不可，恐驚了主駕。且待君、后退散，再使法力。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 128
        "line_end": 128
        "source_sequence": 5
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      やがて皇后と妃たちが偽の王女を取り囲んで鳷鵲宮（しじゃくきゅう）から出てきて、一斉に迎えた。
      皇后・妃たちと偽の王女「わが王に万歳、万々歳！」
      三蔵はあわてふためき、震えるばかりで、どうしてよいか分からない。悟空はすでに見抜いていた。偽の王女の頭上から、わずかに妖気が漏れている。ただし、それほど凶悪なものではなかった。すぐに師の耳元へはい寄った。
      悟空「お師匠さま、王女は偽物です。」
      三蔵「偽物なら、どうすれば正体を現させられるのだ。」
      悟空「私が元の身体に戻って、ここで捕まえます。」
      三蔵「いけない、いけない。陛下を驚かせてしまう。国王と皇后が引き上げてから、法力を使いなさい。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-006"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那行者一生性急，那裡容得，大咤一聲，現了本相，趕上前，揪住公主罵道：「好孽畜！你在這裡弄假成真，只在此這等受用，也儘夠了；心尚不足，還要騙我師父，破他的真陽，遂你的淫性哩。」諕得那國王呆呆掙掙，后妃跌跌爬爬，宮娥綵女無一個不東躲西藏，各顧性命。好便似："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 129
        "line_end": 129
        "source_sequence": 6
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      だが、生来せっかちな悟空に、待てるはずもない。大声を上げて本来の姿に戻ると、駆け寄って偽の王女をつかみ、罵った。
      悟空「この畜生め！　偽物を本物に見せかけて、ここでこれだけぜいたくな暮らしをすれば、もう十分だろう。それでも飽き足らず、師匠までだまし、その真陽（しんよう）を奪って、お前の淫欲を満たそうというのか！」
      国王は驚いて呆然と立ち尽くし、皇后や妃たちは転び、はいずり回る。宮女たちも、誰一人として東西に逃げ隠れしない者はなく、皆、自分の命を守るのに精いっぱいだった。まるで、こうであった。
    "translation_status": "reviewed"
  - "id": "xy-ch95-007"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": "春風蕩蕩，秋氣瀟瀟。春風蕩蕩過園林，千花擺動；秋氣瀟瀟來禁苑，萬葉飄搖。刮折牡丹攲檻下，吹歪芍藥臥欄邊。沼岸芙蓉亂撼，臺基菊蕊鋪堆。海棠無力倒塵埃，玫瑰有香眠野境。春風吹折芰荷楟，冬雪壓歪梅嫩蕊。石榴花瓣，亂落在內院東西；岸柳枝條，斜垂在皇宮南北。好花風雨一宵狂，無數殘紅鋪地錦。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 131
        "line_end": 131
        "source_sequence": 7
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      春風は吹き荒れ、秋の気はもの寂しく吹きすさぶ。
      吹き荒れる春風が庭園を過ぎれば、千の花が揺れ動き、
      吹きすさぶ秋の気が宮苑に来れば、万の葉が舞い揺れる。
      牡丹は吹き折られて欄干の下に傾き、芍薬は吹き倒されて手すりのそばに伏す。
      池の岸の芙蓉は乱れ揺れ、台の土台には菊の花が積もる。
      海棠は力なく塵の中へ倒れ、玫瑰（まいかい）は香りを残して野に横たわる。
      春風が菱や蓮の楟（てい）を折り、冬の雪が梅の若い花を押し曲げる。
      石榴の花びらは、内庭の東西に乱れ落ち、
      岸の柳の枝は、宮殿の南北に斜めに垂れる。
      美しい花に、一夜の風雨が荒れ狂い、
      無数の紅の名残が、地面に錦を敷き詰める。
    "translation_status": "reviewed"
  - "id": "xy-ch95-008"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏一發慌了手腳，戰兢兢抱住國王，只叫：「陛下，莫怕，莫怕，此是我頑徒使法力，辨真假也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 133
        "line_end": 133
        "source_sequence": 8
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      三蔵はいよいよ取り乱し、震えながら国王を抱きとめ、繰り返し言った。
      三蔵「陛下、恐れないでください、恐れないでください。あの腕白な弟子が法力を使い、本物と偽物を見分けているのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-009"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖精見事不諧，掙脫了手，解剝了衣裳，捽捽頭，搖落了釵環首飾。跑到御花園土地廟裡，取出一條碓嘴樣的短棍，急轉身來亂打行者；行者隨即跟來，使鐵棒劈面相迎。他兩個吆吆喝喝，就在花園內鬥起。後卻大顯神通，各駕雲霧，殺在空中。這一場："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 135
        "line_end": 135
        "source_sequence": 9
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "偽の王女は、ことがうまくいかなくなったと見るや、悟空の手を振りほどいた。衣を解いて脱ぎ捨て、頭を振って、かんざしも耳飾りも髪飾りも振り落とす。御花園（ぎょかえん）の土地廟（とちびょう）へ駆け込み、踏み臼の先のような短い棒を取り出すと、急に振り返って悟空へやみくもに打ちかかった。すぐあとを追ってきた悟空は、鉄棒を振るって正面から迎え撃つ。二人は叫び声を上げながら庭の中で戦いを始め、やがて大いに神通力を現して、それぞれ雲霧に乗り、空中で激しく戦った。この一戦は、こうであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-010"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      金箍鐵棒有名聲，碓嘴短棍無人識。
      一個因取真經到此方，一個為愛奇花來住跡。
      那怪久知唐聖僧，要求配合元精液。
      舊年攝去真公主，變作人身欽愛惜。
      今逢大聖認妖氛，救援活命分虛實。
      短棍行兇著頂丟，鐵棒施威迎面擊。
      喧喧嚷嚷兩相持，雲霧滿天遮白日。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 136
        "line_end": 142
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      金箍鉄棒（きんこてつぼう）は名高いが、踏み臼の先のような短い棒は誰も知らない。
      一人は真の経を求めてこの地へ来、一人は珍しい花を愛してここに住みついた。
      あの妖怪は、とうに唐（とう）の聖僧を知り、交わって元精の液を得ようと望んだ。
      昨年、本物の王女をさらい、人の姿に化けて、尊ばれ、かわいがられた。
      今、大聖（たいせい）が妖気を見抜き、人を救い、命を守って、虚実を分ける。
      短い棒は凶暴に頭上を狙い、鉄棒は威力を振るって顔へ打ちかかる。
      わめき騒いで二人は争い、雲霧は空に満ちて白日を覆う。
    "translation_status": "reviewed"
  - "id": "xy-ch95-011"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個殺在半空賭鬥，嚇得那滿城中百姓心慌，盡朝裡多官膽怕。長老扶著國王，只叫：「休驚，請勸娘娘與眾等莫怕。你公主是個假作真形的，等我徒弟拿住他，方知好歹也。」那些妃子有膽大的，把那衣服、釵環拿與皇后看了，道：「這是公主穿的戴的，今都丟下，精著身子，與那和尚在天上爭打，必定是個妖邪。」此時國王、后妃人等才正了性，望空仰視不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 144
        "line_end": 144
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      二人が半空で命がけの勝負を続けるので、城じゅうの民はうろたえ、朝廷の役人たちも恐れおののいた。三蔵は国王を支え、繰り返し言った。
      三蔵「驚かないでください。皇后さまや皆さまにも、恐れないようお伝えください。あの王女は、本物の姿をかたった偽物です。弟子が捕まえれば、すべてはっきりいたします。」
      妃たちのうち胆の据わった者が、脱ぎ捨てられた衣や飾りを皇后に見せた。
      妃たち「これは王女さまが身につけておられたものです。今はすべて投げ捨て、裸のまま、あのお坊さまと空で戦っています。間違いなく妖怪でございます。」
      ここに至って国王や皇后、妃たちもようやく気を取り直し、空を見上げた。この方はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch95-012"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖精與大聖鬥經半日，不分勝敗。行者把棒丟起，叫一聲：「變！」就以一變十，以十變百，以百變千，半天裡，好似蛇遊蟒攪，亂打妖邪。妖邪慌了手腳，化道清風，即奔碧空之上逃走。行者念聲咒語，將鐵棒收做一根，縱祥光一直趕來。將近西天門，望見那旌旗閃灼，行者厲聲高叫道：「把天門的，擋住妖精，不要放他走了。」真個那天門上有護國天王帥領著龐、劉、苟、畢四大元帥，各展兵器攔阻。妖邪不能前進，急回頭，使短棍，又與行者相持。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 145
        "line_end": 145
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      さて、偽の王女と悟空は半日戦っても、勝負がつかなかった。悟空は棒を放り上げて叫んだ。
      悟空「変われ！」
      すると一本が十本に、十本が百本に、百本が千本になり、空一面で蛇が泳ぎ、大蛇がのたうつように、偽の王女を乱れ打った。偽の王女はあわてふためき、一筋の清風に化けて、青空の上へ逃げ出した。悟空は呪文を唱え、鉄棒を一本に戻すと、瑞光を放ってまっすぐ追う。西天門（さいてんもん）に近づき、きらめく旗が見えると、大声で呼ばわった。
      悟空「天門の番人たち、妖怪を食い止めろ！　逃がすな！」
      折しも門には護国天王（ごこくてんのう）がおり、龐（ほう）・劉（りゅう）・苟（こう）・畢（ひつ）の四大元帥を率いていた。それぞれ武器を広げて道をふさいだため、偽の王女は先へ進めない。急に振り返り、短い棒を構えて、また悟空と渡り合った。
    "translation_status": "reviewed"
  - "id": "xy-ch95-013"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖掄鐵棒，仔細迎著看時，見那短棍兒一頭奘，一頭細，卻似舂碓臼的杵頭模樣，叱咤一聲，喝道：「孽畜！你拿的是甚麼器械，敢與老孫抵敵？快早降伏，免得這一棒打碎你的天靈。」那妖邪咬著牙道：「你也不知我這兵器，聽我道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 147
        "line_end": 147
        "source_sequence": 13
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空は鉄棒を振るい、迎え撃ちながらよく見ると、相手の短い棒は片方が太く、片方が細い。穀物を臼でつく杵の頭のような形だった。悟空は一喝した。
      悟空「畜生め！　いったい何という武器で、この俺に立ち向かうつもりだ。早く降伏しろ。この棒で頭のてっぺんを砕かれずに済むぞ！」
      偽の王女は歯を食いしばった。
      偽の王女「お前も、この武器が何かは知らないのか。聞くがいい。
    "translation_status": "reviewed"
  - "id": "xy-ch95-014"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      仙根是段羊脂玉，磨琢成形不計年。
      混沌開時吾已得，洪濛判處我當先。
      源流非比凡間物，本性生來在上天。
      一體金光和四相，五行瑞氣合三元。
      隨吾久住蟾宮內，伴我常居桂殿邊。
      因為愛花垂世境，故來天竺假嬋娟。
      與君共樂無他意，欲配唐僧了宿緣。
      你怎欺心破佳偶，死尋趕戰逞兇頑？
      這般器械名頭大，在你金箍棒子前。
      廣寒宮裡搗藥杵，打人一下命歸泉。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 148
        "line_end": 157
        "source_sequence": 14
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      仙なるもとは一片の羊脂玉（ようしぎょく）、どれほどの年月をかけて磨き、形を整えたか知れない。
      混沌が開けたとき、私はすでにこれを得ており、天地が分かれるときも、私が先だった。
      その来歴は下界の物とは比べられず、生まれながらの本性は天上にある。
      一体の金の光は四相（しそう）を調和させ、五行（ごぎょう）の瑞気は三元（さんげん）を合わせる。
      私とともに長く蟾宮（せんきゅう）に住み、いつも私に伴って桂殿（けいでん）のそばにあった。
      花を愛して人の世へ降りたので、この天竺（てんじく）へ来て美女を装った。
      君と楽しみをともにするほかに思いはなく、唐僧（とうそう）と結ばれ、前世からの縁を果たしたいのだ。
      どうしてお前は良心に背いて良い縁を壊し、しつこく追いかけ、戦いを挑み、凶暴に振る舞うのか。
      この武器の名は高く、お前の金箍棒（きんこぼう）より先に知られていた。
      広寒宮（こうかんきゅう）の搗薬杵（とうやくしょ）、一打食らえば命は黄泉へ帰る。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-015"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞說，呵呵冷笑道：「好孽畜啊！你既住在蟾宮之內，就不知老孫的手段，你還敢在此支吾？快早現相降伏，饒你性命。」那怪道：「我認得你是五百年前大鬧天宮的弼馬溫，理當讓你。但只是破人親事，如殺父母之仇，故此情理不甘，要打你欺天罔上的弼馬溫。」那大聖惱得是「弼馬溫」三字，他聽得此言，心中大怒，舉鐵棒劈面就打；那妖邪掄杵來迎。就於西天門前，發狠相持。這一場："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 159
        "line_end": 159
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空は聞くと、ふんと冷たく笑った。
      悟空「この畜生め！　蟾宮に住んでいたくせに、俺の腕前を知らないのか。それでもまだ抵抗するつもりか。さっさと正体を現して降伏しろ。命は助けてやる。」
      偽の王女「お前が五百年前、天宮で大暴れした弼馬温（ひつばおん）だとは知っている。本来なら譲るべきだろう。だが、人の縁談を壊すのは、父母を殺すのと同じ恨みだ。どうしても我慢ならない。天を欺き、上の者を侮る弼馬温め、お前を打ちのめしてやる！」
      悟空が何より腹を立てるのは、「弼馬温」の三文字である。この言葉を聞くと激怒し、鉄棒を上げて相手の顔めがけて打ちかかった。偽の王女は杵を振るって迎え撃つ。こうして西天門の前で、互いに猛り狂って戦った。この一戦は、こうであった。
    "translation_status": "reviewed"
  - "id": "xy-ch95-016"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": "金箍棒，搗藥杵，兩般仙器真堪比。那個為結婚姻降世間，這個因保唐僧到這裡。原來是國王沒正經，愛花引得妖邪喜。致使如今恨苦爭，兩家都把頑心起。一衝一撞賭輸贏，劖語劖言齊鬥嘴。藥杵英雄世罕稀，鐵棒神威還更美。金光湛湛幌天門，彩霧輝輝連地里。來往戰經十數回，妖邪力弱難搪抵。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 160
        "line_end": 160
        "source_sequence": 16
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      金箍棒と搗薬杵、二つの仙器は、まことに比べるに足る。
      あちらは婚姻を結ぼうと下界に降り、こちらは唐僧を守ってここまで来た。
      もとはといえば、国王がまじめでなく、花を好んで、妖怪の喜びを誘ったのだ。
      それゆえ今、深い恨みをもって争い、双方ともに意地を張る。
      突いてはぶつかり、勝ち負けを争い、刺すような言葉を交わして、口でも戦う。
      薬杵の勇ましさは世にまれだが、鉄棒の神威はいっそう見事。
      金の光は明々と天門を照らし、彩りの霧は輝いて地の奥へつながる。
      行きつ戻りつ十数合、妖怪は力が弱り、支えきれなくなる。
    "translation_status": "reviewed"
  - "id": "xy-ch95-017"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精與行者又鬥了十數回，見行者的棒勢緊密，料難取勝，虛丟一杵，將身幌一幌，金光萬道，徑奔正南上敗走。大聖隨後追襲。忽至一座大山，妖精按金光，鑽入山洞，寂然不見。又恐他遯身回國，暗害唐僧，他認了這山的規模，返雲頭徑轉國內。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 162
        "line_end": 162
        "source_sequence": 17
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "偽の王女は悟空とさらに十数合戦ったが、棒の攻めに隙がなく、勝つのは難しいと悟った。杵を一度打ち出すふりをして、身を揺すると、万筋の金の光となり、真南へ敗走する。悟空はあとを追った。やがて一つの大きな山に至ると、偽の王女は金の光を下ろし、山の洞窟へ潜り込んで、ひっそりと姿を消した。悟空は、相手がひそかに国へ戻って三蔵を害するのではないかと心配し、山の形を覚えてから、雲を返して国へまっすぐ戻った。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-018"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時有申時矣。那國王正扯著三藏，戰戰兢兢，只叫：「聖僧救我。」那些嬪妃、皇后也正愴惶，只見大聖自雲端裡落將下來，叫道：「師父，我來也。」三藏道：「悟空立住，不可驚了聖躬。我問你：假公主之事，端的如何？」行者立於鳷鵲宮外，叉手當胸道：「假公主是個妖邪。初時與他打了半日，他戰不過我，化道清風，徑往天門上跑，是我吆喝天神擋住。他現了相，又與我鬥到十數合，又將身化作金光，敗回正南上一座山上。我急追至山，無處尋覓，恐怕他來此害你，特地回顧也。」國王聽說，扯著唐僧問道：「既然假公主是個妖邪，我真公主在於何處？」行者應聲道：「待我拿住假公主，你那真公主自然來也。」那后妃等聞得此言，都解了恐懼，一個個上前拜告道：「望聖僧救得我真公主來，分了明暗，必當重謝。」行者道：「此間不是我們說話處，請陛下與我師出宮上殿，娘娘等各轉回宮，召我師弟八戒、沙僧來保護師父，我卻好去降妖。一則分了內外，二則免我懸掛。謹當辨明，以表我一場心力。」國王依言，感謝不已。遂與唐僧攜手出宮，徑至殿上。眾后妃各各回宮。一壁廂教備素膳，一壁廂召八戒、沙僧。須臾間，二人早至。行者備言前事，教他兩個用心護持。這大聖縱觔斗雲，飛空而去。那殿前多官，一個個望空禮拜不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 163
        "line_end": 163
        "source_sequence": 18
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      このとき、すでに申の刻（さるのこく）になっていた。国王は三蔵にすがりつき、がたがた震えて、繰り返す。
      国王「聖僧、朕を救ってくだされ！」
      皇后や妃たちもうろたえていると、悟空が雲の上から降りてきた。
      悟空「お師匠さま、戻りました！」
      三蔵「悟空、そこで止まりなさい。陛下を驚かせてはならぬ。尋ねるが、偽の王女のことは、結局どうなったのだ。」
      悟空は鳷鵲宮の外に立ち、胸の前で手を組んで答えた。
      悟空「偽の王女は妖怪です。初めに半日戦い、向こうは私に勝てず、一筋の清風に化けて天門へ逃げました。私が呼ばわって天の神々に食い止めさせると、姿を現して、さらに十数合戦いました。それからまた身を金の光に変え、真南の山へ敗走したのです。急いで追いかけましたが、山ではどこにも見当たらない。こちらへ戻ってお師匠さまを害するのではないかと、わざわざ確かめに戻ったのです。」
      国王は聞いて三蔵を引き止め、尋ねた。
      国王「偽の王女が妖怪なら、朕の本物の王女は、どこにいるのだ。」
      悟空はすぐ答えた。
      悟空「偽物を捕まえれば、本物の王女はおのずと戻ってきます。」
      皇后と妃たちはその言葉に恐怖を解き、それぞれ進み出て拝み、願った。
      皇后と妃たち「聖僧さま、どうか本物の王女を助け出し、真偽を明らかにしてください。必ず厚くお礼を申し上げます。」
      悟空「ここは、私たちが話す場所ではありません。陛下は師とともに後宮を出て、表の御殿へお移りください。皇后さまたちはそれぞれの宮へお戻りを。弟弟子の八戒（はっかい）と沙悟浄（さごじょう）を呼んで師を守らせれば、私は妖怪退治に出られます。これなら宮の内外のけじめもつき、私も心配せずに済む。必ず真相を見極め、この力を尽くしたことをお示ししましょう。」
      国王は言葉に従い、礼を繰り返した。三蔵と手を取り合って後宮を出て、まっすぐ御殿へ行き、皇后と妃たちも、それぞれの宮へ戻った。一方では精進料理を用意させ、一方では八戒と沙悟浄を呼ぶ。ほどなく二人が来ると、悟空はそれまでの経緯を詳しく話し、心を込めて師を守るように言いつけた。そして筋斗雲（きんとうん）に乗って空へ飛び去った。御殿の前の役人たちは、それぞれ空へ向かって拝んだ。この方はさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch95-019"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖徑至正南方那座山上尋找。原來那妖邪敗了陣，到此山，鑽入窩中，將門兒使石塊擋塞，虛怯怯藏隱不出。行者尋一會，不見動靜，心甚焦惱，捻著訣，念動真言，喚出那山中土地、山神審問。少時，二神至了，叩頭道：「不知，不知，知當遠接，萬望恕罪。」行者道：「我且不打你。我問你：這山叫做甚麼名字？此處有多少妖精？從實說來，饒你罪過。」二神告道：「大聖，此山喚做毛穎山。山中只有三處兔穴，亙古至今，沒甚妖精，乃五環之福地也。大聖要尋妖精，還是西天路上去有。」行者道：「老孫到了西天天竺國，那國王有個公主被個妖精攝去，拋在荒野。他就變做公主模樣，戲哄國王，結綵樓，拋繡毬，欲招駙馬。我保唐僧至其樓下，被他有心打著唐僧，欲為配偶，誘取元陽。是我識破，就於宮中現身捉獲。他就脫了人衣、首飾，使一條短棍，喚名搗藥杵，與我鬥了半日，他就化清風而去。被老孫趕至西天門，又鬥有十數合。他料不能勝，復化金光，逃至此處，如何不見？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 164
        "line_end": 164
        "source_sequence": 19
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空は真南の山へまっすぐ向かい、捜し始めた。実は偽の王女は敗走してこの山へ来ると、巣穴に潜り、石で入口をふさいで、おびえながら隠れ、出てこなかったのである。悟空はしばらく捜しても何の気配もなく、ひどくいら立った。指で印を結び、真言を唱えて、山の土地神と山神を呼び出し、問いただす。ほどなく二神が来て、頭を地につけた。
      土地神と山神「存じませんでした、存じませんでした。存じていれば、遠くまでお迎えに出ましたものを。どうかお許しください。」
      悟空「今のところ、殴らずにおいてやる。聞くが、この山は何という名だ。ここには妖怪がどれだけいる。本当のことを言えば、罪は許してやる。」
      土地神と山神「大聖、この山は毛穎山（もうえいざん）と申します。山には兎の穴が三つあるばかりで、遠い昔から今まで、妖怪などおりません。五環（ごかん）の福地（ふくち）でございます。妖怪をお捜しなら、やはり西天（さいてん）への道においでになればおります。」
      悟空「俺は西天の天竺国（てんじくこく）まで行ったのだ。そこの国王の王女を妖怪がさらい、荒野へ放り出した。自分は王女の姿になり、国王をだまして、飾り楼を建て、繍毬（しゅうきゅう）を投げて婿を取ろうとした。俺が唐僧を守って楼の下へ来ると、あいつはわざと唐僧へ毬を当てた。夫婦になって、元陽（げんよう）を誘い取ろうというのだ。俺が見破り、宮中で姿を現してつかまえると、人の衣服と飾りを脱ぎ捨て、搗薬杵という短い棒で半日戦い、清風に化けて逃げた。西天門まで追いかけて、また十数合戦った。向こうは勝てないと見て、再び金の光になり、ここへ逃げ込んだのだ。それなのに、なぜ見つからない？」
    "translation_status": "reviewed"
  - "id": "xy-ch95-020"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二神聽說，即引行者去那三窟中尋找。始於山腳下窟邊看處，亦有幾個草兔兒，也驚得走了。尋至絕頂上窟中看時，只見兩塊大石頭，將窟門擋住。土地道：「此間必是妖邪，趕急鑽進去也。」行者即使鐵棒，捎開石塊。那妖邪果藏在裡面，呼的一聲，就跳將出來，舉藥杵來打行者掄起鐵棒架住。諕得那山神倒退，土地忙奔。那妖邪口裡囔囔突突的罵著山神、土地道：「誰教你引著他往這裡來找尋？」他支支撐撐的抵著鐵棒，且戰且退，奔至空中。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 165
        "line_end": 165
        "source_sequence": 20
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      二神は事情を聞くと、すぐ悟空を案内し、三つの穴を捜した。まず山の麓の穴を調べると、野兎が何匹かいたが、驚いて逃げ出した。山頂の穴まで捜しに行くと、大きな石が二つ、入口をふさいでいた。
      土地神「妖怪はきっとここです。急いで穴へ潜り込んだのでしょう。」
      悟空は鉄棒で石を払いのけた。案の定、偽の王女が中に隠れており、ひゅっと飛び出すと、薬杵を振り上げて打ちかかる。悟空は鉄棒を回して受け止めた。山神は驚いて後ずさり、土地神はあわてて逃げる。偽の王女はぶつぶつと悪態をつき、山神と土地神を罵った。
      偽の王女「誰がお前たちに、あいつをここへ案内して捜させろと言った！」
      鉄棒をどうにか支えながら、戦っては退き、空中へ逃れた。
    "translation_status": "reviewed"
  - "id": "xy-ch95-021"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正在危急之際，卻又天色晚了。這行者愈發狠性，下切手，恨不得一棒打殺。忽聽得九霄碧漢之間有人叫道：「大聖，莫動手，莫動手，棍下留情。」行者回頭看時，原來是太陰星君，後帶著姮娥仙子，降彩雲到於當面。慌得行者收了鐵棒，躬身施禮道：「老太陰往那裡去？老孫失迴避了。」太陰道：「與你對敵的這個妖邪，是我廣寒宮搗玄霜仙藥之玉兔也。他私自偷開玉關金鎖，走出宮來，今經一載。我算他目下有傷命之災，特來救他性命。望大聖看老身饒他罷。」行者喏喏連聲，只道：「不敢，不敢。怪道他會使搗藥杵，原來是個玉兔兒。老太陰不知，他攝藏了天竺國王之公主，卻又假合真形，欲破我聖僧師父之元陽，其情其罪，其實何甘？怎麼便可輕恕饒他？」太陰道：「你亦不知，那國王之公主，也不是凡人，原是蟾宮中之素娥。十八年前，他曾把玉兔兒打了一掌，卻就思凡下界，一靈之光，遂投胎於國王正宮皇后之腹，當時得以降生。這玉兔兒懷那一掌之仇，故於舊年私走出宮，拋素娥於荒野。但只是不該欲配唐僧，此罪真不可逭。幸汝留心，識破真假，卻也未曾傷損你師。萬望看我面上，恕他之罪，我收他去也。」行者笑道：「既有這些因果，老孫也不敢抗違。但只是你收了玉兔兒，恐那國王不信，敢煩太陰君同眾仙妹將玉兔兒拿到那廂，對國王明證明證：一則顯老孫之手段，二來說那素娥下降之因由，然後著那國王取素娥公主之身，以見顯報之意也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 166
        "line_end": 166
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      危うさが頂点に達したころ、日も暮れかけてきた。悟空はいっそう激しく攻め立て、容赦のない手を繰り出し、一撃で打ち殺してやりたいと思っていた。そのとき、はるか高い青空から、声が聞こえた。
      空からの声「大聖、手を止めてください、手を止めてください！　その棒で命を奪わないで！」
      悟空が振り向くと、それは太陰星君（たいいんせいくん）だった。後ろに姮娥仙子（こうがせんし）を従え、彩雲を下ろして目の前へ来る。悟空はあわてて鉄棒を収め、身をかがめて礼をした。
      悟空「太陰（たいいん）のお方、どちらへおいでですか。道をお譲りせず、失礼いたしました。」
      太陰星君「そなたと戦っている妖怪は、私の広寒宮で玄霜（げんそう）の仙薬をつく玉兔（ぎょくと）なのです。勝手に玉の関の金の錠を盗み開けて、宮を抜け出し、もう一年になります。今まさに命を失う災いに遭うと占いで分かったので、命を救いに来ました。大聖、私に免じて許してやってください。」
      悟空は何度も応じた。
      悟空「いえ、いえ、そんな。道理で搗薬杵を使うはずだ。玉兔だったとは。ですが、太陰のお方はご存じない。あいつは天竺国王の王女をさらって隠し、本物の姿をかたり、私の聖僧である師の元陽を奪おうとしたのです。その企み、その罪、どうして納得できますか。そんなに簡単に許してやれるものですか。」
      太陰星君「そなたも知らないことがあります。国王の王女も普通の人間ではなく、もとは蟾宮の素娥（そが）なのです。十八年前、あの娘は玉兔を一度、平手でたたきました。そののち人の世を慕って下界へ降り、一筋の魂の光が、国王の正宮皇后の腹に宿り、やがて生まれたのです。玉兔は、たたかれた恨みを抱いていたので、昨年ひそかに宮を抜け出し、素娥を荒野へ放り出しました。ただ、唐僧の妻になろうとしたことだけは、してはならぬことでした。この罪は、まことに逃れようがありません。幸い、そなたが気を配り、真偽を見破ったので、師を傷つけるには至らなかった。どうか私の顔を立て、その罪をお許しください。私が連れて帰ります。」
      悟空は笑った。
      悟空「そういう因果があるのなら、私も逆らうわけにはいきません。ただ、玉兔をそのまま連れ帰られては、国王が信じないおそれがあります。恐れ入りますが、太陰星君と仙女の皆さんで玉兔をあちらへ連れていき、国王の前ではっきり証しを立てていただけませんか。一つには私の腕前を示し、二つには素娥が下界へ降りた事情を話していただく。そのうえで国王に、王女として生まれた素娥を迎えに行かせれば、因果の報いが明らかに現れたと分かりましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-022"

  - "id": "xy-ch95-028"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這一夜，國王退了妖氣，陡長精神，至五更三點，復出臨朝。朝畢，命請唐僧四眾，議尋公主。長老隨至，朝上行禮。大聖三人，一同打個問訊。國王欠身道：「昨所云公主孩兒，敢煩神僧為一尋救。」長老道：「貧僧前日自東來，行至天晚，見一座給孤布金寺，特進求宿，幸那寺僧相待。當晚齋罷，步月閑行，行至布金舊園，觀看基址，忽聞悲聲入耳，詢問其由。本寺一老僧，年已百歲之外，他屏退左右，細細的對我說了一遍道：『悲聲者，乃舊年春深時，那老僧正明性月，忽然一陣風生，見一女子擲之於地，那僧問之，那女子道：「我是天竺國國王公主，因為夜間玩月觀花，被風刮至於此。」』那老僧多知人禮，即將公主鎖在一間僻靜房中。惟恐本寺頑僧污染，只說是妖精，被他鎖住。公主識得此意，日間胡言亂語，討些茶飯吃了；夜深無人處，思量父母悲啼。那老僧也曾來國打聽幾番，見公主在宮無恙，所以不敢聲言舉奏。因見我徒弟有些神通，那老僧千叮萬囑，教貧僧到此查訪。不期他原是蟾宮玉兔為妖，假合真形，變作公主模樣，他卻又有心要破我元陽。幸虧我徒弟施威顯法，認出真假。今已被太陰星收去。賢公主見在布金寺裝風也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 179
        "line_end": 179
        "source_sequence": 28
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      この一夜で、国王から妖気が去り、にわかに元気が増した。五更三点（ごこうさんてん）になると、また朝廷へ出る。朝議を終えると、三蔵たち四人を招き、王女を捜す相談をするよう命じた。三蔵は来て朝廷で礼を行い、悟空たち三人も一緒に僧の礼をした。国王は少し身を起こした。
      国王「昨日お話しくださった王女、あの子のことだが、神僧たちのお力で、捜して救い出していただけまいか。」
      三蔵「私は先日、東から参り、日暮れに給孤布金寺を見つけたので、宿を請うために入りました。ありがたいことに、寺の僧たちがもてなしてくれました。その夜、食事のあと、月を眺めながら散歩し、昔、金を敷いた園の跡へ行って礎を眺めていると、突然、悲しげな声が聞こえてきたのです。わけを尋ねると、百歳を超えた老僧が、人を下がらせ、詳しく話してくれました。
      老僧はこう言いました。『悲しげに泣いている者のことです。昨年の春も深まったころ、私が自分の本性の月を明らかにしようと修行していると、突然一陣の風が起こり、一人の女が地に投げ落とされました。わけを尋ねると、女は「私は天竺国王の王女です。夜、月を眺め、花を見ていると、風にさらわれてここへ来たのです」と言いました。』
      この老僧は、人として守るべき道をよく心得ていました。王女を人けのない部屋に入れ、鍵をかけたのは、寺の不心得な僧たちが王女を辱めるのを恐れたからです。僧たちには、妖怪を閉じ込めてある、とだけ話しました。王女もその心遣いを知り、昼はでたらめを言って、茶や飯をもらい、夜、人がいなくなると、父母を思って悲しく泣いていたのです。老僧は何度か都へ様子を聞きにも来ましたが、王女は宮中で無事だと聞いたため、声を上げてお訴えすることができませんでした。私の弟子に神通力があると見て、ここへ来て調べてほしいと、くれぐれも頼んだのです。
      思いもよらず、妖怪になっていたのは蟾宮の玉兔でした。本物の姿をかたり、王女に化けて、さらに私の元陽を奪おうとしていたのです。幸い、弟子が力を振るい、術を現して、真偽を見破りました。今は太陰星君が連れ帰っています。お嬢さまは現に布金寺（ふきんじ）で、狂ったふりをしておいでです。」
    "translation_status": "reviewed"
  - "id": "xy-ch95-029"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王見說此詳細，放聲大哭。早驚動三宮六院，都來問及前因，無一人不痛哭者。良久，國王又問：「布金寺離城多遠？」三藏道：「只有六十里路。」國王遂傳旨：「著東西二宮守殿，掌朝太師衛國。朕同正宮皇后帥多官、四神僧，去寺取公主也。」當時擺駕，一行出朝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 180
        "line_end": 180
        "source_sequence": 29
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      国王はこれほど詳しい話を聞き、声を上げて泣いた。それが早くも三宮六院（さんぐうりくいん）の者たちを驚かせ、皆が集まって事情を尋ね、泣き悲しまない者はいなかった。しばらくして、国王はまた尋ねた。
      国王「布金寺は、城からどのくらい離れているのだ。」
      三蔵「わずか六十里（り）でございます。」
      国王はそこで命令を下した。
      国王「東西二宮には御殿を守らせ、朝政をつかさどる太師（たいし）には国を守らせよ。朕は正宮皇后とともに、役人たちと四人の神僧を伴い、寺へ王女を迎えに行く。」
      すぐに行列の支度が整い、一行は朝廷を出た。
    "translation_status": "reviewed"
  - "id": "xy-ch95-030"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看那行者就跳在空中，把腰一扭，先到了寺裡。眾僧慌忙跪接道：「老爺去時，與眾步行，今日何從天上下來？」行者笑道：「你那老師在於何處？快叫他出來，排設香案接駕，天竺國王、皇后、多官與我師都來了。」眾僧不解其意，即請出那老僧。老僧見了行者，倒身下拜道：「老爺，公主之事如何？」行者把那假公主拋繡毬，欲配唐僧，並趕捉賭鬥，與太陰星收去玉兔之言，備陳了一遍。那老僧又磕頭拜謝。行者攙起道：「且莫拜，且莫拜。快安排接駕。」眾僧才知後房裡鎖得是個女子，一個個驚驚喜喜，便都設了香案，擺列山門之外，穿了袈裟，撞起鐘鼓等候。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 182
        "line_end": 182
        "source_sequence": 30
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      さて、悟空は空へ跳び上がり、腰をひとひねりすると、一足先に寺へ着いた。僧たちはあわててひざまずき、迎えた。
      僧たち「お方さま、お帰りのときは皆さまと歩いておいででしたのに、今日はなぜ空からおいでになったのですか。」
      悟空は笑った。
      悟空「お前たちの老師はどこだ。早く出てくるように言い、香案を並べて、陛下をお迎えする支度をしろ。天竺の国王と皇后、役人たち、それに俺の師匠が来るぞ。」
      僧たちは意味が分からないまま、老院主を呼び出した。老院主は悟空を見ると、身を投げるように伏して拝んだ。
      老院主「お方さま、王女のことは、どうなりましたでしょう。」
      悟空は、偽の王女が繍毬を投げて三蔵と結ばれようとしたこと、追いかけ、捕らえようと戦ったこと、太陰星君が玉兔を連れ帰ったことまで、詳しく話した。老院主はまた頭を地につけて礼を述べた。悟空は助け起こした。
      悟空「もう拝まなくていい、拝まなくていい。早く、陛下を迎える支度をしろ。」
      僧たちはようやく、奥の部屋に閉じ込められているのが女だと知り、一人一人、驚き喜んだ。皆で香案を設け、山門の外に並べ、袈裟を着て、鐘と太鼓を鳴らしながら待った。
    "translation_status": "reviewed"
  - "id": "xy-ch95-031"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時，聖駕早到。果然是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 184
        "line_end": 184
        "source_sequence": 31
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "ほどなく、国王の行列が到着した。まことに、こうであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-032"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      繽紛瑞靄滿天香，一座荒山倏被祥。
      虹流千載清河海，電繞長春賽禹湯。
      草木沾恩添秀色，野花得潤有餘芳。
      古來長者留遺跡，今喜明君降寶堂。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 186
        "line_end": 189
        "source_sequence": 32
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      入り乱れる瑞雲、空いっぱいに満ちる香り、
      一つの荒れ山が、たちまち吉祥に包まれる。
      虹の光は千年流れ、河と海を清らかにし、
      稲妻は長い春を巡り、その徳は禹（う）や湯（とう）にもまさる。
      草木は恩恵に潤って、いっそう美しさを増し、
      野の花は恵みを受けて、余りある香りを放つ。
      昔、長者が残した跡に、
      今、明君が宝の堂へ来られたことを喜ぶ。
    "translation_status": "reviewed"
  - "id": "xy-ch95-033"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王到於山門之外，只見那眾僧齊齊整整，俯伏接拜；又見孫行者立在中間。國王道：「神僧何先到此？」行者笑道：「老孫把腰略扭一扭兒，就到了。你們怎麼就走這半日？」隨後唐僧等俱到。長老引駕，到於後面房邊，那公主還裝風胡說。老僧跪指道：「此房內就是舊年風吹來的公主娘娘。」國王即令開門。隨即打開鐵鎖，開了門。國王與皇后見了公主，認得形容，不顧穢污，近前一把摟抱道：「我的受苦的兒啊！你怎麼遭這等折磨，在此受罪？」真是父母子女相逢，比他人不同，三人抱頭大哭。哭了一會，敘畢離情，即令取香湯，教公主沐浴更衣，上輦回國。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 190
        "line_end": 190
        "source_sequence": 33
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      国王が山門の外へ来ると、僧たちは整然と並び、伏して迎え拝んでいた。その真ん中には悟空が立っている。
      国王「神僧は、どうして先にここへ来られたのだ。」
      悟空は笑った。
      悟空「腰をちょっとひねっただけで、着きました。皆さんは、どうして半日も歩いていたのですか。」
      あとから三蔵たちも皆、到着した。三蔵は国王を導いて奥の部屋のそばへ行く。王女はまだ狂ったふりをして、でたらめを言っていた。老院主はひざまずき、部屋を指した。
      老院主「この部屋におられるのが、昨年、風に運ばれてきた王女さまでございます。」
      国王はすぐに扉を開けるよう命じた。鉄の錠が外され、扉が開く。国王と皇后は王女を見ると、その姿を見覚えており、汚れているのも構わず近寄って、ひしと抱きしめた。
      国王と皇后「かわいそうな、わが子よ！　どうしてこんなひどい目に遭い、ここで苦しまねばならなかったのだ！」
      まことに、親子の再会は他人同士とは違う。三人は頭を寄せ合い、大声で泣いた。しばらく泣き、離れていた間の思いを語り終えると、すぐ香りのよい湯を用意させ、王女に身体を洗わせ、衣を着替えさせた。そして輦（れん）に乗せ、国へ帰った。
    "translation_status": "reviewed"
  - "id": "xy-ch95-034"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者又對國王拱手道：「老孫還有一事奉上。」國王答禮道：「神僧有事吩咐，朕即從之。」行者道：「他這山，名為百腳山。近來說有蜈蚣成精，黑夜傷人，往來行旅，甚為不便。我思蜈蚣惟雞可以降伏，可選絕大雄雞千隻，撒放山中，除此毒蟲。就將此山名改換改換，賜文一道敕封，就當謝此僧供養公主之恩也。」國王甚喜，領諾。隨差官進城取雞；又改山名為寶華山。仍著工部辦料重修，賜與封號，喚做「敕建寶華山給孤布金寺」；把那老僧封為「報國僧官」，永遠世襲，賜俸三十六石。僧眾謝了恩，送駕回朝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 192
        "line_end": 192
        "source_sequence": 34
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      悟空はさらに、国王へ両手を組んで礼をした。
      悟空「もう一つ、申し上げたいことがあります。」
      国王も礼を返した。
      国王「神僧からのお申しつけなら、朕はそのとおりにしよう。」
      悟空「この山は百脚山（ひゃっきゃくさん）という名です。近ごろ、ムカデが妖怪になり、夜、人を傷つけると聞きました。道を行き来する旅人は、ひどく不自由しています。ムカデを降せるのは鶏だけだと思いますので、ひときわ大きな雄鶏を千羽選び、山に放って、この毒虫を除いてはいかがでしょう。ついでに山の名も改め、勅書を一通下して、お墨付きをお与えください。それを、この僧が王女を養ってくれた恩へのお礼となさればよいのです。」
      国王は大いに喜び、承知した。すぐ役人を城へやって鶏を取りに行かせ、山の名を宝華山（ほうかさん）へ改めた。さらに工部（こうぶ）に資材を調達して寺を修繕させ、封号を賜って「勅建宝華山給孤布金寺（ちょっけんほうかさんぎっこふきんじ）」と呼ぶことにした。老院主には「報国僧官（ほうこくそうかん）」の位を授け、永久に世襲させることとし、俸禄三十六石（こく）を与えた。僧たちは恩に謝し、国王の帰朝を見送った。
    "translation_status": "reviewed"
  - "id": "xy-ch95-035"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "公主入宮，各各相見。安排筵宴，與公主釋悶賀喜。后妃母子，復聚首團圞。國王君臣亦共喜，飲宴一宵不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 193
        "line_end": 193
        "source_sequence": 35
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "王女が宮中へ入ると、それぞれの者と対面した。宴を整え、王女の憂いを晴らし、祝いを述べる。皇后や妃たち、母子は再び集まって一家の団らんを取り戻した。国王と臣下もともに喜び、一夜、宴を楽しんだ。そのことはさておく。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-036"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次早，國王傳旨，召丹青圖下聖僧四眾喜容，供養在華夷樓上。又請公主新妝重整，出殿謝唐僧四眾救苦之恩。謝畢，唐僧辭王西去。那國王那裡肯放，大設佳宴，一連吃了五六日，著實好了獃子，盡力放開肚量受用。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 195
        "line_end": 195
        "source_sequence": 36
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "翌朝、国王は命令を下し、絵師を呼んで四人の聖僧の喜ばしい顔を描かせ、華夷楼（かいろう）の上に掲げて供養させた。また王女には、改めて身なりを整え、御殿へ出て、三蔵たち四人に苦しみから救ってもらった恩を謝するよう求めた。礼が済むと、三蔵は国王に別れを告げ、西へ旅立とうとした。だが国王が放すはずもない。盛大な宴を設け、五、六日続けてもてなした。これには八戒が大喜びし、思いきり腹を広げ、食べられるかぎりのごちそうを楽しんだ。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-037"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王見他們拜佛心重，苦留不住，遂取金銀二百錠、寶貝各一盤奉謝。師徒們一毫不受。教擺鑾駕，請老師父登輦，差官遠送。那后妃并臣民人等俱各叩謝不盡。及至前途，又見眾僧叩送，俱不忍相別。行者見送者不肯回去，無已，捻訣，往巽地上吹口仙氣，一陣暗風，把送的人都迷了眼目，方才得脫身而去。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 197
        "line_end": 197
        "source_sequence": 37
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "国王は、一行が仏を拝む志の堅いことを知り、いくら懇願しても引き留められないと見ると、金銀の延べ棒二百錠（じょう）と、盆に盛った宝をそれぞれ一盆ずつ取り出し、お礼に差し出した。師弟はわずかなものも受け取らなかった。そこで国王は行列を整えさせ、三蔵に輦へ乗るよう勧め、役人に遠くまで送らせた。皇后、妃、臣下、民たちも、皆、頭を下げて礼を述べ尽くせない。道の先では、さらに僧たちが拝んで見送り、誰も別れを惜しんで離れようとしなかった。悟空は見送りの者が帰ろうとしないのを見て、やむを得ず印を結び、巽（たつみ）の方角へ仙気をひと吹きした。すると一陣の暗い風が起こり、見送りの人々の目を曇らせたので、ようやく一行は抜け出し、去っていくことができた。まさに、こうである。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-038"
    "section_id": "chapter-95"
    "kind": "verse"
    "origin": "source"
    "source_text": "沐淨恩波歸了性，出離金海悟真空。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 199
        "line_end": 199
        "source_sequence": 38
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": |-
      恩の波に洗い清められ、本性へ帰り、
      黄金の海を離れ出て、真の空を悟る。
    "translation_status": "reviewed"
  - "id": "xy-ch95-039"
    "section_id": "chapter-95"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知前路如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch95-1500606"
        "precision": "line"
        "line_start": 201
        "line_end": 201
        "source_sequence": 39
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第095回&oldid=1500606"
    "translation_ja": "さて、この先の道はどうなるのか。それは次回の説き明かしをお聞きいただきたい。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-001-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「真陰」「靈元」は、陰陽や本性の回復を示す修養上の語として読むが、象徴の指示対象を一つに固定しない。底本が併記する「真形／形骸」の異文も見出しの訳に残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-002-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「芰荷楟」。楟は辞書では梨の類をいう木の名だが、菱・蓮との結び付きは明確でない。茎を指す文字の異写とも考えられるが確証はなく、原字を残す。植物の別種や「梗」へ無断で改めない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-003-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "護国天王は西天門を守る役として扱う。龐・劉・苟・畢は姓だけが示される。南天門の同姓天兵や雷部の同姓の神々との同一性は本文で確定しないため、姓名を補わず、別人とも断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-004-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「四相」「五行」「三元」は、仙器の威力を宇宙や修養の調和になぞらえる語。四相は内丹でいう四象との関連が考えられるが、日月星辰など一つの内訳に固定しない。三元にも天地人・精気神などの解釈があり、この詩だけでは一つに絞れない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-005-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「君」はこの詩の語りかけ。文脈では婚姻相手を意識するが、悟空に向けた武器の自慢から声が移るため、訳では特定人物の名へ置き換えず「君」を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-006-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「國王沒正經，愛花引得妖邪喜」は、国王のふまじめさと花好みを原因に挙げる語り手の詩句。直前までの妖怪自身の花好みとは主語が違うが、国王を妖怪へ取り替えて整合させない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-007-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空は「初めに半日戦い、相手は勝てなかった」と報告するが、先の語り手は半日の勝敗が決まらなかったと述べる。報告を改めて一致させない。また、ここでの「現了相」は風の姿を解いて戦ったという報告であり、この時点で本来の種が明示されたとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-008-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「五環」は原字を保つ。劉一明『西遊記百回詳注』は、五行を集める内丹的な象徴として解釈するが、それを底本の唯一の意味と断定しない。具体的な地理や五つの環状物へも確定しない。「福地」は仙人が住むにふさわしい恵まれた土地をいう。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-009-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "太陰星君が述べた一年・十八年前・昨年という時間をそのまま残し、天上と下界の時間を独自換算しない。素娥と王女の同一性、玉兔の恨みや出奔は星君の説明として示す。「姮娥／嫦娥」は一般には同じ月の女神名だが、この場面の「眾仙妹」は複数の仙女を指す。既存の単独の女神や八戒の過去の相手へ、全員をまとめて同定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-010-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「白穰穰」「白鐸鐸」は底本の字を保ち、白さや豊かな毛並みを畳語で強める表現として訳した。「穰」「鐸」を別字へ補訂しない。「直鼻垂酥」の垂れる乳脂も、鼻と白毛の艶を詠む比喩として残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-011-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の散文は二更近く、この詩では三更近くとする。経過時間を補ったり、どちらかの数を直したりせず残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-012-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「明性月」は、心の本性を月になぞらえ、それを明らかにする修養の表現として訳した。単に外の月を眺めていたと置き換えない。三蔵による回想の引用は、以前の老僧自身の説明と表現が異なるところも、そのまま別の語りとして保つ。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-013-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「才知後房裡鎖得是個女子」と、僧たちがこの時に初めて女だと知ったとする原文を残した。前の会話からどこまで知っていたはずかを訳者が補って、認識の時点を変更しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-014-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「報國僧官，永遠世襲」と、僧の官職を永久に世襲させるという原文の表現を残す。僧の世襲の仕組みや対象者は説明されない。三十六石は俸禄の量で、支給周期や現代の重量は本文から補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-015-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本はここを「華夷樓」と呼ぶ。先の宴に出た「永鎮華夷閣／華夷閣」と同じ建物である可能性はあるが、明示されないため、名前を無断統一せず区別して残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-016-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「金銀二百錠、寶貝各一盤」。金と銀それぞれ二百錠とは明記しないため、数を倍にしない。宝の種類や一錠の重量も特定されていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch95-note-017-body"
    "section_id": "chapter-95"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「金海」は字義の黄金の海を残した。富貴の境遇から離れることを含む修養的な比喩として読めるが、実在の海を通過したという出来事へは変えない。"
    "translation_status": "reviewed"

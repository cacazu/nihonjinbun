  - "id": "xy-ch01-014"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他瞑目蹲身，將身一縱，徑跳入瀑布泉中，忽睜睛擡頭觀看，那裡邊卻無水無波，明明朗朗的一架橋梁。他住了身，定了神，仔細再看，原來是座鐵板橋。橋下之水，沖貫於石竅之間，倒掛流出去，遮閉了橋門。卻又欠身上橋頭，再走再看，卻似有人家住處一般，真個好所在。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 14
    "translation_ja": |-
      石猿は目を閉じ、身をかがめると、勢いよく跳び上がって滝の中へ飛び込んだ。ぱっと目を開け、顔を上げると、滝をくぐった先では水や波に遮られず、一本の橋がはっきりと見えた。
      足を止め、気持ちを落ち着けてよく見ると、鉄の板でできた橋だった。橋の下の水が岩の穴を勢いよく通り抜け、外へ垂れ落ちて、橋の入口を隠していたのである。
      石猿は身を起こして橋のたもとへ上がり、歩きながら辺りを見た。まるで人の住まいのようで、実に気持ちのよい所だった。そこには――
    "translation_status": "reviewed"
  - "id": "xy-ch01-015"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "翠蘚堆藍，白雲浮玉，光搖片片煙霞。虛窗靜室，滑凳板生花。乳窟龍珠倚掛，縈迴滿地奇葩。鍋灶傍崖存火跡，樽罍靠案見殽渣。石座石床真可愛，石盆石碗更堪誇。又見那一竿兩竿修竹，三點五點梅花。幾樹青松常帶雨，渾然像個人家。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 15
    "translation_ja": |-
      青々とした苔が藍色を重ね、白雲は白玉のように浮かび、ひとひらごとの霞に光が揺れる。
      窓の開いた静かな部屋。滑らかな腰掛けの板には、花のような模様が浮かぶ。
      鍾乳洞には龍の宝玉のような石が垂れ下がり、珍しい花が地面を埋め、辺りを取り巻く。
      崖ぎわの鍋とかまどには火を使った跡があり、卓のそばには酒器が置かれ、料理の残りも見える。
      石の椅子と寝床は実に心地よさそうで、石のたらいと椀も見事なもの。
      さらに、一、二本のすらりとした竹、三つ五つの梅の花。
      幾本かの青い松はいつも雨をまとい、そっくり人の住む家に見える。
    "translation_status": "reviewed"
  - "id": "xy-ch01-016"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "看罷多時，跳過橋中間，左右觀看。只見正當中有一石碣，碣上有一行楷書大字，鐫著「花果山福地，水簾洞洞天」。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 16
    "translation_ja": |-
      石猿はしばらく眺め、それから橋の真ん中を跳び渡って、左右を見回した。ちょうど中央に石碑が立ち、整った楷書の大文字で一行、こう刻まれていた。
      「花果山は恵み豊かな仙境、水簾洞（すいれんどう）は洞窟に開けた別天地」
    "translation_status": "reviewed"
  - "id": "xy-ch01-017"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "石猿喜不自勝，急抽身往外便走，復瞑目蹲身，跳出水外，打了兩個呵呵道：「大造化！大造化！」眾猴把他圍住，問道：「裡面怎麼樣？水有多深？」石猴道：「沒水！沒水！原來是一座鐵板橋，橋那邊是一座天造地設的家當。」眾猴道：「怎見得是個家當？」石猴笑道：「這股水乃是橋下沖貫石橋，倒掛下來遮閉門戶的。橋邊有花有樹，乃是一座石房。房內有石窩、石灶、石碗、石盆、石床、石凳。中間一塊石碣上，鐫著『花果山福地，水簾洞洞天』。真個是我們安身之處。裡面且是寬闊，容得千百口老小。我們都進去住，也省得受老天之氣。這裡邊："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 17
    "translation_ja": |-
      石猿はうれしくてたまらず、急いで向きを変えて外へ走った。また目を閉じて身をかがめ、滝の外へ跳び出すと、はっはと二声、笑って言った。
      石猿「なんて運がいいんだ！　なんて運がいいんだ！」
      猿たちは周りに集まって尋ねた。
      猿たち「中はどうだった？　水はどれくらい深い？」
      石猿「水なんかない！　水なんかないぞ！　鉄の橋があって、その向こうに、天地がこしらえた住まいがあるんだ」
      猿たち「どうして住まいだと分かるんだ？」
      石猿は笑って答えた。
      石猿「この水は橋の下を通り抜けて、下へ垂れ落ち、入口を隠しているだけなんだ。橋のそばには花も木もあって、そこに石の部屋がある。中には石のくぼみ、石のかまど、石の椀、石のたらい、石の寝床、石の腰掛けがある。真ん中の石碑には、『花果山は恵み豊かな仙境、水簾洞は洞窟に開けた別天地』と彫ってあった。あそこは本当に、俺たちが安心して暮らせる場所だ。広いから、年寄りから子どもまで、何百匹、何千匹でも住める。みんなで中に入って住めば、空の気まぐれに悩まされずに済む。あの中なら――
    "translation_status": "reviewed"
  - "id": "xy-ch01-018"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      刮風有處躲，下雨好存身。
      霜雪全無懼，雷聲永不聞。
      煙霞常照耀，祥瑞每蒸熏。
      松竹年年秀，奇花日日新。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 18
    "translation_ja": |-
      風が吹いても逃げ込む所があり、雨が降っても身を寄せられる。
      霜も雪も恐れることはなく、雷の音さえ聞こえない。
      霞の光は絶えず照り映え、めでたい気がいつも立ちのぼる。
      松も竹も毎年青々と茂り、珍しい花は日ごとに新しく咲くんだ」
    "translation_status": "reviewed"
  - "id": "xy-ch01-019"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾猴聽得，個個歡喜。都道：「你還先走，帶我們進去，進去。」石猴卻又瞑目蹲身，往裡一跳，叫道：「都隨我進來，進來。」那些猴有膽大的，都跳進去了；膽小的，一個個伸頭縮頸，抓耳撓腮，大聲叫喊，纏一會，也都進去了。跳過橋頭，一個個搶盆奪碗，佔灶爭床，搬過來，移過去，正是猴性頑劣，再無一個寧時，只搬得力倦神疲方止。石猿端坐上面道：「列位呵，『人而無信，不知其可。』你們才說有本事進得來，出得去，不傷身體者，就拜他為王。我如今進來又出去，出去又進來，尋了這一個洞天與列位安眠穩睡，各享成家之福，何不拜我為王？」眾猴聽說，即拱伏無違，一個個序齒排班，朝上禮拜，都稱「千歲大王」。自此，石猿高登王位，將「石」字兒隱了，遂稱「美猴王」。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 19
    "translation_ja": |-
      話を聞いた猿たちは、みな大喜びして言った。
      猿たち「それなら、もう一度先に行ってくれ。俺たちを連れていってくれよ！」
      石猿はまた目を閉じてしゃがみ、中へ跳び込むと叫んだ。
      石猿「みんな、俺について入ってこい！　入ってこい！」
      度胸のある猿は、次々と跳び込んだ。臆病な猿は首を突き出しては引っ込め、耳をかいたり頬をひっかいたりして、大声で騒いでいた。それでも、しばらくもめた末には、みな中に入った。
      橋を跳び渡ると、今度は一匹残らず、たらいを取り合い、椀を奪い合い、かまどを占め、寝床を争った。あちらからこちらへ物を運び、こちらからあちらへ動かす。生まれつきいたずら好きな猿のこと、一時も静まらず、心も体もすっかり疲れ果てて、ようやくやめた。
      石猿は高い所にきちんと座って言った。
      石猿「みんな、聞いてくれ。『約束を守らない者とは、どう付き合えばよいか分からない』というじゃないか。さっきお前たちは、けがをせずに中へ入って戻って来られる者を、王にすると言った。俺は中へ入って外へ出て、また中へ入った。しかも、この別天地を見つけて、お前たちが安心してぐっすり眠り、それぞれ住まいを持つ幸せを味わえるようにした。それなのに、なぜ俺を王にしないんだ？」
      猿たちはこの言葉を聞くと、逆らうことなく手を合わせてひれ伏した。年の順に並び、上座に向かって拝礼し、声をそろえて唱えた。
      猿たち「大王、千年の長寿を！」
      こうして石猿は王位に就き、名から「石」の字を引っ込めて、美猴王（びこうおう）――美しき猿の王と名乗るようになった。そのことを詠んだ詩がある。
    "translation_status": "reviewed"
  - "id": "xy-ch01-020"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      三陽交泰產群生，仙石胞含日月精。
      借卵化猴完大道，假他名姓配丹成。
      內觀不識因無相，外合明知作有形。
      歷代人人皆屬此，稱王稱聖任縱橫。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 20
    "translation_ja": |-
      三つの陽の気が満ち、天地が和らいで、さまざまな命が生まれる。霊石の胎には、太陽と月の精気が宿る。
      卵から猿に姿を変えることに、道を全うする営みを託し、その名と姓に、不老長寿の霊薬が成る理を重ねる。
      内に目を向けても、それには形がないので見分けられず、外の姿に照らせば、形を取ったものとしてはっきり分かる。
      いつの時代の人も、みなこの道理の内にある。王と名乗ろうと、聖者と名乗ろうと、思う存分に振る舞うがよい。
    "translation_status": "reviewed"
  - "id": "xy-ch01-021"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "美猴王領一群猿猴、獼猴、馬猴等，分派了君臣佐使。朝遊花果山，暮宿水簾洞，合契同情，不入飛鳥之叢，不從走獸之類，獨自為王，不勝歡樂。是以："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 21
    "translation_ja": |-
      美猴王は、手長の猿や、ふつうの猿、大柄な猿など、さまざまな仲間を率いた。そして、王と臣下、補佐役や使者の役目を決めた。
      朝は花果山で遊び、夕方には水簾洞で眠る。皆の気持ちは通じ合い、鳥の群れにも、地を走る獣の群れにも従わず、自分たちだけの王国をつくって、限りなく楽しく暮らした。その暮らしぶりは――
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "corrected"
        "text": "美猴王領一群猿猴、獼猴、馬猴等，分派了君臣佐使。朝遊花果山，暮宿水簾洞，合契同情，不入飛鳥之叢，不從走獸之類，獨自為王，不勝歡樂。"
        "description_ja": "前稿の転記。段落末の語りの文が欠落していたため、固定版原文に照合してsource_textに復元した。原典の異文ではない。"
  - "id": "xy-ch01-022"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      春採百花為飲食，夏尋諸果作生涯。
      秋收芋栗延時節，冬覓黃精度歲華。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 22
    "translation_ja": |-
      春にはさまざまな花を摘んで食べ、夏にはいろいろな果物を探して暮らす。
      秋には芋と栗を集めて季節をしのぎ、冬にはナルコユリの仲間の地下茎を掘って、一年を過ごす。
    "translation_status": "reviewed"
  - "id": "xy-ch01-023"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "美猴王享樂天真，何期有三五百載。一日，與群猴喜宴之間，忽然憂惱，墮下淚來。眾猴慌忙羅拜道：「大王何為煩惱？」猴王道：「我雖在歡喜之時，卻有一點兒遠慮，故此煩惱。」眾猴又笑道：「大王好不知足。我等日日歡會，在仙山福地，古洞神洲，不伏麒麟轄，不伏鳳凰管，又不伏人間王位所拘束，自由自在，乃無量之福，為何遠慮而憂也？」猴王道：「今日雖不歸人王法律，不懼禽獸威嚴，將來年老血衰，暗中有閻王老子管著，一旦身亡，可不枉生世界之中，不得久注天人之內？」眾猴聞此言，一個個掩面悲啼，俱以無常為慮。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 23
    "translation_ja": |-
      美猴王が、生まれつきののびやかな心のままに楽しんでいるうちに、いつしか三百年、五百年という歳月が過ぎていた。
      ある日、仲間たちとにぎやかに宴を楽しんでいたとき、美猴王は不意に思い悩み、涙を流した。猿たちは慌てて周りにひれ伏し、尋ねた。
      猿たち「大王、何をお悩みなのですか？」
      美猴王「今は楽しい盛りだ。だが、先のことを考えると、一つ気がかりがある。それで悲しくなったんだ」
      猿たちはまた笑い出した。
      猿たち「大王は、なんと満ち足りることをご存じないのでしょう。私たちは毎日、この恵まれた仙境の山、神々の大陸にある古い洞窟で、楽しく集まって暮らしています。麒麟にも鳳凰にも従わず、人間の王にも縛られず、自由気まま。これほどの幸せがほかにあるでしょうか。なぜ先のことで思い悩まれるのです？」
      美猴王「今は人間の王の法律に縛られず、鳥や獣の威勢も恐れずに済む。だが、いつか年を取り、血の勢いが衰えれば、見えない所で閻魔大王（えんまだいおう）が支配しているのだ。一度死んじまえば、天界にも人の世にも長くいられない。せっかくこの世界に生まれてきたのに、むだになっちまうじゃないか」
      これを聞くと、猿たちは一匹一匹、顔を覆って悲しく泣き、いつか命が尽きることを思って、みな不安になった。
    "translation_status": "reviewed"
  - "id": "xy-ch01-024"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "只見那班部中，忽跳出一個通背猿猴，厲聲高叫道：「大王若是這般遠慮，真所謂道心開發也。如今五蟲之內，惟有三等名色不伏閻王老子所管。」猴王道：「你知那三等人？」猿猴道：「乃是佛與仙與神聖三者，躲過輪迴，不生不滅，與天地山川齊壽。」猴王道：「此三者居於何所？」猿猴道：「他只在閻浮世界之中，古洞仙山之內。」猴王聞之，滿心歡喜道：「我明日就辭汝等下山，雲遊海角，遠涉天涯，務必訪此三者，學一個不老長生，常躲過閻君之難。」噫！這句話，頓教跳出輪迴網，致使齊天大聖成。眾猴鼓掌稱揚，都道：「善哉，善哉！我等明日越嶺登山，廣尋些果品，大設筵宴送大王也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 24
    "translation_ja": |-
      そのとき、並んだ猿の中から、長い腕を持つ猿が一匹、跳び出し、よく通る声で叫んだ。
      長腕の猿（ちょうわんのさる）「大王がそこまで先をお考えになるとは、まさに、道を求める心が目覚めたということです。この世の生き物は五つの種類に分けられますが、その中に、閻魔大王の支配を受けない者が三通りだけおります」
      美猴王は尋ねた。
      美猴王「その三通りとは、どんな者だ？」
      長腕の猿「仏、仙人、そして神々です。生まれ変わりを繰り返す輪廻から抜け出し、生まれることも滅びることもなく、天地や山川と同じだけ長く生きます」
      美猴王「その者たちは、どこに住んでいる？」
      長腕の猿「この人間の世界の、古い洞窟や仙人の山におります」
      美猴王はこれを聞くと、心から喜んで言った。
      美猴王「明日、お前たちに別れを告げて山を下りよう。海の果てまでさまよい、空の果てまで遠く旅をして、必ずその三通りの者を訪ねてみせる。不老長寿の術を学んで、閻魔（えんま）に命を取られる災いから、いつまでも逃れてやる」
      ああ、この一言こそが、やがて輪廻の網を跳び出させ、天にも等しい大聖者――斉天大聖（せいてんたいせい）を生むのである。
      猿たちは手をたたいて褒めたたえた。
      猿たち「ご立派です、ご立派です！　明日は峰を越え、山を登り、果物をたくさん探してまいります。そして盛大な宴を開き、大王をお送りしましょう」
    "translation_status": "reviewed"
  - "id": "xy-ch01-025"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，眾猴果去採仙桃，摘異果，刨山藥，斸黃精。芝蘭香蕙，瑤草奇花，般般件件，整整齊齊，擺開石凳石桌，排列仙酒仙餚。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 25
    "translation_ja": "翌日、猿たちは言ったとおり、仙人の桃や珍しい果物を摘み、山芋やナルコユリの仲間の地下茎を掘った。レイシやラン、香りのよい草、宝のような草や珍しい花まで、品々をきちんと取りそろえた。石の腰掛けと卓を並べ、仙人の酒とごちそうを広げた。その様子は、こんな具合である。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-026"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "金丸珠彈，紅綻黃肥。金丸珠彈臘櫻桃，色真甘美；紅綻黃肥熟梅子，味果香酸。鮮龍眼，肉甜皮薄；火荔枝，核小囊紅。林檎碧實連枝獻，枇杷緗苞帶葉擎。兔頭梨子雞心棗，消渴除煩更解酲。香桃爛杏，美甘甘似玉液瓊漿；脆李楊梅，酸蔭蔭如脂酥膏酪。紅囊黑子熟西瓜，四瓣黃皮大柿子。石榴裂破，丹砂粒現火晶珠；芋栗剖開，堅硬肉團金瑪瑙。胡桃銀杏可傳茶，椰子葡萄能做酒。榛松榧柰滿盤盛，橘蔗柑橙盈案擺。熟煨山藥，爛煮黃精。搗碎茯苓並薏苡，石鍋微火漫炊羹。人間縱有珍饈味，怎比山猴樂更寧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 26
    "translation_ja": |-
      金の玉、真珠の粒のような実。赤く色づき、黄色くふっくらと熟れた果物。
      金の玉や真珠に似た、黄色い実のサクランボは、色も美しく、甘さも格別。
      赤く色づき、黄色くふっくらと熟した梅は、香り高く、よい酸味がある。
      採れたてのリュウガンは皮が薄く、果肉が甘い。燃えるように赤いライチは、種が小さく、実を包む殻が赤い。
      青い小リンゴは枝ごと差し出され、淡い黄色のビワは葉をつけたまま捧げられる。
      兎の頭の形をしたナシと、鶏の心臓の形をしたナツメは、のどの渇きと胸のむかつきを鎮め、酔いも覚ます。
      香りのよいモモと、とろけるほど熟れたアンズは、仙人の妙なる酒のように甘い。
      歯ざわりのよいスモモとヤマモモは、乳の脂や、乳を固めて作る食べ物を思わせる、こっくりとした心地よい酸味。
      赤い果肉に黒い種の熟れたスイカ。四つに分かれた形の、黄色い皮の大きなカキ。
      ザクロが割れれば、朱色の粒が、火のように輝く宝玉となって現れる。
      芋やクリを割れば、堅い中身は、黄金色のめのうの塊のよう。
      クルミとギンナンは茶請けになり、ヤシの実とブドウは酒になる。
      ハシバミの実、松の実、カヤの実、リンゴを、皿いっぱいに盛り上げる。
      タチバナ、サトウキビ、ミカン、ダイダイを、卓いっぱいに並べる。
      山芋は埋み火（うずみび）でじっくり焼き、ナルコユリの仲間の地下茎は柔らかく煮込む。
      松の根もとにできるマツホドというキノコの塊と、ハトムギの実をつき砕き、石鍋を弱火にかけて、とろりとした汁に炊き上げる。
      人の世にどんな珍味があろうとも、この山の猿たちの、楽しく心安らかな暮らしに、どうして及ぶだろう。
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "open"
        "message_ja": "カキの四瓣が指す具体的な部位には解釈上の留保がある。本文は四つに分かれた形と訳し、訳注で説明した。本文・訳文の欠落ではない。"
        "source_span":
          "start": 122
          "end": 129
          "exact": "四瓣黃皮大柿子"
  - "id": "xy-ch01-027"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "群猴尊美猴王上坐，各依齒肩排於下邊，一個個輪流上前奉酒、奉花、奉果，痛飲了一日。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 27
    "translation_ja": "猿たちは美猴王を上座に迎え、年の順に、その下へ並んだ。一匹ずつ代わる代わる進み出て、酒を捧げ、花を捧げ、果物を捧げた。そして丸一日、思う存分に飲み明かした。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-028"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次日，美猴王早起，教：「小的們，替我折些枯松，編作栰子，取個竹竿作篙，收拾些果品之類，我將去也。」果獨自登栰，儘力撐開，飄飄蕩蕩，徑向大海波中，趁天風，來渡南贍部洲地界。這一去，正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 28
    "translation_ja": |-
      翌朝、美猴王は早く起き、こう命じた。
      美猴王「お前たち、枯れた松の木を折って、いかだに組んでくれ。竹を一本、さおにして、果物なども用意してくれ。俺は出かけるぞ」
      こうして一人でいかだに乗り、力いっぱいさおを突いて岸を離れた。ゆらりゆらりと大海の波間に出て、空からの風に乗り、南贍部洲の地を目指して渡っていった。この旅立ちは、まさしく――
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "corrected"
        "text": "次日，美猴王早起，教：「小的們，替我折些枯松，編作栰子，取個竹竿作篙，收拾些果品之類，我將去也。」果獨自登栰，儘力撐開，飄飄蕩蕩，徑向大海波中，趁天風，來渡南贍部洲地界。"
        "description_ja": "前稿の転記。段落末の語りの文が欠落していたため、固定版原文に照合してsource_textに復元した。原典の異文ではない。"
  - "id": "xy-ch01-029"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      天產仙猴道行隆，離山駕栰趁天風。
      飄洋過海尋仙道，立志潛心建大功。
      有分有緣休俗願，無憂無慮會元龍。
      料應必遇知音者，說破源流萬法通。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 29
    "translation_ja": |-
      天が生み出した、道を修める大きな力を秘めた猿は、山を離れ、いかだに乗って、空からの風を受ける。
      大海を渡って仙人の道を探し、志を立てて一心に励み、大いなる修行の成果を得ようとする。
      巡り合わせと縁を得て、俗世への願いを捨て、憂いも悩みもなく、道を極めた境地に達する。
      きっと心を知ってくれる者に出会い、物事の根源を説き明かされて、あらゆる教えに通じるであろう。
    "translation_status": "reviewed"
  - "id": "xy-ch01-030"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "也是他運至時來，自登木栰之後，連日東南風緊，將他送到西北岸前，乃是南贍部洲地界。持篙試水，偶得淺水，棄了栰子，跳上岸來。只見海邊有人捕魚、打雁、穵蛤、淘鹽。他走近前，弄個把戲，妝個\U0002192B虎，嚇得那些人丟筐棄網，四散奔跑。將那跑不動的拿住一個，剝了他的衣裳，也學人穿在身上。搖搖擺擺，穿州過府，在市廛中學人禮，學人話。朝餐夜宿，一心裡訪問佛、仙、神聖之道，覓個長生不老之方。見世人都是為名為利之徒，更無一個為身命者。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 30
    "translation_ja": |-
      ちょうど運の向く時が来ていたのだ。木のいかだに乗ってから、何日も強い東南の風が吹き続け、美猴王を西北の岸まで送り届けた。そこが南贍部洲だった。
      さおを差して水深を探っていると、浅瀬に行き当たった。そこでいかだを捨て、岸へ跳び上がった。浜辺には、魚を捕る者、ガンを狩る者、ハマグリを掘る者、塩を採る者がいた。
      美猴王は近寄ると、ひとついたずらを仕掛けた。恐ろしい顔をつくって脅かしたのである。人々は籠も網も投げ捨て、四方へ逃げ散った。美猴王は逃げきれなかった一人を捕まえ、着物をはぎ取ると、人間のまねをして着込んだ。
      それから、体を揺すりながらあちこちの土地や町を巡り、市場では人間の礼儀作法と言葉を学んだ。朝には食事を取り、夜には宿を求め、ひたすら仏、仙人、神々の道を尋ね、不老長寿の方法を探した。
      だが、世間の人は名誉や利益ばかりを求め、自分の命そのものを真剣に考える者は一人もいなかった。まさしく、次の詩のとおりである。
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "corrected"
        "text": "也是他運至時來，自登木栰之後，連日東南風緊，將他送到西北岸前，乃是南贍部洲地界。持篙試水，偶得淺水，棄了栰子，跳上岸來。只見海邊有人捕魚、打雁、穵蛤、淘鹽。他走近前，弄個把戲，妝個\U0002192B虎，嚇得那些人丟筐棄網，四散奔跑。將那跑不動的拿住一個，剝了他的衣裳，也學人穿在身上。搖搖擺擺，穿州過府，在市廛中學人禮，學人話。朝餐夜宿，一心裡訪問佛、仙、神聖之道，覓個長生不老之方。見世人都是為名為利之徒，更無一個為身命者。"
        "description_ja": "前稿の転記。段落末の語りの文が欠落していたため、固定版原文に照合してsource_textに復元した。原典の異文ではない。"
  - "id": "xy-ch01-031"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      爭名奪利幾時休？早起遲眠不自由！
      騎著驢騾思駿馬，官居宰相望王侯。
      只愁衣食耽勞碌，何怕閻君就取勾。
      繼子蔭孫圖富貴，更無一個肯回頭。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 31
    "translation_ja": |-
      名誉を争い、利益を奪い合うのは、いつになればやむのだろう。朝早く起き、夜遅く寝て、自由などありはしない。
      ロバやラバに乗れば駿馬を欲しがり、宰相になれば王や諸侯になりたがる。
      衣食の心配ばかりして、あくせく働き、閻魔が今にも命を取り立てに来ることは、少しも恐れない。
      子や孫に富と高い身分を残そうと計り、誰一人として立ち止まって、己の生き方を振り返ろうとしない。
    "translation_status": "reviewed"
  - "id": "xy-ch01-032"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "猴王參訪仙道，無緣得遇。在於南贍部洲，串長城，遊小縣，不覺八九年餘。忽行至西洋大海，他想著海外必有神仙。獨自個依前作栰，又飄過西海，直至西牛賀洲地界。登岸遍訪多時，忽見一座高山秀麗，林麓幽深。他也不怕狼蟲，不懼虎豹，登在山頂上觀看。果是好山："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 32
    "translation_ja": |-
      美猴王は仙人の道を求めて訪ね歩いたが、出会う縁がなかった。南贍部洲の大きな町を巡り、小さな町を訪ねるうち、いつの間にか八、九年あまりが過ぎた。
      やがて西の大海に行き着くと、海の向こうにはきっと仙人がいるはずだと思った。そこで前と同じように、一人でいかだを作り、再び西の海を漂い渡って、西牛賀洲へたどり着いた。
      上陸して長いあいだ方々を訪ね歩くうちに、美しく高い山を見つけた。麓には深く静かな森が広がっている。美猴王は狼などの獣も恐れず、虎や豹にもひるまず、頂まで登って見渡した。実に見事な山だった。
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "corrected"
        "text": "猴王參訪仙道，無緣得遇。在於南贍部洲，串長城，遊小縣，不覺八九年餘。忽行至西洋大海，他想著海外必有神仙。獨自個依前作栰，又飄過西海，直至西牛賀洲地界。登岸遍訪多時，忽見一座高山秀麗，林麓幽深。他也不怕狼蟲，不懼虎豹，登在山頂上觀看。"
        "description_ja": "前稿の転記。段落末の語りの文が欠落していたため、固定版原文に照合してsource_textに復元した。原典の異文ではない。"
  - "id": "xy-ch01-033"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "千峰排戟，萬仞開屏。日映嵐光輕鎖翠，雨收黛色冷含青。瘦籐纏老樹，古渡界幽程。奇花瑞草，修竹喬松。修竹喬松，萬載常青欺福地；奇花瑞草，四時不謝賽蓬瀛。幽鳥啼聲近，源泉響溜清。重重谷壑芝蘭繞，處處巉崖苔蘚生。起伏巒頭龍脈好，必有高人隱姓名。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 33
    "translation_ja": |-
      幾千もの峰が、刃をつけたほこを並べたように立ち、果てしなく高い岩壁が、屏風のように広がる。
      日が差すと、山の霞が緑を薄く包み、雨がやむと、山の藍色にひんやりとした青さが宿る。
      細いつるが老木に巻きつき、古い渡し場の先には、奥深い道が延びている。
      珍しい花と、めでたい草。すらりと伸びた竹と、高々とそびえる松。
      竹と松は一万年を経ても青々と茂り、恵まれた仙境にも勝る。花や草は四季を通じて枯れず、仙人の島、蓬莱（ほうらい）や瀛洲（えいしゅう）にも引けを取らない。
      奥深い森にすむ鳥の声が近く聞こえ、湧き出る泉の流れる音は澄んでいる。
      幾重にも重なる谷にはレイシやランが生い茂り、険しい岩壁には至る所、苔が生える。
      起伏する峰々には、龍にたとえられるよい地の力が通っている。きっと、道を極めた人が名を隠して住んでいるのだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch01-034"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正觀看間，忽聞得林深之處有人言語。急忙趨步，穿入林中，側耳而聽，原來是歌唱之聲。歌曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 34
    "translation_ja": "眺めていると、林の奥から、ふと人の声が聞こえた。美猴王は急いで木立の中へ入り、耳を澄ませた。聞こえてきたのは歌声だった。その歌は、こういうものである。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-035"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「觀棋柯爛，伐木丁丁，雲邊谷口徐行。賣薪沽酒，狂笑自陶情。蒼逕秋高對月，枕松根、一覺天明。認舊林，登崖過嶺，持斧斷枯籐。
      收來成一擔，行歌市上，易米三升。更無些子爭競，時價平平。不會機謀巧算，沒榮辱、恬淡延生。相逢處，非仙即道，靜坐講《黃庭》。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 35
    "translation_ja": |-
      木こり「碁に見とれているうちに、斧の柄は朽ち果てる。木を切る音は、こつん、こつん。雲のかかる谷の入り口を、ゆっくりと歩いていく。
      薪を売って酒を買い、大笑いして、心のままに楽しむ。草木の茂る小道で、澄み渡る秋空の月を眺め、松の根を枕に眠れば、ひと眠りで夜が明ける。なじみの林を目指し、崖を登り、峰を越え、斧を振るって枯れたつるを切る。
      集めた薪を一荷（いっか）にまとめ、歌いながら市場へ出て、三升（しょう）の米と取り換える。競り合う気など少しもなく、値段は穏やかに、相場のまま。
      人を出し抜く知恵も、巧みな駆け引きも知らない。誉れも恥も気にせず、心静かに命を養う。出会う相手は仙人か道士ばかり。静かに座り、道教の経典『黄庭経（こうていきょう）』を語り合う」
    "translation_status": "reviewed"
  - "id": "xy-ch01-036"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "美猴王聽得此言，滿心歡喜道：「神仙原來藏在這裡！」即忙跳入裡面，仔細再看，乃是一個樵子，在那裡舉斧砍柴。但看他打扮非常："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 36
    "translation_ja": |-
      美猴王はこの歌を聞くと、うれしさで胸がいっぱいになった。
      美猴王「仙人は、こんな所に隠れていたのか！」
      すぐに木立の奥へ跳び込み、よく見ると、斧を振り上げて薪を切っている一人の木こりだった。その身なりは、なかなか目を引いた。
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "corrected"
        "text": "美猴王聽得此言，滿心歡喜道：「神仙原來藏在這裡！」即忙跳入裡面，仔細再看，乃是一個樵子，在那裡舉斧砍柴。"
        "description_ja": "前稿の転記。段落末の語りの文が欠落していたため、固定版原文に照合してsource_textに復元した。原典の異文ではない。"
  - "id": "xy-ch01-037"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "頭上戴箬笠，乃是新筍初脫之籜。身上穿布衣，乃是木綿撚就之紗。腰間繫環絛，乃是老蠶口吐之絲。足下踏草履，乃是枯莎槎就之爽。手執衠鋼斧，擔挽火麻繩。扳松劈枯樹，爭似此樵能。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 37
    "translation_ja": |-
      頭にかぶった竹笠は、若いタケノコが脱ぎ捨てたばかりの皮で編んだもの。
      身に着けた布の衣は、綿をより合わせて作った糸で織ったもの。
      腰に巻いた組みひもは、十分に育った蚕が口から吐いた糸で編んだもの。
      足に履いた草履は、枯れたスゲをより合わせた、軽やかな履物。
      手にはよく鍛えた鋼の斧を握り、荷をまとめるのは麻の縄。
      松の枝を引き寄せ、枯れ木を割る。その腕前で、この木こりにかなう者がいようか。
    "translation_status": "reviewed"
  - "id": "xy-ch01-038"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "猴王近前叫道：「老神仙，弟子起手。」那樵漢慌忙丟了斧，轉身答禮道：「不當人，不當人。我拙漢衣食不全，怎敢當『神仙』二字？」猴王道：「你不是神仙，如何說出神仙的話來？」樵夫道：「我說甚麼神仙話？」猴王道：「我才來至林邊，只聽的你說：『相逢處，非仙即道，靜坐講《黃庭》。』《黃庭》乃道德真言，非神仙而何？」樵夫笑道：「實不瞞你說，這個詞名做《滿庭芳》，乃一神仙教我的。那神仙與我舍下相鄰，他見我家事勞苦，日常煩惱，教我遇煩惱時，即把這詞兒念念，一則散心，二則解困。我才有些不足處思慮，故此念念，不期被你聽了。」猴王道：「你家既與神仙相鄰，何不從他修行？學得個不老之方，卻不是好？」樵夫道：「我一生命苦：自幼蒙父母養育至八九歲，才知人事，不幸父喪，母親居孀。再無兄弟姊妹，只我一人，沒奈何，早晚侍奉。如今母老，一發不敢拋離。卻又田園荒蕪，衣食不足，只得斫兩束柴薪，挑向市廛之間，貨幾文錢，糴幾升米，自炊自造，安排些茶飯，供養老母。所以不能修行。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 38
    "translation_ja": |-
      美猴王は近づいて呼びかけた。
      美猴王「仙人さま、どうかご挨拶をさせてください」
      木こりはあわてて斧を放し、振り向いて礼を返した。
      木こり「とんでもない、とんでもない。私は食べる物にも着る物にも事欠く、つまらない男です。仙人などと呼んでいただける者ではありません」
      美猴王「仙人でないなら、なぜ仙人の言葉を口にしていたのですか」
      木こり「私が、どんな仙人の言葉を言いましたか」
      美猴王「先ほど林のそばへ来たとき、こうおっしゃるのが聞こえました。『出会う相手は仙人か道士ばかり。静かに座り、黄庭経を語り合う』と。『黄庭経』といえば、道の真理を説く経典です。仙人でなくて、何だというのです」
      木こりは笑った。
      木こり「正直にお話ししましょう。あれは『満庭芳（まんていほう）』という曲に合わせた歌で、一人の仙人から教わったのです。その方は、私の家の近くに住んでおられます。私が暮らしに追われて、毎日くよくよしているのをご覧になり、悩み事があるときは、この歌を唱えるようにと教えてくださいました。そうすれば気が晴れ、苦しさも和らぐと。先ほども、暮らしの足りない物のことなどを考えていたので、歌っていたのです。あなたがお聞きになるとは思いませんでした」
      美猴王「仙人がお近くに住んでいらっしゃるのなら、どうしてその方に従って修行しないのです。不老の方法を習えば、よいではありませんか」
      木こり「私の一生は、苦労の連続なのです。幼いころは両親に育ててもらいましたが、八、九歳になって、ようやく物心がついたころ、不幸にも父が亡くなり、母は夫を失いました。兄弟も姉妹もなく、子は私一人です。ほかに頼れる者もなく、朝晩、母の世話をしなければなりませんでした。今では母も年を取り、いっそう置いてはいけません。そのうえ田畑は荒れ、衣食も足りません。仕方なく薪を二束ばかり切って町へ担いでいき、何文（もん）かの銭に換え、米を何升か買って帰ります。自分で煮炊きし、お茶や食事を用意して、老いた母を養っているのです。ですから、修行はできないのです」
    "translation_status": "reviewed"
  - "id": "xy-ch01-039"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "猴王道：「據你說起來，乃是一個行孝的君子，向後必有好處。但望你指與我那神仙住處，卻好拜訪去也。」樵夫道：「不遠，不遠。此山叫做靈臺方寸山，山中有座斜月三星洞，那洞中有一個神仙，稱名須菩提祖師。那祖師出去的徒弟，也不計其數，見今還有三四十人從他修行。你順那條小路兒，向南行七八里遠近，即是他家了。」猴王用手扯住樵夫道：「老兄，你便同我去去，若還得了好處，決不忘你指引之恩。」樵夫道：「你這漢子甚不通變，我方才這般與你說了，你還不省？假若我與你去了，卻不誤了我的生意？老母何人奉養？我要斫柴，你自去，自去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 39
    "translation_ja": |-
      美猴王「お話を聞けば、あなたは親孝行を尽くす、立派な方です。きっと先々、よい報いがあるでしょう。どうか、その仙人のお住まいを教えてください。訪ねていきたいのです」
      木こり「遠くありませんよ、遠くありません。この山は霊台方寸山（れいだいほうすんざん）といい、山中には斜月三星洞（しゃげつさんせいどう）という洞窟があります。その洞窟に、須菩提祖師（すぼだいそし）と呼ばれる仙人がお住まいです。すでに門下を巣立った弟子は数えきれず、今でも三、四十人が教えを受けて修行しています。あの小道を南へ七、八里（り）ほど行けば、そのお住まいです」
      美猴王は木こりをつかまえて引き留めた。
      美猴王「あなたも一緒に来てくれませんか。よい教えを授かれたら、案内してくださったご恩は、決して忘れません」
      木こり「あんたは、なんとも話の分からない人だ。さっき、あれだけ説明したのに、まだ分からないのか。あんたについていったら、仕事ができなくなるだろう。年老いた母を、誰が養うんだ。私は薪を切らなくてはいけない。一人で行ってくれ、一人で」
    "translation_status": "reviewed"
  - "id": "xy-ch01-040"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "猴王聽說，只得相辭。出深林，找上路徑，過一山坡，約有七八里遠，果然望見一座洞府。挺身觀看，真好去處！但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 40
    "translation_ja": |-
      そう言われて、美猴王はあきらめ、別れを告げた。深い林を抜け、小道を見つけて、山の斜面を一つ越えた。七、八里ほど進むと、果たして洞窟の住まいが見えてきた。
      背を伸ばして眺めると、実にすばらしい所だった。その景色は、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch01-041"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "煙霞散彩，日月搖光。千株老柏，萬節修篁。千株老柏，帶雨半空青冉冉；萬節修篁，含煙一壑色蒼蒼。門外奇花佈錦，橋邊瑤草噴香。石崖突兀青苔潤，懸壁高張翠蘚長。時聞仙鶴唳，每見鳳凰翔。仙鶴唳時，聲振九皋霄漢遠；鳳凰翔起，翎毛五色彩雲光。玄猿白鹿隨隱見，金獅玉象任行藏。細觀靈福地，真個賽天堂。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 41
    "translation_ja": |-
      霞はあでやかな色を広げ、日と月は光を揺らす。
      ヒノキの仲間の老木が幾千本も並び、すらりとした竹は、数えきれないほどの節を重ねる。
      老木は雨を帯びて、空高く青々と茂り、長い竹はもやを含んで、谷一面を深い緑に染める。
      門の外では珍しい花が錦のように咲き広がり、橋のたもとでは美しい草が香りを放つ。
      突き出した岩の崖には、青い苔がしっとりと生え、高く切り立つ岩壁にも、緑の苔が長く伸びる。
      折々、仙境の鶴が鳴く声が聞こえ、しばしば鳳凰が飛ぶ姿が見える。
      鶴が鳴けば、その声は幾重もの沢を越え、はるかな大空まで響く。鳳凰が舞い上がれば、五色の羽が、色とりどりの雲のように輝く。
      黒い猿と白い鹿が、思い思いに姿を見せ、また隠れる。金色の獅子と、玉のような象も、気の向くままに行き来する。
      霊気に満ちた、この恵まれた土地をつぶさに眺めれば、まことに天上の楽園にも勝っている。
    "translation_status": "reviewed"
  - "id": "xy-ch01-042"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又見那洞門緊閉，靜悄悄杳無人跡。忽回頭，見崖頭立一石碑，約有三丈餘高，八尺餘闊，上有一行十個大字，乃是「靈臺方寸山，斜月三星洞」。美猴王十分歡喜道：「此間人果是樸實，果有此山此洞。」看夠多時，不敢敲門。且去跳上松枝梢頭，摘松子吃了頑耍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 42
    "translation_ja": |-
      ところが、洞窟の門は固く閉じられ、あたりは静まり返って、人の気配がなかった。ふと振り向くと、崖の上に、高さ三丈あまり、幅八尺あまりの石碑が立っていた。一列に十字の大きな文字が刻んである。
      「霊台方寸山　斜月三星洞」
      美猴王は、たいそう喜んだ。
      美猴王「ここの人は本当に正直だ。教えてくれた山も、洞窟も、ちゃんとある」
      長いこと眺めていたが、門をたたく勇気が出なかった。そこで松の梢へ跳び上がり、松の実を摘んで食べながら、遊んでいた。
    "translation_status": "reviewed"
  - "id": "xy-ch01-043"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃間，只聽得呀的一聲，洞門開處，裡面走出一個仙童，真個丰姿英偉，像貌清奇，比尋常俗子不同。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 43
    "translation_ja": "しばらくすると、ぎいっと音がして、洞窟の門が開いた。中から出てきたのは、仙人に仕える一人の童子だった。姿はりりしく、顔立ちは清らかで、俗世の子供とはまるで違っていた。その様子を述べるなら――"
    "translation_status": "reviewed"
  - "id": "xy-ch01-044"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      髽髻雙絲綰，寬袍兩袖風。
      貌和身自別，心與相俱空。
      物外長年客，山中永壽童。
      一塵全不染，甲子任翻騰。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 44
    "translation_ja": |-
      結い上げた髪は二筋のひもで留め、ゆったりした衣の両袖には風が通う。
      顔は穏やかだが、その身には人並みでないものがある。心にも姿にも、執着の影がない。
      俗世を離れて長い年月を生き、山の中で永遠の命を保つ童子。
      俗世の塵には少しも染まらず、歳月がどれほど巡ろうと、意に介さない。
    "translation_status": "reviewed"
  - "id": "xy-ch01-045"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那童子出得門來，高叫道：「甚麼人在此搔擾？」猴王撲的跳下樹來，上前躬身道：「仙童，我是個訪道學仙之弟子，更不敢在此搔擾。」仙童笑道：「你是個訪道的麼？」猴王道：「是。」童子道：「我家師父正才下榻，登壇講道，還未說出原由，就教我出來開門。說：『外面有個修行的來了，可去接待接待。』想必就是你了？」猴王笑道：「是我，是我。」童子道：「你跟我進來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 45
    "translation_ja": |-
      童子は門の外へ出ると、大声で呼びかけた。
      童子「誰だ。ここで騒いでいるのは」
      美猴王は木からぱっと跳び下り、進み出て、身をかがめた。
      美猴王「童子さま、私は道を求め、仙人の教えを学びたくて参りました。騒ごうなどとは思っておりません」
      童子は笑った。
      童子「道を求めて来たのか」
      美猴王「はい」
      童子「お師匠さまは、つい今しがた寝台を下り、教えを説こうと壇に上がられた。ところが、まだ話を始めないうちに、私に門を開けるようお命じになったのだ。『外に修行を志す者が来ている。迎えてやりなさい』とね。それは、きっとお前のことだろう」
      美猴王は笑って答えた。
      美猴王「私です、私です」
      童子「では、ついておいで」
    "translation_status": "reviewed"
  - "id": "xy-ch01-046"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這猴王整衣端肅，隨童子徑入洞天深處觀看：一層層深閣瓊樓，一進進珠宮貝闕，說不盡那靜室幽居。直至瑤臺之下，見那菩提祖師端坐在臺上，兩邊有三十個小仙侍立臺下。果然是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 46
    "translation_ja": |-
      美猴王は衣服を整え、姿勢を正し、童子に従って、洞窟の奥に開けた仙境へ入った。見渡せば、玉で飾られた奥深い楼閣が幾重にもそびえ、さらに奥へ進むたびに、真珠や貝で飾られた宮殿と門が続いている。静かな部屋や、奥まった住まいの数々は、とても語り尽くせない。
      やがて玉で飾られた壇の下まで進むと、須菩提祖師が壇上に姿勢を正して座っていた。壇の下では、三十人の若い仙人が左右に分かれて立ち、控えていた。まさしく、次の詩のとおりである。
    "translation_status": "reviewed"
  - "id": "xy-ch01-047"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      大覺金仙沒垢姿，西方妙相祖菩提。
      不生不滅三三行，全氣全神萬萬慈。
      空寂自然隨變化，真如本性任為之。
      與天同壽莊嚴體，歷劫明心大法師。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 47
    "translation_ja": |-
      大いなる悟りを開いた、尊い仙人。その姿に汚れはない。西方の聖なる姿を備えるのは、須菩提祖師。
      九重の修行を成し遂げ、生まれることも滅びることもない境地にあり、生命の気も精神も完全に保ち、その慈しみは果てしない。
      執着を離れた静けさのうちに、自然のまま、あらゆる変化に応じる。真実そのものの本性に従い、自在に振る舞う。
      天と等しい寿命を持つ、気高く厳かな姿。果てしない時代を経て、己の心を明らかにした、偉大な師。
    "translation_status": "reviewed"
    "issues":
      - "kind": "uncertain_translation"
        "status": "open"

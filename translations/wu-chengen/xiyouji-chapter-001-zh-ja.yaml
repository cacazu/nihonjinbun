  - "id": "xy-ch01-note-food-names"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "マツホドはキノコの一種で、ここで食材として挙がるのは、松の根に関連してできる菌糸の塊、すなわち菌核である。松の根そのものではなく、傘を開いた通常のキノコの姿とも異なる。本文では形が伝わるよう「松の根もとにできるマツホドというキノコの塊」とした。ハトムギは料理の文脈なので「ハトムギの実」と訳した。ここは古典小説の食物描写であり、採取・調理・服用を勧める記述ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-yellow-cherry"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "黄色い実のサクランボと訳した。范成大『呉郡志』巻三十には、実がほのかに黄色く、蠟櫻と呼ばれるサクランボが記される。本章の表記は「臘櫻桃」だが、金の玉にたとえる色の描写とも合わせ、この黄色いサクランボを指すと解した。乾燥したサクランボや、ユスラウメとする根拠は採っていない。現代の特定品種名までは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-plant-identification"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ナルコユリの仲間の地下茎、という訳では、古い中国の植物名を、日本にある単一の植物種へ機械的に置き換えていない。中国の生薬の基原には複数の近縁種があり、本章だけから種は特定できない。また、本文のヒノキの仲間は中国語の柏という針葉樹の呼び名に対応し、日本語のカシワという広葉樹とは区別した。古い果物名や柑橘名も現代の品種・分類と一対一には対応しないため、訳は一般的な呼び名にとどめる。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-persimmon"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "カキの「四つに分かれた形」は、原文の四瓣という形の表現を残した訳である。果実の形や、四つに分かれたへたを表す可能性があり、この句だけでは部位まで確定しない。前稿の「皮が四つに割れた」という訳は、原文にない皮の裂け目を断定していたため改めた。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-animals-and-play"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "手長の猿、ふつうの猿、大柄な猿という呼び分けは、古典の猿の名称を読みやすく言い換えたもので、現代動物学の厳密な種の同定ではない。長い腕を持つ猿も同様である。遊びの場面の草の靴下は、原字が足に着ける物を表すためで、後の木こりの草履とは訳し分けた。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-tian-variant"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「王に遣わされて仙宮に入る」と読める字面だが、この時点の物語には命令する王が現れない。照合用の公開翻刻は、王を天へ改め、元の字を注記している。本訳もこの補訂を採り、「天の導きによって」とした。底本原文の王は書き換えず、別の読みをsource_variantsに記録している。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-yuanlong"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここは龍という動物との出会いではなく、道を極めた境地に至る、という意味に取った。漢典は本章の句を用例に、この語義を挙げている。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-sansan"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "九重の修行は、原文の三三を三かける三、すなわち九と読む解釈を採ったもの。特定の九種類の修行法が列挙されているわけではなく、具体的な道教・仏教の体系との対応は確定していない。数の表現は訳に残し、未確認の修行名や分類は補っていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-name-wordplay"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "姓を尋ねられて気性の話をするのは、姓と性の同音を使った言葉遊びである。日本語でも両字を「せい」と読むことで対応させた。後半は、猿を表す呼び名の漢字から獣偏を除き、字を分解して孫という姓を作る作中の説明である。猢猻という語や個々の漢字は、この名づけの仕組みを示す必要があるため、読みと説明を添えて残した。「系」の語義を含め、この説明を現代の文字学上の定説として提示しているわけではない。赤子のあり方を根本とする教えは、幼子の自然さや純真さを尊ぶ思想を表す。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-note-empty-and-wukong"
    "section_id": "translator-notes"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "結びの詩は、孫悟空という名の「悟空」を、「空の意味を悟る」と読む言葉遊びでもある。頑空は、ただ何もないと考えるだけの、悟りを欠いた空しさを指すものとして訳した。何も存在しないという思い込みと、悟りとしての空を区別する表現である。"
    "translation_status": "reviewed"

        "source_span":
          "start": 21
          "end": 24
          "exact": "三三行"
  - "id": "xy-ch01-048"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "美猴王一見，倒身下拜，磕頭不計其數，口中只道：「師父，師父，我弟子志心朝禮，志心朝禮。」祖師道：「你是那方人氏？且說個鄉貫、姓名明白，再拜。」猴王道：「弟子乃東勝神洲傲來國花果山水簾洞人氏。」祖師喝令：「趕出去！他本是個撒詐搗虛之徒，那裡修甚麼道果！」猴王慌忙磕頭不住道：「弟子是老實之言，決無虛詐。」祖師道：「你既老實，怎麼說東勝神洲？那去處到我這裡隔兩重大海，一座南贍部洲，如何就得到此？」猴王叩頭道：「弟子飄洋過海，登界遊方，有十數個年頭，方才訪到此處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 48
    "translation_ja": |-
      美猴王は須菩提祖師を見るなり身を投げ出してひれ伏し、数えきれないほど額を地につけた。口にするのは、ただこの言葉ばかりだった。
      美猴王「お師匠さま、お師匠さま。真心を込めて拝礼いたします。真心を込めて拝礼いたします」
      須菩提祖師「お前は、どこの者だ。まず生まれ故郷と姓名を、はっきり名乗りなさい。拝礼は、それからだ」
      美猴王は答えた。
      美猴王「私は、東勝神洲、傲来国の花果山、水簾洞から参りました」
      須菩提祖師は一喝した。
      須菩提祖師「追い出せ。この者は、うそをつき、でたらめを言って人をだますやつだ。そんな者が、修行で何を身につけられるものか」
      美猴王はあわてて、何度も額を地につけた。
      美猴王「本当のことを申し上げております。決して、うそ偽りはございません」
      須菩提祖師「正直に言っているのなら、なぜ東勝神洲などと言うのだ。そこからここまでは、二つの大海と、南贍部洲という一つの大陸を隔てている。どうして、ここまで来られたのだ」
      美猴王は額を下げたまま答えた。
      美猴王「海を漂い渡り、方々の土地を旅して回り、十数年かかって、ようやくこちらにたどり着いたのでございます」
    "translation_status": "reviewed"
  - "id": "xy-ch01-049"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "祖師道：「既是逐漸行來的也罷。你姓甚麼？」猴王又道：「我無性。人若罵我，我也不惱；若打我，我也不嗔。只是陪個禮兒就罷了。一生無性。」祖師道：「不是這個性。你父母原來姓甚麼？」猴王道：「我也無父母。」祖師道：「既無父母，想是樹上生的？」猴王道：「我雖不是樹上生，卻是石裡長的。我只記得花果山上有一塊仙石，其年石破，我便生也。」祖師聞言暗喜，道：「這等說，卻是個天地生成的。你起來走走我看。」猴王縱身跳起，拐呀拐的走了兩遍。祖師笑道：「你身軀雖是鄙陋，卻像個食松果的猢猻。我與你就身上取個姓氏，意思教你姓『猢』。猢字去了個獸傍，乃是個古月。古者，老也；月者，陰也。老陰不能化育，教你姓『猻』倒好。猻字去了獸傍，乃是個子系。子者，兒男也；系者。嬰細也，正合嬰兒之本論。教你姓『孫』罷。」猴王聽說，滿心歡喜，朝上叩頭道：「好！好！好！今日方知姓也。萬望師父慈悲，既然有姓，再乞賜個名字，卻好呼喚。」祖師道：「我門中有十二個字，分派起名，到你乃第十輩之小徒矣。」猴王道：「那十二個字？」祖師道：「乃廣、大、智、慧、真、如、性、海、穎、悟、圓、覺十二字。排到你，正當『悟』字。與你起個法名叫做『孫悟空』，好麼？」猴王笑道：「好！好！好！自今就叫做孫悟空也。」正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 49
    "translation_ja": |-
      須菩提祖師「少しずつ旅をして来たというのなら、よかろう。それで、お前の姓（せい）は何という」
      美猴王は答えた。
      美猴王「性（せい）といいますと、私には、怒るような気性はありません。悪口を言われても腹を立てませんし、殴られても怒りません。ただ、おわびをして済ませます。生まれてこのかた、かんしゃくというものがないのです」
      須菩提祖師「その『性』ではない。お前の両親の姓を聞いているのだ」
      美猴王「私には、両親もおりません」
      須菩提祖師「両親がいない。それでは、木から生まれたとでもいうのか」
      美猴王「木から生まれたのではございません。石の中から生まれました。花果山に、不思議な力を持つ石が一つあったのを覚えております。ある年、その石が割れて、私が生まれたのです」
      須菩提祖師はそれを聞き、ひそかに喜んだ。
      須菩提祖師「それなら、天地が生み出した者というわけか。立って、少し歩いてみなさい」
      美猴王は勢いよく跳び起き、ひょこひょこと、二度歩いてみせた。
      須菩提祖師は笑った。
      須菩提祖師「姿は不格好だが、松の実を食べる『猢猻（こそん）』、つまり猿によく似ている。お前の姿にちなんだ姓をつけてやろう。まず、『猢（こ）』の字はどうかと考えた。この字から獣偏を取ると、『古』と『月』になる。『古』は老いたもの、『月』は陰の気を表す。老いきった陰には、ものを生み育てる力がない。それなら、『猻（そん）』のほうがよいな。この字から獣偏を取ると、『子』と『系』になる。『子』は男の子、『系』は小さく幼いものを意味する。これなら、赤子のあり方を根本とする教えに、ぴったり合う。お前の姓は、『孫（そん）』にしよう」
      美猴王は、うれしさで胸がいっぱいになり、壇へ向かって額を地につけた。
      美猴王「ありがたい、ありがたい、ありがたい！　今日、初めて自分の姓が分かりました。どうか、お師匠さま、お慈悲をお願いいたします。姓をいただけたのですから、次には、人に呼んでもらえる名前もお授けください」
      須菩提祖師「わが門では、十二の文字を順に割り当て、弟子の代ごとに名をつけている。お前は、第十代の弟子に当たる」
      美猴王「その十二の文字とは、何でございますか」
      須菩提祖師「広・大・智・慧・真・如・性・海・穎・悟・円・覚、この十二字だ。お前の代は、ちょうど『悟』に当たる。修行者としての名を、『孫悟空（そんごくう）』とつけよう。どうだ」
      孫悟空は笑った。
      孫悟空「ありがたい、ありがたい、ありがたい！　今日から私は、孫悟空です」
      まさに、次の詩にいうとおりである。
    "translation_status": "reviewed"

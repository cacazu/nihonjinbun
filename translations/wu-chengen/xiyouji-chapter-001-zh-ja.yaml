  - "id": "xy-ch01-002"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      混沌未分天地亂，茫茫渺渺無人見。
      自從盤古破鴻濛，開闢從茲清濁辨。
      覆載群生仰至仁，發明萬物皆成善。
      欲知造化會元功，須看《西遊釋厄傳》。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 2
    "translation_ja": |-
      混沌がまだ分かれず、天も地も入り乱れていたころ、その果てしなくおぼろな姿を見た者はいない。
      盤古（ばんこ）が太初（たいしょ）の混沌を打ち破ると、世界は開け、澄んだものと濁ったものが分かれた。
      天は覆い、地は支え、生きとし生けるものはその深い慈しみにすがり、万物は生み育てられて、それぞれの姿を全うする。
      天地がものを生み、長大な時が巡る、その働きを知りたければ、『西遊釈厄伝（さいゆうしゃくやくでん）』――西への旅で災いを乗り越えるこの物語を読むがよい。
    "translation_status": "reviewed"
  - "id": "xy-ch01-003"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "蓋聞天地之數，有十二萬九千六百歲為一元。將一元分為十二會，乃子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥之十二支也。每會該一萬八百歲。且就一日而論：子時得陽氣，而丑則雞鳴；寅不通光，而卯則日出；辰時食後，而巳則挨排；日午天中，而未則西蹉；申時晡，而日落酉，戌黃昏，而人定亥。譬於大數，若到戌會之終，則天地昏曚而萬物否矣。再去五千四百歲，交亥會之初，則當黑暗，而兩間人物俱無矣，故曰混沌。又五千四百歲，亥會將終，貞下起元，近子之會，而復逐漸開明。邵康節曰：「冬至子之半，天心無改移。一陽初動處，萬物未生時。」到此，天始有根。再五千四百歲，正當子會，輕清上騰，有日，有月，有星，有辰。日、月、星、辰，謂之四象。故曰，天開於子。又經五千四百歲，子會將終，近丑之會，而逐漸堅實。《易》曰：「大哉乾元！至哉坤元！萬物資生，乃順承天。」至此，地始凝結。再五千四百歲，正當丑會，重濁下凝，有水，有火，有山，有石，有土。水、火、山、石、土，謂之五形。故曰，地闢於丑。又經五千四百歲，丑會終而寅會之初，發生萬物。曆曰：「天氣下降，地氣上升；天地交合，群物皆生。」至此，天清地爽，陰陽交合。再五千四百歲，正當寅會，生人，生獸，生禽，正謂天地人，三才定位。故曰，人生於寅。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 3
    "translation_ja": |-
      さて、天地の時の巡りでは、十二万九千六百年を「一元（いちげん）」というそうである。一元を十二の「会（かい）」に分け、子（ね）・丑（うし）・寅（とら）・卯（う）・辰（たつ）・巳（み）・午（うま）・未（ひつじ）・申（さる）・酉（とり）・戌（いぬ）・亥（い）という十二支に当てる。一会は一万八百年である。
      これを一日の移り変わりになぞらえてみよう。子の刻（こく）に陽の気（ようのき）が生じ、丑の刻には鶏が鳴く。寅の刻にはまだ明るくならず、卯の刻に日が昇る。辰の刻には朝食を終え、巳の刻には日がさらに進む。午の刻に太陽が空の真ん中に来て、未の刻には西へ傾く。申の刻は午後の食事どき、酉の刻には日が沈み、戌の刻にはたそがれ、亥の刻には人々が寝静まる。
      これを天地の大きな周期に当てはめると、戌の会の終わりには天地が暗くなり、万物の営みが閉ざされる。それから五千四百年がたち、亥の会の初めに入ると、世界は闇に包まれ、天地の間には人も物もなくなる。これを混沌という。さらに五千四百年が過ぎ、亥の会が終わりに近づくと、終わりの底から新たな始まりが芽生え、子の会が近づくにつれて、世界は再び少しずつ明るくなる。
      邵康節（しょうこうせつ）はこう詠んだ。「冬至は子の半ばに当たり、天の本来の働きは変わらない。陽の気がひと筋、初めて動くとき、万物はまだ生まれていない」。ここに至って、天のもとが形づくられ始める。
      さらに五千四百年がたって、ちょうど子の会の半ばになると、軽く澄んだ気が上に昇り、太陽、月、星々、そして星の巡る区分ができる。これらを日・月・星・辰の「四象（ししょう）」、すなわち天に現れる四つの姿という。「天は子に開く」とは、このことである。
      また五千四百年がたち、子の会が終わって丑の会が近づくと、地が次第に固まり始める。『易経（えききょう）』にはこうある。「なんと偉大なことか、天の創造の力は。なんと至り尽くしていることか、地の生成の力は。万物は地に支えられて生まれ、地は天の働きを従順に受け継ぐ」。ここで、地が初めて形を結ぶ。
      さらに五千四百年がたち、ちょうど丑の会の半ばになると、重く濁った気が下に固まり、水・火・山・石・土ができる。この五つを「五形（ごぎょう）」という。「地は丑に開ける」とは、このことである。
      また五千四百年がたち、丑の会が終わって寅の会が始まると、万物が生まれ始める。暦の書には、「天の気は下り、地の気は昇る。天地の気が交わって、あらゆるものが生まれる」とある。こうして天は澄み、地は清らかになり、陰と陽（いんとよう）が交わる。さらに五千四百年がたって寅の会の半ばになると、人が生まれ、獣が生まれ、鳥が生まれる。天・地・人という、世界を成り立たせる三つのものの位置が定まったのである。「人は寅に生まれる」とは、このことである。
    "translation_status": "reviewed"
  - "id": "xy-ch01-004"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "感盤古開闢，三皇治世，五帝定倫，世界之間，遂分為四大部洲：曰東勝神洲，曰西牛賀洲，曰南贍部洲，曰北俱蘆洲。這部書單表東勝神洲。海外有一國土，名曰傲來國。國近大海，海中有一座名山，喚為花果山。此山乃十洲之祖脈，三島之來龍，自開清濁而立，鴻濛判後而成。真個好山！有詞賦為證。賦曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 4
    "translation_ja": |-
      天地を開いた盤古（ばんこ）、世を治めた三皇（さんこう）、人の世の秩序を定めた五帝（ごてい）――そうした神々や伝説の君主の時代を経て、世界は四つの大陸に分かれた。東勝神洲（とうしょうしんしゅう）、西牛賀洲（さいごかしゅう）、南贍部洲（なんせんぶしゅう）、北倶盧洲（ほっくるしゅう）である。
      この物語では、まず東勝神洲のことから話そう。海の向こうに、傲来国（ごうらいこく）という国があった。その国は大海に面し、海の中には花果山（かかざん）という名高い山がそびえていた。この山は、仙人の住む十の洲（しゅう）へ連なる山脈のおおもとであり、三つの仙島へ続く地の力の源でもあった。天と地が分かれたときから立ち、太初の混沌が開かれたときから成っている。実に見事な山である。その景色を歌い上げた詩を聞いていただこう。
    "translation_status": "reviewed"
  - "id": "xy-ch01-005"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "勢鎮汪洋，威寧瑤海。勢鎮汪洋，潮湧銀山魚入穴；威寧瑤海，波翻雪浪蜃離淵。水火方隅高積上，東海之處聳崇巔。丹崖怪石，削壁奇峰。丹崖上，彩鳳雙鳴；削壁前，麒麟獨臥。峰頭時聽錦雞鳴，石窟每觀龍出入。林中有壽鹿仙狐，樹上有靈禽玄鶴。瑤草奇花不謝，青松翠柏長春。仙桃常結果，修竹每留雲。一條澗壑籐蘿密，四面原堤草色新。正是百川會處擎天柱，萬劫無移大地根。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 5
    "translation_ja": |-
      その山の勢いは大海を押さえ、その威厳は玉のように輝く海を鎮める。
      大海を押さえる山のもと、潮は銀の山のように盛り上がり、魚は岩穴へ逃げ込む。
      輝く海を鎮める山のもと、雪のような白波が逆巻き、蜃気楼を吐く大ハマグリは深い淵を離れる。
      水と火の気が交わるところに高く盛り上がり、東の海に険しい頂をそびやかす。
      赤い崖に奇岩、切り立つ岩壁に奇妙な峰。
      赤い崖では、色鮮やかな鳳凰が二羽、鳴き交わし、切り立つ岩壁の前には、霊獣の麒麟が一頭、横たわる。
      峰の上からは折々、キンケイの鳴く声が聞こえ、岩の洞穴には幾度も龍が出入りする。
      林には長寿の鹿と仙術を得た狐、木の上には不思議な力を持つ鳥や黒い鶴がいる。
      宝のような草も珍しい花も枯れず、松やヒノキの仲間は青々と茂り、いつまでも春の姿を保つ。
      仙人の桃は絶えず実を結び、すらりと伸びた竹にはいつも雲がとどまる。
      谷筋には藤などのつる草が生い茂り、四方の野や土手には若草の色がみなぎる。
      まさしく幾多の川が集まるところに立つ、天を支える柱。果てしない時を経ても動かぬ、大地のおおもとである。
    "translation_status": "reviewed"
  - "id": "xy-ch01-006"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那座山正當頂上，有一塊仙石。其石有三丈六尺五寸高，有二丈四尺圍圓。三丈六尺五寸高，按周天三百六十五度；二丈四尺圍圓，按政曆二十四氣。上有九竅八孔，按九宮八卦。四面更無樹木遮陰，左右倒有芝蘭相襯。蓋自開闢以來，每受天真地秀，日精月華，感之既久，遂有靈通之意。內育仙胞，一日迸裂，產一石卵，似圓毬樣大。因見風，化作一個石猴，五官俱備，四肢皆全。便就學爬學走，拜了四方。目運兩道金光，射沖斗府。驚動高天上聖大慈仁者玉皇大天尊玄穹高上帝，駕座金闕雲宮靈霄寶殿，聚集仙卿，見有金光燄燄，即命千里眼、順風耳開南天門觀看。二將果奉旨出門外，看的真，聽的明。須臾回報道：「臣奉旨觀聽金光之處，乃東勝神洲海東傲來小國之界，有一座花果山，山上有一仙石，石產一卵，見風化一石猴，在那裡拜四方，眼運金光，射沖斗府。如今服餌水食，金光將潛息矣。」玉帝垂賜恩慈曰：「下方之物，乃天地精華所生，不足為異。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 6
    "translation_ja": |-
      その山のちょうど頂に、不思議な力を秘めた石が一つあった。高さは三丈（じょう）六尺（しゃく）五寸（すん）、周囲は二丈四尺。高さは天の一周を表す三百六十五度に、周囲は暦の二十四節気に対応していた。表面には九つの穴と八つの孔があり、天地を九つの区画で表す配置と、陰陽を組み合わせた八種類の基本図形に対応していた。四方には日陰をつくる木がなく、左右にはレイシというキノコやランが生えて、趣を添えていた。
      天地が開けて以来、この石は天と地のすぐれた気、太陽の精気、月の光を絶えず受けていた。長くそれらに感応するうち、ついに霊妙な働きが生じ、内側に不思議な命が育った。ある日、石ははじけ割れ、丸いまりほどの石の卵を一つ生み落とした。その卵は風に触れると、一匹の石猿（いしざる）になった。目、耳、鼻、口など顔の器官はそろい、手足もすべて備わっていた。
      石猿はすぐに、はうことと歩くことを覚え、四方を拝んだ。すると両目から二筋の金色の光が放たれ、北斗（ほくと）の星々の宮殿まで突き抜けた。
      その光に驚かされたのは、天高くにおわす聖なる神、限りない慈悲と仁愛を備えた玉皇大天尊（ぎょくこうだいてんそん）――奥深い天を治める至高の帝、玉帝（ぎょくてい）であった。玉帝は金の門をそなえた雲上の宮殿、その奥の霊霄宝殿（れいしょうほうでん）で、仙人の臣下たちを集めていた。金の光が燃え立つのを見ると、遠くまで見通す千里眼（せんりがん）と、遠くの音まで聞き取る順風耳（じゅんぷうじ）に、南天門（なんてんもん）を開けて調べるよう命じた。
      二人の将軍は命を受けて門の外に出ると、目と耳で確かめ、ほどなく戻って報告した。
      千里眼と順風耳「仰せに従い、金の光が出た場所を見聞きいたしました。東勝神洲の海の東、傲来（ごうらい）という小国の領内に花果山がございます。その山の霊石が卵を生み、卵は風に触れて石猿となりました。その猿が四方を拝み、両目から金色の光を放って、北斗の宮殿まで届かせたのでございます。今は水を飲み、食べ物を口にしておりますので、その光もしだいに消えようとしております」
      玉帝は慈悲深く言われた。
      玉帝「下界のものが、天地の精気を受けて生まれたのであろう。怪しむには及ばぬ」
    "translation_status": "reviewed"
  - "id": "xy-ch01-007"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那猴在山中，卻會行走跳躍，食草木，飲澗泉，採山花，覓樹果；與狼蟲為伴，虎豹為群，獐鹿為友，獼猿為親；夜宿石崖之下，朝遊峰洞之中。真是：「山中無甲子，寒盡不知年。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 7
    "translation_ja": "その猿は山の中で、歩いたり跳ねたりして暮らした。草木を食べ、谷の泉を飲み、山の花を摘み、木の実を探した。狼などの獣を仲間にし、虎や豹と群れ、キバノロや鹿を友とし、さまざまな猿と身内のように親しんだ。夜は岩壁の下に泊まり、朝は峰や洞穴で遊ぶ。まさしく、「山の中には暦がない。寒さが去っても、何年たったか分からない」という暮らしだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-008"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一朝天氣炎熱，與群猴避暑，都在松陰之下頑耍。你看他一個個："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 8
    "translation_ja": "ある暑い日、石猿は仲間の猿たちと暑さを避け、みなで松の木陰で遊んでいた。一匹一匹を見れば、こんな具合である。"
    "translation_status": "reviewed"
  - "id": "xy-ch01-009"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": "跳樹攀枝，採花覓果；拋彈子，邷麼兒；跑沙窩，砌寶塔；趕蜻蜓，撲\U00027222蠟；參老天，拜菩薩；扯葛籐，編草帓；捉虱子，咬又掐；理毛衣，剔指甲。挨的挨，擦的擦；推的推，壓的壓；扯的扯，拉的拉：青松林下任他頑，綠水澗邊隨洗濯。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 9
    "translation_ja": |-
      木に跳びつき、枝によじ登り、花を摘んでは木の実を探す。
      玉を放り投げ、小石を使ったお手玉遊びをし、砂のくぼみを駆け回っては塔を積む。
      トンボを追いかけ、バッタを捕まえ、天の神様を拝み、菩薩に手を合わせる。
      クズのつるを引っぱり、草で靴下を編む。
      シラミを捕って、かみつぶしたり、指でつまみつぶしたり。
      毛並みを整え、爪の垢をほじくり出す。
      寄り添うもの、こすりつけるもの、押すもの、押さえつけるもの、つかむもの、引っぱるもの。
      青々とした松林の下で好き放題に遊び、緑の水をたたえた谷川で、思うままに体を洗う。
    "translation_status": "reviewed"
  - "id": "xy-ch01-010"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一群猴子耍了一會，卻去那山澗中洗澡。見那股澗水奔流，真個似滾瓜湧濺。古云：「禽有禽言，獸有獸語。」眾猴都道：「這股水不知是那裡的水。我們今日趕閑無事，順澗邊往上溜頭尋看源流，耍子去耶！」喊一聲，都拖男挈女，呼弟呼兄，一齊跑來，順澗爬山，直至源流之處，乃是一股瀑布飛泉。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 10
    "translation_ja": |-
      ひとしきり遊ぶと、猿たちは谷川へ水浴びに行った。谷の水は勢いよく流れ、まるで丸い瓜がごろごろ転がるように、湧き立っては飛び散っていた。昔から「鳥には鳥の言葉、獣には獣の言葉がある」という。猿たちは口々に言った。
      猿たち「この水は、いったいどこから来るんだろう。今日は暇で、何もすることがない。川べりをさかのぼって、水の出どころを探しに行こうじゃないか。ひと遊びしよう！」
      わっと声を上げると、雄も雌も手を取り合い、弟や兄を呼び合って、いっせいに走り出した。谷沿いに山を登り、水の源に行き着くと、そこには高く流れ落ちる滝があった。その眺めは、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch01-011"
    "section_id": "chapter-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一派白虹起，千尋雪浪飛。
      海風吹不斷，江月照還依。
      冷氣分青嶂，餘流潤翠微。
      潺湲名瀑布，真似掛簾帷。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 11
    "translation_ja": |-
      一筋の白い虹が立ち、はるか高みから雪のような白波が飛ぶ。
      海風が吹いても途切れることなく、水辺の月に照らされても、変わらず懸かる。
      冷たい気は緑の峰々の間を分けて流れ、落ちた水は山の緑を潤す。
      絶えず音を立てて流れるこの滝は、まるで垂らした幕のようだ。
    "translation_status": "reviewed"
  - "id": "xy-ch01-012"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾猴拍手稱揚道：「好水，好水！原來此處遠通山腳之下，直接大海之波。」又道：「那一個有本事的，鑽進去尋個源頭出來，不傷身體者，我等即拜他為王。」連呼了三聲，忽見叢雜中跳出一個石猴，應聲高叫道：「我進去，我進去。」好猴！也是他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch1-2562136"
        "precision": "work"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第001回&oldid=2562136&variant=zh-hant"
        "source_sequence": 12
    "translation_ja": |-
      猿たちは手をたたいて褒めそやした。
      猿たち「いい水だ、いい水だ！　ここから水が遠く山の麓まで流れて、そのまま大海の波につながっているんだな」
      そして、こう言い合った。
      猿たち「腕に覚えのあるやつがいたら、あの中に入り込んで、水の出どころを探してこい。けが一つせずに戻ってきたら、そいつを俺たちの王にしよう」
      三度そう呼びかけると、茂みの中から石猿が跳び出し、すかさず大声を上げた。
      石猿「俺が入る！　俺が入る！」
      さても見事な猿である。この猿こそ、まさしく――

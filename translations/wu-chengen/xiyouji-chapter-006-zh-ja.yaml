    "status": "open"
    "message_ja": "「玉帝與…正在…講話，道」の発言は玉帝に帰したが、複数人物を含む主語のため、話者を文法だけで完全には確定できない。"
- "id": "xy-ch06-026"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩開口對老君說：「貧僧所舉二郎神如何？果有神通，已把那大聖圍困，只是未得擒拿。我如今助他一功，決拿住他也。」老君道：「菩薩將甚兵器？怎麼助他？」菩薩道：「我將那淨瓶楊柳拋下去，打那猴頭，即不能打死，也打個一跌，教二郎小聖好去拿他。」老君道：「你這瓶是個磁器，能打著他便好，如打不著他的頭，或撞著他的鐵棒，卻不打碎了？你且莫動手，等我老君助他一功。」菩薩道：「你有甚麼兵器？」老君道：「有，有，有。」捋起衣袖，左膊上取下一個圈子，說道：「這件兵器，乃錕鋼摶煉的，被我將還丹點成，養就一身靈氣，善能變化，水火不侵，又能套諸物。一名『金鋼琢』，又名『金鋼套』。當年過函關，化胡為佛，甚是虧他。早晚最可防身。等我丟下去打他一下。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 161
    "line_end": 161
    "source_sequence": 26
  "translation_ja": |-
    観音菩薩が太上老君に話しかけた。
    観音菩薩「私が推薦した二郎神は、いかがですか。やはり神通力があり、あの大聖を囲い込みました。ただ、まだ捕らえてはいません。今、私が力を貸せば、きっと捕まえられます。」
    太上老君「菩薩はどんな武器で、どう助けるつもりですか。」
    観音菩薩「楊柳（ようりゅう・推定。ヤナギの枝。ここでは観音の浄瓶に挿す枝）を挿した浄瓶（じょうへい。清らかな水を入れる仏教の水差し）を投げ下ろし、あの猿の頭を打ちます。打ち殺せなくても、ひと転びはさせられましょう。そうすれば二郎小聖（じろうしょうせい・推定。小聖の称号を添えた二郎真君の呼び名）も捕らえやすくなります。」
    太上老君「あなたの瓶は陶磁器だ。あれに当たればよいが、頭を外したり、鉄の棒にぶつかったりすれば、砕けてしまうではないか。手を出さず、私に助けさせなさい。」
    観音菩薩「どんな武器をお持ちですか。」
    太上老君「ある、ある。ちゃんとある。」
    太上老君は袖をまくり、左腕から輪を一つ外して言った。
    太上老君「これは錕鋼（こんこう・推定。この物語で金鋼琢の材料とされる鋼）を鍛えて練り上げ、私が還丹（かんたん。道教の錬丹術で作る霊薬）で仕上げた武器だ。全体に霊気を養い、よく変化し、水にも火にも損なわれず、あらゆるものを輪の中に捕らえられる。一名を金鋼琢（こんごうたく・推定。あらゆる物を取り込める、太上老君の輪形の武器）、またの名を金鋼套（こんごうとう・推定。金鋼琢の別名である、輪形の武器）という。その昔、函谷関（かんこくかん。中国古代の関所で、老子が西へ越えたと伝えられる場所）を越え、胡人（こじん・推定。古い中国で北方や西方の異民族を呼んだ名）を教化して仏としたときも、大いにこれのおかげをこうむった。いつでも身を守るには最上だ。これを投げ下ろし、ひとつ打ってやろう。」
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "錕鋼は原語を保持。化胡為佛は老君自身の発言として訳し、歴史的事実としない。"
- "id": "xy-ch06-027"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話畢，自天門上往下一摜，滴流流，徑落花果山營盤裡，可可的著猴王頭上一下。猴王只顧苦戰七聖，卻不知天上墜下這兵器，打中了天靈，立不穩腳，跌了一跤，爬將起來就跑。被二郎爺爺的細犬趕上，照腿肚子上一口，又扯了一跌。他睡倒在地，罵道：「這個亡人！你不去妨家長，卻來咬老孫！」急翻身爬不起來，被七聖一擁按住，即將繩索捆綁，使勾刀穿了琵琶骨，再不能變化。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 163
    "line_end": 163
    "source_sequence": 27
  "translation_ja": |-
    そう言い終えると、天門（てんもん・推定。ここでは天界の南の入口、南天門の略）から下へ投げつけた。輪はくるくる回って、まっすぐ花果山の陣地へ落ち、ちょうど斉天大聖の頭を一撃した。斉天大聖は七聖との苦戦に気を取られ、空からこの武器が落ちてくるとは知らなかった。頭のてっぺんに当たって足がふらつき、ひっくり返った。起き上がって逃げようとしたが、二郎真君の細身の猟犬が追いつき、ふくらはぎにかみついて、また引き倒した。斉天大聖は地に倒れたまま罵った。
    斉天大聖「この疫病犬め！　飼い主に災いをもたらさず、どうして俺にかみつくんだ！」
    急いで身を返しても起き上がれず、七聖が一斉に押しかかって取り押さえた。すぐに縄で縛り、鉤刀（こうとう・推定。先が鉤のように曲がった刃物）を肩甲骨に通したので、もう変化はできなかった。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "妨家長は飼い主に災いをもたらす意の罵りと解した。琵琶骨は肩甲骨。身体への鉤刀の具体的な通し方は補っていない。"
- "id": "xy-ch06-028"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老君收了金鋼琢，請玉帝同觀音、王母、眾仙等，俱回靈霄殿。這下面四大天王與李天王諸神，俱收兵拔寨，近前向小聖賀喜，都道：「此小聖之功也。」小聖道：「此乃天尊洪福，眾神威權，我何功之有？」康、張、姚、李道：「兄長不必多敘，且押這廝去上界見玉帝，請旨發落去也。」真君道：「賢弟，汝等未受天籙，不得面見玉帝。教天甲神兵押著，我同天王等上界回旨。你們帥眾在此搜山，搜淨之後，仍回灌口。待我請了賞，討了功，回來同樂。」四太尉、二將軍依言領諾。這真君與眾即駕雲頭，唱凱歌，得勝朝天。不多時，到通明殿外。天師啟奏道：「四大天王等眾已捉了妖猴齊天大聖了，來此聽宣。」玉帝傳旨，即命大力鬼王與天丁等眾，押至斬妖臺，將這廝碎剁其屍。咦！正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 164
    "line_end": 164
    "source_sequence": 28
  "translation_ja": |-
    太上老君は金鋼琢を収め、玉帝と観音菩薩、王母、仙人たちを促して、そろって霊霄宝殿へ戻った。下界では四大天王と李天王をはじめとする神々が兵を収め、陣を払い、二郎真君のもとへ進んで祝いを述べた。
    神々「これこそ、小聖のお手柄です。」
    二郎真君「天尊（てんそん・推定。尊い天の神への敬称。ここでは玉帝）の大いなる福と、皆さんの威力のおかげです。私に何の手柄がありましょう。」
    康・張・姚・李の四太尉「兄上、お話はそれくらいにして、まずはこいつを天界へ引き立て、玉帝にお目にかかり、処分のご命令を仰ぎましょう。」
    二郎真君「弟たち、お前たちはまだ天界の名簿に登録されていないから、玉帝にお目にかかることはできない。甲冑（かっちゅう・推定。鎧と兜などの武具）の天兵に護送させ、私は天王たちとともに天界へ戻って復命（ふくめい・推定。命令された任務の結果を報告すること）する。お前たちは兵を率いてここを捜索し、山をすっかり捜し終えたら、灌江口へ戻ってくれ。私が賞を願い、功を認めていただいて帰ったら、一緒に祝おう。」
    四太尉と二将軍は言われたとおりに承知した。二郎真君は一同と雲に乗り、凱歌（がいか・推定。戦いに勝ったことを祝う歌）を歌いながら、勝利を収めて天界へ向かった。ほどなく通明殿の外へ着くと、天師が奏上した。
    天師「四大天王たちが、妖猿の斉天大聖を捕らえ、ご召見を待っております。」
    玉帝は勅命を伝え、ただちに大力鬼王と天兵たちに、あやつを斬妖台（ざんようだい・推定。妖怪を処刑する天界の場所）へ引き立て、体を細かく切り刻めと命じた。ああ、まさにこういうことだ。
  "translation_status": "draft"

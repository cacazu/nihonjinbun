  "translation_ja": |-
    騒いでいるところへ二郎真君が来て、尋ねた。
    二郎真君「弟たち、どこまで追って見失ったのだ。」
    梅山六兄弟「今しがた、ここで取り囲んだのに、いなくなったのです。」
    二郎真君は鳳凰のような目を見開いて眺め、斉天大聖が雀になって木に止まっているのを見つけた。そこで巨大な姿を収め、神槍を置き、弾弓を外した。そして身を振るわせて鷂鷹となり、翼を広げて襲いかかった。斉天大聖はそれを見るや、ひと羽ばたきで飛び立ち、大きな鵜となって空へ昇った。二郎真君は急いで羽毛を震わせ、大きな海鶴に変わり、雲の高みへ突き進んでついばもうとした。斉天大聖は身を低く落とし、谷川に入ると、一匹の魚に変わって水中へ潜った。二郎真君は川辺まで追ったが、姿がない。心の中で考えた。
    二郎真君「この猿は、きっと水に入ったのだ。魚か海老の類に変わったに違いない。私ももう一度変わって捕まえよう。」
    そこで魚鷹に変わり、下流の波の上を漂いながら、しばらく待った。魚になった斉天大聖は流れに沿って泳いでいたが、ふと一羽の鳥を見つけた。青い鷂かと思えば羽は青くなく、白鷺かと思えば頭に飾り羽がなく、コウノトリかと思えば脚が赤くない。
    斉天大聖「二郎が化けて、俺を待ち構えているんだな！」
    すばやく頭を返し、水しぶきを上げて逃げた。二郎真君はそれを見て言った。
    二郎真君「あの水しぶきを上げる魚は、鯉にしては尾が赤くなく、桂魚にしては斑の鱗がない。雷魚にしては頭に星のような斑がなく、魴にしては鰓に針がない。私を見るなり引き返したのはなぜだ。必ずあの猿が化けたものだ。」
    追いついて、さっと一つついばんだ。斉天大聖は水から飛び出し、水蛇に変わって岸へ泳ぎ寄り、草むらに潜った。二郎真君はついばみ損ねたが、水音の中で蛇が飛び出すのを見て、斉天大聖だと見抜いた。すぐに身を翻し、頭頂に朱を縫い取ったような灰色の鶴に変わった。先の尖った鉄の火箸そっくりの長い嘴を伸ばし、まっすぐ水蛇を食べに来た。水蛇はひと跳ねして、今度は花鴇になり、ぼんやりと蓼の生えた水辺に立った。二郎真君は、相手が卑しいものに化けたのを見て、近づこうとしなかった。（花鴇は鳥の中でも最も卑しく淫らなもので、鸞、鳳凰、鷹、烏を問わず、どれとも交わるという。）二郎真君はもとの姿に戻り、歩み寄って弾弓を取り、いっぱいに引き絞ると、弾を一発放って相手をよろめかせた。

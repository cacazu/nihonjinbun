  "translation_ja": |-
    観音菩薩は一同を率いて中へ入り、玉帝への礼を済ませ、太上老君、王母とも挨拶を交わした。それぞれ席に着くと、観音菩薩が尋ねた。
    観音菩薩「蟠桃（ばんとう。食べると長寿を得るという天界の桃）の宴は、どうなったのですか。」
    玉帝「毎年、皆を招いて楽しく過ごしていたが、今年は妖猿に騒ぎを起こされ、せっかくの招待もむなしくなった。」
    観音菩薩「その妖猿は、どこの生まれでしょうか。」
    玉帝「あれは東勝神洲（とうしょうしんしゅう。物語の世界を構成する四大陸のうち東の大陸）、傲来国（ごうらいこく。東勝神洲の海に面し、花果山のある国）の花果山（かかざん。石猿が生まれ、猿たちが暮らす山）で、石の卵から生まれたものだ。生まれたとき、目から金色の光を放ち、斗（と・推定。ここでは斗府に属する天上の星々）の星々の府まで射し貫いた。初めは気に留めなかったが、その後、妖術を身につけ、竜を降し虎を伏せ、自ら死者の名簿から名を削った。竜王（りゅうおう・推定。海と水族を治める竜の王）や閻王（えんおう。死者の世界を治め、人の寿命や死を支配するとされる王）から訴えがあったので、朕（ちん・推定。帝王が自分を指していう言葉）は捕らえようとした。すると長庚星（ちょうこうせい・推定。金星の別名。ここでは太白金星を指す）が『三界（さんがい・推定。仏教で生きものの住む世界を三つに分けたもの）では、九つの穴を持つものなら、いずれも仙人になれます』と申し立てた。そこで朕は教え導いて賢き者を育てようと、天界へ呼び、御馬監（ぎょばかん。天界の馬を飼い、管理する役所）の弼馬温（ひつばおん。孫悟空が任じられた天界の馬の管理役）に任じたのだ。ところが、あやつは官職が低いと嫌がり、天宮（てんきゅう・推定。天界にある神々の宮殿）に背いた。李天王（りてんのう・推定。天兵を率いる李姓の神将。托塔天王とも呼ぶ）と哪吒太子（なたたいし・推定。李天王の息子で、天兵の将として戦う神）を差し向けて降伏させようとし、その後、また詔（みことのり。帝王が臣下へ下す命令）を下してなだめ、天界へ呼び戻して斉天大聖に任じた。ただし官名だけで俸禄（ほうろく・推定。役人に支給される報酬）はない。任される仕事もなく、東へ西へと遊び歩くので、また騒動を起こしてはと、蟠桃園（ばんとうえん。王母の不老長寿の桃を栽培する天界の園）の管理を命じた。すると法に従わず、老木の大桃をすっかり盗み食いしたのだ。宴を開くに当たっては、俸禄のない者ゆえ招かなかった。あやつは計略で赤脚大仙を欺き、その姿に化けて宴に入り、仙界の料理も酒もすっかり盗み食いし、さらに老君（ろうくん・推定。太上老君の略称）の仙丹（せんたん・推定。仙人が作る、不老長生のための霊薬）を盗み、御酒（ぎょしゅ・推定。帝王のために用意された酒）もいくらか盗んで、生まれ故郷の猿どもと楽しんでいる。そのため朕は心を悩ませ、十万の天兵を動かし、天羅地網（てんらちもう・推定。天と地を覆い、逃げ道を塞ぐ網）を張って降伏させようとしている。この一日、報告がなく、勝敗はまだ分からぬ。」
    観音菩薩は聞き終えると、恵岸行者に命じた。
    観音菩薩「急いで天宮を下り、花果山へ行って戦況を調べなさい。戦いに出会ったら、力を貸してもよい。必ず確かなところを報告するのですよ。」
  "translation_status": "draft"

  "translation_ja": |-
    斉天大聖はそれを機に崖を転がり落ち、伏せたまま、また変化した。今度は土地神の小さな廟である。口を大きく開いて廟の入口に、歯を扉に、舌を神像に、目を窓の格子にした。ただ尾だけは始末に困り、後ろへ立てて旗竿に変えた。二郎真君が崖の下へ追ってくると、撃ち倒した鴇はいず、小さな廟が一つあるだけだった。鳳凰のような目を見開いてよく見ると、後ろに旗竿が立っている。二郎真君は笑って言った。
    二郎真君「あの猿だ。また私をだまそうとしている。廟はいろいろ見たが、後ろに旗竿を立てたものなど見たことがない。間違いなく、あの畜生のいたずらだ。私を中へ誘い込めば、一口でかみつくつもりだろう。誰が入るものか。まず拳で窓格子を打ち、次に扉を蹴ってやろう。」
    斉天大聖は聞いて肝をつぶした。
    斉天大聖「ひどい奴だ、ひどい奴だ！　扉は俺の歯、窓格子は俺の目だ。歯を打たれ、目をつぶされたら、どうすればいい。」
    ぱっと虎のようにひと跳びすると、また空中へ飛び上がり、姿を消した。

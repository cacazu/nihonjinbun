    "message_ja": "鶿老・海鶴・魚鷹・花鴇は物語の鳥名として訳し、現代の分類への厳密な同定は留保する。魚の特徴の列挙も原文どおり。花鴇に関する括弧内は語り手の俗説であり科学的説明ではない。"
- "id": "xy-ch06-022"

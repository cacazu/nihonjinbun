    "line_end": 121
    "source_sequence": 2
  "translation_ja": |-
    天神たちが山を囲み、斉天大聖が休んでいる話は、ひとまずおく。さて、南海の普陀落伽山に住む、大慈大悲、苦難を救う霊験あらたかな観世音菩薩は、王母から蟠桃大会に招かれ、一番弟子の恵岸行者とともに瑤池の宝閣へ上った。ところが辺りはひっそりして、宴の席は食い荒らされている。天仙も何人かいたが、誰も席に着かず、入り乱れて事情を話し合っていた。観音菩薩が仙人たちと挨拶を交わすと、皆がこれまでの出来事を詳しく語った。
    観音菩薩「宴もなく、杯も回らないのでしたら、私と一緒に玉帝にお目にかかりましょう。」
    仙人たちは喜んでついていった。通明殿の前には、すでに四大天師や赤脚大仙たちが集まっていた。一同は観音菩薩を迎え、玉帝が心を悩ませて天兵を派遣したこと、妖怪を捕らえる軍勢がまだ戻らないことなどを告げた。
    観音菩薩「玉帝にお目にかかりたいので、お取り次ぎをお願いします。」
    天師の丘弘済が霊霄宝殿に入り、奏上して召し入れの許しを得た。そのとき太上老君は上座に、王母は奥にいた。
  "translation_status": "draft"
- "id": "xy-ch06-003"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩引眾同入裡面，與玉帝禮畢，又與老君、王母相見，各坐下。便問：「蟠桃盛會如何？」玉帝道：「每年請會，喜喜歡歡；今年被妖猴作亂，甚是虛邀也。」菩薩道：「妖猴是何出處？」玉帝道：「妖猴乃東勝神洲傲來國花果山石卵化生的。當時生出，即目運金光，射沖斗府。始不介意，繼而成精，降龍伏虎，自削死籍。當有龍王、閻王啟奏。朕欲擒拿，是長庚星啟奏道：『三界之間，凡有九竅者，可以成仙。』朕即施教育賢，宣他上界，封為御馬監弼馬溫官。那廝嫌惡官小，反了天宮。即差李天王與哪吒太子收降，又降詔撫安，宣至上界，就封他做個齊天大聖，只是有官無祿。他因沒事幹管理，東遊西蕩。朕又恐別生事端，著他代管蟠桃園。他又不遵法律，將老樹大桃，盡行偷吃。及至設會，他乃無祿人員，不曾請他。他就設計賺哄赤腳大仙，卻自變他相貌入會，將仙殽仙酒盡偷吃了，又偷老君仙丹，又偷御酒若干，去與本山眾猴享樂。朕心為此煩惱，故調十萬天兵，天羅地網收伏。這一日不見回報，不知勝負如何。」菩薩聞言，即命惠岸行者道：「你可快下天宮，到花果山，打探軍情如何。如遇相敵，可就相助一功，務必的實回話。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 122
    "line_end": 122
    "source_sequence": 3
  "translation_ja": |-
    観音菩薩は一同を率いて中へ入り、玉帝への礼を済ませ、太上老君、王母とも挨拶を交わした。それぞれ席に着くと、観音菩薩が尋ねた。
    観音菩薩「蟠桃の宴は、どうなったのですか。」
    玉帝「毎年、皆を招いて楽しく過ごしていたが、今年は妖猿に騒ぎを起こされ、せっかくの招待もむなしくなった。」
    観音菩薩「その妖猿は、どこの生まれでしょうか。」
    玉帝「あれは東勝神洲、傲来国の花果山で、石の卵から生まれたものだ。生まれたとき、目から金色の光を放ち、斗の星々の府まで射し貫いた。初めは気に留めなかったが、その後、妖術を身につけ、竜を降し虎を伏せ、自ら死者の名簿から名を削った。竜王や閻王から訴えがあったので、朕は捕らえようとした。すると長庚星が『三界では、九つの穴を持つものなら、いずれも仙人になれます』と申し立てた。そこで朕は教え導いて賢き者を育てようと、天界へ呼び、御馬監の弼馬温に任じたのだ。ところが、あやつは官職が低いと嫌がり、天宮に背いた。李天王と哪吒太子を差し向けて降伏させようとし、その後、また詔を下してなだめ、天界へ呼び戻して斉天大聖に任じた。ただし官名だけで俸禄はない。任される仕事もなく、東へ西へと遊び歩くので、また騒動を起こしてはと、蟠桃園の管理を命じた。すると法に従わず、老木の大桃をすっかり盗み食いしたのだ。宴を開くに当たっては、俸禄のない者ゆえ招かなかった。あやつは計略で赤脚大仙を欺き、その姿に化けて宴に入り、仙界の料理も酒もすっかり盗み食いし、さらに老君の仙丹を盗み、御酒もいくらか盗んで、生まれ故郷の猿どもと楽しんでいる。そのため朕は心を悩ませ、十万の天兵を動かし、天羅地網を張って降伏させようとしている。この一日、報告がなく、勝敗はまだ分からぬ。」
    観音菩薩は聞き終えると、恵岸行者に命じた。
    観音菩薩「急いで天宮を下り、花果山へ行って戦況を調べなさい。戦いに出会ったら、力を貸してもよい。必ず確かなところを報告するのですよ。」
  "translation_status": "draft"
- "id": "xy-ch06-004"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "惠岸行者整整衣裙，執一條鐵棍，駕雲離闕，徑至山前。見那天羅地網，密密層層，各營門提鈴喝號，將那山圍繞的水泄不通。惠岸立住叫：「把營門的天丁，煩你傳報：我乃李天王二太子木吒──南海觀音大徒弟惠岸，特來打探軍情。」那營裡五岳神兵，即傳入轅門之內。早有虛日鼠、昴日雞、星日馬、房日兔，將言傳到中軍帳下。李天王發下令旗，教開天羅地網，放他進來。此時東方才亮，惠岸隨旗進入，見四大天王與李天王下拜。拜訖，李天王道：「孩兒，你自那廂來者？」惠岸道：「愚男隨菩薩赴蟠桃會，菩薩見勝會荒涼，瑤池寂寞，引眾仙並愚男去見玉帝。玉帝備言父王等下界收伏妖猴，一日不見回報，勝負未知，菩薩因命愚男到此打聽虛實。」李天王道：「昨日到此安營下寨，著九曜星挑戰，被這廝大弄神通，九曜星俱敗走而回。後我等親自提兵，那廝也排開陣勢。我等十萬天兵，與他混戰至晚，他使個分身法戰退。及收兵查勘時，止捉得些狼蟲虎豹之類，不曾捉得他半個妖猴。今日還未出戰。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"

  "source_text": "卻說那大聖已至灌江口，搖身一變，變作二郎爺爺的模樣，按下雲頭，徑入廟裡。鬼判不能相認，一個個磕頭迎接。他坐中間，點查香火：見李虎拜還的三牲，張龍許下的保福，趙甲求子的文書，錢丙告病的良願。正看處，有人報：「又一個爺爺來了。」眾鬼判急急觀看，無不驚心。真君卻道：「有個甚麼齊天大聖，才來這裡否？」眾鬼判道：「不曾見甚麼大聖，只有一個爺爺在裡面查點哩。」真君撞進門，大聖見了，現出本相道：「郎君不消嚷，廟宇已姓孫了。」這真君即舉三尖兩刃神鋒，劈臉就砍。那猴王使個身法，讓過神鋒。掣出那繡花針兒，幌一幌，碗來粗細，趕到前，對面相還。兩個嚷嚷鬧鬧，打出廟門，半霧半雲，且行且戰，復打到花果山。慌得那四大天王等眾，隄防愈緊。這康、張太尉等迎著真君，合心努力，把那美猴王圍繞不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 159
    "line_end": 159
    "source_sequence": 24
  "translation_ja": |-
    さて、斉天大聖はもう灌江口へ着いていた。身を振るわせて二郎真君の姿に化け、雲を降りると、まっすぐ廟に入った。鬼判たちは見分けられず、一人一人、額を地につけて迎えた。斉天大聖は中央に座り、奉納物や祈願を調べた。李虎がお礼参りに供えた三牲、張竜が福を守ってもらうために立てた誓願、趙甲が子を求める祈願書、銭丙が病の平癒を願う申し立てなどがある。見ているところへ知らせが来た。
    報告者「もう一人、お殿さまがおいでになりました。」
    鬼判たちは急いで見に行き、誰もが仰天した。二郎真君が尋ねた。
    二郎真君「斉天大聖とかいう者が、たった今ここへ来なかったか。」
    鬼判たち「大聖などは見ておりません。ただ、お殿さまがお一人、中で調べておられます。」
    二郎真君が門から駆け込むと、斉天大聖はその姿を見てもとの姿を現した。
    斉天大聖「若旦那、騒ぐには及ばない。この廟はもう孫のものになったぞ。」
    二郎真君はただちに三尖両刃の神槍を振り上げ、顔めがけて斬りつけた。斉天大聖は身をかわして槍をよけ、刺繍針を取り出してひと振りし、椀ほどの太さにすると、前へ進んで真っ向から打ち返した。二人は大騒ぎしながら廟の門を打って出て、霧と雲の間を、進みながら戦い、また花果山まで戻ってきた。四大天王たちは慌てて、いっそう警戒を厳しくした。康・張の太尉らは二郎真君を迎え、心と力を合わせて斉天大聖を囲んだ。この話はひとまずおく。

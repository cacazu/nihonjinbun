  "translation_status": "draft"
- "id": "xy-ch06-002"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言天神圍繞，大聖安歇。話表南海普陀落伽山大慈大悲救苦救難靈感觀世音菩薩，自王母娘娘請赴蟠桃大會，與大徒弟惠岸行者，同登寶閣瑤池，見那裡荒荒涼涼，席面殘亂；雖有幾位天仙，俱不就座，都在那裡亂紛紛講論。菩薩與眾仙相見畢，眾仙備言前事。菩薩道：「既無盛會，又不傳杯，汝等可跟貧僧去見玉帝。」眾仙怡然隨往。至通明殿前，早有四大天師、赤腳大仙等眾俱在此，迎著菩薩，即道玉帝煩惱，調遣天兵，擒怪未回等因。菩薩道：「我要見見玉帝，煩為轉奏。」天師丘弘濟即入靈霄寶殿，啟知宣入。時有太上老君在上，王母娘娘在後。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"

    "status": "open"
    "message_ja": "観音の説明は六怪、後の二郎の詩は八怪となる。底本の相違を保持し、数を整合させていない。"
- "id": "xy-ch06-011"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那鬼王領了旨，即駕起雲，徑至灌江口，不消半個時辰，直至真君之廟。早有把門的鬼判傳報至裡道：「外有天使，捧旨而至。」二郎即與眾弟兄出門迎接旨意，焚香開讀。旨意上云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 134
    "line_end": 134
    "source_sequence": 11
  "translation_ja": |-
    大力鬼王は勅命を受け取ると、すぐに雲に乗り、まっすぐ灌江口へ向かった。半時（はんとき・推定。一時の半分ほどの短い時間）にも満たぬうちに、二郎真君（じろうしんくん。玉帝の甥で、変化の術に優れた神将）の廟（びょう・推定。神や祖先を祭る建物）へ着いた。門を守る鬼判（きはん・推定。ここでは二郎真君の廟を守る鬼の役人）が、早くも中へ知らせた。
    門番の鬼判「外に天界の使者が、勅命を携えておいでです。」
    二郎真君は兄弟たちとともに門を出て勅命を迎え、香を焚いて開いた。そこにはこうあった。
  "translation_status": "draft"
- "id": "xy-ch06-012"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "花果山妖猴齊天大聖作亂：因在宮偷桃、偷酒、偷丹，攪亂蟠桃大會，見著十萬天兵、一十八架天羅地網，圍山收伏，未曾得勝。今特調賢甥同義兄弟即赴花果山助力剿除。成功之後，高陞重賞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 135
    "line_end": 135
    "source_sequence": 12
  "translation_ja": "花果山の妖猿、斉天大聖が乱をなした。天宮で桃、酒、丹薬（たんやく・推定。不老長生を求めて練り上げる薬）を盗み、蟠桃大会をかき乱したため、現在、十万の天兵と十八重の天羅地網で山を囲み、降伏させようとしているが、いまだ勝利を得ていない。よって、わが賢き甥に特に命じる。義兄弟とともにただちに花果山へ赴き、討伐に力を貸すべし。成功の後には高く位を進め、厚く賞する。"
  "translation_status": "draft"
- "id": "xy-ch06-013"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真君大喜道：「天使請回，吾當就去拔刀相助也。」鬼王回奏不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 137
    "line_end": 137
    "source_sequence": 13
  "translation_ja": |-
    二郎真君は大いに喜んで言った。
    二郎真君「使者殿、どうぞお戻りください。私はすぐに駆けつけ、刀を抜いて力を貸しましょう。」
    大力鬼王が戻って報告したことは、ここでは述べない。
  "translation_status": "draft"
- "id": "xy-ch06-014"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這真君即喚梅山六兄弟乃康、張、姚、李四太尉，郭申、直健二將軍，聚集殿前道：「適才玉帝調遣我等往花果山收降妖猴，同去去來。」眾兄弟俱忻然願往。即點本部神兵，駕鷹牽犬，搭弩張弓，縱狂風，霎時過了東洋大海，徑至花果山。見那天羅地網密密層層，不能前進，因叫道：「把天羅地網的神將聽著：吾乃二郎顯聖真君，蒙玉帝調來，擒拿妖猴者，快開營門放行。」一時，各神一層層傳入。四大天王與李天王俱出轅門迎接。相見畢，問及勝敗之事，天王將上項事備陳一遍。真君笑道：「小聖來此，必須與他鬥個變化。列公將天羅地網不要幔了頂上，只四圍緊密，讓我賭鬥。若我輸與他，不必列公相助，我自有兄弟扶持；若贏了他，也不必列公綁縛，我自有兄弟動手。只請托塔天王與我使個照妖鏡，住立空中。恐他一時敗陣，逃竄他方，切須與我照耀明白，勿走了他。」天王各居四維，眾天兵各挨排列陣去訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 139
    "line_end": 139
    "source_sequence": 14
  "translation_ja": |-
    二郎真君は、梅山の六兄弟（ばいざんのろくきょうだい・推定。二郎真君と義兄弟の契りを結んだ六人の神将）、すなわち康（こう・推定。梅山六兄弟に数えられる四太尉の一人）・張（ちょう・推定。梅山六兄弟に数えられる四太尉の一人）・姚（よう・推定。梅山六兄弟に数えられる四太尉の一人）・李（り・推定。梅山六兄弟に数えられる四太尉の一人）の四太尉（したいい・推定。康・張・姚・李の四人の神将）と、郭申（かくしん・推定。梅山六兄弟に数えられる二将軍の一人）・直健（ちょくけん・推定。梅山六兄弟に数えられる二将軍の一人）の二将軍（にしょうぐん・推定。郭申と直健の二人の神将）を呼び、殿前に集めて言った。
    二郎真君「たった今、玉帝から我々に、花果山へ行って妖猿を降伏させよとの命令があった。一緒に出かけよう。」
    兄弟たちは皆、喜んで応じた。さっそく配下の神兵を集め、鷹を腕に据え、犬を引き、弩（ど。台と引き金の仕組みを備えた弓）に矢をつがえ、弓を張り、猛烈な風を起こした。たちまち東の大海を越え、花果山へ着いたが、天羅地網が何重にも張り巡らされ、先へ進めない。そこで二郎真君が呼ばわった。
    二郎真君「天羅地網を守る神将たち、聞け。私は二郎顕聖真君（じろうけんせいしんくん・推定。二郎真君の正式な称号の一つ）だ。玉帝の命により、妖猿を捕らえに来た。早く陣門を開いて通せ。」
    神々は次々と奥へ取り次いだ。四大天王と李天王はそろって軍門を出て迎えた。挨拶を済ませ、勝敗の様子を尋ねると、李天王が先の出来事を詳しく話した。二郎真君は笑って言った。
    二郎真君「この小聖（しょうせい・推定。大聖に対して用いられる二郎真君の呼び名）が来た以上、ぜひあれと変化（へんげ。術によって姿や形を変えること）の術を競いましょう。皆さん、天羅地網の上は覆わず、四方だけを隙間なく固め、私に勝負をさせてください。私が負けても、皆さんの助けは要りません。兄弟たちが支えてくれます。勝った場合も、皆さんが縛るには及びません。兄弟たちが手を下します。ただ、托塔天王（たくとうてんのう。宝塔を持つ李天王の別名）には照妖鏡（しょうようきょう・推定。妖怪が姿を変えても正体や居場所を映す鏡）を持って、空中に立っていただきたい。あれが敗れてどこかへ逃げるかもしれません。必ず鏡ではっきりと照らし、逃がさないでください。」
    天王たちは四隅の持ち場につき、天兵たちも順に並んで陣を整えた。
  "translation_status": "draft"
- "id": "xy-ch06-015"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這真君領著四太尉、二將軍，連本身七兄弟，出營挑戰；吩咐眾將緊守營盤，收全了鷹犬。眾草頭神得令。真君只到那水簾洞外，見那一群猴齊齊整整，排作個蟠龍陣勢。中軍裡立一竿旗，上書「齊天大聖」四字。真君道：「那潑妖，怎麼稱得起齊天之職？」梅山六弟道：「且休讚嘆，叫戰去來。」那營口小猴見了真君，急走去報知。那猴王即掣金箍棒，整黃金甲，登步雲履，按一按紫金冠，騰出營門，急睜睛觀看，那真君的相貌果是清奇，打扮得又秀氣。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 140
    "line_end": 140
    "source_sequence": 15
  "translation_ja": |-
    二郎真君は四太尉と二将軍を率い、自分を合わせた七兄弟で陣を出て戦いを挑んだ。その際、将兵には陣地を堅く守り、鷹も犬もすべて引き収めておくよう言いつけた。草頭神たちは命を受けた。二郎真君が水簾洞（すいれんどう。滝の裏に隠れた、猿たちの住まいとなる洞窟）の外へ来ると、猿の群れが整然と、とぐろを巻く竜の陣を組んでいた。中軍には旗が一本立ち、「斉天大聖」の四字が書いてある。
    二郎真君「あの不埒（ふらち・推定。道理や礼儀に外れていること）な妖怪が、どうして天に等しい官職などと名乗れるのだ。」
    梅山六兄弟（ばいざんろくきょうだい・推定。二郎真君と義兄弟の契りを結んだ六人の神将）「感心している場合ではありません。戦いを挑みましょう。」
    陣の入口の小猿は二郎真君を見つけ、急いで知らせに走った。斉天大聖はさっそく如意金箍棒を抜き、黄金の鎧を整え、雲を踏む靴を履き、紫金（しきん。紫がかった色合いを持つ良質の金）の冠を押さえて陣門から躍り出た。目を見開いて眺めると、二郎真君の顔立ちはまことにすがすがしく非凡で、身なりも美しい。その姿は、まさにこうである。
  "translation_status": "draft"
- "id": "xy-ch06-016"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    儀容清俊貌堂堂，兩耳垂肩目有光。
    頭戴三山飛鳳帽，身穿一領淡鵝黃。
    縷金靴襯盤龍襪，玉帶團花八寶粧。
    腰挎彈弓新月樣，手執三尖兩刃槍。
    斧劈桃山曾救母，彈打鋋羅雙鳳凰。
    力誅八怪聲名遠，義結梅山七聖行。
    心高不認天家眷，性傲歸神住灌江。
    赤城昭惠英靈聖，顯化無邊號二郎。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 142
    "line_end": 149
    "source_sequence": 16
  "translation_ja": |-
    容貌は清らかに秀で、堂々として、両耳は肩に垂れ、目には光がある。
    頭に三山飛鳳の帽（さんざんひほうのぼう・推定。三つの山形と飛ぶ鳳凰で飾った二郎真君の帽子）を戴き、身には淡い鵞黄色（がこうしょく・推定。ガチョウのひなの羽のような淡い黄色）の衣をまとう。
    金糸の靴に盤竜（ばんりゅう・推定。とぐろを巻いた竜の姿や、その模様）の襪（くつした・推定。足に直接はく布の覆い）を合わせ、玉の帯は丸い花文と八宝（はっぽう・推定。八種の宝物や宝飾）で飾られる。
    腰に新月形の弾弓（だんきゅう。矢の代わりに小石などの弾を飛ばす弓）を掛け、手には三尖両刃の槍（さんせんりょうじんのやり・推定。先が三つに尖り、両側に刃のある二郎真君の槍）を持つ。
    かつて斧で桃山（とうざん・推定。二郎真君が母を救うため割ったという山）を割って母を救い、弾で鋋羅（せんら・推定。二郎真君が鳳凰を撃った場所として詩に現れる名。由来は未詳）の二羽の鳳凰（ほうおう。中国の伝説に登場する、めでたい鳥）を撃った。
    力を振るって八怪（はっかい・推定。二郎真君が討ったと詩にいう八体の妖怪。先の六怪とは数が異なる）を討ち、名は遠くにとどろき、梅山で義を結んで七聖（しちせい・推定。二郎真君と梅山六兄弟を合わせた七人）の列をなす。
    志は高く、天帝（てんてい・推定。天界を治める帝王。ここでは玉帝）の身内を名乗るのを潔しとせず、誇り高く、神として灌江（かんこう・推定。二郎真君が住む土地の呼び名。灌江口に対応する）に住む。
    赤城（せきじょう・推定。二郎真君をたたえる尊号に現れる地名と読まれる語。場所は未確定）の昭恵（しょうけい・推定。二郎真君をたたえる尊号の一部）、霊威あらたかな聖者、果てしなく霊験を現す、その名は二郎（じろう・推定。二郎真君の略称）。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "鋋羅は底本の字を保持した。固有名の由来・読み、および帰神の細かな含意は未確定。八怪は前段の六怪との相違を保持。"
- "id": "xy-ch06-017"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖見了，笑嘻嘻的將金箍棒掣起，高叫道：「你是何方小將，輒敢大膽到此挑戰？」真君喝道：「你這廝有眼無珠，認不得我麼？吾乃玉帝外甥、敕封昭惠靈顯王二郎是也。今蒙上命，到此擒你這造反天宮的弼馬溫猢猻，你還不知死活。」大聖道：「我記得當年玉帝妹子思凡下界，配合楊君，生一男子，曾使斧劈桃山的，是你麼？我行要罵你幾聲，曾奈無甚冤仇；待要打你一棒，可惜了你的性命。你這郎君小輩，可急急回去，喚你四大天王出來。」真君聞言，心中大怒道：「潑猴！休得無禮，吃吾一刃。」大聖側身躲過，疾舉金箍棒，劈手相還。他兩個這場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 150
    "line_end": 150
    "source_sequence": 17
  "translation_ja": |-
    斉天大聖はそれを見ると、にやにや笑って如意金箍棒を構え、大声を上げた。
    斉天大聖「お前はどこの小将だ。よくも大胆に、ここへ戦いを挑みに来たな。」
    二郎真君は一喝した。
    二郎真君「目があっても節穴か。私が分からぬのか。私は玉帝の甥、昭恵霊顕王（しょうけいれいけんおう・推定。玉帝が二郎真君に授けた王の称号）の勅封（ちょくほう・推定。帝王の命令で爵位や称号を授けること）を受けた二郎だ。今、上の命を受け、天宮に背いた弼馬温の猿め、お前を捕らえに来たのだ。まだ命が惜しくないらしいな。」
    斉天大聖「覚えているぞ。昔、玉帝の妹が人の世を慕って下界へ下り、楊（よう・推定。二郎真君の父とされる人間の男の姓）という男と夫婦になって、一人の男の子を産んだ。斧で桃山を割ったのは、お前か。二、三言罵ってやろうにも、大した恨みはない。棒で打ってやろうにも、お前の命が惜しい。お前のような若造はさっさと帰って、四大天王を呼んでこい。」
    二郎真君は聞くと、心底怒った。
    二郎真君「不埒な猿め、無礼を働くな。私の刃を受けてみよ！」
    斉天大聖は身をかわし、すばやく如意金箍棒を振り上げ、真っ向から打ち返した。二人の戦いのすさまじさは、こうである。
  "translation_status": "draft"
- "id": "xy-ch06-018"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": "昭惠二郎神，齊天孫大聖。這個心高欺敵美猴王，那個面生壓伏真梁棟。兩個乍相逢，各人皆賭興。從來未識淺和深，今日方知輕與重。鐵棒賽飛龍，神鋒如舞鳳。左擋右攻，前迎後映。這陣上梅山六弟助威風，那陣上馬流四將傳軍令。搖旗擂鼓各齊心，吶喊篩鑼都助興。兩個鋼刀有見機，一來一往無絲縫。金箍棒是海中珍，變化飛騰能取勝。若還身慢命該休，但要差池為蹭蹬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 152
    "line_end": 152
    "source_sequence": 18
  "translation_ja": |-
    昭恵の二郎神（じろうしん・推定。二郎真君の別名）と、斉天（せいてん・推定。斉天大聖の称号を縮めた表現）の孫大聖（そんたいせい・推定。孫悟空の姓と大聖の称号を合わせた呼び名）。
    こちらは誇り高く敵を侮る美猴王（びこうおう。孫悟空の、立派な猿の王という称号）、あちらは初対面の相手を威圧する、まことの大黒柱。
    初めて出会った二人は、互いに意地を賭けて戦う。
    これまで相手の深さを知らず、今日ようやくその重みを知る。
    鉄の棒は飛竜にも勝り、神の刃は舞う鳳凰のよう。
    左を防いで右を攻め、前で迎えて後ろで受ける。
    向こうの陣では梅山の六弟（ばいざんのろくてい・推定。二郎真君の六人の義弟。梅山六兄弟と同じ）が威勢を添え、こちらの陣では馬（ば・推定。孫悟空の配下の馬元帥を略した名）・流（りゅう・推定。孫悟空の配下の流元帥を略した名）ら四将（ししょう・推定。ここでは孫悟空の配下の四健将）が軍令を伝える。
    旗を振り太鼓を打って心を合わせ、叫んで銅鑼（どら。円い金属板を打ち鳴らす打楽器）を鳴らし、双方の闘志をあおる。
    二人の鋼の刃は機をうかがい、往来には一筋の隙間もない。
    金箍棒（きんこぼう・推定。金のたがの付いた如意金箍棒の略称）は海中の宝、変化し飛び舞って勝ちを取る。
    身の動きが遅ければ命はなく、ほんのわずかな誤りがつまずきとなる。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "原文は兩個鋼刀とするが、前後の武器は鉄棒と神槍である。詩の表現を鋼の刃と訳し、原字を修正していない。面生壓伏の構文の細義も留保する。"
- "id": "xy-ch06-019"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真君與大聖鬥經三百餘合，不知勝負。那真君抖擻神威，搖身一變，變得身高萬丈，兩隻手舉著三尖兩刃神鋒，好便似華山頂上之峰，青臉獠牙，朱紅頭髮，惡狠狠，望大聖著頭就砍。這大聖也使神通，變得與二郎身軀一樣，嘴臉一般，舉一條如意金箍棒，卻就是崑崙頂上擎天之柱，抵住二郎神。諕得那馬、流元帥戰兢兢，搖不得旌旗；崩、芭二將虛怯怯，使不得刀劍。這陣上，康、張、姚、李、郭申、直健傳號令，撒放草頭神，向他那水簾洞外縱著鷹犬，搭弩張弓，一齊掩殺。可憐沖散妖猴四健將，捉拿靈怪二三千。那些猴拋戈棄甲，撇劍丟槍，跑的跑，喊的喊，上山的上山，歸洞的歸洞。好似夜貓驚宿鳥，飛灑滿天星。眾兄弟得勝不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 153
    "line_end": 153
    "source_sequence": 19
  "translation_ja": "二郎真君と斉天大聖は三百余合戦ったが、勝負はつかなかった。二郎真君は神威（しんい・推定。神の恐るべき力）を奮い起こし、身を振るわせると、背丈一万丈（じょう・推定。昔の長さの単位。一丈は十尺）の巨体に変じた。両手で掲げる三尖両刃の神槍（さんせんりょうじんのしんそう・推定。先が三つに尖り、両側に刃のある二郎真君の槍）は、まるで華山（かざん。中国五岳の一つに数えられる険しい山）の頂の峰のようだった。顔は青く、牙をむき、髪は朱色に赤く、恐ろしい形相で斉天大聖の頭めがけて斬りつけた。斉天大聖も神通力を使い、二郎真君と同じ体格、同じ顔つきに変わった。如意金箍棒を振り上げると、まるで崑崙山（こんろんざん。中国の伝説で仙人や神々が住む西方の山）の頂で天を支える柱のようで、二郎真君を受け止めた。馬・流の両元帥は恐ろしさに震え、旗を振れず、崩（ほう・推定。孫悟空の配下の崩将軍を略した名）・芭（は・推定。孫悟空の配下の芭将軍を略した名）の二将もおじけづき、刀や剣を使えなくなった。一方、康・張・姚・李・郭申・直健は号令を伝え、草頭神を繰り出した。水簾洞の外へ鷹と犬を放ち、弩に矢をつがえ、弓を張って、一斉に攻めかかった。哀れ、妖猿の四健将（しけんしょう・推定。馬元帥・流元帥・崩将軍・芭将軍の四人の勇将）は蹴散らされ、霊怪（れいかい・推定。不思議な力を持つ妖怪）二、三千が捕らえられた。猿たちは戈（ほこ・推定。長い柄に横向きの刃を付けた武器）を投げ、鎧を捨て、剣も槍も放り出した。逃げる者、叫ぶ者、山へ上る者、洞へ戻る者。まるでフクロウがねぐらの鳥を驚かせ、空いっぱいに星をまき散らすようだった。兄弟たちの勝利については、ひとまずおく。"
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "resolved"
    "message_ja": "夜貓は教育部辞典の夜貓子の語義と文脈からフクロウと解した。具体的な種までは同定しない。"
- "id": "xy-ch06-020"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說真君與大聖變做法天象地的規模，正鬥時，大聖忽見本營中妖猴驚散，自覺心慌，收了法象，掣棒抽身就走。真君見他敗走，大步趕上道：「那裡走？趁早歸降，饒你性命。」大聖不戀戰，只情跑起。將近洞口，正撞著康、張、姚、李四太尉，郭申、直健二將軍，一齊帥眾擋住道：「潑猴！那裡走？」大聖慌了手腳，就把金箍棒捏做繡花針，藏在耳內。搖身一變，變作個麻雀兒，飛在樹梢頭釘住。那六兄弟慌慌張張，前後尋覓不見，一齊吆喝道：「走了這猴精也！走了這猴精也！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 155
    "line_end": 155
    "source_sequence": 20
  "translation_ja": |-
    さて、二郎真君と斉天大聖は天地にかたどった巨大な姿になり、戦い続けていた。ふと斉天大聖は、自陣の猿たちが驚いて散り散りになるのを見て、気が動転した。巨大な姿を収め、棒を手に身を引いて逃げ出した。二郎真君は敗走するのを見ると、大股で追いかけた。
    二郎真君「どこへ行く。早く降伏すれば、命は助けてやる。」
    斉天大聖は戦いに未練を残さず、ひたすら走った。洞の入口近くで、康・張・姚・李の四太尉と、郭申・直健の二将軍に出くわした。六人はそろって兵を率い、行く手を遮った。
    梅山六兄弟「不埒な猿め、どこへ行く！」
    斉天大聖は慌てふためき、如意金箍棒をつまんで刺繍針ほどに縮め、耳にしまった。身を振るわせて雀に変わると、梢へ飛び上がってぴたりと止まった。六兄弟はあちこち慌ただしく捜したが見つからず、声をそろえて叫んだ。
    梅山六兄弟「猿の妖怪が逃げたぞ！　猿の妖怪が逃げたぞ！」
  "translation_status": "draft"
- "id": "xy-ch06-021"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正嚷處，真君到了，問：「兄弟們，趕到那廂不見了？」眾神道：「才在這裡圍住，就不見了。」二郎圓睜鳳目觀看，見大聖變了麻雀兒，釘在樹上。就收了法象，撇了神鋒，卸下彈弓。搖身一變，變作個鷂鷹兒，抖開翅，飛將去撲打。大聖見了，颼的一翅飛起去，變作一只大鶿老，沖天而去。二郎見了，急抖翎毛，搖身一變，變作一隻大海鶴，鑽上雲霄來嗛。大聖又將身按下，入澗中，變作一個魚兒，淬入水內。二郎趕至澗邊，不見蹤跡。心中暗想道：「這猢猻必然下水去也，定變作魚蝦之類。等我再變變拿他。」果一變，變作個魚鷹兒，飄蕩在下溜頭波面上，等待片時。那大聖變魚兒，順水正游，忽見一隻飛禽：似青鷂，毛片不青；似鷺鷥，頂上無纓；似老鸛，腿又不紅：「想是二郎變化了等我哩！」急轉頭，打個花就走。二郎看見道：「打花的魚兒：似鯉魚，尾巴不紅；似鱖魚，花鱗不見；似黑魚，頭上無星；似魴魚，鰓上無針。他怎麼見了我就回去了？必然是那猴變的。」趕上來，刷的啄一嘴。那大聖就攛出水中，一變，變作一條水蛇，游近岸，鑽入草中。二郎因嗛他不著，他見水響中，見一條蛇攛出去，認得是大聖。急轉身，又變了一隻朱繡頂的灰鶴，伸著一個長嘴，與一把尖頭鐵鉗子相似，徑來吃這水蛇。水蛇跳一跳，又變做一隻花鴇，木木樗樗的，立在蓼汀之上。二郎見他變得低賤，（花鴇乃鳥中至賤至淫之物，不拘鸞、鳳、鷹、鴉，都與交群）故此不去攏傍。即現原身，走將去，取過彈弓，拽滿，一彈子把他打個躘踵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 156
    "line_end": 156
    "source_sequence": 21
  "translation_ja": |-
    騒いでいるところへ二郎真君が来て、尋ねた。
    二郎真君「弟たち、どこまで追って見失ったのだ。」
    梅山六兄弟「今しがた、ここで取り囲んだのに、いなくなったのです。」
    二郎真君は鳳凰のような目を見開いて眺め、斉天大聖が雀になって木に止まっているのを見つけた。そこで巨大な姿を収め、神槍（しんそう・推定。二郎真君が使う三尖両刃の神槍の略称）を置き、弾弓を外した。そして身を振るわせて鷂鷹（ようよう・推定。鷹の仲間を表す鳥名）となり、翼を広げて襲いかかった。斉天大聖はそれを見るや、ひと羽ばたきで飛び立ち、大きな鵜（う・推定。水に潜って魚を捕る水鳥の仲間）となって空へ昇った。二郎真君は急いで羽毛を震わせ、大きな海鶴（かいかく・推定。海辺の大きな鶴のような鳥。詳しい種は未確定）に変わり、雲の高みへ突き進んでついばもうとした。斉天大聖は身を低く落とし、谷川に入ると、一匹の魚に変わって水中へ潜った。二郎真君は川辺まで追ったが、姿がない。心の中で考えた。
    二郎真君「この猿は、きっと水に入ったのだ。魚か海老の類に変わったに違いない。私ももう一度変わって捕まえよう。」
    そこで魚鷹（うおたか。魚を捕って食べる鳥。ここでの種は未確定）に変わり、下流の波の上を漂いながら、しばらく待った。魚になった斉天大聖は流れに沿って泳いでいたが、ふと一羽の鳥を見つけた。青い鷂（はいたか。小型の鷹を表す鳥名）かと思えば羽は青くなく、白鷺（しらさぎ・推定。白い羽を持つサギの仲間）かと思えば頭に飾り羽がなく、コウノトリかと思えば脚が赤くない。
    斉天大聖「二郎が化けて、俺を待ち構えているんだな！」
    すばやく頭を返し、水しぶきを上げて逃げた。二郎真君はそれを見て言った。
    二郎真君「あの水しぶきを上げる魚は、鯉にしては尾が赤くなく、桂魚（けいぎょ・推定。中国にすむ、体に斑模様のある淡水魚）にしては斑の鱗がない。雷魚（らいぎょ・推定。頭が平たく、淡水にすむ大型の魚の仲間）にしては頭に星のような斑がなく、魴（ほう・推定。中国にすむ、体が左右に平たいコイ科の魚の名）にしては鰓に針がない。私を見るなり引き返したのはなぜだ。必ずあの猿が化けたものだ。」
    追いついて、さっと一つついばんだ。斉天大聖は水から飛び出し、水蛇（すいだ・推定。水辺にすみ、水中を泳ぐ蛇）に変わって岸へ泳ぎ寄り、草むらに潜った。二郎真君はついばみ損ねたが、水音の中で蛇が飛び出すのを見て、斉天大聖だと見抜いた。すぐに身を翻し、頭頂に朱を縫い取ったような灰色の鶴に変わった。先の尖った鉄の火箸そっくりの長い嘴を伸ばし、まっすぐ水蛇を食べに来た。水蛇はひと跳ねして、今度は花鴇（かほう・推定。背にまだら模様のある、雁に似た大きな鳥）になり、ぼんやりと蓼（たで・推定。水辺などに生える、細かい花をつける草）の生えた水辺に立った。二郎真君は、相手が卑しいものに化けたのを見て、近づこうとしなかった。（花鴇は鳥の中でも最も卑しく淫らなもので、鸞、鳳凰、鷹、烏を問わず、どれとも交わるという。）二郎真君はもとの姿に戻り、歩み寄って弾弓を取り、いっぱいに引き絞ると、弾を一発放って相手をよろめかせた。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "鶿老・海鶴・魚鷹・花鴇は物語の鳥名として訳し、現代の分類への厳密な同定は留保する。魚の特徴の列挙も原文どおり。花鴇に関する括弧内は語り手の俗説であり科学的説明ではない。"
- "id": "xy-ch06-022"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖趁著機會，滾下山崖，伏在那裡又變，變一座土地廟兒：大張著口，似個廟門；牙齒變做門扇；舌頭變做菩薩；眼睛變做窗櫺；只有尾巴不好收拾，豎在後面，變做一根旗竿。真君趕到崖下，不見打倒的鴇鳥，只有一間小廟。急睜鳳眼，仔細看之，見旗竿立在後面，笑道：「是這猢猻了，他今又在那裡哄我。我也曾見廟宇，更不曾見一個旗竿豎在後面的。斷是這畜生弄諠。他若哄我進去，他便一口咬住。我怎肯進去？等我掣拳先搗窗櫺，後踢門扇。」大聖聽得，心驚道：「好狠，好狠！門扇是我牙齒，窗櫺是我眼睛，若打了牙，搗了眼，卻怎麼是好？」撲的一個虎跳，又冒在空中不見。"

    第六回
    観音、宴に赴いて騒動のわけを問い　小聖、威を振るって大聖を降す
  "translation_status": "draft"
- "id": "xy-ch06-002"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言天神圍繞，大聖安歇。話表南海普陀落伽山大慈大悲救苦救難靈感觀世音菩薩，自王母娘娘請赴蟠桃大會，與大徒弟惠岸行者，同登寶閣瑤池，見那裡荒荒涼涼，席面殘亂；雖有幾位天仙，俱不就座，都在那裡亂紛紛講論。菩薩與眾仙相見畢，眾仙備言前事。菩薩道：「既無盛會，又不傳杯，汝等可跟貧僧去見玉帝。」眾仙怡然隨往。至通明殿前，早有四大天師、赤腳大仙等眾俱在此，迎著菩薩，即道玉帝煩惱，調遣天兵，擒怪未回等因。菩薩道：「我要見見玉帝，煩為轉奏。」天師丘弘濟即入靈霄寶殿，啟知宣入。時有太上老君在上，王母娘娘在後。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 121
    "line_end": 121
    "source_sequence": 2
  "translation_ja": |-
    天神たちが山を囲み、斉天大聖（せいてんたいせい。孫悟空が名乗る、天と並ぶ偉大な聖者という称号）が休んでいる話は、ひとまずおく。さて、南海（なんかい・推定。四方の海のうち南にある海）の普陀落伽山（ふだらかさん・推定。南海にある、観音菩薩の住む霊山）に住む、大慈大悲（だいじだいひ・推定。苦しむ者すべてを救おうとする深い慈悲）、苦難を救う霊験（れいげん・推定。神仏の不思議な効き目）あらたかな観世音菩薩（かんぜおんぼさつ。人々の苦しみを救う菩薩。観音菩薩とも呼ぶ）は、王母（おうぼ・推定。天界の女神で、蟠桃の宴を主催する）から蟠桃大会（ばんとうたいえ・推定。王母が仙桃を用意して神仙を招く宴）に招かれ、一番弟子の恵岸行者（えがんぎょうじゃ・推定。観音菩薩の一番弟子で、李天王の次男）とともに瑤池（ようち。王母が蟠桃の宴を開く天上の池のほとり）の宝閣（ほうかく・推定。宝で飾った立派な建物）へ上った。ところが辺りはひっそりして、宴の席は食い荒らされている。天仙（てんせん。天界に位を持つ仙人）も何人かいたが、誰も席に着かず、入り乱れて事情を話し合っていた。観音菩薩（かんのんぼさつ。人々の苦しみを救う菩薩。観世音菩薩と同じ）が仙人（せんにん・推定。修行によって不老長寿や不思議な力を得たとされる人）たちと挨拶を交わすと、皆がこれまでの出来事を詳しく語った。
    観音菩薩「宴もなく、杯も回らないのでしたら、私と一緒に玉帝（ぎょくてい・推定。天上の神々を治める帝王）にお目にかかりましょう。」
    仙人たちは喜んでついていった。通明殿（つうめいでん・推定。天界で来訪者が召されるのを待つ宮殿）の前には、すでに四大天師（しだいてんし・推定。玉帝への取り次ぎなどを務める四人の道教の仙人）や赤脚大仙（せききゃくだいせん・推定。裸足で歩く天上の大仙人）たちが集まっていた。一同は観音菩薩を迎え、玉帝が心を悩ませて天兵（てんぺい・推定。天界に仕える兵士）を派遣したこと、妖怪を捕らえる軍勢がまだ戻らないことなどを告げた。
    観音菩薩「玉帝にお目にかかりたいので、お取り次ぎをお願いします。」
    天師（てんし・推定。道教の徳の高い師への尊称）の丘弘済（きゅうこうさい・推定。玉帝に観音菩薩の来訪を取り次ぐ仙人）が霊霄宝殿（れいしょうほうでん・推定。玉帝が臣下たちを集める天上の宮殿）に入り、奏上（そうじょう・推定。帝王に申し上げること）して召し入れの許しを得た。そのとき太上老君（たいじょうろうくん。老子を神格化した道教の神）は上座に、王母は奥にいた。
  "translation_status": "draft"
- "id": "xy-ch06-003"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩引眾同入裡面，與玉帝禮畢，又與老君、王母相見，各坐下。便問：「蟠桃盛會如何？」玉帝道：「每年請會，喜喜歡歡；今年被妖猴作亂，甚是虛邀也。」菩薩道：「妖猴是何出處？」玉帝道：「妖猴乃東勝神洲傲來國花果山石卵化生的。當時生出，即目運金光，射沖斗府。始不介意，繼而成精，降龍伏虎，自削死籍。當有龍王、閻王啟奏。朕欲擒拿，是長庚星啟奏道：『三界之間，凡有九竅者，可以成仙。』朕即施教育賢，宣他上界，封為御馬監弼馬溫官。那廝嫌惡官小，反了天宮。即差李天王與哪吒太子收降，又降詔撫安，宣至上界，就封他做個齊天大聖，只是有官無祿。他因沒事幹管理，東遊西蕩。朕又恐別生事端，著他代管蟠桃園。他又不遵法律，將老樹大桃，盡行偷吃。及至設會，他乃無祿人員，不曾請他。他就設計賺哄赤腳大仙，卻自變他相貌入會，將仙殽仙酒盡偷吃了，又偷老君仙丹，又偷御酒若干，去與本山眾猴享樂。朕心為此煩惱，故調十萬天兵，天羅地網收伏。這一日不見回報，不知勝負如何。」菩薩聞言，即命惠岸行者道：「你可快下天宮，到花果山，打探軍情如何。如遇相敵，可就相助一功，務必的實回話。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"

  "source_text": "惠岸行者整整衣裙，執一條鐵棍，駕雲離闕，徑至山前。見那天羅地網，密密層層，各營門提鈴喝號，將那山圍繞的水泄不通。惠岸立住叫：「把營門的天丁，煩你傳報：我乃李天王二太子木吒──南海觀音大徒弟惠岸，特來打探軍情。」那營裡五岳神兵，即傳入轅門之內。早有虛日鼠、昴日雞、星日馬、房日兔，將言傳到中軍帳下。李天王發下令旗，教開天羅地網，放他進來。此時東方才亮，惠岸隨旗進入，見四大天王與李天王下拜。拜訖，李天王道：「孩兒，你自那廂來者？」惠岸道：「愚男隨菩薩赴蟠桃會，菩薩見勝會荒涼，瑤池寂寞，引眾仙並愚男去見玉帝。玉帝備言父王等下界收伏妖猴，一日不見回報，勝負未知，菩薩因命愚男到此打聽虛實。」李天王道：「昨日到此安營下寨，著九曜星挑戰，被這廝大弄神通，九曜星俱敗走而回。後我等親自提兵，那廝也排開陣勢。我等十萬天兵，與他混戰至晚，他使個分身法戰退。及收兵查勘時，止捉得些狼蟲虎豹之類，不曾捉得他半個妖猴。今日還未出戰。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 123
    "line_end": 123
    "source_sequence": 4
  "translation_ja": |-
    恵岸行者は衣を整え、鉄の棍（こん・推定。棒を振るって打つ武器）を一本携え、雲に乗って宮殿を離れ、まっすぐ山の前へ来た。天羅地網は幾重にも隙間なく張られ、各陣の門では鈴を鳴らし、号令をかけ、山を水も漏らさぬほどに囲んでいる。恵岸行者は立ち止まって呼ばわった。
    恵岸行者「陣門を守る天兵よ、お取り次ぎを願います。私は李天王の第二太子、木吒（もくた。恵岸行者の別名。木叉とも書く）、南海観音（なんかいかんのん・推定。南海の霊山に住む観音菩薩の呼び名）の一番弟子の恵岸（えがん・推定。恵岸行者の法名）です。戦況を調べに参りました。」
    陣内の五岳（ごがく・推定。中国の五つの聖山を司る神々）の神兵が、すぐに軍門の内へ伝えた。さらに虚日鼠（きょじつそ・推定。二十八宿の虚宿に当たる星の神）・昴日鶏（ぼうじつけい・推定。二十八宿の昴宿に当たる星の神）・星日馬（せいじつば・推定。二十八宿の星宿に当たる星の神）・房日兔（ぼうじつと・推定。二十八宿の房宿に当たる星の神）が、その言葉を中軍（ちゅうぐん・推定。軍勢の中心に置かれる本陣）の幕舎（ばくしゃ・推定。陣中に張る天幕の宿舎）へ伝えた。李天王は令旗（れいき・推定。軍勢に命令を伝える旗）を出し、天羅地網を開いて中へ通すよう命じた。ちょうど東の空が明るくなり始めたころだった。恵岸行者は旗に従って陣に入り、四大天王（しだいてんのう。天界を守り、兵を率いる四人の神将）と李天王に拝礼した。礼が済むと、李天王が尋ねた。
    李天王「お前は、どこから来たのだ。」
    恵岸行者「私は菩薩（ぼさつ。ここでは観音菩薩への略称・呼びかけ）さまに従って蟠桃の宴へ参りました。菩薩さまは宴が荒れ果て、瑤池がひっそりしているのをご覧になり、仙人の方々と私を連れて玉帝にお目にかかりました。玉帝は、父上たちが下界（げかい・推定。天界から見て下にある地上の世界）へ妖猿を降しに行かれたこと、一日たっても報告がなく、勝敗が分からないことを詳しくお話しになりました。そこで菩薩さまは、私にこちらで実情を調べるようお命じになったのです。」
    李天王「昨日ここに来て陣を置き、九曜星（くようせい・推定。九つの天体を神格化した星の神々）に戦いを挑ませたが、あやつが神通力（じんつうりき。修行によって得る、人の力を超えた不思議な能力）を大いに振るったので、九曜星は皆、敗れて戻った。その後、私たち自身が兵を率いて出ると、向こうも陣を敷いた。こちらの十万の天兵と夕方まで入り乱れて戦ったが、あやつは分身の術で我々を退けた。兵を引いて調べてみると、捕らえたのは狼や虎や豹などばかりで、妖猿は一匹も捕まらなかった。今日はまだ戦っておらぬ。」
  "translation_status": "draft"
- "id": "xy-ch06-005"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，只見轅門外有人來報道：「那大聖引一群猴精，在外面叫戰。」四大天王與李天王並太子正議出兵，木吒道：「父王，愚男蒙菩薩吩咐，下來打探消息，就說若遇戰時，可助一功。今不才願往，看他怎麼個大聖。」天王道：「孩兒，你隨菩薩修行這幾年，想必也有些神通，切須在意。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 124
    "line_end": 124
    "source_sequence": 5
  "translation_ja": |-
    話し終わらぬうちに、軍門の外から知らせが来た。
    報告者「斉天大聖が猿の妖怪の一団を率い、門の外で戦いを挑んでおります。」
    四大天王と李天王、太子が出陣について話し合っていると、恵岸行者が言った。
    恵岸行者「父上、私は菩薩さまから、下界の様子を調べ、戦いに出会えば力を貸してもよいと仰せつかりました。不肖（ふしょう・推定。自分を未熟な者としてへりくだる言い方）ながら、私が参って、どれほどの大聖（たいせい・推定。孫悟空の称号、斉天大聖の略）なのか見てきたく存じます。」
    李天王「お前も菩薩さまについて何年も修行してきたのだから、神通力も身につけたことだろう。だが、くれぐれも気をつけよ。」
  "translation_status": "draft"
- "id": "xy-ch06-006"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好太子，雙手掄著鐵棍，束一束繡衣，跳出轅門，高叫：「那個是齊天大聖？」大聖挺如意棒，應聲道：「老孫便是。你是甚人，輒敢問我？」木吒道：「吾乃李天王第二太子木叉，今在觀音菩薩寶座前為徒弟護教，法名惠岸是也。」大聖道：「你不在南海修行，卻來此見我做甚？」木吒道：「我蒙師父差來打探軍情，見你這般猖獗，特來擒你。」大聖道：「你敢說那等大話，且休走，吃老孫這一棒。」木吒全然不懼，使鐵棒劈手相迎。他兩個立那半山中，轅門外，這場好鬥："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 126
    "line_end": 126
    "source_sequence": 6
  "translation_ja": |-
    勇ましくも恵岸行者は、両手で鉄の棍を振るい、刺繍（ししゅう・推定。布に色糸で模様を縫い付けること）の衣を締め直して軍門から躍り出ると、大声を上げた。
    恵岸行者「斉天大聖とは、どいつだ。」
    斉天大聖は如意金箍棒（にょいきんこぼう。思いどおりに大きさを変える、金のたがの付いた鉄棒）を突き出して応じた。
    斉天大聖「この俺だ。お前こそ何者だ。よくも俺に尋ねたな。」
    恵岸行者「私は李天王の第二太子、木叉（もくさ・推定。恵岸行者の別表記。本文では木吒と同一人物）だ。今は観音菩薩の宝座の前で弟子として教えを守っている。法名（ほうみょう・推定。仏教の修行者として授かる名）は恵岸という。」
    斉天大聖「南海で修行もせず、俺のところへ何をしに来た。」
    恵岸行者「師の命で戦況を調べに来たが、お前のその横暴ぶりを見て、捕らえることにしたのだ。」
    斉天大聖「そんな大口をたたくとはな。逃げるなよ、この俺の棒を食らえ！」
    恵岸行者は少しも恐れず、鉄の棍を振るってまともに迎え撃った。二人は山の中腹、軍門の外に立ち、見事な戦いを繰り広げる。
  "translation_status": "draft"
- "id": "xy-ch06-007"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": "棍雖對棍鐵各異，兵縱交兵人不同。一個是太乙散仙呼大聖，一個是觀音徒弟正元龍。渾鐵棍乃千鎚打，六丁六甲運神功；如意棒是天河定，鎮海神珍法力洪。兩個相逢真對手，往來解數實無窮。這個的陰手棍萬千兇，繞腰貫索疾如風；那個的夾槍棒不放空，左遮右擋怎相容。那陣上旌旗閃閃，這陣上鼉鼓鼕鼕。萬員天將團團繞，一洞妖猴簇簇叢。怪霧愁雲漫地府，狼煙煞氣射天宮。昨朝混戰還猶可，今日爭持更又兇。堪羨猴王真本事，木吒復敗又逃生。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 127
    "line_end": 127
    "source_sequence": 7
  "translation_ja": |-
    棍と棍でも鉄は違い、武器と武器でも使う者は異なる。
    一方は大聖と呼ばれる太乙（たいいつ・推定。ここでは仙人の境地を表す道教の呼称）の散仙（さんせん・推定。天界の官職に拘束されない仙人）、一方は観音（かんのん。観音菩薩の略称）の弟子たる正元龍（せいげんりゅう・推定。この詩で恵岸行者を指す呼称。詳しい含意は未確定）。
    渾鉄（こんてつ・推定。全体が鉄でできていること）の棍は千たび鍛えられ、六丁六甲（ろくていろっこう・推定。干支の丁と甲にちなむ十二の守護神）が神の力を働かせたもの。
    如意の棒（にょいのぼう・推定。思いどおりに大きさを変える如意金箍棒の呼び名）は天河（てんが・推定。天上を流れる大河。天の川）を定め、海を鎮める神宝、その法力（ほうりき・推定。修行によって得た不思議な力）は広大だ。
    出会った二人はまさしく好敵手、繰り出す技は尽きることがない。
    こちらの陰手（いんしゅ・推定。棍の使い方をいう語。具体的な技法は未確定）の棍は幾千もの凶威を帯び、繞腰貫索（じょうようかんさく・推定。腰の周りを巡らすような棒術の名。詳細は未確定）の技は風のように速い。
    あちらの夾槍（きょうそう・推定。棒の使い方をいう語。具体的な技法は未確定）の棒は空を打たず、左を遮り右を防ぎ、互いに譲らない。
    向こうの陣では旗がきらめき、こちらの陣では鼉皮（だひ・推定。ワニの仲間の皮。ここでは太鼓に張る皮）の太鼓がどんどん鳴る。
    万の天将（てんしょう・推定。天界の軍を率いる将軍）が幾重にも取り囲み、一洞の妖猿が群れをなす。
    怪しい霧と憂いの雲が地を覆い、戦の煙と殺気は天宮へ射し上る。
    昨日の乱戦もまだましだった。今日の争いはいっそう激しい。
    感嘆すべきは猿王（えんおう・推定。猿たちの王としての孫悟空の呼び名）のまことの腕前、木吒も敗れ、命からがら逃げてゆく。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "正元龍の宗教的な含意、陰手棍・夾槍棒・繞腰貫索の技法の詳細は未確定。語を保持し、動作を過度に具体化しない。"
- "id": "xy-ch06-008"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖與惠岸戰經五六十合，惠岸臂膊酸麻，不能迎敵，虛幌一幌，敗陣而走。大聖也收了猴兵，安扎在洞門之外。只見天王營門外，大小天兵接住了太子，讓開大路，徑入轅門，對四天王、李托塔、哪吒，氣哈哈的喘息未定：「好大聖，好大聖！著實神通廣大，孩兒戰不過，又敗陣而來也！」李天王見了心驚，即命寫表求助，便差大力鬼王與木吒太子上天啟奏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 129
    "line_end": 129
    "source_sequence": 8
  "translation_ja": |-
    斉天大聖と恵岸行者は五、六十合（ごう・推定。武器を交えて打ち合う回数を数える言葉）戦った。恵岸行者は腕が痛んでしびれ、もう敵を受け止められない。見せかけの一撃を放つと、敗れて逃げ出した。斉天大聖も猿の兵を引き、洞の門外に陣取った。李天王の陣門では大小の天兵が恵岸行者を迎え、大道を開けた。恵岸行者はまっすぐ軍門へ入り、四大天王、李天王、哪吒（なた。李天王の息子で、天兵の将として戦う神）の前で、息も整わぬまま喘いだ。
    恵岸行者「たいした大聖です、たいした大聖です！　本当に神通力が並外れております。私では敵わず、またも敗れて戻りました！」
    李天王はそれを見て驚き、ただちに援軍を求める上表（じょうひょう・推定。君主に差し出す報告や願いの文書）を書かせ、大力鬼王（だいりききおう・推定。玉帝や李天王の命を伝える力の強い鬼神）と恵岸行者を天界へ遣わして奏上させた。
  "translation_status": "draft"
- "id": "xy-ch06-009"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人當時不敢停留，闖出天羅地網，駕起瑞靄祥雲。須臾，徑至通明殿下，見了四大天師，引至靈霄寶殿，呈上表章。惠岸又見菩薩施禮。菩薩道：「你打探的如何？」惠岸道：「始領命到花果山，叫開天羅地網門，見了父親，道師父差命之意。父王道：『昨日與那猴王戰了一場，止捉得他虎豹獅象之類，更未捉他一個猴精。』正講間，他又索戰，是弟子使鐵棍與他戰經五六十合，不能取勝，敗走回營。父親因此差大力鬼王同弟子上界求助。」菩薩低頭思忖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 130
    "line_end": 130
    "source_sequence": 9
  "translation_ja": |-
    二人はその場で少しもとどまらず、天羅地網を抜け出し、めでたい霞と雲に乗った。たちまち通明殿の前へ着くと、四大天師に会い、霊霄宝殿へ導かれて上表を差し出した。恵岸行者は観音菩薩にも拝礼した。
    観音菩薩「調べた様子は、どうでしたか。」
    恵岸行者「命を受けて花果山へ着くと、天羅地網の門を開けてもらい、父に会って、お師匠さまのお言いつけを伝えました。父は『昨日あの猿王と一戦交えたが、虎や豹、獅子、象などを捕らえただけで、猿の妖怪は一匹も捕まらなかった』と申しました。話しているところへ、また向こうが戦いを求めてきたので、弟子の私が鉄の棍を使って五、六十合戦いましたが、勝てずに陣へ逃げ帰りました。それで父は、大力鬼王と私を天界へ送り、援軍を求めることにしたのです。」
    観音菩薩は頭を垂れて考え込んだ。
  "translation_status": "draft"
- "id": "xy-ch06-010"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說玉帝拆開表章，見有求助之言，笑道：「叵耐這個猴精，能有多大手段，就敢敵過十萬天兵？李天王又來求助，卻將那路神兵助之？」言未畢，觀音合掌啟奏：「陛下寬心，貧僧舉一神，可擒這猴。」玉帝道：「所舉者何神？」菩薩道：「乃陛下令甥顯聖二郎真君，見居灌洲灌江口，享受下方香火。他昔日曾力誅六怪，又有梅山兄弟與帳前一千二百草頭神，神通廣大。奈他只是聽調不聽宣，陛下可降一道調兵旨意，著他助力，便可擒也。」玉帝聞言，即傳調兵的旨意，就差大力鬼王賫調。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 132
    "line_end": 132
    "source_sequence": 10
  "translation_ja": |-
    一方、玉帝は上表を開き、援軍を求める文言を見ると、笑って言った。
    玉帝「あの猿め、腹立たしい。どれほどの腕があるというのだ。十万の天兵に向かうとは。李天王がまた助けを求めてきたが、今度はどこの神兵を援軍に送ればよいのか。」
    言い終わらぬうちに、観音菩薩が合掌（がっしょう・推定。胸の前などで両手のひらを合わせて拝むこと）して申し上げた。
    観音菩薩「陛下、ご安心ください。僧の私が一人、神を推薦いたします。あの猿を捕らえられましょう。」
    玉帝「推薦するのは、どの神だ。」
    観音菩薩「陛下の甥御さま、顕聖二郎真君（けんせいじろうしんくん・推定。玉帝の甥で、変化の術に優れた神将）でございます。今は灌洲（かんしゅう・推定。二郎真君の住む灌江口があるという土地）の灌江口（かんこうこう・推定。二郎真君の廟と住まいがある土地）にお住まいで、下界の人々の祈りを受けておられます。かつて六怪（ろっかい・推定。二郎真君が討ったと語られる六体の妖怪）を力ずくで討ち、梅山（ばいざん・推定。二郎真君が兄弟たちと義を結んだ山）の兄弟と、配下の千二百の草頭神（そうとうしん・推定。二郎真君に従う配下の神兵）を従え、神通力は広大です。ただ、出動の命には従っても、参内（さんだい・推定。君主の宮殿へ参上すること）の召しには応じません。陛下が出兵の勅命（ちょくめい。帝王からの命令）を一通お下しになり、力を貸すよう命じれば、捕らえられるでしょう。」
    玉帝はそれを聞き、ただちに出兵の勅命を伝え、大力鬼王に持たせて遣わした。
  "translation_status": "draft"

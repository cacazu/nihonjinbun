  "source_text": "那大聖趁著機會，滾下山崖，伏在那裡又變，變一座土地廟兒：大張著口，似個廟門；牙齒變做門扇；舌頭變做菩薩；眼睛變做窗櫺；只有尾巴不好收拾，豎在後面，變做一根旗竿。真君趕到崖下，不見打倒的鴇鳥，只有一間小廟。急睜鳳眼，仔細看之，見旗竿立在後面，笑道：「是這猢猻了，他今又在那裡哄我。我也曾見廟宇，更不曾見一個旗竿豎在後面的。斷是這畜生弄諠。他若哄我進去，他便一口咬住。我怎肯進去？等我掣拳先搗窗櫺，後踢門扇。」大聖聽得，心驚道：「好狠，好狠！門扇是我牙齒，窗櫺是我眼睛，若打了牙，搗了眼，卻怎麼是好？」撲的一個虎跳，又冒在空中不見。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"

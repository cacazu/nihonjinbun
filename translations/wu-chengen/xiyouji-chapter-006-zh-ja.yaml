    "source_sequence": 22
  "translation_ja": |-
    斉天大聖はそれを機に崖を転がり落ち、伏せたまま、また変化した。今度は土地神（とちがみ・推定。その土地を守る神）の小さな廟である。口を大きく開いて廟の入口に、歯を扉に、舌を神像に、目を窓の格子にした。ただ尾だけは始末に困り、後ろへ立てて旗竿に変えた。二郎真君が崖の下へ追ってくると、撃ち倒した鴇（ほう・推定。ここでは花鴇を縮めた鳥名。日本のトキとは別）はいず、小さな廟が一つあるだけだった。鳳凰のような目を見開いてよく見ると、後ろに旗竿が立っている。二郎真君は笑って言った。
    二郎真君「あの猿だ。また私をだまそうとしている。廟はいろいろ見たが、後ろに旗竿を立てたものなど見たことがない。間違いなく、あの畜生のいたずらだ。私を中へ誘い込めば、一口でかみつくつもりだろう。誰が入るものか。まず拳で窓格子を打ち、次に扉を蹴ってやろう。」
    斉天大聖は聞いて肝をつぶした。
    斉天大聖「ひどい奴だ、ひどい奴だ！　扉は俺の歯、窓格子は俺の目だ。歯を打たれ、目をつぶされたら、どうすればいい。」
    ぱっと虎のようにひと跳びすると、また空中へ飛び上がり、姿を消した。
  "translation_status": "draft"
- "id": "xy-ch06-023"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真君前前後後亂趕，只見四太尉、二將軍一齊擁至，道：「兄長，拿住大聖了麼？」真君笑道：「那猴兒才自變座廟宇哄我。我正要搗他窗櫺，踢他門扇，他就縱一縱，又渺無蹤跡。可怪，可怪！」眾皆愕然，四望更無形影。真君道：「兄弟們在此看守巡邏，等我上去尋他。」急縱身駕雲，起在半空。見那李天王高擎照妖鏡，與哪吒住立雲端，真君道：「天王，曾見那猴王麼？」天王道：「不曾上來，我這裡照著他哩。」真君把那賭變化，弄神通，拿群猴一事說畢。卻道：「他變廟宇，正打處，就走了。」李天王聞言，又把照妖鏡四方一照，呵呵的笑道：「真君，快去，快去。那猴使了個隱身法，走出營圍，往你那灌江口去也。」二郎聽說，即取神鋒，回灌江口來趕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 158
    "line_end": 158
    "source_sequence": 23
  "translation_ja": |-
    二郎真君が前へ後ろへと追い回していると、四太尉と二将軍がそろって駆けつけた。
    梅山六兄弟「兄上、大聖を捕らえましたか。」
    二郎真君は笑って答えた。
    二郎真君「あの猿は、たった今、廟に変わって私をだまそうとした。窓格子を打ち、扉を蹴ろうとしたら、ひと跳びして、また跡形もなく消えてしまった。不思議なことだ、まったく。」
    皆は驚き、四方を見回したが、影も形もない。
    二郎真君「弟たちは、ここを見張って巡回してくれ。私は上へ行って捜してくる。」
    すぐに身を躍らせ、雲に乗って空中へ昇った。李天王が照妖鏡を高く掲げ、哪吒とともに雲の上に立っているのが見えた。
    二郎真君「天王、あの猿王を見ませんでしたか。」
    李天王「上がっては来ていない。私はここで照らしているのだが。」
    二郎真君は変化の術を競い、神通力を振るい、猿たちを捕らえた経緯を話し、続けた。
    二郎真君「あれは廟に化けましたが、打とうとしたところで逃げたのです。」
    李天王はそれを聞くと、また照妖鏡で四方を照らし、からからと笑った。
    李天王「真君（しんくん・推定。二郎真君を略した尊称）、早く行きなさい、早く。あの猿は隠身（いんしん・推定。術で姿を隠すこと）の術を使って包囲を抜け、あなたの灌江口へ向かっている。」
    二郎真君はそう聞くと、神槍を取って、灌江口へ追いかけて戻った。
  "translation_status": "draft"
- "id": "xy-ch06-024"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那大聖已至灌江口，搖身一變，變作二郎爺爺的模樣，按下雲頭，徑入廟裡。鬼判不能相認，一個個磕頭迎接。他坐中間，點查香火：見李虎拜還的三牲，張龍許下的保福，趙甲求子的文書，錢丙告病的良願。正看處，有人報：「又一個爺爺來了。」眾鬼判急急觀看，無不驚心。真君卻道：「有個甚麼齊天大聖，才來這裡否？」眾鬼判道：「不曾見甚麼大聖，只有一個爺爺在裡面查點哩。」真君撞進門，大聖見了，現出本相道：「郎君不消嚷，廟宇已姓孫了。」這真君即舉三尖兩刃神鋒，劈臉就砍。那猴王使個身法，讓過神鋒。掣出那繡花針兒，幌一幌，碗來粗細，趕到前，對面相還。兩個嚷嚷鬧鬧，打出廟門，半霧半雲，且行且戰，復打到花果山。慌得那四大天王等眾，隄防愈緊。這康、張太尉等迎著真君，合心努力，把那美猴王圍繞不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 159
    "line_end": 159
    "source_sequence": 24
  "translation_ja": |-
    さて、斉天大聖はもう灌江口へ着いていた。身を振るわせて二郎真君の姿に化け、雲を降りると、まっすぐ廟に入った。鬼判たちは見分けられず、一人一人、額を地につけて迎えた。斉天大聖は中央に座り、奉納物や祈願を調べた。李虎（りこ・推定。二郎真君の廟に礼の供物を納めた参拝者）がお礼参りに供えた三牲（さんせい。神に供える三種の動物の供物）、張竜（ちょうりゅう・推定。二郎真君に福の守護を願った参拝者）が福を守ってもらうために立てた誓願（せいがん・推定。神仏に誓いを立てて願うこと）、趙甲（ちょうこう・推定。二郎真君に子授けを願った参拝者）が子を求める祈願書、銭丙（せんへい・推定。二郎真君に病気の回復を願った参拝者）が病の平癒（へいゆ・推定。病気やけがが治ること）を願う申し立てなどがある。見ているところへ知らせが来た。
    報告者「もう一人、お殿さまがおいでになりました。」
    鬼判たちは急いで見に行き、誰もが仰天した。二郎真君が尋ねた。
    二郎真君「斉天大聖とかいう者が、たった今ここへ来なかったか。」
    鬼判たち「大聖などは見ておりません。ただ、お殿さまがお一人、中で調べておられます。」
    二郎真君が門から駆け込むと、斉天大聖はその姿を見てもとの姿を現した。
    斉天大聖「若旦那、騒ぐには及ばない。この廟はもう孫（そん・推定。主人公の孫悟空の姓）のものになったぞ。」
    二郎真君はただちに三尖両刃の神槍を振り上げ、顔めがけて斬りつけた。斉天大聖は身をかわして槍をよけ、刺繍針を取り出してひと振りし、椀ほどの太さにすると、前へ進んで真っ向から打ち返した。二人は大騒ぎしながら廟の門を打って出て、霧と雲の間を、進みながら戦い、また花果山まで戻ってきた。四大天王たちは慌てて、いっそう警戒を厳しくした。康・張の太尉（たいい・推定。中国の高い武官の称号）らは二郎真君を迎え、心と力を合わせて斉天大聖を囲んだ。この話はひとまずおく。
  "translation_status": "draft"
- "id": "xy-ch06-025"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表大力鬼王既調了真君與六兄弟提兵擒魔去後，卻上界回奏。玉帝與觀音菩薩、王母並眾仙卿，正在靈霄殿講話，道：「既是二郎已去赴戰，這一日還不見回報。」觀音合掌道：「貧僧請陛下同道祖出南天門外，親去看看虛實如何？」玉帝道：「言之有理。」即擺駕，同道祖、觀音、王母與眾仙卿至南天門。早有些天丁、力士接著，開門遙觀。只見眾天丁佈羅網，圍住四面；李天王與哪吒擎照妖鏡，立在空中；真君把大聖圍繞中間，紛紛賭鬥哩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 160
    "line_end": 160
    "source_sequence": 25
  "translation_ja": |-
    一方、大力鬼王は二郎真君と六兄弟を動員し、兵を率いて妖魔を捕らえに行かせると、天界へ戻って報告した。玉帝は観音菩薩、王母、仙人の臣下たちと霊霄宝殿で話していた。
    玉帝「二郎が戦いに出たというのに、この一日、まだ報告が来ない。」
    観音菩薩は合掌して申し上げた。
    観音菩薩「陛下、道祖（どうそ・推定。道教の祖としての太上老君の尊称）とともに南天門（なんてんもん・推定。天上の宮殿に通じる南側の門）の外へお出ましになり、ご自身で様子をご覧になってはいかがでしょうか。」
    玉帝「もっともだ。」
    そこで行列を整え、太上老君、観音菩薩、王母、仙人の臣下たちと南天門へ向かった。天兵や力士（りきし・推定。天界で力仕事や守衛などを担う力強い役士）が迎え、門を開いて、遠くを見渡した。天兵たちは網を張って四方を囲み、李天王と哪吒は照妖鏡を掲げて空中に立ち、二郎真君たちは斉天大聖を取り囲んで、盛んに戦っていた。

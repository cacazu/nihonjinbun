  "translation_ja": |-
    恵岸行者は衣を整え、鉄の棍を一本携え、雲に乗って宮殿を離れ、まっすぐ山の前へ来た。天羅地網は幾重にも隙間なく張られ、各陣の門では鈴を鳴らし、号令をかけ、山を水も漏らさぬほどに囲んでいる。恵岸行者は立ち止まって呼ばわった。
    恵岸行者「陣門を守る天兵よ、お取り次ぎを願います。私は李天王の第二太子、木吒、南海観音の一番弟子の恵岸です。戦況を調べに参りました。」
    陣内の五岳の神兵が、すぐに軍門の内へ伝えた。さらに虚日鼠・昴日鶏・星日馬・房日兔が、その言葉を中軍の幕舎へ伝えた。李天王は令旗を出し、天羅地網を開いて中へ通すよう命じた。ちょうど東の空が明るくなり始めたころだった。恵岸行者は旗に従って陣に入り、四大天王と李天王に拝礼した。礼が済むと、李天王が尋ねた。
    李天王「お前は、どこから来たのだ。」
    恵岸行者「私は菩薩さまに従って蟠桃の宴へ参りました。菩薩さまは宴が荒れ果て、瑤池がひっそりしているのをご覧になり、仙人の方々と私を連れて玉帝にお目にかかりました。玉帝は、父上たちが下界へ妖猿を降しに行かれたこと、一日たっても報告がなく、勝敗が分からないことを詳しくお話しになりました。そこで菩薩さまは、私にこちらで実情を調べるようお命じになったのです。」
    李天王「昨日ここに来て陣を置き、九曜星に戦いを挑ませたが、あやつが神通力を大いに振るったので、九曜星は皆、敗れて戻った。その後、私たち自身が兵を率いて出ると、向こうも陣を敷いた。こちらの十万の天兵と夕方まで入り乱れて戦ったが、あやつは分身の術で我々を退けた。兵を引いて調べてみると、捕らえたのは狼や虎や豹などばかりで、妖猿は一匹も捕まらなかった。今日はまだ戦っておらぬ。」
  "translation_status": "draft"
- "id": "xy-ch06-005"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，只見轅門外有人來報道：「那大聖引一群猴精，在外面叫戰。」四大天王與李天王並太子正議出兵，木吒道：「父王，愚男蒙菩薩吩咐，下來打探消息，就說若遇戰時，可助一功。今不才願往，看他怎麼個大聖。」天王道：「孩兒，你隨菩薩修行這幾年，想必也有些神通，切須在意。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 124
    "line_end": 124
    "source_sequence": 5
  "translation_ja": |-
    話し終わらぬうちに、軍門の外から知らせが来た。
    報告者「斉天大聖が猿の妖怪の一団を率い、門の外で戦いを挑んでおります。」
    四大天王と李天王、太子が出陣について話し合っていると、恵岸行者が言った。
    恵岸行者「父上、私は菩薩さまから、下界の様子を調べ、戦いに出会えば力を貸してもよいと仰せつかりました。不肖ながら、私が参って、どれほどの大聖なのか見てきたく存じます。」
    李天王「お前も菩薩さまについて何年も修行してきたのだから、神通力も身につけたことだろう。だが、くれぐれも気をつけよ。」
  "translation_status": "draft"
- "id": "xy-ch06-006"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好太子，雙手掄著鐵棍，束一束繡衣，跳出轅門，高叫：「那個是齊天大聖？」大聖挺如意棒，應聲道：「老孫便是。你是甚人，輒敢問我？」木吒道：「吾乃李天王第二太子木叉，今在觀音菩薩寶座前為徒弟護教，法名惠岸是也。」大聖道：「你不在南海修行，卻來此見我做甚？」木吒道：「我蒙師父差來打探軍情，見你這般猖獗，特來擒你。」大聖道：「你敢說那等大話，且休走，吃老孫這一棒。」木吒全然不懼，使鐵棒劈手相迎。他兩個立那半山中，轅門外，這場好鬥："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 126
    "line_end": 126
    "source_sequence": 6
  "translation_ja": |-
    勇ましくも恵岸行者は、両手で鉄の棍を振るい、刺繍の衣を締め直して軍門から躍り出ると、大声を上げた。
    恵岸行者「斉天大聖とは、どいつだ。」
    斉天大聖は如意金箍棒を突き出して応じた。
    斉天大聖「この俺だ。お前こそ何者だ。よくも俺に尋ねたな。」
    恵岸行者「私は李天王の第二太子、木叉だ。今は観音菩薩の宝座の前で弟子として教えを守っている。法名は恵岸という。」
    斉天大聖「南海で修行もせず、俺のところへ何をしに来た。」
    恵岸行者「師の命で戦況を調べに来たが、お前のその横暴ぶりを見て、捕らえることにしたのだ。」
    斉天大聖「そんな大口をたたくとはな。逃げるなよ、この俺の棒を食らえ！」
    恵岸行者は少しも恐れず、鉄の棍を振るってまともに迎え撃った。二人は山の中腹、軍門の外に立ち、見事な戦いを繰り広げる。
  "translation_status": "draft"
- "id": "xy-ch06-007"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": "棍雖對棍鐵各異，兵縱交兵人不同。一個是太乙散仙呼大聖，一個是觀音徒弟正元龍。渾鐵棍乃千鎚打，六丁六甲運神功；如意棒是天河定，鎮海神珍法力洪。兩個相逢真對手，往來解數實無窮。這個的陰手棍萬千兇，繞腰貫索疾如風；那個的夾槍棒不放空，左遮右擋怎相容。那陣上旌旗閃閃，這陣上鼉鼓鼕鼕。萬員天將團團繞，一洞妖猴簇簇叢。怪霧愁雲漫地府，狼煙煞氣射天宮。昨朝混戰還猶可，今日爭持更又兇。堪羨猴王真本事，木吒復敗又逃生。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 127
    "line_end": 127
    "source_sequence": 7
  "translation_ja": |-
    棍と棍でも鉄は違い、武器と武器でも使う者は異なる。
    一方は大聖と呼ばれる太乙の散仙、一方は観音の弟子たる正元龍。
    渾鉄の棍は千たび鍛えられ、六丁六甲が神の力を働かせたもの。
    如意の棒は天河を定め、海を鎮める神宝、その法力は広大だ。
    出会った二人はまさしく好敵手、繰り出す技は尽きることがない。
    こちらの陰手の棍は幾千もの凶威を帯び、繞腰貫索の技は風のように速い。
    あちらの夾槍の棒は空を打たず、左を遮り右を防ぎ、互いに譲らない。
    向こうの陣では旗がきらめき、こちらの陣では鼉皮の太鼓がどんどん鳴る。
    万の天将が幾重にも取り囲み、一洞の妖猿が群れをなす。
    怪しい霧と憂いの雲が地を覆い、戦の煙と殺気は天宮へ射し上る。
    昨日の乱戦もまだましだった。今日の争いはいっそう激しい。
    感嘆すべきは猿王のまことの腕前、木吒も敗れ、命からがら逃げてゆく。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "正元龍の宗教的な含意、陰手棍・夾槍棒・繞腰貫索の技法の詳細は未確定。語を保持し、動作を過度に具体化しない。"
- "id": "xy-ch06-008"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖與惠岸戰經五六十合，惠岸臂膊酸麻，不能迎敵，虛幌一幌，敗陣而走。大聖也收了猴兵，安扎在洞門之外。只見天王營門外，大小天兵接住了太子，讓開大路，徑入轅門，對四天王、李托塔、哪吒，氣哈哈的喘息未定：「好大聖，好大聖！著實神通廣大，孩兒戰不過，又敗陣而來也！」李天王見了心驚，即命寫表求助，便差大力鬼王與木吒太子上天啟奏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 129
    "line_end": 129
    "source_sequence": 8
  "translation_ja": |-
    斉天大聖と恵岸行者は五、六十合戦った。恵岸行者は腕が痛んでしびれ、もう敵を受け止められない。見せかけの一撃を放つと、敗れて逃げ出した。斉天大聖も猿の兵を引き、洞の門外に陣取った。李天王の陣門では大小の天兵が恵岸行者を迎え、大道を開けた。恵岸行者はまっすぐ軍門へ入り、四大天王、李天王、哪吒の前で、息も整わぬまま喘いだ。
    恵岸行者「たいした大聖です、たいした大聖です！　本当に神通力が並外れております。私では敵わず、またも敗れて戻りました！」
    李天王はそれを見て驚き、ただちに援軍を求める上表を書かせ、大力鬼王と恵岸行者を天界へ遣わして奏上させた。
  "translation_status": "draft"
- "id": "xy-ch06-009"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人當時不敢停留，闖出天羅地網，駕起瑞靄祥雲。須臾，徑至通明殿下，見了四大天師，引至靈霄寶殿，呈上表章。惠岸又見菩薩施禮。菩薩道：「你打探的如何？」惠岸道：「始領命到花果山，叫開天羅地網門，見了父親，道師父差命之意。父王道：『昨日與那猴王戰了一場，止捉得他虎豹獅象之類，更未捉他一個猴精。』正講間，他又索戰，是弟子使鐵棍與他戰經五六十合，不能取勝，敗走回營。父親因此差大力鬼王同弟子上界求助。」菩薩低頭思忖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 130
    "line_end": 130
    "source_sequence": 9
  "translation_ja": |-
    二人はその場で少しもとどまらず、天羅地網を抜け出し、めでたい霞と雲に乗った。たちまち通明殿の前へ着くと、四大天師に会い、霊霄宝殿へ導かれて上表を差し出した。恵岸行者は観音菩薩にも拝礼した。
    観音菩薩「調べた様子は、どうでしたか。」
    恵岸行者「命を受けて花果山へ着くと、天羅地網の門を開けてもらい、父に会って、お師匠さまのお言いつけを伝えました。父は『昨日あの猿王と一戦交えたが、虎や豹、獅子、象などを捕らえただけで、猿の妖怪は一匹も捕まらなかった』と申しました。話しているところへ、また向こうが戦いを求めてきたので、弟子の私が鉄の棍を使って五、六十合戦いましたが、勝てずに陣へ逃げ帰りました。それで父は、大力鬼王と私を天界へ送り、援軍を求めることにしたのです。」
    観音菩薩は頭を垂れて考え込んだ。
  "translation_status": "draft"
- "id": "xy-ch06-010"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說玉帝拆開表章，見有求助之言，笑道：「叵耐這個猴精，能有多大手段，就敢敵過十萬天兵？李天王又來求助，卻將那路神兵助之？」言未畢，觀音合掌啟奏：「陛下寬心，貧僧舉一神，可擒這猴。」玉帝道：「所舉者何神？」菩薩道：「乃陛下令甥顯聖二郎真君，見居灌洲灌江口，享受下方香火。他昔日曾力誅六怪，又有梅山兄弟與帳前一千二百草頭神，神通廣大。奈他只是聽調不聽宣，陛下可降一道調兵旨意，著他助力，便可擒也。」玉帝聞言，即傳調兵的旨意，就差大力鬼王賫調。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 132
    "line_end": 132
    "source_sequence": 10
  "translation_ja": |-
    一方、玉帝は上表を開き、援軍を求める文言を見ると、笑って言った。
    玉帝「あの猿め、腹立たしい。どれほどの腕があるというのだ。十万の天兵に向かうとは。李天王がまた助けを求めてきたが、今度はどこの神兵を援軍に送ればよいのか。」
    言い終わらぬうちに、観音菩薩が合掌して申し上げた。
    観音菩薩「陛下、ご安心ください。僧の私が一人、神を推薦いたします。あの猿を捕らえられましょう。」
    玉帝「推薦するのは、どの神だ。」
    観音菩薩「陛下の甥御さま、顕聖二郎真君でございます。今は灌洲の灌江口にお住まいで、下界の人々の祈りを受けておられます。かつて六怪を力ずくで討ち、梅山の兄弟と、配下の千二百の草頭神を従え、神通力は広大です。ただ、出動の命には従っても、参内の召しには応じません。陛下が出兵の勅命を一通お下しになり、力を貸すよう命じれば、捕らえられるでしょう。」
    玉帝はそれを聞き、ただちに出兵の勅命を伝え、大力鬼王に持たせて遣わした。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "観音の説明は六怪、後の二郎の詩は八怪となる。底本の相違を保持し、数を整合させていない。"
- "id": "xy-ch06-011"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那鬼王領了旨，即駕起雲，徑至灌江口，不消半個時辰，直至真君之廟。早有把門的鬼判傳報至裡道：「外有天使，捧旨而至。」二郎即與眾弟兄出門迎接旨意，焚香開讀。旨意上云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 134
    "line_end": 134
    "source_sequence": 11
  "translation_ja": |-
    大力鬼王は勅命を受け取ると、すぐに雲に乗り、まっすぐ灌江口へ向かった。半時にも満たぬうちに、二郎真君の廟へ着いた。門を守る鬼判が、早くも中へ知らせた。
    門番の鬼判「外に天界の使者が、勅命を携えておいでです。」
    二郎真君は兄弟たちとともに門を出て勅命を迎え、香を焚いて開いた。そこにはこうあった。
  "translation_status": "draft"
- "id": "xy-ch06-012"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "花果山妖猴齊天大聖作亂：因在宮偷桃、偷酒、偷丹，攪亂蟠桃大會，見著十萬天兵、一十八架天羅地網，圍山收伏，未曾得勝。今特調賢甥同義兄弟即赴花果山助力剿除。成功之後，高陞重賞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 135
    "line_end": 135
    "source_sequence": 12
  "translation_ja": "花果山の妖猿、斉天大聖が乱をなした。天宮で桃、酒、丹薬を盗み、蟠桃大会をかき乱したため、現在、十万の天兵と十八重の天羅地網で山を囲み、降伏させようとしているが、いまだ勝利を得ていない。よって、わが賢き甥に特に命じる。義兄弟とともにただちに花果山へ赴き、討伐に力を貸すべし。成功の後には高く位を進め、厚く賞する。"
  "translation_status": "draft"
- "id": "xy-ch06-013"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真君大喜道：「天使請回，吾當就去拔刀相助也。」鬼王回奏不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 137
    "line_end": 137
    "source_sequence": 13
  "translation_ja": |-
    二郎真君は大いに喜んで言った。
    二郎真君「使者殿、どうぞお戻りください。私はすぐに駆けつけ、刀を抜いて力を貸しましょう。」
    大力鬼王が戻って報告したことは、ここでは述べない。
  "translation_status": "draft"
- "id": "xy-ch06-014"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這真君即喚梅山六兄弟乃康、張、姚、李四太尉，郭申、直健二將軍，聚集殿前道：「適才玉帝調遣我等往花果山收降妖猴，同去去來。」眾兄弟俱忻然願往。即點本部神兵，駕鷹牽犬，搭弩張弓，縱狂風，霎時過了東洋大海，徑至花果山。見那天羅地網密密層層，不能前進，因叫道：「把天羅地網的神將聽著：吾乃二郎顯聖真君，蒙玉帝調來，擒拿妖猴者，快開營門放行。」一時，各神一層層傳入。四大天王與李天王俱出轅門迎接。相見畢，問及勝敗之事，天王將上項事備陳一遍。真君笑道：「小聖來此，必須與他鬥個變化。列公將天羅地網不要幔了頂上，只四圍緊密，讓我賭鬥。若我輸與他，不必列公相助，我自有兄弟扶持；若贏了他，也不必列公綁縛，我自有兄弟動手。只請托塔天王與我使個照妖鏡，住立空中。恐他一時敗陣，逃竄他方，切須與我照耀明白，勿走了他。」天王各居四維，眾天兵各挨排列陣去訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 139
    "line_end": 139
    "source_sequence": 14
  "translation_ja": |-
    二郎真君は、梅山の六兄弟、すなわち康・張・姚・李の四太尉と、郭申・直健の二将軍を呼び、殿前に集めて言った。
    二郎真君「たった今、玉帝から我々に、花果山へ行って妖猿を降伏させよとの命令があった。一緒に出かけよう。」
    兄弟たちは皆、喜んで応じた。さっそく配下の神兵を集め、鷹を腕に据え、犬を引き、弩に矢をつがえ、弓を張り、猛烈な風を起こした。たちまち東の大海を越え、花果山へ着いたが、天羅地網が何重にも張り巡らされ、先へ進めない。そこで二郎真君が呼ばわった。
    二郎真君「天羅地網を守る神将たち、聞け。私は二郎顕聖真君だ。玉帝の命により、妖猿を捕らえに来た。早く陣門を開いて通せ。」
    神々は次々と奥へ取り次いだ。四大天王と李天王はそろって軍門を出て迎えた。挨拶を済ませ、勝敗の様子を尋ねると、李天王が先の出来事を詳しく話した。二郎真君は笑って言った。
    二郎真君「この小聖が来た以上、ぜひあれと変化の術を競いましょう。皆さん、天羅地網の上は覆わず、四方だけを隙間なく固め、私に勝負をさせてください。私が負けても、皆さんの助けは要りません。兄弟たちが支えてくれます。勝った場合も、皆さんが縛るには及びません。兄弟たちが手を下します。ただ、托塔天王には照妖鏡を持って、空中に立っていただきたい。あれが敗れてどこかへ逃げるかもしれません。必ず鏡ではっきりと照らし、逃がさないでください。」
    天王たちは四隅の持ち場につき、天兵たちも順に並んで陣を整えた。
  "translation_status": "draft"
- "id": "xy-ch06-015"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這真君領著四太尉、二將軍，連本身七兄弟，出營挑戰；吩咐眾將緊守營盤，收全了鷹犬。眾草頭神得令。真君只到那水簾洞外，見那一群猴齊齊整整，排作個蟠龍陣勢。中軍裡立一竿旗，上書「齊天大聖」四字。真君道：「那潑妖，怎麼稱得起齊天之職？」梅山六弟道：「且休讚嘆，叫戰去來。」那營口小猴見了真君，急走去報知。那猴王即掣金箍棒，整黃金甲，登步雲履，按一按紫金冠，騰出營門，急睜睛觀看，那真君的相貌果是清奇，打扮得又秀氣。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 140
    "line_end": 140
    "source_sequence": 15
  "translation_ja": |-
    二郎真君は四太尉と二将軍を率い、自分を合わせた七兄弟で陣を出て戦いを挑んだ。その際、将兵には陣地を堅く守り、鷹も犬もすべて引き収めておくよう言いつけた。草頭神たちは命を受けた。二郎真君が水簾洞の外へ来ると、猿の群れが整然と、とぐろを巻く竜の陣を組んでいた。中軍には旗が一本立ち、「斉天大聖」の四字が書いてある。
    二郎真君「あの不埒な妖怪が、どうして天に等しい官職などと名乗れるのだ。」
    梅山六兄弟「感心している場合ではありません。戦いを挑みましょう。」
    陣の入口の小猿は二郎真君を見つけ、急いで知らせに走った。斉天大聖はさっそく如意金箍棒を抜き、黄金の鎧を整え、雲を踏む靴を履き、紫金の冠を押さえて陣門から躍り出た。目を見開いて眺めると、二郎真君の顔立ちはまことにすがすがしく非凡で、身なりも美しい。その姿は、まさにこうである。
  "translation_status": "draft"
- "id": "xy-ch06-016"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    儀容清俊貌堂堂，兩耳垂肩目有光。
    頭戴三山飛鳳帽，身穿一領淡鵝黃。
    縷金靴襯盤龍襪，玉帶團花八寶粧。
    腰挎彈弓新月樣，手執三尖兩刃槍。
    斧劈桃山曾救母，彈打鋋羅雙鳳凰。
    力誅八怪聲名遠，義結梅山七聖行。
    心高不認天家眷，性傲歸神住灌江。
    赤城昭惠英靈聖，顯化無邊號二郎。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 142
    "line_end": 149
    "source_sequence": 16
  "translation_ja": |-
    容貌は清らかに秀で、堂々として、両耳は肩に垂れ、目には光がある。
    頭に三山飛鳳の帽を戴き、身には淡い鵞黄色の衣をまとう。
    金糸の靴に盤竜の襪を合わせ、玉の帯は丸い花文と八宝で飾られる。
    腰に新月形の弾弓を掛け、手には三尖両刃の槍を持つ。
    かつて斧で桃山を割って母を救い、弾で鋋羅の二羽の鳳凰を撃った。
    力を振るって八怪を討ち、名は遠くにとどろき、梅山で義を結んで七聖の列をなす。
    志は高く、天帝の身内を名乗るのを潔しとせず、誇り高く、神として灌江に住む。
    赤城の昭恵、霊威あらたかな聖者、果てしなく霊験を現す、その名は二郎。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "鋋羅は底本の字を保持した。固有名の由来・読み、および帰神の細かな含意は未確定。八怪は前段の六怪との相違を保持。"
- "id": "xy-ch06-017"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖見了，笑嘻嘻的將金箍棒掣起，高叫道：「你是何方小將，輒敢大膽到此挑戰？」真君喝道：「你這廝有眼無珠，認不得我麼？吾乃玉帝外甥、敕封昭惠靈顯王二郎是也。今蒙上命，到此擒你這造反天宮的弼馬溫猢猻，你還不知死活。」大聖道：「我記得當年玉帝妹子思凡下界，配合楊君，生一男子，曾使斧劈桃山的，是你麼？我行要罵你幾聲，曾奈無甚冤仇；待要打你一棒，可惜了你的性命。你這郎君小輩，可急急回去，喚你四大天王出來。」真君聞言，心中大怒道：「潑猴！休得無禮，吃吾一刃。」大聖側身躲過，疾舉金箍棒，劈手相還。他兩個這場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 150
    "line_end": 150
    "source_sequence": 17
  "translation_ja": |-
    斉天大聖はそれを見ると、にやにや笑って如意金箍棒を構え、大声を上げた。
    斉天大聖「お前はどこの小将だ。よくも大胆に、ここへ戦いを挑みに来たな。」
    二郎真君は一喝した。
    二郎真君「目があっても節穴か。私が分からぬのか。私は玉帝の甥、昭恵霊顕王の勅封を受けた二郎だ。今、上の命を受け、天宮に背いた弼馬温の猿め、お前を捕らえに来たのだ。まだ命が惜しくないらしいな。」
    斉天大聖「覚えているぞ。昔、玉帝の妹が人の世を慕って下界へ下り、楊という男と夫婦になって、一人の男の子を産んだ。斧で桃山を割ったのは、お前か。二、三言罵ってやろうにも、大した恨みはない。棒で打ってやろうにも、お前の命が惜しい。お前のような若造はさっさと帰って、四大天王を呼んでこい。」
    二郎真君は聞くと、心底怒った。
    二郎真君「不埒な猿め、無礼を働くな。私の刃を受けてみよ！」
    斉天大聖は身をかわし、すばやく如意金箍棒を振り上げ、真っ向から打ち返した。二人の戦いのすさまじさは、こうである。
  "translation_status": "draft"
- "id": "xy-ch06-018"
  "section_id": "chapter-06"
  "kind": "verse"
  "origin": "source"
  "source_text": "昭惠二郎神，齊天孫大聖。這個心高欺敵美猴王，那個面生壓伏真梁棟。兩個乍相逢，各人皆賭興。從來未識淺和深，今日方知輕與重。鐵棒賽飛龍，神鋒如舞鳳。左擋右攻，前迎後映。這陣上梅山六弟助威風，那陣上馬流四將傳軍令。搖旗擂鼓各齊心，吶喊篩鑼都助興。兩個鋼刀有見機，一來一往無絲縫。金箍棒是海中珍，變化飛騰能取勝。若還身慢命該休，但要差池為蹭蹬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 152
    "line_end": 152
    "source_sequence": 18
  "translation_ja": |-
    昭恵の二郎神と、斉天の孫大聖。
    こちらは誇り高く敵を侮る美猴王、あちらは初対面の相手を威圧する、まことの大黒柱。
    初めて出会った二人は、互いに意地を賭けて戦う。
    これまで相手の深さを知らず、今日ようやくその重みを知る。
    鉄の棒は飛竜にも勝り、神の刃は舞う鳳凰のよう。
    左を防いで右を攻め、前で迎えて後ろで受ける。
    向こうの陣では梅山の六弟が威勢を添え、こちらの陣では馬・流ら四将が軍令を伝える。
    旗を振り太鼓を打って心を合わせ、叫んで銅鑼を鳴らし、双方の闘志をあおる。
    二人の鋼の刃は機をうかがい、往来には一筋の隙間もない。
    金箍棒は海中の宝、変化し飛び舞って勝ちを取る。
    身の動きが遅ければ命はなく、ほんのわずかな誤りがつまずきとなる。
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "原文は兩個鋼刀とするが、前後の武器は鉄棒と神槍である。詩の表現を鋼の刃と訳し、原字を修正していない。面生壓伏の構文の細義も留保する。"
- "id": "xy-ch06-019"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真君與大聖鬥經三百餘合，不知勝負。那真君抖擻神威，搖身一變，變得身高萬丈，兩隻手舉著三尖兩刃神鋒，好便似華山頂上之峰，青臉獠牙，朱紅頭髮，惡狠狠，望大聖著頭就砍。這大聖也使神通，變得與二郎身軀一樣，嘴臉一般，舉一條如意金箍棒，卻就是崑崙頂上擎天之柱，抵住二郎神。諕得那馬、流元帥戰兢兢，搖不得旌旗；崩、芭二將虛怯怯，使不得刀劍。這陣上，康、張、姚、李、郭申、直健傳號令，撒放草頭神，向他那水簾洞外縱著鷹犬，搭弩張弓，一齊掩殺。可憐沖散妖猴四健將，捉拿靈怪二三千。那些猴拋戈棄甲，撇劍丟槍，跑的跑，喊的喊，上山的上山，歸洞的歸洞。好似夜貓驚宿鳥，飛灑滿天星。眾兄弟得勝不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 153
    "line_end": 153
    "source_sequence": 19
  "translation_ja": "二郎真君と斉天大聖は三百余合戦ったが、勝負はつかなかった。二郎真君は神威を奮い起こし、身を振るわせると、背丈一万丈の巨体に変じた。両手で掲げる三尖両刃の神槍は、まるで華山の頂の峰のようだった。顔は青く、牙をむき、髪は朱色に赤く、恐ろしい形相で斉天大聖の頭めがけて斬りつけた。斉天大聖も神通力を使い、二郎真君と同じ体格、同じ顔つきに変わった。如意金箍棒を振り上げると、まるで崑崙山の頂で天を支える柱のようで、二郎真君を受け止めた。馬・流の両元帥は恐ろしさに震え、旗を振れず、崩・芭の二将もおじけづき、刀や剣を使えなくなった。一方、康・張・姚・李・郭申・直健は号令を伝え、草頭神を繰り出した。水簾洞の外へ鷹と犬を放ち、弩に矢をつがえ、弓を張って、一斉に攻めかかった。哀れ、妖猿の四健将は蹴散らされ、霊怪二、三千が捕らえられた。猿たちは戈を投げ、鎧を捨て、剣も槍も放り出した。逃げる者、叫ぶ者、山へ上る者、洞へ戻る者。まるでフクロウがねぐらの鳥を驚かせ、空いっぱいに星をまき散らすようだった。兄弟たちの勝利については、ひとまずおく。"
  "translation_status": "draft"
  "issues":
  - "kind": "uncertain_translation"
    "status": "resolved"
    "message_ja": "夜貓は教育部辞典の夜貓子の語義と文脈からフクロウと解した。具体的な種までは同定しない。"
- "id": "xy-ch06-020"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說真君與大聖變做法天象地的規模，正鬥時，大聖忽見本營中妖猴驚散，自覺心慌，收了法象，掣棒抽身就走。真君見他敗走，大步趕上道：「那裡走？趁早歸降，饒你性命。」大聖不戀戰，只情跑起。將近洞口，正撞著康、張、姚、李四太尉，郭申、直健二將軍，一齊帥眾擋住道：「潑猴！那裡走？」大聖慌了手腳，就把金箍棒捏做繡花針，藏在耳內。搖身一變，變作個麻雀兒，飛在樹梢頭釘住。那六兄弟慌慌張張，前後尋覓不見，一齊吆喝道：「走了這猴精也！走了這猴精也！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch6-2634386"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第006回&oldid=2634386"
    "line_start": 155
    "line_end": 155
    "source_sequence": 20
  "translation_ja": |-
    さて、二郎真君と斉天大聖は天地にかたどった巨大な姿になり、戦い続けていた。ふと斉天大聖は、自陣の猿たちが驚いて散り散りになるのを見て、気が動転した。巨大な姿を収め、棒を手に身を引いて逃げ出した。二郎真君は敗走するのを見ると、大股で追いかけた。
    二郎真君「どこへ行く。早く降伏すれば、命は助けてやる。」
    斉天大聖は戦いに未練を残さず、ひたすら走った。洞の入口近くで、康・張・姚・李の四太尉と、郭申・直健の二将軍に出くわした。六人はそろって兵を率い、行く手を遮った。
    梅山六兄弟「不埒な猿め、どこへ行く！」
    斉天大聖は慌てふためき、如意金箍棒をつまんで刺繍針ほどに縮め、耳にしまった。身を振るわせて雀に変わると、梢へ飛び上がってぴたりと止まった。六兄弟はあちこち慌ただしく捜したが見つからず、声をそろえて叫んだ。
    梅山六兄弟「猿の妖怪が逃げたぞ！　猿の妖怪が逃げたぞ！」
  "translation_status": "draft"
- "id": "xy-ch06-021"
  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正嚷處，真君到了，問：「兄弟們，趕到那廂不見了？」眾神道：「才在這裡圍住，就不見了。」二郎圓睜鳳目觀看，見大聖變了麻雀兒，釘在樹上。就收了法象，撇了神鋒，卸下彈弓。搖身一變，變作個鷂鷹兒，抖開翅，飛將去撲打。大聖見了，颼的一翅飛起去，變作一只大鶿老，沖天而去。二郎見了，急抖翎毛，搖身一變，變作一隻大海鶴，鑽上雲霄來嗛。大聖又將身按下，入澗中，變作一個魚兒，淬入水內。二郎趕至澗邊，不見蹤跡。心中暗想道：「這猢猻必然下水去也，定變作魚蝦之類。等我再變變拿他。」果一變，變作個魚鷹兒，飄蕩在下溜頭波面上，等待片時。那大聖變魚兒，順水正游，忽見一隻飛禽：似青鷂，毛片不青；似鷺鷥，頂上無纓；似老鸛，腿又不紅：「想是二郎變化了等我哩！」急轉頭，打個花就走。二郎看見道：「打花的魚兒：似鯉魚，尾巴不紅；似鱖魚，花鱗不見；似黑魚，頭上無星；似魴魚，鰓上無針。他怎麼見了我就回去了？必然是那猴變的。」趕上來，刷的啄一嘴。那大聖就攛出水中，一變，變作一條水蛇，游近岸，鑽入草中。二郎因嗛他不著，他見水響中，見一條蛇攛出去，認得是大聖。急轉身，又變了一隻朱繡頂的灰鶴，伸著一個長嘴，與一把尖頭鐵鉗子相似，徑來吃這水蛇。水蛇跳一跳，又變做一隻花鴇，木木樗樗的，立在蓼汀之上。二郎見他變得低賤，（花鴇乃鳥中至賤至淫之物，不拘鸞、鳳、鷹、鴉，都與交群）故此不去攏傍。即現原身，走將去，取過彈弓，拽滿，一彈子把他打個躘踵。"

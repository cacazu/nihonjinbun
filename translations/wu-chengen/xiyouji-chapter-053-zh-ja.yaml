  "translation_ja": |-
    さすがの悟空は、沙悟浄に言いつけた。
    悟空「お師匠さまを、よく見ていてくれ。この家の者が無礼を働き、師をいじめたりだましたりしたら、お前も昔の手を使って、恐ろしい顔で脅してやれ。俺が水を取りに行ってくる」
    沙悟浄は承知した。老婆が大きな素焼きの鉢を出して、悟空に渡した。
    老婆「この鉢を持っておいで。ぜひ多めに汲んで、あたしたちにも、いざという時のために残してくださいな」
    悟空は本当にその鉢を受け取ると、草葺きの家を出て、雲に乗って飛び去った。老婆はそこで初めて、空へ向かって礼拝した。
    老婆「まあ、旦那さま！　あのお坊さまは雲に乗れるのだ！」
    それから家へ入り、さっきの女たちを呼び出した。皆は三蔵に頭を地へつけて礼拝し、羅漢さま、菩薩さまと呼んだ。そして湯を沸かし、飯を作って三蔵をもてなしたが、そちらはしばらく措こう。
  "translation_status": "reviewed"

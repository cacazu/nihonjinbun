    "line_end": 148
  "translation_ja": "悟空が山の様子を眺めていると、日の当たらぬ側に一軒の屋敷が見え、ふいに犬の鳴き声がした。悟空は山を下り、その屋敷へまっすぐ向かった。ここもまた、よい所である。その様子は、"
  "translation_status": "reviewed"

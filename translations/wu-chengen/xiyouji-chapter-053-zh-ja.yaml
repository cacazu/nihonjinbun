  "source_text": "不時來至門首，見一個老道人盤坐在綠茵之上。大聖放下瓦缽，近前道問訊。那道人欠身還禮道：「那方來者？至小庵有何勾當？」行者道：「貧僧乃東土大唐欽差西天取經者。因我師父誤飲了子母河之水，如今腹疼腫脹難禁。問及土人，說是結成胎氣，無方可治。訪得解陽山破兒洞有落胎泉可以消得胎氣。故此特來拜見如意真仙，求些泉水，搭救師父。累煩老道指引指引。」那道人笑道：「此間就是破兒洞，今改為聚仙庵了。我卻不是別人，即是如意真仙老爺的大徒弟。你叫做甚麼名字？待我好與你通報。」行者道：「我是唐三藏法師的大徒弟，賤名孫悟空。」那道人問曰：「你的花紅、酒禮都在那裡？」行者道：「我是個過路的掛搭僧，不曾辦得來。」道人笑道：「你好痴呀，我老師父護住山泉，並不曾白送與人。你回去辦將禮來，我好通報。不然請回。莫想，莫想。」行者道：「人情大似聖旨。你去說我老孫的名字，他必然做個人情，或者連井都送我也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    ほどなく門前へ着くと、一人の老道士が緑の草の上にあぐらをかいていた。悟空は素焼きの鉢を置き、進み寄って礼をした。道士は腰を浮かせて礼を返した。
    道士「どちらからお越しですか。この小さな庵へ、何のご用でしょう？」
    悟空「私は東土の大唐から勅命を受け、西天へ経を取りに参る僧です。師が誤って子母河の水を飲み、腹が痛み、張り上がって、耐えられずにおります。土地の人に尋ねると、子を宿してしまい、治す方法はないとのことでした。ところが、解陽山の破児洞にある落胎泉なら、胎を解けると聞きましたので、こうして如意真仙にお会いし、泉の水をいただいて、師を助けようと参ったのです。お手数ですが、ご案内くださいませんか」
    道士は笑った。
    道士「ここが破児洞です。今では聚仙庵と名を改めています。私もほかの者ではありません。如意真仙さまの一番弟子です。お名前は何といいますか。お取り次ぎしましょう」
    悟空「私は唐三蔵（とうさんぞう）法師の一番弟子、名を孫悟空（そんごくう）と申します」
    道士「花紅や酒などの贈り物は、どこにありますか？」
    悟空「私は道中、寺々に身を寄せる旅の僧ですから、用意してきませんでした」
    道士は笑った。
    道士「何という愚かなお人だ。師はこの山の泉を守り、人にただで水をやったことはありません。いったん帰り、贈り物を用意してきてください。そうすれば取り次げます。そうでなければ、お帰りなさい。望んでも無駄ですよ、無駄です」
    悟空「人情は勅命より重いというだろう。行って、この悟空の名を告げてくれ。きっと顔を立ててくれる。ひょっとすれば、井戸ごと俺にくれるかもしれないぞ」
  "translation_status": "reviewed"
- "id": "xy-ch53-023"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那道人聞此言，只得進去通報。卻見那真仙撫琴，只待他琴終，方才說道：「師父，外面有個和尚，口稱是唐三藏大徒弟孫悟空，欲求落胎泉水，救他師父。」那真仙不聽說便罷，一聽得說個悟空名字，卻就怒從心上起，惡向膽邊生。急起身，下了琴床，脫了素服，換上道衣，取一把如意鉤子，跳出庵門，叫道：「孫悟空何在？」行者轉頭，觀見那真仙打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    道士はそう聞くと、仕方なく中へ取り次ぎに入った。如意真仙は琴を弾いていた。曲が終わるのを待ってから、道士は申し上げた。
    道士「お師匠さま、外に一人の和尚がおります。唐三蔵の一番弟子、孫悟空と名乗り、師を助けるために落胎泉の水をいただきたいと申しております」
    聞かずにいれば何事もなかったろうに、如意真仙は悟空という名を耳にした途端、胸から怒りが湧き、腹の底に凶悪な思いが生まれた。急いで琴を弾いていた台から下り、普段着を脱いで道服に着替え、如意鉤（にょいこう）を一本取ると、庵の門から跳び出して叫んだ。
    如意真仙「孫悟空はどこだ！」
    悟空が振り向いて見た如意真仙のいでたちは、
  "translation_status": "reviewed"
- "id": "xy-ch53-024"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭戴星冠飛彩艷，身穿金縷法衣紅。
    足下雲鞋堆錦繡，腰間寶帶繞玲瓏。
    一雙納錦凌波襪，半露裙襴閃繡絨。
    手拿如意金鉤子，鐏利杆長若蟒龍。
    鳳眼光明眉菂豎，鋼牙尖利口翻紅。
    額下髯飄如烈火，鬢邊赤髮短蓬鬆。
    形容惡似溫元帥，爭奈衣冠不一同。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 155
    "line_end": 161
  "translation_ja": |-
    頭の星冠（せいかん）はあでやかな彩りを放ち、身には金糸の入った赤い法衣。
    足元の雲の文様の靴には錦繍が重なり、腰の宝帯には繊細な飾りが巡る。
    一対の納錦（のうきん）の足袋は水波を踏むよう、半ばのぞく裾の縁には刺繍の糸がきらめく。
    手には如意金鉤（にょいきんこう）、石突きは鋭く柄は長く、さながら大蛇か竜のよう。
    鳳凰（ほうおう）のような目は光り、眉は逆立ち、鋼の牙は尖り、口は赤くめくれている。
    額の下には烈火のような髭がなびき、鬢の赤い髪は短く乱れて膨らむ。
    恐ろしい形相は温元帥（おんげんすい）にも似るが、ただし衣冠は同じではない。
  "translation_status": "reviewed"
- "id": "xy-ch53-025"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見了，合掌作禮道：「貧僧便是孫悟空。」那先生笑道：「你真個是孫悟空，卻是假名託姓者？」行者道：「你看先生說話。常言道：『君子行不更名，坐不改姓。』我便是悟空，豈有假託之理？」先生道：「你可認得我麼？」行者道：「我因歸正釋門，秉誠僧教，這一向登山涉水，把我那幼時的朋友也都疏失，未及拜訪，少識尊顏。適間問道子母河西鄉人家，言及先生乃如意真仙，故此知之。」那先生道：「你走你的路，我修我的真，你來訪我怎的？」行者道：「因我師父誤飲了子母河水，腹疼成胎，特來仙府，拜求一碗落胎泉水，救解師難也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    悟空はその姿を見ると、合掌して礼をした。
    悟空「私が孫悟空です」
    如意真仙は笑った。
    如意真仙「本物の孫悟空か。それとも、名を騙っているのか？」
    悟空「先生、何をおっしゃいます。昔から『君子は歩いても名を変えず、座っても姓を改めぬ』というでしょう。私こそ悟空です。偽名を使うはずがありません」
    如意真仙「わしに見覚えはあるか？」
    悟空「私は仏門の正道に帰し、誠意を尽くして僧の教えに従っております。このところ山を越え、水を渡ってばかりで、若いころの友人たちとも疎遠になり、訪ねる暇もありません。先生のお顔にも、あまり覚えがございません。先ほど子母河の西の村家で道を聞いたとき、先生は如意真仙だと教わり、それでお名前を知りました」
    如意真仙「お前はお前の旅をし、わしはわしの道を修めている。なぜわしを訪ねてきた？」
    悟空「師が誤って子母河の水を飲み、腹を痛めて子を宿してしまいました。そこでわざわざ仙府へ参り、一碗の落胎泉の水をお願いし、師の難儀を救いたいのです」
  "translation_status": "reviewed"
- "id": "xy-ch53-026"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那先生怒目道：「你師父可是唐三藏麼？」行者道：「正是，正是。」先生咬牙恨道：「你們可曾會著一個聖嬰大王麼？」行者道：「他是號山枯松澗火雲洞紅孩兒妖怪的綽號，真仙問他怎的？」先生道：「是我之舍侄，我乃牛魔王的兄弟。前者家兄處有信來報我，稱說唐三藏的大徒弟孫悟空憊懶，將他害了。我這裡正沒處尋你報仇，你倒來尋我，還要甚麼水哩。」行者陪笑道：「先生差了。你令兄也曾與我做朋友，幼年間也曾拜七弟兄。但只是不知先生尊府，有失拜望。如今令侄得了好處，現隨著觀音菩薩，做了善財童子，我等尚且不如，怎麼反怪我也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    如意真仙は目を怒らせた。
    如意真仙「その師とは、唐三蔵か？」
    悟空「はい、そのとおりです」
    如意真仙は歯ぎしりして、憎々しげに言った。
    如意真仙「お前たちは、聖嬰大王（せいえいだいおう）という者に出会わなかったか？」
    悟空「それは号山（ごうざん）の枯松澗（こしょうかん）、火雲洞（かうんどう）にいた妖怪、紅孩児（こうがいじ）の異名です。真仙は、なぜあいつのことをお尋ねになるのですか？」
    如意真仙「あれはわしの甥だ。わしは牛魔王（ぎゅうまおう）の弟なのだ。以前、兄から知らせが届き、唐三蔵の一番弟子、ならず者の孫悟空に、あの子を害されたという。仇を討とうにもお前を探す当てがなかったところへ、自分から訪ねてきたとはな。水など、何を言うか！」
    悟空は愛想笑いをした。
    悟空「先生、それはお間違いです。お兄上は私の友人でもあり、若いころには七人で義兄弟の契りも結びました。ただ、先生のお住まいを知らず、ご挨拶に伺えなかったのです。今では甥御さんは、よい身の上になりました。観音菩薩（かんのんぼさつ）のおそばで、善財童子（ぜんざいどうじ）を務めているのです。我々すら及ばぬ境遇なのに、どうしてかえって私をお恨みになるのですか？」
  "translation_status": "reviewed"
- "id": "xy-ch53-027"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "先生喝道：「這潑猢猻！還弄巧舌。我舍侄還是自在為王好，還是與人為奴好？不得無禮，吃我這一鉤！」大聖使鐵棒架住道：「先生莫說打的話，且與些泉水去也。」那先生罵道：「潑猢猻！不知死活。如若三合敵得我，與你水去；敵不過，只把你剁為肉醬，方與我侄子報仇。」大聖罵道：「我把你不識起倒的孽障！既要打，起開來看棍。」那先生如意鉤劈手相還。二人在聚仙庵好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    如意真仙は怒鳴った。
    如意真仙「このろくでなしの猿め！　まだ口先でごまかすか。わしの甥は、自由に王として暮らすのと、人の下僕になるのと、どちらがよいと思う！　無礼は許さん。この鉤を食らえ！」
    悟空は鉄棒で受け止めて言った。
    悟空「先生、打ち合いの話はおやめください。まず泉の水を少し分けてください」
    如意真仙は罵った。
    如意真仙「ろくでなしの猿め、命知らずな！　三合（ごう）、わしに持ちこたえられたら、水を持っていくがよい。持ちこたえられなければ、肉味噌になるまで切り刻み、甥の仇を討ってくれる！」
    悟空も罵り返した。
    悟空「この、よしあしも分からぬ化け物め！　どうしても戦うなら、出てこい。この棒を受けてみろ！」
    如意真仙は如意鉤を振るって、真っ向から打ち返した。二人は聚仙庵で激しく戦う。
  "translation_status": "reviewed"
- "id": "xy-ch53-028"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "聖僧誤食成胎水，行者來尋如意仙。那曉真仙原是怪，倚強護住落胎泉。及至相逢講仇隙，爭持決不遂如然。言來語去成僝僽，意惡情兇要報冤。這一個因師傷命來求水，那一個為侄亡身不與泉。如意鉤強如蝎毒，金箍棒狠似龍巔。當胸亂刺施威猛，著腳斜鉤展妙玄。陰手棍丟傷處重，過肩鉤起近頭鞭。鎖腰一棍鷹持雀，壓頂三鉤蜋捕蟬。往往來來爭勝敗，返返復復兩回還。鉤攣棒打無前後，不見輸贏在那邊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    聖僧が誤って子を宿す水を飲み、悟空は如意仙（にょいせん）を訪ねてきた。
    真仙が、力を頼んで落胎泉を独り占めする妖怪とは、知るよしもなかった。
    出会ってみれば恨みを語られ、言い争って、願いはどうしてもかなわぬ。
    言葉を交わすうちに罵り合いとなり、悪意と凶情を募らせ、仇を討とうとする。
    こちらは師の命が危ないから水を求め、あちらは甥が身を滅ぼしたから泉を与えぬ。
    如意鉤の強さは蠍の毒のよう、金箍棒（きんこぼう）の猛威は荒れ狂う竜のよう。
    胸をめがけて突き乱し、威勢を振るい、足を斜めに鉤に掛け、妙技を尽くす。
    不意を突いて放つ棒は深い傷を負わせ、肩越しに上がる鉤は頭のそばを鞭のように打つ。
    腰をとらえる一棒は鷹が雀をつかむよう、頭上を押さえる三度の鉤は蟷螂が蝉を捕るよう。
    行きつ戻りつ勝敗を争い、返し返して二度巡る。
    鉤で引き、棒で打ち、先も後もなく、どちらが勝つとも知れなかった。
  "translation_status": "reviewed"
- "id": "xy-ch53-029"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那先生與大聖戰經十數合，敵不得大聖。這大聖越加猛烈，一條棒似滾滾流星，著頭亂打。先生敗了筋力，倒拖著如意鉤，往山上走了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 169
    "line_end": 169
  "translation_ja": "如意真仙は悟空と十数合戦ったが、敵わなかった。悟空はますます猛り、一本の棒を流星が転がるように振り回し、頭をめがけて乱打した。如意真仙は力が尽き、如意鉤を後ろへ引きずって、山の方へ逃げた。"
  "translation_status": "reviewed"
- "id": "xy-ch53-030"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖不去趕他，卻來庵內尋水。那個道人早把庵門關了。大聖拿著瓦缽，趕至門前，盡力氣一腳，踢破庵門，闖將進去。見那道人伏在井欄上，被大聖喝了一聲，舉棒要打，那道人往後跑了。卻才尋出吊桶來，正要打水，又被那先生趕到前邊，使如意鉤子把大聖鉤著腳一跌，跌了個嘴硍地。大聖爬起來，使鐵棒就打。他卻閃在傍邊，執著鉤子道：「看你可取得我的水去？」大聖罵道：「你上來，你上來，我把你這個孽障直打殺你！」那先生也不上前拒敵，只是禁住了，不許大聖打水。大聖見他不動，卻使左手掄著鐵棒，右手使吊桶。將索子才突轆轆的放下，他又來使鉤。大聖一隻手撐持不得，又被他一鉤鉤著腳，扯了個躘踵，連索子通跌下井去了。大聖道：「這廝卻是無禮。」爬起來，雙手掄棒，沒頭沒臉的打將上去。那先生依然走了，不敢迎敵。大聖又要去取水，奈何沒有吊桶，又恐怕來鉤扯，心中暗暗想道：「且去叫個幫手來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    悟空は追いかけず、庵へ水を探しに戻った。道士は早くも門を閉めていた。悟空は素焼きの鉢を持ち、門前へ駆けつけ、力いっぱい蹴って門を破り、中へ飛び込んだ。道士が井戸の縁へ覆いかぶさっているのを見て、悟空は一喝し、棒を振り上げて打とうとした。道士は奥へ逃げた。
    ようやく釣瓶（つるべ）を見つけ、水を汲もうとしたその時、如意真仙が前へ追いつき、如意鉤を悟空の足へ掛けて引き倒した。悟空は口を地面に打ちつけて転んだ。起き上がって鉄棒で打ちかかると、相手は脇へかわし、鉤を手に言った。
    如意真仙「さあ、わしの水を取っていけるか、見せてもらおう！」
    悟空「こっちへ来い、こっちへ来い！　この化け物め、叩き殺してやる！」
    如意真仙は前へ出て戦おうとせず、ただ悟空に水を汲ませまいと、そこを押さえていた。悟空は相手が動かないのを見ると、左手で鉄棒を振り、右手で釣瓶を扱った。縄をするすると下ろしかけるや、相手はまた鉤を振るってきた。悟空は片手では支えきれず、再び鉤を足へ掛けられ、引かれてつんのめった。縄までまとめて井戸へ落としてしまった。
    悟空「こいつ、なんて無礼なまねをしやがる！」
    起き上がり、両手で棒を振るって、頭といわず顔といわず打ちかかった。如意真仙はまた逃げ、正面から戦おうとはしなかった。悟空は改めて水を取ろうとしたが、釣瓶がないうえ、また鉤で引き倒される心配もある。ひそかに考えた。
    悟空の心の声「ひとまず、助っ人を呼んでこよう」
  "translation_status": "reviewed"
- "id": "xy-ch53-031"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，撥轉雲頭，徑至村舍門首，叫一聲：「沙和尚。」那裡邊三藏忍痛呻吟，豬八戒哼聲不絕。聽得叫喚，二人歡喜道：「沙僧啊，悟空來也。」沙僧連忙出門接著道：「大哥，取水來了？」大聖進門，對唐僧備言前事。三藏滴淚道：「徒弟啊，似此怎了？」大聖道：「我來叫沙兄弟與我同去，到那庵邊，等老孫和那廝敵鬥，教沙僧乘便取水來救你。」三藏道：「兩個沒病的都去了，丟下我兩個有病的，教誰伏侍？」那個老婆婆在傍道：「老羅漢只管放心，不須要你徒弟，我家自然看顧伏侍你。你們早間到時，我等實有愛憐之意。卻才見這位菩薩雲來霧去，方知你是羅漢菩薩，我家決不敢復害你。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    悟空は雲の向きを変え、まっすぐ村家の門前へ来て呼んだ。
    悟空「沙悟浄！」
    家の中では三蔵が痛みをこらえてうめき、八戒も絶えずうんうん唸っていた。その声を聞き、二人は喜んだ。
    三蔵と八戒「沙悟浄、悟空が来たぞ！」
    沙悟浄は急いで門を出て迎えた。
    沙悟浄「兄さん、水は取れましたか？」
    悟空は中へ入り、三蔵に一部始終を詳しく語った。三蔵は涙を落とした。
    三蔵「弟子よ、それではどうしたらよいのだ？」
    悟空「沙悟浄を呼んで、一緒に行くために戻ってきました。あの庵のそばで、私があいつと戦います。その隙に沙悟浄に水を汲ませ、お二人を助けるのです」
    三蔵「元気な二人がどちらも行ってしまい、病んでいる私たち二人を残したら、誰が世話をしてくれるのだ？」
    そばにいた老婆が言った。
    老婆「羅漢さま、どうぞご安心を。お弟子さんでなくても、あたしたちがちゃんとお世話します。朝お着きになった時には、確かにお慕いする気持ちもありました。でも先ほど、こちらの菩薩さまが雲や霧に乗って行き来されるのを見て、ようやく皆さまが羅漢さまや菩薩さまだと分かったのです。もう決して害を加えようとはいたしません」
  "translation_status": "reviewed"
- "id": "xy-ch53-032"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者咄的一聲道：「汝等女流之輩，敢傷那個？」老婆子笑道：「爺爺呀！還是你們有造化，來到我家！若到第二家，你們也不得囫圇了。」八戒哼哼的道：「不得囫圇，是怎麼的？」婆婆道：「我一家兒四五口，都是有幾歲年紀的，把那風月事盡皆休了，故此不肯傷你；若還到第二家，老小眾大，那年小之人，那個肯放過你去？就要與你交合。假如不從，就要害你性命，把你們身上肉都割了去做香袋兒哩。」八戒道：「若這等，我決無傷。他們都是香噴噴的，好做香袋；我是個臊豬，就割了肉去，也是臊的，故此可以無傷。」行者笑道：「你不要說嘴，省些力氣，好生產也。」那婆婆道：「不必遲疑，快求水去。」行者道：「你家可有吊桶？借個使使。」那婆子即往後邊取出一個吊桶，又窩了一條索子，遞與沙僧。沙僧道：「帶兩條索子去，恐一時井深要用。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    悟空は、ふんと声を立てた。
    悟空「女どもの分際で、いったい誰を害そうっていうんだ？」
    老婆は笑った。
    老婆「旦那さま、あんたたちは、うちへ来たからこそ運がよかったのですよ。よその家へ行っていたら、体がそろったままではいられませんでした」
    八戒はうめきながら尋ねた。
    八戒「体がそろっていないって、どういうことだ？」
    老婆「うちは四、五人の家族ですが、皆かなり年を取り、男女の色事もすっかりやめました。それで、あんたたちを傷つける気がないのです。よその家には年寄りも子供も大人も大勢います。若い者の誰が、あんたたちをそのまま放しておきましょう。すぐに交わることを求めてきます。従わなければ命を奪い、体の肉を切り取って、匂い袋にしてしまうのですよ」
    八戒「それなら俺は絶対に無傷だな。ほかの連中はよい匂いがするから、匂い袋にできるだろうが、俺は臭い豚だ。肉を切り取ったところで臭いだけだから、傷つけずにおいてもらえるさ」
    悟空は笑った。
    悟空「無駄口をきくな。力を残しておいて、しっかり子を産むんだな」
    老婆「ぐずぐずせず、早く水を取りにおいでなさい」
    悟空「この家に釣瓶はあるか？　一つ貸してくれ」
    老婆はすぐ奥へ行き、釣瓶を一つ取り出し、縄も一本たばねて、沙悟浄に渡した。
    沙悟浄「縄は二本持っていきましょう。井戸が深ければ必要になります」
  "translation_status": "reviewed"
- "id": "xy-ch53-033"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "沙僧接了桶索，即隨大聖出了村舍，一同駕雲而去，那消半個時辰，卻到解陽山界。按下雲頭，徑至庵外。大聖吩咐沙僧道：「你將桶索拿了，且在一邊躲著，等老孫出頭索戰。你待我兩人交戰正濃之時，你乘機進去，取水就走。」沙僧謹依言命。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    沙悟浄は釣瓶と縄を受け取り、悟空と一緒に村家を出て、共に雲に乗って飛び去った。半時辰もかからず、解陽山の境へ着いた。雲を下ろして庵の外へまっすぐ進むと、悟空は沙悟浄に指示した。
    悟空「釣瓶と縄を持ち、ひとまず脇へ隠れていろ。俺が出て、戦いを挑む。二人が激しくやり合っているところで、隙を見て中へ入り、水を汲んだら、すぐに行くんだ」
    沙悟浄は、言いつけどおりに従った。
  "translation_status": "reviewed"
- "id": "xy-ch53-034"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖掣了鐵棒，近門高叫：「開門，開門！」那守門的看見，急入裡通報道：「師父，那孫悟空又來了也。」那先生心中大怒道：「這潑猴老大無狀。一向聞他有些手段，果然今日方知，他那條棒真是難敵。」道人道：「師父，他的手段雖高，你亦不亞與他，正是個對手。」先生道：「前面兩回，被他贏了。」道人道：「前兩回雖贏，不過是一猛之性；後面兩次打水之時，被師父鉤他兩跌，卻不是相比肩也？先既無奈而去，今又復來，必然是三藏胎成身重，埋怨得緊，不得已而來也。決有慢他師之心，管取我師決勝無疑。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    悟空は鉄棒を抜き、門へ近づいて大声を上げた。
    悟空「門を開けろ！　門を開けろ！」
    門を守っていた道士は、悟空を見ると、急いで中へ知らせに入った。
    道士「お師匠さま、孫悟空がまた来ました！」
    如意真仙は心の中でひどく怒り、言った。
    如意真仙「あのろくでなしの猿め、何という無作法だ。前から腕が立つとは聞いていたが、今日、初めて本当に分かった。あの棒は、まったく受けきれん」
    道士「相手の腕は確かでも、お師匠さまも引けを取りません。まさしく、よい勝負のお相手です」
    如意真仙「前の二度は、あいつに勝たれたぞ」
    道士「前の二度は勝ったといっても、ただ一時の勢いにすぎません。その後、水を汲もうとした二度は、お師匠さまが鉤で二度とも転ばせました。それなら互角ではありませんか。さっきは手もなく去ったのに、今また来たのは、きっと三蔵の胎が育ち、体が重くなって、さんざん責め立てられ、やむなく戻ったのでしょう。師を軽んじる心も、必ず起きています。今度はお師匠さまがお勝ちになること、間違いありません」
  "translation_status": "reviewed"
- "id": "xy-ch53-035"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真仙聞言，喜孜孜滿懷春意，笑盈盈一陣威風，挺如意鉤子，走出門來喝道：「潑猢猻！你又來作甚？」大聖道：「我來只是取水。」真仙道：「泉水乃吾家之井，憑是帝王宰相，也須表禮羊酒來求，方才僅與些須；況你又是我的仇人，擅敢白手來取？」大聖道：「真個不與？」真仙道：「不與，不與。」大聖罵道：「潑孽障！既不與水，看棍！」丟一個架子，搶個滿懷，不容說，著頭便打；那真仙側身躲過，使鉤子急架相還。這一場比前更勝，好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    如意真仙はそれを聞き、春が来たように心が浮き立ち、満面に笑みを浮かべて威風を振るった。如意鉤を突き出し、門から出て怒鳴った。
    如意真仙「ろくでなしの猿め！　また何をしに来た！」
    悟空「俺は水を取りに来ただけだ」
    如意真仙「泉は、わしの家の井戸だ。帝王や宰相であろうと、進物や羊や酒を持って願いに来て、ようやく少しばかり与えるものだ。ましてお前はわしの仇ではないか。よくも手ぶらで取りに来られたものだ！」
    悟空「本当にくれないんだな？」
    如意真仙「やらん、やらん！」
    悟空「この忌まわしい化け物め！　水をよこさぬなら、棒を食らえ！」
    悟空は構えを変え、相手の懐いっぱいへ踏み込み、言葉も挟ませず、頭をめがけて打った。如意真仙は身を横にかわし、鉤で素早く受けて打ち返した。今度の戦いは、前にも増して激しかった。
  "translation_status": "reviewed"
- "id": "xy-ch53-036"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "金箍棒，如意鉤，二人奮怒各懷仇。飛砂走石乾坤暗，播土揚塵日月愁。大聖救師來取水，妖仙為侄不容求。兩家齊努力，一處賭安休。咬牙爭勝負，切齒定剛柔。添機見，越抖擻，噴雲噯霧鬼神愁。樸樸兵兵鉤棒響，喊聲哮吼振山丘。狂風滾滾催林木，殺氣紛紛過斗牛。大聖愈爭愈喜悅，真仙越打越綢繆。有心有意相爭戰，不定存亡不罷休。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    金箍棒と如意鉤、二人は怒りに燃え、それぞれ恨みを抱く。
    砂を飛ばし石を走らせ、天地は暗く、土を巻き塵を上げ、日月も憂う。
    悟空は師を救おうと水を取りに来たが、妖仙は甥のために願いを拒む。
    双方とも力を尽くし、一つ所で、無事に終われるかを賭ける。
    歯を食いしばって勝敗を争い、歯ぎしりして強弱を決めようとする。
    工夫を加え、いよいよ奮い立ち、雲を噴き霧を吐いて鬼神すら憂わせる。
    がつがつ、かんかんと鉤と棒が鳴り、叫びと咆哮が山や丘を震わせる。
    激しい風が巻き起こって林を揺さぶり、殺気は乱れ飛んで斗宿（としゅく）、牛宿（ぎゅうしゅく）を越える。
    悟空は戦うほどに喜びを増し、真仙は打ち合うほどにもつれまとわりつく。
    互いに心を込め、意地を張って戦い、生死が決まるまでやめようとしなかった。
  "translation_status": "reviewed"
- "id": "xy-ch53-037"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個在庵門外交手，跳跳舞舞的，鬥到山坡之下，恨苦相持不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 180
    "line_end": 180
  "translation_ja": "二人は庵の門外で渡り合い、跳んだり躍ったりしながら、山の斜面の下まで戦っていった。激しい恨みをこめて争う二人のことは、しばらく措こう。"
  "translation_status": "reviewed"
- "id": "xy-ch53-038"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那沙和尚提著吊桶，闖進門去，只見那道人在井邊擋住道：「你是甚人，敢來取水？」沙僧放下吊桶，取出降妖寶杖，不對話，著頭便打。那道人躲閃不及，把左臂膊打折，道人倒在地下掙命。沙僧罵道：「我要打殺你這孽畜，怎奈你是個人身，我還憐你，饒你去罷。讓我打水。」那道人叫天叫地的，爬到後面去了。沙僧卻才將吊桶向井中滿滿的打了一吊桶水，走出庵門，駕起雲霧，望著行者喊道：「大哥，我已取了水去也。饒他罷，饒他罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    さて、沙悟浄は釣瓶を提げ、門の中へ飛び込んだ。道士が井戸端に立ちふさがった。
    道士「何者だ、勝手に水を取りに来るとは！」
    沙悟浄は釣瓶を置くと、降妖宝杖（ごうようほうじょう）を取り出し、返事もせず、頭をめがけて打った。道士はかわしきれず、左腕の骨を折られ、地面へ倒れて苦しみもがいた。沙悟浄は罵った。
    沙悟浄「この悪党め、叩き殺してやりたいが、お前は人の身だ。それを憐れんで許してやる。どいて、水を汲ませろ！」
    道士は天に叫び地に叫び、這って奥へ逃げていった。そこで沙悟浄は、井戸から釣瓶いっぱいに水を汲み、庵の門を出て雲に乗り、悟空へ向かって叫んだ。
    沙悟浄「兄さん、水はもう取りました。先に行きます！　そいつは許してやってください、許してやってください！」
  "translation_status": "reviewed"
- "id": "xy-ch53-039"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖聽得，方才使鐵棒支住鉤子道：「我本待斬盡殺絕，爭奈你不曾犯法；二來看你令兄牛魔王的情上。先頭來，我被鉤了兩下，未得水去。才然來，我是個調虎離山計，哄你出來爭戰，卻著我師弟取水去了。老孫若肯拿出本事來打你，莫說你是一個甚麼如意真仙，就是再有幾個，也打死了。正是打死不如放生，且饒你教你活幾年耳。已後再有取水者，切不可勒掯他。」那妖仙不識好歹，演一演，就來鉤腳。被大聖閃過鉤頭，趕上前，喝聲：「休走！」那妖仙措手不及，推了一個蹼辣，掙扎不起。大聖奪過如意鉤來，折為兩段；總拿著又一抉，抉作四段。擲之於地道：「潑孽畜！再敢無禮麼？」那妖仙戰戰兢兢，忍辱無言。這大聖笑呵呵，駕雲而起。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    悟空はそれを聞き、ようやく鉄棒で鉤を支え止めて言った。
    悟空「本当は皆殺しにしてやろうと思っていたが、お前はまだ法を犯したわけではないし、もう一つには、兄貴の牛魔王の顔を立ててやる。最初に来た時は、二度も鉤で転ばされ、水を取れなかった。今度は調虎離山（ちょうこりざん）の計だ。お前をおびき出して戦わせ、その間に弟弟子が水を汲んでいった。俺が本気を出してお前を打つつもりなら、何とかいう如意真仙が一人どころか、何人いたって叩き殺していたぞ。だが、殺すより生かすに越したことはない。ひとまず許し、あと何年か生かしておいてやる。今後、水を取りに来る者があれば、決して無理に締めつけるな」
    ところが妖仙はよしあしも分からず、身を動かして、また足へ鉤を掛けようとした。悟空は鉤先をかわし、前へ詰めて一喝した。
    悟空「逃がさんぞ！」
    妖仙は防ぐ間もなく、突き倒されてどさりと転び、もがいても起き上がれなかった。悟空は如意鉤を奪って二つに折り、合わせてつかんで、もう一度へし折り、四つにした。地面へ投げ捨てて言った。
    悟空「この畜生め！　まだ無礼を働く気か！」
    妖仙はぶるぶる震え、辱めをこらえて何も言えなかった。悟空は笑いながら雲に乗って飛び立った。その証しに詩がある。
  "translation_status": "reviewed"
- "id": "xy-ch53-040"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    真鉛若鍊須真水，真水調和真汞乾。
    真汞真鉛無母氣，靈砂靈藥是仙丹。
    嬰兒枉結成胎像，土母施功不費難。
    推倒旁門宗正教，心君得意笑容還。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 185
    "line_end": 188
  "translation_ja": |-
    真鉛（しんえん）を練るには真水（しんすい）が要り、真水で調和すれば、真汞（しんこう）は乾く。
    真汞と真鉛には母の気がなく、霊砂（れいしゃ）、霊薬こそが仙丹（せんたん）となる。
    嬰児がむなしく結び、胎の形をなしたが、土母（どぼ）が功を施せば難しいことはない。
    傍らの邪道を倒し、正しい教えを尊び、心君（しんくん）は意を得て、笑みを浮かべて帰る。
  "translation_status": "reviewed"
- "id": "xy-ch53-041"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖縱著祥光，趕上沙僧。得了真水，喜喜歡歡，回於本處。按下雲頭，徑來村舍。只見豬八戒腆著肚子，倚在門枋上哼哩。行者悄悄上前道：「獃子，幾時占房的？」獃子慌了道：「哥哥莫取笑。可曾有水來麼？」行者還要耍他，沙僧隨後就到，笑道：「水來了，水來了。」三藏忍痛欠身道：「徒弟啊，累了你們也。」那婆婆卻也歡喜，幾口兒都出禮拜道：「菩薩呀，卻是難得，難得。」即忙取個花磁盞子，舀了半盞兒，遞與三藏道：「老師父，細細的吃，只消一口，就解了胎氣。」八戒道：「我不用盞子，連吊桶等我喝了罷。」那婆子道：「老爺爺，諕殺人罷了。若吃了這吊桶水，好道連腸子肚子都化盡了。」嚇得獃子不敢胡為，也只吃了半盞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 189
    "line_end": 189
  "translation_ja": |-
    悟空は瑞光に乗って沙悟浄へ追いついた。真の水を手に入れ、二人は喜び勇んで元の場所へ戻った。雲を下ろして村家へまっすぐ行くと、八戒が腹を突き出し、戸口の横木に寄りかかってうめいていた。悟空はそっと近づいた。
    悟空「おい、いつ産屋へ入ったんだ？」
    八戒は慌てた。
    八戒「兄貴、からかわないでくれ。水はあったのか？」
    悟空はまだ遊んでやろうとしたが、沙悟浄が後から来て、笑って告げた。
    沙悟浄「水が来ましたよ、水が来ました！」
    三蔵は痛みをこらえて身を起こした。
    三蔵「弟子たちよ、苦労をかけたね」
    老婆も喜び、家の者たちがそろって出てきて礼拝した。
    女性たち「菩薩さま、本当にありがたいこと、ありがたいことです！」
    老婆は急いで模様のある磁器の盃を取り、水を半盃汲んで三蔵に渡した。
    老婆「お師匠さま、ゆっくりお飲みください。一口で胎は解けますから」
    八戒「俺は盃なんかいらない。釣瓶からそのまま飲ませてくれ」
    老婆「旦那さま、恐ろしいことをおっしゃる！　この釣瓶の水をみんな飲んだら、お腹も腸も、すっかり溶けてしまいますよ」
    八戒は脅されて、勝手なことはできず、やはり半盃だけ飲んだ。
  "translation_status": "reviewed"
- "id": "xy-ch53-042"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那裡有頓飯之時，他兩個腹中絞痛，只聽轂轆轂轆三五陣腸鳴。腸鳴之後，那獃子忍不住，大小便齊流。唐僧也忍不住要往靜處解手。行者道：「師父啊，切莫出風地裡去，怕人子，一時冒了風，弄做個產後之疾。」那婆婆即取兩個淨桶來，教他兩個方便。須臾間，各行了幾遍，才覺住了疼痛，漸漸的銷了腫脹，化了那血團肉塊。那婆婆家又煎些白米粥與他補虛。八戒道：「婆婆，我的身子實落，不用補虛。你燒些湯水與我洗個澡，卻好吃粥。」沙僧道：「二哥，洗不得澡。坐月子的人弄了水漿致病。」八戒道：「我又不曾大生，左右只是個小產，怕他怎的？洗洗兒乾淨。」真個那婆子燒些湯與他兩個淨了手腳。唐僧才吃兩盞兒粥湯。八戒就吃了十數碗，還只要添。行者笑道：「夯貨，少吃些，莫弄做個沙包肚，不像模樣。」八戒道：「沒事，沒事，我又不是母豬，怕他做甚？」那家子真個又去收拾煮飯。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    一食を終えるほどの時間もたたぬうちに、二人の腹は絞られるように痛み、ごろごろと三、五回ほど腸が鳴った。腸が鳴ると、八戒はこらえきれず、大小便を一緒に漏らした。三蔵も我慢できず、人目のない所へ用を足しに行こうとした。
    悟空「お師匠さま、決して風の当たる所へは行かないでください。危ないですよ。ひとたび風に当たると、産後の病になりかねません」
    老婆はすぐに便桶を二つ持ってきて、二人に使わせた。しばらくの間に、それぞれ何度か用を足すと、ようやく痛みが治まり、張った腹も次第に引いて、血や肉の塊は溶けてなくなった。老婆の家では、弱った体を養うため、白米の粥も炊いてくれた。
    八戒「お婆さん、俺の体は頑丈だから、養生なんかいらないよ。湯を沸かしてひと風呂浴びさせてくれ。それから粥を食おう」
    沙悟浄「二番目の兄さん、風呂はいけません。産後のひと月を養生している人は、水を使うと病気になりますよ」
    八戒「俺はちゃんと子を産んだわけじゃない。たかが流産じゃないか。何が怖いものか。洗ってきれいにしようぜ」
    老婆は本当に湯を沸かし、二人に手足を洗わせた。三蔵は粥の汁を二盃だけ飲んだ。八戒は十数碗を平らげ、それでもなお、お代わりを欲しがった。悟空は笑った。
    悟空「ばか、少し控えろ。腹が砂袋みたいに垂れ下がったら、みっともないぞ」
    八戒「平気だ、平気だ。俺は雌豚じゃないんだ。何を怖がることがある？」
    家の者たちは本当にまた支度をし、飯を炊きに行った。
  "translation_status": "reviewed"
- "id": "xy-ch53-043"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老婆婆對唐僧道：「老師父，把這水賜了我罷。」行者道：「獃子，不吃水了？」八戒道：「我的肚腹也不疼了，胎氣想是已行散了，灑然無事，又吃水何為？」行者道：「既是他兩個都好了，將水送你家罷。」那婆婆謝了行者，將餘剩之水裝於瓦罐之中，埋在後邊地下。對眾老小道：「這罐水，夠我的棺材本也。」眾老小無不歡喜，整頓齋飯，調開桌凳。唐僧們吃了齋，消消停停，將息了一宿。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    老婆は三蔵に言った。
    老婆「お師匠さま、この水をあたしにくださいませんか」
    悟空「おい、もう水はいらないか？」
    八戒「もう腹は痛まないし、胎もすっかり散ってしまったんだろう。さっぱりして何ともないのに、どうしてまた水を飲むんだ？」
    悟空「二人とも治ったなら、この水は、あんたの家へあげよう」
    老婆は悟空に礼を言い、余った水を素焼きの壺に入れ、家の裏の地中へ埋めた。そして老いも若きも、家の者たちへ言った。
    老婆「この壺の水があれば、あたしの棺代は十分だよ」
    皆、喜ばぬ者はなかった。精進料理を調え、机や腰掛けを並べた。三蔵たちは食事を取り、ゆっくり落ち着いて、一晩体を休めた。
  "translation_status": "reviewed"
- "id": "xy-ch53-044"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日天明，師徒們謝了婆婆家，出離村舍。唐三藏攀鞍上馬，沙和尚挑著行囊，孫大聖前邊引路，豬八戒攏了韁繩。這裡才是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 193
    "line_end": 193
  "translation_ja": "翌朝、夜が明けると、師弟は老婆の家へ礼を述べ、村家を後にした。三蔵は鞍に手をかけて馬に乗り、沙悟浄は旅の荷を担いだ。悟空が前に立って道案内をし、八戒が手綱を取った。ここでこそ、まさしく、"
  "translation_status": "reviewed"
- "id": "xy-ch53-045"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "洗淨口孽身乾淨，銷化凡胎體自然。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 195
    "line_end": 195
  "translation_ja": |-
    口の業を洗い流し、身も清らかに、
    凡俗の胎を溶かし去り、体はおのずからの姿に帰る。
  "translation_status": "reviewed"
- "id": "xy-ch53-046"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知到國界中還有甚麼理會，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 197
    "line_end": 197
  "translation_ja": "さて、国の中へ入った一行を、さらにどんな事柄が待っているのか。そのいきさつは、次回にお聞きいただこう。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-01-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の「禪主」は禅の修行者を中心に置く呼称。「黃婆」は内丹で陰陽を仲立ちする土の働きに関わる象徴語で、沙悟浄の役割に重ねられる。回題が述べる予告として残し、通常の人物名は変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-02-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「無愆」は通常は過ちがないという語だが、ここでは刀兵を恐れず水火も空しくなるという対句から、魔物に害が及ばない意味に取った。徳行八百・陰功三千は原文の数を保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-03-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "取得ページは金兜の直後に「本作“⿰山兜”，Unicode缺字」と挿入し、本来は山偏に兜の字で、Unicodeに字がないと説明する。これは電子本文編者の文字注である。原文欄には全体を保持し、日本語の本文呼称は金兜山とした。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-04-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ここでの丹砂は、前の難で如来から借りた金丹砂を振り返る短称である。通常の辰砂という鉱物と取り違えない。悟空による救出の経緯の説明であり、飯の入手経緯を語る山神たちの評価も、その人物たちの言葉として残した。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-05-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「香嘴困」は燕の口をかぐわしいと形容し、さえずり疲れる姿と読んだ。鳥の描写に人の艶めいた表現を重ねる原文を、客観的な生態説明へ改めない。「柏」は中国古典の常緑樹の語で、日本の落葉樹カシワに限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-06-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「橄堂」「艎板」は船の構造を描く珍しい表記である。前者を船室、後者を甲板の板として文脈から訳したが、字の由来と厳密な構造名は確定しない。他版の字へ原文を改めない。「一葦之航」は葦一葉ほどの小舟という比喩で、実際の船材を葦に限定する表現ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-07-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "船頭の性別は、詩の終わりの「老裙釵」で明示される。直前の案内の話者は船頭とし、ここで判明した後だけ女船頭とした。「百納」「千針」は継ぎ合わせや細かな縫い目の多さをいう形容として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-08-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「清水河」は、この場面では悟空が東の澄んだ川を指して言う説明と読んだ。この時点では、悟空による水の様子の説明を保つ。酒屋の目印として掲げた二つの草把も原文のまま残す。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-09-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "子母河の水による妊娠、二十歳以上という条件、三日後に照胎泉へ行き、影が二つあれば出産するという説明は、老婆が語る物語の設定である。水や薬の現実の効能・妊娠や出産に関する医療説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-10-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「養兒腸」「胎前病」「摧陣疼」「漿包」は、腹で子を育てる部位、出産前の病、陣痛、胎児を包む液体の袋を指す当時の俗な言い方として訳した。男の腹からの出産について、悟空や沙悟浄が恐怖をあおるからかいと、八戒の訴えを区別した。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-11-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「花紅表禮」は、祝いの飾りや謝礼の品と進物を列挙する語。「表禮」は教育部辞典で初対面の贈り物とされる。「羊酒果盤」の羊・酒・果物の盛り合わせも省略していない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-12-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「裝\U0002192B諕他」の\U0002192Bは珍字で、全字庫で字形と中国語音を確認できる。ただし、その字単独の古い辞義だけから動作を固定せず、ここでは昔の手段を使って相手を脅す文脈により、恐ろしい顔を作ることと読んだ。原字は保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-13-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「鐏」は柄の下端の金具を指すため、刃先に置き換えず石突きとした。「眉菂」は字面に解釈の余地があるが、眉が立つ姿として訳す。「額下」は取得底本の字面を保って「額の下」とし、顎や頷への補訂は行わない。温元帥に似るのは形相であり、衣冠は違うという否定まで保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-14-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "如意真仙が紅孩児を甥、牛魔王を兄と呼ぶのは、この発言で初めて明示される。注の参照位置は、兄弟関係と双方の主張がすべて出た後に置いた。紅孩児を害したという訴えと、観音に仕える方がよいという悟空の弁明は、それぞれの立場からの主張である。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-15-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原詩の「為侄亡身」は、甥を失ったとする相手の恨みを強く表す句として保持する。直前に紅孩児が善財童子として生きていると述べられており、死んだという事実を補わない。「龍巔」は激しい竜の比喩と取ったが、巔の字を他字へ改めてはいない。「僝僽」は言葉による非難・罵り合いとして訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-16-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "老婆の「愛憐之意」は、珍しい男性への好意や欲望の含みをもつ言葉として訳した。無害な慈善心だけに限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-17-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「決有慢他師之心」は、師に対する軽んじる気持ちが悟空に生まれているはずだ、という道士の読みとして訳した。悟空の実際の内心としては確定しない。二度勝たれ、二度転ばせたという道士の勝敗勘定も保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-18-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「不曾犯法」は悟空本人の言葉であり、泉の占有や先の暴力について語り手が法的評価を下す説明ではない。「演一演」「蹼辣」は動きや転倒をいう文脈から訳し、具体的な足技を補わない。鉤を二段に折り、まとめてさらに四段へ折る順を残す。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-19-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この詩の鉛・水・汞・砂・胎・土母・心君は、内丹の修行を重ねた象徴語。「真水調和真汞乾」の乾と「無母氣」は底本どおり、乾く、母の気がないと訳した。後世の『西遊真詮』には陰陽の不調和や形と気を論じる解釈があるが、それで原文を補訂したり、一つの体系に固定したりはしない。医学や薬物調製の説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-20-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「怕人子」の子は語尾の助詞で、教育部辞典も本段の例を挙げ、恐ろしい・怖いという意味を示す。子供を恐れるという意味には取らない。風や水を避ける産後の注意は登場人物の言葉であって、現代の医療上の勧告ではない。大小便を漏らすこと、小産という言葉、飯の量も省略しない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-21-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "老婆は残った泉水を壺に入れて埋め、自分の葬儀に備える資産として喜ぶ。水を実際に売ったとはまだ書かれていないので、その取引を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch53-note-22-body"
  "section_id": "chapter-53"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「口孽」は口から招く禍いや業をいう。ここでは飲んだ水による胎を解く話に重なり、仏教的な口業だけに狭めず、物語の飲食と浄化の表現を保つ。"
  "translation_status": "reviewed"

    "line_start": 144
    "line_end": 144
  "translation_ja": "さて、悟空が觔斗雲（きんとうん）で飛び立つと、ほどなく、一つの山の頂が雲の行く手を遮った。すぐに雲を下ろし、目を凝らして見る。見事な山だ！　そこには、"
  "translation_status": "reviewed"
- "id": "xy-ch53-019"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "幽花擺錦，野草鋪藍。澗水相連落，溪雲一樣閑。重重谷壑藤蘿密，遠遠峰巒樹木蘩。鳥啼雁過，鹿飲猿攀。翠岱如屏嶂，青崖似髻鬟。塵埃滾滾真難到，泉石涓涓不厭看。每見仙童採藥去，常逢樵子負薪還。果然不亞天臺景，勝似三峰西華山。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    奥深く咲く花が錦を広げ、野の草が藍を敷く。
    谷の水は続いて流れ落ち、渓流の雲は変わらずのどかだ。
    重なり合う谷には蔓草が密に絡み、遠く続く峰々には木々が茂る。
    鳥が鳴き、雁が渡り、鹿は水を飲み、猿は木を登る。
    緑の山は屏風のよう、青い崖は結い上げた髪のよう。
    俗世の砂塵は、いくら立ちこめてもここまでは届きにくく、泉と石と、細く流れる水は、見ても飽きない。
    仙童が薬草を摘みに行くのをたびたび見かけ、薪を背負って帰る木こりにもよく出会う。
    まことに天台（てんだい）の景色に劣らず、三つの峰を持つ西華山（せいかざん）にも勝るのであった。
  "translation_status": "reviewed"

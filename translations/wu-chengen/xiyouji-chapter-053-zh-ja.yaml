  "kind": "paragraph"
  "origin": "source"
  "source_text": "遂此四人分吃那飯，那飯熱氣騰騰的。行者道：「這飯多時了，卻怎麼還熱？」土地跪下道：「是小神知大聖功完，才自熱來伺候。」須臾飯畢，收拾了缽盂，辭了土地、山神，那師父才攀鞍上馬，過了高山。正是：滌慮洗心皈正覺，餐風宿水向西行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    そこで四人は飯を分けて食べた。飯からは、もうもうと湯気が立っていた。
    悟空「この飯は、ずいぶん時間がたっているのに、どうしてまだ熱いんだ？」
    土地神はひざまずいて答えた。
    土地神「大聖さまがお役目を果たされたと知り、私が先ほど温め直して、お待ちしていたのでございます」
    やがて食事が済み、鉢を片づけ、土地神と山神に別れを告げた。三蔵は鞍に手をかけて馬に乗り、高い山を越えた。まさしく、
    思いをすすぎ心を洗い、正しい悟りへ帰依して、
    風を食らい水辺に宿り、西へと進んでゆく。
  "translation_status": "reviewed"
- "id": "xy-ch53-005"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行夠多時，又值早春天氣。聽了些："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 125
    "line_end": 125
  "translation_ja": "かなりの間旅を続けるうちに、また早春の季節となった。耳に入るのは、こんな声である。"
  "translation_status": "reviewed"
- "id": "xy-ch53-006"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "紫燕呢喃，黃鸝睍睆。紫燕呢喃香嘴困，黃鸝睍睆巧音頻。滿地落紅如佈錦，遍山發翠似堆茵。嶺上青梅結豆，崖前古柏留雲。野潤煙光淡，沙暄日色曛。幾處園林花放蕊，陽回大地柳芽新。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    紫の燕はちちと鳴き、黄色いコウライウグイスはよい声を響かせる。
    紫の燕はかぐわしい口が疲れるまでさえずり、黄色い鳥は巧みな調べを絶えず奏でる。
    地を埋める紅の落花は錦を敷いたよう、山いっぱいの若緑は敷物を重ねたよう。
    峰には青梅が豆ほどの実を結び、崖の前の古い柏には雲がとどまる。
    野は潤い、霞の光は淡く、砂は暖かく、日の色は柔らかにかすむ。
    あちらこちらの園では花がほころび、陽気の戻った大地に柳の芽が新しい。
  "translation_status": "reviewed"
- "id": "xy-ch53-007"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正行處，忽遇一道小河，澄澄清水，湛湛寒波。唐長老勒過馬觀看，遠見河那邊有柳陰垂碧，微露著茅屋幾椽。行者遙指那廂道：「那裡人家，一定是擺渡的。」三藏道：「我見那廂也似這般，卻不見船隻，未敢開言。」八戒旋下行李，厲聲高叫道：「擺渡的，撐船過來。」連叫幾遍，只見那柳陰裡面，咿咿啞啞的撐出一隻船兒，不多時，相近這岸。師徒們仔細看了那船兒，真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    一行が進んでいると、ふいに小さな川へ行き当たった。水は澄みきり、冷たい波をたたえている。三蔵が馬の手綱を引いて眺めると、遠く対岸には柳の緑が垂れ、その陰から茅葺きの家が何軒か、わずかに見えた。悟空は向こうを指さした。
    悟空「あそこの家は、きっと渡し守の家ですよ」
    三蔵「私もそのように思うが、舟が見えないので、まだ声をかけられずにいるのだ」
    八戒は荷を下ろし、大声で叫んだ。
    八戒「渡し守！　こっちへ舟をよこしてくれ！」
    何度か呼ぶと、柳の陰からぎいぎいと音を立て、一艘の舟が漕ぎ出してきた。ほどなくこちらの岸へ近づいた。師弟がその舟をよく見れば、まことにこうであった。
  "translation_status": "reviewed"
- "id": "xy-ch53-008"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "短棹分波，輕橈泛浪。橄堂油漆彩，艎板滿平倉。船頭上鐵纜盤窩，船後邊舵樓明亮。雖然是一葦之航，也不亞泛湖浮海。縱無錦纜牙檣，實有松樁桂楫。固不如萬里神舟，真可渡一河之隔。往來只在兩崖邊，出入不離古渡口。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    短い棹が波を分け、軽い櫂が水面を進む。
    船室は油と漆で彩られ、甲板の板は船倉の上を平らに覆う。
    船首には鉄の綱がとぐろを巻き、船尾の舵を取る楼は明るい。
    葦の葉ほどの小舟ながら、湖にも海にも浮かぶ舟に引けを取らぬ。
    錦の綱や飾り立てた帆柱こそないが、松の杭と桂の櫂は備わっている。
    万里（り）を行く神舟ほどではないにせよ、一筋の川を渡すには十分だ。
    行き来するのは二つの岸の間だけ、出入りするのは古い渡し場を離れない。
  "translation_status": "reviewed"
- "id": "xy-ch53-009"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那船兒須臾頂岸，那梢子叫云：「過河的，這裡去。」三藏縱馬近前看處，那梢子怎生模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    舟はすぐに岸へ着き、船頭が声を上げた。
    船頭「川を渡る方、こちらへどうぞ」
    三蔵が馬を進めて近くから見ると、船頭はどんな姿だったか。
  "translation_status": "reviewed"
- "id": "xy-ch53-010"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭裹錦絨帕，足踏皂絲鞋。身穿百納綿襠襖，腰束千針裙布絛。手腕皮粗筋力硬，眼花眉皺面容衰。聲音嬌細如鶯囀，近觀乃是老裙釵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    頭には錦の毛織りの布を巻き、足には黒い絹の靴。
    体には幾重にも継いだ綿入りの上着を着て、腰には細かく縫った裾衣の布帯を締める。
    手首の皮は荒れ、筋は強く、目はかすみ、眉間にはしわ、顔には老いが見える。
    声はウグイスのさえずりのように細く柔らかい。近くで見れば、年老いた女であった。
  "translation_status": "reviewed"
- "id": "xy-ch53-011"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者近於船邊道：「你是擺渡的？」那婦人道：「是。」行者道：「梢公如何不在，卻著梢婆撐船？」婦人微笑不答，用手拖上跳板。沙和尚將行李挑上去，行者扶著師父上跳，然後順過船來，八戒牽上白馬，收了跳板。那婦人撐開船，搖動槳，頃刻間過了河。身登西岸，長老教沙僧解開包，取幾文錢鈔與他。婦人更不爭多寡，將纜拴在傍水的樁上，笑嘻嘻徑入莊屋裡去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    悟空は舟のそばへ寄った。
    悟空「あんたが渡し守か？」
    女船頭「はい」
    悟空「どうして男の船頭がいなくて、女の船頭に舟を漕がせているんだ？」
    女は微笑むだけで答えず、渡し板を引き上げて岸へ掛けた。沙悟浄（さごじょう）が荷を担いで乗り、悟空は師を支えて板へ上げてから、自分も舟へ移った。八戒が白馬を引いて乗せ、渡し板をしまった。女は舟を押し出して櫂を動かし、たちまち川を渡った。西岸へ上がると、三蔵は沙悟浄に包みを解かせ、銭を数文（もん）取り出して女に渡した。女は多いとも少ないとも言わず、水際の杭に綱を結ぶと、にこにこしながら、まっすぐ村の家へ入っていった。
  "translation_status": "reviewed"
- "id": "xy-ch53-012"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏見那水清，一時口渴，便著八戒：「取缽盂，舀些水來我吃。」那獃子道：「我也正要些兒吃哩。」即取缽盂，舀了一缽，遞與師父。師父吃了有一少半，還剩了多半，獃子接來，一氣飲乾，卻伏侍三藏上馬。師徒們找路西行，不上半個時辰，那長老在馬上呻吟道：「腹痛。」八戒隨後道：「我也有些腹痛。」沙僧道：「想是吃冷水了。」說未畢，師父聲喚道：「疼的緊。」八戒也道：「疼得緊。」他兩個疼痛難禁，漸漸肚子大了。用手摸時，似有血團肉塊，不住的骨突骨突亂動。三藏正不穩便，忽然見那路傍有一村舍，樹梢頭挑著兩個草把。行者道：「師父，好了，那廂是個賣酒的人家。我們且去化他些熱湯與你吃，就問可有賣藥的，討貼藥，與你治治腹痛。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    三蔵は澄んだ水を見て、ふと喉が渇き、八戒に言いつけた。
    三蔵「鉢を持って、水を汲んできておくれ」
    八戒「俺もちょうど飲みたかったんです」
    すぐに鉢を取り、一鉢の水を汲んで師に渡した。三蔵は半分弱を飲み、半分以上が残った。八戒は受け取ると一息に飲み干し、三蔵を助けて馬に乗せた。
    師弟が道を探して西へ進み、半時辰（じしん）もたたないうちに、三蔵が馬上でうめいた。
    三蔵「腹が痛い」
    後ろの八戒も言った。
    八戒「俺も少し腹が痛い」
    沙悟浄「冷たい水を飲んだせいでしょう」
    言い終わらないうちに、師が声を上げた。
    三蔵「ひどく痛む！」
    八戒「ひどく痛む！」
    二人は耐えられぬほど痛み、次第に腹が大きくなった。手で触れると、中には血の塊、肉の塊のようなものがあり、ごとごとと絶えず動き回っている。三蔵がどうにも落ち着かずにいると、ふと道端に一軒の村家が見え、木の梢に二つの藁束が掲げてあった。
    悟空「お師匠さま、助かりました。あそこは酒を売る家です。ひとまず湯を少し恵んでもらって、お飲ませしましょう。それから薬を売る所があるか聞き、一服もらって、腹痛を治してみましょう」
  "translation_status": "reviewed"
- "id": "xy-ch53-013"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏聞言甚喜，卻打白馬。不一時，到了村舍門口下馬。但只見那門兒外有一個老婆婆，端坐在草墩上績麻。行者上前，打個問訊道：「婆婆，貧僧是東土大唐來的。我師父乃唐朝御弟，因為過河吃了河水，覺肚腹疼痛。」那婆婆喜哈哈的道：「你們在那邊河裡吃水來？」行者道：「是在此東邊清水河吃的。」那婆婆欣欣的笑道：「好耍子，好耍子。你都進來，我與你說。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    三蔵は聞いて大喜びし、白馬に鞭を当てた。ほどなく村家の門前へ着き、馬を下りた。門の外には、一人の老婆が草の腰掛けにきちんと座り、麻を績んでいた。悟空は進み出て僧の礼をした。
    悟空「お婆さん、私は東土（とうど）の大唐（だいとう）から来た僧です。師は唐朝（とうちょう）皇帝の御弟（ぎょてい）に当たる方ですが、川を渡ったときに川の水を飲み、腹が痛くなったのです」
    老婆はうれしそうに笑った。
    老婆「あんたたち、向こうの川で水を飲んできたのかい？」
    悟空「この東にある、澄んだ水の川です」
    老婆は楽しげに笑った。
    老婆「おもしろいこと、おもしろいこと。皆、中へお入り。話してあげよう」
  "translation_status": "reviewed"
- "id": "xy-ch53-014"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者即攙唐僧，沙僧即扶八戒，兩人聲聲喚喚，腆著肚子，一個個只疼得面黃眉皺，入草舍坐下。行者只叫：「婆婆，是必燒些熱湯與我師父，我們謝你。」那婆婆且不燒湯，笑唏唏跑走後邊，叫道：「你們來看，你們來看。」那裡面蹼\U00028043蹼踏的又走出兩三個半老不老的婦人，都來望著唐僧哂笑。行者大怒，喝了一聲，把牙一齜。諕得那一家子跌跌蹡蹡，往後就走。行者上前，扯住那老婆子道：「快早燒湯，我饒了你。」那婆子戰兢兢的道：「爺爺呀！我燒湯也不濟事，也治不得他兩個肚疼。你放了我，等我說。」行者放了他，他說：「我這裡乃是西梁女國。我們這一國盡是女人，更無男子，故此見了你們歡喜。你師父吃的那水不好了。那條河喚做子母河。我那國王城外，還有一座迎陽館驛，驛門外有一個照胎泉。我這裡人，但得年登二十歲以上，方敢去吃那河裡水。吃水之後，便覺腹痛有胎。至三日之後，到那迎陽館照胎水邊照去。若照得有了雙影，便就降生孩兒。你師吃了子母河水，以此成了胎氣，也不日要生孩子，熱湯怎麼治得？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    悟空は三蔵を、沙悟浄は八戒を支えた。二人は声を上げ続け、大きな腹を突き出していた。どちらも痛みで顔を黄ばませ、眉をしかめながら草葺きの家へ入り、腰を下ろした。悟空は繰り返し頼んだ。
    悟空「お婆さん、ぜひ湯を沸かして、師に飲ませてください。恩に着ます」
    老婆は湯を沸かそうともせず、くすくす笑って奥へ走り、声をかけた。
    老婆「皆、見においで。見においで！」
    奥からばたばたと、年配ともまだ言いきれぬ女たちが二、三人出てきて、三蔵を見ながら笑った。悟空はかっと怒り、一喝して牙をむいた。家の者たちは肝をつぶし、よろめき転びながら奥へ逃げた。悟空は進み寄り、老婆をつかまえた。
    悟空「さっさと湯を沸かせ。そうすれば許してやる」
    老婆はぶるぶる震えた。
    老婆「旦那さま！　湯を沸かしたって役には立ちません。お二人の腹痛は治せないのです。放してください、わけをお話ししますから」
    悟空が手を放すと、老婆は説明した。
    老婆「ここは西梁女国（せいりょうじょこく）という国です。この国は女ばかりで、男は一人もいません。だから、あんたたちを見てうれしかったのです。お師匠さまが飲んだ水がいけませんでした。あの川は子母河（しぼか）といいます。うちの国の都の外には迎陽館駅（げいようかんえき）があり、その門の外に照胎泉（しょうたいせん）という泉があります。ここの者は二十歳以上になって、初めてあの川の水を飲みに行くのです。水を飲むと腹が痛くなり、子を宿します。三日たったら、迎陽館（げいようかん）の胎を映す水辺へ行って、自分を映してみます。影が二つ映れば、やがて子供が生まれるのです。お師匠さまも子母河の水を飲んだせいで子を宿し、遠からず赤ん坊を産むのですよ。お湯なんかで、どうして治せましょう」
  "translation_status": "reviewed"
- "id": "xy-ch53-015"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏聞言，大驚失色道：「徒弟啊，似此怎了？」八戒扭腰撒胯的哼道：「爺爺呀！要生孩子，我們卻是男身，那裡開得產門？如何脫得出來？」行者笑道：「古人云：『瓜熟自落。』若到那個時節，一定從脅下裂個窟窿，鑽出來也。」八戒見說，戰兢兢，忍不得疼痛道：「罷了，罷了，死了，死了。」沙僧笑道：「二哥莫扭，莫扭，只怕錯了養兒腸，弄做個胎前病。」那獃子越發慌了，眼中噙淚，扯著行者道：「哥哥，你問這婆婆，看那裡有手輕的穩婆，預先尋下幾個。這半會一陣陣的動蕩得緊，想是摧陣疼，快了，快了。」沙僧又笑道：「二哥既知摧陣疼，不要扭動，只恐擠破漿包耳。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    三蔵はそれを聞くと、驚きのあまり顔色を失った。
    三蔵「弟子よ、こんなことになって、どうすればよいのだ？」
    八戒は腰をよじり、脚を開いてうめいた。
    八戒「ああ、助けてくれ！　赤ん坊を産むといったって、俺たちは男だ。どこに産道が開くんだ？　どうやって外へ出すんだよ？」
    悟空は笑った。
    悟空「昔から『瓜は熟すと自然に落ちる』というだろう。その時が来れば、きっと脇腹の下に穴が裂けて、そこから出てくるさ」
    八戒は聞いて震え上がり、痛みに耐えられずに言った。
    八戒「もうだめだ、もうだめだ。死んじまう、死んじまう！」
    沙悟浄は笑った。
    沙悟浄「二番目の兄さん、身をよじってはいけません、いけません。子を育てる腹の中がねじれて、産む前に病気になったら大変ですよ」
    八戒はますますうろたえ、目に涙をためて悟空の袖を引いた。
    八戒「兄貴、このお婆さんに聞いて、手荒なことをしない産婆がいる所を教えてもらってくれ。前もって何人か探しておこうよ。この少しの間にも、ひっきりなしにひどく動いている。きっと陣痛だ。もうすぐだ、もうすぐだ！」
    沙悟浄はまた笑った。
    沙悟浄「二番目の兄さん、陣痛だと分かっているなら、なおさら動いてはいけません。胎児を包む水の袋を押し破ってしまいますよ」
  "translation_status": "reviewed"
- "id": "xy-ch53-016"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏哼著道：「婆婆啊，你這裡可有醫家？教我徒弟去買一貼墮胎藥吃了，打下胎來罷。」那婆子道：「就有藥也不濟事。只是我們這正南街上有一座解陽山，山中有一個破兒洞，洞裡有一眼落胎泉。須得那泉裡水吃一口，方才解了胎氣。卻如今取不得水了。向年來了一個道人，稱名如意真仙，把那破兒洞改作聚仙庵，護住落胎泉水，不肯善賜與人。但欲求水者，須要花紅表禮，羊酒果盤，志誠奉獻，只拜求得他一碗兒水哩。你們這行腳僧，怎麼得許多錢財買辦？但只可挨命，待時而生產罷了。」行者聞得此言，滿心歡喜道：「婆婆，你這裡到那解陽山有幾多路程？」婆婆道：「有三十里。」行者道：「好了，好了。師父放心，待老孫取些水來你吃。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    三蔵はうめきながら尋ねた。
    三蔵「お婆さん、ここには医者はいませんか。弟子に堕胎の薬を一服買いに行かせ、それを飲んで、この胎を下ろしたいのです」
    老婆「薬があっても役には立ちません。ただ、ここから真南の道に解陽山（かいようざん）という山があり、その山の破児洞（はじどう）という洞に、落胎泉（らくたいせん）という泉があります。その泉の水を一口飲んで、初めて胎を解くことができるのです。けれど今では、水が取れなくなりました。以前、如意真仙（にょいしんせん）と名乗る道士がやって来て、破児洞を聚仙庵（しゅせんあん）と改め、落胎泉の水を見張って、人にただで恵もうとしないのです。水が欲しければ、花紅（かこう）や進物、羊と酒、果物の盛り合わせを用意して、心からお供えし、拝んで願い、ようやく一碗の水がもらえるだけです。旅のお坊さんであるあんたたちに、そんな物を買いそろえるお金が、どこにありましょう。命のある限りこらえて、産む時を待つほかありませんよ」
    悟空はこれを聞くと、心いっぱいに喜んだ。
    悟空「お婆さん、ここから解陽山までは、どれくらいありますか？」
    老婆「三十里あります」
    悟空「よかった、よかった！　お師匠さま、ご安心ください。私が水を汲んできて、お飲ませします」
  "translation_status": "reviewed"

  "source_text": "好大聖，吩咐沙僧道：「你好仔細看著師父。若這家子無禮，侵哄師父，你拿出舊時手段來，裝\U0002192B諕他。等我取水去。」沙僧依命。只見那婆子端出一個大瓦缽來，遞與行者道：「拿這缽頭兒去，是必多取些來，與我們留著用急。」行者真個接了瓦缽，出草舍，縱雲而去。那婆子才望空禮拜道：「爺爺呀！這和尚會駕雲。」才進去叫出那幾個婦人來，對唐僧磕頭禮拜，都稱為羅漢菩薩。一壁廂燒湯辦飯，供奉唐僧不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"

  "translation_ja": |-
    第五十三回
    禅の主は飲食して怪しい子を宿し、黄婆は水を運んで邪なる胎を解く
  "translation_status": "reviewed"
- "id": "xy-ch53-002"
  "section_id": "chapter-53"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    德行要修八百，陰功須積三千。均平物我與親冤。始合西天本願。
    魔兕刀兵不怯，空勞水火無愆。老君降伏卻朝天。笑把青牛牽轉。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 119
    "line_end": 120
  "translation_ja": |-
    徳の行いは八百を修め、人知れぬ功徳は三千を積まねばならぬ。
    自分と他者、親しい者と仇を、分け隔てなく扱ってこそ、西天（さいてん）を目指す本願にかなう。
    兕（じ）の魔物は刃も兵も恐れず、水と火もむなしく費やすばかりで傷を負わせられぬ。
    老君（ろうくん）が降伏させて天へ帰る。笑いながら青牛（せいぎゅう）を引き戻して。
  "translation_status": "reviewed"
- "id": "xy-ch53-003"
  "section_id": "chapter-53"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說那大路傍叫喚者誰？乃金兜本作“⿰山兜”，Unicode缺字山山神、土地，捧著紫金缽盂叫道：「聖僧啊，這缽盂飯是孫大聖向好處化來的。因你等不聽良言，誤入妖魔之手，致令大聖勞苦萬端，今日方救得出。且來吃了飯，再去走路，莫孤負孫大聖一片恭孝之心也。」三藏道：「徒弟，萬分虧你，言謝不盡。早知不出圈痕，那有此殺身之害？」行者道：「不瞞師父說，只因你不信我的圈子，卻教你受別人的圈子。多少苦楚。可嘆，可嘆！」八戒道：「怎麼又有個圈子？」行者道：「都是你這孽嘴孽舌的夯貨，弄師父遭此一場大難，著老孫翻天覆地，請天兵、水火與佛祖丹砂，盡被他使一個白森森的圈子套去。如來暗示了羅漢，對老孫說出那妖的根原，才請老君來收伏，卻是個青牛作怪。」三藏聞言，感激不盡道：「賢徒，今番經此，下次定然聽你吩咐。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch53-1498139"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第053回&oldid=1498139"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、大路の脇で呼んでいたのは誰だったか。金兜山（きんとうざん）の山神（さんじん）と土地神（とちがみ）である。紫金（しきん）の鉢を捧げ持ち、呼びかけた。
    山神と土地神「聖僧さま、この鉢の飯は、孫大聖（そんたいせい）さまがよい所で托鉢してこられたものです。皆さまが忠告をお聞きにならず、うっかり妖魔の手に落ちられたため、大聖（たいせい）さまはさまざまなご苦労を重ね、今日になってようやくお救いになりました。まずお食事をして、それから旅をお続けください。孫大聖さまの、師を敬い孝養を尽くすお心を無になさいませんように」
    三蔵（さんぞう）「弟子よ、本当に世話になった。感謝の言葉も尽くせぬ。初めからあの輪の跡の外へ出なければ、どうして命を失いかねぬ災いに遭っただろう」
    悟空（ごくう）「正直なところ、お師匠さまが私の輪を信用なさらなかったばかりに、人の輪で苦しめられることになったのです。どれほどつらい思いをされたことか。嘆かわしいことです、嘆かわしいことです」
    八戒（はっかい）「どうして、また輪が出てくるんだ？」
    悟空「みんなお前のせいだ、悪い口をきくろくでなしめ！　お師匠さまをあんな大難に遭わせ、俺は天地をひっくり返すほど駆け回った。天兵、水と火、それに仏祖（ぶっそ）の丹砂（たんしゃ）まで頼んだのに、あいつは白く光る輪を使って、何もかもさらっていった。如来（にょらい）が羅漢（らかん）にそれとなく教え、羅漢から俺に妖怪の素性を知らせてくれたので、やっと老君をお呼びして、妖怪を降伏させていただいたのだ。正体は、悪さをしていた青牛だった」
    三蔵は聞くと、感謝してもしきれずに言った。
    三蔵「よい弟子よ、今度これだけの目に遭ったからには、次からは必ずお前の言うとおりにしよう」
  "translation_status": "reviewed"

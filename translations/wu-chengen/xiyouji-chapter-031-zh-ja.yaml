  "source_text": "卻說八戒、沙僧把兩個孩子拿到寶象國中，往那白玉階前捽下。可憐都摜做個肉餅相似，鮮血迸流，骨骸粉碎。慌得那滿朝多官報道：「不好了，不好了，天上摜下兩個人來了。」八戒厲聲高叫道：「那孩子是黃袍妖精的兒子，被老豬與沙弟拿將來也！」"

  "kind": "verse"
  "origin": "source"
  "source_text": "大聖神通大，妖魔本事高。這個橫理生鐵棒，那個斜舉蘸鋼刀。悠悠刀起明霞亮，輕輕棒架彩雲飄。往來護頂翻多次，反覆渾身轉數遭。一個隨風更面目，一個立地把身搖。那個大睜火眼伸猿臂，這個明幌金睛折虎腰。你來我去交鋒戰，刀迎棒架不相饒。猴王鐵棍依三略，怪物鋼刀按六韜。一個慣行手段為魔主，一個廣施法力保唐僧。猛烈的猴王添猛烈，英豪的怪物長英豪。死生不顧空中打，都為唐僧拜佛遙。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    大聖の神通力は大きく、妖魔の腕も高い。
    こちらは生鉄の棒を横に構え、あちらは焼きを入れた鋼の刀を斜めに上げる。
    ゆらりと刀が上がれば明るい霞が輝き、軽く棒で受ければ彩雲が漂う。
    行きつ戻りつ、頭を守って幾度も翻り、返しては全身を幾巡もさせる。
    一方は風に乗って顔を変え、一方は地に立って身を揺する。
    あちらは火の目を見開き猿の腕を伸ばし、こちらは金の瞳を輝かせ虎の腰をひねる。
    寄せては返す刃の争い、刀で迎え棒で受け、互いに譲らない。
    猴王（こうおう）の鉄棒は三略（さんりゃく）により、妖怪の鋼刀は六韜（りくとう）にかなう。
    一方は手管を使い慣れた魔の主、一方は広く法力を施し三蔵を守る。
    猛烈な猴王はますます猛烈に、豪傑の妖怪はますます豪傑ぶりを増す。
    生死を顧みず空中で戦うのも、すべて三蔵が遠く仏を拝みに行くためなのだ。
  "translation_status": "reviewed"
- "id": "xy-ch31-025"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個戰有五六十合，不分勝負。行者心中暗喜道：「這個潑怪，他那口刀倒也抵得住老孫的這根棒。等老孫丟個破綻與他，看他可認得？」好猴王，雙手舉棍，使一個「高探馬」的勢子。那怪不識是計，見有空兒，舞著寶刀，徑奔下三路砍；被行者急轉個「大中平」，挑開他那口刀，又使個「葉底偷桃勢」，望妖精頭頂一棍，就打得他無影無蹤。急收棍子看處，不見了妖精。行者大驚道：「我兒啊，不禁打，就打得不見了。果是打死，好道也有些膿血，如何沒一毫蹤影？想是走了。」急縱身跳在雲端裡看處，四邊更無動靜。「老孫這雙眼睛，不管那裡，一抹都見，卻怎麼走得這等溜撒？我曉得了，那怪說有些兒認得我，想必不是凡間的怪，多是天上來的精。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    二人は五、六十合戦ったが、勝負はつかなかった。悟空は胸の内で喜んだ。「このろくでなし、あの刀で俺の棒を受け止めるとは、なかなかやる。ひとつ隙を見せてやろう。見抜けるかな？」
    さすがの悟空は、両手で棒を上げ、「高探馬（こうたんば）」の構えを取った。黄袍怪は計略とは知らず、隙を見て宝刀を振り、下段へまっしぐらに斬り込んだ。悟空はすかさず「大中平（だいちゅうへい）」に転じ、刀をはね上げ、さらに「葉底偸桃（ようていとうとう）」の手を使って、妖怪の頭へ棒を一撃。すると妖怪は、影も形もなくなった。急いで棒を引いて見たが、姿がない。
    悟空は驚いた。「おやおや、お前は打たれるのに弱くて、一発で消えてしまったか。本当に死んだのなら、少しは膿や血があるはずだ。それがどうして跡形もない？　さては逃げたな。」
    すぐに身を躍らせて雲の上へ跳び上がり、四方を見たが、何の気配もない。悟空「この俺の目なら、どこでも一目で見通せる。それなのに、どうしてこんなにすばしこく逃げられた？　分かったぞ。あいつは俺にどこかで見覚えがあると言った。きっと地上の妖怪ではない。おそらく天から来た精だ。」
  "translation_status": "reviewed"
- "id": "xy-ch31-026"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖一時忍不住怒發，揝著鐵棒，打個觔斗，只跳到南天門上。慌得那龐、劉、苟、畢，張、陶、鄧、辛等眾，兩邊躬身控背，不敢攔阻，讓他打入天門，直至通明殿下。早有張、葛、許、丘四大天師問道：「大聖何來？」行者道：「因保唐僧至寶象國，有一妖魔欺騙國女，傷害吾師，老孫與他賭鬥。正鬥間，不見了這怪。想那怪不是凡間之怪，多是天上之精，特來查勘，那一路走了甚麼妖神？」天師聞言，即進靈霄殿上啟奏。蒙差查勘九曜星官、十二元辰、東西南北中央五斗、河漢群辰、五岳四瀆、普天神聖都在天上，更無一個敢離方位。又查那斗牛宮外二十八宿，顛倒只有二十七位，內獨少了奎星。天師回奏道：「奎木狼下界了。」玉帝道：「多少時不在天了？」天師道：「四卯不到，三日點卯一次，今已十三日了。」玉帝道：「天上十三日，下界已是十三年。」即命本部收他上界。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    悟空はついに怒りを抑えきれなくなり、鉄棒を握り、宙返り一つで南天門（なんてんもん）へ跳び上がった。龐（ほう）、劉（りゅう）、苟（こう）、畢（ひつ）、張（ちょう）、陶（とう）、鄧（とう）、辛（しん）らは慌て、両側で腰をかがめた。遮る勇気もなく、悟空が天門へ打って入るままにさせた。悟空はまっすぐ通明殿（つうめいでん）の下へ来た。すでに張・葛・許・丘（ちょう・かつ・きょ・きゅう）の四大天師（しだいてんし）がいて、尋ねた。
    四大天師「大聖、何のご用でおいでになりました？」
    悟空「三蔵を守って宝象国まで来たところ、王女をだまし、私の師を傷つけた妖魔がいたので、戦ったのです。ところが戦いの最中に、あいつは姿を消した。地上の妖怪ではなく、おそらく天上の精だろうと思い、調べに来ました。どの部署から、何という神が抜け出していますか？」
    天師（てんし）たちは聞くと霊霄殿（れいしょうでん）へ入り、奏上した。調査の命を受け、九曜星官（くようせいかん）、十二元辰（じゅうにげんしん）、東西南北と中央の五斗（ごと）、天の川の星々、五岳四瀆（ごがくしとく）、あまねく天上の神聖を調べたが、みな天におり、一人として持ち場を離れた者はいなかった。さらに斗牛宮（とぎゅうきゅう）の外の二十八宿（にじゅうはっしゅく）を調べると、どう数え直しても二十七柱しかおらず、奎星（けいせい）だけが欠けていた。
    天師は戻って報告した。「奎木狼（けいもくろう）が下界へ降りております。」
    玉帝（ぎょくてい）「いつから天にいないのだ？」
    天師「点呼を四回欠いております。三日に一度点呼を行いますので、今日でもう十三日になります。」
    玉帝「天上で十三日なら、下界ではすでに十三年だ。」
    ただちに、所属の星宿たちへ連れ戻すよう命じた。
  "translation_status": "reviewed"
- "id": "xy-ch31-027"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那二十七宿星員領了旨意，出了天門，各念咒語，驚動奎星。你道他在那裡躲避？他原來是孫大聖大鬧天宮時打怕了的神將，閃在那山澗裡潛災，被水氣隱住妖雲，所以不曾看見他。他聽得本部星員念咒，方敢出頭，隨眾上界。被大聖攔住天門要打，幸虧眾星勸住，押見玉帝。那怪腰間取出金牌，在殿下叩頭納罪。玉帝道：「奎木狼，上界有無邊的勝景，你不受用，卻私走一方，何也？」奎宿叩頭奏道：「萬歲，赦臣死罪。那寶象國王公主，非凡人也。他本是披香殿侍香的玉女，因欲與臣私通，臣恐點污了天宮勝境。他思凡先下界去，托生於皇宮內院。是臣不負前期，變作妖魔，占了名山，攝他到洞府，與他配了一十三年夫妻。『一飲一啄，莫非前定。』今被孫大聖到此成功。」玉帝聞言，收了金牌，貶他去兜率宮與太上老君燒火，帶俸差操，有功復職，無功重加其罪。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    二十七宿の星の官たちは命令を受け、天門を出て、それぞれ呪文を唱え、奎星を呼び起こした。さて、黄袍怪はどこに隠れていたのだろうか。実は、かつて悟空が天宮で大暴れしたとき、打たれて恐れをなした神将だったのである。山の谷川へ身を潜めて難を避け、水の気に妖雲が隠れていたので、悟空にも見えなかった。所属の星の官たちが呪文を唱えるのを聞いて、ようやく顔を出し、一同について天へ上った。
    悟空が天門を塞いで打とうとしたが、幸い星の神々がなだめて止め、黄袍怪を玉帝の前へ引き立てた。黄袍怪は腰から金の札を取り出し、殿の下で額を地につけて罪を認めた。
    玉帝「奎木狼、天界には見事な景色が限りなくある。それを楽しまず、ひそかに下界の一方へ走ったのはなぜだ？」
    奎宿（けいしゅく）であった黄袍怪は額を地につけ、奏上した。「陛下、どうか臣の死罪をお許しください。あの宝象国の公主は、ただの人間ではございません。もとは披香殿（ひこうでん）で香に仕える玉女（ぎょくじょ）でした。臣とひそかに情を通じようとしましたが、臣は天宮の清らかな境地を汚すのを恐れました。彼女は俗世を慕って先に下界へ降り、皇宮の奥へ生まれ変わりました。臣は以前の約束を裏切るまいと、妖魔の姿になって名山を占め、彼女を洞へ連れてきて、十三年間夫婦となっていたのでございます。『一口飲み、一口食うことまでも、すべて前から定まっている』と申します。今、孫大聖（そんたいせい）が来られ、この功業をお遂げになったのです。」
    玉帝は聞くと金の札を取り上げ、黄袍怪を兜率宮（とそつきゅう）へ落として、太上老君（たいじょうろうくん）の火の番をさせた。俸給はそのままに下働きを命じ、功があれば復職させ、功がなければさらに罪を重くすることとした。
  "translation_status": "reviewed"
- "id": "xy-ch31-028"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見玉帝如此發放，心中歡喜，朝上唱個大喏，又向眾神道：「列位，起動了。」天師笑道：「那個猴子還是這等村俗，替他收了怪神，也倒不謝天恩，卻就唱喏而退。」玉帝道：「只得他無事，落得天上清平是幸。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空は玉帝のこの処置を見て喜び、上へ向かって大声で挨拶し、さらに神々へ言った。
    悟空「皆さん、お手数をかけました。」
    天師は笑った。「あの猿は、相変わらず無作法だ。妖神を捕まえてやったというのに、天の恩にも礼を述べず、一声挨拶しただけで引き揚げていく。」
    玉帝「やつが騒ぎさえ起こさなければ、天界の平穏が保たれる。それだけで幸いだ。」
  "translation_status": "reviewed"
- "id": "xy-ch31-029"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖按落祥光，徑轉碗子山波月洞，尋出公主，將那思凡下界收妖的言語正然陳訴。只聽得半空中八戒、沙僧厲聲高叫道：「師兄，有妖精，留幾個兒我們打耶。」行者道：「妖精已盡絕矣。」沙僧道：「既把妖精打絕，無甚罣礙，將公主引入朝中去罷。不要睜眼，兄弟們使個縮地法來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    悟空は祥雲を下ろし、まっすぐ碗子山（わんしざん）の波月洞へ戻って、百花羞を探し出した。俗世を慕って下界へ降りたという話と、妖怪を捕らえた次第を、きちんと伝えていると、空の半ばから八戒と沙悟浄が大声で叫んだ。
    八戒と沙悟浄「兄貴、妖怪がいるなら、何匹か俺たちに打たせてくれ！」
    悟空「妖怪はもう、一匹残らず片づいたぞ。」
    沙悟浄「妖怪をすべて退治して、もう妨げがないのなら、公主を宮中へお連れしましょう。公主、目を開けないでください。私たちが縮地法（しゅくちほう）を使います。」
  "translation_status": "reviewed"
- "id": "xy-ch31-030"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那公主只聞得耳內風響，霎時間徑回城裡，他三人將公主帶上金鑾殿上。那公主恭拜了父王、母后，會了姊妹。各官俱來拜見。那公主才啟奏道：「多虧孫長老法力無邊，降了黃袍怪，救奴回國。」那國王問曰：「黃袍是個甚怪？」行者道：「陛下的駙馬是上界的奎星，令愛乃侍香的玉女，因思凡降落人間。不非小可，都因前世前緣，該有這些姻眷。那怪被老孫上天宮啟奏玉帝，玉帝查得他四卯不到，下界十三日，就是十三年了。──蓋天上一日，下界一年。──隨差本部星宿收他上界，貶在兜率宮立功去訖。老孫卻救得令愛來也。」那國王謝了行者的恩德，便教：「看你師父去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    百花羞は、耳に風の音を聞いたと思うと、またたく間に都へ帰っていた。三人は公主を連れて金鑾殿へ上がった。百花羞は父王と母后にうやうやしく拝礼し、姉妹と再会した。官人たちも、みな挨拶に来た。そこで百花羞は奏上した。
    百花羞「孫長老（そんちょうろう）の限りない法力のおかげでございます。黄袍怪を降し、私を救って、この国へ連れ戻してくださいました。」
    国王「黄袍とは、いったい何の妖怪だったのだ？」
    悟空「陛下の婿は天上の奎星、ご息女は香に仕える玉女で、俗世を慕って人間界へ降りてきたのです。並々のことではありません。すべて前世からの縁によって、この婚姻が定まっていたのです。私が天宮へ上がり、玉帝へ奏上したところ、あいつが点呼を四回欠き、下界へ降りて十三日、つまり十三年になると分かりました。天上の一日は、下界の一年なのです。そこで所属の星宿たちが遣わされ、あいつを天へ連れ戻し、兜率宮へ落として功を立てさせることになりました。それで、ご息女をお救いしてきたのです。」
    国王は悟空の恩徳に礼を述べ、続けて言った。「そなたの師を見に行くがよい。」
  "translation_status": "reviewed"
- "id": "xy-ch31-031"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他三人徑下寶殿，與眾官到朝房裡，擡出鐵籠，將假虎解了鐵索。別人看他是虎，獨行者看他是人。原來那師父被妖術魘住，不能行走，心上明白，只是口眼難開。行者笑道：「師父啊，你是個好和尚，怎麼弄出這般個惡模樣來也？你怪我行兇作惡，趕我回去，你要一心向善，怎麼一旦弄出個這等嘴臉？」八戒道：「哥啊，救他救兒罷，不要只管揭挑他了。」行者道：「你凡事攛唆，是他個得意的好徒弟，你不救他，又尋老孫怎的？原與你說來，待降了妖精，報了罵我之仇，就回去的。」沙僧近前跪下道：「哥啊，古人云：『不看僧面看佛面。』兄長既是到此，萬望救他一救。若是我們能救，也不敢許遠的來奉請你也。」行者用手挽起道：「我豈有安心不救之理？快取水來。」那八戒飛星去驛中，取了行李、馬匹，將紫金缽盂取出，盛水半盂，遞與行者。行者接水在手，念動真言，望那虎劈頭一口噴上，退了妖術，解了虎氣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    三人は宝殿を下り、官人たちと役所の控え室へ行った。鉄の檻を運び出し、虎の姿をした三蔵から鉄鎖を外した。ほかの人には虎に見えたが、悟空にだけは人間に見えた。実は三蔵は妖術に押さえつけられて歩けず、心でははっきり分かっていたものの、口も目も開きにくくなっていたのである。
    悟空は笑った。「お師匠さま、立派な和尚でいらっしゃるのに、どうしてこんな凶悪な姿になられたのです？　私が乱暴な悪事をするからと責め、追い返されましたね。一心に善を行おうとされたのに、どうして突然こんな顔になってしまわれたのですか？」
    八戒「兄貴、助けてやってくれよ。いつまでも痛いところを突くのはやめてくれ。」
    悟空「お前は何につけても焚きつけて、お師匠さまお気に入りの立派な弟子じゃないか。自分で救わずに、なぜ俺を呼びに来た？　初めから言っておいただろう。妖怪を降し、俺を罵った恨みを晴らしたら帰る、と。」
    沙悟浄は進み出て、ひざまずいた。「兄貴、昔から『僧の顔に免じられなくても、仏の顔に免じよ』と言います。ここまで来てくださったのですから、どうかお師匠さまを救ってください。私たちに救えるのなら、あれほど遠くまでお迎えに行って、煩わせはしませんでした。」
    悟空は手を取って立たせた。「俺が助けないつもりでいるはずがあるか。早く水を持ってこい。」
    八戒は流れ星のように宿駅へ走り、荷物と馬を連れてきた。紫金（しきん）の鉢を取り出し、半分ほど水を入れて悟空へ渡す。悟空は受け取り、真言を唱え、虎の頭めがけて一口の水を吹きかけた。妖術を退け、虎に見せていた気を解き去った。
  "translation_status": "reviewed"
- "id": "xy-ch31-032"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老現了原身，定性睜睛，才認得是行者。一把攙住道：「悟空，你從那裡來也？」沙僧侍立左右，把那請行者，降妖精，救公主，解虎氣，並回朝上項事，備陳了一遍。三藏謝之不盡道：「賢徒，虧了你也，虧了你也。這一去，早詣西方，徑回東土，奏唐王，你的功勞第一。」行者笑道：「莫說，莫說，但不念那話兒，足感愛厚之情也。」國王聞此言，又勸謝了他四眾。整治素筵，大開東閣。他師徒受了皇恩，辭王西去。國王又率多官遠送。這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    三蔵は本来の姿に戻り、心を落ち着けて目を開き、ようやく悟空だと分かった。ぐっと手をつかみ、三蔵は言った。「悟空、お前はどこから来たのだ？」
    沙悟浄は傍らに控え、悟空を迎え、妖怪を降し、公主を救い、虎の気を解いたこと、そして宮中へ帰ってきたことまで、一部始終を詳しく話した。三蔵は礼を言っても言い尽くせなかった。
    三蔵「よい弟子だ。お前のおかげだ、本当にお前のおかげだ。この先、早く西方へ参り、東土へ帰ったなら、唐王（とうおう）には、お前の功労が第一だと申し上げよう。」
    悟空は笑った。「もう結構です、もう結構です。あの言葉さえ唱えずにいてくだされば、それだけで十分にお情けの深さを感じます。」
    国王もこの話を聞き、師弟四人をねぎらって礼を述べた。精進の宴を整え、東閣（とうかく）を大きく開いた。師弟は王のもてなしを受けたのち、別れを告げて西へ向かった。国王はさらに官人たちを率い、遠くまで見送った。まさに、こういうことだ。
  "translation_status": "reviewed"
- "id": "xy-ch31-033"

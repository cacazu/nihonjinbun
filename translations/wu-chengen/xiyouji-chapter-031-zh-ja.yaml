  "source_text": "卻說那八戒停立空中，看見沙僧出洞，即按下雲頭，叫聲：「沙兄弟，心忍，心忍。」沙僧見身道：「二哥，你從那裡來？」八戒道：「我昨日敗陣，夜間進城，會了白馬，知師父有難，被黃袍使法，變做個老虎。那白馬與我商議，請師兄來的。」行者道：「獃子，且休敘闊。把這兩個孩子，各抱著一個，先進那寶象城去激那怪來，等我在這裡打他。」沙僧道：「哥啊，怎麼樣激他？」行者道：「你兩個駕起雲，站在那金鑾殿上，莫分好歹，把那孩子往那白玉階前一摜。有人問你是甚人，你便說是黃袍妖精的兒子，被我兩個拿將來也。那怪聽見，管情回來，我卻不須進城與他鬥了。若在城上廝殺，必要噴雲噯霧，播土揚塵，驚擾那朝廷與多官、黎庶，俱不安也。」八戒笑道：「哥哥，你但幹事，就左我們。」行者道：「如何為左你？」八戒道：「這兩個孩子被你抓來，已此諕破膽了，這一會聲都哭啞，再一會必死無疑。我們拿他往下一摜，摜做個肉\U00026690子，那怪趕上肯放？定要我兩個償命。你卻還不是個乾淨人？連見證也沒你，你卻不是左我們？」行者道：「他若扯你，你兩個就與他打將這裡來。這裡有戰場寬闊，我在此等候打他。」沙僧道：「正是，正是，大哥說得有理，我們去來。」他兩個才倚仗威風，將孩子拿去。"
  "source_languages":

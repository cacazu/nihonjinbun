  "translation_ja": |-
    空中にとどまっていた八戒は、沙悟浄が洞から出てきたのを見ると、雲を下ろして呼びかけた。
    八戒「沙の弟よ、つらかったろう、つらかったろう。」
    沙悟浄は八戒の姿を見ると言った。「二番目の兄貴、どこから来たんです？」
    八戒「昨日負けて逃げ、夜に都へ入って白馬に会った。そこで、お師匠さまが災難に遭って、黄袍の術で虎に変えられたと知ったんだ。白馬と相談して、兄貴を迎えてきたのさ。」
    悟空「馬鹿め、積もる話は後にしろ。この子供を一人ずつ抱え、先に宝象の都へ入って、妖怪を挑発して来させろ。俺はここで待って戦う。」
    沙悟浄「兄貴、どうやって挑発するのです？」
    悟空「二人で雲に乗り、金鑾殿（きんらんでん）の上に立って、かまわず子供を白玉の階段の前へ投げ落とせ。誰だと尋ねられたら、黄袍の妖怪の子供を俺たち二人が捕まえてきた、と言えばいい。妖怪はそれを聞けば、必ず戻ってくる。そうすれば俺は都へ入って戦う必要がない。都の上で戦えば、雲を吹き、霧を吐き、土埃を巻き上げることになる。朝廷も官人たちも民も驚かせ、みな落ち着かなくなるからな。」
    八戒は笑った。「兄貴は、何かすると必ず俺たちに損な役を回すね。」
    悟空「どこが損な役なんだ？」
    八戒「この子らは兄貴に捕まって、もう肝がつぶれるほど怯えている。今だって泣き声が枯れて、もう少しすれば必ず死んでしまう。俺たちが連れていって投げ落とし、肉の塊にしてしまったら、追ってきた妖怪が見逃すかい？　きっと俺たち二人に、命で償えと言う。ところが兄貴は、手を汚していない顔をしていられるだろう。証人にさえならないんだ。これが損な役を押しつけることでなくて、何だ？」
    悟空「あいつが食ってかかってきたら、二人で戦いながらここへ引っ張ってこい。ここなら戦う場所が広い。俺は待っていて、あいつを打つ。」
    沙悟浄「そうです、そうです。一番上の兄貴の言うとおりだ。行ってきましょう。」
    そこで二人は悟空の威勢を頼みに、子供たちを連れていった。

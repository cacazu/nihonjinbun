  "translation_ja": |-
    ああ、沙悟浄は「孫悟空」の三文字を聞くと、醍醐（だいご）を頭に注がれ、甘露（かんろ）で心を潤されたような気持ちになった。顔いっぱいに喜びが湧き、胸いっぱいに春が満ちる。人が来たと聞いたというより、金や玉の塊を拾い当てたようだった。沙悟浄は手を振り、衣を払い、門を出て悟空に礼をした。
    沙悟浄「兄貴、本当に天から降ってきてくださったのですね。どうか、どうか助けてください。」
    悟空は笑った。「この沙の尼僧め。お師匠さまが緊箍児の呪（きんこじのじゅ）を唱えたとき、俺のために一言でも取りなしてくれたか？　みんな口先で腕を誇り、お師匠さまを守ると言っていたのに、西方への道を進まず、ここで何をうずくまっている？」
    沙悟浄「兄貴、もうその話はやめてください。君子は過ぎたことを咎めないものです。私たちは敗軍の将、勇ましいことは言えません。どうか助けてくださいよ。」
    悟空「ここへ上がれ。」
    沙悟浄は身を躍らせ、岩崖の上へ跳び上がった。

  "translation_ja": |-
    黄袍怪はそれを聞くと、急いで号令を伝え、山の前後、洞の内外にいる妖怪どもを一斉に集めた。それぞれ武器を持たせ、三重、四重に並ぶ門を隙間なく塞ぎ、逃がすまいとした。悟空は見て大いに喜び、両手で棒を構えて叫んだ。
    悟空「変われ！」
    たちまち三頭六臂（さんとうろっぴ）となり、金箍棒（きんこぼう）を揺すって三本に変えた。見よ、六本の手で三本の棒を振るい、打ちながら突き進むさまは、羊の群れへ虎が入り、鶏の囲いへ鷹が襲うようだった。哀れな小妖たちは、まともに当たれば頭が粉々になり、かすめれば血が水のように流れる。悟空は縦横に行き来し、無人の野を進むも同然だった。
    残ったのは黄袍怪ただ一人。門を追い出て罵った。「このろくでなしの猿め、まったくふてぶてしい！　人の家へ押しかけて、どうしてこんな仕打ちをする？」
    悟空はすぐに振り返り、手招きした。「来い、来い。お前を打ち倒してこそ、手柄になるんだ。」
    黄袍怪は宝刀を振り上げ、頭めがけて斬りつける。さすがの悟空は鉄棒を引き抜き、正面から受けて立った。山の頂、雲と霧が半ばずつかかったところで、こんな戦いが始まった。

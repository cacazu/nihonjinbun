    第三十一回
    猪八戒、義によって猴王を奮い立たせる　孫行者、知恵で妖怪を降す
  "translation_status": "reviewed"
- "id": "xy-ch31-002"
  "section_id": "chapter-31"
  "kind": "verse"
  "origin": "source"
  "source_text": "義結孔懷，法歸本性。金順木馴成正果，心猿木母合丹元。共登極樂世界，同來不二法門。經乃修行之總徑，佛配自己之元神。兄和弟會成三契，妖與魔色應五行。剪除六門趣，即赴大雷音。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    義によって兄弟の情を結び、仏法によって本来の性に帰る。
    金は従い、木は馴れて正果（しょうか）を成し、心猿（しんえん）と木母（もくぼ）は丹元（たんげん）を一つにする。
    ともに極楽世界に登り、ともに不二法門（ふにほうもん）へ入る。
    経は修行を貫く道、仏はおのれの元神（げんしん）に対応する。
    兄は和し、弟は会して三契（さんけい）を成し、妖と魔と色欲は五行（ごぎょう）に応じる。
    六門（ろくもん）から欲へ向かう働きを断ち除けば、ただちに大雷音（だいらいおん）へ赴くのだ。
  "translation_status": "reviewed"
- "id": "xy-ch31-003"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那獃子被一窩猴子捉住了，扛擡扯拉，把一件直裰子揪破。口裡勞勞叨叨的，自家念誦道：「罷了，罷了，這一去有個打殺的情了。」不一時，到洞口。那大聖坐在石崖之上，罵道：「你這囊糠的夯貨！你去便罷了，怎麼罵我？」八戒跪在地下道：「哥啊，我不曾罵你；若罵你，就嚼了舌頭根。我只說哥哥不去，我自去報師父便了。怎敢罵你？」行者道：「你怎麼瞞得過我？我這左耳往上一扯，曉得三十三天人說話；我這右耳往下一扯，曉得十代閻王與判官算帳。你今走路把我罵，我豈不聽見？」八戒道：「哥啊，我曉得你賊頭鼠腦的，一定又變作個甚麼東西兒，跟著我聽的。」行者叫：「小的們，選大棍來，先打二十個見面孤拐，再打二十個背花，然後等我使鐵棒與他送行。」八戒慌得磕頭道：「哥哥，千萬看師父面上，饒了我罷。」行者道：「我想那師父好仁義兒哩。」八戒又道：「哥哥，不看師父啊，請看海上菩薩之面，饒了我罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    さて八戒（はっかい）は、猿の一群に捕まり、担がれ、引っ張られ、引きずられて、着ていた直裰（ちょくたつ）まで引き裂かれた。口の中でぶつぶつと、八戒は独り言を言った。「もう駄目だ、もう駄目だ。連れ戻されたら、打ち殺されそうだぞ。」
    ほどなく洞の入り口に着いた。悟空（ごくう）は岩崖の上に座り、罵った。「この、糠を詰めた役立たずめ！　帰るなら帰ればいいものを、なぜ俺を罵った？」
    八戒は地面にひざまずいた。「兄貴、俺は悪口なんか言っていない。言ったのなら、この舌の根を噛み切るよ。兄貴が行かないのなら、俺一人で帰ってお師匠さまに知らせる、それだけさ。どうして兄貴を罵れるものか。」
    悟空「俺をだませると思うのか？　左の耳を上へ引っ張れば、三十三天（さんじゅうさんてん）の人々の話が分かる。右の耳を下へ引っ張れば、冥界の十王（じゅうおう）と判官（はんがん）が帳簿を調べる話まで分かるんだ。お前が道々俺を罵ったのを、聞いていないはずがあるか？」
    八戒「兄貴、俺には分かっているよ。兄貴は抜け目がなくてすばしこいから、また何かに化けて、俺の後をつけて聞いていたんだろう。」
    悟空は叫んだ。「お前たち、太い棒を選んで持ってこい。まず挨拶代わりに足首を二十打、それから背中を二十打してやれ。その後、この俺が鉄棒であの世へ送ってやる。」
    八戒は慌てて額を地につけた。「兄貴、どうかお師匠さまの顔に免じて、勘弁してくれ。」
    悟空「あのお師匠さまは、さぞ仁義に厚い方だったな！」
    八戒は重ねて頼んだ。「兄貴、お師匠さまのためが駄目なら、どうか海上の観音菩薩（かんのんぼさつ）の顔に免じて、許してくれよ。」
  "translation_status": "reviewed"
- "id": "xy-ch31-004"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見說起菩薩，卻有三分兒轉意道：「兄弟，既這等說，我且不打你。你卻老實說，不要瞞我。那唐僧在那裡有難，你卻來此哄我？」八戒道：「哥哥，沒甚難處，實是想你。」行者罵道：「這個好打的劣貨，你怎麼還要者囂我？老孫身回水簾洞，心逐取經僧。那師父步步有難，處處該災，你趁早兒告訢我，免打。」八戒聞得此言，叩頭上告道：「哥啊，分明要瞞著你，請你去的，不期你這等樣靈。饒我打，放我起來說罷。」行者道：「也罷，起來說。」眾猴撒開手。那獃子跳得起來，兩邊亂張。行者道：「你張甚麼？」八戒道：「看看那條路兒空闊，好跑。」行者道：「你跑到那裡？我就讓你先走三日，老孫自有本事趕轉你來。快早說來，這一惱發我的性子，斷不饒你。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    菩薩の名を出されて、悟空の気持ちもいくらか変わった。悟空「弟よ、そこまで言うなら、ひとまず打つのはやめてやる。だが正直に言え、隠すなよ。三蔵（さんぞう）はどこで災難に遭ったんだ。それでお前は俺をだましに来たのだろう？」
    八戒「兄貴、災難なんて何もない。本当に会いたがっているだけなんだ。」
    悟空は罵った。「打たれたがりのろくでなしめ、まだ俺をごまかす気か！　この俺の体は水簾洞（すいれんどう）に帰っていても、心は経を取りに行く僧についている。お師匠さまは一歩ごとに難があり、行く先々で災いに遭うお方だ。早く言えば、打たずに済ませてやる。」
    八戒はそれを聞くと、額を地につけて申し立てた。「兄貴、本当は隠したまま、連れていくつもりだったんだ。こんなによく見抜くとは思わなかった。打たないで、立って話させてくれ。」
    悟空「よかろう。立って話せ。」
    猿たちが手を放すと、八戒は跳ね起き、右や左をきょろきょろ見た。
    悟空「何を見回している？」
    八戒「どの道が広くて逃げやすいか、見ているんだ。」
    悟空「どこへ逃げる気だ？　三日先に行かせてやったって、俺には追いついて連れ戻す力がある。さっさと話せ。俺を本気で怒らせたら、今度こそ容赦はしないぞ。」

  "origin": "source"
  "source_text": "那妖怪見了，大驚道：「呀！渾家，你怎麼拿出這一副嘴臉來耶？」行者罵道：「我把你這個潑怪！誰是你渾家？連你祖宗也還不認得哩。」那怪忽然省悟道：「我像有些認得你哩。」行者道：「我且不打你，你再認認看。」那怪道：「我雖見你眼熟，一時間卻想不起姓名，你果是誰？從那裡來的？你把我渾家估倒在何處，卻來我家詐誘我的寶貝？著實無禮，可惡！」行者道：「你是也不認得我。我是唐僧的大徒弟，叫做孫悟空行者。我是你五百年前的舊祖宗哩。」那怪道：「沒有這話，沒有這話。我拿住唐僧時，止知他有兩個徒弟，叫做豬八戒、沙和尚，何曾見有人說個姓孫的？你不知是那裡來的個怪物，到此騙我。」行者道：「我不曾同他二人來，是我師父因老孫慣打妖怪，殺傷甚多，他是個慈悲好善之人，將我逐回，故不曾同他一路行走。你是不知你祖宗名姓。」那怪道：「你好不丈夫啊，既受了師父趕逐，卻有甚麼嘴臉又來見人？」行者道：「你這個潑怪，豈知『一日為師，終身為父』？『父子無隔宿之仇』？你傷害我師父，我怎麼不來救他？你害他便也罷？卻又背前面後罵我，是怎的說？」妖怪道：「我何嘗罵你？」行者道：「是豬八戒說的。」那怪道：「你不要信他。那個豬八戒尖著嘴，有些會說老婆舌頭，你怎聽他？」行者道：「且不必講此閑話。只說老孫今日到你家裡，你好怠慢了遠客。雖無酒饌款待，頭卻是有的。快快將頭伸過來，等老孫打一棍兒當茶。」那怪聞得說打，呵呵大笑道：「孫行者，你差了計較了，你既說要打，不該跟我進來。我這裡大小群妖還有百十，饒你滿身是手，也打不出我的門去。」行者道：「不要胡說，莫說百十個，就有幾千幾萬，只要一個個查明白了好打，棍棍無空，教你斷根絕跡。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"

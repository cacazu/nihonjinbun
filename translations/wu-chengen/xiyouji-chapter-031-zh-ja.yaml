  "source_text": "那怪還在銀安殿，宿酒未醒。正睡夢間，聽得有人叫他名字，他就翻身，擡頭觀看，只見那雲端裡是豬八戒、沙和尚二人吆喝。妖怪心中暗想道：「豬八戒便也罷了；沙和尚是我綁在家裡，他怎麼得出來？我的渾家怎麼肯放他？我的孩兒怎麼得到他手？這怕是豬八戒不得我出去與他交戰，故將此計來羈我。我若認了這個泛頭，就與他打啊。噫！我卻還害酒哩。假若被他築上一鈀，卻不滅了這個威風，識破了那個關竅？且等我回家看看，是我的兒子不是我的兒子，再與他說話不遲。」好妖怪，他也不辭王駕，轉山林，徑去洞中查信息。"

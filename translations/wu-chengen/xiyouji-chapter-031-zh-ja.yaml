  "translation_ja": |-
    君主は宝殿へ帰り、国を安んじる。
    僧は雷音（らいおん）へ向かい、仏祖（ぶっそ）にまみえる。
  "translation_status": "reviewed"
- "id": "xy-ch31-034"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此後又有甚事，幾時得到西天，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 163
    "line_end": 163
  "translation_ja": "さて、この後またどんなことが起こり、いつ西天（さいてん）へたどり着くのだろうか。それは次回のお話をお聞きいただきたい。"
  "translation_status": "reviewed"

  "translation_ja": |-
    悟空は岩崖から跳び下り、塔の門の下へ行った。
    百花羞「この和尚、まるで信義がありませんね。弟弟子を放したら子供を返すと言ったのに、弟弟子を逃がしてやっても、まだ子供を返さない。それで私の門前へ、何をしに戻ってきたのです？」
    悟空は笑顔を作った。「公主、お怒りなさるな。あなたがここへ来てから、ずいぶん長いので、ご子息を祖父に会わせに連れていったのです。」
    百花羞「和尚、無礼はやめてください。私の黄袍郎（こうほうろう）は、並の者とは違います。子供たちを怯えさせたのなら、驚きを鎮めてやりなさい。」
    悟空は笑った。「公主、人として天地の間に生まれ、どんなことをすれば罪になると思う？」
    百花羞「それくらい知っています。」
    悟空「女のあなたに、何が分かる？」
    百花羞「幼いころから宮中で、父母に教えを受けました。昔の書に、『五刑（ごけい）に当たる罪は三千あるが、不孝より大きい罪はない』とあったのを覚えています。」
    悟空「まさにあなたが、その親不孝者だ。『父よ、私を生み、母よ、私を育ててくださった。ああ、父母よ、私を生むのにどれほど苦労されたことか。』だから孝は、あらゆる行いの源、あらゆる善の根本だという。それなのに妖怪と連れ添い、父母を思いもしないとは、どういうわけだ。それが親不孝の罪でなくて、何だというのか？」
    百花羞はこの正論を聞くと、しばらく耳も顔も真っ赤にして、身の置き場もないほど恥じ入った。ふと、口をついて言葉が出た。
    百花羞「長老のお言葉は、まことにごもっともです。私が父母を思わないはずがありましょうか。ただ、あの妖怪にここへさらってこられ、厳しく取り締まられて、自由に歩くことさえできないのです。山道は遠く、音信を伝えてくれる人もいません。自ら命を絶とうとも思いましたが、そうすれば父母は私が逃げ出したと思い、結局真相が分からないままになるのが心配でした。仕方なく、こうして細々と命をつないでいるのです。私は、本当に天地の間の大きな罪人です。」
    そう言うと、涙が泉のように湧いた。

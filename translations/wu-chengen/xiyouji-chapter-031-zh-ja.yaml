  "source_text": "那怪聞言，急傳號令，把那山前山後群妖，洞裡洞外諸怪，一齊點起，各執器械，把那三四層門，密密攔阻不放。行者見了，滿心歡喜，雙手理棍，喝聲叫：「變！」變的三頭六臂。把金箍棒幌一幌，變做三根金箍棒。你看他六隻手使著三根棒，一路打將去，好便似虎入羊群，鷹來雞柵。可憐那小怪，湯著的，頭如粉碎；刮著的，血似水流。往來縱橫，如入無人之境。止剩一個老妖，趕出門來罵道：「你這潑猴，其實憊懶！怎麼上門子欺負人家？」行者急回頭，用手招呼道：「你來，你來，打倒你，才是功績。」那怪物，舉寶刀，分頭便砍；好行者，掣鐵棒，覿面相迎。這一場，在那山頂上，半雲半霧的殺哩："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"

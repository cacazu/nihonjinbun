    さて八戒と沙悟浄は、二人の子供を宝象国へ連れていき、白玉の階段の前へ投げ落とした。哀れにも二人とも肉餅のようにつぶれ、鮮血がほとばしり、骨は粉々になった。満朝の官人たちは慌てて叫んだ。
    官人たち「大変だ、大変だ！　空から二人、人が投げ落とされたぞ！」
    八戒は鋭い声で叫んだ。「その子らは黄袍の妖怪の息子だ！　この俺と沙の弟が捕まえてきたのだ！」

  "translation_ja": |-
    黄袍怪はまだ銀安殿にいて、前夜の酔いも覚めずに眠っていた。夢うつつに自分の名を呼ぶ声が聞こえ、寝返りを打って頭を上げると、雲の上で八戒と沙悟浄が叫んでいた。黄袍怪は胸の内で考えた。「猪八戒はともかく、沙悟浄は家に縛っておいたはずだ。どうして出てこられた？　女房がどうして放すものか。俺の子供は、どうしてあいつらの手に渡った？　きっと猪八戒が、俺を戦いに引っ張り出せないので、この計略で誘い出そうとしているのだろう。これを真に受けたら、あいつらと戦うことになる。いや、俺はまだ酒が残っているぞ。もし熊手を一発食らえば、威風は吹き飛び、弱みを見破られてしまうではないか。まず家へ戻り、本当に俺の子かどうか確かめてから、話をつけても遅くない。」
    さて、この妖怪は、王に別れも告げず、山林へ向かい、洞へまっすぐ事情を確かめに行った。
  "translation_status": "reviewed"

  "translation_ja": |-
    八戒「兄貴、隠さず話すよ。兄貴が帰った後、俺と沙悟浄（さごじょう）はお師匠さまを守って先へ進んだ。黒松の林に着くと、お師匠さまは馬を下り、俺に施しの食事をもらってこいと言ったんだ。ずいぶん遠くまで行っても一軒も家がなく、疲れたものだから、草の中で少し寝ていた。ところが沙悟浄もお師匠さまを離れて、俺を探しに来たんだ。知ってのとおり、お師匠さまはじっとしていられない方だろう。一人で林の景色を眺めて歩いて、林を出ると黄金の宝塔が光っているのを見つけ、寺だと思い込んだ。ところが塔の下には黄袍（こうほう）という妖怪がいて、お師匠さまは捕まってしまった。
    その後、俺と沙悟浄が戻って探すと、白馬と荷物だけあって、お師匠さまの姿がない。それで洞の入り口まで探しに行き、妖怪と戦った。洞の中のお師匠さまには、幸い救い手がいたんだ。宝象国（ほうぞうこく）の王の第三公主（こうしゅ）で、その妖怪にさらわれてきた人さ。実家へ手紙を書き、お師匠さまに届けてくれと託したうえで、うまく取りなしてお師匠さまを解放してくれた。
    国に着いて手紙を渡すと、国王はお師匠さまに妖怪を降し、公主を連れ戻してくれと頼んだ。兄貴、あの年寄り和尚に妖怪退治なんかできるかい？　俺たち二人がまた戦いに行ったが、妖怪の神通力があんなに強いとは知らず、沙悟浄まで捕まってしまった。俺は負けて逃げ、草の中に隠れた。妖怪は美しい文人に化けて宮中へ入り、王の婿だと名乗って、お師匠さまを虎に変えてしまったんだ。
    そのうえ、竜馬（りゅうめ）が夜に竜の姿へ戻り、お師匠さまを探してくれた。お師匠さまは見つからず、銀安殿（ぎんあんでん）で酒を飲む妖怪に出くわした。宮女に化けて酌をし、刀を舞わせて、隙に斬りつけようとしたが、逆に満堂紅（まんどうこう）で馬の脚を打ち傷つけられたんだ。その竜馬が俺に、兄貴を迎えに行けと言ったんだよ。『兄貴は仁義のある君子だ。君子は昔の恨みにこだわらないから、きっとお師匠さまの災難を救いに来てくださる』とな。どうか『一日でも師となった人は、一生の父』という情を思い出して、ぜひとも助けてやってくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch31-006"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「你這個獃子，我臨別之時，曾叮嚀又叮嚀，說道：『若有妖魔捉住師父，你就說老孫是他大徒弟。』怎麼卻不說我？」八戒又思量道：「請將不如激將，等我激他一激。」道：「哥啊，不說你還好哩，只為說你，他一發無狀。」行者道：「怎麼說？」八戒道：「我說：『妖精，你不要無禮，莫害我師父。我還有個大師兄，叫做孫行者，他神通廣大，善能降妖，他來時教你死無葬身之地。』那怪聞言，越加忿怒，罵道：『是個甚麼孫行者，我可怕他？他若來，我剝了他皮，抽了他觔，啃了他骨，吃了他心。饒他猴子瘦，我也把他剁鮓著油烹。』」行者聞言，就氣得抓耳撓腮，暴躁亂跳道：「是那個敢這等罵我？」八戒道：「哥哥息怒，是那黃袍怪這等罵來，我故學與你聽也。」行者道：「賢弟，你起來。不是我去不成，既是妖精敢罵我，我就不能不降他，我和你去。老孫五百年前大鬧天宮，普天的神將看見我，一個個控背躬身，口口稱呼大聖。這妖怪無禮，他敢背前面後罵我。我這去，把他拿住，碎屍萬段，以報罵我之仇！報畢，我即回來。」八戒道：「哥哥，正是。你只去拿了妖精，報了你仇，那時來與不來，任從尊意。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    悟空「この馬鹿め、俺は別れるとき、何度も念を押しただろう。『妖魔がお師匠さまを捕らえたら、この俺が一番弟子だと言え』と。なぜ俺のことを言わなかった？」
    八戒はまた考えた。「将を頼んで動かすより、将を挑発して動かすほうがいい。ひとつ、怒らせてやろう。」
    八戒「兄貴、言わなければまだよかったんだ。兄貴の名を出したばかりに、あいつはますます無礼になった。」
    悟空「何と言ったんだ？」
    八戒「俺はこう言った。『妖怪、無礼を働くな。お師匠さまに危害を加えるなよ。俺には孫行者（そんぎょうじゃ）という一番上の兄弟子がいる。神通力が強くて、妖怪を降すのがうまい。兄貴が来たら、お前は死骸の埋め場もない最期になるぞ。』すると妖怪はますます怒って、こう罵ったんだ。『孫行者が何だ、俺が恐れるものか。来たら皮を剥ぎ、筋を抜き、骨をかじって心臓を食ってやる。痩せた猿だろうが、細かく切り刻んで油で煮てやるわ。』」
    悟空は聞くなり怒り、耳をかき、頬を掻きむしり、飛び跳ねた。「どいつだ、そんなふうに俺を罵るのは！」
    八戒「兄貴、怒りを鎮めてくれ。黄袍怪（こうほうかい）がそう罵ったから、そのまま聞かせただけだよ。」
    悟空「弟よ、立て。俺が行けないわけじゃない。妖怪がそこまで俺を罵るのなら、降さずにはおけない。お前と行こう。俺が五百年前に天宮で大暴れした後は、天じゅうの神将が俺を見ると、みな腰をかがめて、大聖（たいせい）、大聖と呼んだものだ。この無礼な妖怪め、面と向かっても陰でも、俺を罵るとは。行って捕まえ、体をずたずたにして、罵られた恨みを晴らしてやる！　それが済んだら、すぐに戻るぞ。」
    八戒「兄貴、そのとおりだ。妖怪を捕らえて、恨みを晴らせばいい。その後、こちらへ戻るかどうかは、兄貴の好きにしてくれ。」
  "translation_status": "reviewed"
- "id": "xy-ch31-007"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖才跳下崖，撞入洞裡，脫了妖衣。整一整錦直裰，束一束虎皮裙，執了鐵棒，徑出門來。慌得那群猴攔住道：「大聖爺爺，你往那裡去？帶挈我們耍子幾年也好。」行者道：「小的們，你說那裡話。我保唐僧的這樁事，天上地下，都曉得孫悟空是唐僧的徒弟。他倒不是趕我回來，倒是教我來家看看，送我來家自在耍子。如今只因這件事。你們卻都要仔細看守家業，依時插柳栽松，毋得廢墜。待我還去保唐僧，取經回東土，功成之後，仍回來與你們共樂天真。」眾猴各各領命。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    そこで悟空は崖から跳び下り、洞へ飛び込んで、妖王としての衣装を脱いだ。錦の直裰を整え、虎の皮の腰巻きを締め直し、鉄棒を持って、まっすぐ外へ出た。慌てた猿たちが行く手を遮った。
    猿たち「大聖さま、どこへおいでですか。私たちを連れて、あと何年か遊んでくださってもよいではありませんか。」
    悟空「お前たち、何を言うんだ。俺が三蔵を守るこの仕事については、天も地も、孫悟空（そんごくう）が三蔵の弟子だと知っている。追い出されて帰ったわけじゃない。家の様子を見て、気楽に遊んでこいと、帰らせてくださったのだ。今回はそういうわけだったんだ。お前たちは、しっかり留守を守れ。時季を逃さず柳を挿し、松を植え、荒らしてはならん。また三蔵を守り、経を取って東土（とうど）へ帰り、功業を果たしたら、ここへ戻って、お前たちと自然のままの楽しみを味わおう。」
    猿たちは、みな命令を承った。
  "translation_status": "reviewed"
- "id": "xy-ch31-008"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖才和八戒攜手駕雲，離了洞，過了東洋大海，至西岸，住雲光，叫道：「兄弟，你且在此慢行，等我下海去淨淨身子。」八戒道：「忙忙的走路，且淨甚麼身子？」行者道：「你那裡知道。我自從回來，這幾日弄得身上有些妖精氣了。師父是個愛乾淨的，恐怕嫌我。」八戒於此始識得行者是片真心，更無他意。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    悟空は八戒と手を携えて雲に乗り、洞を離れ、東の大海を渡った。西岸まで来ると雲を止め、悟空は言った。「弟よ、お前はここでゆっくり進んでいろ。俺は海へ下りて、体を洗ってくる。」
    八戒「急いでいるのに、何で今さら体なんか洗うんだ？」
    悟空「お前には分かるまい。帰ってからのこの数日で、体に少し妖怪の気がついてしまった。お師匠さまはきれい好きだから、嫌がられるといけない。」
    八戒はこのとき初めて、悟空の心がひたすら真実で、ほかの思惑などないことを知った。
  "translation_status": "reviewed"
- "id": "xy-ch31-009"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "須臾洗畢，復駕雲西進，只見那金塔放光。八戒指道：「那不是黃袍怪家？沙僧還在他家裡。」行者道：「你在空中，等我下去看看那門前如何，好與妖精見陣。」八戒道：「不要去，妖精不在家。」行者道：「我曉得。」好猴王，按落祥光，徑至洞門外觀看。只見有兩個小孩子，在那裡使彎頭棍，打毛毬，搶窩耍子哩。一個有十來歲，一個有八九歲了。正戲處，被行者趕上前，也不管他是張家李家的，一把抓著頂搭子，提將過來。那孩子吃了諕，口裡夾罵帶哭的亂嚷。驚動那波月洞的小妖，急報與公主道：「奶奶，不知甚人把二位公子搶去也。」原來那兩個孩子是公主與那怪生的。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    ほどなく体を洗い終え、再び雲に乗って西へ進むと、あの金の塔が光っているのが見えた。
    八戒は指さした。「あれが黄袍怪の家じゃないか。沙悟浄はまだあそこにいるんだ。」
    悟空「お前は空で待っていろ。俺は下りて、門前がどうなっているか見てくる。妖怪と戦うためにな。」
    八戒「行かなくていい。妖怪は留守だよ。」
    悟空「分かっている。」
    さすがの悟空は祥雲を下ろし、まっすぐ洞の門の外へ行って様子を見た。二人の子供が、先の曲がった棒で毛の球を打ち、穴を奪い合う遊びをしていた。一人は十歳ほど、もう一人は八、九歳だった。遊んでいるところへ悟空が駆け寄り、どこの家の子かも構わず、頭の髪の束をひとつかみにして、二人を引っ提げた。子供たちは驚いて、悪口と泣き声を交ぜながら、わあわあと騒いだ。波月洞（はげつどう）の小妖が騒ぎに気づき、百花羞（ひゃっかしゅう）へ急いで報告した。
    小妖「奥さま、どこの誰とも分からぬ者が、お二人の若さまをさらいました！」
    実はこの二人の子供は、百花羞と黄袍怪との間に生まれた子だった。
  "translation_status": "reviewed"
- "id": "xy-ch31-010"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公主聞言，忙忙走出洞門來，只見行者提著兩個孩子，站在那高崖之上，意欲往下摜。慌得那公主厲聲高叫道：「那漢子，我與你沒甚相干，怎麼把我兒子拿去？他老子利害，有些差錯，決不與你干休。」行者道：「你不認得我？我是那唐僧的大徒弟孫悟空行者。我有個師弟沙和尚在你洞裡，你去放他出來，我把這兩個孩兒還你。似這般兩個換一個，還是你便宜。」那公主聞言，急往裡面，喝退那幾個把門的小妖，親動手，把沙僧解了。沙僧道：「公主，你莫解我，恐你那怪來家，問你要人，帶累你受氣。」公主道：「長老啊，你是我的恩人，你替我折辯了家書，救了我一命，我也留心放你。不期洞門之外，你有個大師兄孫悟空來了，叫我放你哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    知らせを聞いた百花羞が急いで洞の門を出ると、悟空が二人の子供を提げて高い崖の上に立ち、下へ投げ落とそうとしていた。百花羞は慌て、鋭い声で叫んだ。
    百花羞「そこの男、私とあなたに何の関わりがあるというのです。なぜ私の息子たちをさらうのですか。父親は手ごわい人ですよ。何かあれば、決してただでは済ませません。」
    悟空「俺が分からないのか？　三蔵の一番弟子、孫悟空行者（そんごくうぎょうじゃ）だ。弟弟子の沙悟浄が、この洞に捕まっている。行って解放してくれれば、この二人の子を返そう。二人と一人の交換なら、そちらのほうが得だろう。」
    百花羞は聞くと急いで中へ戻り、門を守る小妖たちを叱って退かせ、自分の手で沙悟浄の拘束を解いた。
    沙悟浄「公主、解かないでください。妖怪が帰って、私を出せと言えば、あなたまで巻き添えになって、ひどい目に遭います。」
    百花羞「長老、あなたは私の恩人です。手紙のことで弁護して、命を救ってくださったので、私も何とか逃がしてあげたいと思っていました。ところが今、洞の外へ一番上の兄弟子の孫悟空さまが来て、あなたを放すように言っておられるのです。」

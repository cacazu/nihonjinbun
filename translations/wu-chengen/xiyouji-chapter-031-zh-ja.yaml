  "source_text": "行者即跳下石崖，到他塔門之下。那公主道：「你這和尚，全無信義：你說放了你師弟，就與我孩兒，怎麼你師弟放去，把我孩兒又留，反來我門首做甚？」行者陪笑道：「公主休怪。你來的日子已久，帶你令郎去認他外公去哩。」公主道：「和尚莫無禮。我那黃袍郎比眾不同，你若諕了我的孩兒，與他柳柳驚是。」行者笑道：「公主啊，為人生在天地之間，怎麼便是得罪？」公主道：「我曉得。」行者道：「你女流家，曉得甚麼？」公主道：「我自幼在宮，曾受父母教訓。記得古書云：『五刑之屬三千，而罪莫大於不孝。』」行者道：「你正是個不孝之人。蓋『父兮生我，母兮鞠我。哀哀父母，生我劬勞。』故孝者，百行之原，萬善之本。卻怎麼將身陪伴妖精，更不思念父母？非得不孝之罪，如何？」公主聞此正言，半晌家耳紅面赤，慚愧無地。忽失口道：「長老之言最善。我豈不思念父母？只因這妖精將我攝騙在此，他的法令又謹，我的步履又難，路遠山遙，無人可傳音信。欲要自盡，又恐父母疑我逃走，事終不明。故沒奈何，苟延殘喘，誠為天地間一大罪人也。」說罷，淚如泉湧。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

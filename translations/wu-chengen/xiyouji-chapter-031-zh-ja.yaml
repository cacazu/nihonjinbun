  "source_text": "噫！那沙僧一聞「孫悟空」的三個字，好便似醍醐灌頂，甘露滋心；一面天生喜，滿腔都是春；也不似聞得個人來，就如拾著一方金玉一般。你看他捽手拂衣，走出門來，對行者施禮道：「哥哥，你真是從天而降也。萬乞救我一救。」行者笑道：「你這個沙尼，師父念緊箍兒咒，可肯替我方便一聲？都弄嘴施展，要保師父，如何不走西方路，卻在這裡蹲甚麼？」沙僧道：「哥哥，不必說了，君子人既往不咎。我等是個敗軍之將，不可語勇，救我救兒罷。」行者道：「你上來。」沙僧才縱身跳上石崖。"

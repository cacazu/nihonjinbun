  "translation_ja": |-
    それを見た黄袍怪は、仰天した。「おや、お前、どうしてそんな顔つきになった？」
    悟空は罵った。「このろくでなしの妖怪め！　誰がお前の女房だ。お前の大先祖さまも分からんのか。」
    黄袍怪は、はっと思い当たった。「お前には、どこかで見覚えがある気がするぞ。」
    悟空「今はまだ打たずにいてやる。もう一度、よく見てみろ。」
    黄袍怪「見覚えはあるが、とっさに名前が出てこない。お前はいったい誰だ？　どこから来た？　俺の女房をどこへどうしてしまって、家へ入り込み、宝をだまし取った？　本当に無礼な、憎らしいやつめ！」
    悟空「やはり俺を知らないのだな。三蔵の一番弟子、孫悟空行者という者だ。五百年前からのお前の大先祖さまだぞ。」
    黄袍怪「そんな話はない、ないぞ！　三蔵を捕らえたとき、弟子は猪八戒と沙悟浄の二人だけだと思っていた。孫などという者がいるとは、誰からも聞いていない。お前はどこから来た化け物か知らんが、ここへ俺をだましに来たのだ。」
    悟空「あの二人と一緒には来なかった。俺は妖怪を打つのが常で、多くの者を殺したり傷つけたりしたから、慈悲深く善を好まれるお師匠さまに追い返されたのだ。それで一緒に旅をしていなかった。お前はこの大先祖さまの姓名を知らなかったわけだ。」
    黄袍怪「何とも男らしくないやつだな。師に追い払われたくせに、どんな面の皮でまた人前に出られる？」
    悟空「ろくでなしめ。『一日でも師となった人は、一生の父』、『父子の恨みは一晩を越さない』という言葉を知らんのか？　お前がお師匠さまに危害を加えて、俺が助けに来ないわけがあるか。師を害したことはひとまず置くとして、そのうえ俺のことまで、面と向かっても陰でも罵ったとは、どういうことだ？」
    黄袍怪「俺がいつお前を罵った？」
    悟空「猪八戒が言っていた。」
    黄袍怪「あいつを信じるな。猪八戒は口先をとがらせて、女の陰口のような話をするのがうまい。どうして真に受ける？」
    悟空「そんな無駄話はもういい。俺が今日お前の家へ来たのに、遠来の客への扱いがひどいじゃないか。もてなす酒や料理はなくとも、頭はあるだろう。さっさと首を差し出せ。この俺が茶の代わりに、一発棒で打ってやろう。」
    黄袍怪は打つと聞いて、はははと大笑いした。「孫行者、お前は計算を間違えたな。戦う気なら、俺について中へ入るべきではなかった。ここには大小の妖怪がまだ百ほどもいる。体じゅうが手だとしても、門からは打って出られぬぞ。」
    悟空「たわごとを言うな。百ばかりどころか、何千何万いようとも、一匹ずつしっかり確かめて打てばいい。一打も空振りせず、お前たちを根絶やしにしてやる。」

  "source_text": "行者道：「公主不必傷悲。豬八戒曾告訢我，說你有一封書，曾救了我師父一命，你書上也有思念父母之意。老孫來，管與你拿了妖精，帶你回朝見駕，別尋個佳偶，侍奉雙親到老。你意如何？」公主道：「和尚啊，你莫要尋死。昨者你兩個師弟那樣好漢，也不曾打得過我黃袍郎。你這般一個觔多骨少的瘦鬼，一似個螃蟹模樣，骨頭都長在外面，有甚本事，你敢說拿妖魔之話？」行者笑道：「你原來沒眼色，認不得人。俗語云：『尿泡雖大無斤兩，秤鉈雖小壓千斤。』他們相貌，空大無用：走路抗風，穿衣費布，種火心空，頂門腰軟，吃食無功。咱老孫小自小，斤節。」那公主道：「你真個有手段麼？」行者道：「我的手段，你是也不曾看見，絕會降妖，極能伏怪。」公主道：「你卻莫誤了我耶。」行者道：「決然誤你不得。」公主道：「你既會降妖伏怪，如今卻怎樣拿他？」行者說：「你且迴避迴避，莫在我這眼前：倘他來時，不好動手腳，只恐你與他情濃了，捨不得他。」公主道：「我怎的捨不得他？其稽留於此者，不得已耳。」行者道：「你與他做了十三年夫妻，豈無情意？我若見了他，不與他兒戲，一棍便是一棍，一拳便是一拳，須要打倒他，才得你回朝見駕。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"

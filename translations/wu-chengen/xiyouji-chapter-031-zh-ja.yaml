  "translation_ja": |-
    悟空「公主、悲しまないでくれ。猪八戒（ちょはっかい）から、あなたが手紙を書き、お師匠さまの命を一度救ってくださったと聞いた。その手紙には、父母を慕う気持ちも書かれていたそうだ。この俺が来たからには、必ず妖怪を捕らえ、あなたを宮中へ連れて帰り、王に会わせよう。別によい夫を探して、末長くご両親に仕えるのだ。どうだろう？」
    百花羞「和尚、死にに行くようなまねはおやめなさい。昨日、あなたの弟弟子たちは、あんなに立派な体をしていても、私の黄袍郎に勝てませんでした。あなたは筋ばかりで骨もろくにない痩せっぽちで、まるで蟹のように骨が外へ出ています。どんな力があって、妖魔を捕らえるなどと言えるのですか？」
    悟空は笑った。「まるで見る目がないな。人が見抜けないらしい。昔から『膀胱は大きくても目方はなく、秤の分銅は小さくても千斤（きん）を押さえる』と言うだろう。あいつらは、図体ばかり大きくて役に立たない。歩けば風を受け、着せれば布がかかる。火かき棒にしようにも芯は空っぽ、戸のつっかい棒にしようにも腰が弱い。食べるばかりで働きはない。この俺は小さくても、身が締まっているんだ。」
    百花羞「本当に、それほどの腕がおありですか？」
    悟空「俺の腕前を、まだ見たことがないのだな。妖を降すのも、怪を押さえるのも、お手のものだ。」
    百花羞「私をぬか喜びさせないでくださいね。」
    悟空「決してあなたを裏切りはしない。」
    百花羞「妖怪を降す力があるのなら、今度はどうやって捕らえるのです？」
    悟空「ひとまず身を隠し、俺の目の前にいないようにしてくれ。あいつが来たとき、やりにくくなる。あなたがあいつに情を寄せ、別れられなくなっていると困るからな。」
    百花羞「どうして別れられないことがありましょう。ここに留まっているのは、やむをえないからです。」
    悟空「十三年も夫婦でいれば、情がないはずもない。俺はあいつに会ったら、遊び半分で相手はしない。一撃は一撃、一拳は一拳、きっちり食らわせる。あいつを打ち倒して初めて、あなたは宮中へ帰って王に会えるんだ。」

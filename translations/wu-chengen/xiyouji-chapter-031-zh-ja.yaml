  "source_text": "此時朝中已知他是個妖怪了。原來他夜裡吃了一個宮娥，還有十七個脫命去的，五更時奏了國王，說他如此如此。又因他不辭而去，越發知他是怪。那國王即著多官看守著假老虎不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 143
    "line_end": 143
  "translation_ja": "このころには宮中でも、黄袍怪が妖怪だと分かっていた。実は夜に宮女を一人食べたあと、十七人は命からがら逃げ出しており、五更（ごこう）に国王へ、ことの次第を報告していたのである。さらに挨拶もなく去ったので、ますます妖怪に違いないと分かった。王は官人たちに、虎に変えられた三蔵を見張らせた。この話はひとまず置く。"
  "translation_status": "reviewed"
- "id": "xy-ch31-020"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那怪徑回洞口。行者見他來時，設法哄他，把眼擠了一擠，撲簌簌淚如雨落，兒天兒地的跌腳搥胸，於此洞裡嚎啕痛哭。那怪一時間那裡認得，上前摟住道：「渾家，你有何事，這般煩惱？」那大聖編成的鬼話，捏出的虛詞，淚汪汪的告道：「郎君啊，常言道：『男子少妻財沒主，婦女無夫身落空。』你昨日進朝認親，怎不回來？今早被豬八戒劫了沙和尚，又把我兩個孩兒搶去，是我苦告，更不肯饒。他說拿去朝中認認外公，這半日不見孩兒，又不知存亡如何，你又不見來家，教我怎生割捨？故此止不住傷心痛哭。」那怪聞言，心中大怒道：「真個是我的兒子？」行者道：「正是，被豬八戒搶去了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    さて黄袍怪は、洞の入り口へまっすぐ帰ってきた。悟空はその姿を見ると、だまそうと計略を巡らせた。目をきゅっと絞って、涙を雨のようにぼろぼろ落とし、天に呼び地に叫び、足を踏み鳴らし胸を叩きながら、洞の中で大声で泣いた。黄袍怪には、とっさに正体など見抜けない。歩み寄り、抱き締めて尋ねた。
    黄袍怪「お前、どうしたのだ。何をそんなに悲しんでいる？」
    悟空は嘘八百のでまかせを組み立て、涙ながらに訴えた。「あなた、昔から『男は妻がいなければ財を守る者がなく、女は夫がいなければ身のよりどころがない』と言います。昨日、宮中へ親族の挨拶に行って、どうして帰ってくださらなかったのですか。今朝、猪八戒が沙悟浄を奪い返し、そのうえ二人の子供までさらっていきました。懸命に頼んでも、少しも聞き入れてくれません。宮中へ連れていって祖父に会わせると言いましたが、もう半日も子供の姿が見えず、生きているのかどうかさえ分かりません。あなたも家へ戻らず、どうして心が休まりましょう。それで、悲しくて泣くのを止められないのです。」
    黄袍怪は聞いて、胸の内から怒りが湧いた。「本当に、俺の息子たちだったのか？」
    悟空「そうです。猪八戒にさらわれたのです。」
  "translation_status": "reviewed"
- "id": "xy-ch31-021"
  "section_id": "chapter-31"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖魔氣得亂跳道：「罷了，罷了，我兒被他摜殺了，已是不可活也。只好拿那和尚來與我兒子償命報仇罷，渾家，你且莫哭。你如今心裡覺道怎麼？且醫治一醫治。」行者道：「我不怎的，只是捨不得孩兒，哭得我有些心疼。」妖魔道：「不打緊，你請起來，我這裡有件寶貝，只在你那疼上摸一摸兒，就不疼了。卻要仔細，休使大指兒彈著；若使大指兒彈著啊，就看出我本相來了。」行者聞言，心中暗笑道：「這潑怪，倒也老實，不動刑法，就自家供了。等他拿出寶貝來，我試彈他一彈，看他是個甚麼妖怪。」那怪攜著行者，一直行到洞裡深遠密閉之處。卻從口中吐出一件寶貝，有雞子大小，是一顆舍利子玲瓏內丹。行者心中暗喜道：「好東西耶。這件物不知打了多少坐工，煉了幾年磨難，配了幾轉雌雄，煉成這顆內丹舍利。今日大有緣法，遇著老孫。」那猴子拿將過來，那裡有甚麼疼處，特故意摸了一摸，一指頭彈將去。那妖慌了，劈手來搶。你思量，那猴子好不溜撒，把那寶貝一口吸在肚裡。那妖魔揝著拳頭就打。被行者一手隔住，把臉抹了一抹，現出本相，道聲：「妖怪，不要無禮。你且認認看我是誰？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第031回&oldid=1455580"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    黄袍怪は怒りのあまり飛び跳ねた。「ああ、もう駄目だ！　俺の子らは投げ落として殺された。もう生き返りはしない。あの和尚どもを捕まえ、子供たちの命の償いをさせて、仇を討つしかない。お前、もう泣くな。今、胸の具合はどうだ？　手当てしてやろう。」
    悟空「大したことはありません。ただ子供たちが恋しくて、泣いているうちに少し胸が痛くなりました。」
    黄袍怪「心配するな。さあ立ちなさい。俺は宝を持っている。それで痛いところをちょっとなでれば、痛みは消える。ただし気をつけて、親指ではじいてはならん。親指ではじくと、俺の本当の姿が見えてしまうからな。」
    悟空は聞くと、胸の内で笑った。「このろくでなしの妖怪も、案外正直だな。拷問もしないうちに、自分から白状した。宝を出したら、ひとつはじいて、何の妖怪か見てやろう。」
    黄袍怪は悟空の手を引き、洞のずっと奥、人目の届かない閉ざされた所へ行った。そして口から、鶏卵ほどの大きさの宝を吐き出した。澄んだ光を持つ内丹（ないたん）の一粒、舎利子（しゃりし）であった。悟空は胸の内で喜んだ。「いい物だな！　これを得るには、どれほど座って修行し、何年も苦難に鍛えられ、雌雄の気を何巡も交わらせたことか。それで、この内丹の舎利（しゃり）が練り上がったのだ。今日この俺に出会うとは、よほどの縁があったとみえる。」
    悟空は受け取った。痛いところなどあるはずもないが、わざと少しなで、指先ではじいた。黄袍怪は慌てて手を伸ばし、奪い返そうとした。だが考えてもみるがよい、悟空は実にすばしこい。宝を一口で吸い込み、腹へ収めてしまった。黄袍怪は拳を握って打ちかかったが、悟空は片手で受け止め、もう一方で顔をぬぐうと、本来の姿に戻って言った。
    悟空「妖怪、無礼なまねはやめろ。よく見ろ、俺が誰か分かるか？」
  "translation_status": "reviewed"
- "id": "xy-ch31-022"

  "known_gaps":
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-002"
    "description_ja": "冒頭の金・木・心猿・木母・丹元・三契・五行・六門は修行の象徴語。「三契」は三者の一致、「妖與魔色」は妖・魔・色欲を並べる句、「六門趣」は六つの感覚の門から欲へ向かう働きとして読んだ。特定の内丹理論との一対一対応は断定しない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-003"
    "description_ja": "「孤拐」は足首の意に採った（教育部《重編國語辭典修訂本》「孤拐」 https://dict.revised.moe.edu.tw/dictView.jsp?ID=70836&la=0&powerMode=0）。「見面」は挨拶代わり、「背花」は背への杖打ち。原文の二十打ずつを保持する。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-006"
    "description_ja": "八戒が黄袍怪の罵倒を語る前に「請將不如激將」と考えることと、後の黄袍怪の否認を保持した。引用を語り手の確認した実話へ変えていない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-007"
    "description_ja": "悟空の「師は追い出したのではない」という説明は猿たちへ面目を保つための本人の発言であり、前回までの追放を語り手が取り消したものではない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-011"
    "description_ja": "「沙尼」は悟空が沙悟浄をからかう呼び方として「沙の尼僧」と訳した。別の女性人物へ変えていない。「弄嘴施展」は口先で力を誇る意に採った。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-012"
    "description_ja": "「心忍」は難を忍んだ相手への同情として「つらかったろう」と訳した。「肉\U00026690子」の異体字は原文にそのまま保持し、肉の塊となる意味で訳した。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-013"
    "description_ja": "「柳柳驚」は驚きを鎮める意。「五刑之屬三千…」は『孝経』の句、「父兮生我…」は『詩経』蓼莪の句。百花羞の発言にある強制的な留置、厳しい監視、自死を思いとどまった理由を省略せず、前世の説明から現世の同意を補わない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-014"
    "description_ja": "「種火心空，頂門腰軟」は中空の火かき棒と、弱い戸のつっかい棒の比喩として訳した。「觔多骨少」と蟹の外骨格の描写は、原文の併置を保ち、身体の説明を独自に訂正しない。「斤節」は小柄でも締まって強い意に採った。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-017"
    "description_ja": "子供二人を投げ落とし、死なせる場面は、原文の行為・血・骨の描写を保持した。悟空の約束違反も前後の問答で省略していない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-021"
    "description_ja": "舎利子はここでは黄袍怪が修行で練った珠状の内丹を指し、釈迦の弟子の名ではない。親指ではじけば本相が見えるという発言と、実際に悟空がはじいて宝を飲み込む動作を保持し、その際に妖怪が何の姿を現したかは原文にないので補わない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-024"
    "description_ja": "「那個大睜火眼伸猿臂，這個明幌金睛折虎腰」は指示語と身体表現の対応が揺れるため、原文の「あちら／こちら」を保ち、片方の人物の姿だと訳者が再配分しない。「生鐵」「蘸鋼」は鉄・焼入れ鋼の材質表現として保持した。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-025"
    "description_ja": "高探馬・大中平・葉底偷桃は技名として保ち、本文が示す上げる・刀をはねる・頭を打つ動作を訳した。「偷」は日本語表記「偸」としたが原文欄は変えていない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-026"
    "description_ja": "列挙される龐・劉・苟・畢・張・陶・鄧・辛、四大天師、諸星・五岳四瀆などは省略しない。天師の発言が誰個人かは原文にないので推測せず、合同の問いと単独か不明の報告を区別した。点呼四回・三日に一度・十三日・十三年の数え方は底本どおり。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-027"
    "description_ja": "黄袍怪の正体は前段落の天師の報告で初めて明かされる。本段落の百花羞の前世と二人の約束は、黄袍怪本人の奏上として訳し、百花羞の現世での自由な同意へ読み替えない。「帶俸差操」は俸給を保った下働きの処分とし、無給・永久追放等は加えない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-031"
    "description_ja": "「假虎」は本当の虎ではなく妖術で虎に見える三蔵。本来の姿を見抜けるのは悟空だけという説明を保持した。「不看僧面看佛面」は本人の顔に免じられなくても、その背後にいる敬うべき者の顔に免じる意として訳した。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch31-1455580"
    "segment_ids":
    - "xy-ch31-032"
    "description_ja": "「那話兒」は緊箍児の呪をほのめかす言い方を保ち、勝手に別の誓約を加えない。四衆はここでは師弟四人。東閣は王が宴を開く殿舎として扱う。 本文の欠落ではなく、解釈・校訂上の留保。"

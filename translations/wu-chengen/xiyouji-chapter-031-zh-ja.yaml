  "source_text": "八戒道：「實不瞞哥哥說，自你回後，我與沙僧保師父前行，只見一座黑松林，師父下馬，教我化齋。我因許遠，無一個人家，辛苦了，略在草裡睡睡。不想沙僧別了師父，又來尋我。你曉得師父沒有坐性，他獨步林間玩景。出得林，見一座黃金寶塔放光，他只當寺院。不期塔下有個妖精，名喚黃袍，被他拿住。後邊我與沙僧回尋，止見白馬、行囊，不見師父。隨尋至洞口，與那怪廝殺。師父在洞，幸虧了一個救星。原是寶象國王第三個公主，被那怪攝來者。他修了一封家書，託師父寄去，遂說方便，解放了師父。到了國中，遞了書子，那國王就請師父降妖，取回公主。哥啊，你曉得，那老和尚可會降妖？我二人復去與戰，不知那怪神通廣大，將沙僧又捉了。我敗陣而走，伏在草中。那怪變做個俊俏文人入朝，與國王認親，把師父變作老虎。又虧了白龍馬夜現龍身，去尋師父，師父倒不曾尋見，卻遇著那怪在銀安殿飲酒。他變一宮娥，與他巡酒、舞刀，欲乘機而砍，反被他用滿堂紅打傷馬腿。就是他教我來請師兄的，說道：『師兄是個有仁有義的君子，君子不念舊惡，一定肯來救師父一難。』萬望哥哥念『一日為師，終身為父』之情，千萬救他一救。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

      楽しみの中で、再び悲しみに遭う。
    "translation_status": "reviewed"
  - "id": "xy-ch96-038"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知天曉向前去還是如何，且聽下回分解。"

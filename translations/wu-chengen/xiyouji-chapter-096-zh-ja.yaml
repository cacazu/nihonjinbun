    "origin": "source"
    "source_text": "說未畢，又有個小的來請道：「齋筵已擺，請老爺進齋。」員外著媽媽與兒子轉宅，他卻陪四眾進齋堂吃齋。那裡鋪設的齊整，但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 150
        "line_end": 150
        "source_sequence": 17
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      まだ話し終わらぬうちに、また小者が来て招いた。
      小者「お膳が整いました。お坊さま、どうぞお食事に。」
      寇洪は妻と息子たちを住まいへ戻らせ、自分は四人に付き添い、食堂で食事をした。そこは整然としつらえられていた。見ると、このようである。
    "translation_status": "reviewed"
  - "id": "xy-ch96-018"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "金漆桌案，黑漆交椅。前面是五色高果，俱巧匠新裝成的時樣；第二行五盤小菜；第三行五碟水果；第四行五大盤閑食。般般甜美，件件馨香。素湯米飯，蒸\U00029707饅頭，辣辣爨爨熱騰騰，盡皆可口，真足充腸。七八個僮僕往來奔奉，四五個庖丁不住手。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 151
        "line_end": 151
        "source_sequence": 18
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      金漆の卓に、黒漆の折り畳み椅子。
      最初に並ぶのは五色の高く盛った菓子で、みな巧みな職人が新しい流行の形に仕立てたもの。
      二列目には五皿の小菜、三列目には五皿の果物、四列目には五つの大皿に盛った軽い菓子。
      どれも甘く、おいしく、一品ごとに香りがよい。
      精進の汁、米の飯、蒸した巻き物の𩜇（けん）に饅頭。熱く熱く湯気が立ち、どれも口に合って、腹を満たすには十分だ。
      七、八人の家僕が往来して給仕をし、四、五人の料理人は手を休めない。
    "translation_status": "reviewed"
  - "id": "xy-ch96-019"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看那上湯的上湯，添飯的添飯，一往一來，真如流星趕月。這豬八戒一口一碗，就是風捲殘雲。師徒們盡受用了一頓。長老起身，對員外謝了齋，就欲走路。那員外攔住道：「老師，放心住幾日兒。常言道：『起頭容易結梢難。』只等我做過了圓滿，方敢送程。」三藏見他心誠意懇，沒奈何住了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 153
        "line_end": 153
        "source_sequence": 19
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      見れば、汁を出す者、飯を足す者が行き交うさまは、まさに流れ星が月を追うようであった。八戒は一口で一椀を平らげ、風が残る雲を巻き払う勢いである。師弟は十分に一食を楽しんだ。三蔵は立ち上がり、寇洪に食事の礼を言って、出発しようとしたが、寇洪は引き止めた。
      寇洪「老師さま、どうか安心して、何日かお泊まりください。『始めるのは易しく、仕上げるのは難しい』と申します。私が成就の法要を済ませてからでなければ、お見送りするわけにはまいりません。」
      三蔵は、その真心のこもった熱心さに、やむなく泊まることにした。
    "translation_status": "reviewed"
  - "id": "xy-ch96-020"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "早經過五七遍朝夕，那員外才請了本處應佛僧二十四員，辦做圓滿道場。眾僧們寫作有三四日，選定良辰，開啟佛事。他那裡與大唐的世情一般，卻倒也："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 155
        "line_end": 155
        "source_sequence": 20
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "そうして五日から七日ほどの朝夕が過ぎると、寇洪はようやく土地の応仏僧（おうぶつそう）を二十四人招き、願の成就を祝う道場を設けた。僧たちは三、四日かけて文書を書き整え、吉日を選んで仏事を始めた。この土地のやり方も大唐と同じで、このようであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-021"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "大揚旛，鋪設金容；齊秉燭，燒香供養。擂鼓敲鐃，吹笙捻管。雲鑼兒，橫笛音清，也都是尺工字樣。打一回，吹一趟，朗言齊語開經藏。先安土地，次請神將。發了文書，拜了佛像。談一部《孔雀經》，句句消災障；點一架藥師燈，焰焰輝光亮。拜水懺，解冤愆；諷《華嚴》，除誹謗。三乘妙法甚精勤，一二沙門皆一樣。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 157
        "line_end": 157
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      大きな幡を高く掲げ、金色の仏像を並べ、皆でろうそくをともし、香をたいて供養する。
      太鼓を打ち、鐃（にょう）を鳴らし、笙（しょう）を吹き、笛の孔を指で押さえる。
      雲鑼（うんら）が響き、横笛の音は澄み、ここでも尺や工の音符を用いる。
      一しきり打ち、一曲吹き、声高らかに言葉をそろえ、経典を開く。
      まず土地神を鎮め、次に神将を招く。
      文書を送り、仏像を拝む。
      『孔雀経（くじゃくきょう）』を一部説けば、一句ごとに災いと障りを取り除き、
      薬師灯（やくしとう）を一台ともせば、一つ一つの炎が明るく輝く。
      水懺（すいせん）を拝して怨みや罪を解き、『華厳経（けごんきょう）』を唱えて誹謗を除く。
      三乗（さんじょう）の妙法に、たいそう熱心に励む。どの僧も、みな同じである。
    "translation_status": "reviewed"
  - "id": "xy-ch96-022"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "如此做了三晝夜，道場已畢。唐僧想著雷音，一心要去，又相辭謝。員外道：「老師辭別甚急，想是連日佛事冗忙，多致簡慢，有見怪之意？」三藏道：「深擾尊府，不知何以為報，怎敢言怪？但只當時聖君送我出關，問幾時可回，我就誤答三年可回。不期在路耽閣，今已十四年矣。取經未知有無，及回又得十二三年，豈不違背聖旨？罪何可當？望老員外讓貧僧前去，待取得經回，再造府久住些時，有何不可？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 158
        "line_end": 158
        "source_sequence": 22
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      こうして三日三晩が過ぎ、法要は終わった。三蔵は雷音寺（らいおんじ）を思い、ひたすら先へ進みたくなり、また別れの挨拶をした。
      寇洪「老師さまがそれほどお急ぎになるのは、連日の仏事に取り紛れ、何かとおもてなしが行き届かず、お気を悪くなさったのでしょうか。」
      三蔵「お宅でこれほどお世話になり、どうお報いしてよいかも分かりませんのに、どうして不満など申せましょう。ただ、あのとき天子さまがお見送りくださり、いつ帰れるかとお尋ねになった折、私はうっかり、三年で戻れると答えてしまったのです。ところが道中で足止めをされ、すでに十四年がたちました。経を頂けるかどうかも、まだ分かりません。帰りにもまた十二、三年かかるなら、聖旨に背くことになりましょう。その罪を、どう償えましょうか。どうか出発をお許しください。経を頂いて帰るとき、またお宅へ参り、長く泊めていただくのではいけませんか。」
    "translation_status": "reviewed"
  - "id": "xy-ch96-023"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒忍不住，高叫道：「師父忒也不從人願，不近人情。老員外大家巨富，許下這等齋僧之願，今已圓滿，又況留得至誠，須住年把，也不妨事，只管要去怎的？放了這等現成好齋不吃，卻往人家化募。前頭有你甚老爺、老娘家哩？」長老咄的喝了一聲道：「你這夯貨，只知好吃，更不管回向之因，正是那槽裡吃食，胃裡擦癢的畜生。汝等既要貪此嗔痴，明日等我自家去罷。」行者見師父變了臉，即揪住八戒，著頭打一頓拳，罵道：「獃子不知好歹，惹得師父連我們都怪了。」沙僧笑道：「打得好，打得好。只這等不說話還惹人嫌，且又插嘴。」那獃子氣呼呼的立在傍邊，再不敢言。員外見他師徒們生惱，只得滿面陪笑道：「老師莫焦燥，今日且少寬容。待明日我辦些旗鼓，請幾個鄰里親戚，送你們起程。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 160
        "line_end": 160
        "source_sequence": 23
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      八戒はこらえきれず、大声を出した。
      八戒「お師匠さまは、人の願いを聞かず、人情もなさすぎます。員外どのは大金持ちで、これほどの施食の願を立て、今、成し遂げたところです。そのうえ真心から引き留めてくださるのだから、一年ばかり泊まったって、構わないでしょう。それなのに、どうして出ていくことばかり言うのです。こうして用意された立派な食事を食べず、よその家へ物乞いに行くなんて。この先に、父上や母上のお宅でもあるんですか！」
      三蔵は、こらっ、と一喝した。
      三蔵「この愚か者は、うまいものを食べることしか知らず、回向（えこう）によって功徳を仏道へ向けることなど、まるで考えない。まるで飼い葉桶の餌を食い、胃の中のかゆみを掻いているだけの畜生だ。お前たちがこの貪りや怒りや愚かさに執着するのなら、明日は私一人で出ていきます。」
      悟空は師の顔色が変わったのを見ると、すぐ八戒をつかまえ、頭へ拳を幾つも浴びせて罵った。
      悟空「この馬鹿が、善し悪しも分からず、お師匠さまを怒らせて、俺たちまで叱られることになったぞ！」
      沙悟浄は笑った。
      沙悟浄「殴られて当然です、当然です。こうして黙っていてさえ嫌がられるのに、さらに口を挟むのですから。」
      八戒はふうふう腹を立てながら傍らに立ち、もう何も言えなかった。寇洪は師弟が争うのを見ると、仕方なく満面に愛想笑いを浮かべた。
      寇洪「老師さま、どうかいら立ちなさらず、今日はもう少しお待ちください。明日、旗や太鼓を用意し、近所の者や親戚を招いて、出発をお見送りいたしましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch96-024"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正講處，那老嫗又出來道：「老師父，既蒙到舍，不必苦辭。今到幾日了？」三藏道：「已半月矣。」老嫗道：「這半月算我員外的功德。老身也有些針線錢兒，也願齋老師父半月。」說不了，寇棟兄弟又出來道：「四位老爺，家父齋僧二十餘年，更不曾遇著好人。今幸圓滿，四位下降，誠然是蓬蓽生輝。學生年幼，不知因果，常聞得有云：『公修公得，婆修婆得，不修不得。』我家父、家母各欲獻芹者，正是各求得些因果，何必苦辭？就是愚兄弟，也省得有些束修錢兒，也指望供養老爺半月，方才送行。」三藏道：「令堂老菩薩盛情，已不敢領，怎麼又承賢昆玉厚愛？決不敢領。今朝定要起身，萬勿見罪。不然，久違欽限，罪不容誅矣。」那老嫗與二子見他執一不住，便生起惱來道：「好意留他，他這等固執要去。要去便就去了罷，只管勞叨甚麼？」母子遂抽身進去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 161
        "line_end": 161
        "source_sequence": 24
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      話していると、寇洪の妻もまた出てきた。
      寇洪の妻「老師さま、せっかくおいでくださったのですから、そう頑なにお断りにならずとも。こちらへ来られて、何日になりますか。」
      三蔵「もう半月になります。」
      寇洪の妻「この半月は、夫の功徳といたしましょう。私にも針仕事でためたお金が少しありますので、老師さまへ半月、食事を施したいのです。」
      言い終わらぬうちに、寇梁と寇棟も出てきた。
      寇梁と寇棟「四人の老師さま、父は二十余年、僧への施食を続けてまいりましたが、立派な方々にお会いしたことはありませんでした。今、幸いにも願が満ち、四人の方においでいただいて、この粗末な家にも、まことに光が差したようです。私たちは若く、因果のことはよく存じませんが、『夫が修めれば夫が得、妻が修めれば妻が得る。修めなければ何も得られない』と、よく聞いております。父も母も、それぞれささやかなものを差し上げたいというのは、それぞれに因果の報いを得たいからです。なぜ、それほどお断りになるのでしょう。私たち兄弟も、学費を少し倹約してあります。老師さまを半月ご供養し、それからお見送りしたいと願っております。」
      三蔵「お母上の、菩薩のような厚いお心遣いさえ、お受けできませんのに、どうしてお二人のご厚意まで頂けましょう。決してお受けできません。今朝、必ず出発いたします。どうか、おとがめなさらないでください。そうしなければ、勅命の期限に長く背き、死罪になっても償いきれないのです。」
      妻と息子たちは、三蔵が頑なに泊まろうとしないのを見ると、腹を立てた。
      寇洪の妻と息子たち「好意で引き留めているのに、こんなにも意地を張って出ていこうとする。行きたいのなら、行けばいい。いつまでも何をくどくど言っているんだ！」
      母子は身を翻し、奥へ入っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-025"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒忍不住口，又對唐僧道：「師父，不要拿過了班兒。常言道：『留得在，落得怪。』我們且住一個月兒，了了他母子的願心也罷了，只管忙怎的？」唐僧又咄了一聲，那獃子就自家把嘴打了兩下道：「啐啐啐！說道莫多話，又做聲了！」行者與沙僧赥赥的笑在一邊。唐僧又怪行者道：「你笑甚麼？」即捻訣，要念緊箍兒咒。慌得個行者跪下道：「師父，我不曾笑，我不曾笑。千萬莫念，莫念。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 162
        "line_end": 162
        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      八戒は口を抑えきれず、また三蔵へ言った。
      八戒「お師匠さま、あまり勿体ぶりすぎてはいけません。『引き留めても、しまいには恨み言』というでしょう。ひと月ほど泊まって、母子の願いをかなえてやればいいじゃありませんか。何をそんなに急ぐんです。」
      三蔵がまた、こらっ、と叱ると、八戒は自分で自分の口を二度打った。
      八戒「ちぇっ、ちぇっ、ちぇっ！　余計なことを言うなと言っているのに、また声を出しちまった！」
      悟空と沙悟浄は、傍らでくすくす笑った。三蔵は今度は悟空をとがめた。
      三蔵「何を笑っているのだ。」
      すぐ指で印を結び、緊箍呪（きんこじゅ）を唱えようとした。悟空はあわててひざまずいた。
      悟空「お師匠さま、私は笑っていません、笑っていません。どうか唱えないで、唱えないでください！」
    "translation_status": "reviewed"
  - "id": "xy-ch96-026"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "員外又見他師徒們漸生煩惱，再也不敢苦留，只叫：「老師不必吵鬧，準於明早送行。」遂此出了經堂，吩咐書辦，寫了百十個簡帖兒，邀請鄰里親戚，明早奉送唐朝老師西行。一壁廂又叫庖人安排餞行的筵宴；一壁廂又叫管辦的做二十對彩旗，覓一班吹鼓手樂人，南來寺裡請一班和尚，東岳觀裡請一班道士，限明日巳時俱要整齊。眾執事領命去訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 164
        "line_end": 164
        "source_sequence": 26
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      寇洪は、師弟がますますいら立つのを見ると、それ以上、強いて引き留めることはできず、ただ言った。
      寇洪「老師さま、争わないでください。明朝、必ずお見送りいたします。」
      経堂を出ると、書記に百枚ほどの招待状を書かせ、近所や親戚の者たちへ、明朝、唐の老師さまの西行を見送るよう招いた。一方では料理人に送別の宴を用意させ、他方では世話役に彩りの旗を二十対作らせ、楽人を一組雇わせた。南来寺（なんらいじ）から僧を一団、東岳観（とうがくかん）から道士を一団招き、明日の巳の刻（みのこく）までに、すべて整えるよう命じた。係の者たちは、命令を受けて出ていった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-027"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時，天又晚了。吃了晚齋，各歸寢處。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 166
        "line_end": 166
        "source_sequence": 27
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "ほどなく、また日が暮れた。夕食を終えると、それぞれ寝所へ戻った。眺めは、このようであった。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-028"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      幾點歸鴉過別村，樓頭鐘鼓遠相聞。
      六街三市人煙靜，萬戶千門燈火昏。
      月皎風清花弄影，銀河慘淡映星辰。
      子規啼處更深矣，天籟無聲大地鈞。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 168
        "line_end": 171
        "source_sequence": 28
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      ねぐらへ帰るカラスが幾羽か、隣の村を過ぎ、楼の上の鐘と太鼓は、遠くまで響き合う。
      六つの通り、三つの市場も人の気配は静まり、無数の家々の灯は暗い。
      月は明るく、風は清らかで、花は影を揺らし、天の川は淡くかすんで星々を映す。
      ホトトギスの鳴くころ、夜はいよいよ更け、自然の響きも絶え、大地はひとしく静まる。
    "translation_status": "reviewed"
  - "id": "xy-ch96-029"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當夜三四更天氣，各管事的家僮盡皆早起，買辦各項物件。你看那辦筵席的，廚上慌忙；置彩旗的，堂前吵鬧；請僧道的，兩腳奔波；叫鼓樂的，一身急縱；送簡帖的，東走西跑；備轎馬的，上呼下應。這半夜，直嚷至天明，將巳時前後，各項俱完，也只是有錢不過。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 172
        "line_end": 172
        "source_sequence": 29
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "その夜、三更（さんこう）、四更（しこう）のころには、各係の家僕が皆、早くも起きて、さまざまな品を買いそろえた。見ると、宴の係は台所で大忙し、旗の係は堂の前で大騒ぎ。僧や道士を招く者は両足を走らせ、楽人を呼ぶ者は全身で急ぎ回る。招待状を配る者は東へ西へ駆け、輿や馬を用意する者は上下で声を掛け合う。真夜中から夜明けまで騒ぎ続け、巳の刻前後には、すべての支度が整った。これも結局、金があればこそである。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-030"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻表唐僧師徒們早起，又有那一班人供奉。長老吩咐收拾行李，扣備馬匹。獃子聽說要走，又努嘴胖唇，唧唧噥噥，只得將衣缽收拾，找出高肩擔子。沙僧刷洗馬匹，套起鞍轡伺候。行者將九環杖遞在師父手裡，他將通關文牒的引袋兒掛在胸前，只是一齊要走。員外又都請至後面大廠廳內，那裡面又鋪設了筵宴，比齋堂中相待的更是不同。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 174
        "line_end": 174
        "source_sequence": 30
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "さて、三蔵たちも早起きし、また一団の人々から世話を受けた。三蔵は荷物をまとめ、馬の支度をするよう言いつけた。出発すると聞くと、八戒はまた唇をとがらせ、ぶつぶつ言いながらも、仕方なく衣と鉢を片づけ、肩へ担ぐ荷を整えた。沙悟浄は馬を洗って毛を整え、鞍と手綱を付けて待つ。悟空は九環杖（きゅうかんじょう）を師の手へ渡し、師は通行文書の入った袋を胸に掛け、皆、今にも出発するところだった。寇洪はまた、一同を奥の大広間へ招いた。そこにも宴が設けられ、食堂でのもてなしとは、さらに違った趣があった。見ると、このようである。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-031"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "簾幕高掛，屏圍四繞。正中間掛一幅壽山福海之圖，兩壁廂列四軸春夏秋冬之景。龍文鼎內香飄靄，鵲尾爐中瑞氣生。看盤簇彩，寶妝花色色鮮明；排桌堆金，獅仙糖齊齊擺列。階前鼓舞按宮商，堂上果餚鋪錦繡。素湯素飯甚清奇，香酒香茶多美艷。雖然是百姓之家，卻不亞王侯之宅。只聽得一片歡聲，真個也驚天動地。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 176
        "line_end": 176
        "source_sequence": 31
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      簾と幕は高く掛かり、四方を屏風が囲む。
      正面には寿山福海（じゅざんふくかい）の絵を一幅掛け、両脇の壁には春夏秋冬の景を描いた四幅が並ぶ。
      竜の文様の鼎では香がたなびき、鵲尾炉（じゃくびろ）からは、めでたい気が立ち上る。
      飾りの皿には彩りが集まり、宝を飾った花は、どの色も鮮やか。
      並べた卓には金を積んだように、獅子に乗る仙人をかたどった獅仙糖（しせんとう）が、整然と置かれる。
      階段の前では太鼓と舞が音律に合わせられ、広間の果物と料理は、錦を広げたようだ。
      精進の汁と飯は、清らかで趣深く、香る酒と茶も、たいそう見事。
      庶民の家ではあるけれど、王侯の屋敷にも劣らない。
      ただ一面の歓声が聞こえ、まことに天を驚かせ、地を揺るがすほどである。
    "translation_status": "reviewed"
  - "id": "xy-ch96-032"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老正與員外作禮，只見家僮來報：「客俱到了。」卻是那請來的左鄰右舍、妻弟姨兄、姐夫妹丈，又有那些同道的齋公，念佛的善友，一齊都向長老禮拜。拜畢，各各敘坐。只見堂下面鼓瑟吹笙，堂上邊絃歌酒讌。這一席盛宴，八戒留心，對沙僧道：「兄弟，放懷放量吃些兒，離了寇家，再沒這好豐盛的東西了。」沙僧笑道：「二哥說哪裡話，常言道：『珍饈百味，一飽便休。』只有私房路，哪有私房肚？」八戒道：「你也忒不濟，不濟。我這一頓盡飽吃了，就是三日也急忙不餓。」行者聽見道：「獃子，莫脹破了肚子，如今要走路哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 177
        "line_end": 177
        "source_sequence": 32
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      三蔵が寇洪と礼を交わしていると、家僕が知らせに来た。
      家僕「お客さまが、皆、おそろいです。」
      招かれたのは左右の隣人、妻の弟や母方の年上の従兄、姉の夫や妹の夫、それに同じ信仰を持つ斎公（さいこう）や念仏仲間たちで、皆そろって三蔵を拝んだ。礼を終えると、それぞれ挨拶を交わして座った。堂の下では瑟（しつ）や笙が奏でられ、堂の上では弦楽と歌に合わせ、酒宴が開かれる。この豪華な宴を八戒は気に入り、沙悟浄に言った。
      八戒「弟よ、心置きなく、腹いっぱい食べておけ。寇洪の家を離れたら、もうこんな立派なごちそうはないぞ。」
      沙悟浄は笑った。
      沙悟浄「二番目の兄さん、何をおっしゃるのです。『百種の珍味も、一度満腹になれば、それまで』と言うでしょう。道には自分だけの隠れ道があっても、腹に自分だけの隠し場所がありますか。」
      八戒「お前もまるでだめだ、だめだな。俺はここで腹いっぱい食べれば、三日たっても、そう簡単には腹が減らないぞ。」
      悟空も聞きつけた。
      悟空「馬鹿、腹を張らせて破裂させるなよ。これから歩くんだぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch96-033"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，日將中矣。長老在上舉箸，念《謁齋經》。八戒慌了，拿過添飯來，一口一碗，又丟夠有五六碗，把那饅頭、\U00029707兒、餅子、燒果，沒好沒歹的滿滿籠了兩袖，才跟師父起身。長老謝了員外，又謝了眾人，一同出門。你看那門外擺著彩旗寶蓋、鼓手樂人，又見那兩班僧道方來。員外笑道：「列位來遲，老師去急，不及奉齋，俟回來謝罷。」眾等讓出道路，擡轎的擡轎，騎馬的騎馬，步行的步行，都讓長老四眾前行。只聞得鼓樂諠天，旗旛蔽日，人煙湊集，車馬駢填，都來看寇員外迎送唐僧。這一場富貴，真賽過珠圍翠繞，誠不亞錦帳藏春。那一班僧，打一套佛曲；那一班道，吹一道玄音。俱送出府城之外，行至十里長亭，又設著簞食壺漿，擎杯把盞，相飲而別。那員外猶不忍捨，噙著淚道：「老師取經回來，是必到舍再住幾日，以了我寇洪之心。」三藏感之不盡，謝之無已道：「我若到靈山，得見佛祖，首表員外之大德。回時定踵門叩謝叩謝。」說說話兒，不覺的又有二三里路，長老懇切拜辭。那員外又放聲大哭而轉。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 178
        "line_end": 178
        "source_sequence": 33
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      そうこうするうち、日は正午に近づいた。三蔵は上座で箸を上げ、『謁斎経（えっさいきょう）』を唱えた。八戒はあわてて飯を足してもらい、一口で一椀ずつ、さらに五、六椀を腹へ収めた。饅頭や𩜇、餅菓子、焼き菓子を、善し悪しも構わず、両の袖いっぱいに詰め込んでから、ようやく師に続いて立ち上がった。三蔵は寇洪に礼を言い、皆にも礼を言って、一緒に門を出た。
      門外には彩りの旗や宝の天蓋、太鼓の奏者や楽人が並んでおり、僧と道士の二団も、ようやくやってきた。寇洪は笑った。
      寇洪「皆さん、お着きが遅かったですね。老師さまがお急ぎで、食事を差し上げられません。戻られてから、お礼をいたしましょう。」
      皆は道をあけ、輿を担ぐ者は担ぎ、馬に乗る者は乗り、歩く者は歩いて、三蔵たち四人を先へ通した。楽の音は空に響き、旗や幡は日を覆い、人々は群れ集まり、車馬は道を埋めた。寇洪が三蔵を迎え、見送る様子を見ようと、皆が来たのである。この豪華さは、珠玉や翡翠に取り巻かれるにもまさり、錦の帳に春を包むにも劣らない。僧の一団は仏の曲を一組奏で、道士の一団は道教の楽を一曲吹いた。
      皆、府城の外まで送り、十里の長亭（ちょうてい）へ来ると、また籠に飯、壺に飲み物を用意してあり、杯を取って酌み交わし、別れを告げた。それでも寇洪は別れを惜しみ、涙を目にためた。
      寇洪「老師さま、経を頂いてお帰りになるときは、必ずわが家へ寄り、また何日かお泊まりください。この寇洪の心を、かなえてやってください。」
      三蔵は感謝してもし尽くせず、礼を繰り返した。
      三蔵「霊山へ着き、仏祖にお会いできたなら、まず員外どのの大きなご恩徳を申し上げます。帰りには必ずお宅を訪ね、重ねてお礼を申し上げましょう。」
      話しているうちに、いつの間にか、また二、三里進んでいた。三蔵は心を込めて礼をし、別れを告げた。寇洪はまた声を上げて泣きながら、引き返していった。まさに、こうである。
    "translation_status": "reviewed"
  - "id": "xy-ch96-034"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "有願齋僧歸妙覺，無緣得見佛如來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 180
        "line_end": 180
        "source_sequence": 34
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      僧へ食事を施す願を持てば、妙なる悟りへ帰る。
      されど縁なく、仏たる如来（にょらい）にまみえることはない。
    "translation_status": "reviewed"
  - "id": "xy-ch96-035"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且不說寇員外送至十里長亭，同眾回家。卻說他師徒四眾，行有四五十里之地，天色將晚。長老道：「天晚了，何方借宿？」八戒挑著擔，努著嘴道：「放了現成茶飯不吃，清涼瓦屋不住，卻要走甚麼路，像搶喪撞魂的。如今天晚，倘下起雨來，卻如之何？」三藏罵道：「潑孽畜，又來報怨了。常言道：『長安雖好，不是久戀之家。』待我們有緣拜了佛祖，取得真經，那時回轉大唐，奏過主公，將那御廚裡飯，憑你吃上幾年，脹死你這孽畜，教你做個飽鬼。」那獃子哈哈的暗笑，不敢復言。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 181
        "line_end": 181
        "source_sequence": 35
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      寇洪が十里の長亭まで送り、皆と家へ帰ったことは、ひとまずさておく。三蔵たち四人は四、五十里ほど進み、日が暮れかけた。
      三蔵「日が暮れる。どこで宿を借りようか。」
      八戒は荷を担ぎ、口をとがらせた。
      八戒「用意された茶も飯も食べず、涼しい瓦屋根の家にも泊まらず、何だって歩かなきゃならないんです。葬式へでも駆けつけるような、魂に取りつかれた勢いじゃありませんか。今はもう日が暮れ、もし雨でも降りだしたら、どうするんです。」
      三蔵は罵った。
      三蔵「この不埒な畜生、また不平を言うのか。『長安（ちょうあん）はよいところでも、いつまでも居つくわが家ではない』と言うでしょう。私たちに縁があって仏祖を拝み、真の経を頂いて大唐へ戻り、天子さまへご報告したら、そのときは御膳所の飯を、何年でも好きなだけ食べさせてやります。この畜生の腹を膨らませて死なせ、腹いっぱいの亡者にしてやりましょう。」
      八戒はひそかに、はははと笑ったが、もう何も言えなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-036"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者舉目遙觀，只見大路傍有幾間房宇，急請師父道：「那裡安歇，那裡安歇。」長老至前，見是一座倒塌的牌坊，坊上有一舊匾，匾上有落顏色積塵的四個大字，乃「華光行院」。長老下了馬道：「華光菩薩是火焰五光佛的徒弟，因剿除毒火鬼王，降了職，化做五顯靈官。此間必有廟祝。」遂一齊進去，但見廊房俱倒，不見人影。欲抽身而出，不期天上黑雲蓋頂，大雨淋漓。沒奈何，卻在那破房之下，揀遮得風雨處，將身躲避。密密寂寂，不敢高聲，恐有妖邪知覺。坐的坐，站的站，苦捱了一夜未睡。咦！真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 183
        "line_end": 183
        "source_sequence": 36
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      悟空が遠くを見渡すと、大道のそばに、幾棟かの建物があった。急いで師に勧めた。
      悟空「あそこで休みましょう、あそこで休みましょう。」
      三蔵が近づくと、崩れた牌坊があり、その上には古い額が掛かっていた。色が落ち、塵を積もらせた大きな四文字は、『華光行院（かこうぎょういん）』とあった。三蔵は馬を下りて言った。
      三蔵「華光菩薩（かこうぼさつ）は火焔五光仏（かえんごこうぶつ）の弟子で、毒火鬼王（どくかきおう）を討ち滅ぼしたことで職を下げられ、五顕霊官（ごけんれいかん）となったお方です。ここには、きっと廟を守る者がいるでしょう。」
      皆で入ってみると、廊下も部屋も崩れ、人影はなかった。引き返そうとしたところ、思いがけず空に黒雲が覆いかぶさり、雨がざあざあ降りだした。やむなく壊れた建物の下で、風雨を防げる場所を選び、身を寄せた。妖怪に気づかれるのを恐れ、ひっそりと黙り込み、大きな声も出せない。座る者、立つ者、それぞれに苦しみに耐え、一晩中眠れなかった。ああ、まさにこうである。
    "translation_status": "reviewed"
  - "id": "xy-ch96-037"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "泰極還生否，樂處又逢悲。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 185

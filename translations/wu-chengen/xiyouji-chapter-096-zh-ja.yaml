    "translation_ja": "「虎坐門樓」は門楼の形容。虎がうずくまるような構えと解して原語を残したが、門の具体的な構造は確定していない。虎像が置かれているとは断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-002-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「五雲鮮」。五色のめでたい雲をいう表現として訳した。卓の模様を指すのか、たなびく香などを雲に見立てたのかは、本文だけでは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-003-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「椒粉屏」は、椒の香りを含む塗料を施した屏風と解した。配合や色までを確定する資料は確認できず、唐辛子の粉末や特定の現代香辛料には置き換えていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-004-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「輕玉浮金」は、直前の磬の音色を玉や金の音にまさるものとしてほめた表現と解したが、細かな比喩には留保がある。「龍髯」は竜のひげ。古典には竜髯の払子の伝承があり、ここも払子の詩的な形容と解した。「披風披月」は風や月をまとう意として訳し、「払う」とはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-005-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "家僕の「爹爹」「奶奶」「叔叔」は、奉公先の主人・夫人・若い主人たちへの呼びかけとして訳した。召使いと主人たちの実際の親子・祖孫・叔父甥の関係を示すものとはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-006-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の「蒸\U00029707」の難字「\U00029707」を保持した。巻き状の粉食を指す語で、具材は特定していない。「辣辣爨爨熱騰騰」は調理したての熱さを重ねていう表現と解し、唐辛子で辛く味つけしたとの断定は避けた。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-007-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「尺工」は、中国の伝統的な記譜法で用いる音名の文字。「尺」「工」などの字で旋律を記す工尺譜に関わる。定規と工芸のことではない。読み方・音律を現代の特定の調へ固定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-008-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "水懺は、罪や怨みを懺悔するための懺法・その文書をいう。一般には『慈悲三昧水懺』と関わるが、この場で用いた本文や版までは示されない。作品に別に現れる「梁皇水懺」と、書名の一部が同じというだけで同一の本文にはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-009-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵は往路を十四年、帰路をさらに十二、三年と見積もる。どちらも本人の発言であり、同じ年数にそろえたり、実際に帰路がその年数を要したと先取りしたりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-010-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「回向」は功徳を仏道や他者へ振り向けること。「回向之因」は、食を受ける僧がその宗教的な意味を忘れているという叱責として訳した。「槽裡吃食，胃裡擦癢」は、食べることで腹の欲を満たすばかりの家畜になぞらえた強い罵倒。医学的な描写ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-011-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "それまでの経過は「五七遍朝夕」、準備の三、四日、法要の三昼夜と記され、ここでは滞在を半月と数える。「五七」は五日から七日ほどの概数として訳した。三十五日と掛け算したり、各日数を足して厳密に十五日へ調整したりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-012-body"
    "section_id": "chapter-96"

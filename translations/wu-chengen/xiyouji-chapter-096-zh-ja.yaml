    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「留得在，落得怪」。引き留めることがかえって不満を生むという諺の形を残したが、両句で省かれた主語を一義的に確定してはいない。八戒がこの後も滞在を勧める点を、辻褄合わせのため反対の発言へ改めていない。直前の「拿過了班兒」は、勿体ぶった態度が過ぎるとの非難。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-014-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵は先に「今朝」出発すると言ったのに対し、主人は「明朝」の見送りを約束する。発言の食い違いを消すため、どちらかの時間表現を改めることはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-015-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文「行者將九環杖遞在師父手裡，他將……」の「他」は、杖を受け取った師の三蔵を指すと解した。悟空から杖を渡す動作と、三蔵が文書袋を掛ける動作を区別する。代名詞の指示についての翻訳上の判断である。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-016-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "獅仙糖は、獅子に乗る仙人などを砂糖で型どる飾り菓子。楊聯陞「老乞大朴通事裏的語法語彙」が引用する『朴通事諺解』の説明を参照した。今回は同論文の検索表示を確認し、PDFの直接取得はタイムアウトしたため、紙面全体を照合したとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-017-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「姨兄」は、母の姉妹の息子のうち、自分より年上の者。妻の姉の夫ではない。「妻弟」「姐夫」「妹丈」は、それぞれ妻の弟、姉の夫、妹の夫として区別した。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-018-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「私房路／私房肚」は、ひそかな抜け道と、余分に食べ物をしまえる特別な腹を対比する冗談と解した。腹は満ちればそれ以上入らないという、直前の諺を受ける。実際に別の胃袋があるとの説明ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-019-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「謁齋經」。食事の終わりに読まれ、その後に立ち上がる場面だが、よく見かける別表記へ無断で改めず、この経名を保持した。経文そのものは記載がなく、特定の定型文や実在経典への同定は保留する。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-020-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "華光菩薩・火焔五光仏・毒火鬼王・五顕霊官の関係と、「毒火鬼王を討ち滅ぼしたことで降職した」という因果は、この場の三蔵の説明をそのまま訳した。別の華光伝承を使って、降職を昇進へ変えたり、本文にない罪や事情を加えたりしていない。"
    "translation_status": "reviewed"

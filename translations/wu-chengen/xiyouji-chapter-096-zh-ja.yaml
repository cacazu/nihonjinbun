    "translation_ja": "さて、夜が明けたら先へ進めるのか、それともどうなるのか。それは次回の説き明かしをお聞きいただきたい。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-001-body"
    "section_id": "chapter-96"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []

    "translation_ja": "息子たちの「束修錢」は、師への謝礼・学費に充てる金。「昆玉」は兄弟への敬称であり、別の人物名ではない。どちらの息子が年長かは本文がここで指定しないため、訳でも割り当てていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-note-013-body"

    "translation_status": "reviewed"
  - "id": "xy-ch96-002"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "色色原無色，空空亦非空。靜喧語默本來同，夢裡何勞說夢。有用用中無用，無功功裡施功。還如果熟自然紅，莫問如何修種。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 122
        "line_end": 122
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      あらゆる色（しき）も、もとより色ではなく、空（くう）そのものも、また空ではない。
      静けさも騒がしさも、語ることも黙ることも、もとは同じ。夢の中で、わざわざ夢を説くことがあろうか。
      働きがあっても、その働きの中には働きがなく、功がなくても、その中で功が施される。
      それも果実が熟せば自然に赤くなるようなもの。どう修め、どう育てるかと、問い求めることはない。
    "translation_status": "reviewed"
  - "id": "xy-ch96-003"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表唐僧師眾，使法力阻住那布金寺僧。僧見黑風過處，不見他師徒，以為活佛臨凡，磕頭而回不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 124
        "line_end": 124
        "source_sequence": 3
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "さて、三蔵（さんぞう）たちは法力を使い、布金寺（ふきんじ）の僧たちの見送りを止めた。僧たちは黒い風が通り過ぎると、師弟の姿が見えなくなったので、生き仏が人の世へ降りてきたのだと思い、頭を地につけて拝んで帰っていった。この方はさておく。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-004"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他師徒們西行，正是春盡夏初時節："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 126
        "line_end": 126
        "source_sequence": 4
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": "一行は西へ進んだ。ちょうど春が終わり、夏が始まる季節である。"
    "translation_status": "reviewed"
  - "id": "xy-ch96-005"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      清和天氣爽，池沼芰荷生。
      梅逐雨餘熟，麥隨風裡成。
      草香花落處，鶯老柳枝輕。
      江燕攜雛習，山雞哺子鳴。
      斗南當日永，萬物顯光明。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 128
        "line_end": 132
        "source_sequence": 5
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      穏やかに晴れた空は爽やかで、池や沼には菱と蓮が生える。
      梅の実は雨のあとに熟し、麦は風に吹かれながら実る。
      花の散るところには草が香り、ウグイスは成長し、柳の枝は軽やかに揺れる。
      川のツバメは雛を連れて飛ぶことを教え、山鳥は子に餌を与えて鳴く。
      北斗の南では日が長く、万物は光を現している。
    "translation_status": "reviewed"
  - "id": "xy-ch96-006"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不盡那朝餐暮宿，轉澗尋波。在那平安路上，行經半月。前邊又見一城垣相近。三藏問道：「徒弟，此又是甚麼去處？」行者道：「不知，不知。」八戒笑道：「這路是你行過的，怎說不知？卻是又有些兒蹺蹊，故意推不認得，捉弄我們哩。」行者道：「這獃子全不察理。這路雖是走過幾遍，那時只在九霄空裡，駕雲而來，駕雲而去，何曾落在此地？事不關心，查他做甚？此所以不知。卻有甚蹺蹊，又捉弄你也？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 134
        "line_end": 134
        "source_sequence": 6
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      朝に食べ、夕べに宿り、谷を越え、水を求める旅の様子は、いちいち語り尽くせない。平穏な道を半月ほど進むと、前方にまた城壁が近づいてきた。
      三蔵「お前たち、ここはどこだろう。」
      悟空（ごくう）「分かりません、分かりません。」
      八戒（はっかい）は笑った。
      八戒「お前が通った道なのに、どうして分からないんだ。また何か妙なことがあって、知らないふりをして、俺たちをからかっているんだろう。」
      悟空「この馬鹿は、まるで理屈が分からない。この道は何度か通ったが、そのときは、はるか上空を雲に乗って行き来しただけだ。ここへ降りたことなどない。自分に関わりのないことを、何のために調べるんだ。だから分からないのさ。何が妙なことだ、何がお前をからかうだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch96-007"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說話間，不覺已至邊前。三藏下馬，過吊橋，徑入門裡長街上，只見廊下坐著兩個老兒敘話。三藏叫：「徒弟，你們在那街心裡站住，低著頭，不要放肆。等我去那廊下，問個地方。」行者果依言立住。長老近前合掌，叫聲：「老施主，貧僧問訊了。」那二老正在那裡閑講閑論，說甚麼興衰得失，誰聖誰賢，當時的英雄事業，而今安在，誠可謂大嘆息。忽聽得道聲問訊，隨答禮道：「長老有何話說？」三藏道：「貧僧乃遠方來拜佛祖的，適到寶方，不知是甚地名。哪裡有向善的人家，化齋一頓？」老者道：「我敝處是銅臺府。府後有一縣，叫做地靈縣。長老若要吃齋，不須募化，過此牌坊，南北街坐西向東的，有一個虎坐門樓，乃是寇員外家，他門前有個『萬僧不阻』之牌。似你這遠方僧，盡著受用。去！去！去！莫打斷我們的話頭。」三藏謝了。轉身對行者道：「此處乃銅臺府地靈縣。那二老道：『過此牌坊南北街，向東虎坐門樓，有個寇員外家，他門前有個「萬僧不阻」之牌。』教我到他家去吃齋哩。」沙僧道：「西方乃佛家之地，真個有齋僧的。此間既是府縣，不必照驗關文，我們去化些齋吃了，就好走路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 135
        "line_end": 135
        "source_sequence": 7
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      話している間に、いつの間にか城のそばへ着いていた。三蔵は馬を下り、吊り橋を渡り、門からまっすぐ長い通りへ入った。すると軒下に二人の老人が座り、話をしていた。
      三蔵「お前たちは道の真ん中に立ち、頭を低くして、勝手なことをしてはいけません。私があの軒下へ行き、この土地のことを尋ねてきます。」
      悟空は言いつけどおり、立ち止まった。三蔵は老人たちへ近づき、合掌して呼びかけた。
      三蔵「ご老人、ご挨拶申し上げます。」
      二人はちょうど、世の興亡、人の得失、誰が聖人で誰が賢者か、当時の英雄たちの事業は今どこにあるのかなどと、気ままに話し合っていた。まことに、大いに嘆かわしいという話である。不意に挨拶の声を聞き、礼を返した。
      老人たち「お坊さま、何かお話がおありですかな。」
      三蔵「私は遠方から仏祖（ぶっそ）を拝みに来た者です。今、この土地へ着きましたが、何というところか存じません。どこか信心のあるお宅で、一食、食事を頂けないでしょうか。」
      老人「ここは銅台府（どうたいふ）といいます。府の奥に県があり、地霊県（ちれいけん）というのです。食事をしたいのなら、托鉢して回る必要はない。あの牌坊（はいぼう）を過ぎた南北の通り、西側に東を向いた虎坐門楼（こざもんろう）のあるのが、寇員外（こういんがい）のお宅です。門前には『万僧を拒まず』という札が出ている。あなたのような遠来のお坊さまなら、存分にもてなしてもらえるでしょう。さあ、行った、行った、行った。わしらの話の腰を折らんでくれ。」
      三蔵は礼を述べ、振り返って悟空に言った。
      三蔵「ここは銅台府の地霊県だそうです。あの二人が言うには、『牌坊を過ぎ、南北の通りにある、東向きの虎坐門楼が寇員外の家で、門前に「万僧を拒まず」という札がある』とのこと。そこで食事を頂くよう、教えてくださいました。」
      沙悟浄（さごじょう）「西方は仏の土地ですから、本当に僧へ食事を施す家があるのですね。ここは府や県ですから、通行の文書を照合してもらう必要もありません。食事を頂いて、先へ進みましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch96-008"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老與三人緩步長街，又惹得那市口裡人都驚驚恐恐，猜猜疑疑的，圍繞爭看他們相貌。長老吩咐閉口，只教：「莫放肆，莫放肆。」三人果低著頭，不敢仰視。轉過拐角，果見一條南北大街。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 136
        "line_end": 136
        "source_sequence": 8
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      三蔵と三人がゆっくり通りを進むと、またも町の人々を驚かせた。人々はおびえ、いぶかりながら、彼らの姿を見ようと周りに集まり、争ってのぞき込む。三蔵は弟子たちに口を閉じさせ、ただ繰り返した。
      三蔵「勝手なことをしてはいけません、してはいけません。」
      三人は言いつけどおり頭を低くし、顔を上げようとしなかった。角を曲がると、確かに南北へ伸びる大通りがあった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-009"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正行時，見一個虎坐門樓，門裡邊影壁上掛著一面大牌，書著「萬僧不阻」四字。三藏道：「西方佛地，賢者愚者，俱無詐偽。那二老說時，我猶不信，至此果如其言。」八戒村野，就要進去。行者道：「獃子且住，待有人出來，問及何如，方好進去。」沙僧道：「大哥說得有理，恐一時不分內外，惹施主煩惱。」在門口歇下馬匹、行李。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 138
        "line_end": 138
        "source_sequence": 9
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      進んでいくと、虎坐門楼が見えた。門の内側の目隠し壁には、大きな札が掛かり、『万僧不阻（まんそうふそ）』の四字が書いてある。
      三蔵「西方は仏の土地だ。賢い者も愚かな者も、誰も偽りを言わない。あの老人たちの話を聞いたときは、まだ信じきれなかったが、来てみれば、まさに言われたとおりだ。」
      無作法な八戒が、さっそく入ろうとした。
      悟空「馬鹿、ちょっと待て。誰かが出てきて、事情を尋ねてからでなくては、入れないだろう。」
      沙悟浄「兄さんの言うとおりです。うっかり内と外のけじめを忘れ、施主を困らせてはなりません。」
      門口で馬を止め、荷物を下ろした。
    "translation_status": "reviewed"
  - "id": "xy-ch96-010"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "須臾間，有個蒼頭出來，提著一把秤、一隻籃兒，猛然看見，慌的丟了，倒跑進去報道：「主公，外面有四個異樣僧家來也！」那員外拄著拐，正在天井中閑走，口裡不住的念佛，一聞報道，就丟了拐，出來迎接。見他四眾，也不怕醜惡，只叫：「請進！請進！」三藏謙謙遜遜，一同都入。轉過一條巷子，員外引路，至一座房裡，說道：「此上手房宇，乃管待老爺們的佛堂、經堂、齋堂。下手的，是我弟子老小居住。」三藏稱讚不已。隨取袈裟穿了拜佛，舉步登堂觀看，但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 140
        "line_end": 140
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      ほどなく家僕が出てきた。秤と籠を一つずつ持っていたが、突然一行を見て、驚きのあまり取り落とし、引き返して中へ駆け込み、知らせた。
      家僕「旦那さま、外に異様なお坊さまが四人、お見えです！」
      寇員外は杖をつき、中庭をゆっくり歩きながら、絶えず念仏を唱えていた。報告を聞くと杖を投げ出し、迎えに出てきた。四人を見ても、醜い姿を恐れず、ただ招いた。
      寇員外「お入りください、お入りください！」
      三蔵は丁重にへりくだり、皆で中へ入った。細い通路を回り、寇員外に案内されて、一つの建物へ着いた。
      寇員外「こちらの上手にある建物は、お坊さまたちをお迎えする仏堂、経堂、食堂です。下手にあるのは、私どもの家族が住むところでございます。」
      三蔵はしきりに感心し、袈裟（けさ）を取り出して着ると、仏を拝もうと堂へ上がって見回した。そこには、このような眺めがあった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-011"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "香雲靉靆，燭焰光輝。滿堂中錦簇花攢，四下裡金鋪彩絢。朱紅架高掛紫金鐘，彩漆檠對設花腔鼓。幾對旛繡成八寶，千尊佛盡戧黃金。古銅爐，古銅瓶；雕漆桌，雕漆盒。古銅爐內，常常不斷沉檀；古銅瓶中，每每蓮花現彩。雕漆桌上五雲鮮，雕漆盒中香瓣積。玻璃盞，淨水澄清；琉璃燈，香油明亮。一聲金磬，響韻虛徐。真個是紅塵不到賽珍樓，家奉佛堂欺上剎。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 141
        "line_end": 141
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      香の雲はたなびき、ろうそくの炎は輝く。
      堂いっぱいに錦と花が集まり、四方には金と彩りが美しく広がる。
      朱塗りの架け台には紫金（しきん）の鐘が高く掛かり、彩色した台には花模様の太鼓が向かい合う。
      幾対かの幡には八宝（はっぽう）を刺繍し、千体の仏には、ことごとく彫り目へ金を埋め込んである。
      古銅の香炉に古銅の花瓶、彫漆（ちょうしつ）の卓に彫漆の箱。
      古銅の香炉では、いつも沈香（じんこう）と白檀（びゃくだん）が絶えず燃え、古銅の花瓶には、しばしば蓮の花が彩りを現す。
      彫漆の卓では五色の雲が鮮やかに映え、彫漆の箱には香片が積まれる。
      玻璃（はり）の杯には清らかな水が澄み、瑠璃（るり）の灯には香油の光が明るい。
      金の磬（けい）が一声鳴れば、その響きはゆるやかに空へ広がる。
      まことに俗塵も届かず、宝の楼にもまさり、家に設けた仏堂ながら、名高い寺をもしのぐ。
    "translation_status": "reviewed"
  - "id": "xy-ch96-012"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老淨了手，拈了香，叩頭拜畢，卻轉回與員外行禮。員外道：「且住，請到經堂中相見。」又見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 143
        "line_end": 143
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      三蔵は手を清め、香をつまんで供え、頭を地につけて拝み終えると、振り返って寇員外へ礼をしようとした。
      寇員外「少しお待ちください。経堂へおいでいただき、そこでご挨拶をいたしましょう。」
      そこには、またこのような眺めがあった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-013"
    "section_id": "chapter-96"
    "kind": "verse"
    "origin": "source"
    "source_text": "方臺豎櫃，玉匣金函。方臺豎櫃，堆積著無數經文；玉匣金函，收貯著許多簡札。彩漆桌上，有紙墨筆硯，都是些精精緻緻的文房；椒粉屏前，有書畫琴棋，盡是些妙妙玄玄的真趣。放一口輕玉浮金之仙磬，掛一柄披風披月之龍髯。清氣令人神氣爽，齋心自覺道心閑。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 145
        "line_end": 145
        "source_sequence": 13
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      四角い台に、縦長の戸棚、玉の箱に、金の文箱。
      四角い台と縦長の戸棚には、数えきれない経文が積まれ、玉の箱と金の文箱には、多くの書状が収められる。
      彩色した卓の上には紙、墨、筆、硯があり、どれもたいへん精巧な文房具。
      椒粉（しょうふん）を塗った屏風の前には書、画、琴、碁があり、どれも奥深く、玄妙な楽しみである。
      玉や金の音も及ばないような仙の磬が一つ置かれ、
      風をまとい、月をまとう、竜髯（りゅうぜん）の払子（ほっす）が一本掛かる。
      清らかな気に、人の心も爽やかになり、心を慎めば、おのずと道を求める思いも安らぐ。
    "translation_status": "reviewed"
  - "id": "xy-ch96-014"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "長老到此，正欲行禮，那員外又攙住道：「請寬佛衣。」三藏脫了袈裟。才與長老見了。又請行者三人見了。又叫把馬喂了，行李安在廊下，方問起居。三藏道：「貧僧是東土大唐欽差詣寶方謁靈山見佛祖求真經者。聞知尊府敬僧，故此拜見，求一齋就行。」員外面生喜色，笑吟吟的道：「弟子賤名寇洪，字大寬，虛度六十四歲。自四十歲上，許齋萬僧，才做圓滿。今已齋了二十四年，有一簿齋僧的帳目。連日無事，把齋過的僧名算一算，已齋過九千九百九十六員，止少四眾，不得圓滿。今日可可的天降老師四位，圓滿萬僧之數。請留尊諱，好歹寬住月餘，待做了圓滿，弟子著轎馬送老師上山。此間到靈山只有八百里路，苦不遠也。」三藏聞言，十分歡喜，都就權且應承不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 146
        "line_end": 146
        "source_sequence": 14
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      三蔵がそこへ着き、礼をしようとすると、寇員外はまた手を添えて止めた。
      寇員外「どうぞ仏衣をお脱ぎください。」
      三蔵が袈裟を脱いでから、ようやく互いに挨拶を交わした。続いて悟空たち三人とも挨拶をし、馬には餌をやらせ、荷物を廊下へ置かせてから、初めて来歴を尋ねた。
      三蔵「私は東土（とうど）の大唐（だいとう）から勅命を受けて、こちらへ参った者です。霊山（れいざん）で仏祖にお会いし、真の経を頂くための旅をしております。お宅が僧を大切になさると伺い、ご挨拶に参りました。一食だけ頂き、出立したく存じます。」
      寇員外は喜びを顔に浮かべ、にこにこして言った。
      寇員外「私は寇洪（こうこう）、字は大寛（たいかん）と申します。むなしく年を重ねて、六十四歳になりました。四十の年に、一万人の僧へ食事を施し、それをもって願を成し遂げようと誓ったのです。すでに二十四年、施食を続け、僧の名前を帳面に記してまいりました。このところ暇があったので数えてみると、九千九百九十六人。あと四人が足りず、願を果たせませんでした。ところが今日、折よく老師さま四人が天から降ってこられ、一万人の数が満ちたのです。どうぞお名前をお残しになり、ぜひとも一月余り、ゆっくりお泊まりください。成就の法要を終えましたら、輿と馬を出して、老師さまを山までお送りいたします。ここから霊山までは、わずか八百里（り）。さほど遠くはございません。」
      三蔵はこれを聞き、たいへん喜んだ。一同、ひとまずその申し出を承知した。このことはさておく。
    "translation_status": "reviewed"
  - "id": "xy-ch96-015"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他那幾個大小家僮，往宅裡搬柴打水，取米麵蔬菜，整治齋供，忽驚動員外媽媽，問道：「是哪裡來的僧，這等上緊？」僮僕道：「才有四位高僧，爹爹問他起居，他說是東土大唐皇帝差來的，往靈山拜佛爺爺。到我們這裡，不知有多少路程。爹爹說是天降的，吩咐我們快整齋，供養他也。」那老嫗聽說也喜，叫丫鬟：「取衣服來我穿，我也去看看。」僮僕道：「奶奶，只一位看得，那三位看不得，形容醜得很哩。」老嫗道：「汝等不知，但形容醜陋，古怪清奇，必是天人下界。快先去報你爹爹知道。」那僮僕跑至經堂，對員外道：「奶奶來了，要拜見東土老爺哩。」三藏聽見，即起身下座。說不了，老嫗已至堂前。舉目見唐僧相貌軒昂，丰姿英偉。轉面見行者三人模樣非凡，雖知他是天人下界，卻也有幾分悚懼，朝上跪拜。三藏急急還禮道：「有勞菩薩錯敬。」老嫗問員外道：「四位師父，怎不並坐？」八戒掬著嘴道：「我三個是徒弟。」噫！他這一聲，就如深山虎嘯，那媽媽一發害怕。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 147
        "line_end": 147
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      何人かの年長や年少の家僕たちが、家へ薪や水を運び、米、粉、野菜を用意して食事を整えていると、その騒ぎに寇洪の妻が気づいた。
      寇洪の妻「どこから来たお坊さまたちなのだい。そんなに大急ぎで。」
      家僕「たった今、高僧が四人おいでになりました。旦那さまが来歴を尋ねると、東土の大唐の皇帝から遣わされ、霊山の仏さまを拝みに行くとおっしゃるのです。ここまで、どれほどの道のりかも分かりません。旦那さまは、天から降ってきた方々だとおっしゃり、急いで食事を整えて供養するよう、お命じになりました。」
      寇洪の妻も聞いて喜び、侍女へ言った。
      寇洪の妻「服を持ってきておくれ。着替えて、私も見に行こう。」
      家僕「奥さま、見ることができるのは一人だけで、あとの三人は見られたものではありません。たいへん醜い姿なのです。」
      寇洪の妻「お前たちは分かっていないね。姿が醜くても、普通と違って珍しいのなら、きっと天人が降りてきたのだ。先に行って、旦那さまへ知らせておくれ。」
      家僕は経堂へ駆けていき、寇洪に告げた。
      家僕「奥さまがおいでです。東土のお坊さまにご挨拶をなさりたいそうです。」
      三蔵は聞くと、すぐ立ち上がって席を離れた。言い終わらぬうちに妻は堂の前へ来ていた。目を上げると、三蔵は堂々とした顔立ちで、姿も立派である。振り向いて悟空たち三人の並外れた姿を見ると、天人が下界へ降りてきたのだと思ってはいても、やはりいくらか恐ろしく、上座へ向かってひざまずいた。三蔵は急いで礼を返した。
      三蔵「菩薩（ぼさつ）のようなお方から、身に余るお礼を頂き、恐縮です。」
      寇洪の妻は夫に尋ねた。
      寇洪の妻「四人のお坊さまは、なぜ並んでお座りにならないのです。」
      八戒は口を突き出して答えた。
      八戒「俺たち三人は弟子だ。」
      ああ、その一声は深山の虎が吼えるようで、妻はますます怖くなった。
    "translation_status": "reviewed"
  - "id": "xy-ch96-016"
    "section_id": "chapter-96"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說處，又見一個家僮來報道：「兩個叔叔也來了。」三藏急轉身看時，原來是兩個少年秀才。那秀才走上經堂，對長老倒身下拜。慌得三藏急便還禮。員外上前扯住道：「這是我兩個小兒，喚名寇梁、寇棟，在書房裡讀書方回，來吃午飯，知老師下降，故來拜也。」三藏喜道：「賢哉，賢哉！正是：欲高門第須為善，要好兒孫在讀書。」二秀才啟上父親道：「這老爺是哪裡來的？」員外笑道：「來路遠哩，南贍部洲東土大唐皇帝欽差到靈山拜佛祖爺爺取經的。」秀才道：「我看《事林廣記》上，蓋天下只有四大部洲。我們這裡叫做西牛賀洲，還有個東勝神洲。想南贍部洲至此，不知走了多少年代？」三藏笑道：「貧僧在路，耽閣的日子多，行的日子少。常遭毒魔狠怪，萬苦千辛，甚虧我三個徒弟保護。共計一十四遍寒暑，方得至寶方。」秀才聞言，稱獎不盡道：「真是神僧！真是神僧！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch96-1500608"
        "precision": "line"
        "line_start": 148
        "line_end": 148
        "source_sequence": 16
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第096回&oldid=1500608"
    "translation_ja": |-
      話していると、また家僕が来て知らせた。
      家僕「若旦那さまたちも、お二人そろっておいでです。」
      三蔵が急いで振り向くと、二人の若い秀才（しゅうさい）だった。経堂へ上がると、三蔵の前へ身を伏せて拝んだので、三蔵もあわてて礼を返した。寇洪が進み出て、手を取った。
      寇洪「この二人は私の息子で、寇梁（こうりょう）と寇棟（こうとう）と申します。書斎で勉強していて、昼食に戻ってきたところです。老師さまがおいでと知り、ご挨拶に参ったのでございます。」
      三蔵は喜んだ。
      三蔵「感心なことです、感心なことです。まさに『家を栄えさせたければ善を行い、よい子孫を得たければ書を読ませよ』ということですね。」
      寇梁と寇棟は父に尋ねた。
      寇梁と寇棟「このお方は、どちらから来られたのですか。」
      寇洪は笑った。
      寇洪「遠いところからだよ。南贍部洲（なんせんぶしゅう）の東土、大唐の皇帝から命を受け、霊山の仏祖さまを拝み、経を頂きに行かれるのだ。」
      寇梁と寇棟「『事林広記（じりんこうき）』を読むと、天下には四つの大きな洲しかないとありました。ここは西牛賀洲（さいごかしゅう）といい、ほかには東勝神洲（とうしょうしんしゅう）もあります。南贍部洲からここまで、どれほどの年月を歩かれたのでしょう。」
      三蔵は笑った。
      三蔵「私は道中、足止めをされた日が多く、進めた日は少なかったのです。たびたび凶悪な魔物や妖怪に遭い、幾多の苦難を重ねましたが、三人の弟子たちに守られ、たいへん助けられました。合わせて十四度の寒暑を経て、ようやくこちらへ参ったのでございます。」
      寇梁と寇棟は聞くと、称賛してやまなかった。
      寇梁と寇棟「まことに神僧です、まことに神僧です！」
    "translation_status": "reviewed"
  - "id": "xy-ch96-017"
    "section_id": "chapter-96"

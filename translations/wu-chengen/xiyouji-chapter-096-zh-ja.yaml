  "known_gaps":
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-007"
      "description_ja": "「虎坐門樓」は門楼の形容。虎がうずくまるような構えと解して原語を残したが、門の具体的な構造は確定していない。虎像が置かれているとは断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-011"
      "description_ja": "原文は「五雲鮮」。五色のめでたい雲をいう表現として訳した。卓の模様を指すのか、たなびく香などを雲に見立てたのかは、本文だけでは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-013"
      "description_ja": "原文の「椒粉屏」は、椒の香りを含む塗料を施した屏風と解した。配合や色までを確定する資料は確認できず、唐辛子の粉末や特定の現代香辛料には置き換えていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-013"
      "description_ja": "「輕玉浮金」は、直前の磬の音色を玉や金の音にまさるものとしてほめた表現と解したが、細かな比喩には留保がある。「龍髯」は竜のひげ。古典には竜髯の払子の伝承があり、ここも払子の詩的な形容と解した。「披風披月」は風や月をまとう意として訳し、「払う」とはしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-018"
      "description_ja": "底本の「蒸\U00029707」の難字「\U00029707」を保持した。巻き状の粉食を指す語で、具材は特定していない。「辣辣爨爨熱騰騰」は調理したての熱さを重ねていう表現と解し、唐辛子で辛く味つけしたとの断定は避けた。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-021"
      "description_ja": "水懺は、罪や怨みを懺悔するための懺法・その文書をいう。一般には『慈悲三昧水懺』と関わるが、この場で用いた本文や版までは示されない。作品に別に現れる「梁皇水懺」と、書名の一部が同じというだけで同一の本文にはしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-023"
      "description_ja": "「回向」は功徳を仏道や他者へ振り向けること。「回向之因」は、食を受ける僧がその宗教的な意味を忘れているという叱責として訳した。「槽裡吃食，胃裡擦癢」は、食べることで腹の欲を満たすばかりの家畜になぞらえた強い罵倒。医学的な描写ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-024"
      "description_ja": "それまでの経過は「五七遍朝夕」、準備の三、四日、法要の三昼夜と記され、ここでは滞在を半月と数える。「五七」は五日から七日ほどの概数として訳した。三十五日と掛け算したり、各日数を足して厳密に十五日へ調整したりしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-025"
      "description_ja": "原文は「留得在，落得怪」。引き留めることがかえって不満を生むという諺の形を残したが、両句で省かれた主語を一義的に確定してはいない。八戒がこの後も滞在を勧める点を、辻褄合わせのため反対の発言へ改めていない。直前の「拿過了班兒」は、勿体ぶった態度が過ぎるとの非難。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-030"
      "description_ja": "原文「行者將九環杖遞在師父手裡，他將……」の「他」は、杖を受け取った師の三蔵を指すと解した。悟空から杖を渡す動作と、三蔵が文書袋を掛ける動作を区別する。代名詞の指示についての翻訳上の判断である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch96-1500608"
      "segment_ids":
        - "xy-ch96-033"
      "description_ja": "底本は「謁齋經」。食事の終わりに読まれ、その後に立ち上がる場面だが、よく見かける別表記へ無断で改めず、この経名を保持した。経文そのものは記載がなく、特定の定型文や実在経典への同定は保留する。 原文の欠落ではなく、解釈・校訂上の留保。"

- "id": "xy-ch09-002"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表陝西大國長安城，乃歷代帝王建都之地。自周、秦、漢以來，三州花似錦，八水繞城流，真個是名勝之邦。彼時是大唐太宗皇帝登基，改元貞觀，已登極十三年，歲在己巳，天下太平，八方進貢，四海稱臣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 122
    "line_end": 122
  "translation_ja": "さて、陝西（せんせい）の大国、長安（ちょうあん）の都は、歴代の帝王が都を置いた地である。周（しゅう）・秦（しん）・漢（かん）の時代から、三州（さんしゅう）には花が錦のように咲き、八つの川が城を巡って流れる、まことに景勝の国であった。当時は大唐（だいとう）の太宗（たいそう）皇帝が即位して貞観（じょうがん）と改元し、登極（とうきょく）してすでに十三年、干支は己巳（つちのとみ）。天下は太平で、八方から貢ぎ物が届き、四海が臣従していた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "貞観十三年と己巳の暦年対応は不整合だが底本のまま。"
- "id": "xy-ch09-003"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "忽一日，太宗登位，聚集文武眾官，朝拜禮畢，有魏徵丞相出班奏道：「方今天下太平，八方寧靜，應依古法，開立選場，招取賢士，擢用人材，以資化理。」太宗道：「賢卿所奏有理。」就傳招賢文榜，頒布天下：各府州縣，不拘軍民人等，但有讀書儒流，文義明暢，三場精通者，前赴長安應試。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    ある日、太宗が御座に就き、文武の官人たちを集めた。朝拝（ちょうはい）の礼が終わると、丞相（じょうしょう）の魏徴（ぎちょう）が列を出て奏上した。
    魏徴「ただいま天下は太平、八方は安らかでございます。古来の法に従って試験場を開き、賢士を招き、人材を登用して、世を治める助けとなさるべきかと存じます。」
    太宗「卿（けい）の申すことはもっともだ。」
    そこで賢人を募る布告を天下に出した。各府・州・県の者は、軍籍（ぐんせき）・民籍（みんせき）を問わず、学問を修め、文章の意味によく通じ、三場（さんじょう）の試験に精通する者ならば、長安に赴いて受験せよ、というのである。
  "translation_status": "reviewed"
- "id": "xy-ch09-004"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此榜行至海州地方，有一人，姓陳名萼，表字光蕊，見了此榜，即時回家，對母張氏道：「朝廷頒下黃榜，詔開南省，考取賢才，孩兒意欲前去應試。倘得一官半職，顯親揚名，封妻蔭子，光耀門閭，乃兒之志也。特此稟告母親前去。」張氏道：「我兒讀書人，『幼而學，壯而行』，正該如此。但去赴舉，路上須要小心，得了官，早早回來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    この布告が海州（かいしゅう）の地に届くと、姓は陳（ちん）、名は萼（がく）、字（あざな）は光蕊（こうずい）という者がそれを見た。すぐ家に帰り、母の張氏（ちょうし）に告げた。
    陳光蕊（ちんこうずい）「朝廷から黄榜（こうぼう）が出され、尚書省（しょうしょしょう）で試験を開いて、賢い人材を選ぶとのことです。私も受験に参りたいと思います。もし何かの官職を得られれば、親の名を高め、自分も名を揚げ、妻に封号（ふうごう）を、子に恩典を受けさせ、家門に光を添える。それが私の志です。出立することを、こうしてお母さまに申し上げに来ました。」
    張氏「お前は学問をする者。『幼いときに学び、壮年になれば実行する』というとおり、そうするのがよい。ただ、試験へ行く道中には気をつけるのだよ。官職を得たら、早く帰っておいで。」
  "translation_status": "reviewed"
- "id": "xy-ch09-005"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "光蕊便吩咐家僮收拾行李，即拜辭母親，趲程前進。到了長安，正值大開選場，光蕊就進場。考畢，中選。及廷試三策，唐王御筆親賜狀元，跨馬遊街三日。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 127
    "line_end": 127
  "translation_ja": "陳光蕊は家僮（かどう）に荷物をまとめさせ、母に別れを告げて、道を急いだ。長安に着くと、ちょうど試験場が開かれていたので、陳光蕊も入場した。試験を終えると合格し、さらに殿試（でんし）で三つの策問（さくもん）に答えると、唐（とう）の皇帝は自ら筆を執って状元（じょうげん）の首席を授けた。陳光蕊は馬に乗り、三日間、町を練り歩いた。"
  "translation_status": "reviewed"
- "id": "xy-ch09-006"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不期遊到丞相殷開山門首，有丞相所生一女，名喚溫嬌，又名滿堂嬌，未曾婚配，正高結綵樓，拋打繡毬卜婿。適值陳光蕊在樓下經過。小姐一見光蕊人材出眾，知是新科狀元，心內十分歡喜，就將繡毬拋下，恰打著光蕊的烏紗帽。猛聽得一派笙簫細樂，十數個婢妾走下樓來，把光蕊馬頭挽住，迎狀元入相府成婚。那丞相和夫人即時出堂，喚賓人贊禮，將小姐配與光蕊。拜了天地，夫妻交拜畢，又拜了岳丈、岳母。丞相吩咐安排酒席，歡飲一宵。二人同攜素手，共入蘭房。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 129
    "line_end": 129
  "translation_ja": "思いがけず丞相の殷開山（いんかいざん）の屋敷の前を通った。殷開山には、温嬌（おんきょう）、別名を満堂嬌（まんどうきょう）という、まだ嫁いでいない娘がいた。ちょうど高い飾り楼を設け、刺繡の毬を投げて婿を選ぼうとしているところだった。そこへ陳光蕊が楼の下を通りかかった。殷温嬌（いんおんきょう）はその姿のひときわ優れているのを見て、今度の状元だと知り、心から喜んだ。刺繡の毬を投げると、ちょうど陳光蕊の黒い紗（しゃ）の官帽に当たった。たちまち笙（しょう）や笛の優雅な楽の音が響き、十数人の侍女や妾たちが楼を下り、陳光蕊の馬の手綱をつかんで、婚礼のため丞相邸へ迎え入れた。殷開山と殷夫人（いんふじん）はすぐ広間へ出て、賓客の礼の進行役を呼び、娘を陳光蕊にめあわせた。天地を拝み、夫婦互いに礼をし、続いて舅と姑を拝んだ。殷開山は酒席を整えさせ、一晩楽しく飲み明かした。二人は白い手を取り合い、ともに寝室へ入った。"
  "translation_status": "reviewed"
- "id": "xy-ch09-007"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日五更三點，太宗駕坐金鑾寶殿，文武眾臣趨朝。太宗問道：「新科狀元陳光蕊應授何官？」魏徵丞相奏道：「臣查所屬州郡，有江州缺官，乞我主授他此職。」太宗就命為江州州主，即令收拾起身，勿誤限期。光蕊謝恩出朝，回到相府，與妻商議，拜辭岳丈、岳母，同妻前赴江州之任。離了長安登途。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    翌朝、五更（ごこう）の三点（さんてん）に、太宗は金鑾宝殿（きんらんほうでん）の御座に着き、文武の臣たちが参朝（さんちょう）した。
    太宗「新科（しんか）の状元、陳光蕊には、どの官職を授けるべきか。」
    魏徴「臣（しん）が配下の州郡を調べましたところ、江州（こうしゅう）に官の欠員がございます。どうか陛下、この職をお授けください。」
    太宗は陳光蕊を江州の州主（しゅうしゅ）に任じ、ただちに支度して出立し、期日に遅れぬよう命じた。陳光蕊は恩命（おんめい）を謝して退出し、丞相邸へ戻って妻と相談した。舅・姑に別れを告げ、妻とともに江州へ赴任すべく、長安を発った。
  "translation_status": "reviewed"
- "id": "xy-ch09-008"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正是暮春天氣，和風吹柳綠，細雨點花紅。光蕊便道回家，同妻交拜母親張氏。張氏道：「恭喜我兒，且又娶親回來。」光蕊道：「孩兒叨賴母親福庇，忝中狀元，欽賜遊街，經過丞相殷府門前，遇拋打繡毬適中，蒙丞相即將小姐招孩兒為婿。朝廷除孩兒為江州州主，今來接取母親，同去赴任。」張氏大喜，收拾行程。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    折しも暮春（ぼしゅん）、柔らかな風は柳を緑にし、細かな雨は花を紅く彩っていた。陳光蕊は道を変えて故郷へ帰り、妻とともに母の張氏を拝んだ。
    張氏「よかったね、お前。それに、お嫁さんまで連れて帰ってきたのか。」
    陳光蕊「お母さまのおかげをもちまして、かたじけなくも状元となり、勅命で町を練り歩かせていただきました。殷丞相（いんじょうしょう）のお屋敷の前を通ると、投げられた刺繡の毬がちょうど当たり、丞相がその場でお嬢さまの婿に迎えてくださったのです。朝廷から江州の州主に任じられましたので、お母さまをお迎えして、ともに赴任しようと帰って参りました。」
    張氏は大いに喜び、旅支度を整えた。
  "translation_status": "reviewed"
- "id": "xy-ch09-009"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "在路數日，前至萬花店劉小二家安下。張氏身體忽然染病，與光蕊道：「我身上不安，且在店中調養兩日再去。」光蕊遵命。至次日早晨，見店門前有一人提著個金色鯉魚叫賣，光蕊即將一貫錢買了。欲待烹與母親吃，只見鯉魚閃閃䁪眼。光蕊驚異道：「聞說魚蛇䁪眼，必不是等閑之物。」遂問漁人道：「這魚那裡打來的？」漁人道：「離府十五里洪江內打來的。」光蕊就把魚送在洪江裡去放了生，回店對母親道知此事。張氏道：「放生好事，我心甚喜。」光蕊道：「此店已住三日了，欽限緊急，孩兒意欲明日起身，不知母親身體好否？」張氏道：「我身子不快，此時路上炎熱，恐添疾病。你可這裡賃間房屋，與我暫住，付些盤纏在此。你兩口兒先上任去，候秋涼卻來接我。」光蕊與妻商議，就租了屋宇，付了盤纏與母親，同妻拜辭前去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    数日の旅ののち、万花店（ばんかてん）の劉小二（りゅうしょうじ）の宿に泊まった。張氏は急に病にかかり、息子に告げた。
    張氏「具合がよくない。ここで二日ほど養生してから出かけよう。」
    陳光蕊はその言葉に従った。翌朝、宿の前で、金色の鯉を一匹提げて売っている者を見かけ、一貫（かん）の銭で買った。母に料理して食べさせようとすると、鯉がしきりに目をしばたたいた。陳光蕊は不思議に思った。
    陳光蕊「魚や蛇が目をしばたたくなら、並のものではないと聞いている。」
    そして魚売りに尋ねた。
    陳光蕊「この魚は、どこで捕れたのですか。」
    魚売り「府城（ふじょう）から十五里（り）の洪江（こうこう）で捕れました。」
    陳光蕊は鯉を洪江へ運び、放してやった。宿に戻って母にこのことを話すと、張氏は言った。
    張氏「生き物を放してやるのはよいことだ。私もとてもうれしいよ。」
    陳光蕊「この宿に泊まって、もう三日になります。勅命の期限も迫っていますので、明日には出発したいのですが、お母さまのお加減はいかがでしょう。」
    張氏「まだ具合が悪い。今は道中も暑く、病が重くなりはしないかと心配だ。ここで部屋を借りて、しばらく私を住まわせ、路銀もいくらか置いておくれ。お前たち夫婦が先に赴任し、秋になって涼しくなったら迎えに来ればよい。」
    陳光蕊は妻と相談し、部屋を借り、母に路銀を渡すと、妻とともに別れを告げて出発した。
  "translation_status": "reviewed"

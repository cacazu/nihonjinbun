    "line_end": 159
  "translation_ja": |-
    三人が川に向かって激しく泣くと、早くも水府がそれに気づいた。巡海夜叉が祭文を洪江の竜王に差し出した。読み終えると、洪江の竜王は鱉元帥（べつげんすい）を遣わして陳光蕊を招き、言った。
    洪江の竜王「先生、おめでとうございます。今、奥方、ご子息、それにお舅さまが、そろって川辺であなたを祭っておられます。これから魂を戻して差し上げましょう。さらに如意珠（にょいじゅ）を一粒、走盤珠（そうばんしゅ）を二粒、絞綃（こうしょう）を十端（たん）、明珠（めいしゅ）の玉帯（ぎょくたい）を一本、お贈りします。今日こそ、夫婦、親子が再会できますよ。」
    陳光蕊は何度も拝んで感謝した。洪江の竜王は巡海夜叉に命じ、陳光蕊の体を河口へ運び出し、魂を戻させた。巡海夜叉は命を受けて出ていった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "走盤珠・絞綃の具体形状と材質、端の長さは留保。絞綃を別字の鮫綃へ無断訂正しない。"
- "id": "xy-ch09-030"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說殷小姐哭奠丈夫一番，又欲將身赴水而死，慌得玄奘拚命扯住。正在倉皇之際，忽見水面上一個死屍浮來，靠近江岸之傍。小姐忙向前認看，認得是丈夫的屍首，一發嚎啕大哭不已。眾人俱來觀看，只見光蕊舒拳伸腳，身子漸漸展動，忽地爬將起來坐下。眾人不勝驚駭。光蕊睜開眼，早見殷小姐與丈人殷丞相同著小和尚俱在身邊啼哭。光蕊道：「你們為何在此？」小姐道：「因汝被賊人打死，後來妾身生下此子，幸遇金山寺長老撫養長大，尋我相會，我教他去尋外公。父親得知，奏聞朝廷，統兵到此，拿住賊人，適才生取心肝，望空祭奠我夫。不知我夫怎生又得還魂？」光蕊道：「皆因我與你昔年在萬花店時，買放了那尾金色鯉魚，誰知那鯉魚就是此處龍王。後來逆賊把我推在水中，全虧得他救我。方才又賜我還魂，送我寶物，俱在身上。更不想你生下這兒子，又得岳丈為我報仇。真是苦盡甘來，莫大之喜。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    一方、殷温嬌は夫を泣いて祭ったのち、また水へ身を投じて死のうとした。玄奘は慌て、必死に引き留めた。そうしてうろたえていると、水面を一つの死体が流れてきて、岸辺に寄った。殷温嬌は急いで進み出て見定め、それが夫の死体だと分かると、ますます激しく泣き続けた。一同が見に来ると、陳光蕊は拳を伸ばし、足を伸ばし、体を少しずつ動かし始め、突然、起き上がって座った。みな驚きに堪えなかった。陳光蕊が目を開けると、殷温嬌と舅の殷開山、それに若い僧が、そばで泣いていた。
    陳光蕊「なぜ、皆ここにいるのだ。」
    殷温嬌「あなたが賊に打ち殺された後、私はこの子を産みました。幸い金山寺の長老に育てられ、大きくなって私を捜し当てましたので、外祖父を尋ねるよう言ったのです。父は事情を知って朝廷に奏上し、兵を率いてここへ来て賊を捕らえ、つい先ほど、生きたまま心臓と肝臓を取って、空に向かい、あなたを祭りました。それが、どうしてまた生き返られたのでしょう。」
    陳光蕊「それもこれも、昔、私とお前が万花店にいたとき、金色の鯉を買って放してやったためだ。あの鯉が、ここの竜王だったとは思いもしなかった。後に逆賊が私を水へ突き落としたとき、ひとえに竜王のおかげで救われたのだ。今また魂を戻してくださり、宝物もいただいた。みな身につけている。お前がこの子を産み、さらに舅殿が仇を討ってくださるとは思わなかった。まさに苦しみが尽きて喜びが来る。これほどの喜びはない。」
  "translation_status": "reviewed"
- "id": "xy-ch09-031"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾官聞知，都來賀喜。丞相就令安排酒席，答謝所屬官員。即日軍馬回程。來到萬花店，那丞相傳令安營。光蕊便同玄奘到劉家店尋婆婆。那婆婆當夜得了一夢，夢見枯木開花，屋後喜鵲頻頻喧噪，想道：「莫不是我孫兒來也？」說猶未了，只見店門外，光蕊父子齊到。小和尚指道：「這不是俺婆婆？」光蕊見了老母，連忙拜倒。母子抱頭痛哭一場，把上項事說了一遍。算還了小二店錢，起程回到京城。進了相府，光蕊同小姐與婆婆、玄奘都來見了夫人。夫人不勝之喜，吩咐家僮，大排筵宴慶賀。丞相道：「今日此宴，可取名為團圓會。」真正合家歡樂。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    官人たちは話を聞き、みな祝いに来た。殷開山は酒席を整えさせ、配下の官人たちに礼を述べた。その日、軍は帰途についた。万花店に着くと、殷開山は陣を張るよう命じた。陳光蕊は玄奘とともに劉家（りゅうけ）の宿へ行き、母を捜した。張氏はその夜、枯れ木に花が咲く夢を見て、家の裏ではカササギがしきりに鳴いていたので、思った。
    張氏（心の中で）「ひょっとして、孫が戻ってくるのだろうか。」
    思い終わらぬうちに、宿の門外へ陳光蕊と玄奘がそろって着いた。玄奘は指さした。
    玄奘「ほら、お祖母さまではありませんか。」
    陳光蕊は老母を見ると、急いでひざまずいて拝んだ。母子は抱き合ってひとしきり泣き、これまでのことを一通り語った。劉小二への宿賃を精算して払い、出発して都へ帰った。丞相邸に入ると、陳光蕊、殷温嬌、張氏、玄奘はみな殷夫人に会った。殷夫人は喜びに堪えず、家僮に命じて、盛大な祝いの宴を設けさせた。
    殷開山「今日の宴は、団円の会と名づけよう。」
    まことに一家そろっての喜びであった。
  "translation_status": "reviewed"
- "id": "xy-ch09-032"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日早朝，唐王登殿。殷丞相出班，將前後事情備細啟奏，並薦光蕊才可大用。唐王准奏，即命陞陳萼為學士之職，隨朝理政。玄奘立意安禪，送在洪福寺內修行。後來，殷小姐畢竟從容自盡。玄奘自到金山寺中報答法明長老。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 163
    "line_end": 163
  "translation_ja": "翌日の早朝、太宗が殿に出ると、殷開山は列を離れ、前後の事情を詳しく奏上し、さらに陳光蕊は大いに用いるべき才の持ち主だと推薦した。太宗は奏上を認め、陳光蕊を学士（がくし）に昇進させ、朝廷に仕えて政務を執らせた。玄奘は静かに禅を修めようと心に決め、洪福寺（こうふくじ）へ送られて修行した。その後、殷温嬌は結局、静かに自ら命を絶った。玄奘は自ら金山寺へ行き、法明長老の恩に報いた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "殷温嬌の自死を原文どおり収録。原因や心理を補わない。"

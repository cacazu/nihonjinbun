- "id": "xy-ch09-010"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "途路艱苦，曉行夜宿，不覺已到洪江渡口。只見梢子劉洪、李彪二人，撐船到岸迎接。也是光蕊前生合當有此災難，撞著這冤家。光蕊令家僮將行李搬上船去，夫妻正齊齊上船，那劉洪睜眼看見殷小姐面如滿月，眼似秋波，櫻桃小口，綠柳蠻腰，真個有沉魚落雁之容，閉月羞花之貌，陡起狼心。遂與李彪設計，將船撐至沒人煙處。候至夜靜三更，先將家僮殺死，次將光蕊打死，把尸首都推在水裡去了。小姐見他打死了丈夫，也便將身赴水。劉洪一把抱住道：「你若從我，萬事皆休；若不從時，一刀兩斷。」那小姐尋思無計，只得權時應承，順了劉洪。那賊把船渡到南岸，將船付與李彪自管，他就穿了光蕊衣冠，帶了官憑，同小姐往江州上任去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    旅はつらく、朝に歩き、夜に宿を取り、いつしか洪江の渡し場に着いた。船頭の劉洪（りゅうこう）と李彪（りひょう）の二人が、船を岸へ寄せて迎えた。これも陳光蕊が前世からこの災難に遭う定めだったのか、この仇敵に行き会ったのである。陳光蕊は家僮に荷物を船へ運ばせ、夫婦そろって乗り込んだ。劉洪が目を上げると、殷温嬌の顔は満月、目は澄んだ秋の波、口は桜桃（おうとう）、腰は緑の柳のようだった。まさに魚も沈み、雁も落ち、月も隠れ、花も恥じるほどの美しさに、たちまち狼のような邪心を起こした。李彪と共謀し、人けのない所へ船を進めた。夜が静まり、三更（さんこう）になるのを待って、まず家僮を殺し、次に陳光蕊を打ち殺し、二人の死体を水へ突き落とした。殷温嬌は夫が殺されるのを見ると、自分も水に身を投げようとした。劉洪はすかさず抱き留めた。
    劉洪「俺に従うなら、それで済ませてやる。従わなければ、一刀で真っ二つだ。」
    殷温嬌は考えても手立てがなく、やむなくその場は承知したふりで劉洪に従った。賊は船を南岸へ渡し、李彪に任せて管理させた。自分は陳光蕊の衣冠（いかん）を着け、任官の証書を持ち、殷温嬌を連れて江州に赴任した。
  "translation_status": "reviewed"
- "id": "xy-ch09-011"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說劉洪殺死的家僮屍首，順水流去。惟有陳光蕊的屍首，沉在水底不動。有洪江口巡海夜叉見了，星飛報入龍宮，正值龍王升殿，夜叉報道：「今洪江口不知甚人把一個讀書士子打死，將屍撇在水底。」龍王叫將屍擡來，放在面前，仔細一看道：「此人正是救我的恩人，如何被人謀死？常言道：『恩將恩報。』我今日須索救他性命，以報日前之恩。」即寫下牒文一道，差夜叉徑往洪州城隍、土地處投下，要取秀才魂魄來，救他的性命。城隍、土地遂喚小鬼把陳光蕊的魂魄交付與夜叉去。夜叉帶了魂魄到水晶宮，稟見了龍王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    さて、劉洪に殺された家僮の死体は川下へ流れていったが、陳光蕊の死体だけは水底に沈んで動かなかった。洪江の河口を巡る巡海夜叉（じゅんかいやしゃ）がそれを見つけ、飛ぶように竜宮（りゅうぐう）へ報告に行った。ちょうど洪江の竜王（こうこうのりゅうおう）が殿に出ていた。
    巡海夜叉「洪江の河口で、何者かが学問をする士人（しじん）を一人打ち殺し、水底に死体を投げ捨てております。」
    洪江の竜王は死体を運ばせ、前に置かせると、よく見て言った。
    洪江の竜王「この人は、まさしく私を救ってくれた恩人だ。どうして殺されてしまったのだろう。『恩には恩で報いる』という。今こそ命を救い、先日の恩に報いねばならぬ。」
    ただちに公文書を一通書き、巡海夜叉を洪州（こうしゅう）の城隍（じょうこう）と土地神（とちがみ）のもとへ遣わし、この士人の魂を引き取って、命を救おうとした。城隍と土地神は小鬼を呼び、陳光蕊の魂を巡海夜叉へ渡した。巡海夜叉は魂を連れて水晶宮（すいしょうきゅう）に戻り、洪江の竜王に報告した。
  "translation_status": "reviewed"
- "id": "xy-ch09-012"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "龍王問道：「你這秀才姓甚名誰？何方人氏？因甚到此，被人打死？」光蕊施禮道：「小生陳萼，表字光蕊，係海州弘農縣人。忝中新科狀元，叨授江州州主，同妻赴任。行至江邊上船，不料梢子劉洪貪謀我妻，將我打死拋屍。乞大王救我一救。」龍王聞言道：「原來如此。先生，你前者所放金色鯉魚，即我也。你是救我的恩人，你今有難，我豈有不救你之理？」就把光蕊屍身安置一壁，口內含一顆定顏珠，休教損壞了，日後好還魂報仇。又道：「汝今真魂，權且在我水府中做個都領。」光蕊叩頭拜謝，龍王設宴相待不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    洪江の竜王「そなた、姓と名は何という。どこの生まれで、なぜここへ来て、打ち殺されたのか。」
    陳光蕊は礼をした。
    陳光蕊「私は陳萼（ちんがく）、字は光蕊、海州弘農県（こうのうけん）の者です。かたじけなくも今度の試験で状元となり、江州の州主に任じられて、妻と赴任する途中でした。川辺まで来て船に乗ると、思いもかけず船頭の劉洪が妻を奪おうとたくらみ、私を打ち殺して死体を投げ捨てたのです。大王、どうかお救いください。」
    洪江の竜王「そういうことだったのか。先生、先日あなたが放してくださった金色の鯉は、この私なのです。あなたは私の命の恩人。そのあなたが災難に遭われたのに、救わずにいられましょうか。」
    洪江の竜王は陳光蕊の体を脇に安置させ、口に定顔珠（ていがんしゅ）を一粒含ませて、傷まぬようにした。後日、魂を戻して仇を討てるようにするためである。そしてまた告げた。
    洪江の竜王「今は魂の身ですから、ひとまず私の水府（すいふ）で都領（とりょう）の役を務めてください。」
    陳光蕊は額を地につけて礼を言った。洪江の竜王は宴を設けて、もてなした。この話はひとまず置こう。
  "translation_status": "reviewed"
- "id": "xy-ch09-013"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說殷小姐痛恨劉賊，恨不食肉寢皮。只因身懷有孕，未知男女，萬不得已，權且勉強相從。轉盼之間，不覺已到江州。吏書門皂，俱來迎接。所屬官員，公堂設宴相敘。劉洪道：「學生到此，全賴諸公大力匡持。」屬官答道：「堂尊大魁高才，自然視民如子，訟簡刑清。我等合屬有賴，何必過謙？」公宴已罷，眾人各散。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    一方、殷温嬌は賊の劉洪を深く憎み、その肉を食らい、皮を敷いて寝ても飽き足りぬほどだった。ただ、身ごもっていて、男の子か女の子かもまだ分からず、ほかにどうすることもできないので、しばらくは無理に従っていた。瞬く間に、江州に着いた。書記役人から門番、下役まで、みな出迎えに来た。配下の官人たちは公堂（こうどう）で宴を設けて、顔を合わせた。
    劉洪「こちらへ参りましたからには、ひとえに皆さまのお力添えを頼りにしております。」
    属官（ぞっかん）たち「長官は状元に選ばれた高才のお方。きっと民を子のように慈しみ、訴訟は少なく、刑政（けいせい）は清らかとなりましょう。私ども配下の者こそ、お力にすがるのです。ご謙遜には及びません。」
    公の宴が終わると、一同はそれぞれ散っていった。
  "translation_status": "reviewed"
- "id": "xy-ch09-014"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "光陰迅速。一日，劉洪公事遠出。小姐在衙思念婆婆、丈夫，在花亭上感嘆。忽然身體困倦，腹內疼痛，暈悶在地，不覺生下一子。耳邊有人囑曰：「滿堂嬌，聽吾叮囑：吾乃南極星君，奉觀音菩薩法旨，特送此子與你。異日聲名遠大，非比等閑。劉賊若回，必害此子，汝可用心保護。汝夫已得龍王相救，日後夫妻相會，子母團圓，雪冤報仇有日也。謹記吾言。快醒，快醒。」言訖而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    月日は速く流れた。ある日、劉洪は公務で遠方に出かけた。殷温嬌は役所で姑と夫を思い、花の咲くあずまやで嘆いていた。急に体がだるくなり、腹が痛み出して、気を失って地面に倒れ、知らぬうちに男の子を産み落とした。その耳元で、ある者が言い聞かせた。
    南極星君（なんきょくせいくん）「満堂嬌、私の言いつけを聞け。私は南極星君、観音菩薩（かんのんぼさつ）の法旨（ほうし）を奉じ、特にこの子をそなたへ届けに来た。この子は後に広く名を知られ、並の者とは違う人物になる。賊の劉洪が帰れば、必ずこの子を殺そうとする。心して守るのだ。そなたの夫はすでに竜王（りゅうおう）に救われている。後には夫婦が再会し、母子もそろい、無念を晴らして仇を討つ日が来る。私の言葉をよく覚えておけ。早く目覚めよ、目覚めよ。」
    そう言うと去っていった。
  "translation_status": "reviewed"
- "id": "xy-ch09-015"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小姐醒來，句句記得，將子抱定，無計可施。忽然劉洪回來，一見此子，便要淹殺。小姐道：「今日天色已晚，容待明日拋去江中。」幸喜次早劉洪忽有緊急公事遠出。小姐暗思：「此子若待賊人回來，性命休矣。不如及早拋棄江中，聽其生死。倘或皇天見憐，有人救得，收養此子，他日還得相逢。」但恐難以識認，即咬破手指，寫下血書一紙，將父母姓名、跟腳緣由，備細開載；又將此子左腳上一個小指，用口咬下，以為記驗。取貼身汗衫一件，包裹此子，乘空抱出衙門。幸喜官衙離江不遠。小姐到了江邊，大哭一場。正欲拋棄，忽見江岸岸側飄起一片木板，小姐即朝天拜禱，將此子安在板上，用帶縛住，血書繫在胸前，推放江中，聽其所之。小姐含淚回衙不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    殷温嬌が目を覚ますと、一言一句を覚えていた。子をしっかり抱いたものの、どうすればよいか分からなかった。急に劉洪が帰ってきて、子を見るなり溺れ死にさせようとした。
    殷温嬌「今日はもう暗くなりました。明日、川へ捨てるまで待ってください。」
    幸い翌朝、劉洪は急な公務で遠出することになった。殷温嬌はひそかに考えた。
    殷温嬌（心の中で）「賊が帰るまでこの子を置いておけば、命はない。それより早く川へ放し、生死を運に任せよう。もし天がお憐れみくださり、誰かが救って育ててくれれば、後にまた会えるかもしれない。」
    ただ、後で見分けられなくなるのが心配だったので、指をかみ破り、血で書状を書いた。父母の姓名、素性、いきさつを詳しく記し、さらに子の左足の小指を一本かみ切って、見分けるしるしとした。身につけていた肌着を一枚取り、子をくるむと、すきを見て抱き、役所を出た。幸い役所は川から遠くなかった。殷温嬌は川辺に着くと、ひとしきり声を上げて泣いた。いよいよ子を捨てようとしたとき、岸辺に一枚の板が漂ってくるのが見えた。天を仰いで拝み祈ると、子を板の上に寝かせ、帯で結び、血書を胸元にくくりつけ、川へ押し流して、行く先を任せた。殷温嬌は涙を浮かべて役所へ帰った。この話は置こう。
  "translation_status": "reviewed"
- "id": "xy-ch09-016"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說此子在木板上順水流去，一直流到金山寺腳下停住。那金山寺長老叫做法明和尚，修真悟道，已得無生妙訣。正當打坐參禪，忽聞得小兒啼哭之聲，一時心動，急到江邊觀看，只見涯邊一片木板上，睡著一個嬰兒。長老慌忙救起，見了懷中血書，方知來歷。取個乳名，叫做江流，託人撫養。血書緊緊收藏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 143
    "line_end": 143
  "translation_ja": "さて、その子は板に乗って川を流れ下り、まっすぐ金山寺（きんざんじ）の麓に来て止まった。金山寺の長老は法明和尚（ほうみょうおしょう）といい、真を修め、道を悟り、すでに不生（ふしょう）の妙なる教えを得ていた。ちょうど坐禅を組んでいると、急に赤ん坊の泣き声が聞こえ、胸騒ぎがして、急いで川辺へ見に行った。岸際の板の上に、赤ん坊が寝ていた。法明長老（ほうみょうちょうろう）は慌てて救い上げ、懐の血書を見て、初めてその来歴を知った。江流（こうりゅう）という幼名を付け、人に頼んで養育させ、血書は大切にしまい込んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch09-017"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "光陰似箭，日月如梭。不覺江流年長一十八歲。長老就叫他削髮修行，取法名為玄奘，摩頂受戒，堅心修道。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 145
    "line_end": 145
  "translation_ja": "光陰は矢のごとく、日月は機の杼（ひ）のように行き交う。いつしか江流は十八歳になった。法明長老は髪を剃って修行させ、玄奘（げんじょう）という法名を授け、頭をなでて戒（かい）を受けさせた。玄奘は心を固めて仏道を修めた。"
  "translation_status": "reviewed"
- "id": "xy-ch09-018"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，暮春天氣，眾人同在松陰之下講經參禪，談說奧妙，那酒肉和尚恰被玄奘難倒。和尚大怒，罵道：「你這業畜，姓名也不知，父母也不識，還在此搗甚麼鬼？」玄奘被他罵出這般言語，入寺跪告師父，眼淚雙流道：「人生於天地之間，稟陰陽而資五行，盡由父生母養，豈有為人在世而無父母者乎？」再三哀告，求問父母姓名。長老道：「你真個要尋父母，可隨我到方丈裡來。」玄奘就跟到方丈。長老到重梁之上，取下一個小匣兒，打開來，取出血書一紙、汗衫一件，付與玄奘。玄奘將血書拆開讀之，才備細曉得父母姓名，並冤仇事跡。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    ある暮春の日、一同は松陰で経を講じ、禅を論じ、奥深い道理を語り合っていた。折悪しく、酒肉を口にする僧が玄奘の問いに答えられず、ひどく腹を立てて罵った。
    僧「この因業な畜生め！　自分の姓名も知らず、父母も分からぬくせに、ここで何を小細工している！」
    玄奘はこんな言葉を浴びせられ、寺へ入って師の前にひざまずき、両眼から涙を流して訴えた。
    玄奘「人は天地の間に生まれ、陰陽を受け、五行（ごぎょう）に養われますが、みな父から生まれ、母に育てられるものです。この世に人として生まれて、父母がいないということがありましょうか。」
    繰り返し哀願して、父母の姓名を尋ねた。
    法明長老「本当に父母を捜したいのなら、私について方丈（ほうじょう）へ来なさい。」
    玄奘は後について方丈へ入った。法明長老は重なった梁の上から小箱を下ろし、開けて血書一通と肌着一枚を取り出し、玄奘に渡した。玄奘は血書を開いて読み、ようやく父母の姓名と、受けた恨みのいきさつを詳しく知った。
  "translation_status": "reviewed"
- "id": "xy-ch09-019"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘讀罷，不覺哭倒在地道：「父母之仇，不能報復，何以為人？十八年來，不識生身父母，至今日方知有母親。此身若非師父撈救撫養，安有今日？容弟子去尋見母親，然後頭頂香盆，重建殿宇，報答師父之深恩也。」師父道：「你要去尋母，可帶這血書與汗衫前去。只做化緣，徑往江州私衙，才得你母親相見。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    読み終えると、玄奘は思わず地に泣き伏した。
    玄奘「父母の仇を討てずに、どうして人でいられましょう。十八年間、生みの父母を知らず、今日になって初めて母がいると知りました。お師匠さまが救い上げ、育ててくださらなければ、今の私はありません。どうか母を捜して会いに行かせてください。その後、頭に香盆（こうぼん）を頂き、堂宇（どうう）を建て直して、お師匠さまの深いご恩に報います。」
    法明長老「母を捜しに行くのなら、この血書と肌着を持っていきなさい。托鉢をするふりで、まっすぐ江州の役所の私邸へ行けば、母に会えるだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch09-020"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘領了師父言語，就做化緣的和尚，徑至江州。適值劉洪有事出外，也是天叫他母子相會，玄奘就直至私衙門口抄化。那殷小姐原來夜間得了一夢，夢見月缺再圓，暗想道：「我婆婆不知音信；我丈夫被這賊謀殺；我的兒子拋在江中，倘若有人收養，算來有十八歲矣，或今日天教相會，亦未可知。」正沉吟間，忽聽私衙前有人念經，連叫「抄化」，小姐又乘便出來問道：「你是何處來的？」玄奘答道：「貧僧乃是金山寺法明長老的徒弟。」小姐道：「你既是金山寺長老的徒弟……」叫進衙來，將齋飯與玄奘吃。仔細看他舉止言談，好似與丈夫一般。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    玄奘は師の言葉を受け、托鉢僧の姿で江州へ向かった。折しも劉洪は用事で出かけていた。天も母子を会わせようとしていたのだろう。玄奘はまっすぐ私邸の門へ行き、喜捨（きしゃ）を求めた。その殷温嬌は、昨夜、欠けた月が再び満月になる夢を見ていた。ひそかに考えた。
    殷温嬌（心の中で）「姑の消息は知れず、夫はあの賊に殺された。川へ流した息子は、もし誰かに育ててもらえたなら、数えて十八歳になっている。ひょっとしたら今日、天が会わせてくださるのかもしれない。」
    考え込んでいると、突然、私邸の前で経を読む声がし、繰り返し呼びかける声が聞こえた。
    玄奘「お布施をお願いいたします。」
    殷温嬌はちょうどよい折に外へ出て尋ねた。
    殷温嬌「どちらから来たのですか。」
    玄奘「私は金山寺の法明長老の弟子でございます。」
    殷温嬌「金山寺の長老のお弟子なら……。」
    役所の中へ招き入れ、精進料理を食べさせた。その物腰や話しぶりをよく見ると、夫にそっくりだった。
  "translation_status": "reviewed"
- "id": "xy-ch09-021"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小姐將從婢打發開去，問道：「你這小師父，還是自幼出家的，還是中年出家的？姓甚名誰？可有父母否？」玄奘答道：「我也不是自幼出家，我也不是中年出家，我說起來，冤有天來大，仇有海樣深：我父被人謀死，我母卻被賊人占了。我師父法明長老教我在江州衙內尋取母親。」小姐問道：「你母姓甚？」玄奘道：「我母姓殷，名喚溫嬌。我父姓陳，名光蕊。我小名叫做江流，法名取為玄奘。」小姐道：「溫嬌就是我。但你今有何憑據？」玄奘聽說是他母親，雙膝跪下，哀哀大哭：「我娘若不信，見有血書、汗衫為證。」溫嬌取過一看，果然是真，母子相抱而哭。就叫：「我兒快去。」玄奘道：「十八年不識生身父母，今朝才見母親，教孩兒如何割捨？」小姐道：「我兒，你火速抽身前去。劉賊若回，他必害你性命。我明日假裝一病，只說先年曾許捨百雙僧鞋，來你寺中還願。那時節，我有話與你說。」玄奘依言拜別。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    殷温嬌は付き添いの侍女を遠ざけて、尋ねた。
    殷温嬌「若いお坊さま、幼いころから出家していたのですか、それとも大きくなってからですか。姓と名は何といい、父母はおいでですか。」
    玄奘「幼いころから出家していたわけでも、大人になって出家したわけでもありません。話せば、天ほど大きな無念、海ほど深い恨みがあります。父は殺され、母は賊に奪われました。師の法明長老が、江州の役所で母を捜すよう教えてくださったのです。」
    殷温嬌「お母さまの姓は何といいますか。」
    玄奘「母は姓を殷（いん）、名を温嬌と申します。父は姓が陳、名は光蕊。私の幼名は江流、法名は玄奘でございます。」
    殷温嬌「温嬌とは私のことです。けれど、何か証しはありますか。」
    玄奘は母だと聞いて両膝をつき、声を上げて泣いた。
    玄奘「お母さま、お信じになれないのでしたら、ここに血書と肌着が証しとしてございます。」
    殷温嬌が受け取って見ると、まさしく本物だった。母子は抱き合って泣いた。やがて殷温嬌は叫んだ。
    殷温嬌「お前、早く行きなさい。」
    玄奘「十八年間、生みの父母を知らず、今日ようやくお母さまに会えたのです。どうしてお別れできましょう。」
    殷温嬌「お前は一刻も早く、ここを離れなさい。賊の劉洪が帰ってきたら、きっと殺されてしまう。明日、私は病気のふりをして、昔、僧の靴を百足寄進すると願を立てたと口実を作り、お前の寺へ願ほどき（がんほどき）に行く。そのとき、話したいことがあるのです。」
    玄奘は言われたとおり、礼をして別れた。
  "translation_status": "reviewed"
- "id": "xy-ch09-022"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說小姐自見兒子之後，心內一憂一喜。忽一日推病，茶飯不吃，臥於床上。劉洪歸衙，問其原故。小姐道：「我幼時曾許下一願，許捨僧鞋一百雙。昨五日之前，夢見個和尚手執利刃，要索僧鞋，便覺身子不快。」劉洪道：「這些小事，何不早說？」隨升堂，吩咐王左衙、李右衙：江州城內百姓，每家要辦僧鞋一雙，限五日內完納。百姓俱依派完納訖。小姐對劉洪道：「僧鞋做完，這裡有甚麼寺院，好去還願？」劉洪道：「這江州有個金山寺、焦山寺，聽你在那個寺裡去。」小姐道：「久聞金山寺好個寺院，我就往金山寺去。」劉洪即喚王、李二衙辦下船隻。小姐帶了心腹人，同上了船，梢子將船撐開，就投金山寺去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    さて、殷温嬌は息子と会ってから、心に心配と喜びの両方を抱いていた。ある日、病気を装い、飲み食いをせず寝床に伏せた。劉洪が帰ってきて理由を尋ねると、殷温嬌は答えた。
    殷温嬌「幼いころ、僧の靴を百足寄進すると願を立てました。五日ほど前の夜、鋭い刃物を持った僧が、靴をよこせと迫る夢を見て、それから体の具合が悪いのです。」
    劉洪「そんな小さなことを、なぜ早く言わなかった。」
    さっそく公堂へ出て、王左衙（おうさが）と李右衙（りうが）に命じた。江州城内の民は家ごとに僧の靴を一足作り、五日以内に納めよ、と。民はみな割り当てどおりに納めた。
    殷温嬌「靴ができましたが、この辺りには、願ほどきに行けるどんな寺がありますか。」
    劉洪「この江州には金山寺と焦山寺（しょうざんじ）がある。好きな方へ行けばよい。」
    殷温嬌「金山寺はよい寺だと前々から聞いています。金山寺へ参りましょう。」
    劉洪は王（おう）・李（り）の二人の下役を呼び、船を用意させた。殷温嬌は腹心の者を連れて一緒に乗り込み、船頭が船を出して、金山寺へ向かった。
  "translation_status": "reviewed"
- "id": "xy-ch09-023"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說玄奘回寺，見法明長老，把前項說了一遍。長老甚喜。次日，只見一個丫鬟先到，說夫人來寺還願。眾僧都出寺迎接。小姐徑進寺門，參了菩薩，大設齋襯。喚丫鬟將僧鞋暑襪托於盤內，來到法堂，小姐復拈心香禮拜，就教法明長老分俵與眾僧去訖。玄奘見眾僧散了，法堂上更無一人，他卻近前跪下。小姐叫他脫了鞋襪看時，那左腳上果然少了一個小指頭。當時兩個又抱住而哭，拜謝長老養育之恩。法明道：「汝今母子相會，恐奸賊知之，可速速抽身回去，庶免其禍。」小姐道：「我兒，我與你一隻香環，你徑到洪州西北地方，約有一千五百里之程，那裡有個萬花店，當時留下婆婆張氏在那裡，是你父親生身之母。我再寫一封書與你，徑到唐王皇城之內，金殿左邊，殷開山丞相家，是你母生身之父母。你將我的書遞與外公，叫外公奏上唐王，統領人馬，擒殺此賊，與父報仇，那時才救得老娘的身子出來。我今不敢久停，誠恐賊漢怪我歸遲。」便出寺登舟而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    一方、玄奘は寺に帰り、法明長老に先ほどのことを一部始終話した。法明長老はたいそう喜んだ。翌日、一人の侍女が先に来て、奥方が願ほどきに参ると告げた。僧たちはみな寺を出て迎えた。殷温嬌はまっすぐ門を入り、菩薩を拝み、盛大に斎食（さいじき）と布施を供えた。侍女に僧の靴と夏用の靴下を盆に載せさせ、法堂（はっとう）へ進むと、また心を込めて香を捧げ、礼拝した。そして法明長老に頼み、僧たちへ分けて配ってもらった。玄奘は僧たちが散り、法堂にほかの者がいなくなると、進み出てひざまずいた。殷温嬌が靴と靴下を脱がせて見ると、左足には確かに小指が一本なかった。二人はまた抱き合って泣き、育ててくれた法明長老の恩に感謝した。
    法明長老「こうして母子が会えましたが、奸賊に知られる恐れがあります。災いを避けるため、早くお帰りなさい。」
    殷温嬌「お前に香環（こうかん）を一つ渡します。洪州の西北へ向かいなさい。道のりは千五百里ほどで、そこに万花店があります。あのとき、姑の張氏をそこへ残しました。お前の父の生みの母です。さらに手紙を一通書いて渡しますから、唐の皇帝の皇城、金殿（きんでん）の左側にある殷開山丞相の家へ行きなさい。そこにいるのが、私の生みの父母です。私の手紙をお祖父さまに渡し、皇帝に奏上して兵を率い、この賊を捕らえて殺し、父の仇を討ってもらうのです。そのとき初めて、この母も救い出されます。もう長居はできません。帰りが遅いと賊に怪しまれるのが、本当に恐ろしいのです。」
    そうして寺を出て船に乗り、帰っていった。

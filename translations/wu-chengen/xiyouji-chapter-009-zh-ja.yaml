  "source_text": "玄奘哭回寺中，告過師父，即時拜別，徑往洪州。來到萬花店，問那店主劉小二道：「昔年江州陳客官有一母親住在你店中，如今好麼？」劉小二道：「他原在我店中。後來昏了眼，三四年並無店租還我。如今在南門頭一個破瓦窰裡，每日上街叫化度日。那客官一去許久，到如今杳無信息，不知為何。」玄奘聽罷，即時問到南門頭破瓦窰，尋著婆婆。婆婆道：「你聲音好似我兒陳光蕊。」玄奘道：「我不是陳光蕊，我是陳光蕊的兒子。溫嬌小姐是我的娘。」婆婆道：「你爹娘怎麼不來？」玄奘道：「我爹爹被強盜打死了，我娘被強盜霸占為妻。」婆婆道：「你怎麼曉得來尋我？」玄奘道：「是我娘著我來尋婆婆。我娘有書在此，又有香環一隻。」那婆婆接了書並香環，放聲痛哭道：「我兒為功名到此，我只道他背義忘恩，那知他被人謀死。且喜得皇天憐念，不絕我兒之後，今日還有孫子來尋我。」玄奘問：「婆婆的眼，如何都昏了？」婆婆道：「我因思量你父親，終日懸望，不見他來，因此上哭得兩眼都昏了。」"
  "source_languages":

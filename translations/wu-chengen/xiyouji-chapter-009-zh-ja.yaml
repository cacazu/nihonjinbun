  "source_text": "三人望江痛哭，早已驚動水府，有巡海夜叉將祭文呈與龍王。龍王看罷，就差鱉元帥去請光蕊來到，道：「先生，恭喜，恭喜。今有先生夫人、公子同岳丈俱在江邊祭你。我今送你還魂去也。再有如意珠一顆、走盤珠二顆、絞綃十端、明珠玉帶一條奉送。你今日便可夫妻子母相會也。」光蕊再三拜謝。龍王就令夜叉將光蕊身屍送出江口還魂。夜叉領命而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"

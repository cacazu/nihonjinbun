  "translation_ja": |-
    玄奘は泣きながら寺へ戻り、師に申し上げて、すぐ別れを告げ、洪州へ向かった。万花店に着くと、宿主の劉小二に尋ねた。
    玄奘「昔、江州へ行かれた陳というお客人のお母さまが、こちらにお泊まりでしたが、今もお元気でしょうか。」
    劉小二「もとはうちにおられましたが、後に目が見えなくなり、三、四年も宿賃を払えませんでした。今は南門の所にある壊れた瓦焼き窯に住み、毎日、町で物乞いをして暮らしています。あのお客人は行ったきり、今まで何の便りもありません。なぜなのかは分かりません。」
    玄奘は聞くや、ただちに南門の壊れた瓦窯を尋ね、祖母を見つけた。
    張氏「お前の声は、息子の陳光蕊によく似ているね。」
    玄奘「私は陳光蕊ではなく、陳光蕊の息子です。温嬌さまが私の母です。」
    張氏「お父さんとお母さんは、なぜ来ないのだい。」
    玄奘「父は強盗に打ち殺され、母は強盗に妻として奪われてしまいました。」
    張氏「どうして私を捜しに来ることが分かったのだい。」
    玄奘「母が、お祖母さまを捜すようにと、私を遣わしたのです。ここに母の手紙と、香環が一つございます。」
    張氏は手紙と香環を受け取り、声を上げて泣いた。
    張氏「息子は功名を求めてここへ来た。私はてっきり義理を捨て、恩を忘れたものと思っていたが、人に殺されていたとは。それでも、天が憐れんでくださり、息子の血筋を絶やさず、今日こうして孫が捜しに来てくれたのは、ありがたいことだ。」
    玄奘「お祖母さまの目は、どうして二つとも見えなくなったのですか。」
    張氏「お前の父を思い、日がな一日、帰るのを待ちわびても来ないので、泣き続けるうちに、両目とも見えなくなってしまったのだよ。」
  "translation_status": "reviewed"
- "id": "xy-ch09-025"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘便跪倒向天禱告道：「今玄奘一十八歲，父母之仇不能報復。今日領母命來尋婆婆，天若憐鑒弟子誠意，保我婆婆雙眼復明。」祝罷，就將舌尖與婆婆舔眼。須臾之間，雙眼舔開，仍復如初。婆婆覷了小和尚道：「你果是我的孫子，恰和我兒子光蕊形容無二。」婆婆又喜又悲。玄奘就領婆婆出了窰門，還到劉小二店內。將些房錢賃屋一間，與婆婆棲身。又將盤纏與婆婆道：「我此去，只月餘就回。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    玄奘はひざまずき、天に向かって祈った。
    玄奘「私、玄奘は十八歳になりますが、父母の仇もまだ討てません。今日、母の命を受けて祖母を捜しに来ました。天が弟子の誠を憐れみ、お認めくださるなら、どうか祖母の両眼がまた見えるようお守りください。」
    祈り終えると、舌先で祖母の目をなめた。たちまち両眼が開き、元どおりになった。張氏は若い僧を見つめた。
    張氏「お前は確かに私の孫だ。息子の光蕊と、まったく同じ顔をしている。」
    張氏は喜びながら、また悲しんだ。玄奘は祖母を窯から連れ出し、劉小二の宿に戻った。いくらか宿賃を払って部屋を一つ借り、祖母の住まいとした。さらに路銀を渡して言った。
    玄奘「これから出かけますが、ひと月余りで戻ります。」
  "translation_status": "reviewed"
- "id": "xy-ch09-026"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "隨即辭了婆婆，徑往京城。尋到皇城東街殷丞相府上，與門上人道：「小僧是親戚，來探相公。」門上人稟知丞相，丞相道：「我與和尚並無親眷。」夫人道：「我昨夜夢見我女兒滿堂嬌來家，莫不是女婿有書信回來也？」丞相便教請小和尚來到廳上。小和尚見了丞相與夫人，哭拜在地，就懷中取出一封書來，遞與丞相。丞相拆開，從頭讀罷，放聲痛哭。夫人問道：「相公，有何事故？」丞相道：「這和尚是我與你的外孫。女婿陳光蕊被賊謀死，滿堂嬌被賊強占為妻。」夫人聽罷，亦痛哭不止。丞相道：「夫人休得煩惱，來朝奏知主上，親自統兵，定要與女婿報仇。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    ただちに祖母に別れを告げ、都へ向かった。皇城東街（こうじょうとうがい）の殷丞相邸を尋ね、門番に言った。
    玄奘「私はご親戚の者です。丞相にお目にかかりたく参りました。」
    門番が取り次ぐと、殷開山は言った。
    殷開山「私には僧の親戚などおらぬ。」
    殷夫人「昨夜、娘の満堂嬌が家に帰ってくる夢を見ました。ひょっとして、婿から便りが届いたのではありませんか。」
    殷開山は若い僧を広間に招き入れさせた。玄奘は殷開山と殷夫人を見ると、泣きながら地に伏して拝み、懐から一通の手紙を取り出して渡した。殷開山は開き、初めから読み終えると、声を上げて泣いた。
    殷夫人「あなた、何があったのですか。」
    殷開山「この僧は、私たちの外孫だ。婿の陳光蕊は賊に殺され、満堂嬌は賊に妻として奪われていたのだ。」
    殷夫人も聞くと、激しく泣き続けた。
    殷開山「そう悲しむな。明朝、陛下に奏上し、私自ら兵を率いて、必ず婿の仇を討とう。」
  "translation_status": "reviewed"
- "id": "xy-ch09-027"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日，丞相入朝，啟奏唐王曰：「今有臣婿狀元陳光蕊，帶領家小江州赴任，被梢子劉洪打死，占女為妻；假冒臣婿，為官多年。事屬異變，乞陛下立發人馬，剿除賊寇。」唐王見奏大怒，就發御林軍六萬，著殷丞相督兵前去。丞相領旨出朝，即往教場內點了兵，徑往江州進發。曉行夜宿，星落鳥飛，不覺已到江州，殷丞相兵馬俱在北岸下了營寨。星夜令金牌下戶喚到江州同知、州判二人，丞相對他說知此事，叫他提兵相助，一同過江而去。天尚未明，就把劉洪衙門圍了。劉洪正在夢中，聽得火炮一響，金鼓齊鳴，眾兵殺進私衙，劉洪措手不及，早被擒住。丞相傳下軍令，將劉洪一干人犯綁赴法場，令眾軍俱在城外安營去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    翌日、殷開山は参朝し、太宗に奏上した。
    殷開山「臣の婿、状元の陳光蕊は、家族を連れて江州に赴任する途中、船頭の劉洪に打ち殺されました。劉洪は臣の娘を妻として奪い、臣の婿をかたって、長年、官を務めております。これはただならぬ事態でございます。どうか陛下、すぐ兵を出して、賊を討ち滅ぼしてください。」
    奏上を聞いた太宗は激怒し、御林軍（ぎょりんぐん）六万を出して、殷開山に指揮して向かわせた。殷開山は命を受けて退出すると、練兵場で兵を点検し、江州へ進発した。朝に進み、夜に宿を取り、流れる星、飛ぶ鳥のように急ぎ、いつしか江州に着き、兵馬はみな北岸に陣を張った。夜を徹して金牌（きんぱい）の使者を遣わし、江州の同知（どうち）と州判（しゅうはん）の二人を呼び寄せた。殷開山は事情を説明し、兵を率いて加勢させ、ともに川を渡った。まだ夜が明けぬうちに、劉洪の役所を取り囲んだ。劉洪は夢の中にいたが、砲声が一つ轟き、鉦（かね）と太鼓が一斉に鳴ると、兵が私邸へ攻め込んだ。不意を突かれた劉洪は、たちまち捕らえられた。殷開山は軍令を下し、劉洪ら一味の罪人を縛って刑場へ送らせ、兵たちには城外で営（えい）を張らせた。
  "translation_status": "reviewed"
- "id": "xy-ch09-028"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "丞相直入衙內正廳坐下，請小姐出來相見。小姐欲待要出，羞見父親，就要自縊。玄奘聞知，急急將母解救，雙膝跪下，對母道：「兒與外公統兵至此，與父報仇。今日賊已擒捉，母親何故反要尋死？母親若死，孩兒豈能存乎？」丞相亦進衙勸解。小姐道：「吾聞『婦人從一而終』。痛夫已被賊人所殺，豈可靦顏從賊？止因遺腹在身，只得忍恥偷生。今幸兒已長大，又見老父提兵報仇，為女兒者，有何面目相見？惟有一死以報丈夫耳。」丞相道：「此非我兒以盛衰改節，皆因出乎不得已，何得為恥？」父子相抱而哭，玄奘亦哀哀不止。丞相拭淚道：「你二人且休煩惱；我今已擒捉仇賊，且去發落去來。」即起身到法場。恰好江州同知亦差哨兵拿獲水賊李彪解到。丞相大喜，就令軍牢押過劉洪、李彪，每人痛打一百大棍，取了供狀，招了先年不合謀死陳光蕊情由，先將李彪釘在木驢上，推去市曹，剮了千刀，梟首示眾訖。把劉洪拿到洪江渡口，先年打死陳光蕊處。丞相與小姐、玄奘三人親到江邊，望空祭奠，活剜取劉洪心肝，祭了光蕊，燒了祭文一道。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch9-1962034"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第009回&oldid=1962034"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    殷開山は役所の正庁に入り、席に着くと、娘を呼び出した。殷温嬌は出ようとしたものの、父に顔を合わせるのを恥じ、首をくくろうとした。玄奘はそれを知り、急いで母を救い、両膝をついて訴えた。
    玄奘「私はお祖父さまと兵を率いてここへ来て、父の仇を討とうとしたのです。今日、賊はもう捕らえられました。それなのに、なぜお母さまは死のうとなさるのですか。お母さまが死んだら、私も生きていられましょうか。」
    殷開山も奥へ入り、なだめた。
    殷温嬌「『女は一人の夫に従い、生涯を終える』と聞いております。夫が賊に殺されたのに、どうして恥知らずにも、その賊に従えましょう。ただ、亡き夫の子を身ごもっていたので、恥を忍んで生き延びるほかなかったのです。幸い今、子は大きくなり、老いた父までが兵を率いて仇を討ちに来てくださいました。娘として、何の面目があってお会いできましょう。死んで夫に報いるほかありません。」
    殷開山「お前は、境遇の盛衰に心を変えて節を捨てたのではない。すべて、やむを得ないことだったのだ。どうして恥じることがあろう。」
    父と娘は抱き合って泣き、玄奘も声を上げて泣き続けた。殷開山は涙を拭った。
    殷開山「二人とも、ひとまず嘆くのはよしなさい。仇の賊はもう捕らえた。これから処分しに行こう。」
    立って刑場へ向かうと、ちょうど江州の同知が遣わした見張りの兵も、水賊の李彪を捕らえて連行してきた。殷開山は大いに喜び、軍の牢番に劉洪と李彪を引き出させ、それぞれ百回ずつ大きな棍（こん）で厳しく打たせ、供述書を取った。かつて陳光蕊を共謀して殺した罪のいきさつを自白させると、まず李彪を木驢（ぼくろ）に釘で留め、市中の刑場へ引き回し、千の刃で肉をそぐ刑に処し、首をさらした。次いで劉洪を、かつて陳光蕊を打ち殺した洪江の渡し場へ連れていった。殷開山、殷温嬌、玄奘の三人は自ら川辺に来て、空に向かって祭りを行い、劉洪の心臓と肝臓を生きたままえぐり出して陳光蕊に供え、祭文（さいぶん）を一通焼いた。
  "translation_status": "reviewed"

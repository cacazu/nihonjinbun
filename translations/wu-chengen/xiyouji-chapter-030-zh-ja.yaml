- "id": "xy-ch30-039"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": "青如削翠，高似摩雲。週圍有虎踞龍蟠，四面多猿啼鶴唳。朝出雲封山頂，暮觀日掛林間。流水潺潺鳴玉珮，澗泉滴滴奏瑤琴。山前有崖峰峭壁，山後有花木穠華。上連玉女洗頭盆，下接天河分派水。乾坤結秀賽蓬萊，清濁育成真洞府。丹青妙筆畫時難，仙子天機描不就。玲瓏怪石石玲瓏，玲瓏結綵嶺頭峰。日影動，千條紫艷；瑞氣搖，萬道紅霞。洞天福地人間有，遍山新樹與新花。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    緑の玉を削り出したように青く、雲を摩するほど高い。周囲の山容は虎がうずくまり龍がとぐろを巻くよう、四方には猿の声と鶴の声が満ちる。
    朝に出れば雲が山頂を包み、暮れに見れば日が林の間にかかる。さらさら流れる水は玉の佩飾を鳴らし、滴る谷の泉は美玉の琴を奏でる。
    山の前には崖や峰や切り立つ壁、山の後ろには花木が豊かに咲く。上は玉女洗頭盆（ぎょくじょせんとうぼん）へ連なり、下は天河（てんが）の分かれ流れる水につながる。
    天地の秀気を集めて蓬莱（ほうらい）にも勝り、清濁の気が育んだ真の仙境である。名画家の妙筆でも描きがたく、仙人の天与の才でも写しきれない。
    巧みに透けた奇岩は、石そのものが精妙で、精妙な峰々が嶺の頂に彩りを結ぶ。日の影が動けば、千筋の紫の輝き。めでたい気が揺れれば、万筋の紅の霞。
    洞天福地（どうてんふくち）は人の世にもあり、山いっぱいに新しい木と、新しい花が広がる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「玉女洗頭盆」は仙女の洗髪の水盤という詩的な山景表現として扱い、特定の現存地形と断定しない。天河とつながる上下の像、清濁による仙境の生成を保持した。"
- "id": "xy-ch30-040"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒觀之不盡，滿心歡喜道：「哥啊，好去處，果然是天下第一名山。」行者道：「賢弟，可過得日子麼？」八戒笑道：「你看師兄說的話，寶山乃洞天福地之處，怎麼說度日之言也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    八戒は眺めても眺めても飽きず、心から喜んで言った。八戒「兄貴、いい所だ。まったく天下一の名山だよ。」
    悟空「弟よ、ここなら何とか暮らしていけるかな。」
    八戒は笑った。八戒「何を言うんだ、兄貴。この山は洞天福地そのものじゃないか。何とか暮らすなどという場所かね。」
  "translation_status": "reviewed"
- "id": "xy-ch30-041"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人談笑多時，下了山。只見路傍有幾個小猴，捧著紫巍巍的葡萄，香噴噴的梨棗，黃森森的枇杷，紅艷艷的楊梅，跪在路傍，叫道：「大聖爺爺，請進早膳。」行者笑道：「我豬弟食腸大，卻不是以果子作膳的。也罷，也罷，莫嫌菲薄，將就吃個兒當點心罷。」八戒道：「我雖食腸大，卻也隨鄉入鄉是。拿來，拿來，我也吃幾個兒嘗新。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    二人はしばらく談笑してから、山を下りた。道端には小猿が何匹か、紫の葡萄、よく香る梨と棗、黄色い枇杷、紅い楊梅（やまもも）を捧げ、ひざまずいて呼びかけた。小猿たち「大聖さま、朝のお食事をどうぞ。」
    悟空は笑った。悟空「俺の猪の弟は大食いだから、果物だけを飯にはしないのだ。まあまあ、粗末だと思わず、少しばかり菓子代わりに食べてくれ。」
    八戒「大食いではあるが、土地に入れば土地のやり方に従うものさ。くれ、くれ。俺もいくつか食べて、出盛りの味を楽しもう。」
  "translation_status": "reviewed"
- "id": "xy-ch30-042"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "二人吃了果子，漸漸日高。那獃子恐怕誤了救唐僧，只管催促道：「哥哥，師父在那裡盼望我和你哩。望你和我早早兒去罷。」行者道：「賢弟，請你往水簾洞裡去耍耍。」八戒堅辭道：「多感老兄盛意，奈何師父久等，不勞進洞罷。」行者道：「既如此，不敢久留，請就此處奉別。」八戒道：「哥哥，你不去了？」行者道：「我往哪裡去？我這裡天不收，地不管，自由自在，不耍子兒，做甚麼和尚？我是不去，你自去罷。但上覆唐僧：既趕退了，再莫想我。」獃子聞言，不敢苦逼，只恐逼發他性子，一時打上兩棍。無奈，只得喏喏告辭，找路而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    二人が果物を食べるうち、日はだんだん高くなった。八戒は三蔵を救うのが遅れてはと気をもみ、しきりにせかした。八戒「兄貴、お師匠さまが俺たちを待っているんだ。どうか早く一緒に来てくれ。」
    悟空「弟よ、水簾洞（すいれんどう）にも入って遊んでいってくれ。」
    八戒はきっぱり辞退した。八戒「兄貴の厚意はありがたいが、お師匠さまを長く待たせている。洞へお邪魔するのは、遠慮させてもらおう。」
    悟空「そういうことなら、長く引き止めるわけにもいかんな。ここでお別れとしよう。」
    八戒「兄貴、行かないのか。」
    悟空「どこへ行くというのだ。ここにいれば天にも捕らわれず、地にも縛られず、自由自在だ。遊んで暮らさず、何の和尚になれというのだ。俺は行かん。お前一人で帰れ。ただ三蔵には伝えてくれ。一度追い払ったからには、もう俺を思い出すな、と。」
    八戒は聞いても、強く迫る勇気がなかった。しつこくすれば癇癪を起こし、棒で二度殴られかねない。なすすべもなく、ぺこぺこと別れの礼をし、道を探して立ち去った。
  "translation_status": "reviewed"
- "id": "xy-ch30-043"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見他去了，即差兩個溜撒的小猴跟著八戒，聽他說些甚麼。真個那獃子下了山，不上三四里路，回頭指著行者，口裡罵道：「這個猴子，不做和尚，倒做妖怪。這個猢猻，我好意來請他，他卻不去。你不去便罷。」走幾步，又罵幾聲。那兩個小猴急跑回來報道：「大聖爺爺，那豬八戒不大老實，他走走兒，罵幾聲。」行者大怒，叫：「拿將來！」那眾猴滿地飛來趕上，把個八戒扛翻倒了，抓鬃扯耳，拉尾揪毛，捉將回去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    悟空は八戒が去ると、身軽な小猿を二匹、後につけて、何を言うか聞かせた。案の定、八戒は山を下り、三、四里も行かぬうちに、振り返って悟空の方を指し、口汚く罵った。八戒「この猿め、和尚をやめて妖怪になりやがって。この猿公、俺が好意で迎えに来たのに、行かぬと言う。来ないなら、それでもいいさ。」
    何歩か行くと、またいくつも悪口を言う。二匹の小猿は急いで戻り、報告した。二匹の小猿「大聖さま、猪八戒はひどく不実な者です。少し歩くたびに、幾度も悪口を言っております。」
    悟空は大いに怒って叫んだ。悟空「捕らえてこい！」
    猿たちは地を飛ぶように駆けて追いつくと、八戒を担ぎ倒し、鬣をつかみ、耳を引き、尾を引っ張り、毛を引きながら、捕らえて連れ戻した。
  "translation_status": "reviewed"
- "id": "xy-ch30-044"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知怎麼處治，性命死活若何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 188
    "line_end": 188
  "translation_ja": "はたしてどんな仕置きを受けるのか、その命は生きるのか死ぬのか。それは次の回でお聞きいただこう。"
  "translation_status": "reviewed"

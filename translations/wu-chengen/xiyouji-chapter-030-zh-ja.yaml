    "line_end": 127
  "translation_ja": "見事な妖怪だ。酒席の中で身を揺すって一変すると、たちまち端正な美青年になった。実に、その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch30-008"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": "形容典雅，體段崢嶸。言語多官樣，行藏正妙齡。才如子建成詩易，貌似潘安擲果輕。頭上戴一頂鵲尾冠，烏雲斂伏；身上穿一件玉羅褶，廣袖飄迎。足下烏靴花摺，腰間鸞帶光明。丰神真是奇男子，聳壑軒昂美俊英。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    顔立ちは典雅、体つきは抜きんでる。言葉遣いは官人のよう、振る舞いもまさに若盛り。
    才は子建（しけん）のように軽々と詩を成し、姿は潘安（はんあん）のように人々から果物を投げ贈られる。
    頭の鵲尾冠（じゃくびかん）の下には、黒雲のような髪がきちんと収まり、身にまとう玉羅褶（ぎょくらしゅう）の広い袖は、ひらひらと揺れる。
    足には襞のある黒い靴、腰には光り輝く鸞（らん）の帯。
    風姿まことに並々ならぬ男子、谷からそびえ立つ木のように、気高く美しい英俊である。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「子建」は曹植の字。「潘安擲果」は美男子潘岳へ女たちが果物を投げ贈った故事と解した（教育部「潘安再世」「擲果」、コトバンク「曹植」を参照）。「玉羅褶」は美しい薄絹の上衣とし、褶の日本語読みは語構成に基づく推定に留める。"
- "id": "xy-ch30-009"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公主見了，十分歡喜。那妖笑道：「渾家，可是變得好麼？」公主道：「變得好，變得好。你這一進朝啊，我父王是親不滅，一定著文武多官留你飲宴。倘吃酒中間，千千仔細，萬萬個小心；卻莫要現出原嘴臉來，露出馬腳，走了風汛，就不斯文了。」老妖道：「不消吩咐，自有道理。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    百花羞は見て、大いに喜んだ。黄袍怪は笑って言った。黄袍怪「お前、うまく化けたかね。」
    百花羞「見事です、見事です。その姿で朝廷へ行けば、父王は身内の情を捨てませんから、きっと文武の官人に命じてあなたを引き止め、宴を開くでしょう。お酒を飲むときは、くれぐれもお気をつけください。元のお顔を現し、尻尾を出して、正体を漏らしてはなりません。そうなれば、上品な振る舞いも台無しです。」
    黄袍怪「言われるまでもない。ちゃんと心得ている。」
  "translation_status": "reviewed"
- "id": "xy-ch30-010"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他縱雲頭，早到了寶象國。按落雲頭，行至朝門之外，對閣門大使道：「三駙馬特來見駕，乞為轉奏轉奏。」那黃門奏事官來至白玉階前奏道：「萬歲，有三駙馬來見駕，現在朝門外聽宣。」那國王正與唐僧敘話，忽聽得三駙馬，便問多官道：「寡人只有兩個駙馬，怎麼又有個三駙馬？」多官道：「三駙馬必定是妖怪來了。」國王道：「可好宣他進來？」那長老心驚道：「陛下，妖精啊，不精者不靈。他能知過去未來，他能騰雲駕霧。宣他也進來，不宣他也進來，倒不如宣他進來，還省些口面。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    黄袍怪は雲に飛び乗ると、早くも宝象国へ着いた。雲を降り、宮門の外へ進んで閣門大使（かくもんたいし）に言った。黄袍怪「第三の駙馬（ふば）が、陛下にお目通りを願いに参った。どうかお取り次ぎいただきたい。」
    黄門奏事官（こうもんそうじかん）は白玉の階段の前へ進み、奏上した。黄門奏事官「陛下、第三の駙馬がお目通りを願っております。ただいま宮門の外で、お召しをお待ちです。」
    国王は三蔵と話していたが、三番目の婿と聞いて、官人たちへ尋ねた。国王「私には駙馬は二人しかいない。なぜ三人目が現れたのだ。」
    官人たち「第三の駙馬というのは、きっと妖怪が来たのでございます。」
    国王「呼び入れてよいものだろうか。」
    三蔵は恐れながら言った。三蔵「陛下、妖怪というもの、並外れた精を備えねば霊妙な力も持ちません。過去も未来も知り、雲に乗り霧を駆ることができます。お召しになっても入ってきますし、お召しにならなくても入ってきます。それなら、お召しになるほうが、余計な言い争いも省けましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch30-011"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王准奏，叫宣，把妖宣至金階。他一般的也舞蹈山呼的行禮。多官見他生得俊麗，也不敢認他是妖精。他都是些肉眼凡胎，卻當做好人。那國王見他聳壑昂霄，以為濟世之梁棟，便問他：「駙馬，你家在那裡居住？是何方人氏？幾時得我公主配合？怎麼今日才來認親？」那老妖叩頭道：「主公，臣是城東碗子山波月洞人家。」國王道：「你那山離此處多遠？」老妖道：「不遠，只有三百里。」國王道：「三百里路，我公主如何得到那裡，與你匹配？」那妖精巧語花言，虛情假意的答道：「主公，微臣自幼兒好習弓馬，採獵為生。那十三年前，帶領家童數十，放鷹逐犬，忽見一隻斑斕猛虎，身馱著一個女子，往山坡下走。是微臣兜弓一箭，射倒猛虎，將女子帶上本莊，把溫水溫湯灌醒，救了他性命。因問他是那裡人家，他更不曾題『公主』二字。早說是萬歲的三公主，怎敢欺心，擅自配合？當得進上金殿，大小討一個官職榮身。只因他說是民家之女，才被微臣留在莊所。女貌郎才，兩相情願，故配合至此多年。當時配合之後，欲將那虎宰了，邀請諸親，卻是公主娘娘教且莫殺。其不殺之故，有幾句言詞，道得甚好，說道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    国王はその言葉を認め、召し入れるよう命じた。黄袍怪は金の階段の前へ通され、やはり舞踏の拝礼と万歳の礼を行った。官人たちはその美しい姿を見ると、妖怪だと決めつけることができなくなった。みなただの人間の目なので、すっかり善人と思い込んだのである。国王も、谷からそびえ空へ達する木のような堂々たる姿を見て、世を救う柱になる人物だと考え、尋ねた。国王「駙馬、住まいはどこで、どこの生まれか。いつ公主と夫婦になり、なぜ今日になってようやく挨拶に来たのだ。」
    黄袍怪は頭を地につけて答えた。黄袍怪「陛下、私は都の東、碗子山（わんしざん）波月洞（はげつどう）に住む者でございます。」
    国王「その山は、ここからどれほど離れている。」
    黄袍怪「遠くはございません。わずか三百里です。」
    国王「三百里もの道を、公主はどうしてそこまで行き、お前と結ばれたのだ。」
    黄袍怪は言葉巧みに、まことしやかな嘘を並べて答えた。黄袍怪「陛下、私は幼いころから弓馬を好み、狩猟で暮らしておりました。十三年前、数十人の家来を率い、鷹を放ち犬を追わせておりましたところ、縞模様の猛虎が一人の女を背に負い、山の斜面を下ってくるのが見えたのです。私が弓を引き絞り、一矢で虎を射倒して、女を屋敷へ連れ帰り、ぬるい湯や温かい汁を飲ませて意識を戻し、命を救いました。どこの家の方かと尋ねましたが、公主とは一言もおっしゃいません。初めから陛下の第三公主と分かっていれば、どうして心に背いて勝手に夫婦になりましょう。金殿へお送りし、大小いずれかの官職を頂いて身を立てるのが当然でした。けれど民家の娘だとおっしゃったので、屋敷へお留めしたのです。女は美しく男には才があり、双方心を寄せて、こうして長年連れ添ってまいりました。
    結ばれた後、あの虎を屠り、親類一同を招こうと思いましたところ、公主が、まだ殺してはならないとおっしゃいました。その理由を、大変見事な句にして、こう言われたのです。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "011末〜013の黄袍怪の長い発話は、012の公主の詩という入れ子の引用を挟んで続く。黄袍怪の語る救出・結婚と過去の公主の言葉は、語り手が明示する作り話である。引用内の百花羞を現場の発話者としてラベル付けしない。"
- "id": "xy-ch30-012"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    托天托地成夫婦，無媒無證配婚姻。
    前世赤繩曾繫足，今將老虎做媒人。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 135
    "line_end": 136
  "translation_ja": |-
    『天を頼み、地を頼んで、私たちは夫婦となる。仲人も証人もなく、婚姻を結ぶ。
    前世から縁結びの赤い縄で足が結ばれていたのだから、今はこの虎を仲人にいたしましょう。』
  "translation_status": "reviewed"
- "id": "xy-ch30-013"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "臣因此言，故將虎解了索子，饒了他性命。那虎帶著箭傷，跑蹄剪尾而去。不知他得了性命，在那山中，修了這幾年，煉體成精，專一迷人害人。臣聞得昔年也有幾次取經的，都說是大唐來的唐僧。想是這虎害了唐僧，得了他文引，變作那取經的模樣，今在朝中哄騙主公。主公啊，那繡墩上坐的，正是那十三年前馱公主的猛虎，不是真正取經之人。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    この言葉を聞き、私は虎の縄を解き、命を助けてやりました。虎は矢傷を負ったまま、脚で地を蹴り、尾を振って逃げていきました。助かった虎が山中でここ数年修行し、体を練って妖怪となり、人を迷わせ害することに専念していようとは、存じませんでした。聞けば以前にも何度か経を取りに来た者があり、みな大唐（だいとう）から来た唐（とう）の僧だと名乗ったそうです。察するに、この虎はその僧を殺して通行文書を奪い、取経の僧の姿に化け、今こうして朝廷で陛下を欺いているのでしょう。
    陛下、あの刺繍の腰掛けに座っている者こそ、十三年前、公主を負っていた猛虎です。本当の取経の僧ではございません。」
  "translation_status": "reviewed"
- "id": "xy-ch30-014"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看那水性的君王，愚迷肉眼，不識妖精，轉把他一片虛詞，當了真實。道：「賢駙馬，你怎的認得這和尚是馱公主的老虎？」那妖道：「主公，臣在山中，吃的是老虎，穿的也是老虎，與他同眠同起，怎麼不認得？」國王道：「你既認得，可教他現出本相來看。」怪物道：「借半盞淨水，臣就教他現了本相。」國王命官取水，遞與駙馬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    気の変わりやすい国王は、愚かな人間の目では妖怪を見分けられず、そのでたらめな話を、逆にすべて真実と思い込んでしまった。国王「よき婿よ、なぜこの和尚が、公主をさらったあの虎だと分かるのだ。」
    黄袍怪「陛下、私は山にいて、食べるのは虎、着るのも虎の皮。虎とともに寝起きしております。分からぬはずがございません。」
    国王「見分けられるのなら、本来の姿を現させて見せてくれ。」
    黄袍怪「清らかな水を杯に半分お貸しください。そうすれば元の姿を現させてみせます。」
    国王は官人に命じ、水を取って駙馬へ渡させた。
  "translation_status": "reviewed"
- "id": "xy-ch30-015"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪接水在手，縱起身來，走上前，使個「黑眼定身法」。念了咒語，將一口水望唐僧噴去，叫聲：「變！」那長老的真身，隱在殿上，真個變作一隻斑斕猛虎。此時君臣肉眼觀看，那隻虎生得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    黄袍怪は水を受け取ると、立ち上がって前へ進み、黒眼定身法（こくがんていしんほう）という術を使った。呪文を唱え、三蔵へひと口の水を吹きかけて叫んだ。黄袍怪「変われ！」
    三蔵の本当の姿は殿上で隠れ、見るからに縞模様の猛虎となった。国王や臣下たちの普通の目には、その虎はこう見えた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「真身隱在殿上，真個變作」は三蔵の本来の姿が見えなくなり、虎の姿を現すものとして訳した。幻視だけか肉体の変化か、術の仕組みを本文以上に説明しない。黒眼定身法を別版の名称へ改めていない。"
- "id": "xy-ch30-016"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": "白額圓頭，花身電目。四隻蹄，挺直崢嶸；二十爪，鉤彎鋒利。鋸牙包口，尖耳連眉。獰猙壯若大貓形，猛烈雄如黃犢樣。剛鬚直直插銀條，刺舌騂騂噴惡氣。果然是隻猛斑斕，陣陣威風吹寶殿。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    白い額、丸い頭。縞の体に、稲妻の目。四つの脚は高くまっすぐ立ち、二十の爪は鋭く鉤に曲がる。
    鋸のような歯が口を囲み、とがった耳は眉につながる。大猫のような形は猛々しく、黄色い子牛のような体はたくましい。
    剛い髭は銀の棒のようにまっすぐ突き出し、とげのある赤い舌は恐ろしい息を吐く。
    まさしく獰猛な縞の虎、その威風がしきりに宝殿へ吹きつける。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "虎の爪の数は底本どおり二十とした。実在の虎の形態に合わせた訂正はしない。「騂騂」は赤い色の描写として訳した。"
- "id": "xy-ch30-017"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王一見，魄散魂飛。諕得那多官盡皆躲避。有幾個大膽的武將，領著將軍、校尉一擁上前，使各項兵器亂砍。這一番，不是唐僧該有命不死，就是二十個僧人也打為肉醬。此時幸有丁甲、揭諦、功曹、護教諸神暗在半空中護佑，所以那些人兵器皆不能打傷。眾臣嚷到天晚，才把那虎活活的捉了，用鐵繩鎖了，放在鐵籠裡，收於朝房之內。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 144
    "line_end": 144
  "translation_ja": "国王は一目見るなり、魂も飛び散るほど驚いた。官人たちもみな逃げ隠れした。何人かの胆の据わった武将が、将軍や校尉（こうい）を率いて押し寄せ、さまざまな武器でめった斬りにする。今度こそ、三蔵がまだ死ぬ定めではなかったからよかったものの、そうでなければ僧が二十人いても肉の味噌になっただろう。このとき幸いにも、丁甲（ていこう）、掲諦（ぎゃてい）、功曹（こうそう）、護教の神々が、ひそかに空中から守っていた。それゆえ人々の武器は、三蔵を傷つけられなかった。臣下たちは日暮れまで騒ぎ立て、ようやく虎を生け捕りにし、鉄の鎖でつないで鉄の檻へ入れ、朝房（ちょうぼう）に収めた。"
  "translation_status": "reviewed"
- "id": "xy-ch30-018"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王卻傳旨，教光祿寺大排筵宴，謝駙馬救拔之恩；不然，險被那和尚害了。當晚眾臣朝散，那妖魔進了銀安殿。又選十八個宮娥綵女，吹彈歌舞，勸妖魔飲酒作樂。那怪物獨坐上席，左右排列的都是那艷質嬌姿。你看他受用飲酒，至二更時分，醉將上來，忍不住胡為：跳起身，大笑一聲，現了本相，陡發兇心，伸開簸箕大手，把一個彈琵琶的女子抓將過來，扢咋的把頭咬了一口。嚇得那十七個宮娥，沒命的前後亂跑亂藏。你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    国王は光禄寺（こうろくじ）に大宴を用意させ、救ってくれた駙馬の恩に報いるよう命じた。そうでなければ、危うくあの和尚に害されるところだった、というのである。夕方、臣下たちが退出すると、黄袍怪は銀安殿（ぎんあんでん）へ入った。さらに十八人の宮女が選ばれ、笛や弦を奏で、歌い踊って、妖怪に酒を勧めて楽しませた。黄袍怪は一人上座に座り、左右にはあでやかで美しい女たちが並んだ。
    好き放題に飲み、二更（にこう）のころには酔いが回って、もう乱暴な振る舞いを抑えられなかった。飛び上がって大笑いすると、元の姿を現し、にわかに凶暴な心を起こす。箕ほどもある手を伸ばして、琵琶を弾いていた女を引き寄せ、がぶりと頭へ噛みついた。残りの十七人の宮女は恐怖に、命からがら前後へ逃げ惑い、隠れようとした。見れば、
  "translation_status": "reviewed"
- "id": "xy-ch30-019"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": "宮娥悚懼，綵女忙驚。宮娥悚懼，一似雨打芙蓉籠夜雨；綵女忙驚，就如風吹芍藥舞春風。捽碎琵琶顧命，跌傷琴瑟逃生。出門那分南北，離殿不管西東。磕損玉面，撞破嬌容。人人逃命走，各各奔殘生。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    宮女はおののき、侍女はうろたえる。宮女のおののく姿は、夜の雨に包まれ、打たれる蓮のよう。侍女の慌てる姿は、春風に吹かれ、揺れ踊るシャクヤクのよう。
    命惜しさに琵琶を落として砕き、生き延びようと琴や瑟（しつ）を落として壊す。門を出るにも南北の区別なく、殿を離れるにも東西など構わない。
    玉のような顔を打ち、あでやかな容貌を傷つける。一人残らず命を守って逃げ出し、誰もが残る命をつなごうと駆ける。
  "translation_status": "reviewed"
- "id": "xy-ch30-020"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那些人出去，又不敢吆喝。夜深了，又不敢驚駕。都躲在那短牆檐下，戰戰兢兢不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 150
    "line_end": 150
  "translation_ja": "女たちは外へ逃れたものの、大声を出すこともできなかった。夜も深く、国王を驚かせるのを恐れたのである。みな低い塀の軒下に隠れ、ぶるぶる震えていた。その話は、ひとまず置こう。"
  "translation_status": "reviewed"
- "id": "xy-ch30-021"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那怪物坐在上面，自斟自酌。喝一盞，扳過人來，血淋淋的啃上兩口。他在裡面受用，外面人盡傳道：「唐僧是個虎精。」亂傳亂嚷，嚷到金亭館驛。此時驛裡無人，止有白馬在槽上吃草吃料。他本是西海小龍王，因犯天條，鋸角退鱗，變白馬，馱唐僧往西方取經。忽聞人講唐僧是個虎精，他也心中暗想道：「我師父分明是個好人，必然被怪把他變做虎精，害了師父。怎的好？怎的好？大師兄去得久了，八戒、沙僧又無音信。」他只捱到二更時分，卻才跳將起來道：「我今若不救唐僧，這功果休矣，休矣！」他忍不住頓絕韁繩，抖鬆鞍轡，急縱身，忙顯化，依然化作龍。駕起烏雲，直上九霄空裡觀看。有詩為證，詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    黄袍怪は上座で、手酌で酒を飲んでいた。一杯飲むたび、女の体を引き寄せて、血を滴らせながら二口ほどかじる。中でそんな楽しみにふけっているあいだ、外の人々は口々に言いふらしていた。外の人々「唐の和尚は虎の妖怪だ。」
    噂は騒がしく広がり、金亭館駅（きんていかんえき）まで届いた。そのとき駅館には誰もおらず、竜馬（りゅうめ）だけが白馬の姿で、飼い葉桶の草や飼料を食べていた。この馬はもと、西海（さいかい）の小竜王（しょうりゅうおう）だった。天の法に背いたため、角を鋸で落とされ鱗を脱ぎ、白馬に変わって、経を求める三蔵を乗せて西へ向かっていたのである。
    三蔵が虎の妖怪だという噂を耳にすると、竜馬はひそかに考えた。竜馬は心の中で言った。「お師匠さまは、どう見ても善いお方だ。きっと妖怪が虎の姿に変え、陥れたに違いない。どうしよう、どうしよう。一番上の兄弟子が去ってから、もう久しい。八戒（はっかい）も沙悟浄も音沙汰がない。」
    竜馬は二更になるまで耐えていたが、ついに跳び上がって言った。竜馬「今、三蔵さまをお救いしなければ、この修行の功果（くか）も終わりだ、終わりだ！」
    こらえきれず手綱を引きちぎり、鞍や轡を振り落とすと、急ぎ身を躍らせて変化し、元の竜の姿となった。黒雲に乗って高い空へまっすぐ上がり、様子をうかがう。このありさまを示す詩がある。詩にいう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "竜馬の来歴は本回の「鋸角退鱗」を、角を鋸で落とされ鱗を脱ぐと訳した。第15回の変身の描写と独自に整合させない。人肉を食べる黄袍怪の場面と、二更まで待つ竜馬の場面の時刻を、単一の連続時計へ訂正しない。"
- "id": "xy-ch30-022"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    三藏西來拜世尊，途中偏有惡妖氛。
    今宵化虎災難脫，白馬垂韁救主人。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 153
    "line_end": 154
  "translation_ja": |-
    三蔵は世尊（せそん）を拝すべく西へ来たのに、道中には悪しき妖気が立ちこめる。
    今宵は虎に変えられ、災いを逃れがたく、白馬は手綱を垂らして主人を救いにゆく。
  "translation_status": "reviewed"
- "id": "xy-ch30-023"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小龍王在半空裡，只見銀安殿內燈燭輝煌。原來那八個滿堂紅上點著八根蠟燭。低下雲頭，仔細看處，那妖魔獨自個在上面逼法的飲酒吃人肉哩。小龍笑道：「這廝不濟，走了馬腳，識破風汛，屣匾秤鉈了。吃人可是個長進的？卻不知我師父下落何如，倒遇著這個潑怪。且等我去戲他一戲，若得手，拿住妖精，再救師父不遲。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 156
    "line_end": 156
  "translation_ja": "竜の姿の竜馬が空中から見ると、銀安殿の中は灯火が明々と輝いていた。八基の満堂紅（まんどうこう）に、八本の蝋燭がともされているのだった。雲を低くしてよく見ると、黄袍怪が一人上座に座り、くちゃくちゃと音を立てて、酒を飲み人肉を食らっている。竜馬は笑った。竜馬「だめな奴だ。尻尾を出して、からくりを見破られ、正体がすっかり割れたぞ。人を食うようでは、何の進歩があろう。お師匠さまの行方は知れぬまま、先にこの悪党に出くわした。ひとつからかってやろう。うまく妖怪を捕らえられれば、それから師をお救いしても遅くはない。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「屣匾秤鉈」は教育部《重編國語辭典修訂本》「躧匾稱鉈」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=104993&la=0&powerMode=0）が本回の句を例に「秘密を見破るたとえ」とするため、正体がすっかり割れる意に訳した。底本の異字は原文欄へそのまま保存。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「逼法」は擬声表現として、飲食する音を「くちゃくちゃ」と訳した。日本語の擬音の選択には解釈の幅がある。"
- "id": "xy-ch30-024"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好龍王，他就搖身一變，也變做個宮娥，真個身體輕盈，儀容嬌媚。忙移步走入裡面，對妖魔道聲萬福：「駙馬啊，你莫傷我性命，我來替你把盞。」那妖道：「斟酒來。」小龍接過壺來，將酒斟在他盞中，酒比鍾高出三五分來，更不漫出。這是小龍使的「逼水法」。那怪見了不識，心中喜道：「你有這般手段？」小龍道：「還斟得有幾分高哩。」那怪道：「再斟上，再斟上。」他舉著壺，只情斟，那酒只情高，就如十三層寶塔一般，尖尖滿滿，更不漫出些須。那怪物伸過嘴來，吃了一鍾；扳著死人，吃了一口。道：「會唱麼？」小龍道：「也略曉得些兒。」依腔韻唱了一個小曲，又奉了一鍾。那怪道：「你會舞麼？」小龍道：「也略曉得些兒，但只是素手，舞得不好看。」那怪揭起衣服，解下腰間所佩寶劍，掣出鞘來，遞與小龍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    さすがは竜馬、身を揺すって一変すると、宮女の姿になった。身のこなしは軽やかで、顔立ちは愛らしい。急いで中へ歩み入り、黄袍怪へ万福の礼をして言った。竜馬「駙馬さま、どうか私をお殺しにならないでください。お酌にまいりました。」
    黄袍怪「酒を注げ。」
    竜馬は酒壺を受け取り、杯へ注いだ。酒は杯の縁より三分（ぶ）から五分ほど高く盛り上がったが、それでもこぼれなかった。これが竜馬の使う逼水法（ひつすいほう）である。黄袍怪はその術と知らず、喜んで言った。黄袍怪「お前に、こんな腕があったのか。」
    竜馬「まだ、もう幾分か高く注げます。」
    黄袍怪「もっと注げ、もっと。」
    竜馬は壺を上げ、どんどん注いだ。酒もどんどん高くなり、十三層の宝塔のように先がとがって盛り上がったが、わずかもこぼれない。黄袍怪は口を差し伸べて一杯を飲み、死体を引き寄せて一口食った。黄袍怪「歌えるか。」
    竜馬「少しは心得ております。」
    節や調べに合わせて小唄を一曲歌い、また一杯を差し出した。黄袍怪「舞はできるか。」
    竜馬「それも少しは。ただ、手ぶらでは、踊っても見栄えがいたしません。」
    黄袍怪は衣をまくり、腰に帯びていた宝剣を解くと、鞘から抜いて竜馬へ渡した。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "黄袍怪が竜馬へ渡す得物はこの段落末で「寶劍」、次段落では「刀」となる。原文は統一せず、訳でも剣を渡し、その同じ得物を次段落で刀と呼ぶ表記の揺れを残した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「三五分」は三分ほどから五分ほどの高さを表すものとして原単位を保持し、現代の長さに換算しない。"
- "id": "xy-ch30-025"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小龍接了刀，就留心，在那酒席前上三下四，左五右六，丟開了花刀法。怪看得眼咤。小龍丟了花字，望妖精劈一刀來。好怪物，側身躲過，慌了手腳，舉起一根滿堂紅，架住寶刀。那滿堂紅原是熟鐵打造的，連柄有八九十斤。兩個出了銀安殿，小龍現了本相，駕起雲頭，與那妖魔在那半空中相殺。這一場，黑地裡好殺。怎見得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    竜馬はその刀を受け取ると、機会を狙いながら、酒席の前で上へ三度、下へ四度、左へ五度、右へ六度、華やかな刀舞を繰り広げた。黄袍怪は目を見張って見ていた。竜馬はひと回しして、妖怪へ一刀を斬りつけた。
    さすがの黄袍怪は横へかわしたが、慌てふためき、満堂紅を一本つかみ上げて、宝刀を受け止めた。この満堂紅は鍛えた鉄で作られ、柄まで合わせて八、九十斤もあった。二人は銀安殿から外へ出た。竜馬は竜の姿に戻り、雲へ飛び乗って、黄袍怪と空中で斬り結んだ。暗闇の中の、見事な戦いだった。どんなありさまかといえば、
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「上三下四、左五右六」は刀舞の上下左右の動きを数で飾る表現として、三・四・五・六を残した。「眼咤」は目を見張る様子に採ったが、別字へ補訂していない。"
- "id": "xy-ch30-026"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": "那一個是碗子山生成的怪物，這一個是西洋海罰下的真龍。一個放毫光，如噴白電；一個生銳氣，如迸紅雲。一個好似白牙老象走人間，一個就如金爪狸貓飛下界。一個是擎天玉柱，一個是架海金梁。銀龍飛舞，黃鬼翻騰。左右寶刀無怠慢，往來不歇滿堂紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    あちらは碗子山で生まれた化け物、こちらは西の海から罰せられて下った真の竜。
    一方は白い稲妻を噴くように光を放ち、一方は赤い雲がほとばしるように鋭気を生む。
    一方は白い牙の老象が人の世を行くよう、一方は金の爪の山猫が下界へ舞い降りるよう。
    一方は天を支える玉の柱、一方は海に渡す金の梁。
    銀の竜は飛び舞い、黄色い鬼は跳び返る。宝刀は左右へ動いて隙もなく、往来する満堂紅も休まない。
  "translation_status": "reviewed"
- "id": "xy-ch30-027"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個在雲端裡戰夠八九回合，小龍的手軟觔麻，老魔的身強力壯。小龍抵敵不住，飛起刀去，砍那妖怪。妖怪有接刀之法，一隻手接了寶刀，一隻手拋下滿堂紅便打。小龍措手不及，被他把後腿上著了一下。急慌慌按落雲頭，多虧了御水河救了性命，小龍一頭鑽下水去。那妖魔趕來尋他不見，執了寶刀，拿了滿堂紅，回上銀安殿，照舊吃酒睡覺不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    雲の上で八、九合も戦うと、竜馬は手に力が入らず、筋もしびれてきたが、黄袍怪はなお体が強く、力に満ちていた。竜馬は抗しきれず、刀を飛ばして妖怪を斬ろうとした。ところが黄袍怪には、飛ぶ刀を受ける術があった。片手で宝刀をつかみ、もう片方の手で満堂紅を振り下ろした。竜馬は防ぐ間もなく、後脚へ一撃を受けた。
    慌てて雲を降りたが、命が助かったのは御水河（ぎょすいが）のおかげである。頭から水中へ潜り込んだのだ。黄袍怪は追いかけてきたが見つけられず、宝刀と満堂紅を手に銀安殿へ戻ると、また酒を飲んで寝てしまった。そのことは、ひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch30-028"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那小龍潛於水底，半個時辰聽不見聲息，方才咬著牙，忍著腿疼跳將起去。踏著烏雲，徑轉館驛，還變作依舊馬匹，伏於槽下。可憐渾身是水，腿有傷痕。那時節："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 164
    "line_end": 164
  "translation_ja": "竜馬は水底に身をひそめ、半時辰（じしん）ものあいだ物音がしないのを待ってから、歯を食いしばり、脚の痛みに耐えて跳び上がった。黒雲に乗って駅館へまっすぐ戻り、再び元の白馬の姿となって、飼い葉桶の下に伏せた。哀れにも全身はずぶ濡れ、脚には傷跡があった。まさにこのとき、"
  "translation_status": "reviewed"
- "id": "xy-ch30-029"
  "section_id": "chapter-30"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    意馬心猿都失散，金公木母盡凋零。
    黃婆傷損通分別，道義消疏怎得成！
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 166
    "line_end": 167
  "translation_ja": |-
    意馬（いば）も心猿（しんえん）も、みな離れ離れとなり、金公（きんこう）も木母（もくぼ）も、ことごとくしおれて衰える。
    黄婆（こうば）も傷つき損なわれ、すべてが別れ散る。道と義がかくも薄れて、どうして成就があろう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "意馬・心猿・金公・木母・黄婆は内丹と修心の象徴語として保持した。「黃婆傷損通分別」の「通分別」はみな離別・分散している意に採る。具体的な傷の程度や新たな事件は補っていない。人物への重なりを注で示すが、通常名の交替には用いない。"
- "id": "xy-ch30-030"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言三藏逢災，小龍敗戰。卻說那豬八戒從離了沙僧，一頭藏在草科裡，拱了一個豬渾塘。這一覺，直睡到半夜時候才醒。醒來時，又不知是甚麼去處。摸摸眼，定了神思，側耳才聽。噫！正是那山深無犬吠，野曠少雞鳴。他見那星移斗轉，約莫有三更時分，心中想道：「我要回救沙僧，誠然是『單絲不線，孤掌難鳴』。罷罷罷，我且進城去見了師父，奏准當今，再選些驍勇人馬，助著老豬明日來救沙僧罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 168
    "line_end": 168
  "translation_ja": "三蔵の災難と竜馬の敗戦は、ひとまず置こう。八戒は沙悟浄と別れ、一目散に草の茂みへ隠れると、鼻先で土を掘って、豚の寝ころぶ泥穴を作っていた。そのままぐっすり眠り、真夜中になってようやく目を覚ました。目覚めても、どこにいるのか分からない。目をこすり、気を落ち着けて、耳を澄ませた。ああ、山が深くて犬の声もなく、野は広く、鶏の声さえほとんどない。星が移り北斗（ほくと）が巡る様子から、三更（さんこう）のころと見当をつけ、心の中で考えた。八戒は心の中で言った。「沙悟浄を助けに戻ろうにも、『一本の糸では縄にならず、片手だけでは手は鳴らない』というものだ。まあいい、まず都へ行ってお師匠さまに会おう。今の王様のお許しを頂き、勇敢な兵馬をもう少し選んでもらえば、明日は俺を助けて沙悟浄を救いに行ける。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「豬渾塘」は豚が鼻で土を掘って転がる泥穴と解した。底本の「渾」を「混」「溷」等へ訂正せず、草地の中に独立した池があるとは補わない。"
- "id": "xy-ch30-031"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子急縱雲頭，徑回城裡。半霎時，到了館驛。此時人靜月明。兩廊下尋不見師父，只見白馬睡在那廂，渾身水濕，後腿有盤子大小一點青痕。八戒失驚道：「雙晦氣了。這亡人又不曾走路，怎麼身上有汗，腿有青痕？想是歹人打劫師父，把馬打壞了。」那白馬認得是八戒，忽然口吐人言，叫聲：「師兄。」這獃子嚇了一跌，扒起來，往外要走。被白馬探探身，一口咬住皂衣，道：「哥啊，你莫怕我。」八戒戰兢兢的道：「兄弟，你怎麼今日說起話來了？你但說話，必有大不祥之事。」小龍道：「你知師父有難麼？」八戒道：「我不知。」小龍道：「你是不知。你與沙僧在皇帝面前弄了本事，思量拿倒妖魔，請功求賞。不想妖魔本領大，你們手段不濟，禁他不過。好道著一個回來，說個信息是，卻更不聞音。那妖精變做一個俊俏文人，撞入朝中，與皇帝認了親眷。把我師父變作一個斑斕猛虎，見被眾臣捉住，鎖在朝房鐵籠裡面。我聽得這般苦惱，心如刀割。你兩日又不在不知，恐一時傷了性命，只得化龍身去救，不期到朝裡，又尋不見師父。及到銀安殿外，遇見妖精，我又變做個宮娥模樣，哄那怪物。那怪叫我舞刀他看，遂爾留心，砍他一刀。早被他閃過，雙手舉個滿堂紅，把我戰敗。我又飛刀砍去，他又把刀接了，捽下滿堂紅，把我後腿上著了一下。故此鑽在御水河，逃得性命。腿上青是他滿堂紅打的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    八戒は急いで雲へ飛び乗り、都へまっすぐ戻った。ほんのしばらくで駅館へ着いた。そのとき人の気配はなく、月は明るかった。左右の廊下を探しても師は見当たらず、白馬だけがあちらで寝ていた。全身は濡れ、後脚には皿ほどの青い痣がある。八戒は驚いて言った。八戒「弱り目に祟り目だ。このろくでなし、歩きもしていないのに、なぜ汗をかいて脚に青痣がある。悪党がお師匠さまを襲って、馬まで痛めつけたのだろうか。」
    竜馬は八戒と分かると、不意に人の言葉で呼びかけた。竜馬「兄弟子。」
    八戒は驚いて転び、起き上がると外へ逃げようとした。竜馬は身を伸ばし、黒い僧衣に噛みついて引き止めた。竜馬「兄貴、私を怖がらないでください。」
    八戒は震えながら言った。八戒「兄弟、どうして今日は口を利き始めたんだ。お前が話すからには、何かひどく不吉なことが起きたに違いない。」
    竜馬「お師匠さまが難に遭われたのをご存じですか。」
    八戒「知らない。」
    竜馬「そうでしょうとも。あなたと沙悟浄は皇帝の前で腕をひけらかし、妖魔を捕らえて手柄を立て、褒美をもらおうと思った。ところが妖怪の力は大きく、あなたたちの腕では敵わなかった。せめて一人は戻り、知らせてくれてもよかったのに、まるで音沙汰がない。妖怪は美しい文人に化け、朝廷へ入り込み、皇帝と親族の名乗りを交わしました。そしてお師匠さまを縞の猛虎に変え、今は臣下たちに捕らえられ、朝房の鉄の檻へ入れられているのです。
    私はその災難を聞き、心を刀で切られるようでした。あなたもこの二日いないまま、何も知らない。いつ命を落とされるかと案じ、仕方なく竜の姿に戻って救いに行きましたが、朝廷へ行っても師が見当たりませんでした。銀安殿の外まで来ると妖怪に出くわしたので、今度は宮女の姿に変じて欺いたのです。妖怪は刀舞を見せろと言いました。そこで機会をうかがって一太刀斬りつけましたが、すばやくかわされ、満堂紅を両手で振るわれて、戦いに敗れました。さらに刀を飛ばして斬ろうとしましたが、それも受け止められ、満堂紅を振り下ろされて、後脚に一撃を受けたのです。そこで御水河へ潜り、ようやく命を逃れました。脚の青痣は、あの満堂紅で打たれた跡なのです。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "竜馬の「你兩日又不在不知」は底本の「兩日」を二日として保持した。前後の短い時系列とずれる可能性があるが、「兩個」等に訂正しない。竜馬の語る両手の燭台操作と先の地の文の片手の刀受けも、独自に一本化していない。"
- "id": "xy-ch30-032"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒聞言道：「真個有這樣事？」小龍道：「莫成我哄你了？」八戒道：「怎的好？怎的好？你可掙得動麼？」小龍道：「我掙得動便怎的？」八戒道：「你掙得動，便掙下海去罷。把行李等老豬挑去高老莊上，回爐做女婿去呀。」小龍聞說，一口咬住他直裰子，那裡肯放，止不住眼中滴淚道：「師兄啊，你千萬休生懶惰。」八戒道：「不懶惰便怎麼？沙兄弟已被他拿住，我是戰不過他，不趁此散火，還等甚麼？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    八戒は聞いて言った。八戒「本当にそんなことがあったのか。」
    竜馬「まさか、あなたをだますと思うのですか。」
    八戒「どうしたらいい、どうしたらいいんだ。お前、まだ動けるか。」
    竜馬「動けたら、どうするのです。」
    八戒「動けるなら、何とか海へ帰れ。荷物は俺が高老荘（こうろうそう）へ担いでいって、もう一度婿入りをやり直すさ。」
    竜馬は聞くなり、八戒の直裰（ちょくたつ）に噛みつき、決して放そうとしなかった。涙をこぼしながら言った。竜馬「兄弟子、どうか投げやりにならないでください。」
    八戒「投げやりにならず、どうする。沙悟浄はすでに捕まり、俺には敵わないんだ。今のうちに一行を解散せず、何を待つというんだ。」
  "translation_status": "reviewed"
- "id": "xy-ch30-033"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "小龍沉吟半晌，又滴淚道：「師兄啊，莫說散火的話。若要救得師父，你只去請個人來。」八戒道：「教我請誰麼？」小龍道：「你趁早兒駕雲回上花果山，請大師兄孫行者來。他還有降妖的大法力，管教救了師父，也與你我報得這敗陣之仇。」八戒道：「兄弟，另請一個兒便罷了。那猴子與我有些不睦。前者在白虎嶺上，打殺了那白骨夫人，他怪我攛掇師父念緊箍兒咒。我也只當耍子，不想那老和尚當真的念起來，就把他趕逐回去。他不知怎麼樣的惱我，他也決不肯來。倘或言語上略不相對，他那哭喪棒又重，假若不知高低，撈上幾下，我怎的活得成麼？」小龍道：「他決不打你。他是個有仁有義的猴王。你見了他，且莫說師父有難，只說：『師父想你哩。』把他哄將來。到此處，見這樣個情節，他必然不忿，斷乎要與那妖精比併，管情拿得那妖精，救得我師父。」八戒道：「也罷，也罷。你倒這等盡心，我若不去，顯得我不盡心了。我這一去，果然行者肯來，我就與他一路來了；他若不來，你卻也不要望我，我也不來了。」小龍道：「你去，你去，管情他來也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    竜馬はしばらく考え込み、また涙を落として言った。竜馬「兄弟子、解散などと言わないでください。お師匠さまを救いたければ、ただ一人、迎えに行っていただきたい方がいます。」
    八戒「誰を迎えに行けというんだ。」
    竜馬「急いで雲に乗って花果山（かかざん）へ戻り、一番上の兄弟子、孫行者（そんぎょうじゃ）こと悟空（ごくう）兄貴を迎えてきてください。あの方には妖怪を降す大きな法力があります。きっとお師匠さまを救い、私たちの敗戦の恨みも晴らしてくれます。」
    八戒「兄弟、ほかの誰かにしてくれよ。あの猿と俺は少し仲が悪い。先ごろ白虎嶺（びゃっこれい）で白骨夫人（はっこつふじん）を打ち殺したとき、俺がお師匠さまをけしかけて緊箍児の呪（きんこじのじゅ）を唱えさせたと、あいつは怒った。俺はほんの冗談のつもりだったのに、お師匠さまが本気で唱えて、あいつを追い返してしまった。俺をどれほど恨んでいるか分からないし、決して来ようとはしないだろう。もし少しでも言葉が気に障れば、あいつのあの葬式棒（そうしきぼう）は重いからな、加減を忘れて何発か食らったら、俺が生きていられるものか。」
    竜馬「決してあなたを打ちはしません。あの方は仁も義もある猿の王です。会ったら、師が難に遭ったとはまだ言わず、『お師匠さまが会いたがっている』と言って、誘って連れてきてください。ここへ来てこの有様を見れば、きっと怒り、必ず妖怪と勝負します。妖怪を捕らえ、お師匠さまを救ってくれることは請け合いです。」
    八戒「よし、よし。お前がそこまで心を尽くしているのに、俺が行かなかったら、俺だけ不忠義に見える。行ってみて、悟空が来るというなら、一緒に戻るさ。来ないというなら、俺のことも待たないでくれ。俺も戻らないからな。」
    竜馬「どうぞ行ってください。きっと来てくださいます。」
  "translation_status": "reviewed"

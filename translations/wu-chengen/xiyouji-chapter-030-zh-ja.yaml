  "known_gaps":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-003"
    "description_ja": "「更無半點兒說話」は非難・文句がなかった意に採り、誰が発した言葉かは日本語で新たに確定しない。公主の否認と黄袍怪の疑いは、その後の出来事に照らして勝手に真実へ改めない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-005"
    "description_ja": "「婦人家水性」は原文の語り手による女性への定型的な評言として訳出した。現代の事実認定や百花羞の自発的な同意へ読み替えず、直前の暴行と恐怖を省いていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-006"
    "description_ja": "底本は公主の「你去不得」の閉じ括弧が『』の片側になっている。原文欄は訂正せず、訳文では百花羞と黄袍怪の問答として引用符を整えた。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-008"
    "description_ja": "「子建」は曹植の字。「潘安擲果」は美男子潘岳へ女たちが果物を投げ贈った故事と解した（教育部「潘安再世」「擲果」、コトバンク「曹植」を参照）。「玉羅褶」は美しい薄絹の上衣とし、褶の日本語読みは語構成に基づく推定に留める。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-011"
    "description_ja": "011末〜013の黄袍怪の長い発話は、012の公主の詩という入れ子の引用を挟んで続く。黄袍怪の語る救出・結婚と過去の公主の言葉は、語り手が明示する作り話である。引用内の百花羞を現場の発話者としてラベル付けしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-015"
    "description_ja": "「真身隱在殿上，真個變作」は三蔵の本来の姿が見えなくなり、虎の姿を現すものとして訳した。幻視だけか肉体の変化か、術の仕組みを本文以上に説明しない。黒眼定身法を別版の名称へ改めていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-016"
    "description_ja": "虎の爪の数は底本どおり二十とした。実在の虎の形態に合わせた訂正はしない。「騂騂」は赤い色の描写として訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-021"
    "description_ja": "竜馬の来歴は本回の「鋸角退鱗」を、角を鋸で落とされ鱗を脱ぐと訳した。第15回の変身の描写と独自に整合させない。人肉を食べる黄袍怪の場面と、二更まで待つ竜馬の場面の時刻を、単一の連続時計へ訂正しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-023"
    "description_ja": "「屣匾秤鉈」は教育部《重編國語辭典修訂本》「躧匾稱鉈」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=104993&la=0&powerMode=0）が本回の句を例に「秘密を見破るたとえ」とするため、正体がすっかり割れる意に訳した。底本の異字は原文欄へそのまま保存。 「逼法」は擬声表現として、飲食する音を「くちゃくちゃ」と訳した。日本語の擬音の選択には解釈の幅がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-024"
    "description_ja": "黄袍怪が竜馬へ渡す得物はこの段落末で「寶劍」、次段落では「刀」となる。原文は統一せず、訳でも剣を渡し、その同じ得物を次段落で刀と呼ぶ表記の揺れを残した。 「三五分」は三分ほどから五分ほどの高さを表すものとして原単位を保持し、現代の長さに換算しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-025"
    "description_ja": "「上三下四、左五右六」は刀舞の上下左右の動きを数で飾る表現として、三・四・五・六を残した。「眼咤」は目を見張る様子に採ったが、別字へ補訂していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-029"
    "description_ja": "意馬・心猿・金公・木母・黄婆は内丹と修心の象徴語として保持した。「黃婆傷損通分別」の「通分別」はみな離別・分散している意に採る。具体的な傷の程度や新たな事件は補っていない。人物への重なりを注で示すが、通常名の交替には用いない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-030"
    "description_ja": "「豬渾塘」は豚が鼻で土を掘って転がる泥穴と解した。底本の「渾」を「混」「溷」等へ訂正せず、草地の中に独立した池があるとは補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-031"
    "description_ja": "竜馬の「你兩日又不在不知」は底本の「兩日」を二日として保持した。前後の短い時系列とずれる可能性があるが、「兩個」等に訂正しない。竜馬の語る両手の燭台操作と先の地の文の片手の刀受けも、独自に一本化していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-033"
    "description_ja": "八戒の「哭喪棒」は悟空の棒への侮称とし、葬列の棒にたとえた悪口を「葬式棒」と訳した。別の新しい武器の名とはしない。八戒の言い訳や竜馬が勧める嘘を、語り手の事実認定に変えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-035"
    "description_ja": "同段落の猿の数は、初めが千二百余り、後が千二、三百。原文の数え方の差を保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-036"
    "description_ja": "「夷人」は悟空がわざとよそ者扱いする「異国人」と訳した。特定の現代民族や人種へ結びつけない。「腳色手本」は経歴と名を記して上位者へ差し出す書面。通常の日本語の「手本」と意味が異なる。 八戒の「兄弟也做了幾年」は底本の表現どおり何年も兄弟として付き合ったと訳した。他の回の時系列に合わせて補訂しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-037"
    "description_ja": "三蔵が弟子を呼んだという八戒の作り話は、その場の虚言として保持し、事実の出来事へ書き換えない。 悟空が八戒の手を取る動作に、すでに立っている八戒を再び立たせる動作は補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-038"
    "description_ja": "「概眾小妖」は小妖たちがみな後ろに従う意に採った。底本の「概」を別の字へ補訂しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "segment_ids":
    - "xy-ch30-039"
    "description_ja": "「玉女洗頭盆」は仙女の洗髪の水盤という詩的な山景表現として扱い、特定の現存地形と断定しない。天河とつながる上下の像、清濁による仙境の生成を保持した。 本文の欠落ではなく解釈・校訂上の留保。"

    "line_end": 178
  "translation_ja": "二人は手を取り合い、小妖たちをぞろぞろ後ろに従えて、花果山の頂上へ登った。見事な山である。悟空が戻ってきてからの数日で、昔の姿を取り戻し、新しいように整えられていた。見れば、"

- "id": "xy-ch30-034"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真個獃子收拾了釘鈀，整束了直裰，跳將起去，踏著雲，徑往東來。這一回，也是唐僧有命。那獃子正遇順風，撐起兩個耳朵，好便似風篷一般，早過了東洋大海，按落雲頭。不覺的太陽星上，他卻入山尋路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 172
    "line_end": 172
  "translation_ja": "八戒は本当に釘鈀（ていは）を取りまとめ、直裰を整えると、跳び上がって雲に乗り、東へまっすぐ向かった。今度もまた、三蔵の命運は尽きていなかったのである。ちょうど追い風が吹き、八戒が両耳を広げると、まるで帆のようになった。早くも東の大海を渡り終え、雲を降りた。いつしか太陽が昇るころになり、山へ入って道を探した。"
  "translation_status": "reviewed"
- "id": "xy-ch30-035"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正行之際，忽聞得有人言語。八戒仔細看時，看來是行者在山凹裡，聚集群妖。他坐在一塊石頭崖上，面前有一千二百多猴子，分序排班，口稱：「萬歲，大聖爺爺。」八戒道：「且是好受用，且是好受用，怪道他不肯做和尚，只要來家哩，原來有這些好處，許大的家業，又有這多的小猴伏侍。若是老豬有這一座山場，也不做甚麼和尚了。如今既到這裡，卻怎麼好？必定要見他一見是。」那獃子有些怕他，又不敢明明的見他，卻往草崖邊溜阿溜的，溜在那一千二三百猴子當中擠著，也跟那些猴子磕頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    歩いていくうち、ふと人の話す声が聞こえた。八戒がよく見ると、悟空が山の窪地に妖怪たちを集めている。岩の崖の上に腰掛け、その前には千二百余りの猿が、順序よく列を作って並んでいた。猿たちは声を揃えた。猿たち「大聖（たいせい）さま、万歳！」
    八戒は言った。八戒「なんと気楽な、なんといい身分だ。和尚をやめて家へ戻りたがるのも、無理はない。こんないいことがあるんだものな。これほどの身代に、これほどたくさんの小猿が仕えている。俺だってこんな山を一つ持っていたら、和尚なんかしていないさ。さて、ここまで来たからには、どうしよう。どうあっても一度は会わなければ。」
    八戒は少し怖くて、正面切って会いには行けなかった。草の生えた崖の脇を、そろりそろりと近づき、千二、三百匹の猿の中へ紛れ込むと、猿たちと一緒に頭を地につけた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "同段落の猿の数は、初めが千二百余り、後が千二、三百。原文の数え方の差を保持した。"
- "id": "xy-ch30-036"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不知孫大聖坐得高，眼又乖滑，看得他明白，便問：「那班部中亂拜的是個夷人，是那裡來的？拿上來。」說不了，那些小猴一窩蜂，把個八戒推將上來，按倒在地。行者道：「你是那裡來的夷人？」八戒低著頭道：「不敢，承問了。不是夷人，是熟人，熟人。」行者道：「我這大聖部下的群猴，都是一般模樣。你這嘴臉生得各樣，相貌有些雷堆，定是別處來的妖魔。既是別處來的，若要投我部下，先來遞個腳色手本，報了名字，我好留你在這隨班點扎。若不留你，你敢在這裡亂拜？」八戒低著頭，拱著嘴道：「不羞，就拿出這副嘴臉來了。我和你兄弟也做了幾年，又推認不得，說是甚麼夷人。」行者笑道：「擡起頭來我看。」那獃子把嘴往上一伸道：「你看麼，你認不得我，好道認得嘴耶。」行者忍不住笑道：「豬八戒。」他聽見一聲叫，就一轂轆跳將起來道：「正是，正是，我是豬八戒。」他又思量道：「認得就好說話了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    だが悟空は高い所に座り、目も抜け目がない。八戒の姿をはっきり見て、尋ねた。悟空「あの列の中で、むやみに拝んでいる異国人は、どこから来た。ここへ連れてこい。」
    言い終わらぬうちに、小猿たちが蜂の群れのように押し寄せ、八戒を前へ押し出して地面へ伏せさせた。悟空「お前はどこから来た異国人だ。」
    八戒は頭を下げたまま言った。八戒「いや、お尋ねを頂きまして。異国の者ではありません。おなじみの者です、おなじみの。」
    悟空「この大聖の配下の猿どもは、みな同じ姿をしている。お前の顔は違うし、少々不格好だ。きっと別の土地から来た妖怪だろう。よそから来て俺の配下に加わりたいなら、まず経歴を書いた手本（しゅほん）を差し出し、名を告げるがよい。それを見て俺が留めてやれば、列に加わり点呼を受けられる。まだ留めるとも言わぬうちから、勝手にここで拝むとは何事だ。」
    八戒は頭を下げ、口を突き出した。八戒「よくも恥ずかしげもなく、そんな顔ができるな。俺たちは何年も兄弟として付き合ってきたのに、知らぬふりをして、異国人だの何だのと。」
    悟空は笑った。悟空「顔を上げて見せてみろ。」
    八戒は長い口を上へ伸ばした。八戒「ほら見ろよ。俺のことを忘れても、この口ぐらいは覚えているだろう。」
    悟空はこらえきれず笑った。悟空「猪八戒（ちょはっかい）。」
    名を呼ばれると、八戒はごろりと身を返して跳び起きた。八戒「そうだ、そうだ。俺は猪八戒だ。」
    八戒はまた、心の中で思った。「分かったのなら、話しやすくなったぞ。」
  "translation_status": "reviewed"
  "issues":

    "source_span":
      "start": 217
      "end": 457
      "exact": "「主公，微臣自幼兒好習弓馬，採獵為生。那十三年前，帶領家童數十，放鷹逐犬，忽見一隻斑斕猛虎，身馱著一個女子，往山坡下走。是微臣兜弓一箭，射倒猛虎，將女子帶上本莊，把溫水溫湯灌醒，救了他性命。因問他是那裡人家，他更不曾題『公主』二字。早說是萬歲的三公主，怎敢欺心，擅自配合？當得進上金殿，大小討一個官職榮身。只因他說是民家之女，才被微臣留在莊所。女貌郎才，兩相情願，故配合至此多年。當時配合之後，欲將那虎宰了，邀請諸親，卻是公主娘娘教且莫殺。其不殺之故，有幾句言詞，道得甚好，說道："
    "translation_span":
      "start": 397
      "end": 816
      "exact": |-
        黄袍怪「陛下、私は幼いころから弓馬を好み、狩猟で暮らしておりました。十三年前、数十人の家来を率い、鷹を放ち犬を追わせておりましたところ、縞模様の猛虎が一人の女を背に負い、山の斜面を下ってくるのが見えたのです。私が弓を引き絞り、一矢で虎を射倒して、女を屋敷へ連れ帰り、ぬるい湯や温かい汁を飲ませて意識を戻し、命を救いました。どこの家の方かと尋ねましたが、公主とは一言もおっしゃいません。初めから陛下の第三公主と分かっていれば、どうして心に背いて勝手に夫婦になりましょう。金殿へお送りし、大小いずれかの官職を頂いて身を立てるのが当然でした。けれど民家の娘だとおっしゃったので、屋敷へお留めしたのです。女は美しく男には才があり、双方心を寄せて、こうして長年連れ添ってまいりました。
        結ばれた後、あの虎を屠り、親類一同を招こうと思いましたところ、公主が、まだ殺してはならないとおっしゃいました。その理由を、大変見事な句にして、こう言われたのです。
  - "segment_id": "xy-ch30-012"
  - "segment_id": "xy-ch30-013"

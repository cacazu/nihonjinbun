    "message_ja": "「夷人」は悟空がわざとよそ者扱いする「異国人」と訳した。特定の現代民族や人種へ結びつけない。「腳色手本」は経歴と名を記して上位者へ差し出す書面。通常の日本語の「手本」と意味が異なる。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "八戒の「兄弟也做了幾年」は底本の表現どおり何年も兄弟として付き合ったと訳した。他の回の時系列に合わせて補訂しない。"
- "id": "xy-ch30-037"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「你不跟唐僧取經去，卻來這裡怎的？想是你衝撞了師父，師父也貶你回來了。有甚貶書，拿來我看。」八戒道：「不曾衝撞他，他也沒甚麼貶書，也不曾趕我。」行者道：「既無貶書，又不曾趕你，你來我這裡怎的？」八戒道：「師父想你，著我來請你的。」行者道：「他也不請我，他也不想我。他那日對天發誓，親筆寫了貶書，怎麼又肯想我，又肯著你遠來請我？我斷然也是不好去的。」八戒就地扯個謊，忙道：「委是想你，委是想你。」行者道：「他怎的想我來？」八戒道：「師父在馬上正行，叫聲『徒弟』，我不曾聽見，沙僧又推耳聾。師父就想起你來，說我們不濟，說你還是個聰明伶俐之人，常時聲叫聲應，問一答十。因這般想你，專專教我來請你的。萬望你去走走，一則不孤他仰望之心，二來也不負我遠來之意。」行者聞言，跳下崖來，用手攙住八戒道：「賢弟，累你遠來，且和我耍耍兒去。」八戒道：「哥啊，這個所在路遠，恐師父盼望去遲，我不耍子了。」行者道：「你也是到此一場，看看我的山景何如？」那獃子不敢苦辭，只得隨他走走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    悟空「三蔵に従って経を取りに行かず、こんな所へ何をしに来た。さては師匠を怒らせ、お前も追い返されたか。追放状があるなら、見せてみろ。」
    八戒「怒らせてもいないし、追放状もない。追い払われてもいないさ。」
    悟空「追放状もなく、追い払われてもいないなら、なぜここへ来た。」
    八戒「お師匠さまがお前を恋しがり、俺を迎えに遣わしたんだ。」
    悟空「あの人が俺を迎えに来させたり、恋しがったりするものか。あの日は天に誓い、自分の手で追放状を書いたのだ。どうしてまた俺を思い、お前を遠くまで迎えに遣わすものか。俺としても、断じて行くわけにはいかん。」
    八戒はその場で嘘を作り、急いで言った。八戒「本当に恋しがっているんだ、本当さ。」
    悟空「どう恋しがっていた。」
    八戒「お師匠さまが馬に乗って進みながら、『弟子よ』と呼んだんだ。俺は聞こえず、沙悟浄も耳が遠いふりをした。そこでお前を思い出し、俺たちは役に立たない、お前はやはり賢く気が利く奴だった、いつも呼べばすぐに返事をし、一つ尋ねれば十答えてくれた、とおっしゃった。そんなふうに思っているから、わざわざ俺を迎えに寄こしたんだよ。頼むから一度来てくれ。一つには師のお待ちになる心を裏切らず、もう一つには俺が遠路やって来た甲斐も立つ。」
    悟空は聞くと崖を跳び下り、八戒の手を取った。悟空「弟よ、遠路ご苦労だったな。ひとまず俺と遊んでいこう。」
    八戒「兄貴、ここは遠いんだ。お師匠さまがお待ちかねだし、帰りが遅くなると困る。遊びは遠慮するよ。」
    悟空「せっかくここまで来たのだ。俺の山の眺めを見ていかないか。」
    八戒は強く断る勇気もなく、仕方なくついて歩いた。

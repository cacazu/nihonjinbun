  "source_text": "二人攜手相攙，概眾小妖隨後，上那花果山極巔之處。好山，自是那大聖回家，這幾日，收拾得復舊如新。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"

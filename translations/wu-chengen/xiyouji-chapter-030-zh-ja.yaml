  "source_text": "卻說那怪把沙僧綑住，也不來殺他，也不曾打他，罵也不曾罵他一句。綽起鋼刀，心中暗想道：「唐僧乃上邦人物，必知禮義，終不然我饒了他性命，又著他徒弟拿我不成？噫！這多是我渾家有甚麼書信到他那國裡，走了風汛。等我去問他一問。」那怪陡起兇性，要殺公主。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて黄袍怪（こうほうかい）は沙悟浄（さごじょう）を縛り上げたが、殺しもせず、打ちもせず、罵りの言葉さえ一つも浴びせなかった。鋼の刀をつかみ、ひそかに考えた。黄袍怪は心の中で言った。「三蔵（さんぞう）は大国の人間、礼義ぐらいは心得ていよう。命を助けてやったのに、弟子を差し向けて俺を捕らえさせるとは考えられぬ。ははあ、きっと女房があの国へ何か手紙を送り、居場所が漏れたのだな。問いただしてやろう。」
    黄袍怪はにわかに凶暴な心を起こし、百花羞（ひゃっかしゅう）を殺そうとした。
  "translation_status": "reviewed"
- "id": "xy-ch30-003"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那公主不知，梳妝方畢，移步前來。只見那怪怒目攢眉，咬牙切齒。那公主還陪笑臉迎道：「郎君有何事這等煩惱？」那怪咄的一聲罵道：「你這狗心賤婦，全沒人倫。我當初帶你到此，更無半點兒說話。你穿的錦，戴的金，缺少東西我去尋。四時受用，每日情深。你怎麼只想你父母，更無半點夫婦心？」那公主聞說，嚇得跪倒在地道：「郎君啊，你怎麼今日說起這分離的話？」那怪道：「不知是我分離，是你分離哩。我把那唐僧拿來，算計要他受用，你怎麼不先告過我，就放了他？原來是你暗地裡修了書信，教他替你傳寄；不然，怎麼這兩個和尚又來打上我門，教還你回去？這不是你幹的事？」公主道：「郎君，你差怪我了，我何嘗有甚書去？」老怪道：「你還強嘴哩，現拿住一個對頭在此，卻不是證見？」公主道：「是誰？」老妖道：「是唐僧第二個徒弟沙和尚。」原來人到了死處，誰肯認死，只得與他放賴。公主道：「郎君且息怒，我和你去問他一聲。果然有書，就打死了，我也甘心；假若無書，卻不枉殺了奴奴也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    百花羞はそんなこととは知らず、化粧を終えて出てきた。見ると黄袍怪は目を怒らせ、眉を寄せ、歯をぎりぎりと噛み鳴らしている。それでも百花羞は笑顔を作り、迎えた。百花羞「あなた、何があって、そのようにお悩みなのですか。」
    黄袍怪はどっと一喝して罵った。黄袍怪「犬の心をした下賤な女め、まるで人の道を知らぬ。初めにお前をここへ連れてきたときは、こんな文句など一言もなかった。着るのは錦、飾るのは金、足りない物は俺が探してきた。一年じゅう不自由させず、日ごとに情けをかけてきたのに、なぜお前は父母ばかり思い、夫婦の情などかけらも持たぬのだ。」
    百花羞は恐ろしくなって、その場にひざまずいた。百花羞「あなた、なぜ今日は、そんな夫婦の仲が裂けるようなお話をなさるのです。」
    黄袍怪「仲を裂くのは俺ではない、お前だろう。三蔵を捕らえてご馳走にしようと思っていたのに、なぜ俺に断りもせず放してやった。さては、ひそかに手紙を書き、あいつに届けさせたのだな。そうでなければ、なぜあの二人の和尚がまた門へ襲ってきて、お前を返せと言うのだ。お前の仕業に違いあるまい。」
    百花羞「あなた、それは見当違いです。私は手紙など出しておりません。」
    黄袍怪「まだ言い張るか。相手の一人は、今ここへ捕らえてある。証人がいるではないか。」
    百花羞「誰ですか。」
    黄袍怪「三蔵の二番目の弟子、沙和尚（さおしょう）だ。」
    人は死に直面して、誰がすんなり死を認めよう。百花羞は、あくまでしらを切るしかなかった。百花羞「あなた、ひとまずお怒りをお鎮めください。一緒にあの者へ尋ねに参りましょう。本当に手紙があったのなら、殺されても甘んじて受けます。けれど手紙がなかったら、罪のない私を殺すことになるではありませんか。」
  "translation_status": "reviewed"

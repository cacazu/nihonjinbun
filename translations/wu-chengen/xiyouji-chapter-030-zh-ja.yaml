  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪聞言，不容分說，掄開一隻簸箕大小的藍靛手，抓住那金枝玉葉的髮萬根，把公主揪上前，捽在地下。執著鋼刀，卻來審沙僧，咄的一聲道：「沙和尚，你兩個輒敢擅打上我們門來，可是這女子有書到他那國，國王教你們來的？」沙僧已綑在那裡，見妖精兇惡之甚，把公主摜倒在地，持刀要殺，他心中暗想道：「分明是他有書去，救了我師父，此是莫大之恩。我若一口說出，他就把公主殺了，此卻不是恩將仇報？罷罷罷，想老沙跟我師父一場，也沒寸功報效，今日已此被縛，就將此性命與師父報了恩罷。」遂喝道：「那妖怪不要無禮，他有甚麼書來，你這等枉他，要害他性命？我們來此問你要公主，有個緣故。只因你把我師父捉在洞中，我師父曾看見公主的模樣動靜。及至寶象國，倒換關文，那皇帝將公主畫影圖形，前後訪問，因將公主的形影，問我師父沿途可曾看見，我師父遂將公主說起。他故知是他兒女，賜了我等御酒，教我們來拿你，要他公主還宮。此情是實，何嘗有甚書信？你要殺就殺了我老沙，不可枉害平人，大虧天理。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    黄袍怪は聞くなり、言い分を聞きもせず、箕ほどもある藍色の手を振り上げた。そして高貴な姫の豊かな髪をつかみ、ぐいと前へ引きずり、地面へたたきつけた。鋼の刀を構えて沙悟浄を問いただし、どっと怒鳴った。黄袍怪「沙和尚、お前たちが勝手にうちを襲ったのは、この女が故国へ手紙を送り、国王がお前たちを遣わしたからか。」
    沙悟浄は縛られたまま、妖怪のひどい凶暴さを見た。百花羞を地面へ投げつけ、刀で殺そうとしている。沙悟浄は心の中で考えた。「手紙を出したのは確かにこの方で、お師匠さまを救ってくださった。これほどの大恩はない。俺が一言本当のことを言えば、妖怪はこの方を殺してしまう。それでは恩を仇で返すことになる。よし、いいとも。俺はお師匠さまに従ってきながら、これまで少しも手柄を立てて報いていない。今日すでに縛られたからには、この命でお師匠さまの恩に報いよう。」
    そこで沙悟浄は一喝した。沙悟浄「妖怪、無礼なまねをするな。手紙など来るものか。そんな濡れ衣を着せて、命を奪おうというのか。俺たちがここへ公主（こうしゅ）を返せと言いに来たのには、訳がある。お前が師を洞へ捕らえたとき、お師匠さまは公主の姿や様子を目にされた。宝象国（ほうぞうこく）で通行文書を改めた際、王様は公主の似姿を描かせ、あちこちで行方を尋ねていた。それで師にも、道中でこの姿を見なかったかと尋ねられ、お師匠さまは公主のことを話されたのだ。王様はそれでわが子だと知り、俺たちに御酒を賜り、お前を捕らえて公主を宮中へ戻すよう命じた。これが真実だ。どこに手紙などある。殺すなら俺を殺せ。罪もない人を害してはならぬ。天の道に大きく背くぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch30-005"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖見沙僧說得雄壯，遂丟了刀，雙手抱起公主道：「是我一時粗鹵，多有衝撞，莫怪莫怪。」遂與他挽了青絲，扶上寶髻，軟款溫柔，怡顏悅色，撮哄著他進去了，又請上坐陪禮。那公主是婦人家水性，見他錯敬，遂回心轉意道：「郎君啊，你若念夫婦的恩愛，可把那沙僧的繩子略放鬆些兒。」老妖聞言，即命小的們把沙僧解了繩子，鎖在那裡。沙僧見解縛鎖住，立起來，心中暗喜道：「古人云：『與人方便，自己方便。』我若不方便了他，他怎肯教把我鬆放鬆放？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    黄袍怪は沙悟浄の堂々たる言い方を見ると、刀を放り出し、両手で百花羞を抱き起こした。黄袍怪「一時乱暴になって、ひどいことをした。怒らないでくれ、許してくれ。」
    黒髪をまとめ、飾りをつけた髷を直し、物腰も柔らかく、にこやかな顔でなだめすかして奥へ連れ込み、上座へ座らせて詫びた。百花羞は、女心の水のように移ろいやすいところから、相手が過ちを認めて下手に出ると、気持ちを変えた。百花羞「あなた、夫婦の情けを思ってくださるなら、沙悟浄の縄を少し緩めてあげてください。」
    黄袍怪はすぐに小妖たちへ命じ、沙悟浄の縄を解かせ、代わりに鎖でつながせた。縄が解け、鎖につながれた沙悟浄は立ち上がり、ひそかに喜んだ。沙悟浄は心の中で言った。「昔から『人に便宜を図れば、自分にも便宜が返る』という。俺がこの方を助けていなかったら、縄を緩めるよう頼んでくれるはずもなかったな。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「婦人家水性」は原文の語り手による女性への定型的な評言として訳出した。現代の事実認定や百花羞の自発的な同意へ読み替えず、直前の暴行と恐怖を省いていない。"
- "id": "xy-ch30-006"
  "section_id": "chapter-30"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老妖又教安排酒席，與公主陪禮壓驚。吃酒到半酣，老妖忽的又換了一件鮮明的衣服，取了一口寶刀，佩在腰裡，轉過手，摸著公主道：「渾家，你且在家吃酒，看著兩個孩兒，不要放了沙和尚。趁那唐僧在那國裡，我也趕早兒去認認親也。」公主道：「你認甚親？」老妖道：「認你父王。我是他駙馬，他是我丈人，怎麼不去認認？」公主道：「你去不得。』老妖道：「怎麼去不得？」公主道：「我父王不是馬掙力戰的江山，他本是祖宗遺留的社稷。自幼兒是太子登基，城門也不曾遠出，沒有見你這等兇漢。你這嘴臉相貌，生得這等醜陋，若見了他，恐怕嚇了他，反為不美。卻不如不去認的還好。」老妖道：「既如此說，我變個俊的兒去便罷。」公主道：「你試變來我看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch30-1455579"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第030回&oldid=1455579"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    黄袍怪はさらに酒席を用意させ、百花羞に詫びて、恐ろしかった心を慰めた。ほどよく酔いが回ったころ、不意に鮮やかな衣に着替え、宝刀を腰へ差すと、手を回して百花羞に触れながら言った。黄袍怪「お前は家で酒を飲み、子供二人の面倒を見ていてくれ。沙和尚は放すなよ。三蔵があの国にいるうちに、俺も早いところ親族の挨拶をしに行こう。」
    百花羞「誰に挨拶するのです。」
    黄袍怪「お前の父王だよ。俺はあの人の婿、あの人は俺の舅じゃないか。なぜ挨拶に行かずにいられよう。」
    百花羞「行ってはいけません。」
    黄袍怪「なぜ行ってはいけない。」
    百花羞「父王の国は、馬を駆って戦い、力ずくで手に入れたものではありません。祖先から受け継いだ国なのです。幼いころに太子から即位して、城門の外へさえ遠く出たこともなく、あなたのように恐ろしい男を見たことがありません。あなたのそのお顔は、とても醜いでしょう。お会いになれば父王を驚かせ、かえってよくないことになりかねません。挨拶には行かないほうがよいのです。」
    黄袍怪「そういうことなら、美男子に化けて行けばいい。」
    百花羞「試しに変じて、見せてくださいな。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は公主の「你去不得」の閉じ括弧が『』の片側になっている。原文欄は訂正せず、訳文では百花羞と黄袍怪の問答として引用符を整えた。"

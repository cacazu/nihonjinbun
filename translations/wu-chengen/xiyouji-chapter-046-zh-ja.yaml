  "known_gaps":
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-001"
      "description_ja": "回題の外道は仏教の正しい教えに外れる者という宗教的立場からの呼び名。心猿は落ち着かない心を猿にたとえる語で、ここでは悟空にも重なる。題の評価を現代の宗教一般に対する判定とはしない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-002"
      "description_ja": "「抓了丟去」は、道士たちが法力の競争で軽くあしらわれ、名声を傷つけられたという訴えとして訳した。実際につかんで投げ捨てる新たな出来事を補ってはいない。時辰は古い時刻単位であり、机の高さや年数とともに、現代の厳密な時間・長さへは換算しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-003"
      "description_ja": "悟空の「踢天弄井」は、天にも地にも自在に働きかけるほど腕前が高いという慣用的な誇張。教育部『重編國語辭典修訂本』も本領高強をたとえる語とする。訳では天と井戸の字面を残すが、実演された個別の術名や仕組みとは断定しない。三蔵の性命・定性存神・死生関は、本性と生命、精神の集中、生死の関門という修行上の語として訳した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-006"
      "description_ja": "羊兒風はてんかん様の発作、頭風は頭痛などをいう古い病名。八戒と沙悟浄が見た動作に対して述べる判断であり、三蔵の実際の診断を語り手が保証したものではない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-008"
      "description_ja": "鹿力大仙の暗風疾は、発作を起こす持病と解した。古い医書『聖濟總録纂要』巻二にも暗風癎病の語が見えるが、ここで現代の特定の診断に同定したり、病を秘密にしていたと解したりはしない。虎力大仙の転落の真因を病気と認定するのではなく、鹿力大仙の弁解として保存する。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-009"
      "description_ja": "山河社稷襖と乾坤地理裙は、対になる宮中の上衣と裳の名称。衣の図柄や製法の細部は記されない。一口鐘は鐘そのものではなく、上が狭く裾が広がる長い外衣。教育部『重編國語辭典修訂本』の第二義を参照した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-010"
      "description_ja": "底本は「三宮皇后」とする。三宮は后妃の宮や后妃をまとめて指しうるが、ここでは梓童という自称を伴う一続きの発言である。訳では「三宮の皇后」として原語を残し、三人の掛け合いや個人名を創作しない。また、御苑の仙桃を、天界の蟠桃園の桃と同一の物だとは確定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-014"
      "description_ja": "三官経・北斗経・消災経は道童が知る道教側の経典名として残した。類題・同名の経があり、ここでは正式題名や巻数を特定しない。鶴氅は本来羽毛の衣をいうこともあるが、ここでは原文が絹と刺繍の衣だと明記するため、羽毛製とは訳さない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-014"
      "description_ja": "三蔵の「這番他準贏了」は、直後に和尚も三宝の一つだから宝物を当てる条件に合うと説明する文脈に沿って、「それなら今度こそ、きっと勝てる」と訳した。他の指示対象には揺れがあり、原文の代名詞を別字に補訂してはいない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-016"
      "description_ja": "山名は底本の鍾南山を保持した。通用する終南山へ無断で字を改めたり、地理的な同一性を確定したりしていない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-020"
      "description_ja": "六陽は、伝統的な身体観で頭へ集まるとされた手足の陽の経脈を指す。明代の『證治準繩』巻十二にも首を六陽の集まる所とする表現がある。ここでは国王の説明として訳し、現代医学の記述とはしない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-022"
      "description_ja": "「開刀！」という号令の主語は明記されないため、「刑場の声」とした。監斬官や首斬り役人のどちらかに推測で限定しない。沙悟浄の「七十二の変化だから七十二の頭」は、その人物の説明であり、悟空の能力の客観的な上限として確定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-024"
      "description_ja": "この御水河は、場面上、車遅国の王宮付近の川である。宝象国や烏鶏国に出た同名の川と、地理的に同一だとはみなさない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-025"
      "description_ja": "虎力大仙の黄毛の虎の姿はここで初めて明示される。鹿力大仙の「悟空が獣に変えた」という次の訴えは、本人の言い分として残す。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-030"
      "description_ja": "鹿力大仙の白毛で角のある鹿の姿はこの段落で初めて明示される。羊力大仙の「悟空が陥れた」という次の訴えは、本人の言い分として残す。羊力大仙の動物種は本回では明かされない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-032"
      "description_ja": "底本では、油鍋へ先に入らせる叙述の末尾に、対応する始め括弧のない閉じ括弧がある。原文欄はそのまま保ち、訳文では地の文として処理した。文洗・武洗は、この場で悟空が説明する勝負の方式であり、一般的な入浴作法だとは断定しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-036"
      "description_ja": "漿水飯は死者に供える水や米の汁を伴う飯として解した。教育部辞典「忌辰」が引く『琵琶記』にも涼漿水飯を供える用例があるが、具体的な材料や作り方はここでは確定しない。一陌はおよそ百文の紙銭一つづりをいうが、三枚の紙馬との数量関係が明示されないため、百枚へ換算しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-041"
      "description_ja": "敖順は、羊力大仙が正しく授かったのは五雷法だけで、ほかは脇道の術だと説明し、先に倒れた二人も悟空に術を破られたと述べる。大開剝が三種の競技すべてを指すか、油鍋に関わる一術を主に指すかには留保がある。冷竜は本人が煉ったものとの説明を保持し、敖順の化身に置き換えない。原文の「屣了傍門」は、旁門へ踏み入れたという文脈で訳し、原字を訂正しない。本回は北海竜王が「敖順」と名乗るため、第43・45回で同じ名を用いる西海の竜王とは役割で区別し、原文の名は訂正しない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-043"
      "description_ja": "底本では先に監斬官が悟空に打ち殺された後、この段落で再び監斬官が奏上する。別人への交代や蘇生は記されないため、訳でも説明を創作せず、役職名をそのまま残した。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-044"
      "description_ja": "「圓明混」は、円明の心が濁っているという意味に解した。「秘食」は原字に沿って、ひそかに食をとると訳した。避世の暮らしや特殊な養生法などとの関係は確定せず、他版の字句で補訂していない。国王の嘆きの詩であることも保持する。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-046"
      "description_ja": "金を生むことと水銀を煉ることは錬金・煉丹の術を指す。物語の結句が法術のむなしさを述べるのであり、化学的な実践方法として提示するものではない。 本文欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch46-1557967"
      "segment_ids":
        - "xy-ch46-013"
      "description_ja": "道童を隠して箱を下へ運んだ後の「教：那和尚再猜」の発話者は、底本で主語が明記されない。国王や虎力大仙のいずれかに断定せず、「声の主」とした。 本文欠落ではなく発話者同定の留保。"

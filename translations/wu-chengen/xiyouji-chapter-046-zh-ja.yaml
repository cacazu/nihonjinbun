    "source_text": "國王見此有些難處，就便傳旨問道：「那和尚，我國師要與你賭『雲梯顯聖』坐禪，那個會麼？」行者聞言，沉吟不答。八戒道：「哥哥，怎麼不言語？」行者道：「兄弟，實不瞞你說。若是踢天弄井、攪海翻江、擔山趕月、換斗移星諸般巧事，我都幹得；就是砍頭剁腦、剖腹剜心、異樣騰那卻也不怕；但說坐禪，我就輸了。我那裡有這坐性？你就把我鎖在鐵柱子上，我也要上下爬蹅，莫想坐得住。」三藏忽的開言道：「我會坐禪。」行者歡喜道：「卻好，卻好。可坐得多少時？」三藏道：「我幼年遇方上禪僧講道，那性命根本上，定性存神，在死生關裡，也坐二三個年頭。」行者道：「師父若坐二三年，我們就不取經罷。多也不上二三個時辰，就下來了。」三藏道：「徒弟呀，卻是不能上去。」行者道：「你上前答應，我送你上去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 119
        "line_end": 119
    "translation_ja": |-
      これはなかなか難しいと見た国王は、さっそく命じて尋ねた。
      国王「僧たちよ、我が国師が雲梯顕聖の座禅で勝負したいという。できる者はおるか。」
      悟空は聞いても考え込み、返事をしなかった。
      八戒（はっかい）「兄貴、どうして黙っているんだ。」
      悟空「弟よ、正直に言おう。天を蹴り、井戸を操り、海をかき回し、川をひっくり返し、山を担いで月を追い、北斗（ほくと）を取り替え星を移すような妙技なら、何だってできる。頭を斬られ、脳天をたたき割られ、腹を裂かれ、心臓をえぐられるような変わった術も怖くはない。だが、座禅と来たら俺の負けだ。俺にじっと座っていられる性分があるものか。鉄の柱に鎖でつないだって、上へ下へとよじ登る。座ったままでいろなんて、無理な話さ。」
      すると三蔵が、ふいに口を開いた。
      三蔵「座禅なら私にできる。」
      悟空は喜んだ。
      悟空「それはいい、それはいい。どのくらい座っていられますか。」
      三蔵「幼いころ、各地を巡る禅僧の説法を聞いた。本性と生命の根本に立ち、心を定めて精神を保てば、生死の関門に向き合いながら、二年でも三年でも座っていられる。」
      悟空「お師匠さまが二年も三年も座るなら、経を取りに行くのはやめですね。せいぜい二、三時辰で下りてくればいいのです。」
      三蔵「ただ、あの上へ登れないのだ。」
      悟空「前へ出て、お引き受けください。私が上へお連れします。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-004"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老果然合掌當胸道：「貧僧會坐禪。」國王教傳旨，立禪臺。國家有倒山之力，不消半個時辰，就設起兩座臺，在金鑾殿左右。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 121
        "line_end": 121
    "translation_ja": |-
      三蔵は言われたとおり、胸の前で合掌した。
      三蔵「私に座禅ができます。」
      国王は禅台を立てるよう命じた。国家の力は山をも倒す。半時辰もたたぬうちに、金鑾殿の左右へ二つの台が組み上がった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-005"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那虎力大仙下殿，立於階心，將身一縱，踏一朵席雲，徑上西邊臺上坐下。行者拔一根毫毛，變做假像，陪著八戒、沙僧，立於下面；他卻作五色祥雲，把唐僧撮起空中，徑至東邊臺上坐下；他又斂祥光，變作一個蟭蟟蟲，飛在八戒耳朵邊道：「兄弟，仔細看著師父，再莫與老孫替身說話。」那獃子笑道：「理會得，理會得。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      虎力大仙は御殿を下り、階段の中央に立つと、身を躍らせて一片の敷物のような雲に乗り、西側の台へまっすぐ上がって座った。悟空は毛を一本抜いて自分の分身に変え、八戒、沙悟浄（さごじょう）とともに下へ立たせておいた。自らは五色の瑞雲となり、三蔵を空へ運び上げ、東側の台に座らせた。それから光を収め、蟭蟟虫（しょうりょうちゅう）に変わって八戒の耳元へ飛んだ。
      悟空「弟よ、お師匠さまをよく見ていろ。俺の身代わりには話しかけるなよ。」
      八戒は笑った。
      八戒「分かった、分かった。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-006"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那鹿力大仙在繡墩上坐看多時，他兩個在高臺上不分勝負，這道士就助他師兄一功：將腦後短髮拔了一根，捻著一團，彈將上去，徑至唐僧頭上，變作一個大臭蟲，咬住長老。那長老先前覺癢，然後覺疼。原來坐禪的不許動手，動手算輸。一時間疼痛難禁，他縮著頭，就著衣襟擦癢。八戒道：「不好了，師父羊兒風發了。」沙僧道：「不是，是頭風發了。」行者聽見道：「我師父乃志誠君子，他說會坐禪，斷然會坐；說不會，只是不會。君子家，豈有謬乎？你兩個休言，等我上去看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      一方、鹿力大仙（ろくりきたいせん）は刺繍の腰掛けに座り、しばらく眺めていた。高い台の上の二人には、いっこうに勝ち負けがつかない。そこで兄弟子に手を貸そうと、後頭部の短い毛を一本抜き、丸めて上へはじいた。毛は三蔵の頭へ届き、大きな南京虫に変わって食いついた。三蔵は最初かゆくなり、やがて痛みを感じた。座禅中は手を動かしてはならず、動かせば負けである。たちまち痛みに耐えられなくなり、首を縮めて襟に頭をこすりつけ、かゆみをしのいだ。
      八戒「大変だ、お師匠さまにてんかんの発作が起きたぞ。」
      沙悟浄「いえ、頭痛が出たのでしょう。」
      悟空はそれを聞いて言った。
      悟空「お師匠さまは、心から誠実な方だ。座禅ができると言ったら、必ずできる。できないと言ったら、できないのだ。立派な方が、いい加減なことを言うものか。二人とも黙っていろ。俺が上へ行って見てくる。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-007"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，嚶的一聲，飛在唐僧頭上，只見有豆粒大小一個臭蟲叮他師父，慌忙用手捻下，替師父撓撓摸摸。那長老不疼不癢，端坐上面。行者暗想道：「和尚頭光，虱子也安不得一個，如何有此臭蟲？想是那道士弄的玄虛，害我師父。哈哈，枉自也不見輸贏，等老孫去弄他一弄！」這行者飛將上去，金殿獸頭上落下，搖身一變，變作一條七寸長的蜈蚣，徑來道士鼻凹裡叮了一下。那道士坐不穩，一個觔斗，翻將下去，幾乎喪了性命，幸虧大小官員人多救起。國王大驚，即著當駕太師領他往文華殿裡梳洗去了。行者仍駕祥雲，將師父馱下階前，已是長老得勝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      悟空はぶんと飛び立ち、三蔵の頭へ行ってみると、豆粒ほどの南京虫が師に食いついていた。急いで指でつまみ取り、師の頭をかいたり、さすったりした。三蔵は痛みもかゆみもなくなり、台の上で端然と座り続けた。悟空はひそかに考えた。
      悟空「坊主のつるつる頭には、しらみ一匹住みつけない。それなのに、どうして南京虫がいるんだ。さては、あの道士がからくりを使ってお師匠さまを苦しめたな。ははあ、このままでも勝ち負けはつかない。俺があいつを、ちょいとからかってやろう。」
      悟空は上へ飛び、御殿の屋根の獣頭飾りに止まると、身を震わせて七寸（すん）のムカデに変わり、まっすぐ道士の鼻のくぼみへ行って一かみした。虎力大仙は座っていられず、もんどり打って下へ転げ落ち、危うく命を落とすところだった。幸い、大勢の大小の役人が助け起こした。国王は驚き、御前に仕える太師（たいし）へ命じて、文華殿（ぶんかでん）へ連れて行き、体を洗って身なりを整えさせた。悟空はふたたび瑞雲に乗り、三蔵を背に乗せて階段の前へ下ろした。これで三蔵の勝ちとなった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-008"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王只教放行。鹿力大仙又奏道：「陛下，我師兄原有暗風疾，因到了高處，冒了天風，舊疾舉發，故令和尚得勝。且留下他，等我與他賭隔板猜枚。」國王道：「怎麼叫做『隔板猜枚』？」鹿力道：「貧道有隔板知物之法，看那和尚可能夠？他若猜得過我，讓他出去；猜不著，憑陛下問擬罪名，雪我昆仲之恨，不污了二十年保國之恩也。」真個那國王十分昏亂，依此讒言，即傳旨：將一硃紅漆的櫃子，命內官擡到宮殿。教娘娘放上件寶貝。須臾擡出，放在白玉階前，教僧道：「你兩家各賭法力，猜那櫃中是何寶貝。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      国王はもう、一行を通すよう命じた。ところが鹿力大仙が、また奏上した。
      鹿力大仙「陛下、兄にはもともと、発作を起こす持病がございました。高い所へ登って天の風に当たり、古い病がぶり返したため、僧に勝たせてしまったのでございます。しばらくお留めください。今度は私が隔板猜枚（かくばんさいばい）で勝負いたします。」
      国王「隔板猜枚とは、どんなものだ。」
      鹿力大仙「私には板の向こうの物を言い当てる術があります。あの僧にできるか、見てみたいのです。私に勝って言い当てたなら、通してやりましょう。当てられなければ、陛下のお裁きで罪に問い、私ども兄弟の恨みを晴らしていただきたい。それでこそ、二十年にわたり国を守った功も汚されずに済むのでございます。」
      国王は実に浅はかで、この讒言に従った。朱漆塗りの箱を宮中の役人に奥の宮へ運ばせ、皇后に宝物を一つ入れるよう命じた。ほどなく箱が運び出され、白玉の階段の前に置かれた。国王は僧と道士に命じた。
      国王「双方とも法力を競い、この箱の中の宝が何か、当ててみよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-009"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏道：「徒弟，櫃中之物，如何得知？」行者斂祥光，還變作蟭蟟蟲，釘在唐僧頭上道：「師父放心，等我去看看來。」好大聖，輕輕飛到櫃上，爬在那櫃腳之下，見有一條板縫兒。他鑽將進去，見一個紅漆丹盤，內放一套宮衣，乃是山河社稷襖、乾坤地理裙。用手拿起來，抖亂了，咬破舌尖上，一口血哨噴將去，叫聲：「變！」即變作一件破爛流丟一口鐘。臨行又撒上一泡臊溺。卻還從板縫裡鑽出來，飛在唐僧耳朵上道：「師父，你只猜是破爛流丟一口鐘。」三藏道：「他教猜寶貝哩，流丟是件甚寶貝？」行者道：「莫管他，只猜著便是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      三蔵「箱の中にある物が、どうして分かるのだ。」
      悟空は瑞光を収め、また蟭蟟虫となって三蔵の頭に止まった。
      悟空「お師匠さま、ご安心を。私が見てきます。」
      悟空は軽やかに箱へ飛び移り、その脚の下へはって行くと、板の継ぎ目に隙間があった。そこから潜り込んでみると、朱漆塗りの盆に、宮中の衣装が一そろい載せてある。山河社稷襖（さんがしゃしょくおう）と乾坤地理裙（けんこんちりくん）であった。悟空は手に取り、振ってくしゃくしゃにすると、舌の先をかみ切り、血を一口吹きかけた。
      悟空「変われ！」
      すると衣装は、ぼろぼろの一口鐘（いっこうしょう）に変わった。悟空は出て行く前に、臭い小便までかけておいた。そしてまた板の隙間から抜け出し、三蔵の耳へ飛んだ。
      悟空「お師匠さま、ただ、ぼろぼろの一口鐘だと言ってください。」
      三蔵「宝物を当てよと言われているのだぞ。ぼろが何の宝になる。」
      悟空「そんなことは構いません。当たりさえすればいいのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-010"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧進前一步，正要猜，那鹿力大仙道：「我先猜，那櫃裡是山河社稷襖、乾坤地理裙。」唐僧道：「不是，不是，櫃裡是件破爛流丟一口鐘。」國王道：「這和尚無禮，敢笑我國中無寶，猜甚麼流丟一口鐘。」教：「拿了！」那兩班校尉就要動手。慌得唐僧合掌高呼：「陛下，且赦貧僧一時，待打開櫃看。端的是寶，貧僧領罪；如不是寶，卻不屈了貧僧也？」國王教打開看。當駕官即開了，捧出丹盤來看，果然是件破爛流丟一口鐘。國王大怒道：「是誰放上此物？」龍座後面閃上三宮皇后道：「我主，是梓童親手放的山河社稷襖、乾坤地理裙，卻不知怎麼變成此物？」國王道：「御妻請退，寡人知之。宮中所用之物，無非是緞絹綾羅，那有此甚麼流丟？」教：「擡上櫃來，等朕親藏一寶貝，再試如何。」那皇帝即轉後宮，把御花園裡仙桃樹上結得一個大桃子，有碗來大小，摘下，放在櫃內，又擡下叫猜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      三蔵が一歩進み出て、答えようとしたところ、鹿力大仙が言った。
      鹿力大仙「私が先に当てよう。箱の中は山河社稷襖と乾坤地理裙だ。」
      三蔵「違う、違う。箱の中は、ぼろぼろの一口鐘です。」
      国王「無礼な坊主め。朕の国には宝がないとあざけるのか。何が、ぼろの一口鐘だ。」
      国王「捕らえよ！」
      左右に並ぶ兵士が手をかけようとすると、三蔵は慌てて合掌し、大声で訴えた。
      三蔵「陛下、しばらくお待ちください。箱を開けてお確かめください。本当に宝物でしたら、私は罪に服します。けれども宝物でなければ、私に無実の罪を着せることになりませんか。」
      国王は開けて見るよう命じた。御前の役人がすぐに箱を開き、朱塗りの盆を取り出してみると、果たしてぼろぼろの一口鐘だった。国王は激怒した。
      国王「誰がこのような物を入れたのだ。」
      玉座の後ろから、三宮（さんぐう）の皇后がさっと進み出た。
      皇后「陛下、この私が手ずから山河社稷襖と乾坤地理裙を入れました。それがどうして、こんな物に変わったのか分かりません。」
      国王「妃よ、下がってよい。朕にも分かっておる。宮中で使うのは、繻子や絹、綾や羅ばかりだ。こんなぼろがあるものか。」
      国王「箱をこちらへ運べ。今度は朕が自ら宝物を隠し、もう一度試してみよう。」
      国王は奥の宮へ戻り、御苑の仙桃（せんとう）の木に実った、碗ほどもある大きな桃を一つもぎ取った。それを箱へ入れ、また運び下ろして当てさせた。
    "translation_status": "reviewed"
  - "id": "xy-ch46-011"

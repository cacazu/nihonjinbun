        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 145
        "line_end": 145
    "translation_ja": "八戒と沙悟浄は聞いて、はははと大笑いした。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-020"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者上前道：「陛下，小和尚會砍頭。」國王道：「你怎麼會砍頭？」行者道：「我當年在寺裡修行，曾遇著一個方上禪和子，教我一個砍頭法，不知好也不好，如今且試試新。」國王笑道：「那和尚年幼不知事，砍頭那裡好試新？頭乃六陽之首，砍下即便死矣。」虎力道：「陛下，正要他如此，方才出得我們之氣。」那昏君信他言語，即傳旨，教設殺場。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      悟空は進み出た。
      悟空「陛下、若輩の私に、首斬りができます。」
      国王「どうして、首斬りなどできるのだ。」
      悟空「昔、寺で修行していたころ、各地を巡る禅僧に出会いまして、首斬りの法を一つ教わりました。うまくいくかどうか分かりませんが、ひとまず今回、初めて試してみましょう。」
      国王は笑った。
      国王「その方は若くて、物事を知らぬのだな。首斬りが、初めて試してみるなどというものか。頭は六陽（ろくよう）の集まるところ、斬り落とせば、たちまち死ぬぞ。」
      虎力大仙「陛下、まさしく、そうさせたいのでございます。それでこそ、私どもの腹の虫も収まります。」
      暗愚な国王はその言葉を信じ、処刑場を設けるよう命じた。
    "translation_status": "reviewed"
  - "id": "xy-ch46-021"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一聲傳旨，即有羽林軍三千，擺列朝門之外。國王教：「和尚先去砍頭。」行者欣然應道：「我先去，我先去。」拱著手，高呼道：「國師，恕大膽，占先了。」拽回頭，往外就走。唐僧一把扯住道：「徒弟呀，仔細些，那裡不是耍處。」行者道：「怕他怎的？撒了手，等我去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      命令が下ると、三千の羽林軍（うりんぐん）が宮門の外へ並んだ。
      国王「僧よ、先に行って首を斬られよ。」
      悟空は喜んで応じた。
      悟空「私が先に、私が先に。」
      両手を組んで礼をし、大声で告げた。
      悟空「国師、失礼ながら、お先に頂戴します。」
      くるりと向き直り、そのまま外へ歩き出した。三蔵がすがりついて引き止めた。
      三蔵「悟空、くれぐれも気をつけるのだぞ。あそこは、ふざける場所ではない。」
      悟空「何を怖がることがあります。手をお放しください。行ってきます。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-022"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那大聖徑至殺場裡面，被劊子手撾住了，綑做一團，按在那土墩高處，只聽喊一聲：「開刀！」颼的把個頭砍將下來。又被劊子手一腳踢了去，好似滾西瓜一般，滾有三四十步遠近。行者腔子中更不出血。只聽得肚裡叫聲：「頭來！」慌得鹿力大仙見有這般手段，即念咒語，教本坊土地、神祗：「將人頭扯住，待我贏了和尚，奏了國王，與你把小祠堂蓋作大廟宇，泥塑像改作正金身。」原來那些土地、神祗因他有五雷法，也服他使喚，暗中真個把行者頭按住了。行者又叫聲：「頭來！」那頭一似生根，莫想得動。行者心焦，捻著拳，掙了一掙，將綑的繩子就皆掙斷，喝聲：「長！」颼的腔子內長出一個頭來。諕得那劊子手個個心驚，羽林軍人人膽戰。那監斬官急走入朝奏道：「萬歲，那小和尚砍了頭，又長出一顆來了。」八戒冷笑道：「沙僧，那知哥哥還有這般手段。」沙僧道：「他有七十二般變化，就有七十二個頭哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      悟空はまっすぐ処刑場へ入った。首斬り役人につかまり、ぐるぐる巻きに縛られ、土の高台に押さえつけられた。そこへ、ひと声響いた。
      刑場の声「斬れ！」
      すぱりと首が落ちた。首斬り役人がさらにひと蹴りすると、頭は西瓜のようにころころ転がり、三、四十歩ほども遠くへ行った。悟空の胴からは、まったく血が出ない。ただ腹の中から声がした。
      悟空「頭よ、戻れ！」
      鹿力大仙はこのような術を見て慌て、呪文を唱え、この土地の土地神（とちがみ）や神々に命じた。
      鹿力大仙「あの頭を押さえておけ。僧に勝ったら国王へ奏上し、お前たちの小さな祠を大きな廟へ建て替え、土でこねた像も、本物の金の神像に改めてやる。」
      もともと、この土地神や神々は、鹿力大仙が五雷法（ごらいほう）を使えるので、その命令に従っていた。本当に陰から悟空の頭を押さえつけてしまった。悟空はもう一度呼んだ。
      悟空「頭よ、戻れ！」
      ところが頭は根でも生えたようで、少しも動かない。焦れた悟空は拳を握り、ぐっと身を振り絞ると、縛っていた縄をすべて引きちぎった。
      悟空「生えよ！」
      すると、すうっと胴から頭が一つ生えてきた。首斬り役人はみな肝をつぶし、羽林軍の兵も一人残らず震え上がった。監斬官（かんざんかん）は急いで朝廷へ駆け込み、奏上した。
      監斬官「陛下、あの若い僧は、首を斬られたのに、また頭が一つ生えました。」
      八戒はにやりと笑った。
      八戒「沙悟浄、兄貴にこんな腕まであったとはな。」
      沙悟浄「兄さんには七十二通りの変化ができますから、頭も七十二あるんですよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-023"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，行者走來，叫聲：「師父。」三藏大喜道：「徒弟，辛苦麼？」行者道：「不辛苦，倒好耍子。」八戒道：「哥哥，可用刀瘡藥麼？」行者道：「你是摸摸看，可有刀痕？」那獃子伸手一摸，就笑得呆呆睜睜道：「妙哉，妙哉！卻也長得完全，截疤兒也沒些兒。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      話し終えぬうちに、悟空が戻ってきて呼んだ。
      悟空「お師匠さま。」
      三蔵は大喜びした。
      三蔵「悟空、つらくはなかったか。」
      悟空「つらいどころか、面白かったくらいです。」
      八戒「兄貴、切り傷の薬はいるか。」
      悟空「ちょっと触ってみろ。刀傷があるか。」
      八戒は手を伸ばして触ると、目を見張ったまま笑った。
      八戒「見事だ、見事だ！　すっかり元どおりに生えている。切られた跡も、これっぽっちもないぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-024"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "兄弟們正都歡喜，又聽得國王叫領關文：「赦你無罪。快去，快去。」行者道：「關文雖領，必須國師也赴曹砍砍頭，也當試新去來。」國王道：「大國師，那和尚也不肯放你哩。你與他賭勝，且莫諕了寡人。」虎力也只得去，被幾個劊子手也綑翻在地，幌一幌，把頭砍下，一腳也踢將去，滾了有三十餘步。他腔子裡也不出血，也叫一聲：「頭來！」行者即忙拔下一根毫毛，吹口仙氣，叫：「變！」變作一條黃犬，跑入場中，把那道士頭一口銜來，徑跑到御水河邊丟下不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      弟子たちが喜んでいると、また国王が通行証を受け取るように呼んだ。
      国王「罪は許す。早く行け、早く行け。」
      悟空「通行証はいただきますが、国師にも処刑場へ行って、首を斬っていただかねばなりません。あちらも初めての試しをしてきてこそ、道理ではありませんか。」
      国王「第一の国師、あの僧もそなたを放しておかぬと言うぞ。勝負するからには、朕を驚かせぬようにしてくれ。」
      虎力大仙も行かざるを得なかった。数人の首斬り役人に縛り倒され、ひらりと刀が振るわれると、首を斬り落とされた。頭は同じくひと蹴りされ、三十歩余り転がった。その胴からも血は出ず、やはり声がした。
      虎力大仙「頭よ、戻れ！」
      悟空は急いで毛を一本抜き、仙気を吹きかけた。
      悟空「変われ！」
      毛は黄色い犬となって場内へ駆け込み、道士の頭をひと口にくわえ、そのまま御水河（ぎょすいが）のほとりへ走って行って投げ捨てた。そのことはさておこう。
    "translation_status": "reviewed"
  - "id": "xy-ch46-025"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那道士連叫三聲，人頭不到，怎似行者的手段，長不出來，腔子中，骨都都紅光迸出。可憐空有喚雨呼風法，怎比長生果正仙。須臾，倒在塵埃。眾人觀看，乃是一隻無頭的黃毛虎。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 155
        "line_end": 155
    "translation_ja": "道士は続けて三度呼んだが、頭は戻らなかった。悟空ほどの腕があるわけではなく、生やすこともできない。胴からは、ぼうぼうと赤い光がほとばしった。哀れにも、雨を呼び、風を招く術があろうと、長生を成就した真の仙人には及ばない。ほどなく塵の中へ倒れ伏した。人々が見てみると、それは首のない、黄色い毛の虎であった。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-026"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那監斬官又來奏：「萬歲，大國師砍下頭來，不能長出，死在塵埃，是一隻無頭的黃毛虎。」國王聞奏，大驚失色，目不轉睛，看那兩個道士。鹿力起身道：「我師兄已是命倒祿絕了，如何是隻黃虎？這都是那和尚憊懶，使的掩樣法兒，將我師兄變作畜類。我今定不饒他，定要與他賭那剖腹剜心。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      監斬官がまた奏上に来た。
      監斬官「陛下、第一の国師は首を斬られた後、生やすことができず、地に倒れて死にました。首のない、黄色い毛の虎でございます。」
      国王は報告を聞くと顔色を変え、残る二人の道士を、まばたきもせずに見つめた。鹿力大仙が立ち上がった。
      鹿力大仙「兄は、運命も寿命も尽きたのでしょう。ですが、どうして黄色い虎などでありましょうか。すべて、あの悪賢い僧が目くらましの術を使い、兄を獣へ変えてしまったのです。私は決して許しません。必ず、腹を裂いて心臓をえぐる勝負をいたします。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-027"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王聽說，方才定性回神。又叫：「小和尚，二國師還要與你賭哩。」行者道：「小和尚久不吃煙火食，前日西來，忽遇齋公家勸飯，多吃了幾個饝饝，這幾日腹中作痛，想是生蟲，正欲借陛下之刀，剖開肚皮，拿出臟腑，洗淨脾胃，方好上西天見佛。」國王聽說，教：「拿他赴曹。」那許多人攙的攙，扯的扯。行者展脫手道：「不用人攙，自家走去。但一件：不許縛手，我好用手洗刷臟腑。」國王傳旨，教：「莫綁他手。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      国王はそれを聞いて、ようやく落ち着きを取り戻した。また呼びかけた。
      国王「若い僧よ、第二の国師が、まだ勝負したいそうだ。」
      悟空「私は長いこと、人の世の煮炊きした食事を口にしておりませんでした。先日、西へ参る途中、施主の家で食事を勧められ、蒸し饅頭をいくつか食べ過ぎまして、この数日、腹が痛むのです。きっと虫がわいたのでしょう。ちょうど陛下の刀をお借りして腹を裂き、内臓を取り出し、脾臓や胃をきれいに洗いたいと思っておりました。そうすれば、西天（さいてん）へ仏にお目にかかりに行けます。」
      国王は聞いて命じた。
      国王「処刑場へ連れて行け。」
      大勢が、支えるやら引っ張るやらした。悟空はその手を振りほどいた。
      悟空「支えてもらわなくていい。自分で歩いていく。ただ一つ、手は縛らないでくれ。内臓を手で洗えるようにな。」
      国王は命じた。
      国王「手は縛るな。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-028"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者搖搖擺擺，徑至殺場。將身靠著大樁，解開衣帶，露出肚腹。那劊子手將一條繩套在他膊項上，一條繩紮住他腿足，把一口牛耳短刀幌一幌，著肚皮下一割，搠個窟窿。這行者雙手爬開肚腹，拿出腸臟來，一條條理夠多時，依然安在裡面，照舊盤曲。捻著肚皮，吹口仙氣，叫：「長！」依然長合。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      悟空は悠々と体を揺らしながら、まっすぐ処刑場へ行った。大きな杭に背を寄せ、帯を解いて腹を出す。首斬り役人は一本の縄を肩から首へかけ、もう一本で脚を縛った。そして牛の耳のような形の短刀をひらりと振り、腹の皮を切って穴を開けた。悟空は両手で腹を開き、腸や内臓を取り出すと、一本一本、たっぷり時間をかけて整えた。やがてまた中へ収め、元どおりに巻き重ねた。腹の皮をつまみ合わせ、仙気を一息吹きかけた。
      悟空「つながれ！」
      腹は元どおりにつながった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-029"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王大驚，將他那關文捧在手中道：「聖僧莫誤西行，與你關文去罷。」行者笑道：「關文小可，也請二國師剖剖剜剜，何如？」國王對鹿力說：「這事不與寡人相干，是你要與他做對頭的，請去，請去。」鹿力道：「寬心，料我決不輸與他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      国王は大いに驚き、通行証を両手に捧げた。
      国王「聖僧、西への旅を遅らせてはならぬ。通行証を渡すから、行かれるがよい。」
      悟空は笑った。
      悟空「通行証は大したことではありません。第二の国師にも、腹を裂き、えぐっていただいては、いかがでしょう。」
      国王は鹿力大仙に言った。
      国王「このことは朕のせいではないぞ。そなたが自分で、あの者に張り合おうとしたのだ。さあ、行ってくれ、行ってくれ。」
      鹿力大仙「ご安心ください。私があの者に負けるはずはありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-030"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他也像孫大聖，搖搖擺擺，徑入殺場。被劊子手套上繩，將牛耳短刀唿喇的一聲，割開肚腹。他也拿出肝腸，用手理弄。行者即拔一根毫毛，吹口仙氣，叫：「變！」即變作一隻餓鷹，展開翅爪，颼的把他五臟心肝，盡情抓去，不知飛向何方受用。這道士弄做一個空腔破肚淋漓鬼，少臟無腸浪蕩魂。那劊子手蹬倒大樁，拖屍來看，呀！原來是一隻白毛角鹿。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      見れば鹿力大仙も、悟空のように悠々と身を揺らし、まっすぐ処刑場へ入った。首斬り役人に縄をかけられ、牛の耳のような短刀で、ざくりと腹を切り開かれた。鹿力大仙も肝臓や腸を取り出し、手で整えた。すると悟空が毛を一本抜き、仙気を吹きかけた。
      悟空「変われ！」
      毛はたちまち飢えた鷹となり、翼と爪を広げると、ひゅっと飛びかかって、五臓も心臓も肝臓も、残らずつかみ去った。どこへ飛んで行って食べたのかは分からない。道士はこうして、胴は空っぽ、腹は裂けて血まみれの亡者となり、臓腑も腸もないさまよう魂となった。首斬り役人が大杭を蹴り倒し、死骸を引き出して見てみると、何と、白い毛で角のある鹿であった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-031"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "慌得那監斬官又來奏道：「二國師晦氣，正剖腹時，被一隻餓鷹將臟腑肝腸都刁去了，死在那裡。原身是個白毛角鹿也。」國王害怕道：「怎麼是個角鹿？」那羊力大仙又奏道：「我師兄既死，如何得現獸形？這都是那和尚弄術法坐害我等。等我與師兄報仇者。」國王道：「你有甚麼法力贏他？」羊力道：「我與他賭下滾油鍋洗澡。」國王便教取一口大鍋，滿著香油，教他兩個賭去。行者道：「多承下顧。小和尚一向不曾洗澡，這兩日皮膚燥癢，好歹盪盪去。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      監斬官は慌てて、また奏上に来た。
      監斬官「第二の国師は不運にも、腹を裂いている最中、飢えた鷹に臓腑も肝臓も腸も、すべてさらわれて、その場で死にました。元の姿は白い毛で角のある鹿でございます。」
      国王はおびえた。
      国王「どうして、角のある鹿なのだ。」
      羊力大仙がまた奏上した。
      羊力大仙「兄が死んだからといって、どうして獣の姿が現れましょう。すべて、あの僧が術を使って、私どもを陥れているのです。私が兄の仇を討ちましょう。」
      国王「何の法力で、あの者に勝つのだ。」
      羊力大仙「煮えたぎる油の鍋で湯浴みをし、勝負いたします。」
      国王はそこで大鍋を一つ用意させ、ごま油をいっぱいに入れ、二人に勝負させた。
      悟空「ご配慮、まことにありがたく存じます。私はしばらく湯浴みをしておらず、この二日ほど、肌が乾いてかゆかったのです。何としても、一風呂浴びてきましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-032"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那當駕官果安下油鍋，架起乾柴，燃著烈火，將油燒滾，教和尚先下去。」行者合掌道：「不知文洗，武洗？」國王道：「文洗如何？武洗如何？」行者道：「文洗不脫衣服，似這般叉著手，下去打個滾，就起來，不許污壞了衣服，若有一點油膩算輸。武洗要取一張衣架，一條手巾，脫了衣服，跳將下去，任意翻觔斗，豎蜻蜓，當耍子洗也。」國王對羊力說：「你要與他文洗，武洗？」羊力道：「文洗恐他衣服是藥鍊過的，隔油。武洗罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      御前の役人は本当に油鍋を据え、乾いた薪を積み、激しく火を燃やして油を煮立たせ、僧に先に入るよう命じた。悟空は合掌した。
      悟空「文洗（ぶんせん）にいたしますか、それとも武洗（ぶせん）にいたしますか。」
      国王「文洗とはどうする。武洗とはどうする。」
      悟空「文洗は、衣を脱ぎません。こうして両手を胸の前で組み、入ってひと転がりして、すぐ出てきます。衣を汚してはならず、少しでも油じみが付いたら負けです。武洗は、衣桁を一つ、手拭いを一本用意し、衣を脱いで飛び込みます。自由に宙返りをしたり、逆立ちをしたり、遊びながら湯浴みするのです。」
      国王は羊力大仙に尋ねた。
      国王「文洗と武洗、どちらで勝負する。」
      羊力大仙「文洗では、衣に薬を染み込ませて、油をはじくようにしてあるかもしれません。武洗にいたしましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-033"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者又上前道：「恕大膽，屢次占先了。」你看他脫了布直裰，褪了虎皮裙，將身一縱，跳在鍋內，翻波鬥浪，就似負水一般頑耍。八戒見了，咬著指頭對沙僧道：「我們也錯看了這猴子了。平時間劖言訕語，鬥他耍子，怎知他有這般真實本事。」他兩個唧唧噥噥，誇獎不盡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      悟空はまた進み出た。
      悟空「失礼ながら、何度も先を取らせていただきます。」
      見ると、布の直裰を脱ぎ、虎皮の腰巻きも外し、ひと跳びして鍋へ飛び込んだ。波を立て、うねりを起こし、水を泳ぐのとまったく同じように遊んだ。八戒は見て、指をかみながら沙悟浄に言った。
      八戒「俺たちも、この猿を見損なっていたな。いつもは嫌みを言ったり、からかったりして遊んでいたが、こんな本物の腕を持っているとは思わなかった。」
      二人はひそひそ話しながら、いくら褒めても褒め足りないほどだった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-034"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者望見，心疑道：「那獃子笑我哩。正是『巧者多勞拙者閑』。老孫這般舞弄，他倒自在。等我作成他綑一繩，看他可怕？」正洗浴，打個水花，淬在油鍋底上，變作個棗核釘兒，再也不起來了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空はそれを見て、心の中で疑った。
      悟空「あの間抜けめ、俺を笑っているな。まさに『器用者は苦労が多く、不器用者は暇を持て余す』だ。俺がこうして立ち回っているのに、あいつは気楽なものだ。ひとつ世話を焼いて、縄にかけられるようにしてやろう。怖がるかどうか、見てやるぞ。」
      湯浴みの最中に水しぶきのように油をはねさせ、鍋底へ潜ると、小さな棗核釘（そうかくてい）に変わり、そのまま浮かび上がってこなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch46-035"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那監斬官近前又奏：「萬歲，小和尚被滾油烹死了。」國王大喜，教撈上骨骸來看。劊子手將一把鐵笊籬在油鍋裡撈。原來那笊籬眼稀，行者變得釘小，往往來來，從眼孔漏下去了，那裡撈得著。又奏道：「和尚身微骨嫩，俱炸化了。」國王教：「拿三個和尚下去。」兩邊校尉見八戒面兇，先揪翻，把背心綑了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      監斬官は進み出て、また奏上した。
      監斬官「陛下、若い僧は煮えたぎる油で煮殺されました。」
      国王は大いに喜び、骨をすくい上げて見せるよう命じた。首斬り役人が鉄の網杓子を入れ、油鍋の中をさらった。だが網の目は粗く、悟空の変わった釘は小さい。何度さらっても目の穴から抜け落ちてしまい、すくえるはずがなかった。また奏上した。
      監斬官「僧は体が小さく、骨も柔らかかったので、すべて揚がって溶けてしまいました。」
      国王「三人の僧を捕らえて下へ引け。」
      左右の兵士は、八戒の顔が恐ろしいので、まず彼を引き倒し、背中に縄をかけて縛った。
    "translation_status": "reviewed"
  - "id": "xy-ch46-036"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "慌得三藏高叫：「陛下，赦貧僧一時。我那個徒弟自從歸教，歷歷有功。今日衝撞國師，死在油鍋之內，奈何先死者為神。我貧僧怎敢貪生？正是天下官員也管著天下百姓。陛下若教臣死，臣豈敢不死？只望寬恩，賜我半盞涼漿水飯、三張紙馬，容到油鍋前，燒此一陌紙，也表我師徒一念，那時再領罪也。」國王聞言道：「也是，那中華人多有義氣。」命取些漿飯、黃錢與他。果然取了，遞與唐僧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      三蔵は慌てて大声を上げた。
      三蔵「陛下、しばらくお待ちください。あの弟子は仏門に帰依して以来、幾度となく功を立ててくれました。今日、国師に逆らって油鍋の中で死んでしまいましたが、先に死んだ者は神霊となると申します。私がどうして命を惜しみましょう。天下の役人は、天下の民を治めるもの。陛下が私に死ねとお命じなら、どうして死なずにいられましょうか。ただ、広いお情けで、冷たい漿水飯（しょうすいはん）を半盞（さん）と、紙馬（しば）を三枚、お与えください。油鍋の前へ行って、一陌（はく）の紙を焼かせていただきたいのです。それで私ども師弟の情を、せめて示したいと存じます。その後で、罪に服します。」
      国王は聞いて言った。
      国王「もっともだ。中華（ちゅうか）の者は義理を大切にするものだな。」
      漿水飯と黄色い紙銭を少し持ってくるよう命じると、ほどなく用意され、三蔵へ渡された。
    "translation_status": "reviewed"
  - "id": "xy-ch46-037"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧教沙和尚同去，行至階下，有幾個校尉把八戒揪著耳朵，拉在鍋邊。三藏對鍋祝曰：「徒弟孫悟空："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 175
        "line_end": 175
    "translation_ja": |-
      三蔵は沙悟浄に、一緒に来るよう言って階段を下りた。数人の兵士は八戒の耳をつかみ、鍋のそばへ引きずってきた。三蔵は鍋に向かい、弔いの言葉を述べた。
      三蔵「弟子の孫悟空（そんごくう）よ、
    "translation_status": "reviewed"
  - "id": "xy-ch46-038"
    "section_id": "chapter-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      自從受戒拜禪林，護我西來恩愛深。
      指望同時成大道，何期今日你歸陰。
      生前只為求經意，死後還存念佛心。
      萬里英魂須等候，幽冥做鬼上雷音。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 177
        "line_end": 180
    "translation_ja": |-
      戒めを受け、禅の道に入ってから、私を守って西へ来た、その恩と情は深い。
      ともに大道を成就することを願っていたのに、今日、お前があの世へ行こうとは。
      生きているあいだは、ただ経を求めようとし、死んだ後も、なお仏を念じる心は残る。
      万里を行く気高い魂よ、待っていておくれ。冥府の霊となっても、ともに雷音（らいおん）へ上ろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-039"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒聽見道：「師父，不是這般祝了。──沙和尚，你替我奠漿飯，等我禱。」那獃子綑在地下，氣呼呼的道：「闖禍的潑猴子，無知的弼馬溫；該死的潑猴子，油烹的弼馬溫。猴兒了帳，馬溫斷根。」孫行者在油鍋底上，聽得那獃子亂罵，忍不住現了本相，赤淋淋的站在油鍋底道：「饢糟的夯貨！你罵那個哩？」唐僧見了道：「徒弟，諕殺我也！」沙僧道：「大哥乾淨推佯死慣了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 181
        "line_end": 181
    "translation_ja": |-
      八戒はそれを聞いて言った。
      八戒「お師匠さま、そんな弔い方じゃ駄目です。沙悟浄、俺の代わりに漿水飯を供えてくれ。俺が祈るから。」
      八戒は地面に縛られたまま、ふうふう怒って言った。
      八戒「騒ぎを起こすろくでなしの猿、物知らずの弼馬温（ひつばおん）。死んで当然のろくでなしの猿、油で煮られた弼馬温。猿めはおしまい、馬温（ばおん）めは根絶やしだ。」
      悟空は油鍋の底で、八戒がむやみやたらにののしるのを聞き、とうとう我慢できなくなった。元の姿に戻り、素っ裸で鍋底に立った。
      悟空「汚らしい間抜け野郎！　誰をののしっているんだ。」
      三蔵はその姿を見て叫んだ。
      三蔵「悟空、どれほど驚かせたと思うのだ！」
      沙悟浄「兄さんは本当に、死んだふりをするのが癖になっているんですね。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-040"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "慌得那兩班文武上前來奏道：「萬歲，那和尚不曾死，又在油鍋裡鑽出來了。」監斬官恐怕虛誑朝廷，卻又奏道：「死是死了，只是日期犯兇，小和尚來顯魂哩。」行者聞言大怒，跳出鍋來，揩了油膩，穿上衣服，掣出棒，撾過監斬官，著頭一下，打做了肉團，道：「我顯甚麼魂哩？」諕得多官連忙解了八戒，跪地哀告：「恕罪，恕罪。」國王走下龍座，行者上殿扯住道：「陛下不要走，且教你三國師也下下油鍋去。」那皇帝戰戰兢兢道：「三國師，你救朕之命，快下鍋去，莫教和尚打我。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 183
        "line_end": 183
    "translation_ja": |-
      左右に並ぶ文武の官たちは、慌てて前へ出て奏上した。
      文武の官たち「陛下、あの僧は死んでおりません。また油鍋の中から出てまいりました。」
      監斬官は、朝廷を欺いたことになるのを恐れ、さらに奏上した。
      監斬官「死んだことは死んだのでございます。ただ、今日の日柄が凶に当たるので、あの僧の魂が現れたのです。」
      悟空はそれを聞いて激怒し、鍋から跳び出した。油を拭き、衣を着ると、棒を抜き、監斬官をつかまえて頭を一打し、肉の塊にしてしまった。
      悟空「俺の、どこが亡霊だ！」
      役人たちは震え上がって、急いで八戒の縄を解き、地にひざまずいて哀願した。
      役人たち「お許しください、お許しください。」
      国王は玉座から下りた。悟空は御殿へ上がり、その身を引き止めた。
      悟空「陛下、逃げてはなりません。まず、第三の国師にも油鍋へ入らせてください。」
      国王はがたがた震えながら言った。
      国王「第三の国師、朕の命を救ってくれ。早く鍋に入るのだ。この僧に朕を打たせるな。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-041"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "羊力下殿，照依行者脫了衣服，跳下油鍋，也那般支吾洗浴。行者放了國王，近油鍋邊，叫燒火的添柴。卻伸手探了一把，呀！那滾油都冰冷。心中暗想道：「我洗時滾熱，他洗時卻冷。我曉得了，這不知是那個龍王，在此護持他哩。」急縱身跳在空中，念聲「唵」字咒語，把那北海龍王喚來：「我把你這個帶角的蚯蚓，有鱗的泥鰍！你怎麼助道士，冷龍護住鍋底，教他顯聖贏我？」諕得那龍王喏喏連聲道：「敖順不敢相助。大聖原來不知，這個孽畜苦修行了一場，脫得本殼，卻只是五雷法真受，其餘都屣了傍門，難歸仙道。這個是他在小茅山學來的『大開剝』。那兩個已是大聖破了他法，現了本相。這一個也是他自己煉的冷龍，只好哄瞞世俗之人耍子，怎瞞得大聖？小龍如今收了他冷龍，管教他骨碎皮焦。」行者道：「趁早收了，免打。」那龍王化一陣旋風，到油鍋邊，將冷龍捉下海去不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      羊力大仙は御殿を下り、悟空をまねて衣を脱ぎ、油鍋へ飛び込んだ。そして同じように、立ち回りながら湯浴みをした。悟空は国王を放し、鍋のそばへ行って、火をたく者に薪を足すよう言った。ところが手を入れてみると、何と、煮え立っているはずの油が、すっかり氷のように冷たい。悟空は心の中で考えた。
      悟空「俺が入ったときは煮えたぎっていたのに、あいつが入ると冷たい。分かったぞ。どこかの竜王が、ここであいつを守っているに違いない。」
      急いで空へ跳び上がり、唵（おん）の一字の呪を唱えて、北海竜王（ほっかいりゅうおう）を呼び寄せた。
      悟空「この、角の生えたミミズ、鱗のあるドジョウめ！　なぜ道士を助けるんだ。冷竜（れいりゅう）に鍋底を守らせて、あいつに神通力を見せつけさせて、俺を負かそうというのか。」
      おびえた竜王は、何度もかしこまって答えた。
      北海竜王「この敖順（ごうじゅん）は、助けなどいたしておりません。大聖（たいせい）さまはご存じなかったのでございます。この畜生は苦しい修行を積み、もとの殻を脱ぎましたが、正しく授かったのは五雷法だけです。それ以外はすべて脇道へ踏み込み、仙人の道にはなかなか入れません。これは、小茅山（しょうぼうざん）で学んだ大開剝（だいかいはく）という術です。あの二人は、すでに大聖さまが術を破り、元の姿を現しました。今ここにいる者も、自分で煉った冷竜を使っているだけです。俗世の人をだまして遊ぶことはできても、どうして大聖さまをだませましょう。私が今、その冷竜を取り上げれば、必ず骨は砕け、皮は焦げます。」
      悟空「打たれたくなければ、さっさと取り上げろ。」
      北海竜王は一陣のつむじ風となって鍋のそばへ行き、冷竜を捕らえて海へ連れ去った。そのことはさておこう。
    "translation_status": "reviewed"
  - "id": "xy-ch46-042"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者下來，與三藏、八戒、沙僧立在殿前，見那道士在滾油鍋裡打掙，爬不出來。滑了一跌，霎時間骨脫皮焦肉爛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 186
        "line_end": 186
    "translation_ja": "悟空は下りてきて、三蔵、八戒、沙悟浄とともに御殿の前へ立った。見ると、羊力大仙は煮えたぎる油鍋の中でもがき、よじ登って出ようとしても出られない。足を滑らせて倒れると、またたく間に骨は外れ、皮は焦げ、肉は崩れた。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-043"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "監斬官又來奏道：「萬歲，三國師煠化了也。」那國王滿眼垂淚，手撲著御案，放聲大哭道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 188
        "line_end": 188
    "translation_ja": |-
      監斬官がまた奏上に来た。
      監斬官「陛下、第三の国師は揚がって溶けてしまいました。」
      国王は両目から涙をあふれさせ、御机を手でたたき、大声で泣いた。
    "translation_status": "reviewed"
  - "id": "xy-ch46-044"
    "section_id": "chapter-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「人身難得果然難，不遇真傳莫煉丹。
      空有驅神咒水術，卻無延壽保生丸。
      圓明混，怎涅槃？徒用心機命不安。
      早覺這般輕折挫，何如秘食穩居山？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 189
        "line_end": 192
    "translation_ja": |-
      国王「人の身を得ることの難しさよ、まことに難しい。真の伝授に出会わぬなら、丹（たん）を煉ることなかれ。
      神を使い、水に呪をかける術はあっても、寿命を延ばし命を守る霊薬はない。
      円明（えんみょう）の心が濁っていて、どうして涅槃（ねはん）へ至れよう。むなしく知恵を巡らせても、命は安らかでない。
      こんなにもあっけなく命を折られると早くに知っていたなら、ひそかに食をとり、山に落ち着いて暮らすほうが、よかったではないか。」
    "translation_status": "reviewed"
  - "id": "xy-ch46-045"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 194
        "line_end": 194
    "translation_ja": "まさしく、こういうことだ。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-046"
    "section_id": "chapter-46"
    "kind": "verse"
    "origin": "source"
    "source_text": "點金煉汞成何濟，喚雨呼風總是空！"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 196
        "line_end": 196
    "translation_ja": "金を生み、水銀を煉っても、何の役に立とう。雨を呼び、風を招いても、結局はすべて空しい！"
    "translation_status": "reviewed"
  - "id": "xy-ch46-047"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知師徒們怎的維持，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 198
        "line_end": 198
    "translation_ja": "さて、この先、師弟はどのように事を収めるのか。それは次回のお話。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-01-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の外道は仏教の正しい教えに外れる者という宗教的立場からの呼び名。心猿は落ち着かない心を猿にたとえる語で、ここでは悟空にも重なる。題の評価を現代の宗教一般に対する判定とはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-02-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「抓了丟去」は、道士たちが法力の競争で軽くあしらわれ、名声を傷つけられたという訴えとして訳した。実際につかんで投げ捨てる新たな出来事を補ってはいない。時辰は古い時刻単位であり、机の高さや年数とともに、現代の厳密な時間・長さへは換算しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-03-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空の「踢天弄井」は、天にも地にも自在に働きかけるほど腕前が高いという慣用的な誇張。教育部『重編國語辭典修訂本』も本領高強をたとえる語とする。訳では天と井戸の字面を残すが、実演された個別の術名や仕組みとは断定しない。三蔵の性命・定性存神・死生関は、本性と生命、精神の集中、生死の関門という修行上の語として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-04-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "羊兒風はてんかん様の発作、頭風は頭痛などをいう古い病名。八戒と沙悟浄が見た動作に対して述べる判断であり、三蔵の実際の診断を語り手が保証したものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-05-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鹿力大仙の暗風疾は、発作を起こす持病と解した。古い医書『聖濟總録纂要』巻二にも暗風癎病の語が見えるが、ここで現代の特定の診断に同定したり、病を秘密にしていたと解したりはしない。虎力大仙の転落の真因を病気と認定するのではなく、鹿力大仙の弁解として保存する。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-06-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "山河社稷襖と乾坤地理裙は、対になる宮中の上衣と裳の名称。衣の図柄や製法の細部は記されない。一口鐘は鐘そのものではなく、上が狭く裾が広がる長い外衣。教育部『重編國語辭典修訂本』の第二義を参照した。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-07-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「三宮皇后」とする。三宮は后妃の宮や后妃をまとめて指しうるが、ここでは梓童という自称を伴う一続きの発言である。訳では「三宮の皇后」として原語を残し、三人の掛け合いや個人名を創作しない。また、御苑の仙桃を、天界の蟠桃園の桃と同一の物だとは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-08-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三官経・北斗経・消災経は道童が知る道教側の経典名として残した。類題・同名の経があり、ここでは正式題名や巻数を特定しない。鶴氅は本来羽毛の衣をいうこともあるが、ここでは原文が絹と刺繍の衣だと明記するため、羽毛製とは訳さない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-09-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵の「這番他準贏了」は、直後に和尚も三宝の一つだから宝物を当てる条件に合うと説明する文脈に沿って、「それなら今度こそ、きっと勝てる」と訳した。他の指示対象には揺れがあり、原文の代名詞を別字に補訂してはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-10-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "山名は底本の鍾南山を保持した。通用する終南山へ無断で字を改めたり、地理的な同一性を確定したりしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-11-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "六陽は、伝統的な身体観で頭へ集まるとされた手足の陽の経脈を指す。明代の『證治準繩』巻十二にも首を六陽の集まる所とする表現がある。ここでは国王の説明として訳し、現代医学の記述とはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-12-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「開刀！」という号令の主語は明記されないため、「刑場の声」とした。監斬官や首斬り役人のどちらかに推測で限定しない。沙悟浄の「七十二の変化だから七十二の頭」は、その人物の説明であり、悟空の能力の客観的な上限として確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-13-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この御水河は、場面上、車遅国の王宮付近の川である。宝象国や烏鶏国に出た同名の川と、地理的に同一だとはみなさない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-14-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "虎力大仙の黄毛の虎の姿はここで初めて明示される。鹿力大仙の「悟空が獣に変えた」という次の訴えは、本人の言い分として残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-15-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "鹿力大仙の白毛で角のある鹿の姿はこの段落で初めて明示される。羊力大仙の「悟空が陥れた」という次の訴えは、本人の言い分として残す。羊力大仙の動物種は本回では明かされない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-16-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本では、油鍋へ先に入らせる叙述の末尾に、対応する始め括弧のない閉じ括弧がある。原文欄はそのまま保ち、訳文では地の文として処理した。文洗・武洗は、この場で悟空が説明する勝負の方式であり、一般的な入浴作法だとは断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-17-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "漿水飯は死者に供える水や米の汁を伴う飯として解した。教育部辞典「忌辰」が引く『琵琶記』にも涼漿水飯を供える用例があるが、具体的な材料や作り方はここでは確定しない。一陌はおよそ百文の紙銭一つづりをいうが、三枚の紙馬との数量関係が明示されないため、百枚へ換算しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-18-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "敖順は、羊力大仙が正しく授かったのは五雷法だけで、ほかは脇道の術だと説明し、先に倒れた二人も悟空に術を破られたと述べる。大開剝が三種の競技すべてを指すか、油鍋に関わる一術を主に指すかには留保がある。冷竜は本人が煉ったものとの説明を保持し、敖順の化身に置き換えない。原文の「屣了傍門」は、旁門へ踏み入れたという文脈で訳し、原字を訂正しない。本回は北海竜王が「敖順」と名乗るため、第43・45回で同じ名を用いる西海の竜王とは役割で区別し、原文の名は訂正しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-19-body"
    "section_id": "chapter-46"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本では先に監斬官が悟空に打ち殺された後、この段落で再び監斬官が奏上する。別人への交代や蘇生は記されないため、訳でも説明を創作せず、役職名をそのまま残した。"
    "translation_status": "reviewed"

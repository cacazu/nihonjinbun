    "translation_ja": |-
      三蔵「また来たぞ。」
      悟空「私が見てきます。」
      ぶんと飛び、箱の中へ潜り込んでみると、小さな道童がいた。さすがは悟空、知恵が働く。これほどの変化は天下にまれ、これほどの機転は世間にない。身を震わせて老道士の姿となり、箱の中で呼びかけた。
      悟空「弟子よ。」
      道童「師父、どこから来られたのですか。」
      悟空「遁法（とんぽう）を使って来たのだ。」
      道童「何をお教えくださるのですか。」
      悟空「あの僧は、お前が箱へ入るところを見ていた。道童だと答えたら、またこちらの負けになるだろう。そこで、わざわざ相談に来たのだ。頭をそって、こちらは和尚だと当てることにしよう。」
      道童「師父のおっしゃるとおりにいたします。あちらに勝てさえすればよいのです。今度も負けたら、名声が落ちるだけでなく、朝廷から敬われなくなるのではと心配です。」
      悟空「そのとおりだ。さあ、お前、こちらへ来なさい。勝ったら、たっぷり褒美をやろう。」
      悟空は金箍棒（きんこぼう）をかみそりに変え、道童を抱え込んで言った。
      悟空「いい子だ、痛くても我慢して、声を出すなよ。頭をそってやるからな。」
      たちまち髪をそり落とし、一つに丸めて箱の脚の隅へ押し込んだ。かみそりを収め、つるつる頭をなでた。
      悟空「お前の頭は、これで和尚らしくなった。だが衣が合わない。脱ぎなさい。変えてやろう。」
      道童が着ていたのは、薄い青緑の絹に雲の模様を織り、錦の刺繍で縁を飾った鶴氅（かくしょう）であった。言うとおりに脱ぐと、悟空は仙気を一息吹きかけた。
      悟空「変われ！」
      衣はすぐに土色の直裰（ちょくたつ）に変わり、それを道童に着せた。さらに毛を二本抜き、木魚に変えて手に渡した。
      悟空「弟子よ、よく聞くのだ。道童と呼ばれたら、決して出てはならない。和尚と呼ばれたら、箱の蓋を押し上げ、木魚をたたき、仏のお経を一巻唱えながら出てくるのだ。そうしてこそ成功する。」
      道童「私が唱えられるのは三官経（さんかんきょう）、北斗経（ほくときょう）、消災経（しょうさいきょう）だけです。仏教のお経は知りません。」
      悟空「では、仏の名は唱えられるか。」
      道童「阿弥陀仏（あみだぶつ）。それなら、誰でも唱えられます。」
      悟空「よし、よし。それを唱えればいい。わざわざ教える手間も省ける。忘れるなよ。私は行くぞ。」
      また蟭蟟虫に変わって潜り出し、三蔵の耳の縁へ飛んだ。
      悟空「お師匠さま、今度は和尚だと言ってください。」
      三蔵「それなら今度こそ、きっと勝てる。」
      悟空「どうして、そう言い切れるのです。」
      三蔵「経典には『仏・法・僧の三宝（さんぼう）』とある。和尚も、宝の一つではないか。」

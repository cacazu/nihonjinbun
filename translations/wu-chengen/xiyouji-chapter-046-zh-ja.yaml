    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "金を生むことと水銀を煉ることは錬金・煉丹の術を指す。物語の結句が法術のむなしさを述べるのであり、化学的な実践方法として提示するものではない。"
    "translation_status": "reviewed"

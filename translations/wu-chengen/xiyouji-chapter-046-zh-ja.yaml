    "source_text": "三藏正要開言，聽得那羊力大仙道：「貧道先猜，是一顆仙桃。」三藏猜道：「不是桃，是個光桃核子。」那國王喝道：「是朕放的仙桃，如何是核？三國師猜著了。」三藏道：「陛下，打開來看就是。」當駕官又擡上去打開，捧出丹盤，果然是一個核子，皮肉俱無。國王見了，心驚道：「國師，休與他賭鬥了，讓他去罷。寡人親手藏的仙桃，如今只是一核子，是甚人吃了？想是有鬼神暗助他也。」八戒聽說，與沙僧微微冷笑道：「還不知他是會吃桃子的積年哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 132

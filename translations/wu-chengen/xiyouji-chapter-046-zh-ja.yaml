    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「圓明混」は、円明の心が濁っているという意味に解した。「秘食」は原字に沿って、ひそかに食をとると訳した。避世の暮らしや特殊な養生法などとの関係は確定せず、他版の字句で補訂していない。国王の嘆きの詩であることも保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch46-note-21-body"

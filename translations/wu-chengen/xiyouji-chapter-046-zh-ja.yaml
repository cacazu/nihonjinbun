    "source_text": "三藏道：「又來了！」行者道：「等我再去看看。」嚶的又飛去，鑽入裡面，見是一個小童兒。好大聖，他卻有見識，果然是騰那天下少，似這伶俐世間稀。他就搖身一變，變作個老道士一般容貌，進櫃裡，叫聲：「徒弟。」童兒道：「師父，你從那裡來的？」行者道：「我使遁法來的。」童兒道：「你來有甚麼教誨？」行者道：「那和尚看見你進櫃來了，他若猜個道童，卻不又輸了？是特來和你計較計較：剃了頭，我們猜和尚罷。」童兒道：「但憑師父處治，只要我們贏他便了；若是再輸與他，不但低了聲名，又恐朝廷不敬重了。」行者道：「說得是。我兒過來，贏了他，我重重賞你。」將金箍棒就變作一把剃頭刀，摟抱著那童兒，口裡叫道：「乖乖，忍著疼，莫放聲，等我與你剃頭。」須臾，剃下髮來，窩作一團，塞在那櫃腳紇絡裡。收了刀兒，摸著他的光頭道：「我兒，頭便像個和尚，只是衣裳不趁。脫下來，我與你變一變。」那道童穿的一領蔥白色雲頭花絹繡錦沿邊的鶴氅，真個脫下來。被行者吹一口仙氣，叫：「變！」即變做一件土黃色的直裰兒，與他穿了。卻又拔下兩根毫毛，變作一個木魚兒，遞在他手裡道：「徒弟，須聽著：但叫道童，千萬莫出去；若叫和尚，你就與我頂開櫃蓋，敲著木魚，念一卷佛經鑽出來，方得成功也。」童兒道：「我只會念《三官經》、《北斗經》、《消災經》，不會念佛家經。」行者道：「你可會念佛？」童兒道：「阿彌陀佛，那個不會念？」行者道：「也罷，也罷，就念佛，省得我又教你。切記著，我去也。」還變蟭蟟蟲，鑽出去，飛在唐僧耳輪邊道：「師父，你只猜是個和尚。」三藏道：「這番他準贏了。」行者道：「你怎麼定得？」三藏道：「經上有云：『佛、法、僧三寶。』和尚卻也是一寶。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

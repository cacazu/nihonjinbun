    "translation_ja": |-
      三蔵が口を開こうとしたとき、羊力大仙（ようりきたいせん）が言った。
      羊力大仙「私が先に当てましょう。仙桃が一つです。」
      三蔵「桃ではありません。つるつるの桃の種です。」
      国王は叱りつけた。
      国王「朕が入れた仙桃だ。どうして種であるものか。第三の国師が当てたぞ。」
      三蔵「陛下、開けてご覧になれば分かります。」
      御前の役人はまた箱を運び上げて開き、朱塗りの盆を取り出した。果たして種が一つあるだけで、皮も果肉も残っていない。国王は見て驚いた。
      国王「国師、もう勝負はやめよ。通してやるのだ。朕がこの手で隠した仙桃が、今では種一つになっておる。誰が食べたのだ。きっと神霊がひそかに、あの者たちを助けているのであろう。」
      それを聞いた八戒は、沙悟浄に小さくせせら笑って言った。
      八戒「あの人はまだ、兄貴が桃食いの年季の入った大物だと知らないんだな。」

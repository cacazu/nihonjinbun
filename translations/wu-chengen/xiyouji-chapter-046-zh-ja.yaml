    "source_text": "國王道：「這和尚是有鬼神輔佐。怎麼道士入櫃，就變做和尚？縱有待詔跟進去，也只剃得頭便了，如何衣服也能趁體，口裡又會念佛？國師啊，讓他去罷。」虎力大仙道：「陛下，左右是棋逢對手，將遇良材。貧道將鍾南山幼時學的武藝，索性與他賭一賭。」國王道：「有甚麼武藝？」虎力道：「弟兄三個，都有些神通：會砍下頭來，又能安上；剖腹剜心，還再長完；滾油鍋裡，又能洗澡。」國王大驚道：「此三事都是尋死之路。」虎力道：「我等有此法力，才敢出此朗言，斷要與他賭個才休。」那國王叫道：「東土的和尚，我國師不肯放你，還要與你賭砍頭、剖腹、下滾油鍋洗澡哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"

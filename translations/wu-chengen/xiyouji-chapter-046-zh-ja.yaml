    "source_text": "正說處，只見那虎力大仙道：「陛下，第三番是個道童。」只管叫，他那裡肯出來。三藏合掌道：「是個和尚。」八戒盡力高叫道：「櫃裡是個和尚。」那童兒忽的頂開櫃蓋，敲著木魚，念著佛，鑽出來。喜得那兩班文武齊聲喝采。諕得那三個道士拑口無言。"

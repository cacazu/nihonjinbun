  - "id": "xy-ch46-013"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正話間，只見那虎力大仙從文華殿梳洗了，走上殿道：「陛下，這和尚有搬運抵物之術。擡上櫃來，我破他術法，與他再猜。」國王道：「國師還要猜甚？」虎力道：「術法只抵得物件，卻抵不得人身。將這道童藏在裡面，管教他抵換不得。」這小童果藏在櫃裡，掩上櫃蓋，擡將下去，教：「那和尚再猜，這三番是甚寶貝？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      こう話していると、虎力大仙が文華殿で身を洗い、身なりを整えて御殿へ戻ってきた。
      虎力大仙「陛下、あの僧には物を移し、すり替える術があるのです。箱を運んでください。私がその術を破り、もう一度当て合いましょう。」
      国王「国師、今度は何を当てるのだ。」
      虎力大仙「術で物は取り替えられても、人の体は取り替えられません。この道童を中へ隠せば、決してすり替えられないはずです。」
      そこで道童を箱に隠し、蓋を閉めて下へ運んだ。
      声の主「僧よ、もう一度当ててみよ。この三度目の宝物は何だ。」

    "kind": "paragraph"
    "origin": "source"
    "source_text": "唐僧道：「徒弟啊，又來猜了。」行者道：「放心，等我再去看看。」又嚶的一聲，飛將去，還從板縫兒鑽進去，見是一個桃子，正合他意。即現了原身，坐在櫃裡，將桃子一頓口啃得乾乾淨淨，連兩邊腮凹兒都啃淨了，將核兒安在裡面。仍變蟭蟟蟲，飛將出去，釘在唐僧耳朵上道：「師父，只猜是個桃核子。」長老道：「徒弟啊，休要弄我。先前不是口快，幾乎拿去典刑。這番須猜寶貝方好。桃核子是甚寶貝？」行者道：「休怕，只管贏他便了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      三蔵「また当てよというぞ。」
      悟空「ご安心ください。もう一度見てきます。」
      またぶんと飛んで、板の隙間から潜り込むと、今度は桃である。ちょうど悟空の好みにぴったりだった。すぐに元の姿に戻り、箱の中へ座って、桃をむしゃむしゃかじった。左右のくぼみに付いた果肉まできれいに食べ尽くし、種だけを中に置いておいた。また蟭蟟虫に変わって飛び出し、三蔵の耳に止まった。
      悟空「お師匠さま、桃の種だと言ってください。」
      三蔵「私をからかってはならぬぞ。さっきも、とっさに口が回らなければ、危うく処刑されるところだった。今度こそ、宝物を言い当てなければならない。桃の種が何の宝になるのだ。」
      悟空「恐れることはありません。ただ、あいつに勝てばいいのです。」

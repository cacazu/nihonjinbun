    "translation_ja": |-
      国王「この僧には、神霊の助けがあるのだ。道士が箱に入ったのに、どうして和尚に変わる。たとえ床屋がついて入っても、頭をそれるだけではないか。衣まで体に合い、口では念仏まで唱えるとは、どういうことだ。国師、通してやるがよい。」
      虎力大仙「陛下、こうなればまさに、碁の打ち手が好敵手に出会い、将軍が優れた相手に巡り会ったというものです。いっそ、幼いころ鍾南山（しょうなんざん）で学んだ武芸で、勝負したいと存じます。」
      国王「どのような武芸だ。」
      虎力大仙「私ども兄弟三人は、多少の神通力を持っております。頭を斬り落とされても、また付けられます。腹を裂かれ、心臓をえぐられても、また元どおりに生えそろいます。煮えたぎる油の鍋で、湯浴みもできます。」
      国王は大いに驚いた。
      国王「その三つは、どれも死にに行く道ではないか。」
      虎力大仙「その法力があるからこそ、こうして大きなことを申し上げるのでございます。どうしても勝負しなければ、収まりません。」
      国王は呼びかけた。
      国王「東土（とうど）の僧よ、国師はそなたたちを通すと言わぬ。まだ、首斬り、腹裂き、煮えたぎる油鍋での湯浴みで勝負したいそうだ。」

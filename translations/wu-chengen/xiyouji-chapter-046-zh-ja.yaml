      こう話していると、虎力大仙が言った。
      虎力大仙「陛下、三度目は道童です。」
      道童、道童と呼び続けたが、出てくるはずがない。三蔵が合掌した。
      三蔵「和尚です。」
      八戒も力いっぱい叫んだ。
      八戒「箱の中は和尚だ！」
      すると道童が突然蓋を押し上げ、木魚をたたき、仏の名を唱えながら出てきた。左右に並ぶ文武の官たちは喜び、一斉に喝采した。三人の道士は驚き、口をつぐんで何も言えなくなった。

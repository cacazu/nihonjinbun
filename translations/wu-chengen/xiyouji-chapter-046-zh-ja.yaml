  - "id": "xy-ch46-002"
    "section_id": "chapter-46"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說那國王見孫行者有呼龍使聖之法，即將關文用了寶印，便要遞與唐僧，放行西路。那三個道士慌得拜倒在金鑾殿上啟奏。那皇帝即下龍位，御手忙攙道：「國師今日行此大禮，何也？」道士說：「陛下，我等至此匡扶社稷，保國安民，苦歷二十年來今日這和尚弄法力，抓了丟去，敗了我們聲名。陛下以一場之雨，就恕殺人之罪，可不輕了我等也？望陛下且留住他的關文，讓我兄弟與他再賭一賭，看是何如？」那國王著實昏亂，東說向東，西說向西，真個收了關文，道：「國師，你怎麼與他賭？」虎力大仙道：「我與他賭坐禪。」國王道：「國師差矣。那和尚乃禪教出身，必然先會禪機，才敢奉旨求經，你怎與他賭此？」大仙道：「我這坐禪，比常不同，有一異名，教做雲梯顯聖。」國王道：「何為雲梯顯聖？」大仙道：「要一百張桌子，五十張作一禪臺，一張一張疊將起去，不許手攀而上，亦不用梯凳而登，各駕一朵雲頭，上臺坐下，約定幾個時辰不動。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch46-1557967"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第046回&oldid=1557967"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて、国王は悟空（ごくう）に竜神を呼び、聖なる者たちを従わせる力があると知ると、通行証に宝印を押し、三蔵（さんぞう）へ渡して西への旅を許そうとした。三人の道士は慌てて金鑾殿（きんらんでん）にひれ伏し、奏上した。国王はすぐに玉座を下り、自ら手を差し伸べて起こそうとした。
      国王「国師（こくし）、今日はどうして、そのような大礼を取るのだ。」
      道士たち「陛下、私どもはこの地に参り、国を支え、民を守り、苦労を重ねて二十年になります。それなのに今日、あの僧が法力を振るって私どもをつまみ捨てるように扱い、名声を台無しにいたしました。陛下は一雨降らせたというだけで殺人の罪をお許しになる。これでは私どもを軽んじることになりませんか。どうか、あの者の通行証をしばらくお留めください。私ども兄弟がもう一度勝負いたしたく存じますが、いかがでしょう。」
      まことに分別のない国王は、東と言われれば東へ、西と言われれば西へとなびく。実際に通行証を引っ込めてしまった。
      国王「国師、何で勝負するのだ。」
      虎力大仙（こりきたいせん）「座禅で勝負いたします。」
      国王「国師、それは間違っている。あの僧は禅の教えを修めた者だ。禅の奥義を心得ているからこそ、勅命を奉じて経を求めようというのであろう。なぜ、それで勝負するのだ。」
      虎力大仙「私の座禅は、普通のものとは違います。別名を雲梯顕聖（うんていけんせい）と申します。」
      国王「雲梯顕聖とは何だ。」
      虎力大仙「机を百脚用意し、五十脚ずつ一脚の上にもう一脚と積み上げて、二つの禅台を作ります。手をかけて登ってはならず、梯子や踏み台も使いません。各々雲に乗って台へ上がり、座ったまま、定めた数時辰（じしん）のあいだ動かずにいるのです。」
    "translation_status": "reviewed"

- "id": "xy-ch100-014"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    君王嘉會賽唐虞，取得真經福有餘。
    千古流傳千古盛，佛光普照帝王居。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 142

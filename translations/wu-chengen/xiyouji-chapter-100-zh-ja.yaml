  "translation_ja": "師弟四人がようやく人々のもとを抜け出し、金剛（こんごう）たちについて風に乗ったことは、ひとまず置こう。さて、陳家荘（ちんかそう）の救生寺（きゅうしょうじ）にいた人々は、夜が明けると、また果物や料理を用意して供えに来た。ところが楼の下まで来ると、三蔵（さんぞう）の姿がない。あちらで尋ね、こちらで捜し、皆がおろおろして、どうしたらよいか分からない。人々は口々に嘆いた。「みすみす、生き仏さまをお帰ししてしまった！」しばらくしても手立てはなく、用意した供物をすべて楼上に運び、紙銭（しせん）を焼いてまつった。それからは、毎年四度の大祭と二十四度の小祭を営んだ。病の平癒や無事を祈る者、縁談を願い誓願を立てる者、財や子を授かりたいと願う者も、日々絶えることなく、香をたき、願ほどきの供え物をした。まさしく、金の香炉には千年の火が絶えず、玉の灯明皿には万年の灯がともる。この話はここまでとしよう。"
  "translation_status": "reviewed"
- "id": "xy-ch100-003"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說八大金剛使第二陣香風，把他四眾，不一日送至東土，漸漸望見長安。原來那太宗自貞觀十三年九月望前三日送唐僧出城，至十六年，即差工部官在西安關外起建了望經樓接經。太宗年年親至其地。恰好那一日出駕復到樓上，忽見正西方滿天瑞靄，陣陣香風。金剛停在空中叫道：「聖僧，此間乃長安城了。我們不好下去，這裡人伶俐，恐泄漏吾像。孫大聖三位也不消去。汝自去傳了經與汝主，即便回來，我在霄漢中等你，與你一同繳旨。」大聖道：「尊者之言雖當，但吾師如何挑得經擔？如何牽得這馬？須得我等同去一送。煩你在空少等，諒不敢誤。」金剛道：「前日觀音菩薩啟過如來，往來只在八日，方完藏數。今已經四日有餘，只怕八戒貪圖富貴，誤了期限。」八戒笑道：「師父成佛，我也望成佛，豈有貪圖之理？潑大粗人？都在此等我，待交了經，就來與你回向也。」獃子挑著擔，沙僧牽著馬，行者領著聖僧，都按下雲頭，落於望經樓邊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 122
    "line_end": 122
    "source_sequence": 3
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    八大金剛（はちだいこんごう）は、ふたたび香る風を起こし、一日もかからずに師弟四人を東の国へ送った。しだいに長安（ちょうあん）が見えてくる。もともと太宗（たいそう）は、貞観（じょうがん）十三年九月の十五日より三日前、三蔵を城外まで見送った。その後、十六年になると、工部（こうぶ）の役人に命じ、西安関（せいあんかん）の外に望経楼（ぼうけいろう）を建てさせ、経の到来を迎える場所とした。太宗は毎年、みずからそこへ出向いていた。ちょうどその日も行幸して楼に上がると、真西の空いっぱいにめでたい霞が広がり、香る風が幾度も吹いてくるのが見えた。八大金剛は空中にとどまって呼びかけた。「聖僧、ここが長安の城です。私たちは下りないほうがよいでしょう。ここの人々は目ざといので、姿を知られるおそれがあります。孫大聖（そんたいせい）たち三人も行くには及びません。あなた一人で行って、ご主君に経をお渡しになり、すぐに戻ってください。私たちは空の上で待っていますから、一緒に帰って命令を果たしたことを報告しましょう。」
    悟空（ごくう）「尊者のお言葉はもっともですが、お師匠さま一人でどうして経の荷を担ぎ、馬まで引けましょう。私たちも一緒にお送りしなくてはなりません。どうか空中で少しお待ちください。決して遅れるようなことはいたしません。」
    八大金剛「先日、観音菩薩（かんのんぼさつ）が如来（にょらい）に申し上げたとおり、往復を八日で済ませてこそ、一蔵（いちぞう）の経の数に合うのです。もう四日余りが過ぎています。八戒（はっかい）が富貴に心を奪われ、期限を過ぎてしまわないかと心配なのです。」
    八戒は笑った。「お師匠さまが仏になるなら、俺だって仏になりたいんだ。富貴に目がくらむわけがあるか。この無骨者め！　皆ここで待っていてくれ。経を渡したら、すぐに戻って、お前たちと功徳（くどく）を回向（えこう）するから。」
    八戒は荷を担ぎ、沙悟浄（さごじょう）は馬を引き、悟空は三蔵を案内した。皆で雲を下げ、望経楼のそばへ降り立った。
  "translation_status": "reviewed"
- "id": "xy-ch100-004"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗同多官一齊見了，即下樓相迎道：「御弟來也？」唐僧即倒身下拜。太宗攙起，又問：「此三者何人？」唐僧道：「是途中收的徒弟。」太宗大喜，即命侍官：「將朕御車馬扣背，請御弟上馬，同朕回朝。」唐僧謝了恩，騎上馬。大聖輪金箍棒緊隨，八戒、沙僧俱扶馬、挑擔，隨駕後共入長安。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 123
    "line_end": 123
    "source_sequence": 4
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    太宗と役人たちは、一斉にその姿を見つけた。太宗は楼を下りて出迎え、声をかけた。「御弟（ぎょてい）、帰ってきたのか！」
    三蔵はすぐに身を伏せて拝んだ。太宗は助け起こし、また尋ねた。「この三人は誰なのだ。」
    三蔵「道中で迎え入れた弟子たちでございます。」
    太宗は大いに喜び、侍従に命じた。「朕の御車の馬に鞍をつけ、御弟に乗っていただけ。一緒に宮中へ戻ろう。」
    三蔵は恩に感謝し、馬に乗った。悟空は金箍棒（きんこぼう）を振るってすぐそばにつき、八戒と沙悟浄は馬を支え、荷を担いで、車駕のあとに従い、ともに長安へ入った。まさに、
  "translation_status": "reviewed"
- "id": "xy-ch100-005"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    當年清宴樂昇平，文武安然顯俊英。
    水陸場中僧演法，金鑾殿上主差卿。
    關文敕賜唐三藏，經卷原因配五行。
    苦煉兇魔種種滅，功成今喜上朝京。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 125
    "line_end": 128
    "source_sequence": 5
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    その昔、世は安らかで、太平を楽しみ、文武の臣は穏やかに才を示した。
    水陸会（すいりくえ）の道場で僧は法を説き、金鑾殿（きんらんでん）で君主は使者を遣わした。
    三蔵には勅命の通行文書が授けられ、経を求める縁は五行（ごぎょう）と結ばれた。
    苦しい修行に、さまざまな凶魔を滅ぼし、功を成した今、喜びのうちに都へ参内する。
  "translation_status": "reviewed"
- "id": "xy-ch100-006"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧四眾隨駕入朝，滿城中無一不知是取經人來了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 130
    "line_end": 130
    "source_sequence": 6
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "三蔵たち四人は車駕に従って宮中へ向かった。経を求めに行った一行が戻ったと、城内の隅々まで知らぬ者はなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch100-007"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那長安唐僧舊住的洪福寺大小僧人，看見幾株松樹一顆顆頭俱向東，驚訝道：「怪哉！怪哉！今夜未曾刮風，如何這樹頭都扭過來了？」內有三藏的舊徒道：「快拿衣服來，取經的老師父來了。」眾僧問道：「你何以知之？」舊徒曰：「當年師父去時，曾有言道：『我去之後，或三五年，或六七年，但看松樹枝頭若是東向，我即回矣。』我師父佛口聖言，故此知之。」急披衣而出。至西街時，早已有人傳播說：「取經的人適才方到，萬歲爺爺接入城來了。」眾僧聽說，又急急跑來，卻就遇著。一見大駕，不敢近前，隨後跟至朝門之外。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 132
    "line_end": 132
    "source_sequence": 7
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    さて、長安で三蔵がかつて暮らしていた洪福寺（こうふくじ）では、僧たちが、何本かの松の梢がそろって東を向いているのを見て驚いた。僧たち「不思議だ、不思議だ！　昨夜は風も吹かなかったのに、どうして梢が皆、向きを変えたのだろう。」
    その中にいた三蔵の昔の弟子が言った。「早く衣を持ってきてくれ。経を取りに行かれたお師匠さまがお帰りだ。」
    僧たち「どうして、そうだと分かるのだ。」
    昔の弟子「お師匠さまは出発のとき、こうおっしゃった。『私が出かけてから、三、五年か、六、七年かは分からないが、松の枝先が東を向いたなら、私が戻ってくるのだ。』仏のお口から出た聖なるお言葉だ。それで分かるのだ。」
    皆は急いで衣をまとい、寺を出た。西の通りまで来ると、もう人々が言い伝えていた。「経を取りに行った方が、つい今しがたお戻りになった。陛下がお迎えになって、城に入られたぞ。」
    僧たちはそれを聞き、さらに急いで駆けていくと、ちょうど一行に行き会った。天子の車駕が見えるので近寄ることはできず、あとに従って宮門の外まで来た。
  "translation_status": "reviewed"
- "id": "xy-ch100-008"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧下馬，同眾進朝。唐僧將龍馬與經擔，同行者、八戒、沙僧，站在玉階之下。太宗傳宣御弟上殿，賜坐。唐僧又謝恩坐了，教把經卷擡來。行者等取出，近侍官傳上。太宗又問：「多少經數？怎生取來？」三藏道：「臣僧到了靈山，參見佛祖，蒙差阿儺、伽葉二尊者先引至珍樓內賜齋，次到寶閣內傳經。那尊者需索人事，因未曾備得，不曾送他，他遂以經與了。當謝佛祖之恩，東行，忽被妖風搶了經去。幸小徒有些神通趕奪，卻俱拋擲散漫。因展看，皆是無字空本。臣等著驚，復去拜告懇求。佛祖道：此經成就之時，有比丘聖僧將下山與舍衛國趙長者家看誦了一遍，保祐他家生者安全，亡者超脫，止討了他三斗三升米粒黃金，意思還嫌賣賤了，後來子孫沒錢使用。我等知二尊者需索人事，佛祖明知，只得將欽賜紫金缽盂送他，方傳了有字真經。此經有三十五部，各部中檢了幾卷傳來，共計五千零四十八卷。此數蓋合一藏也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 133
    "line_end": 133
    "source_sequence": 8
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    三蔵は馬を下り、一同と宮中へ入った。竜馬（りゅうめ）と経の荷を携え、悟空、八戒、沙悟浄とともに玉の階の下に立つ。太宗は御弟を殿上へ召し、席を賜った。三蔵は再び礼を述べて座り、経巻を運んでくるように命じた。悟空たちが取り出すと、近侍の役人が受け取って御前へ差し上げた。太宗はまた尋ねた。「経はどれほどある。どのようにして手に入れたのだ。」
    三蔵「臣僧は霊山（れいざん）に到着し、仏祖（ぶっそ）にお目にかかりました。仏祖の命で、阿儺（あなん）と迦葉（かしょう）の二尊者が、まず珍楼（ちんろう）へ案内して斎食（さいじき）を下さり、それから宝閣（ほうかく）へ移って経を授けてくださいました。ところが尊者たちは贈り物を要求なさいました。用意がなく、お渡しできなかったのですが、それでも経を下さいました。仏祖の恩に感謝して東へ出発したところ、突然、妖しい風に経を奪われました。幸い、弟子にいくらか神通力があり、追いかけて取り返しましたが、経はすっかり投げ散らされておりました。そこで開いてみると、どれも文字のない白紙の本だったのです。私たちは驚き、戻って拝み、事情を申し上げてお願いしました。すると仏祖は、この経が出来上がったとき、比丘（びく）の聖僧が山を下り、舎衛国（しゃえこく）の趙長者（ちょうちょうじゃ）の家で一度読んでやったことがあり、それによって生きている者は安らかに守られ、亡き者は苦しみから救われた、その代価にわずか三斗（と）三升（しょう）の米粒ほどの粒金を求めたが、それでも安く売りすぎたと思っている、これでは後の子孫が使う金もなくなる、とおっしゃいました。二尊者の贈り物の要求を仏祖もはっきりご存じなのだと分かり、やむなく陛下から賜った紫金（しきん）の鉢を差し上げました。それで、ようやく文字のある真の経を授けていただけたのでございます。この経は三十五部あり、各部から幾巻かずつ選んで伝えられ、合わせて五千四十八巻となります。これはちょうど、一蔵の数に当たるのでございます。」
  "translation_status": "reviewed"
- "id": "xy-ch100-009"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗更喜，教：「光祿寺設宴在東閣酬謝。」忽見他三徒立在階下，容貌異常，便問：「高徒果外國人耶？」長老俯伏道：「大徒弟姓孫，法名悟空，臣又呼他為孫行者。他出身原是東勝神洲傲來國花果山水簾洞人氏。因五百年前大鬧天宮，被佛祖困壓在西番兩界山石匣之內，蒙觀音菩薩勸善，情願皈依。是臣到彼救出，保護甚虧此徒。二徒弟姓豬，法名悟能，臣又呼他為豬八戒。他出身原是福陵山雲棧洞人氏。因在烏斯藏高老莊上作怪，亦蒙菩薩勸善，虧行者收之。一路上挑擔有力，涉水有功。三徒弟姓沙，法名悟淨，臣又呼他為沙和尚。他出身原是流沙河作怪者，也蒙菩薩勸善，秉教沙門。那匹馬不是主公所賜者。」太宗道：「毛片相同，如何不是？」三藏道：「臣到蛇盤山鷹愁澗涉水，原馬被此馬吞之。虧行者請菩薩問此馬來歷，原是西海龍王之子，因有罪，也蒙菩薩救解，教他與臣作腳力。當時變作原馬，毛片相同。幸虧他登山越嶺，跋涉崎嶇，去時騎坐，來時馱經，亦甚賴其力也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 134
    "line_end": 134
    "source_sequence": 9
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    太宗はますます喜び、命じた。「光禄寺（こうろくじ）に、東閣（とうかく）で謝恩の宴を設けさせよ。」
    ふと階の下に立つ三人の弟子の、並外れた姿が目に入り、尋ねた。「ご高弟は、やはり異国の者なのか。」
    三蔵は身を伏せて答えた。「一番弟子は姓を孫（そん）、法名を悟空と申し、私は孫行者（そんぎょうじゃ）とも呼んでおります。生まれは東勝神洲（とうしょうしんしゅう）、傲来国（ごうらいこく）の花果山（かかざん）、水簾洞（すいれんどう）です。五百年前、天宮（てんきゅう）で大騒動を起こし、仏祖によって西方の両界山（りょうかいざん）の石の囲いに押し込められておりましたが、観音菩薩に善の道へ導かれ、みずから帰依を願いました。私がそこへ参って救い出したのでございます。この弟子の守護には、ひとかたならぬ力を借りました。二番弟子は姓を猪（ちょ）、法名を悟能（ごのう）と申し、私は猪八戒（ちょはっかい）とも呼んでおります。もとは福陵山（ふくりょうざん）の雲桟洞（うんさんどう）に住んでおりました。烏斯蔵（うしぞう）の高老荘（こうろうそう）で妖怪として害をなしておりましたが、この者も菩薩（ぼさつ）に善の道へ導かれ、悟空の力で弟子に迎えました。道中では力を尽くして荷を担ぎ、水を渡るにも功がございました。三番弟子は姓を沙（さ）、法名を悟浄（ごじょう）と申し、私は沙和尚（さおしょう）とも呼んでおります。もとは流沙河（りゅうさが）で害をなす妖怪でしたが、やはり菩薩に善の道へ導かれ、仏門の教えを守るようになりました。なお、あの馬は、陛下から頂いた馬ではございません。」
    太宗「毛の色も同じなのに、違うというのか。」
    三蔵「蛇盤山（じゃばんざん）の鷹愁澗（ようしゅうかん）で川を渡ろうとした際、もとの馬は、この馬にのみ込まれてしまいました。悟空が菩薩をお呼びして素性をお尋ねしたところ、西海竜王（さいかいりゅうおう）の子でございました。罪を犯していたのを菩薩に救っていただき、私の乗り物を務めるよう命じられたのでございます。その場で、もとの馬と毛色の同じ姿に変わりました。山を登り、峠を越え、険しい道を進んでくれ、往きは私を乗せ、帰りは経を背負ってくれました。この馬にも、たいそう力を借りたのでございます。」
  "translation_status": "reviewed"
- "id": "xy-ch100-010"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗聞言，稱讚不已。又問：「遠涉西方，端的路程多少？」三藏道：「總記菩薩之言，有十萬八千里之遠。途中未曾記數，只知經過了一十四遍寒暑。日日山，日日嶺。遇林不小，遇水寬洪。還經幾座國王，俱有照驗的印信。」叫：「徒弟，將通關文牒取上來，對主公繳納。」當時遞上。太宗看了，乃貞觀一十三年九月望前三日給。太宗笑道：「久勞遠涉，今已貞觀二十七年矣。」牒文上有寶象國印、烏雞國印、車遲國印、西梁女國印、祭賽國印、朱紫國印、比丘國印、滅法國印，又有鳳仙郡印、玉華州印、金平府印、天竺國印。太宗覽畢，收了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 135
    "line_end": 135
    "source_sequence": 10
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    太宗は聞いて、しきりに褒めたたえ、さらに尋ねた。「西方まで遠い旅をしたが、実際にはどれほどの道のりであった。」
    三蔵「観音菩薩のお言葉では、十万八千里（り）の遠さだと覚えております。途中では数えませんでしたが、ただ十四度、暑さと寒さが巡ったことは承知しております。日ごとに山、日ごとに峠でした。林に出会えば小さなものはなく、水に出会えば広く大きな流れでした。また、幾つかの国の王にもお会いし、そのたびに身元を確かめた印を頂いております。」
    三蔵は呼びかけた。「弟子たち、通関文牒（つうかんもんちょう）を持ってきて、陛下へお返ししなさい。」
    すぐに文書が差し出された。太宗が見ると、貞観十三年九月、十五日の三日前に発給したものだった。太宗は笑った。「長年、遠い旅に苦労をかけたな。今はもう、貞観二十七年だ。」
    文牒には、宝象国（ほうぞうこく）の印、烏鶏国（うけいこく）の印、車遅国（しゃちこく）の印、西梁女国（せいりょうじょこく）の印、祭賽国（さいさいこく）の印、朱紫国（しゅしこく）の印、比丘国（びくこく）の印、滅法国（めっぽうこく）の印、さらに鳳仙郡（ほうせんぐん）の印、玉華州（ぎょくかしゅう）の印、金平府（きんぺいふ）の印、天竺国（てんじくこく）の印があった。太宗は読み終えると、これを受け取った。
  "translation_status": "reviewed"
- "id": "xy-ch100-011"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "早有當駕官請宴，即下殿攜手而行。又問：「高徒能禮貌乎？」三藏道：「小徒俱是山村曠野之妖身，未諳中華聖朝之禮數，萬望主公赦罪。」太宗笑道：「不罪他，不罪他。都同請東閣赴宴去也。」三藏又謝了恩，招呼他三眾，都到閣內觀看。果是中華大國，比尋常不同。你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 137
    "line_end": 137
    "source_sequence": 11
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    ほどなく当駕官（とうがかん）が宴の用意を知らせに来たので、太宗は殿を下り、三蔵の手を取って歩いた。そして、また尋ねた。「ご高弟たちは礼儀を心得ているか。」
    三蔵「弟子たちはいずれも、山里や荒野にいた妖怪の身で、中華（ちゅうか）の聖なる朝廷の礼法を存じません。どうか、何とぞおとがめなさいませぬよう。」
    太宗は笑った。「とがめはしない、とがめはしない。皆そろって、東閣の宴へ来るがよい。」
    三蔵は再び恩に感謝し、弟子三人を呼び寄せた。皆で閣内へ入って眺めると、さすがは中華の大国、並の国とは違う。見れば、
  "translation_status": "reviewed"
- "id": "xy-ch100-012"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": "門懸綵繡，地襯紅氈。異香馥郁，奇品新鮮。琥珀杯，玻璃盞，鑲金點翠；黃金盤，白玉碗，嵌錦花纏。爛煮蔓菁，糖澆香芋。蘑菇甜美，海菜清奇。幾次添來薑辣筍，數番辦上蜜調葵。麵觔椿樹葉，木耳豆腐皮。石花仙菜，蕨粉乾薇。花椒煮萊菔，芥末拌瓜絲。幾盤素品還猶可，數種奇稀果奪魁。核桃柿餅，龍眼荔枝。宣州繭栗山東棗，江南銀杏兔頭梨。榛松蓮肉葡萄大，榧子瓜仁菱米齊。橄欖林檎，蘋婆沙果。慈菰嫩藕，脆李楊梅。無般不備，無件不齊。還有些蒸酥蜜食兼嘉饌，更有那美酒香茶與異奇。說不盡百味珍饈真上品，果然是中華大國異西夷。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 138
    "line_end": 138
    "source_sequence": 12
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    門には色鮮やかな刺繍の幕、床には赤い毛氈（もうせん）。
    珍しい香りが満ちわたり、見事な品々は新鮮だ。
    琥珀の杯とガラスの盃には、金をはめ、カワセミの羽で飾り、
    黄金の皿と白玉の椀には、錦のような花模様をめぐらせる。
    柔らかく煮込んだカブ、砂糖をかけた香り高い芋。
    キノコは甘くうまく、海藻はさっぱりと珍しい。
    生姜を利かせたタケノコが幾度も足され、蜜であえたアオイが何度も運ばれる。
    麩、チャンチンの葉、キクラゲ、湯葉。
    石花菜（せきかさい）に仙菜（せんさい）、ワラビの澱粉、干したゼンマイ。
    花椒で煮た大根、からしであえた細切りのウリ。
    幾皿もの精進料理もすばらしいが、珍しい果物の数々がさらに際立つ。
    クルミと干し柿、竜眼（りゅうがん）とライチ。
    宣州（せんしゅう）の繭ほどの栗、山東（さんとう）のナツメ、江南（こうなん）の銀杏、ウサギの頭の形をした梨。
    ハシバミ、松の実、蓮の実、大粒のブドウ、カヤの実、ウリの種、ヒシの実もそろう。
    カンランに林檎、蘋婆（ひんば）に沙果（さか）。
    クワイに若いレンコン、歯切れのよいスモモ、ヤマモモ。
    備わらぬ種類はなく、欠けた品は一つもない。
    さらに、蒸酥（じょうそ）の菓子、蜜の菓子とごちそうがあり、うまい酒、香り高い茶、珍味まで。
    語り尽くせぬ百味のごちそうは、まことに最上の品。
    さすがは中華の大国、西の異国とは違うと見える。
  "translation_status": "reviewed"

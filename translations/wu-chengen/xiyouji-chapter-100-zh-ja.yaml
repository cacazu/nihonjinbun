  "known_gaps":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-003"
    "description_ja": "「潑大粗人」は八戒が金剛へ投げる粗野な呼びかけと解した。句読点と呼びかけの切れには留保があるが、八戒自身の富貴への欲を語り手が確認した文ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-007"
    "description_ja": "底本は「今夜未曾刮風」とする。夜明けに松の変化を見て話す場面なので、直前の夜を指すものと解して「昨夜」と訳した。原文欄の今夜はそのまま保持し、底本が昨夜と書くかのようには扱っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-008"
    "description_ja": "底本は「伽葉」と書く。阿儺とともに如来に仕える既知の弟子なので、訳文の通常の呼称はこれまでと同じ「迦葉」にそろえた。原文欄と辞書の異表記には伽の字を保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-010"
    "description_ja": "旅に十四年が過ぎたことと貞観二十七年は、物語の記述をそのまま残した。史実の貞観は二十三年までであり、史実に合わせて本文の年数を変更してはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-012"
    "description_ja": "原文の「石花仙菜」は石花と仙菜を並べる句と解した。石花は食用海藻をいう石花菜に結び付けられるが、仙菜の具体的な植物・料理の同定は未確定。続く薇は食用のシダ類と解してゼンマイとしたが、厳密な種同定ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-012"
    "description_ja": "林檎・蘋婆・沙果は底本が並べる果実名としてそれぞれ保持した。古い果実名と現代の植物分類は一対一ではなく、蘋婆を現代中国語の辞書にある一種へ限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "この序文は物語に収められた本文を訳したもの。別伝の『大唐三蔵聖教序』には「歷千劫而不古」「挹之」などの形があるが、底本の「歷千仞而亙古」「挹挹」等を無断で差し替えなかった。千仞を経るという句の具体的意味には留保がある。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "底本の「古者卜形卜跡」は難句。姿や足跡を求めることと暫定的に解したが、卜の用法は未確定。別伝の序に見える「昔者分形分跡」と同じ本文に補訂したものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "三空・四忍は仏教の修行に関わる分類語。三空の三つ、四忍の四つの具体的な配当には諸説があるため、原文が列挙しない内訳を本文へ補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "底本の「悲正潛靈」「多門訛謬」は文意が取りにくい。前者を正しい教えの働きが隠れたこと、後者を諸教の伝承の誤りと暫定的に解した。著名な別伝の序の文章へ置き換えてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "底本は「三乘六律」。三乗は悟りへ至る道の分類だが、六律の具体的な六部門は確定できない。別伝の「一乘五律」等へ改めず、原字の数と語を残した。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-017"
    "description_ja": "底本は「溫火宅之乾焰」「朗金水之混波」。文脈から火の苦しみを和らげ、水の濁りを明らかにする救済の比喩として暫定的に訳したが、溫・朗・金水の語義と校訂には留保がある。別伝の序の「濕火宅之乾焰」「朗愛水之昏波」へ黙って差し替えてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-022"
    "description_ja": "原文は「功完八九還加九」、八九の七十二に九を足して八十一の難を示すと解した。続く三千・大千は修行の成就と広大な仏教世界を重ねる詩句として残し、個別の修行項目を創作しない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-024"
    "description_ja": "底本は白馬の父を「西洋大海廣晉龍王」と呼ぶ。これまでの西海竜王という海域・父子関係と接続するが、「廣晉」を既知の個人名「敖閏」へ置き換えない。原文の「廣」「晉」をそのまま用いた。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-029"
    "description_ja": "底本の「優婆夷塞」は女性の在家信徒をいう優婆夷と男性の在家信徒をいう優婆塞を合わせた呼び方と解した。原文欄では順序と字を保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-032"
    "description_ja": "底本の仏名は「毘盧尸佛」。字面の似た毘盧・毘盧舎那の別名と機械的に同定せず、ここではこの語形を保持した。日本語での全語形の読みと他の仏名との同一性は確定していない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-032"
    "description_ja": "底本は「比丘夷塞尼菩薩」。僧尼と在家男女を含む語を組み合わせた尊称と考えられるが、その語構成や個々の対応は未確定。名を補って通常の四衆の定型へ訂正していない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-032"
    "description_ja": "南無の連祷は63句をすべて残し、才功徳・現無愚・才光明・才光などの語形も別名へ無断で改めなかった。五人の授職の呼称と、ここで唱えられる浄壇使者菩薩・八宝金身羅漢菩薩・八部天竜広力菩薩などは、場面ごとの表記のまま同じ人物へつないでいる。似た「光」「功徳」を含むだけの他の仏名を一つにまとめてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "segment_ids":
    - "xy-ch100-033"
    "description_ja": "底本は「同生極樂國，盡報此一身」の順。この身に受けた生の報いを尽くす祈りと解して訳したが、報の細かな解釈には留保がある。一般の回向文に合わせて二句を入れ替えたり、別の願文へ置き換えたりしてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"

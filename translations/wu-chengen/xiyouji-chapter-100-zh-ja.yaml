  "source_text": "「南無燃燈上古佛。南無藥師琉璃光王佛。南無釋迦牟尼佛。南無過去未來現在佛。南無清淨喜佛。南無毘盧尸佛。南無寶幢王佛。南無彌勒尊佛。南無阿彌陀佛。南無無量壽佛。南無接引歸真佛。南無金剛不壞佛。南無寶光佛。南無龍尊王佛。南無精進善佛。南無寶月光佛。南無現無愚佛。南無婆留那佛。南無那羅延佛。南無功德華佛。南無才功德佛。南無善遊步佛。南無旃檀光佛。南無摩尼幢佛。南無慧炬照佛。南無海德光明佛。南無大慈光佛。南無慈力王佛。南無賢善首佛。南無廣莊嚴佛。南無金華光佛。南無才光明佛。南無智慧勝佛。南無世靜光佛。南無日月光佛。南無日月珠光佛。南無慧幢勝王佛。南無妙音聲佛。南無常光幢佛。南無觀世燈佛。南無法勝王佛。南無須彌光佛。南無大慧力王佛。南無金海光佛。南無大通光佛。南無才光佛。南無旃檀功德佛。南無鬥戰勝佛。南無觀世音菩薩。南無大勢至菩薩。南無文殊菩薩。南無普賢菩薩。南無清淨大海眾菩薩。南無蓮池海會佛菩薩。南無西天極樂諸菩薩。南無三千揭諦大菩薩。南無五百阿羅大菩薩。南無比丘夷塞尼菩薩。南無無邊無量法菩薩。南無金剛大士聖菩薩。南無淨壇使者菩薩。南無八寶金身羅漢菩薩。南無八部天龍廣力菩薩。如是等一切世界諸佛："

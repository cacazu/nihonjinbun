  "translation_ja": "一同「南無（なむ）、燃灯上古仏（ねんとうじょうこぶつ）。南無、薬師琉璃光王仏（やくしるりこうおうぶつ）。南無、釈迦牟尼仏（しゃかむにぶつ）。南無、過去未来現在仏（かこみらいげんざいぶつ）。南無、清浄喜仏（しょうじょうきぶつ）。南無、毘盧尸仏（びるしぶつ）。南無、宝幢王仏（ほうどうおうぶつ）。南無、弥勒尊仏（みろくそんぶつ）。南無、阿弥陀仏（あみだぶつ）。南無、無量寿仏（むりょうじゅぶつ）。南無、接引帰真仏（せついんきしんぶつ）。南無、金剛不壊仏（こんごうふえぶつ）。南無、宝光仏（ほうこうぶつ）。南無、竜尊王仏（りゅうそんおうぶつ）。南無、精進善仏（しょうじんぜんぶつ）。南無、宝月光仏（ほうがっこうぶつ）。南無、現無愚仏（げんむぐぶつ）。南無、婆留那仏（ばるなぶつ）。南無、那羅延仏（ならえんぶつ）。南無、功徳華仏（くどくけぶつ）。南無、才功徳仏（さいくどくぶつ）。南無、善遊歩仏（ぜんゆうぶぶつ）。南無、旃檀光仏（せんだんこうぶつ）。南無、摩尼幢仏（まにどうぶつ）。南無、慧炬照仏（えこしょうぶつ）。南無、海徳光明仏（かいとくこうみょうぶつ）。南無、大慈光仏（だいじこうぶつ）。南無、慈力王仏（じりきおうぶつ）。南無、賢善首仏（けんぜんしゅぶつ）。南無、広荘厳仏（こうしょうごんぶつ）。南無、金華光仏（こんけこうぶつ）。南無、才光明仏（さいこうみょうぶつ）。南無、智慧勝仏（ちえしょうぶつ）。南無、世静光仏（せいじょうこうぶつ）。南無、日月光仏（にちがっこうぶつ）。南無、日月珠光仏（にちがつしゅこうぶつ）。南無、慧幢勝王仏（えどうしょうおうぶつ）。南無、妙音声仏（みょうおんじょうぶつ）。南無、常光幢仏（じょうこうどうぶつ）。南無、観世灯仏（かんぜとうぶつ）。南無、法勝王仏（ほうしょうおうぶつ）。南無、須弥光仏（しゅみこうぶつ）。南無、大慧力王仏（だいえりきおうぶつ）。南無、金海光仏（こんかいこうぶつ）。南無、大通光仏（だいつうこうぶつ）。南無、才光仏（さいこうぶつ）。南無、旃檀功徳仏。南無、闘戦勝仏。南無、観世音菩薩（かんぜおんぼさつ）。南無、大勢至菩薩（だいせいしぼさつ）。南無、文殊菩薩（もんじゅぼさつ）。南無、普賢菩薩（ふげんぼさつ）。南無、清浄大海衆菩薩（しょうじょうだいかいしゅぼさつ）。南無、蓮池海会仏菩薩（れんちかいえぶつぼさつ）。南無、西天極楽諸菩薩（さいてんごくらくしょぼさつ）。南無、三千掲諦大菩薩（さんぜんぎゃていだいぼさつ）。南無、五百阿羅大菩薩（ごひゃくあらだいぼさつ）。南無、比丘夷塞尼菩薩（びくいそくにぼさつ）。南無、無辺無量法菩薩（むへんむりょうほうぼさつ）。南無、金剛大士聖菩薩（こんごうだいししょうぼさつ）。南無、浄壇使者菩薩（じょうだんししゃぼさつ）。南無、八宝金身羅漢菩薩（はっぽうこんじんらかんぼさつ）。南無、八部天竜広力菩薩（はちぶてんりゅうこうりきぼさつ）。このような、あらゆる世界の諸仏に。"
  "translation_status": "reviewed"
- "id": "xy-ch100-033"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    願以此功德，莊嚴佛淨土。
    上報四重恩，下濟三途苦。
    若有見聞者，悉發菩提心。
    同生極樂國，盡報此一身。
    十方三世一切佛，諸尊菩薩摩訶薩，摩訶般若波羅密。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 178
    "line_end": 182
    "source_sequence": 33
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    願わくは、この功徳によって、仏の浄土を荘厳せん。
    上には四重恩（しじゅうおん）に報い、下には三途（さんず）の苦しみを救わん。
    これを見聞きする者あらば、皆、悟りを求める心を起こさんことを。
    ともに極楽（ごくらく）の国に生まれ、この身の報いを尽くさんことを。
    十方三世の一切の仏、諸々の尊き菩薩摩訶薩（ぼさつまかさつ）、摩訶般若波羅蜜（まかはんにゃはらみつ）に帰依したてまつる。」
  "translation_status": "reviewed"
- "id": "xy-ch100-034"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "《西遊記》至此終。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 183
    "line_end": 183
    "source_sequence": 34
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "『西遊記』は、これにて終わる。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-001-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「潑大粗人」は八戒が金剛へ投げる粗野な呼びかけと解した。句読点と呼びかけの切れには留保があるが、八戒自身の富貴への欲を語り手が確認した文ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-002-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「今夜未曾刮風」とする。夜明けに松の変化を見て話す場面なので、直前の夜を指すものと解して「昨夜」と訳した。原文欄の今夜はそのまま保持し、底本が昨夜と書くかのようには扱っていない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-003-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「妖風」は三蔵が皇帝へ報告する際の呼び方。すでに語られた燃灯古仏と白雄尊者の働きを、語り手が邪悪な妖怪の襲撃へ訂正したものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-004-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「伽葉」と書く。阿儺とともに如来に仕える既知の弟子なので、訳文の通常の呼称はこれまでと同じ「迦葉」にそろえた。原文欄と辞書の異表記には伽の字を保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-005-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "旅に十四年が過ぎたことと貞観二十七年は、物語の記述をそのまま残した。史実の貞観は二十三年までであり、史実に合わせて本文の年数を変更してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-006-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「石花仙菜」は石花と仙菜を並べる句と解した。石花は食用海藻をいう石花菜に結び付けられるが、仙菜の具体的な植物・料理の同定は未確定。続く薇は食用のシダ類と解してゼンマイとしたが、厳密な種同定ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-007-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "林檎・蘋婆・沙果は底本が並べる果実名としてそれぞれ保持した。古い果実名と現代の植物分類は一対一ではなく、蘋婆を現代中国語の辞書にある一種へ限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-008-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この序文は物語に収められた本文を訳したもの。別伝の『大唐三蔵聖教序』には「歷千劫而不古」「挹之」などの形があるが、底本の「歷千仞而亙古」「挹挹」等を無断で差し替えなかった。千仞を経るという句の具体的意味には留保がある。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-009-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「古者卜形卜跡」は難句。姿や足跡を求めることと暫定的に解したが、卜の用法は未確定。別伝の序に見える「昔者分形分跡」と同じ本文に補訂したものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-010-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三空・四忍は仏教の修行に関わる分類語。三空の三つ、四忍の四つの具体的な配当には諸説があるため、原文が列挙しない内訳を本文へ補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-011-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「悲正潛靈」「多門訛謬」は文意が取りにくい。前者を正しい教えの働きが隠れたこと、後者を諸教の伝承の誤りと暫定的に解した。著名な別伝の序の文章へ置き換えてはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-012-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「三乘六律」。三乗は悟りへ至る道の分類だが、六律の具体的な六部門は確定できない。別伝の「一乘五律」等へ改めず、原字の数と語を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-013-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「溫火宅之乾焰」「朗金水之混波」。文脈から火の苦しみを和らげ、水の濁りを明らかにする救済の比喩として暫定的に訳したが、溫・朗・金水の語義と校訂には留保がある。別伝の序の「濕火宅之乾焰」「朗愛水之昏波」へ黙って差し替えてはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-014-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「功完八九還加九」、八九の七十二に九を足して八十一の難を示すと解した。続く三千・大千は修行の成就と広大な仏教世界を重ねる詩句として残し、個別の修行項目を創作しない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-015-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は白馬の父を「西洋大海廣晉龍王」と呼ぶ。これまでの西海竜王という海域・父子関係と接続するが、「廣晉」を既知の個人名「敖閏」へ置き換えない。原文の「廣」「晉」をそのまま用いた。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-016-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「優婆夷塞」は女性の在家信徒をいう優婆夷と男性の在家信徒をいう優婆塞を合わせた呼び方と解した。原文欄では順序と字を保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-017-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の仏名は「毘盧尸佛」。字面の似た毘盧・毘盧舎那の別名と機械的に同定せず、ここではこの語形を保持した。日本語での全語形の読みと他の仏名との同一性は確定していない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-018-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「比丘夷塞尼菩薩」。僧尼と在家男女を含む語を組み合わせた尊称と考えられるが、その語構成や個々の対応は未確定。名を補って通常の四衆の定型へ訂正していない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-019-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "南無の連祷は63句をすべて残し、才功徳・現無愚・才光明・才光などの語形も別名へ無断で改めなかった。五人の授職の呼称と、ここで唱えられる浄壇使者菩薩・八宝金身羅漢菩薩・八部天竜広力菩薩などは、場面ごとの表記のまま同じ人物へつないでいる。似た「光」「功徳」を含むだけの他の仏名を一つにまとめてはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch100-note-020-body"
  "section_id": "chapter-100"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「同生極樂國，盡報此一身」の順。この身に受けた生の報いを尽くす祈りと解して訳したが、報の細かな解釈には留保がある。一般の回向文に合わせて二句を入れ替えたり、別の願文へ置き換えたりしてはいない。"
  "translation_status": "reviewed"

  "translation_ja": "師弟四人と文武の役人たちは、左右に席を連ね、太宗皇帝（たいそうこうてい）は中央の正面に座った。歌舞と管弦は整然として厳かで、一日じゅう存分に楽しんだ。まさしく、"

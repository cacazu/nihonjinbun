  "source_text": "長老捧幾卷登臺，方欲諷誦，忽聞得香風繚繞，半空中有八大金剛現身，高叫道：「誦經的放下經卷，跟我回西去也。」這底下行者三人連白馬，平地而起；長老亦將經卷丟下，也從臺上起於九霄，相隨騰空而去。慌得那太宗與多官望空下拜。這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 153
    "line_end": 153
    "source_sequence": 21
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    三蔵は幾巻かを捧げて壇へ上がり、まさに読誦しようとした。そのとき、不意に香る風があたりを巡り、空中に八大金剛が姿をあらわして、高く叫んだ。「経を読む者よ、経巻を置き、私たちと西へ戻るのだ。」
    壇の下にいた悟空たち三人は、白馬とともに地上から舞い上がった。三蔵も経巻を置き放し、壇の上から空高く上がって、一緒に飛び去った。太宗と役人たちは驚き慌て、空を仰いでひれ伏した。まさに、
  "translation_status": "reviewed"
- "id": "xy-ch100-022"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    聖僧努力取經編，西宇周流十四年。
    苦歷程途遭患難，多經山水受迍邅。
    功完八九還加九，行滿三千及大千。
    大覺妙文回上國，至今東土永留傳。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 155
    "line_end": 158
    "source_sequence": 22
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    聖僧は力を尽くして経を求め、西方を巡ること十四年。
    旅路を苦しくたどって災難に遭い、幾つもの山河を越えて行き悩んだ。
    功は八つの九にさらに九を加えて全うし、行は三千から大千（だいせん）にまで満ちる。
    大いなる悟りの妙なる経文は大国へ帰り、今も東の国に永く伝わる。
  "translation_status": "reviewed"
- "id": "xy-ch100-023"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗與多官拜畢，即選高僧，就於雁塔寺裡，修建水陸大會，看誦大藏真經，超脫幽冥孽鬼，普施善慶。將謄錄過經文，傳播天下不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 160
    "line_end": 160
    "source_sequence": 23
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "太宗と役人たちは拝礼を終えると、高僧を選び、雁塔寺に水陸の大法会を設けた。大蔵の真の経を読誦し、冥界で業に苦しむ亡者を救い、広く善い幸いを施した。書き写した経文を天下へ広めたことは、ここまでとしよう。"
  "translation_status": "reviewed"
- "id": "xy-ch100-024"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說八大金剛駕香風，引著長老四眾，連馬五口，復轉靈山。連去連來，適在八日之內。此時靈山諸神，都在佛前聽講。八金剛引他師徒進去，對如來道：「弟子前奉金旨，駕送聖僧等已到唐國，將經交納，今特繳旨。」遂叫唐僧等近前受職。如來道：「聖僧，汝前世原是我之二徒，名喚金蟬子。因為汝不聽說法，輕慢我之大教，故貶汝之真靈，轉生東土。今喜皈依，秉我迦持，又乘吾教，取去真經，甚有功果，加陞大職正果，汝為旃檀功德佛。──孫悟空，汝因大鬧天宮，吾以甚深法力，壓在五行山下，幸天災滿足，歸於釋教；且喜汝隱惡揚善，在途中煉魔降怪有功，全終全始，加陞大職正果，汝為鬥戰勝佛。──豬悟能，汝本天河水神天蓬元帥，為汝蟠桃會上酗酒戲了仙娥，貶汝下界投胎，身如畜類。幸汝記愛人身，在福陵山雲棧洞造孽，喜歸大教，入我沙門，保聖僧在路，卻又有頑心，色情未泯。因汝挑擔有功，加陞汝職正果，做淨壇使者。」八戒口中嚷道：「他們都成佛，如何把我做個淨壇使者？」如來道：「因汝口壯身慵，食腸寬大。蓋天下四大部洲，瞻仰吾教者甚多，凡諸佛事，教汝淨壇，乃是個有受用的品級，如何不好？──沙悟淨，汝本是捲簾大將。先因蟠桃會上打碎玻璃盞，貶汝下界，汝落於流沙河，傷生吃人造孽。幸皈吾教，誠敬迦持，保護聖僧，登山牽馬有功，加陞大職正果，為金身羅漢。」又叫那白馬：「汝本是西洋大海廣晉龍王之子，因汝違逆父命，犯了不孝之罪。幸得皈身皈法，皈我沙門，每日家虧你馱負聖僧來西，又虧你馱負聖經去東，亦有功者，加陞汝職正果，為八部天龍馬。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 161

  "translation_ja": |-
    君主のめでたい宴は、堯舜（ぎょうしゅん）の世をもしのぎ、真の経を得て幸いは満ちあふれる。
    千年を越えて伝わり、いつまでも栄え、仏の光があまねく帝の住まいを照らす。
  "translation_status": "reviewed"
- "id": "xy-ch100-015"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日天晚，謝恩宴散。太宗回宮，多官回宅。唐僧等歸於洪福寺，只見寺僧磕頭迎接。方進山門，眾僧報道：「師父，這樹頭兒今早俱忽然向東。我們記得師父之言，遂出城來接，果然到了。」長老喜之不勝，遂入方丈。此時八戒也不嚷茶飯，也不弄喧頭；行者、沙僧，個個穩重。只因道果完成，自然安靜。當晚睡了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 145
    "line_end": 145
    "source_sequence": 15
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    その日の夕方、皆は恩に感謝して宴を終えた。太宗は宮へ戻り、役人たちは屋敷へ帰った。三蔵たちが洪福寺へ帰ると、僧たちが地に頭をつけて出迎えた。山門に入ったところで、僧たちが告げた。「お師匠さま、今朝、あの木々の梢が、突然そろって東を向いたのです。お師匠さまのお言葉を思い出し、城の外までお迎えに出ましたら、本当にお戻りでした。」
    三蔵はたいそう喜び、方丈（ほうじょう）へ入った。このときは、八戒も茶や食事をせがまず、騒ぎもしない。悟空も沙悟浄も、皆落ち着いていた。修行の実りが完成したので、おのずと静かになったのである。その夜は、そのまま眠りについた。
  "translation_status": "reviewed"
- "id": "xy-ch100-016"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次早，太宗升朝，對群臣言曰：「朕思御弟之功，至深至大，無以為酬。一夜無寐，口占幾句俚談，權表謝意，但未曾寫出。」叫：「中書官來，朕念與你，你一一寫之。」其文蓋云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 146
    "line_end": 146
    "source_sequence": 16
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    翌朝、太宗は朝議に臨み、群臣に言った。「御弟の功績を考えると、あまりに深く大きく、報いるすべもない。昨夜は一睡もせず、つたない言葉を幾つか口で作り、ひとまず謝意を表そうとしたが、まだ書き留めてはいない。」
    太宗「中書官（ちゅうしょかん）、参れ。朕が読み上げるから、一つ残らず書き取るのだ。」
    その文は、およそ次のようなものだった。
  "translation_status": "reviewed"
- "id": "xy-ch100-017"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "嘗聞二儀有象，顯覆載以含生；四序無形，潛寒暑以化物。是以窺天鑑地，庸愚皆識其端；明陰洞陽，賢哲罕窮其數。然天地包乎陰陽而易識者，以其有象也；陰陽處乎天地而難窮者，以其無形也。故知象顯可證，雖愚不惑；形潛莫睹，在智猶迷。況乎佛道沖虛，乘幽空寂。宏濟萬品，典御十方。舉威靈而無上，抑神力而無下。大之則彌於宇宙，細之則攝於毫釐。無滅無生，歷千仞而亙古；若潛若顯，運百福而長今。妙道凝玄，遵導莫知其際；法流湛寂，挹挹莫測其源。故知蠢蠢凡愚，區區庸鄙，投其旨趣，能無疑惑者哉？然大教之興，基乎西土。騰漢庭而皎夢，照東域而流慈。古者卜形卜跡之時，言未馳而成化。當常見常隱之世，民仰德而知遵。及乎晦影歸真，遷移越世，金容掩色，不鏡三千之光；麗像開圖，空端四八之相。於是微言廣被，拯禽類於三途；遺訓遐宣，導群生於十地。佛有經，能分大小之乘；更有法，傳訛邪正之術。我僧玄奘法師者，法門之領袖也。幼懷真敏，早悟三空之功；長契神清，先包四忍之行。松風水月，未足比其清華；仙露明珠，詎能方其朗潤？故以智通無累，神測未形。超六塵而迥出，使千古而傳芳。凝心內境，悲正潛靈；栖慮玄門，多門訛謬。思欲分條，是以翹心淨土，策杖孤征。積雪晨飛，途間失地；驚沙夕起，空外迷天。萬里山川，撥煙霞而進步；百重寒暑，歷霜雨而前蹤。誠重勞輕，求深欲達。周遊西宇，十有四年。窮歷異邦，詢求正教。雙林八水，味道餐風；鹿苑鷲峰，瞻奇仰異。承至言於先聖，受真教於上賢。探賾妙門，精窮奧業。三乘六律之道，馳驟於心田；一藏百篋之文，波濤於海口。爰自所歷之國無涯，求取之經有數。總得大乘要文凡三十五部，計五千四十八卷，譯布中華，宣揚勝業。引慈雲於西極，注法雨於東陲。聖教缺而復全，蒼生罪而還福。溫火宅之乾焰，共拔幽途；朗金水之混波，同臻彼岸。是知惡因業墜，善以緣昇。昇墜之端，惟人自作。譬之桂生高嶺，凌雲方得泫其華；蓮出綠波，飛塵不能染其葉。非蓮性自潔而桂質本貞，由所負者高，則微物不能累；所憑者淨，則濁類不能沾。夫以卉木無知，猶資善而成善，矧以人倫有識，寧不緣慶而成慶哉？方冀茲經傳佈，並日月而無窮；景福遐敷，與乾坤而永大也歟！"
  "source_languages":
  - "zh-Hant"
  "source_locations":

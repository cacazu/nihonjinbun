- "id": "xy-ch100-002"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言他四眾脫身，隨金剛駕風而起。卻說陳家莊救生寺內多人，天曉起來，仍治果餚來獻，至樓下，不見了唐僧。這個也來問，那個也來尋，俱慌慌張張，莫知所措，叫苦連天的道：「清清把個活佛放去了。」一會家無計，將辦來的品物，俱擡在樓上，祭祀燒紙。以後每年四大祭，二十四小祭。還有那告病的，保安的，求親許願、求財求子的，無時無日，不來燒香祭賽。真個是金爐不斷千年火，玉盞常明萬載燈。不題。"

  "origin": "source"
  "source_text": "寫畢，即召聖僧。此時長老已在朝門外候謝，聞宣急入，行俯伏之禮。太宗傳請上殿，將文字遞與。長老覽遍，復下謝恩，奏道：「主公文辭高古，理趣淵微。但不知是何名目？」太宗道：「朕夜口占，答謝御弟之意，名曰《聖教序》，不知好否？」長老叩頭，稱謝不已。太宗又曰：「朕才愧珪璋，言慚金石。至於內典，尤所未聞。口占敘文，誠為鄙拙。穢翰墨於金簡，標瓦礫於珠林。循躬省慮，靦面恧心。甚不足稱，虛勞致謝。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 148
    "line_end": 148
    "source_sequence": 18
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    書き終えると、すぐに聖僧を召した。三蔵はすでに宮門の外で、礼を申し上げるために待っており、お召しを聞いて急いで入り、身を伏せる礼をした。太宗は殿上へ招き、文章を渡した。三蔵はすべて読んでから、再び下がって恩に感謝し、申し上げた。「陛下の文章は格調高く、その理と趣は深遠でございます。ただ、何という題なのでございましょう。」
    太宗「昨夜、御弟への謝意を述べようと、口で作ったものだ。『聖教序（しょうぎょうじょ）』と名づけたが、よいだろうか。」
    三蔵は頭を地につけ、繰り返し感謝した。太宗はさらに言った。「朕の才は美しい玉に比べるほどでもなく、その言葉は金石の響きにも遠く及ばぬ。まして仏の経典については、ほとんど何も知らない。口で作ったこの序文は、まことに粗末でつたないものだ。黄金の書札に墨の汚れをつけ、真珠の林に瓦や小石を掲げるようなもの。わが身を振り返って思えば、顔も心も恥ずかしくなる。とても褒められるものではないのに、礼まで述べさせてしまったな。」
  "translation_status": "reviewed"
- "id": "xy-ch100-019"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時多官齊賀，頂禮聖教御文，遍傳內外。太宗道：「御弟將真經演誦一番，何如？」長老道：「主公，若演真經，須尋佛地。寶殿非可誦之處。」太宗甚喜，即問當駕官：「長安城中，有那座寺院潔淨？」班中閃上大學士蕭瑀奏道：「城中有一雁塔寺潔淨。」太宗即令多官：「把真經各虔捧幾卷，同朕到雁塔寺，請御弟談經去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 150
    "line_end": 150
    "source_sequence": 19
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    役人たちはそろって賀を述べ、聖なる教えについての御製の文をひれ伏して拝み、内外へ広く伝えた。太宗「御弟、真の経を一度、説き読みしてはくれぬか。」
    三蔵「陛下、真の経をお説きするのであれば、仏の場所を選ばねばなりません。宮殿は読誦にふさわしい所ではございません。」
    太宗は大いに喜び、当駕官に尋ねた。「長安の城内に、清浄な寺はどこかあるか。」
    列の中から大学士の蕭瑀（しょうう）が進み出て奏上した。「城内には、清浄な雁塔寺（がんとうじ）がございます。」
    太宗はすぐに役人たちへ命じた。「それぞれ真の経を幾巻かずつ、うやうやしく持ち、朕とともに雁塔寺へ行こう。御弟に経を説いていただくのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch100-020"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "多官遂各各捧著，隨太宗駕幸寺中，搭起高臺，鋪設齊整。長老仍命：「八戒、沙僧牽龍馬，理行囊；行者在我左右。」又向太宗道：「主公欲將真經傳流天下，須當謄錄副本，方可佈散。原本還當珍藏，不可輕褻。」太宗又笑道：「御弟之言甚當，甚當。」隨召翰林院及中書科各官謄寫真經。又建一寺在城之東，名曰謄黃寺。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 152
    "line_end": 152
    "source_sequence": 20
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    役人たちは一人ひとり経を捧げ、太宗の行幸に従って寺へ入った。高い壇を築き、敷物などを整えた。三蔵はまた命じた。「八戒、沙悟浄は竜馬を引き、荷物を整えておきなさい。悟空は私のそばに。」
    さらに太宗へ申し上げた。「陛下が真の経を天下に広めようとお考えならば、まず副本を書き写してから、配布なさる必要がございます。原本は大切に保管し、軽々しく扱ってはなりません。」
    太宗はまた笑った。「御弟の言うとおりだ。まことにそのとおりだ。」
    すぐに翰林院（かんりんいん）と中書科（ちゅうしょか）の役人を呼び、真の経を書き写させた。また城の東に寺を建て、謄黄寺（とうこうじ）と名づけた。
  "translation_status": "reviewed"
- "id": "xy-ch100-021"

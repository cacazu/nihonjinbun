    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    かねて聞くところによれば、天地の二儀（にぎ）には形があり、上から覆い、下から支える働きをあらわして、生きとし生けるものを包み込む。四季の巡りには形がなく、ひそかな寒暑の働きによって万物を育て変える。だから、天を仰ぎ地を見れば、平凡で愚かな者でもその端緒を知ることができるが、陰陽（いんよう）の理を明らかにし、奥まで見通そうとすれば、賢哲でさえ、その運行の数理を究め尽くす者はまれである。天地が陰陽を包み込みながらも分かりやすいのは、形があるからであり、陰陽が天地の中にありながら究めにくいのは、形がないからである。そこで分かる。姿があらわれ、確かめられるものならば、愚かな者でも惑わない。しかし、形が潜んで見えなければ、知恵ある者さえ迷うのである。
    まして仏の道は、からりと虚ろで、奥深い空寂の境地にある。広くあらゆるものを救い、十方（じっぽう）を統べ治める。その威光を掲げれば、それより上はなく、神力を低く及ぼせば、それより下もない。大きく見れば宇宙に満ち、微細に見れば毫釐（ごうり）のうちに収まる。滅びることも生まれることもなく、千仞（せんじん）の高さを経て、遠い昔から続き、隠れるかと思えばあらわれ、百の福を巡らせて、今も永く存する。妙なる道は深遠なものを凝らし、従い導かれようとしても、その限りを知ることはできない。法の流れは深く静まり、幾度くみ取ろうとも、その源を測ることはできない。そうであれば、無知な凡人、取るに足らぬ俗人が、その教えの趣旨に向かって、どうして疑い迷わずにいられようか。
    さて、偉大な教えが興った基は、西の国にある。その光は漢（かん）の宮廷の明るい夢にあらわれ、東の国を照らして慈悲を広めた。昔、仏の姿と足跡を求めた時代には、言葉が遠くまで届かぬうちに、すでに人々を感化していた。いつも姿をあらわし、また隠す世には、民はその徳を仰ぎ、従うべき道を知った。やがて姿を隠して真実へ帰り、時代が移り変わると、黄金のお顔も色を覆い、三千世界（さんぜんせかい）を照らす光は見られなくなった。麗しいお姿を絵に描いても、ただ三十二の相を整えるばかりとなった。そこで、奥深い言葉が広く行きわたり、鳥獣の類を三つの苦しみの道から救い、残された教えが遠くまで宣べ伝えられ、生あるものを十地（じゅうじ）へと導いた。仏には経があり、大乗（だいじょう）と小乗（しょうじょう）を分けることができる。また教えには、伝わるうちに誤り、邪と正の術が入り交じったものもある。
    わが僧、玄奘法師（げんじょうほうし）は、仏門の指導者である。幼くして真実をとらえる鋭さを抱き、早くも三空（さんくう）の功を悟り、成長すると精神は澄みわたり、すでに四忍（しにん）の行を身に備えていた。松を吹く風、水に映る月も、その清らかさと美しさには及ばず、仙人の露も、輝く真珠も、その明るく潤う徳にどうして比べられよう。それゆえ、その知恵は通じてとらわれなく、精神はまだ形のないものまで推し量る。六塵（ろくじん）をはるかに超え出て、その芳しい名を千年の後へ伝えるのである。心を内なる境地に凝らし、正しい教えの霊妙な働きが隠れたことを悲しみ、深遠な仏門に思いを寄せながら、多くの教えに誤りがあるのを案じた。筋道を分けて明らかにしたいと願い、そのために心を浄土（じょうど）へ向け、杖をついて、ただ一人、遠い旅へ出た。
    朝には積もる雪が吹き舞い、道の地面も見えなくなる。夕べには激しい砂が巻き起こり、空の外まで天がかすむ。万里の山河を、もやと霞を払いながら歩み、幾重もの寒暑を、霜と雨をくぐって進んだ。誠を重んじ、苦労を軽く見て、深く求め、奥まで達しようとした。西方の国々を巡ること十四年。異郷をくまなく訪れ、正しい教えを尋ね求めた。双林（そうりん）や八水（はっすい）では、道を味わい、風を食として旅を続け、鹿苑（ろくおん）や鷲峰（じゅほう）では、珍しいものを眺め、すぐれたものを仰いだ。先の聖者から至上の言葉を承け、高き賢者から真の教えを授かった。妙なる門の奥を探り、その深い営みを精しく究めた。三乗（さんじょう）と六律（りくりつ）の道は心の田を駆けめぐり、一蔵、百の箱に収める文章は、海のような口から波となってあふれ出る。
    こうして巡った国々には果てがなく、求め得た経には確かな数がある。大乗の肝要な経文、合わせて三十五部、五千四十八巻を得て、中華に訳し広め、すぐれた仏業を宣揚する。西の果てから慈悲の雲を引き寄せ、東の辺境に法の雨を注ぐ。聖なる教えは欠けていたものが再び全うされ、民は罪の境遇から福へ帰る。燃える家の乾いた炎を和らげ、ともに暗い道から救い出し、金水（きんすい）の濁った波を明るくして、ともに彼岸（ひがん）へ至らせる。こうして分かる。悪しき者は業によって落ち、善き者は縁によって昇る。昇るか落ちるか、そのもとは、ただ人がみずから作るのである。
    たとえば桂は高い峰に生え、雲をしのいでこそ、その花に露を受けられる。蓮は緑の波から伸び出し、舞い上がる塵も、その葉を汚すことができない。蓮の性質がひとりでに清く、桂の本質がもとから堅く正しいからではない。身を置くところが高いので、微小な汚れにわずらわされず、頼るものが清いので、濁ったものに染まらないのである。草木には知覚がないのに、なお善い環境に助けられて善くなる。まして、人には知覚があるのだから、よい縁によって幸いを成さないことがあろうか。今こそ願う。この経が広く伝わり、日月とともに尽きることなく、大きな幸いが遠くまで行きわたり、天地とともに永く広大であらんことを。
  "translation_status": "reviewed"
- "id": "xy-ch100-018"
  "section_id": "chapter-100"

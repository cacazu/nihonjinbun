  "source_text": "五聖果位之時，諸眾佛祖、菩薩、聖僧、羅漢、揭諦、比丘、優婆夷塞、各山各洞神仙、大神、丁甲、功曹、伽藍、土地，一切得道的師仙，始初俱來聽講，至此各歸方位。你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 173
    "line_end": 173
    "source_sequence": 29
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "五人の聖者が悟りの位を得たとき、諸々の仏祖、菩薩、聖僧、羅漢（らかん）、掲諦、比丘、在家の男女の信徒、各山各洞の神仙、大神、丁甲（ていこう）、功曹（こうそう）、伽藍（がらん）の守護神、土地神（とちがみ）、そして道を得たあらゆる師仙たちは、初めから皆、説法を聞くために集まっていたが、ここに至って、それぞれの方位へ帰った。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch100-030"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": "靈鷲峰頭聚霞彩，極樂世界集祥雲。金龍穩臥，玉虎安然。烏兔任隨來往，龜蛇憑汝盤旋。丹鳳青鸞情爽爽，玄猿白鹿意怡怡。八節奇花，四時仙果。喬松古檜，翠柏修篁。五色梅時開時結，萬年桃時熟時新。千果千花爭秀，一天瑞靄紛紜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 174
    "line_end": 174
    "source_sequence": 30
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    霊鷲峰（りょうじゅほう）の頂には色鮮やかな霞が集い、極楽世界（ごくらくせかい）には吉兆の雲が集まる。
    金の竜は穏やかに横たわり、玉の虎は安らかだ。
    日と月は思うままに行き来し、亀と蛇は自由に巡る。
    丹い鳳凰と青い鸞（らん）は心も晴れやかに、黒い猿と白い鹿は気持ちよく楽しむ。
    八節（はっせつ）には珍しい花、四季には仙界の果実。
    高い松と古いヒノキ、青々とした柏（はく）と長い竹。
    五色の梅は折々に咲いて実を結び、万年の桃は折々に熟して新しくなる。
    千の果実、千の花が美しさを競い、空いっぱいにめでたい霞がわき立つ。
  "translation_status": "reviewed"

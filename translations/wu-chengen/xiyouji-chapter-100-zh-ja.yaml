  "translation_ja": |-
    さて、八大金剛は香る風を起こし、三蔵たち四人と馬、合わせて五つの身を導いて、ふたたび霊山へ戻った。往きも帰りも含めて、ちょうど八日以内であった。そのとき霊山の神々は、皆、仏の前で説法を聞いていた。八大金剛は師弟を中へ案内し、如来へ申し上げた。「弟子どもは先に尊いご命令を承り、聖僧たちを唐（とう）の国までお送りし、経を納めさせました。ただいま、命を果たしたご報告に戻りました。」
    そして三蔵たちを呼び、前へ進んで位を授かるようにさせた。如来「聖僧よ、お前は前世、私の二番目の弟子で、金蝉子（きんせんし）といった。説法を聞かず、私の偉大な教えを軽んじたため、その魂を落として東の国に生まれ変わらせたのだ。今は喜ばしくも帰依し、私の加持を受け、私の教えに従って真の経を持ち帰った。その功はまことに大きい。高い位の悟りの果を授け、旃檀功徳仏（せんだんくどくぶつ）とする。
    孫悟空（そんごくう）。お前は天宮で大騒動を起こしたため、私は深い法力で五行山（ごぎょうざん）の下へ押さえつけた。幸い、天の科した災いの期間を終え、釈迦（しゃか）の教えに帰した。さらに、悪を抑えて善をあらわし、道中では魔を鍛え伏せ、怪を降した功がある。初めから終わりまで務めを全うしたので、高い位の悟りの果を授け、闘戦勝仏（とうせんしょうぶつ）とする。
    猪悟能（ちょごのう）。お前はもと、天河（てんが）の水神、天蓬元帥（てんぽうげんすい）であった。蟠桃会（ばんとうえ）で酒に酔い、仙女に戯れかかったため、下界へ落として生まれ変わらせ、その身は畜類の姿となった。それでも人の身を慕う思いを忘れず、福陵山の雲桟洞で罪を重ねたのち、喜ばしくも大いなる教えに帰し、私の仏門へ入り、道中で聖僧を守った。ただ、まだ頑なな心があり、色欲も消え去ってはいない。荷を担いだ功により、悟りの果となる位を授け、浄壇使者（じょうだんししゃ）とする。」
    八戒は声を上げた。「あの二人は仏になったのに、どうして俺は浄壇使者なのです。」
    如来「お前は食いしん坊で怠け者、腹の入れ物も大きいからだ。天下の四大部洲（しだいぶしゅう）には、私の教えを仰ぐ者がたいへん多い。あらゆる仏事の供物の壇を、お前にきれいに片づけさせよう。たっぷり恩恵にあずかれる位なのだ。何がよくないというのか。
    沙悟浄。お前はもと、捲簾大将（けんれんたいしょう）であった。かつて蟠桃会でガラスの盃を割り、下界へ落とされた。流沙河に住み、人を殺して食べ、罪を重ねたが、幸い私の教えに帰し、誠と敬いをもって加持を受けた。聖僧を守り、山を登って馬を引いた功により、高い位の悟りの果を授け、金身羅漢（こんじんらかん）とする。」
    さらに如来は白馬を呼んだ。「お前はもと、西洋大海（せいようたいかい）の廣晉竜王（こうしんりゅうおう）の子である。父の命令に背き、不孝の罪を犯したが、幸い身を帰し、法に帰し、私の仏門へ帰依した。日ごと聖僧を背負って西へ来させ、また聖なる経を背負って東へ届けた。その功もあるので、悟りの果となる位を授け、八部天竜馬（はちぶてんりゅうめ）とする。」
  "translation_status": "reviewed"
- "id": "xy-ch100-025"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老四眾，俱各叩頭謝恩。馬亦謝恩訖。仍命揭諦引了馬，下靈山後崖化龍池邊，將馬推入池中。須臾間，那馬打個展身，即退了毛皮，換了頭角，渾身上長起金鱗，腮頷下生出銀鬚，一身瑞氣，四爪祥雲，飛出化龍池，盤繞在山門裡擎天華表柱上。諸佛讚揚如來的大法。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 162
    "line_end": 162
    "source_sequence": 25
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "三蔵たち四人は、それぞれ頭を地につけて恩に感謝した。馬も礼を終えた。なおも命が下り、掲諦（ぎゃてい）が馬を導いて、霊山の裏手の崖を下り、化竜池（かりゅうち）のほとりまで行き、池の中へ押し入れた。たちまち馬はぐっと身を伸ばし、毛皮を脱ぎ捨て、頭と角を変えた。全身には金の鱗が生え、頬と顎の下には銀のひげが伸びた。体はめでたい気に包まれ、四つの爪には吉兆の雲をまとい、化竜池から飛び出すと、山門の内側にある、天を支えるほどの華表（かひょう）の柱に巻きついた。諸仏は如来の偉大な法をたたえた。"
  "translation_status": "reviewed"
- "id": "xy-ch100-026"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫行者卻又對唐僧道：「師父，此時我已成佛，與你一般，莫成還戴金箍兒，你還念甚麼緊箍咒掯勒我？趁早兒念個鬆箍兒咒，脫下來，打得粉碎，切莫叫那甚麼菩薩再去捉弄他人。」唐僧道：「當時只為你難管，故以此法制之。今已成佛，自然去矣，豈有還在你頭上之理？你試摸摸看。」行者舉手去摸一摸，果然無之。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 164
    "line_end": 164
    "source_sequence": 26
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    悟空はまた三蔵に言った。「お師匠さま、今は俺も仏になって、あなたと同じです。それでもまだ、この金の輪をかぶらせ、緊箍呪（きんこじゅ）を唱えて俺を締めつけるおつもりですか。さっさと輪を緩める呪文を唱えて、外してください。粉々に打ち砕いて、あの菩薩だか何だかが、二度とほかの者をもてあそべないようにしてやりましょう。」
    三蔵「当時は、お前をどうにも抑えられなかったので、あの法で制したのだ。今はもう仏になったから、おのずと消えている。まだ頭に残っているはずがなかろう。触ってみなさい。」
    悟空が手を上げて触ってみると、果たして輪はなかった。
  "translation_status": "reviewed"
- "id": "xy-ch100-027"
  "section_id": "chapter-100"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時旃檀佛、鬥戰佛、淨壇使者、金身羅漢俱正果了本位，天龍馬亦自歸真。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 166
    "line_end": 166
    "source_sequence": 27
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": "こうして、旃檀仏（せんだんぶつ）となった三蔵、闘戦仏（とうせんぶつ）となった悟空、浄壇使者となった八戒、金身羅漢となった沙悟浄は、皆それぞれの位で悟りの果を得た。天竜馬（てんりゅうめ）もまた、真実の境地へ帰った。このことを証す詩がある。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch100-028"
  "section_id": "chapter-100"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一體真如轉落塵，合和四相復修身。
    五行論色空還寂，百怪虛名總莫論。
    正果旃檀歸大覺，完成品職脫沉淪。
    經傳天下恩光闊，五聖高居不二門。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch100-1500545"
    "precision": "line"
    "line_start": 168
    "line_end": 171
    "source_sequence": 28
    "url": "https://zh.wikisource.org/w/index.php?oldid=1500545&title=西遊記/第100回"
  "translation_ja": |-
    一つの真如（しんにょ）が転じて俗塵へ落ち、四相（しそう）を合わせ、再び身を修めた。
    五行の姿を論ずれば、色も空も静寂へ帰り、多くの怪物の仮の名など、論ずるには及ばない。
    旃檀（せんだん）は悟りの果を得て大覚（だいかく）へ帰り、それぞれの位を成し遂げて、苦界への沈淪（ちんりん）を脱した。
    経は天下へ伝わって恩の光を広く及ぼし、五人の聖者は不二の門（ふにのもん）に高く住まう。
  "translation_status": "reviewed"

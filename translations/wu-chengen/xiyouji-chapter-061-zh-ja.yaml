  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「狼犺」はここでは体が大きく鈍重であるさま。教育部『重編國語辭典修訂本』の第二義と、「欠鑽疾、不活達」の続きに従う。動物名の第一義には取らない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-03"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「乾夫妻」は実体のない、見せかけの夫婦という含みで訳した。悟空が夫の姿を装ったことを自慢する発言であり、原文のない性交や正式な婚姻を起きたこととして補っていない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-04"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「雁を撃つ者が雁のひなに目をつつかれる」は、手慣れた者が逆に相手にしてやられる譬え。定風丹を飲み込んだ経緯と扇が効かない因果関係は、この段落で初めて語り手が明かした説明として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-05"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「我妻許你共相將」は牛魔王の怒りの言葉。「相將」は一緒にいる、連れ立つこと（教育部辞典）。ここでは、妻がお前との同伴を承知したのかと詰問するものと解したが、「許」を含む構文と語調には解釈の余地がある。台詞の責任を語り手の事実確認へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-06"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文「血皮脹的遭瘟」は、血や皮膚の腫れ、疫病を持ち出す罵倒。病名の厳密な同定はできないため、現代の特定疾患に置き換えず、侮辱の荒さを残した。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-07"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「結心癀」は病を持ち出す罵倒と解する。「癀」には病や黄疸の字義があるが、この複合語を現代の特定病名として確定できない。心の内に病が凝ったという像を残した仮訳である。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-08"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この戦闘詩は豚・牛・猿と土神を、木・土・金などの五行や内丹の修行へ重ねる。「金錢長」は原字どおり金銭が育つ像を残し、特定の作物や身体器官へ置き換えない。「丹頭」「元由」などの細かな対応は解釈を留保し、具体的な養生術として説明しない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-09"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "直前の語り手は夜明けと述べる一方、悟空の発言は「今夜」、さらに「半日一夜」とする。巳の刻から申の刻、二、三時辰、一時辰という時間の説明もそのまま保持した。申はおよそ午後三〜五時、巳は午前九〜十一時に相当するが、本作の時系列を計算し直して補訂しない。また、先に語り手が疲労を述べた牛魔王を、ここでは悟空が疲れないと評する点も統一しない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-10"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "豆腐を載せた舟が海で転覆し、湯から来た品が水へ消えるという諺は、得たものが再び失われる譬え。「行不由徑」は近道や小道を通らないという古い格言で、土地神はここで、道をそれない修行へ重ねている。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-11"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "地煞の変化は七十二変に結びつく術の呼び方。「牛王本是心猿變」はこの詩自身の寓意であり、物語上の牛魔王が実は悟空の分身だったという新しい正体の開示にはしない。「頑空」は空に固着することへの批判と解した。龍華は弥勒の説法会を指す仏教語でもあり、ここでは修行が成った後に赴く宴として歌われる。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-12"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "詩は十二支の亥を豚、申を猿に配し、木・土・金・水・火の調和へ重ねる。既済は『易』で坎（水）が上、離（火）が下となる卦で、物事が成る意味も持つ。ここでは水火の調和の寓意として訳した。盂蘭会は供養の法会の名だが、ここで八戒が赴くと歌う集いの具体的な時期や形式は補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-13"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の珍字「䬲」を残す「䬲草」は、草を食う畜生という罵倒として解した。「囔糟食」は酒粕を食う者という侮辱。「不見怎的」を含む罵倒の細かな構文には留保がある。剣から鉄棍への持ち替えは底本の記述に従い、前回の武器名へ勝手に統一しない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-14"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「犧」「犧牲」は祭祀の生け贄となる牛に重ねた語で、実際にこの場で祭られたという意味ではない。原文「遍滿同天」は読みの細部を留保し、法力が天に広がる意で訳した。卯の刻から辰の刻を過ぎるまでという時刻は、そのまま保持した。「束手」は手詰まりの意で、縄に縛られたことにはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-15"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "海東青・黄鷹・烏鳳・白鶴・丹鳳・香獐・餓虎・金銭花斑の豹・金眼狻猊・人熊・賴象の変化を原文の順に残した。烏鳳は黒い鳳、丹鳳は赤い鳳として字面を保ち、現代の鳥種へ固定しない。人熊も現代の熊の種を確定しない。賴象は教育部辞典の「賴象嗑瓜子」で大象と説明され、ここも長い鼻と牙を持つ象。ただし「賴」の修飾の細部は留保する。「要〜」の攻撃は目的・試みであり、獲物を捕食した結果には変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-16"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「道高一尺魔千丈」は、道一尺に対して魔千丈という底本どおりの極端な対比を残す。黄婆は媒介する土の力で、この戦いでは土地神に重なる。木母は八戒の寓意。元老の厳密な指示対象は確定しない。「正果」へ至るという詩の言葉を、この時点で一同がすでに悟ったという散文の事実へ変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-17"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八戒は玉面公主の本体を「玉面狸精」と報告する。前回の「萬年狐王の娘」という説明へ合わせて「狐」に訂正せず、「狸」の字を残した。古い中国語の狸は現代日本語のタヌキだけに限定できない。手下の「犢」は子牛、「特」は牡牛。「獾」「狢」、「麋」「鹿」も別々に列挙されるため、一種にまとめていない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-18"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "北の五台山秘魔巌・潑法金剛、南の峨眉山清涼洞・勝至金剛、東の須弥山摩耳崖・大力金剛、西の崑崙山金霞嶺・永住金剛という底本の順と所属を保持した。既存の四天王へ名前を置き換えない。「毘盧沙門」はこの金剛の号の一部として残し、「毘沙門」へ補訂しない。須弥山という字面だけから、霊吉菩薩の小須弥山と同じ場所とも断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-19"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「魚肚藥叉、巨靈神將」。以前の「魚肚將」「藥叉將」という二名との関係、ここでの区切りや人数は断定できないため、訳は「魚肚薬叉」を保持した。既存の一方の個人へ同表記だけで結び付けない。最初の呼び声は李天王・哪吒と率いられた天将たちの複数の導入に続くため、特定の一人に決めず「天将たち」とした。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-20"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は女道士を意味する「道姑」と、男性の出家者を意味する「比丘」を並べて装いを描く。性別に合わせて「比丘尼」へ訂正せず、またこの着替えだけで正式に出家したと補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-21"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「叩齒」は歯を打ち合わせる儀礼的な動作。「受身受命」は、身をもって仰せを受けるという趣旨に解したが、定型表現としての細かな語義は留保する。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-22"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「五漏」は漢典がこの句を引いて一晩と説明するため、五漏を通して火にかけると訳した。ただし丹と三関を並べる内丹的な詩句でもあり、この文脈での厳密な含みは留保する。三関の身体内の具体的部位も断定しない。実用の養生・医療の手順として示すものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-23"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「不倜儻」はこの文脈では、気前よく応じなかったという羅刹女自身の反省と解した。「血食」は動物の肉を用いる神への供物。土地神の願いを菜食の供物へ弱めない。四十九扇の効き目は、この時点では羅刹女の説明として示す。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-24"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "最初に一扇ずつ三回あおいだのとは別に、ここで続けて四十九回あおぐ。先の三回を四十九回に算入したり、合計を四十九回へ直したりしていない。雨は火のある場所だけに降るという語りも保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-25"
  "section_id": "xy-ch61"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "羅刹女が後に正果を得て経蔵に名を残すくだりは、訳者による後の展開の補足ではなく、この回の語り手が述べる未来予告。その後に見送りの場面へ戻る順序を保った。"
  "translation_status": "reviewed"

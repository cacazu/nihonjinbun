  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「是是是，去去去，管甚牛王會不會。
    木生在亥配為豬，牽轉牛兒歸土類。
    申下生金本是猴，無刑無剋多和氣。
    用芭蕉，為水意，焰火消除成既濟。
    晝夜休離苦盡功，功完趕赴盂蘭會。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 142
    "line_end": 146
    "source_sequence": 16
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    八戒「そうだ、そうだ、そうだ。行こう、行こう、行こう。牛王に腕があろうとなかろうと、構うものか。
    木は亥（い）に生まれ、豚に配される。牛を引き戻せば土の類へ帰る。
    申のもとに生じる金は、もともと猿。互いに損なわず制し合わなければ、和やかな気に満ちる。
    芭蕉を使うのは水の意味、炎が消えれば既済（きせい）となる。
    昼も夜も離れず苦労して功を尽くし、功が成ったら盂蘭会（うらんえ）へ急ごう。」
  "translation_status": "reviewed"
- "id": "xy-ch61-017"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個領著土地、陰兵一齊上前，使釘鈀，掄鐵棒，乒乒乓乓，把一座摩雲洞的前門打得粉碎。諕得那外護頭目戰戰兢兢，闖入裡邊報道：「大王，孫悟空率眾打破前門也。」那牛王正與玉面公主備言其事，懊恨孫行者哩。聽說打破前門，十分發怒，急披掛，拿了鐵棍，從裡邊罵出來道：「潑猢猻！你是多大個人兒，敢這等上門撒潑，打破我門扇？」八戒近前亂罵道：「潑老剝皮！你是個甚樣人物，敢量那個大小？不要走，看鈀。」牛王喝道：「你這個囔糟食的夯貨不見怎的，快叫那猴兒上來。」行者道：「不知好歹的䬲草！我昨日還與你論兄弟，今日就是仇人了。仔細吃吾一棒。」那牛王奮勇而迎。這場比前番更勝。三個英雄廝混在一處，好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 147
    "line_end": 147
    "source_sequence": 17
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    二人は土地神と陰兵を率いて一斉に進み、熊手を振るい、鉄棒を回し、がんがん、どんどんと、摩雲洞の表門を粉々に打ち砕いた。外回りの頭目は怯えて震えながら奥へ飛び込み、報告した。頭目「大王、孫悟空（そんごくう）が大勢を率いて表門を破りました！」
    牛魔王はちょうど玉面公主に一部始終を話し、悟空を恨んでいたところだった。表門を破られたと聞くと、ひどく怒り、急いで武装し、鉄棍を手にして、奥から罵りながら出て来た。牛魔王「不埒な猿め！　お前はどれほど大きな奴だというんだ。よくも人の家で暴れ、俺の門を打ち破ったな！」
    八戒は前に出て、やたらと罵った。八戒「この皮剥ぎの老いぼれめ！　お前こそ何様だ。人の大小を値踏みするつもりか。逃げるな、熊手を受けろ！」
    牛魔王は怒鳴った。牛魔王「この酒粕を食らううすのろ、何をほざく。早くあの猿を来させろ！」
    悟空「善し悪しも分からぬ草食らいめ！　昨日はまだ兄弟として話していたが、今日はもう仇同士だ。俺の一撃を受けてみろ！」
    牛魔王は勇を奮って迎え撃った。今度は前よりも激しい。三人の英雄が入り乱れ、すさまじく戦った。
  "translation_status": "reviewed"
- "id": "xy-ch61-018"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": "釘鈀鐵棒逞神威，同帥陰兵戰老犧。犧牲獨展兇強性，遍滿同天法力恢。使鈀築，著棍擂，鐵棒英雄又出奇。三般兵器叮噹響，隔架遮攔誰讓誰？他道他為首，我道我奪魁。土兵為證難分解，木土相煎上下隨。這兩個說：「你如何不借芭蕉扇？」那一個道：「你焉敢欺心騙我妻？趕妾害兒仇未報，敲門打戶又驚疑。」這個說：「你仔細隄防如意棒，擦著些兒就破皮。」那個說：「好生躲避鈀頭齒，一傷九孔血淋漓。」牛魔不怕施威猛，鐵棍高擎有見機。翻雲覆雨隨來往，吐霧噴風任發揮。恨苦這場都拚命，各懷惡念喜相持。丟架子，讓高低，前迎後擋總無虧。兄弟二人齊努力，單身一棍獨施為。卯時戰到辰時後，戰罷牛魔束手回。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 148
    "line_end": 148
    "source_sequence": 18
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    熊手と鉄棒が神威を誇り、共に陰兵を率いて老いた牛と戦う。
    生け贄の牛は独りで凶暴な力を振るい、その法力は空いっぱいに広がる。
    熊手で突き、棍で打ち、鉄棒の英雄はさらに奇手を出す。
    三種の武器がかんかんと鳴り、受けて防いで、誰が誰に譲るものか。
    彼は自分こそ一番と言い、我は自分こそ首位を取ると言う。
    土の兵が立ち会っても分けがたく、木と土が互いを苦しめ、上へ下へと追いすがる。
    悟空と八戒「なぜ芭蕉扇を貸さない！」
    牛魔王「よくも良心を欺き、俺の妻を騙したな！　妾を追い、息子を害した仇もまだ返していないのに、門を叩き壊し、またも人を驚かすとは！」
    悟空「如意棒（にょいぼう）には気をつけろ。少し触れただけで皮が裂けるぞ！」
    八戒「熊手の歯をよく避けろ。一度傷つけば九つの穴から血がだらだらだ！」
    牛魔王は恐れず、猛威を振るい、鉄棍を高く掲げて機をうかがう。
    行き来にまかせて雲を返し雨を覆し、思うままに霧を吐き、風を噴く。
    恨み深く、皆命を投げ出し、それぞれ殺意を抱いて戦いを好む。
    構えを崩し、高低をかわし、前を迎え後ろを防いで、隙を見せない。
    兄弟二人が力を合わせ、一人は一本の棍で立ち向かう。
    卯（う）の刻から辰（たつ）の刻を過ぎるまで戦い、戦の果て、牛魔王は手詰まりとなって引き返す。
  "translation_status": "reviewed"
- "id": "xy-ch61-019"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他三個捨死忘生，又鬥有百十餘合。八戒發起獃性，仗著行者神通，舉鈀亂築。牛王遮架不住，敗陣回頭，就奔洞門。卻被土地、陰兵攔住洞門，喝道：「大力王，那裡走？　吾等在此。」那老牛不得進洞，急抽身。又見八戒、行者趕來，慌得卸了盔甲，丟了鐵棍，搖身一變，變做一隻天鵝，望空飛走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 150
    "line_end": 150
    "source_sequence": 19
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    三人は死も生も忘れて、さらに百十余合戦った。八戒は向こう見ずな気性をむき出しにし、悟空の神通力を頼んで、熊手を振り上げてめった打ちにした。牛魔王は防ぎきれず、敗れて向きを変え、洞の門へ駆けた。ところが土地神と陰兵たちが門を塞ぎ、声を上げた。土地神と陰兵たち「大力王、どこへ行く！　我々がここにいるぞ。」
    牛魔王は洞へ入れず、急いで身を引いた。さらに八戒と悟空が迫るのを見ると、慌てて兜と鎧を脱ぎ、鉄棍を捨て、身をひと振りして一羽の白鳥に変わり、空へ飛び去った。
  "translation_status": "reviewed"
- "id": "xy-ch61-020"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看見，笑道：「八戒，老牛去了。」那獃子漠然不知，土地亦不能曉，一個個東張西覷，只在積雷山前後亂找。行者指道：「那空中飛的不是？」八戒道：「那是一隻天鵝。」行者道：「正是老牛變的。」土地道：「既如此，卻怎麼好？」行者道：「你兩個打進此門，把群妖盡情剿除，拆了他的窩巢，絕了他的歸路。等老孫與他賭變化去。」那八戒與土地，依言攻破洞門不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 151
    "line_end": 151
    "source_sequence": 20
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    悟空はそれを見て笑った。悟空「八戒、あの牛は行ってしまったぞ。」
    八戒は何のことかさっぱり分からず、土地神にも見当がつかない。二人とも東を見、西を見、積雷山の前や後ろをやみくもに捜していた。
    悟空は指さした。悟空「あの空を飛んでいる奴じゃないか。」
    八戒「あれは白鳥だろう。」
    悟空「まさに、あの牛が化けたものさ。」
    土地神「それなら、どうすればよいでしょう。」
    悟空「お前たち二人は、この門を破って入り、妖怪どもを残らず討ち滅ぼせ。巣を壊し、帰り道を絶ってしまえ。俺はあいつと変化の勝負をしてくる。」
    八戒と土地神が言われたとおり洞の門を破って攻め込む話は、ひとまず置こう。
  "translation_status": "reviewed"
- "id": "xy-ch61-021"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖收了金箍棒，捻訣念咒，搖身一變，變作一個海東青。颼的一翅，鑽在雲眼裡，倒飛下來，落在天鵝身上，抱住頸項嗛眼。那牛王也知是孫行者變化，急忙抖抖翅，變作一隻黃鷹，返來嗛海東青。行者又變作一個烏鳳，專一趕黃鷹。牛王識得，又變作一隻白鶴，長唳一聲，向南飛去。行者立定，抖抖翎毛，又變作一隻丹鳳，高鳴一聲。那白鶴見鳳是鳥王，諸禽不敢妄動，刷的一翅，淬下山崖，將身一變，變作一隻香獐，乜乜些些，在崖前吃草。行者認得，也就落下翅來，變作一隻餓虎，剪尾跑蹄，要來趕獐作食。魔王慌了手腳，又變作一隻金錢花斑的大豹，要傷餓虎。行者見了，迎著風，把頭一幌，又變作一隻金眼狻猊，聲如霹靂，鐵額銅頭，復轉身要食大豹。牛王著了急，又變作一個人熊，放開腳，就來擒那狻猊。行者打個滾，就變作一隻賴象，鼻似長蛇，牙如竹筍，撒開鼻子，要去捲那人熊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 152
    "line_end": 152
    "source_sequence": 21
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "悟空は金箍棒を収め、印を結んで呪文を唱え、身をひと振りすると、一羽の海東青（かいとうせい）に変わった。ひゅうっと翼をひとあおぎして雲の切れ目へ飛び込み、身を返して急降下すると、白鳥の背へ下り、首を抱え込んで目をつついた。牛魔王も悟空の変化と知り、急いで翼を震わせて一羽の黄鷹（こうよう）になり、逆に海東青をつついた。悟空はさらに烏鳳（うほう）に変わり、ひたすら黄鷹を追った。牛魔王はそれと見抜き、今度は白鶴になって長く一声鳴き、南へ飛んだ。悟空はぴたりと止まり、羽を震わせて丹鳳（たんぽう）となり、高らかに一声鳴いた。白鶴は鳳凰（ほうおう）を見た。鳳凰は鳥の王で、ほかの鳥はみな勝手な動きができない。そこでさっと翼をひと振りして山の崖へ急降下し、身を変えて一頭のジャコウジカとなり、目を細めながら崖の前で草を食べた。悟空は見抜いて翼を下ろし、飢えた虎となった。尾を振り、足で地をかき、鹿を追って食おうとする。牛魔王は慌てふためき、銭のような丸い斑点のある大きな豹に変わって、飢えた虎を傷つけようとした。悟空はそれを見ると、風に向かって頭をひと振りし、金の目をした狻猊（しゅんげい）に変わった。声は雷のよう、額は鉄、頭は銅さながらで、身を返して大豹を食おうとする。牛魔王は焦り、人熊（じんゆう）に変わって大股で進み、狻猊を捕まえに来た。悟空はころりと転がり、賴象（らいぞう）に変わった。鼻は長い蛇のようで、牙は竹の子のよう。その鼻を振り伸ばし、人熊を巻き取ろうとした。"
  "translation_status": "reviewed"
- "id": "xy-ch61-022"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "牛王嘻嘻的笑了一笑，現出原身：一隻大白牛，頭如峻嶺，眼若閃光，兩隻角似兩座鐵塔，牙排利刃，連頭至尾有千餘丈長短，自蹄至背有八百丈高下。對行者高叫道：「潑猢猻！你如今將奈我何？」行者也就現了原身，抽出金箍棒來，把腰一躬，喝聲叫：「長！」長得身高萬丈，頭如泰山，眼如日月，口似血池，牙似門扇，手執一條鐵棒，著頭就打。那牛王硬著頭，使角來觸。這一場，真個是撼嶺搖山，驚天動地。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 153
    "line_end": 153
    "source_sequence": 22
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は、へへっと笑い、本来の姿を現した。それは巨大な白牛だった。頭は険しい峰のよう、目は稲光のよう、二本の角は二基の鉄塔のようで、歯は鋭い刃のように並ぶ。頭から尾までの長さは千余丈、蹄から背までの高さは八百丈ほどあった。悟空に向かって大声で叫ぶ。牛魔王「不埒な猿め！　今度は俺をどうするつもりだ！」
    悟空ももとの姿に戻り、金箍棒を取り出して腰をかがめ、悟空「大きくなれ！」と一喝した。身の丈は一万丈となり、頭は泰山（たいざん）、目は日月、口は血の池、歯は門の扉のよう。一本の鉄棒を握り、頭めがけて打ちつけた。牛魔王は頭を突き出し、角で突きかかる。この一戦は、まことに峰を揺さぶり山を震わせ、天を驚かし地を動かすものだった。これを証する詩がある。
  "translation_status": "reviewed"
- "id": "xy-ch61-023"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    道高一尺魔千丈，奇巧心猿用力降。
    若得火山無烈焰，必須寶扇有清涼。
    黃婆矢志扶元老，木母留情掃蕩妖。
    和睦五行歸正果，煉魔滌垢上西方。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 155
    "line_end": 158
    "source_sequence": 23
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    道が一尺高まれば、魔は千丈。機知巧みな心猿が、力を尽くして降す。
    火の山から烈しい炎をなくすには、宝の扇による涼しさがなければならぬ。
    黄婆（こうば）は志を固めて元老を助け、木母（もくぼ）は心を寄せて妖を掃い尽くす。
    五行（ごぎょう）が和して正果（しょうか）へ帰り、魔を錬り、垢を洗って西方へ上る。
  "translation_status": "reviewed"
- "id": "xy-ch61-024"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個大展神通，在半山中賭鬥，驚得那過往虛空一切神眾與金頭揭諦、六甲六丁、一十八位護教伽藍都來圍困魔王。那魔王公然不懼，你看他東一頭，西一頭，直挺挺、光耀耀的兩隻鐵角，往來抵觸；南一撞，北一撞，毛森森，觔暴暴的一條硬尾，左右敲搖。孫大聖當面迎，眾多神四面打。牛王急了，就地一滾，復本像，便投芭蕉洞去。行者也收了法像，與眾多神隨後追襲。那魔王闖入洞裡，閉門不出。概眾把一座翠雲山圍得水泄不通。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 160
    "line_end": 160
    "source_sequence": 24
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "二人は神通力を存分に繰り出し、山の中腹で勝負を争った。空を行き来するあらゆる神々も驚き、金頭掲諦（きんとうぎゃてい）、六甲六丁（ろっこうろくてい）、十八位の護教伽藍（ごきょうがらん）と共に、みな牛魔王を包囲しに来た。牛魔王は堂々として恐れない。見よ、東へ頭を突き、西へ頭を突き、ぴんと真っ直ぐで光り輝く二本の鉄の角を、あちこちへ突き立てる。南へぶつかり、北へぶつかり、毛が逆立ち筋の浮いた硬い尾を、左へ右へと打ち振るう。悟空は正面から迎え撃ち、数多くの神が四方から打ちかかった。牛魔王は追いつめられると、その場でころりと転がってもとの姿に戻り、芭蕉洞へ向かって逃げた。悟空も巨大な姿を収め、神々と共に後を追う。牛魔王は洞の中へ駆け込み、門を閉じて出てこない。一同は翠雲山を、水も漏らさぬほど取り囲んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch61-025"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正都上門攻打，忽聽得八戒與土地、陰兵嚷嚷而至。行者見了，問曰：「那摩雲洞事體如何？」八戒笑道：「那老牛的娘子，被我一鈀築死，剝開衣看，原來是個玉面狸精。那夥群妖，俱是些驢、騾、犢、特、獾、狐、狢、獐、羊、虎、麋、鹿等類，已此盡皆剿戮。又將他洞府房廊放火燒了。土地說他還有一處家小，住居此山，故又來這裡掃蕩也。」行者道：「賢弟有功，可喜，可喜。老孫空與那老牛賭變化，未曾得勝。他變做無大不大的白牛，我變了法天象地的身量。正和他抵觸之間，幸蒙諸神下降，圍困多時，他卻復原身，走進洞去矣。」八戒道：「那可是芭蕉洞麼？」行者道：「正是，正是。羅剎女正在此間。」八戒發狠道：「既是這般，怎麼不打進去，剿除那廝，問他要扇子，倒讓他停留長智，兩口兒敘情？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 161
    "line_end": 161
    "source_sequence": 25
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    一同が門へ攻めかかっていると、八戒と土地神、陰兵が騒ぎながらやって来た。悟空は見つけて尋ねた。悟空「摩雲洞の方はどうなった。」
    八戒は笑った。八戒「あの牛の奥方は、俺が熊手の一撃で打ち殺した。服を剥いで見たら、玉面狸精（ぎょくめんりせい）だったよ。手下の妖怪どもも、ロバ、ラバ、子牛、牡牛、穴熊、狐、狢（むじな）、ジャコウジカ、羊、虎、大鹿、鹿といった連中で、もうみんな討ち殺した。洞の屋敷や回廊も火を放って焼いた。土地神が、あいつにはもう一軒、家族の住む家がこの山にあると言うから、こっちも一掃しに来たんだ。」
    悟空「弟よ、手柄を立てたな。めでたい、めでたい。俺はあの牛と変化を競うばかりで、まだ勝てなかった。あいつは、とてつもなく大きな白牛になり、俺は天と地にかたどった巨体になった。ちょうどぶつかり合っていると、幸い神々が降りて来て、長い間取り囲んでくださった。するとあいつは、もとの姿に戻って洞へ逃げ込んだんだ。」
    八戒「あれが芭蕉洞なのか。」
    悟空「そうだ、そうだ。羅刹女がここにいる。」
    八戒は怒りをあらわにした。八戒「そういうことなら、なぜ打ち入ってあいつを討ち、扇を出せと迫らないんだ。ぐずぐずして悪知恵を働かせ、夫婦で情を交わす暇をやることはないだろう！」
  "translation_status": "reviewed"
- "id": "xy-ch61-026"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好獃子，抖擻威風，舉鈀照門一築，忽辣的一聲，將那石崖連門築倒了一邊。慌得那女童忙報：「爺爺，不知甚人把前門都打壞了。」牛王方跑進去，喘噓噓的，正告訴羅剎女與孫行者奪扇子賭鬥之事。聞報，心中大怒，就口中吐出扇子，遞與羅剎女。羅剎女接扇在手，滿眼垂淚道：「大王，把這扇子送與那猢猻，教他退兵去罷。」牛王道：「夫人啊，物雖小而恨則深。你且坐著，等我再和他比併去來。」那魔重整披掛，又選兩口寶劍，走出門來。正遇著八戒使鈀築門，老牛更不打話，掣劍劈頭便砍。八戒舉鈀迎著，向後倒退了幾步，出門來，早有大聖掄棒當頭。那牛魔即駕狂風，跳離洞府，又都在那翠雲山上相持。眾多神四面圍繞，土地兵左右攻擊。這一場，又好殺哩："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 162
    "line_end": 162
    "source_sequence": 26
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    さすが八戒、威勢を奮い、熊手を上げて門めがけて突き下ろすと、がらがらと音がして、石の崖が門もろとも、一方だけ崩れ落ちた。女童は慌てて知らせた。女童「旦那さま、どこの誰かが、表門をすっかり壊しました！」
    牛魔王は逃げ込んだばかりで、ぜいぜい息をしながら、悟空と扇を奪い合って戦ったことを羅刹女に話しているところだった。知らせを聞くと激怒し、口から扇を吐き出して羅刹女に渡した。羅刹女は扇を手に取り、目にいっぱい涙をためて言った。羅刹女「大王、この扇をあの猿に渡して、兵を引かせてください。」
    牛魔王「お前、品物は小さくても、恨みは深いのだ。ここに座っていろ。もう一度、あいつと勝負してくる。」
    牛魔王は再び武装を整え、今度は二本の宝剣を選び、門から出た。折しも八戒が熊手で門を突き崩していた。牛魔王は一言も言わず、剣を抜いて頭めがけて斬りかかった。八戒は熊手で受け止め、後ろへ数歩退いて門の外へ出る。そこには早くも悟空がいて、棒を頭上から振り下ろした。牛魔王は激しい風に乗って洞から跳び離れ、またも皆で翠雲山の上で戦った。数多くの神が四方を囲み、土地神の兵が左右から攻める。ここでも、すさまじい戦いが繰り広げられた。
  "translation_status": "reviewed"
- "id": "xy-ch61-027"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": "雲迷世界，霧罩乾坤。颯颯陰風砂石滾，巍巍怒氣海波渾。重磨劍二口，復掛甲全身。結冤深似海，懷恨越生嗔。你看齊天大聖因功績，不講當年老故人。八戒施威求扇子，眾神護法捉牛君。牛王雙手無停息，左遮右擋弄精神。只殺得那過鳥難飛皆斂翅，遊魚不躍盡潛鱗。鬼泣神嚎天地暗，龍愁虎怕日光昏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 164
    "line_end": 164
    "source_sequence": 27
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    雲が世界を迷わせ、霧が天地を覆う。
    さあさあと陰風が吹いて砂石が転がり、そびえる怒気に海の波も濁る。
    二本の剣を研ぎ直し、全身に鎧を着直す。
    結んだ恨みは海より深く、恨みを抱けば怒りはますます募る。
    見よ、斉天大聖（せいてんたいせい）は功を立てるため、昔からの古い付き合いも顧みない。
    八戒は威を振るって扇を求め、神々は法を守って牛の君を捕らえようとする。
    牛魔王の両手は休まず、左を防ぎ右を受け、力を振り絞る。
    戦いは激しく、通りかかる鳥も飛べずに翼を畳み、泳ぐ魚も跳ねずに鱗を潜める。
    鬼は泣き神は叫んで天地は暗み、竜は憂え虎は恐れて日光も曇る。
  "translation_status": "reviewed"
- "id": "xy-ch61-028"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那牛王拚命捐軀，鬥經五十餘合，抵敵不住，敗了陣，往北就走。早有五臺山秘魔巖神通廣大潑法金剛阻住，喝道：「牛魔，你往那裡去？我蒙釋迦牟尼佛祖差來，佈列天羅地網，至此擒汝也。」正說間，隨後有大聖、八戒、眾神趕來。那魔王慌轉身，向南而走，又撞著峨眉山清涼洞法力無量勝至金剛擋住，喝道：「吾奉佛旨，在此正要拿住你也。」牛王心慌腳軟，急抽身往東便走，卻逢著須彌山摩耳崖毘盧沙門大力金剛迎住，喝道：「老牛何往？我蒙如來密令，教來捕獲你也。」牛王又悚然而退，向西就走，又遇著崑崙山金霞嶺不壞尊王永住金剛敵住，喝道：「這廝又將安走？我領西天大雷音寺佛老親言，在此把截，誰放你也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 165
    "line_end": 165
    "source_sequence": 28
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は命を投げ出す覚悟で戦い、五十余合に及んだが、敵しきれず、敗れて北へ逃げた。そこには早くも、五台山（ごだいさん）秘魔巌（ひまがん）の神通広大潑法金剛（じんずうこうだいはつほうこんごう）が道を塞いでいた。潑法金剛（はつほうこんごう）「牛魔（ぎゅうま）、どこへ行く！　私は釈迦牟尼仏祖（しゃかむにぶっそ）のお使いで、天にも地にも網を張り、お前を捕らえに来たのだ。」
    そう言う間にも、後ろから悟空、八戒、神々が追って来る。牛魔王は慌てて向きを変え、南へ逃げたが、今度は峨眉山（がびさん）清涼洞（せいりょうどう）の法力無量勝至金剛（ほうりきむりょうしょうしこんごう）が塞いでいた。勝至金剛（しょうしこんごう）「私は仏の仰せを受け、ここでお前を捕らえるところだ！」
    牛魔王は動転して足も萎え、急いで身を引いて東へ逃げる。ところが須弥山（しゅみせん）摩耳崖（まじがい）の毘盧沙門大力金剛（びるしゃもんだいりきこんごう）に迎え止められた。大力金剛（だいりきこんごう）「老牛、どこへ行く。私は如来（にょらい）の密命を受け、お前を捕らえるために来たのだ！」
    牛魔王はまた怯えて退き、西へ逃げた。すると崑崙山（こんろんざん）金霞嶺（きんかれい）の不壊尊王永住金剛（ふえそんのうえいじゅうこんごう）が立ちはだかった。永住金剛（えいじゅうこんごう）「こいつ、またどこへ逃げる！　私は西天の大雷音寺（だいらいおんじ）の仏のお言葉をじかに受け、ここで道を塞いでいる。誰がお前を逃がすものか！」
  "translation_status": "reviewed"
- "id": "xy-ch61-029"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老牛心驚膽戰，悔之不及。見那四面八方都是佛兵天將，真個似羅網高張，不能脫命。正在倉惶之際，又聞得行者帥眾趕來，他就駕雲頭，望上便走。卻好有托塔李天王並哪吒太子，領魚肚藥叉、巨靈神將，幔住空中，叫道：「慢來，慢來。吾奉玉帝旨意，特來此剿除你也。」牛王急了，依前搖身一變，還變做一隻大白牛，使兩隻鐵角去觸天王。天王使刀來砍。隨後孫行者又到。哪吒太子厲聲高叫：「大聖，衣甲在身，不能為禮。愚父子昨日見佛如來發檄奏聞玉帝，言唐僧路阻火焰山，孫大聖難伏牛魔王，玉帝傳旨，特差我父王領眾助力。」行者道：「這廝神通不小，又變作這等身軀，卻怎奈何？」太子笑道：「大聖勿疑，你看我擒他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 166
    "line_end": 166
    "source_sequence": 29
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は肝を冷やし、震え上がった。後悔しても、もう遅い。四方八方に仏の兵、天の将がいて、本当に網を高く張り巡らされたように、命からがら逃げることさえできない。狼狽しているところへ、また悟空が一同を率いて追って来るのが聞こえたので、雲に乗り、上へ逃れた。ちょうどそこには托塔李天王（たくとうりてんのう）と哪吒太子（なたたいし）が、魚肚薬叉（ぎょとやくしゃ）と巨霊神将（きょれいしんしょう）を率いて空を塞いでいた。天将たち「待て、待て！　玉帝（ぎょくてい）のご命令を受け、特にお前を討ち滅ぼしに来たのだ！」
    牛魔王は追いつめられ、先ほどのように身をひと振りして、また巨大な白牛となり、二本の鉄の角で李天王（りてんのう）に突きかかった。李天王は刀で斬りつける。後ろからは悟空も来た。
    哪吒（なた）は鋭い声で呼びかけた。哪吒「大聖、鎧を着けたままで、礼もできず失礼いたします。昨日、私ども親子は、如来が玉帝へ文書を送られたのを拝見しました。唐僧（とうそう）の行く手が火焔山に塞がれ、孫大聖にも牛魔王を降すのは難しい、というお知らせでした。そこで玉帝は命を下し、特に父に兵を率いて加勢するようお命じになったのです。」
    悟空「こいつの神通力は並ではない。またこんな体になったが、どうしたらいいだろう。」
    哪吒は笑った。哪吒「大聖、ご心配には及びません。私が捕らえるところをご覧ください。」
  "translation_status": "reviewed"
- "id": "xy-ch61-030"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這太子即喝一聲：「變！」變得三頭六臂，飛身跳在牛王背上，使斬妖劍望頸項上一揮，不覺得把個牛頭斬下。天王收刀，卻才與行者相見。那牛王腔子裡又鑽出一個頭來，口吐黑氣，眼放金光。被哪吒又砍一劍，頭落處，又鑽出一個頭來。一連砍了十數劍，隨即長出十數個頭。哪吒取出火輪兒掛在那老牛的角上，便吹真火，焰焰烘烘，把牛王燒得張狂哮吼，搖頭擺尾。才要變化脫身，又被托塔天王將照妖鏡照住本像，騰那不動，無計逃生，只叫：「莫傷我命，情願歸順佛家也。」哪吒道：「既惜身命，快拿扇子出來。」牛王道：「扇子在我山妻處收著哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 167
    "line_end": 167
    "source_sequence": 30
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    哪吒はすぐに、哪吒「変われ！」と一喝し、三つの頭と六本の腕を持つ姿になった。身を飛ばして牛魔王の背に跳び乗り、斬妖剣（ざんようけん）を首めがけてひと振りすると、たちまち牛の頭が斬り落とされた。李天王は刀を収め、ようやく悟空と挨拶を交わした。ところが牛魔王の胴から、また頭が一つ生え、口から黒い気を吐き、目から金色の光を放った。哪吒がもう一度斬ると、頭が落ちたところへ、また一つ生えてくる。続けざまに十数回斬ったが、それに応じて十数個の頭が次々と生えてきた。
    哪吒は火輪（かりん）を取り出して牛魔王の角に掛け、真火（しんか）を吹きつけた。炎が盛んに燃え、焼かれた牛魔王は狂ったように吼え、頭を振り、尾を揺すった。変化して逃れようとした途端、李天王が照妖鏡（しょうようきょう）で本来の姿を照らしつけたので、身動きもできず、逃げる手もない。ただ叫ぶばかりだった。牛魔王「命は取らないでくれ。進んで仏門に帰順する！」
    哪吒「命が惜しければ、早く扇を出せ。」
    牛魔王「扇はうちの妻が預かっている。」
  "translation_status": "reviewed"
- "id": "xy-ch61-031"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哪吒見說，將縛妖索子解下，跨在他那頸項上，一把拿住鼻頭，將索穿在鼻孔裡，用手牽來。孫行者卻會聚了四大金剛、六丁六甲、護教伽藍、托塔天王、巨靈神將並八戒、土地、陰兵，簇擁著白牛，回至芭蕉洞口。老牛叫道：「夫人，將扇子出來，救我性命。」羅剎聽叫，急卸了釵環，脫了色服，挽青絲如道姑，穿縞素似比丘，雙手捧那柄丈二長短的芭蕉扇子，走出門。又見有金剛眾聖與天王父子，慌忙跪在地下，磕頭禮拜道：「望菩薩饒我夫妻之命，願將此扇奉承孫叔叔成功去也。」行者近前接了扇，同大眾共駕祥雲，徑回東路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 169
    "line_end": 169
    "source_sequence": 31
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    それを聞いた哪吒は、縛妖索（ばくようさく）をほどくと牛魔王の首にまたがり、鼻先をひとつかみにすると、鼻の穴に縄を通し、手で引いて来た。悟空は四大金剛（しだいこんごう）、六丁六甲（ろくていろっこう）、護教伽藍、李天王、巨霊神（きょれいしん）、それに八戒、土地神、陰兵を集め、白牛を囲んで芭蕉洞の前へ戻った。
    牛魔王「お前、扇を出して、俺の命を助けてくれ！」
    羅刹女はその呼び声を聞くと、急いでかんざしや耳飾りを外し、色鮮やかな服を脱ぎ、黒髪を道姑（どうこ）のように結い、比丘（びく）のような白い衣を着た。そして一丈二尺ほどの芭蕉扇を両手に捧げ、門から出て来た。金剛（こんごう）たちや諸聖、李天王親子もいるのを見ると、慌てて地にひざまずき、頭を打ちつけて拝礼した。羅刹女「菩薩（ぼさつ）さま、どうか私たち夫婦の命をお助けください。この扇は孫（そん）の義弟どのへ差し上げ、お務めを果たしていただきとうございます。」
    悟空は進み寄って扇を受け取り、一同と瑞雲に乗って、まっすぐ東の道へ戻った。
  "translation_status": "reviewed"
- "id": "xy-ch61-032"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那三藏與沙僧立一會，坐一會，盼望行者，許久不回，何等憂慮。忽見祥雲滿空，瑞光滿地，飄飄颻颻，蓋眾神行將近，這長老害怕道：「悟淨，那壁廂是誰神兵來也？」沙僧認得道：「師父啊，那是四大金剛、金頭揭諦、六甲六丁、護教伽藍與過往眾神。牽牛的是哪吒三太子，拿鏡的是托塔李天王，大師兄執著芭蕉扇，二師兄並土地隨後，其餘的都是護衛神兵。」三藏聽說，換了毘盧帽，穿了袈裟，與悟淨拜迎眾聖，稱謝道：「我弟子有何德能，敢勞列位尊聖臨凡也。」四大金剛道：「聖僧喜了，十分功行將完。吾等奉佛旨差來助汝，汝當竭力修持，勿得須臾怠惰。」三藏叩齒叩頭，受身受命。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 170
    "line_end": 170
    "source_sequence": 32
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    さて、三蔵と沙悟浄（さごじょう）は、立っては座り、座っては立って悟空を待っていた。長いこと戻らず、どれほど心配したことか。すると突然、空いっぱいに瑞雲が広がり、地いっぱいにめでたい光が満ち、ゆらゆらと神々の一団が近づいて来た。三蔵は恐れて尋ねた。三蔵「悟浄、あちらから来るのは、どちらの神兵ですか。」
    沙悟浄は見分けて答えた。沙悟浄「お師匠さま、あれは四大金剛、金頭掲諦、六甲六丁、護教伽藍と、行き来されていた神々です。牛を引いているのが哪吒三太子（なたさんたいし）、鏡を持っているのが托塔李天王。一番上の悟空兄さんが芭蕉扇を持ち、二番目の八戒兄さんと土地神が後ろにいます。ほかはみな、護衛の神兵です。」
    三蔵は聞くと、毘盧帽（びるぼう）にかぶり替え、袈裟（けさ）を着け、沙悟浄と共に諸聖を拝み迎えて礼を述べた。三蔵「弟子の私に何ほどの徳や力があって、皆さまにわざわざ下界までお越しいただけたのでしょう。」
    四大金剛「聖僧よ、喜ぶがよい。修行の功は、ことごとく成就しようとしている。我々は仏の命を受けてお前を助けに来た。力の限り修行に励み、ほんのひとときも怠ってはならぬ。」
    三蔵は歯を打ち鳴らし、額を地につけて礼拝し、その身に仰せを承った。
  "translation_status": "reviewed"
- "id": "xy-ch61-033"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖執著扇子，行近山邊，盡氣力揮了一扇，那火焰山平平息焰，寂寂除光。行者喜喜歡歡，又搧一扇，只聞得習習瀟瀟，清風微動。第三扇，滿天雲漠漠，細雨落霏霏。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 172
    "line_end": 172
    "source_sequence": 33
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "悟空は扇を持って山のそばへ行き、力いっぱいひとあおぎした。火焔山の炎はすっかり鎮まり、光も静かに消え失せた。悟空は嬉しそうに、もうひとあおぎする。すると、さわさわと心地よい風がかすかに動いた。三度目にあおぐと、空いっぱいに雲が立ちこめ、細かな雨がしとしと降った。これを証する詩がある。"
  "translation_status": "reviewed"
- "id": "xy-ch61-034"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    火焰山遙八百程，火光大地有聲名。
    火煎五漏丹難熟，火燎三關道不清。
    時借芭蕉施雨露，幸蒙天將助神功。
    牽牛歸佛休顛劣，水火相聯性自平。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 174
    "line_end": 177
    "source_sequence": 34
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    火焔山は遥か八百里に延び、炎の光で天下に名を知られる。
    五漏（ごろう）を通して火にかけても丹は熟しにくく、火が三関（さんかん）を焼けば道は澄まない。
    今、芭蕉を借りて雨露を降らせ、幸い天将の助けを受けて神功を立てる。
    牛を引いて仏へ帰せば狂暴さも止み、水と火が結び合えば本性は自然に平らかになる。
  "translation_status": "reviewed"
- "id": "xy-ch61-035"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時三藏解燥除煩，清心了意。四眾皈依，謝了金剛，各轉寶山。六丁六甲升空保護。過往神祗四散。天王、太子牽牛，徑歸佛地回繳。止有本山土地押著羅剎女，在傍伺候。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 178
    "line_end": 178
    "source_sequence": 35
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "このとき三蔵は暑さも煩いも去り、心が澄み、思いも落ち着いた。師弟四人は帰依の礼をして金剛たちに感謝し、金剛たちはそれぞれの聖なる山へ戻った。六丁六甲は空へ上がって守護し、行き来していた神々も四方へ散った。李天王と哪吒は牛を引き、まっすぐ仏の地へ戻って任務を報告した。ただこの山の土地神だけが、羅刹女を連行して脇に控えていた。"
  "translation_status": "reviewed"
- "id": "xy-ch61-036"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「那羅剎，你不走路，還立在此等甚？」羅剎跪道：「萬望大聖垂慈，將扇子還了我罷。」八戒喝道：「潑賤人，不知高低。饒了你的性命就夠了，還要討甚麼扇子？我們拿過山去，不會賣錢買點心吃？費了這許多精神力氣，又肯與你？雨濛濛的，還不回去哩。」羅剎再拜道：「大聖原說搧息了火還我，今此一場，誠悔之晚矣。只因不倜儻，致令勞師動眾。我等也修成人道，只是未歸正果。見今真身現象歸西，我再不敢妄作。願賜本扇，從立自新，修身養命去也。」土地道：「大聖，趁此女深知息火之法，斷絕火根，還他扇子，小神居此苟安，拯救這方生民，求些血食，誠為恩便。」行者道：「我當時問著鄉人說：這山搧息火，只收得一年五穀，便又火發。如何治得除根？」羅剎道：「要是斷絕火根，只消連搧四十九扇，永遠再不發了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 180
    "line_end": 180
    "source_sequence": 36
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    悟空「羅刹女、お前は帰らず、まだここで何を待っているんだ。」
    羅刹女はひざまずいた。羅刹女「どうか大聖、お慈悲を垂れ、私に扇をお返しください。」
    八戒は怒鳴った。八戒「このあばずれ、身の程知らずめ！　命を助けてもらっただけで十分だろう。まだ扇を返せだと？　俺たちが山の向こうへ持っていって売り、菓子でも買って食えないとでも言うのか。こんなに気力も体力も使ったのに、返してやるものか。雨も降っているんだ。まだ帰らないのか！」
    羅刹女はもう一度拝んだ。羅刹女「大聖は初め、火をあおぎ消したら返すとおっしゃいました。こんなことになって、まことに後悔しても遅うございます。私が気前よく振る舞わなかったばかりに、大勢の方々を動かすことになりました。私たちも修行して人の身を得ましたが、まだ正果には至っておりません。今や夫は本来の姿を現して西方へ帰り、私はもう二度と勝手なことはいたしません。どうか扇をお返しください。心を改め、身を修め、命を養って暮らしたいのです。」
    土地神「大聖、この女は火を消す方法をよく知っていますから、この機に火の根を絶ち、扇を返してやってください。そうすれば私もここで安らかに暮らし、この地方の民を救い、肉の供物も少し頂けます。まことにありがたいお計らいとなりましょう。」
    悟空「先に土地の人に尋ねたところ、この山の火をあおぎ消しても、一年分の五穀（ごこく）が取れるだけで、また火が出ると言っていた。どうすれば根絶やしにできるんだ。」
    羅刹女「火の根を絶つには、続けて四十九回あおぐだけです。そうすれば、永久に再び燃えなくなります。」
  "translation_status": "reviewed"
- "id": "xy-ch61-037"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，執扇子，使盡筋力，望山頭連搧四十九扇，那山上大雨淙淙。果然是寶貝：有火處下雨，無火處天晴。他師徒們立在這無火處，不遭雨濕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 182
    "line_end": 182
    "source_sequence": 37
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "悟空は聞くと扇を握り、力の限り、山の頂へ向けて続けざまに四十九回あおいだ。すると山には、ざあざあと大雨が降った。まさしく宝である。火のある所には雨が降り、火のない所では晴れていた。師弟は火のない所に立っていたので、雨に濡れずに済んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch61-038"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "坐了一夜，次早才收拾馬匹、行李，把扇子還了羅剎。又道：「老孫若不與你，恐人說我言而無信。你將扇子回山，再休生事。看你得了人身，饒你去罷。」那羅剎接了扇子，念個咒語，捏做個杏葉兒，噙在口裡。拜謝了眾聖，隱姓修行，後來也得了正果，經藏中萬古流名。羅剎、土地俱感激謝恩，隨後相送。行者、八戒、沙僧保著三藏，遂此前進，真個是身體清涼，足下滋潤。誠所謂："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 183
    "line_end": 183
    "source_sequence": 38
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    そのまま一晩を過ごし、翌朝になってようやく馬と荷物を整え、悟空は扇を羅刹女に返した。そして悟空「俺が返さなかったら、約束を守らない奴だと人に言われそうだからな。扇を持って山へ帰れ。もう揉め事を起こすんじゃないぞ。人の身を得たことに免じて、見逃してやる。」と言った。
    羅刹女は扇を受け取り、呪文を唱えて杏の葉ほどに縮め、口に含んだ。諸聖に礼を述べ、その後は姓名を隠して修行に励み、のちには正果を得て、経蔵に末永く名を残すこととなった。羅刹女と土地神は共に恩に感謝し、後ろから見送った。悟空、八戒、沙悟浄は三蔵を守り、そこから先へ進んでいった。まことに体は涼しく、足もとは潤っている。まさしく、こういうことだ。
  "translation_status": "reviewed"
- "id": "xy-ch61-039"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": "坎離既濟真元合，水火均平大道成。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 185
    "line_end": 185
    "source_sequence": 39
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "坎（かん）と離（り）が既済となって真元（しんげん）が合し、水と火が等しく調って大道（だいどう）が成る。"
  "translation_status": "reviewed"
- "id": "xy-ch61-040"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知幾年才回東土，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 187
    "line_end": 187
    "source_sequence": 40
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": "さて、いったい何年たてば東土（とうど）へ戻れるのか。それは次回のお話をお聞きいただこう。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-01"
  "section_id": "xy-ch61"

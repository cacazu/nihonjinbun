  "translation_ja": "底本の回題では「破」に「一作『敗』」（別の本文では「敗」とする）という電子版の異読注が挿入されている。原文欄には注を含む取得表示をそのまま残し、回題の訳は主たる「破」に従った。"
  "translation_status": "reviewed"
- "id": "xy-ch61-note-body-02"
  "section_id": "xy-ch61"

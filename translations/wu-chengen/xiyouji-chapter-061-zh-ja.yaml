  "translation_ja": |-
    第六十一回
    八戒、力を添えて魔王を破り　悟空、三たび芭蕉扇を求める
  "translation_status": "reviewed"
- "id": "xy-ch61-002"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表牛魔王趕上孫大聖，只見他肩膊上掮著那柄芭蕉扇，怡顏悅色而行。魔王大驚道：「猢猻原來把運用的方法兒也叨餂得來了。我若當面問他索取，他定然不與；倘若搧我一扇，要去十萬八千里遠，卻不遂了他意？我聞得唐僧在那大路上等候。他二徒弟豬精、三徒弟沙流精，我當年做妖怪時，也曾會他。且變作豬精的模樣，返騙他一場。料猢猻以得意為喜，必不詳細隄防。」好魔王，他也有七十二變，武藝也與大聖一般，只是身子狼犺些。欠鑽疾，不活達些；把寶劍藏了，念個咒語，搖身一變，即變作八戒一般嘴臉。抄下路，當面迎著大聖，叫道：「師兄，我來也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 118
    "line_end": 118
    "source_sequence": 2
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    さて、牛魔王（ぎゅうまおう）が悟空（ごくう）に追いついてみると、悟空はあの芭蕉扇（ばしょうせん）を肩に担ぎ、上機嫌な顔で歩いていた。牛魔王は驚いて言った。牛魔王「あの猿め、使い方までうまく聞き出しおったか。正面から返せと迫っても、渡すはずがない。もし一あおぎされたら、十万八千里も遠くへ飛ばされ、まんまとあいつの思いどおりになってしまう。聞けば唐（とう）の坊主は街道で待っているそうだ。二番弟子の豚の精、三番弟子の流沙河（りゅうさが）の精には、俺も昔、妖怪として暮らしていたころに会ったことがある。ひとつ豚の精に化けて、今度はこちらが騙してやろう。あの猿は成功して浮かれているから、細かいことまで用心してはいまい。」
    さすがの牛魔王、彼も七十二変（しちじゅうにへん）の術を使え、武芸も悟空と互角だった。ただ、体がいくらか大きくて鈍重で、素早くすり抜ける身軽さに欠けていた。剣を隠し、呪文を唱え、身をひと振りすると、八戒（はっかい）そっくりの顔になった。脇道から先回りして悟空を迎え、八戒に化けた牛魔王「兄貴、迎えに来たぞ。」と呼びかけた。
  "translation_status": "reviewed"
- "id": "xy-ch61-003"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖果然歡喜。古人云「得勝的貓兒歡似虎」也，只倚著強能，更不察來人的意思。見是個八戒的模樣，便就叫道：「兄弟，你往那裡去？」牛魔王綽著經兒道：「師父見你許久不回，恐牛魔王手段大，你鬥他不過，難得他的寶貝，教我來迎你的。」行者笑道：「不必費心，我已得了手了。」牛王又問道：「你怎麼得的？」行者道：「那老牛與我戰經百十合，不分勝負。他就撇了我，去那亂石山碧波潭底，與一夥蛟精、龍精飲酒。是我暗跟他去，變作個螃蟹，偷了他所騎的辟水金睛獸，變了老牛的模樣，徑至芭蕉洞哄那羅剎女。那女子與老孫結了一場乾夫妻，是老孫設法騙將來的。」牛王道：「卻是生受了。哥哥勞碌太甚，可把扇子我拿。」孫大聖那知真假，也慮不及此，遂將扇子遞與他。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 119
    "line_end": 119
    "source_sequence": 3
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    悟空は案の定、大喜びした。昔から「勝った猫は虎のようにはしゃぐ」という。自分の強さを頼むばかりで、やって来た者の腹を探ろうともしない。八戒の姿を見ると、すぐに悟空「弟よ、どこへ行くんだ。」と呼びかけた。
    八戒に化けた牛魔王は、それらしく話を合わせた。八戒に化けた牛魔王「お師匠さまは、兄貴があまり長く戻らないので、牛魔王は腕が立つから兄貴でも勝てず、宝も手に入らないんじゃないかと心配して、俺を迎えによこしたんだ。」
    悟空は笑った。悟空「心配はいらない。もう手に入れたぞ。」
    八戒に化けた牛魔王「どうやって手に入れたんだ。」
    悟空「あの牛とは百十合も戦ったが、勝ち負けがつかなかった。すると俺をほったらかしにして、乱石山（らんせきざん）の碧波潭（へきはたん）の底へ行き、蛟（みずち）や竜の精どもと酒を飲んだんだ。俺はこっそり後をつけ、蟹に化けて、あいつが乗っていた辟水金睛獣（へきすいきんせいじゅう）を盗み出した。それからあの牛に化け、まっすぐ芭蕉洞（ばしょうどう）へ行って羅刹女（らせつにょ）を騙したのさ。あの女とは、うわべだけの夫婦を一度演じたというわけだ。俺が知恵を働かせて、この扇を騙し取って来たんだよ。」
    八戒に化けた牛魔王「そりゃご苦労だったな。兄貴はずいぶん疲れただろう。扇は俺が持とう。」
    悟空は本物か偽物かも分からず、そこまで考えも及ばなかったので、扇を渡してしまった。
  "translation_status": "reviewed"
- "id": "xy-ch61-004"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那牛王他知那扇子收放的根本，接過手，不知捻個甚麼訣兒，依然小似一片杏葉，現出本像。開言罵道：「潑猢猻！認得我麼？」行者見了，心中自悔道：「是我的不是了。」恨了一聲，跌足高呼道：「咦！逐年家打雁，今卻被小雁兒嗛了眼睛。」狠得他爆躁如雷，掣鐵棒，劈頭便打；那魔王就使扇子搧他一下。不知那大聖先前變蟭蟟蟲入羅剎女腹中之時，將定風丹噙在口裡，不覺的嚥下肚裡，所以五臟皆牢，皮骨皆固，憑他怎麼搧，再也搧他不動。牛王慌了，把寶貝丟入口中，雙手掄劍就砍。那兩個在那半空中這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 120
    "line_end": 120
    "source_sequence": 4
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は扇を大きくしたり小さくしたりする秘法を知っていた。受け取ると、どんな印を結んだのか、扇はまた杏の葉一枚ほどの小ささになった。牛魔王はもとの姿を現し、罵った。牛魔王「不埒な猿め！　俺が誰か分かるか。」
    悟空はそれを見て、心の中で悔やんだ。悟空の心の声「これは俺が悪かった。」
    悔しさに声を漏らし、地団太を踏んで大声を上げた。悟空「ああ！　毎年雁を撃っている俺が、今日は雁のひなに目をつつかれたか！」
    怒りは雷のように爆発し、鉄棒を抜いて頭めがけて打ち下ろした。牛魔王は扇でひとあおぎする。だが、悟空が先に蟭蟟虫（しょうりょうちゅう）に化けて羅刹女の腹へ入ったとき、口に含んでいた定風丹（ていふうたん）を知らぬ間に飲み込んでいたとは知るまい。そのため五臓（ごぞう）も皮も骨もしっかり固まり、どれほどあおいでも、もう悟空はびくともしなかった。牛魔王は慌てて宝を口へ放り込み、両手で剣を振るって斬りかかった。二人が空中で繰り広げた、すさまじい戦いとは。
  "translation_status": "reviewed"
- "id": "xy-ch61-005"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": "齊天孫大聖，混世潑牛王，只為芭蕉扇，相逢各騁強。粗心大聖將人騙，大膽牛王把扇誆。這一個，金箍棒起無情義；那一個，雙刃青鋒有智量。大聖施威噴彩霧，牛王放潑吐毫光。齊鬥勇，兩不良，咬牙剉齒氣昂昂。播土揚塵天地暗，飛砂走石鬼神藏。這個說：「你敢無知返騙我？」那個說：「我妻許你共相將。」言村語潑，性烈情剛。那個說：「你哄人妻女真該死，告到官司有罪殃。」伶俐的齊天聖，兇頑的大力王，一心只要殺，更不待商量。棒打劍迎齊努力，有些鬆慢見閻王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 122
    "line_end": 122
    "source_sequence": 5
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    天に斉しい孫大聖（そんたいせい）と、世を騒がす荒くれ牛王（ぎゅうおう）。
    ただ芭蕉扇のために出会い、それぞれ強さを競い合う。
    うかつな大聖（たいせい）は人を騙し、大胆な牛王は扇を騙し取った。
    こちらは金箍棒（きんこぼう）を振り上げ、情けも義理も捨て去り、
    あちらは両刃の鋭い剣を操り、知恵を巡らす。
    大聖は威を振るって彩る霧を噴き、牛王は荒れ狂って光を吐く。
    勇を争うどちらも荒くれ、歯を食いしばり、歯ぎしりして気負い立つ。
    土をまき塵を上げ、天地は暗み、砂を飛ばし石を走らせ、鬼神も隠れる。
    悟空「よくも身の程知らずに、この俺を騙し返したな！」
    牛魔王「俺の女房は、お前の連れ合いになると承知したのか！」
    口は汚く、言葉は荒れ、気性は激しく、意地は強い。
    牛魔王「人の妻や娘を騙すとは、死んで当然だ。役所へ訴えれば罪を受けるぞ！」
    利口な斉天聖（せいてんせい）と、凶暴で頑固な大力王（だいりきおう）、
    殺すことばかりを思い、相談する気などまるでない。
    棒で打ち、剣で受け、共に力を尽くす。少しでも気が緩めば閻王（えんおう）に会う。
  "translation_status": "reviewed"
- "id": "xy-ch61-006"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不說他兩個相鬥難分。卻表唐僧坐在途中，一則火氣蒸人，二來心焦口渴，對火焰山土地道：「敢問尊神，那牛魔王法力如何？」土地道：「那牛王神通不小，法力無邊，正是孫大聖的敵手。」三藏道：「悟空是個會走路的，往常家二千里路，一霎時便回，怎麼如今去了一日？斷是與那牛王賭鬥。」叫：「悟能、悟淨，你兩個，那一個去迎你師兄一迎？倘或遇敵，就當用力相助，求得扇子來，解我煩躁，早早過山，趕路去也。」八戒道：「今日天晚，我想著要去接他，但只是不認得積雷山路。」土地道：「小神認得，且教捲簾將軍與你師父做伴，我與你去來。」三藏大喜道：「有勞尊神，功成再謝。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 123
    "line_end": 123
    "source_sequence": 6
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    二人の勝負がつかない話は、ひとまず置こう。街道に座る三蔵（さんぞう）は、炎の熱に蒸されるうえ、気が焦って喉も渇き、火焔山（かえんざん）の土地神に尋ねた。三蔵「神さま、あの牛魔王の法力（ほうりき）は、いかほどのものですか。」
    土地神「あの牛王の神通力（じんつうりき）は並々ならず、その法力には限りがありません。まさに孫大聖と互角の相手でございます。」
    三蔵「悟空は足の速い者です。いつもなら二千里の道でも、たちまち戻って来ます。それが今日は、なぜ一日もかかるのでしょう。きっとあの牛王と戦っているのです。」
    そして呼びかけた。三蔵「悟能（ごのう）、悟浄（ごじょう）、お前たちのうち、どちらか兄弟子を迎えに行ってくれませんか。もし敵と戦っていたら、力を合わせて助け、扇を借りて来てください。私のこの焦りを解き、一刻も早く山を越えて、旅を先へ進めましょう。」
    八戒「今日はもう遅いし、俺も迎えに行こうと思ってはいたんですが、積雷山（せきらいざん）への道が分からないんです。」
    土地神「私が知っております。捲簾将軍（けんれんしょうぐん）にはお師匠さまのおそばにいていただき、私があなたと参りましょう。」
    三蔵は大いに喜んだ。三蔵「お手数をおかけします。事が成りましたら、改めてお礼を申し上げます。」
  "translation_status": "reviewed"
- "id": "xy-ch61-007"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒抖擻精神，束一束皂錦直裰，搴著鈀，即與土地縱起雲霧，徑回東方而去。正行時，忽聽得喊殺聲高，狂風滾滾。八戒按住雲頭看時，原來孫行者與牛王廝殺哩。土地道：「天蓬還不上前，待怎的？」獃子掣釘鈀，厲聲高叫道：「師兄，我來也。」行者恨道：「你這夯貨，誤了我多少大事。」八戒道：「師父教我來迎你，因認不得山路，商議良久，教土地引我，故此來遲，如何誤了大事？」行者道：「不是怪你來遲，這潑牛十分無禮。我向羅剎處弄得扇子來，卻被這廝變作你的模樣，口稱迎我，我一時歡悅，轉把扇子遞在他手，他卻現了本像，與老孫在此比併，所以誤了大事也。」八戒聞言大怒，舉釘鈀，當面罵道：「我把你這血皮脹的遭瘟！你怎敢變作你祖宗的模樣，騙我師兄，使我兄弟不睦？」你看他沒頭沒臉的使釘鈀亂築。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 124
    "line_end": 124
    "source_sequence": 7
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    八戒は気を奮い立たせ、黒い錦の直裰（ちょくたつ）をきゅっと締め、熊手を手にすると、土地神と共に雲霧を起こし、まっすぐ東へ戻っていった。進むうち、突然、高い鬨の声が聞こえ、激しい風が渦を巻いた。八戒が雲を止めて見ると、悟空と牛魔王が戦っている。
    土地神「天蓬（てんぽう）、なぜまだ加勢しないのです。何を待っておられる。」
    八戒は熊手を抜き、鋭く叫んだ。八戒「兄貴、迎えに来たぞ！」
    悟空は腹立たしげに言った。悟空「このうすのろめ、お前のせいで大事をしくじったぞ。」
    八戒「お師匠さまに迎えに行けと言われたんだが、山道を知らないので、しばらく相談して、土地神に案内してもらうことになった。それで遅れたんだ。どうして俺が大事をしくじらせたことになる？」
    悟空「来るのが遅いと責めてるんじゃない。この不埒な牛が、とんでもない奴なんだ。俺が羅刹女から扇を手に入れて来たら、こいつがお前の姿に化け、迎えに来たと言いやがった。俺はつい嬉しくなって、扇をそいつの手へ渡してしまったんだ。すると正体を現し、こうして俺と戦っている。だから大事をしくじったと言うんだよ。」
    八戒は聞いて激怒した。熊手を振り上げ、面と向かって罵った。八戒「この、皮が血で膨れた疫病持ちめ！　よくもご先祖さまの俺の姿に化け、兄貴を騙して、俺たち兄弟を仲違いさせたな！」
    見よ、八戒は頭だろうが顔だろうがお構いなしに、熊手をめった打ちにする。
  "translation_status": "reviewed"
- "id": "xy-ch61-008"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那牛王，一則是與行者鬥了一日，力倦神疲；二則是見八戒的釘鈀兇猛，遮架不住：敗陣就走。只見那火焰山土地帥領陰兵，當面擋住道：「大力王，且住手。唐三藏西天取經，無神不保，無天不佑，三界通知，十方擁護。快將芭蕉扇來搧息火焰，教他無災無障，早過山去；不然，上天責你罪愆，定遭誅也。」牛王道：「你這土地，全不察理。那潑猴奪我子，欺我妾，騙我妻，番番無道，我恨不得囫圇吞他下肚，化作大便餵狗，怎麼肯將寶貝借他？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 125
    "line_end": 125
    "source_sequence": 8
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は、一つには悟空と一日中戦って気力も体力も疲れ果て、二つには八戒の熊手の勢いがすさまじくて防ぎきれず、負けて逃げ出した。すると火焔山の土地神が陰兵（いんぺい）を率いて正面から塞ぎ、土地神「大力王、手を止めなさい。唐三蔵（とうさんぞう）が西天（さいてん）へ経を取りに行く旅は、あらゆる神々、あらゆる天の助けを受けています。三界（さんがい）にあまねく知れ渡り、十方（じっぽう）のすべてが守っているのです。早く芭蕉扇を出し、炎をあおぎ消して、災いも妨げもなく、速やかに山を越えさせなさい。さもなければ天上から罪を問われ、必ず誅殺されますぞ。」と言った。
    牛魔王「この土地神め、まるで道理が分かっていない。あの猿は俺の息子を奪い、妾をいじめ、女房を騙し、一度ならず非道を重ねた。丸呑みにして腹へ収め、糞にして犬に食わせてやりたいくらいだ。どうして宝を貸してやるものか！」
  "translation_status": "reviewed"
- "id": "xy-ch61-009"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，八戒趕上罵道：「我把你個結心癀！快拿出扇來，饒你性命。」那牛王只得回頭，使寶劍又戰八戒。孫大聖舉棒相幫，這一場在那裡好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 127
    "line_end": 127
    "source_sequence": 9
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    まだ言い終わらぬうちに、八戒が追いついて罵った。八戒「この、心臓に腫れ物でもできた奴め！　さっさと扇を出せ。そうすれば命は助けてやる。」
    牛魔王はやむなく振り向き、剣を使って再び八戒と戦った。悟空も棒を上げて助ける。ここでのすさまじい戦いとは。
  "translation_status": "reviewed"
- "id": "xy-ch61-010"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": "成精豕，作怪牛，兼上偷天得道猴。禪性自來能戰煉，必當用土合元由。釘鈀九齒尖還利，寶劍雙鋒快更柔。鐵棒捲舒為主仗，土神助力結丹頭。三家刑剋相爭競，各展雄才要運籌。捉牛耕地金錢長，喚豕歸爐木氣收。心不在焉何作道，神常守舍要拴猴。胡亂嚷，苦相求，三般兵刃響搜搜。鈀築劍傷無好意，金箍棒起有因由。只殺得星不光兮月不皎，一天寒霧黑悠悠。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 129
    "line_end": 129
    "source_sequence": 10
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    精となった豚、怪となった牛、それに天の機を盗んで道を得た猿。
    禅の本性は、もとより戦いによって錬られる。土の力で根源を合わせねばならぬ。
    熊手の九つの歯は尖って鋭く、宝剣の二つの刃はよく切れ、しなやかだ。
    伸び縮みする鉄棒が主力となり、土の神も力を添えて丹（たん）の核を結ぶ。
    三者は互いを損ない制しようと争い、各々の才を振るい、策を巡らす。
    牛を捕らえて地を耕せば金銭が育ち、豚を呼び戻して炉へ入れれば木の気が収まる。
    心がここになくて、どうして道を修められよう。精神をいつも宿に置くには、猿をつながねばならぬ。
    やたらと叫び、苦しみながら求め、三種の兵器がひゅうひゅう鳴る。
    熊手で打ち、剣で傷つけ、好意はなく、金箍棒を振り上げるのにもわけがある。
    戦いのために星は光を失い、月も澄まず、空いっぱいの冷たい霧は黒々と広がった。
  "translation_status": "reviewed"
- "id": "xy-ch61-011"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔王奮勇爭強，且行且鬥，鬥了一夜，不分上下，早又天明。前面是他的積雷山摩雲洞口，他三個與土地、陰兵又諠譁振耳，驚動那玉面公主，喚丫鬟看是那裡人嚷。只見守門小妖來報：「是我家爺爺與昨日那雷公嘴漢子，並一個長嘴大耳的和尚，同火焰山土地等眾廝殺哩。」玉面公主聽言，即命外護的大小頭目，各執槍刀助力。前後點起七長八短，有百十餘口。一個個賣弄精神，拈槍弄棒，齊告：「大王爺爺，我等奉奶奶內旨，特來助力也。」牛王大喜道：「來得好，來得好。」眾妖一齊上前亂砍。八戒措手不及，倒拽著鈀，敗陣而走。大聖縱觔斗雲，跳出重圍。眾陰兵亦四散奔走。老牛得勝，聚群妖歸洞，緊閉了洞門不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 130
    "line_end": 130
    "source_sequence": 11
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    牛魔王は勇を奮い、強さを競い、進みながら戦い続けた。一晩戦っても優劣はつかず、もう夜が明けた。行く手には彼の住む積雷山の摩雲洞（まうんどう）があった。三人と土地神、陰兵たちの騒ぎが耳をつんざき、玉面公主（ぎょくめんこうしゅ）を驚かせた。玉面公主は侍女を呼び、どこの誰が騒いでいるのか見てくるよう命じた。そこへ門番の小妖が報告に来た。門番の小妖「うちの旦那さまが、昨日の雷神のような口をした男と、口が長く耳の大きい坊主、それに火焔山の土地神どもと戦っておられます。」
    玉面公主は聞くと、外回りを守る大小の頭目に、槍や刀を持って加勢するよう命じた。前後して集まったのは、背の高いのや低いのを取り混ぜて百十余り。皆が元気を誇示し、槍や棒を手に、声をそろえて告げた。妖怪たち「大王さま、奥方さまの内々のご命令で、お助けに参りました！」
    牛魔王は大いに喜んだ。牛魔王「よく来た、よく来た！」
    妖怪どもは一斉に進んで、むやみに斬りかかった。八戒は手の打ちようもなく、熊手を後ろへ引きずって敗走した。悟空は觔斗雲（きんとうん）を飛ばし、幾重もの包囲から跳び出した。陰兵たちも四方へ逃げ散った。勝った牛魔王は妖怪どもを集めて洞へ戻り、門を固く閉ざした。こちらの話は置こう。
  "translation_status": "reviewed"
- "id": "xy-ch61-012"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「這廝驍勇，自昨日申時前後與老孫戰起，直到今夜，未定輸贏。卻得你兩個來接力。如此苦鬥半日一夜，他更不見勞困。才這一夥小妖，卻又莽壯。他將洞門緊閉不出，如之奈何？」八戒道：「哥哥，你昨日巳時離了師父，怎麼到申時才與他鬥起？你那兩三個時辰在那裡的？」行者道：「別你後，頃刻就到這座山上，見一個女子，問訊，原來就是他愛妾玉面公主。被我使鐵棒諕他一諕，他就跑進洞，叫出那牛王來。與老孫劖言劖語，嚷了一會。又與他交手，鬥了有一個時辰。正打處，有人請他赴宴去了。是我跟他到那亂石山碧波潭底，變作一個螃蟹，探了消息，偷了他辟水金睛獸，假變牛王模樣，復至翠雲山芭蕉洞，騙了羅剎女，哄得他扇子。出門試演試演方法，把扇子弄長了，只是不會收小。正掮了走處，被他假變做你的嘴臉，返騙了去。故此耽擱兩三個時辰也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 131
    "line_end": 131
    "source_sequence": 12
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    悟空「あいつは勇猛だ。昨日の申（さる）の刻ごろから俺と戦い始めて、今夜まで勝敗が決まらなかった。そこへ、お前たち二人が助けに来てくれた。半日と一晩も苦戦を続けたのに、まだ疲れた様子がない。さっきの小妖どももまた、やたらと屈強だ。洞の門を固く閉じて出てこないが、どうしたものだろう。」
    八戒「兄貴、昨日は巳（み）の刻にお師匠さまと別れたのに、どうして申の刻になるまで戦い始めなかったんだ。その二、三時辰（じしん）の間、どこにいた？」
    悟空「お前たちと別れると、たちまちこの山へ来た。一人の女に会って尋ねてみると、あいつの可愛い妾、玉面公主だった。鉄棒でちょいと脅したら、洞へ駆け込んで牛魔王を呼んで来た。あいつと皮肉を応酬してしばらく言い争い、それから手合わせして一時辰ほど戦った。すると途中で、宴会へ招く使いが来たんだ。俺は後をつけて乱石山の碧波潭の底へ行き、蟹に化けて事情を探り、辟水金睛獣を盗んだ。それから牛魔王に化けて翠雲山（すいうんざん）の芭蕉洞へ行き、羅刹女を騙して扇を手に入れたんだ。外で使い方を試して、扇は大きくなったが、小さくする方法だけが分からない。それを担いで歩いていたら、あいつがお前の顔に化けて、今度は俺から騙し取った。そういうわけで二、三時辰が過ぎたのさ。」
  "translation_status": "reviewed"
- "id": "xy-ch61-013"
  "section_id": "xy-ch61"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒道：「這正是俗語云：『大海裡翻了豆腐船──湯裡來，水裡去。』如今難得他扇子，如何保得師父過山？且回去，轉路走他娘罷。」土地道：「大聖休焦惱，天蓬莫懈怠。但說轉路，就是入了傍門，不成個修行之類。古語云：『行不由徑。』豈可轉走？你那師父在正路上坐著，眼巴巴只望你們成功哩。」行者發狠道：「正是，正是。獃子莫要胡談，土地說得有理。我們正要與他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 132
    "line_end": 132
    "source_sequence": 13
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    八戒「それこそ諺どおり、『大海原で豆腐の舟がひっくり返る。湯から来て、水へ消える』だな。もう扇を手に入れるのは難しい。どうやってお師匠さまを守って山を越す？　いったん帰って、くそったれ、別の道を回ろうぜ。」
    土地神「大聖、焦ってはいけません。天蓬、怠けてはなりません。道を変えると言えば、それは脇道へ入り、修行する者ではなくなるということです。昔の言葉にも『行くに小道によらず』とあります。どうして別の道へ回れましょう。お師匠さまは正しい道に座り、ひたすら皆さんの成功を待っておられるのですよ。」
    悟空は決意を固めた。悟空「そのとおり、そのとおり。八戒、くだらないことを言うな。土地神の言うことがもっともだ。俺たちはまさに、あいつとこうするのさ。」
  "translation_status": "reviewed"
- "id": "xy-ch61-014"
  "section_id": "xy-ch61"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    賭輸贏，弄手段，等我施為地煞變。
    自到西方無對頭，牛王本是心猿變。
    今番正好會源流，斷要相持借寶扇。
    趁清涼，息火焰，打破頑空參佛面。
    行滿超昇極樂天，大家同赴龍華宴。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch61-1500610"
    "precision": "line"
    "line_start": 134
    "line_end": 138
    "source_sequence": 14
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第061回&oldid=1500610"
  "translation_ja": |-
    悟空「勝ち負けを争い、腕を見せよう。俺が地煞（ちさつ）の変化を使ってみせる。
    西方への旅に出てから敵う者はいなかった。牛王も本来、心猿（しんえん）の変じたもの。
    今こそ源と流れを一つに合わせ、何としても戦い抜いて宝の扇を借りよう。
    涼しさに乗じ、炎を消し、頑なな空への執着を破って、仏の御顔にまみえよう。
    修行を満たして極楽天（ごくらくてん）へ昇り、皆そろって龍華（りゅうげ）の宴へ参ろう。」
  "translation_status": "reviewed"

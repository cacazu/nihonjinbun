    "source_text": "三藏聞言，更不謝恩，只教：「放赦，放赦。」國王道：「這和尚甚不通理。朕以一國之富，招你做駙馬，為何不在此享用，念念只要取經？再若推辭，教錦衣官校推出斬了。」長老諕得魂不附體，只得戰兢兢叩頭啟奏道：「感蒙陛下天恩。但貧僧一行四眾，還有三個徒弟在外，今當領納，只是不曾吩咐得一言。萬望召他到此，倒換關文，教他早去，不誤了西來之意。」國王遂准奏道：「你徒弟在何處？」三藏道：「都在會同館驛。」隨即差官召聖僧徒弟領關文西去，留聖僧在此為駙馬。長老只得起身侍立。有詩為證："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 166
        "line_end": 166
        "source_sequence": 28
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      三蔵はそれを聞いても恩に謝すことなく、ただ訴えた。
      三蔵「どうかお許しを、どうかお許しを。」
      国王「この僧は、まったく道理が分からぬな。一国の富をもって婿に迎えるのに、なぜここで豊かに暮らそうとせず、経を求めることばかり考える。さらに断るなら、錦衣の衛兵に命じ、外へ引き出して斬らせるぞ。」
      三蔵は魂が身を離れるほどおびえ、震えながら頭を下げて申し上げるほかなかった。
      三蔵「陛下の大恩、ありがたく存じます。ただ、私どもは四人連れで、ほかに三人の弟子が外におります。このたび仰せをお受けいたしますが、まだ一言も言い置いておりません。どうか弟子たちをここへお呼びになり、旅券を認証して、早く出発させてください。西へ参った志を果たさせていただきたいのです。」
      国王は申し出を許した。
      国王「弟子たちは、どこにいるのだ。」
      三蔵「皆、会同館駅におります。」
      すぐ役人を遣わし、聖僧の弟子を呼んで旅券を受け取らせ、西へ行かせる一方、聖僧はここへ留めて婿にすることにした。三蔵はやむなく立ち上がり、傍らに控えた。そのさまを詠む詩がある。
    "translation_status": "reviewed"
  - "id": "xy-ch93-029"
    "section_id": "chapter-93"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      大丹不漏要三全，苦行難成恨惡緣。
      道在聖傳修在己，善由人積福由天。
      休逞六根多貪欲，頓開一性本來原。
      無愛無思自清淨，管教解脫得超然。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 168
        "line_end": 171
        "source_sequence": 29
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      大丹（だいたん）を漏らさぬためには、三つを完全に保たねばならず、
      苦行が成り難いのは、悪縁のうらめしさゆえ。
      道は聖者が伝えるが、修めるのは自分自身。
      善は人が積み重ね、福は天から来る。
      六根（ろっこん）をほしいままにして、多くを貪り欲してはならぬ。
      ただちに一つの本性、そのもとの源を開くがよい。
      愛着なく、思い煩いなければ、おのずと清らかに澄み、
      必ずや解脱（げだつ）して、縛られぬ境地を得られよう。
    "translation_status": "reviewed"
  - "id": "xy-ch93-030"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "當時差官至會同館驛，宣召唐僧徒弟不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 173
        "line_end": 173
        "source_sequence": 30
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": "さて、命を受けた役人は会同館駅へ行き、三蔵の弟子たちに召し出しを伝えた。この話はいったん置く。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-031"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者自彩樓下別了唐僧，走兩步，笑兩聲，喜喜歡歡的回驛。八戒、沙僧迎著道：「哥哥，你怎麼那般喜笑？師父如何不見？」行者道：「師父喜了。」八戒道：「還未到地頭，又不曾見佛取得經回，是何來之喜？」行者笑道：「我與師父只走至十字街彩樓之下，可可的被當朝公主拋繡毬打中了師父，師父被些宮娥、綵女、太監推擁至樓前，同公主坐輦入朝，招為駙馬，此非喜而何？」八戒聽說，跌腳搥胸道：「早知我去好來，都是那沙僧憊懶。你不阻我啊，我徑奔彩樓之下，一繡毬打著我老豬，那公主招了我，卻不美哉妙哉？俊刮標致，停當，大家造化耍子兒，何等有趣。」沙僧上前，把他臉上一抹道：「不羞，不羞，好個嘴巴骨子。三錢銀子買個老驢──自誇騎得。要是一繡毬打著你，就連夜燒退送紙也還道遲了，敢惹你這晦氣進門？」八戒道：「你這黑子不知趣。醜自醜，還有些風味。自古道：『皮肉粗糙，骨格堅強，各有一得可取。』」行者道：「獃子莫胡談，且收拾行李。但恐師父著了急，來叫我們，卻好進朝保護他。」八戒道：「哥哥又說差了。師父做了駙馬，到宮中與皇帝的女兒交歡，又不是爬山踵路，遇怪逢魔，要你保護他怎的？他那樣一把子年紀，豈不知被窩裡之事，要你去扶揝？」行者一把揪住耳朵，掄拳罵道：「你這個淫心不斷的夯貨！說那甚胡話？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 174
        "line_end": 174
        "source_sequence": 31
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      一方、悟空は飾り楼の下で三蔵と別れると、二歩進んでは二声笑い、うれしそうに駅へ戻った。八戒と沙悟浄が迎えて尋ねた。
      八戒と沙悟浄「兄貴、何がそんなにおかしいのです。お師匠さまの姿が見えませんが。」
      悟空「お師匠さまに、めでたいことがあったんだ。」
      八戒「まだ目的地へ着いてもいないし、仏に会って経をもらって帰ったわけでもない。何がめでたいんだ。」
      悟空は笑った。
      悟空「お師匠さまと十字路の飾り楼の下へ行っただけなのに、ちょうど王女が投げた繍毬が、お師匠さまに当たったんだ。宮女や侍女や宦官が、お師匠さまを取り囲んで楼の前へ連れていき、王女と一緒に輿へ乗せて宮中へ運び、婿に迎えることになった。これがめでたくなくて、何がめでたいんだ。」
      八戒はそれを聞くと、足踏みをして胸をたたいた。
      八戒「ああ、分かっていれば俺が行ったのに。あの沙の弟のろくでなしのせいだ。お前が邪魔しなければ、俺はまっすぐ楼の下へ走っていったんだ。繍毬がこの俺に当たって、王女が婿にしてくれたら、どんなに結構、どんなにすばらしかったろう！　見目よく、器量よく、万事おさまり、めでたいことに皆で楽しめる。どれほど面白かったことか。」
      沙悟浄は進み出て、八戒の顔をひとなでした。
      沙悟浄「恥知らず、恥知らず、まったく口だけは立派ですね。銀三銭（せん）で老いたろばを買い、『よく乗れる』と自分で褒めるようなものです。もし繍毬があなたに当たったら、夜通し厄払いの紙を焼いても、まだ遅かったと言うでしょうよ。こんな厄の種を、家へ入れるものですか。」
      八戒「この黒い奴め、面白みが分からないんだな。醜くても、俺には俺の味がある。昔から『皮膚や肉は粗くても、骨組みは丈夫。それぞれに取りえが一つはある』と言うだろう。」
      悟空「くだらん話はよせ。ひとまず荷物をまとめろ。お師匠さまが困って、俺たちを呼ぶかもしれん。すぐ宮中へ行き、お守りできるようにな。」
      八戒「兄貴、また間違ったことを言っているぞ。お師匠さまは婿になって、宮中で皇帝の娘と情を交わすんだ。山を登り、道を歩いて、化け物や魔物に出くわすわけじゃない。何のために守るんだよ。あれだけの年なら、寝床の中ですることくらい知っているだろう。お前が行って、手を添えて助けてやるのか。」
      悟空は八戒の耳をつかみ、拳を振り上げて罵った。
      悟空「色欲のやまぬ、このろくでなしめ！　何というふざけたことを抜かす！」
    "translation_status": "reviewed"
  - "id": "xy-ch93-032"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正吵鬧間，只見驛丞來報道：「聖上有旨，差官來請三位神僧。」八戒道：「端的請我們為何？」驛丞道：「老神僧幸遇公主娘娘打中繡毬，招為駙馬，故此差官來請。」行者道：「差官在那裡？教他進來。」那官看行者施禮，禮畢，不敢仰視，只管暗暗說道：「是鬼，是怪？是雷公，夜叉？」行者道：「那官兒，有話不說，為何沉吟？」那官兒慌得戰戰兢兢的雙手舉著聖旨，口裡亂道：「我公主有請會親，我主公會親有請。」八戒道：「我這裡沒刑具，不打你，你慢慢說，不要怕。」行者道：「莫成道怕你打？怕你那臉嘴。快收拾挑擔，牽馬進朝見師父，議事去也。」這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 175
        "line_end": 175
        "source_sequence": 32
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      そうして騒いでいるところへ、駅丞が来て伝えた。
      駅丞「陛下の勅命により、お役人が三人の尊いお坊さまを迎えに参りました。」
      八戒「本当か。俺たちを何のために呼ぶんだ。」
      駅丞「老師さまは、幸いにも王女さまの繍毬に当たり、婿にお迎えすることになりました。そのため、お役人がお呼びに来たのです。」
      悟空「役人はどこだ。ここへ通してくれ。」
      役人は悟空に会って礼をしたが、それが済んでも顔を上げられず、小声でつぶやき続けた。
      役人「鬼か、化け物か。雷公（らいこう）か、夜叉（やしゃ）か。」
      悟空「お役人、話すことがあるのなら、なぜ黙って考え込んでいるんだ。」
      役人は慌てふためき、震えながら両手で勅旨を掲げ、口では言葉を取り違えた。
      役人「わが王女さまが、お招きして、ご親族にお会いに……わが主君が、ご親族と、お会いして、お招きに……。」
      八戒「ここには責め道具なんかないし、殴りゃしない。ゆっくり話せ。怖がるな。」
      悟空「お前に殴られるのが怖いとでもいうのか。お前のその顔が怖いんだ。さあ、早く支度して荷物を担ぎ、馬を引いて宮中へ行くぞ。お師匠さまに会って相談だ。」
      まさしく、
    "translation_status": "reviewed"
  - "id": "xy-ch93-033"
    "section_id": "chapter-93"
    "kind": "verse"
    "origin": "source"
    "source_text": "路逢狹道難迴避，定教恩愛反為仇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 177
        "line_end": 177
        "source_sequence": 33
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      旅の途中で狭い道に出会えば、避けることも難しい。
      この恩愛は、必ずやかえって仇となるだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch93-034"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知見了國王有何話說，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 179
        "line_end": 179
        "source_sequence": 34
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": "さて、国王に会って、いったいどのような話をするのか。それは次回のお話。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-001-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三臺」は、天文・四時・鳥獣などを観察する古代帝王の三種の台とも解せる。教育部『重編國語辭典修訂本』「三臺」にはこの語義のほか官署・星座の語義もあり、この詩での指示は確定しない。「元海」は修養を遂げて帰る根源を海になぞらえたものと解した。特定の身体部位や星に断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-002-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は、夜明けの場面で「昨晚」に続けて「今夜」と述べる。訳ではその時間表現の食い違いを直していない。雲に乗って去ったという説明も、寺僧たちの言葉として残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-003-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は八戒と沙僧の笑う様子の後に「說道」を置き、発言者を明記しない。続く沙僧の「二哥」という呼びかけから、最初のからかいは八戒の発言と解した。悟空と三蔵の沈黙は、言語文字を離れた理解をめぐるやり取りとして保持する。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-004-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本には「祗」と「祇」が混在する。原文欄は変えず、訳文では同じ園の名を「祇園」に統一した。黄金で地面を覆う売買の話は、ここでは三蔵が経典から語る故事である。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-005-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「整車坐下」は、車を整えて座る様子と解した。底本の語句は保持し、別本による補訂はしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-006-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「眼溜」「看見頭底」は、沙悟浄が人々の視線と八戒の様子を目ざとく察したという文脈で訳した。「頭底」の個々の字だけから別の動作や位置を補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-007-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "須達多は、給孤独長者として語られている施主の名。新纂浄土宗大辞典「給孤独」とデジタル大辞泉「須達」で同一性を確認した。日本語の読みは後者に明記された「しゅだった」を採用する。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-008-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「覺羅」。長者が付き従う悟りの境地の者を指すと推測されるが、釈迦・羅漢などの特定の名や梵語へは確定できない。原語を残し、清朝の同表記の氏族称号とは結び付けない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-009-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「三汲」「九華」は底本の字を残した。水時計・天の川を配した夜景として訳したが、三汲を三更へ補訂せず、九華を特定の山・建物・燈火と断定しない。具体的な指示には留保がある。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-010-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「衣冠」は衣服・冠のほか、衣冠を着ける官人・士大夫をも指す。国王の善政と人材を並べる対句と捉え、ここは官人たちと訳した。衣服や身なりの盛んな様子を重ねる読みもありうる。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-011-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵は先に四十五歳と答え、ここでは貞観十三年の出発以来十四年を経たと語る。作品内の年齢・旅程の計算を外から合わせ直さず、数字をそのまま保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-012-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "老院主の回想は「去年の今日」だが、語り手はここで「前年」と述べる。訳はそれぞれ「去年の今日」「一昨年」とし、一つの年へ統一しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-013-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "先に昼を過ぎたと記され、ここでは「午時三刻」となる。時刻の表現を底本どおり保持し、現代の分刻みの時刻へは換算しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-014-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「五七十」は五十・七十ほどという大まかな人数の表現として訳した。五十七人などの一つの確定人数へ直していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-015-body"

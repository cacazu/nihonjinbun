    "source_text": "正說處，只見兩個小和尚請吃茶安置，遂而回去。八戒與沙僧在方丈中，突突噥噥的道：「明日要雞鳴走路，此時還不來睡。」行者道：「獃子又說甚麼？」八戒道：「睡了罷，這等夜深，還看甚麼景致？」因此，老僧散去，唐僧就寢。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":

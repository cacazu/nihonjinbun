  - "id": "xy-ch93-007"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者看得是「布金禪寺」，八戒也道是「布金禪寺」。三藏在馬上沉思道：「『布金』……『布金』……這莫不是舍衛國界了麼？」八戒道：「師父，奇啊！我跟師父幾年，再不曾見識得路，今日也識得路了？」三藏說道：「不是。我常看經誦典，說是佛在舍衛城祗樹給孤園。這園說是給孤獨長者問太子買了，請佛講經。太子說：『我這園不賣，他若要買我的時，除非黃金滿布園地。』給孤獨長者聽說，隨以黃金為磚，布滿園地，才買得太子祗園，才請得世尊說法。我想這布金寺莫非就是這個故事？」八戒笑道：「造化，若是就是這個故事，我們也去摸他塊把磚兒送人。」大家又笑了一會，三藏才下得馬來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"

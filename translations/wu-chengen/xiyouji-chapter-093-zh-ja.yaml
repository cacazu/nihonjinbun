    "source_text": |-
      「憶昔檀那須達多，曾將金寶濟貧痾。
      祗園千古留名在，長者何方伴覺羅？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"

    "source_text": "三藏見了問訊。那僧即忙還禮道：「師從何來？」三藏道：「弟子陳玄奘，奉東土大唐皇帝之旨，差往西天拜佛求經。路過寶方，造次奉謁，便借一宿，明日就行。」那僧道：「荒山十方常住，都可隨喜；況長老東土神僧，但得供養，幸甚。」三藏謝了，隨即喚他三人同行。過了迴廊香積，徑入方丈。相見禮畢，分賓主坐定。行者三人，亦垂手坐了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 137
        "line_end": 137
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      三蔵が挨拶の礼をすると、その僧も急いで返礼した。
      僧「老師はどちらからおいでですか。」
      三蔵「弟子の陳玄奘（ちんげんじょう）と申します。東土（とうど）大唐（だいとう）の皇帝の命を受け、西天（さいてん）へ仏を拝して経を求めに参ります。尊いお寺の近くを通りかかり、突然お訪ねいたしました。一晩泊めていただき、明日には出立いたします。」
      僧「この山寺は、十方からの僧を受け入れる寺です。どなたでもお立ち寄りになれます。まして東土の尊いお坊さまに供養を差し上げられれば、何よりありがたいことです。」
      三蔵は礼を述べ、三人の弟子も呼んで一緒に進んだ。回廊と庫裏を通り、まっすぐ方丈（ほうじょう）へ入る。対面の礼を済ませ、客と主人の席に分かれて座った。悟空たち三人も、手を下ろして慎ましく座った。
    "translation_status": "reviewed"
  - "id": "xy-ch93-011"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說這時寺中聽說到了東土大唐取經僧人，寺中若大若小，不問長住、掛榻、長老、行童，一一都來參見。茶罷，擺上齋供。這時長老還正開齋念偈，八戒早是要緊，饅頭、素食、粉湯，一攪直下。這時方丈卻也人多，有知識的，讚說三藏威儀；好耍子的，都看八戒吃飯。卻說沙僧眼溜，看見頭底，暗把八戒捏了一把，說道：「斯文。」八戒著忙，急的叫將起來，說道：「斯文斯文，肚裡空空。」沙僧笑道：「二哥，你不曉的。天下多少斯文，若論起肚子裡來，正替你我一般哩。」八戒方才肯住。三藏念了結齋，左右徹了席面，三藏稱謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 138
        "line_end": 138
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      さて、東土大唐から経を求める僧が来たと聞くと、寺にいる者は老いも若きも、常住の僧も旅の僧も、長老も小僧も、皆一人ずつ挨拶に来た。茶が済むと、精進料理が並べられた。三蔵がまだ食事を始める偈（げ）を唱えているうちから、八戒は待ちきれず、饅頭も精進料理も粉の麺の汁も、一緒くたに腹へ流し込んだ。方丈には人が大勢いて、ものの分かる者は三蔵の立派な物腰を褒め、面白いもの好きは皆、八戒の食べっぷりを見ていた。沙悟浄は目ざとくその様子を見てとり、そっと八戒をつねった。
      沙悟浄「行儀よくしてください。」
      八戒は慌て、じれったそうに声を上げた。
      八戒「行儀、行儀と言ったって、腹の中は空っぽだ！」
      沙悟浄は笑った。
      沙悟浄「二番目の兄貴には分からないのですね。世の中には上品ぶった人が大勢いますが、腹の中となれば、まったく私たちと同じものですよ。」
      八戒は、ようやくがっつくのをやめた。三蔵が食後の経を唱えると、左右の者が膳を下げ、三蔵は礼を述べた。
    "translation_status": "reviewed"
  - "id": "xy-ch93-012"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "寺僧問起東土來因，三藏說到古跡，才問布金寺名之由。那僧答曰：「這寺原是舍衛國給孤獨園寺，又名祇園。因是給孤獨長者請佛講經，金磚布地，又易今名。我這寺一望之前，乃是舍衛國。那時給孤獨長者正在舍衛國居住，我荒山原是長者之祗園，因此遂名給孤布金寺。寺後邊還有祗園基址。近年間，若遇時雨滂沱，還淋出金銀珠兒。有造化的，每每拾著。」三藏道：「話不虛傳果是真。」又問道：「才進寶山，見門下兩廊有許多騾馬車擔的行商，為何在此歇宿？」眾僧道：「我這山喚做百腳山。先年且是太平，近因天氣循環，不知怎的，生幾個蜈蚣精，常在路下傷人；雖不至於傷命，其實人不敢走。山下有一座關，喚做雞鳴關。但到雞鳴之時，才敢過去。那些客人因到晚了，惟恐不便，權借荒山一宿，等雞鳴後便行。」三藏道：「我們也等雞鳴後去罷。」師徒們正說處，又見拿上齋來，卻與唐僧等吃畢。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 139
        "line_end": 139
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      寺の僧が東土から来たわけを尋ねたので、三蔵は古跡の話を持ち出し、布金寺という名の由来を尋ねた。
      僧「この寺は、もとは舎衛国の給孤独園寺（ぎっこどくおんじ）といい、祇園とも申します。給孤独長者が仏を招いて経を説いていただくため、黄金の敷瓦を地面に敷いたことから、今の名に改まったのです。寺から前方を見渡した所が、舎衛国でございます。当時、給孤独長者は舎衛国に住んでおり、この山寺は長者の祇園だったため、給孤布金寺（ぎっこふきんじ）と名づけられました。寺の裏には、今も祇園の跡が残っています。近年も、折よく大雨が降ると、金や銀の粒が洗い出されます。運のよい者は、しばしば拾っております。」
      三蔵「言い伝えは偽りではなく、本当だったのですね。」
      三蔵はさらに尋ねた。
      三蔵「先ほどこちらへ入りました折、門の両側の廊に、騾馬や馬、車や担ぎ荷を持つ商人が大勢おりました。なぜ、ここに泊まっているのでしょう。」
      僧たち「この山は、百脚山（ひゃっきゃくさん）と申します。以前はたいそう平穏でしたが、近ごろ天地の気の巡りが変わったためか、どうしたわけかムカデの妖怪が何匹か現れ、よく道で人を傷つけるのです。命を落とすほどではありませんが、人々は怖くて通れません。山の下には鶏鳴関（けいめいかん）という関所があります。鶏が鳴く時刻になって初めて、皆、そこを通る気になるのです。あの商人たちは着くのが遅くなったので、まずいことになってはと、ひとまずこの山寺に泊まり、鶏が鳴くのを待って発つことにしたのです。」
      三蔵「私たちも、鶏が鳴いてから出立しましょう。」
      師弟がそう話していると、また精進料理が運ばれてきたので、三蔵たちはそれを食べ終えた。
    "translation_status": "reviewed"

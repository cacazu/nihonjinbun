    "source_text": "那樓上繡女宮娥並大小太監，都來對唐僧下拜道：「貴人，貴人，請入朝堂賀喜。」三藏急還禮，扶起眾人，回頭埋怨行者道：「你這猴頭，又是撮弄我也。」行者笑道：「繡毬兒打在你頭上，滾在你袖裡，干我何事？埋怨怎麼？」三藏道：「似此怎生區處？」行者道：「師父，你且放心，便入朝見駕，我回驛報與八戒、沙僧等候。若是公主不招你便罷，倒換了關文就行；如必欲招你，你對國王說：『召我徒弟來，我要吩咐他一聲。』那時召我三個入朝，我其間自能辨別真假。此是倚婚降怪之計。」唐僧無已從言，行者轉身回驛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 164
        "line_end": 164
        "source_sequence": 26
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      楼の上にいた宮女たちと、身分の高い者から低い者までの宦官たちは、皆下りてきて、三蔵の前にひざまずいた。
      宮女と宦官たち「貴人さま、貴人さま。どうぞ朝廷へお入りになり、お祝いをお受けください。」
      三蔵は急いで礼を返し、皆を起こした。それから振り向き、悟空を責めた。
      三蔵「この猿め、また私をそそのかしたのですね。」
      悟空は笑った。
      悟空「繍毬が当たったのはお師匠さまの頭で、転がり込んだのもお師匠さまの袖です。私と何の関係があるのです。なぜ責めるのですか。」
      三蔵「こんなことになって、どうすればよいのです。」
      悟空「お師匠さま、安心して、そのまま宮中へ入り、王にお会いください。私は駅へ戻り、八戒と沙悟浄に知らせて待ちます。王女がお師匠さまを婿にしないというなら、それでよし。旅券の認証を受けて出発すればよい。どうしても婿にするというなら、王に『弟子たちをお呼びください。一言、申しつけておきたいことがあります』とおっしゃるのです。私たち三人が宮中へ呼ばれれば、その間に私が本物か偽物かを見分けられます。婚礼を利用して妖怪を降す計略ですよ。」
      三蔵は仕方なくその言葉に従い、悟空は身を返して駅へ戻った。
    "translation_status": "reviewed"
  - "id": "xy-ch93-027"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老被眾宮娥等撮擁至樓前。公主下樓，玉手相攙，同登寶輦，擺開儀從，回轉朝門。早有黃門官先奏道：「萬歲，公主娘娘攙著一個和尚，想是繡毬打著，現在午門外候旨。」那國王見說，心甚不喜，意欲趕退，又不知公主之意何如，只得含情宣入。公主與唐僧遂至金鑾殿下，正是：一對夫妻呼萬歲，兩門邪正拜千秋。禮畢，又宣至殿上，開言問道：「僧人何來，遇朕女拋毬得中？」唐僧俯伏奏道：「貧僧乃南贍部洲大唐皇帝差往西天大雷音寺拜佛求經的。因有長路關文，特來朝王倒換。路過十字街彩樓之下，不期公主娘娘拋繡毬，打在貧僧頭上。貧僧是出家異教之人，怎敢與玉葉金枝為偶？萬望赦貧僧死罪，倒換關文，打發早赴靈山，見佛求經，回我國土，永註陛下之天恩也。」國王道：「你乃東土聖僧，正是『千里姻緣使線牽』。寡人公主，今登二十歲未婚，因擇今日年月日時俱利，所以結綵樓拋毬，以求佳偶。可可的你來拋著，朕雖不喜，卻不知公主之意如何。」那公主叩頭道：「父王，常言『嫁雞逐雞，嫁犬逐犬』。女有誓願在先，結了這毬，告奏天地神明，撞天婚拋打。今日打著聖僧，即是前世之緣，遂得今生之遇，豈敢更移？願招他為駙馬。」國王方喜，即宣欽天監正臺官選擇日期。一壁廂收拾妝奩，又出旨曉諭天下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 165
        "line_end": 165
        "source_sequence": 27
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      三蔵は宮女たちに取り囲まれ、楼の前へ連れていかれた。偽の王女は楼を下り、美しい手で三蔵の手を取り、一緒に宝の輿へ乗った。儀仗の行列を整え、宮門へ戻る。黄門官（こうもんかん）が先に奏上した。
      黄門官「陛下、王女さまが一人の僧をお連れです。繍毬が当たったものと思われます。ただ今、午門（ごもん）の外で仰せを待っておられます。」
      国王はこれを聞いて、ひどく気に入らず、追い返そうと思った。しかし王女の気持ちが分からず、思いを抑えて、中へ入るよう命じるほかなかった。偽の王女と三蔵は金鑾殿（きんらんでん）の下へ進んだ。まさしく、一組の夫婦が万歳を唱え、邪と正の二つの道が、千秋の長寿を祈って拝んだのである。礼が終わると、二人はさらに殿上へ呼び寄せられ、王が尋ねた。
      国王「僧よ、そなたはどこから来て、わが娘の投げた毬に当たったのだ。」
      三蔵はひれ伏して申し上げた。
      三蔵「私は南贍部洲、大唐皇帝の命を受け、西天の大雷音寺へ仏を拝し、経を求めに参る僧でございます。長旅の旅券を持っておりますので、国王にお目通りし、認証をいただこうと参りました。十字路の飾り楼の下を通ったところ、思いがけず王女さまが繍毬を投げ、私の頭に当たったのでございます。私は家を出て、俗世とは異なる教えに従う者です。どうして高貴な王女さまの伴侶となれましょう。どうか死に値する私の罪をお赦しになり、旅券を認証して、早く霊山へお送りください。仏にお会いして経を求め、国に帰りましても、陛下の大恩を永く心に刻んでまいります。」
      国王「そなたは東土の聖僧か。まさに『千里離れても、夫婦の縁は糸に引かれる』というものだ。わが王女は今、二十歳で、まだ嫁いではおらぬ。今日が年も月も日も時刻も吉に当たるので、飾り楼を組み、毬を投げて、よい伴侶を求めたのだ。たまたまそなたが来て、毬が当たった。私はうれしくはないが、王女がどう思っているかは分からぬ。」
      偽の王女は頭を下げた。
      偽の王女「父上、『鶏に嫁げば鶏に従い、犬に嫁げば犬に従う』と申します。私は前もって誓いを立て、この毬を結び、天地の神々に申し上げて、天の巡り合わせに任せて投げました。今日、聖僧に当たったのは、前世からの縁が今生の出会いとなったのでございます。どうして変えることができましょう。この方を婿に迎えとうございます。」
      国王はそこで初めて喜び、さっそく欽天監（きんてんかん）の長官を呼び、日取りを選ばせた。一方では嫁入り道具を用意させ、また勅命を出して天下へ知らせた。
    "translation_status": "reviewed"
  - "id": "xy-ch93-028"

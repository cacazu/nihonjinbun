    "translation_ja": |-
      時刻はすでに昼を過ぎていた。
      三蔵「そろそろ行きましょう。」
      悟空「私がお供します。」
      八戒「俺が行きます。」
      沙悟浄「二番目の兄貴はやめておきなさい。自分の顔がどんなものか分からないのですか。宮門の前で偉そうにしてはいけません。やはり兄さんに行ってもらいましょう。」
      三蔵「悟浄の言うとおりです。八戒は粗っぽいが、悟空にはまだ細やかなところがあります。」
      八戒は口をとがらせた。
      八戒「お師匠さまは別として、俺たち三人の顔なんて、大して違わないだろうに。」
      三蔵は袈裟（けさ）をまとい、悟空が旅券袋を持って、一緒に出かけた。通りでは、士農工商、文人や墨客、無学な男や普通の人々まで、皆口をそろえて言っていた。
      街の人々「繍毬投げを見に行くぞ。」
      三蔵は道端に立ち、悟空に言った。
      三蔵「ここの人々の服装や身なり、建物や道具、言葉や話しぶりも、わが大唐と同じです。思えば俗家の亡き母も、繍毬を投げて、前世から縁のある父と巡り会い、夫婦になりました。ここにも同じ風習があるのですね。」
      悟空「私たちも見に行ってはどうですか。」
      三蔵「いけません、いけません。私たちのような身なりでは不都合です。いらぬ疑いを受けかねません。」
      悟空「お師匠さま、給孤布金寺の老院主の話を忘れたのですか。一つには飾り楼を見物し、もう一つには本物か偽物かを見分けるのです。こんなに大騒ぎしているのだから、皇帝も王女のめでたい知らせを待っているに違いありません。どうして朝議で政務などしていましょう。まあ、行ってみましょうよ。」
      三蔵はそれを聞くと、本当に悟空と連れ立って出かけた。ありとあらゆる人々が、そこで繍毬投げを見物していた。ああ、この先に待つものを、誰が知ろう。それは、

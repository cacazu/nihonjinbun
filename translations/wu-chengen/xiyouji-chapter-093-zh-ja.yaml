    "source_text": "時已過午。三藏道：「我好去了。」行者道：「我保師父去。」八戒道：「我去。」沙僧道：「二哥罷麼，你的嘴臉不見怎的，莫到朝門外裝胖。還教大哥去。」三藏道：「悟淨說得好，獃子粗夯，悟空還有些細膩。」那獃子掬著嘴道：「除了師父，我三個的嘴臉也差不多兒。」三藏卻穿了袈裟，行者拿了引袋同去。只見街坊上士農工商、文人墨客、愚夫俗子，齊咳咳都道：「看拋繡毬去也。」三藏立於道傍，對行者道：「他這裡人物衣冠、宮室器用、言語談吐，也與我大唐一般。我想著我俗家先母也是拋打繡毬，遇舊姻緣，結了夫婦。此處亦有此等風俗。」行者道：「我們也去看看，如何？」三藏道：「不可，不可。你我服色不便，恐有嫌疑。」行者道：「師父，你忘了那給孤布金寺老僧之言？一則去看彩樓，二則去辨真假。似這般忙忙的，那皇帝必聽公主之喜報，那裡視朝理事？且去去來。」三藏聽說，真與行者相隨，見各項人等俱在那裡看打繡毬。呀！那知此去卻是："

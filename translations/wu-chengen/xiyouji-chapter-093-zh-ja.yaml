    "translation_ja": |-
      話しているところへ、二人の小僧が茶と寝床の用意ができたと迎えに来たので、一同は戻った。方丈では、八戒と沙悟浄がぶつぶつ言っていた。
      八戒と沙悟浄「明日は鶏が鳴いたら出るというのに、こんな時刻になっても、まだ寝に来ない。」
      悟空「おい、また何をぼやいているんだ。」
      八戒「もう寝よう。こんな夜更けに、何の景色を見ようっていうんだ。」
      そこで老院主は帰っていき、三蔵も床に就いた。まさに、

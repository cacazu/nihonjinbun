    "translation_ja": |-
      大きすぎも小さすぎもしないが、青く釉をかけた瓦が立派に葺かれている。
      半ば新しく、半ば古びているが、赤い塀は八の字に広がっている。
      青い松が傘のように枝を広げるのが、ほのかに見える。何百年、何千年昔から、今まで残ってきたものなのだろう。
      流れる水は、さらさらと弦を鳴らすように聞こえる。どの王朝のころ寺が開かれ、ここに残されたのかも分からない。
      山門には大きく『布金禅寺（ふきんぜんじ）』と書かれ、掲げた額には『上古遺跡』と記されている。」

        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      ちょうど午の刻（うまのこく）の三刻、三蔵と悟空が人波に交じり、楼の下へ近づくと、偽の王女は香を取ってたき、天地に祈りを捧げた。左右には五十とも七十ともいう、紅をさした美しい宮女がいて、側仕えの者が繍毬を捧げていた。楼には八つの窓があり、内から外がよく見える。偽の王女は目を巡らせて見渡し、三蔵がすぐ近くへ来たのを見つけると、繍毬を受け取り、自分の手で三蔵の頭めがけて投げた。三蔵はびっくりし、毘盧帽（びるぼう）を斜めに打たれ、慌てて両手で毬を受け止めた。毬はころころ転がり、袖の中へ入った。楼の上では、そろって叫び声が上がった。
      楼の人々「お坊さんに当たった！　お坊さんに当たった！」
      なんということか。十字路にひしめく商人やほかの人々が、われ先に繍毬を奪おうと押し寄せた。悟空は一喝し、歯をむき、腰をかがめると、身の丈を三丈（じょう）ほどにも伸ばし、ものすごい勢いで恐ろしい顔をした。人々は仰天し、転び、這いながら逃げ、誰も近寄ろうとせず、たちまち散り散りになった。悟空は元の姿に戻った。
    "translation_status": "reviewed"

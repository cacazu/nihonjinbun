    "source_text": "話表那個天竺國王，因愛山水花卉，前年帶后妃公主在御花園，月夜賞玩，惹動一個妖邪，把真公主攝去，他卻變做一個假公主。知得唐僧今年今月今日今時到此，他假借國家之富，搭起彩樓，欲招唐僧為偶，採取元陽真氣，以成太乙上仙。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 161
        "line_end": 161
        "source_sequence": 24
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": "さて、この天竺国王は山水や花を愛し、一昨年、后妃と王女を連れて御花園（ぎょかえん）へ行き、月夜の眺めを楽しんだ。そのため一匹の妖怪の心を動かしてしまい、妖怪は本物の王女をさらい、自分が偽の王女に化けたのである。三蔵が今年のこの月、この日、この時にここへ来ると知っていたので、国の富を利用して飾り楼を建てさせ、三蔵を夫に迎え、その元陽（げんよう）の真気を採り、太乙上仙（たいいつじょうせん）になろうとしていた。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-025"

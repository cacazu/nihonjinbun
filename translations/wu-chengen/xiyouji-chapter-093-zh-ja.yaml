        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      三蔵「昔を思う、檀那（だんな）の須達多（しゅだった）は、金銀財宝を施し、貧しい者や病める者を救った。
      祇園にその名は千代まで残るが、長者は今いずこで覚羅（かくら）に付き従っているのだろう。」

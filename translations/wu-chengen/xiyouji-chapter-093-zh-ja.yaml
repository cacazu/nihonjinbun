    "translation_ja": |-
      悟空にも「布金禅寺」と読め、八戒も「布金禅寺」と言った。三蔵は馬上で思いを巡らせた。
      三蔵「『布金（ふきん）』……『布金』……ここは、もしや舎衛国（しゃえこく）の領内でしょうか。」
      八戒「お師匠さま、こりゃ珍しい。何年もお供してきたのに、道をご存じだったことなんかなかった。今日は道が分かったのですか。」
      三蔵「そうではありません。私はよく経典を読んで唱えますが、そこには、仏が舎衛城（しゃえじょう）の祇樹給孤園（ぎじゅぎっこおん）におられたとあります。この園は、給孤独長者（ぎっこどくちょうじゃ）が太子から買い取り、仏を招いて経を説いていただいた所だというのです。太子は、『この園は売らぬ。どうしても買いたければ、園の地面を一面に黄金で覆うことだ』と言いました。給孤独長者はそれを聞くと、黄金を敷瓦にして地面いっぱいに敷き詰めました。そうして初めて太子の祇園（ぎおん）を買い取ることができ、世尊（せそん）を招いて法を説いていただけたのです。この布金寺（ふきんじ）とは、その故事にちなむのではないかと思ったのです。」
      八戒は笑った。
      八戒「こりゃ運がいい。もし、その話の場所なら、俺たちも敷瓦を一枚か二枚くすねて、土産にしてやろう。」
      皆はまたしばらく笑い合い、三蔵はようやく馬を下りた。
    "translation_status": "reviewed"

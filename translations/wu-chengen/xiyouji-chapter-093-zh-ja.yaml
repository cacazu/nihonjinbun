  - "id": "xy-ch93-015"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他都玩著月，緩緩而行。行近後門外，至臺上，又坐了一坐，忽聞得有啼哭之聲。三藏靜心誠聽，哭的是爺娘不知苦痛之言。他就感觸心酸，不覺淚墮，回問眾僧道：「是甚人在何處悲切？」老僧見問，即命眾僧先回去煎茶。見無人，方才對唐僧、行者下拜。三藏攙起道：「老院主，為何行此禮？」老僧道：「弟子年歲百餘，略通人事，每於禪靜之間，也曾見過幾番景象。若老爺師徒，弟子聊知一二，與他人不同。若言悲切之事，非這位師家明辨不得。」行者道：「你且說，是甚事？」老僧道：「舊年今日，弟子正明性月之時，忽聞一陣風響，就有悲怨之聲。弟子下榻，到祗園基上看處，乃是一個美貌端正之女。我問他：『你是誰家女子？為甚到於此地？』那女子道：『我是天竺國國王的公主，因為月下觀花，被風刮來的。』我將他鎖在一間敝空房裡，將那房砌作個監房模樣，門上止留一小孔，僅遞得碗過。當日與眾僧傳道：『是個妖邪，被我綑了。』但我僧家乃慈悲之人，不肯傷他性命。每日與他兩頓粗茶粗飯，吃著度命。那女子也聰明，即解吾意。恐為眾僧點污，就裝風作怪，尿裡眠，屎裡臥。白日家說胡話，呆呆鄧鄧的；到夜靜處，卻思量父母啼哭。我幾番家進城來去打探公主之事，全然無損。故此堅收緊鎖，更不放出。今幸老師來國，萬望到了國中，廣施法力，辨明辨明：一則救拔良善，二則昭顯神通也。」三藏與行者聽罷，切切在心。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 144
        "line_end": 144
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      皆は月を眺めながら、ゆっくり歩いた。裏門の外へ近づき、高台に上がって、またしばらく腰を下ろすと、不意に泣き声が聞こえた。三蔵が心を静めて聞き取ると、父も母も自分の苦しみを知らない、と嘆いているのだった。胸を打たれた三蔵は、思わず涙を流し、僧たちを振り返って尋ねた。
      三蔵「誰が、どこで、あのように悲しんでいるのですか。」
      老院主はそれを聞くと、僧たちに、先に戻って茶を煎れるよう言いつけた。人がいなくなってから、三蔵と悟空の前にひざまずいた。三蔵は抱き起こした。
      三蔵「老院主さま、なぜそのような礼をなさるのです。」
      老院主「私は百余年生き、いくらか人の世のことも分かっております。静かに心を澄まして坐るうちには、幾度か普通でない景象も見ました。老師とお弟子さまが、ほかの方々とは違うことも、少しは存じております。あの悲しい声の事情となると、こちらのお弟子さまでなければ、はっきり見抜くことはできません。」
      悟空「話してみてくれ。どんなことなのだ。」
      老院主「去年の今日、私が心の本性の月を明らかにしようと坐っていたとき、突然、風の音がして、悲しげな声が聞こえました。寝台を下り、祇園の跡へ見に行くと、顔立ちの整った美しい女がおりました。私が『どこの娘さんです。どうしてここへ来たのです』と尋ねると、女は『私は天竺国の王女です。月の下で花を見ているうちに、風にさらわれて来たのです』と答えました。私は、使っていなかった粗末な一室へ女を入れて鍵を掛け、牢のように壁を築き、扉には茶碗がやっと通る小さな穴だけを残しました。その日、僧たちには『妖怪がいたので、私が捕らえておいた』と伝えました。とはいえ、僧は慈悲を旨とする者、命を傷つけるつもりはないとして、毎日二度、粗末な茶と飯を与え、命をつながせております。女も賢く、すぐ私の意図を悟りました。僧たちに身を汚されるのを恐れ、気が狂ったふりをして暴れ、尿の中で眠り、糞の上に横たわりました。昼間はでたらめを口にし、ぼんやりしたふりをしていますが、夜、人が寝静まると、父母を思って泣いているのです。私は幾度か町へ行って王女のことを探ってみましたが、あちらでは何事もない様子です。そのため、ますます厳重に閉じ込め、外へは出しておりません。幸いにも老師がこの国へおいでになりました。どうか都へお着きになったら、大いに法力を振るい、真相をお確かめください。それで善良な者を救い、また神通力のすばらしさをお示しにもなれましょう。」
      三蔵と悟空は聞き終え、深く心に留めた。
    "translation_status": "reviewed"

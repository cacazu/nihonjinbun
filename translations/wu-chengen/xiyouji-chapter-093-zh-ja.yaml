      虎踞龍蟠形勢高，鳳樓麟閣彩光搖。
      御溝流水如環帶，福地依山插錦標。
      曉日旌旗明輦路，春風簫鼓遍溪橋。
      國王有道衣冠勝，五穀豐登顯俊豪。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 152
        "line_end": 155
        "source_sequence": 19
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      虎がうずくまり竜が蟠るように、地形は高く険しく、鳳の楼、麒麟の閣には彩りの光が揺れる。
      宮城の堀の水は帯のように巡り、福ある土地は山を背にして、錦の旗を立てている。
      朝日に旌旗が輝いて帝の道を照らし、春風の中、笛と太鼓の音が、流れに架かる橋々に満ちる。
      国王は正しく治め、官人たちも立派、五穀は豊かに実り、優れた人々が栄える。

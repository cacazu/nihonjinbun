  "known_gaps":
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-002"
      "description_ja": "「三臺」は、天文・四時・鳥獣などを観察する古代帝王の三種の台とも解せる。教育部『重編國語辭典修訂本』「三臺」にはこの語義のほか官署・星座の語義もあり、この詩での指示は確定しない。「元海」は修養を遂げて帰る根源を海になぞらえたものと解した。特定の身体部位や星に断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-003"
      "description_ja": "底本は、夜明けの場面で「昨晚」に続けて「今夜」と述べる。訳ではその時間表現の食い違いを直していない。雲に乗って去ったという説明も、寺僧たちの言葉として残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-004"
      "description_ja": "原文は八戒と沙僧の笑う様子の後に「說道」を置き、発言者を明記しない。続く沙僧の「二哥」という呼びかけから、最初のからかいは八戒の発言と解した。悟空と三蔵の沈黙は、言語文字を離れた理解をめぐるやり取りとして保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-008"
      "description_ja": "「整車坐下」は、車を整えて座る様子と解した。底本の語句は保持し、別本による補訂はしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-011"
      "description_ja": "「眼溜」「看見頭底」は、沙悟浄が人々の視線と八戒の様子を目ざとく察したという文脈で訳した。「頭底」の個々の字だけから別の動作や位置を補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-014"
      "description_ja": "底本は「覺羅」。長者が付き従う悟りの境地の者を指すと推測されるが、釈迦・羅漢などの特定の名や梵語へは確定できない。原語を残し、清朝の同表記の氏族称号とは結び付けない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-017"
      "description_ja": "「三汲」「九華」は底本の字を残した。水時計・天の川を配した夜景として訳したが、三汲を三更へ補訂せず、九華を特定の山・建物・燈火と断定しない。具体的な指示には留保がある。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-019"
      "description_ja": "「衣冠」は衣服・冠のほか、衣冠を着ける官人・士大夫をも指す。国王の善政と人材を並べる対句と捉え、ここは官人たちと訳した。衣服や身なりの盛んな様子を重ねる読みもありうる。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-021"
      "description_ja": "三蔵は先に四十五歳と答え、ここでは貞観十三年の出発以来十四年を経たと語る。作品内の年齢・旅程の計算を外から合わせ直さず、数字をそのまま保った。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-024"
      "description_ja": "老院主の回想は「去年の今日」だが、語り手はここで「前年」と述べる。訳はそれぞれ「去年の今日」「一昨年」とし、一つの年へ統一しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-025"
      "description_ja": "先に昼を過ぎたと記され、ここでは「午時三刻」となる。時刻の表現を底本どおり保持し、現代の分刻みの時刻へは換算しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-025"
      "description_ja": "「五七十」は五十・七十ほどという大まかな人数の表現として訳した。五十七人などの一つの確定人数へ直していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-029"
      "description_ja": "「三全」の三つは、内丹の修養で重んじる精・気・神と解しうるが、原文はここで列挙しない。訳本文は「三つ」に留める。大丹や元陽に関する叙述は物語内の宗教的修養観であり、身体・医療の実践上の効能を示すものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch93-1455642"
      "segment_ids":
        - "xy-ch93-031"
      "description_ja": "原文の「三錢銀子買個老驢──自誇騎得」は、安い老ろばを買って、自分では十分に乗れると自慢するたとえ。自分を褒める八戒への皮肉を保ち、別の諺へ置き換えない。 原文の欠落ではなく、解釈・校訂上の留保。"

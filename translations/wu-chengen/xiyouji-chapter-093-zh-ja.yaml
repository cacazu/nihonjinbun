    "source_text": "當夜睡還未久，即聽雞鳴。那前邊行商烘烘皆起，引燈造飯。這長老也喚醒八戒、沙僧，扣馬收拾，行者叫點燈來。那寺僧已先起來，安排茶湯點心，在後候敬。八戒歡喜，吃了一盤饝饝，把行李、馬匹牽出。三藏、行者對眾辭謝。老僧又向行者道：「悲切之事，在心，在心。」行者笑道：「謹領，謹領。我到城中，自能聆音而察理，見貌而辨色也。」那夥行商哄哄嚷嚷的，也一同上了大路。將有寅時，過了雞鳴關。至巳時，方見城垣。真是鐵甕金城，神洲天府。那城："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 150
        "line_end": 150
        "source_sequence": 18
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      その夜、寝入ってまだ間もないうちに、鶏の声が聞こえた。門の方にいた商人たちは、どやどやと起き出し、灯をともし、食事を作った。三蔵も八戒と沙悟浄を起こし、馬の支度を整えさせた。悟空は灯を持ってくるよう頼んだ。寺の僧たちはすでに起き、茶や湯、軽い食事を用意して、奥で一行をもてなそうと待っていた。八戒は喜んで、蒸し饅頭を一皿平らげ、荷物を運び、馬を引き出した。三蔵と悟空は皆に礼を述べて別れを告げた。老院主は、また悟空に言った。
      老院主「あの悲しい声の件を、どうかお心に、お心に。」
      悟空は笑った。
      悟空「承知した、承知した。都へ行けば、話しぶりから事情を察し、顔つきを見て様子を見抜くこともできるさ。」
      商人たちも、がやがや騒ぎながら、一緒に街道へ出た。寅（とら）の刻になろうとするころ鶏鳴関を通り、巳の刻（みのこく）になって、ようやく城壁が見えた。まさに鉄の甕、金の城ともいうべき堅固さ、神々の地ともいうべき豊かな都であった。その城は、

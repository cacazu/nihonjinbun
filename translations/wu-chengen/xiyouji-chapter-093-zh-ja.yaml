    "source_text": "進得山門，只見山門下挑擔的，背包的，推車的，整車坐下：也有睡的去睡，講的去講。忽見他們師徒四眾，俊的又俊，醜的又醜，大家有些害怕，卻也就讓開些路兒。三藏生怕惹事，口中不住只叫：「斯文，斯文。」這時節，卻也大家收斂。轉過金剛殿後，早有一位禪僧走出，卻也威儀不俗。真是："

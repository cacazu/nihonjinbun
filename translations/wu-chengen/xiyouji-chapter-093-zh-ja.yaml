    "source_languages": []
    "source_locations": []
    "translation_ja": "「三全」の三つは、内丹の修養で重んじる精・気・神と解しうるが、原文はここで列挙しない。訳本文は「三つ」に留める。大丹や元陽に関する叙述は物語内の宗教的修養観であり、身体・医療の実践上の効能を示すものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch93-note-016-body"
    "section_id": "chapter-93"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「三錢銀子買個老驢──自誇騎得」は、安い老ろばを買って、自分では十分に乗れると自慢するたとえ。自分を褒める八戒への皮肉を保ち、別の諺へ置き換えない。"
    "translation_status": "reviewed"

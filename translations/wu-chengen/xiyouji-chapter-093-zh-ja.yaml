    "source_text": "此時上弦月皎。三藏與行者步月閑行，又見個道人來報道：「我們老師爺要見見中華人物。」三藏急轉身，見一個老和尚，手持竹杖，向前作禮道：「此位就是中華來的師父？」三藏答禮道：「不敢。」老僧稱讚不已，因問：「老師高壽？」三藏道：「虛度四十五年矣。敢問老院主尊壽？」老僧笑道：「比老師痴長一花甲也。」行者道：「今年是一百零五歲了。你看我有多少年紀？」老僧道：「師家貌古神清，況月夜眼花，急看不出來。」敘了一會，又向後廊看看。三藏道：「才說給孤園基址，果在何處？」老僧道：「後門外就是。──快教開門。」但見是一塊空地，還有些碎石疊的牆腳。三藏合掌嘆曰："

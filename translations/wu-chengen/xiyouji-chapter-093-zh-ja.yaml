    "source_text": "不小不大，卻也是琉璃碧瓦；半新半舊，卻也是八字紅牆。隱隱見蒼松偃蓋，也不知是幾千百年間故物到於今；潺潺聽流水鳴絃，也不道是那朝代時分開山留得在。山門上，大書著『布金禪寺』；懸匾上，留題著『上古遺跡』。」"

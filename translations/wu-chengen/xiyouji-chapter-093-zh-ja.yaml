        "line_end": 140
        "source_sequence": 13
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      そのころ、上弦の月が明るく輝いていた。三蔵と悟空が月の下をのんびり歩いていると、寺男がやってきて伝えた。
      寺男「私どもの老師さまが、中華（ちゅうか）からおいでの方にお会いしたいそうです。」
      三蔵が急いで振り向くと、竹の杖をついた一人の老僧が進み出て、礼をした。
      老僧「こちらが、中華からおいでの老師さまですかな。」
      三蔵は礼を返した。
      三蔵「はい、恐れ入ります。」
      老僧はしきりに褒め、尋ねた。
      老僧「老師は、おいくつになられますかな。」
      三蔵「いたずらに四十五年を過ごしました。失礼ですが、老院主さまはおいくつでいらっしゃいますか。」
      老院主は笑った。
      老院主「あなたより、無駄に一花甲（かこう）、長く生きております。」
      悟空「それなら今年、百五歳だ。俺は幾つに見えるかな。」
      老院主「お弟子さまはお顔に古雅な趣があり、お心も澄んでおられる。しかも月夜で目がかすみ、すぐには見当がつきません。」
      しばらく話した後、また裏の廊へ見物に行った。
      三蔵「先ほどおっしゃった給孤園（ぎっこおん）の跡は、いったいどこにあるのですか。」
      老院主「裏門の外がそうです。さあ、早く門を開けるように。」
      見ると、そこは空き地で、砕けた石を積んだ塀の土台がいくらか残っていた。三蔵は合掌し、感慨を込めて詠んだ。
    "translation_status": "reviewed"

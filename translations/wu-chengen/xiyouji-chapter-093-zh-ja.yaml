      人靜月沉花夢悄，暖風微透壁窗紗。
      銅壺點點看三汲，銀漢明明照九華。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 147
        "line_end": 148
        "source_sequence": 17
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      人は静まり、月は沈み、花の夢もひっそりと。
      暖かい風が、壁の窓の薄絹をかすかに通る。
      銅の水時計は、滴を重ねて三汲（さんきゅう）を示し、
      天の川は明々と、九華（きゅうか）を照らす。

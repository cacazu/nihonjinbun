    "source_text": "當日入於東市街，眾商各投旅店。他師徒們進城，正走處，有一個會同館驛，三藏等徑入驛內。那驛內管事的即報驛丞道：「外面有四個異樣的和尚，牽一匹白馬進來了。」驛丞聽說有馬，就知是官差的，出廳迎迓。三藏施禮道：「貧僧是東土唐朝欽差靈山大雷音見佛求經的，隨身有關文，入朝照驗。借大人高衙一歇，事畢就行。」驛丞答禮道：「此衙門原設待使客之處，理當款迓。請進，請進。」三藏喜悅，教徒弟們都來相見。那驛丞看見嘴臉醜陋，暗自心驚，不知是人是鬼，戰兢兢的，只得看茶擺齋。三藏見他驚怕，道：「大人勿驚，我等三個徒弟，相貌雖醜，心地俱良。俗謂『面惡人善』，何以懼為？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 156
        "line_end": 156
        "source_sequence": 20
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      その日、一行は東の市場の通りに入った。商人たちはそれぞれ宿へ向かう。師弟も町を歩いていくと、会同館駅（かいどうかんえき）があったので、そのまま中へ入った。駅の係員は、すぐ駅丞（えきじょう）に報告した。
      係員「外から、変わった姿のお坊さまが四人、白馬を一頭引いて入ってきました。」
      駅丞は馬がいると聞き、役目を帯びた使者だと察して、広間から迎えに出た。三蔵は礼をした。
      三蔵「私は、東土唐朝（とうちょう）から勅命を受け、霊山（れいざん）の大雷音寺（だいらいおんじ）で仏にお会いし、経を求めに行く僧です。旅券を持っておりますので、朝廷へ出て照合を受けます。しばらくこちらのお役所で休ませていただき、用が済めばすぐ出立いたします。」
      駅丞は礼を返した。
      駅丞「この役所は、もともと使者の方をお迎えするための場所です。心を尽くしておもてなしするのは当然のこと。さあ、お入りください。どうぞ。」
      三蔵は喜び、弟子たちを皆呼んで挨拶させた。駅丞はその醜い顔を見て、人なのか鬼なのか分からず、心の中で驚いた。おののきながらも、茶と精進料理を用意させるほかなかった。三蔵は相手が怖がっているのを見て言った。
      三蔵「お役人さま、驚かないでください。三人の弟子は、姿は醜くとも、皆心根は善良です。『顔は怖くても、人は善い』と申します。どうしてお恐れになることがありましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch93-021"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "驛丞聞言，方才定了心性，問道：「國師，唐朝在於何方？」三藏道：「在南贍部洲中華之地。」又問：「幾時離家？」三藏道：「貞觀十三年，今已歷過十四載，苦經了些萬水千山，方到此處。」驛丞道：「神僧，神僧！」三藏問道：「上國天年幾何？」驛丞道：「我敝處乃大天竺國，自太祖、太宗傳到今，已五百餘年。現在位的爺爺，愛山水花卉，號做怡宗皇帝，改元靖宴，今已二十八年了。」三藏道：「今日貧僧要去見駕倒換關文，不知可得遇朝？」驛丞道：「好，好，正好。近因國王的公主娘娘年登二十青春，正在十字街頭高結綵樓，拋打繡毬，撞天婚招駙馬。今日正當熱鬧之際，想我國王爺爺還未退朝，若欲倒換關文，趁此時好去。」三藏欣然要走，只見擺上齋來，遂與驛丞、行者等吃了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 157
        "line_end": 157
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      駅丞はそれを聞き、ようやく落ち着いた。
      駅丞「国師（こくし）さま、唐朝はどちらの方角にあるのですか。」
      三蔵「南贍部洲（なんせんぶしゅう）の中華の地にあります。」
      駅丞「いつ、お国をお発ちになりましたか。」
      三蔵「貞観（じょうがん）十三年です。今では、すでに十四年がたちました。幾万もの川や山を苦労して越え、ようやくここへ参ったのです。」
      駅丞「まことに尊いお坊さまです。尊いお坊さまです。」
      三蔵「お国は、どれほどの歴史がおありですか。」
      駅丞「こちらは大天竺国（だいてんじくこく）と申します。太祖（たいそ）、太宗（たいそう）から今まで、すでに五百余年続いております。今の陛下は山水や花を愛され、怡宗皇帝（いそうこうてい）とお呼びします。年号を靖宴（せいえん）と改められ、今は二十八年になります。」
      三蔵「今日、国王に拝謁し、旅券の認証をいただきたいのですが、朝議に間に合いましょうか。」
      駅丞「ええ、ええ、ちょうどよい時です。近ごろ王女さまが、お年二十の花盛りとなられ、十字路に高く飾り楼を組ませて、繍毬（しゅうきゅう）を投げ、天の巡り合わせによって婿をお選びになっています。今日はまさにその盛んな日ですから、陛下もまだ朝議をお引きになってはいないでしょう。旅券の認証をお受けになるなら、今のうちに行かれるのがよろしい。」
      三蔵は喜んで出かけようとしたが、そこへ精進料理が出たので、駅丞や悟空たちと一緒に食べた。

    "source_text": "正當午時三刻，三藏與行者雜入人叢，行近樓下，那公主才拈香焚起，祝告天地。左右有五七十胭嬌繡女，近侍的捧著繡毬。那樓八窗玲瓏，公主轉睛觀看，見唐僧來得至近，將繡毬取過來，親手拋在唐僧頭上。唐僧著了一驚，把個毘盧帽子打歪，雙手忙扶著那毬。那毬轂轆的滾在他衣袖之內。那樓上齊聲發喊道：「打著個和尚了，打著個和尚了。」噫！十字街頭，那些客商人等濟濟哄哄，都來奔搶繡毬。被行者喝一聲，把牙傞一傞，把腰躬一躬，長了有三丈高的個神威，弄出醜臉。諕得些人跌跌爬爬，不敢相近，霎時人散。行者還現了本像。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 163

    "source_text": |-
      起念斷然有愛，留情必定生災。靈明何事辨三臺。行滿自歸元海。
      不論成仙成佛，須從個裡安排。清清淨淨絕塵埃。果正飛昇上界。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 122
        "line_end": 123
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      思いが起これば必ず愛着が生じ、情を留めれば必ず災いを招く。
      明らかな心に、何ゆえ三台（さんだい）を見分ける必要があろう。
      修行を成し遂げれば、おのずと根源の海へ帰る。
      仙人になるにも仏になるにも、この心の内から整えねばならぬ。
      清らかに澄んで、俗世の塵を絶つ。
      正しい果を得れば、天上界へ飛び昇る。
    "translation_status": "reviewed"
  - "id": "xy-ch93-003"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說寺僧天明不見了三藏師徒，都道：「不曾留得，不曾別得，不曾求告得，清清的把個活菩薩放得走了。」正說處，只見南關廂有幾個大戶來請。眾僧撲掌道：「昨晚不曾防禦，今夜都駕雲去了。」眾人齊望空拜謝。此言一講，滿城中官員人等盡皆知之。叫此大戶人家，俱治辦五牲花果，往生祠祭獻酬恩不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 125
        "line_end": 125
        "source_sequence": 3
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      さて、慈雲寺（じうんじ）の僧たちは、夜が明けて三蔵（さんぞう）一行がいないことに気づくと、口々に言った。
      慈雲寺の僧たち「お引き留めもできず、お別れもできず、お願い事もできなかった。生きた菩薩（ぼさつ）さまを、あっさりお帰ししてしまった。」
      そう話しているところへ、南の城門外に住む裕福な家の人々が、何人か招待に来た。僧たちは手を打って言った。
      慈雲寺の僧たち「昨夜は気をつけておきませんでした。今夜、皆さま雲に乗って行ってしまわれたのです。」
      人々はそろって空に向かい、拝んで礼を述べた。この話が広まると、町じゅうの役人も住民も皆それを知った。そこで裕福な家々は、五牲（ごせい）の供え物と花や果物を用意し、生祠（せいし）へ供えて恩に報いた。このことは、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch93-004"
    "section_id": "chapter-93"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說唐僧四眾餐風宿水，一路平寧，行有半個多月。忽一日，見座高山。唐僧又悚懼道：「徒弟，那前面山嶺峻峭，是必小心。」行者笑道：「這邊路上將近佛地，斷乎無甚妖邪，師父放懷勿慮。」唐僧道：「徒弟，雖然佛地不遠，但前日那寺僧說，到天竺國都下有二千里，還不知是有多少路哩。」行者道：「師父，你好是又把烏巢禪師《心經》忘記了也。」三藏道：「《般若心經》是我隨身衣缽，自那烏巢禪師教後，那一日不念？那一時得忘？顛倒也念得來，怎會忘得？」行者道：「師父只是念得，不曾求那師父解得。」三藏說：「猴頭，怎又說我不曾解得？你解得麼？」行者道：「我解得，我解得。」自此，三藏、行者再不作聲。旁邊笑倒一個八戒，喜壞一個沙僧，說道：「嘴巴，替我一般的做妖精出身，又不是那裡禪和子聽過講經，那裡應佛僧也曾見過說法。弄虛頭，找架子，說甚麼『曉得』、『解得』。怎麼就不作聲？聽講，請解。」沙僧說：「二哥，你也信他？大哥扯長話，哄師父走路。他曉得弄棒罷了，他那裡曉得講經？」三藏道：「悟能、悟淨，休要亂說。悟空解得是無言語文字，乃是真解。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch93-1455642"
        "precision": "line"
        "line_start": 126
        "line_end": 126
        "source_sequence": 4
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第093回&oldid=1455642"
    "translation_ja": |-
      さて、三蔵たち四人は、風を食らい水辺に寝る旅を続け、道中何事もなく、半月余り歩いた。ある日、前方に高い山が現れた。三蔵はまた恐ろしくなって言った。
      三蔵「お前たち、前の山は険しそうです。必ず気をつけて行きなさい。」
      悟空（ごくう）は笑った。
      悟空「この辺りは、もう仏の国に近い道です。妖怪など、決しているはずがありません。お師匠さま、気を楽にして、心配なさらないでください。」
      三蔵「仏の国が遠くないとはいえ、この前の寺の僧は、天竺国（てんじくこく）の都まで二千里（り）あると言っていました。まだ、どれほど道が残っているのか分かりません。」
      悟空「お師匠さま、また烏巣禅師（うそうぜんじ）の『心経（しんぎょう）』を忘れてしまったようですね。」
      三蔵「『般若心経（はんにゃしんぎょう）』は、私が肌身離さず受け継いでいる法です。あの烏巣禅師に教えられて以来、唱えなかった日がありますか。ひと時でも忘れたことがありましょうか。逆さにだって唱えられるのに、どうして忘れるのです。」
      悟空「お師匠さまは唱えられるだけで、あのお師匠さんに意味を解き明かしてもらってはいないのです。」
      三蔵「猿め、なぜまた私が理解していないと言うのです。お前には分かるのですか。」
      悟空「分かりますとも、分かりますとも。」
      それきり、三蔵も悟空も何も言わなかった。傍らでは八戒（はっかい）が笑い転げ、沙悟浄（さごじょう）も大喜びだった。
      八戒「口だけは達者だな。俺と同じ妖怪上がりで、どこかの禅僧みたいに経の講義を聞いたわけでも、お勤めをする僧みたいに説法に立ち会ったわけでもないくせに。見せかけを繕って、格好をつけて、『知っている』『分かっている』だとさ。それなら、どうして黙ってるんだ。聞いてやるから、ひとつ説明してくれよ。」
      沙悟浄「二番目の兄貴、あの言葉を信じるのですか。兄さんは話を引き延ばして、お師匠さまを歩かせようとしているだけです。棒の振り回し方は知っていても、お経の講義など分かるものですか。」
      三蔵「悟能（ごのう）、悟浄（ごじょう）、いいかげんなことを言ってはいけません。悟空が理解したのは、言葉にも文字にもよらぬもの。それこそが、本当の理解なのです。」
    "translation_status": "reviewed"

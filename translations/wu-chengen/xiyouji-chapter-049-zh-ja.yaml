  "source_text": "沙僧剖開水路，弟兄們同入通天河內。向水底下行有百十里遠近，那獃子要捉弄行者。行者隨即拔下一根毫毛，變做假身，伏在八戒背上；真身變作一個豬虱子，緊緊的貼在他耳朵裡。八戒正行，忽然打個躘踵，得故子把行者往前一摜，撲的跌了一跤。原來那個假身本是毫毛變的，卻就飄起去，無影無形。沙僧道：「二哥，你是怎麼說？不好生走路，就跌在泥裡，便也罷了，卻把大哥不知跌在那裡去了。」八戒道：「那猴子不禁跌，一跌就跌化了。兄弟，莫管他死活，我和你且去尋師父去。」沙僧道：「不好，還得他來。他雖不知水性，他比我們乖巧。若無他來，我不與你去。」行者在八戒耳朵裡，忍不住高叫道：「悟淨，老孫在這裡也。」沙僧聽得，笑道：「罷了，這獃子是死了，你怎麼就敢捉弄他？如今弄得聞聲不見面，卻怎是好？」八戒慌得跪在泥裡磕頭道：「哥哥，是我不是了。待救了師父，上岸陪禮。你在那裡做聲？就諕殺我也。你請現原身出來，我馱著你，再不敢衝撞你了。」行者道：「是你還馱著我哩。我不弄你，你快走，快走。」那獃子絮絮叨叨，只管念誦著陪禮，爬起來與沙僧又進。"

  "source_text": "卻說孫大聖與八戒、沙僧辭陳老來至河邊，道：「兄弟，你兩個議定，那一個先下水？」八戒道：「哥啊，我兩個手段不見怎的，還得你先下水。」行者道：「不瞞賢弟說，若是山裡妖精，全不用你們費力；水中之事，我去不得。就是下海行江，我須要捻著避水訣，或者變化甚麼魚蟹之形，才去得。若是那般捻訣，卻掄不得鐵棒，使不得神通，打不得妖怪。我久知你兩個乃慣水之人，所以要你兩個下去。」沙僧道：「哥啊，小弟雖是去得，但不知水底如何。我等大家都去。哥哥變作甚麼模樣，或是我馱著你，分開水道，尋著妖怪的巢穴，你先進去打聽打聽。若是師父不曾傷損，還在那裡，我們好努力征討；假若不是這怪弄法，或者渰死師父，或者被妖吃了，我等不須苦求，早早的別尋道路何如？」行者道：「賢弟說得有理。你們那個馱我？」八戒暗喜道：「這猴子不知捉弄了我多少，今番原來不會水，等老豬馱他，也捉弄他捉弄。」獃子笑嘻嘻的叫道：「哥哥，我馱你。」行者就知有意，卻便將計就計道：「是，也好，你比悟淨還有些膂力。」八戒就背著他。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch49-1808612"

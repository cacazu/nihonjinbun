  "translation_ja": |-
    さて、悟空（ごくう）、八戒（はっかい）、沙悟浄（さごじょう）は陳家の老人に別れを告げ、川辺へ来た。
    悟空「弟たち、二人で決めてくれ。どっちが先に水へ入る？」
    八戒「兄貴、俺たち二人の腕前じゃ、大したことはできないよ。やっぱり兄貴が先に入ってくれなきゃ。」
    悟空「弟たちに隠すつもりはない。山の妖怪なら、お前たちの手を煩わせるまでもないが、水の中のこととなると俺には無理なんだ。海へ潜り、川へ入るにも、避水訣（ひすいけつ）を結ぶか、魚や蟹の姿に変わるかしなければ行けない。だが、そんなふうに印を結んでいたら、鉄の棒は振れず、神通力は使えず、妖怪とは戦えない。お前たち二人が水に慣れているのは、前から知っている。だから二人に潜ってもらいたいんだ。」
    沙悟浄「兄さん、私は行けますが、水底がどうなっているか分かりません。皆で行きましょう。兄さんが何かの姿に変わるか、私がおぶるかして、水を分けながら妖怪の巣を捜すのです。兄さんが先に中へ入り、様子を探ってください。お師匠さまが傷つけられず、まだそこにいらっしゃるなら、私たちも力を尽くして討てます。もしこの妖怪の術の仕業でなかったり、お師匠さまが溺れてしまったり、妖怪に食われていたりしたら、むやみに捜し求めても仕方ありません。早々に別の道を探すというのはどうでしょう。」
    悟空「もっともだ。どっちが俺をおぶってくれる？」
    八戒はひそかに喜び、心の中で言った。
    八戒「この猿には、どれほどからかわれたか知れない。ところが今度は、水が苦手だときた。俺がおぶって、ひとつ仕返ししてやろう。」
    にやにや笑いながら、八戒は声をかけた。
    八戒「兄貴、俺がおぶってやるよ。」
    悟空はたちまち企みを見抜いたが、逆にその手に乗った。
    悟空「ああ、それもいい。お前は悟浄（ごじょう）より、いくらか力があるからな。」
    そこで八戒が悟空を背負った。
  "translation_status": "reviewed"
- "id": "xy-ch49-003"

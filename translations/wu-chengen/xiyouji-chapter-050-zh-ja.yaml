  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖魔聽說是齊天大聖孫悟空，老大有些悚懼，口內不言，心中暗想道：「久聞那廝神通廣大，如今不期而會。」教：「小的們，把唐僧綑了；將那兩個解下寶貝，換兩條繩子，也綑了。且擡在後邊，待我拿住他大徒弟，一發刷洗，卻好湊籠蒸吃。」眾小妖答應一聲，把三人一齊綑了，擡在後邊。將白馬拴在槽頭，行李挑在屋裡。眾妖都磨兵器，準備擒拿行者不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    妖怪は斉天大聖孫悟空と聞き、かなり恐ろしくなった。口には出さず、心の中で考えた。
    妖怪「あいつの神通力が絶大だということは、かねてから聞いている。思いがけず、ここで出会うことになったか。」
    そして命じた。
    妖怪「お前たち、唐僧を縛れ。あとの二人からは宝を外し、縄二本に替えて縛り直せ。ひとまず奥へ運んでおけ。わしが一番弟子を捕らえたら、まとめて洗い清め、蒸籠へ一緒に入れて蒸して食うのだ。」
    小妖たちは返事をし、三人をみな縛って奥へ担いでいった。白馬は飼葉桶のそばへつなぎ、荷物は部屋へ運び込んだ。妖怪たちは武器を磨き、悟空を捕らえる準備にかかった。こちらの話はひとまず置こう。
  "translation_status": "reviewed"
- "id": "xy-ch50-023"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫行者自南莊人家攝了一缽盂齋飯，駕雲回返舊路，徑至山坡平處，按下雲頭，早已不見唐僧，不知何往，棍劃的圈子還在，只是人馬都不見了。回看那樓臺處所，亦俱無矣，惟見山根怪石。行者心驚道：「不消說了，他們定是遭那毒手也。」急依路看著馬蹄，向西而趕。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    さて、悟空は南の村の家から鉢一杯の飯を持ち去り、雲に乗って元の道へ帰ってきた。山の斜面の平らな所へ雲を下ろしたが、三蔵はもうおらず、どこへ行ったのか分からない。棒で描いた輪だけは残っているのに、人も馬も見えなかった。楼台のあった所を振り返ると、それもすっかり消え、山のふもとに奇岩が見えるだけだった。悟空は胸騒ぎを覚えた。
    悟空「言うまでもない。あいつら、きっとひどい目に遭ったんだ。」
    急いで道の馬の蹄の跡を追い、西へ向かった。
  "translation_status": "reviewed"
- "id": "xy-ch50-024"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行有五六里，正在悽愴之際，只聞得北坡外有人言語。看時，乃一個老翁，氈衣蓋體，暖帽蒙頭，足下踏一雙半新半舊的油靴，手持著一根龍頭拐棒，後邊跟一個年幼的僮僕，折一枝臘梅花，自坡前念歌而走。行者放下缽盂，覿面道個問訊，叫：「老公公，貧僧問訊了。」那老翁即便回禮道：「長老那裡來的？」行者道：「我們東土來的，往西天拜佛求經，一行師徒四眾。我因師父飢了，特去化齋，教他三眾坐在那山坡平處相候。及回來不見，不知往那條路上去了。動問公公，可曾看見？」老者聞言，呵呵冷笑道：「你那三眾，可有一個長嘴大耳的麼？」行者道：「有有有。」「又有一個晦氣色臉的，牽著一匹白馬，領著一個白臉的胖和尚麼？」行者道：「是是是。」老翁道：「你們走錯路了，你休尋他，各人顧命去也。」行者道：「那白臉者是我師父，那怪樣者是我師弟。我與他共發虔心，要往西天取經，如何不尋他去？」老翁道：「我才然從此過時，看見他們錯走了路徑，闖入妖魔口裡去了。」行者道：「煩公公指教指教，是個甚麼妖魔？居於何方我好上門取索他等，往西天去也。」老翁道：「這座山叫做金兜本作「⿰山兜」，Unicode缺字山。山前有個金兜本作「⿰山兜」，Unicode缺字洞，那洞中有個獨角兕大王。那大王神通廣大，威武高強。那三眾此回斷沒命了，你若去尋他，只怕連你也難保，不如不去之為愈也。我也不敢阻你，也不敢留你，只憑你心中度量。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    五、六里進み、悲しみに沈んでいると、北の斜面の向こうから人の声が聞こえた。見ると、一人の老人がいた。フェルトの衣で体を覆い、暖かな帽子を頭にかぶり、足には半ば履き古した油引きの長靴、手には竜頭の杖を持っている。後ろには幼い童僕が一人、折り取った蝋梅の枝を持って従い、斜面の前を歌いながら歩いてきた。悟空は鉢を置き、向き合って僧の礼をした。
    悟空「ご老人、ご挨拶申し上げます。」
    老人もすぐに礼を返した。
    老人「お坊さまは、どこから来なさった。」
    悟空「私たちは東土から、西天へ仏を拝み、経を求めに参ります。師弟四人の一行ですが、師が空腹になったので、私が食事をもらいに行き、三人にはあの斜面の平らな所で座って待つよう頼んでおきました。ところが戻ってみると姿がなく、どの道へ行ったのか分かりません。ご老人、ご覧になりませんでしたか。」
    老人は、ふふんと冷たく笑った。
    老人「その三人の中に、長い口で大きな耳の者がいたかね。」
    悟空「いました、いました。」
    老人「もう一人は、縁起の悪そうな顔色で、白馬を引き、色白で太った和尚を連れていたのではないか。」
    悟空「そのとおり、そのとおりです。」
    老人「お前さんたちは道を間違えた。もう探すのはやめ、それぞれ自分の命を守りなさい。」
    悟空「色白の方は私の師で、変わった姿の者たちは弟弟子です。ともに真心を起こし、西天へ経を求めに行くのですから、どうして探さずにいられましょう。」
    老人「わしが今しがたここを通ったとき、あの者たちは道を誤り、妖魔の口へ飛び込んでしまったよ。」
    悟空「ご老人、どうか教えてください。どんな妖魔で、どこにいるのです。私が出向いて三人を返させ、西天へ行きますから。」
    老人「この山は金兜山（きんとうざん）という。山の前に金兜洞（きんとうどう）があり、その洞には独角兕大王（どっかくじだいおう）がいる。神通力が絶大で、武勇も並外れて強い大王だ。あの三人は、今度こそ命はあるまい。探しに行けば、お前さんも無事では済まなかろう。行かないほうがよい。わしは行くのを妨げもせぬし、引き止めもせぬ。あとは自分の胸で考えて決めなさい。」
  "translation_status": "reviewed"

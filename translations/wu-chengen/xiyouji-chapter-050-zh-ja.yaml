- "id": "xy-ch50-003"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    心地頻頻掃，塵情細細除。莫教坑塹陷毘盧。本體常清淨，方可論元初。
    性燭須挑剔，曹溪任吸呼。勿令猿馬氣聲粗。晝夜綿綿息，方顯是功夫。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 121
    "line_end": 122
  "translation_ja": |-
    心の庭をたびたび掃き清め、俗世の思いを細やかに取り除け。
    穴や堀に毘盧（びる）を落としてはならない。
    本来の姿をいつも清らかに保ってこそ、根源の始まりを語れるのだ。
    本性の灯は芯をかき立て、曹渓（そうけい）には吸う息、吐く息を自在に通せ。
    心の猿、意の馬に、荒い息や声を立てさせるな。
    昼も夜も息を綿々と続けてこそ、修行の功が現れる。
  "translation_status": "reviewed"
- "id": "xy-ch50-004"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一首詞，牌名《南柯子》，單道著唐僧脫卻通天河寒冰之災，踏白黿負登彼岸。師徒四眾，順著大路，望西而進。正遇嚴冬之景，但見那林光漠漠煙中淡，山骨稜稜水外清。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 123
    "line_end": 123
  "translation_ja": "この詞の曲調は「南柯子（なんかし）」という。さて、三蔵（さんぞう）は通天河（つうてんが）の氷の災難を逃れ、白黿（はくげん）の背に乗って向こう岸へ渡った。師弟四人は大路に沿って西へ進む。ちょうど厳冬のころで、林の色ははるかな霞の中に淡く、山の岩肌は水の向こうにくっきりと浮かんでいた。"
  "translation_status": "reviewed"
- "id": "xy-ch50-005"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們正當行處，忽然又遇一座大山，阻住去道。路窄崖高，石多嶺峻，人馬難進。三藏在馬上兜住韁繩，叫聲：「徒弟。」時有孫行者引豬八戒、沙僧近前侍立道：「師父，有何吩咐？」三藏道：「你看那前面山高，恐有虎狼作怪，妖獸傷人，今番是必仔細！」行者道：「師父放心莫慮。我等兄弟三人心和意合，歸正求真，使出蕩怪降妖之法，怕甚麼虎狼妖獸？」三藏聞言，只得放懷前進。到於谷口，促馬登崖，擡頭仔細觀看，好山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    師弟が進んでいると、また一つの大山が行く手をふさいだ。道は狭く、崖は高く、石が多く、峠は険しく、人も馬も進みかねる。三蔵は馬上で手綱を引き締めて呼んだ。
    三蔵「弟子たちよ。」
    悟空（ごくう）は八戒（はっかい）と沙悟浄（さごじょう）を連れ、そばへ進み出て控えた。
    悟空「お師匠さま、何のご用でしょうか。」
    三蔵「前の高い山を見なさい。虎や狼が暴れたり、妖獣が人を傷つけたりするかもしれない。今度こそ、十分に気をつけるのだ。」
    悟空「お師匠さま、どうかご安心ください。私たち兄弟三人は心を一つにし、正しい道へ帰って真理を求めています。妖怪を払い、魔物を降す術を使えば、虎や狼や妖獣など、何を恐れることがありましょう。」
    三蔵はそれを聞き、ひとまず心を落ち着けて進んだ。谷の入口まで来ると馬をせき立てて崖道を登り、顔を上げてよく眺めた。まことに見事な山である。
  "translation_status": "reviewed"
- "id": "xy-ch50-006"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": "嵯峨矗矗，變削巍巍。嵯峨矗矗沖霄漢，變削巍巍礙碧空。怪石亂堆如坐虎，蒼松斜掛似飛龍。嶺上鳥啼嬌韻美，崖前梅放異香濃。澗水潺湲流出冷，巔雲黯淡過來兇。又見那飄飄雪，凜凜風，咆哮餓虎吼山中。寒鴉揀樹無棲處，野鹿尋窩沒定蹤。可嘆行人難進步，皺眉愁臉把頭蒙。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    険しく高くそびえ立ち、削ぎ落としたような峰が堂々と連なる。
    険しく高い峰は天の川を突き、切り立つ山は青空をさえぎる。
    乱れ積む奇岩はうずくまる虎のよう、斜めに垂れる青松は飛ぶ竜のよう。
    尾根には鳥のさえずりが美しく響き、崖の前には梅が咲いて濃い芳香を放つ。
    谷川はさらさらと冷たく流れ、峰を過ぎる雲は暗く、不気味に迫る。
    さらに、ひらひら舞う雪、身を切る風。飢えた虎が山中でほえたける。
    寒鴉は木を選んでも休み場所がなく、野の鹿はねぐらを探して行方も定まらない。
    ああ、旅人は足を進めかね、眉を寄せ、顔を曇らせ、頭を覆うばかり。
  "translation_status": "reviewed"
- "id": "xy-ch50-007"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒四眾冒雪沖寒，戰澌澌行過那巔峰峻嶺，遠望見山凹中有樓臺高聳，房舍清幽。唐僧馬上欣然道：「徒弟啊，這一日又飢又寒，幸得那山凹裡有樓臺房舍，斷乎是莊戶人家，菴觀寺院；且去化些齋飯，吃了再走。」行者聞言，急睜睛看，只見那壁廂兇雲隱隱，惡氣紛紛。回首對唐僧道：「師父，那廂不是好處。」三藏道：「見有樓臺亭宇，如何不是好處？」行者笑道：「師父啊，你那裡知道。西方路上多有妖怪邪魔，善能點化莊宅。不拘甚麼樓臺房舍，館閣亭宇，俱能指化了哄人。你知道『龍生九種」，內有一種名蜃。蜃氣放光，就如樓閣淺池。若遇大江昏迷，蜃現此勢。倘有鳥鵲飛騰，定來歇翅。那怕你上萬論千，盡被他一氣吞之。此意害人最重。那壁廂氣色兇惡，斷不可入。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    師弟四人は雪と寒さを突いて震えながら、険しい峰々を越えた。遠くの山あいに高い楼台と、静かな屋敷が見える。三蔵は馬上で喜んだ。
    三蔵「弟子たちよ、今日は一日、腹も減り、寒くもある。幸い、あの山あいに楼台や家が見える。きっと農家の屋敷か、庵、道観、寺であろう。まず食事を恵んでもらい、食べてから行こう。」
    悟空は急いで目を見開いた。向こうには不吉な雲がほの見え、邪気が入り乱れている。振り返り、三蔵に告げた。
    悟空「お師匠さま、あちらはよい所ではありません。」
    三蔵「楼台や亭が見えるのに、なぜよい所ではないのだ。」
    悟空は笑った。
    悟空「お師匠さまには、お分かりにならないのです。西へ行く道には妖怪や邪魔が多く、屋敷を化けさせて現すのが得意です。楼台でも家でも、館でも亭でも、何でも指さすだけで作り、人を欺けます。『竜には九種の子がある』といいますが、そのうち一種を蜃（しん）と呼ぶのをご存じでしょう。蜃は気を吐いて光を放ち、楼閣や浅い池のような姿を現します。大河がかすんで見通せなくなると、蜃がその姿を現すのです。鳥やかささぎが飛んでくれば、きっと翼を休めに下りてくる。それが千羽でも万羽でも、一息に残らず呑み込んでしまいます。この仕掛けこそ、人をひどく害するものです。向こうの気配は凶悪です。決して入ってはなりません。」
  "translation_status": "reviewed"
- "id": "xy-ch50-008"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「既不可入，我卻著實飢了。」行者道：「師父果飢，且請下馬，就在這平處坐下，待我別處化些齋來你吃。」三藏依言下馬，八戒採定韁繩。沙僧放下行李，即去解開包裹，取出缽盂，遞與行者。行者接缽盂在手中，吩咐沙僧道：「賢弟，卻不可前進。好生保護師父穩坐於此，待我化齋回來，再往西去。」沙僧領諾。行者又向三藏道：「師父，這去處少吉多凶，切莫要動身別往。老孫化齋去也。」唐僧道：「不必多言，但要你快去快來。我在這裡等你。」行者轉身欲行，卻又回來道：「師父，我知你沒甚坐性，我與你個安身法兒。」即取金箍棒，幌了一幌，將那平地下週圍畫了一道圈子，請唐僧坐在中間；著八戒、沙僧侍立左右，把馬與行李都放在近身。對唐僧合掌道：「老孫畫的這圈，強似那銅牆鐵壁。憑他甚麼虎豹狼蟲，妖魔鬼怪，俱莫敢近。但只不許你們走出圈外，只在中間穩坐，保你無虞；但若出了圈兒，定遭毒手。千萬千萬，至祝至祝。」三藏依言，師徒俱端然坐下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    三蔵「入れぬといっても、私は本当に腹が減ったのだ。」
    悟空「それほどお腹が減ったのでしたら、馬を下りて、この平らな所へお座りください。私が別の所で食事を恵んでもらってきます。」
    三蔵は言われたとおりに馬を下り、八戒が手綱をしっかり持った。沙悟浄は荷物を下ろすと包みを解き、鉢を取り出して悟空へ渡した。悟空は鉢を受け取り、沙悟浄に言い聞かせた。
    悟空「弟よ、ここから先へ行ってはいけないぞ。お師匠さまをよく守り、ここで落ち着いてお待ちいただくんだ。俺が食事を持って帰ってから、また西へ進もう。」
    沙悟浄は承知した。悟空はさらに三蔵へ言った。
    悟空「お師匠さま、ここは吉が少なく、凶の多い所です。決して立ち上がって別の所へ行かないでください。では、食事をもらってきます。」
    三蔵「くどく言わなくてよい。早く行って、早く帰っておくれ。私はここで待っている。」
    悟空は出かけかけて、また戻った。
    悟空「お師匠さまがじっと座っていられないのは、分かっています。安全におられる方法を一つ授けましょう。」
    悟空は金箍棒（きんこぼう）を取り出してひと振りし、平らな地面の周りにぐるりと輪を描いた。三蔵をその中央に座らせ、八戒と沙悟浄を左右に控えさせ、馬も荷物もすぐそばへ置く。そして三蔵に合掌した。
    悟空「私の描いたこの輪は、銅の壁や鉄の城壁よりも堅固です。虎、豹、狼、獣、妖魔、鬼怪、どんなものも近寄れません。ただし、皆さんが輪の外へ出てはいけません。中でじっと座っていれば、無事は私が保証します。ところが、一歩でも外へ出れば、きっとひどい目に遭います。くれぐれも、くれぐれも。重ねてお願いしておきます。」
    三蔵は従い、師弟はみな、きちんと座り込んだ。
  "translation_status": "reviewed"
- "id": "xy-ch50-009"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者縱起雲頭，尋莊化齋，一直南行，忽見那古樹參天，乃一村莊舍。按下雲頭，仔細觀看，但只見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 131
    "line_end": 131
  "translation_ja": "悟空は雲に飛び乗り、托鉢する村を探してまっすぐ南へ向かった。やがて天を突く古木が見えた。その下に村の家がある。雲を下ろしてよく眺めると、こんな景色だった。"
  "translation_status": "reviewed"
- "id": "xy-ch50-010"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": "雪欺衰柳，冰結方塘。疏疏修竹搖青，鬱鬱喬松凝翠。幾間茅屋半裝銀，一座小橋斜砌粉。籬邊微吐水仙花，簷下長垂冰凍箸。颯颯寒風送異香，雪漫不見梅開處。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    雪は衰えた柳に重くのしかかり、氷は四角い池を閉ざす。
    まばらな長い竹は緑を揺らし、茂る高い松は翠を凝らす。
    数軒の茅屋は半ば銀をまとい、小さな橋には白粉が斜めに積もる。
    垣根のそばでは水仙がほのかに花を開き、軒下には氷の箸が長く垂れる。
    さっさっと吹く寒風はよい香りを運んでくるが、雪に埋もれて梅の咲く場所は見えない。
  "translation_status": "reviewed"
- "id": "xy-ch50-011"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者隨步觀看莊景，只聽得呀的一聲，柴扉響處，走出一個老者，手拖藜杖，頭頂羊裘，身穿破衲，足踏蒲鞋，拄著杖，仰身朝天道：「西北風起，明日晴了。」說不了，後邊跑出一個哈巴狗兒來，望著行者，汪汪的亂吠。老者卻才轉過頭來，看見行者捧著缽盂。打個問訊道：「老施主，我和尚是東土大唐欽差上西天拜佛求經者，適路過寶方，我師父腹中飢餒，特造尊府募化一齋。」老者聞言，點頭頓杖道：「長老，你且休化齋，你走錯路了。」行者道：「不錯。」老者道：「往西天大路，在那直北下。此間到那裡有千里之遙，還不去找大路而行？」行者笑道：「正是直北下。我師父現在大路上端坐，等我化齋哩。」那老者道：「這和尚胡說了。你師父在大路上等你化齋，似這千里之遙，就會走路，也須得六七日，走回去又要六七日，卻不餓壞他也？」行者笑道：「不瞞老施主說，我才然離了師父，還不上一盞熱茶之時，卻就走到此處。如今化了齋，還要尚趕去作午齋哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    悟空は歩きながら村の景色を眺めた。すると、ぎいっと柴の戸が鳴り、老人が一人出てきた。手にはあかざの杖を引きずり、頭には羊の毛皮をかぶり、身には破れ衣、足には蒲の靴。杖をついて体を反らし、空を仰いだ。
    老人「北西の風が出た。明日は晴れだ。」
    言い終わらぬうちに、後ろから小さな愛玩犬が走り出し、悟空を見て、わんわんとほえ立てた。老人はそこで初めて振り返り、鉢を持った悟空を見た。悟空は僧の礼をして挨拶した。
    悟空「ご老人、私は東土（とうど）の大唐（だいとう）から勅命を受け、西天（さいてん）へ仏を拝み、経を求めに参る僧です。たまたまこちらを通りかかりましたが、師が空腹で困っております。それでお宅へ伺い、一食のお布施をお願いに上がりました。」
    老人はうなずき、杖で地を突いた。
    老人「お坊さま、食事を乞うのは待ちなさい。道を間違えている。」
    悟空「間違ってはいません。」
    老人「西天へ行く大路は、真北だ。ここからは千里（り）も離れている。大路を探して行かなくてよいのかね。」
    悟空は笑った。
    悟空「まさに真北です。師は今、大路にきちんと座り、私が食事を恵んでもらうのを待っています。」
    老人「この和尚はでたらめを言う。師が大路で食事を待っているというが、千里も離れているのだぞ。いくら足が達者でも六、七日はかかる。帰るのにまた六、七日。師を飢えさせてしまうではないか。」
    悟空は笑った。
    悟空「ご老人、本当のことを申しますと、つい今しがた師のもとを離れ、熱いお茶を一杯飲むほどもたたぬうちに、ここへ来たのです。今、食事を頂けば、まだ昼食に間に合うよう帰れますよ。」
  "translation_status": "reviewed"
- "id": "xy-ch50-012"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老者見說，心中害怕道：「這和尚是鬼，是鬼。」急抽身往裡就走。行者一把扯住道：「施主那裡去？有齋快化些兒。」老者道：「不方便，不方便，別轉一家兒罷。」行者道：「你這施主好不會事。你說我離此有千里之遙，若再轉一家，卻不又有千里？真是餓殺我師父也。」那老者道：「實不瞞你說，我家老小六七口，才淘了三升米下鍋，還未曾煮熟。你且到別處去轉轉再來。」行者道：「古人云：『走三家不如坐一家。』我貧僧在此等一等罷。」那老者見纏得緊，惱了，舉藜杖就打。行者公然不懼，被他照光頭上打了七八下，只當與他拂癢。那老者道：「這是個撞頭的和尚。」行者笑道：「老官兒，憑你怎麼打，只要記得杖數明白：一杖一升米，慢慢量來。」那老者聞言，急丟了藜杖，跑進去把門關了，只嚷：「有鬼，有鬼。」慌得那一家兒戰戰兢兢，把前後門俱關了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    老人はそれを聞いて恐ろしくなった。
    老人「この和尚は化け物だ、化け物だ。」
    慌てて身を引き、家へ入ろうとしたが、悟空がつかまえた。
    悟空「ご主人、どちらへ行かれるのです。食事があれば、早く少しお恵みください。」
    老人「都合が悪い、都合が悪い。ほかの家へ行ってくれ。」
    悟空「ご主人、何とも物分かりが悪いですね。私の来た道が千里もあると言ったのはあなたでしょう。もう一軒回れば、また千里も行くことになりませんか。それこそ師を飢え死にさせてしまう。」
    老人「正直に言うが、うちは老いも若きも六、七人。今ようやく米を三升（しょう）といで鍋にかけたばかりで、まだ炊けていないのだ。よそを一回りしてから戻ってきなさい。」
    悟空「昔の人は『三軒を歩くより、一軒で座って待つほうがよい』と言いました。私はここで、少し待たせてもらいましょう。」
    老人はあまりにしつこいので腹を立て、あかざの杖を振り上げて打った。悟空は平然として、少しも恐れない。つるつるの頭を七、八度たたかれたが、かゆい所をなでてもらうほどにしか思わなかった。
    老人「こいつは頭をぶつけてせびる和尚だ。」
    悟空は笑った。
    悟空「ご老人、好きなだけお打ちなさい。ただし、何度打ったかは、はっきり覚えておいてください。一打につき米一升です。ゆっくり量ってもらいますよ。」
    老人は慌てて杖を投げ出し、家の中へ駆け込んで戸を閉めた。
    老人「化け物だ、化け物がいる！」
    家中の者はおびえて震え、前も後ろも戸を閉ざした。
  "translation_status": "reviewed"
- "id": "xy-ch50-013"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見他關了門，心中暗想：「這老賊才說淘米下鍋，不知是虛是實？常言道：『道化賢良釋化愚。』且等老孫進去看看。」好大聖，捻著訣，使個隱身遁法，徑走入廚中看處，果然那鍋裡氣騰騰的，煮了半鍋乾飯。就把缽盂往裡一掗，滿滿的掗了一缽盂，即駕雲回轉不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    戸を閉められた悟空は、心の中で考えた。
    悟空「この食えないじじい、さっきは米をといで鍋にかけたと言ったが、本当か嘘か。世間では『道教は賢く善い者を教え、仏教は愚かな者を教える』という。俺が中へ入って見てやろう。」
    さすがは悟空、指で印を結び、姿を隠す術を使って、まっすぐ台所へ入った。見ると、なるほど鍋から湯気が盛んに立ち、半鍋の飯が炊けている。鉢をそこへ突っ込んで、いっぱいにすくい取り、そのまま雲に乗って引き返した。こちらの話はひとまず置こう。
  "translation_status": "reviewed"
- "id": "xy-ch50-014"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說唐僧坐在圈子裡，等待多時，不見行者回來，欠身悵望道：「這猴子往那裡化齋去了？」八戒在傍笑道：「知他往那裡耍子去來?化甚麼齋，卻教我們在此坐牢。」三藏道：「怎麼謂之坐牢？」八戒道：「師父，你原來不知，古人劃地為牢?他將棍子劃個圈兒，強似鐵壁銅牆，假如有虎狼妖獸來時，如何擋得他住？只好白白的送與他吃罷了。」三藏道：「悟能，憑你怎麼處治？」八戒道：「此間又不藏風，又不避冷，若依老豬，只該順著路，往西且行。師兄化了齋，駕了雲，必然來快，讓他趕來。如有齋，吃了再走。如今坐了這一會，老大腳冷！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    さて、輪の中の三蔵は、長く待っても悟空が戻らないので、腰を浮かせ、気をもみながら見渡した。
    三蔵「あの猿は、どこへ食事をもらいに行ったのだ。」
    そばで八戒が笑った。
    八戒「どこで遊んでいるやら、分かったもんじゃありませんよ。何が托鉢ですか。俺たちをここで牢に入れただけだ。」
    三蔵「どうして牢に入れたことになるのだ。」
    八戒「お師匠さまはご存じない。昔は地面に線を引いて牢にしたんです。あいつも棒で輪を描いて、鉄壁や銅壁より強いなんて言った。虎や狼や妖獣が来たら、こんなものでどうやって防ぐんです。ただ、ただで食われるしかありませんよ。」
    三蔵「悟能（ごのう）、それなら、どうすればよいと思う。」
    八戒「ここは風も防げず、寒さもしのげません。俺の言うとおりにするなら、道なりに西へ歩いていくのがいい。兄貴は食事を手に入れたら雲に乗るんだから、きっと早い。追いつかせればいいんです。飯があれば食べて、また歩けばよい。こうしてしばらく座っていたら、足がひどく冷えてしまった！」
  "translation_status": "reviewed"
- "id": "xy-ch50-015"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏聞此言，就是晦氣星到了。遂依獃子，一齊出了圈外。八戒牽了馬，沙僧擔了擔，那長老順路步行前進。不一時，到了樓閣之所，卻原來是坐北向南之家。門外八字粉牆，有一座倒垂蓮升斗門樓，都是五色裝的。那門兒半開半掩。八戒就把馬拴在門枕石鼓上；沙僧歇了擔子；三藏畏風，坐於門限之上。八戒道：「師父，這所在想是公侯之宅，相輔之家。前門外無人，想必都在裡面烘火。你們坐著，讓我進去看看。」唐僧道：「仔細耶，莫要衝撞了人家。」獃子道：「我曉得。自從歸正禪門，這一向也學了些禮數，不比那村莽之夫也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    三蔵がこの言葉を聞き入れたのは、まさしく不運の星が巡ってきたということだった。八戒の言うままに、一同は輪の外へ出た。八戒が馬を引き、沙悟浄が荷を担ぎ、三蔵は道に沿って歩いた。ほどなく楼閣のある所へ着くと、南向きの屋敷だった。門の外には八の字形に開く白壁があり、逆さの蓮の飾りを垂らし、升斗形の組物を備えた楼門が、五色に彩られている。門扉は半ば開いていた。八戒は門柱の足もとの太鼓形の石に馬をつなぎ、沙悟浄は荷を下ろした。三蔵は風を恐れ、敷居の上へ腰を掛けた。
    八戒「お師匠さま、ここは公爵や侯爵のお屋敷か、宰相の家でしょう。表門の外に誰もいないのは、みんな中で火にあたっているからに違いありません。ここに座っていてください。俺が入って見てきます。」
    三蔵「気をつけるのだよ。家の方に失礼をしてはいけない。」
    八戒「分かっています。仏門の正しい道に帰ってから、このところ俺も礼儀を少しは覚えました。田舎の無作法者とは違いますよ。」
  "translation_status": "reviewed"
- "id": "xy-ch50-016"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子把釘鈀撒在腰裡，整一整青錦直裰，斯斯文文，走入門裡。只見是三間大廳，簾櫳高控，靜悄悄全無人跡，也無桌椅家火。轉過屏門，往裡又走，乃是一座穿堂。堂後有一座大樓，樓上窗格半開，隱隱見一頂黃綾帳幔。獃子道：「想是有人怕冷，還睡哩。」他也不分內外，拽步只管走上樓來。用手掀開看時，把獃子諕了一個躘踵。原來那帳裡象牙床上，白媸媸的一堆骸骨，骷髏有巴斗大，腿挺骨有四五尺長。那獃子定了性，止不住腮邊淚落，對骷髏點頭嘆云：「你不知是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    八戒は熊手を腰へ挟み、青い錦の直裰（ちょくたつ）を整え、しとやかな様子で門を入った。目の前は三間の大広間で、簾は高く巻き上げられている。しんと静まり、人影はまるでなく、卓も椅子も、ほかの道具もない。仕切りの戸を回ってさらに奥へ入ると、通り抜けの広間があった。その後ろには大きな楼が建ち、上階の格子窓が半ば開いて、黄色い綾絹の帳がかすかに見える。
    八戒「寒がりの誰かが、まだ寝ているんだろう。」
    内と外の区別も構わず、足を引きずるように進み、そのまま楼へ上がった。手で帳を持ち上げて見るなり、八戒は驚いてよろめいた。帳の中の象牙の寝台に、白々とした骸骨が一山積まれていたのだ。頭蓋骨は巴斗（はと）ほどもあり、脚の長い骨は四、五尺（しゃく）もあった。八戒は気を取り直したが、頬を流れる涙を止められず、頭蓋骨へうなずき、嘆いた。
    八戒「お前は、いったいどんな人だったのだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch50-017"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    那代那朝元帥體，何邦何國大將軍。
    當時豪傑爭強勝，今日淒涼露骨筋。
    不見妻兒來侍奉，那逢士卒把香焚。
    謾觀這等真堪嘆，可惜興王霸業人。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 143
    "line_end": 146
  "translation_ja": |-
    八戒「いずれの代、いずれの王朝の元帥の体か、どこの国の大将軍か。
    その昔は豪傑として強さを競い、今は哀れにも骨と筋をさらしている。
    妻子が来て世話をする姿はなく、兵が香をたくことさえない。
    こうして眺めるだけでも、まことに嘆かわしい。王業、覇業を興した人だったろうに。」
  "translation_status": "reviewed"
- "id": "xy-ch50-018"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒正才感嘆，只見那帳幔後有火光一幌。獃子道：「想是有侍奉香火之人在後面哩。」急轉步，過帳觀看，卻是穿樓的窗扇透光。那壁廂有一張彩漆的桌子，桌子上亂搭著幾件錦繡綿衣。獃子提起來看時，卻是三件納錦背心兒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    八戒が嘆いていると、帳の後ろで火の光がちらりとした。
    八戒「後ろに、香火を供えて世話をする人がいるのだろう。」
    急いで帳の向こうへ回って見たが、楼を貫く窓の戸から光が差しているだけだった。そこには彩色した漆塗りの卓があり、上には錦や刺繍の綿入れが何枚か乱雑に掛けてあった。八戒が取り上げて見ると、三着の納錦（のうきん）の胴着だった。
  "translation_status": "reviewed"
- "id": "xy-ch50-019"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他也不管好歹，拿下樓來，出廳房，徑到門外道：「師父，這裡全沒人煙，是一所亡靈之宅。老豬走進裡面，直至高樓之上，黃綾帳內，有一堆骸骨。串樓傍有三件納錦的背心，被我拿來了，也是我們一程兒造化。此時天氣寒冷，正當用處。師父，且脫了褊衫，把他且穿在底下，受用受用，免得吃冷。」三藏道：「不可，不可。律云：『公取竊取皆為盜。』倘或有人知覺，趕上我們，到了當官，斷然是一個竊盜之罪。還不送進去與他搭在原處。我們在此避風坐一坐，等悟空來時走路。出家人不要這等愛小。」八戒道：「四顧無人，雖雞犬亦不知之，但只我們知道，誰人告我？有何證見？就如拾得的一般，那裡論甚麼公取竊取也？」三藏道：「你胡做啊。雖是人不知之，天何蓋焉？玄帝垂訓云：『暗室虧心，神目如電。』趁早送去還他，莫愛非禮之物。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    八戒は良いも悪いも考えず、それを持って楼を下り、広間を抜け、まっすぐ門の外へ出てきた。
    八戒「お師匠さま、中には誰もいません。死者の屋敷です。俺が奥へ入り、高い楼にまで上がってみたら、黄色い綾絹の帳の中に骸骨が積まれていました。楼の通り抜けの所に、納錦の胴着が三着あったので、持ってきたんです。旅の途中の、ちょっとした幸運ですよ。今は寒いから、ちょうど役に立つ。お師匠さま、その偏衫（へんさん）を脱いで、これを下に着てみてください。暖かくして、寒い思いをせずに済みます。」
    三蔵「いけない、いけない。律には『公然と取るのも、ひそかに取るのも、みな盗みである』とある。誰かに気づかれ、追いつかれて役所へ連れていかれたら、間違いなく盗みの罪になる。早く中へ持っていき、元の場所へ掛けておきなさい。私たちはここで風を避け、少し座って、悟空が来たら出発しよう。出家した者が、そんな小さな得を欲しがってはならない。」
    八戒「四方を見ても誰もいません。鶏や犬さえ知らない。知っているのは俺たちだけで、誰が訴えるんです。何の証人がいるんです。拾ったのと同じようなものなのに、公然だの、ひそかだのと言うことがありますか。」
    三蔵「むちゃなことをするものではない。人が知らなくても、どうして天から隠せよう。玄帝（げんてい）の教えには『暗い部屋で良心に背いても、神の目は稲妻のように見通す』とある。早く返しに行きなさい。道に外れた品を欲しがってはならない。」
  "translation_status": "reviewed"
- "id": "xy-ch50-020"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子莫想肯聽，對唐僧笑道：「師父啊，我自為人，也穿了幾件背心，不曾見這等納錦的。你不穿，且待老豬穿一穿，試試新，晤晤脊背。等師兄來，脫了還他走路。」沙僧道：「既如此說，我也穿一件兒。」兩個齊脫了上蓋直裰，將背心套上。才緊帶子，不知怎麼立站不穩，撲的一跌。原來這背心兒賽過綁縛手，霎時間，把他兩個背剪手貼心綑了。慌得個三藏跌足報怨，急忙來解，那裡便解得開。三個人在那裡吆喝之聲不絕，卻早驚動了魔頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    八戒は、どうあっても聞こうとせず、三蔵に笑いかけた。
    八戒「お師匠さま、俺も生まれてから胴着は何着か着ましたが、こんな納錦のものは見たことがありません。お着にならないなら、俺がちょっと着て、新しいのを試し、背中を暖めますよ。兄貴が来たら脱いで返し、出発すればいい。」
    沙悟浄「そういうことなら、私も一着着ましょう。」
    二人はそろって上に着た直裰を脱ぎ、胴着をかぶった。帯を締めるや、どうしたことか立っていられなくなり、ばたりと倒れた。この胴着は、縄で縛る手よりも巧みだった。たちまち二人の腕を後ろへねじり、胸までぴったりと縛りつけてしまったのだ。三蔵は慌てて地団駄を踏み、二人を責めながら急いでほどこうとしたが、どうして解けるものか。三人の叫び声は絶えず、とうとう魔物を驚かせた。
  "translation_status": "reviewed"
- "id": "xy-ch50-021"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那座樓房果是妖精點化的，終日在此拿人。他在洞裡正坐，忽聞得怨恨之聲，急出門來看，果見綑住幾個人了。妖魔即喚小妖，同到那廂，收了樓臺房屋之形。把唐僧攙住，牽了白馬，挑了行李，將八戒、沙僧一齊捉到洞裡。老妖魔登臺高坐，眾小妖把唐僧推近臺邊，跪伏於地。妖魔問道：「你是那方和尚？怎麼這般膽大，白日裡偷盜我的衣服？」三藏滴淚告曰：「貧僧是東土大唐欽差往西天取經的。因腹中飢餒，著大徒弟去化齋未回，不曾依得他的言語，誤撞仙庭避風。不期我這兩個徒弟愛小，拿出這衣物來。貧僧決不敢壞心，當教送還本處。他不聽吾言，要穿此晤晤脊背，不料中了大王機會，把貧僧拿來。萬望慈憫，留我殘生，求取真經，永註大王恩情，回東土千古傳揚也。」那妖魔笑道：「我這裡常聽得人言：有人吃了唐僧一塊肉，髮白還黑，齒落更生。幸今日不請自來，還指望饒你哩。你那大徒弟叫做甚麼名字？往何方化齋？」八戒聞言，即開口稱揚道：「我師兄乃五百年前大鬧天宮齊天大聖孫悟空也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    やはり、あの楼は妖怪が術で作り出したもので、日ごろから、そこで人を捕まえていたのである。妖怪は洞の中に座っていたが、恨み嘆く声を聞くと急いで外へ出た。なるほど、何人かが捕らわれている。妖怪は小妖を呼び、一緒にそこへ行って、楼台や家の幻を消した。三蔵を押さえ、白馬を引き、荷物を担ぎ、八戒と沙悟浄もろとも洞へ捕らえていった。妖怪が壇の上の高座に着くと、小妖たちは三蔵を壇のそばへ押し出し、地面にひざまずかせた。
    妖怪「お前はどこの和尚だ。白昼にわしの衣を盗むとは、何という度胸だ。」
    三蔵は涙を流して訴えた。
    三蔵「私は東土の大唐から勅命を受け、西天へ経を求めに参る僧です。腹が減ったので一番弟子を托鉢に出しましたが、まだ帰っておりません。その弟子の言葉に従わず、誤って仙人のお屋敷へ入り、風を避けてしまいました。思いがけず、この二人の弟子が小欲を起こし、衣を持ち出したのです。私は決して悪心を抱いておらず、元の場所へ返すよう言いました。ところが二人は私の言葉を聞かず、着て背中を暖めようとしたため、図らずも大王の仕掛けにかかり、私まで捕らわれたのでございます。どうかお慈悲をもって、この命をお残しください。真の経を求めることができましたら、大王のご恩を永く心に刻み、東土へ帰って千代までも語り伝えます。」
    妖怪は笑った。
    妖怪「ここではよく聞くぞ。唐僧（とうそう）の肉をひとかけ食えば、白髪は黒く戻り、抜けた歯もまた生えるという。幸い、今日は招きもせぬのに来てくれた。それでも許してもらえると思うのか。お前の一番弟子は何という名だ。どこへ食事をもらいに行った。」
    八戒はそれを聞くと、すぐに口を開いて自慢した。
    八戒「俺の兄貴こそ、五百年前に天宮で大暴れした、斉天大聖（せいてんたいせい）孫悟空（そんごくう）だ！」
  "translation_status": "reviewed"

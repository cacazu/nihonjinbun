- "id": "xy-ch50-025"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者再拜稱謝道：「多蒙公公指教。我豈有不尋之理？」把這齋飯倒與他，將這空缽盂自家收拾。那老翁放下拐棒，接了缽盂，遞與僮僕，現出本相，雙雙跪下磕頭，叫：「大聖，小神不敢隱瞞。我們兩個就是此山山神、土地，在此候接大聖。這齋飯連缽盂，小神收下，讓大聖身輕好施法力。待救唐僧出難，將此齋飯還奉唐僧，方顯得大聖至恭至孝。」行者喝道：「你這毛鬼討打。既知我到，何不早迎，卻又這般藏頭露尾，是甚道理？」土地道：「大聖性急，小神不敢造次，恐犯威顏，故此隱像告知。」行者息怒道：「你且記打。好生與我收著缽盂，待我拿那妖精去來。」土地、山神遵領。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    悟空は重ねて拝礼し、礼を述べた。
    悟空「ご老人、よく教えてくださいました。ですが、私はどうしても探さねばなりません。」
    飯を老人にあけ渡し、空の鉢は自分でしまった。老人は杖を置き、鉢を受け取って童僕へ渡すと、二人は本来の姿を現した。そろってひざまずき、額を地につけて告げた。
    二人「大聖（たいせい）さま、もうお隠しはいたしません。私ども二人は、この山の山神（さんじん）と土地神（とちがみ）でございます。ここで大聖さまをお待ちしておりました。食事は鉢ごとお預かりし、大聖さまには身軽になって術をお使いいただきましょう。唐僧を災難からお救いになったら、この食事を唐僧にお渡しします。それでこそ、大聖さまの師への深い敬愛がよく表れます。」
    悟空はどなった。
    悟空「この小鬼ども、打たれたいのか。俺が来ると知っていたなら、なぜさっさと迎えに来なかった。こんなふうに正体を隠して、どういうつもりだ。」
    土地神「大聖さまは気がお早く、私どもはうかつに近づけません。お怒りに触れてはならぬと思い、姿を隠してお知らせしたのでございます。」
    悟空は怒りを収めた。
    悟空「殴る分は、ひとまず貸しにしておく。鉢を大事に預かっていろ。俺があの妖怪を捕らえてくる。」
    土地神と山神は承知した。
  "translation_status": "reviewed"
- "id": "xy-ch50-026"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖卻才束一束虎筋絛，拽起虎皮裙，執著金箍棒，徑奔山前，找尋妖洞。轉過山崖，只見那亂石磷磷，翠崖邊有兩扇石門，門外有許多小妖，在那裡掄槍舞劍。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 158
    "line_end": 158
  "translation_ja": "悟空は虎筋（こきん）の帯を締め直し、虎皮の腰巻きを引き上げ、金箍棒を手に、まっすぐ山の前へ妖怪の洞を探しに向かった。崖を回ると、乱れ重なる石のそば、緑の崖に二枚の石の扉があった。門外では大勢の小妖が槍を振り、剣を舞わせている。まさに、こんな所だった。"
  "translation_status": "reviewed"
- "id": "xy-ch50-027"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": "煙雲凝瑞，苔蘚堆青。崚嶒怪石列，崎嶇曲道縈。猿嘯鳥啼風景麗，鸞飛鳳舞若蓬瀛。向陽幾樹梅初放，弄暖千竿竹自青。陡崖之下，深澗之中，陡崖之下雪堆粉，深澗之中水結冰。兩林松柏千年秀，幾簇山茶一樣紅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    煙と雲はめでたい気を凝らし、苔は青く幾重にも重なる。
    ごつごつした奇岩が並び、険しい曲がり道がうねる。
    猿の声、鳥のさえずりに景色は美しく、鸞（らん）が飛び鳳凰（ほうおう）が舞うさまは蓬瀛（ほうえい）のよう。
    日の当たる数本の梅は咲き始め、暖かさに遊ぶ千本の竹は青々としている。
    切り立つ崖の下、深い谷の中。
    切り立つ崖の下には白粉のような雪が積もり、深い谷の中では水が凍る。
    二つの林の松柏は千年の美しさを保ち、いく群れかの椿は同じように赤い。
  "translation_status": "reviewed"
- "id": "xy-ch50-028"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖觀看不盡，拽開步徑至門前，厲聲高叫道：「那小妖，你快進去與你那洞主說，我本是唐朝聖僧徒弟齊天大聖孫悟空。快教他送我師父出來，免教你等喪了性命。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    悟空は景色を眺め尽くす間もなく、大股でまっすぐ門前へ行き、鋭い声で叫んだ。
    悟空「そこの小妖、すぐ中へ入り、洞の主人に伝えろ。俺は唐朝（とうちょう）の聖僧の弟子、斉天大聖孫悟空だ。早く師を外へ送り出せ。そうすれば、お前たちの命は取らずにおいてやる！」
  "translation_status": "reviewed"
- "id": "xy-ch50-029"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那夥小妖急入洞裡報道：「大王，前面有一個毛臉勾嘴的和尚，稱是齊天大聖孫悟空，來要他師父哩。」那魔王聞得此言，滿心歡喜道：「正要他來哩。我自離了本宮，下降塵世，更不曾試試武藝。今日他來，必是個對手。」即命小妖們取出兵器。那洞中大小群妖，一個個精神抖擻，即忙擡出一根丈二長的點鋼槍，遞與老怪。老怪傳令，教：「小的們，各要整齊。進前者賞，退後者誅！」眾妖得令，隨著老怪，走出門來，叫道：「那個是孫悟空？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    小妖たちは急いで洞へ入り、報告した。
    小妖たち「大王、前に毛むくじゃらの顔で、口の曲がった和尚がおります。斉天大聖孫悟空と名乗り、師を返せと申しています。」
    独角兕大王はこれを聞き、心から喜んだ。
    独角兕大王「ちょうど来てほしかったところだ。わしはもとの宮を離れ、人の世へ下ってから、まだ武芸を試していない。今日やって来たあいつなら、きっと相手に不足はあるまい。」
    すぐ小妖たちに武器を持ってくるよう命じた。洞中の大小の妖怪はみな気を奮い立たせ、急いで丈（じょう）二の長さの点鋼槍（てんこうそう）を担ぎ出し、大王へ渡した。独角兕大王は号令をかけた。
    独角兕大王「お前たち、整列せよ。進む者には褒美、退く者には死を与える！」
    妖怪たちは命を受け、大王に従って門を出て呼ばわった。
    妖怪たち「どいつが孫悟空だ！」
  "translation_status": "reviewed"
- "id": "xy-ch50-030"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者在傍閃過，見那魔王生得好不兇醜："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 165
    "line_end": 165
  "translation_ja": "悟空は脇からさっと出て、その大王の姿を見た。何とも凶悪で醜い顔つきである。"
  "translation_status": "reviewed"
- "id": "xy-ch50-031"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": "獨角參差，雙眸晃亮。頂上粗皮突，耳根黑肉光。舌長時攪鼻，口闊版牙黃。毛皮青似靛，筋攣硬如鋼。比犀難照水，像牯不耕荒。全無喘月犁雲用，倒有欺天振地強。兩隻焦筋藍靛手，雄威直挺點鋼槍。細看這等兇模樣，不枉名稱兕大王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    一本の角はごつごつと伸び、両の目はぎらぎら光る。
    頭頂には厚い皮が盛り上がり、耳の根元の黒い肉は艶を放つ。
    長い舌はいつも鼻をなめ回し、広い口には板のような黄色い歯が並ぶ。
    毛皮は藍のように青く、よじれた筋は鋼のように硬い。
    犀に似ていても水を照らすことはできず、牡牛に似ていても荒れ地を耕さない。
    月を見てあえぐことも、雲の下を耕す働きもまるでなく、天を侮り、地を震わせる力だけは備わる。
    青藍色の筋張った両手で、威風堂々と点鋼槍をまっすぐ構える。
    この恐ろしい姿をつくづく見れば、兕大王（じだいおう）の名にも、なるほどとうなずける。
  "translation_status": "reviewed"
- "id": "xy-ch50-032"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖上前道：「你孫外公在這裡也。快早還我師父，兩無毀傷；若道半個『不』字，我教你死無葬身之地！」那魔喝道：「我把你這個大膽潑猴精！你有些甚麼手段，敢出這般大言？」行者道：「你這潑物！是也不曾見我老孫的手段。」那妖魔道：「你師父偷盜我的衣服，實是我拿住了，如今待要蒸吃。你是個甚麼好漢，就敢上我的門來取討？」行者道：「我師父乃忠良正直之僧，豈有偷你甚麼妖物之理？」妖魔道：「我在山路邊點化一座仙莊，你師父潛入裡面，心愛情慾，將我三領納錦綿裝背心兒偷穿在身，見有贓證，故此我才拿他。你今果有手段，即與我比勢：假若三合敵得我，饒了你師之命；如敵不過我，教你一路歸陰。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    悟空は前へ出た。
    悟空「お前の母方のじいさま、この孫さまなら、ここにいるぞ。さっさと師を返せば、お互い傷つかずに済む。少しでも嫌だと言おうものなら、死んでも葬る場所がない目に遭わせてやる！」
    独角兕大王はどなった。
    独角兕大王「この不届きな猿の化け物め！　どれほどの腕があって、そんな大口をたたく。」
    悟空「この化け物め、お前はまだ、この俺の腕を見たことがないのだな。」
    独角兕大王「お前の師は、わしの衣を盗んだ。確かに捕まえてある。今から蒸して食うところだ。お前ごときが何の豪傑のつもりで、わしの門まで取り戻しに来る。」
    悟空「師は忠実で正しい僧だ。お前の妖しい品など、盗むはずがあるか。」
    独角兕大王「わしが山道のそばに仙人の屋敷を化けさせて出しておいたら、お前の師はその中へ忍び込み、欲に心を動かして、わしの納錦の綿入れ胴着三着を盗み着した。盗品という証拠があるから、捕らえたのだ。お前に本当に腕があるなら、わしと力比べをしてみろ。三合（ごう）打ち合ってわしに対抗できたら、師の命は許してやる。かなわなければ、お前も一緒に冥土へ送るぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch50-033"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者笑道：「潑物！不須講口，但說比勢，正合老孫之意。走上來，吃吾之棒。」那怪物那怕甚麼賭鬥，挺鋼槍劈面迎來。這一場好殺！你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    悟空は笑った。
    悟空「化け物め、口で言い合う必要はない。力比べなら、まさに俺の望むところだ。かかってこい、この棒を食らえ！」
    相手も勝負を恐れはしない。鋼の槍を突き出し、真正面から迎え撃った。これぞ大立ち回り。ご覧あれ。
  "translation_status": "reviewed"
- "id": "xy-ch50-034"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": "金箍棒舉，長桿槍迎。金箍棒舉，亮爍爍似電掣金蛇；長桿槍迎，明晃晃如龍離黑海。那門前小妖擂鼓，排開陣勢助威風；這壁廂大聖施功，使出縱橫逞本事。他那裡一桿槍，精神抖擻；我這裡一條棒，武藝高強。正是英雄相遇英雄漢，果然對手才逢對手人。那魔王口噴紫氣盤煙霧，這大聖眼放光華結繡雲。只為大唐僧有難，兩家無義苦爭論。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 172
    "line_end": 172
  "translation_ja": |-
    金箍棒が振り上がり、長柄の槍が迎え撃つ。
    金箍棒が振り上がれば、きらめきは稲妻に走る金の蛇。
    長柄の槍が迎えれば、まばゆさは黒い海から躍り出る竜。
    門前の小妖は太鼓を打ち、陣を並べて威勢を添え、
    こちらの大聖は力を振るい、縦横自在に腕を見せる。
    向こうの一本の槍は、気迫に満ちあふれ、
    こちらの一本の棒は、武芸が抜きんでる。
    まさに英雄が英雄と出会い、好敵手が好敵手に巡り会った。
    魔王は口から紫の気を吐いて煙霧を巻き、大聖は目から光を放って錦雲を結ぶ。
    ただ大唐の僧が災難に遭ったため、二人はよしみもなく、激しく争う。
  "translation_status": "reviewed"
- "id": "xy-ch50-035"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個戰經三十合，不分勝負。那魔王見孫悟空棍法齊整，一往一來，全無些破綻，喜得他連聲喝采道：「好猴兒，好猴兒，真個是那鬧天宮的本事。」這大聖也愛他槍法不亂，右遮左擋，甚有解數，也叫道：「好妖精，好妖精。果然是一個偷丹的魔頭。」二人又鬥了一二十合，那魔王把槍尖點地，喝令小妖齊來。那些潑怪一個個拿刀弄杖，執劍掄槍，把個孫大聖圍在中間。行者公然不懼，只叫：「來得好，來得好，正合吾意。」使一條金箍棒，前迎後架，東擋西除。那夥群妖莫想肯退。行者忍不住焦躁，把金箍棒丟將起去，喝聲：「變！」即變作千百條鐵棒，好便似飛蛇走蟒，盈空裡亂落下來。那夥妖精見了，一個個魄散魂飛，抱頸縮頭，盡往洞中逃命。老魔王唏唏冷笑道：「那猴不要無禮，看手段。」即忙袖中取出一個亮灼灼白森森的圈子來，望空拋起，叫聲：「著！」唿喇一下，把金箍棒收做一條，套將去了。弄得孫大聖赤手空拳，翻觔斗逃了性命。那妖魔得勝回歸洞，行者朦朧失主張。這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    二人は三十合戦ったが、勝負がつかなかった。独角兕大王は悟空の棒さばきが整い、進退に少しの隙もないのを見て喜び、繰り返し喝采した。
    独角兕大王「見事な猿だ、見事な猿だ！　まさしく天宮を騒がせた腕前だ。」
    悟空も、相手の槍さばきが乱れず、右を防ぎ、左を受け、巧みにさばくのを見て感心し、叫んだ。
    悟空「見事な妖怪だ、見事な妖怪だ！　なるほど、丹薬を盗んだ魔物だけのことはある。」
    さらに十合、二十合と戦うと、独角兕大王は槍先を地につけ、小妖たちへ一斉にかかれと命じた。化け物どもは刀や棒を手にし、剣を取り、槍を振り、悟空を真ん中に囲んだ。悟空は平然として恐れず、ただ叫んだ。
    悟空「よく来た、よく来た。思うつぼだ！」
    一本の金箍棒で前を迎え、後ろを受け、東を防ぎ、西を払った。それでも妖怪どもは退こうとしない。悟空はとうとういら立ち、金箍棒を上へ投げて叫んだ。
    悟空「変われ！」
    たちまち千本、百本の鉄棒となり、飛ぶ蛇、走る大蛇のように空を満たし、乱れ落ちてきた。妖怪どもは肝をつぶし、首を抱え、頭をすくめ、一斉に洞へ逃げ込んで命を守った。独角兕大王は、ひひっと冷笑した。
    独角兕大王「猿め、無礼を働くな。わしの術を見ろ。」
    袖から急いで、まばゆく光る白い輪を一つ取り出し、空へ放り投げて叫んだ。
    独角兕大王「かかれ！」
    ごうっと音がすると、金箍棒は一本に戻され、輪に絡め取られてしまった。悟空は素手になり、宙返りして逃げ、ようやく命を守った。妖魔は勝って洞へ帰り、悟空はぼうぜんとして、なす術を失った。まさに、こういうことである。
  "translation_status": "reviewed"
- "id": "xy-ch50-036"
  "section_id": "chapter-50"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    道高一尺魔高丈，性亂情昏錯認家。
    可恨法身無坐位，當時行動念頭差。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 175
    "line_end": 176
  "translation_ja": |-
    道が一尺高まれば、魔は一丈高まる。本性は乱れ、情は曇り、帰る家を取り違える。
    恨めしいことに法身（ほっしん）には安らぐ座がなく、あのとき動いた心の一念が間違っていた。
  "translation_status": "reviewed"
- "id": "xy-ch50-037"
  "section_id": "chapter-50"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知這番怎麼結果，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch50-1498134"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第050回&oldid=1498134"
    "line_start": 178
    "line_end": 178
  "translation_ja": "さて、このたびの結末やいかに。続きは次回でお聞きいただこう。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-01-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の「情」「性」「神」「心」は、欲に動かされる心と本来の性、精神のあり方を重ねた語。盗み着と輪からの離脱の物語に通じるが、それぞれを特定の人物や身体部位へ一対一に固定していない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-02-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の詞は、心地の清掃、灯芯の調整、呼吸、心猿意馬を重ねる修行の詩。「曹溪」は禅の地名として知られ、ここでは呼吸を整える表現に置かれるが、特定の臓器や内丹の経路と断定しない。「毘盧」は毘盧舎那仏の略称と解し、本体・本性の象徴に重なるものとして語を残した。詩を実践用の呼吸法に作り替えてはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-03-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「孫行者引豬八戒、沙僧近前侍立道」は、悟空が二人を率いて師の前へ出て答える構文と読み、発話ラベルは主語の悟空とした。同行する二人の行動は残し、三人の合同発話へ広げていない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-04-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「變削」はその字を保持し、周囲の高く切り立つ山の描写に沿って訳した。別の本文に見える「巒削」へ原文を書き換えていない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-05-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "竜の九種の子、蜃が楼閣を現して鳥を吞むという説明は、悟空が語る当時の伝説・物語内の知識であり、現代の動物学的説明ではない。底本の「『龍生九種」」は引用符が不整合だが原文では保持し、訳文ではこの短い諺の引用をそこで閉じた。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-06-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "哈巴狗は小型の愛玩犬として訳し、現代の特定の犬種には固定しない。頭に羊裘をかぶるという姿は原文どおり。千里、行き六七日と帰り六七日、熱い茶一杯の時間未満、昼食に間に合うという説明も独自に整合させず残した。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-07-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「撞頭的和尚」は頭を打つ苦行で喜捨を求める僧への呼び方と解した。『東度記』第五十八回にも、頭を打って托鉢する「撞頭の和尚」が描かれる。ただし本場面では悟空が自ら頭を打つのでなく、老人に打たれて平然としている。老人の見立てと実際の行動を区別した。参照：https://zh.wikisource.org/wiki/東度記/058"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-08-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「倒垂蓮升斗門樓」は、逆さに垂れた蓮の装飾と、升斗形の組物を持つ楼門として訳した。建築部材の厳密な組み合わせ・形式は未確定であり、特定の様式名を補っていない。「門枕石鼓」は門の足もとにある太鼓形の石と解した。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-09-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "納錦は錦そのものだけでなく、地を埋めるように施す刺繍の呼称。国立故宮博物院の織品修復解説が、地を見せるものを納紗、見せないものを納錦と区別する。ここでは華やかな刺繍の胴着として語を残し、特定の布質や現代の製品名に固定しない。参照：https://theme.npm.edu.tw/Academic/ChineseArtDownload.ashx?bid=10111&eid=510"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-10-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "盗みについての律と玄帝の教えは三蔵が引く言葉として訳した。個別の法典・経典の正式な出典はこの本文だけから確定しない。「褊衫」は、前の回で用いた僧衣の表記「偏衫」に訳語をそろえた。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-11-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "取得ページでは「金兜山」「金兜洞」の兜の直後に、原字は「⿰山兜」でUnicodeに字がない、という電子本文の文字説明が挿入されている。原文欄には二箇所とも全文保持した。日本語本文では代用表示の兜を用い、この注へ文字説明を移した。別版の地名に無断で改めていない。老人が三人は助からぬと述べるのは警告であり、語り手が死を確定する文ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-12-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は、悟空が飯を老人へあけ、空の鉢を自分でしまうという動作の直後、老人が鉢を受け取って童僕へ渡し、飯も鉢も預かると続ける。受渡しの文面に不整合があるが、飯を最初から鉢ごと渡したことへ統一していない。老人と童僕のどちらが山神・土地神かは明記されず、名乗り前のラベルで割り当てていない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-13-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「本宮」は妖怪自身が以前いた宮をいうが、この回ではその名称や主との関係は明かされない。具体名は補わない。最後の「那個是孫悟空」は、直前の主語「眾妖」を引き継ぐ集団の発言として訳した。大王一人が呼ばわったものとは断定していない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-14-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「照水」は犀の角を燃やして水中の怪異を照らしたという故事を踏まえると解した。「喘月」は牛が月を日と見誤ってあえぐという故事を重ねる。「犁雲」は雲の下で耕す像として訳したが、ここでの雲の細かな比喩は確定しない。いずれも妖怪を犀や牡牛に比べる詩の表現で、出自や本来の正体を断定する説明へ置き換えない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=104548&la=0&powerMode=0 、https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=3728&la=0&webMd=2"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-15-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "独角兕大王は三蔵が三着を盗み着たと主張する。しかし先行する語りでは、八戒が三着を持ち出し、着たのは八戒と沙悟浄で、三蔵は返すよう戒めている。この食い違いは、妖怪の主張と語りの差として残した。「孫外公」は悟空が相手の母方の祖父を自称して見下す言葉で、実際の親族関係ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-16-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「偷丹的魔頭」は悟空が敵を評する発言として保持した。この言葉から、具体的な丹薬の所有者や妖怪の出自を語り手の事実説明として補わない。白く光る輪も、この回では固有名が明かされないため形状だけで示した。"
  "translation_status": "reviewed"
- "id": "xy-ch50-note-17-body"
  "section_id": "chapter-50"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「道高一尺魔高丈」は道が一尺高まるのに魔は一丈高まるという大小の対比を保つ。「錯認家」「法身無坐位」は、心身の安定と安住の場を失う寓意を残した。誰か一人の失敗だけに限定した教訓へ書き換えていない。"
  "translation_status": "reviewed"

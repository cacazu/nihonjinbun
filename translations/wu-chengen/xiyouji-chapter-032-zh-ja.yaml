  "kind": "paragraph"
  "origin": "source"
  "source_text": "嚶的一翅飛將去，趕上八戒，釘在他耳朵後面鬃根底下。那獃子只管走路，怎知道身上有人。行有七八里路，把釘鈀撇下，吊轉頭來，望著唐僧，指手畫腳的罵道：「你罷軟的老和尚，捉掐的弼馬溫，面弱的沙和尚，他都在那裡自在，捉弄我老豬來蹡路。大家取經，都要望成正果，偏是教我來巡甚麼山。哈哈哈，曉得有妖怪，躲著些兒走，還不夠一半，卻教我去尋他，這等晦氣哩。我往那裡睡覺去，睡一覺回去，含含糊糊的答應他，只說是巡了山，就了其帳也。」那獃子一時間僥幸，搴著鈀，又走，只見山凹裡一彎紅草坡。他一頭鑽得進去，使釘鈀撲個地鋪，轂轆的睡下，把腰伸了一伸，道聲：「快活。就是那弼馬溫，也不得像我這般自在。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    悟空は羽をひと振り、ぶうんと飛んで八戒に追いつき、耳の後ろの剛毛の根元にぴたりと止まった。八戒はひたすら歩いており、体に誰かがいるとは気づきもしない。七、八里ほど行くと熊手を放り出し、三蔵のいる方へ向き直って、手足を振り回しながら罵った。八戒「この腰抜けの老和尚、意地の悪い弼馬温（ひつばおん）、気の弱い沙和尚め。みんなそこで楽をして、俺だけを騙して歩き回らせやがる。経を取りに行くのはみんな同じ、悟りを得たいのもみんな同じなのに、俺ばかり何の山の見回りだ。ははは、妖怪がいると分かったなら、なるべく避けて通ったって、まだ安心できないくらいなのに、俺にわざわざ探させるとは、とんだ厄病神だ。どこかへ行って寝てやろう。ひと眠りして帰り、適当に受け答えして、山は見回ったと言えば、それでおしまいだ。」
    八戒はしばしの幸運を当てこみ、熊手を持ってまた進んだ。すると、山のくぼみに赤い草の生えた、ゆるく曲がる斜面があった。そこへ頭から潜りこむと、熊手で草をならして寝床を作り、ごろりと横になった。腰を伸ばして、八戒は言った。八戒「ああ、いい気持ちだ。あの弼馬温だって、俺ほどのんびりはできまい。」
  "translation_status": "reviewed"
- "id": "xy-ch32-024"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來行者在他耳根後，句句兒聽著哩，忍不住飛將起來，又琢弄他一琢弄。又搖身一變，變作個啄木蟲兒。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":

  "known_gaps":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-005"
    "description_ja": "「舍利國」は仏教の聖地を表す詩語として「舎利の国」とし、特定の史実上の国名には同定しない。「玉毫」は仏像の白毫を玉の輝きにたとえたものと解した。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-006"
    "description_ja": "底本は「放轡催銀濁，兜韁趲玉龍」とする。「銀濁」は馬の呼称と文脈上判断し、対句の「玉龍」とともに白馬を指す比喩として訳した。原字を「銀騣」などへ訂正していない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-008"
    "description_ja": "「壑下深沉鄰碧落」は、深い谷と碧落という空の語が並ぶ。深い虚空に接するような眺めとして訳し、「碧落」を海や黄泉へ置き換えない。「崒嵂嵂」は虎のたけだけしい様子に採るが、山の険しさに重なる表現でもある。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-010"
    "description_ja": "「檐頭」は底本どおり軒先とし、「擔頭」へ改めない。「三星澹澹」は、三点のある心の字を連想させる表現として、胸の内の淡泊さに採った。「有何榮辱暫關山」は山の暮らしに栄辱を気にしない趣旨として訳すが、「關山」の字句には解釈の余地が残る。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-015"
    "description_ja": "「發昏」は気を失うほどの苦境を誇張して言う。三、四度と年七、八百度の応酬は誇張のまま保ち、実際の失神回数の予告とはしない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-019"
    "description_ja": "「你兒子便胡說」は、でたらめを言うなら相手の息子になってもよいという乱暴な言い返しとして訳した。三蔵に実際の息子がいるという意味ではない。「三停路已走了停半」は全行程を三分して一つ半、すなわち半ばまで来たという比喩。距離を新たに計算してはいない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-020"
    "description_ja": "「三分」「半分」は見込みを十分に対する割合で述べる表現として、三割・半割とした。正確な確率を計測した数字ではない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-025"
    "description_ja": "「偏嫌老樹伶仃」は、餌となる虫のいる朽木を好む描写との対照として、古木がぽつんと立つだけでは気に入らないと訳した。「圜睛決尾性丟靈」の「決尾」は割れた尾、「丟靈」は敏捷で抜け目ない様子に採る。鳥種の形態を現代の図鑑へ合わせて補訂しない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-034"
    "description_ja": "「影神」は肖像と、人の影や像に霊が宿るという観念が重なる語。像があるから元気が出なかったというのは八戒の言い分であり、語り手が呪術の実効を認めた説明ではない。「清醮二十四分」は、二十四の神位を設ける醮の儀礼と解した。道教儀礼の歴史研究では分位が祭壇の神位を指し、各神位に供物を一份ずつ配することから生じた名と説明される（中央研究院歴史語言研究所公開の黎志添論文490頁注259）。同時代の『金瓶梅』第三十九回にも清醮二十四分位という言い方があり、『上清靈寶大法』巻六十二には清醮三百六十分位の用例がある。これらからの解釈であり、底本の「分」に「位」を補訂はしていない。具体的な神々の内訳や儀礼形式の地域差は確定せず、二十四日や二十四回とも解さない。 本文の欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "segment_ids":
    - "xy-ch32-037"
    "description_ja": "銀角大王の武器は直前に「寶刀」、戦闘では「七星劍」と表記される。訳文でも宝刀と七星剣を保持し、同じ武器への呼び替えか、持ち替えかを新たに断定しない。「蓏蘿藤」はつる草と訳し、特定の植物種に同定しない。 本文の欠落ではなく、解釈・校訂上の留保。"

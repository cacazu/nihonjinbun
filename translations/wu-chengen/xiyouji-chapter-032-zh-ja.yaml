  "translation_ja": |-
    悟空が大げさにしおれた様子を見せたのは、三蔵からこの言葉を引き出すためだった。涙を拭い、悟空は言った。悟空「お師匠さま、この山を越えたいのでしたら、猪八戒（ちょはっかい）が、私の言う二つの仕事について従ってくれてこそ、三割の見込みが立ちます。言うことを聞かず、助けにもならぬのでは、半割ほども、越えられる望みはありません。」
    八戒「兄貴、行かないなら解散すりゃいい。俺を巻きこむなよ。」
    三蔵「八戒、まず兄弟子に、何をさせたいのか尋ねてみなさい。」
    八戒は言われたとおり、悟空に尋ねた。八戒「兄貴、俺に何をしろっていうんだ。」
    悟空「一つは、お師匠さまの世話をすること。もう一つは、山を見回ることだ。」
    八戒「師匠の番なら座る、山の見回りなら歩く。まさか、ちょっと座っては歩き、ちょっと歩いては座れというのか。どうして二か所の面倒を見られる。」
    悟空「二つ同時にやれとは言っていない。どちらか一つを引き受ければいい。」
    八戒は笑った。八戒「それなら相談のしようもある。ただ、師匠の世話はどうすればいい、山の見回りはどうするんだ。まず話してくれ。俺に向いていそうなほうをやるから。」
    悟空「お師匠さまの世話なら、用を足しに行かれる時は付き添い、道を行かれる時はお支えし、食事が欲しいと言われれば托鉢（たくはつ）してくる。少しでも腹をすかせたら、お前を打つ。少しでも顔色が黄色くなれば、お前を打つ。少しでも体が痩せれば、お前を打つ。」
    八戒は慌てた。八戒「そりゃ難しい、難しい、難しい。付き添ったり支えたりするのは構わん。ずっと背負って離さなくたって、まだたやすい。だが里へ托鉢に行けと言われても、この西方への道じゃ、俺が経を取りに行く和尚だなんて、誰も知らない。山から出てきた、育ちきらぬ丈夫な豚だと思われるだけだ。大勢で手を組み、叉や熊手や箒を持って俺を囲んで倒し、家へ連れ帰って潰し、塩漬けにして正月用にされたら、それこそひどい目に遭うじゃないか。」
    悟空「では、山の見回りへ行け。」
    八戒「見回りは、どうするんだ。」
    悟空「この山へ入り、妖怪が何匹いるか、何という山で、何という洞窟なのか、調べてこい。そうすれば、俺たちも通りやすくなる。」
    八戒「それくらい、わけはない。俺は山の見回りへ行こう。」
    八戒は衣の裾をまくり、熊手を構えた。威勢よく深山へ入り、意気高く大道へ駆け上がっていった。

    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 159
    "line_end": 159
  "translation_ja": "悟空は耳の後ろで、一言も漏らさず聞いていた。たまらず飛び立ち、もう少しからかってやることにした。再び身を振るわせると、今度は啄木鳥になった。その姿は、"
  "translation_status": "reviewed"
- "id": "xy-ch32-025"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    鐵嘴尖尖紅溜，翠翎艷艷光明。一雙鋼爪利如釘。腹餒何妨林靜。
    最愛枯槎朽爛，偏嫌老樹伶仃。圜睛決尾性丟靈。辟剝之聲堪聽。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 161
    "line_end": 162
  "translation_ja": |-
    鉄のように尖った嘴は、つややかに赤い。翠の羽は、鮮やかに光る。
    二つの鋼の爪は、釘のように鋭い。腹がすいても、林が静かであるのは構わない。
    腐って朽ちた切り株が大好きで、古木がぽつんと立つばかりでは気に入らぬ。
    丸い目、割れた尾、性質は抜け目なく敏捷。かつかつと木を叩く音は、耳にも心地よい。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「偏嫌老樹伶仃」は、餌となる虫のいる朽木を好む描写との対照として、古木がぽつんと立つだけでは気に入らないと訳した。「圜睛決尾性丟靈」の「決尾」は割れた尾、「丟靈」は敏捷で抜け目ない様子に採る。鳥種の形態を現代の図鑑へ合わせて補訂しない。"
- "id": "xy-ch32-026"

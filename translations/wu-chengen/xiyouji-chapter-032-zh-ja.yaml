    "line_start": 137
    "line_end": 137
  "translation_ja": "三蔵は馬を止めて山を見渡した。まさに進みあぐねていると、緑のカヤツリグサの茂る坂に、一人の木こりが立っているのが見えた。どのような身なりをしていたかといえば、"
  "translation_status": "reviewed"
- "id": "xy-ch32-010"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭戴一頂老藍氈笠，身穿一領毛皂衲衣。老藍氈笠，遮煙蓋日果稀奇；毛皂衲衣，樂以忘憂真罕見。手持鋼斧快磨明，刀伐乾柴收束緊。檐頭春色，幽然四序融融；身外閑情，常是三星澹澹。到老只於隨分過，有何榮辱暫關山？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    頭には濃い藍色のフェルトの笠、身には黒い粗毛の継ぎはぎ衣。
    濃い藍色のフェルト笠は、もやを防ぎ日差しを遮る、なかなかの品。黒い粗毛の継ぎはぎ衣をまとい、楽しんで憂いを忘れる姿は、実に得がたい。
    手に持つ鋼の斧は鋭く磨かれ、切り出した枯れ薪は、しっかりと束ねてある。
    軒先には春の景色、ひっそりと、四季を通じてのどかな暮らし。身の外にわずらわしさはなく、胸の内もいつも淡々としている。
    老いるまで分相応に暮らすだけ。栄誉や恥辱など、いっときも気にかけはしない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「檐頭」は底本どおり軒先とし、「擔頭」へ改めない。「三星澹澹」は、三点のある心の字を連想させる表現として、胸の内の淡泊さに採った。「有何榮辱暫關山」は山の暮らしに栄辱を気にしない趣旨として訳すが、「關山」の字句には解釈の余地が残る。"

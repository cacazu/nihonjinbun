  "translation_ja": |-
    さて、その山を平頂山、洞窟を蓮花洞といった。洞窟には二人の妖怪がおり、一人は金角大王（きんかくだいおう）、もう一人は銀角大王（ぎんかくだいおう）と呼ばれていた。金角大王は座ったまま、銀角大王に話しかけた。
    金角大王「弟よ、俺たちはどのくらい、山の見回りをしておらぬ。」
    銀角大王「半月になります。」
    金角大王「弟よ、今日は俺のために、ひと回りしてきてくれ。」
    銀角大王「今日は何のために、山を見回るのです。」
    金角大王「お前は知らぬのだ。近ごろ聞いた話では、東土（とうど）の唐の国が、皇帝の義弟である唐僧を、西方へ仏を拝みに遣わしたという。一行は四人で、弟子の名は孫行者、猪八戒、沙和尚、馬を合わせて五口だ。どこにいるか探して、俺のところへ捕らえてこい。」
    銀角大王「人を食いたければ、どこででも何人か捕まえられます。あの和尚がどこへ来ようと、そのまま行かせればよいではありませんか。」
    金角大王「お前は分かっておらぬ。昔、俺が天界を出たころ、人の話で聞いたのだ。唐僧は金蝉長老（きんせんちょうろう）が下界に生まれ変わった者で、十度の生をかけて修行を積んだ善人だという。元陽（げんよう）を一滴も漏らしていないから、その肉を食えば、寿命が延びて長生きできるのだ。」
    銀角大王「その肉を食うだけで寿命が延び、長生きできるなら、俺たちは何のために坐禅をし、功を積み、竜虎（りゅうこ）を錬り、雌と雄を合わせたりするのです。ただ食いに行けばよい。俺が捕らえてきましょう。」
    金角大王「弟よ、お前は少しせっかちだ。まあ待て。門を出るなり、誰でも彼でも和尚なら捕らえてきたのでは、もし唐僧でなかった場合、あまりに無体というものだ。俺はあいつの顔を覚えていて、師弟の顔かたちを絵に描いておいた。これを持っていけ。和尚に出会ったら、絵と見比べて確かめるのだ。」
    金角大王はさらに、誰が何という名なのか、一人ずつ教えた。銀角大王は絵を受け取り、姓名を知ると、洞窟を出て小妖怪を三十匹選び出し、山の見回りに向かった。

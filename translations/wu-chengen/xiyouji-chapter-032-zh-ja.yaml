    巨齒鑄來如龍爪，滲金妝就似虎形。
    若逢對敵寒風灑，但遇相持火燄生。
    能替唐僧消障礙，西天路上捉妖精。
    輪動煙霞遮日月，使起昏雲暗斗星。
    築倒泰山老虎怕，掀翻大海老龍驚。
    饒你這妖有手段，一鈀九個血窟窿。」

  "translation_ja": |-
    そこで悟空は、ひと芝居打った。目をこすって涙をにじませ、そのまま三蔵のほうへ歩いていった。八戒はそれを見ると、急いで呼びかけた。
    八戒「沙和尚（さおしょう）、荷を下ろせ。荷物を出して、俺たち二人で分けよう。」
    沙悟浄「二番目の兄貴、なぜ分けるんです。」
    八戒「分けようぜ。お前は流沙河（りゅうさが）へ戻って、また妖怪になればいい。俺は高老荘（こうろうそう）へ帰って、女房の顔でも見よう。白馬を売って棺を一つ買い、師匠の最期の面倒を見てやる。みんなで解散だ。まだ西天へ行こうってのか。」
    三蔵は馬上でそれを聞いた。三蔵「この愚か者、道を進んでいる最中に、また何をでたらめを言うのだ。」
    八戒「でたらめなら、俺はあんたの息子だ。孫行者（そんぎょうじゃ）が、あそこで泣きながら戻ってくるのが見えないのか。天に潜り、地に入り、斧で斬られても火で焼かれても、油の釜へ入れられても怖がらない豪傑だぞ。それが今、憂いの帽子でもかぶったように、涙をぽろぽろ流して来るんだ。きっと山は険しく、妖怪は凶暴なんだろう。俺たちのような弱い者が、どうして通れる。」
    三蔵「くだらぬ話はやめなさい。私が尋ねて、何と言うか聞いてみよう。」
    三蔵は悟空に尋ねた。三蔵「悟空、何かあれば、顔を合わせて相談すればよい。なぜ一人で悩む。そんな泣きべそをかいた顔で、私を脅かすつもりか。」
    悟空「お師匠さま、さっき知らせに来たのは日値功曹でした。妖怪が凶暴で、ここは通りにくいとのことです。確かに山は高く道は険しく、先へ進めません。別の日に出直しましょう。」
    三蔵は恐れおののき、悟空の虎皮の腰衣をつかんだ。三蔵「悟空よ、旅路を三つに分ければ、もう一つ半までは歩いてきた。なぜ今になって、引き返すようなことを言うのだ。」
    悟空「力を尽くさぬというのではありません。ただ、魔物が多いのにこちらの力は弱く、手勢も足りぬのが心配なのです。『たとえ鉄の塊でも、炉に入れて打てる釘は何本ある』と申すではありませんか。」
    三蔵「それももっともだ。確かに、一人では難しかろう。兵法書にも『少数では大勢に敵わない』とある。だが、ここには八戒と沙悟浄もいる。どちらも私の弟子だ。お前が自由に指図して使えばよい。護衛にも助っ人にもして、心を合わせて力を尽くし、山道の障りを払って私を越えさせてくれ。それで皆、悟りの実りを得られるではないか。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「你兒子便胡說」は、でたらめを言うなら相手の息子になってもよいという乱暴な言い返しとして訳した。三蔵に実際の息子がいるという意味ではない。「三停路已走了停半」は全行程を三分して一つ半、すなわち半ばまで来たという比喩。距離を新たに計算してはいない。"
- "id": "xy-ch32-020"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者這一場扭捏，只逗出長老這幾句話來。他搵了淚道：「師父啊，若要過得此山，須是豬八戒依得我兩件事兒，才有三分去得；假若不依我言，替不得我手，半分兒也莫想過去。」八戒道：「師兄，不去就散火罷。不要攀我。」長老道：「徒弟，且問你師兄，看他教你做甚麼？」獃子真個對行者說道：「哥哥，你教我做甚事？」行者道：「第一件是看師父，第二件是去巡山。」八戒道：「看師父是坐，巡山去是走。終不然教我坐一會又走，走一會又坐？兩處怎麼顧盼得來？」行者道：「不是教你兩件齊幹，只是領了一件便罷。」八戒又笑道：「這等也好計較。但不知看師父是怎樣，巡山是怎樣？你先與我講講，等我依個相應些兒的去幹罷。」行者道：「看師父啊，師父去出恭，你伺候；師父要走路，你扶持；師父要吃齋，你化齋。若他餓了些兒，你該打；黃了些兒臉皮，你該打；瘦了些兒形骸，你該打。」八戒慌了道：「這個難，難，難。伺候扶持，通不打緊；就是不離身馱著，也還容易；假若教我去鄉下化齋，他這西方路上，不識我是取經的和尚，只道是那山裡走出來的一個半壯不壯的健豬，夥上許多人，叉鈀掃帚，把老豬圍倒，拿家去宰了，醃著過年，這個卻不就遭瘟了？」行者道：「巡山去罷。」八戒道：「巡山便怎麼樣兒？」行者道：「就入此山，打聽有多少妖怪，是甚麼山，是甚麼洞，我們好過去。」八戒道：「這個小可，老豬去巡山罷。」那獃子就撒起衣裙，挺著釘鈀，雄糾糾，徑入深山；氣昂昂，奔上大路。"

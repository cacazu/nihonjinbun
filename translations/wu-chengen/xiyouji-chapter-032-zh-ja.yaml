  "source_text": "行者罵道：「我把你個囊糠的夯貨！這般要緊的所在，教你去巡山，你卻去睡覺。不是啄木蟲叮你醒來，你還在那裡睡哩。及叮醒，又編這樣大謊，可不誤了大事？你快伸過孤拐來，打五棍記心。」八戒慌了道：「那個哭喪棒重，擦一擦兒皮塌，挽一挽兒筋傷；若打五下，就是死了。」行者道：「你怕打，卻怎麼扯謊？」八戒道：「哥哥呀，只是這一遭兒，以後再不敢了。」行者道：「一遭便打三棍。」八戒道：「爺爺呀！半棍兒也禁不得。」獃子沒計奈何，扯住師父道：「你替我說個方便兒。」長老道：「悟空說你編謊，我還不信，今果如此，其實該打。但如今過山少人使喚，悟空，你且饒他，待過了山。再打罷。」行者道：「古人云：『順父母言情，呼為大孝。』師父說不打，我就且饒你。你再去與他巡山，若再說謊誤事，我定一下也不饒你。」"

- "id": "xy-ch32-002"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說唐僧復得了孫行者，師徒們一心同體，共詣西方。自寶象國救了公主，承君臣送出城西。說不盡沿路饑餐渴飲，夜住曉行。卻又值三春景候，那時節："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて、三蔵（さんぞう）は悟空（ごくう）を再び迎え、師弟は心を一つにして、ともに西方を目指した。宝象国（ほうぞうこく）で公主（こうしゅ）を救い出すと、国王と臣下たちは一行を都の西まで見送ってくれた。道中、腹が減れば食べ、喉が渇けば飲み、夜には宿を取り、明ければ歩く日々は、いちいち語り尽くせない。やがて、また春の季節となった。そのころの眺めはこうだった。"
  "translation_status": "reviewed"
- "id": "xy-ch32-003"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": "輕風吹柳綠如絲，佳景最堪題。時催鳥語，暖烘花發，遍地芳菲。海棠庭院來雙燕，正是賞春時。紅塵紫陌，綺羅絃管，鬥草傳卮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    そよ風に吹かれる柳は、緑の糸のよう。詩に詠むには、この上ない景色。
    季節に促されて鳥がさえずり、暖かさに包まれて花が開き、あたり一面に芳しい花草が満ちる。
    海棠の咲く庭には、つがいの燕が訪れ、今こそ春を楽しむ時。
    人々の往き来で土煙の立つ都の道には、綾や薄絹の晴れ着、弦楽と笛の音。草合わせを競い、酒杯を回す。
  "translation_status": "reviewed"
- "id": "xy-ch32-004"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們正行賞間，又見一山擋路。唐僧道：「徒弟們仔細，前遇山高，恐有虎狼阻擋。」行者道：「師父，出家人莫說在家話。你記得那烏巢和尚的《心經》云『心無罣礙：無罣礙，方無恐怖，遠離顛倒夢想』之言？但只是：『掃除心上垢，洗淨耳邊塵。不受苦中苦，難為人上人。』你莫生憂慮，但有老孫，就是塌下天來，可保無事，怕甚麼虎狼？」長老勒回馬道：「我"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 125
    "line_end": 125
  "translation_ja": |-
    師弟が歩きながら春景色を楽しんでいると、また一つの山が行く手をふさいだ。
    三蔵「お前たち、気をつけなさい。前に高い山がある。虎や狼に道をふさがれるかもしれぬ。」
    悟空「お師匠さま、出家した者が、俗世の人のようなことを言ってはいけません。烏巣和尚（うそうおしょう）から教わった『心経（しんぎょう）』の、『心にとらわれがなく、とらわれがなければ恐れもなく、逆さまな思い込みや夢想を遠く離れる』という言葉を覚えておいででしょう。つまり、『心についた垢を払い、耳のほとりの塵を洗い清めよ。苦しみの中の苦しみに耐えなければ、人に抜きんでた者にはなれぬ』ということです。心配なさるな。この私がいるかぎり、たとえ天が落ちてきても、ご無事にお守りします。虎や狼など、何が恐ろしいのです。」
    三蔵は手綱を引いて馬を振り向かせ、こう言った。三蔵「私は、
  "translation_status": "reviewed"
- "id": "xy-ch32-005"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    當年奉旨出長安，只憶西來拜佛顏。
    舍利國中金像彩，浮屠塔裡玉毫斑。
    尋窮天下無名水，歷遍人間不到山。
    逐逐煙波重疊疊，幾時能夠此身閑？」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 127
    "line_end": 130
  "translation_ja": |-
    あの日、勅命を奉じて長安（ちょうあん）を出て、ただ西へ赴き、仏のお顔を拝みたいと願った。
    舎利（しゃり）の国には金の仏像が光り、仏塔の中では仏の白毫（びゃくごう）が玉のように輝いている。
    天下の名もない川を果てまで尋ね、人の足も届かぬ山々をことごとく越えてきた。
    追われるように進めば、霞む水波が幾重にも重なる。この身の安まる日は、いつ来るのだろう。」
  "translation_status": "reviewed"
  "issues":

- "id": "xy-ch32-006"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞說，笑呵呵道：「師要身閑，有何難事？若功成之後，萬緣都罷，諸法皆空。那時節，自然而然，卻不是身閑也？」長老聞言，只得樂以忘憂。放轡催銀濁，兜韁趲玉龍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    悟空はそれを聞くと、声を立てて笑った。悟空「お師匠さま、身を安らかにするなど、難しいことではありません。務めを成し遂げれば、あらゆる執着もやみ、すべてのものは空となります。その時には、おのずと身も安らかになるではありませんか。」
    三蔵はその言葉に心を楽しませ、ひとまず憂いを忘れた。手綱を緩めて銀色の駿馬を促し、また引き寄せて玉の竜のような白馬を進ませた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は「放轡催銀濁，兜韁趲玉龍」とする。「銀濁」は馬の呼称と文脈上判断し、対句の「玉龍」とともに白馬を指す比喩として訳した。原字を「銀騣」などへ訂正していない。"
- "id": "xy-ch32-007"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們上得山來，十分險峻，真個嵯峨。好山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 134
    "line_end": 134
  "translation_ja": "師弟が山へ登ってみると、道はひどく険しく、山はまことに高くそびえていた。見事な山の姿はこうである。"
  "translation_status": "reviewed"
- "id": "xy-ch32-008"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": "巍巍峻嶺，削削尖峰。灣環深澗下，孤峻陡崖邊。灣環深澗下，只聽得唿喇喇戲水蟒翻身；孤峻陡崖邊，但見那崒嵂嵂出林虎剪尾。往上看，巒頭突兀透青霄；回眼觀，壑下深沉鄰碧落。上高來，似梯似凳；下低行，如塹如坑。真個是古怪巔峰嶺，果然是連尖削壁崖。巔峰嶺上，採藥人尋思怕走；削壁崖前，打柴夫寸步難行。胡羊野馬亂攛梭，狡兔山牛如佈陣。山高蔽日遮星斗，時逢妖獸與蒼狼。草徑迷漫難進馬，怎得雷音見佛王？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    高々と連なる険しい峰、削ぎ落としたように尖る頂。曲がりくねった深い谷底、ひときわ切り立つ崖のほとり。
    曲がりくねった深い谷底では、大蛇が水に戯れて身を翻す、ざばざばという音ばかりがする。ひときわ切り立つ崖のほとりでは、たけだけしい虎が林から現れ、尾を振るのが見える。
    上を見れば、突き出した山頂が青空を貫く。振り返れば、谷底は深々と落ちこみ、碧い虚空に接するばかり。
    高みに登れば、梯子や腰掛けをよじ登るよう。低みへ下れば、堀や穴に降りるよう。
    まことに奇怪な頂の連なる峰、まさしく鋭い峰と削り立てた壁のような崖。
    峰の上では、薬草を採る人も足を運ぶのをためらう。切り立つ崖を前にしては、薪を採る男も一歩さえ進めない。
    異国の羊と野馬が、織機の梭のように入り乱れて駆ける。すばしこい兎と山牛は、陣を敷いたかのよう。
    高い山は日を覆い、星々を隠し、妖しい獣や青灰色の狼にも出くわす。
    草道は茫々として馬も進めず、どうすれば雷音（らいおん）に至り、仏の王にまみえられよう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「壑下深沉鄰碧落」は、深い谷と碧落という空の語が並ぶ。深い虚空に接するような眺めとして訳し、「碧落」を海や黄泉へ置き換えない。「崒嵂嵂」は虎のたけだけしい様子に採るが、山の険しさに重なる表現でもある。"
- "id": "xy-ch32-009"

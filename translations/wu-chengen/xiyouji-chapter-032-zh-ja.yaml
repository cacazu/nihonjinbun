  "kind": "paragraph"
  "origin": "source"
  "source_text": "這蟲鷖不大不小的，上秤稱，只有二三兩重。紅銅嘴，黑鐵腳。刷剌的一翅飛下來。那八戒丟倒頭，正睡著哩，被他照嘴唇上扢揸的一下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 164
    "line_end": 164
  "translation_ja": "この鳥は大きくも小さくもなく、秤にかければ、わずか二、三両（りょう）ほど。嘴は赤銅、脚は黒鉄のようだった。ばさっと羽を鳴らして舞い下りると、頭を投げ出して眠っている八戒の唇を、こつんとひと突きした。"
  "translation_status": "reviewed"
- "id": "xy-ch32-027"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子慌得爬將起來，口裡亂嚷道：「有妖怪，有妖怪，把我戳了一槍去了，嘴上好不疼呀。」伸手摸摸，泱出血來了。他道：「蹭蹬啊，我又沒甚喜事，怎麼嘴上掛了紅耶？」他看著這血手，口裡絮絮叨叨的兩邊亂看，卻不見動靜。道：「無甚妖怪，怎麼戳我一槍麼？」忽擡頭往上看時，原來是個啄木蟲，在半空中飛哩。獃子咬牙罵道：「這個亡人，弼馬溫欺負我罷了，你也來欺負我。我曉得了。他一定不認我是個人，只把我嘴當一段黑朽枯爛的樹，內中生了蟲，尋蟲兒吃的，將我啄了這一下也。等我把嘴揣在懷裡睡罷。」那獃子轂轆的依然睡倒。行者又飛來，著耳根後又啄了一下。獃子慌得爬起來道：「這個亡人，卻打攪得我狠。想必這裡是他的窠巢，生蛋佈雛，怕我占了，故此這般打攪。罷罷罷，不睡他了。」搴著鈀，徑出紅草坡，找路又走。可不喜壞了孫行者，笑倒個美猴王。行者道：「這夯貨大睜著兩個眼，連自家人也認不得。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    八戒は慌てて起き上がり、やたらに叫んだ。八戒「妖怪だ、妖怪だ！　俺を槍でひと突きして逃げた。ああ、口が痛い！」
    手を伸ばして触れると、血が流れ出た。八戒「ああ、ついてない。めでたいこともないのに、どうして口に赤い飾りがつくんだ。」
    血のついた手を見ながらぶつぶつ言い、あたりを見回したが、何の気配もない。八戒「妖怪はいない。なのに、どうして槍で突かれたんだ。」
    ふと顔を上げると、一羽の啄木鳥が宙を飛んでいた。八戒は歯ぎしりして罵った。八戒「このくたばり損ないめ。弼馬温が俺をいじめるだけならまだしも、お前までいじめに来るのか。分かったぞ。こいつは俺を人間だと思わず、口を、黒く腐った枯れ木の一部だと思ったに違いない。中に虫がいるから、そいつを探して食おうとして、俺をつついたのだな。なら、口を懐にしまって寝るとしよう。」
    八戒はごろりと、元どおり寝転んだ。悟空はまた飛んできて、今度は耳の付け根の後ろをひと突きした。八戒はびっくりして跳ね起きた。八戒「このくたばり損ない、ずいぶん邪魔をしやがる。きっとここには巣があって、卵を産んだり雛を育てたりしているんだな。俺に場所を取られるのが嫌で、こんなに邪魔をするんだろう。分かった、分かった。もう寝るのはよそう。」
    熊手を手に取ると、赤い草の斜面をまっすぐ出て、道を探してまた歩きだした。悟空は大喜びで、笑い転げた。悟空「この間抜け、大きな目を二つも見開いていながら、身内だということさえ見分けられない。」
  "translation_status": "reviewed"
- "id": "xy-ch32-028"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，搖身又一變，還變做個蟭蟟蟲，釘在他耳朵後面，不離他身上。那獃子入深山，又行有四五里，只見山凹中有桌面大的四四方方三塊青石頭。獃子放下鈀，對石頭唱個大喏。行者暗笑道：「這獃子，石頭又不是人，又不會說話，又不會還禮的，唱他喏怎的，可不是個瞎帳？」原來那獃子把石頭當著唐僧、沙僧、行者三人，朝著他演習哩。他道：「我這回去，見了師父，若問有妖怪，就說有妖怪。他問甚麼山，我若說是泥捏的、土做的、錫打的、銅鑄的、麵蒸的、紙糊的、筆畫的，他們見說我獃哩，若講這話，一發說獃了。我只說是石頭山。他問甚麼洞，也只說是石頭洞。他問甚麼門，卻說是釘釘的鐵葉門。他問裡邊有多遠，只說入內有三層。十分再搜尋，問門上釘子多少，只說老豬心忙記不真。此間編造停當，哄那弼馬溫去。」那獃子捏合了，拖著鈀，徑回本路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    悟空は再び身を振るわせ、また蟭蟟虫に戻った。八戒の耳の後ろにぴたりと止まり、その体から離れなかった。八戒は深山に入り、さらに四、五里行くと、山のくぼみに、卓の天板ほどの大きさの、四角い青石が三つあるのを見つけた。熊手を置くと、石に向かい、声を上げてうやうやしくお辞儀した。悟空は心ひそかに笑った。悟空の心の声「この間抜けめ。石は人間ではないし、口も利けず、礼を返しもしない。それに挨拶してどうする。まるで見当違いだ。」
    だが八戒は、その石を三蔵、沙悟浄、悟空の三人に見立て、練習していたのだった。八戒「これで帰って師匠に会い、『妖怪はいるか』と聞かれたら、『いる』と言えばいい。『何という山だ』と聞かれて、泥をこねた山、土で作った山、錫を叩いた山、銅を鋳た山、粉を蒸した山、紙を貼った山、筆で描いた山なんて言ったら、どうなる。あいつらは俺を間抜けだと言っている。そんなことを言えば、なおさら間抜け呼ばわりされる。石の山、とだけ言っておこう。『何という洞窟だ』と聞かれたら、石の洞窟。『どんな門だ』と聞かれたら、釘を打った鉄板の門。『どのくらい奥行きがある』と聞かれたら、中へ入ると三重になっている。さらにしつこく調べて、『門の釘は何本だった』と聞かれたら、俺は気がせいて、よく覚えていないと言えばいい。ここでうまく話をこしらえて、あの弼馬温を騙してやろう。」
    八戒は作り話をまとめると、熊手を引きずり、来た道をまっすぐ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch32-029"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "怎知行者在耳朵後，一一聽得明白。行者見他回來，即騰兩翅預先回去，現原身，見了師父。師父道：「悟空，你來了，悟能怎不見回？」行者笑道：「他在那裡編謊哩，就待來也。」長老道：「他兩個耳朵蓋著眼，愚拙之人也，他會編甚麼謊？又是你捏合甚麼鬼話賴他哩。」行者道：「師父，你只是這等護短。這是有對問的話。」把他那鑽在草裡睡覺，被啄木蟲叮醒，朝石頭唱喏，編造甚麼石頭山、石頭洞、鐵葉門、有妖精的話，預先說了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    ところが、悟空が耳の後ろにいて、一つ一つ明瞭に聞いているとは知らなかった。八戒が帰りだすのを見ると、悟空は羽を広げて先に戻り、元の姿になって三蔵に会った。
    三蔵「悟空、帰ったか。悟能（ごのう）はなぜ戻らぬ。」
    悟空は笑った。悟空「あそこで嘘をでっち上げています。もうじき来ますよ。」
    三蔵「あれは二つの耳が目を覆うような、愚直な男だ。どんな嘘を作れるというのだ。またお前が何かでたらめを作り、あいつのせいにしているのだろう。」
    悟空「お師匠さまは、いつもそうして欠点をかばわれる。今度の話は、本人に問いただせば分かります。」
    悟空は、八戒が草の中へ潜って眠り、啄木鳥につつかれて目を覚ましたこと、石に向かって挨拶し、石の山、石の洞窟、鉄板の門、妖怪がいるなどという話を作ったことを、あらかじめ説明しておいた。
  "translation_status": "reviewed"
- "id": "xy-ch32-030"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說畢，不多時，那獃子走將來。又怕忘了那謊，低著頭，口裡溫習。被行者喝了一聲道：「獃子，念甚麼哩？」八戒掀起耳朵來看看道：「我到了地頭了？」那獃子上前跪倒。長老攙起道：「徒弟，辛苦啊。」八戒道：「正是。走路的人，爬山的人，第一辛苦了。」長老道：「可有妖怪麼？」八戒道：「有妖怪，有妖怪，一堆妖怪哩！」長老道：「怎麼打發你來？」八戒說：「他叫我做豬祖宗、豬外公，安排些粉湯素食，教我吃了一頓，說道擺旗鼓送我們過山哩。」行者道：「想是在草裡睡著了，說得是夢話。」獃子聞言，就嚇得矮了二寸道：「爺爺呀！我睡他怎麼曉得？」行者上前，一把揪住道：「你過來，等我問你。」獃子又慌了，戰戰兢兢的道：「問便罷了，揪扯怎的？」行者道：「是甚麼山？」八戒道：「是石頭山。」「甚麼洞？」道：「是石頭洞。」「甚麼門？」道：「是釘釘鐵葉門。」「裡邊有多遠？」道：「入內是三層。」行者道：「你不消說了，後半截我記得真，恐師父不信，我替你說了罷。」八戒道：「嘴臉，你又不曾去，你曉得那些兒，要替我說？」行者笑道：「『門上釘子有多少，只說老豬心忙記不真。』可是麼？」那獃子即慌忙跪倒。行者道：「朝著石頭唱喏，當做我三人，對他一問一答，可是麼？又說：『等我編得謊兒停當，哄那弼馬溫去。』可是麼？」那獃子連忙只是磕頭道：「師兄，我去巡山，你莫成跟我去聽的？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    話し終えてまもなく、八戒が戻ってきた。嘘を忘れまいと、うつむいて口の中で繰り返している。悟空が大声をかけた。悟空「間抜け、何を唱えている。」
    八戒は耳を持ち上げて見た。八戒「もう着いたのか。」
    進み出てひざまずくと、三蔵は手を貸して立たせた。三蔵「八戒、ご苦労だった。」
    八戒「まったくだ。道を歩き、山を登る者が、いちばん苦労するんだ。」
    三蔵「妖怪はいたか。」
    八戒「いた、いた、山ほどいた！」
    三蔵「どうして帰してくれたのだ。」
    八戒「あいつらは俺を豚のご先祖さま、豚のおじいさまと呼んで、粉の汁物や精進料理を用意し、たっぷり食わせてくれた。旗や太鼓をそろえて、俺たちの山越えを見送ると言っていたよ。」
    悟空「草の中で眠って、寝言でも言っていたのだろう。」
    八戒はそれを聞くなり、恐ろしさに二寸も背が縮んだ。八戒「おじいさま！　俺が寝ていたと、どうして分かるんだ。」
    悟空は進み寄り、ひっつかんだ。悟空「こっちへ来い。俺が聞いてやる。」
    八戒はまた慌て、がたがた震えた。八戒「聞くだけでいいじゃないか。何で引っつかむんだ。」
    悟空「何という山だった。」
    八戒「石の山だ。」
    悟空「何という洞窟だ。」
    八戒「石の洞窟だ。」
    悟空「どんな門だ。」
    八戒「釘を打った鉄板の門だ。」
    悟空「奥はどのくらいある。」
    八戒「入ると三重になっている。」
    悟空「もう言わなくていい。後半は俺が、はっきり覚えている。お師匠さまが信じてくださらぬかもしれんから、代わりに言ってやろう。」
    八戒「よく言うぜ。行きもしなかったくせに、何が分かっていて、俺の代わりに言うんだ。」
    悟空は笑った。悟空「『門の釘は何本だった、と聞かれたら、俺は気がせいて、よく覚えていないと言えばいい。』そうだろう。」
    八戒はたちまち慌ててひざまずいた。
    悟空「石に向かって挨拶し、俺たち三人に見立てて、一問一答の練習をした。そうだろう。そのうえ、『うまく嘘をこしらえて、あの弼馬温を騙してやろう』と言った。そうだろう。」
    八戒は急いで、ひたすら頭を下げた。八戒「兄貴、俺が山の見回りに行った時、まさか、ついてきて聞いていたのか。」

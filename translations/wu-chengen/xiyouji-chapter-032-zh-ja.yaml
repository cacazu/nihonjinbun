  "translation_ja": |-
    八戒は仕方なく起き上がり、もう一度出かけた。大道を進むにも、疑いから見えない鬼を生み出すようなもの。一歩ごとに、悟空が何かに化けてついてきているのではないかと疑い、何を見ても悟空に思えてしまう。七、八里ほど行くと、一頭の虎が山の斜面を走って横切った。八戒は怖がりもせず、熊手を上げて言った。八戒「兄貴、また嘘を聞きに来たのか。今度は作らないぞ。」
    さらに歩くと、山風がひどく激しくなり、ひゅうっと枯れ木を吹き倒した。木は八戒の目の前まで転がってきた。八戒は地団駄を踏み、胸を叩いた。八戒「兄貴、何だってこんなことをする。もう嘘はつかないと、ずっと言っているじゃないか。今度は木に化けて、人を殴るとはどういうつもりだ。」
    また先へ行くと、白い首の烏が一羽、頭上で続けざまに、かあかあと鳴いた。八戒「兄貴、恥ずかしくないのか。嘘をつかないと言ったら、つかない。いつまでも烏に化けて、どうするんだ。また聞きに来たのか。」
    実のところ、今度は悟空はついていかなかった。八戒が一人で驚き、怪しみ、でたらめに疑いを膨らませていたのだ。だからどこへ行っても、悟空がつきまとっていると思えてならなかった。八戒の疑心暗鬼については、ひとまず置いておく。

- "id": "xy-ch32-013"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "對長老厲聲高叫道：「那西進的長老，暫停片時，我有一言奉告：此山有一夥毒魔狠怪，專吃你東來西去的人哩。」長老聞言，魂飛魄散，戰兢兢坐不穩雕鞍，急回頭，忙呼徒弟道：「你聽那樵夫報道：『此山有毒魔狠怪。』誰敢去細問他一問？」行者道：「師父放心，等老孫去問他一個端的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    木こりは三蔵に向かい、鋭い声で呼びかけた。木こり「西へ行かれるお坊さま、しばらくお待ちなさい。お知らせしたいことがある。この山には残忍で凶悪な妖怪の一味がいて、東へ西へと通りかかる人を、もっぱら食っているのです。」
    三蔵は肝をつぶし、震えて、彫り物のある鞍にも落ち着いて座っていられなかった。急いで振り返り、弟子たちを呼んだ。三蔵「木こりの知らせを聞いたか。『この山には残忍で凶悪な妖怪がいる』そうだ。誰か、詳しいことを尋ねに行ってくれぬか。」
    悟空「お師匠さま、ご安心を。私が行って、はっきり確かめてきましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch32-014"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，拽開步，徑上山來，對樵子叫聲「大哥」，道個問訊。樵夫答禮道：「長老啊，你們有甚緣故來此？」行者道：「不瞞大哥說，我們是東土差來西天取經的。那馬上是我的師父，他有些膽小。適蒙見教，說有甚麼毒魔狠怪，故此我來奉問一聲：那魔是幾年之魔，怪是幾年之怪？還是個把勢，還是個雛兒？煩大哥老實說說，我好著山神、土地遞解他起身。」樵子聞言，仰天大笑道：「你原來是個風和尚。」行者道：「我不風啊，這是老實話。」樵子道：「你說是老實，便怎敢說把他遞解起身？」行者道：「你這等長他那威風，胡言亂語的攔路報信，莫不是與他有親？不親必鄰，不鄰必友。」樵子笑道：「你這個風潑和尚，忒沒道理。我倒是好意，特來報與你們，教你們走路時，早晚間防備，你倒轉賴在我身上。且莫說我不曉得妖魔出處，就曉得啊，你敢把他怎麼的遞解？解往何處？」行者道：「若是天魔，解與玉帝；若是土魔，解與土府。西方的歸佛，東方的歸聖；北方的解與真武，南方的解與火德。是蛟精解與海主，是鬼祟解與閻王。各有地頭方向。我老孫到處里人熟，發一張批文，把他連夜解著飛跑。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    悟空は大股に山道を登り、木こりに声をかけて挨拶した。悟空「お兄さん。」
    木こりも礼を返した。木こり「お坊さん、何のためにここへ来なさった。」
    悟空「隠し立てせずに言えば、俺たちは東の国から遣わされて、西天（さいてん）へ経典を取りに行くところだ。馬に乗っているのが俺の師匠で、少々気が小さい。さっき、凶悪な妖怪がいると教えてもらったので、尋ねに来た。そいつらは何年ものの魔物、何年ものの化け物なんだい。年季の入った腕利きか、それともひよっこか。どうか本当のところを聞かせてくれ。山神（さんじん）や土地神（とちがみ）に命じて、そいつらをお上へ護送させてやるから。」
    木こりは空を仰いで大笑いした。木こり「なんだ、気のふれた和尚だったか。」
    悟空「気などふれていない。これは本当の話だ。」
    木こり「本当の話だというなら、どうしてそいつらを護送してやるなどと言えるのだ。」
    悟空「そんなに奴らの威勢を持ち上げて、道をふさいであれこれご託を並べて知らせに来るとは、まさか親戚じゃあるまいな。親戚でなければ隣人、隣人でなければ友達だろう。」
    木こりは笑った。木こり「この無茶苦茶な和尚、あまりに道理がないぞ。私は親切心から、わざわざ知らせに来て、旅の途中はいつも気をつけるように言っているのに、逆に私を疑うのか。そもそも妖怪の素性など知らぬが、たとえ知っていたとしても、あんたがどうやって護送できる。どこへ連れていくのだ。」
    悟空「天の魔物なら玉帝（ぎょくてい）へ、地の魔物なら地の役所へ。西方の者は仏のもとへ、東方の者は聖人のもとへ。北方の者は真武（しんぶ）へ、南方の者は火徳（かとく）へ。蛟の精なら海の主へ、祟る亡霊なら閻王（えんおう）へ送るのさ。それぞれ管轄と方角が決まっている。俺はどこにでも顔が利く。指図書を一枚出せば、その夜のうちに、飛ぶように護送させてやる。」
  "translation_status": "reviewed"
- "id": "xy-ch32-015"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那樵子止不住呵呵冷笑道：「你這個風潑和尚，想是在方上雲遊，學了些書符咒水的法術，只可驅邪縛鬼，還不曾撞見這等狠毒的怪哩。」行者道：「怎見他狠毒？」樵子道：「此山徑過有六百里遠近，名喚平頂山。山中有一洞，名喚蓮花洞。洞裡有兩個魔頭，他畫影圖形，要捉和尚；抄名訪姓，要吃唐僧。你若別處來的還好，但犯了一個『唐』字兒，莫想去得，去得。」行者道：「我們正是唐朝來的。」樵子道：「他正要吃你們哩。」行者道：「造化，造化。但不知他怎的樣吃哩？」樵子道：「你要他怎的吃？」行者道：「若是先吃頭，還好耍子；若是先吃腳，就難為了。」樵子道：「先吃頭怎麼說？先吃腳怎麼說？」行者道：「你還不曾經著哩。若是先吃頭，一口將他咬下，我已死了，憑他怎麼煎炒熬煮，我也不知疼痛。若是先吃腳，他啃了孤拐，嚼了腿亭，吃到腰截骨，我還急忙不死，卻不是零零碎碎受苦？此所以難為也。」樵子道：「和尚，他那裡有這許多工夫，只是把你拿住，綑在籠裡，囫圇蒸吃了。」行者笑道：「這個更好，更好。疼倒不忍疼，只是受些悶氣罷了。」樵子道：「和尚不要調嘴。那妖怪隨身有五件寶貝，神通極大極廣。就是擎天的玉柱，架海的金梁，若保得唐朝和尚去，也須要發發昏是。」行者道：「發幾個昏麼？」樵子道：「要發三四個昏是。」行者道：「不打緊，不打緊。我們一年，常發七八百個昏兒，這三四個昏兒易得發，發發兒就過去了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    木こりは、なおも鼻で笑った。木こり「このでたらめな和尚、あちこちを行脚して、札を書いたり水に呪文をかけたりする術を少し覚えたのだろう。それでは邪気を払い、亡霊を縛るのがせいぜいだ。こんな残忍な妖怪には、まだ出くわしたことがないとみえる。」
    悟空「どうして、そんなに残忍だと分かる。」
    木こり「この山を横切る道は、およそ六百里。名を平頂山（へいちょうざん）という。山の中に蓮花洞（れんげどう）という洞窟があり、二人の魔王が住んでいる。顔かたちを絵に描いて和尚を捕らえようとし、姓名を書き留めて捜し回り、唐僧（とうそう）を食おうとしている。よそから来たのならまだしも、『唐（とう）』の一字に関わったが最後、とても通り抜けられぬぞ。」
    悟空「俺たちは、まさに唐の国から来たんだ。」
    木こり「奴らが食おうとしているのは、あんたたちだ。」
    悟空「こいつは運がいい、運がいい。ただ、どんなふうに食うのか分からんが。」
    木こり「どんなふうに食ってほしいのだ。」
    悟空「頭から先に食うのなら、まだ気楽でいい。脚から先だと、難儀する。」
    木こり「頭からならどうだというのだ。脚からならどうなる。」
    悟空「あんたはまだ、そんな目に遭ったことがないな。頭を先に、がぶりとかじり取られれば、もう俺は死んでいる。それから焼かれようと、炒められようと、煮つめられようと、煮込まれようと、痛みは感じない。脚から先なら、くるぶしをかじり、すねを噛み砕かれ、腰の骨まで食われても、すぐには死ねない。少しずつ苦しめられるじゃないか。だから難儀だというのさ。」
    木こり「和尚、奴らにそんな手間をかける気はない。あんたを捕らえて縛り、蒸籠に入れ、丸ごと蒸して食うだけだ。」
    悟空は笑った。悟空「それなら、なお結構、なお結構。痛みをこらえることもなく、少し蒸し苦しい思いをするだけで済む。」
    木こり「和尚、軽口はやめなさい。あの妖怪どもは五つの宝を身につけ、途方もない神通力（じんつうりき）を持っている。天を支える玉の柱、海を渡す金の梁ほどの頼れる者でも、唐から来た和尚を守って通ろうとすれば、何度か気を失うような目に遭うぞ。」
    悟空「何度、気を失うんだい。」
    木こり「三度か四度は、気を失うだろう。」
    悟空「大したことはない。俺たちは一年に、しょっちゅう七百回も八百回も気を失っている。三回や四回ならわけはない。ちょっと気を失えば、それで通り過ぎられるのさ。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「發昏」は気を失うほどの苦境を誇張して言う。三、四度と年七、八百度の応酬は誇張のまま保ち、実際の失神回数の予告とはしない。"
- "id": "xy-ch32-016"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，全然無懼，一心只是要保唐僧。捽脫樵夫，拽步而轉，徑至山坡馬頭前道：「師父，沒甚大事。有便有個把妖精兒，只是這裡人膽小，放他在心上。有我哩，怕他怎的？走路，走路。」長老見說，只得放懷隨行。正行處，早不見了那樵夫。長老道：「那報信的樵子如何就不見了？」八戒道：「我們造化低，撞見日裡鬼了。」行者道：「想是他鑽進林子裡尋柴去了。等我看看來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    悟空には、まるで恐れる様子がなかった。ただひたすら三蔵を守ろうと心に決め、木こりを振り切ると、大股に引き返し、坂の上の馬の前まで戻った。悟空「お師匠さま、大したことはありません。妖怪は一匹か二匹いるにはいるようですが、ここの人々が臆病で、気にしているだけです。私がいるのに、何が恐ろしいものですか。さあ、行きましょう。」
    三蔵もその言葉に気を取り直し、一緒に進んだ。ところが、歩きだした時には、もう木こりの姿が消えていた。
    三蔵「知らせに来た木こりは、なぜもう姿が見えぬのだ。」
    八戒（はっかい）「運が悪いな。昼間から幽霊に出くわしたんだ。」
    悟空「林へ入りこんで、薪を探しているのだろう。ちょっと見てこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch32-017"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，睜開火眼金睛，漫山越嶺的望處，卻無蹤跡。忽擡頭往雲端裡一看，看見是日值功曹，他就縱雲趕上，罵了幾聲「毛鬼」，道：「你怎麼有話不來直說，卻那般變化了，演樣老孫？」慌得那功曹施禮道：「大聖，報信來遲，勿罪，勿罪。那怪果然神通廣大，變化多端。只看你騰那乖巧，運動神機，仔細保你師父；假若怠慢了些兒，西天路莫想去得。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    悟空は火眼金睛（かがんきんせい）を見開き、山じゅうの峰という峰を見渡したが、影も形もなかった。ふと顔を上げ、雲の中を見ると、木こりの正体は日値功曹（にっちこうそう）だった。悟空は雲に飛び乗って追いつき、何度も罵った。悟空「この化け物め！　知らせたいことがあるなら、なぜ直接来て言わん。わざわざあんな姿に化けて、俺をからかったな。」
    功曹（こうそう）は慌てて礼をした。功曹「大聖（たいせい）さま、お知らせが遅れました。どうかお咎めなさらず、お許しください。あの妖怪は、実に強大な神通力を持ち、変化も自在です。あなたの機転と不思議なお知恵を存分にお働かせになり、お師匠さまをくれぐれもお守りください。少しでも油断なされば、西天への道は、とても進めません。」
  "translation_status": "reviewed"
- "id": "xy-ch32-018"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，把功曹叱退，切切在心，按雲頭，徑來山上。只見長老與八戒、沙僧簇擁前進。他卻暗想：「我若把功曹的言語實實告訴師父，師父他不濟事，必就哭了；假若不與他實說，夢著頭，帶著他走，常言道：『乍入蘆圩，不知深淺。』倘或被妖魔撈去，卻不又要老孫費心？且等我照顧八戒一照顧，先著他出頭與那怪打一仗看。若是打得過他，就算他一功；若是沒手段，被怪拿去，等老孫再去救他不遲，卻好顯我本事出名。」正自家計較，以心問心道：「只恐八戒躲懶，便不肯出頭，師父又有些護短。等老孫羈勒他羈勒。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    悟空は功曹を叱りつけて退かせたが、その言葉はしっかり心に留めた。雲を下ろして山へ戻ると、三蔵を囲んで八戒と沙悟浄（さごじょう）が進んでいる。悟空はひそかに考えた。悟空の心の声「功曹の言ったことを、そのまま師匠に話せば、師匠は気が弱いから、きっと泣き出す。かといって本当のことを話さず、何も知らぬまま連れていくのもな。『初めて葦の水辺へ踏みこめば、深さも浅さも分からない』という。もし妖怪にさらわれたら、また俺が苦労することになる。ここは八戒にひとつ世話を焼いてやり、先に出て、あいつと一戦させてみよう。勝てれば、あいつの手柄になる。腕が足りずに捕まっても、その時に俺が救いに行けば間に合う。それなら俺の腕も見せられ、名も上がる。」
    悟空はさらに算段し、自分の心に問いかけた。悟空の心の声「ただ、八戒が怠けて、前へ出たがらぬかもしれん。師匠も、あいつの不始末をかばいがちだ。ひとつ手綱を締めてやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch32-019"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，你看他弄個虛頭，把眼揉了一揉，揉出些淚來。迎著師父，往前徑走。八戒看見，連忙叫：「沙和尚，歇下擔子，拿出行李來，我兩個分了罷。」沙僧道：「二哥，分怎的？」八戒道：「分了罷，你往流沙河還做妖怪，老豬往高老莊上盼盼渾家。把白馬賣了，買口棺木，與師父送老。大家散火，還往西天去哩？」長老在馬上聽見，道：「這個夯貨，正走路，怎麼又胡說了？」八戒道：「你兒子便胡說。你不看見孫行者那裡哭將來了？他是個鑽天入地，斧砍火燒，下油鍋都不怕的好漢；如今戴了個愁帽，淚汪汪的哭來，必是那山險峻，妖怪兇狠。似我們這樣軟弱的人兒，怎麼去得？」長老道：「你且休胡談，待我問他一聲，看是怎麼說話。」問道：「悟空，有甚話當面計較，你怎麼自家煩惱？這般樣個哭包臉，是虎諕我也？」行者道：「師父啊，剛才那個報信的是日值功曹，他說妖精兇狠，此處難行，果然的山高路峻，不能前進，改日再去罷。」長老聞言，恐惶悚懼，扯住他虎皮裙子道：「徒弟呀，我們三停路已走了停半，因何說退悔之言？」行者道：「我沒個不盡心的，但只恐魔多力弱，行勢孤單。『縱然是塊鐵，下爐能打得幾根釘？』」長老道：「徒弟啊，你也說得是，果然一個人也難。兵書云：『寡不可敵眾。』我這裡還有八戒、沙僧，都是徒弟，憑你調度使用，或為護將幫手，協力同心，掃清山徑，領我過山，卻不都還了正果？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"

  "translation_ja": |-
    大きな歯を鋳れば竜の爪のごとく、金をかぶせて飾れば虎の形に似る。
    敵と向き合えば冷たい風が吹き散り、打ち合えば炎が立ちのぼる。
    三蔵に代わって障りを取り除き、西天への道で妖怪を捕らえることができる。
    振り回せば霞が日月を覆い、繰り出せば暗雲が北斗（ほくと）の星を暗くする。
    泰山（たいざん）を打ち倒せば老いた虎も恐れ、大海をひっくり返せば老いた竜も驚く。
    お前のような妖怪に、どれほどの腕があろうと、熊手ひと打ち、血の穴が九つ開くぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch32-037"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪聞言，那裡肯讓。使七星劍，丟開解數，與八戒一往一來，在山中賭鬥有二十回合，不分勝負。八戒發起狠來，捨死的相迎。那怪見他捽耳朵，噴粘涎，舞釘鈀，口裡吆吆喝喝的，也盡有些悚懼，即回頭招呼小怪，一齊動手。若是一個打一個，其實還好。他見那些小妖齊上，慌了手腳，遮架不住，敗了陣，回頭就跑。原來是道路不平，未曾細看，忽被蓏蘿藤絆了個踉蹌。掙起來正走，又被一個小妖睡倒在地，扳著他腳跟，撲的又跌了個狗吃屎。被一群趕上按住，抓鬃毛，揪耳朵，扯著腳，拉著尾，扛扛擡擡，擒進洞去。咦！正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    銀角大王はそれを聞いても、譲る気などなかった。七星剣（しちせいけん）を使って技を繰り出し、八戒と攻めつ返しつ、山中で二十合戦ったが、勝負はつかなかった。八戒は猛り立ち、命を捨てる覚悟で向かっていった。銀角大王も、八戒が耳を振り、ねばつく唾を飛ばし、熊手を舞わせ、口でわあわあと叫ぶのを見ると、かなり恐れを覚えた。振り向いて小妖怪を呼び、一斉にかからせた。
    一対一なら、実のところ、まだ何とかなった。しかし小妖怪どもがいっぺんに押し寄せるのを見て、八戒は慌てふためき、防ぎきれなくなった。戦いに敗れ、振り返って逃げ出した。ところが道がでこぼこしているのを、よく見ていなかったため、いきなりつる草につまずいてよろめいた。どうにか立ち直って走りだすと、一匹の小妖怪が地面に寝転び、八戒の踵をつかんだ。どさりとまた転び、地面へ顔を突っこんだ。
    妖怪どもは群がって追いつき、押さえつけ、剛毛をつかみ、耳を引き、脚を引っ張り、尾をつかんで、肩に担ぐやら持ち上げるやらして、洞窟へ捕らえていった。ああ、まさに、
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "銀角大王の武器は直前に「寶刀」、戦闘では「七星劍」と表記される。訳文でも宝刀と七星剣を保持し、同じ武器への呼び替えか、持ち替えかを新たに断定しない。「蓏蘿藤」はつる草と訳し、特定の植物種に同定しない。"
- "id": "xy-ch32-038"
  "section_id": "chapter-32"
  "kind": "verse"
  "origin": "source"
  "source_text": "一身魔發難消滅，萬種災生不易除。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 183
    "line_end": 183
  "translation_ja": |-
    ひとたび身の内に魔が起これば、消し去るのは難しく、
    さまざまな災いが生まれれば、取り除くのは容易でない。
  "translation_status": "reviewed"
- "id": "xy-ch32-039"
  "section_id": "chapter-32"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知豬八戒性命如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 185
    "line_end": 185
  "translation_ja": "さて、八戒の命はどうなったのか。それは次の回でお話ししよう。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-001"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「舍利國」は仏教の聖地を表す詩語として「舎利の国」とし、特定の史実上の国名には同定しない。「玉毫」は仏像の白毫を玉の輝きにたとえたものと解した。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-002"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「放轡催銀濁，兜韁趲玉龍」とする。「銀濁」は馬の呼称と文脈上判断し、対句の「玉龍」とともに白馬を指す比喩として訳した。原字を「銀騣」などへ訂正していない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-003"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「壑下深沉鄰碧落」は、深い谷と碧落という空の語が並ぶ。深い虚空に接するような眺めとして訳し、「碧落」を海や黄泉へ置き換えない。「崒嵂嵂」は虎のたけだけしい様子に採るが、山の険しさに重なる表現でもある。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-004"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「檐頭」は底本どおり軒先とし、「擔頭」へ改めない。「三星澹澹」は、三点のある心の字を連想させる表現として、胸の内の淡泊さに採った。「有何榮辱暫關山」は山の暮らしに栄辱を気にしない趣旨として訳すが、「關山」の字句には解釈の余地が残る。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-005"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「發昏」は気を失うほどの苦境を誇張して言う。三、四度と年七、八百度の応酬は誇張のまま保ち、実際の失神回数の予告とはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-006"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「你兒子便胡說」は、でたらめを言うなら相手の息子になってもよいという乱暴な言い返しとして訳した。三蔵に実際の息子がいるという意味ではない。「三停路已走了停半」は全行程を三分して一つ半、すなわち半ばまで来たという比喩。距離を新たに計算してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-007"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三分」「半分」は見込みを十分に対する割合で述べる表現として、三割・半割とした。正確な確率を計測した数字ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-008"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「偏嫌老樹伶仃」は、餌となる虫のいる朽木を好む描写との対照として、古木がぽつんと立つだけでは気に入らないと訳した。「圜睛決尾性丟靈」の「決尾」は割れた尾、「丟靈」は敏捷で抜け目ない様子に採る。鳥種の形態を現代の図鑑へ合わせて補訂しない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-009"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「影神」は肖像と、人の影や像に霊が宿るという観念が重なる語。像があるから元気が出なかったというのは八戒の言い分であり、語り手が呪術の実効を認めた説明ではない。「清醮二十四分」は、二十四の神位を設ける醮の儀礼と解した。道教儀礼の歴史研究では分位が祭壇の神位を指し、各神位に供物を一份ずつ配することから生じた名と説明される（中央研究院歴史語言研究所公開の黎志添論文490頁注259）。同時代の『金瓶梅』第三十九回にも清醮二十四分位という言い方があり、『上清靈寶大法』巻六十二には清醮三百六十分位の用例がある。これらからの解釈であり、底本の「分」に「位」を補訂はしていない。具体的な神々の内訳や儀礼形式の地域差は確定せず、二十四日や二十四回とも解さない。"
  "translation_status": "reviewed"
- "id": "xy-ch32-note-010"
  "section_id": "chapter-32-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "銀角大王の武器は直前に「寶刀」、戦闘では「七星劍」と表記される。訳文でも宝刀と七星剣を保持し、同じ武器への呼び替えか、持ち替えかを新たに断定しない。「蓏蘿藤」はつる草と訳し、特定の植物種に同定しない。"
  "translation_status": "reviewed"

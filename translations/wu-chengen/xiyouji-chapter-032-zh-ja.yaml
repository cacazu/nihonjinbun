  "translation_ja": |-
    脇にいた悟空は、こらえきれず、ひひっと笑った。三蔵は叱った。三蔵「この悪猿め。弟弟子へのいたわりがまるでなく、いつも張り合う心ばかり抱いている。そんな悪知恵を働かせ、言葉や顔つきを取り繕って、あいつをそそのかし、山の見回りなどへ行かせておきながら、今度はここで笑いものにするのか。」
    悟空「笑いものにしているのではありません。この笑いには、わけがあるのです。見ていてください。猪八戒は、出かけたところで決して山を見回りはしませんし、妖怪に顔を合わせる勇気もありません。どこかへしばらく隠れて、嘘をでっち上げ、私たちを騙すでしょう。」
    三蔵「なぜ、そこまであいつのことが分かる。」
    悟空「きっとそうすると思うのです。お疑いなら、私があとをつけ、何をするか見て、何を言うか聞いてきましょう。一つには、妖怪退治の手助けをするため。もう一つには、仏を拝む真心があるか、確かめるためです。」
    三蔵「よかろう、よかろう。ただし、からかってはならぬぞ。」
    悟空は承知すると、まっすぐ坂を追っていき、身を振るわせて蟭蟟虫（しょうりょうちゅう）に変わった。まことに身軽で小さな姿だった。見れば、

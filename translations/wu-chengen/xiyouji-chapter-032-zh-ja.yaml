  "origin": "source"
  "source_text": "翅薄舞風不用力，腰尖細小如針。穿蒲抹草過花陰，疾似流星還甚。眼睛明映映，聲氣渺瘖瘖。昆蟲之類惟他小，亭亭款款機深。幾番閑日歇幽林，一身渾不見，千眼莫能尋。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch32-1808364"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第032回&oldid=1808364"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    薄い羽は力も要らずに風に舞い、くびれた腰は針ほどに細い。
    蒲の間を抜け、草をかすめ、花陰を通る速さは、流れ星さえ上回る。
    目はきらきらと輝き、声も息づかいも、ほとんど聞こえない。
    虫という虫の中でも、これほど小さいものはなく、すっとたたずみ、ゆったり動く内に、深い知恵を秘めている。
    幾度もののどかな日、奥深い林に休む。その姿はすっかり隠れ、千の目をもってしても見つけられない。

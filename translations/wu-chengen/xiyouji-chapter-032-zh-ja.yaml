  "source_text": "那獃子只得爬起來又去。你看他奔上大路，疑心生暗鬼，步步只疑是行者變化了跟住他，故見一物，即疑是行者。走有七八里，見一隻老虎從山坡上跑過，他也不怕，舉著釘鈀道：「師兄來聽說謊的？這遭不編了。」又走處，那山風來得甚猛，呼的一聲，把顆枯木刮倒，滾至面前，他又跌腳搥胸的道：「哥啊，這是怎的起？一行說不敢編謊罷了，又變甚麼樹來打人？」又走向前，只見一個白頸老鴉，當頭喳喳的連叫幾聲，他又道：「哥哥，不羞，不羞。我說不編就不編了，只管又變著老鴉怎的？你來聽麼？」原來這一番行者卻不曾跟他去，他那裡卻自驚自怪，亂疑亂猜，故無往而不疑是行者隨他身也。獃子驚疑且不題。"
  "source_languages":

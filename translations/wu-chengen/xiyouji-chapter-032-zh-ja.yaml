  "source_text": "行者在傍，忍不住嘻嘻冷笑。長老罵道：「你這個潑猴！兄弟們全無愛憐之意，常懷嫉妒之心。你做出這樣獐智，巧言令色，撮弄他去甚麼巡山，卻又在這裡笑他。」行者道：「不是笑他，我這笑中有味。你看豬八戒這一去，決不巡山，也不敢見妖怪，不知往那裡去躲閃半會，捏出個謊來，哄我們也。」長老道：「你怎麼就曉得他？」行者道：「我估出他是這等，不信，等我跟他去看看，聽他一聽：一則幫副他手段降妖，二來看他可有個誠心拜佛？」長老道：「好，好，好，你卻莫去捉弄他。」行者應諾了，徑直趕上山坡，搖身一變，變作個蟭蟟蟲兒。其實變得輕巧，但見他："

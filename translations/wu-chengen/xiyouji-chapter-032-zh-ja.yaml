  "source_text": "卻說八戒運拙，正行處，可可的撞見群魔，當面擋住道：「那來的甚麼人？」獃子才擡起頭來，掀著耳朵，看見是些妖魔，他就慌了，心中暗道：「我若說是取經的和尚，他就撈了去。」只是說走路的。小妖回報道：「大王，是走路的。」那三十名小怪，中間有認得的，有不認得的。傍邊有聽著指點說話的道：「大王，這個和尚，像這圖中豬八戒模樣。」叫掛起影神圖來。八戒看見，大驚道：「怪道這些時沒精神哩，原來是他把我的影神傳將來也。」小妖用槍挑著，銀角用手指道：「這騎白馬的是唐僧，這毛臉的是孫行者。……」八戒聽見道：「城隍，沒我便也罷了，豬頭三牲，清醮二十四分。」口裡嘮叨，只管許願。那怪又道：「這黑長的是沙和尚，這長嘴大耳的是豬八戒。」獃子聽見說他，慌得把個嘴揣在懷裡藏了。那怪叫：「和尚，伸出嘴來。」八戒道：「胎裡病，伸不出來。」那怪令小妖使鉤子鉤出來。八戒慌得把個嘴伸出道：「小家形罷了，這不是？你要看便就看，鉤怎的？」"

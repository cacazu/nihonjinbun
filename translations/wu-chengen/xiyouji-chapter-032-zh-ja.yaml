    "status": "open"
    "message_ja": "「影神」は肖像と、人の影や像に霊が宿るという観念が重なる語。像があるから元気が出なかったというのは八戒の言い分であり、語り手が呪術の実効を認めた説明ではない。「清醮二十四分」は、二十四の神位を設ける醮の儀礼と解した。道教儀礼の歴史研究では分位が祭壇の神位を指し、各神位に供物を一份ずつ配することから生じた名と説明される（中央研究院歴史語言研究所公開の黎志添論文490頁注259）。同時代の『金瓶梅』第三十九回にも清醮二十四分位という言い方があり、『上清靈寶大法』巻六十二には清醮三百六十分位の用例がある。これらからの解釈であり、底本の「分」に「位」を補訂はしていない。具体的な神々の内訳や儀礼形式の地域差は確定せず、二十四日や二十四回とも解さない。"

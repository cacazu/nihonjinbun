  "translation_ja": |-
    一方、運の悪い八戒は、歩いているところで、折悪しく妖怪の群れに出くわした。目の前をふさがれ、声をかけられた。妖怪たち「どこから来た、何者だ。」
    八戒はそこでようやく顔を上げ、耳を持ち上げた。妖怪どもだと分かると慌て、心の中で考えた。八戒の心の声「経を取りに行く和尚だと言えば、そのままさらわれてしまう。」
    そこで、ただの旅人だとだけ答えた。小妖怪が報告した。小妖怪「大王、旅人だそうです。」
    三十匹の小妖怪には、八戒を見分けられる者も、見分けられない者もいた。脇で仲間が指さしながら話すのを聞いていた一匹が、言った。小妖怪「大王、この和尚は、絵にある猪八戒に似ております。」
    そこで肖像画を掲げさせた。八戒はそれを見ると仰天した。八戒「このところ元気が出ないと思ったら、道理でだ。俺の影神（えいしん）を、こいつらが写し取って持ってきていたのか。」
    小妖怪が槍の先に絵を掲げ、銀角大王が指で示した。銀角大王「白馬に乗っているのが唐僧、毛むくじゃらの顔が孫行者……。」
    八戒はそれを聞いて、言った。八戒「城隍（じょうこう）さま、俺さえ入っていなければ、豚の頭と三牲（さんせい）をお供えし、二十四座の神位を設けて清醮（せいしょう）を営みます。」
    口の中でぶつぶつと、ひたすら願をかける。銀角大王はさらに言った。銀角大王「この黒くて背が高いのが沙和尚、長い鼻先に大きな耳なのが猪八戒だ。」
    自分のことを言われた八戒は、慌てて鼻先を懐へ押しこんで隠した。
    銀角大王「和尚、鼻先を出せ。」
    八戒「生まれつきの病で、出せないんだ。」
    銀角大王は小妖怪に、鉤で引っかけて引き出せと命じた。八戒は慌てて鼻先を出した。八戒「けちな真似はよせ。ほら、これだろう。見たければ見ればいい。何も鉤で引っかけることはないじゃないか。」

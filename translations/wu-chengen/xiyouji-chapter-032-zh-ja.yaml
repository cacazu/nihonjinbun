  "translation_ja": |-
    悟空は罵った。悟空「糠を詰めた袋みたいな、この大間抜けめ！　こんな大事なところで山を見回れと言ったのに、寝に行くとは。啄木鳥につつかれて目を覚まさなければ、まだそこで寝ていただろう。起きたら起きたで、こんな大嘘を作る。大事な旅をしくじらせるつもりか。さっさとくるぶしを出せ。棒で五つ打って、覚えさせてやる。」
    八戒は慌てた。八戒「あの葬式棒（そうしきぼう）は重い。ちょっとかすっただけで皮がはがれ、少し払われただけで筋が傷む。五つも打たれたら、死んじまう。」
    悟空「打たれるのが怖いなら、なぜ嘘をついた。」
    八戒「兄貴、今度一度きりだ。もう二度としない。」
    悟空「一度きりなら、三つ打つ。」
    八戒「おじいさま！　半打ちだって、こらえられないよ。」
    八戒はどうにもならず、三蔵にすがりついた。八戒「俺のために、ひと言取りなしてくれよ。」
    三蔵「お前が嘘をついたと悟空が言っても、私は信じなかった。だが、今となっては本当だった。確かに打たれて当然だ。しかし、今は山を越えるのに、人手が足りぬ。悟空、ひとまず許してやりなさい。山を越えてから打てばよい。」
    悟空「昔から、『父母の言うことや心に従うのが、この上ない孝行である』といいます。お師匠さまが打つなとおっしゃるので、今は許してやろう。もう一度、山を見回ってこい。また嘘をついて仕事をしくじれば、今度こそ、一打ちたりともまけてやらんぞ。」

  "source_text": "卻說那山叫做平頂山，那洞叫做蓮花洞。洞裡兩妖：一喚金角大王，一喚銀角大王。金角正坐，對銀角說：「兄弟，我們多少時不巡山了？」銀角道：「有半個月了。」金角道：「兄弟，你今日與我去巡巡。」銀角道：「今日巡山怎的？」金角道：「你不知。近聞得東土唐朝差個御弟唐僧往西方拜佛，一行四眾，叫做孫行者、豬八戒、沙和尚，連馬五口。你看他在那處，與我把他拿來。」銀角道：「我們要吃人，那裡不撈幾個。這和尚到得那裡，讓他去罷。」金角道：「你不曉得。我當年出天界，嘗聞得人言：唐僧乃金蟬長老臨凡，十世修行的好人，一點元陽未泄，有人吃他肉，延壽長生哩。」銀角道：「若是吃了他肉就可以延壽長生，我們打甚麼坐，立甚麼功，煉甚麼龍與虎，配甚麼雌與雄？只該吃他去了。等我去拿他來。」金角道：「兄弟，你有些性急，且莫忙著。你若走出門，不管好歹，但是和尚就拿將來，假如不是唐僧，卻也不當人子。我記得他的模樣，曾將他師徒畫了一個影，圖了一個形。你可拿去，但遇著和尚，以此照驗照驗。」又將某人是某名字，一一說了。銀角得了圖像，知道姓名，即出洞，點起三十名小怪，便來山上巡邏。"
  "source_languages":

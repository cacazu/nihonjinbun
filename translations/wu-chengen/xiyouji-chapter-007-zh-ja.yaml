  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一點靈光徹太虛，那條拄杖亦如之。
    或長或短隨人用，橫豎橫排任卷舒。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 136
    "line_end": 137
    "source_sequence": 8
  "translation_ja": |-
    一点の霊光（れいこう）は広大な虚空を貫き、あの杖もまた同じこと。
    長くも短くも使う者の意のまま、縦にも横にも、伸び縮みは自在だ。
  "translation_status": "draft"

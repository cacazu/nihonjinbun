- "id": "xy-ch07-010"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    猿猴道體配人心，心即猿猴意思深。
    大聖齊天非假論，官封弼馬豈知音。
    馬猿合作心和意，緊縛牢拴莫外尋。
    萬相歸真從一理，如來同契住雙林。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 141
    "line_end": 144
    "source_sequence": 10
  "translation_ja": |-
    猿の道体は人の心に当たる。心こそ猿とは、意味の深いこと。
    天に等しい大聖とは偽りではない。弼馬の官を授けるとは、真価を知っていたろうか。
    馬と猿は意と心に重なる。固く縛ってつなぎ、外に求めるな。
    あらゆる相は一つの理に従って真に帰る。如来と同じ悟りを得て、双林に住むのだ。
  "translation_status": "draft"
- "id": "xy-ch07-011"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一番，那猴王不分上下，使鐵棒東打西敵，更無一神可擋，只打到通明殿裡，靈霄殿外。幸有佑聖真君的佐使王靈官執殿，他看大聖縱橫，掣金鞭近前擋住道：「潑猴何往？有吾在此，切莫猖狂。」這大聖不由分說，舉棒就打；那靈官鞭起相迎。兩個在靈霄殿前廝渾一處，好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 145
    "line_end": 145
    "source_sequence": 11
  "translation_ja": |-
    今度の斉天大聖は上下の分もかまわず、鉄棒を振るって東へ西へと打ちかかり、止められる神は一人もいない。そのまま通明殿の中、霊霄宝殿の外まで攻め込んだ。幸い、佑聖真君の補佐役である王霊官が殿を守っていた。斉天大聖が縦横に暴れ回るのを見ると、金鞭を抜いて前に立ちふさがった。
    王霊官「暴れ猿、どこへ行く！　私がここにいるからには、勝手はさせぬ。」
    斉天大聖は問答無用と棒を振り上げて打ち、王霊官も鞭を上げて迎え撃つ。二人は霊霄宝殿の前で入り乱れた。何という戦い。
  "translation_status": "draft"
- "id": "xy-ch07-012"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": "赤膽忠良名譽大，欺天誑上聲名壞。一低一好幸相持，豪傑英雄同賭賽。鐵棒兇，金鞭快，正直無私怎忍耐？這個是太乙雷聲應化尊，那個是齊天大聖猿猴怪。金鞭鐵棒兩家能，都是神宮仙器械。今日在靈霄寶殿弄威風，各展雄才真可愛。一個欺心要奪斗牛宮，一個竭力匡扶玄聖界。苦爭不讓顯神通，鞭棒往來無勝敗。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 147
    "line_end": 147
    "source_sequence": 12
  "translation_ja": |-
    忠誠一筋の善き者は誉れ高く、天を欺き主君をだます者は悪名高い。
    悪しき者と善き者、折よく相対し、豪傑と英雄が技を競う。
    鉄棒は猛々しく、金鞭は素早い。公明無私の者に、どうして黙認できよう。
    こちらは太乙雷声応化尊、あちらは斉天大聖の猿の妖怪。
    金鞭も鉄棒も双方の得物、ともに神の宮の仙器である。
    今日、霊霄宝殿で威を振るい、それぞれの雄才は、まことに見事。
    一人は良心を欺き斗牛の宮を奪おうとし、一人は力を尽くして玄聖の世界を支える。
    激しく争って譲らず神通を示し、鞭と棒が飛び交っても勝敗はつかない。
  "translation_status": "draft"
- "id": "xy-ch07-013"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個鬥在一處，勝敗未分。早有佑聖真君又差將佐發文到雷府，調三十六員雷將齊來，把大聖圍在垓心，各騁兇惡鏖戰。那大聖全無一毫懼色，使一條如意棒，左遮右擋，後架前迎。一時見那眾雷將的刀槍劍戟、鞭簡撾鎚、鉞斧金瓜、旄鐮月鏟來的甚緊，他即搖身一變：變做三頭六臂；把如意棒幌一幌，變作三條；六隻手使開三條棒，好便似紡車兒一般，滴流流，在那垓心裡飛舞。眾雷神莫能相近。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 149
    "line_end": 149
    "source_sequence": 13
  "translation_ja": "二人は一つところで戦い、まだ勝負がつかなかった。佑聖真君は早くも配下の将を使いに出し、雷府へ文を届けて、三十六人の雷将をそろって呼び寄せた。雷将たちは斉天大聖を真ん中に囲み、おのおの猛威を振るって激しく戦う。斉天大聖は少しも恐れず、如意金箍棒一本で左を遮り、右を払い、後ろを防ぎ、前を迎え撃った。やがて雷将たちの刀・槍・剣・戟、鞭・簡・撾・鎚、鉞・斧・金瓜、旄鎌・月鏟が、ひっきりなしに襲いかかるのを見ると、身を揺すって三つの頭と六本の腕に変じた。如意金箍棒を振って三本にし、六本の手で操ると、まるで糸車のようにくるくる回り、包囲の真ん中で舞い飛ぶ。雷神たちは誰も近づけなかった。まことに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-014"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": "圓陀陀，光灼灼，亙古常存人怎學？入火不能焚，入水何曾溺？光明一顆摩尼珠，劍戟刀槍傷不著。也能善，也能惡，眼前善惡憑他作。善時成佛與成仙，惡處披毛並帶角。無窮變化鬧天宮，雷將神兵不可捉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 150
    "line_end": 150
    "source_sequence": 14
  "translation_ja": |-
    丸々として、光はまばゆい。太古から変わらずあるものを、人はいかに学べよう。
    火に入っても焼けず、水に入っても、いつ溺れたことがあろう。
    光り輝く一粒の摩尼珠、剣も戟も刀も槍も傷つけられない。
    善にもなり、悪にもなる。目の前の善悪は、その者のなすがまま。
    善くあれば仏となり仙人となり、悪くあれば毛をまとい角を生やす。
    尽きぬ変化で天宮を騒がせ、雷将も神兵も捕らえられない。
  "translation_status": "draft"
- "id": "xy-ch07-015"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時眾神把大聖攢在一處，卻不能近身，亂嚷亂鬥。早驚動玉帝，遂傳旨著遊奕靈官同翊聖真君上西方請佛老降伏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 152
    "line_end": 152
    "source_sequence": 15
  "translation_ja": "そのとき神々は斉天大聖を一か所に取り囲んでいたが、近寄ることができず、叫びながら入り乱れて戦っていた。騒ぎは早くも玉帝の耳に入り、玉帝は遊奕霊官と翊聖真君に、西方へ行って如来を招き、降伏させてもらうよう命じた。"
  "translation_status": "draft"
- "id": "xy-ch07-016"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那二聖得了旨，徑到靈山勝境雷音寶剎之前，對四金剛、八菩薩禮畢，即煩轉達。眾神隨至寶蓮臺下啟知，如來召請。二聖禮佛三匝，侍立臺下。如來問：「玉帝何事，煩二聖下臨？」二聖即啟道：「向時花果山產一猴，在那裡弄神通，聚眾猴攪亂世界。玉帝降招安旨，封為弼馬溫，他嫌官小反去。當遣李天王、哪吒太子擒拿未獲，復招安他，封做齊天大聖，先有官無祿。著他代管蟠桃園，他即偷桃；又走至瑤池，偷殽、偷酒，攪亂大會；仗酒又暗入兜率宮，偷老君仙丹，反出天宮。玉帝復遣十萬天兵，亦不能收伏。後觀世音舉二郎真君同他義兄弟追殺，他變化多端，虧老君拋金鋼琢打中，二郎方得拿住。解赴御前，即命斬之，刀砍斧剁，火燒雷打，俱不能傷。老君奏准領去，以火鍛煉。四十九日開鼎，他卻又跳出八卦爐，打退天丁，徑入通明殿裡，靈霄殿外。被佑聖真君的佐使王靈官擋住苦戰，又調三十六員雷將把他困在垓心，終不能相近。事在緊急，因此玉帝特請如來救駕。」如來聞說，即對眾菩薩道：「汝等在此穩坐法堂，休得亂了禪位，待我煉魔救駕去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 153
    "line_end": 153
    "source_sequence": 16
  "translation_ja": |-
    遊奕霊官と翊聖真君は勅命を受け、まっすぐ霊山の勝境、雷音宝刹の前に至った。四金剛と八菩薩に礼をして、取り次ぎを頼む。神々が宝蓮台の下へ進んで知らせると、如来は召し入れた。遊奕霊官と翊聖真君は如来を三たび巡って礼拝し、台の下に控えた。
    如来「玉帝に何事があって、お二人をここまでお遣わしになったのですか。」
    遊奕霊官と翊聖真君「かつて花果山に一匹の猿が生まれ、神通を振るい、猿どもを集めて世を乱しました。玉帝は招安の勅命を下して弼馬温に任じましたが、官位が低いと不満を抱き、背いて去りました。李天王と哪吒太子を捕らえに遣わしても捕まらず、再び招安して斉天大聖に封じ、初めは官名だけで俸禄は与えませんでした。蟠桃園を預けると桃を盗み、瑤池へ出向いて料理や酒を盗み、大会をめちゃくちゃにしました。酒の勢いでこっそり兜率宮にも入り、老君の仙丹を盗み、天宮を逃げ出したのです。玉帝が改めて十万の天兵を遣わしても、降伏させられませんでした。その後、観世音が二郎真君を推挙し、義兄弟たちと追わせましたが、猿は自在に変化しました。老君が投げた金鋼琢が当たったおかげで、ようやく二郎があの猿を捕らえたのです。御前へ引き立て、ただちに処刑を命じましたが、刀も斧も、火も雷も、傷をつけられません。老君が許しを得て引き取り、火で練りました。四十九日たって炉を開けると、また八卦炉から跳び出し、天兵を打ち払い、そのまま通明殿の中、霊霄宝殿の外へ入ってきました。佑聖真君の補佐役の王霊官が食い止めて激しく戦い、さらに三十六人の雷将を呼んで囲みましたが、どうしても近寄れません。事態は急を要するため、玉帝は特に如来をお招きして、お救いいただきたいとのことでございます。」
    如来は聞き終えると、菩薩たちに告げた。
    如来「お前たちはここで法堂に静かに座り、禅の座を乱してはならぬ。私が魔を練り伏せ、玉帝を救って戻るまで待つのだ。」
  "translation_status": "draft"
- "id": "xy-ch07-017"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    如來即喚阿儺、迦葉二尊者相隨，離了雷音，徑至靈霄門外。忽聽得喊聲振耳，乃三十六員雷將圍困著大聖哩。佛祖傳法旨：「教雷將停息干戈，放開營所，叫那大聖出來，等我問他有何法力。」眾將果退。大聖也收了法象，現出原身近前，怒氣昂昂，厲聲高叫道：「你是那方善士，敢來止住刀兵問我？」如來笑道：「我是西方極樂世界釋迦牟尼尊者。南無阿彌陀佛！今聞你猖狂村野，屢反天宮，不知是何方生長，何年得道，為何這等暴橫？」大聖道：「我本：
    天地生成靈混仙，花果山中一老猿。
    水簾洞裡為家業，拜友尋師悟太玄。
    煉就長生多少法，學來變化廣無邊。
    因在凡間嫌地窄，立心端要住瑤天。
    靈霄寶殿非他久，歷代人王有分傳。
    強者為尊該讓我，英雄只此敢爭先。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 154
    "line_end": 161
    "source_sequence": 17
  "translation_ja": |-
    如来は阿儺と迦葉の二尊者を呼んで従え、雷音宝刹を出ると、霊霄宝殿の門外へ直行した。突然、耳を震わせる叫び声が聞こえた。三十六人の雷将が斉天大聖を取り囲んでいるのである。如来は法旨を伝えた。
    如来「雷将たちに武器を収め、包囲を解かせよ。あの大聖を呼び出し、どのような法力があるのか、私に尋ねさせなさい。」
    将たちは果たして退いた。斉天大聖も神変の姿を収め、もとの姿で前へ進み、怒気をみなぎらせて鋭く叫んだ。
    斉天大聖「お前はどこの善士だ。よくも戦いを止め、俺にものを尋ねようとするな！」
    如来は笑って答えた。
    如来「私は西方極楽世界の釈迦牟尼尊者だ。南無阿弥陀仏。お前はひどく荒々しく無作法で、幾度も天宮に背いたと聞く。どこで育ち、いつ道を得て、なぜそのように横暴に振る舞うのだ。」
    斉天大聖「俺はもともと、
    天地が生んだ霊妙混元の仙、花果山に住む一匹の老猿。
    水簾洞をわが家とし、友を訪ね師を探して、奥深い道を悟った。
    長生きの術を数多く練り上げ、果てしなく広い変化の技を学んだ。
    人の世は狭苦しいと思い、どうしても美しい天に住もうと心に決めた。
    霊霄宝殿はいつまでもあいつのものじゃない。歴代の王にも譲り伝える順がある。
    強い者が尊ばれるなら、俺に譲るべきだ。先を争う勇気のある英雄は、この俺だ！」
  "translation_status": "draft"
- "id": "xy-ch07-018"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛祖聽言，呵呵冷笑道：「你那廝乃是個猴子成精，焉敢欺心，要奪玉皇上帝尊位？他自幼修持，苦歷過一千七百五十劫。每劫該十二萬九千六百年，你算他該多少年數，方能享受此無極大道？你那個初世為人的畜生，如何出此大言？不當人子，不當人子，折了你的壽算。趁早皈依，切莫胡說。但恐遭了毒手，性命頃刻而休，可惜了你的本來面目。」大聖道：「他雖年幼修長，也不應久占在此。常言道：『皇帝輪流做，明年到我家。』只教他搬出去，將天宮讓與我，便罷了；若還不讓，定要攪攘，永不清平。」佛祖道：「你除了長生變化之法，再有何能，敢占天宮勝境？」大聖道：「我的手段多哩：我有七十二般變化，萬劫不老長生；會駕觔斗雲，一縱十萬八千里。如何坐不得天位？」佛祖道：「我與你打個賭賽：你若有本事，一觔斗打出我這右手掌中，算你贏，再不用動刀兵，苦爭戰，就請玉帝到西方居住，把天宮讓你；若不能打出手掌，你還下界為妖，再修幾劫，卻來爭吵。」那大聖聞言，暗笑道：「這如來十分好獃。我老孫一觔斗去十萬八千里，他那手掌方圓不滿一尺，如何跳不出去？」急發聲道：「既如此說，你可做得主張？」佛祖道：「做得，做得。」伸開右手，卻似個荷葉大小。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 162
    "line_end": 162
    "source_sequence": 18
  "translation_ja": |-
    如来は聞くと、はははと冷たく笑った。
    如来「お前はただの猿が妖仙になったもの。どうして良心を欺き、玉皇上帝の尊い位を奪おうとするのだ。あの方は幼いころから修行し、千七百五十劫もの苦しみを経ておられる。一劫は十二万九千六百年だ。いったい何年を経て、この無極の大道を享受しておられるのか、計算してみるがよい。初めて人らしくなったばかりの畜生の分際で、よくもそんな大口をたたける。心得違いも甚だしい。そんなことでは寿命を削るぞ。早く帰依し、たわごとを言うな。手ひどい目に遭って、たちまち命を失い、本来の真性を損なっては惜しいことだ。」
    斉天大聖「あいつが幼いころから長く修行したからって、いつまでも居座っていいはずはない。『皇帝の役は持ち回り、来年は俺の家の番』というじゃないか。あいつが出ていって天宮を俺に譲れば、それで済む。譲らないなら、必ず騒ぎを起こして、いつまでも穏やかにはさせないぞ。」
    如来「長生きと変化の術のほかに、どんな力があって、天宮の勝境を占めようというのだ。」
    斉天大聖「俺の技はたくさんある。七十二の変化を身につけ、万劫を経ても老いずに生きる。筋斗雲も操れ、ひと跳びで十万八千里だ。なぜ天の位に座れない？」
    如来「では私と賭けをしよう。力があるなら、ひと跳びでこの右の手のひらから出てみるがよい。出られればお前の勝ちだ。もう武器を交え、苦しい戦いをする必要はない。玉帝には西方へ移っていただき、天宮をお前に譲ろう。出られなければ、下界で妖怪に戻り、もう幾劫か修行してから争いに来るのだ。」
    斉天大聖は聞くと、ひそかに笑って思った。
    斉天大聖「この如来は、まったく間抜けだ。俺はひと跳び十万八千里。あいつの手のひらは一尺にも足りないのに、跳び出せないはずがあるか。」
    すぐに声を上げた。
    斉天大聖「そう言うからには、お前が決めていいんだな？」
    如来「決められるとも。」
    如来が広げた右手は、蓮の葉ほどの大きさだった。
  "translation_status": "draft"
- "id": "xy-ch07-019"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那大聖收了如意棒，抖擻神威，將身一縱，站在佛祖手心裡，卻道聲：「我出去也。」你看他一路雲光，無形無影去了。佛祖慧眼觀看，見那猴王風車子一般相似不住，只管前進。大聖行時，忽見有五根肉紅柱子，撐著一股青氣。他道：「此間乃盡頭路了。這番回去，如來作證，靈霄宮定是我坐也。」又思量說：「且住，等我留下些記號，方好與如來說話。」拔下一根毫毛，吹口仙氣，叫：「變！」變作一管濃墨雙毫筆，在那中間柱子上寫一行大字云：「齊天大聖，到此一遊。」寫畢，收了毫毛。又不莊尊，卻在第一根柱子根下撒了一泡猴尿。翻轉觔斗雲，徑回本處，站在如來掌內道：「我已去，今來了。你教玉帝讓天宮與我。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 163
    "line_end": 163
    "source_sequence": 19
  "translation_ja": |-
    斉天大聖は如意金箍棒を収め、神威を奮い起こして身を躍らせ、如来の手のひらに立った。
    斉天大聖「さあ、出ていくぞ！」
    見よ、雲の光を連ね、姿も影も見えなくなった。如来が慧眼で見ると、斉天大聖は風車のように止まることなく、ひたすら前へ進んでいた。やがて斉天大聖の前に、青い気を支える肉色の赤い柱が五本現れた。
    斉天大聖「ここが道の果てだな。今度戻れば、如来が証人だ。霊霄宝殿に座るのは、間違いなく俺だ。」
    さらに考えて言った。
    斉天大聖「待てよ、印を残してからにしよう。そのほうが如来に話しやすい。」
    毛を一本抜き、仙気を吹きかけて叫んだ。
    斉天大聖「変われ！」
    毛は濃い墨を含んだ双毫の筆となった。真ん中の柱に、大きく一行、「斉天大聖、ここに遊ぶ」と書きつける。書き終えると毛を収めた。そのうえ行儀も悪く、最初の柱の根元に猿の小便をひとしきり放った。筋斗雲を返して元のところへ戻り、如来の手のひらに立って告げた。
    斉天大聖「行って帰ってきたぞ。玉帝に天宮を俺へ譲らせろ。」
  "translation_status": "draft"
- "id": "xy-ch07-020"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來罵道：「我把你這個尿精猴子，你正好不曾離了我掌哩。」大聖道：「你是不知。我去到天盡頭，見五根肉紅柱，撐著一股青氣，我留個記在那裡，你敢和我同去看麼？」如來道：「不消去，你只自低頭看看。」那大聖睜圓火眼金睛，低頭看時，原來佛祖右手中指寫著「齊天大聖，到此一遊」。大指丫裡，還有些猴尿臊氣。大聖吃了一驚道：「有這等事？有這等事？我將此字寫在撐天柱子上，如何卻在他手指上？莫非有個未卜先知的法術？我決不信，不信。等我再去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 165
    "line_end": 165
    "source_sequence": 20
  "translation_ja": |-
    如来はののしった。
    如来「この小便猿め。お前は私の手のひらを、一度も離れてはいないぞ。」
    斉天大聖「お前は知らないんだ。俺は天の果てへ行って、青い気を支える肉色の赤い柱を五本見た。そこに印を残してきたんだ。一緒に見に行く勇気があるか？」
    如来「行くまでもない。自分で下を見てみなさい。」
    斉天大聖が火眼金睛を見開いて下を見ると、如来の右手の中指には、「斉天大聖、ここに遊ぶ」と書いてある。親指の股には、猿の小便の臭いまで残っていた。斉天大聖は驚いて言った。
    斉天大聖「そんなことがあるか。そんなことが！　俺は天を支える柱に書いたんだぞ。どうしてこいつの指にあるんだ？　占わなくても先のことが分かる術でも持っているのか。信じない、断じて信じないぞ。もう一度行ってくる！」
  "translation_status": "draft"
- "id": "xy-ch07-021"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    好大聖，急縱身又要跳出。被佛祖翻掌一撲，把這猴王推出西天門外，將五指化作金、木、水、火、土五座聯山，喚名「五行山」，輕輕的把他壓住。眾雷神與阿儺、迦葉一個個合掌稱揚道：「善哉，善哉！
    當年卵化學為人，立志修行果道真。
    萬劫無移居勝境，一朝有變散精神。
    欺天罔上思高位，凌聖偷丹亂大倫。
    惡貫滿盈今有報，不知何日得翻身。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 166
    "line_end": 171
    "source_sequence": 21
  "translation_ja": |-
    さすがは斉天大聖、すぐさま身を躍らせ、また跳び出そうとした。すると如来は手のひらを返して押しつけ、斉天大聖を西天門の外へ押し出した。五本の指を金・木・水・火・土の五つの連なる山に変え、「五行山」と名づけて、軽々とその下に押さえつけた。雷神たちと阿儺・迦葉は、一人ずつ合掌してたたえた。
    雷神たちと阿儺・迦葉「善いかな、善いかな！
    かつて卵から生まれて人を学び、修行を志して、真の道を得た。
    万劫にわたり変わらず勝境に住み、ひとたび変事が起こり、精気を散らした。
    天と主君を欺いて高位を望み、聖を侮り丹を盗んで、大いなる秩序を乱した。
    悪業は満ち、今こそ報いを受けた。いつ再び身を起こせるのだろう。」
  "translation_status": "draft"
- "id": "xy-ch07-022"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來佛祖殄滅了妖猴，即喚阿儺、迦葉同轉西方極樂世界。時有天蓬、天佑急出靈霄寶殿道：「請如來少待，我主大駕來也。」佛祖聞言，回首瞻仰。須臾，果見八景鸞輿，九光寶蓋，聲奏玄歌妙樂，詠哦無量神章，散寶花，噴真香，直至佛前謝曰：「多蒙大法收殄妖邪，望如來少停一日，請諸仙做一會筵奉謝。」如來不敢違悖，即合掌謝道：「老僧承大天尊宣命來此，有何法力？還是天尊與眾神洪福。敢勞致謝？」玉帝傳旨，即著雷部眾神，分頭請三清、四御、五老、六司、七元、八極、九曜、十都、千真、萬聖來此赴會，同謝佛恩。又命四大天師、九天仙女，大開玉京金闕、太玄寶宮、洞陽玉館，請如來高座七寶靈臺，調設各班坐位，安排龍肝鳳髓，玉液蟠桃。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 173
    "line_end": 173
    "source_sequence": 22
  "translation_ja": |-
    如来は斉天大聖を鎮圧すると、阿儺と迦葉を呼び、西方極楽世界へ帰ろうとした。そこへ天蓬と天佑が霊霄宝殿から急いで出てきた。
    天蓬と天佑「如来、少々お待ちください。主君がお越しになります。」
    如来が聞いて振り返ると、まもなく八景の鸞輿、九光の宝蓋が現れた。奥妙な歌と美しい楽が奏でられ、無量の神聖な詩章が唱えられ、宝の花が散らされ、まことの香りが漂う。玉帝は如来の前へ来て謝意を述べた。
    玉帝「偉大な法力で妖邪を収めていただき、感謝する。如来にはもう一日とどまっていただきたい。仙人たちを招いて宴を開き、お礼を申し上げよう。」
    如来は逆らわず、合掌して答えた。
    如来「老僧は大天尊のお召しを受けて来ただけで、何ほどの法力がありましょう。天尊と神々の大きな福徳のおかげです。お礼など、お手を煩わせるには及びません。」
    玉帝は命を下し、雷部の神々に手分けをして、三清・四御・五老・六司・七元・八極・九曜・十都、千の真人、万の聖者をここへ招き、ともに仏恩へ感謝させた。また四大天師と九天仙女に命じ、玉京金闕、太玄宝宮、洞陽玉館を大きく開き、如来を七宝の霊台の上座へ迎えさせた。各組の席を整え、竜の肝や鳳凰の髄、玉液の美酒や蟠桃を並べた。
  "translation_status": "draft"
- "id": "xy-ch07-023"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不一時，那玉清元始天尊、上清靈寶天尊、太清道德天尊、五炁真君、五斗星君、三官四聖、九曜真君、左輔、右弼、天王、哪吒，玄虛一應靈通，對對旌旗，雙雙幡蓋，都捧著明珠異寶，壽果奇花，向佛前拜獻曰：「感如來無量法力，收伏妖猴。蒙大天尊設宴，呼喚我等皆來陳謝。請如來將此會立一名如何？」如來領眾神之託曰：「今欲立名，可作個安天大會。」各仙老異口同聲，俱道：「好個『安天大會』！好個『安天大會』！」言訖，各坐座位，走斝傳觴，簪花鼓瑟，果好會也。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 174
    "line_end": 174
    "source_sequence": 23
  "translation_ja": |-
    ほどなく、玉清元始天尊、上清霊宝天尊、太清道徳天尊、五炁真君、五斗星君、三官四聖、九曜真君、左輔、右弼、李天王、哪吒、玄妙な世界のあらゆる霊神たちがやって来た。旗を対に、幡と蓋を組にして、皆、真珠や珍宝、長寿の果実や不思議な花を捧げ、如来の前で拝礼して献じた。
    神仙たち「如来の限りない法力で、妖猿を降伏させてくださり、感謝申し上げます。大天尊が宴を設け、私どもをお召しになったので、お礼に参りました。如来、この宴に名をおつけいただけませんか。」
    如来は神々の頼みを受けた。
    如来「名をつけるなら、安天大会としましょう。」
    神仙たちは口をそろえた。
    神仙たち「よい名です、安天大会！　よい名です、安天大会！」
    言い終えると、それぞれ席に着き、酒器と杯を回し、花をかざして瑟を奏でた。まことに見事な宴である。証しの詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-024"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    宴設蟠桃猴攪亂，安天大會勝蟠桃。
    龍旗鸞輅祥光藹，寶節幢幡瑞氣飄。
    仙樂玄歌音韻美，鳳簫玉管響聲高。
    瓊香繚繞群仙集，宇宙清平賀聖朝。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 176
    "line_end": 179
    "source_sequence": 24
  "translation_ja": |-
    蟠桃の宴は猿に乱されたが、安天大会は蟠桃の宴にまさる。
    竜の旗と鸞の車に吉祥の光が満ち、宝の節、幢と幡には瑞気が漂う。
    仙楽と奥妙な歌は調べ美しく、鳳凰の簫と玉の笛は高く響く。
    美しい香りが巡り、仙人たちが集う。天地の平穏を得て、聖なる朝廷を祝う。
  "translation_status": "draft"
- "id": "xy-ch07-025"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾皆暢然喜會，只見王母娘娘引一班仙子、仙娥、美姬、美女飄飄蕩蕩舞向佛前，施禮曰：「前被妖猴攪亂蟠桃一會，請眾仙眾佛俱成功。今蒙如來大法鍊鎖頑猴，喜慶『安天大會』，無物可謝，今是我淨手親摘大株蟠桃數顆奉獻。」真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 181
    "line_end": 181
    "source_sequence": 25
  "translation_ja": |-
    皆が心ゆくまで宴を楽しんでいると、王母が仙子、仙娥、美しい姫や女たちを率い、ひらひらと舞いながら如来の前へ来て礼をした。
    王母「先には妖猿が蟠桃の宴を乱しましたが、お招きした仙人、仏の皆さまは、ことごとく功を成されました。今、如来の大法であの頑固な猿をつなぎ止め、めでたく安天大会を祝うことができました。お礼の品もございませんが、本日は手を清め、私が大きな木から摘んだ蟠桃を数個、お捧げいたします。」
    まことに、こうである。
  "translation_status": "draft"
- "id": "xy-ch07-026"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    半紅半綠噴甘香，艷麗仙根萬載長。
    堪笑武陵源上種，爭如天府更奇強。
    紫紋嬌嫩寰中少，緗核清甜世莫雙。
    延壽延年能易體，有緣食者自非常。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 183
    "line_end": 186
    "source_sequence": 26
  "translation_ja": |-
    半ば紅、半ば緑で甘い香りを放ち、艶やかな仙の根は万年も育つ。
    武陵源に植わる桃など笑うべし。どうして天の府の、さらに珍しく優れた桃に及ぼう。
    紫の筋の柔らかな実は世にもまれ、淡黄の核を持つ清らかな甘さに並ぶものはない。
    寿命を延ばし、体も変える。縁あって食べる者は、おのずと並の者ではなくなる。
  "translation_status": "draft"
- "id": "xy-ch07-027"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛祖合掌向王母謝訖。王母又著仙姬、仙子唱的唱，舞的舞。滿會群仙又皆賞讚。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 187
    "line_end": 187
    "source_sequence": 27
  "translation_ja": "如来は合掌して王母に礼を言った。王母はさらに、仙姫や仙子に歌わせ、舞わせた。満座の仙人たちも、皆その見事さをたたえた。まさに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-028"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    縹緲天香滿座，繽紛仙蕊仙花。玉京金闕大榮華。異品奇珍無價。
    對對與天齊壽，雙雙萬劫增加。桑田滄海任更差。他自無驚無訝。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 189
    "line_end": 190
    "source_sequence": 28
  "translation_ja": |-
    かすかな天の香りが満座に漂い、仙の花もしべも、色とりどりに咲き乱れる。玉京金闕の大いなる栄華。珍品、奇宝に値はつけられない。
    二人ずつ天に等しい長寿を享け、組ごとに万劫を増し加える。桑畑が海になり、海が桑畑になろうとも、彼らは驚きも怪しみもしない。
  "translation_status": "draft"
- "id": "xy-ch07-029"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王母正著仙姬、仙子歌舞，觥籌交錯，不多時，忽又聞得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 192
    "line_end": 192
    "source_sequence": 29
  "translation_ja": "王母が仙姫や仙子を歌い舞わせ、杯と酒の数取り棒が入り交じるうち、ほどなく、ふとまた異香が漂った。"
  "translation_status": "draft"
- "id": "xy-ch07-030"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一陣異香來鼻噢，驚動滿堂星與宿。
    天仙佛祖把杯停，各各擡頭迎目候。
    霄漢中間現老人，手捧靈芝飛藹繡。
    葫蘆藏蓄萬年丹，寶籙名書千紀壽。
    洞裡乾坤任自由，壺中日月隨成就。
    遨遊四海樂清閑，散淡十洲容輻輳。
    曾赴蟠桃醉幾遭，醒時明月還依舊。
    長頭大耳短身軀，南極之方稱老壽。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 194
    "line_end": 201
    "source_sequence": 30
  "translation_ja": |-
    ひとしきり不思議な香りが鼻に届き、満堂の星々の神を驚かせる。
    天仙も如来も杯を止め、皆、顔を上げて迎えようと見守る。
    天空に老人が現れ、手には霊芝を捧げ、霞と錦をひるがえす。
    瓢箪には万年の丹薬を蓄え、宝の名簿には千紀の寿命が記される。
    洞の内の天地では気ままに過ごし、壺の中の日月も思いのまま。
    四海を遊び巡って清閑を楽しみ、悠々と十洲を行き交う。
    蟠桃の宴で何度酔ったことか。覚めれば明月は、もとのまま。
    長い頭、大きな耳、短い体。南極の方角で、長寿の翁と呼ばれる。
  "translation_status": "draft"
- "id": "xy-ch07-031"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "壽星又到。見玉帝禮畢，又見如來，申謝曰：「始聞那妖猴被老君引至兜率宮鍛煉，以為必致平安，不期他又反出。幸如來善伏此怪，設宴奉謝，故此聞風而來。更無他物可獻，特具紫芝瑤草、碧藕金丹奉上。」詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 203
    "line_end": 203
    "source_sequence": 31
  "translation_ja": |-
    寿星もやって来た。玉帝への礼を済ませ、如来にも会って謝意を述べた。
    寿星「あの妖猿が老君に連れられ、兜率宮で練られると初めに聞いたときは、必ず平穏になると思いました。ところが、また背いて出てきたとは。幸い如来が見事に降伏させられ、お礼の宴が開かれると伺い、参った次第です。ほかに差し上げるものもございませんが、紫の霊芝と瑤草、碧の蓮根と金丹を用意して、お捧げいたします。」
    詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-032"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    碧藕金丹奉釋迦，如來萬壽若恆沙。
    清平永樂三乘錦，康泰長生九品花。
    無相門中真法主，色空天上是仙家。
    乾坤大地皆稱祖，丈六金身福壽賒。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 205
    "line_end": 208
    "source_sequence": 32
  "translation_ja": |-
    碧の蓮根と金丹を釈迦に捧げる。如来の長寿は恒河の砂のように限りない。
    平穏と永い楽しみは三乗の錦、健やかな長生きは九品の花。
    姿なき門のまことの法主、色と空の天の仙家である。
    天地のすべてが祖とあがめ、丈六の金身に福と寿命は果てしない。
  "translation_status": "draft"
- "id": "xy-ch07-033"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來忻然領謝。壽星得座，依然走斝傳觴。只見赤腳大仙又至，向玉帝前頫顖禮畢，又對佛祖謝道：「深感法力，降伏妖猴。無物可以表敬，特具交梨二顆、火棗數枚奉獻。」詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 209
    "line_end": 209
    "source_sequence": 33
  "translation_ja": |-
    如来は喜んで受け取り、礼を言った。寿星も席に着き、再び杯が回り始める。そこへ赤脚大仙も到着し、玉帝の前で頭を垂れて礼をし、如来に謝意を述べた。
    赤脚大仙「法力で妖猿を降伏させてくださり、深く感謝いたします。敬意を表す品もございませんが、交梨を二つ、火棗をいくつか用意して、お捧げいたします。」
    詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-034"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大仙赤腳棗梨香，敬獻彌陀壽算長。
    七寶蓮臺山樣穩，千金花座錦般粧。
    壽同天地言非謬，福比洪波話豈狂。
    福壽如期真個是，清閑極樂那西方。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 211
    "line_end": 214
    "source_sequence": 34
  "translation_ja": |-
    赤脚大仙の棗と梨はかぐわしく、弥陀に敬って献じ、長寿を願う。
    七宝の蓮台は山のように揺るがず、千金に値する花座は錦のように飾られる。
    寿命が天地に等しいというのは偽りでなく、福が大波に比されるというのも大言ではない。
    福寿は願いのとおり、まことそのもの。西方こそ清閑な極楽の地。
  "translation_status": "draft"
- "id": "xy-ch07-035"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來又稱謝了，叫阿儺、迦葉將各所獻之物，一一收起，方向玉帝前謝宴。眾各酩酊。只見個巡視靈官來報道：「那大聖伸出頭來了。」佛祖道：「不妨，不妨。」袖中只取出一張帖子，上有六個金字：「唵嘛呢叭咪吽」。遞與阿儺，叫貼在那山頂上。這尊者即領帖子，拿出天門，到那五行山頂上，緊緊的貼在一塊四方石上，那座山即生根合縫。可運用呼吸之氣，手兒爬出，可以搖掙搖掙。阿儺回報道：「已將帖子貼了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 216
    "line_end": 216
    "source_sequence": 35
  "translation_ja": |-
    如来はまた礼を言い、阿儺と迦葉に、皆から献じられた品を一つずつ収めさせ、それから玉帝へ宴の礼を述べた。一同はすっかり酔っていた。そこへ巡視霊官が報告に来た。
    巡視霊官「あの大聖が頭を出しました。」
    如来「かまわぬ、かまわぬ。」
    如来は袖から札を一枚取り出した。そこには「唵嘛呢叭咪吽」という金色の六文字があった。阿儺に渡し、山頂に貼るよう命じる。阿儺は札を受け取り、天門から出て、五行山の頂へ至り、四角い石にしっかりと貼りつけた。すると山は根を生やし、継ぎ目が閉じた。それでも斉天大聖は息をすることができ、手を外へ這わせ、少しは身を揺すってもがくこともできた。阿儺は戻って報告した。
    阿儺「札を貼ってまいりました。」
  "translation_status": "draft"
- "id": "xy-ch07-036"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來即辭了玉帝眾神，與二尊者出天門之外。又發一個慈悲心，念動真言咒語，將五行山召一尊土地神祗，會同五方揭諦，居住此山監押。但他饑時，與他鐵丸子吃；渴時，與他溶化的銅汁飲。待他災愆滿日，自有人救他。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 218
    "line_end": 218
    "source_sequence": 36
  "translation_ja": "如来は玉帝と神々に別れを告げ、二尊者とともに天門を出た。そしてまた慈悲の心を起こし、真言の呪文を唱え、五行山の土地神を一柱呼び出した。五方掲諦とともにこの山に住んで、斉天大聖を監視させるのである。腹をすかせたら鉄の丸を食べさせ、喉が渇いたら溶かした銅の汁を飲ませる。罪の災いを償い終える日には、おのずと救い出す者が現れるという。まさに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-037"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    妖猴大膽反天宮，卻被如來伏手降。
    渴飲溶銅捱歲月，饑餐鐵彈度時光。
    天災苦困遭磨折，人事淒涼喜命長。
    若得英雄重展掙，他年奉佛上西方。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 219
    "line_end": 222
    "source_sequence": 37
  "translation_ja": |-
    妖猿は大胆にも天宮に背いたが、如来の手に降された。
    渇けば溶けた銅を飲んで歳月に耐え、飢えれば鉄の丸を食べて時を過ごす。
    天の災いに苦しめられ、折りさいなまれ、人の世との縁も寂しいが、命の長さを喜ぶ。
    もし英雄が再び身を起こせるなら、いつの日か仏に仕えて西方へ向かうだろう。
  "translation_status": "draft"
- "id": "xy-ch07-038"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "又詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 224
    "line_end": 224
    "source_sequence": 38
  "translation_ja": "さらに詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch07-039"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    伏逞豪強大勢興，降龍伏虎弄乖能。
    偷桃偷酒遊天府，受籙承恩在玉京。
    惡貫滿盈身受困，善根不絕氣還昇。
    果然脫得如來手，且待唐朝出聖僧。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 226
    "line_end": 229
    "source_sequence": 39
  "translation_ja": |-
    勇力を振るい、大きな勢いを起こし、竜を降し虎を伏せて、利口ぶった技を見せた。
    桃を盗み、酒を盗んで天の府を遊び回り、玉京では名簿に載り、恩を受けた。
    悪業が満ちて身を閉じ込められても、善根は絶えず、気はなお昇る。
    本当に如来の手から逃れるには、唐の世に聖僧が現れるのを待たねばならない。
  "translation_status": "draft"
- "id": "xy-ch07-040"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後何年何月方滿災殃，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 231
    "line_end": 231
    "source_sequence": 40
  "translation_ja": "さて、この先、何年何月になれば、災いの日々を終えられるのだろうか。続きは次回のお話に。"
  "translation_status": "draft"

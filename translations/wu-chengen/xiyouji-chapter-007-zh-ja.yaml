    "source_sequence": 9
  "translation_ja": "さらに詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch07-010"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    猿猴道體配人心，心即猿猴意思深。
    大聖齊天非假論，官封弼馬豈知音。
    馬猿合作心和意，緊縛牢拴莫外尋。
    萬相歸真從一理，如來同契住雙林。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 141
    "line_end": 144
    "source_sequence": 10
  "translation_ja": |-
    猿の道体（どうたい）は人の心に当たる。心こそ猿とは、意味の深いこと。
    天に等しい大聖とは偽りではない。弼馬（ひつば）の官を授けるとは、真価を知っていたろうか。
    馬と猿は意と心に重なる。固く縛ってつなぎ、外に求めるな。
    あらゆる相（そう）は一つの理に従って真に帰る。如来（にょらい）と同じ悟りを得て、双林（そうりん）に住むのだ。
  "translation_status": "draft"
- "id": "xy-ch07-011"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一番，那猴王不分上下，使鐵棒東打西敵，更無一神可擋，只打到通明殿裡，靈霄殿外。幸有佑聖真君的佐使王靈官執殿，他看大聖縱橫，掣金鞭近前擋住道：「潑猴何往？有吾在此，切莫猖狂。」這大聖不由分說，舉棒就打；那靈官鞭起相迎。兩個在靈霄殿前廝渾一處，好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 145
    "line_end": 145
    "source_sequence": 11
  "translation_ja": |-
    今度の斉天大聖は上下の分もかまわず、鉄棒を振るって東へ西へと打ちかかり、止められる神は一人もいない。そのまま通明殿（つうめいでん）の中、霊霄宝殿（れいしょうほうでん）の外まで攻め込んだ。幸い、佑聖真君（ゆうせいしんくん）の補佐役である王霊官（おうれいかん）が殿を守っていた。斉天大聖が縦横に暴れ回るのを見ると、金鞭（きんべん）を抜いて前に立ちふさがった。
    王霊官「暴れ猿、どこへ行く！　私がここにいるからには、勝手はさせぬ。」
    斉天大聖は問答無用と棒を振り上げて打ち、王霊官も鞭（べん）を上げて迎え撃つ。二人は霊霄宝殿の前で入り乱れた。何という戦い。
  "translation_status": "draft"
- "id": "xy-ch07-012"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": "赤膽忠良名譽大，欺天誑上聲名壞。一低一好幸相持，豪傑英雄同賭賽。鐵棒兇，金鞭快，正直無私怎忍耐？這個是太乙雷聲應化尊，那個是齊天大聖猿猴怪。金鞭鐵棒兩家能，都是神宮仙器械。今日在靈霄寶殿弄威風，各展雄才真可愛。一個欺心要奪斗牛宮，一個竭力匡扶玄聖界。苦爭不讓顯神通，鞭棒往來無勝敗。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 147
    "line_end": 147
    "source_sequence": 12
  "translation_ja": |-
    忠誠一筋の善き者は誉れ高く、天を欺き主君をだます者は悪名高い。
    悪しき者と善き者、折よく相対し、豪傑と英雄が技を競う。
    鉄棒は猛々しく、金鞭は素早い。公明無私の者に、どうして黙認できよう。
    こちらは太乙雷声応化尊（たいいつらいせいおうげそん）、あちらは斉天大聖の猿の妖怪。
    金鞭も鉄棒も双方の得物、ともに神の宮の仙器（せんき）である。
    今日、霊霄宝殿で威を振るい、それぞれの雄才は、まことに見事。
    一人は良心を欺き斗牛（とぎゅう）の宮を奪おうとし、一人は力を尽くして玄聖（げんせい）の世界を支える。
    激しく争って譲らず神通を示し、鞭と棒が飛び交っても勝敗はつかない。
  "translation_status": "draft"
- "id": "xy-ch07-013"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個鬥在一處，勝敗未分。早有佑聖真君又差將佐發文到雷府，調三十六員雷將齊來，把大聖圍在垓心，各騁兇惡鏖戰。那大聖全無一毫懼色，使一條如意棒，左遮右擋，後架前迎。一時見那眾雷將的刀槍劍戟、鞭簡撾鎚、鉞斧金瓜、旄鐮月鏟來的甚緊，他即搖身一變：變做三頭六臂；把如意棒幌一幌，變作三條；六隻手使開三條棒，好便似紡車兒一般，滴流流，在那垓心裡飛舞。眾雷神莫能相近。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 149
    "line_end": 149
    "source_sequence": 13
  "translation_ja": "二人は一つところで戦い、まだ勝負がつかなかった。佑聖真君は早くも配下の将を使いに出し、雷府（らいふ）へ文を届けて、三十六人の雷将（らいしょう）をそろって呼び寄せた。雷将たちは斉天大聖を真ん中に囲み、おのおの猛威を振るって激しく戦う。斉天大聖は少しも恐れず、如意金箍棒一本で左を遮り、右を払い、後ろを防ぎ、前を迎え撃った。やがて雷将たちの刀・槍・剣・戟（げき）、鞭・簡（かん）・撾（た）・鎚（つい）、鉞（まさかり）・斧・金瓜（きんか）、旄鎌（ぼうれん）・月鏟（げっさん）が、ひっきりなしに襲いかかるのを見ると、身を揺すって三つの頭と六本の腕に変じた。如意金箍棒を振って三本にし、六本の手で操ると、まるで糸車のようにくるくる回り、包囲の真ん中で舞い飛ぶ。雷神たちは誰も近づけなかった。まことに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-014"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": "圓陀陀，光灼灼，亙古常存人怎學？入火不能焚，入水何曾溺？光明一顆摩尼珠，劍戟刀槍傷不著。也能善，也能惡，眼前善惡憑他作。善時成佛與成仙，惡處披毛並帶角。無窮變化鬧天宮，雷將神兵不可捉。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 150
    "line_end": 150
    "source_sequence": 14
  "translation_ja": |-
    丸々として、光はまばゆい。太古から変わらずあるものを、人はいかに学べよう。
    火に入っても焼けず、水に入っても、いつ溺れたことがあろう。
    光り輝く一粒の摩尼珠（まにしゅ）、剣も戟も刀も槍も傷つけられない。
    善にもなり、悪にもなる。目の前の善悪は、その者のなすがまま。
    善くあれば仏となり仙人となり、悪くあれば毛をまとい角を生やす。
    尽きぬ変化で天宮を騒がせ、雷将も神兵（しんぺい）も捕らえられない。
  "translation_status": "draft"
- "id": "xy-ch07-015"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時眾神把大聖攢在一處，卻不能近身，亂嚷亂鬥。早驚動玉帝，遂傳旨著遊奕靈官同翊聖真君上西方請佛老降伏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 152
    "line_end": 152
    "source_sequence": 15
  "translation_ja": "そのとき神々は斉天大聖を一か所に取り囲んでいたが、近寄ることができず、叫びながら入り乱れて戦っていた。騒ぎは早くも玉帝の耳に入り、玉帝は遊奕霊官（ゆうえきれいかん）と翊聖真君（よくせいしんくん）に、西方（さいほう）へ行って如来を招き、降伏させてもらうよう命じた。"
  "translation_status": "draft"
- "id": "xy-ch07-016"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那二聖得了旨，徑到靈山勝境雷音寶剎之前，對四金剛、八菩薩禮畢，即煩轉達。眾神隨至寶蓮臺下啟知，如來召請。二聖禮佛三匝，侍立臺下。如來問：「玉帝何事，煩二聖下臨？」二聖即啟道：「向時花果山產一猴，在那裡弄神通，聚眾猴攪亂世界。玉帝降招安旨，封為弼馬溫，他嫌官小反去。當遣李天王、哪吒太子擒拿未獲，復招安他，封做齊天大聖，先有官無祿。著他代管蟠桃園，他即偷桃；又走至瑤池，偷殽、偷酒，攪亂大會；仗酒又暗入兜率宮，偷老君仙丹，反出天宮。玉帝復遣十萬天兵，亦不能收伏。後觀世音舉二郎真君同他義兄弟追殺，他變化多端，虧老君拋金鋼琢打中，二郎方得拿住。解赴御前，即命斬之，刀砍斧剁，火燒雷打，俱不能傷。老君奏准領去，以火鍛煉。四十九日開鼎，他卻又跳出八卦爐，打退天丁，徑入通明殿裡，靈霄殿外。被佑聖真君的佐使王靈官擋住苦戰，又調三十六員雷將把他困在垓心，終不能相近。事在緊急，因此玉帝特請如來救駕。」如來聞說，即對眾菩薩道：「汝等在此穩坐法堂，休得亂了禪位，待我煉魔救駕去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 153
    "line_end": 153
    "source_sequence": 16
  "translation_ja": |-
    遊奕霊官と翊聖真君は勅命を受け、まっすぐ霊山（れいざん）の勝境（しょうきょう）、雷音宝刹（らいおんほうせつ）の前に至った。四金剛（しこんごう）と八菩薩（はちぼさつ）に礼をして、取り次ぎを頼む。神々が宝蓮台（ほうれんだい）の下へ進んで知らせると、如来は召し入れた。遊奕霊官と翊聖真君は如来を三たび巡って礼拝し、台の下に控えた。
    如来「玉帝に何事があって、お二人をここまでお遣わしになったのですか。」
    遊奕霊官と翊聖真君「かつて花果山（かかざん）に一匹の猿が生まれ、神通を振るい、猿どもを集めて世を乱しました。玉帝は招安（しょうあん）の勅命を下して弼馬温（ひつばおん）に任じましたが、官位が低いと不満を抱き、背いて去りました。李天王（りてんのう）と哪吒太子（なたたいし）を捕らえに遣わしても捕まらず、再び招安して斉天大聖に封じ、初めは官名だけで俸禄は与えませんでした。蟠桃園（ばんとうえん）を預けると桃を盗み、瑤池（ようち）へ出向いて料理や酒を盗み、大会をめちゃくちゃにしました。酒の勢いでこっそり兜率宮にも入り、老君（ろうくん）の仙丹を盗み、天宮を逃げ出したのです。玉帝が改めて十万の天兵を遣わしても、降伏させられませんでした。その後、観世音（かんぜおん）が二郎真君を推挙し、義兄弟たちと追わせましたが、猿は自在に変化しました。老君が投げた金鋼琢（こんごうたく）が当たったおかげで、ようやく二郎（じろう）があの猿を捕らえたのです。御前へ引き立て、ただちに処刑を命じましたが、刀も斧も、火も雷も、傷をつけられません。老君が許しを得て引き取り、火で練りました。四十九日たって炉を開けると、また八卦炉から跳び出し、天兵を打ち払い、そのまま通明殿の中、霊霄宝殿の外へ入ってきました。佑聖真君の補佐役の王霊官が食い止めて激しく戦い、さらに三十六人の雷将を呼んで囲みましたが、どうしても近寄れません。事態は急を要するため、玉帝は特に如来をお招きして、お救いいただきたいとのことでございます。」
    如来は聞き終えると、菩薩たちに告げた。
    如来「お前たちはここで法堂（はっとう）に静かに座り、禅の座を乱してはならぬ。私が魔を練り伏せ、玉帝を救って戻るまで待つのだ。」
  "translation_status": "draft"
- "id": "xy-ch07-017"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    如來即喚阿儺、迦葉二尊者相隨，離了雷音，徑至靈霄門外。忽聽得喊聲振耳，乃三十六員雷將圍困著大聖哩。佛祖傳法旨：「教雷將停息干戈，放開營所，叫那大聖出來，等我問他有何法力。」眾將果退。大聖也收了法象，現出原身近前，怒氣昂昂，厲聲高叫道：「你是那方善士，敢來止住刀兵問我？」如來笑道：「我是西方極樂世界釋迦牟尼尊者。南無阿彌陀佛！今聞你猖狂村野，屢反天宮，不知是何方生長，何年得道，為何這等暴橫？」大聖道：「我本：
    天地生成靈混仙，花果山中一老猿。
    水簾洞裡為家業，拜友尋師悟太玄。
    煉就長生多少法，學來變化廣無邊。
    因在凡間嫌地窄，立心端要住瑤天。
    靈霄寶殿非他久，歷代人王有分傳。
    強者為尊該讓我，英雄只此敢爭先。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 154
    "line_end": 161
    "source_sequence": 17
  "translation_ja": |-
    如来は阿儺（あなん）と迦葉（かしょう）の二尊者（そんじゃ）を呼んで従え、雷音宝刹を出ると、霊霄宝殿の門外へ直行した。突然、耳を震わせる叫び声が聞こえた。三十六人の雷将が斉天大聖を取り囲んでいるのである。如来は法旨（ほうし）を伝えた。
    如来「雷将たちに武器を収め、包囲を解かせよ。あの大聖を呼び出し、どのような法力があるのか、私に尋ねさせなさい。」
    将たちは果たして退いた。斉天大聖も神変（じんべん）の姿を収め、もとの姿で前へ進み、怒気をみなぎらせて鋭く叫んだ。
    斉天大聖「お前はどこの善士（ぜんし）だ。よくも戦いを止め、俺にものを尋ねようとするな！」
    如来は笑って答えた。
    如来「私は西方極楽世界（さいほうごくらくせかい）の釈迦牟尼尊者（しゃかむにそんじゃ）だ。南無阿弥陀仏。お前はひどく荒々しく無作法で、幾度も天宮に背いたと聞く。どこで育ち、いつ道を得て、なぜそのように横暴に振る舞うのだ。」
    斉天大聖「俺はもともと、
    天地が生んだ霊妙混元の仙、花果山に住む一匹の老猿。
    水簾洞（すいれんどう）をわが家とし、友を訪ね師を探して、奥深い道を悟った。
    長生きの術を数多く練り上げ、果てしなく広い変化の技を学んだ。
    人の世は狭苦しいと思い、どうしても美しい天に住もうと心に決めた。
    霊霄宝殿はいつまでもあいつのものじゃない。歴代の王にも譲り伝える順がある。
    強い者が尊ばれるなら、俺に譲るべきだ。先を争う勇気のある英雄は、この俺だ！」
  "translation_status": "draft"
- "id": "xy-ch07-018"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛祖聽言，呵呵冷笑道：「你那廝乃是個猴子成精，焉敢欺心，要奪玉皇上帝尊位？他自幼修持，苦歷過一千七百五十劫。每劫該十二萬九千六百年，你算他該多少年數，方能享受此無極大道？你那個初世為人的畜生，如何出此大言？不當人子，不當人子，折了你的壽算。趁早皈依，切莫胡說。但恐遭了毒手，性命頃刻而休，可惜了你的本來面目。」大聖道：「他雖年幼修長，也不應久占在此。常言道：『皇帝輪流做，明年到我家。』只教他搬出去，將天宮讓與我，便罷了；若還不讓，定要攪攘，永不清平。」佛祖道：「你除了長生變化之法，再有何能，敢占天宮勝境？」大聖道：「我的手段多哩：我有七十二般變化，萬劫不老長生；會駕觔斗雲，一縱十萬八千里。如何坐不得天位？」佛祖道：「我與你打個賭賽：你若有本事，一觔斗打出我這右手掌中，算你贏，再不用動刀兵，苦爭戰，就請玉帝到西方居住，把天宮讓你；若不能打出手掌，你還下界為妖，再修幾劫，卻來爭吵。」那大聖聞言，暗笑道：「這如來十分好獃。我老孫一觔斗去十萬八千里，他那手掌方圓不滿一尺，如何跳不出去？」急發聲道：「既如此說，你可做得主張？」佛祖道：「做得，做得。」伸開右手，卻似個荷葉大小。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"

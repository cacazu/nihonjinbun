  "translation_ja": |-
    如来は聞くと、はははと冷たく笑った。
    如来「お前はただの猿が妖仙になったもの。どうして良心を欺き、玉皇上帝（ぎょくこうじょうてい）の尊い位を奪おうとするのだ。あの方は幼いころから修行し、千七百五十劫もの苦しみを経ておられる。一劫は十二万九千六百年だ。いったい何年を経て、この無極（むきょく）の大道（だいどう）を享受しておられるのか、計算してみるがよい。初めて人らしくなったばかりの畜生の分際で、よくもそんな大口をたたける。心得違いも甚だしい。そんなことでは寿命を削るぞ。早く帰依し、たわごとを言うな。手ひどい目に遭って、たちまち命を失い、本来の真性（しんしょう）を損なっては惜しいことだ。」
    斉天大聖「あいつが幼いころから長く修行したからって、いつまでも居座っていいはずはない。『皇帝の役は持ち回り、来年は俺の家の番』というじゃないか。あいつが出ていって天宮を俺に譲れば、それで済む。譲らないなら、必ず騒ぎを起こして、いつまでも穏やかにはさせないぞ。」
    如来「長生きと変化の術のほかに、どんな力があって、天宮の勝境を占めようというのだ。」
    斉天大聖「俺の技はたくさんある。七十二の変化を身につけ、万劫（まんごう）を経ても老いずに生きる。筋斗雲（きんとうん）も操れ、ひと跳びで十万八千里（り）だ。なぜ天の位に座れない？」
    如来「では私と賭けをしよう。力があるなら、ひと跳びでこの右の手のひらから出てみるがよい。出られればお前の勝ちだ。もう武器を交え、苦しい戦いをする必要はない。玉帝には西方へ移っていただき、天宮をお前に譲ろう。出られなければ、下界で妖怪に戻り、もう幾劫か修行してから争いに来るのだ。」
    斉天大聖は聞くと、ひそかに笑って思った。
    斉天大聖「この如来は、まったく間抜けだ。俺はひと跳び十万八千里。あいつの手のひらは一尺（しゃく）にも足りないのに、跳び出せないはずがあるか。」
    すぐに声を上げた。
    斉天大聖「そう言うからには、お前が決めていいんだな？」
    如来「決められるとも。」
    如来が広げた右手は、蓮の葉ほどの大きさだった。

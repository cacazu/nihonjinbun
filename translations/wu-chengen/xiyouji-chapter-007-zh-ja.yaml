  "source_text": |-
    第七回
    八卦爐中逃大聖　五行山下定心猿
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 118
    "line_end": 119
    "source_sequence": 1
  "translation_ja": |-
    第七回
    八卦炉より大聖逃れ　五行山の下に心猿鎮まる
  "translation_status": "draft"
- "id": "xy-ch07-002"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": "富貴功名，前緣分定，為人切莫欺心。正大光明，忠良善果彌深。些些狂妄天加譴，眼前不遇待時臨。問東君，因甚如今禍害相侵？只為心高圖罔極，不分上下亂規箴。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 123
    "line_end": 123
    "source_sequence": 2
  "translation_ja": |-
    富貴も功名も、前世からの縁で定まる。人として、決して良心を欺くな。
    公明正大で忠義に生きれば、善い果報はいよいよ深い。
    わずかな思い上がりにも天は罰を下す。今すぐ遭わずとも、その時を待て。
    春をつかさどる東君に問おう。なぜ今、災いが次々に襲うのか。
    ただ心おごって果てしない望みを抱き、上下の分もわきまえず、戒めを乱したからだ。
  "translation_status": "draft"
- "id": "xy-ch07-003"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表齊天大聖被眾天兵押去斬妖臺下，綁在降妖柱上，刀砍斧剁，槍刺劍刳，莫想傷及其身。南斗星奮令火部眾神放火煨燒，亦不能燒著。又著雷部眾神以雷屑釘打，越發不能傷損一毫。那大力鬼王與眾啟奏道：「萬歲，這大聖不知是何處學得這護身之法，臣等用刀砍斧剁，雷打火燒，一毫不能傷損，卻如之何？」玉帝聞言道：「這廝這等這等，如何處治？」太上老君即奏道：「那猴吃了蟠桃，飲了御酒，又盜了仙丹。我那五壺丹，有生有熟，被他都吃在肚裡。運用三昧火，鍛成一塊，所以渾做金鋼之軀，急不能傷。不若與老道領去，放在八卦爐中，以文武火鍛煉，煉出我的丹來，他身自為灰燼矣。」玉帝聞言，即教六丁、六甲將他解下，付與老君。老君領旨去訖。一壁廂宣二郎顯聖，賞賜金花百朵、御酒百瓶、還丹百粒、異寶明珠、錦繡等件，教與義兄弟分享。真君謝恩，回灌江口不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 124
    "line_end": 124
    "source_sequence": 3
  "translation_ja": |-
    さて、斉天大聖は天兵たちに斬妖台の下へ引き立てられ、降妖柱に縛りつけられた。刀で切り、斧でたたき、槍で突き、剣でえぐっても、その身を傷つけることはできない。南斗星が勢い込んで火部の神々に命じ、火を放って焼かせたが、やはり燃えなかった。さらに雷部の神々に雷の釘を打ち込ませても、毛筋一本傷つけられない。大力鬼王と神々が奏上した。
    大力鬼王と神々「陛下、この大聖はどこで身を守る術を学んだのでしょう。臣どもが刀で切り、斧でたたき、雷で打ち、火で焼いても、傷一つつきません。いかがいたしましょう。」
    玉帝「この者がそれほどのものなら、どう処置すればよいのだ。」
    太上老君が進み出て奏上した。
    太上老君「あの猿は蟠桃を食べ、御酒を飲み、仙丹まで盗みました。私の五つの壺の丹薬は、まだ練り上がらぬものも完成したものも、すべて腹に入れてしまったのです。それを三昧の火で一つに練り固め、全身が金剛の体になったので、すぐには傷つけられません。老道の私に引き取らせ、八卦炉へ入れて、弱火と強火で練るのはいかがでしょう。私の丹を練り出せば、体はおのずと灰になります。」
    玉帝はそれを聞くと、六丁と六甲に命じ、斉天大聖を柱から解いて太上老君に渡させた。太上老君は命を受けて去った。一方では二郎顕聖真君を召し、金花百輪、御酒百瓶、還丹百粒、珍しい宝や真珠、錦織などを賜り、義兄弟たちと分けるよう命じた。二郎真君は恩に感謝して灌江口へ帰ったが、その話はひとまずおく。
  "translation_status": "draft"
- "id": "xy-ch07-004"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老君到兜率宮，將大聖解去繩索，放了穿琵琶骨之器，推入八卦爐中，命看爐的道人、架火的童子，將火搧起鍛煉。原來那爐是乾、坎、艮、震、巽、離、坤、兌八卦。他即將身鑽在巽宮位下。巽乃風也，有風則無火。只是風攪得煙來，把一雙眼火煼紅了，弄做個老害病眼，故喚作「火眼金睛」。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 126
    "line_end": 126
    "source_sequence": 4
  "translation_ja": "太上老君は兜率宮に着くと、斉天大聖の縄を解き、肩甲骨を貫いていた器具を外して八卦炉へ押し入れた。そして炉の番の道人と火を扱う童子に、火をあおいで練るよう命じた。そもそも炉は乾・坎・艮・震・巽・離・坤・兌の八卦にかたどられていた。斉天大聖は巽の位置へ身を潜めた。巽は風であり、風のあるところには火がない。ただ、その風が煙を巻き上げたため、両目は熱で赤くなり、いつも目を患うようになった。それで「火眼金睛」と呼ばれるのである。"
  "translation_status": "draft"
- "id": "xy-ch07-005"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "真個光陰迅速，不覺七七四十九日，老君的火候俱全。忽一日，開爐取丹。那大聖雙手侮著眼，正自揉搓流涕，只聽得爐頭聲響。猛睜睛看見光明，他就忍不住，將身一縱，跳出丹爐，唿喇一聲，蹬倒八卦爐，往外就走。慌得那架火、看爐與丁甲一班人來扯，被他一個個都放倒，好似癲癇的白額虎，風狂的獨角龍。老君趕上抓一把，被他一捽，捽了個倒栽蔥，脫身走了。即去耳中掣出如意棒，迎風幌一幌，碗來粗細，依然拿在手中，不分好歹，卻又大亂天宮，打得那九曜星閉門閉戶，四天王無影無形。好猴精，有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 127
    "line_end": 127
    "source_sequence": 5
  "translation_ja": "まことに月日のたつのは速く、いつしか七七、四十九日が過ぎ、太上老君の火加減も十分になった。ある日、炉を開いて丹を取り出そうとした。斉天大聖は両手で目を覆い、こすりながら涙を流していたが、炉の口で物音がした。ぱっと目を開くと光が見える。もうたまらず身を躍らせ、丹炉から跳び出した。どっと八卦炉を蹴り倒し、外へ走り出す。慌てた火の係、炉の番、丁甲の神々が引き止めようとしたが、一人残らず倒された。そのさまは、発作を起こした白額の虎、荒れ狂う一本角の竜のよう。太上老君が追いついてつかむと、斉天大聖はひと振りで頭から逆さに投げ倒し、逃げ出した。耳から如意金箍棒を抜き、風に向けてひと振りすると、椀ほどの太さとなった。再びそれを手にして、見境もなく天宮で大暴れ。九曜星は門も戸も閉ざし、四天王は影も形もなくなった。何という猿の妖仙。証しの詩がある。"
  "translation_status": "draft"
- "id": "xy-ch07-006"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    混元體正合先天，萬劫千番只自然。
    渺渺無為渾太乙，如如不動號初玄。
    爐中久煉非鉛汞，物外長生是本仙。
    變化無窮還變化，三皈五戒總休言。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 129
    "line_end": 132
    "source_sequence": 6
  "translation_ja": |-
    混元の体は正しく先天に合し、幾万の劫を経ても、ただおのずからある。
    はるかな無為は太乙と一つ、不動の真如は初玄と呼ばれる。
    炉中で長く練られたものは鉛や水銀ではなく、俗を超え長生する生来の仙人。
    変化は尽きず、なお変化する。三帰五戒など、今は語るまい。
  "translation_status": "draft"

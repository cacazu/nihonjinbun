  "source_text": "如來罵道：「我把你這個尿精猴子，你正好不曾離了我掌哩。」大聖道：「你是不知。我去到天盡頭，見五根肉紅柱，撐著一股青氣，我留個記在那裡，你敢和我同去看麼？」如來道：「不消去，你只自低頭看看。」那大聖睜圓火眼金睛，低頭看時，原來佛祖右手中指寫著「齊天大聖，到此一遊」。大指丫裡，還有些猴尿臊氣。大聖吃了一驚道：「有這等事？有這等事？我將此字寫在撐天柱子上，如何卻在他手指上？莫非有個未卜先知的法術？我決不信，不信。等我再去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 165
    "line_end": 165
    "source_sequence": 20
  "translation_ja": |-
    如来はののしった。
    如来「この小便猿め。お前は私の手のひらを、一度も離れてはいないぞ。」
    斉天大聖「お前は知らないんだ。俺は天の果てへ行って、青い気を支える肉色の赤い柱を五本見た。そこに印を残してきたんだ。一緒に見に行く勇気があるか？」
    如来「行くまでもない。自分で下を見てみなさい。」
    斉天大聖が火眼金睛を見開いて下を見ると、如来の右手の中指には、「斉天大聖、ここに遊ぶ」と書いてある。親指の股には、猿の小便の臭いまで残っていた。斉天大聖は驚いて言った。
    斉天大聖「そんなことがあるか。そんなことが！　俺は天を支える柱に書いたんだぞ。どうしてこいつの指にあるんだ？　占わなくても先のことが分かる術でも持っているのか。信じない、断じて信じないぞ。もう一度行ってくる！」
  "translation_status": "draft"
- "id": "xy-ch07-021"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    好大聖，急縱身又要跳出。被佛祖翻掌一撲，把這猴王推出西天門外，將五指化作金、木、水、火、土五座聯山，喚名「五行山」，輕輕的把他壓住。眾雷神與阿儺、迦葉一個個合掌稱揚道：「善哉，善哉！
    當年卵化學為人，立志修行果道真。
    萬劫無移居勝境，一朝有變散精神。
    欺天罔上思高位，凌聖偷丹亂大倫。
    惡貫滿盈今有報，不知何日得翻身。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 166
    "line_end": 171
    "source_sequence": 21
  "translation_ja": |-
    さすがは斉天大聖、すぐさま身を躍らせ、また跳び出そうとした。すると如来は手のひらを返して押しつけ、斉天大聖を西天門（さいてんもん）の外へ押し出した。五本の指を金・木・水・火・土の五つの連なる山に変え、「五行山（ごぎょうざん）」と名づけて、軽々とその下に押さえつけた。雷神たちと阿儺・迦葉は、一人ずつ合掌してたたえた。
    雷神たちと阿儺・迦葉「善いかな、善いかな！
    かつて卵から生まれて人を学び、修行を志して、真の道を得た。
    万劫にわたり変わらず勝境に住み、ひとたび変事が起こり、精気を散らした。
    天と主君を欺いて高位を望み、聖を侮り丹を盗んで、大いなる秩序を乱した。
    悪業は満ち、今こそ報いを受けた。いつ再び身を起こせるのだろう。」
  "translation_status": "draft"
- "id": "xy-ch07-022"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來佛祖殄滅了妖猴，即喚阿儺、迦葉同轉西方極樂世界。時有天蓬、天佑急出靈霄寶殿道：「請如來少待，我主大駕來也。」佛祖聞言，回首瞻仰。須臾，果見八景鸞輿，九光寶蓋，聲奏玄歌妙樂，詠哦無量神章，散寶花，噴真香，直至佛前謝曰：「多蒙大法收殄妖邪，望如來少停一日，請諸仙做一會筵奉謝。」如來不敢違悖，即合掌謝道：「老僧承大天尊宣命來此，有何法力？還是天尊與眾神洪福。敢勞致謝？」玉帝傳旨，即著雷部眾神，分頭請三清、四御、五老、六司、七元、八極、九曜、十都、千真、萬聖來此赴會，同謝佛恩。又命四大天師、九天仙女，大開玉京金闕、太玄寶宮、洞陽玉館，請如來高座七寶靈臺，調設各班坐位，安排龍肝鳳髓，玉液蟠桃。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 173
    "line_end": 173
    "source_sequence": 22
  "translation_ja": |-
    如来は斉天大聖を鎮圧すると、阿儺と迦葉を呼び、西方極楽世界へ帰ろうとした。そこへ天蓬（てんぽう）と天佑（てんゆう）が霊霄宝殿から急いで出てきた。
    天蓬と天佑「如来、少々お待ちください。主君がお越しになります。」
    如来が聞いて振り返ると、まもなく八景（はっけい）の鸞輿（らんよ）、九光（きゅうこう）の宝蓋（ほうがい）が現れた。奥妙な歌と美しい楽が奏でられ、無量の神聖な詩章が唱えられ、宝の花が散らされ、まことの香りが漂う。玉帝は如来の前へ来て謝意を述べた。
    玉帝「偉大な法力で妖邪を収めていただき、感謝する。如来にはもう一日とどまっていただきたい。仙人たちを招いて宴を開き、お礼を申し上げよう。」
    如来は逆らわず、合掌して答えた。
    如来「老僧は大天尊（だいてんそん）のお召しを受けて来ただけで、何ほどの法力がありましょう。天尊（てんそん）と神々の大きな福徳のおかげです。お礼など、お手を煩わせるには及びません。」
    玉帝は命を下し、雷部の神々に手分けをして、三清（さんせい）・四御（しぎょ）・五老（ごろう）・六司（りくし）・七元（しちげん）・八極（はっきょく）・九曜（くよう）・十都（じっと）、千の真人（しんじん）、万の聖者をここへ招き、ともに仏恩へ感謝させた。また四大天師（しだいてんし）と九天仙女（きゅうてんせんにょ）に命じ、玉京金闕（ぎょくけいきんけつ）、太玄宝宮（たいげんほうきゅう）、洞陽玉館（どうようぎょっかん）を大きく開き、如来を七宝（しっぽう）の霊台（れいだい）の上座へ迎えさせた。各組の席を整え、竜の肝や鳳凰の髄、玉液（ぎょくえき）の美酒や蟠桃を並べた。
  "translation_status": "draft"
- "id": "xy-ch07-023"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不一時，那玉清元始天尊、上清靈寶天尊、太清道德天尊、五炁真君、五斗星君、三官四聖、九曜真君、左輔、右弼、天王、哪吒，玄虛一應靈通，對對旌旗，雙雙幡蓋，都捧著明珠異寶，壽果奇花，向佛前拜獻曰：「感如來無量法力，收伏妖猴。蒙大天尊設宴，呼喚我等皆來陳謝。請如來將此會立一名如何？」如來領眾神之託曰：「今欲立名，可作個安天大會。」各仙老異口同聲，俱道：「好個『安天大會』！好個『安天大會』！」言訖，各坐座位，走斝傳觴，簪花鼓瑟，果好會也。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 174
    "line_end": 174
    "source_sequence": 23
  "translation_ja": |-
    ほどなく、玉清元始天尊（ぎょくせいげんしてんそん）、上清霊宝天尊（じょうせいれいほうてんそん）、太清道徳天尊（たいせいどうとくてんそん）、五炁真君（ごきしんくん）、五斗星君（ごとせいくん）、三官（さんかん）四聖（しせい）、九曜真君（くようしんくん）、左輔（さほ）、右弼（うひつ）、李天王、哪吒（なた）、玄妙な世界のあらゆる霊神たちがやって来た。旗を対に、幡（はた）と蓋（がい）を組にして、皆、真珠や珍宝、長寿の果実や不思議な花を捧げ、如来の前で拝礼して献じた。
    神仙たち「如来の限りない法力で、妖猿を降伏させてくださり、感謝申し上げます。大天尊が宴を設け、私どもをお召しになったので、お礼に参りました。如来、この宴に名をおつけいただけませんか。」
    如来は神々の頼みを受けた。
    如来「名をつけるなら、安天大会（あんてんたいかい）としましょう。」
    神仙たちは口をそろえた。
    神仙たち「よい名です、安天大会！　よい名です、安天大会！」
    言い終えると、それぞれ席に着き、酒器と杯を回し、花をかざして瑟（しつ）を奏でた。まことに見事な宴である。証しの詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-024"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    宴設蟠桃猴攪亂，安天大會勝蟠桃。
    龍旗鸞輅祥光藹，寶節幢幡瑞氣飄。
    仙樂玄歌音韻美，鳳簫玉管響聲高。
    瓊香繚繞群仙集，宇宙清平賀聖朝。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 176
    "line_end": 179
    "source_sequence": 24
  "translation_ja": |-
    蟠桃の宴は猿に乱されたが、安天大会は蟠桃の宴にまさる。
    竜の旗と鸞（らん）の車に吉祥の光が満ち、宝の節（せつ）、幢（どう）と幡には瑞気（ずいき）が漂う。
    仙楽（せんがく）と奥妙な歌は調べ美しく、鳳凰の簫（しょう）と玉の笛は高く響く。
    美しい香りが巡り、仙人たちが集う。天地の平穏を得て、聖なる朝廷を祝う。
  "translation_status": "draft"
- "id": "xy-ch07-025"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾皆暢然喜會，只見王母娘娘引一班仙子、仙娥、美姬、美女飄飄蕩蕩舞向佛前，施禮曰：「前被妖猴攪亂蟠桃一會，請眾仙眾佛俱成功。今蒙如來大法鍊鎖頑猴，喜慶『安天大會』，無物可謝，今是我淨手親摘大株蟠桃數顆奉獻。」真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 181
    "line_end": 181
    "source_sequence": 25
  "translation_ja": |-
    皆が心ゆくまで宴を楽しんでいると、王母（おうぼ）が仙子（せんし）、仙娥（せんが）、美しい姫や女たちを率い、ひらひらと舞いながら如来の前へ来て礼をした。
    王母「先には妖猿が蟠桃の宴を乱しましたが、お招きした仙人、仏の皆さまは、ことごとく功を成されました。今、如来の大法であの頑固な猿をつなぎ止め、めでたく安天大会を祝うことができました。お礼の品もございませんが、本日は手を清め、私が大きな木から摘んだ蟠桃を数個、お捧げいたします。」
    まことに、こうである。
  "translation_status": "draft"
- "id": "xy-ch07-026"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    半紅半綠噴甘香，艷麗仙根萬載長。
    堪笑武陵源上種，爭如天府更奇強。
    紫紋嬌嫩寰中少，緗核清甜世莫雙。
    延壽延年能易體，有緣食者自非常。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 183
    "line_end": 186
    "source_sequence": 26
  "translation_ja": |-
    半ば紅、半ば緑で甘い香りを放ち、艶やかな仙の根は万年も育つ。
    武陵源（ぶりょうげん）に植わる桃など笑うべし。どうして天の府の、さらに珍しく優れた桃に及ぼう。
    紫の筋の柔らかな実は世にもまれ、淡黄の核を持つ清らかな甘さに並ぶものはない。
    寿命を延ばし、体も変える。縁あって食べる者は、おのずと並の者ではなくなる。
  "translation_status": "draft"
- "id": "xy-ch07-027"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛祖合掌向王母謝訖。王母又著仙姬、仙子唱的唱，舞的舞。滿會群仙又皆賞讚。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 187
    "line_end": 187
    "source_sequence": 27
  "translation_ja": "如来は合掌して王母に礼を言った。王母はさらに、仙姫（せんき）や仙子に歌わせ、舞わせた。満座の仙人たちも、皆その見事さをたたえた。まさに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-028"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    縹緲天香滿座，繽紛仙蕊仙花。玉京金闕大榮華。異品奇珍無價。
    對對與天齊壽，雙雙萬劫增加。桑田滄海任更差。他自無驚無訝。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 189
    "line_end": 190
    "source_sequence": 28
  "translation_ja": |-
    かすかな天の香りが満座に漂い、仙の花もしべも、色とりどりに咲き乱れる。玉京金闕の大いなる栄華。珍品、奇宝に値はつけられない。
    二人ずつ天に等しい長寿を享け、組ごとに万劫を増し加える。桑畑が海になり、海が桑畑になろうとも、彼らは驚きも怪しみもしない。
  "translation_status": "draft"
- "id": "xy-ch07-029"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王母正著仙姬、仙子歌舞，觥籌交錯，不多時，忽又聞得："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 192
    "line_end": 192
    "source_sequence": 29
  "translation_ja": "王母が仙姫や仙子を歌い舞わせ、杯と酒の数取り棒が入り交じるうち、ほどなく、ふとまた異香が漂った。"
  "translation_status": "draft"
- "id": "xy-ch07-030"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一陣異香來鼻噢，驚動滿堂星與宿。
    天仙佛祖把杯停，各各擡頭迎目候。
    霄漢中間現老人，手捧靈芝飛藹繡。
    葫蘆藏蓄萬年丹，寶籙名書千紀壽。
    洞裡乾坤任自由，壺中日月隨成就。
    遨遊四海樂清閑，散淡十洲容輻輳。
    曾赴蟠桃醉幾遭，醒時明月還依舊。
    長頭大耳短身軀，南極之方稱老壽。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 194
    "line_end": 201
    "source_sequence": 30
  "translation_ja": |-
    ひとしきり不思議な香りが鼻に届き、満堂の星々の神を驚かせる。
    天仙（てんせん）も如来も杯を止め、皆、顔を上げて迎えようと見守る。
    天空に老人が現れ、手には霊芝（れいし）を捧げ、霞と錦をひるがえす。
    瓢箪には万年の丹薬を蓄え、宝の名簿には千紀（き）の寿命が記される。
    洞の内の天地では気ままに過ごし、壺の中の日月も思いのまま。
    四海（しかい）を遊び巡って清閑を楽しみ、悠々と十洲（じっしゅう）を行き交う。
    蟠桃の宴で何度酔ったことか。覚めれば明月は、もとのまま。
    長い頭、大きな耳、短い体。南極（なんきょく）の方角で、長寿の翁と呼ばれる。
  "translation_status": "draft"
- "id": "xy-ch07-031"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "壽星又到。見玉帝禮畢，又見如來，申謝曰：「始聞那妖猴被老君引至兜率宮鍛煉，以為必致平安，不期他又反出。幸如來善伏此怪，設宴奉謝，故此聞風而來。更無他物可獻，特具紫芝瑤草、碧藕金丹奉上。」詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 203
    "line_end": 203
    "source_sequence": 31
  "translation_ja": |-
    寿星（じゅせい）もやって来た。玉帝への礼を済ませ、如来にも会って謝意を述べた。
    寿星「あの妖猿が老君に連れられ、兜率宮で練られると初めに聞いたときは、必ず平穏になると思いました。ところが、また背いて出てきたとは。幸い如来が見事に降伏させられ、お礼の宴が開かれると伺い、参った次第です。ほかに差し上げるものもございませんが、紫の霊芝と瑤草（ようそう）、碧の蓮根と金丹（きんたん）を用意して、お捧げいたします。」
    詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-032"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    碧藕金丹奉釋迦，如來萬壽若恆沙。
    清平永樂三乘錦，康泰長生九品花。
    無相門中真法主，色空天上是仙家。
    乾坤大地皆稱祖，丈六金身福壽賒。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 205
    "line_end": 208
    "source_sequence": 32
  "translation_ja": |-
    碧の蓮根と金丹を釈迦（しゃか）に捧げる。如来の長寿は恒河（ごうが）の砂のように限りない。
    平穏と永い楽しみは三乗（さんじょう）の錦、健やかな長生きは九品（くほん）の花。
    姿なき門のまことの法主（ほっす）、色（しき）と空（くう）の天の仙家（せんか）である。
    天地のすべてが祖とあがめ、丈六（じょうろく）の金身（こんじん）に福と寿命は果てしない。
  "translation_status": "draft"
- "id": "xy-ch07-033"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來忻然領謝。壽星得座，依然走斝傳觴。只見赤腳大仙又至，向玉帝前頫顖禮畢，又對佛祖謝道：「深感法力，降伏妖猴。無物可以表敬，特具交梨二顆、火棗數枚奉獻。」詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 209
    "line_end": 209
    "source_sequence": 33
  "translation_ja": |-
    如来は喜んで受け取り、礼を言った。寿星も席に着き、再び杯が回り始める。そこへ赤脚大仙（せききゃくだいせん）も到着し、玉帝の前で頭を垂れて礼をし、如来に謝意を述べた。
    赤脚大仙「法力で妖猿を降伏させてくださり、深く感謝いたします。敬意を表す品もございませんが、交梨（こうり）を二つ、火棗（かそう）をいくつか用意して、お捧げいたします。」
    詩にいう。
  "translation_status": "draft"
- "id": "xy-ch07-034"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    大仙赤腳棗梨香，敬獻彌陀壽算長。
    七寶蓮臺山樣穩，千金花座錦般粧。
    壽同天地言非謬，福比洪波話豈狂。
    福壽如期真個是，清閑極樂那西方。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 211
    "line_end": 214
    "source_sequence": 34
  "translation_ja": |-
    赤脚大仙の棗と梨はかぐわしく、弥陀（みだ）に敬って献じ、長寿を願う。
    七宝の蓮台（れんだい）は山のように揺るがず、千金に値する花座（けざ）は錦のように飾られる。
    寿命が天地に等しいというのは偽りでなく、福が大波に比されるというのも大言ではない。
    福寿は願いのとおり、まことそのもの。西方こそ清閑な極楽の地。
  "translation_status": "draft"
- "id": "xy-ch07-035"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來又稱謝了，叫阿儺、迦葉將各所獻之物，一一收起，方向玉帝前謝宴。眾各酩酊。只見個巡視靈官來報道：「那大聖伸出頭來了。」佛祖道：「不妨，不妨。」袖中只取出一張帖子，上有六個金字：「唵嘛呢叭咪吽」。遞與阿儺，叫貼在那山頂上。這尊者即領帖子，拿出天門，到那五行山頂上，緊緊的貼在一塊四方石上，那座山即生根合縫。可運用呼吸之氣，手兒爬出，可以搖掙搖掙。阿儺回報道：「已將帖子貼了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 216
    "line_end": 216
    "source_sequence": 35
  "translation_ja": |-
    如来はまた礼を言い、阿儺と迦葉に、皆から献じられた品を一つずつ収めさせ、それから玉帝へ宴の礼を述べた。一同はすっかり酔っていた。そこへ巡視霊官（じゅんしれいかん）が報告に来た。
    巡視霊官「あの大聖が頭を出しました。」
    如来「かまわぬ、かまわぬ。」
    如来は袖から札を一枚取り出した。そこには「唵嘛呢叭咪吽（おんまにはべいうん）」という金色の六文字があった。阿儺に渡し、山頂に貼るよう命じる。阿儺は札を受け取り、天門から出て、五行山の頂へ至り、四角い石にしっかりと貼りつけた。すると山は根を生やし、継ぎ目が閉じた。それでも斉天大聖は息をすることができ、手を外へ這わせ、少しは身を揺すってもがくこともできた。阿儺は戻って報告した。
    阿儺「札を貼ってまいりました。」
  "translation_status": "draft"
- "id": "xy-ch07-036"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來即辭了玉帝眾神，與二尊者出天門之外。又發一個慈悲心，念動真言咒語，將五行山召一尊土地神祗，會同五方揭諦，居住此山監押。但他饑時，與他鐵丸子吃；渴時，與他溶化的銅汁飲。待他災愆滿日，自有人救他。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 218
    "line_end": 218
    "source_sequence": 36
  "translation_ja": "如来は玉帝と神々に別れを告げ、二尊者とともに天門を出た。そしてまた慈悲の心を起こし、真言（しんごん）の呪文を唱え、五行山の土地神を一柱呼び出した。五方掲諦（ごほうぎゃてい）とともにこの山に住んで、斉天大聖を監視させるのである。腹をすかせたら鉄の丸を食べさせ、喉が渇いたら溶かした銅の汁を飲ませる。罪の災いを償い終える日には、おのずと救い出す者が現れるという。まさに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch07-037"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    妖猴大膽反天宮，卻被如來伏手降。
    渴飲溶銅捱歲月，饑餐鐵彈度時光。
    天災苦困遭磨折，人事淒涼喜命長。
    若得英雄重展掙，他年奉佛上西方。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 219
    "line_end": 222
    "source_sequence": 37
  "translation_ja": |-
    妖猿は大胆にも天宮に背いたが、如来の手に降された。
    渇けば溶けた銅を飲んで歳月に耐え、飢えれば鉄の丸を食べて時を過ごす。
    天の災いに苦しめられ、折りさいなまれ、人の世との縁も寂しいが、命の長さを喜ぶ。
    もし英雄が再び身を起こせるなら、いつの日か仏に仕えて西方へ向かうだろう。
  "translation_status": "draft"
- "id": "xy-ch07-038"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "又詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 224
    "line_end": 224
    "source_sequence": 38
  "translation_ja": "さらに詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch07-039"
  "section_id": "chapter-07"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    伏逞豪強大勢興，降龍伏虎弄乖能。
    偷桃偷酒遊天府，受籙承恩在玉京。
    惡貫滿盈身受困，善根不絕氣還昇。
    果然脫得如來手，且待唐朝出聖僧。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 226
    "line_end": 229
    "source_sequence": 39
  "translation_ja": |-
    勇力を振るい、大きな勢いを起こし、竜を降し虎を伏せて、利口ぶった技を見せた。
    桃を盗み、酒を盗んで天の府を遊び回り、玉京（ぎょくけい）では名簿に載り、恩を受けた。
    悪業が満ちて身を閉じ込められても、善根（ぜんごん）は絶えず、気はなお昇る。
    本当に如来の手から逃れるには、唐（とう）の世に聖僧が現れるのを待たねばならない。
  "translation_status": "draft"
- "id": "xy-ch07-040"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知向後何年何月方滿災殃，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch7-2646669"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第007回&oldid=2646669"
    "line_start": 231
    "line_end": 231
    "source_sequence": 40
  "translation_ja": "さて、この先、何年何月になれば、災いの日々を終えられるのだろうか。続きは次回のお話に。"
  "translation_status": "draft"

      第七十七回
      群れなす魔は本性を欺き、一体となって真如を拝む
    "translation_status": "draft"
  - "id": "xy-ch77-002"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且不言唐長老困苦。卻說那三個魔頭齊心竭力，與大聖兄弟三人，在城東半山內努力爭持。這一場，正是那鐵刷帚刷銅鍋──家家挺硬。好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 119
        "line_end": 119
    "translation_ja": "三蔵（さんぞう）の苦しみは、ひとまずおいておこう。さて、三人の妖王は心と力を合わせ、悟空（ごくう）たち三兄弟と城の東の山腹で、力の限り渡り合っていた。この一戦は、鉄の刷毛で銅の鍋をこするようなもの。どちらを取っても、とびきり堅い。すさまじい戦いだ。"
    "translation_status": "draft"
  - "id": "xy-ch77-003"
    "section_id": "chapter-77"
    "kind": "verse"
    "origin": "source"
    "source_text": "六般體相六般兵，六樣形骸六樣情。六惡六根緣六慾，六門六道賭輸贏。三十六宮春自在，六六形色恨有名。這一個金箍棒，千般解數；那一個方天戟，百樣崢嶸。八戒釘鈀兇更猛，二怪長槍俊又能。小沙僧寶杖非凡，有心打死；老魔頭鋼刀快利，舉手無情。這三個是護衛真僧無敵將，那三個是亂法欺君潑野精。起初猶可，向後彌兇。六枚都使昇空法，雲端裡面各翻騰。一時間吐霧噴雲天地暗，哮哮吼吼只聞聲。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      六つの姿に六つの武器、六つの体に六つの心。
      六つの悪と六根（ろっこん）は六欲（ろくよく）につながり、六門（ろくもん）と六道（ろくどう）が勝ち負けを争う。
      三十六宮（さんじゅうろくきゅう）には春が自在に満ち、六六の形と色は、名を持つがゆえに憎しみ合う。
      こちらの金箍棒（きんこぼう）は、千通りの技を繰り出し、
      あちらの方天戟（ほうてんげき）は、百通りの威を振るう。
      八戒（はっかい）の釘鈀（ていは）はいっそう凶猛、黄牙老象（こうがろうぞう）の長槍は巧みで鋭い。
      沙悟浄（さごじょう）の宝杖は並の物ではなく、相手を打ち殺すつもり、
      青毛獅子怪（せいもうししかい）の鋼刀は切れ味鋭く、振り上げる手に情けはない。
      この三人は真の僧を守る無敵の将、
      あの三人は法を乱し君主を欺く、荒くれの野の妖怪。
      初めはまだよかったが、後になるほど凶暴さを増す。
      六人そろって空へ上がる術を使い、雲の中でそれぞれ翻り舞う。
      たちまち霧を吐き雲を噴き、天地は暗くなり、
      ただ吠え声、叫び声ばかりが響く。

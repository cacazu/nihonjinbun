  - "id": "xy-ch77-004"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他六個鬥夠多時，漸漸天晚。卻又是風霧漫漫，霎時間就黑暗了。原來八戒耳大，蓋著眼皮，越發昏濛；手腳慢，又遮架不住：拖著鈀，敗陣就走。被老魔舉刀砍去，幾乎傷命。幸躲過頭腦，被口刀削斷幾根鬃毛，趕上張開口咬著領頭，拿入城中，丟與小怪，綑在金鑾殿。老妖又駕雲，起在半空助力。沙和尚見事不諧，虛幌著寶杖，顧本身回頭便走。被二怪捽開鼻子，響一聲，連手捲住，拿到城裡，也叫小妖綑在殿下。卻又騰空去叫拿行者。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 122
        "line_end": 122
    "translation_ja": "六人は長いこと戦い、次第に日は暮れていった。風と霧まで一面に立ちこめ、あっという間に真っ暗になった。もともと八戒は大きな耳がまぶたにかぶさるので、いよいよ目がかすんで見えない。手足も鈍って敵の攻撃を受けきれず、熊手を引きずり、敗れて逃げだした。青毛獅子怪が刀を振り上げて斬りつけ、もう少しで命を落とすところだった。幸い頭はかわしたものの、刀にたてがみを何本か削ぎ落とされた。青毛獅子怪は追いついて口を開き、襟首をくわえると城内へ連れ込み、小妖たちに投げ渡して金鑾殿（きんらんでん）で縛らせた。そしてまた雲に乗り、空中へ上がって加勢した。形勢が悪いと見た沙悟浄は、宝杖で攻めるふりをすると、自分の身を守ろうと向きを変えて逃げだした。ところが黄牙老象が鼻を振り出し、びゅっと一声、腕ごと巻きつけた。そのまま城へ連れていき、小妖たちに殿の下で縛らせると、また空へ上がり、悟空を捕らえろと呼ばわった。"
    "translation_status": "draft"
  - "id": "xy-ch77-005"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見兩個兄弟遭擒，他自家獨力難撐，正是：好手不敵雙拳，雙拳難敵四手。他喊一聲，把棍子隔開三個妖魔的兵器，縱觔斗駕雲走了。三怪見行者駕觔斗時，即抖抖身，現了本像，搧開兩翅，趕上大聖。你道他怎能趕上？當時如行者鬧天宮，十萬天兵也拿他不住者，以他會駕觔斗雲，一去有十萬八千里路，所以諸神不能趕上。這妖精搧一翅就有九萬里，兩搧就趕過了。所以被他一把撾住，拿在手中，左右掙挫不得。欲思要走，莫能逃脫。即使變化法遁法，又往來難行：變大些兒，他就放鬆了撾住；變小些兒，他又揝緊了撾住。復拿了徑回城內，放了手，捽下塵埃，吩咐群妖，也照八戒、沙僧綑在一處。那老魔、二魔俱下來迎接，三個魔頭同上寶殿。噫！這一番倒不是綑住行者，分明是與他送行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 123
        "line_end": 123
    "translation_ja": "二人の弟弟子が捕らえられたのを見て、悟空も一人では持ちこたえられなくなった。まさに、腕の立つ者も二つの拳には勝てず、二つの拳も四本の手にはかなわない。悟空は一声叫び、棒で三人の武器を押しのけると、筋斗雲（きんとうん）に飛び乗って逃げた。雲程万里鵬（うんていばんりほう）は、悟空が宙返りしたと見るや身震いし、本来の姿を現して両翼を広げ、追いすがった。どうして追いつけたのか、お分かりだろうか。悟空が天宮で暴れたとき、十万の天兵にも捕らえられなかったのは、ひと飛び十万八千里（り）の筋斗雲に乗れたため、神々が誰も追いつけなかったからだ。ところがこの妖怪は、翼を一度あおぐだけで九万里、二度あおげば追い越してしまう。そこで悟空はひとつかみにされ、手の中でもがいても動けなくなった。逃げようにも逃げられず、変化の術や身を隠す術を使っても、抜ける道がない。少し大きくなれば、相手は手を緩めてつかみ直し、小さくなれば、いっそうきつく握り締める。雲程万里鵬は悟空を捕らえたまま城へ帰り、手を放して地面へたたきつけると、八戒や沙悟浄と同じように縛り、一か所に置くよう妖怪たちに命じた。青毛獅子怪と黄牙老象も下りてきて出迎え、三人の妖王はそろって宝殿へ上がった。おや、今度は悟空を縛りつけたというより、かえって出立の見送りをしてやるようなものだ。"
    "translation_status": "draft"
  - "id": "xy-ch77-006"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此時有二更時候，眾怪一齊相見畢，把唐僧推下殿來。那長老於燈光前，忽見三個徒弟都綑在地下，老師父伏於行者身邊，哭道：「徒弟啊，常時逢難，你卻在外運用神通，到那裡取救降魔；今番你亦遭擒，我貧僧怎麼得命？」八戒、沙僧聽見師父這般苦楚，便也一齊放聲痛哭。行者微微笑道：「師父放心，兄弟莫哭，憑他怎的，決然無傷。等那老魔安靜了，我們走路。」八戒道：「哥啊，又來搗鬼了。麻繩綑住，鬆些兒還著水噴，想你這瘦人兒不覺，我這胖的遭瘟哩。不信，你看兩膊上，入肉已有二寸，如何脫身？」行者笑道：「莫說是麻繩綑的，就是碗粗的棕纜，只也當秋風過耳，何足罕哉？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      このときは二更（にこう）ごろだった。妖怪たちは一通り挨拶を交わすと、三蔵を殿の下へ押し出した。灯火の明かりに、三蔵は弟子三人が地面に縛られているのを見つけた。悟空のそばに身を伏せ、泣いて訴える。
      三蔵「悟空、いつも災難に遭ったときには、お前は外にいて神通力を使い、どこかへ助けを求め、妖怪を降してくれた。今度はお前まで捕らえられてしまった。僧の私に、どうして助かる道があろう」
      八戒と沙悟浄も師の悲痛な声を聞き、そろって大声で泣きだした。悟空はかすかに笑った。
      悟空「お師匠さま、ご心配なく。弟たちも泣くな。あいつらが何をしようと、必ず無傷で済みます。青毛獅子怪がおとなしくなったら、出かけましょう」
      八戒「兄貴、また妙なことを言う。麻縄で縛られ、少し緩めば水まで吹きかけられるんだ。兄貴は痩せているから気づかないかもしれないが、太った俺はたまったものじゃない。嘘だと思うなら、この両腕を見てくれ。もう二寸（すん）も肉に食い込んでいる。どうやって抜け出すんだよ」
      悟空は笑った。
      悟空「麻縄どころか、椀ほども太い棕櫚（しゅろ）の綱だって、俺には耳元を吹き過ぎる秋風と同じだ。何を大げさに言うことがある」
    "translation_status": "draft"
  - "id": "xy-ch77-007"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們正說處，只聞得那老魔道：「三賢弟有力量，有智謀，果成妙計，拿將唐僧來了。」叫：「小的們，著五個打水，七個刷鍋，十個燒火，二十個擡出鐵籠來，把那四個和尚蒸熟，我兄弟們受用；各散一塊兒與小的們吃，也教他個個長生。」八戒聽見，戰兢兢的道：「哥哥，你聽，那妖精計較要蒸我們吃哩。」行者道：「不要怕，等我看他是雛兒妖精，是把勢妖精。」沙和尚哭道：「哥呀，且不要說寬話。如今已與閻王隔壁哩，且講甚麼『雛兒』、『把勢』？」說不了，又聽得二怪說：「豬八戒不好蒸。」八戒歡喜道：「阿彌陀佛！是那個積陰騭的說我不好蒸？」三怪道：「不好蒸，剝了皮蒸。」八戒慌了，厲聲喊道：「不要剝皮，粗自粗，湯響就爛了。」老怪道：「不好蒸的，安在底下一格。」行者笑道：「八戒莫怕，是雛兒，不是把勢。」沙僧道：「怎麼認得？」行者道：「大凡蒸東西，都從上邊起。不好蒸的，安在上頭一格，多燒把火，圓了氣，就好了；若安在底下，一住了氣，就燒半年也是不得氣上的。他說八戒不好蒸，安在底下，不是雛兒是甚的？」八戒道：「哥啊，依你說，就活活的弄殺人了。他打緊見不上氣，擡開了，把我翻轉過來，再燒起火，弄得我兩邊俱熟，中間不夾生了？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      師弟が話していると、青毛獅子怪の声が聞こえた。
      青毛獅子怪「三番目の弟よ、お前は力も知恵もある。見事に妙計を成し遂げ、唐僧（とうそう）を捕らえてくれた」
      さらに呼ばわった。
      青毛獅子怪「小さい者ども、五人で水を汲み、七人で鍋を洗い、十人で火を焚き、二十人で鉄の蒸籠（せいろ）を担ぎ出せ。あの四人の坊主を蒸し上げ、わしら兄弟のごちそうにするのだ。お前たちにも一切れずつ分け、皆を長生きさせてやろう」
      八戒は聞いて震え上がった。
      八戒「兄貴、聞いたか。あの妖怪、俺たちを蒸して食う相談をしているぞ」
      悟空「怖がるな。あいつらが素人の妖怪か、玄人の妖怪か、見定めてやる」
      沙悟浄は泣きながら言った。
      沙悟浄「兄さん、気休めはよしてください。今や閻魔王（えんまおう）と壁一枚隔てただけなのに、素人も玄人もありますか」
      言い終わらないうちに、黄牙老象の声がした。
      黄牙老象「猪八戒（ちょはっかい）は蒸しにくいぞ」
      八戒は喜んだ。
      八戒「阿弥陀仏（あみだぶつ）！　俺は蒸しにくいと言ってくださる、陰徳（いんとく）のあるお方はどなたです」
      雲程万里鵬「蒸しにくければ、皮を剝いで蒸せばよい」
      八戒は慌て、声を張り上げた。
      八戒「皮を剝くな！　皮は厚くても、湯が煮えたらすぐに柔らかくなるから！」
      青毛獅子怪「蒸しにくい者は、一番下の段へ入れろ」
      悟空は笑った。
      悟空「八戒、心配するな。あいつらは素人で、玄人じゃない」
      沙悟浄「どうして分かるのです」
      悟空「物を蒸せば、上のほうから先に蒸し上がるものだ。蒸しにくい物は一番上の段へ入れ、薪を一つかみ余分にくべ、十分に蒸気を回せばよい。下に入れて蒸気がふさがったら、半年焚いたって上まで蒸気は通らない。八戒が蒸しにくいから下へ入れろと言うのは、素人だからに決まっている」
      八戒「兄貴、その話だと、俺を生きたまま、あれこれいじって殺すことになるじゃないか。蒸気が上がらないのに気づけば、蓋をどけ、俺をひっくり返してまた火を焚く。そうなりゃ両側とも蒸し上がって、真ん中まで生煮えがなくなるんじゃないか」
    "translation_status": "draft"
  - "id": "xy-ch77-008"
    "section_id": "chapter-77"
    "kind": "paragraph"

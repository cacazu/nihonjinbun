    "source_text": "正講時，又見小妖來報：「湯滾了。」老怪傳令叫擡。眾妖一齊上手，將八戒擡在底下一格，沙僧擡在二格。行者估著來擡他，他就脫身道：「此燈光前好做手腳。」拔下一根毫毛，吹口仙氣，叫：「變！」即變做一個行者，綑了麻繩。將真身出神，跳在半空裡，低頭看著。那群妖那知真假，見人就擡，把個假行者擡在上三格；才將唐僧揪翻倒綑住，擡上第四格。乾柴架起，烈火氣焰騰騰。大聖在雲端裡嗟嘆道：「我那八戒、沙僧，還捱得兩滾；我那師父，只消一滾就爛。若不用法救他，頃刻喪矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      こう話しているところへ、小妖が報告に来た。
      小妖「湯が沸きました」
      青毛獅子怪が担げと命じると、妖怪たちは一斉に取りかかり、八戒を一番下の段へ、沙悟浄を二段目へ担ぎ入れた。悟空は、次には自分の番だと見当をつけ、抜け出す仕度をした。
      悟空「この灯火の下なら、細工がしやすい」
      毛を一本抜き、仙気（せんき）を吹きかけて叫ぶ。
      悟空「変われ！」
      すると麻縄で縛られた悟空が一人できあがった。本身は神通力で抜け出し、空中へ跳び上がって見下ろしていた。妖怪たちに真偽など分かるはずもなく、人の姿があれば担ぎ上げる。偽物の悟空を三段目へ入れ、そのあとで三蔵を引き倒して縛り、四段目へ担ぎ上げた。乾いた薪を組み上げると、烈火の炎が勢いよく燃え立った。悟空は雲の上で嘆いた。
      悟空「八戒と沙悟浄なら、湯が二度煮立つくらいは耐えられる。だがお師匠さまは、一度煮立っただけで煮崩れてしまう。術でお助けしなければ、たちまちお命がなくなるぞ」
    "translation_status": "draft"
  - "id": "xy-ch77-009"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，在空中捻著訣，念一聲「唵藍淨法界，乾元亨利貞」的咒語，拘喚得北海龍王早至。只見那雲端裡一朵烏雲，應聲高叫道：「北海小龍敖順叩頭。」行者道：「請起，請起。無事不敢相煩。今與唐師父到此，被毒魔拿住，上鐵籠蒸哩。你去與我護持護持，莫教蒸壞了。」龍王隨即將身變作一陣冷風，吹入鍋下，盤旋圍護，更沒火氣燒鍋，他三人方不損命。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      さすがの悟空、空中で印を結び、呪文を一声唱えた。
      悟空「唵藍浄法界（おんらんじょうほっかい）、乾元亨利貞（けんげんこうりてい）」
      すると北海竜王（ほっかいりゅうおう）が呼び寄せられ、ただちにやって来た。雲間の一片の黒雲から、呼び声に応じて高い声が響く。
      北海竜王「北海の小竜、敖順（ごうじゅん）が謹んでお辞儀申し上げます」
      悟空「お立ちください、お立ちください。何もなければお手を煩わせはしません。今、唐のお師匠さまとここまで来たところを毒々しい妖怪に捕まり、鉄の蒸籠に入れられて蒸されております。どうか守って、蒸し殺されぬようにしてください」
      北海竜王はすぐに冷たい風となり、鍋の下へ吹き込んで、巡りながら守った。そのため火の熱が鍋を焼くことはなく、三人は命を失わずに済んだ。
    "translation_status": "draft"
  - "id": "xy-ch77-010"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "將有三更盡時，只聞得老魔發放道：「手下的，我等用計勞形，拿了唐僧四眾；又因相送辛苦，四晝夜未曾得睡。今已綑在籠裡，料應難脫，汝等用心看守，著十個小妖輪流燒火，讓我們退宮，略略安寢。到五更天色將明，必然爛了，可安排下蒜泥鹽醋，請我們起來，空心受用。」眾妖各各遵命。三個魔頭，卻各轉寢宮而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      三更（さんこう）も終わろうとするころ、青毛獅子怪が命令する声が聞こえた。
      青毛獅子怪「手下ども、わしらは策を練って身を疲らせ、唐僧一行四人を捕らえた。見送りにも骨を折り、四昼夜眠っておらぬ。今は蒸籠に縛って入れてあるから、逃れられまい。よく見張り、小妖十人で交代して火を焚け。わしらは宮の奥へ引っ込み、しばらく眠る。五更（ごこう）、夜が明けかけるころには、すっかり柔らかくなっているはずだ。すり潰したニンニクと塩、酢を用意してから起こしに来い。空き腹でいただくことにする」
      妖怪たちはそれぞれ命令に従い、三人の妖王はおのおの寝殿へ引き揚げた。
    "translation_status": "draft"
  - "id": "xy-ch77-011"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者在雲端裡明明聽著這等吩咐，卻低下雲頭，不聽見籠裡人聲。他想著：「火氣上騰，必然也熱，他們怎麼不怕，又無言語哼嗔？莫敢是蒸死了？等我近前再聽。」好大聖，踏著雲，搖身一變，變作一個黑蒼蠅兒，釘在鐵籠格外聽時，只聞得八戒在裡面道：「晦氣，晦氣，不知是悶氣蒸，又不知是出氣蒸哩。」沙僧道：「二哥，怎麼叫做『悶氣』、『出氣』？」八戒道：「悶氣蒸是蓋了籠頭，出氣蒸不蓋。」三藏在浮上一層應聲道：「徒弟，不曾蓋。」八戒道：「造化，今夜還不得死，這是出氣蒸了。」行者聽得他三人都說話，未曾傷命，便就飛了去，把個鐵籠蓋輕輕兒蓋上。三藏慌了道：「徒弟，蓋上了。」八戒道：「罷了，這個是悶氣蒸，今夜必是死了。」沙僧與長老嚶嚶的啼哭。八戒道：「且不要哭，這一會燒火的換了班了。」沙僧道：「你怎麼知道？」八戒道：「早先擡上來時，正合我意：我有些兒寒濕氣的病，要他騰騰。這會子反冷氣上來了。咦！燒火的長官，添上些柴便怎的？要了你的哩？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      悟空は雲の上で、その指図をはっきり聞いていた。ところが雲を下げても、蒸籠の中から人声がしない。
      悟空は考えた。「火の熱が上がるから、さぞ暑いはずだ。それなのに、なぜ怖がりもせず、うめき声一つ立てない。まさか蒸し殺されたのか。もっと近くで聞いてみよう」
      悟空は雲を踏み、身を振るわせて黒いハエに変わり、鉄の蒸籠の枠の外に止まって耳を澄ませた。中から八戒の声が聞こえる。
      八戒「ついてない、ついてない。これが蓋をした蒸し方なのか、蒸気を逃がす蒸し方なのか、それも分からん」
      沙悟浄「二番目の兄さん、蓋をするのと蒸気を逃がすのは、どう違うのです」
      八戒「蓋を閉めるのが蒸気を閉じ込める蒸し方、閉めないのが逃がす蒸し方だ」
      一番上の段から三蔵が答えた。
      三蔵「蓋はされていないよ」
      八戒「ありがたい。今夜はまだ死なずに済む。蒸気を逃がして蒸しているんだ」
      三人とも口を利き、命に別状がないと分かると、悟空は飛んでいって、鉄の蒸籠の蓋をそっと閉めた。三蔵は慌てた。
      三蔵「お前たち、蓋をされてしまった」
      八戒「もうだめだ。これじゃ蒸気がこもる。今夜こそ死んじまう」
      沙悟浄と三蔵はしくしく泣いた。
      八戒「まあ泣くな。今、火を焚くやつが交代したぞ」
      沙悟浄「どうして分かるのです」
      八戒「担ぎ込まれたばかりのときは、ちょうど俺に好都合だった。俺には冷えと湿気の病が少しあるから、湯気を浴びせてもらいたかったんだ。ところが今は、逆に冷たい風が上がってくる。おい、火焚きの長官さま、少し薪を足してくれてもいいだろう。あんたの持ち物をせびっているわけじゃないぞ！」
    "translation_status": "draft"
  - "id": "xy-ch77-012"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽見，忍不住暗笑道：「這個夯貨，冷還好捱，若熱就要傷命。再說兩遭，一定走了風了，快早救他。且住，要救他須是要現本相。假如現了，這十個燒火的看見，一齊亂喊，驚動老怪，卻不又費事？等我先送他個法兒。」忽想起：「我當初做大聖時，曾在北天門與護國天王猜枚耍子，贏得他瞌睡蟲兒，還有幾個，送了他罷。」即往腰間順帶裡摸摸，還有十二個。「送他十個，還留兩個做種。」即將蟲兒拋了去，散在十個小妖臉上，鑽入鼻孔，漸漸打盹，都睡倒了。只有一個拿火叉的睡不穩，揉頭搓臉，把鼻子左捏右捏，不住的打噴嚏。行者道：「這廝曉得勾當了，我再與他個雙㮇燈。」又將一個蟲兒拋在他臉上。「兩個蟲兒，左進右出，右出左進，諒有一個安住。」那小妖兩三個大啊欠，把腰伸一伸，丟了火叉，也撲的睡倒，再不翻身。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 131
        "line_end": 131
    "translation_ja": |-
      これを聞き、悟空はこっそり笑わずにいられなかった。
      悟空「こののろまめ、冷たければまだ我慢できるが、熱くなれば命がなくなるのに。あと二度もこんなことを言えば、きっと気づかれてしまう。早く助けよう。待て、助けるには本来の姿を現さなければならない。姿を現せば、火を焚く十匹に見つかる。皆が騒いで妖王を起こしたら、また面倒だ。先にひとつ、術をお見舞いしてやろう」
      ふと思いついた。
      悟空「昔、大聖（たいせい）をしていたころ、北天門（ほくてんもん）で護国天王（ごこくてんのう）と数当て遊びをし、眠り虫（ねむりむし）を勝ち取ったことがあった。まだ何匹か残っているはずだ。あいつらにくれてやろう」
      腰の帯の中を探ると、十二匹残っていた。
      悟空「十匹やって、二匹は種に取っておこう」
      虫を放り、十匹の小妖の顔へ散らした。虫が鼻の穴へ入り込むと、彼らは次第にこっくりしはじめ、皆寝倒れた。ただ一匹、火掻き棒を持った者だけは寝つけず、頭を揉み顔をこすり、鼻を左から右からつまんでは、しきりにくしゃみをしていた。
      悟空「こいつ、仕掛けに気づいたな。もう一つ足して、二芯の灯にしてやろう」
      もう一匹、顔へ放る。
      悟空「二匹いれば、左から入って右から出たり、右から出て左から入ったりしても、どちらか一匹は居つくはずだ」
      その小妖は大あくびを二つ三つし、腰を伸ばして火掻き棒を放り出すと、ばたりと寝倒れた。もう寝返り一つ打たなかった。
    "translation_status": "draft"
  - "id": "xy-ch77-013"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「這法兒真是妙而且靈。」即現原身，走近前，叫聲：「師父。」唐僧聽見道：「悟空，救我啊。」沙僧道：「哥哥，你在外面叫哩？」行者道：「我不在外面，好和你們在裡邊受罪？」八戒道：「哥啊，溜撒的溜了，我們都是頂缸的，在此受悶氣哩。」行者笑道：「獃子莫嚷，我來救你。」八戒道：「哥啊，救便要脫根救，莫又要復蒸籠。」行者卻揭開籠頭，解了師父，將假變的毫毛抖了一抖，收上身來；又一層層放了沙僧，放了八戒。那獃子才解了，巴不得就要跑。行者道：「莫忙，莫忙。」卻又念聲咒語，發放了龍神，才對八戒道：「我們這去到西天，還有高山峻嶺。師父沒腳力難行，等我還將馬來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      悟空「この術は、まったく見事に効くものだ」
      悟空は元の姿を現し、近づいて呼んだ。
      悟空「お師匠さま」
      三蔵は声を聞いて答えた。
      三蔵「悟空、助けておくれ！」
      沙悟浄「兄さん、外から呼んでいるのですか」
      悟空「外にいなければ、お前たちと一緒に中で苦しんでいろというのか」
      八戒「兄貴、うまく逃げるやつだけ逃げて、俺たちは身代わりにされ、ここで蒸気に苦しめられているんだぞ」
      悟空は笑った。
      悟空「のろまめ、騒ぐな。助けに来たんだ」
      八戒「兄貴、助けるなら、根こそぎすっかり助けてくれ。また蒸籠へ戻されるのはごめんだ」
      悟空は蓋を開け、師の縄を解くと、偽物に変えていた毛をひと振りして自分の体へ戻した。それから一段ずつ沙悟浄と八戒を解放した。八戒は縄が解けるなり、今にも走りだしそうだった。
      悟空「待て、待て」
      悟空はもう一度呪文を唱え、竜王を帰したあとで八戒に言った。
      悟空「西天（さいてん）へ行くには、まだ高い山や険しい峰を越えねばならない。お師匠さまは乗り物がなければ旅が難しい。馬を連れてくるまで待っていろ」
    "translation_status": "draft"
  - "id": "xy-ch77-014"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他輕手輕腳，走到金鑾殿下，見那些大小群妖俱睡著了。卻解了韁繩，更不驚動。那馬原是龍馬，若是生人，飛踢兩腳，便嘶幾聲。行者曾養過馬，授弼馬溫之官，又是自家一夥，所以不跳不叫。悄悄的牽來，束緊了肚帶，扣備停當，請師父上馬。長老戰兢兢的騎上，也就要走。行者道：「也且莫忙。我們西去還有國王，須要關文，方才去得；不然，將甚執照？等我還去尋行李來。」唐僧道：「我記得進門時，眾怪將行李放在金殿左手下，擔兒也在那一邊。」行者道：「我曉得了。」即抽身跳在寶殿尋時，忽見光彩飄颻。行者知是行李。怎麼就知？以唐僧的錦襴袈裟上有夜明珠，故此放光。急到前，見擔兒原封未動，連忙拿了去，付與沙僧挑著。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      悟空はそろそろと足音を忍ばせて金鑾殿へ行くと、大きい妖怪も小さい妖怪も、皆眠っていた。手綱を解いても、騒ぎは起きなかった。馬はもともと竜馬なので、見知らぬ者なら二度ほど蹴りつけ、いなないたはずだ。だが悟空はかつて馬を飼い、弼馬温（ひつばおん）の役職を授けられたこともあり、しかも仲間だから、馬は跳ねも鳴きもしない。そっと引いてきて腹帯を締め、鞍の仕度を整えると、師に乗ってもらった。三蔵は震えながら馬にまたがり、すぐに出ようとした。
      悟空「まだお待ちください。西へ行けば、まだいくつも王国があります。通行の文書がなければ先へ行けません。なければ何を証明のしるしにします。もう一度、荷物を捜してきます」
      三蔵「門を入ったとき、妖怪たちは荷物を金殿の左手に置いたはずだ。天秤棒も同じ側にあったよ」
      悟空「承知しました」
      悟空は身を返して宝殿へ飛び込み、捜していると、ふと光が揺らめくのを見た。悟空には荷物だと分かった。なぜ分かったのか。三蔵の錦襴袈裟（きんらんげさ）には夜明珠（やめいしゅ）がついているので、それが光を放っていたのだ。急いで寄ると、荷は封も解かれず、元のままだった。すぐに持っていき、沙悟浄へ渡して担がせた。
    "translation_status": "draft"
  - "id": "xy-ch77-015"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒牽著馬，他引了路，徑奔正陽門。只聽得梆鈴亂響，門上有鎖，鎖上貼了封皮。行者道：「這等防守，如何去得？」八戒道：「後門裡去罷。」行者引路，徑奔後門，後宰門外也有梆鈴之聲，門上也有封鎖。「卻怎生是好？我這一番，若不為唐僧是個凡體，我三人不管怎的，也駕雲弄風走了。只為唐僧未超三界外，見在五行中，一身都是父母濁骨，所以不得昇駕，難逃。」八戒道：「哥哥，不消商量，我們到那沒梆鈴、不防衛處，撮著師父爬過牆去罷。」行者笑道：「這個不好。此時無奈，撮他過去；到取經回來，你這獃子口敞，延地裡就對人說，我們是爬牆頭的和尚了。」八戒道：「此時也顧不得行檢，且逃命去罷。」行者也沒奈何，只得依他，到那淨牆邊，算計爬出。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      八戒が馬を引き、悟空が先に立って、まっすぐ正陽門（せいようもん）へ向かった。拍子木と鈴がしきりに鳴り、門には錠が掛けられ、その上に封印の紙まで貼ってある。
      悟空「こんなに守りが固くては、どう出ればよいんだ」
      八戒「裏門から出よう」
      悟空はまた先に立ち、裏門へ直行した。ところが後宰門（こうさいもん）の外でも拍子木と鈴が鳴り、門にも同じように錠と封がしてあった。
      悟空「さて、どうすればよい。唐僧が生身の人間でさえなければ、俺たち三人は何とでも雲や風に乗って逃げられる。だが唐僧は、まだ三界（さんがい）を超えず、五行（ごぎょう）の中にいる。体じゅうが父母から受け継いだ俗の骨なのだから、空へ上がることができず、逃げるのが難しいんだ」
      八戒「兄貴、考えるまでもない。拍子木も鈴も鳴らず、見張りもいないところへ行って、お師匠さまを抱え、塀をよじ登って越そう」
      悟空は笑った。
      悟空「それはまずい。今は仕方なく抱えて越したとしても、経を取って帰ったら、口の軽いお前は、行く先々で俺たちが塀をよじ登る坊主だったと言いふらすだろう」
      八戒「こんなときに行いの品など構っていられるか。まずは命を助けよう」
      悟空もどうにもならず、八戒の言うとおり、人けのない塀際へ行き、よじ登って出る算段をした。
    "translation_status": "draft"
  - "id": "xy-ch77-016"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "噫！有這般事，也是三藏災星未脫。那三個魔頭在宮中正睡，忽然驚覺，說走了唐僧，一個個披衣忙起，急登寶殿。問曰：「唐僧蒸了幾滾了？」那些燒火的小妖已是有睡魔蟲，都睡著了，就是打也莫想打得一個醒來。其餘沒執事的，驚醒幾個，冒冒失失的答應道：「七、七、七、七滾了。」急跑近鍋邊，只見籠格子亂丟在地下，燒火的還都睡著。慌得又來報道：「大王，走、走、走、走了。」三個魔頭都下殿，近鍋前仔細看時，果見那籠格子亂丟在地下，湯鍋盡冷，火腳俱無。那燒火的俱呼呼鼾睡如泥。慌得眾怪一齊吶喊，都叫：「快拿唐僧！快拿唐僧！」這一片喊聲振起，把些前前後後、大大小小妖精，都驚起來，刀槍簇擁，至正陽門下。見那封鎖不動，梆鈴不絕。問外邊巡夜的道：「唐僧從那裡走了？」俱道：「不曾走出人來。」急趕至後宰門，封鎖、梆鈴，一如前門。復亂搶搶的燈籠火把，熯天通紅，就如白日，卻明明的照見他四眾爬牆哩。老魔趕近，喝聲：「那裡走？」那長老諕得腳軟觔麻，跌下牆來，被老魔拿住。二魔捉了沙僧，三魔擒倒八戒，眾妖搶了行李、白馬，只是走了行者。那八戒口裡嘓嘓噥噥的報怨行者道：「天殺的，我說要救便脫根救，如今卻又復籠蒸了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      ああ、こんなことが起こるのも、三蔵がまだ災いの星を逃れていなかったためである。宮中で眠っていた三人の妖王は、突然はっと目を覚まし、唐僧が逃げたと口にしながら、それぞれ急いで衣を羽織り、宝殿へ上がった。
      話者不明「唐僧は、何度煮立たせたところだ」
      火を焚いていた小妖たちは眠り虫のせいで寝入っており、殴っても一匹たりと起こせそうにない。ほかの、役目についていなかった者が何匹か驚いて起き、慌てふためいて答えた。
      小妖たち「な、な、な、七度です」
      急いで鍋のそばへ行くと、蒸籠の段はばらばらに地面へ放り出され、火焚きの者たちはまだ眠っている。慌てて戻り、報告した。
      小妖たち「大王、に、に、に、逃げました」
      三人の妖王も殿を下り、鍋へ寄ってよく見ると、確かに蒸籠の段が地面に散らかり、鍋の湯はすっかり冷え、燃えさしもなくなっていた。火焚きたちは、ぐうぐうと泥のように眠り込んでいる。妖怪たちは慌て、一斉に叫んだ。
      妖怪たち「唐僧を捕まえろ！　唐僧を捕まえろ！」
      どっと響く声に、前にも後ろにもいた大小すべての妖怪が目を覚まし、刀や槍を押し立てて正陽門へ詰めかけた。見ると錠も封もそのまま、拍子木と鈴も絶えず鳴っている。外で夜回りする者たちへ問いかけた。
      話者不明「唐僧は、どこから逃げた」
      巡夜の妖怪たち「外へ出てきた者など、おりません」
      急いで後宰門へ回ったが、錠も封も拍子木も鈴も、表の門と変わりがない。そこで入り乱れて提灯や松明を掲げると、空まで真っ赤に照らされ、昼のように明るくなった。そこに、師弟四人が塀をよじ登っている姿が、はっきり浮かび上がった。青毛獅子怪は追い寄って怒鳴った。
      青毛獅子怪「どこへ逃げる！」
      三蔵は恐ろしさに足が萎え、筋がしびれて塀から落ち、青毛獅子怪に捕らえられた。黄牙老象は沙悟浄をつかまえ、雲程万里鵬は八戒を取り押さえた。群がる妖怪たちは荷物と白馬を奪い返した。ただ悟空だけが逃げおおせた。八戒は口の中でぶつぶつと悟空を恨んだ。
      八戒「天罰でも当たれ。助けるならすっかり助けてくれと言ったのに、これじゃまた蒸籠で蒸されるじゃないか」
    "translation_status": "draft"
  - "id": "xy-ch77-017"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾魔把唐僧擒至殿上，卻不蒸了。二怪吩咐把八戒綁在殿前簷柱上，三怪吩咐把沙僧綁在殿後簷柱上；惟老魔把唐僧抱住不放。三怪道：「大哥，你抱住他怎的？終不然就活吃？卻也沒些趣味。此物比不得那愚夫俗子，拿了可以當飯；此是上邦稀奇之物，必須待天陰閑暇之時，拿他出來，整製精潔，猜枚行令，細吹細打的吃方可。」老魔笑道：「賢弟之言雖當，但孫行者又要來偷哩。」三魔道：「我這皇宮裡面有一座錦香亭子，亭子內有一個鐵櫃。依著我，把唐僧藏在櫃裡，關了亭子；卻傳出謠言，說唐僧已被我們夾生吃了，令小妖滿城講說。那行者必然來探聽消息，若聽見這話，他必死心塌地而去。待三五日不來攪擾，卻拿出來，慢慢受用。如何？」老怪、二怪俱大喜道：「是是是，兄弟說得有理。」可憐把個唐僧連夜拿將進去，藏在櫃中，閉了亭子；傳出謠言，滿城裡都亂講不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      妖怪たちは三蔵を殿上へ連行したが、今度は蒸さなかった。黄牙老象は八戒を殿の前の軒柱へ、雲程万里鵬は沙悟浄を裏の軒柱へ縛らせた。ただ青毛獅子怪だけは、三蔵を抱きかかえて離さない。
      雲程万里鵬「兄者、抱えていてどうする。まさか生きたまま食うつもりか。それでは趣がない。こいつは、捕まえたらすぐ飯にできる、そこらの愚かな俗人とは違う。大国から来た珍しい品なのだから、曇り空の暇なときを待って取り出し、きれいに調理して、数当てや酒席の遊びをしながら、じっくり丁寧に味わうべきだ」
      青毛獅子怪は笑った。
      青毛獅子怪「弟の言うことももっともだが、孫行者（そんぎょうじゃ）がまた盗みに来るぞ」
      雲程万里鵬「この皇宮には錦香亭（きんこうてい）というあずまやがあり、その中に鉄の櫃がある。俺に任せて、唐僧をその櫃へ隠し、亭の戸を閉めておこう。そして、唐僧はもう俺たちが生煮えのまま食ったと噂を流し、小妖たちに城じゅうで言いふらさせるのだ。行者はきっと様子を探りに来る。その話を聞けば、すっかり諦めて去るだろう。三日か五日、邪魔しに来なくなってから取り出し、ゆっくりいただこうではないか。どうだ」
      青毛獅子怪と黄牙老象は大喜びした。
      青毛獅子怪と黄牙老象「そうだ、そうだ。弟の言うとおりだ」
      哀れにも三蔵は、その夜のうちに運び込まれ、櫃の中へ隠された。亭の戸は閉められ、噂が流されて、城じゅうで騒がしく語られることになった。この話は、ひとまずここまでとする。
    "translation_status": "draft"
  - "id": "xy-ch77-018"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者自夜半顧不得唐僧，駕雲走脫。徑至獅駝洞裡，一路棍，把那萬數小妖盡情勦絕。急回來，東方日出。到城邊，不敢叫戰。正是：單絲不線，孤掌難鳴。他落下雲頭，搖身一變，變作個小妖兒，演入門裡，大街小巷，緝訪消息。滿城裡俱道：唐僧被大王夾生兒連夜吃了。前前後後，都是這等說。行者著實心焦。行至金鑾殿前觀看，那裡邊有許多精靈，都戴著皮金帽子，穿著黃布直身，手拿著紅漆棍，腰掛著象牙牌，一往一來，不住的亂走。行者暗想道：「此必是穿宮的妖怪，就變做這個模樣，進去打聽打聽。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      さて悟空は、夜半に三蔵を顧みることもできず、雲に乗って逃れた。まっすぐ獅駝洞（しだどう）へ向かい、行く手で棒を振るって、万を数える小妖たちを余すところなく皆殺しにした。急いで引き返すころには、東から日が昇っていた。城のそばに来たが、戦いを挑む勇気はない。まさに、一本の糸ではより糸にならず、片手だけでは音も鳴らない。雲を下りて身を振るわせ、一匹の小妖に変わると門から紛れ込み、大通りや路地で消息を探った。城じゅうの者が、唐僧は大王に昨夜、生煮えのまま食われたと言っている。どこへ行っても同じ話で、悟空は心底気をもんだ。金鑾殿の前まで来て眺めると、中には大勢の妖怪がいた。皆、金を張った帽子をかぶり、黄色い布の長衣を着て、紅漆の棒を持ち、腰には象牙の札を掛け、あちらこちらへ絶え間なく歩き回っている。
      悟空はひそかに考えた。「きっと宮中を出入りする妖怪どもだ。あれと同じ姿になって、中で探ってみよう」
    "translation_status": "draft"
  - "id": "xy-ch77-019"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，果然變得一般無二，混入金門。正走處，只見八戒綁在殿前柱上哼哩。行者近前，叫聲：「悟能。」那獃子認得聲音，道：「師兄，你來了？救我一救。」行者道：「我救你。你可知師父在那裡？」八戒道：「師父沒了，昨夜被妖精夾生兒吃了。」行者聞言，忽失聲淚似泉湧。八戒道：「哥哥莫哭，我也是聽得小妖亂講，未曾眼見。你休誤了，再去尋問尋問。」這行者卻才收淚，又往裡面找尋。忽見沙僧綁在後簷柱上，即近前摸著他胸脯子叫道：「悟淨。」沙僧也識得聲音，道：「師兄，你變化進來了？救我，救我。」行者道：「救你容易，你可知師父在那裡？」沙僧滴淚道：「哥啊，師父被妖精等不得蒸，就夾生兒吃了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空は本当に寸分違わぬ姿に変わり、金色の門へ紛れ込んだ。歩いていくと、八戒が殿の前の柱に縛られ、うめいているのが見えた。近寄って呼ぶ。
      悟空「悟能（ごのう）」
      八戒は声を聞き分けた。
      八戒「兄貴、来たのか。助けてくれよ」
      悟空「助けてやる。お師匠さまがどこにいるか知っているか」
      八戒「お師匠さまはもういない。昨夜、妖怪に生煮えのまま食われたんだ」
      悟空は聞くなり声を上げ、涙が泉のように湧き出た。
      八戒「兄貴、泣くな。俺も小妖どもが言いふらすのを聞いただけで、この目で見たわけじゃない。間違えるといけないから、もう一度、捜して聞いてみてくれ」
      悟空はようやく涙を抑え、さらに奥へ捜しに行った。沙悟浄が裏の軒柱に縛られているのを見つけると、近寄って胸に触れ、呼びかけた。
      悟空「悟浄（ごじょう）」
      沙悟浄もその声を聞き分けた。
      沙悟浄「兄さん、姿を変えて入ってきたのですか。助けてください、助けてください」
      悟空「お前を助けるのは簡単だ。お師匠さまがどこにいるか、知っているか」
      沙悟浄は涙をこぼした。
      沙悟浄「兄さん、お師匠さまは妖怪どもに、蒸し上がるのも待たず、生煮えのまま食われました」
    "translation_status": "draft"
  - "id": "xy-ch77-020"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖聽得兩個言語相同，心如刀攪，淚似水流。急縱身望空跳起，且不救八戒、沙僧，回至城東山上，按落雲頭，放聲大哭，叫道：「師父啊："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      二人の言葉が同じなのを聞き、悟空は心を刃でかき回される思いがして、涙が水のように流れた。八戒と沙悟浄をまだ助けず、急いで空へ跳び上がり、城の東の山へ戻って雲を下りると、大声で泣き叫んだ。
      悟空「お師匠さま！」
    "translation_status": "draft"
  - "id": "xy-ch77-021"
    "section_id": "chapter-77"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      恨我欺天困網羅，師來救我脫沉痾。
      潛心篤志同參佛，努力修身共煉魔。
      豈料今朝遭蜇害，不能保你上婆娑。
      西方勝境無緣到，氣散魂消怎奈何？」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 142
        "line_end": 145
    "translation_ja": |-
      悟空「天を欺いて囚われた、わが身が恨めしい。
      お師匠さまは私を救い、深い苦しみから解き放ってくださった。
      心をひそめ、志を固くし、ともに仏を仰ごうとし、
      懸命に身を修め、ともに魔を練り伏せてきたのに。
      今日、こんな毒害に遭おうとは、思いもしなかった。
      あなたを守り、婆娑（ばさ）の地までお連れすることもできなかった。
      西方のすぐれた境地へ至る縁もなく、
      気は散り、魂は消え、どうすればよいのでしょう」
    "translation_status": "draft"
  - "id": "xy-ch77-022"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者悽悽慘慘的自思自忖，以心問心道：「這都是我佛如來坐在那極樂之境，沒得事幹，弄了那三藏之經。若果有心勸善，理當送上東土，卻不是個萬古流傳？只是捨不得送去，卻教我等來取。怎知道苦歷千山，今朝到此喪命？罷罷罷，老孫且駕個觔斗雲，去見如來，備言前事。若肯把經與我送上東土，一則傳揚善果，二則了我等心願；若不肯與我，教他把鬆箍兒咒念念，退下這個箍子，交還與他，老孫還歸本洞，稱王道寡，耍子兒去罷。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      悟空は悲しみの底で思いを巡らし、自分の心に問いかけた。
      悟空「これというのも、如来（にょらい）さまが極楽の境地に座って、することがないから三蔵（さんぞう）という経典などというものをこしらえたせいだ。本当に善を勧める気があるのなら、東土（とうど）へ届けてくださればよい。そうすれば万代に伝わるではないか。ただ届けるのが惜しいばかりに、俺たちに取りに来させた。幾千もの山で苦労を重ね、今日ここで命を失うことになろうとは。ええい、もういい。筋斗雲に乗って如来に会い、これまでのことを一部始終話そう。経典を俺に渡して東土へ届けさせてくれるなら、一つには善い果報を広め、二つには俺たちの願いを果たせる。渡してくれないのなら、この輪を緩める呪文を唱えてもらい、頭の輪を外して返そう。そして俺は元の洞へ帰り、王だ殿だと威張って、気楽に遊んで暮らせばいい」
    "translation_status": "draft"
  - "id": "xy-ch77-023"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，急翻身，駕起觔斗雲，徑投天竺，那裡消一個時辰，早望見靈山不遠。須臾間，按落雲頭，直至鷲峰之下。忽擡頭，見四大金剛擋住道：「那裡走？」行者施禮道：「有事要見如來。」當頭又有崑崙山金霞嶺不壞尊王永住金剛喝道：「這猢猻甚是粗狂。前者大困牛魔，我等為汝努力，今日面見，全不為禮。有事且待先奏，奉召方行。這裡比南天門不同，教你進去出來，兩邊亂走？咄！還不靠開。」那大聖正是煩惱處，又遭此搶白，氣得哮吼如雷，忍不住大呼小叫，早驚動如來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      悟空はすぐに身を翻し、筋斗雲を駆って、まっすぐ天竺（てんじく）へ向かった。一時辰（いちじしん）もかからぬうちに、もう霊山（れいざん）がすぐ近くに見えた。ほどなく雲を下り、鷲峰（じゅほう）の麓へ来た。ふと顔を上げると、四大金剛（しだいこんごう）が道をふさいだ。
      四大金剛「どこへ行く」
      悟空は礼をした。
      悟空「用事があって、如来さまにお目にかかりたいのです」
      その正面で、崑崙山（こんろんざん）金霞嶺（きんかれい）の不壊尊王永住金剛（ふえそんのうえいじゅうこんごう）が怒鳴った。
      永住金剛（えいじゅうこんごう）「この猿め、まったく無作法なやつだ。先だって牛魔王（ぎゅうまおう）を追い詰めたとき、我らはお前のために力を尽くした。それなのに、今日は顔を合わせても、少しも礼を尽くさぬ。用があるなら、まず取り次ぐまで待て。お召しを受けてから進むのだ。ここは南天門（なんてんもん）とは違う。勝手に入ったり出たり、あちらこちらへ歩き回らせるものか。こら、まだ脇へ寄らぬか」
      悟空はただでさえ悩みのただ中にいるところへ、このように面と向かって叱りつけられた。怒って雷のように吠え、こらえきれず大声でわめき立てたので、早くも如来に聞こえた。
    "translation_status": "draft"
  - "id": "xy-ch77-024"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "如來佛祖正端坐在九品寶蓮臺上，與十八尊輪世的阿羅漢講經，即開口道：「孫悟空來了，汝等出去接待接待。」大眾阿羅遵佛旨，兩路幢幡寶蓋，即出山門應聲道：「孫大聖，如來有旨相喚哩。」那山門口四大金剛卻才閃開路，讓行者前進。眾阿羅引至寶蓮臺下，見如來倒身下拜，兩淚悲啼。如來道：「悟空，有何事這等悲啼？」行者道：「弟子屢蒙教訓之恩，託庇在佛爺爺之門下。自歸正果，保護唐僧，拜為師範，一路上苦不可言。今至獅駝山獅駝洞、獅駝城，有三個毒魔，乃獅王、象王、大鵬，把我師父捉將去，連弟子一概遭迍，都綑在蒸籠裡，受湯火之災。幸弟子脫逃，喚龍王救免。是夜偷出師等，不料災星難脫，復又擒回。及至天明，入城打聽，叵耐那魔十分狠毒，萬樣驍勇，把師父連夜夾生吃了，如今骨肉無存。又況師弟悟能、悟淨，見綁在那廂，不久性命亦皆傾矣。弟子沒及奈何，特地到此參拜如來。望大慈悲，將鬆箍咒兒念念，退下我這頭上箍兒，交還如來，放我弟子回花果山寬閑耍子去罷。」說未了，淚如泉湧，悲聲不絕。如來笑道：「悟空少得煩惱。那妖精神通廣大，你勝不得他，所以這等心痛。」行者跪在下面，搥著胸膛道：「不瞞如來說，弟子當年鬧天宮，稱大聖，自為人以來，不曾吃虧，今番卻遭這毒魔之手。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      如来は九品宝蓮台（くほんほうれんだい）に端然と座り、世を巡る十八尊の阿羅漢（あらかん）に経を説いていた。そこで口を開いた。
      如来「孫悟空（そんごくう）が来た。皆、出て迎えてやりなさい」
      阿羅漢たちは仏の旨を受け、幢幡（どうばん）と宝蓋（ほうがい）を二列に連ねて山門を出ると、声を掛けた。
      阿羅漢たち「孫大聖（そんたいせい）、如来のお召しです」
      山門の四大金剛もようやく道を開け、悟空を先へ通した。阿羅漢たちに導かれて宝蓮台（ほうれんだい）の下へ来た悟空は、如来を見ると身を投げ出して拝み、涙を流して泣いた。
      如来「悟空、何があって、それほど泣くのだ」
      悟空「弟子の私は、たびたび教えを授けていただき、仏さまの門下に身を寄せ、そのお庇護を受けております。正しい道へ帰ってから、唐僧を師と仰ぎ、その護衛をしてまいりましたが、旅の苦しみは言葉にもできません。今、獅駝山（しださん）の獅駝洞と獅駝城（しだじょう）まで来たところ、獅王（しおう）、象王（ぞうおう）、大鵬（たいほう）という三人の毒々しい妖怪がおりまして、お師匠さまをさらっていきました。私たち弟子もことごとく災いに遭い、縛られて蒸籠へ入れられ、熱湯と火の責めに遭ったのです。幸い私は抜け出し、竜王を呼んで救ってもらいました。その夜、師たちをひそかに連れ出したのですが、災いの星からは逃れられず、また捕らえられてしまいました。夜が明け、城へ入って消息を尋ねたところ、憎いことに、あの妖怪はこの上なく残酷で、ひどく強暴なやつらでして、お師匠さまを夜のうちに生煮えのまま食ってしまい、今は骨も肉も残っていないとのことです。しかも弟弟子の悟能と悟浄は、今もあちらに縛られ、間もなく二人とも命を失うでしょう。私にはもう打つ手がなく、わざわざここへ如来さまを拝みに参りました。どうか大慈悲をもって、輪を緩める呪文を唱え、私の頭の輪を外してください。如来さまへお返しし、弟子は花果山（かかざん）へ帰り、のんびり遊んで暮らしたいのです」
      話し終わらぬうちから、涙は泉のように湧き出て、悲しい声は絶えなかった。如来は笑って言った。
      如来「悟空、そう思い悩むな。あの妖怪は神通力が大きく、お前には勝てぬ。それで、そのように心を痛めているのだ」
      悟空は下にひざまずき、胸をたたいた。
      悟空「如来さまには隠しません。私は昔、天宮を騒がせ、大聖と名乗って以来、これまで生きてきて一度も引けを取ったことがありません。それが今度は、あの毒々しい妖怪の手に落ちたのです」
    "translation_status": "draft"
  - "id": "xy-ch77-025"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "如來聞言道：「你且休恨，那妖精我認得他。」行者猛然失聲道：「如來，我聽見人講說，那妖精與你有親哩。」如來道：「這個刁猢猻，怎麼個妖精與我有親？」行者笑道：「不與你有親，如何認得？」如來道：「我慧眼觀之，故此認得。那老怪與二怪有主。」叫：「阿儺、迦葉，來，你兩個分頭駕雲去五臺山、峨眉山，宣文殊、普賢來見。」二尊者即奉旨而去。如來道：「這是老魔、二怪之主。但那三怪，說將起來，也是與我有些親處。」行者道：「親是父黨？母黨？」如來道：「自那混沌分時，天開於子，地闢於丑，人生於寅。天地再交合，萬物盡皆生。萬物有走獸飛禽，走獸以麒麟為之長，飛禽以鳳凰為之長。那鳳凰又得交合之氣，育生孔雀、大鵬。孔雀出世之時最惡，能吃人，四十五里路，把人一口吸之。我在雪山頂上，修成丈六金身，早被他也把我吸下肚去。我欲從他便門而出，恐污真身。是我剖開他脊背，跨上靈山。欲傷他命，當被諸佛勸解：傷孔雀如傷我母。故此留他在靈山會上，封他做佛母孔雀大明王菩薩。大鵬是與他一母所生，故此有些親處。」行者聞言笑道：「如來，若這般比論，你還是妖精的外甥哩。」如來道：「那怪須是我去，方可收得。」行者叩頭，啟上如來：「千萬望挪玉一降。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      如来は聞いて言った。
      如来「もう恨むな。その妖怪なら、私も知っている」
      悟空は思わず声を上げた。
      悟空「如来さま、あの妖怪は、あなたと親戚だという話を聞いたことがあります」
      如来「このずる賢い猿め。どうして妖怪が私の親戚になるのだ」
      悟空は笑った。
      悟空「親戚でもないのに、どうしてご存じなのです」
      如来「慧眼（えげん）で見通したから知っているのだ。青毛獅子怪と黄牙老象には主人がいる」
      如来は呼んだ。
      如来「阿儺（あなん）、迦葉（かしょう）、こちらへ。二人で手分けして五台山（ごだいさん）と峨眉山（がびさん）へ雲を駆り、文殊（もんじゅ）と普賢（ふげん）を呼んで来なさい」
      二尊者はただちに命を受けて出かけた。
      如来「この二菩薩が、第一と第二の妖王の主人なのだ。ただし第三の妖怪については、話してみれば、確かに私とも多少の縁がある」
      悟空「父方の親戚ですか、それとも母方ですか」
      如来「混沌が分かれたとき、子（ね）に天が開け、丑（うし）に地が開け、寅（とら）に人が生まれた。そのあと天地が再び交わり、万物がことごとく生まれた。万物には走る獣と飛ぶ鳥があり、獣は麒麟（きりん）を長とし、鳥は鳳凰（ほうおう）を長とする。その鳳凰もまた交わりの気を受け、孔雀（くじゃく）と大鵬を産んだ。孔雀は生まれたころ、この上なく凶悪で、人を食い、四十五里先の人間までひと息に吸い込めた。私は雪山（せっせん）の頂で、丈六（じょうろく）の金身（こんじん）を成就したところを、孔雀に腹の中へ吸い込まれてしまった。尻の穴から出ようとしたが、真なる身を汚すのを恐れた。そこで背中を切り開いて抜け出し、霊山へ上がったのだ。孔雀の命を奪おうとすると、諸仏に取りなされた。孔雀を殺すことは、自分の母を殺すのと同じだというのだ。それゆえ霊山の会座にとどめ、仏母孔雀大明王菩薩（ぶつもくじゃくだいみょうおうぼさつ）に封じた。大鵬は、その孔雀と同じ母から生まれている。だから多少の縁があるというわけだ」
      悟空は聞いて笑った。
      悟空「如来さま、その勘定なら、あなたは妖怪の甥ではありませんか」
      如来「あの妖怪は、私が出向いてこそ捕らえられる」
      悟空は頭を下げ、如来へ願い出た。
      悟空「どうか何とぞ、おみずからお出ましください」
    "translation_status": "draft"
  - "id": "xy-ch77-026"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "如來即下蓮臺，同諸佛眾，徑出山門。又見阿儺、迦葉引文殊、普賢來見，二菩薩對佛禮拜。如來道：「菩薩之獸，下山多少時了？」文殊道：「七日了。」如來道：「山中方七日，世上幾千年。不知在那廂傷了多少生靈，快隨我收他去。」二菩薩相隨左右，同眾飛空。只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      如来は蓮台（れんだい）を下り、諸仏とともに、まっすぐ山門を出た。そこへ阿儺と迦葉が文殊菩薩（もんじゅぼさつ）と普賢菩薩（ふげんぼさつ）を案内して来たので、二菩薩は仏に礼拝した。
      如来「菩薩たちの獣は、山を下りてからどれほどになる」
      文殊菩薩「七日になります」
      如来「山中ではわずか七日でも、世では幾千年にもなる。向こうで、どれほど多くの命を損なったことか。早く私についてきて、捕らえなさい」
      二菩薩は左右に従い、一同とともに空を飛んだ。そのありさまはこうだ。
    "translation_status": "draft"
  - "id": "xy-ch77-027"
    "section_id": "chapter-77"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      滿天縹緲瑞雲分，我佛慈悲降法門。
      明示開天生物理，細言闢地化身文。
      面前五百阿羅漢，腦後三千揭諦神。
      迦葉阿儺隨左右，普文菩薩殄妖氛。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 153
        "line_end": 156
    "translation_ja": |-
      空いっぱいにたなびく、めでたい雲が左右へ分かれ、
      わが仏は慈悲をもって、仏法の門から下界へ降りる。
      天を開き、生き物を生じた理を明らかに示し、
      地を開き、身を現した話を細かに説く。
      前には五百の阿羅漢、後ろには三千の掲諦神（ぎゃていしん）。
      迦葉と阿儺が左右に従い、普賢と文殊の菩薩が妖気を払い尽くす。
    "translation_status": "draft"
  - "id": "xy-ch77-028"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖有此人情，請得佛祖與眾前來，不多時，早望見城池。行者報道：「如來，那放黑氣的乃是獅駝國也。」如來道：「你先下去，到那城中，與妖精交戰，許敗不許勝。敗上來，我自收他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      悟空にはこれほどの縁があり、如来と一同を連れて来ることができた。ほどなく城が見えたので、悟空は申し上げた。
      悟空「如来さま、あの黒い気を噴き出しているのが獅駝国（しだこく）です」
      如来「お前は先に下り、城へ行って妖怪と戦え。負けるのはよいが、勝ってはならぬ。負けてこちらへ上がってくれば、私が捕らえよう」
    "translation_status": "draft"
  - "id": "xy-ch77-029"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖即按雲頭，徑至城上，腳踏著垛兒罵道：「潑孽畜！快出來與老孫交戰。」慌得那城樓上小妖急跳下城中報道：「大王，孫行者在城上叫戰哩。」老妖道：「這猴兒兩三日不來，今朝卻又叫戰，莫不是請了些救兵來耶？」三怪道：「怕他怎的？我們都去看來。」三個魔頭，各持兵器，趕上城來，見了行者，更不打話，舉兵器一齊亂刺；行者掄鐵棒掣手相迎。鬥經七八回合，行者佯輸而走。那妖王喊聲大振，叫道：「那裡走？」大聖觔斗一縱，跳上半空；三個精即駕雲來趕。行者將身一閃，藏在佛爺爺金光影裡，全然不見。只見那過去、未來、見在的三尊佛像與五百阿羅漢、三千揭諦神，佈散左右，把那三個妖王圍住，水泄不通。老魔慌了手腳，叫道：「兄弟，不好了，那猴子真是個地裡鬼，那裡請得個主人公來也。」三魔道：「大哥休得悚懼，我們一齊上前，使槍刀搠倒如來，奪他那雷音寶剎。」這魔頭不識起倒，真個舉刀上前亂砍。卻被文殊、普賢念動真言，喝道：「這孽畜還不皈正，更待怎生？」諕得老怪、二怪不敢撐持，丟了兵器，打個滾，現了本相。二菩薩將蓮花臺拋在那怪的脊背上，飛身跨坐，二怪遂泯耳皈依。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空はすぐに雲を下げ、城壁へまっすぐ飛ぶと、狭間に足を掛けて罵った。
      悟空「ろくでなしの畜生ども！　早く出てきて、この俺と勝負しろ！」
      城楼の小妖は慌て、城内へ跳び下りて知らせた。
      小妖「大王、孫行者が城壁の上で戦いを挑んでおります」
      青毛獅子怪「あの猿、二、三日来なかったのに、今朝また戦いを挑むとは、何か援軍を呼んだのではないか」
      雲程万里鵬「何を恐れることがある。皆で見に行こう」
      三人の妖王はおのおの武器を手に城壁へ駆け上がり、悟空を見るなり、言葉も交わさず一斉に突きかかった。悟空も鉄棒を振るい、素早く迎え撃った。七、八合打ち合うと、悟空は負けたふりをして逃げた。妖王の声がひときわ高く響く。
      話者不明「どこへ逃げる！」
      悟空がひとつ宙返りして空中へ跳ぶと、三人も雲に乗って追った。悟空は身をかわし、仏の金色の光の陰へ隠れ、すっかり見えなくなった。そこには過去・未来・現在の三尊の仏の姿と、五百の阿羅漢、三千の掲諦神が左右に広がり、三人の妖王を水も漏らさぬほどに取り囲んでいた。青毛獅子怪はうろたえて叫んだ。
      青毛獅子怪「弟たち、まずいぞ。あの猿は本当に何でも知り尽くしたやつだ。どこから主人まで呼んできたのだ」
      雲程万里鵬「兄者、怖がるな。皆で一斉に向かい、槍と刀で如来を突き倒して、あの雷音（らいおん）の宝刹を奪ってしまおう」
      この妖王は進退のほどもわきまえず、本当に刀を振り上げて、やたらと斬りかかった。ところが文殊菩薩と普賢菩薩が真言（しんごん）を唱え、叱りつけた。
      文殊菩薩と普賢菩薩「この畜生ども、まだ正道へ帰らぬか。いつまでそうしているつもりだ」
      青毛獅子怪と黄牙老象は恐れ、もう抵抗できず、武器を捨ててひと転がりし、本来の姿を現した。二菩薩は蓮花の台をそれぞれの背へ投げ、身を躍らせてまたがった。二匹は耳を伏せ、帰依した。
    "translation_status": "draft"
  - "id": "xy-ch77-030"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二菩薩既收了青獅、白象，只有那第三個妖魔不伏。騰開翅，丟了方天戟，扶搖直上，掄利爪要叼捉猴王。原來大聖藏在光中，他怎敢近。如來情知此意，即閃金光，把那鵲巢貫頂之頭迎風一幌，變做鮮紅的一塊血肉。妖精掄利爪叼他一下。被佛爺把手往上一指，那妖翅膊上就了筋，飛不去，只在佛頂上不能遠遁，現了本相，乃是一個大鵬金翅鵰。即開口對佛應聲叫道：「如來，你怎麼使大法力困住我也？」如來道：「你在此處多生孽障，跟我去，有進益之功。」妖精道：「你那裡持齋把素，極貧極苦；我這裡吃人肉，受用無窮。你若餓壞了我，你有罪愆。」如來道：「我管四大部洲，無數眾生瞻仰，凡做好事，我教他先祭汝口。」那大鵬欲脫難脫，要走怎走，是以沒奈何，只得皈依。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      二菩薩はこうして青い獅子と白い象を収めたが、第三の妖王、雲程万里鵬だけは従わなかった。両翼を広げ、方天戟を投げ捨て、つむじ風に乗ってまっすぐ上がると、鋭い爪を振るって悟空をつかもうとした。だが悟空は光の中に隠れており、近寄ることなどできない。如来はその狙いを知り、金色の光を引くと、カササギが巣を結んだという頭を風に向かってひと振りし、鮮やかに赤い血肉の塊へ変えた。雲程万里鵬が鋭い爪でひとかきすると、仏は手を上へ向けて指し示した。すると妖怪の翼の筋が引きつって、飛べなくなり、仏の頭上から遠くへ逃れることもできず、本来の姿を現した。それは一羽の大鵬金翅鵰（たいほうきんしちょう）であった。雲程万里鵬は口を開き、仏へ叫んだ。
      雲程万里鵬「如来、なぜ大きな法力で俺を閉じ込めるのだ」
      如来「お前はこの地で多くの悪業を作った。私とともに来れば、修行が進む功もあろう」
      雲程万里鵬「お前のところは精進ばかりで、ひどく貧しく苦しい。俺はここで人肉を食い、尽きぬ楽しみを味わっている。俺を飢えさせたら、お前の罪だぞ」
      如来「私は四大部洲（しだいぶしゅう）を治め、数え切れぬ生き物たちが仰ぎ慕っている。善い供養をする者には皆、まずお前の口へ供えるようにさせよう」
      雲程万里鵬は逃れたくても逃れられず、去ろうにもどこへ行けようか。どうにもならず、ただ帰依するほかなかった。
    "translation_status": "draft"
  - "id": "xy-ch77-031"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者方才轉出，向如來叩頭道：「佛爺，你今收了妖精，除了大害，只是沒了我師父也。」大鵬咬著牙恨道：「潑猴頭！尋這等狠人困我。你那老和尚幾曾吃他？如今在那錦香亭鐵櫃裡不是？」行者聞言，忙叩頭謝了佛祖。佛祖不敢鬆放了大鵬，也只教他在光焰上做個護法，引眾回雲，徑歸寶剎。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      悟空はようやく光の陰から出て、如来に頭を下げた。
      悟空「仏さま、今や妖怪を捕らえ、大きな害を除いてくださいました。けれど、お師匠さまはもうおりません」
      雲程万里鵬は歯を食いしばり、恨めしげに言った。
      雲程万里鵬「ろくでなしの猿め！　こんな手厳しい者を呼んで、俺を閉じ込めおって。あの坊主を、いつ俺たちが食ったというのだ。今も錦香亭の鉄の櫃の中にいるではないか」
      悟空は聞くと、急いで如来に頭を下げ、礼を述べた。如来は雲程万里鵬をうかつに解き放つことはできず、自分の光の炎の上にとどめ、護法（ごほう）の役をさせることにした。そして一同を率いて雲を返し、まっすぐ宝刹へ戻った。
    "translation_status": "draft"
  - "id": "xy-ch77-032"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者卻按落雲頭，直入城裡，那城裡一個小妖兒也沒有了。正是：蛇無頭而不行，鳥無翅而不飛。他見佛祖收了妖王，各自逃生而去。行者才解救了八戒、沙僧，尋著行李、馬匹，與他二人說：「師父不曾吃，都跟我來。」引他兩個徑入內院，找著錦香亭，打開門看，內有一個鐵櫃，只聽得三藏有啼哭之聲。沙僧使降妖杖打開鐵鎖，揭開櫃蓋，叫聲：「師父。」三藏見了，放聲大哭道：「徒弟啊，怎生降得妖魔？如何得到此尋著我也？」行者把上項事從頭至尾，細說了一遍。三藏感謝不盡。師徒們在那宮殿裡尋了些米糧，安排些茶飯，飽吃一餐，收拾出城，找大路投西而去。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      悟空が雲を下り、まっすぐ城へ入ると、小妖は一匹もいなくなっていた。まさに、蛇は頭がなければ進めず、鳥は翼がなければ飛べない。彼らは如来が妖王を収めたのを見ると、それぞれ命を守って逃げ去ったのだ。悟空はようやく八戒と沙悟浄を解放し、荷物と馬を捜し出すと、二人に言った。
      悟空「お師匠さまは食われていなかった。二人ともついてこい」
      二人を率いて奥の庭へ直行し、錦香亭を見つけて戸を開けると、中には鉄の櫃があり、三蔵の泣く声が聞こえた。沙悟浄が降妖杖（ごうようじょう）で鉄の錠を打ち壊し、櫃の蓋を開けて呼んだ。
      沙悟浄「お師匠さま」
      三蔵は弟子たちを見て、声を上げて泣いた。
      三蔵「お前たち、どうやって妖怪を降したのだ。どうしてここへ来て、私を見つけられたのだね」
      悟空はこれまでの出来事を、初めから終わりまで詳しく語った。三蔵は感謝してもしきれなかった。師弟は宮殿の中で米や食糧を少し見つけ、茶と食事を整え、腹いっぱい一食を済ませた。それから仕度をして城を出ると、大道を捜して西へ向かった。まさに、こういうことである。
    "translation_status": "draft"
  - "id": "xy-ch77-033"
    "section_id": "chapter-77"
    "kind": "verse"
    "origin": "source"
    "source_text": "真經必得真人取，意嚷心勞總是虛。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      真の経は、必ず真の人が取りに行くもの。
      思いを騒がせ、心を疲れさせても、すべてはむなしい。
    "translation_status": "draft"
  - "id": "xy-ch77-034"
    "section_id": "chapter-77"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟這一去，不知幾時得面如來，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch77-1455626"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第077回&oldid=1455626"
        "line_start": 167
        "line_end": 167
    "translation_ja": "さて、この先いつになれば、如来とお顔を合わせられるのだろうか。それは次回の物語でお聞きいただこう。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-01-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の本性は本来の心のあり方、真如は分別を離れた真実のあり方をいう。『一體』は一つの体・一まとまりとなるという表現を残した。回題だけから特定の人物の正体や結末を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-02-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この戦闘賦は六人の姿・武器を、六悪・六根・六欲・六門・六道へ重ね、『六』を反復する。六根と六門は眼・耳・鼻・舌・身・意をいうが、六悪や六欲を一つの教義の固定した六項目へ割り当てるだけの説明は本文にない。『三十六宮春自在』は邵雍の三十六宮と春の詩句に通じ、易の卦を配する体系を連想させる。蔡之洪『鳳巖集』巻十にも六十四卦と三十六宮の説明がある。ただしここでの各語の一対一の寓意は確定できず、『六六形色恨有名』の構文にも解釈の余地がある。数と形色・名・憎しみの関係を残し、一義的な内丹の解説へ置き換えなかった。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-03-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "結びの『倒不是綑住行者，分明是與他送行』は、捕縛と見送りを逆説的に対比した語り手自身の予告である。訳者の先取りではないため残すが、具体的な抜け出し方はここへ補わない。一扇九万里、二扇で追いつくこと、筋斗雲の十万八千里という数も原文どおり。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-04-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "蒸籠の上から蒸気が回り、下段で滞れば半年焚いても上がらないという説明は、悟空が妖怪の手際を見抜くために語る理屈である。現代の加熱調理の保証ではない。八戒を下段へ置く命令、皮を剝く提案、裏返せば両面とも蒸されるという八戒の恐れを、冗談だからと省かない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-05-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『將真身出神』は、毛で身代わりを作った後、本身が神通で空中へ出る動作として訳した。魂だけが抜け、肉体は依然として縛られたという二重の身体設定は原文に補わない。続く蒸籠の段数は、八戒、沙悟浄、身代わりの悟空、三蔵の順に一〜四段。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-06-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の名乗りは『北海小龍敖順』。北海を治める役割に従って既知の北海竜王へ接続する。西海竜王にも敖順という表記が出ることがあるが、それを理由に二人を同一視したり、この原文を敖閏へ書き換えたりしない。呪文は浄法界真言に関わる句と『易』乾卦の句を組み合わせた表記を保つ。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-07-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "四昼夜という期間は青毛獅子怪の発言どおり。ここまでの夜の進みは二更、三更の終わり、五更を待つという順だが、見送りと戦闘の経過をこの発言に合わせて新しく引き延ばしたり、過去の日数を訂正したりしない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-08-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『寒濕氣の病』は冷えや湿気を病因とみなす当時の表現。八戒が蒸気を欲しがる理由として残すが、病名を現代医学の特定の診断へ決めず、治療の助言としない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-09-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この回の回想は『北天門』『護國天王』である。第二十五回では同種の虫を『東天門』『增長天王』との数当てで得たと語る。門と天王の相違は底本のまま残し、護国天王を増長天王やほかの四天王の別名だと断定しない。ここで回想される虫と、毛を虫に変えた別場面の来歴も区別する。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-10-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『雙㮇燈』は底本の珍字を保持する。虫をもう一匹加えることを、灯芯を二つにした灯にたとえると解して訳したが、語全体の同時代辞書による確定はできていない。『㮇』を一般字へ無断で改めず、比喩の細部は留保する。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-11-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この原文段落は悟空の発話を開く鉤括弧はあるが、末尾の閉じ鉤括弧がない。原文欄には補わず、日本語では馬を取りに行くという言葉の後で閉じ、続く語り手の行動描写と区別した。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-12-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三界と五行を超えていないという言い方は、生身の三蔵と術を使える弟子たちを分ける物語上の説明。『父母濁骨』を親に由来する汚れた人格という意味へ変えず、父母から生まれた俗界の肉体として訳した。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-13-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここは三人の妖王が出てきた後の『問曰』で、どの一人が尋ねたかは示されない。同じ段落の巡夜への問いも個人名がないため、話者不明とする。『七、七、七、七滾』は慌ててどもる声であり、二十八回煮たという計算ではない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-14-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "錦香亭はこの獅駝国の皇宮にある亭であり、烏鶏国の皇后がいた同名の亭とは別の場所。三日か五日待つことと、生煮えのまま食ったという噂は、雲程万里鵬の提案である。実際に食べ終えた事実へ置き換えない。『細吹細打』は丁寧に念を入れる口ぶりとして訳し、明記されていない楽団などを新たに登場させない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-15-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『皮金帽子』。皮金の細かな製法・素材の内訳は確定できないため、金を表面に施した帽子という広い表現にとどめた。『直身』はここでは丈の長い衣として訳す。皮製の帽子だと断定する補足はしない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-16-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "師が食われたという二人の言葉は、悟空が聞いた証言であり、語り手の保証ではない。八戒は自分の目で見たわけでないと明言している。沙悟浄の断言と、二人の言葉が同じだから信じる悟空の受け止め方を、そのまま区別して残した。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-17-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『婆娑』で、通常の仏教語『娑婆』とは字の順が逆である。文脈では師を連れて行こうとした仏の地を指すと解して訳したが、一般の娑婆世界の定義へ機械的に合わせたり、極楽浄土という別の固有名へ改めたりしない。読みと語義の細部は留保する。詩の『蜇害』も底本の字を保存し、毒を受けるような害の意味を残した。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-18-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『十八尊輪世的阿羅漢』。輪世は世を巡ることとして訳したが、任期交替などの具体的な制度は補わない。十八という人数はここでの原文どおりであり、別の数へ統一しない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-19-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここまでの親族譚は如来の説明、その結論として如来を妖怪の甥とするのは悟空の冗談である。鳳凰が孔雀と大鵬を産むこと、孔雀が如来を吞むこと、背から出た如来にとって孔雀を殺すのは母を殺すのに等しいという諸仏の言葉、仏母孔雀大明王菩薩への授名という順を保った。一般の鳥類学や仏教全体に共通する系譜として保証しない。孔雀大明王菩薩という既知の称号には接続するが、孔雀経という経典の略名とは区別する。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-20-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『山中方七日，世上幾千年』という如来の言葉をそのまま残す。七日を現代の時間へ換算したり、以前に語られた地上の日数と算術的に整合させたりしない。文殊が七日と答え、普賢はここでは個別に発言しない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-21-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空は夜明けに噂を聞き、一時辰もかからず霊山に着いたと語られているが、ここでは青毛獅子怪が『兩三日不來』と言う。途中の数日を訳者が補って説明せず、語りと発言の時間差を底本のまま保つ。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-22-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『那妖王』の追跡の叫びは個人が特定されないため、話者不明とした。『地裡鬼』は事情に通じた者をののしる言い方として訳す。三魔の提案に続く『這魔頭』が刀で斬りかかる叙述は、個人の指示先に揺れがあるため『この妖王』のまま保持した。方天戟や槍を刀へ一律に変更しない。過去・未来・現在の『三尊佛像』についても、原文にない三尊の固有名を付けない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-23-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の『鵲巢貫頂』は、仏が苦行・禅定する間に頭へカササギが巣を作ったという伝承を踏まえた表現。袾宏『正訛集』の巣頂灌膝にも、深い禅定ゆえに気づかなかったという説明がある。ここでは単に髪型の描写へ消さず、その伝承への含みを残した。 直前の『閃金光』は金色の光を一時的に退ける動きと解したが、光をきらめかせる意味にも取り得るため、細かな動作の解釈には留保がある。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-24-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『凡做好事』はこの供食の約束では、善い功徳を積む供養として訳した。人間のあらゆる善行が必ず食物を伴うという規則へ広げない。大鵬の食人への執着と如来への罪の非難、如来の食の保証、逃げられず帰依するという強制性を弱めていない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-25-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "如来は『不敢鬆放』、すなわち、うかつに解き放つことはできず、大鵬を光焔上の護法とする。帰依のあと自由に放した、心から改心した、あるいは故郷へ帰したという結末は原文にない。"
    "translation_status": "draft"
  - "id": "xy-ch77-note-26-body"
    "section_id": "chapter-77"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『意嚷心勞』。嚷の騒ぐ意味を生かして訳し、意乱などの字へ校訂しない。真人はここでは真の境地にある人をいう含みを保つが、師弟の誰かに新しい正式称号を授けたとは扱わない。"
    "translation_status": "draft"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-001"
      "description_ja": "回題の本性は本来の心のあり方、真如は分別を離れた真実のあり方をいう。『一體』は一つの体・一まとまりとなるという表現を残した。回題だけから特定の人物の正体や結末を補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-003"
      "description_ja": "この戦闘賦は六人の姿・武器を、六悪・六根・六欲・六門・六道へ重ね、『六』を反復する。六根と六門は眼・耳・鼻・舌・身・意をいうが、六悪や六欲を一つの教義の固定した六項目へ割り当てるだけの説明は本文にない。『三十六宮春自在』は邵雍の三十六宮と春の詩句に通じ、易の卦を配する体系を連想させる。蔡之洪『鳳巖集』巻十にも六十四卦と三十六宮の説明がある。ただしここでの各語の一対一の寓意は確定できず、『六六形色恨有名』の構文にも解釈の余地がある。数と形色・名・憎しみの関係を残し、一義的な内丹の解説へ置き換えなかった。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-008"
      "description_ja": "『將真身出神』は、毛で身代わりを作った後、本身が神通で空中へ出る動作として訳した。魂だけが抜け、肉体は依然として縛られたという二重の身体設定は原文に補わない。続く蒸籠の段数は、八戒、沙悟浄、身代わりの悟空、三蔵の順に一〜四段。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-009"
      "description_ja": "底本の名乗りは『北海小龍敖順』。北海を治める役割に従って既知の北海竜王へ接続する。西海竜王にも敖順という表記が出ることがあるが、それを理由に二人を同一視したり、この原文を敖閏へ書き換えたりしない。呪文は浄法界真言に関わる句と『易』乾卦の句を組み合わせた表記を保つ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-010"
      "description_ja": "四昼夜という期間は青毛獅子怪の発言どおり。ここまでの夜の進みは二更、三更の終わり、五更を待つという順だが、見送りと戦闘の経過をこの発言に合わせて新しく引き延ばしたり、過去の日数を訂正したりしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-011"
      "description_ja": "『寒濕氣の病』は冷えや湿気を病因とみなす当時の表現。八戒が蒸気を欲しがる理由として残すが、病名を現代医学の特定の診断へ決めず、治療の助言としない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-012"
      "description_ja": "この回の回想は『北天門』『護國天王』である。第二十五回では同種の虫を『東天門』『增長天王』との数当てで得たと語る。門と天王の相違は底本のまま残し、護国天王を増長天王やほかの四天王の別名だと断定しない。ここで回想される虫と、毛を虫に変えた別場面の来歴も区別する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-012"
      "description_ja": "『雙㮇燈』は底本の珍字を保持する。虫をもう一匹加えることを、灯芯を二つにした灯にたとえると解して訳したが、語全体の同時代辞書による確定はできていない。『㮇』を一般字へ無断で改めず、比喩の細部は留保する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-013"
      "description_ja": "この原文段落は悟空の発話を開く鉤括弧はあるが、末尾の閉じ鉤括弧がない。原文欄には補わず、日本語では馬を取りに行くという言葉の後で閉じ、続く語り手の行動描写と区別した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-016"
      "description_ja": "ここは三人の妖王が出てきた後の『問曰』で、どの一人が尋ねたかは示されない。同じ段落の巡夜への問いも個人名がないため、話者不明とする。『七、七、七、七滾』は慌ててどもる声であり、二十八回煮たという計算ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-017"
      "description_ja": "錦香亭はこの獅駝国の皇宮にある亭であり、烏鶏国の皇后がいた同名の亭とは別の場所。三日か五日待つことと、生煮えのまま食ったという噂は、雲程万里鵬の提案である。実際に食べ終えた事実へ置き換えない。『細吹細打』は丁寧に念を入れる口ぶりとして訳し、明記されていない楽団などを新たに登場させない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-018"
      "description_ja": "原文は『皮金帽子』。皮金の細かな製法・素材の内訳は確定できないため、金を表面に施した帽子という広い表現にとどめた。『直身』はここでは丈の長い衣として訳す。皮製の帽子だと断定する補足はしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-021"
      "description_ja": "原文は『婆娑』で、通常の仏教語『娑婆』とは字の順が逆である。文脈では師を連れて行こうとした仏の地を指すと解して訳したが、一般の娑婆世界の定義へ機械的に合わせたり、極楽浄土という別の固有名へ改めたりしない。読みと語義の細部は留保する。詩の『蜇害』も底本の字を保存し、毒を受けるような害の意味を残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-024"
      "description_ja": "原文は『十八尊輪世的阿羅漢』。輪世は世を巡ることとして訳したが、任期交替などの具体的な制度は補わない。十八という人数はここでの原文どおりであり、別の数へ統一しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-025"
      "description_ja": "ここまでの親族譚は如来の説明、その結論として如来を妖怪の甥とするのは悟空の冗談である。鳳凰が孔雀と大鵬を産むこと、孔雀が如来を吞むこと、背から出た如来にとって孔雀を殺すのは母を殺すのに等しいという諸仏の言葉、仏母孔雀大明王菩薩への授名という順を保った。一般の鳥類学や仏教全体に共通する系譜として保証しない。孔雀大明王菩薩という既知の称号には接続するが、孔雀経という経典の略名とは区別する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-026"
      "description_ja": "『山中方七日，世上幾千年』という如来の言葉をそのまま残す。七日を現代の時間へ換算したり、以前に語られた地上の日数と算術的に整合させたりしない。文殊が七日と答え、普賢はここでは個別に発言しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-029"
      "description_ja": "悟空は夜明けに噂を聞き、一時辰もかからず霊山に着いたと語られているが、ここでは青毛獅子怪が『兩三日不來』と言う。途中の数日を訳者が補って説明せず、語りと発言の時間差を底本のまま保つ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-029"
      "description_ja": "『那妖王』の追跡の叫びは個人が特定されないため、話者不明とした。『地裡鬼』は事情に通じた者をののしる言い方として訳す。三魔の提案に続く『這魔頭』が刀で斬りかかる叙述は、個人の指示先に揺れがあるため『この妖王』のまま保持した。方天戟や槍を刀へ一律に変更しない。過去・未来・現在の『三尊佛像』についても、原文にない三尊の固有名を付けない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-030"
      "description_ja": "原文の『鵲巢貫頂』は、仏が苦行・禅定する間に頭へカササギが巣を作ったという伝承を踏まえた表現。袾宏『正訛集』の巣頂灌膝にも、深い禅定ゆえに気づかなかったという説明がある。ここでは単に髪型の描写へ消さず、その伝承への含みを残した。 直前の『閃金光』は金色の光を一時的に退ける動きと解したが、光をきらめかせる意味にも取り得るため、細かな動作の解釈には留保がある。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-030"
      "description_ja": "『凡做好事』はこの供食の約束では、善い功徳を積む供養として訳した。人間のあらゆる善行が必ず食物を伴うという規則へ広げない。大鵬の食人への執着と如来への罪の非難、如来の食の保証、逃げられず帰依するという強制性を弱めていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-031"
      "description_ja": "如来は『不敢鬆放』、すなわち、うかつに解き放つことはできず、大鵬を光焔上の護法とする。帰依のあと自由に放した、心から改心した、あるいは故郷へ帰したという結末は原文にない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch77-1455626"
      "segment_ids":
        - "xy-ch77-033"
      "description_ja": "原文は『意嚷心勞』。嚷の騒ぐ意味を生かして訳し、意乱などの字へ校訂しない。真人はここでは真の境地にある人をいう含みを保つが、師弟の誰かに新しい正式称号を授けたとは扱わない。 原文の欠落ではなく、解釈・校訂上の留保。"

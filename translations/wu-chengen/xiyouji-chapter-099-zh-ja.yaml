  "known_gaps":
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-001"
      "description_ja": "回題の固定表示は『九九數完魔剗一作「滅」盡　三三行滿道歸根』で、「一作『滅』」は剗の異文を示す電子編注である。原文欄では取得表示の鉤括弧も含めてそのまま保存した。訳は魔を払い尽くす意味を採った。九九は九掛ける九の八十一、三三は修行の充足を表す数の象徴だが、その具体的な修行分類は断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-003"
      "description_ja": "難簿の第二十一難は、第二十八回の回題「黑松林三藏逢魔」と、その後の宝象国の事件へつながる回顧。烏巣禅師の予言に出る同名の林や、後に縛られた女の妖怪を助けた林と、同じ場所だと表記だけで断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-003"
      "description_ja": "第三十九難の固定表示は「兜本作“⿰山兜”，Unicode缺字山遇怪」。中央の「本作“⿰山兜”，Unicode缺字」は、元の字が山偏と兜を組み合わせた字だとする電子編注である。原文ではこの文字列を一字も変えず保存し、訳は表示の代用字に従って兜山とした。欠字に勝手なUnicode文字を割り当てず、金兜山の事件を振り返る略表記と解する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-003"
      "description_ja": "難簿は第一から第八十までの八十件を、それぞれの番号とともに訳した。以前の物語を細分した項目や、三蔵本人だけでなく弟子たちに起きた出来事も含む。過去の本文と順序・表現が完全には重ならない所も、帳面の記述を修正しない。第三十三の「搬運車遲」は車遅国の荷運び、第三十九から第四十一は金兜山の魔物、第五十の「賽城」は祭賽国の都、第六十一の「獅駝」は獅駝嶺の苦難に対応させた。第三十七の天河は、この旅の回顧では通天河を指す。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-009"
      "description_ja": "この詩は、仏教の不二・三乗と、道教の丹・九転を重ねる。人天は人と天上の世界、本来の面目は本来備わる真実の姿をいう。「一體原因」は、一体となった根本の因が全うされる意として訳したが、個々の修行段階への対応は未確定。「還元」と老黿の「黿」には中国語の同音の響きがある。挑包・飛杖の神通を、特定の既存人物の逸話に断定はしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-010"
      "description_ja": "老黿の「歸著之事」は、自分の修行の行き着く先を問う言葉として「行く末」とした。以前の渡河時には、長年修行しているが人の姿を得られないと述べ、いつそうなれるかを如来に尋ねてほしいと三蔵へ頼んでいた。この回はさらに「あと何年の寿命があるか」とも問う。両者を一つの問いへ修正しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-012"
      "description_ja": "固定本文の「熌」は、前後の雷・風・霧と対になる稲妻として訳し、原字は原文欄に保持した。「熌掣紅銷」は赤い光がひらめいて消える姿、「烈石」は岩を裂く意に解した。「驚蟄」はここでは雷に虫が驚く描写として読み、暦の二十四節気の日付に限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-015"
      "description_ja": "「須知水勝真經伏」は構文が圧縮された難句。「水勝」「真經伏」を、経が水を吸い切り、法身に押さえられて守られたという直前の説明に沿って訳した。劉一明『西遊原旨』の同句に対する注は錬丹の「沐浴溫養」と解するが、これは後世の寓意解釈であり、固定底本文そのものの確定語釈とはしない。同書には周囲の詩句にも異文があるため、本文の置換には用いない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-017"
      "description_ja": "原文は陳澄への呼びかけを「二老官」とし、「你家替祭兒子」と述べる。一方、以前の陳家の説明では陳澄が兄で一秤金の父、陳清が弟で陳関保の父だった。ここは底本の呼びかけと発言を保ち、陳澄の名前を陳清へ直したり、兄弟や子供の関係を逆転したりしない。家全体の子をいう可能性はあるが確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-018"
      "description_ja": "三蔵が「凡胎を脱いで成仏した」、悟空が「もとより火で煮炊きする食事をしない」、八戒が急に胃腸が弱った、という語りや発言をそのまま訳した。以前の食事描写と合うように「今から食べなくなった」などへ変更しない。ここで語られる成仏を、まだ本文にない正式な仏号の授与へ置き換えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-019"
      "description_ja": "宝常経は、取経の経典目録にも載る名。現存大蔵経の特定の経への同定は未確定であり、宝積経などのよく知られた経名へ勝手に訂正しない。本文は一巻を唱えたと述べるので、その数を保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-020"
      "description_ja": "「柏」は中国語の樹木名で、一般にコノテガシワなどの常緑針葉樹を指し、日本語の日常語の落葉樹のカシワと同一とは限らない。「地龍」は地勢や山脈を竜になぞらえる語として訳し、生きた別の竜が出現したとはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch99-1558059"
      "segment_ids":
        - "xy-ch99-024"
      "description_ja": "「如如」は変わることのない真実のあり方を表す仏教語として、真如に沿って訳した。「主人」は主たる存在を指すが、本文だけでは特定の一人か、修行上の内的な主宰をいうかを断定しない。次の回の出来事を、この詩の確定した実行内容として先取りしない。 原文の欠落ではなく、解釈・校訂上の留保。"

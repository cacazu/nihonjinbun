    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們口裡紛紛的講，足下徐徐的行，直至水邊。忽聽得有人叫道：「唐聖僧，唐聖僧，這裡來，這裡來。」四眾皆驚。舉頭觀看，四無人跡，又沒舟船，卻是一個大白賴頭黿在岸邊探著頭叫道：「老師父，我等了你這幾年，卻才回也？」行者笑道：「老黿，向年累你，今歲又得相逢。」三藏與八戒、沙僧都歡喜不盡。行者道：「老黿，你果有接待之心，可上岸來。」那黿即縱身爬上河來。行者叫把馬牽上他身，八戒還蹲在馬尾之後，唐僧站在馬頸左邊，沙僧站在右邊。行者一腳踏著老黿的項，一腳踏著老黿的頭叫道：「老黿，好生走穩著。」那老黿蹬開四足，踏水面如行平地，將他師徒四眾，連馬五口，馱在身上，徑回東岸而來。誠所謂："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 174
        "line_end": 174
        "source_sequence": 8
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      師弟はあれこれ話しながら、足はゆっくり進め、水際まで来た。すると突然、呼ぶ声がした。
      呼ぶ声「唐の聖僧さま、唐の聖僧さま。こちらへ、こちらへ。」
      四人は驚き、顔を上げて見た。四方には人影も船もない。ただ、大きな白い、頭の禿げた黿（げん）が、岸辺から首を伸ばして呼んでいた。以前、一行を渡してくれた老黿（ろうげん）である。
      老黿「お師匠さま、この何年もお待ちしていましたが、ようやくのお帰りですか。」
      悟空は笑った。
      悟空「老黿、あの年は世話になったな。今年もこうして会えた。」
      三蔵も八戒も沙悟浄も、大喜びだった。
      悟空「老黿、本当に俺たちを迎える気があるなら、岸へ上がってくれ。」
      老黿はすぐに身を躍らせ、川からはい上がった。悟空は馬をその背へ引き上げさせた。八戒はまた馬の尾の後ろにしゃがみ、三蔵は馬の首の左、沙悟浄は右に立った。悟空は片足を老黿の首筋に、もう片足を頭に乗せて声をかけた。
      悟空「老黿、しっかり、揺らさず歩いてくれよ。」
      老黿は四本の足を蹴り出し、水面を平地のように歩いた。師弟四人と馬を合わせた五つの命を背負い、まっすぐ東岸へ向かった。まさしく、こういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch99-009"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      不二門中法奧玄，諸魔戰退識人天。
      本來面目今方見，一體原因始得全。
      秉證三乘隨出入，丹成九轉任周旋。
      挑包飛杖通休講，幸喜還元遇老黿。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 176
        "line_end": 179
        "source_sequence": 9
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      不二の門（ふにのもん）の内に、法の奥深い玄理がある。あまたの魔を退け、人と天の境地を知る。
      今ようやく本来の面目（ほんらいのめんもく）を見いだし、一つであった根本の因が、初めて全うされる。
      三乗（さんじょう）の悟りを身に備え、自在に出入りする。丹は九転（きゅうてん）を遂げ、思うままに巡る。
      荷を担ぐ術や杖を飛ばす神通は、もう語るまい。根源へ帰る折に老黿に会えたことが、何よりありがたい。
    "translation_status": "reviewed"
  - "id": "xy-ch99-010"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老黿馱著他們，屣波踏浪，行經多半日，將次天晚，好近東岸，忽然問曰：「老師父，我向年曾央到西方見我佛如來，與我問聲歸著之事，還有多少年壽，果曾問否？」原來那長老自到西天玉真觀沐浴，凌雲渡脫胎，步上靈山，專心拜佛，及參諸佛菩薩聖僧等眾，意念只在取經，他事一毫不理，所以不曾問得老黿年壽，無言可答。卻又不敢欺，打誑語，沉吟半晌，不曾答應。老黿即知不曾替他問了，就將身一幌，唿喇的淬下水去，把他四眾連馬并經，通皆落水。咦！還喜得唐僧脫了胎，成了道；若似前番，已經沉底。又幸白馬是龍，八戒、沙僧會水，行者笑微微顯大神通，把唐僧扶駕出水，登彼東岸。只是經包、衣服、鞍轡俱濕了。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 180
        "line_end": 180
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      老黿は一行を背負い、波を踏み分けて半日以上も進んだ。日が暮れかけ、東岸にもう近いというところで、不意に尋ねた。
      老黿「お師匠さま、あの年お願いしましたね。西方で如来（にょらい）さまにお会いになったら、私の行く末と、あと何年の寿命があるかをお尋ねいただきたいと。お聞きいただけましたか。」
      ところが三蔵は、西天（さいてん）の玉真観（ぎょくしんかん）で沐浴し、凌雲渡で俗世の肉体を脱ぎ、霊山（れいざん）へ上ってからは、ひたすら仏を拝むことに心を注いでいた。諸仏、菩薩、聖僧らにお目にかかった時も、念頭にあったのは経を頂くことだけで、ほかのことには少しも心を向けなかった。そのため、老黿の寿命を尋ねてはおらず、返す言葉がない。かといって、だまして嘘をつくこともできず、しばらく言いよどんだまま返事をしなかった。
      老黿は、自分の代わりに尋ねてもらえなかったとすぐに悟った。そこで体を一つ揺すり、ざぶりと水中へ潜ったので、四人も馬も経も、すべて水に落ちてしまった。
      ああ、それでも三蔵が俗世の肉体を脱ぎ、道を得ていたのは幸いだった。以前のままなら、もう川底に沈んでいただろう。そのうえ白馬は竜であり、八戒も沙悟浄も水に慣れていた。悟空は微笑みながら大神通を現し、三蔵を支えて水から運び出すと、東岸へ上がった。ただ、経の包みも衣服も、鞍も手綱も、すっかり濡れていた。
    "translation_status": "reviewed"
  - "id": "xy-ch99-011"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒方登岸整理，忽又一陣狂風，天色昏暗，雷閃並作，走石飛沙。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 182
        "line_end": 182
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": "師弟がようやく岸へ上がり、荷を整えようとした時、不意にまた狂風が起こった。空は暗くなり、雷鳴と稲妻が一斉に起こり、石が走り、砂が舞った。そのありさまとは。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-012"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": "一陣風，乾坤播蕩；一聲雷，振動山川。一個熌，鑽雲飛火；一天霧，大地遮漫。風氣呼號，雷聲激烈。熌掣紅銷，霧迷星月。風鼓的沙塵撲面，雷驚的虎豹藏形。熌晃的飛禽叫噪，霧漫的樹木無蹤。那風攪得個通天河波浪翻騰，那雷振得個通天河魚龍喪膽。那熌照得個通天河徹底光明，那霧蓋得個通天河岸崖昏慘。好風，頹山烈石松篁倒。好雷，驚蟄傷人威勢豪。好熌，流天照野金蛇走。好霧，混混漫空蔽九霄。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 184
        "line_end": 184
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      一陣の風が、天地を揺さぶる。一声の雷が、山川を震わせる。
      一筋の稲妻が、雲を突き抜け火を飛ばす。空一面の霧が、大地をすっぽり覆う。
      風はうなり、雷は激しくとどろく。稲妻は赤い光をひらめかせて消え、霧は星と月を隠す。
      風のあおる砂ぼこりは顔を打ち、雷に驚いた虎や豹は身を潜める。
      稲妻に照らされた鳥は鳴き騒ぎ、霧に包まれた木々は姿を消す。
      その風は通天河をかき乱し、波を逆巻かせる。その雷は通天河を震わせ、魚や竜の肝を潰す。
      その稲妻は通天河を川底まで明るく照らし、その霧は通天河を覆って、岸の崖を暗く沈ませる。
      すさまじい風よ、山を崩し、岩を裂き、松や竹を倒す。
      すさまじい雷よ、地中の虫を驚かせ、人を傷つける、その威勢の激しさ。
      すさまじい稲妻よ、天を流れ、野を照らし、金色の蛇が走る。
      すさまじい霧よ、混沌と空へ広がり、九重の天を覆い隠す。
    "translation_status": "reviewed"
  - "id": "xy-ch99-013"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "諕得那三藏按住了經包，沙僧壓住了經擔，八戒牽住了白馬；行者卻雙手輪起鐵棒，左右護持。原來那風、霧、雷、熌，乃是些陰魔作號，欲奪所取之經。勞攘了一夜，直到天明，卻才止息。長老一身水衣，戰兢兢的道：「悟空，這是怎的起？」行者氣呼呼的道：「師父，你不知就裡。我等保護你取獲此經，乃是奪天地造化之功，可以與乾坤並久，日月同明，壽享長春，法身不朽。此所以為天地不容，鬼神所忌，欲來暗奪之耳。一則這經是水濕透了；二則是你的正法身壓住，雷不能轟，電不能照，霧不能迷；又是老孫輪著鐵棒，使純陽之性，護持住了；及至天明，陽氣又盛：所以不能奪去。」三藏、八戒、沙僧方才省悟，各謝不盡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 185
        "line_end": 185
        "source_sequence": 13
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      三蔵は驚いて経の包みを手で押さえ、沙悟浄は経の荷を押さえ、八戒は白馬を引き留めた。悟空は両手で鉄棒を振るい、左右を守った。
      実は、風も霧も雷も稲妻も、陰魔（いんま）どもが騒ぎを起こしたものだった。一行の手に入れた経を奪おうとしていたのである。騒ぎは一晩中続き、夜が明けて、ようやく収まった。全身びしょ濡れの衣をまとった三蔵は、震えながら尋ねた。
      三蔵「悟空、どうしてこんなことが起きたのだ。」
      悟空は息を荒くして答えた。
      悟空「お師匠さまは、この内情をご存じないのです。私たちがあなたを守って手に入れたこの経には、天地が万物を生み出す働きをも奪い取る力があります。天地とともに久しく、日月とともに輝き、いつまでも春のような寿命を楽しみ、法身（ほっしん）も朽ちることがありません。だから天地にも容れられず、鬼神にも妬まれ、ひそかに奪いに来たのです。
      ですが、一つには経が水を吸い切っていたこと。二つには、お師匠さまの正しい法身がそれを押さえていたこと。そのため雷も打ち砕けず、稲妻も照らして害を及ぼせず、霧も惑わすことができませんでした。そのうえ私が鉄棒を振るい、純陽（じゅんよう）の性を発揮して守りました。夜が明けると陽の気がさらに盛んになったので、とうとう奪えなかったのです。」
      三蔵、八戒、沙悟浄はようやく事情を悟り、それぞれいくら感謝してもしきれない思いだった。
    "translation_status": "reviewed"
  - "id": "xy-ch99-014"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "少頃，太陽高照。卻移經於高崖上，開包曬晾。至今彼處曬經之石尚存。他們又將衣鞋都曬在崖傍，立的立，坐的坐，跳的跳。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 187
        "line_end": 187
        "source_sequence": 14
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": "やがて太陽が高く昇った。一行は経を高い崖の上へ移し、包みを開けて干した。その場所には今も、経を干した石が残っている。衣服も履物も崖のそばに干し、立つ者、座る者、跳ねる者と、思い思いに過ごした。まことに、こういうことである。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-015"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      一體純陽喜向陽，陰魔不敢逞強梁。
      須知水勝真經伏，不怕風雷熌霧光。
      自此清平歸正覺，從今安泰到仙鄉。
      曬經石上留蹤跡，千古無魔到此方。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 189
        "line_end": 192
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      一身に純陽を備え、喜んで陽に向かう。陰魔も、もはや強暴を振るえない。
      水が勝り、真経（しんぎょう）が落ち着いて守られたことを知れ。風も雷も、稲妻の光も霧も恐れはしない。
      これより清らかに穏やかに、正しい悟りへ帰り、これより安らかに、仙境へ至る。
      経を干した石には、その跡が残る。千年の後までも、この地へ魔が来ることはない。
    "translation_status": "reviewed"
  - "id": "xy-ch99-016"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他四眾檢看經本，一一曬晾，早見幾個打魚人來到河邊，擡頭看見。內有認得的道：「老師父可是前年過此河往西天取經的？」八戒道：「正是，正是。你是那裡人？怎麼認得我們？」漁人道：「我們是陳家莊上人。」八戒道：「陳家莊離此有多遠？」漁人道：「過此衝南有二十里就是也。」八戒道：「師父，我們把經搬到陳家莊上曬去，他那裡有住有坐，又有得吃，就教他家與我們漿漿衣服，卻不是好？」三藏道：「不去罷，在此曬乾了，就收拾找路回也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 193
        "line_end": 193
        "source_sequence": 16
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      四人が経を調べ、一冊ずつ干していると、何人かの漁師が川辺へやって来て、顔を上げ、一行を見た。そのうち、見覚えのある一人が尋ねた。
      漁師「お坊さまは、一昨年この川を渡り、西天へ経を取りに行かれた方ではありませんか。」
      八戒「そうだ、そうだ。お前はどこの人だ。どうして俺たちを知ってるんだ。」
      漁師「私どもは、陳家荘の者です。」
      八戒「陳家荘までは、どれほどある。」
      漁師「この谷あいを越え、南へ二十里ほどです。」
      八戒「お師匠さま、経を陳家荘まで運んで、あそこで干そうよ。泊まる所も座る所もあるし、食べ物もある。衣服に糊をつけて仕上げてもらえば、ちょうどいいじゃないか。」
      三蔵「行くのはよそう。ここで乾かしたら荷をまとめ、道を探して帰るとしよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch99-017"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那幾個漁人行過南衝，恰遇著陳澄，叫道：「二老官，前年在你家替祭兒子的師父回來了。」陳澄道：「你在那裡看見？」漁人回指道：「都在那石上曬經哩。」陳澄隨帶了幾個佃戶，走過衝來望見，跑近前跪下道：「老爺取經回來，功成行滿，怎麼不到舍下，卻在這裡盤弄？快請，快請到舍。」行者道：「等曬乾了經，和你去。」陳澄又問道：「老爺的經典、衣物，如何濕了？」三藏道：「昔年虧白黿馱渡河西，今年又蒙他馱渡河東。已將近岸，被他問昔年託問佛祖壽年之事，我本未曾問得，他遂淬在水內，故此濕了。」又將前後事細說了一遍。那陳澄拜請甚懇，三藏無已，遂收拾經卷。不期石上把《佛本行經》沾住了幾卷，遂將經尾沾破了。所以至今《佛本行經》不全，曬經石上猶有字跡。三藏懊悔道：「是我們怠慢了，不曾看顧得。」行者笑道：「不在此，不在此。蓋天地不全，這經原是全全的，今沾破了，乃是應不全之奧妙也，豈人力所能與耶？」師徒們果收拾畢，同陳澄赴莊。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 194
        "line_end": 194
        "source_sequence": 17
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      その漁師たちは南の谷あいを過ぎたところで、折よく陳澄（ちんちょう）に出会い、声をかけた。
      漁師たち「二番目の旦那さま、一昨年、お宅の坊ちゃんの代わりに生贄になってくださったお坊さまたちが、お帰りですよ。」
      陳澄「どこで見かけたのだね。」
      漁師たちは振り向いて指さした。
      漁師たち「あの石の上で、皆さん経を干しておられます。」
      陳澄はすぐに何人かの小作人を連れ、谷あいを越えてきた。一行を見つけると走り寄り、ひざまずいた。
      陳澄「お坊さま、お経をお取りになり、務めも修行も果たしてのお帰りなのに、どうして我が家へおいでにならず、こんな所で荷をいじっておられるのです。どうぞ、どうぞ我が家へ。」
      悟空「経が乾くのを待って、一緒に行こう。」
      陳澄「お経もお召し物も、どうして濡れてしまったのですか。」
      三蔵「あの年は白黿のおかげで西岸へ渡れました。今年も背に乗せてもらい、東岸へ渡っていたのです。もう岸に近づいた時、以前、仏祖に尋ねてほしいと頼まれていた寿命のことを聞かれました。私はお尋ねしないままでしたので、白黿が水中へ潜り、こうして濡れてしまったのです。」
      三蔵はその前後の出来事も、詳しく一通り話した。陳澄が拝んで熱心に招くので、三蔵も断りきれず、経を片づけることにした。ところが思いがけず、『仏本行経（ぶつほんぎょうきょう）』の数巻が石に貼りつき、巻末が破れて石に残ってしまった。そのため、今も『仏本行経』は完全な形ではなく、経を干した石にはなお文字の跡があるという。
      三蔵は後悔した。
      三蔵「私たちがうかつだった。十分に気をつけなかったのだ。」
      悟空は笑った。
      悟空「そういうことではありません、そういうことでは。天地ですら完全ではないのです。この経はもともとすっかりそろっていましたが、今、貼りついて破れたことで、完全ではないという玄妙な理にかなったのです。人の力でどうこうできることでしょうか。」
      師弟は荷をすべて整えると、陳澄とともに荘へ向かった。
    "translation_status": "reviewed"
  - "id": "xy-ch99-018"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那莊上人家，一個傳十，十個傳百，百個傳千，若老若幼，都來接看。陳清聞說，就擺香案在門前迎迓，又命鼓樂吹打。少頃到了，迎入。陳清領合家人眷，俱出來拜見，拜謝昔日救兒女之恩。隨命看茶擺齋。三藏自受了佛祖的仙品、仙餚，又脫了凡胎成佛，全不思凡間之食。二老苦勸，沒奈何，略見他意。孫大聖自來不吃煙火食，也道：「夠了。」沙僧也不甚吃。八戒也不似前番，就放下碗。行者道：「獃子也不吃了？」八戒道：「不知怎麼，脾胃一時就弱了。」遂此收了齋筵，卻又問取經之事。三藏又將先至玉真觀沐浴，凌雲渡身輕，及至雷音寺參如來，蒙珍樓賜宴，寶閣傳經，始被二尊者討人事未遂，故傳無字之經，後復拜告如來，始得授一藏之數，并白黿淬水，陰魔暗奪之事，細細陳了一遍，就欲拜別。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 195
        "line_end": 195
        "source_sequence": 18
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      荘では一人が十人へ、十人が百人へ、百人が千人へと知らせ、老いも若きも、皆が迎えに出て一行を見ようとした。陳清（ちんせい）は知らせを聞くと、門前に香炉を置いた台を用意して迎え、楽隊にも笛や太鼓を鳴らさせた。ほどなく一行が着くと、家の中へ迎え入れた。陳清は家族を残らず連れて出て礼拝し、あの時、息子と娘を救ってくれた恩に感謝した。そしてすぐ、茶を出し、精進料理を並べるよう命じた。
      三蔵は仏祖の仙界の食べ物や料理を頂き、俗世の肉体を脱いで仏となっていたので、人間の食べ物など少しも欲しくなかった。二人の老人が強く勧めるので、やむなく、心遣いに応じて少し口をつけた。悟空はもともと、人間が火で煮炊きする食べ物を食べないので、やはり言った。
      悟空「もう十分だよ。」
      沙悟浄もあまり食べなかった。八戒まで以前とは違い、椀を置いた。
      悟空「とんま、お前まで、もう食わないのか。」
      八戒「どうしたものか、急に胃腸が弱くなっちまってな。」
      こうして膳を下げると、今度は取経のことを尋ねられた。三蔵は、まず玉真観で沐浴し、凌雲渡で身が軽くなったこと、雷音寺（らいおんじ）で如来にお目にかかり、珍楼で宴を賜り、宝閣（ほうかく）で経を授けられたことを話した。初めは二人の尊者が心付けを求めたが受け取れなかったので、字のない経を渡されたこと、その後ふたたび如来にお願いして、ようやく一蔵（いちぞう）分の経を授かったこと、さらに白黿が水へ潜ったことや、陰魔がひそかに経を奪おうとしたことまで、詳しく一通り語り、別れの礼をしようとした。
    "translation_status": "reviewed"
  - "id": "xy-ch99-019"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那二老舉家如何肯放，且道：「向蒙救拔兒女，深恩莫報。已創建一座院宇，名之曰救生寺，專侍奉香火不絕。」又喚出原替祭之兒女陳關保、一秤金叩謝。復請至寺觀看。三藏卻又將經包兒收在他家堂前，與他念了一卷《寶常經》。後至寺中，只見陳家又設饌在此。還不曾坐下，又一起來請。還不曾舉箸，又一起來請。絡繹不絕，爭不上手。三藏俱不敢辭，略略見意。只見那座寺果蓋得齊整："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 197
        "line_end": 197
        "source_sequence": 19
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      だが、二人の老人も家族一同も、どうして帰すものかと言うのだった。
      陳澄と陳清「以前、子供たちを救っていただいた深いご恩には、とても報いきれません。すでに一つの寺を建て、救生寺（きゅうしょうじ）と名づけました。ひたすら皆さまをお祀りし、香火を絶やさぬようにしております。」
      そして、あの時一行が身代わりに生贄となった子供たち、陳関保（ちんかんほう）と一秤金（いっしょうきん）を呼び出し、頭を地につけてお礼をさせた。さらに寺を見に来てほしいと招いた。
      三蔵はいったん経の包みを陳家の広間の前に置き、その家のために『宝常経（ほうじょうきょう）』を一巻唱えた。それから寺へ行くと、陳家はそこにも料理を用意していた。まだ座りもしないうちに、また別の一組が招きに来た。まだ箸を持ちもしないうちに、また別の一組が招きに来た。人は途切れず、競い合って、もてなす順番も取れないほどだった。三蔵はどれも断りかね、少しずつ口をつけて心遣いに応えた。その寺は、実に見事に造られていた。
    "translation_status": "reviewed"
  - "id": "xy-ch99-020"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": "山門紅粉膩，多賴施主功。一座樓臺從此立，兩廊房宇自今興。朱紅隔扇，七寶玲瓏。香氣飄雲漢，清光滿太空。幾株嫩柏還澆水，數榦喬松未結叢。活水迎前，通天疊疊翻波浪；高崖倚後，山脈重重接地龍。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 198
        "line_end": 198
        "source_sequence": 20
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      山門の紅い塗りは艶やかで、すべて施主の功による。
      ここに楼閣がそびえ立ち、今や両側の回廊と房舎も興った。
      朱塗りの仕切り戸は鮮やかで、七宝（しっぽう）の飾りは精妙に輝く。
      香の匂いは天の川へ漂い、清らかな光は大空を満たす。
      若い柏（はく）の数株には、まだ水が注がれている。高い松も幾本かあるが、まだ林にはなっていない。
      前には流れが迎え、通天河は重なり合って波を翻す。
      後ろには高い崖が寄り添い、幾重もの山並みが大地の竜のようにつながる。
    "translation_status": "reviewed"
  - "id": "xy-ch99-021"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏看畢，才上高樓。樓上果裝塑著他四眾之像。八戒看見，扯著行者道：「兄長的相兒甚像。」沙僧道：「二哥，你的又像得緊，只是師父的又忒俊了些兒。」三藏道：「卻好，卻好。」遂下樓來。下面前殿後廊，還有擺齋的候請。行者卻問：「向日大王廟兒如何了？」眾老道：「那廟當年拆了。老爺，這寺自建立之後，年年成熟，歲歲豐登，卻是老爺之福庇。」行者笑道：「此天賜耳，與我們何與？但只我們自今去後，保你這一莊上人家子孫繁衍，六畜安生，年年風調雨順，歲歲雨順風調。」眾等卻叩頭拜謝。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 200
        "line_end": 200
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      三蔵は見て回ってから、高い楼へ上がった。そこには、なるほど四人の像が造られ、彩色されていた。八戒はそれを見ると、悟空を引っ張った。
      八戒「兄貴の像は、よく似てるな。」
      沙悟浄「二番目の兄さん、あなたの像もそっくりですよ。ただ、お師匠さまの像は、少し美男子すぎますね。」
      三蔵「ちょうどよい、ちょうどよい。」
      それから楼を下りた。下でも、前の殿や後ろの廊下に、精進料理を並べて招こうと待つ者たちがいた。悟空が尋ねた。
      悟空「以前の大王の廟は、どうなったんだ。」
      老人たち「あの廟は、その年に取り壊しました。お坊さま、この寺が建ってからというもの、毎年作物はよく実り、年ごとに豊作です。皆さまのお守りのおかげでございます。」
      悟空は笑った。
      悟空「それは天からの贈り物さ。俺たちに何の関係がある。ただ、これから俺たちが去ったあとも、この荘の家々では子孫が栄え、六畜（りくちく）は無事に育ち、毎年、風も雨もちょうどよく、年ごとに雨も風もほどよくなるよう、請け合ってやろう。」
      人々は、頭を地につけて感謝した。
    "translation_status": "reviewed"
  - "id": "xy-ch99-022"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "只見那前前後後，更有獻果獻齋的無限人家。八戒笑道：「我的蹭蹬。那時節吃得，卻沒人家連請十請。今日吃不得，卻一家不了，又是一家。」饒他氣滿，略動手，又吃夠八九盤素食；縱然胃傷，又吃了二三十個饅頭。已皆盡飽，又有人家相邀。三藏道：「弟子何能，感蒙至愛。望今夕暫停，明早再領。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 202
        "line_end": 202
        "source_sequence": 22
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      見ると、前にも後ろにも、果物や精進料理を差し出す家々が、数え切れないほどあった。八戒は笑った。
      八戒「俺はついてないなあ。食えた時には、何度も何度も続けて招いてくれる家なんてなかったのに、今日みたいに食えない時には、一軒が済まないうちから次の一軒だ。」
      腹が張っているというのに、ちょっと手を動かしただけで、また精進料理を八、九皿も平らげた。胃が悪いというのに、饅頭も二、三十個食べた。皆すっかり満腹になったのに、まだ招く家があった。
      三蔵「私どもなど何ほどの者でもありませんのに、ひとかたならぬお心遣いを頂き、ありがたく存じます。どうか今夜はここまでにして、明朝また頂戴いたしましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch99-023"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "時已深夜。三藏守定真經，不敢暫離，就於樓下打坐看守。將及三更，三藏悄悄的叫道：「悟空，這裡人家。識得我們道成事完了。自古道：『真人不露相，露相不真人。』恐為久淹，失了大事。」行者道：「師父說得有理。我們趁此深夜，人家熟睡，寂寂的去了罷。」八戒卻也知覺，沙僧盡自分明，白馬也能會意。遂此起了身，輕輕的擡上馱垛，挑著擔，從廡廊馱出，到於山門，只見門上有鎖。行者又使個解鎖法，開了二門、大門，找路望東而去。只聽得半空中有八大金剛叫道：「逃走的，跟我來。」那長老聞得香風蕩蕩，起在空中。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 203
        "line_end": 203
        "source_sequence": 23
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      もう夜も更けていた。三蔵は真経を守り、一時も離れるのをためらって、楼の下に座禅を組み、見張っていた。三更（さんこう）になろうとするころ、そっと悟空を呼んだ。
      三蔵「悟空、ここの人たちは、私たちが道を得て務めを終えたことを知っている。昔から、『真の真人（しんじん）は正体を見せず、正体を見せる者は真の真人ではない』という。長く引き止められ、大事を損ないはしないかと心配なのだ。」
      悟空「お師匠さまのおっしゃるとおりです。この夜更けに、皆が寝入っている間を見計らい、そっと出ていきましょう。」
      八戒も気づき、沙悟浄もすっかり心得ており、白馬までその意を理解した。一行は立ち上がると、そっと馬に荷を載せ、担ぐ荷を担い、回廊を通って外へ運び出した。山門まで来ると、錠が掛かっていた。悟空はまた解錠の術を使い、内門と大門を開け、道を探して東へ向かった。
      すると、空の半ばから八大金剛の呼ぶ声がした。
      八大金剛「逃げ出した者たち、私たちについて来なさい。」
      三蔵は香り高い風が満ち渡るのを感じ、空へ舞い上がった。まことに、こういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch99-024"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": "丹成識得本來面，體健如如拜主人。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 205
        "line_end": 205
        "source_sequence": 24
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      丹が成り、本来の面目を知る。
      健やかな身で、変わらぬ真如（しんにょ）のまま、主たる人に拝礼する。
    "translation_status": "reviewed"
  - "id": "xy-ch99-025"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知怎生見那唐王，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 207
        "line_end": 207
        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": "さて、どのように唐王（とうおう）にお目にかかるのか。それは次の回でお話ししよう。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-001-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の固定表示は『九九數完魔剗一作「滅」盡　三三行滿道歸根』で、「一作『滅』」は剗の異文を示す電子編注である。原文欄では取得表示の鉤括弧も含めてそのまま保存した。訳は魔を払い尽くす意味を採った。九九は九掛ける九の八十一、三三は修行の充足を表す数の象徴だが、その具体的な修行分類は断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-002-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "難簿の第二十一難は、第二十八回の回題「黑松林三藏逢魔」と、その後の宝象国の事件へつながる回顧。烏巣禅師の予言に出る同名の林や、後に縛られた女の妖怪を助けた林と、同じ場所だと表記だけで断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-003-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "第三十九難の固定表示は「兜本作“⿰山兜”，Unicode缺字山遇怪」。中央の「本作“⿰山兜”，Unicode缺字」は、元の字が山偏と兜を組み合わせた字だとする電子編注である。原文ではこの文字列を一字も変えず保存し、訳は表示の代用字に従って兜山とした。欠字に勝手なUnicode文字を割り当てず、金兜山の事件を振り返る略表記と解する。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-004-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "難簿は第一から第八十までの八十件を、それぞれの番号とともに訳した。以前の物語を細分した項目や、三蔵本人だけでなく弟子たちに起きた出来事も含む。過去の本文と順序・表現が完全には重ならない所も、帳面の記述を修正しない。第三十三の「搬運車遲」は車遅国の荷運び、第三十九から第四十一は金兜山の魔物、第五十の「賽城」は祭賽国の都、第六十一の「獅駝」は獅駝嶺の苦難に対応させた。第三十七の天河は、この旅の回顧では通天河を指す。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-005-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "玄関・丹・参同契は、修行の完成を錬丹になぞらえる語。参同契はこの文脈では、易の陰陽論と錬丹を結ぶ道教の『周易参同契』と解した。同名の禅宗の詩へ同定しない。日本語の読みは、国立国会図書館・CiNiiの道教書の書誌に確認できる「さんどうけい」を採った。実際の薬や現代的な健康法の説明ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-006-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「十日灘頭坐，一日行九灘」は、難しい瀬の前で長く待つ一方、進める時には一気に進むという舟行のたとえ。八戒の「急ごうとすると遅くなる」という不平に応じる言葉として、十日・一日・九つの数も残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-007-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この詩は、仏教の不二・三乗と、道教の丹・九転を重ねる。人天は人と天上の世界、本来の面目は本来備わる真実の姿をいう。「一體原因」は、一体となった根本の因が全うされる意として訳したが、個々の修行段階への対応は未確定。「還元」と老黿の「黿」には中国語の同音の響きがある。挑包・飛杖の神通を、特定の既存人物の逸話に断定はしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-008-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "老黿の「歸著之事」は、自分の修行の行き着く先を問う言葉として「行く末」とした。以前の渡河時には、長年修行しているが人の姿を得られないと述べ、いつそうなれるかを如来に尋ねてほしいと三蔵へ頼んでいた。この回はさらに「あと何年の寿命があるか」とも問う。両者を一つの問いへ修正しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-009-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "固定本文の「熌」は、前後の雷・風・霧と対になる稲妻として訳し、原字は原文欄に保持した。「熌掣紅銷」は赤い光がひらめいて消える姿、「烈石」は岩を裂く意に解した。「驚蟄」はここでは雷に虫が驚く描写として読み、暦の二十四節気の日付に限定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-010-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「須知水勝真經伏」は構文が圧縮された難句。「水勝」「真經伏」を、経が水を吸い切り、法身に押さえられて守られたという直前の説明に沿って訳した。劉一明『西遊原旨』の同句に対する注は錬丹の「沐浴溫養」と解するが、これは後世の寓意解釈であり、固定底本文そのものの確定語釈とはしない。同書には周囲の詩句にも異文があるため、本文の置換には用いない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-011-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は陳澄への呼びかけを「二老官」とし、「你家替祭兒子」と述べる。一方、以前の陳家の説明では陳澄が兄で一秤金の父、陳清が弟で陳関保の父だった。ここは底本の呼びかけと発言を保ち、陳澄の名前を陳清へ直したり、兄弟や子供の関係を逆転したりしない。家全体の子をいう可能性はあるが確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-012-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "仏本行経は仏の生涯や行いを伝える経の名。巻末の欠損と石の文字の由来は、この物語が語る因縁譚として残した。現存する同名経典が実際にこの事件によって欠けたという歴史的保証ではない。石に貼りついたのは数巻で、経全体を失ったとは訳していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-013-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵が「凡胎を脱いで成仏した」、悟空が「もとより火で煮炊きする食事をしない」、八戒が急に胃腸が弱った、という語りや発言をそのまま訳した。以前の食事描写と合うように「今から食べなくなった」などへ変更しない。ここで語られる成仏を、まだ本文にない正式な仏号の授与へ置き換えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-014-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "宝常経は、取経の経典目録にも載る名。現存大蔵経の特定の経への同定は未確定であり、宝積経などのよく知られた経名へ勝手に訂正しない。本文は一巻を唱えたと述べるので、その数を保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-015-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「柏」は中国語の樹木名で、一般にコノテガシワなどの常緑針葉樹を指し、日本語の日常語の落葉樹のカシワと同一とは限らない。「地龍」は地勢や山脈を竜になぞらえる語として訳し、生きた別の竜が出現したとはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-016-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「氣滿」「胃傷」という語りと、それでも八、九皿・二、三十個を平らげる動作の対照を残した。本人が食べられないと口にすることを、実際に食事をしなかったという事実へ変えない。饅頭はこの文脈では蒸した小麦粉の食品であり、日本の甘いあん入り菓子と断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch99-note-017-body"
    "section_id": "chapter-99"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「如如」は変わることのない真実のあり方を表す仏教語として、真如に沿って訳した。「主人」は主たる存在を指すが、本文だけでは特定の一人か、修行上の内的な主宰をいうかを断定しない。次の回の出来事を、この詩の確定した実行内容として先取りしない。"
    "translation_status": "reviewed"

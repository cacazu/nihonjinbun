    "translation_ja": |-
      掲諦（ぎゃてい）として遣わされ、帰依の命を受けた私どもが、
      三蔵の難を、数も明らかに慎んで記す。
      第一の難、金蝉子（きんせんし）として罪を得て下界へ落とされる。第二の難、生まれるや殺されかける。
      第三の難、生後ひと月で川へ流される。第四の難、親を尋ね、恨みを晴らす。
      第五の難、城を出て虎に出会う。第六の難、穴に落ちて従者を失う。
      第七の難、双叉嶺（そうされい）での苦難。第八の難、両界山（りょうかいざん）での苦難。
      第九の難、険しい谷川で馬を替える。第十の難、夜、火をかけられる。
      第十一の難、袈裟を失う。第十二の難、八戒（はっかい）を降して弟子にする。
      第十三の難、黄風怪（こうふうかい）に行く手を阻まれる。第十四の難、霊吉菩薩（れいきつぼさつ）に助けを求める。
      第十五の難、流沙河（りゅうさが）を渡れず苦しむ。第十六の難、沙悟浄（さごじょう）を弟子にする。
      第十七の難、四人の聖者が姿を変えて現れる。第十八の難、五荘観（ごそうかん）での苦難。
      第十九の難、人参果（にんじんか）の木を生き返らせようと苦しむ。第二十の難、心猿（しんえん）たる悟空（ごくう）を追放する。
      第二十一の難、黒松林（こくしょうりん）で一行が離れ離れになる。第二十二の難、宝象国（ほうぞうこく）へ手紙を届ける。
      第二十三の難、金鑾殿（きんらんでん）で虎に変えられる。第二十四の難、平頂山（へいちょうざん）で魔物に出会う。
      第二十五の難、蓮花洞（れんげどう）で高くつり下げられる。第二十六の難、烏鶏国（うけいこく）で国王を救う。
      第二十七の難、魔物に姿をまねられる。第二十八の難、号山（ごうざん）で妖怪に出会う。
      第二十九の難、聖僧が風にさらわれる。第三十の難、悟空が危害を受ける。
      第三十一の難、聖者に妖怪を降してもらう。第三十二の難、黒河（こくが）に沈められる。
      第三十三の難、車遅国（しゃちこく）で荷運びをする。第三十四の難、勝敗を賭けた大勝負。
      第三十五の難、道士を退け、僧を栄えさせる。第三十六の難、道中、大河に行き当たる。
      第三十七の難、天河（てんが）へ落ちる。第三十八の難、魚籃（ぎょらん）を手にした菩薩が現れる。
      第三十九の難、兜山（とうざん）で妖怪に出会う。第四十の難、天上の神々にも降せない。
      第四十一の難、仏に妖怪の素性を尋ねる。第四十二の難、水を飲んで毒にあたる。
      第四十三の難、西梁国（せいりょうこく）で婚姻のため引き止められる。第四十四の難、琵琶洞（びわどう）で苦しむ。
      第四十五の難、悟空をふたたび追放する。第四十六の難、二匹の猿を見分けられない。
      第四十七の難、火焔山（かえんざん）に行く手を阻まれる。第四十八の難、芭蕉扇（ばしょうせん）を求める。
      第四十九の難、魔王を捕らえて降す。第五十の難、祭賽国（さいさいこく）の都で塔を掃く。
      第五十一の難、宝を取り戻して僧を救う。第五十二の難、茨の林で詩を吟じる。
      第五十三の難、小雷音寺（しょうらいおんじ）で難に遭う。第五十四の難、天上の神々が捕らえられる。
      第五十五の難、稀柿衕（きしどう）の汚物に行く手を阻まれる。第五十六の難、朱紫国（しゅしこく）で医術を行う。
      第五十七の難、病に苦しむ者を救う。第五十八の難、妖怪を降して王妃を取り戻す。
      第五十九の難、七情（しちじょう）に惑わされる。第六十の難、多くの目を持つ妖怪に傷つけられる。
      第六十一の難、獅駝嶺（しだれい）で行く手を阻まれる。第六十二の難、三種の妖怪に出会う。
      第六十三の難、城内で災難に遭う。第六十四の難、仏に魔物の鎮圧を頼む。
      第六十五の難、比丘国（びくこく）で子供を救う。第六十六の難、真と邪を見分ける。
      第六十七の難、松林で妖怪を助ける。第六十八の難、僧房で病に伏す。
      第六十九の難、無底洞（むていどう）で苦しめられる。第七十の難、滅法国（めっぽうこく）を通れず苦しむ。
      第七十一の難、隠霧山（いんむざん）で魔物に出会う。第七十二の難、鳳仙郡（ほうせんぐん）で雨を求める。
      第七十三の難、武器を失う。第七十四の難、熊手を祝う宴をめぐる苦難。
      第七十五の難、竹節山（ちくせつざん）で難に遭う。第七十六の難、玄英洞（げんえいどう）で苦しむ。
      第七十七の難、犀を追って捕らえる。第七十八の難、天竺（てんじく）で婿に選ばれる。
      第七十九の難、銅台府（どうたいふ）で牢に入れられる。第八十の難、凌雲渡（りょううんと）で凡俗の肉体を脱ぐ。
      道のりは十万八千里（り）。
      聖僧が経てきた苦難は、この帳面に明らかである。

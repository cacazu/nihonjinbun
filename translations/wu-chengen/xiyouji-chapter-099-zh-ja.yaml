  - "id": "xy-ch99-002"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表八金剛既送唐僧回國不題。那三層門下，有五方揭諦、四值功曹、六丁六甲、護教伽藍，走向觀音菩薩前啟道：「弟子等向蒙菩薩法旨，暗中保護聖僧，今日聖僧行滿，菩薩繳了佛祖金旨，我等望菩薩准繳法旨。」菩薩亦甚喜道：「准繳，准繳。」又問道：「那唐僧四眾，一路上心行何如？」諸神道：「委實心虔志誠，料不能逃菩薩洞察。但只是唐僧受過之苦，真不可言。他一路上歷過的災愆患難，弟子已謹記在此，這就是他災難的簿子。」菩薩從頭看了一遍，上寫著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 122
        "line_end": 122
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      さて、八大金剛（はちだいこんごう）が三蔵（さんぞう）を故国へ送ってゆく話は、ひとまず措こう。三重の門の下にいた五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、六丁六甲（ろくていろっこう）、護教伽藍（ごきょうがらん）は、観音菩薩（かんのんぼさつ）のもとへ進み出て申し上げた。
      護衛の神々「私どもは、かねて菩薩さまの仰せを受け、ひそかに聖僧をお守りしてまいりました。本日、聖僧の修行は満ち、菩薩さまも仏祖（ぶっそ）へのご復命を済まされました。私どもにも、お命じになった務めを終えるお許しをいただきたく存じます。」
      観音菩薩もたいそう喜んだ。
      観音菩薩「よろしい、よろしい。」
      そして、改めて尋ねた。
      観音菩薩「三蔵たち四人は、道中、どのような心がけで行動していましたか。」
      護衛の神々「まことに信心深く、志も誠実でございました。菩薩さまの御目には、すべてお見通しのことと存じます。ただ、三蔵の受けた苦しみばかりは、とても言葉には尽くせません。旅の間に経験した災いと苦難を、私どもがここに漏らさず記しておきました。これが、その災難の帳面でございます。」
      観音菩薩が初めから目を通すと、次のように記されていた。
    "translation_status": "reviewed"
  - "id": "xy-ch99-003"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      蒙差揭諦皈依旨，謹記唐僧難數清：
      金蟬遭貶第一難。出胎幾殺第二難。
      滿月拋江第三難。尋親報冤第四難。
      出城逢虎第五難。折從落坑第六難。
      雙叉嶺上第七難。兩界山頭第八難。
      陡澗換馬第九難。夜被火燒第十難。
      失卻袈裟十一難。收降八戒十二難。
      黃風怪阻十三難。請求靈吉十四難。
      流沙難渡十五難。收得沙僧十六難。
      四聖顯化十七難。五莊觀中十八難。
      難活人參十九難。貶退心猿二十難。
      黑松林失散二十一難。寶象國捎書二十二難。
      金鑾殿變虎二十三難。平頂山逢魔二十四難。
      蓮花洞高懸二十五難。烏雞國救主二十六難。
      被魔化身二十七難。號山逢怪二十八難。
      風攝聖僧二十九難。心猿遭害三十難。
      請聖降妖三十一難。黑河沉沒三十二難。
      搬運車遲三十三難。大賭輸贏三十四難。
      祛道興僧三十五難。路逢大水三十六難。
      身落天河三十七難。魚籃現身三十八難。
      兜本作“⿰山兜”，Unicode缺字山遇怪三十九難。普天神難伏四十難。
      問佛根源四十一難。吃水遭毒四十二難。
      西梁國留婚四十三難。琵琶洞受苦四十四難。
      再貶心猿四十五難。難辨獼猴四十六難。
      路阻火焰山四十七難。求取芭蕉扇四十八難。
      收縛魔王四十九難。賽城掃塔五十難。
      取寶救僧五十一難。棘林吟詠五十二難。
      小雷音遇難五十三難。諸天神遭困五十四難。
      稀柿衕穢阻五十五難。朱紫國行醫五十六難。
      拯救疲癃五十七難。降妖取后五十八難。
      七情迷沒五十九難。多目遭傷六十難。
      路阻獅駝六十一難。怪分三色六十二難。
      城裡遇災六十三難。請佛收魔六十四難。
      比丘救子六十五難。辨認真邪六十六難。
      松林救怪六十七難。僧房臥病六十八難。
      無底洞遭困六十九難。滅法國難行七十難。
      隱霧山遇魔七十一難。鳳仙郡求雨七十二難。
      失落兵器七十三難。會慶釘鈀七十四難。
      竹節山遭難七十五難。玄英洞受苦七十六難。
      趕捉犀牛七十七難。天竺招婚七十八難。
      銅臺府監禁七十九難。凌雲渡脫胎八十難。
      路經十萬八千里。聖僧歷難簿分明。
    "source_languages":
      - "zh-Hant"
    "source_locations":

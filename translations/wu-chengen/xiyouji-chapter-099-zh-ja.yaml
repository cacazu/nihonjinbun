    "source_text": "菩薩將難簿目過了一遍，急傳聲道：「佛門中九九歸真。聖僧受過八十難，還少一難，不得完成此數。」即命揭諦：「趕上金剛，還生一難者。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 165
        "line_end": 165
        "source_sequence": 4
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      観音菩薩は難の帳面を一通り見ると、急いで声を上げた。
      観音菩薩「仏の道では、九かける九の数を満たして真に帰ります。聖僧は八十の難を受けましたが、まだ一つ足りず、この数を満たしていません。」
      そこで、すぐに掲諦に命じた。
      観音菩薩「金剛たちに追いつき、もう一つ難を与えなさい。」
    "translation_status": "reviewed"
  - "id": "xy-ch99-005"
    "section_id": "chapter-99"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這揭諦得令，飛雲一駕向東來，一晝夜趕上八大金剛，附耳低言道：「……如此如此，謹遵菩薩法旨，不得違誤。」八金剛聞得此言，刷的把風按下，將他四眾連馬與經墜落下地。噫！正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 167
        "line_end": 167
        "source_sequence": 5
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      命を受けた掲諦は、飛ぶ雲に乗って東へ向かい、一昼夜で八大金剛に追いついた。そして耳元で小声で告げた。
      掲諦「……これこれ、このように。菩薩さまの仰せを慎んで守り、決して違えてはなりません。」
      八大金剛はこれを聞くと、さっと風を下ろし、四人を馬も経もろとも地上へ落とした。ああ、まことにこういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch99-006"
    "section_id": "chapter-99"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      九九歸真道行難，堅持篤志立玄關。
      必須苦煉邪魔退，定要修持正法還。
      莫把經章當容易，聖僧難過許多般。
      古來妙合參同契，毫髮差殊不結丹。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 169
        "line_end": 172
        "source_sequence": 6
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      九九（きゅうきゅう）の難を経て真へ帰る道は険しい。志を固く保って、玄妙な関門を築く。
      苦しい鍛錬を重ねて邪悪な魔を退け、修行を続けて正しい法へ帰らねばならぬ。
      経を得ることを容易と思うな。聖僧はこれほど多くの苦難を越えねばならなかった。
      古来、玄妙な理は『参同契（さんどうけい）』に符合する。髪の毛ほどの違いでも、丹（たん）は結ばれない。
    "translation_status": "reviewed"
  - "id": "xy-ch99-007"
    "section_id": "chapter-99"

    "source_text": "三藏腳踏了凡地，自覺心驚。八戒呵呵大笑道：「好好好，這正是要快得遲。」沙僧道：「好好好，因是我們走快了些兒，教我們在此歇歇哩。」大聖道：「俗語云：『十日灘頭坐，一日行九灘。』」三藏道：「你三個且休鬥嘴，認認方向，看這是甚麼地方？」沙僧轉頭四望道：「是這裡，是這裡。師父，你聽聽水響。」行者道：「水響想是你的祖家了。」八戒道：「他祖家乃流沙河。」沙僧道：「不是，不是，此通天河也。」三藏道：「徒弟啊，仔細看在那岸？」行者縱身跳起，用手搭涼篷，仔細看了，下來道：「師父，此是通天河西岸。」三藏道：「我記起來了。東岸邊原有個陳家莊。那年到此，虧你救了他兒女，深感我們，要造船相送，幸白黿伏渡。我記得西岸上四無人煙，這番如何是好？」八戒道：「只說凡人會作弊，原來這佛面前的金剛也會作弊。他奉佛旨，教送我們東回，怎麼到此半路上就丟下我們？如今豈不進退兩難？怎生過去？」沙僧道：「二哥休報怨。我的師父已得了道，前在凌雲渡已脫了凡胎，今番斷不落水。教師兄同你我都作起攝法，把師父駕過去也。」行者頻頻的暗笑道：「駕不去，駕不去。」你看他怎麼就說個駕不去？若肯使出神通，說破飛昇之奧妙，師徒們就一千個河也過去了。只因心裡明白，知道唐僧九九之數未完，還該有一難，故羈留於此。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch99-1558059"
        "precision": "line"
        "line_start": 173
        "line_end": 173
        "source_sequence": 7
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第099回&oldid=1558059"
    "translation_ja": |-
      三蔵は俗世の地に足をつけ、思わず胸を騒がせた。八戒は、はははと大笑いした。
      八戒「いいぞ、いいぞ、こりゃいい。急ごうとすると、かえって遅くなるってわけだ。」
      沙悟浄「いいですね、いいですね。少し速く進みすぎたので、ここで休ませてくださるのでしょう。」
      悟空「ことわざにもあるだろう。『瀬のほとりで十日待ったかと思えば、一日で九つの瀬を越える』ってな。」
      三蔵「三人とも、口を争うのはやめなさい。方角を確かめて、ここがどこなのか見ておくれ。」
      沙悟浄は振り向き、四方を見回した。
      沙悟浄「ここでしたか、ここでしたか。お師匠さま、水の音を聞いてください。」
      悟空「水の音なら、お前の古巣じゃないか。」
      八戒「あいつの古巣は流沙河だろ。」
      沙悟浄「違います、違います。ここは通天河（つうてんが）です。」
      三蔵「弟子よ、どちらの岸なのか、よく見ておくれ。」
      悟空は身を跳ね上げ、手をかざしてよく見渡してから、下りてきた。
      悟空「お師匠さま、ここは通天河の西岸です。」
      三蔵「思い出した。東岸には陳家荘（ちんかそう）があったね。あの年ここへ来た時、お前があの家の息子と娘を救ってくれたので、深く感謝して、私たちを送る船を造ろうとしてくれた。幸い、白黿（はくげん）が背を貸して渡してくれたのだった。確か西岸には、四方に人家がなかった。今度はどうすればよいのだろう。」
      八戒「ずるをするのは人間だけかと思ったら、仏さまの前にいる金剛までずるをするんだな。仏さまの命令で、俺たちを東へ送るはずなのに、どうして道半ばで置き去りにするんだ。これじゃ進むにも戻るにも困るじゃないか。どうやって渡るんだよ。」
      沙悟浄「二番目の兄さん、不平を言わないでください。お師匠さまはもう道を得て、凌雲渡で俗世の肉体を脱いでおられます。今度は決して水には落ちません。兄さんと私たちで人を運ぶ術を使い、お師匠さまを向こうへお連れしましょう。」
      悟空は何度も含み笑いをした。
      悟空「運べない、運べない。」
      なぜ、運べないなどと言うのだろう。神通力を使い、空を飛ぶ秘法を明かす気さえあれば、一行は千の川でも渡れたはずである。ただ悟空には、三蔵がまだ九九の数を満たさず、あと一難を受けるべきだと分かっていた。それで、ここに足をとどめていたのである。
    "translation_status": "reviewed"

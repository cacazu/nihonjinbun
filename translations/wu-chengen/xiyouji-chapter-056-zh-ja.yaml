  "translation_ja": |-
    さすがは悟空、耳の中を探り、刺繍針ほどのものを一本抜き出した。
    悟空「皆さん、私は出家の身で、ほんとうに路銀は持っていません。この針だけ、差し上げましょう。」
    賊の一人「ついてないな。金持ちの坊主を放して、捕まえたのはこの貧乏な禿げ驢馬か。お前は仕立屋でもできるのか。針など何に使う！」
    いらぬと聞くと、悟空は針を指につまみ、一振りして、椀ほどの太さの棒に変えた。賊の一人は恐れて言った。
    賊の一人「この坊主、体は小さいくせに、術を使いやがる。」
    悟空は棒を地面に立てた。
    悟空「皆さん、持ち上げられるなら、差し上げますよ。」
    二人の賊が進み出て奪い取ろうとしたが、気の毒にも、蜻蛉が石柱を揺すろうとするようなもの。ほんのわずか動かすことさえできなかった。この棒こそ如意金箍棒（にょいきんこぼう）で、天の秤で量って一万三千五百斤（きん）もの重さがある。賊たちにそんなことが分かろうか。悟空は前へ進み、軽々と持ち上げると、大蛇が身をひるがえすように足を交差させる構えをとり、追いはぎどもを指して言った。
    悟空「お前たちは、つきがない。この俺に出会ってしまったのだからな。」
    賊たちはまた進み出て、五、六十度も殴りつけた。
  "translation_status": "reviewed"
- "id": "xy-ch56-019"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者笑道：「你也打得手困了，且讓老孫打一棒兒，卻休當真。」你看他展開棍子幌一幌，有井欄粗細，七八丈長短，盪的一棍，把一個打倒在地，嘴唇\U00022DD1土，再不做聲。那一個開言罵道：「這禿廝老大無禮！盤纏沒有，轉傷我一個人。」行者笑道：「且消停，且消停，待我一個個打來，一發教你斷了根罷。」盪的又一棍，把第二個又打死了。諕得那眾嘍囉撇槍棄棍，四路逃生而走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空は笑った。
    悟空「お前たちも殴りくたびれただろう。今度は俺に一打、打たせてくれ。なに、本気にするなよ。」
    見れば悟空は棒を広げてひと振りし、井戸の囲いほどの太さ、七、八丈ほどの長さにすると、どんと一撃、一人を地面へ叩き倒した。唇に土を含み、その男はもう声を出さなかった。もう一人が罵った。
    もう一人の賊「この禿げめ、なんと無礼な！　路銀を出さないうえ、こちらを一人傷つけやがった。」
    悟空は笑った。
    悟空「まあ待て、まあ待て。一人ずつ殴ってやるから、この際、お前たちの根を絶やしてやろう。」
    どんともう一打、二人目も打ち殺した。手下たちは恐れおののき、槍も棒も投げ捨て、四方へ命からがら逃げていった。

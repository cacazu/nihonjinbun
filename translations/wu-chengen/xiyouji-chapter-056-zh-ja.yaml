- "id": "xy-ch56-025"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖聞言，忍不住笑道：「師父，你老人家忒沒情義。為你取經，我費了多少慇懃勞苦，如今打死這兩個毛賊，你倒教他去告老孫。雖是我動手打，卻也只是為你。你不往西天取經，我不與你做徒弟，怎麼會來這裡，會打殺人？索性等我祝他一祝。」揝著鐵棒，望那墳上搗了三下道：「遭瘟的強盜，你聽著：我被你前七八棍，後七八棍，打得我不疼不癢的，觸惱了性子，一差二誤，將你打死了。盡你到那裡去告，我老孫實是不怕：玉帝認得我，天王隨得我；二十八宿懼我，九曜星官怕我；府縣城隍跪我，東岳天齊怖我；十代閻君曾與我為僕從，五路猖神曾與我當後生。不論三界五司，十方諸宰，都與我情深面熟，隨你那裡去告。」三藏見說出這般惡話，卻又心驚道：「徒弟呀，我這禱祝是教你體好生之德，為良善之人，你怎麼就認真起來？」行者道：「師父，這不是好耍子的勾當。且和你趕早尋宿去。」那長老只得懷嗔上馬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    悟空はそれを聞くと、たまらず笑った。
    悟空「お師匠さま、あなたはあまりに情けがありません。あなたのために経を取りに行こうと、私はどれだけ心を尽くし、苦労を重ねてきたことか。今、このこそ泥二人を殺したら、かえって私を訴えろと勧めるのですか。手を下したのは私でも、ただあなたのためにやったことです。あなたが西天へ経を取りに行かず、私もあなたの弟子にならなければ、どうしてここへ来て、人を殺したりしましょう。いっそ、私にもひとつ祈らせてください。」
    鉄棒をつかみ、墓を三度突いて言った。
    悟空「疫病にかかっちまえ、盗賊ども。よく聞け。俺はお前たちに、初めに七、八打、後にも七、八打、殴られた。痛くもかゆくもなかったが、腹が立ったので、ひょんな弾みでお前たちを殺してしまった。どこへでも好きなように訴えに行け。この俺は本当に怖くない。玉帝は俺を知っているし、天王（てんのう）は俺に従う。二十八宿（にじゅうはっしゅく）は俺を恐れ、九曜星官（くようせいかん）も俺を恐れる。府県の城隍（じょうこう）は俺にひざまずき、東岳天斉（とうがくてんせい）も俺におびえる。十代閻君（じゅうだいえんくん）はかつて俺の従僕となり、五路猖神（ごろしょうしん）は俺の若い衆となった。三界（さんがい）五司（ごし）であろうが、十方（じっぽう）の主宰者であろうが、どれも俺とは昵懇で、顔なじみだ。どこへでも訴えに行くがいい。」
    三蔵は、こんな恐ろしい言葉を吐くのを見ると、また胆を冷やした。
    三蔵「弟子よ、私がこう祈ったのは、お前に命をいつくしむ徳を身につけ、善い人間になってもらうためなのだ。どうして真に受けてしまうのだ。」
    悟空「お師匠さま、これは戯れに済ませられることではありません。ひとまず、早く宿を探しに行きましょう。」
    三蔵は、怒りを胸に抱いたまま馬へ乗るしかなかった。
  "translation_status": "reviewed"
- "id": "xy-ch56-026"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖有不睦之心，八戒、沙僧亦有嫉妒之意，師徒都面是背非。依大路向西正走，忽見路北下有一座莊院。三藏用鞭指定道：「我們到那裡借宿去。」八戒道：「正是。」遂行至莊舍邊下馬。看時，卻也好個住場。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    悟空の心には不和が生じ、八戒と沙悟浄にも妬む気持ちがあった。師弟はみな、表面では従っても、心の中では背いていた。大通りを西へ進むうち、ふと道の北側に一軒の屋敷が見えた。三蔵は鞭で指した。
    三蔵「あそこで一夜の宿を借りよう。」
    八戒「そうしましょう。」
    そこで屋敷のそばまで行き、馬から下りた。見れば、なかなかよい住まいである。
  "translation_status": "reviewed"
- "id": "xy-ch56-027"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": "野花盈徑，雜樹遮扉。遠岸流山水，平畦種麥葵。蒹葭露潤輕鷗宿，楊柳風微倦鳥棲。青柏間松爭翠碧，紅蓬映蓼鬥芳菲。村犬吠，晚雞啼，牛羊食飽牧童歸。爨煙結霧黃粱熟，正是山家入暮時。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    野の花は小道を埋め、さまざまな木々は戸を隠す。
    遠い岸には山の水が流れ、平らな畝には麦とアオイを植える。
    ヨシやアシは露に潤い、軽やかな鴎が宿り、
    柳には微風が吹いて、くたびれた鳥がねぐらにつく。
    青い柏は松に交じって緑を競い、
    赤いヨモギは蓼（たで）に映えて、美しさを争う。
    村の犬は吠え、夕方の鶏は鳴き、
    牛や羊は腹いっぱい草を食べて、牧童が帰ってくる。
    炊煙は霧のように立ちこめ、黄色い粟の飯が炊けた。
    まさしく、山の家に夕暮れが訪れるころだった。
  "translation_status": "reviewed"
- "id": "xy-ch56-028"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老向前，忽見那村舍門裡走出一個老者，即與相見，道了問訊。那老者問道：「僧家從那裡來？」三藏道：「貧僧乃東土大唐欽差往西天求經者。適路過寶方，天色將晚，特來檀府告宿一宵。」老者笑道：「你貴處到我這裡，程途迢遞，怎麼涉水登山，獨自到此？」三藏道：「貧僧還有三個徒弟同來。」老者問：「高徒何在？」三藏用手指道：「那大路傍立的便是。」老者猛擡頭，看見他們面貌醜陋，急回身往裡就走。被三藏扯住道：「老施主，千萬慈悲，告借一宿！」老者戰兢兢拑口難言，搖著頭，擺著手道：「不、不、不、不像人模樣！是、是、是幾個妖精。」三藏陪笑道：「施主切休恐懼。我徒弟生得是這等相貌，不是妖精。」老者道：「爺爺呀！一個夜叉，一個馬面，一個雷公。」行者聞言，厲聲高叫道：「雷公是我孫子，夜叉是我重孫，馬面是我玄孫哩。」那老者聽見，魄散魂飛，面容失色，只要進去。三藏攙住他，同到草堂，陪笑道：「老施主，不要怕他，他都是這等粗魯，不會說話。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    三蔵が進み出ると、ちょうど村家の門から一人の老人が出てきた。三蔵は挨拶し、安否を尋ねた。
    老人「お坊さま、どこからおいでですかな。」
    三蔵「私は東の地の大唐（だいとう）から、勅命を受けて西天へ経を求めに行く者です。こちらを通りかかったところ日が暮れてきましたので、お宅で一晩お泊めいただきたく、参りました。」
    老人は笑った。
    老人「お国からここまでは、たいそう遠い道のりでしょう。水を渡り山を登って、どうしてお一人でここまでおいでになったのです。」
    三蔵「私には、連れの弟子が三人おります。」
    老人「お弟子さまは、どちらに。」
    三蔵は手で指した。
    三蔵「あの大通りのそばに立っているのが、そうです。」
    老人がさっと顔を上げ、その醜い顔を見ると、急に向き直って家へ入ろうとした。三蔵は老人を引きとめた。
    三蔵「ご老人、どうかお慈悲を。一晩お泊めください！」
    老人はぶるぶる震え、口がこわばって言葉も出ない。頭を振り、手を振りながら言った。
    老人「に、に、に、人間の姿ではない！　よ、よ、妖怪どもじゃ。」
    三蔵は愛想よく笑った。
    三蔵「ご主人、決してお怖がりなさいますな。弟子どもは生まれつきあのような顔なのであって、妖怪ではありません。」
    老人「ああ、お坊さま！　一人は夜叉（やしゃ）、一人は馬面（ばめん）、一人は雷公（らいこう）ですぞ。」
    悟空は聞くと、声を張り上げた。
    悟空「雷公は俺の孫、夜叉は俺のひ孫、馬面は俺のやしゃごだぞ！」
    老人はこれを聞いて魂も吹き飛ぶ思いがし、血の気を失って、ひたすら中へ逃げ込もうとした。三蔵はその腕を支え、ともに座敷へ入り、笑顔を作った。
    三蔵「ご老人、怖がることはありません。みなあのようにがさつで、口のきき方を知らぬだけです。」
  "translation_status": "reviewed"
- "id": "xy-ch56-029"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正勸解處，只見後面走出一個婆婆，攜著五六歲的一個小孩兒，道：「爺爺，為何這般驚恐？」老者才叫：「媽媽，看茶來。」那婆婆真個丟了孩兒，入裡面捧出二鍾茶來。茶罷，三藏卻轉下來，對婆婆作禮道：「貧僧是東土大唐差往西天取經的。才到貴處，拜求尊府借宿，因是我三個徒弟貌醜，老家長見了虛驚也。」婆婆道：「見貌醜的就這等虛驚，若見了老虎豺狼，卻怎麼好？」老者道：「媽媽呀，人面醜陋還可，只是言語一發嚇人。我說他像夜叉、馬面、雷公，他吆喝道，雷公是他孫子，夜叉是他重孫，馬面是他玄孫。我聽此言，故然悚懼。」唐僧道：「不是，不是。像雷公的，是我大徒孫悟空；像馬面的，是我二徒豬悟能；像夜叉的，是我三徒沙悟淨。他們雖是醜陋，卻也秉教沙門，皈依善果，不是甚麼惡魔毒怪，怕他怎麼？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    こうしてなだめていると、奥から一人の老婆が、五、六歳の子供を連れて出てきた。
    老婆「おじいさん、どうしてそんなに怖がっているんです。」
    そこで老人は言った。
    老人「おばあさん、お茶を出してくれ。」
    老婆は本当に子供の手を離して中へ入り、茶を二杯運んできた。茶を飲み終えると、三蔵は席を下り、老婆に礼をした。
    三蔵「私は東の地の大唐から、西天へ経を取りに行くよう遣わされた者です。ただいまこちらへ着き、お宅で宿を借りたいとお願いしたのですが、弟子が三人とも醜いため、ご主人に見て怖がられてしまいました。」
    老婆「顔が醜いのを見ただけで、そんなに怖がるなんて。本物の虎やヤマイヌや狼を見たら、どうするんです。」
    老人「おばあさん、顔が醜いだけならまだよいが、話すことがいっそう恐ろしいのだ。わしが夜叉、馬面、雷公に似ていると言ったら、雷公は自分の孫、夜叉はひ孫、馬面はやしゃごだと怒鳴る。それを聞いたから、怖くなったのじゃ。」
    三蔵「いえいえ、そうではありません。雷公に似ているのは、私の一番弟子の孫悟空（そんごくう）。馬面に似ているのは、二番弟子の猪悟能（ちょごのう）。夜叉に似ているのは、三番弟子の沙悟浄です。醜くはありますが、仏門の教えを受け、善い果報を目ざして帰依した者たちです。悪魔でも害をなす化け物でもありません。何を恐れることがありましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch56-030"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公婆兩個聞說他名號，皈正沙門之言，卻才定性回驚，教：「請來，請來。」長老出門叫來，又吩咐道：「適才這老者甚惡你等，今進去相見，切勿抗禮，各要尊重些。」八戒道：「我俊秀，我斯文，不比師兄撒潑。」行者笑道：「不是嘴長、耳大、臉醜，便也是一個好男子。」沙僧道：「莫爭講，這裡不是那抓乖弄俏之處。且進去，且進去。」遂此把行囊、馬匹都到草堂上，齊同唱了個喏，坐定。那媽媽兒賢慧，即便攜轉小兒，咐吩煮飯，安排一頓素齋，他師徒吃了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    老夫婦は弟子たちの名と、仏門へ正しく帰依したという説明を聞いて、ようやく気を落ち着け、恐れからさめた。
    老夫婦「呼んでいらっしゃい。呼んでいらっしゃい。」
    三蔵は門を出て三人を呼び、言い含めた。
    三蔵「さきほど、この老人はお前たちをひどく恐れていた。今から入って挨拶するときは、決して対等の礼で済ませず、みな十分に敬意を示すのだぞ。」
    八戒「俺は男前だし、礼儀もわきまえていますよ。兄貴みたいに乱暴はしません。」
    悟空は笑った。
    悟空「口が長くて、耳がでかくて、顔が醜いのでなけりゃ、お前もなかなかの男なんだがな。」
    沙悟浄「言い争いはよしましょう。ここは利口ぶったり、愛嬌を競ったりする所ではありません。さあ、中へ入りましょう、入りましょう。」
    そこで荷物も馬も座敷のほうへ運び、そろって声を上げて礼をし、席に着いた。老婆は気が利く人で、すぐに子供を連れて奥へ戻り、飯を炊くよう言いつけ、一食の精進料理を用意した。師弟はそれをいただいた。
  "translation_status": "reviewed"
- "id": "xy-ch56-031"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "漸漸晚了，又掌起燈來，都在草堂上閑敘。長老才問：「施主高姓？」老者道：「姓楊。」又問年紀。老者道：「七十四歲。」又問：「幾位令郎？」老者道：「止得一個。適才媽媽攜的是小孫。」長老請令郎相見拜揖。老者道：「那廝不中拜。老拙命苦，養不著他，如今不在家了。」三藏道：「何方生理？」老者點頭而嘆：「可憐，可憐！若肯何方生理，是吾之幸也。那廝專生惡念，不務本等，專好打家截道，殺人放火。相交的都是些狐群狗黨。自五日之前出去，至今未回。」三藏聞說，不敢言喘，心中暗想道：「或者悟空打殺的就是也。」長老神思不安，欠身道：「善哉！善哉！如此賢父母，何生惡逆兒？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    次第に夜も深まり、灯をともすと、みな座敷で世間話をした。そこで三蔵が尋ねた。
    三蔵「ご主人、お姓は何とおっしゃいます。」
    老人「楊（よう）と申します。」
    続いて年齢を尋ねると、楊の老人（ようのろうじん）は答えた。
    楊の老人「七十四です。」
    三蔵「ご子息は何人おいでですか。」
    楊の老人「ただ一人です。さっき、ばあさんが連れていたのは孫です。」
    三蔵は、息子にも会って挨拶させてほしいと頼んだ。
    楊の老人「あいつに挨拶など、もったいない。わしは不幸なもので、あれをまともに育てられなんだ。今は家におりません。」
    三蔵「どちらで商売をしておいでですか。」
    楊の老人はうなずき、ため息をついた。
    楊の老人「ああ、悲しい、悲しいことだ。どこかで商売でもしてくれるなら、わしには幸せというものじゃ。あいつは悪いことばかり考え、まっとうな仕事もせず、家に押し入ること、旅人を襲うこと、人を殺すこと、火をつけることばかり好む。つきあう連中も狐や犬のような悪党ばかり。五日前に出ていってから、まだ帰りません。」
    三蔵は聞いて息をひそめ、心の中で思った。
    三蔵「もしや、悟空が殺したのが、その息子ではあるまいか。」
    気が気でなく、三蔵は少し身を起こした。
    三蔵「ああ、なんということだ。これほど賢明なご両親から、どうして悪逆な子が生まれたのだろう。」
  "translation_status": "reviewed"
- "id": "xy-ch56-032"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者近前道：「老官兒，似這等不良不肖、奸盜邪淫之子，連累父母，要他何用？等我替你尋他來打殺了罷。」老者道：「我待也要送了他，奈何再無以次人丁，縱是不才，一定還留他與老漢掩土。」沙僧與八戒笑道：「師兄，莫管閑事，你我不是官府。他家不肯，與我何干？且告施主，見賜一束草兒，在那廂打鋪睡覺，天明走路。」老者即起身，著沙僧到後園裡拿兩個稻草，教他們在園中草團瓢內安歇。行者牽了馬，八戒挑了行李，同長老俱到團瓢內安歇不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    悟空が進み出た。
    悟空「ご老人、そんな不良で親不孝で、悪事や盗み、淫らなことをして親を巻き添えにする息子など、何の役に立ちます。俺が代わりに捜し出して、殺してやりましょう。」
    楊の老人「わしも、あいつを死なせてしまいたいとは思うのです。だが、ほかに跡を継ぐ男がおらん。ろくでなしでも、どうしても残しておいて、わしを埋めてもらわねばならんのです。」
    沙悟浄と八戒は笑った。
    沙悟浄と八戒「兄弟子、余計な世話はよしましょう。私たちは役人ではありません。この家の人が望まないのに、何の関わりがあるんです。ひとまずご主人に藁を一束いただいて、どこかへ敷いて寝かせてもらい、夜が明けたら出発しましょう。」
    楊の老人はすぐに立ち上がり、沙悟浄に裏庭から稲藁を二束取ってこさせ、庭の草葺きの小屋で休むように言った。悟空が馬を引き、八戒が荷を担ぎ、三蔵と一緒に小屋へ入って休んだ。この話はしばらく置く。
  "translation_status": "reviewed"
- "id": "xy-ch56-033"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那夥賊內果有老楊的兒子。自天早在山前被行者打死兩個賊首，他們都四奔逃生。約摸到四更時候，又結成一夥，在門前打門。老者聽得門響，即披衣道：「媽媽，那廝們來也。」媽媽道：「既來，你去開門，放他來家。」老者方才開門，只見那一夥賊都嚷道：「餓了，餓了。」這老楊的兒子忙入裡面，叫起他妻來，打米煮飯。卻廚下無柴，往後園裡拿柴，到廚房裡問妻道：「後園裡白馬是那裡的？」其妻道：「是東土取經的和尚，昨晚至此借宿，公公、婆婆管待他一頓晚齋，教他在草團瓢內睡哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    さて、あの賊の中には、実際に楊の老人の息子がいた。その日の早い時刻、山の手前で悟空に二人の頭目を殺され、賊どもは四方へ逃げて命を拾っていたが、四更（しこう）ごろになると、また一団になり、門の前で戸を叩いた。音を聞いた楊の老人は、衣を羽織って言った。
    楊の老人「おばあさん、あいつらが来たぞ。」
    老婆「来たのなら、戸を開けて、家へ入れておやりなさい。」
    楊の老人が戸を開けると、賊たちはみな騒いだ。
    賊たち「腹が減った、腹が減った！」
    楊の老人の息子は急いで中へ入り、妻を起こして、米を出して飯を炊かせた。ところが台所には薪がない。裏庭へ薪を取りに行ってから、台所へ戻り、妻に尋ねた。
    楊の老人の息子「裏庭の白馬は、誰の馬だ。」
    息子の妻「東の国から経を取りに行くお坊さまの馬です。昨日の晩、うちへ泊まりに来たので、お父さんとお母さんが晩の精進料理を出し、草葺きの小屋で休ませているのです。」
  "translation_status": "reviewed"
- "id": "xy-ch56-034"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那廝聞言，走出草堂，拍手打掌笑道：「兄弟們，造化，造化，冤家在我家裡也。」眾賊道：「那個冤家？」那廝道：「卻是打死我們頭兒的和尚，來我家借宿，現睡在草團瓢裡。」眾賊道：「卻好，卻好。拿住這些禿驢，一個個剁成肉醬：一則得那行囊、白馬，二來與我們頭兒報仇。」那廝道：「且莫忙，你們且去磨刀。等我煮飯熟了，大家吃飽些，一齊下手。」真個那些賊磨刀的磨刀，磨槍的磨槍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    これを聞くと、楊の老人の息子は座敷へ出て、両手を叩きながら笑った。
    楊の老人の息子「みんな、ついてる、ついてるぞ。仇が俺の家にいる！」
    賊たち「どの仇だ。」
    楊の老人の息子「俺たちの頭目を殺した坊主だ。俺の家へ泊まりに来て、今、草葺きの小屋で寝ている。」
    賊たち「ちょうどいい、ちょうどいい。あの禿げ驢馬どもを捕まえ、一人ずつひき肉になるまで叩き斬ってやろう。一つには荷物と白馬が手に入り、二つには頭目の仇が討てる。」
    楊の老人の息子「まあ待て。お前たちはまず刀を研げ。飯が炊けたら、みんなで腹いっぱい食って、それから一斉に手を下そう。」
    本当に賊たちは、刀を研ぐ者は刀を、槍を研ぐ者は槍を研ぎ始めた。
  "translation_status": "reviewed"
- "id": "xy-ch56-035"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老兒聽得此言，悄悄的走到後園，叫起唐僧四位道：「那廝領眾來了，知得汝等在此，意欲圖害。我老拙念你遠來，不忍傷害。快早收拾行李，我送你往後門出去罷。」三藏聽說，戰兢兢的叩頭謝了老者，即喚八戒牽馬，沙僧挑擔，行者拿了九環錫杖。老者開後門，放他去了，依舊悄悄的來前睡下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 176
    "line_end": 176
  "translation_ja": |-
    この言葉を聞いた楊の老人は、そっと裏庭へ行き、三蔵ら四人を起こした。
    楊の老人「あいつが仲間を引き連れて帰ってきました。あなた方がここにいると知り、殺そうとしています。わしは、遠くから来られたあなた方を、傷つけるには忍びない。早く荷物をまとめなさい。裏門からお送りしましょう。」
    三蔵は聞くと震え上がり、頭を地につけて老人に礼をした。すぐに八戒に馬を引かせ、沙悟浄に荷を担がせ、悟空には九環錫杖（きゅうかんしゃくじょう）を持たせた。楊の老人は裏門を開け、みなを逃がすと、またそっと表へ戻って寝た。
  "translation_status": "reviewed"
- "id": "xy-ch56-036"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那廝們磨快了刀槍，吃飽了飯食，時已五更天氣，一齊來到園中看處，卻不見了。即忙點燈著火，尋夠多時，四無蹤跡，但見後門開著。都道：「從後門走了，走了。」發一聲喊，趕上來。一個個如飛似箭，直趕到東方日出，卻才望見唐僧。那長老忽聽得喊聲，回頭觀看，後面有二三十人，槍刀簇簇而來。便叫：「徒弟啊，賊兵追至，怎生奈何？」行者道：「放心，放心，老孫了他去來。」三藏勒馬道：「悟空，切莫傷人，只嚇退他便罷。」行者那肯聽信，急掣棒回首相迎道：「列位那裡去？」眾賊罵道：「禿廝無禮！還我大王的命來。」那廝們圈子陣把行者圍在中間，舉槍刀亂砍亂搠。這大聖把金箍棒幌一幌，碗來粗細，把那夥賊打得星落雲散，搪著的就死，挽著的就亡；搕著的骨折，擦著的皮傷；乖些的跑脫幾個，痴些的都見閻王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    さて賊たちは、刀と槍を鋭く研ぎ、飯をたらふく食べた。時はすでに五更（ごこう）である。そろって庭へ来てみると、姿がない。急いで灯をともして火をつけ、長いこと探したが、どこにも跡がなく、ただ裏門が開いていた。
    賊たち「裏門から逃げたぞ、逃げたぞ！」
    一声どっと叫び、追いかけた。一人一人が飛ぶように、矢のように走り、東に日が昇るころまで追って、ようやく三蔵を見つけた。三蔵はふと叫び声を聞き、振り返ると、後ろから二、三十人が、槍や刀を林立させて迫ってくる。そこで呼んだ。
    三蔵「弟子よ、賊どもが追ってきた。どうすればよいのだ。」
    悟空「ご安心を、ご安心を。私が片づけてきます。」
    三蔵は馬を引きとめた。
    三蔵「悟空、決して人を傷つけてはならぬ。脅して退かせるだけでよい。」
    悟空がそんな言葉に従おうはずもない。急いで棒を抜き、振り向いて迎え撃った。
    悟空「皆さん、どちらへおいでで。」
    賊たちは罵った。
    賊たち「無礼な禿げめ！　俺たちの頭目の命を返せ！」
    賊たちは輪になって悟空を囲み、槍と刀を振るって、やたらに斬り、突いた。悟空は金箍棒を振って椀ほどの太さにすると、賊どもを落ちる星、散る雲のように打ち散らした。棒に打ち当たった者は死に、引っかかった者は命を落とし、ぶつかった者は骨を折り、かすった者は皮を傷つけた。利口な者は何人か逃げおおせたが、愚かな者はみな閻王（えんおう）に会うことになった。
  "translation_status": "reviewed"
- "id": "xy-ch56-037"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏在馬上見打倒許多人，慌的放馬奔西。豬八戒與沙和尚緊隨鞭鐙而去。行者問那不死帶傷的賊人道：「那個是那楊老兒的兒子？」那賊哼哼的告道：「爺爺，那穿黃的是。」行者上前，奪過刀來，把個穿黃的割下頭來，血淋淋提在手中，收了鐵棒，拽開雲步，趕到唐僧馬前，提著頭道：「師父，這是楊老兒的逆子，被老孫取將首級來也。」三藏見了，大驚失色，慌得跌下馬來，罵道：「這潑猢猻諕殺我也！快拿過，快拿過。」八戒上前，將人頭一腳踢下路傍，使釘鈀築些土蓋了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    三蔵は馬の上で大勢が打ち倒されるのを見て、慌てて馬を西へ走らせた。八戒と沙悟浄も、ぴたりと馬に付き従っていった。悟空は、死なずに傷を負っていた賊へ尋ねた。
    悟空「楊の老人の息子は、どいつだ。」
    傷を負った賊は、うめきながら告げた。
    傷を負った賊「お方さま、あの黄色い服の奴です。」
    悟空は前へ進み、刀を奪い取ると、黄色い服の男の首を切り落とした。血の滴る首を手に提げ、鉄棒をしまうと、雲を踏むような大股で追いかけた。三蔵の馬の前に追いつき、首を掲げて言った。
    悟空「お師匠さま、これが楊の老人の不孝息子です。私が首を取ってきました。」
    三蔵は見るなり仰天して血の気を失い、慌てて馬から転げ落ち、罵った。
    三蔵「この悪猿め、私を驚かせて殺す気か！　早く向こうへやれ、早く持っていけ！」
    八戒が進み出て、人の頭をひと蹴りで道ばたへ落とし、熊手で土を掘ってかぶせた。
  "translation_status": "reviewed"
- "id": "xy-ch56-038"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "沙僧放下擔子，攙著唐僧道：「師父請起。」那長老在地下正了性，口中念起緊箍兒咒來，把個行者勒得耳紅面赤，眼脹頭昏，在地下打滾，只教：「莫念，莫念。」那長老念夠有十餘遍，還不住口。行者翻觔斗，豎蜻蜓，疼痛難禁，只叫：「師父饒我罪罷，有話便說，莫念，莫念。」三藏卻才住口道：「沒話說，我不要你跟了，你回去罷。」行者忍疼磕頭道：「師父，怎的就趕我去耶？」三藏道：「你這潑猴兇惡太甚，不是個取經之人。昨日在山坡下打死那兩個賊頭，我已怪你不仁。及晚了到老者之家，蒙他賜齋借宿，又蒙他開後門放我等逃了性命。雖然他的兒子不肖，與我無干，也不該就梟他首；況又殺死多人，壞了多少生命，傷了天地多少和氣。屢次勸你，更無一毫善念，要你何為？快走，快走，免得又念真言。」行者害怕，只教：「莫念，莫念，我去也。」說聲去，一路觔斗雲，無影無蹤，遂不見了。咦！這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    沙悟浄は荷を下ろし、三蔵を支えた。
    沙悟浄「お師匠さま、お立ちください。」
    三蔵は地面で気を落ち着けると、口の中で緊箍児呪（きんこじじゅ）を唱え始めた。悟空は輪に締めつけられ、耳も顔も真っ赤になり、目は張り裂けそうで頭はくらくらし、地面を転げ回って、ただ叫んだ。
    悟空「唱えないでください、唱えないでください！」
    三蔵は十余遍も唱えたが、なお口を止めなかった。悟空は宙返りをしたり、逆立ちをしたりして、痛みに耐えかね、ただ叫んだ。
    悟空「お師匠さま、罪をお許しください。お話があればお話しください。唱えないで、唱えないでください！」
    ようやく三蔵は口を止め、言った。
    三蔵「話すことなどない。もうお前にはついて来てもらわぬ。帰っていけ。」
    悟空は痛みをこらえ、頭を地につけた。
    悟空「お師匠さま、どうして私を追い払うのです。」
    三蔵「お前という悪猿は、あまりに凶暴だ。経を取りに行く者ではない。昨日、山の斜面の下で二人の頭目を殺したときも、情けがないと責めたはずだ。その晩、老人の家へ行くと、食事を施し、宿を貸してくださった。そのうえ裏門を開け、私たちの命を救ってくださったのだ。その息子が不出来であろうとも、私たちには関わりのないこと。それなのに首を切るべきではなかった。まして大勢まで殺し、どれほどの命を損ない、天地の和らいだ気をどれほど傷つけたことか。何度諭しても、善い心が一かけらもない。お前を置いて何になろう。早く行け、早く行け。また真言を唱えられたくなければな。」
    悟空は恐れ、ただ言った。
    悟空「唱えないで、唱えないでください。行きますから。」
    行くと言うなり、觔斗雲（きんとうん）で飛び去り、影も跡もなく、ついに見えなくなった。ああ、まさしくこういうことだ。
  "translation_status": "reviewed"
- "id": "xy-ch56-039"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": "心有兇狂丹不熟，神無定位道難成。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    心に凶暴な狂いがあれば、丹（たん）は熟さず、
    精神が定まる所を失えば、道は成しがたい。
  "translation_status": "reviewed"
- "id": "xy-ch56-040"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知那大聖投向何方，且聽下分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 183
    "line_end": 183
  "translation_ja": "さて、悟空はいったいどこへ向かったのか。それは次回の物語で。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-01-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の霊台は心をいい、ここでの猿と馬は落ち着かない心や意をたとえる。六賊・三乗とともに、心を収める仏道修行を詠む。回題の心猿は悟空にも重なるが、詩をそのまま場面の人物名へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-02-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "本回冒頭は、サソリの精を殺して救出したことを悟空たちの功としてまとめる。前回には昴日星官の働きが描かれるが、その叙述に合わせて本回の原文を改変してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-03-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ヨモギ、ショウブ、ちまき、竜舟は端午の習俗に連なる景物。最後の句は、汨羅江に身を投げたと伝わる屈原を弔う竜舟の故事を踏まえる。岳陽市档案館の習俗説明で関係を照合した。旅の一行がこの川まで来た、または実際に舟を見たという意味ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-04-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の端陽と中天之節は端午の節句を指すと解した。特定の暦日へ換算せず、旅をしながら節句を空しく過ごすという叙述を保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-05-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "馬が猿を恐れるという由来は語り手による俗説的説明。現実の動物行動の一般則として保証するものではない。五百年前、玉帝による任官、御馬監、弼馬温という説明は原文どおり残した。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-06-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "虎皮花磕腦は、虎皮の模様のある頭のかぶり物と解し、材質の異なる金属製の兜などとは断定しない。原文の扢撻藤は、節くれだった藤の棒と解した。植物の厳密な種は未確認。巴山の虎と水から出た竜は二人の賊の勇猛さの比喩で、第三十四回の使いの妖怪「巴山虎」「倚海竜」だと同定していない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-07-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "生まれてから嘘をつかなかったという人物評を原文どおり残した。前の場面での三蔵の発言を根拠に、この評言を削除・修正してはいない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-08-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "沒搭撒は、教育部辞典で糊塗・不振作と説明される語。ここでは考えが足りず自分を引き合いに出した師への非難と解した。二八は二と八の和でなく十六歳。商売という言葉は、悟空が賊と渡り合う機会を喜ぶ皮肉として保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-09-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『礼記』大学の語句。徳が根本で財貨は枝葉だという教えを、悟空は包みの金銀を差し出すと言う口上に用いる。金銀については悟空の発言であり、語り手が包みの中身を確かめた描写ではない。粉面銀は白く輝く銀、錠は金銀の塊を数える語と解し、硬貨の枚数や現代の金額には換算していない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-10-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は來年打罷春。打春は春牛を鞭打って立春を迎える習俗につながり、『燕京歳時記』の打春の項でもその儀礼を確認できる。本句では翌年のその時期まで殴り続けても意に介さぬという誇張とした。何月何日の行事と固定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-11-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "蟒翻身拗步勢は、大蛇が身をひるがえすような動作と、体をひねって足を交差させる構えを表すと解した。具体的な流派の型へ同定していない。棒の一万三千五百斤は現代の重量に換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-12-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の珍字は\U00022DD1。教育部異体字字典は抮の異体として載せ、識典古籍に掲載された『漢語大詞典』の語義には口に含むとある。倒された男の口が地面の土に接する描写として訳したが、字音・用法には異なる説明があり、原字をほかの字へ訂正しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-13-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「頭上打了兩個大窟窿」。二人の頭の傷をまとめて二つと述べる形を保ち、一人に二穴ずつと断定しない。膏薬で死人の傷を治そうとするやり取りは、作中の誤認と笑いであり、治療の助言ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-14-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文ではまず熊手で三尺掘り、岩に阻まれてから鼻で二尺五ずつ二度、五尺と述べる。二尺五は二尺五寸と解した。深さを足して八尺に直したり、一度に五尺掘ったことにしたりしない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-15-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵は、師弟でありながら孫姓と陳姓を区別して述べる。姓としての陳は既存の人名・老人の同形語と区別し、姓一般の辞書項目へ結ぶ。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-16-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空の回想では前後それぞれ七、八打というが、先の叙述には七、八打、さらに二、三人の乱打、五、六十打とある。不整合を本文の数の修正によって解消しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-17-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ここで列挙する神々の服従は、死者を威嚇する悟空自身の主張。東岳天齊は既出の東嶽齊天と字順が異なるが、そのまま訳す。十代閻君は冥界の十王の集合と解した。五路猖神の具体的な神名・正体、五司が仏教・道教のどの体系かは本回だけでは確定せず、単一説に絞らない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-18-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の紅蓬を赤いヨモギと訳し、紅花など別の字には改めない。葵は古い菜園のアオイ類と解するが、植物の厳密な種は確定しない。景物としての柏も、日本の落葉広葉樹のカシワと同一視しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-19-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三人の顔と神の対応は、三蔵がここで初めて明示する。前段落で老人が夜叉・馬面・雷公を列挙する時点の本文では、各名にどの弟子が対応するかは先取りしない。悟空の孫・ひ孫・やしゃごは誇張した言い返しであり、実際の家系の説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-20-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "抗禮は相手と対等な立場の礼をとること。ここでは年長の主人へ相応の敬意を払うよう命じる言葉とした。礼を一切せず反抗する、という意味には取っていない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-21-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "養不著他は、息子を養い育てても手元に収まらず、思うようにならないという嘆きと解した。単に食費を賄えないという経済上の訴えや、実の息子ではないという意味へ限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-22-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は兩個稻草。藁の量詞が通常と異なるが、寝床用のまとまり二つと解して二束とした。先の一束を求める台詞と、実際に二つ取らせる叙述の違いを残す。團瓢は教育部辞典で小屋と説明され、ここでは草葺きの小屋と訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-23-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は自天早。先行する襲撃場面では日暮れが近いと述べられるため、この早い時刻という表現とは整合しきらない。天早を夕方へ訂正せず、原文の表現を残した。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-24-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "結びの丹は、心身の修行を丹の生成に重ねる内丹的表現。具体的な薬の服用や次回の展開の説明にはしていない。"
  "translation_status": "reviewed"
- "id": "xy-ch56-note-25-body"
  "section_id": "chapter-56"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の有二十里向開田地は、二十里余り離れるまで進んだ道のりと解した。教育部『重編國語辭典修訂本』の田地には路程の語義がある。開を開けた土地の描写とはせず、里を現代の距離へ換算しない。向開の細かな程度は厳密に確定しない。"
  "translation_status": "reviewed"

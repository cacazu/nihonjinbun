    "line_end": 157
  "translation_ja": |-
    三蔵はそれを見るに忍びず、すぐに八戒へ命じた。
    三蔵「早く熊手で穴を掘り、埋めてやりなさい。私は二人のために倒頭経（とうとうきょう）を一巻読んでやろう。」
    八戒「お師匠さま、人の使い方が逆ですよ。悟空が殺したんだから、葬るのも悟空にやらせるべきでしょう。なぜ俺が土掘りをするんです。」
    師に罵られて腹を立てていた悟空が、八戒を怒鳴りつけた。
    悟空「怠け者のうすのろめ！　さっさと埋めに行け。少しでもぐずぐずしたら、お前にも一発だ。」
    八戒は慌てて、山の斜面の下を三尺（しゃく）ほど掘ったが、その下は岩の根ばかりで、熊手の歯がつかえてしまった。熊手を放り出し、鼻で掘り返した。柔らかい所へ行き当たると、一度のひとかきで二尺五寸（すん）、二度で五尺の深さになった。二人の賊の死体を埋め、一つの塚を盛り上げた。
    三蔵「悟空、線香と蝋燭を持ってきなさい。祈りを捧げ、それから経を読もう。」
    悟空は口を尖らせた。
    悟空「ほんとうに事情が分かっておられない。この山の中腹は、前にも村はなく、後ろにも宿はない。線香や蝋燭がどこにあります。金があっても買う所がありませんよ。」
    三蔵は腹立たしげに言った。
    三蔵「猿め、向こうへ行っていろ。私は土をつまんで香に代え、祈るとしよう。」
    三蔵は鞍を離れて野の塚を悲しみ、聖なる僧は善き思いで荒野の墓に祈った。その祈りは、
  "translation_status": "reviewed"
- "id": "xy-ch56-023"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": "拜惟好漢，聽禱原因：念我弟子，東土唐人。奉太宗皇帝旨意，上西方求取經文。適來此地，逢爾多人，不知是何府、何州、何縣，都在此山內結黨成群。我以好話，哀告慇懃。爾等不聽，反善生嗔。卻遭行者，棍下傷身。切念屍骸暴露，吾隨掩土盤墳。折青竹為香燭，無光彩，有心勤；取頑石作施食，無滋味，有誠真。你到森羅殿下興詞，倒樹尋根，他姓孫，我姓陳，各居異姓。冤有頭，債有主，切莫告我取經僧人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    三蔵「つつしんで、豪傑のお二方に申し上げます。祈る訳をお聞きください。
    仏弟子たる私は、東の地の唐の者。
    太宗皇帝（たいそうこうてい）の命を受け、西方へ経典を求めて参ります。
    たまたまこの地へ来て、あなた方大勢に出会いました。
    どの府、どの州、どの県の者とも知りませんが、
    みなこの山で徒党を組んでおいででした。
    私はよい言葉をかけ、心を尽くしてお願いしたのに、
    あなた方は聞かず、善意に返して怒りを起こしました。
    そして悟空に遭い、その棒の下で命を失いました。
    屍が野にさらされるのを忍びなく思い、
    私はすぐ土をかぶせ、塚を築いたのです。
    青竹を折って線香と蝋燭に代えました。
    光はなくとも、心は尽くしております。
    ただの石をお供えの食に代えました。
    味はなくとも、まことはこもっております。
    あなた方が森羅殿（しんらでん）へ行って訴えを起こし、
    木を倒して根をたどるように、事の元を追うならば、
    あれは孫（そん）姓、私は陳（ちん）姓、それぞれ姓の違う者です。
    恨みには相手があり、借りには負い主がある。
    経を取りに行くこの僧を、決して訴えないでください。」

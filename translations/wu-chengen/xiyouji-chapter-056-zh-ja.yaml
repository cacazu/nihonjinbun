- "id": "xy-ch56-002"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 122
    "line_end": 122
  "translation_ja": "詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch56-003"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    靈臺無物謂之清，寂寂全無一念生。
    猿馬牢收休放蕩，精神謹慎莫崢嶸。
    除六賊，悟三乘，萬緣都罷自分明。
    色邪永滅超真界，坐享西方極樂城。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 124
    "line_end": 127
  "translation_ja": |-
    心のうちに一物もなければ清らかといい、
    静まり返って、一つの思念も生じない。
    猿と馬を固く収めて、放縦にさせず、
    精神を慎み守り、猛り立たせてはならぬ。
    六賊（ろくぞく）を除き、三乗（さんじょう）を悟れば、
    あらゆる縁がやみ、おのずと明らかになる。
    色欲の邪念を永く滅して、真なる世界へ超え入り、
    西方極楽（さいほうごくらく）の都に坐して楽しみを受けるのだ。
  "translation_status": "reviewed"
- "id": "xy-ch56-004"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說唐三藏咬釘嚼鐵，以死命留得一個不壞之身，感蒙行者等打死蝎子精，救出琵琶洞。一路無詞，又早是朱明時節。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 129
    "line_end": 129
  "translation_ja": "さて三蔵（さんぞう）は、釘をかみ鉄をかみ砕くほどの堅い決意で、命がけで犯されぬ身を守り通し、ありがたくも悟空（ごくう）たちにサソリの精を殺してもらい、琵琶洞（びわどう）から救い出された。道中には語るほどのこともなく、早くも夏の季節となった。見れば、"
  "translation_status": "reviewed"
- "id": "xy-ch56-005"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    熏風時送野蘭香，濯雨才晴新竹涼。
    艾葉滿山無客採，蒲花盈澗自爭芳。
    海榴嬌艷遊蜂喜，溪柳陰濃黃雀狂。
    長路那能包角黍，龍舟應弔汨羅江。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 131
    "line_end": 134
  "translation_ja": |-
    暖かな風は折々、野の蘭の香りを送り、
    洗うような雨がやんだばかりで、若竹は涼しげだ。
    ヨモギの葉は山いっぱいなのに、採る旅人もなく、
    ショウブの花は谷川を埋め、おのずと香りを競う。
    ザクロはあでやかに咲いて、飛ぶ蜂を喜ばせ、
    渓辺の柳は濃い陰を作り、黄色い雀が戯れる。
    長旅の身には、どうしてちまきを包む暇があろう。
    竜舟（りゅうしゅう）は今ごろ、汨羅江（べきらこう）で死者を弔っていることだろう。
  "translation_status": "reviewed"
- "id": "xy-ch56-006"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他師徒們行賞端陽之景，虛度中天之節，忽又見一座高山阻路。長老勒馬回頭叫道：「悟空，前面有山，恐又生妖怪，是必謹防。」行者等道：「師父放心。我等皈命投誠，怕甚妖怪？」長老聞言甚喜。加鞭催駿馬，放轡趲蛟龍。須臾，上了山崖，舉頭觀看，真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    師弟は歩きながら端午の景色を眺め、節句の祝いもせずに過ごしていたが、不意にまた高い山が行く手をふさいだ。三蔵は馬の手綱を引き、振り返って呼びかけた。
    三蔵「悟空、前に山がある。また妖怪が出るかもしれぬ。必ず用心するのだぞ。」
    悟空たち「お師匠さま、ご安心ください。私たちは命をささげ、まことの心で仏道に帰依した身です。妖怪など、何を恐れましょう。」
    三蔵はこれを聞いて大いに喜んだ。鞭を加えて駿馬を促し、手綱を緩めて蛟竜（こうりゅう）を進ませる。ほどなく山の崖へ上がり、頭を上げて眺めると、まさしくこのようであった。
  "translation_status": "reviewed"
- "id": "xy-ch56-007"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": "頂巔松柏接雲青，石壁荊榛掛野藤。萬丈崔巍，千層懸削。萬丈崔巍峰嶺峻，千層懸削壑崖深。蒼苔碧蘚鋪陰石，古檜高槐結大林。林深處，聽幽禽，巧聲睍睆實堪吟。澗內水流如瀉玉，路傍花落似堆金。山勢惡，不堪行，十步全無半步平。狐狸糜鹿成雙遇，白鹿玄猿作對迎。忽聞虎嘯驚人膽，鶴鳴振耳透天庭。黃梅紅杏堪供食，野草閑花不識名。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    頂の松と柏（はく）は青々として雲に接し、
    石壁の茨や榛には、野の蔓が垂れかかる。
    万丈（じょう）にそびえ立ち、千層に切り立つ。
    万丈にそびえ立つ峰々は険しく、
    千層に切り立つ谷と崖は深い。
    青い苔は日陰の石を覆い、
    古いヒノキ類の木と高いエンジュが大きな林をなす。
    林の奥から、隠れた鳥の声が聞こえ、
    巧みにさえずる美しい声は、まことに歌いたくなるほどだ。
    谷川の水は玉を流すように走り、
    道ばたに散った花は金を積んだかのよう。
    山の形は険しく、歩くにも難儀し、
    十歩のうちに半歩とて平らな所はない。
    狐や狸、鹿の類には二頭ずつ出会い、
    白鹿と黒い猿も、二頭連れで迎える。
    不意の虎の咆哮は人の肝を冷やし、
    鶴の鳴き声は耳を震わせ、天上まで通る。
    黄色い梅や赤い杏は食べるにもよく、
    野の草やひっそり咲く花には、名も知らぬものがある。
  "translation_status": "reviewed"
- "id": "xy-ch56-008"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "四眾進山，緩行良久，過了山頭。下西坡，乃是一段平陽之地。豬八戒賣弄精神，教沙和尚挑著擔子，他雙手舉鈀，上前趕馬。那馬更不懼他，憑那獃子嗒笞笞的，還只是緩行不緊。行者道：「兄弟，你趕他怎的？讓他慢慢走罷了。」八戒道：「天色將晚，自上山行了這一日，肚裡餓了，大家走動些，尋個人家，化些齋吃。」行者聞言道：「既如此，等我教他快走。」把金箍棒幌一幌，喝了一聲，那馬溜了韁，如飛似箭，順平路往前去了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    四人は山へ入り、長いことゆっくり歩いて山頂を越えた。西の斜面を下ると、平らな土地が続いていた。八戒（はっかい）は元気をひけらかし、沙悟浄（さごじょう）に荷を担がせ、自分は両手で熊手を掲げて前へ出て馬を追い立てた。ところが馬は、八戒を少しも恐れない。八戒が「しっ、しっ」といくら追いたてても、ゆっくり歩いたままで、急ごうとしなかった。
    悟空「おい、どうしてそう追うんだ。ゆっくり歩かせておけばいい。」
    八戒「もう日が暮れるだろう。山へ登ってから一日じゅう歩いて、腹が減ったんだ。みんな少し足を速めて、人家を探し、精進の食事を恵んでもらおうよ。」
    悟空はそれを聞いて言った。
    悟空「それなら、俺が速く歩かせてやろう。」
    金箍棒（きんこぼう）をひと振りし、一声叱りつけると、馬は手綱を振りほどく勢いで、飛ぶように、矢のように、平らな道を前へ駆けていった。
  "translation_status": "reviewed"
- "id": "xy-ch56-009"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你說馬不怕八戒，只怕行者何也？行者五百年前曾受玉帝封在大羅天御馬監養馬，官名弼馬溫，故此傳留至今，是馬皆懼猴子。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 141
    "line_end": 141
  "translation_ja": "さて、馬が八戒を恐れず、悟空だけを恐れたのは、なぜだと思われるか。悟空は五百年前、玉帝（ぎょくてい）から役目を授かり、大羅天（だいらてん）の御馬監（ぎょばかん）で馬を飼ったことがある。その官名は弼馬温（ひつばおん）といった。そのことが今に伝わって、馬という馬はみな猿を恐れるのである。"
  "translation_status": "reviewed"
- "id": "xy-ch56-010"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老挽不住韁繩，只扳緊著鞍鞽，讓他放了一路轡頭，有二十里向開田地，方才緩步而行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 143
    "line_end": 143
  "translation_ja": "三蔵は手綱を引きとめられず、鞍の前輪をしっかりつかむばかり。馬の走るに任せて二十里（り）余りもの道のりを進み、そこでようやく馬はゆっくり歩き始めた。"
  "translation_status": "reviewed"
- "id": "xy-ch56-011"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正走處，忽聽得一棒鑼聲，路兩邊閃出三十多人，一個個槍刀棍棒，攔住路口道：「和尚，那裡走？」諕得個唐僧戰兢兢，坐不穩，跌下馬來，蹲在路傍草科裡，只叫：「大王饒命，大王饒命。」那為頭的兩個大漢道：「不打你，只是有盤纏留下。」長老方才省悟，知他是一夥強人，卻欠身擡頭觀看。但見他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    そのまま進んでいると、突然、銅鑼が一つ鳴り、道の両側から三十人余りが飛び出してきた。一人一人が槍や刀、棍棒を持ち、道をふさいで言った。
    賊たち「坊主、どこへ行く！」
    三蔵は恐ろしさにぶるぶる震え、鞍に腰を据えていられず、馬から転げ落ちた。道ばたの草むらにうずくまり、ただ叫んだ。
    三蔵「大王さま、お命ばかりは！　大王さま、お命ばかりは！」
    先頭に立つ二人の大男が言った。
    二人の頭目「殴りゃしない。ただ、路銀を持っているなら置いていけ。」
    三蔵はそれでようやく、相手が一団の追いはぎだと悟った。少し身を起こして顔を上げ、見てみると、
  "translation_status": "reviewed"
- "id": "xy-ch56-012"
  "section_id": "chapter-56"
  "kind": "verse"
  "origin": "source"
  "source_text": "一個青臉獠牙欺太歲，一個暴睛圜眼賽喪門。鬢邊紅髮如飄火，頷下黃鬚似插針。他兩個頭戴虎皮花磕腦，腰繫貂裘彩戰裙。一個手中執著狼牙棒，一個肩上橫擔扢撻藤。果然不亞巴山虎，真個猶如出水龍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    一人は青い顔に牙をむき、太歳（たいさい）さえしのぎ、
    一人は丸い眼をむき出して、喪門（そうもん）にも劣らない。
    鬢の赤毛は燃え立つ火のようで、
    顎の黄色い髭は針を差したかのようだ。
    二人とも、頭には虎皮のまだらなかぶり物を着け、
    腰には貂の毛皮の色鮮やかな戦装束を巻く。
    一人は狼牙棒（ろうがぼう）を手に持ち、
    一人は節くれだった藤の棒を肩に横たえる。
    まことに巴山（はざん）の虎にも劣らず、
    まさしく水から躍り出た竜にも似ていた。
  "translation_status": "reviewed"
- "id": "xy-ch56-013"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏見他這般兇惡，只得走起來，合掌當胸道：「大王，貧僧是東土唐王差往西天取經者。自別了長安，年深日久，就有些盤纏也使盡了。出家人專以乞化為由，那得個財帛？萬望大王方便方便，讓貧僧過去罷。」那兩個賊帥眾向前道：「我們在這裡起一片虎心，截住要路，專要些財帛，甚麼方便方便？你果無財帛，快早脫下衣服，留下白馬，放你過去。」三藏道：「阿彌陀佛！貧僧這件衣服是東家化布，西家化針，零零碎碎化來的。你若剝去，可不害殺我也？只是這世裡做得好漢，那世裡變畜生哩。」那賊聞言大怒，掣大棍，上前就打。這長老口內不言，心中暗想道：「可憐！你只說你的棍子，還不知我徒弟的棍子哩。」那賊那容分說，舉著棒，沒頭沒臉的打來。長老一生不會說謊，遇著這急難處，沒奈何，只得打個誑語道：「二位大王且莫動手。我有個小徒弟，在後面就到，他身上有幾兩銀子，把與你罷。」那賊道：「這和尚是也吃不得虧，且綑起來。」眾嘍囉一齊下手，把一條繩綑了，高高吊在樹上。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    三蔵は、二人のこんな恐ろしい様子を見ると、やむなく立ち上がり、胸の前で手を合わせた。
    三蔵「大王さま、私は東の地の唐王（とうおう）から、西天（さいてん）へ経を取りに行くよう遣わされた僧でございます。長安（ちょうあん）を発ってから長い年月がたち、路銀があったとしても、もう使い果たしております。出家の身は、ただ施しを乞うて暮らすもの。どうして財物など持ちましょう。どうか大王さま、お慈悲を、お慈悲をもって、私をお通しください。」
    二人の頭目は仲間を率いて進み出た。
    二人の頭目「俺たちはここで虎のような心を起こし、道の要所をふさいで、ただ金品を奪っているんだ。何が『お慈悲を、お慈悲を』だ。ほんとうに金品がないなら、さっさと服を脱ぎ、その白馬を置いていけ。そうすれば通してやる。」
    三蔵「阿弥陀仏（あみだぶつ）！　私のこの衣は、東の家で布を、西の家で針をと、少しずつ施しを受けて作ったものです。それまで剥ぎ取られては、私は生きていけません。今の世で豪傑を気取っても、次の世では畜生に生まれ変わりますぞ。」
    賊の一人はこれを聞いて激怒し、大きな棒を抜き出し、前へ出て殴りつけた。三蔵は口には出さなかったが、心の中でこう思った。
    三蔵「ああ、気の毒なことだ。お前は自分の棒ばかり頼みにして、まだ私の弟子の棒を知らぬのだな。」
    賊は言い分を聞こうともせず、棒を振り上げ、頭だろうが顔だろうが構わず殴りつける。三蔵は生まれてこのかた嘘をつけなかったが、この危急に遭ってはどうしようもなく、やむなくでたらめを言った。
    三蔵「お二方の大王さま、どうか手をお止めください。私には若い弟子がおりまして、すぐ後から参ります。銀を数両（りょう）持っておりますから、それを差し上げましょう。」
    賊の一人「この坊主も、損をするのは嫌とみえるな。ひとまず縛っておけ。」
    手下たちは一斉に取りつき、縄一本で三蔵を縛り上げ、木の高い所へ吊るした。
  "translation_status": "reviewed"
- "id": "xy-ch56-014"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三個撞禍精隨後趕來。八戒呵呵大笑道：「師父去得好快，不知在那裡等我們哩。」忽見長老在樹上，他又說：「你看師父，等便罷了，卻又有這般心腸，爬上樹去，扯著藤兒打鞦韆耍子哩。」行者見了道：「獃子，莫亂談。師父吊在那裡不是？你兩個慢來，等我去看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    さて、後から三人の騒動の種が追いついてきた。八戒は、はははと大笑いした。
    八戒「お師匠さまはずいぶん速く行ってしまったな。どこで俺たちを待っているんだろう。」
    ふと木の上の三蔵を見つけ、また言った。
    八戒「お師匠さまを見ろよ。待っているだけでいいのに、あんな遊び心もあったんだな。木へ登って蔓につかまり、ぶらんこをして遊んでいるぞ。」
    悟空は見て言った。
    悟空「ばか、でたらめを言うな。お師匠さまは、あそこに吊るされているんじゃないか。二人はゆっくり来い。俺が見てくる。」
  "translation_status": "reviewed"
- "id": "xy-ch56-015"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，急登高坡細看，認得是夥強人，心中暗喜道：「造化，造化，買賣上門了。」即轉步，搖身一變，變做個乾乾淨淨的小和尚，穿一領緇衣，年紀只有二八，肩上背著一個藍布包袱。拽開步，來到前邊，叫道：「師父，這是怎麼說話？這都是些甚麼歹人？」三藏道：「徒弟呀，還不救我一救，還問甚的？」行者道：「是幹甚勾當的？」三藏道：「這一夥攔路的把我攔住，要買路錢。因身邊無物，遂把我吊在這裡，只等你來計較計較。不然，把這匹馬送與他罷。」行者聞言，笑道：「師父不濟，天下也有和尚，似你這樣皮鬆的卻少。唐太宗差你往西天見佛，誰教你把這龍馬送人？」三藏道：「徒弟呀，似這等吊起來，打著要，怎生是好？」行者道：「你怎麼與他說來？」三藏道：「他打的我急了，沒奈何，把你供出來也。」行者道：「師父，你好沒搭撒。你供我怎的？」三藏道：「我說你身邊有些盤纏，且教他莫打我，是一時救難的話兒。」行者道：「好好好，承你擡舉，正是這樣供。若肯一個月供得七八十遭，老孫越有買賣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"

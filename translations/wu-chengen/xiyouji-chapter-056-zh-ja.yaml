    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    八戒は笑った。
    八戒「お師匠さま、自分の責任はきれいに逃れましたね。あいつが殴ったときには、俺たち二人もいませんでしたよ。」
    三蔵は、本当にもう一度土をつまんで祈った。
    三蔵「豪傑のお二方、訴えるなら悟空だけを訴えてください。八戒と沙悟浄にも関わりのないことです。」

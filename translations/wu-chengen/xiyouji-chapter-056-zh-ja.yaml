    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    さすがは悟空、急いで高い坂へ登り、よく見ると、一団の追いはぎだと分かった。心の中で喜んだ。
    悟空「ついてる、ついてる。向こうから商売がやって来たぞ。」
    すぐに身を引き、体を揺すって、こざっぱりした若い僧へと姿を変えた。黒い僧衣を一着まとい、年はわずか十六、肩には青い布の包みを背負っている。大股で前へ進み、呼びかけた。
    悟空「お師匠さま、これはどうしたことです。ここにいるのは、どんな悪党どもですか。」
    三蔵「弟子よ、まだそんなことを聞いていないで、早く助けてくれぬか。」
    悟空「何をする連中なのです。」
    三蔵「この追いはぎどもが私を止め、通行料をよこせと言うのだ。身に何も持たぬので、ここへ吊るされ、お前が来て話をつけるのを待っている。そうでなければ、この馬をやってしまおうか。」
    悟空は聞いて笑った。
    悟空「お師匠さまは頼りになりませんね。天下に坊主は大勢いても、あなたほど腰の据わらない方は少ない。唐太宗（とうたいそう）があなたを西天へ遣わしたのは、仏に会わせるためでしょう。この竜馬（りゅうめ）を人にくれてやれと、誰が言ったのです。」
    三蔵「弟子よ、こうして吊るされ、殴って金を出せと迫られては、どうすればよいのだ。」
    悟空「相手に何と言ったのです。」
    三蔵「あまりにひどく殴られるので、やむをえず、お前のことを白状したのだ。」
    悟空「お師匠さま、それはあまりに無分別です。なぜ私を引き合いに出すのです。」
    三蔵「お前が少し路銀を持っていると話し、とりあえず殴るのをやめさせた。一時の難を逃れるための言葉なのだ。」
    悟空「けっこう、けっこう、けっこう。私を買ってくださって、ありがたいことです。まさに、そう白状すればいい。ひと月に七、八十回もそうしてくだされば、私にはますます商売の種が増えますよ。」
  "translation_status": "reviewed"
- "id": "xy-ch56-016"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那夥賊見行者與他師父講話，撒開勢，圍將上來道：「小和尚，你師父說你腰裡有盤纏，趁早拿出來，饒你們性命；若道半個『不』字，就都送了你的殘生。」行者放下包袱道：「列位長官，不要嚷。盤纏有些在此包袱，不多，只有馬蹄金二十來錠，粉面銀二三十錠，散碎的未曾見數。要時就連包兒拿去，切莫打我師父。古書云：『德者，本也；財者，末也。』此是末事。我等出家人自有化處，若遇著個齋僧的長者，襯錢也有，衣服也有，能用幾何？只望放下我師父來，我就一並奉承。」那夥賊聞言，都甚歡喜道：「這老和尚慳吝，這小和尚倒還慷慨。」教：「放下來。」那長老得了性命，跳上馬，顧不得行者，操著鞭，一直跑回舊路。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    賊たちは、悟空が師と話しているのを見ると、勢いこんで周りを囲んだ。
    賊たち「小坊主、師匠の話では、お前が腰に路銀を持っているそうだな。さっさと出せば、二人の命は助けてやる。半言でも『いや』と言ってみろ。残る命を、そろって捨てることになるぞ。」
    悟空は包みを下ろした。
    悟空「お役人の皆さん、そう騒がないでください。路銀は、この包みに少しあります。多くはなくて、馬蹄金（ばていきん）が二十余個、白く輝く銀の塊が二、三十個。それに細かいものは、まだ数えておりません。ご入用なら包みごとお持ちください。ただ、私の師を殴らないでください。古い書物にも『徳は本、財は末』とあります。こんなものは末のこと。私たち出家の者には、施しを乞う所があります。僧に食事を施す長者に会えば、お布施のお金も衣服もいただける。どれほど使うものでもありません。ただ師を下ろしてくだされば、まとめてみな差し上げましょう。」
    賊たちは聞いて、すっかり喜んだ。
    賊たち「この老いぼれ坊主はけちだが、小坊主のほうは気前がいいな。」
    賊たち「下ろしてやれ。」
    三蔵は命が助かると馬へ飛び乗り、悟空のことなど構わず、鞭を振るって、来た道をまっすぐ引き返していった。
  "translation_status": "reviewed"
- "id": "xy-ch56-017"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者忙叫道：「走錯路了。」提著包袱，就要追去。那夥賊攔住道：「那裡走？將盤纏留下，免得動刑。」行者笑道：「說開，盤纏須三分分之。」那賊頭道：「這小和尚忒乖，就要瞞著他師父留起些兒。也罷，拿出來看，若多時，也分些與你背地裡買果子吃。」行者道：「哥呀，不是這等說，我那裡有甚盤纏？說你兩個打劫別人的金銀，是必分些與我。」那賊聞言大怒，罵道：「這和尚不知死活，你倒不肯與我，反問我要。不要走，看打。」掄起一條扢撻藤棍，照行者光頭上打了七八下。行者只當不知，且滿面陪笑道：「哥呀，若是這等打，就打到來年打罷春也是不當真的。」那賊大驚道：「這和尚好硬頭！」行者笑道：「不敢，不敢，承過獎了，也將就看得過。」那賊那容分說，兩三個一齊亂打。行者道：「列位息怒，等我拿出來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    悟空は慌てて叫んだ。
    悟空「道が違いますよ！」
    包みを提げ、追おうとしたが、賊たちが立ちはだかった。
    賊たち「どこへ行く。路銀を置いていけば、痛めつけずに済むぞ。」
    悟空は笑った。
    悟空「話をつけましょう。路銀は三等分にしてもらいますよ。」
    賊の頭目「この小坊主、なかなか抜け目がない。師匠に隠して、少し取っておきたいんだな。よかろう、出して見せろ。たくさんあれば、お前にも少し分けて、こっそり菓子を買わせてやろう。」
    悟空「兄さん、そういう話じゃありませんよ。俺に路銀なんぞ、どこにある。あんたたち二人が人から奪った金銀を、必ず俺にも少し分けろと言っているんだ。」
    賊の一人は聞くなり激怒し、罵った。
    賊の一人「この坊主、命知らずめ！　俺によこすどころか、俺から取ろうというのか。逃げるな、これでも食らえ！」
    節くれだった藤の棒を振り回し、悟空の丸坊主の頭を七、八度殴った。悟空は知らぬ顔をし、満面に愛想笑いを浮かべた。
    悟空「兄さん、そんな殴り方では、来年の春迎えが済むまで殴っても、本気で相手にするほどのことはないよ。」
    賊の一人は驚いた。
    賊の一人「この坊主、なんて硬い頭だ！」
    悟空は笑った。
    悟空「いやいや、お褒めにあずかって。まあ、どうにか見られる程度ですよ。」
    賊たちは言葉も聞かず、二、三人が一斉にめちゃくちゃに殴りつけた。
    悟空「皆さん、怒りを鎮めてください。今、出して見せますから。」

    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    脳みそを叩き出したと聞くと、八戒は慌てて駆け戻り、三蔵へ告げた。
    八戒「あの一団は、おしまいです。」
    三蔵「よいことだ、よいことだ。どちらの道へ去ったのだ。」
    八戒「殴られて足を突っ張らせたのに、まだどこへ歩いていけるんです。」
    三蔵「では、なぜ一団がおしまいだと言うのだ。」
    八戒「殺されたんです。おしまいでなくて、何なんです。」
    三蔵は尋ねた。
    三蔵「どんなふうに打たれたのだ。」
    八戒「頭に、大きな穴が二つ開いています。」
    三蔵「包みを開いて、お布施のお金を数文（もん）出しなさい。早くどこかで膏薬を二枚もらって、二人に貼ってやるのだ。」
    八戒は笑った。
    八戒「お師匠さま、どうも真面目な話になりませんよ。膏薬は生きた人の腫れ物には貼れても、死人の穴へどうして貼れますか。」
    三蔵「ほんとうに殺したのか！」
    三蔵は怒り出し、猿め、猿めと、口でぶつぶつ言っては罵り続けた。馬を返し、沙悟浄、八戒とともに死者の前へ行くと、山の斜面の下に、血まみれになって倒れていた。

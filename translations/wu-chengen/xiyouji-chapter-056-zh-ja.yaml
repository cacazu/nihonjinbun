  "source_text": "八戒聽說打出腦子來，慌忙跑轉去，對唐僧道：「散了夥也。」三藏道：「善哉！善哉！往那條路上去了？」八戒道：「打也打得直了腳，又會往那裡去走哩？」三藏道：「你怎麼說散夥？」八戒道：「打殺了，不是散夥是甚的？」三藏問：「打的怎麼模樣？」八戒道：「頭上打了兩個大窟窿。」三藏教：「解開包，取幾文襯錢，快去那裡討兩個膏藥，與他兩個貼貼。」八戒笑道：「師父好沒正經，膏藥只好貼得活人的瘡瘇，那裡好貼得死人的窟窿？」三藏道：「真打死了？」就惱起來，口裡不住的絮絮叨叨，猢猻長，猴子短。兜轉馬，與沙僧、八戒至死人前，見那血淋淋的倒臥山坡之下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"

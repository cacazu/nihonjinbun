  "origin": "source"
  "source_text": "好大聖，耳中摸一摸，拔出一個繡花針兒道：「列位，我出家人，果然不曾帶得盤纏，只這個針兒送你罷。」那賊道：「晦氣呀，把一個富貴和尚放了，卻拿住這個窮禿驢。你好道會做裁縫？我要針做甚的？」行者聽說不要，就拈在手中，幌了一幌，變作碗來粗細的一條棍子。那賊害怕道：「這和尚生得小，倒會弄術法兒。」行者將棍子插在地下道：「列位拿得動，就送你罷。」兩個賊上前搶奪，可憐就如蜻蜓撼石柱，莫想弄動半分毫。這條棍本是如意金箍棒，天秤稱的一萬三千五百斤重，那夥賊怎麼知得？大聖走上前，輕輕的拿起，丟一個蟒翻身拗步勢，指著強人道：「你都造化低，遇著我老孫了。」那賊上前來，又打了五六十下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"

- "id": "xy-ch56-020"
  "section_id": "chapter-56"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說唐僧騎著馬，往東正跑，八戒、沙僧攔住道：「師父往那裡去？錯走路了。」長老兜馬道：「徒弟啊，趁早去與你師兄說，教他棍下留情，莫要打殺那些強盜。」八戒道：「師父住下，等我去來。」獃子一路跑到前邊，厲聲高叫道：「哥哥，師父教你莫打人哩。」行者道：「兄弟，那曾打人？」八戒道：「那強盜往那裡去了？」行者道：「別個都散了，只是兩個頭兒在這裡睡覺哩。」八戒笑道：「你兩個遭瘟的，好道是熬了夜，這般辛苦，不往別處睡，卻睡在此處。」獃子行到身邊，看看道：「倒與我是一起的，乾淨張著口睡，淌出些粘涎來了。」行者道：「是老孫一棍子打出豆腐來了。」八戒道：「人頭上又有豆腐？」行者道：「打出腦子來了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch56-1455605"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第056回&oldid=1455605"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    さて、三蔵が馬に乗って東へ逃げていると、八戒と沙悟浄が引きとめた。
    八戒と沙悟浄「お師匠さま、どちらへ行くのです。道が違います。」
    三蔵は馬を引き戻した。
    三蔵「弟子よ、早くお前たちの兄弟子へ言ってきてくれ。棒を振るうにも情けをかけて、あの盗賊たちを殺してはならぬと。」
    八戒「お師匠さまは、ここで待っていてください。俺が行ってきます。」
    八戒は道を走っていき、大声で叫んだ。
    八戒「兄貴、お師匠さまが、人を殴るなってさ。」
    悟空「弟よ、いつ俺が人を殴った？」
    八戒「それじゃ、盗賊たちはどこへ行ったんだ。」
    悟空「ほかの奴らは散っていった。ただ、頭目の二人だけは、ここで寝ているよ。」
    八戒は笑った。
    八戒「こら、疫病にかかっちまえ。二人とも徹夜でもして、そんなにくたびれたのか。ほかで寝ずに、こんな所で寝るとはな。」
    八戒はそばへ寄り、眺めて言った。
    八戒「俺と同じ仲間だな。すっかり口を開けて寝て、よだれまで垂らしている。」
    悟空「俺の棒の一撃で、豆腐を叩き出したのさ。」
    八戒「人の頭にも、豆腐が入っているのか。」
    悟空「脳みそを叩き出したんだよ。」
  "translation_status": "reviewed"
- "id": "xy-ch56-021"

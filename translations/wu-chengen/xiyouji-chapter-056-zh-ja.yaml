  "source_text": "這長老甚不忍見，即著八戒：「快使釘鈀，築個坑子埋了，我與他念卷《倒頭經》。」八戒道：「師父左使了人也。行者打殺人，還該教他去燒埋，怎麼教老豬做土工？」行者被師父罵惱了，喝著八戒道：「潑懶夯貨！趁早兒去埋，遲了些兒，就是一棍。」獃子慌了，往山坡下築了有三尺深，下面都是石腳石根，掆住鈀齒。獃子丟了鈀，便把嘴拱。拱到軟處，一嘴有二尺五。兩嘴有五尺深，把兩個賊屍埋了，盤作一個墳堆。三藏叫：「悟空，取香燭來，待我禱祝，好念經。」行者努著嘴道：「好不知趣，這半山之中，前不巴村，後不著店，那討香燭？就有錢也無處去買。」三藏恨恨的道：「猴頭過去，等我撮土焚香禱告。」這是三藏離鞍悲野塚，聖僧善念祝荒墳。祝云："
  "source_languages":
  - "zh-Hant"
  "source_locations":

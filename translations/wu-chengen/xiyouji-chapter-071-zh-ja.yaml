  "known_gaps":
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-002"
      "description_ja": "冒頭の詞は仏教の色・空と、丹砂を練る道教の修行・昇天を対置しつつ結ぶ。底本の「空言是色如然」は整った経句へ校訂せず、その字面に即して訳した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-005"
      "description_ja": "断頭香は途中で折れた線香。前世の不完全な供養と今の不幸を結びつける、金聖宮の嘆きとして訳した。長老が死んだという部分も、ここでの本人の思いであり、語り手が確認した死亡ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-008"
      "description_ja": "原文の菡萏は蓮、繡毬は球状に花をつける植物をいう。後者を手毬花と訳したが、特定の現代の植物種への同定は控えた。四つの比喩は白い掌と黒いハエの対照。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-012"
      "description_ja": "「猫が尿胞をかむ」は、肉と思ってかんでも中身は尿という、ぬか喜びの俗なたとえ。原文の尿胞の身体的な意味を消さず、尿袋とした。雲情雨意は男女の情交を誘う情意であり、単なる世間話には弱めていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-013"
      "description_ja": "底本は「含忖」。寒傖と同じく、人の短所をからかう意味に解した。公開語彙資料がこの一節を例に挙げるが、古い方言的な形の由来には留保がある。「含笑」などへ原字を変えてはいない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-016"
      "description_ja": "『千字文』の「外受傅訓」は、外では師の教えを受ける、という句。「外」はここでは姓を示さない。母方の祖父を意味する外公を、賽太歳が外という姓の人物の呼び名だと取り違え、そのまま書物の字へ結びつけている。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-017"
      "description_ja": "外公は母方の祖父だが、この呼びかけの原文は賢甥、すなわちよい甥。親族関係は整合しないが、二つの呼称はいずれも悟空が相手の目上に立つための悪ふざけとして、孫などへ訂正しなかった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-017"
      "description_ja": "先ほど小妖怪は門がすでに打ち破られたと報告したが、ここでは開門するとある。破損の程度や修理など、原文にない事情を補わず、そのまま訳した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-020"
      "description_ja": "三陽泰は陽の気が伸び、陰陽が通じて安泰となる吉兆の表現。誕生の時を寿ぐ詩語として訳し、具体的な年月日へ固定しなかった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-020"
      "description_ja": "底本の天門三聖は三人を名指ししない。既出の神々の名を推測して補わず、三聖という原文の人数と呼称を保った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-020"
      "description_ja": "太清は道教の高い天界、また太上老君に関わる呼称にも用いられる。この句は兜率院を修飾するが、場所名と尊称のどちらかへ断定的に展開せず残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-020"
      "description_ja": "ここは底本どおり巡視霊官とする。かつて如来を迎えた別の名の霊官や、悟空と戦った王霊官と、役割や字面だけで同一人物にしない。身の上詩は悟空自身の語りであり、過去の回との言い回しや処刑の細部の違いも整合させていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-026"
      "description_ja": "この韻文は賽太歳が述べる鈴の由来。底本では、その発言の閉じ鉤括弧がここにない。原文欄はそのままとし、日本語では発話の主語と文脈から範囲を区切った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-028"
      "description_ja": "二三如六は二組に三つで六つという言い方。循環宝の細かな含意は確定できないため、巡り合わせの宝と訳した。雌雄の別は相手を欺く悟空の説明であり、鈴に実在する性別の断定ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-031"
      "description_ja": "底本は「佛母懺悔以後」。王や子の懺悔に主語を移したり、「怒ったあと」などへ校訂したりせず、仏母が懺悔したと訳した。語義・文脈には不自然さが残る。底本の啾疾は苦しむ病と解したが、現代の特定の病名へ同定していない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-031"
      "description_ja": "前の回では仙衣の効果で賽太歳は金聖宮に触れられないと説明されている。それでもここで悟空は玷污、すなわち汚したと訴える。人物の告発を勝手に弱めたり、語り手が性的接触を確認した事実に変えたりしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-032"
      "description_ja": "原文は「解鈴人還問繫鈴人」。一般に知られる諺の形へ置き換えず、解く者と結んだ者を問答で結ぶ言い方を保った。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-034"
      "description_ja": "原文の蜇陽は陽を刺すという表現。男に触れた際の痛みとして訳すが、現代の医学上の毒性や機序を述べるものではない。笑い話の中でも、体への接触と手への接触の二つの痛みを保持した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-036"
      "description_ja": "詩末の呼称は紫雲仙。この位置では詩に示された呼び名だけを用いる。棕衣は棕櫚の繊維で作った衣、芒鞋は草で編んだわらじ、蠅帚は蠅などを払う払子を指す。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-037"
      "description_ja": "張紫陽、紫陽真人、本人の名乗る張伯端は同じ仙人。張伯端と張紫陽の別名関係は国立情報学研究所のCiNii著者典拠にもある。ただし物語上の出来事を歴史上の事実と同一視しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch71-1455620"
      "segment_ids":
        - "xy-ch71-038"
      "description_ja": "轂は車輪の中心で車軸を受ける部分、こしき。捧轂推輪は君主側が車を支え押して送る、深い敬意を示す所作として訳した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖王道：「鈴兒乃金丹之寶，又不是飛禽走獸，如何辨得雌雄？但只是搖出寶來，就是好的。」行者道：「口說無憑，做出便見。且讓你先搖。」"
    "source_languages":

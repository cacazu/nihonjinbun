    "source_text": "行者笑道：「你這個誑上欺君的潑怪，原來沒眼。想我五百年前大鬧天宮時，九天神將見了我，無一個『老』字，不敢稱呼；你叫我聲外公，那裡虧了你？」妖王喝道：「快早說出姓甚名誰，有些甚麼武藝，敢到我這裡猖獗！」行者道：「你若不問姓名猶可，若要我說出姓名，只怕你立身無地。你上來，站穩著，聽我道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      悟空は笑った。悟空「主を欺き、王をだます無法な妖怪め。なるほど、目が見えていないのだな。五百年前、俺が天宮で暴れたときには、九天（きゅうてん）の神将は、俺を見ると必ず『老』の字を添えて敬い、そうでなければ呼ぶこともできなかった。お前が一声、俺を外公と呼んだところで、何が損になる。」
      賽太歳は怒鳴った。賽太歳「早く姓名を名乗れ。どんな武芸があって、わしの所で好き勝手に暴れるのだ。」
      悟空「名前を聞かずにおけば、それまでだったのに。名乗れと言うなら、お前は立っていられなくなるぞ。さあ前へ来い。しっかり踏ん張って、聞くがいい。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-020"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      生身父母是天地，日月精華結聖胎。
      仙石懷抱無歲數，靈根孕育甚奇哉。
      當年產我三陽泰，今日歸真萬會諧。
      曾聚眾妖稱帥首，能降眾怪拜丹崖。
      玉皇大帝傳宣旨，太白金星捧詔來。
      請我上天承職裔，官封弼馬不開懷。
      初心造反謀山洞，大膽興兵鬧御階。
      托塔天王並太子，交鋒一陣盡猥衰。
      金星復奏玄穹帝，再降招安敕旨來。
      封做齊天真大聖，那時方稱棟梁材。
      又因攪亂蟠桃會，仗酒偷丹惹下災。
      太上老君親奏駕，西池王母拜瑤臺。
      情知是我欺王法，即點天兵發火牌。
      十萬兇星並惡曜，干戈劍戟密排排。
      天羅地網漫山布，齊舉刀兵大會垓。
      惡鬥一場無勝敗，觀音推薦二郎來。
      兩家對敵分高下，他有梅山兄弟儕。
      各逞英雄施變化，天門三聖撥雲開。
      老君丟了金剛套，眾神擒我到金階。
      不須詳允書供狀，罪犯凌遲殺斬災。
      斧剁鎚敲難損命，刀掄劍砍怎傷懷。
      火燒雷打只如此，無計摧殘長壽胎。
      押赴太清兜率院，爐中煅煉盡安排。
      日期滿足才開鼎，我向當中跳出來。
      手挺這條如意棒，翻身打上玉龍臺。
      各星各象皆潛躲，大鬧天宮任我歪。
      巡視靈官忙請佛，釋伽與我逞英才。
      手心之內翻觔斗，遊遍周天去復來。
      佛使先知賺哄法，被他壓住在天崖。
      到今五百餘年矣，解脫微軀又弄乖。
      特保唐僧西域去，悟空行者甚明白。
      西方路上降妖怪，那個妖邪不懼哉！」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 154
        "line_end": 185
    "translation_ja": |-
      悟空「俺を生んだ父と母は天地そのもの、日月の精が集まって聖なる胎を結んだ。
      仙石が抱き続けた年月は知れず、霊妙な根が育まれたことは、まったく不思議だった。
      三陽（さんよう）が開いて世が安らぐときに生まれ、今は真に帰し、幾万の巡りも調和する。
      かつて妖怪たちを集めて頭領と称し、怪物を降して、赤い崖に拝ませた。
      玉皇大帝（ぎょくこうたいてい）が勅命を下し、太白金星（たいはくきんせい）が詔を捧げてやって来た。
      俺を天へ招いて官職につけたが、弼馬温（ひつばおん）など、うれしくもなかった。
      そこで初めて反逆を決め、山の洞へ帰ろうとし、大胆にも兵を起こして御殿の階を騒がせた。
      托塔天王（たくとうてんのう）もその太子も、一戦交えれば、そろってみじめに敗れた。
      金星（きんせい）がまた玄穹帝（げんきゅうてい）へ奏上し、再び招安の勅命が下った。
      まことの斉天大聖（せいてんたいせい）に封ぜられ、そのときようやく国を支える逸材として扱われた。
      だが、また蟠桃会（ばんとうえ）をかき乱し、酔いに任せて仙丹を盗み、災いを招いた。
      太上老君（たいじょうろうくん）はみずから帝へ奏上し、西池の王母（おうぼ）も瑤台（ようだい）で訴えた。
      俺が王法を侮ったと知るや、天兵を集め、緊急の出兵命令を出した。
      十万の凶星と悪い星々が、盾、戈、剣、戟をびっしり並べた。
      天羅地網（てんらちもう）が山いっぱいに張られ、一斉に武器を上げて大きく包囲した。
      激戦を重ねても勝敗はつかず、観音（かんのん）が二郎（じろう）を推して向かわせた。
      俺とあいつが勝負を競い、向こうには梅山（ばいざん）の兄弟が加勢した。
      それぞれ腕を見せ、変化の術を使うと、天門の三聖が雲をかき分けた。
      老君（ろうくん）が金剛套（こんごうとう）を投げ、神々は俺を捕らえて金の階へ引き立てた。
      詳しい取り調べも供述書も要らぬとされ、罪状は肉を切り刻み、斬って殺す凌遅（りょうち）の刑。
      斧で切られても槌でたたかれても命は損なわれず、刀や剣で切られたとて、どうして体が傷つこう。
      火に焼かれても雷に打たれても同じこと、長寿の身を壊す手立てはなかった。
      太清（たいせい）の兜率院（とそついん）へ押し送られ、炉の中で焼き鍛える支度がすっかり整った。
      決めた日数が満ちて炉の蓋を開けると、俺は中から跳び出した。
      この如意棒（にょいぼう）を手に構え、身を翻して玉竜台（ぎょくりゅうだい）へ攻め上がった。
      星々も天象の神々もみな姿を隠し、天宮での大暴れは俺の思うままだった。
      巡視の霊官（れいかん）が急いで仏を招き、釈迦（しゃか）が俺と腕を競った。
      手のひらの中で宙返りを打ち、天をひと巡りして戻ってきた。
      仏は先を見通す力で俺をだまし、天の果ての崖に押さえ込んだ。
      それから今まで五百余年、ようやく身を解かれて、また知恵を働かせる。
      唐僧（とうそう）を守って西域（さいいき）へ行くこの身こそ、悟空行者（ごくうぎょうじゃ）、はっきり覚えておけ。
      西へ向かう道で妖怪を降す俺を、恐れぬ邪悪な者がどこにいる！」
    "translation_status": "reviewed"
  - "id": "xy-ch71-021"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖王聽他說出悟空行者，遂道：「你原來是大鬧天宮的那廝。你既脫身保唐僧西去，你走你的路去便罷了，怎麼羅織管事，替那朱紫國為奴，卻到我這裡尋死？」行者喝道：「賊潑怪！說話無知。我受朱紫國拜請之禮，又蒙他稱呼管待之恩，我老孫比那王位還高千倍，他敬之如父母，事之如神明，你怎麼說出『為奴』二字？我把你這誑上欺君之怪，不要走，吃外公一棒。」那妖慌了手腳，即閃身躲過，使宣花斧劈面相迎。這一場好殺！你看："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 186
        "line_end": 186
    "translation_ja": |-
      悟空行者という名を聞いて、賽太歳は言った。賽太歳「お前が、天宮で大暴れしたあいつか。身を解かれ、唐僧を守って西へ行くなら、自分の道を進めばよかろう。なぜ言いがかりをつけて余計な世話を焼き、朱紫国の奴隷となって、わざわざここへ死にに来た。」
      悟空は怒鳴った。悟空「盗人の妖怪め、物を知らぬことを言うな。俺は朱紫国から、拝礼して迎えられたうえ、敬って呼ばれ、もてなされた恩を受けている。この俺は、あそこの王より千倍も上の身だ。あの王は父母のように俺を敬い、神のように仕えているのだぞ。どうして『奴隷』などと言える。主を欺き、王をだます妖怪め、逃げるな。外公の一撃を受けろ！」
      賽太歳は慌てふためき、さっと身をかわして避けると、宣花斧（せんかふ）を振るい、正面から斬りかかった。すさまじい戦いとなった。そのありさまを見よ。
    "translation_status": "reviewed"
  - "id": "xy-ch71-022"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": "金箍如意棒，風刃宣花斧。一個咬牙發狠兇，一個切齒施威武。這個是齊天大聖降臨凡，那個是作怪妖王來下土。兩個噴雲噯霧照天宮，真是走石揚沙遮斗府。往往來來解數多，翻翻復復金光吐。齊將本事施，各把神通賭。這個要取娘娘轉帝都，那個喜同皇后居山塢。這場都是沒來由，捨死忘生因國主。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 188
        "line_end": 188
    "translation_ja": |-
      金箍（きんこ）の如意棒に、風を切る刃の宣花斧。
      一方は牙をかみ締めて凶猛さをあらわにし、一方は歯ぎしりして武威を示す。
      こちらは俗世へ降りた斉天大聖、あちらは地上へ来て悪さをする妖王。
      二人が噴く雲と吐く霧は天宮まで照らし、飛ぶ石と舞う砂は星々の宮を覆う。
      行きつ戻りつ、数多くの技を繰り出し、返し返して金の光を放つ。
      どちらも持てる技を尽くし、互いの神通力を賭けて争う。
      こちらは妃を帝都へ連れ戻そうとし、あちらは皇后と山里に住みたがる。
      二人自身には何のいわれもない戦い、国王のために命を捨て、生を忘れる。
    "translation_status": "reviewed"
  - "id": "xy-ch71-023"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他兩個戰經五十回合，不分勝負。那妖王見行者手段高強，料不能取勝，將斧架住他的鐵棒道：「孫行者，你且住了。我今日還未早膳，待我進了膳，再來與你定雌雄。」行者情知是要取鈴鐺，收了鐵棒道：「『好漢子不趕乏兔兒』。你去，你去，吃飽些，好來領死。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 190
        "line_end": 190
    "translation_ja": |-
      二人は五十合戦っても、勝負がつかなかった。賽太歳は、悟空の技がすぐれていて勝てそうもないと見て取り、斧で鉄棒を受け止めた。賽太歳「孫行者（そんぎょうじゃ）、しばらくやめろ。わしは今日、まだ朝飯を食っておらぬ。食べてから、改めて勝負をつけよう。」
      悟空は鈴を取りに行きたいのだと察し、鉄棒を収めた。悟空「『立派な男は、疲れた兎を追い詰めない』と言うからな。行け、行け。腹いっぱい食ってから、殺されに来い。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-024"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖急轉身闖入裡邊，對娘娘道：「快將寶貝拿來。」娘娘道：「寶貝何幹？」妖王道：「今早叫戰者，乃是取經的和尚之徒，叫做孫悟空行者，假稱外公。我與他戰到此時，不分勝負。等我拿寶貝出去，放些煙火，燒這猴頭。」娘娘見說，心中怛突：欲不取出鈴兒，恐他見疑；欲取出鈴兒，又恐傷了孫行者性命。正自躊躇未定，那妖王又催逼道：「快拿出來。」這娘娘無奈，只得將鎖鑰開了，把三個鈴兒遞與妖王。妖王拿了，就走出洞。娘娘坐在宮中，淚如雨下，思量行者不知可能逃得性命？兩人卻俱不知是假鈴也。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 191
        "line_end": 191
    "translation_ja": |-
      賽太歳は急いで身を翻し、中へ駆け込んで金聖宮へ言った。賽太歳「早く宝を持ってきてください。」
      金聖宮「宝を何になさるのですか。」
      賽太歳「今朝、戦いを挑んで来たのは、取経の僧の弟子、孫悟空行者（そんごくうぎょうじゃ）という者でした。外公と偽っていたのです。今まで戦っても勝負がつきません。宝を持って出て、煙や火を放ち、あの猿めを焼いてやりましょう。」
      これを聞いた金聖宮は、胸がどきどきした。鈴を出さなければ疑われるかもしれず、出せば悟空の命が危ない。迷って決めかねていると、賽太歳はさらにせき立てた。賽太歳「早く出してください。」
      どうすることもできず、金聖宮は鍵で錠を開け、三つの鈴を渡した。賽太歳は受け取るなり洞を出ていった。金聖宮は御殿に座り、雨のように涙を流して、悟空が命を取り留められるだろうかと思い悩んだ。二人とも、それが偽物の鈴だとは知らなかったのである。
    "translation_status": "reviewed"
  - "id": "xy-ch71-025"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖出了門，就占起上風，叫道：「孫行者休走，看我搖搖鈴兒。」行者笑道：「你有鈴，我就沒鈴？你會搖，我就不會搖？」妖王道：「你有甚麼鈴兒？拿出來我看。」行者將鐵棒捏做個繡花針兒，藏在耳內。卻去腰間解下三個真寶貝來，對妖王說：「這不是我的紫金鈴兒？」妖王見了，心驚道：「蹺蹊，蹺蹊！他的鈴兒怎麼與我的鈴兒就一般無二？縱然是一個模子鑄的，好道打磨不到，也有多個瘢兒，少個蒂兒，卻怎麼這等一毫不差？」又問：「你那鈴兒是那裡來的？」行者道：「賢甥，你那鈴兒卻是那裡來的？」妖王老實，便就說道：「我這鈴兒是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 193
        "line_end": 193
    "translation_ja": |-
      門を出た賽太歳は、すぐに風上を取り、叫んだ。賽太歳「孫行者、逃げるな。わしが鈴を振るのを見ろ。」
      悟空は笑った。悟空「お前に鈴があって、俺にはないとでも思うか。お前が振れるなら、俺だって振れるぞ。」
      賽太歳「お前にどんな鈴がある。出して見せろ。」
      悟空は鉄棒をつまんで刺繍針ほどに小さくし、耳の中へしまった。それから腰の三つの本物の宝を外し、賽太歳へ言った。悟空「ほら、これが俺の紫金鈴（しきんれい）だ。」
      賽太歳は驚いた。賽太歳「おかしい、おかしい。なぜあいつの鈴は、わしの鈴と寸分違わぬのだ。同じ鋳型で鋳たにしても、磨き方に違いが出て、傷が一つ多いとか、突起が一つ足りないとかあるはずだ。それが、どうして毛ほどの違いもないのだ。」
      さらに賽太歳「その鈴は、どこから手に入れた。」
      悟空「よい甥よ、お前の鈴こそ、どこから手に入れたのだ。」
      賽太歳は素直に答えた。賽太歳「わしの鈴は、こういうものだ。」
    "translation_status": "reviewed"

      賽太歳「鈴は練り上げた金の宝だ。鳥や獣でもないのに、どうやって雌雄を分ける。とにかく振って宝の威力が出れば、それがよい鈴なのだ。」
      悟空「口だけでは証拠にならない。やってみれば分かる。まずはお前から振ってみろ。」

  - "id": "xy-ch71-030"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖王真個將頭一個鈴兒幌了三幌，不見火出；第二個幌了三幌，不見煙出；第三個幌了三幌，也不見沙出。妖王慌了手腳道：「怪哉，怪哉！世情變了，這鈴兒想是懼內，雄見了雌，所以不出來了。」行者道：「賢甥，住了手，等我也搖搖你看。」好猴子，一把揝了三個鈴兒，一齊搖起。你看那紅火、青煙、黃沙，一齊滾出，骨都都燎樹燒山。大聖口裡又念個咒語，望巽地上叫：「風來！」真個是風催火勢，火挾風威，紅焰焰，黑沉沉，滿天煙火，遍地黃沙。把那賽太歲唬得魄散魂飛，走頭無路，在那火當中，怎逃性命？"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 204
        "line_end": 204
    "translation_ja": |-
      賽太歳は本当に一つ目の鈴を三度振ったが、火は出ない。二つ目を三度振っても、煙は出ない。三つ目を三度振っても、砂は出なかった。慌てふためいて賽太歳「おかしい、おかしい。世の中が変わった。この鈴は、きっと女房が怖いのだ。雄が雌を見たので、出てこなくなったのだな。」
      悟空「よい甥よ、手を止めろ。俺が振るのも見ていろ。」
      見事な猿は、三つの鈴をひとつかみにして、一斉に振った。見よ、赤い火、青い煙、黄砂が一緒にあふれ出し、ごうごうと木々に燃えつき、山を焼く。悟空は口の中でさらに呪文を唱え、巽（たつみ）の方角へ向かって、悟空「風よ、来い！」
      まことに、風が火の勢いをあおり、火が風の威力を借りた。赤々と燃え、真っ黒に曇り、天は煙と火、地は一面の黄砂に埋まった。賽太歳は魂も消し飛ぶほどおびえ、逃げる道もない。あの火の中で、どうして命が助かろうか。
    "translation_status": "reviewed"
  - "id": "xy-ch71-031"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "只聞得半空中厲聲高叫：「孫悟空，我來也。」行者急回頭上望，原來是觀音菩薩，左手托著淨瓶，右手拿著楊柳，灑下甘露救火哩。慌得行者把鈴兒藏在腰間，即合掌倒身下拜。那菩薩將柳枝連拂幾點甘露，霎時間，煙火俱無，黃沙絕跡。行者叩頭道：「不知大慈臨凡，有失迴避。敢問菩薩何往？」菩薩道：「我特來收尋這個妖怪。」行者道：「這怪是何來歷，敢勞金身下降收之？」菩薩道：「他是我跨的個金毛犼。因牧童盹睡，失於防守，這孽畜咬斷鐵索走來，卻與朱紫國王消災也。」行者聞言，急欠身道：「菩薩反說了，他在這裡欺君騙后，敗俗傷風，與那國王生災，卻說是消災，何也？」菩薩道：「你不知之。當時朱紫國先王在位之時，這個王還做東宮太子，未曾登基。他年幼間，極好射獵。他率領人馬，縱放鷹犬，正來到落鳳坡前，有西方佛母孔雀大明王菩薩所生二子，乃雌雄兩個雀雛，停翅在山坡之下，被此王弓開處，射傷了雄孔雀，那雌孔雀也帶箭歸西。佛母懺悔以後，吩咐教他拆鳳三年，身耽啾疾。那時節，我跨著這犼，同聽此言。不期這孽畜留心，故來騙了皇后，與王消災。至今三年，冤愆滿足，幸你來救治王患。我特來收妖邪也。」行者道：「菩薩，雖是這般故事，奈何他玷污了皇后，敗俗傷風，壞倫亂法，卻是該他死罪。今蒙菩薩親臨，饒得他死罪，卻饒不得他活罪。讓我打他二十棒，與你帶去罷。」菩薩道：「悟空，你既知我臨凡，就當看我分上，一發都饒了罷，也算你一番降妖之功；若是動了棍子，他也就是死了。」行者不敢違言，只得拜道：「菩薩既收他回海，再不可令他私降人間，貽害不淺。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 205
        "line_end": 205
    "translation_ja": |-
      すると空中から、厳しい呼び声がした。声の主「孫悟空、私が来ました。」
      悟空が急いで振り向いて見上げると、観音菩薩（かんのんぼさつ）だった。左手に浄瓶（じょうへい）、右手に楊柳（ようりゅう）を持ち、甘露（かんろ）を振りまいて火を消している。悟空は慌てて鈴を腰へ隠し、合掌して身を伏せ、拝んだ。観音が柳の枝を続けて振り、甘露を数滴散らすと、たちまち煙と火は消え、黄砂も跡形なくなった。悟空は額を地につけて言った。悟空「大慈のお方が地上へおいでになるとは知らず、道をお避けする礼を欠きました。菩薩（ぼさつ）さま、どちらへおいでですか。」
      観音「この妖怪を捜して、連れ戻しに来たのです。」
      悟空「この妖怪には、どんな来歴があって、尊いお身にわざわざ降りていただくのですか。」
      観音「これは、私が乗る金毛犼（こんもうこう）です。世話をする牧童が居眠りをし、見張りを怠ったため、この畜生は鉄の鎖をかみ切って逃げ、朱紫国の王の災いを取り除きに来たのです。」
      悟空は聞くと、さっと身を起こした。悟空「菩薩さま、それはあべこべでしょう。こいつはここで王を欺き、后をだまして奪い、風俗を乱して、王に災いをもたらしました。それを災いを取り除いたとおっしゃるのは、どういうことですか。」
      観音「お前は事情を知らないのです。朱紫国の先王が位についていたころ、この王はまだ東宮の太子で、即位していませんでした。若いころ、たいへん狩りを好み、兵や馬を率い、鷹や猟犬を放って、落鳳坡（らくほうは）の前まで来たことがあります。そこには西方の仏母（ぶつも）、孔雀大明王菩薩（くじゃくだいみょうおうぼさつ）が生んだ二羽の子、雄と雌の孔雀のひなが、山の斜面の下で翼を休めていました。この王が弓を引き、雄の孔雀を射て傷つけると、雌の孔雀も矢を受けたまま西へ帰りました。仏母は懺悔（さんげ）したあと、この者を三年間、鳳凰のつがいのように夫婦離れ離れにし、身に苦しい病を負わせよと言い渡しました。そのとき、私はこの犼（こう）に乗って、一緒にその言葉を聞いていたのです。思いがけずこの畜生はそれを心に留め、やって来て皇后を奪い、王の災いを取り除いたのです。今や三年がたち、恨みと罪の償いは満ちました。幸いお前が来て王の病を治したので、私は妖怪を連れ戻しに来たのです。」
      悟空「菩薩さま、そういう事情があるにせよ、皇后を汚し、風俗を乱し、人の道と法を壊したのですから、こいつは死罪に当たります。今日は菩薩さまがみずから来られたので死罪は許すとしても、ほかの刑まで免れるわけにはいきません。私に二十棒打たせてから、お連れください。」
      観音「悟空、私が降りて来たと知っているなら、私の顔を立てて、すべて許してやりなさい。それもお前の妖怪退治の功に数えましょう。棒を振るえば、そのまま死んでしまいます。」
      悟空は逆らえず、拝んで言うしかなかった。悟空「菩薩さまが海へ連れ戻されるなら、二度と勝手に人の世へ下りさせないでください。与える害は、決して小さくありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-032"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那菩薩才喝了一聲：「孽畜！還不還原，待何時也？」只見那怪打個滾，現了原身，將毛衣抖抖，菩薩騎上。菩薩又望項下一看，不見那三個金鈴。菩薩道：「悟空，還我鈴來。」行者道：「老孫不知。」菩薩喝道：「你這賊猴！若不是你偷了這鈴，莫說一個悟空，就是十個，也不敢近身。快拿出來。」行者笑道：「實不曾見。」菩薩道：「既不曾見，等我念念緊箍兒咒。」那行者慌了，只教：「莫念，莫念。鈴兒在這裡哩。」這正是：犼項金鈴何人解？解鈴人還問繫鈴人。菩薩將鈴兒套在犼項下，飛身高坐。你看他四足蓮花生焰焰，滿身金縷迸森森。大慈悲回南海不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 206
        "line_end": 206
    "translation_ja": |-
      そこで観音は一喝した。観音「この畜生！　まだ元の姿へ戻らず、何を待っているのです。」
      賽太歳はひと転がりすると本来の姿を現し、毛の衣をふるわせた。観音はその背に乗った。ところが首の下を見ると、三つの金の鈴がない。観音「悟空、私の鈴を返しなさい。」
      悟空「俺は知りません。」
      観音は叱った。観音「盗人猿め！　お前がこの鈴を盗んでいなければ、悟空一人どころか、十人いても近づけなかったのですよ。早く出しなさい。」
      悟空は笑った。悟空「本当に見ていません。」
      観音「見ていないのなら、緊箍児呪（きんこじじゅ）を唱えてみましょう。」
      悟空は慌てて言い続けた。悟空「唱えないで、唱えないでください。鈴はここにあります。」
      まさにこういうことである。
      犼の首の金の鈴を、誰が解けよう。
      鈴を解く者のことは、やはり鈴を結んだ者に問え。
      観音は鈴を犼の首へ掛け、身軽に高々とまたがった。見よ、四つの足には蓮の花が赤々と現れ、全身からは金の毛筋が鋭く輝き出す。大慈悲のお方が南海（なんかい）へ帰ったことは、ひとまず置いておく。
    "translation_status": "reviewed"
  - "id": "xy-ch71-033"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖整束了衣裙，掄鐵棒打進獬豸洞去，把群妖眾怪盡情打死，剿除乾淨。直至宮中，請聖宮娘娘回國。那娘娘頂禮不盡。行者將菩薩降妖並拆鳳原由備說了一遍。尋些軟草，扎了一條草龍，教：「娘娘跨上，合著眼，莫怕，我帶你回朝見主也。」那娘娘謹遵吩咐，行者使起神通，只聽得耳內風響。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 208
        "line_end": 208
    "translation_ja": |-
      さて悟空は、衣や裳の裾を整え、鉄棒を振るって獬豸洞（かいちどう）へ攻め込んだ。大小の妖怪を残らず殴り殺し、すっかり討ち滅ぼしてから、奥の御殿まで進み、金聖宮を迎えて国へ帰るよう勧めた。金聖宮は何度も額を地につけて礼をした。悟空は、観音が妖怪を降したことと、夫婦が引き離された理由を、詳しく語って聞かせた。そして柔らかい草を探して、一本の草の竜を作り、言った。悟空「お妃さま、これにまたがり、目を閉じてください。怖がらなくて大丈夫です。宮廷へ連れ帰り、陛下にお会わせします。」
      金聖宮は謹んで言いつけを守った。悟空が神通力を使うと、耳の中で風の音だけが鳴った。
    "translation_status": "reviewed"
  - "id": "xy-ch71-034"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "半個時辰，帶進城，按落雲頭，叫：「娘娘開眼。」那皇后睜開眼看，認得是鳳閣龍樓，心中歡喜，撇了草龍，與行者同登寶殿。那國王見了，急下龍床，就來扯娘娘玉手，欲訴離情，猛然跌倒在地，只叫：「手疼，手疼。」八戒哈哈大笑道：「嘴臉，沒福消受。一見面就蜇殺了也。」行者道：「獃子，你敢扯他扯兒麼？」八戒道：「就扯他扯兒便怎的？」行者道：「娘娘身上生了毒刺，手上有蜇陽之毒。自到麒麟山，與那賽太歲三年，那妖更不曾沾身。但沾身就害身疼，但沾手就害手疼。」眾官聽說：「似此怎生奈何？」此時外面眾官憂疑，內裡妃嬪悚懼。傍有玉聖、銀聖二宮，將君王扶起。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 209
        "line_end": 209
    "translation_ja": |-
      半時辰（はんじしん）で城内へ連れていき、雲を下ろすと、悟空「お妃さま、目を開けてください。」
      金聖宮は目を開き、鳳凰と竜で飾られた宮殿だと分かって、心から喜んだ。草の竜を離れ、悟空と一緒に宝殿へ上がる。国王はそれを見ると、急いで玉座を下り、妃の白い手を取って、別れていた間の思いを語ろうとした。ところが、突然その場へ倒れ、叫ぶばかりである。国王「手が痛い、手が痛い！」
      八戒（はっかい）は大笑いした。八戒「そのざまは何だ。楽しむ福がないんだな。顔を合わせるなり、ひどく刺されてしまった。」
      悟空「ばか、お前にあの方の手を取る度胸があるのか。」
      八戒「手を取ったところで、どうだというんだ。」
      悟空「お妃さまの体には毒のとげが生えていて、手には男を刺す毒があるんだ。麒麟山（きりんざん）へ来て賽太歳と三年過ごしたが、あの妖怪は一度も体に触れていない。体に触れれば体が痛み、手に触れれば手が痛むのだ。」
      これを聞いて官たち「それでは、いったいどうすればよいのですか。」
      そのとき外では官たちが思い悩み、内では妃たちがおびえていた。そばにいた玉聖宮（ぎょくせいきゅう）と銀聖宮（ぎんせいきゅう）の二人が、国王を助け起こした。
    "translation_status": "reviewed"
  - "id": "xy-ch71-035"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "俱正在倉皇之際，忽聽得那半空中有人叫道：「大聖，我來也。」行者擡頭觀看，只見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 211
        "line_end": 211
    "translation_ja": |-
      一同がうろたえていると、不意に空中から呼び声がした。声の主「大聖（たいせい）、私が参りました。」
      悟空が顔を上げて見ると、こんな姿があった。
    "translation_status": "reviewed"
  - "id": "xy-ch71-036"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": "肅肅沖天鶴唳，飄飄徑至朝前。繚繞祥光道道，氤氳瑞氣翩翩。棕衣苫體放雲煙，足踏芒鞋罕見。手執龍鬚蠅帚，絲絛腰下圍纏。乾坤處處結人緣，大地逍遙遊遍。此乃是大羅天上紫雲仙，今日臨凡解魘。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 213
        "line_end": 213
    "translation_ja": |-
      粛々たる鶴の声が天を突き、ふわりと宮廷の前へ至る。
      めでたい光が幾筋もまとわり、瑞気が淡く漂い続ける。
      棕櫚の衣で身を覆い、雲や霞を放ち、
      足には草のわらじを履いた、めったに見られぬ姿。
      手には竜のひげのような蠅払い、腰には絹の組みひもを巡らす。
      天地の至るところで人と縁を結び、大地をくまなく気ままに遊ぶ。
      これぞ大羅天（だいらてん）に住む紫雲仙（しうんせん）、
      今日は地上へ下り、かけられた術を解きに来たのだ。
    "translation_status": "reviewed"
  - "id": "xy-ch71-037"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者上前迎住道：「張紫陽何往？」紫陽真人直至殿前，躬身施禮道：「大聖，小仙張伯端起手。」行者答禮道：「你從何來？」真人道：「小仙三年前曾赴佛會，因打這裡經過，見朱紫國王有拆鳳之憂，我恐那妖將皇后玷辱，有壞人倫，後日難與國王復合，是我將一件舊棕衣變作一領新霞裳，光生五彩，進與妖王，教皇后穿了裝新。那皇后穿上身，即生一身毒刺。毒刺者，乃棕衣也。今知大聖成功，特來解魘。」行者道：「既如此，累你遠來，且快解脫。」真人走向前，對娘娘用手一指，即脫下那件棕衣。那娘娘遍體如舊。真人將衣抖一抖，披在身上，對行者道：「大聖勿罪，小仙告辭。」行者道：「且住，待君王謝謝。」真人笑道：「不勞，不勞。」遂長揖一聲，騰空而去。慌得那皇帝、皇后及大小眾臣，一個個望空禮拜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 214
        "line_end": 214
    "translation_ja": |-
      悟空は進み出て迎えた。悟空「張紫陽（ちょうしよう）、どちらへおいでですか。」
      紫陽真人（しようしんじん）は御殿の前まで来て、身をかがめて礼をした。張紫陽「大聖、小仙、張伯端（ちょうはくたん）がご挨拶申し上げます。」
      悟空は礼を返した。悟空「どちらから来られました。」
      張紫陽「私は三年前、仏の集会へ向かう途中で、ここを通りかかりました。朱紫国の王が夫婦を引き離される憂いに遭っているのを見て、妖怪が皇后を辱め、人の道を損ない、のちに王とよりを戻せなくなることを恐れたのです。そこで、古い棕櫚の衣を一枚、五色の光を放つ真新しい霞の衣に変え、妖王へ差し上げ、皇后に新しい装いとして着せるよう言いました。皇后が身につけると、全身に毒のとげが生えました。そのとげこそ、棕櫚の衣だったのです。今、大聖が成功されたと知り、特にその術を解きに来ました。」
      悟空「そうでしたか。遠くからお手数をおかけしました。どうぞ早く解いてください。」
      張紫陽は前へ進み、金聖宮を指で指すと、たちまちあの棕櫚の衣が脱げ落ちた。金聖宮の体は、すっかり元どおりになった。張紫陽は衣をひとふるいして自分でまとい、悟空へ言った。張紫陽「大聖、失礼をお許しください。私はこれでお別れいたします。」
      悟空「少しお待ちを。国王にお礼をさせましょう。」
      張紫陽は笑った。張紫陽「どうぞ、お構いなく。お構いなく。」
      深く一礼すると、空へ上って去った。皇帝、皇后、大小の臣たちは慌て、一人一人、空に向かって拝んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch71-038"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "拜畢，即命大開東閣，酬謝四僧。那君王領眾跪拜，夫妻才得重諧。正當歡宴時，行者叫：「師父，拿那戰書來。」長老袖中取出，遞與行者。行者遞與國王道：「此書乃那怪差小校送來者。那小校已先被我打死，送來報功。後復至山中，變作小校，進洞回覆，因得見娘娘，盜出金鈴，幾乎被他拿住。又變化，復偷出，與他對敵。幸遇觀音菩薩將他收去，又與我說拆鳳之故。……」從頭至尾，細說了一遍。那舉國君臣內外，無一人不感謝稱讚。唐僧道：「一則是賢王之福，二來是小徒之功。今蒙盛宴，至矣，至矣。就此拜別，不要誤貧僧向西去也。」那國王懇留不得，遂換了關文，大排鑾駕，請唐僧穩坐龍車。那君王、妃后，俱捧轂推輪，相送而別。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 215
        "line_end": 215
    "translation_ja": |-
      拝礼を終えると、ただちに東閣（とうかく）を大きく開き、四人の僧へ礼をするよう命じた。国王は一同を率いてひざまずいて拝み、夫婦はようやく再びむつまじくなれた。宴がたけなわのころ、悟空が呼びかけた。悟空「お師匠さま、あの戦書をお出しください。」
      三蔵（さんぞう）は袖から取り出し、悟空へ渡した。悟空は国王へ差し出して言った。悟空「この書は、あの妖怪が小役人に持たせて遣わしたものです。その小役人は、私が先に殴り殺し、手柄のしるしに届けました。そのあと再び山へ行き、その小役人に化け、洞へ入って復命したのです。それでお妃さまに会え、金の鈴を盗み出しましたが、危うく捕らえられるところでした。もう一度姿を変えて盗み出し、妖怪と戦いました。幸い観音菩薩がおいでになって連れ戻され、夫婦が引き離された理由も教えてくださいました。……」
      初めから終わりまで、詳しく話して聞かせた。国じゅうの王も臣も、内の者も外の者も、感謝し、たたえない者はなかった。三蔵「一つには賢明な王のお持ちの福、二つには弟子の働きによるものです。これほどの盛宴にあずかり、もう十分、まことに十分です。ここでお別れいたしましょう。私が西へ向かう旅を、これ以上遅らせないでください。」
      国王は切に引き留めたがかなわず、通関文牒（つうかんもんちょう）を書き換えさせ、盛大な行幸の列を整え、三蔵に竜で飾られた車へゆったりと乗ってもらった。国王も妃后たちも、車輪のこしきを捧げ持ち、車輪を押して見送り、別れを告げた。まさにこういうことである。
    "translation_status": "reviewed"
  - "id": "xy-ch71-039"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": "有緣洗盡憂疑病，絕念無思心自寧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 217
        "line_end": 217
    "translation_ja": |-
      縁あって、憂いと疑いの病は洗い尽くされ、
      迷いの念を絶ち、思い煩わねば、心はおのずから安らぐ。
    "translation_status": "reviewed"
  - "id": "xy-ch71-040"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟這去，後面再有甚麼吉凶之事，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 219
        "line_end": 219
    "translation_ja": "さて、この先の旅には、どんな吉凶の出来事が待っているのだろうか。それはまた、次回をお聞きいただきたい。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-01-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "冒頭の詞は仏教の色・空と、丹砂を練る道教の修行・昇天を対置しつつ結ぶ。底本の「空言是色如然」は整った経句へ校訂せず、その字面に即して訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-02-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "断頭香は途中で折れた線香。前世の不完全な供養と今の不幸を結びつける、金聖宮の嘆きとして訳した。長老が死んだという部分も、ここでの本人の思いであり、語り手が確認した死亡ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-03-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の菡萏は蓮、繡毬は球状に花をつける植物をいう。後者を手毬花と訳したが、特定の現代の植物種への同定は控えた。四つの比喩は白い掌と黒いハエの対照。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-04-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「猫が尿胞をかむ」は、肉と思ってかんでも中身は尿という、ぬか喜びの俗なたとえ。原文の尿胞の身体的な意味を消さず、尿袋とした。雲情雨意は男女の情交を誘う情意であり、単なる世間話には弱めていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-05-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「含忖」。寒傖と同じく、人の短所をからかう意味に解した。公開語彙資料がこの一節を例に挙げるが、古い方言的な形の由来には留保がある。「含笑」などへ原字を変えてはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-06-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "『千字文』の「外受傅訓」は、外では師の教えを受ける、という句。「外」はここでは姓を示さない。母方の祖父を意味する外公を、賽太歳が外という姓の人物の呼び名だと取り違え、そのまま書物の字へ結びつけている。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-07-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "外公は母方の祖父だが、この呼びかけの原文は賢甥、すなわちよい甥。親族関係は整合しないが、二つの呼称はいずれも悟空が相手の目上に立つための悪ふざけとして、孫などへ訂正しなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-08-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "先ほど小妖怪は門がすでに打ち破られたと報告したが、ここでは開門するとある。破損の程度や修理など、原文にない事情を補わず、そのまま訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-09-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三陽泰は陽の気が伸び、陰陽が通じて安泰となる吉兆の表現。誕生の時を寿ぐ詩語として訳し、具体的な年月日へ固定しなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-10-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の天門三聖は三人を名指ししない。既出の神々の名を推測して補わず、三聖という原文の人数と呼称を保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-11-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "太清は道教の高い天界、また太上老君に関わる呼称にも用いられる。この句は兜率院を修飾するが、場所名と尊称のどちらかへ断定的に展開せず残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-12-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここは底本どおり巡視霊官とする。かつて如来を迎えた別の名の霊官や、悟空と戦った王霊官と、役割や字面だけで同一人物にしない。身の上詩は悟空自身の語りであり、過去の回との言い回しや処刑の細部の違いも整合させていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-13-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この韻文は賽太歳が述べる鈴の由来。底本では、その発言の閉じ鉤括弧がここにない。原文欄はそのままとし、日本語では発話の主語と文脈から範囲を区切った。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-14-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "二三如六は二組に三つで六つという言い方。循環宝の細かな含意は確定できないため、巡り合わせの宝と訳した。雌雄の別は相手を欺く悟空の説明であり、鈴に実在する性別の断定ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-15-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「佛母懺悔以後」。王や子の懺悔に主語を移したり、「怒ったあと」などへ校訂したりせず、仏母が懺悔したと訳した。語義・文脈には不自然さが残る。底本の啾疾は苦しむ病と解したが、現代の特定の病名へ同定していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-16-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "前の回では仙衣の効果で賽太歳は金聖宮に触れられないと説明されている。それでもここで悟空は玷污、すなわち汚したと訴える。人物の告発を勝手に弱めたり、語り手が性的接触を確認した事実に変えたりしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-17-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「解鈴人還問繫鈴人」。一般に知られる諺の形へ置き換えず、解く者と結んだ者を問答で結ぶ言い方を保った。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-18-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の蜇陽は陽を刺すという表現。男に触れた際の痛みとして訳すが、現代の医学上の毒性や機序を述べるものではない。笑い話の中でも、体への接触と手への接触の二つの痛みを保持した。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-19-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "詩末の呼称は紫雲仙。この位置では詩に示された呼び名だけを用いる。棕衣は棕櫚の繊維で作った衣、芒鞋は草で編んだわらじ、蠅帚は蠅などを払う払子を指す。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-20-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "張紫陽、紫陽真人、本人の名乗る張伯端は同じ仙人。張伯端と張紫陽の別名関係は国立情報学研究所のCiNii著者典拠にもある。ただし物語上の出来事を歴史上の事実と同一視しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-note-21-body"
    "section_id": "chapter-71"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "轂は車輪の中心で車軸を受ける部分、こしき。捧轂推輪は君主側が車を支え押して送る、深い敬意を示す所作として訳した。"
    "translation_status": "reviewed"

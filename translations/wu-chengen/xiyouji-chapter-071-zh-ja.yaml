    "kind": "paragraph"
    "origin": "source"
    "source_text": "假春嬌在傍，著意看著那妖王身上衣服，層層皆有虼蚤跳，件件皆排大臭蟲；子母虱密密濃濃，就如螻蟻出窩中。不覺的揭到第三層見肉之處，那金鈴上紛紛垓垓的，也不勝其數。假春嬌道：「大王，拿鈴子來，等我也與你捉捉虱子。」那妖王一則羞，二則慌，卻也不認得真假，將三個鈴兒遞與假春嬌。假春嬌接在手中，賣弄多時，見那妖王低著頭抖這衣服，他即將金鈴藏了，拔下一根毫毛，變作三個鈴兒，一般無二，拿向燈前翻檢。卻又把身子扭扭捏捏的抖了一抖，將那虱子、臭蟲、虼蚤，收了歸在身上，把假金鈴兒遞與那怪。那怪接在手中，一發朦朧無措，那裡認得甚麼真假，雙手托著那鈴兒，遞與娘娘道：「今番你卻收好了，卻要仔細仔細，不要像前一番。」那娘娘接過來，輕輕的揭開衣箱，把那假鈴收了，用黃金鎖鎖了。卻又與妖王飲了幾杯酒，教侍婢：「淨拂牙床，展開錦被，我與大王同寢。」那妖王諾諾連聲道：「沒福，沒福，不敢奉陪。我還帶個宮女往西宮裡睡去，娘娘請自安置。」遂此各歸寢處不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      悟空はそばで、その衣を注意深く見ていた。重ねた衣のどの層にもノミが跳ね、どの一枚にも大きな南京虫が並び、親子のシラミがびっしり密集して、まるで巣から出てくるアリやケラだった。いつしか三枚目までめくって肌が見えるところへ来ると、金の鈴にも虫が群がり、数えきれないほどついていた。悟空「大王、鈴もお渡しください。そちらのシラミも取って差し上げましょう。」
      賽太歳は恥ずかしくもあり、慌ててもいたので、相手の真偽など見分けられず、三つの鈴を渡した。悟空は受け取り、しばらくいじり回していたが、賽太歳が下を向いて衣を振っている隙に、本物の金の鈴を隠した。そして毛を一本抜き、寸分違わぬ三つの鈴に変えて、灯火へかざして裏表を調べるふりをした。さらに身をくねらせ、ぶるっと振って、シラミ、南京虫、ノミを自分の体へ回収し、偽物の金の鈴を賽太歳へ渡した。賽太歳は受け取ったものの、ますますぼんやりしてどうしてよいか分からず、本物か偽物かなど分かるはずもない。両手で鈴を捧げ、金聖宮へ差し出した。賽太歳「今度こそ、しっかりしまってください。くれぐれも、くれぐれも気をつけて。前のようなことはなさらぬように。」
      金聖宮は受け取り、衣装箱をそっと開けて偽物の鈴をしまい、黄金の錠をかけた。それから賽太歳ともう数杯飲み、侍女に命じた。金聖宮「象牙飾りの寝台をきれいに払い、錦の夜具を広げなさい。大王と一緒に休みます。」
      賽太歳は幾度も応じた。賽太歳「その福はございません。その福はございません。ご一緒するなど、とてもできません。わしはやはり宮女を一人連れて、西の御殿へ寝に行きます。お妃さまは、どうぞお休みください。」
      こうしてそれぞれの寝所へ向かった。こちらはひとまず置いておく。
    "translation_status": "reviewed"
  - "id": "xy-ch71-015"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說假春嬌得了手，將他寶貝帶在腰間，現了本像，把身子抖一抖，收去那個瞌睡蟲兒，徑往前走。只聽得梆鈴齊響，緊打三更。好行者，捏著訣，念動真言，使個隱身法，直至門邊，又見那門上拴鎖甚密。卻就取出金箍棒，望門一指，使出那解鎖之法，那門就輕輕開了。急拽步出門站下，厲聲高叫道：「賽太歲，還我金聖娘娘來。」連叫兩三遍，驚動大小群妖，急急看處，前門開了。即忙掌燈尋鎖，把門兒依然鎖上。著幾個跑入裡邊去報道：「大王，有人在大門外呼喚大王尊號，要金聖娘娘哩。」那裡邊侍婢即出宮門，悄悄的傳言道：「莫吆喝，大王才睡著了。」行者又在門前高叫，那小妖又不敢去驚動。如此者三四遍，俱不敢去通報。那大聖在外嚷嚷鬧鬧的，直弄到天曉。忍不住，手掄著鐵棒，上前打門。慌得那大小群妖頂門的頂門，報信的報信。那妖王一覺方醒，只聞得亂攛攛的諠譁，起身穿了衣服，即出羅帳之外，問道：「嚷甚麼？」眾侍婢才跪下道：「爺爺，不知是甚人在洞外叫罵了半夜，如今卻又打門。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      さて、首尾よく宝を手に入れた悟空は、それを腰につけ、元の姿に戻った。体をひとふるいして眠り虫を回収し、まっすぐ表へ進む。拍子木と鈴が一緒に鳴り、三更（さんこう）をせわしなく告げていた。見事な悟空は、指で印を結び、真言（しんごん）を唱えて隠身（いんしん）の術を使い、門のところまで行ったが、かんぬきも錠も厳重だった。そこで金箍棒（きんこぼう）を取り出して門を指し、解錠の術を使うと、門は音もなく開いた。急いで外へ出て立ち止まり、声を張り上げた。悟空「賽太歳、金聖宮さまを返せ！」
      二、三遍続けて叫ぶと、大小の妖怪たちが驚いて急いで見に来た。表の門が開いている。あわてて灯火を持ち、錠を探して、元どおりに閉じた。何人かを奥へ走らせると、小妖怪たち「大王、表の大門で大王のお名を呼び、金聖宮さまを返せと言う者がおります。」
      中から侍女が宮殿の戸口へ出てきて、小声で伝えた。侍女「大声を出してはいけません。大王は眠りについたばかりです。」
      悟空がまた門前で叫んでも、小妖怪たちは大王を起こせなかった。こうしたことが三、四遍あっても、誰も知らせに行こうとしない。悟空は外で騒ぎ続け、とうとう夜明けになった。こらえきれず、鉄棒を振り上げて門をたたく。大小の妖怪たちは慌て、門を押さえる者、報告へ走る者と大騒ぎになった。ひと眠りしてようやく目を覚ました賽太歳は、騒然とした物音を聞き、起きて衣をつけ、薄絹の帳の外へ出て尋ねた。賽太歳「何を騒いでおる。」
      侍女たちはそこでひざまずいた。侍女たち「大王さま、何者か分かりませんが、洞の外で夜中から罵り続け、今は門までたたいております。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-016"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖王走出宮門，只見那幾個傳報的小妖慌張張的磕頭道：「外面有人叫罵，要金聖宮娘娘哩；若說半個『不』字，他就說出無數的歪話，甚不中聽。見天曉大王不出，逼得打門也。」那妖道：「且休開門。你去問他是那裡來的？姓甚名誰？快來回報。」小妖急出去，隔門問道：「打門的是誰？」行者道：「我是朱紫國拜請來的外公，來取聖宮娘娘回國哩。」那小妖聽得，即以此言回報。那妖隨往後宮，查問來歷。原來那娘娘才起來，還未梳洗，早見侍婢來報：「爺爺來了。」那娘娘急整衣，散挽黑雲，出宮迎迓。才坐下，還未及問，又聽得小妖來報：「那來的外公已將門打破矣。」那妖笑道：「娘娘，你朝中有多少將帥？」娘娘道：「在朝有四十八衛人馬，良將千員；各邊上元帥總兵，不計其數。」妖王道：「可有個姓外的麼？」娘娘道：「我在宮，只知內裡輔助君王，早晚教誨妃嬪，外事無邊，我怎記得名姓？」妖王道：「這來者稱為『外公』，我想著《百家姓》上，更無個姓外的。娘娘賦性聰明，出身高貴，居皇宮之中，必多覽書籍。記得那本書上有此姓也？」娘娘道：「止《千字文》上有句『外受傅訓』，想必就是此矣。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      賽太歳が宮殿の戸口を出ると、知らせに来た小妖怪たちが、慌てて額を地につけて言った。小妖怪たち「外の者が罵りながら、金聖宮さまを返せと言っております。こちらが少しでも断れば、聞くに堪えないひどい悪口を、いくらでも並べるのです。夜が明けても大王が出てこないので、とうとう門をたたき始めました。」
      賽太歳「まだ門を開けるな。どこから来た、何という名の者か聞いて、すぐ知らせろ。」
      小妖怪は急いで出ていき、門越しに尋ねた。小妖怪「門をたたくのは誰だ。」
      悟空「朱紫国（しゅしこく）から、礼を尽くして迎えられた外公（がいこう）だ。金聖宮さまを連れ戻しに来たのだ。」
      小妖怪は、そのままの言葉を報告した。賽太歳は後宮へ行き、相手の素性を尋ねることにした。金聖宮は起きたばかりで、まだ髪も整えず顔も洗っていなかったが、早くも侍女が知らせに来た。侍女「大王さまがおいでです。」
      金聖宮は急いで衣を整え、黒雲のような髪をゆるくまとめて、外へ迎えに出た。座ったばかりで、まだ尋ねる暇もないうちに、また小妖怪が知らせた。小妖怪「やって来た外公が、もう門を打ち破りました。」
      賽太歳は笑って尋ねた。賽太歳「お妃さま、お国の朝廷には、どれほどの将帥がおりますか。」
      金聖宮「朝廷には四十八衛の軍勢、千人の良将がいます。各地の国境にいる元帥や総兵（そうへい）は、数えきれません。」
      賽太歳「その中に、外という姓の者はいますか。」
      金聖宮「私は宮中にいて、内で王をお助けし、朝夕、妃たちを教え導くことしか存じません。外のことは際限がございませんのに、一人一人の姓名など、覚えておりましょうか。」
      賽太歳「来た者は『外公』と名乗っているのです。考えてみても、『百家姓（ひゃっかせい）』に外という姓はありません。お妃さまは生まれつき聡明で、ご出身も高く、宮中にお住まいですから、きっと多くの書物をご覧になったでしょう。どの本にこの姓があったか、ご記憶ではありませんか。」
      金聖宮「『千字文（せんじもん）』に『外で師の教えを受ける』という句があるだけです。きっと、これのことでしょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-017"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖王喜道：「定是，定是。」即起身辭了娘娘，到剝皮亭上，結束整齊，點出妖兵，開了門，直至外面，手持一柄宣花鉞斧，厲聲高叫道：「那個是朱紫國來的外公？」行者把金箍棒揝在右手，將左手指定道：「賢甥，叫我怎的？」那妖王見了，心中大怒道：「你這廝："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      賽太歳は喜んだ。賽太歳「それに違いない、それに違いない。」
      金聖宮に別れを告げて立ち、剝皮亭で身支度を整え、妖兵を選び出すと、門を開けて外へ出た。手には一本の宣花鉞斧（せんかえつふ）を持ち、声を張り上げた。賽太歳「朱紫国から来た外公とは、どいつだ。」
      悟空は右手で金箍棒を握り、左手で相手を指した。悟空「よい甥よ、俺を呼んでどうしたのだ。」
      その姿を見た賽太歳は、腹の底から怒って言った。賽太歳「この野郎……」

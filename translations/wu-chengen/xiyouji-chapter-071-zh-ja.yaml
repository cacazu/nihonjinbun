    "translation_status": "reviewed"
  - "id": "xy-ch71-002"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      色即空兮自古，空言是色如然。人能悟徹色空禪，何用丹砂炮煉。
      德行全修休懈，工夫苦用熬煎。有時行滿始朝天，永駐仙顏不變。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 122
        "line_end": 123
    "translation_ja": |-
      色（しき）はすなわち空（くう）、これは古来の教え。
      空を色と説くのも、まさに同じこと。
      人が色と空の禅理を悟りきれば、
      丹砂（たんしゃ）を焼いて練り上げる必要がどこにあろう。
      徳も行いも余さず修め、怠ってはならない。
      苦しい修行に力を尽くし、身を練り鍛えるのだ。
      やがて行いが満ちたとき、初めて天へ参上し、
      仙人の顔は永遠に若く、変わることがない。
    "translation_status": "reviewed"
  - "id": "xy-ch71-003"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說那賽太歲緊關了前後門戶，搜尋行者，直嚷到黃昏時分，不見蹤跡。坐在那剝皮亭上，點聚群妖，發號施令，都教各門上提鈴喝號，擊鼓敲梆；一個個弓上絃，刀出鞘，支更坐夜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 125
        "line_end": 125
    "translation_ja": "さて賽太歳（さいたいさい）は、前後の門を固く閉ざして悟空（ごくう）を捜し、日暮れまで騒ぎ続けたが、影も形も見つからなかった。剝皮亭（はくひてい）に座って妖怪たちを集め、命令を下す。どの門でも鈴を鳴らして合図を叫び、太鼓と拍子木を打たせ、一人一人に弓の弦を張らせ、刀を抜かせて、交替で夜通し見張りにつかせた。"
    "translation_status": "reviewed"
  - "id": "xy-ch71-004"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來孫大聖變做個痴蒼蠅，釘在門旁。見前面防備甚緊，他即抖開翅，飛入後宮門首看處，見金聖娘娘伏在御案上，清清滴淚，隱隱聲悲。行者飛進門去，輕輕的落在他那烏雲散髻之上，聽他哭的甚麼。少頃間，那娘娘忽失聲道：「主公啊，我和你："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 127
        "line_end": 127
    "translation_ja": "悟空は鈍そうなハエに化け、門の脇にぴたりと止まっていた。表の警戒があまりに厳しいので、羽をふるわせて奥の御殿の入り口まで飛んでいき、中をのぞいた。金聖宮（きんせいきゅう）が御机に伏し、澄んだ涙をこぼしながら、低く悲しげに泣いている。悟空は中へ飛び込み、黒雲のような乱れ髪にそっと止まって、何を嘆いているのか聞いた。しばらくすると、金聖宮は思わず声をあげた。金聖宮「陛下、あなたと私は……」"
    "translation_status": "reviewed"
  - "id": "xy-ch71-005"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      前生燒了斷頭香，今世遭逢潑怪王。
      拆鳳三年何日會？分鴛兩處致悲傷。
      差來長老才通信，驚散佳姻一命亡。
      只為金鈴難解識，相思又比舊時狂。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 129
        "line_end": 132
    "translation_ja": |-
      金聖宮「前の世で、途中で折れた線香を供えたために、
      この世では、無法な妖王に出会ってしまいました。
      鳳凰（ほうおう）のつがいを引き裂かれて三年、いつまた会えるのでしょう。
      鴛鴦（おしどり）は二か所に引き離され、悲しみに沈んでいます。
      遣わされた長老のおかげで、ようやく消息が通じたのに、
      よき縁は脅かされて散り、その方は命を失ってしまいました。
      すべては金の鈴の仕組みを解き明かせなかったため。
      あなたを思う心は、以前にもまして狂わんばかりです。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-006"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，即移身到他耳根後，悄悄的叫道：「聖宮娘娘，你休恐懼。我還是你國差來的神僧孫長老，未曾傷命。只因自家性急，近妝臺偷了金鈴，你與妖王吃酒之時，我卻脫身私出了前亭，忍不住打開看看。不期扯動那塞口的綿花，那鈴響一聲，迸出煙、火、黃沙。我就慌了手腳，把金鈴丟了，現出原身，使鐵棒，苦戰不出，恐遭毒手，故變作一個蒼蠅兒，釘在門樞上，躲到如今。那妖王愈加嚴緊，不肯開門。你可再以夫妻之禮，哄他進來安寢，我好脫身行事，別作區處救你也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 133
        "line_end": 133
    "translation_ja": "これを聞いた悟空は、耳の後ろへ移って、ひそひそと呼びかけた。悟空「金聖宮さま、怖がらないでください。お国から遣わされた神僧、孫長老（そんちょうろう）です。命は落としていません。自分がせっかちだったばかりに、化粧台に近づいて金の鈴を盗んだあと、あなたが妖王と酒を飲んでいる間に、こっそり抜け出して表の亭へ行きました。どうしても中が見たくなって、開いてみたのです。ところが、口を塞ぐ綿を引っ張ってしまい、鈴が一声鳴ったとたん、煙と火と黄砂が噴き出しました。慌てふためいて鈴を放り出し、元の姿に戻って鉄棒で必死に戦いましたが、外へ出られません。殺されてはたまらないので、ハエに化けて門の軸に止まり、今まで隠れていたのです。妖王はますます警戒を厳しくし、門を開けようとしません。もう一度、夫婦として礼を尽くすふりをして、こちらへ寝に来るよう誘ってください。そうすれば私は抜け出して動き、別の手立てを立てて、あなたを助けられます。」"
    "translation_status": "reviewed"
  - "id": "xy-ch71-007"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "娘娘一聞此言，戰兢兢，髮似神揪；虛怯怯，心如杵築。淚汪汪的道：「你如今是人是鬼？」行者道：「我也不是人，我也不是鬼，如今變作個蒼蠅兒在此。你休怕，快去請那妖王也。」娘娘不信，淚滴滴，悄語低聲道：「你莫魘寐我。」行者道：「我豈敢魘寐你？你若不信，展開手，等我跳下來你看。」那娘娘真個把左手張開，行者輕輕飛下。落在他玉掌之間，好便似："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      それを聞いた金聖宮は、髪を神に引っ張られでもしたように震え、おびえきった胸は杵で突かれるようだった。涙をいっぱいにためて、金聖宮「あなたは今、人なのですか、それとも幽霊なのですか。」
      悟空「人でも幽霊でもありません。今はハエに化けて、ここにいるのです。怖がらず、早く妖王を呼びに行ってください。」
      金聖宮は信じられず、涙をこぼしながら小声でささやいた。金聖宮「私に悪夢を見せて苦しめないでください。」
      悟空「そんなことをするものですか。信じられないなら、手を開いてください。その上に下りて、お見せしましょう。」
      金聖宮が本当に左の手を開くと、悟空はそっと飛び下りた。玉のような掌に止まったその姿は、ちょうどこんなありさまであった。
    "translation_status": "reviewed"
  - "id": "xy-ch71-008"
    "section_id": "chapter-71"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      菡萏蕊頭釘黑豆，牡丹花上歇遊蜂；
      繡毬心裡葡萄落，百合枝邊黑點濃。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 137
        "line_end": 138
    "translation_ja": |-
      蓮の花のしべに、黒豆がぴたりとつき、
      牡丹の花に、遊び蜂が休む。
      手毬花の真ん中へ、ぶどうの粒が落ち、
      百合の枝のそばに、黒い一点が濃く映える。
    "translation_status": "reviewed"
  - "id": "xy-ch71-009"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "金聖宮高擎玉掌，叫聲：「神僧。」行者嚶嚶的應道：「我是神僧變的。」那娘娘方才信了。悄悄的道：「我去請那妖王來時，你卻怎生行事？」行者道：「古人云：『斷送一生惟有酒。』又云：『破除萬事無過酒。』酒之為用多端，你只以飲酒為上。你將那貼身的侍婢喚一個進來，指與我看，我就變作他的模樣，在旁邊伏侍，卻好下手。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      金聖宮は白い掌を高く差し上げ、金聖宮「神僧さま。」
      悟空はぶんぶんと応じた。悟空「その神僧が化けているのです。」
      そこでようやく信じた金聖宮は、ひそかに尋ねた。金聖宮「妖王を呼んで来たら、どうなさるのですか。」
      悟空「昔の人は『一生を台無しにするのは、ほかならぬ酒だ』と言い、また『万事の憂いを払いのけるには、酒に勝るものはない』とも言いました。酒にはいろいろな使い道があります。まずは酒を飲ませることです。身近に仕える侍女を一人呼んで、私に見せてください。その姿に化けてそばで給仕をすれば、うまく手を下せます。」
    "translation_status": "reviewed"
  - "id": "xy-ch71-010"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那娘娘真個依言，即叫：「春嬌何在？」那屏風後轉出一個玉面狐狸來，跪下道：「娘娘喚春嬌有何使令？」娘娘道：「你去叫他們來點紗燈，焚腦麝，扶我上前庭，請大王安寢也。」那春嬌即轉前面，叫了七八個怪鹿妖狐，打著兩對燈籠、一對提爐，擺列左右。娘娘欠身叉手，那大聖早已飛去。好行者，展開翅，徑飛到那玉面狐狸頭上，拔下一根毫毛，吹口仙氣，叫：「變！」變作一個瞌睡蟲，輕輕的放在他臉上。原來瞌睡蟲到了人臉上，往鼻孔裡爬，爬進孔中，即瞌睡了。那春嬌果然漸覺困倦，立不住腳，搖樁打盹，即忙尋著原睡處，丟倒頭，只情呼呼的睡起。行者跳下來，搖身一變，變做那春嬌一般模樣，轉屏風，與眾排立不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      金聖宮は言われたとおりに呼んだ。金聖宮「春嬌（しゅんきょう）はどこにいますか。」
      屏風の後ろから、玉のように白い顔の狐が出てきて、ひざまずいた。白い顔の狐「奥方さま、春嬌にどのようなご用でしょう。」
      金聖宮「みなに紗の灯籠へ明かりをともし、竜脳（りゅうのう）と麝香（じゃこう）を焚くよう言っておくれ。私を支えて前庭まで連れていき、大王をお休みにお誘いするのです。」
      春嬌は表へ回り、鹿や狐の妖怪を七、八人呼んだ。灯籠二対と手提げの香炉一対を持たせ、左右に並ばせる。金聖宮が身を起こして胸の前で手を組んだとき、悟空はもう飛び立っていた。見事な悟空は、羽を広げてまっすぐあの白い顔の狐の頭上へ飛ぶと、毛を一本抜き、仙気を吹きかけ、悟空「変われ！」
      毛は眠り虫（ねむりむし）に変わった。悟空はそれを春嬌の顔へそっと置いた。眠り虫は人の顔につくと鼻の穴へはい上がり、その中に入ると、たちまち眠らせるものなのだ。春嬌も案の定、次第に眠くなり、足で立っていられず、体をゆらしてうとうとしはじめた。急いでいつもの寝場所を探し、頭を投げ出すように横になると、ひたすらぐうぐう眠り込んだ。悟空は飛び下り、体をゆすって春嬌そっくりに化け、屏風を回って、みなと一緒に並んだ。こちらはひとまず置いておく。
    "translation_status": "reviewed"
  - "id": "xy-ch71-011"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那金聖宮娘娘往前正走，有小妖看見，即報賽太歲道：「大王，娘娘來了。」那妖王急出剝皮亭外迎迓。娘娘道：「大王啊，煙火既息，賊已無蹤，深夜之際，特請大王安置。」那妖滿心歡喜道：「娘娘珍重。卻才那賊乃是孫悟空。他敗了我先鋒，打殺我小校，變化進來，哄了我們。我們這般搜檢，他卻渺無蹤跡，故此心上不安。」娘娘道：「那廝想是走脫了。大王放心勿慮，且自安寢去也。」妖精見娘娘侍立敬請，不敢堅辭，只得吩咐群妖，各要小心火燭，謹防盜賊，遂與娘娘徑往後宮。行者假變春嬌，從兩班侍婢引入。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      さて金聖宮が表へ歩いていくと、小妖怪が見つけて賽太歳へ知らせた。小妖怪「大王、奥方さまがおいでです。」
      賽太歳は急いで剝皮亭を出て迎えた。金聖宮「大王、煙も火も収まり、賊の姿もなくなりました。もう夜も更けましたので、お休みいただこうと、お誘いに参りました。」
      賽太歳はすっかり喜んだ。賽太歳「お妃さま、ご親切に。先ほどの賊は孫悟空（そんごくう）だったのです。わしの先鋒を破り、小役人を殴り殺したうえ、姿を変えて入り込み、わしたちをだました。これほど捜しても、まるで跡がないので、どうも気が休まりません。」
      金聖宮「あいつは、きっと逃げ出したのでしょう。どうかお気を楽に、お気になさらず、お休みになってください。」
      金聖宮がそばに立って丁重に頼むので、賽太歳も強く断れず、妖怪たちに火の用心と賊への警戒を申しつけ、一緒に奥の御殿へ向かった。春嬌に化けた悟空は、二列の侍女とともに先導して中へ入れた。
    "translation_status": "reviewed"
  - "id": "xy-ch71-012"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "娘娘叫：「安排酒來與大王解勞。」妖王笑道：「正是，正是。快將酒來，我與娘娘壓驚。」假春嬌即同眾怪鋪排了果品，整頓些腥肉，調開桌椅。那娘娘擎杯，這妖王也以一杯奉上，二人穿換了酒杯。假春嬌在旁，執著酒壺道：「大王、與娘娘今夜才遞交杯盞，請各飲乾，穿個雙喜杯兒。」真個又各斟上，又飲乾了。「假春嬌」又道：「大王娘娘喜會，眾侍婢會唱的供唱，善舞的起舞來耶。」說未畢，只聽得一派歌聲，齊調音律，唱的唱，舞的舞。他兩個又飲了許多，娘娘叫住了歌舞。眾侍婢分班，出屏風外擺列。惟有假春嬌執壺，上下奉酒。娘娘與那妖王專說得是夫妻之話。你看那娘娘一片雲情雨意，哄得那妖王骨軟觔麻。只是沒福，不得沾身。可憐！真是貓咬尿胞──空歡喜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      金聖宮「大王のお疲れをほぐすよう、酒を用意しなさい。」
      賽太歳は笑って言った。賽太歳「そうです、そうです。早く酒を持ってこい。お妃さまと飲んで、驚いた気持ちを鎮めよう。」
      春嬌に化けた悟空は、ほかの妖怪たちと果物を並べ、生臭い肉をいくらか調え、卓と椅子を整えた。金聖宮が杯を持つと、賽太歳も一杯を差し出し、二人は杯を取り交わした。悟空は横で酒壺を持って言った。悟空「大王と奥方さまは、今夜初めて夫婦の杯を交わされました。どうぞそれぞれ飲み干し、もう一巡、喜びを重ねる杯を交わしてください。」
      二人は本当にもう一度注いでもらい、飲み干した。さらに悟空「大王と奥方さまの、おめでたいお集まりです。侍女たち、歌える者は歌い、舞える者は舞うのです。」
      言い終わらぬうちに歌声が一斉に響き、節をそろえて、歌う者は歌い、舞う者は舞った。二人はさらにずいぶん飲み、金聖宮が歌と舞をやめさせた。侍女たちは列を分け、屏風の外へ出て並ぶ。悟空だけが酒壺を持ち、二人の間を行き来して酒を注いだ。金聖宮と賽太歳は、ひたすら夫婦の情を語り合う。金聖宮が男女の情をしきりに示して誘うので、賽太歳は骨も筋もとろけるようになった。それでも福に恵まれず、体には触れられない。哀れなものだ。まったく、猫が尿袋にかみついたようなもの、ぬか喜びに終わったのである。
    "translation_status": "reviewed"
  - "id": "xy-ch71-013"
    "section_id": "chapter-71"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "敘了一會，笑了一會，娘娘問道：「大王，寶貝不曾傷損麼？」妖王道：「這寶貝乃先天摶鑄之物，如何得損？只是被那賊扯開塞口之綿，燒了豹皮包袱也。」娘娘說：「怎生收拾？」妖王道：「不用收拾，我帶在腰間哩。」假春嬌聞得此言，即拔下毫毛一把，嚼得粉碎，輕輕挨近妖王，將那毫毛放在他身上，吹了三口仙氣，暗暗的叫：「變！」那些毫毛即變做三樣惡物，乃虱子、虼蚤、臭蟲，攻入妖王身內，挨著皮膚亂咬。那妖王燥癢難禁，伸手入懷揣摸揉癢，用指頭捏出幾個虱子來，拿近燈前觀看。娘娘見了，含忖道：「大王，想是襯衣髒了，久不曾漿洗，故生此物耳。」妖王慚愧道：「我從來不生此物，可可的今宵出醜。」娘娘笑道：「大王何為出醜？常言道：『皇帝身上也有三個御虱』哩。且脫下衣服來，等我替你捉捉。」妖王真個解帶脫衣。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch71-1455620"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第071回&oldid=1455620"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      しばらく語り、しばらく笑ったあと、金聖宮が尋ねた。金聖宮「大王、あの宝は傷んでいませんか。」
      賽太歳「あれは天地の始まる前から練り鋳られたものです。傷むはずがありません。ただ、賊が口に詰めた綿を引き抜いたので、豹皮の包みが焼けました。」
      金聖宮「どのようにしまっておられるのですか。」
      賽太歳「しまう必要もありません。腰につけております。」
      それを聞いた悟空は、毛を一つかみ抜き、細かくかみ砕いた。そっと賽太歳へ近づき、その体へ毛を載せ、仙気を三口吹きかけ、ひそかに悟空「変われ！」
      毛は三種類の害虫、シラミ、ノミ、南京虫となり、賽太歳の衣の中へ潜り込んで、肌に食いつき、めちゃくちゃにかんだ。賽太歳はむずがゆくてたまらず、懐へ手を差し入れて探ったりこすったりし、指でシラミを何匹かつまみ出して、灯火へ近づけて見た。金聖宮はそれを見て、からかうように言った。金聖宮「大王、きっと肌着が汚れたのでしょう。長らく洗って糊をきかせなかったために、こんなものが湧いたのですよ。」
      賽太歳は恥じて言った。賽太歳「これまで、こんな虫がついたことはありません。よりによって今夜、恥をさらすとは。」
      金聖宮は笑った。金聖宮「何が恥でございましょう。『皇帝の体にも、御用のシラミが三匹はいる』と言うではありませんか。お召し物を脱いでください。私が取って差し上げます。」
      賽太歳は本当に帯を解き、衣を脱いだ。
    "translation_status": "reviewed"
  - "id": "xy-ch71-014"

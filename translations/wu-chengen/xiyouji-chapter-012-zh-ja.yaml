- "id": "xy-ch12-037"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    三寶巍巍道可尊，四生六道盡評論。
    明心解養人天法，見性能傳智慧燈。
    護體莊嚴金世界，身心清淨玉壺冰。
    自從佛製袈裟後，萬劫誰能敢斷僧？」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 195
    "line_end": 198
  "translation_ja": |-
    観音菩薩「三宝は高くそびえ、その道は尊く、四生（ししょう）六道のこともすべて論じ尽くす。
    心を明らかにして、人天の法を養う道を知り、本性を見きわめれば智慧の灯を伝えられる。
    身を守って金の世界を荘厳し、身心の清らかさは玉壺の氷のよう。
    仏が袈裟を定めて以来、万劫（まんごう）を経ても、誰が僧を害することができようか。」
  "translation_status": "reviewed"
- "id": "xy-ch12-038"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王在那寶殿上聞言，十分歡喜。又問：「那和尚，九環杖有甚好處？」菩薩道：「我這錫杖，是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 200
    "line_end": 200
  "translation_ja": "太宗は宝殿でこれを聞き、大いに喜んで、さらに尋ねた。太宗「和尚、その九環の杖にはどのようなよさがあるのだ。」観音菩薩「私のこの錫杖は、このようなものです。」"
  "translation_status": "reviewed"
- "id": "xy-ch12-039"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    銅鑲鐵造九連環，九節仙藤永駐顏。
    入手厭看青骨瘦，下山輕帶白雲還。
    摩呵五祖遊天闕，羅卜尋娘破地關。
    不染紅塵些子穢，喜伴神僧上玉山。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 201
    "line_end": 204
  "translation_ja": |-
    観音菩薩「銅をはめ鉄で作った九つの環、九節の仙藤は容色を永遠にとどめる。
    手にすれば青く痩せた骨のような姿を飽くまで眺め、山を下れば白雲を軽く伴って帰る。
    摩呵（まか）の五祖はこれで天の宮を巡り、羅卜（らぼく）は母を尋ねて地獄の関を破った。
    俗世の塵をいささかも帯びず、神僧に喜んで伴い、玉山（ぎょくざん）に登る。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『摩呵五祖』『羅卜』の表記を保持した。摩訶・目連等への黙示の訂正はしていない。羅卜は母を地獄から救う説話の人物として訳した。『入手厭看青骨瘦』は痩せた青い骨のような杖を飽くまで眺めると暫定解釈したが、厭看の語義には留保がある。"
- "id": "xy-ch12-040"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王聞言，即命展開袈裟，從頭細看，果然是件好物。道：「大法長老，實不瞞你。朕今大開善教，廣種福田，見在那化生寺聚集多僧，敷演經法。內中有一個大有德行者，法名玄奘。朕買你這兩件寶物，賜他受用。你端的要價幾何？」菩薩聞言，與木叉合掌皈依，道聲佛號，躬身上啟道：「既有德行，貧僧情願送他，決不要錢。」說罷，抽身便走。唐王急著蕭瑀扯住，欠身立於殿上，問曰：「你原說袈裟五千兩，錫杖二千兩，你見朕要買，就不要錢，敢是說朕心倚恃君位，強要你的物件？更無此理。朕照你原價奉償，卻不可推避。」菩薩起手道：「貧僧有願在前，原說果有敬重三寶，見善隨喜，皈依我佛，不要錢，願送與他。今見陛下明德止善，敬我佛門；況又高僧有德有行，宣揚大法，理當奉上，決不要錢。貧僧願留下此物告回。」唐王見他這等懃懇，甚喜。隨命光祿寺，大排素宴酬謝。菩薩又堅辭不受，暢然而去，依舊望都土地廟中隱避不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 206
    "line_end": 206
  "translation_ja": "太宗はこれを聞き、袈裟を広げさせ、端から細かく眺めた。確かに、すばらしい品だった。太宗「大いなる法を修める長老、包み隠さず話そう。朕は今、善き教えを大いに開き、広く福田（ふくでん）を耕している。現に化生寺へ大勢の僧を集め、経法を説かせているところだ。その中にきわめて徳行の優れた者がおり、法名を玄奘という。朕はこの二つの宝を買い、彼に使わせたい。実際のところ、いくらが望みなのだ。」観音菩薩はこれを聞き、恵岸行者とともに合掌して仏に帰依し、仏号を唱えると、身をかがめて申し上げた。観音菩薩「徳行のある方なら、この僧は喜んでお贈りいたします。お金は決して頂きません。」言い終わると、身を引いて帰ろうとした。太宗は急いで蕭瑀に引き止めさせ、自らも殿上で身を起こして立ち、尋ねた。太宗「初めには袈裟五千両、錫杖二千両と言ったのに、朕が買おうとすると、お金は要らぬという。それでは、朕が君主の位を笠に着て、そなたの品を無理にもらおうとしていると言うのか。そんな道理は決してない。初めの値のとおり払うから、遠慮してはならぬ。」観音菩薩は手を上げて礼をした。観音菩薩「この僧には、先に立てた願いがあります。真に三宝を敬い、善を見てともに喜び、わが仏に帰依する方には、お金を取らずに贈ると、初めから申しておりました。今見れば、陛下は明らかな徳を備え、至善にとどまり、仏門を敬われます。そのうえ高僧も徳行を備え、大法を説き広めておられる。差し上げるのが道理であり、お金は決して頂きません。この品を残し、お暇したいと存じます。」太宗はそれほど懇ろな言葉を聞いて大いに喜び、光禄寺（こうろくじ）に盛大な精進の宴を整えさせ、礼をしようとした。観音菩薩はそれも固く辞退し、晴れやかに去って、再び都土地廟（ととちびょう）へ身を隠した。この話はいったん措く。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『菩薩聞言，與木叉合掌…躬身上啟道』の発言主体は文頭の観音菩薩と読む。共同行動と共同発言を同一視せず、恵岸行者の独立した台詞を増やしていない。"
- "id": "xy-ch12-041"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說太宗設午朝，著魏徵賫旨，宣玄奘入朝。那法師正聚眾登壇，諷經誦偈，一聞有旨，隨下壇整衣，與魏徵同往見駕。太宗道：「求證善事，有勞法師，無物酬謝。早間蕭瑀迎著二僧，願送錦襴異寶袈裟一件，九環錫杖一條。今特召法師領去受用。」玄奘叩頭謝恩。太宗道：「法師如不棄，可穿上與朕看看。」長老遂將袈裟抖開，披在身上，手持錫杖，侍立階前。君臣個個忻然。誠為如來佛子。你看他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 207
    "line_end": 207
  "translation_ja": "さて、太宗は昼の朝会を開き、魏徴に勅旨を持たせ、玄奘を宮中へ召した。玄奘はちょうど一同を集めて壇に上り、経や偈を唱えていたが、勅命が来たと聞くと、すぐ壇を下りて衣を整え、魏徴とともに拝謁へ赴いた。太宗「善事の成就を求めるため、法師にはご苦労をかけているが、礼にする物がない。今朝、蕭瑀が二人の僧に出会い、その僧たちが、錦襴の不思議な宝の袈裟一着と九環錫杖一本を贈ってくれた。そこで特に法師を呼び、受け取って使ってもらうことにしたのだ。」玄奘は頭を下げて恩を謝した。太宗「法師、差し支えなければ着て、朕に見せてほしい。」玄奘は袈裟を振り広げて身にまとい、錫杖を手に、階段の前に立った。君臣は誰もが喜んだ。まことに如来の仏子である。その姿をご覧あれ。"
  "translation_status": "reviewed"
- "id": "xy-ch12-042"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    凜凜威顏多雅秀，佛衣可體如裁就。
    暉光豔豔滿乾坤，結綵紛紛凝宇宙。
    朗朗明珠上下排，層層金線穿前後。
    兜羅四面錦沿邊，萬樣稀奇鋪綺繡。
    八寶妝花縛鈕絲，金環束領攀絨扣。
    佛天大小列高低，星象尊卑分左右。
    玄奘法師大有緣，現前此物堪承受。
    渾如極樂活阿羅，賽過西方真覺秀。
    錫杖叮噹鬥九環，毘盧帽映多豐厚。
    誠為佛子不虛傳，勝似菩提無詐謬。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 209
    "line_end": 218
  "translation_ja": |-
    凜々しく威厳ある顔は雅やかに秀で、仏衣は仕立てたように身にぴたりと合う。
    輝く光は天地に満ち、色とりどりの彩りが宇宙に凝る。
    明るい真珠は上下に並び、幾重もの金糸は前後を貫く。
    兜羅（とら）の綿には四方の縁に錦をめぐらし、さまざまな珍しい模様を美しい刺繡に広げる。
    八宝の花飾りに紐の結びを添え、金環で襟を留め、絨の掛け紐を渡す。
    仏と天人の大小の姿は高低に並び、星々の尊卑は左右に分かれる。
    玄奘法師には大いなる縁があり、目の前のこの品を受けるにふさわしい。
    まるで極楽の生きた阿羅漢（あらかん）、西方で真に悟った秀でた者にも勝る。
    錫杖の九つの環は触れ合って鳴り、毘盧帽はゆたかな容貌を映す。
    仏子というのは偽りではなく、菩提（ぼだい）の覚者をもしのぐというに欺きはない。
  "translation_status": "reviewed"
- "id": "xy-ch12-043"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時文武階前喝采。太宗喜之不勝，即著法師穿了袈裟，持了寶杖；又賜兩隊儀從，著多官送出朝門，教他上大街行道，往寺裡去，就如中狀元誇官的一般。這去玄奘再拜謝恩，在那大街上，烈烈轟轟，搖搖擺擺。你看那長安城裡，行商坐賈、公子王孫、墨客文人、大男小女，無不爭看誇獎，俱道：「好個法師，真是個活羅漢下降，活菩薩臨凡。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 219
    "line_end": 219
  "translation_ja": "文武の官人たちは階段の前で喝采した。太宗は喜びに堪えず、玄奘にそのまま袈裟を着て宝杖を持たせ、さらに二隊の儀仗の供を賜った。官人たちには朝門の外まで見送らせ、大通りを行列して寺へ帰らせた。そのさまは、状元に受かった者が官位を誇って練り歩くようだった。玄奘は再び拝して恩を謝し、大通りを堂々と、ゆったり進んでいった。長安の町では、旅商人も店を構える商人も、公子や王族の子弟も、墨客や文人も、大人の男も幼い娘も、争って見に集まり、ほめそやさぬ者はなかった。長安の人々「何と立派な法師だ。まことに生きた羅漢が降り、生きた菩薩がこの世へ来られたのだ。」"
  "translation_status": "reviewed"
- "id": "xy-ch12-044"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘直至寺裡，僧人下榻來迎。一見他披此袈裟，執此錫杖，都道是地藏王來了，各各歸依，侍於左右。玄奘上殿，炷香禮佛。又對眾感述聖恩已畢，各歸禪座。又不覺紅輪西墜。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 221
    "line_end": 221
  "translation_ja": "玄奘が寺へ着くと、僧たちは座を下りて迎えた。その袈裟をまとい、その錫杖を持っているのを見ると、皆、地蔵王（じぞうおう）がおいでになったのだと言い、それぞれ帰依して左右に侍った。玄奘は堂に上がり、香を焚いて仏を拝んだ。そして一同に皇帝の恩への感謝を語り終えると、それぞれ禅座に戻った。いつしか赤い太陽が西に沈んだ。まさに、"
  "translation_status": "reviewed"
- "id": "xy-ch12-045"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    日落煙迷草樹，帝都鐘鼓初鳴。叮叮三響斷人行，前後街前寂靜。
    上剎輝煌燈火，孤村冷落無聲。禪僧入定理殘經，正好煉魔養性。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 223
    "line_end": 224
  "translation_ja": |-
    日が落ち、霞に草木がかすみ、帝都には鐘と太鼓が鳴り始める。澄んだ音が三度響くと人通りは絶え、前後の通りは静まり返る。
    大寺には灯火がきらめき、寂しい村はひっそりと音もない。禅僧は定に入り、残る経巻を整える。まさしく魔を練り去り、性を養うよいときだ。
  "translation_status": "reviewed"
- "id": "xy-ch12-046"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "光陰撚指，卻當七日正會。玄奘又具表，請唐王拈香。此時善聲遍滿天下。太宗即排駕，率文武多官、后妃國戚，早赴寺裡。那一城人，無論大小尊卑，俱詣寺聽講。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 226
    "line_end": 226
  "translation_ja": "月日は指をひねる間に過ぎ、七日目の本法会となった。玄奘は再び上表し、太宗に香を供えに来てもらうよう願った。このころには善い評判が天下に満ちていた。太宗は御駕を整え、文武の官人、后妃や外戚を率い、朝早く寺へ赴いた。町じゅうの人も、大人子供、身分の高低を問わず、皆寺に来て講説を聞いた。"
  "translation_status": "reviewed"
- "id": "xy-ch12-047"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當有菩薩與木叉道：「今日是水陸正會，以一七繼七七，可矣了。我和你雜在眾人叢中，一則看他那會何如，二則看金蟬子可有福穿我的寶貝，三則也聽他講的是那一門經法。」兩人隨投寺裡。正是有緣得遇舊相識，般若還歸本道場。入到寺裡觀看，真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 228
    "line_end": 228
  "translation_ja": "そのとき、観音菩薩は恵岸行者に言った。観音菩薩「今日は水陸の本法会です。一つの七日をもって七七の法会につなぐなら、もうよいでしょう。私とお前も人々の中に紛れて行きましょう。第一に法会がどうなっているかを見、第二に金蝉子（きんせんし）に私の宝を着る福があるかを見、第三に、どのような経法を説いているかを聞くのです。」二人は寺へ向かった。まさに、縁あって古い知り合いに出会い、般若（はんにゃ）がもとの道場へ戻るのである。寺へ入って見れば、まことに、"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『以一七繼七七，可矣了』は一回の七日と七七四十九日の法会の関係をいうが、具体的な省略・代替の意図は未確定。『一つの七日をもって七七の法会につなぐなら、もうよいでしょう』と暫定訳した。"
- "id": "xy-ch12-048"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "天朝大國，果勝裟婆。賽過祇園舍衛，也不亞上剎招提。那一派仙音響喨，佛號喧嘩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 229
    "line_end": 229
  "translation_ja": "天朝の大国は、さすがに娑婆（しゃば）の世を超えている。祇園（ぎおん）や舎衛城（しゃえじょう）をもしのぎ、大寺や招提（しょうだい）にも劣らない。一帯には仙音が高らかに響き、仏号がにぎやかに満ちる。"
  "translation_status": "reviewed"
- "id": "xy-ch12-049"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這菩薩直至多寶臺邊，果然是明智金蟬之相。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 231
    "line_end": 231
  "translation_ja": "観音菩薩は多宝台（たほうだい）のそばへ進んだ。そこにあるのは、確かに明智ある金蝉の姿だった。詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch12-050"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    萬象澄明絕點埃，大典玄奘坐高臺。
    超生孤魂暗中到，聽法高流市上來。
    施物應機心路遠，出生隨意藏門開。
    對看講出無量法，老幼人人放喜懷。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 233
    "line_end": 236
  "translation_ja": |-
    万象は澄みわたり、一点の塵もなく、大典（たいてん）たる玄奘が高台に座す。
    救いを求める孤魂はひそかに至り、法を聞く高士は市中から来る。
    物を施すには機に応じ、心の道は遠く伸び、食の施しは意のまま、教えの蔵の門が開く。
    向かい合って限りない法が説かれるのを見て、老いも若きも皆、喜びに胸を開く。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の『大典玄奘』を『大闡』へ直さず『大典たる玄奘』とした。『出生』は『釋氏要覽』（大正蔵54冊2127、國立中央大學所蔵PDF https://www.ss.ncu.edu.tw/~calin/scripture/t54/T54n2127.pdf ）の出生項に、食を取り分け鬼神等へ施す語義があるため、『食の施し』とした。詩句全体の細かな構文には留保がある。"
- "id": "xy-ch12-051"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "又詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 238
    "line_end": 238
  "translation_ja": "また詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch12-052"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    因遊法界講堂中，逢見相知不俗同。
    盡說目前千萬事，又談塵劫許多功。
    法雲容曳舒群岳，教網張羅滿太空。
    檢點人生歸善念，紛紛天雨落花紅。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 240
    "line_end": 243
  "translation_ja": |-
    法界（ほっかい）の講堂へ遊びに来て、俗ならぬ古い知己に巡り会う。
    目の前の千も万もの事を説き尽くし、さらに塵の数ほどの劫に積んだ多くの功を語る。
    法の雲はゆるやかにたなびいて山々に広がり、教えの網は張り渡されて大空に満ちる。
    人の生を省みて善念へ帰らせれば、天から花の雨が乱れ落ち、紅に染まる。
  "translation_status": "reviewed"
- "id": "xy-ch12-053"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那法師在臺上念一會《受生度亡經》，談一會《安邦天寶篆》，又宣一會《勸修功卷》。這菩薩近前來，拍著寶臺，厲聲高叫道：「那和尚，你只會談小乘教法，可會談大乘麼？」玄奘聞言，心中大喜，翻身跳下臺來，對菩薩起手道：「老師父，弟子失瞻多罪。見前的蓋眾僧人，都講的是小乘教法，卻不知大乘教法如何。」菩薩道：「你這小乘教法，度不得亡者超昇，只可渾俗和光而已。我有大乘佛法三藏，能超亡者昇天，能度難人脫苦，能修無量壽身，能作無來無去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 245
    "line_end": 245
  "translation_ja": "玄奘は台上で、しばらく『受生度亡経（じゅしょうどもうきょう）』を唱え、しばらく『安邦天宝篆（あんぽうてんぽうてん）』を講じ、またしばらく『勧修功巻（かんしゅうこうかん）』を説いた。観音菩薩は前へ進み、宝台をたたいて、鋭い声で呼びかけた。観音菩薩「そこの和尚、お前は小乗（しょうじょう）の教法を語ることしか知らぬのか。大乗（だいじょう）を語ることはできるか。」玄奘は聞くと心から喜び、身を返して台を飛び下り、観音菩薩に手を上げて礼をした。玄奘「老師父、ご挨拶が遅れ、大変失礼いたしました。ここにいる大勢の僧は皆、小乗の教法を講じておりますが、大乗の教法とはどのようなものか存じません。」観音菩薩「その小乗の教法では、死者を救って高い境涯へ昇らせることはできず、ただ俗世と交わり、光を和らげるだけだ。私には大乗仏法の三蔵（さんぞう）がある。死者を天へ昇らせ、難に遭う人を苦しみから救い、無量の寿命を持つ身を修めさせ、来ることも去ることもない境地に至らせることができる。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "小乗では死者を天へ救い上げられず、大乗なら可能という説明は観音の発言を訳したもので、現代仏教全体への評価・教義的断定ではない。経名三点は底本の表記を日本字体で保持し、実在の経典への同定は未実施。"
- "id": "xy-ch12-054"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正講處，有那司香巡堂官急奏唐王道：「法師正講談妙法，被兩個疥癩遊僧扯下來亂說胡話。」王令擒來。只見許多人將二僧推擁進後法堂，見了太宗，那僧人手也不起，拜也不拜，仰面道：「陛下問我何事？」唐王卻認得他，道：「你是前日送袈裟的和尚？」菩薩道：「正是。」太宗道：「你既來此處聽講，只該吃些齋便了，為何與我法師亂講，擾亂經堂，誤我佛事？」菩薩道：「你那法師講的是小乘教法，度不得亡者昇天。我有大乘佛法三藏，可以度亡脫苦，壽身無壞。」太宗正色喜問道：「你那大乘佛法在於何處？」菩薩道：「在大西天天竺國大雷音寺我佛如來處，能解百冤之結，能消無妄之災。」太宗道：「你可記得麼？」菩薩道：「我記得。」太宗大喜道：「教法師引去，請上臺開講。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 246
    "line_end": 246
  "translation_ja": "そう語っていると、司香巡堂官（しこうじゅんどうかん）が急いで太宗へ奏上した。司香巡堂官「法師が妙法を説いておられましたところ、二人の皮膚病の旅僧が法師を引き下ろし、でたらめを申しております。」太宗は捕らえてくるよう命じた。大勢の者が二人の僧を押し立て、奥の法堂（はっとう）へ連れてきた。太宗に会っても、その僧は手を上げて礼をすることも、拝むこともなく、顔を上げて言った。観音菩薩「陛下、何をお尋ねですか。」太宗は相手に見覚えがあった。太宗「そなたは、先日袈裟を贈った和尚ではないか。」観音菩薩「そのとおりです。」太宗「ここへ講説を聞きに来たのであれば、斎食でも取ればよかろうに、なぜ朕の法師にむやみに口を挟み、経堂を乱し、仏事を妨げるのだ。」観音菩薩「その法師の説くのは小乗の教法で、死者を救って天へ昇らせることはできません。私には大乗仏法の三蔵があり、死者を救い、苦を脱けさせ、長寿の身を壊れることなく保たせられます。」太宗は顔を正し、喜んで尋ねた。太宗「その大乗仏法は、どこにあるのだ。」観音菩薩「大西天（だいさいてん）の天竺国（てんじくこく）、大雷音寺（だいらいおんじ）のわが仏、如来のもとにあります。あらゆる恨みの結び目を解き、思いがけぬ災いを消すことができます。」太宗「そなたは、それを覚えているか。」観音菩薩「覚えております。」太宗は大いに喜んだ。太宗「法師に案内させ、高台へお上がりいただいて、講説をお願いせよ。」"
  "translation_status": "reviewed"
- "id": "xy-ch12-055"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩帶了木叉，飛上高臺，遂踏祥雲，直至九霄，現出救苦原身，托了淨瓶楊柳。左邊是木叉惠岸，執著棍，抖擻精神。喜的個唐王朝天禮拜，眾文武跪地焚香。滿寺中僧尼道俗、士人工賈，無一人不拜禱道：「好菩薩！好菩薩！」有讚為證。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 248
    "line_end": 248
  "translation_ja": "観音菩薩は恵岸行者を連れ、高台へ飛び上がると、瑞雲を踏んで九霄（きゅうしょう）の空へ昇り、苦しみを救う本来の姿を現し、浄瓶（じょうへい）と楊柳（ようりゅう）を捧げた。左には木叉（もくさ）こと恵岸行者が、棍棒を執り、意気盛んに立っていた。太宗は喜んで天を仰いで拝み、文武の官人たちは地にひざまずいて香を焚いた。寺いっぱいの僧尼、道士、俗人、学者、職人、商人も、一人として拝んで祈らぬ者はなかった。寺の人々「ありがたい菩薩さま、ありがたい菩薩さま！」その証となる賛がある。見ると、"
  "translation_status": "reviewed"
- "id": "xy-ch12-056"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "瑞靄散繽紛，祥光護法身。九霄華漢裡，現出女真人。那菩薩，頭上戴一頂金葉紐、翠花鋪、放金光、生瑞氣的垂珠纓絡；身上穿一領淡淡色、淺淺妝、盤金龍、飛綵鳳的結素藍袍；胸前掛一面對月明、舞清風、雜寶珠、攢翠玉的砌香環珮；腰間繫一條冰蠶絲、織金邊、登彩雲、促瑤海的錦繡絨裙；面前又領一個飛東洋、遊普世、感恩行孝、黃毛紅嘴白鸚哥。手內托著一個施恩濟世的寶瓶，瓶內插著一枝灑青霄、撒大惡、掃開殘霧垂楊柳。玉環穿繡扣，金蓮足下深。三天許出入。這才是救苦救難觀世音。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 249
    "line_end": 249
  "translation_ja": "めでたい霞は色とりどりに散り、吉祥の光は法身（ほっしん）を護る。九霄の美しい天の川に、女真人（にょしんじん）が姿を現す。その菩薩は、頭には金の葉を結び翠の花を敷き、金光を放って瑞気を生む、珠の垂れた瓔珞（ようらく）を戴く。身には淡い色、薄い装いで、金竜がめぐり彩鳳が飛ぶ、清らかな藍の袍をまとう。胸には明月に向かい清風に舞う、さまざまな宝珠と翠玉を集めた、かぐわしい環佩（かんぱい）を掛ける。腰には氷蚕の糸を用い、金の縁を織り、彩雲に登り瑶海（ようかい）を駆ける、錦繡の絨の裳を締める。前にはまた一羽、東の海を飛び、あまねく世界を巡り、恩を感じ孝を行う、黄色い毛、赤い嘴の白鸚哥（しろいんこ）を従える。手には恩を施し世を救う宝瓶を捧げ、瓶には青空へ水を注ぎ、大悪を散らし、残る霧を掃き払う、一枝の垂れ柳を挿す。玉環は刺繡の留めを通り、金蓮は足の下に深く開く。三天への出入りを許される。これこそ、苦しみと災難を救う観世音（かんぜおん）である。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『促瑤海』は瑶海を駆ける、『撒大惡』は大悪を散らすと文脈に沿って暫定訳した。白鸚哥の黄色い毛・赤い嘴という色彩は原文どおりで、生物学的な整合を取らない。"
- "id": "xy-ch12-057"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "喜的個唐太宗忘了江山，愛的那文武官失卻朝禮，蓋眾多人都念「南無觀世音菩薩」。太宗即傳旨，教巧手丹青描下菩薩真像。旨意一聲，選出個圖神寫聖、遠見高明的吳道子（此人即後圖功臣於凌煙閣者）。當時展開妙筆，圖寫真形。那菩薩祥雲漸遠，霎時間不見了金光。只見那半空中滴溜溜落下一張簡帖，上有幾句頌子，寫得明白。頌曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 251
    "line_end": 251
  "translation_ja": "太宗は喜びのあまり国のことさえ忘れ、文武の官人たちは慕うあまり朝廷の礼も忘れた。大勢の人々は皆、唱えた。寺の人々「南無観世音菩薩（なむかんぜおんぼさつ）。」太宗はただちに、腕のよい絵師に菩薩の真の姿を描かせよと命じた。命令が伝わると、神や聖を描く技に秀で、遠くのものも明らかに見通す呉道子（ごどうし）が選ばれた。この人こそ、後に凌煙閣で功臣たちを描く者である。呉道子はすぐに巧みな筆を広げ、本来の姿を写し取った。菩薩の瑞雲は次第に遠ざかり、またたく間に金の光も見えなくなった。ただ空中から一枚の書き付けがくるくると落ちてきた。そこには幾句かの頌が、はっきり書かれていた。頌にいう。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "呉道子が後に凌煙閣の功臣像を描くという括弧書きは底本内の説明として訳した。一般に知られる凌煙閣の画家・呉道子の生没年代と整合するかは別問題で、原文を訂正していない。"
- "id": "xy-ch12-058"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "禮上大唐君，西方有妙文。程途十萬八千里，大乘進慇懃。此經回上國，能超鬼出群。若有肯去者，求正果金身。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 253
    "line_end": 253
  "translation_ja": "大唐の君に謹んで申し上げる。西方には妙なる経文がある。道のりは十万八千里、大乗を心を込めてお勧めする。この経が貴国へ届けば、亡魂を救ってその群れから脱け出させられる。進んで行く者があれば、正果（しょうか）の金身を求め得よう。"
  "translation_status": "reviewed"
- "id": "xy-ch12-059"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗見了頌子，即命眾僧：「且收勝會，待我差人取得大乘經來，再秉丹誠，重修善果。」眾官無不遵依。當時在寺中問曰：「誰肯領朕旨意，上西天拜佛求經？」問不了，傍邊閃過法師，帝前施禮道：「貧僧不才，願效犬馬之勞，與陛下求取真經，祈保我王江山永固。」唐王大喜，上前將御手扶起道：「法師果能盡此忠賢，不怕程途遙遠，跋涉山川，朕情願與你拜為兄弟。」玄奘頓首謝恩。唐王果是十分賢德，就去那寺裡佛前，與玄奘拜了四拜，口稱「御弟聖僧」。玄奘感謝不盡道：「陛下，貧僧有何德何能，敢蒙天恩眷顧如此？我這一去，定要捐軀努力，直至西天；如不到西天，不得真經，即死也不敢回國，永墮沉淪地獄。」隨在佛前拈香，以此為誓。唐王甚喜，即命回鑾，待選良利日辰，發牒出行，遂此駕回各散。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 254
    "line_end": 254
  "translation_ja": "太宗は頌を読むと、ただちに僧たちへ命じた。太宗「ひとまずこの法会は収めよ。朕が人を遣わして大乗の経を取ってこさせた後、あらためて真心を尽くし、善果を修めよう。」官人たちは皆従った。その場で太宗は寺の人々に尋ねた。太宗「誰か朕の命を受け、西天（さいてん）へ仏を拝み、経を求めに行く者はおらぬか。」問い終えぬうちに、傍らから玄奘が進み出て、帝の前で礼をした。玄奘「この僧は才に乏しゅうございますが、犬馬の労（けんばのろう）を尽くし、陛下のために真の経を求め、わが君の国が永久に安泰であるよう祈りたいと存じます。」太宗は大いに喜び、前へ出て自らの手で助け起こした。太宗「法師がまことにその忠義と徳を尽くし、道の遠さを恐れず山川を越えてくれるなら、朕は喜んでそなたと義兄弟の契りを結ぼう。」玄奘は頭を下げて恩を謝した。太宗はまことに賢徳の君で、寺の仏前へ行き、玄奘とともに四度拝し、呼びかけた。太宗「御弟聖僧（ぎょていしょうそう）よ。」玄奘は感謝してもしきれずに言った。玄奘「陛下、この僧に何の徳、何の力があって、これほどのご恩を頂けるのでしょう。こうして行くからには、必ず命を捨てて力を尽くし、西天まで参ります。西天へ到らず、真の経を得られなければ、たとえ死んでも国へは戻らず、永遠に地獄に沈みましょう。」そして仏前に香を供え、それを誓いとした。太宗は大いに喜び、宮中へ帰るよう命じた。よい日を選んで文牒（ぶんちょう）を発給し、旅立たせることとして御駕を返し、一同も散った。"
  "translation_status": "reviewed"
- "id": "xy-ch12-060"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘亦回洪福寺裡。那本寺多僧與幾個徒弟，早聞取經之事，都來相見，因問：「發誓願上西天，實否？」玄奘道：「是實。」他徒弟道：「師父啊，嘗聞人言，西天路遠，更多虎豹妖魔。只怕有去無回，難保身命。」玄奘道：「我已發了洪誓大願，不取真經，永墮沉淪地獄。大抵是受王恩寵，不得不盡忠以報國耳。我此去真是渺渺茫茫，吉凶難定。」又道：「徒弟們，我去之後，或三二年，或五七年，但看那山門裡松枝頭向東，我即回來；不然，斷不回矣。」眾徒將此言切切而記。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 255
    "line_end": 255
  "translation_ja": "玄奘も洪福寺へ戻った。寺の大勢の僧と何人かの弟子は、すでに取経の話を聞いており、皆会いに来て尋ねた。洪福寺の僧と弟子たち「西天へ行くと誓願を立てられたというのは、本当ですか。」玄奘「本当だ。」弟子たち「お師匠さま、西天への道は遠く、虎や豹、妖魔も多いと、よく聞きます。行ったきり戻れず、お命を守れないのではと心配です。」玄奘「私はすでに大きな誓願を立てた。真の経を得なければ、永遠に地獄へ沈むとな。そもそも君王のご恩を受けた以上、忠義を尽くして国に報いずにはいられないのだ。この旅の先は本当におぼろで、吉と出るか凶と出るか、定め難い。」さらに玄奘は言った。玄奘「弟子たちよ、私が去った後、二、三年かもしれず、五年、七年かもしれぬが、山門の内の松の枝先が東を向いたのを見たら、私が帰ってくると思いなさい。そうでなければ、決して帰ってはこない。」弟子たちは、この言葉を深く心に刻んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch12-061"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次早，太宗設朝，聚集文武，寫了取經文牒，用了通行寶印。有欽天監奏曰：「今日是人尊吉星，堪宜出行遠路。」唐王大喜。又見黃門官奏道：「御弟法師朝門外候旨。」隨即宣上寶殿道：「御弟，今日是出行吉日。這是通關文牒。朕又有一個紫金缽盂，送你途中化齋而用。再選兩個長行的從者。又欽賜你馬一匹，送為遠行腳力。你可就此行程。」玄奘大喜，即便謝了恩，領了物事，更無留滯之意。唐王排駕，與多官同送至關外。只見那洪福寺僧與諸徒將玄奘的冬夏衣服，俱送在關外相等。唐王見了，先教收拾行囊、馬匹，然後著官人執壺酌酒。太宗舉爵，又問曰：「御弟雅號甚稱？」玄奘道：「貧僧出家人，未敢稱號。」太宗道：「當時菩薩說，西天有經三藏。御弟可指經取號，號作三藏何如？」玄奘又謝恩，接了御酒道：「陛下，酒乃僧家頭一戒，貧僧自為人，不會飲酒。」太宗道：「今日之行，比他事不同，此乃素酒，只飲此一杯，以盡朕奉餞之意。」三藏不敢不受，接了酒，方待要飲，只見太宗低頭，將御指拾一撮塵土，彈入酒中。三藏不解其意，太宗笑道：「御弟啊，這一去，到西天，幾時可回？」三藏道：「只在三年，徑回上國。」太宗道：「日久年深，山遙路遠，御弟可進此酒：寧戀本鄉一捻土，莫愛他鄉萬兩金。」三藏方悟捻土之意，復謝恩飲盡，辭謝出關而去。唐王駕回。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 256
    "line_end": 256
  "translation_ja": "翌朝、太宗は朝会を開いて文武の官人を集め、取経の文牒を作り、通行を認める宝印を押した。欽天監（きんてんかん）の官が奏上した。欽天監の官「本日は人尊（じんそん）の吉星に当たり、遠路へ旅立つのによい日でございます。」太宗は大いに喜んだ。すると黄門官が奏上した。黄門官「御弟（ぎょてい）法師が朝門の外で仰せを待っておられます。」すぐに宝殿へ召し上げ、太宗は言った。太宗「御弟よ、今日は旅立ちの吉日だ。これが通関の文牒である。朕にはまた紫金（しきん）の鉢盂（はつう）が一つあり、道中で斎食を乞うため、そなたに贈る。さらに長旅に付き添う従者を二人選んでおいた。馬も一頭賜り、遠い道の足として贈ろう。このまま旅立つがよい。」玄奘は大いに喜び、すぐに恩を謝して品々を受け取り、少しも留まろうとはしなかった。太宗は御駕を整え、官人たちとともに関の外まで見送った。洪福寺の僧と弟子たちも玄奘の冬服と夏服を持ってきて、関外で待っていた。太宗はまず荷物と馬の支度をさせ、それから役人に酒壺を持たせて酒を注がせた。太宗は杯を上げ、改めて尋ねた。太宗「御弟の雅号は何というのだ。」玄奘「この僧は出家の身、あえて号を名乗ってはおりません。」太宗「あのとき菩薩が、西天には三蔵の経があると言った。御弟も経にちなんで号を取り、三蔵（さんぞう）と名乗ってはどうか。」三蔵は再び恩を謝し、御酒を受け取って申し上げた。三蔵「陛下、酒は僧にとって第一の戒めでございます。この僧は生まれてから、酒を飲むことを知りません。」太宗「今日の出立は、ほかのこととは違う。これは素酒（そしゅ）だ。この一杯だけを飲み、朕の餞別の心を受けてほしい。」三蔵は受けぬわけにもいかず、酒を手にして飲もうとした。すると太宗は身をかがめ、自らの指でひとつまみの土を拾い、酒の中へはじき入れた。三蔵にはその意味が分からなかった。太宗は笑って言った。太宗「御弟よ、こうして西天へ行ったなら、いつ帰れるであろう。」三蔵「三年のうちには、まっすぐこの国へ戻ってまいります。」太宗「歳月は長く、山は遥か、道は遠い。御弟よ、この酒を飲むがよい。故郷のひとつまみの土を恋うとも、他郷の万両の金を愛してはならぬ。」三蔵はそこで土の意味を悟り、再び恩を謝して酒を飲み干すと、礼を述べて別れ、関を出て旅立った。太宗は宮中へ帰った。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『人尊吉星』の人尊は出行の暦注として保持。『素酒』を無根拠にノンアルコールと断定せず原語を残した。三蔵の号はこの段落内で正式に授けられ、直後から地の文・話者名を三蔵へ切り替えた。『三蔵』には経の三区分と人物の号の二義があるため、同名の辞書項目を意味の違いを無視して統合しない。"
- "id": "xy-ch12-062"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去何如，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 257
    "line_end": 257
  "translation_ja": "さて、この旅がどうなることか。それは次回の物語をお聞きあれ。"
  "translation_status": "reviewed"

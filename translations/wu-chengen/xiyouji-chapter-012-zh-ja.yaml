  "kind": "paragraph"
  "origin": "source"
  "source_text": "尉遲恭見他苦苦推辭，只得具本差人啟奏。太宗見了本，知相良不受金銀，道：「此誠為善良長者。」即傳旨教胡敬德將金銀與他修理寺院，起蓋生祠，請僧作善，就當還他一般。旨意到日，敬德望闕謝恩宣旨，眾皆知之。遂將金銀買到城裡軍民無礙的地基一段，周圍有五十畝寬闊，在上興工，起蓋寺院，名「敕建相國寺」，左有相公、相婆的生祠，鐫碑刻石，上寫著「尉遲恭監造」，即今「大相國寺」是也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 132
    "line_end": 132
  "translation_ja": "尉遅恭は相良がどうしても辞退するので、やむなく上奏文を作り、使者に届けさせた。太宗はそれを読み、相良が金銀を受け取らないと知って言った。太宗「これはまことに、善良な長者である。」そこで尉遅恭に、その金銀で相良のために寺院を造り、生きている者を祀る生祠（せいし）を建て、僧を招いて善事を営み、それを返済の代わりとせよと命じた。勅旨が届くと、尉遅恭は宮城の方へ向かって恩を謝し、勅旨を読み上げ、一同に知らせた。そして金銀で、町の中の軍民に差し障りのない土地を五十畝（ほ）ほど買い入れ、工事を始めて寺院を建て、「勅建相国寺（ちょくけんしょうこくじ）」と名づけた。左側には相良夫妻の生祠があり、石碑を刻んで「尉遅恭監造」と記した。これが今日の「大相国寺（だいしょうこくじ）」である。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "原文の『胡敬德』『敬德』はこの場面の尉遲恭を指す呼称として、既存ガイドに従い尉遅恭とした。大相国寺の創建をこの挿話に結び付ける説明は物語内の由来譚で、史実の確認とは別。"
- "id": "xy-ch12-011"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "工完回奏，太宗甚喜。卻又聚集多官，出榜招僧，修建水陸大會，超度冥府孤魂。榜行天下，著各處官員推選有道的高僧，上長安做會。那消個月之期，天下多僧俱到。唐王傳旨，著太史丞傅奕選舉高僧，修建佛事。傅奕聞旨，即上疏止浮圖，以言無佛。表曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 134
    "line_end": 134
  "translation_ja": "工事が終わり復命すると、太宗は大いに喜んだ。さらに官人たちを集め、僧を募る布告を出し、冥府の寄る辺ない亡魂を救うため、水陸大会（すいりくだいえ）を営むことにした。布告は天下に行き渡り、各地の役人に、道を修めた高僧を選び、長安の法会へ上らせるよう命じた。一か月もたたぬうちに、天下の大勢の僧が到着した。太宗は太史丞（たいしじょう）の傅奕（ふえき）に、高僧を選んで仏事を営むよう命じた。傅奕は命を聞くと、ただちに仏教をやめさせる上疏を奉り、仏などないと主張した。その上表にはこうあった。"
  "translation_status": "reviewed"
- "id": "xy-ch12-012"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "西域之法，無君臣父子，以三塗六道，蒙誘愚蠢。追既往之罪，窺將來之福，口誦梵言，以圖偷免。且生死壽夭，本諸自然；刑德威福，係之人主。今聞俗徒矯託，皆云由佛。自五帝三王，未有佛法，君明臣忠，年祚長久。至漢明帝始立胡神，然惟西域桑門自傳其教。實乃夷犯中國，不足為信。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 136
    "line_end": 136
  "translation_ja": "西域（さいいき）の教えは君臣父子の道を認めず、三塗（さんず）六道（ろくどう）を説いて愚かな者を欺き誘っております。過去の罪を追い、未来の福をうかがい、口に梵語を唱えて、ひそかに罪を逃れようとするものです。そもそも生死と寿命の長短は自然に基づき、刑罰と恩恵、威厳と幸福を与える権限は君主に属します。ところが今聞くところでは、俗人どもは偽りをかこつけ、いずれも仏によるものだと申します。五帝（ごてい）三王（さんおう）以来、仏法はなくとも、君主は明らかで臣下は忠実、王朝の命運は長く続きました。漢（かん）の明帝（めいてい）になって初めて胡人（こじん）の神が立てられましたが、それも西域の沙門（しゃもん）が自分たちで教えを伝えただけです。まことに異民族が中国を侵すもので、信ずるには足りません。"
  "translation_status": "reviewed"
- "id": "xy-ch12-013"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗聞言，遂將此表擲付群臣議之。時有宰相蕭瑀，出班俯顖奏曰：「佛法興自屢朝，弘善遏惡，冥助國家，理無廢棄。佛，聖人也。非聖者無法，請寘嚴刑。」傅奕與蕭瑀論辨，言：「禮本於事親事君，而佛背親出家，以匹夫抗天子，以繼禮悖所親。蕭瑀不生於空桑，乃遵無父之教，正所謂非孝者無親。」蕭瑀但合掌曰：「地獄之設，正為是人。」太宗召太僕卿張道源、中書令張士衡，問佛事營福，其應何如。二臣對曰：「佛在清淨仁恕，果正佛空。周武帝以三教分次；大慧禪師有贊幽遠，歷眾供養而無不顯；五祖投胎，達摩現像。自古以來，皆云三教至尊而不可毀，不可廢。伏乞陛下聖鑒明裁。」太宗甚喜道：「卿之言合理。再有所陳者，罪之。」遂著魏徵與蕭瑀、張道源邀請諸佛，選舉一名有大德行者作壇主，設建道場。眾皆頓首謝恩而退。自此時出了法律：但有毀僧謗佛者，斷其臂。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 137
    "line_end": 137
  "translation_ja": "太宗はその言葉を聞き、上表を臣下たちへ投げ渡して議論させた。宰相の蕭瑀（しょうう）が列を出て、頭を伏せて奏上した。蕭瑀「仏法は幾代もの王朝を経て盛んとなり、善を広め悪を抑え、目に見えぬところで国を助けております。廃棄すべき道理はございません。仏は聖人です。聖人をそしる者は法に背く者、どうか厳罰に処してください。」傅奕は蕭瑀と論争した。傅奕「礼は親と君主に仕えることを根本とする。ところが仏は親に背いて出家し、一介の男が天子に抗い、礼に背いて親を裏切る。蕭瑀は空洞の桑の木から生まれたわけでもないのに、父を認めぬ教えに従っている。まさに、孝に背く者には親がないということだ。」蕭瑀はただ合掌して言った。蕭瑀「地獄は、まさにこのような者のために設けられたのだ。」太宗は太僕卿（たいぼくけい）の張道源（ちょうどうげん）と中書令（ちゅうしょれい）の張士衡（ちょうしこう）を召し、仏事を営んで福を求めることに、どのような効験があるのか尋ねた。張道源と張士衡「仏の道は清らかさと慈しみ、寛容にあり、果を正して仏の空に至るものです。周（しゅう）の武帝（ぶてい）は三教（さんきょう）の順位を定めました。大慧禅師（だいえぜんじ）には奥深い道をたたえる教えがあり、人々の供養を経て、顕れなかった験はございません。五祖（ごそ）は生まれ変わり、達磨（だるま）は姿を現しました。古来、三教はいずれもきわめて尊く、そしっても廃してもならないと申します。伏して陛下の明らかなご裁断を仰ぎます。」太宗は大いに喜んだ。太宗「そなたたちの言うことは道理にかなう。これ以上異論を述べる者は罰する。」そこで魏徴、蕭瑀、張道源に、諸々の仏道の人々を招き、徳行の優れた者を一名選んで壇主とし、道場を開くよう命じた。一同は頭を下げて恩を謝し、退出した。このときから、僧をそしり仏を誹謗する者は腕を切る、という法が定められた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "傅奕の『以繼禮悖所親』は語句のつながりに不審があり、礼と親への背反を責める趣旨で暫定訳。原字は保持。『果正佛空』『大慧禪師有贊幽遠』も仏教擁護の意味に沿って暫定訳し、異本校訂は未実施。周武帝、五祖、達摩、僧をそしる者の断臂などの記述は物語の叙述として保持し、史実と保証しない。"
- "id": "xy-ch12-014"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "次日三位朝臣，聚眾僧，在那山川壇裡，逐一從頭查選，內中選得一名有德行的高僧。你道他是誰人？"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 139
    "line_end": 139
  "translation_ja": "翌日、三人の朝臣は大勢の僧を山川壇（さんせんだん）に集め、初めから一人ずつ調べて選び、その中から徳行のある高僧を一名選び出した。それは誰であったか。"
  "translation_status": "reviewed"
- "id": "xy-ch12-015"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    靈通本諱號金蟬，只為無心聽佛講。
    轉托塵凡苦受磨，降生世俗遭羅網。
    投胎落地就逢兇，未出之前臨惡黨。
    父是海州陳狀元，外公總管當朝長。
    出身命犯落江星，順水隨波逐浪泱。
    海島金山有大緣，遷安和尚將他養。
    年方十八認親娘，特赴京都求外長。
    總管開山調大軍，洪州剿寇誅兇黨。
    狀元光蕊脫天羅，子父相逢堪賀獎。
    復謁當今受主恩，凌煙閣上賢名響。
    恩官不受願為僧，洪福沙門將道訪。
    小字江流古佛兒，法名喚做陳玄奘。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 140
    "line_end": 151
  "translation_ja": |-
    霊知に通じ、もとの名を金蝉（きんせん）といったが、ただ仏の説法を聞く心がなかったため、
    塵の世へ転生して苦しい試練を受け、この世に生まれて罠にかかった。
    胎内を出て地に落ちるや凶事に遭い、まだ生まれぬうちから悪党に出会っていた。
    父は海州（かいしゅう）の陳状元（ちんじょうげん）、母方の祖父は当代の重臣たる総管（そうかん）。
    生まれながら川に落ちる星に定められ、流れと波に従い、波間を漂った。
    海の島の金山（きんざん）に大きな縁があり、遷安和尚（せんあんおしょう）が育ててくれた。
    年まさに十八にして実の母を知り、わざわざ都へ祖父を頼りに赴いた。
    総管の開山（かいざん）は大軍を動かし、洪州（こうしゅう）で賊を討って凶党を誅した。
    状元（じょうげん）の光蕊（こうずい）は天の網から逃れ、父子の再会は祝うに堪えた。
    再び今の帝にまみえて主君の恩を受け、凌煙閣（りょうえんかく）にその賢名が響いた。
    恩賜の官職は受けず、僧たらんと願い、洪福寺（こうふくじ）の仏門で道を求めた。
    幼名は江流（こうりゅう）、古仏の子、法名を陳玄奘（ちんげんじょう）という。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "養育した僧を底本は『遷安和尚』とする。第九回の『法明和尚』へ無断で置換せず、遷安和尚と訳した。『凌煙閣』での顕彰も本文どおりで、前後の史実や年代へ整合させていない。"
- "id": "xy-ch12-016"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日對眾舉出玄奘法師。這個人自幼為僧，出娘胎，就持齋受戒。他外公見是當朝一路總管殷開山。他父親陳光蕊中狀元，官拜文淵殿大學士。一心不愛榮華，只喜修持寂滅。查得他根源又好，德行又高；千經萬典，無所不通；佛號仙音，無般不會。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 153
    "line_end": 153
  "translation_ja": "その日、一同の前で玄奘（げんじょう）法師が推挙された。この人は幼くして僧となり、母の胎内から出るとすぐ精進を守り、戒を受けた。母方の祖父は、今の朝廷で一路の総管を務める殷開山（いんかいざん）。父の陳光蕊（ちんこうずい）は状元となり、文淵殿大学士（ぶんえんでんだいがくし）に任ぜられている。玄奘はひたすら栄華を好まず、修行して寂滅（じゃくめつ）に至ることだけを喜んだ。調べてみると、家柄もよく徳行も高く、千の経、万の典籍に通じぬものはなく、仏の名号や妙なる唱誦の声も、できぬものはなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch12-017"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時三位引至御前，揚塵舞蹈。拜罷奏曰：「臣瑀等蒙聖旨，選得高僧一名陳玄奘。」太宗聞其名，沉思良久道：「可是學士陳光蕊之兒玄奘否？」江流兒叩頭曰：「臣正是。」太宗喜道：「果然舉之不錯，誠為有德行有禪心的和尚。朕賜你左僧綱，右僧綱，天下大闡都僧綱之職。」玄奘頓首謝恩，受了大闡官爵。又賜五彩織金袈裟一件、毘盧帽一頂。教他用心再拜明僧，排次闍黎班首，書辦旨意，前赴化生寺，擇定吉日良時，開演經法。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 154
    "line_end": 154
  "translation_ja": "三人は玄奘を御前へ連れ、土煙が立つほど身を動かして拝礼した。礼を終えると奏上した。蕭瑀ら三臣「臣瑀らは聖旨を承り、高僧一名、陳玄奘を選びました。」太宗はその名を聞き、しばらく考えてから言った。太宗「学士の陳光蕊の子、玄奘ではないか。」玄奘は頭を下げて答えた。玄奘「臣がその者でございます。」太宗は喜んだ。太宗「確かに、選び違いはなかった。まことに徳行があり、禅心を備えた和尚だ。朕はそなたに、左僧綱（さそうごう）、右僧綱（うそうごう）、天下大闡都僧綱（てんかだいせんとそうごう）の職を授ける。」玄奘は頭を下げて恩を謝し、大闡（だいせん）の官爵を受けた。さらに五彩の金糸を織り込んだ袈裟（けさ）一着と毘盧帽（びるぼう）一つを賜った。そして心を尽くして優れた僧をあらためて招き、闍黎（じゃり）や班首（はんしゅ）の序列を整え、勅旨にかなう手配をし、化生寺（けしょうじ）へ赴いて吉日良辰を選び、経法の講説を始めるよう命じられた。"
  "translation_status": "reviewed"
- "id": "xy-ch12-018"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "玄奘再拜領旨而出，遂到化生寺裡，聚集多僧，打造禪榻，裝修功德，整理音樂。選得大小明僧共計一千二百名，分派上中下三堂。諸所佛前，物件皆齊，頭頭有次。選到本年九月初三日黃道良辰，開啟做七七四十九日水陸大會。即具表申奏。太宗及文武國戚皇親，俱至期赴會，拈香聽講。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 156
    "line_end": 156
  "translation_ja": "玄奘は再び拝して勅旨を受け、退出すると化生寺へ行った。大勢の僧を集め、禅座を造り、仏事の飾りを整え、音楽の用意をした。位の高低を含めて優れた僧を合わせて千二百人選び、上・中・下の三堂に分けて配置した。あらゆる仏前の品物をすべて整え、一つ一つに秩序を立てた。その年の九月三日を黄道（こうどう）の吉日として選び、この日から七七（しちしち）四十九日の水陸大会を始めることとし、上表を整えて奏上した。太宗をはじめ、文武の官人、皇族や外戚たちは、定めの日に法会へ赴き、香をつまんで供え、講説を聞いた。その証となる詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch12-019"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    龍集貞觀正十三，王宣大眾把經談。
    道場開演無量法，雲霧光乘大願龕。
    御敕垂恩修上剎，金蟬脫殼化西涵。
    普施善果超沉沒，秉教宣揚前後三。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 158
    "line_end": 161
  "translation_ja": |-
    歳は貞観（じょうがん）、まさしく十三年、王は大衆を招いて経を語らせる。
    道場には限りない法が説かれ、雲霧の光が大願の仏龕（ぶつがん）に乗る。
    勅命は恩を垂れて大寺を修め、金蝉は殻を脱ぎ西涵（せいかん）へと化す。
    広く善果を施して沈める者を救い、教えを守って前後の三つを説き広める。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『金蟬脫殼化西涵』の『西涵』は語義未確定のため訳文にも西涵を保持。『前後三』も何を三つに数えるか確定できず、『前後の三つ』とした。三世等へ無断で補っていない。"
- "id": "xy-ch12-020"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "貞觀十三年，歲次己巳，九月甲戌，初三日，癸卯良辰，陳玄奘大闡法師聚集一千二百名高僧，都在長安城化生寺開演諸品妙經。那皇帝早朝已畢，帥文武多官，乘鳳輦龍車，出離金鑾寶殿，徑上寺來拈香。怎見那鑾駕？真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 162
    "line_end": 162
  "translation_ja": "貞観十三年、年の干支は己巳（つちのとみ）、九月は甲戌（きのえいぬ）、その三日の癸卯（みずのとう）という吉辰に、陳玄奘大闡法師は千二百人の高僧を集め、長安城の化生寺で、さまざまな妙なる経を説き始めた。皇帝は早朝の政務を終えると、文武の官人たちを率い、鳳凰（ほうおう）や竜で飾られた御車に乗って金鑾宝殿（きんらんほうでん）を出、まっすぐ寺へ香を供えに向かった。その御行列はいかなるものか。まことに、"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の『貞觀十三年、己巳、九月甲戌、初三日、癸卯』はそのまま訳した。年号と干支の日付整合は確認できておらず、歴史上の年月日へ改訂していない。"
- "id": "xy-ch12-021"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "一天瑞氣，萬道祥光。仁風輕淡蕩，化日麗非常。千官環佩分前後，五衛旌旗列兩旁。執金瓜，擎斧鉞，雙雙對對；絳紗燭，御爐香，靄靄堂堂。龍飛鳳舞，鶚薦鷹揚。聖明天子正，忠義大臣良。介福千年過舜禹，昇平萬代賽堯湯。又見那曲柄傘，滾龍袍，輝光相射；玉連環，彩鳳扇，瑞靄飄揚。珠冠玉帶，紫綬金章。護駕軍千隊，扶輿將兩行。這皇帝沐浴虔誠尊敬佛，皈依善果喜拈香。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 164
    "line_end": 164
  "translation_ja": "空いっぱいにめでたい気、幾万筋もの吉祥の光。仁政の風は静かに広がり、教化の日はひときわ麗しい。千の官人の佩玉（はいぎょく）は前後に並び、五衛（ごえい）の旗は左右に列をなす。金の瓜形の儀仗（ぎじょう）を執り、大斧を掲げ、二人ずつ対をなす。赤い紗で覆う灯火、御炉の香は、煙をたなびかせ堂々と進む。竜は飛び鳳凰は舞い、みさごのごとき賢者は推挙され、鷹のごとく将士は雄飛する。聖明なる天子は正しく、忠義ある大臣は良い。千年の大福は舜（しゅん）や禹（う）をもしのぎ、万代の太平は堯（ぎょう）や湯（とう）をも上回る。さらに曲がった柄の傘、竜を縫い取った衣は、互いに輝きを照り返す。連なる玉環、彩鳳（さいほう）の扇には、めでたい霞がたなびく。真珠の冠と玉の帯、紫の組紐と金の印。御駕を護る軍勢は千隊、御車を支える将は二列。この皇帝は沐浴して心から仏を敬い、善き果報に帰依して、喜んで香を供える。"
  "translation_status": "reviewed"
- "id": "xy-ch12-022"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王大駕早到寺前，吩咐住了音樂響器。下了車輦，引著多官，拜佛拈香。三匝已畢，擡頭觀看，果然好座道場。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 166
    "line_end": 166
  "translation_ja": "太宗の御駕は早くも寺の前に着き、楽器を鳴らすのをやめるよう命じた。太宗は御車から下り、官人たちを率いて仏を拝み、香を供えた。三度めぐり終え、顔を上げて見れば、実に見事な道場であった。そこには、"
  "translation_status": "reviewed"
- "id": "xy-ch12-023"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "幢幡飄舞，寶蓋飛輝。幢幡飄舞，凝空道道彩霞搖；寶蓋飛輝，映日翩翩紅電徹。世尊金像貌臻臻，羅漢玉容威烈烈。瓶插仙花，爐焚檀降。瓶插仙花，錦樹輝輝漫寶剎；爐焚檀降，香雲靄靄透清霄。時新果品砌朱盤，奇樣糖酥堆彩案。高僧羅列誦真經，願拔孤魂離苦難。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 168
    "line_end": 168
  "translation_ja": "幢（どう）や幡（はた）が舞い、宝の天蓋が光を飛ばす。幢や幡が舞えば、空にとどまる幾筋もの彩雲が揺れ、宝の天蓋が光を飛ばせば、日を映す紅の稲妻がひらひらと貫く。世尊（せそん）の金像の顔は端正に整い、羅漢（らかん）の玉のような面立ちは威厳に満ちる。花瓶には仙花を挿し、香炉には白檀（びゃくだん）や降真香（こうしんこう）を焚く。花瓶の仙花は、錦の木々のように輝いて寺を満たし、香炉の香煙は、雲のようにたなびいて澄んだ空へ通う。旬の果物は朱塗りの盤に積まれ、珍しい形の飴や菓子は彩りある卓に重なる。高僧はずらりと並んで真の経を唱え、寄る辺ない魂を苦難から救い出すことを願う。"
  "translation_status": "reviewed"
- "id": "xy-ch12-024"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗文武俱各拈香，拜了佛祖金身，參了羅漢。又見那大闡都綱陳玄奘法師引眾僧羅拜唐王。禮畢，分班各安禪位。法師獻上濟孤榜文與太宗看。榜曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 169
    "line_end": 169
  "translation_ja": "太宗と文武の官人たちは、それぞれ香を供え、仏祖の金身（こんじん）を拝み、羅漢に礼をした。すると、大闡都綱（だいせんとこう）の陳玄奘法師が僧たちを率い、列をなして太宗を拝礼した。礼が終わると、一同は組ごとに分かれ、それぞれの禅座に落ち着いた。法師は孤魂を救うための告文を太宗に差し上げて見せた。そこにはこうあった。"
  "translation_status": "reviewed"
- "id": "xy-ch12-025"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "至德渺茫，禪宗寂滅。清淨靈通，周流三界。千變萬化，統攝陰陽。體用真常，無窮極矣。觀彼孤魂，深宜哀愍。此奉太宗聖命：選集諸僧，參禪講法。大開方便門庭，廣運慈悲舟楫，普濟苦海群生，脫免沉痾六趣。引歸真路，普玩鴻濛；動止無為，混成純素。仗此良因，邀賞清都絳闕；乘吾勝會，脫離地獄凡籠。早登極樂任逍遙，來往西方隨自在。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 171
    "line_end": 171
  "translation_ja": "至高の徳ははてしなく、禅の宗旨は寂滅にある。清浄にして霊妙に通じ、三界（さんがい）をあまねく流れる。千変万化して、陰陽（いんよう）を統べ、その本体も働きも真実不変、窮まることがない。かの寄る辺ない魂を見れば、深く憐れむべきである。ここに太宗の聖命を奉じ、諸僧を選び集め、禅に参じ法を講ずる。方便の門を大きく開き、慈悲の舟を広く運び、苦海の衆生をあまねく救い、深い病に沈む六趣（ろくしゅ）から脱け出させる。真実の道へ導き帰し、広大な元初の世界をともに味わい、動くにも静まるにも無為（むい）となり、混然として純粋な本性に帰す。この善き縁によって、清都絳闕（せいとこうけつ）へ招かれて遊び、わが勝れた法会に乗じて、地獄と俗界の籠を脱けよ。早く極楽（ごくらく）に登って心のままに遊び、西方を自在に行き来せよ。"
  "translation_status": "reviewed"
- "id": "xy-ch12-026"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 173
    "line_end": 173
  "translation_ja": "詩にいう。"
  "translation_status": "reviewed"
- "id": "xy-ch12-027"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一爐永壽香，幾卷超生籙。
    無邊妙法宣，無際天恩沐。
    冤孽盡消除，孤魂皆出獄。
    願保我邦家，清平萬咸福。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 175
    "line_end": 178
  "translation_ja": |-
    一炉に永寿の香を焚き、幾巻かの救済の経文を開く。
    限りない妙法を宣べ、際限ない天子の恩に浴する。
    恨みと罪業をことごとく除き、孤魂は皆、獄を出る。
    願わくはわが国を守り、清く平らかに、万人が福を受けんことを。
  "translation_status": "reviewed"
- "id": "xy-ch12-028"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太宗看了，滿心歡喜，對眾僧道：「汝等秉立丹衷，切休怠慢佛事。待後功成完備，各各福有所歸，朕當重賞，決不空勞。」那一千二百僧，一齊頓首稱謝。當日三齋已畢，唐王駕回。待七日正會，復請拈香。時天色將晚，各官俱退。怎見得好晚？你看那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 180
    "line_end": 180
  "translation_ja": "太宗は読み終えると、胸いっぱいに喜び、僧たちに言った。太宗「そなたたち、真心をしっかり保ち、決して仏事をおろそかにしてはならぬ。のちに功徳がすべて成就すれば、それぞれ福を受けるであろうし、朕も手厚く賞する。決して無駄な骨折りにはさせぬ。」千二百人の僧は、一斉に頭を下げて感謝した。その日、三度の斎食が終わると、太宗は宮中へ帰った。七日目の本法会には、あらためて香を供えに来てもらうこととなった。日も暮れかかり、官人たちは皆退出した。どれほど見事な夕べであったか。ご覧あれ。"
  "translation_status": "reviewed"
- "id": "xy-ch12-029"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    萬里長空淡落暉，歸鴉數點下棲遲。
    滿城燈火人煙靜，正是禪僧入定時。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 182
    "line_end": 183
  "translation_ja": |-
    万里にわたる大空に夕日が淡く残り、帰る烏は幾つかの点となってねぐらへ下りる。
    町いっぱいに灯がともり、人の気配は静まって、まさに禅僧が定（じょう）に入るとき。
  "translation_status": "reviewed"
- "id": "xy-ch12-030"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一宿晚景題過。次早，法師又昇坐，聚眾誦經不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 185
    "line_end": 185
  "translation_ja": "ひと夜の景色はここまでにしよう。翌朝、法師は再び高座に上り、一同を集めて経を唱えた。その話はいったん措く。"
  "translation_status": "reviewed"
- "id": "xy-ch12-031"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說南海普陀山觀世音菩薩，自領了如來佛旨，在長安城訪察取經的善人，日久未逢真實有德行者。忽聞得太宗宣揚善果，選舉高僧，開建大會。又見得法師壇主，乃是江流兒和尚，正是極樂中降來的佛子，又是他原引送投胎的長老。菩薩十分歡喜，就將佛賜的寶貝捧上長街，與木叉貨賣。你道他是何寶貝？有一件錦襴異寶袈裟、九環錫杖。還有那金緊禁三個箍兒，密密藏收，以俟後用。只將袈裟、錫杖出賣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 186
    "line_end": 186
  "translation_ja": "さて、南海普陀山（なんかいふださん）の観音菩薩（かんのんぼさつ）は、如来（にょらい）仏の命を受けて以来、長安で経を取りに行く善人を探していたが、長いこと、真に徳行のある者に巡り会えずにいた。そこへ、太宗が善果を説き広め、高僧を選び、大法会を開くと聞いた。その壇主たる法師を見れば、江流児（こうりゅうじ）という僧であり、まさに極楽から降りてきた仏の子、かつて自ら導いて生まれ変わらせた長老ではないか。観音菩薩は大いに喜び、仏から賜った宝を大通りへ持ち出し、恵岸行者（えがんぎょうじゃ）とともに売ることにした。その宝とは何か。錦襴（きんらん）の不思議な宝の袈裟一着と、九環錫杖（きゅうかんしゃくじょう）である。ほかに金（きん）・緊（きん）・禁（きん）という三つの輪もあったが、それは後に使うため、ひそかにしまっておいた。売りに出したのは袈裟と錫杖（しゃくじょう）だけだった。"
  "translation_status": "reviewed"
- "id": "xy-ch12-032"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長安城裡，有那選不中的愚僧，倒有幾貫村鈔。見菩薩變化個疥癩形容，身穿破衲，赤腳光頭，將袈裟捧定，豔豔生光，他上前問道：「那癩和尚，你的袈裟要賣多少價錢？」菩薩道：「袈裟價值五千兩，錫杖價值二千兩。」那愚僧笑道：「這兩個癩和尚是瘋子！是傻子！這兩件粗物，就賣得七千兩銀子？只是除非穿上身長生不老，就得成佛作祖，也值不得這許多！拿了去！賣不成！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 188
    "line_end": 188
  "translation_ja": "長安に、法会に選ばれなかった愚かな僧がいた。こんな僧でも、数貫ほどの銭は持っていた。観音菩薩は疥癬（かいせん）だらけの僧に化け、ぼろぼろの衲衣（のうえ）をまとい、裸足に頭もむき出しで、光り輝く袈裟を捧げ持っていた。愚僧はそれを見て近寄り、尋ねた。愚僧「おい、皮膚病の坊主。その袈裟はいくらで売るのだ。」観音菩薩「袈裟は五千両、錫杖は二千両です。」愚僧は笑った。愚僧「この二人の皮膚病坊主は気違いだ、馬鹿だ！　そんな粗末な物二つで、銀七千両も取ろうというのか。着るだけで不老長寿になり、仏や祖師にでもなれるならともかく、それでもそんな大金の値打ちはない。持っていけ、売れやしないぞ！」"
  "translation_status": "reviewed"
- "id": "xy-ch12-033"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那菩薩更不爭吵，與木叉往前又走。行勾多時，來到東華門前，正撞著宰相蕭瑀散朝而回，眾頭踏喝開街道。那菩薩公然不避，當街上拿著袈裟，徑迎著宰相。宰相勒馬觀看，見袈裟豔豔生光，著手下人問那賣袈裟的要價幾何，菩薩道：「袈裟要五千兩，錫杖要二千兩。」蕭瑀道：「有何好處，值這般高價？」菩薩道：「袈裟有好處，有不好處；有要錢處，有不要錢處。」蕭瑀道：「何為好？何為不好？」菩薩道：「著了我袈裟，不入沉淪，不墮地獄，不遭惡毒之難，不遇虎狼之災，便是好處；若貪淫樂禍的愚僧，不齋不戒的和尚，毀經謗佛的凡夫，難見我袈裟之面，這便是不好處。」又問道：「何為要錢，不要錢？」菩薩道：「不遵佛法，不敬三寶，強買袈裟、錫杖，定要賣他七千兩，這便是要錢；若敬重三寶，見善隨喜，皈依我佛，承受得起，我將袈裟、錫杖情願送他，與我結個善緣，這便是不要錢。」蕭瑀聞言，倍添春色，知他是個好人。即便下馬，與菩薩以禮相見，口稱：「大法長老，恕我蕭瑀之罪。我大唐皇帝十分好善，滿朝的文武無不奉行。即今起建水陸大會，這袈裟正好與大都闡陳玄奘法師穿用。我和你入朝見駕去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 189
    "line_end": 189
  "translation_ja": "観音菩薩は言い争うこともなく、恵岸行者とさらに先へ進んだ。長いこと歩いて東華門（とうかもん）の前へ来ると、ちょうど朝廷から帰る宰相の蕭瑀に出会った。先払いの者たちが、道を空けよと叫んでいた。観音菩薩は堂々と避けもせず、路上で袈裟を持ち、まっすぐ宰相に向かって進んだ。蕭瑀は馬を止めて眺め、袈裟が鮮やかに輝くのを見ると、部下に値段を尋ねさせた。観音菩薩「袈裟は五千両、錫杖は二千両です。」蕭瑀「どのようなよいところがあって、それほど高いのですか。」観音菩薩「袈裟には、よいところもあれば、よくないところもあります。また、お金を頂く場合もあれば、頂かない場合もあります。」蕭瑀「よいところとは何で、よくないところとは何ですか。」観音菩薩「この袈裟を着れば、苦界へ沈まず、地獄にも落ちず、毒害の難に遭わず、虎狼の災いにも出会いません。これがよいところです。ところが、淫欲をむさぼり人の災いを喜ぶ愚僧、精進も戒律も守らぬ和尚、経をそしり仏を誹る凡夫には、この袈裟を見ることさえ難しい。それがよくないところです。」蕭瑀はさらに尋ねた。蕭瑀「お金を取る場合と取らない場合とは、どういうことですか。」観音菩薩「仏法に従わず、三宝（さんぼう）を敬わないのに、この袈裟と錫杖を無理に買おうとする者には、必ず七千両で売ります。これがお金を取る場合です。三宝を敬い、善を見てともに喜び、わが仏に帰依して、この品を受けるに堪える者には、袈裟も錫杖も喜んで贈り、私と善い縁を結んでもらいます。これがお金を取らない場合です。」蕭瑀は聞くほどに顔をほころばせ、善い人だと悟った。すぐに馬を下り、観音菩薩に礼を尽くして挨拶した。蕭瑀「大いなる法を修める長老、この蕭瑀の無礼をお許しください。わが大唐（だいとう）の皇帝はたいへん善を好まれ、朝廷の文武の官人も、従わぬ者はありません。今ちょうど水陸大会を営んでおり、この袈裟は大都闡（だいとせん）の陳玄奘法師に着ていただくのにふさわしい。ご一緒に宮中へ参り、陛下にお目にかかりましょう。」"
  "translation_status": "reviewed"
- "id": "xy-ch12-034"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "菩薩欣然從之，拽轉步，徑進東華門裡。黃門官轉奏，蒙旨宣至寶殿。見蕭瑀引著兩個疥癩僧人，立於階下，唐王問曰：「蕭瑀來奏何事？」蕭瑀俯伏階前道：「臣出了東華門前，偶遇二僧，乃賣袈裟與錫杖者。臣思法師玄奘可著此服，故領僧人啟見。」太宗大喜，便問那袈裟價值幾何。菩薩與木叉侍立階下，更不行禮，因問袈裟之價，答道：「袈裟五千兩，錫杖二千兩。」太宗道：「那袈裟有何好處，就值許多？」菩薩道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 190
    "line_end": 190
  "translation_ja": "観音菩薩は喜んで従い、向きを変えて、そのまま東華門へ入った。黄門官（こうもんかん）が取り次ぎ、勅旨によって宝殿へ召された。蕭瑀が二人の皮膚病の僧を連れて階下に立つのを見て、太宗は尋ねた。太宗「蕭瑀、何を奏上しに来たのだ。」蕭瑀は階段の前にひれ伏した。蕭瑀「臣が東華門を出ましたところ、偶然二人の僧に出会いました。袈裟と錫杖を売る者たちです。玄奘法師がお召しになるのによいと思い、僧を連れて拝謁を願い出た次第でございます。」太宗は大いに喜び、袈裟の値段を尋ねた。観音菩薩と恵岸行者は階下に立ったまま、礼もしなかった。袈裟の値を問われ、観音菩薩が答えた。観音菩薩「袈裟は五千両、錫杖は二千両です。」太宗「その袈裟にはどのようなよさがあって、それほどの値打ちがあるのだ。」観音菩薩は答えた。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『菩薩與木叉侍立…答道』は観音が答え、木叉が同行する文脈と読んでラベルを観音菩薩にした。文法的には複数の主語とも取れるので、恵岸の単独発言を創作せず留保する。"
- "id": "xy-ch12-035"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": "這袈裟，龍披一縷，免大鵬吞噬之災；鶴掛一絲，得超凡入聖之妙。但坐處，有萬神朝禮；凡舉動，有七佛隨身。這袈裟，是冰蠶造練抽絲，巧匠翻騰為線，仙娥織就，神女機成，方方簇幅繡花縫。片片相幫堆錦簆。玲瓏散碎鬥妝花，色亮飄光噴寶豔。穿上滿身紅霧遶，脫來一段彩雲飛。三天門外透元光，五岳山前生寶氣。重重嵌就西番蓮，灼灼懸珠星斗象。四角上有夜明珠，攢頂間一顆祖母綠。雖無全照原本體，也有生光八寶攢。這袈裟，閑時折疊，遇聖才穿。閑時折疊，千層包裹透虹霓；遇聖才穿，驚動諸天神鬼怕。上邊有如意珠、摩尼珠、辟塵珠、定風珠；又有那紅瑪瑙、紫珊瑚、夜明珠、舍利子。偷月沁白，與日爭紅。條條仙氣盈空，朵朵祥光捧聖。條條仙氣盈空，照徹了天關；朵朵祥光捧聖，影遍了世界。照山川，驚虎豹；影海島，動魚龍。沿邊兩道銷金鎖，叩領連環白玉琮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 191
    "line_end": 191
  "translation_ja": "観音菩薩「この袈裟は、竜が一筋まとえば大鵬（たいほう）に呑み食われる災いを免れ、鶴が一糸掛ければ凡を超えて聖に入る妙を得ます。座れば万の神が拝礼し、動けば七仏（しちぶつ）が身に付き添います。この袈裟は、氷蚕（ひょうさん）が絹を作って糸を吐き、巧みな職人が撚り合わせ、仙女が織り、神女が機で織り成したもの。四角い裂を集め、花の刺繡で縫い合わせ、一枚一枚寄せては錦を重ねています。細やかに透き通る飾りが花模様の美を競い、色は明るく光を放ち、宝の艶を噴き出します。着れば全身に紅の霞がめぐり、脱げば一片の彩雲が飛びます。三天（さんてん）の門の外へ元の光が通い、五岳（ごがく）の山の前には宝気が生まれます。何重にも西番蓮（せいばんれん）をはめ込み、きらきら垂れる珠は星の姿。四隅に夜明珠（やめいしゅ）を置き、頂の集まるところには一粒のエメラルドがあります。本来の姿を余すところなく映すわけではなくとも、光を生む八宝（はっぽう）が集まっています。この袈裟は、ふだんは畳み、聖なる方に会うときにこそ着るもの。ふだん畳んで千重に包んでも虹の光が透け、聖なる方に会うときに着れば、諸天を驚かせ、神鬼を恐れさせます。上には如意珠（にょいじゅ）、摩尼珠（まにしゅ）、辟塵珠（へきじんじゅ）、定風珠（ていふうじゅ）があり、さらに紅瑪瑙（べにめのう）、紫珊瑚（むらさきさんご）、夜明珠、舎利子（しゃりし）があります。月の白さを取り込み、太陽と紅を競います。幾筋もの仙気が空を満たし、幾輪もの祥光が聖者を捧げます。空を満たす仙気は天の関を照らし通し、聖者を捧げる祥光は世界じゅうを照らします。山川を照らして虎豹を驚かせ、海の島々を照らして魚竜を動かします。縁には二筋の金を施した鎖、襟には環を連ねる白玉の琮（そう）が掛かっています。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『雖無全照原本體』の具体的な機能・指示対象は不明瞭で、『本来の姿を余すところなく映すわけではなくとも』と暫定訳した。『堆錦簆』は錦を重ねる描写として訳したが、簆の細部は未確定。『五岳』はこの箇所では山々を指し、既存辞書の五岳の神々とする人物項目をそのまま流用しない。"

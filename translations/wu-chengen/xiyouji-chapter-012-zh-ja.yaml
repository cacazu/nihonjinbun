    "message_ja": "玉英宮主の肉体に李翠蓮の魂が入った場面。地の文・話者名は原文の見た目の呼称『玉英宮主』にそろえ、本人の名乗りと劉全の戸惑いを保持した。『三宮皇后』の具体的な人数・制度は特定しない。"
- "id": "xy-ch12-004"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐王當殿，忽有當駕官奏道：「萬歲，今有進瓜果人劉全還魂，在朝門外等旨。」唐王大驚，急傳旨，將劉全召進，俯伏丹墀。太宗問道：「進瓜果之事何如？」劉全道：「臣頂瓜果，徑至鬼門關，引上森羅殿，見了那十代閻君，將瓜果奉上，備言我王慇懃致謝之意。閻君甚喜，多多拜上我王道：『真是個有信有德的太宗皇帝！』」唐王道：「你在陰司見些甚麼來？」劉全道：「臣不曾遠行，沒見甚的，只聞得閻王問臣鄉貫、姓名。臣將棄家捨子，因妻縊死，願來進瓜之事，說了一遍。他急差鬼使，引過我妻，就在森羅殿下相會。一壁廂又檢看死生文簿，說我夫妻都有登仙之壽，便差鬼使送回。臣在前走，我妻後行，幸得還魂。但不知妻投何所。」唐王驚問道：「那閻王可曾說你妻甚麼？」劉全道：「閻王不曾說甚麼，只聽得鬼使說：『李翠蓮歸陰日久，屍首無存。』閻王道：『唐御妹李玉英今該促死，教翠蓮即借玉英屍還魂去罷。』臣不知『唐御妹』是甚地方，家居何處，我還未曾得去找尋哩。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"

  "translation_ja": "宮中の侍女たちは、身分の上下を問わず、玉英宮主が転んで死んだのを見ると、急いで金鑾殿（きんらんでん）へ走り、三宮（さんぐう）の皇后に報告した。侍女たち「宮主さまが、転んでお亡くなりになりました！」皇后は仰天し、すぐ太宗（たいそう）へ知らせた。太宗は聞くと、うなずいて嘆いた。太宗「こういうことは、本当にあるものなのだ。朕は十王（じゅうおう）に『年寄りも子供も無事か』と尋ねた。すると『皆ご無事ですが、御妹（ぎょまい）の命が短いのではと存じます』と答えた。その言葉が当たったのだ。」宮中の者が皆悲しんで花陰へ集まり、見てみると、玉英宮主にはかすかな息があった。太宗「泣くな、泣くな。驚かせてはならぬ。」太宗は進み寄り、自らの手で頭を支えて起こし、呼びかけた。太宗「妹よ、目を覚ませ、目を覚ませ。」玉英宮主は突然身を返し、叫んだ。玉英宮主「あなた、ゆっくり行って、私を待ってちょうだい！」太宗「妹よ、ここにいるのは私たちだ。」玉英宮主は顔を上げ、目を開いて見回した。玉英宮主「あなたは誰です。どうして私を引っ張るのですか。」太宗「お前の兄である皇帝と、その妃だ。」玉英宮主「私に皇帝の兄や皇后の義姉など、どこからできるのです。実家の姓は李（り）、幼いころからの名は李翠蓮（りすいれん）、夫は姓を劉（りゅう）、名を全（ぜん）といい、二人とも均州（きんしゅう）の者です。三か月前、門口で金のかんざしを抜いてお坊さまに施しました。それを夫が、勝手に奥の門から出て、女の守るべき道に背いたと責め、私を叱ったのです。私は胸が詰まるほど腹を立て、白い綾の帯を梁に掛けて首をくくりました。残した男の子と女の子は、昼も夜も泣いていました。このたび夫が唐王（とうおう）の勅使に選ばれ、冥府へ瓜や果物を届けに来たので、閻王（えんおう）さまがお憐れみくださり、私たち二人を帰してくださいました。夫が先を歩き、私は遅れて追いつけず、つまずいて転んだのです。あなたたちは無礼ですよ。名前も知らないのに、どうして私を引っ張るのです！」太宗はこれを聞き、宮中の者たちに言った。太宗「妹は転んで気を失い、うわごとを言っているのだろう。」そこで太医院（たいいいん）に煎じ薬を出すよう命じ、玉英宮主を支えて宮中へ入らせた。"
  "translation_status": "reviewed"

  "origin": "source"
  "source_text": "唐王聞奏，滿心歡喜，當對多官道：「朕別閻君，曾問宮中之事。他言：『老幼俱安，但恐御妹壽促。』卻才御妹玉英花陰下跌死，朕急扶看，須臾甦醒，口叫：『丈夫慢行，等我一等。』朕只道是他跌昏了胡言。又問他詳細，他說的話，與劉全一般。」魏徵奏道：「御妹偶爾壽促，少甦醒即說此言，此是劉全妻借屍還魂之事。此事也有，可請宮主出來，看他有甚話說。」唐王道：「朕才命太醫院去進藥，不知何如。」便教妃嬪入宮去請。那宮主在裡面亂嚷道：「我吃甚麼藥？這裡那是我家？我家是清涼瓦屋，不像這個害黃病的房子，花狸狐哨的門扇，放我出去！放我出去！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 124
    "line_end": 124
  "translation_ja": "太宗はこの奏上を聞くと、喜びで胸がいっぱいになり、居並ぶ官人たちに語った。太宗「朕が十王に別れを告げるとき、宮中のことを尋ねたところ、『年寄りも子供も皆ご無事ですが、御妹の命が短いのではと存じます』と言った。つい先ほど、妹の玉英が花陰で転んで死に、朕が急いで抱き起こして見ていると、ほどなく息を吹き返し、『あなた、ゆっくり行って、私を待ってちょうだい』と叫んだ。朕は、転んで気を失い、うわごとを言っているだけだと思っていた。さらに詳しく尋ねると、劉全と同じ話をしたのだ。」魏徴（ぎちょう）は奏上した。魏徴「御妹がたまたま寿命を終え、しばらくして生き返ると、ただちにこのようなことを申されたのであれば、それは劉全の妻が亡骸を借りて還魂したのでございます。こうしたことはあり得ます。宮主をお呼びになり、何と申されるかお聞きになってはいかがでしょう。」太宗「たった今、太医院に薬を届けさせたところで、その後はどうなったか分からぬ。」そこで妃嬪たちを宮中へ迎えに行かせた。玉英宮主は奥で騒ぎ立てていた。玉英宮主「どうして薬など飲むのです。ここが私の家なものですか。私の家は涼しい瓦ぶきで、こんな黄疸にかかったような建物でも、けばけばしい扉でもありません。外へ出して、外へ出して！」"
  "translation_status": "reviewed"
- "id": "xy-ch12-006"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正嚷處，只見四五個女官、兩三個太監扶著他，直至殿上。唐王道：「你可認得你丈夫麼？」玉英道：「說那裡話，我兩個從小兒的結髮夫妻，與他生男育女，怎的不認得？」唐王叫內官攙他下去。那宮主下了寶殿，直至白玉階前，見了劉全，一把扯住道：「丈夫，你往那裡去，就不等我一等？我跌了一跌，被那些沒道理的人圍住我嚷，這是怎的說？」那劉全聽他說的話是妻之言，觀其人非妻之面，不敢相認。唐王道：「這正是山崩地裂有人見，捉生替死卻難逢。」好一個有道的君王，即將御妹的妝奩、衣物、首飾，盡賞賜了劉全，就如陪嫁一般。又賜與他永免差徭的御旨，著他帶領御妹回去。他夫妻兩個便在階前謝了恩，歡歡喜喜還鄉。有詩為證："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 125
    "line_end": 125
  "translation_ja": "そう叫んでいる玉英宮主を、四、五人の女官と二、三人の宦官が支え、殿上へ連れてきた。太宗「そなた、自分の夫なら見分けられるか。」玉英宮主「何をおっしゃるのです。若いころから結ばれた夫婦で、男の子も女の子ももうけたのですよ。分からないはずがありません。」太宗は内官に命じ、手を貸して下へ行かせた。玉英宮主は宝殿を下り、白玉の階段の前まで来ると、劉全を見つけて、いきなりその手をつかんだ。玉英宮主「あなた、どこへ行くの。どうして少しも待ってくれないのです。私が転んだら、あの訳の分からない人たちに囲まれて、わいわい騒がれたのですよ。いったいどういうことです！」劉全には、その言葉は妻のものと聞こえたが、姿を見ると妻の顔ではなく、妻だと認める勇気がなかった。太宗「まことに、山が崩れ大地が裂けるのは見た者もあろうが、生者を捕らえて死者に代わらせるのには、めったに出会えぬものだ。」何と道理をわきまえた君主であろう。太宗は妹の嫁入り道具、衣服、装身具をすべて劉全に与え、嫁入り支度を持たせるのと同じようにした。そのうえ、劉全の労役を永久に免ずる勅旨を賜り、妹を連れて帰らせた。夫妻は階段の前で恩を謝し、喜び勇んで故郷へ帰った。これを証す詩がある。"
  "translation_status": "reviewed"
- "id": "xy-ch12-007"
  "section_id": "chapter-12"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    人生人死是前緣，短短長長各有年。
    劉全進瓜回陽世，借屍還魂李翠蓮。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 127
    "line_end": 128
  "translation_ja": |-
    人の生死は前世の縁、命の長短にはそれぞれ定めがある。
    劉全は瓜を献じてこの世へ戻り、李翠蓮は亡骸を借りて魂を返した。

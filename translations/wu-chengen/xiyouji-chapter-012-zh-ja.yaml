    "line_start": 123
    "line_end": 123
  "translation_ja": "太宗が殿上にいると、当駕官（とうがかん）が奏上した。当駕官「陛下、瓜や果物を届けた劉全が生き返り、朝門の外で仰せを待っております。」太宗は大いに驚き、急いで劉全を召し入れた。劉全は丹塗りの階下にひれ伏した。太宗「瓜や果物を届ける件は、どうであった。」劉全「臣は瓜や果物を頭に載せ、まっすぐ鬼門関（きもんかん）へ参りました。森羅殿（しんらでん）へ案内され、十王にお目にかかって品を献じ、陛下の懇ろなお礼の心を詳しく申し上げました。十王は大そうお喜びになり、陛下に幾重にもよろしくとのことで、『実に信義と徳をお持ちの太宗皇帝（たいそうこうてい）である』と申されました。」太宗「冥府では何を見てきた。」劉全「臣は遠くまで参りませんでしたので、これといって見てはおりません。ただ閻王さまに出身地と姓名を尋ねられましたので、妻が首をつって死に、家も子供も捨てて瓜を届けに志願した事情を、ひととおり申し上げました。すると、すぐに鬼使を遣わして妻を連れてこられ、森羅殿の下で再会できました。そのかたわら、生死の帳簿を調べられ、私ども夫婦にはともに仙人になるまでの寿命があるとおっしゃって、鬼使に送り返させてくださったのです。臣が前を歩き、妻は後ろを歩いて、幸い臣は生き返りました。ただ、妻がどこへ行ったのか分かりません。」太宗は驚いて尋ねた。太宗「閻王は、そなたの妻について何か言わなかったか。」劉全「閻王さまは何も。ただ鬼使が『李翠蓮が冥府へ来てからは久しく、亡骸はもう残っていません』と申すのが聞こえました。すると閻王さまが『唐（とう）の御妹、李玉英（りぎょくえい）は、今こそ命を終える定めだ。翠蓮に玉英の亡骸を借りて生き返らせよ』とおっしゃいました。臣には『唐の御妹』というのがどこの土地で、家がどちらにあるのか分からず、まだ捜しに行けておりません。」"
  "translation_status": "reviewed"
- "id": "xy-ch12-005"
  "section_id": "chapter-12"

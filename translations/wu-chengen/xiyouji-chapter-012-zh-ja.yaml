  "known_gaps":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-001"
    "description_ja": "回題の『一作「玄奘秉誠建大會」』『一作「象」』は底本に付された異題・異字注。原文内に保持し、訳文でも角括弧で示した。原著者自身の注か電子翻刻者による注かは未確定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-003"
    "description_ja": "玉英宮主の肉体に李翠蓮の魂が入った場面。地の文・話者名は原文の見た目の呼称『玉英宮主』にそろえ、本人の名乗りと劉全の戸惑いを保持した。『三宮皇后』の具体的な人数・制度は特定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-009"
    "description_ja": "相良の妻『張氏』は第九回の陳光蕊の母『張氏』と別人。同表記を理由に既存の人物辞書項目へ同一人物として統合しない。夫妻を主語とする拒絶の発言は『相良夫妻』とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-010"
    "description_ja": "原文の『胡敬德』『敬德』はこの場面の尉遲恭を指す呼称として、既存ガイドに従い尉遅恭とした。大相国寺の創建をこの挿話に結び付ける説明は物語内の由来譚で、史実の確認とは別。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-013"
    "description_ja": "傅奕の『以繼禮悖所親』は語句のつながりに不審があり、礼と親への背反を責める趣旨で暫定訳。原字は保持。『果正佛空』『大慧禪師有贊幽遠』も仏教擁護の意味に沿って暫定訳し、異本校訂は未実施。周武帝、五祖、達摩、僧をそしる者の断臂などの記述は物語の叙述として保持し、史実と保証しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-015"
    "description_ja": "養育した僧を底本は『遷安和尚』とする。第九回の『法明和尚』へ無断で置換せず、遷安和尚と訳した。『凌煙閣』での顕彰も本文どおりで、前後の史実や年代へ整合させていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-019"
    "description_ja": "『金蟬脫殼化西涵』の『西涵』は語義未確定のため訳文にも西涵を保持。『前後三』も何を三つに数えるか確定できず、『前後の三つ』とした。三世等へ無断で補っていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-020"
    "description_ja": "底本の『貞觀十三年、己巳、九月甲戌、初三日、癸卯』はそのまま訳した。年号と干支の日付整合は確認できておらず、歴史上の年月日へ改訂していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-034"
    "description_ja": "『菩薩與木叉侍立…答道』は観音が答え、木叉が同行する文脈と読んでラベルを観音菩薩にした。文法的には複数の主語とも取れるので、恵岸の単独発言を創作せず留保する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-035"
    "description_ja": "『雖無全照原本體』の具体的な機能・指示対象は不明瞭で、『本来の姿を余すところなく映すわけではなくとも』と暫定訳した。『堆錦簆』は錦を重ねる描写として訳したが、簆の細部は未確定。『五岳』はこの箇所では山々を指し、既存辞書の五岳の神々とする人物項目をそのまま流用しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-039"
    "description_ja": "『摩呵五祖』『羅卜』の表記を保持した。摩訶・目連等への黙示の訂正はしていない。羅卜は母を地獄から救う説話の人物として訳した。『入手厭看青骨瘦』は痩せた青い骨のような杖を飽くまで眺めると暫定解釈したが、厭看の語義には留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-040"
    "description_ja": "『菩薩聞言，與木叉合掌…躬身上啟道』の発言主体は文頭の観音菩薩と読む。共同行動と共同発言を同一視せず、恵岸行者の独立した台詞を増やしていない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-047"
    "description_ja": "『以一七繼七七，可矣了』は一回の七日と七七四十九日の法会の関係をいうが、具体的な省略・代替の意図は未確定。『一つの七日をもって七七の法会につなぐなら、もうよいでしょう』と暫定訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-050"
    "description_ja": "底本の『大典玄奘』を『大闡』へ直さず『大典たる玄奘』とした。『出生』は『釋氏要覽』（大正蔵54冊2127、國立中央大學所蔵PDF https://www.ss.ncu.edu.tw/~calin/scripture/t54/T54n2127.pdf ）の出生項に、食を取り分け鬼神等へ施す語義があるため、『食の施し』とした。詩句全体の細かな構文には留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-053"
    "description_ja": "小乗では死者を天へ救い上げられず、大乗なら可能という説明は観音の発言を訳したもので、現代仏教全体への評価・教義的断定ではない。経名三点は底本の表記を日本字体で保持し、実在の経典への同定は未実施。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-056"
    "description_ja": "『促瑤海』は瑶海を駆ける、『撒大惡』は大悪を散らすと文脈に沿って暫定訳した。白鸚哥の黄色い毛・赤い嘴という色彩は原文どおりで、生物学的な整合を取らない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-057"
    "description_ja": "呉道子が後に凌煙閣の功臣像を描くという括弧書きは底本内の説明として訳した。一般に知られる凌煙閣の画家・呉道子の生没年代と整合するかは別問題で、原文を訂正していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "segment_ids":
    - "xy-ch12-061"
    "description_ja": "『人尊吉星』の人尊は出行の暦注として保持。『素酒』を無根拠にノンアルコールと断定せず原語を残した。三蔵の号はこの段落内で正式に授けられ、直後から地の文・話者名を三蔵へ切り替えた。『三蔵』には経の三区分と人物の号の二義があるため、同名の辞書項目を意味の違いを無視して統合しない。 本文の欠落ではなく解釈・校訂上の留保。"

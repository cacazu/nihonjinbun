- "id": "xy-ch12-002"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說鬼使同劉全夫妻二人出了陰司，那陰風遶遶，徑到了長安大國，將劉全的魂靈推入金亭館裡，將翠蓮的靈魂帶進皇宮內院。只見那玉英宮主正在花陰下，徐步綠苔而行，被鬼使撲個滿懷，推倒在地，活捉了他魂，卻將翠蓮的魂靈推入玉英身內。鬼使回轉陰司不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて、鬼使は劉全（りゅうぜん）夫妻とともに冥府（めいふ）を出ると、陰気な風の渦を巻き起こし、まっすぐ大国の都、長安（ちょうあん）へ来た。劉全の魂を金亭館（きんていかん）の中へ押し戻し、翠蓮（すいれん）の魂を皇宮の奥へ連れていった。ちょうど玉英宮主（ぎょくえいきゅうしゅ）が花陰で、緑の苔の上をゆっくり歩いていた。鬼使はその胸へまともにぶつかり、地面に倒し、生きたまま魂を捕らえると、代わりに翠蓮の魂を玉英（ぎょくえい）の体へ押し込んだ。鬼使が冥府へ戻ったことは、ひとまず措く。"
  "translation_status": "reviewed"
- "id": "xy-ch12-003"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說宮院中的大小侍婢見玉英跌死，急走金鑾殿，報與三宮皇后道：「宮主娘娘跌死也。」皇后大驚，隨報太宗。太宗聞言，點頭嘆曰：「此事信有之也。朕曾問十代閻君：『老幼安乎？』他道：『俱安，但恐御妹壽促。』果中其言。」合宮人都來悲切，盡到花陰下看時，只見那宮主微微有氣。唐王道：「莫哭！莫哭！休驚了他。」遂上前將御手扶起頭來，叫道：「御妹甦醒甦醒。」那宮主忽的翻身，叫：「丈夫慢行，等我一等。」太宗道：「御妹，是我等在此。」宮主擡頭睜眼觀看道：「你是誰人，敢來扯我？」太宗道：「是你皇兄、皇嫂。」宮主道：「我那裡得個甚麼皇兄、皇嫂？我娘家姓李，我的乳名喚做李翠蓮，我丈夫姓劉名全，兩口兒都是均州人氏。因為我三個月前拔金釵在門首齋僧，我丈夫怪我擅出內門，不遵婦道，罵了我幾句，是我氣塞胸堂，將白綾帶懸梁縊死，撇下一雙兒女，晝夜悲啼。今因我丈夫被唐王欽差，赴陰司進瓜果，閻王憐憫，放我夫妻回來。他在前走，因我來遲，趕不上他，我絆了一跌。你等無禮！不知姓名，怎敢扯我？」太宗聞言，與眾宮人道：「想是御妹跌昏了，胡說哩。」傳旨教太醫院進湯藥，將玉英扶入宮中。"

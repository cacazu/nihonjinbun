  "origin": "source"
  "source_text": "他兩個辭了君王，徑來均州城裡，見舊家業、兒女俱好，兩口兒宣揚善果不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 130
    "line_end": 130
  "translation_ja": "二人は君主に別れを告げ、まっすぐ均州の町へ帰った。昔の家業も子供たちも皆無事で、夫妻は善行の報いを世に語り広めた。この話はここまでとする。"
  "translation_status": "reviewed"
- "id": "xy-ch12-009"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那尉遲恭將金銀一庫，上河南開封府訪看，相良原來賣水為活，同妻張氏在門首販賣烏盆瓦器營生，但賺得些錢兒，只以盤纏為足，其多少齋僧布施，買金銀紙錠，記庫焚燒，故有此善果臻身。陽世間是一條好善的窮漢，那世裡卻是個積玉堆金的長者。尉遲恭將金銀送上他門，諕得那相公、相婆魂飛魄散。又兼有本府官員，茅舍外車馬駢集。那老兩口子如痴如啞，跪在地下，只是磕頭禮拜。尉遲恭道：「老人家請起。我雖是個欽差官，卻齎著我王的金銀送來還你。」他戰兢兢的答道：「小的沒有甚麼金銀放債，如何敢受這不明之財？」尉遲恭道：「我也訪得你是個窮漢，只是你齋僧布施，儘其所用，就買辦金銀紙錠，燒記陰司，陰司裡有你積下的錢鈔。是我太宗皇帝死去三日，還魂復生，曾在那陰司裡借了你一庫金銀，今此照數送還與你。你可一一收下，等我好去回旨。」那相良兩口兒只是朝天禮拜，那裡敢受。道：「小的若受了這些金銀，就死得快了。雖然是燒紙記庫，此乃冥冥之事；況萬歲爺爺那世裡借了金銀，有何憑據？我決不敢受。」尉遲恭道：「陛下說，借你的東西，有崔判官作保可證。你收下罷。」相良道：「就死也是不敢受的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch12-1500623"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第012回&oldid=1500623"
    "line_start": 131
    "line_end": 131
  "translation_ja": "さて、尉遅恭（うっちきょう）は蔵一つ分の金銀を持ち、河南（かなん）の開封府（かいほうふ）へ出向いて尋ねた。相良（しょうりょう）は水を売って暮らしを立て、妻の張氏（ちょうし）とともに家の前で黒い盆や素焼きの器を売っていた。いくらか稼いでも、自分たちには生活費だけあればよいとし、残りは多かろうと少なかろうと僧への供養や施しに使い、紙で作った金銀の延べ棒を買っては、あの世の蔵に記帳してもらうよう焼いていた。それで、このような善行の報いが身に及んだのである。この世では善行を好む一人の貧乏人だが、あの世では玉を積み金を山にした富豪だった。尉遅恭が家の門まで金銀を届けると、相良じいさんとその婆さんは、魂も消し飛ぶほど驚いた。そのうえ開封府の役人まで来て、草ぶきの家の外には車馬がびっしり並んだ。老夫婦はぼんやり口も利けず、地面に膝をついて、ひたすら頭を打ちつけて拝むばかりだった。尉遅恭「ご老人、どうぞお立ちください。私は勅使ではありますが、陛下の金銀を持って、あなたにお返しに来たのです。」相良は震えながら答えた。相良「私には貸し付けるような金銀などございません。どうして訳の分からぬお金を頂けましょう。」尉遅恭「あなたが貧しい方であることは、私も調べました。ただ、僧を供養し、施しをされ、使えるだけの金で紙の金銀を買い、焼いて冥府の帳簿に記されたので、あの世にはあなたの蓄えがあるのです。わが太宗皇帝は亡くなられて三日後、魂を戻して生き返られましたが、冥府であなたの金銀を蔵一つ分、お借りになりました。そこで今、その数どおり返しに来たのです。どうぞすべて受け取って、私が復命できるようにしてください。」相良夫妻は、ひたすら天に向かって拝むばかりで、とても受け取ろうとしなかった。相良夫妻「私どもがこんな金銀を頂けば、早死にしてしまいます。紙を焼いて蔵に記帳していただいたとはいえ、あの世の見えないことです。それに、陛下があの世で金銀をお借りになったなど、何の証拠がありましょう。決して頂けません。」尉遅恭「陛下のお話では、借りる際には崔判官（さいはんがん）が保証人となり、証人にもなれるそうです。どうぞお納めください。」相良「死んでも受け取ることはできません。」"

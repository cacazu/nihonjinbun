  "source_text": "原來人得仙體，出神變化無方。不知這猴王自從了道之後，身上有八萬四千毛羽，根根能變，應物隨心。那些小猴眼乖會跳，刀來砍不著，槍去不能傷。你看他前踴後躍，鑽上去，把個魔王圍繞，抱的抱，扯的扯，鑽襠的鑽襠，扳腳的扳腳，踢打撏毛，摳眼睛，捻鼻子，擡鼓弄，直打做一個攢盤。這悟空才去奪得他的刀來，分開小猴，照頂門一下，砍為兩段。領眾殺進洞中，將那大小妖精盡皆剿滅。卻把毫毛一抖，收上身來，又見那收不上身者，卻是那魔王在水簾洞擒去的小猴。悟空道：「汝等何為到此？」約有三五十個，都含淚道：「我等因大王修仙去後，這兩年被他爭吵，把我們都攝將來。那不是我們洞中的家火？石盆、石碗都被這廝拿來也。」悟空道：「既是我們的家火，你們都搬出外去。」隨即洞裡放起火來，把那水臟洞燒得枯乾，盡歸了一體。對眾道：「汝等跟我回去。」眾猴道：「大王，我們來時，只聽得耳邊風響，虛飄飄到於此地，更不識路徑，今怎得回鄉？」悟空道：「這是他弄的個術法兒，有何難也？我如今一竅通，百竅通，我也會弄。你們都合了眼，休怕。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 36
  "translation_ja": |-
    そもそも仙人の体を得た者は、精神を自在に働かせ、思いのままに姿を変えられる。孫悟空は道を得て以来、体に生えた八万四千本もの毛が一本一本変身する力を持ち、思いどおりに働いた。小猿たちはすばしこく、跳び回って刀も槍も当たらない。前から後ろから混世魔王に飛びかかり、抱きつく者、引っ張る者、股の下をくぐる者、足をつかむ者、蹴る者、毛をむしる者、目をほじる者、鼻をひねる者、持ち上げてからかう者と、入り乱れて混世魔王を散々に痛めつけた。
    その隙に孫悟空は混世魔王の刀を奪い、小猿を散らせて、頭のてっぺんへ一撃を振り下ろした。混世魔王の体は真っ二つになった。孫悟空は小猿たちを率いて洞内になだれ込み、大きな妖怪も小さな妖怪もことごとく倒した。
    それから体毛をひと振りして分身を元に戻したところ、戻らない小猿が何十匹も残っていた。混世魔王が水簾洞からさらってきた猿たちだった。孫悟空が尋ねた。
    孫悟空「お前たちはなぜここにいる」
    三十匹から五十匹ほどいた猿たちは涙を浮かべて答えた。
    さらわれた猿たち「大王が仙人の修行へ出かけられてから、この二年の間に、あいつに襲われて連れてこられたのです。ほら、あれは私たちの洞窟の家財です。石のたらいも石の茶碗も奪ってきています」
    孫悟空「俺たちの道具なら、すべて外へ運び出せ」
    孫悟空は洞窟に火を放ち、水臓洞の隅々まで焼き尽くして、妖怪の住み家を跡形もなくした。
    孫悟空「さあ、俺について帰れ」
    ところが猿たちは言った。
    さらわれた猿たち「大王、連れてこられたときは、耳元で風が鳴ったと思うと体がふわふわ浮き、この場所へ着いていました。道を知りません。どう帰ればよいのでしょう」
    孫悟空「魔王のまじないだろう。何の難しいことがある。今の俺には、その術も使える。皆、目を閉じろ。怖がるな」
  "translation_status": "reviewed"
- "id": "xy-ch02-038"

  "source_text": "好猴王，念聲咒語，駕陣狂風，雲頭落下。叫：「孩兒們睜眼。」眾猴腳躧實地，認得是家鄉，個個歡喜，都奔洞門舊路。那在洞眾猴，都一齊簇擁同入，分班序齒，禮拜猴王。安排酒果，接風賀喜，啟問降魔救子之事。悟空備細言了一遍，眾猴稱揚不盡道：「大王去到那方，不意學得這般手段。」悟空又道：「我當年別汝等，隨波逐流，飄過東洋大海，到西牛賀洲地界，徑至南贍部洲，學成人像，著此衣，穿此履，擺擺搖搖，雲遊了八九年餘，更不曾有道。又渡西洋大海，到西牛賀洲地界，訪問多時，幸遇一老祖，傳了我與天同壽的真功果，不死長生的大法門。」眾猴稱賀，都道：「萬劫難逢也！」悟空又笑道：「小的們，又喜我這一門皆有姓氏。」眾猴道：「大王姓甚？」悟空道：「我今姓孫，法名悟空。」眾猴聞說，鼓掌忻然道：「大王是老孫，我們都是二孫、三孫、細孫、小孫……一家孫、一國孫、一窩孫矣！」都來奉承老孫，大盆小碗的椰子酒、葡萄酒、仙花、仙果，真個是合家歡樂。咦！"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 37
  "translation_ja": |-
    孫悟空は呪文を唱え、激しい風を巻き起こして雲に乗り、一同を故郷へ降ろした。
    孫悟空「皆、目を開け！」
    猿たちが足でしっかり地面を踏むと、そこはまぎれもない故郷だった。皆は大喜びで昔からの道を通り、洞窟の入口へ駆けていった。水簾洞に残っていた猿たちも総出で迎え、一緒に洞内へ入った。年齢の順に整列して孫悟空に礼をし、酒や果物を並べて帰還と勝利を祝った。そして、混世魔王を倒し、さらわれた仲間を救った話を聞きたがった。
    孫悟空が事の顛末を詳しく語ると、皆は口々に褒めた。
    猿たち「大王はどちらへ行かれて、こんな立派な術を身につけられたのですか」
    孫悟空「昔お前たちと別れ、波に任せて東の大海を越え、西牛賀洲（さいごかしゅう。世界を四つに分けたうち西方の大陸）のあたりから南贍部洲（なんせんぶしゅう。世界を四つに分けたうち南方の大陸）へ渡った。人間の姿や振る舞いをまね、この服を着、この靴を履き、気ままに八、九年も放浪したが、道を得ることはできなかった。それから西の大海を越えて西牛賀洲へ行き、長いこと師を探した末、幸いにも一人の偉大な仙人と出会った。その方から、天と寿命を同じくする真の修行の成果と、死を免れて長く生きる奥義を授かったのだ」
    猿たちは祝福して言った。
    猿たち「そんな幸運は幾万年に一度あるかないかのことです！」
    孫悟空はまた笑って言った。
    孫悟空「皆、うれしいことがもう一つある。俺たちにも姓ができたぞ」
    猿たち「大王は何というお姓ですか」
    孫悟空「今は孫（そん。孫悟空が授かった一族の名）という姓で、修行者としての名は悟空だ」
    猿たちは手をたたき、はしゃいで言った。
    猿たち「大王が一番上の孫なら、私たちは二番目の孫、三番目の孫、ちび孫、子孫……孫一家、孫の国、孫の群れというわけですね！」
    皆が孫悟空を囲み、大きな鉢や小さな椀にヤシ酒やブドウ酒を注ぎ、仙境の花や果物を並べた。一族そろっての大宴会である。さて――。
  "translation_status": "reviewed"

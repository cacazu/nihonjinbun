  "source_text": "這一夜，悟空即運神煉法，會了觔斗雲。逐日家無拘無束，自在逍遙，此亦長生之美。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 20
  "translation_ja": "その夜、孫悟空は精神を集中して術を練り、筋斗雲を会得した。それからというもの、誰にも束縛されず、毎日気ままに暮らすようになった。これも永遠の命を得る喜びの一つであった。"
  "translation_status": "reviewed"
- "id": "xy-ch02-022"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，春歸夏至，大眾都在松樹下會講多時。大眾道：「悟空，你是那世修來的緣法？前日老師父附耳低言，傳與你的躲三災變化之法，可都會麼？」悟空笑道：「不瞞諸兄長說，一則是師父傳授，二來也是我晝夜慇懃，那幾般兒都會了。」大眾道：「趁此良時，你試演演，讓我等看看。」悟空聞說，抖擻精神，賣弄手段道：「眾師兄請出個題目。要我變化甚麼？」大眾道：「就變棵松樹罷。」悟空捻著訣，念動咒語，搖身一變，就變做一棵松樹。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 21
  "translation_ja": |-
    春が過ぎ、夏になったある日、弟子たちは松の木の下で長いこと語り合っていた。
    兄弟子たち「悟空、お前は前世にどれほどの功徳を積んだのだろうな。先日、お師匠さまがお前の耳元で三災（さんさい。修行者を襲う雷・火・風の三つの災難）を避ける変身の術を教えておられたが、もう全部身につけたのか」
    孫悟空は笑った。
    孫悟空「先輩方に隠し立てはしません。お師匠さまに教えていただいた上、私も昼夜懸命に修行しましたので、すべてできるようになりました」
    兄弟子たち「それなら、ちょうどよい。ひとつ見せてくれないか」
    孫悟空はすっかり乗り気になり、腕前を披露しようと言った。
    孫悟空「先輩方、何に変わればよいか、お題を出してください」
    兄弟子たち「では一本の松の木になれ」
    孫悟空は指で印を結び、呪文を唱えて身をひと揺すりした。すると、そこに一本の松が現れた。その姿を詠めば――。
  "translation_status": "reviewed"
- "id": "xy-ch02-023"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    鬱鬱含煙貫四時，凌雲直上秀貞姿。
    全無一點妖猴像，盡是經霜耐雪枝。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 22
  "translation_ja": |-
    深々と茂り、霞をたたえて四季を通じて青く、
    空高くまっすぐ伸びる、その姿は気高い。
    いたずら猿の面影は少しも残らず、
    霜にも雪にも耐える枝ばかりが広がる。
  "translation_status": "reviewed"
- "id": "xy-ch02-024"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大眾見了鼓掌，呵呵大笑，都道：「好猴兒，好猴兒！」不覺的嚷鬧，驚動了祖師。祖師急拽杖出門來問道：「是何人在此喧嘩？」大眾聞呼，慌忙檢束，整衣向前。悟空也現了本相，雜在叢中道：「啟上尊師：我等在此會講，更無外姓喧嘩。」祖師怒喝道：「你等大呼小叫，全不像個修行的體段！修行的人，口開神氣散，舌動是非生，如何在此嚷笑？」大眾道：「不敢瞞師父，適才孫悟空演變化耍子。教他變棵松樹，果然是棵松樹，弟子們俱稱揚喝采，故高聲驚冒尊師，望乞恕罪。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 23
  "translation_ja": |-
    一同はそれを見て手をたたき、大笑いした。
    弟子たち「見事な猿だ、見事な猿だ！」歓声は次第に大きくなり、須菩提祖師を驚かせた。須菩提祖師はあわてて杖を取って出てきた。
    須菩提祖師「誰だ、こんなに騒いでいるのは」
    弟子たちは声を聞くと慌てて身なりを整え、師の前に出た。孫悟空も元の姿に戻り、皆に交じって答えた。
    孫悟空「お師匠さま、私たちはここで話をしておりました。外の者が騒いだわけではありません」
    須菩提祖師は怒鳴った。
    須菩提祖師「大声でわめき散らして、修行者らしさのかけらもない。修行する者は口を開けば精神の気が散り、舌を動かせば争いの種が生じるというのに、なぜ騒ぐのだ」
    弟子たち「隠してはおけません。先ほど悟空が変身の術を見せてくれたのです。松の木になれと頼むと、本当に松になりましたので、皆で褒めて歓声を上げ、お師匠さまのお耳を騒がせてしまいました。どうかお許しください」
  "translation_status": "reviewed"
- "id": "xy-ch02-025"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師道：「你等起去。」叫：「悟空過來！我問你弄甚麼精神，變甚麼松樹？這個工夫，可好在人前賣弄？假如你見別人有，不要求他？別人見你有，必然求你。你若畏禍，卻要傳他；若不傳他，必然加害：你之性命又不可保。」悟空叩頭道：「只望師父恕罪。」祖師道：「我也不罪你，但只是你去罷。」悟空聞此言，滿眼墮淚道：「師父，教我往那裡去？」祖師道：「你從那裡來，便從那裡去就是了。」悟空頓然醒悟道：「我自東勝神洲傲來國花果山水簾洞來的。」祖師道：「你快回去，全你性命；若在此間，斷然不可。」悟空領罪，上告尊師：「我也離家有二十年矣，雖是回顧舊日兒孫，但念師父厚恩未報，不敢去。」祖師道：「那裡甚麼恩義，你只不惹禍，不牽帶我就罷了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 24
  "translation_ja": |-
    須菩提祖師は弟子たちに言った。
    須菩提祖師「お前たちは下がれ」そして孫悟空を呼んだ。
    須菩提祖師「悟空、こちらへ来い。お前はいったい何を考えて松の木などに変わった。人前で見せびらかすために、この術を習ったのか。お前が誰かの優れた術を見たら、教えてほしいと頼むだろう。同じように誰かがお前の術を見れば、必ず伝授を求める。災いを恐れれば、教えてやるほかない。教えなければ、必ず危害を加えられる。そうなれば命さえ守れないぞ」
    孫悟空は頭を下げた。
    孫悟空「お師匠さま、どうかお許しください」
    須菩提祖師「私はお前を罰するつもりはない。ただ、ここを去るがよい」
    孫悟空は目に涙をためた。
    孫悟空「お師匠さま、どこへ行けとおっしゃるのですか」
    須菩提祖師「来たところへ帰るのだ」
    孫悟空ははっと思い出した。
    孫悟空「私は東勝神洲（とうしょうしんしゅう。世界を四つに分けたうち東方の大陸）の傲来国（ごうらいこく。東勝神洲にある国）、花果山（かかざん。悟空と猿たちの住む山）の水簾洞（すいれんどう。花果山の滝の奥にある猿たちの住まい）から参りました」
    須菩提祖師「すぐに帰れ。それが身を守る道だ。ここに残ることは決して許されぬ」
    孫悟空は叱責を受け入れ、改めて申し上げた。
    孫悟空「故郷を離れてもう二十年になります。子どもや孫の猿たちにも会いたいのですが、お師匠さまの深いご恩にまだ報いておりません。おいそれとは帰れません」
    須菩提祖師「恩義などと考えるな。お前が災いを起こして、私まで巻き添えにしなければ、それでよい」
  "translation_status": "reviewed"
- "id": "xy-ch02-026"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空見沒奈何，只得拜辭，與眾相別。祖師道：「你這去，定生不良。憑你怎麼惹禍行兇，卻不許說是我的徒弟。你說出半個字來，我就知之，把你這猢猻剝皮剉骨，將神魂貶在九幽之處，教你萬劫不得翻身！」悟空道：「決不敢提起師父一字，只說是我自家會的便罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 25
  "translation_ja": |-
    どうにもならないと悟った孫悟空は、師に別れの礼をし、兄弟子たちにも別れを告げた。
    須菩提祖師「お前は故郷へ戻れば、きっとよくないことを起こすだろう。どんな騒動を起こそうと、どんな乱暴を働こうと、私の弟子だったとは絶対に口にするな。半言でも漏らせば、すぐにわかる。お前の皮を剥ぎ、骨を砕き、魂をこの世の最も深い暗闇へ落として、永遠に抜け出せぬようにしてやる」
    孫悟空「お師匠さまのことは一言も明かしません。この術は自分で覚えたとだけ申します」
  "translation_status": "reviewed"
- "id": "xy-ch02-027"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空謝了，即抽身，捻著訣，丟個連扯，縱起觔斗雲，徑回東勝。那裡消一個時辰，早看見花果山水簾洞。美猴王自知快樂，暗暗的自稱道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 26
  "translation_ja": "孫悟空は礼を述べて身を翻し、指で印を結び、宙返りをして雲へ飛び乗り、東勝神洲を目指して一直線に戻った。一時辰（いちじしん）（二時間ほど）もかからぬうちに、早くも花果山の水簾洞が見えてきた。孫悟空は胸を躍らせ、ひそかに詩を口ずさんだ。"
  "translation_status": "reviewed"
- "id": "xy-ch02-028"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    去時凡骨凡胎重，得道身輕體亦輕。
    舉世無人肯立志，立志修玄玄自明。
    當時過海波難進，今日回來甚易行。
    別語叮嚀還在耳，何期頃刻見東溟。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 27
  "translation_ja": |-
    旅立つときの身は凡俗の重い肉体だったが、道を得た今は身も心も軽い。
    世の人はなかなか志を立てぬが、志を決めて深い道を修めれば、その理もおのずと明らかになる。
    あのときは海の波を越えるにも難儀したのに、今日は帰ることがこれほどたやすい。
    師の別れの戒めがまだ耳に残るうちに、もう東の海が見えるとは。
  "translation_status": "reviewed"
- "id": "xy-ch02-029"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空按下雲頭，直至花果山，找路而走。忽聽得鶴唳猿啼：鶴唳聲沖霄漢外，猿啼悲切甚傷情。即開口叫道：「孩兒們，我來了也！」那崖下石坎邊，花草中，樹木裡，若大若小之猴，跳出千千萬萬，把個美猴王圍在當中，叩頭叫道：「大王，你好寬心，怎麼一去許久？把我們俱閃在這裡，望你誠如饑渴。近來被一妖魔在此欺虐，強要占我們水簾洞府，是我等捨死忘生，與他爭鬥。這些時，被那廝搶了我們家火，捉了許多子姪，教我們晝夜無眠，看守家業。幸得大王來了，大王若再年載不來，我等連山洞盡屬他人矣。」悟空聞說，心中大怒，道：「是甚麼妖魔，輒敢無狀？你且細細說來，待我尋他報仇。」眾猴叩頭：「告上大王：那廝自稱混世魔王，住居在直北下。」悟空道：「此間到他那裡，有多少路程？」眾猴道：「他來時雲，去時霧，或風或雨，或電或雷，我等不知有多少路。」悟空道：「既如此，你們休怕，且自頑耍，等我尋他去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 28
  "translation_ja": |-
    孫悟空は雲を降り、花果山の道をたどって進んだ。すると、鶴の鳴き声と猿の叫ぶ声が聞こえてきた。鶴の声は天の彼方まで響き、猿の声はあまりに悲しげで胸を打った。孫悟空は大声で叫んだ。
    孫悟空「みんな、帰ってきたぞ！」
    崖の下、岩場のそば、草花の中、木々の間から、大きいのも小さいのも、数えきれないほどの猿が飛び出してきた。猿たちは孫悟空を取り囲み、ひざまずいて言った。
    猿たち「大王、何とものんきなことでしょう。どうしてこんなに長く留守にしたのです。残された私たちは喉が渇いた者が水を待つように、あなたを待ちわびておりました。最近、妖怪が現れて私たちを苦しめ、水簾洞を無理やり奪おうとしております。私たちは命がけで戦ってきましたが、あいつは家財道具を奪い、子や孫を大勢さらっていきました。昼も夜も眠れず、住まいを守っているありさまです。大王がお戻りくださって幸いです。あと一年も戻らなければ、山も洞窟もすべて奪われていたでしょう」
    孫悟空は激怒した。
    孫悟空「何という妖怪だ。そんな無礼が許されるものか。詳しく話せ。俺が行って仇を討ってやる」
    猿たちは頭を下げた。
    猿たち「その者は混世魔王（こんせいまおう。花果山の猿たちを襲った妖怪の首領）と名乗り、ここから真北に住んでおります」
    孫悟空「どれほど離れているのだ」
    猿たち「あいつは雲に乗って来て霧に包まれて去り、風雨にも雷光にも姿を変えます。距離など見当もつきません」
    孫悟空「よし、怖がるな。お前たちはここで楽しく遊んでいろ。俺が探しに行ってくる」
  "translation_status": "reviewed"
- "id": "xy-ch02-030"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好猴王，將身一縱，跳起去，一路觔斗，直至北下觀看，見一座高山，真是十分險峻。好山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 29
  "translation_ja": "孫悟空は一気に飛び上がり、筋斗雲を連ねて北へ向かった。そこで見下ろすと、ひときわ険しい高山がそびえている。どんな山かと言えば――。"
  "translation_status": "reviewed"
- "id": "xy-ch02-031"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": "筆峰挺立，曲澗深沉。筆峰挺立透空霄，曲澗深沉通地戶。兩崖花木爭奇，幾處松篁鬥翠。左邊龍，熟熟馴馴；右邊虎，平平伏伏。每見鐵牛耕，常有金錢種。幽禽睍睆聲，丹鳳朝陽立。石磷磷，波淨淨，古怪蹺蹊真惡獰。世上名山無數多，花開花謝蘩還眾。爭如此景永長存，八節四時渾不動。誠為三界坎源山，滋養五行水臟洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 30
  "translation_ja": |-
    筆の穂先のように切り立つ峰、奥深く曲がりくねる谷。
    鋭い峰は大空を突き、深い谷は地の底に通じる。
    向かい合う崖では花や木が美を競い、ところどころで松と竹が緑を競う。
    左には竜がおとなしくうずくまり、右には虎が静かに伏している。
    鉄の牛が田を耕す姿が見え、黄金の銭のようなものが種まかれる。
    奥の鳥は美しい声で鳴き、赤い鳳凰は朝日に向かって立つ。
    岩はごつごつし、水は澄みきり、奇怪で険しいことこのうえない。
    世には名高い山が幾つもあり、花が咲き散り、草木が次々生い茂る。
    だがこの景色には及ばない。ここは季節が巡っても、姿を変えずに永く残る。
    まことに三界（さんがい。仏教で生きものの住む世界を三つに分けたもの）に名高い坎源山（かんげんざん。混世魔王が住む水臓洞のある山）、五行（ごぎょう。木・火・土・金・水の五つの働き）の気を養う水臓洞（すいぞうどう。坎源山にある混世魔王の住まい）のある山だ。
  "translation_status": "reviewed"
- "id": "xy-ch02-032"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "美猴王正默觀看景致，只聽得有人言語，徑自下山尋覓。原來那陡崖之前，乃是那水臟洞。洞門外有幾個小妖跳舞，見了悟空就走。悟空道：「休走！借你口中言，傳我心內事。我乃正南方花果山水簾洞洞主。你家甚麼混世鳥魔，屢次欺我兒孫，我特尋來，要與他見個上下。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 31
  "translation_ja": |-
    孫悟空が黙って景色を眺めていると、どこからか話し声がした。山を下りて探すと、切り立った崖の前に水臓洞という洞窟があった。入口では数匹の小妖怪が踊っていたが、孫悟空を見るや逃げ出した。孫悟空は呼び止めた。
    孫悟空「逃げるな。お前たちの口を借りて、俺の言葉を伝えてもらおう。俺はここから真南にある花果山、水簾洞の主人だ。お前たちの主の混世魔王とやらが、何度も俺の子や孫をいじめた。今日こそ勝負をつけに来たと伝えろ」
  "translation_status": "reviewed"
- "id": "xy-ch02-033"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那小妖聽說，疾忙跑入洞裡報道：「大王，禍事了！」魔王道：「有甚禍事？」小妖道：「洞外有猴頭稱為花果山水簾洞洞主，他說你屢次欺他兒孫，特來尋你，見個上下哩。」魔王笑道：「我常聞得那些猴精說他有個大王，出家修行去，想是今番來了。你們見他怎生打扮？有甚器械？」小妖道：「他也沒甚麼器械，光著個頭，穿一領紅色衣，勒一條黃絛，足下踏一對烏靴，不僧不俗，又不像道士、神仙，赤手空拳，在門外叫哩。」魔王聞說：「取我披掛、兵器來。」那小妖即時取出。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 32
  "translation_ja": |-
    小妖怪はあわてて洞窟に駆け込み、報告した。
    小妖怪「大王、大変です！」
    混世魔王「何が大変なのだ」
    小妖怪「外に一匹の猿がいて、花果山の水簾洞の主人だと名乗っています。大王が何度も子や孫をいじめたので、決着をつけに来たと申しております」
    混世魔王は笑った。
    混世魔王「あの猿どもが、王は出家して修行に行ったといつも言っていたな。戻ってきたらしい。どんな格好で、武器は何を持っている」
    小妖怪「武器などありません。頭には何もかぶらず、赤い服を着て、黄色い帯紐を締め、黒い靴を履いています。坊主にも俗人にも見えず、道士にも仙人にも見えません。素手で入口の外から叫んでおります」
    混世魔王は命じた。
    混世魔王「鎧と武器を持ってこい」小妖怪はすぐに持ってきた。
  "translation_status": "reviewed"
- "id": "xy-ch02-034"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔王穿了甲冑，綽刀在手，與眾妖出得門來，即高聲叫道：「那個是水簾洞洞主？」悟空急睜睛觀看，只見那魔王："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 33
  "translation_ja": |-
    混世魔王は鎧兜を身につけ、刀を手に取り、配下の妖怪とともに門を出て大声を上げた。
    混世魔王「どいつが水簾洞の主人だ」孫悟空が目を見張ると、混世魔王はこんな姿をしていた。
  "translation_status": "reviewed"
- "id": "xy-ch02-035"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭戴烏金盔，映日光明；身掛皂羅袍，迎風飄蕩。下穿著黑鐵甲，緊勒皮條；足踏著花褶靴，雄如上將。腰廣十圍，身高三丈。手執一口刀，鋒刃多明亮。稱為混世魔，磊落兇模樣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 34
  "translation_ja": |-
    頭には黒光りする金属の兜、陽を受けてきらめく。
    身には黒い薄絹の上着をまとい、風にひるがえす。
    その下には黒鉄の鎧をつけ、革帯で固く締め、
    足には飾りのあるひだ靴を履き、大将軍のように雄々しい。
    腰回りは途方もなく太く、背丈は三丈。
    手には一本の大刀を握り、その刃は鋭く光る。
    混世魔王とはこの者のこと、堂々としていながら恐ろしい風貌だ。
  "translation_status": "reviewed"
- "id": "xy-ch02-036"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "猴王喝道：「這潑魔這般眼大，看不見老孫。」魔王見了，笑道：「你身不滿四尺，年不過三旬，手內又無兵器，怎麼大膽猖狂，要尋我見甚麼上下？」悟空罵道：「你這潑魔，原來沒眼。你量我小，要大卻也不難；你量我無兵器，我兩隻手勾著天邊月哩。你不要怕，只吃老孫一拳。」縱一縱，跳上去，劈臉就打。那魔王伸手架住道：「你這般矬矮，我這般高長；你要使拳，我要使刀。使刀就殺了你，也吃人笑。待我放下刀，與你使路拳看。」悟空道：「說得是。好漢子，走來。」那魔王丟開架子便打，這悟空鑽進去相撞相迎。他兩個拳搥腳踢，一衝一撞。原來長拳空大，短簇堅牢。那魔王被悟空掏短脅，撞了襠，幾下觔節，把他打重了。他閃過，拿起那板大的鋼刀，望悟空劈頭就砍。悟空急撤身，他砍了一個空。悟空見他兇猛，即使身外身法，拔一把毫毛，丟在口中嚼碎，望空噴去，叫一聲：「變！」即變做三、二百個小猴，週圍攢簇。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 35
  "translation_ja": |-
    孫悟空は怒鳴った。
    孫悟空「その大きな目は飾りか。この俺が見えぬとはな！」
    混世魔王は孫悟空を見て笑った。
    混世魔王「背丈は四尺（しゃく。長さの単位。実際の長さは時代によって異なる）にも足りず、年も三十にならぬように見える。武器一つ持たず、よくもわしと勝負しようなどと大口をたたけるものだ」
    孫悟空は言い返した。
    孫悟空「この化け物め、お前の目は節穴か！　小さいと言うが、大きくなるくらい朝飯前だ。武器がないだと。この両手は天の端の月にだって届くぞ。怖がるな、まずこの俺の拳を受けてみろ！」
    孫悟空は跳びかかり、混世魔王の顔へ拳を繰り出した。混世魔王は腕で受け止め、言った。
    混世魔王「お前は小さく、わしは大きい。お前が拳で来るのに、わしが刀で殺したら笑いものになる。刀を置いて拳で相手をしてやろう」
    孫悟空「それでこそ男だ。さあ、来い！」
    混世魔王は構えをといて拳を振るい、孫悟空はその懐に潜り込んだ。二人は拳で殴り、足で蹴り、激しくぶつかり合う。大柄な混世魔王の拳は大振りで隙が多い。一方、小柄な孫悟空の攻めは細かく、堅実だった。孫悟空は混世魔王の脇腹に拳を入れ、股の辺りへ体当たりし、続けざまの攻撃で手ひどい打撃を与えた。混世魔王は身をかわし、板のように幅広い鋼の刀を取り上げるや、孫悟空の頭めがけて振り下ろした。孫悟空は素早く引き下がり、刀は空を切った。相手の凶暴さを見た孫悟空は、身から分身を生み出す術を使った。体毛をひとつかみ抜き、口に入れてかみ砕き、空中へ吹き出して叫んだ。
    孫悟空「変われ！」
    すると二、三百匹もの小猿が現れ、混世魔王の周囲に群がった。
  "translation_status": "reviewed"
- "id": "xy-ch02-037"

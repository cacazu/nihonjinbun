  "source_text": "第二回　悟徹菩提真妙理　斷魔歸本合元神"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 0
  "translation_ja": "第二回　菩提の妙理を悟りきり、魔を斬って本源に帰り、元の魂と一つになる"
  "translation_status": "reviewed"
- "id": "xy-ch02-002"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表美猴王得了姓名，怡然踴躍，對菩提前作禮啟謝。那祖師即命大眾引孫悟空出二門外，教他灑掃應對、進退周旋之節。眾仙奉行而出。悟空到門外，又拜了大眾師兄，就於廊廡之間安排寢處。次早，與眾師兄學言語禮貌、講經論道、習字焚香。每日如此。閑時即掃地鋤園、養花修樹、尋柴燃火、挑水運漿。凡所用之物，無一不備。在洞中不覺倏六七年。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 1
  "translation_ja": "さて、孫悟空（そんごくう。石から生まれ、仙術を学ぶ主人公の猿）は名前を授かると、うれしさに飛び跳ね、須菩提祖師（すぼだいそし。悟空に名と仙術を授ける師）の前で礼をして感謝を述べた。須菩提祖師は弟子たちに命じ、孫悟空を奥の門から外へ連れ出させ、掃除や客への応対、立ち居振る舞いと礼儀を教えるようにした。弟子たちは命に従った。孫悟空は外で兄弟子たちにも礼をし、回廊に寝る場所を整えた。翌朝から兄弟子たちとともに言葉遣いと作法を学び、経典や道について語り合い、字を習い、香をたいた。毎日その繰り返しだった。暇があれば庭を掃き、畑を耕し、花や木を育て、薪を集めて火を起こし、水や飲み物を運んだ。必要な仕事でしないものはなかった。こうして洞窟で過ごすうち、いつしか六、七年が過ぎた。"
  "translation_status": "reviewed"
- "id": "xy-ch02-003"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一日，祖師登壇高坐，喚集諸仙，開講大道。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 2
  "translation_ja": "ある日、須菩提祖師は講壇の高座に上がり、仙道を学ぶ弟子たちを集めて、大いなる道の教えを説き始めた。その様子は、まさに次のとおりであった。"
  "translation_status": "reviewed"
- "id": "xy-ch02-004"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": "天花亂墜，地湧金蓮。妙演三乘教，精微萬法全。慢搖麈尾噴珠玉，響振雷霆動九天。說一會道，講一會禪，三家配合本如然。開明一字皈誠理，指引無生了性玄。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 3
  "translation_ja": |-
    天から花が降りしきり、大地には黄金の蓮が湧き出す。
    仏の三種の教えを巧みに説き、あらゆる法の精妙なところまで明かす。
    手にした払子（ほっす。柄の先に毛などを束ねた、塵や虫を払う道具）をゆるやかに振れば、言葉は珠玉のようにほとばしり、
    その声は雷鳴となって九重の天（きゅうちょうのてん。幾重にも重なる高い天）まで響き渡る。
    あるときは道教の道を、あるときは仏教の禅を語り、儒教・仏教・道教の三つが本来ひとつに通じることを示す。
    根本の一理を明らかにしてまことの道へ帰らせ、生死を超える境地へと人の本性を導く。
  "translation_status": "reviewed"
- "id": "xy-ch02-005"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫悟空在傍聞講，喜得他抓耳撓腮，眉花眼笑，忍不住手之舞之，足之蹈之。忽被祖師看見，叫孫悟空道：「你在班中，怎麼顛狂躍舞，不聽我講？」悟空道：「弟子誠心聽講，聽到老師父妙音處，喜不自勝，故不覺作此踴躍之狀。望師父恕罪。」祖師道：「你既識妙音，我且問你，你到洞中多少時了？」悟空道：「弟子本來懵懂，不知多少時節。只記得灶下無火，常去山後打柴，見一山好桃樹，我在那裡吃了七次飽桃矣。」祖師道：「那山喚名爛桃山。你既吃七次，想是七年了。你今要從我學些甚麼道？」悟空道：「但憑尊師教誨，只是有些道氣兒，弟子便就學了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 4
  "translation_ja": |-
    孫悟空は脇で講義を聞いていたが、うれしくて耳をかき、頬をかき、顔いっぱいに笑みを浮かべ、思わず手足を躍らせた。須菩提祖師がそれを見つけて言った。
    須菩提祖師「悟空（ごくう。孫悟空の名）、お前は皆の中で、どうしてそんなに取り乱して踊るのだ。話を聞いていないのか」
    孫悟空「弟子の私は真剣に拝聴しております。お師匠さまのありがたいお話があまりに素晴らしく、喜びを抑えられず、思わず踊ってしまいました。どうかお許しください」
    須菩提祖師「その妙味がわかるというなら聞こう。お前はこの洞窟へ来て何年になる」
    孫悟空「私はもともと世間知らずで、年月などわかりません。ただ、かまどの火が絶えたとき、よく裏山へ薪を取りに行きました。そこに立派な桃の木があり、七度、桃を腹いっぱい食べたことだけは覚えております」
    須菩提祖師「その山は爛桃山（らんとうざん。祖師の住まいの裏にある桃の山）という。七度食べたなら、およそ七年だろう。ところで今、私からどんな道を学びたいのだ」
    孫悟空「お師匠さまのお教えのままに。少しでも真の道につながるものなら、何でも学びます」
  "translation_status": "reviewed"
- "id": "xy-ch02-006"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師道：「『道』字門中有三百六十傍門，傍門皆有正果。不知你學那一門哩？」悟空道：「憑尊師意思，弟子傾心聽從。」祖師道：「我教你個『術』字門中之道，如何？」悟空道：「術門之道怎麼說？」祖師道：「術字門中，乃是些請仙、扶鸞、問卜、揲蓍，能知趨吉避凶之理。」悟空道：「似這般可得長生麼？」祖師道：「不能，不能。」悟空道：「不學，不學。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 5
  "translation_ja": |-
    須菩提祖師「道の門には三百六十もの脇道があり、どれにも相応の成果はある。お前はどれを学ぶつもりだ」
    孫悟空「お師匠さまにお任せします。心から従います」
    須菩提祖師「では、占術やまじないの類を教えようか」
    孫悟空「それはどのようなものですか」
    須菩提祖師「仙人を呼び寄せ、神意を筆に託して書き記させ、吉凶を占い、ノコギリソウの茎を数えて易（えき。陰と陽の組合せで変化や吉凶を判断する占い）を立てる術だ。幸運に向かい災いを避ける方法がわかる」
    孫悟空「それで不老不死になれますか」
    須菩提祖師「なれぬ、なれぬ」
    孫悟空「では学びません、学びません」
  "translation_status": "reviewed"
- "id": "xy-ch02-007"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師又道：「教你『流』字門中之道，如何？」悟空又問：「流字門中是甚義理？」祖師道：「流字門中，乃是儒家、釋家、道家、陰陽家、墨家、醫家，或看經，或念佛，並朝真降聖之類。」悟空道：「似這般可得長生麼？」祖師道：「若要長生，也似壁裡安柱。」悟空道：「師父，我是個老實人，不曉得打市語。怎麼謂之『壁裡安柱』？」祖師道：「人家蓋房，欲圖堅固，將牆壁之間立一頂柱，有日大廈將頹，他必朽矣。」悟空道：「據此說，也不長久。不學，不學。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 6
  "translation_ja": |-
    須菩提祖師「では、さまざまな学派の教えを学ぶのはどうだ」
    孫悟空「それは何を学ぶのですか」
    須菩提祖師「儒教、仏教、道教、陰陽の学説、墨家（ぼくか。墨子に始まり、差別のない愛や倹約を説いた学派）の教え、医術といったものだ。経典を読み、仏の名を唱え、真の仙人を拝し、聖者の降臨を願う修行も含まれる」
    孫悟空「それで長生きできますか」
    須菩提祖師「永遠の命を求めるには、壁の中に支柱を立てるようなものだ」
    孫悟空「お師匠さま、私は裏表のない性分で、世間のたとえ話に疎いのです。壁の中に支柱を立てるとは、どういう意味ですか」
    須菩提祖師「人が家を建てるとき、丈夫にしようと壁の中に柱を入れる。だが、いつか家そのものが崩れれば、その柱も朽ちる」
    孫悟空「それでは長続きしません。学びません、学びません」
  "translation_status": "reviewed"
- "id": "xy-ch02-008"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師道：「教你『靜』字門中之道，如何？」悟空道：「靜字門中是甚正果？」祖師道：「此是休糧守谷、清靜無為、參禪打坐、戒語持齋，或睡功，或立功，並入定、坐關之類。」悟空道：「這般也能長生麼？」祖師道：「也似窯頭土坯。」悟空笑道：「師父果有些滴澾。一行說我不會打市語。怎麼謂之『窯頭土坯』？」祖師道：「就如那窯頭上造成磚瓦之坯，雖已成形，尚未經水火鍛煉，一朝大雨滂沱，他必濫矣。」悟空道：「也不長遠。不學，不學。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 7
  "translation_ja": |-
    須菩提祖師「ならば静かに身と心を修める修行はどうだ」
    孫悟空「それでどんな悟りが得られるのですか」
    須菩提祖師「食を断つ養生法、無欲で静かな暮らし、座禅と瞑想、言葉を慎む戒めや精進潔斎、寝た姿勢や立った姿勢で行う修行、深い精神集中、庵にこもって座る修行などだ」
    孫悟空「そうすれば不老不死になれますか」
    須菩提祖師「窯のそばに積んだ、まだ焼かない生の煉瓦のようなものだ」
    孫悟空は笑った。
    孫悟空「お師匠さまはまたわかりにくいたとえをお使いになる。私が世間の隠語を知らないと申し上げたばかりではありませんか。その『生の煉瓦』とは何ですか」
    須菩提祖師「窯のそばで形だけ整えた煉瓦や瓦は、まだ火で焼かれていない。大雨が降れば、たちまち泥に戻ってしまう」
    孫悟空「それでは長持ちしません。学びません、学びません」
  "translation_status": "reviewed"
- "id": "xy-ch02-009"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師道：「教你『動』字門中之道，如何？」悟空道：「動門之道卻又怎麼？」祖師道：「此是有為有作：採陰補陽、攀弓踏弩、摩臍過氣、用方炮製、燒茅打鼎、進紅鉛、煉秋石，並服婦乳之類。」悟空道：「似這等也得長生麼？」祖師道：「此欲長生，亦如水中撈月。」悟空道：「師父又來了。怎麼叫做『水中撈月』？」祖師道：「月在長空，水中有影，雖然看見，只是無撈摸處，到底只成空耳。」悟空道：「也不學，不學。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 8
  "translation_ja": |-
    須菩提祖師「では、体を動かし、さまざまな技法を用いる修行はどうだ」
    孫悟空「それは何をするのですか」
    須菩提祖師「陰陽の気（き。身体や天地に巡ると考えられた生命の働き）を採り入れて不足を補い、弓を引いたり石弓を踏み張ったりして体を鍛え、へその周りをもんで気を巡らし、処方に従って薬を調え、炉や鼎（かなえ。薬物などを煮る、足の付いた器）で薬物を煉り、赤い鉛の薬を加え、尿から得る薬用の塩を精製し、女の乳を飲むといった類だ」
    孫悟空「それで不老不死になれるのですか」
    須菩提祖師「そんなもので永遠の命を得ようとは、水に映った月をすくうようなものだ」
    孫悟空「お師匠さま、またたとえ話ですか。水に映った月をすくうとは、どういうことです」
    須菩提祖師「月は高い空にある。水面にはその姿が映って見えるが、いくら手を伸ばしてもつかめない。結局は無駄に終わる」
    孫悟空「それも学びません、学びません」
  "translation_status": "reviewed"
- "id": "xy-ch02-010"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祖師聞言，咄的一聲，跳下高臺，手持戒尺，指定悟空道：「你這猢猻，這般不學，那般不學，卻待怎麼？」走上前，將悟空頭上打了三下。倒背著手，走入裡面，將中門關了，撇下大眾而去。諕得那一班聽講的人人驚懼，皆怨悟空道：「你這潑猴，十分無狀。師父傳你道法，如何不學，卻與師父頂嘴？這番衝撞了他，不知幾時才出來呵！」此時俱甚報怨他，又鄙賤嫌惡他。悟空一些兒也不惱，只是滿臉陪笑。原來那猴王已打破盤中之謎，暗暗在心，所以不與眾人爭競，只是忍耐無言。祖師打他三下者，教他三更時分存心；倒背著手走入裡面，將中門關上者，教他從後門進步，秘處傳他道也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 9
  "translation_ja": |-
    須菩提祖師はこれを聞くや一喝した。
    須菩提祖師「こらっ」
    高座から飛び降り、手にした教戒（きょうかい。教えさとして戒めること）の物差しで孫悟空を指さした。
    須菩提祖師「この猿め！　あれも嫌だ、これも嫌だというなら、いったい何を習うつもりだ」
    そう言って進み出ると孫悟空の頭を三度たたき、両手を背に回して奥へ入り、中央の扉を閉め、弟子たちを残して立ち去った。講義を聞いていた一同は驚きおびえ、孫悟空を責めた。
    弟子たち「この生意気な猿！　お師匠さまがお前に術を授けようとされたのに、なぜ学ばずに口答えする。お師匠さまを怒らせてしまったではないか。いつ戻ってこられることやら」
    皆が口々に文句を言い、孫悟空を軽蔑して嫌ったが、本人は怒りもせず、にこにこしているだけだった。実のところ孫悟空は、師が示した暗号の意味をすでに悟り、胸の内にしまっていたのだ。だから誰とも言い争わず、黙って堪えた。須菩提祖師が頭を三度たたいたのは夜の三更（さんこう。夜を五つに分けた第三の時間帯で、真夜中ごろ）、すなわち真夜中に来いという合図であり、両手を背にして奥へ入り中央の扉を閉めたのは、裏口から入れば人目につかない場所で秘伝を授けるという知らせだった。
  "translation_status": "reviewed"
- "id": "xy-ch02-011"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當日悟空與眾等喜喜歡歡，在三星仙洞之前，盼望天色，急不能到晚。及黃昏時，卻與眾就寢，假合眼，定息存神。山中又沒打更傳箭，不知時分，只自家將鼻孔中出入之氣調定。約到子時前後，輕輕的起來，穿了衣服，偷開前門，躲離大眾，走出外，擡頭觀看，正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 10
  "translation_ja": "その日、孫悟空は皆と普段どおりに過ごしながら、斜月三星洞（しゃげつさんせいどう。須菩提祖師の住む修行の洞窟）の前で時の流れを待った。早く夜にならないかと気が気でなかった。夕暮れになると、皆と一緒に寝床へ入り、目を閉じたふりをして呼吸を整え、心を静めた。山には時を告げる夜回りも水時計の知らせもなく、時刻はわからない。孫悟空は鼻から出入りする息を数え、真夜中になったと思われるころ、そっと起きて衣を着、表の戸を忍び開けた。仲間から離れて外へ出て空を仰ぐと、こんな夜景が広がっていた。"
  "translation_status": "reviewed"
- "id": "xy-ch02-012"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    月明清露冷，八極迥無塵。
    深樹幽禽宿，源頭水溜汾。
    飛螢光散影，過雁字排雲。
    正直三更候，應該訪道真。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 11
  "translation_ja": |-
    月は明るく、澄んだ露は冷たく、はるかな八方の空に塵ひとつない。
    木々の奥では夜鳥が眠り、水源からは清らかな流れがほとばしる。
    飛ぶ蛍は光の点を散らし、渡る雁は空に文字の列を描く。
    いままさに真夜中。真の道を授かりに行く時が来た。
  "translation_status": "reviewed"
- "id": "xy-ch02-013"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "你看他從舊路徑至後門外，只見那門兒半開半掩。悟空喜道：「老師父果然注意與我傳道，故此開著門也。」即曳步近前，側身進得門裡，只走到祖師寢榻之下。見祖師踡跼身軀，朝裡睡著了。悟空不敢驚動，即跪在榻前。那祖師不多時覺來，舒開兩足，口中自吟道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 12
  "translation_ja": |-
    孫悟空はいつもの小道を通って裏口へ回った。戸はわずかに開いていた。
    孫悟空「やはりお師匠さまは、俺に道を授けるおつもりなのだ。だから戸を開けておいてくださった」と孫悟空は喜んだ。忍び足で近寄り、体を横にして戸をくぐり、須菩提祖師の寝台の前まで進んだ。須菩提祖師は体を丸め、壁の方を向いて眠っている。孫悟空は起こさぬよう寝台の前にひざまずいた。やがて須菩提祖師が目覚め、両足を伸ばして、口ずさむように言った。
  "translation_status": "reviewed"
- "id": "xy-ch02-014"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": "「難！難！難！道最玄，莫把金丹作等閑。不遇至人傳妙訣，空言口困舌頭乾！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 13
  "translation_ja": |-
    須菩提祖師「難しい、難しい、まことに難しい。道の奥義はきわめて深い。
    不老不死の丹（たん。不老長生を求める仙術の薬や、体内で練る生命の精髄）の道を、たやすいものと思うな。
    優れた師から秘訣を授からなければ、
    いくら言葉を重ねても、舌が乾いて疲れるだけだ」
  "translation_status": "reviewed"
- "id": "xy-ch02-015"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空應聲叫道：「師父，弟子在此跪候多時。」祖師聞得聲音是悟空，即起披衣，盤坐喝道：「這猢猻，你不在前邊去睡，卻來我這後邊作甚？」悟空道：「師父昨日壇前對眾相允，教弟子三更時候，從後門裡傳我道理，故此大膽徑拜老爺榻下。」祖師聽說，十分歡喜，暗自尋思道：「這廝果然是個天地生成的，不然，何就打破我盤中之暗謎也？」悟空道：「此間更無六耳，止只弟子一人，望師父大捨慈悲，傳與我長生之道罷，永不忘恩。」祖師道：「你今有緣，我亦喜說。既識得盤中暗謎，你近前來，仔細聽之，當傳與你長生之妙道也。」悟空叩頭謝了，洗耳用心，跪於榻下。祖師云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 14
  "translation_ja": |-
    孫悟空がすかさず声をかけた。
    孫悟空「お師匠さま、弟子の私はここで長いことひざまずいてお待ちしております」
    須菩提祖師は孫悟空の声と知ると、身を起こして衣を羽織り、あぐらをかいて叱った。
    須菩提祖師「この猿め、表で寝ていないで、なぜここに来た」
    孫悟空「お師匠さまは昨日、講壇で皆の前に、真夜中になったら裏口から入って教えを授けてくださると示されました。そこで恐れながら、こうして寝台の前に参りました」
    須菩提祖師は大いに喜び、心の中で思った。
    須菩提祖師（心中）「やはりこの者は天地から生まれた非凡なものだ。そうでなければ、私の仕込んだ暗号をどうして読み解けよう」
    孫悟空「ここには余計な耳はありません。弟子の私一人だけです。どうかお慈悲をもって、不老不死の道をお授けください。このご恩は決して忘れません」
    須菩提祖師「お前には縁がある。私も喜んで教えよう。暗号を理解したのなら、近くへ来てよく聞くがよい。永遠の命に至る妙法（みょうほう。奥深く優れた教えや方法）を伝えよう」
    孫悟空は額をついて礼を述べ、寝台のそばでひざまずき、全神経を耳に集めた。須菩提祖師はこう説いた。
  "translation_status": "reviewed"
- "id": "xy-ch02-016"
  "section_id": "chapter-02"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    顯密圓通真妙訣，惜修性命無他說。
    都來總是精氣神，謹固牢藏休漏泄。
    休漏泄，體中藏，汝受吾傳道自昌。
    口訣記來多有益，屏除邪慾得清涼。
    得清涼，光皎潔，好向丹臺賞明月。
    月藏玉兔日藏烏，自有龜蛇相盤結。
    相盤結，性命堅，卻能火裡種金蓮。
    攢簇五行顛倒用，功完隨作佛和仙。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 15
  "translation_ja": |-
    表に現れた教えも秘伝も、すべてを貫く真の奥義はひとつ。
    心の本性と命を大切に修めるより、ほかに道はない。
    突き詰めれば、生命を支える精（せい。道教で生命の根本とされる精髄）と気と精神の働きに尽きる。
    それを厳しく守り、体の内に収めて漏らしてはならぬ。
    漏らさずに体内に保てば、授けた道はおのずから育つ。
    教えをよく覚え、よこしまな欲を払い、澄んだ心を得よ。
    心が澄めば光は清らかになり、心の奥で明月を愛でられる。
    月には玉の兎（たまのうさぎ。月にすむとされる兎で、月を象徴する）、日には金の烏（きんのからす。太陽にすむとされる烏で、太陽を象徴する）が宿り、陰と陽（いんとよう。万物を成す対の働き）は亀と蛇のように絡み合う。
    亀と蛇が結び合えば、本性と命の根は揺るがず、炎の中にも黄金の蓮が咲く。
    五つの元素の働きを集めて逆に巡らせれば、修行が満ちて仏とも仙人ともなれる。
  "translation_status": "reviewed"
- "id": "xy-ch02-017"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時說破根源，悟空心靈福至，切切記了口訣。對祖師拜謝深恩，即出後門觀看。但見東方天色微舒白，西路金光大顯明。依舊路，轉到前門，輕輕的推開進去，坐在原寢之處，故將床鋪搖響道：「天光了，天光了，起耶！」那大眾還正睡哩，不知悟空已得了好事。當日起來打混，暗暗維持，子前午後，自己調息。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 16
  "translation_ja": |-
    命の根本が明かされると、孫悟空にはひらめくものがあり、教えの言葉を一つ残らず心に刻んだ。須菩提祖師に深く礼をして裏口から出ると、東の空にはほのかに白みが差し、西方にも金色の光が広がっていた。孫悟空は来た道を戻って表の戸を静かに開け、自分の寝床に腰を下ろし、わざと寝具を揺らして音を立てた。
    孫悟空「夜が明けたぞ、夜が明けたぞ。起きよう！」仲間たちはまだ眠っており、孫悟空が秘伝を授かったことなど知らない。その日から孫悟空は皆と普段どおりに過ごしつつ、ひそかに教えを守り、真夜中や真昼には一人で呼吸を整えて修行した。
  "translation_status": "reviewed"
- "id": "xy-ch02-018"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻早過了三年，祖師復登寶座，與眾說法。談的是公案比語，論的是外像包皮。忽問：「悟空何在？」悟空近前跪下：「弟子有。」祖師道：「你這一向修些甚麼道來？」悟空道：「弟子近來法性頗通，根源亦漸堅固矣。」祖師道：「你既通法性，會得根源，已注神體，卻只是防備著三災利害。」悟空聽說，沉吟良久道：「師父之言謬矣。我嘗聞道高德隆，與天同壽；水火既濟，百病不生。卻怎麼有個『三災利害』？」祖師道：「此乃非常之道：奪天地之造化，侵日月之玄機；丹成之後，鬼神難容。雖駐顏益壽，但到了五百年後，天降雷災打你，須要見性明心，預先躲避。躲得過，壽與天齊；躲不過，就此絕命。再五百年後，天降火災燒你。這火不是天火，亦不是凡火，喚做『陰火』。自本身湧泉穴下燒起，直透泥垣宮，五臟成灰，四肢皆朽，把千年苦行，俱為虛幻。再五百年，又降風災吹你。這風不是東南西北風，不是和薰金朔風，亦不是花柳松竹風，喚做『贔風』。自顖門中吹入六腑，過丹田，穿九竅，骨肉消疏，其身自解。所以都要躲過。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 17
  "translation_ja": |-
    それから三年が過ぎた。須菩提祖師は再び高座に上がり、弟子たちに法を説いた。古人の問答やたとえ話を引き、目に見える姿とその内に隠された意味とを論じた。ふと須菩提祖師が尋ねた。
    須菩提祖師「悟空はどこにいる」
    孫悟空は進み出てひざまずいた。
    孫悟空「弟子の私はここにおります」
    須菩提祖師「このところ、どんな修行をしている」
    孫悟空「最近は教えの本質もかなり理解でき、命の根本も次第に固まってまいりました」
    須菩提祖師「本質を理解し、根本を会得し、体に仙の力が宿ったのなら、あとは三つの大災難に備えねばならぬ」
    孫悟空はしばらく考え込んで言った。
    孫悟空「お師匠さまのお言葉はおかしいと思います。道の極みに達し徳を積めば天と同じく長生きでき、陰陽の働きが調えば病にもならないと聞きました。それなのに三つの災難があるとは、どういうことですか」
    須菩提祖師「この道は尋常ではない。天地の造化（ぞうか。天地が万物を生み育てる働き）の力を奪い、日月の奥深い仕組みに入り込む。仙の丹が完成すれば、鬼神もそれを許してはおかぬ。若さを保ち寿命を延ばしても、五百年たてば天から雷の災いが下ってお前を打つ。そのときは本性を悟って心を澄まし、あらかじめ避けねばならない。逃れれば天とともに生きられるが、逃れ損なえばその場で命が絶える。さらに五百年たてば、火の災いが下る。ただの天の火でも世俗の火でもなく、体の内から生じる『陰の火（いんのひ。仙術修行者を体内から焼くという災いの火）』だ。足の裏にある湧泉（ゆうせん。足の裏にあるつぼ）というつぼから燃え上がり、頭の奥の泥丸宮（でいがんきゅう。道教で頭の内に想定する、精神を宿す場所）まで貫いて、五臓（ごぞう。伝統医学でいう肝・心・脾・肺・腎）は灰となり、四肢は朽ち、千年の苦行も水の泡となる。そこからまた五百年後には、風の災いが下る。東西南北から吹く風でも、穏やかな風や冷たい風でも、草木を揺らす風でもない。体を内側から壊す特別な魔の風だ（原文では「贔風」と呼ぶ）。頭頂から体内の六腑（ろっぷ。伝統医学でいう胆・胃・腸・膀胱などの内臓）へ吹き込み、へその奥を通って九つの穴を突き抜け、骨も肉も崩れ、体がばらばらになってしまう。だからこの三つをすべて避けねばならない」
  "translation_status": "reviewed"
- "id": "xy-ch02-019"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "悟空聞說，毛骨悚然，叩頭禮拜道：「萬望老爺垂憫，傳與躲避三災之法，到底不敢忘恩。」祖師道：「此亦無難，只是你比他人不同，故傳不得。」悟空道：「我也頭圓頂天，足方履地，一般有九竅四肢，五臟六腑，何以比人不同？」祖師道：「你雖然像人，卻比人少腮。」原來那猴子孤拐面，凹臉尖嘴。悟空伸手一摸，笑道：「師父沒成算。我雖少腮，卻比人多這個素袋，亦可准折過也。」祖師說：「也罷，你要學那一般？有一般天罡數，該三十六般變化；有一般地煞數，該七十二般變化。」悟空道：「弟子願多裡撈摸，學一個地煞變化罷。」祖師道：「既如此，上前來，傳與你口訣。」遂附耳低言，不知說了些甚麼妙法。這猴王也是他一竅通時百竅通，當時習了口訣，自修自煉，將七十二般變化都學成了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 18
  "translation_ja": |-
    これを聞いた孫悟空は、髪の毛も骨も震える思いで額を地につけた。
    孫悟空「どうかお慈悲を。三つの災難を避ける術をお授けください。このご恩は一生忘れません」
    須菩提祖師「それは難しくない。だが、お前は人間とは違うので、教えられぬ」
    孫悟空「私も丸い頭で天を仰ぎ、足で大地を踏んでおります。人間と同じように九つの穴、四肢、五臓六腑もあります。いったい何が違うのですか」
    須菩提祖師「人間に似ているが、お前には頬が足りぬ」
    実際、孫悟空は頬骨が張り、頬がくぼんで口先のとがった猿の顔をしていた。孫悟空は顔に手を当てて笑った。
    孫悟空「お師匠さま、それは勘定が合いません。頬は足りなくとも、代わりにこの頬袋がありますから、差し引き同じでしょう」
    須菩提祖師「よろしい。ではどちらを学ぶか。天の星の数に応じた三十六通りの変身術と、地の星の数に応じた七十二通りの変身術がある」
    孫悟空「弟子の私は多い方をいただきたいので、七十二通りの方を学びます」
    須菩提祖師「それならこちらへ来い。秘訣を授けよう」
    須菩提祖師は孫悟空の耳元で低く語った。何を伝えたのか、ほかの者にはわからない。孫悟空は一つの道理が通れば百の道理が開けるほど飲み込みが早い。教えを受けると自分で修練を重ね、ついに七十二通りの変身をすべて身につけた。
  "translation_status": "reviewed"
- "id": "xy-ch02-020"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "忽一日，祖師與眾門人在三星洞前戲玩晚景。祖師道：「悟空，事成了未曾？」悟空道：「多蒙師父海恩，弟子功果完備，已能霞舉飛昇也。」祖師道：「你試飛舉我看。」悟空弄本事，將身一聳，打了個連扯跟頭，跳離地有五六丈，踏雲霞去勾有頓飯之時，返復不上三里遠近，落在面前，扠手道：「師父，這就是飛舉騰雲了。」祖師笑道：「這個算不得騰雲，只算得爬雲而已。自古道：『神仙朝遊北海暮蒼梧。』似你這半日，去不上三里，即爬雲也還算不得哩。」悟空道：「怎麼為『朝遊北海暮蒼梧』？」祖師道：「凡騰雲之輩，早辰起自北海，遊過東海、西海、南海，復轉蒼梧。蒼梧者，卻是北海零陵之語話也。將四海之外，一日都遊遍，方算得騰雲。」悟空道：「這個卻難，卻難。」祖師道：「世上無難事，只怕有心人。」悟空聞得此言，叩頭禮拜，啟道：「師父，為人須為徹，索性捨個大慈悲，將此騰雲之法，一發傳與我罷，決不敢忘恩。」祖師道：「凡諸仙騰雲，皆跌足而起，你卻不是這般。我才見你去，連扯方才跳上。我今只就你這個勢，傳你個觔斗雲罷。」悟空又禮拜懇求，祖師卻又傳個口訣道：「這朵雲，捻著訣，念動真言，攢緊了拳，將身一抖，跳將起來，一觔斗就有十萬八千里路哩。」大眾聽說，一個個嘻嘻笑道：「悟空造化，若會這個法兒，與人家當鋪兵、送文書、遞報單，不管那裡都尋了飯吃。」師徒們天昏各歸洞府。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch2-2449088"
    "precision": "work"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第002回&oldid=2449088&variant=zh-hant"
    "source_sequence": 19
  "translation_ja": |-
    ある日のこと、須菩提祖師は弟子たちと斜月三星洞の前で夕景を眺めながらくつろいでいた。須菩提祖師が尋ねた。
    須菩提祖師「悟空、修行は成就したか」
    孫悟空「お師匠さまの海より深いご恩のおかげで修行は実を結び、雲に乗って飛ぶこともできるようになりました」
    須菩提祖師「では飛んで見せよ」
    孫悟空は得意になって体を跳ね上げ、くるくると宙返りして地上五、六丈（じょう。長さの単位で十尺。実際の長さは時代によって異なる）ほどまで舞い上がり、雲を踏んで飛び回った。だが、食事を一度するほどの時間をかけても、行って帰って三里（り。道のりの単位。実際の長さは時代によって異なる）にも満たない。須菩提祖師の前に降り立つと、両手を組んで言った。
    孫悟空「お師匠さま、これが私の雲に乗って飛ぶ術です」
    須菩提祖師は笑った。
    須菩提祖師「そんなものは『雲に乗る』とは言えぬ。せいぜい雲の上をはい回る程度だ。昔から『仙人は朝、北海（ほっかい。四方の海のうち北にある海）を訪れ、夕べには蒼梧（そうご。仙人の旅の行き先として挙げられる地名）に至る』と言う。お前は半日かけても三里に届かない。それでは、はい回るとも言えぬほどだ」
    孫悟空「朝は北海、夕べには蒼梧とはどういうことですか」
    須菩提祖師「真に雲に乗れる者は、朝、北海を出発し、東海（とうかい。四方の海のうち東にある海）、西海（さいかい。四方の海のうち西にある海）、南海（なんかい。四方の海のうち南にある海）を巡って、蒼梧へ戻る。蒼梧とは北海や零陵（れいりょう。中国南部の古い地名で、蒼梧に関連して挙げられる土地）という地名にも結びつけて語られる土地のことだ。四つの海の彼方まで一日のうちに巡って初めて、雲に乗れると言えるのだ」
    孫悟空「それは難しい、難しい」
    須菩提祖師「この世に不可能なことはない。ただ、やり遂げる気持ちがあるかどうかだ」
    孫悟空はその言葉を聞き、深々と礼をした。
    孫悟空「お師匠さま、助けてくださるなら最後までお助けください。どうか雲に乗る術も一緒にお授けください。このご恩は決して忘れません」
    須菩提祖師「仙人たちは普通、足を踏み出して雲に乗る。だが、お前はそうではない。さっきは宙返りを繰り返して飛び上がったな。ならば、その身のこなしに合わせ、筋斗雲（きんとうん。宙返り一つで十万八千里を進む仙術の雲）の術を授けてやろう」
    孫悟空がさらに頭を下げて頼むと、須菩提祖師は呪文を教えた。
    須菩提祖師「指で印（いん。術や祈りのため指で結ぶ決まった形）を結び、真言（しんごん。神聖な力があるとされる呪文）を唱え、拳を固く握り、体をひと振りして跳び上がるのだ。一度宙返りをすれば、十万八千里も進める」
    弟子たちはくすくす笑った。
    弟子たち「悟空は運がいい。そんな術ができれば、人に雇われて使い走りをし、手紙や知らせを届けて、どこへ行っても食べていけるぞ」
    やがて日が暮れ、師弟はそれぞれ洞内へ戻った。

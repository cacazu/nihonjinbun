    "description_ja": "著者欄、前後回案内、サイトナビゲーションとフッター。"
  "known_gaps":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-003"
    "description_ja": "『三山門』は三門・山門に関わる表現と考えられるが、建築の数や配置を確定せず、原語を残した。『五福堂』も堂名として保持する。 『有色有顏隨傲麗』は語構成に不自然さを残す。色と姿が気高く美しいさまと解し、原字は補訂しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-006"
    "description_ja": "底本は門から出る僧を『一眾僧』とするが、その後は単独の『那和尚』が応対する。冒頭の集団を一人へ訂正せず、以後の話者は寺の和尚とした。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-007"
    "description_ja": "『左笄帽』は僧帽の名前として保持する。『無垢衣』は汚れのない僧衣の表現。具体的な形状を推測で本文に補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-009"
    "description_ja": "『道人』はこの寺で殿の戸を開き、後に庫を開ける下働きと解した。道教の道士がいると断定しない。 『做一日和尚撞一日鐘』は文字どおりの行動を踏まえた諺として残す。一般的な怠慢の意味だけで訳して、鐘を撞く場面を消さない。 『孫外公』の外公は母方の祖父の字義だが、相手より上位と誇る罵倒として『お前らの祖父たる孫さま』と訳した。実際の血縁とみなさない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-011"
    "description_ja": "老僧の本名はこの回では明示されず、後世の通称である金池長老を本文へ補わない。 『驪山老母』『東海龍君』は容貌の比喩。場面にその神々が現れたことにはしない。驪山老母の日本語読みは推定。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-012"
    "description_ja": "『收了一眾小徒』は字面では弟子の一群となるが、前後の物語では行者一人を得ている。底本の数を勝手に訂正せず、『一群の未熟な弟子』と訳して留保する。 『西番哈咇國』の哈咇国は底本の表記を保持し、哈密などの実在地へ無断で同定・改称しない。 年齢を行者へ尋ねる末尾の『那和尚』は直前の老僧を指すとも読めるが、初めの和尚への戻りも排除できない。ラベルを『和尚』として人物の断定を避けた。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-013"
    "description_ja": "『法藍』は琺瑯・七宝をいう異表記として原語を残し、意味を段落末の説明に分けた。中国語の語義は調べたが、法藍という表記全体の慣用日本語読みは未確認。 袈裟を持ってこさせる『叫』は直前の院主を主語と読んだ。その後は老僧が下働きと頭陀を使う。二人を同じ人物にまとめない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-015"
    "description_ja": "『龍鬚』は字面の『竜の鬚』を保ち、具体的な織りや装飾の材質は断定しない。 『托化天仙親手製』を姿を現した天仙の手製と解したが、托化の具体的な経緯は明示されない。天女など別の人物を創作しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-017"
    "description_ja": "『兩個徒孫』の問いは二人の孫弟子の合同発言。その後の『小和尚』は個人が特定できない若い僧とする。次の段落の広智・広謀を先取りしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-019"
    "description_ja": "廣謀の発言の『東山』は原語を保持する。後の黒風山の方角説明と無断でそろえない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-022"
    "description_ja": "『順手牽羊』は好機に乗じて利を得る諺。ここでは相手の放火の企てに乗じて住む所を奪う意味と解した。実際に羊を盗む動作はない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-023"
    "description_ja": "南天門の龐・劉・苟・畢・馬・趙・温・関は姓のみを保持し、未記載のフルネームを補わない。馬は四健将の馬元帥とは別の神将。辞書でも別義として登録する。 『控背』は身を低くして背を曲げる動きと解した。『躬身』との並列を消さず、前の四人と後の四人を別々に描写した。 広目天王の語る神々の派遣は人物の伝聞として保持し、原文にない派遣手続きを足さない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-024"
    "description_ja": "『巽地』は東南の方角を指す語義を採用。風に対応する八卦との関係は説明に留め、地の文の人物名は三蔵に統一した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-025"
    "description_ja": "『南方三炁』は南方の火の力を神格化した表現と解したが、三炁の詳細な構成や特定神の同定は未確定。 『熱油門前飄彩燄』は熱油と門前の構文関係が難解。『熱油の門前に彩りの炎が漂い』と全語を保って暫定訳し、油を注ぐという原文にない動作は補わなかった。独立校訂で確認が必要。 『老祖開爐』の老祖は炉を持つ太上老君を指すと解したが、原文は固有名を明記しない。 『東院伽藍』は逃げ隠れする並列から寺を守る伽藍神と解した。建物自体が逃げるという読みも比喩上は排除できず、解釈である。 赤壁と阿房宮の火は文学的な歴史・伝承への比喩として保持する。阿房宮焼失の伝承を考古学的事実として保証しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-027"
    "description_ja": "黒風山はここでは寺の真南二十里、後の院主の説明では東南となる。妖怪が帰る先も東山となり、方角のずれは底本どおり残した。 妖怪は初め火を消そうとして来るが、袈裟を見ると盗む。初めから盗み目的だったと改めない。熊の正体を語り手が明かすのは結びの詩なので、この段落は妖怪と呼ぶ。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-029"
    "description_ja": "『爛板凳，高談闊論』は腰掛けが腐るほど座って大きな話をする昔の暮らしと解した。文字どおり壊れた椅子を持つ話にはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-030"
    "description_ja": "虎の諺は底本が『人沒傷虎心，虎沒傷人意』と二つとも否定する形。よく知られた別形へ無断で直さず、そのまま訳した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-031"
    "description_ja": "『更不曾燎灼了半分』の半分は微量をいう。二分の一とはせず、『少しも焦げていない』と訳した。 ここで質問する気丈な二人の和尚を、先の二人の孫弟子や広智・広謀と同定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-032"
    "description_ja": "老僧の自死は文学的叙述の範囲を保ち、原文にない動機の断定・称揚・手段の補足は加えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-033"
    "description_ja": "『但將容易為長久，定是蕭條取敗功』は安易な計略で長く得ようとして失敗するとの警句と解した。容易・長久・蕭條・敗功の関係には文言上の留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-034"
    "description_ja": "『老死鬼』はすでに死んだ老僧への罵倒として『死んだ老いぼれ』とする。『看著…看也不曾敢看』という僧たちの弁明のずれは、語り手の前段を訂正せず発言として保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "segment_ids":
    - "xy-ch16-037"
    "description_ja": "底本は『金禪』とする。同音の金蝉へ原文も訳文も無断で訂正せず、訳は『金禅』とした。指示対象は取経の三蔵。 結びの詩がここで初めて盗人を『黑熊』と明かす。前の妖怪の場面へ情報を繰り上げない。 本文の欠落ではなく解釈・校訂上の留保。"

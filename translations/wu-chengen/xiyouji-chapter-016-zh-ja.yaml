  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "結びの詩がここで初めて盗人を『黑熊』と明かす。前の妖怪の場面へ情報を繰り上げない。"
- "id": "xy-ch16-038"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟此去不知袈裟有無，吉凶如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 186
    "line_end": 186
  "translation_ja": "さて、このたび行って袈裟が見つかるのかどうか、吉と出るか凶と出るか。それは次回の解き明かしをお聞きあれ。"
  "translation_status": "reviewed"

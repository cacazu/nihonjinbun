- "id": "xy-ch16-002"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說他師徒兩個策馬前來，直至山門首觀看，果然是一座寺院。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 121
    "line_end": 121
  "translation_ja": "さて、師弟二人は馬を進め、山門の前まで来て眺めると、果たして一軒の寺であった。その様子はというと。"
  "translation_status": "reviewed"
- "id": "xy-ch16-003"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": "層層殿閣，疊疊廊房。三山門外，巍巍萬道彩雲遮；五福堂前，豔豔千條紅霧遶。兩路松篁，一林檜柏。兩路松篁，無年無紀自清幽；一林檜柏，有色有顏隨傲麗。又見那鐘鼓樓高，浮屠塔峻。安禪僧定性，啼樹鳥音閑。寂寞無塵真寂寞，清虛有道果清虛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 123
    "line_end": 123
  "translation_ja": "幾重にも重なる殿閣、幾列にも連なる回廊と僧房。三山門（さんさんもん）の外は、そびえる万筋の彩雲に覆われ、五福堂（ごふくどう）の前には、鮮やかな千筋の紅の霞が巡る。両側の道には松と竹、一面の林には檜と柏。両側の松と竹は、いつからとも知れず静かに澄み、一面の檜と柏は、それぞれの色と姿で気高く美を競う。さらに鐘楼と鼓楼は高く、浮屠（ふと）の塔は険しくそびえる。禅に安んじる僧は本性を定め、木に鳴く鳥の声はのどか。寂として塵なき、まことの静寂。清く虚しく道を備えた、まことの清虚。"
  "translation_status": "reviewed"

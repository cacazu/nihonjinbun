- "id": "xy-ch16-005"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    上剎祇園隱翠窩，招提勝景賽娑婆。
    果然淨土人間少，天下名山僧占多。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 127
    "line_end": 128
  "translation_ja": |-
    緑の奥に隠れた名刹は祇園（ぎおん）のごとく、招提（しょうだい）の勝景は娑婆（しゃば）にまさる。
    まこと人の世にこのような浄土は少なく、天下の名山は僧の占めるものが多い。
  "translation_status": "reviewed"
- "id": "xy-ch16-006"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長老下了馬，行者歇了擔，正欲進門，只見那門裡走出一眾僧來。你看他怎生模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 130
    "line_end": 130
  "translation_ja": "三蔵（さんぞう）は馬を下り、行者（ぎょうじゃ）は荷を下ろし、門を入ろうとしたところ、門の中から一群の僧が出てきた。その姿を見れば。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本は門から出る僧を『一眾僧』とするが、その後は単独の『那和尚』が応対する。冒頭の集団を一人へ訂正せず、以後の話者は寺の和尚とした。"
- "id": "xy-ch16-007"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭戴左笄帽，身穿無垢衣。
    銅環雙墜耳，絹帶束腰圍。
    草履行來穩，木魚手內提。
    口中常作念，般若總皈依。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 132
    "line_end": 135
  "translation_ja": |-
    頭には左笄帽（さけいぼう）、身には無垢衣（むくえ）。
    銅の輪が両耳に垂れ、絹の帯が腰を巻く。
    草履の足取りは落ち着き、手には木魚を提げる。
    口にはいつも念誦を絶やさず、ひたすら般若（はんにゃ）に帰依する。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『左笄帽』は僧帽の名前として保持する。『無垢衣』は汚れのない僧衣の表現。具体的な形状を推測で本文に補わない。"
- "id": "xy-ch16-008"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏見了，侍立門傍，道個問訊。那和尚連忙答禮，笑道：「失瞻。」問：「是那裡來的？請入方丈獻茶。」三藏道：「我弟子乃東土欽差，上雷音寺拜佛求經。至此處天色將晚，欲借上剎一宵。」那和尚道：「請進裡坐，請進裡坐。」三藏方喚行者牽馬進來。那和尚忽見行者相貌，有些害怕，便問：「那牽馬的是個甚麼東西？」三藏道：「悄言，悄言。他的性急，若聽見你說是甚麼東西，他就惱了。他是我的徒弟。」那和尚打了個寒噤，咬著指頭道：「這般一個醜頭怪腦的，好招他做徒弟？」三藏道：「你看不出來哩，醜自醜，甚是有用。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    三蔵はそれを見ると、門の脇に立って挨拶した。寺の和尚は急いで礼を返し、笑って言った。
    寺の和尚「お迎えもいたしませんで。」
    寺の和尚「どちらからおいでですか。方丈（ほうじょう）へお入りください。お茶を差し上げましょう。」
    三蔵「私は東土（とうど）から勅命を受けて参った僧で、雷音寺（らいおんじ）へ仏を拝し、経を求めに行くところです。ここまで来るうち日も暮れかかりましたので、お寺で一晩宿をお借りしたいのです。」
    寺の和尚「どうぞ中へ、どうぞ中へお入りください。」
    そこで三蔵は行者を呼び、馬を引いて入らせた。和尚は不意に行者の顔を見て、少し怖くなり、尋ねた。
    寺の和尚「その馬を引いているのは、いったい何という代物ですか。」
    三蔵「お静かに、お静かに。気の短い者ですから、代物とは何だと聞きつければ怒ります。私の弟子なのです。」
    和尚はぶるっと震え、指をかみながら言った。
    寺の和尚「あのような醜い顔、怪しげな頭の者を、よくも弟子になさいましたな。」
    三蔵「見かけではお分かりにならないでしょう。醜いには違いありませんが、とても役に立つのです。」
  "translation_status": "reviewed"
- "id": "xy-ch16-009"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那和尚只得同三藏與行者進了山門。山門裡，又見那正殿上書四個大字，是「觀音禪院」。三藏又大喜道：「弟子屢感菩薩聖恩，未及叩謝。今遇禪院，就如見菩薩一般，甚好拜謝。」那和尚聞言，即命道人開了殿門，請三藏朝拜。那行者拴了馬，丟了行李，同三藏上殿。三藏展背舒身，鋪胸納地，望金像叩頭。那和尚便去打鼓。行者就去撞鐘。三藏俯伏臺前，傾心禱祝。祝拜已畢，那和尚住了鼓，行者還只管撞鐘不歇，或緊或慢，撞了許久。那道人道：「拜已畢了，還撞鐘怎麼？」行者方丟了鐘杵，笑道：「你那裡曉得！我這是『做一日和尚撞一日鐘』的。」此時卻驚動那寺裡大小僧人、上下房長老，聽得鐘聲亂響，一齊擁出道：「那個野人在這裡亂敲鐘鼓？」行者跳將出來，咄的一聲道：「是你孫外公撞了耍子的。」那些和尚一見了，諕得跌跌滾滾，都爬在地下道：「雷公爺爺！」行者道：「雷公是我的重孫兒哩。起來，起來，不要怕，我們是東土大唐來的老爺。」眾僧方才禮拜。見了三藏，都才放心不怕。內有本寺院主請道：「老爺們到後方丈中奉茶。」遂而解韁牽馬，擡了行李，轉過正殿，徑入後房，序了坐次。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    和尚は仕方なく、三蔵と行者を連れて山門を入った。中へ入ると、正殿には「観音禅院（かんのんぜんいん）」の四つの大字が掲げられていた。三蔵はまた大いに喜んだ。
    三蔵「私はたびたび菩薩（ぼさつ）さまの尊いお恵みを受けながら、まだお礼を申し上げておりません。この禅院に巡り合えたのは、菩薩さまにお会いしたも同然です。ありがたく拝んで、お礼を申し上げましょう。」
    和尚はそれを聞くと、寺の下働きに殿の戸を開かせ、三蔵を参拝に招いた。行者は馬をつなぎ、荷物を置いて、三蔵とともに殿へ上がった。三蔵は背を伸ばし、全身を伏せ、胸を地につけて、金色の像に向かって額づいた。和尚は太鼓を打ちに行き、行者は鐘を撞きに行った。三蔵は台の前にひれ伏し、心を尽くして祈った。祈りと礼拝が済むと、和尚は太鼓をやめたが、行者はなおも鐘を撞きやめず、速くしたり遅くしたりしながら、長いこと撞き続けた。寺の下働きが言った。
    寺の下働き「お参りは済んだのに、まだ鐘を撞いてどうするのです。」
    行者はようやく撞木を放し、笑った。
    行者「お前に何が分かる。俺は『一日和尚をやるなら、一日鐘を撞く』というやつさ。」
    このとき、乱れ鳴る鐘の音に寺の大小の僧や上下の僧房の長老たちが驚き、一斉に押し出してきた。
    僧たち「どこの野人が、ここで鐘や太鼓をやたらに鳴らしているのだ。」
    行者は跳び出し、かっと一声叫んだ。
    行者「お前らの祖父たる孫（そん）さまが、面白半分に撞いたんだ。」
    僧たちはその姿を見ると、驚いて転び転がり、みな地に這いつくばった。
    僧たち「雷公（らいこう）のおじいさま！」
    行者「雷公なら俺のひ孫だぞ。起きろ、起きろ、怖がるな。俺たちは東土の大唐（だいとう）から来たお方だ。」
    僧たちはようやく礼をし、三蔵を見て、みな安心し恐れなくなった。その中のこの寺の院主が招いた。
    院主「お二方、奥の方丈でお茶を差し上げましょう。」
    こうして手綱を解いて馬を引き、荷物を担ぎ、正殿を回ってまっすぐ奥の部屋へ入り、席次に従って座った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『道人』はこの寺で殿の戸を開き、後に庫を開ける下働きと解した。道教の道士がいると断定しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『做一日和尚撞一日鐘』は文字どおりの行動を踏まえた諺として残す。一般的な怠慢の意味だけで訳して、鐘を撞く場面を消さない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『孫外公』の外公は母方の祖父の字義だが、相手より上位と誇る罵倒として『お前らの祖父たる孫さま』と訳した。実際の血縁とみなさない。"
- "id": "xy-ch16-010"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那院主獻了茶，又安排齋供。天光尚早，三藏稱謝未畢，只見那後面有兩個小童，攙著一個老僧出來。看他怎生打扮："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 138
    "line_end": 138
  "translation_ja": "院主は茶を差し出し、精進の食事も用意した。まだ日は暮れていなかった。三蔵が礼を述べ終わらぬうち、奥から二人の童子に支えられて、一人の老僧が出てきた。その身なりはというと。"
  "translation_status": "reviewed"
- "id": "xy-ch16-011"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭上戴一頂毘盧方帽，貓睛石的寶頂光輝；身上穿一領錦絨褊衫，翡翠毛的金邊晃亮。一對僧鞋攢八寶，一根拄杖嵌雲星。滿面皺痕，好似驪山老母；一雙昏眼，卻如東海龍君。口不關風因齒落，腰駝背屈為筋攣。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 140
    "line_end": 140
  "translation_ja": "頭にかぶるは毘盧方帽（びるほうぼう）、頂の猫睛石（びょうせいせき）の宝玉が光を放つ。身にまとうは錦と絨の褊衫（へんさん）、翡翠の羽毛をあしらった金の縁がまばゆい。一足の僧靴には八宝（はっぽう）が集まり、一本の杖には雲と星の飾りがはめ込まれている。顔じゅうのしわは、まるで驪山老母（りざんろうぼ）。かすむ両目は、さながら東海竜君（とうかいりゅうくん）。歯が抜けて口は風を漏らし、筋が縮んで腰も背も曲がっている。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "老僧の本名はこの回では明示されず、後世の通称である金池長老を本文へ補わない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『驪山老母』『東海龍君』は容貌の比喩。場面にその神々が現れたことにはしない。驪山老母の日本語読みは推定。"
- "id": "xy-ch16-012"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾僧道：「師祖來了。」三藏躬身施禮迎接道：「老院主，弟子拜揖。」那老僧還了禮，又各敘坐。老僧道：「適間小的們說，東土唐朝來的老爺，我才出來奉見。」三藏道：「輕造寶山，不知好歹，恕罪，恕罪。」老僧道：「不敢，不敢。」因問：「老爺，東土到此，有多少路程？」三藏道：「出長安邊界，有五千餘里。過兩界山，收了一眾小徒，一路來，行過西番哈咇國，經兩個月，又有五六千里，才到了貴處。」老僧道：「也有萬里之遙了。我弟子虛度一生，山門也不曾出去，誠所謂『坐井觀天』，樗朽之輩。」三藏又問：「老院主高壽幾何？」老僧道：「痴長二百七十歲了。」行者聽見道：「這還是我萬代孫兒哩。」三藏瞅了他一眼道：「謹言，莫要不識高低，衝撞人。」那和尚便問：「老爺，你有多少年紀了？」行者道：「不敢說。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 142
    "line_end": 142
  "translation_ja": |-
    僧たち「師祖さまのおいでです。」
    三蔵は身をかがめ、礼をして迎えた。
    三蔵「老院主さま、僧の私からご挨拶申し上げます。」
    老僧も礼を返し、またそれぞれ席に着いた。
    老僧「先ほど若い者たちから、東土の唐朝（とうちょう）よりおいでのお方と聞きまして、お目にかかりに参りました。」
    三蔵「勝手もわきまえず、軽々しく尊いお山へ参りました。どうかお許しください、お許しください。」
    老僧「とんでもない、とんでもない。」
    続けて尋ねた。
    老僧「お客人、東土からここまでは、どれほどの道のりですかな。」
    三蔵「長安（ちょうあん）を出て国境までは五千余里。両界山（りょうかいざん）を越えて一群の未熟な弟子を取り、西蕃（せいばん）の哈咇国（はひつこく）を通り、道を行くこと二か月、さらに五、六千里を経て、ようやくこちらへ着きました。」
    老僧「では、一万里も離れているのですな。私はむなしく一生を過ごし、山門から出たことさえございません。まことに『井戸に座って天を見る』、朽ちた樗（ちょ）のような役立たずでございます。」
    三蔵はさらに尋ねた。
    三蔵「老院主さまは、おいくつにおなりですか。」
    老僧「愚かにも、二百七十歳まで長らえております。」
    行者はそれを聞いて言った。
    行者「それならまだ、俺の万代後の孫だな。」
    三蔵は行者をじろりとにらんだ。
    三蔵「口を慎みなさい。礼儀もわきまえず、人さまに無礼を働くものではない。」
    和尚が尋ねた。
    和尚「お客人、あなたはおいくつなのですかな。」
    行者「とても言えませんね。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『收了一眾小徒』は字面では弟子の一群となるが、前後の物語では行者一人を得ている。底本の数を勝手に訂正せず、『一群の未熟な弟子』と訳して留保する。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『西番哈咇國』の哈咇国は底本の表記を保持し、哈密などの実在地へ無断で同定・改称しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "年齢を行者へ尋ねる末尾の『那和尚』は直前の老僧を指すとも読めるが、初めの和尚への戻りも排除できない。ラベルを『和尚』として人物の断定を避けた。"
- "id": "xy-ch16-013"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老僧也只當一句瘋話，便不介意，也不再問，只叫獻茶。有一個小幸童，拿出一個羊脂玉的盤兒，有三個法藍鑲金的茶鍾。又一童，提一把白銅壺兒，斟了三杯香茶。真個是色欺榴蕊豔，味勝桂花香。三藏見了，誇愛不盡道：「好物件，好物件，真是美食美器。」那老僧道：「污眼，污眼。老爺乃天朝上國，廣覽奇珍，似這般器具，何足過獎？老爺自上邦來，可有甚麼寶貝，借與弟子一觀？」三藏道：「可憐，我那東土無甚寶貝；就有時，路程遙遠，也不能帶得。」行者在傍道：「師父，我前日在包袱裡，曾見那領袈裟，不是件寶貝？拿與他看看如何？」眾僧聽說袈裟，一個個冷笑。行者道：「你笑怎的？」院主道：「老爺才說袈裟是件寶貝，言實可笑。若說袈裟，似我等輩者，不止二三十件；若論我師祖，在此處做了二百五六十年和尚，足有七八百件。」叫：「拿出來看看。」那老和尚也是他一時賣弄，便叫道人開庫房，頭陀擡櫃子，就擡出十二櫃，放在天井中，開了鎖。兩邊設下衣架，四圍牽了繩子，將袈裟一件件抖開掛起，請三藏觀看。果然是滿堂綺繡，四壁綾羅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    老僧はただのでたらめと思い、気にも留めず、それ以上は聞かずに茶を命じた。一人の小姓が羊脂玉（ようしぎょく）の盆を持ってきた。その上には金を縁にはめた法藍（ほうらん）の茶碗が三つある。もう一人の童子が白銅の急須を提げ、三杯の香り高い茶を注いだ。まこと、その色は柘榴の花の鮮やかさをしのぎ、味わいは桂花（けいか）の香りにまさった。三蔵は見て、褒めて飽かなかった。
    三蔵「よい品ですな、よい品ですな。まこと、美味にも器にもすばらしいものをお使いだ。」
    老僧「お目汚しでございます、お目汚しでございます。お客人は天朝の大国の方、珍宝を広くご覧でございましょう。この程度の器具など、そこまでお褒めにあずかるものでもございません。尊いお国からおいでのお客人には、何か宝物がおありですか。どうか私にも一目拝見させてください。」
    三蔵「あいにく、私の東土には、さしたる宝物などありません。たとえありましても、道のりが遠いので、持っては来られません。」
    脇から行者が言った。
    行者「お師匠さま、このあいだ包みの中に見た袈裟は、宝物ではありませんか。取り出して、見せてやったらどうです。」
    僧たちは袈裟と聞くと、一人残らず鼻で笑った。
    行者「何がおかしい。」
    院主「今、袈裟が宝物だとおっしゃったのが、まことにおかしいのです。袈裟といえば、我らほどの者でも二、三十着どころではありません。我らの師祖に至っては、この地で二百五、六十年も和尚をしておられ、七、八百着は優にございます。」
    院主「持ってきて、お見せしろ。」
    老僧も、その場では見せびらかしたくなり、下働きに蔵を開けさせ、頭陀（ずだ）たちに箱を運ばせた。十二の箱が中庭に据えられ、錠が開けられた。両側に衣桁を並べ、四方に縄を張り、袈裟を一着ずつ広げて掛け、三蔵に見せた。まこと、堂いっぱいに綺羅の刺繍が満ち、四方の壁は綾絹と薄絹で覆われた。
  "translation_status": "reviewed"

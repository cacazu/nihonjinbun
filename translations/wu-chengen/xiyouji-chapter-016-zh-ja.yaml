- "id": "xy-ch16-014"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者一一觀之，都是些穿花納錦，刺繡銷金之物，笑道：「好，好，好。收起，收起。把我們的也取出來看看。」三藏把行者扯住，悄悄的道：「徒弟，莫要與人鬥富。你我是單身在外，只恐有錯。」行者道：「看看袈裟，有何差錯？」三藏道：「你不曾理會得。古人有云：『珍奇玩好之物，不可使見貪婪奸偽之人。』倘若一經入目，必動其心；既動其心，必生其計。汝是個畏禍的，索之而必應其求，可也；不然，則殞身滅命，皆起於此，事不小矣。」行者道：「放心，放心，都在老孫身上。」你看他不由分說，急急的走了去，把個包袱解開，早有霞光迸迸，尚有兩層油紙裹定。去了紙，取出袈裟，抖開時，紅光滿室，彩氣盈庭。眾僧見了，無一個不心歡口讚，真個好袈裟。上頭有："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    行者は一着ずつ見て回った。どれも花模様を縫い、錦を縫いつけ、刺繍を施し、金を散らした品だった。そこで笑った。
    行者「よし、よし、よし。しまえ、しまえ。俺たちのも取り出して見せてやろう。」
    三蔵は行者を引き止め、そっと言った。
    三蔵「弟子よ、人と財宝を競ってはいけない。お前も私も身一つで旅をしているのだ。何か間違いでも起きては困る。」
    行者「袈裟を見るだけで、どんな間違いが起きます。」
    三蔵「お前はまだ分かっていない。昔の人は『珍奇で愛すべき品を、貪欲で邪悪な偽り者に見せてはならない』と言っている。ひとたび目に入れば、必ず欲心が動く。欲心が動けば、必ず悪い企みを生むのだ。お前が災いを恐れ、求められるままに差し出すなら、それでもよかろう。そうしなければ、身を滅ぼし、命を落とすことになる。すべてはここから起こるのであって、小さなことではない。」
    行者「ご安心ください、ご安心ください。すべてこの俺にお任せを。」
    見れば行者は有無を言わせず、せわしなく駆けていって包みを解いた。まだ二重の油紙に包まれているのに、すでに霞のような光がほとばしっていた。紙を取り、袈裟を取り出して振り広げると、紅の光は部屋に満ち、彩りの気は庭いっぱいにあふれた。僧たちは見るなり、喜ばず、口に褒めぬ者は一人もなかった。まことに見事な袈裟。その上には。
  "translation_status": "reviewed"
- "id": "xy-ch16-015"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    千般巧妙明珠墜，萬樣稀奇佛寶攢。
    上下龍鬚鋪綵綺，兜羅四面錦沿邊。
    體掛魍魎從此滅，身披魑魅入黃泉。
    托化天仙親手製，不是真僧不敢穿。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 146
    "line_end": 149
  "translation_ja": |-
    千種の巧みを尽くした明珠が垂れ、万様の珍しい仏宝が集まる。
    上下には竜の鬚が彩りの綾を敷き、兜羅（とら）の四方には錦の縁を巡らす。
    体に掛ければ魍魎（もうりょう）はたちまち滅び、身にまとえば魑魅（ちみ）は黄泉（よみ）へ落ちる。
    姿を現した天仙（てんせん）がみずから作ったもの、真の僧でなければ着る勇気もない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『龍鬚』は字面の『竜の鬚』を保ち、具体的な織りや装飾の材質は断定しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『托化天仙親手製』を姿を現した天仙の手製と解したが、托化の具体的な経緯は明示されない。天女など別の人物を創作しない。"
- "id": "xy-ch16-016"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那老和尚見了這般寶貝，果然動了奸心，走上前，對三藏跪下，眼中垂淚道：「我弟子真是沒緣。」三藏攙起道：「老院師有何話說？」他道：「老爺這件寶貝方才展開，天色晚了，奈何眼目昏花，不能看得明白，豈不是無緣？」三藏教：「掌上燈來，讓你再看。」那老僧道：「爺爺的寶貝已是光亮，再點了燈，一發晃眼，莫想看得仔細。」行者道：「你要怎的看才好？」老僧道：「老爺若是寬恩放心，教弟子拿到後房，細細的看一夜，明早送還老爺西去，不知尊意何如？」三藏聽說，吃了一驚，埋怨行者道：「都是你，都是你。」行者笑道：「怕他怎的？等我包起來，教他拿了去看。但有疏虞，盡是老孫管整。」那三藏阻當不住，他把袈裟遞與老僧道：「憑你看去。只是明早照舊還我，不得損污些須。」老僧喜喜歡歡，著幸童將袈裟拿進去。卻吩咐眾僧，將前面禪堂掃淨，取兩張籐床，安設鋪蓋，請二位老爺安歇；一壁廂又教安排明早齋送行。遂而各散，師徒們關了禪堂，睡下不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    老僧はこのような宝を見ると、果たして邪な心を起こした。進み出て三蔵の前にひざまずき、涙を垂らして言った。
    老僧「僧の私は、まことに縁のない者でございます。」
    三蔵は助け起こした。
    三蔵「老院主さま、どういうことですか。」
    老僧「お客人の宝を、今ようやく広げていただいたところで、もう日が暮れてしまいました。この目はかすんで、はっきり見えません。これが無縁でなくて、何でございましょう。」
    三蔵「灯をともして、もう一度お見せしなさい。」
    老僧「お客人の宝は、すでに光り輝いております。灯までつければ、いっそう目がくらみ、細かく見るなど思いも寄りません。」
    行者「では、どうやって見るのがよいのだ。」
    老僧「お客人が広いお心でお任せくださるなら、私に奥へ持っていかせ、一晩じっくり拝見させていただきたいのです。明朝お返しし、お客人には西へお発ちいただきますが、いかがでございましょう。」
    三蔵は聞いてぎょっとし、行者を責めた。
    三蔵「みなお前のせいだ、みなお前のせいだ。」
    行者は笑った。
    行者「何を怖がることがあります。私が包んで、持っていって見せてやりましょう。何か不始末があれば、すべてこの俺が引き受けます。」
    三蔵には止められなかった。行者は袈裟を老僧に渡して言った。
    行者「好きなだけ見るがいい。ただし明朝、元どおり俺に返せ。少しでも傷つけたり、汚したりするなよ。」
    老僧は大喜びで、小姓に袈裟を奥へ運ばせた。そして僧たちに前の禅堂（ぜんどう）を掃き清め、籐の寝台を二つ出して寝具を整え、二人の客を休ませるように命じた。一方では翌朝の旅立ちの食事も用意させた。こうして皆は散り、師弟は禅堂を閉めて横になった。その話はさておく。
  "translation_status": "reviewed"
- "id": "xy-ch16-017"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那和尚把袈裟騙到手，拿在後房燈下，對袈裟號咷痛哭。慌得那本寺僧不敢先睡。小幸童也不知為何，卻去報與眾僧道：「公公哭到二更時候，還不歇聲。」有兩個徒孫是他心愛之人，上前問道：「師公，你哭怎的？」老僧道：「我哭無緣，看不得唐僧寶貝。」小和尚道：「公公年紀高大，發過了。他的袈裟放在你面前，你只消解開看便罷了，何須痛哭？」老僧道：「看的不長久。我今年二百七十歲，空掙了幾百件袈裟。怎麼得有他這一件？怎麼得做個唐僧？」小和尚道：「師公差了。唐僧乃是離鄉背井的一個行腳僧。你這等年高享用，也夠了，倒要像他做行腳僧，何也？」老僧道：「我雖是坐家自在，樂乎晚景，卻不得他這袈裟穿穿。若教我穿得一日兒，就死也閉眼，也是我來陽世間為僧一場。」眾僧道：「好沒正經。你要穿他的，有何難處？我們明日留他住一日，你就穿他一日；留他住十日，你就穿他十日；便罷了，何苦這般痛哭？」老僧道：「縱然留他住了年載，也只穿得年載，到底也不得氣長。他要去時，只得與他去，怎生留得長遠？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    さて、老僧は袈裟をだまし取ると、奥の部屋の灯の下へ持っていき、袈裟に向かって声を上げ、激しく泣いた。寺の僧たちは慌て、先に寝ることもできない。小姓にも理由が分からず、僧たちに知らせに行った。
    小姓「おじいさまは二更（にこう）になっても泣き続け、まだ声がやみません。」
    老僧に可愛がられている孫弟子が二人、前へ出て尋ねた。
    二人の孫弟子「師祖さま、なぜ泣くのです。」
    老僧「私に縁がなく、唐僧（とうそう）の宝を見ていられないのが悲しいのだ。」
    若い僧「おじいさま、お年を取って、ぼけてしまわれたのですか。あの方の袈裟は目の前に置いてあるのですから、ただ解いて見ればよいではありませんか。どうしてそんなに泣くのです。」
    老僧「いつまでも見てはいられぬ。今年で二百七十歳になるというのに、幾百着もの袈裟を集めたのもむなしいことだった。どうすれば、あの方のこの一着を持てるのだろう。どうすれば、あの唐僧になれるのだろう。」
    若い僧「師祖さま、それはお考え違いです。唐僧は故郷を捨てて来た、ただの行脚の僧です。これほどご長寿で、十分に安楽を享受しておられるのに、かえってあの方のような旅の僧になりたいとは、どういうことです。」
    老僧「家に落ち着いて気楽に過ごし、老後を楽しんではいるが、あの袈裟を着ることはできぬ。一日でも着られるなら、死んでも心残りはない。この世へ生まれて僧になった甲斐もあるというものだ。」
    僧たち「何と分別のないことを。あの袈裟をお召しになりたいなら、何も難しくありません。明日、あの方を一日引き止めれば、一日お召しになれます。十日引き止めれば、十日お召しになれる。それでよいではありませんか。どうしてこんなに泣くのです。」
    老僧「たとえ一年引き止めても、一年着られるだけで、結局いつまでもとはいかぬ。あの方が発つとなれば、袈裟も渡して行かせるしかない。どうすれば末長く留めておけよう。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『兩個徒孫』の問いは二人の孫弟子の合同発言。その後の『小和尚』は個人が特定できない若い僧とする。次の段落の広智・広謀を先取りしない。"
- "id": "xy-ch16-018"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正說話處，有一個小和尚，名喚廣智，出頭道：「公公要得長遠，也容易。」老僧聞言，就歡喜起來道：「我兒，你有甚麼高見？」廣智道：「那唐僧兩個是走路的人，辛苦之甚，如今已睡著了。我們想幾個有力量的，拿了槍刀，打開禪堂，將他殺了，把屍首埋在後園，只我一家知道，卻又謀了他的白馬、行囊，卻把那袈裟留下，以為傳家之寶，豈非子孫長久之計耶？」老和尚見說，滿心歡喜，卻才揩了眼淚道：「好，好，好，此計絕妙。」即便收拾槍刀。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    そう話していると、広智（こうち）という一人の若い僧が進み出た。
    広智「おじいさま、末長くお手元に置くのも簡単です。」
    老僧は聞くなり喜び出した。
    老僧「よい子だ、どんな名案があるのだ。」
    広智「唐僧たち二人は旅人で、たいそう疲れ、今はもう眠っています。力のある者を幾人か選び、槍や刀を持って禅堂を開け、二人を殺し、死骸を裏の庭に埋めましょう。知るのはこの寺の者ばかりです。白馬も荷物も奪い取り、袈裟は残して家伝の宝にすれば、子々孫々、末長く伝える策ではありませんか。」
    老僧は聞いて胸いっぱいに喜び、ようやく涙を拭いた。
    老僧「よし、よし、よし。その策は実に見事だ。」
    すぐさま槍や刀を用意した。
  "translation_status": "reviewed"
- "id": "xy-ch16-019"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "內中又有一個小和尚，名喚廣謀，就是那廣智的師弟，上前來道：「此計不妙。若要殺他，須要看看動靜。那個白臉的似易，那個毛臉的似難，萬一殺他不得，卻不反招己禍？我有一個不動刀槍之法，不知你尊意如何？」老僧道：「我兒，你有何法？」廣謀道：「依小孫之見，如今喚聚東山大小房頭，每人要乾柴一束，捨了那三間禪堂，放起火來，教他欲走無門，連馬一火焚之。就是山前山後人家看見，只說是他自不小心，走了火，將我禪堂都燒了。那兩個和尚，卻不都燒死？又好掩人耳目。袈裟豈不是我們傳家之寶？」那些和尚聞言，無不歡喜，都道：「強，強，強，此計更妙，更妙。」遂教各房頭搬柴來。唉！這一計，正是：弄得個高壽老僧該命盡，觀音禪院化為塵。原來他那寺裡有七八十個房頭，大小有二百餘眾。當夜一擁搬柴，把個禪堂前前後後，四面圍繞不通，安排放火不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    その中にもう一人、広謀（こうぼう）という若い僧がいた。広智の弟弟子である。前へ出て言った。
    広謀「その策はよくない。殺すというなら、まず相手の様子を見なければならない。白い顔の方はたやすそうだが、毛だらけの顔の方は難しそうだ。万一、殺し損なえば、かえって自分たちに災いを招くではないか。刀も槍も使わぬ方法が私にはありますが、お聞きいただけますか。」
    老僧「よい子だ、どんな方法なのだ。」
    広謀「孫弟子の私の考えでは、今から東山（とうざん）の大小の僧房の者を集め、一人に乾いた薪を一束ずつ出させます。そしてあの三間の禅堂を犠牲にして火を放ち、逃げ道をなくし、馬もろとも焼くのです。山の前後の家々に見られても、あの者たちが不注意で火を出し、我らの禅堂まで焼いてしまったと言えばよい。あの二人の僧も、ともに焼け死ぬではありませんか。人の目も耳も欺けます。袈裟は我らの家伝の宝になるのではありませんか。」
    僧たちは聞くと、喜ばぬ者はなかった。
    僧たち「うまい、うまい、うまい。その策はもっとよい、もっとよい。」
    こうして各僧房に薪を運ばせた。ああ、この企みこそ、まさしく、長寿の老僧の命を尽きさせ、観音禅院を塵とするものであった。もともとこの寺には七、八十の僧房があり、大小合わせて二百余人がいた。その夜はどっと薪を運び、禅堂の前後も四方も、通る隙なく取り囲み、火をつける手はずを整えた。その話はさておく。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "廣謀の発言の『東山』は原語を保持する。後の黒風山の方角説明と無断でそろえない。"
- "id": "xy-ch16-020"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏師徒安歇已定。那行者卻是個靈猴，雖然睡下，只是存神煉氣，朦朧著醒眼。忽聽得外面不住的人走，查查的柴響風生。他心疑惑道：「此時夜靜，如何有人行得腳步之聲？莫敢是賊盜，謀害我們的？」他就一骨魯跳起，欲要開門出看，又恐驚醒師父。你看他弄個精神，搖身一變，變做一個蜜蜂兒。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    さて、三蔵師弟は寝床に落ち着いていた。行者は霊妙な猿であるから、横になっていても精神を保ち、気を練るばかりで、うとうとしながら目を覚ましていた。不意に外で人の行き来が絶えず、薪がざわざわと風を切る音がする。行者は不審に思った。
    行者「夜も静かなこの時分に、どうして人の歩く足音がするのだ。さては賊どもが、俺たちを殺そうというのか。」
    ころりと跳ね起き、戸を開けて見に出ようとしたが、師を起こすことを恐れた。見れば、気を奮い起こし、身を一振りして、一匹の蜜蜂に変わった。まことに。
  "translation_status": "reviewed"
- "id": "xy-ch16-021"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": "口甜尾毒，腰細身輕。穿花度柳飛如箭，粘絮尋香似落星。小小微軀能負重，囂囂薄翅會乘風。卻自椽棱下，鑽出看分明。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 156
    "line_end": 156
  "translation_ja": "口には甘さ、尾には毒。腰は細く、身は軽い。花を抜け、柳を渡って矢のように飛び、柳絮に触れて香りを探る姿は、落ちる星のよう。小さな体で重いものを背負い、ぶんぶん鳴る薄い羽で風に乗る。そのまま垂木の角の下から抜け出して、はっきりと見た。"
  "translation_status": "reviewed"
- "id": "xy-ch16-022"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那眾僧們搬柴運草，已圍住禪堂放火哩。行者暗笑道：「果依我師父之言，他要害我們性命，謀我的袈裟，故起這等毒心。我待要拿棍打他啊，可憐又不禁打，一頓棍都打死了，師父又怪我行兇。罷，罷，罷，與他個順手牽羊，將計就計，教他住不成罷！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    僧たちが薪や草を運び、すでに禅堂を取り囲んで火をつけようとしていた。行者はひそかに笑った。
    行者「果たしてお師匠さまのおっしゃったとおりだ。俺たちの命を奪い、袈裟を手に入れようとして、こんな毒心を起こしたのだな。棒で打ちのめしてやろうか。だが哀れなことに、こいつらは打撃に耐えられず、一しきり殴れば皆死んでしまう。そうすれば、またお師匠さまに乱暴を責められる。よし、よし、よし。この機に乗じて相手の策を逆手に取り、ここに住めなくしてやろう。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『順手牽羊』は好機に乗じて利を得る諺。ここでは相手の放火の企てに乗じて住む所を奪う意味と解した。実際に羊を盗む動作はない。"
- "id": "xy-ch16-023"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，一觔斗跳上南天門裡。諕得個龐、劉、苟、畢躬身，馬、趙、溫、關控背，俱道：「不好了，不好了！那鬧天宮的主子又來了。」行者搖著手道：「列位免禮，休驚。我來尋廣目天王的。」說不了，卻遇天王早到，迎著行者道：「久闊，久闊。前聞得觀音菩薩來見玉帝，借了四值功曹、六丁六甲並揭諦等，保護唐僧往西天取經去，說你與他做了徒弟，今日怎麼得閑到此？」行者道：「且休敘闊。唐僧路遇歹人，放火燒他，事在萬分緊急，特來尋你借辟火罩兒，救他一救。快些拿來使使，即刻返上。」天王道：「你差了。既是歹人放火，只該借水救他，如何要辟火罩？」行者道：「你那裡曉得就裡。借水救之，卻燒不起來，倒相應了他；只是借此罩，護住了唐僧無傷，其餘管他，盡他燒去。快些，快些，此時恐已無及，莫誤了我下邊幹事。」那天王笑道：「這猴子還是這等起不善之心，只顧了自家，就不管別人。」行者道：「快著，快著，莫要調嘴，害了大事。」那天王不敢不借，遂將罩兒遞與行者。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    さても行者、一つ宙返りして南天門（なんてんもん）の中へ跳び上がった。龐（ほう）・劉（りゅう）・苟（こう）・畢（ひつ）は驚いて身をかがめ、馬（ば）・趙（ちょう）・温（おん）・関（かん）は背を丸め、皆が言った。
    神将たち「大変だ、大変だ。天宮を騒がせた主が、また来たぞ。」
    行者は手を振った。
    行者「皆さん、礼はいらない、驚かないでくれ。広目天王（こうもくてんのう）を訪ねてきたのだ。」
    言い終わらぬうちに天王がすでに現れ、行者を迎えた。
    広目天王「久しぶりだ、久しぶりだ。この前、観音菩薩（かんのんぼさつ）が玉帝（ぎょくてい）に会いに来られ、四値功曹（しちこうそう）、六丁六甲（ろくていろっこう）、掲諦（ぎゃてい）などを借り、唐僧が西天（さいてん）へ経を取りに行くのを守らせたと聞いた。お前はその弟子になったそうだが、今日はどうして暇ができて、ここへ来たのだ。」
    行者「久しぶりの話は後だ。唐僧が道で悪人に遭い、火をかけて焼き殺されようとしている。事は一刻を争う。そこで、お前の辟火罩（へきかしょう）を借りて救ってやろうと、わざわざ来たのだ。早く貸してくれ。すぐに返す。」
    広目天王「それは筋違いだろう。悪人が火をつけたなら、水を借りて救うべきだ。どうして辟火罩が要る。」
    行者「お前は裏の事情を知らんのだ。水で救えば火は燃えず、かえってあいつらを得させる。これを借りて唐僧を覆い、無傷にしておけばよい。残りなど知ったことか、燃えるだけ燃やせばいい。早く、早く。今ではもう間に合わぬかもしれん。下界での仕事を遅らせるな。」
    天王は笑った。
    広目天王「この猿は、まだそんなよくない心を起こすのか。自分のことばかり考え、ほかの者は構わぬというのだな。」
    行者「早くしてくれ、早く。軽口をたたいて大事をしくじらせるな。」
    天王は貸さないわけにもいかず、罩を行者へ渡した。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "南天門の龐・劉・苟・畢・馬・趙・温・関は姓のみを保持し、未記載のフルネームを補わない。馬は四健将の馬元帥とは別の神将。辞書でも別義として登録する。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『控背』は身を低くして背を曲げる動きと解した。『躬身』との並列を消さず、前の四人と後の四人を別々に描写した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "広目天王の語る神々の派遣は人物の伝聞として保持し、原文にない派遣手続きを足さない。"
- "id": "xy-ch16-024"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者拿了，按著雲頭，徑到禪堂房脊上，罩住了唐僧與白馬、行李。他卻去那後面老和尚住的方丈房上頭坐著，保護那袈裟。看那些人放起火來，他轉捻訣念咒，望巽地上吸一口氣吹將去，一陣風起，把那火轉吹得烘烘亂發。好火，好火！但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 160
    "line_end": 160
  "translation_ja": "行者はそれを受け取り、雲を下げてまっすぐ禅堂の屋根の棟へ行き、三蔵と白馬と荷物を覆った。自分は奥の老僧が住む方丈の屋根へ行って座り、袈裟を守った。僧たちが火を放つのを見ると、今度は指で印を結び、呪文を唱え、巽（たつみ）の方へ向けて一息吸い、吹き放った。すると一陣の風が起こり、火は吹きあおられて、ごうごうと四方へ燃え広がった。なんという火、なんという火であろう。見れば。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『巽地』は東南の方角を指す語義を採用。風に対応する八卦との関係は説明に留め、地の文の人物名は三蔵に統一した。"
- "id": "xy-ch16-025"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": "黑煙漠漠，紅燄騰騰。黑煙漠漠，長空不見一天星；紅燄騰騰，大地有光千里赤。起初時，灼灼金蛇；次後來，威威血馬。南方三炁逞英雄，回祿大神施法力。燥乾柴燒烈火性，說甚麼燧人鑽木；熱油門前飄彩燄，賽過了老祖開爐。正是那無情火發，怎禁這有意行兇。不去弭災，反行助虐。風隨火勢，燄飛有千丈餘高；火逞風威，灰迸上九霄雲外。乒乒乓乓，好便似殘年爆竹；潑潑喇喇，卻就如軍中炮聲。燒得那當場佛像莫能逃，東院伽藍無處躲。勝如赤壁夜鏖兵，賽過阿房宮內火。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 162
    "line_end": 162
  "translation_ja": "黒煙はもうもう、紅炎はめらめら。黒煙がもうもうと広がり、果てなき空に星一つ見えぬ。紅炎がめらめらと上がり、大地は光って千里まで赤い。初めは、きらめく金の蛇。次には、威猛な血の馬。南方の三炁（さんき）が勇を振るい、回禄大神（かいろくだいしん）が法力を施す。乾いた薪が火性を激しく燃やし、燧人（すいじん）の火きり木など何ほどのものぞ。熱油の門前に彩りの炎が漂い、老祖（ろうそ）が炉を開くさまをも超える。まさしく無情な火の起こるとき、この故意の乱暴をどうして防げよう。災いを鎮めもせず、かえって暴虐を助ける。風は火勢に従い、炎は千丈余りの高さへ飛ぶ。火は風の威を振るい、灰は九霄（きゅうしょう）の雲の外へほとばしる。ぱんぱん、ばんばん、さながら年の瀬の爆竹。ばりばり、ごうごう、まるで軍中の砲声。焼かれては、その場の仏像にも逃げ道はなく、東院の伽藍神（がらんじん）にも隠れる所はない。赤壁（せきへき）の夜の激戦をしのぎ、阿房宮（あぼうきゅう）の火にもまさる。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『南方三炁』は南方の火の力を神格化した表現と解したが、三炁の詳細な構成や特定神の同定は未確定。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『熱油門前飄彩燄』は熱油と門前の構文関係が難解。『熱油の門前に彩りの炎が漂い』と全語を保って暫定訳し、油を注ぐという原文にない動作は補わなかった。独立校訂で確認が必要。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『老祖開爐』の老祖は炉を持つ太上老君を指すと解したが、原文は固有名を明記しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『東院伽藍』は逃げ隠れする並列から寺を守る伽藍神と解した。建物自体が逃げるという読みも比喩上は排除できず、解釈である。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "赤壁と阿房宮の火は文学的な歴史・伝承への比喩として保持する。阿房宮焼失の伝承を考古学的事実として保証しない。"
- "id": "xy-ch16-026"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這正是星星之火，能燒萬頃之田。須臾間，風狂火盛，把一座觀音院，處處通紅。你看那眾和尚，搬箱擡籠，搶桌端鍋，滿院裡叫苦連天。孫行者護住了後邊方丈，辟火罩罩住了前面禪堂，其餘前後火光大發，真個是照天紅燄輝煌，透壁金光照耀。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 164
    "line_end": 164
  "translation_ja": "まことに、小さな火の粉も万頃（けい）の田を焼くというものだ。たちまち風は荒れ狂い、火勢は盛んになり、観音院（かんのんいん）は至る所、真っ赤に染まった。見れば僧たちは箱を運び、かごを担ぎ、卓を奪い出し、鍋を抱えて、境内じゅうで天に届くほど悲鳴を上げた。行者は奥の方丈を守り、辟火罩は前の禅堂を覆っていたが、そのほかは前も後ろも大いに燃え、まこと、天を照らす紅炎はきらめき、壁を透かす金の光は輝いていた。"
  "translation_status": "reviewed"
- "id": "xy-ch16-027"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不期火起之時，驚動了一山獸怪。這觀音院正南二十里遠近，有座黑風山，山中有一個黑風洞，洞中有一個妖精，正在睡醒翻身。只見那窗間透亮，只道是天明。起來看時，卻是正北下的火光晃亮。妖精大驚道：「呀！這必是觀音院裡失了火。這些和尚好不小心。我看時，與他救一救來。」好妖精，縱起雲頭，即至煙火之下，果然沖天之火，前面殿宇皆空，兩廊煙火方灼。他大拽步，撞將進去，正呼喚叫取水來，只見那後房無火，房脊上有一人放風。他卻情知如此，急入裡面看時，見那方丈中間有些霞光彩氣，臺案上有一個青氈包袱。他解開一看，見是一領錦襴袈裟，乃佛門之異寶。正是財動人心，他也不救火，他也不叫水，拿著那袈裟，趁鬨打劫，拽回雲步，徑轉東山而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    思いがけず、この火事が一山の獣の妖怪を驚かせた。観音院の真南二十里ほどに黒風山（こくふうざん）という山があり、その山には黒風洞（こくふうどう）という洞があった。洞の中には一匹の妖怪が住み、ちょうど眠りから覚めて寝返りを打っていた。窓から明かりが差し込むので、夜が明けたと思った。起きて見ると、真北に火の光が輝いているのだった。妖怪は大いに驚いた。
    妖怪「おや、これはきっと観音院の火事だ。あの僧たちは、なんと不用心なのだ。ひとつ見に行って、火を消してやろう。」
    さても妖怪、雲を起こして、たちまち煙と炎の下へ来てみれば、果たして火は天を突き、前の殿堂はすっかり失われ、両側の回廊では煙と火がまだ燃え盛っていた。大股に踏み込んで、水を取ってこいと呼びかけていると、奥の部屋だけ火がなく、屋根の棟に一人、風を起こしている者が見えた。妖怪はそれで事情を察し、急いで中へ入ってみた。方丈の中には霞のような光と彩りの気があり、机の上には青い毛氈の包みが一つ置かれている。解いてみると、一着の錦襴袈裟（きんらんげさ）、それも仏門の世にも珍しい宝であった。まさしく財宝は人心を動かす。もはや火を消しもせず、水を呼びもせず、袈裟をつかむと、騒ぎに乗じて略奪し、雲の歩みを返して、まっすぐ東山へ向かって去った。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "黒風山はここでは寺の真南二十里、後の院主の説明では東南となる。妖怪が帰る先も東山となり、方角のずれは底本どおり残した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "妖怪は初め火を消そうとして来るが、袈裟を見ると盗む。初めから盗み目的だったと改めない。熊の正体を語り手が明かすのは結びの詩なので、この段落は妖怪と呼ぶ。"
- "id": "xy-ch16-028"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那場火只燒到五更天明，方才滅息。你看那眾僧們赤赤精精，啼啼哭哭，都去那灰內尋銅鐵，撥腐炭，撲金銀。有的在牆筐裡，苫搭窩棚；有的赤壁根頭，支鍋造飯。叫冤叫屈，亂嚷亂鬧不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 167
    "line_end": 167
  "translation_ja": "火は五更（ごこう）の夜明けまで燃え続けて、ようやく消えた。見れば僧たちは裸同然の姿で泣きわめき、灰の中へ入って銅や鉄を探し、崩れた炭をかき分け、金銀を探り出した。残った壁の囲いの中に小屋を掛ける者もあれば、焼けた壁の根元に鍋を据えて飯を炊く者もある。恨みつらみを叫び、騒ぎ立てる話はさておく。"
  "translation_status": "reviewed"
- "id": "xy-ch16-029"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者取了辟火罩，一觔斗送上南天門，交與廣目天王道：「謝借，謝借。」天王收了道：「大聖至誠了。我正愁你不還我的寶貝，無處尋討，且喜就送來也。」行者道：「老孫可是那當面騙物之人？這叫做『好借好還，再借不難』。」天王道：「許久不面，請到宮少坐一時，何如？」行者道：「老孫比在前不同，爛板凳，高談闊論了；如今保唐僧，不得身閑。容敘，容敘。」急辭別墜雲，又見那太陽星上。徑來到禪堂前，搖身一變，變做個蜜蜂兒，飛將進去，現了本像看時，那師父還沉睡哩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    さて、行者は辟火罩を取り、一つ宙返りして南天門へ届け、広目天王に渡した。
    行者「貸してくれて、ありがたい、ありがたい。」
    天王は受け取った。
    広目天王「大聖（たいせい）は実に律儀だな。私の宝を返してもらえなければ、どこへ取り立てに行けばよいかと案じていたが、すぐに届けてくれて、うれしいことだ。」
    行者「この俺が、面と向かって物をだまし取るような者か。これぞ『気持ちよく借り、きちんと返せば、次に借りるのも難しくない』というものさ。」
    広目天王「久しく会わなかったのだから、宮へ来て、しばらく座っていってはどうだ。」
    行者「この俺も、腰掛けを腐らせるほど座り込んで、大きな話をしていた昔とは違う。今は唐僧を守っているので、身の暇がない。話はいずれ、いずれ。」
    急いで別れを告げ、雲を下りると、もう太陽が昇っていた。まっすぐ禅堂の前へ行き、身を振って蜜蜂となり、飛び入って元の姿に戻った。見ると、師はまだぐっすり眠っていた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『爛板凳，高談闊論』は腰掛けが腐るほど座って大きな話をする昔の暮らしと解した。文字どおり壊れた椅子を持つ話にはしない。"
- "id": "xy-ch16-030"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者叫道：「師父，天亮了，起來罷。」三藏才醒覺，翻身道：「正是。」穿了衣服，開門出來，忽擡頭，只見些倒壁紅牆，不見了樓臺殿宇。大驚道：「呀！怎麼這殿宇俱無，都是紅牆，何也？」行者道：「你還做夢哩，今夜走了火的。」三藏道：「我怎不知？」行者道：「是老孫護了禪堂，見師父濃睡，不曾驚動。」三藏道：「你有本事護了禪堂，如何就不救別房之火？」行者笑道：「好教師父得知：果然依你昨日之言，他愛上我們的袈裟，算計要燒殺我們。若不是老孫知覺，到如今皆成灰骨矣。」三藏聞言，害怕道：「是他們放的火麼？」行者道：「不是他是誰？」三藏道：「莫不是怠慢了你，你幹的這個勾當？」行者道：「老孫是這等憊懶之人，幹這等不良之事？實實是他家放的。老孫見他心毒，果是不曾與他救火，只是與他略略助些風的。」三藏道：「天那，天那！火起時，只該助水，怎轉助風？」行者道：「你可知古人云：『人沒傷虎心，虎沒傷人意。』他不弄火，我怎肯弄風？」三藏道：「袈裟何在？敢莫是燒壞了也？」行者道：「沒事，沒事，燒不壞，那放袈裟的方丈無火。」三藏恨道：「我不管你，但是有些兒傷損，我只把那話兒念動念動，你就是死了。」行者慌了道：「師父莫念，莫念，管尋還你袈裟就是了。等我去拿來走路。」三藏才牽著馬，行者挑了擔，出了禪堂，徑往後方丈去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    行者が呼んだ。
    行者「お師匠さま、夜が明けました。お起きください。」
    三蔵はようやく目を覚まし、寝返りを打った。
    三蔵「そうだな。」
    衣を着て戸を開け、外へ出て、ふと顔を上げると、見えるのは崩れた壁と赤く焼けた塀ばかりで、楼台も殿堂もない。大いに驚いた。
    三蔵「ああ、どうして殿堂がすべてなくなり、赤い壁ばかりなのだ。何があった。」
    行者「まだ夢を見ておいでですね。昨夜、火が出たのです。」
    三蔵「なぜ私は知らなかったのだ。」
    行者「この俺が禅堂を守りました。お師匠さまがよくお休みなので、お起こししなかったのです。」
    三蔵「禅堂を守る力があるなら、なぜほかの部屋の火も消さなかった。」
    行者は笑った。
    行者「お師匠さま、実はこうです。まことに昨日おっしゃったとおり、あの者たちは私たちの袈裟に惚れ込み、我らを焼き殺そうと企んだのです。この俺が気づかなければ、今ごろは皆、骨も灰になっておりました。」
    三蔵は聞いて恐れた。
    三蔵「あの者たちが火をつけたのか。」
    行者「あいつらでなければ、誰がやります。」
    三蔵「もしや、お前を粗末に扱ったので、お前がこの仕業に及んだのではあるまいな。」
    行者「この俺が、そんな悪事をするような、ずるい無頼漢でしょうか。本当にあいつらの放った火です。あの毒々しい心を見て、なるほど火は消してやりませんでした。ただ、少々風を添えてやっただけです。」
    三蔵「何ということだ、何ということだ！　火が起きたなら、水で助けるものだ。どうして逆に風を添えたのだ。」
    行者「昔の人の言葉はご存じでしょう。『人に虎を害す心がなければ、虎にも人を害す心はない。』あいつらが火を起こさなければ、私がどうして風を起こしましょう。」
    三蔵「袈裟はどこにある。まさか焼けてしまったのではあるまいな。」
    行者「大丈夫、大丈夫、焼けはしません。袈裟を置いた方丈には火がありませんでした。」
    三蔵は憎らしげに言った。
    三蔵「私は知らぬぞ。少しでも傷んでいれば、あの言葉を唱えて唱え続け、お前は死ぬことになるのだ。」
    行者は慌てた。
    行者「お師匠さま、唱えないでください、唱えないでください。必ず袈裟を探してお返ししますから。取りに行ってから出発しましょう。」
    そこで三蔵は馬を引き、行者は荷を担ぎ、禅堂を出てまっすぐ奥の方丈へ向かった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "虎の諺は底本が『人沒傷虎心，虎沒傷人意』と二つとも否定する形。よく知られた別形へ無断で直さず、そのまま訳した。"
- "id": "xy-ch16-031"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那些和尚正悲切間，忽的看見他師徒牽馬挑擔而來，諕得一個個魂飛魄散道：「冤魂索命來了。」行者喝道：「甚麼冤魂索命？快還我袈裟來。」眾僧一齊跪倒，叩頭道：「爺爺呀！冤有冤家，債有債主。要索命不干我們事，都是廣謀與老和尚定計害你的，莫問我們討命。」行者咄的一聲道：「我把你這些該死的畜生，那個問你討甚麼命。只拿袈裟來還我走路！」其間有兩個膽量大的和尚道：「老爺，你們在禪堂裡已燒死了，如今又來討袈裟，端的還是人，是鬼？」行者笑道：「這夥孽畜，那裡有甚麼火來？你去前面看看禪堂，再來說話。」眾僧們爬起來往前觀看，那禪堂外面的門窗槅扇，更不曾燎灼了半分。眾人悚懼，才認得三藏是種神僧，行者是尊護法。一齊上前叩頭道：「我等有眼無珠，不識真人下界。你的袈裟在後面方丈中老師祖處哩。」三藏行過了三五層敗壁破牆，嗟嘆不已。只見方丈果然無火，眾僧搶入裡面，叫道：「公公，唐僧乃是神人，未曾燒死，如今反害了自己家當。趁早拿出袈裟，還他去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    さて、和尚たちが悲しみに暮れているところへ、不意に師弟が馬を引き、荷を担いでやって来るのが見えた。一人残らず魂の飛ぶほど驚いた。
    僧たち「恨みの亡霊が、命を取りに来た！」
    行者は一喝した。
    行者「何が亡霊の命取りだ。早く俺の袈裟を返せ。」
    僧たちは一斉にひざまずき、額づいた。
    僧たち「おじいさま！　恨みには相手があり、借りには貸し主があります。命をお求めでも、我らには関わりありません。皆、広謀と老僧が企んで、お二方を害そうとしたのです。我らの命をお取りにならないでください。」
    行者はかっと叫んだ。
    行者「この死に値する畜生ども、誰がお前らの命など取りに来たと言った。袈裟を返せば、俺たちは旅に出るのだ！」
    その中で二人の気丈な和尚が言った。
    気丈な二人の僧「お二方は禅堂で焼け死んだはずなのに、今また袈裟を取りにおいでとは、いったい人なのですか、幽霊なのですか。」
    行者は笑った。
    行者「このろくでなしども、どこに火など来た。前へ行って禅堂を見てから、また物を言え。」
    僧たちは起き上がり、前へ行って見た。禅堂の外の戸も窓も格子戸も、少しも焦げていない。皆は恐れおののき、初めて三蔵が神通ある僧で、行者が尊い護法（ごほう）であると知った。一斉に前へ出て額づいた。
    僧たち「我らは目があっても見る目がなく、真人（しんじん）が下界へおいでなのだとは存じませんでした。お袈裟は奥の方丈、老いた師祖の所にございます。」
    三蔵は三重、五重と続く崩れた塀や壊れた壁の間を通り、嘆いてやまなかった。見ると、方丈だけは果たして焼けていなかった。僧たちは中へ駆け込み、叫んだ。
    僧たち「おじいさま、唐僧は神のようなお方で、焼け死んではおりません。これでは、かえって自分たちの財産を損なったばかりです。早く袈裟を取り出し、あの方に返して、お発ちいただきましょう。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『更不曾燎灼了半分』の半分は微量をいう。二分の一とはせず、『少しも焦げていない』と訳した。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "ここで質問する気丈な二人の和尚を、先の二人の孫弟子や広智・広謀と同定しない。"
- "id": "xy-ch16-032"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來這老和尚尋不見袈裟，又燒了本寺的房屋，正在萬分煩惱焦燥之處，一聞此言，怎敢答應。因尋思無計，進退無方，拽開步，躬著腰，往那牆上著實撞了一頭，可憐只撞得腦破血流魂魄散，咽喉氣斷染紅沙。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 171
    "line_end": 171
  "translation_ja": "もともと老僧は、袈裟が見つからず、寺の建物まで焼けてしまい、ひどく思い煩い、いらだんでいるところだった。その言葉を聞いて、どうして返事などできよう。考えても策はなく、進むも退くもできないので、足を踏み出し、腰をかがめ、壁へ頭をしたたかに打ちつけた。哀れ、頭は割れ、血は流れ、魂は散り、喉の息は絶えて、地の砂を赤く染めた。これを証す詩がある。詩にいう。"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "老僧の自死は文学的叙述の範囲を保ち、原文にない動機の断定・称揚・手段の補足は加えない。"
- "id": "xy-ch16-033"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    堪嘆老衲性愚蒙，枉作人間一壽翁。
    欲得袈裟傳遠世，豈知佛寶不凡同。
    但將容易為長久，定是蕭條取敗功。
    廣智廣謀成甚用？損人利己一場空。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 173
    "line_end": 176
  "translation_ja": |-
    嘆かわしいことよ、愚かな性根の老僧、むなしく人の世の長寿者となる。
    袈裟を得て遠い後世へ伝えようとし、仏宝が並の品でないとは知らぬ。
    安易な手立てで末長く得ようとすれば、必ず衰え果て、失敗を招く。
    広智も広謀も何の役に立とう。人を損ない己を利する企みは、一場の空。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『但將容易為長久，定是蕭條取敗功』は安易な計略で長く得ようとして失敗するとの警句と解した。容易・長久・蕭條・敗功の関係には文言上の留保がある。"
- "id": "xy-ch16-034"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "慌得個眾僧哭道：「師公已撞殺了，又不見袈裟，怎生是好？」行者道：「想是汝等盜藏起也。都出來，開具花名手本，等老孫逐一查點。」那上下房的院主，將本寺和尚、頭陀、幸童、道人盡行開具手本二張，大小人等共計二百三十名。行者請師父高坐，他卻一一從頭唱名搜檢，都要解放衣襟，分明點過，更無袈裟。又將那各房頭搬搶出去的箱籠物件，從頭細細尋遍，那裡得有蹤跡。三藏心中煩惱，懊恨行者不盡，卻坐在上面念動那咒。行者撲的跌倒在地，抱著頭，十分難禁，只教：「莫念，莫念，管尋還了袈裟。」那眾僧見了，一個個戰兢兢的，上前跪下勸解，三藏才合口不念。行者一骨魯跳起來，耳朵裡掣出鐵棒，要打那些和尚，被三藏喝住道：「這猴頭，你頭痛還不怕，還要無禮？休動手，且莫傷人，再與我審問一問。」眾僧們磕頭禮拜，哀告三藏道：「老爺饒命。我等委實的不曾看見。這都是那老死鬼的不是。他昨晚看著你的袈裟，只哭到更深時候，看也不曾敢看，思量要圖長久，做個傳家之寶，設計定策，要燒殺老爺。自火起之候，狂風大作，各人只顧救火，搬搶物件，更不知袈裟去向。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    僧たちは慌てて泣いた。
    僧たち「師祖さまは頭を打ちつけて死に、袈裟も見当たりません。どうすればよいのでしょう。」
    行者「お前たちが盗んで隠したのだろう。全員出てこい。名前を記した名簿を作れ。この俺が一人ずつ調べてやる。」
    上下の僧房の院主たちは、寺の和尚、頭陀、小姓、下働きをすべて書き出し、名簿を二枚作った。大小の者、合わせて二百三十名であった。行者は師を上座に座らせ、自分は端から一人ずつ名を呼び、調べた。全員に衣の襟を解かせ、はっきりと点検したが、袈裟はなかった。さらに、各僧房から運び出された箱やかごや品々も、端から細かく探したが、どこにも跡はなかった。三蔵は思い煩い、行者をいくら恨んでも足りず、上座に座ったまま、あの呪文を唱え始めた。行者はばたりと地に倒れ、頭を抱え、ひどく耐え難そうに、ただ叫んだ。
    行者「唱えないで、唱えないでください。必ず袈裟を探してお返しします。」
    僧たちはそれを見ると、一人ずつ震え上がり、前にひざまずいてなだめたので、三蔵はようやく口を閉じて唱えるのをやめた。行者はころりと跳ね起き、耳から鉄棒を抜き出して、和尚たちを打とうとした。三蔵が一喝して止めた。
    三蔵「この猿め、頭の痛みも怖くないのか。まだ無礼を働こうというのか。手を出すな、人を傷つけるな。もう一度、私のために問いただしてみよ。」
    僧たちは額づいて拝み、三蔵に哀願した。
    僧たち「お客人、どうか命をお助けください。我らは本当に見ておりません。皆、あの死んだ老いぼれの罪です。昨夜、お袈裟を前にして夜更けまで泣き続け、見ることさえためらい、長く手に入れて家伝の宝にしようと思い、計略を立て、お二方を焼き殺そうとしたのです。火が起きてからは風が激しくなり、各人、火を消し、品を運び出すことばかりで、袈裟の行方など、なおさら知りません。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "『老死鬼』はすでに死んだ老僧への罵倒として『死んだ老いぼれ』とする。『看著…看也不曾敢看』という僧たちの弁明のずれは、語り手の前段を訂正せず発言として保持した。"
- "id": "xy-ch16-035"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者大怒，走進方丈屋裡，把那觸死鬼屍首擡出，選剝了細看，渾身更無那件寶貝。就把個方丈掘地三尺，也無蹤影。行者忖量半晌，問道：「你這裡可有甚麼妖怪成精麼？」院主道：「老爺不問，莫想得知。我這裡正東南有座黑風山，黑風洞內有一個黑大王，我這老死鬼常與他講道，他便是個妖精。別無甚物。」行者道：「那山離此有多遠近？」院主道：「只有二十里，那望見山頭的就是。」行者笑道：「師父放心，不須講了，一定是那黑怪偷去無疑。」三藏道：「他那廂離此有二十里，如何就斷得是他？」行者道：「你不曾見夜間那火，光騰萬里，亮透三天，且休說二十里，就是二百里也照見了。坐定是他見火光焜耀，趁著機會，暗暗的來到這裡，看見我們袈裟是件寶貝，必然趁鬨擄去也。等老孫去尋他一尋。」三藏道：「你去了時，我卻何倚？」行者道：「這個放心，暗中自有神靈保護，明中等我叫那些和尚伏侍。」即喚眾和尚過來，道：「汝等著幾個去埋那老鬼；著幾個伏侍我師父，看守我白馬。」眾僧領諾。行者又道：「汝等莫順口兒答應，等我去了，你就不來奉承。看師父的，要怡顏悅色；養白馬的，要水草調勻。假有一毫兒差了，照依這個樣棍，與你們看看。」他掣出棍子，照那火燒的磚牆上，撲的一下，把那牆打得粉碎，又震倒了有七八層牆。眾僧見了，個個骨軟身麻，跪著磕頭滴淚道：「爺爺寬心前去，我等竭力虔心，供奉老爺，決不敢一毫怠慢。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    行者は大いに怒り、方丈の部屋へ入ると、頭を打ちつけて死んだ老人の死骸を運び出し、衣を剥いで詳しく調べた。だが全身どこにもあの宝はない。さらに方丈の地面を三尺掘っても、影も形もなかった。行者はしばらく考えてから尋ねた。
    行者「この辺りには、何か化けて妖怪となったものがいるか。」
    院主「お尋ねにならなければ、お知りにはなれなかったでしょう。ここから真っすぐ東南に黒風山があり、黒風洞の中には黒大王（こくだいおう）という者がおります。この死んだ老人は、よくその者と道について語り合っていました。それこそ妖怪です。ほかには何もおりません。」
    行者「その山は、ここからどのくらい離れている。」
    院主「わずか二十里です。あそこに見える峰が、それです。」
    行者は笑った。
    行者「お師匠さま、ご安心ください。もう言うまでもありません。必ずあの黒い妖怪が盗んだに違いない。」
    三蔵「そこは二十里も離れているのに、どうしてその者だと断定できるのだ。」
    行者「昨夜の火をご覧になっていないからです。光は万里にわたり立ち昇り、三天（さんてん）を突き通しました。二十里どころか、二百里先でも見えたでしょう。きっと、火の光が輝くのを見て、その機に乗じ、ひそかにここへ来たのです。そして我らの袈裟が宝物だと見ると、必ず騒ぎに紛れて奪い去ったのでしょう。この俺が探しに行きます。」
    三蔵「お前が行ったら、私は何を頼りにすればよい。」
    行者「その点はご安心を。陰では神々の守りがあります。目に見える方は、私があの和尚たちにお世話をさせましょう。」
    すぐに和尚たちを呼び寄せて言った。
    行者「何人かで、あの老いぼれを埋めてこい。何人かは俺の師のお世話をし、白馬の番をしろ。」
    僧たちは承知した。行者はさらに言った。
    行者「口先だけで承知して、俺が行ったら、世話にも来なくなるなどと思うなよ。師につく者は、顔を和らげ、にこやかに仕えろ。白馬を養う者は、水も草もよく加減してやれ。ほんの少しでも怠れば、この棒の見本どおりになる。見せてやろう。」
    棒を抜き、焼けた煉瓦の壁へ、どんと一撃を下した。壁は粉々になり、その震動でさらに七、八重の壁が倒れた。僧たちはそれを見て、一人残らず骨も身も萎え、しびれ、ひざまずいて額づき、涙を流した。
    僧たち「おじいさま、どうぞ安心してお出かけください。我らは力を尽くし、心を込めてお客人にお仕えします。決して少しも粗略にはいたしません。」
  "translation_status": "reviewed"
- "id": "xy-ch16-036"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，急縱觔斗雲，徑上黑風山，尋找這袈裟。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 179
    "line_end": 179
  "translation_ja": "さても行者、急いで觔斗雲（きんとうん）を駆り、まっすぐ黒風山へ上がって、袈裟を探しに行った。まさしく。"
  "translation_status": "reviewed"
- "id": "xy-ch16-037"
  "section_id": "chapter-16"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    金禪求正出京畿，仗錫投西涉翠微。
    虎豹狼蟲行處有，工商士客見時稀。
    路逢異國愚僧妒，全仗齊天大聖威。
    火發風生禪院廢，黑熊夜盜錦襴衣。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch16-1455565"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455565&title=西遊記/第016回"
    "line_start": 181
    "line_end": 184
  "translation_ja": |-
    金禅（きんぜん）は正しき教えを求めて都の地を出で、錫杖（しゃくじょう）を頼りに西へ向かい、緑の山々を越える。
    虎や豹、狼などの獣は行く先々におり、職人や商人、学士や旅人にはめったに会わぬ。
    道で異国の愚僧の妬みに遭い、ひとえに斉天大聖（せいてんたいせい）の威力に頼る。
    火が起こり、風が生じて禅院は廃れ、黒熊は夜に錦襴（きんらん）の衣を盗む。
  "translation_status": "reviewed"
  "issues":

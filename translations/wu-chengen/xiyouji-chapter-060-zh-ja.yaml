    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 114
    "line_end": 115
  "translation_ja": |-
    第六十回
    牛魔王、戦いをやめて盛大な宴へ赴き　悟空、二度目の芭蕉扇借用に挑む
  "translation_status": "reviewed"
- "id": "xy-ch60-002"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "土地說：「大力王即牛魔王也。」行者道：「這山本是牛魔王放的火，假名火焰山？」土地道：「不是，不是。大聖若肯赦小神之罪，方敢直言。」行者道：「你有何罪？直說無妨。」土地道：「這火原是大聖放的。」行者怒道：「我在那裡？你這等亂談。我可是放火之輩？」土地道：「是你也認不得我了。此間原無這座山。因大聖五百年前大鬧天宮時，被顯聖擒了，壓赴老君，將大聖安於八卦爐內。煅煉之後開鼎，被你蹬倒丹爐，落了幾個磚來，內有餘火，到此處化為火焰山。我本是兜率宮守爐的道人，當被老君怪我失守，降下此間，就做了火焰山土地也。」豬八戒聞言，恨道：「怪道你這等打扮，原來是道士變的土地。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 118
    "line_end": 118
  "translation_ja": |-
    土地神（とちがみ）「大力王（だいりきおう）とは、牛魔王（ぎゅうまおう）のことでございます。」
    悟空（ごくう）「それなら、この山はもともと牛魔王が火を放った所で、火焔山（かえんざん）というのは仮の名なのか。」
    土地神「違います、違います。大聖（たいせい）がこの小さな神の罪をお許しくださるなら、ありのまま申し上げましょう。」
    悟空「お前にどんな罪がある。構わんから、はっきり言え。」
    土地神「この火は、もとは大聖がお放ちになったものなのです。」
    悟空は怒って言った。
    悟空「俺がどこにいたというんだ。でたらめを言うな。俺が火つけをするような奴か。」
    土地神「私のことも、お忘れなのですね。ここにはもともと、この山はございませんでした。五百年前、大聖が天宮で大暴れなさったとき、顕聖（けんせい）に捕らえられ、老君（ろうくん）のもとへ引き立てられて、八卦炉（はっけろ）に入れられました。焼き煉られたのちに炉の蓋が開くと、大聖は丹炉（たんろ）を蹴り倒されました。そのとき落ちてきた煉瓦がいくつかあり、中に残っていた火がこの地で火焔山となったのでございます。私はもと兜率宮（とそつきゅう）で炉を守っていた道人（どうじん）でした。老君から持ち場を守らなかったとお叱りを受け、この地へ落とされて、火焔山の土地神になったのです。」
    これを聞いた八戒（はっかい）は、憎々しげに言った。
    八戒「道理でそんな格好をしているわけだ。道士が土地神に化けたのだったか。」
  "translation_status": "reviewed"
- "id": "xy-ch60-003"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者半信不信道：「你且說，早尋大力王何故？』土地道：「大力王乃羅剎女丈夫。他這向撇了羅剎，現在積雷山摩雲洞。有個萬年狐王，那狐王死了，遺下一個女兒，叫做玉面公主。那公主有百萬家私，無人掌管。二年前，訪著牛魔王神通廣大，情願倒陪家私，招贅為夫。那牛王棄了羅剎，久不回顧。若大聖尋著牛王，拜求來此，方借得真扇：一則搧息火焰，可保師父前進；二來永除火患，可保此地生靈；三者赦我歸天，回繳老君法旨。」行者道：「積雷山坐落何處？到彼有多少程途？」土地道：「在正南方。此間到彼，有三千餘里。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    悟空は半信半疑で尋ねた。
    悟空「それで、なぜ早く大力王を捜せというんだ。話してみろ。」
    土地神「大力王は羅刹女（らせつにょ）の夫です。近ごろは羅刹女を捨て置いて、積雷山（せきらいざん）の摩雲洞（まうんどう）におります。そこには万年狐王（まんねんこおう）という者がいましたが、死んでしまい、玉面公主（ぎょくめんこうしゅ）という娘を一人残しました。公主には百万もの財産がありましたが、それを取り仕切る者がおりませんでした。二年前、牛魔王には広大な神通力があると聞きつけ、自分の財産を持参金にしてまで、婿に迎えたのでございます。牛魔王は羅刹女を捨て、長く帰ろうともしません。大聖が牛魔王を捜し当て、拝んでこちらへ来てもらえば、ようやく本物の扇を借りられましょう。一つには、火をあおぎ消してお師匠さまを先へお進めできます。二つには、火の災いを永久に除き、この地の生き物を守れます。三つには、私も赦されて天へ帰り、老君のご命令を果たしたと報告できるのでございます。」
    悟空「積雷山はどっちにある。ここからどれくらいの道のりだ。」
    土地神「真南でございます。ここから三千余里（り）あります。」
  "translation_status": "reviewed"
- "id": "xy-ch60-004"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，即吩咐沙僧、八戒保護師父，又教土地陪伴勿回。隨即忽的一聲，渺然不見。那裡消半個時辰，早見一座高山凌漢。按落雲頭，停立巔峰之上觀看，真是好山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 121
    "line_end": 121
  "translation_ja": "これを聞いた悟空は、沙悟浄（さごじょう）と八戒に師を守るよう言いつけ、土地神にも帰らずそばに付き添っているよう命じた。すると、ひゅっと音を立てて、たちまち姿が見えなくなった。半時（はんとき）もたたないうちに、天の川へそびえる高山が見えてきた。雲を降ろし、峰の頂に立ち止まって眺めると、まことに見事な山だった。"
  "translation_status": "reviewed"
- "id": "xy-ch60-005"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "高不高，頂摩碧漢；大不大，根扎黃泉。山前日暖，嶺後風寒。山前日暖，有三冬草木無知；嶺後風寒，見九夏冰霜不化。龍潭接澗水長流，虎穴依崖花放早。水流千派似飛瓊，花放一心如布錦。灣環嶺上灣環樹，扢扠石外扢扠松。真個是：高的山，峻的嶺；陡的崖，深的澗；香的花，美的果；紅的藤，紫的竹；青的松，翠的柳。八節四時顏不改，千年萬古色如龍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    高いかと問えば、頂は青い天の川に触れ、
    大きいかと問えば、根は黄泉（よみ）にまで届く。
    山の前は日が暖かく、尾根の後ろは風が寒い。
    山の前は日が暖かく、冬の三か月にも草木は寒さを知らず、
    尾根の後ろは風が寒く、夏の九旬にも氷霜は解けない。
    竜の淵は谷川とつながり、水は絶えず流れ、
    虎の穴は崖に寄り添い、花は早く開く。
    千筋に分かれる水は、玉が飛び散るよう、
    心いっぱいに咲く花は、錦を敷くよう。
    曲がりくねる尾根には、曲がりくねる木、
    ごつごつした岩の外には、節くれだった松。
    まことに、高い山、険しい尾根、
    切り立つ崖、深い谷、
    香りよい花、美しい実、
    赤い蔓、紫の竹、
    青い松、緑の柳。
    八節（はっせつ）四時（しじ）にも姿は変わらず、
    千年万古にわたり、その色は竜のように生き生きとしている。
  "translation_status": "reviewed"
- "id": "xy-ch60-006"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖看夠多時，步下尖峰，入深山，找尋路徑。正自沒個消息，忽見松陰下有一女子，手摺了一枝香蘭，嬝嬝娜娜而來。大聖閃在怪石之傍，定睛觀看，那女子怎生模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 124
    "line_end": 124
  "translation_ja": "悟空はしばらく飽きるほど眺めてから、尖った峰を下り、山の奥へ入って道を捜した。手がかりが何もないと思っていると、松の木陰に一人の女が現れた。手には香りよい蘭を一枝折り取り、しなやかに身を揺らして歩いてくる。悟空は奇岩のそばへ身を隠し、じっと目を凝らした。さて、その女はどのような姿だったか。"
  "translation_status": "reviewed"
- "id": "xy-ch60-007"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "嬌嬌傾國色，緩緩步移蓮。貌若王嬙，顏如楚女。如花解語，似玉生香。高髻堆青\U00022DD1碧鴉，雙睛蘸綠橫秋水。湘裙半露弓鞋小，翠袖微舒粉腕長。說甚麼暮雨朝雲，真個是朱唇皓齒。錦江滑膩蛾眉秀，賽過文君與薛濤。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    あでやかに国を傾けるほどの美しさ、
    ゆるやかに蓮のような足を運ぶ。
    容貌は王嬙（おうしょう）のよう、顔立ちは楚（そ）の女のよう。
    花が言葉を解し、玉が香りを放つかのようだ。
    高い髻（もとどり）には、青々と烏の羽のような黒髪が盛り上がり、
    二つの瞳には緑が映り、秋の水が横たわる。
    湘裙（しょうくん）からは小さな弓靴（ゆみぐつ）が半ばのぞき、
    緑の袖が少し開くと、白粉をつけた長い手首が現れる。
    夕べの雨、朝の雲など、何ほどのことだろう。
    こちらこそ、まことに赤い唇と白い歯の美人。
    錦江（きんこう）のようになめらかで艶やか、蛾の触角のような眉も秀で、
    文君（ぶんくん）や薛濤（せっとう）をさえしのいでいる。
  "translation_status": "reviewed"
- "id": "xy-ch60-008"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那女子漸漸走近石邊，大聖躬身施禮，緩緩而言曰：「女菩薩何往？」那女子未曾觀看，聽得叫問，卻自擡頭。忽見大聖的相貌醜陋，老大心驚，欲退難退，欲行難行，只得戰兢兢，勉強答道：「你是何方來者？敢在此間問誰？」大聖沉思道：「我若說出取經求扇之事，恐這廝與牛王有親。且只以假親托意，來請魔王之言而答方可。」那女子見他不語，變了顏色，怒聲喝道：「你是何人，敢來問我？」大聖躬身陪笑道：「我是翠雲山來的，初到貴處，不知路徑。敢問菩薩，此間可是積雷山？」那女子道：「正是。」大聖道：「有個摩雲洞，坐落何處？」那女子道：「你尋那洞做甚？」大聖道：「我是翠雲山芭蕉洞鐵扇公主央來請牛魔王的。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    女がだんだん岩のそばへ近づいてくると、悟空は身をかがめて礼をし、静かに声をかけた。
    悟空「女菩薩さま、どちらへおいでですか。」
    女はまだ相手を見ていなかったが、呼びかけを聞いて顔を上げた。とつぜん悟空の醜い姿が目に入り、ひどく驚いた。引き返すにも引き返せず、進むにも進めず、震えながらようやく答えた。
    女「あなたはどこから来た人なの。こんな所で、誰にものを尋ねているの。」
    悟空は深く考えた。
    悟空「経を取りに行くため扇を借りたいと話したら、こいつは牛魔王の身内かもしれん。ひとまず縁者の頼みを受けたと偽り、魔王を迎えに来たと答えよう。」
    黙っているのを見た女は顔色を変え、怒った声で叱った。
    女「何者なの。よくも私に声をかけられるわね。」
    悟空は身をかがめ、愛想笑いをして言った。
    悟空「翠雲山（すいうんざん）から参りました。こちらは初めてで、道が分かりません。菩薩さま、ここは積雷山でございましょうか。」
    女「そうよ。」
    悟空「摩雲洞という所は、どちらにございますか。」
    女「その洞に何の用なの。」
    悟空「翠雲山の芭蕉洞（ばしょうどう）にいらっしゃる鉄扇公主（てっせんこうしゅ）に頼まれて、牛魔王を迎えに来たのでございます。」
  "translation_status": "reviewed"
- "id": "xy-ch60-009"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那女子一聽鐵扇公主請牛魔王之言，心中大怒，徹耳根子通紅，潑口罵道：「這賤婢，著實無知。牛王自到我家，未及二載，也不知送了他多少珠翠金銀、綾羅緞疋，年供柴，月供米，自自在在受用，還不識羞，又來請他怎的？」大聖聞言，情知是玉面公主，故意掣出金箍棒，大喝一聲道：「你這潑賤，將家私買住牛王，誠然是陪錢嫁漢，你倒不羞，卻敢罵誰？」那女子見了，諕得魄散魂飛，沒好步，亂\U00024731金蓮，戰兢兢回頭便走。這大聖吆吆喝喝，隨後相跟。原來穿過松陰，就是摩雲洞口。女子跑進去，撲的把門關了。大聖卻收了金箍棒，停步看時，好所在："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    女は、鉄扇公主が牛魔王を迎えによこしたと聞くと、ひどく腹を立て、耳の根まで真っ赤になって、口汚く罵った。
    女「あのあばずれめ、本当にものの分からない女だこと。牛魔王が私の家へ来てから、まだ二年にもならないのに、真珠や翡翠、金銀、綾絹、薄絹、緞子を、どれほど送ってやったか分からない。毎年の薪も、毎月の米も届けてやって、気楽に使っていられるくせに。まだ恥も知らず、今さら何で迎えになどよこすのよ。」
    悟空はこれを聞いて、この女が玉面公主だと悟った。わざと金箍棒（きんこぼう）を引き抜き、一喝した。
    悟空「このあばずれめ。財産で牛魔王を買いつけ、まさしく金をつけて男に嫁いだくせに、お前の方は恥ずかしくないのか。よくも人を罵れるな。」
    玉面公主は棒を見ると魂も吹き飛ぶほどおびえ、まともに歩くこともできず、小さな足をめちゃくちゃに運び、がたがた震えながら身を返して逃げた。悟空は大声で怒鳴りつけながら、後を追っていった。松陰を抜ければ、そこが摩雲洞の入口だった。玉面公主は駆け込むと、ばたんと門を閉じた。悟空は金箍棒をしまい、立ち止まって見回した。何ともよい場所である。
  "translation_status": "reviewed"
- "id": "xy-ch60-010"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "樹林森密，崖削崚嶒。薜蘿陰冉冉，蘭蕙味馨馨。流泉漱玉穿修竹，巧石知機帶落英。煙霞籠遠岫，日月照雲屏。龍吟虎嘯，鶴唳鶯鳴。一片清幽真可愛，琪花瑤草景常明。不亞天臺仙洞，勝如海上蓬瀛。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    林は深く茂り、崖は削り立ったように険しい。
    蔓草の陰はゆったり垂れ、蘭や蕙（けい）の香りはかぐわしい。
    流れる泉は玉を洗うように長い竹の間を抜け、
    巧みな形の岩は、心得たように散る花を受け止める。
    もやと霞が遠い峰を包み、日月が雲の屏風を照らす。
    竜が吟じ、虎がほえ、鶴が鳴き、鶯がさえずる。
    一帯の清らかな静けさは、まことに愛でたい。
    玉のような花や草が、いつも景色を明るく彩る。
    天台（てんだい）の仙洞に引けを取らず、
    海の上の蓬瀛（ほうえい）にもまさっている。
  "translation_status": "reviewed"
- "id": "xy-ch60-011"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言行者這裡觀看景致。卻說那女子跑得粉汗淋淋，諕得蘭心吸吸，徑入書房裡面。原來牛魔王正在那裡靜玩丹書。這女子沒好氣倒在懷裡，抓耳撓腮，放聲大哭。牛王滿面陪笑道：「美人，休得煩惱。有甚話說？」那女子跳天索地，口中罵道：「潑魔害殺我也！」牛王笑道：「你為甚事罵我？」女子道：「我因父母無依，招你護身養命。江湖中說你是條好漢，你原來是個懼內的庸夫。」牛王聞說，將女子抱住道：「美人，我有那些不是處？你且慢慢說來，我與你陪禮。」女子道：「適才我在洞外閑步花陰，折蘭採蕙，忽有一個毛臉雷公嘴的和尚，猛地前來施禮，把我嚇了個呆掙。及定性問是何人，他說是鐵扇公主央他來請牛魔王的。被我說了兩句，他倒罵了我一場，將一根棍子趕著我打。若不是走得快些，幾乎被他打死。這不是招你為禍？害殺我也。」牛王聞言，卻與他整容陪禮，溫存良久，女子方才息氣。魔王卻發狠道：「美人在上，不敢相瞞。那芭蕉洞雖是僻靜，卻清幽自在。我山妻自幼修持，也是個得道的女仙，卻是家門嚴謹，內無一尺之童，焉得有雷公嘴的男子央來？這想是那裡來的妖怪，或者假綽名聲，至此訪我。等我出去看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    悟空が景色を眺めている話は、ひとまず置こう。玉面公主は走ったため白粉の肌に汗が流れ、恐ろしさに胸をあえがせながら、まっすぐ書斎へ入った。牛魔王はそこで静かに丹書（たんしょ）を読んでいた。玉面公主は不機嫌なままその懐へ倒れ込み、耳や頬をかきむしり、声をあげて大泣きした。牛魔王は顔いっぱいに愛想笑いを浮かべた。
    牛魔王「愛しい人よ、そう嘆かないでくれ。何があったのか、話しておくれ。」
    玉面公主は飛び上がったり地団駄を踏んだりしながら罵った。
    玉面公主「ろくでなしの魔王め。お前のせいで死ぬところだったわ。」
    牛魔王は笑って尋ねた。
    牛魔王「どうして俺を罵るんだ。」
    玉面公主「父も母もなく、頼る者がいないから、お前を婿に迎えて、身を守り、暮らしを支えてもらおうと思ったのよ。世間では立派な男だと評判だったのに、実際は妻を怖がる腰抜けだったのね。」
    牛魔王はそれを聞くと、玉面公主を抱きしめた。
    牛魔王「愛しい人よ、俺にどんな落ち度があった。まずゆっくり話しておくれ。謝るから。」
    玉面公主「さっき洞の外で、花陰をのんびり歩き、蘭や蕙を摘んでいたら、毛むくじゃらの顔に雷神のような突き出た口をした坊主が、いきなり前へ来て礼をしたの。驚いて、ぽかんとしてしまったわ。気を落ち着けて誰かと聞けば、鉄扇公主に頼まれて牛魔王を迎えに来たと言うじゃないの。二言ばかり言ってやったら、かえって私をさんざん罵ったうえ、棒を持って私を追い回し、殴りつけたのよ。早く逃げなければ、危うく殴り殺されるところだったわ。お前を迎えて災いを招いたようなものじゃないの。死ぬところだったのよ。」
    牛魔王はこれを聞き、表情を改めて謝り、長いこと優しくなだめて、玉面公主はようやく怒りを鎮めた。そこで牛魔王は、険しい声で言った。
    牛魔王「愛しい人よ、隠し立てはしない。あの芭蕉洞は人里離れてはいるが、清らかで静かに暮らせる所だ。うちの妻は幼いころから修行し、道を得た女仙でもある。家の取り締まりも厳しく、一尺（しゃく）ほどの男の子さえ中には置いておらん。どうして雷神の口をした男などに、使いを頼むものか。どこからか来た妖怪が、名をかたって俺を訪ねてきたのだろう。出て見てこよう。」
  "translation_status": "reviewed"
- "id": "xy-ch60-012"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好魔王，拽開步，出了書房，上大廳取了披掛，結束了。拿了一條混鐵棍，出門高叫道：「是誰人在我這裡無狀？」行者在傍，見他那模樣，與五百年前又大不同。只見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    さて牛魔王は大股に書斎を出、大広間で鎧兜を取り、身支度を整えた。一本の混鉄棍（こんてつこん）を手にして門を出ると、大声をあげた。
    牛魔王「俺の所で無礼を働くのは、どいつだ。」
    そばにいた悟空がその姿を見ると、五百年前とはまた大きく様子が違っていた。見れば、次のようである。
  "translation_status": "reviewed"
- "id": "xy-ch60-013"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "頭上戴一頂水磨銀亮熟鐵盔，身上貫一副絨穿錦繡黃金甲，足下踏一雙捲尖粉底麂皮靴；腰間束一條攢絲三股獅蠻帶。一雙眼光如明鏡，兩道眉艷似紅霓。口若血盆，齒排銅板。吼聲響震山神怕，行動威風惡鬼慌。四海有名稱混世，西方大力號魔王。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    頭にかぶるのは、水磨きで銀のように光る錬鉄の兜。
    身につけるのは、錦繍に彩られ、絹糸でつづった黄金の鎧。
    足には、つま先の反り返った白底の麂（き）皮の長靴を履き、
    腰には、絹糸を三つ組みにし、獅子と異国人の飾りをつけた帯を締める。
    二つの目の光は明鏡のよう、二筋の眉は赤い虹のように鮮やか。
    口は血を盛った鉢のようで、歯は銅板を並べたようだ。
    ほえる声が響けば山神もおびえ、動く威風には悪鬼も慌てる。
    四海に名を知られ、世をかき乱す者と呼ばれ、
    西方で大力を振るう、魔王の号を持つ者である。
  "translation_status": "reviewed"
- "id": "xy-ch60-014"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖整衣上前，深深的唱個大喏道：「長兄，還認得小弟麼？」牛王答禮道：「你是齊天大聖孫悟空麼？」大聖道：「正是，正是。一向久別未拜。適才到此問一女子，方得見兄。丰采果勝常，可賀也。」牛王喝道：「且休巧舌。我聞你鬧了天宮，被佛祖降壓在五行山下，近解脫天災，保護唐僧西天見佛求經，怎麼在號山枯松澗火雲洞把我小兒牛聖嬰害了？正在這裡惱你，你卻怎麼又來尋我？」大聖作禮道：「長兄勿得誤怪小弟。當時令郎捉住吾師，要食其肉，小弟近他不得，幸觀音菩薩欲救我師，勸他歸正。現今做了善財童子，比兄長還高，享極樂之門堂，受逍遙之永壽，有何不可，返怪我耶？」牛王罵道：「這個乖嘴的猢猻！害子之情，被你說過；你才欺我愛妾，打上我門何也？」大聖笑道：「我因拜謁長兄不見，向那女子拜問，不知就是二嫂嫂。因他罵了我幾句，是小弟一時粗鹵，驚了嫂嫂。望長兄寬恕寬恕。」牛王道：「既如此說，我看故舊之情，饒你去罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    悟空は衣服を整えて前へ進み、深々と挨拶した。
    悟空「長兄、弟分をまだ覚えておいでですか。」
    牛魔王は礼を返した。
    牛魔王「お前は斉天大聖（せいてんたいせい）、孫悟空（そんごくう）か。」
    悟空「そうです、そうです。長らくお目にかかりませんでした。先ほどこちらへ参り、一人の女性に尋ねて、ようやく兄上に会えました。お姿も以前にまさってお見事で、何よりです。」
    牛魔王は怒鳴った。
    牛魔王「口先の上手なことを言うな。お前は天宮で暴れ、仏祖（ぶっそ）に降伏させられて五行山（ごぎょうざん）の下に押し込められたと聞いたぞ。近ごろようやく天の災難を逃れ、唐僧（とうそう）を守って西天（さいてん）へ仏を拝み、経を求めに行くというではないか。それなのに、なぜ号山（ごうざん）の枯松澗（こしょうかん）、火雲洞（かうんどう）で、俺のせがれ牛聖嬰（ぎゅうせいえい）をひどい目に遭わせた。ちょうどそのことで腹を立てていたところへ、何をしに俺を捜してきたんだ。」
    悟空は礼をして言った。
    悟空「兄上、弟分を見当違いに責めないでください。あのとき、ご子息は私の師を捕らえて、肉を食おうとしていたのです。私は近寄ることさえできませんでしたが、幸い観音菩薩（かんのんぼさつ）がお師匠さまを救おうとなさって、ご子息に正しい道へ帰るようお勧めになりました。今では善財童子（ぜんざいどうじ）となって、兄上よりも高い位におられます。極楽の堂に暮らし、のびのびと永遠の命を享けられるのに、何が悪いのでしょう。どうして私を責めるのですか。」
    牛魔王は罵った。
    牛魔王「この口の達者な猿め。せがれを害した件は、そう言いくるめたとしても、さっき俺の愛妾をいじめ、門まで押しかけてきたのはなぜだ。」
    悟空は笑って言った。
    悟空「兄上にご挨拶したくても会えなかったので、あの女性に礼をして尋ねたのです。二番目の姉上だとは存じませんでした。何言か罵られたので、つい粗暴な振る舞いをして、姉上を驚かせてしまいました。兄上、どうかお許しください、お許しください。」
    牛魔王「そういうことなら、昔のよしみで見逃してやる。行け。」
  "translation_status": "reviewed"
- "id": "xy-ch60-015"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖道：「既蒙寬恩，感謝不盡。但尚有一事奉瀆，萬望周濟周濟。」牛王罵道：「這猢猻不識起倒，饒了你，倒還不走，反來纏我。甚麼周濟周濟？」大聖道：「實不瞞長兄，小弟因保唐僧西進，路阻火焰山，不能前進。詢問土人，知尊嫂羅剎女有一柄芭蕉扇，欲求一用。昨到舊府奉拜嫂嫂，嫂嫂堅執不借。是以特求長兄，望兄長開天地之心，同小弟到大嫂處一行，千萬借扇搧滅火焰，保得唐僧過山，即時完璧。」牛王聞言，心如火發，咬響鋼牙罵道：「你說你不無禮，你原來是借扇之故。一定先欺我山妻，山妻想是不肯，故來尋我，且又趕我愛妾。常言道：『朋友妻，不可欺；朋友妾，不可滅。』你既欺我妻又滅我妾，多大無禮？上來吃我一棍。」大聖道：「哥要說打，弟也不懼。但求寶貝，是我真心，萬乞借我使使。」牛王道：「你若三合敵得我，我著山妻借你；如敵不過，打死你，與我雪恨。」大聖道：「哥說得是。小弟這一向疏懶，不曾與兄相會，不知這幾年武藝比昔日如何，我兄弟們請演演棍看。」這牛王那容分說，掣混鐵棍，劈頭就打；這大聖持金箍棒，隨手相迎。兩個這場好鬥："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    悟空「寛大なお許し、いくら感謝してもしきれません。ただ、もう一つご面倒をおかけしたいことがございます。どうかお力をお貸しください、お貸しください。」
    牛魔王は罵った。
    牛魔王「この猿は、まるで道理をわきまえん。見逃してやったのに帰りもせず、かえってまとわりつくとは。何が『力を貸してくれ、貸してくれ』だ。」
    悟空「兄上に隠さず申し上げます。私は唐僧を守って西へ進んでおりますが、火焔山に道を阻まれて、先へ進めません。土地の人に尋ねると、姉上の羅刹女が芭蕉扇（ばしょうせん）を一本お持ちだというので、一度お借りしたいのです。昨日、以前のお住まいへ参って姉上にお願いしましたが、姉上は頑として貸してくださいませんでした。そこで、特に兄上を頼って来たのです。どうか天地のように広いお心で、私とご一緒に本妻の姉上の所へおいでください。ぜひ扇をお借りして火をあおぎ消し、唐僧を守って山を越えられましたら、すぐに元どおりお返しいたします。」
    牛魔王は聞くや、心に火がついたようになり、鋼のような歯をぎりぎりいわせて罵った。
    牛魔王「無礼はしていないと言いながら、もとは扇を借りるためだったのか。まず俺の妻をいじめたに決まっている。妻が承知しなかったので俺を捜しに来て、そのうえ愛妾を追い回したというわけだ。昔から『友の妻をいじめるな、友の妾を侮るな』という。俺の妻をいじめ、妾まで侮るとは、どれほど無礼を重ねれば気が済む。来い、俺の棍を受けてみろ。」
    悟空「兄上が戦えとおっしゃるなら、弟分も恐れはしません。ただ、宝をお借りしたいのは本心です。どうかひとたび使わせてください。」
    牛魔王「三合、俺をしのげたら、妻に貸してやらせよう。しのげなければ殴り殺し、恨みを晴らしてやる。」
    悟空「それで結構です。近ごろは怠けて、兄上にもお会いせずにおりました。この数年で武芸が昔よりどうなったか、存じません。兄弟で、ひとつ棍の技を披露し合おうではありませんか。」
    牛魔王はそれ以上言わせず、混鉄棍を振りかぶって頭めがけて打ち下ろした。悟空は金箍棒を持ち、すかさず迎え撃った。二人の戦いは、まことに見事だった。
  "translation_status": "reviewed"
- "id": "xy-ch60-016"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "金箍棒，混鐵棍，變臉不以朋友論。那個說：「正怪你這猢猻害子情。」這個說：「你令郎已得道休嗔恨。」那個說：「你無知怎敢上我門？」這個說：「我有因特地來相問。」一個要求扇子保唐僧，一個不借芭蕉忒鄙吝。語去言來失舊情，舉家無義皆生忿。牛王棍起賽蛟龍，大聖棒迎神鬼遁。初時爭鬥在山前，後來齊駕祥雲進。半空之內顯神通，五彩光中施妙運。兩條棍響振天關，不見輸贏皆傍寸。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    金箍棒と混鉄棍、
    顔色変われば、もう友達の情けはない。
    牛魔王「この猿め、せがれを害した恨みがある。」
    悟空「ご子息は道を得たのだ。怒るのはよしてくれ。」
    牛魔王「無知な奴、よくも俺の門へ来られたな。」
    悟空「理由があって、わざわざ頼みに来たのだ。」
    一人は扇を求め、唐僧を守ろうとし、
    一人は芭蕉扇を貸さず、ひどく出し惜しみする。
    言葉の応酬に昔の情けは失せ、
    一家そろって義理をなくし、みな腹を立てる。
    牛魔王が棍を振れば蛟竜（こうりゅう）にもまさり、
    大聖の棒が迎えれば神も鬼も逃げ出す。
    初めは山の前で争っていたが、
    やがて二人ともめでたい雲に乗って進む。
    空の中で神通力を現し、
    五色の光の中で不思議な技を繰り出す。
    二本の棍の響きは天の関を震わせ、
    勝敗は見えず、互いに一寸も譲らない。
  "translation_status": "reviewed"
- "id": "xy-ch60-017"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖與那牛王鬥經百十回合，不分勝負。正在難解難分之際，只聽得山峰上有人叫道：「牛爺爺，我大王多多拜上，幸賜早臨，好安座也。」牛王聞說，使混鐵棍支住金箍棒，叫道：「猢猻，你且住了，等我去一個朋友家赴會來者。」言畢，按下雲頭，徑至洞裡，對玉面公主道：「美人，才那雷公嘴的男子乃孫悟空猢猻，被我一頓棍打走了，再不敢來。你放心耍子。我到一個朋友處吃酒去也。」他才卸了盔甲，穿一領鴉青剪絨襖子，走出門，跨上辟水金睛獸，著小的們看守門庭，半雲半霧，一直向西北方而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 140
    "line_end": 140
  "translation_ja": |-
    悟空と牛魔王は百十合も戦ったが、勝負はつかなかった。まさに引くにも分かれるにも分かれられないところへ、峰の上から叫ぶ声が聞こえた。
    山上の声「牛さま、わが王から、くれぐれもよろしくとのことです。どうかお早くお越しください。お席へご案内したく存じます。」
    牛魔王は聞くと、混鉄棍で金箍棒を押し止め、叫んだ。
    牛魔王「猿、ひとまずやめろ。友人の家へ、宴に出かけてくる。」
    そう言って雲を降ろし、まっすぐ洞へ戻ると、玉面公主に告げた。
    牛魔王「愛しい人よ、さっきの雷神の口をした男は、孫悟空という猿だった。俺が棍でさんざん打って追い払ったから、もう来る度胸はない。安心して遊んでおいで。俺は友人の所へ酒を飲みに行ってくる。」
    それから鎧兜を脱ぎ、烏の羽のような濃紺の、毛足を刈りそろえた上着を着て、門を出た。辟水金睛獣（へきすいきんせいじゅう）にまたがり、小妖怪たちに門を守るよう命じると、雲とも霧ともつかないものに乗って、一直線に西北へ向かった。
  "translation_status": "reviewed"
- "id": "xy-ch60-018"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖在高峰上看著，心中暗想道：「這老牛不知又結識了甚麼朋友，往那裡去赴會。等老孫跟他走走。」好行者，將身幌一幌，變作一陣清風趕上，隨著同走。不多時，到了一座山中，那牛王寂然不見。大聖聚了原身，入山尋看。那山中有一面清水深潭，潭邊有一座石碣，碣上有六個大字，乃「亂石山碧波潭」。大聖暗想道：「老牛斷然下水去了。水底之精，若不是蛟精，必是龍精、魚精，或是龜鱉黿鼉之精。等老孫也下去水看看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    悟空は高い峰から見て、ひそかに考えた。
    悟空「あの老いぼれ牛め、またどんな友達をつくって、どこへ宴に行くのやら。俺も後をつけてみよう。」
    悟空は身を揺すって一陣の清風に変わり、追いついて一緒に進んだ。ほどなくある山へ着くと、牛魔王は音もなく姿を消した。悟空はもとの体に戻り、山へ入って捜した。山中には澄んだ水をたたえた深い淵があり、岸の石碑に六つの大きな字で「乱石山（らんせきざん）碧波潭（へきはたん）」とあった。悟空は心の中で考えた。
    悟空「老いぼれ牛は、間違いなく水へ入ったのだ。水底の妖怪なら、蛟でなければ竜か魚、あるいは亀、すっぽん、大すっぽん、鼉（だ）のたぐいだろう。俺も水へ入って見てやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch60-019"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，捻著訣，念個咒語，搖身一變，變作一個螃蟹，不大不小的有三十六斤重。撲的跳在水中，徑沉潭底。忽見一座玲瓏剔透的牌樓，樓下拴著那個辟水金睛獸。進牌樓裡面，卻就沒水。大聖爬進去，仔細看時，只見那壁廂一派音樂之聲。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 143
    "line_end": 143
  "translation_ja": "悟空は印を結び、呪文を唱え、身を揺すって蟹に化けた。大きすぎも小さすぎもしない、その重さは三十六斤（きん）。どぶんと水へ跳び込み、まっすぐ淵の底へ沈んだ。すると、透かし彫りの見事な牌楼（はいろう）が一つあり、その下にあの辟水金睛獣がつながれていた。牌楼の内側へ入ると、もう水はなかった。悟空は這い込んで、注意深く見た。向こうからは、にぎやかな音楽が聞こえてくる。見れば、このようであった。"
  "translation_status": "reviewed"
- "id": "xy-ch60-020"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "朱宮貝闕，與世不殊。黃金為屋瓦，白玉作門樞。屏開玳瑁甲，檻砌珊瑚珠。祥雲瑞藹輝蓮座，上接三光下入衢。非是天宮並海藏，果然此處賽蓬壺。高堂設宴羅賓主，大小官員冠冕珠。忙呼玉女捧牙槃，催喚仙娥調律呂。長鯨鳴，巨蟹舞，鱉吹笙，鼉擊鼓，驪頷之珠照樽俎。鳥篆之文列翠屏，蝦鬚之簾掛廊廡。八音迭奏雜仙韶，宮商響徹遏雲霄。青頭鱸妓撫瑤瑟，紅眼馬郎品玉簫。鱖婆頂獻香獐脯，龍女頭簪金鳳翹。吃的是，天廚八寶珍饈味；飲的是，紫府瓊漿熟醞醪。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    朱の宮殿、貝で飾った門楼は、世にある宮殿と変わらない。
    黄金を屋根瓦とし、白玉を門の軸とする。
    屏風には鼈甲が張られ、欄干には珊瑚や真珠が埋め込まれる。
    めでたい雲と気が蓮の座を輝かせ、
    上は三光（さんこう）へつながり、下は通りへと続く。
    天宮でも海の宝殿でもないのに、
    まことにここは蓬壺（ほうこ）をもしのいでいる。
    高い広間に宴が設けられ、主と客が並び、
    大小の役人たちは、珠を飾った冠をかぶる。
    玉女（ぎょくじょ）に急いで象牙の皿を捧げさせ、
    仙女をせき立てて音律を調えさせる。
    大鯨が鳴き、大蟹が舞い、
    すっぽんが笙（しょう）を吹き、鼉が太鼓を打つ。
    黒竜の顎の珠が酒器や料理の台を照らし、
    鳥篆（ちょうてん）の文字が緑の屏風に並び、
    海老のひげの簾が回廊に掛かる。
    八音（はちおん）が代わる代わる奏され、仙界の美しい調べが交じり、
    宮商（きゅうしょう）の響きは空まで徹して、雲をもとどめる。
    青頭のスズキの妓女が玉の瑟（しつ）をかき鳴らし、
    赤目の馬郎（ばろう）が玉の簫（しょう）を吹き鳴らす。
    鱖婆（けつば）は、香りよい獐（しょう）の干し肉を頭上に捧げて差し出し、
    竜の娘は、頭に金鳳の髪飾りを挿す。
    食べるのは、天の厨房で調えた八宝の珍味、
    飲むのは、紫府（しふ）の玉のしずく、よく醸した酒である。
  "translation_status": "reviewed"
- "id": "xy-ch60-021"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那上面坐的是牛魔王，左右有三四個蛟精，前面坐著一個老龍精，兩邊乃龍子、龍孫、龍婆、龍女。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 146
    "line_end": 146
  "translation_ja": "上座に座っているのは牛魔王で、左右には三、四人の蛟の妖怪がいた。その前には一人の老いた竜の妖怪が座り、両側には竜の子、竜の孫、竜の老女、竜の娘たちが並んでいた。"
  "translation_status": "reviewed"
- "id": "xy-ch60-022"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正在那裡觥籌交錯之際，孫大聖一直走將上去，被老龍看見，即命：「拿下那個野蟹來。」龍子、龍孫一擁上前，把大聖拿住。大聖忽作人言，叫：「饒命，饒命。」老龍道：「你是那裡來的野蟹？怎麼敢上廳堂，在尊客之前，橫行亂走？快早供來，免汝死罪。」好大聖，假捏虛言，對眾供道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    杯や酒令の数え棒が盛んに行き交っているところへ、悟空はまっすぐ這い上がっていった。老竜はそれを見ると、すぐに命じた。
    老竜「あの野良蟹を捕らえよ。」
    竜の子や孫たちがどっと進み出て、悟空を取り押さえた。悟空はとつぜん人の言葉で叫んだ。
    悟空「お命ばかりは、お命ばかりは。」
    老竜「お前はどこから来た野良蟹だ。よくも広間に上がり、大切な客の前を、横歩きで勝手にうろつけるな。早く白状しろ。そうすれば死罪は許してやる。」
    悟空は偽りをでっち上げ、一同に向かって申し立てた。
  "translation_status": "reviewed"
- "id": "xy-ch60-023"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    「生自湖中為活，傍崖作窟權居。蓋因日久得身舒，官受橫行介士。
    踏草拖泥落索，從來未習行儀。不知法度冒王威，伏望尊慈恕罪！」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 150
    "line_end": 151
  "translation_ja": |-
    悟空「湖に生まれ、そこで暮らし、
    崖のそばに穴を作り、ひとまず住んでおります。
    日を重ねて、ようやく身も伸びやかとなり、
    横行介士（おうこうかいし）の官を授かりました。
    草を踏み、泥を引きずる、みすぼらしい身で、
    立ち居振る舞いを習ったこともございません。
    法度を知らず、王のご威光を犯しました。
    伏してお願い申し上げます。慈悲深いお心で罪をお許しください。」
  "translation_status": "reviewed"
- "id": "xy-ch60-024"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "座上眾精聞言，都拱身對老龍作禮道：「蟹介士初入瑤宮，不知王禮，望尊公饒他去罷。」老龍稱謝了。眾精即教：「放了那廝，且記打，外面伺候。」大聖應了一聲，往外逃命，徑至牌樓之下。心中暗想道：「這牛王在此貪杯，那裡等得他散？就是散了，也不肯借扇與我。不如偷了他的金睛獸，變做牛魔王，去哄那羅剎女，騙他扇子，送我師父過山為妙。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    席上の妖怪たちはこれを聞くと、みな身をかがめて老竜に礼をした。
    妖怪たち「蟹の介士（かいし）は、初めてこの玉の宮殿に入り、王の礼儀を知らなかったのです。どうかお許しになり、お放しください。」
    老竜は一同に礼を述べた。妖怪たちはすぐに命じた。
    妖怪たち「そいつを放せ。打ちすえる罰はひとまず記しておき、外で控えさせよ。」
    悟空は一声返事をすると、命からがら外へ逃げ、まっすぐ牌楼の下へ行った。心の中で考えた。
    悟空「牛魔王はここで酒に夢中だ。宴が終わるまでなど待っていられるものか。終わったところで、扇を貸してはくれまい。それより、あいつの金睛獣（きんせいじゅう）を盗み、牛魔王に化けて羅刹女をだまし、扇を手に入れてお師匠さまを山越えさせる方がよい。」
  "translation_status": "reviewed"
- "id": "xy-ch60-025"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，即現本像，將金睛獸解了韁繩，撲一把，跨上雕鞍，徑直騎出水底。到於潭外，將身變作牛王模樣。打著獸，縱著雲，不多時，已至翠雲山芭蕉洞口。叫聲：「開門。」那洞門裡有兩個女童，聞得聲音開了門，看見是牛魔王嘴臉，即入報：「奶奶，爺爺來家了。」那羅剎聽言，忙整雲鬟，急移蓮步，出門迎接。這大聖下雕鞍，牽進金睛獸；弄大膽，誆騙女佳人。羅剎女肉眼，認他不出，即攜手而入，著丫鬟設座看茶。一家子見是主公，無不敬謹。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空はすぐにもとの姿に戻り、金睛獣の手綱をほどいた。ひらりと彫り物のある鞍にまたがり、そのまま水底から乗り出した。淵の外へ出ると牛魔王の姿に変わり、獣をせき立て、雲を飛ばした。ほどなく翠雲山の芭蕉洞の入口に着き、一声叫んだ。
    牛魔王に化けた悟空「門を開けろ。」
    門の中には二人の娘がいて、声を聞いて門を開けた。牛魔王の顔を見ると、すぐに中へ知らせた。
    二人の娘「奥さま、旦那さまがお帰りです。」
    羅刹女は聞くと、急いで髻を整え、小さな足を速めて、門の外へ迎えに出た。悟空は彫り鞍から下り、金睛獣を引いて入る。大胆にも美しい女をだまそうというのである。羅刹女には普通の肉眼しかなく、見破ることができなかった。その手を取って中へ入り、侍女に席を設け、茶を出すよう命じた。家の者たちは主人が帰ったと思い、誰もかれもかしこまっていた。
  "translation_status": "reviewed"
- "id": "xy-ch60-026"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "須臾間敘及寒溫，「牛王」道：「夫人久闊。」羅剎道：「大王萬福。」又云：「大王寵幸新婚，拋撇奴家，今日是那陣風兒吹你來的？』大聖笑道：「非敢拋撇，只因玉面公主招後，家事繁冗，朋友多顧，是以稽留在外，卻也又治得一個家當了。」又道：「近聞悟空那廝保唐僧，將近火焰山界，恐他來問你借扇子。我恨那廝害子之仇未報，但來時，可差人報我，等我拿他，分屍萬段，以雪我夫妻之恨。」羅剎聞言，滴淚告道：「大王，常言說：『男兒無婦財無主，女子無夫身無主。』我的性命，險些兒被這猢猻害了。」大聖聽得，故意發怒，罵道：「那潑猴幾時過去了？」羅剎道：「還未去。昨日到我這裡借扇子，我因他害孩兒之故，披掛了，掄寶劍出門，就砍那猢猻。他忍著疼，叫我做嫂嫂，說大王曾與他結義。」大聖道：「是五百年前曾拜為七弟兄。」羅剎道：「被我罵也不敢回言，砍也不敢動手。後被我一扇子搧去。不知在那裡尋得個定風法兒，今早又在門外叫喚。是我又使扇搧，莫想得動。急掄劍砍時，他就不讓我了。我怕他棒重，就走入洞裡，緊關上門。不知他又從何處，鑽在我肚腹之內，險被他害了性命。是我叫他幾聲叔叔，將扇與他去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    ほどなく時候の挨拶が交わされた。
    悟空「奥方、久しぶりだったな。」
    羅刹女「大王、ご機嫌うるわしく。」
    羅刹女はさらに言った。
    羅刹女「大王は新しい奥方ばかり可愛がって、私を捨てておしまいになりました。今日はどんな風の吹き回しで、お帰りになったのですか。」
    悟空は笑って言った。
    悟空「捨てたつもりなどない。玉面公主に迎えられてから、家の用事が込み入り、友人もよく訪ねてくるので、外に長居してしまったのだ。その代わり、もう一つ財産を築けたぞ。」
    悟空はまた言った。
    悟空「近ごろ聞けば、悟空の奴が唐僧を守って、火焔山のあたりへ近づいているらしい。お前に扇を借りに来るかと気になってな。あいつがせがれを害した恨みを、まだ晴らしていないのが悔しい。もし来たら、人をよこして俺に知らせてくれ。捕まえて体を万の肉片に切り分け、俺たち夫婦の恨みを晴らしてやろう。」
    羅刹女は聞くと、涙をこぼして訴えた。
    羅刹女「大王、昔から『男に妻がなければ財産に主なく、女に夫がなければ身に主なし』と申します。私の命は、危うくあの猿に奪われるところでした。」
    悟空は聞くと、わざと怒って罵った。
    悟空「あのろくでなしの猿は、いつ通っていったのだ。」
    羅刹女「まだ行っておりません。昨日ここへ扇を借りに来ました。あの子を害された恨みから、私は鎧兜をつけ、宝剣を振るって門を出て、あの猿を斬りつけたのです。痛みをこらえて私を姉上と呼び、大王とは義兄弟の契りを結んだと言っておりました。」
    悟空「そうだ、五百年前に七人で義兄弟になった。」
    羅刹女「私に罵られても口答えできず、斬られても手を出しませんでした。そのあと、一あおぎで吹き飛ばしてやったのです。ところが、どこで風を止める術を手に入れたのか、今朝また門の外でわめきました。もう一度扇であおぎましたが、動かそうにも動きません。急いで剣を振るって斬りつけると、今度は手加減してくれませんでした。あの棒の重さが恐ろしいので、洞へ逃げ込み、門を固く閉じました。それなのに、どこから入り込んだものか、私のお腹の中へ潜り込み、命を取られかけたのです。何度か『弟御さま』と呼んで、扇を渡して帰しました。」
  "translation_status": "reviewed"
- "id": "xy-ch60-027"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖又假意搥胸道：「可惜，可惜。夫人錯了，怎麼就把這寶貝與那猢猻？惱殺我也。」羅剎笑道：「大王息怒。與他的是假扇，但哄他去了。」大聖問：「真扇在於何處？」羅剎道：「放心，放心，我收著哩。」叫丫鬟整酒接風賀喜。遂擎杯奉上道：「大王，燕爾新婚，千萬莫忘結髮，且吃一杯鄉中之水。」大聖不敢不接，只得笑吟吟，舉觴在手道：「夫人先飲。我因圖治外產，久別夫人，早晚蒙護守家門，權為酬謝。」羅剎復接杯斟起，遞與大王道：「自古道：『妻者，齊也。』夫乃養身之父，謝甚麼？」他兩人謙謙講講，方才坐下巡酒。大聖不敢破葷，只吃幾個果子，與他言言語語。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    悟空はまた、嘆くふりをして胸をたたいた。
    悟空「惜しいことを、惜しいことを。奥方、それは間違いだ。どうしてあの宝を猿などにやったのだ。腹が立ってたまらん。」
    羅刹女は笑った。
    羅刹女「大王、お怒りをお鎮めください。渡したのは偽物の扇です。ただだまして帰しただけですよ。」
    悟空「本物の扇は、どこにある。」
    羅刹女「ご安心ください、ご安心ください。私がしまっております。」
    羅刹女は侍女に、帰宅を慰労して祝う酒を調えさせた。そして杯を捧げ、差し出した。
    羅刹女「大王、新婚の楽しさにひたっても、どうか結髪（けっぱつ）の妻をお忘れになりませんよう。まずは故郷の水を一杯お召し上がりください。」
    悟空は受け取らないわけにもいかず、にこにこと杯を手に取って言った。
    悟空「奥方、お前から飲んでくれ。俺は外の財産を取り仕切ろうとして、長くお前と離れていた。その間、朝な夕な家を守ってくれた。ささやかながら、その礼だ。」
    羅刹女はまた杯を受け取って酒を注ぎ、夫と思っている相手へ差し出した。
    羅刹女「昔から『妻とは斉しきものなり』と申します。夫は、身を養ってくださる父でもあるお方。何のお礼など申されましょう。」
    二人は互いに譲り合い、言葉を交わしてから、ようやく座って杯を回した。悟空は生臭物で戒を破るわけにはいかず、果物をいくつか食べるだけで、羅刹女と話し続けた。
  "translation_status": "reviewed"
- "id": "xy-ch60-028"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "酒至數巡，羅剎覺有半酣，色情微動，就和孫大聖挨挨擦擦，搭搭拈拈：攜著手，俏語溫存；並著肩，低聲俯就。將一杯酒，你喝一口，我喝一口，卻又哺果。大聖假意虛情，相陪相笑，沒奈何，也與他相倚相偎。果然是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 158
    "line_end": 158
  "translation_ja": "酒が何巡かするうちに、羅刹女はほろ酔いになり、色欲も少し動いて、悟空に体をすり寄せ、触ったりつまんだりし始めた。手を握って甘い言葉をかけ、肩を寄せ、身をかがめて小声でささやく。一つの杯から相手が一口、自分が一口と飲み、果物も食べさせ合った。悟空は心にもない気持ちを装い、付き合って笑った。やむをえず、自分も相手に寄りかかり、抱き寄せる。まことに、こういうことである。"
  "translation_status": "reviewed"
- "id": "xy-ch60-029"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "釣詩鉤，掃愁帚，破除萬事無過酒。男兒立節放襟懷，女子忘情開笑口。面赤似夭桃，身搖如嫩柳。絮絮叨叨話語多，捻捻掐掐風情有。時見掠雲鬟，又見掄尖手。幾番常把腳兒蹺，數次每將衣袖抖。粉項自然低，蠻腰漸覺扭。合歡言語不曾丟，酥胸半露鬆金鈕。醉來真個玉山頹，餳眼摩娑幾弄醜。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    詩を釣る針、憂いを掃く箒、
    万事を忘れさせるには、酒にまさるものはない。
    男は節を立てながら胸を開き、
    女は心の抑えを忘れて、笑みを浮かべる。
    顔は若い桃の花のように赤く、
    身は若い柳のように揺れる。
    くどくどと、おしゃべりは尽きず、
    つまんだり、ひねったり、色っぽく戯れる。
    雲のような髻をかき上げたかと思えば、
    細い手を振り回す。
    何度も小さな足を持ち上げ、
    幾度となく衣の袖を振るう。
    白粉のうなじは自然にうつむき、
    細い腰は、しだいにくねり始める。
    睦み合う言葉は絶えることなく、
    金の留め具が緩んで、なめらかな乳房が半ばあらわになる。
    酔えばまことに玉の山が崩れるよう、
    とろんとした目をこすり、幾度もみだらな姿をさらす。
  "translation_status": "reviewed"
- "id": "xy-ch60-030"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖見他這等酣然，暗自留心，挑鬥道：「夫人，真扇子你收在那裡？早晚仔細，但恐孫行者變化多端，卻又來騙去。」羅剎笑嘻嘻的，口中吐出，只有一個杏葉兒大小，遞與大聖道：「這個不是寶貝？」大聖接在手中，卻又不信，暗想著：「這些些兒，怎生搧得火滅？怕又是假的。」羅剎見他看著寶貝沉思，忍不住上前，將粉面搵在行者臉上，叫道：「親親，你收了寶貝吃酒罷，只管出神想甚麼哩？」大聖就趁腳兒蹺，問他一句道：「這般小小之物，如何搧得八百里火焰？」羅剎酒陶真性，無忌憚，就說出方法道：「大王，與你別了二載，你想是晝夜貪歡，被那玉面公主弄傷了神思，怎麼自家的寶貝事情，也都忘了？只將左手大指頭捻著那柄兒上第七縷紅絲，念一聲『\U00020C9B噓啊吸嘻吹呼』，即長一丈二尺長短。這寶貝變化無窮！那怕他八萬里火焰，可一扇而消也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 161
    "line_end": 161
  "translation_ja": "悟空は羅刹女がすっかり酔ったのを見て、ひそかに用心しながら誘いをかけた。\n悟空「奥方、本物の扇はどこにしまってある。いつも気をつけておかねばならんぞ。孫行者（そんぎょうじゃ）はさまざまに変身するから、また来てだまし取られかねん。」\n羅刹女はにこにこしながら、口から扇を吐き出した。杏の葉ほどの大きさしかない。それを悟空に渡して言った。\n羅刹女「ほら、これが宝ではありませんか。」\n悟空は手に受け取ったが、まだ信じられず、ひそかに思った。\n悟空「こんな小さなもので、どうして火をあおぎ消せるんだ。また偽物ではないのか。」\n宝を見つめて考え込んでいるのを見ると、羅刹女はこらえきれずに近づき、白粉をつけた顔を悟空の顔へ押しつけて呼びかけた。\n羅刹女「ねえ、お前さま。宝はしまって、お酒を飲みましょうよ。そんなにぼんやり、何を考えているの。」\n悟空はその言葉をとらえ、すかさず一言尋ねた。\n悟空「こんな小さなもので、どうやって八百里もの炎をあおぎ消せるのだ。」\n酒で本心をさらけ出した羅刹女は、何の用心もせず、その方法を話した。\n羅刹女「大王、二年も離れているうちに、昼も夜も楽しみにふけって、あの玉面公主に頭をぼんやりさせられたのですね。ご自分の家の宝のことまで、お忘れですか。左手の親指で、柄にある七筋目の赤い糸を押さえ、『\U00020C9B噓啊吸嘻吹呼（かい・きょ・あ・きゅう・き・すい・こ）』と一声唱えるだけで、一丈（じょう）二尺ほどに伸びるのです。この宝の変化は果てしないのですよ。八万里の炎だって、たった一あおぎで消せるのです。」"
  "translation_status": "reviewed"
- "id": "xy-ch60-031"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖聞言，切切記在心上。卻把扇兒也噙在口裡，把臉抹一抹，現了本像。厲聲高叫道：「羅剎女，你看看我可是你親老公？就把我纏了這許多醜勾當，不羞，不羞。」那女子一見是孫行者，慌得推倒桌席，跌落塵埃，羞愧無比，只叫：「氣殺我也！氣殺我也！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    悟空は聞くと、心にしっかり覚え込んだ。扇を自分の口にもくわえ、顔をひとなですると、もとの姿を現した。そして、鋭い声で叫んだ。
    悟空「羅刹女、よく見ろ。俺がお前の本当の亭主か。こんな恥ずかしいことをさんざんして、まとわりつきおって。恥ずかしくないのか、恥ずかしくないのか。」
    羅刹女は悟空だと見るや、慌てて膳や卓を倒し、床に転げ落ちた。恥ずかしさは限りなく、ただ叫ぶばかりだった。
    羅刹女「悔しくて死にそうだわ。悔しくて死にそうだわ。」
  "translation_status": "reviewed"
- "id": "xy-ch60-032"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖不管他死活，捽脫手，拽大步，徑出了芭蕉洞。正是：無心貪美色，得意笑顏回。將身一縱，踏祥雲，跳上高山，將扇子吐出來，演演方法。將左手大指頭捻著那柄上第七縷紅絲，念了一聲「\U00020C9B噓啊吸嘻吹呼」，果然長了有一丈二尺長短。拿在手中，仔細看了又看，比前番假的果是不同。只見祥光晃晃，瑞氣紛紛，上有三十六縷紅絲，穿經度絡，表裡相聯。原來行者只討了個長的方法，不曾討他個小的口訣，左右只是那等長短。沒奈何，只得搴在肩上，找舊路而回，不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 164
    "line_end": 164
  "translation_ja": "悟空は羅刹女の生き死になど構わず、手を振りほどき、大股に芭蕉洞を出た。まさに、\n美色をむさぼる心はなく、\n首尾よく運んで、笑顔で帰る。\n悟空はひと跳びしてめでたい雲を踏み、高い山へ跳び上がると、扇を吐き出し、方法を試してみた。左手の親指で、柄にある七筋目の赤い糸を押さえ、「\U00020C9B噓啊吸嘻吹呼」と一声唱えると、確かに一丈二尺ほどに伸びた。手に持って何度もよく見ると、前に受け取った偽物とは、まさしく違っていた。めでたい光がきらめき、吉兆の気が立ちこめ、三十六筋の赤い糸が縦横に通って、表と裏をつないでいる。ところが悟空は、大きくする方法だけを聞き出し、小さくする呪文は聞いていなかった。どうしても、その大きさのままである。仕方なく肩に担いで、来た道を捜しながら戻っていった。この話はひとまず置く。"
  "translation_status": "reviewed"
- "id": "xy-ch60-033"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那牛魔王在碧波潭底與眾精散了筵席，出得門來，不見了辟水金睛獸。老龍王聚眾精問道：「是誰偷放牛爺的金睛獸也？」眾精跪下道：「沒人敢偷。我等俱在筵前供酒捧盤，供唱奏樂，更無一人在前。」老龍道：「家樂兒斷乎不敢，可曾有甚生人進來？」龍子、龍孫道：「適才安座之時，有個蟹精到此，那個便是生人。」牛王聞說，頓然省悟道：「不消講了。早間賢友著人邀我時，有個孫悟空保唐僧取經，路遇火焰山難過，曾問我求借芭蕉扇。我不曾與他，他和我賭鬥一場，未分勝負。我卻丟了他，徑赴盛會。那猴子千般伶俐，萬樣機關，斷乎是那廝變作蟹精，來此打探消息，偷了我獸，去山妻處騙了那一把芭蕉扇兒也。」眾精見說，一個個膽戰心驚，問道：「可是那大鬧天宮的孫悟空麼？」牛王道：「正是。列公若在西天路上，有不是處，切要躲避他些兒。」老龍道：「似這般說，大王的駿騎卻如之何？」牛王笑道：「不妨，不妨。列公各散，等我趕他去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    さて、牛魔王は碧波潭の底で妖怪たちとの宴を終え、門を出ると、辟水金睛獣が見当たらなかった。老竜は一同を集めて尋ねた。
    老竜「誰が牛さまの金睛獣を、こっそり放したのだ。」
    妖怪たちはひざまずいて答えた。
    妖怪たち「盗みを働く者などおりません。私どもはみな宴席で酒を出し、皿を捧げ、歌い、楽を奏しておりました。前の方には一人もおりませんでした。」
    老竜「うちの楽人たちには、そんな度胸はあるまい。見知らぬ者が入ってきたことはなかったか。」
    竜の子や孫たち「先ほどお席につかれたころ、蟹の妖怪が参りました。あれが見知らぬ者でございます。」
    牛魔王は聞くや、はっと悟った。
    牛魔王「もう言わんでも分かった。朝方、君が使いをよこして招いてくれたとき、孫悟空という奴が、唐僧を守って経を求めに行く途中、火焔山を越えられずに、俺に芭蕉扇を貸せと頼んできていた。俺が貸さなかったので、あいつと一戦したが、勝負はつかなかった。俺はあいつを置いたまま、この盛大な宴に来たのだ。あの猿は千にも万にも頭が回り、仕掛けを考える奴だ。きっと蟹に化けて、ここへ様子を探りに来たに違いない。俺の獣を盗み、妻の所へ行って、あの芭蕉扇をだまし取ったのだ。」
    妖怪たちはそれを聞くと、一人残らず肝を震わせ、胸をおびやかされて尋ねた。
    妖怪たち「それは、あの天宮で大暴れした孫悟空ですか。」
    牛魔王「そうだ。諸君も西天への道で、何か悪いことをしているなら、ぜひとも少し避けておくことだ。」
    老竜「そういうことでしたら、大王の立派な乗り物は、どうなさいますか。」
    牛魔王は笑って言った。
    牛魔王「構わん、構わん。皆さんはそれぞれお帰りを。俺はあいつを追いかけてくる。」
  "translation_status": "reviewed"
- "id": "xy-ch60-034"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "遂而分開水路，跳出潭底，駕黃雲，徑至翠雲山芭蕉洞。只聽得羅剎女跌腳搥胸，大呼小叫。推開門，又見辟水金睛獸拴在下邊。牛王高叫：「夫人，孫悟空那廂去了？」眾女童看見牛魔，一齊跪下道：「爺爺來了？」羅剎女扯住牛王，磕頭撞腦，口裡罵道：「潑老天殺的！怎樣這般不謹慎，著那猢猻偷了金睛獸，變作你的模樣，到此騙我？」牛王切齒道：「猢猻那廂去了？」羅剎搥著胸膛罵道：「那潑猴賺了我的寶貝，現出原身走了。氣殺我也！」牛王道：「夫人保重，勿得心焦。等我趕上猢猻，奪了寶貝，剝了他皮，剉碎他骨，擺出他的心肝，與你出氣。」叫：「拿兵器來。」女童道：「爺爺的兵器不在這裡。」牛王道：「拿你奶奶的兵器來罷。」侍婢將兩把青鋒寶劍捧出。牛王脫了那赴宴的鴉青絨襖，束一束貼身的小衣，雙手綽劍，走出芭蕉洞，徑奔火焰山上趕來。正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    牛魔王は水路を分けて淵の底から跳び出し、黄色い雲に乗って、まっすぐ翠雲山の芭蕉洞へ向かった。聞けば、羅刹女が地団駄を踏み、胸をたたいて、大声でわめき立てている。門を押し開けると、下の方には辟水金睛獣がつながれていた。牛魔王は大声で呼んだ。
    牛魔王「奥方、孫悟空はどこへ行った。」
    娘たちは牛魔王を見ると、いっせいにひざまずいた。
    娘たち「旦那さま、お帰りになったのですか。」
    羅刹女は牛魔王を引っつかみ、頭をぶつけながら罵った。
    羅刹女「この天罰当たりのろくでなし。何でそんなに不注意なの。あの猿に金睛獣を盗まれ、お前の姿に化けて、私をだましに来させるなんて。」
    牛魔王は歯ぎしりして言った。
    牛魔王「猿はどこへ行った。」
    羅刹女は胸をたたいて罵った。
    羅刹女「あのろくでなしの猿は、私の宝をだまし取り、もとの姿を現して出ていったわ。悔しくて死にそうよ。」
    牛魔王「奥方、体をいたわって、そう思い詰めるな。俺が猿に追いつき、宝を奪い返し、皮を剥いで骨を細かく砕き、心臓と肝を取り出して並べてやる。それでお前の腹の虫を治めよう。」
    牛魔王は声をあげた。
    牛魔王「武器を持ってこい。」
    娘「旦那さまのお武器は、こちらにはございません。」
    牛魔王「では、奥さまの武器を持ってこい。」
    侍女が青く光る宝剣を二振り、捧げてきた。牛魔王は宴に着ていった濃紺の毛足のある上着を脱ぎ、肌につけた薄着をきゅっと締め、両手に剣を取った。芭蕉洞を出ると、まっすぐ火焔山へと追いかけていく。まさに、こういうことである。
  "translation_status": "reviewed"
- "id": "xy-ch60-035"
  "section_id": "chapter-60"
  "kind": "verse"
  "origin": "source"
  "source_text": "忘恩漢騙了痴心婦，烈性魔來近木叉人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    恩を忘れた男は、一途な女をだまし、
    気性の激しい魔王は、木叉人（もくさじん）へ近づいていく。
  "translation_status": "reviewed"
- "id": "xy-ch60-036"
  "section_id": "chapter-60"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去吉凶如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch60-1500612"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第060回&oldid=1500612"
    "line_start": 170
    "line_end": 170
  "translation_ja": "さて、この先に待つのは吉か凶か。続きは次回の解き明かしをお聞きいただきたい。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-01-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "火焔山の由来は、土地神本人の説明として訳した。第五〜七回の天宮騒動と結びつくが、ここで語る煉瓦や土地神自身の来歴を、語り手が別に確認した事実へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-02-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "二年前の招婿、百万の財産、南へ三千余里という数量は原文どおり。金額の通貨単位は原文にないため補わない。「倒陪家私」は、財産まで添えて夫を迎える意。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-03-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三冬は冬の三か月、九夏は夏の九十日をいう。全季節にわたる寒暖の対照として訳した。原文の「扢扠」は、岩と松を重ねて描く珍しい語。形状がごつごつ、節くれだつさまと解したが、字ごとの厳密な語義は留保する。原文欄の二度の扢扠は改字していない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-04-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「高髻堆青\U00022DD1碧鴉」。\U00022DD1を別字へ直さず保持した。教育部異体字辞典では抮の異体、識典古籍の字典では口に含む意などを示すが、この句での働きは確定しない。訳は高い髻と青黒い烏にたとえた髪の描写を保ち、字義の細部は留保した。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-05-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "王嬙は王昭君の名。楚の女、夕べの雨と朝の雲は、高唐・巫山の美女の典故を思わせるが、詩中の女性を特定の実在人物へ同定しない。文君は卓文君、薛濤は唐代の女性詩人。これらは目の前の女の正体を述べる名ではなく、美貌の比較である。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-06-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空が鉄扇公主に頼まれた使いを装うのは、本文に記された虚言。女との親類関係も想定にとどまる。原文では003の問いなどに「……』という不揃いな引用符があるが、原文は補訂せず、訳文の発話範囲を文脈に従って閉じた。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-07-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文「亂\U00024731金蓮」の\U00024731は珍字。字典には干し肉や野猪に関わる用法があるが、ここでその意味を当てる根拠はない。金蓮は女性の小さな足を美化する語なので、狼狽して足を乱す描写として訳した。動詞の原字は改めていない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-08-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「抓耳撓腮」は耳をかき頬をかく動作。牛魔王の懐に倒れ込んだ玉面公主が行うが、誰の耳や頬かは明記されない。訳文でも身体の持ち主を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-09-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "玉面公主が「棒で追い回して打った」と語る被害申告。先の地の文は悟空が棒を見せて怒鳴り、後を追ったと記し、実際の命中を記していない。訳文は申告を残し、語りの事実へ格上げしない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-10-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「攢絲三股獅蠻帶」。三股の絹糸と獅蛮の飾りを持つ帯として訳した。獅蛮文は異国人が獅子と戯れる図柄をいうとの研究脚注を、掲載PDFの226頁（PDF第16頁）の本文抽出表示で確認した。論文全体の精読や画像による校合、この架空の帯の材質・製法の確定はしていない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-11-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「朋友妻，不可欺；朋友妾，不可滅」の滅は、相手を踏みつけにする、ないがしろにする意と解した。牛魔王が妻妾への振る舞いを非難する言葉で、妾が殺されたと語っているのではない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-12-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「皆傍寸」は語義が明瞭でない。勝敗のつかない互角の戦いという文脈に沿い、寸という表現を残して訳した。原字はそのままで、別版への置換はしていない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-13-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "牛魔王が玉面公主に語った自慢。直前の地の文では百十合戦って勝負がつかないまま中止している。悟空を打ち負かし追放したという語り手の確定へは変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-14-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「六個大字」とし、石碑の字列も乱石山・碧波潭の六字。読みを括弧で表示することは、石碑上の字数を増やしたという意味ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-15-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "宴席の鱖婆は、第四十八回の斑衣鱖婆と同じ個体だとは記されていない。ここでは鱖という魚の名を持つ給仕の女性として読み、以前の人物の経歴を移さない。馬郎も水族の呼び名を残し、魚種や以前の個体との同一性を確定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-16-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「驪頷之珠」は黒い竜の顎の下にあるという宝珠。「蝦鬚之簾」は海老のひげにたとえる細い簾、また伝説的な装飾の語として、底本の素材の比喩を残す。実物の作りを断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-17-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "蟹を、横歩きする甲冑姿の士に見立てた呼称。「横行」には勝手に振る舞う意も響く。官を授かったというのは、蟹に化けた悟空がその場で作った身の上話である。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-18-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「且記打」は打ちすえる罰をひとまず記しておく、執行を留める意と解した。ここで実際に殴られたとは記されない。老竜が礼を述べ、その後「眾精」が命じるという、底本の発話主体をそのまま区別した。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-19-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "これは羅刹女が夫と思った相手に話す回想。前回の斬撃描写では悟空の鉄の体に傷がつかないが、ここで「忍著疼」と述べる不一致を訂正しない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-20-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「鄉中之水」は地元の酒を水とへりくだった呼び方。「結髪」は若くして結ばれた最初の夫婦をいう。「妻者，齊也」は、妻と斉が中国語で近い音であることを利用した語釈。続く「夫乃養身之父」は、夫を自分を養う父にたとえる当人の発言として保つ。対等だという語と従属的な語の並存を、現代の価値観に合わせて整えない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-21-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「哺果」は果物を食べさせる意に解した。哺には食べさせるという動詞の義があるが、この句の口移しかどうかは確定せず、具体的な接触の仕方や原文にない性行為は加えない。杯を交互に飲むことも、語りの記述どおりに残した。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-22-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "酒の賦は男女についての価値判断や、乳房・手足・腰の描写まで原文の全句を訳した。「男兒立節」は底本の立を失などへ直さず、節を立てるという字面の留保を保つ。「玉山頹」は酔って体が崩れる美的なたとえ。「餳眼摩娑」は酔った目とこする動作と解すが、細部は留保する。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-23-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八百里の質問に八万里でも消せると答える数の拡大は原文どおり。「\U00020C9B噓啊吸嘻吹呼」は七字を保存した。\U00020C9Bはhuíとする字典資料を手がかりに仮にカイと読み、他の字音を続けたが、呪文全体の日本語での定まった読誦は未確認。「趁腳兒蹺」は、相手の言葉に乗じて発言する慣用句。直前の詩に足を上げる描写があるが、ここへ新たな足の動作を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-24-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "扇を大きくする手順、左の親指、七筋目、一丈二尺、三十六筋の赤糸をすべて保持した。縮める口訣を聞かなかったことは、この段落で語り手が初めて説明する。注の起点も、この説明を読み終えた位置に置いている。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-25-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「磕頭撞腦」は、羅刹女が牛魔王をつかんだうえで頭をぶつける動作。畏敬の平伏と決めつけず、誰の頭のどこへどう当てたかまでは補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch60-note-26-body"
  "section_id": "chapter-60"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の結びは「木叉人」。この場面の誰を指すか、また内丹的な寓意かは確定していない。既出の木叉・恵岸へ自動的に結び付けたり、別の語へ補訂したりせず、原字と読みを残した。"
  "translation_status": "reviewed"

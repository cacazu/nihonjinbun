    "description_ja": "冒頭は善悪の因果を説き、無心・内丹修行・仏教の醍醐・極楽を重ねる韻文である。「無心薬」は執着を離れる心のたとえとして訳した。「黒海」の具体的な身体部位、「愍故」の故の細かな働きは確定できず、後者は慈悲を深める文脈から憐れみの意に取った。字を「苦」などへ改めず原文欄に残した。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "segment_ids":
    - "xy-ch65-007"
    "description_ja": "麖・獐は底本の動物名を保った。鹿類を指すことは辞書で説明できるが、この詩の個体を現代の特定種へ確定しない。「有處有雲」「是方是樹」は、場所ごとの雲と木々を描く句として訳した。 本文欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "segment_ids":
    - "xy-ch65-017"
    "description_ja": "金頭掲諦に続く原文の主語は単に「揭諦」「他」であり、そのまま前の金頭掲諦の行動と解した。別の掲諦が交替したという記述はない。「路遇一山，名小雷音寺」という奏上は、山と寺の名の関係が明瞭ではないが、山の名を補わず発言の形を保つ。 本文欠落ではなく解釈・校訂上の留保。"

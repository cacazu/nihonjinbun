  "source_text": |-
    第六十五回
    妖邪假設小雷音　四眾皆遭大厄難
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 117
    "line_end": 118
  "translation_ja": |-
    第六十五回
    妖邪、小雷音を偽り設け　師弟四人、ともに大難に遭う
  "translation_status": "reviewed"
- "id": "xy-ch65-002"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "這回因果，勸人為善，切休作惡。一念生，神明照鑒，任他為作。拙蠢乖能君怎學，兩般還是無心藥。趁生前有道正該修，莫浪泊。認根源，脫本殼。訪長生，須把捉。要時時明見，醍醐斟酌。貫徹三關填黑海，管教善者乘鸞鶴。那其間愍故更慈悲，登極樂。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 122
    "line_end": 122
  "translation_ja": |-
    このたびの因果は、人に善を勧めるもの、決して悪をなすなかれ。
    一念が起これば神々が明らかに照らし、人のなすがままを見届ける。
    愚かで拙い者と、利口で器用な者、あなたはいずれを学ぶのか。
    どちらにも、やはり無心こそが薬となる。
    生あるうちに道があるなら、まさに修めるべき時、むなしく漂ってはならぬ。
    根源を見定め、もとの殻を抜け出せ。
    長生を求めるなら、しっかりつかんで放すな。
    時々刻々に明らかに見きわめ、醍醐（だいご）を酌んで味わえ。
    三関（さんかん）を貫き、黒海（こっかい）を満たせば、善をなす者は必ず鸞（らん）や鶴に乗る。
    その時には憐れみを抱き、いっそう慈悲を深め、極楽へ登るのだ。
  "translation_status": "reviewed"
- "id": "xy-ch65-003"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話表唐三藏一念虔誠，且休言天神保護，似這草木之靈，尚來引送，雅會一宵，脫出荊棘針刺，再無蘿蓏攀纏。四眾西進，行夠多時，又值冬殘，正是那三春之日："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 124
    "line_end": 124
  "translation_ja": "さて、三蔵（さんぞう）はひたすら信心を尽くしていた。天の神々の加護は言うまでもなく、あの草木の精霊たちまでが迎えに来て送り、一夜の雅やかな集いを経て、茨の棘を抜け出すことができた。もはや蔓草にまとわりつかれることもない。師弟四人は西へ進み、ずいぶん長く旅をするうち、また冬も終わりに近づき、ちょうど春の季節となった。"
  "translation_status": "reviewed"
- "id": "xy-ch65-004"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "物華交泰，斗柄回寅。草芽遍地綠，柳眼滿堤青。一嶺桃花紅錦涴，半溪煙水碧羅明。幾多風雨，無限心情。日晒花心豔，燕啣苔蕊輕。山色王維畫濃淡，鳥聲季子舌縱橫。芳菲鋪繡無人賞，蝶舞蜂歌卻有情。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    万物は美しく、天地の気が通い合い、北斗（ほくと）の柄は寅（とら）の方角へ巡る。
    草の芽は地を緑に埋め、柳の芽は堤いっぱいに青い。
    峰一つを染める桃の花は、紅の錦を浸したよう、
    谷川の半ばに霞む水は、緑の薄絹のように明るい。
    幾たびの風と雨、尽きぬ春の思い。
    日を浴びて花の芯は艶めき、燕は軽やかに苔の芽をくわえる。
    山の色は王維（おうい）の絵の濃淡、鳥の声は季子（きし）の弁舌のように自在。
    花々が織り広げる錦を賞でる人はいないが、
    舞う蝶、歌う蜂には、春を思う心がある。
  "translation_status": "reviewed"
- "id": "xy-ch65-005"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們也自尋芳踏翠，緩隨馬步。正行之間，忽見一座高山，遠望著與天相接。三藏揚鞭指道：「悟空，那座山也不知有多少高，可便似接著青天，透沖碧漢。」行者道：「古詩不云：『只有天在上，更無山與齊。』但言山之極高，無可與他比並，豈有接天之理？」八戒道：「若不接天，如何把崑崙山號為天柱？」行者道：「你不知。自古『天不滿西北』。崑崙山在西北乾位上，故有頂天塞空之意，遂名天柱。」沙僧笑道：「大哥把這好話兒莫與他說，他聽了去，又降別人。我們且走路，等上了那山，就知高下也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    師弟も花を尋ね、青い草を踏み、馬の歩みに合わせてゆっくり進んでいた。道の途中、突然、高い山が現れた。遠くから見ると、天につながっているようだった。三蔵は鞭を上げて指した。
    三蔵「悟空（ごくう）、あの山はどれほど高いのでしょう。青空につながり、天の高みを突き抜けているようですね。」
    悟空「古い詩にも、『上にはただ天があるばかり、肩を並べる山はない』とあるでしょう。山が極めて高く、比べるものがないと言っているだけです。天につながる道理など、あるものですか。」
    八戒（はっかい）「天につながらないなら、どうして崑崙山（こんろんざん）を天の柱というんだ。」
    悟空「お前は知らないんだな。昔から『天は西北に欠けている』という。崑崙山は西北の乾（けん）の方角にある。それで、天を支え、空いたところを塞ぐという意味で、天の柱と呼ぶんだ。」
    沙悟浄（さごじょう）は笑った。
    沙悟浄「兄さん、そんな立派な話をこいつに教えてはいけません。聞き覚えて、またほかの人をやり込めますよ。とにかく歩きましょう。山へ登れば、高さも分かります。」
  "translation_status": "reviewed"
- "id": "xy-ch65-006"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子趕著沙僧，廝耍廝鬥。老師父馬快如飛。須臾，到那山崖之邊，一步步往上行來。只見那山："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 129
    "line_end": 129
  "translation_ja": "八戒は沙悟浄を追いかけ、ふざけ合い、じゃれ合った。三蔵の馬は飛ぶように速い。ほどなく山の崖の下へ来ると、一歩ずつ登り始めた。見れば、その山はこうであった。"
  "translation_status": "reviewed"
- "id": "xy-ch65-007"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "林中風颯颯，澗底水潺潺。鴉雀飛不過，神仙也道難。千崖萬壑，億曲百灣。塵埃滾滾無人到，怪石森森不厭看。有處有雲如水滉，是方是樹鳥聲繁。鹿啣芝去，猿摘桃還。狐貉往來崖上跳，麖獐出入嶺頭頑。忽聞虎嘯驚人膽，斑豹蒼狼把路攔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    林の風はさやさやと鳴り、谷底の水はさらさら流れる。
    烏も雀も飛び越せず、神仙さえ難所だという。
    千の崖、万の谷、億の曲がり、百の入り組んだ道。
    土ぼこりはもうもうと立ち、人は訪れず、怪石は林立し、見飽きることがない。
    ある所では雲が水のように揺らめき、どちらを向いても木々に鳥の声が満ちる。
    鹿は霊芝（れいし）をくわえて去り、猿は桃を摘んで帰る。
    狐やむじなは崖を行き来して跳ね、麖（けい）や獐（しょう）は峰の頭に出入りして遊ぶ。
    ふいに虎の咆哮が聞こえれば肝を潰し、まだらの豹と灰色の狼が道を塞ぐ。
  "translation_status": "reviewed"
- "id": "xy-ch65-008"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐三藏一見心驚。孫行者神通廣大，你看他一條金箍棒，哮吼一聲，嚇過了狼蟲虎豹，剖開路，引師父直上高山。行過嶺頭，下西平處，忽見祥光藹藹，彩霧紛紛，有一所樓臺殿閣，隱隱的鐘磬悠揚。三藏道：「徒弟們，看是個甚麼去處？」行者擡頭，用手搭涼篷，仔細觀看，那壁廂好個所在。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    三蔵はこれを見るなり、おびえた。だが悟空の神通力は広大である。金箍棒（きんこぼう）を一本手にし、一声吼えると、狼や猛獣、虎や豹を追い散らして道を開き、師を導いてまっすぐ高い山を登っていった。峰を越え、西側の平らな所へ下りると、ふと、めでたい光がたなびき、五色の霧が立ちこめる中に、楼閣や御殿が見えた。かすかに鐘や磬（けい）の音が、ゆったりと響いてくる。
    三蔵「弟子たち、あれは何の場所か、見てごらん。」
    悟空は顔を上げ、手をひさしにして、よくよく眺めた。向こうには、実に見事な所があった。
  "translation_status": "reviewed"
- "id": "xy-ch65-009"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "珍樓寶座，上剎名方。谷虛繁地籟，境寂散天香。青松帶雨遮高閣，翠竹留雲護講堂。霞光縹緲龍宮顯，彩色飄颻沙界長。朱欄玉戶，畫棟雕梁。談經香滿座，語籙月當窗。鳥啼丹樹內，鶴飲石泉傍。四圍花發琪園秀，三面門開舍衛光。樓臺突兀門迎嶂，鐘磬虛徐聲韻長。窗開風細，簾捲煙茫。有僧情散淡，無俗意和昌。紅塵不到真仙境，靜土招提好道場。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    珍しい楼閣、宝の座、名高い地に立つ尊い寺。
    うつろな谷には地の響きが満ち、静かな境内に天の香りが漂う。
    雨を帯びる青松は高楼を隠し、雲を留める翠竹は講堂を守る。
    霞の光の彼方に竜の宮殿が現れ、五色の光がたなびいて、砂の数ほどの世界は果てしない。
    朱の欄干、玉の戸、彩った棟木、彫りを施した梁。
    経を語れば座いっぱいに香り、道の秘文を説けば月が窓にかかる。
    赤い木々の中で鳥が鳴き、石の泉のほとりで鶴が飲む。
    四方に花が咲いて宝玉の園は美しく、三方の門が開いて舎衛（しゃえ）の光を放つ。
    楼台は高くそびえ、門は山の峰を迎え、鐘と磬はゆるやかに長い余韻を引く。
    窓を開けば風はそよぎ、簾を巻けば霞が果てない。
    僧の心は淡く静まり、俗世の気はなく、思いは和やか。
    俗世の塵も届かぬ、まことの仙境、清らかな寺は、よき道場である。
  "translation_status": "reviewed"
- "id": "xy-ch65-010"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者看罷，回覆道：「師父，那去處便是座寺院，卻不知禪光瑞藹之中，又有些凶氣何也。觀此景象，也似雷音，卻又路道差池。我們到那廂，決不可擅入，恐遭毒手。」唐僧道：「既有雷音之景，莫不就是靈山？你休誤了我誠心，擔擱了我來意。」行者道：「不是，不是。靈山之路，我也走過幾遍，那是這路途？」八戒道：「縱然不是，也必有個好人居住。」沙僧道：「不必多疑，此條路未免從那門首過，是不是一見可知也。」行者道：「悟淨說得有理。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    悟空は見終えると、答えた。
    悟空「お師匠さま、あそこは寺ですが、禅の光やめでたい霞の中に、どうして凶悪な気配も交じっているのでしょう。眺めは雷音（らいおん）に似ていますが、道筋が違います。あちらへ行っても、決して勝手に入ってはいけません。ひどい目に遭わされるおそれがあります。」
    三蔵「雷音の景色があるのなら、まさしく霊山（れいざん）ではありませんか。私の誠の心を損ない、ここへ来た願いを妨げないでおくれ。」
    悟空「違います、違います。霊山への道は、私も何度か通っています。こんな道ではありません。」
    八戒「そうでなくたって、きっと立派な人が住んでいるさ。」
    沙悟浄「そう疑うこともないでしょう。この道を行けば、どうしてもあの門の前を通ります。そうかどうかは、ひと目見れば分かりますよ。」
    悟空「悟浄（ごじょう）の言うことにも道理がある。」
  "translation_status": "reviewed"
- "id": "xy-ch65-011"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那長老策馬加鞭，至山門前，見「雷音寺」三個大字，慌得滾下馬來，倒在地下，口裡罵道：「潑猢猻！害殺我也。現是雷音寺，還哄我哩。」行者陪笑道：「師父莫惱，你再看看。山門上乃四個字，你怎麼只念出三個來，倒還怪我？」長老戰兢兢的爬起來再看，真個是四個字，乃「小雷音寺」。三藏道：「就是小雷音寺，必定也有個佛祖在內。經上言三千諸佛，想是不在一方：似觀音在南海，普賢在峨眉，文殊在五臺。這不知是那一位佛祖的道場。古人云：　『有佛有經，無方無寶。』我們可進去來。」行者道：「不可進去，此處少吉多凶。若有禍患，你莫怪我。」三藏道：「就是無佛，也必有個佛像。我弟子心願，遇佛拜佛，如何怪你？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    三蔵は馬に鞭を入れて進み、山門の前へ来た。「雷音寺（らいおんじ）」という大きな三文字を見ると、慌てて馬から転げ落ち、地面に倒れ伏して罵った。
    三蔵「このろくでなしの猿め！　私にとんだことをしてくれたな。ちゃんと雷音寺ではないか。まだ私を騙すのか。」
    悟空は笑顔を作った。
    悟空「お師匠さま、お怒りにならず、もう一度ご覧ください。山門には四文字あるのに、どうして三文字しか読まず、私をお責めになるのです。」
    三蔵は震えながら起き上がり、もう一度見た。確かに四文字で、「小雷音寺（しょうらいおんじ）」とある。
    三蔵「小雷音寺であっても、中には必ず仏さまがおいででしょう。経には三千の諸仏とあるのだから、皆が一か所にいるわけではないはずです。観音（かんのん）は南海（なんかい）、普賢（ふげん）は峨眉（がび）、文殊（もんじゅ）は五台（ごだい）におられるように。ここは、どの仏さまの道場なのでしょう。昔の人も『仏があれば経があり、どの地にも宝がないことはない』と言っています。中へ入りましょう。」
    悟空「入ってはいけません。ここは吉が少なく、凶の多い所です。災いに遭っても、私を責めないでください。」
    三蔵「仏さまがおられなくても、仏像は必ずあるでしょう。弟子の私は、仏に遇えば拝むと心に願っています。どうしてお前を責めたりしましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch65-012"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "即命八戒取袈裟，換僧帽，結束了衣冠，舉步前進。只聽得山門裡有人叫道：「唐僧，你自東土來拜見我佛，怎麼還這等怠慢？」三藏聞言，即便下拜；八戒也磕頭，沙僧也跪倒。惟大聖牽馬，收拾行李在後。方入到二層門內，就見如來大殿。殿門外寶臺之下，擺列著五百羅漢、三千揭諦、四金剛、八菩薩、比丘尼、優婆塞，無數的聖僧、道者。真個也香花豔麗，瑞氣繽紛。慌得那長老與八戒、沙僧一步一拜，拜上靈臺之間。行者公然不拜。又聞得蓮臺座上厲聲高叫道：「那孫悟空，見如來怎麼不拜？」不知行者又仔細觀看，見得是假，遂丟了馬匹、行囊，掣棒在手，喝道：「你這夥孽畜，十分膽大，怎麼假倚佛名，敗壞如來清德？不要走。」雙手掄棒，上前便打。只聽得半空中叮噹一聲，撇下一副金鐃，把行者連頭帶足，合在金鐃之內。慌得個豬八戒、沙和尚連忙使起鈀杖，就被些阿羅、揭諦、聖僧、道者一擁近前圍繞，他兩個措手不及，盡被拿了。將三藏捉住。一齊都繩纏索綁，緊縛牢拴。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    三蔵はすぐ八戒に袈裟を取り出させ、僧帽を替えて衣冠を整え、歩いて入っていった。すると山門の中から声がした。
    門の中の声「唐僧（とうそう）、東土（とうど）から我が仏を拝みに来ながら、なぜまだ、そのように怠っているのか。」
    三蔵は聞くなり礼拝し、八戒も頭を地につけ、沙悟浄も膝をついた。悟空だけは、後ろで馬を引き、荷物を片づけていた。二つ目の門へ入ると、如来（にょらい）の大殿が見えた。その御殿の門の外、宝の壇の下には、五百の羅漢（らかん）、三千の掲諦（ぎゃてい）、四体の金剛（こんごう）、八体の菩薩（ぼさつ）、比丘尼（びくに）、優婆塞（うばそく）、数知れぬ聖僧や修道者が並んでいた。香花は実に艶やかで、めでたい気があたりに満ちている。三蔵と八戒、沙悟浄は慌てて、一歩進むごとに拝み、霊妙な壇へ登っていった。悟空は堂々と拝まなかった。すると、蓮台の上から厳しい声が響いた。
    蓮台の上の者「そこなる孫悟空（そんごくう）、如来を見ながら、なぜ拝まぬ。」
    ところが悟空はさらによく見て、偽物だと見抜いた。馬と荷物を投げ出し、棒を抜き取って叫んだ。
    悟空「貴様ら畜生ども、なんという大胆さだ！　仏の名を騙り、如来の清らかな徳を汚すとは。逃げるな！」
    両手で棒を振りかぶり、前へ出て打ちかかった。すると空中で、じゃん、と音がし、一組の金鐃（きんにょう）が落とされ、悟空を頭から足まで、その中へ挟み込んだ。八戒と沙悟浄は慌てて熊手と杖を振るったが、阿羅漢（あらかん）、掲諦、聖僧、修道者たちがどっと取り囲み、二人は手を打つ暇もなく捕らえられた。三蔵も捕まり、三人とも綱や縄を巻きつけられ、きつく縛り上げられた。
  "translation_status": "reviewed"
- "id": "xy-ch65-013"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那蓮花座上裝佛祖者乃是個妖王，眾阿羅等都是些小怪。遂收了佛祖體像，依然現出妖身。將三眾擡入後邊收藏。把行者合在金鐃之中，永不開放，只擱在寶臺之上，限三晝夜化為膿血。化後，才將鐵籠蒸他三個受用。這正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 140
    "line_end": 140
  "translation_ja": "実は、蓮台の上で仏祖に化けていたのは妖王で、阿羅漢たちも皆、小妖怪だった。妖王は仏祖の姿を解き、もとの妖怪の姿を現した。三蔵たち三人を奥へ担ぎ込み、閉じ込める。悟空を金鐃の中へ挟み込んだまま、決して開けず、宝の壇の上へ置いておくだけにした。三昼夜を期限として膿と血に変え、それから残る三人を鉄の蒸籠で蒸して食うつもりなのだ。まさに、こういうことである。"
  "translation_status": "reviewed"
- "id": "xy-ch65-014"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    碧眼猢兒識假真，禪機見像拜金身。
    黃婆盲目同參禮，木母痴心共話論。
    邪怪生強欺本性，魔頭懷惡詐天人。
    誠為道小魔頭大，錯入傍門枉費身。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 141
    "line_end": 144
  "translation_ja": |-
    青い目の猿は真と偽を見分けたが、禅の心は姿を見て金色の仏を拝んだ。
    黄婆（こうば）は盲目にも共に礼拝し、木母（もくぼ）は愚かな心で話に加わった。
    邪悪な妖怪は力を振るって本性を欺き、魔王は悪意を抱いて天人を騙す。
    まことに道の力が小さく、魔の力が大きいため、道を誤って入り、むなしく身を費やしたのである。
  "translation_status": "reviewed"
- "id": "xy-ch65-015"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那時群妖將唐僧三眾收藏在後；把馬拴在後邊；把他的袈裟、僧帽安在行李擔內，亦收藏了。一壁廂嚴緊不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 146
    "line_end": 146
  "translation_ja": "その時、妖怪どもは三蔵たち三人を奥へ閉じ込め、馬も裏手につないだ。袈裟と僧帽は荷物の中へ納め、これも隠した。そちらは厳重に押さえられたとして、しばらく措こう。"
  "translation_status": "reviewed"
- "id": "xy-ch65-016"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說行者合在金鐃裡，黑洞洞的，燥得滿身流汗，左拱右撞，不能得出。急得他使鐵棒亂打，莫想得動分毫。他心裡沒了算計，將身往外一掙，卻要掙破那金鐃。遂捻著一個訣，就長有千百丈高；那金鐃也隨他身長，全無一些瑕縫光明。卻又捻訣把身子往下一小，小如芥菜子兒；那鐃也就隨身小了，更無些些孔竅。他又把鐵棒，吹口仙氣，叫：「變！」即變做旛竿一樣，撐住金鐃。他卻把腦後毫毛，選長的拔下兩根，叫：「變！」即變做梅花頭五瓣鑽兒，挨著棒下，鑽有千百下，只鑽得蒼蒼響喨，再不鑽動一些。行者急了，卻捻個訣，念一聲「唵㘕靜法界，乾元亨利貞」的咒語，拘得那五方揭諦、六丁六甲、一十八位護教伽藍，都在金鐃之外道：「大聖，我等俱保護著師父，不教妖魔傷害，你又拘喚我等做甚？」行者道：「我那師父不聽我勸解，就弄死他也不虧。但只你等怎麼快作法將這鐃鈸掀開，放我出來，再作處治。這裡面不通光亮，滿身暴燥，卻不悶殺我也？」眾神真個掀鐃，就如長就的一般，莫想揭動分毫。金頭揭諦道：「大聖，這鐃鈸不知是件甚麼寶貝，連上帶下，合成一塊。小神力薄，不能掀動。」行者道：「我在裡面，不知使了多少神通，也不得動。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    さて、金鐃に閉じ込められた悟空は、真っ暗な中で暑さに全身から汗を流し、左へ押し、右へぶつかっても出られなかった。焦って鉄棒をやたらに打ちつけたが、毛ほども動かない。策が尽き、外へ向かって体を張り広げ、金鐃を引き破ろうとした。指で印を結ぶと、背丈は何千、何百丈という高さになったが、金鐃も体に合わせて大きくなり、隙間も光もまるでなかった。今度は印を結んで体を縮め、からし菜の種ほどに小さくなった。金鐃もそれに合わせて縮み、ごく小さな穴さえなかった。さらに鉄棒へ仙気を吹きかけ、悟空は「変われ！」と叫んだ。棒は旗を立てる竿のようになり、金鐃をつっぱった。悟空は後頭部の毛から長いものを二本選んで抜いた。
    悟空「変われ！」
    毛は梅の花の形をした五枚刃の錐となった。棒のすぐ下に当て、千度、百度と錐を揉んだが、かんかん音がするばかりで、少しも削れない。悟空はいらだち、印を結んで、「唵㘕浄法界（おんらんじょうほっかい）、乾元亨利貞（けんげんこうりてい）」という呪文を唱えた。すると五方掲諦（ごほうぎゃてい）、六丁六甲（ろくていろっこう）、十八柱の護教伽藍（ごきょうがらん）が呼び寄せられ、金鐃の外で言った。
    神々「大聖（たいせい）、我々はお師匠さまを守り、妖魔に害させぬようにしております。それなのに、なぜまた我々をお呼びになったのですか。」
    悟空「師匠は俺の忠告を聞かなかったんだ。殺されても、身から出たさびさ。だが、とにかく早く術を使って、この鐃鉢（にょうはち）を開けてくれ。俺を出してから、改めて始末をつけよう。中は光が通らず、体じゅう熱くてたまらない。これでは蒸し殺されるぞ！」
    神々は実際に金鐃を持ち上げようとしたが、もともと一つにつながっているかのようで、毛ほども開かない。
    金頭掲諦（きんとうぎゃてい）「大聖、この鐃鉢は何という宝なのか分かりませんが、上も下も一つに合わさっています。私どもは力が弱く、開けられません。」
    悟空「中でも、どれだけ神通力を使ったか分からない。それでも動かせなかったんだ。」
  "translation_status": "reviewed"
- "id": "xy-ch65-017"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "揭諦聞言，即著六丁神保護著唐僧，六甲神看守著金鐃，眾伽藍前後照察。他卻縱起祥光，須臾間，闖入南天門裡。不待宣召，直上靈霄寶殿之下，見玉帝，俯伏啟奏道：「主公，臣乃五方揭諦使。今有齊天大聖保唐僧取經，路遇一山，名小雷音寺。唐僧錯認靈山進拜，原來是妖魔假設，困陷他師徒，將大聖合在一副金鐃之內，進退無門，看看至死，特來啟奏。」即傳旨：「差二十八宿星辰，快去釋厄降妖。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    金頭掲諦はこれを聞くと、六丁神（りくていしん）には三蔵を守らせ、六甲神（ろっこうしん）には金鐃を見張らせ、伽藍（がらん）たちには前後の様子を調べさせた。自らはめでたい光を立てて飛び、たちまち南天門（なんてんもん）へ入った。召し出されるのを待たず、まっすぐ霊霄宝殿（れいしょうほうでん）の下へ進み、玉帝（ぎょくてい）の前にひれ伏して奏上した。
    金頭掲諦「陛下、臣は五方掲諦の使いでございます。今、斉天大聖（せいてんたいせい）が唐僧を守って経を取りに行く途中、小雷音寺という山に出会いました。唐僧は霊山と誤って中へ拝みに入りましたが、実は妖魔が偽り設けたもので、師弟は罠にはまって囚われ、大聖は一組の金鐃の中へ閉じ込められております。進む道も退く道もなく、死が迫っておりますので、特に奏上に参りました。」
    玉帝はすぐ勅命を下した。
    玉帝「二十八宿（にじゅうはっしゅく）の星神を遣わす。急いで災いから救い、妖魔を降せ。」
  "translation_status": "reviewed"
- "id": "xy-ch65-018"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那星宿不敢少緩，隨同揭諦，出了天門，至山門之內，有二更時分。那些大小妖精，因獲了唐僧，老妖俱犒賞了，各去睡覺。眾星宿更不驚張，都到鐃鈸之外，報道：「大聖，我等是玉帝差來二十八宿，到此救你。」行者聽說大喜，便教：「動兵器打破，老孫就出來了。」眾星宿道：「不敢打。此物乃渾金之寶，打著必響，響時驚動妖魔，卻難救拔。等我們用兵器捎他。你那裡但見有一些光處就走。」行者道：「正是。」你看他們使槍的使槍，使劍的使劍，使刀的使刀，使斧的使斧；扛的扛，擡的擡，掀的掀，捎的捎。弄到有三更天氣，漠然不動，就是鑄成了囫圇的一般。那行者在裡邊東張張，西望望，爬過來，滾過去，莫想看見一些光亮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    星神たちは少しも遅れを取らず、金頭掲諦とともに天門を出て、寺の山門の中へ着いた。二更（にこう）ごろだった。大小の妖怪は、三蔵を捕らえた祝いに妖王から皆ねぎらいの饗応を受け、それぞれ寝ていた。星神たちは騒ぎを立てず、鐃鉢の外へ集まって告げた。
    星神たち「大聖、我々は玉帝に遣わされた二十八宿です。あなたを救いに来ました。」
    悟空は聞くなり大喜びした。
    悟空「武器で打ち破ってくれ。そうすれば俺は出られる。」
    星神たち「叩くわけにはいきません。これは純金でできた宝ですから、叩けば必ず音がします。その音で妖魔を起こしては、助け出しにくくなります。我々が武器でこじ開けましょう。そちらでは、少しでも明るい所が見えたら、逃げ出してください。」
    悟空「そのとおりだ。」
    そこで、槍を使う者は槍、剣を使う者は剣、刀を使う者は刀、斧を使う者は斧を持ち出した。担ぎ上げ、持ち上げ、めくり上げ、こじ開ける。三更（さんこう）になるまで取りかかったが、びくともせず、まるごと一つに鋳造したようだった。中の悟空も、東を見、西を見、這い回り、転げ回ったが、わずかな光さえ見えなかった。
  "translation_status": "reviewed"
- "id": "xy-ch65-019"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "亢金龍道：「大聖啊，且休焦躁。觀此寶定是個如意之物，斷然也能變化。你在那裡面，於那合縫之處，用手摸著，等我使角尖兒拱進來，你可變化了，順鬆處脫身。」行者依言，真個在裡面亂摸。這星宿把身變小了，那角尖兒就似個針尖一樣，順著鈸合縫口上伸將進去。可憐用盡千斤之力，方能穿透裡面。卻將本身與角使法像，叫：「長！長！長！」角就長有碗來粗細。那鈸口倒也不像金鑄的，好似皮肉長成的，順著亢金龍的角，緊緊噙住，四下裡更無一絲拔縫。行者摸著他的角，叫道：「不濟事，上下沒有一毫鬆處。沒奈何，你忍著些兒疼，帶我出去。」好大聖，即將金箍棒變作一把鋼鑽兒，將他那角尖上鑽了一個孔竅，把身子變得似個芥菜子兒，拱在那鑽眼裡蹲著，叫：「扯出角去，扯出角去。」這星宿又不知費了多少力，方才拔出，使得力盡觔柔，倒在地下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    亢金竜（こうきんりゅう）「大聖、そう焦らないでください。この宝は、見るからに意のままになる品です。必ず姿も変えられます。そちらの中から、合わせ目を手で探っていてください。私が角の先を押し込みますから、姿を変え、隙間を通って抜け出せばよいのです。」
    悟空は言われたとおり、中を手探りした。亢金竜は体を小さくし、針先ほどになった角の先を、鉢の合わせ目へ差し入れた。痛ましいことに、千斤もの力を使い果たして、ようやく中へ貫き通した。今度は体と角に術をかけて叫んだ。
    亢金竜「伸びろ、伸びろ、伸びろ！」
    角は椀ほどの太さになった。ところが鉢の口は金の鋳物とは思えず、皮や肉でできているように、亢金竜の角へぴったり食いつき、周囲には糸一本の隙間もできなかった。悟空はその角に触れて叫んだ。
    悟空「だめだ。上にも下にも、毛ほどの隙間もない。仕方がない、少し痛いのを我慢して、俺を連れ出してくれ。」
    さすがは悟空、金箍棒を一本の鋼の錐に変え、亢金竜の角の先に穴をあけた。自分はからし菜の種ほどに縮み、その穴へ入り込んでうずくまった。
    悟空「角を抜いてくれ、角を抜いてくれ！」
    亢金竜は、またどれほど力を費やしたことか、ようやく角を抜き出したが、力が尽き、筋もなえて、地面に倒れた。
  "translation_status": "reviewed"
- "id": "xy-ch65-020"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者卻自他角尖鑽眼裡鑽出，現了原身，掣出鐵棒，照鐃鈸噹的一聲打去，就如崩倒銅山，咋開金礦。可惜把個佛門之器，打做個千百塊散碎之金。諕得那二十八宿驚張，五方揭諦髮豎，大小群妖皆夢醒。老妖王睡裡慌張，急起來，披衣擂鼓，聚點群妖，各執器械。此時天將黎明。一擁趕到寶臺之下，只見孫行者與列宿圍在碎破金鐃之外，大驚失色。即令：「小的們！緊關了前門，不要放出人去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    悟空は角先の穴から這い出し、もとの姿に戻ると、鉄棒を抜き、鐃鉢めがけて、がんと一撃を加えた。それは銅の山が崩れ、金鉱が裂けるような音だった。惜しいことに、仏門の器は千、百の金のかけらに砕け散った。二十八宿は慌てふためき、五方掲諦は髪を逆立て、大小の妖怪は皆、夢から覚めた。妖王も眠りから驚き起き、衣をひっかけ、太鼓を叩いて妖怪どもを集め、各自に武器を持たせた。時は夜明けになろうとしていた。一斉に宝の壇の下へ駆けつけ、悟空と星神たちが砕けた金鐃を囲んでいるのを見ると、妖王は驚いて顔色を失い、すぐ命じた。
    妖王「小僧ども、表の門をしっかり閉めろ。一人も外へ出すな！」
  "translation_status": "reviewed"
- "id": "xy-ch65-021"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽說，即攜星眾，駕雲跳在九霄空裡。那妖王收了碎金，排開妖卒，列在山門外。妖王懷恨，沒奈何披掛了，使一根短軟狼牙棒，出營高叫：「孫行者，好男子不可遠走高飛，快向前與我交戰三合。」行者忍不住，即引星眾，按落雲頭，觀看那妖精怎生模樣。但見他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空はこれを聞くと、星神たちを連れ、雲に乗って高い空へ跳び上がった。妖王は砕けた金を拾い集め、妖兵を山門の外へ並べた。恨みを抱き、仕方なく鎧を着けると、短くしなやかな狼牙棒（ろうがぼう）を一本手にして陣から出、大声で呼ばわった。
    妖王「孫行者（そんぎょうじゃ）、立派な男なら、遠くへ逃げ去るものではないぞ。さっさと前へ来て、わしと三合（ごう）打ち合え。」
    悟空は我慢がならず、星神たちを引き連れて雲を下ろし、妖怪の姿を眺めた。見れば、こうであった。
  "translation_status": "reviewed"
- "id": "xy-ch65-022"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "蓬著頭，勒一條扁薄金箍；光著眼，簇兩道黃眉的豎。懸膽鼻，孔竅開查；四方口，牙齒尖利。穿一副叩結連環鎧，勒一條生絲攢穗絛。腳踏烏喇鞋一對，手執狼牙棒一根。此形似獸不如獸，相貌非人卻似人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    乱れ髪には、平たく薄い金の輪を一つ締め、
    光る目の上には、二筋の黄いろい眉が逆立つ。
    垂れた胆嚢のような鼻は、穴が大きく開き、四角い口には鋭い歯。
    輪をつなぎ、留め合わせた鎧を一揃い着け、生糸の房を束ねた帯を一本締める。
    足には一足の烏喇靴（うらぐつ）、手には一本の狼牙棒。
    獣のような姿で、獣とは違い、人ではない顔つきで、人にも似ている。
  "translation_status": "reviewed"
- "id": "xy-ch65-023"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者挺著鐵棒喝道：「你是個甚麼怪物，擅敢假裝佛祖，侵占山頭，虛設小雷音寺？」那妖王道：「這猴兒是也不知我的姓名，故來冒犯仙山。此處喚做小西天。因我修行，得了正果，天賜與我的寶閣珍樓。我名乃是黃眉老佛。這裡人不知，但稱我為黃眉大王、黃眉爺爺。一向久知你往西去，有些手段，故此設像顯能，誘你師父進來，要和你打個賭賽。如若鬥得過我，饒你師徒，讓汝等成個正果；如若不能，將汝等打死，等我去見如來取經，果正中華也。」行者笑道：「妖精，不必海口，既要賭，快上來領棒。」那妖王喜孜孜，使狼牙棒抵住。這一場好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    悟空は鉄棒を構えて怒鳴った。
    悟空「貴様は何の怪物だ。勝手に仏祖を装い、山を占領して、偽の小雷音寺を設けるとは！」
    妖王「この猿は、わしの名前を知らぬからこそ、仙山を侵すのだな。ここは小西天（しょうさいてん）という。わしが修行して正果を得たため、天がこの宝の楼閣を授けたのだ。わしの名は黄眉老仏（こうびろうぶつ）。ここの人々はそれを知らず、黄眉大王（こうびだいおう）、黄眉爺爺（こうびやや）とだけ呼ぶ。以前から、お前が西へ向かい、なかなかの腕を持つことは知っていた。そこで仏の姿を設けて力を示し、お前の師を誘い込んだのだ。お前と勝負を賭けようと思ってな。わしに勝てば師弟を許し、正果を得させてやる。勝てねば、お前たちを殴り殺し、わしが如来に会って経を取り、中華で正果を遂げよう。」
    悟空は笑った。
    悟空「妖怪、大口はそのくらいにしろ。勝負したいなら、さっさと来て棒を受けろ。」
    黄眉大王は嬉々として、狼牙棒で受け止めた。この戦いは、なんと激しかったことか。
  "translation_status": "reviewed"
- "id": "xy-ch65-024"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "兩條棒，不一樣，說將起來有形狀：一條短軟佛家兵，一條堅硬藏海藏。都有隨心變化功，今番相遇爭強壯。短軟狼牙雜錦妝，堅硬金箍蛟龍像。若粗若細實可誇，要短要長甚停當。猴與魔，齊打仗，這場真個無虛誑。馴猴秉教作心猿，潑怪欺天弄假像。嗔嗔恨恨各無情，惡惡兇兇都有樣。那一個當頭手起不放鬆，這一個架丟劈面難推讓。噴雲照日昏，吐霧遮峰嶂。棒來棒去兩相迎，忘生忘死因三藏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    二本の棒は、それぞれ違う。その形を語ってみよう。
    一本は短くしなやかな仏門の武器、一本は堅く硬い、海の蔵に納められていたもの。
    どちらも心のままに変わる力を持ち、今ここで出会い、強さを争う。
    短くしなやかな狼牙棒には、錦のような多彩な飾り、堅く硬い金箍棒は蛟竜（こうりゅう）の姿。
    太くも細くもなれる見事さ、長くも短くも、思うとおり。
    猿と魔物が打ち合うこの戦いに、偽りはない。
    教えに従って飼いならされた猿は心猿（しんえん）となり、悪しき妖怪は天を欺き、偽の姿を弄ぶ。
    怒り、恨み、互いに情けはなく、凶悪さにも、それぞれの様がある。
    あちらは手を上げて頭を狙い、休む暇も与えず、
    こちらは受け流して顔へ打ち込み、譲ろうにも譲れない。
    雲を噴けば日の光は曇り、霧を吐けば峰々を覆う。
    棒は行き、棒は返って打ち合い、生も死も忘れるのは三蔵ゆえ。
  "translation_status": "reviewed"
- "id": "xy-ch65-025"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "看他兩個鬥經五十回合，不見輸贏。那山門口鳴鑼擂鼓，眾妖精吶喊搖旗。這壁廂有二十八宿天兵共五方揭諦眾聖，各掮器械，吆喝一聲，把那魔頭圍在中間，嚇得那山門外群妖難擂鼓，戰兢兢手軟不敲鑼。老妖魔公然不懼，一隻手使狼牙棒，架著眾兵；一隻手去腰間解下一條舊白布搭包兒，往上一拋，滑的一聲響喨，把孫大聖、二十八宿與五方揭諦，一搭包兒通裝將去，挎在肩上，拽步回身。眾小妖個個歡然得勝而回。老妖教小的們取了三五十條麻索，解開搭包，拿一個，綑一個。一個個都骨軟觔麻，皮膚窊皺。綑了擡去後邊，不分好歹，俱擲之於地。妖王又命排筵暢飲，自旦至暮方散，各歸寢處不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 160
    "line_end": 160
  "translation_ja": "二人は五十合戦ったが、勝敗がつかなかった。山門では銅鑼と太鼓が鳴り、妖怪たちが鬨を上げて旗を振っていた。こちらでは二十八宿の天兵と五方掲諦の神々が、それぞれ武器を担いで一声叫び、黄眉大王を真ん中に囲んだ。山門の外の妖怪たちは恐れおののき、太鼓も叩けず、手に力が入らず銅鑼も打てなかった。だが黄眉大王は少しも恐れず、片手で狼牙棒を振って皆の武器を受け、もう片方の手で腰から古い白布の肩掛け袋をほどいた。それを上へ投げると、しゅっと音がして、悟空、二十八宿、五方掲諦を、ひと袋にそっくり吸い込んだ。袋を肩に掛け、足を引いて向き直る。小妖たちは一人残らず喜び、勝ち誇って帰った。黄眉大王は小妖どもに三十本か五十本ほどの麻縄を取ってこさせ、袋を開けては、一人取り出すごとに一人ずつ縛らせた。誰もが骨はなえ、筋はしびれ、皮膚はくぼんでしわだらけになっていた。縛ると奥へ担ぎ込み、誰彼の区別なく地面へ投げ出した。黄眉大王はさらに宴を命じ、朝から夕方まで飲み明かして、ようやく散会し、それぞれ寝所へ戻った。この話はしばらく措こう。"
  "translation_status": "reviewed"
- "id": "xy-ch65-026"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫大聖與眾神綑至夜半，忽聞有悲泣之聲。側耳聽時，卻原來是三藏聲音，哭道：「悟空啊，我："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    さて、悟空と神々は縛られたまま夜半を迎えた。ふと、悲しげに泣く声が聞こえた。耳を澄ますと、三蔵の声だった。三蔵は泣きながら言った。
    三蔵「悟空よ、私は……。
  "translation_status": "reviewed"
- "id": "xy-ch65-027"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    自恨當時不聽伊，致令今日受災危。
    金鐃之內傷了你，麻繩綑我有誰知。
    四人遭逢緣命苦，三千功行盡傾頹。
    何由解得迍邅難，坦蕩西方去復歸？
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 164
    "line_end": 167
  "translation_ja": |-
    あの時、お前に従わなかった自分が恨めしい、今日のこの危難を招いてしまった。
    お前は金鐃の中で傷つけられ、私は麻縄で縛られたが、誰が知ってくれよう。
    四人がこの目に遭うのは、つらい運命のため、三千の功徳も修行も、すべて崩れ去った。
    どうすれば、この行き悩む災難を解き、平らな西方への道を往き、帰ってこられるのか。」
  "translation_status": "reviewed"
- "id": "xy-ch65-028"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽言，暗自憐憫道：「那師父雖是未聽吾言，今遭此害，然於患難之中，還有憶念老孫之意。趁此夜靜妖眠，無人防備，且去解脫眾等逃生也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    悟空はこの言葉を聞き、ひそかに哀れみ、胸の中でつぶやいた。
    悟空「師匠は俺の言葉を聞かず、今のひどい目に遭ったが、難儀している最中でも、この俺を思ってはくれているんだ。夜は静かで妖怪は寝ている。誰も警戒していない今のうちに、皆の縄を解いて、逃がしてやろう。」
  "translation_status": "reviewed"
- "id": "xy-ch65-029"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，使了個遁身法，將身一小，脫下繩來，走近唐僧身邊，叫聲：「師父。」長老認得聲音，叫道：「你為何到此？」行者悄悄的把前項事告訴了一遍。長老甚喜道：「徒弟，快救我一救。向後事，但憑你處，再不強了。」行者才動手，先解了師父，放了八戒、沙僧。又將二十八宿、五方揭諦，個個解了。又牽過馬來，教快先走出去。方出門，卻不知行李在何處，又來找尋。亢金龍道：「你好重物輕人。既救了你師父就夠了，又還尋甚行李？」行者道：「人固要緊，衣缽尤要緊。包袱中有通關文牒、錦襴袈裟、紫金缽盂，俱是佛門至寶，如何不要？」八戒道：「哥哥，你去找尋，我等先去路上等你。」你看那星眾簇擁著唐僧，使個攝法，共弄神通，一陣風，撮出垣圍，奔大路，下了山坡，卻屯於平處等候。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    さすがは悟空、身を抜け出す術を使い、体を縮めて縄から脱した。三蔵のそばへ寄って呼んだ。
    悟空「お師匠さま。」
    三蔵は声を聞き分けて言った。
    三蔵「どうしてお前が、ここにいるのです。」
    悟空は、先ほどまでの出来事を一通り小声で伝えた。三蔵は大いに喜んだ。
    三蔵「悟空、早く私を助けておくれ。これからは何事もお前の判断に任せ、二度と意地を張りません。」
    悟空はそこで手を動かし、まず師の縄を解き、八戒と沙悟浄を放した。さらに二十八宿と五方掲諦の縄も一人ずつ解き、馬を引いてきて、早く先に出るよう促した。門を出たところで、荷物の場所が分からず、また探しに戻った。
    亢金竜「あなたは、物を重く見て、人を軽く見るのですね。師を救ったのなら、それで十分ではありませんか。何のために、また荷物を探すのです。」
    悟空「人も、もちろん大事だが、衣と鉢はなお大事だ。包みの中には通関文牒（つうかんもんちょう）、錦襴（きんらん）の袈裟、紫金（しきん）の鉢がある。どれも仏門の至宝だ。捨てておけるものか。」
    八戒「兄貴は探してきなよ。俺たちは先に道へ出て、待っているから。」
    星神たちは三蔵を取り囲み、物を引き寄せる術を使って、皆で神通力を働かせた。一陣の風を起こして、塀の囲いから一行をさらい出し、大道へ走り、山の斜面を下ると、平らな所へ集まって待った。
  "translation_status": "reviewed"
- "id": "xy-ch65-030"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "約有三更時分，孫大聖輕那慢步，走入裡面，原來一層層門戶甚緊。他就爬上高樓看時，窗牖皆關。欲要下去，又恐怕窗櫺兒響，不敢推動。捻著訣，搖身一變，變做一個仙鼠，俗名蝙蝠。你道他怎生模樣："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 172
    "line_end": 172
  "translation_ja": "三更ごろだった。悟空は足音を忍ばせ、ゆっくり中へ入った。何重もの戸は、どれも固く閉ざされている。高い楼へ登って見ても、窓はすべて閉じていた。下へ入ろうにも、窓の格子が鳴るのを恐れ、押し動かせない。印を結んで身を振るい、仙鼠（せんそ）、俗にいうコウモリへ変身した。その姿は、いったいどのようだったか。"
  "translation_status": "reviewed"
- "id": "xy-ch65-031"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    頭尖還似鼠，眼亮亦如之。
    有翅黃昏出，無光白晝居。
    藏身穿瓦穴，覓食撲蚊兒。
    偏喜晴明月，飛騰最識時。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 174
    "line_end": 177
  "translation_ja": |-
    尖った頭は鼠に似て、明るい目も同じこと。
    翼を持ち、黄昏に出て、昼の間は暗い所にこもる。
    身を隠して瓦の穴をくぐり、餌を求めて蚊を捕る。
    何より澄んだ月を好み、舞い上がる時をよく知っている。
  "translation_status": "reviewed"
- "id": "xy-ch65-032"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他順著不封瓦口椽子之下，鑽將進去，越門過戶，到了中間看時，只見那第三重樓窗之下，閃灼灼一道毫光，也不是燈燭之光、螢火之光，又不是飛霞之光、掣電之光。他半飛半跳，近於窗前看時，卻是包袱放光。那妖精把唐僧的袈裟脫了，不曾摺，就亂亂的揌在包袱之內。那袈裟本是佛寶，上邊有如意珠、摩尼珠、紅瑪瑙、紫珊瑚、舍利子、夜明珠，所以透的光彩。他見了此衣缽，心中一喜，就現了本像，拿將過來，也不管擔繩偏正，擡上肩，往下就走。不期脫了一頭，撲的落在樓板上，唿喇的一聲響。噫！有這般事：可可的老妖精在樓下睡覺，一聲響，把他驚醒，跳起來，亂叫道：「有人了，有人了！」那些大小妖都起來，點燈打火，一齊吆喝，前後去看。有的來報道：「唐僧走了。」又有的來報道：「行者眾人俱走了。」老妖急傳號令，教：「各門上謹慎。」行者聽言，恐又遭他羅網，挑不成包袱，縱觔斗，就跳出樓窗外走了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 178
    "line_end": 178
  "translation_ja": |-
    悟空は、塞がれていない瓦口の垂木の下から入り込み、戸口を越え、部屋を通って中へ進んだ。見ると、三重目の楼の窓の下に、一筋の光がきらきら輝いていた。灯火や蝋燭の光でも、蛍の光でもなく、流れる霞の光でも、ひらめく稲妻の光でもなかった。半ば飛び、半ば跳ねて窓へ近づくと、光を放っているのは包みだった。黄眉大王は三蔵の袈裟を脱がせ、畳みもしないで、乱雑に包みの中へ押し込んでいた。もともと仏の宝である袈裟には、如意珠（にょいじゅ）、摩尼珠（まにしゅ）、紅い瑪瑙、紫の珊瑚、舎利子（しゃりし）、夜明珠（やめいしゅ）が付いている。それで、光が漏れていたのだ。悟空はこの衣と鉢を見て心に喜び、もとの姿に戻って取り上げた。担ぐ縄が正しく掛かっているかどうかも構わず、肩に載せて下りかけた。思いがけず片側が外れ、どさりと床板へ落ち、大きな音を立てた。ああ、なんということか。折悪しく、黄眉大王はその楼の下で寝ていた。音に驚いて目を覚まし、跳び起きてわめいた。
    黄眉大王「誰かいるぞ、誰かいるぞ！」
    大小の妖怪たちは皆起き、灯りをつけ、火をともして、一斉に叫びながら前後を調べに行った。ある小妖が戻って報告した。
    小妖「唐僧が逃げました！」
    また、別の小妖が報告した。
    別の小妖「悟空たちも、皆逃げました！」
    黄眉大王は急いで号令を伝えた。
    黄眉大王「各門を、しっかり見張れ！」
    悟空はこれを聞くと、また網にかかるのを恐れた。包みを担いでいくことはできず、筋斗（きんと）を打ち、楼の窓から跳び出して逃げた。
  "translation_status": "reviewed"
- "id": "xy-ch65-033"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖精前前後後尋不著唐僧等，又見天色將明，取了棒，帥眾來趕，只見那二十八宿與五方揭諦等神雲霧騰騰，屯住山坡之下。妖王喝了一聲：「那裡去？吾來也。」角木蛟急喚：「兄弟們，怪物來了。」亢金龍、氐土蝠、房日兔、心月狐、尾火虎、箕水豹、斗木獬、牛金牛、女土貉、虛日鼠、危月燕、室火豬、壁水㺄、奎木狼、婁金狗、胃土彘、昴日雞、畢月烏、觜火猴、參水猿、井木犴、鬼金羊、柳土獐、星日馬、張月鹿、翼火蛇、軫水蚓，領著金頭揭諦、銀頭揭諦、六甲六丁等神、護教伽藍，同八戒、沙僧，（不領唐三藏，丟了白龍馬）各執兵器，一擁而上。這妖王見了，呵呵冷笑，叫一聲哨子，有四五千大小妖精，一個個威強力勝，渾戰在西山坡上。好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    黄眉大王は前も後ろも探したが三蔵たちを見つけられず、空も明けかかっているのを見ると、棒を取り、配下を率いて追いかけた。すると、二十八宿と五方掲諦などの神々が、雲霧を立ち昇らせながら、山の斜面の下へ集まっているのが見えた。
    黄眉大王「どこへ行く。わしが来たぞ！」
    角木蛟（かくもくこう）が急いで呼びかけた。
    角木蛟「皆、怪物が来たぞ！」
    亢金竜、氐土蝠（ていどふく）、房日兎（ぼうじつと）、心月狐（しんげつこ）、尾火虎（びかこ）、箕水豹（きすいひょう）、斗木獬（ともくかい）、牛金牛（ぎゅうきんぎゅう）、女土貉（じょどかく）、虚日鼠（きょじつそ）、危月燕（きげつえん）、室火猪（しつかちょ）、壁水㺄（へきすいゆ）、奎木狼（けいもくろう）、婁金狗（ろうきんく）、胃土彘（いどてい）、昴日鶏（ぼうじつけい）、畢月烏（ひつげつう）、觜火猴（しかこう）、参水猿（しんすいえん）、井木犴（せいもくかん）、鬼金羊（ききんよう）、柳土獐（りゅうどしょう）、星日馬（せいじつば）、張月鹿（ちょうげつろく）、翼火蛇（よくかだ）、軫水蚓（しんすいいん）は、金頭掲諦、銀頭掲諦（ぎんとうぎゃてい）、六甲六丁（ろっこうろくてい）などの神々と護教伽藍を率い、八戒、沙悟浄とともに、それぞれ武器を持ち、一斉に攻めかかった。三蔵は連れず、白竜馬（はくりゅうば）も残してきた。黄眉大王はこれを見ると、ははっと冷たく笑い、一声口笛を吹いた。四千、五千もの大小の妖怪が現れ、どれも威勢よく力に勝り、西の山腹で入り乱れて戦った。なんという激戦か。
  "translation_status": "reviewed"
- "id": "xy-ch65-034"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "魔頭潑惡欺真性，真性溫柔怎奈魔。百計施為難脫苦，千方妙用不能和。諸天來擁護，眾聖助干戈。留情虧木母，定志感黃婆。渾戰驚天並振地，強爭設網與張羅。那壁廂搖旗吶喊，這壁廂擂鼓篩鑼。槍刀密密寒光蕩，劍戟紛紛殺氣多。妖卒兇還勇，神兵怎奈何。愁雲遮日月，慘霧罩山河。苦掤苦拽來相戰，皆因三藏拜彌陀。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    荒れ狂う魔王はまことの本性を欺き、優しい本性では、魔にどう立ち向かえよう。
    百の計略を尽くしても苦を逃れられず、千の妙技を働かせても和らげられない。
    諸天は守りに駆けつけ、神聖たちは武器を取って助ける。
    情を留めるのは木母のおかげ、志を定める黄婆には感謝する。
    乱戦は天を驚かせ地を揺るがし、力ずくで争って網を張り、罠を設ける。
    あちらは旗を振って鬨を上げ、こちらは太鼓を打ち、銅鑼を鳴らす。
    槍と刀は隙間なく冷たい光を放ち、剣と戟は入り乱れて殺気に満ちる。
    妖兵は凶猛なうえに勇ましく、神兵はどうにもできない。
    憂いの雲が日月を遮り、悲惨の霧が山河を覆う。
    苦しく押し合い、苦しく引き合って戦うのは、すべて三蔵が弥陀（みだ）を拝んだため。
  "translation_status": "reviewed"
- "id": "xy-ch65-035"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖精倍加勇猛，帥眾上前掩殺。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 183
    "line_end": 183
  "translation_ja": "黄眉大王はいっそう勇猛になり、配下を率いて進み、襲いかかった。"
  "translation_status": "reviewed"
- "id": "xy-ch65-036"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正在那不分勝敗之際，只聞得行者叱咤一聲道：「老孫來了。」八戒迎著道：「行李如何？」行者道：「老孫的性命幾乎難免，卻便說甚麼行李！」沙僧執著寶杖道：「且休敘話，快去打妖精也。」那星宿、揭諦、丁甲等神，被群妖圍在垓心渾殺，老妖使棒來打他三個。這行者、八戒、沙僧丟開棍杖，掄著釘鈀抵住。真個是地暗天昏，不能取勝。只殺得太陽星西沒山根，太陰星東生海嶠。那妖見天晚，打個哨子，教群妖各各留心，他卻取出寶貝。孫行者看得分明：那怪解下搭包，拿在手中。行者道聲：「不好了，走啊！」他就顧不得八戒、沙僧、諸天等眾，一路觔斗，跳上九霄空裡。眾神、八戒、沙僧不解其意，被他拋起去，又都裝在裡面，只是行者走了。那妖王收兵回寺，又教取出繩索，照舊綁了。將唐僧、八戒、沙僧懸梁高吊，白馬拴在後邊，諸神亦俱綁縛，擡在地窖子內，封鎖了蓋。那眾妖遵依，一一收了不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    まだ勝敗のつかぬ最中に、悟空の叱咤が響いた。
    悟空「この俺が来たぞ！」
    八戒は迎えて尋ねた。
    八戒「荷物はどうした？」
    悟空「俺の命さえ、危うく助からないところだったんだ。荷物どころの話か！」
    沙悟浄は宝杖を持って言った。
    沙悟浄「話はあとです。早く妖怪を打ちましょう。」
    星宿、掲諦、丁甲（ていこう）などの神々は、妖怪どもに囲まれ、真ん中で乱戦していた。黄眉大王は棒を振って三人へ打ちかかる。悟空、八戒、沙悟浄は棍棒と杖を振り広げ、釘のついた熊手を振るって受け止めた。まさに地も暗く、天も昏くなる戦いだったが、勝つことができない。戦い続けて、太陽は西の山の根へ沈み、月は東の海辺の高みから昇った。黄眉大王は日が暮れたのを見ると、口笛を吹いて、配下にそれぞれ気をつけるよう命じ、自分は宝物を取り出した。悟空には、黄眉大王が肩掛け袋をほどき、手に持つのがはっきり見えた。
    悟空「まずいぞ、逃げろ！」
    もはや八戒、沙悟浄、諸天たちを顧みる暇もなく、筋斗を打ち続け、高い空へ跳び上がった。神々も八戒も沙悟浄も、その意味を分からぬまま、黄眉大王が袋を投げ上げると、また皆、中へ吸い込まれた。逃げたのは悟空だけだった。黄眉大王は兵を収めて寺へ帰り、また縄を取ってこさせ、以前のように縛った。三蔵、八戒、沙悟浄は梁から高く吊り下げ、白馬は裏手につないだ。神々も皆縛って地下の穴蔵へ担ぎ込み、蓋を閉じ、錠を掛けた。妖怪どもは命令どおりに、一つずつ始末した。こちらの話は、しばらく措こう。
  "translation_status": "reviewed"
- "id": "xy-ch65-037"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫行者跳在九霄，全了性命。見妖兵回轉，不張旗號，已知眾等遭擒。他卻按下祥光，落在那東山頂上，咬牙恨怪物，滴淚想唐僧，仰面朝天望，悲嗟忽失聲。叫道：「師父啊，你是那世裡造下這迍邅難，今世裡步步遇妖精？似這般苦楚難逃，怎生是好？」獨自一個，嗟嘆多時，復又寧神思慮，以心問心道：「這妖魔不知是個甚麼搭包子，那般裝得許多物件？如今將天神、天將，許多人又都裝進去了。我待求救於天，奈恐玉帝見怪。我記得有個北方真武，號曰蕩魔天尊，他如今現在南贍部洲武當山上，等我去請他來搭救師父一難。」正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    さて悟空は高い空へ跳び上がり、命を守った。妖兵が引き返し、旗を掲げなくなったのを見ると、皆が捕らえられたと悟った。光を下ろして東の山頂に降り立ち、歯を食いしばって怪物を恨み、涙を流して三蔵を思った。仰向いて天を見上げ、悲しみ嘆くうち、ふいに声を上げて泣いた。
    悟空「お師匠さま、いったいどの前世でこんな災難の因を作り、今の世では一歩ごとに妖怪に遭うのです。こんなに苦しく、逃れようもなくては、どうすればいいのでしょう！」
    ただ一人、長い間嘆き続けたのち、また気持ちを落ち着け、心で心に問いながら考えた。
    悟空「あの妖魔の袋は、いったい何なんだ。どうして、あれほどたくさんのものが入るんだろう。天の神や将軍まで、あんな大勢がまた中へ入れられてしまった。天へ救いを求めたいが、玉帝に咎められるのが怖い。そうだ、北方真武（ほっぽうしんぶ）という方がおられたな。蕩魔天尊（とうまてんそん）と号し、今は南贍部洲（なんせんぶしゅう）の武当山（ぶとうざん）におられる。あの方に来ていただいて、お師匠さまをこの難から救ってもらおう。」
    まさに、こういうことである。
  "translation_status": "reviewed"
- "id": "xy-ch65-038"
  "section_id": "chapter-65"
  "kind": "verse"
  "origin": "source"
  "source_text": "仙道未成猿馬散，心神無主五行枯。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    仙の道はいまだ成らず、猿と馬は散り散り、
    心も神も主を失い、五行（ごぎょう）は枯れ果てる。
  "translation_status": "reviewed"
- "id": "xy-ch65-039"
  "section_id": "chapter-65"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去端的如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch65-1455614"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?oldid=1455614&title=西遊記/第065回"
    "line_start": 189
    "line_end": 189
  "translation_ja": "さて、この先いったいどうなることか。続きは次の回でお聞きいただきたい。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-01-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭は善悪の因果を説き、無心・内丹修行・仏教の醍醐・極楽を重ねる韻文である。「無心薬」は執着を離れる心のたとえとして訳した。「黒海」の具体的な身体部位、「愍故」の故の細かな働きは確定できず、後者は慈悲を深める文脈から憐れみの意に取った。字を「苦」などへ改めず原文欄に残した。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-02-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「行夠多時」「又值冬殘」に続き「正是那三春之日」とする。三春は春の三か月をまとめた呼び方。旅の年月を計算して補ったり、季節の表現を別版へ合わせたりしていない。前の草木との一夜を肯定的に語る語り手の調子も、そのまま保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-03-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「季子」は蘇秦の字と解した。教育部の辞典に蘇秦を字季子・縦横家とする説明があり、「舌縱橫」という句の弁舌の役割に合う。同じ呼称を持つ別人に、文字の一致だけで結び付けたものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-04-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「天不滿西北」は古代中国の宇宙観に基づく言葉として、悟空が崑崙山を説明している。現代の地理・天文学の事実として保証するものではない。山の古詩の二句と、八戒の問いをともに残した。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-05-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "麖・獐は底本の動物名を保った。鹿類を指すことは辞書で説明できるが、この詩の個体を現代の特定種へ確定しない。「有處有雲」「是方是樹」は、場所ごとの雲と木々を描く句として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-06-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この描写は、悟空が眺めている寺の景観を詠むもの。「龍宮」「舍衛」「沙界」は仏教的な景観の比喩として扱い、特定の竜王の宮殿や現実の舎衛城へ移動したとはしない。底本の「靜土」を、一般的な「淨土」へ原文上で直していない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-07-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三文字の「雷音寺」を読んだ三蔵が、悟空に促されて四文字の「小雷音寺」と読み直す順序を保った。寺に仏がいるという見通しや「三千諸仏」の説明は三蔵の信念であり、語り手が保証した事実ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-08-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "仏の姿を装う者が妖王、ほかの阿羅漢たちが小妖怪だと、ここで語り手が明かす。先の声の主を、名乗り前から固有名で呼ばない。「三昼夜で膿血にし、その後に三人を蒸して食う」は妖王の意図・段取りであって、すでに実現した出来事ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-09-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "黄婆は沙悟浄、木母は八戒に重なる内丹の寓意語として読んだ。「禪機」は三蔵の宗教的な心、「本性」は本来の性を示す詩的表現として残し、通常の発言者名にしたり、詩の全句を筋の要約に置き換えたりしない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-10-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「唵㘕靜法界，乾元亨利貞」。訳文では通常の日本語字体「浄」を用いたが、㘕の字は保持した。既出の「唵藍浄法界」と同じ浄法界真言に関わる異表記と解する。李奭學論文の検索表示にも「唵㘕」があるが、論文全文や梵字原形を照合したとはしない。後半は易の乾卦の句を重ねており、語句を省かず呪文として残す。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-11-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "金頭掲諦に続く原文の主語は単に「揭諦」「他」であり、そのまま前の金頭掲諦の行動と解した。別の掲諦が交替したという記述はない。「路遇一山，名小雷音寺」という奏上は、山と寺の名の関係が明瞭ではないが、山の名を補わず発言の形を保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-12-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "二更と三更は、夜を五つに分けた時刻区分。季節によって長さが変わるため、固定の現代時刻に換算しない。槍・剣・刀・斧、および担ぐ・持ち上げる・めくる・こじるという反復をすべて訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-13-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「千斤之力」は力の大きさをいう表現で、現代の重量や力の単位へ換算しない。角の侵入、三度の伸長の掛け声、隙間ができないこと、角への穴あけ、悟空が穴へ入ること、角を引き抜いて力が尽きて倒れる順序を保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-14-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "修行して正果を得たこと、楼閣を天が授けたこと、名乗りと土地の人の呼び方は、いずれも妖王自身の主張。「果正中華」は倒置を含む表現として中華で正果を遂げると訳したが、取経後に何をするのかという詳細までは補わない。妖王の真の来歴や宝物の所有者は、この時点で示されていない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-15-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三五十」は三十または五十ほどという概数として訳した。三掛ける五十や正確な五十本に固定せず、三・五・十の数の要素を原文に残す。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-16-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本では三蔵の呼びかけに開き鉤括弧があるが、続く詩の末尾に対応する閉じ鉤括弧がない。原文欄はそのままにし、日本語側ではこの詩までを三蔵の嘆きとして閉じた。「三千功行」の三千も省かず、誰の発言かを保つ。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-17-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "仙鼠はコウモリの別名で、原文自身が「俗名蝙蝠」と説明する。新しい妖怪や、名を持つ別の人物が現れたものではない。変身の主体は悟空のまま。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-18-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "コウモリの詩の「無光白晝居」は、昼間は光のない所にこもる様子として解した。夜の蚊取りや月を好むという描写はこの詩の表現であり、現代の動物学の一般説明として補強していない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-19-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "二十八宿は、発言する角木蛟と続く二十七名を合わせて全二十八名を保った。底本は「氐土蝠」「女土貉」「胃土彘」「壁水㺄」とするため、他の星名表の動物字へ直さない。すでに出た奎木狼・昴日鶏などは既知の星神へ接続する。六丁六甲と護教伽藍は先に別の守備を命じられ、捕縛・解放の列挙では明示されなかったが、ここでまた一同に加わっている。合流の経緯を創作せず、三蔵と馬を残したという括弧内の説明も訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-20-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の「丟開棍杖」は、棍棒と杖を振り開いて戦う意に取り、武器を捨てたとはしなかった。三人の武器をまとめた叙述であり、三人全員が一本ずつ同じ熊手を持つという意味へ変えていない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-21-body"
  "section_id": "chapter-65"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「太陽星」「太陰星」は、ここでは戦いの時間経過を示す日と月として訳した。別の神が戦場へ現れたとはしない。夜明けから日没・月の出へ進む長い戦いを省かない。"
  "translation_status": "reviewed"
- "id": "xy-ch65-note-22-body"
  "section_id": "chapter-65"

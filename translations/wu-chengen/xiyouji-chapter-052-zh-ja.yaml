    "line_end": 173
  "translation_ja": |-
    悟空「生まれた時から腕は強く、天地万里に名をとどろかせた。
    その昔、賢く仙の道を修め、不老の術を授かった。
    志を立てて方寸（ほうすん）の地へ弟子入りし、心を尽くして聖人の里を訪れた。
    無数の変化の術を学び終え、宇宙の大空を思うままに駆けた。
    暇なら山の前で虎を伏せ、退屈なら海の中で竜を従えた。
    生まれ故郷の花果山（かかざん）では王を称し、水簾洞（すいれんどう）で強さを誇った。
    幾度も天界を狙う気を起こし、何度も向こう見ずに天上で略奪を働いた。
    帝から斉天大聖の名を賜り、勅命で美猴王（びこうおう）の号も授かった。
    ところが蟠桃会（ばんとうえ）の宴に招待状が来ず、気性の激しい俺は怒った。
    瑤池（ようち）へひそかに忍び込んで玉の酒を盗み、宝殿へ潜って美酒を飲んだ。
    竜の肝も鳳凰（ほうおう）の髄も盗み食いし、百味の珍膳をこっそり味わった。
    千年の蟠桃（ばんとう）を好きに食い、万年の丹薬で腹を満たした。
    天宮の珍しい物は何でも取り、大聖の屋敷に一つ残らずしまい込んだ。
    俺の腕を知った玉帝（ぎょくてい）は、すぐに天兵を出して戦場を整えた。
    九曜（くよう）の悪星を俺は退け、五方の凶星を傷つけた。
    全天の神将に敵はなく、十万の大軍も立ち向かえなかった。
    追い詰められた玉皇（ぎょくこう）が勅命を下し、灌江（かんこう）の小聖（しょうせい）が兵を率いてきた。
    七十二の変化で渡り合い、互いに精力を尽くし、どちらも強かった。
    南海（なんかい）の観音（かんのん）が助勢に来て、浄瓶（じょうへい）と柳も力を貸した。
    老君（ろうくん）まで金剛套（こんごうとう）を使い、俺を捕らえて天へ連れ帰った。
    縛られて玉皇張大帝（ぎょくこうちょうたいてい）の前へ引き出され、役人どもが問いただし、罪を定めた。
    ただちに大力の神に斬首を命じたが、頭を斬れば火花が散った。
    百計千策を尽くしても殺せず、老君のもとへ押し送った。
    炉の中で六丁（りくてい）の神火に焼かれ、全身は鋼のように鍛え上がった。
    七七の数を満たして炉を開ければ、俺は跳び出し、また大暴れ。
    神々は戸を閉ざし、誰も防げず、聖なる者たちは相談して仏に頼った。
    なるほど如来（にょらい）の法力は大きく、まことに智慧は果てしない。
    その手の中で宙返りの賭けをし、山の下に押さえられ、力を振るえなくなった。
    ようやく玉皇は安天会（あんてんかい）を催し、西方も極楽の場と呼べるようになった。
    この俺は五百年も押し込められ、茶飯を少しも味わわなかった。
    金蝉長老（きんせんちょうろう）が人の世へ降り、東土（とうど）から仏の国へ遣わされた。
    真の経を上国へ持ち帰り、大唐（だいとう）の帝は亡き人々を救おうとした。
    観音が善へ帰依せよと勧め、教えと加護を受けて、乱暴を控えた。
    高い山の根元の苦難から救われ、今は西へ経を取りに行く。
    悪党め、獐（しょう）や狐の浅知恵はよせ。唐僧（とうそう）を返し、法王（ほうおう）を拝ませろ！」
  "translation_status": "reviewed"
- "id": "xy-ch52-017"

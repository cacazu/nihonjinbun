- "id": "xy-ch52-005"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那魔王與孫大聖戰經三個時辰，不分勝敗，早又見天色將晚。妖魔支著長槍道：「悟空，你住了。天昏地暗，不是個賭鬥之時，且各歇息歇息，明朝再與你比迸。」行者罵道：「潑畜休言！老孫的興頭才來，管甚麼天晚？是必與你定個輸贏。」那怪物喝一聲，虛幌一槍，逃了性命，帥群妖收轉干戈，入洞中將門緊緊閉了。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    独角兕大王と悟空は三時辰（じしん）も戦ったが、勝敗はつかず、早くも日が暮れかかっていた。独角兕大王は長槍を支えて言った。
    独角兕大王「悟空、やめろ。天地が暗くなっては、勝負の時ではない。それぞれ休み、明朝また戦おう。」
    悟空「黙れ、畜生！　俺はようやく調子が出てきたところだ。日が暮れたから何だというんだ。何としても決着をつけてやる。」
    独角兕大王は一声叫び、槍で打つと見せかけて逃げ、命を拾った。群妖を率いて武器を収め、洞へ入ると門を固く閉じた。
  "translation_status": "reviewed"
- "id": "xy-ch52-006"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這大聖拽棍方回，天神在岸頭賀喜，都道：「是有能有力的大齊天，無量無邊的真本事。」行者笑道：「承過獎，承過獎。」李天王近前道：「此言實非褒獎，真是一條好漢子。這一陣也不亞當時瞞地網罩天羅也。」行者道：「且休題夙話。那妖魔被老孫打了這一場，必然疲倦。我也說不得辛苦，你們都放懷坐坐，等我再進洞去打聽他的圈子，務要偷了他的，捉住那怪，尋取兵器，奉還汝等歸天。」太子道：「今已天晚，不若安眠一宿，明早去罷。」行者笑道：「這小郎不知世事，那見做賊的好白日裡下手？似這等掏摸的，必須夜去夜來，不知不覺，才是買賣哩。」火德與雷公道：「三太子休言，這件事我們不知。大聖是個慣家熟套，須教他趁此時候，一則魔頭睏倦，二來夜黑無防，就請快去，快去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 124
    "line_end": 124
  "translation_ja": |-
    悟空が棒を引きずって戻ってくると、天神たちは崖の上で口々に祝いの言葉を述べた。
    天神たち「さすが、力も技も備えた斉天大聖（せいてんたいせい）。まことに、果てしない腕前です。」
    悟空は笑った。
    悟空「褒めすぎだ、褒めすぎだ。」
    李天王は前へ進み出た。
    李天王「これは決してお世辞ではありません。まことの豪傑です。この戦いも、かつて天と地に張り巡らした網をくぐり抜けた時に、劣りませんでした。」
    悟空「昔話はよそう。あの妖怪も、これだけ俺と戦えば疲れたはずだ。俺も疲れたなどと言ってはいられない。皆さんは安心して座っていてくれ。もう一度洞へ入り、あの輪のありかを探る。何としても盗み出し、あいつを捕まえて武器を見つけ、皆さんに返して天へ帰れるようにしよう。」
    哪吒（なた）「もう夜です。一晩ゆっくり眠り、明朝行ってはどうですか。」
    悟空は笑って言った。
    悟空「この若いのは世間を知らないな。盗人が昼間に手を出していいものか。こういう盗みは、夜に出かけ、夜に帰ってこそだ。誰にも気づかれずにやるのが商売さ。」
    火徳星君（かとくせいくん）と雷公（らいこう）たち「三太子（さんたいし）、そのくらいに。このことは我々には分かりません。大聖は手慣れたものですから、今のうちに行っていただきましょう。一つには敵が疲れ、二つには夜の闇に気を許しています。さあ、早くお出かけください。」
  "translation_status": "reviewed"
- "id": "xy-ch52-007"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，笑唏唏的，將鐵棒藏了。跳下高峰，又至洞口，搖身一變，變作一個促織兒。真個："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 126
    "line_end": 126
  "translation_ja": "悟空はにこにこしながら鉄棒をしまい、高い峰から跳び下りて、再び洞の入口へ行った。体を振ると、一匹のコオロギに姿を変えた。その姿は、まさにこうである。"
  "translation_status": "reviewed"
- "id": "xy-ch52-008"
  "section_id": "chapter-52"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    嘴硬鬚長皮黑，眼明爪腳丫叉。風清月明叫牆涯。夜靜如同人話。
    泣露淒涼景色，聲音斷續堪誇。客窗旅思怕聞他。偏在空階床下。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 128
    "line_end": 129
  "translation_ja": |-
    口は固く、ひげは長く、肌は黒い。
    目は明るく、足先の爪は枝分かれ。
    風の澄み月の明るい夜、壁のほとりで鳴き、
    静けさの中では人の話す声にも似る。

    露に泣けば景色もわびしく、
    途切れ途切れの声も、見事なもの。
    旅の窓辺に郷愁を抱く者は、聞くのを恐れるのに、
    わざわざ人気のない階段や寝床の下にいる。
  "translation_status": "reviewed"
- "id": "xy-ch52-009"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "蹬開大腿，三五跳，跳到門邊，自門縫裡鑽將進去，蹲在那壁根下，迎著裡面燈光，仔細觀看。只見那大小群妖，一個個狼餐虎嚥，正都吃東西哩。行者揲揲鎚鎚的叫了一遍。少時間，收了家火，又都去安排窩鋪，各各安身。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 130
    "line_end": 130
  "translation_ja": "大きな脚を蹴り伸ばし、三度、五度と跳ねて門へ近づくと、隙間から潜り込み、壁の根元にうずくまった。奥の明かりを頼りに、じっと様子を見る。大小の妖怪たちは、どれも狼や虎のように、むさぼり食っているところだった。悟空はコロコロとひとしきり鳴いた。しばらくすると、妖怪たちは食器を片づけ、寝床を整えて、それぞれ横になった。"
  "translation_status": "reviewed"
- "id": "xy-ch52-010"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "約摸有一更時分，行者才到他後邊房裡，只聽那老魔傳令，教：「各門上小的醒睡，恐孫悟空又變甚麼，私入家偷盜。」又有些該班坐夜的，滌滌托托，梆鈴齊響。這大聖越好行事。鑽入房門，見有一架石床，左右列幾個抹粉搽胭的山精樹鬼，展鋪蓋伏侍老魔，脫腳的脫腳，解衣的解衣。只見那魔王寬了衣服，左肐膊上白森森的套著那個圈子，原來像一個連珠鐲頭模樣。你看他更不取下，轉往上抹了兩抹，緊緊的勒在肐膊上，方才睡下。行者見了，將身又變，變作一個黃皮虼蚤，跳上石床，鑽入被裡，爬在那怪的肐膊上，著實一口。叮的那怪翻身罵道：「這些少打的奴才！被也不抖，床也不拂，不知甚麼東西，咬了我這一下。」他卻把圈子又捋上兩捋，依然睡下。行者爬上那圈子，又咬一口。那怪睡不得，又翻過身來道：「刺鬧殺我也！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    一更（いっこう）ごろ、悟空はようやく奥の部屋へ行った。独角兕大王が命じる声が聞こえた。
    独角兕大王「各門の者は、眠っても油断するな。孫悟空（そんごくう）がまた何かに化け、忍び込んで盗むかもしれぬ。」
    夜番に当たっている者もいて、拍子木と鈴をカタカタと鳴らしている。かえって、悟空には動きやすかった。部屋の戸口を潜ると、石の寝台があり、左右には白粉と紅を塗った山の精や木の鬼が何人か並んでいた。寝具を延べ、足もとを脱がせる者、衣を解く者と、独角兕大王の世話をしている。衣服を緩めると、独角兕大王の左腕にはあの白く光る輪がはまっていた。数珠玉を連ねた腕輪のような形だった。独角兕大王はそれを外そうともせず、腕の上の方へ二度ほど押し上げて、きつくはめてから横になった。
    それを見た悟空は、今度は黄色い皮のノミとなり、石の寝台へ跳び上がって寝具の中へ潜った。独角兕大王の腕をはい、思いきり一口かみつく。独角兕大王は寝返りを打って罵った。
    独角兕大王「この、折檻の足りぬ奴らめ！　掛け物も振るわず、寝床も払わぬ。何だか知らんが、かみつきおった。」
    それでも輪をさらに二度ほど上へ押しやり、また眠ろうとする。悟空は輪のところへはい上がり、もう一口かんだ。独角兕大王は眠れず、また寝返りを打った。
    独角兕大王「むずがゆくて、たまらん！」
  "translation_status": "reviewed"
- "id": "xy-ch52-011"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者見他關防得緊，寶貝又隨身，不肯除下，料偷他的不得。跳下床來，還變做促織兒，出了房門，徑至後面，又聽得龍吟馬嘶。原來那層門緊鎖，火龍、火馬都吊在裡面。行者現了原身，走近門前，使個解鎖法，念動咒語，用手一抹，扢扠一聲，那鎖雙鐄俱就脫落。推開門，闖將進去觀看，原來那裡面被火器照得明晃晃的，如白日一般。忽見東西兩邊斜靠著幾件兵器，都是太子的砍妖刀等物，並那火德的火弓、火箭等物。行者映火光，週圍看了一遍，又見那門背後一張石桌子上有一個篾絲盤兒，放著一把毫毛。大聖滿心歡喜，將毫毛拿起來，啊了兩口熱氣，叫聲：「變！」即變作三五十個小猴。教他都拿了刀、劍、杵、索、裘輪及弓、箭、槍、車、葫蘆、火鴉、火鼠、火馬，一應套去之物，\U000298D4了火龍，縱起火勢，從裡邊往外燒來。只聽得烘烘\U000242A8\U000242A8，撲撲乒乒，好便似咋雷連炮之聲。慌得那些大小妖精夢夢查查的，披著被，朦著頭，喊的喊，哭的哭，一個個走頭無路，被這火燒死大半。美猴王得勝回來，只好有三更時候。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    警戒が厳しく、宝も身につけたまま外そうとしない。悟空は、これでは盗めないと見切った。寝台から跳び下り、再びコオロギになって部屋を出ると、まっすぐ奥へ向かった。そこでも竜の鳴く声、馬のいななきが聞こえる。その先の門には固く錠がかかり、火の竜や火の馬が中につながれていた。
    悟空は元の姿になって門に近づき、錠を開ける術を使った。呪文を唱え、手で一なですると、ガチャリと錠の二つのばねが外れ落ちた。門を押し開け、中へ飛び込んでみると、火の道具が室内を照らし、昼間のように明るい。ふと、東西の壁にいくつもの武器が斜めに立てかけてあるのを見つけた。どれも哪吒の砍妖刀（かんようとう）などの武器と、火徳星君の火の弓・火の矢などである。
    悟空が火明かりで周囲をひと巡り見ると、門の裏の石卓に、細い竹ひごで編んだ盆があり、一つかみの毛が置かれていた。喜びに胸を満たし、その毛を取り上げ、二度温かな息を吹きかけた。
    悟空「変われ！」
    たちまち三、五十匹の小猿になった。刀・剣・杵（しょ）・縄・裘輪（きゅうりん）、それに弓・矢・槍・車・ひょうたん・火の鴉・火の鼠・火の馬と、輪で奪われた物をことごとく持たせた。悟空は火の竜に乗り、火勢をあおって、奥から外へと焼き立てていった。ごうごう、ばちばち、どんどんと、雷と大砲が続けざまに鳴るような音がした。大小の妖怪たちは寝ぼけたまま大慌てで、掛け物をかぶる者、頭を覆う者、叫ぶ者、泣く者と取り乱した。誰も逃げ道がなく、大半が火に焼かれて死んだ。悟空が勝ち誇って戻ったのは、ちょうど三更（さんこう）ごろだった。
  "translation_status": "reviewed"
- "id": "xy-ch52-012"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那高峰上，李天王眾位忽見火光晃亮，一擁前來。見行者騎著龍，喝喝呼呼，縱著小猴，徑上峰頭，厲聲高叫道：「來收兵器，來收兵器。」火德與哪吒答應一聲。這行者將身一抖，那把毫毛復上身來。哪吒太子收了他六件兵器，火德星君著眾火部收了火龍等物，都笑吟吟贊賀行者不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    さて、高い峰にいた李天王たちは、突然明るい炎が上がるのを見て、一斉に前へ駆け寄った。すると悟空が竜に乗り、大声で小猿たちを追い立てながら、まっすぐ峰へ登ってくる。悟空は声を張り上げた。
    悟空「武器を受け取ってくれ！　武器を受け取ってくれ！」
    火徳星君と哪吒が返事をした。悟空が体を震わせると、あの一つかみの毛は身へ戻った。哪吒は六つの武器を収め、火徳星君は火部の神々に火の竜などを収めさせた。皆、笑顔で悟空を褒め、祝った。その話はさておく。
  "translation_status": "reviewed"
- "id": "xy-ch52-013"

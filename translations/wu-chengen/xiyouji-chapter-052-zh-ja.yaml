- "id": "xy-ch52-026"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽說「宰殺」二字，扢蹬蹬腮邊火發，按不住心頭之怒，丟了架子，掄著拳，斜行抅步，望妖魔使個掛面；那怪展長槍，劈手相迎。行者左跳右跳，哄那妖魔；妖魔不知是計，趕離洞口南來。行者即招呼羅漢把金丹砂望妖魔一齊拋下。好砂！正是那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 187
    "line_end": 187
  "translation_ja": "悟空は「殺す」という言葉を聞くと、頬までかっと熱くなり、心の怒りを抑えられなくなった。構えを取り、拳を振るって斜めに足を運び、独角兕大王の顔を払う技を繰り出した。独角兕大王は長槍を伸ばし、すかさず迎え撃つ。悟空は左へ右へ跳んで独角兕大王を誘った。独角兕大王は計略と知らず、洞の入口から南へ追いかけていった。悟空はそこで羅漢たちに合図し、金丹砂を独角兕大王めがけて一斉に投げさせた。何とすごい砂だろう。そのさまは、こうである。"
  "translation_status": "reviewed"
- "id": "xy-ch52-027"
  "section_id": "chapter-52"
  "kind": "verse"
  "origin": "source"
  "source_text": "似霧如煙初散漫，紛紛靄靄下天涯。白茫茫，到處迷人眼；昏漠漠，飛時找路差。打柴的樵子失了伴，採藥的仙童不見家。細細輕飄如麥麵，粗粗翻復似芝麻。世界朦朧山頂暗，長空迷沒太陽遮。不比囂塵隨駿馬，難言輕軟襯香車。此砂本是無情物，蓋地遮天把怪拿。只為妖魔侵正道，阿羅奉法逞豪華。手中就有明珠現，等時刮得眼生花。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 188
    "line_end": 188
  "translation_ja": |-
    初めは霧のよう、煙のように広がり、
    やがてもうもうと、空の果てから降ってくる。
    白くかすんで、至る所で目をくらまし、
    薄暗く飛び散って、探す道を取り違えさせる。
    薪を採る木こりは仲間を見失い、薬を摘む仙童は家が見えない。
    細かな砂は小麦粉のように軽く舞い、粗い砂は胡麻のように転がる。
    世界はぼんやりと、山頂は暗く、大空を覆い尽くして太陽を遮る。
    駿馬の後に上がる塵とは異なり、香る車を敷き支える柔らかな砂ともいえぬ。
    この砂はもとより情けを知らず、地を覆い、天を遮って妖怪を捕らえる。
    妖魔が正道を侵したため、阿羅漢（あらかん）が仏の命に従い、華々しく力を示すのだ。
    手の中からは明るい珠が現れ、たちまち吹きつけ、目をちかちかさせる。
  "translation_status": "reviewed"
- "id": "xy-ch52-028"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那妖魔見飛砂迷目，把頭低了一低，足下就有三尺餘深。慌得他將身一縱，跳在浮上一層。未曾立得穩，須臾，又有二尺餘深。那怪急了，拔出腳來，即忙取圈子，往上一撇，叫聲：「著！」唿喇的一下，把十八粒金丹砂又盡套去，拽回步，徑歸本洞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 190
    "line_end": 190
  "translation_ja": |-
    独角兕大王は飛ぶ砂に目をくらまされ、少し頭を下げた。すると足もとには、もう三尺（しゃく）余りも砂が積もっている。慌てて身を躍らせ、積もった砂の表面へ跳び乗った。まだ踏みしめてもいないうちに、すぐまた二尺余りも埋まってしまう。独角兕大王は焦り、足を引き抜くと、急いで輪を取り出して上へ投げた。
    独角兕大王「当たれ！」
    ざっと一音すると、十八粒の金丹砂も残らず取り込まれた。独角兕大王は踵を返し、まっすぐ自分の洞へ戻った。
  "translation_status": "reviewed"
- "id": "xy-ch52-029"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那羅漢一個個空手停雲。行者近前問道：「眾羅漢，怎麼不下砂了？」羅漢道：「適才響了一聲，金丹砂就不見矣。」行者笑道：「又是那話兒套將去了。」天王等眾道：「這般難伏啊，卻怎麼捉得他？何日歸天，何顏見帝也？」旁有降龍、伏虎二羅漢對行者道：「悟空，你曉得我兩個出門遲滯何也？」行者道：「老孫只怪你躲避不來，卻不知有甚話說。」羅漢道：「如來吩咐我兩個說：『那妖魔神通廣大，如失了金丹砂，就教孫悟空上離恨天兜率宮太上老君處尋他的蹤跡，庶幾可一鼓而擒也。』」行者聞言道：「可恨，可恨！如來卻也閃賺老孫。當時就該對我說了，卻不免教汝等遠涉。」李天王道：「既是如來有此明示，大聖就當早起。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 191
    "line_end": 191
  "translation_ja": |-
    羅漢たちは一人一人、手ぶらで雲を止めていた。悟空が近づいて尋ねた。
    悟空「羅漢の皆さん、どうして砂を降らせないんだ。」
    羅漢たち「さっき一音したと思うと、金丹砂がなくなったのだ。」
    悟空は笑った。
    悟空「また、あれに取り込まれたんだな。」
    李天王たち「これほど降しにくいとは、どうすれば捕まえられるのだ。いつ天へ帰れる。どんな顔で陛下にお会いすればよいのだ。」
    そばにいた降龍・伏虎の二羅漢が、悟空に言った。
    降龍と伏虎「悟空、私たちが門を出るのが遅れたわけを知っているか。」
    悟空「隠れて来たがらないのだと責めはしたが、何を話していたかは知らない。」
    降龍と伏虎「如来は私たち二人に、こう言いつけられた。『あの妖魔は神通力が大きい。もし金丹砂を失ったなら、孫悟空を離恨天（りこんてん）の兜率宮（とそつきゅう）、太上老君（たいじょうろうくん）のもとへ行かせ、あれの手がかりを探らせよ。そうすれば、一気に捕らえられるだろう。』」
    悟空「腹立たしい、腹立たしい！　如来まで俺をはぐらかすとは。その場で話してくださればよかったのに、皆さんに遠くまで来てもらうことになったじゃないか。」
    李天王「如来がそこまではっきり示されたのなら、大聖、早くお発ちになるべきです。」
  "translation_status": "reviewed"
- "id": "xy-ch52-030"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，說聲去，就縱一道觔斗雲，直入南天門裡。時有四大元帥擎拳拱手道：「擒怪事如何？」行者且行且答道：「未哩，未哩。如今有處尋根去也。」四將不敢留阻，讓他進了天門。不上靈霄殿，不入鬥牛宮，徑至三十三天之外離恨天兜率宮前，見兩仙童侍立，他也不通姓名，一直徑走。慌得兩童扯住道：「你是何人？往何處去？」行者才說：「我是齊天大聖，欲尋李老君哩。」仙童道：「你怎這樣粗魯？且住下，讓我們通報。」行者那容分說，喝了一聲，往裡徑走。忽見老君自內而出，撞個滿懷。行者躬身唱個喏道：「老官，一向少看。」老君笑道：「這猴兒不去取經，卻來我處何幹？」行者道：「取經取經，晝夜無停。有些阻礙，到此行行。」老君道：「西天路阻，與我何干？」行者道：「西天西天，你且休言。尋著蹤跡，與你纏纏。」老君道：「我這裡乃是無上仙宮，有甚蹤跡可尋？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 192
    "line_end": 192
  "translation_ja": |-
    悟空は行くと言うや一筋の筋斗雲を飛ばし、そのまま南天門（なんてんもん）へ入った。ちょうど四元帥が、両手を合わせて挨拶した。
    四元帥「妖怪退治はいかがでしたか。」
    悟空は歩きながら答えた。
    悟空「まだだ、まだだ。今度は、素性を探りに行く当てができたんだ。」
    四人は引き止めようとせず、天門へ通した。悟空は霊霄殿（れいしょうでん）にも斗牛宮（とぎゅうきゅう）にも行かず、三十三天（さんじゅうさんてん）の外にある離恨天の兜率宮へ直行した。二人の仙童が立って仕えていたが、名前も告げずに進む。慌てた二人は悟空をつかんだ。
    二人の仙童「あなたは誰です。どこへ行くのですか。」
    悟空「俺は斉天大聖だ。李老君（りろうくん）を訪ねに来た。」
    二人の仙童「何という無作法です。止まってください。私たちが取り次ぎます。」
    悟空は言わせもせず、一喝して奥へ進んだ。すると太上老君が中から出てきて、正面からぶつかった。悟空は身をかがめて挨拶した。
    悟空「おじさん、しばらくご無沙汰していたな。」
    太上老君は笑った。
    太上老君「この猿、取経にも行かず、わしの所へ何の用だ。」
    悟空「取経、取経で、昼も夜も休みなし。ちょっと邪魔が入ったので、ここまで来たのさ。」
    太上老君「西天への道が塞がったからといって、わしに何の関わりがある。」
    悟空「西天、西天、まあ黙っていてくれ。手がかりをつかんだから、おじさんに付き合ってもらう。」
    太上老君「ここは、この上ない仙宮だ。どんな手がかりを探すというのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch52-031"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者入裡，眼不轉睛，東張西看。走過幾層廊宇，忽見那牛欄邊一個童兒盹睡，青牛不在欄中。行者道：「老官，走了牛也，走了牛也。」老君大驚道：「這孽畜幾時走了？」正嚷間，那童兒方醒，跪於當面道：「爺爺，弟子睡著，不知是幾時走的。」老君罵道：「你這廝如何盹睡？」童兒叩頭道：「弟子在丹房裡拾得一粒丹，當時吃了，就在此睡著。」老君道：「想是前日煉的七返火丹，吊了一粒，被這廝拾吃了。那丹吃一粒，該睡七日哩。那孽畜因你睡著，無人看管，遂乘機走下界去，今亦是七日矣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    悟空は中へ入り、目を凝らしてあちこちを見た。幾重もの回廊や建物を過ぎると、牛小屋のそばで一人の童子が居眠りをしていた。囲いの中に青牛（せいぎゅう）はいない。
    悟空「おじさん、牛が逃げたぞ。牛が逃げた！」
    太上老君は大いに驚いた。
    太上老君「あの畜生、いつ逃げたのだ。」
    騒いでいるうちに童子は目を覚まし、前にひざまずいた。
    童子「お師匠さま、弟子の私は眠っておりましたので、いつ逃げたか分かりません。」
    太上老君は叱った。
    太上老君「お前は、なぜ居眠りをしていた。」
    童子は頭を地につけた。
    童子「丹薬を作る部屋で一粒の丹を拾い、その場で食べましたら、ここで眠ってしまったのです。」
    太上老君「おそらく先日煉った七返火丹（しちへんかたん）が一粒落ちていて、こやつが拾って食べたのだな。あの丹は一粒食べると、七日眠るのだ。あの畜生は、お前が眠って誰も見張らぬのに乗じ、下界へ逃げたのだ。今でもう七日になる。」
  "translation_status": "reviewed"
- "id": "xy-ch52-032"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "即查可曾偷甚寶貝。行者道：「無甚寶貝，只見他有一個圈子，甚是利害。」老君急查看時，諸般俱在，止不見了金剛琢。老君道：「這孽畜偷了我金剛琢去了！」行者道：「原來是這件寶貝。當時打著老孫的是他。如今在下界張狂，不知套了我等多少物件。」老君道：「這孽畜在甚地方？」行者道：「現住金兜本作「⿰山兜」，Unicode缺字山金兜本作「⿰山兜」，Unicode缺字洞。他捉了我唐僧進去，搶了我金箍棒。請天兵相助，又搶了太子的神兵。及請火德星君，又搶了他的火具。惟水伯雖不能渰死他，倒還不曾搶他物件。至請如來著羅漢下砂，又將金丹砂搶去。似你這老官縱放怪物，搶奪傷人，該當何罪？」老君道：「我那金剛琢，乃是我過函關化胡之器，自幼煉成之寶。憑你甚麼兵器、水火，俱莫能近他。若偷去我的芭蕉扇兒，連我也不能奈他何矣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 194
    "line_end": 194
  "translation_ja": |-
    そこで、何か宝を盗んでいないか、すぐに調べた。
    悟空「ほかに宝は見なかった。ただ、輪を一つ持っていて、あれがひどく手ごわいんだ。」
    太上老君が急いで調べると、ほかはすべてそろっているが、金剛琢（こんごうたく）だけがない。
    太上老君「あの畜生、わしの金剛琢を盗んでいったのか！」
    悟空「ああ、あの宝だったのか。昔、俺に当てたのもそれだな。今は下界で暴れ回り、俺たちの物をどれだけ取り込んだことか。」
    太上老君「あの畜生は、どこにいる。」
    悟空「今は金兜山の金兜洞に住んでいる。俺の唐僧を捕まえて中へ入れ、金箍棒を奪った。天兵の助けを借りれば、哪吒太子（なたたいし）の神兵器も奪った。火徳星君を呼べば、その火の道具も奪った。ただ水伯は、あいつを溺れさせられなかったが、物は取られていない。如来に頼んで羅漢たちに砂を降らせてもらうと、金丹砂まで奪ったんだ。おじさんのように妖怪を放し飼いにし、強奪や危害を加えさせたら、何の罪になる。」
    太上老君「わしの金剛琢は、函関（かんかん）を越えて胡（こ）の人々を教化した時に用いた道具で、幼いころから煉り上げた宝だ。どんな武器も、水も火も、近づくことはできぬ。もし芭蕉扇（ばしょうせん）まで盗まれていたなら、わしでさえ、あれをどうにもできなかっただろう。」

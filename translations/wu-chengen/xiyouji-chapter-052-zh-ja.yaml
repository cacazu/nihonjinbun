  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那李天王帥眾回上高峰，火德怨哪吒性急，雷公怪天王放刁，惟水伯在傍無語。行者見他們面不廝睹，心有縈思，沒奈何，懷恨強歡，對眾笑道：「列位不須煩惱。自古道：『勝敗兵家之常。』我和他論武藝，也只如此；但只是他多了這個圈子，所以為害，把我等兵器又套將去了。你且放心，待老孫再去查查他的腳色來也。」太子道：「你前啟奏玉帝，查勘滿天世界，更無一點蹤跡，如今卻又何處去查？」行者道：「我想起來，佛法無邊。如今且上西天問我佛如來，教他著慧眼觀看大地四部洲，看這怪是那方生長，何處鄉貫住居，圈子是件甚麼寶貝。不管怎的，一定要拿他，與列位出氣，還汝等歡喜歸天。」眾神道：「既有此意，不須久停，快去，快去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    李天王は皆を率いて高い峰へ戻った。火徳星君は哪吒の気短さを恨み、雷公たちは李天王の無茶を責める。ただ水伯（すいはく）だけが、そばで黙っていた。悟空は、皆が顔も見合わせず、胸にわだかまりを抱えているのを見た。どうにもならず、悔しさをこらえて無理に明るく振る舞い、笑って言った。
    悟空「皆さん、くよくよするな。昔から『勝ち負けは兵家の常』というだろう。武芸だけなら、俺とあいつは互角だ。ところがあいつには、あの輪が余計にある。それが災いして、また武器を取り込まれたんだ。安心していてくれ。俺がもう一度、あいつの素性を調べてこよう。」
    哪吒「前に玉帝へ申し上げ、天界をくまなく調べても、何の手がかりもなかったのでしょう。今度はどこを調べるのですか。」
    悟空「思い出したんだ。仏法には限りがない。今度は西天（さいてん）へ行き、我らの仏、如来に尋ねよう。慧眼（えげん）で大地の四部洲（しぶしゅう）を見渡し、あいつがどこで生まれ育ち、どこを故郷とし、どこに住んでいるのか、あの輪が何という宝なのか、調べていただく。何としてもあいつを捕らえ、皆さんのうっぷんを晴らして、喜んで天へ帰ってもらうぞ。」
    天神たち「そのおつもりなら、待つことはありません。早く行ってください。」
  "translation_status": "reviewed"
- "id": "xy-ch52-019"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好行者，說聲去，就縱觔斗雲，早至靈山。落下祥光，四方觀看，好去處："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 177
    "line_end": 177
  "translation_ja": "悟空は行くと言うや筋斗雲（きんとうん）を飛ばし、早くも霊山（れいざん）へ着いた。瑞光を降ろして四方を見渡すと、何とも見事な所だった。"
  "translation_status": "reviewed"
- "id": "xy-ch52-020"
  "section_id": "chapter-52"
  "kind": "verse"
  "origin": "source"
  "source_text": "靈峰疏傑，疊障清佳，仙岳頂巔摩碧漢。西天瞻巨鎮，形勢壓中華。元氣流通天地遠，威風飛徹滿臺花。時聞鐘磬音長，每聽經聲明朗。又見那青松之下優婆講，翠柏之間羅漢行。白鶴有情來鷲嶺，青鸞著意佇閑亭。玄猴對對擎仙果，壽鹿雙雙獻紫英。幽鳥聲頻如訴語，奇花色絢不知名。回巒盤繞重重顧，古道彎環處處平。正是清虛靈秀地，莊嚴大覺佛家風。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    霊峰は抜きんでて高く、重なる山々は清らかで美しい。
    仙山の頂は、青い天をこする。
    西天に望む大山、その勢いは中華（ちゅうか）をしのぐ。
    元気（げんき）は天地の果てまで流れ通い、威風は花咲く台の隅々へ飛ぶ。
    時に鐘や磬（けい）の長い響きがし、たびたび明るい読経の声が聞こえる。
    青松の下では優婆（うば）が教えを説き、翠の柏の間では羅漢（らかん）が歩く。
    白鶴は思いを寄せて鷲嶺（じゅれい）へ来り、青鸞（せいらん）は心あって静かな亭にたたずむ。
    黒い猿は対になって仙果を捧げ、長寿の鹿も二頭ずつ紫の花を献じる。
    奥深い森の鳥は訴えるようにしきりに鳴き、珍しい花は名も分からぬまま鮮やかだ。
    巡る峰々は幾重にも向き合い、古道は曲がりくねって、どこもなだらか。
    これこそ清らかに澄み、霊気と美に満ちた地、荘厳な大覚（だいかく）の仏の家のたたずまいだ。
  "translation_status": "reviewed"
- "id": "xy-ch52-021"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那行者正然點看山景，忽聽得有人叫道：「孫悟空，從那裡來？往何處去？」急回頭看，原來是比丘尼尊者。大聖作禮道：「正有一事，欲見如來。」比丘尼道：「你這個頑皮。既然要見如來，怎麼不登寶剎，且在這裡看山？」行者道：「初來貴地，故此大膽。」比丘尼道：「你快跟我來也。」這行者緊隨至雷音寺山門下，又見那八大金剛雄糾糾的，兩邊擋住。比丘尼道：「悟空，暫候片時，等我與你奏上去來。」行者只得住立門外。那比丘尼至佛前合掌道：「孫悟空有事，要見如來。」如來傳旨令入，金剛才閃路放行。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 180
    "line_end": 180
  "translation_ja": |-
    悟空が山の景色を眺めていると、ふと呼びかける声がした。
    声「孫悟空、どこから来て、どこへ行くのです。」
    急いで振り向くと、比丘尼（びくに）尊者だった。悟空は礼をした。
    悟空「ちょうど一つ用があり、如来さまにお目にかかりたいのです。」
    比丘尼「いたずら者ですね。如来に会いたいなら、なぜ寺へ上がらず、ここで山を眺めているのです。」
    悟空「こちらへ来たのは初めてなので、つい失礼をしました。」
    比丘尼「さあ、早くついていらっしゃい。」
    悟空がぴったり後に従って雷音寺（らいおんじ）の山門へ来ると、雄々しい八大金剛（はちだいこんごう）が両側に立ち、行く手を遮っていた。
    比丘尼「悟空、少し待ちなさい。私が申し上げてきます。」
    悟空は仕方なく門外に立ち止まった。比丘尼は仏前へ行き、合掌して申し上げた。
    比丘尼「孫悟空が用事で参り、如来にお目にかかりたいと申しております。」
    如来が通すよう命じて、初めて金剛（こんごう）たちは道を開けた。
  "translation_status": "reviewed"
- "id": "xy-ch52-022"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者低頭禮拜畢，如來問道：「悟空，前聞得觀音尊者解脫汝身，皈依釋教，保唐僧來此求經，你怎麼獨自到此？有何事故？」行者頓首道：「上告我佛。弟子自秉迦持，與唐朝師父西來，行至金兜本作「⿰山兜」，Unicode缺字山金兜本作「⿰山兜」，Unicode缺字洞，遇著一個惡魔頭，名喚兕大王，神通廣大，把師父與師弟等攝入洞中。弟子向伊求取，沒好意，兩家比迸，被他將一個白森森的圈子，搶了我的鐵棒。我恐他是天將思凡，急上界查勘不出。蒙玉帝差遣李天王父子助援，又被他搶了太子的六般兵器。及請火德星君放火燒他，又被他將火具搶去。又請水德星君放水渰他，一毫又渰他不著。弟子費若干精神氣力，將那鐵棒等物偷出，復去索戰，又被他將前物依然套去，無法收降。因此特告我佛，望垂慈與弟子看看，果然是何物出身。我好去拿他家屬四鄰，擒此魔頭，救我師父，合拱虔誠，拜求正果。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    悟空が頭を下げて礼拝を終えると、如来が尋ねた。
    如来「悟空、以前、観音尊者（かんのんそんじゃ）がお前を解き放ち、仏の教えに帰依させ、唐僧を守ってここへ経を求めに来ると聞いた。どうして一人で来たのだ。何が起きた。」
    悟空は額を地につけて申し上げた。
    悟空「我が仏に申し上げます。弟子の私は加護を受け、唐の師と西へ参っておりましたが、金兜山（きんとうざん）の金兜洞まで来たところ、兕大王（じだいおう）という悪い妖怪に出会いました。大きな神通力で、師と弟弟子たちを洞へ取り込んだのです。私が返せと求めても応じず、戦いになりますと、白く光る輪で私の鉄棒を奪いました。天将が下界を恋しがって降りてきたのかと、急いで天上へ調べに行きましたが、分かりません。玉帝が李天王父子を援軍として遣わしてくださいましたが、太子の六つの武器も奪われました。火徳星君をお招きして焼こうとすれば、火の道具まで奪われ、水徳星君（すいとくせいくん）に頼んで水で溺れさせようとしても、少しも浸すことができませんでした。私は大変な気力と労力を費やして、鉄棒などを盗み出して再び戦いを挑みましたが、前と同じ品々をまた取り込まれ、降す手立てがございません。そこで、我が仏にお願いに参りました。どうかお慈悲をもって、あれが何者なのかお調べください。そうすれば、家族や近隣の者を捕らえ、妖怪を取り押さえて師を救い、一同、真心を込めて拝し、正果（しょうか）を求められるのです。」

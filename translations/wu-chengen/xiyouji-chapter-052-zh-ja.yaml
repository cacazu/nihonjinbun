  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那金兜本作「⿰山兜」，Unicode缺字洞裡火焰紛紛，諕得個兕大王魂不附體，急欠身開了房門，雙手拿著圈子，東推東火滅，西推西火消，滿空中冒煙突火，執著寶貝跑了一遍，四下裡煙火俱熄。急忙收救群妖，已此燒殺大半，男男女女，收不上百十餘丁；又查看藏兵之內，各件皆無。又去後面看處，見八戒、沙僧與長老還綑住未解，白龍馬還在槽上，行李擔亦在屋裡。妖魔遂恨道：「不知是那個小妖不仔細，失了火，致令如此。」傍有近侍的告道：「大王，這火不干本家之事。多是個偷營劫寨之賊，放了那火部之物，盜了神兵去也。」老魔方然省悟道：「沒有別人，斷乎是孫悟空那賊。怪道我臨睡時不得安穩。想是那賊猴變化進來，在我這肐膊叮了兩口。一定是要偷我的寶貝，見我抹勒得緊，不能下手，故此盜了兵器，縱著火龍，放此狠毒之心，意欲燒殺我也。賊猴啊！你枉使機關，不知我的本事。我但帶了這件寶貝，就是入大海而不能溺，赴火池而不能焚哩。這番若拿住那賊，只把刮了點垛，方趁我心。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    一方、金兜洞（きんとうどう）では炎があちこちに上がり、独角兕大王は魂も身を離れるほど驚いた。急いで起き上がって部屋の戸を開き、両手で輪を持った。東へ突き出せば東の火が消え、西へ突き出せば西の火が消える。煙と炎をかいくぐり、宝を手にひと回り走ると、四方の煙も火もすべて消えた。
    急いで配下を集めて助けたが、すでに大半は焼け死に、男も女も合わせて百十余人も残っていなかった。武器をしまった所を調べると、何もかもなくなっている。さらに奥を見に行くと、八戒（はっかい）・沙悟浄（さごじょう）・三蔵（さんぞう）は縛られたままで、白竜馬（はくりゅうば）も飼い葉桶につながれ、担ぎ荷物も部屋にあった。
    独角兕大王は恨めしげに言った。
    独角兕大王「どの小妖が不注意で火を出し、こんなことになったのだ。」
    そばにいた近侍が申し上げた。
    近侍「大王、この火は内輪の失火ではありません。おそらく陣へ忍び込んだ賊が、火部の物を放ち、神々の武器を盗んだのでしょう。」
    独角兕大王はようやく悟った。
    独角兕大王「ほかの者ではない。間違いなく孫悟空の仕業だ。寝つく時に落ち着かなかったのも道理よ。あの猿が化けて入り込み、わしの腕を二度かんだのだろう。きっと宝を盗むつもりだったのだ。わしがきつく押し上げていたので手が出せず、武器を盗んで火の竜を放った。むごい心を起こして、わしを焼き殺すつもりだったのだな。盗人猿め！　いくら策を弄しても無駄だ。わしの力を知らぬ。この宝を身につけていれば、大海へ入っても溺れず、火の池へ飛び込んでも焼けぬのだ。今度あいつを捕らえたら、肉をそいで細かく刻まねば、気が済まぬ。」
  "translation_status": "reviewed"

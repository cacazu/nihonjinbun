- "id": "xy-ch52-033"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大聖才歡歡喜喜，隨著老君。老君執了芭蕉扇，駕著祥雲同行，出了仙宮。南天門外，低下雲頭，徑至金兜本作「⿰山兜」，Unicode缺字山界。見了十八尊羅漢、雷公、水伯、火德、李天王父子，備言前事一遍。老君道：「孫悟空還去誘他出來，我好收他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 196
    "line_end": 196
  "translation_ja": |-
    ようやく悟空は大喜びで太上老君に従った。太上老君は芭蕉扇を持ち、瑞雲に乗って共に仙宮を出た。南天門の外から雲を低く下ろし、まっすぐ金兜山へ向かう。十八尊の羅漢、雷公たち、水伯、火徳星君、李天王父子に会い、これまでの事情を一通り詳しく話した。
    太上老君「孫悟空、もう一度行って誘い出してこい。わしが取り押さえる。」
  "translation_status": "reviewed"
  "attributions":
  - "voice": "digital_editor"
    "name_ja": "電子本文の編者"
    "source_span":
      "start": 47
      "end": 64
      "exact": "本作「⿰山兜」，Unicode缺字"
    "evidence_ja": "取得電子本文の字形説明。日本語では回題に結ぶ訳注へ訳した。"
- "id": "xy-ch52-034"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者跳下峰頭，又高聲罵道：「腯潑孽畜！趁早出來受死！」那小妖又去報知。老魔道：「這賊猴又不知請誰來也。」急綽槍帶寶，迎出門來。行者罵道：「你這潑魔，今番坐定是死了！不要走，吃吾一掌。」急縱身跳個滿懷，劈臉打了一個耳括子，回頭就跑。那魔掄槍就趕。只聽得高峰上叫道：「那牛兒還不歸家，更待何日？」那魔擡頭，看見是太上老君，就諕得心驚膽戰道：「這賊猴真個是個地裡鬼，卻怎麼就訪得我的主公來也？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    悟空は峰の上から跳び下り、また大声で罵った。
    悟空「この太った畜生め！　さっさと出てきて、殺されろ！」
    小妖が再び知らせに行った。
    独角兕大王「あの盗人猿、今度は誰を連れてきたのだ。」
    急いで槍をつかみ、宝を携えて門へ迎え出た。
    悟空「この悪党、今度こそ死ぬと決まったぞ！　逃げるな、この一撃を食らえ！」
    すばやく身を躍らせて懐へ飛び込み、顔に平手打ちを一発浴びせると、振り返って走った。独角兕大王は槍を振り回し、すぐ追いかける。その時、高い峰から声がした。
    太上老君「あの牛よ、まだ家へ帰らぬか。いつまで待つつもりだ。」
    独角兕大王が顔を上げると、太上老君がいる。肝も魂も震えるほど驚いて言った。
    独角兕大王「あの盗人猿は、本当に何でも嗅ぎつける奴だ。どうして、わしの主人を探し当てて連れてきたのだ。」
  "translation_status": "reviewed"
- "id": "xy-ch52-035"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "老君念個咒語，將扇子搧了一下，那怪將圈子丟來，被老君一把接住。又一搧，那怪物力軟筋麻，現了本相，原來是一隻青牛。老君將金鋼琢吹口仙氣，穿了那怪的鼻子，解下勒袍帶，繫於琢上，牽在手中。至今留下個拴牛鼻的拘兒，又名賓郎，職此之謂。老君辭了眾神，跨上青牛背上，駕彩雲，徑歸兜率院；縛妖怪，高昇離恨天。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 199
    "line_end": 199
  "translation_ja": |-
    太上老君が呪文を唱え、扇を一度あおぐと、独角兕大王は輪を投げてよこした。太上老君はそれを一つかみで受け取った。もう一度あおぐと、独角兕大王は力が抜け、筋がしびれて、本来の姿を現した。一頭の青牛だった。
    太上老君は金鋼琢（こんごうたく）に仙気を吹きかけ、青牛の鼻へ通した。袍を締める帯を解いて輪へ結びつけ、手に引く。今日まで残る、牛の鼻につける「拘児（こうじ）」、別名「賓郎（ひんろう）」というものは、まさにこれに由来するのだ。
    太上老君は神々に別れを告げ、青牛の背にまたがった。彩雲に乗り、まっすぐ兜率院（とそついん）へ帰っていく。青牛をつなぎ、離恨天へ高く昇っていった。
  "translation_status": "reviewed"
- "id": "xy-ch52-036"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孫大聖才同天王等眾打入洞裡，把那百十個小妖盡皆打死，各取兵器。謝了天王父子回天，雷公入府，火德歸宮，水伯回河，羅漢向西。然後才解放唐僧、八戒、沙僧，拿了鐵棒。他三人又謝了行者，收拾馬匹、行裝，師徒們離洞，找大路方走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 201
    "line_end": 201
  "translation_ja": |-
    それから悟空は李天王たちと洞へ攻め入り、百十匹の小妖を一匹残らず打ち殺し、それぞれ武器を取り戻した。李天王父子に礼を述べると、父子は天へ、雷公たちは府へ、火徳星君は宮へ、水伯は川へ、羅漢たちは西へと帰っていった。
    その後ようやく、三蔵・八戒・沙悟浄の縄を解き、鉄棒を手に取った。三人も悟空に礼を述べ、馬と旅装を整えた。師弟は洞を出て、大道を探して歩き始めた。
  "translation_status": "reviewed"
- "id": "xy-ch52-037"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正走間，只聽得路傍叫：「唐聖僧，吃了齋飯去。」那長老心驚。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 203
    "line_end": 203
  "translation_ja": |-
    歩いていると、道の脇から呼ぶ声がした。
    路傍の声「唐のお坊さま、精進料理を召し上がってから、お出かけください。」
    三蔵はぎくりとした。
  "translation_status": "reviewed"
- "id": "xy-ch52-038"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知是甚麼人叫喚，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 205
    "line_end": 205
  "translation_ja": "さて、呼びかけたのはいったい何者か。それは次の回で。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-01-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "取得した電子本文は、金兜の字の直後に「本作『⿰山兜』，Unicode缺字」（もとは山偏に兜の字で、Unicodeに字がない）という文字表示の説明を挿入する。これらは全て原文欄へ保持した。日本語では既出の呼称「金兜」を用い、文字注の意味をここに移した。欠字に関する記述は取得ページの説明であり、現在のUnicode全体について訳者が検証した主張ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-02-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の「主人公」は、物語を動かす当人・主たる者を指す含みがある。「その主」として原文の暗示を残し、誰を指すかはこの段階では補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-03-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原詩の「永鎮金兜稱上籌」は、長槍を相手として讃えつつ、その使い手の当地での支配と優位を述べると読んだ。金兜は山・洞の所在を指す略称として残す。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-04-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「瞞地網罩天羅」は文のつながりが不安定である。天羅地網による過去の包囲を出し抜いた戦いへの言及と読んだが、原字・語順は原文欄に保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-05-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「脫腳」はここでは就寝支度として足まわりの履物を脱がせる動作と読んだ。具体的な履物の種類までは補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-06-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「裘輪」。前回の六武器にある繡球と火輪に対応する、球と輪をまとめた表現と考えられるが、「裘」の原字を「球」へ無断で改めず残した。直前の砍妖刀もこの回の字を保持し、前回にある斬妖刀・砍妖剣との組合せの違いを均していない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-07-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「\U000298D4了火龍」の珍字は、次段に悟空が竜に乗って帰ると明記されることから「乗る」と解した。原字は保持。火音の「烘烘\U000242A8\U000242A8」「撲撲乒乒」は響きを示す表現として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-08-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「收不上百十餘丁」は百十余という概数にも届かないことを表すと読んだ。後の段落では小妖が百十と記されるが、数を厳密な同一値へ修正しない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-09-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「刮了點垛」は刀で肉をそぎ、細かく刻むという残酷な処罰・殺害の言い方と解した。料理の具体的な手順や別の刑名を追加せず、脅しの強さを保持した。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-10-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原詩は美猴王も勅封されたと悟空に語らせる。以前の回の名乗りの経緯に合わせて書き換えず、本人の自慢の語りとして保った。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-11-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "観音の浄瓶と楊柳まで助勢したというのはこの武勇詩の語り。過去の叙述と異なる細部も無断で補正しない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-12-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "七を七回、すなわち四十九を表す。ここでは炉内の期間を数える表現で、別の回の経過へ合わせて省略や補算をしない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-13-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「秉教迦持」の迦持は、仏の加護を受ける加持に通じると読んだ。原字を原文欄に残す。後の奏上の「自秉迦持」も同様に扱う。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-14-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は雷公の武器を「㨝」と記す。前回の「雷㨝」と同じ道具で、楔に類する雷の打具と考えられるが、具体的形状は確定しない。別の武器名へ改めず原字を残す。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-15-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ここでは優婆塞・優婆夷などの在家信者を表す略称と解した。略形だけから男性・女性のいずれかに限定せず、特定の一人の名にも置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-16-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は振り向いて初めて「比丘尼尊者」と明かすので、最初の呼びかけは「声」とした。比丘尼は通常、出家した女性の称だが、ここでは原文どおりの呼称を用い、ほかの仏弟子の名へ訂正しない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-17-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "教育部『重編國語辭典修訂本』の「賣放」は、贈賄による釈放という語義のほか、本回の句を引用して「欺く」と説明する。ここでは人数の足りなさを見た悟空の「ごまかしだ」という非難と訳した。同辞典の「賣法」も本回を例に、手管を使う意味を挙げる。金銭授受や実際の逃亡があったとは断定しない。「賣放」は検索表示、「賣法」は辞典本文を確認した。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-18-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「丟了架子」はここでは拳法の構えを繰り出す動作と読んだ。「斜行抅步」「掛面」は斜めの足運びと顔を払う技の描写として訳し、特定流派の現代技名へ同定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-19-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「難言輕軟襯香車」は、車の下に敷く普通の柔らかな砂とは言いがたいという対比に読んだ。「飛時找路差」の找も原字を保持し、道を探しても取り違えると解した。細部には解釈の余地がある。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-20-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "金丹砂を放つ手に現れる明珠という原詩の表現。砂の粒と珠の関係を機構として詳しく補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-21-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ここで老君が述べるのは七日。以前の下界での滞在期間と照合して七年などへ書き換えず、そのまま訳した。童子の丹薬も物語中の架空の品である。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-22-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "函関は函谷関の略。老子が西方へ行って胡の人々を教化したという、道教側の化胡の伝承に関わる老君の発言であり、歴史的事実として訳者が保証するものではない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-23-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この段落は金鋼琢、その前では金剛琢、武勇詩では金剛套と記す。輪という同じ宝の異表記・別称として追い、各原字を保持した。この注は本相が現れた後の宝名に結び、早い段落から正体を明かさない。"
  "translation_status": "reviewed"
- "id": "xy-ch52-note-24-body"
  "section_id": "chapter-52"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は牛の鼻につける拘兒を賓郎とも呼ぶと説明する。教育部『重編國語辭典修訂本』の「賓郎」は、牛の鼻にはめる輪という語義を挙げ、本回を引用する。独立レビューで辞典本文のこの定義と引用を確認した。本文は拘児と賓郎の両名を残した。この由来話は語り手が説く俗説で、器具の歴史的起源と同一視しない。"
  "translation_status": "reviewed"

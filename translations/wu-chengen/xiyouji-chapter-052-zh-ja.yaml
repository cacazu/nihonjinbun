- "id": "xy-ch52-002"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說孫大聖得了金箍棒，打出門前，跳上高峰，對眾神滿心歡喜。李天王道：「你這場如何？」行者道：「老孫變化進他洞去，那怪物越發唱唱舞舞的吃得勝酒哩。更不曾打聽得他的寶貝在那裡。我轉他後面，忽聽得馬叫龍吟，知是火部之物。東壁廂靠著我的金箍棒，是老孫拿在手中，一路打將出來也。」眾神道：「你的寶貝得了，我們的寶貝何時到手？」行者道：「不難，不難。我有了這根鐵棒，不管怎的，也要打倒他，取寶貝還你。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 118
    "line_end": 118
  "translation_ja": |-
    さて、悟空（ごくう）は金箍棒（きんこぼう）を取り戻し、敵を打ち散らして門の外へ出ると、高い峰に跳び上がった。神々に向き合う顔は喜びに満ちていた。
    李天王（りてんのう）「今度はどうでしたか。」
    悟空「姿を変えて洞へ入ってみると、あの化け物はますます上機嫌で、歌ったり踊ったりしながら祝杯を上げていた。あの宝がどこにあるかは、結局分からなかった。奥へ回ると、ふと馬のいななきと竜の声がしたので、火部（かぶ）のものだと分かったんだ。東の壁には俺の金箍棒が立てかけてあった。それを手に取り、敵を打ち散らしながら出てきたというわけさ。」
    天神たち「あなたの宝は戻りましたが、我々の宝はいつ戻るのでしょう。」
    悟空「難しいことはない。この鉄棒さえあれば、何としてもあいつを倒し、宝を取り返してやる。」
  "translation_status": "reviewed"
- "id": "xy-ch52-003"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正講處，只聽得那山坡下鑼鼓齊鳴，喊聲振地。原來是兕大王帥眾精靈來趕行者。行者見了，叫道：「好好好，正合吾意。列位請坐，待老孫再去捉他。」好大聖，舉鐵棒劈面迎來，喝道：「潑魔那裡走！看棍！」那怪使槍支住，罵道：「賊猴頭！著實無禮。你怎麼白晝劫吾物件？」行者道：「我把你這個不知死的孽畜！你倒弄圈套白晝搶奪我物，那件兒是你的？不要走，吃老爺一棍！」那怪物掄槍隔架。這一場好戰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 120
    "line_end": 120
  "translation_ja": |-
    話していると、山の斜面の下から銅鑼と太鼓が一斉に鳴り、叫び声が地を震わせた。独角兕大王（どっかくじだいおう）が配下を率い、悟空を追ってきたのだ。
    悟空はそれを見るなり叫んだ。
    悟空「いいぞ、いいぞ、願ってもない。皆さんは座っていてくれ。俺がもう一度、捕まえてくる。」
    勇ましい悟空は鉄棒を振り上げ、真正面から迎え撃った。
    悟空「悪党め、どこへ行く！　この棒を受けてみろ！」
    独角兕大王は槍で支え、罵った。
    独角兕大王「盗人猿め、無礼にもほどがある。白昼堂々、わしの持ち物を奪うとは何事だ。」
    悟空「死にたいのか、この畜生！　輪を使って白昼に俺たちの物を奪ったのは、お前だろう。どれがお前の物だというんだ。逃げるな、この俺の棒を食らえ！」
    独角兕大王は槍を振って受け止めた。さても激しい戦いである。
  "translation_status": "reviewed"
- "id": "xy-ch52-004"
  "section_id": "chapter-52"
  "kind": "verse"
  "origin": "source"
  "source_text": "大聖施威猛，妖魔不順柔。兩家齊鬥勇，那個肯干休。這一個鐵棒如龍尾，那一個長槍似蟒頭。這一個棒來解數如風響，那一個槍架雄威似水流。只見那彩霧朦朦山嶺暗，祥雲靉靆樹林愁。滿空飛鳥皆停翅，四野狼蟲盡縮頭。那陣上小妖吶喊，這壁廂行者抖擻。一條鐵棒無人敵，打遍西方萬里遊。那桿長槍真對手，永鎮金兜本作「⿰山兜」，Unicode缺字稱上籌。相遇這場無好散，不見高低誓不休。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    大聖（たいせい）は威力を振るい、妖魔は屈服しない。
    両者ともに勇を競い、誰が手を引くものか。
    こちらの鉄棒は竜の尾、あちらの長槍は大蛇の頭。
    棒を繰り出す技は風のように鳴り、槍で受ける威勢は流れる水のよう。
    色づく霧が山々を覆って暗くし、重なる瑞雲に林も愁える。
    空を飛ぶ鳥はみな翼を休め、野の獣たちは首をすくめる。
    敵陣では小妖たちが喊声を上げ、こちらでは悟空が気力を奮い立たせる。
    一筋の鉄棒に敵はなく、西方万里（り）を打ち巡る。
    あの長槍こそまことの好敵手、金兜（きんとう）に長く君臨して一番を誇る。
    ここで出会えば無事には別れぬ。勝ち負けを見るまで、決してやめぬ。
  "translation_status": "reviewed"

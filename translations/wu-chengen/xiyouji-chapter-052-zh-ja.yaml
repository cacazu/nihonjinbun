- "id": "xy-ch52-014"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說著話，懊惱多時，不覺的雞鳴天曉。那高峰上太子得了六件兵器，對行者道：「大聖，天色已明，不須怠慢，我們趁那妖魔挫了銳氣，與火部等扶助你，再去力戰，庶幾這次可擒拿也。」行者笑道：「說得有理。我們齊了心，耍子兒去耶。」一個個抖擻威風，喜弄武藝，徑至洞口。行者叫道：「潑魔出來，與老孫打者。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    独角兕大王がそう言って長く腹を立てているうちに、いつしか鶏が鳴き、夜が明けた。高い峰では、六つの武器を取り戻した哪吒が悟空に言った。
    哪吒「大聖、夜が明けました。ぐずぐずしてはいられません。妖怪の勢いがくじけた今、私たちも火部の神々とともに加勢し、もう一度力を尽くして戦いましょう。今度こそ、捕まえられるかもしれません。」
    悟空は笑った。
    悟空「もっともだ。皆で心を一つに、遊びに行こうじゃないか。」
    一人一人が威風を振るい、武芸を競うのを楽しみながら、まっすぐ洞の入口へ向かった。
    悟空「悪党、出てこい。この俺と戦え！」
  "translation_status": "reviewed"
- "id": "xy-ch52-015"

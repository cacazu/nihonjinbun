  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪聞言，指著行者道：「你原來是個偷天的大賊。不要走，吃吾一槍。」這大聖使棒來迎。兩個正自相持，這壁廂哪吒太子生嗔，火德星君發狠，即將那六件神兵、火部等物，望妖魔身上拋來。孫大聖更加雄勢。一邊又雷公使㨝，天王舉刀，不分上下，一擁齊來。那魔頭巍巍冷笑，袖子中暗暗將寶貝取出，撒手拋起空中，叫聲：「著！」唿喇的一下，把六件神兵、火部等物、雷公㨝、天王刀、行者棒，盡情又都撈去。眾神靈依然赤手，孫大聖仍是空拳。妖魔得勝回身，叫：「小的們，搬石砌門，動土修造，從新整理房廊。待齊備了，殺唐僧三眾來謝土，大家散福受用。」眾小妖領命維持不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    独角兕大王は聞き終えると、悟空を指さした。
    独角兕大王「お前は天まで盗む大泥棒だったのか。逃げるな、この槍を食らえ！」
    悟空は棒で迎え撃った。二人が渡り合っていると、こちらでは哪吒が怒り、火徳星君も猛り立って、六つの神兵器と火部の道具を独角兕大王めがけて投げつけた。悟空はさらに勢いづく。雷公たちも雷の楔（かみなりのくさび）を使い、李天王も刀を振り上げ、上下の区別もなく、皆いっせいに襲いかかった。
    独角兕大王はどっしりと構えて冷笑し、袖の中からひそかに宝を取り出すと、空へ放り上げた。
    独角兕大王「当たれ！」
    ざっと一音すると、六つの神兵器、火部の道具、雷公たちの雷の楔、李天王の刀、悟空の棒まで、残らずまた取り込んでしまった。神々は再び手ぶら、悟空もまた素手である。独角兕大王は勝ち誇って帰りながら命じた。
    独角兕大王「小者ども、石を運んで門を築き、土を掘って修繕せよ。部屋も回廊も造り直すのだ。すべて整ったら、唐僧たち三人を殺して謝土（しゃど）の祭りをし、皆でお下がりを分けて食おう。」
    小妖たちは命令を受け、仕事に取りかかった。その話はさておく。
  "translation_status": "reviewed"

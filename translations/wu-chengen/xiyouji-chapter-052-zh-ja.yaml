  "kind": "paragraph"
  "origin": "source"
  "source_text": "原來那裡兩扇石門被火氣化成灰燼，門裡邊有幾個小妖，正然掃地撮灰。忽見眾聖齊來，慌得丟了掃帚，撇下灰耙，跑入裡面，又報道：「孫悟空領著許多天神，又在門外罵戰哩。」那兕怪聞報大驚，扢迸迸，鋼牙咬響；滴溜溜，環眼睜圓。挺著長槍，帶了寶貝，走出門來，潑口亂罵道：「我把你這個偷營放火的賊猴！你有多大手段，敢這等藐視我也？」行者笑臉兒罵道：「潑怪物！你要知我的手段，且上前來，我說與你聽："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 138
    "line_end": 138
  "translation_ja": |-
    洞の二枚の石門は、火の熱ですっかり灰になっていた。門の内側では数匹の小妖が、地面を掃いて灰を集めている。神々がそろって来るのを見ると、慌ててほうきも灰かきも放り出し、奥へ駆け込んで報告した。
    小妖たち「孫悟空が大勢の天神を連れ、また門の外で戦えと罵っております！」
    独角兕大王は知らせに驚き、鋼のような歯をぎりぎりと鳴らし、丸い目をぎょろりと見開いた。長槍を構え、宝を携えて門を出ると、口汚く罵った。
    独角兕大王「陣へ忍び込んで火をつけた盗人猿め！　どれほどの腕があって、このわしをそこまで侮るのだ。」
    悟空は笑顔で言い返した。
    悟空「ろくでなしの化け物め！　俺の腕を知りたければ、前へ来い。話して聞かせてやる。」
  "translation_status": "reviewed"
- "id": "xy-ch52-016"
  "section_id": "chapter-52"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    自小生來手段強，乾坤萬里有名揚。
    當時穎悟修仙道，昔日傳來不老方。
    立志拜投方寸地，虔心參見聖人鄉。
    學成變化無量法，宇宙長空任我狂。
    閑在山前將虎伏，悶來海內把龍降。
    祖居花果稱王位，水簾洞裡逞剛強。
    幾番有意圖天界，數次無知奪上方。
    御賜齊天名大聖，敕封又贈美猴王。
    只因宴設蟠桃會，無簡相邀我性剛。
    暗闖瑤池偷玉液，私行寶閣飲瓊漿。
    龍肝鳳髓曾偷吃，百味珍饈我竊嘗。
    千載蟠桃隨受用，萬年丹藥任充腸。
    天宮異物般般取，聖府奇珍件件藏。
    玉帝訪我有手段，即發天兵擺戰場。
    九曜惡星遭我貶，五方兇宿被吾傷。
    普天神將皆無敵，十萬雄師不敢當。
    威逼玉皇傳旨意，灌江小聖把兵揚。
    相持七十單二變，各弄精神個個強。
    南海觀音來助戰，淨瓶楊柳也相幫。
    老君又使金剛套，把我擒拿到上方。
    綁見玉皇張大帝，曹官拷較罪該當。
    即差大力開刀斬，刀砍頭皮火焰光。
    百計千方弄不死，將吾押赴老君堂。
    六丁神火爐中煉，煉得渾身硬似鋼。
    七七數完開鼎看，我身跳出又兇張。
    諸神閉戶無遮擋，眾聖商量把佛央。
    其實如來多法力，果然智慧廣無量。
    手中賭賽翻觔斗，將山壓我不能強。
    玉皇才設安天會，西域方稱極樂場。
    壓困老孫五百載，一些茶飯不曾嘗。
    金蟬長老臨凡世，東土差他拜佛鄉。
    欲取真經回上國，大唐帝主度先亡。
    觀音勸我皈依善，秉教迦持不放狂。
    解脫高山根下難，如今西去取經章。
    潑魔休弄獐狐智，還我唐僧拜法王。」
  "source_languages":
  - "zh-Hant"
  "source_locations":

- "id": "xy-ch52-023"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來聽說，將慧眼遙觀，早已知識。對行者道：「那怪物我雖知之，但不可與你說。你這猴兒口敞，一傳道是我說他，他就不與你鬥，定要嚷上靈山，反遺禍於我也。我這裡著法力助你擒他去罷。」行者再拜稱謝道：「如來助我甚麼法力？」如來即令十八尊羅漢開寶庫，取十八粒金丹砂，與悟空助力。行者道：「金丹砂卻如何？」如來道：「你去洞外，叫那妖魔比試。演他出來，卻教羅漢放砂，陷住他，使他動不得身，拔不得腳，憑你揪打便了。」行者笑道：「妙妙妙，趁早去來。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    如来は話を聞き、慧眼を遠くへ向けると、すぐに分かった。悟空に言った。
    如来「あの化け物のことは知っている。だが、お前には話せぬ。お前は口の軽い猿だ。私が話したと伝われば、あれはお前とは戦わず、きっと霊山へ怒鳴り込んできて、かえって私に災いを残す。ここから法力を貸し、捕まえる手助けをしよう。」
    悟空はもう一度拝んで礼を述べた。
    悟空「どのような法力をお貸しくださるのですか。」
    如来はただちに十八尊の羅漢へ、宝蔵を開いて十八粒の金丹砂（きんたんしゃ）を取り出し、悟空を助けるよう命じた。
    悟空「その金丹砂は、どう使うのですか。」
    如来「洞の外へ行き、妖怪に勝負を挑め。誘い出したら、羅漢に砂を放たせ、埋めてしまうのだ。身動きできず、足も抜けなくなれば、好きなだけ引きつかんで殴ればよい。」
    悟空は笑った。
    悟空「妙案です、妙案です。さっそく行きましょう。」
  "translation_status": "reviewed"
- "id": "xy-ch52-024"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那羅漢不敢遲延，即取金丹砂出門。行者又謝了如來。一路查看，止有十六尊羅漢，行者嚷道：「這是那個去處，卻賣放人。」眾羅漢道：「那個賣放？」行者道：「原差十八尊，今怎麼只得十六尊？」說不了，裡邊走出降龍、伏虎二尊，上前道：「悟空，怎麼就這等放刁？我兩個在後聽如來吩咐話的。」行者道：「忒賣法，忒賣法。才自若嚷遲了些兒，你敢就不出來了。」眾羅漢笑呵呵駕起祥雲。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    羅漢たちはぐずぐずせず、金丹砂を取り出して門を出た。悟空は如来に再び礼を述べた。道々数えてみると、羅漢は十六尊しかいない。悟空は騒ぎ立てた。
    悟空「ここをどこだと思っているんだ。人をごまかすとは何事だ。」
    羅漢たち「誰がごまかしたというのだ。」
    悟空「もとの命令は十八尊だろう。どうして十六尊しかいない。」
    言い終わらぬうちに、奥から降龍（ごうりゅう）・伏虎（ふっこ）の二尊が出てきて、前へ進んだ。
    降龍と伏虎「悟空、なぜそう言いがかりをつける。私たちは後に残り、如来のお言いつけを聞いていたのだ。」
    悟空「とんだごまかしだ、とんだごまかしだ。俺が騒ぐのが少し遅ければ、出てこないつもりだったんだろう。」
    羅漢たちは笑いながら、瑞雲に乗った。
  "translation_status": "reviewed"
- "id": "xy-ch52-025"
  "section_id": "chapter-52"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，到了金兜本作「⿰山兜」，Unicode缺字山界。那李天王見了，帥眾相迎，備言前事。羅漢道：「不必絮繁，快去叫他出來。」這大聖捻著拳頭，來於洞口，罵道：「腯潑怪物，快出來與你孫外公見個上下。」那小妖又飛跑去報。魔王怒道：「這賊猴又不知請誰來猖獗也。」小妖道：「更無甚將，止他一人。」魔王道：「那根棒子已被我收來，怎麼卻又一人到此？敢是又要走拳？」隨帶了寶貝，綽槍在手，叫小妖搬開石塊，跳出門來，罵道：「賊猴，你幾番家不得便宜，就該迴避，如何又來吆喝？」行者道：「這潑魔不識好歹！若要你外公不來，除非你服了降，陪了禮，送出我師父、師弟，我就饒你。」那怪道：「你那三個和尚已被我洗淨了，不久便要宰殺，你還不識起倒？去了罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch52-1498137"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第052回&oldid=1498137"
    "line_start": 185
    "line_end": 185
  "translation_ja": |-
    ほどなく金兜山の境へ着くと、李天王は皆を率いて出迎え、これまでのことを詳しく話した。
    羅漢たち「くどくど説明するには及ばぬ。早く行って、あれを呼び出してくれ。」
    悟空は拳を握り、洞の入口へ行って罵った。
    悟空「この太った悪党、早く出てこい。お前の祖父様、この孫様と決着をつけようじゃないか。」
    小妖がまた飛ぶように報告に走った。独角兕大王は怒った。
    独角兕大王「あの盗人猿め、今度は誰を頼んで、でかい顔をしに来たのだ。」
    小妖「ほかに将軍はおりません。一人だけです。」
    独角兕大王「あの棒はもうわしが取り上げたのに、なぜまた一人で来た。また拳で戦うつもりか。」
    宝を携え、槍を手に取ると、小妖に石をどけさせて門を跳び出した。
    独角兕大王「盗人猿、何度来ても得をせぬのだから、引き下がるべきだろう。どうしてまた怒鳴りに来た。」
    悟空「この悪党は、善し悪しが分からぬと見える。この祖父様に来てほしくないなら、降参して謝り、俺の師と弟弟子たちを送り出せ。そうすれば許してやる。」
    独角兕大王「あの三人の和尚は、もうきれいに洗ってやった。間もなく殺すところだ。まだ形勢が分からぬか。帰れ。」

    "translation_status": "draft"
  - "id": "xy-ch85-002"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說那國王早朝文武多官俱執表章啟奏道：「主公，望赦臣等失儀之罪。」國王道：「眾卿禮貌如常，有何失儀？」眾卿道：「主公啊，不知何故，臣等一夜把頭髮都沒了。」國王執了這沒頭髮之表，下龍床對群臣道：「果然不知何故，朕宮中大小人等，一夜也盡沒了頭髮。」君臣們都各汪汪滴淚道：「從此後，再不敢殺戮和尚也。」王復上龍位，眾官各立本班。王又道：「有事出班來奏，無事捲簾散朝。」只見那武班中閃出巡城總兵官，文班中走出東城兵馬使，當階叩頭道：「臣蒙聖旨巡城，夜來獲得賊臟一櫃、白馬一匹。微臣不敢擅專，請旨定奪。」國王大喜道：「連櫃取來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、国王が朝の政務に出ると、文武の臣下たちはそろって上奏文を差し出した。
      臣下たち「陛下、どうか私どもの礼を失した罪をお許しください。」
      国王「そなたたちの礼儀はいつもと変わらぬ。どこに無礼があるのだ。」
      臣下たち「陛下、どうしたことか、私どもは一夜のうちに髪がすっかりなくなってしまったのでございます。」
      国王は髪を失ったという上奏文を手に、玉座を下りて臣下たちに告げた。
      国王「まったく、わけが分からぬ。わが宮中でも、身分の上下を問わず、一夜のうちに全員の髪がなくなったのだ。」
      国王と臣下たちは、みな大粒の涙を流して言った。
      国王と臣下たち「これからは、二度とお坊さんを殺しません。」
      国王は玉座に戻り、役人たちもそれぞれの列に立った。
      国王「用のある者は列を出て申し述べよ。用がなければ簾を上げ、朝議を終える。」
      すると武官の列から巡城の総兵（そうへい）が、文官の列から東城兵馬使（とうじょうへいばし）が進み出て、階段の前で額を地につけた。
      総兵と兵馬使（へいばし）「私どもは勅命を受けて城を巡回し、昨夜、盗品の箱一つと白馬一頭を確保いたしました。独断で処分するわけには参りませんので、ご裁定を仰ぎます。」
      国王は大いに喜んだ。
      国王「箱ごとここへ持ってまいれ。」
    "translation_status": "draft"
  - "id": "xy-ch85-003"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二臣即退至本衙，點起齊整軍士，將櫃擡出。三藏在內，魂不附體道：「徒弟們，這一到國王前，如何理說？」行者笑道：「莫嚷，我已打點停當了，開櫃時，他就拜我們為師哩。只教八戒不要爭競長短。」八戒道：「但只免殺，就是無量之福，還敢爭競哩。」說不了，擡至朝外，入五鳳樓，放在丹墀之下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      二人の役人はすぐにそれぞれの役所へ引き下がり、兵士を整然と集めて、箱を担ぎ出させた。箱の中では、三蔵（さんぞう）が生きた心地もせずに言った。
      三蔵「お前たち、これから国王の前へ出されて、どう申し開きをするのだ。」
      悟空（ごくう）は笑った。
      悟空「騒がないでください。もう手は打ってあります。箱を開けたら、向こうから俺たちを師として拝みますよ。ただ、八戒（はっかい）だけはあれこれ言い争わないように。」
      八戒「殺されずに済みさえすれば、それだけで無量の幸せだ。言い争うもんか。」
      話し終わらないうちに、箱は宮殿の外まで担がれ、五鳳楼（ごほうろう）を通って、丹墀（たんち）の下に置かれた。

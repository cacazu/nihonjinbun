  - "id": "xy-ch85-022"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      碓嘴初長三尺零，獠牙觜出賽銀釘。
      一雙圓眼光如電，兩耳搧風唿唿聲。
      腦後鬃長排鐵箭，渾身皮糙癩還青。
      手中使件蹊蹺物，九齒釘鈀個個驚。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 162
        "line_end": 165
    "translation_ja": |-
      杵のような口は三尺（しゃく）余り、突き出す牙は銀の釘をしのぐ。
      一対の丸い目は稲妻のように光り、両耳は風をあおいで、ごうごうと鳴る。
      後頭部の長いたてがみは鉄の矢を並べたよう、体じゅうの皮はざらつき、かさぶただらけで青黒い。
      手に操る奇妙な品、九歯釘鈀（きゅうしていは）には、誰もが肝をつぶす。
    "translation_status": "draft"
  - "id": "xy-ch85-023"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "妖精硬著膽喝道：「你是那裡來的？叫甚名字？快早說來，饒你性命。」八戒笑道：「我的兒，你是也不認得你豬祖宗哩。上前來，說與你聽："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      妖怪の頭目は気を奮い立たせ、怒鳴った。
      妖怪の頭目「どこから来た。名は何という。さっさと答えれば、命は助けてやる。」
      八戒は笑った。
      八戒「この小僧、豬（ちょ）のご先祖さまが誰だか分からんのか。近くへ来い。聞かせてやろう。」
    "translation_status": "draft"
  - "id": "xy-ch85-024"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      巨口獠牙神力大，玉皇陞我天蓬帥。
      掌管天河八萬兵，天宮快樂多自在。
      只因酒醉戲宮娥，那時就把英雄賣。
      一嘴拱倒斗牛宮，吃了王母靈芝菜。
      玉皇親打二千鎚，把吾貶下三天界。
      教吾立志養元神，下方卻又為妖怪。
      正在高莊喜結親，命低撞著孫兄在。
      金箍棒下受他降，低頭才把沙門拜。
      背馬挑包做夯工，前生少了唐僧債。
      鐵腳天蓬本姓豬，法名喚作豬八戒。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 168
        "line_end": 177
    "translation_ja": |-
      八戒「大きな口に鋭い牙、神の力も並ではない。
      玉皇（ぎょくこう）は俺を、天蓬元帥（てんぽうげんすい）に取り立てた。
      天河（てんが）の八万の兵を取り仕切り、天宮では楽しく気ままに暮らしたものさ。
      ただ、酔って宮女にちょっかいを出したため、その時、英雄の身をしくじった。
      口で一突き、斗牛宮（とぎゅうきゅう）を倒し、王母（おうぼ）の霊芝（れいし）料理を食ってしまった。
      玉皇は自ら二千回、鎚で俺を打ち、三天（さんてん）の世界から下へ落とした。
      志を定めて元神（げんしん）を養えというのに、下界ではまた妖怪となった。
      高荘（こうそう）でめでたく嫁を迎えようとした時、運が悪くて孫（そん）の兄貴に出くわした。
      金箍棒（きんこぼう）のもとに降伏し、頭を垂れて仏門へ入ったのさ。
      馬に鞍を置き、荷物を担ぐ重労働。前世で唐僧（とうそう）に借りがあったに違いない。
      鉄の脚を持つ天蓬（てんぽう）、もとの姓は豬。
      法名を豬八戒（ちょはっかい）というのが、この俺だ。」
    "translation_status": "draft"
  - "id": "xy-ch85-025"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精聞言，喝道：「你原來是唐僧的徒弟。我一向聞得唐僧的肉好吃，正要拿你哩，你卻撞得來，我肯饒你？不要走，看杵。」八戒道：「孽畜，你原來是個染博士出身。」妖精道：「我怎麼是染博士？」八戒道：「不是染博士，怎麼會使棒槌？」那怪那容分說，近前亂打。他兩個在山凹裡，這一場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 179
        "line_end": 179
    "translation_ja": |-
      妖怪の頭目はそれを聞いて叫んだ。
      妖怪の頭目「なんだ、唐僧の弟子だったのか。唐僧の肉はうまいと、前々から聞いていた。お前を捕らえようと思っていたところへ、向こうから来たわけだ。逃がしてやるものか。動くな、この杵を受けろ！」
      八戒「この畜生、お前は染め物職人あがりだったのか。」
      妖怪の頭目「どうしてわしが染め物職人なのだ。」
      八戒「そうでなけりゃ、なんで布を叩く棒槌なんぞ使うんだ。」
      頭目はそれ以上言わせず、歩み寄ってやたらと打ちかかった。二人は山のくぼみで、すさまじい戦いを繰り広げた。
    "translation_status": "draft"
  - "id": "xy-ch85-026"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": "九齒釘鈀，一條鐵杵。鈀丟解數滾狂風，杵運機謀飛驟雨。一個是無名惡怪阻山程，一個是有罪天蓬扶性主。性正何愁怪與魔，山高不得金生土。那個杵架猶如蟒出潭，這個鈀來卻似龍離浦。喊聲咤吒振山川，吆喝雄威驚地府。兩個英雄各逞能，捨身卻把神通賭。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 181
        "line_end": 181
    "translation_ja": |-
      九歯釘鈀と、一本の鉄杵。
      釘鈀は技を繰り出して荒れ狂う風を巻き起こし、鉄杵は策を運んで激しい雨のように飛ぶ。
      一方は山道を遮る名もない悪い怪物、一方は罪ある天蓬、心の主を助ける者。
      心が正しければ、妖魔の何を恐れよう。山が高く、金が土を生むこともかなわぬ。
      あちらの杵の受けは、淵から出る大蛇のよう。こちらの釘鈀の攻めは、入り江を離れる竜のよう。
      叫び声が山川を揺さぶり、威勢よい怒声は冥府をも驚かす。
      二人の勇者はそれぞれ腕を振るい、身を捨てて神通力を競う。
    "translation_status": "draft"
  - "id": "xy-ch85-027"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒長起威風，與妖精廝鬥，那怪喝令小妖把八戒一齊圍住不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 183
        "line_end": 183
    "translation_ja": "八戒は勢いを増し、妖怪の頭目と死闘を続けた。頭目は小妖たちに、いっせいに八戒を取り囲めと怒鳴った。ひとまず、こちらの話は置いておこう。"
    "translation_status": "draft"
  - "id": "xy-ch85-028"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者在唐僧背後，忽失聲冷笑。沙僧道：「哥哥冷笑，何也？」行者道：「豬八戒真個獃呀，聽見說齋僧，就被我哄去了。這早晚還不見回來：若是一頓鈀打退妖精，你看他得勝而回，爭嚷功果；若戰他不過，被他拿去，卻是我的晦氣，背前面後，不知罵了多少弼馬溫哩。悟淨，你休言語，等我去看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 184
        "line_end": 184
    "translation_ja": |-
      さて、悟空は三蔵の後ろで、思わず声を漏らし、せせら笑った。
      沙悟浄「兄さん、なぜそんなふうに笑うんですか。」
      悟空「八戒は本当に間抜けだな。坊さんに飯を出すと聞いたばかりに、俺にだまされて出かけたんだ。こんなにたっても戻ってこない。もし釘鈀で妖怪を追い払ったなら、得意になって帰ってきて、手柄だ手柄だと騒ぎ立てるだろう。勝てずに捕まったのなら、今度は俺がついていない。面と向かっても陰でも、弼馬温と何度悪口を言われることか。悟浄（ごじょう）、黙っていてくれ。俺が見てこよう。」
    "translation_status": "draft"
  - "id": "xy-ch85-029"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，他也不使長老知道，悄悄的腦後拔了一根毫毛，吹口仙氣，叫：「變！」即變做本身模樣，陪著沙僧，隨著長老。他的真身出個神，跳在空中觀看，但見那獃子被怪圍繞，釘鈀勢亂，漸漸的難敵。行者忍不住，按落雲頭，厲聲高叫道：「八戒不要忙，老孫來了。」那獃子聽得是行者聲音，仗著勢，愈長威風，一頓鈀，向前亂築。那妖精抵敵不住，道：「這和尚先前不濟，這會子怎麼又發起狠來？」八戒道：「我的兒，不可欺負我，我家裡人來也。」一發向前，沒頭沒臉築去。那妖精委架不住，領群妖敗陣去了。行者見妖精敗去，他就不曾近前，撥轉雲頭，徑回本處，把毫毛一抖，收上身來。長老的肉眼凡胎，那裡認得。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 186
        "line_end": 186
    "translation_ja": |-
      悟空は三蔵に気づかれないよう、そっと後頭部の毛を一本抜き、仙気（せんき）を吹きかけた。
      悟空「変われ！」
      毛はすぐに悟空そっくりの姿になり、沙悟浄と並んで三蔵に付き添った。本物の悟空は神通力を働かせて空へ跳び上がり、見下ろした。八戒は妖怪たちに囲まれ、釘鈀の動きも乱れて、次第に持ちこたえられなくなっている。悟空はたまらず雲を下げ、鋭い声で呼びかけた。
      悟空「八戒、慌てるな。俺が来たぞ！」
      悟空の声だと聞き取ると、八戒はその威勢を頼みに、ますます勇み立った。釘鈀を振るい、前へめった突きにする。妖怪の頭目は受けきれなくなった。
      妖怪の頭目「さっきまでは頼りなかったこの坊主が、どうして今になって、またこんなに猛りだしたのだ。」
      八戒「小僧、俺を甘く見るなよ。身内が来たんだ！」
      八戒はいっそう前へ出て、頭も顔も構わず突きまくった。頭目はとうとう支えきれず、小妖たちを連れて敗走した。それを見ると、悟空は敵のそばへ近づきもしないまま雲を返し、まっすぐ元の場所へ戻った。毛をひと振りして体へ戻す。三蔵のように肉眼しか持たない生身の人間には、見抜けるはずもなかった。
    "translation_status": "draft"
  - "id": "xy-ch85-030"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不一時，獃子得勝，也自轉來，累得那粘涎鼻涕，白沫生生。氣呼呼的走將來，叫聲：「師父。」長老見了，驚訝道：「八戒，你去打馬草的，怎麼這般狼狽回來？想是山上人家有人看護，不容你打草麼？」獃子放下鈀，搥胸跌腳道：「師父，莫要問，說起來就活活羞殺人。」長老道：「為甚麼羞來？」八戒道：「師兄捉弄我。他先頭說風霧裡不是妖精，沒甚兇兆，是一莊村人家好善，蒸白米乾飯、白麵饝饝齋僧的。我就當真，想著肚內饑了，先去乞些兒，假倚打草為名；豈知若干妖怪，把我圍了，苦戰了這一會，若不是師兄的哭喪棒相助，我也莫想得脫羅網回來也。」行者在傍笑道：「這獃子胡說。你若做了賊，就攀上一牢人。是我在這裡看著師父，何曾側離？」長老道：「是啊，悟空不曾離我。」那獃子跳著嚷道：「師父，你不曉得，他有替身。」長老道：「悟空，端的可有怪麼？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 187
        "line_end": 187
    "translation_ja": |-
      やがて、勝った八戒も戻ってきた。疲れ果て、よだれと鼻水を垂らし、白い泡まで吹いている。息を切らして歩いてきて、呼びかけた。
      八戒「お師匠さま！」
      三蔵はその姿に驚いた。
      三蔵「八戒、馬の草を刈りに行ったのに、どうしてそんなひどい姿で帰ってきたのだ。山の家に番人でもいて、草を刈らせてもらえなかったのか。」
      八戒は釘鈀を下ろし、胸を叩き、地団駄を踏んだ。
      八戒「お師匠さま、聞かないでください。話すだけでも、恥ずかしくて死にそうだ。」
      三蔵「何がそんなに恥ずかしいのだ。」
      八戒「兄貴が俺をからかったんです。さっき、風と霧の中に妖怪はいない、不吉なしるしでもない、善行好きな村人が白米のご飯と白い小麦粉の饅頭を蒸して坊さんに振る舞っている、と言ったでしょう。俺は本気にして、腹も減っていたから、草刈りを口実に先に少しもらおうと思ったんです。ところが妖怪どもに囲まれて、この間ずっと苦しい戦いでした。兄貴の哭喪棒（こくそうぼう）が助けてくれなければ、囲みを破って帰ってくることなど、できなかったでしょう。」
      悟空はそばで笑った。
      悟空「こいつはでたらめを言っている。お前が泥棒になったら、牢一つ分の人間を道連れにしそうだな。俺はここでお師匠さまを守っていたんだ。いつそばを離れたというんだ。」
      三蔵「そのとおりだ。悟空は私から離れなかった。」
      八戒は跳びはねて叫んだ。
      八戒「お師匠さまはご存じないんです。こいつには身代わりがあるんですよ！」
      三蔵「悟空、本当に妖怪がいるのか。」
    "translation_status": "draft"
  - "id": "xy-ch85-031"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者瞞不過，躬身笑道：「是有個把小妖兒，他不敢惹我們。──八戒，你過來，一發照顧你照顧。我們既保師父，走過險峻山路，就似行軍的一般。」八戒道：「行軍便怎的？」行者道：「你做個開路將軍，在前剖路。那妖精不來便罷，若來時，你與他賭鬥，打倒妖精，算你的功果。」八戒量著那妖精手段與他差不多，卻說：「我就死在他手內也罷，等我先走。」行者笑道：「這獃子先說晦氣話，怎麼得長進？」八戒道：「哥哥，你知道：公子登筵，不醉即飽；壯士臨陣，不死帶傷。先說句錯話兒，後便有威風。」行者歡喜，即忙背了馬，請師父騎上，沙僧挑著行李，相隨八戒，一路入山不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 188
        "line_end": 188
    "translation_ja": |-
      悟空もごまかしきれず、身をかがめて笑った。
      悟空「小妖が一匹か二匹はいますが、俺たちに手出しする勇気はありませんよ。おい八戒、こっちへ来い。ついでにもう一つ、世話をしてやろう。お師匠さまをお守りして険しい山道を行くのは、軍隊の行軍と同じことだ。」
      八戒「行軍なら、どうだというんだ。」
      悟空「お前が道を開く将軍になり、先頭で進路を切り開け。妖怪が来なければそれでよし。来たらお前が戦い、倒したらお前の手柄にする。」
      八戒は、あの妖怪の腕前なら自分とさして違わないと見積もって言った。
      八戒「あいつの手で死んだって構わんさ。俺が先に行こう。」
      悟空は笑った。
      悟空「始める前から縁起でもないことを言って、それでどうして強くなれるんだ。」
      八戒「兄貴、知っているだろう。『お坊ちゃんが宴に上がれば、酔わなければ腹がいっぱいになる。つわものが戦に臨めば、死ななければ傷を負う』ってね。先にちょっと悪いことを口にしておけば、あとで威勢が出るのさ。」
      悟空は喜び、急いで馬に鞍を置き、三蔵を乗せた。沙悟浄は荷物を担ぎ、八戒の後を追って、一行は山の中へ進んだ。ひとまず、こちらの話は置いておこう。
    "translation_status": "draft"
  - "id": "xy-ch85-032"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖精帥幾個敗殘的小妖徑回本洞，高坐在那石崖上，默默無言。洞中還有許多看家的小妖，都上前問道：「大王常時出去，喜喜歡歡回來，今日如何煩惱？」老妖道：「小的們，我往常出洞巡山，不管那裡的人與獸，定撈幾個來家，養贍汝等。今日造化低，撞見一個對頭。」小妖問：「是那個對頭？」老妖道：「是一個和尚，乃東土唐僧取經的徒弟，名喚豬八戒。我被他一頓釘鈀，把我築得敗下陣來。好惱啊！我這一向，常聞得人說，唐僧乃十世修行的羅漢，有人吃他一塊肉，可以延壽長生。不期他今日到我山裡，正好拿住他蒸吃，不知他手下有這等徒弟。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 189
        "line_end": 189
    "translation_ja": |-
      さて、妖怪の頭目は、敗走してきた数匹の小妖を連れ、まっすぐ自分の洞へ戻った。高い岩の上に腰を下ろし、黙り込んでいる。洞にはまだ大勢の留守番の小妖たちがいて、みな前へ出て尋ねた。
      留守番の小妖たち「大王はいつも、お出かけになると機嫌よく戻られますのに、今日はなぜお悩みなのですか。」
      妖怪の頭目「お前たち、いつもなら洞を出て山を巡り、人間でも獣でも、必ず何匹か捕まえて帰り、お前たちを養ってきた。今日は運が悪く、手強い敵に出くわしたのだ。」
      小妖たち「その敵とは、誰ですか。」
      妖怪の頭目「坊主だ。東土（とうど）から経を取りに行く唐僧の弟子で、豬八戒という。釘鈀で立て続けに突かれ、わしは敗走した。実に腹が立つ！　前々から、唐僧は十世にわたって修行した羅漢（らかん）で、肉を一切れ食えば寿命が延び、長生きできると聞いていた。その男が今日、思いがけずわが山へ来た。捕まえて蒸して食うには、ちょうどよいところだったのに、あんな弟子を連れていたとは知らなかった。」
    "translation_status": "draft"
  - "id": "xy-ch85-033"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，班部叢中閃上一個小妖，對老妖哽哽咽咽哭了三聲，又嘻嘻哈哈的笑了三聲。老妖喝道：「你又哭又笑，何也？」小妖跪下道：「大王才說要吃唐僧，唐僧的肉不中吃。」老妖道：「人都說吃他一塊肉可以長生不老，與天同壽，怎麼說他不中吃？」小妖道：「若是中吃，也到不得這裡，別處妖精也都吃了。他手下有三個徒弟哩。」老妖道：「你知那三個？」小妖道：「他大徒弟是孫行者，三徒弟是沙和尚，這個是他二徒弟豬八戒。」老妖道：「沙和尚比豬八戒如何？」小妖道：「也差不多兒。」「那個孫行者比他如何？」小妖吐舌道：「不敢說。那孫行者神通廣大，變化多端。他五百年前曾大鬧天宮，上方二十八宿、九曜星官、十二元辰、五卿四相、東西星斗、南北二神、五嶽四瀆、普天神將，也不曾惹得他過，你怎敢要吃唐僧？」老妖道：「你怎麼知得他這等詳細？」小妖道：「我當初在獅駝嶺獅駝洞與那大王居住，那大王不知好歹，要吃唐僧，被孫行者使一條金箍棒，打進門來，可憐就打得犯了骨牌名，都『斷么絕六』。還虧我有些見識，從後門走了，來到此處，蒙大王收留。故此知他手段。」老妖聽言，大驚失色。這正是「大將軍怕讖語」。他聞得自家人這等說，安得不驚。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 190
        "line_end": 190
    "translation_ja": |-
      話が終わらないうちに、居並ぶ者の中から一匹の小妖が進み出た。頭目に向かって、ひっくひっくと三声泣き、次には、ひっひっはっはっと三声笑った。
      妖怪の頭目「泣いたり笑ったり、どういうつもりだ。」
      泣き笑いする小妖はひざまずいた。
      泣き笑いする小妖「大王は今、唐僧を食べたいとおっしゃいましたが、唐僧の肉は、とても食べられるものではありません。」
      妖怪の頭目「誰もが、肉を一切れ食えば不老長生、天と同じ寿命になると言っている。どうして食べられぬと言うのだ。」
      泣き笑いする小妖「もし食べられるようなものなら、ここまでは来られません。よその妖怪に、とっくに食われています。あの者には、三人の弟子がいるのです。」
      妖怪の頭目「その三人を知っているのか。」
      泣き笑いする小妖「一番弟子は孫行者（そんぎょうじゃ）、三番弟子は沙和尚（さおしょう）、今のが二番弟子の豬八戒です。」
      妖怪の頭目「沙和尚は豬八戒に比べてどうなのだ。」
      泣き笑いする小妖「だいたい同じくらいです。」
      妖怪の頭目「では、その孫行者はどうだ。」
      小妖は舌を出した。
      泣き笑いする小妖「恐ろしくて言えません。あの孫行者は神通力が広大で、変化は底知れません。五百年前には天宮で大暴れし、天上の二十八宿（にじゅうはっしゅく）、九曜星官（くようせいかん）、十二元辰（じゅうにげんしん）、五卿四相（ごけいししょう）、東西の星斗（せいと）、南北の二神（なんぼくのにしん）、五岳四瀆（ごがくしとく）、天じゅうの神将も、相手にできなかったほどです。それなのに、どうして唐僧を食おうなどとなさるのですか。」
      妖怪の頭目「どうしてお前は、そんなに詳しく知っているのだ。」
      泣き笑いする小妖「私は以前、獅駝嶺（しだれい）の獅駝洞（しだどう）で、あそこの大王と暮らしていました。あの大王も身のほどを知らず、唐僧を食べようとして、孫行者に金箍棒一本で門の中へ攻め込まれました。哀れなことに、打ちのめされて、骨牌（こっぱい）の名そのまま、『断么絶六（だんようぜつろく）』、すっかり絶え果てる始末です。私は少し心得があり、裏門から逃げてここへ来て、大王に拾っていただきました。ですから、あの者の手強さを知っているのです。」
      頭目はこれを聞いて、顔色を変えるほど驚いた。まさに「大将軍も不吉な予言を恐れる」ということだ。身内からこんな話を聞かされて、驚かずにいられようか。
    "translation_status": "draft"
  - "id": "xy-ch85-034"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正都在悚懼之際，又一個小妖上前道：「大王莫惱，莫怕。常言道：『事從緩來。』若是要吃唐僧，等我定個計策拿他。」老妖道：「你有何計？」小妖道：「我有個分瓣梅花計。」老妖道：「怎麼叫做『分瓣梅花計』？」小妖道：「如今把洞口大小群妖點將起來，千中選百，百中選十，十中只選三個。須是有能幹，會變化的，都變做大王的模樣，頂大王之盔，貫大王之甲，執大王之杵，三處埋伏。先著一個戰豬八戒，再著一個戰孫行者，再著一個戰沙和尚：捨著三個小妖，調開他弟兄三個。大王卻在半空伸下拿雲手，去捉這唐僧，就如探囊取物，就如魚水盆內捻蒼蠅，有何難哉？」老妖聞此言，滿心歡喜道：「此計絕妙，絕妙！這一去，拿不得唐僧便罷；若是拿了唐僧，決不輕你，就封你做個前部先鋒。」小妖叩頭謝恩，叫點妖怪。即將洞中大小妖精點起，果然選出三個有能的小妖，俱變做老妖，各執鐵杵，埋伏等待唐僧不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 191
        "line_end": 191
    "translation_ja": |-
      一同がおびえていると、別の小妖が進み出た。
      策を出す小妖「大王、ご心配も恐れも無用です。ことわざにも、『事はゆっくり運べ』と申します。唐僧を食べたいのでしたら、私が策を立てて捕らえましょう。」
      妖怪の頭目「どんな策がある。」
      策を出す小妖「分瓣梅花の計（ぶんべんばいかのけい）という策です。」
      妖怪の頭目「分瓣梅花の計とは、何だ。」
      策を出す小妖「今から洞の大小の妖怪を点呼して集め、千から百、百から十、十からわずか三匹を選びます。腕があり、変化のできる者を選ぶのです。三匹とも大王の姿になり、大王の兜をかぶり、大王の鎧を着て、大王の杵を持って、三か所に隠れます。まず一匹を豬八戒に当て、次の一匹を孫行者に、もう一匹を沙和尚に当てます。小妖三匹を犠牲にするつもりで、あの三人兄弟をおびき離すのです。大王は空中から、雲をつかむほどの手を伸ばし、唐僧を捕らえてください。袋に手を入れて物を取るようなもの、魚を入れた水鉢で蠅をつまむようなものです。何も難しいことはありません。」
      これを聞くと、頭目は心の底から喜んだ。
      妖怪の頭目「見事な策だ、見事な策だ！　この手で唐僧が捕らえられなければ、それまでだ。だが捕らえられたなら、決してお前を粗末には扱わぬ。前部の先鋒に任じてやろう。」
      小妖は額を地につけて礼を言い、妖怪たちを集めるよう呼ばわった。さっそく洞中の大小の妖怪が集められ、果たして腕のある小妖三匹が選ばれた。三匹とも頭目の姿に変わり、それぞれ鉄杵を手に、唐僧を待ち伏せした。ひとまず、この話は置いておこう。
    "translation_status": "draft"
  - "id": "xy-ch85-035"
    "section_id": "chapter-85"

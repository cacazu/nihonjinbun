    "source_text": "且不言三藏身遭困苦。卻說孫行者在草坡下戰退小妖，急回來路傍邊，不見了師父，止存白馬、行囊。慌得他牽馬挑擔，向山頭找尋。咦！正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 199
        "line_end": 199
    "translation_ja": "三蔵が苦難に遭っている話は、ひとまず置こう。悟空は草の斜面の下で小妖を追い払い、急いで道端へ戻った。だが三蔵の姿はなく、白馬と荷物だけが残っていた。慌てた悟空は馬を引き、荷物を担いで、山の上を探し回った。ああ、まさにこういうことである。"
    "translation_status": "draft"
  - "id": "xy-ch85-041"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": "有難的江流專遇難，降魔的大聖亦遭魔。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 201
        "line_end": 201
    "translation_ja": |-
      苦難を背負う江流には、苦難ばかりが訪れ、
      魔を降す大聖（たいせい）もまた、魔の手に遭う。
    "translation_status": "draft"
  - "id": "xy-ch85-042"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知尋找師父下落如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 203
        "line_end": 203
    "translation_ja": "さて、師を捜して、その行方を突き止められるのか。続きは次回で。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-01-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「心猿」は悟空、「木母」は八戒を指す、心と五行を重ねた呼び名。「禅」は禅を修める三蔵をいう。「計吞」は食べるために策を巡らすことであり、回題だけで食われた結果を述べているのではない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-02-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「滅法国」は仏法を滅ぼす国、「欽法国」は仏法を敬う国という文字の対照。国が別の場所へ移ったのではなく、同じ国の改名である。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-03-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は悟空を生来の豪傑として「暗算計人」を知らないと評する。ここでは、上空から不意打ちで殺して名を落とすことを嫌う文脈のまま訳し、語り手の評価を訂正しない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-04-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「上大人」は子供が字を習うためのごく初歩的な手本の文句。経典ではない。語義は教育部『重編国語辞典修訂本』の同項を確認した。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-05-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "八戒が自分の前歴を歌って名乗る韻文。斗牛宮を口で倒すこと、王母の霊芝料理、玉皇自身による二千回の鎚打ちなども、すべて本人の語りとして保持した。他の回の前歴や刑罰の記述へ合わせて改めていない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-06-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「山高不得金生土」。五行を重ねた句だが、通常の相生の順序に直して「土が金を生む」とはしない。「山が高く、金が土を生むこともかなわない」と字面を保った。金・土の個別の象徴と構文の詳しい解釈は確定していない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-07-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "八戒は悟空の棒が助けたと話すが、先の語りでは悟空が声をかけ、敵には近づかないまま戻っている。八戒の発言を実際の打撃へ置き換えず、語りと発言の違いを残した。「哭喪棒」は金箍棒への悪口めいた呼び名。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-08-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この問いの直前には、底本に話者を示す語がない。頭目が沙和尚と八戒を比べて尋ね、小妖が答えたという直前の流れから、頭目の続く問いとして訳した。原文欄へ話者語は補っていない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-09-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "天界の神々の全列挙を保った。「五卿四相」は文字どおり五卿と四相の神々を指す呼称として残すが、各員の具体名や他の神の集団との同一性は確定しない。列挙と悟空の強さは小妖の説明である。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-10-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文が骨牌の名だと明示する「斷么絕六」は、一の目がなく六の目も絶えるという字面を、すっかり打ち滅ぼされたという言葉に掛けたものとして訳した。牌の組合せの細則は未確認。獅駝洞での出来事は小妖の報告として保ち、語り手が全滅を再認定したことにはしない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-11-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「魚水盆內捻蒼蠅」。直前の袋から物を取る譬えとともに、たやすさを表す。魚を入れた水鉢の中で蠅をつまむという字面を残したが、「魚水盆」の具体的な器や表記の妥当性は確定していない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-12-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "木こりの「前日」と「今已三日」は、一昨日から数えて今日で三日という話として訳した。三蔵の滞在がすでに三日たったという意味ではない。"
    "translation_status": "draft"
  - "id": "xy-ch85-note-13-body"
    "section_id": "chapter-85"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三蔵は最初、木こりの死には他への気がかりがないと考えたが、木こりが八十三歳の母を一人で養う事情を語り、その後で両者の責務を重ねている。木こりの家族がいないという語り手の説明にはしない。"
    "translation_status": "draft"

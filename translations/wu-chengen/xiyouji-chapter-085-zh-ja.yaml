    "source_text": "禪性遭魔難正果，江流又遇苦災星。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 194
        "line_end": 194
    "translation_ja": |-
      禅の心は魔に遭い、悟りの実を結ぶことも難しく、
      江流（こうりゅう）はまたしても、苦しい災いの星に出会った。
    "translation_status": "draft"
  - "id": "xy-ch85-037"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老妖按下風頭，把唐僧拿到洞裡，叫：「先鋒。」那定計的小妖上前跪倒，口中道：「不敢，不敢。」老妖道：「何出此言？大將軍一言既出，如白染皂。當時說拿不得唐僧便罷，拿了唐僧，封你為前部先鋒。今日你果妙計成功，豈可失信於你？你可把唐僧拿來，著小的們挑水刷鍋，搬柴燒火，把他蒸一蒸。我和你都吃他一塊肉，以圖延壽長生也。」先鋒道：「大王，且不可吃。」老怪道：「既拿來，怎麼不可吃？」先鋒道：「大王吃了他不打緊，豬八戒也做得人情，沙和尚也做得人情，但恐孫行者那主子刮毒。他若曉得是我們吃了，他也不來和我們廝打，他只把那金箍棒往山腰裡一搠，搠個窟窿，連山都掬倒了，我們安身之處也無之矣。」老怪道：「先鋒，憑你有何高見？」先鋒道：「依著我，把唐僧送在後園，綁在樹上，兩三日不要與他飯吃：一則圖他裡面乾淨；二則等他三人不來門前尋找，打聽得他們回去了，我們卻把他拿出來，自自在在的受用，卻不是好？」老怪笑道：「正是，正是，先鋒說得有理。」一聲號令，把唐僧拿入後園，一條繩綁在樹上，眾小妖都去前面聽候。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 195
        "line_end": 195
    "translation_ja": |-
      頭目は風を操って降り、三蔵を洞へ連れ込むと、呼んだ。
      妖怪の頭目「先鋒！」
      策を立てた小妖が前へ出てひざまずいた。
      策を出す小妖「とんでもない、もったいないことでございます。」
      妖怪の頭目「なぜそんなことを言う。大将軍が一度口にした言葉は、白を黒に染めたように、元へは戻らぬ。あの時、唐僧が捕らえられなければそれまでだが、捕らえたらお前を前部の先鋒にすると言った。今日、お前の妙計は本当に成功したのだ。どうしてお前との約束を破れよう。唐僧を引き出し、小さい者たちに水を運ばせ、鍋を洗わせ、薪を運ばせ、火を焚かせて、ひと蒸ししろ。わしもお前も肉を一切れずつ食い、寿命を延ばして長生きしようではないか。」
      先鋒「大王、まだ食べてはなりません。」
      妖怪の頭目「もう捕らえてきたのに、なぜ食べてはいけない。」
      先鋒「大王が食べてしまうこと自体は大したことではありません。豬八戒なら大目に見るでしょうし、沙和尚も見逃すでしょう。しかし、孫行者という奴だけは、ひどくたちが悪いのが心配です。私どもが食ったと知れば、わざわざ戦いになど来ません。金箍棒を山腹へ突き立てて穴を開け、山ごとひっくり返してしまうでしょう。そうなれば、私どもには身を寄せる所もなくなります。」
      妖怪の頭目「先鋒、では、お前にはどんなよい考えがある。」
      先鋒「私にお任せいただけるなら、唐僧を裏庭へ運び、木に縛りつけ、二、三日、飯を与えずにおきましょう。一つには、腹の中をきれいにするためです。もう一つには、弟子の三人が洞の入り口へ探しに来ないのを見届け、帰ってしまったと確かめるためです。そのあとで引き出し、ゆっくり気ままに味わえば、よいではありませんか。」
      頭目は笑った。
      妖怪の頭目「そうだ、そのとおりだ。先鋒の言うことはもっともだ。」
      一声命じると、三蔵は裏庭へ連れていかれ、一本の縄で木に縛りつけられた。小妖たちはみな、前のほうへ戻り、命令を待った。
    "translation_status": "draft"
  - "id": "xy-ch85-038"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看那長老苦捱著繩纏索綁，緊縛牢拴，止不住腮邊流淚，叫道：「徒弟呀，你們在那山中擒怪，甚路裡趕妖？我被潑魔捉來，此處受災，何日相會？痛殺我也！」正自兩淚交流，只見對面樹上有人叫道：「長老，你也進來了？」長老正了性道：「你是何人？」那人道：「我是本山中的樵子，被那山主前日拿來，綁在此間，今已三日，算計要吃我哩。」長老滴淚道：「樵夫啊，你死只是一身，無甚掛礙，我卻死得不甚乾淨。」樵子道：「長老，你是個出家人，上無父母，下無妻子，死便死了，有甚麼不乾淨？」長老道：「我本是東土往西天取經去的，奉唐朝太宗皇帝御旨拜活佛，取真經，要超度那幽冥無主的孤魂。今若喪了性命，可不盼殺那君王，孤負那臣子？那枉死城中，無限的冤魂，卻不大失所望，永世不得超生，一場功果，盡化作風塵，這卻怎麼得乾淨也？」樵子聞言，眼中墮淚道：「長老，你死也只如此，我死又更傷情。我自幼失父，與母鰥居，更無家業，止靠著打柴為生。老母今年八十三歲，只我一人奉養。倘若身喪，誰與他埋屍送老？苦哉，苦哉！痛殺我也。」長老聞言，放聲大哭道：「可憐，可憐！山人尚有思親意，空教貧僧會念經。事君事親，皆同一理；你為親恩，我為君恩。」正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 196
        "line_end": 196
    "translation_ja": |-
      三蔵は、縄が幾重にも巻きつき、きつく結わえられた苦しさに耐えていた。頬を流れる涙を止められず、叫んだ。
      三蔵「弟子たちよ。お前たちは山の中で怪物と戦い、どの道で妖怪を追っているのだ。私はひどい魔物に捕らえられ、ここで苦しんでいる。いつまた会えるのだろう。ああ、つらくてたまらない！」
      両目から涙を流していると、向かいの木のところにいる人が声をかけてきた。
      木のところの人「長老、あなたもここへ入れられたのですか。」
      三蔵は気を取り直した。
      三蔵「あなたはどなたですか。」
      木のところの人「私は、この山の木こりです。一昨日、この山の主に捕まり、ここへ縛られて、今日でもう三日になります。私を食べるつもりなのです。」
      三蔵は涙を流した。
      三蔵「木こり殿、あなたが死ぬのは、ただあなた一人のことで、さほど気にかかるものもないだろう。だが私の死は、そんなにすっきりしたものではないのです。」
      木こり「長老は出家の身です。上には父母もなく、下には妻子もない。死ぬなら死ぬだけで、何がすっきりしないのですか。」
      三蔵「私はもともと、東土から西天（さいてん）へ経を取りに行くところなのです。唐の太宗皇帝（たいそうこうてい）の勅命を受け、生きておられる仏を拝み、真の経をいただいて、冥界で弔う者もない孤独な魂を救おうとしています。今ここで命を失えば、待ち焦がれておられる君王をどれほど苦しめ、臣下たちの期待をどれほど裏切ることか。枉死城（おうしじょう）にいる、数限りない無念の魂も、望みを失い、永遠に救われなくなってしまいます。積み重ねた功徳も、すべて風に舞う塵と化す。それでどうして、すっきり死ねましょう。」
      木こりはこれを聞き、涙を落とした。
      木こり「長老の死にもそれだけの事情はありますが、私が死ぬのは、なおさら悲しいのです。私は幼くして父を失い、母と二人、連れ合いもなく暮らしてきました。家の財産も何もなく、ただ薪を採って生計を立てています。母は今年八十三歳で、養うのは私一人です。もし私が死んだら、誰が母の最期を世話し、亡骸を葬ってくれるでしょう。ああ、つらい、つらい！　悲しくてたまりません。」
      三蔵はそれを聞くと、声を上げて泣いた。
      三蔵「ああ、気の毒に、気の毒に！　山の人にも親を思う心があるのに、この僧はただ経を読めるだけだった。君に仕えることも、親に仕えることも、理は同じ。あなたは親の恩のため、私は君の恩のためなのですね。」
      まさしく、こういうことである。
    "translation_status": "draft"

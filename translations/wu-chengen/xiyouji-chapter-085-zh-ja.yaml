    "origin": "source"
    "source_text": "卻說這唐長老無慮無憂，相隨八戒上大路。行夠多時，只見那路傍邊撲落的一聲響喨，跳出一個小妖，奔向前邊，要捉長老。孫行者叫道：「八戒，妖精來了，何不動手？」那獃子不認真假，掣釘鈀趕上亂築。那妖精使鐵杵就架相迎。他兩個一往一來的在山坡下正然賭鬥，又見那草科裡響一聲，又跳出個怪來，就奔唐僧。行者道：「師父，不好了，八戒的眼拙，放那妖精來拿你，且等老孫打他去。」急掣棒迎上前喝道：「那裡去？看棒。」那妖精更不打話，舉杵來迎他。兩個在草坡下一撞一衝，正相持處，又聽得山背後呼的風響，又跳出個妖精來，徑奔唐僧。沙僧見了，大驚道：「師父，大哥與二哥的眼都花了，把妖精放將來拿你了。你坐在馬上，等老沙拿他去。」這和尚也不分好歹，即掣杖，對面擋住那妖精鐵杵，恨苦相持，吆吆喝喝，亂嚷亂鬥，漸漸的調遠。那老怪在半空中見唐僧獨坐馬上，伸下五爪鋼鉤，把唐僧一把撾住。那師父丟了馬，脫了鐙，被妖精一陣風徑攝去了。可憐！這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 192
        "line_end": 192
    "translation_ja": |-
      三蔵は心配も憂いもなく、八戒に続いて大道を進んでいた。ずいぶん歩いたころ、道端でばさりと大きな音がし、一匹の小妖が飛び出して、三蔵を捕らえようと前へ走ってきた。悟空が叫んだ。
      悟空「八戒、妖怪が来たぞ。なぜ戦わん！」
      八戒は本物か偽物かも分からず、釘鈀を抜いて追いかけ、やたらと突きかかった。小妖は鉄杵で受け止めた。二人が山の斜面の下で、打ち合い、引き合い、戦っていると、今度は草むらで音がし、もう一匹の妖怪が飛び出して、まっすぐ三蔵へ向かった。
      悟空「お師匠さま、大変だ。八戒は目が節穴で、妖怪を通してしまった。あなたを捕らえに来ます。俺が打ち倒してきます。」
      急いで棒を抜き、前へ迎え出て怒鳴った。
      悟空「どこへ行く。この棒を受けろ！」
      小妖は一言も答えず、杵を上げて迎え撃った。二人が草の斜面の下で、ぶつかり合い、突きかかり、一進一退の戦いをしていると、今度は山の後ろから、ひゅうっと風の音がした。また一匹の妖怪が飛び出し、まっすぐ三蔵へ向かってきた。沙悟浄はそれを見て驚いた。
      沙悟浄「お師匠さま、悟空兄さんも八戒兄さんも目がくらんで、妖怪を通してしまいました。あなたを捕らえに来ます。馬の上にいてください。私が捕らえてきます。」
      沙悟浄も相手を見極めずに杖を抜き、正面から小妖の鉄杵を受け止めた。互いに激しく攻め合い、わめき、叫び、騒々しく戦ううちに、次第に遠くへおびき出されていった。妖怪の頭目は空中から、三蔵が馬の上に一人きりでいるのを見た。五本の鋼の鉤のような爪を伸ばし、三蔵をひとつかみにした。三蔵は馬から離れ、足も鐙から抜け、妖怪の一陣の風にさらわれていった。哀れなことだ！　まさに、こういうことである。
    "translation_status": "draft"

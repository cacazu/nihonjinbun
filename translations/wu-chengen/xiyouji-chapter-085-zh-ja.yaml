    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-024"
      "description_ja": "八戒が自分の前歴を歌って名乗る韻文。斗牛宮を口で倒すこと、王母の霊芝料理、玉皇自身による二千回の鎚打ちなども、すべて本人の語りとして保持した。他の回の前歴や刑罰の記述へ合わせて改めていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-026"
      "description_ja": "原文は「山高不得金生土」。五行を重ねた句だが、通常の相生の順序に直して「土が金を生む」とはしない。「山が高く、金が土を生むこともかなわない」と字面を保った。金・土の個別の象徴と構文の詳しい解釈は確定していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-030"
      "description_ja": "八戒は悟空の棒が助けたと話すが、先の語りでは悟空が声をかけ、敵には近づかないまま戻っている。八戒の発言を実際の打撃へ置き換えず、語りと発言の違いを残した。「哭喪棒」は金箍棒への悪口めいた呼び名。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-033"
      "description_ja": "この問いの直前には、底本に話者を示す語がない。頭目が沙和尚と八戒を比べて尋ね、小妖が答えたという直前の流れから、頭目の続く問いとして訳した。原文欄へ話者語は補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-033"
      "description_ja": "天界の神々の全列挙を保った。「五卿四相」は文字どおり五卿と四相の神々を指す呼称として残すが、各員の具体名や他の神の集団との同一性は確定しない。列挙と悟空の強さは小妖の説明である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-033"
      "description_ja": "原文が骨牌の名だと明示する「斷么絕六」は、一の目がなく六の目も絶えるという字面を、すっかり打ち滅ぼされたという言葉に掛けたものとして訳した。牌の組合せの細則は未確認。獅駝洞での出来事は小妖の報告として保ち、語り手が全滅を再認定したことにはしない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-034"
      "description_ja": "底本は「魚水盆內捻蒼蠅」。直前の袋から物を取る譬えとともに、たやすさを表す。魚を入れた水鉢の中で蠅をつまむという字面を残したが、「魚水盆」の具体的な器や表記の妥当性は確定していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-038"
      "description_ja": "木こりの「前日」と「今已三日」は、一昨日から数えて今日で三日という話として訳した。三蔵の滞在がすでに三日たったという意味ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch85-1455634"
      "segment_ids":
        - "xy-ch85-038"
      "description_ja": "三蔵は最初、木こりの死には他への気がかりがないと考えたが、木こりが八十三歳の母を一人で養う事情を語り、その後で両者の責務を重ねている。木こりの家族がいないという語り手の説明にはしない。 原文の欠落ではなく、解釈・校訂上の留保。"

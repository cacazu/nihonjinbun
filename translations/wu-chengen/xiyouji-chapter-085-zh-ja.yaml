  - "id": "xy-ch85-004"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二臣請國王開看，國王即命打開。方揭了蓋，豬八戒就忍不住往外一跳，諕得那多官膽戰，口不能言。又見孫行者攙出唐僧，沙和尚搬出行李。八戒見總兵官牽著馬，走上前，咄的一聲道：「馬是我的，拿過來。」嚇得那官兒翻跟頭，跌倒在地。四眾俱立在階中。那國王看見是四個和尚，忙下龍床，宣召三宮妃后，下金鑾寶殿，同群臣拜問道：「長老何來？」三藏道：「是東土大唐駕下差往西方天竺國大雷音寺拜活佛取真經的。」國王道：「老師遠來，為何在這櫃裡安歇？」三藏道：「貧僧知陛下有願心殺和尚，不敢明投上國，扮俗人，夜至寶方飯店裡借宿。因怕人識破原身，故此在櫃中安歇。不幸被賊偷出，被總兵捉獲擡來。今得見陛下龍顏，所謂撥雲見日。望陛下赦放貧僧，海深恩便也。」國王道：「老師是天朝上國高僧，朕失迎迓。朕常年有願殺僧者，曾因僧謗了朕，朕許天願，要殺一萬和尚做圓滿。不期今夜歸依，教朕等為僧。如今君臣后妃，髮都剃落了，望老師勿吝高賢，願為門下。」八戒聽言，呵呵大笑道：「既要拜為門徒，有何贄見之禮？」國王道：「師若肯從，願將國中財寶獻上。」行者道：「莫說財寶，我和尚是有道之僧。你只把關文倒換了，送我們出城，保你皇圖永固，福壽長臻。」那國王聽說，即著光祿寺大排筵宴。君臣合同，拜歸於一。即時倒換關文，請師父改號。行者道：「陛下『法國』之名甚好，但只『滅』字不通。自經我過，可改號『欽法國』，管教你海晏河清千代勝，風調雨順萬方安。」國王謝了恩。擺整朝鑾駕，送唐僧四眾出城西去。君臣們乘善歸真不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      二人の役人が国王に中をご覧になるよう願い出ると、国王は開けるよう命じた。蓋が上がったとたん、八戒は待ちきれず、外へ飛び出した。役人たちは肝をつぶし、声も出ない。続いて悟空が三蔵を支えて箱から出し、沙悟浄（さごじょう）が荷物を運び出した。八戒は総兵が馬を引いているのを見ると、歩み寄って一喝した。
      八戒「馬は俺のだ。こっちへよこせ！」
      総兵は仰天してひっくり返り、地面に倒れた。師弟四人がそろって階段の間に立つと、国王は四人とも僧だと分かり、急いで玉座を下りた。三宮の后妃たちを呼び寄せ、金鑾宝殿（きんらんほうでん）から下り、臣下たちとともに拝礼して尋ねた。
      国王「長老、どちらからお越しですか。」
      三蔵「東の大唐（だいとう）の天子より、西方の天竺国（てんじくこく）にある大雷音寺（だいらいおんじ）へ遣わされた者です。生きておられる仏を拝み、真の経をいただきに参ります。」
      国王「遠くからお越しの先生が、なぜこの箱の中で休んでおられたのですか。」
      三蔵「陛下が僧を殺すと誓われたことを知り、堂々とこのお国へ入る勇気がございませんでした。そこで俗人の姿になり、夜になって、こちらの宿屋へ宿を借りました。僧だと見破られるのが恐ろしくて、箱の中で休んでいたのです。不運にも賊に盗み出され、総兵殿に取り押さえられて、ここへ運ばれました。今、陛下のお顔を拝見できたのは、まさしく雲が晴れて日が差した思いでございます。どうか私どもをお許しになり、放免してくださいましたら、海より深いご恩でございます。」
      国王「先生は、天朝の大国から来られた高僧でしたか。お迎えもせず、失礼いたしました。私が長年、僧を殺そうと願っていたのは、以前、僧にそしられたからです。天に誓い、一万人の僧を殺して願いを果たそうとしていました。ところが思いがけず、昨夜は仏門へ帰依することとなり、私どもまで僧にされたのです。今や王も臣下も后妃も、髪をすべて剃り落とされました。どうか先生、その高い徳を惜しまず、私どもを門下にお加えください。」
      これを聞いて、八戒は大声で笑った。
      八戒「弟子入りするなら、入門の贈り物は何だい。」
      国王「お師匠さまにお許しいただけるなら、国中の財宝を差し上げます。」
      悟空「財宝なんて要りません。俺たちは道を修めた僧です。通行文書を改め、城の外まで送ってくれればそれでよい。そうすれば、あなたの国は永く栄え、福も寿命もいつまでも続きますよ。」
      国王はその言葉を聞き、ただちに光禄寺（こうろくじ）へ盛大な宴の支度を命じた。国王と臣下は心を合わせ、一つの教えへ拝礼して帰依した。その場で通行文書を改め、お師匠さまに国の名も改めてほしいと願い出た。
      悟空「陛下、『法国』という名はたいへんよい。ただ、『滅ぼす』という字だけがいけない。俺たちが通ったのを機に、『欽法国（きんぽうこく）』と改めるとよいでしょう。そうすれば、海は穏やかに黄河も澄んで千代に栄え、風も雨も時を得て、国中が安らかに治まります。」
      国王は恩に感謝し、朝廷の行列を整えて、三蔵たち四人を城外へ見送り、西へ送り出した。国王と臣下が善へ向かい、真の道へ帰った話は、ここまでとしよう。
    "translation_status": "draft"
  - "id": "xy-ch85-005"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說長老辭別了欽法國王，在馬上欣然道：「悟空，此一法甚善，大有功也。」沙僧道：「哥啊，是那裡尋這許多整容匠，連夜剃這許多頭？」行者把那施變化弄神通的事說了一遍。師徒們都笑不合口。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 126
        "line_end": 126
    "translation_ja": |-
      三蔵は欽法国の国王に別れを告げると、馬上でうれしそうに言った。
      三蔵「悟空、今度の方法は実によかった。たいへんな手柄だったな。」
      沙悟浄「兄さん、いったいどこからあれほど大勢の髪結いを見つけて、一晩であんなにたくさんの頭を剃ったのですか。」
      悟空は変化の術と神通力を使ったいきさつを、ひととおり話した。師弟はみな、口を閉じられないほど笑い合った。
    "translation_status": "draft"
  - "id": "xy-ch85-006"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正歡喜處，忽見一座高山阻路。唐僧勒馬道：「徒弟們，你看這面前山勢崔巍，切須仔細。」行者笑道：「放心，放心，保你無事。」三藏道：「休言無事。我看那山峰挺立，遠遠的有些兇氣，暴雲飛出，漸覺驚惶，滿身麻木，神思不安。」行者笑道：「你把烏巢禪師的《多心經》早已忘了？」三藏道：「我記得。」行者道：「你雖記得，這有四句頌子，你卻忘了哩。」三藏道：「那四句？」行者道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      こうして喜んでいると、ふいに高い山が行く手を遮った。三蔵は馬の手綱を引いた。
      三蔵「お前たち、前の山を見なさい。険しくそびえている。くれぐれも気をつけるのだ。」
      悟空は笑った。
      悟空「安心してください、安心してください。無事を請け合います。」
      三蔵「無事だなどと言うものではない。あの峰は切り立ち、遠くからでも不吉な気配がする。荒々しい雲も吹き出している。だんだん恐ろしくなって、体じゅうがしびれ、気持ちも落ち着かない。」
      悟空はまた笑った。
      悟空「烏巣禅師（うそうぜんじ）の『多心経（たしんきょう）』を、もう忘れてしまったのですか。」
      三蔵「覚えているとも。」
      悟空「覚えていても、この四句の偈（げ）は忘れていますね。」
      三蔵「どの四句だ。」
      悟空は唱えた。
    "translation_status": "draft"
  - "id": "xy-ch85-007"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「佛在靈山莫遠求，靈山只在汝心頭。
      人人有個靈山塔，好向靈山塔下修。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 130
        "line_end": 131
    "translation_ja": |-
      悟空「仏は霊山（れいざん）におわすが、遠くへ求めるな。
      霊山は、ただお前の心の中にある。
      誰の心にも、一つの霊山の塔がある。
      その塔の下でこそ、よく修行するがよい。」
    "translation_status": "draft"
  - "id": "xy-ch85-008"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏道：「徒弟，我豈不知？若依此四句，千經萬典，也只是修心。」行者道：「不消說了。心淨孤明獨照，心存萬境皆清。差錯些兒成惰懈，千年萬載不成功。但要一片志誠，雷音只在眼下。似你這般恐懼驚惶，神思不安，大道遠矣，雷音亦遠矣。且莫胡疑，隨我去。」那長老聞言，心神頓爽，萬慮皆休。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      三蔵「悟空、私がそれを知らないと思うのか。この四句によれば、千の経、万の教典も、ただ心を修めよということなのだ。」
      悟空「もう言うまでもありません。心が清らかなら、その明るさだけで独り輝く。心がしっかりしていれば、あらゆる境地が澄み渡る。少しでも道を外れ、怠けてしまえば、千年たっても万年たっても成し遂げられません。ただひたすら誠の心を持てば、雷音寺（らいおんじ）は目の前です。今のあなたのようにおびえて騒ぎ、気持ちが落ち着かないようでは、大いなる道も遠く、雷音寺も遠くなってしまいます。むやみに疑わず、俺について来てください。」
      その言葉を聞くと、三蔵の心はたちまち晴れ、あらゆる心配が消えた。
    "translation_status": "draft"
  - "id": "xy-ch85-009"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾一同前進。不幾步到於山上。舉目看時："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 135
        "line_end": 135
    "translation_ja": "四人はそろって先へ進み、ほどなく山へ入った。目を上げて見れば、こんな眺めである。"
    "translation_status": "draft"
  - "id": "xy-ch85-010"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": "那山真好山，細看色班班。頂上雲飄蕩，崖前樹影寒。飛禽淅瀝，走獸兇頑。林內松千榦，巒頭竹幾竿。吼叫是蒼狼奪食，咆哮是餓虎爭餐。野猿長嘯尋鮮果，麋鹿攀花上翠嵐。風灑灑，水潺潺，時聞幽鳥語間關。幾處藤蘿牽又扯，滿溪瑤草雜香蘭。磷磷怪石，削削峰岩。狐狢成群走，猴猿作隊頑。行客正愁多險峻，奈何古道又灣還。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      まことに見事な山である。よくよく見れば、色とりどり。
      頂には雲が漂い、崖の前には木陰が冷たい。
      飛ぶ鳥はさえずり、走る獣は荒々しい。
      林には千本もの松、峰には幾本かの竹。
      吠えるのは餌を奪う蒼い狼、うなるのは食い物を争う飢えた虎。
      野猿は長く鳴いて新鮮な果実を探し、大鹿は花をかき分け緑の山気へ登る。
      風はさやさや、水はさらさら。奥の鳥のさえずりが時折響く。
      あちこちで藤のつるが絡み合い、谷川には美しい草と香る蘭が交じる。
      怪石はごつごつと重なり、峰と岩は鋭く切り立つ。
      狐とむじなが群れて走り、猿たちが連れだって遊ぶ。
      旅人は険しい所の多さに気をもむが、ああ、古道はさらに曲がりくねる。
    "translation_status": "draft"
  - "id": "xy-ch85-011"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們怯怯驚驚，正行之時，只聽得呼呼一陣風起。三藏害怕道：「風起了。」行者道：「春有和風，夏有薰風，秋有金風，冬有朔風。四時皆有風，風起怕怎的？」三藏道：「這風來得甚急，決然不是天風。」行者道：「自古來，風從地起，雲自山出，怎麼得個天風？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      師弟がおっかなびっくり歩いていると、突然、ひゅうひゅうと風が吹き起こった。三蔵は怖がった。
      三蔵「風が出てきた。」
      悟空「春には和風（わふう）、夏には薫風（くんぷう）、秋には金風（きんぷう）、冬には朔風（さくふう）が吹きます。どの季節にも風はあるのに、風が吹いたからといって、何を怖がるんです。」
      三蔵「この風はあまりに急だ。決して、天の自然な風ではない。」
      悟空「昔から、風は地から起こり、雲は山から出るものです。天の風なんて、どこにあるんですか。」
    "translation_status": "draft"
  - "id": "xy-ch85-012"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，又見一陣霧起。那霧真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 140
        "line_end": 140
    "translation_ja": "言い終わらないうちに、今度は霧が立ちこめた。まさに、こんな霧である。"
    "translation_status": "draft"
  - "id": "xy-ch85-013"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      漠漠連天暗，濛濛匝地昏。
      日色全無影，鳥聲無處聞。
      宛然如混沌，彷彿似飛塵。
      不見山頭樹，那逢採藥人。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 142
        "line_end": 145
    "translation_ja": |-
      果てしなく天へ連なって暗く、ぼうぼうと地を覆って暮れる。
      日の光は影もなく、鳥の声もどこにも聞こえない。
      まるで天地が分かれる前の混沌、舞い上がる塵のようでもある。
      山頂の木さえ見えぬのに、薬草採りの人にどうして出会えよう。
    "translation_status": "draft"
  - "id": "xy-ch85-014"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏一發心驚道：「悟空，風還未定，如何又這般霧起？」行者道：「且莫忙，請師父下馬，你兄弟二個在此保守，等我去看看是何吉凶。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      三蔵はいよいよ肝を冷やした。
      三蔵「悟空、風もまだ収まらぬのに、どうしてこんな霧まで出てきたのだ。」
      悟空「慌てないでください。お師匠さま、馬からお下りください。お前たち二人はここでお守りしろ。俺が行って、吉と出るか凶と出るか、見てこよう。」
    "translation_status": "draft"
  - "id": "xy-ch85-015"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，把腰一躬，就到半空。用手搭在眉上，圓睜火眼，向下觀之，果見那懸巖邊坐著一個妖精。你看他怎生模樣："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 149
        "line_end": 149
    "translation_ja": "さすがは悟空、腰をかがめたかと思うと、もう空中へ飛び上がっていた。手を眉にかざし、火のような目を大きく見開いて下を見渡すと、果たして切り立つ崖のそばに、一匹の妖怪が座っていた。その姿ときたら、こうである。"
    "translation_status": "draft"
  - "id": "xy-ch85-016"
    "section_id": "chapter-85"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      炳炳文斑多采豔，昂昂雄勢甚抖擻。
      獠牙出口如鋼鑽，利爪藏蹄似玉鉤。
      金眼圓睛禽獸怕，銀鬚倒豎鬼神愁。
      張狂哮吼施威猛，噯霧噴風運智謀。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 150
        "line_end": 153
    "translation_ja": |-
      鮮やかな斑紋は色美しく、堂々たる猛々しさは、いかにも意気盛ん。
      口から突き出た牙は鋼の錐、足に隠した鋭い爪は玉の鉤。
      金色の丸い目には鳥獣もおびえ、銀のひげが逆立てば鬼神も愁える。
      荒れ狂って吠え、猛威を振るい、霧を吐き、風を噴いて、知恵を巡らす。
    "translation_status": "draft"
  - "id": "xy-ch85-017"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "又見那左右手下有三四十個小妖擺列，他在那裡逼法的噴風噯霧。行者暗笑道：「我師父也有些兒先兆，他說不是天風，果然此風是個妖精在這裡弄喧兒哩。若老孫使鐵棒往下就打，這叫做『搗蒜打』，打便打死了，只是壞了老孫的名頭。」那行者一生豪傑，再不曉得暗算計人。他道：「我且回去，照顧豬八戒照顧，教他來先與這妖精見一仗。若是八戒有本事，打倒這妖，算了造化；若無手段，被這妖拿去，等我再去救他，才好出名。他又平日做作，有些躲懶，不肯出頭，卻只是有些口緊，好吃東西。等我哄他一哄，看他怎麼說？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      さらにその左右には、三、四十匹の小妖が並んでいた。妖怪の頭目はそこで術を働かせ、風を噴き、霧を吐いていた。悟空はひそかに笑った。
      悟空「お師匠さまにも、少しは虫の知らせがあったんだな。自然の風じゃないと言ったが、そのとおりだ。妖怪がここで騒ぎを起こしていたわけだ。俺が鉄の棒を振るって上から打ち込めば、こいつは『にんにく搗き』だ。打てば殺せるが、それでは俺の名がすたる。」
      悟空は生来の豪傑で、不意を突いて人を陥れるようなまねは知らなかった。そして言った。
      悟空「ひとまず戻って、八戒の面倒をみてやろう。あいつをここへ来させ、先にこの妖怪と一戦させるんだ。八戒に腕があって倒せれば、それは運のよいことだ。腕が足りず捕まったら、俺が助けに行く。そうすれば、俺も名を上げられる。あいつは普段から格好ばかりつけて、怠けては前に出ようとしない。そのくせ口だけは卑しくて、食うことばかりだ。ひとつだまして、何と言うか見てやろう。」
    "translation_status": "draft"
  - "id": "xy-ch85-018"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "即時落下雲頭，到三藏前。三藏問道：「悟空，風霧處吉凶何如？」行者道：「這會子明淨了，沒甚風霧。」三藏道：「正是，覺到退下些去了。」行者笑道：「師父，我常時間還看得好，這番卻看錯了。我只說風霧之中恐有妖怪，原來不是。」三藏道：「是甚麼？」行者道：「前面不遠，乃是一莊村。村上人家好善，蒸的白米乾飯、白麵饝饝齋僧哩。這些霧，想是那些人家蒸籠之氣，也是積善之應。」八戒聽說，認了真實，扯過行者，悄悄的道：「哥哥，你先吃了他的齋來的？」行者道：「吃不多兒，因那菜蔬太鹹了些，不喜多吃。」八戒道：「啐！憑他怎麼鹹，我也盡肚吃他一飽。十分作渴，便回來吃水。」行者道：「你要吃麼？」八戒道：「正是，我肚裡有些饑了，先要去吃些兒，不知如何？」行者道：「兄弟莫題。古書云：『父在，子不得自專。』師父又在此，誰敢先去？」八戒笑道：「你若不言語，我就去了。」行者道：「我不言語，看你怎麼得去？」那獃子吃嘴的見識偏有，走上前，唱個大喏道：「師父，適才師兄說，前村裡有人家齋僧。你看這馬，有些要打攪人家，便要草要料，卻不費事？幸如今風霧明淨，你們且略坐坐，等我去尋些嫩草兒，先喂喂馬，然後再往那家子化齋去罷。」唐僧歡喜道：「好啊，你今日卻怎肯這等勤謹？快去快來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      悟空はすぐに雲を下り、三蔵の前へ戻った。
      三蔵「悟空、あの風と霧の中は、吉兆だったか、凶兆だったか。」
      悟空「今はすっきり晴れて、風も霧もほとんどありません。」
      三蔵「そうだな。少し引いたように感じる。」
      悟空は笑った。
      悟空「お師匠さま、いつもは見違えない俺ですが、今回は見当が外れました。風と霧の中には妖怪でもいるのかと思ったら、違ったんです。」
      三蔵「では、何だったのだ。」
      悟空「この先、そう遠くない所に村があるんです。村の人たちは善行を好み、白米のご飯や白い小麦粉の饅頭を蒸して、僧に振る舞っています。この霧は、その家々の蒸籠から上がった湯気でしょう。善行を積んだしるしでもあるんですよ。」
      八戒はすっかり本気にして、悟空を引き寄せ、声をひそめて尋ねた。
      八戒「兄貴、先にご馳走になってきたのか。」
      悟空「あまり食わなかった。おかずが少し塩辛すぎて、たくさん食う気にならなかったんだ。」
      八戒「ちぇっ！　どんなに塩辛くても、俺なら腹いっぱい食うぞ。ひどく喉が渇いたら、戻って水を飲めばいい。」
      悟空「お前も食いたいのか。」
      八戒「ああ、少し腹が減ってきた。先に行って、ちょっと食わせてもらいたいんだが、どうだろう。」
      悟空「そいつは言いっこなしだ。古い書物にも、『父がいる間は、子が勝手に事を決めてはならぬ』とある。お師匠さまがここにいるのに、誰が先に行けるものか。」
      八戒は笑った。
      八戒「兄貴が黙っていてくれるなら、俺は行くよ。」
      悟空「俺は何も言わん。どうやって行くか、お手並み拝見だ。」
      食い意地にかけては、八戒には妙に知恵が回る。前へ出て、丁寧に挨拶した。
      八戒「お師匠さま、さっき兄貴が、この先の村で坊さんに食事を出していると言っていました。ですが、この馬を連れて行ったら、草だ飼葉だとねだって、先方に手間をかけさせることになるでしょう。幸い、今は風も霧も晴れています。ここで少しお休みになっていてください。俺が柔らかい草を探してきて、先に馬へ食わせます。それから、その家へ食事の施しを受けに行きましょう。」
      三蔵は喜んだ。
      三蔵「よい考えだ。今日はまた、どうしてそんなにまめに働く気になったのだ。早く行って戻りなさい。」
    "translation_status": "draft"
  - "id": "xy-ch85-019"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子暗暗笑著便走。行者趕上扯住道：「兄弟，他那裡齋僧，只齋俊的，不齋醜的。」八戒道：「這等說，又要變化是。」行者道：「正是，你變變兒去。」好獃子，他也有三十六般變化，走到山凹裡，捻著訣，念動咒語，搖身一變，變做個矮瘦和尚。手裡敲個木魚，口裡哼阿哼的，又不會念經，只哼的是「上大人」。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      八戒はひそかに笑いながら歩きだした。悟空が追いついて引き止めた。
      悟空「おい、あそこは僧に飯を出すといっても、男前にしか食わせないんだ。醜い奴にはくれないぞ。」
      八戒「となると、また姿を変えろというわけか。」
      悟空「そうだ。化けてから行け。」
      八戒も、三十六通りの変化は心得ている。山のくぼみへ入り、指で印を結んで呪文を唱え、身を揺すると、背の低い痩せた僧になった。手には木魚を持って叩き、口ではむにゃむにゃと唱えている。経を読むことなどできず、口ずさむのは、ただ「上大人（じょうたいじん）」ばかりだった。
    "translation_status": "draft"
  - "id": "xy-ch85-020"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那怪物收風斂霧，號令群妖，在於大路口上，擺開一個圈子陣，專等行客。這獃子晦氣，不多時，撞到當中，被群妖圍住，這個扯住衣服，那個扯著絲絛，推推擁擁，一齊下手。八戒道：「不要扯，等我一家家吃將來。」群妖道：「和尚，你要吃甚的？」八戒道：「你們這裡齋僧，我來吃齋的。」群妖道：「你想這裡齋僧，不知我這裡專要吃僧。我們都是山中得道的妖仙，專要把你們和尚拿到家裡，上蒸籠蒸熟吃哩。你倒還想來吃齋。」八戒聞言，心中害怕，才報怨行者道：「這個弼馬溫，其實憊懶。他哄我說是這村裡齋僧，這裡那得村莊人家？那裡齋甚麼僧？卻原來是此妖精。」那獃子被他扯急了，即便現出原身，腰間掣釘鈀，一頓亂築，築退那些小妖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      一方、妖怪の頭目は風と霧を収め、小妖たちに命じて、大道の入り口に円陣を張らせ、通りがかりの旅人を待ち構えていた。不運な八戒は、ほどなくその真ん中へ踏み込み、小妖たちに囲まれてしまった。こちらが衣を引っ張れば、あちらは組みひもを引き、みなで押し合いへし合い、いっせいに手を出した。
      八戒「引っ張るなよ。一軒ずつ、順番に食わせてもらうから。」
      小妖たち「坊主、何を食おうというんだ。」
      八戒「ここでは坊さんに飯を振る舞うんだろう。俺もご馳走になりに来たのさ。」
      小妖たち「坊さんに食わせる所だと思ったのか。ここは、坊さんを食う所なんだよ。俺たちはみな、山で道を得た妖仙（ようせん）だ。お前たち坊主を家へ連れていって、蒸籠で蒸し上げて食うことばかり狙っている。それなのに、お前のほうが飯を食いに来たとはな。」
      八戒はそれを聞いておびえ、ようやく悟空への恨み言を漏らした。
      八戒「あの弼馬温（ひつばおん）め、本当にふざけた奴だ！　この村で坊さんに飯を出しているなんて、俺をだましやがった。どこに村や人家がある？　どこで飯を振る舞うっていうんだ？　いるのは、この妖怪どもだったとは！」
      いよいよ激しく引っ張られた八戒は、すぐに元の姿を現し、腰から釘鈀（ていは）を抜いた。一気にめちゃくちゃに突きかけ、小妖たちを追い払った。
    "translation_status": "draft"
  - "id": "xy-ch85-021"
    "section_id": "chapter-85"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "小妖急跑去報與老妖道：「大王，禍事了。」老怪道：「有甚禍事？」小妖道：「山前來了一個和尚，且是生得乾淨。我說拿家來蒸他吃，若吃不了，留些兒防天陰。不想他會變化。」老妖道：「變化甚的模樣？」小妖道：「那裡成個人相？長嘴大耳朵，背後又有鬃。雙手掄一根釘鈀，沒頭沒臉的亂築，諕得我們跑回來報大王也。」老怪道：「莫怕，等我去看。」掄著一條鐵杵，走近前看時，見那獃子果然醜惡。他生得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch85-1455634"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第085回&oldid=1455634"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      小妖が急いで頭目のもとへ駆け込み、報告した。
      小妖「大王、大変です！」
      妖怪の頭目「何が大変なのだ。」
      小妖「山の前に坊さんが一人来たのですが、それは小ぎれいな顔をしていました。家へ連れてきて蒸して食い、食いきれない分は天気の悪い日のために取っておこうと思ったのです。ところが、そいつは変化を使えるのでした。」
      妖怪の頭目「どんな姿に変わったのだ。」
      小妖「とても人の姿ではありません。長い口に大きな耳、背中にはたてがみまであります。両手で釘鈀を振り回し、頭だろうが顔だろうが、お構いなしに突きまくるので、私どもは怖くなり、逃げ戻って大王へ知らせに来たのです。」
      妖怪の頭目「恐れるな。わしが見てこよう。」
      頭目は鉄杵（てっしょ）を一本振りかざし、近づいて見ると、なるほど八戒は醜悪な姿をしていた。こんな有様である。

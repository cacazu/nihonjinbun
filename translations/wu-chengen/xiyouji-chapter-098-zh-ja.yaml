  "known_gaps":
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-007"
      "description_ja": "「仙籙」は仙人の名籍や資格に関わる文書と解した。本文は肘に掛けるとだけ述べ、物の形や詳しい内容は示さないため、特定の護符や経巻とは断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-009"
      "description_ja": "「九戒」の九つの内容は本文に示されない。三帰は仏・法・僧への帰依をいう。道教にも三帰・九戒の表現があり、この詩が採る戒律の系統と細目は確定せず、八戒や十戒へ改めていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-011"
      "description_ja": "原文の「接引旃壇上法門」は、香木の栴檀で仏の尊い道を飾る表現と解した。ここで三蔵に新たな仏号が授けられたという意味には取らない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-018"
      "description_ja": "底本は珍しい二字「\U00026A45\U00026A80」を用いる。人々がその上に立つという文脈から、舟の枠や横材など、足場になる部分と解した。\U00026A45には船名という字書説明が見られるが、この複合語の字義・構造は確定できない。原字を保ち、底板、船べり等へ一義的に置き換えていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-019"
      "description_ja": "原文の「六六塵」を保持した。六塵に結びつく心の汚れを示す詩的表現と解するが、「六六」をどのように数えるかは本文に説明がない。元神は道教的な語であり、この場面の仏教と道教の表現の重なりを、単一の教理へ整理していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-030"
      "description_ja": "この目録の三十五項目は、題名と個別の巻数を底本どおり保存した。実在の経典名や略名と、既知の題名と異なるものが混在するため、すべてを現存仏典の正式名に直したり、現存本の巻数へ合わせたりしていない。『具舍論経』『維識論経』『恩意経大集』も原字に従い、一般に知られた『倶舎論』『唯識論』などへ無注記で改めない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-033"
      "description_ja": "「吹噓少女」は風を少女に見立てる古い表現を踏まえると解した。「少女風」は微風をいう語として用いられるが、この詩の少女を、特定の名を持つ女神と断定する根拠は確認できていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-036"
      "description_ja": "原文の「只可以此傳之耳」は「これ」の指示先が簡略である。直後に字のある経を授けよと命じるため、訳では字のある経で東土へ教えを伝える趣旨と解した。白紙も真経だという評価と、経には対価が要るという如来自身の発言は、矛盾を解消しようと削っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-040"
      "description_ja": "二度目の目録も三十五項目を省かず訳した。前の目録の『光明経』はここでは『大光明経』、『僧祇経』は『僧祗経』となる。対応する位置の題名の違いとして双方の字を保持し、一方に統一していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-041"
      "description_ja": "原文は全蔵を一万五千百四十四巻、選び出した一蔵を五千四十八巻とする。一方、記載された個別巻数を足すと、最初の目録は一万五千百五巻となり、三十九巻の差がある。二度目の目録は五千四十八巻で、本文の合計と一致する。最初の目録の巻数を補ったり引いたりせず、各数字を原文どおり残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch98-1500530"
      "segment_ids":
        - "xy-ch98-043"
      "description_ja": "金頂大仙の話では観音の出立は十年前、到着の見込みは二、三年だったが、ここで観音は十四年、五千四十日と数える。さらに八日を加えて一蔵五千四十八巻の数に合わせる。暦年への換算や、先の年数との整合化はしていない。 原文の欠落ではなく、解釈・校訂上の留保。"

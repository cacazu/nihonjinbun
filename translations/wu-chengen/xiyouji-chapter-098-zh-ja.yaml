    "source_text": |-
      當年奮志奉欽差，領牒辭王出玉階。
      清曉登山迎霧露，黃昏枕石臥雲霾。
      挑禪遠步三千水，飛錫長行萬里崖。
      念念在心求正果，今朝始得見如來。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 171
        "line_end": 174
        "source_sequence": 25
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      あの日、志を奮い起こして勅使の命を受け、
      通行文書を授かり、王に別れて玉の階を下りた。
      夜明けには山に登り、霧と露を迎え、
      夕暮れには石を枕に、雲やもやの中に寝た。
      禅の道を担って、三千の川を遠く歩み、
      錫杖を携え、万里の崖を長く旅した。
      一念ごとに心にあるのは、正果を求めること。
      今日になって初めて、如来にまみえることができた。
    "translation_status": "reviewed"

    "source_text": "師徒們逍逍遙遙，走上靈山之頂。又見青松林下列優婆，翠柏叢中排善士。長老就便施禮，慌得那優婆塞、優婆夷、比丘僧、比丘尼合掌道：「聖僧且休行禮，待見了牟尼，卻來相敘。」行者笑道：「早哩，早哩，且去拜上位者。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 168
        "line_end": 168
        "source_sequence": 23
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      師弟はゆったりと、霊山の頂へ歩いていった。青い松林の下には在家の信徒が列をなし、緑の柏の間には善い道を歩む人々が並んでいる。三蔵がその場で礼をすると、優婆塞（うばそく）、優婆夷（うばい）、比丘僧（びくそう）、比丘尼（びくに）たちは慌てて合掌した。
      在家の信徒と僧尼たち「聖僧、今はどうかお礼をなさらずに。牟尼（むに）にお会いになってから、お話しいたしましょう。」
      悟空は笑った。悟空「まだ早い、まだ早い。まずは上のお方を拝みに行きましょう。」
    "translation_status": "reviewed"
  - "id": "xy-ch98-024"

    "translation_ja": "金頂大仙の話では観音の出立は十年前、到着の見込みは二、三年だったが、ここで観音は十四年、五千四十日と数える。さらに八日を加えて一蔵五千四十八巻の数に合わせる。暦年への換算や、先の年数との整合化はしていない。"
    "translation_status": "reviewed"

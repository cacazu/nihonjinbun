  - "id": "xy-ch98-031"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "阿儺、伽葉引唐僧看遍經名，對唐僧道：「聖僧東土到此，有些甚麼人事送我們？快拿出來，好傳經與你去。」三藏聞言道：「弟子玄奘，來路迢遙，不曾備得。」二尊者笑道：「好好好，白手傳經繼世，後人當餓死矣。」行者見他講口扭捏，不肯傳經，他忍不住叫噪道：「師父，我們去告如來，教他自家來把經與老孫也。」阿儺道：「莫嚷，此是甚麼去處，你還撒野放刁？到這邊來接著經。」八戒、沙僧耐住了性子，勸住了行者，轉身來接，一卷卷收在包裡，馱在馬上，又綑了兩擔，八戒與沙僧挑著，卻來寶座前叩頭，謝了如來，一直出門。逢一位佛祖，拜兩拜；見一尊菩薩，拜兩拜。又到大門，拜了比丘僧、尼，優婆夷、塞，一一相辭，下山奔路不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 219
        "line_end": 219
        "source_sequence": 31
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      阿儺と迦葉は三蔵を案内して経の名をすべて見せ、言った。阿儺と迦葉「聖僧、東の国からここへ来られたのですから、私たちへの贈り物は何かお持ちでしょう。早くお出しなさい。そうすれば経をお渡しできます。」
      三蔵「弟子の玄奘は、道のりがはるかでしたので、用意してまいりませんでした。」
      二人の尊者は笑った。阿儺と迦葉「結構、結構、結構。ただで経を伝え、そのやり方を後の世へ続けていけば、後の者たちは飢え死にするでしょうな。」
      悟空は二人が言葉を濁し、ぐずぐずして経を渡そうとしないのを見ると、我慢できずに騒ぎだした。悟空「お師匠さま、如来へ訴えに行きましょう。如来自身に、俺へ経を渡してもらえばいい。」
      阿儺「騒ぐな。ここをどこだと思っている。まだ勝手に暴れて無理を言うのか。こちらへ来て経を受け取れ。」
      八戒と沙悟浄は辛抱し、悟空をなだめてから、経を受け取りに向かった。一巻ずつ包みへ入れて馬に載せ、さらに二荷にくくった分を八戒と沙悟浄が担いだ。如来の宝座へ戻ると、頭を地につけて感謝し、そのまま外へ出た。仏に一人出会えば二度拝み、菩薩（ぼさつ）を一人見れば二度拝む。大門まで来ると、比丘僧、比丘尼、優婆夷、優婆塞にも礼をし、一人一人に別れを告げ、山を下りて旅路へ急いだ。その話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch98-032"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾上岸回頭，連無底船兒卻不知去向。行者方說是接引佛祖。三藏方才省悟，急轉身，反謝了三個徒弟。行者道：「兩不相謝，彼此皆扶持也。我等虧師父解脫，借門路修功，幸成了正果；師父也賴我等保護，秉教伽持，喜脫了凡胎。師父，你看這面前花草松篁、鸞鳳鶴鹿之勝境，比那妖邪顯化之處，孰美孰惡？何善何兇？」三藏稱謝不已。一個個身輕體快，步上靈山。早見那雷音古剎："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 164
        "line_end": 164
        "source_sequence": 21
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      四人が岸へ上がって振り返ると、底なしの舟まで、もうどこへ行ったか分からなかった。ここで初めて、悟空は船頭が接引仏祖だったと話した。三蔵はようやく悟り、急いで振り返って、今度は三人の弟子に礼を述べた。
      悟空「お互い、礼には及びません。皆で支え合ったのですから。私たちはお師匠さまのおかげで束縛を解かれ、修行の道へ入り、幸いにも正果を成し遂げました。お師匠さまも、私たちの護りを受け、教えを守って加護を得られたので、めでたく凡人の肉体を脱したのです。お師匠さま、目の前の花や草、松や竹、鸞や鳳凰、鶴や鹿がいる、このすばらしい景色をご覧ください。妖怪が化けて見せた所と比べて、どちらが美しく、どちらが醜いです。どちらが善く、どちらが凶悪です。」
      三蔵はいつまでも礼を言った。一人一人、身も軽く気も晴れやかに、霊山を上っていった。やがて、古い雷音寺（らいおんじ）が見えてきた。
    "translation_status": "reviewed"
  - "id": "xy-ch98-022"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": "頂摩霄漢中，根接須彌脈。巧峰排列，怪石參差。懸崖下瑤草琪花，曲徑傍紫芝香蕙。仙猿摘果入桃林，卻似火燒金；白鶴棲松立枝頭，渾如煙捧玉。彩鳳雙雙，青鸞對對。彩鳳雙雙，向日一鳴天下瑞；青鸞對對，迎風耀舞世間稀。又見那黃森森金瓦疊鴛鴦，明幌幌花磚鋪瑪瑙。東一行，西一行，盡都是蕊宮珠闕；南一帶，北一帶，看不了寶閣珍樓。天王殿上放霞光，護法堂前噴紫焰。浮屠塔顯，優缽花香。正是地勝疑天別，雲閑覺晝長。紅塵不到諸緣盡，萬劫無虧大法堂。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 166
        "line_end": 166
        "source_sequence": 22
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      頂は大空をこすり、根は須弥山（しゅみせん）の山脈につながる。
      妙なる峰が並び、奇岩は高く低く入り組む。
      切り立つ崖の下には玉のような草や花、曲がりくねる小道の脇には紫の霊芝と香る蕙（けい）。
      仙猿は果物を摘もうと桃林に入り、その姿は金を火で焼くよう。
      白鶴は松に宿って枝先に立ち、まるで煙が玉を支えるよう。
      彩り豊かな鳳凰は二羽ずつ、青い鸞もつがいでいる。
      彩り豊かな鳳凰は二羽ずつ、日に向かってひと声鳴けば、天下の瑞祥となり、
      青い鸞はつがいで、風を迎えて輝き舞うさまは、この世にまれだ。
      さらに、黄に輝く金瓦は雌雄一対に重なり、まばゆい模様の敷瓦は瑪瑙（めのう）を敷いたよう。
      東の一列、西の一列、どこも花の宮、真珠の楼門。
      南の一帯、北の一帯、宝の楼閣が、見尽くせないほど連なっている。
      天王殿（てんのうでん）には霞の光が放たれ、護法堂（ごほうどう）の前には紫の炎が噴き出す。
      仏塔はくっきりとそびえ、優鉢（うはつ）の花は香る。
      まさしく、この地のすぐれたさまには別の天かと疑い、ゆったりした雲を見れば昼も長く感じられる。
      俗塵は届かず、あらゆる世の縁は尽き、万劫を経ても損なわれぬ、大いなる法の堂である。
    "translation_status": "reviewed"
  - "id": "xy-ch98-023"

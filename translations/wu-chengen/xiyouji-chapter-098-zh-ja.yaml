    "translation_status": "reviewed"
  - "id": "xy-ch98-002"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表寇員外既得回生，復整理了幢旛鼓樂，僧道親友，依舊送行不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 122
        "line_end": 122
        "source_sequence": 2
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "さて、生き返った寇洪（こうこう）は、再び旗や幡、太鼓や楽隊をととのえ、僧侶や道士、親類や友人を集め、前のとおり一行を見送った。その話は、ひとまず置こう。"
    "translation_status": "reviewed"
  - "id": "xy-ch98-003"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說唐僧四眾上了大路，果然西方佛地，與他處不同：見了些琪花瑤草，古柏蒼松；所過地方，家家向善，戶戶齋僧；每逢山下人修行，又見林間客誦經。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 124
        "line_end": 124
        "source_sequence": 3
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "三蔵（さんぞう）たち四人は大路へ出た。さすがに西方の仏の国は、ほかの土地とは違う。玉のように美しい花や草、古い柏、青々とした松が目につく。通る先々、どの家も善い行いに励み、どの家も僧に食事を供している。山のふもとでは修行する人に出会い、林の中には経を読む人がいた。"
    "translation_status": "reviewed"
  - "id": "xy-ch98-004"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們夜宿曉行，又經有六七日，忽見一帶高樓，幾層傑閣。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 126
        "line_end": 126
        "source_sequence": 4
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "師弟は夜になると宿り、明ければ出立した。そうしてさらに六、七日たったころ、ふと高楼が連なり、立派な建物が幾重にもそびえているのが見えた。まさに、"
    "translation_status": "reviewed"
  - "id": "xy-ch98-005"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": "沖天百尺，聳漢凌空。低頭觀落日，引手摘飛星。豁達窗軒吞宇宙，嵯峨棟宇接雲屏。黃鶴信來秋樹老，彩鸞書到晚風清。此乃是靈宮寶闕，琳館珠庭。真堂談道，宇宙傳經。花向春來美，松臨雨過青。紫芝仙果年年秀，丹鳳儀翔萬感靈。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 128
        "line_end": 128
        "source_sequence": 5
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      高さ百尺（しゃく）、天を突き、銀河に届くほど空高くそびえる。
      頭を垂れれば沈む日が見え、手を伸ばせば流れる星もつかめそう。
      広々とした窓は宇宙を呑み込み、高々とした棟は雲の屏風に接する。
      黄鶴が便りを運べば秋の木々は老い、彩り豊かな鸞が書を届ければ夕風は澄む。
      ここは霊妙な宮、宝の楼門、玉の館、真珠の庭。
      真の道を堂で語り、宇宙に経を伝える所。
      花は春を迎えて美しく、松は雨が過ぎていよいよ青い。
      紫の霊芝と仙果は年々秀で、赤い鳳凰は気高く舞い、あらゆるものに霊妙な感応をもたらす。
    "translation_status": "reviewed"
  - "id": "xy-ch98-006"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏舉鞭遙指道：「悟空，好去處耶。」行者道：「師父，你在那假境界，假佛像處，倒強要下拜；今日到了這真境界，真佛像處，倒還不下馬，是怎的說？」三藏聞言，慌得翻身跳下來，已到了那樓閣門首。只見一個道童斜立在山門之前，應聲叫道：「那來者莫非東土取經人麼？」長老急整衣，擡頭觀看。見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 130
        "line_end": 130
        "source_sequence": 6
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      三蔵は鞭を上げ、遠くを指した。三蔵「悟空（ごくう）、何とよい所でしょう。」
      悟空「お師匠さまは、偽物の仏の世界や仏の像の前では、どうしても拝むと言い張りました。それが今日は本物の仏の世界、本物の仏のお姿がある所へ来たのに、まだ馬を下りないとは、どういうわけです。」
      三蔵はそれを聞いて慌てて馬から飛び下りた。もう楼閣の門前に着いている。見ると、山門の前に道童が一人、斜めに身を寄せて立っていた。声に応じて呼びかける。道童「おいでになったのは、東の国から経を求めて来られた方ではありませんか。」
      三蔵は急いで衣を直し、顔を上げてその姿を見た。
    "translation_status": "reviewed"
  - "id": "xy-ch98-007"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": "身披錦衣，手搖玉麈。身披錦衣，寶閣瑤池常赴宴；手搖玉麈，丹臺紫府每揮塵。肘懸仙籙，足踏履鞋。飄然真羽士，秀麗實奇哉。煉就長生居勝境，修成永壽脫塵埃。聖僧不識靈山客，當年金頂大仙來。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 132
        "line_end": 132
        "source_sequence": 7
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      身には錦の衣をまとい、手には玉の柄の払子（ほっす）を振る。
      錦の衣をまとっては、宝の楼閣や瑤池（ようち）の宴に常に赴き、
      玉の払子を振っては、丹台（たんだい）や紫府（しふ）の塵をいつも払う。
      肘には仙籙（せんろく）を掛け、足には靴を履く。
      軽やかに浮世を離れた、まことの道士。その端麗さは実にただならぬ。
      長生の道を練り上げ、すぐれた境地に住み、永遠の命を修めて俗塵を脱した。
      聖僧には、この霊山（れいざん）の人が誰だか分からない。
      それは、かつての金頂大仙（きんちょうたいせん）であった。
    "translation_status": "reviewed"
  - "id": "xy-ch98-008"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖認得他，即叫：「師父，此乃是靈山腳下玉真觀金頂大仙，他來接我們哩。」三藏方才醒悟，進前施禮。大仙笑道：「聖僧今年才到，我被觀音菩薩哄了。他十年前領佛金旨，向東土尋取經人，原說二三年就到我處。我年年等候，渺無消息，不意今年才相逢也。」三藏合掌道：「有勞大仙盛意，感激，感激。」遂此四眾牽馬挑擔，同入觀裡。卻又與大仙一一相見。即命看茶擺齋。又叫小童兒燒香湯與聖僧沐浴了，好登佛地。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 133
        "line_end": 133
        "source_sequence": 8
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      悟空は見知っていたので、すぐに呼んだ。悟空「お師匠さま、霊山のふもとの玉真観（ぎょくしんかん）にいらっしゃる金頂大仙です。私たちを迎えに来てくださったのですよ。」
      三蔵はようやく事情が分かり、進み出て礼をした。金頂大仙は笑った。金頂大仙「聖僧は、今年になってようやくお着きですか。私は観音菩薩（かんのんぼさつ）にだまされましたよ。十年前、仏のご命令を受けて東の国へ取経の人を探しに行かれた時には、二、三年で私の所へ着くとおっしゃった。毎年待っても、まるで音沙汰がない。まさか、今年になってお会いできるとはね。」
      三蔵は合掌した。三蔵「大仙のお心遣いに、お手数をお掛けしました。ありがたく存じます。まことにありがたく存じます。」
      四人は馬を引き、荷を担ぎ、ともに観へ入った。改めて、一人ずつ金頂大仙に挨拶する。金頂大仙は茶を出し、精進の食事を用意するよう命じ、さらに童子に、香を入れた湯を沸かして聖僧を入浴させ、仏の地へ上れるようにせよと言いつけた。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch98-009"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      功滿行完宜沐浴，煉馴本性合天真。
      千辛萬苦今方息，九戒三皈始自新。
      魔盡果然登佛地，災消故得見沙門。
      洗塵滌垢全無染，反本還原不壞身。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 135
        "line_end": 138
        "source_sequence": 9
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      功も行も満ちた今こそ、身を洗う時。
      本性を練り鎮め、生まれながらの真実にかなう。
      千辛万苦は今ようやくやみ、九戒（きゅうかい）と三帰（さんき）によって新たに生まれ変わる。
      魔は尽き、まさしく仏の地へ上り、災いは消え、ゆえに沙門（しゃもん）にまみえる。
      塵を洗い、垢をすすぎ、一点の汚れもない。
      本に返り、源に帰れば、壊れることのない身となる。
    "translation_status": "reviewed"
  - "id": "xy-ch98-010"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們沐浴了，不覺天色將晚，就於玉真觀安歇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 140
        "line_end": 140
        "source_sequence": 10
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "師弟が湯を浴び終えると、いつの間にか日も暮れかかっていた。その夜は玉真観に泊まった。"
    "translation_status": "reviewed"
  - "id": "xy-ch98-011"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "次早，唐僧換了衣服，披上錦襴袈裟，戴了毘盧帽，手持錫杖，登堂拜辭大仙。大仙笑道：「昨日襤褸，今日鮮明，睹此相，真佛子也。」三藏拜別就行。大仙道：「且住，等我送你。」行者道：「不必你送，老孫認得路。」大仙道：「你認得的是雲路，聖僧還未登雲路，當從本路而行。」行者道：「這個講得是。老孫雖走了幾遭，只是雲來雲去，實不曾踏著此地。既有本路，還煩你送送。我師父拜佛心重，幸勿遲疑。」那大仙笑吟吟，攜著唐僧手，接引旃壇上法門。原來這條路不出山門，就自觀宇中堂，穿出後門便是。大仙指著靈山道：「聖僧，你看那半天中有祥光五色、瑞藹千重的，就是靈鷲高峰，佛祖之聖境也。」唐僧見了就拜。行者笑道：「師父，還不到拜處哩。常言道：『望山走倒馬。』離此鎮還有許遠，如何就拜？若拜到頂上，得多少頭磕是？」大仙道：「聖僧，你與大聖、天蓬、捲簾四位已到福地，望見靈山，我回去也。」三藏遂拜辭而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 141
        "line_end": 141
        "source_sequence": 11
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      翌朝、三蔵は着替え、錦襴袈裟（きんらんげさ）をまとい、毘盧帽（びるぼう）をかぶり、錫杖（しゃくじょう）を手にして堂へ上がり、金頂大仙に別れの礼を述べた。金頂大仙は笑った。金頂大仙「昨日はぼろを着ていたのに、今日は鮮やかな装いですね。そのお姿なら、まことに仏の子です。」
      三蔵が別れを告げて行こうとすると、金頂大仙は呼び止めた。金頂大仙「しばらくお待ちなさい。私がお送りしましょう。」
      悟空「見送りは結構です。道なら俺が知っています。」
      金頂大仙「あなたの知っているのは、雲の上の道でしょう。聖僧はまだ雲の道に上れません。地上の道を行かなくては。」
      悟空「なるほど、そのとおりだ。俺も何度か来たが、雲で来て雲で帰ってばかりで、実際にこの地を踏んだことはなかった。道があるのなら、やはりご案内を願おう。お師匠さまは仏にお会いしたくてたまらないんだ。どうか、すぐに出てください。」
      金頂大仙はにこにこしながら三蔵の手を取り、栴檀（せんだん）の尊い法門へ導いた。その道は山門の外に出るのではなく、観の中堂を通り抜けて、裏門を出た先にあった。金頂大仙は霊山を指した。金頂大仙「聖僧、空の半ばに五色のめでたい光と幾重もの瑞気が見えるでしょう。あれが霊鷲峰（りょうじゅほう）、仏のお住まいになる聖地です。」
      三蔵は見るなり拝んだ。悟空は笑った。悟空「お師匠さま、拝む所はまだですよ。『山は見えても、そこへ着くまでに馬が倒れる』と言うでしょう。この辺りからは、まだずいぶんあります。どうして今から拝むのです。頂まで拝み続けたら、何回頭を下げることになるやら。」
      金頂大仙「聖僧、あなたと大聖（たいせい）、天蓬（てんぽう）、捲簾（けんれん）の四人の方は、もう幸いの地へ着き、霊山をご覧になりました。私は戻ります。」
      三蔵はそこで別れの礼をして、先へ進んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch98-012"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖引著唐僧等，徐徐緩步，登了靈山。不上五六里，見了一道活水，響潺潺滾浪飛流，約有八九里寬闊，四無人跡。三藏心驚道：「悟空，這路來得差了，敢莫大仙錯指了？此水這般寬闊，這般洶湧，又不見舟楫，如何可渡？」行者笑道：「不差，你看那壁廂不是一座大橋？要從那橋上行過去，方成正果哩。」長老等又近前看時，橋邊有一扁，扁上有「凌雲渡」三字，原來是一根獨木橋。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 142
        "line_end": 142
        "source_sequence": 12
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      悟空は三蔵たちを案内し、ゆっくり歩いて霊山を上っていった。五、六里（り）も行かぬうちに、流れが現れた。水はざあざあと音を立て、波を巻き、飛ぶように流れている。幅は八、九里ほどもあり、辺りに人の気配はない。
      三蔵は驚いた。三蔵「悟空、道を間違えたのではありませんか。大仙の教え方が間違っていたのかもしれません。こんなに広く、こんなに激しい流れなのに、舟も櫂も見当たりません。どうやって渡るのです。」
      悟空は笑った。悟空「間違いありません。ほら、あちらに大きな橋があるではありませんか。あの橋を歩いて渡ってこそ、正果（しょうか）を得られるのです。」
      三蔵たちが近寄って見ると、橋の脇に額があり、「凌雲渡（りょううんと）」の三字が書かれていた。ところが橋は、たった一本の丸木橋だった。
    "translation_status": "reviewed"
  - "id": "xy-ch98-013"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      遠看橫空如玉棟，近觀斷水一枯槎。
      維河架海還容易，獨木單梁人怎蹅？
      萬丈虹霓平臥影，千尋白練接天涯。
      十分細滑渾難渡，除是神仙步彩霞。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 144
        "line_end": 147
        "source_sequence": 13
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      遠く見れば、空に渡した玉の棟木。
      近く見れば、流れを横切る一本の枯れ木。
      川をつなぎ、海に橋を架けるほうが、まだたやすい。
      ただ一本の木を、人はどう踏んで渡るのか。
      万丈（じょう）の虹が横たわるかのよう、千尋（じん）の白絹が空の果てまで続くかのよう。
      ひどく細く、滑らかで、どうにも渡りきれそうにない。
      彩り豊かな雲を踏む仙人ででもなければ。
    "translation_status": "reviewed"
  - "id": "xy-ch98-014"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏心驚膽戰道：「悟空，這橋不是人走的，我們別尋路徑去來。」行者笑道：「正是路，正是路。」八戒慌了道：「這是路？那個敢走？水面又寬，波浪又湧，獨獨一根木頭，又細又滑，怎生動腳？」行者道：「你都站下，等老孫走個兒你看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 149
        "line_end": 149
        "source_sequence": 14
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      三蔵は胆を冷やし、震えて言った。三蔵「悟空、この橋は人の歩くものではありません。別の道を探しに行きましょう。」
      悟空は笑った。悟空「ここが道です。ここが道ですよ。」
      八戒（はっかい）も慌てた。八戒「これが道だって？　誰が歩けるもんか。水面は広いし、波は荒い。木はたった一本、それも細くて滑る。どう足を出せっていうんだ。」
      悟空「みんな、そこに立っていろ。俺が歩いて見せる。」
    "translation_status": "reviewed"
  - "id": "xy-ch98-015"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，拽開步，跳上獨木橋，搖搖擺擺，須臾跑將過去，在那邊招呼道：「過來，過來。」唐僧搖手。八戒、沙僧咬指道：「難難難。」行者又從那邊跑過來，拉著八戒道：「獃子，跟我走，跟我走。」那八戒臥倒在地道：「滑滑滑，走不得，你饒我罷，讓我駕風霧過去。」行者按住道：「這是甚麼去處，許你駕風霧？必須從此橋上走過，方可成佛。」八戒道：「哥啊，佛做不成也罷，實是走不得。」他兩個在那橋邊扯扯拉拉的耍鬥，沙僧走去勸解，才撒脫了手。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 150
        "line_end": 150
        "source_sequence": 15
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      さすがの悟空、足を踏み出すと丸木橋へ飛び乗り、ゆらゆら揺れながら、たちまち向こうへ駆け渡った。対岸から手招きする。悟空「来い、来い。」
      三蔵は手を振って断った。八戒と沙悟浄（さごじょう）は指をかんだ。八戒と沙悟浄「無理だ、無理だ、無理だ。」
      悟空はまた駆け戻り、八戒を引っ張った。悟空「この馬鹿、俺について来い。ついて来い。」
      八戒は地面に寝転がった。八戒「滑る、滑る、滑る。歩けねえよ。勘弁してくれ。風や霧に乗って渡らせてくれ。」
      悟空は押さえつけた。悟空「ここをどこだと思っている。風や霧に乗れる所か。この橋を歩いて渡らなくては、仏になれないんだ。」
      八戒「兄貴、仏になれなくたっていい。とにかく歩けねえよ。」
      二人が橋のたもとで引っ張り合い、じゃれ合うようにもみ合っていると、沙悟浄がなだめに来た。それでようやく手を放した。
    "translation_status": "reviewed"
  - "id": "xy-ch98-016"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏回頭，忽見那下溜中有一人撐一隻船來，叫道：「上渡，上渡。」長老大喜道：「徒弟，休得亂頑。那裡有隻渡船兒來了。」他三個跳起來站定，同眼觀看，那船兒來得至近，原來是一隻無底的船兒。行者火眼金睛，早已認得是接引佛祖，又稱為南無寶幢光王佛。行者卻不題破，只管叫：「這裡來，撐攏來。」霎時撐近岸邊，又叫：「上渡，上渡。」三藏見了，又心驚道：「你這無底的破船兒如何渡人？」佛祖道：「我這船："

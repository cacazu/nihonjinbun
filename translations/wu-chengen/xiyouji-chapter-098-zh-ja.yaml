    "translation_ja": |-
      天地の混沌が初めて分かれた時から、名を知られている。
      幸い私がさし続けて、変わることがない。
      風があっても波があっても、おのずから穏やか。
      始めも終わりもなく、太平を楽しむ。
      六塵（ろくじん）に染まらず、一なるものへ帰ることができ、
      万劫（まんごう）の間、安らかに、思うまま進んでゆく。
      底なしの舟では海を渡れぬと言うが、
      昔も今も、この舟はあらゆる生きものを渡してきた。」

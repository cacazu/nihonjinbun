    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾到大雄寶殿殿前，對如來倒身下拜。拜罷，又向左右再拜。各各三匝已遍，復向佛祖長跪，將通關文牒奉上。如來一一看了，還遞與三藏。三藏頫顖作禮，啟上道：「弟子玄奘，奉東土大唐皇帝旨意，遙詣寶山，拜求真經，以濟眾生。望我佛祖垂恩，早賜回國。」如來方開憐憫之口，大發慈悲之心，對三藏言曰：「你那東土乃南贍部洲，只因天高地厚，物廣人稠，多貪多殺，多淫多誑，多欺多詐；不遵佛教，不向善緣，不敬三光，不重五穀；不忠不孝，不義不仁，瞞心昧己，大斗小秤，害命殺牲：造下無邊之孽，罪盈惡滿，致有地獄之災。所以永墮幽冥，受那許多碓搗磨舂之苦，變化畜類。有那許多披毛頂角之形，將身還債，將肉飼人。其永墮阿鼻，不得超昇者，皆此之故也。雖有孔氏在彼立下仁義禮智之教，帝王相繼，治有徒流絞斬之刑，其如愚昧不明，放縱無忌之輩何耶！我今有經三藏，可以超脫苦惱，解釋災愆。三藏：有法一藏，談天；有論一藏，說地；有經一藏，度鬼。共計三十五部，該一萬五千一百四十四卷。真是修真之徑，正善之門。凡天下四大部洲之天文、地理、人物、鳥獸、花木、器用、人事，無般不載。汝等遠來，待要全付與汝取去，但那方之人愚蠢村強，毀謗真言，不識我沙門之奧旨。」叫：「阿儺、伽葉，你兩個引他四眾到珍樓之下，先將齋食待他。齋罷，開了寶閣，將我那三藏經中，三十五部之內，各檢幾卷與他，教他傳流東土，永注洪恩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 175
        "line_end": 175
        "source_sequence": 26
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      四人は大雄宝殿（だいおうほうでん）の前に来ると、如来に向かって身を伏せて拝んだ。拝み終えると、さらに左右へ礼をし、それぞれ三巡ずつ礼拝をすませた。改めて如来の前にひざまずき、通関文牒（つうかんもんちょう）を差し出す。如来は一つずつ目を通し、三蔵へ返した。三蔵は頭を下げて礼をし、申し上げた。
      三蔵「弟子の玄奘は、東の大唐（だいとう）皇帝のご命令を受け、はるばるこの宝山へ参りました。真のお経を拝受して、生きとし生けるものを救うためでございます。どうか仏祖（ぶっそ）、ご慈悲を垂れ、早く経を賜って帰国できますよう、お計らいください。」
      如来は憐れみの言葉を発し、大いなる慈悲の心を起こして、三蔵に告げた。
      如来「お前の東の国は、南贍部洲（なんせんぶしゅう）にある。天は高く、地は厚く、物は豊かで人は多いが、貪欲と殺生、淫欲と嘘、欺きとごまかしが多い。仏の教えに従わず、善い縁を求めず、三光（さんこう）を敬わず、五穀を重んじない。忠も孝もなく、義も仁もない。自らの良心を欺き、大きな升で取り立て、小さな秤で渡し、人の命を奪い、獣を殺す。こうして果てしない罪業を重ね、罪悪が満ち満ちたため、地獄の災いを招くのだ。いつまでも暗い冥界に落ち、杵で搗かれ、臼で挽かれる、さまざまな苦しみを受け、畜生にも生まれ変わる。毛をまとい、角を生やした数多くの姿となって、己の身で借りを返し、己の肉を人に食わせる。永遠に阿鼻（あび）に堕ち、抜け出せぬ者がいるのも、みなこのためだ。かの地には孔子（こうし）が仁・義・礼・智の教えを立て、歴代の帝王も徒刑、流刑、絞首、斬首の刑で治めてきた。それでも、道理の分からぬ愚か者、勝手気ままで何をも恐れぬ者たちは、どうしようもない。
      私には今、苦悩から抜け出させ、災いや罪を解きほぐすことのできる、三蔵（さんぞう）の経がある。三蔵とは、天を論じる法の一蔵、地を説く論の一蔵、亡霊を救う経の一蔵だ。合わせて三十五部、一万五千百四十四巻ある。まさしく、真の道を修める道筋であり、善へ正しく進む門である。天下の四大部洲（しだいぶしゅう）の天文、地理、人物、鳥獣、花木、器具、人の営みまで、載せぬものはない。お前たちは遠くから来たのだから、すべて渡して持ち帰らせたいところだ。だが、あの地の者は愚かで粗暴、強情で、真実の言葉をそしり、我ら沙門の奥深い教えを知らぬ。」
      如来は呼びかけた。如来「阿儺（あなん）、迦葉（かしょう）。お前たち二人で、この四人を珍楼の下へ案内し、まず精進の食事でもてなせ。食事が済んだら宝閣を開き、私の三蔵の経、三十五部の中から、各部幾巻かずつ選んで渡すのだ。東の国へ伝え広めさせ、この大きな恩を永く注ぐように。」
    "translation_status": "reviewed"
  - "id": "xy-ch98-027"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二尊者即奉佛旨，將他四眾領至樓下。看不盡那奇珍異寶，擺列無窮。只見那設供的諸神鋪排齋宴，並皆是仙品、仙餚、仙茶、仙果，珍饈百味，與凡世不同。師徒們頂禮了佛恩，隨心享用。其實是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 176
        "line_end": 176
        "source_sequence": 27
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "二人の尊者は仏の命を受け、四人を楼の下へ案内した。見尽くせないほどの珍しい宝が、果てしなく並んでいる。供物をととのえる神々が精進の宴を用意したが、どれも仙界の品、仙界の料理、仙茶、仙果である。百味の珍味は、人の世のものとは違っていた。師弟は仏の恩を伏し拝み、心ゆくまで食べた。そのさまは、"
    "translation_status": "reviewed"
  - "id": "xy-ch98-028"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      寶焰金光映目明，異香奇品更微精。
      千層金閣無窮麗，一派仙音入耳清。
      素味仙花人罕見，香茶異食得長生。
      向來受盡千般苦，今日榮華喜道成。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 178
        "line_end": 181
        "source_sequence": 28
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      宝の炎と金の光が目を明るく照らし、
      不思議な香り、珍しい品は、さらにこの上なく精妙。
      千層の金の楼閣は、美しさ尽きることなく、
      ひと続きの仙界の楽の音が、澄んで耳へ入る。
      世の人にはめったに見られぬ精進の味、仙界の花、
      香る茶、珍しい食べ物は、長生を得させる。
      これまでは、ありとあらゆる苦しみを受け尽くしたが、
      今日は栄華の中で、道の成就を喜ぶ。
    "translation_status": "reviewed"
  - "id": "xy-ch98-029"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這番造化了八戒，便宜了沙僧。佛祖處正壽長生，脫胎換骨之饌，儘著他受用。二尊者陪奉四眾餐畢，卻入寶閣，開門登看。那廂有霞光瑞氣，籠罩千重；彩霧祥雲，遮漫萬道。經櫃上，寶篋外，都貼了紅簽，楷書著經卷名目。乃是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 183
        "line_end": 183
        "source_sequence": 29
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      これで大いに得をしたのは八戒、沙悟浄もありがたい思いをした。如来のもとで、寿命を正しく保ち長生を得させ、凡身を脱して骨まで改める料理を、思う存分いただいたのである。
      二人の尊者は四人に付き添って食事を終えると、宝閣へ進み、戸を開けて中を見せた。そこにはめでたい光と瑞気が幾重にも立ちこめ、色鮮やかな霧と祥雲が万筋にも広がっている。経を納めた棚にも宝箱の外にも赤い札が貼られ、楷書で経巻の名が書かれていた。次のとおりである。
    "translation_status": "reviewed"

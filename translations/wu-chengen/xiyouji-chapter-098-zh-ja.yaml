    "kind": "paragraph"
    "origin": "source"
    "source_text": "那長老手舞足蹈，隨著行者，直至雷音寺山門之外。那廂有四大金剛迎住道：「聖僧來耶？」三藏躬身道：「是，弟子玄奘到了。」答畢，就欲進門。金剛道：「聖僧少待，容稟過再進。」那金剛著一個轉山門報與二門上四大金剛，說唐僧到了；二門上又傳入三門上，說唐僧到了。三山門內原是打供的神僧，聞得唐僧到時，急至大雄殿下，報與如來至尊釋迦牟尼文佛說：「唐朝聖僧，到於寶山，取經來了。」佛爺爺大喜。即召聚八菩薩、四金剛、五百阿羅、三千揭諦、十一大曜、十八伽藍，兩行排列。卻傳金旨，召唐僧進。那裡邊一層一節，欽依佛旨，叫：「聖僧進來。」這唐僧循規蹈矩，同悟空、悟能、悟淨，牽馬挑擔，徑入山門。正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 169
        "line_end": 169
        "source_sequence": 24
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      三蔵は喜びに手足も踊るようで、悟空について雷音寺の山門の外まで進んだ。そこには四大金剛（しだいこんごう）がいて、迎え止めた。四大金剛「聖僧がおいでになったか。」
      三蔵は身をかがめた。三蔵「はい。弟子の玄奘（げんじょう）が参りました。」
      答えると、すぐ門に入ろうとした。金剛（こんごう）「聖僧、少しお待ちください。お取り次ぎをしてからお入りください。」
      金剛は一人を山門の内へ回らせ、二の門を守る四大金剛へ、三蔵が来たと知らせた。二の門から、さらに三の門へ、三蔵が来たと伝える。第三の山門の中にいたのは供物係の神僧で、三蔵の到着を聞くと、急いで大雄殿（だいおうでん）へ行き、至高の如来（にょらい）、釈迦牟尼文仏（しゃかむにもんぶつ）に報告した。
      神僧「唐（とう）の国の聖僧が、この宝山へ、お経を求めて参りました。」
      如来は大いに喜んだ。ただちに八菩薩（はちぼさつ）、四金剛（しこんごう）、五百の阿羅漢（あらかん）、三千の掲諦（ぎゃてい）、十一大曜（じゅういちたいよう）、十八伽藍（がらん）を呼び集め、二列に並ばせた。そして、三蔵を入らせよとの尊い命令を伝えた。奥から順々に仏の命令を承り、呼ぶ声が続く。門内の者たち「聖僧、お入りください。」
      三蔵は作法どおりに、悟空、八戒、沙悟浄とともに、馬を引き、荷を担いで山門へ入っていった。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch98-025"
    "section_id": "chapter-98"
    "kind": "verse"

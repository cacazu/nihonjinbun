    "source_text": "孫大聖合掌稱謝道：「承盛意，接引吾師。──師父，上船去。他這船兒雖是無底卻穩，縱有風浪也不得翻。」長老還自驚疑，行者扠著膊子，往上一推。那師父踏不住腳，轂轆的跌在水裡，早被撐船人一把扯起，站在船上。師父還抖衣服，垛鞋腳，抱怨行者。行者卻引沙僧、八戒，牽馬挑擔，也上了船，都立在\U00026A45\U00026A80之上。那佛祖輕輕用力撐開，只見上溜頭泱下一個死屍。長老見了大驚。行者笑道：「師父莫怕。那個原來是你。」八戒也道：「是你，是你。」沙僧拍著手，也道：「是你，是你！」那撐船的打著號子，也說：「那是你，可賀，可賀。」他們三人也一齊聲相和。撐著船，不一時，穩穩當當的過了凌雲仙渡。三藏才轉身，輕輕的跳上彼岸。有詩為證。詩曰："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 158
        "line_end": 158
        "source_sequence": 18
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      悟空は合掌して礼を述べた。悟空「ご親切に、師をお導きくださり、ありがとうございます。お師匠さま、舟へお乗りください。底はなくても安定しています。風や波があっても覆りません。」
      三蔵はまだ怖がって疑っていた。悟空がその腕を抱え、舟へ押し上げると、三蔵は足を踏ん張れず、ころりと水に落ちた。だが接引仏祖がすばやく引き上げ、舟に立たせた。三蔵は衣を振り、靴の足を踏み鳴らして水を払いながら、悟空に文句を言った。
      悟空は沙悟浄と八戒を連れ、馬を引き、荷を担いで、自分たちも乗り込んだ。皆、𦩅𦪀（かんとう）という舟の足場の上に立った。接引仏祖が軽く力を入れて舟をさし出すと、上流から一つの死体が流れてきた。三蔵は見て仰天した。
      悟空は笑った。悟空「お師匠さま、怖がらないでください。あれは、もともとのあなたですよ。」
      八戒「お師匠さまだ、お師匠さまだ。」
      沙悟浄も手を打った。沙悟浄「お師匠さまです、お師匠さまです！」
      接引仏祖は舟をさす掛け声に合わせて言った。接引仏祖「あれはあなたです。おめでとう、おめでとう。」
      三人の弟子も声をそろえて唱和した。舟は進み、ほどなく何の危なげもなく凌雲の仙の渡しを渡りきった。三蔵はそこで身を返し、軽々と向こう岸へ飛び上がった。その証しの詩がある。
    "translation_status": "reviewed"

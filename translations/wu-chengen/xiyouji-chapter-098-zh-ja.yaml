    "kind": "paragraph"
    "origin": "source"
    "source_text": "在藏總經共三十五部，各部中檢出五千零四十八卷，與東土聖僧傳留在唐。現俱收拾整頓於馬馱人擔之上，專等謝恩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 269
        "line_end": 269
        "source_sequence": 41
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": "蔵にある経は全部で三十五部。その各部から合わせて五千四十八巻を選び出し、東の国の聖僧へ授け、唐に伝え残させることといたしました。いずれも馬の背と人の担ぐ荷へきちんと納め、あとは御恩に感謝するばかりでございます。」"
    "translation_status": "reviewed"
  - "id": "xy-ch98-042"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏四眾拴了馬，歇了擔，一個個合掌躬身，朝上禮拜。如來對唐僧言曰：「此經功德，不可稱量。雖為我門之龜鑑，實乃三教之源流。若到你那南贍部洲，示與一切眾生，不可輕慢。非沐浴齋戒，不可開卷。寶之，重之。蓋此內有成仙了道之奧妙，有發明萬化之奇方也。」三藏叩頭謝恩，信受奉行，依然對佛祖遍禮三匝，承謹歸誠，領經而去。去到三山門，一一又謝了眾聖不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 271
        "line_end": 271
        "source_sequence": 42
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      三蔵たち四人は馬をつなぎ、荷を下ろすと、一人一人、合掌して身をかがめ、上座に向かって拝礼した。如来は三蔵へ告げた。
      如来「この経の功徳は、計り知れぬ。我が門の手本であるばかりか、まことに三教（さんきょう）の源流である。お前たちの南贍部洲へ着いたなら、あらゆる衆生に示すのだ。軽んじてはならぬ。沐浴し、身を慎み、戒めを守った後でなければ、巻を開いてはならぬ。宝とし、重んじよ。この中には、仙となり道を成就する奥義も、あらゆる変化を明らかにする妙法もあるのだから。」
      三蔵は頭を地につけて礼を述べ、その教えを信じて受け入れ、謹んで従った。前と同じく如来に三巡の礼拝をし、謹んで真心から帰依して、経を受けて立ち去った。第三の山門まで行くと、また聖なる方々一人一人に感謝した。その話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch98-043"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "如來因打發唐僧去後，才散了傳經之會。傍又閃上觀世音菩薩合掌啟佛祖道：「弟子當年領金旨向東土尋取經之人，今已成功，共計得一十四年，乃五千零四十日，還少八日，不合藏數。望我世尊早賜聖僧回東轉西，須在八日之內庶完藏數。准弟子繳還金旨。」如來大喜道：「所言甚當，准繳金旨。」即叫八大金剛分付道：「汝等快使神威，駕送聖僧回東，把真經傳留，即引聖僧西回。須在八日之內，以完一藏之數，勿得遲違。」金剛隨即趕上唐僧，叫道：「取經的，跟我來。」唐僧等俱身輕體健，蕩蕩飄飄，隨著金剛，駕雲而起。這才是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 273
        "line_end": 273
        "source_sequence": 43
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      如来は三蔵を送り出した後で、ようやく経を授ける法会を解散した。すると、脇から観音菩薩が進み出て、合掌して申し上げた。
      観音菩薩「弟子はあの年、尊いご命令を受け、東の国へ経を取りに来る者を探しに参りました。今、その務めは果たされ、合わせて十四年、すなわち五千四十日となりました。まだ八日足りず、一蔵の数に合いません。どうか世尊（せそん）、聖僧を早く東へ帰らせ、再び西へ戻らせてください。八日以内に往復すれば、一蔵の数が満ちます。弟子がご命令をお返しし、復命することをお許しください。」
      如来は大いに喜んだ。如来「まことにもっともだ。復命を認めよう。」
      ただちに八大金剛（はちだいこんごう）を呼び、命じた。如来「お前たちは、急いで神威を使い、聖僧を雲に乗せて東の国へ送れ。真経を伝え残したら、すぐ聖僧を西へ連れ戻すのだ。必ず八日以内に往復し、一蔵の数を満たせ。遅れたり、命令に背いたりしてはならぬ。」
      八大金剛はさっそく三蔵に追いつき、呼んだ。八大金剛「経を取りに来た者たち、私たちについて来なさい。」
      三蔵たちはみな身が軽く、体も健やかで、ふわりと漂うように金剛たちに続き、雲に乗って上がっていった。これこそ、
    "translation_status": "reviewed"

    "source_text": "卻說那寶閣上有一尊燃燈古佛，他在閣上暗暗的聽著那傳經之事，心中甚明：原是阿儺、伽葉將無字之經傳去。卻自笑云：「東土眾僧愚迷，不識無字之經，卻不枉費了聖僧這場跋涉？」問：「座邊有誰在此？」只見白雄尊者閃出。古佛分付道：「你可作起神威，飛星趕上唐僧，把那無字之經奪了，教他再來求取有字真經。」白雄尊者即駕狂風，滾離了雷音寺山門之外，大作神威。那陣好風，真個是："

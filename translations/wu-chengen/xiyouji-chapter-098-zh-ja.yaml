        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      さて、その宝閣の上には燃灯古仏（ねんとうこぶつ）がいた。ひそかに経を授ける次第を聞いていて、事情はすっかり分かっていた。阿儺と迦葉は、文字のない経を渡したのである。燃灯古仏は独り笑って言った。燃灯古仏「東の国の僧たちは迷いの中にあり、文字のない経は分かるまい。これでは、聖僧があれほど山川を越えて来た苦労も、無駄になるではないか。」
      燃灯古仏「座のそばに、誰かいるか。」
      白雄尊者（はくゆうそんじゃ）が進み出た。燃灯古仏は命じた。燃灯古仏「神威を起こし、流れ星の速さで三蔵を追え。あの文字のない経を奪い、文字のある真経を求めて、もう一度来させるのだ。」
      白雄尊者はさっそく暴風に乗り、雷音寺の山門の外へ巻き出て、大いに神威を振るった。そのすさまじい風といえば、
    "translation_status": "reviewed"
  - "id": "xy-ch98-033"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": "佛前勇士，不比巽二風神；仙竅怒號，遠賽吹噓少女。這一陣，魚龍皆失穴，江海逆波濤。玄猿捧果難來獻，黃鶴回雲找舊巢。丹鳳清音鳴不美，錦雞喔運叫聲嘈。青松枝折，優缽花飄。翠竹竿竿倒，金蓮朵朵搖。鐘聲遠送三千里，經韻輕飛萬壑高。崖下奇花殘美色，路傍瑤草偃鮮苗。彩鸞難舞翅，白鹿躲山崖。蕩蕩異香漫宇宙，清清風氣徹雲霄。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 222
        "line_end": 222
        "source_sequence": 33
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      仏前の勇士は、巽二（そんじ）の風神の比ではない。
      仙の穴から怒号する風は、風を吹く少女にもはるかに勝る。
      このひと吹きに、魚も竜も住みかを失い、川や海では波が逆巻く。
      黒い猿は果物を捧げに来られず、黄鶴は雲を引き返して古巣を探す。
      赤い鳳凰の澄んだ声も美しく響かず、錦鶏（きんけい）は、くっくっと騒がしく鳴く。
      青松の枝は折れ、優鉢の花は散る。
      緑の竹は一本一本倒れ、金の蓮は一輪一輪揺れる。
      鐘の音は遠く三千里へ送られ、読経の響きは万の谷の高みへ軽く舞う。
      崖の下の奇花は美しい色を損ない、道の脇の玉の草は鮮やかな若芽を伏せる。
      彩り豊かな鸞も翼を舞わせられず、白鹿は山の崖へ隠れる。
      広々と異香が宇宙に満ち、清らかな風は雲の果てまで吹き通る。
    "translation_status": "reviewed"
  - "id": "xy-ch98-034"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那唐長老正行間，忽聞香風滾滾，只道是佛祖之禎祥，未曾隄防。又聞得響一聲，半空中伸下一隻手來，將馬馱的經輕輕搶去。諕得個三藏搥胸叫喚，八戒滾地來追，沙和尚護守著經擔，孫行者急趕去如飛。那白雄尊者，見行者趕得將近，恐他棒頭上沒眼，一時間不分好歹，打傷身體，即將經包捽碎，拋落塵埃。行者見經包破落，又被香風吹得飄零，卻就按下雲頭顧經，不去追趕。那白雄尊者收風斂霧，回報古佛不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 224
        "line_end": 224
        "source_sequence": 34
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      三蔵が歩いていると、突然、香りのする風が巻き起こった。仏のめでたいしるしだとばかり思い、用心もしなかった。さらに、ひと声、響きがしたかと思うと、空から片手が伸び、馬に積んだ経を軽々と奪い取った。
      三蔵は仰天して胸をたたき、叫び声を上げた。八戒は地を転がるようにして追い、沙悟浄は経の荷を護り、悟空は飛ぶような速さで追いかけた。白雄尊者は悟空が近くまで来るのを見ると、その棒には目がないのだから、とっさに善悪も見分けず打ちかかられて、怪我をするかもしれぬと恐れた。そこで経の包みをたたき破り、地面へ投げ落とした。
      悟空は包みが破れ、経が香風に吹かれて散るのを見ると、雲を下ろして経のほうへ向かい、それ以上は追わなかった。白雄尊者は風を収め、霧を引き、燃灯古仏のもとへ戻って報告した。その話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch98-035"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒去追趕，見經本落下，遂與行者收拾，背著來見唐僧。唐僧滿眼垂淚道：「徒弟呀，這個極樂世界，也還有兇魔欺害。」沙僧接了抱著的散經，打開看時，原來雪白，並無半點字跡。慌忙遞與三藏道：「師父，這一卷沒字。」行者又打開一卷看時，也無字。八戒打開一卷，也無字。三藏叫：「通打開來看看。」卷卷俱是白紙。長老短嘆長吁的道：「我東土人果是沒福，似這般無字的空本，取去何用？怎麼敢見唐王？誑君之罪，誠不容誅也。」行者早已知之，對唐僧道：「師父，不消說了，這就是阿儺、伽葉那廝問我要人事，沒有，故將此白紙本子與我們來了。快回去告在如來之前，問他掯財作弊之罪。」八戒嚷道：「正是，正是，告他去來。」四眾急急回山無好步，忙忙又轉上雷音。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 225
        "line_end": 225
        "source_sequence": 35
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      追いかけていた八戒も、経本が落ちるのを見ると、悟空と一緒に拾い集め、背負って三蔵のところへ戻った。三蔵は目いっぱいに涙をためて言った。三蔵「お前たち、この極楽の世界にも、凶悪な魔がいて、人を欺き、苦しめるのですね。」
      沙悟浄は抱えて来たばらばらの経を受け取り、一巻開いて見た。すると真っ白で、文字の跡が半点もない。慌てて三蔵へ差し出した。沙悟浄「お師匠さま、この巻には字がありません。」
      悟空が別の一巻を開いても字はなく、八戒が一巻を開いても字はない。三蔵は叫んだ。三蔵「残らず開いて見なさい。」
      どの巻も、みな白紙だった。三蔵は何度も深いため息をついた。三蔵「東の国の私たちには、本当に福がないのです。このような字のない空の本を持ち帰って、何の役に立つでしょう。どうして唐王（とうおう）にお会いできましょう。君主を欺いた罪は、誅殺されても償いきれません。」
      悟空には、もうわけが分かっていた。悟空「お師匠さま、それ以上おっしゃるには及びません。これは、阿儺と迦葉の奴らが贈り物を求めたのに、持っていなかったので、この白紙の本を渡したのです。早く戻り、如来の前で訴えて、金をゆすり、不正を働いた罪を問わせましょう。」
      八戒もわめいた。八戒「そうだ、そうだ。訴えに行こう。」
      四人は慌ただしく、足取りももつれそうな勢いで山へ引き返し、また雷音寺へ上っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch98-036"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時到於山門之外，眾皆拱手相迎，笑道：「聖僧是換經來的？」三藏點頭稱謝。眾金剛也不阻擋，讓他進去，直至大雄殿前。行者嚷道：「如來，我師徒們受了萬蜇千魔，千辛萬苦，自東土拜到此處，蒙如來分付傳經，被阿儺、伽葉掯財不遂，通同作弊，故意將無字的白紙本兒教我們拿去。我們拿他去何用？望如來敕治。」佛祖笑道：「你且休嚷。他兩個問你要人事之情，我已知矣。但只是經不可輕傳，亦不可以空取。向時眾比丘聖僧下山，曾將此經在舍衛國趙長者家與他誦了一遍，保他家生者安全，亡者超脫，只討得他三斗三升米粒黃金回來。我還說他們忒賣賤了，教後代兒孫沒錢使用。你如今空手來取，是以傳了白本。白本者，乃無字真經，倒也是好的。因你那東土眾生愚迷不悟，只可以此傳之耳。」即叫：「阿儺、伽葉，快將有字的真經，每部中各檢幾卷與他，來此報數。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 226
        "line_end": 226
        "source_sequence": 36
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      ほどなく山門の外に着くと、人々は胸の前で両手を組んで迎え、笑った。迎えた人々「聖僧、お経を替えにいらしたのですか。」
      三蔵はうなずいて礼を述べた。金剛たちも引き止めず、中へ通したので、そのまま大雄殿の前まで行った。悟空は声を張り上げた。
      悟空「如来、私たち師弟は幾万の刺すような苦しみ、幾千の魔の害、ありとあらゆる艱難を受けて、東の国からここまで拝みに来ました。如来から経を授けるよう命じていただいたのに、阿儺と迦葉は金をゆすり取れなかったため、示し合わせて不正を働き、わざと字のない白紙の本を持たせたのです。そんな物を持ち帰って何になります。どうか処罰をお命じください。」
      如来は笑った。如来「そう騒ぐな。二人がお前たちに贈り物を求めたことは、すでに知っている。ただ、経は軽々しく伝えてはならず、ただで受け取ることもできぬ。以前、聖僧である比丘たちが山を下り、この経を舎衛国（しゃえこく）の趙長者（ちょうちょうじゃ）の家で一度読んでやった。その家で生きている者の無事を守り、死んだ者を苦しみから解き放ったのに、求めて持ち帰ったのは、米粒ほどの黄金が三斗（と）三升（しょう）だけであった。それでも私は、あまりに安く売りすぎた、後の子孫が使う金もなくなると言ったのだ。お前たちは今、手ぶらで受け取りに来た。それで白紙の本が渡されたのだ。白紙の本は、文字のない真経で、あれもよいものだ。だが、お前たちの東の国の衆生は愚かで迷い、悟っていないので、文字のある経で教えを伝えるしかない。」
      如来はすぐに呼んだ。如来「阿儺、迦葉。早く、字のある真経を各部から幾巻かずつ選び、渡してやれ。その数を、ここへ報告に来るのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch98-037"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "二尊者復領四眾，到珍樓寶閣之下，仍問唐僧要些人事。三藏無物奉承，即命沙僧取出紫金缽盂，雙手奉上道：「弟子委是窮寒路遙，不曾備得人事。這缽盂乃唐王親手所賜，教弟子持此沿路化齋。今特奉上，聊表寸心。萬望尊者將此收下，待回朝奏上唐王，定有厚謝。只是以有字真經賜下，庶不孤欽差之意，遠涉之勞也。」那阿儺接了，但微微而笑。被那些管珍樓的力士、管香積的庖丁、看閣的尊者，你抹他臉，我撲他背，彈指的，扭唇的，一個個笑道：「不羞，不羞，需索取經的人事。」須臾，把臉皮都羞皺了，只是拿著缽盂不放。伽葉卻才進閣檢經，一一查與三藏。三藏卻叫：「徒弟們，你們都好生看看，莫似前番。」他三人接一卷，看一卷，卻都是有字的。傳了五千零四十八卷，乃一藏之數。收拾齊整，馱在馬上；剩下的，還裝了一擔，八戒挑著。自己行囊，沙僧挑著。行者牽了馬，唐僧拿了錫杖，按一按毘盧帽，抖一抖錦袈裟，才喜喜歡歡，到我佛如來之前。正是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 227
        "line_end": 227
        "source_sequence": 37
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      二人の尊者は再び四人を珍楼宝閣の下へ案内し、また三蔵に贈り物を求めた。三蔵には差し出す物がなく、沙悟浄に紫金（しきん）の鉢盂（はつう）を取り出させ、両手で捧げて言った。
      三蔵「弟子はまことに貧しく、長い道のりを参りましたので、贈り物を用意しておりません。この鉢は唐王が手ずから賜ったもので、道々これを持って食を乞うようにとお命じになりました。今、特に差し上げ、ささやかな気持ちを表します。どうか尊者、お納めください。都へ戻って唐王に奏上すれば、必ず手厚いお礼があるでしょう。ただ、字のある真経をお授けくださり、勅使としての使命と、はるばる参った苦労とを、無駄にさせないでください。」
      阿儺は受け取ると、かすかに笑った。すると珍楼を管理する力士、食事をつかさどる厨房の料理人、閣を見守る尊者たちが、ある者は顔をなで、ある者は背をたたき、指を鳴らし、唇をゆがめて、口々に笑った。
      係の者たち「恥知らず、恥知らず。経を取りに来た人から、贈り物をせびるとは。」
      ほどなく阿儺は恥じて顔じゅうにしわを寄せたが、鉢を持った手は離さなかった。迦葉はそこでようやく閣へ入り、経を選び、一つずつ確かめて三蔵へ渡した。三蔵は呼びかけた。三蔵「お前たち、みなしっかり見なさい。さっきのようにならぬように。」
      三人は一巻受け取るごとに一巻開いて見た。どれにも字がある。授けられたのは五千四十八巻、一蔵の数であった。きちんとととのえて馬に積み、残りは一荷に詰めて八戒が担いだ。自分たちの旅荷物は沙悟浄が担ぐ。悟空が馬を引き、三蔵は錫杖を持ち、毘盧帽を押さえて直し、錦の袈裟（けさ）をひと振りしてととのえた。こうして初めて、喜びに満ちて、我らが仏、如来の前へ出た。まさに、
    "translation_status": "reviewed"
  - "id": "xy-ch98-038"
    "section_id": "chapter-98"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      大藏真經滋味甜，如來造就甚精嚴。
      須知玄奘登山苦，可笑阿儺卻愛錢。
      先次未詳虧古佛，後來真實始安然。
      至今得意傳東土，大眾均將雨露沾。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 229
        "line_end": 232
        "source_sequence": 38
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      大蔵の真経の味わいは甘く、如来の作り上げたものは、実に精妙で厳正。
      玄奘が山へ上るまでの苦労を知るべし。それなのに阿儺は金を愛すとは、おかしいことだ。
      初めは気づかなかったが、燃灯古仏のおかげで助かり、
      後には本物を得て、ようやく安らいだ。
      今こそ心満たされて東の国へ伝え、
      人々は等しく、雨露のような恵みに潤うだろう。
    "translation_status": "reviewed"
  - "id": "xy-ch98-039"
    "section_id": "chapter-98"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "阿儺、伽葉引唐僧來見如來。如來高陞蓮座，指令降龍、伏虎二大羅漢敲響雲磬，遍請三千諸佛、三千揭諦、八金剛、四菩薩、五百尊羅漢、八百比丘僧、大眾優婆塞、比丘尼、優婆夷，各天各洞，福地靈山，大小尊者聖僧，該坐的請登寶座，該立的侍立兩傍。一時間，天樂遙聞，仙音嘹喨，滿空中祥光疊疊，瑞氣重重，諸佛畢集，參見了如來。如來問：「阿儺、伽葉，傳了多少經卷與他？可一一報數。」二尊者即開報：「現付去唐朝："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch98-1500530"
        "precision": "line"
        "line_start": 233
        "line_end": 233
        "source_sequence": 39
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第098回&oldid=1500530"
    "translation_ja": |-
      阿儺と迦葉は三蔵を連れ、如来にお目にかかった。如来は高く蓮の座へ上り、降龍（ごうりゅう）、伏虎（ふっこ）の二大羅漢（らかん）に命じ、雲磬（うんけい）を鳴らさせた。そして、三千の諸仏、三千の掲諦、八金剛（はちこんごう）、四菩薩（しぼさつ）、五百の尊い羅漢、八百の比丘僧、大勢の優婆塞、比丘尼、優婆夷を、広く招いた。あらゆる天、あらゆる洞、幸いの地、霊妙な山々から、大も小も、尊者や聖僧が集まる。座るべき者には宝座へ上ってもらい、立つべき者は左右に侍立した。
      たちまち天上の楽がはるかに聞こえ、仙界の音は高らかに響き、空いっぱいに祥光が重なり、瑞気が幾重にも満ちた。諸仏は残らず集まり、如来にまみえた。
      如来「阿儺、迦葉。経巻はどれほど渡した。一つずつ数を報告せよ。」
      二人の尊者は報告を始めた。阿儺と迦葉「ただいま唐の国へお渡しするのは、

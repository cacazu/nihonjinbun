  "source_text": "那八戒他也有三十六般變化，就在階前賣弄手段，卻便捻訣念咒，喝一聲叫：「長！」把腰一躬，就長有八九丈長，卻似個開路神一般。嚇得那兩班文武戰戰兢兢，一國君臣呆呆掙掙。時有鎮殿將軍問道：「長老，似這等變得身高，必定長到甚麼去處，才有止極？」那獃子又說出獃話來道：「看風。東風猶可，西風也將就；若是南風起，把青天也拱個大窟窿。」那國王大驚道：「收了神通罷，曉得是這般變化了。」八戒把身一矬，依然現了本相，侍立階前。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    八戒にも三十六般の変化があった。階前で腕前をひけらかし、指で印を結んで呪文を唱え、ひと声叫んだ。八戒「伸びろ！」
    腰を曲げたと思うと、背丈は八、九丈にもなり、まるで開路神（かいろしん）である。左右の文武の官人は震え上がり、国王も臣下も呆然としてしまった。そこへ鎮殿将軍（ちんでんしょうぐん）が尋ねた。鎮殿将軍「長老、そんなに背が高くなるのでしたら、いったいどこまで伸びれば、限りに達するのですか。」
    八戒はまた間の抜けたことを言った。八戒「風しだいだね。東風ならまだよし、西風でもどうにかなるが、南風が起きたら、青空にだって頭で大穴を開けてしまう。」
    国王は大いに驚いた。国王「もう術を解いてくれ。そのように変化できることは分かった。」
    八戒は体を縮め、元の姿に戻って、階前に控えた。

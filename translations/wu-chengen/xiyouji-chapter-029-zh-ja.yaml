    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    二人はほどなく洞の口へ着き、雲から降りた。八戒は熊手を抜き、波月洞の門へ力いっぱい打ち込んで、石の門に斗（と）ほどの大きな穴を開けた。門番の小妖は驚いて門を開け、例の二人と見るや、急いで奥へ走って報告した。門番の小妖「大王、大変です。口の長い大耳の和尚と、陰気な顔の和尚がまた来て、門まで壊しました。」
    黄袍怪は驚いた。黄袍怪「また猪八戒と沙和尚（さおしょう）の二人か。師匠を許してやったのに、どうして戻ってきて門をたたき壊すのだ。」
    門番の小妖「何か忘れ物をして、取りに来たのでしょうか。」
    黄袍怪はどっと一喝した。黄袍怪「でたらめを言うな。忘れ物をしたからといって、門を打ち破ってよいものか。何か訳があるはずだ。」
    急いで武装を整え、鋼の刀を手に外へ出て、尋ねた。黄袍怪「そこの和尚、師匠を許してやったのに、よくもまた門を襲いに来たな。」
    八戒「とんでもない妖怪め、よくもあんなことをしたな。」
    黄袍怪「何のことだ。」
    八戒「宝象国の第三公主をだまして洞へ連れ込み、力ずくで妻にして、十三年も置いておくとは。もう返してよいころだ。俺は王様の命を受けて、お前を捕らえに来た。さっさと中へ行って、自分で縄を掛けて出てこい。そうすりゃ、この俺が手を下さずに済む。」
    黄袍怪は聞いて激しく怒った。ぎりぎりと鋼のような歯を鳴らし、ぎょろりと丸い目をむき、猛々しく刀を振り上げると、血もほとばしらせんばかりに、頭へ斬りかかった。八戒は横へかわし、熊手で正面から迎え撃つ。後ろから沙悟浄も宝杖を上げて駆けつけ、ともに打ちかかった。山上のこの勝負は、前とは違った。まことに、
  "translation_status": "reviewed"
- "id": "xy-ch29-029"
  "section_id": "chapter-29"
  "kind": "verse"
  "origin": "source"
  "source_text": "言差語錯招人惱，意毒情傷怒氣生。這魔王大鋼刀，著頭便砍；那八戒九齒鈀，對面來迎。沙悟淨丟開寶杖，那魔王抵架神兵。一猛怪，二神僧，來來往往甚消停。這個說：「你騙國理該死罪。」那個說：「你羅閑事報不平。」這個說：「你強婚公主傷國體。」那個說：「不干你事莫閑爭。」算來只為捎書故，致使僧魔兩不寧。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    言葉の行き違いは人を怒らせ、悪意に情を傷つけられて、怒気が湧く。
    黄袍怪の大鋼刀は、頭を目がけて斬り下ろされ、八戒の九歯鈀（きゅうしは）は、正面から迎え撃つ。
    沙悟浄が宝杖を振り回せば、黄袍怪はその霊妙な武器を受け止める。
    一人の猛き怪、二人の神僧。行きつ戻りつ、休まる暇もない。
    僧の側「国を欺いたお前は、当然死罪だ。」
    黄袍怪「余計な世話を焼き、正義ぶりおって。」
    僧の側「公主を力ずくで妻にして、国の面目を傷つけた。」
    黄袍怪「お前には関わりのないことだ。無用な争いをするな。」
    思えばすべては手紙を運んだため。僧も魔物も、ともに安らぐ暇がない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "戦闘詩の「這個」「那個」は僧側と黄袍怪の応酬だが、僧側を八戒または沙悟浄のどちらかへ確定する根拠は足りない。訳のラベルは「僧の側」とし、個人名を推測しない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「來來往往甚消停」は甚を反語に取り、休止の意味を持つ消停を「休まる暇もない」と訳した。文脈に沿う解釈であり、本句全体の確定的な注解は未確認。字面を激戦という語義だとは扱わない。"
- "id": "xy-ch29-030"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他們在那山坡前戰經八九個回合，八戒漸漸不濟將來，釘鈀難舉，氣力不加。你道如何這等戰他不過？當時初相戰鬥，有那護法諸神，為唐僧在洞，暗助八戒、沙僧，故僅得個手平；此時諸神都在寶象國護定唐僧，所以二人難敵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 166
    "line_end": 166
  "translation_ja": "山の斜面の前で八、九合ほど戦うと、八戒はだんだん持ちこたえられなくなった。熊手を上げるのも難しく、力が続かない。なぜ今度は敵わなくなったのだろう。最初に戦ったときは、三蔵が洞にいたため、護法の神々がひそかに八戒と沙悟浄を助け、それでようやく互角だった。今は神々がみな宝象国で三蔵を守っているので、二人では敵わないのである。"
  "translation_status": "reviewed"
- "id": "xy-ch29-031"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子道：「沙僧，你且上前來與他鬥著，讓老豬出恭來。」他就顧不得沙僧，一溜往那蒿草薜蘿荊棘葛藤裡，不分好歹，一頓鑽進。那管刮破頭皮，搠傷嘴臉，一轂轆睡倒，再也不敢出來。但留半邊耳朵，聽著梆聲。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    八戒は言った。八戒「沙悟浄、ちょっと前へ出て相手をしていてくれ。この俺は用を足してくる。」
    沙悟浄を顧みることもなく、蓬や薜蘿（へいら）、茨や葛のつるが茂る中へ、見境もなく一目散に潜り込んだ。頭の皮が擦り切れようが、口や顔が突き傷になろうが構わず、ごろりと寝転がると、もう出てくる勇気はない。ただ片耳だけは立て、拍子木の音に聞き耳を立てていた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「聽著梆聲」は教育部《重編國語辭典修訂本》「梆聲」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=17186&q=1&word=%E8%81%B2）が本回の句を挙げ、梆子を打つ音と説明するため、拍子木の音と訳した。誰がどこで打つ音かは本文に明示されない。"
- "id": "xy-ch29-032"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪見八戒走了，就奔沙僧。沙僧措手不及，被怪一把抓住，捉進洞去。小妖將沙僧四馬攢蹄綑住。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 170
    "line_end": 170
  "translation_ja": "黄袍怪は八戒が逃げたのを見ると、沙悟浄へ襲いかかった。沙悟浄は手を打つ間もなく一つかみにされ、そのまま洞へ連れ込まれた。小妖たちは沙悟浄の両手両足を、馬の四つの蹄を寄せるように、一つに束ねて縛り上げた。"
  "translation_status": "reviewed"
- "id": "xy-ch29-033"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知端的性命如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 172
    "line_end": 172
  "translation_ja": "はたして沙悟浄の命はどうなるのか。それは次の回でお聞きいただこう。"
  "translation_status": "reviewed"

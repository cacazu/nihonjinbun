    "status": "open"
    "message_ja": "「面聽不一」は再会して聞いていただく話は書き尽くせない、という書簡の結びとして訳した。女性や子についての侮蔑的な自己評価は書簡の話者によるものであり、語り手による現代的評価へ変更していない。"
- "id": "xy-ch29-017"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那學士讀罷家書，國王大哭，三宮滴淚，文武傷情，前前後後，無不哀念。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 147
    "line_end": 147
  "translation_ja": "大学士が家書を読み終えると、国王は声を上げて泣いた。三宮の后妃も涙を落とし、文武の官人たちも心を痛め、前にいる者も後ろにいる者も、悲しまぬ者はなかった。"
  "translation_status": "reviewed"
- "id": "xy-ch29-018"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王哭之許久，便問兩班文武：「那個敢興兵領將，與寡人捉獲妖魔，救我百花公主？」連問數聲，更無一人敢答。真是木雕成的武將，泥塑就的文官。那國王心生煩惱，淚若湧泉。只見那多官齊俯伏奏道：「陛下且休煩惱。公主已失，至今一十三載無音，偶遇唐朝聖僧，寄書來此，未知的否。況臣等俱是凡人凡馬，習學兵書武略，止可佈陣安營，保國家無侵陵之患。那妖精乃雲來霧去之輩，不得與他覿面相見，何以征救？想東土取經者，乃上邦聖僧。這和尚道高龍虎伏，德重鬼神欽，必有降妖之術。自古道：『來說是非者，就是是非人。』可就請這長老降妖邪，救公主，庶為萬全之策。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    国王はしばらく泣いてから、左右に並ぶ文武の官人へ尋ねた。国王「誰か軍勢を起こして将兵を率い、私のために妖魔を捕らえ、百花公主（ひゃっかこうしゅ）を救い出す者はいないか。」
    何度呼びかけても、答える勇気のある者は一人もいなかった。まるで武将は木彫り、文官は泥の像である。国王は思い悩み、涙は泉のように湧いた。すると官人たちは一斉にひれ伏して奏上した。文武の官人たち「陛下、どうかお嘆きをお鎮めください。公主は行方知れずとなり、十三年も便りがございませんでした。偶然唐の聖僧に出会い、手紙を託されたとのことですが、真実かどうか、まだ分かりませぬ。そのうえ私どもは人も馬も、ただの人と馬です。兵法や武芸を学んでいても、陣を張り営を設け、国を侵略から守ることができるだけでございます。妖怪は雲に乗り霧の中を去る者、まともに相対することもできず、どうして討ち救うことができましょう。思えば東土（とうど）から経を求めるこのお方は、大国の聖僧。道が高く龍虎も伏し、徳が重く鬼神も敬う和尚ですから、きっと妖怪を退ける術をお持ちです。昔から『もめ事を持ち込む者こそ、そのもめ事の張本人』と申します。この長老に邪妖を降し、公主を救っていただくのが、まず万全の策かと存じます。」
  "translation_status": "reviewed"
- "id": "xy-ch29-019"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王聞言，急回頭，便請三藏道：「長老若有手段，放法力，捉了妖魔，救我孩兒回朝，也不須上西方拜佛，長髮留頭，朕與你結為兄弟，同坐龍床，共享富貴如何？」三藏慌忙啟上道：「貧僧粗知念佛，其實不會降妖。」國王道：「你既不會降妖，怎麼敢上西天拜佛？」那長老瞞不過，說出兩個徒弟來了。奏道：「陛下，貧僧一人，實難到此。貧僧有兩個徒弟，善能逢山開路，遇水疊橋，保貧僧到此。」國王怪道：「你這和尚大沒理，既有徒弟，怎麼不與他一同進來見朕？若到朝中，雖無中意賞賜，必有隨分齋供。」三藏道：「貧僧那徒弟醜陋，不敢擅自入朝，但恐驚傷了陛下的龍體。」國王笑道：「你看你這和尚說話，終不然朕當怕他？」三藏道：「不敢說。我那大徒弟姓豬，名悟能八戒，他生得長嘴獠牙，剛鬃扇耳，身粗肚大，行路生風。第二個徒弟姓沙，法名悟淨和尚，他生得身長丈二，臂闊三停，臉如藍靛，口似血盆，眼光閃灼，牙齒排釘。他都是這等個模樣，所以不敢擅領入朝。」國王道：「你既這等樣說了一遍，寡人怕他怎的？宣進來。」隨即著金牌至館驛相請。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 149
    "line_end": 149
  "translation_ja": |-
    国王は急いで三蔵へ向き直り、頼んだ。国王「長老、手立てがおありなら法力を振るい、妖魔を捕らえ、わが子を朝廷へ連れ帰ってくださらぬか。そうすれば西方へ仏を拝みに行くには及ばぬ。髪を伸ばして還俗し、私と兄弟の契りを結び、ともに王座に着いて富貴を分かち合うというのはどうだ。」
    三蔵は慌てて申し上げた。三蔵「私は念仏を少々心得るばかりで、実のところ妖怪を降すことはできません。」
    国王「妖怪を降せぬのに、どうして西天へ仏を拝みに行こうというのだ。」
    三蔵はもう隠しておけず、二人の弟子のことを話した。三蔵「陛下、私一人では、とうていここまでは来られませんでした。私には弟子が二人おりまして、山に会えば道を開き、水に会えば橋を架け、私を守ってここまで連れてきてくれたのです。」
    国王は不審に思った。国王「なんと筋の通らぬ和尚だ。弟子がいるなら、なぜ一緒に私に会わせぬ。朝廷に来れば、気に入る褒美はないまでも、相応の食事は供せように。」
    三蔵「弟子たちは姿が醜く、勝手に参内させるわけにはいきませんでした。陛下を驚かせ、お体に障りがあってはと案じたのです。」
    国王は笑った。国王「何ということを言う。よもや私が怖がるとでもいうのか。」
    三蔵「恐れながら、申し上げます。一番目の弟子は姓を猪（ちょ）、名を悟能、八戒と申します。突き出た口に牙があり、剛い鬣、扇のような耳、太い体に大きな腹で、歩けば風が起きます。二番目の弟子は姓を沙（さ）、法名を悟浄という僧で、背は一丈二尺、腕は三停（さんてい）もの幅があり、顔は藍のように青く、口は血の鉢のよう。目はぎらぎら光り、歯は釘を並べたようでございます。二人ともこうした姿ですので、勝手にお連れするわけにはまいりませんでした。」
    国王「これほど詳しく聞いておけば、何を怖がることがあろう。呼び入れよ。」
    ただちに金牌（きんぱい）の使いを駅館へ遣わし、招かせた。
  "translation_status": "reviewed"

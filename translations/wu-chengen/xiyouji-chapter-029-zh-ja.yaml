  "source_text": "卻說那沙僧趕上八戒道：「哥哥，我來了。」八戒道：「兄弟，你來怎的？」沙僧道：「師父叫我來幫幫功的。」八戒大喜道：「說得是，來得好。我兩個努力齊心，去捉那怪物，雖不怎的，也在此國揚揚姓名。」你看他："

  "known_gaps":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-001"
    "description_ja": "回題の「江流」は三蔵の幼名にちなむ呼称。訳では読者が同一人物だと追える通常名「三蔵」を用いた。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-002"
    "description_ja": "開巻の「本原自性佛前修」は本来の自己の性を仏の前で修める意に採った。「迷悟豈居前後」は迷いと悟りに本質的な前後の隔たりがないことを歌うと解するが、特定の宗派・修行段階へ固定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-005"
    "description_ja": "「挾生兒」は乱暴に、無造作に命を奪う意に採った。後半の「待你徒弟討個示下」は、弟子たちが三蔵の居場所を教わって迎えに来るのを待つ意に解し、公主自身が同行するとはしない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-010"
    "description_ja": "底本の「密蕙新苗」は「蕙」の字を保持した。食を満たす農地の文脈には「穗」等の可能性も考えられるが、別字へ補訂せず、蕙と若苗が茂る描写とした。 「錦標」は錦の旗標の像を採った。「五馬」は五頭立ての車と地方長官の威儀、「貫雙鵰」は一度に二羽を射る技を示す表現と解した。宮殿名の列挙を保持し、時代・国の異なる実在建築と同一視していない。 「夢魂消」は前句の「肝膽裂」との対を踏まえ、夢の中にまで及ぶ心の乱れと解する。「夢魂」「消魂」の一般語義は教育部辞典で確認したが、この一句の解釈を直接示す注釈は未確認。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-016"
    "description_ja": "「面聽不一」は再会して聞いていただく話は書き尽くせない、という書簡の結びとして訳した。女性や子についての侮蔑的な自己評価は書簡の話者によるものであり、語り手による現代的評価へ変更していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-019"
    "description_ja": "三蔵の「大徒弟」「第二個徒弟」は悟空追放後の二人を順に紹介する表現として保持した。025の沙悟浄の「二哥」は従来の八戒への呼称であり、独自に改変しない。 「臂闊三停」の三停は腕幅の基準が明示されないため原語を残した。教育部辞典の三部分・三成等の語義から三倍と確定することはできない。両腕を広げるという姿勢も補わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-022"
    "description_ja": "東風・西風・南風による巨体化の冗談を字面の像に従って保持した。本文にない身体的・内丹的な解説は足さない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-023"
    "description_ja": "兵器の列挙は底本の「鞭、簡、瓜、鎚、刀、槍、鉞、斧、劍、戟、矛、鐮」を保持した。「簡」は鉄の棒状の武器、「瓜」は瓜形の頭部を持つ打撃武器と解し、別版の漢字へ原文を訂正していない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-029"
    "description_ja": "戦闘詩の「這個」「那個」は僧側と黄袍怪の応酬だが、僧側を八戒または沙悟浄のどちらかへ確定する根拠は足りない。訳のラベルは「僧の側」とし、個人名を推測しない。 「來來往往甚消停」は甚を反語に取り、休止の意味を持つ消停を「休まる暇もない」と訳した。文脈に沿う解釈であり、本句全体の確定的な注解は未確認。字面を激戦という語義だとは扱わない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "segment_ids":
    - "xy-ch29-031"
    "description_ja": "「聽著梆聲」は教育部《重編國語辭典修訂本》「梆聲」（https://dict.revised.moe.edu.tw/dictView.jsp?ID=17186&q=1&word=%E8%81%B2）が本回の句を挙げ、梆子を打つ音と説明するため、拍子木の音と訳した。誰がどこで打つ音かは本文に明示されない。 本文の欠落ではなく解釈・校訂上の留保。"

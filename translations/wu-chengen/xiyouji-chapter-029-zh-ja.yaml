  "origin": "source"
  "source_text": "他兩個不多時到了洞口，按落雲頭。八戒掣鈀，往那波月洞的門上盡力氣一築，把他那石門築了斗來大小的個窟窿。嚇得那把門的小妖開門，看見是他兩個，急跑進去報道：「大王，不好了，那長嘴大耳的和尚，與那晦色氣臉的和尚，又來把門都打破了。」那怪驚道：「這個還是豬八戒、沙和尚二人。我饒了他師父，怎麼又敢復來打我的門？」小妖道：「想是忘了甚麼物件，來取的。」老怪咄的一聲道：「胡纏，忘了物件，就敢打上門來？必有緣故。」急整束了披掛，綽了鋼刀，走出來問道：「那和尚，我既饒了你師父，你怎麼又敢來打上我門？」八戒道：「你這潑怪幹得好事兒。」老魔道：「甚麼事？」八戒道：「你把寶象國三公主騙來洞內，倚強霸占為妻，住了一十三載，也該還他了。我奉國王旨意，特來擒你。你快快進去，自家把繩子綁縛出來，還免得老豬動手。」那老怪聞言，十分發怒。你看他屹迸迸，咬響鋼牙；滴溜溜，睜圓環眼；雄糾糾，舉起刀來；赤淋淋，攔頭便砍。八戒側身躲過，使釘鈀劈面迎來；隨後又有沙僧舉寶杖趕上前齊打。這一場在山頭上賭鬥，比前不同。真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"

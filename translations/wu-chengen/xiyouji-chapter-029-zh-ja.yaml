- "id": "xy-ch29-003"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那八戒、沙僧與怪鬥經個三十回合，不分勝負。你道怎麼不分勝負？若論賭手段，莫說兩個和尚，就是二十個也敵不過那妖精。只為唐僧命不該死，暗中有那護法神祗保著他；空中又有那六丁六甲、五方揭諦、四值功曹、一十八位護教伽藍助著八戒、沙僧。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 126
    "line_end": 126
  "translation_ja": "さて、八戒（はっかい）と沙悟浄（さごじょう）は黄袍怪（こうほうかい）と三十合ほど渡り合ったが、勝負はつかなかった。なぜ決着がつかなかったかとお思いだろう。腕前を比べれば、僧が二人どころか二十人いても、この妖怪には敵わない。ただ三蔵（さんぞう）はまだ死ぬ定めではなく、護法の神々がひそかに守っていたのである。空中でも六丁六甲（ろくていろっこう）、五方掲諦（ごほうぎゃてい）、四値功曹（しちこうそう）、十八の護教伽藍（ごきょうがらん）が、八戒と沙悟浄に力を添えていた。"
  "translation_status": "reviewed"
- "id": "xy-ch29-004"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且不言他三人戰鬥。卻說那長老在洞裡悲啼，思量他那徒弟，眼中流淚道：「悟能啊，不知你在那個村中逢了善友，貪著齋供？悟淨啊，你又不知在那裡尋他，可能得會？豈知我遇妖魔，在此受難？幾時得會你們，脫了大難，早赴靈山？」正當悲啼煩惱，忽見那洞內走出一個婦人來，扶著定魂樁，叫道：「那長老，你從何來？為何被他縛在此處？」長老聞言，淚眼偷看，那婦人約有三十年紀。遂道：「女菩薩，不消問了。我已是該死的，走進你家門來也，要吃就吃了罷，又問怎的？」那婦人道：「我不是吃人的。我家離此西下有三百餘里，那裡有座城，叫做寶象國。我是那國王的第三個公主，乳名叫做百花羞。只因十三年前八月十五日夜，玩月中間，被這妖魔一陣狂風攝將來，與他做了十三年夫妻，在此生兒育女，杳無音信回朝。思量我那父母，不能相見。你從何來，被他拿住？」唐僧道：「貧僧乃是差往西天取經者，不期閑步，誤撞在此。如今要拿住我兩個徒弟，一齊蒸吃哩。」那公主陪笑道　：「長老寬心，你既是取經的，我救得你。那寶象國是你西方去的大路，你與我捎一封書兒去，拜上我那父母，我就教他饒了你罷。」三藏點頭道：「女菩薩，若還救得貧僧命，願做捎書寄信人。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    三人の戦いは、ひとまず置こう。洞の中の三蔵は悲しみ泣きながら弟子たちを思い、目に涙を浮かべて言った。三蔵「悟能（ごのう）よ、いったいどこの村で親切な人に会い、施しの食事にかかりきりになっているのだ。悟浄（ごじょう）よ、お前もどこへ探しに行ったのやら、会えたのだろうか。私が妖魔に出くわし、ここで苦しんでいるとは知るまい。いつになればお前たちに会い、この大難を逃れ、早く霊山（れいざん）へ向かえるのだろう。」
    こうして悲しみにくれていると、洞の奥から一人の婦人が出てきた。婦人は定魂樁（ていこんしょう）に手を添えて呼びかけた。婦人「そこの長老、どちらからおいでですか。なぜあの者に、ここへ縛られているのです。」
    三蔵が涙の目でそっと見ると、三十歳ほどの婦人だった。三蔵「お優しいお方、もうお尋ねにならないでください。死ぬ定めゆえ、あなたの家へ入り込んでしまったのです。食べるなら食べてください。何をお聞きになる必要がありましょう。」
    婦人「私は人を食べる者ではありません。私の故郷は、ここから西へ三百里余り行ったところにあります。宝象国（ほうぞうこく）という都です。私はそこの国王の三番目の娘で、幼名を百花羞（ひゃっかしゅう）と申します。十三年前の八月十五日の夜、月を眺めていたところ、この妖魔が起こした激しい風にさらわれました。それから十三年、夫婦として暮らし、子も生みましたが、朝廷へは便り一つ届けられません。父母を恋しく思っても、会うことができないのです。あなたはどこから来て、捕まってしまったのですか。」
    三蔵「私は西天（さいてん）へ経を取りに遣わされた僧です。ふと散歩に出たところ、誤ってここへ来てしまいました。今度は私の弟子二人まで捕らえ、一緒に蒸して食べるつもりなのです。」
    百花羞は笑顔を作って言った。百花羞「長老、ご安心ください。経を取りにゆくお方なら、お救いできます。宝象国は、西へ向かうあなたの道筋にあります。私の手紙を一通持っていき、父母に届けてくだされば、あの者にあなたを放させましょう。」
    三蔵はうなずいた。三蔵「お優しいお方、この命をお救いくださるなら、喜んでお手紙をお届けします。」
  "translation_status": "reviewed"
- "id": "xy-ch29-005"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那公主急轉後面，即修了一紙家書，封固停當。到樁前解放了唐僧，將書付與。唐僧得解脫，捧書在手道：「女菩薩，多謝你活命之恩。貧僧這一去，過貴處，定送國王處。只恐日久年深，你父母不肯相認，奈何？切莫怪我貧僧打了誑語。」公主道：「不妨，我父王無子，止生我三個姊妹，若見此書，必有相看之意。」三藏緊緊袖了家書，謝了公主，就往外走。被公主扯住道：「前門裡你出不去，那些大小妖精都在門外搖旗吶喊，擂鼓篩鑼，助著大王，與你徒弟廝殺哩。你往後門裡去罷。若是大王拿住，還審問審問；只恐小妖兒捉了，不分好歹，挾生兒傷了你的性命。等我去他面前說個方便。若是大王放了你啊，待你徒弟討個示下，尋著你一同好走。」三藏聞言，磕了頭，謹依吩咐，辭別公主，躲離後門之外，不敢自行，將身藏在荊棘叢中。"
  "source_languages":
  - "zh-Hant"

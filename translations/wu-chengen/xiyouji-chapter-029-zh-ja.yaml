  "kind": "paragraph"
  "origin": "source"
  "source_text": "南贍部洲大唐國奉天承運唐天子牒行：切惟朕以涼德，嗣續丕基，事神治民，臨深履薄，朝夕是惴。前者失救涇河老龍，獲譴於我皇皇后帝，三魂七魄，倏忽陰司，已作無常之客。因有陽壽未絕，感冥君放送回生，廣陳善會，修建度亡道場。感蒙救苦觀世音菩薩金身出現，指示西方有佛有經，可度幽亡，超脫孤魂。特著法師玄奘，遠歷千山，詢求經偈。倘到西邦諸國，不滅善緣，照牒放行。須至牒者。大唐貞觀一十三年秋吉日，御前文牒。(上有寶印九顆)"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    南贍部洲（なんせんぶしゅう）大唐国、天の命を奉じて帝位を受けた唐の天子より、通牒する。
    思うに、朕は薄徳の身で大いなる帝業を継ぎ、神に仕え民を治め、深い淵に臨み薄氷を踏む心地で、朝夕おそれ慎んでいる。先ごろ涇河（けいが）の老竜を救い損ねたため、威厳ある上帝（じょうてい）のおとがめを受け、三魂七魄（さんこんしちはく）はたちまち冥府へ赴き、すでに亡き身となった。だが地上の寿命がまだ尽きぬため、冥界の君が送り返して生き返らせてくださった。その恩に報い、大いに善会を催し、死者を救う法会を営んだ。すると救苦の観世音菩薩（かんぜおんぼさつ）が尊いお姿を現し、西方には仏と経があり、冥界の亡者を救い、寄る辺のない魂を苦しみから解き放てると教えてくださった。
    よって特に法師玄奘（げんじょう）に命じ、千山をはるばる越え、経偈を探し求めさせる。西方諸国に至ったならば、この善縁を絶つことなく、本文書に従って通行を認められたい。この旨、通牒する。
    大唐貞観（じょうがん）十三年、秋の吉日。御前の通行文書。
    （上には九つの宝印がある。）
  "translation_status": "reviewed"
- "id": "xy-ch29-014"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王見了，取本國玉寶，用了花押，遞與三藏。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 143
    "line_end": 143
  "translation_ja": "国王は読み終えると、自国の玉璽（ぎょくじ）を取り、花押（かおう）を加えて、三蔵へ返した。"
  "translation_status": "reviewed"
- "id": "xy-ch29-015"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏謝了恩，收了文牒，又奏道：「貧僧一來倒換文牒，二來與陛下寄有家書。」國王大喜道：「有甚書？」三藏道：「陛下第三位公主娘娘，被碗子山波月洞黃袍妖攝將去，貧僧偶爾相遇，故寄書來也。」國王聞言，滿眼垂淚道：「自十三年前不見了公主，兩班文武官也不知貶退了多少，宮內宮外大小婢子、太監也不知打死了多少；只說是走出皇宮，迷失路徑，無處找尋。滿城中百姓人家，也盤詰了無數，更無下落。怎知道是妖怪攝了去。今日乍聽得這句話，故此傷情流淚。」三藏袖中取出書來獻上。國王接了，見有　「平安」二字，一發手軟，拆不開書。傳旨宣翰林院大學士上殿讀書。學士隨即上殿。殿前有文武多官，殿後有后妃宮女，俱側耳聽書。學士拆開朗誦。上寫著："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    三蔵は恩に感謝して通行文書を収め、さらに奏上した。三蔵「私が参りましたのは、一つには文書を改めていただくため、もう一つには陛下へのご家族の手紙をお預かりしているためでございます。」
    国王は大いに喜んだ。国王「どのような手紙だ。」
    三蔵「陛下の第三公主（こうしゅ）は、碗子山（わんしざん）波月洞の黄袍怪にさらわれております。私は偶然お会いしたため、お手紙を届けるよう頼まれたのでございます。」
    国王はこれを聞くと、両の目から涙を流した。国王「十三年前に公主がいなくなってから、文武の官人を何人、降格や罷免にしたことか。宮中や宮外の大小の侍女や宦官も、何人打ち殺したか分からぬ。宮城から出て道に迷ったものとばかり思い、探す当てもなかった。都中の民家を数えきれぬほど問い詰めても、行方は知れなかった。まさか妖怪にさらわれていたとは。今日ふいにその話を聞いたため、悲しみがこみ上げ、涙を抑えられぬのだ。」
    三蔵は袖から手紙を取り出して差し上げた。国王は受け取り、「平安」の二字を見ると、なおさら手が震え、封を開けることもできない。そこで翰林院大学士（かんりんいんだいがくし）を呼び、殿上で読むよう命じた。大学士はすぐに上殿した。前には文武の官人たち、後ろには妃や宮女たちが並び、みな耳を傾ける。大学士が封を開き、声に出して読んだ。そこには、こう書かれていた。
  "translation_status": "reviewed"
- "id": "xy-ch29-016"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不孝女百花羞頓首百拜大德父王萬歲龍鳳殿前，暨三宮母后昭陽宮下，及舉朝文武賢卿臺次：拙女幸托坤宮，感激劬勞萬種。不能竭力怡顏，盡心奉孝。乃於十三年前八月十五日良夜佳辰，蒙父王恩旨，著各宮排宴，賞玩月華，共樂清霄盛會。正歡娛之間，不覺一陣香風，閃出個金睛藍面青髮魔王，將女擒住，駕祥光，直帶至半野山中無人處，難分難辨，被妖倚強，霸占為妻。是以無奈捱了一十三年，產下兩個妖兒，盡是妖魔之種。論此真是敗壞人倫，有傷風化，不當傳書玷辱。但恐女死之後，不顯分明。正含怨思憶父母，不期唐朝聖僧亦被魔王擒住。是女滴淚修書，大膽放脫，特托寄此片楮，以表寸心。伏望父王垂憫，遣上將早至碗子山波月洞捉獲黃袍怪，救女回朝，深為恩念。草草欠恭，面聽不一。逆女百花羞再頓首頓首。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    不孝の娘、百花羞より、幾重にも頭を垂れて申し上げます。大いなる徳を備えた父王陛下の龍鳳殿（りゅうほうでん）御前、ならびに三宮（さんぐう）の母后さまの昭陽宮御前、また朝廷の文武の賢臣の皆さまへ。
    この愚かな娘は幸いにも王家の后のお腹に生まれ、育てていただいた幾万ものご苦労に感謝しております。それなのに、力を尽くしてお喜ばせし、心の限り孝を尽くすことができませんでした。十三年前の八月十五日、佳き夜の佳き時に、父王のお許しで各宮に宴を設け、月の光を賞で、晴れた夜の盛会をともに楽しんでおりました。喜び楽しむさなか、思いがけず一陣の香る風が吹き、金の目、藍の顔、青い髪の魔王が現れ、娘を捕らえました。めでたい光に乗り、野山の途中の人もいない所へ、まっすぐ連れていったのです。訳も分からず、言い分も通らぬまま、妖怪の力に任せて妻にされました。
    なすすべもなく十三年を耐え忍び、二人の妖児を生みました。どちらも妖魔の子です。このことを思えば、まことに人の道を損ない、世の教えを傷つけた身であり、手紙を差し上げてご名誉を汚すべきではございません。ただ、娘が死んだ後に、事情が明らかにならぬことを恐れております。
    恨みを抱えて父母をお慕いしていたところ、思いがけず唐の聖僧も魔王に捕らえられました。そこで娘は涙を落としながら手紙を書き、思い切ってあの方を逃がし、この一片の紙を託して、ささやかな心の内をお伝えする次第です。
    どうか父王、あわれみをおかけください。優れた将軍を急ぎ碗子山波月洞へ遣わし、黄袍怪を捕らえ、娘を朝廷へお救い戻しくだされば、深くご恩に感じ入ります。取り急ぎ、礼を欠く文にて失礼いたします。お目にかかってお聞きいただくことは、書き尽くせません。不孝の娘、百花羞、重ねて頭を垂れ、つつしんで申し上げます。
  "translation_status": "reviewed"
  "issues":

  "source_text": "國王又問道：「長老此去，有何兵器與他交戰？」八戒腰裡掣出鈀來道：「老豬使的是釘鈀。」國王笑道：「可敗壞門面。我這裡有的是鞭、簡、瓜、鎚，刀、槍、鉞、斧，劍、戟、矛、鐮，隨你選稱手的拿一件去。那鈀算做甚麼兵器？」八戒道：「陛下不知。我這鈀雖然粗夯，實是自幼隨身之器。曾在天河水府為帥，轄押八萬水兵，全仗此鈀之力。今臨凡世，保護吾師，逢山築破虎狼窩，遇水掀翻龍蜃穴，皆是此鈀。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    国王はまた尋ねた。国王「長老、今度はどのような武器で、あの者と戦うのだ。」
    八戒は腰から熊手を抜いた。八戒「この俺が使うのは、釘鈀（ていは）です。」
    国王は笑った。国王「それでは格好がつかぬ。ここには鞭（べん）、簡（かん）、瓜（か）、鎚（つい）、刀、槍、鉞（まさかり）、斧、剣、戟（げき）、矛、鎌と、いくらでもある。手に合うものを好きに一つ選んで持っていくがよい。その熊手が、何の武器になるものか。」
    八戒「陛下はご存じありません。この熊手は見た目こそ無骨ですが、幼いころからの得物です。かつて天河（てんが）の水府（すいふ）で元帥となり、八万の水兵を率いていたときも、ひとえにこの熊手の力に頼ったもの。今は人の世に下り、わが師を守って、山に会えば虎狼の巣を打ち破り、水に会えば龍や蜃（しん）の住みかをひっくり返す。みな、この熊手の働きです。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "兵器の列挙は底本の「鞭、簡、瓜、鎚、刀、槍、鉞、斧、劍、戟、矛、鐮」を保持した。「簡」は鉄の棒状の武器、「瓜」は瓜形の頭部を持つ打撃武器と解し、別版の漢字へ原文を訂正していない。"
- "id": "xy-ch29-024"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王聞得此言，十分歡喜心信。即命九嬪妃子：「將朕親用的御酒整瓶取來，權與長老送行。」遂滿斟一爵，奉與八戒道：「長老，這杯酒，聊引奉勞之意。待捉得妖魔，救回小女，自有大宴相酬，千金重謝。」那獃子接杯在手，人物雖是粗魯，行事倒有斯文，對三藏唱個大喏道：「師父，這酒本該從你飲起；但君王賜我，不敢違背，讓老豬先吃了，助助興頭，好捉妖怪。」那獃子一飲而乾，才斟一爵，遞與師父。三藏道：「我不飲酒，你兄弟們吃罷。」沙僧近前接了。八戒就足下生雲，直上空裡。國王見了道：「豬長老又會騰雲？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 155
    "line_end": 155
  "translation_ja": |-
    国王はそれを聞いて、大いに喜び、心から信じた。さっそく九嬪（きゅうひん）の妃たちに命じた。国王「私が飲む御酒を、瓶ごと持ってまいれ。ひとまず長老の出陣を送ろう。」
    一爵（しゃく）になみなみと注ぎ、八戒へ差し出した。国王「長老、この一杯に、まず労をねぎらう心を託す。妖魔を捕らえ、娘を救い出したなら、大宴を設けて迎え、千金で厚く礼をしよう。」
    八戒は杯を受け取った。見かけは粗野でも振る舞いには礼をわきまえ、三蔵へ深く拱手して言った。八戒「お師匠さま、本来ならこの酒は、まずあなたから召し上がるものです。しかし王様が私に下さったものですから、背くわけにはいきません。この私が先に頂き、勢いをつけて妖怪を捕らえてまいります。」
    八戒は一息に飲み干すと、改めて一爵を注ぎ、師に渡した。三蔵「私は酒を飲まない。お前たちで飲みなさい。」
    沙悟浄が進み出て杯を受け取った。そのとき八戒は足元に雲を生じさせ、まっすぐ空へ上がった。国王は見て言った。国王「猪長老は、雲にも乗れるのか。」
  "translation_status": "reviewed"
- "id": "xy-ch29-025"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "獃子去了，沙僧將酒亦一飲而乾，道：「師父，那黃袍怪拿住你時，我兩個與他交戰，只戰個手平。今二哥獨去，恐戰不過他。」三藏道：「正是，徒弟啊，你可去與他幫幫功。」沙僧聞言，也縱雲跳將起去。那國王慌了，扯住唐僧道：「長老，你且陪寡人坐坐，也莫騰雲去了。」唐僧道：「可憐，可憐，我半步兒也去不得。」此時二人在殿上敘話不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    八戒が去ると、沙悟浄も酒を一息に飲み干して言った。沙悟浄「お師匠さま、黄袍怪があなたを捕らえたとき、私たち二人で戦っても、ようやく互角でした。今度は二番目の兄弟子が一人で行きましたから、敵わないのではと案じます。」
    三蔵「そうだとも。お前も行って、力を貸してやりなさい。」
    沙悟浄は言葉を受けると、やはり雲に飛び乗って行った。国王は慌てて三蔵をつかんだ。国王「長老、あなたは少しここにいて、私の相手をしてくれ。あなたまで雲に乗って行かないでくれ。」
    三蔵「いや、情けないことに、私には半歩も空へは上がれません。」
    二人が殿上で話を交わすことは、ひとまず置く。
  "translation_status": "reviewed"

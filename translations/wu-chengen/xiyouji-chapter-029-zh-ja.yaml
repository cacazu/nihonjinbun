  "translation_ja": |-
    詩にいう。
    妄想は、ことさらに力ずくで滅ぼさずともよい。真如（しんにょ）を、何ゆえ外に求めよう。本来のおのが本性を仏の前で修めるのだ。迷いと悟りに、どうして前後の隔たりがあろう。
    悟れば一瞬にして正しき道に至り、迷えば万劫（まんごう）ものあいだ沈み流れる。一念をまことの修行にかなわせるなら、恒河（ごうが）の砂ほどの罪の穢れも、ことごとく消し去れよう。

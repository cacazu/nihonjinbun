  "translation_ja": |-
    さて沙悟浄は八戒に追いついて呼びかけた。沙悟浄「兄貴、来たぞ。」
    八戒「兄弟、なぜ来たんだ。」
    沙悟浄「お師匠さまに、力を貸すよう言いつかってきた。」
    八戒は大喜びした。八戒「もっともだ、よく来た。二人で力を合わせ、あの化け物を捕まえよう。どうであれ、この国で名を揚げてやろうじゃないか。」
    見れば、

    "line_end": 128
  "translation_ja": |-
    百花羞は急いで奥へ戻り、さっそく家族への手紙をしたため、きちんと封をした。それから柱の前に来て三蔵の縄を解き、手紙を渡した。自由になった三蔵は、手紙を両手で持って言った。三蔵「お優しいお方、命を救ってくださったご恩、ありがたく存じます。これからお国を通る際、必ず国王にお届けします。ただ、長い年月がたったため、ご両親が娘と認めてくださらなければ、どうしましょう。そのときは、私が嘘をついたとお責めにならないでください。」
    百花羞「心配はいりません。父王に息子はなく、娘は私たち三姉妹だけです。この手紙をご覧になれば、きっと会いたいと思ってくださいます。」
    三蔵は家書をしっかり袖にしまい、百花羞に礼を言って外へ出ようとした。すると百花羞が引き止めた。百花羞「表からは出られません。大小の妖怪たちが外で旗を振り、声を張り上げ、太鼓や鉦を鳴らして、あなたのお弟子たちと戦う大王を応援しています。裏口からお出になってください。大王に見つかれば、まだ事情を問いただしてくれるでしょうが、小妖に捕まると、訳も聞かず、いきなり命を奪われかねません。私が大王のところへ行って、うまく取りなします。大王があなたを許したら、お弟子たちが居場所を尋ね、迎えに来るのを待って、一緒にお発ちください。」
    三蔵は頭を地につけて礼をし、言いつけをつつしんで守った。百花羞に別れを告げて裏口の外へ逃れたものの、一人では先へ行けず、茨の茂みに身を隠した。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「挾生兒」は乱暴に、無造作に命を奪う意に採った。後半の「待你徒弟討個示下」は、弟子たちが三蔵の居場所を教わって迎えに来るのを待つ意に解し、公主自身が同行するとはしない。"
- "id": "xy-ch29-006"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說公主娘娘心生巧計，急往前來，出門外，分開了大小群妖。只聽得叮叮噹噹，兵刃亂響。原來是八戒、沙僧與那怪在半空裡廝殺哩。這公主厲聲高叫道：「黃袍郎！」那妖王聽得公主叫喚，即丟了八戒、沙僧，按落雲頭，揪了鋼刀，攙著公主道：「渾家，有甚話說？」公主道：「郎君啊，我才時睡在羅幃之內，夢魂中，忽見個金甲神人。」妖魔道：「那個金甲神？上我門怎的？」公主道：「是我幼時在宮內，對人暗許下一樁心願：若得招個賢郎駙馬，上名山，拜仙府，齋僧佈施。自從配了你，夫妻們歡會，到今不曾題起。那金甲神人來討誓願，喝我醒來，卻是南柯一夢。因此，急整容來郎君處訴知，不期那樁上綁著一個僧人。萬望郎君慈憫，看我薄意，饒了那個和尚罷，只當與我齋僧還願。不知郎君肯否？」那怪道：「渾家，你卻多心吶，甚麼打緊之事。我要吃人，那裡不撈幾個吃吃，這個把和尚到得那裡？放他去罷。」公主道：「郎君，放他從後門裡去罷。」妖魔道：「奈煩哩，放他去便罷，又管他甚麼後門前門哩。」他遂綽了鋼刀，高叫道：「那豬八戒，你過來。我不是怕你，不與你戰；看著我渾家的分上，饒了你師父也。趁早去後門首尋著他，往西方去罷。若再來犯我境界，斷乎不饒。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    さて百花羞は巧みな計を思いつき、急いで表へ行った。外へ出て大小の妖怪たちをかき分けると、かんかん、がちゃんがちゃんと、兵刃の打ち合う音が乱れ響いていた。八戒と沙悟浄が、黄袍怪と空中で戦っているのだった。百花羞は声を張り上げた。百花羞「黄袍郎（こうほうろう）！」
    妻の声を聞いた黄袍怪は、八戒と沙悟浄をそのままにして雲を降り、鋼の刀を握ったまま百花羞を支えた。黄袍怪「お前、何か用か。」
    百花羞「あなた、先ほど薄絹の帳の中で眠っていましたら、夢の中に金の鎧を着た神が現れました。」
    黄袍怪「どの金甲の神だ。うちへ何しに来た。」
    百花羞「幼いころ宮中で、ひそかに願を掛けたのです。よい婿を迎えられたら、名山や仙人の住まいを訪ね、僧に食事を施し、喜捨をしよう、と。あなたに嫁いでからは、夫婦仲よく楽しく暮らし、今まで一度も言い出さずにおりました。その金甲の神が誓いを果たせと言って、私を叱り起こしたのです。目覚めてみれば、南柯（なんか）の夢にすぎませんでした。そこで急いで身なりを整え、あなたにお伝えしようと来たところ、あの柱に僧が一人縛られていたのです。どうか慈悲をおかけになり、私に免じて、あの和尚をお許しくださいませ。僧に食事を施して、私の願を果たしたことにしてください。聞き入れてくださいますか。」
    黄袍怪「お前は気を回しすぎだ。そんなこと、何ほどのものでもない。人間を食おうと思えば、どこでだって何人か捕まえられる。僧の一人や二人が何だというのだ。放してやれ。」
    百花羞「あなた、裏口から逃がしてやってくださいませ。」
    黄袍怪「しつこいな。放してやればいいのだ。裏口だろうと表だろうと、知ったことか。」
    黄袍怪は刀をつかみ直し、大声で叫んだ。黄袍怪「おい猪八戒（ちょはっかい）、こっちへ来い。怖くてお前との戦いをやめるのではないぞ。女房に免じて、師匠を許してやるのだ。さっさと裏口へ行き、師匠を見つけて西へ向かえ。二度と俺の縄張りを侵すな。今度は決して許さんぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch29-007"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒與沙僧聞得此言，就如鬼門關上放回來的一般，即忙牽馬挑擔，鼠攛而行。轉過那波月洞後門之外，叫聲：「師父。」那長老認得聲音，就在那荊棘中答應。沙僧就剖開草徑，攙著師父，慌忙的上馬。這裡："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    八戒と沙悟浄はこれを聞くと、まるで鬼門関（きもんかん）から生きて返されたような気持ちになった。急いで馬を引き、荷を担ぎ、鼠のように逃げ足を速める。波月洞（はげつどう）の裏口へ回り、二人で呼んだ。八戒と沙悟浄「お師匠さま！」
    三蔵はその声と分かって、茨の中から返事をした。沙悟浄が草を分けて道を開き、師を助け出して、大急ぎで馬に乗せた。まさに、
  "translation_status": "reviewed"
- "id": "xy-ch29-008"
  "section_id": "chapter-29"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    狠毒險遭青面鬼，慇懃幸有百花羞。
    鰲魚脫卻金鉤釣，擺尾搖頭逐浪遊。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 132
    "line_end": 133
  "translation_ja": |-
    青い顔の鬼の毒手に、危うく命を落とすところ、幸いにも情け深い百花羞に救われた。
    鰲魚（ごうぎょ）が金の釣り針を抜け出せば、尾を振り頭を振って、波を追い自由に泳ぎゆく。
  "translation_status": "reviewed"
- "id": "xy-ch29-009"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒當頭領路，沙僧後隨，出了那松林，上了大路。你看他兩個嚌嚌嘈嘈，埋埋怨怨，三藏只是解和。遇晚先投宿，雞鳴早看天。一程一程，長亭短亭，不覺的就走了二百九十九里。猛擡頭，只見一座好城，就是寶象國。真好個處所也："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 135
    "line_end": 135
  "translation_ja": "八戒が先頭に立ち、沙悟浄が後ろに従って、松林を出て街道へ上がった。二人はがやがやと不平を言い合い、三蔵はただ仲を取りなすばかり。夕暮れになれば早めに宿を取り、鶏が鳴けばもう空の様子を見る。一行程また一行程、長亭（ちょうてい）短亭（たんてい）を過ぎるうち、いつしか二百九十九里を歩いていた。ふと顔を上げると、見事な都がある。それこそ宝象国だった。実によい所である。"
  "translation_status": "reviewed"
- "id": "xy-ch29-010"
  "section_id": "chapter-29"
  "kind": "verse"
  "origin": "source"
  "source_text": "雲渺渺，路迢迢。地雖千里外，景物一般饒。瑞靄祥煙籠罩，清風明月招搖。嵂嵂崒崒的遠山，大開圖畫；潺潺湲湲的流水，碎濺瓊瑤。可耕的連阡帶陌，足食的密蕙新苗。漁釣的幾家三澗曲，樵採的一擔兩峰椒。廓的廓，城的城，金湯鞏固；家的家，戶的戶，只鬥逍遙。九重的高閣如殿宇，萬丈的層臺似錦標。也有那太極殿、華蓋殿、燒香殿、觀文殿、宣政殿、延英殿，一殿殿的玉陛金階，擺列著文冠武弁；也有那大明宮、昭陽宮、長樂宮、華清宮、建章宮、未央宮，一宮宮的鐘鼓管籥，撒抹了閨怨春愁。也有禁苑的露花勻嫩臉，也有御溝的風柳舞纖腰。通衢上，也有個頂冠束帶的，盛儀容，乘五馬；幽僻中，也有個持弓挾矢的，撥雲霧，貫雙鵰。花柳的巷，管弦的樓，春風不讓洛陽橋。取經的長老，回首大唐肝膽裂；伴師的徒弟，息肩小驛夢魂消。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    雲ははるかに広がり、道は遠く続く。故郷から千里も離れた土地ながら、景物の豊かさは少しも変わらぬ。めでたい靄と霞が辺りを包み、清風と明月が人を誘う。高く険しい遠山は、大きく繰り広げた絵のよう。さらさらと流れる水は、砕け散る美玉のよう。
    耕す田畑は畦道で縦横につながり、食を満たす畑には蕙（けい）と若苗が密に茂る。釣りをする家々は三つの渓流の曲がりに並び、木こりは一荷を担いで二つの峰の頂を行く。外郭も城壁も、金城湯池（きんじょうとうち）の堅固さを誇り、家々では誰もが気楽な暮らしを競う。九重の高楼は宮殿のよう、万丈の幾層もの楼台は錦の旗標さながら。
    太極殿（たいきょくでん）、華蓋殿（かがいでん）、焼香殿（しょうこうでん）、観文殿（かんぶんでん）、宣政殿（せんせいでん）、延英殿（えんえいでん）もあり、どの殿も玉のきざはしに金の階段、冠を戴いた文官と武官が居並ぶ。大明宮（だいめいきゅう）、昭陽宮（しょうようきゅう）、長楽宮（ちょうらくきゅう）、華清宮（かせいきゅう）、建章宮（けんしょうきゅう）、未央宮（びおうきゅう）もあり、どの宮にも鐘や太鼓、管笛の音が響いて、閨の恨みや春の憂いを払い去る。
    禁苑（きんえん）では露を帯びた花が幼い顔を整え、宮中の堀では風に吹かれた柳が細腰を踊らせる。大通りには冠をかぶり帯を締め、威儀を正して五馬（ごば）の車に乗る人もいれば、人けのない奥地には弓矢を携え、雲霧をかき分けて双鵰（そうちょう）を射抜く人もいる。花柳の巷、管弦の楼。その春のにぎわいは、洛陽橋（らくようきょう）にも引けを取らぬ。
    経を求める三蔵は、大唐（だいとう）の方を振り返っては胸が張り裂け、師に付き添う弟子たちは、小さな宿駅で肩の荷を下ろしても、夢の中まで心が乱れる。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "底本の「密蕙新苗」は「蕙」の字を保持した。食を満たす農地の文脈には「穗」等の可能性も考えられるが、別字へ補訂せず、蕙と若苗が茂る描写とした。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「錦標」は錦の旗標の像を採った。「五馬」は五頭立ての車と地方長官の威儀、「貫雙鵰」は一度に二羽を射る技を示す表現と解した。宮殿名の列挙を保持し、時代・国の異なる実在建築と同一視していない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「夢魂消」は前句の「肝膽裂」との対を踏まえ、夢の中にまで及ぶ心の乱れと解する。「夢魂」「消魂」の一般語義は教育部辞典で確認したが、この一句の解釈を直接示す注釈は未確認。"
- "id": "xy-ch29-011"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "看不盡寶象國的景致。師徒三眾收拾行李、馬匹，安歇館驛中。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 138
    "line_end": 138
  "translation_ja": "宝象国の景色は、とても見尽くせなかった。師弟三人は荷物と馬を落ち着け、駅館に宿を取った。"
  "translation_status": "reviewed"
- "id": "xy-ch29-012"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "唐僧步行至朝門外，對閣門大使道：「有唐朝僧人，特來面駕，倒換文牒，乞為轉奏轉奏。」那黃門奏事官連忙走至白玉階前奏道：「萬歲，唐朝有個高僧，欲求見駕，倒換文牒。」那國王聞知是唐朝大國，且又說是個方上聖僧，心中甚喜，即時准奏。叫：「宣他進來。」把三藏宣至金階，舞蹈山呼禮畢。兩邊文武多官無不嘆道：「上邦人物，禮樂雍容如此。」那國王道：「長老，你到我國中何事？」三藏道：「小僧是唐朝釋子，承我天子敕旨，前往西方取經。原領有文牒，到陛下上國，理合倒換。故此不識進退，驚動龍顏。」國王道：「既有唐天子文牒，取上來看。」三藏雙手捧上去，展開放在御案上。牒云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 139
    "line_end": 139
  "translation_ja": |-
    三蔵は歩いて宮門へ行き、閣門大使（かくもんたいし）に申し入れた。三蔵「唐（とう）から参った僧です。通行文書を改めていただくため、陛下へのお目通りをお願いに参りました。どうかお取り次ぎください。」
    黄門奏事官（こうもんそうじかん）は急いで白玉の階段の前へ進み、奏上した。黄門奏事官「陛下、唐から高僧が参り、通行文書を改めるため、お目通りを願っております。」
    国王は大国の唐から来たと聞き、しかも方々を巡る聖僧だというので、大いに喜んで、ただちに願いを認めた。国王「中へ通せ。」
    三蔵は金の階段の前へ召し出され、舞踏の拝礼と万歳の礼を終えた。左右の文武の官人たちは、みな感嘆した。文武の官人たち「さすが大国の方、礼法のなんとゆったりと立派なことか。」
    国王「長老、わが国へは何の用で参った。」
    三蔵「私は唐の仏弟子で、わが天子の勅命を受け、西方へ経を取りにまいります。通行文書を頂いておりますので、陛下のお国へ参った以上、これを改めていただくのが道理と存じます。そこで身の程もわきまえず、お目を煩わせました。」
    国王「唐の天子の文書があるなら、持ってまいれ。見てみよう。」
    三蔵は両手で捧げ、広げて御机の上へ置いた。文書には、こうあった。
  "translation_status": "reviewed"

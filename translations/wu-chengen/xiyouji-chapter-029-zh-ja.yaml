  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子聽見來請，對沙僧道：「兄弟，你還不教下書哩，這才見了下書的好處。想是師父下了書，國王道，捎書人不可怠慢，一定整治筵宴待他；他的食腸不濟，有你我之心，舉出名來，故此著金牌來請。大家吃一頓，明日好行。」沙僧道：「哥啊，知道是甚緣故，我們且去來？」遂將行李、馬匹俱交付驛丞，各帶隨身兵器，隨金牌入朝。早行到白玉階前，左右立下，朝上唱個喏，再也不動。那文武多官，無人不怕。都說道：「這兩個和尚貌醜也罷，只是粗俗太甚，怎麼見我王更不下拜，喏畢平身，挺然而立？可怪，可怪。」八戒聽見道：「列位，莫要議論，我們是這般：乍看果有些醜，只是看下些時來，卻也耐看。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 150
    "line_end": 150
  "translation_ja": |-
    八戒は迎えが来たと聞くと、沙悟浄へ言った。八戒「兄弟、お前は手紙を届けるのを止めようとしていたが、どうだ、届けたおかげで得をしたじゃないか。お師匠さまが手紙を渡したから、王様は手紙を持ってきた人を粗末には扱えないと思って、きっとご馳走を用意したんだ。お師匠さまは食が細いうえ、俺たちのことも気に掛けて、名前を出してくださった。それで金牌を持った使いが来たんだろう。みんなでひと腹食べて、明日出発するとしよう。」
    沙悟浄「兄貴、どんな事情かは分からない。ひとまず行ってみようじゃないか。」
    荷物と馬はすべて駅の役人へ預け、各々得物を持ち、金牌の使いに従って宮中へ入った。ほどなく白玉の階段の前へ来ると、左右に立ち、上座へ向けて拱手（きょうしゅ）の礼をしたきり、動かなくなった。文武の官人はみな怖がりながら、口々に言った。文武の官人たち「二人の和尚は顔が醜いのは仕方ないとしても、あまりに無作法だ。なぜわが王にひざまずいて拝礼せず、一礼しただけで体を起こし、ぴんと立っているのだ。まったくおかしなことだ。」
    八戒はそれを聞いて言った。八戒「皆さん、あれこれ言わないでください。俺たちはこういうものでしてね。一目見ると確かに少し醜いが、しばらく見ていれば、なかなか見られる顔ですよ。」
  "translation_status": "reviewed"
- "id": "xy-ch29-021"
  "section_id": "chapter-29"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王見他醜陋，已是心驚。及聽得那獃子說出話來，越發膽顫，就坐不穩，跌下龍床。幸有近侍官員扶起。慌得個唐僧跪在殿前，不住的叩頭道：「陛下，貧僧該萬死，萬死。我說徒弟醜陋，不敢朝見，恐傷龍體，果然驚了駕也。」那國王戰兢兢走近前，攙起道：「長老，還虧你先說過了；若未說，猛然見他，寡人一定諕殺了也。」國王定性多時，便問：「豬長老、沙長老，是那一位善於降妖？」那獃子不知好歹，答道：「老豬會降。」國王道：「怎麼家降？」八戒道：「我乃是天蓬元帥，只因罪犯天條，墮落下世，幸今皈正為僧。自從東土來此，第一會降妖的是我。」國王道：「既是天將臨凡，必然善能變化。」八戒道：「不敢，不敢，也將就曉得幾個變化兒。」國王道：「你試變一個我看看。」八戒道：「請出題目，照依樣子好變。」國王道：「變一個大的罷。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch29-1455578"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第029回&oldid=1455578"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    国王は二人の醜い姿を見て、すでにぎょっとしていた。そこへ八戒の言葉を聞いて、ますます肝を冷やし、座っていられず王座から転げ落ちた。幸い近侍の役人たちが助け起こしたが、三蔵は慌てて殿前にひざまずき、頭を幾度も地につけて言った。三蔵「陛下、私は万死に値します。申し訳ございません。弟子は醜いのでお目通りさせてはお体に障るかと申しましたが、やはりお驚かせしてしまいました。」
    国王は震えながら近寄り、三蔵を助け起こした。国王「長老、先に聞かせてくれて助かった。聞かずにいきなり見たら、私はきっと驚き死んだことだろう。」
    ずいぶんたって、ようやく心を落ち着けた国王は尋ねた。国王「猪長老（ちょちょうろう）、沙長老（さちょうろう）、妖怪退治が得意なのは、どちらかな。」
    八戒は身の程も考えず答えた。八戒「この俺が退治できます。」
    国王「どう退治するのだ。」
    八戒「私は天蓬元帥（てんぽうげんすい）でございました。天の法に背いたため下界へ落とされましたが、幸い今は正道に帰し、僧となりました。東土を出てここへ来るまで、妖怪退治で一番なのは私です。」
    国王「天将が下ったのなら、きっと変化の術も得意であろう。」
    八戒「いえいえ、たいしたことはありませんが、いくつかの変化ならどうにか分かります。」
    国王「ひとつ変じて見せてくれ。」
    八戒「お題を出してください。それに合わせれば変じやすい。」
    国王「大きなものになってみよ。」
  "translation_status": "reviewed"
- "id": "xy-ch29-022"

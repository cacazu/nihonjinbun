  translation_ja: '第五十七回

    本物の行者は落伽山で苦しみを訴え　偽の猿王は水簾洞で文書を写す'
  translation_status: reviewed
- id: xy-ch57-002
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 卻說孫大聖惱惱悶悶，起在空中，欲待回花果山水簾洞，恐本洞小妖見笑，笑我出乎爾反乎爾，不是個大丈夫之器；欲待要投奔天宮，又恐天宮內不容久住；欲待要投海島，卻又羞見那三島諸仙；欲待要奔龍宮，又不伏氣求告龍王。真個是無依無倚。苦自忖量道：「罷罷罷，我還去見我師父，還是正果。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 118
    line_end: 118
  translation_ja: 'さて、悟空（ごくう）は腹立ちと憂いを抱えて空へ舞い上がった。花果山（かかざん）の水簾洞（すいれんどう）へ帰ろうかと思ったが、洞の小妖怪たちに、出て行ったり帰って来たり、立派な男のすることではないと笑われそうだ。天宮（てんきゅう）に身を寄せようにも、長居は許されまい。海の島へ行こうかとも思ったが、三島（さんとう）の仙人たちに顔を合わせるのが恥ずかしい。竜宮（りゅうぐう）へ行くにしても、竜王に頼み込むのは癪に障る。まことに身を寄せる先も、頼る者もなかった。思いあぐねて、悟空は独り言を漏らした。

    悟空「もういい、もういい、もういい。やっぱりお師匠さまに会いに戻ろう。それこそが悟りを成し遂げる道だ。」'
  translation_status: reviewed
- id: xy-ch57-003
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 遂按下雲頭，徑至三藏馬前侍立道：「師父，恕弟子這遭！向後再不敢行兇，——受師父教誨。千萬還得我保你西天去也。」唐僧見了，更不答應，兜住馬，即念緊箍兒咒。顛來倒去，又念有二十餘遍。把大聖咒倒在地，箍兒陷在肉裡有一寸來深淺，方才住口道：「你不回去，又來纏我怎的？」行者只教：「莫念，莫念。我是有處過日子的，只怕你無我去不得西天。」三藏發怒道：「你這猢猻殺生害命，連累了我多少，如今實不要你了。我去得去不得，不干你事。快走，快走，遲了些兒，我又念真言，這番決不住口，把你腦漿都勒出來哩。」大聖疼痛難忍，見師父更不回心，沒奈何，只得又駕觔斗雲，起在空中。忽然省悟道：「這和尚負了我心，我且向普陀崖告訴觀音菩薩去來。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 120
    line_end: 120
  translation_ja: '悟空は雲を下ろし、まっすぐ三蔵（さんぞう）の馬の前へ行って、かしこまって立った。

    悟空「お師匠さま、弟子の私を、今度だけはお許しください！　これからは二度と乱暴はいたしません。お師匠さまのお教えに従います。どうか、引き続き私にお守りさせて、西天（さいてん）へお連れさせてください。」

    三蔵は悟空を見ても返事をせず、馬の手綱を引き止めるなり、緊箍児呪（きんこじじゅ）を唱え始めた。繰り返し、繰り返し、また二十余遍も唱える。悟空は地面へ倒れ、輪は肉に一寸（すん）ほども食い込んだ。それからようやく三蔵は唱えるのをやめた。

    三蔵「帰りもせず、また私につきまとうとは何事だ。」

    悟空「唱えないでください、唱えないでください！　私には暮らしていく所があります。ただ、私がいなければ、お師匠さまは西天へ行けないのではと心配なのです。」

    三蔵は怒った。

    三蔵「この猿め、人の命を奪い、私にどれほど迷惑をかけたことか。今度こそお前は要らぬ。私が行けようと行けまいと、お前には関わりのないことだ。早く行け、早く行け！　少しでもぐずぐずすれば、また真言を唱える。今度は決してやめず、お前の脳髄が絞り出されるまで締めつけてやるぞ。」

    悟空は痛みに耐えかね、師の心がどうしても変わらないのを見て、なすすべもなかった。また觔斗雲（きんとうん）に乗り、空へ舞い上がるほかない。ふと、悟空は思い当たった。

    悟空「あの坊主は、俺の真心を裏切った。ひとまず普陀崖（ふだがい）へ行って、観音菩薩（かんのんぼさつ）に訴えてこよう。」'
  translation_status: reviewed
- id: xy-ch57-004
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 好大聖，撥回觔斗，那消一個時辰，早至南洋大海。住下祥光，直至落伽山上，撞入紫竹林中，忽見木叉行者迎面作禮道：「大聖何往？」行者道：「要見菩薩。」木叉即引行者至潮音洞口，又見善財童子作禮道：「大聖何來？」行者道：「有事要告菩薩。」善財聽見一個「告」字，笑道：「好刁嘴猴兒，還像當時我拿住唐僧被你欺哩。我菩薩是個大慈大悲、大願大乘、救苦救難、無邊無量的聖善菩薩，有甚不是處，你要告他？」行者滿懷悶氣，一聞此言，心中怒發，咄的一聲，把善財童子喝了個倒退，道：「這個背義忘恩的小畜生，著實愚魯！你那時節作怪成精，我請菩薩收了你，皈正迦持，如今得這等極樂長生，自在逍遙，與天同壽，還不拜謝老孫，轉倒這般侮慢。我是有事來告求菩薩，卻怎麼說我刁嘴要告菩薩？」善財陪笑道：「還是個急猴子。我與你作笑耍子，你怎麼就變臉了？」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 121
    line_end: 121
  translation_ja: 'さすが悟空、宙返りの向きを変えると、一時辰（いちじしん）もかからず南の大海へ着いた。瑞光を止め、まっすぐ落伽山（らっかさん）へ下り、紫竹林（しちくりん）へ飛び込む。すると、恵岸行者（えがんぎょうじゃ）が向こうから来て礼をした。

    恵岸行者「大聖（たいせい）、どちらへおいでですか。」

    悟空「菩薩さまにお目にかかりたい。」

    恵岸行者に連れられて潮音洞（ちょうおんどう）の入口へ行くと、今度は善財童子（ぜんざいどうじ）となった紅孩児（こうがいじ）が礼をした。

    紅孩児「大聖、どうしていらしたのです。」

    悟空「菩薩さまに訴えたいことがある。」

    「訴える」という言葉を聞くと、紅孩児は笑った。

    紅孩児「口の悪い猿ですね。私が三蔵を捕らえて、あなたにひどい目に遭わされたあのころと同じだ。私たちの菩薩さまは、大慈大悲を備え、大きな誓願を立てて大乗（だいじょう）の道を行い、苦しむ者も難儀する者も救い、限りも果てもない、聖なる善き菩薩さまですよ。どんな落ち度があって、あなたは訴え出ようというのです。」

    胸いっぱいに鬱憤をためていた悟空は、この言葉にかっとなった。悟空「こらっ！」

    その一喝で紅孩児を後ずさりさせると、さらに怒鳴った。

    悟空「この恩知らずの小畜生め、ほんとうに物の分からぬ奴だ！　あのときお前は妖怪になって悪さをしていた。俺が菩薩さまをお呼びしてお前を取り押さえていただき、正しい道へ帰依させ、お加護を授けていただいたのだ。それで今は、こんな極楽の長生きをして、気ままにのびのびと、天と同じ寿命を得ている。それなのに俺に礼もせず、逆にそんな侮り方をするのか。俺は用があって菩薩さまに訴え、おすがりしに来たのだ。どうして口汚く菩薩さまを訴え出るなどと言う！」

    紅孩児は愛想笑いをした。

    紅孩児「相変わらず、せっかちな猿ですね。私はちょっと冗談を言っただけですよ。どうしてすぐ顔色を変えるのです。」'
  translation_status: reviewed
- id: xy-ch57-005
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 正講處，只見白鸚哥飛來飛去，知是菩薩呼喚，木叉與善財遂向前引導，至寶蓮臺下。行者望見菩薩，倒身下拜，止不住淚如泉湧，放聲大哭。菩薩教木叉與善財扶起道：「悟空，有甚傷感之事，明明說來。莫哭，莫哭，我與你救苦消災也。」行者垂淚再拜道：「當年弟子為人，曾受那個氣來？自蒙菩薩解脫天災，秉教沙門，保護唐僧往西天拜佛求經，我弟子捨身拚命，救解他的魔障，就如老虎口裡奪脆骨，蛟龍背上揭生鱗。只指望歸真正果，洗孽除邪。怎知那長老背義忘恩，直迷了一片善緣，更不察皂白之苦。」菩薩道：「且說那皂白原因來我聽。」行者即將那打殺草寇前後始終，細陳了一遍。卻說唐僧因他打死多人，心生怨恨，不分皂白，遂念緊箍兒咒，趕他幾次。上天無路，入地無門，特來告訴菩薩。菩薩道：「唐三藏奉旨投西，一心要秉善為僧，決不輕傷性命。似你有無量神通，何苦打殺許多草寇？草寇雖是不良，到底是個人身，不該打死。比那妖禽怪獸、鬼魅精魔不同。那個打死，是你的功績；這人身打死，還是你的不仁。但祛退散，自然救了你師父。據我公論，還是你的不善。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 122
    line_end: 122
  translation_ja: 'こう話しているところへ、白い鸚哥（いんこ）が飛んで来ては飛び去った。菩薩が呼んでいるのだと分かり、恵岸行者と紅孩児は先に立って、宝の蓮台（れんだい）の下まで案内した。悟空は観音菩薩を見ると、身を投げ出して拝んだ。涙が泉のようにあふれて止まらず、声をあげて泣く。観音菩薩は恵岸行者と紅孩児に悟空を抱き起こさせ、言った。

    観音菩薩「悟空、何をそれほど悲しんでいるのです。はっきりと話してごらんなさい。泣かないで、泣かないで。私が苦しみと災いを取り除いてあげましょう。」

    悟空は涙を流し、もう一度拝んだ。

    悟空「以前の私は、こんな屈辱を受けたことがあったでしょうか。菩薩さまが天の災いから解き放ち、仏門のお教えに従わせてくださってから、私は三蔵をお守りし、西天へ仏を拝んでお経を求めに参りました。命を投げ出して魔物の難から救ってきたのです。それは、虎の口から柔らかい骨を奪い取り、蛟竜（こうりゅう）の背から生えたままの鱗を剥ぐようなものでした。ただ、正しい道に帰して悟りを得、罪を洗い、邪を除きたかっただけなのです。ところがあの長老は恩義を忘れ、せっかくの善縁をすっかり見失い、事情を見極め、私の苦しみを察しようともしてくれません。」

    観音菩薩「では、その白黒のつく事情を話して聞かせなさい。」

    悟空は、山賊を打ち殺した一件を、最初から最後まで詳しく述べた。そして、三蔵は悟空が大勢を殺したことを恨み、是非をわきまえずに緊箍児呪を唱え、何度も追い払ったのだと訴えた。天にも地にも逃げ場がなく、菩薩に申し上げに来たのだという。

    観音菩薩「唐三蔵（とうさんぞう）は勅命を受けて西へ向かい、ひたすら善を守る僧であろうとしています。命をむやみに傷つけることは、決してしません。お前ほど無限の神通力がありながら、なぜあれほど大勢の山賊を打ち殺す必要があったのです。山賊は悪人ではあっても、やはり人の身です。殺してはならぬもので、妖しい鳥や獣、亡霊や魔物とは違います。そういう魔物を打ち殺すのはお前の手柄ですが、人を殺すのはお前の情けのなさです。ただ追い払い、散らしてしまえば、それでお師匠さまは救えたでしょう。公平に言えば、やはりお前の行いが悪かったのです。」'
  translation_status: reviewed
- id: xy-ch57-006
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 行者噙淚叩頭道：「縱是弟子不善，也當將功折罪，不該這般逐我。萬望菩薩捨大慈悲，將鬆箍兒咒念念，褪下金箍，交還與你，放我仍往水簾洞逃生去罷。」菩薩笑道：「緊箍兒咒，本是如來傳我的。當年差我上東土尋取經人，賜我三件寶貝，乃是錦襴袈裟、九環錫杖、金緊禁三個箍兒。秘授與咒語三篇，卻無甚麼鬆箍兒咒。」行者道：「既如此，我告辭菩薩去也。」菩薩道：「你辭我往那裡去？」行者道：「我上西天，拜告如來，求念鬆箍兒咒去也。」菩薩道：「你且住，我與你看看祥晦如何。」行者道：「不消看，只這樣不祥也夠了。」菩薩道：「我不看你，看唐僧的祥晦。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 123
    line_end: 123
  translation_ja: '悟空は涙をため、頭を地につけた。

    悟空「たとえ私の行いが悪くても、それまでの功で罪を償わせてくださってよいはずです。あんなふうに追い払うことはないでしょう。どうか菩薩さま、大慈悲をお垂れになり、鬆箍児呪（しょうこじじゅ）を唱えてください。金の輪を外してお返しし、また水簾洞へ逃げ帰って生きていけるよう、お許しください。」

    観音菩薩は笑った。

    観音菩薩「緊箍児呪は、もともと如来（にょらい）から授かったものです。以前、経を取りに来る者を捜すため、私が東土（とうど）へ遣わされたとき、三件の宝を賜りました。錦襴袈裟（きんらんげさ）、九環錫杖（きゅうかんしゃくじょう）、それに金箍（きんこ）・緊箍（きんこ）・禁箍（きんこ）という三つの輪です。三篇の呪文もひそかに授けられましたが、鬆箍児呪などはありません。」

    悟空「それなら、菩薩さま、これでおいとまいたします。」

    観音菩薩「私の所を辞して、どこへ行くのです。」

    悟空「西天へ行き、如来にお願いして、輪を緩める呪文を唱えていただきます。」

    観音菩薩「しばらく待ちなさい。吉凶がどうなっているか、見てあげましょう。」

    悟空「見るには及びません。これだけ不吉なら、もうたくさんです。」

    観音菩薩「お前を見るのではありません。三蔵の吉凶を見るのです。」'
  translation_status: reviewed
- id: xy-ch57-007
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 好菩薩，端坐蓮臺，運心三界，慧眼遙觀，遍周宇宙，霎時間開口道：「悟空，你那師父頃刻之際，就有傷身之難，不久便來尋你。你只在此處，待我與唐僧說，教他還同你去取經，了成正果。」孫大聖只得皈依，不敢造次，侍立於寶蓮臺下不題。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 125
    line_end: 125
  translation_ja: 'さすがは菩薩、蓮台に端座し、心を三界（さんがい）に巡らせ、慧眼（えげん）で遠くを見渡して、宇宙の隅々まで見通した。たちまち口を開く。

    観音菩薩「悟空、お前の師は、ほんの間もなく身に傷を負う難に遭います。ほどなくお前を捜しに来るでしょう。ここで待っていなさい。私が三蔵に話し、またお前と一緒に経を取りに行って、悟りを成し遂げるようにさせましょう。」

    悟空は従うほかなく、勝手なことはせず、宝の蓮台の下に控えて立った。ひとまずこちらの話は置く。'
  translation_status: reviewed
- id: xy-ch57-008
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 卻說唐長老自趕回行者，教八戒引馬，沙僧挑擔，連馬四口，奔西走不上五十里遠近，三藏勒馬道：「徒弟，自五更時出了村舍，又被那弼馬溫著了氣惱，這半日饑又饑，渴又渴，那個去化些齋來我吃？」八戒道：「師父且請下馬，等我看可有鄰近的莊村，化齋去也。」三藏聞言，滾下馬來。獃子縱起雲頭，半空中仔細觀看，一望盡是山嶺，莫想有個人家。八戒按下雲來，對三藏道：「卻是沒處化齋，一望之間，全無莊舍。」三藏道：「既無化齋之處，且得些水來解渴也可。」八戒道：「等我去南山澗下取些水來。」沙僧即取缽盂，遞與八戒。八戒托著缽盂，駕起雲霧而去。那長老坐在路傍，等夠多時，不見回來，可憐口乾舌苦難熬。有詩為證。詩曰：
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 126
    line_end: 126
  translation_ja: 'さて三蔵は、悟空を追い返してから、八戒（はっかい）に馬を引かせ、沙悟浄（さごじょう）に荷を担がせて、馬を含めた四口で西へ進んだ。五十里足らずも行くと、馬を止めた。

    三蔵「弟子たちよ、五更（ごこう）に村の家を出てから、あの弼馬温（ひつばおん）にまた腹を立てさせられ、この半日、腹は減るし、喉は渇く。誰か、食べるものを托鉢してきてくれないか。」

    八戒「お師匠さま、まず馬をお下りください。近くに村があるか見て、食べ物をもらってきます。」

    三蔵はそれを聞いて馬から下りた。八戒は雲へ跳び乗り、空からよく見渡したが、見えるのは山また山。人家など、とてもありそうにない。雲を下ろし、三蔵に告げた。

    八戒「托鉢する所がありません。見渡す限り、村も家もないのです。」

    三蔵「食べ物をもらう所がないなら、水を少し汲んで、渇きを癒やしてくれるだけでもよい。」

    八戒「では、南の山の谷川へ、水を汲みに行ってきます。」

    沙悟浄はすぐ鉢を取り出し、八戒に渡した。八戒は鉢を手に載せ、雲霧に乗って出かけた。三蔵は道端に座ってずいぶん待ったが、戻って来ない。哀れにも口は乾き、舌は苦く、耐えがたかった。そのありさまを詠む詩がある。'
  translation_status: reviewed
- id: xy-ch57-009
  section_id: chapter-57
  kind: verse
  origin: source
  source_text: '保神養氣謂之精，情性原來一稟形。

    心亂神昏諸病作，形衰精敗道元傾。

    三花不就空勞碌，四大蕭條枉費爭。

    土木無功金水絕，法身疏懶幾時成！'
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 128
    line_end: 131
  translation_ja: '神を守り、気を養う、それを精（せい）という。

    情も性も、もとは一つの身に授かったもの。

    心が乱れ、神が昏くなれば、さまざまな病が生じ、

    体が衰え、精が敗れれば、道の根本も傾く。

    三花（さんか）が成らなければ、苦労もむだとなり、

    四大（しだい）が衰え果てれば、争っても甲斐はない。

    土と木は役立たず、金と水は絶え、

    法身（ほっしん）の修行を怠って、いつになれば成就するのか！'
  translation_status: reviewed
- id: xy-ch57-010
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧在傍，見三藏饑渴難忍，八戒又取水不來，只得穩了行囊，拴牢了白馬道：「師父，你自在坐著，等我去催水來。」長老含淚無言，但點頭相答。沙僧急駕雲光，也向南山而去。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 133
    line_end: 133
  translation_ja: 'そばにいた沙悟浄は、三蔵が飢えと渇きに耐えかね、八戒も水を持って戻らないのを見て、荷物をしっかり据え、白馬を固くつないだ。

    沙悟浄「お師匠さま、ゆっくり座っておいでください。私が水を急がせてきます。」

    三蔵は涙を含んで何も言わず、ただうなずいて答えた。沙悟浄も急いで雲の光に乗り、南の山へ向かった。'
  translation_status: reviewed
- id: xy-ch57-011
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 那師父獨鍊自熬，困苦太甚。正在愴惶之際，忽聽得一聲響亮，諕得長老欠身看處，原來是孫行者跪在路傍，雙手捧著一個磁杯道：「師父，沒有老孫，你連水也不能夠哩。這一杯好涼水，你且吃口水解渴，待我再去化齋。」長老道：「我不吃你的水，立地渴死，我當任命。不要你了，你去罷。」行者道：「無我你去不得西天也。」三藏道：「去得去不得，不干你事。潑猢猻，只管來纏我做甚？」那行者變了臉，發怒生嗔，喝罵長老道：「你這個狠心的潑禿！十分賤我。」掄鐵棒，丟了磁杯，望長老脊背上砑了一下。那長老昏暈在地，不能言語，被他把兩個青氈包袱提在手中，駕觔斗雲，不知去向。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 134
    line_end: 134
  translation_ja: '師はひとり、苦しみに耐え、もだえていた。あまりのつらさに心細くなっていると、不意に大きな音がした。驚いて身を起こし、そちらを見ると、道端に悟空がひざまずき、両手で磁器の杯を捧げている。

    道端の悟空「お師匠さま、私がいないと、水さえ手に入らないでしょう。ここに、よく冷えた水が一杯あります。まず一口飲んで喉を潤してください。私がまた食べ物をもらってきます。」

    三蔵「お前の水は飲まぬ。ここで渇き死んでも、それを自分の定めと受け入れる。お前はもう要らぬ。行くがよい。」

    道端の悟空「私がいなければ、西天へは行けません。」

    三蔵「行けようと行けまいと、お前には関わりのないことだ。ろくでなしの猿め、なぜそうしつこく私につきまとう！」

    道端の悟空は顔色を変え、怒りに燃えて三蔵を怒鳴りつけた。

    道端の悟空「この情け知らずの糞坊主め！　よくも俺をそこまで踏みにじったな！」

    鉄棒を振り上げ、磁器の杯を投げ捨て、三蔵の背中を一度、軽く打った。三蔵は地面に気を失って倒れ、ものも言えない。その者は青い毛氈（もうせん）の包み二つを手に提げると、觔斗雲に乗り、どこへともなく去ってしまった。'
  translation_status: reviewed
- id: xy-ch57-012
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 卻說八戒托著缽盂，只奔山南坡下，忽見山凹之間有一座草舍人家。原來在先看時，被山高遮住，未曾見得；今來到邊前，方知是個人家。獃子暗想道：「我若是這等醜嘴臉，決然怕我，枉勞神思，斷然化不得齋飯。須是變好，須是變好。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 136
    line_end: 136
  translation_ja: '一方、鉢を手にした八戒は、ひたすら山の南の斜面へ進んでいた。すると山あいに、草葺きの家が一軒あるのが目に入った。先ほど眺めたときは高い山に遮られて見えず、今、そばへ来て初めて人家だと分かったのである。八戒は心の中で考えた。

    八戒「こんな醜い顔では、きっと怖がられる。頭を使ってもむだで、飯など絶対にもらえまい。見栄えよく化けるんだ、見栄えよく化けるんだ。」'
  translation_status: reviewed
- id: xy-ch57-013
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 好獃子，捻著訣，念個咒，把身搖了七八搖，變作一個食癆病黃胖和尚，口裡哼哼唧唧的挨近門前，叫道：「施主，廚中有剩飯，路上有饑人。貧僧是東土來，往西天取經的。我師父在路饑渴了，家中有鍋巴冷飯，千萬化些兒救口。」原來那家子男人不在，都去插秧種穀去了。只有兩個女人在家，正才煮了午飯，盛起兩盆，卻收拾送下田去，鍋裡還有些飯與鍋巴，未曾盛了。那女人見他這等病容，卻又說東土往西天去的話，只恐他是病昏了胡說，又怕跌倒，死在門首。只得哄哄翕翕，將些剩飯鍋巴，滿滿的與了一缽。獃子拿轉來，現了本像，徑回舊路。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 137
    line_end: 137
  translation_ja: '八戒は指で印を結び、呪文を唱え、体を七、八回揺すった。すると、食癆病（しょくろうびょう）で顔が黄色く、むくんだ僧に変わった。うんうん、ぶつぶつとうめきながら門口へにじり寄り、呼びかける。

    八戒「施主さま、台所には残り飯があり、道には飢えた者がおります。私は東土から参り、西天へお経を取りに行く僧です。師匠が道中で飢え渇いております。お宅におこげや冷や飯がございましたら、どうか少しお恵みくださり、命をつないでください。」

    その家の男たちは皆、田へ苗を植え、穀物を育てに出ていた。家にいるのは女二人だけで、ちょうど昼飯を炊き、二つの鉢に盛って、田へ届ける支度をしているところだった。釜にはまだ、盛り分けていない飯とおこげが残っている。女は八戒の病人じみた姿を見て、そのうえ東土から西天へ行くなどと言うので、病気でぼんやりし、でたらめを言っているのではと案じた。門先で倒れて死なれても困る。そこでなだめすかしながら、残り飯とおこげを、鉢いっぱいにくれた。八戒はそれを受け取って引き返し、もとの姿に戻ると、まっすぐ来た道へ向かった。'
  translation_status: reviewed
- id: xy-ch57-014
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 正走間，聽得有人叫「八戒」。八戒擡頭看時，卻是沙僧站在山崖上喊道：「這裡來，這裡來。」及下崖，迎至面前道：「這澗裡好清水不舀，你往那裡去的？」八戒笑道：「我到這裡，見山凹子有個人家，我去化了這一缽乾飯來了。」沙僧道：「飯也用著，只是師父渴得緊了，怎得水去？」八戒道：「要水也容易，你將衣襟來兜著這飯，等我使缽盂去舀水。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 139
    line_end: 139
  translation_ja: '道を歩いていると、誰かが呼ぶのが聞こえた。

    声の主「八戒！」

    八戒が顔を上げると、崖の上に立っていたのは沙悟浄だった。

    沙悟浄「こっちへ、こっちへ！」

    沙悟浄は崖を下り、前まで迎えに来た。

    沙悟浄「この谷川にきれいな水があるのに汲みもせず、どこへ行っていたのです。」

    八戒は笑った。

    八戒「ここまで来たら、山あいに家が見えたので、飯をこの一鉢、もらってきたのさ。」

    沙悟浄「飯も必要ですが、お師匠さまはひどく喉が渇いています。どうやって水を運びましょう。」

    八戒「水なら簡単だ。お前の上着の裾で、この飯を包んでくれ。空いた鉢で、俺が水を汲もう。」'
  translation_status: reviewed
- id: xy-ch57-015
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 二人歡歡喜喜回至路上，只見三藏面磕地，倒在塵埃；白馬撒韁，在路傍長嘶跑跳；行李擔不見蹤影。慌得八戒跌腳搥胸，大呼小叫道：「不消講，不消講，這還是孫行者趕走的餘黨，來此打殺師父，搶了行李去了。」沙僧道：「且去把馬拴住！」只叫：「怎麼好？怎麼好？這誠所謂半途而廢，中道而止也。」叫一聲：「師父。」滿眼拋珠，傷心痛哭。八戒道：「兄弟，且休哭。如今事已到此，取經之事，且莫說了。你看著師父的屍靈，等我把馬騎到那個府州縣鄉村店集賣幾兩銀子，買口棺木，把師父埋了，我兩個各尋道路散夥。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 140
    line_end: 140
  translation_ja: '二人は喜び勇んで道へ戻った。ところが、三蔵は顔を地面につけ、土埃の中に倒れている。白馬は手綱が外れ、道端で高くいななきながら駆け跳ね、荷物は影も形もない。八戒は慌てて足を踏み鳴らし、胸をたたき、大声でわめいた。

    八戒「言うまでもない、言うまでもない！　悟空が追い払った賊の残党が来て、お師匠さまを殺し、荷物を奪ったんだ。」

    沙悟浄「まず馬をつないでください！」

    そして、沙悟浄は叫ぶばかりだった。

    沙悟浄「どうすればいい、どうすればいい！　これこそ本当に、道半ばで事を投げ出し、途中で止まってしまうということだ。」

    沙悟浄「お師匠さま！」

    涙をぽろぽろとこぼし、悲しみに胸を裂かれて泣いた。

    八戒「弟よ、まあ泣くな。こうなってしまった以上、取経の話はひとまずよそう。お前はお師匠さまの亡骸を見ていてくれ。俺が馬に乗って、どこかの府や州や県、郷や村、宿場、市場へ行き、銀何両かで売ってくる。その金で棺を一つ買い、お師匠さまを埋めたら、俺たち二人も解散し、それぞれの道を捜すんだ。」'
  translation_status: reviewed
- id: xy-ch57-016
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧實不忍捨，將唐僧扳轉身體，以臉溫臉，哭一聲：「苦命的師父！」只見那長老口鼻中吐出熱氣，胸前溫暖，連叫：「八戒，你來，師父未傷命哩。」那獃子才近前扶起長老。甦醒呻吟一會，罵道：「好潑猢猻，打殺我也。」沙僧、八戒問道：「是那個猢猻？」長老不言，只是嘆息。卻討水吃了幾口，才說：「徒弟，你們剛去，那悟空更來纏我。是我堅執不收，他遂將我打了一棒，青氈包袱都搶去了。」八戒聽說，咬響口中牙，發起心頭火道：「叵耐這潑猴子！怎敢這般無禮？」教：「沙僧，你伏侍師父，等我到他家討包袱去。」沙僧道：「你且休發怒。我們扶師父到那山凹人家化些熱茶湯，將先化的飯熱熱，調理師父，再去尋他。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 141
    line_end: 141
  translation_ja: '沙悟浄はどうしても見捨てるに忍びず、三蔵の体を仰向けに返し、頬を寄せて頬を温めながら泣いた。

    沙悟浄「なんとおいたわしい、お師匠さま！」

    すると、三蔵の口と鼻から温かい息が漏れ、胸にもぬくもりがあった。沙悟浄は続けざまに呼んだ。

    沙悟浄「八戒、来てください！　お師匠さまは、まだ亡くなっていません！」

    八戒はそこでようやく近寄り、三蔵を抱き起こした。三蔵は正気を取り戻し、しばらくうめいたあと、罵った。

    三蔵「あのろくでなしの猿め、危うく打ち殺されるところだった！」

    沙悟浄と八戒「どの猿のことですか。」

    三蔵は答えず、ため息ばかりついていた。水を求め、何口か飲んでから、ようやく言った。

    三蔵「お前たちが行くとすぐ、悟空がまた私につきまといに来た。私が頑として受け入れなかったので、棒で一打、私を打ち、青い毛氈の包みを全部奪っていったのだ。」

    八戒はそれを聞くと歯をぎりぎり鳴らし、腹の底から怒りを燃やした。

    八戒「あの猿め、我慢ならん！　よくもそんな無礼を働いたな！」

    八戒「沙悟浄、お師匠さまのお世話をしていてくれ。俺があいつの家へ行って、包みを取り返す。」

    沙悟浄「まず、怒るのはお待ちなさい。お師匠さまをあの山あいの家へお連れし、熱い茶をいただいて、先ほどの飯を温めましょう。お体をいたわってから、兄さんを捜しに行くのです。」'
  translation_status: reviewed
- id: xy-ch57-017
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 八戒依言，把師父扶上馬，拿著缽盂，兜著冷飯，直至那家門首。只見那家止有個老婆子在家，忽見他們，慌忙躲過。沙僧合掌道：「老母親，我等是東土唐朝差往西天去者。師父有些不快，特拜府上，化口熱茶湯，與他吃飯。」那媽媽道：「適才有個食癆病和尚，說是東土差來的，已化齋去了，又有個甚麼東土的？我沒人在家，請別處轉轉。」長老聞言，扶著八戒，下馬躬身道：「老婆婆，我弟子有三個徒弟，合意同心，保護我上天竺國大雷音拜佛求經。只因我大徒弟（喚孫悟空）一生兇惡，不遵善道，是我逐回。不期他暗暗走來，著我背上打了一棒，將我行囊衣缽搶去。如今要著一個徒弟尋他取討，因在那空路上不是坐處，特來老婆婆府上權安息一時。待討將行李來就行，決不敢久住。」那媽媽道：「剛才一個食癆病黃胖和尚，他化齋去了，也說是東土往西天去的，怎麼又有一起？」八戒忍不住笑道：「就是我。因我生得嘴長耳大，恐你家害怕，不肯與齋，故變作那等模樣。你不信，我兄弟衣兜裡不是你家鍋巴飯？」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 142
    line_end: 142
  translation_ja: '八戒はその言葉に従った。二人は師を馬に乗せ、鉢を持ち、冷や飯を裾に包んで、あの家の門口へ行った。家には老婆が一人いるだけで、三人を見ると慌てて身を隠した。沙悟浄は合掌した。

    沙悟浄「おばあさん、私たちは東土の唐朝（とうちょう）から、西天へ遣わされた者です。師匠が少し具合を悪くしております。お宅へ伺ったのは、熱い茶を一口いただき、飯を食べさせたいからなのです。」

    老婆「さっきも食癆病の僧が来て、東土から遣わされたと言い、食べ物をもらって行きましたよ。それがまた、どこの東土の人だというんです。うちは男手が留守ですから、よそを回ってください。」

    それを聞いた三蔵は、八戒に支えられて馬から下り、身をかがめた。

    三蔵「おばあさん、私には三人の弟子がおり、心を合わせて、天竺国（てんじくこく）の大雷音（だいらいおん）へ仏を拝み、お経を求めに行く私を守ってくれていました。ところが、一番弟子の孫悟空（そんごくう）という者は、もともと凶暴で善道に従わぬため、私が追い返したのです。すると、思いがけずこっそり戻って来て、私の背を棒で一打し、荷物も衣も鉢も奪っていきました。そこで今、弟子を一人やって取り戻させたいのですが、人もない道端は、じっと座って待つ場所ではありません。おばあさんのお宅で、一時、休ませていただきたいのです。荷物を取り戻しましたらすぐに出発し、決して長居はいたしません。」

    老婆「さっきも、食癆病で黄色くむくんだ僧が、食べ物をもらって行ったんです。その人も東土から西天へ行くと言っていました。どうしてまた、別の一行が来るんです。」

    八戒は笑いをこらえきれなかった。

    八戒「それは俺ですよ。口が長くて耳も大きいもので、怖がられて食べ物をもらえないと困ると思い、あの姿に化けたんです。信じられないなら、弟の裾に包んであるのは、お宅のおこげ飯じゃありませんか。」'
  translation_status: reviewed
- id: xy-ch57-018
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 那媽媽認得果是他與的飯，遂不拒他，留他們坐了。卻燒了一罐熱茶，遞與沙僧泡飯。沙僧即將冷飯泡了，遞與師父。師父吃了幾口，定性多時道：「那個去討行李？」八戒道：「我前年因師父趕他回去，我曾尋他一次，認得他花果山水簾洞。等我去，等我去。」長老道：「你去不得。那猢猻原與你不和，你又說話粗魯，或一言兩句之間，有些差池，他就要打你。著悟淨去罷。」沙僧應承道：「我去，我去。」長老又吩咐沙僧道：「你到那裡，須看個頭勢。他若肯與你包袱，你就假謝謝拿來；若不肯，切莫與他爭競，徑至南海菩薩處，將此情告訴，請菩薩去問他要。」沙僧一一聽從。向八戒道：「我今尋他去，你千萬莫僝僽，好生供養師父。這人家亦不可撒潑，恐他不肯供飯。我去就回。」八戒點頭道：「我理會得。但你去，討得討不得，趁早回來，不要弄做尖擔擔柴兩頭脫也。」沙僧遂捻了訣，駕起雲光，直奔東勝神洲而去。真個是：
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 143
    line_end: 143
  translation_ja: '老婆は、たしかに自分がやった飯だと見て取ったので、それ以上は拒まず、三人をとどめて座らせた。そして熱い茶を一壺沸かし、沙悟浄に渡して飯にかけさせる。沙悟浄は冷や飯に茶を注ぎ、師に差し出した。三蔵は何口か食べ、長いこと心を落ち着けてから言った。

    三蔵「誰が荷物を取りに行くか。」

    八戒「一昨年、お師匠さまが兄貴を追い返したとき、俺が一度、捜しに行きました。花果山の水簾洞なら知っています。俺が行きます、俺が行きます。」

    三蔵「お前は行ってはならぬ。あの猿はもともとお前と仲が悪く、お前の言葉もぞんざいだ。一言二言の間で食い違いが起きれば、すぐお前を殴ろうとするだろう。悟浄（ごじょう）に行ってもらおう。」

    沙悟浄「私が参ります、私が参ります。」

    三蔵はさらに言いつけた。

    三蔵「向こうへ着いたら、まず様子を見なさい。包みを渡してくれるなら、形だけでも礼を言って持ち帰るのだ。渡さぬというなら、決して言い争わず、まっすぐ南海（なんかい）の菩薩さまの所へ行き、この一件を申し上げなさい。菩薩さまから返すようにお話しいただくのだ。」

    沙悟浄は一つ一つ承知し、八戒へ言った。

    沙悟浄「では、兄さんを捜しに行きます。くれぐれもくよくよせず、よくお師匠さまのお世話をしてください。この家でも乱暴をしてはいけません。食事を出してもらえなくなると困ります。行ったらすぐに戻ります。」

    八戒はうなずいた。

    八戒「分かっている。お前も、荷物を取り返せても取り返せなくても、早く帰って来いよ。先の尖った天秤棒で薪を担いで、両端とも滑り落ちた、なんてことにならないようにな。」

    沙悟浄は印を結び、雲の光に乗って、まっすぐ東勝神洲（とうしょうしんしゅう）へ向かった。まさに、こういうことである。'
  translation_status: reviewed
- id: xy-ch57-019
  section_id: chapter-57
  kind: verse
  origin: source
  source_text: '身在神飛不守舍，有爐無火怎燒丹。

    黃婆別主求金老，木母延師奈病顏。

    此去不知何日返，這回難量幾時還。

    五行生剋情無順，只待心猿復進關。'
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 145
    line_end: 148
  translation_ja: '身はあっても神は飛び去り、住まいを守らない。

    炉があっても火がなければ、どうして丹（たん）を焼けよう。

    黄婆（こうば）は主と別れ、金老（きんろう）を求めに行き、

    木母（もくぼ）は師をもてなすが、その病んだ顔をどうにもできぬ。

    この旅から、いつ戻るのか知れず、

    今度は何時に帰るのかも、測りがたい。

    五行（ごぎょう）が生み、また剋する働きは、うまくかみ合わず、

    ただ心猿（しんえん）が、再び関へ入るのを待つばかり。'
  translation_status: reviewed
- id: xy-ch57-020
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 那沙僧在半空裡，行經三晝夜，方到了東洋大海，忽聞波浪之聲。低頭觀看，真個是黑霧漲天陰氣盛，滄溟銜日曉光寒。他也無心觀玩，望仙山渡過瀛洲，向東方直抵花果山界。乘海風，踏水勢，又多時，卻望見高峰排戟，峻壁懸屏。即至峰頭，按雲找路下山，尋水簾洞。步近前，只聽得那山中無數猴精，滔滔亂嚷。沙僧又近前仔細再看，原來是孫行者高坐石臺之上，雙手扯著一張紙，朗朗的念道：
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 149
    line_end: 149
  translation_ja: '沙悟浄は空を行くこと三昼夜、ようやく東の大海へ着いた。ふと波の音が聞こえ、下を見やると、まことに、黒い霧が天に満ち、陰気が盛んで、青い海は日をくわえ、明け方の光も寒々としていた。だが、景色を楽しむ気にもなれない。仙山を目指して瀛洲（えいしゅう）を渡り、東へ向かって、まっすぐ花果山の境へ進む。海風に乗り、水の勢いを踏んで、さらに長い間行くと、高い峰々が戟（げき）を並べるようにそびえ、険しい崖が屏風を吊るしたように連なっているのが見えた。

    峰の上まで来て雲を下ろし、道を捜して山を下り、水簾洞を目指した。近づくと、山の中で無数の猿の妖怪が、わあわあと騒ぎ立てている。さらに寄ってよく見ると、水簾洞の悟空が石の台に高々と座り、一枚の紙を両手で広げ、朗々と読み上げていた。'
  translation_status: reviewed
- id: xy-ch57-021
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 東土大唐王皇帝李，駕前敕命御弟聖僧陳玄奘法師，上西方天竺國娑婆靈山大雷音寺，專拜如來佛祖求經。朕因促病侵身，魂遊地府，幸有陽數臻長，感冥君放送回生，廣陳善會，修建度亡道場。盛蒙救苦救難觀世音菩薩金身出現，指示西方有佛有經，可度幽亡超脫，特著法師玄奘，遠歷千山，詢求經偈。倘過西邦諸國，不滅善緣，照牒施行。大唐貞觀一十三年秋吉日御前文牒。自別大國以來，經度諸邦，中途收得大徒弟孫悟空行者、二徒弟豬悟能八戒、三徒弟沙悟淨和尚。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 151
    line_end: 151
  translation_ja: '洞の悟空が読み上げる文書には、こうあった。

    「東土大唐（だいとう）の王、李（り）姓の皇帝は、御前にて、御弟（ぎょてい）たる聖僧、陳玄奘（ちんげんじょう）法師に勅命を下す。西方の天竺国、娑婆（しゃば）の霊山（れいざん）、大雷音寺（だいらいおんじ）に赴き、ひたすら如来仏祖（にょらいぶっそ）を拝して経を求むべし。

    朕は急な病に身を侵され、魂が冥府へさまよい入った。幸い、この世の寿命を延ばされ、冥王の恩により送り帰されて蘇生した。そこで広く善をなす法会を開き、亡者を救う道場を設けた。その折、苦難を救う観世音菩薩（かんぜおんぼさつ）が金身（こんじん）を現し、西方には仏があり、経があり、それによって冥界の死者を救い、解脱させられるとお教えくださった。このため、特に玄奘法師（げんじょうほうし）を遣わし、遠く幾千もの山を越え、経偈を尋ね求めさせる。

    西方の諸国を通ることがあれば、善縁を絶やさず、この文牒（ぶんちょう）に照らして取り計らうべし。

    大唐、貞観（じょうがん）十三年、秋の吉日、御前の文牒。

    大国を辞して以来、諸国を通過し、道中で、一番弟子、孫悟空行者（そんごくうぎょうじゃ）、二番弟子、猪悟能（ちょごのう）こと八戒、三番弟子、沙悟浄和尚を弟子に迎えた。」'
  translation_status: reviewed
- id: xy-ch57-022
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 念了從頭又念。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 153
    line_end: 153
  translation_ja: 読み終わると、また最初から読み返した。
  translation_status: reviewed
- id: xy-ch57-023
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧聽得是通關文牒，止不住近前厲聲高叫：「師兄，師父的關文你念他怎的？」那行者聞言，急擡頭，不認得是沙僧，叫：「拿來，拿來。」眾猴一齊圍繞，把沙僧拖拖扯扯，拿近前來，喝道：「你是何人，擅敢近吾仙洞？」沙僧見他變了臉，不肯相認，只得朝上行禮道：「上告師兄：前者實是師父性暴，錯怪了師兄，把師兄咒了幾遍，逐趕回家。一則弟等未曾勸解，二來又為師父饑渴去尋水化齋。不意師兄好意復來，又怪師父執法不留，遂把師父打倒，昏暈在地。將行李搶去。後我等救轉師父，特來拜兄。若不恨師父，還念昔日解脫之恩，同小弟將行李回見師父，共上西天，了此正果；倘怨恨之深，不肯同去，千萬把包袱賜弟，兄在深山，樂桑榆晚景，亦誠兩全其美也。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 154
    line_end: 154
  translation_ja: '沙悟浄は、それが通関文牒（つうかんもんちょう）だと聞き取ると、たまらず前へ出て、厳しい声で呼んだ。

    沙悟浄「兄さん、お師匠さまの通行の文書を、どうして読んでいるのです！」

    洞の悟空はそれを聞き、急に顔を上げたが、沙悟浄だとは分からず、叫んだ。

    洞の悟空「捕らえろ、捕らえろ！」

    猿たちは一斉に取り囲み、沙悟浄を引っ張ったり引きずったりして、台の前へ連れて来た。そこで怒鳴る声がした。

    話者不明「お前は何者だ。よくも勝手に、わが仙洞へ近づいたな！」

    沙悟浄は、相手が顔色を変え、自分だと認めようとしないのを見て、やむなく台へ向かって礼をした。

    沙悟浄「兄さんに申し上げます。先ほどは、たしかにお師匠さまが気を荒らげ、兄さんを不当にお責めになりました。何遍も呪文を唱え、家へ追い返されたのです。第一に、私たち弟弟子が取りなさなかったのが悪かった。第二に、お師匠さまが飢え渇いておられたので、私たちは水を捜し、飯をもらいに行っておりました。思いがけず、兄さんはご好意でお戻りになった。ところがお師匠さまが戒めを曲げず、受け入れなかったことにお腹立ちになり、お師匠さまを打ち倒して気絶させ、荷物を持ち去られたのですね。その後、私たちはお師匠さまを介抱して意識を取り戻させ、私が特に兄さんを訪ねて参りました。

    もしお師匠さまをお恨みでなく、昔、縛めから解き放っていただいた恩をまだ覚えておいでなら、弟の私と荷物を持ってお師匠さまのもとへ戻り、一緒に西天へ上り、この悟りを成し遂げてください。もし恨みが深く、一緒には行けぬということでしたら、どうか包みを私にお渡しください。兄さんはこの深山で、桑やニレを照らす夕日のような晩年を、楽しくお過ごしになれば、それもまことに、双方の願いがかなう道ではありませんか。」'
  translation_status: reviewed
- id: xy-ch57-024
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 行者聞言，呵呵冷笑道：「賢弟，此論甚不合我意。我打唐僧，搶行李，不因我不上西方，亦不因我愛居此地。我今熟讀了牒文，我自己上西方拜佛求經，送上東土，我獨成功，教那南贍部洲人立我為祖，萬代傳名也。」沙僧笑道：「師兄言之欠當。自來沒個孫行者取經之說。我佛如來造下三藏真經，原著觀音菩薩向東土尋取經人求經，要我們苦歷千山，詢求諸國，保護那取經人。菩薩曾言：取經人乃如來門生，號曰金蟬長老。只因他不聽佛祖談經，貶下靈山，轉生東土，教他果正西方，復修大道。遇路上該有這般魔障，解脫我等三人，與他做護法。兄若不得唐僧去，那個佛祖肯傳經與你？卻不是空勞一場神思也？」那行者道：「賢弟，你原來懞懂，但知其一，不知其二。諒你說你有唐僧，同我保護，我就沒有唐僧？我這裡另選個有道的真僧在此，自去取經，老孫獨力扶持，有何不可？已選明日大早起身去矣。你不信，待我請來你看。」叫：「小的們，快請老師父出來。」果跑進去，牽出一匹白馬，請出一個唐三藏；跟著一個八戒，挑著行李；一個沙僧，拿著錫杖。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 155
    line_end: 155
  translation_ja: '洞の悟空は聞くと、ははっと冷たく笑った。

    洞の悟空「弟よ、その話は、まるで俺の意に合わぬ。俺が三蔵を殴って荷物を奪ったのは、西方へ行きたくないからでも、ここで暮らすのが好きだからでもない。今、文牒をよく読み込んで、俺自身が西方へ仏を拝み、経を取りに行き、東土へ届けようと思っている。俺一人で功を成し遂げ、南贍部洲（なんせんぶしゅう）の人々に俺を祖と仰がせ、万代までも名を伝えさせるのだ。」

    沙悟浄は笑った。

    沙悟浄「兄さんのおっしゃることは、道理に合いません。もともと孫行者（そんぎょうじゃ）が経を取りに行くという話はなかったのです。わが仏、如来は三蔵（さんぞう）の真経をお作りになり、観音菩薩を東土へ遣わして、それを取りに来る者を捜させました。私たちには幾千の山を苦労して越え、諸国を巡り、その取経の人を守れと命じられたのです。

    菩薩さまは以前、こうおっしゃいました。取経の人は如来の弟子で、金蝉長老（きんせんちょうろう）と号した方だが、仏祖の説経を聞かなかったため、霊山から落とされ、東土へ生まれ変わった。西方で正果（しょうか）を成し、もう一度大道を修めさせるのだ、と。道中では、こうした魔の妨げに遭うことになっているので、私たち三人を縛めから解いて、護法（ごほう）にさせたのです。兄さんが三蔵を連れて行かなければ、あの仏祖が、どうして経をお授けになるでしょう。骨折り損になるだけではありませんか。」

    洞の悟空「弟よ、お前はぼんやりしている。一つを知って二つを知らぬのだ。お前の言い分は、そちらには三蔵がいて、俺と一緒に守るということだろう。だが、俺には三蔵がいないとでも思うのか。ここには別に、道を得た真の僧を選んである。その僧が自分で経を取りに行き、俺一人で守り助けて、何が悪い。もう明日の早朝に出発すると決めてある。信じないなら、ここへお呼びして見せよう。」

    洞の悟空「小さい者ども、早くお師匠さまをお連れしろ！」

    すると本当に、猿たちは中へ走り込み、白馬を一頭引き出して、三蔵そっくりの僧を一人連れて来た。その後ろには、荷物を担いだ八戒が一人、錫杖（しゃくじょう）を持った沙悟浄が一人ついている。'
  translation_status: reviewed
- id: xy-ch57-025
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 這沙僧見了，大怒道：「我老沙行不更名，坐不改姓，那裡又有一個沙和尚？不要無禮，吃我一杖！」好沙僧，雙手舉降妖杖，把一個假沙僧劈頭一下打死，原來這是一個猴精。那行者惱了，掄金箍棒，帥眾猴，把沙僧圍了。沙僧東沖西撞，打出路口，縱雲霧逃生道：「這潑猴如此憊懶，我告菩薩去來。」那行者見沙僧打死一個猴精，把沙和尚逼得走了，他也不來追趕。回洞教小的們把打死的妖屍拖在一邊，剝了皮，取肉煎炒，將椰子酒、葡萄酒，同群猴都吃了。另選一個會變化的妖猴，還變一個沙和尚，從新教導，要上西方不題。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 156
    line_end: 156
  translation_ja: 'それを見た沙悟浄は激怒した。

    沙悟浄「この私は、どこへ行こうと、どこにいようと、名も姓も変えぬ沙悟浄だ！　どこから、もう一人の沙和尚（さおしょう）が出て来た。ふざけるな、杖の一撃を受けろ！」

    沙悟浄は両手で降妖杖（ごうようじょう）を振り上げ、偽の沙悟浄の頭へ一撃を浴びせ、打ち殺した。すると、その正体は猿の妖怪だった。

    洞の悟空は腹を立て、金箍棒（きんこぼう）を振りかざして猿たちを率い、沙悟浄を取り囲んだ。沙悟浄は東へ突き、西へぶつかり、打ち破って道へ出ると、雲霧に乗って逃げ延びた。

    沙悟浄「あの猿は、なんというならず者だ。菩薩さまに訴えてこよう。」

    洞の悟空は、沙悟浄が猿の妖怪を一匹殺したのを見て、追い立てて逃げさせはしたが、それ以上追いかけなかった。洞へ戻り、小猿たちに死んだ妖怪の体を脇へ引きずらせ、皮を剥ぎ、肉を取って油で炒めさせた。そして椰子酒（やしざけ）、葡萄酒を添え、猿たちと皆で食べてしまった。さらに変化のできる妖猿を別に一匹選び、また沙和尚の姿に変えさせ、一から教え直して、西方へ行こうとする。こちらの話はひとまず置く。'
  translation_status: reviewed
- id: xy-ch57-026
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧一駕雲離了東海，行經一晝夜，到了南海。正行時，早見落伽山不遠。急至前，低停雲霧觀看，好去處！果然是：
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 158
    line_end: 158
  translation_ja: 沙悟浄は雲に乗って東海（とうかい）を離れ、一昼夜をかけて南海へ着いた。進むうち、もう落伽山がほど近くに見えた。急いで近づき、低く雲を止めて眺めると、なんというよい所だろう。まさに、こんなありさまだった。
  translation_status: reviewed
- id: xy-ch57-027
  section_id: chapter-57
  kind: verse
  origin: source
  source_text: 包乾之奧，括坤之區。會百川而浴日滔星，歸眾流而生風漾月。潮發騰凌大鯤化，波翻浩蕩巨鰲遊。水通西北海，浪合正東洋。四海相連同地脈，仙方洲島各仙宮。休言滿地蓬萊，且看普陀雲洞。好景致！山頭霞彩壯元精，巖下祥風漾月晶。紫竹林中飛孔雀，綠楊枝上語靈鸚。琪花瑤草年年秀，寶樹金蓮歲歲生。白鶴幾番朝頂上，素鸞數次到山亭。遊魚也解修真性，躍浪穿波聽講經。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 160
    line_end: 160
  translation_ja: '乾（けん）の奥深さを包み、坤（こん）の領域を抱き込む。

    百川を集めて日を浴し、星を波立たせ、

    数多の流れを受け入れ、風を生み、月を揺らす。

    潮は勢いよく高まり、大きな鯤（こん）が姿を変え、

    波は広々と翻り、巨大な鰲（ごう）が遊ぶ。

    水は西と北の海へ通じ、波は東の大洋と合わさる。

    四海（しかい）は連なり、地脈を共にし、

    仙境の洲や島には、それぞれ仙人の宮がある。

    蓬莱（ほうらい）が至る所にあるなどと、今は言うまい。

    まずは普陀（ふだ）の、雲に包まれた洞を見よ。

    なんと見事な景色！

    山頂の彩る霞は元精（げんせい）を盛んにし、

    岩の下のめでたい風は月の精光を揺らす。

    紫竹林の中では孔雀が飛び、

    緑の柳の枝では霊妙な鸚哥が語る。

    玉のような花と草は、年ごとに美しく、

    宝の樹と金の蓮は、年ごとに生い育つ。

    白鶴は幾たびも山頂に朝拝し、

    白い鸞（らん）は何度も山のあずまやを訪れる。

    泳ぐ魚も、まことの性を修める道を知り、

    波を跳び、うねりをくぐって、説経を聞きに来る。'
  translation_status: reviewed
- id: xy-ch57-028
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧徐步落伽山，玩看仙境。只見木叉行者當面相迎道：「沙悟淨，你不保唐僧取經，卻來此何幹？」沙僧作禮畢，道：「有一事特來朝見菩薩，煩為引見引見。」木叉情知是尋行者，更不題起，即先進去對菩薩道：「外有唐僧的小徒弟沙悟淨朝拜。」孫行者在臺下聽見，笑道：「這定是唐僧有難，沙僧來請菩薩的。」菩薩即命木叉門外叫進。這沙僧倒身下拜，拜罷，擡頭正欲告訴前事，忽見孫行者站在傍邊，等不得說話，就掣降妖杖望行者劈臉便打。這行者更不回手，撤身躲過。沙僧口裡亂罵道：「我把你個犯十惡造反的潑猴！你又來影瞞菩薩哩。」菩薩喝道：「悟淨不要動手，有甚事先與我說。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 161
    line_end: 161
  translation_ja: '沙悟浄は落伽山をゆっくり歩き、仙境を眺めた。すると恵岸行者が、向こうから迎えて言った。

    恵岸行者「沙悟浄、三蔵をお守りして経を取りに行かず、ここへ何の用で来たのです。」

    沙悟浄は礼を終えて答えた。

    沙悟浄「一件、菩薩さまにお目にかかって申し上げたいことがあります。どうかお取り次ぎください。」

    恵岸行者は、悟空を捜しに来たのだと知っていたが、そのことには触れず、先に入って観音菩薩へ告げた。

    恵岸行者「外に、三蔵さまの末弟子、沙悟浄が拝謁に参っております。」

    蓮台の下で聞いた悟空は笑った。

    悟空「きっと三蔵が難に遭い、沙悟浄が菩薩さまをお呼びに来たのでしょう。」

    観音菩薩はすぐ、恵岸行者に門の外の沙悟浄を呼び入れさせた。沙悟浄は身を投げ出して拝み、礼を終え、顔を上げて一件を話そうとした。ところが、悟空がそばに立っているのが目に入った。言葉を発するのも待てず、降妖杖を抜き、悟空の顔めがけて打ちかかった。悟空は手を出さず、身を引いてかわした。沙悟浄は口汚く罵った。

    沙悟浄「この十悪（じゅうあく）を犯した反逆の猿め！　また菩薩さまを欺きに来たのか！」

    観音菩薩は一喝した。

    観音菩薩「悟浄、手を出してはなりません。何があったのか、まず私に話しなさい。」'
  translation_status: reviewed
- id: xy-ch57-029
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 沙僧收了寶杖，再拜臺下，氣沖沖的對菩薩道：「這猴一路行兇，不可數計。前日在山坡下打殺兩個剪路的強人，師父怪他。不期晚間就宿在賊窩主家裡，又把一夥賊人盡情打死，又血淋淋提一個人頭來與師父看。師父諕得跌下馬來，罵了他幾句，趕他回來。分別之後，師父饑渴太甚，教八戒去尋水。久等不來，又著我去尋他。不期孫行者見我二人不在，復回來把師父打一鐵棍，將兩個青氈包袱搶去。我等回來，將師父救醒，特來他水簾洞尋他討包袱，不想他變了臉，不肯認我，將師父關文念了又念。我問他念了做甚，他說不保唐僧，他要自上西天取經，送上東土，算他的功果，立他為祖，萬古傳揚。我又說：『沒唐僧，那肯傳經與你？』他說他選了一個有道的真僧。及請出，果是一匹白馬，一個唐僧，後跟著八戒、沙僧。我道：『我便是沙和尚，那裡又有個沙和尚？』是我趕上前，打了他一寶杖，原來是個猴精。他就帥眾拿我，是我特來告請菩薩。不知他會使觔斗雲，預先到此處。又不知他將甚巧語花言，影瞞菩薩也。」菩薩道：「悟淨，不要賴人。悟空到此，今已四日，我更不曾放他回去，他那裡有另請唐僧，自去取經之意？」沙僧道：「見如今水簾洞有一個孫行者，怎敢欺誑？」菩薩道：「既如此，你休發急，教悟空與你同去花果山看看，是真難滅，是假易除，到那裡自見分曉。」
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 162
    line_end: 162
  translation_ja: '沙悟浄は宝の杖を収め、蓮台の下で再び拝み、怒気をあらわにして観音菩薩へ訴えた。

    沙悟浄「この猿は、道中ずっと乱暴を働き、その数は数えきれません。先日、山の斜面の下で追い剥ぎ二人を打ち殺したので、お師匠さまがお叱りになりました。ところが、その夜、思いがけず賊の仲間の家へ泊まったのです。すると今度は、一味を情け容赦なく打ち殺し、血の滴る人の首を一つ提げて来て、お師匠さまに見せました。お師匠さまは驚いて馬から落ち、何言か叱りつけて、追い返されました。

    別れたあと、お師匠さまはひどく飢え渇き、八戒に水を捜しに行かせました。長く待っても帰らないので、私も捜しにやられたのです。すると悟空は、私たち二人がいないのを見て戻って来て、お師匠さまを鉄棒で一打し、青い毛氈の包みを二つ奪いました。私たちは戻って、お師匠さまを介抱して目を覚まさせました。それで私は、わざわざ水簾洞へ荷物を取りに行ったのです。

    ところが彼は顔色を変え、私を認めようともせず、お師匠さまの通行の文書を何度も読んでいました。何のために読むのかと尋ねると、三蔵を守るのではなく、自分で西天へ経を取りに行って東土へ届け、自分の功として、人々に祖と仰がせ、万古に名を伝えさせると言うのです。私は、『三蔵なしで、どうして経を授けていただけるのです』と申しました。すると彼は、道を得た真の僧を選んであると言い、呼び出して見せました。果たして白馬が一頭、三蔵が一人、その後ろに八戒と沙悟浄が続いていたのです。

    私は、『私が沙和尚なのに、なぜもう一人、沙和尚がいるのだ』と言って、駆け寄り、宝杖（ほうじょう）で一打しました。すると、そいつは猿の妖怪でした。悟空が猿たちを率いて私を捕らえようとしたので、こうして菩薩さまに訴え、お助けを願いに参ったのです。あの者は觔斗雲を使えるので、私より先にここへ来ていたとは。どんな巧みな口先で、菩薩さまを欺いたかも分かりません。」

    観音菩薩「悟浄、人に濡れ衣を着せてはなりません。悟空がここへ来て、今日でもう四日です。私は一度も帰していません。別に三蔵を招いて、自分で経を取りに行くつもりなど、どこにありましょう。」

    沙悟浄「現に今、水簾洞には孫行者が一人いるのです。どうして嘘など申し上げましょう。」

    観音菩薩「それなら、慌ててはいけません。悟空を一緒に行かせますから、花果山を見ておいでなさい。本物なら滅ぼしがたく、偽物なら除きやすい。そこへ行けば、おのずと区別がつくでしょう。」'
  translation_status: reviewed
- id: xy-ch57-030
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 這大聖聞言，即與沙僧辭了菩薩。這一去，到那：
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 163
    line_end: 163
  translation_ja: 悟空はこの言葉を聞くと、すぐ沙悟浄とともに観音菩薩へ別れを告げた。この旅で向かう先は、
  translation_status: reviewed
- id: xy-ch57-031
  section_id: chapter-57
  kind: verse
  origin: source
  source_text: 花果山前分皂白，水簾洞口辨真邪。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 165
    line_end: 165
  translation_ja: '花果山の前にて白黒を分け、

    水簾洞の口にて真と邪を見極める。'
  translation_status: reviewed
- id: xy-ch57-032
  section_id: chapter-57
  kind: paragraph
  origin: source
  source_text: 畢竟不知如何分辨，且聽下回分解。
  source_languages:
  - zh-Hant
  source_locations:
  - source_id: wikisource-xiyou-ch57-2031415
    precision: line
    url: https://zh.wikisource.org/w/index.php?title=西遊記/第057回&oldid=2031415
    line_start: 167
    line_end: 167
  translation_ja: さて、いったいどう見分けるのか。それは次回のお話で。
  translation_status: reviewed
- id: xy-ch57-note-01-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 回題の「謄文」は文書を書き写すこと。本文は文牒を何度も読み上げる様子を描くため、回題と本文を同じ行為に書き換えず、それぞれの表現を残した。「偽の猿王」は回題自体の予告であり、本文の人物の認識や後の正体を先取りする説明ではない。
  translation_status: reviewed
- id: xy-ch57-note-02-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 原文は「出乎爾反乎爾」。自分の行為が自分に返るという成句を踏まえる一方、この場面では、出奔と帰還を繰り返す節操のなさを笑われるという文脈に取った。言葉の由来を、そのまま別の事件の因果関係へ補わない。
  translation_status: reviewed
- id: xy-ch57-note-03-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 三蔵が実際に二十余遍唱え、輪が肉へ一寸ほど食い込む描写と、さらに脳髄まで絞り出すと威嚇する発言を区別した。後者がこの場面で実行されたということではない。
  translation_status: reviewed
- id: xy-ch57-note-04-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 中国語の「告」には、事情を申し上げる意味と、相手を訴え出る意味がある。紅孩児は悟空の言葉をわざと取り違えてからかい、悟空は菩薩へ助けを願うのだと言い直す。善財童子は既にその名を授けられた紅孩児を、木叉は既知の恵岸行者を指す。それぞれの別名を同じ人物へ接続しており、紅孩児と恵岸行者を同一人物とするものではない。
  translation_status: reviewed
- id: xy-ch57-note-05-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: この部分は悟空が菩薩へ訴える話の続きとして読んだ。師が是非をわきまえないという評価を、語り手が無条件に保証する説明へ変えない。続く菩薩は、むしろ悟空の殺人を批判している。
  translation_status: reviewed
- id: xy-ch57-note-06-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 原文は「三件」と数え、その内訳に袈裟、錫杖、さらに三個の輪を挙げる。輪を一組として数える言い方を残し、五件への改訂はしない。呪文三篇と、輪を緩める呪文はないという菩薩の説明も、そのまま保持した。
  translation_status: reviewed
- id: xy-ch57-note-07-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 三蔵・八戒・沙悟浄と白馬を合わせた数。原文は人と馬を共に「口」で数える。「南山」はここでは南側の山という位置の表現とし、以前の虎の山や祝寿にいう南山と同一視しない。
  translation_status: reviewed
- id: xy-ch57-note-08-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 精・気・神、三花、四大、五行、法身という道教・仏教の身体観を重ねる詩。土・木には沙悟浄・八戒、金には悟空を重ねる読みができるが、水を含めたすべてを一対一の人物名へ置き換えない。神は神仏の人数ではなく心神の働きとして訳した。
  translation_status: reviewed
- id: xy-ch57-note-09-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 原字は「砑」。漢典はまさにこの箇所を例に、軽く接触する・ぶつける語義を示すため、強打を補わず軽い一打とした。それでも三蔵が気絶したという結果は、そのまま保持した。
  translation_status: reviewed
- id: xy-ch57-note-10-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 食癆病は古い病名。本文は黄胖、すなわち黄色くむくんだ姿を続けて描く。『雑病広要』の黄胖の記述と照合し、食に関わる衰弱の病と解したが、鉤虫症・結核など一つの現代病名には決めつけない。八戒の変身であって、実際の診断や治療の説明ではない。
  translation_status: reviewed
- id: xy-ch57-note-11-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 三蔵の発言は「行囊衣缽」。先の襲撃は青い毛氈の包み二つを奪うとし、その後も八戒は鉢を持っている。僧の所持品を総称する言い方とも読めるが、文言の食い違いを原文のまま残し、鉢の移動を創作しない。
  translation_status: reviewed
- id: xy-ch57-note-12-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 原文の「前年」を字義どおり一昨年とした。八戒が以前に花果山へ悟空を迎えに行った一件を回顧するが、作中の経過日数から年を数え直して修正しない。
  translation_status: reviewed
- id: xy-ch57-note-13-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 「莫僝僽」。教育部辞典は本回のこの文を、憂愁・煩悩の用例として挙げるため、不安や煩いを戒める言葉とした。後に続く「この家で乱暴をしてはいけない」との指図は、別に残した。
  translation_status: reviewed
- id: xy-ch57-note-14-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 「尖擔擔柴兩頭脫」は、両方とも取り逃がして何も得られないというたとえ。荷物の回収と帰還を気にする八戒の言葉として、薪と天秤棒の像を保った。
  translation_status: reviewed
- id: xy-ch57-note-15-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 黄婆・金老・木母・心猿は内丹の象徴語を人物の動きへ重ねたもの。ここでは黄婆が沙悟浄、金老と心猿が悟空、木母が八戒に対応する。金老は既存の金公と同じ金の働きの呼称として扱うが、新しい登場人物ではない。「延師」は、延の招き迎える意を取って、師をもてなすことと解した。細かな構文は留保する。道教の修行を現代の治療へ読み替えない。
  translation_status: reviewed
- id: xy-ch57-note-16-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 底本は「促病」。急迫した病として意味を取ったが、他の回や別版の「篤病」などへ原文を訂正しない。皇帝の姓「李」は、貞観・冥府からの帰還・玄奘への勅命という文脈から唐の太宗に対応し、同姓の他人物とは区別する。
  translation_status: reviewed
- id: xy-ch57-note-17-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 文牒には貞観十三年秋の署名の後、出国後に得た弟子三人の記載が続く。追記と考えられるが、誰がいつ書き加えたかは示されない。原文は独立した表示段落の末尾に閉じ鉤括弧を持ち、前段に対応する開きが明記されない。日本語では朗読される文書全体を一組の鉤括弧で示した。
  translation_status: reviewed
- id: xy-ch57-note-18-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 「喝道」の直前の主語は猿たちだが、文意からは洞の悟空の問いとも読める。話者を一方へ確定せず、話者不明とした。最初の「不認得」は沙悟浄だと分からないという叙述、続く「不肯相認」は沙悟浄から見て相手が自分と認めようとしないという受け止めである。この違いを保ち、どちらかへ統一しない。
  translation_status: reviewed
- id: xy-ch57-note-19-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: ここでの三蔵は僧の名前ではなく、仏教の経典を三つの部門に分けたもの。金蝉長老の前世や取経の目的は、沙悟浄が菩薩の言葉を引いて説明する形を保ち、後の展開を付け足さない。
  translation_status: reviewed
- id: xy-ch57-note-20-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 水簾洞の悟空が用いる棒の名は示されるが、その来歴や、既知の悟空本人の如意金箍棒との関係は、この時点で確定しない。同じ表記だからといって同じ物と決めつけず、かといって別物とも断言しない。
  translation_status: reviewed
- id: xy-ch57-note-21-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 原文の「滔星」は星を波立たせるような海の誇張、「月晶」は月の澄んだ光・精気として訳した。具体的な天文現象や石の水晶へ限定せず、底本の字を保つ。元精、乾・坤、鯤の変化など、宇宙と内丹を重ねる景物の語も省かない。
  translation_status: reviewed
- id: xy-ch57-note-22-body
  section_id: chapter-57
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 沙悟浄の花果山までの三昼夜、その後の南海までの一昼夜と、観音の四日間という証言を保持する。誰がどの姿でいたのかの真偽は、この回では決着せず、二人で調べに行くところで次回へ続く。ここで種族や後の名前を補わない。
  translation_status: reviewed

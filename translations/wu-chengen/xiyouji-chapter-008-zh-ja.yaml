    "description_ja": "法・論・経という三蔵の分類と説明、各部洲の善悪は物語中の如来の発言として保持し、実際の地域の人々の性質や一般的な仏教教義の事実説明とはしない。 本文の欠落ではなく解釈・校訂上の留保。"

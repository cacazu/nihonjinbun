  "translation_status": "draft"
- "id": "xy-ch08-002"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": "試問禪關，參求無數，往往到頭虛老。磨磚作鏡，積雪為糧，迷了幾多年少。毛吞大海，芥納須彌，金色頭陀微笑。悟時超十地三乘，凝滯了四生六道。誰聽得，絕想崖前，無陰樹下，杜宇一聲春曉。曹溪路險，鷲嶺雲深，此處故人音杳。千丈冰崖，五葉蓮開，古殿簾垂香裊。那時節，識破源流，便見龍王三寶。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 121
    "line_end": 121
    "source_sequence": 2
  "translation_ja": |-
    禅（ぜん・推定。心を静めて真理を悟る修行）の関門を問えば、探り求める者は数知れず、果てには空しく老いる者が多い。
    瓦を磨いて鏡とし、雪を積んで食糧とする。どれほどの若者が迷ったことか。
    毛が大海をのみ、芥子（けし・推定。ごく小さな種。ここでは小さいもののたとえ）の粒が須弥山（しゅみせん。仏教の世界観で世界の中央にそびえる山）を収め、金色の頭陀（こんじきのずだ・推定。厳しい修行で知られる、釈迦の弟子迦葉の呼び名）がほほえむ。
    悟れば十地（じゅうじ。菩薩が悟りへ進む修行の十段階）三乗（さんじょう・推定。声聞・縁覚・菩薩という、悟りへ向かう三つの道）を超え、滞れば四生（ししょう。胎・卵・湿気・自然の変化という、生まれ方の四分類）六道（ろくどう。生きものが生まれ変わって巡る六つの世界）にとどまる。
    誰が聞くだろう、思いの絶えた崖の前、陰なき木の下、春の明け方のほととぎすの一声を。
    曹渓（そうけい。禅宗の六祖慧能が教えを説いた中国の地）への道は険しく、霊鷲山（りょうじゅせん。釈迦が教えを説いたとされるインドの山）には雲深く、この地で旧友の便りは絶えた。
    千丈（じょう・推定。昔の長さの単位。一丈は十尺）の氷の崖に五葉の蓮が開き、古い殿の簾（すだれ・推定。細い竹などを並べてつるす日よけや仕切り）が垂れて香が細く立ちのぼる。
    そのとき、源と流れを見抜けば、竜王（りゅうおう・推定。水の世界を治める竜の王）の三宝（さんぼう・推定。三つの尊い宝。ここでの具体的な内訳は未詳）が見えるのだ。
  "translation_status": "draft"
- "id": "xy-ch08-003"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一篇詞，名《蘇武慢》。話表我佛如來辭別了玉帝，回至雷音寶剎。但見那三千諸佛、五百阿羅、八大金剛、無邊菩薩，一個個都執著幢幡寶蓋、異寶仙花，擺列在靈山仙境娑羅雙林之下接迎。如來駕住祥雲，對眾道：「我以甚深般若，遍觀三界。根本性原，畢竟寂滅。同虛空相，一無所有。殄伏乖猴，是事莫識。名生死始，法相如是。」說罷，放舍利之光，滿空有白虹四十二道，南北通連。大眾見了，皈身禮拜。少頃間，聚慶雲彩霧，登上品蓮臺，端然坐下。那三千諸佛、五百羅漢、八金剛、四菩薩，合掌近前禮畢，問曰：「鬧天宮攪亂蟠桃者，何也？」如來道：「那廝乃花果山產的一妖猴，罪惡滔天，不可名狀。概天神將，俱莫能降伏；雖二郎捉獲，老君用火鍛煉，亦莫能傷損。我去時，正在雷將中間揚威耀武，賣弄精神。被我止住兵戈，問他來歷。他言有神通，會變化，又駕觔斗雲，一去十萬八千里。我與他打了個賭賽，他出不得我手，卻將他一把抓住，指化五行山，封壓他在那裡。玉帝大開金闕瑤宮，請我坐了首席，立安天大會謝我，卻方辭駕而回。」大眾聽言喜悅，極口稱揚。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 122
    "line_end": 122
    "source_sequence": 3
  "translation_ja": |-
    この詞（し・推定。決まった曲調に合わせて作る中国の韻文）は「蘇武慢（そぶまん・推定。冒頭の詞に用いられている曲調の名）」という調べである。さて、わが仏如来（にょらい。悟りを開いた仏。ここでは霊山で教えを説く釈迦）は玉帝（ぎょくてい・推定。天上の神々を治める帝王）に別れを告げ、雷音宝刹（らいおんほうせつ・推定。如来が住み、仏たちが集まる寺）へ戻った。見ると、三千の仏、五百の阿羅漢（あらかん。煩悩を断ち、悟りに達した修行者）、八大金剛（はちだいこんごう・推定。如来に仕え、仏法を守る八体の力強い神々）、無数の菩薩（ぼさつ。悟りを求めながら、人々を救おうとする尊い存在）が、一人残らず幢（どう・推定。仏前や儀式で用いる、竿に付けた旗や飾り）や幡（はた・推定。仏前や儀式でつるす細長い旗）、宝蓋（ほうがい・推定。尊い人や仏の上に差しかける飾り傘）、珍宝や仙花を手に、霊山（れいざん。如来の住む聖なる山）の仙境（せんきょう・推定。仙人が住むとされる、俗世から離れた場所）、娑羅双樹（さらそうじゅ・推定。釈迦が最期を迎えた場所に生えていたとされる一対の木）の林の下に並んで迎えていた。如来は祥雲（しょううん・推定。めでたい兆しを表す雲）を止め、一同に語った。
    如来「私は甚深なる般若（はんにゃ・推定。物事の真実を見抜く仏教の智慧）によって、あまねく三界（さんがい・推定。仏教で生きものの住む世界を三つに分けたもの）を見た。根本の本性は、究極には寂滅（じゃくめつ・推定。煩悩や苦しみが消えた、静かな悟りの境地）であり、虚空（こくう・推定。何にも妨げられない空間）の相（そう・推定。物事の外に現れる姿や形）に等しく、何一つ有するものはない。あの悪賢い猿を鎮め降したが、このことを知る者はいない。名は生死の始まりであり、法の相はこのとおりだ。」
    言い終えると舎利（しゃり・推定。仏や聖者の遺骨。ここでは聖なる光のもと）の光を放ち、空いっぱいに四十二筋の白虹が南北を結んだ。一同はそれを見て、身を捧げて礼拝（らいはい・推定。尊い存在に礼をして拝むこと）した。しばらくすると、如来はめでたい雲と色とりどりの霧を集め、上品（じょうぼん・推定。仏教で、九つに分ける位のうち上位の三つ）の蓮台（れんだい・推定。仏や菩薩が座る、蓮の花をかたどった台）に上って、端然と座った。三千の仏、五百の羅漢（らかん・推定。煩悩を断ち、悟りに達した修行者）、八金剛（はちこんごう・推定。如来に仕えて仏法を守る八大金剛の略称）、四菩薩が合掌（がっしょう・推定。胸の前などで両手のひらを合わせて拝むこと）して前へ進み、礼を済ませて尋ねた。
    仏・羅漢・金剛（こんごう・推定。ここでは仏法を守る力強い神々）・菩薩の一同「天宮（てんきゅう・推定。天界にある宮殿）で暴れ、蟠桃（ばんとう。王母の園に実る、不老長寿の力を持つ仙桃）の宴を乱したのは、何者なのですか。」
    如来「あれは花果山（かかざん。孫悟空が生まれ、猿たちが暮らす山）に生まれた妖猿で、罪悪は天に満ち、言い表せぬほどだった。天の神将は誰も降伏させられず、二郎（じろう・推定。孫悟空と戦い、捕らえた二郎真君の略称）が捕らえ、老君（ろうくん・推定。丹薬や八卦炉を持つ太上老君の略称）が火で練っても傷つけられなかった。私が行ったときも、雷将（らいしょう・推定。雷をつかさどる天界の将軍）たちの中で威を振るい、力をひけらかしていた。私は戦いを止めさせ、素性を尋ねた。神通（じんずう・推定。修行で得るとされる、人知を超えた力）を持ち、変化（へんげ。術によって姿や形を変えること）をなし、筋斗雲（きんとうん・推定。宙返り一つで十万八千里を進む仙術の雲）に乗ればひと跳び十万八千里（り・推定。昔の道のりの単位。日本の一里と同じ長さとは限らない）だという。そこで賭けをしたが、私の手から出られなかった。それをひとつかみにし、指を五行山（ごぎょうざん・推定。如来が五本の指を変え、悟空を封じた山）へ変えて、その下に封じたのだ。玉帝は黄金の楼門と玉の宮を大きく開き、私を上座に迎え、安天大会（あんてんたいかい・推定。天界が平定されたことを祝う宴の名）を催して謝意を表された。それから、お暇して戻ったところだ。」
    一同は聞いて喜び、口をきわめてたたえた。
  "translation_status": "draft"
- "id": "xy-ch08-004"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "謝罷，各分班而退，各執乃事，共樂天真。果然是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 124
    "line_end": 124
    "source_sequence": 4
  "translation_ja": "礼を述べ終えると、それぞれの組に分かれて退き、各自の務めを取り、ともに自然の真性（しんしょう・推定。人や物に本来備わる真実の性質）を楽しんだ。まことに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch08-005"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": "瑞靄漫天竺，虹光擁世尊。西方稱第一，無相法王門。常見玄猿獻果，麋鹿啣花；青鸞舞，彩鳳鳴；靈龜捧壽，仙鶴噙芝。安享淨土祗園，受用龍宮法界。日日花開，時時果熟。習靜歸真，參禪果正。不滅不生，不增不減。煙霞縹緲隨來往，寒暑無侵不記年。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 125
    "line_end": 125
    "source_sequence": 5
  "translation_ja": |-
    瑞雲（ずいうん・推定。めでたい兆しとされる美しい雲）は天竺（てんじく・推定。中国や日本で用いられた、インドの古い呼び名）に満ち、虹の光は世尊（せそん。世で最も尊い方という、仏への尊称）を包む。西方（さいほう・推定。ここでは如来の住む西の仏の世界）第一と称えられる、姿なき法王（ほうおう・推定。教えの王という、仏への尊称）の門。
    黒い猿が果物を献じ、鹿が花をくわえるのは、いつもの眺め。青い鸞（らん・推定。鳳凰に似た、中国伝説の美しい鳥）が舞い、彩り美しい鳳凰（ほうおう。中国の伝説に登場する、めでたい鳥）が鳴く。
    霊亀（れいき・推定。めでたい霊力を持つとされる亀）は長寿を捧げ、仙鶴（せんかく・推定。仙人の世界にいる、長寿を表す鶴）は霊芝（れいし。古くから不老長寿に結びつけられたきのこ）をくわえる。浄土（じょうど・推定。仏が住む、煩悩や汚れのない世界）の祇園（ぎおん・推定。釈迦の説法の場となった祇園精舎。ここでは清浄な仏の園）を安らかに楽しみ、竜宮（りゅうぐう・推定。竜王の宮殿。ここでは東海の水晶宮と特定しない）の法界（ほっかい・推定。仏の教えがあまねく行き渡る世界）を享受する。
    日ごとに花が咲き、時ごとに果実が熟す。静けさを習って真に帰り、禅を究めて正しい果を得る。
    滅せず、生ぜず、増さず、減らず。煙霞（えんか・推定。煙のようにかすむ雲や霞）はかすかに往来に従い、寒暑に侵されず、年を数えない。
  "translation_status": "draft"
- "id": "xy-ch08-006"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 127
    "line_end": 127
    "source_sequence": 6
  "translation_ja": "詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch08-007"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    去來自在任優游，也無恐怖也無愁。
    極樂場中俱坦蕩，大千之處沒春秋。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 129
    "line_end": 130
    "source_sequence": 7
  "translation_ja": |-
    行くも来るも自在に、思うまま悠々と遊び、恐れもなく、憂いもない。
    極楽（ごくらく・推定。苦しみがなく、安らかに過ごす仏の世界）の地はすべて広々と安らかで、大千世界（だいせんせかい・推定。無数の世界を合わせた、仏教でいう広大な全宇宙）には春秋もない。
  "translation_status": "draft"
- "id": "xy-ch08-008"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛祖居於靈山大雷音寶剎之間。一日，喚聚諸佛、阿羅、揭諦、菩薩、金剛、比丘僧尼等眾曰：「自伏乖猿安天之後，我處不知年月，料凡間有半千年矣。今值孟秋望日，我有一寶盆，盆中具設百樣奇花、千般異果等物，與汝等享此盂蘭盆會，如何？」概眾一個個合掌，禮佛三匝領會。如來卻將寶盆中花果品物，著阿儺捧定，著迦葉佈散。大眾感激，各獻詩伸謝。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 132
    "line_end": 132
    "source_sequence": 8
  "translation_ja": |-
    如来は霊山の大雷音宝刹（だいらいおんほうせつ・推定。如来が住み、仏たちが集まる寺）に住んでいた。ある日、仏、阿羅漢、掲諦（ぎゃてい・推定。仏法を守護する神々）、菩薩、金剛、比丘（びく・推定。出家して戒律を守る男性の修行者）・比丘尼（びくに・推定。出家して戒律を守る女性の修行者）などの一同を呼び集めて告げた。
    如来「悪賢い猿を降し、天を安んじて以来、ここでは年月を知らぬが、人の世では五百年ほどたったであろう。今日は初秋の十五日。私には宝の盆があり、百種の珍しい花、千種の変わった果実などを盛ってある。お前たちとこの盂蘭盆会（うらぼんえ・推定。本来は祖先などを供養する仏教行事。ここでは如来が催す集い）を楽しみたいが、どうだ。」
    一同はそれぞれ合掌し、如来を三たび巡って礼拝し、会にあずかった。如来は宝の盆の花や果実などを阿儺（あなん・推定。如来に仕える弟子。阿難と同じ名の異表記）に持たせ、迦葉（かしょう。如来に仕える弟子。厳しい修行で知られる）に配らせた。一同は感激して、それぞれ詩を献じ、感謝を表した。
  "translation_status": "draft"
- "id": "xy-ch08-009"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "福詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 134
    "line_end": 134
    "source_sequence": 9
  "translation_ja": "福をたたえる詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch08-010"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    福星光耀世尊前，福納彌深遠更綿。
    福德無疆同地久，福緣有慶與天連。
    福田廣種年年盛，福海洪深歲歲堅。
    福滿乾坤多福蔭，福增無量永周全。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 136
    "line_end": 139
    "source_sequence": 10
  "translation_ja": |-
    福星（ふくせい・推定。福をもたらすとされる星）の光は世尊の前を照らし、福はますます深く、遠く長く受け入れられる。
    福徳（ふくとく。善い行いによって得られる幸せや恵み）は限りなく大地とともに久しく、福の縁はめでたく天につながる。
    福田（ふくでん・推定。供養や善行によって福を生む相手や場を田にたとえた語）は広く耕されて年ごとに盛んとなり、福の海は広く深く、歳ごとに堅固となる。
    福は天地に満ち、多くの恵みを垂れ、福は無量（むりょう。量りきれないほど多いこと）に増して、永く隅々まで行き渡る。
  "translation_status": "draft"
- "id": "xy-ch08-011"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祿詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 141
    "line_end": 141
    "source_sequence": 11
  "translation_ja": "禄（ろく・推定。役目に応じて受ける俸給や、暮らしを支える富）をたたえる詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch08-012"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    祿重如山彩鳳鳴，祿隨時泰祝長庚。
    祿添萬斛身康健，祿享千鍾世太平。
    祿俸齊天還永固，祿名似海更澄清。
    祿恩遠繼多瞻仰，祿爵無邊萬國榮。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 142
    "line_end": 145
    "source_sequence": 12
  "translation_ja": |-
    禄は山のように重く、彩り美しい鳳凰が鳴く。禄は泰平の時に従い、長庚（ちょうこう・推定。夕方の空に見える金星の呼び名）を祝う。
    禄は万斛（こく・推定。穀物などを量る昔の容積の単位）も増し、身は健やか。禄は千鍾（しょう・推定。穀物などを量る昔の大きな容積の単位）を享け、世は太平となる。
    禄の俸給は天に等しく、なお永く揺るがず、禄の誉れは海のように、いよいよ澄みわたる。
    禄の恩は遠くまで続き、多くの者が仰ぎ、禄と爵位（しゃくい・推定。君主から授けられる身分や称号）は果てしなく、万国が栄える。
  "translation_status": "draft"
- "id": "xy-ch08-013"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "壽詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 147
    "line_end": 147
    "source_sequence": 13
  "translation_ja": "寿をたたえる詩にいう。"
  "translation_status": "draft"
- "id": "xy-ch08-014"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    壽星獻彩對如來，壽域光華自此開。
    壽果滿盤生瑞靄，壽花新採插蓮臺。
    壽詩清雅多奇妙，壽曲調音按美才。
    壽命延長同日月，壽如山海更悠哉。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 149
    "line_end": 152
    "source_sequence": 14
  "translation_ja": |-
    寿星（じゅせい。長寿をつかさどる星の神）は如来に彩りを献じ、長寿の境の光は、ここから開ける。
    長寿の果実は盆に満ちて瑞雲を生み、摘みたての長寿の花は蓮台に挿される。
    長寿の詩は清雅で妙趣に富み、長寿の歌は優れた才に合わせて調べを整える。
    寿命は延びて日月と同じく、長寿は山や海のように、いよいよ悠久となる。
  "translation_status": "draft"
- "id": "xy-ch08-015"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "眾菩薩獻畢，因請如來明示根本，指解源流。那如來微開善口，敷演大法，宣揚正果，講的是三乘妙典，五蘊楞嚴。但見那天龍圍繞，花雨繽紛。正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 154
    "line_end": 154
    "source_sequence": 15
  "translation_ja": "菩薩たちは献じ終えると、如来に根本を明らかにし、源と流れを解き示すよう願った。如来は清らかな口をわずかに開き、大いなる法を広く説いて正果（しょうか・推定。修行の結果として得る正しい悟り）を宣揚した。語ったのは三乗の妙典、五蘊（ごうん・推定。人の心身を成り立たせる五つの要素）と楞厳（りょうごん・推定。ここでは深い禅定を説く楞厳経の教え）の教えである。天竜（てんりゅう。仏法を守る天の神々と竜）が周りを囲み、花の雨がひらひらと降り注いだ。まさに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch08-016"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": "禪心朗照千江月，真性清涵萬里天。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 156
    "line_end": 156
    "source_sequence": 16
  "translation_ja": "禅の心は千の川に映る月のように明るく照り、真の本性は万里の空を清らかに包む。"
  "translation_status": "draft"
- "id": "xy-ch08-017"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "如來講罷，對眾言曰：「我觀四大部洲，眾生善惡，各方不一：東勝神洲者，敬天禮地，心爽氣平；北俱盧洲者，雖好殺生，只因糊口，性拙情疏，無多作踐；我西牛賀洲者，不貪不殺，養氣潛靈，雖無上真，人人固壽；但那南贍部洲者，貪淫樂禍，多殺多爭，正所謂口舌兇場，是非惡海。我今有三藏真經，可以勸人為善。」諸菩薩聞言，合掌皈依，向佛前問曰：「如來有那三藏真經？」如來曰：「我有法一藏，談天；論一藏，說地；經一藏，度鬼。三藏共計三十五部，該一萬五千一百四十四卷，乃是修真之經，正善之門。我待要送上東土，叵耐那方眾生愚蠢，毀謗真言，不識我法門之旨要，怠慢了瑜迦之正宗。怎麼得一個有法力的，去東土尋一個善信，教他苦歷千山，詢經萬水，到我處求取真經，永傳東土，勸化眾生，卻乃是個山大的福緣，海深的善慶。誰肯去走一遭來？」當有觀音菩薩行近蓮臺，禮佛三匝道：「弟子不才，願上東土尋一個取經人來也。」諸眾擡頭觀看，那菩薩："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 157
    "line_end": 157
    "source_sequence": 17
  "translation_ja": |-
    如来は説法を終えると、一同に告げた。
    如来「四大部洲（しだいぶしゅう・推定。仏教の世界観にある東西南北の四つの大陸）を見るに、衆生（しゅじょう・推定。生きているすべてのもの）の善悪は土地ごとに異なる。東勝神洲（とうしょうしんしゅう。物語の世界を構成する四大陸のうち東の大陸）の者は天を敬い地を礼し、心はさわやかで気は穏やかだ。北俱盧洲（ほっくるしゅう・推定。物語の世界を構成する四大陸のうち北の大陸）の者は殺生を好むが、ただ口を養うためであり、性質は不器用で情は疎く、ひどく害をなすことは少ない。私の西牛賀洲（さいごかしゅう・推定。物語の世界を構成する四大陸のうち西の大陸）の者は貪らず、殺さず、気を養って霊性をひそかに保ち、至高の真人（しんじん・推定。道を究めたとされる、すぐれた仙人）ではなくても、誰もが寿命を堅く保つ。ところが南贍部洲（なんせんぶしゅう。物語の世界を構成する四大陸のうち南の大陸）の者は貪欲で淫ら、災いを喜び、殺し合い争い合うことが多い。まさに口舌の凶場、是非の悪海というべきだ。今、私には三蔵（さんぞう・推定。仏教の教えを三部門にまとめたもの。ここでは如来の三種の経蔵）の真経（しんぎょう。人々を正しい道へ導く、真実の経典）があり、人々に善を勧めることができる。」
    菩薩たちは聞くと、合掌して帰依（きえ・推定。仏やその教えを深く信じ、よりどころとすること）し、如来の前で尋ねた。
    菩薩たち「如来がお持ちの三蔵の真経とは、どのようなものでしょうか。」
    如来「法の一蔵は天を論じ、論の一蔵は地を説き、経の一蔵は亡霊を救う。三蔵は合わせて三十五部、一万五千百四十四巻で、真を修める経、善を正す門である。東土（とうど・推定。西方から見た東の地。ここでは中国）へ送ろうと思うが、困ったことに、あちらの衆生は愚かで、真言（しんごん。ここでは仏の真実の言葉や教え）をそしり、私の法門（ほうもん・推定。悟りへ導く仏の教え）の要旨を知らず、瑜伽（ゆが・推定。心を静め、真理と一つになるための修行）の正統を軽んじている。法力（ほうりき・推定。仏法や修行から得るとされる不思議な力）のある者が東土へ行って信心深い善人を探し、その者に千の山を苦労して越え、万の川を経を求めて渡り、ここへ真経を取りに来させられぬものか。それを永く東土へ伝え、衆生を教化するなら、山ほど大きな福縁（ふくえん・推定。幸せや恵みをもたらす縁）、海ほど深い善い果報（かほう・推定。行いの結果として受ける報い）となる。誰か、ひと往復してくれる者はいないか。」
    すると観音菩薩（かんのんぼさつ。人々の苦しみを救う菩薩。取経人を探す使命を受ける）が蓮台に近づき、如来を三たび巡って礼拝した。
    観音菩薩「不才の弟子ながら、東土へ行き、経を取りに来る者を探してまいりたいと存じます。」
    一同が顔を上げて見ると、その観音菩薩は、

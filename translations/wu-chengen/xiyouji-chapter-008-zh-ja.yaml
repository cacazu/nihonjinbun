  "translation_ja": |-
    第八回
    わが仏、経を成して極楽を伝え　観音、命を奉じて長安へ向かう
  "translation_status": "draft"
- "id": "xy-ch08-002"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": "試問禪關，參求無數，往往到頭虛老。磨磚作鏡，積雪為糧，迷了幾多年少。毛吞大海，芥納須彌，金色頭陀微笑。悟時超十地三乘，凝滯了四生六道。誰聽得，絕想崖前，無陰樹下，杜宇一聲春曉。曹溪路險，鷲嶺雲深，此處故人音杳。千丈冰崖，五葉蓮開，古殿簾垂香裊。那時節，識破源流，便見龍王三寶。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 121
    "line_end": 121
    "source_sequence": 2
  "translation_ja": |-
    禅の関門を問えば、探り求める者は数知れず、果てには空しく老いる者が多い。
    瓦を磨いて鏡とし、雪を積んで食糧とする。どれほどの若者が迷ったことか。
    毛が大海をのみ、芥子の粒が須弥山を収め、金色の頭陀がほほえむ。
    悟れば十地三乗を超え、滞れば四生六道にとどまる。
    誰が聞くだろう、思いの絶えた崖の前、陰なき木の下、春の明け方のほととぎすの一声を。
    曹渓への道は険しく、霊鷲山には雲深く、この地で旧友の便りは絶えた。
    千丈の氷の崖に五葉の蓮が開き、古い殿の簾が垂れて香が細く立ちのぼる。
    そのとき、源と流れを見抜けば、竜王の三宝が見えるのだ。
  "translation_status": "draft"
- "id": "xy-ch08-003"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一篇詞，名《蘇武慢》。話表我佛如來辭別了玉帝，回至雷音寶剎。但見那三千諸佛、五百阿羅、八大金剛、無邊菩薩，一個個都執著幢幡寶蓋、異寶仙花，擺列在靈山仙境娑羅雙林之下接迎。如來駕住祥雲，對眾道：「我以甚深般若，遍觀三界。根本性原，畢竟寂滅。同虛空相，一無所有。殄伏乖猴，是事莫識。名生死始，法相如是。」說罷，放舍利之光，滿空有白虹四十二道，南北通連。大眾見了，皈身禮拜。少頃間，聚慶雲彩霧，登上品蓮臺，端然坐下。那三千諸佛、五百羅漢、八金剛、四菩薩，合掌近前禮畢，問曰：「鬧天宮攪亂蟠桃者，何也？」如來道：「那廝乃花果山產的一妖猴，罪惡滔天，不可名狀。概天神將，俱莫能降伏；雖二郎捉獲，老君用火鍛煉，亦莫能傷損。我去時，正在雷將中間揚威耀武，賣弄精神。被我止住兵戈，問他來歷。他言有神通，會變化，又駕觔斗雲，一去十萬八千里。我與他打了個賭賽，他出不得我手，卻將他一把抓住，指化五行山，封壓他在那裡。玉帝大開金闕瑤宮，請我坐了首席，立安天大會謝我，卻方辭駕而回。」大眾聽言喜悅，極口稱揚。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 122
    "line_end": 122
    "source_sequence": 3
  "translation_ja": |-
    この詞は「蘇武慢」という調べである。さて、わが仏如来は玉帝に別れを告げ、雷音宝刹へ戻った。見ると、三千の仏、五百の阿羅漢、八大金剛、無数の菩薩が、一人残らず幢や幡、宝蓋、珍宝や仙花を手に、霊山の仙境、娑羅双樹の林の下に並んで迎えていた。如来は祥雲を止め、一同に語った。
    如来「私は甚深なる般若によって、あまねく三界を見た。根本の本性は、究極には寂滅であり、虚空の相に等しく、何一つ有するものはない。あの悪賢い猿を鎮め降したが、このことを知る者はいない。名は生死の始まりであり、法の相はこのとおりだ。」
    言い終えると舎利の光を放ち、空いっぱいに四十二筋の白虹が南北を結んだ。一同はそれを見て、身を捧げて礼拝した。しばらくすると、如来はめでたい雲と色とりどりの霧を集め、上品の蓮台に上って、端然と座った。三千の仏、五百の羅漢、八金剛、四菩薩が合掌して前へ進み、礼を済ませて尋ねた。
    仏・羅漢・金剛・菩薩の一同「天宮で暴れ、蟠桃の宴を乱したのは、何者なのですか。」
    如来「あれは花果山に生まれた妖猿で、罪悪は天に満ち、言い表せぬほどだった。天の神将は誰も降伏させられず、二郎が捕らえ、老君が火で練っても傷つけられなかった。私が行ったときも、雷将たちの中で威を振るい、力をひけらかしていた。私は戦いを止めさせ、素性を尋ねた。神通を持ち、変化をなし、筋斗雲に乗ればひと跳び十万八千里だという。そこで賭けをしたが、私の手から出られなかった。それをひとつかみにし、指を五行山へ変えて、その下に封じたのだ。玉帝は黄金の楼門と玉の宮を大きく開き、私を上座に迎え、安天大会を催して謝意を表された。それから、お暇して戻ったところだ。」
    一同は聞いて喜び、口をきわめてたたえた。
  "translation_status": "draft"
- "id": "xy-ch08-004"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "謝罷，各分班而退，各執乃事，共樂天真。果然是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 124
    "line_end": 124
    "source_sequence": 4
  "translation_ja": "礼を述べ終えると、それぞれの組に分かれて退き、各自の務めを取り、ともに自然の真性を楽しんだ。まことに、こうである。"
  "translation_status": "draft"
- "id": "xy-ch08-005"
  "section_id": "chapter-08"
  "kind": "verse"
  "origin": "source"
  "source_text": "瑞靄漫天竺，虹光擁世尊。西方稱第一，無相法王門。常見玄猿獻果，麋鹿啣花；青鸞舞，彩鳳鳴；靈龜捧壽，仙鶴噙芝。安享淨土祗園，受用龍宮法界。日日花開，時時果熟。習靜歸真，參禪果正。不滅不生，不增不減。煙霞縹緲隨來往，寒暑無侵不記年。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch8-1807472"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第008回&oldid=1807472"
    "line_start": 125
    "line_end": 125
    "source_sequence": 5
  "translation_ja": |-
    瑞雲は天竺に満ち、虹の光は世尊を包む。西方第一と称えられる、姿なき法王の門。
    黒い猿が果物を献じ、鹿が花をくわえるのは、いつもの眺め。青い鸞が舞い、彩り美しい鳳凰が鳴く。
    霊亀は長寿を捧げ、仙鶴は霊芝をくわえる。浄土の祇園を安らかに楽しみ、竜宮の法界を享受する。
    日ごとに花が咲き、時ごとに果実が熟す。静けさを習って真に帰り、禅を究めて正しい果を得る。
    滅せず、生ぜず、増さず、減らず。煙霞はかすかに往来に従い、寒暑に侵されず、年を数えない。
  "translation_status": "draft"

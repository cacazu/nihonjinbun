    "description_ja": "「龍王三寶」は底本の表記を保持し、竜王の三宝と直訳。禅の公案・四生六道・十地三乗などの教義的な細部、何を指す三宝かは留保する。 本文の欠落ではなく解釈・校訂上の留保。"

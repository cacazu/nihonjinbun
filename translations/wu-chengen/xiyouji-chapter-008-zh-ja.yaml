    "description_ja": "如来の韻律を持つ説法「殄伏乖猴，是事莫識。名生死始」は底本どおり訳し、別字に補訂しない。冒頭の無辺菩薩と後段の四菩薩、前回の鎮圧とこの回の回想の描写の違いもそのまま保つ。 本文の欠落ではなく解釈・校訂上の留保。"

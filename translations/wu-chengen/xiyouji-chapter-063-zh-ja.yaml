  "kind": "verse"
  "origin": "source"
  "source_text": "妖魔盜寶塔無光，行者擒妖報國王。小怪逃生回水內，老龍破膽各商量。九頭駙馬施威武，披掛前來展素強。怒發齊天孫大聖，金箍棒起十分剛。那怪物，九個頭顱十八眼，前前後後放毫光；這行者，一雙鐵臂千斤力，藹藹紛紛並瑞祥。鏟似一陽初現月，棒如萬里遍飛霜。他說：「你無干休把不平報。」我道：「你有意偷寶真不良。那潑賊，少輕狂，還他寶貝得安康。」棒迎鏟架爭高下，不見輸贏練戰場。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 148
    "line_end": 148
  "translation_ja": |-
    妖魔が宝を盗んで塔は光を失い、悟空は妖を捕らえ国王へ知らせる。
    小妖は命からがら水へ帰り、老竜は肝をつぶして策を相談する。
    九頭駙馬は威武を奮い、鎧姿で来て、日ごろの強さを披露する。
    斉天大聖の孫悟空（そんごくう）は怒りを発し、金箍棒を振り上げれば、力はすさまじい。
    あの妖怪は九つの頭に十八の目、前にも後ろにも光を放ち、
    こちらの悟空は鉄の両腕に千斤（きん）の力、めでたい気が群がり立ちこめる。
    鏟は陽の気が生まれ始めるころの細い月のよう、棒は万里（り）に舞い散る霜のよう。
    九頭駙馬「お前に関わりはない。不平を晴らす役などやめろ。」
    悟空「わざと宝を盗んだお前こそ、悪いやつだ。
    ろくでなしめ、思い上がるな。宝を返せば無事に済む。」
    棒が迎え、鏟が受け、優劣を競うが、戦場で技を尽くしても勝負は見えぬ。
  "translation_status": "reviewed"
- "id": "xy-ch63-012"

  "source_text": "好妖怪，急縱身披掛了，使一般兵器，叫做月牙鏟，步出宮，分開水道，在水面上叫道：「是甚麼齊天大聖？快上來納命。」行者與八戒立在岸邊，觀看那妖精怎生打扮："
  "source_languages":

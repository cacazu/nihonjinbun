  "translation_ja": "原文の「踢天弄井」は、天に上り地に入るほどの大きな能力を表す慣用句。教育部『重編國語辭典修訂本』は同じ『西遊記』の用例を挙げる。井戸を実際に移動・破壊する特定の術だとは限定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-02-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の「一個侮著嘴」の「侮」は、そのまま原文欄に残した。対になる「掩著耳」と、唇を切られた者の動作から、口を押さえる意味に読んだ。原字を「捂」などへ補訂したわけではない。二匹の魚種と名前の対応は、前回の自己紹介どおり。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-03-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「兜鍪」は通常は兜を指すが、底本は兜の句に続いて「兜鍪甲」と記すため、訳では甲冑とした。「九宸」は天の高い宮域をいう誇張で、九つの具体的な宮殿を補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-04-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三代」は底本の語を残した。前回には三年間にわたる僧の投獄・交代が語られており、血縁上の三世代と限定しない。「命」も含め、被害を単なる評判の悪化へ弱めていない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-05-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「妙高」は仏教では須弥山の訳語にもなるが、ここは如来の霊妙で高い働きをたたえる句として訳した。底本の語順を保ち、特定の山をここで出現させる描写とはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-06-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「武不善作」は、武力を使う勝負を穏やかな作法だけでは済ませられない、という脅しとして読んだ。後続する「不得留情」と殺害の可能性が、その意味を支える。心配する言葉は九頭駙馬の挑発であり、語り手による慈悲心の説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-07-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「一陽初現月」は月の生まれ始めの姿と陽の気を重ねる比喩と解した。月齢や暦日までは固定しない。「千斤」は力の大きさの誇張として単位を残し、現代の質量へ換算しない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-08-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「九頭蟲」の「蟲」は、現代日本語の昆虫だけに限定されない。本文は本相をこの名で呼び、続いて翼や鳥の性質を描くため、名前は「九頭虫」と保った。現代の特定の鳥種へ同定したわけではない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-09-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "九つの頭があるとされたうえで、底本は腰のあたりから「又伸出一個頭」と語る。訳も「さらに頭を一つ伸ばし」とし、それが十番目なのか、既存の九つの一つなのかを補って決めない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-10-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "魚の列挙「鯖鮊鯉鱖」と、甲殻・鱗を持つ水族「龜鱉黿鼉」を全て残した。「鯖」は日本語のサバと即断せず音で読む。『康熙字典』には青魚を指す用法があるが、作中の魚種の厳密な現代分類は留保する。「黿」は大型のスッポン類、「鼉」はワニ類として訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-11-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "二郎真君は第六回で悟空を捕らえた相手で、ここでは七聖を兄弟分として呼ぶ。同じ人物間の敬意と気まずさを原文どおり併存させ、この回に語られない和解の出来事を追加しない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-12-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「向蒙莫大之恩」は以前の大恩を述べる挨拶だが、この言葉自体はどの行為への恩かを特定していない。第六回の捕縛を恩と感じた理由など、心理的な因果を訳者が補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-13-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は「酒也是素的」と述べ、肉を含むかどうかと飲酒の戒律を区別せず、酒を精進のものとして勧めている。別の回の戒酒の説明へ合わせて、酒を水や茶、無酒精の飲み物に置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-14-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "血を滴らせる九頭虫を、この妖怪の後裔とする語り手の伝承説明。『本草綱目』禽之四「鬼車鳥」にも、もとは十の頭を持ち、犬に一つを噛まれて九つとなり、血を滴らせるという別の伝承がある。ただし、この比較によって『西遊記』の頭数を十へ直さない。現代の動物学的事実として保証する説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-15-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「婿喪女亡」は老竜の妻の発言として、婿も娘も死んだと訳した。語り手は九頭駙馬が北海へ逃げたと述べており、妻の言葉をもとにその死亡を確定しない。娘についても、背中を突かれて倒れた描写と、この発言を区別する。この段落の「又問」は直前に尋問した国王の問いの継続と読んだが、当該句には主語が明記されていない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-16-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文は「琵琶骨」。肩の後ろにある肩甲骨を指す伝統的な呼称として訳した。鎖で骨を貫く動作を、単に肩へ鎖をかける拘束に弱めていない。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-17-body"
  "section_id": "chapter-63"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「金乃流動之物」は金銭の流通を含ませた語として読んだが、金属そのものの不変性を論じる科学的説明へ改めない。「光乃閃灼之氣」と対にした悟空の寺名の縁起づけである。「勅建護国」は勅命による建立と国を守る役割を示す額の文言で、この改名を以前の「金光寺」の名称へさかのぼらせない。"
  "translation_status": "reviewed"

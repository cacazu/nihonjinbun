  "source_text": "他兩個往往來來，鬥經三十餘合，不分勝負。豬八戒立在山前，見他們戰到甜美之處，舉著釘鈀，從妖精背後一築。原來那怪九個頭，轉轉都是眼睛，看得明白。見八戒在背後來時，即使鏟鐏架著釘鈀，鏟頭抵著鐵棒。又耐戰五七合，擋不得前後齊掄，他卻打個滾，騰空跳起，現了本像，乃是一個九頭蟲。觀其形像十分惡，見此身模怕殺人。他生得："

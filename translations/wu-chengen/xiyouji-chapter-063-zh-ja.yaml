  "translation_ja": |-
    二匹の小妖怪は命令を受け、痛みをこらえて命からがら逃げ、鎖や縄を引きずったまま水中へ潜った。大スッポン、ワニ、亀、スッポン、エビ、カニ、魚の妖怪たちが驚いて取り囲み、水族たち「お前たち、どうして縄や鎖を引きずっているんだ？」と尋ねた。一匹は耳を押さえて頭を振り尾を振り、一匹は口を押さえて足を踏み鳴らし胸をたたいた。二匹は騒ぎたてながら、まっすぐ竜王の宮殿へ上がった。
    奔波児灞と灞波児奔「大王、大変なことになりました！」
    万聖竜王はちょうど九頭駙馬（きゅうとうふば）と酒を飲んでいた。二匹が来たのを見ると杯を置き、何事が起きたのかと尋ねた。二匹はすぐに報告した。
    奔波児灞と灞波児奔「昨夜、見回りに行きましたところ、塔を掃除していた三蔵と悟空に捕らえられ、鉄の鎖で縛られました。今朝は国王の前へ出され、その後、悟空と八戒が私たちをつかんで連れてきて、一匹の耳を切り、一匹の唇を切り落とし、水の中へ投げ入れました。塔の上の宝を返せと、知らせに寄こされたのでございます。」
    そうして一部始終を詳しく話した。万聖竜王は、相手が悟空、あの斉天大聖だと聞くと、魂が体を離れ九天のかなたへ散るほど怯え、震えながら婿に言った。
    万聖竜王「婿殿、ほかの者なら、まだ何とかできようが、本当にあいつなら、これはよくないぞ。」
    九頭駙馬は笑った。
    九頭駙馬「お義父上、ご安心ください。私は幼いころから武芸をいくらか学び、四海の内でも何人かの豪傑と渡り合っております。何を恐れることがありましょう。私が出ていって三合（ごう）も戦えば、あいつは必ず首をすくめて降参し、顔も上げられなくなります。」
  "translation_status": "reviewed"

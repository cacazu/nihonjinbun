  "source_text": "行者大怒，罵道：「這潑賊怪，有甚強能，敢開大口？走上來，吃老爺一棒。」那駙馬更不心慌，把月牙鏟架住鐵棒，就在那亂石山頭，這一場真個好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 146
    "line_end": 146
  "translation_ja": |-
    悟空は激怒して罵った。
    悟空「このろくでなしの盗っ人妖怪め！　何の腕があって、そんな大口をたたく。こっちへ来て、この俺の棒を食らえ！」
    九頭駙馬はまるで慌てず、月牙鏟で鉄棒を受け止めた。乱石山の頂での、この一戦こそ、まことにすさまじい。

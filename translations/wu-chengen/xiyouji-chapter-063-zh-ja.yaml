  "translation_ja": |-
    さすがの九頭駙馬は、さっと身を起こして鎧を着込み、月牙鏟（げつがさん）という武器を手に宮殿を出た。水を分けて進み、水面から叫んだ。
    九頭駙馬「斉天大聖とかいうのは、どいつだ！　さっさと来て命を差し出せ！」
    悟空と八戒は岸に立ち、九頭駙馬の装いを見た。

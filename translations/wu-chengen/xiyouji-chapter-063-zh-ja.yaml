  "source_text": "他見無人對答，又叫一聲：「那個是齊天大聖？」行者按一按金箍，理一理鐵棒道：「老孫便是。」那怪道：「你家居何處？身出何方？怎生得到祭賽國，與那國王守塔，卻大膽獲我頭目，又敢行兇，上吾寶山索戰？」行者罵道：「你這賊怪，原來不識你孫爺爺哩。你上前，聽我道："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"

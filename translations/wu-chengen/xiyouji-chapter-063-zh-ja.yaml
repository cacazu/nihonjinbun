  "kind": "verse"
  "origin": "source"
  "source_text": "戴一頂爛銀盔，光欺白雪；貫一副兜鍪甲，亮敵秋霜。上罩著錦征袍，真個是彩雲籠玉；腰束著犀紋帶，果然像花蟒纏金。手執著月牙鏟，霞飛電掣；腳穿著豬皮靴，水利波分。遠看時一頭一面，近睹處四面皆人：前有眼，後有眼，八方通見；左也口，右也口，九口言論。一聲吆喝長空振，似鶴飛鳴貫九宸。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 123
    "line_end": 123
  "translation_ja": |-
    輝く銀の兜をかぶれば、光は白雪にもまさり、
    甲冑をまとえば、その照りは秋の霜にも劣らない。
    上に羽織った錦の戦袍は、まさに彩雲が玉を包むよう。
    腰に巻いた犀の紋様の帯は、さながら花模様の大蛇が黄金に巻きつくよう。
    手に持つ月牙鏟は、霞が飛び稲妻が走るかのごとく、
    足に履いた豚皮の靴は、水を滑らかに分け、波を割る。
    遠くからなら一つの頭、一つの顔、近くに寄れば四方がどれも人の顔。
    前にも目、後ろにも目、八方をすべて見通し、
    左にも口、右にも口、九つの口がものを言う。
    ひと声叫べば大空が震え、飛ぶ鶴の鳴き声さながら九重の天を貫く。
  "translation_status": "reviewed"

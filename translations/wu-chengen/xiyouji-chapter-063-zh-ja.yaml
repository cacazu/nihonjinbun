    "line_start": 149
    "line_end": 149
  "translation_ja": "二人は行きつ戻りつ三十余合も戦ったが、勝負がつかなかった。山の手前に立っていた八戒は、戦いがいよいよ面白くなったところを見て、まぐわを振り上げ、九頭駙馬の背後から一撃を加えた。ところが相手には頭が九つあり、どちらへ向いても目があるので、はっきり見えていた。八戒が背後から来ると見るや、鏟の石突きでまぐわを受け、刃先で鉄棒を押さえた。さらに五合、七合と持ちこたえたが、前後から一斉に振るう攻撃を防ぎきれなくなると、ひと転がりして空へ跳び上がり、本来の姿を現した。それは九頭虫（きゅうとうちゅう）だった。その姿は何とも醜悪で、その体つきを見れば、恐ろしさに死んでしまいそうだ。どんな姿かといえば、"
  "translation_status": "reviewed"
- "id": "xy-ch63-013"
  "section_id": "chapter-63"
  "kind": "verse"
  "origin": "source"
  "source_text": "毛羽鋪錦，團身結絮。方圓有丈二規模，長短似黿鼉樣致。兩隻腳尖利如鉤，九個頭攢環一處。展開翅極善飛揚，縱大鵬無他力氣；發起聲遠振天涯，比仙鶴還能高唳。眼多閃灼晃金光，氣傲不同凡鳥類。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    毛羽は錦を敷いたよう、丸い体は綿を固めたよう。
    全体は一丈（じょう）二尺（しゃく）ほどの大きさで、長さは大スッポンやワニに似る。
    二本の足先は鉤のように鋭く、九つの頭がひと所に輪をなして集まる。
    翼を広げれば、飛ぶことはすこぶる巧み。あの大鵬（たいほう）でさえ、その力には及ばない。
    声を発すれば遥かな空の果てまで響き、仙鶴（せんかく）よりもさらに高く鳴く。
    数多い目は金色にきらきら光り、その気位の高さは並の鳥とは違っていた。
  "translation_status": "reviewed"
- "id": "xy-ch63-014"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "豬八戒看見心驚道：「哥啊，我自為人，也不曾見這等個惡物。是甚血氣生此禽獸也？」行者道：「真個罕有，真個罕有。等我趕上打去。」好大聖，急縱祥雲，跳在空中，使鐵棒照頭便打。那怪物大顯身，展翅斜飛，颼的打個轉身，掠到山前，半腰裡又伸出一個頭來，張開口如血盆相似，把八戒一口咬著鬃，半拖半扯，捉下碧波潭水內而去。及至龍宮外，還變作前番模樣，將八戒擲之於地，叫：「小的們何在？」那裡面鯖鮊鯉鱖之魚精，龜鱉黿鼉之介怪，一擁齊來，道聲：「有。」駙馬道：「把這個和尚綁在那裡，與我巡探的小卒報仇。」眾精推推嚷嚷，擡進八戒去時，那老龍王歡喜，迎出道：「賢婿有功，怎生捉他來也？」那駙馬把上項原故說了一遍。老龍即命排酒賀功不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 152
    "line_end": 152
  "translation_ja": |-
    八戒はそれを見て肝を冷やした。
    八戒「兄貴、俺は生まれてこの方、こんな恐ろしいものを見たことがない。いったい何の血と気から、こんな鳥獣が生まれたんだ？」
    悟空「まったく珍しい、まったく珍しい。俺が追いついて打ってやろう。」
    さすがの悟空は、すぐさま瑞雲に乗って空中へ跳び、鉄棒で頭をめがけて打ちかかった。九頭駙馬は体を大きく現し、翼を広げて斜めに飛び、ひゅっと身をひるがえして山の前へかすめ下りた。すると胴の中ほどから、さらに頭を一つ伸ばし、血の盆のような口を開けて、八戒のたてがみにひと口で食いついた。引きずり引っぱりして、碧波潭の水中へさらっていった。竜宮の外まで来ると、先ほどの姿に戻り、八戒を地面へ放り出して叫んだ。
    九頭駙馬「手下ども、どこにいる！」
    中からは、鯖（せい）・鮊（はく）・鯉・鱖（けい）の魚の妖怪と、亀・スッポン・大スッポン・ワニの甲羅や鱗を持つ妖怪が、一斉に押し寄せた。
    妖怪たち「はい！」
    九頭駙馬「この和尚をそこへ縛っておけ。見回りに出した小兵どもの仇を取るのだ。」
    妖怪たちが押し合い騒ぎながら八戒を担ぎ込むと、万聖竜王は喜んで迎えに出た。
    万聖竜王「婿殿、手柄であったな。どうやって捕まえてきたのだ。」
    九頭駙馬は、今しがたの次第をひと通り語った。万聖竜王は、ただちに酒を用意して戦功を祝うよう命じたが、この話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch63-015"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫行者見妖精擒了八戒，心中懼道：「這廝恁般利害。我待回朝見師，恐那國王笑我；待要開言罵戰，曾奈我又單身，況水面之事不慣。且等我變化了進去，看那怪把獃子怎生擺佈。若得便，且偷他出來幹事。」好大聖，捻著訣，搖身一變，還變做一個螃蟹，淬於水內，徑至牌樓之前。原來這條路是他前番襲牛魔王盜金睛獸走熟了的。直至那宮闕之下，橫爬過去，又見那老龍王與九頭蟲合家兒歡喜飲酒。行者不敢相近，爬過東廊之下，見幾個蝦精蟹精紛紛紜紜耍子。行者聽了一會言談，卻就學語學話，問道：「駙馬爺爺拿來的那長嘴和尚，這會死了不曾？」眾精道：「不曾死，縛在那西廊下哼的不是？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 153
    "line_end": 153
  "translation_ja": |-
    さて、悟空は九頭駙馬に八戒を捕らえられ、心中恐ろしくなって考えた。
    悟空「なんて手ごわいやつだ。朝廷へ帰ってお師匠さまに会えば、あの国王に笑われるだろう。罵って戦いを挑もうにも、こちらは一人きりだし、水の上のことには慣れていない。ひとまず姿を変えて潜り込み、あいつが八戒をどう扱っているか見てみよう。隙があれば、こっそり連れ出して、また仕事にかかろう。」
    さすがの悟空は指で印を結び、身をひと振りして、また一匹のカニに変わった。水中へ潜り、まっすぐ牌楼（はいろう）の前まで行った。この道は、前に牛魔王（ぎゅうまおう）の後をつけて金睛獣（きんせいじゅう）を盗んだとき、よく覚えていたのだ。宮殿の下まで来て横這いに進むと、万聖竜王と九頭駙馬が、一家そろって楽しげに酒を飲んでいるのが見えた。悟空はあえて近づこうとはせず、東の廊下へ這っていった。そこでは、何匹かのエビやカニの妖怪がにぎやかに遊んでいた。しばらく会話を聞いてから、その話しぶりをまねて尋ねた。
    悟空「駙馬（ふば）さまが捕まえてきた、あの長い口の和尚は、もう死んだかい？」
    エビとカニの妖怪たち「死んでいないさ。西の廊下に縛られて、うなっているじゃないか。」
  "translation_status": "reviewed"
- "id": "xy-ch63-016"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聽說，又輕輕的爬過西廊，真個那獃子綁在柱上哼哩。行者近前道：「八戒，認得我麼？」八戒聽得聲音，知是行者，道：「哥哥，怎麼了？反被這廝捉住我也。」行者四顧無人，將拑咬斷索子叫走。那獃子脫了手道：「哥哥，我的兵器被他收了，又奈何？」行者道：「你可知道收在那裡？」八戒道：「當被那怪拿上宮殿去了。」行者道：「你先去牌樓下等我。」八戒逃生，悄悄的溜出。行者復身爬上宮殿觀看。左首下有光彩森森，乃是八戒的釘鈀放光。使個隱身法，將鈀偷出，到牌樓下，叫聲：「八戒，接兵器。」獃子得了鈀，便道：「哥哥，你先走，等老豬打進宮殿。若得勝，就捉住他一家子；若不勝，敗出來，你在這潭岸上救應。」行者大喜，只教仔細。八戒道：「不怕他，水裡本事，我略有些兒。」行者丟了他，負出水面不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空はそれを聞くと、またそっと西の廊下へ這っていった。確かに八戒が柱に縛られ、うなっていた。悟空は近づいた。
    悟空「八戒、俺が分かるか？」
    八戒は声を聞いて悟空だと知り、言った。
    八戒「兄貴、どうしたらいいんだ。こっちがあいつに捕まっちまったよ。」
    悟空は辺りを見回して誰もいないのを確かめ、はさみで縄を切って、逃げるよう促した。手が自由になった八戒は言った。
    八戒「兄貴、武器を取り上げられているんだ。どうしよう。」
    悟空「どこへしまったか分かるか？」
    八戒「あの妖怪が宮殿へ持って上がった。」
    悟空「お前は先に牌楼の下へ行って待っていろ。」
    八戒は命拾いして、こそこそと抜け出した。悟空は身を返して宮殿へ這い上がり、中を見た。左手の下の方に、光がきらめいている。八戒のまぐわが光を放っているのだ。悟空は姿を隠す術を使ってまぐわを盗み出し、牌楼の下へ行って呼んだ。
    悟空「八戒、武器を受け取れ！」
    まぐわを手にした八戒は言った。
    八戒「兄貴は先に出てくれ。俺が宮殿へ攻め込む。勝てたら、一家そろって捕まえてやる。勝てなければ負けて出てくるから、潭の岸で助けてくれ。」
    悟空は大いに喜び、気をつけろとだけ言った。
    八戒「怖くないさ。水の中なら、俺にも少しは腕がある。」
    悟空は八戒を残し、水面へ浮かび出たが、この話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch63-017"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這八戒束了皂直裰，雙手纏鈀，一聲喊，打將進去。慌得那大小水族奔奔波波，跑上宮殿，吆喝道：「不好了，長嘴和尚掙斷繩返打進來了。」那老龍與九頭蟲並一家子俱措手不及，跳起來，藏藏躲躲。這獃子不顧死活，闖上宮殿，一路鈀，築破門扇，打破桌椅，把些吃酒的家火之類盡皆打碎。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    八戒は黒い僧衣をきゅっと締め、両手でまぐわを握り、ひと声叫んで攻め込んだ。大小の水族たちは大慌てで右往左往し、宮殿へ走り上がって叫んだ。
    水族たち「大変です！　長い口の和尚が縄を引きちぎって、逆に攻め込んできました！」
    万聖竜王も九頭駙馬も一家の者たちも、まったく手の打ちようがなく、跳び上がってあちらこちらへ隠れた。八戒は死ぬも生きるも構わず宮殿へ押し入り、進む先々でまぐわを振るって、戸板を突き破り、机や椅子を打ち壊し、酒席の道具のたぐいをことごとく砕いた。その証しの詩がある。
  "translation_status": "reviewed"
- "id": "xy-ch63-018"
  "section_id": "chapter-63"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    木母遭逢水怪擒，心猿不捨苦相尋。
    暗施巧計偷開鎖，大顯神威怒恨深。
    駙馬忙攜公主躲，龍王戰慄絕聲音。
    水宮絳闕門窗損，龍子龍孫盡沒魂。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 157
    "line_end": 160
  "translation_ja": |-
    木母（もくぼ）は水の妖怪に捕らえられ、心猿（しんえん）は見捨てず、苦心して捜しにゆく。
    ひそかに妙計を施して鎖を外し、神威を大いに振るえば、怒りと恨みは深い。
    駙馬は慌てて公主を連れて隠れ、竜王は震え上がって声もない。
    水の宮殿、朱塗りの門楼は戸も窓も壊され、竜の子も孫も魂が抜けた。
  "translation_status": "reviewed"
- "id": "xy-ch63-019"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這一場，被八戒把玳瑁屏打得粉碎，珊瑚樹摜得凋零。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 162
    "line_end": 162
  "translation_ja": "この大暴れで、八戒はべっ甲の屏風を粉々に打ち砕き、珊瑚の木を投げつけて、枝もばらばらにした。"
  "translation_status": "reviewed"
- "id": "xy-ch63-020"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那九頭蟲將公主安藏在內，急取月牙鏟，趕至前宮，喝道：「潑夯豕彘！怎敢欺心驚吾眷族？」八戒罵道：「這賊怪，你焉敢將我捉來？這場不干我事，是你請我來家打的。快拿寶貝還我，回見國王了事；不然，決不饒你一家命也。」那怪那肯容情，咬定牙齒，與八戒交鋒。那老龍才定了神思，領龍子、龍孫各執槍刀，齊來攻取。八戒見事體不諧，虛幌一鈀，撤身便走。那老龍帥眾追來。須臾，攛出水中，都到潭面上翻騰。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    九頭駙馬は万聖公主（ばんせいこうしゅ）を奥の安全な場所へ隠すと、急いで月牙鏟を取り、前の宮殿へ駆けつけて怒鳴った。
    九頭駙馬「ろくでなしの、間抜けな豚め！　よくも思い上がって、俺の家族を怯えさせたな！」
    八戒は罵り返した。
    八戒「この盗っ人妖怪め、よくも俺を捕まえてきやがったな。今度の騒ぎは俺のせいじゃないぞ。お前が家へ呼びつけて、暴れさせたんだ。さっさと宝を渡せ。国王のもとへ帰れば、それで話は済む。さもなきゃ、お前の一家の命は絶対に助けてやらんぞ！」
    九頭駙馬に情けをかける気などあるはずもなく、歯を食いしばって八戒と戦った。万聖竜王はようやく気を落ち着け、竜の子や孫にそれぞれ槍や刀を持たせ、率いて一斉に攻めかかった。八戒は具合が悪くなったと見て、まぐわをひと振りするふりをし、身を引いて逃げた。万聖竜王が一同を率いて追いかけた。たちまち水中から飛び出し、皆で潭の水面を跳び回った。
  "translation_status": "reviewed"
- "id": "xy-ch63-021"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫行者立於潭岸等候，忽見他們追趕八戒，出離水中，就半踏雲霧，掣鐵棒，喝聲：「休走！」只一下，把個老龍頭打得稀爛。可憐血濺潭中紅水泛，屍飄浪上敗鱗浮。諕得那龍子、龍孫各各逃命，九頭駙馬收龍屍，轉宮而去。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    一方、悟空は潭の岸に立って待っていた。皆が八戒を追って水中から出てくるのを見ると、身を半ば雲霧に乗せ、鉄棒を抜いて怒鳴った。
    悟空「逃がすか！」
    ただ一撃で、万聖竜王の頭をぐしゃぐしゃに打ち砕いた。あわれ、潭に血が散り、赤い水が広がり、
    波には死体が漂い、砕けた鱗が浮かぶ。竜の子も孫も怯え、それぞれ命からがら逃げた。九頭駙馬は万聖竜王の死体を収め、宮殿へ戻っていった。
  "translation_status": "reviewed"
- "id": "xy-ch63-022"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者與八戒且不追襲，回上岸，備言前事。八戒道：「這廝銳氣挫了，被我那一路鈀打進去時，打得落花流水，魂散魄飛。正與那駙馬廝鬥，卻被老龍王趕著，卻虧了你打死。那廝們回去，一定停喪掛孝，決不肯出來。今又天色晚了，卻怎奈何？」行者道：「管甚麼天晚，乘此機會，你還下去攻戰。務必取出寶貝，方可回朝。」那獃子意懶情疏，徉徉推託。行者催逼道：「兄弟不必多疑，還像剛才引出來，等我打他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    悟空と八戒は、ひとまず追撃せずに岸へ戻り、先ほどのことを詳しく話し合った。
    八戒「あいつらの勢いはくじいてやったぞ。俺がまぐわを振るって攻め込んだときには、こてんぱんに打ちのめして、魂も吹き飛ばしてやった。ちょうどあの駙馬と戦っていたら、竜王まで追ってきたが、兄貴が打ち殺してくれて助かったよ。あいつらは帰ったら、きっと遺体を安置して喪服を着るだろうから、絶対に出てこないだろう。もう日も暮れたし、どうしよう。」
    悟空「日暮れなんか構うものか。この機会に、もう一度潜って戦え。何としても宝を取り戻してからでなければ、朝廷へは帰れんぞ。」
    八戒は気が進まず、のらくらと言い訳をした。悟空はせき立てた。
    悟空「弟よ、心配するな。さっきと同じように誘い出してくれれば、俺が打ってやる。」
  "translation_status": "reviewed"
- "id": "xy-ch63-023"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兩人正自商量，只聽得狂風滾滾，慘霧陰陰，忽從東方徑往南去。行者仔細觀看，乃二郎顯聖，領梅山六兄弟，架著鷹犬，挑著狐兔，擡著獐鹿，一個個腰挎彎弓，手持利刃，縱風霧踴躍而來。行者道：「八戒，那是我七聖兄弟，倒好留請他們，與我助戰。若得成功，倒是一場大機會也。」八戒道：「既是兄弟，極該留請。」行者道：「但內有顯聖大哥，我曾受他降伏，不好見他。你去攔住雲頭，叫道：『真君，且略住住，齊天大聖在此進拜。』他若聽見是我，斷然住了。待他安下，我卻好見。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    二人が相談していると、激しい風がごうごうと吹き、暗い霧が立ちこめて、ふいに東からまっすぐ南へ向かっていった。悟空がよく見ると、二郎顕聖（じろうけんせい）こと二郎真君（じろうしんくん）が梅山六兄弟（ばいざんろくきょうだい）を率いていた。鷹や犬を連れ、狐や兎を担ぎ、ノロジカや鹿を運び、皆が腰に弓を下げ、手に鋭い刃物を持ち、風霧に乗って勢いよくやって来る。
    悟空「八戒、あれは俺の兄弟分の七聖（しちせい）だ。ちょうどいい、引きとめて加勢を頼もう。うまくいけば、これが大きな好機になる。」
    八戒「兄弟なら、ぜひ引きとめて頼むべきだ。」
    悟空「ただ、あの中には顕聖（けんせい）の兄貴がいる。俺は昔あの人に降伏させられたから、顔を合わせづらいんだ。お前が行って雲をとめ、『真君（しんくん）、しばしお待ちください。斉天大聖がお目にかかりたいと申しております』と呼びかけろ。俺だと聞けば、きっととまってくれる。落ち着いてからなら、俺も会いやすい。」
  "translation_status": "reviewed"
- "id": "xy-ch63-024"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子急縱雲頭，上山攔住，厲聲高叫道：「真君，且慢車駕，有齊天大聖請見哩。」那爺爺見說，即傳令，就停住六兄弟，與八戒相見畢，問：「齊天大聖何在？」八戒道：「現在山下聽呼喚。」二郎道：「兄弟們，快去請來。」六兄弟乃是康、張、姚、李、郭、直，各各出營叫道：「孫悟空哥哥，大哥有請。」行者上前，對眾作禮，遂同上山。二郎爺爺迎見，攜手相攙，一同相見，道：「大聖，你去脫大難，受戒沙門，刻日功完，高登蓮座，可賀，可賀。」行者道：「不敢。向蒙莫大之恩，未展斯須之報。雖然脫難西行，未知功行何如。今因路遇祭賽國，答救僧災，在此擒妖索寶。偶見兄長車駕，大膽請留一助。未審兄長自何而來，肯見愛否？」二郎笑道：「我因閑暇無事，同眾兄弟採獵而回。幸蒙大聖不棄留會，足感故舊之情。若命挾力降妖，敢不如命。卻不知此地是何怪賊？」六聖道：「大哥忘了？此間是亂石山，山下乃碧波潭萬聖之龍宮也。」二郎驚訝道：「萬聖老龍卻不生事，怎麼敢偷塔寶？」行者道：「他近日招了一個駙馬，乃是九頭蟲成精。他郎丈兩個做賊，將祭賽國下了一場血雨，把金光寺塔頂舍利佛寶偷來。那國王不解其意，苦拿著僧人拷打。是我師父慈悲，夜來掃搭，當被我在塔上拿住兩個小妖，是他差來巡探的。今早押赴朝中，實實供招了。那國王就請我師收降，師命我等到此。先一場戰，被九頭蟲腰裡伸出一個頭來，把八戒啣了去。我卻又變化下水，解了八戒。才然大戰一場，是我把老龍打死，那廝們收屍掛孝去了。我兩個正議索戰，卻見兄長儀仗降臨，故此輕瀆也。」二郎道：「既傷了老龍，正好與他攻擊，使那廝不能措手，卻不連窩巢都滅絕了？」八戒道：「雖是如此，奈天晚何？」二郎道：「兵家云：『征不待時。』何怕天晚？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    八戒は急いで雲に乗り、山の上へ行って行く手を遮り、大声で呼びかけた。
    八戒「真君、お待ちください。斉天大聖がお目にかかりたいそうです！」
    二郎真君は聞くや命令を出し、六兄弟をとめた。八戒と挨拶を交わしてから尋ねた。
    二郎真君「斉天大聖はどちらに？」
    八戒「山の下で、お呼びを待っております。」
    二郎真君「皆、早くお迎えしてくれ。」
    六兄弟とは、康（こう）・張（ちょう）・姚（よう）・李（り）・郭（かく）・直（ちょく）である。皆が陣から出て呼んだ。
    六兄弟「孫悟空の兄貴、兄上がお呼びです！」
    悟空は前へ出て一同に礼をし、ともに山へ上がった。二郎真君が迎え、互いに手を取って支え合い、一同で挨拶を交わした。
    二郎真君「大聖（たいせい）、大難を脱して仏門の戒を受けられたそうですね。じきに修行も成就し、高い蓮の座へ上られることでしょう。おめでとう、おめでとう。」
    悟空「とんでもありません。以前は大きなご恩を受けながら、ほんの少しも報いることができずにおります。難を脱して西へ向かってはおりますが、修行の功がどうなるかは分かりません。今度は道中で祭賽国を通り、僧たちを災難から救おうと、ここで妖怪を捕らえ、宝を取り戻そうとしているのです。たまたま兄貴のご一行をお見かけし、厚かましくも引きとめて、お力添えを願いました。どちらからいらしたのでしょう。お助けいただけますか。」
    二郎真君は笑った。
    二郎真君「暇でしたので、皆と狩りに出た帰りです。大聖が私などにも声をかけてくださり、旧友の情けがありがたい。力を合わせて妖怪を降せとのお頼みなら、従わずにおられましょうか。ただ、ここには何という妖賊がいるのです？」
    六兄弟「兄上、お忘れですか。ここは乱石山、山の下は碧波潭の万聖竜王の竜宮です。」
    二郎真君は驚いた。
    二郎真君「万聖竜王は騒ぎを起こすような者ではないのに、どうして塔の宝など盗んだのでしょう。」
    悟空「近ごろ婿を迎えたのですが、それが九頭虫の妖怪なのです。あの婿と舅の二人が盗賊となり、祭賽国に血の雨を降らせて、金光寺の塔の頂から仏舎利（ぶっしゃり）の宝を盗みました。国王には訳が分からず、僧たちを捕まえてひどい拷問を加えていたのです。うちのお師匠さまが慈悲の心から昨夜、塔を掃除されたとき、私は塔の上で二匹の小妖怪を捕まえました。あいつらが見回りに出した者です。今朝、朝廷へ引き立てると、すっかり白状しました。国王はお師匠さまに妖怪退治を頼み、お師匠さまの命令で私たちがここへ来ました。最初の戦いでは、九頭虫が腰のあたりから頭を一つ出し、八戒をくわえて連れ去りました。そこで私は姿を変えて水中へ潜り、八戒を助け出しました。ついさっき、もう一度大立ち回りをして、私が竜王を打ち殺し、あいつらは死体を収めて喪に服しに帰りました。二人で次の戦いを相談していたところへ兄貴のご一行が来られたので、失礼ながらお声をかけたのです。」
    二郎真君「竜王を討ったのなら、今こそ攻めかかって、手を打つ暇も与えなければ、巣ごと根絶やしにできるではありませんか。」
    八戒「それはそうですが、日が暮れたら、どうします？」
    二郎真君「兵法にも『出征は時を待たず』と言う。日暮れを何で恐れるのです。」
  "translation_status": "reviewed"
- "id": "xy-ch63-025"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "康、姚、郭、直道：「大哥莫忙。那廝家眷在此，料無處去。孫二哥也是貴客，豬剛鬣又歸了正果，我們營內有隨帶的酒餚，教小的們取火，就此鋪設：一則與二位賀喜，二來也當敘情。且歡會這一夜，待天明索戰何遲？」二郎大喜道：「賢弟說得極當。」卻命小校安排。行者道：「列位盛情，不敢固卻。但自做和尚，都是齋戒，恐葷素不便。」二郎道：「有素果品，酒也是素的。」眾兄弟在星月光前，幕天席地，舉杯敘舊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    康・姚・郭・直が言った。
    康・姚・郭・直「兄上、そうお急ぎにならずとも。あいつの家族はここにいるのですから、逃げる先もないでしょう。二番目の兄貴である孫さんも大切なお客ですし、猪剛鬣（ちょごうりょう）も正道の成果を得ておられます。陣には持参の酒や料理がありますから、手下たちに火をおこさせ、ここで用意させましょう。一つはお二人のお祝いに、もう一つは旧交を温めるために。今夜は楽しく過ごし、夜明けを待って戦いを挑んでも、遅くはないでしょう。」
    二郎真君は大いに喜んだ。
    二郎真君「皆の言うとおりだ。」
    そして下役の兵たちに支度を命じた。
    悟空「皆さまのお気持ちを、むげにお断りはできません。ただ、和尚になってからは戒を守り、精進しております。肉食か精進かで、ご面倒をかけはしませんか。」
    二郎真君「精進の果物がありますし、酒も精進のものです。」
    兄弟たちは星月の光の下で、天を幕、大地を敷物とし、杯を挙げて昔を語り合った。
  "translation_status": "reviewed"
- "id": "xy-ch63-026"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "正是寂寞更長，歡娛夜短。早不覺東方發白。那八戒幾鍾酒吃得興抖抖的道：「天將明了，等老豬下水去索戰也。」二郎道：「元帥仔細，只要引他出來，我兄弟們好下手。」八戒笑道：「我曉得，我曉得。」你看他斂衣纏鈀，使分水法，跳將下去，徑至那牌樓下。發聲喊，打入殿內。此時那龍子披了麻，看著龍屍哭；龍孫與那駙馬，在後面收拾棺材哩。這八戒罵上前，手起處，鈀頭著重，把個龍子夾腦連頭，一鈀築了九個窟窿。諕得那龍婆與眾往裡亂跑，哭道：「長嘴和尚又把我兒打死了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    寂しいと夜は長く、楽しいと夜は短いもの。いつの間にか、東の空が白んでいた。八戒は大きな杯で何杯か酒を飲み、すっかり気をよくして言った。
    八戒「夜が明けるぞ。俺が水へ潜って、戦いを挑んでこよう。」
    二郎真君「元帥、気をつけて。ただ誘い出してくだされば、私たち兄弟が手を下せます。」
    八戒は笑った。
    八戒「分かった、分かった。」
    見れば八戒は衣を締め、まぐわを握り、水を分ける術を使って飛び込み、まっすぐ牌楼の下へ行った。ひと声叫ぶと、殿内へ攻め込んだ。そのとき竜王の息子は麻の喪服を着て、万聖竜王の遺体を前に泣いていた。孫と九頭駙馬は、奥で棺を用意していた。八戒は罵りながら近づき、手を振り上げるなり、重いまぐわの刃を振り下ろし、竜王の息子の頭を脳もろとも突き、一撃で九つの穴をあけた。竜の老婆は驚き、皆と一緒に奥へ逃げ惑いながら泣き叫んだ。
    竜の老婆「長い口の和尚が、今度はうちの息子を殺したよ！」
  "translation_status": "reviewed"
- "id": "xy-ch63-027"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那駙馬聞言，即使月牙鏟，帶龍孫往外殺來。這八戒舉鈀迎敵，且戰且退，跳出水中。這岸上齊天大聖與七兄弟一擁上前，槍刀亂扎，把個龍孫剁成幾斷肉餅。那駙馬見不停當，在山前打個滾，又現了本像，展開翅，旋繞飛騰。二郎即取金弓，安上銀彈，扯滿弓，往上就打。那怪急鎩翅，掠到邊前，要咬二郎。半腰裡才伸出一個頭來，被那頭細犬攛上去，汪的一口，把頭血淋淋的咬將下來。那怪物負痛逃生，徑投北海而去。八戒便要趕去，行者止住道：「且莫趕他，正是『窮寇勿追』。他被細犬咬了頭，必定是多死少生。等我變做他的模樣，你分開水路，趕我進去，尋那公主，詐他寶貝來也。」二郎與六聖道：「不趕他倒也罷了，只是遺這種類在世，必為後人之害。」至今有個九頭蟲滴血，是遺種也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 174
    "line_end": 174
  "translation_ja": |-
    九頭駙馬はこれを聞くと、月牙鏟を取り、竜王の孫を連れて外へ打って出た。八戒はまぐわを挙げて迎え撃ち、戦いながら退いて水中から跳び出した。岸では悟空と七人の兄弟が一斉に押しかかり、槍や刀で乱れ突きにして、竜王の孫を幾つもの平たい肉の塊に切り刻んだ。九頭駙馬は形勢が悪いと見て、山の手前でひと転がりし、また本来の姿を現した。翼を広げ、旋回しながら舞い上がる。二郎真君は金の弓を取り、銀の弾をつがえ、いっぱいに引き絞って上へ放った。九頭駙馬は急いで翼をすぼめてそばへかすめ寄り、二郎真君に噛みつこうとした。胴の中ほどから頭を一つ突き出した途端、あの細犬（さいけん）が跳び上がって、わんとひと噛みし、その頭を血まみれのまま食いちぎった。九頭駙馬は痛みを負って命からがら逃げ、まっすぐ北海（ほっかい）へ向かった。八戒は追おうとしたが、悟空がとめた。
    悟空「追うな。まさに『追い詰めた敵は追うな』だ。細犬に頭を食いちぎられたのだから、まず死ぬ見込みの方が大きく、生き延びる見込みは少ないだろう。俺があいつの姿に変わる。お前は水路を開き、俺を追い込んでくれ。公主を見つけて、宝をだまし取ってこよう。」
    二郎真君と六兄弟「追わぬのはよいとしても、この種類を世に残せば、必ず後世の人々の害になるだろう。」
    今でも血を滴らせる九頭虫がいるが、それがこの生き残りの子孫なのだ。
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒依言，分開水路。行者變作怪像前走，八戒吆吆喝喝後追。漸漸追至龍宮，只見那萬聖公主道：「駙馬，怎麼這等慌張？」行者道：「那八戒得勝，把我趕將進來，覺道不能敵他。你快把寶貝好生藏了。」那公主急忙難識真假，即於後殿裡取出一個渾金匣子來，遞與行者道：「這是佛寶。」又取出一個白玉匣子，也遞與行者道：「這是九葉靈芝。你拿這寶貝藏去，等我與豬八戒鬥上兩三合，擋住他。你將寶貝收好了，再出來與他合戰。」行者將兩個匣兒收在身邊，把臉一抹，現了本像道：「公主，你看我可是駙馬麼？」公主慌了，便要搶奪匣子。被八戒跑上去，著背一鈀，築倒在地。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 175
    "line_end": 175
  "translation_ja": |-
    八戒は言われたとおり水路を分けた。悟空は九頭駙馬の姿に変わって前を行き、八戒は大声で怒鳴りながら後を追った。やがて竜宮まで追い込むと、万聖公主が声をかけた。
    万聖公主「駙馬、どうしてそんなに慌てているのです？」
    悟空「八戒が勝って、俺をここまで追ってきた。どうもかなわぬようだ。早く宝を、しっかり隠してくれ。」
    万聖公主は急なことで本物と偽物の区別がつかず、すぐ奥の殿から純金の箱を取り出し、悟空に渡した。
    万聖公主「これが仏の宝です。」
    さらに白玉の箱を一つ取り出し、それも悟空に渡した。
    万聖公主「こちらが九葉霊芝（きゅうようれいし）です。この宝を持って隠してください。私が八戒と二、三合戦って食い止めます。宝をしまい終えたら、また出てきて一緒に戦ってください。」
    悟空は二つの箱を身につけると、顔をひとなでして本来の姿を現した。
    悟空「公主、よく見ろ。俺が駙馬に見えるか？」
    万聖公主は慌てて箱を奪い返そうとした。そこへ八戒が駆け寄り、背中をまぐわでひと突きして、地面へ突き倒した。
  "translation_status": "reviewed"
- "id": "xy-ch63-029"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "還有一個老龍婆撤身就走，被八戒扯住，舉鈀才築，行者道：「且住，莫打死他，留個活的，好去國內見功。」遂將龍婆提出水面。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 177
    "line_end": 177
  "translation_ja": |-
    まだ残っていた竜の老婆が、身をひるがえして逃げ出した。八戒がつかまえ、まぐわを振り上げて突こうとすると、悟空が言った。
    悟空「待て、殺すな。一人生かしておけば、国へ帰って手柄の証しになる。」
    そこで、竜の老婆をつかんで水面へ引き出した。
  "translation_status": "reviewed"
- "id": "xy-ch63-030"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者隨後捧著兩個匣子上岸，對二郎道：「感兄長威力，得了寶貝，掃淨妖賊也。」二郎道：「一則是那國王洪福齊天，二則是賢崑玉神通無量，我何功之有？」兄弟們俱道：「孫二哥既已功成，我們就此告別。」行者感謝不盡，欲留同見國王。諸公不肯，遂帥眾回灌口去訖。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 179
    "line_end": 179
  "translation_ja": |-
    悟空も二つの箱を捧げ持って後から岸へ上がり、二郎真君に言った。
    悟空「兄貴のお力のおかげで宝を手に入れ、妖賊を一掃できました。」
    二郎真君「一つには、あの国王の福が天にも並ぶほど大きいから、二つには、ご兄弟の神通力が限りないからです。私に何の手柄がありましょう。」
    兄弟たちは皆、言った。
    兄弟たち「二番目の兄貴である孫さんも役目を果たされたので、私たちはここでお別れいたします。」
    悟空は感謝してもしきれず、引きとめて一緒に国王に会おうとしたが、一同は承知しなかった。皆を率いて灌口（かんこう）へ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch63-031"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者捧著匣子，八戒拖著龍婆，半雲半霧，頃刻間到了國內。原來那金光寺解脫的和尚都在城外迎接。忽見他兩個雲霧定時，近前磕頭禮拜，接入城中。那國王與唐僧正在殿上講論。這裡有先走的和尚，仗著膽，入朝門奏道：「萬歲，孫、豬二老爺擒賊獲寶而來也。」那國王聽說，連忙下殿，共唐僧、沙僧迎著，稱謝神功不盡，隨命排筵謝恩。三藏道：「且不須賜飲，著小徒歸了塔中之寶，方可飲宴。」三藏又問行者道：「汝等昨日離國，怎麼今日才來？」行者把那戰駙馬，打龍王，逢真君，敗妖精，及變作詐寶貝之事，細說了一遍。三藏與國王、大小文武，俱喜之不勝。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 180
    "line_end": 180
  "translation_ja": |-
    悟空は箱を捧げ持ち、八戒は竜の老婆を引きずって、雲と霧に乗り、あっという間に祭賽国へ着いた。金光寺で苦しみから解放された僧たちは、そろって城外へ出迎えに来ていた。二人が雲霧をとめるのを見ると、近寄って頭を地につけて拝み、城内へ迎え入れた。国王と三蔵は、ちょうど殿上で語り合っていた。先に走った僧が一人、勇気を出して朝廷の門を入り、奏上した。
    僧「陛下、孫さまと猪（ちょ）さまのお二人が、賊を捕らえ、宝を取り戻してお帰りです！」
    国王は聞くや、慌てて殿を下り、三蔵、沙悟浄とともに迎え、その神通力に繰り返し礼を述べた。そして恩に報いる宴を用意するよう命じた。
    三蔵「お酒を賜るのは、まだ結構でございます。まず弟子に塔の宝を元へ戻させ、それから宴を頂きましょう。」
    三蔵は、また悟空に尋ねた。
    三蔵「お前たちは昨日、国を発ったのに、どうして今日になって戻ったのです？」
    悟空は、九頭駙馬と戦い、万聖竜王を打ち、二郎真君に出会い、九頭駙馬を敗走させ、姿を変えて宝をだまし取ったことまで、詳しくひと通り語った。三蔵も国王も、大小の文武の官も、喜びに堪えなかった。
  "translation_status": "reviewed"
- "id": "xy-ch63-032"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "國王又問：「龍婆能人言語否？」八戒道：「乃是龍王之妻，生了許多龍子、龍孫，豈不知人言？」國王道：「既知人言，快早說前後做賊之事。」龍婆道：「偷佛寶，我全不知，都是我那夫君龍鬼與那駙馬九頭蟲，知你塔上之光乃是佛家舍利子，三年前下了血雨，乘機盜去。」又問：「靈芝草是怎麼偷的？」龍婆道：「只是小女萬聖公主私入大羅天上靈霄殿前，偷的王母娘娘九葉靈芝草。那舍利子得這草的仙氣溫養著，千年不壞，萬載生光。去地下或田中掃一掃，即有萬道霞光，千條瑞氣。如今被你奪來，弄得我夫死子絕，婿喪女亡，千萬饒了我的命罷。」八戒道：「正不饒你哩。」行者道：「家無全犯。我便饒你，只便要你長遠替我看塔。」龍婆道：「好死不如惡活。但留我命，憑你教做甚麼。」行者叫取鐵索來。當駕官即取鐵索一條，把龍婆琵琶骨穿了。教沙僧：「請國王來看我們安塔去。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 181
    "line_end": 181
  "translation_ja": |-
    国王はさらに尋ねた。
    国王「その竜の老婆は、人間の言葉を話せるのか？」
    八戒「竜王の妻で、あれほどたくさんの子や孫をもうけたのです。人間の言葉が分からないはずがありましょう。」
    国王「話せるのなら、盗みの一部始終を早く申せ。」
    老竜の妻「仏の宝を盗んだことは、私はまるで存じません。すべて、亡くなって鬼となったうちの夫と、婿の九頭虫がしたことです。あなたさまの塔の光が仏家の舎利子（しゃりし）だと知り、三年前に血の雨を降らせ、その機会に盗み出したのでございます。」
    国王「では、霊芝草（れいしそう）はどうやって盗んだのだ？」
    老竜の妻「娘の万聖公主が、ひそかに大羅天（だいらてん）へ入り、霊霄殿（れいしょうでん）の前で、王母（おうぼ）さまの九葉霊芝草（きゅうようれいしそう）を盗んだのです。あの舎利子は、この草の仙気に温かく養われれば、千年たっても壊れず、万年たっても光を放ちます。地面や田へ持っていき、さっと掃くだけで、一万筋の霞の光と千筋の瑞気が現れます。今はあなたがたに奪われ、夫は死に、子孫は絶え、婿も娘も死にました。どうか、私の命だけはお助けください。」
    八戒「助けてなどやるものか。」
    悟空「一家の全員が犯人というわけではない。命は助けてやるが、その代わり、いつまでも俺に代わって塔を守ってもらうぞ。」
    老竜の妻「立派に死ぬより、惨めでも生きる方がましです。命さえ助けてくだされば、何でも言いつけに従います。」
    悟空が鉄の鎖を持ってこさせると、御前に控えた役人がただちに一本の鎖を取り出し、老竜の妻の肩甲骨に通した。悟空は沙悟浄に言いつけた。
    悟空「国王をお誘いして、塔を元どおりにするところをご覧いただこう。」
  "translation_status": "reviewed"
- "id": "xy-ch63-033"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那國王即忙排駕，遂同三藏攜手出朝，並文武多官，隨至金光寺。行者上塔，將舍利子安在第十三層塔頂寶瓶中間，把龍婆鎖在塔心柱上。念動真言，喚出本國土地、城隍與本寺伽藍們，命三日送飲食一餐，與這龍婆度口；少有差訛，即行處斬。眾神暗中領諾。行者卻將芝草把十三層塔層層掃過，安在瓶內，溫養舍利子。這才是整舊如新，霞光萬道，瑞氣千條，依然八方共睹，四國同瞻。下了塔門，國王就謝道：「不是老佛與三位菩薩到此，怎生得明此事也！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 182
    "line_end": 182
  "translation_ja": |-
    国王は急いで行列を整えさせ、三蔵と手を取り合って朝廷を出た。文武の官たちも一緒に、金光寺へ向かった。悟空は塔に上がり、舎利子を十三層目の頂にある宝瓶（ほうびょう）の中へ納め、老竜の妻を塔の心柱に鎖でつないだ。真言を唱えて、この国の土地神と城隍（じょうこう）、寺の伽藍神（がらんじん）たちを呼び出し、三日に一度、一食分の飲食を運んで、老竜の妻を食いつながせるよう命じた。少しでも間違いがあれば、ただちに斬首するという。神々は人目に見えぬまま、命令を承った。悟空は霊芝草で十三層の塔を一層ずつ掃き、瓶の中へ納めて舎利子を養わせた。これで古い塔は新しいもののように整い、一万筋の霞の光、千筋の瑞気を放って、もとのように八方から仰ぎ見られ、四つの国から見渡せるようになった。塔の門から下りてくると、国王が礼を言った。
    国王「仏さまと三人の菩薩さまが来てくださらなかったら、どうしてこの事件を明らかにできたでしょう。」
  "translation_status": "reviewed"
- "id": "xy-ch63-034"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者道：「陛下，『金光』二字不好，不是久住之物：金乃流動之物，光乃閃灼之氣。貧僧為你勞碌這場，將此寺改作伏龍寺，教你永遠常存。」那國王即命換了字號，懸上新匾，乃是「敕建護國伏龍寺」。一壁廂安排御宴；一壁廂召丹青寫下四眾生形，五鳳樓註了名號。國王擺鑾駕，送唐僧師徒，賜金玉酬答。師徒們堅辭，一毫不受。這真個是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 184
    "line_end": 184
  "translation_ja": |-
    悟空「陛下、『金光（きんこう）』の二字はよくありません。長くとどまるものではないからです。金は流通してゆくもので、光はちらちら輝く気にすぎません。私は陛下のためにこれだけ働いたのですから、この寺を伏竜寺（ふくりゅうじ）と改め、永久に残るようにいたしましょう。」
    国王はさっそく名を改めさせ、新しい額を掲げた。そこには「勅建護国伏竜寺（ちょくけんごこくふくりゅうじ）」とあった。一方で御宴を整えさせ、一方で絵師を呼び、師弟四人の生き姿を描かせて、五鳳楼（ごほうろう）に名を記させた。国王は車駕を整え、三蔵一行を送り出し、金や玉を贈って報いようとした。だが師弟たちは固く辞退し、わずかなものも受け取らなかった。まことに、
  "translation_status": "reviewed"
- "id": "xy-ch63-035"
  "section_id": "chapter-63"
  "kind": "verse"
  "origin": "source"
  "source_text": "邪怪剪除諸境靜，寶塔回光大地明。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 186
    "line_end": 186
  "translation_ja": |-
    邪悪な妖怪を除けば、あたり一帯は静まり、
    宝塔が光を取り戻せば、大地は明るく照らされる。
  "translation_status": "reviewed"
- "id": "xy-ch63-036"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知此去前路如何，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 188
    "line_end": 188
  "translation_ja": "さて、この先の道はどうなっているのか。それは次回のお話で。"
  "translation_status": "reviewed"
- "id": "xy-ch63-note-01-body"

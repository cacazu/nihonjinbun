  "translation_ja": |-
    第六十三回
    二人の僧が妖怪を討って竜宮を騒がせ、聖なる者たちが邪を除いて宝を取り戻す
  "translation_status": "reviewed"
- "id": "xy-ch63-002"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說祭賽國王與大小公卿見孫大聖與八戒騰雲駕霧，提著兩個小妖飄然而去，一個個朝天禮拜道：「話不虛傳，今日方知有此輩神仙活佛。」又見他遠去無蹤，卻拜謝三藏、沙僧道：「寡人肉眼凡胎，只知高徒有力量，拿住妖賊便了，豈知乃騰雲駕霧之上仙也。」三藏道：「貧僧無些法力，一路上多虧這三個小徒。」沙僧道：「不瞞陛下說，我大師兄乃齊天大聖皈依，他曾大鬧天宮，使一條金箍棒，十萬天兵，無一個對手，只鬧得太上老君害怕，玉皇大帝心驚。我二師兄乃天蓬元帥果正，他也曾掌管天河八萬水兵大眾。惟我弟子無法力，乃捲簾大將受戒。愚弟兄若干別事無能，若說擒妖縛怪、拿賊捕亡、伏虎降龍、踢天弄井，以至攪海翻江之類，略通一二。這騰雲駕霧、喚雨呼風，與那換斗移星、擔山趕月，特餘事耳，何足道哉！」國王聞說，愈十分加敬，請唐僧上坐，口口稱為「老佛」，將沙僧等皆稱為「菩薩」。滿朝文武欣然，一國黎民頂禮不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 118
    "line_end": 118
  "translation_ja": |-
    さて、祭賽国（さいさいこく）の国王と大小の公卿たちは、悟空（ごくう）と八戒（はっかい）が雲に乗り霧を駆って、二匹の小妖怪を提げたまま、ふわりと飛び去るのを見た。皆がそれぞれ天に向かって拝んだ。
    国王と公卿たち「噂は嘘ではなかった。こんな仙人や生き仏がおられるとは、今日初めて知った。」
    やがて二人が遠くへ去って姿も見えなくなると、国王は三蔵（さんぞう）と沙悟浄（さごじょう）に拝礼して礼を述べた。
    国王「私は生身の目しか持たぬ凡人ゆえ、お弟子は腕力があって妖賊を捕まえてくださる、それだけのことと思っておりました。まさか雲に乗り霧を駆る、すぐれた仙人でいらっしゃるとは。」
    三蔵「私には、何の法力もございません。道中ずっと、この三人の弟子に助けてもらっております。」
    沙悟浄「陛下、包み隠さず申し上げます。一番上の兄弟子は、斉天大聖（せいてんたいせい）が仏門に帰依した者でございます。かつて天宮（てんきゅう）で大暴れし、一本の金箍棒（きんこぼう）を振るって、十万の天兵のうち誰一人として敵になりませんでした。太上老君（たいじょうろうくん）を恐れさせ、玉皇大帝（ぎょくこうたいてい）を震え上がらせるほど騒ぎを起こしたのです。二番目の兄弟子は、天蓬元帥（てんぽうげんすい）が正道に帰した者で、かつて天の川の水兵八万を統べておりました。ただ、この私だけは法力がなく、捲簾大将（けんれんたいしょう）が戒を受けた者でございます。私ども兄弟はほかのことには無能ですが、妖怪を捕らえて縛り、賊を捕まえ逃亡者を追い、虎を伏せ竜を従え、天地を駆け巡る術を使い、海をかき回し川をひっくり返すたぐいなら、少しは心得ております。雲に乗り霧を駆り、雨を呼び風を起こし、星々の位置を移し、山を担いで月を追うなどは、ほんの余技にすぎません。何ほどのことでございましょう。」
    国王はこれを聞くと、いよいよ深く敬い、三蔵を上座へ招いて、何かと言うたび「仏さま」と呼んだ。沙悟浄たちは、皆「菩薩さま」と呼ばれた。朝廷の文武の官は喜び、国じゅうの民は頭を地につけて拝んだが、この話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch63-003"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說孫大聖與八戒駕著狂風，把兩個小妖攝到亂石山碧波潭，住定雲頭。將金箍棒吹了一口仙氣，叫：「變！」變作一把戒刀，將一個黑魚怪割了耳朵，鮎魚精割了下唇，撇在水裡，喝道：「快早去對那萬聖龍王報知，說我齊天大聖孫爺爺在此，著他即送祭賽國金光寺塔上的原寶出來，免他一家性命；若迸半個『不』字，我將這潭水攪淨，教他一門兒老幼遭誅。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    一方、悟空と八戒は激しい風に乗り、二匹の小妖怪を乱石山（らんせきざん）の碧波潭（へきはたん）へ運んで、雲をとめた。悟空は金箍棒に仙気をひと息吹きかけた。
    悟空「変われ！」
    そう叫ぶと、棒は一本の戒刀（かいとう）に変わった。それで黒魚（こくぎょ）の灞波児奔（ははじほん）の耳を切り、ナマズの奔波児灞（ほんぱじは）の下唇を切り落とすと、二匹を水中へ放り捨てて怒鳴った。
    悟空「さっさと万聖竜王（ばんせいりゅうおう）のところへ行って知らせろ。『斉天大聖の孫（そん）さまがここにいる。祭賽国の金光寺（きんこうじ）の塔から持ち去った宝を、今すぐ元どおりに差し出せば、一家の命は助けてやる』とな。『いや』の半言でも吐いてみろ。この潭の水をかき尽くして、一族の老いも若きも皆殺しにしてやるぞ。」
  "translation_status": "reviewed"

  "translation_ja": |-
    誰も答えないので、九頭駙馬はもうひと声叫んだ。
    九頭駙馬「どいつが斉天大聖だ！」
    悟空は頭の金箍（きんこ）をちょいと押さえ、鉄棒を持ち直して言った。
    悟空「この俺だ。」
    九頭駙馬「住まいはどこだ。どこで生まれた。どうして祭賽国へ来て、あの国王のために塔を守っている。よくも俺の配下の頭目を捕まえたうえに乱暴を働き、この山まで戦いを求めに来られたものだな。」
    悟空は罵った。
    悟空「盗っ人妖怪め、どうやら孫さまをご存じないらしいな。近くへ来て、よく聞け。
  "translation_status": "reviewed"
- "id": "xy-ch63-008"

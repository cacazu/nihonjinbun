  "source_text": |-
    老孫祖住花果山，大海之間水簾洞。
    自幼修成不壞身，玉皇封我齊天聖。
    只因大鬧鬥牛宮，天上諸神難取勝。
    當請如來展妙高，無邊智慧非凡用。
    為翻觔斗賭神通，手化為山壓我重。
    整到如今五百年，觀音勸解方逃命。
    大唐三藏上西天，遠拜靈山求佛頌。
    解脫吾身保護他，煉魔淨怪從修行。
    路逢西域祭賽城。屈害僧人三代命。
    我等慈悲問舊情，乃因塔上無光映。
    吾師掃塔探分明，夜至三更天籟靜。
    捉住妖精取實供，他言汝等偷寶貝。
    合盤為盜有龍王，公主連名稱萬聖。
    血雨澆淋塔上光，將他寶貝偷來用。
    殿前供狀更無虛，我奉君言馳此境。
    所以相尋索戰爭，不須再問孫爺姓。
    快將寶貝獻還他，免汝老少全家命。
    敢若無知騁勝強，教你水涸山頹都蹭蹬。」
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 126
    "line_end": 143
  "translation_ja": |-
    俺の故郷は花果山（かかざん）、大海原にある水簾洞（すいれんどう）。
    幼いころから修行を積んで壊れぬ身となり、玉帝（ぎょくてい）から斉天大聖に封じられた。
    天上の斗牛（とぎゅう）の宮で大暴れすれば、天の神々にも勝つすべがなく、
    如来（にょらい）を招いて妙なる高き力を示してもらった。その果てしない智慧の働きは尋常でなかった。
    宙返りで神通力（じんつうりき）を競ったために、如来の手は山となり、俺を重く押しつぶした。
    それから今まで五百年、観音（かんのん）の取りなしでようやく命拾いをした。
    大唐（だいとう）の三蔵は西天（さいてん）へ、遠く霊山（れいざん）を拝して仏の教えをうたう詩を求めてゆく。
    俺を解き放ってくれたので、俺は護衛となり、魔を懲らしめ妖を清めて修行する。
    道中、西域（さいいき）の祭賽城（さいさいじょう）へ来てみれば、僧たち三代の命が無実の罪で損なわれていた。
    慈悲の心で事情を尋ねると、塔の上から光が消えたのがもとだった。
    わが師は塔を掃いて確かめた。夜は三更（さんこう）、天地の響きも静まり返るころ、
    妖怪どもを捕まえて白状させると、お前たちが宝を盗んだと言う。
    共に盗みに加わった竜王、そして公主（こうしゅ）も、名を万聖（ばんせい）という。
    血の雨を光り輝く塔に降らせ、そこの宝を盗み去って使っていた。
    宮殿での供述にも嘘はなく、俺は王の言葉を受けて、この地へ駆けつけた。
    だからお前を捜して戦いを挑むのだ。孫さまの姓をこれ以上聞くには及ばぬ。
    さあ、宝をあの国へ返せ。一家の老いも若きも命を助けてやろう。
    無知にも強さを誇って歯向かうなら、水を干し、山を崩して、皆を破滅させてやる。」
  "translation_status": "reviewed"
- "id": "xy-ch63-009"
  "section_id": "chapter-63"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那駙馬聞言，微微冷笑道：「你原來是取經的和尚，沒要緊羅織管事。我偷他的寶貝，你取佛的經文，與你何干，卻來廝鬥？」行者道：「這賊怪甚不達理。我雖不受國王的恩惠，不食他的水米，不該與他出力；但是你偷他的寶貝，污他的寶塔，屢年屈苦金光寺僧人，他是我一門同氣，我怎麼不與他出力，辨明冤枉？」駙馬道：「你既如此，想是要行賭鬥。常言道：『武不善作。』但只怕起手處，不得留情，一時間傷了你的性命，誤了你去取經。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch63-1808654"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第063回&oldid=1808654"
    "line_start": 144
    "line_end": 144
  "translation_ja": |-
    九頭駙馬はこれを聞いて、かすかに冷笑した。
    九頭駙馬「なんだ、お前は経を取りに行く和尚か。関係もないのに罪をあげつらい、余計なお節介をする。俺はあいつの宝を盗み、お前は仏の経を取る。それで何がお前に関係するんだ。どうして戦いを仕掛けてくる。」
    悟空「なんて道理の分からぬ盗っ人妖怪だ。確かに俺は国王に恩を受けたわけでもなければ、国王の水や米を口にしたわけでもない。国王のために力を尽くすいわれはなかろう。だがお前が宝を盗み、宝塔を汚したせいで、金光寺の僧たちは何年もの間、無実の罪で苦しめられた。あの人たちは俺と同じ仏門の仲間だ。どうして力を貸さずにいられよう。冤罪を晴らしてやらずにいられよう。」
    九頭駙馬「そういうことなら、どうしても勝負をしたいらしいな。昔から『武力を使えば、穏やかには済まぬ』と言う。ただ、いざ手を出したら手加減はできない。うっかりお前の命を奪い、取経に行けなくしてしまうのが心配だな。」
  "translation_status": "reviewed"

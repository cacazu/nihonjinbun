  "source_text": "那兩個小妖得了命，負痛逃生，拖著鎖索，淬入水內。諕得那些黿鼉龜鱉，蝦蟹魚精，都來圍住問道：「你兩個為何拖繩帶索？」一個掩著耳，搖頭擺尾；一個侮著嘴，跌腳搥胸。都嚷嚷鬧鬧，徑上龍王宮殿：「報大王，禍事了。」那萬聖龍王正與九頭駙馬飲酒，忽見他兩個來，即停杯問何禍事。那兩個即告道：「昨夜巡探，被唐僧、孫行者掃塔捉獲，用鐵索拴鎖。今早見國王，又被那行者與豬八戒抓著我兩個，一個割了耳朵，一個割了嘴唇，拋在水中，著我來報，要索那塔頂寶貝。」遂將前後事細說了一遍。那老龍聽說是孫行者齊天大聖，諕得魂不附體，魄散九霄，戰兢兢對駙馬道：「賢婿啊，別個來還好計較，若果是他，卻不善也。」駙馬笑道：「太岳放心。愚婿自幼學了些武藝，四海之內，也曾會過幾個豪傑，怕他做甚？等我出去與他交戰三合，管取那廝縮首歸降，不敢仰視。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

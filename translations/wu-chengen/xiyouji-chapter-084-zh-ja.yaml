    "translation_ja": |-
      その者が下りると、今度は下女が澄んだ茶を四碗運んできた。悟空が受け取ると、階下からさらに一人の婦人が上がってきた。年は五十七、八ほどに見え、そのままそばへ来て立ち、尋ねた。
      女主人「皆さま、どちらからお越しですか。どんなご商売の品をお持ちでしょう。」
      悟空「北の方から来た者です。つまらない馬を何頭か売りに参りました。」
      女主人「馬の商人を、つまらないとは申せませんわ。」
      悟空「こちらは唐大官、こちらは朱三官、こちらは沙四官。私は孫二官と申します。」
      女主人は笑った。
      女主人「みなさん、お姓が違いますね。」
      悟空「ええ、姓は違っても、一緒に暮らしています。全部で十人兄弟なのですが、私たち四人が先に来て、部屋と食事の用意をお願いに参りました。あと六人は馬の群れを連れて町の外に泊まっています。遅くなったので、入ってきにくかったものですから。私たちが部屋を借りれば、明日の朝にはみんな来ます。馬を売り終えたら帰るつもりです。」
      女主人「一群れというと、馬は何頭ほどですか。」
      悟空「大小合わせて百十頭ほどです。体つきはみな、今連れてきた馬と同じですが、毛色だけはそれぞれ違います。」
      女主人は笑った。
      女主人「孫二官さまは、本当に旅商いの作法を心得たお方ですね。うちへお越しになって幸いでした。よその家では、とてもお引き受けできません。うちは庭が広く、飼葉桶やつなぎ場もそろい、草も飼料もございます。何百頭の馬でも養えます。ただ一つ、うちは長年ここで宿屋をしておりますので、少しは名も知られております。亡き夫の姓は趙（ちょう）でした。不幸にも、亡くなって久しくなります。この宿は『趙寡婦の店（ちょうかふのみせ）』と呼ばれています。うちにはお客様のもてなし方が三通りございます。後になって揉めるより、初めに細かいことを申し上げ、宿代を決めておけば、お勘定もしやすいでしょう。」
      悟空「ごもっともです。それで、その三通りのもてなしとは、どんなものですか。よく『品物には上、中、下の値があっても、客は遠くからでも近くからでも、同じように迎える』と言いますが、どうして三通りなのです。ひとつ聞かせてください。」
      趙寡婦（ちょうかふ）「うちには上、中、下がございます。上等なら、果物五品、料理五品の宴席に、獅子や仙人の飴細工と飾り菓子を並べ、二人で一卓。若い女も呼んで、歌のお相手も、寝床のお相手もさせます。お一人につき銀五銭（せん）、宿代も込みでございます。」
      悟空は笑った。
      悟空「安いですね。私たちの土地では、銀五銭では女を呼ぶだけの代にも足りません。」
      趙寡婦「中等でしたら、大皿に盛ったものを卓へお出しします。ただし、果物と燗酒だけです。お酌をいたしますから、皆さまで数当てや酒の遊びをなさいませ。女は呼びません。お一人につき銀二銭だけです。」
      悟空「それならますますお得だ。下等はどうです。」
      趙寡婦「立派なお客様の前では、とても申し上げられません。」
      悟空「かまいません、話してください。私たちも、手頃なものを選べますから。」
      趙寡婦「下等には、お世話する者はつきません。鍋に飯がありますから、お好きなだけ食べていただきます。腹がふくれたら、藁を取って床に敷き、空いている所で寝るのです。朝になったら、飯代として銭をいくらかいただければ、決して文句は申しません。」
      これを聞いて八戒が言った。
      八戒「ありがたい、ありがたい！　この朱（しゅ）さん向きの話が来たぞ。鍋の飯を腹いっぱい食って、かまどの口の前で、くそ、ぐっすり寝てやる！」
      悟空「弟よ、何を言うんだ。俺たちが旅をしていれば、どこへ行っても銀の数両（りょう）くらいは稼げる。上等の用意を頼みます。」

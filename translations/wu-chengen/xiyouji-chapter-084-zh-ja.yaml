    "translation_ja": |-
      趙寡婦は階下へ行き、帳場の柵にもたれてため息をついた。娘が一人いて、子供を抱いて近づいてきた。
      娘「お母さん、『十日も瀬のほとりで待ったあと、一日で九つの瀬を下る』って言うでしょう。今は暑くて商売があまりなくても、秋になれば、手が回らないくらいお客が来るのよ。どうしてため息をつくの。」
      趙寡婦「商売がないのを心配しているんじゃないよ。今夜はもう店を閉めようとして、夜に入ったところへ、馬商人が四人、部屋を借りに来た。上等のもてなしを頼むと言うので、銀をいくらか儲けられると当てにしたのに、精進しかしないと言うし、お金も儲けられそうにないから、ため息が出るのさ。」
      娘「もうご飯は食べてしまったんだから、よそへは行きにくいでしょう。明日なら肉料理も酒も用意できるのに、どうして儲けられないの。」
      趙寡婦「あの人たちはみんな病気で、風を怖がったり、明るさを嫌がったりして、暗い所で寝たいと言うんだ。うちの部屋はみんな薄い一重の瓦屋根だろう。どこに真っ暗な所があるものか。一食ご馳走したと思って、ほかの宿へ行ってもらうほうがましだよ。」
      娘「お母さん、うちには暗くて風も入らない、とてもいい場所があるじゃない。」
      趙寡婦「どこだい。」
      娘「お父さんが生きていたころに作った、大きな長持があるでしょう。幅四尺（しゃく）、長さ七尺、高さ三尺くらいで、中には六、七人も寝られるよ。あの中で寝てもらえばいいのよ。」
      趙寡婦「それでいいかしら。ひとつ聞いてみよう。」
      趙寡婦は客に声をかけた。
      趙寡婦「孫さま、狭い家で、ほかに暗い所がございません。ただ、大きな長持が一つありまして、風も光も通りません。その中でお休みになってはいかがでしょう。」
      悟空「いい、いい、それでいい。」
      そこで小作人たち何人かに長持を運び出させ、蓋を開けて、四人に階下へ来てもらった。
    "translation_status": "draft"
  - "id": "xy-ch84-024"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者引著師父，沙僧拿擔，順燈影後徑到櫃邊。八戒不管好歹，就先\U00027FFC進櫃去。沙僧把行李遞入，攙著唐僧進去，沙僧也到裡邊。行者道：「我的馬在那裡？」旁有伏侍的道：「馬在後屋拴著吃草料哩。」行者道：「牽來，把糟擡來，緊挨著櫃兒拴住。」方才進去，叫：「趙媽媽，蓋上蓋兒，插上鎖釘，鎖上鎖子；還替我們看看，那裡透亮，使些紙兒糊糊。明日早些兒來開。」寡婦道：「忒小心了。」遂此各各關門去睡不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      悟空は三蔵を導き、沙悟浄は荷物を持ち、灯の陰をたどって長持のそばへ行った。八戒はよいか悪いかも考えず、真っ先に中へ飛び込んだ。沙悟浄は荷物を中へ渡し、三蔵を支えて入れ、自分も中へ入った。
      悟空「俺の馬はどこにいる。」
      そばの使用人が答えた。
      使用人「裏の小屋につないで、飼葉を食べさせております。」
      悟空「連れてきてくれ。飼葉桶も運んで、長持のすぐそばにつないでもらおう。」
      それからようやく自分も中へ入り、呼びかけた。
      悟空「趙の女将さん、蓋を閉めて、留め金を通し、錠をかけてくれ。それから、光が漏れる所がないか見て、紙を貼ってふさいでくれないか。明日は早めに開けに来てくれよ。」
      趙寡婦「なんとも用心深いことですね。」
      こうして皆それぞれ戸を閉め、眠りについた。こちらの話はひとまず置こう。
    "translation_status": "draft"
  - "id": "xy-ch84-025"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說他四個到了櫃裡，可憐啊！一則乍戴個頭巾，二來天氣炎熱，又悶住了氣，略不透風。他都摘了頭巾，脫了衣服，又沒把扇子，只將僧帽撲撲搧搧。你挨著我，我挨著你，直到有二更時分，卻都睡著。惟行者有心闖禍，偏他睡不著，伸過手，將八戒腿上一捻。那獃子縮了腳，口裡哼哼的道：「睡了罷，辛辛苦苦的，有甚麼心腸還捻手捻腳的耍子？」行者搗鬼道：「我們原來的本身是五千兩，前者馬賣了三千兩，如今兩搭聯裡現有四千兩，這一群馬還賣他三千兩，也有一本一利。夠了，夠了。」八戒要睡的人，那裡答對。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      さて、長持の中へ入った四人は、気の毒なものだった。一つにはかぶり慣れない頭巾をかぶり、二つには暑い天気のうえに空気もこもり、風が少しも入らない。みな頭巾を取り、着物を脱いだが、扇もないので、僧帽をばたばた振ってあおいだ。互いの体がぴったり触れ合ったまま、二更（にこう）ごろになって、ようやく眠りについた。ただ悟空だけは、わざと騒ぎを起こす気で、どうしても眠らなかった。手を伸ばし、八戒の脚をつねった。八戒は脚を引っ込め、口の中でぶつぶつ言った。
      八戒「もう寝ようぜ。くたくたなのに、手や脚をつねって遊ぶ気によくなれるな。」
      悟空は悪だくみを始めた。
      悟空「俺たちの元手は五千両だった。前の馬の売り上げが三千両で、今、二つの振り分け袋には四千両が入っている。この群れをさらに三千両で売れば、元手と同じだけの儲けになる。十分だ、十分だ。」
      八戒は眠りたいばかりで、相手などしなかった。
    "translation_status": "draft"
  - "id": "xy-ch84-026"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "豈知他這店裡走堂的、挑水的、燒火的素與強盜一夥，聽見行者說有許多銀子，他就著幾個溜出去，夥了二十多個賊，明火執杖的來打劫馬販子，沖開門進來。諕得那趙寡婦娘女們戰戰兢兢的關了房門，盡他外邊收拾。原來那賊不要店中家火，只尋客人。到樓上不見形跡，打著火把，四下照看，只見天井中一張大櫃，櫃腳上拴著一匹白馬，櫃蓋緊鎖，掀翻不動。眾賊道：「走江湖的人都有手眼。看這櫃勢重，必是行囊財帛鎖在裡面。我們偷了馬，擡櫃出城，打開分用，卻不是好？」那些賊果找起繩扛，把櫃擡著就走，幌啊幌的。八戒醒了道：「哥哥，睡罷，搖甚麼？」行者道：「莫言語，沒人搖。」三藏與沙僧忽地也醒了，道：「是甚人擡著我們哩？」行者道：「莫嚷，莫嚷。等他擡，擡到西天，也省得走路。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      ところが、この宿の給仕、水汲み、火焚きは、もともと盗賊の仲間だった。悟空が大金を持っていると言うのを聞くと、何人かを抜け出させ、二十人余りの賊と連れ立って、松明を掲げ、武器を持ち、馬商人を襲いに来た。戸を押し開いて、なだれ込んだので、趙寡婦と娘は震え上がり、部屋の戸を閉め、外で好きにされるままにしていた。賊の狙いは宿の家財ではなく、客だった。二階へ行っても姿がないので、松明であちこち照らして探す。すると中庭に大きな長持が一つあり、その脚に白馬が一頭つながれていた。蓋にはしっかり錠が掛かり、持ち上げてひっくり返すこともできなかった。
      賊たち「旅をするやつらは、みな抜け目がない。この長持の重さからすると、荷物や金品を中へしまってあるに違いない。馬を盗み、長持を城の外へ担ぎ出して、開けて分ければいいじゃないか。」
      賊たちはさっそく縄と担ぎ棒を探してきて、長持を担ぎ、ゆさゆさと揺らしながら運び出した。八戒は目を覚ました。
      八戒「兄貴、寝ようぜ。何を揺すってるんだ。」
      悟空「黙っていろ。誰も揺すってはいない。」
      三蔵と沙悟浄も、はっと目を覚ました。
      三蔵と沙悟浄「誰が私たちを担いでいるのだろう。」
      悟空「騒ぐな、騒ぐな。担がせておけ。西天まで運んでもらえば、歩かずに済むさ。」
    "translation_status": "draft"
  - "id": "xy-ch84-027"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那賊得了手，不往西去，倒擡向城東，殺了守門的軍，打開城門出去。當時就驚動六街三市各鋪上火甲人夫，都報與巡城總兵、東城兵馬司。那總兵、兵馬事當干己，即點人馬弓兵，出城趕賊。那賊見官軍勢大，不敢抵敵，放下大櫃，丟了白馬，各自落草逃走。眾官軍不曾拿得半個強盜，只是奪下櫃，捉住馬，得勝而回。總兵在燈光下見那馬，好馬："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 162
        "line_end": 162
    "translation_ja": "賊たちは首尾よく盗み出したが、西へは行かず、反対に町の東へ担いでいった。門を守る兵を殺し、城門を開けて外へ出た。たちまち町じゅうの詰所の火の番や人夫が騒ぎに気づき、町を巡回する総兵（そうへい）と、東城の兵馬司（へいばし）に知らせた。総兵も兵馬司の役人も、自分の職掌にかかわる事件なので、ただちに兵馬と弓兵を集め、城外へ出て賊を追った。賊たちは官軍の勢いが強いのを見ると、抵抗しようともせず、大きな長持を置き、白馬を捨て、それぞれ草むらへ逃げ込んだ。官軍は盗賊を一人も捕まえられず、ただ長持を奪い返し、馬をつかまえて、勝ち誇って帰った。総兵は灯の光でその馬を見た。なんというよい馬だろう。"
    "translation_status": "draft"
  - "id": "xy-ch84-028"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": "鬃分銀線，尾\U00022DD1玉條。說甚麼八駿龍駒，賽過了驌驦款段。千金市骨，萬里追風。登山每與青雲合，嘯月渾如白雪勻。真是蛟龍離海島，人間喜有玉麒麟。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      たてがみは銀の糸を分けたよう、
      尾を振れば玉の枝を払うよう。
      八駿（はっしゅん）や竜のような駿馬を、何ほどのものと言おう。
      驌驦（しゅくそう）も款段（かんだん）も、この馬には及ばない。
      千金を投じてでも、その骨を買いたいほどの駿足、
      万里の道を風に追いつく速さで駆ける。
      山に登れば、いつも青雲と一つになり、
      月にいななけば、全身は白雪そのもの。
      まことに海の島を離れた蛟竜（こうりゅう）、
      人の世に現れた、めでたい玉の麒麟（きりん）だ。
    "translation_status": "draft"
  - "id": "xy-ch84-029"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "總兵官把自家馬兒不騎，就騎上這個白馬，帥軍兵進城，把櫃子擡在總府，同兵馬寫個封皮封了，令人巡守到天明啟奏，請旨定奪。官軍散訖不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 165
        "line_end": 165
    "translation_ja": "総兵は自分の馬には乗らず、この白馬に乗って兵を率い、町へ戻った。長持を総兵の役所へ担ぎ込ませ、兵馬司の役人と一緒に封紙を書いて封をし、兵に見張りを命じた。夜が明けたら奏上し、王の命令を仰いで処置するつもりだった。官軍は解散した。こちらの話はひとまず置こう。"
    "translation_status": "draft"
  - "id": "xy-ch84-030"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說唐長老在櫃裡埋怨行者道：「你這個猴頭，害殺我也。若在外邊，被人拿住，送與滅法國王，還好折辨；如今鎖在櫃裡，被賊劫去，又被官軍奪來，明日見了國王，現現成成的開刀請殺，卻不湊了他一萬之數？」行者道：「外面有人打開櫃，拿出來，不是綑著，便是吊著。且忍耐些兒，免了綑吊。明日見那昏君，老孫自有登答，管你一毫兒也不傷。且放心睡睡。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 167
        "line_end": 167
    "translation_ja": |-
      一方、長持の中で、三蔵は悟空を責めた。
      三蔵「この猿め、お前のせいで命がないではないか。外で捕まり、滅法国の国王のもとへ送られたのなら、まだ言い開きもできる。ところが今は長持へ閉じ込められ、賊にさらわれ、さらに官軍に奪われたのだ。明日、国王の前へ出たら、いかにも『刀を抜いてお殺しください』と差し出されるようなものだ。これであの王の一万人が、そろってしまうではないか。」
      悟空「外の者が長持を開けて、俺たちを引っ張り出したら、縛られるか吊るされるかです。少し我慢していれば、その縛り上げや吊り責めを免れます。明日あの愚かな王に会ったら、俺に受け答えの用意があります。お師匠さまには毛ほどの傷も負わせませんから、安心して少しお眠りください。」
    "translation_status": "draft"
  - "id": "xy-ch84-031"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "挨到三更時分，行者弄個手段，順出棒來，吹口仙氣，叫：「變！」即變做三尖頭的鑽兒，挨櫃腳兩三鑽，鑽了一個眼子。收了鑽，搖身一變，變做個螻蟻兒，\U00027FFC將出去。現原身，踏起雲頭，徑入皇宮門外。那國王正在睡濃之際。他使個「大分身普會神法」，將左臂上毫毛都拔下來，吹口仙氣，叫：「變！」都變做小行者。右臂上毛也都拔下來，吹口仙氣，叫：「變！」都變做瞌睡蟲。念一聲「唵」字真言，教當方土地領眾佈散皇宮內院、五府六部、各衙門大小官員宅內，但有品職者，都與他一個瞌睡蟲，人人穩睡，不許翻身。又將金箍棒取在手中，掂一掂，幌一幌，叫聲：「寶貝，變！」即變做千百口剃頭刀兒。他拿一把，吩咐小行者各拿一把，都去皇宮內院、五府六部、各衙門裡剃頭。咦！這才是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      三更になるのを待つと、悟空は術を使い、棒を取り出して仙気（せんき）を吹きかけた。
      悟空「変われ！」
      棒はすぐに、三つの尖りのある錐になった。長持の脚のそばを二、三度もむと、穴が一つ開いた。錐をしまい、体を揺すって小さな蟻に変わり、外へ跳び出した。元の姿を現し、雲に乗って、まっすぐ皇宮の門の外へ行った。国王はちょうどぐっすり眠っていた。
      悟空は「大分身普会神法（だいぶんしんふえしんぽう）」を使い、左腕の毛をすべて抜いて、仙気を吹きかけた。
      悟空「変われ！」
      毛はみな小さな悟空になった。右腕の毛もすべて抜き、仙気を吹きかけた。
      悟空「変われ！」
      こちらはみな瞌睡虫（かっすいちゅう）になった。「唵（おん）」の一字の真言を唱えると、その土地の土地神（とちがみ）に命じて、それらを率いて皇宮の奥、五府（ごふ）六部（りくぶ）、各役所の大小の官人の邸宅へ配らせた。位や役職を持つ者には一人につき一匹ずつ瞌睡虫をつけ、誰もがぐっすり眠り、寝返りも打てないようにした。
      さらに金箍棒（きんこぼう）を手に取り、重みを測るように揺すり、ひと振りして叫んだ。
      悟空「宝よ、変われ！」
      すると棒は、千も百もの頭剃り用の剃刀に変わった。悟空は一本を手に取り、小さな悟空たちにも一本ずつ持たせ、皇宮の奥や五府六部、各役所へ行って、頭を剃るように言いつけた。いや、これこそまさに、
    "translation_status": "draft"
  - "id": "xy-ch84-032"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      法王滅法法無窮，法貫乾坤大道通。
      萬法原因歸一體，三乘妙相本來同。
      鑽開玉櫃明消息，佈散金毫破蔽蒙。
      管取法王成正果，不生不滅去來空。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 170
        "line_end": 173
    "translation_ja": |-
      法王（ほうおう）が仏法を滅ぼしても、法は尽きることなく、
      法は天地を貫き、大いなる道へ通じている。
      万法の根源は一つの本体へ帰り、
      三乗（さんじょう）の妙なる姿も、もとは同じもの。
      玉の長持に穴を開け、奥の消息を明らかにし、
      金の毛をあたりへ放ち、覆い隠す迷いを打ち破る。
      きっと法王を正しい悟りの果へ導くだろう。
      生じることも滅びることもなく、去るも来るも、みな空なのだ。
    "translation_status": "draft"
  - "id": "xy-ch84-033"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這半夜剃削成功。念動咒語，喝退土地神祗。將身一抖，兩臂上毫毛歸伏。將剃頭刀總捻成真，依然認了本性，還是一條金箍棒，收來些小之形，藏於耳內。復翻身還做螻蟻，鑽入櫃內，現了本相，與唐僧守困不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 175
        "line_end": 175
    "translation_ja": "こうして夜半の頭剃りは成功した。悟空は呪文を唱え、土地神たちに退くよう命じた。体を一振りすると、両腕の毛は元の所へ戻った。剃刀をみな一つに寄せて本来の姿へ返すと、やはり一本の金箍棒になった。小さく縮め、耳の中へしまった。また身を返して蟻になり、長持の穴をくぐって中へ入った。元の姿を現すと、三蔵とともに、眠気を抱えてそこで時を過ごした。この話はいったん置こう。"
    "translation_status": "draft"
  - "id": "xy-ch84-034"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那皇宮內院，宮娥綵女天不亮起來梳洗，一個個都沒了頭髮；穿宮的大小太監也都沒了頭髮。一擁齊來，到於寢宮外，奏樂驚寢，個個噙淚，不敢傳言。少時，那三宮皇后醒來，也沒了頭髮。忙移燈到龍床下看處，錦被窩中，睡著一個和尚，皇后忍不住言語出來，驚醒國王。那國王急睜睛，見皇后的頭光，他連忙爬起來道：「梓童，你如何這等？」皇后道：「主公亦如此也。」那皇帝摸摸頭，諕得三尸呻咋，七魄飛空，道：「朕當怎的來耶？」正慌忙處，只見那六院嬪妃、宮娥綵女、大小太監，皆光著頭跪下道：「主公，我們做了和尚耶。」國王見了，眼中流淚道：「想是寡人殺害和尚……」即傳旨吩咐：「汝等不得說出落髮之事，恐文武群臣褒貶國家不正。且都上殿設朝。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      さて皇宮の奥では、宮女や侍女たちが夜明け前に起き、髪を結って身支度をしようとすると、一人残らず髪がなくなっていた。宮中を行き来する大小の宦官たちも、みな髪がなかった。皆はどっと寝殿の外へ押しかけ、目覚めを知らせる音楽を奏でたが、涙を浮かべるばかりで、何も言い出せなかった。
      しばらくして三宮の皇后たちが目を覚ますと、やはり髪がなかった。急いで灯を王の寝台のそばへ寄せて見ると、錦の布団の中には、一人の和尚が寝ている。皇后は思わず声を出し、国王を起こしてしまった。国王はぱっと目を開け、皇后の頭がつるつるなのを見ると、慌てて起き上がった。
      国王「后よ、どうしてそんな姿になったのだ。」
      皇后「陛下も同じお姿でございます。」
      国王は自分の頭をなで、恐ろしさに三尸（さんし）がうめき、七魄（しちはく）も空へ飛び散る思いになった。
      国王「私はどうなってしまったのだ。」
      うろたえているところへ、六院の妃、宮女や侍女、大小の宦官が、みな禿げ頭でひざまずいた。
      後宮の一同「陛下、私どもも和尚になってしまいました。」
      国王はそれを見て、涙を浮かべた。
      国王「思うに、私が和尚を殺したから……。」
      すぐに命令を出した。
      国王「そなたたち、髪を落とされたことは、誰にも口外してはならぬ。文武の臣たちに、国の治め方が正しくないと非難されては困る。さあ、みな殿へ上がり、朝議の用意をせよ。」
    "translation_status": "draft"
  - "id": "xy-ch84-035"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那五府六部，合衙門大小官員，天不明都要去朝王拜闕。原來這半夜一個個也沒了頭髮。各人都寫表啟奏此事。只聽那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 178
        "line_end": 178
    "translation_ja": "一方、五府六部をはじめ、すべての役所の大小の官人たちは、夜明け前から国王に拝謁し、宮門で拝礼することになっていた。ところが、この夜半のうちに、一人残らず髪がなくなっていたのだ。それぞれに、この出来事を奏上する上表を書いた。かくして、"
    "translation_status": "draft"
  - "id": "xy-ch84-036"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": "靜鞭三響朝皇帝，表奏當今剃髮因。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 180
        "line_end": 180
    "translation_ja": |-
      静粛を命じる鞭が三度鳴り、皇帝の朝廷へ列をなし、
      上表を捧げて、今上の御前に頭を剃られた事情を訴える。
    "translation_status": "draft"
  - "id": "xy-ch84-037"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知那總兵官奪下櫃裡賊贓如何，與唐僧四眾的性命如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 182
        "line_end": 182
    "translation_ja": "結局、総兵が取り戻した長持の中の盗品はどう扱われるのか。また、三蔵たち四人の命はどうなるのか。それは次回のお話で。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-01-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "回題の「伽持」は加持の異表記と解した。「難滅伽持」の句の切り方には幅があるため、難を滅ぼす仏力の加護という趣旨で訳す。「法王」「正」「天然」は仏教・修行の語を重ねる表現で、回題だけから特定人物の改心や救出の完了は補わない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-02-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「送命王菩薩」。特定の尊格の正式名と断定せず、命を送り届けてしまう者という、老婆の警告をこめた戯称として訳した。冒頭の「老菩薩」も老女への敬称であり、この呼びかけ自体が身元を明かすわけではない。「羅天大願」は、天にかけた大きな誓いという文脈に限定し、特定の道教儀礼の実施を補っていない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-03-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この直前で、老婆と子供が観音菩薩と善財童子だと初めて明示される。それまでは見かけの呼称を用いた。善財童子はすでにその法名を授けられている紅孩児と同じ人物。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-04-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原詩は「一般同父母」と、父母を持つ同じ身であることを並べて、悟空だけが空へ跳べる不思議さを戯画化する。石から生まれたという既知の来歴との整合のために、原詩を補訂していない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-05-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の数は十、九、七、八、六、五、四、三、二、一の順。七と八を入れ替えて整えず、そのまま保った。「五鼓楼」は時刻を告げる楼と解し、夕方の場面を五更の出来事へ移していない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-06-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「腐草」は腐草が蛍に化すという古い観念を思わせる。原詩は蛾の姿を詠みながら蛍のイメージも交えるので、種類を訂正せず保った。「翼磽」の磽は通常は硬い石地などを表す字で、ここでは薄く軽い羽の形容と読んだが、字義の接続には留保する。現代の昆虫学の説明ではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-07-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "提灯の「安歇往來商賈」は六字、「王小二店」は四字という原文の数を保った。前者は旅の商人へ宿泊を勧める看板文句。王小二店は店名であり、同じ小二を名に含む別の宿主と同一視しない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-08-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「丁」は、ここでは虫が物にとまる動作として読んだ。「吊搭」は店の入口に下ろす吊り板の類と解したが、具体的な建具の構造は確定しない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-09-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「明人不做暗事」という正々堂々を説く言葉を、衣類を持ち出す悟空自身が言っている。これを語り手による借用の許可や、持ち主の承諾の確認には読み替えていない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-10-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「沒收頂繩處」。頭巾を髷などの髪に留める前提で、剃髪した頭には紐を留める所がないという八戒の理屈と解した。具体的な頭巾の仕立ては未確定。「勒掯」は相手を困らせたり無理を強いたりする意味で訳した。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-11-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "唐大官・朱三官・沙四官・孫二官は、悟空がこの場で決める商人姿の仮名。「朱」は八戒の姓「豬」を書き換えたものとして保ち、通常の話者ラベルは三蔵・八戒・沙悟浄・悟空のままとした。「師父」「徒弟」の四文字という数も、中国語表記のまま保持した。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-12-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「販馬的客人尚還小」。文末に疑問標識はないが、悟空の「粗馬」という謙遜への返事として、馬商いを小さな商売とはいえないという含みで読んだ。構文には留保があり、馬を売る客の年齢を述べたとは解していない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-13-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「客綱客紀」は旅慣れた者の経験・心得をいう語として読んだ。教育部『重編国語辞典修訂本』の同語の説明を表示本文で照合。制度としての交易仲介者「客綱」「客紀」に、この登場人物を任命した意味には取らない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-14-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の「獅仙斗糖桌面」は獅子・仙人をかたどる糖菓や飾り菓子を並べた卓上の盛り物と解した。斗糖の細かな製法は確定しない。「小娘兒」の「陪唱陪歇」は歌の相手だけでなく同衾の相手もする意味を保ち、単なる給仕には弱めていない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-15-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は「煮醃下飯」で、塩漬けの食物を煮ておかずにする、と読んだ。醃の具体的な材料や料理名は確定しない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-16-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「長齋」は常時、「月齋」は月単位で行う斎戒と解し、特定の期間や日数は補っていない。悟空の説明では庚申の次は辛酉で、三更を過ぎれば精進を解く。これは客としての悟空の説明であり、三蔵が翌日から肉を食べると承諾したわけではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-17-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「閩筍」は閩、すなわち福建の筍、「麵筋」は小麦のたんぱく質から作る麩の類、「粉湯」は春雨などを入れた汁、「發麵蒸捲子」は発酵させた小麦の生地を巻いて蒸すものと解した。具材や形の細部は本文にないので補わない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-18-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "悟空が挙げる「寒濕氣」「漏肩風」「羞明」は、冷えと湿気による不調、肩の痛む病、光をまぶしく感じる状態として訳す。人物が寝場所を変えるために述べる理由であり、三人の実際の病歴や現代医学上の診断を確定したものではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-19-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「單浪瓦兒の房子」は屋根に波形の瓦を一重に葺いた、光の入りやすい建物。教育部の公開辞書の表示本文と照合した。現代の波板建材と同一とはしない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-20-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「把糟擡來」と糟の字。馬を食べさせる場面なので、飼葉桶を表す槽の意味と読んだが、原文は書き換えていない。この段落の珍字「\U00027FFC」は跳び入る動作として訳した。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-21-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は元手五千両、前の売上三千両、現在の手持ち四千両、さらに三千両で売れば「一本一利」、すなわち元手と同額の利という。単純な足し算だけでは一致しないが、悟空の発言の数字と結論をそのまま保持し、収支や使途を補って帳尻を合わせていない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-22-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「半個」さえ捕らえないとは一人も捕らえないという強調。守門の兵を殺したのは賊であり、官軍が賊を殺したとの描写はない。総兵と東城兵馬司はこの国で追跡を担当する役目で、同名の役職を持つ他国の個人とは同定しない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-23-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "驌驦は古くから名馬をいう語で、既存の語彙を再用するが、御馬監にいた特定の馬がここに現れたとの同定はしない。款段は辞書では歩みの遅い馬・駑馬の意味があり、名馬と並ぶ不揃いな表現を勝手に別の名馬へ改めなかった。尾を振る原字「\U00022DD1」は動作の文脈から解した。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-24-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「千金市骨」は、死んだ駿馬の骨を高値で買うことで生きた良馬が集まるという故事を踏まえた賛辞として読んだ。この白馬を実際に殺す・骨を売買するという意味ではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-25-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「五府六部」は明代の軍政・行政組織を連想させる総称で、五府は五軍都督府、六部は中央の行政六部に結びつく。ただし、ここでの架空の国を明代の特定の都へ同定しない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-26-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "法・法王・万法を重ねた寓意詩。「法王」は仏法の王という語であり、仏法を滅ぼす世俗の王とも重ねられるが、如来本人の登場とはしない。玉の長持と金の毛は直前の出来事を詩的に言い直す。「正果」を得るという語り手の予告は保持するが、本文でまだ描かれない改心や救出の完了を補わない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-27-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「守困」は眠気を抱えて時を過ごすことと読んだが、寝ずに待つのか、眠りながら待つのかまでは確定しない。三蔵の新たな発言や悟空の帰還に気づいた反応は補っていない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-28-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は初め「三宮皇后」と複数的に記し、続いて「皇后」とする。三宮の誰か、全員なのかを断定せず、その切り替わりを保った。寝台にいる「和尚」は、頭髪を失った国王がそう見えるという描写で、別の僧との入れ替わりではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-29-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三尸は人の体内にいるとされた三種のもの、七魄は身体に宿る七つの魄。強い恐れを誇張する表現で、実際に死亡したという叙述ではない。"
    "translation_status": "draft"
  - "id": "xy-ch84-note-30-body"
    "section_id": "chapter-84"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "「靜鞭」は朝廷で静粛を促すために鳴らす鞭。「當今」は現在の皇帝を指すと読んだ。官人たちの上表の内容そのものは本文に載っていないので、その全文や原因の特定を創作していない。"
    "translation_status": "draft"

  - "id": "xy-ch84-002"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說唐三藏固住元陽，出離了煙花苦套。隨行者投西前進，不覺夏時。正值那薰風初動，梅雨絲絲，好光景："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 122
        "line_end": 122
    "translation_ja": "さて三蔵（さんぞう）は元陽（げんよう）を固く守り、色欲という苦しい罠を抜け出した。悟空（ごくう）について西へ進むうち、いつしか夏となっていた。ちょうど暖かな南風が吹き始め、梅雨が糸のように降るころで、あたりはよい眺めだった。"
    "translation_status": "draft"
  - "id": "xy-ch84-003"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      冉冉綠陰密，風輕燕引雛。
      新荷翻沼面，修竹漸扶蘇。
      芳草連天碧，山花遍地鋪。
      溪邊蒲插劍，榴火壯行圖。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 124
        "line_end": 127
    "translation_ja": |-
      緑の木陰はしだいに深まり、
      風は穏やかで、燕は雛を連れて飛ぶ。
      新しい蓮の葉が池の面でひるがえり、
      背の高い竹はますます葉を茂らせる。
      香る草の緑は空の果てまで続き、
      山の花は大地いっぱいに敷き詰められる。
      渓流のほとりには蒲が剣のような葉を突き立て、
      炎のような石榴の花が、旅路の景色を鮮やかに彩る。
    "translation_status": "draft"
  - "id": "xy-ch84-004"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒四眾，耽炎受熱，正行處，忽見那路傍有兩行高柳，柳陰中走出一個老母，右手下攙著一個小孩兒，對唐僧高叫道：「和尚，不要走了，快早兒撥馬東回，進西去都是死路。」諕得個三藏跳下馬來，打個問訊道：「老菩薩，古人云：『海闊從魚躍，天空任鳥飛。』怎麼西進便沒路了？」那老母用手朝西指道：「那裡去有五六里遠近，乃是滅法國。那國王前生那世裡結下冤仇，今世裡無端造罪。二年前許下一個羅天大願，要殺一萬個和尚。這兩年陸陸續續，殺夠了九千九百九十六個無名和尚，只要等四個有名的和尚，湊成一萬，好做圓滿哩。你們去，若到城中，都是送命王菩薩。」三藏聞言，心中害怕，戰兢兢的道：「老菩薩，深感盛情，感謝不盡。但請問可有不進城的方便路兒？我貧僧轉過去罷。」那老母笑道：「轉不過去，轉不過去。只除是會飛的，就過去了。」八戒在傍邊賣嘴道：「媽媽兒莫說黑話，我們都是會飛的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      師弟四人は暑さに耐え、熱気を浴びながら歩いていた。すると道端に背の高い柳が二列に並び、その木陰から一人の老婆が現れた。右手で幼い子供の手を引き、三蔵に向かって大声で呼びかける。
      老婆「お坊さん、もう行ってはいけないよ。早く馬を返して東へ戻りなさい。西へ進めば、どこも死にに行く道だよ。」
      三蔵は驚いて馬から飛び降り、合掌して礼をした。
      三蔵「お婆さま、昔の人も『広い海では魚が思うままに跳ね、広い空では鳥が思うままに飛ぶ』と言っております。どうして西へ行く道だけが、なくなってしまうのでしょう。」
      老婆は西を指さした。
      老婆「ここから五、六里（り）ほど行ったところは、滅法国（めっぽうこく）という国なんだ。その国王は前の世で恨みを結んだものだから、今の世で、わけもなく罪を作っている。二年前、天にかけて大それた願を立てて、和尚を一万人殺すと言い出した。この二年の間に次々と殺して、名もない和尚が九千九百九十六人になった。あとは名のある和尚四人を待って、一万人にそろえて、願を成就しようというのさ。お前さんたちが町へ行ったら、四人とも命を差し出す菩薩さまになるよ。」
      それを聞くと三蔵は恐ろしくなり、ぶるぶる震えながら尋ねた。
      三蔵「お婆さま、ご親切が身にしみます。いくらお礼を申し上げても足りません。ただ、町へ入らずに行ける道はありませんか。私はそちらへ回りたいのですが。」
      老婆は笑った。
      老婆「回っては行けないよ、行けないよ。飛べる者なら、越えていけるけれどね。」
      そばで八戒（はっかい）が、口達者なところを見せた。
      八戒「お婆さん、わけの分からないことを言わないでくれ。俺たちはみんな飛べるんだぞ。」
    "translation_status": "draft"
  - "id": "xy-ch84-005"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者火眼金睛，其實認得好歹：那老母攙著孩兒，原是觀音菩薩與善財童子。慌得倒身下拜，叫道：「菩薩，弟子失迎，失迎。」那菩薩一朵祥雲，輕輕駕起。嚇得個唐長老立身無地，只情跪著磕頭；八戒、沙僧也慌跪下，朝天禮拜。一時間，祥雲縹緲，徑回南海而去。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      悟空は火眼金睛（かがんきんせい）の力で、相手の正体を確かに見抜いていた。その老婆と子供は、実は観音菩薩（かんのんぼさつ）と善財童子（ぜんざいどうじ）だったのだ。悟空はあわててひれ伏した。
      悟空「菩薩さま、弟子の私がお迎えもせず、とんだ失礼をいたしました。」
      観音菩薩は、めでたい雲を一つ呼んで、ふわりと乗った。三蔵は驚き、身の置きどころもない思いで、ひたすらひざまずいて額を地につけた。八戒と沙悟浄（さごじょう）も急いでひざまずき、空に向かって拝んだ。やがて雲は遠くかすみ、観音菩薩はまっすぐ南海（なんかい）へ帰っていった。
    "translation_status": "draft"
  - "id": "xy-ch84-006"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者起來，扶著師父道：「請起來，菩薩已回寶山也。」三藏起來道：「悟空，你既認得是菩薩，何不早說？」行者笑道：「你還問話不了，我即下拜，怎麼還是不早哩？」八戒、沙僧對行者道：「感蒙菩薩指示，前邊必是滅法國，要殺和尚，我等怎生奈何？」行者道：「獃子休怕。我們曾遭著那毒魔狠怪，虎穴龍潭，更不曾傷損；此間乃是一國凡人，有何懼哉？只奈這裡不是住處，天色將晚，且有鄉村人家，上城買賣回來的，看見我們是和尚，嚷出名去，不當穩便。且引師父找下大路，尋個僻靜之處，卻好商議。」真個三藏依言，一行都閃下路來，到一個坑坎之下坐定。行者道：「兄弟，你兩個好生保守師父，待老孫變化了，去那城中看看，尋一條僻路，連夜去也。」三藏叮囑道：「徒弟啊，莫當小可，王法不容，你須仔細。」行者笑道：「放心，放心。老孫自有道理。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      悟空は立ち上がり、三蔵を助け起こした。
      悟空「お立ちください。菩薩さまはもう、お山へお帰りです。」
      三蔵は立って言った。
      三蔵「悟空、菩薩さまだと分かっていたのなら、どうして早く言わなかったのだ。」
      悟空は笑った。
      悟空「お師匠さまがまだお尋ねの途中なのに、俺はもう拝んだではありませんか。それでも遅いとおっしゃるのですか。」
      八戒と沙悟浄は悟空に尋ねた。
      八戒と沙悟浄「ありがたくも菩薩さまから教えていただいた。前にあるのは、まちがいなく和尚を殺す滅法国なのだろう。私たちはどうすればいいのだ。」
      悟空「馬鹿、怖がるな。これまで凶悪な魔物や恐ろしい妖怪に出会い、虎の穴や竜の淵へも入ったが、傷つけられはしなかった。ここはただの人間の国だ。何を恐れることがある。ただ、ここに居続けるのはまずいな。もう日も暮れる。村の者が町の商売から帰ってきて、俺たちが和尚だと見つけ、大騒ぎして触れ回ったら厄介だ。まずお師匠さまを本道から離れた静かな場所へお連れして、それから相談しよう。」
      三蔵は言われたとおりにし、一行は道から身を隠して、窪地の下へ行き、腰を下ろした。
      悟空「弟たち、お前たち二人は、お師匠さまをしっかり守っていてくれ。俺は姿を変えて、町の中を見てくる。人目につかない道を探し、今夜のうちに通り抜けよう。」
      三蔵は念を押した。
      三蔵「悟空、軽く考えてはならない。王の法は容赦しないのだ。十分に気をつけるのだよ。」
      悟空は笑った。
      悟空「ご安心ください、ご安心ください。俺には考えがあります。」
    "translation_status": "draft"
  - "id": "xy-ch84-007"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，話畢，將身一縱，唿哨的跳在空中。怪哉："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 134
        "line_end": 134
    "translation_ja": "さすがは悟空、言い終えるなり、ひゅうと身を躍らせて空へ飛び上がった。まことに不思議なことだ。"
    "translation_status": "draft"
  - "id": "xy-ch84-008"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      上面無繩扯，下頭沒棍撐。
      一般同父母，他便骨頭輕。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 135
        "line_end": 136
    "translation_ja": |-
      上から縄で引かれるのでもなく、
      下から棒で支えられるのでもない。
      同じように父母から生まれた身なのに、
      どうしてあいつだけ、あんなに骨が軽いのだろう。
    "translation_status": "draft"
  - "id": "xy-ch84-009"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "佇立在雲端裡，往下觀看。只見那城中喜氣沖融，祥光蕩漾。行者道：「好個去處，為何滅法？」看一會，漸漸天昏，又見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      悟空は雲の上に立ち、下を見た。町の中には喜ばしい気が満ち、めでたい光がゆらめいている。
      悟空「いい所じゃないか。それなのに、どうして仏法を滅ぼすのだ。」
      しばらく眺めているうちに、しだいに暮れてきた。また、こんな光景が見えた。
    "translation_status": "draft"
  - "id": "xy-ch84-010"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": "十字街燈光燦爛，九重殿香藹鐘鳴。七點皎星照碧漢，八方客旅卸行蹤。六軍營，隱隱的畫角才吹；五鼓樓，點點的銅壺初滴。四邊宿霧昏昏，三市寒煙藹藹。兩兩夫妻歸繡幙，一輪明月上東方。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      十字路には灯火がきらめき、
      九重の宮殿には香が漂い、鐘が鳴る。
      七つの明るい星が青い天の川を照らし、
      八方から来た旅人は旅の歩みを休める。
      六軍（りくぐん）の陣営では、絵飾りのある角笛がかすかに吹き始め、
      五更（ごこう）を告げる楼では、銅の水時計がぽつりぽつりと滴り始める。
      四方には夜霧が暗くたちこめ、
      三つの市場には冷たいもやがかすむ。
      二人ずつ夫婦は刺繡の寝帳へ帰り、
      一輪の明月が東の空へ昇る。
    "translation_status": "draft"
  - "id": "xy-ch84-011"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "他想著：「我要下去，到街坊打看路逕，這般個嘴臉，撞見人，必定說是和尚。等我變一變了。」捻著訣，念動真言，搖身一變，變做個撲燈蛾兒："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空は考えた。
      悟空の心の声「下へ降りて、町で道を調べたいが、この顔では、人に出会えば、きっと和尚だと言われる。ひとつ姿を変えよう。」
      指で印を結び、真言（しんごん）を唱え、体を揺すると、灯火に飛び込む一匹の蛾になった。
    "translation_status": "draft"
  - "id": "xy-ch84-012"
    "section_id": "chapter-84"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      形細翼磽輕巧，滅燈撲燭投明。本來面目化生成。腐草中間靈應。
      每愛炎光觸燄，忙忙飛繞無停。紫衣香翅趕流螢。最喜夜深風靜。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 144
        "line_end": 145
    "translation_ja": |-
      姿は細く、羽は薄く、身軽で器用。
      灯を消し、蝋燭に飛びつき、明かりへ身を投げる。
      本来の姿から化けて生まれたこの身は、
      腐った草の中から、霊妙な力で現れたもの。
      いつも炎の光を慕い、その火に触れ、
      せわしなく飛び回ってやむことがない。
      紫の衣、香る羽で、流れる蛍を追い、
      夜が更けて風の静かな時を、何より好む。
    "translation_status": "draft"
  - "id": "xy-ch84-013"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "但見他翩翩翻翻，飛向六街三市，傍房簷，近屋角。正行時，忽見那隅頭拐角上一彎子人家，家家門首掛著個燈籠兒。他道：「這人家過元宵哩，怎麼挨排兒都點燈籠？」他硬硬翅，飛近前來，仔細觀看，正當中一家子，方燈籠上寫著「安歇往來商賈」六字，下面又寫著「王小二店」四字。行者才知是開飯店的。又伸頭打一看，看見有八九個人，都吃了晚飯，寬了衣服，卸了頭巾，洗了腳手，各各上床睡了。行者暗喜道：「師父過得去了。」你道他怎麼就知過得去？他要起個不良之心，等那些人睡著，要偷他的衣服、頭巾，裝做俗人進城。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      悟空はひらひらと町の通りや市場へ飛んでいき、軒に寄り、家の角をかすめた。飛んでいるうちに、曲がり角の一画に家々が弧を描いて並び、どの家の入口にも提灯が掛かっているのを見つけた。
      悟空「ここの家は元宵節（げんしょうせつ）でも祝っているのか。どうして一軒残らず、提灯をともしているんだ。」
      羽をぴんと張り、近くへ飛んで、よく見てみる。真ん中の一軒の四角い提灯には「安歇往來商賈」という六文字、つまり「往来の商人、お泊まりできます」と書き、その下に「王小二店（おうしょうじてん）」の四文字があった。悟空はそこで初めて、食事も出す宿屋だと分かった。さらに頭を伸ばしてのぞくと、八、九人の客が夕飯を済ませ、着物をゆるめ、頭巾を脱ぎ、手足を洗って、それぞれ寝床へ入っていた。悟空はひそかに喜んだ。
      悟空「これなら、お師匠さまも通っていけるぞ。」
      どうして、それだけで通れると分かったのか。実はよからぬ気を起こし、客が眠るのを待って着物と頭巾を盗み、俗人に化けて町へ入ろうと思ったのである。
    "translation_status": "draft"
  - "id": "xy-ch84-014"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "噫！有這般不遂意的事：正思忖處，只見那小二走向前，吩咐：「列位官人，仔細些，我這裡君子小人不同，各人的衣物、行李都要小心著。」你想那在外做買賣的人，那樣不仔細？又聽得店家吩咐，越發謹慎。他都爬起來道：「主人家說得有理，我們走路的人辛苦，只怕睡著，急忙不醒，一時失所，奈何？你將這衣服、頭巾、搭聯都收進去，待天將明，交付與我們起身。」那王小二真個把些衣物之類，盡情都搬進他屋裡去了。行者性急，展開翅，就飛入裡面，丁在一個頭巾架上。又見王小二去門首摘了燈籠，放下吊搭，關了門窗，卻才進房，脫衣睡下。那王小二有個婆子，帶了兩個孩子，哇哇聒噪，急忙不睡。那婆子又拿了一件破衣，補補納納，也不見睡。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      ところが、ああ、うまくいかないことはあるものだ。悟空が考えを巡らせていると、王小二（おうしょうじ）が進み出て注意した。
      王小二「皆さま、お気をつけください。当家には善い人ばかりでなく、悪い者も出入りします。衣類や荷物は、それぞれご用心くださいませ。」
      よそへ出て商売する者が、どうして不用心でいようか。そのうえ店主に注意されたので、客はますます用心深くなった。みな起き上がって言った。
      宿泊客たち「ご主人の言うとおりだ。旅をしていると疲れるから、寝込んでしまって、すぐに目が覚めないこともある。万一、持ち物を失ったらどうにもならない。この着物と頭巾と振り分け袋を、奥へしまっておいてくれないか。夜が明けるころに渡してもらって、出発することにしよう。」
      王小二は本当に、衣類などをすっかり自分の部屋へ運び入れてしまった。気の短い悟空は羽を広げて奥へ飛び込み、頭巾掛けにとまった。王小二は入口の提灯を外し、吊り板を下ろし、戸と窓を閉めてから、ようやく部屋に入り、着物を脱いで寝た。王小二には妻がおり、二人の子供を世話していたが、子供たちはわあわあと騒いで、すぐには眠らない。妻も破れた着物を一枚取り出して、つくろったり縫ったりし、眠る様子がなかった。
    "translation_status": "draft"
  - "id": "xy-ch84-015"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者暗想道：「若等這婆子睡了下手，卻不誤了師父？」又恐更深，城門閉了，他就忍不住，飛下去，望燈上一撲。真是：捨身投火焰，焦額探殘生。那盞燈早已息了。他又搖身一變，變作個老鼠，嗔嗔哇哇的叫了兩聲，跳下來，拿著衣服、頭巾，往外就走。那婆子慌慌張張的道：「老頭子，不好了，夜耗子成精也。」行者聞言，又弄手段，攔著門，厲聲高叫道：「王小二，莫聽你婆子胡說。我不是夜耗子成精。明人不做暗事，吾乃齊天大聖臨凡，保唐僧往西天取經。你這國王無道，特來借此衣冠，裝扮我師父。一時過了城去，就便送還。」那王小二聽言，一轂轆爬起來，黑天摸地，又是著忙的人，撈著褲子當衫子，左穿也穿不上，右套也套不上。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      悟空はひそかに考えた。
      悟空の心の声「この女房が寝てから手を出すのでは、お師匠さまを待たせすぎてしまう。」
      夜が更けて城門が閉まるのも心配だったので、我慢できなくなり、飛び降りて灯へ飛び込んだ。まさに、身を捨てて炎へ入り、額を焦がして残る命を試すというありさまだ。灯はたちまち消えた。悟空はまた体を揺すって鼠に変わり、ちゅうちゅうと二声鳴き、飛び降りると、着物と頭巾を取って外へ出ようとした。妻がうろたえて叫んだ。
      王小二の妻「あんた、大変だよ。夜の鼠が化け物になった！」
      悟空はそれを聞くと、さらに術を使い、戸口をふさいで、厳しい声で叫んだ。
      悟空「王小二、女房のでたらめを聞くな。俺は鼠の化け物ではない。公明正大な者は、こそこそ隠れて事をしない。俺は下界へ降りた斉天大聖（せいてんたいせい）だ。唐僧（とうそう）を守り、西天（さいてん）へ経を取りに行くところだが、お前たちの国王が無道なので、わざわざこの衣服と冠を借りに来た。師匠を変装させ、町を通り抜けたら、すぐ返してやる。」
      王小二はその声に、転がるように飛び起きた。真っ暗な中を手探りし、慌てているものだから、下穿きを上着と思い込んでつかんだ。左から着ようとしても着られず、右からかぶろうとしてもかぶれなかった。
    "translation_status": "draft"
  - "id": "xy-ch84-016"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那大聖使個攝法，早已駕雲出去。復翻身，徑至路下坑坎邊前。三藏見星光月皎，探身凝望，見是行者來至近前，即開口叫道：「徒弟，可過得滅法國麼？」行者上前放下衣物道：「師父，要過滅法國，和尚做不成。」八戒道：「哥，你勒掯那個哩？不做和尚也容易，只消半年不剃頭，就長出毛來也。」行者道：「那裡等得半年？眼下就都要做俗人哩。」那獃子慌了道：「但你說話，通不察理。我們如今都是和尚，眼下要做俗人，卻怎麼戴得頭巾？就是邊兒勒住，也沒收頂繩處。」三藏喝道：「不要打花，且幹正事。端的何如？」行者道：「師父，他這城池，我已看了，雖是國王無道殺僧，卻倒是個真天子，城上有祥光喜氣。城中的街道，我也認得。這裡的鄉談，我也省得，會說。卻才在飯店內借了這幾件衣服、頭巾，我們且扮作俗人，進城去借了宿，至四更天就起來，教店家安排了齋吃。捱到五更時候，挨城門而去，奔大路西行。就有人撞見扯住，也好折辨：只說是上邦欽差的，滅法王不敢阻滯，放我們來的。」沙僧道：「師兄處的最當，且依他行。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      悟空は物を運ぶ術を使い、早くも雲に乗って外へ出ていた。そのまま身を返し、道の下の窪地へ向かった。三蔵は明るい星と月のもと、身を乗り出して見つめていたが、悟空が近づいてくるのを認め、声をかけた。
      三蔵「悟空、滅法国を通っていけそうか。」
      悟空は前に出て、衣類を置いた。
      悟空「お師匠さま、滅法国を通るなら、和尚はやめなければなりません。」
      八戒「兄貴、誰を困らせようってんだ。和尚をやめるだけなら簡単だ。半年も頭を剃らなければ、毛が生えてくるさ。」
      悟空「半年も待っていられるか。今すぐみんな俗人になるんだ。」
      八戒は慌てた。
      八戒「兄貴の言うことは、ちっとも理にかなわないな。今の俺たちはみんな和尚だぞ。今すぐ俗人になれといっても、どうやって頭巾をかぶるんだ。縁を締めることはできても、てっぺんの紐を留める所がないだろう。」
      三蔵は叱った。
      三蔵「ふざけずに、肝心な話をしなさい。実際はどうなのだ。」
      悟空「お師匠さま、あの町は見てきました。国王は無道にも僧を殺していますが、それでもれっきとした天子です。町の上には、めでたい光と喜ばしい気がありました。町の道も分かりましたし、この土地の言葉も理解でき、話せます。さっき宿屋でこの着物と頭巾を借りてきました。まずは俗人に化けて町に入り、一晩泊まりましょう。四更（しこう）になったら起きて、宿に精進の食事を作らせて食べ、五更を待って城門へ向かい、本道を西へ進みます。誰かに出会って引き止められても、言い開きはできます。『大国から勅命で遣わされた者なので、滅法王（めっぽうおう）も引き止められず、通してくださったのだ』と言えばいい。」
      沙悟浄「兄さんの考えがいちばん適切です。まずはそのとおりにしましょう。」
    "translation_status": "draft"
  - "id": "xy-ch84-017"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "真個長老無奈，脫了褊衫，去了僧帽，穿了俗人的衣服，戴了頭巾。沙僧也換了。八戒的頭大，戴不得巾兒，被行者取了些針線，把頭巾扯開兩頂，縫做一頂，與他搭在頭上；揀件寬大的衣服，與他穿了。然後自家也換上一套道：「列位，這一去，把『師父』、『徒弟』四個字兒且收起。」八戒道：「除了此四字，怎的稱呼？」行者道：「都要做弟兄稱呼：師父叫做唐大官兒，你叫做朱三官兒，沙僧叫做沙四官兒，我叫做孫二官兒。但到店中，你們切休言語，只讓我一個開口答話。等他問甚麼買賣，只說是販馬的客人，把這白馬做個樣子。說我們是十弟兄，我四個先來賃店房賣馬。那店家必然款待我們，我們受用了，臨行時，等我拾塊瓦查兒，變塊銀子謝他，卻就走路。」長老無奈，只得曲從。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      三蔵はやむなく僧衣を脱ぎ、僧帽を取って、俗人の着物を着、頭巾をかぶった。沙悟浄も着替えた。八戒は頭が大きく、頭巾が入らない。そこで悟空が針と糸を持ち出し、頭巾を二つほどいて一つに縫い合わせ、八戒の頭へ載せ、幅の広い着物を選んで着せてやった。それから自分も一そろい着替えた。
      悟空「みんな、これからは『師父』『徒弟』という四文字を、しばらくしまっておくんだ。」
      八戒「その四文字を使わず、どう呼び合うんだい。」
      悟空「みんな兄弟として呼び合おう。お師匠さまは唐大官（とうたいかん）、お前は朱三官（しゅさんかん）、沙悟浄は沙四官（さしかん）、俺は孫二官（そんじかん）だ。ただし宿へ入ったら、お前たちは絶対に口をきくな。返事は俺一人に任せろ。何の商売かと聞かれたら、馬を売る商人だと言って、この白馬を見本にする。俺たちは十人兄弟で、四人が先に来て、馬を売るために部屋を借りるのだと言うんだ。そうすれば、宿はきっとよくもてなしてくれる。ごちそうになって、出発するときに、俺が瓦のかけらを拾って銀に変え、礼として渡して、そのまま出かけよう。」
      三蔵はどうしようもなく、不本意ながら従った。
    "translation_status": "draft"
  - "id": "xy-ch84-018"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四眾忙忙的牽馬挑擔，跑過那邊。此處是個太平境界，入更時分，尚未關門，徑直進去。行到王小二店門首，只聽得裡邊叫哩。有的說：「我不見了頭巾。」有的說：「我不見了衣服。」行者只推不知，引著他們，往斜對門一家安歇。那家子還未收燈籠，即近門叫道：「店家，可有閑房兒，我們安歇？」那裡邊有個婦人答應道：「有有有，請官人們上樓。」說不了，就有一個漢子來牽馬，行者把馬兒遞與牽進去。他引著師父，從燈影兒後面，徑上樓門，那樓上有方便的桌椅。推開窗格，映月光齊齊坐下。只見有人點上燈來，行者攔門，一口吹息道：「這般月亮不用燈。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第084回&oldid=2597328"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      四人は急いで馬を引き、荷を担ぎ、あちらへ駆けていった。このあたりは世の中が平穏なので、夜の最初の更に入っても、まだ門は閉まっていなかった。一行はそのまま入った。王小二の宿の前まで行くと、中から叫び声が聞こえた。
      宿泊客の一人「俺の頭巾がない！」
      別の宿泊客「俺の着物がなくなった！」
      悟空は知らないふりをして、一行を連れ、斜め向かいの宿へ泊まりに行った。その宿はまだ提灯を取り込んでいなかったので、入口へ寄って声をかけた。
      悟空「ご主人、泊まれる空き部屋はあるかい。」
      中から婦人が答えた。
      店内の婦人「あります、あります、ありますよ。お客様、どうぞ二階へ。」
      言い終えないうちに、一人の男が馬を引きに来た。悟空は馬を渡して中へ入れさせ、自分は三蔵を連れ、灯の光を避けるようにして二階へ上がった。そこには使いよさそうな机と椅子があった。窓を開け放ち、月明かりの中にみな並んで座った。人が灯をともして持ってくると、悟空は戸口でさえぎり、一息で吹き消した。
      悟空「こんなに月が明るいのだから、灯は要らない。」
    "translation_status": "draft"
  - "id": "xy-ch84-019"
    "section_id": "chapter-84"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那人才下去，又一個丫鬟拿四碗清茶，行者接住。樓下又走上一個婦人來，約有五十七八歲的模樣，一直上樓，站在傍邊。問道：「列位客官，那裡來的？有甚寶貨？」行者道：「我們是北方來的，有幾匹粗馬販賣。」那婦人道：「販馬的客人尚還小。」行者道：「這一位是唐大官，這一位是朱三官，這一位是沙四官，我學生是孫二官。」婦人笑道：「異姓。」行者道：「正是異姓同居：我們共有十個弟兄，我四個先來賃店房打火；還有六個在城外借歇，領著一群馬，因天晚不好進城。待我們賃了房子，明早都進來。只等賣了馬才回。」那婦人道：「一群有多少馬？」行者道：「大小有百十匹兒，都像我這個馬的身子，卻只是毛片不一。」婦人笑道：「孫二官人誠然是個客綱客紀。早是來到舍下，第二個人家也不敢留你。我舍下院落寬闊，槽劄齊備，草料又有，憑你幾百匹馬都養得下。卻一件：我舍下在此開店多年，也有個賤名。先夫姓趙，不幸去世久矣。我喚做趙寡婦店。我店裡三樣兒待客。如今先小人，後君子，先把房錢講定後，好算帳。」行者道：「說得是。你府上是那三樣待客？常言道：『貨有高低三等價，客無遠近一般看。』你怎麼說三樣待客？你可試說說我聽。」趙寡婦道：「我這裡是上、中、下三樣。上樣者，五果五菜的筵席，獅仙斗糖桌面，二位一張，請小娘兒來陪唱陪歇，每位該銀五錢，連房錢在內。」行者笑道：「相應啊，我那裡五錢銀子還不夠請小娘兒哩。」寡婦又道：「中樣者，合盤桌兒，只是水果、熱酒，篩來憑自家猜枚行令，不用小娘兒，每位只該二錢銀子。」行者道：「一發相應。下樣兒怎麼？」婦人道：「不敢在尊客面前說。」行者道：「也說說無妨，我們好揀相應的幹。」婦人道：「下樣者，沒人伏侍，鍋裡有方便的飯，憑他怎麼吃；吃飽了，拿個草兒，打個地鋪，方便處睡覺。天光時，憑賜幾文飯錢，決不爭競。」八戒聽說道：「造化，造化！老朱的買賣到了！等我看著鍋吃飽了飯，灶門前睡他娘！」行者道：「兄弟，說那裡話？你我在江湖上，那裡不賺幾兩銀子？把上樣的安排將來。」"
    "source_languages":

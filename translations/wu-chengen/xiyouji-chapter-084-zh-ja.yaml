    "source_text": "那媽媽走下去，倚著櫃欄嘆氣。他有個女兒，抱著個孩子近前道：「母親，常言道：『十日灘頭坐，一日行九灘。』如今炎天，雖沒甚買賣，到交秋時，還做不了的生意哩，你嗟嘆怎麼？」婦人道：「兒啊，不是愁沒買賣。今日晚間，已是將收鋪子，入更時分，有這四個馬販子來賃店房，他要上樣管待。實指望賺他幾錢銀子，他卻吃齋，又賺不得他錢，故此嗟嘆。」那女兒道：「他既吃了飯，不好往別人家去，明日還好安排葷酒，如何賺不得他錢？」婦人又道：「他都有病、怕風、羞亮，都要在黑處睡。你想家中都是些單浪瓦兒的房子，那裡去尋黑暗處？不若捨一頓飯與他吃了，教他往別家去罷。」女兒道：「母親，我家有個黑處，又無風色，甚好，甚好。」婦人道：「是那裡？」女兒道：「父親在日曾做了一張大櫃，那櫃有四尺寬，七尺長，三尺高下，裡面可睡六七個人。教他們往櫃裡睡去罷。」婦人道：「不知可好？等我問他一聲。──孫官人，舍下蝸居，更無黑處，止有一張大櫃，不透風，又不透亮，往櫃裡睡去如何？」行者道：「好好好。」即著幾個客子把櫃擡出，打開蓋兒，請他們下樓。"
    "source_languages":
      - "zh-Hant"

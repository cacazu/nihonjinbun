    "translation_ja": |-
      趙寡婦は心から喜んで、すぐに叫んだ。
      趙寡婦「いいお茶をお出しして。台所は急いで料理をこしらえな。」
      階下へ下りると、せわしく命じた。
      趙寡婦「鶏と鵞鳥をつぶして、塩漬けも煮て、おかずにするんだよ。」
      さらに声を張り上げた。
      趙寡婦「豚も羊もつぶしな。今日使い切らなくても、明日には使える。いい酒を用意して、白米を炊き、白い小麦粉をこねて、薄焼きの生地を延ばしなさい。」
      二階でそれを聞いた三蔵が言った。
      三蔵「孫二官、どうするのだ。鶏や鵞鳥をつぶし、豚や羊を殺しに行ってしまった。運ばれてきても、私たちはいつも精進を守っているのだから、誰も食べられまい。」
      悟空「俺に考えがあります。」
      悟空は階段口へ行き、足をどんどん踏み鳴らした。
      悟空「趙の女将さん、上へ来てくれ。」
      趙寡婦が上がってきた。
      趙寡婦「二官（じかん）さま、何かご用ですか。」
      悟空「今日はまだ殺生をしないでくれ。俺たちは今日は斎戒しているんだ。」
      趙寡婦は驚いた。
      趙寡婦「皆さまはいつも精進をなさるのですか。それとも、月を決めてなさるのですか。」
      悟空「どちらでもない。俺たちのは庚申斎（こうしんさい）というものだ。今日は庚申（こうしん）の日だから精進しなければならないが、三更（さんこう）を過ぎれば辛酉（しんゆう）になって、精進を解ける。殺生は明日にしてくれ。今はひとまず、精進の料理を用意してもらいたい。代は必ず、上等の値段どおりに払うから。」

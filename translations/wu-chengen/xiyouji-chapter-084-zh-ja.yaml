    "source_text": "那婦人滿心歡喜，即叫：「看好茶來，廚下快整治東西。」遂下樓去，忙叫：「宰雞宰鵝，煮醃下飯。」又叫：「殺豬殺羊，今日用不了，明日也可用。看好酒，拿白米做飯，白麵捍餅。」三藏在樓上聽見道：「孫二官，怎好？他去宰雞鵝，殺豬羊，倘送將來，我們都是長齋，那個敢吃？」行者道：「我有主張。」去那樓門邊跌跌腳道：「趙媽媽，你上來。」那媽媽上來道：「二官人有甚吩咐？」行者道：「今日且莫殺生，我們今日齋戒。」寡婦驚訝道：「官人們是長齋，是月齋？」行者道：「俱不是，我們喚做庚申齋。今朝乃是庚申日，當齋。只過三更後，就是辛酉，便開齋了。你明日殺生罷。如今且去安排些素的來，定照上樣價錢奉上。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

    "translation_ja": |-
      三蔵は悟空の耳元で、そっと尋ねた。
      三蔵「どこで寝るのだ。」
      悟空「この二階で寝ましょう。」
      三蔵「それは心配だ。私たちはみな疲れ切っている。寝込んだところへ、ここの者が何か片づけに来て、帽子が転げ落ちた拍子に禿げ頭を見られ、和尚だと気づかれて騒がれたら、どうするのだ。」
      悟空「それはそうですね。」
      悟空はまた階段口で足を踏み鳴らした。趙寡婦が再び上がってきた。
      趙寡婦「孫（そん）さま、今度は何のご用でしょう。」
      悟空「俺たちはどこで寝ればいい。」
      趙寡婦「二階は寝心地がよろしゅうございます。蚊もいませんし、南風が吹き、窓も大きく開けてありますから、とてもよく眠れますよ。」
      悟空「それでは眠れないんだ。この朱三官は冷えと湿気で具合が悪くなるし、沙四官には肩の痛む病がある。唐（とう）の兄さんは暗い所でなければ眠らず、俺も少し光がまぶしいのが苦手だ。ここは寝るには向かない。」

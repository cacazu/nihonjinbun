  "known_gaps":
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-001"
      "description_ja": "回題の「伽持」は加持の異表記と解した。「難滅伽持」の句の切り方には幅があるため、難を滅ぼす仏力の加護という趣旨で訳す。「法王」「正」「天然」は仏教・修行の語を重ねる表現で、回題だけから特定人物の改心や救出の完了は補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-004"
      "description_ja": "原文は「送命王菩薩」。特定の尊格の正式名と断定せず、命を送り届けてしまう者という、老婆の警告をこめた戯称として訳した。冒頭の「老菩薩」も老女への敬称であり、この呼びかけ自体が身元を明かすわけではない。「羅天大願」は、天にかけた大きな誓いという文脈に限定し、特定の道教儀礼の実施を補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-008"
      "description_ja": "原詩は「一般同父母」と、父母を持つ同じ身であることを並べて、悟空だけが空へ跳べる不思議さを戯画化する。石から生まれたという既知の来歴との整合のために、原詩を補訂していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-010"
      "description_ja": "原文の数は十、九、七、八、六、五、四、三、二、一の順。七と八を入れ替えて整えず、そのまま保った。「五鼓楼」は時刻を告げる楼と解し、夕方の場面を五更の出来事へ移していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-012"
      "description_ja": "「腐草」は腐草が蛍に化すという古い観念を思わせる。原詩は蛾の姿を詠みながら蛍のイメージも交えるので、種類を訂正せず保った。「翼磽」の磽は通常は硬い石地などを表す字で、ここでは薄く軽い羽の形容と読んだが、字義の接続には留保する。現代の昆虫学の説明ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-014"
      "description_ja": "原文の「丁」は、ここでは虫が物にとまる動作として読んだ。「吊搭」は店の入口に下ろす吊り板の類と解したが、具体的な建具の構造は確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-016"
      "description_ja": "原文は「沒收頂繩處」。頭巾を髷などの髪に留める前提で、剃髪した頭には紐を留める所がないという八戒の理屈と解した。具体的な頭巾の仕立ては未確定。「勒掯」は相手を困らせたり無理を強いたりする意味で訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-019"
      "description_ja": "原文は「販馬的客人尚還小」。文末に疑問標識はないが、悟空の「粗馬」という謙遜への返事として、馬商いを小さな商売とはいえないという含みで読んだ。構文には留保があり、馬を売る客の年齢を述べたとは解していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-019"
      "description_ja": "原文の「獅仙斗糖桌面」は獅子・仙人をかたどる糖菓や飾り菓子を並べた卓上の盛り物と解した。斗糖の細かな製法は確定しない。「小娘兒」の「陪唱陪歇」は歌の相手だけでなく同衾の相手もする意味を保ち、単なる給仕には弱めていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-020"
      "description_ja": "原文は「煮醃下飯」で、塩漬けの食物を煮ておかずにする、と読んだ。醃の具体的な材料や料理名は確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-020"
      "description_ja": "「長齋」は常時、「月齋」は月単位で行う斎戒と解し、特定の期間や日数は補っていない。悟空の説明では庚申の次は辛酉で、三更を過ぎれば精進を解く。これは客としての悟空の説明であり、三蔵が翌日から肉を食べると承諾したわけではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-021"
      "description_ja": "「閩筍」は閩、すなわち福建の筍、「麵筋」は小麦のたんぱく質から作る麩の類、「粉湯」は春雨などを入れた汁、「發麵蒸捲子」は発酵させた小麦の生地を巻いて蒸すものと解した。具材や形の細部は本文にないので補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-022"
      "description_ja": "悟空が挙げる「寒濕氣」「漏肩風」「羞明」は、冷えと湿気による不調、肩の痛む病、光をまぶしく感じる状態として訳す。人物が寝場所を変えるために述べる理由であり、三人の実際の病歴や現代医学上の診断を確定したものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-024"
      "description_ja": "底本は「把糟擡來」と糟の字。馬を食べさせる場面なので、飼葉桶を表す槽の意味と読んだが、原文は書き換えていない。この段落の珍字「\U00027FFC」は跳び入る動作として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-025"
      "description_ja": "原文は元手五千両、前の売上三千両、現在の手持ち四千両、さらに三千両で売れば「一本一利」、すなわち元手と同額の利という。単純な足し算だけでは一致しないが、悟空の発言の数字と結論をそのまま保持し、収支や使途を補って帳尻を合わせていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-028"
      "description_ja": "驌驦は古くから名馬をいう語で、既存の語彙を再用するが、御馬監にいた特定の馬がここに現れたとの同定はしない。款段は辞書では歩みの遅い馬・駑馬の意味があり、名馬と並ぶ不揃いな表現を勝手に別の名馬へ改めなかった。尾を振る原字「\U00022DD1」は動作の文脈から解した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-031"
      "description_ja": "「五府六部」は明代の軍政・行政組織を連想させる総称で、五府は五軍都督府、六部は中央の行政六部に結びつく。ただし、ここでの架空の国を明代の特定の都へ同定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-032"
      "description_ja": "法・法王・万法を重ねた寓意詩。「法王」は仏法の王という語であり、仏法を滅ぼす世俗の王とも重ねられるが、如来本人の登場とはしない。玉の長持と金の毛は直前の出来事を詩的に言い直す。「正果」を得るという語り手の予告は保持するが、本文でまだ描かれない改心や救出の完了を補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-033"
      "description_ja": "「守困」は眠気を抱えて時を過ごすことと読んだが、寝ずに待つのか、眠りながら待つのかまでは確定しない。三蔵の新たな発言や悟空の帰還に気づいた反応は補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-034"
      "description_ja": "原文は初め「三宮皇后」と複数的に記し、続いて「皇后」とする。三宮の誰か、全員なのかを断定せず、その切り替わりを保った。寝台にいる「和尚」は、頭髪を失った国王がそう見えるという描写で、別の僧との入れ替わりではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch84-2597328"
      "segment_ids":
        - "xy-ch84-036"
      "description_ja": "「靜鞭」は朝廷で静粛を促すために鳴らす鞭。「當今」は現在の皇帝を指すと読んだ。官人たちの上表の内容そのものは本文に載っていないので、その全文や原因の特定を創作していない。 原文の欠落ではなく、解釈・校訂上の留保。"

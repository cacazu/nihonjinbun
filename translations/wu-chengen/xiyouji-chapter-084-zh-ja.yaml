    "source_text": "三藏在行者耳根邊悄悄的道：「那裡睡？」行者道：「就在樓上睡。」三藏道：「不穩便。我們都辛辛苦苦的，倘或睡著，這家子一時再有人來收拾，見我們或滾了帽子，露出光頭，認得是和尚，嚷將起來，卻怎麼好？」行者道：「是啊！」又去樓前跌跌腳，寡婦又上來道：「孫官人又有甚吩咐？」行者道：「我們在那裡睡？」婦人道：「樓上好睡，又沒蚊子，又是南風，大開著窗子，忒好睡覺。」行者道：「睡不得。我這朱三官兒有些寒濕氣，沙四官兒有些漏肩風，唐大哥只要在黑處睡，我也有些兒羞明，此間不是睡處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"

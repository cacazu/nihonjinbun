    "translation_ja": |-
      趙寡婦はますます喜び、階下へ駆け下りて命じた。
      趙寡婦「つぶさないで、つぶさないで。木耳、福建（ふっけん）の筍、豆腐、麩を持ってきて、畑から青菜を抜いておいで。春雨の汁を作り、生地を発酵させて巻き蒸しパンを蒸し、それから白米を炊き、香りのよい茶を沸かしなさい。」
      いやはや、台所の料理人たちは、毎日やり慣れた腕前である。あっという間に料理がそろい、二階に並んだ。出来合いの獅子や仙人の飴菓子もあり、四人は心ゆくまで食べた。趙寡婦が尋ねた。
      趙寡婦「精進のお酒はお飲みになりますか。」
      悟空「唐大官だけは飲まない。俺たちは何杯かいただこう。」
      趙寡婦は燗をした酒を一壺持ってきた。三人がちょうど注ぎ合ったところへ、階下から、ばんばんと板に当たる音がした。
      悟空「女将さん、下で何か道具でも倒れたのかい。」
      趙寡婦「いいえ。うちの小さな荘園から、小作人が何人か年貢米を運んできたのですが、遅くなったので下で寝かせておりました。お客様方がおいでになり、人手が足りませんでしたから、駕籠を担いで遊里へ行き、お相手の女を呼んでくるよう言いつけたのです。きっと駕籠の棒が床板に当たったのでしょう。」
      悟空「今、言ってくれてよかった。急いで止めてくれ。一つには今日は斎戒の日だし、もう一つには兄弟たちがまだ来ていない。いっそ明日みんな来てから、一人ずつ娼婦を呼び、このお宅でしばらく遊び、馬を売ってから出発しよう。」
      趙寡婦「よいお方、よいお方。皆さまの仲も損なわず、精気も養えますね。」
      そして命じた。
      趙寡婦「駕籠を中へ戻しな。女は呼びに行かなくていいよ。」
      四人は酒と食事を済ませ、器は片づけられ、皆が下がった。

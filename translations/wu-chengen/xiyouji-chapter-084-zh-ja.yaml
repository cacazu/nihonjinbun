    "source_text": "那婦人越發歡喜，跑下去教：「莫宰，莫宰。取些木耳、閩筍、豆腐、麵筋，園裡拔些青菜，做粉湯，發麵蒸捲子，再煮白米飯，燒香茶。」咦！那些當廚的庖丁都是每日家做慣的手段，霎時間就安排停當，擺在樓上，又有現成的獅仙糖果，四眾任情受用。又問：「可吃素酒？」行者道：「止唐大官不用，我們也吃幾杯。」寡婦又取了一壺暖酒。他三個方才斟上，忽聽得乒乓板響。行者道：「媽媽，底下倒了甚麼家火了？」寡婦道：「不是，是我小莊上幾個客子送租米來晚了，教他在底下睡。因客官到，沒人使用，教他們擡轎子去院中請小娘兒陪你們，想是轎杠撞得樓板響。」行者道：「早是說哩，快不要去請：一則齋戒日期，二則兄弟們未到。索性明日進來，一家請個表子，在府上耍耍時，待賣了馬起身。」寡婦道：「好人，好人，又不失了和氣，又養了精神。」教：「擡進轎子來，不要去請。」四眾吃了酒飯，收了家火，都散訖。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch84-2597328"

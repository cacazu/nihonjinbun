    "message_ja": "雑犯と真犯の死罪区分、三媒六証と婚礼の贈り物の列挙を保持。明代的な法制語を唐代へ置き換えず、人物の法解釈が実際の法に正確であるとも保証しない。雑犯・真犯の区別は佐立治人「明朝の立法・刑罰・裁判」（関西大学法学論集67巻6号）の説明を参照した。"
- "id": "xy-ch19-010"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": "此是鍛煉神冰鐵，磨琢成工光皎潔。\n老君自己動鈐鎚，熒\U000243D8親身添炭屑。\n五方五帝用心機，六丁六甲費周折。\n造成九齒玉垂牙，鑄就雙環金墜葉。\n身妝六曜排五星，體按四時依八節。\n短長上下定乾坤，左右陰陽分日月。\n六爻神將按天條，八卦星辰依斗列。\n名為上寶沁金鈀，進與玉皇鎮丹闕。\n因我修成大羅仙，為吾養就長生客。\n敕封元帥號天蓬，欽賜釘鈀為御節。\n舉起烈焰並毫光，落下猛風飄瑞雪。\n天曹神將盡皆驚，地府閻羅心膽怯。\n人間那有這般兵，世上更無此等鐵。\n隨身變化可心懷，任意翻騰依口訣。\n相攜數載未曾離，伴我幾年無日別。\n日食三餐並不丟，夜眠一宿渾無撇。\n也曾佩去赴蟠桃，也曾帶他朝帝闕。\n皆因仗酒卻行兇，只為倚強便撒潑。\n上天貶我降凡塵，下世儘我作罪孽。\n石洞心邪曾吃人，高莊情喜婚姻結。\n這鈀下海掀翻龍鼉窩，上山抓碎虎狼穴。\n諸般兵刃且休題，惟有吾當鈀最切。\n相持取勝有何難，賭鬥求功不用說。\n何怕你銅頭鐵腦一身鋼，鈀到魂消神氣泄。」"

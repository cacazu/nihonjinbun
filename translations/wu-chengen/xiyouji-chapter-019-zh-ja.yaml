  "known_gaps":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-003"
    "description_ja": "底本「悔不喋」の「喋」は難読の異文。「悔いても言い尽くせぬ」と仮に解し、よく見られる別字へ原文を補訂していない。 天関・地闕、嬰児・姹女、鉛・汞、離龍・坎虎、霊亀・金烏、三花聚頂・五気朝元は道教の内丹的な身体観と象徴。本文の組合せを保持し、実際の動物・人物の交合や金属の服用の指示には置き換えない。細部の部位・配当には留保がある。天関は修練の関門と後半の天界の門を別語義で扱う。 太白李金星の名、二千回の鎚打ち、天河の水軍を総べる元帥への任官を保持。「稱憲節」は憲節と称されたと保守的に訳した。憲節は本来、権限を示す符節だが、ここでは水軍を総べる官の権威をいう換喩・称号と解している。具体的な符節を授与する動作は本文に加えない。第八回との出来事や時系列を独自に調整しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-005"
    "description_ja": "戦闘詩中の行者の「強姦幼女」は相手への告発の言葉として訳し、若い娘を犯したという内容を弱めない。「幼女」はこの場面では若い娘とし、前回の翠蘭の年齢二十歳を変更しない。後の「娘を傷つけたこともない」という行者の発言と独自に整合させない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-009"
    "description_ja": "雑犯と真犯の死罪区分、三媒六証と婚礼の贈り物の列挙を保持。明代的な法制語を唐代へ置き換えず、人物の法解釈が実際の法に正確であるとも保証しない。雑犯・真犯の区別は佐立治人「明朝の立法・刑罰・裁判」（関西大学法学論集67巻6号）の説明を参照した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-010"
    "description_ja": "底本の「神冰鐵」を神氷鉄、「熒\U000243D8」を熒\U000243D8のまま保持した。後者は熒惑、すなわち火星の神と解されるが、字形を一般表記へ黙って直さない。上宝沁金鈀は九歯釘鈀と同じ武器の正式名。 六曜・五星・四時・八節・六爻・八卦の列挙を保持。六曜の具体的な星の内訳は確定できず、日本の六曜暦注へ同定しない。五方五帝は五方に配される神々であり、中国古代の人間の帝王五人と混同しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-012"
    "description_ja": "「善豬惡拿」は、おとなしい豚にも強い手段で対処するという諺の形で訳した。「善」を信心の善悪へ狭めない。自宅焼却、武器の引渡し、後ろ手の縛め、耳を引く動作はそれぞれ原文どおり。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-013"
    "description_ja": "金と木、心猿と木龍、主と客、三交三合、性と情、貞元を組み合わせる内丹寓意の詩。金が木を剋する関係と「金從木順」を独自に整合させず保持し、個々の配当を唯一の体系として断定しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-015"
    "description_ja": "猪悟能はここで新しく授けられた名ではなく、観音がすでに授けた法名の本人による再確認。その名乗りの完了後のみ悟能へ切り替え、三蔵が八戒を授けた直後の返答から八戒を用いる。五葷三厭と八戒という名の言葉遊びを保持し、一般仏教の八斎戒の項目へ本文を改作しない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-016"
    "description_ja": "八戒が妻に挨拶させようとする「公公・伯伯」は、それぞれ夫の父に当たる師父三蔵と、夫の兄に当たる師兄行者を親族に見立てた呼称。「舅さま・義兄さま」と訳した。一般的な現代語なので初出辞書注釈は加えない。 「酒は僧の戒めの第一」という三蔵の発言と、二人の弟子に少量の飲酒を認める言葉は原文どおり。一般的な戒律の配列へ訂正せず、人物の発話として保持する。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-017"
    "description_ja": "金銀の額二百両、褊衫三着、行者がその一部を高才へ渡す動作を保持。三蔵の拒絶と行者の振る舞いを独自に整合させない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-018"
    "description_ja": "「掛腳糧」は立ち去る際に受け取る旅立ちの食糧と解した。三石という穀量は現代重量へ換算していない。青錦袈裟を求める発言と、実際に褊衫を与えられる描写の違いも保持した。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-020"
    "description_ja": "末句の「月滿金華是伐毛」は内丹・脱胎の象徴として、月が金華に満ち、毛を払って俗身を脱する意に仮訳した。金華の具体的な対応と「伐毛」の語義には解釈上の留保がある。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-025"
    "description_ja": "経を五十四句・二百七十字とする禅師の説明を保持。保存した漢字数は題名「摩訶般若波羅蜜多心經」十字と経本文二百六十字を合わせて二百七十字である。句数を独自に組み直して本文を変えてはいない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-026"
    "description_ja": "経文は通行の「無苦集滅道」に当たる箇所が底本では「無苦寂滅道」。原文を改めず、訳も「苦・寂・滅・道」として「寂」を保持した。「寂」を通常の四諦の一つであると確定するものではない。 「時」「以無所得故，菩提薩埵。依般若波羅蜜多故」などの句読は原文欄で保持し、訳では文意がつながるよう日本語の文を組み立てた。仏弟子の舎利子は遺骨を指す舎利子と別人物・別語義である。 末尾の呪は省略せず、音写原文を意味に即して「行け、行け、彼岸へ行け、みなともに彼岸へ行け、悟りよ、成就あれ」と訳した。原語の文法や呼びかけ方には複数の解釈があり、一つの訳解として扱う。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-029"
    "description_ja": "「御」は文脈上、王に仕える者・役人の意と解して「宮仕えの役人」とした。御史・御者など一つの具体的官職へは確定しない。接天崖・摩耳巌・黒松林などの地名や、野猪・水怪・老石猴の暗示を後の回の地名・人名で置き換えない。 本文の欠落ではなく解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "segment_ids":
    - "xy-ch19-030"
    "description_ja": "底本末段は「近那巢邊」。巣のそばへ寄る肯定の動作として訳した。巣の蔓一本にも触れられない前段と独自に整合させて、原文にない「不能」などを補わない。 本文の欠落ではなく解釈・校訂上の留保。"

  "translation_ja": "猪剛鬣「これは神氷鉄（しんひょうてつ）を鍛え、磨き上げて作ったもので、光は白く澄みわたる。\n太上老君（たいじょうろうくん）が自ら火箸と鎚を取り、熒\U000243D8（けいわく）がじかに炭くずをくべた。\n五方五帝（ごほうごてい）が知恵を絞り、六丁六甲（ろくていろっこう）が手間を尽くし、\n玉の牙のように垂れる九つの歯を作り、黄金の葉を下げた二つの環を鋳た。\n柄には六曜（ろくよう）を飾って五星（ごせい）を並べ、本体は四時（しじ）と八節（はっせつ）に合わせた。\n長短と上下で乾坤（けんこん）を定め、左右の陰陽で日月を分け、\n六爻（りくこう）の神将は天の法に従い、八卦（はっけ）の星々は北斗（ほくと）に従って並ぶ。\n名を上宝沁金鈀（じょうほうしんきんは）といい、玉皇へ献じて朱塗りの宮門の鎮めとした。\n俺が修行を成して大羅仙（だいらせん）となり、長生の身を養い上げたので、\n元帥に勅封されて天蓬（てんぽう）と号し、帝の権威を示すしるしとして、この釘鈀（ていは）を賜った。\n振り上げれば激しい炎と光芒がともに立ち、打ち下ろせば猛風が吹き、めでたい雪が舞う。\n天曹（てんそう）の神将はことごとく驚き、地府（ちふ）の閻羅（えんら）も心から恐れる。\n人の世にこんな武器はなく、世間にこれほどの鉄もない。\n身に従って姿を変え、思いのままに動かせば、口訣どおりに自在に翻る。\n数年のあいだ携えて離さず、幾年ものあいだ一日として別れず、\n日ごとの三度の食事でも手放さず、夜の一眠りにも放り出さなかった。\nこれを帯びて蟠桃の会にも出たし、これを持って帝の宮門にも参った。\nそれもみな、酒の勢いで乱暴し、強さに任せて暴れたばかりに、\n天から追われて俗塵へ降り、下界では思うままに罪を重ねた。\n石の洞では邪心を起こして人を食い、高家の荘では恋に喜び縁を結んだ。\nこの熊手が海へ入れば、竜や鼉（だ）の巣をひっくり返し、山へ入れば、虎や狼の穴を掻き砕く。\nほかのどんな刃物も話にならぬ。ただ俺のこの熊手こそが、何より使いよい。\n渡り合って勝ちを取るのに何の難しさがあろう。戦って功を立てるのは言うまでもない。\nお前の頭が銅、脳天が鉄、全身が鋼であろうと、恐れはせぬ。熊手が届けば魂は消え、精気も失せるぞ。」"
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"

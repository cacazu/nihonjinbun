  "translation_ja": |-
    猪剛鬣「生まれた時から気立ては鈍く、暇をむさぼり怠けることに飽きもせず、
    心を養い真の道を修めもせず、混沌として迷いのうちに日月を過ごした。
    ある日、暇に任せていると真の仙人に出会い、座って時候の挨拶を交わした。
    心を改め凡俗へ落ちるなと諭され、命を傷つければ果てしない罪を作ると教えられた。
    いつか寿命の尽きる日が来れば、八難（はちなん）三途（さんず）に落ちて、悔いても言い尽くせぬ。
    その言葉に心を転じて修行を志し、その教えに思いを改め、妙なる秘訣を求めた。
    縁あってその場で弟子入りし、天関（てんかん）と地闕（ちけつ）の教えを授かった。
    九転大還丹（きゅうてんだいかんたん）の法を伝えられ、昼夜の修練を一時も怠らず、
    上は頭頂の泥丸宮（でいがんきゅう）から、下は足裏の湧泉穴（ゆうせんけつ）まで、
    腎水（じんすい）を巡らせ華池（かち）へ入れ、丹田（たんでん）を補ってほかほかと温めた。
    嬰児（えいじ）と姹女（たじょ）で陰陽（いんよう）を配し、鉛（えん）と汞（こう）を合わせて日月を分け、
    離龍（りりゅう）と坎虎（かんこ）を調和させ、霊亀（れいき）に金烏（きんう）の血を吸い尽くさせた。
    三花聚頂（さんかじゅちょう）で根源へ帰り、五気朝元（ごきちょうげん）を徹底して悟り、
    功を成し行いを満たして昇天すると、天仙が二人ずつ迎えに出た。
    輝く彩雲が足もとに湧き、身軽く健やかに金闕（きんけつ）へ参内した。
    玉皇（ぎょくこう）は宴を設けて仙人たちを集め、それぞれの品階を定めて班列を整えた。
    俺は元帥に勅封されて天河（てんが）を管掌し、水軍を総督して憲節（けんせつ）と称された。
    ところが、王母（おうぼ）が蟠桃（ばんとう）の会を催し、瑤池（ようち）に宴を開いて大勢の客を招いた時、
    俺は酒に酔って意識も曇り、あちらへよろめき、こちらへふらつき、やたらに暴れた。
    強がって広寒宮（こうかんきゅう）へ押し入ると、あでやかな仙女が出迎えた。
    魂を奪うその美貌を見れば、昔の俗心はどうにも消し去れず、
    上下も尊卑もまるで忘れ、嫦娥（じょうが）をつかまえて共寝を迫った。
    三度も四度も拒まれ、あちらこちらへ逃げ隠れされて、面白くなくなった。
    天ほども大きな色欲に駆られ、雷のようにわめき、危うく天関（てんかん）の楼門を揺り倒すほどだった。
    糾察霊官（きゅうさつれいかん）が玉皇に奏上し、その日こそ俺の運の尽き、
    広寒宮は隙間もなく囲まれて、進むも退くもかなわず、逃れる道もなかった。
    ついに神々に捕らえられたが、酒が残っていたので恐れもしなかった。
    霊霄宝殿（れいしょうほうでん）へ引き立てられて玉皇の前に出され、法に照らして死罪と裁かれた。
    ありがたくも太白李金星（たいはくりきんせい）が列を出て、頭を垂れ、自ら口添えしてくれたので、
    刑は改められ、重い鎚打ち二千回。肉は裂け、皮は破れ、骨も折れんばかり。
    命だけは助けられて天関の外へ追われ、福陵山（ふくりょうざん）の麓で家業を営むことにした。
    罪があったばかりに生まれ変わる胎を間違え、俗名を猪剛鬣というのだ。」

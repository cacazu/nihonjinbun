  "source_text": "卻說那怪的火光前走，這大聖的彩霞隨後。正行處，忽見一座高山，那怪把紅光結聚，現了本相，撞入洞內，取出一柄九齒釘鈀來戰。行者喝一聲道：「潑怪！你是那裡來的邪魔？怎麼知道我老孫的名號？你有甚麼本事，實實供來，饒你性命。」那怪道：「是你也不知我的手段，上前來站穩著，我說與你聽。我："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 121
    "line_end": 121
  "translation_ja": |-
    さて、猪剛鬣（ちょごうりょう）の火の光が先を走り、悟空（ごくう）の彩雲がその後を追う。進むうち、ふいに高い山が現れた。猪剛鬣は赤い光を集めて元の姿を現し、洞へ飛び込むと、九歯釘鈀（きゅうしていは）を一本取り出して戦いを挑んだ。悟空は一声叱りつけた。
    悟空「不届きな妖怪め！　お前はどこから来た邪魔だ。なぜ俺の名を知っている。どんな腕があるのか、ありのままに白状すれば命は助けてやる。」
    猪剛鬣「お前こそ、俺の手並みを知らんのだ。こっちへ来て、しっかり立って聞け。俺はな……」
  "translation_status": "reviewed"
- "id": "xy-ch19-003"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    自小生來心性拙，貪閑愛懶無休歇。
    不曾養性與修真，混沌迷心熬日月。
    忽然閑裡遇真仙，就把寒溫坐下說。
    勸我回心莫墮凡，傷生造下無邊孽。
    有朝大限命終時，八難三途悔不喋。
    聽言意轉要修行，聞語心回求妙訣。
    有緣立地拜為師，指示天關並地闕。
    得傳九轉大還丹，工夫晝夜無時輟。
    上至頂門泥丸宮，下至腳板湧泉穴。
    周流腎水入華池，丹田補得溫溫熱。
    嬰兒姹女配陰陽，鉛汞相投分日月。
    離龍坎虎用調和，靈龜吸盡金烏血。
    三花聚頂得歸根，五氣朝元通透徹。
    功圓行滿卻飛昇，天仙對對來迎接。
    朗然足下彩雲生，身輕體健朝金闕。
    玉皇設宴會群仙，各分品級排班列。
    敕封元帥管天河，總督水兵稱憲節。
    只因王母會蟠桃，開宴瑤池邀眾客。
    那時酒醉意昏沉，東倒西歪亂撒潑。
    逞雄撞入廣寒宮，風流仙子來相接。
    見他容貌挾人魂，舊日凡心難得滅。
    全無上下失尊卑，扯住嫦娥要陪歇。
    再三再四不依從，東躲西藏心不悅。
    色膽如天叫似雷，險些震倒天關闕。
    糾察靈官奏玉皇，那日吾當命運拙。
    廣寒圍困不通風，進退無門難得脫。
    卻被諸神拿住我，酒在心頭還不怯。
    押赴靈霄見玉皇，依律問成該處決。
    多虧太白李金星，出班俯顖親言說。
    改刑重責二千鎚，肉綻皮開骨將折。
    放生遭貶出天關，福陵山下圖家業。
    我因有罪錯投胎，俗名喚做豬剛鬣。」

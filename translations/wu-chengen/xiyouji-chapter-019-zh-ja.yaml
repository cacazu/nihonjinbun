  "translation_ja": |-
    悟空は聞くと鉄棒を収めた。
    悟空「馬鹿め、大口をたたくな。俺の頭をここへ差し出してやる。一度突いてみて、魂が消え、気が抜けるか確かめろ。」
    猪剛鬣は本当に熊手を振り上げ、力を込めて打ち下ろした。どんと一発、熊手からは炎のような火花が散ったが、頭の皮は少しも傷つかなかった。猪剛鬣は驚いて手が痺れ、脚から力が抜けた。
    猪剛鬣「たいした頭だ、たいした頭だ！」
    悟空「お前は何も知らんのだ。俺は天宮を騒がせ、仙丹を盗み、蟠桃を盗み、御酒を盗んだために、小聖二郎（しょうせいじろう）に捕まり、斗牛宮（とぎゅうきゅう）の前へ引き立てられた。天の神々が斧で切り、鎚で打ち、刀で斬り、剣で刺し、火で焼き、雷で打っても、毛ほども傷つかなかった。そのうえ太上老君に連れていかれ、八卦炉（はっけろ）へ放り込まれて神火で鍛えられ、火眼金睛（かがんきんせい）に銅の頭、鉄の腕となったのだ。信じないなら、もう何度か突いてみろ。痛いかどうか見てやろう。」
    猪剛鬣「この猿め、お前が天宮を騒がせた時は、東勝神洲（とうしょうしんしゅう）の傲来国（ごうらいこく）、花果山（かかざん）の水簾洞（すいれんどう）に住んでいたはずだ。それから長いこと噂を聞かなかったが、どうしてここへ来て、わざわざ押しかけて俺をいじめるんだ。まさか、うちの舅があそこまで招きに行ったのか。」
    悟空「お前の舅が招きに来たのではない。俺は邪道を改め、道士の道を捨てて仏門に入り、東土（とうど）大唐（だいとう）の帝の御弟（ぎょてい）、三蔵法師（さんぞうほうし）というお方を守って、西天（さいてん）へ仏を拝み、経を求めに行くところだ。高家の荘を通って宿を借りたら、高の爺さんが事情を話して、娘を助け、この糠食らいの間抜けを捕らえてくれと頼んだのさ。」
  "translation_status": "reviewed"
- "id": "xy-ch19-012"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那怪一聞此言，丟了釘鈀，唱個大喏道：「那取經人在那裡？累煩你引見引見。」行者道：「你要見他怎的？」那怪道：「我本是觀世音菩薩勸善，受了他的戒行，這裡持齋把素，教我跟隨那取經人往西天拜佛求經，將功折罪，還得正果。教我等他這幾年，不聞消息。今日既是你與他做了徒弟，何不早說取經之事，只倚兇強，上門打我？」行者道：「你莫詭詐欺心軟我，欲為脫身之計。果然是要保護唐僧，略無虛假，你可朝天發誓，我才帶你去見我師父。」那怪撲的跪下，望空似搗碓的一般，只管磕頭道：「阿彌陀佛，南無佛，我若不是真心實意，還教我犯了天條，劈屍萬段。」行者見他賭咒發願，道：「既然如此，你點把火來燒了你這住處，我方帶你去。」那怪真個搬些蘆葦荊棘，點著一把火，將那雲棧洞燒得像個破瓦窰。對行者道：「我今已無罣礙了，你卻引我去罷。」行者道：「你把釘鈀與我拿著。」那怪就把鈀遞與行者。行者又拔了一根毫毛，吹口仙氣，叫：「變！」即變做一條三股麻繩，走過來，把手背綁剪了。那怪真個倒背著手，憑他怎麼綁縛。卻又揪著耳朵，拉著他，叫：「快走，快走。」那怪道：「輕著些兒，你的手重，揪得我耳根子疼。」行者道：「輕不成，顧你不得。常言道：『善豬惡拿。』只等見了我師父，果有真心，方才放你。」他兩個半雲半霧的，徑轉高家莊來。有詩為證："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 187
    "line_end": 187
  "translation_ja": |-
    猪剛鬣はそれを聞くなり釘鈀を放り出し、深く手を組んで礼をした。
    猪剛鬣「その取経のお方はどこにいる。すまないが、どうか引き合わせてくれ。」
    悟空「会ってどうするつもりだ。」
    猪剛鬣「俺はもともと観世音菩薩（かんぜおんぼさつ）に善の道を勧められ、戒めを受け、ここで精進を守っているのだ。その取経のお方について西天へ仏を拝み、経を求めに行き、功によって罪を償い、正果を得よと教えられた。待つよう言われてこの数年、音沙汰がなかった。お前があの方の弟子になったのなら、なぜ早く取経の話をしないで、ただ力に任せ、押しかけて俺を殴ったんだ。」
    悟空「俺を欺いて気を緩めさせ、逃れる算段をするんじゃないぞ。本当に唐僧（とうそう）を守るつもりで、少しも嘘がないのなら、天に向かって誓え。そうしたら、お師匠さまのところへ連れていってやる。」
    猪剛鬣はどっとひざまずき、空を仰いで、臼をつくように何度も頭を地につけた。
    猪剛鬣「阿弥陀仏（あみだぶつ）、南無仏。もし私に真心がなければ、再び天の法に背いた者として、体を万に切り裂かれてもかまいません。」
    悟空はその誓願を見て言った。
    悟空「それなら、火をつけてこの住まいを焼いてしまえ。そのあとで連れていく。」
    猪剛鬣は本当に葦や茨を運び、火をつけ、雲桟洞を壊れた瓦窯のように焼いてしまった。そして悟空に言った。
    猪剛鬣「これで、もう何も心に引っかからん。さあ連れていってくれ。」
    悟空「釘鈀は俺に預けろ。」
    猪剛鬣はそのまま熊手を渡した。悟空はまた毛を一本抜き、仙気を吹きかけて叫んだ。
    悟空「変われ！」
    たちまち三つ撚りの麻縄に変わったので、そばへ寄り、猪剛鬣の両手を背中へ回して縛った。猪剛鬣は本当に手を後ろへ回し、どのように縛られようと任せていた。そのうえ悟空は耳をつかんで引っ張った。
    悟空「早く歩け、早く歩け！」
    猪剛鬣「もう少し軽くしてくれ。お前は手荒で、耳の付け根が痛い。」
    悟空「軽くはできん。お前に気を遣ってなどいられんさ。『おとなしい豚ほど荒々しく捕らえよ』というだろう。お師匠さまに会い、本当に真心があると分かってから放してやる。」
    二人は半ば雲、半ば霧に乗り、まっすぐ高家荘（こうかそう）へ戻った。これを証する詩がある。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「善豬惡拿」は、おとなしい豚にも強い手段で対処するという諺の形で訳した。「善」を信心の善悪へ狭めない。自宅焼却、武器の引渡し、後ろ手の縛め、耳を引く動作はそれぞれ原文どおり。"
- "id": "xy-ch19-013"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    金性剛強能剋木，心猿降得木龍歸。
    金從木順皆為一，木戀金仁總發揮。
    一主一賓無間隔，三交三合有玄微。
    性情並喜貞元聚，同證西方話不違。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 188
    "line_end": 191
  "translation_ja": |-
    金の性は剛強で木に勝ち、心猿（しんえん）は木龍（もくりゅう）を降して連れ帰る。
    金が従い木も順えば、いずれも一つ。木は金の仁を慕い、すべての働きが現れる。
    一方は主、一方は客、二つに隔たりはなく、三交三合（さんこうさんごう）には奥深い妙がある。
    性と情はともに喜び、貞元（ていげん）が集まり、西方でともに悟る約束も違わぬ。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "金と木、心猿と木龍、主と客、三交三合、性と情、貞元を組み合わせる内丹寓意の詩。金が木を剋する関係と「金從木順」を独自に整合させず保持し、個々の配当を唯一の体系として断定しない。"
- "id": "xy-ch19-014"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "頃刻間到了莊前。行者拑著他的鈀，揪著他的耳道：「你看那廳堂上端坐的是誰？乃吾師也。」那高氏諸親友與老高，忽見行者把那怪背綁揪耳而來，一個個忻然迎到天井中，道聲：「長老，長老，他正是我家的女婿。」那怪走上前，雙膝跪下，背著手，對三藏叩頭，高叫道：「師父，弟子失迎。早知是師父住在我丈人家，我就來拜接，怎麼又受到許多周折？」三藏道：「悟空，你怎麼降得他來拜我？」行者才放了手，拿釘鈀柄兒打著，喝道：「獃子，你說麼。」那怪把菩薩勸善事情，細陳了一遍。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 193
    "line_end": 193
  "translation_ja": |-
    またたく間に荘の前へ着いた。悟空は釘鈀を抱え、猪剛鬣の耳をつかんで言った。
    悟空「見ろ、広間にきちんと座っておられるのは誰だ。あれがお師匠さまだ。」
    高家の親戚や友人たちと高太公は、悟空が猪剛鬣を後ろ手に縛り、耳をつかんで連れてきたのを見ると、一人残らず喜んで中庭へ出迎えた。
    高家の親戚・友人たちと高太公「長老、長老、それこそが、うちの婿です。」
    猪剛鬣は前へ進み、両膝をつき、手は後ろに縛られたまま三蔵へ頭を下げ、大声で言った。
    猪剛鬣「お師匠さま、弟子の私がお迎えもいたしませず。お師匠さまが舅の家へお泊まりと知っていれば、すぐ拝みに参りましたのに。そうすれば、こんなに手間をかけずに済みました。」
    三蔵「悟空、どのようにこの者を降して、私を拝ませるようにしたのだね。」
    悟空はそこで手を放し、釘鈀の柄で猪剛鬣を打ちながら叱った。
    悟空「馬鹿め、お前から話せ。」
    猪剛鬣は、菩薩に善の道を勧められた次第を、残らず詳しく述べた。
  "translation_status": "reviewed"
- "id": "xy-ch19-015"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏大喜，便叫：「高太公，取個香案用用。」老高即忙擡出香案。三藏淨了手焚香，望南禮拜道：「多蒙菩薩聖恩。」那幾個老兒也一齊添香禮拜。拜罷，三藏上廳高坐，教悟空放了他繩。行者才把身抖了一抖，收上身來，其縛自解。那怪從新禮拜三藏，願隨西去。又與行者拜了，以先進者為兄，遂稱行者為師兄。三藏道：「既從吾善果，要做徒弟，我與你起個法名，早晚好呼喚。」他道：「師父，我是菩薩已與我摩頂受戒，起了法名，叫做豬悟能也。」三藏笑道：「好，好。你師兄叫做悟空，你叫做悟能，其實是我法門中的宗派。」悟能道：「師父，我受了菩薩戒行，斷了五葷三厭，在我丈人家持齋把素，更不曾動葷。今日見了師父，我開了齋罷。」三藏道：「不可，不可。你既是不吃五葷三厭，我再與你起個別名，喚為八戒。」那獃子歡歡喜喜道：「謹遵師命。」因此又叫做豬八戒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 194
    "line_end": 194
  "translation_ja": |-
    三蔵はたいへん喜び、声をかけた。
    三蔵「高太公、香卓を一つ貸してください。」
    高太公はすぐに香卓を運び出した。三蔵は手を清め、香を焚き、南を向いて礼拝した。
    三蔵「菩薩の尊いご恩、まことにありがとうございます。」
    老人たちも一斉に香を添えて礼拝した。拝み終えると、三蔵は広間の上座につき、悟空に縄を解くよう命じた。悟空が体を一振りすると、縄はもとの毛となって体に収まり、縛めはおのずから解けた。猪剛鬣は改めて三蔵を礼拝し、西へお供したいと願った。また悟空を拝み、先に入門した者を兄とする決まりから、悟空を兄弟子と呼ぶことになった。
    三蔵「私について善き果を求め、弟子になるのなら、いつでも呼びやすいよう、法名を付けてやろう。」
    猪剛鬣「お師匠さま、私はすでに菩薩に頭を撫でて戒を授けていただき、猪悟能（ちょごのう）という法名を付けていただいております。」
    三蔵は笑った。
    三蔵「よい、よい。兄弟子が悟空、お前が悟能（ごのう）とは、まさしく私たちの法門の宗派に合っている。」
    悟能「お師匠さま、私は菩薩の戒めを受け、五葷三厭（ごくんさんえん）を断ち、舅の家で精進を守って、葷食には一度も手をつけておりません。今日、お師匠さまにお目にかかれましたから、精進を解いてもよいでしょう。」
    三蔵「いけない、いけない。五葷三厭を食べぬというのなら、もう一つ別名を付けて、八戒（はっかい）と呼ぼう。」
    八戒は大喜びで答えた。
    八戒「謹んで、お師匠さまの仰せに従います。」
    こうして、猪八戒（ちょはっかい）とも呼ばれるようになった。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "猪悟能はここで新しく授けられた名ではなく、観音がすでに授けた法名の本人による再確認。その名乗りの完了後のみ悟能へ切り替え、三蔵が八戒を授けた直後の返答から八戒を用いる。五葷三厭と八戒という名の言葉遊びを保持し、一般仏教の八斎戒の項目へ本文を改作しない。"
- "id": "xy-ch19-016"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "高老見這等去邪歸正，更十分喜悅，遂命家僮安排筵宴，酬謝唐僧。八戒上前扯住老高道：「爺，請我拙荊出來拜見公公、伯伯，如何？」行者笑道：「賢弟，你既入了沙門，做了和尚，從今後，再莫題起那『拙荊』的話說。世間只有個火居道士，那裡有個火居的和尚？我們且來敘了坐次，吃頓齋飯，趕早兒往西天走路。」高老兒擺了桌席，請三藏上坐；行者與八戒坐於左右兩傍；諸親下坐。高老把素酒開樽，滿斟一杯，奠了天地，然後奉與三藏。三藏道：「不瞞太公說，貧僧是胎裡素，自幼兒不吃葷。」老高道：「因知老師清素，不曾敢動葷。此酒也是素的，請一杯不妨。」三藏道：「也不敢用酒，酒是我僧家第一戒者。」悟能慌了道：「師父，我自持齋，卻不曾斷酒。」悟空道：「老孫雖量窄，吃不上罈把，卻也不曾斷酒。」三藏道：「既如此，你兄弟們吃些素酒也罷，只是不許醉飲誤事。」遂而他兩個接了頭鍾。各人俱照舊坐下，擺下素齋。說不盡那杯盤之盛，品物之豐。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 195
    "line_end": 195
  "translation_ja": |-
    高太公は、このように邪道を捨てて正道へ帰したのを見ると、ますます喜び、家の者に宴を用意させて三蔵に礼を尽くした。八戒は前へ出て高太公の袖を引いた。
    八戒「お父さん、うちの妻を呼んで、父親代わりのお師匠さまと、兄貴の悟空にご挨拶させてはどうです。」
    悟空は笑った。
    悟空「弟よ、仏門に入って和尚になったからには、今後二度と『うちの妻』などという話をするな。世の中には妻帯して家に住む火居道士（かきょどうし）はいるが、そんな火居の和尚がどこにいる。さあ席順を決め、精進料理を一食いただいて、早々に西天へ出かけよう。」
    高太公は食卓を整え、三蔵を上座へ招き、悟空と八戒をその左右へ座らせ、親戚たちは下座についた。高太公は精進の酒を開け、一杯なみなみと注いで天地に供え、その後で三蔵へ差し出した。
    三蔵「太公、隠し立てなく申しますが、私は母の胎にいる時から精進で、幼いころから葷食をしておりません。」
    高太公「お師匠さまが清い精進を守っておられると存じ、葷のものには手を触れておりません。この酒も精進のものですから、一杯なら差し支えありますまい。」
    三蔵「酒もいただけません。酒は僧の戒めの第一です。」
    八戒は慌てた。
    八戒「お師匠さま、私は精進こそ守っていますが、酒は断っておりません。」
    悟空「私も酒量は狭く、甕ひとつほども飲めませんが、酒を断ったことはありません。」
    三蔵「そういうことなら、お前たち兄弟は精進の酒を少しいただいてもよい。ただし酔って用事を誤ってはいけないよ。」
    そこで二人は最初の杯を受けた。一同は元どおり席につき、精進料理が並んだ。杯や皿の盛大さ、品々の豊かさは、とても語り尽くせない。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "八戒が妻に挨拶させようとする「公公・伯伯」は、それぞれ夫の父に当たる師父三蔵と、夫の兄に当たる師兄行者を親族に見立てた呼称。「舅さま・義兄さま」と訳した。一般的な現代語なので初出辞書注釈は加えない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「酒は僧の戒めの第一」という三蔵の発言と、二人の弟子に少量の飲酒を認める言葉は原文どおり。一般的な戒律の配列へ訂正せず、人物の発話として保持する。"
- "id": "xy-ch19-017"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師徒們宴罷，老高將一紅漆丹盤，拿出二百兩散碎金銀，奉三位長老為途中之費；又將三領綿布褊衫為上蓋之衣。三藏道：「我們是行腳僧，遇莊化飯，逢處求齋，怎敢受金銀財帛？」行者近前，掄開手抓了一把，叫：「高才，昨日累你引我師父，今日招了一個徒弟，無物謝你，把這些碎金碎銀，權作帶領錢，拿了去買草鞋穿。以後但有妖精，多作成我幾個，還有謝你處哩。」高才接了，叩頭謝賞。老高又道：「師父們既不受金銀，望將這粗衣笑納，聊表寸心。」三藏又道：「我出家人，若受了一絲之賄，千劫難修。只是把席上吃不了的餅果，帶些去做乾糧足矣。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 196
    "line_end": 196
  "translation_ja": |-
    師弟が宴を終えると、高太公は朱漆の盆を一つ出し、小粒の金銀二百両を載せ、旅の費用にと三人の長老へ献じた。また、木綿の褊衫（へんさん）を三着、上着として差し出した。
    三蔵「私どもは行脚の僧です。村に着けば飯を乞い、行く先々で精進を求めます。どうして金銀財宝などをいただけましょう。」
    悟空は前へ寄り、大きく手を広げてひとつかみ取ると、呼びかけた。
    悟空「高才（こうさい）、昨日は骨を折ってお師匠さまを案内してくれたな。おかげで今日は弟子が一人増えたが、お前に礼をする品がない。この細かな金銀を、ひとまず案内賃として持っていき、草鞋でも買って履け。今後また妖怪がいたら、俺に何匹か世話してくれ。そうすれば、また礼をしてやるぞ。」
    高才は受け取り、頭を下げて賜り物の礼をした。高太公はまた言った。
    高太公「お師匠さま方、金銀をお受け取りにならぬなら、この粗末な衣だけでもお納めください。せめてもの心のしるしです。」
    三蔵「出家した者が、たとえ糸一筋でも財物を受け取れば、千劫かけても修行は成りません。ただ、食卓で食べきれなかった餅や果物を少し、携帯の食糧にいただければ十分です。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "金銀の額二百両、褊衫三着、行者がその一部を高才へ渡す動作を保持。三蔵の拒絶と行者の振る舞いを独自に整合させない。"
- "id": "xy-ch19-018"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒在傍邊道：「師父、師兄，你們不要便罷，我與他家做了這幾年女婿，就是掛腳糧也該三石哩。──丈人啊，我的直裰，昨晚被師兄扯破了，與我一件青錦袈裟；鞋子綻了，與我一雙好新鞋子。」高老聞言，不敢不與，隨買一雙新鞋，將一領褊衫，換下舊時衣物。那八戒搖搖擺擺，對高老唱個喏道：「上覆丈母、大姨、二姨並姨夫、姑舅諸親：我今日去做和尚了，不及面辭，休怪。丈人啊，你還好生看待我渾家，只怕我們取不成經時，好來還俗，照舊與你做女婿過活。」行者喝道：「夯貨，卻莫胡說。」八戒道：「不是胡說，只恐一時間有些兒差池，卻不是和尚誤了做，老婆誤了娶，兩下裡都耽擱了？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 197
    "line_end": 197
  "translation_ja": |-
    八戒が脇から言った。
    八戒「お師匠さまと兄貴は、いらなければそれで結構です。俺はこの家で何年も婿をしてきたんだから、旅立ちの食糧だけでも三石はもらってよいはずだ。なあ、お父さん、俺の直裰（ちょくたつ）は昨夜、兄貴に引き裂かれてしまった。青い錦の袈裟を一枚ください。靴も破れたから、上等の新しい靴を一足ください。」
    高太公はそう言われては渡さぬわけにもいかず、すぐ新しい靴を一足買い、褊衫を一枚出して、古い衣服と取り替えさせた。八戒は体を揺すりながら、高太公へ手を組んで礼をした。
    八戒「お母さん、上の姉さん、二番目の姉さん、それに義兄さんたちや叔母さん、叔父さん、親戚の皆さんによろしくお伝えください。俺は今日、和尚になりに出かけます。じかにお別れを申せませんが、どうか悪く思わないでください。お父さん、うちの妻を引き続き大事にしてやってください。もし経を取ってこられなかったら、還俗して戻り、これまでどおり婿になって暮らせるようにね。」
    悟空は叱りつけた。
    悟空「間抜けめ、馬鹿なことを言うな！」
    八戒「馬鹿な話じゃない。万一何か行き違いがあったら、和尚になるのもしくじり、妻をめとるのもしくじって、両方ともふいにしてしまうじゃないか。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「掛腳糧」は立ち去る際に受け取る旅立ちの食糧と解した。三石という穀量は現代重量へ換算していない。青錦袈裟を求める発言と、実際に褊衫を与えられる描写の違いも保持した。"
- "id": "xy-ch19-019"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「少題閑話，我們趕早兒去來。」遂此收拾了一擔行李，八戒擔著；背了白馬，三藏騎著；行者肩擔鐵棒，前面引路。一行三眾，辭別高老及眾親友，投西而去。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 199
    "line_end": 199
  "translation_ja": |-
    三蔵「無駄話はそのくらいにして、早く出かけよう。」
    こうして荷物を一荷にまとめ、八戒が担いだ。白馬に鞍を置き、三蔵が乗った。悟空は鉄棒を肩に担ぎ、先に立って道案内をする。一行三人は高太公と親戚、友人たちに別れを告げ、西へと向かった。これを証する詩がある。詩にいう。
  "translation_status": "reviewed"
- "id": "xy-ch19-020"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    滿地煙霞樹色高，唐朝佛子苦勞勞。
    饑餐一缽千家飯，寒著千針一衲袍。
    意馬胸頭休放蕩，心猿乖劣莫教嚎。
    情和性定諸緣合，月滿金華是伐毛。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 201
    "line_end": 204
  "translation_ja": |-
    大地を霞が覆い、木々の緑は高くそびえ、唐朝の仏弟子はひたすら苦労を重ねる。
    飢えれば一つの鉢に千軒の飯を受け、寒ければ千針縫った一枚の衲衣（のうえ）をまとう。
    胸の内の意馬（いば）を勝手に走らせず、いたずらな心猿に吠えさせるな。
    情は和らぎ性は定まって、もろもろの縁が結ばれ、月が金華（きんか）に満ちる時、毛を払い俗身を脱する。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "末句の「月滿金華是伐毛」は内丹・脱胎の象徴として、月が金華に満ち、毛を払って俗身を脱する意に仮訳した。金華の具体的な対応と「伐毛」の語義には解釈上の留保がある。"
- "id": "xy-ch19-021"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三眾進西路途，有個月平穩。行過了烏斯藏界，猛擡頭見一座高山。三藏停鞭勒馬道：「悟空、悟能，前面山高，須索仔細仔細。」八戒道：「沒事。這山喚做浮屠山，山中有一個烏巢禪師，在此修行，老豬也曾會他。」三藏道：「他有些甚麼勾當？」八戒道：「他倒也有些道行。他曾勸我跟他修行，我不曾去罷了。」師徒們說著話，不多時，到了山上。好山！但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 205
    "line_end": 205
  "translation_ja": |-
    三人は西へ進み、ひと月ほどは平穏だった。烏斯蔵（うしぞう）の境を過ぎ、ふと顔を上げると、高い山が見えた。三蔵は鞭を止め、手綱を引いた。
    三蔵「悟空、悟能、前方の山は高い。くれぐれも気をつけなさい。」
    八戒「何でもありません。これは浮屠山（ふとざん）といって、山の中に烏巣禅師（うそうぜんじ）というお方が修行しておいでです。私も会ったことがあります。」
    三蔵「その方は、どのようなことをしておいでなのかね。」
    八戒「なかなかの修行を積んだお方です。以前、一緒に修行せよと私を誘ってくださいましたが、私は行きませんでした。」
    師弟が話しながら進むうち、ほどなく山へ入った。なんとよい山であろう。見れば、こうであった。
  "translation_status": "reviewed"
- "id": "xy-ch19-022"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": "山南有青松碧檜，山北有綠柳紅桃。鬧聒聒，山禽對語；舞翩翩，仙鶴齊飛。香馥馥，諸花千樣色；青冉冉，雜草萬般奇。澗下有滔滔綠水，崖前有朵朵祥雲。真個是景致非常幽雅處，寂然不見往來人。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 207
    "line_end": 207
  "translation_ja": |-
    山の南には青い松と碧の柏槇（びゃくしん）、山の北には緑の柳と紅い桃。
    にぎやかに、山鳥が語り合い、ひらひらと、仙鶴がそろって舞う。
    かぐわしい花々は、千様の色を見せ、青々とした草々は、万種の珍しさを競う。
    谷の下には緑の水が滔々と流れ、崖の前にはめでたい雲が幾重にも浮かぶ。
    まことに並ぶものなき幽雅な景色、静まり返って行き来する人も見えぬ。
  "translation_status": "reviewed"
- "id": "xy-ch19-023"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那師父在馬上遙觀，見香檜樹前有一柴草窩，左邊有麋鹿啣花，右邊有山猴獻果，樹梢頭有青鸞、彩鳳齊鳴，玄鶴、錦雞咸集。八戒指道：「那不是烏巢禪師？」三藏縱馬加鞭，直至樹下。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 209
    "line_end": 209
  "translation_ja": |-
    三蔵が馬上から遠く眺めると、香りよい柏槇の木の前に、柴と草で作った巣が一つあった。左では麋鹿（びろく）が花をくわえ、右では山猿が果物を献じている。梢には青鸞（せいらん）と彩鳳（さいほう）が声をそろえ、黒い鶴と錦鶏（きんけい）も集まっていた。八戒が指さした。
    八戒「あれが烏巣禅師ではありませんか。」
    三蔵は馬に鞭を当て、まっすぐ木の下へ進んだ。
  "translation_status": "reviewed"
- "id": "xy-ch19-024"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那禪師見他三眾前來，即便離了巢穴，跳下樹來。三藏下馬奉拜，那禪師用手攙道：「聖僧請起。失迎，失迎。」八戒道：「老禪師，作揖了。」禪師驚問道：「你是福陵山豬剛鬣，怎麼有此大緣，得與聖僧同行？」八戒道：「前年蒙觀音菩薩勸善，願隨他做個徒弟。」禪師大喜道：「好，好，好！」又指定行者，問道：「此位是誰？」行者笑道：「這老禪怎麼認得他，倒不認得我？」禪師道：「因少識耳。」三藏道：「他是我的大徒弟孫悟空。」禪師陪笑道：「欠禮，欠禮。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 210
    "line_end": 210
  "translation_ja": |-
    烏巣禅師は三人がやって来るのを見ると、すぐに巣を出て木から跳び下りた。三蔵が下馬して礼拝すると、烏巣禅師は手を差し伸べて起こした。
    烏巣禅師「聖僧、どうぞお立ちください。お迎えもいたしませず。」
    八戒「禅師さま、ご挨拶申し上げます。」
    烏巣禅師は驚いて尋ねた。
    烏巣禅師「お前は福陵山の猪剛鬣ではないか。どうしてこれほどのよい縁に恵まれ、聖僧と同行できたのだ。」
    八戒「一昨年、観音菩薩（かんのんぼさつ）に善の道を勧めていただき、こちらのお方に従って弟子になることを願ったのです。」
    烏巣禅師は大いに喜んだ。
    烏巣禅師「よい、よい、よいことだ！」
    そして悟空を指さして尋ねた。
    烏巣禅師「こちらはどなたか。」
    悟空は笑った。
    悟空「この禅師は、どうしてあいつを知っていて、俺を知らんのだ。」
    烏巣禅師「私の見聞が狭いからです。」
    三蔵「私の一番弟子、悟空です。」
    烏巣禅師は笑顔で挨拶した。
    烏巣禅師「ご無礼いたしました。ご無礼いたしました。」
  "translation_status": "reviewed"
- "id": "xy-ch19-025"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏再拜：「請問西天大雷音寺還在那裡？」禪師道：「遠哩，遠哩。只是路多虎豹，難行。」三藏慇懃致意，再問：「路途果有多遠？」禪師道：「路途雖遠，終須有到之日，卻只是魔瘴難消。我有《多心經》一卷，凡五十四句，共計二百七十字。若遇魔瘴之處，但念此經，自無傷害。」三藏拜伏於地懇求，那禪師遂口誦傳之。經云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 212
    "line_end": 212
  "translation_ja": |-
    三蔵は改めて拝んだ。
    三蔵「お尋ねしますが、西天の大雷音寺（だいらいおんじ）は、どこにございますか。」
    烏巣禅師「遠い、遠い。道には虎や豹も多く、進むのは難しいでしょう。」
    三蔵は心を尽くして敬意を示し、重ねて尋ねた。
    三蔵「道のりは、いったいどれほどありますか。」
    烏巣禅師「道は遠くとも、いつか必ず行き着く日はあります。ただ、魔瘴（ましょう）はなかなか除けません。私には『多心経（たしんきょう）』一巻があります。全部で五十四句、合わせて二百七十字。魔瘴のある所へ来たら、この経さえ唱えれば、おのずと害を受けずに済みます。」
    三蔵は地に伏して切に願った。すると烏巣禅師は口ずから唱え、経を授けた。その経にいう。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "経を五十四句・二百七十字とする禅師の説明を保持。保存した漢字数は題名「摩訶般若波羅蜜多心經」十字と経本文二百六十字を合わせて二百七十字である。句数を独自に組み直して本文を変えてはいない。"
- "id": "xy-ch19-026"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "《摩訶般若波羅蜜多心經》：觀自在菩薩，行深般若波羅蜜多，時照見五蘊皆空，度一切苦厄。舍利子，色不異空，空不異色；色即是空，空即是色。受想行識，亦復如是。舍利子，是諸法空相，不生不滅，不垢不淨，不增不減。是故空中無色，無受想行識，無眼耳鼻舌身意，無色聲香味觸法，無眼界，乃至無意識界，無無明，亦無無明盡。乃至無老死，亦無老死盡。無苦寂滅道，無智亦無得。以無所得故，菩提薩埵。依般若波羅蜜多故，心無罣礙；無罣礙故，無有恐怖。遠離顛倒夢想，究竟涅槃。三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。故知般若波羅蜜多是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虛。故說般若波羅蜜多咒，即說咒曰：「揭諦揭諦，波羅揭諦，波羅僧揭諦，菩提薩婆訶！」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 213
    "line_end": 213
  "translation_ja": |-
    『摩訶般若波羅蜜多心経（まかはんにゃはらみったしんぎょう）』
    観自在菩薩（かんじざいぼさつ）が、深い般若波羅蜜多（はんにゃはらみった）を行じていた時、五蘊（ごうん）はすべて空（くう）であると照らし見て、あらゆる苦しみと災いを超えた。
    舎利子（しゃりし）よ、色（しき）は空と異ならず、空は色と異ならない。色はそのまま空であり、空はそのまま色である。受（じゅ）・想（そう）・行（ぎょう）・識（しき）も、また同じである。
    舎利子よ、あらゆるものの空なるありさまは、生まれず滅びず、汚れず清まらず、増えず減らない。それゆえ空の中には色もなく、受・想・行・識もない。眼・耳・鼻・舌・身・意もなく、色・声・香・味・触・法もない。眼界（げんかい）もなく、意識界（いしきかい）に至るまでもない。無明（むみょう）もなく、無明が尽きることもない。さらに老いと死に至るまでもなく、老いと死が尽きることもない。苦・寂・滅・道もなく、智慧もなく、得ることもない。
    得るものがないゆえに、菩提薩埵（ぼだいさった）は般若波羅蜜多に依り、心に妨げがない。妨げがないゆえに恐怖がなく、逆さまの見方や夢想から遠く離れ、究極の涅槃に至る。
    過去・現在・未来の諸仏も、般若波羅蜜多に依って、阿耨多羅三藐三菩提（あのくたらさんみゃくさんぼだい）を得る。それゆえ知るべきである。般若波羅蜜多は、大いなる神妙の呪、大いなる明知の呪、この上ない呪、並ぶもののない呪であり、あらゆる苦を除くことができ、真実であって偽りではない。
    ゆえに般若波羅蜜多の呪を説く。すなわち、その呪にいう。
    「行け、行け、彼岸へ行け、みなともに彼岸へ行け、悟りよ、成就あれ！」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "経文は通行の「無苦集滅道」に当たる箇所が底本では「無苦寂滅道」。原文を改めず、訳も「苦・寂・滅・道」として「寂」を保持した。「寂」を通常の四諦の一つであると確定するものではない。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「時」「以無所得故，菩提薩埵。依般若波羅蜜多故」などの句読は原文欄で保持し、訳では文意がつながるよう日本語の文を組み立てた。仏弟子の舎利子は遺骨を指す舎利子と別人物・別語義である。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "末尾の呪は省略せず、音写原文を意味に即して「行け、行け、彼岸へ行け、みなともに彼岸へ行け、悟りよ、成就あれ」と訳した。原語の文法や呼びかけ方には複数の解釈があり、一つの訳解として扱う。"
- "id": "xy-ch19-027"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此時唐朝法師本有根源，耳聞一遍《多心經》，即能記憶，至今傳世。此乃修真之總經，作佛之會門也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 215
    "line_end": 215
  "translation_ja": "この時、三蔵にはもともと深い仏縁があったので、『多心経』を一度耳にしただけで記憶でき、それが今に伝わっている。これこそ真の道を修めるための総要の経、仏となるための肝要な門なのである。"
  "translation_status": "reviewed"
- "id": "xy-ch19-028"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那禪師傳了經文，踏雲光，要上烏巢而去。被三藏又扯住奉告，定要問個西去的路程端的。那禪師笑云："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 217
    "line_end": 217
  "translation_ja": "烏巣禅師は経文を伝えると、雲の光を踏んで烏巣（うそう）へ上ろうとした。三蔵はまた袖をつかんで願い出、ぜひとも西へ行く道のりを詳しく聞こうとした。烏巣禅師は笑って詠んだ。"
  "translation_status": "reviewed"
- "id": "xy-ch19-029"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    道路不難行，試聽我吩咐。
    千山千水深，多瘴多魔處。
    若遇接天崖，放心休恐怖。
    行來摩耳巖，側著腳蹤步。
    仔細黑松林，妖狐多截路。
    精靈滿國城，魔主盈山住。
    老虎坐琴堂，蒼狼為主簿。
    獅象盡稱王，虎豹皆作御。
    野豬挑擔子，水怪前頭遇。
    多年老石猴，那裡懷嗔怒。
    你問那相識，他知西去路。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 218
    "line_end": 228
  "translation_ja": |-
    烏巣禅師「道は歩み難くない。ひとまず私の言うことを聞きなさい。
    千の山、千の川は深く、瘴気も妖魔も多い所だ。
    接天崖（せってんがい）に出会ったなら、心を安んじ、恐れるな。
    摩耳巌（まじがん）へ来たならば、足を横にして踏み進め。
    黒松林（こくしょうりん）には気をつけよ。妖狐がしばしば道をふさぐ。
    国じゅうの町に妖怪が満ち、山々には魔王があふれる。
    虎が琴堂（きんどう）に座し、青狼が主簿（しゅぼ）となる。
    獅子と象はみな王を名乗り、虎や豹はことごとく宮仕えの役人となる。
    野猪が荷を担い、水の妖怪とはこの先で出会う。
    年経た石の老猿が、そこで腹を立てている。
    その顔見知りに尋ねなさい。彼なら西へ行く道を知っている。」
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "「御」は文脈上、王に仕える者・役人の意と解して「宮仕えの役人」とした。御史・御者など一つの具体的官職へは確定しない。接天崖・摩耳巌・黒松林などの地名や、野猪・水怪・老石猴の暗示を後の回の地名・人名で置き換えない。"
- "id": "xy-ch19-030"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，冷笑道：「我們去，不必問他，問我便了。」三藏還不解其意。那禪師化作金光，徑上烏巢而去。長老往上拜謝，行者心中大怒，舉鐵棒望上亂搗，只見蓮花生萬朵，祥霧護千層。行者縱有攪海翻江力，莫想挽著烏巢一縷籐。三藏見了，扯住行者道：「悟空，這樣一個菩薩，你搗他窩巢怎的？」行者道：「他罵了我兄弟兩個一場去了。」三藏道：「他講的西天路徑，何嘗罵你？」行者道：「你那裡曉得？他說『野豬挑擔子』是罵的八戒；『多年老石猴』是罵的老孫。你怎麼解得此意？」八戒道：「師兄息怒。這禪師也曉得過去未來之事，但看他『水怪前頭遇』這句話，不知驗否？饒他去罷。」行者見蓮花祥霧，近那巢邊，只得請師父上馬，下山往西而去。那一去："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 230
    "line_end": 230
  "translation_ja": |-
    悟空は聞くと冷笑した。
    悟空「俺たちが行くのに、あの人へ尋ねることはない。俺に聞けばよいのさ。」
    三蔵はまだその意味を解さなかった。烏巣禅師は金の光となり、まっすぐ巣へ上った。三蔵は上を仰いで拝み、礼を述べたが、悟空はひどく腹を立て、鉄棒を振り上げて、上へ向かってめったやたらに突き回した。すると蓮の花が万と咲き、めでたい霧が幾千重にも巣を守った。悟空に海をかき回し、川をひっくり返す力があっても、烏巣の蔓一本さえ引き寄せられない。三蔵はそれを見ると、悟空を引き止めた。
    三蔵「悟空、このような菩薩の巣を、どうして突き壊そうとするのだ。」
    悟空「あの人は、私たち兄弟二人をひとしきり罵って行ってしまったのです。」
    三蔵「西天への道筋を説いていたのに、いつお前を罵ったのかね。」
    悟空「お師匠さまには分かりませんか。『野猪が荷を担う』は八戒への悪口、『年経た石の老猿』は私への悪口です。どうしてあの意味がお分かりにならないのです。」
    八戒「兄貴、怒りを鎮めてくれ。この禅師は過去も未来も知っているらしい。ただ『水の妖怪とはこの先で出会う』という一言が、当たるかどうかは分からない。もう勘弁してやろう。」
    悟空は蓮の花とめでたい霧を見て、巣のそばまで寄ったものの、仕方なく師に馬へ乗ってもらい、山を下って西へ進んだ。その旅は、まさにこうである。
  "translation_status": "reviewed"

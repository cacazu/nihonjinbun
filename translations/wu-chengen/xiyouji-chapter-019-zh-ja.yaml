    "message_ja": "天関・地闕、嬰児・姹女、鉛・汞、離龍・坎虎、霊亀・金烏、三花聚頂・五気朝元は道教の内丹的な身体観と象徴。本文の組合せを保持し、実際の動物・人物の交合や金属の服用の指示には置き換えない。細部の部位・配当には留保がある。天関は修練の関門と後半の天界の門を別語義で扱う。"
  - "kind": "uncertain_translation"

- "id": "xy-ch19-004"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言道：「你這廝原來是天蓬水神下界，怪道知我老孫名號。」那怪道聲：「哏！你這誑上的弼馬溫，當年撞那禍時，不知帶累我等多少，今日又來此欺人。不要無禮，吃我一鈀。」行者怎肯容情，舉起棒，當頭就打。他兩個在那半山之中，黑夜裡賭鬥。好殺："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    悟空は聞いて言った。
    悟空「お前はもともと、天蓬水神（てんぽうすいじん）が下界に降りたものだったのか。どうりで俺の名を知っているわけだ。」
    猪剛鬣「ふん！　主君を欺いた弼馬温（ひつばおん）め。昔、お前があの騒ぎを起こしたせいで、俺たちがどれほど巻き添えを食ったことか。それが今日は、ここまで来て人をいじめるのか。無礼をするな、俺の熊手を食らえ！」
    悟空も容赦するはずはなく、棒を振り上げて頭めがけて打ちかかった。二人は山の中腹で、闇夜に勝負を争った。その激しさは、まさにこうである。
  "translation_status": "reviewed"
- "id": "xy-ch19-005"
  "section_id": "chapter-19"
  "kind": "verse"
  "origin": "source"
  "source_text": "行者金睛似閃電，妖魔環眼似銀花。這一個口噴彩霧，那一個氣吐紅霞。氣吐紅霞昏處亮，口噴彩霧夜光華。金箍棒，九齒鈀，兩個英雄實可誇：一個是大聖臨凡世，一個是元帥降天涯。那個因失威儀成怪物，這個幸逃苦難拜僧家。鈀去好似龍伸爪，棒迎渾若鳳穿花。那個道：「你破人親事如殺父！」這個道：「你強姦幼女正該拿！」閑言語，亂喧嘩，往往來來棒架鈀。看看戰到天將曉，那妖精兩膊覺酸麻。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    悟空の金の眼は稲妻のよう、妖魔の丸い眼は銀の花のよう。
    こちらは口から彩りの霧を噴き、あちらは息とともに赤い霞を吐く。
    赤い霞を吐けば暗い所が明るくなり、彩りの霧を噴けば夜に光が照り映える。
    金箍棒（きんこぼう）と九歯鈀（きゅうしは）、二人の豪傑はまことに見事。
    一人は俗世へ降りた大聖（たいせい）、一人は天の果てから落ちた元帥。
    あちらは威儀を失って妖怪となり、こちらは幸い苦難を逃れて僧の弟子となった。
    熊手が突き出されれば竜が爪を伸ばすよう、棒が迎えれば鳳凰（ほうおう）が花をくぐるよう。
    猪剛鬣「人の縁談を壊すのは、父を殺すも同じだ！」
    悟空「若い娘を犯したお前こそ、捕らえて当然だ！」
    余計な口をたたき、騒々しくわめき散らし、行きつ戻りつ棒と熊手が打ち合う。
    やがて夜明け近くまで戦ううち、妖怪の両腕はだるく痺れてきた。
  "translation_status": "reviewed"
  "issues":
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "戦闘詩中の行者の「強姦幼女」は相手への告発の言葉として訳し、若い娘を犯したという内容を弱めない。「幼女」はこの場面では若い娘とし、前回の翠蘭の年齢二十歳を変更しない。後の「娘を傷つけたこともない」という行者の発言と独自に整合させない。"
- "id": "xy-ch19-006"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "他兩個自二更時分，直戰到東方發白。那怪不能迎敵，敗陣而逃，依然又化狂風，徑回洞裡，把門緊閉，再不出頭。行者在這洞門外看有一座石碣，上書雲棧洞三字。見那怪不出，天又大明，心卻思量：「恐師父等候，且回去見他一見，再來捉此怪不遲。」隨踏雲點一點，早到高老莊。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 158
    "line_end": 158
  "translation_ja": |-
    二人は二更（にこう）のころから、東の空が白むまで戦い続けた。猪剛鬣は攻撃を受けきれず、敗れて逃げ、また荒れ狂う風に姿を変えると、まっすぐ洞へ戻った。門を固く閉め、二度と顔を出さない。悟空が洞の門の外を見ると、石碑が一つあり、「雲桟洞（うんさんどう）」の三字が刻まれていた。猪剛鬣は出てこず、空もすっかり明るくなったので、悟空は心に思った。
    悟空「お師匠さまがお待ちだろう。ひとまずお顔を見に戻ってから、また捕らえに来ても遅くはない。」
    雲をひと踏みすると、もう高老荘（こうろうそう）へ着いていた。
  "translation_status": "reviewed"
- "id": "xy-ch19-007"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏與那諸老談今論古，一夜無眠。正想行者不來，只見天井裡忽然站下行者。行者收藏鐵棒，整衣上廳。叫道：「師父，我來了。」慌得那諸老一齊下拜，謝道：「多勞，多勞。」三藏問道：「悟空，你去這一夜，拿得妖精在那裡？」行者道：「師父，那妖不是凡間的邪祟，也不是山間的怪獸。他本是天蓬元帥臨凡，只因錯投了胎，嘴臉像一個野豬模樣，其實性靈尚存。他說以相為姓，喚名豬剛鬣。是老孫從後宅裡掣棒就打，他化一陣狂風走了。被老孫著風一棒，他就化道火光，徑轉他那本山洞裡，取出一柄九齒釘鈀，與老孫戰了一夜。適才天色將明，他怯戰而走，把洞門緊閉不出。老孫還要打開那門，與他見個好歹，恐師父在此疑慮盼望，故先來回個信息。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    さて、三蔵（さんぞう）は老人たちと今昔の話を交わし、一晩中眠らずにいた。悟空がまだ戻らぬと思っていると、突然、中庭へ悟空が降り立った。悟空は鉄棒をしまい、衣服を整えて広間へ上がると、声をかけた。
    悟空「お師匠さま、戻りました。」
    老人たちは慌てて一斉にひざまずき、礼を述べた。
    老人たち「お骨折りをいただきました。まことに、お骨折りを。」
    三蔵「悟空、一晩出かけていたが、捕らえた妖怪はどこにいるのだね。」
    悟空「お師匠さま、あれは俗世の邪鬼でもなければ、山の怪獣でもありません。もとは天蓬元帥（てんぽうげんすい）が下界へ降りたもので、生まれ変わる胎を間違えたため、顔こそ野猪のようですが、霊性はまだ残っています。姿にちなんで姓を付け、猪剛鬣と名乗っておりました。私が奥の屋敷で棒を抜いて打ちかかると、あいつはひとしきりの狂風となって逃げました。私が風めがけて一撃すると、今度は火の光となって自分の山の洞へ戻り、九歯釘鈀を取り出し、私と一晩中戦ったのです。さきほど夜が明けかけると、戦いを恐れて逃げ帰り、洞の門を固く閉めたまま出てきません。私は門を打ち開けて勝負をつけるつもりでしたが、お師匠さまがこちらで案じてお待ちかと思い、まず様子をお知らせに戻りました。」
  "translation_status": "reviewed"
- "id": "xy-ch19-008"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說罷，那老高上前跪下道：「長老，沒及奈何，你雖趕得去了，他等你去後復來，卻怎區處？索性累你與我拿住，除了根，才無後患。我老夫不敢怠慢，自有重謝：將這家財田地，憑眾親友寫立文書，與長老平分。只是要剪草除根，莫教壞了我高門清德。」行者笑道：「你這老兒不知分限。那怪也曾對我說，他雖是食腸大，吃了你家些茶飯，也與你幹了許多好事，這幾年掙了許多家貲，皆是他之力量。他不曾白吃了你東西，問你祛他怎的？據他說，他是一個天神下界，替你巴家做活，又未曾害了你家女兒。想這等一個女婿，也門當戶對，不怎麼壞了家聲，辱了行止，當真的留他也罷。」老高道：「長老，雖是不傷風化，但名聲不甚好聽，動不動著人就說：『高家招了一個妖怪女婿。』這句話兒教人怎當？」三藏道：「悟空，你既是與他做了一場，一發與他做個結局，才見始終。」行者道：「我才試他一試耍子。此去一定拿來與你們看，且莫憂愁。」叫：「老高，你還好生管待我師父，我去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    話が終わると、高太公（こうたいこう）が前へ出てひざまずいた。
    高太公「長老、それではどうにもなりません。追い払ってくださっても、あなたがお発ちになった後で戻ってきたら、どうすればよいのでしょう。どうか最後までお骨折りいただいて捕らえ、根を絶ってこそ、後の患いもなくなります。決してお礼をおろそかにはいたしません。この財産と田畑を、親戚や友人たちを証人に証文へ書き記し、長老と半分ずつに分けましょう。ただ、草を刈るなら根まで絶ち、わが高家の清らかな家風を損なわせないでください。」
    悟空は笑った。
    悟空「爺さん、あんたは分別がないな。あの妖怪も俺に言っていたぞ。大食いであんたの家の飯をいくらか食ったにせよ、その代わり、ずいぶんよく働いたとな。この数年で増えた財産は、みんなあいつの働きだというじゃないか。ただ飯を食っていたのではないのに、なぜ追い出そうとするんだ。あいつの話では、下界へ降りた天の神が、あんたの家計を助けて働き、娘を傷つけたこともないという。こんな婿なら家柄も釣り合って、家名を汚したり品行を辱めたりすることもなさそうだ。いっそ本当に置いてやってもよかろう。」
    高太公「長老、風紀を傷つけぬにしても、世間の聞こえがよくありません。何かにつけて人が『高家は妖怪を婿に取った』と言うのです。その言葉に、どうして耐えられましょう。」
    三蔵「悟空、いったん引き受けたのだから、最後まで片をつけてあげなさい。それでこそ筋が通る。」
    悟空「さっきは、ちょいと試してからかっただけです。今度は必ず捕らえて、皆さんにお見せしましょう。もう気を揉むことはありません。」
    そして声をかけた。
    悟空「高の爺さん、引き続き、お師匠さまをしっかりもてなしてくれ。俺は行くぞ。」
  "translation_status": "reviewed"
- "id": "xy-ch19-009"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說聲去，就無形無影的，跳到他那山上，來到洞口，一頓鐵棍，把兩扇門打得粉碎。口裡罵道：「那饢糠的夯貨，快出來與老孫打麼。」那怪正喘噓噓的睡在洞內，聽見打得門響，又聽見罵饢糠的夯貨，他卻惱怒難禁，只得拖著鈀，抖擻精神，跑將出來，厲聲罵道：「你這個弼馬溫，著實憊懶。與你有甚相干，你把我大門打破？你且去看看律條，打進大門而入，該個雜犯死罪哩。」行者笑道：「這個獃子！我就打了大門，還有個辨處。像你強占人家女子，又沒個三媒六證，又無些茶紅酒禮，該問個真犯斬罪哩。」那怪道：「且休閑講，看老豬這鈀。」行者使棒支住道：「你這鈀可是與高老家做長工築地種菜的？有何好處怕你？」那怪道：「你錯認了，這鈀豈是凡間之物？你且聽我道來："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第019回&oldid=1455568"
    "line_start": 161
    "line_end": 161
  "translation_ja": |-
    行くと言うや、姿も影も消え失せ、あの山へ跳び着いた。洞の入口に来ると、鉄棒でひとしきり殴りつけ、二枚の門扉を粉々に砕いた。口では罵った。
    悟空「糠を食らう間抜けめ、さっさと出てきて俺と戦え！」
    猪剛鬣は洞の中で息を切らしながら寝ていたが、門を打ち砕く音を聞き、さらに糠食らいの間抜けという罵声を聞くと、怒りを抑えられなくなった。仕方なく熊手を引きずり、気力を振り起こして駆け出し、大声で罵った。
    猪剛鬣「この弼馬温め、本当にたちの悪い奴だ！　お前に何の関係があって、俺の大門を壊すんだ。法の条文を見てみろ。大門を打ち破って押し入れば、雑犯（ざっぱん）の死罪に当たるぞ。」
    悟空は笑った。
    悟空「馬鹿め！　俺が門を打ち壊したとしても、まだ言い開きは立つ。お前のように、三媒六証（さんばいろくしょう）もなければ茶や結納の金、祝いの酒もなく、よその娘を無理に占め取った奴は、真犯（しんぱん）の斬罪に問われるんだ。」
    猪剛鬣「無駄口はもうやめろ。俺の熊手を見ろ！」
    悟空は棒で受け止めた。
    悟空「この熊手は、高家で年雇いをして、土をならしたり野菜を植えたりする道具じゃないのか。どこが立派で、俺が怖がらなきゃならん。」
    猪剛鬣「見当違いだ。これが俗世の道具であるものか。よく聞け……」

    "message_ja": "底本の「神冰鐵」を神氷鉄、「熒\U000243D8」を熒\U000243D8のまま保持した。後者は熒惑、すなわち火星の神と解されるが、字形を一般表記へ黙って直さない。上宝沁金鈀は九歯釘鈀と同じ武器の正式名。"
  - "kind": "uncertain_translation"
    "status": "open"
    "message_ja": "六曜・五星・四時・八節・六爻・八卦の列挙を保持。六曜の具体的な星の内訳は確定できず、日本の六曜暦注へ同定しない。五方五帝は五方に配される神々であり、中国古代の人間の帝王五人と混同しない。"
- "id": "xy-ch19-011"
  "section_id": "chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者聞言，收了鐵棒道：「獃子不要說嘴，老孫把這頭伸在那裡，你且築一下兒，看可能魂消氣泄？」那怪真個舉起鈀，著氣力築將來，撲的一下，鑽起鈀的火光焰焰，更不曾築動一些兒頭皮。諕得他手麻腳軟，道聲：「好頭！好頭！」行者道：「你是也不知。老孫因為鬧天宮，偷了仙丹，盜了蟠桃，竊了御酒，被小聖二郎擒住，押在斗牛宮前，眾天神把老孫斧剁鎚敲，刀砍劍刺，火燒雷打，也不曾損動分毫。又被那太上老君拿了我去，放在八卦爐中，將神火鍛煉，煉做個火眼金睛，銅頭鐵臂。不信，你再築幾下，看看疼與不疼？」那怪道：「你這猴子，我記得你鬧天宮時，家住在東勝神洲傲來國花果山水簾洞裡，到如今久不聞名，你怎麼來到這裡，上門子欺我？莫敢是我丈人去那裡請你來的？」行者道：「你丈人不曾去請我。因是老孫改邪歸正，棄道從僧，保護一個東土大唐駕下御弟，叫做三藏法師，往西天拜佛求經，路過高莊借宿，那高老兒因話說起，就請我救他女兒，拿你這饢糠的夯貨。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch19-1455568"

      第七十五回
      心の猿は陰陽の器を穿ち抜き、魔の主〔「王」とする異文もある〕は大道の真へ帰る
    "translation_status": "reviewed"
  - "id": "xy-ch75-002"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說孫大聖進於洞口，兩邊觀看。只見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 122
        "line_end": 122
    "translation_ja": "さて、悟空（ごくう）は洞の入口へ入り、左右を見回した。すると、そこにはこんな光景があった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-003"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": "骷髏若嶺，骸骨如林。人頭髮屣成氈片，人皮肉爛作泥塵。人筋纏在樹上，乾焦晃亮如銀。真個是尸山血海，果然腥臭難聞。東邊小妖，將活人拿了剮肉；西下潑魔，把人肉鮮煮鮮烹。若非美猴王如此英雄膽，第二個凡夫也進不得他門。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      されこうべは山なみのよう、白骨は林のよう。
      人の髪は踏み固められて毛氈（もうせん）の塊となり、人の皮や肉は腐って泥や塵となる。
      人の筋は木に巻きつき、干からびて銀のようにぎらついている。
      まさしく屍の山に血の海、鼻をつく生臭さは耐え難い。
      東の小妖は生きた人をつかまえ、その肉を削ぎ落とし、
      西の荒くれの魔物は、人肉を新鮮なうちに煮たり炊いたりする。
      美猴王（びこうおう）ほどの英雄の胆力がなくては、ほかの凡人などこの門にすら入れまい。
    "translation_status": "reviewed"
  - "id": "xy-ch75-004"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不多時，行入二層門裡看時，呀！這裡卻比外面不同：清奇幽雅，秀麗寬平；左右有瑤草仙花，前後有喬松翠竹。又行七八里遠近，才到三層門。閃著身，偷著眼看處，那上面高坐三個老妖，十分獰惡。中間的那個生得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 126
        "line_end": 126
    "translation_ja": "やがて二つ目の門をくぐって見ると、おや、ここは外とはまるで違っていた。清らかで奥ゆかしく、美しく広々と平らで、左右には瑤草（ようそう）や仙花、前後には高い松や青竹がある。さらに七、八里（り）ほど進んで、ようやく三つ目の門に着いた。身を隠してそっとのぞくと、奥の高座に三人の年老いた妖怪が座っており、どれもひどく獰猛な姿をしている。中央の者は、こんな様子だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-005"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": "鑿牙鋸齒，圓頭方面。聲吼若雷，眼光如電。仰鼻朝天，赤眉飄焰。但行處，百獸心慌；若坐下，群魔膽戰。這一個是獸中王青毛獅子怪。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      牙は鑿、歯は鋸、丸い頭に四角い顔。
      咆哮は雷のよう、眼光は稲妻のよう。
      上向きの鼻は天を仰ぎ、赤い眉は炎のようにひるがえる。
      ひとたび歩けば百獣は怯え、座れば群れなす魔物も震える。
      これこそ獣の王、青毛獅子怪（せいもうししかい）であった。
    "translation_status": "reviewed"
  - "id": "xy-ch75-006"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "左手下那個生得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 130
        "line_end": 130
    "translation_ja": "その左の下座にいる者は、こんな様子だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-007"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": "鳳目金睛，黃牙粗腿。長鼻銀毛，看頭似尾。圓額皺眉，身軀磊磊。細聲如窈窕佳人，玉面似牛頭惡鬼。這一個是藏齒修身多年的黃牙老象。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      鳳凰のような目に金の瞳、黄色い牙に太い脚。
      長い鼻に銀色の毛、頭のほうが尾にも見える。
      丸い額に眉間の皺、体は大きく盛り上がる。
      細い声はたおやかな美女のよう、玉の顔は牛頭（ごず）の悪鬼のよう。
      これは牙を隠し、長年身を修めてきた黄牙老象（こうがろうぞう）であった。
    "translation_status": "reviewed"
  - "id": "xy-ch75-008"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "右手下那一個生得："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 134
        "line_end": 134
    "translation_ja": "右の下座の者は、こんな様子だった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-009"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": "金翅鯤頭，星睛豹眼。振北圖南，剛強勇敢。變生翱翔，鷃笑龍慘。摶風翮百鳥藏頭，舒利爪諸禽喪膽。這個是雲程九萬的大鵬鵰。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      金の翼に鯤（こん）の頭、星のような瞳に豹の目。
      北から飛び立って南を目指し、剛健にして勇敢。
      姿を変えて大空を翔け、小鳥は笑い、竜はおののく。
      風を打つ翼に百鳥は頭を隠し、鋭い爪を伸ばせばあらゆる鳥が肝をつぶす。
      これこそ雲路九万里を飛ぶ大鵬鵰（たいほうちょう）、かの雲程万里鵬（うんていばんりほう）であった。
    "translation_status": "reviewed"
  - "id": "xy-ch75-010"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那兩下列著有百十大小頭目，一個個全裝披掛，介冑整齊，威風凜凜，殺氣騰騰。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 138
        "line_end": 138
    "translation_ja": "左右には百人ほどの大小の頭目が並び、誰もが武装を整え、鎧と兜をきちんと着けている。威風堂々として、殺気がみなぎっていた。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-011"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見了，心中歡喜，一些兒不怕，大踏步徑直進門，把梆鈴卸下，朝上叫聲：「大王。」三個老魔笑呵呵問道：「小鑽風，你來了？」行者應聲道：「來了。」「你去巡山，打聽孫行者的下落何如？」行者道：「大王在上，我也不敢說起。」老魔道：「怎麼不敢說？」行者道：「我奉大王命，敲著梆鈴，正然走處，猛擡頭，只看見一個人，蹲在那裡磨杠子，還像個開路神，若站將起來，足有十數丈長短。他就著那澗崖石上，抄一把水，磨一磨，口裡又念一聲，說他那杠子到此還不曾顯個神通，他要磨明，就來打大王。我因此知他是孫行者，特來報知。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 139
        "line_end": 139
    "translation_ja": |-
      悟空はそれを見て内心喜び、少しも恐れず、大股でまっすぐ門を入った。拍子木と鈴を外し、高座へ呼びかけた。
      悟空「大王。」
      三人の大王はにこにこして尋ねた。「小鑽風（しょうさんぷう）、来たか。」
      悟空「参りました。」
      三人の大王「山を見回って、孫行者（そんぎょうじゃ）の居所は聞き出せたか。」
      悟空「大王さまの前ですが、とても申し上げる勇気がございません。」
      青毛獅子怪「どうして言えぬのだ。」
      悟空「大王のお言いつけで拍子木と鈴を鳴らしながら歩いておりましたところ、ふと顔を上げると、何者かがしゃがんで棒を磨いでいるのが見えました。まるで開路神（かいろしん）で、立ち上がれば優に十数丈（じょう）はありそうです。谷川の崖の石で、水を一すくいしては磨ぎ、磨いでは何やらつぶやいておりました。その棒はここへ来てまだ神通力を見せていないから、ぴかぴかに磨いでから大王を殴りに来ると申すのです。それで孫行者だと分かり、わざわざお知らせに参りました。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-012"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老魔聞此言，渾身是汗，諕得戰呵呵的道：「兄弟，我說莫惹唐僧。他徒弟神通廣大，預先作了準備，磨棍打我們，卻怎生是好？」教：「小的們，把洞外大小俱叫進來，關了門，讓他過去罷。」那頭目中有知道的報：「大王，門外小妖已都散了。」老魔道：「怎麼都散了？想是聞得風聲不好也。快早關門，快早關門。」眾妖乒乓把前後門盡皆牢拴緊閉。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      これを聞いた青毛獅子怪は全身に汗をかき、恐ろしさにぶるぶる震えながら言った。
      青毛獅子怪「弟たちよ、だから唐僧（とうそう）には手を出すなと言ったのだ。あの弟子は途方もない神通力を持っておる。先に用意して、わしらを殴る棒を磨いでいるとは、どうしたらよいのだ。」
      さらに青毛獅子怪は命じた。「お前たち、洞の外にいる大小の者をみな呼び入れろ。門を閉めて、あいつらを通してやろう。」
      事情を知る頭目が報告した。「大王、門の外の小妖は、もうみな散っております。」
      青毛獅子怪「どうしてみな散ったのだ。どうやら、よくない噂を聞きつけたのだろう。早く門を閉めろ、早く門を閉めろ。」
      妖怪たちはばたんばたんと前後の門をすべて固く閉じ、しっかり閂を掛けた。
    "translation_status": "reviewed"
  - "id": "xy-ch75-013"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者自心驚道：「這一關了門，他再問我家長裡短的事，我對不來，卻不弄走了風，被他拿住？且再諕他一諕，教他開著門，好跑。」又上前道：「大王，他還說得不好。」老魔道：「他又說甚麼？」行者道：「他說拿大大王剝皮，二大王剮骨，三大王抽筋。你們若關了門，不出去啊，他會變化，一時變了個蒼蠅兒，自門縫裡飛進，把我們都拿出去，卻怎生是好？」老魔道：「兄弟們仔細。我這洞裡，遞年家沒個蒼蠅，但是有蒼蠅進來，就是孫行者。」行者暗笑道：「就變個蒼蠅諕他一諕，好開門。」大聖閃在傍邊，伸手去腦後拔了一根毫毛，吹一口仙氣，叫：「變！」即變做一個金蒼蠅，飛去望老魔劈臉撞了一頭。那老怪慌了道：「兄弟，不停當，那話兒進門來了。」驚得那大小群妖，一個個丫鈀掃帚，都上前亂撲蒼蠅。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空は心の中でぎくりとした。
      悟空「門を閉められたうえに、身の回りの細かなことを尋ねられたら、答えられずにぼろが出て、つかまってしまうじゃないか。もう一度脅して、逃げやすいよう門を開けさせよう。」
      再び進み出て、悟空は言った。「大王、あいつはもっとひどいことも申しておりました。」
      青毛獅子怪「ほかに何を言った。」
      悟空「一の大王は皮を剝ぎ、二の大王は骨を削り、三の大王は筋を引き抜くと申しました。あなた方が門を閉めて外へお出にならなくても、あいつは変化ができます。さっと蠅に変わって戸の隙間から飛び込み、私どもをみなつかまえて外へ連れ出したら、どうすればよいのでしょう。」
      青毛獅子怪「弟たち、気をつけろ。この洞には、毎年、蠅など一匹もおらぬ。蠅が入ってきたら、それが孫行者だ。」
      悟空はひそかに笑って思った。「それなら蠅を一匹作って脅せば、門を開けるだろう。」
      悟空は脇へ身を隠し、後頭部から毛を一本抜いた。仙気を吹きかけて、悟空は叫んだ。「変われ！」
      毛はたちまち金色の蠅となり、青毛獅子怪の顔へまっすぐ飛んでいって、こつんとぶつかった。
      青毛獅子怪は慌てて言った。「弟よ、まずいぞ、あいつが入ってきた。」
      大小の妖怪は驚き、誰もが熊手や箒を持って進み出て、むやみやたらと蠅を叩き始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch75-014"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖忍不住，赥赥的笑出聲來。乾淨他不宜笑，這一笑笑出原嘴臉來了。卻被那第三個老妖魔跳上前，一把扯住道：「哥哥，險些兒被他瞞了。」老魔道：「賢弟，誰瞞誰？」三怪道：「剛才這個回話的小妖不是小鑽風，他就是孫行者。必定撞見小鑽風，不知是他怎麼打殺了，卻變化來哄我們哩。」行者慌了道：「他認得我了。」即把手摸摸，對老怪道：「我怎麼是孫行者？我是小鑽風，大王錯認了。」老魔笑道：「兄弟，他是小鑽風。他一日三次在面前點卯，我認得他。」又問：「你有牌兒麼？」行者道：「有。」擄著衣服，就拿出牌子。老怪一發認實道：「兄弟，莫屈了他。」三怪道：「哥哥，你不曾看見他？他才子閃著身笑了一聲，我見他就露出個雷公嘴來。見我扯住時，他又變作個這等模樣。」叫：「小的們，拿繩來。」眾頭目即取繩索。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      悟空はこらえきれず、ひっひっと声を出して笑った。そもそも笑ってはいけなかったのだ。笑った拍子に、本来の顔つきが出てしまった。すると第三の大王、雲程万里鵬が跳び出し、悟空をひっつかんで言った。
      雲程万里鵬「兄者、危うくこいつにだまされるところだった。」
      青毛獅子怪「弟よ、誰が誰をだましたのだ。」
      雲程万里鵬「今ここで返事をしていた小妖は小鑽風ではない。孫行者だ。きっと小鑽風に出くわし、どうやったか知らぬが殺して、その姿に化けて俺たちをだましに来たのだ。」
      悟空は慌てて思った。「見破られたぞ。」
      すぐ手で顔をなでてから、悟空は青毛獅子怪に言った。「どうして私が孫行者なのでしょう。私は小鑽風です。大王、見間違いでございます。」
      青毛獅子怪は笑った。「弟よ、こいつは小鑽風だ。一日に三度、わしの前で点呼に出るから、見覚えがある。」
      さらに青毛獅子怪は尋ねた。「お前、札は持っているか。」
      悟空「持っております。」
      服をたくし上げて、札を取り出した。青毛獅子怪はいっそう確信して言った。
      青毛獅子怪「弟よ、無実の者を責めるな。」
      雲程万里鵬「兄者は見なかったのか。さっきこいつが脇へ身を隠して笑ったとき、雷公（らいこう）のような口が現れたのを見たのだ。俺につかまれたと気づいて、またこの姿に化けたのだ。」
      雲程万里鵬は命じた。「お前たち、縄を持ってこい。」
      頭目たちはすぐに縄を取ってきた。
    "translation_status": "reviewed"
  - "id": "xy-ch75-015"
    "section_id": "chapter-75"
    "kind": "paragraph"

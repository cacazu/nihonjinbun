  "known_gaps":
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-001"
      "description_ja": "底本の回題は『魔主一作「王」還歸大道真』。主の字を王とする異文注も本文に残した。回題の予告であって、本文の結末を編集者が補ったものではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-003"
      "description_ja": "原文は『屣成氈片』。屣の働きには解釈の余地があるが、踏みつけられた人の髪が毛氈のようになると読んだ。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-007"
      "description_ja": "原文は『藏齒修身多年』。牙を隠すという字面を保持した。隠す理由や修練の具体的な方法は、本文からは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-011"
      "description_ja": "原文は三人の大王が小鑽風に呼びかけた後、話者を再記せずこの問いを続ける。訳では前の三人の問いを受けるものとした。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-015"
      "description_ja": "人への変化では頭と顔しか変わらないという説明を、原文どおり残した。他の場面の変身描写との整合を取るために、制約を弱めたり説明を足したりはしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-016"
      "description_ja": "この台詞の話者は直前からの第一の大王として訳した。前回では瓶は第三の大王の宝として説明されているが、『我寶瓶』という今回の発言を別の所有関係へ修正してはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-017"
      "description_ja": "原語『孤拐』には頬の骨や足のくるぶしを指す語義がある。ここは焼けて足が不自由になる懸念と結び付くため、くるぶしと訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-020"
      "description_ja": "原文は『才變化出身』。出ようと思っただけの未遂へ弱めず、身を抜け出させる変化を行った表現として訳した。動作の順序を読みやすく組み替える補訂はしていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-021"
      "description_ja": "原語は『勉強的小妖』。力を出す、無理をする、気を奮い立たせるなどの読みがあり、ここでは思い切って行動する小妖とした。格別の怪力を持つという設定までは足していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-021"
      "description_ja": "原文の対句は『空者控也』『颼者走也』。似た音と意味をもじり、瓶が空だという声へ、すっかり逃げたとの言葉を返す。日本語では『空っぽ・ぽっかり』『すっ飛んで・すたこら』と調子を対応させた。原字を別の異文に置き換えてはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-027"
      "description_ja": "原文は『腰束龍絛有見機』。後半は解釈の定めにくい表現で、機を見て手際よくするという意味に取った。帯に未知の機械や特別な機能が備わるとは解していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-030"
      "description_ja": "底本は四斗であり、五斗へ改めていない。四方の斗に関わる星神と読めるが、構成する個々の神名はここで列挙されない。旧来の五斗星君と同じ集合だとは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-030"
      "description_ja": "原語は『扢搭板筋鋪』。ごつごつした筋が周囲に敷かれるという字面を採った。身体の特定の解剖学的組織まで確定する表現ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-036"
      "description_ja": "底本の表記を保持した。太歳の剣として比較に挙げられるが、名の由来や他の剣名との異同は確認できていない。別字の剣名へ推測で改めなかった。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-042"
      "description_ja": "原文は『我就不曾吩咐你』。この言い回しには反語的に読む余地もあるが、ここでは文字どおり、まだ言い聞かせていなかったという言い方に取った。すでにこの忠告をした出来事を創作してはいない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch75-2093000"
      "segment_ids":
        - "xy-ch75-043"
      "description_ja": "原文の『廣裡』は、教育部の辞書がこの箇所を例に広州の意とする。語義に沿って訳したが、広州を実際に通った旅程が別に確認できたという意味ではない。これは腹の中から脅す悟空の発言である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "moe-hutou-ch75-independent-review"
      "segment_ids":
        - "xy-ch75-040"
      "reference_ids":
        - "xy-ch75-ref-20"
      "description_ja": "底本は虎頭性子、教育部辞書の同場面の引用は嘑頭性子。後続の無鉄砲さの説明と辞書語義を照合して訳したが、原文の字形は校訂していない。"

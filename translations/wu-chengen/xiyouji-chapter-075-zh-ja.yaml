        "line_start": 162
        "line_end": 162
    "translation_ja": "悟空と八戒が門の脇から見ると、まことにすさまじい妖怪である。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-027"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      鐵額銅頭戴寶盔，盔纓飄舞甚光輝。
      輝輝掣電雙睛亮，亮亮鋪霞兩鬢飛。
      勾爪如銀尖且利，鋸牙似鑿密還齊。
      身披金甲無絲縫，腰束龍絛有見機。
      手執鋼刀明晃晃，英雄威武世間稀。
      一聲吆喝如雷震，問道「敲門者是誰」？
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 164
        "line_end": 169
    "translation_ja": |-
      鉄の額と銅の頭に宝の兜を戴き、兜の房はひるがえって光り輝く。
      きらきらと稲妻を放つ両目は明るく、明るく霞を敷いたような両鬢はなびく。
      鉤爪は銀のように尖って鋭く、鋸歯は鑿のように密に並ぶ。
      身には隙間一つない金の鎧、腰には竜の組紐を手際よく締め、
      手に握る鋼の刀はぎらぎらと、その勇ましさは世にもまれ。
      一声、雷のように怒鳴り、青毛獅子怪は問う。「門を叩くのは誰だ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-028"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖轉身道：「是你孫老爺齊天大聖也。」老魔笑道：「你是孫行者？大膽潑猴，我不惹你，你卻為何在此叫戰？」行者道：「『有風方起浪，無潮水自平。』你不惹我，我好尋你？只因你狐群狗黨，結為一夥，算計吃我師父，所以來此施為。」老魔道：「你這等雄糾糾的嚷上我門，莫不是要打麼？」行者道：「正是。」老魔道：「你休猖獗。我若調出妖兵，擺開陣勢，搖旗擂鼓，與你交戰，顯得我是坐家虎，欺負你了。我只與你一個對一個，不許幫丁。」行者聞言，叫：「豬八戒走過，看他把老孫怎的？」那獃子真個閃在一邊。老魔道：「你過來，先與我做個樁兒，讓我盡力氣著光頭砍上三刀，就讓你唐僧過去；假若禁不得，快送你唐僧來，與我做一頓下飯。」行者聞言笑道：「妖怪，你洞裡若有紙筆，取出來，與你立個合同。自今日起，就砍到明年，我也不與你當真。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 170
        "line_end": 170
    "translation_ja": |-
      悟空は振り向いて言った。「貴様の孫老爺（そんろうや）、斉天大聖（せいてんたいせい）さまだ。」
      青毛獅子怪は笑った。「お前が孫行者か。大胆な猿め。わしはお前に手を出しておらぬのに、なぜここで戦いを挑む。」
      悟空「『風があってこそ波が立ち、潮がなければ水はおのずと静かだ』。お前が手を出さなければ、俺が好きこのんで訪ねるものか。お前たち狐や犬の仲間が一味になり、俺の師匠を食う算段をしているから、懲らしめに来たんだ。」
      青毛獅子怪「そう勇ましくわしの門前へ怒鳴り込んでくるとは、戦うつもりなのだな。」
      悟空「そのとおりだ。」
      青毛獅子怪「思い上がるなよ。わしが妖兵を繰り出して陣を敷き、旗を振り太鼓を叩いて戦えば、地元の虎がよそ者をいじめたことになる。わしとお前、一対一だ。助太刀は許さぬ。」
      悟空はこれを聞いて叫んだ。「猪八戒（ちょはっかい）、脇へ寄れ。こいつがこの俺をどうするか、見ていろ。」
      八戒は本当に脇へ退いた。
      青毛獅子怪「こちらへ来い。まず杭になって立っていろ。わしが全力でその禿頭へ三太刀浴びせる。それに耐えたら、お前の唐僧を通してやろう。耐えられなければ、さっさと唐僧を差し出せ。わしの一食分のおかずにしてやる。」
      悟空は笑った。「妖怪、洞に紙と筆があるなら持ってこい。契約を取り交わしてやろう。今日から来年まで斬り続けたって、俺は本気で相手をせずにいてやるぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-029"

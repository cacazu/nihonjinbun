    "translation_ja": |-
      青毛獅子怪「猿め、自慢するな。この二の太刀を見ろ。今度こそ命はないぞ。」
      悟空「どうせ同じように斬るだけだろう。」
      青毛獅子怪「猿め、お前はこの刀を知らぬな。」

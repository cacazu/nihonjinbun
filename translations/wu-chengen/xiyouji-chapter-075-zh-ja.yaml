        "line_end": 160
    "translation_ja": |-
      八戒は神威を奮い起こし、悟空とともに荒風を巻き起こして雲霧に乗り、高山へ跳び上がると、すぐ洞口に着いた。洞の門は固く閉ざされ、見回しても人影はない。悟空は進み出て鉄棒を握り、厳しい声で叫んだ。
      悟空「妖怪ども、門を開けろ。早く出てきて、この俺と戦え。」
      洞の中の小妖が奥へ知らせた。青毛獅子怪は心底おびえて言った。
      青毛獅子怪「何年も、あの猿は手ごわいと聞いてきたが、噂は嘘ではなかった。まことだったわい。」
      傍らの黄牙老象が尋ねた。「兄者、どういうことだ。」
      青毛獅子怪「あの行者が今朝、小鑽風に化けて入り込み、わしらは見抜けなかった。幸い三番目の弟が見破って瓶へ入れたが、術を使って瓶に穴をあけ、服まで取り戻して逃げた。今は外で戦いを挑んでいる。誰か、最初の一戦を引き受ける者はおらぬか。」
      誰も答えない。もう一度尋ねても返事はなく、そろって聞こえないふり、口が利けないふりをしていた。青毛獅子怪は怒った。
      青毛獅子怪「わしらは西方の街道に、いささか悪名を響かせている。今日、孫行者にこれほど侮られて、出ていって一戦もしなければ、名がすたる。こうなれば、この老いぼれの命を捨てる覚悟で、わしが三合戦ってこよう。三合で勝てれば、唐僧はやはりわしらの食い物だ。勝てなければ、そのときは門を閉じ、あいつらを通してやればよい。」
      そこで鎧兜を取り寄せて身支度をし、門を開け、前へ出ていった。
    "translation_status": "reviewed"
  - "id": "xy-ch75-026"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者與八戒在門傍觀看，真是好一個怪物："

  - "id": "xy-ch75-032"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      金火爐中造，神功百煉熬。
      鋒刃依三略，剛強按六韜。
      卻似蒼蠅尾，猶如白蟒腰。
      入山雲蕩蕩，下海浪滔滔。
      琢磨無遍數，煎熬幾百遭。
      深山古洞放，上陣有功勞。
      攙著你這和尚天靈蓋，一削就是兩個瓢。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 181
        "line_end": 187
    "translation_ja": |-
      青毛獅子怪「金と火の炉の中で造られ、神業で百たび鍛えに鍛えられた。
      刃の鋭さは三略（さんりゃく）により、剛強さは六韜（りくとう）にかなう。
      蠅の尾に似て、白い大蛇の胴にも似る。
      山へ入れば雲が広がり、海へ下れば波が逆巻く。
      磨いた数は知れず、火にかけたことも何百回。
      深山の古い洞に収められ、いざ陣へ出れば手柄を立てる。
      お前のその坊主頭に触れたなら、ひと削ぎで二つの瓢杓になるぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-033"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖笑道：「這妖精沒眼色，把老孫認做個瓢頭哩。也罷，誤砍誤讓，教你再砍一刀看怎麼。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 189
        "line_end": 189
    "translation_ja": "悟空は笑った。「この妖怪は見る目がないな。俺の頭を瓢箪と思っているらしい。まあいい。適当に斬って、適当に受けてやろう。もう一太刀斬らせて、どうなるか見てやる。」"
    "translation_status": "reviewed"
  - "id": "xy-ch75-034"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老魔舉刀又砍，大聖把頭迎一迎，乒乓的劈做兩半個。大聖就地打個滾，變做兩個身子。那妖一見慌了，手按下鋼刀。豬八戒遠遠望見，笑道：「老魔好砍兩刀的，卻不是四個人了？」老魔指定行者道：「聞你能使分身法，怎麼把這法兒拿出在我面前使？」大聖道：「何為分身法？」老魔道：「為甚麼先砍你一刀不動，如今砍你一刀，就是兩個人？」大聖笑道：「妖怪，你切莫害怕。砍上一萬刀，還你二萬個人。」老魔道：「你這猴兒，你只會分身，不會收身。你若有本事收做一個，打我一棍去罷。」大聖道：「不許說謊，你要砍三刀，只砍了我兩刀。教我打一棍，若打了棍半，就不姓孫。」老魔道：「正是，正是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 190
        "line_end": 190
    "translation_ja": |-
      青毛獅子怪が刀を上げてまた斬ると、悟空は頭を差し出した。ばしんと二つに割れたが、その場で一転がりし、二人の姿になった。青毛獅子怪はそれを見て慌て、鋼の刀を下ろした。遠くから見ていた八戒は笑った。
      八戒「じいさん妖怪、もう二太刀斬ってみろよ。四人になるんじゃないか。」
      青毛獅子怪は悟空を指さして言った。「お前は分身の術を使うそうだな。なぜその術をわしの前で使うのだ。」
      悟空「分身の術とは何だ。」
      青毛獅子怪「最初に一太刀斬っても何ともなかったのに、今一太刀斬ったら二人になったのはなぜだ。」
      悟空は笑った。「妖怪、恐れるな。一万太刀斬れば、二万人にして返してやる。」
      青毛獅子怪「この猿め、分身はできても、元へ収めることはできぬのだろう。もし一人に戻れるなら、わしを一棒打ってみろ。」
      悟空「嘘をつくなよ。お前は三太刀斬ると言って、俺を二太刀しか斬っていない。俺に一棒打たせると言った以上、一棒半も打ったら孫（そん）とは名乗らん。」
      青毛獅子怪「そのとおり、そのとおり。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-035"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，就把身摟上來，打個滾，依然一個身子，掣棒劈頭就打。那老魔舉刀架住道：「潑猴無禮，甚麼樣個哭喪棒，敢上門打人？」大聖喝道：「你若問我這條棍，天上地下都有名聲。」老魔道：「怎見名聲？」他道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 192
        "line_end": 192
    "translation_ja": |-
      さすがの悟空、分かれた体を抱き寄せ、一転がりして元どおり一つの体になると、棒を抜き、頭めがけて打ち下ろした。青毛獅子怪は刀を上げて受け止め、言った。
      青毛獅子怪「無礼な猿め。何だ、その哭喪棒（こくそうぼう）は。よくも門前まで来て人を殴るものだ。」
      悟空は怒鳴った。「俺のこの棒を尋ねるなら、天の上から地の下まで名が知られているぞ。」
      青毛獅子怪「どんな名声があるというのだ。」
      そこで悟空は語った。
    "translation_status": "reviewed"
  - "id": "xy-ch75-036"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「棒是九轉鑌鐵煉，老君親手爐中煅。
      禹王求得號神珍，四海八河為定驗。
      中間星斗暗鋪陳，兩頭箝裹黃金片。
      花紋密佈鬼神驚，上造龍紋與鳳篆。
      名號靈陽棒一條，深藏海藏人難見。
      成形變化要飛騰，飄颻五色霞光現。
      老孫得道取歸山，無窮變化多經驗。
      時間要大甕來粗，或小些微如鐵線。
      粗如南岳細如針，長短隨吾心意變。
      輕輕舉動彩雲生，亮亮飛騰如閃電。
      攸攸冷氣逼人寒，條條殺霧空中現。
      降龍伏虎謹隨身，天涯海角都遊遍。
      曾將此棍鬧天宮，威風打散蟠桃宴。
      天王賭鬥未曾贏，哪吒對敵難交戰。
      棍打諸神沒躲藏，天兵十萬都逃竄。
      雷霆眾將護靈霄，飛身打上通明殿。
      掌朝天使盡皆忙，護駕仙卿俱攪亂。
      舉棒掀翻北斗宮，回首振開南極院。
      金闕天皇見棍兇，特請如來與我見。
      兵家勝敗自如然，困苦災危無可辨。
      整整挨排五百年，虧了南海菩薩勸。
      大唐有個出家僧，對天發下洪誓願。
      枉死城中度鬼魂，靈山會上求經卷。
      西方一路有妖魔，行動甚是不方便。
      已知鐵棒世無雙，央我途中為侶伴。
      邪魔湯著赴幽冥，肉化紅塵骨化麵。
      處處妖精棒下亡，論萬成千無打算。
      上方擊壞斗牛宮，下方壓損森羅殿。
      天將曾將九曜追，地府打傷催命判。
      半空丟下振山川，勝如太歲新華劍。
      全憑此棍保唐僧，天下妖魔都打遍。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 193
        "line_end": 223
    "translation_ja": |-
      悟空「この棒は九転（きゅうてん）して鑌鉄（ひんてつ）を練り、老君が自ら炉で鍛えたもの。
      禹王（うおう）が求めて神珍（しんちん）と名づけ、四つの海と八つの川の深さを定める験とした。
      真ん中には星々をひそかに配し、両端は黄金の板で挟んで包む。
      細かな文様に鬼神も驚き、竜の模様と鳳の篆字を刻んである。
      その名は一本の霊陽棒（れいようぼう）、海の蔵に深くしまわれ、人には見られなかった。
      形をなし変化して舞い上がろうとすると、五色の霞の光がゆらゆら現れる。
      この俺が道を得て山へ持ち帰り、限りない変化を何度も試した。
      あるときは甕ほど太くなり、またあるときは鉄線のようにごく細くなる。
      太くすれば南岳（なんがく）ほど、細くすれば針ほどで、長さも心のままに変わる。
      軽く動かせば彩雲を生み、明るく飛び上がれば稲妻のよう。
      ひやひやした冷気は人を凍えさせ、幾筋もの殺気の霧が空に現れる。
      竜を降し虎を伏せ、肌身離さず携えて、天の果て海の果てまで巡り尽くした。
      かつてこの棒で天宮に暴れ込み、その威風で蟠桃（ばんとう）の宴を打ち散らした。
      天王（てんのう）も戦って勝てず、哪吒（なた）も敵となって戦い抜けなかった。
      神々は棒の一撃を逃れられず、十万の天兵はことごとく逃げ散った。
      雷神の将たちが霊霄（れいしょう）を守ったが、俺は飛び上がり通明殿（つうめいでん）へ攻め込んだ。
      朝廷を預かる天の使者たちは大慌て、帝を守る仙卿たちもかき乱された。
      棒を挙げて北斗宮（ほくときゅう）をひっくり返し、振り返って南極院（なんきょくいん）を震い開いた。
      金闕天皇（きんけつてんこう）はこの棒の凄まじさを見て、わざわざ如来（にょらい）を招き、俺と対面させた。
      戦の勝ち負けは自然なこと、苦しみも災いもどうなるか分からぬもの。
      まるまる五百年耐えしのぎ、南海（なんかい）の菩薩の勧めに助けられた。
      大唐（だいとう）に一人の出家した僧がおり、天に向かって大いなる誓いを立てた。
      枉死城（おうしじょう）の亡魂を救うため、霊山（れいざん）の会座で経巻を求めるのだと。
      西方への道には妖魔がおり、旅を続けるのはとても難しい。
      この鉄棒が世に並ぶものなしと知って、俺に道中の連れとなるよう頼んだのだ。
      邪魔がこれに触れれば冥界へ赴き、肉は赤い塵、骨は粉となる。
      どこでも妖怪は棒の下に死に、その数は幾万幾千、数えきれない。
      上では斗牛宮（とぎゅうきゅう）を打ち壊し、下では森羅殿（しんらでん）を押し潰した。
      天将の九曜（くよう）を追い回し、地府では命を取り立てる判官を打ち傷つけた。
      空中から投げ落とせば山河を震わせ、太歳（たいさい）の新華剣（しんかけん）にも勝る。
      ひとえにこの棒で唐僧を守り、天下の妖魔をことごとく打って回るのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-037"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那魔聞言，戰兢兢捨著性命，舉刀就砍；猴王笑吟吟使鐵棒前迎。他兩個先時在洞前撐持，然後跳起去，都在半空裡廝殺。這一場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 224
        "line_end": 224
    "translation_ja": "これを聞いた青毛獅子怪は、震えながらも命を捨てる覚悟で刀を振り上げ、斬りつけた。悟空はにこにこしながら鉄棒で迎え撃つ。二人は初め洞の前で渡り合っていたが、やがて跳び上がり、ともに空中で戦った。すさまじい一戦である。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-038"
    "section_id": "chapter-75"
    "kind": "verse"
    "origin": "source"
    "source_text": "天河定底神珍棒，棒名如意世間高。誇稱手段魔頭惱，大捍刀擎法力豪。門外爭持還可近，空中賭鬥怎相饒。一個隨心更面目，一個立地長身腰。殺得滿天雲氣重，遍野霧飄颻。那一個幾番立意吃三藏，這一個廣施法力保唐朝。都因佛祖傳經典，邪正分明恨苦交。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 226
        "line_end": 226
    "translation_ja": |-
      天河（てんが）の底を定めた神珍の棒、その名は如意（にょい）、世に高く知られる。
      腕前の自慢に魔王は怒り、大刀を掲げ、豪壮な法力を振るう。
      門外での争いにはまだ近づけるが、空中の戦いでどうして容赦があろう。
      一人は思いのままに顔を変え、一人はたちどころに背丈を伸ばす。
      戦えば全天に雲気が重く、野いっぱいに霧が揺れる。
      あちらは幾度も三蔵を食おうと企み、こちらは法力を広く施して唐朝（とうちょう）の僧を守る。
      すべては仏祖（ぶっそ）が経典を伝えんとするゆえ、邪と正ははっきり分かれ、恨みも苦しみも交錯する。
    "translation_status": "reviewed"
  - "id": "xy-ch75-039"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那老魔與大聖鬥經二十餘合，不分輸贏。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 228
        "line_end": 228
    "translation_ja": "青毛獅子怪と悟空は二十余合戦ったが、勝負はつかなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-040"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來八戒在底下見他兩個戰到好處，忍不住掣鈀架風，跳將起去，望妖魔劈臉就築。那魔慌了。不知八戒是個虎頭性子，冒冒失失的諕人。他只道嘴長耳大，手硬鈀兇，敗了陣，丟了刀，回頭就走。大聖喝道：「趕上，趕上。」這獃子仗著威風，舉著釘鈀，即忙趕下怪去。老魔見他趕的相近，在坡前立定，迎著風頭，幌一幌現了原身，張開大口，就要來吞八戒。八戒害怕，急抽身往草裡一鑽，也管不得荊針棘刺，也顧不得刮破頭疼，戰兢兢的在草裡聽著梆聲。隨後行者趕到，那怪也張口來吞，卻中了他的機關，收了鐵棒，迎將上去，被老魔一口吞之。諕得個獃子在草裡囊囊咄咄的埋怨道：「這個弼馬溫，不識進退。那怪來吃你，你如何不走，反去迎他！這一口吞在肚中，今日還是個和尚，明日就是個大恭也。」那魔得勝而去，這獃子才鑽出草來，溜回舊路。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 229
        "line_end": 229
    "translation_ja": |-
      下で見ていた八戒は、二人の戦いが佳境に入るとこらえきれず、馬鍬を抜いて風に乗り、跳び上がって妖怪の顔へ打ち下ろした。青毛獅子怪は慌てた。八戒が向こう見ずで、無鉄砲な勢いで人を脅かす性分だとは知らない。ただ、口が長く耳が大きく、腕っぷしが強くて馬鍬が凶暴だと思い、敗れて刀を捨て、背を向けて逃げた。悟空は叫んだ。
      悟空「追え、追え。」
      八戒は勢いに乗り、釘のついた馬鍬を掲げて、急いで妖怪を下へ追った。青毛獅子怪は近くまで追ってきたのを見ると、坂の前でぴたりと立ち止まり、風に向かって身を震わせて本来の姿を現した。大口を開き、八戒を呑み込もうとする。八戒は怖くなり、急いで身をかわして草むらへ飛び込んだ。棘や茨にもかまわず、頭を引っかかれて痛いのも気にせず、草の中でぶるぶる震えながら拍子木の音を聞いていた。後から悟空が追いつくと、青毛獅子怪はやはり口を開いて呑もうとしたが、これこそ悟空の思うつぼだった。悟空は鉄棒を収めて口へ飛び込み、青毛獅子怪にひと口で呑まれた。八戒は驚き、草の中でぶつぶつと恨み言を言った。
      八戒「この弼馬温め、進むも退くも分からないのか。あいつが食おうとしているのに、なぜ逃げずに向かっていくんだ。ひと口で腹へ呑み込まれて、今日はまだ坊さんでも、明日は大便だぞ。」
      青毛獅子怪が勝ち誇って立ち去ると、八戒はようやく草から這い出し、来た道をこそこそ戻った。
    "translation_status": "reviewed"
  - "id": "xy-ch75-041"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏在那山坡下正與沙僧盼望，只見八戒喘呵呵的跑來。三藏大驚道：「八戒，你怎麼這等狼狽？悟空如何不見？」獃子哭哭啼啼道：「師兄被妖精一口吞下肚去了。」三藏聽言，諕倒在地，半晌間跌腳拳胸道：「徒弟呀，只說你善會降妖，領我西天見佛，怎知今日死於此怪之手。苦哉，苦哉！我弟子同眾的功勞，如今都化作塵土矣。」那師父十分苦痛。你看那獃子，他也不來勸解師父，卻叫：「沙和尚，你拿將行李來，我兩個分了罷。」沙僧道：「二哥，分怎的？」八戒道：「分開了，各人散火：你往流沙河，還去吃人；我往高老莊，看看我渾家。將白馬賣了，與師父買個壽器送終。」長老氣呼呼的聞得此言，叫皇天，放聲大哭。且不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 230
        "line_end": 230
    "translation_ja": |-
      さて、三蔵は坂の下で沙悟浄とともに帰りを待ちわびていたが、八戒がはあはあと息を切らして駆けてくるのが見えた。三蔵は驚いた。
      三蔵「八戒、どうしてそんなに取り乱しているのだ。悟空の姿が見えないのはなぜだ。」
      八戒は泣きじゃくって言った。「兄貴は妖怪にひと口で腹の中へ呑み込まれました。」
      三蔵は聞くなり驚いて地面に倒れ、しばらくすると足を踏み鳴らし、胸を拳で叩いて嘆いた。
      三蔵「弟子よ、お前はよく妖怪を降し、私を西天（さいてん）の仏のもとへ導いてくれると思っていた。それが今日、この妖怪の手で死のうとは。ああ、つらい、つらい。弟子たちと皆で積んできた苦労も、今やすべて塵となってしまった。」
      三蔵はひどく悲しんだ。ところが八戒ときたら、師を慰めようともせず、呼びかけた。
      八戒「沙和尚（さおしょう）、荷物を持ってこい。二人で分けよう。」
      沙悟浄「兄さん、どうして分けるんだ。」
      八戒「分けて、各自おさらばするのさ。お前は流沙河（りゅうさが）へ帰って、また人を食えばいい。俺は高老荘（こうろうそう）へ行って、女房の顔を見てくる。白馬は売って、お師匠さまに棺を買い、最期の弔いをして差し上げよう。」
      三蔵は息を荒くしてそれを聞くと、天に呼びかけ、声を放って大泣きした。この話はひとまず置く。
    "translation_status": "reviewed"
  - "id": "xy-ch75-042"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那老魔吞了行者，以為得計，徑回本洞，眾妖迎問出戰之功。老魔道：「拿了一個來了。」二魔喜道：「哥哥拿的是誰？」老魔道：「是孫行者。」二魔道：「拿在何處？」老魔道：「被我一口吞在腹中哩。」第三個魔頭大驚道：「大哥啊，我就不曾吩咐你，孫行者不中吃。」那大聖在肚裡道：「忒中吃，又禁饑，再不得餓。」慌得那小妖道：「大王，不好了，孫行者在你肚裡說話哩。」老魔道：「怕他說話，有本事吃了他，沒本事擺佈他不成？你們快去燒些鹽白湯，等我灌下肚去，把他噦出來，慢慢的煎了吃酒。」小妖真個沖了半盆鹽湯。老怪一飲而乾，洼著口，著實一嘔；那大聖在肚裡生了根，動也不動。卻又攔著喉嚨，往外又吐，吐得頭暈眼花，黃膽都破了；行者越發不動。老魔喘息了，叫聲：「孫行者，你不出來？」行者道：「早哩，正好不出來哩！」老魔道：「你怎麼不出？」行者道：「你這妖精甚不通變。我自做和尚，十分淡薄，如今秋涼，我還穿個單直裰。這肚裡倒暖，又不透風，等我住過冬才好出來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 231
        "line_end": 231
    "translation_ja": |-
      さて、悟空を呑み込んだ青毛獅子怪は、まんまと仕留めたと思い、まっすぐ自分の洞へ帰った。妖怪たちは出迎え、出陣の手柄を尋ねた。
      青毛獅子怪「一人つかまえてきたぞ。」
      黄牙老象は喜んで尋ねた。「兄者、誰をつかまえた。」
      青毛獅子怪「孫行者だ。」
      黄牙老象「どこにつかまえてある。」
      青毛獅子怪「ひと口で腹へ呑み込んだわい。」
      雲程万里鵬は大いに驚いた。「兄者、まだ言っていなかったが、孫行者は食うものではないのだ。」
      悟空は腹の中から言った。「たいそう食いでがあるぞ。腹持ちもよくて、もう飢えることはない。」
      小妖は慌てた。「大王、大変です。孫行者がお腹の中で話しています。」
      青毛獅子怪「しゃべったからどうだというのだ。食う腕があって、始末する腕がないものか。早く塩を入れた白湯を沸かしてこい。腹へ流し込んで吐き出し、ゆっくり煎り焼きにして酒を飲もう。」
      小妖は本当に鉢半分の塩湯を作った。青毛獅子怪は一息に飲み干し、口をゆがめて思いきりえずいた。だが悟空は腹の中に根が生えたように、びくともしない。さらに喉を押さえて吐き出そうとしたが、吐くうちに頭はくらくら、目はちらちらし、胆嚢まで破れたのに、悟空はいっそう動かなかった。青毛獅子怪は息をつき、呼びかけた。
      青毛獅子怪「孫行者、出てこないのか。」
      悟空「まだ早い。今はちょうど、出たくないところだ。」
      青毛獅子怪「どうして出ぬのだ。」
      悟空「この妖怪はまるで融通が利かないな。俺は坊主になってから、ずいぶんわびしい暮らしだ。秋になって涼しいのに、まだ単衣の直裰（ちょくたつ）しか着ていない。それが腹の中なら暖かくて、風も通さない。ここで冬を越してから出るのがよさそうだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-043"
    "section_id": "chapter-75"
    "kind": "paragraph"

  - "id": "xy-ch75-024"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖聽得這般言語，更加努力，收斂雲光，近前叫道：「師父，我來了。」長老攙住道：「悟空，勞碌。你遠探高山，許久不回，我甚憂慮。端的這山中有何吉凶？」行者笑道：「師父，才這一去，一則是東土眾生有緣有分，二來是師父功德無量無邊，三也虧弟子法力。」將前項妝鑽風、陷瓶裡及脫身之事，細陳了一遍。「今得見尊師之面，實為兩世之人也。」長老感謝不盡道：「你這番不曾與妖精賭鬥麼？」行者道：「不曾。」長老道：「這等保不得我過山了？」行者是個好勝的人，叫喊道：「我怎麼保你過山不得？」長老道：「不曾與他見個勝負，只這般含糊，我怎敢前進。」大聖笑道：「師父，你也忒不通變。常言道：『單絲不線，孤掌難鳴。』那魔三個，小妖千萬，教老孫一人怎生與他賭鬥？」長老道：「寡不敵眾，是你一人也難處。八戒、沙僧他也都有本事，教他們都去，與你協力同心，掃淨山路，保我過去罷。」行者沉吟道：「師言最當。著沙僧保護你，著八戒跟我去罷。」那獃子慌了道：「哥哥沒眼色。我又粗夯，無甚本事，走路扛風，跟你何益？」行者道：「兄弟，你雖無甚本事，好道也是個人。俗云：『放屁添風。』你也可壯我些膽氣。」八戒道：「也罷，也罷，望你帶挈帶挈。但只急溜處，莫捉弄我。」長老道：「八戒在意，我與沙僧在此。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空はこの言葉を聞いて、いっそう力が湧いた。雲の光を収め、近づいて呼びかけた。
      悟空「お師匠さま、戻りました。」
      三蔵は悟空の手を取って言った。「悟空、ご苦労だった。遠く山を探りに行ったきり、長いこと帰らないので、とても心配していたのだ。この山には、いったいどんな吉凶があるのか。」
      悟空は笑って答えた。「お師匠さま、今度こうして帰れたのは、一つには東土（とうど）の人々に仏縁があったから、二つにはお師匠さまの功徳が限りなく大きかったから、三つには弟子の私の法力のおかげです。」
      そして、小鑽風に化け、瓶へ閉じ込められ、そこから抜け出したいきさつを、詳しくひと通り話した。
      悟空「今またお師匠さまのお顔を拝見できるとは、まさしく生まれ変わった心地です。」
      三蔵はいくら感謝してもしきれず、こう尋ねた。「それでは今回は、妖怪と戦ってはいないのか。」
      悟空「戦ってはいません。」
      三蔵「では、私を守って山を越えることはできぬのか。」
      悟空は負けず嫌いだから、声を張り上げた。
      悟空「どうして私にお師匠さまを守って山を越えられないのです。」
      三蔵「まだ勝ち負けを決めていないのに、そう曖昧なままで、どうして先へ進めよう。」
      悟空は笑った。「お師匠さまも、ずいぶん融通が利きませんね。『一本の糸だけでは縒り糸にならず、片方の手のひらだけでは音が鳴らない』と言うでしょう。大きな魔物が三人、小妖は千とも万ともいるのに、この俺一人でどうやって戦うのです。」
      三蔵「多勢に無勢、お前一人では難しかろう。八戒も沙悟浄も腕はある。二人とも行かせるから、心を合わせて力を尽くし、山道を一掃して、私を守って通しておくれ。」
      悟空は考え込んでから言った。「お師匠さまのおっしゃるとおりです。沙悟浄にはお師匠さまを守らせ、八戒を私に同行させましょう。」
      八戒は慌てた。「兄貴は察しが悪いな。俺は不器用で、ろくな腕もない。歩けば風を受け止めるくらいで、ついていったって何の足しになる。」
      悟空「お前にろくな腕がなくたって、一応は一人分だろう。世間でも『屁をひれば風の足し』と言う。少しくらい俺の心強さの足しにはなるさ。」
      八戒「分かった、分かった。うまく面倒を見てくれよ。ただし、切羽詰まったところで俺をからかうなよ。」
      三蔵「八戒、気をつけるのだよ。私と沙悟浄はここにいる。」

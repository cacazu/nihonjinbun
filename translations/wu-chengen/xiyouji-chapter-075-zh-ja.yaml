    "translation_ja": |-
      悟空は体をぶるっと震わせ、剝ぎ取られた服を取り戻して元の姿を現し、洞の外へ跳び出した。振り返って悟空は罵った。
      悟空「妖怪ども、無礼をするな。瓶には穴をあけてやったから、もう人は入れておけないぞ。くそをする便器にでも使うんだな。」
      喜び勇んで大騒ぎしながら雲に乗り、まっすぐ三蔵のもとへ戻った。三蔵はちょうど、ひとつまみの土を香の代わりにして、空に向かって祈っていた。悟空はひとまず雲を止め、何を祈っているのか聞いてみた。三蔵は合掌して天に向かい、こう唱えていた。

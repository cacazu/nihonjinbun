    "source_text": "那獃子抖擻神威，與行者縱著狂風，駕著雲霧，跳上高山，即至洞口。早見那洞門緊閉，四顧無人。行者上前，執鐵棒，厲聲高叫道：「妖怪開門！快出來與老孫打耶。」那洞裡小妖報入。老魔心驚膽戰道：「幾年都說猴兒狠，話不虛傳果是真。」二老怪在傍問道：「哥哥怎麼說？」老魔道：「那行者早間變小鑽風混進來，我等不能相識，幸三賢弟認得，把他裝在瓶裡，他弄本事，鑽破瓶兒，卻又攝去衣服走了。如今在外叫戰，誰敢與他打個頭仗？」更無一人答應。又問，又無人答，都是那裝聾推啞。老魔發怒道：「我等在西方大路上忝著個醜名，今日孫行者這般藐視，若不出去與他見陣，也低了名頭。等我捨了這老性命去與他戰上三合。三合戰得過，唐僧還是我們口裡食；戰不過，那時關了門，讓他過去罷。」遂取披掛結束了，開門前走。"

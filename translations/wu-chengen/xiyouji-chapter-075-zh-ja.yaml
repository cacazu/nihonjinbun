    "source_text": "三怪把行者扳翻倒，四馬攢蹄綑住。揭起衣裳看時，足足是個弼馬溫。原來行者有七十二般變化，若是變飛禽、走獸、花木、器皿、昆蟲之類，卻就連身子滾去了；但變人物，卻只是頭臉變了，身子變不過來。果然一身黃毛，兩塊紅股，一條尾巴。老妖看著道：「是孫行者的身子，小鑽風的臉皮。是他了。」教：「小的們，先安排酒來，與你三大王遞個得功之杯。既拿倒了孫行者，唐僧坐定是我們口裡食也。」三怪道：「且不要吃酒。孫行者溜撒，他會逃遁之法，只怕走了。教小的們擡出瓶來，把孫行者裝在瓶裡，我們才好吃酒。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      雲程万里鵬は悟空を引き倒し、両手両足をひとまとめにして縛った。服をめくって見れば、まさしくあの弼馬温（ひつばおん）である。悟空には七十二通りの変化があるが、鳥や獣、花や木、器物、虫などに変わる場合は、体ごとすっかり変えられる。ところが人に変わるときは頭と顔だけで、体までは変えられないのだ。なるほど、全身の黄色い毛、二つの赤い尻、一筋の尾があった。青毛獅子怪はそれを見て言った。
      青毛獅子怪「孫行者の体に、小鑽風の顔の皮だ。こいつだったのか。」
      続いて青毛獅子怪は命じた。「お前たち、まず酒を用意しろ。三の大王に手柄の祝いの杯を差し上げよう。孫行者をつかまえたからには、唐僧は間違いなくわしらの口に入る食い物だ。」
      雲程万里鵬「酒はまだだ。孫行者はすばしこく、逃げ隠れする術も使う。逃げられてはまずい。小妖たちに瓶を運び出させ、孫行者を瓶へ入れてしまってから、安心して飲もう。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-016"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老魔大笑道：「正是，正是。」即點三十六個小妖，入裡面開了庫房門，擡出瓶來。你說那瓶有多大？只得二尺四寸高。怎麼用得三十六個人擡？那瓶乃陰陽二氣之寶，內有七寶八卦、二十四氣，要三十六人，按天罡之數，才擡得動。不一時，將寶瓶擡出，放在三層門外，展得乾淨，揭開蓋。把行者解了繩索，剝了衣服，就著那瓶中仙氣，颼的一聲，吸入裡面，將蓋子蓋上，貼了封皮。卻去吃酒道：「猴兒今番入我寶瓶之中，再莫想那西方之路。若還能夠拜佛求經，除是轉背搖車，再去投胎奪舍是。」你看那大小群妖，一個個笑呵呵，都去賀功不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      青毛獅子怪は大笑いした。「そのとおり、そのとおり。」
      ただちに三十六人の小妖を選び、奥へ行かせて倉の戸を開け、瓶を運び出させた。さて、その瓶はどれほどの大きさだったか。高さはわずか二尺（しゃく）四寸（すん）である。それなのに、なぜ三十六人もかかって担ぐのか。この瓶は陰陽二気（いんようにき）の宝で、中には七宝（しっぽう）・八卦（はっけ）・二十四気（にじゅうしき）があり、天罡（てんこう）の数に合わせた三十六人でなくては持ち上げられないのだ。ほどなく宝の瓶を運び出し、三つ目の門の外に置き、きれいに整えて蓋を取った。悟空の縄を解いて服を剝ぎ取ると、瓶の中の仙気に吸われ、ひゅっと中へ入った。蓋を閉めて封紙を貼り、青毛獅子怪は酒を飲みに行って言った。
      青毛獅子怪「猿め、今度こそわしの宝の瓶へ入ったぞ。もう西方への旅など望むな。まだ仏を拝み、経を求められるとすれば、いったん背を向けて揺り籠からやり直し、別の胎や体に生まれ変わってくるほかあるまい。」
      大小の妖怪たちは、誰もがにこにこして手柄を祝いに行った。この話はひとまず置く。
    "translation_status": "reviewed"
  - "id": "xy-ch75-017"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說大聖到了瓶中，被那寶貝將身束得小了，索性變化，蹲在當中。半晌，那邊蔭涼，忽失聲笑道：「這妖精外有虛名，內無實事。怎麼告訴人說這瓶裝了人，一時三刻，化為膿血？若似這般涼快，就住上七八年也無事。」咦！大聖原來不知那寶貝根由：假若裝了人，一年不語，一年蔭涼；但聞得人言，就有火來燒了。大聖未曾說完，只見滿瓶都是火焰。幸得他有本事，坐在中間，捻著避火訣，全然不懼。耐到半個時辰，四週圍鑽出四十條蛇來咬。行者掄開手，抓將過來，盡力氣一揝，揝做八十段。少時間，又有三條火龍出來，把行者上下盤遶，著實難禁。自覺慌張無措道：「別事好處，這三條火龍難為。再過一會不出，弄得火氣攻心，怎了？」他想道：「我把身子長一長，券破罷。」好大聖，捻著訣，念聲咒，叫：「長！」即長了丈數高下。那瓶緊靠著身，也就長起去。他把身子往下一小，那瓶兒也就小下來了。行者心驚道：「難難難。怎麼我長他也長，我小他也小？如之奈何？」說不了，孤拐上有些疼痛。急伸手摸摸，卻被火燒軟了。自己心焦道：「怎麼好？孤拐燒軟了，弄做個殘疾之人了。」忍不住吊下淚來。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      さて、瓶へ入った悟空は、その宝に体を締めつけられて小さくなったので、いっそ自分から変化し、中にしゃがんだ。しばらくしても涼しいままなので、思わず声を出して笑った。
      悟空「この妖怪どもは評判ばかりで、中身は何もないな。どうして人には、この瓶へ入れると一時三刻（いちじさんこく）で膿と血になるなどと言うのだ。こんなに涼しければ、七、八年住んだって平気じゃないか。」
      おやおや、悟空はこの宝の仕組みを知らなかったのだ。人を入れても、その者が一年黙っていれば一年涼しい。だが人の言葉が聞こえるや、火が燃え出すのである。悟空がまだ言い終えぬうちに、瓶の中は一面の炎になった。幸い悟空には術がある。中に座って避火訣（ひかけつ）の印を結び、まるで恐れなかった。半時辰（はんじしん）ほど耐えていると、周囲から四十匹の蛇が這い出して噛みついてきた。悟空は両手を振るってつかまえ、力いっぱい引きちぎり、八十の切れ端にした。しばらくすると、今度は三匹の火竜が出てきて、悟空の上下に巻きついた。これにはとても耐えられない。慌てふためき、なすすべもなくなって、悟空は言った。
      悟空「ほかはどうにでもなるが、この三匹の火竜には困ったぞ。もう少し出られず、火の気が心臓を攻めたら、どうしよう。」
      悟空は考えた。「体を大きくして、押し破ってやろう。」
      さすがの悟空、印を結んで呪文を唱え、悟空は叫んだ。「大きくなれ！」
      たちまち高さ数丈に伸びたが、瓶も体にぴったりついて大きくなる。体を縮めると、瓶も小さくなった。悟空はぎょっとして言った。
      悟空「困った、困った、困った。どうして俺が大きくなればこいつも大きくなり、小さくなればこいつも小さくなるんだ。どうしたらいい。」
      言い終わらぬうちに、くるぶしに痛みを感じた。急いで手で触ると、火に焼かれて軟らかくなっている。悟空は焦って思った。
      悟空「どうしよう。くるぶしが焼けて軟らかくなった。足の不自由な体になってしまう。」
      こらえきれず、涙をこぼした。まさしく、

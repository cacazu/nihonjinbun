    "translation_ja": |-
      青毛獅子怪は威風を奮い、足を丁の字に踏み開いて立つと、両手で刀を振り上げ、悟空の頭のてっぺんへ斬り下ろした。悟空は頭を上へ突き出して迎えた。がちりと音がしただけで、頭の皮は赤くもならない。青毛獅子怪は大いに驚いた。
      青毛獅子怪「この猿め、何という石頭だ。」
      悟空は笑った。「知らないのか。この俺はな、」

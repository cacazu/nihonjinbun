    "source_text": "那行者將身一抖，收了剝去的衣服，現本相，跳出洞外，回頭罵道：「妖精不要無禮。瓶子鑽破，裝不得人了，只好拿來出恭。」喜喜歡歡，嚷嚷鬧鬧，踏著雲頭，徑轉唐僧處。那長老正在那裡撮土為香，望空禱祝。行者且停雲頭，聽他禱祝甚的。那長老合掌朝天道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"

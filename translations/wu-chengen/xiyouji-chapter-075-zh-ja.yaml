  - "id": "xy-ch75-019"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "道：「師父啊！當年皈正，蒙觀音菩薩勸善，脫離天災。我與你苦歷諸山，收殄多怪，降八戒，得沙僧，千辛萬苦，指望同證西方，共成正果。何期今日遭此毒魔，老孫誤入於此，傾了性命，撇你在半山之中，不能前進。想是我昔日名高，故有今朝之難。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 150
        "line_end": 150
    "translation_ja": "悟空「お師匠さま！　あの年、観音菩薩（かんのんぼさつ）に善い道へと勧められて正道に帰り、天の災いから解き放たれました。それからあなたと苦労して山々を越え、大勢の妖怪を取り押さえ、滅ぼし、八戒（はっかい）を降し、沙悟浄（さごじょう）を仲間にしました。さんざん辛苦を重ねたのも、ともに西方で悟りを開き、正果（しょうか）を成そうと思えばこそ。それが今日、この毒々しい魔物に遭い、この俺が誤ってここへ入り、命を落とすとは。あなたを山の中腹に残し、先へ進めなくしてしまう。昔、俺の名が高すぎたから、今日の災難があるのでしょう。」"
    "translation_status": "reviewed"
  - "id": "xy-ch75-020"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正此悽愴，忽想起：「菩薩當年在蛇盤山曾賜我三根救命毫毛，不知有無，且等我尋一尋看。」即伸手渾身摸了一把，只見腦後有三根毫毛，十分挺硬。忽喜道：「身上毛都如彼軟熟，只此三根如此硬槍，必然是救我命的。」即便咬著牙，忍著疼，拔下毛，吹口仙氣，叫：「變！」一根即變作金鋼鑽，一根變作竹片，一根變作綿繩。扳張篾片弓兒，牽著那鑽，照瓶底下颼颼的一頓鑽，鑽成一個眼孔，透進光亮。喜道：「造化，造化，卻好出去也。」才變化出身，那瓶復蔭涼了。怎麼就涼？原來被他鑽了，把陰陽之氣泄了，故此遂涼。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      こうして悲嘆に暮れているうち、ふと思い出した。
      悟空「あのとき蛇盤山（じゃばんざん）で、菩薩（ぼさつ）が三本の救命毫毛（きゅうめいごうもう）を授けてくださった。まだあるかどうか、ちょっと探してみよう。」
      手を伸ばして全身をひと通り探ると、後頭部に三本、ひどく硬く突っ張った毛があるのが分かった。悟空は急に喜んで言った。
      悟空「体の毛はどれもあんなにぐにゃぐにゃなのに、この三本だけはこんなに硬い。きっと命を救う毛だ。」
      そこで歯を食いしばり、痛みをこらえて毛を抜き、仙気を吹きかけ、悟空は叫んだ。「変われ！」
      一本は金鋼鑽（こんごうさん）に、一本は竹片に、一本は綿の紐になった。竹片を曲げて小さな弓を張り、その紐を錐に掛けて、瓶の底に向け、しゅっしゅっとひとしきり揉み立てた。穴が一つあいて、光が差し込んだ。悟空は喜んだ。
      悟空「運がいい、運がいい。うまく出られるぞ。」
      身を抜き出す変化を施すと、瓶はまた涼しくなった。なぜ涼しくなったのか。穴をあけたために陰陽（いんよう）の気が漏れ出し、それで涼しくなったのである。
    "translation_status": "reviewed"
  - "id": "xy-ch75-021"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，收了毫毛，將身一小，就變做個蟭蟟蟲兒，十分輕巧，細如鬚髮，長似眉毛，自孔中鑽出且還不走，徑飛在老魔頭上釘著。那老魔正飲酒，猛然放下杯兒道：「三弟，孫行者這回化了麼？」三魔笑道：「還到此時哩？」老魔教傳令擡上瓶來。那下面三十六個小妖即便擡瓶，瓶就輕了許多。慌得眾小妖報道：「大王，瓶輕了。」老魔喝道：「胡說，寶貝乃陰陽二氣之全功，如何輕了？」內中有一個勉強的小妖，把瓶提上來道：「你看這不輕了？」老魔揭蓋看時，只見裡面透亮，忍不住失聲叫道：「這瓶裡空者控也。」大聖在他頭上，也忍不住道一聲「我的兒啊，颼者走也。」眾怪聽見道：「走了，走了。」即傳令：「關門，關門。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      さすがの悟空、毛を取り戻し、身を縮めて蟭蟟虫（しょうりょうちゅう）になった。ひどく軽やかで、細さはひげや髪ほど、長さは眉毛ほどである。穴から抜け出してもまだ立ち去らず、まっすぐ青毛獅子怪の頭へ飛んでいき、ぴたりと止まった。青毛獅子怪は酒を飲んでいたが、急に杯を置いて言った。
      青毛獅子怪「三番目の弟よ、孫行者はもう溶けたか。」
      雲程万里鵬は笑った。「今までかかるものか。」
      青毛獅子怪は、瓶を運んでくるよう命じさせた。下に控えた三十六人の小妖がさっそく担ぐと、瓶はずいぶん軽くなっている。小妖たちは慌てて報告した。
      小妖たち「大王、瓶が軽くなりました。」
      青毛獅子怪「馬鹿を言え。この宝は陰陽二気の力を完全に備えている。どうして軽くなるのだ。」
      その中の一人、思い切って進み出た小妖が瓶を持ち上げて来て言った。
      小妖「ご覧ください、軽いではありませんか。」
      青毛獅子怪が蓋を取ると、中には光が通っていた。思わず声を上げた。
      青毛獅子怪「この瓶の中は、空っぽの、ぽっかりだ！」
      頭の上の悟空もこらえきれず、ひと言返した。
      悟空「わが子よ、こっちは、すっ飛んで、すたこらだ！」
      妖怪たちはこれを聞いて叫んだ。「逃げた、逃げた。」
      すぐに命令が伝わった。話者不明「門を閉めろ、門を閉めろ。」

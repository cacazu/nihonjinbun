    "source_text": "眾妖聽說，都道：「大王，孫行者要在你肚裡過冬哩。」老魔道：「他要過冬，我就打起禪來，使個搬運法，一冬不吃飯，就餓殺那弼馬溫。」大聖道：「我兒子，你不知事。老孫保唐僧取經，從廣裡過，帶了個摺疊鍋兒，進來煮雜碎吃。將你這裡邊的肝、腸、肚、肺，細細兒受用，還夠盤纏到清明哩。」那二魔大驚道：「哥啊，這猴子他幹得出來。」三魔道：「哥啊，吃了雜碎也罷，不知在那裡支鍋？」行者道：「三叉骨上好支鍋。」三魔道：「不好了，假若支起鍋，燒動火煙，煼到鼻孔裡，打嚏噴麼？」行者笑道：「沒事，等老孫把金箍棒往頂門裡一搠，搠個窟窿：一則當天窗，二來當煙洞。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 232
        "line_end": 232
    "translation_ja": |-
      妖怪たちは聞くと、みな言った。
      妖怪たち「大王、孫行者はお腹の中で冬を越すつもりです。」
      青毛獅子怪「冬を越すつもりなら、わしは座禅を組み、搬運法（はんうんほう）を使って、一冬、飯を食わずにいよう。あの弼馬温を飢え死にさせてやる。」
      悟空「わが息子よ、何も分かっていないな。この俺は唐僧を守って経を取りに行く途中、広州（こうしゅう）を通ったときに、折り畳み鍋を持ってきたんだ。ここで臓物を煮て食ってやる。お前の中の肝臓、腸、胃、肺を、ちびちび味わえば、清明（せいめい）までの食い扶持には十分だ。」
      黄牙老象は大いに驚いた。「兄者、この猿ならやりかねないぞ。」
      雲程万里鵬「兄者、臓物を食うのはまだしも、いったいどこへ鍋を据えるつもりだ。」
      悟空「三つ又の骨の上なら、うまく鍋が据わるぞ。」
      雲程万里鵬「まずいな。もし鍋を据えて火を起こし、煙が鼻の穴までいぶしてきたら、くしゃみが出るのではないか。」
      悟空は笑った。「心配するな。金箍棒（きんこぼう）を頭のてっぺんへ突き立てて、穴を一つあけてやる。一つには明かり取り、二つには煙突になる。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-044"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "老魔聽說，雖說不怕，卻也心驚，只得硬著膽叫：「兄弟們，莫怕。把我那藥酒拿來，等我吃幾鍾下去，把猴兒藥殺了罷。」行者暗笑道：「老孫五百年前大鬧天宮時，吃老君丹、玉皇酒、王母桃及鳳髓龍肝，那樣東西我不曾吃過？是甚麼藥酒，敢來藥我？」那小妖真個將藥酒篩了兩壺，滿滿斟了一鍾，遞與老魔。老魔接在手中，大聖在肚裡就聞得酒香，道：「不要與他吃。」好大聖，把頭一扭，變做個喇叭口子，張在他喉嚨之下。那怪嘓的嚥下，被行者嘓的接吃了。第二鍾嚥下，被行者嘓的又接吃了。一連吃了七八鍾，都是他接吃了。老魔放下鍾道：「不吃了。這酒常時吃兩鍾，腹中如火；卻才吃了七八鍾，臉上紅也不紅！」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 233
        "line_end": 233
    "translation_ja": |-
      青毛獅子怪は聞いて、怖くないとは言いながらも内心おびえ、やむなく虚勢を張って叫んだ。
      青毛獅子怪「弟たち、恐れるな。わしの薬酒を持ってこい。何杯か飲み下して、猿めを毒で殺してやろう。」
      悟空はひそかに笑って思った。
      悟空「この俺は五百年前、天宮で大暴れしたとき、老君の丹、玉皇（ぎょくこう）の酒、王母（おうぼ）の桃、鳳の髄や竜の肝まで、食わなかったものなどあったか。どんな薬酒だか知らないが、よくも俺を毒殺しようなどと思うものだ。」
      小妖は本当に薬酒を二壺温め、杯いっぱいに注いで青毛獅子怪に差し出した。青毛獅子怪が受け取ると、腹の中の悟空にはもう酒の香りが届いた。悟空は言った。
      悟空「こいつには飲ませまい。」
      さすがの悟空、頭をひねってラッパのような口に変え、妖怪の喉の下へ大きく開いた。青毛獅子怪がごくりと呑み下すと、悟空がごくりと受け止めて飲んだ。二杯目を呑み下すと、悟空がまたごくりと受けて飲んだ。続けて七、八杯飲んだが、その全部を悟空が横取りした。青毛獅子怪は杯を置いて言った。
      青毛獅子怪「もう飲まぬ。この酒はいつもなら二杯で腹が火のようになるのに、今は七、八杯飲んでも顔が赤くもならぬぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch75-045"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "原來這大聖吃不多酒，接了他七八鍾吃了，在肚裡撒起酒風來：不住的支架子、跌四平、踢飛腳、抓住肝花打鞦韆、豎蜻蜓、翻根頭、亂舞。那怪物疼痛難禁，倒在地下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 235
        "line_end": 235
    "translation_ja": "もともと悟空は、それほど酒を飲めない。七、八杯を横取りして飲んだため、腹の中で酒乱を起こした。絶えず武術の構えを取り、手足を上にして仰向けに倒れ、跳び蹴りをし、肝臓をつかんでぶらんこをし、逆立ちをし、とんぼ返りをし、でたらめに舞い踊った。青毛獅子怪は痛みに耐えられず、地面へ倒れた。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-046"
    "section_id": "chapter-75"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知死活如何，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 237
        "line_end": 237
    "translation_ja": "さて、生きたか死んだか、その行方は次回の解き明かしをお聞きいただこう。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-01-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の回題は『魔主一作「王」還歸大道真』。主の字を王とする異文注も本文に残した。回題の予告であって、本文の結末を編集者が補ったものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-02-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『屣成氈片』。屣の働きには解釈の余地があるが、踏みつけられた人の髪が毛氈のようになると読んだ。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-03-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "中央の大王の名と獅子の姿が、この詩末で明かされる。青毛は青みがかった毛の意。これまで登場した別の獅子の妖怪や、特定の神仏の乗物とは、この記述だけで同定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-04-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『藏齒修身多年』。牙を隠すという字面を保持した。隠す理由や修練の具体的な方法は、本文からは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-05-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "左の大王が、黄色い牙を持つ年老いた象の妖怪であると、この詩末で明かされる。持ち主や来歴については補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-06-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "第三の大王を表す詩の呼称。前回すでに知らされた雲程万里鵬と同じ人物なので、同一性が分かるよう訳文でも結び付けた。鵬魔王など他の鳥の名を持つ妖怪と同一視しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-07-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は三人の大王が小鑽風に呼びかけた後、話者を再記せずこの問いを続ける。訳では前の三人の問いを受けるものとした。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-08-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "人への変化では頭と顔しか変わらないという説明を、原文どおり残した。他の場面の変身描写との整合を取るために、制約を弱めたり説明を足したりはしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-09-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この台詞の話者は直前からの第一の大王として訳した。前回では瓶は第三の大王の宝として説明されているが、『我寶瓶』という今回の発言を別の所有関係へ修正してはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-10-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原語『孤拐』には頬の骨や足のくるぶしを指す語義がある。ここは焼けて足が不自由になる懸念と結び付くため、くるぶしと訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-11-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の字は金鋼鑽。金剛石を用いて玉などに穴をあける錐をいう。金箍棒など別の宝物と取り違えない。『鋼』を『剛』へ無断で校訂しなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-12-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『才變化出身』。出ようと思っただけの未遂へ弱めず、身を抜け出させる変化を行った表現として訳した。動作の順序を読みやすく組み替える補訂はしていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-13-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原語は『勉強的小妖』。力を出す、無理をする、気を奮い立たせるなどの読みがあり、ここでは思い切って行動する小妖とした。格別の怪力を持つという設定までは足していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-14-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の対句は『空者控也』『颼者走也』。似た音と意味をもじり、瓶が空だという声へ、すっかり逃げたとの言葉を返す。日本語では『空っぽ・ぽっかり』『すっ飛んで・すたこら』と調子を対応させた。原字を別の異文に置き換えてはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-15-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『腰束龍絛有見機』。後半は解釈の定めにくい表現で、機を見て手際よくするという意味に取った。帯に未知の機械や特別な機能が備わるとは解していない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-16-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は四斗であり、五斗へ改めていない。四方の斗に関わる星神と読めるが、構成する個々の神名はここで列挙されない。旧来の五斗星君と同じ集合だとは確定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-17-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原語は『扢搭板筋鋪』。ごつごつした筋が周囲に敷かれるという字面を採った。身体の特定の解剖学的組織まで確定する表現ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-18-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここでは既出の天界の帝である玉帝の称号として扱った。長詩全体は悟空自身による棒の威力の自慢で、すべてを語り手の独立した事実認定にはしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-19-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の表記を保持した。太歳の剣として比較に挙げられるが、名の由来や他の剣名との異同は確認できていない。別字の剣名へ推測で改めなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-20-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本は「虎頭性子」。教育部『重編國語辭典修訂本』の「嘑頭」は、この場面を用例に挙げ、向こう見ずなことと説明する。辞書の引用は底本と字が異なるが、後続の「冒冒失失的諕人」とも合わせ、性分を述べる語として訳した。原文欄の「虎頭」は変えていない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-21-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『我就不曾吩咐你』。この言い回しには反語的に読む余地もあるが、ここでは文字どおり、まだ言い聞かせていなかったという言い方に取った。すでにこの忠告をした出来事を創作してはいない。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-22-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の『廣裡』は、教育部の辞書がこの箇所を例に広州の意とする。語義に沿って訳したが、広州を実際に通った旅程が別に確認できたという意味ではない。これは腹の中から脅す悟空の発言である。"
    "translation_status": "reviewed"
  - "id": "xy-ch75-note-23-body"
    "section_id": "chapter-75"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原語『跌四平』は、教育部の辞書がこの箇所を例に、四肢を上に向けて倒れる意とする。別の武術用語である『大四平』の構えと混同しない。"
    "translation_status": "reviewed"

    "source_text": |-
      生就銅頭鐵腦蓋，天地乾坤世上無。
      斧砍鎚敲不得碎，幼年曾入老君爐。
      四斗星官監臨造，二十八宿用工夫。
      水浸幾番不得壞，周圍扢搭板筋鋪。
      唐僧還恐不堅固，預先又上紫金箍。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch75-2093000"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第075回&oldid=2093000"
        "line_start": 173
        "line_end": 177
    "translation_ja": |-
      悟空「生まれつき銅の頭に鉄の頭蓋、天地乾坤（けんこん）、この世に並ぶものはない。
      斧で斬っても槌で叩いても砕けず、若いころ老君（ろうくん）の炉にも入った。
      四斗星官（しとせいかん）が見張って造り、二十八宿（にじゅうはっしゅく）が手間をかけた。
      幾たび水に漬かっても壊れず、周りはごつごつした平たい筋で覆われる。
      それでも唐僧は丈夫さを心配し、前もって紫金箍（しきんこ）まではめたのだ。」

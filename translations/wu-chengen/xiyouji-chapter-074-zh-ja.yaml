    "source_text": "好大聖，捻著訣，念個咒，搖身一變，變做個蒼蠅兒，輕輕飛在他帽子上，側耳聽之。只見那小妖走上大路，敲著梆，搖著鈴，口裡作念道：「我等巡山的，各人要謹慎隄防孫行者，他會變蒼蠅。」行者聞言，暗自驚疑道：「這廝看見我了？若未看見，怎麼就知我的名字，又知我會變蒼蠅？」原來那小妖也不曾見他，只是那魔頭不知怎麼就吩咐他這話，卻是個謠言，著他這等胡念。行者不知，反疑他看見，就要取出棒來打他，卻又停住，暗想道：「曾記得八戒問金星時，他說老妖三個，小妖有四萬七八千名。似這小妖，再多幾萬，也不打緊。卻不知這三個老魔有多大手段。等我問他一問，動手不遲。」"

    "translation_ja": |-
      悟空はひと声口笛を吹き、觔斗雲（きんとうん）に乗って、高い峰へ跳び上がった。藤につかまり、葛のつるに身を預けて、山を見渡す。山の中はしんとして、人影がない。思わず声を出した。
      悟空「しまった、しまった。あの太白金星のじいさんを行かせるんじゃなかった。あいつは俺を脅したんだ。ここにどんな妖怪がいるっていうんだ。外へ出て気ままに遊ぶにしても、槍や棒を振るい、武芸の稽古くらいするだろう。それが、どうして一匹もいない。」
      独りで考えを巡らせていると、山の向こうから、ちりんちりん、かんかん、からからという、拍子木と鈴の音が聞こえた。急いで振り向くと、一匹の小妖だった。「令」の字の旗を一本担ぎ、腰に鈴を下げ、手で拍子木を打ちながら、北から南へ歩いている。よく見れば、背丈は一丈二尺もあった。悟空は心の中で笑った。
      悟空「きっと駅の使いの兵だろう。公文書や知らせの札を届けるんだな。ひとつ近づいて聞いてみよう。どんなことを言っているかな。」

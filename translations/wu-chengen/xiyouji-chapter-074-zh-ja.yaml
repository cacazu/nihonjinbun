    "translation_ja": |-
      小妖「まあいい。俺たち見回りは、一班四十人、十班合わせて四百人いる。年も顔も違えば、名や役目もそれぞれだ。大王は、班の順番が乱れて点呼しにくくなるのを心配して、一人ずつ、しるしの札をくださった。お前は札を持っているか。」
      悟空は相手の装いや知らせ方だけを見て、その姿に化けたのだった。札までは見ていなかったので、自分の身にはない。だが、さすがの悟空、ないとは言わず、即座に引き受けた。
      悟空「札がないはずがあるか。ただ、さっき受け取ったばかりの新しい札なんだ。お前のを出して見せてくれ。」
      小妖はこのからくりを知るはずもなく、衣服をたくし上げた。肌につけていた金漆の札に、細糸の組紐を通してある。それを引き出して、悟空に見せた。悟空が見ると、札の裏には「威鎮諸魔」とあり、表には楷書で「小鑽風（しょうさんぷう）」の三文字が書かれていた。悟空は心の中で思った。
      悟空「もう分かった。山の見回りなら、必ず最後に『風』の字がつくんだな。」
      そして言った。
      悟空「服を下ろして、先へ行っていろ。今、俺の札を出して見せる。」
      身を返し、手を差し入れ、尾の先から細い毛を一本抜く。それを指でひと揉みして叫んだ。
      悟空「変われ！」
      たちまち金漆の札となり、同じように緑の細糸の組紐もついた。そこには楷書で「総鑽風（そうさんぷう）」の三文字が書かれている。悟空が取り出して見せると、小鑽風はひどく驚いた。
      小鑽風「俺たちはみんな小鑽風というのに、どうしてお前だけ、何とか総鑽風なんていうんだ。」
      悟空は抜け目なく立ち回り、ぴたりと話を合わせた。
      悟空「本当に知らないんだな。大王は俺の火の焚き方がうまいのを見て、見回り役に昇進させた。そのうえ新しい札をくださり、『総巡風（そうじゅんぷう）』と呼んで、お前たちこの一班、四十人を監督させたんだ。」
      小鑽風はそれを聞くと、慌てて礼をした。
      小鑽風「長官、長官、新しく任命された方でしたか。道理で見慣れぬお顔でした。失礼なことを申し上げました。お咎めなさらないでください。」
      悟空は礼を返し、笑った。
      悟空「咎めはしないが、一つだけ。顔合わせの祝い金はもらうぞ。一人ずつ五両出してもらおう。」
      小鑽風「長官、お急ぎなさいますな。南の嶺でこの班の者たちと合流してから、まとめてお納めします。」
      悟空「それなら、俺も一緒に行こう。」
      小鑽風は本当に先に立って歩き、悟空は後からついていった。

    "translation_ja": |-
      八戒は熊手を腰に差し、黒い直裰を整え、もじもじしながら、山の斜面を駆け上がった。老人に呼びかける。
      八戒「おじいさん、ご挨拶申し上げます。」
      老人は、悟空が帰ったので、ようやく杖を支えに起き上がり、震えながら立ち去ろうとしていた。そこへ急に八戒を見たものだから、いよいよ恐ろしくなった。
      老人「ああ、何ということじゃ！　今夜はいったいどんな悪夢を見たのか、こんな恐ろしい連中に出会うとは。先ほどの坊主も醜いには醜いが、それでも三分は人間らしかった。こちらの坊主はどうじゃ、この臼の杵のような口、蒲団扇のような耳、鉄板のような顔、剛毛の生えた首。人間らしさが一分もないではないか。」
      八戒は笑った。
      八戒「このおじいさんは、思ったことを隠さないね。人の品定めが好きと見える。俺をどう見ているんだい。醜いには醜いが、見飽きない顔だよ。もう少し見ていれば、男前になるさ。」
      老人は人の言葉を話すのを見て、やむなく口を開いた。
      老人「どこから来たのじゃ。」
      八戒「唐僧（とうそう）の二番弟子で、法名は悟能八戒（ごのうはっかい）といいます。さっき尋ねに来たのは悟空行者（ごくうぎょうじゃ）、俺の兄弟子です。師匠が、あいつはおじいさんに失礼をして、確かな話を聞いてこなかったと叱ったものですから、わざわざ俺にお尋ねに来させました。ここは本当は何という山、何という洞でしょう。洞にいるのは何の妖怪でしょう。西へ行く大道はどちらでしょう。どうかお教えください、お教えください。」
      老人「正直に聞くつもりかね。」
      八戒「生まれてこのかた、ほんの少しでも嘘をつく勇気なんてありません。」
      老人「さっき来た坊主のように、口先で調子よくでたらめを並べて、からんではならぬぞ。」
      八戒「あいつとは違いますよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-012"
    "section_id": "chapter-74"
    "kind": "paragraph"

    "source_text": "不數里，忽見一座筆峰。何以謂之筆峰？那山頭上長出一條峰來，約有四五丈高，如筆插在架上一般，故以為名。行者到邊前，把尾巴掬一掬，跳上去，坐在峰尖兒上。叫道：「鑽風，都過來。」那些小鑽風在下面躬身道：「長官，伺候。」行者道：「你可知大王點我出來之故？」小妖道：「不知。」行者道：「大王要吃唐僧，只怕孫行者神通廣大，說他會變化，只恐他變作小鑽風，來這裡屣著路徑，打探消息，把我陞作總鑽風，來查勘你們這一班可有假的？」小鑽風連聲應道：「長官，我們俱是真的。」行者道：「你既是真的，大王有甚本事，你可曉得？」小鑽風道：「我曉得。」行者道：「你曉得，快說來我聽。如若說得合著我，便是真的；若說差了一些兒，便是假的，我定拿去見大王處治。」那小鑽風見他坐在高處，弄獐弄智，呼呼喝喝的，沒奈何，只得實說道：「我大王神通廣大，本事高強，一口曾吞了十萬天兵。」行者聞說，吐出一聲道：「你是假的。」小鑽風慌了道：「長官老爺，我是真的，怎麼說是假的？」行者道：「你既是真的，如何胡說？大王身子能有多大，一口就吞了十萬天兵？」小鑽風道：「長官原來不知。我大王會變化，要大能撐天堂，要小就如菜子。因那年王母娘娘設蟠桃大會，邀請諸仙，他不曾具柬來請，我大王意欲爭天，被玉皇差十萬天兵來降我大王。是我大王變化法身，張開大口，似城門一般，用力吞將去。諕得眾天兵不敢交鋒，關了南天門。故此是一口曾吞十萬兵。」行者聞言，暗笑道：「若是講手頭之話，老孫也曾幹過。」又應聲道：「二大王有何本事？」小鑽風道：「二大王身高三丈，臥蠶眉，丹鳳眼，美人聲，匾擔牙，鼻似蛟龍。若與人爭鬥，只消一鼻子捲去，就是鐵背銅身，也就魂亡魄喪。」行者道：「鼻子捲人的妖精也好拿。」又應聲道：「三大王也有幾多手段？」小鑽風道：「我三大王不是凡間之怪物，名號雲程萬里鵬。行動時，摶風運海，振北圖南。隨身有一件兒寶貝，喚做陰陽二氣瓶。假若是把人裝在瓶中，一時三刻，化為漿水。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      数里も行かぬうちに、筆峰（ひっぽう）が一つ見えた。なぜ筆峰というのか。山の頂から一本の峰が、四、五丈ほど高く突き出しており、筆を台に差したように見える。それで、そう名づけられたのだ。悟空は近くまで来ると、尾をひょいと持ち上げ、跳び乗って、峰の先端に腰を下ろした。そして呼んだ。
      悟空「鑽風（さんぷう）ども、みんな来い。」
      小鑽風たちは下で身をかがめた。
      小鑽風たち「長官、控えております。」
      悟空「大王が俺を任命したわけを知っているか。」
      小鑽風「存じません。」
      悟空「大王は唐僧を食いたいのだが、孫行者の神通力が大きいのを心配している。あいつは変化ができるというから、小鑽風に化けて、ここで道を探り、消息を聞き出すかもしれない。それで俺を総鑽風に昇進させ、お前たちのこの班に、偽物がいないかを調べさせるのだ。」
      小鑽風は繰り返し答えた。
      小鑽風「長官、私どもはみな本物です。」
      悟空「本物なら、大王にどんな力があるか、知っているか。」
      小鑽風「存じております。」
      悟空「知っているなら、早く話して聞かせろ。俺の知っていることと合っていれば、本物だ。少しでも違えば、偽物だと決めて大王のもとへ引っ立て、処罰していただく。」
      小鑽風は、悟空が高いところに座って利口ぶり、大声で威張るのを見て、やむなくありのままに話した。
      小鑽風「大王は神通力が広大で、腕前も並外れております。かつてひと口で十万の天兵を呑み込まれました。」
      悟空は聞くと、ひと声吐き出した。
      悟空「お前は偽物だ。」
      小鑽風はうろたえた。
      小鑽風「長官さま、私は本物です。どうして偽物とおっしゃるのです。」
      悟空「本物なら、なぜでたらめを言う。大王の体がどれほど大きければ、十万の天兵をひと口で呑めるのだ。」
      小鑽風「長官はご存じなかったのですね。大王は変化がおできになります。大きくなろうとなされば天の堂を支えるほど、小さくなろうとなされば菜種のようになれます。ある年、王母娘娘（おうぼにゃんにゃん）が蟠桃大会（ばんとうたいえ）を開いて仙人方をお招きになったのに、うちの大王には招待状をくださいませんでした。そこで大王が天を奪おうとなさり、玉皇（ぎょくこう）は十万の天兵を差し向けて、大王を降そうとしたのです。大王は法身（ほっしん）を変え、城門のような大口を開き、力いっぱい呑み込もうとなさいました。天兵どもは怖がって戦おうともせず、南天門（なんてんもん）を閉めてしまいました。ですから、ひと口で十万の兵を呑んだというのでございます。」
      悟空は聞くと、心の中で笑った。
      悟空「腕っぷしの話なら、この俺だってやったことだ。」
      そのまま声に出して尋ねた。
      悟空「二の大王には、どんな力がある。」
      小鑽風「二の大王は身の丈三丈。横たわる蚕のような眉、丹鳳眼（たんぽうがん）、美人の声を持ち、天秤棒のような牙があり、鼻は蛟竜（こうりゅう）に似ています。人と争う時は、その鼻でひと巻きするだけで、鉄の背、銅の体を持つ者でも、魂魄が滅びてしまいます。」
      悟空「鼻で人を巻く妖怪なら、捕まえるのもたやすい。」
      さらに尋ねた。
      悟空「三の大王は、どれほどの腕前だ。」
      小鑽風「三の大王は、人間界の怪物ではございません。名を雲程万里鵬（うんていばんりほう）といいます。動く時は風を巻いて海を渡り、北から羽ばたいて南を目指すのです。いつも宝物を一つ身につけています。陰陽二気瓶（いんようにきへい）というものです。人をその瓶に入れれば、一時三刻（いちじさんこく）のうちに、とろとろの汁に変わってしまいます。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-021"

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-002"
      "description_ja": "冒頭の「情慾原因總一般」「自如然」は、情と欲が同じ根からおのずと生じるものとして訳した。「如然」の語形を別字へ直してはいない。情欲を肯定するだけでなく、それを断ち忘れる禅の教えへ転ずる詩である。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-004"
      "description_ja": "「莎」はハマスゲ類の草、「黃葵」は黄色い葵類の花として訳した。植物の厳密な種・品種を確定したものではない。「蒲柳」は蒲と柳を併せた表現として残した。末句の「應律」は季節の移りにかなうこと。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-007"
      "description_ja": "原文は「十一大曜」「八洞仙」「十地閻君」。星神十一柱と仙人の一群、冥界の王たちを列挙するが、各構成員をこの箇所では列挙しない。「十地」を菩薩の修行の十段階という別の語義へ結びつけず、冥界の王の集合として読んだ。老人が述べる妖魔の交友関係であり、語り手自身の保証に変えていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-008"
      "description_ja": "冥界での暴挙と署名を伴う臣従の約束は、悟空自身の自慢話として述べられている。鬼判を傷つけ、閻王を驚かせ、森羅殿を「ほとんど」ひっくり返した、という行為と程度を区別した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-008"
      "description_ja": "原文の「一萬個七八歲」は、七、八歳を一万倍するという誇張。作品の別の箇所にある年齢へ合わせて数値を直していない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-011"
      "description_ja": "原文の時詞は「今夜」。昼間の旅の会話として滑らかにするために「昨夜」へ校訂せず、訳にも残した。「\U00023BA4」は固定版本文の珍字で、全字庫はU+23BA4と中国音zōngを示す。漢典では鬃の異体字として扱われるため、首に生えた剛毛と解した。原字は対訳の原文欄に保持。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-011"
      "description_ja": "「不藏興」は字面と直後の「好褒貶人」から、思ったことを隠さず人の容貌を評することとして訳した。句全体を直接説明する確かな辞書項目は未確認で、方言的な細部には留保がある。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-012"
      "description_ja": "列挙された数は、五千＋五千＋一万＋一万＋四、五千＋一万で四万四、五千となり、さらに火焚きと薪採りが数知れずいる。原文の総数「四萬七八千」とは厳密に一致しないが、計算に合わせて書き換えなかった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-013"
      "description_ja": "老人の「獅駝嶺」「四萬七八千」を、八戒は「獅駝山」「四萬八千」と伝えている。その言い換えと数の差を保持した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-013"
      "description_ja": "「半夜」は夜中、あるいは半晩とも取れる。ここは夜中までという読みを採った。悟空がこれから行えると自慢する話であり、実際の殺害や戦闘経過としては記さない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-014"
      "description_ja": "老人の正体が太白金星と判明した後、悟空はその「小名」である李長庚を繰り返し呼ぶ。小名は親しみのある個人的な名の意として残し、すでに出ている太白金星と別人にしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-015"
      "description_ja": "「以告者，過也」は『論語』憲問の句を踏まえる。『朱子語類』巻四十四の「子問公叔文子章」にも、公明賈のこの言葉と、人物評が過大になったことへの説明が見える。ここでは悟空が、知らせを大げさなものと受け取って師を安心させるために用いている。参照：https://zh.wikisource.org/wiki/朱子語類/044 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-015"
      "description_ja": "原文の「執結」は、官署などに差し出す保証の文書。悟空は、妖怪を捕らえて事情を確認し、こうした書面を出させるつもりだと話している。現に書面を得たことにはしない。参照：https://zdic.net/hans/执结 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-015"
      "description_ja": "「東洋大海也湯開路」「鐵裹銀山也撞透門」は大言の対句。「湯」は固定版の字を保ち、水を分けて道を開く趣旨として訳した。「銀山」は銀の山のまま残し、鉄囲山など別の仏教地名へ補訂していない。まだ行っていないことへの豪語である。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-017"
      "description_ja": "「謠言」はここでは、小妖に言い触らさせる文句と読んだ。語り手は、小妖が実際に悟空を見たわけではないと明記している。悟空自身が、自分の変装を見破られた証拠だと誤認する仕掛けを残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-019"
      "description_ja": "「真字」は、草書に対する楷書の字という読みを採った。「小鑽風」の名は、この札を悟空が見た位置で初めて示す。「威鎮諸魔」は、威勢でさまざまな魔物を鎮める、という札の裏の文句。「絨線」は細い糸の意に取り、羊毛と限定しない。漢典の「絨」には刺繍用の細い絹糸などの語義がある。参照：https://zdic.net/hant/絨 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-019"
      "description_ja": "悟空が作った札は「總鑽風」だが、昇進を説明する台詞では「總巡風」となる。底本の表記の差を残した。大王が実際に任命したのではなく、悟空がその場で作った身分と説明である。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-020"
      "description_ja": "小鑽風は初めに十万の天兵を「呑んだ」と言い、詳しい説明では、大口で呑み込もうとすると天兵が恐れて南天門を閉めた、と語る。実際に全員を胃へ入れた話へ補わず、最初と最後の誇張も取り去っていない。「法身」は、仏の真実の身をいう宗教語を、ここでは変化して現す身体に用いている。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-020"
      "description_ja": "「手頭之話」は文脈から、実力・腕前をめぐる話として訳した。中国語の「手頭」には手近な物事や自分で行う働きなど幅があり、この句全体の慣用的な語義の直接確認には至っていない。底本の「手頭」を別語へ改めない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-020"
      "description_ja": "「摶風運海，振北圖南」は、風に乗り北から南へ向かう鵬の飛翔を語る表現。名の「雲程萬里鵬」と合わせて羽ばたきと長い行程を残した。ここで語られていない来歴・身元・他の人物との関係は補わない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-021"
      "description_ja": "城の王、文武の官僚、城中の老若男女が全員食われたという話、五百年前・西へ四百里という数、三人が結んだ義兄弟の関係は、小鑽風の説明として保持した。唐僧の肉で不老長生を得るという伝聞も、この物語内の言説である。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-022"
      "description_ja": "「左右是左右」は、してしまったことを投げやりに受け止める言い回しとして訳した。悟空は小鑽風を実際に肉塊へ押し潰して殺し、それから親切に話してくれた相手だったと悔いている。殴っただけ、殺そうとしただけ、という描写へ弱めていない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-024"
      "description_ja": "原文は旗についても「四十名」と、人を数える字を用いる。そこで長旗を持つ者四十名と読んだ。二百五十名を一隊とし、四十の隊で一万という推算を保持し、原文の「名」を「本」へ書き換えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-025"
      "description_ja": "「蟲」は古く動物全般にも用いる語で、現代の昆虫だけに限定しない。特定の種には決めず、原文の列挙を保った。参照：https://zdic.net/hant/蟲。楚歌によって軍が離散するという古典的な比喩。原文は「八千兵」であり、別の史書の具体的な場面の兵数へ合わせて補訂しない。「鋪頭話」は見栄を張る、大きなことを言う言葉の意で、ここでは「はったり」とした。参照：https://pedia.cloud.edu.tw/Entry/Detail/?search=散&title=鋪頭話 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch74-1500622"
      "segment_ids":
        - "xy-ch74-026"
      "description_ja": "「老妖是死了」は、この時点で親玉が本当に死んだという語り手の説明ではなく、門番を追い払った悟空の勝ち誇った見通し。これから対面しようとする文脈に従い、「死んだも同然」とした。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

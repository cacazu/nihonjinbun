    "source_text": "小妖道：「也罷；我們這巡山的，一班有四十名，十班共四百名，各自年貌，各自名色。大王怕我們亂了班次，不好點卯，一家與我們一個牌兒為號。你可有牌兒？」行者只見他那般打扮，那般報事，遂照他的模樣變了；因不曾看見他的牌兒，所以身上沒有。好大聖，更不說沒有，就滿口應承道：「我怎麼沒牌？但只是剛才領的新牌。拿你的出來我看。」那小妖那裡知這個機關，即揭起衣服，貼身帶著個金漆牌兒，穿條絨線繩兒，扯與行者看看。行者見那牌背是個「威鎮諸魔」的金牌，正面有三個真字，是「小鑽風」。他卻心中暗想道：「不消說了，但是巡山的，必有個『風』字墜腳。」便道：「你且放下衣走過，等我拿牌兒你看。」即轉身，插下手，將尾巴梢兒的小毫毛拔下一根，捻他把，叫：「變！」即變做個金漆牌兒，也穿上個綠絨繩兒，上書三個真字，乃「總鑽風」。拿出來，遞與他看了。小妖大驚道：「我們都叫做個小鑽風，偏你又叫做個甚麼『總鑽風』。」行者幹事找絕，說話合宜，就道：「你實不知。大王見我燒得火好，把我陞個巡風；又與我個新牌，叫做『總巡風』，教我管你這一班四十名兄弟也。」那妖聞言，即忙唱喏道：「長官，長官，新點出來的，實是面生，言語衝撞，莫怪。」行者還著禮笑道：「怪便不怪你，只是一件：見面錢卻要哩，每人拿出五兩來罷。」小妖道：「長官不要忙，待我向南嶺頭會了我這一班的人，一總打發罷。」行者道：「既如此，我和你同去。」那小妖真個前走，大聖隨後相跟。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"

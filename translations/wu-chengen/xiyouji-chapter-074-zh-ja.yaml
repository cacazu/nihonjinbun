        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 159
        "line_end": 159
    "translation_ja": |-
      悟空は心の中で喜んだ。
      悟空「よし、親玉はもう死んだも同然だ。話を聞いただけで逃げる連中が、どうして顔を突き合わせて戦える。中へ入っても、同じことを言うのがよい。違うことを言って、さっきの小妖の一匹二匹が逆に中へ入って聞いていたら、こちらのからくりが漏れてしまうではないか。」
      ごらんなさい。心を定めて古い洞へ来たり、胆を据えて奥深い門へ入っていく。

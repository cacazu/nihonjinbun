    "translation_status": "reviewed"
  - "id": "xy-ch74-002"
    "section_id": "chapter-74"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      情慾原因總一般，有情有慾自如然。
      沙門修煉紛紛士，斷慾忘情即是禪。
      須著意，要心堅，一塵不染月當天。
      行功進步休教錯，行滿功完大覺仙。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 122
        "line_end": 125
    "translation_ja": |-
      情と欲とは、もとをただせば同じもの。
      情があり欲があるのは、おのずからそうなるもの。
      仏門には修行する者が大勢いるが、
      欲を断ち情を忘れることこそ禅（ぜん）である。
      心を配れ、志を固く保て。
      塵ひとつ染みつかぬ心は、中天にかかる月。
      功を積み、道を進むにも、踏み違えてはならぬ。
      行いが満ち、功が成れば、大いなる悟りの仙となる。
    "translation_status": "reviewed"
  - "id": "xy-ch74-003"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話表三藏師徒們打開慾網，跳出情牢，放馬西行。走不多時，又是夏盡秋初，新涼透體。但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 127
        "line_end": 127
    "translation_ja": "さて、三蔵（さんぞう）の師弟一行は欲の網を打ち破り、情の牢を抜け出して、馬を進め、西へ向かった。そう長く歩かぬうちに、また夏が尽きて秋の初めとなり、新たな涼気が身にしみた。見れば、こんな景色である。"
    "translation_status": "reviewed"
  - "id": "xy-ch74-004"
    "section_id": "chapter-74"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      急雨收殘暑，梧桐一葉驚。
      螢飛莎徑晚，蛩語月華明。
      黃葵開映露，紅蓼遍沙汀。
      蒲柳先零落，寒蟬應律鳴。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 129
        "line_end": 132
    "translation_ja": |-
      激しい雨が残暑を洗い去り、
      アオギリの一葉に、はっと秋を知る。
      夕暮れのハマスゲの小道には蛍が飛び、
      月の光の明るいところ、こおろぎが鳴く。
      黄色い葵の花は露を映して開き、
      赤い蓼は砂州一面を覆う。
      蒲と柳が真っ先にしおれ落ち、
      秋の蝉が時節にかなって鳴いている。
    "translation_status": "reviewed"
  - "id": "xy-ch74-005"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏正然行處，忽見一座高山，峰插碧空，真個是摩星礙日。長老心中害怕，叫悟空道：「你看前面這山十分高聳，但不知有路通行否？」行者笑道：「師父說那裡話，自古道：『山高自有客行路，水深自有渡船人。』豈無通達之理？可放心前去。」長老聞言，喜笑花生，揚鞭策馬而進，徑上高岩。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      三蔵が歩みを進めていると、突然、高い山が一座、目に入った。峰は青空へ突き入り、まさしく星をかすめ、日を遮るほどだった。三蔵は恐ろしくなり、悟空（ごくう）を呼んだ。
      三蔵「前のあの山をごらん。ひどく高くそびえているが、通り抜けられる道があるのだろうか。」
      悟空は笑った。
      悟空「お師匠さま、何をおっしゃいます。昔から『山が高くても旅人の行く道はあり、水が深くても渡しをする人はいる』と言うでしょう。通れないわけがありません。安心してお進みください。」
      それを聞くと、三蔵の顔には花が咲くような笑みが広がった。鞭を上げて馬を促し、そのまま高い岩場へ登っていった。
    "translation_status": "reviewed"
  - "id": "xy-ch74-006"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行不數里，見一老者，鬢蓬鬆，白髮飄搔；鬚稀朗，銀絲擺動；項掛一串數珠子，手持拐杖現龍頭。遠遠的立在那山坡上高呼：「西進的長老，且暫住驊騮，緊兜玉勒。這山上有一夥妖魔，吃盡了閻浮世上人，不可前進。」三藏聞言，大驚失色。一是馬的足下不平，二是坐個雕鞍不穩，撲的跌下馬來，掙挫不動，睡在草裡哼哩。行者近前攙起道：「莫怕，莫怕，有我哩。」長老道：「你聽那高岩上老者報道這山上有夥妖魔，吃盡閻浮世上人，誰敢去問他一個真實端的？」行者道：「你且坐地，等我去問他。」三藏道：「你的相貌醜陋，言語粗俗，怕衝撞了他，問不出個實信。」行者笑道：「我變個俊些兒的去問他。」三藏道：「你是變了我看。」好大聖，捻著訣，搖身一變，變做個乾乾淨淨的小和尚兒，真個是目秀眉清，頭圓臉正；行動有斯文之氣象，開口無俗類之言辭。抖一抖錦衣直裰，拽步上前，向唐僧道：「師父，我看變得好麼？」三藏見了大喜道：「變得好。」八戒道：「怎麼不好？只是把我們都比下去了。老豬就滾上二三年，也變不得這等俊俏。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 135
        "line_end": 135
    "translation_ja": |-
      数里も行かぬうちに、一人の老人が見えた。鬢はふさふさして白髪が風に揺れ、まばらな髭には銀の糸がなびいている。首には数珠を一連かけ、手には竜の頭をかたどった杖をついていた。遠くの山の斜面に立ち、大声で呼びかけた。
      老人「西へ行かれる長老、ひとまず駿馬を止め、手綱をしっかりお引きなされ。この山には妖魔の一団がおる。閻浮（えんぶ）の世の人を食い尽くしてしまった連中じゃ。進んではならぬ。」
      三蔵は聞くなり顔色を失った。馬の足元が平らでなかったうえ、彫り物のある鞍の上でも体が安定していなかったので、どさりと馬から落ちた。もがいても動けず、草の中に横たわってうめいている。悟空はそばへ寄って抱き起こした。
      悟空「怖がらないで、怖がらないで。私がいます。」
      三蔵「あの高い岩の上の老人の話を聞いただろう。この山には妖魔の一団がいて、閻浮の世の人を食い尽くしたという。誰か、恐れずに行って、確かな事情を聞いてくれる者はいないか。」
      悟空「ここにお座りください。私が聞いてきます。」
      三蔵「お前は顔つきが醜く、言葉遣いも乱暴だ。あの方に失礼をして、本当の話が聞けないのではないか。」
      悟空は笑った。
      悟空「それなら、もう少し器量のよい姿に化けて聞いてきます。」
      三蔵「では、変わって見せておくれ。」
      さすがは悟空。指で印を結び、身を震わせると、さっぱりと清らかな小坊主に変わった。目は美しく、眉はすっきりし、頭は丸く、顔立ちは整っている。動けば物静かで上品な趣があり、口を開けば卑俗な言葉など一つも出ない。錦の直裰（ちょくたつ）をぱっと振るい、ゆったり歩み寄って、三蔵に言った。
      悟空「お師匠さま、どうです。うまく化けられましたか。」
      三蔵は見ると大いに喜んだ。
      三蔵「よく化けた。」
      八戒（はっかい）「よくないはずがあるか。俺たちはみんな見劣りするじゃないか。この俺が二年も三年も転げ回ったって、こんな男前には化けられないよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-007"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，躲離了他們，徑直近前，對那老者躬身道：「老公公，貧僧問訊了。」那老兒見他生得俊雅，年少身輕，待答不答的，還了他個禮，用手摸著他頭兒，笑嘻嘻問道：「小和尚，你是那裡來的？」行者道：「我們是東土大唐來的，特上西天拜佛求經。適到此間，聞得公公報道有妖怪，我師父膽小怕懼，著我來問一聲：端的是甚妖精，他敢這般短路？煩公公細說與我知之，我好把他貶解起身。」那老兒笑道：「你這小和尚年幼，不知好歹，言不幫襯。那妖魔神通廣大得緊，怎敢就說貶解他起身？」行者笑道：「據你之言，似有護他之意，必定與他有親，或是緊鄰契友；不然，怎麼長他的威智，興他的節概，不肯傾心吐膽說他個來歷？」公公點頭笑道：「這和尚倒會弄嘴。想是跟你師父遊方，到處兒學些法術，或者會驅縛魍魎，與人家鎮宅降邪。你不曾撞見十分狠怪哩。」行者道：「怎的狠？」公公道：「那妖精一封書到靈山，五百阿羅都來迎接；一紙簡上天宮，十一大曜個個相欽。四海龍曾與他為友，八洞仙常與他作會；十地閻君以兄弟相稱，社令、城隍以賓朋相愛。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      悟空は仲間から離れ、まっすぐ老人の前へ進むと、身をかがめて挨拶した。
      悟空「おじいさん、僧の私からご挨拶申し上げます。」
      老人は、目の前の者が器量よく雅びで、年若く身軽なのを見て、答えるでもないようなそぶりで礼を返した。そして頭をなで、にこにこしながら尋ねた。
      老人「小坊主、どこから来たのかね。」
      悟空「私たちは東土（とうど）の大唐（だいとう）から参りました。西天（さいてん）で仏さまを拝み、経を求めに行くところです。ちょうどここへ着いたところで、おじいさんが妖怪のことをお知らせくださるのを聞きました。師は気が小さく、怖がって、私を問い合わせに寄こしたのです。いったい何の妖怪が、そんなふうに道を塞いでいるのでしょう。どうか詳しくお教えください。私が退治して、よそへ追い払ってやりますから。」
      老人は笑った。
      老人「まだ幼い小坊主で、物のよしあしも分からず、口の利きようも心得ておらぬ。あの妖魔は、ひどく広大な神通力を持っておる。どうして、いきなり退治して追い払うなどと言えるのかね。」
      悟空も笑った。
      悟空「その言い方では、妖怪をかばっているように聞こえますね。きっと親戚か、すぐ隣に住む親友なのでしょう。そうでなければ、どうしてあいつの威勢や知恵を持ち上げ、気概をあおるばかりで、腹を割って来歴を話してくださらないのです。」
      老人はうなずいて笑った。
      老人「この坊主、口だけは達者じゃな。師について諸国を巡り、あちこちで少しばかり術を覚えたのだろう。魍魎（もうりょう）を追い払い、縛り、人の家を鎮めて邪を降すくらいはできるのかもしれぬ。だが、本当に恐ろしい妖怪には出会ったことがないのじゃ。」
      悟空「どんなふうに恐ろしいんです。」
      老人「あの妖怪が霊山（れいざん）へ手紙を一通送れば、五百の阿羅漢（あらかん）がみな迎えに出る。天宮（てんきゅう）へ書状を一枚届ければ、十一大曜（じゅういちたいよう）が一人残らず敬い重んじる。四海（しかい）の竜とも友となり、八洞（はちどう）の仙人とも常々集う。十地閻君（じゅうちえんくん）とは兄弟と呼び合い、社令（しゃれい）や城隍（じょうこう）とは客、友として親しんでおるのじゃ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-008"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖聞言，忍不住呵呵大笑，用手扯著老者道：「不要說，不要說。那妖精與我後生小廝為兄弟、朋友，也不見十分高作。若知是我小和尚來啊，他連夜就搬起身去了。」公公道：「你這小和尚胡說，不當人子。那個神聖是你的後生小廝？」行者笑道：「實不瞞你說，我小和尚祖居傲來國花果山水簾洞，姓孫，名悟空。當年也曾做過妖精，幹過大事。曾因會眾魔，多飲了幾杯酒睡著，夢中見二人將批勾我去到陰司。一時怒發，將金箍棒打傷鬼判，諕倒閻王，幾乎掀翻了森羅殿。嚇得那掌案的判官拿紙，十閻王簽名畫字，教我饒他打，情願與我做後生小廝。」那公公聞說道：「阿彌陀佛！這和尚說了這過頭話，莫想再長得大了。」行者道：「官兒，似我這般大也夠了。」公公道：「你年幾歲了？」行者道：「你猜猜看。」老者道：「有七八歲罷了。」行者笑道：「有一萬個七八歲。我把舊嘴臉拿出來你看看，你卻莫怪。」公公道：「怎麼又有個嘴臉？」行者道：「我小和尚果有七十二副嘴臉哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      悟空は聞くと、こらえきれず、からからと笑い、老人の手を引いた。
      悟空「もういい、もういい。その妖怪が俺の若い下働きどもと兄弟だの友達だのというなら、たいして偉くもない。俺という小坊主が来たと知れば、夜のうちに荷物をまとめて逃げ出すさ。」
      老人「この小坊主め、でたらめを言うものではない。まったく、けしからん。どの神聖が、あんたの若い下働きだというのじゃ。」
      悟空は笑った。
      悟空「隠さず言うと、俺という小坊主の古くからの住まいは、傲来国（ごうらいこく）、花果山（かかざん）、水簾洞（すいれんどう）。姓は孫（そん）、名は悟空だ。昔は妖怪をしていて、大きなこともやった。妖魔たちを集めた時、酒をいささか飲み過ぎて寝てしまうと、夢の中で二人の使いが召喚状を持ってきて、俺を陰司（いんし）へ引っ張っていった。一時の怒りに任せ、金箍棒（きんこぼう）で鬼や判官を傷つけ、閻王（えんおう）を仰天させて、危うく森羅殿（しんらでん）をひっくり返すところだった。記録を預かる判官が恐れおののいて紙を出し、十人の閻王が署名して花押を据えた。もう殴らないでくれと、進んで俺の若い下働きになると言ったのさ。」
      老人はそれを聞いた。
      老人「阿弥陀仏（あみだぶつ）！　この坊主、そんな大それたことを言ったら、もうこれ以上は大きくなれぬぞ。」
      悟空「ご老人、俺はこのくらいの大きさで十分さ。」
      老人「何歳になるのじゃ。」
      悟空「当ててみなよ。」
      老人「七つか八つというところじゃろう。」
      悟空は笑った。
      悟空「その七つ八つを一万倍したくらいだ。もとの顔を出して見せるから、気を悪くしないでくれよ。」
      老人「どうして、ほかにも顔があるのじゃ。」
      悟空「俺という小坊主には、本当に七十二通りの顔があるんだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-009"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那公公不識竅，只管問他。他就把臉抹一抹，即現出本像，咨牙徠嘴，兩股通紅，腰間繫一條虎皮裙，手裡執一根金箍棒，立在石崖之下，就像個活雷公。那老者見了，嚇得面容失色，腿腳酸麻，站不穩，撲的一跌；爬起來，又一個躘踵。大聖上前道：「老官兒，不要虛驚，我等面惡人善，莫怕，莫怕。適間蒙你好意，報有妖魔。委的有多少怪？一發累你說說，我好謝你。」那老兒戰戰兢兢，口不能言，又推耳聾，一句不應。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 138
        "line_end": 138
    "translation_ja": |-
      老人はからくりが分からず、しきりに尋ねていた。悟空が顔をひとなですると、たちまち本来の姿が現れた。歯をむき、口を突き出し、両の腿は真っ赤。腰には虎皮の裾衣を巻き、手には金箍棒を握って、岩崖の下に立つ姿は、生きた雷公（らいこう）そのものだった。老人はそれを見るなり顔色を失い、足腰がしびれて立っていられず、どたりと転んだ。起き上がって、またよろめいた。悟空はそばへ寄った。
      悟空「ご老人、むやみに驚かないでくれ。俺たちは顔こそ悪いが、心は善良なんだ。怖がるな、怖がるな。さっきは親切に妖魔のことを教えてもらった。本当は、どれだけの妖怪がいるんだい。ついでにそこまで話してくれたら、礼を言うよ。」
      老人はがたがた震えて物も言えず、そのうえ耳が聞こえないふりをして、一言も返さなかった。
    "translation_status": "reviewed"
  - "id": "xy-ch74-010"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見他不言，即抽身回坡。長老道：「悟空，你來了？所問如何？」行者笑道：「不打緊，不打緊。西天有便有個把妖精兒，只是這裡人膽小，把他放在心上。沒事，沒事，有我哩。」長老道：「你可曾問他此處是甚麼山？甚麼洞？有多少妖怪？那條路通得雷音？」八戒道：「師父，莫怪我說。若論賭變化，使促掐，捉弄人，我們三五個也不如師兄；若論老實，像師兄就擺一隊伍，也不如我。」唐僧道：「正是，正是，你還老實。」八戒道：「他不知怎麼鑽過頭不顧尾的問了兩聲，不尷不尬的就跑回來了。等老豬去問他個實信來。」唐僧道：「悟能，你仔細著。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      悟空は老人が口を利かないので、身を返して斜面を下った。
      三蔵「悟空、戻ったか。尋ねた結果はどうだった。」
      悟空は笑った。
      悟空「たいしたことはありません、たいしたことは。西天ですから、一つや二つ妖怪がいるにはいるのでしょう。ただ、このあたりの人は気が小さくて、気にしているだけです。大丈夫、大丈夫。私がいます。」
      三蔵「ここは何という山で、何という洞なのか、妖怪は何匹いるのか、どの道が雷音（らいおん）へ通じるのか、尋ねたかね。」
      八戒「お師匠さま、こう言っても怒らないでくださいよ。変化比べや悪知恵を働かせること、人をからかうことなら、俺たちが三人五人かかっても兄貴にはかないません。だが正直さなら、兄貴みたいなのを一隊並べたって、俺一人にはかないません。」
      三蔵「そのとおり、そのとおり。お前はやはり正直だ。」
      八戒「どうせ兄貴は、頭だけ突っ込んで後先を考えず、二言三言聞いただけで、どうにもはっきりしないまま走って帰ってきたんでしょう。この俺が行って、本当の話を聞いてきます。」
      三蔵「悟能（ごのう）、気をつけて行くのだよ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-011"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好獃子，把釘鈀撒在腰裡，整一整皂直裰，扭扭捏捏，奔上山坡，對老者叫道：「公公，唱喏了。」那老兒見行者回去，方拄著杖掙得起來，戰戰兢兢的要走，忽見八戒，愈覺驚怕道：「爺爺呀！今夜做的甚麼惡夢，遇著這夥惡人？為先的那和尚醜便醜，還有三分人相；這個和尚，怎麼這等個碓梃嘴，蒲扇耳朵，鐵片臉，\U00023BA4毛頸項，一分人氣兒也沒有了？」八戒笑道：「你這老公公不藏興，有些兒好褒貶人。你是怎的看我哩？我醜便醜，奈看，再停一時就俊了。」那老者見他說出人話來，只得開言問他：「你是那裡來的？」八戒道：「我是唐僧第二個徒弟，法名叫做悟能八戒。才自先問的，叫做悟空行者，是我師兄。師父怪他衝撞了公公，不曾問得實信，所以特著我來拜問。此處果是甚山？甚洞？洞裡果是甚妖精？那裡是西去大路？煩公公指示指示。」老者道：「可老實麼？」八戒道：「我生平不敢有一毫虛的。」老者道：「你莫像才來的那個和尚走花溜水的胡纏。」八戒道：「我不像他。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":

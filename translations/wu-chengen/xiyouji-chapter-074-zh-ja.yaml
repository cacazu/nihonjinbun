    "source_text": "行者聽說，心中暗驚道：「妖魔倒也不怕，只是仔細防他瓶兒。」又應聲道：「三個大王的本事，你倒也說得不差，與我知道的一樣。但只是那個大王要吃唐僧哩？」小鑽風道：「長官，你不知道？」行者喝道：「我比你不知些兒。因恐汝等不知底細，吩咐我來著實盤問你哩。」小鑽風道：「我大大王與二大王久住在獅駝嶺獅駝洞。三大王不在這裡住，他原住處離此西下有四百里遠近。那廂有座城，喚做獅駝國。他五百年前吃了這城國王及文武官僚，滿城大小男女也盡被他吃了乾淨，因此上奪了他的江山。如今盡是些妖怪。不知那一年打聽得東土唐朝差一個僧人去西天取經，說那唐僧乃十世修行的好人，有人吃他一塊肉，就延壽長生不老。只因怕他一個徒弟孫行者十分利害，自家一個難為，徑來此處與我這兩個大王結為兄弟，合意同心，打夥兒捉那個唐僧也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      悟空は聞くと、心の中で驚いた。
      悟空「妖魔そのものは怖くないが、あの瓶だけは十分用心しなければ。」
      それから声に出して言った。
      悟空「三人の大王の力は、確かによく話した。俺が知っていることと同じだ。だが、どの大王が唐僧を食おうとしているのだ。」
      小鑽風「長官、ご存じないのですか。」
      悟空は怒鳴った。
      悟空「俺がお前ほども知らないとでもいうのか。お前たちが詳しい事情を知らないと困るから、念入りに問いただせと言いつけられたのだ。」
      小鑽風「一の大王と二の大王は、長年、獅駝嶺の獅駝洞にお住まいです。三の大王は、ここには住んでおられません。もとのお住まいは、ここから西へ四百里ほど離れたところです。そこに城があり、獅駝国（しだこく）といいます。五百年前に、あの方はこの城の国王と文武の役人を食い、城じゅうの男も女も、老いも若きも、一人残らず食い尽くしました。こうして、その国土を奪ったのです。今では妖怪ばかりが住んでいます。いつの年だったか、東土の唐の朝廷が、一人の僧を西天へ経を取りにやったとお聞きになりました。その唐僧は十世にわたって修行した善人で、肉をひとかけら食えば、寿命が延び、長生きして老いないというのです。ただ、その弟子の孫行者がひどく手ごわいのを恐れ、ご自分一人では難しいと思われた。それでここへ来て、うちの二人の大王と義兄弟になり、心と力を合わせ、一緒に唐僧を捕らえようとしているのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-022"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，心中大怒道：「這潑魔十分無禮。我保唐僧成正果，他怎麼算計要吃我的人？」恨一聲，咬響鋼牙，掣出鐵棒，跳下高峰，把棍子望小妖頭上砑了一砑，可憐，就砑得像一個肉陀。自家見了，又不忍道：「咦！他倒是個好意，把些家常話兒都與我說了，我怎麼卻這一下子就結果了他？也罷，也罷，左右是左右。」好大聖，只為師父阻路，沒奈何幹出這件事來。就把他牌兒解下，帶在自家腰裡，將「令」字旗掮在背上，腰間掛了鈴，手裡敲著梆子。迎風捻個訣，口裡念個咒語，搖身一變，變的就像小鑽風模樣。拽回步，徑轉舊路，找尋洞府，去打探那三個老妖魔的虛實。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      悟空は聞くと、心の底から怒りがこみ上げた。
      悟空「このろくでなしの魔物め、なんという無礼だ。俺が唐僧を守って悟りを成就させようとしているのに、どうして俺の仲間を食おうとたくらむ。」
      ひと声憎々しげにうなり、鋼のような歯をぎりっと鳴らすと、鉄棒を抜き、高い峰から跳び下りた。棒で小鑽風の頭をひと押しに押し潰す。哀れなことに、小鑽風は一塊の肉のように潰れてしまった。悟空はそれを見ると、また忍びなくなって言った。
      悟空「ああ、こいつは親切にも、内輪の話をみんな教えてくれたんだ。それなのに、どうして俺は、ひと打ちで殺してしまったんだろう。まあいい、まあいい。こうなってしまったら仕方がない。」
      悟空は、ただ師の行く道を塞がれたため、やむなくこのようなことをしたのである。そこで小鑽風の札を解いて自分の腰につけ、「令」の字の旗を背に担ぎ、鈴を腰に下げ、拍子木を手にした。風に向かって印を結び、口の中で呪文を唱え、身を震わせると、小鑽風そっくりの姿になった。歩みを返し、まっすぐ元来た道をたどって洞を探し、三人の親玉の実力を偵察しに行く。まさに、
    "translation_status": "reviewed"

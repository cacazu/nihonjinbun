    "translation_ja": |-
      悟空は指で印を結び、呪文を唱え、身を震わせると、一匹の蠅に変わった。そっと飛んで小妖の帽子にとまり、耳を澄ます。小妖は大道へ出ると、拍子木を打ち、鈴を鳴らし、口の中で唱えた。
      小妖「俺たち山の見回りは、一人一人よく気をつけて孫行者（そんぎょうじゃ）に用心しろ。あいつは蠅に化けるぞ。」
      悟空はそれを聞き、ひそかに驚き、疑った。
      悟空「こいつ、俺が見えたのか。見えていないなら、どうして俺の名を知っている。それに、蠅に化けられることまで知っているんだ。」
      実のところ、小妖は悟空を見つけたわけではない。ただ、魔王がどうしたわけか、この文句を言い聞かせていたので、触れ言葉として、むやみに唱えているだけだった。悟空はそれを知らず、かえって見つかったのではないかと疑い、棒を出して殴ろうとした。だが、また思いとどまり、心の中で考えた。
      悟空「八戒が太白金星に聞いた時、親玉が三人、小妖が四万七、八千いると言っていたな。この程度の小妖なら、さらに何万匹増えても、たいしたことはない。だが、三人の親玉にどれだけの腕があるかが分からない。こいつに尋ねてからでも、手を下すのは遅くない。」

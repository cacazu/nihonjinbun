    "source_text": "走至二層營裡，又被小妖扯住道：「小鑽風來了？」行者道：「來了。」眾妖道：「你今早巡風去，可曾撞見甚麼孫行者麼？」行者道：「撞見的，正在那裡磨杠子哩。」眾妖害怕道：「他怎麼個模樣？磨甚麼杠子？」行者道：「他蹲在那澗邊，還似個開路神；若站起來，好道有十數丈長。手裡拿著一條鐵棒，就似碗來粗細的一根大杠子，在那石崖上抄一把水，磨一磨，口裡又念著：『杠子啊，這一向不曾拿你出來顯顯神通，這一去就有十萬妖精，也都替我打死，等我殺了那三個魔頭祭你。』他要磨得明了，先打死你門前一萬精哩。」那些小妖聞得此言，一個個心驚膽戰，魂散魄飛。行者又道：「列位，那唐僧的肉也不多幾斤，也分不到我處，我們替他頂這個缸怎的？不如我們各自散一散罷。」眾妖都道：「說得是，我們各自顧命去來。」原來此輩都是些狼蟲虎豹，走獸飛禽，嗚的一聲，都鬨然而去了。這個倒不像孫大聖幾句鋪頭話，卻就如楚歌聲吹散了八千兵。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      第二の陣まで進むと、また小妖が引き止めた。
      小妖「小鑽風、戻ったか。」
      悟空「戻った。」
      小妖たち「今朝、見回りに行って、何とかいう孫行者に出くわしたか。」
      悟空「出くわしたよ。今、あそこで太い棒を磨いている。」
      小妖たちは怖がった。
      小妖たち「どんな姿をしている。何の棒を磨いているんだ。」
      悟空「谷川のそばにしゃがんでいるが、それでも開路神（かいろしん）のようだ。立ち上がったら、ゆうに十数丈はあるだろう。手には鉄棒を一本持っていて、太さは碗ほどの、大きな棒なんだ。岩崖のところで水をひとすくいしては磨き、口ではこう唱えていた。『棒よ、このところお前を出して神通力を見せてやらなかったな。今度は十万の妖怪がいようとも、俺のためにみな打ち殺してくれ。あの三人の魔王を殺して、お前に供えてやろう。』あいつは棒をぴかぴかに磨き上げたら、真っ先に、お前たち門前の一万の妖怪を殴り殺すつもりだぞ。」
      小妖たちはそれを聞いて、一人残らず肝を冷やし、魂が散り飛ぶほどにおびえた。悟空はさらに言った。
      悟空「みんな、唐僧の肉なんて、たいして何斤もないし、俺たちにまで分け前は回ってこない。それなのに、どうしてあいつらに代わって災難をかぶるんだ。いっそ、それぞれ散ってしまおうじゃないか。」
      小妖たちはみな言った。
      小妖たち「そのとおりだ。俺たちは、それぞれ自分の命を守ろう。」
      実のところ、この連中はみな、狼や虫、虎や豹をはじめ、地を走る獣、空を飛ぶ鳥だった。うわっと声を上げ、どっと散っていった。孫大聖（そんたいせい）の二言三言のはったりというより、楚（そ）の歌声が八千の兵を吹き散らしたかのようであった。
    "translation_status": "reviewed"

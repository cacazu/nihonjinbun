    "source_text": "好大聖，唿哨一聲，縱觔斗雲，跳上高峰。扳藤負葛，平山觀看，那山裡靜悄無人。忽失聲道：「錯了，錯了，不該放這金星老兒去了．他原來恐諕我。這裡那有個甚麼妖精？他就出來跳風頑耍，必定拈槍弄棒，操演武藝，如何沒有一個？」正自家揣度，只聽得山背後叮叮噹噹、辟辟剝剝梆鈴之聲。急回頭看處，原來是個小妖兒，掮著一桿「令」字旗，腰間懸著鈴子，手裡敲著梆子，從北向南而走。仔細看他，有一丈二尺的身子。行者暗笑道：「他必是個鋪兵，想是送公文下報帖的。且等我去聽他一聽，看他說些甚話。」"

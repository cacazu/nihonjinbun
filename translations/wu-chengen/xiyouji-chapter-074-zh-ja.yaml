    "source_text": "好大聖，你道他怎麼去問？跳下他的帽子來，釘在樹頭上，讓那小妖先行幾步。急轉身騰那，也變做個小妖兒，照依他敲著梆，搖著鈴，掮著旗，一般衣服，只是比他略長了三五寸，口裡也那般念著。趕上前叫道：「走路的，等我一等。」那小妖回頭道：「你是那裡來的？」行者笑道：「好人呀，一家人也不認得？」小妖道：「我家沒你呀。」行者道：「怎的沒我？你認認看。」小妖道：「面生，認不得，認不得。」行者道：「可知道面生。我是燒火的，你會得我少。」小妖搖頭道：「沒有，沒有。我洞裡就是燒火的那些兄弟，也沒有這個嘴尖的。」行者暗想道：「這個嘴好的變尖了些了。」即低頭，把手侮著嘴揉一揉道：「我的嘴不尖啊。」真個就不尖了。那小妖道：「你剛才是個尖嘴，怎麼揉一揉就不尖了？疑惑人子，大不好認，不是我一家的。少會少會，可疑可疑。我那大王家法甚嚴，燒火的只管燒火，巡山的只管巡山。終不然教你燒火，又教你來巡山？」行者口乖，就趁過來道：「你不知道。大王見我燒得火好，就陞我來巡山。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      さて、悟空はどうやって聞き出したと思われる。帽子から跳び下り、木の梢にぴたりととまって、小妖を何歩か先へやった。それから、くるりと身を返して軽やかに動き、自分も小妖に化けた。相手にならって拍子木を打ち、鈴を鳴らし、旗を担ぎ、衣服もそっくり同じ。ただ、背丈だけは相手より三寸か五寸ほど高く、口でも同じ文句を唱えた。追いついて呼びかける。
      悟空「そこの歩いているの、ちょっと待ってくれ。」
      小妖は振り向いた。
      小妖「どこから来た。」
      悟空は笑った。
      悟空「おいおい、身内の者も見分けられないのか。」
      小妖「俺たちの中に、お前はいないぞ。」
      悟空「いないはずがあるか。よく見てみろ。」
      小妖「知らない顔だ。分からない、分からない。」
      悟空「それで顔なじみじゃないのか。俺は火を焚く係だ。めったに会わないからな。」
      小妖は首を振った。
      小妖「いない、いない。うちの洞で火を焚いている連中にも、こんな口の尖った奴はいないぞ。」
      悟空は心の中で思った。
      悟空「この口は、ちょっと尖らせ過ぎたな。」
      そこで頭を下げ、手で口を覆って揉んだ。
      悟空「俺の口は尖っていないよ。」
      本当に尖っていなくなった。
      小妖「さっきは尖った口だったのに、どうして揉んだら尖らなくなる。人を惑わせる奴だな。どうにも見分けがつかない。お前は俺たちの身内じゃない。会ったことがない、会ったことがない。怪しい、怪しい。うちの大王は決まりが厳しい。火を焚く者は火だけを焚き、山を見回る者は山だけを見回る。火を焚かせたうえに、山の見回りまでさせるはずがないだろう。」
      悟空は口が達者なので、それに乗じて言い返した。
      悟空「お前は知らないんだな。大王は俺の火の焚き方がうまいのを見て、山の見回りに昇進させたんだ。」

    "source_text": "行者暗自喜道：「好了！老妖是死了。聞言就走，怎敢覿面相逢？這進去還似此言方好；若說差了，才這夥小妖有一兩個倒走進去聽見，卻不走了風汛？」你看他存心來古洞，仗膽入深門。"
    "source_languages":
      - "zh-Hant"
    "source_locations":

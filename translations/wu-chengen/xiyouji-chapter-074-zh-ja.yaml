  - "id": "xy-ch74-024"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "闖入深山，依著舊路。正走處，忽聽得人喊馬嘶之聲。即舉目觀之，原來是獅駝洞口有萬數小妖排列著槍刀劍戟，旗幟旌旄。這大聖心中暗喜道：「李長庚之言，真是不妄，真是不妄。」原來這擺列的有些路數：二百五十名作一大隊伍。他只見有四十名雜彩長旗，迎風亂舞，就知有萬名人馬。卻又自揣自度道：「老孫變作小鑽風，這一進去，那老魔若問我巡山的話，我必隨機答應。倘或一時言語差訛，認得我啊，怎生脫體？就要往外跑時，那夥把門的擋住，如何出得門去？要拿洞裡妖王，必先除了門前眾怪。」你道他怎麼除得眾怪？好大聖，想著：「那老魔不曾與我會面，就知我老孫的名頭，我且倚著我的這個名頭，仗著威風，說些大話，嚇他一嚇看。果然中土眾生有緣有分，取得經回，這一去，只消我幾句英雄之言，就嚇退那門前若干之怪；假若眾生無緣無分，取不得真經啊，就是縱然說得蓮花現，也除不得西方洞外精。」心問口，口問心，思量此計，敲著梆，搖著鈴，徑直闖到獅駝洞口。早被前營上小妖擋住道：「小鑽風來了？」行者不應，低著頭就走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 156
        "line_end": 156
    "translation_ja": |-
      山深く分け入り、元来た道をたどる。歩いていると、突然、人の叫び、馬のいななきが聞こえてきた。目を上げて見ると、獅駝洞の入口に、万を数える小妖が、槍、刀、剣、戟、さまざまな旗や飾り旗を並べていた。悟空は心の中で喜んだ。
      悟空「李長庚の言葉は、本当にでたらめではなかった。本当にでたらめではなかった。」
      この隊列には一定の決まりがあり、二百五十人で一つの大きな隊を作っていた。悟空は、色とりどりの長旗を持つ者が四十名、風に旗を激しく舞わせているのを見ただけで、一万の軍勢がいると分かった。それからまた、独りで考えを巡らせた。
      悟空「俺は小鑽風に化けている。中へ入って、親玉が山の見回りについて聞いてきたら、その場その場で答えなければならない。もし一時の言い間違いで俺だと見破られたら、どうやって抜け出す。外へ逃げようにも、あの門番どもに遮られたら、どうして門を出られる。洞の中の妖王を捕まえるには、まず門前の妖怪どもを取り除かなければ。」
      さて、どうやって取り除くのか。悟空は考えた。
      悟空「あの親玉は俺と顔を合わせたこともないのに、俺の名を知っている。ならば、ひとまず自分の名と威勢を頼みに、大きなことを言って脅してみよう。中国の衆生（しゅじょう）に、本当に経を持ち帰ってもらう縁と定めがあるなら、ここで俺が勇ましい言葉を二言三言口にするだけで、門前のあれだけの妖怪も逃げるはずだ。もし衆生に縁も定めもなく、真の経を得られないのなら、口から蓮の花が咲くほど見事に言ってみせても、西方の洞の外にいる妖怪を取り除くことはできない。」
      心が口に問い、口が心に問う。計略を考え定め、拍子木を打ち、鈴を鳴らし、まっすぐ獅駝洞の入口へ進み入った。すぐに前の陣の小妖に止められた。
      小妖「小鑽風、戻ったか。」
      悟空は答えず、頭を下げたまま歩いた。
    "translation_status": "reviewed"
  - "id": "xy-ch74-025"
    "section_id": "chapter-74"
    "kind": "paragraph"

    "source_text": "公公拄著杖，對八戒說：「此山叫做八百里獅駝嶺。中間有座獅駝洞。洞裡有三個魔頭。」八戒啐了一聲：「你這老兒卻也多心，三個妖魔也費心勞力的來報遭信？」公公道：「你不怕麼？」八戒道：「不瞞你說，這三個妖魔，我師兄一棍就打死一個；我一鈀就築死一個。我還有個師弟，他一降妖杖又打死一個：三個都打死，我師父就過去了，有何難哉？」那老者笑道：「這和尚不知深淺。那三個魔頭，神通廣大得緊哩。他手下小妖，南嶺上有五千，北嶺上有五千；東路口有一萬，西路口有一萬；巡哨的有四五千，把門的也有一萬；燒火的無數，打柴的也無數：共計算有四萬七八千。這都是有名字帶牌兒的，專在此吃人。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      老人は杖をつき、八戒に話した。
      老人「この山は、八百里の獅駝嶺（しだれい）という。中ほどに獅駝洞（しだどう）という洞がある。洞の中には三人の魔王がおる。」
      八戒はぺっと唾を吐いた。
      八戒「おじいさんも、ずいぶん心配性だね。たった三人の妖魔のために、わざわざ骨を折って知らせに来たのかい。」
      老人「恐ろしくないのか。」
      八戒「隠さず言うと、その三人の妖魔なら、兄貴が棒の一撃で一人を殴り殺す。俺が熊手の一突きで一人を突き殺す。もう一人弟弟子がいて、そいつが降妖杖（ごうようじょう）の一撃でもう一人を殴り殺す。三人とも死ねば、師匠は通っていける。何が難しいっていうんだい。」
      老人は笑った。
      老人「この坊主は、相手の深さを知らぬ。三人の魔王は、ひどく広大な神通力を持っておるぞ。その配下の小妖は、南の嶺に五千、北の嶺に五千、東の道の入口に一万、西の道の入口に一万。見回りに四、五千、門番にも一万。火を焚く者は数知れず、薪を採る者も数知れず。合わせて四万七、八千はおる。みな名前があり、札を帯びていて、ここで人を食うことばかりしておるのじゃ。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-013"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子聞得此言，戰兢兢跑將轉來，相近唐僧，且不回話，放下鈀，在那裡出恭。行者見了，喝道：「你不回話，卻蹲在那裡怎的？」八戒道：「諕出屎來了。如今也不消說，趕早兒各自顧命去罷。」行者道：「這個獃根，我問信偏不驚恐，你去問就這等慌張失智。」長老道：「端的何如？」八戒道：「這老兒說：此山叫做八百里獅駝山。中間有座獅駝洞。洞裡有三個老妖，有四萬八千小妖，專在那裡吃人。我們若屣著他些山邊兒，就是他口裡食了。莫想去得。」三藏聞言，戰兢兢，毛骨悚然道：「悟空，如何是好？」行者笑道：「師父放心，沒大事。想是這裡有便有幾個妖精，只是這裡人膽小，把他就說出許多人，許多大，所以自驚自怪。有我哩。」八戒道：「哥哥說的是那裡話？我比你不同，我問的是實，決無虛謬之言。滿山滿谷都是妖魔，怎生前進？」行者笑道：「獃子嘴臉，不要虛驚。若論滿山滿谷之魔，只消老孫一路棒，半夜打個罄盡。」八戒道：「不羞，不羞，莫說大話。那些妖精點卯也得七八日，怎麼就打得罄盡？」行者道：「你說怎樣打？」八戒道：「憑你抓倒，綑倒，使定身法定倒，也沒有這等快的。」行者笑道：「不用甚麼抓、拿、綑縛。我把這棍子兩頭一扯，叫：『長！』就有四十丈長短。幌一幌，叫：『粗！』就有八丈圍圓粗細。往山南一滾，滾殺五千；山北一滾，滾殺五千；從東往西一滾，只怕四五萬砑做肉泥爛醬。」八戒道：「哥哥，若是這等趕麵打，或者二更時也都了了。」沙僧在傍笑道：「師父，有大師兄恁樣神通，怕他怎的？請上馬走啊。」唐僧見他們講論手段，沒奈何，只得寬心上馬而走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 143
        "line_end": 143
    "translation_ja": |-
      八戒はそれを聞くと、がたがた震えながら走って戻ってきた。三蔵の近くまで来ても報告せず、熊手を置き、そこで用を足し始めた。悟空は見ると怒鳴った。
      悟空「報告もしないで、そこにしゃがんで何をしている。」
      八戒「怖くて、くそが出たんだ。もう何も言わなくていい。早いところ、それぞれ自分の命を守って逃げよう。」
      悟空「この間抜けめ。俺が聞きに行った時はちっとも怖がらなかったのに、お前が行ったら、そんなにうろたえて分別を失うとは。」
      三蔵「いったい、どうなのだ。」
      八戒「あの老人の話では、この山は八百里の獅駝山（しださん）。真ん中に獅駝洞という洞があり、中には三人の親玉の妖怪と、四万八千の小妖がいて、そこで人を食うことばかりしているんです。俺たちが山の端にちょっとでも足を踏み入れれば、奴らの口に入る餌になる。行けると思わないでください。」
      三蔵は聞くとがたがた震え、全身の毛が逆立った。
      三蔵「悟空、どうしたらよい。」
      悟空は笑った。
      悟空「お師匠さま、ご安心ください。たいしたことはありません。この辺に妖怪が幾人かいるにはいるのでしょうが、土地の人が気の小さいものだから、ずいぶん多く、ずいぶん大きく言って、自分で驚き騒いでいるだけでしょう。私がいます。」
      八戒「兄貴、何を言ってるんだ。俺は兄貴とは違う。聞いてきたのは本当のこと、嘘も間違いも決してない。山も谷も妖魔だらけなのに、どうして進める。」
      悟空は笑った。
      悟空「間抜け面め、むやみに怖がるな。山も谷も魔物だらけだというなら、この俺が棒を振るって進めば、夜中までにはきれいさっぱり打ち殺せる。」
      八戒「恥ずかしくないのか、恥ずかしくないのか。大口をたたくな。あれだけの妖怪なら、点呼するだけで七日も八日もかかる。どうして全員殴り殺せるんだ。」
      悟空「どうやってやると思う。」
      八戒「つかみ倒そうが、縛り倒そうが、定身法（ていしんほう）で動けなくしようが、そんなに早くはできないよ。」
      悟空は笑った。
      悟空「つかむの、捕らえるの、縛るのなんて必要ない。この棒の両端を引いて『伸びろ！』と叫べば、長さは四十丈ほどになる。振って『太くなれ！』と叫べば、周りが八丈ほどの太さになる。それを山の南へ一転がしすれば、五千をひき殺す。北へ一転がしすれば、また五千をひき殺す。東から西へ転がしてやれば、四、五万を肉の泥、ぐちゃぐちゃの味噌に潰してしまうだろうさ。」
      八戒「兄貴、そんなふうに麺の生地を延ばすみたいに打つなら、二更（にこう）ごろには片がつくかもしれないね。」
      沙悟浄（さごじょう）は傍らで笑った。
      沙悟浄「お師匠さま、兄さんにそれだけの神通力があるのに、どうして恐れるのです。馬に乗ってお進みください。」
      三蔵は弟子たちが腕前を論じ合うのを見て、どうしようもなく、心をなだめて馬に乗り、進んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch74-014"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正行間，不見了那報信的老者。沙僧道：「他就是妖怪，故意狐假虎威的來傳報，恐諕我們哩。」行者道：「不要忙，等我去看看。」好大聖，跳上高峰，四顧無跡，急轉面，見半空中有彩霞晃亮，即縱雲趕上看時，乃是太白金星。走到身邊，用手扯住，口口聲聲只叫他的小名道：「李長庚，李長庚，你好憊懶。有甚話，當面來說便好，怎麼裝做個山林之老，魘樣老孫？」金星慌忙施禮道：「大聖，報信來遲，乞勿罪，乞勿罪。這魔頭果是神通廣大，勢要崢嶸。只看你那移變化，乖巧機謀，可便過去；如若怠慢些兒，其實難去。」行者謝道：「感激，感激。果然此處難行，望老星上界與玉帝說聲，借些天兵，幫助老孫幫助。」金星道：「有有有，你只口信帶去，就是十萬天兵，也是有的。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      歩いているうちに、知らせに来た老人が見えなくなった。
      沙悟浄「あの人こそ妖怪だ。虎の威を借りる狐のように、わざと知らせに来て、俺たちを脅したんだ。」
      悟空「そう急ぐな。俺が確かめてくる。」
      悟空は高い峰へ跳び上がり、四方を見回したが、人影はない。さっと顔を向け直すと、中空に彩雲がきらめいている。雲に乗って追いつき、よく見ると、それは太白金星（たいはくきんせい）だった。悟空はそばまで行き、手でつかまえると、繰り返し、その小名を呼び捨てにした。
      悟空「李長庚（りちょうこう）、李長庚、お前もひどいいたずら者だな。話があるなら、そのまま顔を合わせて言えばいいのに、どうして山林の老人に化け、この俺を脅かすんだ。」
      太白金星は急いで礼をした。
      太白金星「大聖（たいせい）さま、お知らせが遅れました。どうかお咎めなく、どうかお咎めなく。あの魔王たちは、本当に広大な神通力を持ち、勢力も並外れております。あなたさまの自在の変化、巧みな知恵と計略しだいで、通り抜けられましょう。少しでも油断なされば、まことに難しいことでございます。」
      悟空は礼を述べた。
      悟空「ありがたい、ありがたい。本当にここが通りにくいのなら、老星どの、天上へ戻られたら玉帝（ぎょくてい）にひとこと伝え、天兵をいくらか借りて、この俺を助けてください、助けてください。」
      太白金星「おります、おります、おります。口頭のお言づてをお送りくだされば、十万の天兵でも用意できます。」
    "translation_status": "reviewed"
  - "id": "xy-ch74-015"
    "section_id": "chapter-74"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "大聖別了金星，按落雲頭，見了三藏道：「適才那個老兒，原是太白星來與我們報信的。」長老合掌道：「徒弟，快趕上他，問他那裡另有個路，我們轉了去罷。」行者道：「轉不得。此山徑過有八百里，四週圍不知更有多少路哩，怎麼轉得？」三藏聞言，止不住眼中流淚道：「徒弟，似此艱難，怎生拜佛？」行者道：「莫哭，莫哭，一哭便膿包行了。他這報信，必有幾分虛話，只是要我們著意留心，誠所謂：『以告者，過也。』你且下馬來坐著。」八戒道：「又有甚商議？」行者道：「沒甚商議。你且在這裡用心保守師父，沙僧好生看守行李、馬匹。等老孫先上嶺打聽打聽，看前後共有多少妖怪，拿住一個，問他個詳細，教他寫個執結，開個花名，把他老老小小一一查明，吩咐他關了洞門，不許阻路，卻請師父靜靜悄悄的過去，方顯得老孫手段。」沙僧只教：「仔細，仔細。」行者笑道：「不消囑付。我這一去，就是東洋大海也湯開路，就是鐵裹銀山也撞透門。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch74-1500622"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第074回&oldid=1500622"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      悟空は太白金星と別れ、雲を下ろして三蔵のもとへ戻った。
      悟空「さっきの老人は、太白星（たいはくせい）が私たちへ知らせに来てくれたのです。」
      三蔵は合掌した。
      三蔵「弟子よ、早く追いついて、ほかにどこか道はないか尋ねておくれ。回り道をしよう。」
      悟空「回れません。この山はまっすぐ通っても八百里ある。周りを行けば、道のりがどれだけ増えるか分かりません。どうして回れましょう。」
      三蔵は聞くと、目から涙が流れるのを抑えられなかった。
      三蔵「弟子よ、こんなに難儀で、どうして仏さまを拝みに行けるのだろう。」
      悟空「泣かないで、泣かないで。泣いたら、へなちょこの仲間入りですよ。あの知らせにも、きっと幾分かは大げさなところがある。私たちに十分気をつけさせようとしただけです。まさに『知らせる者は、度を越す』ということです。ひとまず馬を下り、座っていてください。」
      八戒「また何か相談かい。」
      悟空「相談なんかない。お前はここで気を配って、お師匠さまを守れ。沙悟浄は荷物と馬をしっかり見ていろ。俺が先に嶺へ上がって探ってくる。前にも後ろにも、合わせてどれだけ妖怪がいるかを調べ、一匹捕らえて詳しく尋ね、保証の書面を書かせ、名簿を出させる。大きいのから小さいのまで、一つ一つ調べ上げ、洞の門を閉めて道を塞ぐなと言いつける。それから、お師匠さまに静かに通っていただく。それでこそ、この俺の腕前が分かるってものだ。」
      沙悟浄はただ言った。
      沙悟浄「気をつけて、気をつけて。」
      悟空は笑った。
      悟空「念を押さなくていい。俺が行けば、東洋の大海でも道を開くし、鉄に包まれた銀の山でも門を突き通してみせる。」

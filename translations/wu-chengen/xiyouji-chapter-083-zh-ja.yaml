    "source_text": "好大聖，執著這牌位、香爐，將身一縱，駕祥雲，直至南天門外。時有把天門的大力天王與護國天王見了行者，一個個都控背躬身，不敢攔阻，讓他進去。直至通明殿下，有張、葛、許、丘四大天師迎面作禮道：「大聖何來？」行者道：「有紙狀兒，要告兩個人哩。」天師吃驚道：「這個賴皮，不知要告那個？」無奈，將他引入靈霄殿下啟奏，蒙旨宣進。行者將牌位、香爐放下，朝上禮畢，將狀子呈上。葛仙翁接了，鋪在御案。玉帝從頭看了，見這等這等，即將原狀批作聖旨，宣西方長庚太白金星領旨，到雲樓宮宣托塔李天王見駕。行者上前奏道：「望天主好生懲治；不然，又別生事端。」玉帝又吩咐：「原告也去。」行者道：「老孫也去？」四天師道：「萬歲已出了旨意，你可同金星去來。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      見事な悟空は位牌と香炉を手にひと跳びし、瑞雲に乗って、まっすぐ南天門（なんてんもん）の外へ着いた。そのとき天門を守っていた大力天王（だいりきてんのう）と護国天王（ごこくてんのう）は、悟空を見ると、どちらも背をかがめて腰を折り、遮る勇気もなく中へ通した。通明殿（つうめいでん）の下まで来ると、張・葛・許・丘（ちょう・かつ・きょ・きゅう）の四大天師（しだいてんし）が向こうから礼をした。四天師（してんし）「大聖、何のご用でお越しですか？」
      悟空「訴状が一通ある。二人を訴えに来たんだ。」
      天師（てんし）は驚いた。天師「この厄介者め、今度は誰を訴えるのだろう？」
      仕方なく霊霄殿（れいしょうでん）の下へ案内して奏上すると、入るよう勅命が下った。悟空は位牌と香炉を置き、玉帝へ礼を済ませ、訴状を差し出した。葛仙翁（かっせんおう）が受け取り、御机へ広げた。玉帝は初めから読み、これこれの事情と分かると、その訴状へ裁可を書き入れて勅旨とし、西方長庚太白金星（さいほうちょうこうたいはくきんせい）を呼び、命を受けて雲楼宮（うんろうきゅう）へ行き、托塔李天王（たくとうりてんのう）を御前へ召すようにした。悟空は進み出て奏上した。悟空「天主（てんしゅ）、どうか厳しく懲らしめてください。さもないと、また別の騒ぎが起きます。」
      玉帝はさらに命じた。玉帝「原告も行け。」
      悟空「俺も行くのですか？」
      四天師「陛下はもう勅命を下されました。金星（きんせい）と一緒においでなさい。」
    "translation_status": "draft"
  - "id": "xy-ch83-015"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者真個隨著金星，縱雲頭，早至雲樓宮。原來是天王住宅，號雲樓宮。金星見宮門首有個童子侍立。那童子認得金星，即入裡報道：「太白金星老爺來了。」天王遂出迎迓。又見金星捧著旨意，即命焚香。及轉身，又見行者跟入，天王即又作怒。你道他作怒為何？當年行者大鬧天宮時，玉帝曾封天王為降魔大元帥，封哪吒太子為三壇海會之神，帥領天兵，收降行者，屢戰不能取勝。還是五百年前敗陣的仇氣，有些惱他，故此作怒。他且忍不住道：「老長庚，你賫得是甚麼旨意？」金星道：「是孫大聖告你的狀子。」那天王本是煩惱，聽見說個「告」字，一發雷霆大怒道：「他告我怎的？」金星道：「告你假妖攝陷人口事。你焚了香，請自家開讀。」那天王氣呼呼的設了香案，望空謝恩。拜畢，展開旨意看了，原來是這般這般，如此如此，恨得他手撲著香案道：「這個猴頭，他也錯告我了。」金星道：「且息怒。現有牌位、香爐在御前作證，說是你親女哩。」天王道：「我止有三個兒子，一個女兒。大小兒名金吒，侍奉如來，做前部護法；二小兒名木叉，在南海隨觀世音做徒弟；三小兒名哪吒，在我身邊，早晚隨朝護駕。一女年方七歲，名貞英，人事尚未省得，如何會做妖精？不信，抱出來你看。這猴頭著實無禮。且莫說我是天上元勛，封受先斬後奏之職，就是下界小民，也不可誣告。律云：『誣告加三等。』」叫手下：「將縛妖索把這猴頭綑了。」那庭下擺列著巨靈神、魚肚將、藥叉雄帥，一擁上前，把行者綑了。金星道：「李天王莫闖禍啊。我在御前同他領旨意來宣你的人，你那索兒頗重，一時綑壞他，閣氣。」天王道：「金星啊，似他這等詐偽告擾，怎該容他？你且坐下，待我取砍妖刀砍了這個猴頭，然後與你見駕回旨。」金星見他取刀，心驚膽戰，對行者道：「你幹事差了。御狀可是輕易告的？你也不訪的實，似這般亂弄，傷其性命，怎生是好？」行者全然不懼，笑吟吟的道：「老官兒放心，一些沒事。老孫的買賣，原是這等做，一定先輸後贏。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 146
        "line_end": 146
    "translation_ja": |-
      悟空は本当に太白金星（たいはくきんせい）について雲に乗り、早くも雲楼宮へ着いた。そこは天王の住まいで、雲楼宮と呼ばれていた。太白金星が見ると、宮門の前には童子が一人、控えて立っている。童子は金星と分かると、中へ入って告げた。童子「太白金星さまがお見えです。」
      李天王は出迎えに出た。金星が勅旨を捧げているのを見ると、香を焚くよう命じた。ところが振り返り、悟空もついて入ってくるのを見ると、また怒り出した。なぜ怒ったのか。かつて悟空が天宮で大暴れしたとき、玉帝は天王を降魔大元帥（ごうまだいげんすい）に、哪吒太子を三壇海会之神（さんだんかいえのかみ）に封じ、天兵を率いて悟空を降伏させようとした。だが、何度戦っても勝てなかった。五百年前の敗戦の恨みがまだあり、悟空を憎く思っていたから怒ったのだ。とうとう我慢できずに言った。李天王「長庚老（ちょうこうろう）、どのような勅旨をお持ちなのだ？」
      太白金星「孫大聖（そんたいせい）があなたを訴えた訴状です。」
      李天王はもともと腹を立てていたのに、「訴えた」と聞き、いよいよ雷のように怒鳴った。李天王「何のことで私を訴えた？」
      太白金星「妖怪を装い、人をさらって閉じ込めたという件です。香を焚き、ご自分で開いてお読みください。」
      李天王は息を荒くしながら香卓を設け、空を仰いで恩に感謝した。拝礼を終えて勅旨を開くと、あれこれ、しかじかと書いてある。憎らしさのあまり香卓を手で叩いた。李天王「この猿め、見当違いの訴えをするにもほどがある！」
      太白金星「まず、お怒りを鎮めてください。現に位牌と香炉が御前に証拠として置かれています。あなたの実の娘だというのです。」
      李天王「私には息子が三人と、娘が一人いるだけだ。長男は金吒（きんた）といい、如来に仕えて前部護法（ぜんぶごほう）を務めている。次男は木叉（もくさ）といい、南海（なんかい）で観世音（かんぜおん）について弟子となっている。三男は哪吒（なた）といい、私のそばで朝夕、朝廷へ付き従い、陛下をお守りしている。娘はまだ七歳、貞英（ていえい）という。世間のことも分からぬのに、どうして妖怪になれよう。信じないなら、抱いて連れてこさせるから見なさい。この猿め、まったく無礼だ。私が天上の古参の功臣で、先に斬って後から奏上してよい職権を授かっていることは、ひとまず措こう。たとえ下界の庶民であっても、誣告してよいわけがない。律に『誣告は三等加重する』とある。」
      そして配下に叫んだ。李天王「縛妖索（ばくようさく）で、この猿めを縛れ！」
      庭下に居並んでいた巨霊神（きょれいしん）、魚肚将（ぎょとしょう）、薬叉雄帥（やくしゃゆうすい）が、どっと進み出て悟空を縛った。
      太白金星「李天王、問題を起こしてはいけません。私は御前でこの者と一緒に勅旨を受け、あなたをお召しに来たのです。その縄はたいそうきつい。一時のはずみで縛り傷めて、騒ぎを起こしてしまっては。」
      李天王「金星、このように偽って訴え、騒ぎを起こす者を、どうして容赦できよう。ひとまず座っていなさい。砍妖刀（かんようとう）を持ってきてこの猿を斬り、それから一緒に御前へ行き、復命しよう。」
      太白金星は天王が刀を取りに行くのを見て、肝を冷やし、悟空に言った。太白金星「あなたはやり方を誤りました。御前への訴えは、軽々しくするものですか。確かめもせず、こんな無茶をして、命を落としたらどうするのです？」
      悟空は少しも恐れず、にこにこして言った。悟空「ご老人、心配するな。何でもない。この俺の商売は、もともとこういうやり方なんだ。必ず、先に負けて後で勝つ。」

  "known_gaps":
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-002"
      "description_ja": "底本は「\U00027FFC在咽喉之內」。\U00027FFCは足偏に瓜の字で、全字庫は字形と中国語音guāを掲げるが、この句の動作の語義までは説明しない。ここでは小さくなって喉の中に身を置く動作として訳し、姿勢の細部は留保した。原字を別字へ補訂していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-003"
      "description_ja": "底本は「母道損」。水火・陰陽・聖胎の内丹的な対句に従い、「母」の字を残した。具体的な修行体系への同定や、母を別の字へ直す校訂は行っていない。悟空と女の戦いを内丹の象徴で描く詩であり、実際の男女交合を悟空の目的とする説明ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-004"
      "description_ja": "底本の「才子在他肚裡」の才子は、前の出来事を指す「ついさっき」の意に解した。「才能ある男子」という新たな人物の導入にはしない。原文の字は保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-006"
      "description_ja": "底本は「夾腦風」。古い俗語で頭がおかしいと罵る表現と解した。朱嘉雯の論説の検索表示にもこの説明があるが、個別ページを開く取得は失敗した。医学的な診断や実際の病気と断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-006"
      "description_ja": "悟空の言葉は「昨日」。直前からの旅程に合わせて日付を修正せず、その発言のまま残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-009"
      "description_ja": "底本は「虎皮裙繫明花響」。虎皮の斑が鮮やかな様子と読めるが、「響」の働きは明確でない。訳では字面の響きを残し、晃などの別字へ無断で置き換えない。鞍の比喩の「鞍鞽」は鞍の前部の盛り上がりと解した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-010"
      "description_ja": "「倒坐兒」は正面の建物と向かい合う側の建物と解した。「龍吞口」は竜の口をかたどった彫刻、「流金」は金めっきと読んだ。正確な建築平面や彫刻の位置、めっき技法の細部までは確定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-010"
      "description_ja": "「之位」「位」は祀る相手を示す位牌の文字。死者であることを示すものとは限らない。原文は大きな金字牌と、少し下の位置の文字を記すが、位牌が別々に何枚あるかまでは明確でない。父と兄という表記以上の血縁の性質はここで限定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-011"
      "description_ja": "「掣放洞口」は洞の口を開けて通す意に解した。岩など特定の蓋を動かしたとは明記されないため、仕組みは補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-012"
      "description_ja": "この一段は悟空が読み上げる訴状の全文で、韻文ではない。「実の娘」「故意に放任」「数知れぬ人命」等は訴人の告発として保持し、語り手が確定した事実へ変えない。「年甲在牒」は年齢・生年が文書に記載されているという定型表現と解した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-014"
      "description_ja": "底本は南天門を守る大力天王・護国天王。護国天王は同じ表記の別場面では北天門に関わるが、表記だけで同一の個体と断定せず、ここでは南天門の役割の範囲にとどめる。大力天王も、既知の四天王の誰かへ無断で置き換えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-014"
      "description_ja": "ここは底本が四天師から単に「天師」へ移る。四人のうち誰が驚いて話したのか明記されていないので、個人名を補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "底本の任官名は「三壇海會之神」。既知の哪吒の称号「三壇海会大神」と同じ人物の官称とするが、語形の違いを消さない。回想中の任官の表現をそのまま保持した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "李天王が長男の役目としていう「前部護法」。前方・先頭の護法という語構成で解し、仏教一般に固定した独立の官職制度があるとは断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "原文は「誣告加三等」。人を偽って告発した場合、その告発した罪に加重した刑を自ら受けるという古い誣告反坐の発想に基づく台詞。特定の王朝の条文を逐語引用したものかは未確認であり、現行法の説明ではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "縛妖索は、別場面では哪吒の武器の一つに挙げられる名である。ここでは李天王が捕縛に使うよう命じる綱で、貸し借りや所有者の一致は明記されていない。同じ個体とも、別物とも断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "底本の「閣氣」は教育部辞典で腹を立てる・怒りを招く意とされる。本訳も窒息や呼吸停止の意味にはせず、縛って傷めれば厄介な争いになるという警告として訳した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-015"
      "description_ja": "砍妖刀は別場面で哪吒の武器名にも用いられる。ここでは李天王が取りに行く刀とだけ明記され、同じ名だから同一の個体と確定はしない。斧や剣へ武器種を変更しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-017"
      "description_ja": "この回想は海中の水晶宮とだけ記し、海域や主の名を明示しない。別の哪吒伝説から宮の主やその子の固有名を補っていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-017"
      "description_ja": "肉を母、骨を父へ返す叙述を保持した。父の殺害の企図と、哪吒自身の肉・骨を切り離す実行を区別する。身体が父母から受けたものであるという古い発想に沿う物語表現である。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-017"
      "description_ja": "この底本では蓮根と蓮葉を用い、真言で哪吒を蘇生させるのは仏である。他作品の伝承に基づいて別の仙人へ置き換えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-017"
      "description_ja": "如来が塔を授け、哪吒に仏を父とさせるという語りを保持した。塔の仏と父親の役割が重なる寓意の細部は留保し、別伝承の筋へ合わせていない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-018"
      "description_ja": "ここで初めて、父子との関係が命を救われた恩による義理の親子・きょうだいであると明記される。前の娘・妹という表現を最初から血縁ではないと書き換えず、哪吒の説明による区別を保持する。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-018"
      "description_ja": "金鼻白毛老鼠精・半截観音・地湧夫人は、哪吒が同じ女の三つの名として、この順に説明する。半截は半分・半截の意を持つが、その名の具体的な姿の由来はこの発言にはない。本文で明示しない像の形などは補わない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-019"
      "description_ja": "底本は「晚親義重」。義理の娘にも目下の親族としての重い関係がある、という金星の説得と解した。法的な責任を客観的に確定する語りではない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-019"
      "description_ja": "「死了莫與老頭兒同墓」は、年寄りと同じ墓に入るな、という冗談の諺。「揭挑人」は人の過去をあばき立てることと解し、墓と掘り返す言い回しのつながりを日本語でも残した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-020"
      "description_ja": "底本の「喜花下兒子」は語の切り方・喜花の細かな意味に留保があるが、続く小和尚の出生から、慶事として子を産む想定と解した。酒の泡をいう同形の喜花とは統合しない。天上と下界の時差も、ここでは金星が説得に用いる説明であり、実際に一年が経過したという断定へ変えない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-021"
      "description_ja": "底本は「假設」。御前への報告が、天王父子の責任を軽くする言い方になっていることを保ち、直前までの義理の関係を消すため本文を改めない。報告の主語は金星と行者であり、片方の単独発言とは断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-024"
      "description_ja": "底本は「照般」「暖弢煙」。照般は依旧に呼応する「同じように」と解し、照らす働きも残した。弢は韜に通じる包む意で解したが、語形の校訂はしない。別の公開論文の検索表示には暖韬烟があるものの、全文・版面校合は未実施。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-024"
      "description_ja": "原文は「三春楊柳九秋蓮」。三春は春の三か月、九秋は秋の九十日を表す季節の語として解し、三月・九月という特定の月に限定しない。教育部辞典にもそれぞれの語義がある。洞の風景に春の柳と秋の蓮が並ぶことを、一つの季節へ修正していない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-025"
      "description_ja": "「命合該休」は語り手による命運の尽きを示す予告として訳した。この位置で処罰の方法を具体化せず、本文が述べない死亡の場面を作らない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-025"
      "description_ja": "小妖が天兵に出くわした後の「一聲嚷道」は話者の主語を明記しない。捜索側の発見の声とも読めるが、小妖の動作からも文が続くため、特定の天兵または小妖に断定しない。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-026"
      "description_ja": "「和尚拖木頭──做出了寺」は前半のたとえから後半の落ちを導く歇後語。教育部辞典は寺と事の同音を利用し、寺を出ることと事を起こすことを掛けると説明する。日本語では二つの意味を併記した。 原文の欠落ではなく、解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch83-1455632"
      "segment_ids":
        - "xy-ch83-028"
      "description_ja": "底本は「乾金海」。糸のように絡む蔓を断ち、海を干し上げる比喩を重ねる。金海の厳密な典拠は確定できず、苦海などへ字を直さず「金の海」と残した。 原文の欠落ではなく、解釈・校訂上の留保。"

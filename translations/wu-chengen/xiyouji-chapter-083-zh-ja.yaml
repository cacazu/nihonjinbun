  - "id": "xy-ch83-024"
    "section_id": "chapter-83"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      依舊雙輪日月，照般一望山川。珠淵玉井暖弢煙。更有許多堪羨。
      疊疊朱樓畫閣，嶷嶷赤壁青田。三春楊柳九秋蓮。兀的洞天罕見。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 157
        "line_end": 158
    "translation_ja": |-
      変わらず二つの輪、日と月。同じように、山と川を一望に照らす。
      真珠の淵、玉の井戸には、暖かな煙が包みこもる。ほかにも羨むべきものが多い。
      重なり合う朱塗りの楼、彩りのある閣。高くそびえる赤い崖に、青々とした田。
      春の楊柳、秋の蓮。これほどの洞天（どうてん）はめったに見られない。
    "translation_status": "draft"
  - "id": "xy-ch83-025"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "頃刻間，停住了雲光，徑到那妖精舊宅。挨門兒搜尋，吆吆喝喝，一重又一重，一處又一處，把那三百里地，草都踏光了，那見個妖精？那見個三藏？都只說：「這孽畜一定是早出了這洞，遠遠去哩。」那曉得他在那東南黑角落上，望下去，另有個小洞。洞裡一重小小門，一間矮矮屋，盆栽了幾種花，簷傍著數竿竹，黑氣氳氳，暗香馥馥。老怪攝了三藏，搬在這裡，逼住成親。只說行者再也找不著，誰知他命合該休。那些小怪在裡面，一個個嚌嚌嘈嘈，挨挨簇簇。中間有個大膽些的，伸起頸來，望洞外略看一看，一頭撞著個天兵，一聲嚷道：「在這裡！」那行者惱起性來，捻著金箍棒，一下闖將進去。那裡邊窄小，窩著一窟妖精。三太子縱起天兵，一齊擁上，一個個那裡去躲？"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 160
        "line_end": 160
    "translation_ja": |-
      ほどなく雲の光を止め、まっすぐ地湧夫人の以前の屋敷へ向かった。門を一つずつ捜し、声を掛け、叫び、一重、また一重、一か所、また一か所と捜し回った。三百里の土地の草をすっかり踏み尽くすほどだったが、どこに妖怪がいよう。どこに三蔵がいよう。一同はこう言うばかりだった。捜索する一同「あの畜生は、きっととっくに洞を出て、遠くへ逃げたんだ。」
      だが、誰が知ろう。東南の暗い片隅から下をのぞくと、さらに小さな洞があったのだ。洞の中には小さな門が一つ、背の低い家が一間。鉢には数種の花が植えられ、軒のそばには竹が数本ある。黒い気がもくもくと立ち、かすかな香りが満ちていた。地湧夫人は三蔵をさらうと、ここへ移り、閉じ込めて結婚を迫っていた。悟空には二度と見つけられまいと思っていたのだが、命運が尽きる定めだとは知るよしもない。中の小妖たちは、どれもがやがや騒ぎ、押し合い、ひとかたまりになっていた。その中に少し胆の据わった者がいて、首を伸ばし、洞の外をちょっと見ると、ばったり天兵の一人に出くわした。そのとき大声が上がった。話者不明「ここだ！」
      悟空は怒りをたぎらせ、金箍棒を手に、一気に押し入った。中は狭く、一窟いっぱいの妖怪がひしめいていた。哪吒も天兵を進ませ、一斉になだれ込んだ。どの妖怪にも、どこに隠れる場所があろう。
    "translation_status": "draft"
  - "id": "xy-ch83-026"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者尋著唐僧，和那龍馬，和那行李。那老怪尋思無路，看著哪吒太子，只是磕頭求命。太子道：「這是玉旨來拿你，不當小可。我父子只為受了一炷香，險些兒和尚拖木頭──做出了寺。」啈聲天兵，取下縛妖索，把那些妖精都綑了。老怪也少不得吃場苦楚。返雲光，一齊出洞。行者口裡嘻嘻嗄嗄。天王掣開洞口，迎著行者道：「今番卻見你師父也。」行者道：「多謝了，多謝了。」就引三藏拜謝天王，次及太子。沙僧、八戒只是要碎剮那老精，天王道：「他是奉玉旨拿的，輕易不得，我們還要去回旨哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 161
        "line_end": 161
    "translation_ja": |-
      悟空は三蔵と竜馬（りゅうめ）、そして荷物を見つけた。地湧夫人は逃げ道もないと悟り、哪吒太子を見て、ひたすら額を地につけ、命乞いをした。
      哪吒「玉帝の勅旨によって、お前を捕らえに来た。軽いことではないぞ。私たち父子は、たった一本の香を受けたために、危うく『坊主が材木を引きずる』ところだった。寺の外へ出る、つまり大事を起こすところだったのだ。」
      天兵にひと声命じ、縛妖索を取り出させて、妖怪たちをすべて縛った。地湧夫人も、ひと苦しみするのは免れなかった。雲の光を返し、一同そろって洞を出た。悟空は口の中で、ひひひ、はははと笑っている。李天王は洞の入り口を開け、悟空を迎えた。李天王「今度こそ師匠に会えたな。」
      悟空「ありがたい、ありがたい。」
      そして三蔵を連れて天王に拝礼して礼を述べ、次に哪吒へ礼をした。沙悟浄と八戒は、どうしても地湧夫人を細かく切り刻んでやりたがったが、李天王は言った。李天王「この者は玉帝の勅旨で捕らえたのだ。勝手にはできぬ。我らはまだ、復命しなければならない。」
    "translation_status": "draft"
  - "id": "xy-ch83-027"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "一邊天王同三太子領著天兵神將，押住妖精，去奏天曹，聽候發落；一邊行者擁著唐僧，沙僧收拾行李，八戒攏馬，請唐僧騎馬，齊上大路。這正是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 163
        "line_end": 163
    "translation_ja": "一方では、李天王と哪吒が天兵・神将を率い、妖怪たちを護送して天曹（てんそう）へ奏上に赴き、処分を待つ。他方では、悟空が三蔵に付き添い、沙悟浄が荷物をまとめ、八戒が馬を引き寄せ、三蔵に乗っていただくと、皆そろって大きな道へ出た。まさに、"
    "translation_status": "draft"
  - "id": "xy-ch83-028"
    "section_id": "chapter-83"

  - "id": "xy-ch83-020"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者朝了金星道：「老官兒，何如？我說先輸後贏，買賣兒原是這等做。快催他去見駕，莫誤了我的師父。」金星道：「莫忙，弄了這一會，也吃鍾茶兒去。」行者道：「你吃他的茶，受他的私，賣放犯人，輕慢聖旨，你得何罪？」金星道：「不吃茶，不吃茶。連我也賴將起來了。李天王，快走，快走。」天王那裡敢去，怕他沒的說做有的，放起刁來，口裡胡說亂道，怎生與他折辨？沒奈何，又央金星，教說方便。金星道：「我有一句話兒，你可依我？」行者道：「繩綑刀砍之事，我也通看你面，還有甚話？你說，你說。說得好，就依你；說得不好，莫怪。」金星道：「一日官事十日打。你告了御狀，說妖精是天王的女兒，天王說不是，你兩個只管在御前折辨，反復不已。我說天上一日，下界就是一年。這一年之間，那妖精把你師父陷在洞中，莫說成親，若有個喜花下兒子，也生了一個小和尚兒，卻不誤了大事？」行者低頭想道：「是啊，我離八戒、沙僧，只說多時飯熟、少時茶滾就回，今已弄了這半會，卻不遲了？老官兒，既依你說，這旨意如何回繳？」金星道：「教李天王點兵，同你下去降妖，我去回旨。」行者道：「你怎麼樣回？」金星道：「我只說原告脫逃，被告免提。」行者笑道：「好啊，我倒看你面情罷了，你倒說我脫逃。教他點兵在南天門外等我，我即和你回旨繳狀去。」天王害怕道：「他這一去，若有言語，是臣背君也。」行者道：「你把老孫當甚麼樣人？我也是個大丈夫，『一言既出，駟馬難追』，豈又有污言頂你？」天王即謝了行者。行者與金星回旨。天王點起本部天兵，徑出南天門外。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 152
        "line_end": 152
    "translation_ja": |-
      悟空は太白金星に向いた。悟空「ご老人、どうだい。先に負けて後で勝つと言っただろう。商売というものは、こうやるんだ。早く天王をせき立てて御前へ行こう。師匠を待たせちゃいけない。」
      太白金星「そう急がずに。しばらく騒いだのですから、茶を一杯飲んでからにしましょう。」
      悟空「天王の茶を飲み、ひそかなもてなしを受け、賄賂で罪人を逃がし、勅旨を軽んじる。あんたはどんな罪になる？」
      太白金星「飲みません、飲みません。私にまで難癖をつけるとは。李天王、早く行きましょう、早く。」
      だが、李天王はどうして行く気になれよう。悟空がないことをあったことにし、ごねて出まかせを言い出したら、どう弁明すればよいのかと恐れたのである。仕方なく、また太白金星に取りなしを頼んだ。
      太白金星「一つ申し上げたいのですが、聞き入れてくださいますか？」
      悟空「縄で縛られ、刀で斬りつけられたことまで、あんたの顔を立てたんだ。まだ何かあるのか。言ってみろ、言ってみろ。筋がよければ従うが、筋が悪くても恨むなよ。」
      太白金星「一日の訴訟に、十日の争いがかかるといいます。あなたは妖怪が天王の娘だと御前へ訴え、天王は違うと申す。お二人が御前で言い争えば、何度やり取りしても終わりません。申しておきますが、天上の一日は、下界の一年です。その一年の間、妖怪は洞にお師匠さまを閉じ込めたまま。結婚どころか、めでたく子が授かりでもしたら、小さな坊さんが一人、生まれてしまいます。大事を損なうことになりませんか？」
      悟空はうつむいて考え、言った。悟空「そうだ。八戒と沙悟浄に別れるとき、長くても飯が炊ける間、短ければ茶の湯が沸く間に帰ると言ったんだ。もうずいぶんかかってしまった。遅くなったじゃないか。ご老人、あんたの言うとおりにするとして、この勅旨はどう復命して返す？」
      太白金星「李天王に兵を集めさせ、あなたと下界へ降りて妖怪を捕らえさせましょう。私が復命に参ります。」
      悟空「どう復命するんだ？」
      太白金星「原告が逃亡したので、被告の召喚を免じました、とだけ申します。」
      悟空は笑った。悟空「うまいことを言う。俺があんたの顔を立てただけなのに、逃亡したことにするのか。天王には兵を集めて南天門の外で待つよう言ってくれ。俺もあんたと復命し、訴状を取り下げに行く。」
      李天王は恐れて言った。李天王「そこで何か言われては、私が臣下として君に背いたことになる。」
      悟空「あんたは俺を何だと思ってるんだ？　俺だって一人前の男だ。『一言いったん口を出れば、四頭立ての馬でも追いつけぬ』という。どうしてまた、悪口であんたを突き上げたりするものか。」
      李天王は悟空に礼を言った。悟空と太白金星は復命に戻り、李天王は直属の天兵を集め、まっすぐ南天門の外へ出た。
    "translation_status": "draft"
  - "id": "xy-ch83-021"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "金星與行者回見玉帝道：「陷唐僧者，乃金鼻白毛老鼠成精，假設天王父子牌位。天王知之，已點兵收怪去了，望天尊赦罪。」玉帝已知此情，降天恩免究。行者即返雲光，到南天門外，見天王、太子佈列天兵等候。噫！那些神將風滾滾，霧騰騰，接住大聖，一齊墜下雲頭，早到了陷空山上。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 153
        "line_end": 153
    "translation_ja": |-
      太白金星と悟空は戻って玉帝に拝謁し、奏上した。太白金星と悟空「唐僧を捕らえたのは、金の鼻と白い毛を持つ鼠が妖となったものです。勝手に天王父子の位牌を設けておりました。天王は事情を知り、すでに兵を集めて捕らえに向かいました。天尊（てんそん）、どうか罪をお赦しください。」
      玉帝はすでに事情を知り、天恩を下して不問に付した。悟空がすぐに雲の光を返して南天門の外へ着くと、李天王と哪吒が天兵を整列させて待っていた。おお、神将たちは風を巻き、霧を湧き立たせて悟空を迎え、一斉に雲を降下させると、早くも陷空山の上へ着いた。
    "translation_status": "draft"
  - "id": "xy-ch83-022"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒、沙僧眼巴巴正等，只見天兵與行者來了。獃子迎著天王施禮道：「累及，累及。」天王道：「天蓬元帥，你卻不知。只因我父子受他一炷香，致令妖精無理，困了你師父。來遲莫怪。這個山就是陷空山了？但不知他的洞門還向那邊開？」行者道：「我這條路且是走熟了，只是這個洞叫做個無底洞，周圍有三百餘里，妖精窠穴甚多。前番我師父在那兩滴水的門樓裡，今番靜悄悄，鬼影也沒個，不知又搬在何處去也。」天王道：「任他設盡千般計，難脫天羅地網中。到洞門前再作道理。」大家就行。咦！約有十餘里，就到了那大石邊。行者指那缸口大的門兒道：「兀的便是也。」天王道：「『不入虎穴，安得虎子。』誰敢當先？」行者道：「我當先。」三太子道：「我奉旨降妖，我當先。」那獃子便莽撞起來，高聲叫道：「當頭還要我老豬。」天王道：「不須囉噪，但依我分擺：孫大聖和太子同領著兵將下去，我們三人在口上把守，做個裡應外合，教他上天無路，入地無門，才顯些些手段。」眾人都答應了一聲：「是。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      八戒と沙悟浄が首を長くして待っていると、天兵と悟空が来るのが見えた。八戒は李天王を迎えて礼をした。八戒「お手数をかけました、お手数を。」
      李天王「天蓬元帥（てんぽうげんすい）、お前は事情を知らぬ。我ら父子があの女から一本の香を受けたばかりに、妖怪を増長させ、お前の師を苦しめることになった。遅くなったのを責めないでくれ。ここが陷空山なのだな。洞の入り口は、どちらにある？」
      悟空「この道なら、すっかり歩き慣れた。ただ、この洞は無底洞という名で、周囲三百余里もあり、妖怪の巣穴がいくつもある。先には師匠は、二段に軒のある門楼の中にいたのに、今度はひっそりとして、幽霊の影一つもない。どこへ移ったものか分からん。」
      李天王「千の計略を尽くそうと、天羅地網（てんらちもう）からは逃れられぬ。洞の入り口で、あらためて考えよう。」
      一同は歩き出した。おや、十余里ほどで、大石のそばへ着いた。悟空は、かめの口ほどの入り口を指さした。悟空「あれだ。」
      李天王「『虎穴に入らずんば、虎子を得ず』という。誰が先に行く？」
      悟空「俺が先に行く。」
      哪吒「私は勅命で妖怪を捕らえに来たのです。私が先に行きます。」
      八戒も向こう見ずになり、大声を上げた。八戒「先頭なら、この俺でなくちゃな。」
      李天王「騒ぐな。私の配置に従えばよい。孫大聖と太子が一緒に兵将を率いて降り、我ら三人は入り口を守る。内と外から呼応し、天へ昇る道も地へ入る門もなくしてこそ、多少の腕も示せるというものだ。」
      一同は声をそろえて答えた。一同「承知しました。」
    "translation_status": "draft"
  - "id": "xy-ch83-023"

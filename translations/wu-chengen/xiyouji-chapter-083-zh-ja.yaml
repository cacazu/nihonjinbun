    "translation_ja": |-
      八戒と沙悟浄はその声を聞き、洞の入り口を開けて悟空を迎えた。八戒と沙悟浄「兄さん、そんなに喜んでいるのは、お師匠さまを助け出せたのですね？」
      悟空は笑った。悟空「俺たちで助ける必要はない。この位牌に、師匠を返せと言えばいい。」
      八戒「兄貴、この位牌は妖怪じゃないし、話もできない。どうやって人を返せと言うんだ？」
      悟空は地面に置いて言った。悟空「見てみろ。」
      沙悟浄が近づいて見ると、「尊父、李天王の位」「尊兄、哪吒三太子の位」と書いてある。沙悟浄「これは、どういうことです？」
      悟空「妖怪が家で祀っていたものだ。住まいへ押し入ってみると、人も物もなく、これだけが残っていた。どうやら李天王の娘で、三太子（さんたいし）の妹が、俗世に憧れて下界へ降り、妖怪に化けて師匠をさらったらしい。あの親子に返せと言わず、誰に言うんだ。お前たちはここを見張っていろ。俺はこの位牌を持って天へ昇り、玉帝（ぎょくてい）の御前へ直訴して、天王の親子に師匠を返させる。」
      八戒「兄貴、『人を死罪で訴えれば、自分が死罪を受ける』っていうぞ。筋が通ってこそ、やれることだ。まして御前への直訴なんて、軽々しくできるものか。どう訴えるつもりか、俺に話してみろよ。」
      悟空は笑った。悟空「考えがある。この位牌と香炉を証拠にして、別に訴状を一通用意する。」
      八戒「訴状にはどう書くんだ。読み上げて聞かせてくれ。」
      悟空は言った。

    "translation_ja": |-
      八戒と沙悟浄はそれを聞き、大喜びした。八戒と沙悟浄「兄さん、その訴えなら筋が通っています。必ず勝てますよ。ぜひ早く戻ってください。少しでも遅れると、妖怪がお師匠さまの命を奪うのではないかと心配です。」
      悟空「すぐだ、すぐだ。長くても飯が炊ける間、短ければ茶の湯が沸く間には戻る。」

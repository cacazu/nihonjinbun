    "source_text": "你看那行者和三太子領了兵將，望洞裡只是一溜。駕起雲光，擡頭一望，果然好個洞啊："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"

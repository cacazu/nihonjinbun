    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說三藏著妖精送出洞外，沙和尚近前問曰：「師父出來，師兄何在？」八戒道：「他有算計，必定貼換師父出來也。」三藏用手指著妖精道：「你師兄在他肚裡哩。」八戒笑道：「腌臢殺人。在肚裡做甚？出來罷。」行者在裡邊叫道：「張開口，等我出來。」那怪真個把口張開。行者變得小小的，\U00027FFC在咽喉之內，正欲出來，又恐他無理來咬，即將鐵棒取出，吹口仙氣，叫：「變！」變作個棗核釘兒，撐住他的上腭子，把身一縱，跳出口外，就把鐵棒順手帶出，把腰一躬，還是原身法像，舉起棒來就打；那妖精也隨手取出兩口寶劍，叮噹架住。兩個在山頭上這場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、三蔵（さんぞう）が女の妖怪に送られて洞の外へ出ると、沙悟浄（さごじょう）が近寄って尋ねた。沙悟浄「お師匠さまは出てこられましたが、兄さんはどちらです？」
      八戒（はっかい）「兄貴には考えがあるんだ。きっと師匠の身代わりに残って、外へ出してくれたんでしょう。」
      三蔵は女の妖怪を指さした。三蔵「お前たちの兄弟子は、この腹の中にいる。」
      八戒は笑った。八戒「汚くってたまらんな。腹の中で何をしてるんだ。出てこいよ。」
      悟空（ごくう）が中から叫んだ。悟空「口を開けろ。出るぞ。」
      女の妖怪は本当に口を開いた。悟空は小さくなり、喉の中に身をかがめて、まさに出ようとした。だが、相手がむやみに噛みついてくるかもしれないと思い、鉄棒を取り出して仙気（せんき）を吹きかけた。悟空「変われ！」
      棒はナツメの種形の釘となった。それで上あごを突っ張らせ、ひと跳びに口の外へ飛び出す。ついでに鉄棒も取り出し、腰をひと曲げすると、元の姿へ戻った。棒を振り上げて打ちかかると、女の妖怪もすぐに宝剣を二本抜き、かちんと受け止める。山の頂で二人が繰り広げた戦いは、まことに激しかった。
    "translation_status": "draft"
  - "id": "xy-ch83-003"
    "section_id": "chapter-83"
    "kind": "verse"
    "origin": "source"
    "source_text": "雙舞劍飛當面架，金箍棒起照頭來。一個是天生猴屬心猿體，一個是地產精靈姹女骸。他兩個，恨沖懷，喜處生仇大會垓。那個要取元陽成配偶，這個要戰純陰結聖胎。棒舉一天寒霧漫，劍迎滿地黑塵篩。因長老，拜如來，恨苦相爭顯大才。水火不投母道損，陰陽難合各分開。兩家鬥罷多時節，地動山搖樹木摧。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 124
        "line_end": 124
    "translation_ja": |-
      二本の剣が舞い飛び、正面から受け止める。金箍棒（きんこぼう）が上がり、頭めがけて打ち下ろす。
      一方は天に生まれた猿の属、心猿（しんえん）の体。一方は地に生まれた精霊、姹女（たじょ）の身。
      二人の胸には恨みが込み上げ、喜びの場から仇が生まれて大合戦。
      あちらは元陽（げんよう）を取って夫婦となろうとし、こちらは純陰（じゅんいん）と戦って聖胎（せいたい）を結ぼうとする。
      棒が上がれば空一面に冷たい霧、剣で迎えれば地一面に黒い塵が舞う。
      長老のため、如来（にょらい）に拝謁するため、苦しい恨みの争いに大いなる技を示す。
      水と火は投合せず、母たる道は損なわれ、陰陽（いんよう）は合い難く、それぞれ離れる。
      二人の長い戦いに、地は動き山は揺れ、木々はへし折られた。
    "translation_status": "draft"
  - "id": "xy-ch83-004"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒見他們賭鬥，口裡絮絮叨叨，返恨行者，轉身對沙僧道：「兄弟，師兄胡纏。才子在他肚裡，掄起拳來，送他一個滿肚紅，巴開肚皮鑽出來，卻不了帳？怎麼又從他口裡出來，卻與他爭戰，讓他這等猖狂？」沙僧道：「正是。卻也虧了師兄深洞中救出師父，返又與妖精廝戰。且請師父自家坐著，我和你各持兵器，助助大哥，打倒妖精去來。」八戒擺手道：「不不不，他有神通，我們不濟。」沙僧道：「說那裡話，都是大家有益之事，雖說不濟，卻也放屁添風。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 125
        "line_end": 125
    "translation_ja": |-
      八戒は二人の戦いを見て、口の中でぶつぶつ言い、かえって悟空に腹を立てた。沙悟浄のほうを向いて言う。八戒「兄弟、兄貴はつまらん手間をかけてるな。さっき腹の中にいたとき、拳を振り回して、腹いっぱい血だらけにしてやり、腹を裂いて這い出れば、片がついたじゃないか。それなのに、なぜわざわざ口から出て戦って、あいつをあんなにのさばらせるんだ？」
      沙悟浄「そのとおりです。でも、兄さんは深い洞からお師匠さまを助け出してくださったうえに、また妖怪と戦っているのです。お師匠さまには一人で座っていていただき、私たちもそれぞれ武器を持って、兄さんを助けに行きましょう。妖怪を倒すのです。」
      八戒は手を振った。八戒「いや、いや、いや。あの人には神通力があるが、俺たちでは役に立たん。」
      沙悟浄「何を言うのです。みんなのためになることですよ。役に立たないといっても、屁をすれば風の足しにはなります。」
    "translation_status": "draft"
  - "id": "xy-ch83-005"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那獃子一時興發，掣了釘鈀，叫聲：「去來。」他兩個不顧師父，一齊駕風趕上，舉釘鈀，使寶杖，望妖精亂打。那妖精戰行者一個已是不能，又見他二人，怎生抵敵，急回頭，抽身就走。行者喝道：「兄弟們趕上。」那妖精見他們趕得緊，即將右腳上花鞋脫下來，吹口仙氣，念個咒語，叫：「變！」即變作本身模樣，使兩口劍舞將來；將身一幌，化一陣清風，徑直回去。這番也只說戰他們不過，顧命而回，豈知又有這般樣事！也是三藏災星未退，他到洞門前牌樓下，卻見唐僧在那裡獨坐，他就近前一把抱住，搶了行李，咬斷韁繩，連人和馬，復又攝將進去不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 127
        "line_end": 127
    "translation_ja": |-
      八戒は急にその気になり、釘鈀（ていは）を抜いて叫んだ。八戒「よし、行こう！」
      二人は師のことを顧みず、一緒に風に乗って追いつき、釘鈀を振り上げ、宝杖（ほうじょう）を振るって、女の妖怪をめった打ちにした。女の妖怪は悟空一人にも敵わないのに、さらに二人が加わっては、どうして防げよう。急いで振り返り、身をかわして逃げた。悟空が喝した。悟空「兄弟たち、追え！」
      追っ手が迫るのを見ると、女の妖怪は右足の花模様の靴を脱いだ。仙気を吹きかけ、呪文を唱えて叫ぶ。女の妖怪「変われ！」
      靴はたちまち本人そっくりになって、二本の剣を舞わせて攻めかかった。その間に本人は身をひと揺すりし、一陣の清風となって、まっすぐ戻っていった。今度はただ、彼らに勝てず、命惜しさに帰っただけと思ったものだが、どうしてこんなことがまた起こると知れよう。三蔵には、まだ災いの星が退いていなかったのだ。女の妖怪が洞の入り口の牌楼（はいろう）の下へ来ると、三蔵が一人で座っている。近寄ってひと抱えにし、荷物を奪い、手綱を噛み切って、人も馬もまとめて、また洞の中へさらい込んだ。こちらの話はひとまず置く。
    "translation_status": "draft"
  - "id": "xy-ch83-006"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "且說八戒閃個空，一鈀把妖精打落地，乃是一隻花鞋。行者看見道：「你這兩個獃子，看著師父罷了，誰要你來幫甚麼功？」八戒道：「沙和尚，如何麼？我說莫來。這猴子好的有些夾腦風，我們替他降了妖怪，返落得他生報怨。」行者道：「在那裡降了妖怪？那妖怪昨日與我戰時，使了一個遺鞋計哄了。你們走了，不知師父如何，我們快去看看。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 128
        "line_end": 128
    "translation_ja": |-
      さて、八戒は隙を突いて、一振りの釘鈀で女の妖怪を地に打ち落とした。ところが、それは花模様の靴が片方あるだけだった。悟空はそれを見ると言った。悟空「この間抜け二人め。師匠を見ていてくれさえすればよかったんだ。誰がお前たちに加勢を頼んだ？」
      八戒「沙和尚（さおしょう）、どうだい。来るなと言ったじゃないか。この猿はどうも少し頭に病気がある。代わりに妖怪を退治してやったのに、逆に恨み言を言われるとはな。」
      悟空「どこで妖怪を退治したんだ？　あの妖怪は昨日、俺と戦ったときにも、靴を残す計略でだましたんだぞ。お前たちが離れたからには、師匠がどうなったか分からん。早く見に行こう。」
    "translation_status": "draft"
  - "id": "xy-ch83-007"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三人急回來，果然沒了師父，連行李、白馬一並無蹤。慌得個八戒兩頭亂跑，沙僧前後跟尋，孫大聖亦心焦性燥。正尋覓處，只見那路傍邊斜軃著半截兒韁繩。他一把拿起，止不住眼中流淚，放聲叫道：「師父啊，我去時辭別人和馬，回來只見這些繩。」正是那：見鞍思俊馬，滴淚想親人。八戒見他垂淚，不禁仰天大笑。行者罵道：「你這個夯貨，又是要散火哩？」八戒又笑道：「哥啊，不是這話，師父一定又被妖精攝進洞去了。常言道：『事無三不成。』你進洞兩遭了，再進去一遭，管情救出師父來也。」行者揩了眼淚道：「也罷，到此地位，勢不容己，我還進去。你兩個沒了行李、馬匹耽心，卻好生把守洞口。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      三人が急いで戻ると、案の定、師はいなかった。荷物も白馬も、すべて跡形がない。八戒は慌ててあちらこちらへ走り回り、沙悟浄も前後を追って捜す。悟空も気が焦り、苛立った。捜していると、道端に半分ちぎれた手綱が、斜めに垂れているのが見えた。悟空はそれをつかみ上げたが、目から流れる涙を抑えられず、大声で呼んだ。悟空「お師匠さま。行くときには人と馬に別れを告げたのに、帰ってみれば、この縄だけとは！」
      まさに、鞍を見れば駿馬を思い、涙を流して親しい人を思う、というありさまである。
      八戒は悟空の涙を見て、思わず天を仰いで大笑いした。悟空は罵った。悟空「この愚か者、また解散したいと言うのか？」
      八戒はなお笑った。八戒「兄貴、そうじゃない。師匠はきっと、また妖怪に洞へさらい込まれたんだ。『物事は三度やらねば成らぬ』っていうだろう。兄貴は洞へ二度入った。もう一度入れば、請け合って師匠を助け出せるさ。」
      悟空は涙をぬぐった。悟空「よし。ここまで来れば、やめるわけにはいかん。もう一度入ろう。お前たちは荷物や馬を気にかける必要もなくなったんだから、しっかり洞の入り口を見張っていろ。」
    "translation_status": "draft"
  - "id": "xy-ch83-008"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，即轉身跳入裡面，不施變化，就將本身法相。真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 132
        "line_end": 132
    "translation_ja": "見事な悟空、さっそく身を返して洞の中へ飛び込んだ。変化の術は使わず、自分自身の姿のままだ。まことに、"
    "translation_status": "draft"
  - "id": "xy-ch83-009"
    "section_id": "chapter-83"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      古怪別腮心裡強，自小為怪神力壯。
      高低面賽馬鞍鞽，眼放金光如火亮。
      渾身毛硬似鋼針，虎皮裙繫明花響。
      上天撞散萬雲飛，下海混起千層浪。
      當天倚力打天王，擋退十萬八千將。
      官封大聖美猴精，手中慣使金箍棒。
      今日西天任顯能，復來洞內扶三藏。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 133
        "line_end": 139
    "translation_ja": |-
      奇怪な、張り出した頬に、強い心。幼いころから妖として、神力はたくましい。
      高低のある顔は鞍の前輪のよう、目から放つ金の光は炎のごとく明るい。
      全身の毛は鋼の針のように硬く、締めた虎皮の腰巻は鮮やかな斑をひびかせる。
      天へ昇れば万の雲を衝き散らし、海へ入れば千重の波をかき立てる。
      かつて天では力を頼みに天王を打ち、十万八千の将を退けた。
      大聖（たいせい）の官に封ぜられた美しい猿の精、手に使い慣れた金箍棒。
      今は西天（さいてん）への道で存分に力を示し、また洞へ来て三蔵を助ける。
    "translation_status": "draft"
  - "id": "xy-ch83-010"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "你看他停住雲光，徑到了妖精宅外。見那門樓門關了，不分好歹，掄鐵棒一下打開，闖將進去。那裡還靜悄悄，全無人跡。東廊下不見唐僧。亭子上桌椅，與各處家火，一件也無。原來他的洞裡週圍有三百餘里，妖精窠穴甚多。前番攝唐僧在此，被行者尋著；今番攝了，又怕行者來尋，當時搬了，不知去向。惱得這行者跌腳搥胸，放聲高叫道：「師父啊，你是個晦氣轉成的唐三藏，災殃鑄就的取經僧。噫！這條路且是走熟了，如何不在？卻教老孫那裡尋找也？」正自吆喝爆燥之間，忽聞得一陣香風撲鼻，他回了性道：「這香煙是從後面飄出，想是在後頭哩。」拽開步，提著鐵棒，走將進去看時，也不見動靜。只見有三間倒坐兒，近後壁卻鋪一張龍吞口雕漆供桌，桌上有一個大流金香爐，爐內有香煙馥郁。那上面供養著一個大金字牌，牌上寫著「尊父李天王之位」；略次些兒，寫著「尊兄哪吒三太子位」。行者見了，滿心歡喜，也不去搜妖怪，找唐僧，把鐵棒捻作個繡花針兒，揌在耳朵裡，掄開手，把那牌子並香爐拿將起來，返雲光，徑出門去。至洞口，唏唏哈哈，笑聲不絕。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 140
        "line_end": 140
    "translation_ja": |-
      見れば、悟空は雲の光を止め、まっすぐ女の妖怪の屋敷の外へ着いた。門楼の門が閉まっていると見るや、かまわず鉄棒を振るい、一撃で打ち開けて押し入った。ところが、そこもひっそりとして、人影はまったくない。東の廊下に三蔵の姿はなく、亭の卓や椅子も、各所の家財道具も、一つ残らずなくなっていた。実はこの洞は周囲三百余里（り）もあり、妖怪の巣穴がいくつもある。先には三蔵をここへさらい、悟空に見つけられた。今度さらったときには、また悟空が捜しに来るのを恐れ、すぐに住まいを移してしまい、行き先は分からない。悟空は怒って地団駄を踏み、胸を叩き、大声で叫んだ。悟空「お師匠さま、あなたは不運が生まれ変わった唐三蔵（とうさんぞう）、災難で鋳固められた取経の僧だ！　ああ、この道ならすっかり歩き慣れたのに、どうしていないのです。この俺に、どこを捜せというのですか？」
      叫び声を上げ、かんかんになっていると、ふいにひと筋の芳香が鼻に届いた。悟空は気を取り直した。悟空「この香の煙は奥から漂ってくる。奥にいるんじゃないか。」
      大股に、鉄棒を提げて入っていったが、やはり物音はしない。ただ、奥には正面の建物と向かい合う三間の建物があり、奥壁の近くに、竜が口を開けた彫刻のある、彫漆（ちょうしつ）の供物卓が据えてあった。卓上には大きな金めっきの香炉が一つあり、そこからかぐわしい香の煙が上がっている。その上には大きな金文字の位牌が祀られ、「尊父、李天王（りてんのう）の位」と書かれていた。少し下の位置には「尊兄、哪吒三太子（なたさんたいし）の位」とある。悟空はこれを見て大喜びした。もう妖怪を捜すことも、三蔵を見つけることもせず、鉄棒を刺繍針ほどに縮めて耳へ差し込んだ。両手を広げて位牌と香炉を取り上げ、雲の光を返すと、まっすぐ外へ出ていった。洞の入り口へ着くころには、ひいひい、はははと、笑い声が絶えなかった。

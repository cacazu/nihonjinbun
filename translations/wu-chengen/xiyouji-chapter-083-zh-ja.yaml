    "translation_ja": |-
      言い終わらぬうちに、李天王が刀を振り、悟空の頭めがけて斬りつけた。すでに哪吒が駆け寄り、斬妖剣（ざんようけん）で受け止め、叫んだ。哪吒「父上、お怒りをお鎮めください！」
      李天王は仰天して顔色を失った。
    "translation_status": "draft"
  - "id": "xy-ch83-017"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "噫！父見子以劍架刀，就當喝退，怎麼返大驚失色？原來天王生此子時，他左手掌上有個「哪」字，右手掌上有個「吒」字，故名哪吒。這太子三朝兒就下海淨身闖禍，踏倒水晶宮，捉住蛟龍要抽筋為絛子。天王知道，恐生後患，欲殺之。哪吒奮怒，將刀在手，割肉還母，剔骨還父，還了父精母血。一點靈魂，徑到西方極樂世界告佛。佛正與眾菩薩講經，只聞得幢幡寶蓋有人叫道：「救命！」佛慧眼一看，知是哪吒之魂，即將碧藕為骨，荷葉為衣，念動起死回生真言，哪吒遂得了性命。運用神力，法降九十六洞妖魔，神通廣大。後來要殺天王，報那剔骨之仇。天王無奈，告求我佛如來。如來以和為尚，賜他一座玲瓏剔透舍利子如意黃金寶塔。那塔上層層有佛，豔豔光明。喚哪吒以佛為父，解釋了冤仇。所以稱為托塔李天王者，此也。今日因閑在家，未曾托著那塔，恐哪吒有報仇之意，故嚇個大驚失色。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 149
        "line_end": 149
    "translation_ja": |-
      おや、父親なら、息子が剣で自分の刀を受け止めたのを見れば、叱って退かせればよさそうなもの。それがなぜ、逆に顔色を失うほど驚いたのか。実は、この子が生まれたとき、左の手のひらに「哪」、右の手のひらに「吒」の字があったので、哪吒と名づけた。この太子は生後三日で海へ身を清めに行き、騒ぎを起こした。水晶宮（すいしょうきゅう）を踏み倒し、蛟竜（こうりゅう）を捕まえ、筋を引き抜いて帯紐にしようとしたのだ。李天王はそれを知り、後患を恐れて殺そうとした。哪吒は激怒し、刀を手に取ると、肉をそいで母へ返し、骨を削り出して父へ返した。父の精と母の血を返したのである。そのひと筋の魂は、まっすぐ西方極楽世界（さいほうごくらくせかい）へ行き、仏に訴えた。
      仏が菩薩（ぼさつ）たちに経を説いていると、幢幡（どうばん）と宝蓋（ほうがい）の間で、叫び声が聞こえた。哪吒の魂「お助けください！」
      仏は慧眼（えげん）で見て、哪吒の魂だと知り、青い蓮根を骨、蓮の葉を衣として、死者を生き返らせる真言（しんごん）を唱えた。こうして哪吒は命を得た。神力を振るい、法術で九十六洞の妖魔を降したほど、神通力は広大だった。後には、骨を削った恨みを晴らすため、李天王を殺そうとした。天王は仕方なく、我らの仏、如来に救いを求めた。如来は和を尊び、透かし細工も精妙な、舎利子（しゃりし）を納めた如意黄金宝塔（にょいおうごんほうとう）を一基授けた。その塔は層ごとに仏があり、まばゆく光り輝いていた。如来は哪吒に、仏を父とするよう命じ、怨恨を解いた。托塔李天王と呼ばれるのは、このためなのである。今日は自宅でくつろいでいたので、その塔を手に載せていなかった。哪吒に復讐の意があるのではないかと恐れ、顔色を失うほど驚いたのだ。
    "translation_status": "draft"
  - "id": "xy-ch83-018"
    "section_id": "chapter-83"
    "kind": "paragraph"

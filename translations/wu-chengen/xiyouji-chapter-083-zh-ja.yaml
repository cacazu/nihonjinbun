    "source_text": "「告狀人孫悟空，年甲在牒，係東土唐朝西天取經僧唐三藏徒弟。告為假妖攝陷人口事：今有托塔天王李靖同男哪吒太子，閨門不謹，走出親女，在下方陷空山無底洞變化妖邪，迷害人命無數。今將吾師攝陷曲邃之所，渺無尋處。若不狀告，切思伊父子不仁，故縱女氏成精害眾。伏乞憐准，行拘至案，收邪救師，明正其罪，深為恩便。有此上告。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 142
        "line_end": 142
    "translation_ja": |-
      悟空「訴人、孫悟空（そんごくう）。年齢・生年は文牒（ぶんちょう）記載のとおり。東土（とうど）唐朝の、西天へ取経する僧、唐三蔵の弟子である。
      妖怪を装い、人をさらって閉じ込めた件について訴える。
      托塔天王李靖（たくとうてんのうりせい）およびその子、哪吒太子（なたたいし）は、家内の取り締まりを怠り、実の娘を出奔させた。その女は下界の陷空山（かんくうざん）無底洞（むていどう）で妖怪に変化し、数知れぬ人を惑わせ、命を害している。今や我が師をさらい、曲がりくねった奥深い場所へ閉じ込め、捜す手立てもない。
      ここに訴えなければ、思うに、かの父子は情け知らずにも、故意に女を放任し、妖となって衆人を害させていることになる。
      伏してお願い申し上げる。哀れんで本訴をお受け入れくださり、かの者らを法廷へ拘引し、妖怪を捕らえて師を救い、その罪を明らかにして正しくお裁きくだされば、深くご恩を感じるものである。以上、上訴いたします。」

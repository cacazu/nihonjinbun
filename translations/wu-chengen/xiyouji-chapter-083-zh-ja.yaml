    "source_text": "卻即回手，向塔座上取了黃金寶塔，托在手間，問哪吒道：「孩兒，你以劍架住我刀，有何話說？」哪吒棄劍叩頭道：「父王，是有女兒在下界哩。」天王道：「孩兒，我只生了你姊妹四個，那裡又有個女兒哩？」哪吒道：「父王忘了？那女兒原是個妖精。三百年前成怪，在靈山偷食了如來的香花寶燭，如來差我父子天兵，將他拿住。拿住時，只該打死，如來吩咐道：『積水養魚終不釣，深山喂鹿望長生。』當時饒了他性命。積此恩念，拜父王為父，拜孩兒為兄，在下方供設牌位，侍奉香火。不期他又成精，陷害唐僧，卻被孫行者搜尋到巢穴之間，將牌位拿來，就做名告了御狀。此是結拜之恩女，非我同胞之親妹也。」天王聞言，悚然驚訝道：「孩兒，我實忘了。他叫做甚麼名字？」太子道：「他有三個名字：他的本身出處，喚做金鼻白毛老鼠精；因偷香花寶燭，改名喚做半截觀音；如今饒他下界，又改了，喚做地湧夫人是也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      そこで李天王は、すぐさま手を返して塔座から黄金宝塔（おうごんほうとう）を取り、手のひらに載せて、哪吒に尋ねた。李天王「我が子よ、剣で私の刀を受け止めたのは、何か言うことがあるのか？」
      哪吒は剣を置いて頭を地につけた。哪吒「父上、下界に娘がいることは確かなのです。」
      李天王「我が子よ、私に生まれたのは、お前たち兄弟姉妹四人だけだ。ほかにどこに娘がいる？」
      哪吒「父上はお忘れですか。あの娘は、もとは妖怪です。三百年前に妖となり、霊山（れいざん）で如来の香花と宝燭を盗み食いしたので、如来は私たち父子と天兵を遣わし、捕らえさせました。捕らえたときには、打ち殺すところでしたが、如来が『水をためて魚を養い、ついに釣らず。深山で鹿を養い、長く生きるのを望む』と仰せになり、命をお助けになりました。あの女はその恩を心に刻み、父上を父、私を兄と仰ぎ、下界に位牌を設け、香を供えて仕えていたのです。思いがけず、また妖となって唐僧（とうそう）を捕らえたところ、孫行者（そんぎょうじゃ）が巣穴へ捜しに来て位牌を持ち出し、それを名目に御前へ訴えたのです。これは恩によって親子の契りを結んだ娘で、私と同じ腹から生まれた実の妹ではありません。」
      李天王はそれを聞き、はっと驚いた。李天王「我が子よ、すっかり忘れていた。その女は何という名前だった？」
      哪吒「あの女には三つの名があります。本来の出自からは金鼻白毛老鼠精（きんびはくもうろうそせい）といいました。香花と宝燭を盗んだことから、半截観音（はんせつかんのん）と改名しました。命を許されて下界へ行ってからは、また改めて地湧夫人（ちゆうふじん）と名乗っています。」
    "translation_status": "draft"
  - "id": "xy-ch83-019"
    "section_id": "chapter-83"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "天王卻才省悟，放下寶塔，便親手來解行者。行者就放起刁來道：「那個敢解我？要便連繩兒擡去見駕，老孫的官事才贏。」慌得天王手軟，太子無言，眾家將委委而退。那大聖打滾撒賴，只要天王去見駕。天王無計可施，哀求金星說個方便。金星道：「古人云：『萬事從寬。』你幹事忒緊了些兒，就把他綑住，又要殺他。這猴子是個有名的賴皮，你如今教我怎的處？若論你令郎講起來，雖是恩女，不是親女，卻也晚親義重，不拘怎生折辨，你也有個罪名。」天王道：「老星怎說個方便，就沒罪了。」金星道：「我也要和解你們，卻只是無情可說。」天王道：「你把那奏招安授官銜的事，說說他也罷了。」真個金星上前，將手摸著行者道：「大聖，看我薄面，解了繩好去見駕。」行者道：「老官兒，不用解，我會滾法，一路滾就滾到也。」金星笑道：「你這猴忒恁寡情。我昔日也曾有些恩義兒到你，我這些些事兒，就不依我？」行者道：「你與我有甚恩義？」金星道：「你當年在花果山為怪，伏虎降龍，強消死籍，聚群妖大肆猖狂，上天欲要擒你，也是老身力奏，降旨招安，把你宣上天堂，封你做弼馬溫。你吃了玉帝仙酒，後又招安，也是老身力奏，封你做『齊天大聖』。你又不守本分，偷桃盜酒，竊老君之丹，如此如此，才得個無滅無生。若不是我，你如何得到今日？」行者道：「古人說得好：『死了莫與老頭兒同墓。』乾淨會揭挑人。我也只是做弼馬溫，鬧天宮罷了，再無甚大事。也罷，也罷，看你老人家面皮，還教他自己來解。」天王才敢向前，解了縛，請行者著衣上坐，一一上前施禮。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch83-1455632"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第083回&oldid=1455632"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      李天王はようやく思い当たり、宝塔を置いて、自ら悟空の縄を解こうとした。すると悟空は、わざと意地を張り始めた。悟空「誰が俺の縄を解いていいと言った？　やるなら縄ごと御前へ担いでいけ。そうしてこそ、この俺の訴訟は勝ちになる。」
      慌てた李天王は手の力が抜け、哪吒は言葉を失い、配下の将たちはおずおずと退いた。悟空は転げ回ってごね、どうしても天王を御前へ連れていこうとする。天王は手の打ちようがなく、太白金星に何とか取りなしてくれと哀願した。
      太白金星「古人は『万事、寛大に』と申します。あなたはやり方がきつすぎました。いきなり縛り、殺そうとまでした。この猿は有名な厄介者です。今さら私にどうしろというのです。ご子息の話によれば、恩による娘で実の娘でないにしても、年下の親族への義理は重い。どう弁明しても、あなたにも罪があることになります。」
      李天王「星君、何とかうまく取りなしてくだされば、罪にもなるまい。」
      太白金星「私もお二人を和解させたいのですが、持ち出せる義理がありません。」
      李天王「招安（しょうあん）して官職を授けるよう奏上した、あの話をしてみてはどうです。」
      そこで太白金星は進み出て、悟空に手を触れながら言った。太白金星「大聖、私の顔を立てて、縄を解き、御前へ行きましょう。」
      悟空「ご老人、解かなくていい。俺は転がる術を知っている。ずっと転がっていけば着くさ。」
      太白金星は笑った。太白金星「この猿は、何と情け知らずなのでしょう。昔、私も少しはあなたに恩義を施しました。この程度の頼みも、聞いてくれないのですか？」
      悟空「あんたに、どんな恩義を受けたというんだ？」
      太白金星「かつてあなたは花果山（かかざん）で妖となり、虎を伏せ、竜を降し、無理やり死者の名簿から名を消し、妖たちを集めて、好き放題に暴れていました。天が捕らえようとしたとき、私が力を尽くして奏上し、招安の勅命を下していただいたのです。あなたを天上へ呼び、弼馬温（ひつばおん）に封じました。あなたは玉帝の仙酒を飲み、その後にまた招安となったときにも、私が力を尽くして奏上し、『斉天大聖（せいてんたいせい）』に封じられた。なのに、あなたは本分を守らず、桃を盗み、酒を盗み、老君（ろうくん）の丹を盗んだ。そんなこんなで、滅びも生まれもない身を得たのです。私がいなかったら、どうして今日まで来られたでしょう？」
      悟空「古人はうまいことを言った。『死んでも年寄りと同じ墓に入るな』だ。まったく、人の古傷を掘り返すことばかりだ。俺だって弼馬温になって、天宮で暴れただけで、ほかに大したことはしていない。いいだろう、いいだろう。あんたの顔を立てる。ただし、天王自身に解かせろ。」
      李天王は、ようやく近づく勇気が出た。縄を解き、悟空に衣服を整えて上座へ着くよう勧めた。それから、一人ずつ進み出て礼をした。

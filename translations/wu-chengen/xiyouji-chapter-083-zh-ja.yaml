    "source_text": "八戒、沙僧聽見，掣放洞口，迎著行者道：「哥哥這等歡喜，想是救出師父也？」行者笑道：「不消我們救，只問這牌子要人。」八戒道：「哥啊，這牌子不是妖精，又不會說話，怎麼問他要人？」行者放在地下道：「你們看。」沙僧近前看時，上寫著「尊父李天王之位」、「尊兄哪吒三太子位」。沙僧道：「此意何也？」行者道：「這是那妖精家供養的。我闖入他住居之所，見人物俱無，惟有此牌。想是李天王之女，三太子之妹，思凡下界，假扮妖邪，將我師父攝去。不問他要人，卻問誰要？你兩個且在此把守，等老孫執此牌位，徑上天堂玉帝前告個御狀，教天王爺兒們還我師父。」八戒道：「哥啊，常言道：『告人死罪得死罪。』須是理順，方可為之。況御狀又豈是可輕易告的？你且與我說，怎的告他？」行者笑道：「我有主張：我把這牌位、香爐做個證見，另外再備紙狀兒。」八戒道：「狀兒上怎麼寫？你且念念我聽。」行者道："

  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭詩は誕生の因縁、如来の会座、静観、十方と、太子が実母に尋ねる筋を重ねている。「一行一步一花新」は行いと歩みの一つごとに花が新しく開く像を保持し、単なる成長の教訓へ要約しない。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-03-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "皇后の「龍歸碧海，鳳返丹霄」は帝王の死を婉曲にいう比喩。実際に竜や鳳凰へ変身する予告ではない。母子が尋ね、答える夫婦の閨の事情と、三年前まで／この三年の対比を保った。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-04-body"
  "section_id": "chapter-38-notes"

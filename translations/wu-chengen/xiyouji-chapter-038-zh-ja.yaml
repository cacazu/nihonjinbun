  "translation_ja": "太子の報告は底本で「今夜三更」となっているが、同日の夕方より前に、前夜の夢を振り返る文脈である。訳文は「その夜の三更」とし、原文欄の「今夜」は訂正しない。皇后の四更の夢との前後関係を保持する。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-05-body"

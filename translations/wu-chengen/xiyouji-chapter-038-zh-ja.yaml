  "source_text": "八戒道：「且嘆他做甚？快幹我們的買賣去來。」行者雖然感慨，卻留心想起唐僧的夢來，說芭蕉樹下方是井。正行走，果見一株芭蕉，生得茂盛，比眾花木不同。真是："
  "source_languages":

  "source_text": "兩個密密的開了門，躲離三藏，縱祥光，徑奔那城。不多時到了，按落雲頭，只聽得樓頭方二鼓矣。行者道：「兄弟，二更時分了。」八戒道：「正好，正好，人都在頭覺裡正濃睡也。」二人不奔正陽門，徑到後宰門首，只聽得梆鈴聲響。行者道：「兄弟，前後門皆緊急，如何得入？」八戒道：「那見做賊的從門裡走麼，瞞牆跳過便罷。」行者依言，將身一縱，跳上裡羅城牆。八戒也跳上去。二人潛入裡面，找著門路，徑尋那御花園。"
  "source_languages":
  - "zh-Hant"
  "source_locations":

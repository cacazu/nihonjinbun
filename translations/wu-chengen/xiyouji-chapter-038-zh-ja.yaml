  "translation_ja": |-
    三蔵「それでは、お前はどう処理するつもりだ。」
    悟空は笑った。
    悟空「私にはもう策があります。ただ、お師匠さまが少しばかり身びいきをなさるので、それが差し障りになりそうなのです。」
    三蔵「私が何をかばっているというのだ。」
    悟空「八戒（はっかい）は鈍くさいものだから、お師匠さまは、少しあいつに肩入れなさる。」
    三蔵「どう肩入れしている。」
    悟空「そうでないなら、今は肝を据えて、沙悟浄（さごじょう）とここにお残りください。私と八戒が、今のうちに烏鶏国の都へ忍び込み、御花園を探し当て、瑠璃井の蓋を開けて、皇帝の死体を引き上げます。それを私たちの荷包みにくるむのです。明日都へ入ったら、通行証の書き換えなど後回しにして、あの化け物を見るなり棒を抜いて打ちかかります。何か言ってきたら、死骸を見せ、『お前が殺したのは、この人だ』と言ってやる。そこへ太子を出して父を悼んで泣かせ、皇后に出てもらって夫だと認めさせ、文武の役人たちにも主君を見せます。それから私と弟弟子たちで手を下す。こうして、訴えの相手も証拠もはっきりしてこそ、裁きも進めやすいのです。」
    三蔵は聞いて、ひそかに喜んだ。
    三蔵「ただ、八戒が行きたがらぬのではないか。」
    悟空は笑った。
    悟空「ほら、やはりかばっていらっしゃる。どうして、もう行きたがらないとわかるのです。さっき私がお呼びしても答えなかったように、半時ばかり黙っていてください。私はこれから、この三寸の舌で説き伏せます。猪八戒（ちょはっかい）はおろか、猪九戒（ちょきゅうかい）だろうと、私について来させてみせます。」
    三蔵「よかろう。好きなように呼んでくるがよい。」
  "translation_status": "reviewed"
- "id": "xy-ch38-012"

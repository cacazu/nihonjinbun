    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    さすがは悟空、金箍棒（きんこぼう）を取り出し、両端をぐいと引いて叫んだ。
    悟空「伸びろ！」
    棒はたっぷり七、八丈の長さになった。
    悟空「八戒、片方の端につかまれ。井戸の下へ下ろしてやる。」
    八戒「兄貴、下ろすのはいいが、水面まで来たら止めてくれよ。」
    悟空「わかってる。」
    八戒が鉄棒にしがみつくと、悟空は軽々と持ち上げ、井戸へ下ろした。ほどなく水面まで届いた。
    八戒「水に着いたぞ。」
    それを聞くと、悟空は逆に棒を下へ押し込んだ。八戒はどぶんと頭まで沈み、棒を放すと、泳ぎながら、ぶつぶつとわめいた。
    八戒「この罰当たりめ！　水まで来たら止めろと言ったのに、下へ押し込みやがった。」
    悟空は棒を引き上げ、笑って聞いた。
    悟空「兄弟、宝物はあるか。」
    八戒「何が宝物だ。井戸いっぱいの水しかないぞ。」
    悟空「宝物は水の底に沈んでいるのさ。潜って、手で探してみろ。」
    八戒は本当に泳ぎが達者なので、ひと息に水中へ潜った。ところが、井戸の底はたいそう深い。さらに力をこめて潜り、ふと目を開くと、一つの楼門が見え、その上に「水晶宮（すいしょうきゅう）」の三文字があった。八戒は大いに驚いた。
    八戒「しまった、しまった。道を間違えたぞ。海へ落ち込んじまった。海に水晶宮があるのはわかるが、井戸の中に、どうしてあるんだ。」
    八戒は知らなかったのだ。これは井竜王（せいりゅうおう）の水晶宮なのであった。

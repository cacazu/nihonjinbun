  "source_text": "好大聖，你看他就在太子面前，顯個手段，將身一縱，跳在雲端裡。捻著訣，念一聲「唵藍淨法界」的真言，拘得那山神、土地在半空中施禮道：「大聖，呼喚小神，有何使令？」行者道：「老孫保護唐僧到此，欲拿邪魔，奈何那太子打獵無物，不敢回朝。問汝等討個人情，快將獐\U00024731鹿兔、走獸飛禽，各尋些來，打發他回去。」山神、土地聞言，敢不承命，又問各要幾何。大聖道：「不拘多少，取些來便罷。」那各神即著本處陰兵，刮一陣聚獸陰風，捉了些野雞山雉、角鹿肥獐、狐獾狢兔、虎豹狼蟲，共有百千餘隻，獻與行者。行者道：「老孫不要，你可把他都捻就了觔，單擺在那四十里路上兩傍，教那些人不放鷹犬，拿回城去，算了汝等之功。」眾神依言，收了陰風，擺在左右。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 132
    "line_end": 132
  "translation_ja": |-
    さすがは悟空、太子の目の前で腕前を見せ、ひと跳びに雲の上へ躍り出た。手で印を結び、「唵藍浄法界（おんらんじょうほっかい）」という真言を一声唱えると、山神（さんじん）と土地神（とちがみ）が呼び寄せられ、空中で礼をした。
    山神と土地神「大聖（たいせい）さま、この小さな神どもをお呼びになって、何を仰せつけになりますか。」
    悟空「俺は唐僧を守ってここまで来た。邪魔者を捕らえようと思うのだが、あの太子が狩りの獲物を何も取れず、朝廷へ帰れずにいる。お前たちにひとつ、骨を折ってもらいたい。キバノロやイノシシ、鹿や兎、地を走る獣や空を飛ぶ鳥を、それぞれ少しずつ急いで見つけてきてくれ。太子を帰してやるのだ。」
    山神と土地神は、命令に従わずにいられようか。さらに、種類ごとに何匹ずつ必要かと尋ねた。
    悟空「数は多くても少なくてもよい。いくらか持ってくれば、それでいい。」
    神々はすぐに土地の陰兵（いんぺい）に命じ、獣を集める陰気な風を吹かせた。野鶏や山雉、角のある鹿や肥えたキバノロ、狐、アナグマ、ムジナ、兎、虎、豹、狼、さまざまな獣を、合わせて百、千をも越えるほど捕らえ、悟空へ差し出した。
    悟空「俺がもらうのではない。それらの筋をひねり縮めて動けなくし、四十里の道の両側へ、並べておいてくれ。兵士たちが鷹も猟犬も放たず、都へ持ち帰れるようにな。それでお前たちの手柄としよう。」
    神々は言いつけどおりに陰風を収め、獲物を道の左右へ並べた。
  "translation_status": "reviewed"

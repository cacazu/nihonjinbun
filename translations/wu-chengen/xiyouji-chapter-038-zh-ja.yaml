  "source_text": "正行時，只見有一座三簷白簇的門樓，上有三個亮灼灼的大字，映著那星月光輝，乃是「御花園」。行者近前看了，有幾重封皮，公然將鎖門鏽住了，即命八戒動手。那獃子掣鐵鈀，盡力一築，把門築得粉碎。行者先舉步䟕入，忍不住跳將起來，大呼小叫。諕得八戒上前扯住道：「哥呀，害殺我也。那見做賊的這般吆喝？驚醒了人，把我們拿住，發到官司，就不該死罪，也要解回原籍充軍。」行者道：「兄弟啊，你說我發急為何？你看這："

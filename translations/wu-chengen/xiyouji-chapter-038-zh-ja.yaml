  "source_text": "行者才按雲頭，對太子道：「殿下請回，路上已有物了，你自收去。」太子見他在半空中弄此神通，如何不信，只得叩頭拜別。出山門傳了令，教軍士們回城。只見那路傍果有無限的野物，軍士們不放鷹犬，一個個俱著手擒捉喝采，俱道是千歲殿下的洪福，怎知是老孫的神功。你聽凱歌聲唱，一擁回城。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    悟空はそこで雲から下り、太子に言った。
    悟空「殿下、お帰りください。道にはもう獲物がいます。拾ってお帰りになればよい。」
    太子は、悟空が空中でこれほどの神通力を振るうのを見たのだから、どうして信じずにいられよう。頭を下げて別れを告げるほかなく、山門を出ると、兵士たちに都へ戻れと命じた。見れば、道のそばには本当に無数の獲物がいる。兵士たちは鷹も猟犬も放たず、誰もが素手で捕まえては歓声を上げた。皆、千歳（せんざい）殿下の大きな福徳のおかげだと言ったが、悟空の神通の手柄とは知りもしない。さあ、聞こえてくるのは勝ち歌の声。皆はどっと都へ帰っていった。
  "translation_status": "reviewed"
- "id": "xy-ch38-010"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這行者保護了三藏。那本寺中的和尚見他們與太子這樣綢繆，怎不恭敬？卻又安排齋供，管待了唐僧，依然還歇在禪堂裡。將近有一更時分，行者心中有事，急睡不著。他一轂轆爬起來，到唐僧床前，叫：「師父。」此時長老還未睡哩，他曉得行者會失驚打怪的，推睡不應。行者摸著他的光頭，亂搖道：「師父怎睡著了？」唐僧怒道：「這個頑皮，這早晚還不睡，吆喝甚麼？」行者道：「師父，有一樁事兒，和你計較計較。」長老道：「甚麼事？」行者道：「我日間與那太子誇口，說我的手段比山還高，比海還深，拿那妖精如探囊取物一般，伸了手去就拿將轉來。卻也睡不著，想起來，有些難哩。」唐僧道：「你說難，便就不拿了罷。」行者道：「拿是還要拿，只是理上不順。」唐僧道：「這猴頭亂說。妖精奪了人君位，怎麼叫做理上不順？」行者道：「你老人家只知念經拜佛，打坐參禪，那曾見那蕭何的律法？常言道：『拿賊拿贓。』那怪物做了三年皇帝，又不曾走了馬腳，漏了風聲。他與三宮妃后同眠，又和兩班文武共樂，我老孫就有本事拿住他，也不好定個罪名。」唐僧道：「怎麼不好定罪？」行者道：「他就是個沒嘴的葫蘆，也與你滾上幾滾。他敢道：『我是烏雞國王，有甚逆天之事，你來拿我？』將甚執照與他折辯？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    悟空はこうして三蔵を守っていた。寺の僧たちは、一行が太子とこれほど親しくしているのを見て、丁重にもてなさずにいられようか。また精進の食事を用意して三蔵を接待し、一行は前と同じく禅堂に泊まった。
    そろそろ初更というころ、悟空は気にかかることがあり、焦って眠れなかった。ひょいと起き上がり、三蔵の寝床へ行って呼びかけた。
    悟空「お師匠さま。」
    三蔵もまだ眠っていなかったが、悟空がまた何かで大騒ぎするのを知っていたので、寝たふりをして答えなかった。悟空は三蔵のつるつるの頭に手を置き、しきりに揺すった。
    悟空「お師匠さま、もう眠ってしまわれたのですか。」
    三蔵は腹を立てた。
    三蔵「このいたずら者め。こんな時刻になっても寝ずに、何をわめいている。」
    悟空「お師匠さま、一つ、ご相談したいことがあります。」
    三蔵「何だ。」
    悟空「昼間、太子に大きな口をききました。私の腕前は山より高く、海より深い、あの妖怪を捕らえるなど袋の中の物を取り出すようなもので、手を伸ばせば、そのまま引っつかんで帰れると。ところが眠れずに考えてみると、ちょっと難しいのです。」
    三蔵「難しいというなら、捕らえなくてもよいではないか。」
    悟空「捕らえるには捕らえます。ただ、道理の筋が通らないのです。」
    三蔵「この猿め、何を言っている。妖怪が人の君主の位を奪ったのだ。どうして筋が通らない。」
    悟空「お師匠さまはお経を読み、仏を拝み、座って禅を修めることばかりご存じで、蕭何（しょうか）の定めた法律など、ご覧になったこともないでしょう。世間でも『盗人を捕らえるなら、盗みの証拠も押さえよ』と言います。あの化け物は三年も皇帝を務め、まだ馬脚を現したことも、うわさが漏れたこともありません。三つの後宮の妃や皇后と床をともにし、文官武官の両班とともに楽しんできたのです。私に捕まえる力があっても、罪名を決めるのは容易ではありません。」
    三蔵「どうして罪を決められぬ。」
    悟空「相手が口のない瓢箪だとしても、ごろごろ転がって、何度かは逆らうでしょう。まして、あいつならきっと、『私は烏鶏国王（うけいこくおう）だ。どんな天に背くことをしたというので、お前は私を捕らえるのだ』と言い張ります。どんな証拠を示して、言い負かすのです。」
  "translation_status": "reviewed"

  "source_text": "那龍王整衣冠，領眾水族，出門來厲聲高叫道：「天蓬元帥，請裡面坐。」八戒卻才歡喜道：「原來是個故知。」那獃子不管好歹，徑入水晶宮裡。其實不知上下，赤淋淋的，就坐在上面。龍王道：「元帥，近聞你得了性命，皈依釋教，保唐僧西天取經，如何得到此處？」八戒道：「正為此說。我師兄孫悟空多多拜上，著我來問你取甚麼寶貝哩。」龍王道：「可憐，我這裡怎麼得個寶貝？比不得那江、河、淮、濟的龍王，飛騰變化，便有寶貝。我久困於此，日月且不能長見，寶貝果何自而來也？」八戒道：「不要推辭，有便拿出來罷。」龍王道：「有便有一件寶貝，只是拿不出來，就元帥親自來看看，何如？」八戒道：「妙妙妙，須是看看來也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 162
    "line_end": 162
  "translation_ja": |-
    井竜王は衣冠を整え、水中の一族を率いて門を出ると、張りのある声で高く呼びかけた。
    井竜王「天蓬元帥、どうぞ中へお入りください。」
    八戒はそれで初めて喜んだ。
    八戒「何だ、昔なじみだったのか。」
    八戒は何もかまわず、まっすぐ水晶宮へ入った。まったく上下の分をわきまえず、真っ裸のまま上座に腰を下ろした。
    井竜王「元帥、このごろ、命を取りとめて仏教に帰依なさり、唐僧を守って西天（さいてん）へ経を取りに向かっておられると聞きました。どうしてこちらへおいでになったのでしょう。」
    八戒「まさにそのことで来たのさ。兄弟子の孫悟空（そんごくう）から、くれぐれもよろしくと伝言だ。それで俺をよこして、あんたの持つ何か宝物をもらってこいと言うんだよ。」
    井竜王「困ったことです。こんな所で、どうして宝など手に入りましょう。長江（ちょうこう）、黄河（こうが）、淮水（わいすい）、済水（せいすい）の竜王とはわけが違います。あちらは空を飛び、変化もなさるから、宝もお持ちでしょう。私は長くここへ閉じ込められ、日や月さえ、そうたびたびは見られません。宝など、いったいどこから手に入るというのでしょう。」
    八戒「断るなよ。あるなら出してくれ。」
    井竜王「あるには、一つございます。ただ、持ってくることができません。元帥ご自身で、ご覧になってはいかがでしょう。」
    八戒「いいとも、いいとも、いいとも。ぜひ見せてもらおう。」
  "translation_status": "reviewed"

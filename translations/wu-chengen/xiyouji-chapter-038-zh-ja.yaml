  "translation_ja": |-
    進んでいくと、三重の軒を備えた、白く見える門楼があった。星と月の光を受け、三つの大きな文字が明るく輝いている。「御花園」であった。悟空が近寄って見ると、幾重もの封印の紙が貼られ、錠はすっかりさびついて、門を閉ざしている。すぐ八戒に手を下すよう命じると、八戒は鉄の熊手を抜き、力いっぱい打ち込んで、門を粉々にした。
    悟空は先に足を踏み入れたが、思わず跳び上がり、大声で騒ぎだした。驚いた八戒は駆け寄って引き止めた。
    八戒「兄貴、俺を破滅させる気か。こんなに騒ぐ泥棒があるものか。人を起こして捕まったら、お役所へ突き出されるぞ。死罪にならなくたって、本籍地へ送り返され、軍役に服する刑にされちまう。」
    悟空「兄弟、俺がどうして騒いだと思う。これを見ろ。
  "translation_status": "reviewed"
- "id": "xy-ch38-015"

  "translation_ja": |-
    第三十八回
    嬰児は母に問うて邪正を知り、金と木は玄理を究めて偽りと真を見分ける
  "translation_status": "reviewed"
- "id": "xy-ch38-002"
  "section_id": "chapter-38"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    逢君只說受生因，便作如來會上人。
    一念靜觀塵世佛，十方同看降威神。
    欲知今日真明主，須問當年嫡母身。
    別有世間曾未見，一行一步一花新。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 121
    "line_end": 124
  "translation_ja": |-
    あなたに会って、生まれてきた因縁を説くだけで、
    たちまち如来（にょらい）の説法の集いに連なる者となる。
    ひとすじの思いを静め、塵の世におわす仏を観じれば、
    十方（じっぽう）の世界も、ともに神威の降り立つさまを見る。
    今のまことの明君を知ろうと思うなら、
    かつて自分を産んだ正妻の母に尋ねるがよい。
    世間がまだ目にしたことのない境地が、別にある。
    ひとたび行い、一歩を進めるたび、新しい花が咲く。
  "translation_status": "reviewed"
- "id": "xy-ch38-003"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那烏雞國王太子自別大聖，不多時，回至城中。果然不奔朝門，不敢報傳宣詔，徑至後宰門首，見幾個太監在那裡把守。見太子來，不敢阻滯，讓他進去了。好太子，夾一夾馬，撞入裡面，忽至錦香亭下。只見那正宮娘娘坐在錦香亭上，兩邊有數十個嬪妃掌扇，那娘娘倚雕欄兒流淚哩。你道他流淚怎的？原來他四更時也做了一夢，記得一半，含糊了一半，沉沉思想。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 126
    "line_end": 126
  "translation_ja": |-
    さて、烏鶏国（うけいこく）の太子は悟空（ごくう）に別れを告げ、ほどなく都へ戻った。言いつけどおり、朝廷の正門へは向かわず、取次ぎを頼んで召し出しを待つこともせず、まっすぐ後宰門（こうさいもん）へ向かった。門を守る数人の宦官は、太子の姿を見ると、とどめるわけにもいかず、中へ通した。太子は馬の腹を両脚で挟み、そのまま駆け入ると、たちまち錦香亭（きんこうてい）の下へ着いた。
    亭の上には皇后が座り、その両側では数十人の妃たちが扇をあおいでいた。皇后は彫刻のある欄干にもたれ、涙を流している。なぜ泣いていたのか。実は皇后も四更のころに夢を見ていた。半分は覚えているが、半分はぼんやりしており、深く思いに沈んでいたのだ。
  "translation_status": "reviewed"
- "id": "xy-ch38-004"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "這太子下馬，跪於亭下，叫：「母親。」那娘娘強整歡容，叫聲：「孩兒，喜呀！喜呀！這二三年在前殿與你父王開講，不得相見，我甚思量。今日如何得暇來看我一面？誠萬千之喜！誠萬千之喜！孩兒，你怎麼聲音悲慘？你父王年紀高邁，有一日龍歸碧海，鳳返丹霄，你就傳了帝位，還有甚麼不悅？」太子叩頭道：「母親，我問你：即位登龍是那個？稱孤道寡果何人？」娘娘聞言道：「這孩兒發風了？做皇帝的是你父王，你問怎的？」太子叩頭道：「萬望母親赦子無罪，敢問；不赦，不敢問。」娘娘道：「子母家有何罪？赦你，赦你，快快說來。」太子道：「母親，我問你三年前夫妻宮裡之事，與後三年恩愛同否如何？」娘娘見說，魂飄魄散，急下亭抱起，緊摟在懷，眼中滴淚道：「孩兒，我與你久不相見，怎麼今日來宮問此？」太子發怒道：「母親有話早說；不說時，且誤了大事。」娘娘才喝退左右，淚眼低聲道：「這樁事，孩兒不問，我到九泉之下，也不得明白。既問時，聽我說："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 127
    "line_end": 127
  "translation_ja": |-
    太子は馬を下り、亭の下にひざまずいた。
    太子「母上。」
    皇后は無理に笑顔を作り、呼びかけた。
    皇后「わが子よ、うれしいこと、うれしいこと！　この二、三年は前殿で父上から講義を受けていて、会うことができず、どんなに恋しかったか。今日はどうして暇ができて、顔を見せに来てくれたのです。本当に、この上なくうれしい。この上なくうれしい！　でも、どうしてそんなに悲しそうな声をしているのです。父上はもうご高齢です。いつか竜が青い海へ帰り、鳳凰（ほうおう）が赤い空へ戻る日が来れば、お前が帝位を継ぐのです。いったい何が不満なのですか。」
    太子は額を地につけて言った。
    太子「母上、お尋ねします。いま帝位についているのは誰なのです。孤（こ）と称し、寡人（かじん）と名乗っているのは、いったい何者なのですか。」
    皇后「この子は気でもふれたのですか。皇帝はお前の父上でしょう。何のためにそんなことを聞くのです。」
    太子はまた頭を下げた。
    太子「どうか母上、私をおとがめにならないとお許しください。お許しくだされば尋ねますが、そうでなければ、口にはできません。」
    皇后「親子の間で何をとがめるというのです。許します、許しますから、早く話しなさい。」
    太子「母上、三年前までの夫婦の寝床でのことをお尋ねします。それと、この三年の夫婦の情愛は、変わりませんでしたか。それとも、違っていたのですか。」
    それを聞いた皇后は、魂も飛び散るほど驚いた。急いで亭を下り、太子を抱き起こして胸にしっかりと抱きしめると、涙を落としながら言った。
    皇后「わが子よ、ずいぶん長く会えなかったというのに、どうして今日、宮中へ来るなり、そんなことを尋ねるのです。」
    太子は気色ばんだ。
    太子「母上、何かあるなら早くお話しください。お話しくださらないと、大事を誤ります。」
    皇后はようやく左右の者を叱りつけて退けると、涙にぬれた目で、声をひそめて言った。
    皇后「このことは、お前が尋ねてくれなければ、九泉（きゅうせん）の下へ行くまで、私にもわからなかったでしょう。尋ねられたからには、お聞きなさい。
  "translation_status": "reviewed"
- "id": "xy-ch38-005"
  "section_id": "chapter-38"
  "kind": "verse"
  "origin": "source"
  "source_text": "三載之前溫又暖，三年之後冷如冰。 枕邊切切將言問，他說老邁身衰事不興。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    三年前までは、ぬくもりがあり、温かかった。
    この三年は、氷のように冷たい。
    枕辺で心をこめて問いかけても、
    年老いて体が衰え、もう夫婦の営みはできぬと言うのです。」
  "translation_status": "reviewed"
- "id": "xy-ch38-006"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太子聞言，撒手脫身，攀鞍上馬。那娘娘一把扯住道：「孩兒，你有甚事，話不終就走？」太子跪在面前道：「母親，不敢說。今日早朝，蒙欽差架鷹逐犬，出城打獵。偶遇東土駕下來的個取經聖僧，有大徒弟乃孫行者，極善降妖。原來我父王死在御花園八角琉璃井內，這全真假變父王，侵了龍位。今夜三更，父王託夢，請他到城捉怪。孩兒不敢盡信，特來問母。母親才說出這等言語，必然是個妖精。」那娘娘道：「兒啊，外人之言，你怎麼就信為實？」太子道：「兒還不敢認實，父王遺下表記與他了。」娘娘問是何物，太子袖中取出那金廂白玉珪，遞與娘娘。那娘娘認得是當時國王之寶，止不住淚如泉湧。叫聲：「主公，你怎麼死去三年，不來見我，卻先見聖僧，後見太子？」太子道：「母親，這話是怎的說？」娘娘道：「兒啊，我四更時分，也做了一夢，夢見你父王水淋淋的站在我跟前，親說他死了，鬼魂兒拜請了唐僧，降假皇帝，救他前身。記便記得是這等言語，只是一半兒不得分明。正在這裡狐疑，怎知今日你又來說這話，又將寶貝拿出。我且收下，你且去請那聖僧急急為之。果然掃蕩妖氛，辨明邪正，庶報你父王養育之恩也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":

  "translation_ja": |-
    二人はそっと戸を開け、三蔵に姿を見られないよう離れると、めでたい光に乗って、まっすぐ都を目指した。ほどなく到着して雲を下りると、楼の上から、ちょうど二更を知らせる太鼓が聞こえた。
    悟空「兄弟、二更だぞ。」
    八戒「ちょうどいい、ちょうどいい。みんな最初のひと眠りで、ぐっすり寝込んでいるころだ。」
    二人は正陽門（せいようもん）へは向かわず、まっすぐ後宰門へ行ったが、拍子木と鈴の音が響いていた。
    悟空「兄弟、前も後ろも、門の警戒が厳しいぞ。どうやって入ろうか。」
    八戒「泥棒が門から入るなんて、聞いたことがあるか。こっそり塀を跳び越えればいいんだ。」
    悟空はそのとおりに、ひと跳びで内側の城壁の上へ飛び乗った。八戒も跳び上がった。二人は中へ忍び入り、道筋を探しながら、御花園へまっすぐ向かった。

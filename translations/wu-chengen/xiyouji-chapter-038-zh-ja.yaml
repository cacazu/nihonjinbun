- "id": "xy-ch38-017"
  "section_id": "chapter-38"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    一種靈苗秀，天生體性空。
    枝枝抽片紙，葉葉捲芳叢。
    翠縷千條細，丹心一點紅。
    淒涼愁夜雨，憔悴怯秋風。
    長養元丁力，栽培造化工。
    緘書成妙用，揮灑有奇功。
    鳳翎寧得似，鸞尾迥相同。
    薄露瀼瀼滴，輕煙淡淡籠。
    青陰遮戶牖，碧影上簾櫳。
    不許棲鴻雁，何堪繫玉驄。
    霜天形槁悴，月夜色朦朧。
    僅可消炎暑，猶宜避日烘。
    愧無桃李色，冷落粉牆東。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 145
    "line_end": 157
  "translation_ja": |-
    ひときわ秀でた霊妙な苗、その身も本性も、生まれながら空なるもの。
    枝ごとに一枚の紙のような葉を伸ばし、葉ごとに香る茂みを巻いている。
    緑の糸筋は千本も細く走り、真心にも似た芯は、ひときわ赤い。
    夜の雨を聞いては寂しく憂い、秋風を恐れてやつれてゆく。
    育ち伸びるのは庭師の力、栽培には天地の造化の技がある。
    書を封じれば妙なる用をなし、筆を走らせれば、不思議な働きをする。
    鳳凰の羽もこれに似ようか、鸞（らん）の尾とは、まことによく似ている。
    薄い露がたっぷりと滴り、淡いもやが、ほのかに包む。
    青い葉陰が戸や窓を覆い、碧の影は、簾のかかる格子へ差しかかる。
    雁のたぐいをとまらせることさえできないのに、どうして玉のように美しい青白の馬をつなげよう。
    霜の降る空のもとでは姿が枯れしおれ、月の夜には色もおぼろにかすむ。
    わずかに暑さをしのぐ役には立ち、照りつける日を避けるにも、なおふさわしい。
    桃や李のような花の色を持たぬことを恥じ、白壁の東で、ひっそりとたたずむ。

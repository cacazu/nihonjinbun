  "source_text": "好大聖，把金箍棒拿出來，兩頭一扯，叫：「長！」足有七八丈長。教：「八戒，你抱著一頭兒，把你放下井去。」八戒道：「哥呀，放便放下去，若到水邊，就住了罷。」行者道：「我曉得。」那獃子抱著鐵棒，被行者輕輕提將起來，將他放下去，不多時，放至水邊。八戒道：「到水了。」行者聽見他說，卻將棒往下一按。那獃子撲通的一個沒頭蹲，丟了鐵棒，便就負水，口裡哺哺的嚷道：「這天殺的，我說到水莫放，他卻就把我一按。」行者掣上棒來，笑道：「兄弟，可有寶貝麼？」八戒道：「見甚麼寶貝，只是一井水。」行者道：「寶貝沉在水底下哩，你下去摸一摸來。」呆子真個深知水性，卻就打個猛子，淬將下去。呀！那井底深得緊。他卻著實又一淬，忽睜眼見有一座牌樓，上有「水晶宮」三個字。八戒大驚道：「罷了，罷了，錯走了路了，蹡下海來也。海內有個水晶宮，井裡如何有之？」原來八戒不知此是井龍王的水晶宮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"

  "translation_ja": |-
    それを聞くと、太子は母の腕を振りほどき、鞍に取りついて馬に乗った。皇后はとっさに引き止めた。
    皇后「わが子よ、何があったのです。話も終えずに行ってしまうのですか。」
    太子は母の前にひざまずいた。
    太子「母上、恐ろしくて申し上げられないのです。今朝の朝議で命を受け、鷹と猟犬を連れて都の外へ狩りに出たところ、たまたま東土（とうど）の皇帝のもとから経を取りに来た聖僧に会いました。その一番弟子が孫行者（そんぎょうじゃ）といい、妖怪退治の大変な達人なのです。実は父上は、御花園（ぎょかえん）の八角形の瑠璃井（るりせい）の中で亡くなっておられ、あの全真（ぜんしん）の道士が父上に化けて、帝位を奪ったというのです。その夜の三更、父上が夢に現れ、都へ来て妖怪を捕らえるよう聖僧に頼まれました。私はすべてを信じきれず、わざわざ母上に確かめに来たのです。今おっしゃったことからして、あれはきっと妖怪です。」
    皇后「わが子よ、よそから来た人の話を、どうして本当だと信じられるのです。」
    太子「私も、まだ本当だと断じたわけではありません。ただ、父上が形見の品を、その方にお渡しになったのです。」
    皇后が何の品かと尋ねると、太子は袖の中から金縁の白玉珪（はくぎょくけい）を取り出し、母へ差し出した。皇后は、それがかつて国王の持っていた宝だと見分け、泉のように湧き出る涙を抑えられなかった。
    皇后「陛下、亡くなって三年にもなるというのに、どうして私には会いに来ず、先に聖僧に会い、次に太子にお知らせになったのですか。」
    太子「母上、それはいったい、どういうことですか。」
    皇后「わが子よ、私も四更のころに夢を見たのです。父上が水にぬれたまま、私の前に立っておられました。そして、自分は死んだのだ、魂となって唐僧（とうそう）を拝み、偽の皇帝を倒して、元の体を救ってほしいと頼んだのだと、ご自身でお話しになったのです。そういうお言葉だったとは覚えているのですが、半分ははっきりしません。ここで疑い惑っていたところへ、思いがけず今日、お前も同じ話をし、その宝まで持ってきました。これは私が預かっておきます。お前は行って、聖僧に急いで取りかかってくださるようお願いしなさい。本当に妖気を払い、邪と正を明らかにできれば、父上が育ててくださった恩にも報いられるでしょう。」
  "translation_status": "reviewed"
- "id": "xy-ch38-007"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "太子急忙上馬，出後宰門，躲離城池。真個是噙淚叩頭辭國母，含悲頓首復唐僧。不多時，出了城門，徑至寶林寺山門前下馬。眾軍士接著太子，又見紅輪將墜。太子傳令：不許軍士亂動。他又獨自個入了山門，整束衣冠，拜請行者。只見那猴王從正殿搖搖擺擺走來，那太子雙膝跪下道：「師父，我來了。」行者上前攙住道：「請起。你到城中，可曾問誰麼？」太子道：「問母親來。」將前言盡說了一遍。行者微微笑道：「若是那般冷啊，想是個甚麼冰冷的東西變的。不打緊，不打緊，等我老孫與你掃蕩。卻只是今日晚了，不好行事。你先回去，待明早我來。」太子跪地叩拜道：「師父，我只在此，伺候到明日，同師父一路去罷。」行者道：「不好，不好。若是與你一同入城，那怪物生疑，不說是我撞著你，卻說是你請老孫，卻不惹他反怪你也？」太子道：「我如今進城，他也怪我。」行者道：「怪你怎麼？」太子道：「我自早朝蒙差，帶領若干人馬鷹犬出城，今一日更無一件野物，怎麼見駕？若問我個不才之罪，監陷羑里，你明日進城，卻將何倚？況那班部中，更沒個相知人也。」行者道：「這甚打緊？你肯早說時，卻不尋下些等你？」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    太子は急いで馬に乗り、後宰門を出て、人目を避けながら都を離れた。まさに、涙をためて頭を下げ、国母に別れを告げ、悲しみを胸に額を地につけて、三蔵（さんぞう）のもとへ報せに戻るのであった。
    ほどなく城門を抜け、まっすぐ宝林寺（ほうりんじ）へ向かい、山門の前で馬を下りた。兵士たちが出迎えたころには、赤い日輪がもう沈もうとしていた。太子は兵士たちに勝手に動かぬよう命じ、一人で山門をくぐった。衣冠を整え、悟空にお目にかかりたいと丁重に申し入れると、悟空が正殿から体を揺すりながら歩いてきた。太子は両膝をついて言った。
    太子「お師匠さま、戻ってまいりました。」
    悟空は進み寄り、その体を支えた。
    悟空「お立ちなさい。都へ戻って、誰かに尋ねましたか。」
    太子「母に尋ねてまいりました。」
    太子は先ほどのやり取りを、すっかり話して聞かせた。悟空はかすかに笑った。
    悟空「それほど冷たかったなら、何か氷のように冷たいものが化けたのでしょう。かまわない、かまわない。私がきれいに退治してあげます。ただ、もう今日は遅い。事を起こすには都合が悪いので、先にお帰りなさい。私は明日の朝に参ります。」
    太子はひざまずいて頭を下げた。
    太子「お師匠さま、私はここで明日までお待ちし、お師匠さまとご一緒に参りとうございます。」
    悟空「それはいけない、いけない。一緒に都へ入れば、あの化け物に疑われる。私がたまたまあなたに会ったとは思わず、あなたが私を招いたのだと思うでしょう。それでは、かえってあなたがとがめられるではありませんか。」
    太子「今戻っても、とがめられます。」
    悟空「何をとがめられるのです。」
    太子「今朝命を受け、大勢の兵と馬、鷹や猟犬を連れて都を出たのに、一日かけて獲物が一つもありません。どうしてお目通りできましょう。もし無能の罪を問われ、羑里（ゆうり）のような牢へ閉じ込められたら、明日都へお入りになっても、誰を頼りになさるのです。朝廷に居並ぶ臣下の中には、ほかにお知り合いもいらっしゃらないでしょう。」
    悟空「そんなこと、何でもありません。もっと早く言ってくれれば、獲物を少し集めて待っていたものを。」
  "translation_status": "reviewed"

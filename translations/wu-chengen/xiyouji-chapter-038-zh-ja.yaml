  "source_languages": []
  "source_locations": []
  "translation_ja": "「獐\U00024731鹿兔」の\U00024731は、識典古籍掲載の『漢語大詞典』『康熙字典』が豝と同じ字で野猪をいうと説明するため、イノシシと訳した。麂など別の字へ原文を置き換えていない。「捻就了觔」は筋をひねり縮めて動けなくする動作として訳し、動物を殺したとは補わない。「百千餘隻」は非常な多数をいう表現のまま、百・千の数を残した。参照：https://www.shidianguji.com/character/%F0%A4%9C%B1 および https://zdic.net/hant/捻"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-06-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「唵藍浄法界」は、浄法界真言「唵藍」との関連が研究で指摘されるが、小説の句全体の日本語仮名を直接確認できていないため、読みは漢字音を組み合わせた推定として辞書に記録した。参照：https://repository.dl.itc.u-tokyo.ac.jp/record/2008563/files/A38580.pdf"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-07-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「拿賊拿贓」は盗人の身柄だけでなく犯罪の証拠も押さえる意。「沒嘴的葫蘆」と「滾上幾滾」は、口のない瓢箪でも転がって抵抗するという滑稽なたとえを残した。これは悟空の立てた作戦上の理屈であり、現代の法制度の解説ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-08-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「幫寸」は教育部《重編國語辭典修訂本》が「幫襯」と同じ援助の意を挙げ、この箇所を例にするため、「しっかり手伝ってやる」と訳した。宝物の存在は八戒を誘い出す悟空の話で、語り手による事実認定へ変えていない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=17235&la=0&powerMode=0"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-09-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "荒園の詩の植物は慣用的な対応名で訳した。荼䕷をトキンイバラ、玫瑰をハマナス、丹桂を赤いモクセイ、碧桃を八重の桃、海榴をザクロ、棠棣をニワウメと解したが、古典の植物名を現代の分類学上の種へ厳密に同定したものではない。松竹・石山・池・魚・橋・小径など、荒廃の描写をすべて残した。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-10-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "芭蕉の詩は、空の性質、紙のような葉、赤い芯と真心、書や筆の用途、鳳凰や鸞の姿、雁と馬、暑さと霜、花の色の乏しさを順に保持する。「元丁」は底本の字のまま保存し、「栽培」との対句から庭師に当たる育て手と解して訳した。「園丁」への本文補訂はしておらず、解釈には留保がある。「緘書」の具体的な作業が葉で手紙を包むことなのか、巻いた葉を封書に見立てるのかも断定しない。「玉驄」は美しい青白色の馬をいう詩語で、固有の馬名ではない。"
  "translation_status": "reviewed"

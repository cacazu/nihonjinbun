  "translation_ja": |-
    悟空「八戒、取りかかれ。宝物は芭蕉の下に埋まっているぞ。」
    八戒は両手で熊手を振り上げ、芭蕉を打ち倒した。それから鼻面で地面を掘り返し、三、四尺ほど掘ると、石の板が一枚、蓋をしているのを見つけた。八戒は喜んだ。
    八戒「兄貴、ついてるぞ。本当に宝物がある。石の板で蓋をしてあるんだ。壺に入っているのか、箱に入っているのか、どっちだろうな。」
    悟空「めくって見てみろ。」
    八戒はまた鼻面を使って板を押しのけた。見ると、霞のような光がきらめき、白い気が明るく輝いている。八戒は笑った。
    八戒「ついてる、ついてる。宝物が光ってるぞ。」
    さらに近寄ってよく見ると、何ということ、星と月の光が井戸の水に映り、輝いていたのだった。
    八戒「兄貴、何かするなら、ちゃんと後のことも考えてくれよ。」
    悟空「後のことって、どういうことだ。」
    八戒「これは井戸じゃないか。寺にいたとき、井戸の中に宝物があると言ってくれれば、荷包みを縛る縄を二本持ってきた。それでどうにかして、俺を下へ下ろせただろう。今は手ぶらだ。中に物があったって、どうやって下りて、どうやって上がるんだよ。」
    悟空「お前、下りたいのか。」
    八戒「ああ、下りたいさ。ただ、縄がないんだ。」
    悟空は笑った。
    悟空「衣を脱げ。俺がひとつ、いい手を見せてやる。」
    八戒「大した衣なんか着ちゃいない。この直裰（ちょくたつ）を脱げば、それでいいんだ。」

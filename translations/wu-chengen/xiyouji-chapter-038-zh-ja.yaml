  "translation_ja": "回題の「嬰兒」は太子を示すとともに修行上の象徴を重ね、「金木」は悟空と八戒を金・木の二つの働きに見立てる語。通常の地の文や話者ラベルを、この象徴名へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-02-body"
  "section_id": "chapter-38-notes"

  "source_text": "行者離了師父，徑到八戒床邊，叫：「八戒，八戒。」那獃子是走路辛苦的人，丟倒頭，只情打呼，那裡叫得醒。行者揪著耳朵，抓著鬃，把他一拉，拉起來，叫聲：「八戒。」那獃子還打棱掙。行者又叫一聲，獃子道：「睡了罷，莫頑，明日要走路哩。」行者道：「不是頑，有一樁買賣，我和你做去。」八戒道：「甚麼買賣？」行者道：「你可曾聽得那太子說麼？」八戒道：「我不曾見面，不曾聽見說甚麼。」行者說：「那太子告訴我說，那妖精有件寶貝，萬夫不當之勇。我們明日進城，不免與他爭敵，倘那怪執了寶貝，降倒我們，卻不反成不美？我想著打人不過，不如先下手。我和你去偷他的來，卻不是好？」八戒道：「哥哥，你哄我去做賊哩。這個買賣，我也去得。果是曉得實實的幫寸，我也與你講個明白：偷了寶貝，降了妖精，我卻不奈煩甚麼小家罕氣的分寶貝，我就要了。」行者道：「你要作甚？」八戒道：「我不如你們乖巧能言，人面前化得出齋來。老豬身子又夯，言語又粗，不能念經，若到那無濟無生處，可好換齋吃麼。」行者道：「老孫只要圖名，那裡圖甚寶貝？就與你便了。」那獃子聽見說都與他，他就滿心歡喜，一轂轆爬將起來，套上衣服，就和行者走路。這是清酒紅人面，黃金動道心。"
  "source_languages":

  "source_text": "行者道：「八戒，動手麼，寶貝在芭蕉樹下埋著哩。」那獃子雙手舉鈀，築倒了芭蕉。然後用嘴一拱，拱了有三四尺深，見一塊石板蓋著。獃子歡喜道：「哥呀，造化了，果有寶貝，是一片石板蓋著哩。不知是罈兒盛著，是櫃兒裝著哩。」行者道：「你掀起來看看。」那獃子果又一嘴拱開，看處，又見霞光灼灼，白氣明明。八戒笑道：「造化，造化，寶貝放光哩。」又近前細看時，呀！原來是星月之光，映得那井中水亮。八戒道：「哥呀，你但幹事，便要留根。」行者道：「我怎留根？」八戒道：「這是一眼井，你在寺裡早說是井中有寶貝，我卻帶將兩條綑包袱的繩來，怎麼作個法兒，把老豬放下去。如今空手，這裡面東西，怎麼得下去上來耶？」行者道：「你下去麼？」八戒道：「正是要下去，只是沒繩索。」行者笑道：「你脫了衣服，我與你個手段。」八戒道：「有甚麼好衣服？解了這直裰子就是了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"

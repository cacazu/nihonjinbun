  "source_text": "那龍王前走，這獃子隨後。轉過了水晶宮殿，只見廊廡下，橫躺著一個六尺長軀。龍王用手指定道：「元帥，那廂就是寶貝了。」八戒上前看了，呀！原來是個死皇帝，戴著沖天冠，穿著赭黃袍，踏著無憂履，繫著藍田帶，直挺挺睡在那廂。八戒笑道：「難難難，算不得寶貝。想老豬在山為怪時，時常將此物當飯，且莫說見的多少，吃也吃夠無數，那裡叫做甚麼寶貝？」龍王道：「元帥原來不知。他本是烏雞國王的屍首，自到井中，我與他定顏珠定住，不曾得壞。你若肯馱他出去，見了齊天大聖，假有起死回生之意啊，莫說寶貝，憑你要甚麼東西都有。」八戒道：「既這等說，我與你馱出去，只說把多少燒埋錢與我？」龍王道「其實無錢。」八戒道：「你好白使人？果然沒錢，不馱。」龍王道：「不馱，請行。」八戒就走。龍王差兩個有力量的夜叉，把屍擡將出去，送到水晶宮門外，丟在那廂，摘了辟水珠，就有水響。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 163
    "line_end": 163
  "translation_ja": |-
    井竜王が先に立ち、八戒が後へ続いた。水晶宮の殿舎を回り込むと、回廊の軒下に、六尺もある体が一つ横たわっていた。井竜王は手で指さした。
    井竜王「元帥、あちらが宝物でございます。」
    八戒が近寄って見ると、何ということ、それは死んだ皇帝だった。沖天冠（ちゅうてんかん）をかぶり、赤みがかった黄色の袍（ほう）を着て、無憂履（むゆうり）を履き、藍田（らんでん）の玉の帯を締めて、まっすぐ横たわっている。八戒は笑った。
    八戒「だめだ、だめだ、だめだ。それは宝物のうちに入らないよ。俺が山で妖怪をやっていたころには、しょっちゅう、こういう物を飯にしていた。どれほど見たかなんていうどころか、食った数だって、数えきれないほどだ。どうしてこれが宝物なんだ。」
    井竜王「元帥はご存じなかったのですね。これは烏鶏国王の亡骸です。井戸へ落ちてきてから、私が定顔珠（ていがんしゅ）でお姿を保っておりましたので、腐っておりません。お背負いになって外へ出し、斉天大聖にお見せして、もし生き返らせようというお心があるなら、宝物どころか、欲しい物は何でも手に入りましょう。」
    八戒「そういうことなら、運び出してやってもいい。ただし、俺に葬送代をいくらくれるんだ。」
    井竜王「実のところ、金はございません。」
    八戒「ただ働きをさせるとは、いい度胸だな。本当に金がないなら、運ばないぞ。」
    井竜王「お運びにならないのでしたら、どうぞお帰りください。」
    八戒は出ていった。井竜王は力のある夜叉を二人使い、死体を担ぎ出させ、水晶宮の門の外へ運んで置かせた。そして辟水珠（へきすいしゅ）を取り外すと、水の響く音がした。
  "translation_status": "reviewed"
- "id": "xy-ch38-023"

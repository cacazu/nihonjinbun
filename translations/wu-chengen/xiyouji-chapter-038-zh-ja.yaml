  "translation_ja": |-
    悟空は師のもとを離れ、まっすぐ八戒の寝床へ行った。
    悟空「八戒、八戒。」
    八戒は道中で疲れきっていたので、頭を横たえるなり、ただもういびきをかいている。呼んだところで起きるはずがない。悟空はその耳をつかみ、たてがみを引っ張り、ぐいと起こした。
    悟空「八戒。」
    八戒はまだ寝ぼけて身じろぎしていた。悟空がもう一度呼ぶと、ようやく答えた。
    八戒「寝ようじゃないか。ふざけるなよ。明日も歩くんだぞ。」
    悟空「ふざけているんじゃない。ひと商売あるんだ。俺と一緒にやりに行こう。」
    八戒「どんな商売だ。」
    悟空「お前、あの太子が話したのを聞いたか。」
    八戒「顔も合わせていないんだ。何を言ったかなんて、聞いてないよ。」
    悟空「太子が俺に話したんだが、あの妖怪は宝物を一つ持っていて、万人も歯が立たぬ強さだそうだ。明日都へ入ったら、どうしたって戦うことになる。もし化け物がその宝物を使って俺たちを倒したら、かえってまずいことになるだろう。まともに戦ってかなわないなら、先に手を打つほうがいいと思ってな。俺とお前で、その宝を盗んでくる。それがいいじゃないか。」
    八戒「兄貴、俺を言いくるめて、泥棒をさせようってわけだな。その商売なら、俺にもできる。しっかり手伝ってやるから、こっちもはっきり言っておくぞ。宝物を盗んで妖怪を倒したら、けちくさく宝を分けるなんて面倒はごめんだ。そっくり俺がもらう。」
    悟空「何に使うんだ。」
    八戒「俺はお前たちのように気がきいて口も達者で、人に頼んで精進の飯を恵んでもらう、なんてことができない。体はでかくて鈍くさいし、言葉も荒っぽい。お経も読めない。どうにも食う道のない所へ来たら、その宝を食い物に換えられるじゃないか。」
    悟空「俺は名を上げたいだけだ。宝物なんぞ欲しくない。全部お前にやればいい。」
    全部もらえると聞くと、八戒はうれしくてたまらず、ひょいと起き上がり、衣を着込んで悟空と出かけた。まさに、清らかな酒は人の顔を赤くし、黄金は修道の心をも動かすのである。

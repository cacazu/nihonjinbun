  "translation_ja": "夜叉の「逼法」は声の擬態を表す語として、ぶつぶつしゃべると訳した。法術を強制する行為ではない。参照：https://zdic.net/hans/逼法"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-12-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「江、河、淮、濟」はそれぞれ長江・黄河・淮水・済水。四つを二つの一般名詞「江河」へまとめない。「得了性命」は命を保ったことと解したが、帰依による救いの含みもある。「故知」は八戒の受け止め方として保持し、以前に二人が実際に面識を持っていたという来歴は補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-13-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "六尺の体、沖天冠、赭黄色の袍、無憂履、藍田の帯という装いを保った。定顔珠の作用は井竜王の説明であり、口へ珠を入れたという動作はこの回にないので足していない。葬送代の要求と無償では運ばない八戒の拒絶、夜叉二人による搬出、辟水珠の撤去を順番どおり訳した。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-14-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「孤拐」は足首・くるぶしの意に採った。頬骨をいう場合もあるが、棒を受けるよう差し出させる文脈と、前回までの身体部位の用法に従う。二十棒を二十数回へ変えない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=70836&la=0&powerMode=0"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-15-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「一頭水」は、水のように重いほうへ傾き、自分の判断を保てないというたとえ。「夾腦風」はこの場面を用例に挙げる教育部の辞書が間抜けをいう罵りと説明するため、少し頭がどうかしているという八戒の悪口に採った。悟空に現代的な病名を付けたわけではない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=149099&la=1&powerMode=0 および https://dict.revised.moe.edu.tw/dictView.jsp?ID=89574&la=0&powerMode=0"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-16-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三七五七，盡七百日」は、三七日・五七日・尽七・百日の忌日の列挙と解し、二十一日・三十五日・四十九日の忌日・百日と訳した。教育部《重編國語辭典修訂本》「斷七」は尽七を七七四十九日と説明する。この語義を採り、単純な七百日とは読まなかったが、底本の句読点と連続した原字は保っている。転生の時期は悟空の発言であり、語り手や訳者の事実説明にはしない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=48464&la=0&powerMode=0 「或」を踏まえ、全員が各日数を順番に経るとの断定ではなく、期間の例を選択的に挙げる表現にした。"
  "translation_status": "reviewed"
- "id": "xy-ch38-note-17-body"
  "section_id": "chapter-38-notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「三簷白簇」は底本の表記を保持した。「三簷」は三重の軒と解し、「白簇」は白く見えるさまと暫定的に採ったが、具体的な建築意匠・語義は未確定である。直後の「亮灼灼」は看板の三文字の輝きであり、軒の発光を述べたものとはしない。"
  "translation_status": "reviewed"

  "origin": "source"
  "source_text": "彩畫雕欄狼狽，寶妝亭閣攲歪。莎汀蓼岸盡塵埋，芍藥荼䕷俱敗。茉莉玫瑰香暗，牡丹百合空開。芙蓉木槿草垓垓，異卉奇葩壅壞。巧石山峰俱倒，池塘水涸魚衰。青松紫竹似乾柴，滿路茸茸蒿艾。丹桂碧桃枝損，海榴棠棣根歪。橋頭曲徑有蒼苔，冷落花園境界。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 141
    "line_end": 141
  "translation_ja": |-
    彩色を施した彫刻の欄干は荒れ果て、宝で飾った亭や楼閣は傾いている。
    カヤツリグサの茂る水際も、タデの生える岸も、みな土ぼこりに埋まり、シャクヤクもトキンイバラも枯れ衰えた。
    ジャスミンもハマナスも香りをひそめ、牡丹や百合はむなしく花を開く。
    フヨウとムクゲには草がうず高く茂り、珍しい草もすぐれた花も、覆われて傷んでいる。
    巧みに組んだ石や築山の峰はみな崩れ、池の水は涸れて魚も弱り果てた。
    青い松も紫の竹も、乾いた薪のよう。道いっぱいに、ヨモギのたぐいがぼうぼうと生えている。
    赤いモクセイも八重の桃も枝が傷み、ザクロもニワウメも根が傾いた。
    橋のたもとや曲がりくねった小道には、青い苔。なんと寂れきった庭のありさまだ。」

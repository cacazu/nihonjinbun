  "known_gaps":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-002"
    "description_ja": "冒頭詩は誕生の因縁、如来の会座、静観、十方と、太子が実母に尋ねる筋を重ねている。「一行一步一花新」は行いと歩みの一つごとに花が新しく開く像を保持し、単なる成長の教訓へ要約しない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-006"
    "description_ja": "太子の報告は底本で「今夜三更」となっているが、同日の夕方より前に、前夜の夢を振り返る文脈である。訳文は「その夜の三更」とし、原文欄の「今夜」は訂正しない。皇后の四更の夢との前後関係を保持する。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-015"
    "description_ja": "荒園の詩の植物は慣用的な対応名で訳した。荼䕷をトキンイバラ、玫瑰をハマナス、丹桂を赤いモクセイ、碧桃を八重の桃、海榴をザクロ、棠棣をニワウメと解したが、古典の植物名を現代の分類学上の種へ厳密に同定したものではない。松竹・石山・池・魚・橋・小径など、荒廃の描写をすべて残した。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-017"
    "description_ja": "芭蕉の詩は、空の性質、紙のような葉、赤い芯と真心、書や筆の用途、鳳凰や鸞の姿、雁と馬、暑さと霜、花の色の乏しさを順に保持する。「元丁」は底本の字のまま保存し、「栽培」との対句から庭師に当たる育て手と解して訳した。「園丁」への本文補訂はしておらず、解釈には留保がある。「緘書」の具体的な作業が葉で手紙を包むことなのか、巻いた葉を封書に見立てるのかも断定しない。「玉驄」は美しい青白色の馬をいう詩語で、固有の馬名ではない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-021"
    "description_ja": "「江、河、淮、濟」はそれぞれ長江・黄河・淮水・済水。四つを二つの一般名詞「江河」へまとめない。「得了性命」は命を保ったことと解したが、帰依による救いの含みもある。「故知」は八戒の受け止め方として保持し、以前に二人が実際に面識を持っていたという来歴は補わない。 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-027"
    "description_ja": "「一頭水」は、水のように重いほうへ傾き、自分の判断を保てないというたとえ。「夾腦風」はこの場面を用例に挙げる教育部の辞書が間抜けをいう罵りと説明するため、少し頭がどうかしているという八戒の悪口に採った。悟空に現代的な病名を付けたわけではない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=149099&la=1&powerMode=0 および https://dict.revised.moe.edu.tw/dictView.jsp?ID=89574&la=0&powerMode=0 本文欠落ではなく、解釈・校訂上の留保。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-027"
    "description_ja": "「三七五七，盡七百日」は、三七日・五七日・尽七・百日の忌日の列挙と解し、二十一日・三十五日・四十九日の忌日・百日と訳した。教育部《重編國語辭典修訂本》「斷七」は尽七を七七四十九日と説明する。この語義を採り、単純な七百日とは読まなかったが、底本の句読点と連続した原字は保っている。転生の時期は悟空の発言であり、語り手や訳者の事実説明にはしない。参照：https://dict.revised.moe.edu.tw/dictView.jsp?ID=48464&la=0&powerMode=0 本文欠落ではなく、解釈・校訂上の留保。「或」を踏まえ、全員が各日数を順番に経るとの断定ではなく、期間の例を選択的に挙げる表現にした。"
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "segment_ids":
    - "xy-ch38-014"
    "description_ja": "「三簷白簇」は底本の表記を保持した。「三簷」は三重の軒と解し、「白簇」は白く見えるさまと暫定的に採ったが、具体的な建築意匠・語義は未確定である。直後の「亮灼灼」は看板の三文字の輝きであり、軒の発光を述べたものとはしない。 本文欠落ではなく、解釈・校訂上の留保。"

  "translation_ja": |-
    八戒「そんなことを嘆いて、どうなるんだ。早いところ、俺たちの商売をしようじゃないか。」
    悟空は嘆きながらも、三蔵の夢の話を心にとめていた。井戸は芭蕉の木の下だという話だった。歩いていくと、なるほど一本の芭蕉が、ほかの花や木と違って、青々と繁っている。まさに、このような姿であった。

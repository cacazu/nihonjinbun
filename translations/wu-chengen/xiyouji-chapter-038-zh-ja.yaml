  "source_text": "唐僧道：「憑你怎生裁處？」行者笑道：「老孫的計已成了。只是干礙著你老人家，有些兒護短。」唐僧道：「我怎麼護短？」行者道：「八戒生得夯，你有些兒偏向他。」唐僧道：「我怎麼向他？」行者道：「你若不向他啊，且如今把膽放大些，與沙僧只在這裡。待老孫與八戒趁此時先入那烏雞國城中，尋著御花園，打開琉璃井，把那皇帝屍首撈將上來，包在我們包袱裡。明日進城，且不管甚麼倒換文牒，見了那怪，掣棍來就打。他但有言語，就將骨襯與他看，說：『你殺的是這個人。』卻教太子上來哭父，皇后出來認夫，文武多官見主，我老孫與兄弟們動手。這才是有對頭的官事好打。」唐僧聞言，暗喜道：「只怕八戒不肯去。」行者笑道：「如何？我說你護短。你怎麼就知他不肯去？你只像我叫你時不答應，半個時辰便了。我這去，但憑三寸不爛之舌，莫說是豬八戒，就是豬九戒，也有本事教他跟著我走。」唐僧道：「也罷，隨你去叫他。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"

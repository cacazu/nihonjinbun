  "source_text": "八戒正敘話處，早有一個巡水的夜叉開了門，看見他的模樣，急抽身進去報道：「大王，禍事了，井上落一個長嘴大耳的和尚來了，赤淋淋的，衣服全無，還不死，逼法說話哩。」那井龍王忽聞此言，心中大驚道：「這是天蓬元帥來也。昨夜夜遊神奉上敕旨，來取烏雞國王魂靈去拜見唐僧，請齊天大聖降妖。這怕是齊天大聖、天蓬元帥來了，卻不可怠慢他，快接他去也。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 160
    "line_end": 160
  "translation_ja": |-
    八戒がそんなことを言っていると、早くも水中を巡回する夜叉（やしゃ）が門を開け、その姿を見つけた。急いで身を返して中へ入り、報告した。
    夜叉「大王さま、大変です。井戸の上から、長い鼻面に大きな耳の和尚が落ちてまいりました。真っ裸で、何一つ着ておりません。それでも死なずに、ぶつぶつしゃべっております。」
    井竜王は思いがけない報告に驚いた。
    井竜王「あれは天蓬元帥（てんぽうげんすい）がいらしたのだ。昨夜、夜遊神（やゆうしん）が天の勅命を受けて来て、烏鶏国王の魂を唐僧のもとへ連れていった。斉天大聖（せいてんたいせい）に妖怪退治を頼むためだった。さては斉天大聖と天蓬元帥がいらしたのだろう。失礼があってはならぬ。急いでお迎えしよう。」
  "translation_status": "reviewed"
- "id": "xy-ch38-021"

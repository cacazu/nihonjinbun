  "source_text": "八戒將屍放下，撈過衣服穿了。行者看時，那皇帝容顏依舊，似生時未改分毫。行者道：「兄弟啊，這人死了三年，怎麼還容顏不壞？」八戒道：「你不知之。這井龍王對我說，他使了定顏珠定住了，屍首未曾壞得。」行者道：「造化，造化。一則是他的冤仇未報，二來該我們成功。兄弟快把他馱了去。」八戒道：「馱往那裡去？」行者道：「馱了去見師父。」八戒口中作念道：「怎的起？怎的起？好好睡覺的人，被這猢猻花言巧語，哄我教做甚麼買賣，如今卻幹這等事，教我馱死人。馱著他，腌臢水淋將下來，污了衣服，沒人與我漿洗。上面有幾個補丁，天陰發潮，如何穿麼？」行者道：「你只管馱了去，到寺裡，我與你換衣服。」八戒道：「不羞，連你穿的也沒有，又替我換？」行者道：「這般弄嘴，便不馱罷？」八戒道：「不馱。」行者道：「便伸過孤拐來，打二十棒。」八戒慌了道：「哥哥，那棒子重，若是打上二十，我與這皇帝一般了。」行者道：「怕打時，趁早兒馱著走路。」八戒果然怕打，沒好氣，把屍首拽將過來，背在身上，拽步出園就走。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    八戒は死体を下ろし、衣を手元へ引き寄せて着た。悟空が見ると、皇帝の顔つきは昔のまま、生きていたときと少しも変わっていない。
    悟空「兄弟、この人は死んで三年にもなるのに、どうしてまだ顔が腐っていないんだ。」
    八戒「知らないのか。井竜王が俺に言っていたぞ。定顔珠で姿を保っておいたから、死体が腐らなかったんだとさ。」
    悟空「ついてる、ついてる。一つには、この人の恨みがまだ晴らされていないからだ。もう一つには、俺たちが功を成し遂げる巡り合わせなのさ。兄弟、早く背負っていこう。」
    八戒「どこへ運ぶんだ。」
    悟空「お師匠さまに見せるのだ。」
    八戒はぶつぶつ言った。
    八戒「どうしてくれる、どうしてくれる。気持ちよく寝ていたのに、この猿のうまい口車に乗せられて、何とかいう商売に連れ出された。それが今じゃ、このざまだ。死人を背負えだと。背負えば、汚い水がぽたぽた垂れて、衣が汚れる。誰が洗って糊をつけてくれるというんだ。何枚もつぎが当たっているのに、曇った日には湿ってしまう。どうやって着ればいいんだよ。」
    悟空「いいから背負っていけ。寺へ着いたら、俺が着替えを用意してやる。」
    八戒「よく恥ずかしくもなく言えるな。自分が着る物さえろくにないくせに、俺に着替えをくれるだと。」
    悟空「そんなに口答えするのは、背負わないということか。」
    八戒「背負わない。」
    悟空「ならば足首を出せ。二十棒、打ってやる。」
    八戒は慌てた。
    八戒「兄貴、あの棒は重いんだぞ。二十発も食らったら、俺もこの皇帝と同じになる。」
    悟空「打たれるのが怖いなら、さっさと背負って歩け。」
    八戒はやはり打たれるのが怖かった。不機嫌なまま死体を引き寄せ、背中へ負うと、足を引きずるように庭を出ていった。
  "translation_status": "reviewed"
- "id": "xy-ch38-025"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "好大聖，捻著訣，念聲咒語，往巽地上吸一口氣，吹將去，就是一陣狂風，把八戒撮出皇宮內院，躲離了城池，息了風頭，二人落地，徐徐卻走將來。那獃子心中暗惱，算計要報恨行者，道：「這猴子捉弄我，我到寺裡也捉弄他捉弄：攛道師父，只說他醫得活；醫不活，教師父念緊箍兒咒，把這猴子的腦漿勒出來，方趁我心。」走著路，再再尋思道：「不好，不好。若教他醫人，卻是容易：他去閻王家討將魂靈兒來，就醫活了。只說不許赴陰司，陽世間就能醫活，這法兒才好。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    さすがは悟空、手で印を結び、呪文を一声唱えると、巽（たつみ）の方角へ向かって息を吸い、ふっと吹きつけた。たちまち激しい風が起こり、八戒を宮中の奥庭からさらい出し、人目を避けて都の外へ運んだ。風を収め、二人は地面へ下りると、ゆっくり歩いて帰った。
    八戒はひそかに腹を立て、悟空へ仕返しする手を考えていた。
    八戒は心の中で思った。「あの猿、俺をからかいやがった。寺へ着いたら、こっちもからかってやる。お師匠さまをたきつけて、あいつなら生き返らせられると言うんだ。生き返らせられなかったら、お師匠さまに緊箍児呪（きんこじじゅ）を唱えてもらう。あの猿の脳みそが絞り出されるまで締めつけてもらって、初めて気が晴れるというものだ。」
    歩きながら、さらに何度も考え直した。
    八戒は心の中で思った。「いや、だめだ、だめだ。生き返らせろと言うだけなら、あいつには簡単だ。閻王（えんおう）の所へ行って魂をもらってくれば、生き返らせてしまう。冥府へ行くのは禁止、この世にいながら生き返らせろと言わなくちゃな。これならうまくいく。」
  "translation_status": "reviewed"
- "id": "xy-ch38-026"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，卻到了山門前，徑直進去，將屍首丟在那禪堂門前。道：「師父，起來看邪。」那唐僧睡不著，正與沙僧講行者哄了八戒去久不回之事。忽聽得他來叫了一聲，唐僧連忙起身道：「徒弟，看甚麼？」八戒道：「行者的外公，教老豬馱將來了。」行者道：「你這饢糟的獃子，我那裡有甚麼外公？」八戒道：「哥，不是你外公，卻教老豬馱他來怎麼？也不知費了多少力了。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    そう考え終わらぬうちに山門の前へ着いた。八戒はまっすぐ入っていき、禅堂の戸の前に死体をどさりと置いた。
    八戒「お師匠さま、起きて、見てくださいよ。」
    三蔵は寝つけず、悟空が八戒を言いくるめて連れ出し、長いこと帰ってこない件を、沙悟浄と話しているところだった。八戒の声を聞くと、急いで起き上がった。
    三蔵「弟子よ、何を見るのだ。」
    八戒「悟空の母方のじいさんです。俺に背負ってこさせたんですよ。」
    悟空「この薄汚い間抜けめ。俺に母方のじいさんなんぞ、いるものか。」
    八戒「兄貴、じいさんじゃないなら、何だって俺に背負ってこさせたんだ。どれほど力を使ったと思ってる。」
  "translation_status": "reviewed"
- "id": "xy-ch38-027"
  "section_id": "chapter-38"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那唐僧與沙僧開門看處，那皇帝容顏未改，似活的一般。長老忽然慘悽道：「陛下，你不知那世裡冤家，今生遇著他，暗喪其身，拋妻別子，致令文武不知，多官不曉。可憐你妻子昏蒙，誰曾見焚香獻茶？」忽失聲淚如雨下。八戒笑道：「師父，他死了可干你事？又不是你家父祖，哭他怎的？」三藏道：「徒弟啊，出家人慈悲為本，方便為門。你怎的這等心硬？」八戒道：「不是心硬，師兄和我說來，他會醫得活；若醫不活，我也不馱他來了。」那長老原來是一頭水的，被那獃子搖動了，他就叫：「悟空，若果有手段醫活這個皇帝，正是『救人一命，勝造七級浮圖』。我等也強似靈山拜佛。」行者道：「師父，你怎麼信這獃子亂談？人若死了，或三七五七，盡七百日，受滿了陽間罪過，就轉生去了。如今已死三年，如何救得？」三藏聞其言道：「也罷了。」八戒苦恨不息，道：「師父，你莫被他瞞了，他有些夾腦風。你只念念那話兒，管他還你一個活人。」真個唐僧就念緊箍兒咒，勒得那猴子眼脹頭疼。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 169
    "line_end": 169
  "translation_ja": |-
    三蔵と沙悟浄が戸を開けて見ると、皇帝の顔は変わらず、生きているようだった。三蔵はふと、悲しみに襲われた。
    三蔵「陛下、あれは、どの世でできた仇だったのでしょう。今生で出会い、人知れず命を奪われ、妻を残し、子と別れることになってしまった。文官も武官も、誰一人ご存じなかったのですね。お気の毒に、奥方もお子も何も知らされず、どなたが香をたき、茶を供えてくださったでしょう。」
    思わず声を上げて泣き、涙が雨のように落ちた。八戒は笑った。
    八戒「お師匠さま、あの人が死んだって、お師匠さまに何の関わりがあるんです。ご自分の父親や祖父でもないのに、どうして泣くんですか。」
    三蔵「弟子よ、出家した者は慈悲を根本とし、人を救う方便を門とするものだ。どうしてお前は、そんなに薄情なのだ。」
    八戒「薄情だからじゃありませんよ。兄貴が俺に言ったんです。この人を生き返らせられるって。生き返らせられないなら、俺だって背負ってきやしません。」
    もともと三蔵は、重いほうへ傾く水のように、人の言葉に流されやすかった。八戒に心を動かされ、呼びかけた。
    三蔵「悟空、この皇帝を本当に生き返らせる手立てがあるなら、まさしく『人の命を一つ救うのは、七重の仏塔を建てるにも勝る』ということだ。私たちが霊山（れいざん）へ行って仏を拝むよりも、よいことではないか。」
    悟空「お師匠さま、どうしてこの間抜けのでたらめをお信じになるのです。人は死ぬと、二十一日や三十五日、あるいは四十九日や百日で、生前の罪の報いを受け終えれば、もう転生してしまいます。この方は死んで三年です。どうして救えるでしょう。」
    三蔵はそれを聞いた。
    三蔵「そうか。それなら仕方がない。」
    八戒はなおも恨みを捨てなかった。
    八戒「お師匠さま、だまされちゃいけません。兄貴は少し頭がどうかしているんですよ。例の言葉をちょっと唱えてごらんなさい。きっと、生きた人間にして返してくれますから。」
    三蔵は本当に緊箍児呪を唱えだした。輪に締めつけられた悟空は、目が張り裂けそうになり、頭がずきずき痛んだ。
  "translation_status": "reviewed"

  "origin": "source"
  "source_text": "八戒急回頭看，不見水晶宮門，一把摸著那皇帝的屍首，慌得他腳軟筋麻，攛出水面，扳著井牆，叫道：「師兄，伸下棒來救我一救。」行者道：「可有寶貝麼？」八戒道：「那裡有，只是水底下有一個井龍王，教我馱死人，我不曾馱，他就把我送出門來，就不見那水晶宮了，只摸著那個屍首。諕得我手軟筋麻，掙搓不動了。哥呀，好歹救我救兒。」行者道：「那個就是寶貝，如何不馱上來？」八戒道：「知他死了多少時了，我馱他怎的？」行者道：「你不馱，我回去耶。」八戒道：「你回那裡去？」行者道：「我回寺中，同師父睡覺去。」八戒道：「我就不去了？」行者道：「你爬得上來，便帶你去；爬不上來，便罷。」八戒慌了：「怎生爬得動？你想，城牆也難上，這井肚子大，口兒小，壁陡的圈牆，又是幾年不曾打水的井，團團都長的是苔痕，好不滑也，教我怎爬？哥哥，不要失了兄弟們和氣，等我馱上來罷。」行者道：「正是，快快馱上來，我同你回去睡覺。」那獃子又一個猛子，淬將下去，摸著屍首，拽過來，背在身上，攛出水面，扶井牆道：「哥哥，馱上來了。」那行者睜睛看處，真個的背在身上，卻才把金箍棒伸下井底。那獃子著了惱的人，張開口，咬著鐵棒，被行者輕輕的提將出來。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch38-1455587"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第038回&oldid=1455587"
    "line_start": 164
    "line_end": 164
  "translation_ja": |-
    八戒が急いで振り向くと、水晶宮の門は見えなくなっていた。手を伸ばすと、皇帝の死体に触れた。足から力が抜け、筋がしびれるほど慌て、水面へ躍り出て、井戸の壁に取りついた。
    八戒「兄貴、棒を下ろして助けてくれ！」
    悟空「宝物はあったか。」
    八戒「どこにあるものか。水の底に井竜王がいて、死人を背負えと言うんだ。俺が背負わなかったら、門の外へ出された。すると水晶宮が見えなくなって、触れるのは死体だけさ。びっくりして手も力が抜け、筋がしびれて、もうもがくこともできない。兄貴、何とか助けてくれよ。」
    悟空「そいつこそ宝物だ。どうして背負って上がらない。」
    八戒「いつ死んだかもわからない奴を、何だって俺が背負うんだ。」
    悟空「背負わないなら、俺は帰るぞ。」
    八戒「どこへ帰るんだ。」
    悟空「寺へ帰って、お師匠さまと眠るのさ。」
    八戒「俺は帰れないのかよ。」
    悟空「上まで這い上がれるなら、連れて帰ってやる。上がれないなら、それまでだ。」
    八戒は慌てた。
    八戒「どうやって上がれっていうんだ。考えてみろよ、城壁だって上るのは難しい。この井戸は胴が広いのに口は狭く、ぐるりの壁は切り立っている。そのうえ何年も水を汲んでいないから、あたり一面、苔だらけだ。こんなにつるつるしているのに、どうして上れる。兄貴、兄弟の仲を悪くしないでくれ。俺が背負って上がるからさ。」
    悟空「それでいい。早く背負ってこい。一緒に帰って寝よう。」
    八戒はまたひと息に潜り、死体を探り当てると、引き寄せて背に負った。水面へ浮かび出て、井戸の壁を支えに言った。
    八戒「兄貴、背負ってきたぞ。」
    悟空は目を凝らし、本当に背負っているのを確かめてから、ようやく金箍棒を井戸の下へ差し伸べた。さんざん腹を立てさせられた八戒は、口を開けて鉄棒にかみつき、悟空に軽々と引き上げられた。
  "translation_status": "reviewed"

  - "id": "xy-ch70-019"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "轉山坡，迎著小妖，打個起手道：「長官，那裡去？送的是甚麼公文？」那妖物就像認得他的一般，住了鑼槌，笑嘻嘻的還禮道：「我大王差我到朱紫國下戰書的。」行者接口問道：「朱紫國那話兒，可曾與大王配合哩？」小妖道：「自前年攝得來，當時就有一個神仙，送一件五彩仙衣與金聖宮妝新。他自穿了那衣，就渾身上下都生了針刺，我大王摸也不敢摸他一摸。但挽著些兒，手心就痛，不知是甚緣故。自始至今，尚未沾身。早間差先鋒去要宮女伏侍，被一個甚麼孫行者戰敗了。大王奮怒，所以教我去下戰書，明日與他交戰也。」行者道：「怎的大王卻著惱啊？」小妖道：「正在那裡著惱哩。你去與他唱個道情詞兒，解解悶也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      山の斜面を回り、小妖怪を迎えると、悟空は手を合わせて挨拶した。
      悟空「お役人さま、どちらへ。何の公文書をお届けですか。」
      小妖怪は、まるで以前から知っている相手のように銅鑼のばちを止め、にこにこして礼を返した。
      小妖怪「大王のお使いで、朱紫国へ戦書を届けるところだ。」
      悟空はすぐ尋ねた。
      悟空「朱紫国のあの方は、大王ともう結ばれたのですか。」
      小妖怪「一昨年さらってきた時、すぐにある仙人が五色の仙衣を一着持ってきて、金聖宮さまの花嫁衣装にしたんだ。あの方がそれを着ると、体じゅうに針のような刺が生えて、大王は指一本触れることもできない。ほんの少し手を取るだけでも、手のひらが痛む。何のせいかは分からないが、初めから今まで、まだ体に触れられないのさ。今朝も先鋒をやって、世話をする宮女を要求したが、何とかいう孫行者に負かされた。大王がかんかんに怒って、それで俺に戦書を届けさせ、明日戦うというわけだ。」
      悟空「そんなに、大王は怒っているのですか。」
      小妖怪「今もちょうど怒っているよ。あんたが行って道情でも歌い、気を晴らしてやったらどうだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-020"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好行者，拱手抽身就走。那妖依舊敲鑼前行。行者就行起兇來，掣出棒，復轉身，望小妖腦後一下，可憐，就打得頭爛血流漿迸出，皮開頸折命傾之。收了棍子，卻又自悔道：「急了些兒，不曾問他叫做甚麼名字。罷了。」卻去取下他的戰書，藏於袖內。將他黃旗、銅鑼藏在路旁草裡。因扯著腳要往澗下捽時，只聽噹的一聲，腰間露出一個鑲金的牙牌。牌上有字，寫道：「心腹小校一名，有來有去。五短身材，扢撻臉，無鬚。長川懸掛，無牌即假。」行者笑道：「這廝名字叫做有來有去，這一棍子，打得有去無來！」將牙牌解下，帶在腰間。欲要捽下屍骸，卻又思量起煙火之毒。且不敢尋他洞府，即將棍子舉起，著小妖胸前搗了一下，挑在空中，徑回本國，且當報一個頭功。你看他自思自念，唿哨一聲，到了國界。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      悟空は両手を組んで礼をし、身を引いて歩き出した。小妖怪も、また銅鑼を鳴らして進んでいく。ところが悟空は猛然と凶行に出た。棒を抜き、引き返して小妖怪の後頭部へ一撃。あわれ、頭は砕けて血が流れ、脳漿が飛び散り、皮は裂け、首は折れて命が絶えた。悟空は棒を収めると、自分で悔やんだ。
      悟空「少し急ぎすぎた。名前を聞いておかなかったな。まあいい。」
      戦書を取り外して袖へ隠し、黄色い旗と銅鑼は道端の草の中へ隠した。足をつかんで谷へ投げ落とそうとすると、からん、と音がし、腰から金縁の牙牌（がはい）が現れた。札にはこう書いてあった。
      『側近の小校（しょうこう）一名、有来有去（ゆうらいゆうき）。五体が短くずんぐりし、いぼいぼの顔、ひげなし。常にこの札を掛けること。札のない者は偽物。』
      悟空は笑った。
      悟空「こいつは有来有去という名だったのか。行ったり来たりのはずが、この一撃で、行ったきり帰らなくなったな！」
      牙牌を外して自分の腰へ付けた。死骸を投げ落とそうとしたが、またあの煙と火の恐ろしさが頭に浮かんだ。ひとまず洞窟を捜しに行くのは控え、棒を上げて有来有去の胸を一突きし、死体を空中へ突き上げたまま、まっすぐ国へ帰ることにした。まずは最初の手柄を報告するのだ。そう一人で考え、ひゅっと一声上げると、たちまち国境へ着いた。
    "translation_status": "reviewed"
  - "id": "xy-ch70-021"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那八戒在金鑾殿前正護持著王、師，忽回頭看見行者半空中將個妖精挑來，他卻怨道：「噯！不打緊的買賣。早知老豬去拿來，卻不算我一功？」說未畢，行者按落雲頭，將妖精捽在階下。八戒跑上去，就築了一鈀道：「此是老豬之功。」行者道：「是你甚功？」八戒道：「莫賴我，我有證見，你不看一鈀築了九個眼子哩。」行者道：「你看看可有頭沒頭。」八戒笑道：「原來是沒頭的，我道如何築他也不動動兒？」行者道：「師父在那裡？」八戒道：「在殿裡與王敘話哩。」行者道：「你且去請他出來。」八戒急上殿，點點頭。三藏即便起身下殿，迎著行者。行者將一封戰書揣在三藏袖裡道：「師父收下，且莫與國王看見。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 173
        "line_end": 173
    "translation_ja": |-
      八戒は金鑾殿（きんらんでん）の前で王と師を守っていたが、ふと振り向くと、悟空が空中で有来有去の死体を棒に突き刺して運んでくるのが見えた。そこで不満を言った。
      八戒「ああ、大した仕事じゃないな。分かっていたら俺が捕まえてきて、一つ手柄にしたものを。」
      言い終わらぬうちに悟空は雲を降ろし、死体を階段の下へ投げた。八戒は駆け寄り、熊手で一突きした。
      八戒「これは俺の手柄だ。」
      悟空「お前の何が手柄なんだ。」
      八戒「ごまかすな。証拠があるぞ。熊手の一撃で九つの穴が開いたのが見えないか。」
      悟空「頭があるかないか、見てみろ。」
      八戒は笑った。
      八戒「なんだ、頭がないのか。道理で、突いてもぴくりとも動かないと思った。」
      悟空「お師匠さまはどこだ。」
      八戒「殿の中で、王と話しておられる。」
      悟空「ちょっと行って、お呼びしてこい。」
      八戒は急いで殿へ上がり、うなずいて合図した。三蔵はすぐ立って殿を降り、悟空を迎えた。悟空は戦書を一通、三蔵の袖へ押し込んだ。
      悟空「お師匠さま、しまっておいてください。まだ国王には見せないでください。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-022"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "說不了，那國王也下殿，迎著行者道：「神僧長老來了？拿妖之事如何？」行者用手指道：「那階下不是妖精？被老孫打殺了也。」國王見了道：「是便是個妖屍，卻不是賽太歲。賽太歲，寡人親見他兩次，身長丈八，膊闊五停；面似金光，聲如霹靂。那裡是這般鄙矮？」行者笑道：「陛下認得，果然不是。這是一個報事的小妖，撞見老孫，卻先打死，挑回來報功。」國王大喜道：「好好好，該算頭功。寡人這裡常差人去打探，更不曾得個的實。似神僧一出，就捉了一個回來，真神通也。」叫：「看暖酒來，與長老賀功。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 174
        "line_end": 174
    "translation_ja": |-
      話し終わらぬうちに国王も殿を降り、悟空を迎えた。
      国王「神僧長老、お帰りですか。妖怪を捕らえる件は、どうなりました。」
      悟空は手で指した。
      悟空「あの階段の下にいるのが妖怪です。私が打ち殺しました。」
      国王は見て言った。
      国王「確かに妖怪の死体ではあるが、賽太歳ではない。余は賽太歳を二度、この目で見ております。背丈は一丈（じょう）八尺（しゃく）、肩幅は五停（てい）、顔は金の光のようで、声は雷鳴のよう。どうしてこんなに小さく、みすぼらしかろう。」
      悟空は笑った。
      悟空「陛下は見分けがつくのですね。そのとおり、本人ではありません。これは知らせを運ぶ小妖怪で、私に出くわしたので、まず打ち殺し、棒に刺して連れ帰って手柄を報告したのです。」
      国王は大いに喜んだ。
      国王「よい、よい、よい。最初の手柄として数えましょう。余はしばしば人を偵察に出しても、確かな情報を得られなかった。神僧は一度お出ましになっただけで、一匹捕らえて帰られた。まことに神通力です。温めた酒を持て。長老の手柄を祝うのだ。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-023"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「吃酒還是小事。我問陛下：金聖宮別時，可曾留下個甚麼表記？你與我些兒。」那國王聽說「表記」二字，卻似刀劍剜心，忍不住失聲淚下，說道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      悟空「酒はひとまずよいのです。陛下にお尋ねしますが、金聖宮さまは別れ際に、何か形見をお残しになりましたか。あれば私にお渡しください。」
      国王は「形見」という二字を聞くと、刀剣で心をえぐられたようで、こらえきれず声を上げて涙を流し、こう語った。
    "translation_status": "reviewed"
  - "id": "xy-ch70-024"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「當年佳節慶朱明，太歲兇妖發喊聲。
      強奪御妻為壓寨，寡人獻出為蒼生。
      更無會話並離話，那有長亭共短亭？
      表記香囊全沒影，至今撇我苦伶仃。」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 178
        "line_end": 181
    "translation_ja": |-
      国王「あの年、夏の佳節を祝っていると、太歳（たいさい）の凶悪な妖怪が大声を上げた。
      王妃を無理に奪い、山塞の妻にしようとし、余は民のために差し出した。
      話し合う間も別れを告げる間もなく、長亭（ちょうてい）や短亭（たんてい）で見送る暇などどこにあろう。
      形見の香袋さえ影もなく、今まで余を置き去りにして、つらく独りぼっちにしている。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-025"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「陛下在邇，何以惱為？那娘娘既無表記，他在宮內可有甚麼心愛之物？與我一件也罷。」國王道：「你要怎的？」行者道：「那妖王實有神通，我見他放煙、放火、放沙，果是難收。縱收了，又恐娘娘見我面生，不肯跟我回國。須是得他平日心愛之物一件，他方信我，我好帶他回來。為此故要帶去。」國王道：「昭陽宮裡梳妝閣上，有一雙黃金寶串，原是金聖宮手上帶戴。只因那日端午要縛五色彩線，故此褪下，不曾戴上。此乃是他心愛之物，如今現收在減妝盒裡。寡人見他遭此離別，更不忍見；一見即如見他玉容，病又重幾分也。」行者道：「且休題這話，且將金串取來。如捨得，都與我拿去；如不捨，只拿一隻去也。」國王遂命玉聖宮取出。取出即遞與國王。國王見了，叫了幾聲「知疼著熱的娘娘」，遂遞與行者。行者接了，套在肐膊上。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 182
        "line_end": 182
    "translation_ja": |-
      悟空「陛下、おそばにおりますのに、どうしてそんなにお嘆きになるのです。形見がないなら、お妃さまが宮中で大切にしていた品はありませんか。一つお渡しいただくだけでもよいのです。」
      国王「何にお使いになるのですか。」
      悟空「あの妖王には本当に神通力があり、煙や火や砂を放つのを見ましたが、確かに捕らえにくい。たとえ捕らえたとしても、お妃さまは私の顔をご存じないので、一緒に帰ってくださらないかもしれません。ふだん大切にしていた品を一つ持っていれば、私を信じ、連れ帰ることができます。そのために持っていきたいのです。」
      国王「昭陽宮（しょうようきゅう）の化粧の間には、黄金の腕輪が一対あります。もともと金聖宮が手に着けていたものです。あの日は端午で、五色の糸を結ぶために外し、そのまま着けなかったのです。あれは妃の大切な品で、今も化粧箱にしまってあります。余はあのような別れに遭ってから、見るのも忍びない。見れば妃の美しい顔を見たようで、病がまた幾分も重くなるのです。」
      悟空「そのお話はひとまずおやめになり、金の腕輪をお取り寄せください。惜しくなければ二つとも、惜しければ一つだけでもお預かりします。」
      国王は玉聖宮（ぎょくせいきゅう）に命じ、取り出させた。玉聖宮が国王へ渡すと、王はその品を見て、「痛みも寒暖も気遣ってくれた妃よ」と何度か呼び、悟空へ差し出した。悟空は受け取り、自分の腕にはめた。
    "translation_status": "reviewed"
  - "id": "xy-ch70-026"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "好大聖，不吃得功酒，且駕觔斗雲，唿哨一聲，又至麒麟山上。無心玩景，徑尋洞府而去。正行時，只聽得人語喧嚷，即佇立凝睛觀看。原來那獬豸洞口把門的大小頭目，約摸有五百名，在那裡："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 184
        "line_end": 184
    "translation_ja": "悟空は手柄を祝う酒も飲まず、觔斗雲（きんとうん）に乗り、ひゅっと一声上げて、また麒麟山へ着いた。景色を眺める気もなく、まっすぐ洞窟を捜しに行く。歩いていると、人声が騒がしく聞こえたので、立ち止まって目を凝らした。獬豸洞の入口を守る大小の頭目が、およそ五百名、そこにいるのだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-027"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "森森羅列，密密挨排。森森羅列執干戈，映日光明；密密挨排展旌旗，迎風飄閃。虎將熊師能變化，豹頭彪帥弄精神。蒼狼多猛烈，獺象更驍雄。狡兔乖獐掄劍戟，長蛇大蟒挎刀弓。猩猩能解人言語，引陣安營識汛風。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 185
        "line_end": 185
    "translation_ja": |-
      びっしり列をなし、隙間もなく居並ぶ。
      びっしり並んで盾と戈（ほこ）を持てば、日の光を照り返し、密に居並んで旗を広げれば、風を迎えてひらめく。
      虎の将軍と熊の将軍は変化にたけ、豹の頭目と彪（ひょう）の元帥は精気を振るう。
      青い狼はひどく猛々しく、カワウソや象はいっそう勇ましい。
      すばしこい兎と利口なキバノロは剣と戟（げき）を振り、長い蛇と大蟒（だいぼう）は刀と弓を帯びる。
      猩猩（しょうじょう）は人の言葉が分かり、陣を導き、営を築き、時の風を読む。
    "translation_status": "reviewed"
  - "id": "xy-ch70-028"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見了，不敢前進，抽身徑轉舊路。你道他抽身怎麼？不是怕他。他卻至那打死小妖之處，尋出黃旗、銅鑼，迎風捏訣，想象騰那，即搖身一變，變做那有來有去的模樣，乒乓敲著鑼，大踏步，一直前來，徑撞至獬豸洞。正欲看看洞景，只聞得猩猩出語道：「有來有去，你回來了？」行者只得答應道：「來了。」猩猩道：「快走，大王爺爺正在剝皮亭上等你回話哩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 187
        "line_end": 187
    "translation_ja": |-
      悟空はこれを見ると、そのまま進むのは控え、身を翻して来た道へ戻った。なぜ引き返したのか。恐れたわけではない。小妖怪を打ち殺した場所まで戻り、黄色い旗と銅鑼を捜し出し、風に向かって印を結び、姿を思い描いて身を振るい、有来有去の格好に変わったのである。がんがんと銅鑼を鳴らし、大股で一直線に進んで、獬豸洞へ入った。洞内の様子を見ようとすると、猩猩が声をかけた。
      猩猩「有来有去、帰ってきたか。」
      悟空は返事をするしかない。
      悟空「帰ったよ。」
      猩猩「早く行け。大王さまが剝皮亭（はくひてい）で、お前の報告を待っておられる。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-029"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，拽開步，敲著鑼，徑入前門裡看處，原來是懸崖削壁，石屋虛堂，左右有琪花瑤草，前後多古柏喬松。不覺又至二門之內，忽擡頭，見一座八窗明亮的亭子，亭子中間有一張戧金的交椅，椅子上端坐著一個魔王，真個生得惡像。但見他："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 189
        "line_end": 189
    "translation_ja": "悟空はそれを聞き、大股で銅鑼を鳴らしながら前の門へ入った。見れば、断崖と切り立つ岩壁に、石の部屋と広い堂。左右には玉のような花と草、前後には古い柏と高い松が多くある。いつの間にか二番目の門の中へ入り、ふと顔を上げると、八つの窓が明るい亭が見えた。その中央には金を象嵌した折り畳み椅子があり、洞の主、賽太歳が端然と座っている。その姿は、まことに恐ろしい。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-030"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      晃晃霞光生頂上，威威殺氣迸胸前。
      口外獠牙排利刃，鬢邊焦髮放紅煙。
      嘴上髭鬚如插箭，遍體昂毛似疊氈。
      眼突銅鈴欺太歲，手持鐵杵若摩天。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 191
        "line_end": 194
    "translation_ja": |-
      きらめく霞の光が頭上に生じ、すさまじい殺気が胸元から噴き出す。
      口の外へ出た牙は鋭い刃を並べ、鬢（びん）の焦げ色の髪からは赤い煙が上がる。
      口の周りのひげは差し立てた矢のよう、全身に逆立つ毛は重ねた毛氈（もうせん）のよう。
      飛び出す目は銅鈴にも似て太歳（たいさい）をしのぎ、手に握る鉄杵（てっしょ）は天を摩するほど。
    "translation_status": "reviewed"
  - "id": "xy-ch70-031"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者見了，公然傲慢那妖精，更不循一些兒禮法：調轉臉，朝著外，只管敲鑼。妖王問道：「你來了？」行者不答。又問：「有來有去，你來了？」也不答應。妖王上前扯住道：「你怎麼到了家還篩鑼，問之又不答，何也？」行者把鑼往地下一摜道：「甚麼『何也』、『何也』？我說我不去，你卻教我去。行到那廂，只見無數的人馬列成陣勢，見了我，就都叫：『拿妖精，拿妖精。』把我推推扯扯，拽拽扛扛，拿進城去。見了那國王，國王便教：『斬了。』幸虧那兩班謀士道：『兩家相爭，不斬來使。』把我饒了。收了戰書，又押出城外，對軍前打了三十順腿，放我來回話。他那裡不久就要來此與你交戰哩。」妖王道：「這等說，是你吃虧了，怪不得問你更不言語。」行者道：「卻不是怎的？只為護疼，所以不曾答應。」妖王道：「那裡有多少人馬？」行者道：「我也諕昏了，又吃他打怕了，那裡會查他人馬數目？只見那裡森森兵器擺列著："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 195
        "line_end": 195
    "translation_ja": |-
      悟空はそれを見ても、公然と賽太歳を侮り、礼儀を少しも守らなかった。顔を背けて外を向き、ただ銅鑼を鳴らし続ける。
      賽太歳「帰ったか。」
      悟空は答えない。
      賽太歳「有来有去、帰ったのか。」
      やはり答えない。賽太歳は近寄って引き止めた。
      賽太歳「どうして家へ帰ってまで銅鑼を鳴らし、問いにも返事をしない。なぜだ。」
      悟空は銅鑼を地面へ投げつけた。
      悟空「何が『なぜだ』『なぜだ』だ！　行きたくないと言ったのに、あんたが行かせたんじゃないか。向こうへ着くと、数えきれない兵馬が陣を組んでいた。俺を見るなり皆が『妖怪を捕まえろ、捕まえろ！』と叫び、押したり引いたり、引きずったり担いだりして、城の中へ連れ込んだ。王の前へ出ると、王は『斬れ！』と言う。幸い左右の謀臣たちが『両国が争う時も、来た使者は斬らないものです』と言ってくれて、命は助かった。戦書を受け取ると、また城外へ引き立てられ、軍勢の前で腿を三十回打たれた末、報告に帰されたんだ。向こうは間もなくここへ来て、あんたと戦うそうだよ。」
      賽太歳「そうか、お前はひどい目に遭ったのか。問うても口を利かなかったわけだ。」
      悟空「そうでなくて何だ。痛むところをかばっていたから、返事もしなかったのさ。」
      賽太歳「向こうには、どれほど兵馬がいた。」
      悟空「驚いて頭がぼうっとし、おまけに殴られて怖くなったんだ。兵や馬の数なんか数えられるか。ただ、武器がぎっしり並んでいたのが見えた。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-032"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "弓箭刀槍甲與衣，干戈劍戟並纓旗。剽槍月鏟兜鍪鎧，大斧團牌鐵蒺藜。長悶棍，短窩槌，鋼叉銃鉋及頭盔。打扮得䩺鞋護頂並胖襖，簡鞭神彈與銅鎚。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 197
        "line_end": 197
    "translation_ja": |-
      悟空「弓、矢、刀、槍、甲と衣、盾と戈、剣と戟、房飾りの旗。
      投げ槍、月鏟（げっさん）、兜と鎧、大斧、丸盾、鉄蒺藜（てつしつり）。
      長い悶棍（もんこん）、短い窩槌（かつい）、鋼の叉（さ）、銃と鉋（ほう）、それに頭を守る兜。
      䩺鞋（おうあい）、頭頂の覆い、厚い綿入れを身に着け、簡（かん）、鞭（べん）、神弾（しんだん）、銅の鎚までそろえていた。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-033"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那王聽了笑道：「不打緊，不打緊。似這般兵器，一火皆空。你且去報與金聖娘娘得知，教他莫惱。今早他聽見我發狠，要去戰鬥，他就眼淚汪汪的不乾。你如今去說那裡人馬驍勇，必然勝我，且寬他一時之心。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 198
        "line_end": 198
    "translation_ja": |-
      賽太歳は聞いて笑った。
      賽太歳「大したことはない、大したことはない。そんな武器は、ひと火ですべてなくなる。お前は金聖宮さまへ知らせ、悲しまないように言ってこい。今朝、わしが怒って戦いに行くと言ったのを聞くと、涙で目をいっぱいにし、ちっとも乾かない。今から行って、向こうの兵馬は勇ましく、きっとわしに勝つと言え。しばらくでも心を安らがせてさしあげろ。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-034"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聞言，十分歡喜道：「正中老孫之意。」你看他偏是路熟，轉過角門，穿過廳堂。那裡邊盡都是高堂大廈，更不似前邊的模樣。直到後邊宮裡，遠見彩門壯麗，乃是金聖娘娘住處。直入裡面看時，有兩班妖狐、妖鹿，一個個都妝成美女之形，侍立左右。正中間坐著那個娘娘，手托著香腮，雙眸滴淚。果然是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 200
        "line_end": 200
    "translation_ja": |-
      悟空はそれを聞き、大いに喜んだ。
      悟空「まさに俺の思うつぼだ。」
      何とも道に慣れた様子で、脇門を回り、広間を抜けていく。奥は高い堂と大きな屋敷ばかりで、前の方とはまるで様子が違う。ずっと後ろの宮まで来ると、遠くに彩りも壮麗な門が見えた。そこが金聖宮の住まいだった。そのまま中へ入ってみると、狐と鹿の妖怪が左右二列に並び、どれも美女の姿に化けて侍っている。真ん中には金聖宮が座り、美しい頬を手で支え、両の目から涙を落としていた。まことに。
    "translation_status": "reviewed"
  - "id": "xy-ch70-035"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "玉容嬌嫩，美貌妖嬈。懶梳妝，散鬢堆鴉；怕打扮，釵環不戴。面無粉，冷淡了胭脂；髮無油，蓬鬆了雲鬢。努櫻唇，緊咬銀牙；皺蛾眉，淚淹星眼。一片心，只憶著朱紫君王；一時間，恨不離天羅地網。誠然是：自古紅顏多薄命，懨懨無語對東風。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 202
        "line_end": 202
    "translation_ja": |-
      玉の顔は若々しく、姿はあでやか。
      髪を結う気もなく、烏のような黒髪を乱して垂らし、装う気もなく、簪（かんざし）も耳飾りも着けない。
      顔には白粉もなく、紅は冷たく置き去りにされ、髪には油もなく、雲のような鬢は乱れて膨らむ。
      桜の唇を突き出し、白銀の歯を固くかみ、蛾のような眉を寄せ、星のような目を涙に沈める。
      心はただ朱紫国の王を思い、一刻も早く天にも地にも張られた網を抜け出したいと願う。
      まことに昔から美人には薄命が多い。憂いに沈み、何も語らず春風に向かう。
    "translation_status": "reviewed"
  - "id": "xy-ch70-036"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者上前打了個問訊道：「接喏。」那娘娘道：「這潑村怪，十分無狀。想我在那朱紫國中，與王同享榮華之時，那太師、宰相見了，就俯伏塵埃，不敢仰視。這野怪怎麼叫聲『接喏』？是那裡來的這般村潑？」眾侍婢上前道：「太太息怒。他是大王爺爺心腹的小校，喚名有來有去。今早差下戰書的是他。」娘娘聽說，忍怒問曰：「你下戰書，可曾到朱紫國界？」行者道：「我持書直至城裡，到於金鑾殿，面見君王，已討回音來也。」娘娘道：「你面君，君有何言？」行者道：「那君王敵戰之言，與排兵布陣之事，才與大王說了。只是那君王有思想娘娘之意，有一句合心的話兒，特來上稟。奈何左右人眾，不是說處。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 203
        "line_end": 203
    "translation_ja": |-
      悟空は前へ進み、軽く礼をした。
      悟空「ご挨拶を。」
      金聖宮「この粗野な妖怪は、何と無作法なのでしょう。私が朱紫国で王と栄華をともにしていた頃は、太師（たいし）も宰相も、私を見ると地に伏し、顔を上げることさえできなかった。この野育ちの妖怪は、どうして『ご挨拶を』の一言なのです。どこから来た、こんな礼儀知らずが！」
      侍女たちが進み出た。
      侍女たち「奥方さま、お怒りをお鎮めください。大王さまの腹心の小校で、有来有去と申します。今朝、戦書を届けに出たのはこの者です。」
      金聖宮はそれを聞くと怒りを抑え、尋ねた。
      金聖宮「戦書を届けに行って、朱紫国の地へは着いたのですか。」
      悟空「書状を持って城内へ入り、金鑾殿で直接王にお会いして、返事を受けて戻りました。」
      金聖宮「王に会ったのなら、王は何とおっしゃいました。」
      悟空「戦いについての言葉と、兵や陣の備えのことは、先ほど大王にお話ししました。ただ、あちらの王はお妃さまを思っておられ、お心にかなう一言があるので、特に申し上げに来たのです。ですが、左右にこれほど人がいては、話す場所ではありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-037"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "娘娘聞言，喝退兩班狐、鹿。行者掩上宮門，把臉一抹，現了本像，對娘娘道：「你休怕我。我是東土大唐差往大西天天竺國雷音寺見佛求經的和尚。我師父是唐王御弟唐三藏。我是他大徒弟孫悟空。因過你國倒換關文，見你君臣出榜招醫，是我大施三折之肱，把他相思之病治好了，排宴謝我。飲酒之間，說出你被妖攝來。我會降龍伏虎，特請我來捉怪，救你回國。那戰敗先鋒是我，打死小妖也是我。我見他門外兇狂，是我變作有來有去模樣，捨身到此，與你通信。」那娘娘聽說，沉吟不語。行者取出寶串，雙手奉上道：「你若不信，看此物何來？」娘娘一見垂淚，下座拜謝道：「長老，你果是救得我回朝，沒齒不忘大恩。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 204
        "line_end": 204
    "translation_ja": |-
      金聖宮は聞くと、左右の狐と鹿を叱って下がらせた。悟空は宮の門を閉め、顔を一なですると元の姿を現し、金聖宮へ言った。
      悟空「怖がらないでください。私は東土の大唐（だいとう）から、大西天（だいさいてん）の天竺国（てんじくこく）、雷音寺（らいおんじ）へ仏にお目にかかり経を求めに遣わされた僧です。師は唐王（とうおう）の御弟（ぎょてい）、唐三蔵（とうさんぞう）。私は一番弟子の孫悟空です。お国を通って通関文牒（つうかんもんちょう）を交換しようとしたところ、王と臣下が掲示を出して医者を求めていたので、私が三折肱（さんせつこう）の腕前を大いに振るい、王の恋い慕う病を治しました。お礼の宴の酒席で、あなたが妖怪にさらわれたと伺ったのです。私は竜を降し虎を伏せることができるので、妖怪を捕らえ、あなたを救って国へ帰すよう、特に頼まれました。先鋒を負かしたのも私、小妖怪を殺したのも私です。門の外の連中の凶暴な様子を見て、有来有去の姿に化け、身を投げ出してここへ入り、あなたへ知らせに来ました。」
      金聖宮はそれを聞いても、考え込んで何も言わない。悟空は腕輪を取り出し、両手で差し上げた。
      悟空「信じられなければ、この品がどこから来たか、ご覧ください。」
      金聖宮は一目見るなり涙を流し、座を降りて拝礼した。
      金聖宮「長老、本当に私を朝廷へ帰してくださったら、その大恩を一生忘れません。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-038"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「我且問你，他那放火、放煙、放沙的，是件甚麼寶貝？」娘娘道：「那裡是甚寶貝，乃是三個金鈴。他將頭一個幌一幌，有三百丈火光燒人；第二個幌一幌，有三百丈煙光燻人；第三個幌一幌，有三百丈黃沙迷人。煙火還不打緊，只是黃沙最毒，若鑽入人鼻孔，就傷了性命。」行者道：「利害，利害。我曾經著，打了兩個嚏噴。卻不知他的鈴兒放在何處？」娘娘道：「他那肯放下？只是帶在腰間，行住坐臥，再不離身。」行者道：「你若有意於朱紫國，還要相會國王，把那煩惱憂愁，都且權解，使出個風流喜悅之容，與他敘個夫妻之情，教他把鈴兒與你收貯。待我取便偷了，降了這妖怪，那時節，好帶你回去，重諧鸞鳳，共享安寧也。」那娘娘依言。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 205
        "line_end": 205
    "translation_ja": |-
      悟空「お尋ねしますが、あの火や煙や砂を放つものは、何の宝なのです。」
      金聖宮「大げさな宝というものでもなく、三つの金鈴（きんれい）です。一つ目を揺らせば三百丈の炎が人を焼き、二つ目を揺らせば三百丈の煙が人を燻し、三つ目を揺らせば三百丈の黄砂が人の目を塞ぎます。煙と火はまだしも、黄砂が最も恐ろしく、鼻の穴へ入り込めば命を奪うのです。」
      悟空「恐ろしい、恐ろしい。私も浴びて、二度くしゃみをしました。あの鈴は、どこに置いてありますか。」
      金聖宮「あの者が手放すものですか。ただ腰に帯び、歩く時も、立つ時も、座る時も寝る時も、身から離しません。」
      悟空「朱紫国を思い、もう一度王と会いたいお心があるのなら、悲しみや憂いをひとまず解いて、あでやかで嬉しそうな顔を見せ、夫婦の情を語り、鈴をあなたへ預けてしまわせてください。私が隙を見て盗み、妖怪を降したら、お連れして帰れます。その時には夫婦の縁を結び直し、ともに安らかに暮らせましょう。」
      金聖宮はその言葉に従った。
    "translation_status": "reviewed"
  - "id": "xy-ch70-039"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者還變作心腹小校，開了宮門，喚進左右侍婢。娘娘叫：「有來有去，快往前亭請你大王來，與他說話。」好行者，應了一聲，即至剝皮亭，對妖精道：「大王，聖宮娘娘有請。」妖王歡喜道：「娘娘常時只罵，怎麼今日有請？」行者道：「那娘娘問朱紫國王之事，是我說：『他不要你了，他國中另扶了皇后。』娘娘聽說，故此沒了想頭，方才命我來奉請。」妖王大喜道：「你卻中用。待我剿除了他國，封你為個隨朝的太宰。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 207
        "line_end": 207
    "translation_ja": |-
      悟空はまた腹心の小校に変わり、宮の門を開いて、左右の侍女を呼び入れた。金聖宮が命じた。
      金聖宮「有来有去、早く前の亭へ行き、お前の大王を呼んできなさい。話があります。」
      悟空は一声答え、すぐに剝皮亭へ行って賽太歳へ告げた。
      悟空「大王、金聖宮さまがお呼びです。」
      賽太歳は喜んだ。
      賽太歳「いつもは罵るばかりのお妃さまが、どうして今日は呼んでくださるのだ。」
      悟空「朱紫国王のことをお尋ねになったので、『あの方は、もうあなたをいらないと言っています。国には別の皇后を立てました』と申し上げたのです。それを聞いて、もう望みがなくなったからこそ、私にお招きを命じられたのでございます。」
      賽太歳は大いに喜んだ。
      賽太歳「お前は役に立つな。あの国を滅ぼしたら、朝廷に仕える太宰（たいさい）に取り立ててやろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-040"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者順口謝恩，疾與妖王來至後宮門首。那娘娘歡容迎接，就去用手相攙。那妖王喏喏而退道：「不敢，不敢。多承娘娘下愛，我怕手痛，不敢相傍。」娘娘道：「大王請坐，我與你說。」妖王道：「有話但說不妨。」娘娘道：「我蒙大王辱愛，今已三年，未得共枕同衾。也是前世之緣，做了這場夫妻。誰知大王有外我之意，不以夫妻相待。我想著當時在朱紫國為后，外邦凡有進貢之寶，君看畢，一定與后收之。你這裡更無甚麼寶貝，左右穿的是貂裘，吃的是血食，那曾見綾錦金珠？只一味鋪皮蓋毯。或者就有些寶貝，你因外我，也不教我看見，也不與我收著。且如聞得你有三個鈴鐺，想就是件寶貝，你怎麼走也帶著，坐也帶著？你就拿與我收著，待你用時取出，未為不可。此也是做夫妻一場，也有個心腹相託之意。如此不相託付，非外我而何？」妖王大笑陪禮道：「娘娘怪得是，怪得是。寶貝在此，今日就當付你收之。」便即揭衣取寶。行者在旁，眼不轉睛，看著那怪揭起兩三層衣服，貼身帶著三個鈴兒。他解下來，將些綿花塞了口兒，把一塊豹皮作一個包袱兒包了，遞與娘娘道：「物雖微賤，卻要用心收藏，切不可搖幌著他。」娘娘接過手道：「我曉得。安在這妝臺之上，無人搖動。」叫：「小的們，安排酒來，我與大王交歡會喜，飲幾杯兒。」眾侍婢聞言，即鋪排果菜，擺上些獐\U00024731鹿兔之肉，將椰子酒斟來奉上。那娘娘做出妖嬈之態，哄著精靈。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 208
        "line_end": 208
    "translation_ja": |-
      悟空はすかさず恩を謝し、急いで賽太歳と後宮の門まで来た。金聖宮は喜ばしげな顔で迎え、手を取って支えようとした。賽太歳は恐縮しながら後ずさった。
      賽太歳「いえ、とんでもない、とんでもない。お妃さまのお情けはありがたいのですが、手が痛くなるのが怖く、近寄れません。」
      金聖宮「大王、お座りください。お話があるのです。」
      賽太歳「何でも、おっしゃってください。」
      金聖宮「大王に身に余るご寵愛をいただき、もう三年になりますが、まだ同じ枕、同じ夜具で寝たこともありません。それでも前世の縁なのでしょう、こうして夫婦になりました。ところが、大王には私を他人扱いする気持ちがあり、夫婦として接してくださらない。私が朱紫国で后だった頃は、外国が宝を献上すると、王はご覧になった後、必ず后に預けてくださったものです。ここにはこれといった宝もなく、周りの者はテンの毛皮を着て、獣の血肉を食べ、綾や錦、金や真珠など見たこともない。ただ獣の皮を敷き、毛布を掛けるばかり。もし宝があっても、私をよそ者と思っておられるので、見せてもくださらず、保管も任せてくださらない。たとえば、鈴を三つお持ちだと聞きました。きっと宝なのでしょうが、どうして歩く時も座る時も身に着けておられるのです。私に預けておき、使う時に取り出せば、それでよいではありませんか。それでも一度夫婦になったのですから、心を許して託す気持ちもあってよいはずです。こうして何も任せないのは、他人扱いでなくて何でしょう。」
      賽太歳は大笑いし、詫びるように礼をした。
      賽太歳「お妃さまのお叱りはもっともです、もっともです。宝はここにあります。今日こそ、お預けしてしまっていただきましょう。」
      さっそく衣をめくって宝を取り出す。悟空は脇で目を離さず見ていた。賽太歳は衣を二、三枚めくり、肌に密着させて帯びていた鈴を三つ外した。それぞれの口へ綿を詰め、豹の皮一枚を包み布にして包み、金聖宮へ渡した。
      賽太歳「つまらぬ品ではありますが、大切にしまい、決して揺らさないでください。」
      金聖宮は受け取った。
      金聖宮「分かっています。この鏡台の上へ置けば、誰も揺らしません。お前たち、酒を用意しなさい。大王と喜びを交わし、何杯かいただきましょう。」
      侍女たちは聞くと、さっそく果物や料理を並べ、キバノロ・𤜱（は）・鹿・兎の肉を置き、椰子酒（やしざけ）を注いで差し出した。金聖宮はあでやかな様子を作り、賽太歳をうまくあやしていた。
    "translation_status": "reviewed"
  - "id": "xy-ch70-041"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫行者在旁取事，但挨挨摸摸，行近妝臺，把三個金鈴輕輕拿過，慢慢移步，溜出宮門，徑離洞府。到了剝皮亭前無人處，展開豹皮幅子看時，中間一個有茶鍾大，兩頭兩個有拳頭大。他不知利害，就把綿花扯了。只聞得噹的一聲響喨，骨都都的迸出煙、火、黃沙，急收不住，滿亭中烘烘火起。諕得那把門精怪一擁撞入後宮，驚動了妖王，慌忙教：「去救火，救火。」出來看時，原來是有來有去拿了金鈴兒哩。妖王上前喝道：「好賤奴，怎麼偷了我的金鈴寶貝，在此胡弄？」叫：「拿來，拿來。」那門前虎將、熊師、豹頭、彪帥、獺象、蒼狼、乖獐、狡兔、長蛇、大蟒、猩猩，帥眾妖一齊攢簇。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 209
        "line_end": 209
    "translation_ja": |-
      悟空は脇で機会をうかがい、少しずつ体を寄せて鏡台へ近づくと、三つの金鈴をそっと手に取った。ゆっくり足を運んで宮の門から抜け出し、洞の外へ向かう。剝皮亭の前の人気のない所へ着き、豹の皮を広げて見ると、真ん中の一つは茶碗ほど、両端の二つは拳ほどの大きさだった。危険を知らずに綿を引き抜くと、からん、と一声響き、もくもくと煙、火、黄砂が噴き出し、急には収まらない。亭いっぱいに火が轟々と燃え上がった。門を守る妖怪たちは驚き、一団となって後宮へ駆け込み、賽太歳を騒がせた。賽太歳は慌てて命じた。
      賽太歳「火を消せ、火を消せ！」
      出てみると、有来有去の姿をした悟空が金鈴を持っている。賽太歳は近寄って怒鳴った。
      賽太歳「この下賤な奴め！　どうしてわしの金鈴の宝を盗み、ここで勝手にいじる。よこせ、よこせ！」
      門前の虎の将軍、熊の将軍、豹の頭目、彪の元帥、カワウソ、象、青い狼、利口なキバノロ、すばしこい兎、長い蛇、大蟒、猩猩が、妖怪たちを率いて一斉に群がった。
    "translation_status": "reviewed"
  - "id": "xy-ch70-042"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那行者慌了手腳，丟了金鈴，現出本像，掣出金箍如意棒，撒開解數，往前亂打。那妖王收了寶貝，傳號令，教：「關了前門。」眾妖聽了，關門的關門，打仗的打仗。那行者難得脫身，收了棒，搖身一變，變作個痴蒼蠅兒，釘在那無火石壁上。眾妖尋不見，報道：「大王，走了賊也，走了賊也。」妖王問：「可曾自門裡走出去？」眾妖都說：「前門緊鎖牢拴在此，不曾走出。」妖王只說：「仔細搜尋。」有的取水潑火，有的仔細搜尋，更無蹤跡。妖王怒道：「是個甚麼賊子？好大膽，變作有來有去的模樣，進來見我回話，又跟在身邊，乘機盜我寶貝。早是不曾拿將出去。若拿出山頭，見了天風，怎生是好？」虎將上前道：「大王的洪福齊天，我等的氣數不盡，故此知覺了。」熊師上前道：「大王，這賊不是別人，定是那戰敗先鋒的那個孫悟空。想必路上遇著有來有去，傷了性命，奪了黃旗、銅鑼、牙牌，變作他的模樣，到此欺騙了大王也。」妖王道：「正是，正是，見得有理。」叫：「小的們，仔細搜求防避，切莫開門放出走了。」這才是個有分教："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 210
        "line_end": 210
    "translation_ja": |-
      悟空は慌てて手足の置き場も分からなくなり、金鈴を放り出し、元の姿を現すと、如意金箍棒（にょいきんこぼう）を抜いて技を繰り出し、前へめった打ちにした。賽太歳は宝を取り戻し、号令を発した。
      賽太歳「前の門を閉めろ！」
      妖怪たちは聞くなり、門を閉める者は閉め、戦う者は戦う。悟空は逃げ出せず、棒を収めて身を振るい、ぼんやりした蠅に変わり、火のついていない岩壁へぴたりと留まった。妖怪たちは見つけられず、報告した。
      妖怪たち「大王、賊を逃がしました。賊を逃がしました！」
      賽太歳「門から出ていったのか。」
      妖怪たちは皆、答えた。
      妖怪たち「前の門は固く閉じ、閂をしっかり掛けております。出てはおりません。」
      賽太歳「念入りに捜せ。」
      水を汲んで火へかける者もあれば、念入りに捜す者もあるが、姿はどこにもない。賽太歳は怒った。
      賽太歳「何者だ、この賊は！　大胆にも有来有去に化け、わしに会って報告し、そばについて機をうかがい、宝を盗むとは。まだ外へ持ち出されずに済んでよかった。山の外へ持ち出し、天の風に当たっていたら、どうなっていたことか！」
      虎の将軍が進み出た。
      虎の将軍「大王の大きな福運が天にも等しく、私どもの命運もまだ尽きていなかったので、気づけたのでございます。」
      熊の将軍も進み出た。
      熊の将軍「大王、この賊はほかでもありません。きっと、先鋒を負かしたあの孫悟空です。おそらく道で有来有去に出会い、命を奪って黄色い旗と銅鑼と牙牌を取り、その姿に化けて、ここへ大王を騙しに来たのでしょう。」
      賽太歳「そのとおり、そのとおり。もっともな見立てだ。お前たち、念入りに捜して警戒しろ。決して門を開けて逃がすな！」
      まさに、こうなる定めであった。
    "translation_status": "reviewed"
  - "id": "xy-ch70-043"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "弄巧翻成拙，作耍卻為真。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 212
        "line_end": 212
    "translation_ja": |-
      巧みな細工が、かえってへまになり、
      戯れのつもりが、本当の事態となる。
    "translation_status": "reviewed"
  - "id": "xy-ch70-044"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "畢竟不知孫行者怎麼脫得妖門，且聽下回分解。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 214
        "line_end": 214
    "translation_ja": "さて、悟空がどうやって妖怪の門を脱したかは、次回をお聞きいただこう。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-01-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この妖怪はここで初めて賽太歳配下の先鋒と名乗る。第六十九回の末尾では名は分からず、八戒が賽太歳ではないかと推測しただけである。ここでは主人の賽太歳と同一人物にしない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-02-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この詩は悟空が修行と移動の速さを誇る発言であり、現代の健康法や薬の調製法ではない。鉛・水銀、烏兎、陰陽、五行、四象、三家などは内丹の象徴語として読んだ。具体的な身体部位や物質の操作へは固定しない。『天為頂』は底本どおり『天を頂き』とし、鼎へ黙って改めなかった。『退爐進火』も炉と火の字面を残し、別の術語へ校訂しない。凌雲渡の所在や、ここで語られない渡しの事情は補わない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-03-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "小妖怪は先ほど『三年前』と言ったが、ここは原文が『前年』なので『一昨年』とした。二つの時点は整合させず、底本のまま残す。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-04-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『五短身材』。五短という数を含む表現を残し、全身が短くずんぐりした体つきとして訳した。五つの部位を具体的に列挙する説明は底本にないため加えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-05-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "名の有来有去は『来ることも、去ることもある』の意。悟空はこれを有去無来、すなわち『行くことはあっても、帰ることはない』へ言い換え、殺した相手をからかう。名は腰の札で初めて判明するので、それ以前の地の文と話者名には入れなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-06-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "殺す場面では頭が砕け、首が折れたとされ、ここでは八戒が『頭がない』と確認する。切断して頭を取り去る動作は別に書かれていない。訳者がその動作を補ったり、片方の描写を消したりせず、両方を残した。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-07-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文は『膊闊五停』。停を身体の幅に関わる語として残したが、具体的な尺度や換算は確定できない。五尺などへ置き換えない。丈八は一丈八尺と解した。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-08-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "ここで王が太歳と呼んでいるのは、既に名の分かっている賽太歳である。独立した神である太歳の話へ置き換えない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-09-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の『陛下在邇』は文意が取りにくい。在邇の『近くにいる』という字義を残し、王を励ます悟空がそばにいるという文脈上の解釈を採った。主語を補った訳であり、異本による校訂や確定した読解ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-10-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "獣の列挙の『獺象』は獺と象に分け、二種として訳した。ただし底本には両者を区切る読点がなく、語の切り方には留保がある。『熊師』の師はこの並びでは一団を率いる者と解して『熊の将軍』としたが、固有の軍制上の階級を確定したものではない。『汛風』も時節に応じる風として訳した。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-11-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "この姿の詩の『欺太歲』は、太歳の神威をもしのぐほど恐ろしいという誇張と解した。王の詩で賽太歳を略して呼んだ太歳とは、同じ表記でも参照先を分ける。賽太歳という名との言葉の重なりは残る。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-12-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の武具を一つずつ残した。月鏟は三日月形の鏟、簡は文書でなく打撃武器、鞭もここでは棒状の武器と解す。鉄蒺藜・窩槌・神弾は細かな形や仕組みを確定しない。『鉋』は火器の炮に相当する可能性があるが、底本の字をそのまま用いた。珍字の䩺も保持し、確証のない装具の形は加えなかった。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-13-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "三折肱は、腕を三度折るほど経験を積めば良医になるという故事に由来する言い回し。ここでは悟空自身が医術の腕を誇っている。王の病と治療の話は物語中の医療観であり、現代医学上の診断・治療効果を保証する記述ではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-14-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "原文の『血食』は肉を食べることをいう語で、獣たちの粗野な暮らしを強調する発言である。血の字を落とさず訳したが、調理方法や生食の有無までは断定しない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-15-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "底本の肉の列挙にある珍字を保持した。康熙字典の電子翻刻では『邦加切、音巴、本又作豝』とされるため、豕の類に関わる字と考えられる。ただしここでの種・雌雄・加工の有無は確定しない。日本語の『は』は字書の音巴と日本語の巴の音から推定した読みであり、日本語仮名を直接示す資料で確認したものではない。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-note-16-body"
    "section_id": "chapter-70"
    "kind": "note_body"
    "origin": "translator"
    "source_text": null
    "source_languages": []
    "source_locations": []
    "translation_ja": "直前の原文は『徑離洞府』だが、ここで悟空が着くのは洞内の剝皮亭である。そのため『洞の外へ向かう』と方向を表す訳にした。洞窟の外へ出終わったとする訳にはせず、底本の位置関係の不整合はこの注で明示する。"
    "translation_status": "reviewed"

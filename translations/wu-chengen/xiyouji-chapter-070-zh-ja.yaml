  "known_gaps":
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-002"
      "description_ja": "この妖怪はここで初めて賽太歳配下の先鋒と名乗る。第六十九回の末尾では名は分からず、八戒が賽太歳ではないかと推測しただけである。ここでは主人の賽太歳と同一人物にしない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-007"
      "description_ja": "この詩は悟空が修行と移動の速さを誇る発言であり、現代の健康法や薬の調製法ではない。鉛・水銀、烏兎、陰陽、五行、四象、三家などは内丹の象徴語として読んだ。具体的な身体部位や物質の操作へは固定しない。『天為頂』は底本どおり『天を頂き』とし、鼎へ黙って改めなかった。『退爐進火』も炉と火の字面を残し、別の術語へ校訂しない。凌雲渡の所在や、ここで語られない渡しの事情は補わない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-019"
      "description_ja": "小妖怪は先ほど『三年前』と言ったが、ここは原文が『前年』なので『一昨年』とした。二つの時点は整合させず、底本のまま残す。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-020"
      "description_ja": "原文は『五短身材』。五短という数を含む表現を残し、全身が短くずんぐりした体つきとして訳した。五つの部位を具体的に列挙する説明は底本にないため加えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-020"
      "description_ja": "名の有来有去は『来ることも、去ることもある』の意。悟空はこれを有去無来、すなわち『行くことはあっても、帰ることはない』へ言い換え、殺した相手をからかう。名は腰の札で初めて判明するので、それ以前の地の文と話者名には入れなかった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-021"
      "description_ja": "殺す場面では頭が砕け、首が折れたとされ、ここでは八戒が『頭がない』と確認する。切断して頭を取り去る動作は別に書かれていない。訳者がその動作を補ったり、片方の描写を消したりせず、両方を残した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-022"
      "description_ja": "原文は『膊闊五停』。停を身体の幅に関わる語として残したが、具体的な尺度や換算は確定できない。五尺などへ置き換えない。丈八は一丈八尺と解した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-024"
      "description_ja": "ここで王が太歳と呼んでいるのは、既に名の分かっている賽太歳である。独立した神である太歳の話へ置き換えない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-025"
      "description_ja": "底本の『陛下在邇』は文意が取りにくい。在邇の『近くにいる』という字義を残し、王を励ます悟空がそばにいるという文脈上の解釈を採った。主語を補った訳であり、異本による校訂や確定した読解ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-027"
      "description_ja": "獣の列挙の『獺象』は獺と象に分け、二種として訳した。ただし底本には両者を区切る読点がなく、語の切り方には留保がある。『熊師』の師はこの並びでは一団を率いる者と解して『熊の将軍』としたが、固有の軍制上の階級を確定したものではない。『汛風』も時節に応じる風として訳した。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-030"
      "description_ja": "この姿の詩の『欺太歲』は、太歳の神威をもしのぐほど恐ろしいという誇張と解した。王の詩で賽太歳を略して呼んだ太歳とは、同じ表記でも参照先を分ける。賽太歳という名との言葉の重なりは残る。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-032"
      "description_ja": "原文の武具を一つずつ残した。月鏟は三日月形の鏟、簡は文書でなく打撃武器、鞭もここでは棒状の武器と解す。鉄蒺藜・窩槌・神弾は細かな形や仕組みを確定しない。『鉋』は火器の炮に相当する可能性があるが、底本の字をそのまま用いた。珍字の䩺も保持し、確証のない装具の形は加えなかった。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-037"
      "description_ja": "三折肱は、腕を三度折るほど経験を積めば良医になるという故事に由来する言い回し。ここでは悟空自身が医術の腕を誇っている。王の病と治療の話は物語中の医療観であり、現代医学上の診断・治療効果を保証する記述ではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-040"
      "description_ja": "原文の『血食』は肉を食べることをいう語で、獣たちの粗野な暮らしを強調する発言である。血の字を落とさず訳したが、調理方法や生食の有無までは断定しない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-040"
      "description_ja": "底本の肉の列挙にある珍字を保持した。康熙字典の電子翻刻では『邦加切、音巴、本又作豝』とされるため、豕の類に関わる字と考えられる。ただしここでの種・雌雄・加工の有無は確定しない。日本語の『は』は字書の音巴と日本語の巴の音から推定した読みであり、日本語仮名を直接示す資料で確認したものではない。 本文の欠落ではなく、解釈・校訂上の説明または留保。"
    - "source_id": "wikisource-xiyou-ch70-1455619"
      "segment_ids":
        - "xy-ch70-041"
      "description_ja": "直前の原文は『徑離洞府』だが、ここで悟空が着くのは洞内の剝皮亭である。そのため『洞の外へ向かう』と方向を表す訳にした。洞窟の外へ出終わったとする訳にはせず、底本の位置関係の不整合はこの注で明示する。 本文の欠落ではなく、解釈・校訂上の説明または留保。"

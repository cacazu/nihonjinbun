  - "id": "xy-ch70-002"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那孫行者抖擻神威，持著鐵棒，踏祥光，起在空中，迎面喝道：「你是那裡來的邪魔？待往何方猖獗？」那怪物厲聲高叫道：「吾黨不是別人，乃麒麟山獬豸洞賽太歲大王爺爺部下先鋒，今奉大王令，到此取宮女二名，伏侍金聖娘娘。你是何人，敢來問我？」行者道：「吾乃齊天大聖孫悟空，因保東土唐僧西天拜佛，路過此國，知你這夥邪魔欺主，特展雄才，治國祛邪。正沒處尋你，卻來此送命。」那怪聞言，不知好歹，展長槍就刺行者；行者舉鐵棒劈面相迎。在半空裡這一場好殺："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      さて、悟空（ごくう）は神威を奮い起こし、鉄棒を手に、瑞光を踏んで空へ上がると、正面から一喝した。
      悟空「どこから来た邪魔だ。どこへ暴れに行くつもりだ！」
      妖怪は鋭い声で叫んだ。
      妖怪「俺はほかでもない、麒麟山（きりんざん）の獬豸洞（かいちどう）におわす賽太歳（さいたいさい）大王さま配下の先鋒だ。今、大王の命を受け、金聖宮（きんせいきゅう）さまに仕える宮女二人を受け取りに来た。お前は何者だ。よくも俺を問いただすな！」
      悟空「俺は斉天大聖（せいてんたいせい）、孫悟空（そんごくう）だ。東土（とうど）の唐僧（とうそう）を守って西天（さいてん）へ仏を拝みに行く途中、この国を通り、お前たち邪魔の一味が王を虐げていると知った。そこで、この腕を振るって国を治め、邪悪を払いに来たのだ。ちょうど捜す当てもなかったところへ、お前から命を捨てに来たな！」
      先鋒はその言葉を聞いても力量の違いが分からず、長槍を突き出して悟空を刺しにかかった。悟空は鉄棒を振り上げ、顔めがけて打ち迎える。空中で繰り広げられた、見事な戦いとは。
    "translation_status": "reviewed"
  - "id": "xy-ch70-003"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      棍是龍宮鎮海珍，槍乃人間轉煉鐵。
      凡兵怎敢比仙兵，擦著些兒神氣泄。
      大聖原來太乙仙，妖精本是邪魔孽。
      鬼祟焉能近正人，一正之時邪就滅。
      那個弄風播土諕皇王，這個踏霧騰雲遮日月。
      丟開架子賭輸贏，無能誰敢誇豪傑！
      還是齊天大聖能，乒乓一棍槍先折。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 124
        "line_end": 130
    "translation_ja": |-
      棒は竜宮（りゅうぐう）で海を鎮めた宝、槍は人の世で鍛え上げた鉄。
      凡俗の武器が仙人の武器にどうして並べよう。かすっただけで神気も失せる。
      大聖（たいせい）はもとより太乙（たいいつ）の仙人、妖怪はそもそも邪魔の悪しき子。
      物の怪が正しい者へどうして近づけよう。正しさが立てば邪は滅ぶ。
      あちらは風を操り土を巻き、王を脅かす。こちらは霧を踏み雲に乗り、日月を覆う。
      技を繰り出して勝負を争う。力もないのに、誰が豪傑を名乗れよう。
      やはり斉天大聖の腕が勝る。がつんと一撃、まず槍が折れた。
    "translation_status": "reviewed"
  - "id": "xy-ch70-004"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖精被行者一鐵棒把根槍打做兩截，慌得顧性命，撥轉風頭，徑往西方敗走。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 132
        "line_end": 132
    "translation_ja": "先鋒は悟空の鉄棒の一撃で槍を二つに折られ、命が危ないと慌てて風の向きを変え、そのまま西へ敗走した。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-005"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者且不趕他，按下雲頭，來至避妖樓地穴之外，叫道：「師父，請同陛下出來，怪物已趕去矣。」那唐僧才扶著君王，同出穴外。見滿天清朗，更無妖邪之氣。那皇帝即至酒席前，自己拿壺把盞，滿斟金杯，奉與行者道：「神僧，權謝，權謝。」這行者接杯在手，還未回言，只聽得朝門外有官來報：「西門上火起了。」行者聞說，將金杯連酒望空一撇，噹的一聲響喨，那個金杯落地。君王著了忙，躬身施禮道：「神僧，恕罪，恕罪，是寡人不是了。禮當請上殿拜謝，只因有這方便酒在此，故就奉耳。神僧卻把杯子撇了，卻不是有見怪之意？」行者笑道：「不是這話，不是這話。」少頃間，又有官來報：「好雨呀，才西門上起火，被一場大雨，把火滅了。滿街上流水，盡都是酒氣。」行者又笑道：「陛下，你見我撇杯，疑有見怪之意，非也。那妖敗走西方，我不曾趕他，他就放起火來。這一杯酒，卻是我滅了妖火，救了西城裡外人家，豈有他意？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      悟空はひとまず追わず、雲を降ろして避妖楼（ひようろう）の地下穴の外へ来ると、声をかけた。
      悟空「お師匠さま、陛下と一緒に出てきてください。妖怪はもう追い払いました。」
      そこで三蔵（さんぞう）は王を支え、一緒に穴の外へ出た。見れば空は隅々まで晴れ渡り、妖気はもうどこにもない。国王はすぐ酒席の前へ行き、自分で酒壺と杯を持ち、金杯になみなみと注いで悟空へ差し出した。
      国王「神僧、まずはこれでお礼を。どうか、お受けくだされ。」
      悟空が杯を受け取り、まだ返事をしないうち、朝門（ちょうもん）の外から官が知らせに来た。
      官「西門で火が起こりました！」
      悟空は聞くなり、酒ごと金杯を空へ投げた。からん、と響いて金杯が地に落ちる。王は慌て、身をかがめて礼をした。
      国王「神僧、お許しくだされ、お許しくだされ。余が悪かった。本来なら殿上へお招きして拝礼し、お礼を申し上げるべきところ、手近にこの酒があったため、そのまま差し上げたのです。杯をお投げになったのは、お腹立ちのしるしではありませんか。」
      悟空は笑った。
      悟空「そうではありません、そうではありません。」
      しばらくすると、また別の官が知らせに来た。
      別の官「ありがたい雨です！　先ほど西門で起きた火は、大雨が降って消えました。通りじゅうを水が流れ、どれも酒の匂いがいたします。」
      悟空はまた笑った。
      悟空「陛下、杯を投げたのをご覧になって怒ったのかと思われたのでしょうが、違います。あの妖怪は西へ逃げ、私が追わなかったので火を放ったのです。この一杯の酒で妖火を消し、西の城門の内外に住む人々を救ったのですよ。ほかの意味などありません。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-006"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "國王更十分歡喜加敬。即請三藏四眾，同上寶殿，就有推位讓國之意。行者笑道：「陛下，才那妖精，他稱是賽太歲部下先鋒，來此取宮女的。他如今戰敗而回，定然報與那廝，那廝定要來與我相爭。我恐他一時興師帥眾，未免又驚傷百姓，恐諕陛下，欲去迎他一迎，就在那半空中擒了他，取回聖后。但不知向那方去？這裡到他那山洞有多少遠近？」國王道：「寡人曾差夜不收軍馬到那裡探聽聲息，往來要行五十餘日。坐落南方，約有三千餘里。」行者聞言，叫：「八戒、沙僧護持在此，老孫去來。」國王扯住道：「神僧且從容一日，待安排些乾糧烘炒，與你些盤纏銀兩，選一匹快馬，方才可去。」行者笑道：「陛下說得是巴山轉嶺步行之話。我老孫不瞞你說，似這三千里路，斟酒在鍾不冷，就打個往回。」國王道：「神僧，你不要怪我說，你這尊貌，卻像個猿猴一般，怎生有這等法力會走路也？」行者道："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      国王はいっそう喜び、ますます敬って、三蔵たち四人を宝殿へ招いた。王位を譲り、国を明け渡そうとする気持ちである。悟空は笑って言った。
      悟空「陛下、先ほどの妖怪は賽太歳の先鋒と名乗り、宮女を受け取りに来たのです。負けて帰れば、きっとあいつに報告し、あいつは私と争いに来るでしょう。兵を起こして大勢を率いて来たら、また民を傷つけ、陛下を驚かせかねません。こちらから迎えに行き、空中で捕らえ、お妃さまを取り戻したいのです。どちらへ行けばよいでしょう。ここからあの山の洞窟まで、どのくらいありますか。」
      国王「余は以前、夜不収（やふしゅう）の兵を偵察に出しましたが、往復に五十日余りかかります。南にあり、およそ三千里（り）余りです。」
      悟空はそれを聞いて命じた。
      悟空「八戒（はっかい）、沙悟浄（さごじょう）、ここを守っていろ。俺は行ってくる。」
      国王は悟空を引き止めた。
      国王「神僧、一日ゆっくりなされ。干し飯や炒り物を用意し、旅費の銀を差し上げ、速い馬を一頭選んでから、お出かけくだされ。」
      悟空は笑った。
      悟空「陛下のお話は、山を登り、尾根を越えて歩く者の場合です。隠さず申しますが、三千里くらいなら、杯に注いだ酒が冷めないうちに往復できます。」
      国王「神僧、こんなことを申しても怒らないでくだされ。そのお姿は猿に似ておりますのに、どうしてそれほどの法力があり、道を速く行けるのですか。」
      悟空は答えた。
    "translation_status": "reviewed"
  - "id": "xy-ch70-007"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      「我身雖是猿猴數，自幼打開生死路。
      遍訪明師把道傳，山前修煉無朝暮。
      倚天為頂地為爐，兩般藥物團烏兔。
      採取陰陽水火交，時間頓把玄關悟。
      全仗天罡搬運功，也憑斗柄遷移步。
      退爐進火最依時，抽鉛添汞相交顧。
      攢簇五行造化生，合和四象分時度。
      二氣歸於黃道間，三家會在金丹路。
      悟通法律歸四肢，本來觔斗如神助。
      一縱縱過太行山，一打打過凌雲渡。
      何愁峻嶺幾千重，不怕長江百十數。
      只因變化沒遮攔，一打十萬八千路！」
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 135
        "line_end": 146
    "translation_ja": |-
      悟空「この身は猿の仲間だが、幼い時から生死の道を切り開いた。
      優れた師をあまねく訪ね、道を授かり、山の前で朝夕を忘れて修行した。
      天を頂き、地を炉とし、二種の薬で烏兎（うと）を一つに丸める。
      陰陽（いんよう）を採って水火を交わらせ、たちまち玄関（げんかん）の奥義を悟った。
      ひとえに天罡（てんこう）の運行の功に頼り、斗柄（とへい）が移る歩みにも従う。
      炉を退け火を進めるには時を守り、鉛（えん）を抜き水銀を添え、互いに調える。
      五行（ごぎょう）を一つに集めれば造化（ぞうか）が生まれ、四象（ししょう）を和合し、時と度を分ける。
      二気は黄道（こうどう）の間へ帰り、三家（さんか）は金丹（きんたん）の道で会する。
      術の法を悟って四肢へ通せば、もとの宙返りも神が助けるよう。
      ひと跳びで太行山（たいこうざん）を越え、ひと回りで凌雲渡（りょううんと）を越える。
      険しい峰が幾千重あろうと気にせず、長江（ちょうこう）が百も十もあろうと恐れない。
      変化の術には何の妨げもなく、ひと回りで十万八千里だ！」
    "translation_status": "reviewed"
  - "id": "xy-ch70-008"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那國王見說，又驚又喜，笑吟吟捧著一杯御酒遞與行者道：「神僧遠勞，進此一杯引意。」這大聖一心要去降妖，那裡有心吃酒，只叫：「且放下，等我去了回來再飲。」好行者，說聲去，唿哨一聲，寂然不見。那一國君臣，皆驚訝不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      国王はそれを聞き、驚くやら喜ぶやら。にこにこと御酒（ぎょしゅ）を一杯捧げ、悟空へ渡した。
      国王「神僧、遠くまでご足労をかけます。心ばかりに、この一杯を。」
      悟空は妖怪を降すことに心が向かい、酒を飲む気などない。ただ声を上げた。
      悟空「そこへ置いておいてください。行って帰ってから飲みましょう。」
      さすが悟空、「行くぞ」と言い、ひゅっと一声上げると、音もなく姿を消した。国じゅうの君臣が驚いたことは、ひとまず措く。
    "translation_status": "reviewed"
  - "id": "xy-ch70-009"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說行者將身一縱，早見一座高山阻住霧角。即按雲頭，立在那巔峰之上，仔細觀看，好山："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 150
        "line_end": 150
    "translation_ja": "さて、悟空が身を躍らせると、たちまち高い山が雲霧の行く手を遮った。すぐに雲を降ろしてその頂に立ち、よくよく眺める。見事な山である。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-010"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "沖天占地，礙日生雲。沖天處，尖峰矗矗；占地處，遠脈迢迢。礙日的，乃嶺頭松鬱鬱，生雲的，乃崖下石磷磷。松鬱鬱，四時八節常青；石磷磷，萬載千年不改。林中每聽夜猿啼，澗內常聞妖蟒過。山禽聲咽咽，山獸吼呼呼。山獐山鹿，成雙作對紛紛走；山鴉山鵲，打陣攢群密密飛。山草山花看不盡，山桃山果映時新。雖然倚險不堪行，卻是妖仙隱逸處。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 151
        "line_end": 151
    "translation_ja": |-
      天を突き、地に広がり、日を遮って雲を生む。
      天を突く所には尖った峰がそびえ、地に広がる所には遠い山脈が続く。
      日を遮るのは尾根に茂る松、雲を生むのは崖下に重なる岩。
      青々とした松は四季八節（はっせつ）いつも緑、重なる岩は千年万年変わらない。
      林では夜の猿の声をしばしば聞き、谷では大蛇の通る気配をいつも聞く。
      山鳥はむせぶように鳴き、山の獣はごうごうと吠える。
      山のキバノロや鹿は、二頭ずつつがってあちこち走り、山の烏や鵲（かささぎ）は、陣をなし群れを集めてびっしり飛ぶ。
      山の草や花は見尽くせず、山桃や山の実は季節ごとに鮮やかに映える。
      険しい地形に阻まれて進めなくとも、ここはまさしく妖仙（ようせん）が隠れ住む所。
    "translation_status": "reviewed"
  - "id": "xy-ch70-011"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這大聖看看不厭，正欲找尋洞口，只見那山凹裡烘烘火光飛出，霎時間，撲天紅焰，紅焰之中冒出一股惡煙，比火更毒。好煙！但見那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 153
        "line_end": 153
    "translation_ja": "悟空は見飽きることもなく、洞の口を捜そうとした。すると山の窪みから、轟々と火の光が飛び出す。あっという間に赤い炎が天を覆い、その炎の中から、火よりもなお有害な煙が噴き上がった。なんという煙か。見れば。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-012"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": "火光迸萬點金燈，火焰飛千條紅虹。那煙不是灶筩煙，不是草木煙，煙卻有五色：青紅白黑黃。燻著南天門外柱，燎著靈霄殿上梁。燒得那窩中走獸連皮爛，林內飛禽羽盡光。但看這煙如此惡，怎入深山伏怪王？"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      火の光は万点の金の灯となって弾け、炎は千筋の赤い虹となって飛ぶ。
      その煙は竈の煙突の煙ではなく、草木の煙でもない。青・赤・白・黒・黄の五色の煙。
      南天門（なんてんもん）の外の柱を燻し、霊霄殿（れいしょうでん）の上の梁を焦がす。
      巣の獣は皮ごと焼けただれ、林の鳥は羽をすべて焼き尽くされる。
      見よ、この煙の恐ろしさ。どうやって深山へ入り、妖怪の王を降せよう。
    "translation_status": "reviewed"
  - "id": "xy-ch70-013"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "孫大聖正自恐懼，又見那山中迸出一道沙來。好沙，真個是遮天蔽日！你看："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 157
        "line_end": 157
    "translation_ja": "悟空がちょうど恐れを感じていると、今度は山から砂がひと筋噴き出した。すさまじい砂で、本当に天を覆い、日を隠す。ご覧あれ。"
    "translation_status": "reviewed"
  - "id": "xy-ch70-014"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      紛紛絯絯遍天涯，鄧鄧渾渾大地遮。
      細塵到處迷人目，粗灰滿谷滾芝麻。
      採藥仙僮迷失伴，打柴樵子沒尋家。
      手中就有明珠現，時間刮得眼生花。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 159
        "line_end": 162
    "translation_ja": |-
      乱れに乱れて天の果てまで満ち、濁りに濁って大地を覆う。
      細かな塵は至る所で目を塞ぎ、粗い灰は谷いっぱいに胡麻のように転がる。
      薬草を摘む仙童（せんどう）は連れを見失い、薪を切る木こりは家も見つけられない。
      手に輝く玉があったとしても、吹きつけられればたちまち目がくらむ。
    "translation_status": "reviewed"
  - "id": "xy-ch70-015"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "這行者只顧看玩，不覺沙灰飛入鼻內，癢斯斯的，打了兩個噴嚏。即回頭，伸手在岩下摸了兩個鵝卵石，塞住鼻子。搖身一變，變做一個攢火的鷂子，飛入煙火中間，驀了幾驀，卻就沒了沙灰，煙火也息了。急現本像下來，又看時，只聽得丁丁東東的一個銅鑼聲響。卻道：「我走錯了路也，這裡不是妖精住處。鑼聲似鋪兵之鑼，想是通國的大路，有鋪兵去下文書。且等老孫去問他一問。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      悟空は見物に気を取られ、知らぬ間に砂や灰が鼻へ入り、むずむずして二度くしゃみをした。そこで振り向き、岩の下へ手を伸ばして丸い小石を二つ拾い、鼻を塞いだ。身を振るって火へ飛び込む鷂（はいたか）に変わり、煙と火の中へ飛び入って何度か突き進むと、砂も灰もなくなり、煙と火も収まった。急いで元の姿へ戻って降り、また様子を見ていると、ちんちん、どんどんと銅鑼（どら）の音がする。
      悟空「道を間違えたぞ。ここは妖怪の住む所ではないらしい。あの音は駅伝の兵の銅鑼のようだ。きっと国へ通じる街道で、兵が文書を届けに行くのだろう。ひとつ、俺が尋ねてみよう。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-016"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正走處，忽見似個小妖兒，擔著黃旗，背著文書，敲著鑼兒，急走如飛而來。行者笑道：「原來是這廝打鑼。他不知送的是甚麼書信？等我聽他一聽。」好大聖，搖身一變，變做個猛蟲兒，輕輕的飛在他書包之上。只聽得那妖精敲著鑼，緒緒聒聒的自念自誦道：「我家大王忒也心毒。三年前到朱紫國強奪了金聖皇后，一向無緣，未得沾身，只苦了要來的宮女頂缸。兩個來弄殺了，四個來也弄殺了。前年要了，去年又要，今年又要，如今還要。卻撞個對頭來了，那個要宮女的先鋒被個甚麼孫行者打敗了，不發宮女。我大王因此發怒，要與他國爭持，教我去下甚麼戰書。這一去，那國王不戰則可，戰必不利。我大王使煙火飛沙，那國王君臣百姓等，莫想一個得活。那時我等占了他的城池，大王稱帝，我等稱臣。雖然也有個大小官爵，只是天理難容也。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      歩いていくと、ふいに小妖怪らしい者が現れた。黄色い旗を担ぎ、文書を背負い、銅鑼を鳴らしながら飛ぶように駆けてくる。悟空は笑った。
      悟空「銅鑼を鳴らしていたのは、こいつか。何の手紙を運んでいるんだろう。話を聞いてみよう。」
      悟空は身を振るって小さな羽虫に変わり、そっと文書袋の上へ飛んだ。小妖怪は銅鑼を鳴らしながら、くどくどと独り言を言っている。
      小妖怪「うちの大王は、あんまりにも腹が黒い。三年前、朱紫国（しゅしこく）へ行って金聖宮さまを無理に奪ってきたが、ずっと縁がなく、その体に触れられない。代わりにひどい目に遭うのは、要求して連れてこさせた宮女たちだけだ。二人来ればもてあそんで殺し、四人来てもまた殺した。一昨年も要求し、去年も要求し、今年も要求して、今また欲しがる。ところが、手ごわい敵にぶつかった。宮女を取りに行った先鋒が、何とかいう孫行者（そんぎょうじゃ）に負かされて、宮女を渡してもらえなかったのだ。それで大王が怒り、あの国と争うと言い出し、俺に戦書だか何だかを届けさせる。この先、あの王は戦わなければまだしも、戦えば必ず負ける。大王が煙と火と飛砂を使えば、王も臣下も民も、一人だって生き残れない。その時は俺たちがあの城を乗っ取り、大王は皇帝に、俺たちは臣下になる。大なり小なり官爵はもらえるだろうが、これでは天の道が許さない。」
    "translation_status": "reviewed"
  - "id": "xy-ch70-017"
    "section_id": "chapter-70"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者聽了，暗喜道：「妖精也有存心好的。似他後邊這兩句話，說『天理難容』，卻不是個好的？但只說金聖皇后一向無緣，未得沾身，此話卻不解其意。等我問他一問。」嚶的一聲，一翅飛離了妖精，轉向前路，有十數里地，搖身一變，又變做一個道童："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      悟空はそれを聞き、内心喜んだ。
      悟空「妖怪にも、心根のよいのがいるものだ。最後に『天の道が許さない』と言ったじゃないか。善い奴ではないか。ただ、金聖宮とはずっと縁がなく、体に触れられないというのは、どういうことだろう。ひとつ尋ねてみよう。」
      ぶん、と羽ばたいて小妖怪から離れ、十数里先の道へ回り、身を振るって今度は道教の童子に変わった。
    "translation_status": "reviewed"
  - "id": "xy-ch70-018"
    "section_id": "chapter-70"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      頭挽雙丫髻，身穿百衲衣。
      手敲魚鼓簡，口唱道情詞。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch70-1455619"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第070回&oldid=1455619"
        "line_start": 168
        "line_end": 169
    "translation_ja": |-
      頭には二つに分けた髷、身には継ぎだらけの百衲衣（ひゃくのうえ）。
      手で魚鼓（ぎょこ）と簡板（かんばん）を打ち、口では道情（どうじょう）の歌を歌う。

  "translation_ja": |-
    第五十四回
    仏の本性は西へ来て女の国に出会い、心の猿は計略を定めて色香の網を抜ける
  "translation_status": "reviewed"
- "id": "xy-ch54-002"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "話說三藏師徒別了村舍人家，依路西進，不上三四十里，早到西梁國界。唐僧在馬上指道：「悟空，前面城池相近，市井上人語喧嘩，想是西梁女國。汝等須要仔細，謹慎規矩，切休放蕩情懷，紊亂法門教旨。」三人聞言，謹遵嚴命。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 119
    "line_end": 119
  "translation_ja": |-
    さて、三蔵（さんぞう）たちは村の家に別れを告げ、道に沿って西へ進んだ。三、四十里（り）も行かぬうちに、西梁国（せいりょうこく）の境へ着いた。三蔵は馬上から前を指した。
    三蔵「悟空（ごくう）、前方の城が近くなり、市では人の声がにぎやかだ。西梁女国（せいりょうじょこく）なのだろう。お前たちはよく気をつけ、礼儀を慎んで守りなさい。決して心を放縦にし、仏門の教えを乱してはならぬ。」
    三人はそれを聞き、厳しい言いつけを謹んで守った。
  "translation_status": "reviewed"
- "id": "xy-ch54-003"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "言未盡，卻至東關廂街口。那裡人都是長裙短襖，粉面油頭，不分老少，盡是婦女。正在兩街上做買做賣，忽見他四眾來時，一齊都鼓掌呵呵，整容歡笑道：「人種來了，人種來了。」慌得那三藏勒馬難行。須臾間就塞滿街道，惟聞笑語。八戒口裡亂嚷道：「我是個銷豬，我是個銷豬。」行者道：「獃子，莫胡談，拿出舊嘴臉便是。」八戒真個把頭搖上兩搖，豎起一雙蒲扇耳，扭動蓮蓬吊搭唇，發一聲喊，把那些婦女們諕得跌跌爬爬。有詩為證。詩曰："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 120
    "line_end": 120
  "translation_ja": |-
    言い終わらぬうちに、東の城外町の通り口へ来た。そこにいるのは皆、長い裳に短い上着、白粉を塗った顔に油で整えた髪で、老いも若きも女ばかりだった。二筋の通りで商売をしていた女たちは、四人がやって来たのを見ると、一斉に手をたたき、ほほと笑い、身なりを整えながら歓声を上げた。
    女たち「子種の男が来た、子種の男が来た！」
    三蔵は慌てて馬を引き止め、進めなくなった。たちまち道は人で埋まり、笑い声ばかりが響いた。八戒（はっかい）はむやみに叫んだ。
    八戒「俺は銷猪（しょうちょ）だぞ、銷猪なんだぞ！」
    悟空「ばか、でたらめを言うな。もとの顔を見せればいい。」
    八戒は本当に頭を二度振り、蒲の団扇のような両耳を立て、蓮の実の房のような垂れ唇をねじり、一声叫んだ。女たちは肝をつぶし、転びつまろび逃げだした。これを証する詩がある。
  "translation_status": "reviewed"

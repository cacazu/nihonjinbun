  "kind": "verse"
  "origin": "source"
  "source_text": |-
    聖僧拜佛到西梁，國內衠陰世少陽。
    農士工商皆女輩，漁樵耕牧盡紅妝。
    嬌娥滿路呼人種，幼婦盈街接粉郎。
    不是悟能施醜相，煙花圍困苦難當！
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 122
    "line_end": 125
  "translation_ja": |-
    聖なる僧は仏を拝みに西梁（せいりょう）へ来る、国じゅう陰ばかりで陽はめったに見られない。
    農民も学者も職人も商人も女、漁師も木こりも耕す者も牧人も紅の装い。
    美しい女が道に満ちて子種の男を呼び、若妻が通りにあふれて色白の男を迎える。
    悟能（ごのう）が醜い顔を見せなかったなら、色香に取り囲まれ、苦しみは耐えがたかったろう！
  "translation_status": "reviewed"
- "id": "xy-ch54-005"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "遂此眾皆恐懼，不敢上前。一個個都捻手矬腰，搖頭咬指，戰戰兢兢，排塞街傍路下，都看唐僧。孫大聖卻也弄出醜相開路；沙僧也裝\U0002192B虎維持；八戒採著馬，掬著嘴，擺著耳朵。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 127
    "line_end": 127
  "translation_ja": "こうして女たちは皆おびえ、近づこうとしなくなった。一人一人が手を握り合わせ、腰をかがめ、頭を振って指をかみ、おそるおそる道端を埋めて、三蔵を見つめていた。悟空も恐ろしい顔をして道を開き、沙悟浄（さごじょう）も「\U0002192B虎（かこ）」という恐ろしい姿をまねて周りを抑えた。八戒は馬を引き、口を突き出して耳を振っていた。"
  "translation_status": "reviewed"
- "id": "xy-ch54-006"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一行前進，又見那市井上房屋齊整，鋪面軒昂，一般有賣鹽賣米，酒肆茶房；鼓角樓臺通貨殖，旗亭候館掛簾櫳。師徒們轉彎抹角，忽見有一女官侍立街下，高聲叫道：「遠來的使客，不可擅入城門。請投館驛，註名上簿，待下官執名奏駕，驗引放行。」三藏聞言下馬，觀看那衙門上有一匾，上書「迎陽驛」三字。長老道：「悟空，那村舍人家傳言是實，果有迎陽之驛。」沙僧笑道：「二哥，你卻去照胎泉邊照照，看可有雙影？」八戒道：「莫弄我。我自吃了那盞兒落胎泉水，已此打下胎來了，還照他怎的？」三藏回頭吩咐道：「悟能，謹言，謹言。」遂上前與那女官作禮。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 128
    "line_end": 128
  "translation_ja": |-
    一行が進むと、市の家並みは整い、店先は高々として、ほかの土地と同じく塩や米を売る店も、酒屋や茶店もあった。太鼓や角笛の響く楼台のもとで品々が行き交い、旗を掲げた酒楼や旅の宿にはすだれが掛かる。師弟がいくつも角を曲がっていくと、一人の女官が通りに立ち、大声で呼び止めた。
    女官「遠方からのお使者さま、勝手に城門へお入りになってはなりません。宿駅へおいでになり、お名前を帳面にお記しください。私がその名を王に申し上げ、通行証を確かめてからお通しいたします。」
    三蔵はそれを聞いて馬を下り、役所の額を見ると、「迎陽駅（げいようえき）」の三文字が書いてあった。
    三蔵「悟空、あの村の家の人が言ったとおりだ。本当に迎陽の駅がある。」
    沙悟浄は笑った。
    沙悟浄「二番目の兄さん、照胎泉（しょうたいせん）へ行って映してみたらどうです。影が二重になっていませんか。」
    八戒「からかうな。あの落胎泉（らくたいせん）の水を一杯飲んで、もう胎児は下りたんだ。まだ映してどうする。」
    三蔵は振り返って戒めた。
    三蔵「悟能、言葉を慎め、慎め。」
    そして前へ進み、女官と礼を交わした。
  "translation_status": "reviewed"
- "id": "xy-ch54-007"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "女官引路，請他們都進驛內，正廳坐下，即喚看茶。又見那手下人盡是三綹梳頭，兩截穿衣之類。你看他拿茶的也笑。少頃，茶罷。女官欠身問曰：「使客何來？」行者道：「我等乃東土大唐王駕下欽差上西天拜佛求經者。我師父便是唐王御弟，號曰唐三藏。我乃他大徒弟孫悟空。這兩個是我師弟豬悟能、沙悟淨。一行連馬五口。隨身有通關文牒，乞為照驗放行。」那女官執筆寫罷，下來叩頭道：「老爺恕罪。下官乃迎陽驛驛丞，實不知上邦老爺，知當遠接。」拜畢起身，即令管事的安排飲饌。道：「爺爺們寬坐一時，待下官進城啟奏我王，倒換關文，打發領給，送老爺們西進。」三藏欣然而坐不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 129
    "line_end": 129
  "translation_ja": |-
    女官は先に立ち、皆を宿駅へ招き入れ、正面の広間へ座らせて、すぐ茶を命じた。配下の者も皆、髪を三房に分けて結い、上衣と裳を着た女たちだった。見れば、茶を持ってくる者も笑っている。やがて茶が済むと、女官は腰を浮かせて尋ねた。
    女官「お使者さまは、どちらからおいでですか。」
    悟空「私たちは東土（とうど）の大唐（だいとう）の王より勅命を受け、西天へ仏を拝み経を求めに参る者です。師は唐王（とうおう）の御弟（ぎょてい）で、唐三蔵（とうさんぞう）と申します。私はその一番弟子、孫悟空（そんごくう）。この二人は弟弟子の猪悟能（ちょごのう）と沙悟浄です。馬を含めて五口の一行で、通関文牒（つうかんもんちょう）を携えております。どうかご確認のうえ、お通しください。」
    女官は筆で書き終えると、下座へ降りて額ずいた。
    女官「どうかお許しくださいませ。私は迎陽駅の駅丞（えきじょう）でございます。大国のお方とは存じませんでした。知っておりましたら、遠くまでお迎えに上がるところでした。」
    礼を終えて立つと、すぐ係の者に食事を調えさせた。
    駅丞「皆さま、しばらくおくつろぎください。私は城へ入り、わが王に申し上げ、通行文書の書き換えと旅の支給品を整えて、皆さまを西へお送りいたします。」
    三蔵は喜んで腰を落ち着けた。この話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch54-008"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且說那驛丞整了衣冠，徑入城中五鳳樓前，對黃門官道：「我是迎陽館驛丞，有事見駕。」黃門即時啟奏。降旨傳宣至殿，問曰：「驛丞有何事來奏？」驛丞道：「微臣在驛，接得東土大唐王御弟唐三藏，有三個徒弟，名喚孫悟空、豬悟能、沙悟淨，連馬五口，欲上西天拜佛取經。特來啟奏主公，可許他倒換關文放行？」女王聞奏，滿心歡喜，對眾文武道：「寡人夜來夢見金屏生彩艷，玉鏡展光明，乃是今日之喜兆也。」眾女官擁拜丹墀道：「主公，怎見得是今日之喜兆？」女王道：「東土男人，乃唐朝御弟。我國中自混沌開闢之時，累代帝王，更不曾見個男人至此。幸今唐王御弟下降，想是天賜來的。寡人以一國之富，願招御弟為王，我願為后，與他陰陽配合，生子生孫，永傳帝業，卻不是今日之喜兆也？」眾女官拜舞稱揚，無不歡悅。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 130
    "line_end": 130
  "translation_ja": |-
    さて、駅丞は衣冠を整え、まっすぐ城内の五鳳楼（ごほうろう）の前へ行き、黄門官（こうもんかん）に告げた。
    駅丞「私は迎陽館（げいようかん）の駅丞です。お目通りして申し上げたいことがございます。」
    黄門官はただちに奏上した。勅命によって駅丞は殿上へ呼び入れられ、王が尋ねた。
    王「駅丞、何を奏上しに来たのです。」
    駅丞「宿駅に、東土大唐の王の御弟、唐三蔵をお迎えいたしました。孫悟空、猪悟能、沙悟浄という三人の弟子を伴い、馬を含め五口で、西天へ仏を拝み経を取りに向かわれるとのこと。それで陛下に申し上げに参りました。通行文書を書き換え、お通ししてよろしいでしょうか。」
    女王は聞くと心から喜び、文武の官人たちに言った。
    女王「私は昨夜、金の屏風が美しい彩りを放ち、玉の鏡が明るく輝く夢を見ました。今日の喜びを告げる吉兆だったのです。」
    女官たちは朱塗りの階の前へ集まって拝礼した。
    女官たち「陛下、どうして今日の喜びを告げる吉兆だとお分かりになりますか。」
    女王「東土の男、それも唐の帝の御弟です。わが国では、混沌が開かれた時から代々の王を経て、ここまでやって来た男は一人も見たことがありません。幸いにも今、唐王の御弟がおいでになった。天が授けてくださった方なのでしょう。私は一国の富をもって御弟を王に迎え、みずから后となりたい。あの方と陰陽を合わせ、子を産み、孫を生み、王朝を永遠に伝えるのです。これが今日の吉兆でなくて何でしょう。」
    女官たちは拝礼して舞い、ほめたたえ、喜ばぬ者はなかった。
  "translation_status": "reviewed"
- "id": "xy-ch54-009"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "驛丞又奏道：「主公之論，乃萬代傳家之好。但只是御弟三徒兇惡，不成相貌。」女王道：「卿見御弟怎生模樣？他徒弟怎生兇醜？」驛丞道：「御弟相貌堂堂，丰姿英俊，誠是天朝上國之男兒，南贍中華之人物。那三徒卻是形容獰惡，相貌如精。」女王道：「既如此，把他徒弟與他領給，倒換關文，打發他往西天，只留下御弟，有何不可？」眾官拜奏道：「主公之言極當，臣等欽此欽遵。但只是匹配之事，無媒不可。自古道：『姻緣配合憑紅葉，月老夫妻繫赤繩。』」女王道：「依卿所奏，就著當駕太師作媒，迎陽驛丞主婚，先去驛中與御弟求親。待他許可，寡人卻擺駕出城迎接。」那太師、驛丞領旨出朝。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 131
    "line_end": 131
  "translation_ja": |-
    駅丞はさらに奏上した。
    駅丞「陛下のお考えは、万代まで王家を伝えるよいお話でございます。ただ、御弟さまの三人の弟子は恐ろしげで、まともな容貌ではありません。」
    女王「御弟はどのようなお姿でした。弟子たちはどれほど恐ろしく醜いのです。」
    駅丞「御弟さまは堂々たるお顔立ちで、姿も立派で美しく、まさに天朝大国の男児、南贍（なんせん）の中華の人物です。ですが三人の弟子は、姿がいかめしく、妖怪のような顔をしております。」
    女王「それなら、弟子たちに旅の支給品を与え、通行文書を書き換えて西天へ送り出し、御弟だけを留めればよいのではありませんか。」
    女官たちは拝礼して奏上した。
    女官たち「まことにもっともな仰せです。謹んで承り、そのとおりにいたします。ただ、婚姻には仲人が欠かせません。昔から、『縁結びは紅葉を頼み、月老（げつろう）は夫婦を赤い縄で結ぶ』と申します。」
    女王「その言葉に従いましょう。宮中に仕える太師（たいし）を仲人、迎陽の駅丞を婚礼の取りまとめ役とします。まず宿駅へ行き、御弟に縁談を申し込みなさい。承諾が得られたら、私が車駕を整え、城外へ迎えに出ます。」
    太師と駅丞は命を受け、退出した。
  "translation_status": "reviewed"
- "id": "xy-ch54-010"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說三藏師徒們在驛廳上正享齋飯，只見外面人報：「當駕太師與我們本官老姆來了。」三藏道：「太師來卻是何意？」八戒道：「怕是女王請我們也。」行者道：「不是相請，就是說親。」三藏道：「悟空，假如不放，強逼成親，卻怎麼是好？」行者道：「師父只管允他，老孫自有處治。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 133
    "line_end": 133
  "translation_ja": |-
    さて、三蔵たちは宿駅の広間で精進料理を食べていた。そこへ外から使いの者が告げた。
    使いの者「宮中の太師さまと、こちらの駅丞さまがおいでになりました。」
    三蔵「太師が来るとは、どういう用だろう。」
    八戒「女王が俺たちを招くんじゃありませんか。」
    悟空「招待でなければ、縁談でしょう。」
    三蔵「悟空、もし通してくれず、無理やり結婚させようとしたら、どうすればよいのだ。」
    悟空「お師匠さまは、ただ承諾なさい。私に対処する方法があります。」
  "translation_status": "reviewed"
- "id": "xy-ch54-011"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說不了，二女官早至，對長老下拜。長老一一還禮道：「貧僧出家人，有何德能，敢勞大人下拜？」那太師見長老相貌軒昂，心中暗喜道：「我國中實有造化，這個男子，卻也做得我王之夫。」二官拜畢起來，侍立左右道：「御弟爺爺，萬千之喜了。」三藏道：「我出家人，喜從何來？」太師躬身道：「此處乃西梁女國，國中自來沒個男子。今幸御弟爺爺降臨，臣奉我王旨意，特來求親。」三藏道：「善哉，善哉！我貧僧隻身來到貴地，又無兒女相隨，止有頑徒三個，不知大人求的是那個親事？」驛丞道：「下官才進朝啟奏，我王十分歡喜道，夜來得一吉夢，夢見金屏生彩艷，玉鏡展光明。御弟乃中華上國男兒，我王願以一國之富，招贅御弟爺爺為夫，坐南面稱孤，我王願為帝后。傳旨著太師作媒，下官主婚，故此特來求這親事也。」三藏聞言，低頭不語。太師道：「大丈夫遇時，不可錯過。似此招贅之事，天下雖有，託國之富，世上實稀。請御弟速允，庶好回奏。」長老越加痴啞。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 134
    "line_end": 134
  "translation_ja": |-
    言い終わらぬうちに二人の女官がやって来て、三蔵に拝礼した。三蔵は一人一人に礼を返した。
    三蔵「私は出家の身です。どれほどの徳や力があって、かたじけなくも皆さまに拝礼していただけましょう。」
    太師は三蔵の堂々とした容貌を見て、ひそかに喜んだ。
    太師の心の声「わが国には本当に幸運が訪れた。この男なら、わが王の夫にふさわしい。」
    二人は礼を終えて左右に立った。
    太師と駅丞「御弟さま、幾重にもおめでとうございます。」
    三蔵「私は出家の身。どこにめでたいことがあるのです。」
    太師は身をかがめた。
    太師「ここは西梁女国。昔から国じゅうに男はおりませんでした。今、幸いにも御弟さまがおいでになりましたので、わが王の命を奉じ、縁談を申し込みに参ったのでございます。」
    三蔵「ありがたい、ありがたいことです。しかし私は独りで御国へ参り、息子も娘も連れておらず、不肖の弟子が三人いるだけです。いったい、どなたとの縁談をお求めなのでしょう。」
    駅丞「私が先ほど朝廷へ参って申し上げますと、わが王は大変喜ばれ、昨夜、金の屏風が美しい彩りを放ち、玉の鏡が明るく輝く吉夢を見たと仰せでした。御弟さまは中華大国の男児。わが王は一国の富をもって御弟さまを婿に迎え、南面して帝位にお就きいただき、みずからは后となることを望んでおられます。太師を仲人、私を婚礼の取りまとめ役とするお達しでしたので、そのご縁を求めて、こうして参りました。」
    三蔵はそれを聞くと、うつむいて黙った。
    太師「立派な男子たるもの、好機を逃してはなりません。このように婿に入ることは天下にございますが、一国の富まで託す例は、世にまれでございます。早くお受けいただき、よいお返事を持ち帰らせてください。」
    三蔵はますます呆然として、口をきけなくなった。
  "translation_status": "reviewed"
- "id": "xy-ch54-012"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "八戒在傍，掬著碓挺嘴叫道：「太師，你去上復國王：我師父乃久修得道的羅漢，決不愛你託國之富，也不愛你傾國之容。快些兒倒換關文，打發他往西去，留我在此招贅，如何？」太師聞說，膽戰心驚，不敢回話。驛丞道：「你雖是個男身，但只形容醜陋，不中我王之意。」八戒笑道：「你甚不通變。常言道：『粗柳簸箕細柳斗，世上誰見男兒醜？』」行者道：「獃子，勿得胡談，任師父尊意，可行則行，可止則止。莫要擔閣了媒妁工夫。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 135
    "line_end": 135
  "translation_ja": |-
    八戒はそばで、唐臼の杵のような口を突き出して叫んだ。
    八戒「太師、女王に伝えてくれ。お師匠さまは長年修行して悟りを得た羅漢（らかん）だ。一国の富にも、国を傾けるほどの美貌にも、決して心を引かれない。さっさと通行文書を書き換えて西へ送り出し、代わりに俺を残して婿にしたらどうだ。」
    太師はそれを聞くと肝をつぶし、おびえて返事ができなかった。
    駅丞「あなたは男の身ではありますが、容貌が醜く、わが王のお気に召しません。」
    八戒は笑った。
    八戒「融通の利かない人だな。世に言うじゃないか。『太い柳なら箕に編み、細い柳なら升に編む。男が醜いなどと、世の誰が言うものか』と。」
    悟空「ばか、くだらないことを言うな。お師匠さまのお考えに任せろ。よければ進め、だめならやめる。仲人の手間を邪魔するな。」
  "translation_status": "reviewed"
- "id": "xy-ch54-013"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「悟空，憑你怎麼說好？」行者道：「依老孫說，你在這裡也好。自古道『千里姻緣似線牽』哩，那裡再有這般相應處？」三藏道：「徒弟，我們在這裡貪圖富貴，誰去西天取經？卻不望壞了我大唐之帝主也？」太師道：「御弟在上，微臣不敢隱言。我王旨意，原只教求御弟為親，教你三位徒弟赴了會親筵宴，發付領給，倒換關文，往西天取經去哩。」行者道：「太師說得有理。我等不必作難，情願留下師父，與你主為夫。快換關文，打發我們西去。待取經回來，好到此拜爺娘，討盤纏，回大唐也。」那太師與驛丞對行者作禮道：「多謝老師玉成之恩。」八戒道：「太師，切莫要口裡擺菜碟兒。既然我們許諾，且教你主先安排一席，與我們吃鍾肯酒，如何？」太師道：「有有有，就教擺設筵宴來也。」那驛丞與太師歡天喜地，回奏女主不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 136
    "line_end": 136
  "translation_ja": |-
    三蔵「悟空、お前はどうすればよいと思うのだ。」
    悟空「私に言わせれば、ここにお留まりになるのもよいでしょう。昔から『千里を隔てる縁も糸で結ばれるようなもの』と言います。これほど似合いの縁が、ほかにありますか。」
    三蔵「弟子よ、私たちがここで富貴をむさぼれば、誰が西天へ経を取りに行くのだ。大唐の帝の期待を、台無しにするではないか。」
    太師「御弟さま、私どもは何も隠し立ていたしません。わが王は初めから、御弟さまだけをお相手に求め、三人のお弟子さまには婚礼の顔合わせの宴へお出になった後、旅の支給品を渡し、通行文書を書き換えて、西天へ経を取りにおいでいただくおつもりでした。」
    悟空「太師の言うとおりです。私たちは何も悩むことはない。喜んでお師匠さまを残し、そちらの王の夫になっていただきましょう。早く通行文書を書き換え、私たちを西へお送りください。経を取って帰ったら、ここで父上と母上にご挨拶し、旅費をいただいて大唐へ戻れます。」
    太師と駅丞は悟空に礼をした。
    太師と駅丞「老師さま、お取りまとめくださるご恩に感謝いたします。」
    八戒「太師、口先だけで料理の皿を並べるようなことはよしてくれ。俺たちが承諾したからには、まず女王に一席設けてもらい、縁談成立の肯酒（こうしゅ）を一杯飲ませてもらおうじゃないか。」
    太師「ございますとも。すぐ宴を調えさせましょう。」
    駅丞と太師は大喜びで、女王へ返事を届けに戻った。その話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch54-014"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說唐長老一把扯住行者，罵道：「你這猴頭，弄殺我也，怎麼說出這般話來，教我在此招婚，你們西天拜佛？我就死也不敢如此。」行者道：「師父放心，老孫豈不知你性情，但只是到此地，遇此人，不得不將計就計。」三藏道：「怎麼叫做將計就計？」行者道：「你若使住法兒不允他，他便不肯倒換關文，不放我們走路。倘或意惡心毒，喝令多人，割了你肉，做甚麼香袋啊，我等豈有善報？一定要使出降魔蕩怪的神通，你知我們的手腳又重，器械又兇，但動動手兒，這一國的人，盡打殺了。他雖然阻當我等，卻不是怪物妖精，還是一國人身；你又平素是個好善慈悲的人，在路上一靈不損：若打殺無限的平人，你心何忍，誠為不善了也。」三藏聽說，道：「悟空，此論最善。但恐女主招我進去，要行夫婦之禮，我怎肯喪元陽，敗壞了佛家德行？走真精，墜落了本教人身？」行者道：「今日准了親事，他一定以皇帝禮，擺駕出城接你。你更不要推辭，就坐他鳳輦龍車，登寶殿，面南坐下。問女王取出御寶印信來，宣我們兄弟進朝，把通關文牒用了印，再請女王寫個手字花押，僉押了交付與我們。一壁廂教擺筵宴，就當與女王會喜，就與我們送行。待筵宴已畢，再叫排駕，只說送我們三人出城，回來與女王配合。哄得他君臣歡悅，更無阻擋之心，亦不起毒惡之念。卻待送出城外，你下了龍車鳳輦，教沙僧伺候左右，伏侍你騎上白馬；老孫卻使個定身法兒，教他君臣人等皆不能動，我們順大路只管西行。行得一晝夜，我卻念個咒，解了術法，還教他君臣們甦醒回城。一則不傷了他的性命，二來不損了你的元神。這叫做『假親脫網』之計，豈非一舉兩全之美也？」三藏聞言，如醉方醒，似夢初覺，樂以忘憂，稱謝不盡道：「深感賢徒高見。」四眾同心合意，正自商量不題。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 137
    "line_end": 137
  "translation_ja": |-
    さて、三蔵は悟空をつかまえ、叱りつけた。
    三蔵「この猿め、私を弄んで殺す気か。私をここで結婚させて、お前たちは西天へ仏を拝みに行くとは、何ということを言うのだ。私は死んでもそんなことはできぬ。」
    悟空「ご安心ください。私が、お師匠さまのご気性を知らないはずがありましょう。ただ、この土地へ来て、この人たちに会ったからには、相手の計略を逆手に取るしかありません。」
    三蔵「相手の計略を逆手に取るとは、どういうことだ。」
    悟空「意地を張ってお断りになれば、向こうは通行文書を書き換えず、私たちを行かせてくれません。もし心が悪く毒々しくなり、大勢に命じてお師匠さまの肉を切り、例の香袋にでもしたら、私たちに無事で済む道がありますか。必ずや魔物を降し妖怪を払う神通力を使うことになります。ご存じのとおり、私たちは手も足も力が強く、武器も恐ろしい。ちょっと手を動かすだけで、この国の人間を皆殺しにしてしまう。この人たちは私たちを引き止めはしても、妖怪ではなく、国じゅう皆、人間です。お師匠さまは日ごろから善を好み、慈悲深く、道中で一つの命も傷つけておられない。罪のない人々を無数に殺したら、お心が耐えられましょうか。それこそ、まことによくないことです。」
    三蔵は聞いて言った。
    三蔵「悟空、その考えはまことによい。ただ、女王が私を奥へ招いて、夫婦の交わりを求めはしないかと恐れるのだ。私がどうして元陽（げんよう）を失い、仏門の徳を損なってよいものか。真精（しんせい）を漏らし、わが教えに生きるこの身を堕落させてよいものか。」
    悟空「今日、縁談をお受けになれば、向こうは必ず皇帝を迎える礼で、車駕を整えて城外へ迎えに来ます。お師匠さまも遠慮せず、鳳凰や竜を飾った車に乗り、宝殿へ上がって南向きにお座りなさい。女王に御璽を取り出させ、私たち兄弟を殿上へ呼び入れ、通関文牒に印を押させます。さらに女王に署名と花押を記していただき、私たちへ渡してもらうのです。その一方で宴を設け、女王との婚礼の祝いと、私たちの送別を兼ねさせます。宴が終わったら、また車を用意させ、私たち三人を城外へ送り、帰ってから女王と夫婦になる、とだけおっしゃい。こうして君臣を喜ばせ、引き止める心も、悪い考えも起こさせないようにするのです。城外へ送り出したところで車を下り、そばで待つ沙悟浄に世話をさせて、白馬へお乗りなさい。私は定身法（ていしんほう）を使い、女王も官人たちも身動きできなくします。私たちは街道を、ひたすら西へ進む。一昼夜進んだところで私が呪文を唱えて術を解けば、君臣は正気に戻り、城へ帰れます。一つには彼らの命を傷つけず、二つにはお師匠さまの元神（げんしん）も損ないません。これが『偽りの縁組で網を抜ける』計略です。一挙に両方を全うする、よいやり方ではありませんか。」
    三蔵は聞くと、酔いがようやくさめ、夢から初めて覚めたようになり、喜びで憂いを忘れ、何度も礼を述べた。
    三蔵「賢い弟子よ、お前の優れた考えに深く感謝する。」
    四人は心を合わせ、そのまま相談を続けた。この話はひとまず置く。
  "translation_status": "reviewed"
- "id": "xy-ch54-015"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "卻說那太師與驛丞不等宣詔，直入朝門白玉階前，奏道：「主公佳夢最準，魚水之歡就矣。」女王聞奏，捲珠簾，下龍床，啟櫻唇，露銀齒，笑盈盈嬌聲問曰：「賢卿見御弟，怎麼說來？」太師道：「臣等到驛，拜見御弟畢，即備言求親之事。御弟還有推托之辭，幸虧他大徒弟慨然見允，願留他師父與我王為夫，面南稱帝。只教先倒換關文，打發他三人西去；取得經回，卻到此拜認爺娘，討盤費回大唐也。」女王笑道：「御弟再有何說？」太師奏道：「御弟不言，願配我主。只是他那二徒弟，先要吃席肯酒。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"

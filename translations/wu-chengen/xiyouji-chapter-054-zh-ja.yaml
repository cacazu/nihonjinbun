  "translation_ja": |-
    さて、太師と駅丞は召しを待たず、まっすぐ宮門へ入り、白玉の階の前で奏上した。
    太師と駅丞「陛下の吉夢は、まことに正確でございました。魚と水のようにむつまじい夫婦の喜びが、かなうのでございます。」
    女王は奏上を聞くと、珠のすだれを上げ、玉座を下り、桜桃のような唇を開いて白銀の歯を見せ、にこやかに甘い声で尋ねた。
    女王「そなたたち、御弟に会って、どんなお話になったのです。」
    太師「私どもは宿駅で御弟さまに拝礼を済ませ、縁談のことを詳しく申し上げました。御弟さまには、まだ辞退なさるお言葉もございましたが、幸い一番のお弟子さまが快く承諾し、師を留めてわが王の夫とし、南面して帝位に就いていただく、と申しました。ただ、先に通行文書を書き換えて三人を西へ送り出し、経を取って戻った際には、ここで父母としてお二人にご挨拶し、旅費をいただいて大唐へ戻りたいとのことでございます。」
    女王は笑った。
    女王「御弟は、ほかに何と言われました。」
    太師「御弟さまは何も仰せにならず、陛下との婚姻をお望みです。ただ、二番目のお弟子さまは、先に肯酒の宴を願っております。」
  "translation_status": "reviewed"
- "id": "xy-ch54-016"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "女王聞言，即傳旨，教光祿寺排宴。一壁廂排大駕，出城迎接夫君。眾女官即欽遵王命，打掃宮殿，鋪設庭臺。一班兒擺宴的，火速安排；一班兒擺駕的，流星整備。你看那西梁國雖是婦女之邦，那鑾輿不亞中華之盛。但見："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 140
    "line_end": 140
  "translation_ja": "女王は聞くと、ただちに光禄寺（こうろくじ）へ宴を命じ、一方で盛大な車駕を整え、城外へ夫を迎えに出ることにした。女官たちは王命を謹んで奉じ、宮殿を掃除し、庭や台を飾った。宴を担当する者たちは火急に料理を調え、車駕を担当する者たちは流星のような速さで準備した。見よ、西梁国は女の国とはいえ、その御車の盛観は中華にも劣らない。そこには――"
  "translation_status": "reviewed"
- "id": "xy-ch54-017"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": "六龍噴彩，雙鳳生祥。六龍噴彩扶車出，雙鳳生祥駕輦來。馥\U0002984F異香藹，氤氳瑞氣開。金魚玉佩多官擁，寶髻雲鬟眾女排。鴛鴦掌扇遮鑾駕，翡翠珠簾影鳳釵。笙歌音美，絃管聲諧。一片歡情沖碧漢，無邊喜氣出靈臺。三簷羅蓋搖天宇，五色旌旗映御階。此地自來無合巹，女王今日配男才。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 142
    "line_end": 142
  "translation_ja": "六頭の竜は彩りを放ち、二羽の鳳凰は吉兆を生む。\n六頭の竜は彩りを放って車を支え出で、二羽の鳳凰は吉兆を生んで御車を導き来る。\n馥\U0002984F（ふくいく）たる不思議な香りが立ちこめ、たなびくめでたい気が広がる。\n金の魚符（ぎょふ）と玉の飾りを帯びた官人が取り囲み、宝を飾った髷と雲のような髪の女たちが並ぶ。\n鴛鴦（おしどり）の大扇が御車を覆い、翡翠と珠のすだれに鳳凰のかんざしが映る。\n笙（しょう）と歌声は美しく、弦と管の響きは調和する。\n一面の喜びが青い天へ突き上がり、限りない祝福が心の奥からあふれ出る。\n三重の薄絹の天蓋は空に揺れ、五色の旗は宮殿の階を照らす。\nこの地には昔から婚礼の杯を交わすことがなかったが、今日、女王は優れた男を伴侶にする。"
  "translation_status": "reviewed"
- "id": "xy-ch54-018"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "不多時，大駕出城，早到迎陽館驛。忽有人報三藏師徒道：「駕到了。」三藏聞言，即與三徒整衣出廳迎駕。女王捲簾下輦道：「那一位是唐朝御弟？」太師指道：「那驛門外香案前穿襴衣者便是。」女王閃鳳目，簇蛾眉，仔細觀看，果然一表非凡。你看他："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 143
    "line_end": 143
  "translation_ja": |-
    ほどなく車駕は城を出て、早くも迎陽館駅（げいようかんえき）へ着いた。使いの者が三蔵たちに知らせた。
    使いの者「お車がお着きになりました。」
    三蔵は聞くと、三人の弟子と衣服を整え、広間から出て迎えた。女王はすだれを上げて車を下り、尋ねた。
    女王「どのお方が唐の帝の御弟ですか。」
    太師は指し示した。
    太師「あの宿駅の門の外、香案の前で、襴衣（らんい）をお召しの方でございます。」
    女王は鳳凰のような目を輝かせ、蛾の触角のような眉を寄せ、じっと見つめた。なるほど、並外れた風采である。見よ、その姿は――
  "translation_status": "reviewed"
- "id": "xy-ch54-019"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": "丰姿英偉，相貌軒昂。齒白如銀砌，唇紅口四方。頂平額闊天倉滿，目秀眉清地閣長。兩耳有輪真傑士，一身不俗是才郎。好個妙齡聰俊風流子，堪配西梁窈窕娘。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 145
    "line_end": 145
  "translation_ja": |-
    姿は雄々しく美しく、顔立ちは堂々としている。
    歯は白銀を並べたように白く、唇は紅く、口は四角く整っている。
    頭頂は平らで額は広く、天倉（てんそう）は豊かに張り、目は麗しく眉は清らか、地閣（ちかく）は長い。
    両耳の輪郭は整い、まことに傑出した男、全身に俗気がなく、才ある若者。
    なんと若く賢く麗しい、風流な男子であろう。
    西梁のしとやかな姫に、まさしくふさわしい。
  "translation_status": "reviewed"
- "id": "xy-ch54-020"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "女王看到那心歡意美之處，不覺淫情汲汲，愛慾恣恣，展放櫻桃小口，呼道：「大唐御弟，還不來占鳳乘鸞也？」三藏聞言，耳紅面赤，羞答答不敢擡頭。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 147
    "line_end": 147
  "translation_ja": |-
    女王は見れば見るほど心が喜び、胸が満たされ、思わず淫らな思いがせき立ち、欲情があふれ出た。桜桃のような小さな口を開いて呼びかけた。
    女王「大唐の御弟さま、まだこちらへいらして、鳳凰に乗るような婚姻の幸せをお受けにならないのですか。」
    三蔵はそれを聞き、耳も顔も赤くなり、恥じらって頭を上げられなかった。
  "translation_status": "reviewed"
- "id": "xy-ch54-021"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "豬八戒在傍，掬著嘴，餳眼觀看那女王，卻也嬝娜。真個："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 149
    "line_end": 149
  "translation_ja": "八戒はそばで口を突き出し、とろんとした目で女王を見た。なるほど、たおやかな美人である。まことに――"
  "translation_status": "reviewed"
- "id": "xy-ch54-022"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": "眉如翠羽，肌似羊脂。臉襯桃花瓣，鬟堆金鳳絲。秋波湛湛妖嬈態，春筍纖纖嬌媚姿。斜軃紅綃飄彩艷，高簪珠翠顯光輝。說甚麼昭君美貌，果然是賽過西施。柳腰微展鳴金珮，蓮步輕移動玉肢。月裡嫦娥難到此，九天仙子怎如斯。宮妝巧樣非凡類，誠然王母降瑤池。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 151
    "line_end": 151
  "translation_ja": |-
    眉は翠の羽のよう、肌は羊の脂のよう。
    顔は桃の花びらを添えたようで、髷には金の鳳凰の糸飾りが重なる。
    秋の波のような澄んだ目はあでやかに、春の筍のような細い指はなまめかに。
    斜めに垂れた紅の薄絹が鮮やかにひるがえり、高く挿した珠と翠玉が光り輝く。
    昭君（しょうくん）の美貌が何ほどのものか、まことに西施（せいし）にも勝るほど。
    柳の腰を少し伸ばせば金の飾りが鳴り、蓮のような歩みを軽く移せば玉の手足が動く。
    月の嫦娥（じょうが）もここまでは及ばず、九天の仙女（きゅうてんのせんにょ）もどうしてこれほどであろう。
    宮廷の巧みな装いは凡俗のものではなく、まさに瑤池（ようち）へ降り立った王母（おうぼ）である。
  "translation_status": "reviewed"
- "id": "xy-ch54-023"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那獃子看到好處，忍不住口嘴流涎，心頭撞鹿，一時間骨軟筋麻，好便似雪獅子向火，不覺的都化去也。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 153
    "line_end": 153
  "translation_ja": "八戒はその美しさを見て、よだれを抑えきれず、胸では鹿が跳ねるように心臓が鳴り、一瞬のうちに骨は柔らぎ筋はしびれた。まるで雪で作った獅子を火に近づけたように、知らぬ間にすっかり溶けてしまった。"
  "translation_status": "reviewed"
- "id": "xy-ch54-024"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那女王走近前來，一把扯住三藏，俏語嬌聲，叫道：「御弟哥哥，請上龍車，和我同上金鑾寶殿，匹配夫婦去來。」這長老戰兢兢立站不住，似醉如痴。行者在側教道：「師父不必太謙，請共師娘上輦。快快倒換關文，等我們取經去罷。」長老不敢回言，把行者抹了兩抹，止不住落下淚來。行者道：「師父切莫煩惱，這般富貴，不受用還待怎麼哩？」三藏沒及奈何，只得依從，揩了眼淚，強整歡容，移步近前，與女主："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 154
    "line_end": 154
  "translation_ja": |-
    女王は近づくと三蔵の手をつかみ、甘くやさしい声で呼んだ。
    女王「御弟さま、お車にお乗りください。私と金鑾宝殿（きんらんほうでん）へ上がって、夫婦になりましょう。」
    三蔵はぶるぶる震えて立っていられず、酔ったように、魂の抜けたようになった。悟空がそばで促した。
    悟空「お師匠さま、そんなに遠慮なさらず、奥さまと一緒にお車へ。早く通行文書を書き換えて、私たちを取経にお出しください。」
    三蔵は返事もできず、悟空へ二度視線を送り、涙が止まらなくなった。
    悟空「お師匠さま、お悩みなさるな。こんな富貴を楽しまなくて、どうなさるのです。」
    三蔵はどうしようもなく従い、涙を拭き、無理に楽しげな顔を作って歩み寄り、女王と――
  "translation_status": "reviewed"
- "id": "xy-ch54-025"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": "同攜素手，共坐龍車。那女主喜孜孜欲配夫妻，這長老憂惶惶只思拜佛。一個要洞房花燭交鴛侶，一個要西宇靈山見世尊。女帝真情，聖僧假意。女帝真情，指望和諧同到老；聖僧假意，牢藏情意養元神。一個喜見男身，恨不得白晝並頭諧伉儷；一個怕逢女色，只思量即時脫網上雷音。二人和會同登輦，豈料唐僧各有心。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 156
    "line_end": 156
  "translation_ja": |-
    白い手を取り合い、ともに竜の車へ座る。
    女王は喜びに満ちて夫婦となることを望み、三蔵はおびえ苦しんで仏を拝むことばかり思う。
    一方は花燭ともる新房で鴛鴦の契りを結びたく、一方は西方の霊山（れいざん）で世尊（せそん）にまみえたい。
    女帝の心はまこと、聖僧の心は偽り。
    女帝の心はまこと、仲むつまじくともに老いることを望み、聖僧の心は偽り、心情を堅くしまって元神を養う。
    一方は男の姿に喜び、昼のうちから頭を並べ夫婦になりたくてならず、一方は女色を恐れ、すぐさま網を抜けて雷音（らいおん）へ上がることばかり考える。
    二人は親しく並んで同じ車に乗ったが、誰が思おう、三蔵の胸には別の思いがあるとは。
  "translation_status": "reviewed"
- "id": "xy-ch54-026"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那些文武官見主公與長老同登鳳輦，並肩而坐，一個個眉花眼笑，撥轉儀從，復入城中。孫大聖才教沙僧挑著行李，牽著白馬，隨大駕後邊同行。豬八戒往前亂跑，先到五鳳樓前，嚷道：「好自在，好現成呀。這個弄不成，這個弄不成，吃了喜酒進親才是。」諕得些執儀從引導的女官，一個個回至駕邊道：「主公，那一個長嘴大耳的，在五鳳樓前嚷道要喜酒吃哩。」女主聞奏，與長老倚香肩，偎並桃腮，開檀口，俏聲叫道：「御弟哥哥，長嘴大耳的是你那個高徒？」三藏道：「是我第二個徒弟。他生得食腸寬大，一生要圖口肥，須是先安排些酒食與他吃了，方可行事。」女主急問：「光祿寺安排筵宴，完否？」女官奏道：「已完，設了葷素兩樣，在東閣上哩。」女王又問：「怎麼兩樣？」女官奏道：「臣恐唐朝御弟與高徒等平素吃齋，故有葷素兩樣。」女王卻又笑吟吟，偎著長老的香腮道：「御弟哥哥，你吃葷吃素？」三藏道：「貧僧吃素，但是未曾戒酒。須得幾杯素酒，與我二徒弟吃些。」"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 157
    "line_end": 157
  "translation_ja": |-
    文武の官人たちは、わが王と三蔵が同じ鳳凰の車に乗り、肩を並べて座るのを見ると、そろって満面に笑みを浮かべ、儀仗の列を返して城へ戻った。悟空はそこで沙悟浄に、荷を担いで白馬を引き、車駕の後について行くよう命じた。八戒は先へ走り、五鳳楼にいち早く着いて叫んだ。
    八戒「ああ、いい気楽な身分だ。何もかも出来上がっているじゃないか。だが、このままじゃいけない、このままじゃいけない。祝い酒を飲んでから、婚礼に入らなくちゃな。」
    儀仗を持って先導していた女官たちは驚き、一人一人が車のそばへ戻った。
    女官たち「陛下、あの口の長い耳の大きな者が、五鳳楼の前で祝い酒を飲ませろと騒いでおります。」
    女王は聞くと、香る肩を三蔵へ寄せ、桃色の頬を並べ、紅い唇を開いて甘く呼びかけた。
    女王「御弟さま、口が長く耳の大きいのは、何番目のお弟子ですか。」
    三蔵「二番目の弟子です。生まれつき腹が大きく食欲が強く、生涯、うまいものを食べることばかり考えております。まず酒食を調えて食べさせなくては、先へ進めません。」
    女王は急いで尋ねた。
    女王「光禄寺の宴の支度は、できていますか。」
    女官「できております。東閣（とうかく）に、肉料理と精進料理の二通りを用意いたしました。」
    女王「なぜ二通りなのです。」
    女官「唐の御弟さまとお弟子さま方は、いつも精進料理を召し上がるのかと案じ、両方を調えました。」
    女王はまたにこにこし、三蔵の香る頬に寄り添った。
    女王「御弟さま、肉料理を召し上がりますか、それとも精進料理ですか。」
    三蔵「私は精進料理をいただきます。ただ、酒を断ってはおりません。素酒（そしゅ）を何杯か、二番目の弟子に飲ませてください。」
  "translation_status": "reviewed"
- "id": "xy-ch54-027"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "說未了，太師啟奏：「請赴東閣會宴。今宵吉日良辰，就可與御弟爺爺成親。明日天開黃道，請御弟爺爺登寶殿，面南，改年號即位。」女王大喜，即與長老攜手相攙，下了龍車，共入端門裡。但見那："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 159
    "line_end": 159
  "translation_ja": |-
    言い終わらぬうちに、太師が奏上した。
    太師「どうぞ東閣の宴へおいでください。今宵はめでたい日、よい時刻でございますから、御弟さまと婚礼を挙げられます。明日は天が黄道（こうどう）の吉日を開きます。御弟さまには宝殿へ上がり、南面して年号を改め、即位していただきましょう。」
    女王は大喜びし、三蔵と手を取り、支え合って竜の車を下り、ともに端門（たんもん）を入った。見れば――
  "translation_status": "reviewed"
- "id": "xy-ch54-028"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    風飄仙樂下樓臺，閶闔中間翠輦來。
    鳳闕大開光藹藹，皇宮不閉錦排排。
    麒麟殿內爐煙裊，孔雀屏邊房影迴。
    亭閣崢嶸如上國，玉堂金馬更奇哉。
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 160
    "line_end": 163
  "translation_ja": |-
    風が仙楽を楼台から運び、宮門の中を翠の御車が来る。
    鳳凰の門は大きく開いて光があふれ、皇宮は閉ざされず錦の飾りが列をなす。
    麒麟殿（きりんでん）には香炉の煙が細く立ち、孔雀の屏風のかたわらに部屋の影がめぐる。
    亭や楼閣は大国のように高々とそびえ、玉堂（ぎょくどう）と金馬（きんば）の門は、なおさら見事である。
  "translation_status": "reviewed"
- "id": "xy-ch54-029"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "既至東閣之下，又聞得一派笙歌聲韻美，又見兩行紅粉貌嬌嬈。正中堂排設兩般盛宴：左邊上首是素筵，右邊上首是葷筵。下兩路盡是單席。那女王斂袍袖，十指尖尖，奉著玉杯，便來安席。行者近前道：「我師徒都是吃素，先請師父坐了左手素席，轉下三席，分左右，我兄弟們好坐。」太師喜道：「正是，正是。師徒如父子也，不可並肩。」眾女官連忙調了席面。女王一一傳杯，安了他弟兄三位。行者又與唐僧丟個眼色，教師父回禮。三藏下來，卻也擎玉杯，與女王安席。那些文武官朝上拜謝了皇恩，各依品從，分坐兩邊，才住了音樂請酒。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 165
    "line_end": 165
  "translation_ja": |-
    東閣へ着くと、美しい笙や歌の調べが一斉に聞こえ、紅を差した美しい女たちが二列に並んでいた。広間の中央には二通りの盛大な膳が設けられ、左の上座は精進の膳、右の上座は肉料理の膳で、下手の二列はすべて一人ずつの席だった。女王は袍の袖を引き寄せ、細い十本の指で玉の杯を捧げ、席へ案内しようとした。悟空は前へ出た。
    悟空「私たち師弟は皆、精進料理をいただきます。まずお師匠さまを左の精進の上席へお通しし、その下手の左右へ三席を移して、私たち兄弟を座らせてください。」
    太師は喜んだ。
    太師「そのとおりです。師弟は父子のようなものですから、肩を並べて座ってはなりません。」
    女官たちは急いで席を整え直した。女王は一人一人に杯を渡し、三人の弟子を席へ着かせた。悟空はまた三蔵へ目配せして、返礼するよう促した。三蔵は席を下り、やはり玉の杯を捧げ、女王を席へ案内した。文武の官人たちは上座へ向かって拝し、王の恩に感謝して、位に従って両側へ分かれて座った。そこでようやく音楽を止め、酒を勧めた。
  "translation_status": "reviewed"
- "id": "xy-ch54-030"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那八戒那管好歹，放開肚子，只情吃起。也不管甚麼玉屑、米飯、蒸餅、糖糕、蘑菇、香蕈、筍芽，木耳、黃花菜、石花菜、紫菜、蔓菁、芋頭、蘿菔、山藥、黃精，一骨辣噇了個罄盡。喝了五七杯酒。口裡嚷道：「看添換來，拿大觥來，再吃幾觥，各人幹事去。」沙僧問道：「好筵席不吃，還要幹甚事？」獃子笑道：「古人云：『造弓的造弓，造箭的造箭。』我們如今招的招，嫁的嫁，取經的還去取經，走路的還去走路，莫只管貪杯誤事。快早兒打發關文。正是將軍不下馬，各自奔前程。」女王聞說，即命取大杯來。近侍官連忙取幾個鸚鵡杯、鸕鶿杓、金叵羅、銀鑿落、玻璃盞、水晶盆、蓬萊碗、琥珀鍾，滿斟玉液，連注瓊漿，果然都各飲一巡。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 166
    "line_end": 166
  "translation_ja": |-
    八戒はよしあしなど構わず、思う存分食べ始めた。玉屑（ぎょくせつ）、米の飯、蒸し餅、砂糖菓子、キノコ、シイタケ、タケノコ、キクラゲ、黄花菜（こうかさい）、テングサ、ノリ、カブ、サトイモ、ダイコン、ヤマイモ、黄精（おうせい）と、何もかも一気にかき込み、すっかり平らげた。酒も五、七杯ほど飲むと叫んだ。
    八戒「おい、料理を取り替えて、もっと持ってこい。でっかい觥（こう）を持ってこい。あといくつか飲んだら、みんな自分の仕事に取りかかろう。」
    沙悟浄「こんなよい宴を楽しまずに、まだ何をするというんです。」
    八戒は笑った。
    八戒「昔の人も『弓を作る者は弓を作り、矢を作る者は矢を作る』と言った。今の俺たちも、婿を迎える者は迎え、嫁ぐ者は嫁ぎ、取経する者は取経に行き、旅する者は旅に出るのさ。酒ばかり欲しがって用を誤っちゃいけない。早いところ通行文書を渡してくれ。まさに『将軍は馬を下りず、それぞれ先の道へ走る』だ。」
    女王は聞くと、すぐに大杯を持ってこさせた。近侍の官人は急いで、鸚鵡杯（おうむはい）、鸕鶿杓（ろじしゃく）、金叵羅（きんはら）、銀鑿落（ぎんさくらく）、玻璃盞（はりさん）、水晶盆（すいしょうぼん）、蓬萊碗（ほうらいわん）、琥珀鍾（こはくしょう）をいくつも取り出し、玉のしずくのような酒を満たし、珠の甘露のような酒を次々注いだ。皆、本当に一巡ずつ飲んだ。
  "translation_status": "reviewed"
- "id": "xy-ch54-031"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏欠身而起，對女王合掌道：「陛下，多蒙盛設，酒已夠了。請登寶殿，倒換關文，趕天早，送他三人出城罷。」女王依言，攜著長老，散了筵宴，上金鑾寶殿，即讓長老即位。三藏道：「不可，不可。適太師言過，明日天開黃道，貧僧才敢即位稱孤。今日即印關文，打發他去也。」女王依言，仍坐了龍床，即取金交椅一張，放在龍床左手，請唐僧坐了。叫徒弟們拿上通關文牒來。大聖便教沙僧解開包袱，取出關文。大聖將關文雙手捧上。那女王細看一番，上有大唐皇帝寶印九顆，下有寶象國印、烏雞國印、車遲國印。女王看罷，嬌滴滴笑語道：「御弟哥哥又姓陳？」三藏道：「俗家姓陳，法名玄奘。因我唐王聖恩認為御弟，賜姓我為唐也。」女王道：「關文上如何沒有高徒之名？」三藏道：「三個頑徒，不是我唐朝人物。」女王道：「既不是你唐朝人物，為何肯隨你來？」三藏道：「大的個徒弟，祖貫東勝神洲傲來國人氏；第二個乃西牛賀洲烏斯莊人氏；第三個乃流沙河人氏：他三人都因罪犯天條，南海觀世音菩薩解脫他苦，秉善皈依，將功折罪，情願保護我上西天取經。皆是途中收得，故此未註法名在牒。」女王道：「我與你添註法名，好麼？」三藏道：「但憑陛下尊意。」女王即令取墨筆來，濃磨香翰，飽潤香毫，牒文之後，寫上孫悟空、豬悟能、沙悟淨三人名諱。卻才取出御印，端端正正印了；又畫個手字花押。傳將下去。孫大聖接了，教沙僧包裹停當。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 167
    "line_end": 167
  "translation_ja": |-
    三蔵は腰を浮かせて立ち上がり、女王に合掌した。
    三蔵「陛下、ご馳走を盛大にお設けくださり、ありがとうございます。酒はもう十分です。宝殿へお上がりになり、通行文書を書き換え、日の早いうちに三人を城外へ送り出してください。」
    女王はそのとおりにし、三蔵の手を取って宴を終え、金鑾宝殿へ上がると、すぐ三蔵に帝位を譲ろうとした。
    三蔵「いけません、いけません。先ほど太師が、明日こそ黄道の吉日と申されました。その時になって初めて、私は帝位に就くことができます。今日は通行文書に印を押し、この者たちを出発させましょう。」
    女王は従って再び玉座に着き、金の折り畳み椅子を一脚出させ、玉座の左へ置いて三蔵を座らせた。そして弟子たちに、通関文牒を持ってくるよう命じた。悟空は沙悟浄に包みを解いて文書を出させ、自分で両手に捧げて差し出した。女王が詳しく見ると、上には大唐皇帝の宝印が九顆、その下には宝象国（ほうぞうこく）、烏鶏国（うけいこく）、車遅国（しゃちこく）の印があった。女王は見終えると、甘くなまめかに笑って尋ねた。
    女王「御弟さまは、陳（ちん）というお姓でもあるのですか。」
    三蔵「俗家の姓は陳、法名は玄奘（げんじょう）です。唐王がかたじけなくも御弟と認めてくださり、唐の姓を賜ったのでございます。」
    女王「文書にお弟子たちの名がないのは、なぜですか。」
    三蔵「不肖の弟子三人は、大唐の者ではございません。」
    女王「大唐の者でないのに、なぜあなたについて来たのです。」
    三蔵「一番上の弟子の本籍は東勝神洲（とうしょうしんしゅう）の傲来国（ごうらいこく）、二番目は西牛賀洲（さいごかしゅう）の烏斯荘（うしそう）、三番目は流沙河（りゅうさが）です。三人とも天の掟を破った罪があり、南海（なんかい）の観世音菩薩（かんぜおんぼさつ）がその苦しみを解いてくださいました。善に心を向けて帰依し、功によって罪を償おうと、進んで私を守り、西天へ経を取りに行くのです。皆、途中で弟子にした者なので、文牒に法名が記されていないのでございます。」
    女王「私が法名を書き加えてもよろしいですか。」
    三蔵「陛下のお心のままに。」
    女王はすぐに墨と筆を取り寄せ、香りよい墨を濃くすり、香る筆にたっぷり含ませ、文書の末尾へ孫悟空、猪悟能、沙悟浄の三人の名を書いた。それから御印を取り出してまっすぐに押し、さらに署名と花押を書き、下へ渡した。悟空は受け取り、沙悟浄にきちんと包ませた。
  "translation_status": "reviewed"
- "id": "xy-ch54-032"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "那女王又賜出碎金碎銀一盤，下龍床遞與行者道：「你三人將此權為路費，早上西天；待汝等取經回來，寡人還有重謝。」行者道：「我們出家人，不受金銀，途中自有乞化之處。」女王見他不受，又取出綾錦十疋，對行者道：「汝等行色匆匆，裁製不及，將此路上做件衣服遮寒。」行者道：「出家人穿不得綾錦，自有護體布衣。」女王見他不受，教：「取御米三升，在路權為一飯。」八戒聽說個「飯」字，便就接了，捎在包袱之間。行者道：「兄弟，行李見今沉重，且倒有氣力挑米？」八戒笑道：「你那裡知道，米好的是個日消貨，只消一頓飯，就了帳也。」遂此合掌謝恩。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 168
    "line_end": 168
  "translation_ja": |-
    女王はさらに、砕いた金と銀を盛った盆を一つ出し、玉座を下りて悟空へ差し出した。
    女王「三人とも、ひとまずこれを路銀として、早く西天へおいでなさい。経を取って戻ってきたら、私はさらに厚くお礼をします。」
    悟空「私たちは出家の身、金銀は受け取りません。道中では托鉢をする所がございます。」
    女王は受け取らないのを見ると、今度は綾と錦を十匹（ひき）出して言った。
    女王「そなたたちは出立を急ぎ、仕立てる暇もないでしょう。これで道中、寒さを防ぐ衣を作りなさい。」
    悟空「出家の身は綾や錦を着られません。体を守る布の衣がございます。」
    女王はまた受け取らないのを見ると、命じた。
    女王「御用の米を三升（しょう）持ってきなさい。道中、一食の足しになればよいでしょう。」
    八戒は「食」という字を聞くなり受け取り、荷の包みの間へ差し込んだ。
    悟空「弟よ、今でも荷は重いのに、さらに米を担ぐ力があるのか。」
    八戒は笑った。
    八戒「兄貴には分からないんだな。米のいいところは、毎日減る品だってことだ。一食あれば、始末はつくのさ。」
    こうして合掌し、恩に感謝した。
  "translation_status": "reviewed"
- "id": "xy-ch54-033"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三藏道：「敢煩陛下相同貧僧送他三人出城，待我囑付他們幾句，教他好生西去，我卻回來，與陛下永受榮華，無掛無牽，方可會鸞交鳳友也。」女王不知是計，便傳旨擺駕，與三藏並倚香肌，同登鳳輦，出西城而去。滿城中都盞添淨水，爐降真香：一則看女王鑾駕，二來看御弟男身。沒老沒小，盡是粉容嬌面，綠鬢雲鬟之輩。不多時，大駕出城，到西關之外。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 170
    "line_end": 170
  "translation_ja": |-
    三蔵「恐れながら陛下、私とともに三人を城外へお送りください。二、三言言い聞かせ、気をつけて西へ行かせた後、私は戻って、陛下と永く栄華を楽しみましょう。何の気掛かりもなくなって、初めて鳳凰のようにむつまじく契りを結べるのでございます。」
    女王は計略とは知らず、すぐ車駕を命じ、三蔵と肌を寄せ合って鳳凰の車に乗り、西の城門へ向かった。町じゅうで杯には清らかな水が添えられ、香炉にはよい香がくべられた。一つには女王の車駕を見物し、二つには御弟の男の姿を見ようというのだ。老いも若きも、すべて白粉を塗った美しい顔、黒い鬢と雲のような髪を結った女ばかりだった。ほどなく車駕は城を出て、西の関門の外へ着いた。
  "translation_status": "reviewed"
- "id": "xy-ch54-034"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "行者、八戒、沙僧同心合意，結束整齊，徑迎著鑾輿，厲聲高叫道：「那女王不必遠送，我等就此拜別。」長老慢下龍車，對女王拱手道：「陛下請回，讓貧僧取經去也。」女王聞言，大驚失色，扯住唐僧道：「御弟哥哥，我願將一國之富，招你為夫，明日高登寶位，即位稱君，我願為君之后，喜筵通皆吃了，如何卻又變卦？」八戒聽說，發起個風來，把嘴亂扭，耳朵亂搖，闖至駕前，嚷道：「我們和尚家和你這粉骷髏做甚夫妻？放我師父走路。」那女王見他那等撒潑弄醜，諕得魂飛魄散，跌入輦駕之中。沙僧卻把三藏搶出人叢，伏侍上馬。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 171
    "line_end": 171
  "translation_ja": |-
    悟空、八戒、沙悟浄は心を合わせ、身支度を整えて、まっすぐ御車の前へ進み、鋭い声で大きく告げた。
    悟空・八戒・沙悟浄「女王、これ以上のお見送りは結構です。ここでお別れいたします。」
    三蔵はゆっくり車を下り、女王に胸の前で両手を組んで礼をした。
    三蔵「陛下、どうぞお戻りください。私も取経へ行かせていただきます。」
    女王は聞くと驚いて顔色を変え、三蔵をつかんだ。
    女王「御弟さま、私は一国の富をもってあなたを夫に迎え、明日、宝の位にお上がりいただいて、わが君と仰ぎたいのです。私はあなたの后になるつもりで、祝いの宴もすっかり済ませました。それなのに、どうして今になってお約束を変えるのです。」
    八戒はそれを聞くと、狂気じみた勢いで口をねじり、耳を振り回し、車の前へ突進して叫んだ。
    八戒「俺たち坊主が、お前のような白粉を塗った骸骨と、何で夫婦になるんだ。お師匠さまを行かせろ！」
    女王はその乱暴な態度と醜い顔に肝をつぶし、魂も飛ぶほどおびえて車の中へ倒れ込んだ。沙悟浄は三蔵を人混みから引き出し、世話をして馬に乗せた。
  "translation_status": "reviewed"
- "id": "xy-ch54-035"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "只見那路傍閃出一個女子，喝道：「唐御弟，那裡走？我和你耍風月兒去來。」沙僧罵道：「賊輩無知！」掣寶杖劈頭就打。那女子弄陣旋風，嗚的一聲，把唐僧攝將去了，無影無蹤，不知下落何處。咦！正是："
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 173
    "line_end": 173
  "translation_ja": |-
    すると道ばたから、一人の女がさっと現れて叫んだ。
    女「唐の御弟、どこへ行くの。私と色事を楽しみにいらっしゃい。」
    沙悟浄は罵った。
    沙悟浄「無礼な悪党め！」
    宝杖を抜いて頭めがけて打ちかかった。女はつむじ風を起こし、ごうっと一声鳴らすと、三蔵をさらっていった。姿も影も消え、どこへ行ったのか分からない。ああ、まさに――
  "translation_status": "reviewed"
- "id": "xy-ch54-036"
  "section_id": "chapter-54"
  "kind": "verse"
  "origin": "source"
  "source_text": "脫得煙花網，又遇風月魔。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 175
    "line_end": 175
  "translation_ja": "色香の網を逃れたと思えば、また色事の魔に出会う。"
  "translation_status": "reviewed"
- "id": "xy-ch54-037"
  "section_id": "chapter-54"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "畢竟不知那女子是人是怪，老師父的性命得死得生，且聽下回分解。"
  "source_languages":
  - "zh-Hant"
  "source_locations":
  - "source_id": "wikisource-xiyou-ch54-1455603"
    "precision": "line"
    "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第054回&oldid=1455603"
    "line_start": 177
    "line_end": 177
  "translation_ja": "さて、あの女は人か妖怪か。お師匠さまの命は、死ぬのか生きるのか。その結末は、次回の話をお聞きいただきたい。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-01-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "回題の法性は仏法の根本のあり方を、心猿は動き回る心を猿にたとえる語。ここではそれぞれ三蔵と悟空を寓意的に示す。煙花は花や煙そのものではなく、女性の色香や色の誘惑を表す。通常の地の文・話者ラベルをこの象徴名に変更しない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-02-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は銷豬。去勢された豚とする解釈がある一方、種豚や臊い豚に結びつける解釈もあり、今回確認した一次資料だけでは語義を一つに確定できなかった。訳文は銷猪の原字を残す。八戒の身体について語り手が去勢を事実認定した文ではなく、女たちへ叫ぶ本人の言葉である。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-03-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の珍字\U0002192Bを保存した。人を怖がらせる顔つき・姿を表す語として訳したが、虎という動物に本当に変身したとは読まない。採著馬は前後の移動から馬を引く動作と解した。字形の疑わしさを理由に原文を書き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-04-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "国の開闢以来、男が来たことはないというのは女王の発言。前回に語られる旅人の存在などと機械的に調整せず、そのまま残した。女王の喜びを語り手の歴史的な保証へ置き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-05-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "紅葉は、葉に記した詩が縁を結んだとする故事に、月老と赤縄は縁結びの伝承にちなむ。二つの喩えを一つの故事にまとめず、原文の紅葉と赤繩をともに残した。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-06-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "柳の枝は太いものも細いものもそれぞれ役に立つ、男なら顔のよしあしを言うものではない、という八戒の反論。原文の箕と斗を保ち、単に「男は顔ではない」と要約しなかった。これは人物の言葉であり、訳者の価値判断ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-07-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "元陽や真精の流失を恐れるのは、人物が持つ宗教的な身体観に基づく。性交の話を単に結婚の儀礼へ弱めず、かといって現代医学の説明にはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-08-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "悟空は定身法を使い、一昼夜進んでから解く計画を語っている。計画は計画として全段階を残す。実行済みの行為や、後に必ずそのとおりになるという語り手の予告へ変えない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-09-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "太師は、三蔵が黙っていることを婚姻の意向として女王に報告している。三蔵が実際に同意したと語り手が認める文にはしない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-10-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は馥\U0002984F。香りが満ちる馥郁に当たる表記と解するが、原字は保存した。詩中の金魚は生きた魚ではなく、官人の魚符として訳す。六竜・双鳳は行列の装飾と神異的な修辞を重ねた描写で、実物の生きた竜の到来と断定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-11-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "天倉・地閣は古い人相術の部位名。人相術を扱う学術論文の用語説明を参照し、天倉は額の左右の張り、地閣は顎・下顎部とした。顔から人物の価値や運命を判断できるという現代の説明ではない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-12-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "昭君・西施・嫦娥・九天の仙女・王母は、女王の美を順にたたえる比較や比喩。女王がこれらの人物の化身であると正体を明かすくだりではない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-13-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の抹には、拭う・塗るほか「見る、ちらりと見る」の語義があり、教育部辞典にも西遊記の用例がある。ここでは悟空へ二度視線を向ける動作と解した。同じ段落で女王が呼ぶ御弟哥哥は、帝の御弟への親しみと恋慕を込めた呼びかけで、実兄という意味ではない。本文では御弟さまとした。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-14-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の與我二徒弟は「私の二番目の弟子に」と読んだ。「私と二人の弟子に」とはしない。素酒は精進の酒・薄い酒などと解される語で、酒を断っていないという三蔵の発言を消したり、ノンアルコール飲料と断定したりしない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-15-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "玉堂金馬は壮麗な宮廷を表す古典的な言い回しとして訳した。漢代の実在する宮門へ一行が移ったという意味ではない。西梁女国の端門は烏鶏国の同名の門と別項目で管理した。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-16-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は玉屑。玉のかけら・粉という語義があるが、ここでは食品の美称と考えられる。具体的な料理名は確定できず、米の飯など隣の品目へ吸収せず独立して残した。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-17-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "酒器は鸚鵡杯・鸕鶿杓・金叵羅・銀鑿落・玻璃盞・水晶盆・蓬萊碗・琥珀鍾の八種をすべて保持。鸚鵡杯は殻製と鳥形など複数の解釈があり、鸕鶿杓は酒をくむ器。本文が示さない材質・形・模様を細かく補わない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-18-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の烏斯莊を日本語の字体で烏斯荘とした。既往の烏斯蔵国や高老荘と似ていても、ここで勝手に訂正・同定しない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-19-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三蔵が俗姓は陳、法名は玄奘で、唐王から唐姓を賜ったと説明するくだりを、人物の発言としてそのまま残した。過去回の授名場面に合わせて内容を書き換えない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-20-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "粉骷髏は、美しい外見の内側も死すべき骨であるという侮称。八戒の激しい罵倒を残し、訳者の女性評にしない。"
  "translation_status": "reviewed"
- "id": "xy-ch54-note-21-body"
  "section_id": "chapter-54"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この回の最後では、道ばたに現れた女の名も正体も不明のまま。直前の詩の風月魔は色事の魔という修辞として訳し、女の種や正体を先取りする注・呼称へ展開しない。"
  "translation_status": "reviewed"

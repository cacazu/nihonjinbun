  - "id": "xy-ch48-014"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": "彤雲密佈，慘霧重浸。彤雲密佈，朔風凜凜號空；慘霧重浸，大雪紛紛蓋地。真個是：六出花，片片飛瓊；千林樹，株株帶玉。須臾積粉，頃刻成鹽。白鸚歌失素，皓鶴羽毛同。平添吳楚千江水，壓倒東南幾樹梅。卻便似戰退玉龍三百萬，果然如敗鱗殘甲滿天飛。那裡得東郭履，袁安臥，孫康映讀；更不見子猷舟，王恭幣，蘇武餐氈。但只是幾家村舍如銀砌，萬里江山似玉團。好雪，柳絮漫橋，梨花蓋舍。柳絮漫橋，橋邊漁叟掛蓑衣；梨花蓋舍，舍下野翁煨骨柮。客子難沽酒，蒼頭苦覓梅。灑灑瀟瀟裁蝶翹，飄飄蕩蕩剪鵝衣。團團滾滾隨風勢，疊疊層層道路迷。陣陣寒威穿小幙，颼颼冷氣透幽幃。豐年祥瑞從天降，堪賀人間好事宜。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 141
        "line_end": 141
    "translation_ja": |-
      雪雲は隙間なく広がり、陰鬱な霧は幾重にも立ちこめる。
      雪雲が空を覆う中、北風は凛々と空に吠え、
      陰鬱な霧が重なる中、大雪はしきりと地を埋める。
      まさしく、六つに分かれた花のような雪は、一片ごとに飛ぶ玉。
      幾千もの林の木は、一本ごとに玉をまとっている。
      たちまち白粉が積もり、見る間に塩の山となる。
      白い鸚鵡もその白さが目立たなくなり、白鶴の羽も雪と同じ色。
      呉（ご）と楚（そ）の幾千の川に水を加え、東南の何本もの梅を押し倒す。
      まるで三百万の玉の竜を戦いで退けたかのように、
      敗れた鱗と壊れた鎧が、空いっぱいに飛んでいる。
      東郭（とうかく）の靴、寝て過ごす袁安（えんあん）、雪明かりで読む孫康（そんこう）など、どこに見られよう。
      子猷（しゆう）の舟、王恭（おうきょう）の幣（へい）、蘇武（そぶ）が毛氈を食べる姿も見られぬ。
      ただ、村の家々は銀で築いたようになり、
      万里（り）の山河は玉の塊のようになった。
      見事な雪だ。柳の綿毛のように橋を埋め、梨の花のように家を覆う。
      柳の綿毛が橋を埋め、橋のそばでは漁の老人が蓑を掛け、
      梨の花が家を覆い、家の下では田舎の老人が木の切れ端をくべる。
      旅人は酒を買うのにも難儀し、召使いは梅の花を捜しあぐねる。
      しとしと、さらさらと、蝶の翅を切り出したように降り、
      ふわふわ、ゆらゆらと、鵞鳥の羽衣を裁ったように漂う。
      丸く渦巻いて風の勢いに従い、幾重にも積もって道を分からなくする。
      寒気がひとしきりずつ小さな幕を貫き、
      冷気がひゅうひゅうと奥の帳を通り抜ける。
      豊作を告げるめでたいしるしが天から降り、
      人の世に訪れるよい事を、祝うにふさわしい。
    "translation_status": "reviewed"

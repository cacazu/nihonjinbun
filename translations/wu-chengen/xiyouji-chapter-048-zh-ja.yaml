  "known_gaps":
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-002"
      "description_ja": "「年甲不齊」は信者たちの年齢がさまざまであることをいう祭文の定型句として訳した。陳一秤金は前回の一秤金に姓を添えた同一人物の名。生け贄に見える二人は前回からの変身した悟空と八戒であり、子供本人がここへ運ばれたわけではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-005"
      "description_ja": "「煞氣溫」は冷たい陰風と対になる底本の表現。温の字を冷へ訂正せず、殺気がむっと立ち上ると訳した。「捲簾扶駕將」は帝に仕える近侍の将という比喩で、この妖怪を沙悟浄その他の既知人物と同定しない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-006"
      "description_ja": "「莊頭」は村や荘園の取りまとめ役をいう語として訳したが、村の入口をいう用法もあり、この箇所の具体的な地位や制度は確定しない。悟空は子供に化けたまま丁寧に応答しており、台詞中の名乗りと実際の発言者を区別した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-007"
      "description_ja": "「冰盤」は氷や果物を盛る大きな盤を指す用法があり、ここでは鱗の大きさをたとえる大皿とした。氷そのものが二枚落ちたとは解さない。鱗という手がかりだけから、この妖怪の具体的な魚種や来歴を補わない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-010"
      "description_ja": "「今夜有三更天氣」は夜がなお三更分残るという時間の長さとして訳した。三更という時刻を示す読み方も可能であり、厳密な現代時刻へは換算しない。「跬跬拜拜」は重ねて礼をする様子と解した。鱖婆との兄妹関係は、ここでは捕縛成功を条件とする約束で、すでに成立した関係ではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-011"
      "description_ja": "「不長俊」は成長や進歩がないという叱責として訳し、単なる無知の意味に狭めない。三蔵の発話は次の寒さを詠む詩全体まで続く。原文の段落を保持したため、引用符も二つの対訳単位にまたがる。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-012"
      "description_ja": "「蒲團」は座禅などに用いる敷物であり、ここでは老僧の座る場所。「詩客筆如菱」は筆が凍って菱の実のように固まる比喩と解した。「戰抖鈴」は鈴を震わせるような全身の震えとして訳す。詩の寒さの誇張を現実の気象や生理現象の説明に直さない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-014"
      "description_ja": "「彤雲」は赤い雲だけでなく、雪をもたらす暗く厚い雲をいう用法があるため、雪雲と訳した。「白鸚歌」の末字は底本のまま保存し、鶴との対句から白い鸚鵡と解する。原文を通用形の鸚哥などへ書き換えてはいない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-014"
      "description_ja": "雪の六つの典故をすべて保持した。東郭は底の抜けた靴で雪道を歩いた人物、袁安は大雪の中で人に迷惑をかけまいと家に寝たままでいた人物、孫康は雪明かりで読書した人物、子猷は雪夜に舟を出して友を訪ねた人物、王恭は鶴氅を着た雪中の姿で知られる人物、蘇武は雪と毛氈の毛を食べて耐えた使者である。いずれも現在の場面への来訪者ではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-014"
      "description_ja": "「王恭幣」の幣は底本の字を残した。王恭の雪の故事では鶴氅という羽毛の上着が現れるが、この本文の幣を誤字と断定して氅へ改めることはしない。訳文の幣の具体的な意味は留保する。また「戰退玉龍三百萬」は雪を竜の鱗や鎧に見立てる詩的比喩で、白馬の来歴を語るものではない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-016"
      "description_ja": "七月でありながら昨日白露に入り、八月の節になったという老人の説明を保った。旧暦の月と節気の切替は別である。雪と結氷は先に妖怪の術として語られているが、ここで老人の気候説明を語り手の保証に変えない。単数の陳老が兄弟のどちらかは明示されないため、陳家の老人というラベルを使う。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-017"
      "description_ja": "三蔵の「三年で帰る」という返答と「七八年」が過ぎたという述懐は、この回の発言どおりとした。他回の旅程や年数へ無断で合わせない。「半生」と家産を尽くして船を用意するという老人の言葉も、その強さを保った。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-018"
      "description_ja": "粥を食べた後、改めて朝の精進料理が出され、まもなく昼の食事が続くという原文の順序を残した。食事の重複を誤記とみなして削除してはいない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-020"
      "description_ja": "雪洞は火鉢、椅子、紙窓、壁の古画を備える園内の室内空間として訳し、雪を掘った穴とはしない。建物の具体的な形式は未確定。三つの亭は陳家の庭園のものであり、牡丹亭という同じ字の名が他の庭園にあっても同じ建物にはしない。芙蓉は蓮・木芙蓉のいずれかを断定せず、花名を残した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-022"
      "description_ja": "「七賢過關」は七人の賢者が関を越える画題として残し、竹林の七賢などへの同定は行わない。「折梅逢使」も梅の枝を折って使者に会う画題として訳した。名を記さない人物を、典故の推測で本文へ名指ししない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-027"
      "description_ja": "「東方自信出僵蠶、北地果然有鼠窟」は、東海の氷蚕と北方の氷の下の鼠を対にする古い伝説を踏まえると考えられる。初學記の氷の部に同じ組合せがあるが、底本の僵蠶を冰蠶へ訂正しない。王祥が氷に横たわる故事と光武帝が氷の川を渡る故事も、それぞれ保持する。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-028"
      "description_ja": "老人は氷上の人々を商人と説明するが、先に鱖婆が水の眷族に人間の旅人を装わせる計略を述べている。老人の説明を、すべての通行人の正体が商人だという語り手の断定に変えない。百銭が万銭になるという百倍の値段と、三蔵が自分も名を求めると認める発言を残した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-029"
      "description_ja": "「千日吃了千升米」は、長く世話になればそれだけ食べるという諺を用い、今さら数日の滞在を惜しまなくてよいと勧める文脈。直訳に近い形で残した。三蔵の「今は八月」という言い方も、前の「七月・八月節」へ機械的に統一していない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-031"
      "description_ja": "「四五錢重」の銭は貨幣の枚数でなく重さの単位。小さな塊を一つ取る行為として訳し、四、五枚の銭へ変えない。襯銭は僧への供養・布施である。携帯食の饝饝は底本の字体を保ち、饃饃などへの書換えや具材の補足をしない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-033"
      "description_ja": "凌眼は踏むと抜け落ちる氷の穴・薄い部分と解した。横長の物を構えるという八戒の説明は、物語中の人物の知恵であり、実際の氷上移動の安全を保証する助言ではない。原文では一晩じゅう歩き続け、その翌朝もさらに進む。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-036"
      "description_ja": "鱖妹という呼びかけで、先の兄妹の約束を改めて確認する。「不敢」はその待遇への遠慮と解した。石匣は長さ六尺の石の箱で、原文の蓋という動作に従い、三蔵へかぶせて閉じ込めると訳した。二日待つという提案を、実際に二日が経過した出来事へは変えない。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-037"
      "description_ja": "陳到底は、三蔵の俗姓「陳」と「沉」が中国語で同音であることに「到底」、底まで、を続けた八戒の冗談。正式な改名ではない。三蔵の死亡を語り手の事実にもしていない。「莫替古人耽憂」は、関わりのないことをむやみに心配するなという慣用句として、余計な心配をするなと訳した。 本文の欠落ではなく解釈・校訂上の留保。"
    - "source_id": "wikisource-xiyou-ch48-1808610"
      "segment_ids":
        - "xy-ch48-039"
      "description_ja": "末尾の本性と大丹は、物語の危難を道教の修行の失敗に重ねる寓意的な語。大丹の脱漏は霊的な成就を失う像として訳し、特定の身体行為や登場人物との対応を原文以上に確定しない。 本文の欠落ではなく解釈・校訂上の留保。"

    "translation_status": "reviewed"
  - "id": "xy-ch48-002"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "話說陳家莊眾信人等，將豬羊牲醴與行者、八戒，喧喧嚷嚷，直擡至靈感廟裡排下；將童男女設在上首。行者回頭看見那供桌上香花蠟燭，正面一個金字牌位，上寫「靈感大王之神」，更無別的神像。眾信擺列停當，一齊朝上叩頭道：「大王爺爺，今年今月今日今時，陳家莊祭主陳澄等眾信，年甲不齊，謹遵年例，供獻童男一名陳關保、童女一名陳一秤金，豬羊牲醴如數，奉上大王享用。保佑風調雨順，五穀豐登。」祝罷，燒了紙馬，各回本宅不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 118
        "line_end": 118
    "translation_ja": |-
      さて、陳家荘（ちんかそう）の信者たちは、豚や羊の供え物と祭りの酒、それに悟空（ごくう）と八戒（はっかい）を、わいわい騒ぎながら霊感廟（れいかんびょう）へ担ぎ込み、並べて置いた。男の子と女の子は上座に据えた。悟空が振り返ると、供物台には香、花、蝋燭があり、正面の金文字の位牌には「霊感大王（れいかんだいおう）の神」と書かれている。ほかに神像はなかった。信者たちはすべてを並べ終えると、一斉に神前へ頭を下げた。
      村の信者たち「大王さま。本年、本月、本日、この時刻に、陳家荘の祭主、陳澄（ちんちょう）をはじめ、年齢を異にする信者一同が、謹んで年々の定めに従い、男児一名、陳関保（ちんかんほう）と、女児一名、陳一秤金（ちんいっしょうきん）、ならびに定めの数の豚、羊、祭りの酒をお捧げいたします。大王さま、どうぞお召し上がりください。風雨がほどよく、五穀が豊かに実りますよう、お守りください。」
      祈りを終えると紙馬（しば）を焼き、それぞれ家へ戻った。こちらの話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-003"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那八戒見人散了，對行者道：「我們家去罷。」行者道：「你家在那裡？」八戒道：「往老陳家睡覺去。」行者道：「獃子又亂談了。既允了他，須與他了這願心才是哩。」八戒道：「你倒不是獃子，反說我是獃子。只哄他耍耍便罷，怎麼就與他祭賽，當起真來？」行者道：「為人為徹。一定等那大王來吃了，才是個全始全終；不然，又教他降災貽害，反為不美。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 120
        "line_end": 120
    "translation_ja": |-
      人々が散ると、八戒が悟空に言った。
      八戒「俺たちも家へ帰ろうよ。」
      悟空「お前の家は、どこにあるんだ？」
      八戒「陳の爺さんの家へ、寝に帰るんだよ。」
      悟空「馬鹿、またいい加減なことを言う。引き受けた以上、あの人たちの願いをかなえてやらなくちゃならん。」
      八戒「自分は馬鹿じゃないつもりで、俺を馬鹿呼ばわりするのか。ちょっとからかって、それでおしまいにすりゃいいものを。どうして本気になって、あの人たちの生け贄になってやるんだ？」
      悟空「人のためにやるなら、徹底してやるんだ。大王が食いに来るまで待ってこそ、最後まで責任を果たせる。そうしないと、また災いを下して害を与え、かえって悪いことになるだろう。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-004"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正說間，只聽得呼呼風響。八戒道：「不好了，風響是那話兒來了。」行者只叫：「莫言語，等我答應。」頃刻間，廟門外來了一個妖邪。你看他怎生模樣："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 122
        "line_end": 122
    "translation_ja": |-
      こう話していると、突然、風がごうごうと鳴った。
      八戒「まずいぞ。この風の音は、あいつが来たんだ。」
      悟空はただ、こう言った。
      悟空「口を利くな。俺が応対する。」
      ほどなく廟の門の外へ、一匹の妖怪がやって来た。どんな姿か、ご覧あれ。
    "translation_status": "reviewed"
  - "id": "xy-ch48-005"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      金甲金盔燦爛新，腰纏寶帶繞紅雲。
      眼如晚出明星皎，牙似重排鋸齒分。
      足下煙霞飄蕩蕩，身邊霧靄暖薰薰。
      行時陣陣陰風冷，立處層層煞氣溫。
      卻似捲簾扶駕將，猶如鎮寺大門神。
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 123
        "line_end": 127
    "translation_ja": |-
      金の鎧と金の兜は、真新しくきらめき、
      腰に巻いた宝の帯には、赤い雲が取り巻く。
      目は夕暮れに現れる明るい星のように輝き、
      歯は幾重にも並べた鋸の刃のように分かれる。
      足もとでは煙と霞がゆらゆら漂い、
      身のまわりでは霧ともやが、暖かく立ちこめる。
      歩けば陰気な風が、ひとしきりずつ冷たく吹き、
      立てば殺気が、幾重にもむっと立ち上る。
      御簾を巻き上げ、帝の行幸に付き従う将軍さながら、
      寺を守る大きな門神（もんしん）にも似ていた。
    "translation_status": "reviewed"
  - "id": "xy-ch48-006"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪物攔住廟門問道：「今年祭祀的是那家？」行者笑吟吟的答道：「承下問，莊頭是陳澄、陳清家。」那怪聞答，心中疑似道：「這童男膽大，言談伶俐。常來供養受用的，問一聲不言語；再問聲，諕了魂；用手去捉，已是死人。怎麼今日這童男善能應對？」怪物不敢來拿，又問：「童男女叫甚名字？」行者笑道：「童男陳關保，童女一秤金。」怪物道：「這祭賽乃上年舊規，如今供獻我，當吃你。」行者道：「不敢抗拒，請自在受用。」怪物聽說，又不敢動手，攔住門喝道：「你莫頂嘴。我常年先吃童男，今年倒要先吃童女。」八戒慌了道：「大王還照舊罷，不要吃壞例子。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 129
        "line_end": 129
    "translation_ja": |-
      妖怪は廟の門に立ちふさがって尋ねた。
      妖怪「今年の祭りを出したのは、どこの家だ？」
      悟空はにこにこしながら答えた。
      悟空「お尋ねいただき、恐れ入ります。村の取りまとめ役である、陳澄、陳清（ちんせい）の家でございます。」
      妖怪はその返事を聞き、胸の内で怪しんだ。
      妖怪「この男の子は肝が据わっていて、口も達者だ。いつも供えられる子供は、一度尋ねても口を利かず、もう一度尋ねれば魂も飛ぶほど怯え、手を伸ばしてつかむころには、もう死んでいる。それが今日の子は、どうしてこうも受け答えができるのだ？」
      妖怪は手を出す気になれず、さらに尋ねた。
      妖怪「男の子と女の子の名は、何という？」
      悟空は笑って答えた。
      悟空「男の子は陳関保、女の子は一秤金（いっしょうきん）です。」
      妖怪「この祭りは、以前からの決まりだ。今、お前たちはわしに供えられたのだから、食ってやるぞ。」
      悟空「逆らうつもりはございません。どうぞ、お好きなように召し上がってください。」
      そう聞いても、妖怪はやはり手が出せず、門をふさいだまま怒鳴った。
      妖怪「口答えするな。いつもは男の子から先に食うが、今年は女の子を先に食ってやろう。」
      八戒は慌てた。
      八戒「大王さま、いつもどおりにしてくださいよ。食べる順番の決まりを壊しちゃいけません。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-007"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那怪不容分說，放開手，就捉八戒。獃子撲的跳下來，現了本相，掣釘鈀，劈手一築，那怪物縮了手，往前就走，只聽得噹的一聲響。八戒道：「築破甲了。」行者也現本相看處，原來是冰盤大小兩個魚鱗。喝聲：「趕上。」二人跳到空中。那怪物因來赴會，不曾帶得兵器，空手在雲端裡問道：「你是那方和尚，到此欺人，破了我的香火，壞了我的名聲？」行者道：「這潑物原來不知。我等乃東土大唐聖僧三藏奉欽差西天取經之徒弟。昨因夜寓陳家，聞有邪魔，假號靈感，年年要童男女祭賽。是我等慈悲，拯救生靈，捉你這潑物。趁早實實供來：一年吃兩個童男女，你在這裡稱了幾年大王？吃了多少男女？一個個算還我，饒你死罪。」那怪聞言就走，被八戒又一釘鈀，未曾打著，他化一陣狂風，鑽入通天河內。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 130
        "line_end": 130
    "translation_ja": |-
      妖怪は有無を言わせず、手を伸ばして八戒をつかもうとした。八戒はぱっと飛び降り、本来の姿を現すと、釘鈀（ていは）を抜き、すかさず一撃を振り下ろした。妖怪は手を引っ込め、前へ逃げ出す。かん、と音がした。
      八戒「鎧を打ち壊したぞ。」
      悟空も本来の姿に戻って見ると、それは大皿ほどもある魚の鱗が二枚だった。
      悟空「追いかけろ！」
      二人は空へ跳び上がった。妖怪は供物を食べに来ただけなので、武器を持っていなかった。素手のまま雲の上で尋ねた。
      妖怪「お前たちは、どこの坊主だ。ここへ来て人を欺き、わしへの供養を絶やし、わしの名声を傷つけるとは！」
      悟空「この悪党、まだ知らなかったのか。俺たちは、東土（とうど）の大唐（だいとう）から、勅命を受けて西天（さいてん）へ経を取りに行く聖僧、三蔵（さんぞう）の弟子だ。昨夜、陳家に泊まり、霊感（れいかん）などと名乗る邪悪な魔物が、毎年、男の子と女の子を生け贄に要求すると聞いた。そこで俺たちが慈悲の心を起こし、人の命を救い、お前を捕らえてやることにしたんだ。さあ、さっさと正直に白状しろ。一年に子供を二人ずつ食って、ここで何年、大王を名乗った？　何人の子供を食ったんだ？　一人残らず勘定して俺に返せ。そうすれば命だけは助けてやる。」
      妖怪はそれを聞くと逃げ出した。八戒がもう一度、釘鈀を振るったが当たらず、妖怪は一陣の狂風になって通天河（つうてんが）へ潜り込んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch48-008"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "行者道：「不消趕他了，這怪想是河中之物。且待明日設法拿他，送我師父過河。」八戒依言，徑回廟裡，把那豬羊祭醴，連桌面一齊搬到陳家。此時唐長老、沙和尚，共陳家兄弟，正在廳中候信，忽見他二人將豬羊等物都丟在天井裡。三藏迎來問道：「悟空，祭賽之事何如？」行者將那稱名趕怪鑽入河中之事，說了一遍。二老十分歡喜，即命打掃廂房，安排床鋪，請他師徒就寢不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 132
        "line_end": 132
    "translation_ja": |-
      悟空「もう追わなくていい。あの妖怪は、どうやら川の中の生き物らしい。明日になったら捕らえる手を考えて、お師匠さまを川向こうへお送りしよう。」
      八戒はその言葉に従って廟へ戻り、豚や羊、祭りの酒を、卓の天板ごとすっかり陳家へ運んでいった。そのころ、三蔵と沙悟浄（さごじょう）は、陳家の兄弟と広間で知らせを待っていたが、突然、二人が豚や羊などを中庭へどさりと下ろすのを目にした。三蔵は迎えに出て尋ねた。
      三蔵「悟空、生け贄の件はどうなった？」
      悟空は、名前を答えてから妖怪を追い立て、川へ逃げ込まれた次第を、一通り話した。二人の老人は大いに喜び、すぐに脇の部屋を掃除して寝床を整えさせ、師弟を休ませた。こちらの話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-009"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那怪得命，回歸水內，坐在宮中，默默無言。水中大小眷族問道：「大王每年享祭，回來歡喜，怎麼今日煩惱？」那怪道：「常年享畢，還帶些餘物與汝等受用，今日連我也不曾吃得。造化低，撞著一個對頭，幾乎傷了性命。」眾水族問：「大王，是那個？」那怪道：「是一個東土大唐聖僧的徒弟，往西天拜佛求經者，假變男女，坐在廟裡。我被他現出本相，險些兒傷了性命。一向聞得人講：唐三藏乃十世修行好人，但得吃他一塊肉，延壽長生。不期他手下有這般徒弟。我被他壞了名聲，破了香火，有心要捉唐僧，只怕不得能夠。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 133
        "line_end": 133
    "translation_ja": |-
      さて、命拾いをした妖怪は水中へ戻り、宮殿に座って、黙り込んでいた。水の中の大小の眷族（けんぞく）たちが尋ねた。
      水の眷族たち「大王は毎年、供物を召し上がって、お喜びでお戻りになりますのに、今日はどうしてお悩みなのでございますか？」
      妖怪「いつもなら食い終わった後、お前たちの分も持って帰るところだが、今日はわし自身も食えなかった。運が悪くて手ごわい相手に出くわし、危うく命を落とすところだった。」
      水の眷族たち「大王、それは何者でございますか？」
      妖怪「東土大唐から、西天へ仏を拝み経を求めに行く聖僧の弟子だ。男の子と女の子に化けて、廟に座っていたのだが、本来の姿を現されて、わしは危うく命を落とすところだった。前から人の話で聞いていたが、唐三蔵（とうさんぞう）というのは十度の生を修行に励んだ善人で、その肉を一切れでも食えば、寿命が延びて長生きできるそうだ。あんな弟子を従えているとは、思いもよらなかった。名声を傷つけられ、供養を断たれたので、唐僧（とうそう）を捕らえたいとは思うが、果たしてできるかどうか。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-010"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那水族中閃上一個斑衣鱖婆，對怪物跬跬拜拜，笑道：「大王要捉唐僧，有何難處？但不知捉住他，可賞我些酒肉？」那怪道：「你若有謀，合同用力，捉了唐僧，與你拜為兄妹，共席享之。」鱖婆拜謝了道：「久知大王有呼風喚雨之神通，攪海翻江之勢力，不知可會降雪？」那怪道：「會降。」又道：「既會降雪，不知可會作冷結冰？」那怪道：「更會。」鱖婆鼓掌笑道：「如此，極易，極易。」那怪道：「你且將極易之功，講來我聽。」鱖婆道：「今夜有三更天氣，大王不必遲疑，趁早作法，起一陣寒風，下一陣大雪，把通天河盡皆凍結。著我等善變化者，變作幾個人形，在於路口，背包持傘，擔擔推車，不住的在冰上行走。那唐僧取經之心甚急，看見如此人行，斷然踏冰而渡。大王悄坐河心，待他腳蹤響處，迸裂寒冰，連他那徒弟們一齊墜落水中，一鼓可得也。」那怪聞言，滿心歡喜道：「甚妙，甚妙。」即出水府，踏長空，興風作雪，結冷凝凍成冰不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 134
        "line_end": 134
    "translation_ja": |-
      水の眷族の中から、斑模様の衣を着た鱖婆（けつば）が進み出た。妖怪に何度も礼をし、笑って言った。
      鱖婆「大王、唐僧を捕らえるのに、何の難しいことがございましょう。ただ、捕らえたら、私にも酒と肉を少しお恵みくださいますか？」
      妖怪「よい計略があるのなら、共に力を合わせよう。唐僧を捕らえた暁には、お前と義兄妹の契りを結び、同じ席で食わせてやる。」
      鱖婆は拝んで礼を述べた。
      鱖婆「大王には風を呼び雨を起こす神通力と、海をかき乱し川をひっくり返すお力がおありと、かねて存じております。雪もお降らせになれますか？」
      妖怪「降らせられる。」
      鱖婆「では、寒さを起こして氷を結ばせることも、おできになりますか？」
      妖怪「それもできる。」
      鱖婆は手を打って笑った。
      鱖婆「それなら、いとも簡単でございます。いとも簡単。」
      妖怪「その簡単な方法を、聞かせてみよ。」
      鱖婆「今夜は、まだ三更（さんこう）ほどの時間がございます。大王、ためらうことはありません。すぐに術を使い、寒風を起こして大雪を降らせ、通天河をすっかり凍らせてください。そして私どものうち変化の得意な者を数人の人間に化けさせ、道の入口で包みを背負ったり、傘を持ったり、荷を担いだり車を押したりして、絶えず氷の上を歩かせます。あの唐僧は経を取りに行く心がせいておりますから、人がそうして歩くのを見れば、必ず氷を踏んで渡るでしょう。大王は川の真ん中で静かに待ち、その足音が聞こえたところで厚い氷を割れば、弟子たちもろとも水へ落ちます。一挙に捕らえられるではございませんか。」
      妖怪は聞くと心から喜んだ。
      妖怪「見事だ、見事だ！」
      さっそく水の宮殿を出て大空へ上がり、風を起こして雪を降らせ、冷気で凍りつかせた。この話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-011"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說唐長老師徒四人歇在陳家，將近天曉，師徒們衾寒枕冷。八戒咳歌打戰睡不得，叫道：「師兄，冷啊。」行者道：「你這獃子，忒不長俊。出家人寒暑不侵，怎麼怕冷？」三藏道：「徒弟，果然冷。你看，就是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 136
        "line_end": 136
    "translation_ja": |-
      さて、三蔵たち師弟四人は陳家で休んでいたが、夜明け近くになると、掛け布団も枕も冷え切っていた。八戒はがたがた震え、うめいて眠れず、声を上げた。
      八戒「兄貴、寒いよ！」
      悟空「お前は本当に、いつまでたっても成長しない奴だな。出家した者は寒さ暑さに動じないものだ。どうして寒さを怖がる？」
      三蔵「いや、本当に寒いのだ。見れば、まさにこういうありさまだ。
    "translation_status": "reviewed"
  - "id": "xy-ch48-012"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": "重衾無暖氣，袖手似揣冰。此時敗葉垂霜蕊，蒼松掛凍鈴。地裂因寒甚，池平為水凝。漁舟不見叟，山寺怎逢僧。樵子愁柴少，王孫喜炭增。征人鬚似鐵，詩客筆如菱。皮襖猶嫌薄，貂裘尚恨輕。蒲團僵老衲，紙帳旅魂驚。繡被重裀褥，渾身戰抖鈴。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 137
        "line_end": 137
    "translation_ja": |-
      掛け布団を重ねても、ぬくもりはなく、
      袖に手を入れれば、氷を抱いているようだ。
      枯れ葉には霜の花が垂れ、
      青い松には、凍った鈴がぶら下がる。
      地はあまりの寒さに裂け、
      池は水が凍って平らになる。
      漁舟には老人の姿もなく、
      山寺で僧に出会えるはずもない。
      木こりは薪の少なさを憂え、
      貴公子は炭の増えるのを喜ぶ。
      旅ゆく人のひげは鉄のようになり、
      詩人の筆は菱の実のように固まる。
      皮の上着でも、まだ薄すぎると思い、
      貂の毛皮でも、まだ軽すぎると嘆く。
      座禅の敷物の上では老僧がこわばり、
      紙の帳の中では、旅人の魂もおののく。
      刺繍の掛け布団に、敷物も寝具も重ねたところで、
      全身は鈴のように、がたがた震える。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-013"

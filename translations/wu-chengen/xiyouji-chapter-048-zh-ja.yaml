  - "id": "xy-ch48-016"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "師徒們嘆玩多時，只見陳家老者，著兩個僮僕掃開道路，又兩個送出熱湯洗面。須臾，又送滾茶、乳餅，又擡出炭火。俱到廂房，與師徒們敘坐。長老問道：「老施主，貴處時令，不知可分春夏秋冬？」陳老笑道：「此間雖是僻地，但只風俗人物，與上國不同；至於諸凡穀苗牲畜，都是同天共日，豈有不分四時之理？」三藏道：「既分四時，怎麼如今就有這般大雪，這般寒冷？」陳老道：「此時雖是七月，昨日已交白露，就是八月節了。我這裡常年八月間就有霜雪。」三藏道：「甚比我東土不同，我那裡交冬節方有之。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 144
        "line_end": 144
    "translation_ja": |-
      師弟がしばらく感心して眺めていると、陳家の老人が二人の召使いに道の雪を払わせ、別の二人に顔を洗う湯を持ってこさせた。まもなく熱い茶と乳餅（にゅうへい）を運ばせ、炭火も運び込ませた。一同は脇の部屋に集まり、師弟と座って話した。
      三蔵「ご主人、この土地の季節にも、春夏秋冬の区別はあるのでしょうか？」
      陳家の老人は笑って答えた。
      陳家の老人「ここは辺鄙な土地ではありますが、上国と違うのは風俗や人々の様子だけです。穀物の苗や家畜などは、すべて同じ天の下、同じ日を受けて育ちます。四季の区別がないはずはございません。」
      三蔵「四季があるのなら、今ごろどうして、こんな大雪が降り、これほど寒くなるのでしょう？」
      陳家の老人「今はまだ七月ですが、昨日すでに白露（はくろ）に入りましたから、八月の節になったのです。ここでは毎年、八月にはもう霜や雪がございます。」
      三蔵「私どもの東土とは、ずいぶん違いますね。あちらでは冬の節に入って、ようやくそうなるのです。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-017"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正話間，又見僮僕來安桌子，請吃粥。粥罷之後，雪比早間又大，須臾，平地有二尺來深。三藏心焦垂淚。陳老道：「老爺放心，莫見雪深憂慮。我舍下頗有幾石糧食，供養得老爺們半生。」三藏道：「老施主不知貧僧之苦。我當年蒙聖恩賜了旨意，擺大駕親送出關，唐王御手擎杯奉餞，問道：『幾時可回？』貧僧不知有山川之險，順口回奏：『只消三年，可取經回國。』自別後，今已七八個年頭，還未見佛面，恐違了欽限；又怕的是妖魔兇狠：所以焦慮。今日有緣得寓潭府，昨夜愚徒們略施小惠報答，實指望求一船隻渡河。不期天降大雪，道路迷漫，不知幾時才得功成回故土也。」陳老道：「老爺放心，正是多的日子過了，那裡在這幾日？且待天晴，化了冰，老拙傾家費產，必處置送老爺過河。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 145
        "line_end": 145
    "translation_ja": |-
      話していると、また召使いが卓を据えに来て、粥を勧めた。粥を食べ終えると、雪は朝よりさらに激しくなり、見る間に平地でも二尺（しゃく）ほどの深さになった。三蔵は心を焦がし、涙を流した。
      陳家の老人「お坊さま、ご安心ください。雪が深いからといって、心配なさることはありません。私の家には穀物が何石（こく）もございますから、皆さまに半生を過ごしていただけるほどです。」
      三蔵「ご主人には、私の苦しみがお分かりにならないのです。あの年、私は陛下のご恩を受け、勅命を賜りました。陛下は盛大な行列を整え、ご自身で関の外までお見送りになり、手ずから杯を掲げて餞別をくださって、『いつ帰れるのか』とお尋ねになりました。私は山河の険しさを知らず、つい『三年もあれば、経を取って国へ帰れます』と申し上げたのです。お別れしてから、今では七、八年にもなるのに、まだ仏のお顔を拝んでおりません。お定めの期限に背くのではないかと恐れ、また妖魔の凶暴さも怖い。それで焦っているのです。今日はご縁があってお屋敷に泊めていただき、昨夜は不肖の弟子たちが、ささやかな働きでご恩に報いました。本当は船を一艘お願いして、川を渡るつもりでいたのです。ところが思いもよらず大雪になり、道はすっかり埋もれてしまいました。いつになったら務めを果たし、故郷へ戻れるのでしょう。」
      陳家の老人「お坊さま、ご安心ください。これだけ長い日々を過ごされたのですから、今さら数日が何でございましょう。晴れて氷が解けるまでお待ちください。私は家の財産をすべて使ってでも、必ず手配をして、川を渡して差し上げます。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-018"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "只見一僮又請進早齋。到廳上吃畢。敘不多時，又午齋相繼而進。三藏見品物豐盛，再四不安道：「既蒙見留，只可以家常相待。」陳老道：「老爺，感蒙替祭救命之恩，雖逐日設筵奉款，也難酬難謝。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 147
        "line_end": 147
    "translation_ja": |-
      やがて一人の召使いが、また朝の精進料理を知らせに来た。広間で食事をすませ、さほど長く話さないうちに、昼の食事も続いて運ばれた。三蔵は、料理の豊富さに何度も恐縮した。
      三蔵「お泊めいただいているのですから、どうか普段のお食事だけで、おもてなしください。」
      陳家の老人「お坊さま、生け贄の身代わりを務め、命をお救いくださったご恩を思えば、毎日、宴を開いておもてなししても、お礼のしようがございません。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-019"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "此後大雪方住就有人行走。陳老見三藏不快，又打掃花園，大盆架火，請去雪洞裡閑耍散悶。八戒笑道：「那老兒忒沒算計。春二三月好賞花園，這等大雪，又冷，賞玩何物？」行者道：「獃子不知事。雪景自然幽靜：一則遊賞，二來與師父寬懷。」陳老道：「正是，正是。」遂此邀請到園。但見："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 148
        "line_end": 148
    "translation_ja": |-
      その後、ようやく大雪がやむと、人々が歩き始めた。陳家の老人は、三蔵の気分が晴れないのを見て、庭園も掃除させ、大きな火鉢に火をおこし、雪洞（せつどう）で遊んで気を紛らわせてはと誘った。八戒は笑った。
      八戒「あの爺さんも、考えが足りないな。庭を楽しむなら春の二月や三月だろう。こんな大雪で、そのうえ寒いのに、何を見て楽しむんだ？」
      悟空「馬鹿、何も分かっていないな。雪景色には、それなりの静かな趣がある。景色を楽しめるし、お師匠さまのお気持ちも晴れるだろう。」
      陳家の老人「さようでございます。まったくそのとおり。」
      こうして庭園へ案内された。その眺めは、こうだった。
    "translation_status": "reviewed"
  - "id": "xy-ch48-020"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": "景值三秋，風光如臘。蒼松結玉蕊，衰柳掛銀花。階下玉苔堆粉屑，窗前翠竹吐瓊芽。巧石山頭，養魚池內。巧石山頭，削削尖峰排玉筍；養魚池內，清清活水作冰盤。臨岸芙蓉嬌色淺，傍崖木槿嫩枝垂。秋海棠，全然壓倒；臘梅樹，聊發新枝。牡丹亭、海榴亭、丹桂亭，亭亭盡鵝毛堆積；放懷處、款客處、遣興處，處處皆蝶翅鋪漫。兩籬黃菊玉綃金，幾樹丹楓紅間白。無數閑庭冷難到，且觀雪洞冷如冰。那裡邊放一個獸面象足銅火盆，熱烘烘炭火才生；上下有幾張虎皮搭苫漆交椅，軟溫溫紙窗鋪設。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 150
        "line_end": 150
    "translation_ja": |-
      季節は秋のさなかなのに、景色は師走のようだ。
      青い松には玉の花が結び、衰えた柳には銀の花が掛かる。
      階段の下の苔には白粉の屑が積もり、
      窓の前の青竹には玉の芽が吹いている。
      趣向を凝らした石山の頂、魚を飼う池の中。
      石山の頂には、尖った峰々が玉の筍を並べたように立ち、
      魚の池では、澄んだ流れる水が氷の盤になっていた。
      岸に臨む芙蓉（ふよう）の艶やかな色は薄れ、
      崖に寄り添う木槿（むくげ）の若枝は垂れ下がる。
      秋海棠（しゅうかいどう）はすっかり押し倒され、
      臘梅（ろうばい）の木は、かすかに新しい枝を出している。
      牡丹亭（ぼたんてい）、海榴亭（かいりゅうてい）、丹桂亭（たんけいてい）、どの亭にも鵞鳥の羽が積もったよう。
      心を解き放つ所、客をもてなす所、興を楽しむ所、
      どこもかしこも、蝶の翅を敷きつめたよう。
      二筋の垣根の黄菊は、金に玉色の薄絹をかぶせたようになり、
      何本かの紅葉した楓は、紅の間に白を交える。
      数々の静かな庭は、寒くて足を運びかねる。
      ひとまず雪洞を見れば、氷のように冷たい。
      その中には、獣面と象の脚をかたどった銅の火鉢が一つ。
      今おこしたばかりの炭火が、ほかほかと熱を放つ。
      上座にも下座にも、虎の皮を掛けた漆塗りの交椅が数脚並び、
      紙を張った窓が、やわらかく暖かな室内を作っている。
    "translation_status": "reviewed"
  - "id": "xy-ch48-021"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "四壁上掛幾軸名公古畫，卻是那："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 152
        "line_end": 152
    "translation_ja": "四方の壁には、名家の古画が何幅か掛けられていた。描かれていたのは、こうしたものだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch48-022"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": "七賢過關，寒江獨釣，疊嶂層巒團雪景；蘇武餐氈，折梅逢使，瓊林玉樹寫寒文。說不盡那：家近水亭魚易買，雪迷山徑酒難沽。真個可堪容膝處，算來何用訪蓬壺？"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 154
        "line_end": 154
    "translation_ja": |-
      七賢（しちけん）が関を越える図、寒い川でひとり釣りをする図。
      幾重もの峰と山並みが、雪景色を形作る。
      蘇武が毛氈を食べる図、梅を折って使者に出会う図。
      玉の林、玉の木々が、寒さの模様を描き出す。
      尽くしきれぬ趣がある。
      家が水辺の亭に近ければ、魚は買いやすいが、
      雪で山道が分からなくなれば、酒は買いにくい。
      身を落ち着けるには、まことに十分な所。
      考えてみれば、蓬壺（ほうこ）を訪ねる必要など、どこにあろう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-023"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "眾人觀玩良久，就於雪洞裡坐下，對鄰叟道取經之事，又捧香茶飲畢。陳老問：「列位老爺，可飲酒麼？」三藏道：「貧僧不飲，小徒略飲幾杯素酒。」陳老大喜，即命：「取素果品，燉暖酒，與列位湯寒。」那僮僕即擡桌圍爐，與兩個鄰叟，各飲了幾杯，收了家火。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 155
        "line_end": 155
    "translation_ja": |-
      一同は長いこと景色や絵を楽しみ、雪洞に腰を下ろすと、近所の老人たちに取経の話をし、香りのよい茶もいただいた。陳家の老人が尋ねた。
      陳家の老人「皆さま、お酒は召し上がりますか？」
      三蔵「私は飲みませんが、弟子たちは素酒（そしゅ）を少々いただきます。」
      陳家の老人は大喜びし、すぐに命じた。
      陳家の老人「精進の果物や菓子を持ってきて、酒を温めなさい。皆さまに寒さを払っていただこう。」
      召使いは卓を運んで火鉢を囲ませ、二人の近所の老人も交えて、それぞれ数杯ずつ飲んだ。その後、道具を片づけた。
    "translation_status": "reviewed"
  - "id": "xy-ch48-024"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "不覺天色將晚，又仍請到廳上晚齋。只聽得街上行人都說：「好冷天啊，把通天河凍住了。」三藏聞言道：「悟空，凍住河，我們怎生是好？」陳老道：「乍寒乍冷，想是近河邊淺水處凍結。」那行人道：「把八百里都凍的似鏡面一般，路口上有人走哩。」三藏聽說有人走，就要去看。陳老道：「老爺莫忙，今日晚了，明日去看。」遂此別卻鄰叟。又晚齋畢，依然歇在廂房。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 157
        "line_end": 157
    "translation_ja": |-
      いつしか夕方になり、一同はまた広間の夕食へ招かれた。すると、通りを行く人々が口々に言うのが聞こえた。
      通行人たち「なんて寒さだ。通天河が凍りついたぞ。」
      それを聞いて三蔵が言った。
      三蔵「悟空、川が凍ってしまったら、私たちはどうすればよいのだ？」
      陳家の老人「急に寒くなりましたから、川岸に近い浅い所が凍ったのでございましょう。」
      通行人「八百里全部が、鏡のように凍ったんですよ。道の入口では、もう人が歩いています。」
      人が歩いていると聞くと、三蔵は見に行こうとした。
      陳家の老人「お坊さま、お急ぎにならず。今日はもう遅いですから、明日ご覧になればよろしい。」
      そこで近所の老人たちと別れ、夕食をすませると、また脇の部屋で休んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch48-025"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "及次日天曉，八戒起來道：「師兄，今夜更冷，想必河凍住也。」三藏迎著門，朝天禮拜道：「眾位護教大神，弟子一向西來，虔心拜佛，苦歷山川，更無一聲報怨。今至於此，感得皇天佑助，結凍河水。弟子空心權謝，待得經回，奏上唐皇，竭誠酬答。」禮拜畢，遂教悟淨背馬，趁冰過河。陳老又道：「莫忙，待幾日雪融冰解，老拙這裡辦船相送。」沙僧道：「就行也不是話，再住也不是話。口說無憑，耳聞不如眼見。我背了馬，且請師父親去看看。」陳老道：「言之有理。」教：「小的們，快去背我們六匹馬來。且莫背唐僧老爺馬。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 158
        "line_end": 158
    "translation_ja": |-
      翌朝、夜が明けると、八戒が起き上がって言った。
      八戒「兄貴、今夜はもっと寒かったな。きっと川は凍りついただろう。」
      三蔵は戸口に向かい、天を仰いで礼拝した。
      三蔵「仏の教えを守る大神の皆さま。弟子の私は西へ向かう間、心から仏を拝むことを願い、山河を越える苦しみにも、一言も不平を申さず参りました。今ここに至って、天のお助けをいただき、川の水が凍りました。ひとまず供物もなしにお礼を申し上げます。経を得て戻りましたら、唐の皇帝に申し上げ、心を尽くしてお礼をいたします。」
      礼拝を終えると、沙悟浄に馬の鞍を置かせ、氷の上を渡ろうとした。陳家の老人はまた言った。
      陳家の老人「お急ぎにならず。あと数日待って、雪と氷が解けましたら、私どもで船をご用意し、お送りいたします。」
      沙悟浄「今すぐ行くというのも、ここにとどまるというのも、これでは話が決まりません。口で言うだけでは根拠がなく、耳で聞くより、自分の目で見るに限ります。私が馬に鞍を置きますから、まずお師匠さまに、じかにご覧いただきましょう。」
      陳家の老人「おっしゃるとおりです。」
      陳家の老人は命じた。
      陳家の老人「皆、早くうちの六頭の馬に鞍を置いて連れてきなさい。唐僧さまの馬には、まだ鞍を置かなくてよい。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-026"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "就有六個小价跟隨。一行人徑往河邊來看，真個是："
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 160
        "line_end": 160
    "translation_ja": "さっそく六人の召使いが付き従い、一行は川辺へ見に出かけた。まことに、こんな眺めだった。"
    "translation_status": "reviewed"
  - "id": "xy-ch48-027"
    "section_id": "chapter-48"
    "kind": "verse"
    "origin": "source"
    "source_text": "雪積如山聳，雲收破曉晴。寒凝楚塞千峰瘦，冰結江湖一片平。朔風凜凜，滑凍稜稜。池魚偎密藻，野鳥戀枯槎。塞外征夫俱墜指，江頭梢子亂敲牙。裂蛇腹，斷鳥足，果然冰山千百尺。萬壑冷浮銀，一川寒浸玉。東方自信出僵蠶，北地果然有鼠窟。王祥臥，光武渡，一夜溪橋連底固。曲沼結凌層，深淵重疊沍。通天闊水更無波，皎潔冰漫如陸路。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 162
        "line_end": 162
    "translation_ja": |-
      積もった雪は山のようにそびえ、
      雲は引き、明け方の空は晴れわたる。
      寒さに凍る楚の辺境では、千の峰が痩せ細り、
      氷に閉ざされた川と湖は、一面平らになっている。
      北風は凛々と吹き、滑らかな氷は角立っている。
      池の魚は茂った藻に身を寄せ、野の鳥は枯れ枝を離れない。
      国境の外の兵士たちは、皆、指が凍えて落ち、
      川辺の船頭たちは、しきりに歯をかちかち鳴らす。
      蛇の腹も裂け、鳥の足も折れる寒さ。
      氷の山は、まさに千尺、百尺にもなる。
      幾万の谷には冷たく銀が浮かび、川全体は寒々と玉に浸る。
      東方に僵蚕（きょうさん）が出るというのも、いかにも確かなことと思われ、
      北の地の氷には、なるほど鼠の穴もありそうだ。
      王祥（おうしょう）が横たわり、光武帝（こうぶてい）が渡った氷。
      一夜のうちに、谷川の橋は底まで固まる。
      曲がりくねる沼には氷の層が結び、深い淵も重なり合って凍りつく。
      通天河の広い流れに、もはや波はなく、
      清く白い氷が広がって、陸の道のようになっている。
    "translation_status": "reviewed"
  - "id": "xy-ch48-028"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏與一行人到了河邊，勒馬觀看，真個那路口上有人行走。三藏問道：「施主，那些人上冰往那裡去？」陳老道：「河那邊乃西梁女國。這起人都是做買賣的。我這邊百錢之物，到那邊可值萬錢；那邊百錢之物，到這邊亦可值萬錢。利重本輕，所以人不顧死生而去。常年家有五七人一船，或十數人一船，飄洋而過。見如今河道凍住，故捨命而步行也。」三藏道：「世間事惟名利最重。似他為利的，捨死忘生；我弟子奉旨全忠，也只是為名，與他能差幾何？」教：「悟空，快回施主家收拾行囊，叩背馬匹，趁此層冰，早奔西方去也。」行者笑吟吟答應。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 163
        "line_end": 163
    "translation_ja": |-
      三蔵たち一行は川辺に着くと、馬を止めて眺めた。確かに、道の入口では人が歩いている。三蔵は尋ねた。
      三蔵「ご主人、あの人たちは氷に上がって、どちらへ行くのですか？」
      陳家の老人「川の向こうは、西梁女国（せいりょうじょこく）でございます。あの人たちは皆、商売をする者です。こちらで百銭（せん）の品が、あちらでは一万銭になりますし、あちらで百銭の品も、こちらでは一万銭になります。元手が少なくて利益が大きいので、人々は命も顧みずに出かけるのです。例年は五、七人ほど、あるいは十数人で一艘の船に乗り、波を越えて渡ります。今は川が凍ったので、命がけで歩いているのでございます。」
      三蔵「世の中では、名と利ほど重く見られるものはない。あの者たちは利のために、生死を忘れて危険を冒す。弟子の私が勅命を奉じて忠義を尽くすのも、結局は名のためだ。あの者たちと、どれほど違うというのだろう。」
      三蔵は命じた。
      三蔵「悟空、早くご主人の家へ戻り、荷物をまとめ、馬の鞍をしっかり置きなさい。この厚い氷を伝って、早々に西へ進むのだ。」
      悟空はにこにこしながら承知した。
    "translation_status": "reviewed"
  - "id": "xy-ch48-029"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "沙僧道：「師父啊，常言道：『千日吃了千升米。』今已託賴陳府上，且再住幾日，待天晴化凍，辦船而過，忙中恐有錯也。」三藏道：「悟淨，怎麼這等愚見？若是正二月，一日暖似一日，可以待得凍解；此時乃八月，一日冷似一日，如何可便望解凍？卻不又誤了半載行程？」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 165
        "line_end": 165
    "translation_ja": |-
      沙悟浄「お師匠さま、世間でも『千日いれば、米を千升（しょう）食う』と言います。せっかく陳家のお世話になっているのですから、もう数日お泊まりになり、晴れて氷が解けたら船を整えて渡りましょう。慌てると間違いが起こりかねません。」
      三蔵「悟浄（ごじょう）、どうしてそんな愚かなことを言うのだ。正月や二月なら、日ごとに暖かくなるから、氷が解けるのを待てもしよう。しかし今は八月で、日ごとに寒くなるのだぞ。すぐ解けるなどと、どうして望める。そうなれば、また半年、旅が遅れるではないか。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-030"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "八戒跳下馬來：「你們且休講閑口，等老豬試看有多少厚薄。」行者道：「獃子，前夜試水，能去拋石；如今冰凍重漫，怎生試得？」八戒道：「師兄不知。等我舉釘鈀鈀他一下。假若築破，就是冰薄，且不敢行；若築不動，便是冰厚，如何不行？」三藏道：「正是，說得有理。」那獃子撩衣拽步，走上河邊，雙手舉鈀，盡力一築，只聽撲的一聲，築了九個白跡，手也振得生疼。獃子笑道：「去得，去得，連底都錮住了。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 166
        "line_end": 166
    "translation_ja": |-
      八戒は馬から飛び降りた。
      八戒「みんな、無駄話はやめてくれ。俺がどれくらい厚いか、試してみよう。」
      悟空「馬鹿、一昨日の晩に水を調べたときは、石を投げればよかった。だが今は氷が幾重にも張っている。どうやって調べる？」
      八戒「兄貴には分からないんだな。俺が釘鈀を持ち上げて、一発打ってみる。割れれば氷が薄いから、まだ渡っちゃいけない。びくともしなければ厚いんだ。どうして渡れないことがある？」
      三蔵「そうだ。その言うとおりだ。」
      八戒は衣をまくって大股に歩き、川べりへ出ると、両手で釘鈀を振り上げ、力いっぱい打ち込んだ。ぼん、と音がして、白い歯跡が九つついただけで、手まで衝撃でひどく痛んだ。八戒は笑って言った。
      八戒「行ける、行ける。底まですっかり固まっているぞ。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-031"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "三藏聞言，十分歡喜，與眾同回陳家，只教收拾走路。那兩個老者苦留不住，只得安排些乾糧、烘炒，做些燒餅、饝饝相送。一家子磕頭禮拜，又捧出一盤子散碎金銀，跪在面前道：「多蒙老爺活子之恩，聊表途中一飯之敬。」三藏擺手搖頭，只是不受道：「貧僧出家人，財帛何用？就途中也不敢取出，只是以化齋度日為正事。收了乾糧足矣。」二老又再三央求，行者用指尖兒捻了一小塊，約有四五錢重，遞與唐僧道：「師父，也只當些襯錢，莫教空負二老之意。」"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 168
        "line_end": 168
    "translation_ja": |-
      三蔵はそれを聞いて大喜びし、皆と陳家へ戻ると、ひたすら旅支度をするよう命じた。二人の老人は懸命に引き止めたが、かなわず、仕方なく携帯食や炒った食べ物を用意し、焼餅（しょうへい）や饝饝（もも）を作って持たせた。一家はそろって頭を下げ、さらに小さな金銀の塊を盛った盆を差し出して、目の前にひざまずいた。
      一家「子供たちの命をお救いくださり、まことにありがとうございます。せめて道中の一食の足しにと、心ばかりのお礼でございます。」
      三蔵は手を振り、首を振って、どうしても受け取らなかった。
      三蔵「私は出家の身です。財貨が何の役に立ちましょう。旅の途中でも、持ち出して使うわけにはまいりません。ただ食事の施しをいただいて日々を送るのが、本来の務めです。携帯食をいただくだけで十分です。」
      二人の老人がなお繰り返し頼むので、悟空は指先で四、五銭ほどの重さの小さな塊を一つつまみ、三蔵へ渡した。
      悟空「お師匠さま、少しの襯銭（しんせん）だと思ってお受け取りください。お二人のお気持ちを、むなしくなさらないように。」
    "translation_status": "reviewed"
  - "id": "xy-ch48-032"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "遂此相向而別，徑至河邊冰上，那馬蹄滑了一滑，險些兒把三藏跌下馬來。沙僧道：「師父，難行。」八戒道：「且住，問陳老官討個稻草來我用。」行者道：「要稻草何用？」八戒道：「你那裡得知？要稻草包著馬蹄方才不滑，免教跌下師父來也。」陳老在岸上聽言，急命人家中取一束稻草，卻請唐僧上岸下馬。八戒將草包裹馬足，然後踏冰而行。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 169
        "line_end": 169
    "translation_ja": |-
      こうして互いに別れを告げ、川辺の氷の上へ進むと、馬の蹄がつるりと滑り、三蔵は危うく落馬するところだった。
      沙悟浄「お師匠さま、これは歩きにくいですね。」
      八戒「ちょっと待ってくれ。陳のご隠居に稲藁をもらって、俺に使わせてくれ。」
      悟空「稲藁を何に使うんだ？」
      八戒「兄貴には分からんだろうな。藁で馬の蹄を包めば、ようやく滑らなくなる。お師匠さまを落とさずにすむんだよ。」
      岸にいた陳家の老人はそれを聞き、急いで人を家へやって、稲藁を一束持ってこさせた。そして三蔵に岸へ戻って馬から降りてもらい、八戒が藁で馬の足を包んだ。それから、氷を踏んで進み始めた。
    "translation_status": "reviewed"
  - "id": "xy-ch48-033"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "別陳老離河邊，行有三四里遠近，八戒把九環錫杖遞與唐僧道：「師父，你橫此在馬上。」行者道：「這獃子奸詐。錫杖原是你挑的，如何又叫師父拿著？」八戒道：「你不曾走過冰凌，不曉得。凡是冰凍之上，必有凌眼；倘或屣著凌眼，脫將下去，若沒橫擔之物，骨都的落水，就如一個大鍋蓋蓋住，如何鑽得上來？須是如此架住方可。」行者暗笑道：「這獃子倒是個積年走冰的。」果然都依了他：長老橫擔著錫杖，行者橫擔著鐵棒，沙僧橫擔著降妖寶杖，八戒肩挑著行李，腰橫著釘鈀，師徒們放心前進。這一直行到天晚，吃了些乾糧。卻又不敢久停，對著星月光華，觀的冰凍上亮灼灼，白茫茫，只情奔走，果然是馬不停蹄。師徒們莫能合眼，走了一夜。天明又吃些乾糧，望西又進。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 171
        "line_end": 171
    "translation_ja": |-
      陳家の老人と別れて岸を離れ、三、四里ほど進むと、八戒が九環錫杖（きゅうかんしゃくじょう）を三蔵に渡した。
      八戒「お師匠さま、馬の上でこれを横にしてお持ちください。」
      悟空「この馬鹿、ずるいぞ。錫杖（しゃくじょう）はもともとお前が担ぐはずなのに、どうしてお師匠さまに持たせるんだ？」
      八戒「兄貴は氷の上を歩いたことがないから、分からないんだ。凍ったところには必ず凌眼（りょうがん）がある。もし凌眼を踏んで抜け落ちたとき、横に渡す物がなければ、どぶんと水に落ちてしまう。大きな鍋の蓋をかぶせられたようなもので、どうして上へ抜け出せる？　こうして支えを渡しておかなきゃいけないんだ。」
      悟空はひそかに笑って思った。
      悟空「この馬鹿、なかなか年季の入った氷歩きじゃないか。」
      結局、皆が八戒に従った。三蔵は錫杖を横に渡し、悟空は鉄棒を、沙悟浄は降妖宝杖（ごうようほうじょう）を横に構えた。八戒は荷物を肩に担ぎ、腰に釘鈀を横に当てた。師弟は安心して前へ進み、夕方までずっと歩いてから、携帯食を少し食べた。それでも長くは止まっていられず、星と月の光を受けて、氷がきらきらと白く広がるのを見ながら、ひたすら急いだ。まさに馬の蹄を休める間もない。師弟は目を閉じることもできず、一晩じゅう歩き通した。夜が明けると、また携帯食を少し食べ、西へ向かって進んだ。
    "translation_status": "reviewed"
  - "id": "xy-ch48-034"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "正行時，只聽得冰底下撲喇喇一聲響喨，險些兒諕倒了白馬。三藏大驚道：「徒弟呀！怎麼這般響喨？」八戒道：「這河忒也凍得結實，地凌響了。或者這半中間連底通錮住了也。」三藏聞言，又驚又喜，策馬前進，趲行不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 172
        "line_end": 172
    "translation_ja": |-
      歩いていると、不意に氷の底から、ばりばりと大きな音がして、白馬が驚いて倒れそうになった。三蔵はひどく驚いて言った。
      三蔵「お前たち、どうしてこんな大きな音がするのだ？」
      八戒「川があまりにも固く凍ったから、底の氷が鳴ったんですよ。この真ん中あたりは、底まで全部、氷で固まっているのかもしれません。」
      三蔵はそれを聞いて、驚きながらも喜び、馬をせき立て、急ぎ足で先へ進んだ。この話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-035"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說那妖邪自從回歸水府，引眾精在於冰下。等候多時，只聽得馬蹄響處，他在底下弄個神通，滑喇的迸開冰凍。慌得孫大聖跳上空中；早把那白馬落於水內，三人盡皆脫下。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 174
        "line_end": 174
    "translation_ja": "さて、妖怪は水の宮殿へ戻ってから、配下の妖怪たちを率いて氷の下に潜んでいた。長いこと待っていると、馬の蹄の音が聞こえた。そこで下から神通力を使い、ばりんと氷を割った。悟空は慌てて空へ跳び上がったが、その間に白馬は水へ落ち、残る三人もそろって落ち込んでしまった。"
    "translation_status": "reviewed"
  - "id": "xy-ch48-036"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "那妖邪將三藏捉住，引群精徑回水府，厲聲高叫：「鱖妹何在？」老鱖婆迎門施禮道：「大王，不敢，不敢。」妖邪道：「賢妹何出此言？『一言既出，駟馬難追。』原說聽從汝計，捉了唐僧，與你拜為兄妹。今日果成妙計，捉了唐僧，就好昧了前言？」教：「小的們，擡過案桌，磨快刀來，把這和尚剖腹剜心，剝皮剮肉；一壁廂響動樂器：與賢妹共而食之，延壽長生也。」鱖婆道：「大王，且休吃他，恐他徒弟們尋來吵鬧。且寧耐兩日，讓那廝不來尋，然後剖開，請大王上坐，眾眷族環列，吹彈歌舞，奉上大王，從容自在享用，卻不好也？」那怪依言，把唐僧藏於宮後，使一個六尺長的石匣蓋在中間不題。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 176
        "line_end": 176
    "translation_ja": |-
      妖怪は三蔵を捕らえると、配下たちを連れて水の宮殿へまっすぐ戻り、鋭い声で呼ばわった。
      妖怪「鱖妹（けつまい）は、どこにいる？」
      年老いた鱖婆は、門で迎えて礼をした。
      鱖婆「大王、とんでもございません。そのように呼んでいただくなど。」
      妖怪「妹よ、なぜそんなことを言う。『一度口にした言葉は、四頭立ての馬車でも追いつけぬ』のだ。お前の計略に従って唐僧を捕らえたら、義兄妹の契りを結ぶと、もとより言っておいたではないか。今日、その妙計が確かに実って唐僧を捕らえたのに、前の言葉を反故にできようか。」
      妖怪は命じた。
      妖怪「お前たち、俎板を載せる台を運び、よく研いだ刀を持ってこい。この坊主の腹を裂き、心臓をえぐり、皮を剝いで肉を削げ。そのかたわらで楽器を奏でよ。妹と共に食って、寿命を延ばし、長生きするのだ。」
      鱖婆「大王、まだお召し上がりにならないでください。弟子たちが捜しに来て、騒ぐかもしれません。二日ほど辛抱して、あいつらが捜しに来なくなってから、腹をお裂きになっては。それから大王に上座へお着きいただき、眷族を周りに並ばせ、笛や弦を奏で、歌や舞をお見せして、大王に差し上げるのです。ゆっくり心ゆくまで味わうほうが、よろしいのではございませんか？」
      妖怪はその言葉に従い、三蔵を宮殿の奥へ隠し、長さ六尺の石の箱をかぶせて、その中へ閉じ込めた。こちらの話は、ひとまず置こう。
    "translation_status": "reviewed"
  - "id": "xy-ch48-037"
    "section_id": "chapter-48"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "卻說八戒、沙僧在水裡撈著行囊，放在白馬身上馱了，分開水路，湧浪翻波，負水而出。只見行者在半空中看見，問道：「師父何在？」八戒道：「師父姓陳，名到底了。如今沒處找尋，且上岸再作區處。」原來八戒本是天蓬元帥臨凡，他當年掌管天河八萬水兵大眾；沙和尚是流沙河內出身；白馬本是西海龍孫：故此能知水性。大聖在空中指引，須臾，回轉東崖，曬刷了馬匹，紾掠了衣裳。大聖雲頭按落，一同到於陳家莊上。早有人報與二老道：「四個取經的老爺，如今只剩了三個來也。」兄弟即忙接出門外，果見衣裳還濕，道：「老爺們，我等那般苦留，卻不肯住，只要這樣方休。怎麼不見三藏老爺？」八戒道：「不叫做三藏了，改名叫做陳到底也。」二老垂淚道：「可憐！可憐！我說等雪融備船相送，堅執不從，致令喪了性命。」行者道：「老兒，莫替古人耽憂。我師父管他不死長命。老孫知道，決然是那靈感大王弄法算計去了。你且放心，與我們漿漿衣服，曬曬關文，取草料餵著白馬。等我弟兄尋著那廝，救出師父，索性剪草除根，替你一莊人除了後患，庶幾永遠得安生也。」陳老聞言，滿心歡喜，即命安排齋供。"
    "source_languages":
      - "zh-Hant"
    "source_locations":
      - "source_id": "wikisource-xiyou-ch48-1808610"
        "precision": "line"
        "url": "https://zh.wikisource.org/w/index.php?title=西遊記/第048回&oldid=1808610"
        "line_start": 177
        "line_end": 177
    "translation_ja": |-
      一方、八戒と沙悟浄は水の中で荷物を拾い上げ、白馬の背に載せて担がせると、水を左右に開き、波を盛り上げ、ひっくり返しながら、水面へ浮かび出た。悟空は空からそれを見て尋ねた。
      悟空「お師匠さまは、どこだ？」
      八戒「お師匠さまは、姓が陳（ちん）、名が到底（とうてい）になっちまった。今は捜しようがない。ひとまず岸に上がって、どうするか考えよう。」
      もともと八戒は、天蓬元帥（てんぽうげんすい）が下界へ降りてきた者で、かつて天河（てんが）の八万の水兵を率いていた。沙悟浄は流沙河（りゅうさが）から出てきた者であり、白馬は西海（さいかい）の竜の子である。だから水中の術を心得ていたのだ。悟空が空から道を示すと、ほどなく東の岸へ戻った。馬の体をこすって乾かし、衣を絞って整えた。悟空も雲から降り、共に陳家荘へ向かった。早くも知らせに来た者が、二人の老人に告げた。
      知らせに来た者「経を取りに行く四人のお坊さまが、今度は三人だけでお戻りです。」
      兄弟は急いで門の外へ迎えに出た。見れば、確かに衣がまだ濡れている。
      陳澄と陳清「皆さま、私どもがあれほどお引き止めしたのに、お泊まりにならず、こうならないとお気がすまなかったのでございますか。どうして三蔵さまがお見えにならないのです？」
      八戒「もう三蔵じゃないよ。陳到底（ちんとうてい）と改名したんだ。」
      二人の老人は涙を流した。
      陳澄と陳清「お気の毒に、何ということを。雪が解けてから船を用意してお送りすると申しましたのに、どうしてもお聞き入れにならず、ついにお命を落とされてしまった。」
      悟空「爺さん、余計な心配をするな。お師匠さまは死なずに長生きする。俺には分かっている。きっとあの霊感大王が術を使い、計略にかけて連れていったんだ。安心して、俺たちの衣を洗って糊をつけ、通行証を乾かし、白馬に飼葉をやってくれ。俺たち兄弟であいつを捜し出し、お師匠さまを救ってくる。ついでに根こそぎ退治して、村じゅうの人の後々の憂いも取り除けば、この先ずっと、安心して暮らせるだろう。」
      陳家の老人はそれを聞いて、心から喜び、すぐに精進料理を用意させた。
    "translation_status": "reviewed"

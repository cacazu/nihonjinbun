    "translation_ja": |-
      師弟は皆眠れず、起き上がって衣を着た。戸を開けて見ると、おや、外は一面真っ白。なんと雪が降っているのだった。
      悟空「道理で、みんな寒がるわけだ。こんな大雪だったのか。」
      四人はそろって眺めた。見事な雪だ。そのありさまは、こうだった。

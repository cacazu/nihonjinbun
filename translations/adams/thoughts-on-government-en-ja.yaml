      ],
      "source_text": "PHILADELPHIA: PRINTED BY JOHN DUNLAP. M, DCC, LXXVI.",
      "translation_ja": "フィラデルフィア、ジョン・ダンラップ印刷。一七七六年。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-003",
      "section_id": "letter",
      "kind": "heading",

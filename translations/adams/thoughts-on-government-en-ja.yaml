      "source_text": "THOUGHTS ON GOVERNMENT: APPLICABLE TO THE PRESENT STATE OF THE AMERICAN COLONIES. In a LETTER from a GENTLEMAN To his FRIEND.",
      "translation_ja": "統治についての考察、アメリカ植民地の現状に即して。ある紳士から友人に宛てた手紙",
      "translation_status": "reviewed"
    },
    {

          "printed_page": "[3]",
          "printed_page_end": "[3]",
          "source_sequence": 3
        }
      ],
      "source_text": "THOUGHTS ON GOVERNMENT, &c.",
      "translation_ja": "統治についての考察、云々",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-004",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "[3]",
          "printed_page_end": "[3]",
          "source_sequence": 4
        }
      ],
      "source_text": "My dear Sir,",
      "translation_ja": "親愛なる友よ、",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-005",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "[3]",
          "printed_page_end": "[3]",
          "source_sequence": 5
        }
      ],
      "source_text": "IF I was equal to the task of forming a plan for the government of a colony, I should be flattered with your request, and very happy to comply with it; because as the divine science of politicks is the science of social happiness, and the blessings of society depend entirely on the constitutions of government, which are generally institutions that last for many generations, there can be no employment more agreeable to a benevolent mind, than a research after the best.",
      "translation_ja": "一植民地の統治の仕組みを案出するだけの力量が私にありましたら、あなたのご依頼を光栄に思い、喜んでお引き受けするところです。政治という尊い学問が探究するのは社会の幸福です。社会がもたらす恩恵はひとえに統治の仕組みにかかっており、その仕組みはひとたび定まれば、たいていは幾世代にもわたって続きます。ですから、人の幸せを願う者にとって、最良の仕組みを求めるほど心にかなう仕事はありません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-006",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "4",
          "printed_page_end": "4",
          "source_sequence": 6
        }
      ],
      "source_text": "POPE flattered tyrants too much when he said",
      "translation_ja": "ポープはこう歌いましたが、あれは暴君にへつらいすぎです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-007",
      "section_id": "letter",
      "kind": "verse",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "4",
          "printed_page_end": "4",
          "source_sequence": 7
        }
      ],
      "source_text": "\"For forms of government let fools contest,\n\"That which is best administered is best.\"",
      "translation_ja": "「政体のよしあしなど、愚か者に争わせておけ。\nいちばんよく治められる国の政体が、いちばんなのだ。」",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-008",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "4",
          "printed_page_end": "4",
          "source_sequence": 8
        }
      ],
      "source_text": "Nothing can be more fallacious than this: But poets read history to collect flowers not fruits—they attend to fanciful images, not the effects of social institutions. Nothing is more certain from the history of nations, and the nature of man, than that some forms of government are better fitted for being well administered than others.",
      "translation_ja": "これほど当てにならない言葉もありません。もっとも、詩人が歴史を読むのは、実を採るためではなく、花を摘むためです。目を留めるのは心を誘う情景であって、社会の制度が何をもたらすかではありません。よい政治を行いやすい政体と、そうでない政体がある。諸国の歴史と人間の本性が教えることに、これほど確かなことはありません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-009",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "4",
          "printed_page_end": "5",
          "source_sequence": 9
        }
      ],
      "source_text": "WE ought to consider, what is the end of government, before we determine which is the best form.—Upon this point all speculative politicians will agree, that the happiness of society is the end of government, as all Divines and moral Philosophers will agree that the happiness of the individual is the end of man. From this principle it will follow, that the form of government, which communicates ease, comfort, security, or in one word happiness to the greatest number of persons, and in the greatest degree, is the best.",
      "translation_ja": "どの政体が最良かを決める前に、そもそも何のために国を治めるのかを考えるべきです。この点については、神学者や道徳哲学者がみな、一人ひとりの幸福を人間の生きる目的と認めるように、政治を理論の面から考える人たちもみな、社会の幸福こそ統治の目的だと認めるでしょう。それならば、できるだけ多くの人に、できるだけ大きな安らぎと暮らしの快適さと安全を、ひと言でいえば幸福をもたらす政体こそが、最良だということになります。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-010",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "5",
          "printed_page_end": "5",
          "source_sequence": 10
        }
      ],
      "source_text": "ALL sober enquirers after truth, ancient and modern, Pagan and Christian, have declared that the happiness of man, as well as his dignity consists in virtue. Confucius, Zoroaster, Socrates, Mahomet, not to mention authorities really sacred, have agreed in this.",
      "translation_ja": "古今を問わず、異教徒であれキリスト教徒であれ、真理を真剣に求めた人はみな、人間の幸福はその尊厳と同じく、徳にあると言っています。真に神聖な権威を持ち出すまでもなく、孔子もゾロアスターも、ソクラテスもムハンマドも、この点では一致しています。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-011",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "5",
          "printed_page_end": "6",
          "source_sequence": 11
        }
      ],
      "source_text": "IF there is a form of government then, whose principle and foundation is virtue, will not every sober man acknowledge it better calculated to promote the general happiness than any other form?",
      "translation_ja": "それなら、徳を原理とし、徳を土台とする政体があるとすれば、それがほかのいかなる政体よりも万人の幸福を増すのに適していることは、思慮ある人ならだれしも認めるのではありませんか。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-012",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "6",
          "printed_page_end": "6",
          "source_sequence": 12
        }
      ],
      "source_text": "FEAR is the foundation of most governments; but is so sordid and brutal a passion, and renders men, in whose breasts it predominates, so stupid, and miserable, that Americans will not be likely to approve of any political institution which is founded on it.",
      "translation_ja": "たいていの政府は恐怖の上に成り立っています。けれども恐怖は実に卑しく野蛮な感情で、ひとたび胸を占められると、人はひどく愚かになり、惨めになります。アメリカの人々が、この感情を土台とする政治制度に賛同するとは思えません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-013",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "6",
          "printed_page_end": "6",
          "source_sequence": 13
        }
      ],
      "source_text": "HONOUR is truly sacred, but holds a lower rank in the scale of moral excellence than virtue.—Indeed the former is but a part of the latter, and consequently has not equal pretensions to support a frame of government productive of human happiness.",
      "translation_ja": "名誉はたしかに神聖なものです。しかし道徳的な価値でいえば、徳には及びません。そもそも名誉は徳の一部にすぎないのですから、人の幸福を生む統治の仕組みを支える力が、徳と肩を並べるはずはありません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-014",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "6",
          "printed_page_end": "7",
          "source_sequence": 14
        }
      ],
      "source_text": "THE foundation of every government is some principle or passion in the minds of the people.—The noblest principles and most generous affections in our nature then, have the fairest chance to support the noblest and most generous models of government.",
      "translation_ja": "どの政府も、人々の心中にある何らかの信条や感情を土台にしています。それなら、最も気高く、最も心の広い統治の仕組みを支えてくれる見込みがいちばん大きいのは、人間に備わる最も気高い信条と、最も惜しみない思いやりでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-015",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "7",
          "printed_page_end": "8",
          "source_sequence": 15
        }
      ],
      "source_text": "A MAN must be indifferent to the sneers of modern Englishmen, to mention in their company, the names of Sidney, Harrington, Locke, Milton, Nedham, Neville, Burnet, and Hoadley.—No small fortitude is necessary to confess that one has read them. The wretched condition of this country, however, for ten or fifteen years past, has frequently reminded me of their principles and reasonings. They will convince any candid mind, that there is no good government but what is Republican. That the only valuable part of the British Constitution is so; because the very definition of a Republic, is \"an Empire of Laws, and not of Men.\" That, as a Republic is the best of governments, so that particular arrangement of the powers of society, or in other words that form of government, which is best contrived to secure an impartial and exact execution of the laws, is the best of Republics.",
      "translation_ja": "いまどきのイングランド人と同席して、シドニー、ハリントン、ロック、ミルトン、ネダム、ネヴィル、バーネット、ホードリーの名を口にするには、冷笑など意に介さない人でなければなりません。読んだことがあると打ち明けるだけでも、相当の勇気が要ります。けれども私は、この十年、十五年というもの、この国の惨状を見ては、彼らの唱えた原理や議論を幾度となく思い起こしました。虚心に読めば、共和政以外によい政治はないと納得するでしょう。英国の国制のうち、値打ちのある部分も共和政的なところだけなのです。なぜなら、共和国とは、定義からして「人ではなく法が支配する国」だからです。そして、政体の中で共和政が最良であるように、共和政の中で最良なのは、法が公平かつ厳正に執行されることを最もうまく保障するように社会の諸権力を配したもの、つまり、そうした仕組みを持つ政体です。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-016",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "8",
          "printed_page_end": "8",
          "source_sequence": 16
        }
      ],
      "source_text": "OF Republics, there is an inexhaustible variety, because the possible combinations of the powers of society, are capable of innumerable variations.",
      "translation_ja": "共和政の形には際限がありません。社会の諸権力の組み合わせ方には、数え切れないほどの違いがありうるからです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-017",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "8",
          "printed_page_end": "9",
          "source_sequence": 17
        }
      ],
      "source_text": "As good government, is an empire of laws, how shall your laws be made? In a large society, inhabiting an extensive country, it is impossible that the whole should assemble, to make laws: The first necessary step then, is, to depute power from the many, to a few of the most wise and good.—But by what rules shall you choose your Representatives? Agree upon the number and qualifications of persons, who shall have the benefit of choosing, or annex this privilege to the inhabitants of a certain extent of ground.",
      "translation_ja": "よい政治が法による支配だとすれば、あなたがたの法律はどうやって作ればよいでしょう。広い土地に人々が分かれ住む大きな社会では、全員が集まって法律を作ることはできません。そこで、まず必要なのは、多くの人々の権限を、なかでも賢明で善良な少数の人に委ねることです。では、どんな規則で代表を選びますか。選挙権を享受する人の数と資格を合議で定めるか、ある広さの土地の住民にこの権利を付与するかです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-018",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "9",
          "printed_page_end": "10",
          "source_sequence": 18
        }
      ],
      "source_text": "THE principal difficulty lies, and the greatest care should be employed in constituting this Representative Assembly. It should be in miniature, an exact portrait of the people at large. It should think, feel, reason, and act like them. That it may be the interest of this Assembly to do strict justice at all times, it should be an equal representation, or in other words equal interest among the people should have equal interest in it.—Great care should be taken to effect this, and to prevent unfair, partial, and corrupt elections. Such regulations, however, may be better made in times of greater tranquility than the present, and they will spring up of themselves naturally, when all the powers of government come to be in the hands of the peoples friends. At present it will be safest to proceed in all established modes to which the people have been familiarised by habit.",
      "translation_ja": "最大の難所はこの代表議会の構成にあり、ここにこそいちばんの注意を注がねばなりません。代表議会は、人民全体の姿を縮小して忠実に写した肖像であるべきです。人々と同じように考え、感じ、推論し、行動するのでなければなりません。どんなときにも厳正な正義を行うことが議会自身の利益になるように、代表は公平でなければなりません。言い換えれば、人民の間で同じ重みを持つ利害は、議会でも同じ重みを持つべきです。このことを実現し、選挙が不公平になったり、一方に偏ったり、腐敗したりするのを防ぐには、細心の注意が要ります。もっとも、そうした規則は、今より穏やかな時代のほうがうまく定められるでしょう。統治の権限がことごとく人民の味方の手に渡れば、自然に生まれてくるものでもあります。今のところは、長年の慣行によって人々になじみのある既存の方式に、万事従うのがいちばん安全でしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-019",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "10",
          "printed_page_end": "11",
          "source_sequence": 19
        }
      ],
      "source_text": "A REPRESENTATION of the people in one Assembly being obtained, a question arises whether all the powers of government, legislative, executive, and judicial, shall be left in this body? I think a people cannot be long free, nor ever happy, whose government is in one Assembly. My reasons for this opinion are as follow.",
      "translation_ja": "一つの議会で人民を代表できたとして、次には問題があります。統治の権限のすべて、つまり立法、行政、司法をこの一機関に任せてよいのか。一つの議会に統治のすべてを委ねた人民は、長く自由でいることはできず、幸福になることは決してないと私は考えます。その理由を挙げましょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-020",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "11",
          "printed_page_end": "11",
          "source_sequence": 20
        }
      ],
      "source_text": "1. A SINGLE Assembly is liable to all the vices, follics and frailties of an individual.—Subject to fits of humour, starts of passion, flights of enthusiasm, partialities of prejudice, and consequently productive of hasty results and absurd judgments: And all these errors ought to be corrected and defects supplied by some controuling power.",
      "translation_ja": "一、一つの議会も、一個人と同じように、あらゆる悪徳、愚かさ、もろさを免れません。気まぐれを起こし、激情に駆られ、熱狂に舞い上がり、偏見に傾くため、性急な結論や不合理な判断を生みます。こうした誤りを正し、欠けたところを補うには、これを抑える別の力が必要です。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-021",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "11",
          "printed_page_end": "11",
          "source_sequence": 21
        }
      ],
      "source_text": "2. A SINGLE Assembly is apt to be avaricious, and in time will not scruple to exempt itself from burthens which it will lay, without compunction, on its constituents.",
      "translation_ja": "二、一つの議会は強欲になりがちです。やがて、自分を選んだ人々には良心の痛みもなく負担を課しながら、自分だけはそれを免れるのを何とも思わなくなるでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-022",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "12",
          "printed_page_end": "12",
          "source_sequence": 22
        }
      ],
      "source_text": "3. A SINGLE Assembly is apt to grow ambitious, and after a time will not hesitate to vote itself perpetual. This was one fault of the long Parliament, but more remarkably of Holland, whose Assembly first voted themselves from annual to septennial, then for life, and after a course of years, that all vacancies happening by death, or otherwise, should be filled by themselves, without any application to constituents at all.",
      "translation_ja": "三、一つの議会は野心を募らせがちで、しまいには自らの議決一つで任期を永久に延ばすことにもためらいがなくなります。英国の長期議会の欠点の一つがそれでしたが、もっと際立つのはオランダの例です。その議会は、議員自らの議決で、一年だった任期をまず七年にし、次いで終身にしました。さらに年月を経ると、死亡その他の理由で欠員が生じても、選挙人には一切諮らず、議員自身で後任を決めることにしたのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-023",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "12",
          "printed_page_end": "12",
          "source_sequence": 23
        }
      ],
      "source_text": "4. A REPRESENTATIVE Assembly, altho' extremely well qualified, and absolutely necessary as a branch of the legislature, is unfit to exercise the executive power, for want of two essential properties, secrecy and dispatch.",
      "translation_ja": "四、代表議会は、立法府の一翼としてはうってつけであり、絶対に欠かせません。けれども、秘密を守ることと迅速に処理すること、この二つの不可欠な性質を欠いているので、行政権の行使には向きません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-024",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "12",
          "printed_page_end": "13",
          "source_sequence": 24
        }
      ],
      "source_text": "5. A REPRESENTATIVE Assembly is still less qualified for the judicial power; because it is too numerous, too slow, and too little skilled in the laws.",
      "translation_ja": "五、代表議会は、司法権の行使にはもっと不向きです。人数が多すぎ、動きが遅すぎ、法律にも十分に通じていないからです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-025",
      "section_id": "letter",
      "kind": "list_item",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "13",
          "printed_page_end": "13",
          "source_sequence": 25
        }
      ],
      "source_text": "6. BECAUSE a single Assembly, possessed of all the powers of government, would make arbitrary laws for their own interest, execute all laws arbitrarily for their own interest, and adjudge all controversies in their own favour.",
      "translation_ja": "六、一つの議会が統治の全権を握れば、自分たちの利益のために勝手な法律を作り、自分たちの利益のためにどの法律も勝手に執行し、争いが起これば何であれ自分たちに有利な判決を下すようになるからです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-026",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "13",
          "printed_page_end": "14",
          "source_sequence": 26
        }
      ],
      "source_text": "BUT shall the whole power of legislation rest in one Assembly? Most of the foregoing reasons apply equally to prove that the legislative power ought to be more complex—to which we may add, that if the legislative power is wholly in one Assembly, and the executive in another, or in a single person, these two powers will oppose and enervate upon each other, until the contest shall end in war, and the whole power, legislative and executive, be usurped by the strongest.",
      "translation_ja": "それでは、立法の権限だけなら、一つの議会にそっくり委ねてよいでしょうか。先に挙げた理由の大半は、立法権ももっと複雑に組み立てるべきだという証明に、そのまま使えます。理由をもう一つ挙げましょう。立法権のすべてが一つの議会にあり、行政権が別の議会か一人の人物にあるとすれば、両者は張り合い、互いを弱らせるでしょう。ついには争いが戦争に至り、立法と行政の全権を、強いほうが奪ってしまうのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-027",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "14",
          "printed_page_end": "14",
          "source_sequence": 27
        }
      ],
      "source_text": "THE judicial power, in such case, could not mediate, or hold the balance between the two contending powers, because the legislative would undermine it.—And this shews the necessity too, of giving the executive power a negative upon the legislative, otherwise this will be continually encroaching upon that.",
      "translation_ja": "そのような場合、司法権には、争う二権の間に入って仲裁することも、釣り合いを保つこともできません。立法権がその足もとを掘り崩してしまうからです。このことからも、立法に対する拒否権を行政に持たせる必要が分かります。さもなければ、立法権が絶えず行政権を侵食するでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-028",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "14",
          "printed_page_end": "14",
          "source_sequence": 28
        }
      ],
      "source_text": "To avoid these dangers let a distant Assembly be constituted, as a mediator between the two extreme branches of the legislature, that which represents the people and that which is vested with the executive power.",
      "translation_ja": "この危険を避けるために、立法府の両端に立つ二つの部門、すなわち人民を代表する部門と、行政権を託された部門との間を仲立ちする、両者から距離を置いた議会を設けましょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-029",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "14",
          "printed_page_end": "15",
          "source_sequence": 29
        }
      ],
      "source_text": "LET the Representative Assembly then elect by ballot, from among themselves or their constituents, or both, a distinct Assembly, which for the sake of perspicuity we will call a Council. It may consist of any number you please, say twenty or thirty, and should have a free and independent exercise of its judgment, and consequently a negative voice in the legislature.",
      "translation_ja": "そこで、代表議会が投票によって、自分たちの中からでも、選挙人の中からでも、あるいはその双方からでもよいので、別個の議会を選出するようにします。分かりやすいよう、これを評議会と呼びましょう。人数は何人でもよく、仮に二十人か三十人としましょう。評議会は自由に、独立して自らの判断を下せるものとし、したがって立法における拒否権も持たせるべきです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-030",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "15",
          "printed_page_end": "16",
          "source_sequence": 30
        }
      ],
      "source_text": "THESE two bodies thus constituted, and made integral parts of the legislature, let them unite, and by joint ballot choose a Governor, who, after being stripped of most of those badges of domination called prerogatives, should have a free and independent exercise of his judgment, and be made also an integral part of the legislature. This I know is liable to objections, and if you please you may make him only President of the Council, as in Connecticut: But as the Governor is to be invested with the executive power, with consent of Council, I think he ought to have a negative upon the legislative. If he is annually elective, as he ought to be, he will always have so much reverence and affection for the People, their Representatives and Councillors, that although you give him an independent exercise of his judgment, he will seldom use it in opposition to the two Houses, except in cases the public utility of which would be conspicuous, and some such cases would happen.",
      "translation_ja": "こうして二つの議院を作り、いずれも立法府の不可欠な構成部分としたうえで、両院が一堂に会し、合同投票で知事を選ぶことにしましょう。知事からは、大権と呼ばれる支配のしるしの大半を取り去ったうえで、自由に、独立して判断を下せるようにし、知事もまた立法府の不可欠な構成部分とします。これに異論があるのは承知しています。お望みなら、コネティカットのように、知事を評議会の議長にとどめてもよいでしょう。しかし知事には、評議会の同意のもとで行政権を行使する役目を託すのですから、立法に対する拒否権を持たせるべきだと私は考えます。しかるべき制度として毎年選挙を受けるようにすれば、知事は人民と、その代表議員、評議員に対して、いつも厚い敬意と親愛を抱くでしょう。独立して自ら判断できるとしても、公益にかなうことがだれの目にも明らかな場合でなければ、両院に逆らってその権限を使うことはめったにないはずです。そして、そういう場合は実際に起こりうるのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-031",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "16",
          "printed_page_end": "17",
          "source_sequence": 31
        }
      ],
      "source_text": "IN the present exigency of American affairs, when, by an act of Parliament we are put out of the royal protection, and consequently discharged from our allegiance; and it has become necessary to assume government for our immediate security, the Governor, Lieutenant-Governor, Secretary, Treasurer, Commissary, AttorneyGeneral, should be chosen by joint ballot, of both Houses. And these and all other elections, especially of Representatives and Councillors, should be annual, there not being in the whole circle of the sciences, a maxim more infallible than this, \"Where annual elections end, there slavery begins.\"",
      "translation_ja": "いまアメリカは切迫した事態にあります。英国議会の法律によって私たちは国王の保護の外に置かれ、したがって忠誠を尽くす義務からも解かれました。目の前の安全を守るため、自ら統治の任に当たることが必要になったのです。このような時には、知事、副知事、書記官、財務官、兵站官、法務長官は両院の合同投票で選ぶのがよいでしょう。これらをはじめ、あらゆる選挙、とりわけ代表議員と評議員の選挙は毎年行うべきです。あらゆる学問を見渡しても、これほど間違いのない格言はありません。「年ごとの選挙が終わるところに、隷属が始まる。」",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-032",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "17",
          "printed_page_end": "17",
          "source_sequence": 32
        }
      ],
      "source_text": "THESE great men, in this respect, should be, once a year",
      "translation_ja": "こうした重職に就く人々も、この点では、一年に一度、こうならなくてはいけません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-033",
      "section_id": "letter",
      "kind": "verse",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "17",
          "printed_page_end": "17",
          "source_sequence": 33
        }
      ],
      "source_text": "\"Like bubbles on the sea of matter borne,\n\"They rise, they break, and to that sea return.\"",
      "translation_ja": "「万物の海に運ばれる泡さながら、\n浮かんでは、はじけて、その海にかえる。」",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-034",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "17",
          "printed_page_end": "18",
          "source_sequence": 34
        }
      ],
      "source_text": "This will teach them the great political virtues of humility, patience, and moderation, without which every man in power becomes a ravenous beast of prey.",
      "translation_ja": "こうすることで、謙虚さ、忍耐、節度という、政治にとって大切な徳が身につきます。これらがなければ、権力の座にある者はだれもが、獲物をむさぼる野獣と化してしまうのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-035",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "18",
          "printed_page_end": "18",
          "source_sequence": 35
        }
      ],
      "source_text": "THIS mode of constituting the great offices of state will answer very well for the present, but if, by experiment, it should be found inconvenient, the legislature may at its leisure devise other methods of creating them, by elections of the people at large, as in Connecticut, or it may enlarge the term for which they shall be chosen to seven years, or three years, or for life, or make any other alterations which the society shall find productive of its ease, its safety, its freedom, or in one word, its happiness.",
      "translation_ja": "国の重職をこのように定めるやり方は、当面は十分に役に立つでしょう。けれども、実際に試して不便と分かったなら、立法府は時を見て別の選任方法を考えればよいのです。コネティカットのように人民全体の選挙によってもよいでしょうし、任期を七年あるいは三年に延ばしても、終身にしてもよいでしょう。そのほかにも、暮らしの安らぎ、安全、自由、ひと言でいえば幸福を増すと社会が認める変更なら、何でも加えてよいのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-036",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "18",
          "printed_page_end": "19",
          "source_sequence": 36
        }
      ],
      "source_text": "A ROTATION of all offices, as well as of Representatives and Councillors, has many advocates, and is contended for with many plausible arguments. It would be attended no doubt with many advantages, and if the society has a sufficient number of suitable characters to supply the great number of vacancies which would be made by such a rotation, I can see no objection to it, These persons may be allowed to serve for three years, and then be excluded three years, or for any longer or shorter term.",
      "translation_ja": "代表議員や評議員を含め、すべての官職を一定の周期で交替させることには、支持者が多く、もっともな論拠も数多く挙げられています。たしかに利点はいくつもあるでしょう。交替のたびに数多くの空席ができますが、それを埋めるのにふさわしい人物が社会に十分いるなら、私は反対する理由を見いだせません。たとえば三年は勤められるが、次の三年はその職に就けない、としてもよい。期間はもっと長くても短くてもかまいません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-037",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "19",
          "printed_page_end": "19",
          "source_sequence": 37
        }
      ],
      "source_text": "ANY seven or nine of the legislative Council may be made a Quorum, for doing business as a Privy Council, to advise the Governor in the exercise of the executive branch of power, and in all acts of state.",
      "translation_ja": "立法を担う評議会のうち、だれでも七人、あるいは九人を定足数とし、その人数がそろえば枢密評議会として事務を執り、行政権の行使や政務全般について知事に助言できるようにしてよいでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-038",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "19",
          "printed_page_end": "20",
          "source_sequence": 38
        }
      ],
      "source_text": "THE Governor should have the command of the militia, and of all your armies. The power of pardons should be with the Governor and Council.",
      "translation_ja": "民兵と、あなたがたのすべての軍隊は、知事の指揮下に置くべきです。恩赦の権限は知事と評議会に属するものとします。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-039",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "20",
          "printed_page_end": "20",
          "source_sequence": 39
        }
      ],
      "source_text": "JUDGES, Justices and all other officers, civil and military, should be nominated and appointed by the Governor, with the advice and consent of Council, unless you choose to have a government more popular; if you do, all officers, civil and military, may be chosen by joint ballot of both Houses, or in order to preserve the independence and importance of each House, by ballot of one House, concurred by the other. Sheriffs should be chosen by the freeholders of counties—so should Registers of Deeds and Clerks of Counties.",
      "translation_ja": "裁判官、治安判事をはじめ、その他の文武の官職に就く者はすべて、評議会の助言と同意を得て、知事が指名し、任命すべきです。もっと民意を直接反映する政体をお望みなら、文武の官吏をすべて両院の合同投票で選んでもよい。あるいは、各院の独立と重みを保つため、一院の投票で選び、他院が同意する方式でもよいでしょう。各郡の保安官は、その郡に自由保有地を持つ人々が選ぶべきです。不動産証書の登記官と郡の書記官も同様です。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-040",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "20",
          "printed_page_end": "20",
          "source_sequence": 40
        }
      ],
      "source_text": "ALL officers should have commissions, under the hand of the Governor and seal of the Colony.",
      "translation_ja": "すべての官吏には、知事が署名し、植民地の公印を押した任命状を持たせるべきです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-041",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "21",
          "printed_page_end": "22",
          "source_sequence": 41
        }
      ],
      "source_text": "THE dignity and stability of government in all its branches, the morals of the people and every blessing of society, depends so much upon an upright and skillful administration of justice, that the judicial power ought to be distinct from both the legislative and executive, and independent upon both, that so it may be a check upon both, as both should be checks upon that. The Judges therefore should always be men of learning and experience in the laws, of exemplary morals, great patience, calmness, coolness and attention. Their minds should not be distracted with jarring interests; they should not be dependent upon any man, or body of men. To these ends they should hold estates for life in their offices, or in other words their commissions should be during good behaviour, and their salaries ascertained and established by law. For misbehaviour the grand inquest of the Colony, the House of Representatives, should impeach them before the Governor and Council, where they should have time and opportunity to make their defence, but if convicted should be removed from their offices, and subjected to such other punishment as shall be thought proper.",
      "translation_ja": "統治のあらゆる部門の威厳と安定も、人々の道徳も、社会がもたらす一切の恩恵も、裁きが公正に、しかも手際よく行われるかどうかに大きく左右されます。だからこそ、司法権は立法権とも行政権とも区別され、いずれからも独立していて、両者を抑えられるのでなければなりません。両者もまた、司法権を抑えられるべきです。それゆえ裁判官には、法律に通じ、実務の経験を積み、身の処し方は模範的で、辛抱強く、穏やかで冷静に、細かな点まで目を配れる人をつねに選ぶべきです。相争う利害によって心を乱されてはなりませんし、どんな個人にも団体にも依存してはなりません。そのためには、官職は終身その人のものとする、言い換えれば、非行のないかぎり任にとどまり、俸給は法律ではっきり定めて保障するのがよいでしょう。非行があったときは、植民地の大陪審にあたる代表議会が、知事と評議会の前で当人を弾劾すべきです。そこでは弁明のための時間と機会が与えられねばなりませんが、有罪と決まれば罷免し、そのほかにも適当と認められる処罰を科すべきです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-042",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "22",
          "printed_page_end": "23",
          "source_sequence": 42
        }
      ],
      "source_text": "A MILITIA LAW requiring all men, or with very few exceptions, besides cases of conscience, to be provided with arms and ammunition, to be trained at certain seasons, and requiring counties, towns, or other small districts to be provided with public stocks of ammunition and entrenching utensils, and with some settled plans for transporting provisions after the militia, when marched to defend their country against sudden invasions, and requiring certain districts to be provided with field pieces, companies of matrosses, and perhaps some regiments of light horse, is always a wise institution, and in the present circumstances of our country indispensible.",
      "translation_ja": "民兵法を設けることは、いつの時代にも賢明であり、わが国の現状では欠かせません。良心に基づく例外と、ほかにごく少数の例外を別にして、男子には全員、武器と弾薬を備えて定期の訓練を受けることを義務づけます。郡や町などの小さな地区には、弾薬と土塁を築く道具を公の備えとして置き、不意の侵入から国を守るために民兵が出動する際の糧食輸送について、あらかじめ計画を定めておくよう求めます。特定の地区には、野砲と砲兵補の中隊、それに場合によっては軽騎兵の連隊もいくつか備えるよう求めるのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-043",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "23",
          "printed_page_end": "23",
          "source_sequence": 43
        }
      ],
      "source_text": "LAWS for the liberal education of youth, especially of the lower class of people, are so extremely wise and useful, that to a humane and generous mind, no expence for this purpose would be thought extravagant.",
      "translation_ja": "若者、とりわけ社会の下層にいる若者に広く教養を身につけさせる法律は、このうえなく賢明で有益です。情け深く心の広い人なら、この目的のためにいくら費やしても、浪費だとは思わないでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-044",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "23",
          "printed_page_end": "24",
          "source_sequence": 44
        }
      ],
      "source_text": "THE very mention of sumptuary laws will excite a smile. Whether our countrymen have wisdom and virtue enough to submit to them I know not. But the happiness of the people might be greatly promoted by them, and a revenue saved sufficient to carry on this war forever. Frugality is a great revenue, besides curing us of vanities, levities and fopperies which are real antidotes to all great, manly and warlike virtues.",
      "translation_ja": "奢侈禁止法などと口にしただけで、笑われるでしょう。わが同胞に、それに従えるほどの分別と徳が備わっているかは、私にも分かりません。しかし、こうした法によって人民の幸福は大いに増すかもしれませんし、この戦争をいつまでも続けられるだけの財源も、節約によって得られるかもしれません。倹約はそれ自体が大きな収入です。そのうえ、立派で雄々しく、戦いに臆しない徳という徳を骨抜きにしてしまう、虚栄や軽薄、見せかけのおしゃれの病からも、私たちを治してくれます。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-045",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "24",
          "printed_page_end": "24",
          "source_sequence": 45
        }
      ],
      "source_text": "BUT must not all commissions run in the name of a King? No. Why may they not as well run thus, \"The Colony of ____ to A. B. greeting, and be tested by the Governor?",
      "translation_ja": "だが、任命状はすべて国王の名で発しなければならないのではないか、ですって。いいえ。「何々植民地より、某殿に挨拶を送る」と記し、知事が認証するのでも、同じようによいではありませんか。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-046",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "24",
          "printed_page_end": "24",
          "source_sequence": 46
        }
      ],
      "source_text": "WHY may not writs, instead of running in the name of a King, run thus, \"The Colony of ____ to the Sheriff,\" &c. and be tested by the Chief Justice.",
      "translation_ja": "令状も、国王の名で発する代わりに「何々植民地より、保安官に告ぐ」云々と記し、首席裁判官が認証して、何がいけないでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-047",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "25",
          "printed_page_end": "25",
          "source_sequence": 47
        }
      ],
      "source_text": "WHY may not indictments conclude, \"against the peace of the Colony of ____ and the dignity of the same?\"",
      "translation_ja": "起訴状の結びを「何々植民地の平穏および同植民地の尊厳に反する」として、何がいけないでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-048",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "25",
          "printed_page_end": "26",
          "source_sequence": 48
        }
      ],
      "source_text": "A CONSTITUTION, founded on these principles, introduces knowledge among the People, and inspires them with a conscious dignity, becoming Freemen. A general emulation takes place, which causes good humour, sociability, good manners, and good morals to be general. That elevation of sentiment, inspired by such a government, makes the common people brave and enterprizing. That ambition which is inspired by it makes them sober, industrious and frugal. You will find among them some elegance, perhaps, but more solidity; a little pleasure, but a great deal of business— some politeness, but more civility. If you compare such a country with the regions of domination, whether Monarchical or Aristocratical, you will fancy yourself in Arcadia or Elisium.",
      "translation_ja": "これらの原理に立つ国制は、人民の間に知識を広め、自由人にふさわしく、自らの尊厳を自覚する心を育てます。だれもが互いに見習い競うようになり、快活さ、人づきあいのよさ、よい作法に、よい品行が広く行き渡ります。このような統治が心を高めることで、普通の人々も勇敢になり、進んで事を起こすようになります。また、そこから生まれる向上心のおかげで、身を慎み、勤勉に働き、倹約するようになります。そうした人々には、いくらかの優雅さも見られましょうが、いっそう目立つのは堅実さです。楽しみ事も少しはありますが、仕事ははるかに盛んです。洗練された物腰も多少はありますが、それ以上に人に対する礼節があります。こうした国を、君主であれ貴族であれ誰かが支配者として君臨する国々と比べてみれば、まるでアルカディアの牧歌郷か、エリュシオンの楽園にいるようにお感じになるでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-049",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "26",
          "printed_page_end": "26",
          "source_sequence": 49
        }
      ],
      "source_text": "IF the Colonies should assume governments separately, they should be left entirely to their own choice of the forms, and if a Continental Constitution should be formed, it should be a Congress, containing a fair and adequate Representation of the Colonies, and its authority should sacredly be confined to these cases, viz. war, trade, disputes between Colony and Colony, the Post-Office, and the unappropriated lands of the Crown, as they used to be called.",
      "translation_ja": "植民地がそれぞれ自ら統治に乗り出すなら、政体の選択はまったく各植民地の自由に任せるべきです。そして大陸全体に通じる国制を作るなら、各植民地が公平かつ十分に代表される大陸会議という形にすべきです。その権限は、戦争、通商、植民地間の紛争、郵便事業、それに、かつての呼び方でいえば王領のうちまだ払い下げられていない土地、これらの事項に厳格に限らねばなりません。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-050",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "27",
          "printed_page_end": "27",
          "source_sequence": 50
        }
      ],
      "source_text": "THESE Colonies, under such forms of government, and in such a union, would be unconquerable by all the Monarchies of Europe.",
      "translation_ja": "これらの植民地がこうした政体を持ち、そのように結ばれたなら、ヨーロッパの君主国が束になっても征服できないでしょう。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-051",
      "section_id": "letter",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "27",
          "printed_page_end": "28",
          "source_sequence": 51
        }
      ],
      "source_text": "YOU and I, my dear Friend, have been sent into life, at a time when the greatest lawgivers of antiquity would have wished to have lived.—How few of the human race have ever enjoyed an opportunity of making an election of government more than of air, soil, or climate, for themselves or their children.—When! Before the present epocha, had three millions of people full power and a fair opportunity to form and establish the wisest and happiest government that human wisdom can contrive? I hope you will avail yourself and your country of that extensive learning and indefatigable industry which you possess, to assist her in the formations of the happiest governments, and the best character of a great People.—For myself, I must beg you to keep my name out of sight, for this feeble attempt, if it should be known to be mine, would oblige me to apply to myself those lines of the immortal John Milton, in one of his sonnets,",
      "translation_ja": "親愛なる友よ、あなたも私も、古代の偉大な立法者たちがこの時に生きたかったと願ったであろう時代に、この世に生を受けました。吸う空気や足もとの土、明け暮れする土地の気候を選べないのと同じで、自分や子どもたちのために政体を選ぶ機会を得た人が、人類のうちにいったいどれほどいたでしょう。人知のかぎりを尽くして最も賢明で、最も幸福をもたらす政府を考え出し、樹立する、そのための全権とまたとない機会を三百万人もの人々が手にしたことが、今の時代より前にいつあったでしょうか。あなたに備わった広い学識と倦むことのない勤勉を、ご自身のためにも国のためにもどうか役立て、最も幸福をもたらす政府を築き、偉大な国民にふさわしい最良の気風を育てる力になっていただきたいのです。私自身については、どうか名前を伏せておいてください。このささやかな試みが私のものと知られれば、不朽の詩人ジョン・ミルトンが、あのソネットの一つに書いた数行を、わが身に引き当てずにはいられなくなるでしょうから。",
      "translation_status": "reviewed"
    },
    {
      "id": "adams-052",
      "section_id": "letter",
      "kind": "verse",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "evans-tcp-n11581",
          "precision": "page",
          "printed_page": "28",
          "printed_page_end": "28",
          "source_sequence": 52
        }
      ],
      "source_text": "\"I did but teach the age to quit their cloggs\n\"By the plain rules of ancient Liberty,\n\"When lo! a barbarous noise surrounded me,\n\"Of owls and cuckoos, asses, apes and dogs.\"",
      "translation_ja": "「古の自由の、分かりやすい掟に従って、\n足かせを外せと、この世の人に教えたばかりなのに、\n見よ、たちまち私を取り巻いた、この荒々しいわめき声、\nフクロウにカッコウ、ロバにサルに犬どもの声。」",
      "translation_status": "reviewed"
    },
    {
